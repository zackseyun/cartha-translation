  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: zh_hans
  text: 你们要检验自己，看看自己是否在信仰中[a]；要察验自己。难道你们不认识自己吗？难道不知道耶稣基督[b]在你们里面[c]吗？除非你们经不起检验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在信仰中”既可指仍处于基督信仰之中，也可指具有真实的信心。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”。
    reason: translation_note
  - marker: c
    text: 或译：“在你们中间”。
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: 检验
  rationale: 此处指通过自我测试来判断真伪，不是“试探”。“检验”既自然，也保留评估意味。
- source_word: ἐν τῇ πίστει
  choice: 在信仰中
  rationale: 保留带定冠词的表达及其开放性，既可指处于基督信仰之中，也可涉及是否具有真实的信心。
- source_word: δοκιμάζετε
  choice: 察验
  rationale: 与前面的“检验”近义呼应，同时略带经过审察、辨明是否合格或真实的意味。
- source_word: ἐπιγινώσκετε ἑαυτούς
  choice: 你们自己不清楚
  rationale: 将反身成分自然融入“你们自己”，表达对自身状况的充分认识，避免生硬直译为“不认识你们自己”。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣基督
  rationale: 采用现代汉语中通行且庄重的称谓；脚注说明“基督”的称号含义，以保留其弥赛亚意涵。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 自我省察的语境首先支持基督在信徒里面的临在；希腊语也可能有群体性的“在你们中间”之意，列入脚注。
- source_word: εἰ μήτι ἀδόκιμοί ἐστε
  choice: 除非你们经不起检验
  rationale: “除非”保留反问后的例外语气；“经不起检验”与本节两个检验动词形成词义呼应，也避免“被弃绝”等可能附带的后期神学含义。
theological_decisions:
- issue: ἐν τῇ πίστει 的范围
  choice: 在信仰中
  alternative: 有真实的信心；持守基督信仰
  rationale: 原文可关乎留在基督信仰的领域之内，也可关乎个人信心的真实性；正文不替读者消除这层张力。
- issue: Χριστός 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: “耶稣基督”是现代汉语最通行的表达，而“基督”本身是称号，不只是姓名的一部分；以脚注点明其意为“弥赛亚”。
- issue: ἐν ὑμῖν 的空间或群体含义
  choice: 在你们里面
  alternative: 在你们中间
  rationale: 上下文的自我检验支持内在临在，但复数代词与介词结构也允许群体性理解，故以脚注保留。
- issue: ἀδόκιμοι 是否具有预定论或终局弃绝含义
  choice: 经不起检验
  alternative: 不合格；未蒙认可
  rationale: 该词在此首先与检验、察验形成对照；译文不额外导入“永远被弃绝”等超出本句的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“检验／察验／经不起检验”形成贯穿全句的语义链；避免过度教会化或带有特定宗派色彩的术语。
