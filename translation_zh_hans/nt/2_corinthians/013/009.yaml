  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: zh_hans
  text: 因为我们软弱而你们刚强的时候，我们就欢喜。我们也为这事祷告：愿你们恢复健全[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愿你们成熟”，或“愿你们得以完全”。原文可指恢复、装备，或使某事物达到合宜的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: 我们就欢喜
  rationale: 现在时表达保罗一贯或当前的态度；“欢喜”自然且保留较强的喜乐语气。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表达解释或理由；在现代汉语中“因为”比直译为“原来”更清楚自然。
- source_word: ὅταν
  choice: ……的时候
  rationale: 与虚拟语气连用，表达一般性的时间情形；汉语用“……的时候”即可自然呈现。
- source_word: ἀσθενῶμεν
  choice: 我们软弱
  rationale: 保留其可指能力、处境或外在表现之弱的宽泛含义，不限定为身体或修辞方面。
- source_word: δυνατοὶ ἦτε
  choice: 你们刚强
  rationale: 与“软弱”构成直接对照；“刚强”比“强大”更适合描述群体的属灵或道德状态，同时不将该含义定死。
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: 我们也为这事祷告
  rationale: εὔχομαι在此按向神祈求理解；前置的τοῦτο以“为这事”保留强调。
- source_word: τὴν ὑμῶν κατάρτισιν
  choice: 愿你们恢复健全
  rationale: κατάρτισις指使某事物归于合宜、完整的状态；结合本段纠正与挽回的语境，“恢复健全”兼顾修复和达到应有状态的含义。
theological_decisions:
- issue: κατάρτισις所表达的保罗牧养目标
  choice: 愿你们恢复健全
  alternative: 愿你们成熟；愿你们得以完全；愿你们被调整到合宜的状态
  rationale: 原词可指修复、装备或使之完整。正文采用“恢复健全”，贴合哥林多教会需要纠正、回归正轨的语境，又避免导入无罪完全等特定教义；其他可行含义留在脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“软弱—刚强”保留原文鲜明对照；第二句用愿望式表达祷告内容，使汉语自然，同时保留κατάρτισις的语义张力。
