  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: zh_hans
  text: 愿主耶稣受膏者[a]的恩典、上帝的爱和圣灵的团契[b]，与你们众人同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“耶稣基督”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“与圣灵相通”或“有分于圣灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗祝福语中的常用词；“恩典”既自然庄重，也保留了此词所承载的神学分量，比单纯译作“恩惠”更合适。
- source_word: κύριος
  choice: 主
  rationale: 此处是用于耶稣的称号；“主”是现代汉语中准确、通行的对应表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣受膏者
  rationale: Ἰησοῦ是名字，音译为“耶稣”；Χριστοῦ在此具有称号含义，译作“受膏者”可直接呈现其意义，而传统译法“耶稣基督”收入脚注。
- source_word: ἀγάπη
  choice: 爱
  rationale: “爱”是此处最自然且语义充分的现代汉语表达。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 保留属格结构，不在正文中擅自限定为“上帝对人的爱”，从而保留原文可能包含的丰富含义。
- source_word: κοινωνία
  choice: 相交
  rationale: “相交”兼具关系与共同参与的含义，适合此祝福语，也不把该词缩窄为某种组织性“团契”活动。
- source_word: τοῦ ἁγίου πνεύματος
  choice: 圣灵的
  rationale: 采用现代汉语中对所指神圣位格的通行译法，并保留原文属格结构。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: μετά加属格表示同在或伴随；补出祝愿式的“愿”，并用“众人”明确表达πάντων所强调的全体性。
theological_decisions:
- issue: Χριστοῦ作为耶稣称号的译法
  choice: 受膏者
  alternative: 基督
  rationale: 原词在此不只是类似姓氏的固定成分，而是具有“受膏者”的称号意义。正文译出称号含义，脚注保留传统且广为人知的“基督”。
- issue: κοινωνία τοῦ ἁγίου πνεύματος的含义
  choice: 圣灵的相交
  alternative: 与圣灵相通；有分于圣灵
  rationale: 原属格结构可以涵盖圣灵所成就的相交、与圣灵相通以及共同有分于圣灵等彼此相关的理解。正文保留较宽的表达，脚注列出主要可能译法，不强行消除神学张力。
- issue: τοῦ θεοῦ中属格所表达的爱
  choice: 上帝的爱
  alternative: 上帝对你们的爱
  rationale: 直译属格可自然理解为源于上帝的爱，同时避免加入原文没有明说的宾语“你们”。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“愿……同在”补足希腊文祝福句中省略的动词；“你们众人”保留原文对全体收信人的明确强调。所有脚注标记均紧随其对应词组。
