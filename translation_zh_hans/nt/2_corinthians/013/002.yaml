  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: zh_hans
  text: 我从前已经说过；如今虽不在你们那里，仍预先告诉你们，正如我第二次在你们那里时所做的那样。我对那些先前犯了罪的人和所有其余的人说：如果我再来[a]，我必不饶过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按上下文更明确地译为“如果我第三次来”。希腊文直译是“如果我再来”，而上下文表明这是在第二次到访之后的另一次来访。
    reason: 说明上下文所指的具体访问次数，同时保留正文较贴近原文的表达。
lexical_decisions:
- source_word: προείρηκα
  choice: 我从前已经说过
  rationale: 完成时表示先前说过的话至今仍然有效；译文保留“说过”，不把上下文中的警告意味直接写进词义。
- source_word: προλέγω
  choice: 又预先说明
  rationale: 该动词意为“预先说”；“说明”在现代汉语中自然，并与前面的“说过”保持语义联系，同时不把它强化为专门术语式的“警告”。
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: 如今不在你们那里……就像我第二次在你们那里时所说的一样
  rationale: 原文结构紧凑，对照保罗第二次亲自在场与如今不在场的处境；补出“你们那里”和“所说的”使汉语关系清楚，但不改变时间次序。
- source_word: τοῖς προημαρτηκόσιν
  choice: 那些先前犯了罪的人
  rationale: 完成时分词指先前犯罪而现已被提及的人；译法不预断他们后来是否悔改。
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: 其余所有人
  rationale: 同时表达 λοιποί 的“其余的人”和 πᾶσιν 的全面范围。
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: 如果我再来
  rationale: 按希腊文直译为再次前来；上下文可能具体指第三次到访，但正文保留原句的表达方式，并在脚注交代。
- source_word: οὐ φείσομαι
  choice: 必不宽容
  rationale: φείδομαι 指宽容、饶过或克制严厉处置；汉语可自然省略宾语，而前文已说明警告所针对的人。
theological_decisions:
- issue: 保罗所警告的范围
  choice: 警告同时向那些先前犯了罪的人和其余所有人发出；若再来，他不会宽容。
  alternative: 只把“不宽容”限定于先前犯了罪的人，或把它泛化为未说明对象的使徒权威宣告。
  rationale: 与格短语并列提到两组人，后面的内容是向两组人所说；译文不进一步规定“不宽容”将采取何种教会纪律形式。
- issue: 再次来访的次数
  choice: 正文译作“再来”。
  alternative: 正文明确译作“第三次来”。
  rationale: ἐὰν ἔλθω εἰς τὸ πάλιν 本身表达“如果我再来”；虽然上下文表明这将是第三次到访，正文不以解释取代原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不在你们那里”与“在你们那里”比单用“缺席／在场”更自然；分为两句以理清原文紧凑的时间对照和受话对象。脚注标记置于“再来”之后，因为注释直接解释该短语。
