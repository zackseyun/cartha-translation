  source_fidelity: 译文准确表达了γάρ的解释性连接、δυνάμεθα的能力陈述，以及“反对真理／支持真理”的基本对照。但“只能”在汉语中容易被理解为额外明说的排他限制；原文以ἀλλά形成对比，宜以“而是”直接呈现，不必增添“只”。
  naturalness: “做任何敌对真理的事”略显生硬；“做任何反对真理的事”更合现代标准汉语，也更自然地对应κατά。“而是支持真理”简洁清楚，并保留原文紧凑的对举。
  terminology: “真理”保留了τῆς ἀληθείας的开放性和上下文的神学分量，不应擅自窄化为某项教义。“支持真理”可恰当表达ὑπέρ的维护、站在其一边之意。
  issues:
