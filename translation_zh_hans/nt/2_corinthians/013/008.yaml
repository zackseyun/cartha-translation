  - severity: low
    issue: “敌对真理的事”搭配略不自然。
    rationale: 现代汉语通常说“反对真理的事”；此表达同样准确传达κατά的反对、对抗含义。
  revised_text: 因为我们不能做任何反对真理的事，而是支持真理。
