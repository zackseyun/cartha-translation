source:
  edition: SBLGNT
  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: zh_hans
  text: 因为我们不能做任何反对真理的事，而是支持真理。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……不能
  rationale: γάρ承接上文，说明前一句的理由；“因为”在现代汉语中自然地表达这种解释关系。οὐ否定后面的能力。
- source_word: δυνάμεθά
  choice: 我们不能
  rationale: δύναμαι表示能力或可能性；“不能”简洁自然，也保留了原文所说的无能为力。
- source_word: τι
  choice: 任何……的事
  rationale: τι处于否定结构中，表示没有任何事情例外；这样译符合现代汉语习惯。
- source_word: κατὰ τῆς ἀληθείας
  choice: 敌对真理
  rationale: κατά加属格表示反对、敌对。“敌对真理”准确传达其对抗意味，同时保留“真理”的确定性和神学广度。
- source_word: ἀλλὰ
  choice: 只……
  rationale: ἀλλά构成鲜明反差。汉语用“不能……只能……”自然再现原文的对偶；“只”是这一对比结构所要求的语用表达，并非另加一种行为限制。
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: 支持真理
  rationale: ὑπέρ在这里表示站在一方、为其效力。“支持真理”比孤立的“为真理”更清楚，同时准确保留与“敌对真理”的反向关系。
theological_decisions:
- issue: “真理”的所指
  choice: 保留为“真理”，不限定为某一项教义命题
  alternative: 福音的真理；真实的事
  rationale: 上下文包含福音和上帝真实作为的意涵，但原文τῆς ἀληθείας本身范围较广。保留“真理”可维持原文的神学张力和修辞力度。
- issue: “不能”的性质
  choice: 按原文保留能力陈述，不解释为道德禁令或绝对形而上命题
  alternative: 我们不可敌对真理；我们在任何意义上都绝不可能损害真理
  rationale: δυνάμεθα直接谈“能够”，但本节未明确说明这种不能究竟是使命约束、使徒职分的性质，还是更广义的原则，因此不在译文中替作者作出限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不能……只能……”清楚呈现希腊文的紧凑对偶；“敌对／支持”让普通读者易于把握方向性的反差。脚注标记已置于正文。
