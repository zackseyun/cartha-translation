  rationale: 将“敌对”调整为更自然的“反对”，并将“只能”改为“而是”，以忠实呈现原文“不能……，而是……”的对比，避免将排他性限制表达得超过原文。此节无需脚注；“真理”和“支持”在正文中已足以保留原文的语义范围。
