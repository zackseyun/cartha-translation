  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: zh_hans
  text: 作为相应的回报[a]——我把你们当作儿女说这话——你们也要敞开胸怀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回报”也可译作“回应”“报偿”或“相等的交换”；这里指以相应的态度作出回应，并非金钱上的报酬。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们也要变得宽广”；在这里指敞开自己，以情意接纳对方。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: 作为同样的回报
  rationale: ἀντιμισθία表示回应、回报或相应的交换；αὐτήν强调“同样的”。这里不是索取金钱报酬，而是要求哥林多人以同样敞开的情意回应。“作为同样的回报”既保留互惠意味，也避免商业化理解。δέ仅作轻微承接，汉语在此无需另译为“但”或“现在”。
- source_word: ὡς τέκνοις λέγω
  choice: 我像对儿女一样说
  rationale: τέκνοις直指“儿女／孩子”，原文没有物主代词。此译保留保罗亲切的长辈口吻，却不明加“我的”。
- source_word: πλατύνθητε
  choice: 敞开胸怀
  rationale: 该命令式字面为“被拓宽／变宽”。结合上文关于内心狭窄与宽广的比喻，“敞开胸怀”以自然现代汉语表达情感和接纳上的开放，同时在脚注交代字面形象。
- source_word: καὶ ὑμεῖς
  choice: 你们也要
  rationale: καί与强调性的ὑμεῖς突出相应回应：保罗一方已经向他们敞开，他们也应如此。
theological_decisions:
- issue: 是否把保罗对听众的亲属称呼明确译成“我的儿女”
  choice: 译作“我像对儿女一样说”，不加“我的”
  alternative: “我把你们当作自己的儿女说”或“我对我的儿女说”
  rationale: 上下文确有属灵父亲般的亲密语气，但希腊文没有物主代词；保留非领属表达可避免增加原文未明说的关系限定。
- issue: 是否在正文补出“心／胸怀”
  choice: 采用“敞开胸怀”
  alternative: “你们也要变得宽广”或较字面的“你们也要被拓宽”
  rationale: 原文维持“变宽”的隐喻，直接照译在现代汉语中生硬且意义不明。结合6:11–12的内心语境，“敞开胸怀”是必要而克制的语义明示，并未把开放限定为某一教义性含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。破折号保留插入语的口语亲切感；“儿女”比“儿童”更适合亲属式称呼。“敞开胸怀”使原文的宽广隐喻在汉语中清楚可感。
