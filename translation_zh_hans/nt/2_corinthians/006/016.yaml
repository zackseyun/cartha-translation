  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: zh_hans
  text: 神的殿和偶像有什么相合之处[a]呢？因为我们是永生神的殿。正如神所说：“我要住在他们中间[b]，在他们中间行走；我要作他们的神，他们要作我的子民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相合”也可译作“协议”“一致”或“共同之处”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要住在他们里面。”希腊语介词可表示“在……里面”或“在……中间”；这里群体性的盟约语境支持“在他们中间”。
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: 相合
  rationale: 该词指同意、协调或一致；“相合”自然地表达神的殿与偶像彼此不能协调、共存，并与上下文一连串反问相称。
- source_word: ναῷ / ναὸς
  choice: 殿
  rationale: ναός特指神圣的殿或圣所，而非整个殿宇范围；“神的殿”是现代汉语中清楚、庄重且具有宗教意涵的表达。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 这里指受敬拜的异教神像，而非中性的形象；“偶像”保留了原文的宗教批判意味。
- source_word: ζῶντος
  choice: 永生
  rationale: 原意为“活着的”，修饰“神”，并与无生命的偶像形成对照；“永生神”是自然且庄重的汉语圣经用语。
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: 正如神所说
  rationale: “正如”保留καθώς的比较和引证作用；“所说”以自然汉语引出后面的经文。
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: 我要住在他们中间
  rationale: ἐν既可表达“在……里面”，也可依群体语境表达“在……中间”；这里复数对象、盟约公式及下句“在他们中间行走”支持群体性的译法。
- source_word: ἐμπεριπατήσω
  choice: 在他们中间行走
  rationale: 保留神与其子民同在的生动拟人图景，也与前句形成自然的平行。
- source_word: ἔσομαι αὐτῶν θεός
  choice: 我要作他们的神
  rationale: 这是盟约关系的固定表达；“作他们的神”自然地传达关系性的属格。
- source_word: λαός
  choice: 子民
  rationale: 在盟约公式中，λαός指属于神的群体；“子民”比一般的“人民”更准确地体现这种归属关系。
theological_decisions:
- issue: 群体性的圣殿意象
  choice: 我们是永生神的殿
  alternative: 我们是永生神的一座殿
  rationale: ναός虽无冠词，但在表语结构中具有性质兼确定的意义；这里指共同体整体具有神之殿的身份，不宜加入“一座”而弱化这一认同。
- issue: 神居住之处的引文措辞
  choice: 我要住在他们中间
  alternative: 我要住在他们里面
  rationale: 希腊语ἐν αὐτοῖς容许两种理解。此处引文面向群体，又与“在他们中间行走”平行，因此正文采用“中间”；脚注保留“里面”这一真实的词义可能，避免排除内住的理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“殿”“永生神”“子民”保留经文的宗教与盟约语域；反问句和引文的平行结构尽量贴近希腊文，同时避免生硬直译。脚注标记放在各自所解释的词句之后。
