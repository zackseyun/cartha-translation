  text: through honor and dishonor[a], through slander and praise; regarded as deceivers and yet true[c][b],
translation:
  language: zh_hans
  text: 在尊荣与羞辱中[a]，在恶评与好评中[b]；被看作是迷惑人的，却是真实的[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”或译“荣耀”；这里与“羞辱”相对，可能侧重公开的尊重和社会评价。
    reason: lexical_alternative
  - marker: b
    text: “恶评……好评”或译“毁谤……赞誉”，也可译“恶名……美名”。
    reason: lexical_alternative
  - marker: c
    text: 直译“像迷惑人的，却是真实的”。这里是把别人对保罗及其同工的看法，与他们实际的情形相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: 经历／遭受／得到
  rationale: διά与所有格连用，在这一连串对偶中表示事奉所经历的处境。按各宾语自然搭配分别译出，比机械重复“通过”更符合现代汉语，同时保留两组平行结构。
- source_word: δόξης
  choice: 尊荣
  rationale: δόξα在此与ἀτιμία相对，主要指公开的社会评价和尊重；“尊荣”既保留“荣耀”的词义范围，也适合此处语境。
- source_word: ἀτιμίας
  choice: 羞辱
  rationale: 与“尊荣”形成清楚的反义对照，并表达公开受轻视、失去体面的处境。
- source_word: δυσφημίας
  choice: 恶评
  rationale: 该词可指毁谤，也可指坏名声或负面评价。“恶评”保留这一区间，不把含义过早限定为蓄意诽谤。
- source_word: εὐφημίας
  choice: 好评
  rationale: 作为δυσφημία的对应词，指正面的言论或声誉；“好评”与“恶评”形成简洁、自然的对偶。
- source_word: ὡς
  choice: 被看作是
  rationale: 语境中的ὡς引出别人对保罗及其同工的看法。“被看作是”明确这是外界判断，而不是承认他们确实迷惑人。
- source_word: πλάνοι
  choice: 迷惑人的
  rationale: 在这里指被指责为使人走入歧途、欺骗他人的人。“迷惑人的”比“骗子”稍宽，贴近该词使人迷误的含义。
- source_word: ἀληθεῖς
  choice: 真诚的
  rationale: ἀληθής可表示真实、可信或诚实。这里与“迷惑人的”相对，“真诚的”自然表达他们并不欺骗，同时保留真实可信的意味。
theological_decisions:
- issue: 末组对偶是否明确区分外界看法与实际情形
  choice: 译为“被看作是迷惑人的，却是真诚的”
  alternative: 较直译为“像是迷惑人的，却是真实的”
  rationale: ὡς在此引出保罗和同工所受的判断，而ἀληθεῖς形成反转。明确“被看作”可避免把“迷惑人的”当作事实，同时保留受误解与实际真实之间的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。前两组使用“经历／遭受／得到”顺应汉语搭配，并以“也”维持对偶节奏；末组用“被看作……却……”清楚呈现原文的悖论式反差。本节在原段落中句子尚未结束，因此以分号收束。
