id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: zh_hans
  text: 因为他说[a]：“在悦纳的时候，我垂听了你；在拯救的日子，我帮助了你。”看哪，现在正是蒙悦纳的时候；看哪[b]，现在正是拯救的日子！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “垂听了你”也可译作“恩允地听了你”；原词可表示带着接纳或回应而听。
    reason: lexical_alternative
  - marker: b
    text: “现在正是蒙悦纳的时候……现在正是拯救的日子”也可理解为“现在是一个蒙悦纳的时机……一个拯救的日子”。希腊文没有冠词，中文正文保留了自然且未过度限定的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: 因为他说
  rationale: γάρ承接上文，说明保罗劝勉的根据；λέγει以现在时引出经文，并保留经文中上帝亲自说话的语感。
- source_word: Καιρῷ δεκτῷ
  choice: 在悦纳的时候
  rationale: καιρός指合宜、特定的时机，δεκτός指蒙接纳、得恩待；“悦纳的时候”自然庄重，也保留以赛亚书引文的恩惠语境。
- source_word: ἐπήκουσά σου
  choice: 我垂听了你
  rationale: ἐπακούω不只是听见，也常含有带着接纳而听、作出回应的意味；“垂听”在现代中文经文语体中清楚表达上帝恩允地听。
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: 在拯救的日子
  rationale: σωτηρία可指拯救、救援或救恩；“拯救”在引文语境中保留行动性，又不将所指限缩为某一套神学术语。希腊文无冠词，但中文通常无需借助不定量词表达这一点。
- source_word: ἐβοήθησά σοι
  choice: 我帮助了你
  rationale: βοηθέω指帮助、援助；直译为“帮助”简明自然，不额外加入“解救”或“应允”等解释。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的语气词，“看哪”保留原文两次重复所形成的庄严强调和劝告力度。
- source_word: νῦν
  choice: 现在正是
  rationale: νῦν强调当下；加入“正是”符合汉语表达，并凸显保罗把引文应用于眼前时刻的紧迫性。
- source_word: καιρὸς εὐπρόσδεκτος
  choice: 蒙悦纳的时候
  rationale: εὐπρόσδεκτος表示很受欢迎、完全可蒙接纳，与前面的δεκτός构成词义呼应；“蒙悦纳”保留这种联系。中文不强制标示定指或不定指，因而避免替原文过度确定。
- source_word: ἡμέρα σωτηρίας
  choice: 拯救的日子
  rationale: 忠实保留“日子”和“拯救”的结构；中文零限定形式可容纳希腊语无冠词短语的语义开放性。
theological_decisions:
- issue: 末句的καιρὸς εὐπρόσδεκτος与ἡμέρα σωτηρίας应否明确译成定指或不定指
  choice: 用中文零限定结构“蒙悦纳的时候／拯救的日子”，并以“现在正是”自然表达当前应用
  alternative: 译作“这个蒙悦纳的时刻／这拯救的日子”或“一个蒙悦纳的时候／一个拯救的日子”
  rationale: 希腊文两处均无冠词，而现代汉语不要求用冠词区分定指与不定指。零限定结构既自然，也避免把原文静默限定为唯一固定的末世时段，或误译成众多同类日子中的任意一个。
- issue: λέγει的隐含主语是上帝还是经文
  choice: 译作个人主语“他说”
  alternative: 译作非人格的“经上说”
  rationale: 引文中的第一人称发言者具有上帝说话的语感；“他说”保留这种神学纹理，又没有在正文中额外补出“上帝”。
- issue: σωτηρία应译作“救恩”还是“拯救”
  choice: 译作“拯救”
  alternative: 译作“救恩”
  rationale: “拯救”既可涵盖上帝施行救助的行动，也可承载保罗语境中的救恩含义；它较少将以赛亚引文预先压缩成抽象教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“垂听”和“看哪”略带典雅色彩，但仍为普通读者熟悉；两次“看哪”及“现在正是”保留原文的重复、强调和紧迫感。所有脚注标记均置于正文对应位置。
