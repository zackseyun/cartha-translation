base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: zh_hans
  text: 哥林多人哪，我们的口已向你们敞开；我们的心已宽广。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: 口
  rationale: 保留“口”这一身体意象，并与下句的“心”形成修辞对应；其语境含义是坦率、毫无保留地说话。
- source_word: ἀνέῳγεν
  choice: 已经敞开了
  rationale: “敞开”既保留原文的开启隐喻，也以“已经……了”体现完成时所表达的既成行动及其当前结果。
- source_word: πρὸς ὑμᾶς
  choice: 向你们
  rationale: 自然表达言语朝向收信人的意思，也适合与“敞开了口”搭配。
- source_word: Κορίνθιοι
  choice: 哥林多人哪
  rationale: 体现原文呼格的直接呼唤；“哪”传达保罗在此处恳切而亲近的语气。
- source_word: καρδία
  choice: 心
  rationale: “心”是现代汉语中自然且传统的对应词，可指人的感情与内在态度，并保留身体隐喻。
- source_word: πεπλάτυνται
  choice: 宽广了
  rationale: 直接保留“使宽、拓宽”的空间隐喻；在汉语中“心宽广”可理解为情感毫无局促、充分接纳对方，同时“了”体现完成时的结果状态。
theological_decisions:
- issue: 保罗以“口”和“心”的身体意象表达坦率与情感上的开放
  choice: 正文保留“敞开了口”和“心也宽广了”两重隐喻
  alternative: “我们已经坦率地对你们说话，并且向你们敞开了心”
  rationale: 原文没有直接把两个隐喻解释成“坦率说话”和“敞开心扉”；保留其形象可保存保罗的修辞张力，并避免把解释写入正文。
- issue: πεπλάτυνται所表达的开放程度
  choice: 译作“宽广了”，不限定为单纯的爱、接纳或宽容
  alternative: “我们的心向你们完全敞开”
  rationale: 该词在语境中可能涵盖深厚感情、接纳和不受拘束的开放；较直译的表达保留这些含义之间的空间。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“哥林多人哪”保留呼格的恳切语气；正文有意保留“口—心”“敞开—宽广”的平行身体与空间意象。
