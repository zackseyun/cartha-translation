  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: zh_hans
  text: 弥赛亚与彼利亚之间有什么和谐呢？信的人与不信的人又有什么共同的份呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼利亚”：希腊文作 Βελιάρ（Beliar）；常见的另一形式是“彼列”（Belial）。
    reason: 说明正文所依据的希腊文专名形式，并标明读者较熟悉的替代形式。
lexical_decisions:
- source_word: συμφώνησις
  choice: 和谐
  rationale: 该词表示协调、一致或相容；“和谐”既保留其关系性的意象，也适合本节连续反问的修辞。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处 Χριστός 在与彼列的对举中具有称号意味，译作“弥赛亚”可直接表达其称号含义。
- source_word: Βελιάρ
  choice: 彼列
  rationale: 作为专名处理；“彼列”是现代中文圣经语境中可辨识的传统音译。原文希腊形式 Βελιάρ 与常见的 Βελίαλ/Belial 形式有别，故在脚注说明。
- source_word: μερίς
  choice: 共同之分
  rationale: μερίς 指所分得的一份、份额；在 πιστός 与 ἄπιστος 的对比中，“共同之分”自然表达二者是否共享同一份额或利益，同时不把含义限缩为一般交往。
- source_word: πιστῷ
  choice: 信的人
  rationale: 该形容词作名词使用，指相信的人；“信的人”清楚自然，并与“不信的人”形成对应。
- source_word: ἀπίστου
  choice: 不信的人
  rationale: 在与 πιστός 的明确对举中，主要表示不信者；避免译成“不忠的人”而引入这里未必强调的忠诚含义。
- source_word: πρὸς
  choice: 与……之间
  rationale: 与 συμφώνησις 连用，表达双方之间的关系，中文宜译为“与……之间”。
- source_word: μετὰ
  choice: 与
  rationale: 表示关联或共同参与；中文反问句中用“与”简洁自然。
- source_word: δὲ / ἢ
  choice: 呢？……又……呢？
  rationale: δὲ 承接前文一连串反问，ἢ 引出下一项并列反问；中文以句末“呢”和第二问的“又”再现递进、并列的修辞节奏。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里该词在“弥赛亚—彼列”的概念性对举中作为称号使用；采用“弥赛亚”保留其称号义，而不将其仅作为姓名式称谓处理。
- issue: Βελιάρ 的身份与形式
  choice: 将其作为专名音译为“彼列”
  alternative: 彼利亚／比利亚；或在正文中直接解释为撒但
  rationale: 正文只保留专名，不进一步断定或展开其身份，以免加入原文没有明说的解释；异体形式在脚注交代。
- issue: μερίς 所指的共同关系
  choice: 共同之分
  alternative: 关系；相交；共同产业
  rationale: 原词可指份额或所分得的一分。译文保留这种份额意象及共同参与的含义，不把它具体化为某一种教会关系、财产或救恩论概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两句反问保持简洁、对称；“和谐”对应声音协调的词义色彩，“共同之分”保留 μερίς 的份额意象。正文中的脚注标记 [a] 与脚注完全对应。
