  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: zh_hans
  text: 以纯洁，以知识，以忍耐，以恩慈，以圣灵[a]，以真诚的爱，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁的心灵”，若这里所说的是人的圣洁性情，而不是圣灵。
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: 纯洁
  rationale: ἁγνότης表示广义的道德纯净或清白；“纯洁”自然、宽泛，不把含义局限于贞洁。
- source_word: γνώσει
  choice: 知识
  rationale: γνῶσις在此指知识，也可涵盖事奉中的实际与属灵认识；“知识”保留了原词的宽泛性。
- source_word: μακροθυμίᾳ
  choice: 恒久忍耐
  rationale: μακροθυμία指面对人或困境时长久忍耐；“恒久忍耐”比单说“忍耐”更充分体现持续承受的意味。
- source_word: χρηστότητι
  choice: 恩慈
  rationale: χρηστότης表示仁厚、和善及善待他人的品格；“恩慈”在庄重而通俗的经文语体中贴切。
- source_word: πνεύματι ἁγίῳ
  choice: 圣灵
  rationale: 按保罗通常用法及上下文，最可能指上帝的圣灵；中文专名“圣灵”无需冠词即可明确表达。
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: 真诚的爱
  rationale: ἀνυπόκριτος意为不虚假、不伪善；“真诚的爱”自然表达没有伪装的爱。
- source_word: ἐν
  choice: 以
  rationale: 重复的ἐν在这串列举中可表示凭借、方式或所处领域；统一译作“以”既适合中文，也保留原文反复推进的修辞节奏。
theological_decisions:
- issue: πνεύματι ἁγίῳ的所指
  choice: 正文译作“圣灵”，指上帝的灵
  alternative: “圣洁的心灵”，指人的圣洁性情或态度
  rationale: 保罗书信中的惯常用法和本段语境较支持神圣之灵这一所指；但希腊语形式本身容许将其理解为人的圣洁心灵，因此以脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。连续使用“以”对应重复的ἐν，保留排比节奏；“纯洁”“知识”“恒久忍耐”“恩慈”“圣灵”“真诚的爱”均避免过度解释。
