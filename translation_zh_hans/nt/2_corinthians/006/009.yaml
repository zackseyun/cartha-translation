  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: zh_hans
  text: 似乎不为人所知，却是人所熟知的[a]；似乎濒临死亡，但看哪，我们还活着；似乎受管教[b]，却没有被杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为人所熟知”或译“被人认出”；希腊语可着重指得到充分的认识或确认，而不只是广为人知。
    reason: lexical_alternative
  - marker: b
    text: “受管教”或译“受惩戒”或“受训练”；希腊语既可指纠正性的管教，也可指塑造人的训练。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 似乎
  rationale: 在三个并列分句中重复保留保罗所列举的表象或处境；“似乎”在现代汉语中比机械重复“如同”更自然，也不把这些苦难说成纯属虚假。
- source_word: ἀγνοούμενοι
  choice: 不为人所知
  rationale: 保留被动含义，并与后面的“为人所熟知”形成简洁的悖论式对照。
- source_word: ἐπιγινωσκόμενοι
  choice: 为人所熟知
  rationale: 表达被认识、被确认的含义，同时与“不为人所知”自然对应；脚注保留“被认出”这一较强调确认或认可的可能译法。
- source_word: ἀποθνῄσκοντες
  choice: 濒临死亡
  rationale: 传达现在分词所描写的持续临死处境，并避免与后面的“被处死”混同。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文突然唤起注意的语气，也符合庄重而可懂的经文语体。
- source_word: ζῶμεν
  choice: 我们还活着
  rationale: “还”自然呈现与濒死处境之间的强烈反差，而不改变“活着”的基本陈述。
- source_word: παιδευόμενοι
  choice: 受管教
  rationale: “管教”既可指纠正性的惩戒，也可包含塑造和训练，适合保留原词在苦难语境中的语义张力。
- source_word: μὴ θανατούμενοι
  choice: 没有被处死
  rationale: 保留被动结构，并与前面的“濒临死亡”区分；用“处死”准确表达实际致死而非一般受苦。
theological_decisions:
- issue: παιδευόμενοι所指的苦难性质
  choice: 受管教
  alternative: 受惩戒／受训练
  rationale: “受管教”允许读者理解为纠正、塑造或训练，却不擅自断定这是神的刑罚，也不消除原文在使徒受苦与蒙保全之间的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话，以三个重复的“似乎”保留原文排比和悖论结构；用分号划分三组对照，并保留“看哪”的修辞突显。
