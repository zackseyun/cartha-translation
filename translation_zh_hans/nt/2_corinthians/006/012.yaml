  source_fidelity: 草案准确表达首句的否定和限制并非来自保罗一方，也正确把σπλάγχνα理解为比喻性的内在情感。然而，“心胸狭窄”在现代汉语中通常是对人气量小、不能容人的品格评语；它虽保留空间意象，却比原文“在你们自己的深层情感中受限制”更强，也没有清楚保留第二处被动动词“受限制”的对应。
  naturalness: “你们并不是受我们限制”自然清楚。“你们自己的心胸狭窄”虽通顺，但容易被读成泛泛的道德批评。改为“你们在自己的感情上受到限制”较明确地表达本节关系语境中的情感回应，同时保持庄重、现代的书面语体。
  terminology: “感情”在此指σπλάγχνα所表达的深层情感、爱意或怜悯，不指短暂情绪。以“在……上受到限制”对应两处στενοχωρεῖσθε，避免将第二处改写为独立的性格断语。
