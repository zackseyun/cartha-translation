  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: zh_hans
  text: 你们并不是受我们限制[a]；你们受限制，是在自己的感情上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在我们里面并不受限制；你们却在自己的心肠里受限制。”
    reason: 保留ἐν的较字面表达，并在两分句均对应重复的στενοχωρεῖσθε；“心肠”按原文指深层情感，而非字面器官。
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: 受……限制／心胸狭窄
  rationale: 该动词本义是处在狭窄空间中，引申为受限制。首句译为“受我们的限制”，自然表达限制并非来自保罗一方；次句结合“内心、情感”这一语境译为“心胸狭窄”，保留同一词根的狭窄意象，并使中文关系清楚。
- source_word: ἐν ἡμῖν
  choice: 受我们的
  rationale: 介词短语在此表示限制所在或其相关来源；现代汉语用“受我们的限制”比直译“在我们里面”更清楚。脚注保留较形式对应的译法。
- source_word: δὲ
  choice: 而是
  rationale: 这里不仅是一般转折，也把限制所在从“我们”转到“你们自己的内心”；“而是”适合中文的否定—纠正结构。
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: 你们自己的心胸
  rationale: σπλάγχνα本指内脏，常引申为深层情感、怜爱或内心。“心胸”既是自然现代汉语，又能与“狭窄”搭配，表达他们在情感回应和接纳上的局促。
- source_word: οὐ
  choice: 并不是
  rationale: 明确否定首句，并与后面的“而是”构成自然的对比句式。
theological_decisions:
- issue: σπλάγχνα的比喻意义
  choice: 理解为哥林多人内在的情感容量和接纳之心，以“心胸”表达
  alternative: 按字面译为“内脏”，或较抽象地译为“感情”
  rationale: 上下文讨论保罗对他们敞开心、他们却未同样回应，因此所指不是身体器官，而是内在情感与关系上的开放程度。“心胸”保留身体性空间隐喻，同时不把含义限定为单纯情绪。
- issue: 重复动词的修辞对应
  choice: 以“受……限制”和“心胸狭窄”分别呈现，使两句共享“限制／狭窄”的意象
  alternative: 两处机械地统一译为“受限制”
  rationale: 希腊文重复στενοχωρεῖσθε形成鲜明对照。中文若两处完全相同会使“在你们的内心受限制”生硬；当前译法保留同一狭窄意象，也让第二句自然清楚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心胸狭窄”在现代中文中容易理解；此处不是一般品格评断，而是按上下文指出他们对保罗一方的情感和接纳受到局限。
