  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: zh_hans
  text: “我要作你们的父亲；你们要作我的儿子和女儿，”全能的主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: 我要作你们的父亲
  rationale: εἶναι配合与格及εἰς加宾格，在这里表达立约关系。汉语“作你们的父亲”自然、庄重，也保留了关系性的表达。
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: 你们要作我的
  rationale: 保留显明的主语“你们”和将来意义，并与前句形成彼此对应的立约关系。
- source_word: υἱοὺς καὶ θυγατέρας
  choice: 儿子和女儿
  rationale: 原文分别明确提到男性与女性后代；译作“儿子和女儿”比概括为“儿女”或“孩子”更完整地保存这种强调。
- source_word: λέγει
  choice: 这样说
  rationale: 用汉语常见的引语宣告格式表达希腊文现在时的权威性引述公式。
- source_word: κύριος παντοκράτωρ
  choice: 全能的主
  rationale: κύριος在此是神圣称号，译为“主”；παντοκράτωρ译为“全能的”，不引入原文没有的“万军之”等其他旧约称号。
theological_decisions:
- issue: 是否概括亲子关系中的性别用语
  choice: 儿子和女儿
  alternative: 儿女；孩子
  rationale: 保罗所引文字明确并列υἱούς与θυγατέρας。分别译出“儿子和女儿”，保存了女儿也被明确纳入这一应许的强调。
- issue: 如何翻译κύριος παντοκράτωρ这一神圣称号
  choice: 全能的主
  alternative: 主，全能者；万军之主
  rationale: “全能的主”直接对应两个希腊词，且符合现代汉语表达；“万军之主”会引入本节希腊文本并未使用的另一称号。
- issue: 父子关系公式是身份陈述还是立约关系表达
  choice: 作你们的父亲／作我的儿子和女儿
  alternative: 成为你们的父亲／成为我的儿子和女儿
  rationale: 原文结构表达彼此归属的立约关系，并不要求把重点限定为某一时刻发生的身份转变；“作”既自然，又保留这种持续的关系含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作”比“成为”更适合此处彼此对应的关系公式；末句用“全能的主这样说”呈现经文宣告语气。
