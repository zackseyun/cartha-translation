  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: zh_hans
  text: 像是忧愁，却总是喜乐；像是贫穷，却使许多人富足；像是一无所有，同时拥有一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: 像是
  rationale: 保留原文三次重复的比较性框架，同时不把后半句直接解释成对前半句的否定，使每组悖论的张力得以保留。
- source_word: λυπούμενοι
  choice: 忧愁
  rationale: 简洁表达持续处于忧伤中的状态，不限定忧愁的原因，也不否认其真实性。
- source_word: ἀεὶ δὲ χαίροντες
  choice: 却总是喜乐
  rationale: “总是”对应ἀεί，“却”体现δέ的转折；“喜乐”在现代中文中自然且适合经文语体。
- source_word: πτωχοὶ
  choice: 贫穷
  rationale: 直接对应物质匮乏或卑微处境，不强化为“赤贫”。
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: 却使许多人富足
  rationale: 准确表达使役动词πλουτίζω，并不在正文中限定富足是物质上的还是属灵的。
- source_word: μηδὲν ἔχοντες
  choice: 一无所有
  rationale: 自然凝练地表达“什么也没有”，并与末句形成鲜明对照。
- source_word: πάντα κατέχοντες
  choice: 拥有一切
  rationale: κατέχω在这里表示持有、拥有；“拥有一切”既自然，也保留原文概括性的绝对表达。
theological_decisions:
- issue: “使许多人富足”和“拥有一切”所指的性质
  choice: 正文按原文直译，不明确加上“属灵上”或“在基督里”等限定。
  alternative: 在正文中译作“使许多人属灵富足”以及“在基督里拥有一切”。
  rationale: 上下文与保罗书信整体虽支持属灵层面的理解，但希腊原文本身没有明说这些限定。保留开放表达，更能呈现保罗刻意形成的悖论与神学张力。
- issue: 三次ὡς是否表示前半句仅是假象
  choice: 译作“像是”，保留比较或被看待的意味，但不明说前半句不真实。
  alternative: 译作“看似”，将每组关系明确处理为表象与真实的对比。
  rationale: 忧愁与贫穷可能是使徒真实经历，而不只是表象；较开放的措辞可避免消解“忧愁却喜乐”等并存关系。
translation_notes:
  register: 采用现代、凝练而庄重的中文，以三个结构平行的分句再现原文的节奏。重复“像是……却……”以保持修辞框架；末句依原文用“却”表达意义上的强烈反差，虽希腊文此处连接词为καί。
