  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: zh_hans
  text: 我们不在任何事上给人造成绊倒的机会，免得这项事奉受到指责。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: 不给人绊倒的缘由
  rationale: 该组合表示不给任何导致跌倒、冒犯或受阻的因由。“绊倒的缘由”保留原文的隐喻，也符合现代汉语表达；补出“人”是汉语语法上的自然处理，并未限定具体对象。
- source_word: ἐν μηδενί
  choice: 在任何事上
  rationale: 表达范围或处境，强调毫无例外；“在任何事上”自然且保留其全面性。
- source_word: διδόντες
  choice: 给
  rationale: 保留分词 διδόντες 的基本意义，并与“缘由”自然搭配。根据上下文以“我们”承接保罗及其同工。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁表达原文否定性的目的或预期结果，不强行消除目的与结果之间的张力。
- source_word: μωμηθῇ
  choice: 受到指责
  rationale: 准确表达被动语态以及“被责难、被挑剔”的含义，同时避免把语义过度收窄为正式定罪。
- source_word: ἡ διακονία
  choice: 这服事
  rationale: 此处指保罗及其同工所承担的使徒性服务。“服事”既保留服务行动的含义，也避免使读者误以为专指后世制度化的教会职务；“这”按语境指当前所说的服事。
theological_decisions:
- issue: διακονία 所指的范围
  choice: 译作“这服事”，指保罗和同工履行使命的服事
  alternative: 译作“这事工”或“这职分”
  rationale: 上下文关注他们作为上帝仆人的行为及使命。“服事”能够涵盖使徒性事奉，却不把原词限定为制度化职位；“事工”也是可能译法。
- issue: προσκοπήν 的隐喻力度
  choice: 保留为“绊倒的缘由”
  alternative: 译作“冒犯人的事”或“妨碍”
  rationale: 原词可指绊倒、冒犯或障碍。保留绊倒隐喻，可维持其客观障碍与使人跌倒两方面的语义，不把它仅解释为主观不悦。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不给人绊倒的缘由”保留希腊文意象；“受到指责”清楚呈现被动语态。主句补出“我们”，使承接上下文的分词结构在中文中完整自然。
