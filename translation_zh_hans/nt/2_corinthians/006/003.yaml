  terminology: “服事”可译 διακονία，但“这服事”略显口语且指示词在本节无明确对应；“这项事奉”较庄重、自然，也能指保罗及同工的使徒性服务，避免将其制度化为后世职位。“事奉”在宗教文本中是既定且易懂的用语。
