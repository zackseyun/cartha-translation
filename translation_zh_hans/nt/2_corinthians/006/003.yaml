- from: 我们在任何事上都不给人绊倒的缘由[a]，免得这服事受到指责[b]。
  to: 我们不在任何事上给人造成绊倒的机会，免得这项事奉受到指责。
  rationale: 修订仅处理汉语搭配与指代自然度，不改变原文含义。“造成绊倒的机会”保留 προσκοπή 的绊倒意象及其可指障碍、冒犯缘由的范围；“免得”继续表达 ἵνα μὴ 的否定目的/结果取向；“受到指责”保留 μωμηθῇ 的被动意义。脚注锚点继续分别附于 προσκοπή 与 μωμηθῇ 所在短语。
