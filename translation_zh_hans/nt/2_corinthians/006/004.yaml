source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: zh_hans
  text: 反而在各样的事上，表明自己是上帝的仆役：以极大的坚忍，经历患难、困苦和窘迫，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用“在……”：在极大的坚忍中，在患难中，在困苦中，在窘迫中。也可译作：“在极大的坚忍、患难、困苦和窘迫中。”
    reason: 说明希腊语重复介词的结构；正文采用较自然的现代汉语，同时保留另一种更贴近形式的译法。
lexical_decisions:
- source_word: ἀλλ’
  choice: 反而
  rationale: 承接前文的否定陈述，转而说明保罗及其同工正面的行事方式；“反而”能自然表达此处的强烈转折。
- source_word: ἐν παντί
  choice: 在各样的事上
  rationale: 保留希腊语短语的广泛含义，可涵盖各种境遇，也可指各方面，不将其范围限定得过窄。
- source_word: συνιστάνοντες ἑαυτούς
  choice: 表明自己
  rationale: συνίστημι在此不仅可指自我举荐，也可指借行为显明或证明身份；结合下文苦难清单，“表明自己”更自然，也避免现代汉语中“推荐自己”的误解。
- source_word: ὡς θεοῦ διάκονοι
  choice: 是上帝的仆役
  rationale: διάκονοι强调为上帝服事的人；“仆役”保留服务含义，又不强加正式教会职分的色彩。
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: 以极大的坚忍
  rationale: ὑπομονή指在压力和试炼下持守、忍耐；“坚忍”比一般的“耐心”更能体现持续承受的力量。介词ἐν在此自然译作方式性的“以”。
- source_word: θλίψεσιν
  choice: 患难
  rationale: 表达外在压力和苦难，是现代中文圣经语体中清楚而有分量的用词。
- source_word: ἀνάγκαις
  choice: 困苦
  rationale: 此处指逼迫人的艰难处境，而非单纯的需要；“困苦”自然概括这种受迫和艰辛。
- source_word: στενοχωρίαις
  choice: 窘迫
  rationale: 该词本有被挤压、陷入狭窄困境之意；“窘迫”体现走投无路般的压力，并与“患难、困苦”有所区别。
theological_decisions:
- issue: 事奉语境中διάκονοι的身份含义
  choice: 上帝的仆役
  alternative: 上帝的执事／上帝的服事者
  rationale: 上下文着重保罗及其同工为上帝效劳并在苦难中显明身份，并不要求把διάκονοι理解为正式教会职分。“仆役”既表达归属与服事，也避免引入后来的制度性含义。
- issue: συνιστάνοντες是否译为自我举荐
  choice: 表明自己
  alternative: 举荐自己／证明自己
  rationale: 哥林多后书确有“举荐”的主题，但本节紧接一连串事奉表现和苦难经历，兼有显明、证实身份的意味；“表明”保留这种语义张力，而不暗示仅凭言辞自荐。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“仆役”比“执事”较少制度性含义；“坚忍”体现试炼中的持守。正文以“经历”统摄后三项，使苦难清单在汉语中自然，并用脚注交代原文反复出现ἐν的句法。
