base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: zh_hans
  text: 遭受鞭打，被囚禁，身陷骚乱，辛苦劳作，彻夜不眠，禁食[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禁食”也可能指因缺少食物而挨饿；原文在此可作不同理解。
    reason: 保留νηστείαις既可指禁食、也可能按患难语境指缺食的解释空间，避免正文单方面限定。
lexical_decisions:
- source_word: πληγαῖς
  choice: 遭受鞭打
  rationale: 指身体遭受击打或鞭打；结合保罗所列使徒患难，以自然中文表达其被动承受。
- source_word: φυλακαῖς
  choice: 被囚禁
  rationale: φυλακή在此指监禁、牢狱经历；用动词性短语与整列中文节奏协调。
- source_word: ἀκαταστασίαις
  choice: 身陷骚乱
  rationale: 该词可指骚乱、动乱或混乱；此处与鞭打、监禁并列，较可能指外在群体骚乱，同时保留置身其中而未必参与作乱的含义。
- source_word: κόποις
  choice: 辛苦劳作
  rationale: κόπος强调令人疲惫的劳苦，不只是一般工作。
- source_word: ἀγρυπνίαις
  choice: 彻夜不眠
  rationale: 指不睡、警醒或失眠的夜晚；本处患难清单重在长时间不得睡眠的经历。
- source_word: νηστείαις
  choice: 忍受饥饿
  rationale: νηστεία可指宗教性禁食，也可指缺食挨饿；在患难清单中语义可能偏向缺乏食物，但原文仍有禁食的可能，故以脚注说明。
theological_decisions:
- issue: νηστείαις是自愿禁食还是非自愿挨饿
  choice: 正文译作“忍受饥饿”，并以脚注保留“禁食”的可能
  alternative: 禁食
  rationale: 上下文列举保罗在患难中所忍受的处境，且哥林多后书11:27将饥饿、口渴与νηστείαις并列，使该词在保罗用法中的范围不宜武断限定；正文按此处患难语境处理，同时不消除宗教性禁食的解释。
translation_notes:
  register: 采用现代、庄重而易懂的短语排比，省略重复译出ἐν，以汉语并列结构呈现。因提供脚注，正文相应应写为“忍受饥饿[a]，”。
