  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: zh_hans
  text: 不要与不信的人同负不相配的轭[b]。因为，公义[a]与不法有什么共同之处呢？光与黑暗有什么相交呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
  - marker: b
    text: “同负不相配的轭”描绘不同类或不匹配的牲畜被套在同一个轭下的景象；参申命记22:10。
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: 不要……
  rationale: μή加现在时命令式表达禁止；汉语以“不要”自然传达劝阻之意，而后接“同负……轭”已包含进入或处于该状态的含义。
- source_word: ἑτεροζυγοῦντες
  choice: 同负不相称的轭
  rationale: 保留异类或不匹配者共负一轭的具体比喻，也避免把其适用范围缩限为某一种关系。
- source_word: ἀπίστοις
  choice: 与不信的人
  rationale: 指不信者；“与”符合轭的共同关系，并以现代汉语清楚表达。
- source_word: μετοχὴ
  choice: 相干
  rationale: 此处指共同参与或共有关系；反问句“有什么相干”自然简洁，并与下句“相通”形成近义平行。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: 保留δικαιοσύνη在保罗书信中兼具正直、公义等内涵的凝练表达；脚注注明“公义”这一可行译法。
- source_word: ἀνομίᾳ
  choice: 不法
  rationale: 直接表现无视或违背律法、规范的状态，并与“义”构成鲜明伦理对照。
- source_word: κοινωνία
  choice: 相通
  rationale: 表达共同分享、相交或有共同关系；用于“光与黑暗”的反问自然且保留关系性。
- source_word: φωτὶ
  choice: 光
  rationale: 直译并保留保罗的象征性对照。
- source_word: πρὸς σκότος
  choice: 与黑暗
  rationale: πρός在此表示两者之间的关系；汉语用“与”最为自然。
theological_decisions:
- issue: 保罗语境中δικαιοσύνη的译法
  choice: 义
  alternative: 公义；正义
  rationale: “义”能凝练承载伦理正直及与神正确关系等可能内涵，并与“不法”形成对照；不在正文中把词义限定为社会层面的“正义”。
- issue: ἑτεροζυγοῦντες所指关系的范围
  choice: 保留“同负不相称的轭”这一比喻，不具体限定关系类型
  alternative: 不要与不信的人结成不相称的关系
  rationale: 原文使用轭的隐喻，却未在本句明确限定为婚姻、商业或其他特定关系；保留比喻可避免加入原文没有的教派性或应用性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同负不相称的轭”有意保留原文鲜明隐喻；两组反问以“相干／相通”构成自然平行。脚注标记按正文出现顺序排列为[b]、[a]，同时保留所给项目中的字母对应。
