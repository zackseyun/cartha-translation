  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: zh_hans
  text: 因此，主说：“你们要从他们中间出来，要分别出来[a]；不要触碰不洁之物[b][c]；我也必接纳你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要分别”，或“要使自己分别出来”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要触碰任何不洁净的东西。”
    reason: lexical_alternative
  - marker: c
    text: 保罗在这里呼应旧约先知的话，尤其见《以赛亚书》52:11。
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: 因此
  rationale: 承接前文并引出推论，保留原文的推论关系，同时符合现代汉语表达。
- source_word: ἐξέλθατε
  choice: 要……出来
  rationale: 表达复数命令的明确、决断语气；与“从他们中间”连用，自然呈现离开的行动。
- source_word: ἐκ μέσου αὐτῶν
  choice: 从他们中间
  rationale: 保留原文的群体内部意象，也可涵盖空间和社会关系上的分离。
- source_word: ἀφορίσθητε
  choice: 要分别出来
  rationale: 保留被动命令所强调的分别状态或结果，又避免加入原文没有明说的宗派性或禁欲性含义。
- source_word: λέγει κύριος
  choice: 主说
  rationale: 采用简洁庄重的先知宣告套语，并按新约希腊文 κύριος 译作“主”。
- source_word: ἀκαθάρτου
  choice: 不洁之物
  rationale: 将中性单数形容词实体化，保留类别性的开放所指，不限定为某一种具体物件。
- source_word: μὴ ἅπτεσθε
  choice: 不要触碰
  rationale: 符合洁净与分别语境中的接触意象；“触碰”比“沾染”更直接保留动作本身。
- source_word: κἀγὼ
  choice: 我就
  rationale: “就”自然表达命令与随后应许之间的对应关系；主语“我”保留原文的人称强调。
- source_word: εἰσδέξομαι ὑμᾶς
  choice: 接纳你们
  rationale: 表达有利、欢迎性的接受；“接纳”在现代汉语中自然庄重，也适合盟约式应许的语境。
theological_decisions:
- issue: 带有旧约背景的先知引文中 κύριος 的译法
  choice: 主
  alternative: 耶和华；主人
  rationale: 本节的新约希腊文本写作 κύριος。译作“主”既保留新约措辞，也不把旧约背景中的神名形式直接导入正文。
- issue: 分别命令的范围与力度
  choice: 要分别出来
  alternative: 要被分别出来；要使自己分别出来
  rationale: 保留原文对分别状态的明确要求，同时不把它扩展解释为与所有外人断绝来往，也不预先限定为某种宗派或禁欲实践。
- issue: 应许句与前述命令的关系
  choice: 我就接纳你们
  alternative: 我也要接纳你们
  rationale: “就”呈现引文中命令与应许的紧密对应，但不额外界定这种接纳在救恩次序上的系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知引文的命令节奏，以分号区分宣告与应许；“不洁之物”维持原文所指的开放性，不擅自具体化。
