  to: 因此，主说：“你们要从他们中间出来，要分别出来[a]；不要触碰不洁之物[b][c]；我也必接纳你们。”
  rationale: 修订以引号和冒号明确“主说”统领全段引文，并以分号保留原文连续命令与应许的节奏。“我也必接纳你们”保留 κἀγώ 的连接和强调，以及 εἰσδέξομαι 的将来应许，避免“就”带来的较强条件化表达。脚注锚点仍分别附于“分别出来”“不洁之物”，并保留旧约呼应说明。
