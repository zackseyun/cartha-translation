  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: zh_hans
  text: 以真理的话语，以神的能力，借着左右手中的公义兵器[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。
    reason: lexical_alternative
  - marker: b
    text: “左右手中的”也可译作“用于右手和左手的”。这幅图像可能表示双手都装备齐全，既能进攻，也能防御。
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: 真理的话语
  rationale: 保留属格结构及λόγος的宽广含义，既可指真实无伪的言语，也可指所宣讲的真理信息；不在正文中限定为其中一种。
- source_word: δυνάμει θεοῦ
  choice: 神的能力
  rationale: 直接表达属格关系，并与前一短语的“以……”形成排比。
- source_word: διὰ τῶν ὅπλων
  choice: 借着……兵器
  rationale: διά加属格表示手段；“借着”自然体现工具意义。ὅπλα可包括进攻和防御装备，“兵器”在此比仅指防具的“盔甲”更宽泛。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: δικαιοσύνη在保罗书信中通常译作“公义”，可涵盖正直的品行及与神相符的义；“正义”这一可能译法收入脚注。
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: 左右手中的
  rationale: 两个形容词作名词性用法，语境中自然补出“手”。此译法简洁地呈现双手持有兵器的图像，同时不进一步规定左右手各自用于进攻还是防御。
theological_decisions:
- issue: δικαιοσύνης在属灵争战意象中的含义
  choice: 公义
  alternative: 正义
  rationale: 正文采用保罗书信中较稳定且语义较宽的“公义”，避免将其缩限为社会或司法层面的“正义”；脚注保留后者，以反映原词语义范围。
- issue: 左右手兵器的象征功能
  choice: 不在正文中分别指定进攻与防御
  alternative: 将右手和左手分别解释为进攻与防御
  rationale: 经文本身只提到右边和左边，并未明确分配功能；因此保留战斗装备齐全、随时预备的整体意象，不把可能的解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以……以……借着……”保留原文连续介词短语的节奏；末尾逗号表明本节在更大句子中仍未结束。所有脚注标记均置于相关正文之后。
