  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: zh_hans
  text: 我们与他同工[a]，也劝你们不要徒然领受上帝的恩典。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们作为同工，也劝你们。”希腊文没有明说与谁同工；上下文最可能指与上帝同工。
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: 既与他同工
  rationale: 该分词表示与另一方共同工作。结合5:18—20所述上帝使人和好的行动及使徒的职分，所隐含的同工对象最可能是上帝；“同工”保留了原文的动词意味。“他”是依据上下文补出，故加注说明原文并未明说。
- source_word: δὲ
  choice: 既
  rationale: δὲ在此是轻微的承接或转折，不必译成强烈的“但是”。汉语用“既……也……”组织分词与主句，既自然，也体现句意的推进。
- source_word: καὶ
  choice: 也
  rationale: 表示在“同工”这一背景上再加上“劝”这一行动；“也”准确体现其添加作用。
- source_word: παρακαλοῦμεν
  choice: 劝
  rationale: 此处指恳切劝告或敦促。“劝”在现代汉语中清楚自然，并能保留使徒劝勉的语气。
- source_word: μὴ
  choice: 不要
  rationale: 与不定式连用构成否定劝告，汉语自然译作“不要”。
- source_word: εἰς κενὸν
  choice: 徒然
  rationale: 该习语意为没有结果、落空或归于无效。“徒然”简洁庄重，并保留原文的警戒力度。
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: 上帝的恩典
  rationale: χάρις在保罗书信中是具有重要神学分量的词，指上帝恩惠的行动和赐予；“恩典”是准确而通行的译法。属格τοῦ θεοῦ直译为“上帝的”。
- source_word: δέξασθαι
  choice: 领受
  rationale: δέχομαι意为接受、接纳。“领受”符合此处谈论上帝恩典的语域，也自然表达接受所赐之物。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数，在“劝你们不要……”的汉语结构中直接呈现。
theological_decisions:
- issue: “同工”所隐含的对象
  choice: 正文译为“与他同工”，按上下文将“他”理解为上帝。
  alternative: 可译为“我们作为同工”或“我们一同工作”，不明确说明与谁同工。
  rationale: 希腊文Συνεργοῦντες本身没有明说同工对象，因此语法上存在开放性；但紧接前文，上帝是使人和好的行动者，保罗等人则是受托劝人与上帝和好的使者（5:18—20），故上帝是最可能的隐含对象。正文采用上下文所支持的读法，同时以脚注保留原文的含混。
- issue: “徒然领受恩典”的张力
  choice: 保留“不要徒然领受”的直接警告，不解释其具体教义机制。
  alternative: 可释义为“不要让所领受的恩典失去功效”或“不要拒绝恩典”。
  rationale: 原文确实把“领受”与“徒然”并置，却没有在本节说明恩典如何可能成为徒然。直译保留保罗劝告中的神学张力，避免加入有关救恩次序、持续或失落的宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与他同工”延续教会语境中熟悉且简洁的表达；“徒然领受”略带庄重色彩，但意义清楚，并贴合保罗警告的力度。脚注明示原文歧义，避免正文补出的代词被误认为希腊文明确写出。
