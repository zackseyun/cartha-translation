id: 2CO.5.8
reference: 2 Corinthians 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: zh_hans
  text: 所以，我们坦然无惧，也更愿意离开身体，与主同住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开身体，住在主那里。”
    reason: “ἐνδημῆσαι πρὸς τὸν κύριον”可侧重与主同住，也可更具方位感地表达为住在主那里；两者都保留与“离开”相对的居所意象。
lexical_decisions:
- source_word: θαρροῦμεν
  choice: 我们坦然无惧
  rationale: 现在时直陈语气表达持续而坚定的勇气。“坦然无惧”在现代汉语中自然庄重，也与上文的语境衔接。
- source_word: δὲ
  choice: 所以
  rationale: 此处主要承接并推进5:6–7的论述，带有推论意味，而非表示强烈转折。
- source_word: καὶ
  choice: 也
  rationale: 连接“坦然无惧”与“更愿意”两个并列陈述；译作“也”符合现代汉语表达。
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: 更愿意
  rationale: εὐδοκοῦμεν与比较副词μᾶλλον合用，表达相较之下的意愿或偏好；“更愿意”准确而自然。
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: 离开身体
  rationale: ἐκδημέω本有离乡、在外之意，与下文ἐνδημέω形成成对的居所意象。“离开身体”保留比喻，同时不增添“死亡”等原文未明说的解释。
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: 与主同住
  rationale: ἐνδημέω表示在家、安居；πρός在此表达朝向并与主同在的关系。“与主同住”既保留居所意象，也符合自然汉语。
theological_decisions:
- issue: 是否把本节明确释为死亡后立刻升天的教义陈述
  choice: 保留“离开身体，与主同住”的比喻，不补入“死后”或“在天上”等说明。
  alternative: 译作“死后到天上与主同在”。
  rationale: 经文的确指向离开身体而与主同在，但并未在本节直接使用“死亡”或“天上”等词。译文应保留原文的表达范围与神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“坦然无惧”表达持续的勇气；“离开身体，与主同住”保留希腊文成对的离乡／居家意象，避免过度释义。
