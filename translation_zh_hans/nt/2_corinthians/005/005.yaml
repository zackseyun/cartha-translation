  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: zh_hans
  text: 那位使我们为这件事作好准备的，就是神；他赐给我们圣灵的定金[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定金”也可译作“保证”“订金”或“首期款”。
    reason: lexical_alternative
  - marker: b
    text: 这句话可能指圣灵本身就是定金，也可能指神赐下一个定金，以保证圣灵将要成全的事。
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: 使……做好准备
  rationale: 该词在上下文中指神有目的地塑造、装备信徒，使他们适合第1—4节所说将来的生命状态。“使……做好准备”既表达这种指向目标的作为，也符合现代汉语习惯。
- source_word: εἰς αὐτὸ τοῦτο
  choice: 正是为这件事
  rationale: 保留原文对前述盼望之事的强调，并让指代继续由上下文界定。
- source_word: θεός
  choice: 神
  rationale: 直接表达原文的主语辨认：使我们做好准备的那一位就是神。
- source_word: δοὺς
  choice: 他赐给
  rationale: 将不定过去时分词按汉语习惯译为承接前句的分句，保留神主动赐予的意思。
- source_word: ἀρραβῶνα
  choice: 定金
  rationale: “定金”保留商业比喻，既表示已经付出的第一部分，也含有其余部分必将兑现的保证意味；比单译“保证”更具体。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 以汉语属格形式对应希腊文属格，不在正文中强行判定是“圣灵本身作为定金”，还是“与圣灵有关、保证其成全之工的定金”。根据保罗的通常用法，前者更可能。
- source_word: δὲ
  choice: 不另译
  rationale: 此处表示轻微承接或推进，并非强烈转折。汉语借句子与上下文的自然衔接即可表达，无须机械加入“现在”或“但是”。
theological_decisions:
- issue: “圣灵的定金”的含义
  choice: 正文保留属格表达，较可能指圣灵本身就是神现今赐下的第一份和保证。
  alternative: 也可理解为神赐下一项定金，用来保证圣灵将要完成的事。
  rationale: 哥林多后书1:22和以弗所书1:13—14支持圣灵本身作为定金的理解，但原文属格形式没有明说“定金就是圣灵”，因此正文和脚注保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使……做好准备”自然表达神有目的的塑造；“定金”保留原文具体的商业意象。分号使后半句清楚说明神所做的事，同时不把分词关系解释得过重。
