  naturalness: 建议采用“那位使我们为这件事作好准备的，就是神”，这是庄重、自然且清晰的标准普通话表达。“正是”在原位置易造成修饰范围不清；原文的强调可由“这件事”及上下文承接，不必在此机械增添。
  terminology: “神”“圣灵”“定金”均可保留。“定金”恰当地保留ἀρραβών的商业意象及保证含义。正文保留“圣灵的定金”，不在正文中把属格关系定为“圣灵就是定金”或“由圣灵所赐的定金”。脚注a、b的锚点完整且顺序无结构问题。
