  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: zh_hans
  text: 所以，我们既知道主是可畏的[a]，就劝人；但我们已经在神面前显明了[b]，我也盼望我们也已经显明在你们的良心中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主是可畏的”直译为“主的敬畏”或“对主的畏惧”。结合上一节审判台的语境，这里不只是尊敬，也含有在主面前负有责任的肃然畏惧。
    reason: lexical_alternative
  - marker: b
    text: “已经显明了”也可译作“已经被显露出来”。这里和句末的同一动词都强调一种已经形成、现今仍然成立的显明状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: 所以，我们既知道
  rationale: οὖν承接上文审判台的语境，译为“所以”；完成时分词Εἰδότες具有现在状态意义，“既知道”既保留分词与主句的联系，也自然容纳其语境中的原因意味。
- source_word: τὸν φόβον τοῦ κυρίου
  choice: 敬畏主
  rationale: “敬畏”是现代汉语中自然且庄重的圣经用语，同时包含尊崇、畏惧和在主面前负有责任的意味；没有把审判语境中的力度弱化为单纯的“尊敬”。
- source_word: ἀνθρώπους πείθομεν
  choice: 就劝人
  rationale: “人”准确表达泛指的ἀνθρώπους；“劝”自然传达πείθομεν施加劝说、使人信服的行动，又避免“劝服”在汉语中过度暗示每次都已成功达到结果。
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: 我们在神面前已经显明
  rationale: “在神面前”自然表达与神相关的与格；“已经显明”保留φανερόω完成时被动形式所表达的既成并持续的公开、显露状态。
- source_word: ἐλπίζω
  choice: 我也盼望
  rationale: “盼望”准确表达保罗个人所怀的期待，不将语气加强为确定断言。
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι
  choice: 在你们的良心中也已经显明
  rationale: 保留“在……良心中”的内在道德认知层面，并重复“已经显明”，反映原文再次使用φανερόω的完成时被动形式；汉语以集合性的“你们的良心”自然表达希腊文复数。
theological_decisions:
- issue: “敬畏主”在审判语境中的含义
  choice: 保留“敬畏”，使尊崇、畏惧和向主交账的意味并存。
  alternative: 尊敬主；主是可畏的
  rationale: 前一节提到基督的审判台，因此不宜把φόβος仅弱化为尊敬；但译成“主是可畏的”又会把指向主的敬畏明确改写成对主属性的陈述。
- issue: φανερόω所指的显明
  choice: 译为“在神面前已经显明”，并在哥林多人良心的分句中保持同一措辞。
  alternative: 神已经完全认识我们；我们的品格已经向神和你们证明
  rationale: 原文没有明确限定显明的是使徒的品格、动机还是事工，因此正文不补出宾语，保留其开放性，也不把“显明”改成更强的“证明”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“所以……既……就……”清楚呈现与上文的推论及分词关系；两个“已经显明”有意保持原文重复和平行。分号保留劝人的行动与在神面前显明之间的转折。
