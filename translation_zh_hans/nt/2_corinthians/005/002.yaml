  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: zh_hans
  text: 因为我们确实在此叹息，切望穿上[b]我们那从天上来的居所[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从天上来的居所”也可译作“天上的居所”；原文更直白地说“来自天上的居所”，侧重其来源。
    reason: lexical_alternative
  - marker: b
    text: “穿上”所译的动词可以带有“套在外面”的意思，如同在已有的衣物外再穿上一层。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……确实
  rationale: 既保留γὰρ承接上文的解释作用，也用“确实”表达καί在此处的轻微强调；符合现代汉语语序。
- source_word: ἐν τούτῳ
  choice: 在这当中
  rationale: 保留指示语所指的含混性，不擅自补成“在这帐篷里”或“在这身体中”；上下文可使读者联想到现今的身体处境。
- source_word: στενάζομεν
  choice: 我们……叹息
  rationale: “叹息”自然表达因重担而发出的呻吟和内在渴望，又不过度强化为哀号。
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: 我们那从天上来的居所
  rationale: “居所”保留οἰκητήριον的居住意象；“从天上来的”准确呈现ἐξ οὐρανοῦ所强调的来源，而不简化为仅表示性质的“属天居所”。
- source_word: ἐπενδύσασθαι
  choice: 穿上
  rationale: 以自然汉语保留穿衣意象；该复合动词可能含有在原有衣物之外再穿一层的意味，另在脚注说明。
- source_word: ἐπιποθοῦντες
  choice: 切望
  rationale: “切望”表达分词所含强烈、持续的渴慕，并显示这种渴望伴随着叹息。
theological_decisions:
- issue: 从天上来的居所与穿衣比喻所指为何
  choice: 保留“居所”与“穿上”两个交叠的比喻，不明确限定为复活的身体、中间状态或末世的天上居所。
  alternative: 直接译成“切望穿上从天上来的复活身体”或“渴望进入天上的家”。
  rationale: 本节本身没有把这些意象系统化，也未明确排除相关解释；直译其张力可避免把某一教义解释写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在这当中”刻意保留原文指代不完全明确的特点；“穿上……居所”保留保罗有意交叠的居住与穿衣意象，不为追求汉语顺滑而消除其张力。
