reference: 2 Corinthians 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: zh_hans
  text: 所以，从今以后，我们不再按肉体看任何人[a]。即使我们曾经按肉体认识弥赛亚[b]，如今却不再这样认识他了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按肉体”也可译作“按人的眼光”或“按世俗标准”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为 Christon，意为“受膏者”；传统译作“基督”。此处译作“弥赛亚”，以表达这个称号的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 承接上文并引出结论，保留推论关系，同时符合现代汉语表达。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 自然表达从当前这一时点开始的决定性转变。
- source_word: οὐδένα οἴδαμεν
  choice: 我们不再……看任何人
  rationale: οἴδαμεν本义为“认识、知道”，但与κατὰ σάρκα连用时涉及如何看待或评判人；译作“看”既自然，又不把含义过度限定为正式评价。否定意义由οὐδένα表达，并结合全句时态转折译出“不再”。
- source_word: κατὰ σάρκα
  choice: 按肉体
  rationale: 保留保罗具有神学张力的“肉体”用语，不在正文中单一化为“按人的眼光”或“按世俗标准”；可能含义列于脚注。
- source_word: εἰ καὶ
  choice: 即使
  rationale: 保留希腊文的让步表达及其真实歧义，不强行改成明确断言意味更强的“虽然”。
- source_word: ἐγνώκαμεν
  choice: 我们曾经……认识
  rationale: 表达过去曾有的认识方式，并与如今的改变形成鲜明对照；现代汉语无需机械复制希腊语完成时形式。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 将Χριστός作为称号译出其“受膏者／弥赛亚”的语义，而非仅作音译式专名。
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: 如今却不再这样认识他了
  rationale: “却”体现强烈转折，“不再”对应οὐκέτι；补出承前省略的宾语“他”，并用“这样”明确所改变的是认识方式。
theological_decisions:
- issue: κατὰ σάρκα用于一般人及弥赛亚时的含义
  choice: 正文保留“按肉体”，脚注说明可理解为“按人的眼光”或“按世俗标准”。
  alternative: 直接译为“按人的眼光”或“按世俗标准”。
  rationale: 保留保罗原有术语及其张力，避免把它窄化为某一种解释，也避免误读为否认弥赛亚真实的人性；本节所否定的是一种以肉体为准的认识或评判方式。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处指向耶稣的受膏者身份，译出称号的实际意义，同时不引入宗派性解释。
- issue: εἰ καὶ的陈述力度
  choice: 即使
  alternative: 虽然
  rationale: “即使”较贴近希腊文形式，也保留保罗是否明确承认自己曾以这种方式认识弥赛亚的语义张力，不在译文中替作者作出判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按肉体”刻意保留原文术语，脚注帮助普通读者理解；两处“认识”维持原文动词之间的语义联系，末句以“这样”自然承接前述认识方式。
