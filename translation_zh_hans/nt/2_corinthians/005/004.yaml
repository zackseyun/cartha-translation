  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: zh_hans
  text: 因为我们在这帐篷里时，确实不堪重负而叹息；因为我们不是想要脱去衣服，而是想要在外面再穿上一层[a]，好让这必死的[b]被生命吞没。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在原有衣服外面再穿上”。希腊语动词含有在已经穿着的衣服外再加穿一层的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“那必死的”或“必死性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήνει
  choice: 帐篷
  rationale: 保留保罗以帐篷比喻今世身体存在的意象，并与上下文相连，避免将其淡化为一般的“居所”。
- source_word: στενάζομεν
  choice: 发出叹息
  rationale: 表达在重压之下的深切呻吟和末世盼望；现代汉语中比单用“叹气”更庄重、更有分量。
- source_word: βαρούμενοι
  choice: 不堪重负
  rationale: 自然表达被动分词所指的受压状态，并说明叹息所伴随的处境。
- source_word: ἐφ’ ᾧ
  choice: （以分号衔接下文）
  rationale: 该短语在此可引出叹息的缘由；汉语用分号和“并不是……而是……”自然呈现其解释关系，又避免生硬重复“因为”。
- source_word: ἐκδύσασθαι
  choice: 脱去衣服
  rationale: 保留原文的衣着隐喻，不把它直接解释为某种特定的中间状态。
- source_word: ἐπενδύσασθαι
  choice: 在外面再穿上一层
  rationale: 体现复合动词所含在已有衣着之外加穿一层的意味，同时保持现代汉语清晰自然。
- source_word: καταποθῇ
  choice: 被……吞没
  rationale: 保留原文生动的完全胜过、吞灭意象。
- source_word: τὸ θνητόν
  choice: 这必死的一切
  rationale: 原文为中性形容词名词化；此译法不把所指过早限定为身体，也比抽象的“必死性”更适合正文。
- source_word: ζωῆς
  choice: 生命
  rationale: 与“必死”形成直接对照，简洁自然。
- source_word: καὶ γὰρ
  choice: 因为……确实
  rationale: “因为”承接上文的论证，“确实”表达强调语气，兼顾连接和强调两重功能。
theological_decisions:
- issue: 衣着隐喻与中间状态
  choice: 保留“脱去衣服”和“在外面再穿上一层”的隐喻，不明确规定其所对应的教义阶段。
  alternative: 把“脱去衣服”明确解释为灵魂离体，或把“再穿上一层”明确限定为复活身体。
  rationale: 希腊文以衣着描述现今处境与未来转变，但没有在本节中完整界定中间状态；保留意象可维持原文的神学张力。
- issue: τὸ θνητόν的所指范围
  choice: 译作“这必死的一切”，保留较宽的指涉。
  alternative: 译作“必死之躯”或抽象的“必死性”。
  rationale: 名词化的中性形容词可以指必死之物或必死状态；正文不应无必要地将它仅限于肉身，也不必完全抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“帐篷”“脱去衣服”“再穿上一层”“吞没”共同保留原文连续的具体意象；标点按汉语习惯调整，以清楚呈现解释和对比关系。
