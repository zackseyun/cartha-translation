source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: zh_hans
  text: 原来，弥赛亚的爱[a]驱使着我们，因为我们认定了这一点：一人为所有人死了，因此所有人都死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语也可理解为“对弥赛亚的爱”，即我们对弥赛亚的爱；“弥赛亚的爱”则可指弥赛亚对我们的爱。
    reason: 保留原文属格可能具有的主语或宾语两种关系。
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: “爱”是现代汉语中自然、准确的对应词，也保留了本词在书信中的词汇联系。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此是称号，译作“弥赛亚”；属格形式用“的”表达，并以脚注说明它既可能指弥赛亚所发出的爱，也可能指人对弥赛亚的爱。
- source_word: συνέχει
  choice: 驱使着
  rationale: 这里表示一种强有力的推动和支配作用。“驱使着”符合现代汉语表达，又避免把意思缩窄为机械性的“控制”。
- source_word: κρίναντας
  choice: 因为我们认定了
  rationale: 分词在此说明前句的依据；“认定”体现经过判断而得出结论的含义，“因为”则明确其因果关系。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出所认定的内容；汉语用冒号自然地表达这一内容关系。
- source_word: εἷς
  choice: 一人
  rationale: 原文只说“一个”，语境所指是弥赛亚；汉语译作“一人”既简洁，也保留原句的修辞力度。
- source_word: ὑπὲρ πάντων
  choice: 为所有人
  rationale: ὑπέρ加属格在此表示“为了、代表”。“为所有人”保留代表性和受益性，不把它限定为某一种赎罪理论。
- source_word: ἄρα
  choice: 因此
  rationale: 清楚表达保罗从前一命题所得出的推论。
- source_word: οἱ πάντες
  choice: 所有人
  rationale: 直译其概括范围，不在正文中预先限定为全人类或信徒群体。
- source_word: ἀπέθανον
  choice: 死了
  rationale: 以简明的完成性表达对应不定过去时，并保留“所有人都死了”这一神学上高度浓缩的陈述。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦ中属格的关系
  choice: 正文译作“弥赛亚的爱”，脚注说明两种可能理解。
  alternative: “弥赛亚对我们的爱”或“我们对弥赛亚的爱”
  rationale: 希腊语属格既可作主语属格，也可作宾语属格。现代汉语“弥赛亚的爱”较自然地倾向前者，却仍是最简洁的形式；脚注明示另一种真实可能，避免无声地排除原文歧义。
- issue: “所有人都死了”的含义和范围
  choice: 按原文浓缩地译作“所有人都死了”。
  alternative: “所有人在弥赛亚里代表性地死了”或“所有信徒都与他同死了”
  rationale: 上下文可能涉及弥赛亚代表众人受死以及众人参与他的死，但本节没有展开说明“所有人”的范围或死亡的方式，因此正文不加入解释性限定。
- issue: ὑπὲρ πάντων的赎罪含义
  choice: 译作“为所有人”。
  alternative: “代替所有人”或“代表所有人”
  rationale: ὑπέρ可含代表或代受之意，但单独译成“代替”会把语义限定得过窄；“为”让上下文承载其神学分量。
translation_notes:
  register: 采用现代、庄重而通顺的书信语体。“原来”承接上文并对应γάρ；“驱使着”表达强烈的内在推动。“一人……所有人……所有人”的重复保留原文紧凑的论证结构。
