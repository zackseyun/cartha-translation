- from: 神使那不知罪的，为了我们成为罪[a]，好使我们在他里面成为神的义[b]。
  to: 神为了我们，使那不知罪的成为罪[a]，好使我们在他里面成为神的义[b]。
  rationale: 仅调整“为了我们”的语序，以消除现代汉语中的轻微修饰歧义，并使句子更自然。正文及脚注继续保留原文对于“罪”和“神的义”的语义张力与可争议性，未加入教义性解释。
