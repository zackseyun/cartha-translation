id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: zh_hans
  text: 神为了我们，使那不知罪的成为罪[a]，好使我们在他里面成为神的义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪祭”。希腊文两处都作“罪”；有人认为第二处带有献祭的含义。
    reason: alternative_reading
  - marker: b
    text: 或译“神的公义”，或“从神而来的义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: 不知
  rationale: 保留希腊文“认识、知道”的表达，指基督没有亲身参与或经历罪；不扩译为“没有犯过罪”，以免削弱原文凝练的措辞。
- source_word: ἁμαρτίαν（第一次）
  choice: 罪
  rationale: 这里是γνόντα的宾语，直接指“罪”；保留抽象名词，不作解释性扩写。
- source_word: ὑπὲρ ἡμῶν
  choice: 为了我们
  rationale: 自然表达受益和代表意义，同时不把ὑπέρ限定为某一种赎罪理论。
- source_word: ἁμαρτίαν（第二次）
  choice: 罪
  rationale: 与第一次一致译作“罪”，保留保罗强烈而凝练的原句；“赎罪祭”这一可能的献祭含义列入脚注。
- source_word: ἐποίησεν
  choice: 使……成为
  rationale: 在汉语中自然表达ποιέω在此使役性的“使成为”，既体现神的行动，又不额外规定其形而上含义。
- source_word: γενώμεθα
  choice: 成为
  rationale: 体现γίνομαι的动态意义，并在“好使”引导的目的从句中自然传达虚拟语气。
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是现代中文圣经和神学语境中自然、凝练的对应词，也能保留该词在本段中的法庭性、关系性和神学张力。
- source_word: θεοῦ
  choice: 神的
  rationale: 按属格形式直译，不在正文中判定它具体表示神自身的义、来自神的义，还是与神相关的义。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗惯用且具有神学分量的表达，不解释性扩译为“与他联合”。
theological_decisions:
- issue: “使那不知罪的……成为罪”的含义
  choice: 正文保留“成为罪”的突兀表达，同时由“不知罪”明确那一位本身无罪；不把这句话解释成他在道德上成了有罪的人。
  alternative: “使他成为赎罪祭”
  rationale: 原文第二次仍使用“罪”一词。献祭性的理解有可能，但不应在正文中取代原文的张力，因此列入脚注。
- issue: δικαιοσύνη θεοῦ的含义
  choice: 译作“神的义”，保留属格关系的开放性。
  alternative: “神的公义”或“从神而来的义”
  rationale: 该短语可能强调神自身的义、神所施行的公义，或源自神的义；正文不将其限定为单一教义解释，其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那不知罪的”保留原文以分词短语指基督的凝练表达；“为了我们”自然传达ὑπέρ的宽泛意义；脚注标记分别紧随其所说明的“罪”和“神的义”。
