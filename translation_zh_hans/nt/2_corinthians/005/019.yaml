id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: zh_hans
  text: 这就是说，上帝在弥赛亚里使世界与自己和好，不把他们的过犯算在他们身上，并把和好的话语托付给我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“放在我们里面”；也可理解为“置于我们中间”。
    reason: 保留θέμενος ἐν ἡμῖν的字面措辞及介词短语可能具有的不同理解。
lexical_decisions:
- source_word: ὡς ὅτι
  choice: 这就是说
  rationale: 在此作为解释性表达，引出前句内容的具体说明；“这就是说”自然保留了解说作用。
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: 上帝在弥赛亚里
  rationale: 直接保留ἐν的“在……里”表达，不改写成较具解释性的“借着弥赛亚”，从而保留原文在神学和句法上的张力。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在这里是称号；译作“弥赛亚”可传达其受膏者称号的意义，而非仅作为专名处理。
- source_word: κόσμον
  choice: 世界
  rationale: 保留κόσμος的广泛指涉；上下文主要涉及与上帝疏离的人类，但原词并未明说“世人”，故不在正文中缩窄其范围。
- source_word: καταλλάσσων
  choice: 使……和好
  rationale: 以现代汉语自然表达使关系恢复和好的行动，并与本节后面的καταλλαγή保持词义呼应。
- source_word: μὴ λογιζόμενος
  choice: 不把……算在……身上
  rationale: 保留λογίζομαι的计算、记账意象，同时使用普通读者容易理解的现代汉语。
- source_word: παραπτώματα
  choice: 过犯
  rationale: “过犯”表达越界、犯错的具体行为，比宽泛的“罪”更贴近παράπτωμα。
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: 和好的话语
  rationale: 保留λόγος的“话语”含义及属格结构，避免把它过度限定为某一种传播形式。
- source_word: θέμενος ἐν ἡμῖν
  choice: 托付给我们
  rationale: 这是符合现代汉语的语境性表达，说明上帝将宣讲和好的话语之职交给“我们”；脚注保留更贴近字面的可能译法。
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ中ἐν Χριστῷ的理解
  choice: 上帝在弥赛亚里使世界与自己和好
  alternative: 上帝借着弥赛亚使世界与自己和好
  rationale: 正文保留“在……里”的直接表达，不把ἐν明确解释为工具性的“借着”，以免消除原文可能具有的神学张力。
- issue: θέμενος ἐν ἡμῖν中ἐν ἡμῖν的理解
  choice: 托付给我们
  alternative: 放在我们里面／置于我们中间
  rationale: 正文采用自然且符合使徒职分语境的表达；脚注说明原文更具空间感的措辞及其可能的集体性理解。
- issue: κόσμος的范围
  choice: 世界
  alternative: 世人
  rationale: “世界”保留原词较宽的指涉，不在翻译中直接把它限定为全人类，尽管语境明显以人类的和好为中心。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“弥赛亚”“和好”“过犯”等词保留保罗论述中的关键概念；句式尽量自然，同时不消解“在弥赛亚里”和“在我们里面”的原文张力。
