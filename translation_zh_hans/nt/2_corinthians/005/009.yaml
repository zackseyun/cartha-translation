  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: zh_hans
  text: 所以，我们也立志：无论是在家，还是离家在外，都要蒙他喜悦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可更明确地译作：“无论住在身体里，还是离开身体。”
    reason: 说明原文省略的补语及其由上下文提供的具体含义。
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文关于住在身体内和离开身体、与主同住的论述，表明由此得出的结论；“所以”自然明晰。
- source_word: καὶ
  choice: 都
  rationale: 原词在此带有承接和增添语气；结合汉语句式，以“我们都”自然表达共同而持续的取向，避免生硬直译为“也”。
- source_word: φιλοτιμούμεθα
  choice: 立志
  rationale: 该动词表示以某事为荣誉目标并热切追求。“立志”简洁、庄重，保留主动追求的力度。
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: 无论住在家里，还是离家在外
  rationale: 保留两个分词“在家居住／离家在外”的空间隐喻及原文未明说宾语的简练表达；身体方面的具体所指交由上下文和脚注说明。
- source_word: εὐάρεστοι
  choice: 蒙他喜悦
  rationale: 表达成为他所喜悦、所悦纳的人；比单说“使他喜悦”更贴近原文形容词作表语的结构。
- source_word: αὐτῷ
  choice: 他
  rationale: 保留原文代词形式，其所指由上文的“主”确定，不在本节擅自改写为名词。
- source_word: εἶναι
  choice: 要蒙
  rationale: 与“立志”构成目的性补语，在汉语中自然表达“立志成为他所喜悦的人”。
theological_decisions:
- issue: 是否在正文中明确“住在家里／离家在外”是指身体
  choice: 正文保留简练的空间隐喻，不补出“身体”
  alternative: 无论住在身体内，还是离开身体
  rationale: 上下文（5:6–8）清楚指向住在身体内或离开身体，但本节希腊文省略了这些补语。正文保留这种含蓄和简练，脚注说明语境所指，避免把解释直接并入经文。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“住在家里／离家在外”保留原文成对的居住隐喻；“立志”体现热切追求而不过度扩展。脚注标记已在正文中标出。
