  source_fidelity: “立志要蒙他喜悦”基本准确传达 φιλοτιμούμεθα 与 εὐάρεστοι αὐτῷ εἶναι。“住在家里／离家在外”保留了原文未明说“身体”的省略，方向可取；但“我们都”把 καὶ 的连接性强调处理成了全称性的“都”，不够贴切，且“住在家里”在现代汉语中较容易首先理解为日常家庭居住。
  naturalness: 修订为“我们也立志：无论是在家，还是离家在外，都要蒙他喜悦”更符合现代书面普通话的节奏。“在家／离家在外”保留居住隐喻，也避免“住在家里”的日常生活联想过强。
  terminology: “立志”和“蒙他喜悦”庄重自然，并忠实保留原文的目标与代词“他”。脚注用“住在身体里／离开身体”比“住在身体内”更自然，且仅说明上下文所补足的含义，不将其纳入正文。
