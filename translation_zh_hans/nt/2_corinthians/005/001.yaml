source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: zh_hans
  text: 因为我们知道，如果我们在地上的帐篷住处被拆毁[a]，我们就有[c]一座从上帝而来的建筑，就是一所非人手所造[b]、在诸天之中的永恒房屋[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我们在地上的帐篷住处被毁坏。”原文动词可指拆掉、拆卸或毁坏一座建筑，与帐篷的意象相呼应。
    reason: lexical_alternative
  - marker: b
    text: 直译“不是手所造的”，即不是人手所造；这一说法强调它出于上帝，而非人的制作。
    reason: lexical_alternative
  - marker: c
    text: 原文是“我们有”，不是“我们将会有”，保留了现在拥有与将来实现之间的张力。
    reason: alternative_reading
  - marker: d
    text: “诸天”在原文中为复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: 表达确定、稳固的认识，是现代汉语中自然且准确的对应。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明根据；中文以“因为”自然保留其解释性连接作用。
- source_word: ἐὰν ... καταλυθῇ
  choice: 即使……被拆毁
  rationale: ἐάν加虚拟语气表示未来可能发生的情形；在本句语境中带有预期性。“拆毁”既保留建筑意象，也与拆卸帐篷相呼应；“即使”能自然表达条件而不暗示对此结果存疑。
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: 我们在地上的帐篷之家
  rationale: 同时保留“房屋”和“帐篷”两层意象，不直接解释为“身体”；“在地上的”与后文“诸天之中”形成空间和性质上的对照。
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: 从上帝而来的建筑
  rationale: 将οἰκοδομή按具体建筑物理解，并保留ἐκ所表达的来源，避免改写成单纯的所有关系。
- source_word: ἔχομεν
  choice: 我们也有
  rationale: 严格保留希腊文现在时，不改成“将会有”，使现今拥有与将来实现之间的张力仍然存在。
- source_word: οἰκίαν ἀχειροποίητον
  choice: 一座非人手所造的房屋
  rationale: “非人手所造”保留该词在圣经语境中的传统回响，强调其源于上帝而非人的制作。
- source_word: αἰώνιον
  choice: 永存
  rationale: 在这里与会被拆毁的地上居所形成对照；“永存”自然表达持续不朽的性质，并可清楚修饰“房屋”。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在诸天之中
  rationale: 保留希腊文复数形式，同时采用庄重而可理解的现代汉语表达。
theological_decisions:
- issue: 居所意象所指为何
  choice: 正文保留“帐篷、家、建筑、房屋”等意象，不直接译成“身体”。
  alternative: 把前后两种居所直接解释为现今的身体和复活的身体。
  rationale: 原文刻意叠加居所与帐篷意象。直接代换为“身体”会把解释写入正文，并削弱保罗修辞中的意象和张力。
- issue: ἔχομεν的时间意义
  choice: 译为现在时“我们也有”。
  alternative: 译为将来时“我们将会有”。
  rationale: 希腊文明确使用现在时。其所指是现今已有、因确定性而视为已有，还是将来实现，存在解释空间；译文不替读者预先解决这一问题。
- issue: 条件句的语气
  choice: 译为“即使……被拆毁”。
  alternative: 译为“如果……被拆毁”。
  rationale: 两者都可表达ἐάν条件结构；“即使”在中文中更顺畅地传达死亡虽将临到、却不能推翻下文确信的论证走势，但不把条件改写为已完成事实。
translation_notes:
  register: 采用现代、庄重且普通读者可理解的书面汉语。以“帐篷之家”保留原文混合的居所意象；用“建筑……房屋”维持词语转换。标点和“就是”用于澄清同位关系，但不消除其所指及时间层面的神学张力。
