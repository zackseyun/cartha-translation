  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: zh_hans
  text: 并且，他替众人死了[a]，使那些活着的人不再为自己活，而是为那位替他们死了、又被复活的那一位而活。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替”也可译作“为了……的益处”或“代表”。本节两处“替”都译自同一个希腊语介词（ὑπέρ）。
    reason: lexical_alternative
  - marker: b
    text: “被复活”原文为被动形式；也可按汉语习惯译作“复活了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: 替众人
  rationale: ὑπέρ接属格表示为了某人的益处或代表某人；“替众人”在现代汉语中自然地保留这种代表性、受益性的含义，同时不把特定赎罪理论写进正文。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 不定过去时直陈语气指向已经发生的死亡事件；主语“他”依据上文和希腊语动词形式补出。
- source_word: ἵνα
  choice: 使
  rationale: 表达目的兼可含结果意味；“使”简洁自然，并保留句子的目的指向。
- source_word: οἱ ζῶντες
  choice: 那些活着的人
  rationale: 冠词化现在分词指“活着的人”；此译法保留其持续状态，也不擅自限定为肉身或属灵意义。
- source_word: μηκέτι
  choice: 不再
  rationale: 准确表达先前生活取向应当停止。
- source_word: ἑαυτοῖς ζῶσιν
  choice: 为自己活
  rationale: 反身代词与“活”搭配的与格表达生活的对象或取向；“为自己活”是自然现代汉语。
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: 而是为那位……死了、又被复活的活
  rationale: 与格承接省略但可理解的“活”，形成“不为自己……而为那位……”的对照；“那位”庄重自然，两个分词也得到保留。
- source_word: ἐγερθέντι
  choice: 被复活
  rationale: 保留希腊语不定过去时被动分词的语态，不改写为主动的“复活了”。
- source_word: ὑπὲρ αὐτῶν
  choice: 替他们
  rationale: 与前面的ὑπέρ采用相同译法，保留原文重复，并表达代表或为其益处的含义。
theological_decisions:
- issue: πάντων与αὐτῶν的范围
  choice: 直译为“众人”和“他们”，不缩小所指范围
  alternative: 明确解释为全体人类，或限定为所有信徒／基督所代表的人
  rationale: 本节使用广泛的范围用语，但没有在句内解决关于其确切范围的后世神学争论；译文保留原文张力。
- issue: ἐγερθέντι的复活语态
  choice: 译为“被复活”
  alternative: 译为“复活了”
  rationale: 被动表达忠实反映希腊语形式，并保留使其复活之行动者未在本句明说的特点。
- issue: ὑπέρ的神学力度
  choice: 译为“替”，并以脚注说明也可理解为“为了……的益处／代表”
  alternative: 译为“为”或明确译成带有某种特定代赎理论的术语
  rationale: “替”体现代表性与受益关系，但脚注保留介词的语义幅度，避免在译文中断定一种完整的赎罪理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众人”较“所有人”更适合经文语体，同时仍清楚表达πάντων的广泛范围。末尾保留“为那位……的活”的对照结构；在不牺牲自然度的前提下，尽量呈现原文的语法与神学张力。
