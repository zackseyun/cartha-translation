  yaml_path: translation/nt/2_corinthians/005/003.yaml
  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: zh_hans
  text: 如果我们确实已经穿上[a]，就不会被发现赤身露体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我们确实已经穿上，就不会被发现没有穿戴。”
    reason: 保留 ἐνδυσάμενοι 与 γυμνοί 在“穿上／没有穿戴”上的较贴近词汇对应，并显示分词所突出的已完成动作。
lexical_decisions:
- source_word: εἴ γε
  choice: 如果……确实
  rationale: 既保留 εἰ 的条件意味，也体现 γε 的强调、确认语气，不把尚有张力的条件句改写成确定陈述。
- source_word: καὶ
  choice: 不单独译出
  rationale: 此处 καί 与条件句及分词紧密相连，带有强调或衔接作用；其语气在中文“确实”及整体句式中自然体现，若机械译作“也”或“甚至”反而生硬。
- source_word: ἐνδυσάμενοι
  choice: 穿上了
  rationale: 该词为 ἐνδύω 的不定过去时中态分词，直译为“穿上之后／既已穿上”。中文用“穿上了”既保留主动穿戴的形式，也延续上下文衣服与居所交织的比喻。
- source_word: οὐ
  choice: 不
  rationale: 直接表达对未来被动动词的否定。
- source_word: γυμνοὶ
  choice: 赤身的
  rationale: 保留 γυμνός 的直接衣着意象，不将其解释为某一种特定的末世状态。
- source_word: εὑρεθησόμεθα
  choice: 会被发现是
  rationale: 保留未来被动形式及“显明为某种状态”的含义；“被发现是”在现代汉语中清楚自然。
theological_decisions:
- issue: “穿上”与“赤身”比喻的具体所指
  choice: 保留衣着比喻，不在正文中界定其具体神学所指
  alternative: 将“赤身”明确解释为灵魂离身的中间状态、没有复活身体，或在上帝面前蒙羞
  rationale: 本节本身没有明确限定该比喻究竟指哪一种状态；保留原文意象，可避免把某一神学解释写入译文。
- issue: εἴ γε 所表达的条件与确认语气
  choice: 译作“如果……确实”
  alternative: 译作“既然”或“只要”
  rationale: “既然”会把条件读成已获确认的事实，“只要”则容易引入充分条件意味；“如果……确实”较完整地保留原文的条件性与强调语气。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“穿上”与“赤身”保持保罗的衣着比喻；正文不补出所穿的是身体、居所或衣服，以保留上下文有意交叠的意象。
