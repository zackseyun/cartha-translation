id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: zh_hans
  text: 因为我们众人都必须在弥赛亚[d]的审判台前显露出来[a]，使各人领受自己借着身体所行之事所应得的报偿[b]，无论所行的是善是恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出现在弥赛亚的审判台前。”希腊语动词既可指来到、出现，也可指被公开显明；正文采用较强的后一层意思。
    reason: lexical_alternative
  - marker: b
    text: “借着身体所行的”也可理解为“在身体中所行的”，即人在有身体的今生所做的一切。原文结构较为紧凑，直译近于：“使各人领受借着身体的事，与他所行的相称。”
    reason: lexical_alternative
  - marker: c
    text: “恶”所对应的希腊词也可指“坏的”“卑劣的”或“无价值的”。
    reason: lexical_alternative
  - marker: d
    text: “弥赛亚”原文为Χριστός，传统常译作“基督”，意思是“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: φανερωθῆναι
  choice: 显露出来
  rationale: 该被动式不只是指到场，也可指人的实情被公开显明；“显露出来”保留了审判语境中的揭示意味，同时没有说明究竟显露哪些事。
- source_word: βήματος
  choice: 审判台
  rationale: βῆμα在此指施行司法裁断的高台或席位；“审判台”既保留具体意象，也清楚表达司法语境。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，意为“受膏者”；“弥赛亚”保留其称号性质。
- source_word: κομίσηται
  choice: 领受相应的报偿
  rationale: 该中间语态动词在这里具有按行为得回相应结果的意思；“报偿”不预先限定其结果是奖赏还是刑罚。
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: 按自己借着身体所行的
  rationale: διά加属格可表达凭借或媒介，因此译作“借着身体”；πρός表达报偿与个人所行之事相对应。中文将压缩的希腊语结构自然展开，同时保留个人责任。
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留分配性的单数含义，强调每个人分别承担责任。
- source_word: ἀγαθὸν … φαῦλον
  choice: 善是恶
  rationale: 以常见的道德对举表达两者；φαῦλον可指坏的、卑劣的或无价值的事，“恶”在“善恶”这一固定对举中简洁自然，但不把其具体程度说死。
theological_decisions:
- issue: 在弥赛亚审判台前受评判的范围和结果
  choice: 保留“我们众人”“各人”和善恶报偿的普遍、严肃表述，不说明这是只针对信徒的奖赏审判，还是所有人的最终审判。
  alternative: 将其明确解释为信徒得奖赏的审判，或明确解释为全人类的末日定罪审判。
  rationale: 本节明确陈述众人都要被显露，各人按所行的领受相应报偿，却没有在本节内解决受审范围及最终结局等系统神学问题。
- issue: φανερωθῆναι所表达的是到场还是被揭露
  choice: 正文采用较强的“显露出来”，脚注保留“出现在……面前”的可能。
  alternative: 只译为“出现”或“站在”。
  rationale: 该词在此可以涵盖来到审判台前，也带有被公开显明的意味；正文保留后者的司法和道德力度，而不排除前者。
- issue: Χριστός作为称号的处理
  choice: 译作“弥赛亚”。
  alternative: 按传统音意结合的固定称谓译作“基督”。
  rationale: 此处属格形式修饰“审判台”，称号功能清楚；正文用“弥赛亚”呈现“受膏者”称号，脚注说明传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我们众人”“各人”保留原文由群体到个人的责任焦点；句式避免教派化术语，并以脚注交代原文压缩结构及真实的词义歧义。
