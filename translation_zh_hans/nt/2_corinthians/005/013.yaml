  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: zh_hans
  text: 因为我们若是失去理智[a]，是为了上帝；若是头脑清醒[b]，是为了你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像是发狂”或“忘乎所以”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“思想健全”或“心智清醒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: 若是……若是……
  rationale: 保留两个并列条件所形成的鲜明对照；现代汉语中重复“若是”自然清楚，也不抹去二者择一的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并作解释；“因为”在现代汉语中能清楚表达γάρ的说明和理由功能。
- source_word: ἐξέστημεν
  choice: 失去理智
  rationale: 该词在此可指失常、像是发狂或不能以常理理解。“失去理智”既直接对应与σωφρονοῦμεν的反差，又不把经文定解为真实的精神失常。
- source_word: θεῷ
  choice: 为了上帝
  rationale: 与ὑμῖν构成平行的省略性与格表达，表示所向或所为的对象；“为了上帝”在汉语中简洁自然。
- source_word: σωφρονοῦμεν
  choice: 心智清醒
  rationale: 表达思想健全、判断清醒，并与“失去理智”形成直接对照；语体庄重而易懂。
- source_word: ὑμῖν
  choice: 为了你们
  rationale: 与“为了上帝”保持结构平行，表达这种清醒表现是为哥林多信徒的益处。
theological_decisions:
- issue: 保罗对自身两种状态的对照应如何理解
  choice: 保留“失去理智”与“心智清醒”的强烈修辞对照，不断言保罗确实精神失常，也不把前者限定为某种技术意义上的宗教狂喜。
  alternative: 将前者明确解释为实际的狂喜经验，或仅解释为他人对保罗的讥讽。
  rationale: 原文简练且有所省略，可以指在人看来失常的表现，也可能涉及超常宗教经验。译文应保留这种张力，而不加入原文没有明确给出的教义性判断。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“因为”明确承接上文；两个“若是”和两个“为了”保留原文紧凑的平行结构。脚注呈现主要词义选择，不在正文中消解原文的修辞张力。
