  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: zh_hans
  text: 我们不是又向你们举荐自己，而是给你们机会为我们夸口，好让你们能回应那些以外表夸口、却不以内心夸口的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以外表夸口、却不以内心夸口”，直译为“在面容上夸口，而不在心里夸口”。“面容”在这里指外在可见的一面；这句话可能是指人以外在表象为夸耀，而非以内在的真实为夸耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: 举荐
  rationale: 这里指向别人推荐或证明某人值得认可；“举荐自己”自然地保留了保罗否认自我推许的语气。
- source_word: ἀφορμὴν
  choice: 机会
  rationale: 此词可指起点、由头或机会；这里是保罗为哥林多人提供可据以谈论他的机会。
- source_word: καυχήματος
  choice: 以……为荣
  rationale: 在中文里比“夸耀我们”更自然，也保留 καύχημα 所含的自豪、夸口语义。
- source_word: ὑπὲρ ἡμῶν
  choice: 以我们为荣
  rationale: ὑπέρ 可表达关于我们或为我们说话；结合 καύχημα，译文保持“以我们为荣”的自然表达，而不把维护、辩护之意写死。
- source_word: ἵνα ἔχητε πρὸς
  choice: 好让你们能回应
  rationale: 原文直译近于“使你们对……有所持有”，语境隐含可说的话或答复；“能回应”清楚而不过度具体化。
- source_word: ἐν προσώπῳ
  choice: 以外表
  rationale: 字面为“在脸面上”，与“内心”对举时，指可见的外在表现或表象。
- source_word: καυχωμένους
  choice: 夸口的人
  rationale: 以“夸口”保留与前面 καύχημα 的词义联系，也符合本段的论辩语气。
- source_word: καρδίᾳ
  choice: 内心
  rationale: καρδία 字面是“心”，在外表与内在实质的对比中，“内心”是清晰自然的现代汉语。
- source_word: πάλιν
  choice: 又
  rationale: 准确表达重复之意，并自然修饰“向你们举荐自己”。
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ 的对比
  choice: 以外表夸口、却不以内心夸口
  alternative: 以外在表现而非内在实质夸口
  rationale: 正文保留原文“外表／内心”及重复的“夸口”，不直接把“内心”解释成真诚或属灵实质；脚注说明可能表达的外在与内在之别。
- issue: ὑπὲρ ἡμῶν 的关系含义
  choice: 以我们为荣
  alternative: 替我们夸口／为我们辩护
  rationale: 原文可能兼有“关于我们”和“为我们说话”的意味；“以我们为荣”适合 καύχημα 的搭配，并避免把隐含的辩护功能提升为明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“举荐自己”保留书信论辩的正式语体；“以我们为荣”与后文“以外表夸口”在中文中略有措辞变化，以兼顾自然表达和原文同一词族的语义联系。
