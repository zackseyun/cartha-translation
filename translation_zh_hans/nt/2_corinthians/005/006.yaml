  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: zh_hans
  text: 因此，我们总是满有勇气，并且知道：当我们住在身体里时，我们就是离开主、在外居住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开主、在外居住”也可译作“不在主那里”。希腊语动词ἐκδημοῦμεν与前面的“住在身体里”所含的居住意象相对，可指离开家而在外，或不在某处。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: 我们总是满有勇气
  rationale: 现在时分词表示持续的勇气或信心；用汉语限定动词表达，使句子自然，并与后面的“也知道”并列。
- source_word: οὖν
  choice: 因此
  rationale: 承接上文关于复活生命和天上居所的论述，表示由此得出的结论。
- source_word: πάντοτε
  choice: 总是
  rationale: 表达持续、在任何时候都有的状态。
- source_word: εἰδότες
  choice: 也知道
  rationale: οἶδα 的完成时分词具有现在意义，表示已经确知并持续知道。
- source_word: ἐνδημοῦντες ἐν τῷ σώματι
  choice: 住在身体里时
  rationale: 保留 ἐνδημέω 所含“在家居住”的空间隐喻，同时不把身体解释成仅仅可抛弃的外壳。
- source_word: ἐκδημοῦμεν ἀπὸ τοῦ κυρίου
  choice: 我们就是离开主、在外作客
  rationale: ἐκδημέω 与 ἐνδημέω 构成反义对应，指离家在外；“离开主、在外作客”既保留这种隐喻，也表达 ἀπό 所标示的分离。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 按新约语境将 κύριος 译作“主”，不额外指明或扩展其含义。
theological_decisions:
- issue: 今世身体生活与同主相处之间的张力
  choice: 将目前住在身体里的状态表述为“离开主、在外作客”
  alternative: 将其强化为信徒在身体中便与基督完全隔绝，或提前引入下一节“离开身体、与主同住”的完整对照
  rationale: 本节以居家和离家为喻，对比当前具身体的生活与尚未在终极意义上同主相处的状态；译文保留这种张力，却不暗示信徒如今完全没有基督的同在，也不把下一节的措辞倒置进来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满有勇气”兼顾勇敢与信心；“住在身体里”和“离开主、在外作客”保留原文成对的居家／离家隐喻。
