  rationale: 修订以“替受膏者作使者”保留两处ὑπὲρ Χριστοῦ的代表性；以“仿佛”对应ὡς的比较语气，并用“劝勉”表达παρακαλέω在此的恳切呼吁。脚注b改为仅反映与格对象可译作“与神／向神”的差异，不添加“归向”这一原文未明示的概念。
