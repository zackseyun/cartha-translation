  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: zh_hans
  text: 所以，我们替受膏者作使者，仿佛神借着我们在劝勉人。我们替受膏者恳求你们：你们要与神和好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 也可译作“要向神和好”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: 作受膏者的使者／替受膏者
  rationale: ὑπέρ接属格在这里表示“为、代表”。结合使者的语境，第一处用“作……的使者”，自然表达代表身份；第二处用“替”，表达代其恳求。Χριστός在此是称号，按其本义译为“受膏者”。
- source_word: οὖν
  choice: 所以
  rationale: οὖν承接上文关于和好的论述并引出结论；“所以”在现代汉语中清楚自然。
- source_word: πρεσβεύομεν
  choice: 我们作……的使者
  rationale: πρεσβεύω指担任使者或代表；“作……的使者”既准确又符合现代汉语表达。
- source_word: ὡς
  choice: 就像……一样
  rationale: 保留ὡς的比较语气，不把它改释为原因或直接等同。
- source_word: παρακαλοῦντος
  choice: 劝人
  rationale: παρακαλέω在此表示劝说、呼吁。“劝人”简洁自然，并保留神借使者发出呼吁的含义；宾语“人”由语境补明，不限定为某一群体。
- source_word: δι’ ἡμῶν
  choice: 借着我们
  rationale: διά接属格表示媒介或代理；“借着我们”准确表达神通过使徒施行劝说。
- source_word: δεόμεθα
  choice: 我们……恳求你们
  rationale: δέομαι表示迫切请求。“恳求”兼具郑重与迫切，且比“哀求”更适合使者代表受膏者发言的语境。“你们”由随后复数命令式的对象补出。
- source_word: καταλλάγητε
  choice: 要……和好
  rationale: 这是不定过去时被动命令式。汉语“与某人和好”通常不显式标示主被动，因此采用自然表达，同时不增添关于人如何促成和好的解释。
- source_word: τῷ θεῷ
  choice: 与神
  rationale: καταλλάσσω后的与格可表达和好的对象；现代汉语习惯说“与神和好”。另在脚注保留较具方向性的理解。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 受膏者
  alternative: 基督
  rationale: Χριστός在这里具有称号功能，本义为“受膏者”。正文翻出称号含义，脚注保留华语基督教传统中广为人知的“基督”。
- issue: 和好命令中的语态与施事关系
  choice: 要与神和好
  alternative: 要归向神，与他和好
  rationale: 原文以被动命令式向听者发出要求，同时上文把和好的工作归于神。汉语正文采用不强行标明施事者的自然说法，以保留神的行动与人的回应之间的张力，不把和好的机制解释得超过原文。
- issue: ὡς所表达的比较关系
  choice: 就像神借着我们劝人一样
  alternative: 神正借着我们劝人
  rationale: 保留“仿佛／就像”的比较表达，避免把原文的修辞方式改成毫无保留的直接陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”清楚衔接上文；“使者”“恳求”保留使徒职分与呼吁的郑重感。两次Χριστός均一致译为“受膏者”，避免一节内称号处理不统一。
