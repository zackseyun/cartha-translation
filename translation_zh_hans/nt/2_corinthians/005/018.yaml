  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: zh_hans
  text: 这一切都出于上帝[a]；他借着弥赛亚使我们与自己和好，又把和好的职分赐给我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切”。这句话可以广指这个新现实中的一切，也可以较具体地回指上文刚提到的事。
    reason: lexical_alternative
  - marker: b
    text: “我们”可以广指信徒；不过在上下文中，保罗也特别强调他和同工所领受的使徒性委托。
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: 这一切
  rationale: 冠词加中性复数可回指上文所说的新创造及生命转变等现实；“这一切”既保留范围的广度，也比无所限定的“一切”更贴合语境。δέ在此是轻微承接，汉语可由语序自然体现，不必另加“如今”。
- source_word: ἐκ τοῦ θεοῦ
  choice: 都出于上帝
  rationale: ἐκ表示来源；“出于上帝”准确、自然，并突出这一切以上帝为源头。
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: 他……使我们与自己和好
  rationale: 将定冠词化的过去时分词译为关系分句；καταλλάσσω表达关系由隔绝转为和好，ἑαυτῷ明确指出和好的对象是上帝自己。
- source_word: διὰ Χριστοῦ
  choice: 借着弥赛亚
  rationale: διά加属格表示媒介或施行途径；Χριστός在这里带有称号功能，因此译为“弥赛亚”。
- source_word: καὶ δόντος ἡμῖν
  choice: 又把……赐给我们
  rationale: 第二个过去时分词与前一个并列，汉语用共享主语的限定动词表达最自然；“赐给”保留礼物来自上帝的意味。
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: 使人和好的职分
  rationale: διακονία在此指受托承担的服事或使命；结合下文宣讲和好的使者语境，“职分”比泛泛的“服事”更能传达委任意味。属格τῆς καταλλαγῆς可界定该职分的内容或目的，译作“使人和好”能以自然汉语表达，同时不限定具体施行方式。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处强调上帝借其受膏者施行和好的中保角色，称号意味明显；译为“弥赛亚”可呈现Χριστός的称号性质。
- issue: ἡμᾶς与ἡμῖν所指的范围
  choice: 我们
  alternative: 所有信徒；保罗及其同工
  rationale: 原文没有明说范围。上下文既可广指信徒，又特别涉及保罗及同工所受的使徒性委托，因此正文保留“我们”，不替读者消解张力。
- issue: τῆς καταλλαγῆς的关系
  choice: 使人和好的职分
  alternative: 和好的职分；传讲和好的职分
  rationale: 该属格可表示内容或界定性质；本译文用自然中文说明这是与促成或宣告和好有关的职分，但不擅自把它缩窄为单一活动。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使我们与自己和好”保持上帝主动施行和好的语义；“职分”体现受托使命。正文仅设置两处脚注，并确保[a]、[b]均在正文出现。
