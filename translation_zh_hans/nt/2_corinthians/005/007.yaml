  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: zh_hans
  text: 因为我们行事为人，是凭着信心，不是凭着眼见[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不是凭着外在形态”，或“不是凭着所见之物”。希腊词可指可见的形态、外观或所见之物；正文译作“眼见”，以保留它与“信心”的对照。
    reason: 词义存在可成立的不同表达
lexical_decisions:
- source_word: διὰ πίστεως
  choice: 凭着信心
  rationale: διά接属格在这里表示行事的依据或方式；πίστις在与可见之物的对照中最自然地指“信心”。“凭着”既传达手段或依据，也符合现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上下文，说明前一句的理由；“因为”清楚保留其解释性连接作用。
- source_word: περιπατοῦμεν
  choice: 我们行事为人
  rationale: περιπατέω字面为“行走”，在这里按常见的隐喻用法指生活和行事。“行事为人”自然地传达此义，同时保留其关乎生活方式的力度。
- source_word: οὐ διὰ εἴδους
  choice: 不是凭着眼见
  rationale: εἶδος可指可见的形态、外观或所见之物；在与“信心”的简洁对照中，“眼见”最自然，也不把含义缩窄为表面印象。
theological_decisions:
- issue: 保罗语境中πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 本节并非“基督的信/忠信”这一所有格争议结构；πίστις与εἶδος形成对照，重点是以信心而非当前可见之物作为生活的依据。因此“信心”最贴合语境，同时不额外引入特定宗派解释。
- issue: “行走”隐喻的表达
  choice: 行事为人
  alternative: 行走；生活
  rationale: 直译“行走”在现代汉语中容易被理解为身体动作；“行事为人”准确表达περιπατέω在此处“度日、生活行事”的隐喻义，而不把它解释成某一种具体伦理行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行事为人”传达原文“行走”的生活隐喻；保留句末破折号，以反映本节在上下文中未完结的承接关系。
