id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: zh_hans
  text: 所以，若有人在弥赛亚里，便有新创造[a]；旧的事物已经过去了；看哪[b]，新的事物已经出现了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他是新创造。”希腊文是省略句，直译为：“若有人在弥赛亚里——新创造。”
    reason: alternative_reading
  - marker: b
    text: 许多译本译作“一切都变成新的了”。SBLGNT在这里没有明确表示“一切”的词，只说“新的事物已经出现了”。
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 表示由上文推出的结论，简洁保留推论关系。
- source_word: εἴ τις
  choice: 若有人
  rationale: 表达不定、普遍适用的条件，不添加希腊文没有的性别限定。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留Χριστός的称号意义，也体现保罗所说与弥赛亚联合的关系。
- source_word: καινὴ κτίσις
  choice: 就有了新创造
  rationale: 原文无系词，是简短而开放的省略句；此译法不把它限定为只指个人，同时在中文中保持通顺。
- source_word: τὰ ἀρχαῖα
  choice: 旧事
  rationale: 原文是中性复数形容词的名词性用法；“旧事”保留宽泛范围和新旧对照。
- source_word: παρῆλθεν
  choice: 已经过去
  rationale: 表达动作已发生且其结果延续至今。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的修辞力量，并采用庄重而仍可理解的现代圣经语体。
- source_word: γέγονεν καινά
  choice: 新事已经出现了
  rationale: γέγονεν的完成时强调变化所产生的现存结果；καινά为中性复数，译作“新事”，不擅自加入“万物”。
theological_decisions:
- issue: Χριστῷ应译作称号还是近似专名
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: 此处Χριστός的弥赛亚称号含义仍有意义；译出称号，也保留保罗关于“在弥赛亚里”的联合用语。
- issue: 如何处理καινὴ κτίσις的省略结构
  choice: 就有了新创造
  alternative: 他就是新造的人
  rationale: 希腊文没有明说动词或主语，可指向新创造的现实，也可作对这个人的判断。正文采用较不受限的表达，个体化读法列入脚注，以保留原文的含混和神学张力。
- issue: 是否在γέγονεν καινά中补入“万物”
  choice: 新事已经出现了
  alternative: 一切都变成新的了
  rationale: SBLGNT正文没有表示“一切”或“万物”的词，因此不在正文中扩充；传统读法在脚注中说明。
translation_notes:
  register: 采用自然、庄重、普通现代读者可理解的简体中文。“看哪”有意保留ἰδοὺ的强调语气；句中以分号呈现原文三个紧密相连的宣告。
