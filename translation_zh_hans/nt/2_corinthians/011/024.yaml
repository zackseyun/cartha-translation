    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: 被犹太人
  rationale: ὑπό加属格在这里表示施事者。“被犹太人”自然地保留原文所指的群体，又不擅自限定为某个具体的犹太权力机构。
- source_word: πεντάκις
  choice: 五次
  rationale: 直接表达动作发生五次，并与后文“每次”配合，使现代汉语清楚流畅。
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: 每次都是四十下减去一下
  rationale: 保留原文“四十减一”的表达形式；“下”根据受刑语境补出，而“每次”明确说明这一数量适用于五次中的每一次。
- source_word: ἔλαβον
  choice: 我……打过
  rationale: λαμβάνω在此表示受到刑罚。汉语被动式“我被……打过”比直译“我领受了”更自然，也准确传达受鞭打的含义。
theological_decisions:
- issue: Ἰουδαίων是否特指犹太权力机构
  choice: 犹太人
  alternative: 犹太当局
  rationale: 原文只明说施罚者为Ἰουδαῖοι，并未指明某个议会或特定治理机构，因此不作超出文本的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“打过”在被动结构中清楚表达受刑，并避免“鞭打”可能比本节明说内容更具体；保留“四十下减去一下”的原文措辞，同时用脚注解释为三十九下。
