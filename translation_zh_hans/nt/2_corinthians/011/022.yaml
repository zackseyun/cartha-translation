  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: zh_hans
  text: 他们是希伯来人吗？我也是。他们是以色列人吗？我也是。他们是亚伯拉罕的后裔吗？我也是。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，是单数形式的集合名词。
    reason: 说明σπέρμα的字面意义及其单数集合用法。
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: 希伯来人
  rationale: 采用现代汉语中固定且准确的族群与文化身份称谓，并与“以色列人”和“亚伯拉罕的后裔”保持区别。
- source_word: κἀγώ
  choice: 我也是
  rationale: 简洁自然地表达καί与ἐγώ的合并形式，保留保罗连续回应时的强调和紧凑节奏。
- source_word: Ἰσραηλῖται
  choice: 以色列人
  rationale: 准确表达属于以色列这一群体的身份，也保留原文三个彼此重叠却不完全相同的身份称谓。
- source_word: σπέρμα Ἀβραάμ
  choice: 亚伯拉罕的后裔
  rationale: “后裔”是自然、庄重的现代汉语集体称谓，能表达血统传承；脚注说明原文使用单数集合名词“种子”。
- source_word: εἰσιν
  choice: 他们是……吗
  rationale: 依照希腊文标点和上下文译作反问句，并与简短回答“我也是”相配，保留原文问答式排比。
theological_decisions:
- issue: 三个犹太身份称谓之间的细微区别
  choice: 分别保留“希伯来人”“以色列人”和“亚伯拉罕的后裔”
  alternative: 将三者统一或弱化为“犹太人”等近义称谓
  rationale: 原文有意层叠三个相关但不等同的身份与传承概念；逐一保留可避免消解保罗论述中的修辞强调和神学张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。三个短问句及三次“我也是”保留原文紧凑有力的排比；脚注标记置于相关句末。
