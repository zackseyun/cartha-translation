  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: zh_hans
  text: 我再说，不要有人以为我是愚蠢的；不然，就把我当作愚蠢的人接纳，好让我也稍微夸口一下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚蠢的”两处也可译作“愚蠢的人”：不要有人以为我是愚蠢的人……就把我当作愚蠢的人接纳。希腊语形容词ἄφρων可作形容词使用，也可作名词性理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: 我再说
  rationale: 简洁自然地表达保罗再次提出同一请求；现在时 λέγω 在直接陈述中宜译为“说”。
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: 不要有人把我看作愚昧
  rationale: “不要有人”体现 μή 加虚拟式的禁止或否定愿望；“把我看作愚昧”自然传达 δοκέω 加不定式的判断含义。
- source_word: εἰ δὲ μή γε
  choice: 不然
  rationale: 该短语转入退让性的备选请求；“不然”在现代汉语中简洁地表达“如果做不到前面所说的”。
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: 即使把我当作愚昧人，也请接纳我
  rationale: “即使……也”保留 κἂν 的让步意味；δέχομαι 译为“接纳”兼有接受其发言和容许其采取这一修辞姿态的含义。此处用名词性“愚昧人”，使汉语表达顺畅。
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: 好让我也稍微夸口一下
  rationale: “好让”表达 ἵνα 的目的意味，“也”保留 κἀγώ 的强调；“稍微……一下”自然传达 μικρόν τι，并保留 καυχάομαι 的“夸口”用语。
theological_decisions:
- issue: 保罗以“愚昧”自称并准备“夸口”的反讽
  choice: 保留“愚昧”和“夸口”的直接措辞
  alternative: 弱化为“说话不明智”或“谈一点自己的事”
  rationale: 上下文刻意把看似愚昧与不得已的夸口并置。译文应保留这种修辞张力，不替读者消解保罗的反讽。
- issue: ἄφρονα 在两处可作形容词或名词理解
  choice: 首处译“愚昧”，次处译“愚昧人”，并以脚注说明两者均可互换
  alternative: 两处都译“愚昧”或两处都译“愚昧人”
  rationale: 希腊语同一形容词在句法上可作表语或名词性使用。正文按现代汉语各自最自然的结构处理，脚注保留原文的词类歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我再说”“不然”“也请接纳我”保持保罗直接而带退让的论辩语气；“稍微夸口一下”保留其反讽，不作神学性淡化。脚注标记置于整节末尾，以免打断主句。
