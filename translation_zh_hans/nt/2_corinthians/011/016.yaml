  terminology: 保留“夸口”，以维持本段刻意的反讽性用语。将“愚昧／愚昧人”统一调整为“愚蠢的／愚蠢的人”；后者在当代汉语中比“愚昧人”更直接对应本处的“愚人”语义，且不带“未受教育、无知”的常见联想。
