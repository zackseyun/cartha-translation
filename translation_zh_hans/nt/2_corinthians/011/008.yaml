  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: zh_hans
  text: 我抢夺了别的教会，领受他们的资助[a]来服事你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “资助”较字面可译作“薪酬”、“工资”或“报酬”；原词也可指军饷。
    reason: 说明ὀψώνιον较字面的“报酬／工资”含义及其军饷词义背景，同时正文按语境译为“资助”。
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: 别的教会
  rationale: 保罗书信中的ἐκκλησία通常指地方基督徒群体；“教会”是现代汉语中自然且准确的表达。
- source_word: ἐσύλησα
  choice: 简直像是抢夺了他们
  rationale: συλάω是“抢夺、掠夺”的强烈用词。结合接受资助的语境，用“简直像是”显明其反讽性比喻，同时保留原文尖锐的修辞力度，而不让读者误以为保罗承认实际盗窃。
- source_word: λαβὼν
  choice: 接受了
  rationale: 该不定过去时分词说明保罗所谓“抢夺”的方式，即接受其他教会的供给；“接受了”符合现代汉语表达。
- source_word: ὀψώνιον
  choice: 供给的薪酬
  rationale: ὀψώνιον本指口粮、军饷，进而指薪酬。正文保留“薪酬”这一较为直接的词义，同时以“供给的”点明这是其他教会为事工提供的物质支持，而非一般雇佣关系。
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: 为了服事你们
  rationale: πρός加宾格在此表示目的或指向；结合上下文，διακονία指保罗向哥林多人所作的服事。“为了服事你们”自然清楚，也避免“你们的服事”可能造成的施受关系歧义。
theological_decisions:
- issue: 保罗说自己“抢夺”其他教会的修辞性质
  choice: 保留“抢夺”这一强烈比喻，并用“简直像是”标明反讽语气
  alternative: 直译为“我抢夺了别的教会”，或弱化为“我让别的教会受了亏损”
  rationale: 原文刻意采用强烈动词，以夸张、反讽方式描述自己接受其他教会资助、却免费服事哥林多人。译文既不应削弱其冲击力，也不应把它误呈为对实际盗窃的承认。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“简直像是抢夺了他们”保留保罗尖锐的反讽，“为了服事你们”清楚表达资助的用途。脚注标记[a]已置于正文对应词语之后。
