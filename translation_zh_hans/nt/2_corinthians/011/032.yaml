  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: zh_hans
  text: 在大马士革，亚哩达王手下的地方长官把守着大马士革人的城[a]，要捉拿我，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大马士革城”。希腊文直译为“大马士革人的城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: 在大马士革
  rationale: ἐν加与格表示地点；“在大马士革”是现代汉语自然、准确的地点表达。
- source_word: ἐθνάρχης
  choice: 地方长官
  rationale: 该词指治理某一族群或地区的官长。“地方长官”既便于现代读者理解，又避免用“总督”过度限定其确切官阶。
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: 亚哩达王手下的
  rationale: 属格表明这位长官隶属或效力于亚哩达王；“手下的”在现代汉语中自然地表达这种从属关系。
- source_word: ἐφρούρει
  choice: 把守着
  rationale: 未完成过去时表示当时持续进行的行动；“把守着”兼顾持续性以及警戒、封锁的含义。
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: 大马士革人的城
  rationale: 按希腊文保留复数属格实词“属于大马士革人的城”，不直接简化为地名“大马士革城”；较自然的替代译法列入脚注。
- source_word: πιάσαι με
  choice: 要捉拿我
  rationale: 不定式表示把守该城的目的；“捉拿”传达敌意拘捕，又不像“逮捕”那样预设正式司法程序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“地方长官”避免生硬音译古代官衔；句末保留逗号，以体现本节句意延续到下一节。
