  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: zh_hans
  text: 主耶稣的神和父，就是那位永远当受颂赞的，知道我没有说谎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远”直译为“直到诸世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 神和父
  rationale: 同一个冠词统领两个名词，构成固定表达；保留“神”和“父”两项，呈现保罗郑重指神为证的措辞。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的
  rationale: 按原文译出所有关系；原文没有“我们的”，因此不增补。
- source_word: οἶδεν
  choice: 知道
  rationale: 保留动词的直接词义；虽然整句具有起誓、请神作证的语用功能，但不扩译为“可以作证”。
- source_word: ὁ ὢν εὐλογητὸς
  choice: 就是那……当受颂赞的
  rationale: 将带冠词的分词结构自然地译为指回神的同位描述；中文用“就是那”明确承接对象。“当受颂赞”符合颂赞语境，也避免“蒙福的”可能造成的被动歧义。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是现代汉语中自然、庄重的惯用表达，传达历世无尽的颂赞含义。
- source_word: ὅτι
  choice: （引出“我没有说谎”）
  rationale: 此处引出“知道”的内容，不表原因；现代汉语无需机械译出“即/那”。
- source_word: οὐ ψεύδομαι
  choice: 我没有说谎
  rationale: 在当前郑重申明的语境中，“没有说谎”比一般性习惯陈述“我不说谎”更贴切、自然。
theological_decisions:
- issue: “神和父”与“主耶稣”的关系
  choice: 译为“主耶稣的神和父”，不回避原文所表达的位格与关系区分。
  alternative: 为缓和神学张力而改写为较含混的表达，或增添原文没有的解释。
  rationale: 译文应忠实保留原文对神、父与主耶稣之关系的陈述，不以释义消解其神学张力。
- issue: 颂赞语从句的指向与标点
  choice: 用“就是那永远当受颂赞的”作为指向“神和父”的同位插语。
  alternative: 把它处理成限制性定语，或使其可能被误解为修饰主耶稣。
  rationale: 希腊文阳性单数主格结构回指句首的神；“就是那”既保持同位说明，也使现代中文中的指向清楚。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“主耶稣的神和父”略带原文式的凝练结构，但在圣经语体中自然，并准确保留属格关系；“当受颂赞”体现颂赞公式，而非把神描述为从别处领受福分。脚注标记置于整节末尾。
