base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: zh_hans
  text: 说来惭愧，好像我们太软弱了[a]。然而，无论谁在哪一方面敢夸口——我说句愚妄话——我也敢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛我们是软弱的。”这里的“软弱”并非特指身体患病；保罗在“愚妄式”的夸口中反讽地说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: 说来惭愧
  rationale: 这是一个语境敏感的习语，可表达“以蒙羞的方式说”或“说来是羞辱”。译为“说来惭愧”符合现代汉语，又保留保罗反讽地承认自己一方仿佛不如对手的修辞意味。
- source_word: ὡς ὅτι
  choice: 似乎
  rationale: 该组合从表象或反讽性让步的角度引出下文；“似乎”自然简洁，并避免把所说的软弱断言为事实。
- source_word: ἠσθενήκαμεν
  choice: 一直都很软弱
  rationale: 完成时在这里回顾截至当时所呈现的状态；“一直都很软弱”表达延续和回顾意味。ἀσθενέω在此主要指缺乏强势、胆量或地位，而非身体患病。
- source_word: ἐν ᾧ
  choice: 无论……在哪方面
  rationale: 表示某人显出胆量的领域或事项；此译符合现代汉语表达。
- source_word: τολμᾷ
  choice: 敢夸口
  rationale: 动词本身是“敢”或“大胆”，宾语未明说；根据上下文反复谈论夸口，补出“夸口”能使中文清楚，同时不改变语义。
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: 我这是在说傻话
  rationale: 保留保罗插入的自觉修辞声明。“说傻话”比生硬的“在愚妄中说”更自然，同时表达其所谓愚妄式夸口。
- source_word: τολμῶ κἀγώ
  choice: 我也敢
  rationale: 保留与前一个τολμᾷ的重复和平行，并让“夸口”由前文自然补足。
theological_decisions:
- issue: 保罗关于自己一方“软弱”的反讽
  choice: 用“似乎”保留反讽性让步，不把软弱直接断言为事实
  alternative: 直译为“好像我们是软弱的”，或理解为对实际软弱的平直承认
  rationale: 上下文属于保罗的“愚妄式”言说，他正将自己与爱夸口的对手对照。译文应保留他表面让步与实际反讽之间的张力，而不额外断定其使徒身份或能力确实不足。
- issue: τολμᾷ所隐含的行为
  choice: 依上下文补出“夸口”
  alternative: 只译“敢”或“大胆”
  rationale: 第18、21—23节的直接语境围绕夸口展开；补出宾语有助于普通读者理解，但不把此处扩展为特定教义主张。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。“说来惭愧”承接前半句的修辞性羞辱感；破折号标示保罗插入的自我说明。脚注标记[a]已置于相关主句之后。
