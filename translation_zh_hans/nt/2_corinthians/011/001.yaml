base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: zh_hans
  text: 但愿你们容忍我这点愚妄[a]；不过，也请你们容忍我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚妄”也可译作“愚昧”或“愚蠢”。
    reason: lexical_alternative
  - marker: b
    text: 末句的动词形式也可理解为陈述：“不过，事实上你们也在容忍我。”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ὄφελον
  choice: 但愿
  rationale: 表达未必能够实现的愿望或强烈期盼；“但愿”自然、庄重，也保留原文的愿望语气。
- source_word: ἀνείχεσθέ
  choice: 你们容忍我
  rationale: 未完成时在非现实愿望结构中表达保罗希望读者作出的持续容让；“容忍”准确传达ἀνέχομαι在此“耐心承受、包容”的关系性含义。
- source_word: μικρόν τι ἀφροσύνης
  choice: 这一点愚妄
  rationale: μικρόν τι带有轻微、限缩的语气；“这一点”符合现代汉语，并保留保罗对下文言论的自谦和反讽。ἀφροσύνη译作“愚妄”，比“愚蠢”更适合庄重书面语。
- source_word: ἀλλὰ καὶ
  choice: 其实
  rationale: 该组合在这里不是简单增加另一项，而是转折后确认现实情况；“其实”自然体现更正或加强语气。
- source_word: ἀνέχεσθέ μου
  choice: 你们本来就在容忍我
  rationale: 按SBLGNT所印直陈式ἀνέχεσθε理解为对现状的确认，而非命令；加入“本来就在”体现现在时的持续性及承接语气。脚注保留另一种标点或语气理解。
theological_decisions:
- issue: 保罗称自己的言论为“愚妄”
  choice: 保留“愚妄”作为带有反讽意味的自我描述
  alternative: 意译为“说几句傻话”或弱化为“冒昧”
  rationale: 本节开启保罗反讽性的“夸口”段落；直译核心名词可保留其修辞张力，不预先替读者消解保罗所说的“愚妄”。
- issue: 末句是陈述还是劝请
  choice: 正文按直陈式译为“你们本来就在容忍我”
  alternative: 按命令或祈使语气译为“也请你们容忍我”
  rationale: SBLGNT正文ἀνέχεσθε的形态可作直陈式，也可作命令式；结合ἀλλὰ καί，可自然理解为保罗确认哥林多人确实正在容忍他。由于形态有歧义，另一理解列入脚注，不把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但愿”保留愿望语气；“容忍”在两句中重复，以呈现原文ἀνέχομαι的重复。分号表现愿望与随后确认之间紧密而有转折的关系。
