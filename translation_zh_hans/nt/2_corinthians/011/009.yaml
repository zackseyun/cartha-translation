revisions:
- from: 我在你们那里时，虽然有了缺乏，也没有连累任何人；因为我所缺少的，都由从马其顿来的弟兄们补足了。我在各方面都保守自己，不成为你们的负担，今后也必这样做。
  to: 我在你们那里时，虽有缺乏，却没有成为任何人的负担；因为从马其顿来的弟兄们补足了我所缺少的。我在一切事上都使自己不成为你们的负担，今后也必继续这样。
  rationale: 修订使“不成为负担”在前后两句保持一致，并以“使自己不成为”清楚表达保罗过去已经维持、将来仍会维持的做法。保留“弟兄们”及“马其顿”，不扩大或缩窄原文所指。
