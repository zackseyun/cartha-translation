source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: zh_hans
  text: 我在你们那里时，虽有缺乏，却没有成为任何人的负担；因为从马其顿来的弟兄们补足了我所缺少的。我在一切事上都使自己不成为你们的负担，今后也必继续这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: 我在你们那里时
  rationale: 将分词按时间背景表达，符合现代汉语习惯，也保留保罗亲自在哥林多期间的含义。
- source_word: ὑστερηθεὶς
  choice: 有了缺乏
  rationale: 指物质供应不足；此译保留与下文“我所缺少的”之间的词根呼应，又不限定缺乏的具体项目。
- source_word: οὐ κατενάρκησα οὐθενός
  choice: 没有连累任何人
  rationale: καταναρκάω在此表示因经济需要而成为他人的负担。“连累”自然地传达向人索取供养、使其受累的语境。
- source_word: τὸ ὑστέρημά μου
  choice: 我所缺少的
  rationale: 以具体而自然的汉语表达欠缺之物，并与前句“缺乏”相呼应。
- source_word: προσανεπλήρωσαν
  choice: 补足了
  rationale: 准确表达补充并填满欠缺的意义，与宾语“我所缺少的”搭配自然。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们
  rationale: 原文为阳性复数；本处很可能指从马其顿来的特定男性同工，因此在正文中保留性别信息。
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: 从马其顿来的
  rationale: 以汉语定语结构自然表达分词，保留他们来处的信息。
- source_word: ἐν παντί
  choice: 在各方面
  rationale: 表达全面范围，比逐字的“在一切事上”更符合现代汉语，同时不把范围窄化为金钱一项。
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: 保守自己，不成为你们的负担
  rationale: ἀβαρής指不使人承受重担，在上下文中特别涉及经济负担；补出“不成为”以形成自然汉语。
- source_word: ἐτήρησα καὶ τηρήσω
  choice: 保守自己……今后也必这样做
  rationale: 保留过去已维持并将继续维持这种状态的时间对照；“这样做”自然承接不成为负担。
theological_decisions:
- issue: ἀδελφοὶ的性别表达
  choice: 弟兄们
  alternative: 弟兄姊妹／信徒们
  rationale: 该词形式为阳性复数，而本处语境很可能是指从马其顿来的特定同工；不在正文中将其泛化为混合性别群体。
- issue: 保罗“不成为负担”的范围
  choice: 译为经济和关系层面的“负担”，但不明说他拒绝一切供养
  alternative: 不收你们的钱／白白服事你们
  rationale: 上下文显然涉及物质缺乏和供应，但本节措辞是“负担”，并未直接作出关于所有服事供养的一般性教义陈述，因此保留其语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文三层推进：保罗有缺乏却未连累哥林多人；马其顿来的弟兄补足所缺；保罗过去和将来都坚持不成为他们的负担。正文无需脚注即可清楚传意。
