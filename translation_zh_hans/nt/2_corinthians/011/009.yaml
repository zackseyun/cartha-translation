review_pass:
  verdict: revise
  source_fidelity: 译文准确传达保罗在哥林多期间有所缺乏、却未使任何人承担负担；来自马其顿的弟兄补足他的缺乏；并且他过去和将来都维持不成为哥林多人负担的做法。原译的“保守自己”不够准确地表达此处τηρέω维持“自己不成为负担”这一状态的意思，宜明确调整。
  naturalness: “虽然有了缺乏”与“没有连累任何人”尚可理解，但“有了缺乏”略显生硬，“连累”也可能带出原文未明说的泛化或情感色彩。采用“虽有缺乏”“不成为任何人的负担”更自然，并贴合本节的经济语境。
  terminology: “马其顿”“弟兄们”“负担”均合适。“弟兄们”保留原文阳性复数，且本处可指特定来访的男性同工；不必在正文泛化。
  issues:
  - severity: medium
    issue: “保守自己，不成为你们的负担”对τηρέω及其宾语补足结构的表达不够清楚。
    rationale: 原文意为“我使自己保持为不成为你们负担的状态，并且将继续如此”，不是一般意义上的自我保守。改为“使自己不成为……负担”可明确其所维持的状态。
  - severity: low
    issue: “连累任何人”较“成为任何人的负担”更宽泛。
    rationale: κατενάρκησα在此语境指使人承担负担，尤其与物质供应有关；“成为任何人的负担”保留原文措辞和语义范围，避免附加“连累”的负面语气。
  revised_text: 我在你们那里时，虽有缺乏，却没有成为任何人的负担；因为从马其顿来的弟兄们补足了我所缺少的。我在一切事上都使自己不成为你们的负担，今后也必继续这样。
