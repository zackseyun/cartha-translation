  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: zh_hans
  text: 有谁软弱，我不也软弱？有谁被绊倒，我内心不也如火焚烧吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我不也在燃烧吗？”这是一个比喻，可能表达强烈的悲痛、焦急、热切或愤慨。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: 软弱 / 软弱
  rationale: ἀσθενέω可指身体、社会处境或属灵方面的软弱；上下文强调保罗与他人的脆弱感同身受。“软弱”能保留原词宽泛的含义，不把它限缩为“患病”。
- source_word: σκανδαλίζεται
  choice: 被绊倒
  rationale: 被动形式表达一个人受到引诱、阻碍或伤害，以致陷入属灵或道德危险。“被绊倒”既保留原文的隐喻，也不武断限定其结果是受冒犯、犯罪还是跌倒离道。
- source_word: πυροῦμαι
  choice: 心如火焚
  rationale: πυρόομαι本义为燃烧或被点燃，此处比喻强烈的内心反应。“心如火焚”在现代汉语中自然且庄重，保留火的意象，又不把具体情绪限定为愤慨、忧伤或热切。
- source_word: τίς
  choice: 有谁
  rationale: τίς在两个修辞问句中都指人；“有谁”符合现代汉语问句习惯，也准确传达原文。
- source_word: καὶ οὐκ ἐγὼ
  choice: 我不也……？
  rationale: 原文以显式的ἐγώ强调“我”。汉语用“我不也……？”既体现保罗本人的强调，也自然传达反问语气。
theological_decisions:
- issue: πυροῦμαι所表达的内心反应
  choice: 在正文中保留燃烧的隐喻，不指定某一种情绪
  alternative: 译为“义愤填膺”“悲痛如焚”或“焦急万分”
  rationale: 原文清楚表达保罗因别人被绊倒而产生强烈反应，却没有明确规定这是愤慨、悲痛、热切还是几种情绪的交织。“心如火焚”保留其牧养上的感同身受和原文的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。两个平行反问句保留原文的节奏；第二句用“心如火焚”传达鲜明的燃烧隐喻，并以脚注说明其情绪指向具有开放性。
