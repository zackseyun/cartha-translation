  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: zh_hans
  text: 为什么呢？是因为我不爱你们吗？上帝知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“上帝知道”，没有明说他所知道的内容；上下文暗示的回答是：保罗爱他们。
    reason: 保留原文省略所产生的修辞张力，同时说明上下文中的隐含意思。
lexical_decisions:
- source_word: διὰ τί
  choice: 为什么呢？
  rationale: 用自然的现代汉语表达追问原因的修辞问句；“呢”承接上文语气。
- source_word: ὅτι
  choice: 是因为
  rationale: 在“为什么呢？”之后引出保罗设想的原因，并保留原文的问句结构。
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: 我不爱你们
  rationale: 直接保留否定、第一人称主语和复数受词；ἀγαπάω按通常意义译为“爱”。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 采用现代汉语中庄重而通行的称谓。
- source_word: οἶδεν
  choice: 知道
  rationale: 严格保留原文简洁且未明说宾语的表达，不把上下文所暗示的回答写入正文。
theological_decisions:
- issue: 结尾是否明说上帝知道保罗爱哥林多人
  choice: 上帝知道。
  alternative: 上帝知道我是爱你们的。
  rationale: 希腊文只写“上帝知道”，所知道的内容由前面的修辞问句暗示。正文保留这种省略，避免把暗示提升为明说，同时脚注帮助读者把握语境。
translation_notes:
  register: 采用简洁、庄重、自然的现代标准汉语。“为什么呢？是因为……吗？”清楚呈现连续的修辞追问；末句刻意保持原文的简短与含蓄。
