- from: 我从墙上的一个窗口，被人用筐子缒下去，逃脱了他的手。[a]
  to: 我被放在一个筐子里，从窗口沿着墙放下去，逃出了他的手中。[a]
  rationale: 修订明确保罗是在筐内被放下，借窗口并沿墙而下，从而较完整地对应原文两个διά短语；同时以自然的“逃出了他的手中”保留原文逃脱其掌控的形象。未补入“城墙”或人物身份等原文未明说的信息。
