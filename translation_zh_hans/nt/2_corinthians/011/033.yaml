  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: zh_hans
  text: 我被放在一个筐子里，从窗口沿着墙放下去，逃出了他的手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “筐子”也可译作“绳编的筐子”；“窗口”也可指墙上的开口。“沿着墙放下去”直译为“经由墙放下去”。
    reason: 说明σαργάνη可能指绳编或编织的容器，并保留θυρίς及两个διά短语所表达的空间关系。
lexical_decisions:
- source_word: θυρίδος
  choice: 窗口
  rationale: θυρίς指窗或较小的开口；“窗口”自然、具体，也与墙上的通道相符。
- source_word: σαργάνῃ
  choice: 筐子
  rationale: σαργάνη指用绳索、枝条等编成的容器；“筐子”是清楚自然的现代汉语，不武断限定材质。
- source_word: ἐχαλάσθην
  choice: 被人……缒下去
  rationale: χαλάω的被动式在此表示借助绳索等放下；“缒下去”准确呈现从高处以绳索放下的动作，“被人”则自然表达希腊语被动语态。
- source_word: διὰ τοῦ τείχους
  choice: 从墙上的……下去
  rationale: 两个διά短语共同描述保罗经由墙上窗口、穿越墙体而下的路线。中文将“墙上的”与“窗口”结合，可避免生硬重复，同时不擅自补入“城”。
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: 逃脱了他的手
  rationale: 保留希腊语“逃脱他的手”这一鲜明说法，表达脱离其掌控；现代汉语虽略带直译色彩，但清楚可懂。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“缒”较书面，但能精准表达用绳索把人从高处放下；以“筐子”保持日常可懂性。脚注标记已置于正文。
