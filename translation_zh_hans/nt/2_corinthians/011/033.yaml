  - severity: medium
    issue: “逃脱了他的手”不符合自然现代汉语搭配
    rationale: 虽然贴近希腊语意象，但汉语宜作“逃出他的手中”，既自然又保留脱离其控制的意思。
  - severity: low
    issue: “被人用筐子缒下去”对筐子作为承载工具的关系略含混
    rationale: 可被理解为用筐子把保罗下放，但改为“被放在筐子里……放下去”更明确地对应ἐν σαργάνῃ。
