  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: zh_hans
  text: 因为我认为，自己一点也不比那些“超级使徒”差[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些最卓越的使徒。”这个希腊语短语既可带讽刺意味，指所谓的“超级使徒”，也可直接指备受推崇的使徒。
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: 我认为
  rationale: 表达经过衡量而作出的判断；“我认为”在现代汉语中自然、清楚，也保留了原词的评估意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”能自然体现保罗论述中的解释关系。
- source_word: μηδὲν
  choice: 一点也不
  rationale: μηδέν在不定式前具有副词性的强调作用，意为“毫不、丝毫不”；“一点也不”准确而通俗。
- source_word: ὑστερηκέναι
  choice: 比……差
  rationale: 原词在比较语境中表示有所不及或居于劣势；“比……差”符合现代汉语习惯，同时保留比较意义。
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: 那些“超级使徒”
  rationale: ὑπερλίαν意为“极其、超乎寻常”，此处很可能带有讽刺意味。“超级使徒”保留了这种尖锐修辞；引号提示这是带有距离感的称呼，但不把讽刺解释写死。
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων是讽刺地指保罗的对手，还是正面地指声望卓著的使徒
  choice: 正文译作“那些‘超级使徒’”，保留很可能存在的讽刺意味。
  alternative: “那些最卓越的使徒”，可理解为对备受尊崇之使徒的正面称呼。
  rationale: 哥林多后书11章的论战语境倾向于讽刺性的理解，但希腊语短语本身也容许正面解释。正文呈现较可能的修辞色彩，脚注保留另一种读法，避免武断消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一点也不比……差”口吻有力，符合保罗在论辩中的自我申明；“超级使徒”加引号，以自然方式传达可能的讽刺和称谓距离，同时由脚注保留正面理解。
