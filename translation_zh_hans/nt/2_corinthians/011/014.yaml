  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: zh_hans
  text: 这并不奇怪，因为撒但自己装扮成光明的天使。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己改变成光明的天使。”希腊文动词较直译可作“改变形态”，但这里很可能是指欺骗性的外表。
    reason: 词义存在较字面的替代译法；脚注保留原文措辞的幅度，并说明上下文所支持的理解。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上一节，并把本句所说的撒但与前文假使徒的伪装联系起来；现代汉语用“也”比句首直译“并且”更自然。
- source_word: οὐ θαῦμα
  choice: 不足为奇
  rationale: 准确表达“并不令人惊奇”的惯用含义，简洁、自然，也保持庄重语气。
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: 撒但自己
  rationale: 用“自己”体现 αὐτός 的强调作用；希腊文冠词不另译。“撒但”采用现代中文圣经中常见的专名形式。
- source_word: γὰρ
  choice: 因为
  rationale: 明确引出本句对“不足为奇”的原因说明。
- source_word: μετασχηματίζεται
  choice: 装扮成
  rationale: 结合上下文关于欺骗和假冒的论述，表达改变外在形态或呈现方式，而不武断断言本体发生改变。
- source_word: εἰς
  choice: 成
  rationale: 与“装扮”构成自然的汉语结构“装扮成”，表示所呈现或假冒的身份。
- source_word: ἄγγελον
  choice: 天使
  rationale: 此处涉及撒但及超自然领域，因此译作“天使”，而非泛指的“使者”。
- source_word: φωτός
  choice: 光明的
  rationale: 保留原文“光”的属格意象；“光明的天使”在现代汉语中自然，并具有应有的象征张力。
theological_decisions:
- issue: 撒但改变形态的性质
  choice: 正文译为“装扮成”，突出欺骗性的外在呈现，不断言撒但实际成为圣洁的天使。
  alternative: “改变形态，成为光明的天使”
  rationale: μετασχηματίζεται 可指形态或外观的改变；紧邻上下文强调假使徒的伪装，因此正文采用“装扮成”。同时以脚注保留较为字面的译法及原词可能具有的表达幅度。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“不足为奇”简洁地传达原文惯用语；“装扮成”清楚呈现上下文中的欺骗意味。脚注标记置于相关整句之后。
