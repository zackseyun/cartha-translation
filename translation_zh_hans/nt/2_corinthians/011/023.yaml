base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: zh_hans
  text: 他们是弥赛亚[a]的仆人吗？我是以近乎疯狂的口气说这话：我更是——我劳苦更多，被囚更多，受击打更是超乎寻常，又屡次濒临死亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”传统上译作“基督”。
    reason: alternative_reading
  - marker: b
    text: 原文直译作“在死亡中，多次”。这很可能指屡次濒临死亡或身陷致命危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: 仆役
  rationale: 本词指服事者；“仆役”清楚表达服事关系，同时避免“教职人员”等现代制度性含义。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处在属格结构中作为称号使用，意为“弥赛亚的仆役”；脚注保留传统译法“基督”。
- source_word: παραφρονῶν λαλῶ
  choice: 我说这话，简直像疯了
  rationale: 表达保罗自觉这种自夸听来近乎疯狂；“像”保留其修辞语气，没有断定他确实疯狂。
- source_word: ὑπὲρ ἐγώ
  choice: 我更是
  rationale: 希腊文是承接前问的高度省略比较句，意思是保罗更有资格被称为弥赛亚的仆役；简洁译法保留原文的突兀和力度。
- source_word: ἐν κόποις περισσοτέρως
  choice: 我劳苦更多
  rationale: κόπος表示艰辛费力的劳作，περισσοτέρως带比较意味；译文自然保留二者。
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: 坐牢更多
  rationale: 复数指多次被囚禁的经历，而不仅是监狱这一地点；口语化程度适中，普通读者易懂。
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: 挨打多得无法计数
  rationale: πληγή可指击打、伤痕或殴打，此处不宜收窄为某一种正式刑罚；ὑπερβαλλόντως表示超过寻常限度。
- source_word: ἐν θανάτοις πολλάκις
  choice: 屡次面临死亡
  rationale: 原文以复数“死亡”形成强烈表达，语义上指反复身陷致命危险；正文采用自然汉语，脚注说明其字面形式。
theological_decisions:
- issue: Χριστοῦ的称号译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός作为称号出现在“……的仆役”这一结构中；“弥赛亚”使称号含义更透明，同时以脚注保留中文传统译名。
- issue: ἐν θανάτοις πολλάκις的理解
  choice: 屡次面临死亡
  alternative: 多次处于死亡之中
  rationale: 正文按其在苦难清单中的惯用意义译为反复遭遇致命危险，但用脚注保留原文不寻常的复数表达，避免掩盖其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文问句、突然的自我评语和递进式苦难清单；重复“更多”以呈现希腊文的比较结构，末项则以自然汉语表达并用脚注交代其特殊字面形式。
