id: 2CO.11.27
reference: 2 Corinthians 11:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: zh_hans
  text: 劳碌困苦，屡次不眠，忍饥受渴，屡次禁食[a]，受寒，衣不蔽体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禁食”也可理解为“断食”。原文表示多次不进食，但没有说明这是自愿禁食，还是环境所迫。
    reason: lexical_alternative
  - marker: b
    text: 或译“赤身露体”。此处也可能指衣物不足，身体暴露在风寒中。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ καὶ μόχθῳ
  choice: 劳碌困苦
  rationale: κόπος侧重辛劳、劳作，μόχθος侧重伴随劳作的艰苦与困顿；“劳碌困苦”保留这组近义词的累加语势，又符合现代汉语表达。
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: 屡次不眠
  rationale: ἀγρυπνία表示清醒不睡或失眠，πολλάκις表示多次发生；“屡次不眠”不额外限定为守夜或夜间失眠。
- source_word: ἐν λιμῷ καὶ δίψει
  choice: 忍饥受渴
  rationale: λιμός与δίψος分别指饥饿和口渴；“忍饥受渴”自然地表达保罗反复承受的匮乏处境。
- source_word: ἐν νηστείαις πολλάκις
  choice: 屡次禁食
  rationale: νηστεία通常指禁食，且与前面的“饥”有词义区别；译文保留“禁食”，脚注说明原文未交代这是自愿行为还是环境所迫。
- source_word: ἐν ψύχει
  choice: 受寒
  rationale: ψῦχος指寒冷这一受苦处境；“受寒”简洁地表达身处寒冷并承受其苦。
- source_word: γυμνότητι
  choice: 衣不蔽体
  rationale: γυμνότης可指赤身，也可在苦难清单中指衣物不足、身体暴露；“衣不蔽体”适合此处语境，同时以脚注保留更字面的译法。
theological_decisions:
- issue: νηστείαις所指的禁食性质
  choice: 禁食，并不说明是否自愿
  alternative: 因缺粮而挨饿；被迫断食
  rationale: νηστεία本身指不进食，而前文λιμός已经表达“饥饿”。因此正文保留词义区别，同时不把这些禁食解释为宗教操练或单纯的食物匮乏。
- issue: γυμνότητι在苦难清单中的含义
  choice: 衣不蔽体
  alternative: 赤身露体
  rationale: 上下文与“受寒”并列，可能强调缺少足够衣物、暴露于风寒之中；正文采用自然且贴合语境的表达，脚注保留字面可能性。
translation_notes:
  register: 采用现代、庄重而简洁的苦难清单体。连续使用四字或短促结构，保留原文逐项累加的修辞节奏；避免把禁食明确解释为宗教行为，也不把γυμνότης限定为完全赤裸。
