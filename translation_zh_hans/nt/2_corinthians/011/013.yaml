id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: zh_hans
  text: 因为这样的人是假使徒，是诡诈的工人，装扮成基督[a]的使徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，即“受膏者”。
    reason: 说明希腊语Χριστός的称号含义，并保留“基督／弥赛亚”两种中文表达之间的联系。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”自然地表达此处的解释关系。
- source_word: οἱ τοιοῦτοι
  choice: 这样的人
  rationale: 指上文所说的那一类人，既自然又保留了具体所指。
- source_word: ψευδαπόστολοι
  choice: 假使徒
  rationale: 准确表达该复合词所指的冒充使徒者，也是现代中文清楚简洁的说法。
- source_word: ἐργάται δόλιοι
  choice: 诡诈的工人
  rationale: 保留“工人”这一意象，并表达其以欺骗为特征的负面含义。
- source_word: μετασχηματιζόμενοι
  choice: 装扮成
  rationale: 此处强调改变外在形态或身份呈现以欺骗人，并非内在本质的转变；“装扮成”能传达主动伪装之意。
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: 成基督的使徒
  rationale: 在“装扮成”之后，εἰς表示所冒充的身份；属格Χριστοῦ表明这些使徒属于或代表基督。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是现代中文圣经语境中对Χριστός最通行且庄重的称呼；脚注说明其称号含义为“弥赛亚”。
theological_decisions:
- issue: Χριστοῦ作为称号还是近似专名的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 原词Χριστός意为“受膏者”，即“弥赛亚”；在本句属格结构中两种译法不改变所指。“基督”在现代中文中更自然、通行，同时以脚注保留称号的原义。
- issue: μετασχηματιζόμενοι所表达的改变性质
  choice: 装扮成
  alternative: 变成
  rationale: 上下文指虚假使徒以欺骗性的外表冒充基督的使徒，并不表示他们真实成为使徒；因此避免使用可能暗示本质改变的“变成”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“假使徒”“诡诈的工人”“装扮成”结构紧凑，保留原文连续定性与揭露的力度；不额外补入原文没有的解释。
