  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: zh_hans
  text: 因为，如果有人来，所传的是另一位耶稣，不是我们所传过的；或者你们领受一种不同的灵[a]，不是你们所领受过的；或者接受一种不同的福音[b]，不是你们所接受过的——你们倒很能容忍！[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不同的灵”也可译作“另一个灵”。这里的“灵”可能指被对方宣称或带来的属灵影响；原文没有进一步说明其具体所指。
    reason: lexical_alternative
  - marker: b
    text: “不同的福音”也可译作“另一个福音”。
    reason: lexical_alternative
  - marker: c
    text: “你们倒很能容忍”带有反讽语气；保罗是在责备哥林多人太容易容忍这样的来者和教导，并非称赞他们。原文也可较直译为“你们容忍得很好”。
    reason: tone_and_ambiguity
lexical_decisions:
- source_word: εἰ μὲν γὰρ
  choice: 因为，若
  rationale: 保留γάρ承接上文、说明理由的论证作用，并以现代汉语自然的条件句引出后文。μέν在此不宜机械直译。
- source_word: ὁ ἐρχόμενος
  choice: 有人来
  rationale: 带冠词的现在分词在这里作名词用，泛指来到哥林多人中间的某个人；“有人来”自然且保留其不定指意味。
- source_word: ἄλλον Ἰησοῦν
  choice: 另一个耶稣
  rationale: 直译ἄλλον，表明对方虽使用“耶稣”这一名字，所传的却不是保罗所传的那一位；不进一步解释这种差异。
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: 传 / 没有传过
  rationale: κηρύσσω指公开宣讲；“传”在中文基督教语境中简洁自然，也使前后重复清楚可见。
- source_word: πνεῦμα ἕτερον
  choice: 一个不同的灵
  rationale: ἕτερος在对比中突出性质上的不同。“灵”保留原文所指的不确定性，不擅自限定为圣灵、邪灵或某种心态。
- source_word: λαμβάνετε / ἐλάβετε
  choice: 领受 / 从未领受
  rationale: λαμβάνω在此表示得到或领受所赐予的灵。“领受”符合现代中文宗教语域，并与下一分句的δέχομαι有所区别。
- source_word: εὐαγγέλιον ἕτερον
  choice: 一个不同的福音
  rationale: “福音”是εὐαγγέλιον在保罗书信中的通行译法；“不同的”体现ἕτερον的对比力度。
- source_word: ἐδέξασθε
  choice: 接受 / 从未接受
  rationale: δέχομαι含接纳、接受之意；译作“接受”既自然，也避免与上一分句的λαμβάνω同译而掩盖用词变化。
- source_word: καλῶς ἀνέχεσθε
  choice: 你们倒很能容忍！
  rationale: ἀνέχομαι意为忍受、容忍；καλῶς在上下文中带反讽。“倒很能”以自然汉语传达保罗责备他们过于宽容的语气，同时不明说所容忍的是人还是其教导。
theological_decisions:
- issue: “不同的灵”的所指
  choice: 保留为泛称“一个不同的灵”
  alternative: 明确译为被歪曲的圣灵、邪灵，或不同的精神状态
  rationale: πνεῦμα ἕτερον本身没有在此明确限定其所指；保留开放性可避免把某一种神学解释写入正文。
- issue: καλῶς ἀνέχεσθε的语气
  choice: 按反讽性的责备处理
  alternative: 理解为直面的称赞或中性的陈述
  rationale: 本章上下文显示保罗并非赞许哥林多人，而是在责备他们轻易容忍竞争者及其信息；“倒很能容忍”保留了反讽。
- issue: ἀνέχεσθε隐含宾语
  choice: 中文不补出明确宾语
  alternative: 补作“容忍他”或“容忍这些事”
  rationale: 希腊文此处没有明示宾语，可能涵盖来者、其宣讲或整件事；不补宾语可保存这一含混性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个并列条件以分号展开，保持原文的递进和平行结构；末句用破折号与感叹号凸显反讽性的结论，但避免添加原文未明说的宾语或神学解释。
