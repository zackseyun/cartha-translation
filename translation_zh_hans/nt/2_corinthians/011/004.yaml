revisions:
- from: 因为，若有人来传另一个耶稣，是我们没有传过的；或者你们领受一个不同的灵[a]，是你们从未领受的；或者接受一个不同的福音[b]，是你们从未接受的——你们倒很能容忍！[c]
  to: 因为，如果有人来，所传的是另一位耶稣，不是我们所传过的；或者你们领受一种不同的灵[a]，不是你们所领受过的；或者接受一种不同的福音[b]，不是你们所接受过的——你们倒很能容忍！[c]
  rationale: 修订仅改善现代汉语的指称和句法，并将“从未”收回为与原文否定过去时相称的“没有……过”。三个条件分句、术语区别（“领受”与“接受”）、“灵”的开放所指，以及καλῶς ἀνέχεσθε的反讽均予保留。
