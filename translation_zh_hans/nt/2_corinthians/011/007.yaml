  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: zh_hans
  text: 还是说，我使自己卑微，好叫你们得以升高，因为我白白地把上帝的福音传给你们，竟是犯了罪吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白地”在这里指“不收报酬地”或“免费地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: 还是说
  rationale: 承接上文，引出尖锐的反问；“还是说”符合现代汉语的论辩语气。
- source_word: ἁμαρτίαν ἐποίησα
  choice: 竟是犯了罪吗
  rationale: 希腊语直译为“做了一件罪”，汉语自然表达为“犯了罪”；加“竟”传达反问中的讽刺意味，但不另作神学解释。
- source_word: ἐμαυτὸν ταπεινῶν
  choice: 自甘卑微
  rationale: 保留反身意义和身份、地位上的自我降低，并与后面的“升高”形成清楚对照。
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: 为要使你们升高
  rationale: 保留目的关系及被动式所表达的地位提升，不把具体方式解释得超出原文。
- source_word: ὅτι
  choice: （整合为反问的事实根据）
  rationale: 此处说明所谓“犯罪”的具体根据；汉语将相关分句前置，可更自然地表达同一逻辑关系。
- source_word: δωρεὰν
  choice: 白白地
  rationale: 表达“不收取报酬、免费”的意思，同时保留该词也可表示无偿给予的色彩；用脚注澄清本处含义。
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: 上帝的福音
  rationale: 自然、庄重地保留属格结构和保罗书信中的惯用神学表述。
- source_word: εὐηγγελισάμην ὑμῖν
  choice: 把……传给你们
  rationale: 在“福音”作宾语时，“传给你们”是自然现代汉语，准确表达向受众宣告福音。
theological_decisions:
- issue: 保罗关于自我卑微与不收报酬的反问
  choice: 保留为带讽刺意味的直接反问，不对传道者接受供养是否正当作额外判断
  alternative: 扩写为保罗放弃使徒应有权利，或弱化成单纯的道歉
  rationale: 原文将“自甘卑微”“使你们升高”和“白白传福音”置于是否犯罪的反问中；译文应保留这种张力，而不代替作者作超出本节的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。调整分句顺序，使因果和反问在汉语中自然清晰；以“自甘卑微／使你们升高”保留原文的身份反转和修辞对照。
