id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: zh_hans
  text: 屡次旅行，遭遇江河的危险、强盗的危险、来自本族人的危险[a]、来自外族人的危险、城里的危险、旷野里的危险、海上的危险，以及假弟兄中间的危险[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同族人”或“本国人”；希腊原文直译为“本族的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“假信徒中间”；希腊原文直译为“假弟兄中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: 屡次旅行
  rationale: ὁδοιπορίαις为“旅程、旅行”的复数与格，πολλάκις意为“屡次、常常”。译文简洁自然，也保留了反复奔波的意思。
- source_word: κινδύνοις
  choice: 危险
  rationale: 原文反复使用κινδύνοις，形成逐项累积的修辞节奏；中文在各项中重复“危险”，尽量再现这种强调。
- source_word: ποταμῶν
  choice: 江河
  rationale: 原文只说明危险与河流有关，并未明确是洪水、渡河还是其他情形；“江河”保留其概括性。
- source_word: λῃστῶν
  choice: 强盗
  rationale: λῃστής指抢劫者或匪徒；“强盗”是现代中文中清楚且符合旅途语境的表达。
- source_word: ἐκ γένους
  choice: 来自本族人
  rationale: γένος在此指保罗所属的族群或同胞；“本族人”保留族群含义，又没有把原文未明说的“犹太人”直接加进正文。
- source_word: ἐξ ἐθνῶν
  choice: 来自外族人
  rationale: 此语与ἐκ γένους形成对照，指保罗本族以外的人，即非犹太人；“外族人”自然呈现这组对比，同时避免把ἔθνη机械译作“列国”。
- source_word: ἐν πόλει
  choice: 城里
  rationale: 保留原文单数的概括用法，并与“旷野里”“海上”形成地点上的对照。
- source_word: ἐν ἐρημίᾳ
  choice: 旷野里
  rationale: ἐρημία可指荒野、沙漠或人烟稀少之地；“旷野”范围较宽，且是现代中文圣经语体中自然庄重的表达。
- source_word: ἐν θαλάσσῃ
  choice: 海上
  rationale: “海上”符合中文对航海处境的惯常说法，也准确表达海中或海上所遇的危险。
- source_word: ἐν ψευδαδέλφοις
  choice: 假弟兄中间
  rationale: ψευδάδελφοι字面为“假弟兄”，指自称为弟兄却名不副实的人；直译保留其关系性和尖锐程度，不预先判定他们具体属于哪一类信徒。
theological_decisions:
- issue: 如何表达ἐκ γένους与ἐξ ἐθνῶν的族群对照
  choice: 来自本族人／来自外族人
  alternative: 来自犹太人／来自外邦人
  rationale: 上下文确实指向保罗的犹太同胞与非犹太人，但希腊原文前项只说“本族”，后项说“各民族／外族人”。正文采用较贴近原文的对应表达，既保留对照，也不把隐含身份直接明文化。
- issue: 如何翻译ψευδαδέλφοις
  choice: 假弟兄中间
  alternative: 假信徒中间
  rationale: 原词明确含有“弟兄”这一关系称谓。译作“假弟兄”保留原文措辞以及他们自称或被视为群体内成员所造成的张力；“假信徒”虽能解释可能含义，却会把译文解释得更确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以重复“危险”保留原文清单式的累积节奏；同时用顿号组织长串并列项，使朗读清晰。“假弟兄”保留原文男性复数关系称谓，不扩写为“弟兄姊妹”，也不以解释性译法取代正文。
