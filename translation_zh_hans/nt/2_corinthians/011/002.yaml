  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: zh_hans
  text: 因为我为你们怀着属上帝的嫉妒[a]；我已经把你们许配给一位丈夫，要把你们作为贞洁的童女呈献给弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以合乎上帝心意的嫉妒”。希腊语可指属于上帝或上帝所具有的嫉妒，也可指具有上帝特质的嫉妒。
    reason: 词义及属格关系存在歧义
  - marker: b
    text: 也可译作“基督”。希腊语 Χριστός 意为“受膏者”，与“弥赛亚”相当。
    reason: 称号的译法选择
lexical_decisions:
- source_word: ζηλῶ
  choice: 为你们怀着……妒爱
  rationale: ζηλόω可表示热切关怀或保护性的嫉妒。婚约语境强调专一、守约的关切；“妒爱”保留嫉妒与热忱之间的张力，同时避免让人误解为卑劣的眼红。
- source_word: θεοῦ ζήλῳ
  choice: 上帝的妒爱
  rationale: 直译属格关系，不武断限定为“上帝所怀的”或“合乎上帝心意的”；两种可能由脚注说明。
- source_word: ἡρμοσάμην
  choice: 我已经把你们许配
  rationale: 该动词在此指安排婚约、许配；“许配”自然而庄重，也保留婚姻比喻。
- source_word: ἑνὶ ἀνδρὶ
  choice: 给一位丈夫
  rationale: ἀνήρ可指男人或丈夫；婚约语境明确支持“丈夫”，而“一位”保留专一性。
- source_word: παρθένον ἁγνήν
  choice: 贞洁的童女
  rationale: 同时保留παρθένος的童贞婚嫁形象和ἁγνός的纯洁含义；“贞洁”在此比笼统的“纯洁”更贴合婚约语境。
- source_word: παραστῆσαι
  choice: 献给
  rationale: 表达把人郑重带到另一位面前、交付给对方的意思；“献给”符合庄重的婚嫁呈献意象。
- source_word: τῷ Χριστῷ
  choice: 给弥赛亚
  rationale: 带冠词的Χριστός在此具有称号意味，本义为“受膏者”；“弥赛亚”能直接呈现这一称号，脚注保留传统译名“基督”。
theological_decisions:
- issue: 保罗所说“妒爱”的性质
  choice: 保留其与上帝及婚约专一性有关的保护性妒爱
  alternative: 仅理解为保罗个人热切的关怀，或译为“属上帝的热忱”
  rationale: θεοῦ ζήλῳ既可能表示属于或源于上帝的妒爱，也可能表示具有上帝特质的热忱。婚约意象支持保护性的、守约的专一关切，但译文和脚注不把属格关系限定为唯一解释。
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节将其置于新郎角色，且希腊文使用冠词，称号意味较明显；采用“弥赛亚”，同时在脚注交代“基督”这一传统对应词。
- issue: 群体与单数童女的比喻
  choice: 保留“你们”与单数“童女”的搭配
  alternative: 将其解释性改写为“使你们全体像一位贞洁的童女”
  rationale: 原文把哥林多群体整体比作一位童女；保留数的不对称，可维持其集体新妇意象而不额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妒爱”虽不如“嫉妒”常用，却能在婚约语境中表达出于爱与专一要求的保护性关切，避免“嫉妒”在现代汉语中通常带有的卑劣意味。分号呈现两个γάρ分句之间紧密而递进的论证关系。
