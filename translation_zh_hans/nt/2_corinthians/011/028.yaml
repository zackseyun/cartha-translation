  text: χωρὶς τῶν παρεκτὸς ἡ ⸀ἐπίστασίς ⸀μοι ἡ καθ’ ἡμέραν, ἡ μέριμνα πασῶν τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: zh_hans
  text: 除了别的事[a]，还有天天压在我身上的重担[b]，就是为众教会挂心[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除了这些外在的事”，“除了其他的事”，或“除了那些没有提到的事”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“还有我天天所受的压力”，或“还有天天逼迫我的事”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“就是为众教会忧虑”，或“就是关怀众教会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: 除了这些外在的事
  rationale: χωρίς加属格表示“除……以外”；παρεκτός在这里可指前述清单以外的事，也可能指外在临到的患难。“这些外在的事”自然承接上文，同时用脚注保留“其他的事”和“未提到的事”等可能。
- source_word: ἐπίστασίς μοι
  choice: 压在我身上的重担
  rationale: ἐπίστασις可表示逼迫、压力或重压；与后面的μέριμνα并列解释时，较适合按保罗所承受的内在重压来理解。μοι译作“在我身上”，保留压力临到他的体验性。
- source_word: ἡ καθ’ ἡμέραν
  choice: 天天
  rationale: καθ’ ἡμέραν表示逐日发生、每天不断；“天天”简洁自然，并修饰压在保罗身上的重担。
- source_word: ἡ μέριμνα
  choice: 挂心
  rationale: μέριμνα可表示关切、忧虑或操心。“挂心”既传达真切而沉重的牧养关怀，又不预先把这种情绪判定为有罪的忧虑。
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: 为众教会
  rationale: ἐκκλησία在保罗书信中通常指基督徒的会众或教会；“众教会”准确表达复数和整体范围。属格与μέριμνα的关系用“为”自然呈现。
theological_decisions:
- issue: μέριμνα所表达的使徒牧养负担
  choice: 译作“挂心”
  alternative: “为众教会忧虑”或“关怀众教会”
  rationale: 经文描述保罗为各教会所承受的真实情感重担，并未在此评判这种感受是否属于有罪的忧虑。“挂心”保留关爱与沉重感之间的张力。
- issue: μέριμνα与ἐπίστασις的句法关系
  choice: 用“就是”表明“为众教会挂心”说明前面的日常重担
  alternative: 将二者并列为两个彼此独立的负担
  rationale: 两个带冠词的名词短语很自然地构成同位关系；“就是”使现代汉语清楚流畅，但不改变重压本身与挂心内容之间的紧密联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外在的事”承接上文所列的苦难；“天天压在我身上的重担”保留原文压力临身的形象；“挂心”兼具牧养关切和情感负荷。脚注标记均置于正文相应词组之后。
