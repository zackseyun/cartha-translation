  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: zh_hans
  text: 如果必须夸口，我就要夸自己软弱的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我就要夸自己的种种软弱。”希腊文较为直译是：“我就要夸自己软弱的事。”
    reason: 说明原文名词结构既可按其形式译为与软弱有关的“事”，也可用较自然的汉语概括为“种种软弱”。
lexical_decisions:
- source_word: Εἰ
  choice: 如果
  rationale: 保留希腊文条件句的形式及其修辞作用，不将其解释成带因果意味的“既然”。
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: 夸口 / 我就要夸
  rationale: “夸口”自然对应保罗此处反复使用的同一词根，也保留上下文中的反讽意味和修辞呼应。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达非人称动词所表示的必要性，措辞简洁有力。
- source_word: τὰ τῆς ἀσθενείας μου
  choice: 自己软弱的事
  rationale: 此表达保留中性复数冠词所指的“事情、方面”，也保留属格结构与“软弱”的关系，避免直接简化为“我的种种软弱”。
- source_word: ἀσθενείας
  choice: 软弱
  rationale: “软弱”是现代汉语中清楚且符合保罗用语的表达；它既可涉及人的有限，也可涵盖上下文中使人受辱、显得无力的处境。
theological_decisions:
- issue: 保罗夸口的性质
  choice: 直译为夸“自己软弱的事”，保留以软弱为夸口内容的悖论和反讽。
  alternative: 意译为“夸自己的种种软弱”或解释为“夸那些显出我软弱的事”。
  rationale: 原文刻意把“夸口”与“软弱”并置。正文不补入教义性解释，也不消解二者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如果必须……我就要……”保持原文简洁的条件结构；“自己软弱的事”略带原文特有的表达张力，脚注提供更地道的替代译法。
