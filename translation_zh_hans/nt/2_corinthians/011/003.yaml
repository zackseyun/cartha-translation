  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: zh_hans
  text: 但我担心，唯恐你们的心思会受到败坏，偏离你们对弥赛亚[c]所怀的纯一[b]和纯洁[a]，正如蛇曾用诡诈欺骗夏娃一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“和纯洁”。
    reason: textual_variant
  - marker: b
    text: “纯一”也可译作“真诚”、“单纯”或“专一”。
    reason: lexical_alternative
  - marker: c
    text: 希腊语为 Christos，意为“受膏者”；传统上常译作“基督”。
    reason: title_rendering
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: 但我怕……也可能
  rationale: 用自然的现代汉语表达保罗持续的忧虑，并保留 μή πως 所含不确定而令人担心的可能性。
- source_word: ὁ ὄφις
  choice: 蛇
  rationale: 既准确表达原词，也自然承接《创世记》中蛇欺骗夏娃的典故。
- source_word: ἐξηπάτησεν Εὕαν
  choice: 欺骗了夏娃
  rationale: 清楚表达动词的欺骗之意；“夏娃”采用通行中文人名。
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: 用诡诈
  rationale: 将 ἐν 表达为手段；“诡诈”兼具狡猾与欺骗的含义。
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: 你们的心思也可能受到败坏
  rationale: “心思”能涵盖思想、意念和思维取向；“受到败坏”保留被动形式及其有害改变的力度。
- source_word: ἀπὸ
  choice: 偏离
  rationale: 在汉语中自然表达从某种品格或归向上被带离的分离含义。
- source_word: τῆς ἁπλότητος
  choice: 纯一
  rationale: 这里指向弥赛亚的真诚、单纯而不分心的归向；“纯一”较能同时保留单纯与专一的意味。
- source_word: καὶ τῆς ἁγνότητος
  choice: 和纯洁
  rationale: “纯洁”保留 ἁγνότης 的宽泛道德含义，也与上文贞洁童女的比喻相呼应，而不把含义局限于性方面。
- source_word: τῆς εἰς τὸν Χριστόν
  choice: 你们对弥赛亚所怀的
  rationale: 明确该介词短语修饰“纯一和纯洁”，并把 Χριστός 按仍具称号作用的用法译为“弥赛亚”。
theological_decisions:
- issue: Χριστόν 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 指向耶稣的受膏者身份，译出称号含义；脚注保留中文圣经传统中常见的“基督”。
- issue: ἁπλότης 的含义
  choice: 纯一
  alternative: 真诚；单纯；专一
  rationale: 上下文关乎对弥赛亚不受迷惑、未被分割的归向。“纯一”避免只强调诚实，同时保留单纯和专一之间的语义张力。
- issue: 是否收入 καὶ τῆς ἁγνότητος
  choice: 正文收入“和纯洁”
  alternative: 省略该短语
  rationale: SBLGNT 正文收入此短语，因此正文翻译；部分抄本省略的异文在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“你们对弥赛亚所怀的”使修饰关系清楚；“纯一”虽略具书面色彩，但能简洁保留原文关于单纯、真诚和专一的多重意味。
