  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: zh_hans
  text: 所以，他的仆役也伪装成公义的仆役[a]，并不是什么稀奇的事。他们的结局必照着他们的行为而定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义的仆役”。希腊词既可指“公义”，也可指“正义”；这里是说他们假装与正确、正直相符。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: 并不是什么稀奇的事
  rationale: 这是表示某事不足为奇的习语。译文采用现代汉语自然表达，同时保留其否定语气。
- source_word: οὖν
  choice: 所以
  rationale: 表明本句是从上一节所得出的推论；“所以”简洁自然。
- source_word: διάκονοι
  choice: 仆役
  rationale: 此处指为撒但效力的人。“仆役”既保留服事、受差遣的含义，又避免“执事”或“传道人”所带来的教会职分联想。
- source_word: μετασχηματίζονται
  choice: 装扮成
  rationale: 该动词在上下文中指外表或身份呈现上的伪装，并非内在本质的改变；“装扮成”准确传达欺骗意味。
- source_word: ὡς
  choice: 成
  rationale: 与“装扮”组成“装扮成”，自然表达他们所假冒的身份。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: “公义”可表达道德上的正直以及与正确、公正相符的状态；其“正义”义项以脚注保留。
- source_word: τὸ τέλος
  choice: 结局
  rationale: 指他们最终将遭遇的结果或归宿；“结局”符合审判语境，也为现代读者所熟悉。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 照着他们的行为而定
  rationale: 保留结局与所行之事相称的审判公式。“行为”比“工作”更能准确表达此处具有道德意义的ἔργα。
theological_decisions:
- issue: 保罗书信中 δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: 本句着重这些人假装与正确、正直相符，并不要求把词义限定为司法意义的“正义”。正文采用涵盖道德正直且有圣经语体庄重感的“公义”，脚注保留“正义”这一真实可能。
- issue: κατὰ τὰ ἔργα αὐτῶν 所表达的审判关系
  choice: 他们的结局必照着他们的行为而定
  alternative: 他们的结局必与他们的行为相称
  rationale: 译文只表达结局与行为相对应，不进一步解释这句话与保罗其他救恩论述的系统关系，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仆役”保留为他者效力的关系，“装扮成”清楚呈现上下文中的欺骗意味。句子分为两句，使逻辑和最终审判的重点更清晰；脚注标记已置于正文相应词组之后。
