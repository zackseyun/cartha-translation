  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: zh_hans
  text: 即使我不善言辞[a]，但在知识上并非如此；事实上，我们已经在一切事上、以各种方式向你们显明了这一点[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即使我在言辞上没有受过训练”，指缺乏讲究的修辞技巧。
    reason: lexical_alternative
  - marker: b
    text: 原文末句十分简练，也可理解为：“我们已经在各方面、在众人面前向你们显明了”，或“我们已经在各样事情上向你们显明了”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: 不擅长讲话
  rationale: 这里所说的是言语表达或修辞训练不足，并非普遍无知。“不擅长讲话”自然易懂，并与下文“知识”形成清楚对比。
- source_word: γνώσει
  choice: 知识
  rationale: 保留原词的基本意义，并准确呈现保罗在表达技巧与实际认识之间所作的对比。
- source_word: ἐν παντί
  choice: 以各种方式
  rationale: 按副词性用法表达全面性，同时避免拘泥地重复“一切”。
- source_word: φανερώσαντες
  choice: 我们已经……显明了
  rationale: 保留主动复数的主体，并以汉语完成体表达此前已经公开证实的意思；“这一点”是为使省略宾语的希腊语在汉语中通顺而补出。
- source_word: ἐν πᾶσιν
  choice: 在一切事上
  rationale: 保留原文宽泛而压缩的表达，不在正文中限定为所有人、所有场合或所有事项。
- source_word: εἰς ὑμᾶς
  choice: 向你们
  rationale: 自然表达行动朝向哥林多信徒以及他们作为领受者的关系。
theological_decisions:
- issue: 保罗对自己言语能力的自我描述
  choice: 承认自己不擅长经过修饰的言语表达，但不承认缺乏知识
  alternative: 保罗承认自己普遍没有学问；或这句话完全是反讽，并未承认任何不足
  rationale: “言语”与“知识”的直接对比表明，焦点在表达或修辞能力，而不是权柄、真理或整体教育程度。
- issue: 末句所显明的内容
  choice: 用“这一点”承接保罗在知识上并不欠缺的陈述
  alternative: 不补宾语；或明确译作“我们的知识”
  rationale: 原文没有明说宾语。正文仅以指示语承接上文，使汉语通顺，同时不把所显明的内容限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不擅长讲话”避免“粗俗”可能带来的失礼或低劣含义；末句保留两个表示全面范围的短语，并用脚注说明其句法压缩所产生的歧义。
