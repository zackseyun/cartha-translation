  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: zh_hans
  text: 既然有许多人按肉体夸口[a]，我也要夸口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按人的标准”，或“以纯属人的方式”。
    reason: 说明κατὰ σάρκα在本语境中的惯用含义，同时不取代正文较贴近原文的表达。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 既然
  rationale: 引出保罗采取同样修辞方式的理由；“既然”自然地保留因果语气。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 准确表达数量意义，也符合现代汉语的庄重书面语体。
- source_word: καυχῶνται / καυχήσομαι
  choice: 夸口 / 要夸口
  rationale: 前后使用同一词根，保留原文刻意的重复及上下文中的反讽、论辩语气。
- source_word: κατὰ σάρκα
  choice: 按着肉体
  rationale: 保留σάρξ的具体措辞及其保罗书信中的神学张力，不在正文中把它完全解释为“按人的标准”；脚注说明其语境含义。
- source_word: κἀγώ
  choice: 我也
  rationale: 体现καί与ἐγώ结合所表达的对应和强调：别人如此夸口，保罗也将如此。
theological_decisions:
- issue: κατὰ σάρκα中σάρξ的译法
  choice: 按着肉体
  alternative: 按人的标准；以纯属人的方式
  rationale: 这里不是单指身体，也不宜直接译成“罪性”。保留“肉体”可维持原文的真实歧义和神学质感，而脚注提供本语境下可能的惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着肉体”略带经文语体色彩，但仍可理解，并有助于保留原文关键词；以脚注补足自然汉语中的语义说明。
