  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: zh_hans
  text: 我所说的，不是照主的准则说的[a]，而是像在愚妄中说的[b]，带着这种夸口的把握[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照主的准则说”也可译作“作为从主而来的话说”，或“照着主的方式说”。
    reason: alternative_reading
  - marker: b
    text: “像在愚妄中说的”也可译作“仿佛在愚妄中说”，或“像个愚妄人那样说”。
    reason: lexical_alternative
  - marker: c
    text: 译作“把握”的希腊词在这里也可指“事情”、“根据”或“所从事的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: 我所说的
  rationale: 以自然的现代汉语表达关系代词所引出的当前言说内容，并保留现在时的语境意味。
- source_word: κατὰ κύριον
  choice: 按着主
  rationale: κατά加宾格在此可表示规范、准则或方式；“按着主”保留它究竟指主的方式、准则还是权威来源的含混性。
- source_word: κύριον
  choice: 主
  rationale: 此处最自然地指主耶稣；正文无需补明，以免超出原文。
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: 而是仿佛在愚妄中说的
  rationale: 保留ὡς的比较或限定语气，以及ἐν所表达的状态或言说方式；不直接把保罗定性为愚妄人。
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: 带着这种……自信
  rationale: ὑπόστασις在这里语义较难确定，可能指自信、把握、根据或所从事的事；正文采用符合夸口语境的“自信”，并用脚注保留其他可能。
- source_word: τῆς καυχήσεως
  choice: 夸口的
  rationale: 以属格修饰“自信”，保留καύχησις的动作意味及其与上下文“夸口”主题的联系。
theological_decisions:
- issue: “按着主”（κατὰ κύριον）的所指和作用
  choice: 正文让保罗表明这种夸口式的言说不是按着主而说，却不具体断定这是指主的方式、准则还是权威来源。
  alternative: 也可理解为保罗没有在这里转述主的直接命令，或这话不是作为从主而来的话说的。
  rationale: 上下文较可能是保罗刻意把自己的夸口方式与主的样式区分开，而不是否认所言的真实性或经文权威；译文保留神学张力，不在正文中替读者定论。
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。“按着主”和“夸口的自信”略带原文结构色彩，是为保留本节两处真实的语义困难；脚注提供较自然或不同取向的读法。
