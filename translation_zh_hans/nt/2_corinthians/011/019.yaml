  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: zh_hans
  text: 因为你们既是聪明人，[b]竟还乐意容忍[a]愚妄的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容忍”也可译作“忍受”。
    reason: lexical_alternative
  - marker: b
    text: 保罗在这里使用反讽：“愚妄的人”与“聪明人”的对比显出这种语气。
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: 乐意
  rationale: 表达甘愿或欣然接受；在本句反讽语境中，“乐意”自然、简洁，又不额外强化为真正的喜悦。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”清楚保留其解释性连接作用。
- source_word: ἀνέχεσθε
  choice: 容忍
  rationale: 该动词表示忍受、容让某人；“容忍”符合现代汉语，也保留保罗略带尖锐的责备语气。
- source_word: τῶν ἀφρόνων
  choice: 愚妄人
  rationale: 指缺乏判断力的人。“愚妄人”与下文“聪明人”形成直接对照，同时具有庄重而易懂的经文语体。
- source_word: φρόνιμοι
  choice: 聪明人
  rationale: 表示明智、精明的人；此处带有反讽意味，并与“愚妄人”构成鲜明对比。
- source_word: ὄντες
  choice: 既是
  rationale: 保留分词与“聪明人”的联系，同时不把其逻辑关系完全限定为原因或让步；结合“竟还”使汉语自然，并传达上下文中的反讽。
theological_decisions:
- issue: 保罗对哥林多人的反讽
  choice: 正文直接保留“愚妄人”与“聪明人”的对照，以“竟还”传达语气，并用脚注说明反讽。
  alternative: 不加“竟还”，译作“因为你们既是聪明人，就乐意容忍愚妄人”。
  rationale: 希腊文通过“愚妄”与“聪明”的并置产生反讽。汉语若机械照搬，容易被误读为真诚称赞；“竟还”仅使原有语用张力自然显出，并未引入特定教义解释。
- issue: ὄντες所表达的逻辑关系
  choice: 译作“既是”，不明确限定为纯粹因果或让步。
  alternative: 译作“虽然你们聪明”或“因为你们聪明”。
  rationale: 分词本身容许语境决定其关系；避免将其过早固定为让步或因果，可保存原文的语法含混与反讽张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“愚妄人—聪明人”保留原文词义对照；“竟还”使希腊文在语境中的反讽以自然汉语呈现。所有脚注标记均置于正文对应处。
