  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: zh_hans
  text: 基督的真理在我里面[a]——我这番夸口，在亚该亚各地绝不会被止住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按语序译作“我里面有基督的真理”。“基督的真理”中的属格关系未作进一步说明；也可能强调基督的真诚。
    reason: alternative_reading
  - marker: b
    text: 原文此处的表达较难，直译近于“这夸口不会就我被止住”。也可译作“这夸口不会因我而止息”或“我这番夸口不会被拦阻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: 基督的真理
  rationale: 保留属格结构及其关系或归属意味，不把它过度限定为“关于基督的真理”或“基督所说的真话”。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 按原文保留空间性表达，也维持保罗郑重断言、近似誓言的语气。
- source_word: ὅτι
  choice: 以破折号引出断言内容
  rationale: 此处ὅτι引出郑重断言的内容；现代汉语用破折号比生硬译成“因为”或“就是”更自然，同时不额外解释其逻辑关系。
- source_word: ἡ καύχησις αὕτη
  choice: 我这番夸口
  rationale: “这番夸口”自然表达该抽象名词在本语境中的言说行为；“我”结合εἰς ἐμέ所指的与保罗有关之意。
- source_word: οὐ φραγήσεται
  choice: 绝不会被止住
  rationale: 保留将来被动及“阻塞、封住”的比喻核心；“被止住”在现代汉语中比“被堵塞”更适合修饰“夸口”。
- source_word: εἰς ἐμὲ
  choice: 我这番夸口
  rationale: 希腊语搭配较难，正文用所属式自然传达“就我而言／属于我的”之意，脚注保留其他可能理解。
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: 在亚该亚各地
  rationale: κλίμασι为复数，表示各区域或地区；“各地”简洁自然，并保留复数范围感。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 在现代中文圣经和基督教语境中，“基督”既是Χριστός的通行译名，也能保留其受膏者称号背景；此处不必因英语层的“Messiah”而采用较不自然的“弥赛亚”。
- issue: ἀλήθεια Χριστοῦ的属格关系
  choice: 基督的真理
  alternative: 关于基督的真理／基督所具有的真实
  rationale: 原文属格可表达归属、关联等关系；正文保留开放的属格结构，避免把神学含义限定为某一种。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。破折号承接原文近似誓言的郑重断言；“绝不会”体现οὐ与将来式的强烈语气。正文不强行消除εἰς ἐμέ及属格结构的歧义，相关可能性置于脚注。
