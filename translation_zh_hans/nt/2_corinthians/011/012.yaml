source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: zh_hans
  text: 但我现在所做的，将来还要继续做，为要断绝那些想找机会之人的机会[a]，使他们在所夸耀的事上，也被发现和我们一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “机会”也可译作“时机”或“借口”；本节两处均译自同一个希腊词。
    reason: 保留ἀφορμή在此处可能具有的不同语义色彩，并说明原文有意重复用词。
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: 但我现在所做的，将来还要继续做
  rationale: 现在时与将来时并用，表达保罗目前的做法以及继续如此行的决心；译文将这一时态关系自然地表达出来。
- source_word: ἐκκόψω
  choice: 断绝
  rationale: 保留ἐκκόπτω“切断、除去”的鲜明比喻，同时符合现代汉语搭配。
- source_word: ἀφορμή
  choice: 机会
  rationale: ἀφορμή可指机会、由头或借口。“机会”较为中性，避免把上下文可能包含的负面意味直接写进正文。
- source_word: τῶν θελόντων ἀφορμήν
  choice: 那些想找机会之人
  rationale: 保留原文对ἀφορμή的重复，并以“找机会”表达主动寻求某种可乘之机的语气。
- source_word: ἐν ᾧ καυχῶνται
  choice: 在所夸耀的事上
  rationale: 表达ἐν ᾧ所指的夸耀范围或事项，不额外限定他们具体夸耀什么。
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: 被看出和我们一样
  rationale: 保留εὑρεθῶσιν的被动意义以及καθὼς的比较关系，同时使用自然现代汉语。
theological_decisions:
- issue: 保罗的对手所寻求之ἀφορμή的性质
  choice: 正文中性译为“机会”
  alternative: “借口”或“由头”
  rationale: 本节语境带有论战色彩，但ἀφορμή本身并不必然表示带道德判断的“借口”。正文保留词义张力，脚注列出语境上可能的译法。
- issue: “和我们一样”的具体比较点
  choice: 保持概括，不在正文补明
  alternative: 补译为“在同样条件下服事”或“和我们一样不取报酬”
  rationale: 原文只明说比较发生在他们所夸耀的事上；具体所指需由上下文判断，不应在本节中替作者作出唯一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“断绝……机会”保留原文比喻和重复；“被看出”略带正式色彩，以对应希腊文被动式，又不显古奥。
