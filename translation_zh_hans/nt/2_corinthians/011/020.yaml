  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: zh_hans
  text: 因为若有人奴役你们，若有人吞噬你们，若有人从你们那里拿取[a]，若有人自高自大，若有人打你们的脸，你们竟都能容忍[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利用你们”；希腊文直译为“拿取”，在这里很可能含有剥削之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们容忍”或“你们忍受”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: 你们都容忍
  rationale: 该词在这里指哥林多人实际忍受这些人的欺压。“容忍”符合现代汉语，也保留了保罗责备中带有的反讽意味；将谓语置于连续条件分句之后，使中文自然流畅。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文所作的解释性连接。
- source_word: καταδουλοῖ
  choice: 奴役你们
  rationale: 直接表达使人沦为奴隶或受辖制的强烈含义，不弱化原文的奴役意象。
- source_word: κατεσθίει
  choice: 吞吃你们
  rationale: 保留原文生动而强烈的吞噬意象，语境中指掠夺性地耗尽、剥削他们。
- source_word: λαμβάνει
  choice: 拿取你们的东西
  rationale: λαμβάνει本身仅表示“拿取”，对象没有明说；此译法在中文中补足必要成分，同时不把所拿之物限定为金钱，也不完全释义为“利用”。
- source_word: ἐπαίρεται
  choice: 自高自大
  rationale: 表达该形式在此处所含的自我抬高、傲慢之意，是自然且庄重的现代汉语。
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: 打你们的脸
  rationale: 保留原文具体的身体动作及公开羞辱意味，而不将动作缩窄为“扇耳光”。
- source_word: εἴ τις
  choice: 若有人
  rationale: 逐次保留五次重复的条件结构，以呈现原文累积性的修辞力量。
theological_decisions:
- issue: 保罗话语的反讽和责备语气
  choice: 译文列出哥林多人所容忍的各种欺压行为，不在正文中明说施行者是“假使徒”。
  alternative: 在正文中直接称这些人为假使徒或假教师。
  rationale: 上下文显明保罗是在反讽地责备哥林多人，但本节希腊文本本身没有给这些人加上明确称号，因此保留其修辞张力而不添加解释。
- issue: λαμβάνει所指的剥削方式
  choice: 保留为宽泛的“拿取你们的东西”。
  alternative: 明确译为“骗取你们的钱财”或“利用你们”。
  rationale: 语境明显含有剥削意味，但原词没有限定所拿的是钱财，也可能泛指占取资源或利用人，因此不将含义缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。五次重复“若有人”保留原文的排比和累积力度；句末“你们都容忍”符合汉语信息结构，并突出保罗的责备。
