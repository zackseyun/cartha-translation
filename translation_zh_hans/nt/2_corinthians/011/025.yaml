base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: zh_hans
  text: 我三次遭棍棒殴打，一次被人用石头砸，三次遭遇船难；我曾在海的深处[a]度过一夜一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在外海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: 三次
  rationale: 准确表达重复发生三回；本节两处采用一致译法。
- source_word: ἐραβδίσθην
  choice: 被棍棒打
  rationale: ῥαβδίζω特指用棍杖击打；译文保留工具含义，同时采用现代汉语自然说法。
- source_word: ἅπαξ
  choice: 一次
  rationale: 简明、自然地表达单次发生。
- source_word: ἐλιθάσθην
  choice: 被石头打
  rationale: 准确保留λιθάζω指用石头攻击的含义，且不额外断定具体司法程序或结果。
- source_word: ἐναυάγησα
  choice: 遭遇船难
  rationale: 自然表达ναυαγέω所指的船只失事经历，保留事件性的语义。
- source_word: νυχθήμερον
  choice: 一夜一天
  rationale: 按原词的次序表达一个夜昼时段，避免用“二十四小时”作过度精确的现代化处理。
- source_word: ἐν τῷ βυθῷ
  choice: 在深海中
  rationale: βυθός在此指深水或深海；正文保留其形象与一定语义宽度，并以脚注注明“外海”这一可能译法。
- source_word: πεποίηκα
  choice: 曾……度过
  rationale: ποιέω与时间表达连用可指度过一段时间；“曾”自然体现完成时回顾既往经历的语气。
