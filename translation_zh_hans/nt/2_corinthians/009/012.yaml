  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: zh_hans
  text: 因为这项服务的职事，不但补足圣徒的缺乏[a]，也借着许多向上帝献上的感谢而越发丰盛[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“补足圣徒所缺少的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也在许多向上帝献上的感谢中越发丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文并引出解释；现代汉语中“因为”自然保留其因由或说明作用。
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: 这项服事所尽的事奉
  rationale: 分别用“服事”和“事奉”表达两个相关名词，避免完全合并；属格结构理解为前者以此项事奉为内容。
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: 补足……的缺乏
  rationale: 保留“填补不足”的词义和原文复数名词的概括性，不将其仅限于一般所需。
- source_word: τῶν ἁγίων
  choice: 圣徒
  rationale: 保留保罗对信徒的惯常称谓及其神学分量，同时不引入后世封圣的含义。
- source_word: περισσεύουσα
  choice: 使……献上丰盛的感谢
  rationale: 结合διά短语表达这项事奉产生大量感谢的结果；“丰盛”保留超过充足、不断增多的意象。
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: 使许多人向上帝献上丰盛的感谢
  rationale: πολλῶν在句法上直接修饰“感谢”，但也可能暗示众多感谢者；正文采用自然汉语表达结果与方向，并以脚注保留较形式对应的理解。
theological_decisions:
- issue: 如何翻译保罗的称谓ἅγιοι
  choice: 圣徒
  alternative: 圣洁的人；上帝的子民
  rationale: “圣徒”是现代中文圣经传统中可理解的保罗用语，既保持术语一致，也不把经文解释性地改写为较宽泛的“上帝的子民”。
- issue: διά πολλῶν εὐχαριστιῶν与περισσεύουσα的关系
  choice: 理解为这项事奉产生许多向上帝而发的感谢
  alternative: 这项事奉借着许多感谢而越发丰盛
  rationale: 上下文强调捐助带来的感谢上帝，但希腊语可容许工具、途径或结果色彩，因此以脚注保留较贴近形式的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“服事所尽的事奉”刻意保留διακονία与λειτουργία两个相近名词之间的区别；破折号保留原文未完句式，与下节衔接。
