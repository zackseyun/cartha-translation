  rationale: 修订删除“许多人”和“丰盛的感谢”这两项超出原文句法的改写，恢复“许多感谢”及περισσεύουσα的丰盛意象。“借着”保留διά的途径色彩；脚注保留“在……中”的另一种可行表达，避免对其精确关系作过度断定。
