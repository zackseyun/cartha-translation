  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: zh_hans
  text: '正如经上所记：

    “他广为施舍，周济穷人；

    他的公义[a]永远长存。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公正”。希腊词可兼有“公义”和“公正”的含义。
    reason: 保留δικαιοσύνη的词义选择，不在正文中消除其伦理与神学上的多义性。
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 这是引述圣经的固定表达；“经上所记”自然、庄重，也明确表明下文是经文引语。
- source_word: Ἐσκόρπισεν
  choice: 他广为施舍
  rationale: 原词本义是“撒开、散布”，在本处指慷慨地广泛分给别人。“广为施舍”既保留广泛分散的意象，也符合现代汉语表达。
- source_word: ἔδωκεν τοῖς πένησιν
  choice: 周济穷人
  rationale: 直译为“给了穷人”。“周济穷人”简洁自然，准确表达向生活贫困者给予帮助的意思，并适合诗歌式平行句。
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: 他的公义
  rationale: δικαιοσύνη可指公义、公正，也可在本语境中涉及慷慨者合乎正道的行为。“公义”保留词义的神学与伦理广度，不把它窄化为单一的善举。
- source_word: μένει εἰς τὸν αἰῶνα
  choice: 永远长存
  rationale: “长存”自然表达μένει的持续含义，“永远”对应εἰς τὸν αἰῶνα；整体庄重流畅，适合经文引语。
theological_decisions:
- issue: δικαιοσύνη在本段引文中的含义
  choice: 公义
  alternative: 公正；义行
  rationale: “公义”可同时涵盖正直的品格和合乎正道的行为，保留原词在此处可能具有的张力。“公正”是可行的词义侧重，因此列入脚注；正文不直接译成“义行”，以免把含义限定为施舍这一行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“广为施舍，周济穷人”保留诗歌式平行结构；引号内按引文分行。脚注标记紧接实际存在词义差异的“公义”，而非置于前面的动词之后。
