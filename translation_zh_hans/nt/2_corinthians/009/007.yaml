reference: 2 Corinthians 9:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: zh_hans
  text: 各人都要照自己心里所决定的捐献，不要出于忧愁[a]，也不要出于勉强，因为上帝喜爱欢喜施予的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要不情愿”。希腊原文直译为“不要出于忧愁（或悲伤）”，在这里指捐献时感到心疼、不舍。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留分配性的单数焦点，表示群体中的每一个人；现代汉语中自然，也不带男性限定。
- source_word: καθὼς
  choice: 照
  rationale: 引出捐献所依据的个人决定；“照……所决定的”准确而自然。
- source_word: προῄρηται
  choice: 所决定的
  rationale: 表达事先经过考虑而作出的意愿或决定，避免把它弱化为一时冲动。
- source_word: τῇ καρδίᾳ
  choice: 自己心里
  rationale: 保留圣经中“心”作为人内在意愿与判断所在的表达；“自己”与“各人”呼应，并自然呈现原文的个体性。
- source_word: μὴ ἐκ λύπης
  choice: 不要出于忧愁
  rationale: 直接保留 λύπη 的“忧愁、悲伤”这一词义，而不在正文中完全解释为“不情愿”；语境所含的心疼、不舍之意在脚注说明。
- source_word: ἢ ἐξ ἀνάγκης
  choice: 也不要出于勉强
  rationale: 在捐献语境中，ἀνάγκη 指迫不得已或受压力驱使；“出于勉强”兼顾外在强迫和非自愿性。
- source_word: ἱλαρὸν
  choice: 欢喜
  rationale: 表达愉快、欣然的态度；比单纯的“愿意”更充分保留该词的喜乐色彩。
- source_word: δότην
  choice: 施予的人
  rationale: 清楚表达“给予者”，且比“施予者”更符合普通现代汉语。
- source_word: ἀγαπᾷ
  choice: 喜爱
  rationale: 保留 ἀγαπάω 的“爱、喜爱”含义，同时“上帝喜爱……的人”在本句中自然通顺。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代汉语基督教经文中通行且庄重的称呼。
theological_decisions:
- issue: 原文省略捐献动作的动词
  choice: 在正文补出“捐献”
  alternative: 各人都要照自己心里所决定的
  rationale: 希腊文依靠上下文省略了“给予”的动作；汉语若不补出，句子会显得残缺。“捐献”明确承接本段为圣徒募集款项的语境，没有增添新的神学内容。
- issue: λύπη 在捐献语境中的含义
  choice: 正文译作“不要出于忧愁”，脚注说明“不情愿、心疼不舍”的语境含义
  alternative: 不要不情愿地捐献
  rationale: 正文保留原词“忧愁”的词汇力度和可能的情感张力，同时让脚注帮助读者理解这里所指的痛苦、不舍心态。
- issue: 代表性单数与性别表达
  choice: 译作“各人……自己”，不标示性别
  alternative: 各人……他心里
  rationale: 希腊文的单数结构并不限定男性；汉语反身代词“自己”既保留逐个人的焦点，也无需加入原文没有明示的性别信息。
- issue: 上帝“喜爱”欢喜施予的人
  choice: 保留“喜爱”
  alternative: 上帝悦纳欢喜施予的人
  rationale: 原文使用 ἀγαπάω（爱、喜爱），不应静默改写成仅表示认可或悦纳的词；如此也保留上帝之爱与人的施予态度之间值得思考的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“各人……自己”保持原文逐一个人的焦点；“欢喜施予的人”避免生硬名词化。“忧愁”较贴近希腊词面意义，并以脚注交代语境中的“不情愿”含义。
