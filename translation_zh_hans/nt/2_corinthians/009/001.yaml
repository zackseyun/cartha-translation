  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: zh_hans
  text: 至于给圣徒的服事[a]，我写信给你们实在是多余的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为圣徒所作的服事。”这里的希腊语介词既可表示方向，也可表示受益对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: 论到……其实
  rationale: Περὶ引出话题；μὲν γὰρ承接上文并展开说明。汉语用“论到……其实”既自然地转入本题，也保留其承接和解释语气，而不逐一硬译虚词。
- source_word: διακονίας
  choice: 服事
  rationale: διακονία在此指为有需要的信徒筹集并送交捐款的服务。“服事”保留保罗赋予这项实际援助的尊严，也不把含义过早收窄为“捐款”。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 给圣徒的
  rationale: εἰς在这里可表示方向或受益者。“给圣徒的”在现代汉语中自然，并保留服务面向圣徒、为圣徒而作的语义范围。
- source_word: ἁγίους
  choice: 圣徒
  rationale: ἅγιοι是保罗对分别归给上帝之信徒的常用称呼。“圣徒”简洁、准确，并保留原文的群体称谓。
- source_word: περισσόν
  choice: 不必
  rationale: περισσόν在此意为多余、没有必要。结合“写信告诉你们”，译作“不必”比“是多余的”更符合现代汉语，同时保留保罗带有修辞意味的判断。
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: 我不必写信告诉你们
  rationale: 以自然汉语重组系词与冠词不定式结构；“告诉你们”表达 γράφειν ὑμῖν 的受事关系，不增添实质内容。
theological_decisions:
- issue: εἰς所表达的是方向还是受益关系
  choice: 正文译作“给圣徒的服事”，不明确限定二者
  alternative: “为圣徒所作的服事”或“送给圣徒的援助”
  rationale: 原文介词在本语境中可以兼具指向和受益含义；正文采用可涵盖两者的表达，并以脚注提示其歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“服事”“圣徒”保留保罗书信中的关键用语；“其实我不必”传达原文承接上文的解释语气。句末逗号保留本节与下一节在句法上的连续性。
