base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: zh_hans
  text: 还有一点：撒得少的，也必收得少；慷慨撒种的，也必收获丰盛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慷慨撒种……收获丰盛”直译可作“凭着祝福撒种……也凭着祝福收获”。希腊文使用“祝福”一词；在这里按惯用语指慷慨、丰厚的分量。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 这一点：
  rationale: 用简洁的提示语引出保罗所概括的原则；“这一点”保留指示代词的作用，冒号体现后文的解释，δέ的轻微转折或推进作用由语境承担，避免硬译成“但是”。
- source_word: ὁ σπείρων
  choice: 撒种的
  rationale: 希腊语名词化分词表达普遍适用的人，译作“撒种的”既保留分词意象，也符合汉语格言式表达。
- source_word: φειδομένως
  choice: 少量
  rationale: 此处表示撒种的分量有限。“少量”与后面的“少量收获”形成清楚对称，又不加入“吝啬”所带的较强道德评断。
- source_word: καὶ θερίσει
  choice: 也必……收获
  rationale: “也”保留καί所表达的对应关系；将来时在这句格言中表示确定的相应结果，汉语用“必”自然体现这种语气。
- source_word: ἐπ’ εὐλογίαις
  choice: 带着祝福
  rationale: 保留εὐλογία的名词性“祝福”及两次重复所形成的呼应，同时用“带着”使汉语较为自然；脚注说明在本语境中也可按惯用意义理解为“慷慨地、丰厚地”。
theological_decisions:
- issue: ἐπ’ εὐλογίαις在撒种与收获格言中的含义
  choice: 正文保留“祝福”一词，译为“带着祝福……带着祝福”。
  alternative: 译作“慷慨地撒种，也必丰厚地收获”或“多种的，也必多收”。
  rationale: 上下文确实涉及慷慨捐献，但希腊文使用名词“祝福”，并在撒种和收获两处重复。正文保留这一用词，可呈现慷慨与祝福之间的神学联系，同时不把本节解释成物质致富的机械保证；惯用的分量含义则在脚注中交代。
translation_notes:
  register: 采用现代、庄重而易懂的格言式汉语。保留“撒种—收获”和“少量—少量／祝福—祝福”的平行结构，不额外限定所收获的祝福必为物质回报。
