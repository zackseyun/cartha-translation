revisions:
- from: 神能使各样的恩典充充足足地临到你们，使你们在一切事上、任何时候，所需的一切都充足[a]，从而可以多多行各样的善事。
  to: 神能把一切恩典丰丰富富地赐给你们，使你们在一切事上、时时都有充足的供应[a]，从而能多多行各样的善事。
  rationale: 修订以“一切恩典”对应 πᾶσαν χάριν，以“丰丰富富地赐给”自然表达 περισσεῦσαι εἰς ὑμᾶς，并以“在一切事上、时时”保留连续的全面性强调。“都有充足的供应”将 αὐτάρκεια 及其分词结构译为从神而来的够用状态；“多多行各样的善事”保留第二个“丰盛”的动词和“每一项善工”的范围。
