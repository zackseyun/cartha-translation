source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: zh_hans
  text: 神能把一切恩典丰丰富富地赐给你们，使你们在一切事上、时时都有充足的供应[a]，从而能多多行各样的善事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可指“充分的够用”或“知足”。这里的重点是神所赐的充足供应，使人能够行善，并非人独立自主的自给自足。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: 能
  rationale: 表达神现实而持续的能力，简洁自然，并保留原文对神有能力施行此事的强调。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的承接词；中文直接承接上文更自然，省略并不损失转折或论证关系。
- source_word: πᾶσαν χάριν
  choice: 各样的恩典
  rationale: 既保留 πᾶσαν 的全面性，也让 χάρις 保持宽广的“恩典”含义，包括神使人能够慷慨的供应，而不把它缩减为金钱。
- source_word: περισσεῦσαι
  choice: 使……充充足足地临到
  rationale: 兼顾使动意义和“丰盛、满溢”的意象；“临到你们”也保留 εἰς ὑμᾶς 的方向性。
- source_word: ἵνα
  choice: 使……从而
  rationale: 在中文句式中连贯表达目的及其结果，不强行排除原文可能兼有的目的—结果意味。
- source_word: ἐν παντὶ πάντοτε
  choice: 在一切事上、任何时候
  rationale: 明确呈现两个范围表达，保留保罗反复使用 παν- 所形成的全面强调。
- source_word: πᾶσαν αὐτάρκειαν
  choice: 所需的一切都充足
  rationale: 按上下文理解为神所赐的充分供应，而非脱离神的自主自足；这一译法也比生硬的“有完全的充足”更符合现代汉语。
- source_word: ἔχοντες
  choice: 所需的一切都充足
  rationale: 将分词“有”自然融入中文状态表达，仍表示他们在行善时已有充分供应。
- source_word: περισσεύητε
  choice: 可以多多行
  rationale: “多多”重现与前半句 περισσεῦσαι 相呼应的丰盛主题，同时符合汉语谈论善行的习惯。
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: 行各样的善事
  rationale: 自然表达在每一项善工上丰盛的意思，并再次保留 πᾶν 的全面性。
theological_decisions:
- issue: 慷慨语境中 χάρις 的含义
  choice: 译作“恩典”，泛指神恩慈的供应，也包括使人能够慷慨的实际供应
  alternative: 只指恩惠，或具体译作财物、礼物
  rationale: 上下文虽论及捐献，χάρις 的意义仍比物质供应更宽；保留“恩典”可避免把神的作为窄化为金钱。
- issue: αὐτάρκεια 的含义
  choice: 译作“所需的一切都充足”，指从神而来的充分供应
  alternative: 知足；自给自足
  rationale: 经文的主语和因果关系都强调神的供应，使信徒有能力行善；因此不宜让译文暗示一种独立于神的自主自足。不过该词也可含“知足”之意，故在脚注说明。
- issue: ἵνα 所表达的逻辑关系
  choice: 以“使……从而”表达目的及随之而来的结果
  alternative: 只译为目的“为要”，或只译为结果“所以”
  rationale: ἵνα 在这里可承载目的—结果关系；译文避免把二者过度切割或武断限定为其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“各样、一切、任何、各样”尽量再现原文连续的全面性用语，并以“充充足足”和“多多”呼应两个 περισσεύω 词形的丰盛主题。脚注标记紧随其所解释的 αὐτάρκεια 译语。
