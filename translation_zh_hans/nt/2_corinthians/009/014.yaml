  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: zh_hans
  text: 他们也为你们祈求，并因上帝临到你们的格外恩典而切切想念你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上一节，并自然表达受惠者除感谢上帝外还会为哥林多人祷告。
- source_word: αὐτῶν δεήσει ὑπὲρ ὑμῶν
  choice: 他们也为你们祈求
  rationale: 将压缩的希腊语结构化为自然汉语；δέησις带有恳切祈求之意，ὑπέρ加属格表示“为、代表”。
- source_word: ἐπιποθούντων ὑμᾶς
  choice: 切切想念你们
  rationale: 表达ἐπιποθέω所含持续而深切的渴念与亲近愿望，同时保持庄重自然。
- source_word: διὰ
  choice: 因
  rationale: διά加宾格在这里表示原因，即他们想念哥林多人的缘由。
- source_word: τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ
  choice: 上帝赐给你们那格外丰盛的恩典
  rationale: “恩典”保留χάρις的保罗神学内涵；“格外丰盛”传达ὑπερβάλλουσαν超越通常程度的含义。
- source_word: ἐφ’ ὑμῖν
  choice: 赐给你们
  rationale: 按自然汉语表达上帝的恩典临到他们；语义上保留恩典施于哥林多人的关系，避免生硬直译“在你们之上”。
theological_decisions:
- issue: 祈求与想念之间的句法关系
  choice: 将二者作为同一主语的并列相关行动：他们为哥林多人祈求，也切切想念他们。
  alternative: 可更贴近形式地译为“他们在为你们祈求时，切切想念你们”，或理解祈求是表达想念的方式。
  rationale: 原文以属格代词和属格分词构成压缩结构，关系存在一定开放性。正文用自然汉语保留两项行动，不进一步断定祈求究竟是想念的时间背景还是表达方式。
- issue: 上帝恩典与哥林多人的关系
  choice: 译作“上帝赐给你们……恩典”。
  alternative: 可译作“上帝在你们身上的……恩典”或“临到你们的……恩典”。
  rationale: ἐπί加与格容许“在……身上、临到……”之意；“赐给你们”在汉语中清楚表明恩典源于上帝并施于他们，但不将恩典缩减为单指捐献。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“切切想念”保留深厚情感且适合经文语体；整体避免过度书面化和宗派性措辞。
