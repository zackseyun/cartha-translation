  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: zh_hans
  text: 免得有马其顿人同我一起来，发现你们还没有预备好，我们——更不用说你们了[a]——就在我们所抱的这份把握上蒙羞。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“何况你们呢。”保罗以委婉的插入语暗示：若他们尚未预备好，哥林多人自己也会一同蒙羞。
    reason: alternative_reading
  - marker: b
    text: “这份把握”也可理解为“这件所承担的事”或“这种处境”。这里最可能是指保罗对哥林多人已经预备妥当所抱的把握。
    reason: lexical_alternative
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: 免得万一
  rationale: μή πως表达对不希望发生之事的顾虑，ἐὰν引出可能发生的条件；“免得万一”在中文中兼顾防范意味与假设性。
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: 有马其顿人和我一同来
  rationale: Μακεδόνες没有冠词，在此泛指可能随保罗前来的一些马其顿人；中文以“有马其顿人”自然表达这种不确定性。
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: 发现你们还没有准备好
  rationale: ἀπαρασκευάστους指尚未做好准备；加入“还”贴合上下文中捐款本应届时备妥的含义，但不把具体对象直接补入正文。
- source_word: καταισχυνθῶμεν
  choice: 蒙羞
  rationale: 该被动形式带有在人前受羞辱、丢脸的社会性含义；“蒙羞”简洁保留被动色彩。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 希腊文显式主语带强调意味，中文通过“我们——……——”的句式加以体现。
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: 更不用说你们了
  rationale: 这是委婉的插入语：保罗明说自己会蒙羞，同时暗示哥林多人更会如此；此译自然保留这一修辞作用。
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: 因这份信心
  rationale: ὑπόστασις在本段最可能指保罗对哥林多人已经准备好的信心，而非后来的哲学或神学术语“实体”；“因”说明这份信心成为届时蒙羞的缘由。
theological_decisions:
- issue: ὑπόστασις在本节非技术性语境中的含义
  choice: 信心
  alternative: 所承担的事；这种处境
  rationale: 上下文谈到保罗曾向马其顿人夸口，并确信哥林多人已经预备妥当，因此“信心”最贴合论述；脚注保留“所承担的事、处境”等语境上可能的理解，避免把歧义完全消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“免得万一”保留原文略显叠加的顾虑与条件结构；破折号呈现保罗插入式的委婉语气。正文不明说所准备的是捐款，以免加入本节原文未明示的内容。
