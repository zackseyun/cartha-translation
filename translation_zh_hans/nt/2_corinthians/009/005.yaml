source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: zh_hans
  text: 所以，我认为有必要劝弟兄们[a]先于我们到你们那里去，把你们先前应许的慷慨馈赠[b]预先安排妥当，好使这捐献已经预备妥当，显为一份慷慨的馈赠，而不是出于贪婪的索取[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可作广义的群体称谓；若这里所指的使团包括女性，也可理解为“弟兄姊妹们”。
    reason: lexical_alternative
  - marker: b
    text: “慷慨馈赠”原文直译为“祝福”；这里指哥林多人先前承诺的捐献，并把它描绘成惠及他人的慷慨礼物。
    reason: lexical_alternative
  - marker: c
    text: 译作“出于贪婪的索取”的希腊词通常指“贪婪”或“贪得”；这里与“慷慨馈赠”相对，指这笔捐献不应显得是出于贪心而被索取的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον
  choice: 有必要
  rationale: 表达保罗基于实际情况所作的必要性判断，不强化为外在强制。
- source_word: ἡγησάμην
  choice: 我认为
  rationale: 准确表达ἡγέομαι在此处的审慎判断意味，符合现代汉语习惯。
- source_word: παρακαλέσαι
  choice: 劝
  rationale: 此处指敦促弟兄们及时行动；“劝”自然庄重，又不带命令口吻。
- source_word: τοὺς ἀδελφοὺς
  choice: 弟兄们
  rationale: 保留希腊语阳性复数的直接表达；可能的广义理解列入脚注。
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: 先于我们到你们那里去
  rationale: προέρχομαι表示先行；“我们”由上下文中的行程比较对象补出，使汉语意思明确。
- source_word: προκαταρτίσωσι
  choice: 预先安排妥当
  rationale: 兼顾“预先”和筹备、落实捐献之意，并与后文“准备就绪”形成自然衔接。
- source_word: προεπηγγελμένην
  choice: 先前应许的
  rationale: 保留分词所表达的预先承诺及其时间关系。
- source_word: εὐλογίαν
  choice: 慷慨馈赠
  rationale: 在募捐语境中，该词指慷慨给予的礼物；“馈赠”表达捐献性质，“慷慨”体现与后文强索的对照。字面义“祝福”保留在脚注。
- source_word: ἑτοίμην εἶναι
  choice: 准备就绪
  rationale: 自然表达预先筹备所要达到的结果。
- source_word: οὕτως ὡς εὐλογίαν
  choice: 成为一份慷慨的馈赠
  rationale: 再次译出εὐλογία，保留原文的修辞重复；汉语不机械直译οὕτως，而以结果状态自然承载其语义。
- source_word: πλεονεξίαν
  choice: 强索来的东西
  rationale: 该词通常指贪婪、贪得；在本节与慷慨馈赠相对，刻画捐献仿佛是被人贪婪地逼取或榨取而来。脚注保留其通常词义。
theological_decisions:
- issue: ἀδελφοὺς的性别及所指范围
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 主文保留希腊语阳性复数，不擅自判定使团包含女性；同时用脚注说明在广义群体称谓下可能包含姊妹。
- issue: 募捐语境中εὐλογία的含义
  choice: 慷慨馈赠
  alternative: 祝福
  rationale: “慷慨馈赠”让普通读者清楚看出所指是哥林多人承诺的捐献，也保存它与πλεονεξία之间的语义对照；字面意象“祝福”则在脚注中说明，避免抹去保罗对奉献的正面描绘。
- issue: πλεονεξία在本节中的关系含义
  choice: 强索来的东西
  alternative: 贪婪／出于贪心
  rationale: 若仅译“贪婪”，汉语中难以与一份已经准备好的礼物构成顺畅对比。主文表达这笔捐献不应显得是被逼取来的，同时由脚注保留该词通常表示“贪婪、贪得”的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“先于我们”明确先遣关系；“预先安排妥当／准备就绪”保留原文先行筹备与最终就绪的层次。两次使用“慷慨馈赠”，保存εὐλογία的重复和对照功能；脚注补足“祝福”的源语意象及πλεονεξία的通常词义。
