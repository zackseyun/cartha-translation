  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: zh_hans
  text: 他们因这项服事所显出的凭据而荣耀上帝：因为你们对弥赛亚福音所作宣认中表现出的顺服，也因为你们慷慨地向他们和众人分享[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分享”在这里主要指借着捐献参与救济、慷慨供应别人，不只是一般意义上的团契或交往。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: 所显明的凭据
  rationale: 此处指这项慈惠服事经受检验后所提供的明证；译为“所显明的凭据”兼顾检验结果与自然汉语。
- source_word: διακονίας
  choice: 服事
  rationale: 指保罗所组织的救济行动，既是实际服务，也带有信仰群体中的事奉含义。
- source_word: δοξάζοντες τὸν θεὸν
  choice: 他们……荣耀上帝
  rationale: 将分词按上下文明确为有限动词，使中文句意完整，并保留 δοξάζω 的分量。
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: 你们所宣认的……顺服
  rationale: 尽量保留属格结构本身的张力，不将其完全解释为“宣认所伴随的顺服”；“所宣认的”在现代中文中比“宣认的顺服”更自然。
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: 对弥赛亚福音
  rationale: εἰς 表明顺服所指向或关联的对象；“对……福音的顺服”符合现代汉语。Χριστός 在此按称号译为“弥赛亚”。
- source_word: ἁπλότητι
  choice: 慷慨地
  rationale: 在募捐和救济语境中主要表示不吝惜、敞开施予，而非一般意义的单纯或诚恳。
- source_word: κοινωνίας
  choice: 分享
  rationale: 此词本可指团契或参与，此处具体涉及物质上的共同承担和捐助；“分享”保留其较宽的语义。
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: 与他们和众人
  rationale: 与“分享”搭配时，中文用“与”最自然，同时表达这种慷慨惠及他们及所有人。
theological_decisions:
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 在这里具有称号作用；“弥赛亚”直接传达“受膏者”的称号意义，又不增添经文未明说的教义解释。
- issue: ὑποταγῇ τῆς ὁμολογίας 的关系
  choice: 你们所宣认的……顺服
  alternative: 你们宣认福音时所显出的顺服
  rationale: 希腊文属格关系可理解为宣认所包含、所表达或所伴随的顺服。正文避免把其中一种解释写死，保留原文的压缩表达和神学张力。
- issue: κοινωνίας 的具体所指
  choice: 分享
  alternative: 捐助
  rationale: 上下文强烈指向物质援助，但 κοινωνία 的意义比单纯“捐款”更宽；正文用“分享”，脚注说明其语境内涵。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这项服事”承接上下文的救济事工；句式保留保罗原文因果与并列结构，但适度调整词序以符合普通话表达。
