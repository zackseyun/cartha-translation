language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: zh_hans
  text: 因为我知道你们的热心[a]；我为你们向马其顿人夸口，说亚该亚从去年起就已经预备好了[b]，而你们的热忱已经激励了他们中的大多数人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热心”也可译作“甘心乐意”或“积极的意愿”。
    reason: lexical_alternative
  - marker: b
    text: “亚该亚”是当时的罗马行省，包括哥林多；这里以地区名称指当地的信徒。
    reason: cultural_note
  - marker: c
    text: “他们中的大多数人”也可译作“多数人”，所指的是前面提到的马其顿人。
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: 热心
  rationale: 该词表示甘心并积极投入的心志；“热心”自然传达此处受称赞的主动意愿，同时不把意思局限为事务上的“准备”。
- source_word: καυχῶμαι
  choice: 夸口
  rationale: 保留保罗所用词语鲜明的修辞力度，不弱化为仅仅“称赞”或“感到自豪”。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: 与“夸口”连用，表示保罗站在他们一边、以他们为夸口的对象；简洁自然，并保留“替你们说话”和“因你们而夸口”之间的语义空间。
- source_word: Μακεδόσιν
  choice: 向马其顿人
  rationale: 忠实保留指向马其顿当地人的复数地名用法；上下文表明所指主要是当地信徒，无须在正文增词。
- source_word: Ἀχαΐα
  choice: 亚该亚
  rationale: 保留希腊文明确使用的罗马行省名称，让地名借指当地信徒的修辞保持可见。
- source_word: παρεσκεύασται
  choice: 已经预备好了
  rationale: 完成时表达先前预备所形成并持续至今的状态；“已经预备好了”兼顾动作结果和当前状态。
- source_word: ἀπὸ πέρυσι
  choice: 从去年起
  rationale: 准确表达由去年延续至今的时间跨度，现代汉语自然清楚。
- source_word: τὸ ὑμῶν ζῆλος
  choice: 你们的热忱
  rationale: ζῆλος在此为正面的热烈投入。“热忱”保留力度，又与前面的“热心”适度区分。
- source_word: ἠρέθισε
  choice: 已经激励了
  rationale: 该词可指刺激、激发或挑动；此处语境正面，“激励”自然传达他们的热忱对别人的推动作用。
- source_word: τοὺς πλείονας
  choice: 他们大多数人
  rationale: 比较级名词化指相关群体中的多数；“他们”自然回指刚提到的马其顿人。
theological_decisions:
- issue: “亚该亚”的所指
  choice: 正文保留地理名称“亚该亚”，让它借指当地信徒。
  alternative: 译作“你们”或“亚该亚的信徒”。
  rationale: 希腊文明确写出行省名。保留它既忠于措辞，也保存保罗称许范围可能超出哥林多单一教会的意味。
- issue: 保罗“夸口”的语气
  choice: 直译为“夸口”。
  alternative: 译作“引以为荣”或“称赞”。
  rationale: καυχῶμαι具有鲜明的公开夸耀或自豪表达，保罗书信中常作修辞用语；没有必要将其弱化。
- issue: “预备好了”的主语和内容
  choice: 保留“亚该亚……已经预备好了”的概括说法，不补明具体是捐款、信徒还是意愿已准备好。
  alternative: 明确译作“亚该亚的信徒已经准备好捐款”。
  rationale: 上下文与募捐有关，但本节希腊文用地名作主语，也未明说宾语；正文不应消除这一简练表达中的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文因果说明、夸口内容和最终结果三个层次；用分号避免长句关系含混。正文所有脚注标记均按出现顺序设置为[a]、[b]、[c]。
