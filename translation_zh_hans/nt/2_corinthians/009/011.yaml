  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: zh_hans
  text: 你们在各方面都得到丰富的供应，得以慷慨地施予[a]；这种慷慨借着我们促成对上帝的感谢——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得以毫不吝啬地施予”。“慷慨”所译的希腊词在其他语境中也可表示“纯朴”或“真诚”，但这里施予的上下文支持“慷慨”之意。
    reason: 词义替代
lexical_decisions:
- source_word: ἐν παντὶ
  choice: 在各方面
  rationale: 表达范围的全面性，符合此处宽泛的习语用法，也比“在一切中”更符合现代汉语。
- source_word: πλουτιζόμενοι
  choice: 不断富足
  rationale: 现在时被动分词表示持续蒙供应、变得丰足；汉语不明说施动者，仍可由上文语境理解为上帝使他们富足，并避免被误解为单指财富增长。
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: 可以慷慨地施予
  rationale: εἰς 表目的或结果；在募捐和供给的语境中，ἁπλότης主要指慷慨、毫不吝啬。补出“施予”使现代汉语自然，并明确这种慷慨的具体表现。
- source_word: ἥτις
  choice: 这慷慨
  rationale: 明确回指前述慷慨，也自然引出其所产生的结果。
- source_word: κατεργάζεται
  choice: 使人
  rationale: 与后面的“感谢”构成自然的汉语使动表达，传达‘产生、促成’之意；“人”是根据感恩行为隐含的主体所作的最低限度补足。
- source_word: δι’ ἡμῶν
  choice: 借着我们
  rationale: 保留διά加属格所表达的媒介性，不把“我们”进一步解释为某项具体事工。
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: 感谢上帝
  rationale: 用现代汉语常见的动词性表达传达‘向上帝献上感谢’，清楚保留感谢的对象。
theological_decisions:
- issue: 募捐语境中ἁπλότης的含义
  choice: 慷慨地施予
  alternative: 纯朴、真诚、专一
  rationale: 虽然该词在其他语境可指纯朴或真诚，但这里论及上帝所赐的充足、实际捐献及由此产生的感恩，因此具体的慷慨施予最符合上下文；脚注保留“毫不吝啬”这一词义侧面。
- issue: πλουτιζόμενοι所暗示的施动者
  choice: 正文不明说施动者，以“不断富足”保留被动含义
  alternative: 上帝使你们在各方面富足
  rationale: 上下文表明上帝是供应者，但本节希腊文没有明说施动者；不补入“上帝”可保留原文形式及其含蓄性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不断”体现现在分词的持续意味；“可以……施予”传达εἰς所含的目的或结果。保留句末破折号，以反映本节与下文未完的句法衔接。
