  rationale: 修订仅调整汉语句法和指称清晰度：以“我们为你们所作的夸耀”明确保留καύχημα及ὑπὲρ ὑμῶν的关系；以“也好叫你们正如我一直所说的那样，预备妥当”自然表达第二个目的从句及完成时所强调的预备状态。脚注锚点仍分别紧贴“落了空”和“这件事”。
