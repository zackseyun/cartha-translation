  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: zh_hans
  text: 但我派了这些弟兄去，免得我们为你们所作的夸耀在这件事[b]上落了空[a]；也好叫你们正如我一直所说的那样，预备妥当。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落了空”也可译作“显为空话”或“归于无效”。
    reason: lexical_alternative
  - marker: b
    text: “在这件事上”也可译作“在这方面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: 我派了……去
  rationale: 不定过去时在此按叙事语境译作简单过去；“派……去”自然表达差遣代表前往的意思。
- source_word: τοὺς ἀδελφούς
  choice: 这些弟兄
  rationale: 定冠词指向上下文中已提及的特定使者；他们很可能是男性，因此保留“弟兄”，不泛化为男女信徒。
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: 我们为你们所夸的
  rationale: 保留 καύχημα 的“夸耀”含义，同时以现代汉语自然表达保罗因哥林多人而说出的夸赞。
- source_word: κενωθῇ
  choice: 落了空
  rationale: 该被动虚拟式位于 ἵνα μή 之后，表达要避免的结果；“落空”既保留“成为空、失去实质”的意象，也符合现代汉语习惯。
- source_word: ἐν τῷ μέρει τούτῳ
  choice: 在这件事上
  rationale: μέρος 在此不是实体的“部分”，而是“某一方面、某件事”；此译法自然清楚。
- source_word: καθὼς ἔλεγον
  choice: 照我一直所说的
  rationale: 用“一直”体现未完成时可能含有的持续或反复言说色彩，同时不把具体次数说死。
- source_word: παρεσκευασμένοι ἦτε
  choice: 已经准备妥当
  rationale: 以结果状态表达完成时迂回结构：保罗差遣弟兄，为要使收信人在到访时处于准备就绪的状态。
theological_decisions:
- issue: 保罗“夸耀”的性质
  choice: 译为“我们为你们所夸的”，保留 καύχημα 的直接含义
  alternative: 译为“我们对你们的信心”
  rationale: 原文说的是夸耀或夸耀的根据，而非直接使用“信心”一词；直译可保留保罗话语中的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这些弟兄”承接上下文中的特定使者；分号呈现两个 ἵνα 目的从句之间既并列又递进的关系。所有脚注标记均置于其所说明的词语之后。
