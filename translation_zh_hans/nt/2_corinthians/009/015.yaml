  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: zh_hans
  text: 感谢上帝，因他那无法言尽的恩赐[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无法表达的恩赐。”希腊语形容词指无法被充分叙述或说尽。
    reason: 词义有相近译法；注释说明其重点是超出充分言说或叙述的能力。
lexical_decisions:
- source_word: χάρις
  choice: 感谢
  rationale: 在“χάρις τῷ θεῷ”这一感叹式结构中，χάρις 表达对上帝的感谢，而非此处直接指“恩典”。“感谢上帝”自然、庄重，并保留颂赞语气。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 与感谢表达连用，指感谢所归向的对象；现代汉语以“感谢上帝”直接表达。
- source_word: ἐπὶ
  choice: 因
  rationale: ἐπί 加与格在此表示感谢的缘由或根据。“因”简洁地表达“因为、为了”的因由关系。
- source_word: ἀνεκδιηγήτῳ
  choice: 无法言尽的
  rationale: 该词指不能被充分叙述或表达。“无法言尽”既自然，又保留并非绝对不可提说、而是言语无法充分述尽的含义。
- source_word: αὐτοῦ
  choice: 他那
  rationale: 代词自然回指上帝；“他那”使修饰关系在中文中清楚，同时不将所指进一步具体化。
- source_word: δωρεᾷ
  choice: 恩赐
  rationale: δωρεά 指白白赐下的礼物。“恩赐”在此能体现来自上帝的赐予，同时无需另加“白白的”而造成过度说明。
theological_decisions:
- issue: “他那无法言尽的恩赐”具体指什么
  choice: 译文只保留为上帝的恩赐，不明确限定为基督、在基督里的救恩，或本段语境中包括慷慨供应在内的上帝恩典。
  alternative: 可理解为特指基督；或指在基督里的救恩与恩典；或广指上帝的恩惠，包括促成哥林多人慷慨奉献的供应。
  rationale: 本节本身只说“他的恩赐”。虽然基督教传统常将其集中理解为基督，但紧邻语境也强调上帝的恩典如何产生慷慨。因此译文保留原文的开放性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“感谢上帝”保留原文简短的颂赞感叹；句末用感叹号呈现其修辞力度。“无法言尽”较“不可言喻”更贴近日常现代汉语，也更准确保留“不能充分述尽”的语义。
