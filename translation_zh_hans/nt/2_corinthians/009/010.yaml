  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: zh_hans
  text: 那赐给撒种者种子、赐下供食用的饼的，必供应并增多你们的种子，也必使你们义的收成增长[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们义的果实（或出产）增长。”
    reason: γενήματα可指果实、出产或收成；这些译法分别凸显比喻或农业产物的含义。
  - marker: b
    text: 或译：“你们正义的收成。”希腊语δικαιοσύνη既可指“义”，在某些语境中也可指“正义”。
    reason: 保留δικαιοσύνη可能具有的正义含义，避免将其语义范围收窄。
lexical_decisions:
- source_word: ὁ δὲ ἐπιχορηγῶν
  choice: 那赐……的
  rationale: 将带冠词的实体化分词译为“那……的”，指供应这一切的上帝；“赐”自然体现供给之意，也保留慷慨供应的语感。δέ不含时间意义，故不增译“现在”。
- source_word: σπόρον τῷ σπείροντι
  choice: 种子给撒种者
  rationale: 保留种子与撒种者的农业意象；“撒种者”简洁庄重。
- source_word: ἄρτον εἰς βρῶσιν
  choice: 饼作食物
  rationale: 直译其用途关系，并保留“种子”与供人食用的“饼”之间的区别。
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: 必供应并增多你们的种子
  rationale: 两个将来时动词分别译出为“供应”和“增多”，既保留应许语气，也延续农业比喻；“你们的种子”不限定为钱财或任何一种具体资源。
- source_word: αὐξήσει τὰ γενήματα
  choice: 使……的收成增长
  rationale: γενήματα指产物、出产或果实；“收成”在现代汉语中自然承接上下文的播种意象，αὐξήσει则以“使……增长”表达。
- source_word: δικαιοσύνης ὑμῶν
  choice: 你们义的
  rationale: 以“义”保留δικαιοσύνη在保罗语境中可涵盖正直、合宜行为及正义的宽广含义，不在正文中将其限定为司法地位、善行或社会正义。
theological_decisions:
- issue: “你们义的收成”的含义
  choice: 保留为由义所产生的收成这一开放性农业比喻，可指哥林多人慷慨行为所结的成果，但不限定成果的性质。
  alternative: 将其明确解释为物质回报、义行的证据、盟约忠诚的果实或归算之义。
  rationale: 上下文谈慷慨捐助，但原文没有将γενήματα限定为物质祝福，也没有把δικαιοσύνη限定为某一种系统神学含义；译文因此保留其神学张力。
- issue: δικαιοσύνη在此处是“义”还是“正义”
  choice: 正文用含义较宽的“义”。
  alternative: 译作“正义”。
  rationale: “义”较能保留保罗用语的广度；“正义”在本语境中仍是可能理解，故列入脚注而不从正文排除。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“赐……的”避免生硬重复，同时“供应”明确对应后半句的将来时动词；“收成增长”维持种子、撒种和出产的连贯农业意象。脚注标记[a][b]均已置于正文相关短语之后。
