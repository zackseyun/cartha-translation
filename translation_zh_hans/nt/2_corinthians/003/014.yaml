  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: zh_hans
  text: 然而，他们的心思变得刚硬了。因为直到今天，诵读旧的约[a]时，同样的帕子仍然存在，尚未被揭去，因为它是在弥赛亚里被除去的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“旧约”。希腊文直译为“旧的约”；“旧约”在汉语中也常指旧约圣经。
    reason: lexical_alternative
  - marker: b
    text: 原句也可理解为：“因为旧的约在弥赛亚里被废除（或被废去）。”希腊文中“被除去”的主语没有明说。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: 变得刚硬了
  rationale: 保留被动所表达的状态变化，指出心思对属灵真理变得不敏锐、难以领受，同时不把经文强化为纯粹出于意志的悖逆。
- source_word: νοήματα
  choice: 心思
  rationale: 在本段指思想、理解和领会的能力；“心思”既自然，也比单说“思想”更能涵盖认知机能。
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: 因为直到今天
  rationale: 自然保留原文的因果连接和持续到当下的时间强调。
- source_word: κάλυμμα
  choice: 帕子
  rationale: 延续上下文摩西蒙帕的具体意象，比泛称“遮盖”更清楚。
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: 诵读……时
  rationale: 表达公开或出声宣读文本的语境，同时保持现代汉语流畅。
- source_word: παλαιᾶς διαθήκης
  choice: 旧的约
  rationale: 明确译出 διαθήκη 的“约”义，避免正文自动被理解为仅指名为《旧约》的经卷集。
- source_word: μένει
  choice: 仍旧存在
  rationale: 体现帕子持续留存至今的状态。
- source_word: μὴ ἀνακαλυπτόμενον
  choice: 没有被揭去
  rationale: 保留被动分词以及帕子被揭开的意象；“揭去”在汉语中与帕子搭配自然。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 将 Χριστός 作为称号译为“弥赛亚”，并保留保罗“在……里”的联合性表达。
- source_word: καταργεῖται
  choice: 被除去
  rationale: 以最近的“帕子”为主语时，“除去”最贴合语境，也保留被动语态；其他可能的所指在脚注中说明。
theological_decisions:
- issue: καταργεῖται 的隐含主语
  choice: 正文将“这帕子”作为隐含主语：它在弥赛亚里被除去。
  alternative: 也可能把“旧的约”视为主语，理解为旧的约在弥赛亚里被废除或失去效力；原句也可能有意保留一定的句法张力。
  rationale: 最近且最自然的先行词是“帕子”，并与前面的“没有被揭去”形成连贯意象；正文据此翻译，但以脚注保留另一种重要理解，避免无声地作出更强的神学断定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“帕子”“诵读”“弥赛亚”保留本段的经文语域与核心意象；句法尽量清楚，同时借脚注保存原文关于 καταργεῖται 所指的真实歧义。
