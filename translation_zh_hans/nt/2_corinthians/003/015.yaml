  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: zh_hans
  text: 但是直到今天，每逢诵读摩西[a]的著作，帕子仍蒙在他们的心上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“摩西”；这里指摩西的著作，尤其是律法。
    reason: cultural_note
  - marker: b
    text: 希腊文的“心”是单数，可能是把众人作为一个整体来说；也可理解为“他们各人的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接上文形成转折；“然而”简洁、庄重，也符合现代汉语表达。
- source_word: ἕως σήμερον
  choice: 直到今天
  rationale: 表达这种状态一直延续到保罗所说的当下，保留原文的持续意味。
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: 每逢诵读
  rationale: ἡνίκα与ἄν及现在时虚拟语气表示不定而反复发生的情形；“每逢”准确传达这一意味。被动意义在汉语无主句中自然体现。
- source_word: Μωϋσῆς
  choice: “摩西”
  rationale: 保留原文以“摩西”转指摩西著作的表达，不在正文中直接改成“摩西律法”或“摩西的著作”；引号提示这是著作名称式的转喻用法。
- source_word: κάλυμμα
  choice: 帕子
  rationale: 与本章摩西蒙脸的上下文意象一致；“帕子”比泛称“遮盖物”更具体、自然。
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: 在他们的心上
  rationale: 尽量反映希腊文“他们的”配单数“心”的集体单数结构；现代汉语中的“他们的心”同样可以自然表达集体意义。
- source_word: κεῖται
  choice: 仍蒙在
  rationale: κεῖται描写帕子处于覆盖其上的状态；结合κάλυμμα译作“蒙在”符合汉语习惯，“仍”则凸显该状态延续至今。
theological_decisions:
- issue: 是否在正文中明确把“摩西”解释为摩西律法或摩西著作
  choice: 正文保留“摩西”这一转喻，并用脚注说明
  alternative: 直接译为“摩西律法”或“摩西的著作”
  rationale: 原文只说“摩西”。保留这一表达可避免把其所指范围过早限定，同时脚注能帮助现代读者理解。
- issue: “心”应理解为单数还是复数
  choice: 译作“他们的心”，保留集体单数的可能性
  alternative: 译作“他们各人的心”或“他们的心里”
  rationale: 希腊文καρδίαν为单数，而αὐτῶν为复数，可能把群体视为整体。译文不把它明确拆分成多个个体的心，以保留原文形式及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“每逢诵读”保留反复发生的意味；“帕子仍蒙在……心上”延续本章核心意象。脚注标记依其实际说明对象分别置于“摩西”和“心上”之后。
