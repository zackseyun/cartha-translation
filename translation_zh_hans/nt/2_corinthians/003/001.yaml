  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: zh_hans
  text: 难道我们又开始自我举荐吗？还是像有些人一样，需要给你们或由你们出具的荐信[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“推荐信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: 又开始
  rationale: 保留现在时所表达的开始之意及 πάλιν 的重复意味，并使反问在现代汉语中自然。
- source_word: ἑαυτοὺς συνιστάνειν
  choice: 自我举荐
  rationale: 表达把自己有利地介绍、推荐给别人的意思；“举荐”也与后文“荐信”形成原文词根关联。
- source_word: ἢ μὴ χρῄζομεν
  choice: 还是……需要……呢
  rationale: 以自然汉语呈现第二个反问；原文 μή 暗示预期否定回答，但不将答案明说。
- source_word: ὥς τινες
  choice: 像有些人一样
  rationale: 保留所指不明的比较对象，不擅自判定具体是谁。
- source_word: συστατικῶν ἐπιστολῶν
  choice: 荐信
  rationale: 现代汉语中简洁而通行，指介绍并为某人作保或推荐的书信。
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: 给你们或由你们出具的
  rationale: 分别保留 πρός 的方向和 ἐξ 的来源含义；补出“出具”使汉语清楚说明荐信来自哥林多人。
theological_decisions: []
