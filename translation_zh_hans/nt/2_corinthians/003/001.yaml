  source_fidelity: 译文准确传达两个连续的反问：是否又开始举荐自己，以及是否像某些人那样需要荐信。“给你们或由你们出具的”对应 πρὸς ὑμᾶς ἢ ἐξ ὑμῶν，保留了信件指向哥林多人或出自哥林多人的两种可能来源／去向。未把 μή 所暗示的否定预期过度显性化，恰当。
