  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: zh_hans
  text: 他也使我们能够胜任作新约的服事者，不是服事字句，而是服事圣灵[a]；因为字句[b]使人死，圣灵却使人活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣灵”也可译作“灵”；本节两处相同。
    reason: alternative_reading
  - marker: b
    text: “字句”也可理解为“成文的规条”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: 使我们有资格
  rationale: 表达神使人足以并适任这项服事，既保留使动意义，也避免让人误以为只是取得正式资质。
- source_word: διακόνους
  choice: 仆役
  rationale: 保留διάκονος以服事为核心的含义，并避免把后来的教会职衔读入经文。
- source_word: καινῆς διαθήκης
  choice: 新约
  rationale: 在中文圣经语境中自然、凝练地表达新的盟约；希腊语无冠词不要求中文加数量词“一个”。
- source_word: γράμματος / γράμμα
  choice: 字句
  rationale: 保留保罗简洁而富张力的对比，不将其过早限定为“成文法典”；另一可能含义以脚注说明。
- source_word: πνεύματος / πνεῦμα
  choice: 圣灵
  rationale: 新约语境及“使人活”的行动较支持指向圣灵；希腊文大小写本身不能消除“灵”的可能，故以脚注保留。
- source_word: ἀποκτέννει
  choice: 使人死
  rationale: 保持原文现在时陈述的直接力度，并以自然中文明确其致死作用。
- source_word: ζῳοποιεῖ
  choice: 使人活
  rationale: 自然地传达赋予生命、使之活过来的主动意义，并与“使人死”形成鲜明对称。
theological_decisions:
- issue: πνεῦμα应理解为“圣灵”还是“灵”
  choice: 圣灵
  alternative: 灵
  rationale: 上下文的新约对比及赋予生命的功能最可能指圣灵，但希腊文没有现代大小写所表达的专名区分，因此用脚注保留较宽泛的译法。
- issue: γράμμα所指是否应明确为成文律法或法典
  choice: 字句
  alternative: 成文的规条
  rationale: 原文以单数γράμμα形成凝练对比，直接译作“字句”能保存其修辞和解释空间，避免在本节中把所指范围定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作……的仆役”补足中文句法中由属格表达的服事关系；重复“仆役”使“不是……而是……”的对应清楚。“圣灵”第二次不重复脚注标记，因为[a]已明确说明本节两处。
