id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: zh_hans
  text: 我们众人都以脸上没有帕子的脸，如同照镜子般观看主的荣耀[a]，正在被改变成同一形像，从荣耀到荣耀；这种改变是出于主——就是那灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同照镜子般观看主的荣耀”也可译作“如同镜子一样反映主的荣耀”。
    reason: alternative_reading
  - marker: b
    text: “出于主——就是那灵”也可译作“出于那位是灵的主”；或“出于主的灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ πάντες
  choice: 我们众人
  rationale: 直接保留强调性的“我们……都”，并用“众人”呈现 πάντες 的整体范围。
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: 敞着脸
  rationale: 完成时被动分词表达除去遮盖后持续的状态；“敞着脸”在现代汉语中自然，也承接上文摩西蒙脸帕的语境。
- source_word: τὴν δόξαν κυρίου
  choice: 主的荣耀
  rationale: 按所有格关系直译，并按项目惯例将 κύριος 译为“主”。
- source_word: κατοπτριζόμενοι
  choice: 像从镜子里观看
  rationale: 该词可指借镜观看，也可指如镜反映。正文选取较符合由观看而转变这一脉络的前者，同时在脚注保留另一可能。
- source_word: τὴν αὐτὴν εἰκόνα
  choice: 与他同样的形像
  rationale: “同样的形像”保留原文 τὴν αὐτὴν εἰκόνα；补出“与他”使汉语关系清楚，其所指由上下文中的“主”确定。
- source_word: μεταμορφούμεθα
  choice: 就渐渐变成
  rationale: 现在时被动语态表示正在持续发生的转变；“渐渐”传达过程性，而“变成”保持自然易懂。被动施事者在句末说明。
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: 从荣耀到荣耀
  rationale: 保留希腊文简洁而开放的表达，不扩写为“从一种程度的荣耀到另一种程度”，以免增加原文未明说的解释。
- source_word: καθάπερ
  choice: 正如
  rationale: 以庄重而通行的现代汉语表达比较与说明关系。
- source_word: ἀπὸ κυρίου πνεύματος
  choice: 出于主，就是那灵
  rationale: 原短语高度浓缩，正文按“主”与“灵”同位的理解译出，同时用脚注保存关系从句式及属格式的其他可能。
- source_word: κύριος
  choice: 主
  rationale: 符合现代中文圣经语域，并适用于本节两次出现的 κύριος。
theological_decisions:
- issue: κατοπτριζόμενοι 的含义
  choice: 像从镜子里观看主的荣耀
  alternative: 像镜子一样反映主的荣耀
  rationale: 上下文从看见荣耀转向被改变，较支持“借镜观看”；但“反映”在词义和语法上确有根据，因此不在正文中武断排除，而以脚注保留。
- issue: κυρίου 与 πνεύματος 在结尾短语中的关系
  choice: 出于主，就是那灵
  alternative: 出于那位是灵的主；或“出于主的灵”
  rationale: 希腊文没有冠词且结构简约，可作同位、关系说明或属格关系理解。正文采用贴近词序的同位表达，但脚注列出其他合理分析，以保留神学与句法张力。
- issue: 转变的过程与施事者
  choice: 就渐渐变成……正如出于主，就是那灵
  alternative: 正在被改变……这是出于主的灵
  rationale: μεταμορφούμεθα 是现在时被动语态，正文保留持续过程，并让末句说明转变的来源；不把末句过度解释为某一套明确的系统神学命题。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“敞着脸”呼应上文除去帕子的语境；“从荣耀到荣耀”刻意保留原文凝练的修辞。正文与脚注标记一一对应。
