revisions:
- from: 我们众人既然[a]敞着脸，像从镜子里观看主的荣耀，就渐渐变成与他同样的形像，从荣耀到荣耀，正如出于主[b]，就是那灵。
  to: 我们众人都以脸上没有帕子的脸，如同照镜子般观看主的荣耀[a]，正在被改变成同一形像，从荣耀到荣耀；这种改变是出于主——就是那灵[b]。
  rationale: 删除原文没有的“既然”，并把脚注 a 移至“观看”短语之后。以“正在被改变成”保留现在时被动的持续性，以“同一形像”避免补足未明说的比较对象。结尾以“这种改变是出于”使中文通顺，同时在正文及脚注中保留 κύριος 与 πνεύματος 关系的可争议性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:42Z'
review_pass:
