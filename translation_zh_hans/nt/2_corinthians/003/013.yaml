  source_fidelity: 草稿基本准确传达比较、面帕、以色列人和“正在消逝”的概念。但“使以色列人不能定睛看”容易表示实际能力上的不能，而πρὸς τὸ μή表达摩西蒙帕子的目的，即避免他们定睛看。将其改为“免得”更忠实地表达目的，且不额外断定结果。
  naturalness: “把帕子蒙在自己脸上”自然；“免得以色列人定睛看见……”比“使……不能定睛看”更合乎现代汉语的目的表达。以“终局”表达τέλος较明确地保留其“终结”义，并避免“结局”在现代汉语中偏向事件结果的语感。
  terminology: “摩西”“帕子”“以色列人”“定睛看”均恰当、庄重且符合本章语境。“正在消逝之事”可保留καταργουμένου的未明说指涉和进行状态。脚注保留τέλος可作“目标／结果”以及καταργουμένου可作“正被终止”的可能，未将解释性神学结论置入正文。
