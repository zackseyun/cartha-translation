source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: zh_hans
  text: 不像摩西把帕子蒙在自己脸上，免得以色列人定睛看见那正在消逝之事的终局。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那正在消逝之事的终局”也可译作“那正被终止之事的目标（或结果）”。
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: 像
  rationale: 自然表达比较关系；与前面的否定词合为“不像”，简洁而忠实。
- source_word: ἐτίθει
  choice: 把……蒙在
  rationale: 结合“帕子”和“脸”的汉语搭配，表达把遮盖物覆在脸上的动作；上下文中的摩西叙事足以承载未完成过去时所指的惯常做法。
- source_word: κάλυμμα
  choice: 帕子
  rationale: 这是现代中文圣经语境中自然且明确的面部遮盖物用语，也可延续本章的比喻。
- source_word: πρόσωπον αὐτοῦ
  choice: 自己脸上
  rationale: 主语是摩西，使用反身表达符合自然汉语，并明确帕子蒙在摩西本人的脸上。
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: 使……不能定睛看
  rationale: 保留目的意味，并以“定睛看”传达ἀτενίζω持续、专注注视的语气。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列人
  rationale: “以色列的众子”在此是指以色列民的圣经惯用语；译作“以色列人”符合现代普通话，不会误解为仅指男性。
- source_word: εἰς τὸ τέλος
  choice: 看……的结局
  rationale: τέλος在此可指终结、结果或目标；正文采用与正在消逝之事相配的“结局”，同时用脚注保留其他可能。
- source_word: τοῦ καταργουμένου
  choice: 那正在消逝之事
  rationale: 中性分词所指对象在句内未明说，故用“之事”保留一定概括性；“正在消逝”既呼应上下文逐渐失去的荣光，也避免过度强化为“废除”。
theological_decisions:
- issue: τέλος τοῦ καταργουμένου的含义
  choice: 那正在消逝之事的结局
  alternative: 那正被终止之事的目标／结果
  rationale: 上下文对比暂时与长存，正文以“结局”呈现终止意味；但τέλος也可能指目标或结果，καταργουμένου也可理解为正被终止，因此以脚注保留真实歧义，不把特定旧约神学解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帕子”“定睛看”保留经文语体但不显陈旧；将“以色列的众子”按汉语习惯译为“以色列人”。
