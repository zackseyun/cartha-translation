  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: zh_hans
  text: 我们借着弥赛亚[a]，在上帝面前[b]有这样的把握。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“朝向上帝”；也可译为“对上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: 信心
  rationale: 指坚定的把握或确信；“信心”在本段语境中自然庄重，又不把它限缩为主观感受。
- source_word: δὲ τοιαύτην
  choice: 这样的
  rationale: δὲ在此承接上文，汉语无需另加较重的连词；“这样的”保留τοιαύτην回指前文的性质。
- source_word: ἔχομεν
  choice: 有
  rationale: 直接、自然地表达所拥有的确信。
- source_word: διὰ τοῦ Χριστοῦ
  choice: 借着弥赛亚
  rationale: διά加属格表达中介或凭借；“借着”准确传达这一关系。Χριστός在此按称号译为“弥赛亚”。
- source_word: πρὸς τὸν θεόν
  choice: 对上帝
  rationale: πρός本有朝向、面向之意；“对上帝”在现代汉语中较自然，并保留这信心以上帝为关系指向的含义。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός可作为称号理解，正文采用“弥赛亚”；传统译名“基督”列入脚注，避免把一种中文称谓绝对化。
- issue: πρὸς τὸν θεόν所表达的关系
  choice: 对上帝
  alternative: 在上帝面前
  rationale: 原文既有朝向上帝的关系意味，也可在语境中理解为在上帝面前所持的信心；正文不将其单一化为法庭式或空间式含义，脚注保留另一种理解。
translation_notes:
  register: 采用现代、简明而庄重的书信体。“对上帝有这样的信心”紧贴希腊文的关系方向，同时保持普通读者易懂；以脚注说明称号译法及πρός的语义张力。
