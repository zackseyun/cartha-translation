  naturalness: “但每当人转向主，帕子就被除去”在现代标准汉语中庄重、清楚，也比“但无论什么时候，人一……就……”更凝练自然。“每当”明确表达ἡνίκα…ἐάν的不定、可反复时间意义。
  terminology: “主”恰当保留κύριον的称号和指称开放性；“转向”不越译为悔改或归信；“帕子”准确延续本段摩西帕子的意象。“被除去”保留原文被动而不添加施事者。
