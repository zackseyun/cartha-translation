base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: zh_hans
  text: 但每当人转向主，帕子就被除去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: 但无论什么时候
  rationale: ἡνίκα与ἐὰν及虚拟语气共同构成不定时间表达，可含反复或不限定的意味；“无论什么时候”自然保留这种语气，“但”则承接δέ的转折作用。
- source_word: ἐπιστρέψῃ
  choice: 转向
  rationale: 该动词在此表示方向上的转回或转向；“转向”保留比喻及属灵含义，却不把它限定为某一特定的悔改或归信术语。
- source_word: πρὸς κύριον
  choice: 向主
  rationale: πρός加宾格表示朝向某人；“向主”简洁自然，并保留方向感。
- source_word: κύριον
  choice: 主
  rationale: 按新约语境将κύριος译为“主”，同时不在本节中擅自明确为基督、圣灵或其他更具体的所指。
- source_word: περιαιρεῖται
  choice: 就被除去了
  rationale: 现在时被动语态描述转向主时帕子所发生的事；“被除去”保留被动形式，不补出施事者。“就”自然表达主句与时间条件之间的紧密关系。
- source_word: τὸ κάλυμμα
  choice: 帕子
  rationale: 上下文呼应摩西蒙帕子的叙事；“帕子”是现代中文圣经语境中明确且自然的对应，较泛泛的“遮盖物”更贴合此处意象。
theological_decisions:
- issue: 是否为ἐπιστρέψῃ补出明确主语
  choice: 译作“人一转向主”，以泛指的“人”补足中文句法
  alternative: 译作“一转向主”，不出现显式主语；或译作“有人转向主”
  rationale: 希腊文动词为第三人称单数，却没有明说名词主语，语意具有泛指性。中文用“人”可自然表达一般性的主体，而不把范围限定为某一特定个人、群体或以色列。
- issue: “主”的具体身份
  choice: 正文只译“主”
  alternative: 译作“主基督”或“主就是圣灵”
  rationale: 本节原文只有κύριον。上下文确实使“主”与基督、圣灵的关系形成复杂张力，但译文不应在此替保罗作出原文未明说的界定。
- issue: 帕子被除去的施事者
  choice: 保留被动表达“被除去了”，不说明是谁除去
  alternative: 译作“主就除去帕子”
  rationale: 原文使用被动语态且未明说施事者；补出“主”虽可能合乎某种理解，却会消除原文保留的开放性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“但无论什么时候”保留不定时间意味；“人一……就……”符合现代中文习惯。“帕子”延续上下文的摩西意象，避免使用过度古雅或教派化措辞。
