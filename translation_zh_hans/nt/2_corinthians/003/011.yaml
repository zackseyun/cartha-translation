id: 2CO.3.11
reference: 2 Corinthians 3:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: zh_hans
  text: 因为，那正在被废去的尚且伴随着荣光[a][b]，那长存的就更是在荣光中了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在被废去”也可译为“正在归于无效”、“正在被除去”或“正在终止”。
    reason: lexical_alternative
  - marker: b
    text: 直译“借着荣光”。
    reason: lexical_alternative
  - marker: c
    text: “长存的”也可译为“持续存在的”或“常在的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: 正在被废去的
  rationale: 该词是现在时被动分词，基本义为“使失效、废去、终止”。译作“正在被废去”既保留被动和过程性，也避免仅按上下文解释为“渐渐消逝”。
- source_word: διὰ δόξης
  choice: 伴随着荣光
  rationale: διά加属格通常表示“借着、通过”。此处译作“伴随着荣光”，使省略谓语的希腊语结构在现代汉语中自然可懂，同时以脚注保留较直译的表达。
- source_word: μένον
  choice: 长存的
  rationale: μένω表示“留存、持续、常在”。“长存的”保留了与“正在被废去的”之间的对照，又不在本节中明说二者具体所指。
- source_word: ἐν δόξῃ
  choice: 在荣光中
  rationale: 直接保留ἐν所表达的范围或状态，与前半句的διὰ δόξης形成措辞上的区别。
- source_word: πολλῷ μᾶλλον
  choice: 就更是
  rationale: 自然表达强烈的递进比较，与前面的“尚且”构成现代汉语中清楚的“尚且……更……”结构。
- source_word: δόξα
  choice: 荣光
  rationale: “荣光”既可指神圣的荣耀，也适合本段有关摩西面上光辉的语境；避免把含义缩窄为人的声誉或称赞。
theological_decisions:
- issue: 本节中两项事物的具体所指
  choice: 保留中性实体化分词，只译为“正在被废去的”和“长存的”
  alternative: 在正文中明确译作“旧约的职事”和“新约的职事”
  rationale: 希腊文本本节没有直接点明二者，而是让读者从上下文辨认。正文不补入具体名称，以保留保罗原有的修辞和神学张力。
- issue: καταργούμενον所表达的是消逝还是废除
  choice: 译为“正在被废去”
  alternative: 译为“渐渐消逝”
  rationale: “渐渐消逝”较贴近前文摩西面上荣光的语境，却弱化了καταργέω本身“使失效、废去”的被动意义；正文采用较贴近词义的表达，并在脚注列出其他可能译法。
- issue: διὰ δόξης与ἐν δόξῃ之间的关系
  choice: 分别译为“伴随着荣光”和“在荣光中”
  alternative: 两处都概括译为“有荣光”
  rationale: 区别两种介词结构，不将保罗有意形成的表达差异抹平；同时避免断言荣光究竟是手段、伴随情形还是领域。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尚且……就更是……”清楚呈现原文的递进论证；“荣光”与本段摩西面上的光辉相呼应。正文不显式补出“旧约”“新约”或“职事”，以免超出本节措辞。
