source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: zh_hans
  text: 其实，那曾得荣耀的，在这一点上，因那超越的荣耀，算不得有荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 其实
  rationale: 兼顾γάρ的承接、解释作用与καί的加强语气；在现代汉语中自然地引出对上一节的进一步说明。
- source_word: οὐ δεδόξασται
  choice: 也就算不得有荣耀了
  rationale: 希腊文为完成时被动形式，字面近于“没有得荣耀”。这里按比较语境译为“算不得有荣耀”，既保留保罗看似否定荣耀的修辞力度，也避免误解为前者从未真正有过荣耀。
- source_word: τὸ δεδοξασμένον
  choice: 那曾经得了荣耀的
  rationale: 保留带冠词的完成时被动分词之实体化表达，不擅自补入“职事”“约”等名词；“曾经得了荣耀”也与后文“荣耀”保持同根呼应。
- source_word: ἐν τούτῳ τῷ μέρει
  choice: 在这一点上
  rationale: 准确标明否定只限于当前比较层面，并非绝对否认先前的荣耀。
- source_word: εἵνεκεν
  choice: 因
  rationale: 简洁、自然地表达原因或根据。
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: 那远远超越它的荣耀
  rationale: 把现在分词的动态比较意味译出；“它”依据上下文补出，明确后来的荣耀超越先前所得的荣耀，同时以脚注保留原文未明说比较对象的特点。
- source_word: δόξα / δεδοξασμένον wordplay
  choice: 得了荣耀……有荣耀
  rationale: 重复使用“荣耀”，使读者看见希腊文δοξ-词族的修辞联系；结句稍作汉语化处理，避免生硬的“算不得得了荣耀”。
theological_decisions:
- issue: 本节是否绝对否认先前事物具有荣耀
  choice: 理解为限定于比较层面的否定：先前确实得了荣耀，但与远远超越它的荣耀相比，就算不得有荣耀。
  alternative: 理解为绝对否认先前的职事或约具有任何真实荣耀。
  rationale: “在这一点上”明确限制了否定的范围，而本章上下文也承认先前的职事曾带着荣耀；保罗在此强调的是后来荣耀的压倒性优越。
- issue: ὑπερβαλλούσης是否明确带出比较对象
  choice: 正文按上下文补出“它”，并用脚注说明原文的省略。
  alternative: 译作“那远远超越的荣耀”或“那超越一切的荣耀”，不点明比较对象。
  rationale: 上下文清楚表明比较的是前后两种荣耀，但希腊文本身没有明说宾语；正文求清楚，脚注保留其形式上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“其实”自然承接论证；“算不得有荣耀”保留比较性否定的悖论感。正文不补出“旧约”“新约”或“职事”，以免把上下文所指过早固定为原文未直接出现的名词。
