id: 2CO.3.5
reference: 2 Corinthians 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: zh_hans
  text: 并不是说，我们凭自己有能力把任何事看作出于自己[a]；我们的能力乃是来自上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看作”也可译作“认定”或“估量”。
    reason: lexical_alternative
  - marker: b
    text: “能力”也可译作“足够的资格”或“胜任之能”；原文与前面的“有能力”同根。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: 并不是说
  rationale: 该表达引出保罗的澄清或限定，并非说明原因；“并不是说”符合现代汉语的论述方式。
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: 我们凭自己有能力
  rationale: “凭自己”保留能力来源于自身的含义；“有能力”自然表达 ἱκανοί，并与后文“能力”保持同根词的呼应。
- source_word: λογίσασθαί τι
  choice: 把任何事看作
  rationale: λογίζομαι 在此指心里的判断、认定或估量；在否定语境中，“任何事”准确表达不定代词 τι 的广泛范围。
- source_word: ὡς ἐξ αὑτῶν
  choice: 出于自己
  rationale: 保留 ἐκ 所表达的来源意义，也与后文“来自上帝”形成鲜明对照。
- source_word: ἡ ἱκανότης ἡμῶν
  choice: 我们的能力
  rationale: “能力”既可表达足以承担某事的能力，也不把经文本身较宽的措辞限定为使徒职分上的专业资格；同时与前面的“有能力”形成词义呼应。
- source_word: ἐκ τοῦ θεοῦ
  choice: 乃是来自上帝
  rationale: 明确保留上帝是这种能力之来源；“乃是”突出与“凭自己”相反的转折关系。
theological_decisions:
- issue: 保罗所否定的人自身能力的范围
  choice: 保留经文较宽的表达，即人不能把这种能力视为源于自己。
  alternative: 明确限定为胜任使徒职事的能力。
  rationale: 上下文确实涉及新约职事，但本节希腊文措辞本身较为宽泛；译文不应把上下文含义排除，也不应将其写死为唯一范围。
- issue: 能力与来源之间的关系
  choice: 译为人的能力“来自上帝”，强调来源而不进一步界定其运作方式。
  alternative: 扩展为人完全没有任何思想或判断能力。
  rationale: ἐκ τοῦ θεοῦ 明确指出来源，但本节并未系统说明人的能动性与上帝供应之间的关系，因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凭自己……出于自己……来自上帝”保留原文对来源的反复与对照；以“能力”重复呈现 ἱκανός 与 ἱκανότης 的词根联系。
