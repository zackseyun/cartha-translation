reference: 2 Corinthians 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: zh_hans
  text: 你们显明是基督的书信[a]，由我们服事；这封信不是用墨写的，而是用永活的上帝的灵写的[b]；不是写在石版上，而是写在作为版的有血肉的心上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督的书信”也可理解为“来自基督的书信”或“基督所写的书信”。希腊语属格没有把这里的关系限定为一种。“基督”意为“受膏者”，相当于“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“永活的上帝的灵”；这里的语境指向上帝的灵，但原文在“灵”前没有另加“圣”字。
    reason: theological_ambiguity
  - marker: c
    text: “有血肉的心”呼应以西结书中以肉心取代石心的图景，参以西结书11:19；36:26。原文的表达把“版”与“有血肉的心”并置，指心作为承载书写的版。
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: 显明
  rationale: 该分词承接上文，表明哥林多人公开显露出其身份；“显明”既保留被看出、被证实的意味，也适合现代汉语句法。
- source_word: ἐπιστολὴ
  choice: 书信
  rationale: “书信”清楚保留保罗的比喻，并避免单用“信”可能被误解为“信心”。
- source_word: Χριστοῦ
  choice: 基督的
  rationale: 属格本身可表达归属、作者或来源；正文用“基督的书信”保留这种幅度，不把它限定为单一关系。
- source_word: διακονηθεῖσα
  choice: 经由我们服事而成
  rationale: 该被动分词说明保罗及同工在这封“书信”的形成中担当服事者；此译法不缩减为单纯投递，也避免生硬直译。
- source_word: ἐγγεγραμμένη
  choice: 写的
  rationale: 自然对应书信、墨和版的连贯书写意象。
- source_word: μέλανι
  choice: 墨
  rationale: 直接而自然地对应书写所用的墨。
- source_word: πνεύματι θεοῦ ζῶντος
  choice: 永活上帝的灵
  rationale: “永活”准确表达 ζῶντος 所强调的活着，与偶像和死的字句形成背景性对照；上下文表明这里所指是上帝的灵。
- source_word: πλαξὶν λιθίναις
  choice: 石版
  rationale: 简洁保留西奈之约石版的意象。
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: 版上——就是有血肉的心上
  rationale: 将 καρδίαις σαρκίναις 作为对“版”的同位说明，表达这些“版”就是人的心，而不是把原文压成不自然的多重所属结构；同时保留“血肉之心”的先知性意象。
theological_decisions:
- issue: Χριστοῦ 的属格关系
  choice: 基督的书信
  alternative: 来自基督的书信／基督所写的书信
  rationale: 原文属格可指归属、作者或来源。正文保留较宽的“基督的”，脚注说明主要可能含义，避免过早排除真实歧义。
- issue: πνεύματι 是否指上帝的圣灵
  choice: 永活上帝的灵
  alternative: 永活上帝所赐的灵／永活上帝的气息
  rationale: 墨与上帝之灵的对照，以及新约内在书写的语境，都强烈支持位格性的上帝之灵；但原文没有在此使用“圣”字，因此正文不增译“圣灵”。
- issue: καρδίαις σαρκίναις 的意象
  choice: 有血肉的心
  alternative: 肉心／属肉体的心
  rationale: 这里呼应先知书中与石心相对的肉心，重点是活的、能回应的心，并非道德意义上的“属肉体”；译作“有血肉的心”可避免错误贬义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“经由我们服事而成”保留 διακονηθεῖσα 的服事含义；分号呈现原文两组“不是……而是……”的平行对照。末句用破折号明确同位关系，使“版”与“有血肉的心”彼此等同，而非把心误作版的所有者。
