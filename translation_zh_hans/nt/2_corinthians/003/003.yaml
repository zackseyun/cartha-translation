  to: 你们显明是基督的书信[a]，由我们服事；这封信不是用墨写的，而是用永活的上帝的灵写的[b]；不是写在石版上，而是写在作为版的有血肉的心上。[c]
  rationale: 修订只处理可安全判定的语义和汉语表达问题：以“由我们服事”避免将服事者误作书信的制成者；以“作为版的有血肉的心”明确原文的同位性意象；并使“永活的上帝”符合现代汉语。脚注保留Χριστοῦ属格及πνεύματι的解释空间，且校正以西结书的历史归属表述。
