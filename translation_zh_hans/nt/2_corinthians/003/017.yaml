  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: zh_hans
  text: 主就是那灵[a]；主的灵在哪里，哪里就有自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主就是那灵”也可理解为本段语境中的紧密认同；这句话本身并未具体说明二者的关系在神学上应如何界定。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: “主”是 κύριος 在保罗书信及本段神学语境中的自然对应词，也保留其所指究竟侧重基督还是更广义的神圣称谓这一解释空间。
- source_word: πνεῦμα
  choice: 灵／那灵
  rationale: 首处带定冠词并用于判断句，译作“那灵”以表明是上下文中已知的特定所指；次处按属格结构译为“主的灵”。不直接增译“圣”，以免加入原文此处未明说的修饰语。
- source_word: δὲ
  choice: 不另译出
  rationale: 两处 δέ 主要承接和推进论述。现代汉语借分句次序和分号即可自然表达；若硬译成“现在”“但”或“而”，容易添加时间意味或强化对比。
- source_word: οὗ
  choice: 在哪里
  rationale: 以“在哪里，哪里就……”表达一般性的处所关系，既自然，也不将原文扩展为语气更强的“无论在哪里”。
- source_word: ἐλευθερία
  choice: 自由
  rationale: “自由”是现代汉语中直接、庄重且能承载本段神学含义的对应词。
- source_word: ὁ κύριος τὸ πνεῦμά ἐστιν
  choice: 主就是那灵
  rationale: 保留原文直接的等同判断，不改写成功能、作用或象征关系；“就是”清楚传达判断句的力度。
- source_word: τὸ πνεῦμα κυρίου
  choice: 主的灵
  rationale: 直接保留原文的属格关系，并与前半句形成原有的词语呼应。
theological_decisions:
- issue: “主就是那灵”这一等同陈述在神学上如何界定
  choice: 正文直接译作“主就是那灵”，不弱化等同句。
  alternative: 可将其解释为在本段语境、功能或新约事工层面的紧密认同，而不是对位格关系作穷尽性的定义；“主”也可能被理解为特指基督或作较广的神圣称谓。
  rationale: 希腊文直接使用判断句。译文应保存其力度及由此产生的神学张力，而不在正文中预先裁定这种关系应如何系统定义。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。“主的灵在哪里，哪里就有自由”使用汉语自然的对应句式。正文保留“主”“灵”之间直接而有张力的判断关系，不增添宗派性术语。
