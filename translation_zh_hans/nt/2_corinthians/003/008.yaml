  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: zh_hans
  text: 那么，圣灵的事工岂不更要在荣耀中吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: 岂不……吗
  rationale: 原文构成期待肯定回答的反问；现代汉语用“岂不……吗”自然保留其反问力度，不必机械译出“怎么不”。
- source_word: μᾶλλον
  choice: 更
  rationale: 承接上一节由较小到较大的比较论证；“更”准确表达递进比较。
- source_word: διακονία
  choice: 事工
  rationale: 这里指受托承担的圣约职事，与上下文中的另一种“事工”形成对照；“事工”比泛指的“服事”更贴合此处语境。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 结合3:6生命之灵与字句的对照，此处最自然指圣灵；补出“圣”符合现代中文指称，同时不扩写原文论述。
- source_word: ἔσται
  choice: 是
  rationale: 希腊文为将来时，但此处反问表达比较性的必然结论；汉语通常无需显式标示将来，“是”较自然，并避免误解为只在未来才成立。
- source_word: ἐν δόξῃ
  choice: 在荣耀中
  rationale: 较形式地保留介词短语及本段反复出现的“荣耀”主题，也保存其可能表示处于荣耀之中或伴有荣耀的语义张力。
theological_decisions:
- issue: πνεύματος的所指
  choice: 圣灵
  alternative: 抽象意义上的“灵”或人的灵
  rationale: 紧邻上下文将使人活的灵与字句相对照，最自然的所指是圣灵；译作“圣灵”并未额外加入宗派性解释。
- issue: ἐν δόξῃ与事工的关系
  choice: 在荣耀中
  alternative: 带着荣耀；更有荣耀；更加荣耀
  rationale: “在荣耀中”保留原文介词结构及一定歧义，不把它完全解释为事工本身的性质，也不排除荣耀伴随事工的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那么”承接上一节的比较论证；保留反问句式与“荣耀”的关键词复现。
