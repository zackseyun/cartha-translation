  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: zh_hans
  text: 你们就是我们的信，写在我们的心里，为众人所知、所读。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: 我们的信
  rationale: ἐπιστολή指书信；“信”是现代汉语中自然、清楚的对应词。属格ἡμῶν表示这封比喻性的信属于保罗及其同工。
- source_word: ὑμεῖς ἐστε
  choice: 你们就是
  rationale: 独立代词ὑμεῖς带有强调意味；“你们就是”既自然，也传达了原文的强调。
- source_word: ἐγγεγραμμένη
  choice: 写在
  rationale: 完成时被动分词表示已经写下并持续留存的状态；结合地点短语译作“写在”简洁自然。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 在我们的心里
  rationale: 保留ἐν的内在方位意象，并以现代汉语自然表达“心”的内在、情感与人格中心含义。
- source_word: γινωσκομένη
  choice: 被……所认识
  rationale: γινώσκω在此可表示“知道、认识或认出”；“认识”保留其与下文“诵读”并列而又有区别的含义。
- source_word: ἀναγινωσκομένη
  choice: 被……所诵读
  rationale: ἀναγινώσκω明确指阅读，且在古代语境中常包括公开或出声宣读；“诵读”既保留书信比喻，也与“认识”形成自然搭配。
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: 被众人
  rationale: πάντων ἀνθρώπων泛指所有人，并非专指男性；“众人”准确、凝练，符合庄重的现代汉语。
theological_decisions:
- issue: “信”写在谁的心里
  choice: 我们的心里
  alternative: 你们的心里
  rationale: SBLGNT本文明确读作ἡμῶν（我们的）；尽管有抄本异文读作ὑμῶν（你们的），正文依所给底本翻译，不因后文相似表达而调和。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留保罗将哥林多信徒比作“信”的核心隐喻，并用两个并列的被动结构呈现原文分词关系。
