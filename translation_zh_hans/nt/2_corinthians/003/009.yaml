  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: zh_hans
  text: 因为，定罪的职事若带着荣光，义的职事[a]就更洋溢着荣光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”或译“公义”。
    reason: 保留 δικαιοσύνη 可指“公义／justice”的词汇替代，同时正文避免把该名词限定为“称义”。
lexical_decisions:
- source_word: διακονία
  choice: 职事
  rationale: 上下文对比两种具有圣约背景的服事安排；“职事”既保留其正式、持续的性质，也比单说“服事”更贴合本段论述。
- source_word: κατάκρισις
  choice: 定罪
  rationale: 该词具有司法性的判罪含义，并与后文 δικαιοσύνη 构成鲜明对照。
- source_word: δόξα
  choice: 荣光
  rationale: 保留保罗在本段反复使用的神学关键词，同时在现代汉语中自然表达可显明的荣耀与光辉。
- source_word: πολλῷ μᾶλλον
  choice: 就更
  rationale: 简洁自然地表达由轻到重的强化比较，并与前面的“若”构成顺畅句式。
- source_word: περισσεύω
  choice: 充满
  rationale: 表达丰盛有余的意思；“更充满荣光”在汉语中自然，也保留第二分句较第一分句更强的程度。
- source_word: δικαιοσύνη
  choice: 称义
  rationale: 在“定罪”这一司法性反义项的衬托下，“称义”最清楚地传达此处的法庭性对比；同时用脚注保留“公义”这一较宽泛的可能译法。
- source_word: εἰ γὰρ τῇ διακονίᾳ τῆς κατακρίσεως δόξα
  choice: 因为，定罪的职事若带着荣光
  rationale: 希腊文首句没有明写动词，汉语须适当补足；“带着”表达荣光伴随这职事，却不把原文静态结构解释得过强。
theological_decisions:
- issue: δικαιοσύνη 在两种职事的司法性对比中如何翻译
  choice: 称义
  alternative: 公义
  rationale: “称义”直接回应 κατάκρισις（定罪），显出保罗论证中的法庭性对照；但 δικαιοσύνη 也可指“公义”，故在脚注保留该语义可能，不将其完全排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“职事”保持本段圣约性服事的正式语感；句式以“若……就更……”清楚呈现保罗由较小到较大的论证。
