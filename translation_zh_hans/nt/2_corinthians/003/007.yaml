id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: zh_hans
  text: 但若那属死的职事，就是以文字刻在石头上的，尚且在荣光中显现，以致以色列人[a]因摩西脸上的荣光，不能定睛看他的脸；这荣光正在消逝[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”。也可译作“以色列的儿子们”；原文为阳性复数的固定族称。
    reason: lexical_alternative
  - marker: b
    text: “正在消逝”也可译作“正在被终止”或“正在被废去”。
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: 职事
  rationale: 既保留服事的含义，也适合保罗在上下文中对两种圣约职分的对照。
- source_word: τοῦ θανάτου
  choice: 属死的
  rationale: 以简洁的属格表达保留原文“死亡的职事”所具有的力度与一定歧义，不扩写为“带来死亡的”。
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: 以文字刻在石头上的
  rationale: “文字”呼应上下文中与圣灵的对照；“刻在石头上”准确表达铭刻之意，同时不把原文仅作“石头”的措辞具体化为“石版”。
- source_word: ἐγενήθη ἐν δόξῃ
  choice: 带着荣光而来
  rationale: 自然表达其出现时伴有荣光，并保留ἐγενήθη的事件性。
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: 以致……不能定睛看
  rationale: 既保留结果关系，也表达ἀτενίζω所指持续、专注地观看。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列的众子
  rationale: 较贴近原文阳性复数“以色列的儿子们”，同时采用较庄重而可理解的中文表达。
- source_word: καταργουμένην
  choice: 正在消逝
  rationale: 可自然指摩西脸上荣光逐渐退去，也保留该词所表达的暂时性，而不直接限定为制度性的废除。
theological_decisions:
- issue: καταργουμένην是强调可见荣光逐渐消退，还是强调它正被终止。
  choice: 正在消逝
  alternative: 正在被废去／正在终止
  rationale: 直接修饰的是摩西脸上的荣光，“消逝”最符合眼前可见的语境；脚注保留“被终止”的可能，避免消除保罗论证中的更广含义。
- issue: τοῦ θανάτου是性质、结果还是关联属格。
  choice: 属死的职事
  alternative: 带来死亡的职事
  rationale: “属死的”保留原文紧凑而尖锐的表达，不把属格关系单一解释为结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“职事”保留保罗论述中的受托服事含义；句末逗号反映本节在希腊文中尚未结束，并与下一节连接。
