  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: zh_hans
  text: 因此，我们既有这样的盼望，就大大放胆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就十分坦率、毫不隐瞒。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: 我们既有
  rationale: 分词在此结合 οὖν 表达推论所依据的情形；译作“既有”既自然，也保留“因拥有这盼望而如此行”的逻辑关系。
- source_word: οὖν
  choice: 所以
  rationale: 明确表达承接上文的推论关系，符合现代汉语行文。
- source_word: τοιαύτην
  choice: 这样的
  rationale: 保留指向上文所述盼望之性质的指示与定性意味。
- source_word: ἐλπίδα
  choice: 盼望
  rationale: “盼望”是圣经语境中自然且庄重的对应词，也能体现保罗所说面向将来的确信。
- source_word: πολλῇ
  choice: 十分
  rationale: 在汉语中以程度副词自然地加强 παρρησίᾳ，传达“很大、充分”的程度。
- source_word: παρρησίᾳ
  choice: 坦然无惧
  rationale: 该词可表示放胆、坦率或公开无隐；“坦然无惧”兼顾勇气与不遮掩的语境含义，同时不把它局限为言语行为。
- source_word: χρώμεθα
  choice: 就……（如此行）
  rationale: χράομαι 加与格表示运用、表现或行事带有某种特质。汉语以“就十分坦然无惧”自然表达这种行为方式，避免生硬的“使用胆量”。
theological_decisions:
- issue: παρρησία 是指放胆行事、公开坦率，还是专指放胆说话
  choice: 正文译作“坦然无惧”，不限定为说话
  alternative: “大胆直言”或“十分坦率”
  rationale: 原文未出现“说”一词；上下文既涉及不蒙帕子，也涉及使徒职分中的坦然，因此正文保留较宽的行为方式含义，并在脚注列出言语和公开性的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以……既……就……”清楚呈现原句的推论结构；“坦然无惧”避免“使用胆量”一类翻译腔，并保留 παρρησία 在勇敢、坦率和公开无隐之间的语义张力。
