  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: zh_hans
  text: 因为合乎上帝心意的忧愁会带来通向救恩、且不致后悔的悔改[a]；但属世的忧愁却会带来死亡。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“会带来以救恩为目标、不会令人后悔的悔改。”原文“不会令人后悔的”在语法上直接修饰“悔改”。
    reason: lexical_alternative
  - marker: b
    text: “死亡”在这里没有进一步限定；其具体性质或范围并未明说。
    reason: theological_ambiguity
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: 合乎上帝心意的
  rationale: 该短语直译为“按照上帝的”，表示这种忧愁以神为准则、与神的心意相合；此译自然，并与后半句“属世的”形成清楚对照。
- source_word: λύπη
  choice: 忧愁
  rationale: 兼具情绪上的悲伤和本节语境中的道德分量，且可自然用于前后两句。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: 在此不只是改变想法，而是面对过错后发生的道德和属灵转变；“悔改”是现代中文清楚而通行的对应词。
- source_word: εἰς σωτηρίαν
  choice: 使人得救
  rationale: εἰς可表示目标或结果；此译表达悔改朝向救恩并带来得救的结果，但不进一步界定其神学机制。
- source_word: ἀμεταμέλητον
  choice: 不致后悔
  rationale: 该形容词可直接修饰“悔改”，意为这种悔改不会令人懊悔；希腊语的排列也容许它与整个“通向救恩的悔改”相连。正文采用自然中文，并以脚注保留句法上的另一种理解。
- source_word: ἐργάζεται
  choice: 会带来
  rationale: 表示产生或促成结果；“带来”在现代中文中自然，并适合表达忧愁与悔改之间的关系。
- source_word: τοῦ κόσμου
  choice: 属世的
  rationale: 表达“属于这世界、以世界为取向”的性质，与“合乎上帝心意的”构成对照。
- source_word: θάνατον
  choice: 死亡
  rationale: 忠实保留原文宽泛含义，不擅自限定为肉体、属灵或末世性的死亡。
- source_word: κατεργάζεται
  choice: 会带来
  rationale: 虽比前句的ἐργάζεται略有强化色彩，但在本节中意义十分接近；采用同一译法可保留两句的修辞平衡。
theological_decisions:
- issue: 两种忧愁的对照
  choice: 译作“合乎上帝心意的忧愁”与“属世的忧愁”，并保留“死亡”的宽泛意义。
  alternative: 将前者译作“敬虔的忧愁”，或把“死亡”明确解释为“属灵的死亡”。
  rationale: 原文强调一种忧愁按照神而有，另一种属于世界，却没有在本节限定“死亡”的具体层面；因此不加入更狭窄的教义解释。
- issue: 悔改与救恩的关系
  choice: 译作“会带来悔改，使人得救”。
  alternative: 译作“产生以救恩为目的的悔改”或“产生导致救恩的悔改”。
  rationale: 此译传达εἰς的目标或结果意义，同时避免把本节扩展成对救恩因果机制的宗派性界定。
- issue: ἀμεταμέλητον的修饰对象
  choice: 正文将“不致后悔”自然地连接于悔改及其通向救恩的整体过程。
  alternative: 明确理解为“无需后悔的悔改”，或理解为“不会令人后悔的救恩”。
  rationale: 希腊语形容词在格上直接与“悔改”一致，但词序可使读者感受到它与整个通向救恩的悔改有关；脚注保留较明确的直连译法，避免掩盖句法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“合乎上帝心意的”比“按照上帝的”自然，也避免“敬虔的”可能引入的品格侧重；全句保留原文因果对照和“死亡”一词的开放性。
