  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: zh_hans
  text: 但那安慰卑微的人[a]的上帝，借着提多的到来[b]安慰了我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灰心丧气的人”或“处境低微的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“提多的同在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文保罗所受的困苦并形成转折；“但”简洁自然。
- source_word: ὁ παρακαλῶν
  choice: 那安慰……的
  rationale: 现在时分词在此描述上帝一贯的作为；“安慰”符合患难与慰藉的语境，并与后面的 παρεκάλεσεν 保持词语呼应。
- source_word: τοὺς ταπεινοὺς
  choice: 卑微之人
  rationale: ταπεινός 可指身份或处境低微的人，也可指因患难而意气消沉的人；正文采用较宽泛的“卑微之人”，不把含义限于某一种心理状态。
- source_word: παρεκάλεσεν
  choice: 安慰了
  rationale: 与 ὁ παρακαλῶν 使用同一汉语词根，保留原文重复，并贴合保罗因提多到来而得安慰的语境。
- source_word: ἐν τῇ παρουσίᾳ
  choice: 借着……的到来
  rationale: παρουσία 在此可表示“到来”或“同在”；上下文侧重提多抵达所带来的安慰，因此正文采用自然的事件性表达。
- source_word: Τίτου
  choice: 提多
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 明确保留原文的施事主体；按自然汉语语序置于关系修饰语之后。
theological_decisions:
- issue: τοὺς ταπεινοὺς 在本节中的所指
  choice: 卑微之人
  alternative: 灰心丧气的人；处境低微的人
  rationale: 原词既可能强调低微的处境，也可能描述因困苦而低落的状态。正文保留较广的语义范围，脚注列出较具体的理解，避免把经文限定为单纯的性情谦卑或情绪沮丧。
- issue: παρουσία 的事件性与状态性
  choice: 到来
  alternative: 同在
  rationale: 本段叙事指向提多抵达并带来消息，但原词也可强调其亲临或同在；正文采用最符合语境的“到来”，同时以脚注保存另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卑微之人”略带书面色彩，以承载原词较宽的语义；整句保留“安慰……安慰了”的重复，呈现原文的修辞呼应。
