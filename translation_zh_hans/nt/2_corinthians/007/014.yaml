source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: zh_hans
  text: 因为，即使我曾向他为你们夸过口[a]，我也没有蒙羞；相反，正如我们对你们所说的一切都是真实的，我们向提多所夸的口[b]也同样显明是真的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们夸口”也可译作“谈到你们时夸口”或“以你们为夸口”。
    reason: ὑπὲρ ὑμῶν既可着重“为你们”，也可表达“关于你们”；不同译法反映同一语境中的侧重点。
  - marker: b
    text: “向提多所夸的口”也可译作“在提多面前的夸口”。
    reason: ἡ ἐπὶ Τίτου可表示向提多或在提多面前所作的夸口；脚注保留其关系表达上的弹性。
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις
  choice: 夸口
  rationale: 用同一词根对应动词和名词，保留保罗原文中的词语呼应及较强的修辞色彩；上下文表明这不是狂妄自夸，而是对哥林多人的肯定。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: ὑπέρ在此可表示“为、关于”；“为你们夸口”是自然的现代汉语，也能表达保罗以他们为夸口内容并替他们说好话的语境。
- source_word: οὐ κατῃσχύνθην
  choice: 没有蒙羞
  rationale: 保留被动含义，重点不是保罗内心没有羞耻感，而是他的夸口并未因事实不符而使他受羞辱。
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: 我们对你们所说的一切都是真话
  rationale: 以自然汉语表达πάντα的完整范围和ἐν ἀληθείᾳ的真实性含义，同时避免生硬直译“在真理中说”。
- source_word: ἡ ἐπὶ Τίτου
  choice: 在提多面前
  rationale: 较贴近ἐπί加属格在此所表达的关系，即夸口是在提多那里或提多面前作出的；脚注保留“向提多”的自然表达。
- source_word: ἀλήθεια ἐγενήθη
  choice: 证实是真的
  rationale: 原文直译近于“成了真实的”，语境是先前的夸口后来得到事实验证；“证实是真的”准确而自然。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι承接上一节并作出解释，“因为”清楚表达其论述关系。
theological_decisions:
- issue: 保罗“夸口”的性质
  choice: 译作“夸口”，由上下文显示这是得到事实印证的正面称许
  alternative: 译作“引以为荣”或“信任”以减弱负面色彩
  rationale: καυχάομαι与καύχησις在保罗书信中既可指不当自夸，也可指正当的称许和自豪。保留“夸口”可维持原词的修辞张力，不预先把它解释成某种特定的道德或教义类别。
- issue: 保罗夸口的对象与场合
  choice: 首句译“为你们夸口”，后句译“在提多面前的夸口”
  alternative: 把后句扩译为“向提多夸奖你们”
  rationale: 首句已明确夸口与哥林多人有关，后句按原文突出提多是听见这夸口的人；这样既避免不必要的重复，也不把ἐπὶ Τίτου的关系解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙羞”保留原文被动意味；“证实是真的”比直译“成了真实”更符合当代汉语。分号和“相反……正如……也同样……”呈现原句的对照与类比结构。
