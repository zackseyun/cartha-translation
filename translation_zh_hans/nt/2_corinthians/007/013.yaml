id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: zh_hans
  text: 因此，我们得了安慰[a]。在这安慰之外，我们因提多的喜乐而越发欢喜，因为你们众人都使他的心灵得到了舒畅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安慰”也可译作“鼓励”；这里的希腊词可以兼有这两层意思。
    reason: lexical_alternative
  - marker: b
    text: “得到了舒畅”直译可作“得了安息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁自然地保留原文承接上文的因果和推论关系。
- source_word: παρακεκλήμεθα
  choice: 我们得了安慰
  rationale: 完成时被动语态表示先前受到安慰而形成的现今状态；“得了安慰”兼顾动作与结果。
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: 在这安慰之外
  rationale: 按上下文理解为在已有安慰的基础上又添喜乐，避免把介词结构译得生硬，同时保留递进关系。
- source_word: περισσοτέρως μᾶλλον ἐχάρημεν
  choice: 越发欢喜
  rationale: 以自然汉语表达两个比较性强化词叠加的强调语气，不机械重复“更加、更为”。
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: 因提多的喜乐
  rationale: 明确表达提多的喜乐是保罗一行欢喜的缘由，符合ἐπί加与格在此处的语义。
- source_word: ἀναπέπαυται τὸ πνεῦμα αὐτοῦ
  choice: 他的心灵得到了舒畅
  rationale: “心灵”在现代汉语中自然指人的内在精神和情绪状态；“得到了舒畅”表达完成时所含的既成结果。
- source_word: ἀπὸ πάντων ὑμῶν
  choice: 你们众人都使
  rationale: 将来源或施事关系自然转化为汉语使动结构，并保留πάντων所强调的全体性。
theological_decisions:
- issue: τὸ πνεῦμα αὐτοῦ所指为何
  choice: 提多本人的心灵或内在状态
  alternative: 圣灵
  rationale: 第三人称属格“他的”和上下文中提多因哥林多人而舒畅的情绪反应，都表明这里指提多本人的心灵，而非圣灵。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心灵”避免将πνεῦμα误解为圣灵；“越发欢喜”自然传达原文强化性的比较表达。所有脚注标记均已置于正文相应位置。
