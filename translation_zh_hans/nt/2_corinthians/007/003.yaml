  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: zh_hans
  text: 我说这话，并不是要定你们的罪[a]；因为我以前说过，你们在我们心里，为要同死同活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是为了定罪”，或“不是以定罪为目的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以致同死同活。”原文的“同死”“同活”都强调共同性；此处的结构可带有目的、趋向或结果的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: 要定你们的罪
  rationale: πρός加宾格表示目的或指向；此处按上下文补出“你们”，自然表达保罗并非以定罪为目的，同时以脚注保留名词结构的可能译法。
- source_word: λέγω
  choice: 我说这话
  rationale: 现在时直译为“我说”；“这话”由上下文自然补出，指前文所说的话。
- source_word: προείρηκα
  choice: 我以前说过
  rationale: 完成时表示先前已经说过且如今仍然有效；“以前说过”兼顾先时性和当前关联。
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: 你们常在我们心里
  rationale: 保留复数主体“我们”和亲密的内在眷爱；汉语“在我们心里”自然表达深厚牵挂。“常”使持续归属感在现代汉语中更顺畅，并非另加时间限定。
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: 以至于同死同活
  rationale: εἰς τό加不定式可表达趋向、目的或结果；“以至于”保留与前句的紧密联系，而“同死同活”简洁对称，并保留两个συν-复合动词所强调的共同承担与团结。
- source_word: συναποθανεῖν
  choice: 同死
  rationale: 保留συν-所表达的共同性，并与“同活”形成有力的平行结构。
- source_word: συζῆν
  choice: 同活
  rationale: 保留συν-所表达的共同性，不将其限定为某一种特定神学联合。
theological_decisions:
- issue: “同死同活”是否应明确解释为圣约、婚姻或在基督里的联合
  choice: 保留保罗与哥林多人无论生死都彼此相连的团结语言，不加入特定神学类别
  alternative: 明确译成圣约忠诚，或明确视为与基督同死同活的暗示
  rationale: 经文本身清楚表达深厚的情感和共同承担，却没有在本节指定技术性的神学范畴；译文因此保留其张力与开放性。
- issue: εἰς τὸ所表达的是目的还是结果
  choice: 正文用“以至于”，呈现由“在心里”引出的深度团结；脚注保留“为要”的目的性译法
  alternative: 为要同死同活
  rationale: 该结构在此可有趋向、目的或结果色彩，不宜在正文和说明中把语义完全锁定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“定你们的罪”比抽象的“为了定罪”更自然；“同死同活”保留原文平行和情感力度。所有脚注标记均已置于正文。
