id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: zh_hans
  text: 所以，亲爱的各位，我们既有这些应许，就当洁净自己，除去肉体和灵的一切污秽，在敬畏上帝中成全圣洁。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体和灵”也可译作“身体和心灵”。这里指人的外在与内在各层面。
    reason: lexical_alternative
  - marker: b
    text: “成全圣洁”也可译作“使圣洁达到完全”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: 这些应许
  rationale: ταύτας回指前文所引的盟约性保证；“这些应许”在现代汉语中自然、准确，也符合保罗书信的用语。
- source_word: οὖν
  choice: 所以
  rationale: 明确表达本节是从前文的论述和引文得出的劝勉；汉语“所以”自然地保留推论关系。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该呼语表达保罗对收信群体的深厚爱意；补出“弟兄姊妹”符合汉语书信语境并明确指向信徒群体，不限定性别。
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: 就当洁净自己
  rationale: 第一人称复数劝勉虚拟式包括保罗和读者；“我们……就当”既保留共同参与，也传达明确的劝勉力量。
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: 除去……一切污秽
  rationale: μολυσμός含玷污、污染之意，在圣洁语境中“污秽”兼具道德和礼仪层面的色彩；“除去”自然表达ἀπό所表示的脱离。
- source_word: σαρκὸς καὶ πνεύματος
  choice: 肉体和心灵
  rationale: 这里二者并列，概括人的外在、身体层面与内在、非物质层面。“肉体”保留σάρξ的字面色彩，不误译为“罪性”；“心灵”在现代汉语中比单用“灵”更清楚地指人的内在层面。
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: 使圣洁达到完全
  rationale: ἐπιτελοῦντες表示将某事贯彻到底、完成；这一译法保留圣洁持续走向完满的动态含义，同时不暗示人靠自己取得无罪状态。
- source_word: ἐν φόβῳ θεοῦ
  choice: 在敬畏上帝中
  rationale: φόβος既有“惧怕”的力度，也在此包含面对上帝的尊崇与畏惧；“敬畏”是现代汉语中能较好保留这两方面的圣经用语。
theological_decisions:
- issue: “肉体和心灵”（σαρκὸς καὶ πνεύματος）的范围
  choice: 按人的身体与内在层面理解并翻译，保留二分表达
  alternative: 身体和心灵；肉体和灵；罪性和心灵
  rationale: 上下文以σάρξ和πνεῦμα并列，重点是整个人各层面可能受到的污秽，而非保罗所说与上帝敌对的“肉体”取向。因此不译作“罪性”，也不把措辞系统化为某种特定人论。
- issue: καθαρίσωμεν的劝勉语气
  choice: “我们……就当洁净自己”
  alternative: “让我们洁净自己”；“我们应该洁净自己”
  rationale: 希腊文第一人称复数虚拟式是包含作者与读者的共同劝勉。“就当”保留其命令力度，“我们”则保留包容性。
- issue: “使圣洁达到完全”（ἐπιτελοῦντες ἁγιωσύνην）的含义
  choice: 保留走向完成、贯彻到底的动态表述
  alternative: 成全圣洁；完善圣洁；过完全圣洁的生活
  rationale: 原文可指将圣洁贯彻到底或带到完全，不宜消解其中的进程与终点张力；同时避免额外断定此处是在教导今生达到绝对无罪。
- issue: φόβος θεοῦ的神学力度
  choice: “敬畏上帝”
  alternative: 惧怕上帝；尊敬上帝
  rationale: “敬畏”既不把φόβος淡化为一般尊敬，也不把它缩减为单纯恐惧，能保留人在上帝面前尊崇而战兢的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“亲爱的弟兄姊妹”自然呈现复数信徒群体；“污秽”“圣洁”“敬畏”保留经文的宗教伦理语域。脚注标记均置于相关句末，正文中的[a]、[b]与脚注一一对应。
