source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: zh_hans
  text: 不但因他的到来[a]，也因他因你们而得到安慰[b]；他把你们的切切想念、你们的哀恸[c]和你们为我的热忱告诉了我们，以致我更加喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到来”或译“同在”。
    reason: lexical_alternative
  - marker: b
    text: “安慰”（包括“得到安慰”）也可译作“鼓励”。
    reason: lexical_alternative
  - marker: c
    text: “哀恸”或译“哀叹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: 到来
  rationale: 在提多出行并抵达的语境中，指他的来到；“到来”自然保留事件意义，而不是抽象的“同在”。
- source_word: παρακλήσει / παρεκλήθη
  choice: 安慰 / 所得的安慰
  rationale: 上下文着重困苦后的慰藉与宽心；译文用“所得的安慰”自然表达被动含义，并尽量保留同源词之间的联系。
- source_word: ἐφ’ ὑμῖν
  choice: 从你们所得
  rationale: 介词短语可指安慰与哥林多人有关或由他们而来；结合提多因他们的回应而得安慰的语境，“从你们所得”简明自然，同时避免过度抽象。
- source_word: ἀναγγέλλων
  choice: 告诉了
  rationale: 分词说明保罗如何得知哥林多人的情形；汉语改用并列叙述更流畅。
- source_word: ἐπιπόθησιν
  choice: 切切想念
  rationale: 表达强烈的思念和渴望；“切切”保留其情感强度。
- source_word: ὀδυρμόν
  choice: 哀恸
  rationale: 该词兼有深切悲伤及哀叹的意味；“哀恸”比一般的“忧伤”更能体现强度。
- source_word: ζῆλον
  choice: 热忱
  rationale: 表示热切、恳切的投入；“热忱”在现代汉语中自然，并保留积极而强烈的情感。
- source_word: ὑπὲρ ἐμοῦ
  choice: 为我
  rationale: 保持原文宽泛含义，可包括对保罗的关切、支持或为他辩护，不进一步限定。
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: 使我更加喜乐
  rationale: 清楚表达结果，并以“更加”保留比较意味。
