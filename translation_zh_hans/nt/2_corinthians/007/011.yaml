id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: zh_hans
  text: 你们看，正是这合乎上帝的忧愁[a]，在你们里面产生了何等的认真！不但如此，还有申辩[b]、愤慨、惧怕、切望、热忱和惩处[c]。在这件事上，你们在各方面都证明自己是清白的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这敬虔的忧愁”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“为自己表明清白”。
    reason: lexical_alternative
  - marker: c
    text: 或译“伸张正义”或“讨回公道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 你们看
  rationale: 以自然的现代汉语引出保罗要求读者注意的明证；上下文已足以承载γάρ的承接、说明作用，无须生硬译出“因为”。
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: 这合乎上帝的忧愁
  rationale: 将冠词化不定式译为名词性短语“忧愁”，并以“合乎上帝”保留κατὰ θεόν所表达的准则或一致关系，不直接将其解释为人的敬虔品质。
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: 在你们里面产生了何等的热切
  rationale: κατεργάζομαι表示造成实际结果；σπουδή在此指认真、急切地采取行动。“何等”保留πόσην的感叹强调。
- source_word: ἀλλὰ
  choice: 不但如此，还有
  rationale: 此处连续出现的ἀλλά主要起递进、累加作用，而非强烈转折。汉语用总括性的“不但如此，还有”引出连串结果，既保留修辞推进，也避免逐项重复造成生硬。
- source_word: ἀπολογίαν
  choice: 申辩
  rationale: 指他们针对这件事作出答辩、表明自身立场；“申辩”简洁，并不预先断定申辩的具体内容。
- source_word: ἀγανάκτησιν
  choice: 义愤
  rationale: 表达对所涉罪恶的强烈不满；“义愤”体现其道德分量，却不擅自补明愤慨的具体对象。
- source_word: φόβον
  choice: 惧怕
  rationale: 原文未说明惧怕的对象；直译为“惧怕”，保留可能指向上帝、保罗或事态后果的开放性。
- source_word: ἐπιπόθησιν
  choice: 切望
  rationale: 表达强烈的渴望，语气庄重自然，又不把其对象明确限定为与保罗恢复关系。
- source_word: ζῆλον
  choice: 热忱
  rationale: 传达积极而强烈的投入，并与前面的σπουδή“热切”保持适度词义区别。
- source_word: ἐκδίκησιν
  choice: 惩处
  rationale: 该词可指施行公正、惩治过错；在此译为“惩处”，凸显哥林多人采取行动纠正罪行的回应，而非私人报复。其他可能含义置于脚注。
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: 在这件事上，你们在各方面都证明自己是清白的
  rationale: συνίστημι在这里是“表明、证明”；ἁγνούς就该事件而言表示没有沾染或牵连。“在各方面”概括ἐν παντί的全面性。
theological_decisions:
- issue: κατὰ θεόν如何描述忧愁
  choice: 合乎上帝的忧愁
  alternative: 敬虔的忧愁
  rationale: “合乎上帝”保留原文以信仰准则衡量这种忧愁的表达，不将其直接等同于一种已经界定好的敬虔情感。
- issue: ἐκδίκησις在悔改语境中的含义
  choice: 惩处
  alternative: 伸张正义；昭雪
  rationale: 原词具有惩治、讨回公道或施行公正的语义范围。这里可能指他们对过犯采取了应有行动；译文避免“报复”，同时不把它仅仅解释为证明自己无辜。
- issue: “清白”是否表示哥林多人从未有错
  choice: 限定为“在这件事上”所证明的清白
  alternative: 在整件事上证明自己无可指责
  rationale: 原文τῷ πράγματι明确限定范围。译文不将结论扩大为普遍无罪，也不否认他们先前需要悔改和纠正的责任。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“何等的热切”保留原文的感叹力度；结果清单使用紧凑并列结构，兼顾希腊文的修辞累积与自然汉语节奏。所有代词和抽象名词均避免补入原文未明说的对象。
