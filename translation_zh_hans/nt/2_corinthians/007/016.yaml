  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: zh_hans
  text: 我很高兴，因为我在各方面都对你们有信心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我很高兴：在各方面，我都对你们有信心。”
    reason: 保留ὅτι可引出保罗喜乐的内容，而不必明确译为原因的可能。
lexical_decisions:
- source_word: χαίρω
  choice: 我很欣慰
  rationale: 现在时主动直陈语气第一人称单数。在本段因哥林多人回应而产生喜乐的语境中，“欣慰”自然表达保罗的喜悦与宽心；“很”使现代汉语表述完整，但不把程度强化为“极其”。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι既可引出喜乐的内容，也可说明喜乐的原因。现代汉语用“因为”衔接更自然，同时不排除后句也是保罗所欣慰的内容。
- source_word: ἐν παντί
  choice: 在一切事上
  rationale: 中性单数短语在此作范围状语，表示全面的范围；“在一切事上”既贴近希腊文形式，也符合庄重、通顺的现代汉语。
- source_word: θαρρῶ
  choice: 有信心
  rationale: θαρρέω可表示有勇气、放心或有把握；与ἐν ὑμῖν连用时，语境侧重保罗对哥林多人的信任与把握，“有信心”最为自然。
- source_word: ἐν ὑμῖν
  choice: 对你们
  rationale: 这里的ἐν与θαρρέω连用，关系可理解为信心所指向或所寄托的对象。汉语通常说“对你们有信心”，比直译“在你们里面”准确自然。
