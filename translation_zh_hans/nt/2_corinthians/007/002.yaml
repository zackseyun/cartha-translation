  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: zh_hans
  text: 请接纳我们[a]！我们没有亏负过任何人，没有败坏过任何人[b]，也没有占过任何人的便宜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“请给我们腾出地方”，也可译“请容纳我们”或“请向我们敞开心怀”。这里很可能延续6:11—13中有关心胸和内在空间的关系性意象。
    reason: lexical_alternative
  - marker: b
    text: “败坏”也可译“毁坏”或“使人堕落”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: 请接纳
  rationale: χωρέω在此为复数命令式，字面意思是“给……腾出地方”。结合6:11—13关于心胸宽广和内心空间的语境，这里是请求哥林多人重新接纳保罗及其同工。“请接纳”在现代汉语中自然地表达这一关系性的呼吁；字面意象及其他译法保留在脚注中。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 作命令式动词的直接宾语，指保罗及其同工。
- source_word: οὐδένα
  choice: 任何人
  rationale: 原文连续三次重复οὐδένα，形成强调性的三重否认。译文三次保留“任何人”，以再现其修辞力度。
- source_word: ἠδικήσαμεν
  choice: 亏负过
  rationale: ἀδικέω表示不公正地对待、伤害或亏负某人。“亏负”简洁自然，涵盖面足够宽，不限定伤害的具体种类。
- source_word: ἐφθείραμεν
  choice: 败坏过
  rationale: φθείρω可表示败坏、毁坏或使腐化。在此关系及道德语境中，“败坏”既可指给人造成道德或属灵损害，又不武断地限定具体方式；其他可能含义列入脚注。
- source_word: ἐπλεονεκτήσαμεν
  choice: 占过……的便宜
  rationale: πλεονεκτέω表示为谋取利益而利用、欺骗或侵占别人。“占……的便宜”是清楚自然的现代汉语，能够涵盖经济或关系上的剥削，而不像“诈骗”那样限于财务欺诈。
theological_decisions:
- issue: Χωρήσατε ἡμᾶς所表达的呼吁性质
  choice: 理解为保罗请求哥林多人在关系上接纳他和他的同工
  alternative: 理解为较一般性的欢迎或接受，不特别强调恢复关系
  rationale: 紧接的上下文（6:11—13）谈到宽广的心和内在空间，因此这里很可能延续关系性的意象。正文采用自然的“接纳”，脚注保留“腾出地方”的字面表达，避免把“心里”这一上下文推断直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三句否认均保留“任何人”，呈现原文的排比和强调；末句加入“也”，使汉语递进自然，但不改变原意。
