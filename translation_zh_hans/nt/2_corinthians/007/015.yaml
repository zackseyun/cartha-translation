  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: zh_hans
  text: 他想起你们众人都顺服，又想起你们怎样怀着敬畏和战兢接待了他，他对你们的感情就越发深厚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏和战兢”也可译作“恐惧和战兢”。这是保罗书信中惯用的表达，指严肃、谦卑而恭敬的回应，并不必然指畏缩性的恐怖。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: 疼爱
  rationale: 该词字面指内脏，作为情感用语表示发自内心的深厚感情或温情。“疼爱”在现代汉语中自然传达提多对哥林多信徒深切而温厚的爱。
- source_word: περισσοτέρως
  choice: 越发
  rationale: 比较级副词表示程度进一步加深；“越发”也自然呼应后面的回想内容。
- source_word: εἰς ὑμᾶς
  choice: 你们
  rationale: 表示感情所指向的对象；汉语以“疼爱你们”自然表达，无须机械译出介词。
- source_word: ἀναμιμνῃσκομένου
  choice: 一想起
  rationale: 属格分词说明提多感情加深时所伴随的情形和缘由；“一想起”保留回想与感情增强之间的紧密联系。
- source_word: ὑπακοήν
  choice: 顺服
  rationale: 直接表达听从、服从之意，并符合本段中哥林多信徒响应使徒劝诫的语境。
- source_word: πάντων ὑμῶν
  choice: 你们众人的
  rationale: 保留原文对整个群体的强调，而不将其弱化为泛指。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 以敬畏战兢的态度
  rationale: 保留保罗惯用语中“战兢”的鲜明表达，同时用“敬畏”呈现此处严肃、谦卑而恭敬的意味；“的态度”为汉语自然表达所需。
- source_word: ἐδέξασθε
  choice: 接待
  rationale: 此处指哥林多人对提多的迎接和接受；“接待”比单纯“接受”更适合人物来访的语境，又不过度扩展为热烈欢迎。
- source_word: αὐτόν
  choice: 他
  rationale: 依照原文保留代词；上下文中所指为提多。
theological_decisions:
- issue: “φόβου καὶ τρόμου”描述哥林多人接待提多时的含义
  choice: 译作“敬畏战兢”，表达严肃、谦卑和恭敬的回应，同时保留战兢感
  alternative: “恐惧战兢”或“又敬畏又战兢”
  rationale: 该短语是保罗书信中的惯用表达，此处不宜理解为畏缩的恐怖，也不应完全消除“φόβος”的惧怕色彩。正文采用自然而庄重的“敬畏战兢”，脚注交代较直译的可能性，以保留语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。调整希腊语分词结构，以“一想起……想起……就越发……”呈现回想与感情加深的关系；避免生硬直译“他的心肠”，但保留深厚温情。脚注标记置于整句末尾，所释短语清楚可辨。
