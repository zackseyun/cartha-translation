  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: zh_hans
  text: 因为我们到了马其顿时，连我们的肉身[a]也不得安歇；反倒在各样事上受压迫——外有争战，内有惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的肉身”也可意译为“我们自己”。希腊原文直译为“我们的肉身”；这里指人在肉身软弱和困苦中的整体处境，并非指“罪性”。
    reason: 说明 σάρξ 的字面表达及在本节中的整体性用法，同时保留自然汉语的意译选择。
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: 因为，即使
  rationale: 既保留与上文的解释性连接，也表达 καί 在此处略带强调的语气；在汉语中与后面的“也”呼应，自然呈现“甚至到了……仍然……”之意。
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: 我们到了马其顿
  rationale: 将属格独立结构按时间关系译出；“到了”自然表达进入并抵达马其顿。
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: 没有得到丝毫安歇
  rationale: ἄνεσις 指压力中的松缓、歇息或舒解；“安歇”符合庄重语体，“丝毫”体现 οὐδεμίαν 的完全否定。
- source_word: ἡ σὰρξ ἡμῶν
  choice: 我们的肉身
  rationale: 保留原文具体措辞，不将 σάρξ 误解为“罪性”；这里指处于软弱和困苦中的有形生命。较顺畅的意译“我们自己”列入脚注。
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: 反而处处受患难
  rationale: θλίβω 表示受压迫、遭困苦；“处处”简洁涵盖 ἐν παντί 所表达的各方面处境。
- source_word: ἔξωθεν μάχαι
  choice: 外有争战
  rationale: μάχαι 可指争斗、冲突，不必限定为武装战斗；“争战”保持词义张力，并与下句形成整齐对照。
- source_word: ἔσωθεν φόβοι
  choice: 内有惧怕
  rationale: φόβοι 是复数的恐惧、忧惧；“内有惧怕”准确呈现内在压力，并与“外有争战”平衡对应。
theological_decisions:
- issue: σάρξ 的理解
  choice: 我们的肉身
  alternative: 我们自己；我们的身体
  rationale: 本节的 σάρξ 并非指道德意义上的“罪性”，而是指保罗一行作为有形、软弱之人的处境。正文保留“肉身”以呈现原文意象，同时用脚注说明其整体指向。
- issue: 外在争战与内在惧怕的关系
  choice: 保留并列对照，不具体限定所指事件
  alternative: 将“争战”解释为逼迫，或将“惧怕”解释为焦虑
  rationale: 原文只给出概括性的复数名词，没有明确说明具体冲突或恐惧的内容；译文保留这种开放性和张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“外有争战，内有惧怕”保留原文简短有力的平行结构；“丝毫安歇”强化完全没有舒缓的语气。
