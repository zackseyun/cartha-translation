language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: zh_hans
  text: 我对你们十分放胆[a]，也大大以你们为夸耀。我充满了安慰[b]；在我们所受的一切患难中，我的喜乐格外满溢[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放胆”也可译作“坦诚”或“信心”。原文可指坦率、毫不隐瞒地说话，也含有自信无惧的意思。
    reason: lexical_alternative
  - marker: b
    text: “安慰”也可译作“鼓励”或“慰藉”；原文兼有得安慰与受坚固的意思。
    reason: lexical_alternative
  - marker: c
    text: “在……患难中”也可理解为“尽管遭受……患难”；原文强调喜乐在一切患难之中仍然满溢。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: 坦诚
  rationale: 该词可指放胆、信心或坦率直言；与πρὸς ὑμᾶς连用时，重点是保罗对哥林多人毫不隐瞒、坦然直言的态度。“坦诚”在现代汉语中自然，并保留关系和言语两方面的含义。
- source_word: πρὸς ὑμᾶς
  choice: 对你们
  rationale: πρός加宾格在此表示关系所指向的对象；“对你们”简洁自然。
- source_word: καύχησις
  choice: 夸耀
  rationale: 保留保罗书信中καύχησις的修辞力度及其可用于正面语境的特点，不淡化为单纯的“自豪”或“信心”。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: ὑπέρ加属格可表示“为了、代表、论到”。“为你们夸耀”既可指以他们为夸耀的缘由，也带有为他们说好话的意味，适度保留原文范围。
- source_word: πεπλήρωμαι
  choice: 我满得
  rationale: 完成时被动语态表达由先前行动形成、持续至今的充满状态；“满得”简洁地传达当前结果。
- source_word: παρακλήσει
  choice: 安慰
  rationale: παράκλησις兼有安慰、鼓励和坚固之意；在患难及提多所带消息的语境中，“安慰”最自然，同时以脚注保留“鼓励”的可能。
- source_word: ὑπερπερισσεύομαι
  choice: 格外满溢
  rationale: 该强化复合动词表示极其丰盛、超过通常程度；“格外满溢”比单说“满溢”更能体现ὑπερ-的加强作用。
- source_word: χαρᾷ
  choice: 喜乐
  rationale: χαρά直指喜乐；“喜乐”庄重、通顺，并符合书信语体。
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: 在我们所受的一切患难中
  rationale: ἐπί加与格在此可表达处境或基础；译作“在……中”保留喜乐与患难并存的张力，而不直接改释为“尽管”。
- source_word: πολλή ... πολλή
  choice: 十分……常常
  rationale: 重复的πολλή强调程度或分量。汉语分别按搭配自然表达：“十分坦诚”表示程度，“常常为你们夸耀”表达大量夸耀行为；虽未机械重复同一词，却保留双重强调。
theological_decisions:
- issue: 如何表达保罗正面使用καύχησις而不预设这是罪性的自夸
  choice: 译为“夸耀”
  alternative: 译为“以你们为荣”或“对你们很有信心”
  rationale: “夸耀”保留保罗原有的强烈修辞及其书信中的词汇联系；上下文本身表明这里并非自我高举，无须在译文中将其弱化。
- issue: 如何保留喜乐与患难同时存在的张力
  choice: 译为“在我们所受的一切患难中”
  alternative: 译为“尽管我们遭受一切患难”
  rationale: 原文ἐπί加与格容许理解为在患难的处境中；采用“在……中”不把关系单一化为让步，更忠实地保留原文张力。
- issue: παράκλησις在患难语境中的复合含义
  choice: 正文译“安慰”，脚注注明也可译“鼓励”
  alternative: 正文译“鼓励”
  rationale: 该词同时涵盖慰藉和坚固；临近经文强调神借提多到来安慰保罗，因此“安慰”贴合语境，但不排除鼓励之意。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“坦诚”“满得安慰”“喜乐格外满溢”保持保罗情感强烈、层层推进的表达；脚注保留παρρησία、παράκλησις及ἐπί短语的真实语义幅度。
