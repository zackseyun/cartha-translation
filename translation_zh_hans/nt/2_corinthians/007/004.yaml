  rationale: 修订将两处πολλή一致处理为程度上的强烈：“十分放胆”与“大大以你们为夸耀”，纠正“常常”所造成的频率偏移。以“放胆”承载παρρησία的力度，并以注释保留坦率和信心的语义范围。“我充满了安慰”替换不自然的“我满得安慰”。“在我们所受的一切患难中”保留原文喜乐与患难同时存在的张力，未擅自将其限定为单纯让步关系。
