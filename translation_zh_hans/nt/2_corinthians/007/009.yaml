reference: 2 Corinthians 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: zh_hans
  text: 现在我欢喜，不是因为你们忧伤，而是因为你们忧伤，以致悔改；因为你们是照着神的意思忧伤[a]，好让你们不因我们而受任何损失[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以合乎神的方式忧伤”，或“照神所愿的忧伤”。
    reason: 保留κατὰ θεόν可表示按神的标准、合乎神的方式或照神旨意的语义幅度。
  - marker: b
    text: 或译：“不受到由我们造成的伤害”。
    reason: ἐξ ἡμῶν可侧重损失的来源或成因，ζημιωθῆτε也可译作“受到伤害”。
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 表达保罗从先前使他们忧伤转到如今欢喜的时间与处境对比，简洁自然。
- source_word: χαίρω
  choice: 我欢喜
  rationale: 保留现在时的陈述语气和书信中略显庄重的表达；“我高兴”也可，但语体较平。
- source_word: ἐλυπήθητε
  choice: 你们忧伤
  rationale: 按现代汉语习惯表达希腊语被动形式；全节重复使用“忧伤”，保留原文的修辞呼应，同时不强行指明使他们忧伤的施事者。
- source_word: εἰς μετάνοιαν
  choice: 以致悔改
  rationale: εἰς在这里指向忧伤所产生的结果；“以致”自然表达这一方向和结果。μετάνοια在本语境中具有道德和属灵转向的含义，译为通行且准确的“悔改”，不弱化为单纯“改变想法”。
- source_word: κατὰ θεόν
  choice: 照着神的意思
  rationale: 在可懂的现代汉语中保留忧伤与神的标准、旨意或所愿之间的关系；不直接压缩为性质形容词“敬虔的”。
- source_word: ζημιωθῆτε
  choice: 受任何损失
  rationale: 保留ζημιόω所表达的受损、遭受亏损之义，又不将其过度限定为身体伤害。
- source_word: ἐξ ἡμῶν
  choice: 因我们
  rationale: ἐξ表示损失的来源；汉语用“因我们”自然表达由保罗一方所造成或带来的可能损失。
theological_decisions:
- issue: μετάνοια所指的转变性质
  choice: 悔改
  alternative: 改变心意
  rationale: 本语境中的μετάνοια不是价值中性的思想变化，而是由合乎神旨意的忧伤所带来的道德与属灵转向；“悔改”准确而不额外引入宗派解释。
- issue: κατὰ θεόν中忧伤与神的关系
  choice: 照着神的意思忧伤
  alternative: 以合乎神的方式忧伤；照神所愿的忧伤；敬虔地忧伤
  rationale: 原短语可以涉及按神的标准、符合神的旨意或如神所愿。正文采用可理解而相对开放的表达，并以脚注保留其他可能侧重，不把它固定成某种特定教义术语。
- issue: ἵνα从句的功能
  choice: 好让你们不因我们而受任何损失
  alternative: 结果使你们不因我们受损失
  rationale: ἵνα可表达目的或预期结果；“好让”保留目的色彩，同时不必断定谁的主观意图是唯一焦点。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。保留原文三次出现的“忧伤”，呈现保罗的对比与论证推进。正文不沿用英文咨询层中置于“我欢喜”后的脚注，因为该脚注内容实际涉及μετάνοια，并非χαίρω的词义异读；中文正文直接以“悔改”准确表达。脚注按正文出现顺序标为[a]、[b]。
