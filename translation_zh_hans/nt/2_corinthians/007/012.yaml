source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: zh_hans
  text: 所以，即使我写信给你们，也不是为了那行不义的人，也不是为了那受了不义对待的人，而是为了使你们为我们所怀的热忱在上帝面前在你们中间显明出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“而是为了使我们为你们所怀的热忱在上帝面前在你们中间显明出来。”
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: 所以，我即使
  rationale: “所以”承接上文的推论，“即使”保留 εἰ καὶ 的让步意味，同时符合现代汉语表达。
- source_word: ἔγραψα ὑμῖν
  choice: 写了信给你们
  rationale: 以过去时语境表达保罗先前写信一事；补出“信”使汉语自然，但不增加原文所无的具体内容。
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: 不是为了那行不义的人
  rationale: 保留 ἕνεκεν 的目的或缘由色彩，并用“行不义的人”对应主动分词，避免把事件过度具体化。
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: 也不是为了那受委屈的人
  rationale: 用被动表达对应 ἀδικηθέντος，并与前句形成平行；“受委屈”在现代汉语中自然且不限定所受侵害的性质。
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: 而是要使……显明
  rationale: 表达带 ἕνεκεν 的目的结构，并保留 φανερωθῆναι 的被动或结果意味。
- source_word: τὴν σπουδὴν ὑμῶν
  choice: 你们……所怀的热忱
  rationale: σπουδή 可指殷切、热心或认真关切；“热忱”兼顾情感与行动倾向，语体庄重而易懂。
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: 为我们所怀的
  rationale: 以“为我们”保留 ὑπέρ 所表达的关切和支持方向，不将其限定为某一种具体行动。
- source_word: πρὸς ὑμᾶς
  choice: 在你们中间
  rationale: 此处句法较难；依上下文将 πρός 理解为显明所涉及的群体范围，使汉语可读，同时不消除原句张力。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留神圣见证与临在的庄重语境。
theological_decisions:
- issue: “你们为我们所怀的热忱……在你们中间”的指向及句法关系
  choice: 按 SBLGNT 正文译为哥林多人为保罗一行所怀的热忱，并将 πρὸς ὑμᾶς 译作“在你们中间”。
  alternative: 有抄本作“我们为你们所怀的热忱，在上帝面前显明在你们中间”。
  rationale: 正文保留 ὑμῶν 与 ὑπὲρ ἡμῶν 的自然对应，不以较顺畅的异文取代所给希腊文本；因异文会改变热忱的主体和对象，故列入脚注。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“行不义的人／受委屈的人”保持主动与被动分词的平行；困难的末句尽量贴近原文，并以脚注保存重要异文。
