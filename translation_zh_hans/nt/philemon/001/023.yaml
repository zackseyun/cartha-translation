  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: zh_hans
  text: 在基督耶稣里与我一同被囚的以巴弗，向你问安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，即“弥赛亚”。
    reason: 说明Χριστός的称号含义，同时保留正文中自然且通行的“基督耶稣”。
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: 向……问安
  rationale: ἀσπάζομαι在书信问候语中表示问候或致意；“向你问安”自然、庄重，也保留了单数主语以巴弗主动问候单数受信人的结构。
- source_word: σε
  choice: 你
  rationale: 这是第二人称单数宾格，直接指向腓利门；现代汉语用“你”准确表达。
- source_word: Ἐπαφρᾶς
  choice: 以巴弗
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: ὁ συναιχμάλωτός μου
  choice: 与我一同坐牢的
  rationale: συναιχμάλωτος指与另一人一同被囚的人。译成“与我一同坐牢的”比生硬的“我的同囚”更符合现代汉语，同时不把它强化为特指战俘的用语。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: 保留ἐν“在……里”的表达，以呈现保罗书信中与基督联合或归属于基督的语言，不擅自改释为“为了”或“因为”。Χριστός采用中文通行的称号“基督”，Ἰησοῦ译作“耶稣”。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ与“同囚”之间的关系
  choice: 在基督耶稣里与我一同坐牢的
  alternative: 为了基督耶稣与我一同坐牢的
  rationale: 原文使用ἐν而非明确表示原因或目的的介词。直译“在……里”保留了“与基督联合、归属于基督”以及该短语可能同时界定其同囚身份的神学张力。
- issue: Χριστός在固定短语中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός本义为“受膏者”，具有弥赛亚称号意义；但“基督耶稣”是该希腊语次序在现代标准汉语中的自然、通行表达。脚注提示其称号含义，避免读者只把“基督”当作姓名。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“坐牢”比“被囚”更贴近日常现代汉语，但仍适合此处语境；句序按汉语习惯把修饰以巴弗的成分前置。
