  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: zh_hans
  text: 因为我听说你对主耶稣和对众圣徒所怀的爱与信心[a][b][c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按意思更明确地说，也可译作：“你对主耶稣的信心，以及对众圣徒的爱。”
    reason: alternative_reading
  - marker: b
    text: “信心”也可译作“忠信”。希腊语原词可指信、信靠或忠信。
    reason: lexical_alternative
  - marker: c
    text: “你所怀的爱与信心”也可译作“你的爱和你所怀的信心”。
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: 因为我听说
  rationale: 分词承接上一节感恩的句法，在此具有原因意味；用“因为我听说”既符合现代汉语，也保留其与上文的依存关系。
- source_word: ἀγάπην
  choice: 爱
  rationale: ἀγάπη在此采用新约中自然、通行的译法“爱”。
- source_word: πίστιν
  choice: 信心
  rationale: πίστις在此主要译为“信心”；该词也可能含“忠信”之意，故在脚注保留这一词义可能。
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: 对主耶稣
  rationale: πρός表示面向某人的关系或指向；“对主耶稣”保留这种方向性，也与后面的εἰς短语形成有限区分。
- source_word: κύριον
  choice: 主
  rationale: 作为耶稣的称号，κύριος按新约惯例译为“主”。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: 对众圣徒
  rationale: εἰς在这里表示关系的指向；“对众圣徒”在汉语中自然，并避免预先限定爱与信心的分配方式。
- source_word: ἁγίους
  choice: 圣徒
  rationale: “圣徒”是保罗书信中称呼信徒群体的简洁、通行译法。
theological_decisions:
- issue: “爱”与“信心”如何分别关联后面的两个介词短语
  choice: 按希腊文表层次序，将“爱与信心”一并置于“对主耶稣和对众圣徒”之前，不在正文中明确重新分配。
  alternative: 按通常理解明确译为“你对主耶稣的信心，以及对众圣徒的爱”。
  rationale: 分配式理解符合保罗常见的表达和本书第7节，但希腊文先并列两个名词，随后才出现关系从句和两个介词短语，没有明示各自对应关系。正文保留这种张力，脚注说明较明确的按意义译法。
- issue: πίστις在本节的含义
  choice: 信心
  alternative: 忠信
  rationale: “信心”是πίστις的通常译法；鉴于语境也可能涉及忠诚可靠的品格，以脚注保留“忠信”，而不在正文中排除这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本节是承接第4节的未完句，因此正文末保留逗号。正文有意保留希腊文中“爱与信心”同后面两个对象之间的结构歧义；所有脚注标记均置于正文。
