  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: zh_hans
  text: 愿主耶稣基督的恩典与你们的灵同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”在原文中是复数，表明这项结尾的祝福不只给腓利门一人，也给共同领受这封信的人。
    reason: 说明原文代词的数及祝福对象的范围。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗书信祝福语中的惯用词，指主所赐的恩惠与福泽；“恩典”既准确又符合现代中文基督教语境。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος在此处作为耶稣尊称的基督论分量，也是自然、通行的中文表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 在这一固定祝福语中，Χριστός虽源于“受膏者”的称号，却已与“耶稣”紧密组合，中文用“耶稣基督”最自然，并不把它误作现代意义的姓氏。
- source_word: μετὰ
  choice: 同在
  rationale: 希腊文直译为“与……一起”，句中省略系词；中文祝福语用“同在”自然地补足其祈愿含义。
- source_word: πνεύματος
  choice: 灵
  rationale: 带有第二人称所有格，主要指收信众人的灵或内在生命；采用小写概念的“灵”，不明确断定为圣灵。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 明确保留希腊文第二人称复数，表明这项祝福不只临到腓利门，也临到本信开头所列及聚会中的其他收信人。
theological_decisions:
- issue: Χριστοῦ在结尾祝福语中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”在现代中文中是Χριστός成熟而庄重的对应词，也仍保有“受膏者”的称号背景；此固定组合译作“耶稣基督”比“耶稣弥赛亚”更自然。
- issue: “你们的灵”的所指
  choice: 收信众人的灵或内在生命
  alternative: 圣灵
  rationale: ὑμῶν是复数所有格，最直接地修饰收信人的“灵”；正文不加解释性词语，尽量保留原文措辞，同时不以“圣灵”强行确定其所指。
- issue: 祝福对象的范围
  choice: 复数的“你们”
  alternative: 单数的“你”
  rationale: 原文ὑμῶν明确为复数；即使本信主要写给腓利门，结尾祝福仍延及共同收信者，因此中文必须显明复数。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“愿……同在”自然呈现希腊文无动词祝福句的祈愿语气；以“你们的灵”直接保留原文的复数所有结构。
