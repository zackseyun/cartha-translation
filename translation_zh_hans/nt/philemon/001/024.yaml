  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: zh_hans
  text: 马可、亚里达古、底马和路加——我的同工。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: 马可
  rationale: 采用现代中文圣经中通行的人名音译，指 Mark。
- source_word: Ἀρίσταρχος
  choice: 亚里达古
  rationale: 采用现代中文圣经中通行的人名音译，指 Aristarchus。
- source_word: Δημᾶς
  choice: 底马
  rationale: 采用现代中文圣经中通行的人名音译，指 Demas。
- source_word: Λουκᾶς
  choice: 路加
  rationale: 采用现代中文圣经中通行的人名音译，指 Luke。
- source_word: οἱ συνεργοί
  choice: 同工
  rationale: συνεργός 指与人一同工作、共同劳作的伙伴；“同工”简洁自然，并保留共同参与事工的含义。
- source_word: μου
  choice: 我的
  rationale: 第一人称属格代词，表明这些人与保罗之间共同工作的关联。
theological_decisions:
- issue: 本节在希腊文中是承接第23节的省略句，未重复问候动词。
  choice: 补出“也问候你”
  alternative: 仅译作“马可、亚里达古、底马、路加——我的同工。”
  rationale: 原文名单与同位语承接上一节的问候结构；现代汉语若完全保留省略会显得句意残缺，因此按语境补出隐含谓语，不改变所指关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同工”在中文基督教语境中自然，同时准确表达共同劳作伙伴之意；以破折号引出“我的同工”，清楚呈现原文同位关系。
