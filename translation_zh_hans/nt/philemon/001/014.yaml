  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: zh_hans
  text: 但没有你的同意[a]，我本不愿做任何事，为的是不让你的善举[b]像是出于勉强，而是出于自愿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的认可”或“你的意见”。
    reason: lexical_alternative
  - marker: b
    text: 或译“你的善良”或“你的恩惠”；希腊语既可指腓利门在这件事上的善行，也可较抽象地指他的善良。
    reason: lexical_alternative
  - marker: c
    text: 直译“按自愿的方式”；意思是“出于你自己的意愿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: 没有你的同意
  rationale: γνώμη 可指意见、判断、意愿或同意；本节语境强调保罗不愿在未获腓利门认可的情况下行事，因此“同意”最自然地表达这里的关系与意志层面，同时以脚注保留其他可能。
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: 我什么也不愿意做
  rationale: θέλω 表达意愿；此译保留保罗主观上不愿采取行动的语气，不把它强化为正式决定。
- source_word: ἵνα μὴ
  choice: 为的是不让
  rationale: 清楚表达目的关系，并符合现代汉语习惯。
- source_word: ὡς κατὰ ἀνάγκην
  choice: 像是出于勉强
  rationale: ἀνάγκη 在此表示外在压力或强迫；“像是”对应 ὡς，保留原文没有直接断言善举确实受强迫的缓和语气。
- source_word: τὸ ἀγαθόν σου
  choice: 你的善举
  rationale: 带冠词的中性形容词很可能指腓利门在此事上所行的好事。“善举”既自然又保持具体行为的指向；脚注保留抽象理解。
- source_word: ᾖ
  choice: 让……出于
  rationale: 在 ἵνα 引导的目的从句中，汉语无需另译虚拟语气；以“让……出于”自然呈现其目的性。
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: 而是出于自愿
  rationale: ἑκούσιον 指自愿、甘心而行；“出于自愿”与“出于勉强”形成清楚、对称的对比。
theological_decisions:
- issue: 腓利门回应的性质
  choice: 把保罗的关注译为腓利门应当自愿行善，而非受迫而行，但不说明善举的具体内容。
  alternative: 将 τὸ ἀγαθόν σου 抽象地译作“你的善良”，或更具体地译作“你的恩惠”。
  rationale: 本节强调回应的道德性质在于自愿而非勉强；原文没有明确说明所指的具体行动，因此不应在译文中加入比原文更具体的伦理或教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“善举”简洁表达具体的好行为，“像是”保留 ὡς 的语气，不把保罗的话强化为对腓利门受迫的直接断言。
