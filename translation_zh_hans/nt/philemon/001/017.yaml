id: PHM.1.17
reference: Philemon 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: zh_hans
  text: 所以，你若把我看作伙伴，就接纳他[a]，像接纳我一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢迎他”。原文动词可指友善地接待某人，也可指接受某人进入彼此相交的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: 所以，你若
  rationale: “所以”保留οὖν承接上文、引出推论的作用；“若”自然表达εἰ的条件关系。
- source_word: ἔχεις κοινωνόν
  choice: 把我看作伙伴
  rationale: κοινωνός指共同有分、共同参与的人；“伙伴”能自然表达保罗与腓利门之间共享关系和地位的意味。“把我看作”则以现代汉语表达ἔχεις在此结构中的关系性含义。
- source_word: προσλαβοῦ
  choice: 接纳
  rationale: 这个中动态命令式可指接待、欢迎或认可接纳某人。“接纳”既可包含实际接待，也保留关系上接受对方的意味。
- source_word: αὐτὸν
  choice: 他
  rationale: 按上下文指阿尼西谋。
- source_word: ὡς ἐμέ
  choice: 像接纳我一样
  rationale: 补出汉语比较句中自然需要的动词，使意思清楚，同时保留“以对待我的方式对待他”的比较力量。
theological_decisions:
- issue: κοινωνός在保罗请求中的关系含义
  choice: 伙伴
  alternative: 同伴；共同有分的人
  rationale: 此词强调保罗与腓利门之间的共同参与和相互关系，并非某种宗派性或教义性的专门称谓。“伙伴”简明自然，也保留这种共同有分的社会和教会关系。
- issue: προσλαβοῦ所涵盖的接待与关系恢复意味
  choice: 接纳
  alternative: 欢迎；接待
  rationale: “接纳”不把命令局限于礼貌欢迎或住宿接待，也不额外断定具体的法律或社会安排，因而能保留原文较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“所以，你若……”清楚承接上文；“像接纳我一样”符合自然汉语，并避免生硬直译为“如同我”。脚注标记置于其实际说明的“接纳他”之后。
