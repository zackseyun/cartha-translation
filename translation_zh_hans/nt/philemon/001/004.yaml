base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: zh_hans
  text: 我在祷告中常常提到你，感谢我的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在祷告中记念你。”希腊文较直译为“提到你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 我……感谢
  rationale: 现在时主动直陈语气第一人称单数。译为“感谢”自然直接，并保留向神感恩的动词意义。
- source_word: τῷ θεῷ μου
  choice: 我的神
  rationale: 与“感谢”连用的与格表示感谢的对象；现代汉语自然表达为“感谢我的神”，同时保留原文亲切而个人化的“我的”。
- source_word: πάντοτε
  choice: 常常
  rationale: 在书信感恩祷告的语境中，表示一贯、持续的习惯。译为“常常”比绝对化的“总是”更符合自然汉语，也不强行规定该副词只修饰主句或分词短语。
- source_word: μνείαν σου ποιούμενος
  choice: 提到你
  rationale: 这一惯用表达字面为“提及你”。在祷告语境中，“提到你”保留了在神面前说到对方的言语意味；“记念你”也是可能的理解，但语义略偏向内心记得。
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: 在祷告中
  rationale: ἐπί加属格在此表示祷告之时或祷告这一场合；“在祷告中”是清楚、自然的现代汉语。
