  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: zh_hans
  text: 我为我孩子的事向你恳求，就是我在捆锁中[b]所生的[a]阿尼西谋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所生的”也可意译为“我在被囚期间成为他父亲的”。原文采用生育的比喻，表达保罗与阿尼西谋之间属灵的亲子关系。
    reason: lexical_alternative
  - marker: b
