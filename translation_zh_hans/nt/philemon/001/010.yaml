    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ σε
  choice: 我……向你恳求
  rationale: 这里是保罗出于个人关系所作的诚恳请求；“恳求”既保留郑重亲切的语气，也不把它译成命令。
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: 为我的孩子
  rationale: περί加属格表示“关于、为了”；在汉语请求句中，“为……向你恳求”较自然。τέκνον译作“孩子”，保留亲昵的属灵亲子比喻，不收窄为“儿子”。
- source_word: ὃν ἐγέννησα
  choice: 我……所生的
  rationale: γεννάω本义涉及生育、生出；这里以生育比喻保罗与阿尼西谋的属灵关系。“所生的”保留原文鲜明而略显出人意料的比喻，不直接改写为“带领信主”。
- source_word: ἐν τοῖς δεσμοῖς
  choice: 在捆锁中
  rationale: δεσμοί直指锁链、捆锁，也可转指囚禁处境。“在捆锁中”保留具体意象，并让读者可同时领会“被囚时”的含义；原文没有明说“我的”，故中文也不增补。
- source_word: Ὀνήσιμον
  choice: 阿尼西谋
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 保罗与阿尼西谋关系的性质
  choice: 保留“孩子”与“所生的”这一属灵亲子及生育比喻，不在正文中明说归信过程。
  alternative: 译作“我在囚禁中成为他属灵的父亲”或“我在监狱里带领他信主”。
  rationale: 上下文很可能暗示保罗促成阿尼西谋归信，但原文以τέκνον和γεννάω表达这一关系，并未采用明确的归信术语；直保比喻可避免把推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。句式尽量贴近原文的信息次序，同时以“就是”引出同位说明，使“我的孩子”与“阿尼西谋”的对应关系在中文中清楚。脚注标记分别紧随其所解释的短语。
