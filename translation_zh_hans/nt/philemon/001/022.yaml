  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: zh_hans
  text: 同时，也请为我预备住处[a]，因为我盼望借着你们的祷告，我将蒙恩，被赐给你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“客房”“住宿的地方”或“接待”；希腊语ξενία既可指款待客人，也可指为客人安排的住处。
    reason: lexical_alternative
  - marker: b
    text: “蒙恩，被赐给你们”也可意译为“蒙恩回到你们那里”或“获准回到你们那里”。原文使用被动语态，带有白白赐予或施恩准许的意味，很可能暗示神是施恩者，却没有明说。
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: 同时，也
  rationale: 表示保罗在前一请求之外又加上一项安排；“同时”保留ἅμα，“也”体现καί，δέ则由汉语行文自然承接。
- source_word: ἑτοίμαζέ μοι
  choice: 请为我预备
  rationale: ἑτοίμαζέ是现在时主动命令语气，表达实际而直接的嘱咐；加“请”符合现代汉语书信中庄重而亲切的语气，μοι译作受益者“为我”。
- source_word: ξενίαν
  choice: 住处
  rationale: ξενία既可指接待客人的行动，也可指为客人提供的住宿处；与“预备”和“为我”连用时，具体的住宿地点最为自然。“住处”不额外断定是独立的客房。
- source_word: ἐλπίζω γὰρ ὅτι
  choice: 因为我盼望
  rationale: γάρ说明提出这项请求的理由，ἐλπίζω ὅτι引出盼望的内容；“因为我盼望”准确而自然。
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: 借着你们的祷告
  rationale: διά加属格在此表示途径或媒介；“借着”保留祷告作为实现此盼望之途径的含义。
- source_word: χαρισθήσομαι
  choice: 我将蒙恩，被赐给
  rationale: 这是χαρίζομαι的将来时被动形式。“蒙恩”保留恩惠、白白赐予的语义色彩，“被赐给”保留被动表达，同时不在正文中明说施事者。
- source_word: ὑμῖν
  choice: 你们
  rationale: 与被动的“赐给”搭配，表示保罗盼望自己被赐回给收信群体；复数形式按原文保留为“你们”。
theological_decisions:
- issue: χαρισθήσομαι所暗含的施事者及保罗获释归回的表达
  choice: 译为“我将蒙恩，被赐给你们”，保留被动和恩惠色彩，但不明说是谁赐下。
  alternative: 译为“我将获准回到你们那里”或“我将被释放，回到你们那里”。
  rationale: 原文很可能以神为未明说的施事者，但没有明确写出“神”，也没有在本节动词中直说“释放”或“归回”。正文因此保留被动和神学张力，脚注说明较自然的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我将蒙恩，被赐给你们”略带刻意保留的陌生感，以呈现原文被动式及恩惠语义；脚注提供更自然的汉语意译。
