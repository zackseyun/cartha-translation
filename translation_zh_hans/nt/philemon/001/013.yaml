  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: zh_hans
  text: 我本想把他留在我身边，好让他替你，在福音的锁链中[a]服侍我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在为福音所受的锁链中”，即因福音而受拘禁。
    reason: 说明τοῦ εὐαγγελίου可能具有原因含义，同时保留正文较贴近形式的表达。
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 阳性单数关系代词，回指阿尼西谋；中文用“他”自然承接上文，无须硬译关系代词形式。
- source_word: ἐβουλόμην
  choice: 我本想
  rationale: 未完成时表达保罗先前持续存在但未付诸实行的意愿；“本想”在现代汉语中自然传达这种语气。
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: 把他留在身边
  rationale: 表达将阿尼西谋留在自己这里、与自己同在；“留在身边”自然且保留关系性的含义。
- source_word: ἵνα
  choice: 好让
  rationale: 明确表达目的，同时符合现代汉语的自然句法。
- source_word: ὑπὲρ σοῦ
  choice: 替你
  rationale: 表示阿尼西谋代表腓利门、代腓利门服侍保罗；“替你”简洁自然，又未过度强化严格的替代观念。
- source_word: μοι διακονῇ
  choice: 服侍我
  rationale: διακονέω在此指向保罗提供照料和帮助；“服侍”既保留服务含义，也不限定为教会职分。
- source_word: ἐν τοῖς δεσμοῖς
  choice: 在……捆锁中
  rationale: 保留δεσμοί具体的受捆绑、被囚禁意象；“捆锁”比抽象的“监禁”更贴近原文。
- source_word: τοῦ εὐαγγελίου
  choice: 福音的
  rationale: 保留希腊文紧凑的属格结构，不在正文中直接判定为原因属格；其因福音而受捆锁的可能含义在脚注说明。
theological_decisions:
- issue: τοῦ εὐαγγελίου修饰δεσμοῖς的含义
  choice: 福音的捆锁
  alternative: 为福音所受的捆锁
  rationale: 正文保留原文属格表达的紧凑性及其关联上的张力，不直接把它完全解释为原因；脚注给出很可能的因果理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我本想”“留在身边”“替你”使句子自然流畅；“福音的捆锁”有意保留保罗原文紧凑而略带张力的表达，并以脚注辅助普通读者理解。
