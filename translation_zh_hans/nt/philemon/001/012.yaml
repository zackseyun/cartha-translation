base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: zh_hans
  text: 我把他送回到你那里——他，也就是我的心肠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心肠”原文直译为“内脏”；在当时的表达中指内心深处的感情、深切的怜爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 阳性单数宾格关系代词，回指阿尼西谋；汉语用“他”自然承接上文。
- source_word: ἀνέπεμψά
  choice: 我把……送回
  rationale: ἀναπέμπω为不定过去时直陈语气，意为“送回、遣回”。中文采用完成体“把……送回”，不强行判定写信时他已经抵达。
- source_word: σοι
  choice: 你那里
  rationale: 第二人称单数与格表示送回的对象；“送回你那里”符合现代汉语习惯，也保留方向关系。
- source_word: αὐτόν
  choice: 送回他
  rationale: 原文在关系代词之后再次使用宾格代词以加强语势；中文重复“送回他”，尽量保留这一强调。
- source_word: τοῦτ’ ἔστιν
  choice: 也就是
  rationale: 这是解释性的固定表达，引出同位说明；“也就是”自然、清楚而不过度阐释。
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: 我自己的心
  rationale: σπλάγχνα字面指内脏，在此惯用来表达深厚感情及怜爱之所在。“我自己的心”既传达保罗对阿尼西谋的深切珍爱，也保留ἐμά的强调意味。
theological_decisions:
- issue: σπλάγχνα所用的人体隐喻
  choice: 译作“我自己的心”
  alternative: 我的心肠；我内心最深的感情
  rationale: 这里是语言习惯和隐喻转换问题，而非特定教义判断。直译“内脏”会使现代读者误解；“心”能自然表达深情，同时“自己的”保留原文的强调。
- issue: ἀνέπεμψα的不定过去时及书信视角
  choice: 译作“我把他送回”
  alternative: 我现在把他送回；我已经把他送回
  rationale: 希腊语不定过去时本身不细分中文所表达的“现在正送”或“已经送到”。正文采用简洁完成体，并在脚注中说明其他可行表达，以免消除书信语境中的时态张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“送回你那里——送回他”有意保留原文代词复现所形成的强调；破折号引出解释性的同位语。
