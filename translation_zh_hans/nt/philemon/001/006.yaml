language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: zh_hans
  text: 使你信仰上的相交[a][b]，借着充分认识我们里面为基督而有的一切美善[c][d][e]，得以发挥功效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你信仰上的相交”也可译作“你对信仰的分享”或“你在信仰上的共同参与”。
    reason: lexical_alternative
  - marker: b
    text: “信仰”所译的希腊词在某些语境中也可指“信实”或“忠诚”。
    reason: alternative_reading
  - marker: c
    text: 有些抄本作“你里面”，而不是“我们里面”。
    reason: textual_variant
  - marker: d
    text: “基督”意为“受膏者”，即“弥赛亚”。
    reason: lexical_alternative
  - marker: e
    text: 句末“为基督”也可理解为修饰整句，意为这相交的功效是归向或为了基督。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: 愿……
  rationale: 本节承接保罗祷告的内容；用“愿”自然表达目的从句在祷告语境中的祈愿意味，同时不把它改写为断言。
- source_word: κοινωνία τῆς πίστεώς σου
  choice: 你在信仰里的相交
  rationale: κοινωνία可指相交、分享、参与或伙伴关系。此处采用较宽的“相交”，保留共同参与和实际分享两方面的可能性；以“在信仰里的”表达属格关系而不强行限定为传讲信仰。
- source_word: πίστεώς
  choice: 信仰
  rationale: 此处主要指腓利门所持守的基督信仰；“信仰”比单用“信”更适合与“相交”搭配。原词也可能含“信实、忠诚”之意，另见脚注。
- source_word: ἐνεργὴς γένηται
  choice: 变得有功效
  rationale: 兼顾γένηται的“成为、变得”和ἐνεργής的“有效、发挥作用”，并保留祈愿语气。
- source_word: ἐν ἐπιγνώσει
  choice: 借着认识
  rationale: ἐν在此可作方式或领域理解；“借着”传达这种认识使相交产生功效的可能关系。ἐπίγνωσις指确切、充分的认识，但正文不将强化意味说得过满。
- source_word: παντὸς ἀγαθοῦ
  choice: 一切美善
  rationale: 中性单数表达各样美善之事；“一切美善”自然庄重，又不擅自增添“恩赐”等具体概念。
- source_word: τοῦ ἐν ἡμῖν
  choice: 我们里面……而有的
  rationale: 按SBLGNT正文保留“我们”，并将定语与“一切美善”相连；既可指信徒内在的美善，也未完全排除群体之中的含义。
- source_word: εἰς Χριστόν
  choice: 为基督
  rationale: εἰς表达朝向、归于或关乎基督的取向。“为基督”是自然中文，但原句末尾修饰关系和语义范围有一定含混，脚注保留其他理解。
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σου的含义
  choice: 译作“你在信仰里的相交”，保留共同参与及实际分享的双重空间
  alternative: “你对信仰的分享”或“你的信仰所带来的伙伴关系”
  rationale: 此短语解释困难。直译式的宽泛表达避免把它仅限于传福音、捐助或内在团契，也符合本信后文关于接纳和实际行动的语境。
- issue: “我们里面”的指向
  choice: 按正文译作复数“我们”，可包括保罗、腓利门及其他信徒
  alternative: 部分抄本作“你里面”，专指腓利门
  rationale: 忠实采用SBLGNT的ἐν ἡμῖν，同时用脚注报告有意义的文本异文。
- issue: εἰς Χριστόν与前文的关系
  choice: 将其紧接“一切美善”，译为“我们里面为基督而有的一切美善”
  alternative: 理解为整个过程“归向基督”或“为着基督”
  rationale: 希腊文末尾短语可表达方向、目的或关联，句法范围并非毫无疑义；正文给出可读译法，脚注保留另一种连接方式。
- issue: Χριστός的称号表达
  choice: 基督
  alternative: 弥赛亚
  rationale: 现代中文圣经和普通中文基督教语境通常以“基督”表达Χριστός这一称号；脚注说明其意义为“弥赛亚”，避免将其误读为姓氏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“相交”虽带一定宗教语域，但能较宽地承载κοινωνία的共同参与、交往和分享含义。语序经过调整，使“借着认识”清楚连接“变得有功效”，同时以脚注保存句末εἰς Χριστόν的句法和语义张力。
