  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: zh_hans
  text: 保罗——弥赛亚[b]耶稣的囚徒[a]——和我们的弟兄提摩太，写信给我们所爱、与我们同工的腓利门：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为弥赛亚耶稣被囚的人。”原文属格既可表示他与弥赛亚耶稣的关系，也可指他因弥赛亚耶稣而被囚。
    reason: alternative_reading
  - marker: b
    text: “弥赛亚”传统上常译作“基督”，意思是“受膏者”；这里作为耶稣的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: 囚徒
  rationale: 该词指身受捆绑或监禁的人；“囚徒”简洁保留了保罗受囚的处境，也与其后的属格短语保持紧密联系。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在这里仍具有称号含义，指上帝所膏立的那一位，因此译作“弥赛亚”，而不把它处理成耶稣的姓氏或单纯音译。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代汉语中通行的人名译法。
- source_word: ὁ ἀδελφὸς
  choice: 我们的弟兄
  rationale: 希腊文直译为“那弟兄”；在共同信仰群体的语境中，现代汉语用“我们的弟兄”可自然表达原文隐含的群体关系。
- source_word: ἀγαπητῷ
  choice: 我们所爱的
  rationale: 既保留原词所表达的深厚爱意，也比单说“亲爱的”更清楚地与复数“我们”相连。
- source_word: συνεργῷ ἡμῶν
  choice: 与我们同工的
  rationale: 明确保留“共同工作”的关系以及复数所有格ἡμῶν，不将其泛化为“伙伴”。
- source_word: Φιλήμονι
  choice: 写信给……腓利门
  rationale: 以现代汉语书信开头的自然方式表达作为收信人的与格。
- source_word: καὶ Τιμόθεος
  choice: 和我们的弟兄提摩太
  rationale: 保留提摩太与保罗同列为发信人的句法关系。
theological_decisions:
- issue: Χριστός在称呼中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号意义仍然清楚；“弥赛亚”直接传达“受膏者”的身份，避免把Χριστός误读为姓氏，同时脚注注明传统译名。
- issue: Χριστοῦ Ἰησοῦ这一属格与“囚徒”的关系
  choice: 弥赛亚耶稣的囚徒
  alternative: 为弥赛亚耶稣被囚的人
  rationale: 原文属格可以表达归属或关系，也可按保罗因服事耶稣而被囚的原因来理解。正文保留紧凑而未展开的属格结构，脚注呈现原因义，避免替原文消除张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以破折号容纳保罗的身份说明，使两位发信人与收信人之间的关系清楚；用“写信给”补足汉语书信句式所需成分。句末冒号表明问候语尚将在后续经文继续。
source_grounding:
  english_pob_role: consult_only
