  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: zh_hans
  text: 我保罗亲笔写下：[a]我必偿还；且不说你连自己也还欠着我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我保罗亲手写了：我必偿还；且不对你说，你连自己也还欠着我。”原文“写了”为不定过去时；末句按字面保留“且不说”的修辞表达。
    reason: 说明“写了”的形式对应译法，并保留末句的修辞性、非具体化个人亏欠。
lexical_decisions:
- source_word: ἔγραψα
  choice: 写下
  rationale: 希腊语是不定过去时，直译可作“写了”；但在书信中，这是作者让收信人注意眼前亲笔保证的惯用表达。“写下”在现代汉语中自然，也不必强行突出过去时。
- source_word: τῇ ἐμῇ χειρί
  choice: 亲笔
  rationale: 简洁、自然地表达保罗用自己的手书写，并保留亲自作出保证的强调。
- source_word: ἀποτίσω
  choice: 我必偿还
  rationale: 表达将来亲自清偿前一节所说亏欠或损失的承诺；“必”也传达保证语气，但不擅自限定具体债项。
- source_word: ἵνα μὴ λέγω σοι
  choice: 我就不提了
  rationale: 此处在语用上是委婉而带反讽的插语，并非单纯目的句。“不提了”既自然，又保留实际已经提及的修辞张力。
- source_word: καὶ σεαυτόν
  choice: 连自己也
  rationale: 用“连……也……”体现καί对反身代词的强调，指出所欠的不只是财物，甚至包括本人。
- source_word: προσοφείλεις
  choice: 欠我
  rationale: 该动词含有另外尚欠、加欠之意；上下文中的“连……也……”已自然带出附加和递进意味。
theological_decisions:
- issue: 腓利门“连自己也欠”保罗的债究竟指什么
  choice: 保留强烈但未具体说明的个人性亏欠
  alternative: 明确解释为腓利门因保罗而归信、得救，或欠保罗一条性命
  rationale: 原文没有明说这种亏欠的具体由来。译文保留隐喻和张力，避免加入经文本身未陈述的历史或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲笔写下”突出亲自担保；破折号式的英语结构改以分句和“至于……我就不提了”呈现，使保罗委婉而有力度的修辞在汉语中自然可辨。
