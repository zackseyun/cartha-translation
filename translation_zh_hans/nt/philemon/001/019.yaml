  rationale: 修订仅改善汉语语序，并以“还欠着”体现原文προσοφείλεις的附加／未清偿意味。“且不说”保留保罗克制而反讽的措辞，既不将其误解为严格目的句，也不把腓利门的个人亏欠解释为特定的归信、救恩或生命之债。
