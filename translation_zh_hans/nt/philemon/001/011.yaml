lexical_decisions:
- source_word: τόν
  choice: 他
  rationale: 该宾格冠词承接上一节的阿尼西谋；中文用“他”自然延续原句。
- source_word: ποτέ
  choice: 从前
  rationale: 简明表达过去的时间，并与“如今”形成清楚对比。
- source_word: σοι
  choice: 对你
  rationale: 贴合形容词ἄχρηστον所支配与之相关的与格关系，在现代汉语中自然。
- source_word: ἄχρηστον
  choice: 没有用处
  rationale: 准确表达“不派用场、无益”的基本含义，并与后文“有用处”构成鲜明、对称的双关。
- source_word: νυνὶ δὲ
  choice: 如今
  rationale: “如今”保留时间转折；前后语义对照已自然体现δέ的转折力，无须生硬增添“但是”。
- source_word: σοὶ καὶ ἐμοὶ
  choice: 对你对我都
  rationale: “都”清楚表达两者并列，兼顾原文的平衡和现代汉语习惯。
- source_word: εὔχρηστον
  choice: 有用处
  rationale: 与“没有用处”形成直接反义对应，也尽可能保留对阿尼西谋名字含义的文字游戏。
theological_decisions:
- issue: 阿尼西谋名字的双关与生命改变
  choice: 正文保留“没有用处／有用处”的朴素对照
  alternative: 解释性译为“从前无益，如今真正有益”以突出双关
  rationale: 原文本身通过ἄχρηστον与εὔχρηστον形成对照，直译式的自然表达足以保留文学效果；名字双关的背景交由脚注说明，避免正文过度诠释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“没有用处／有用处”比“无益／有益”更口语自然，同时保持原文紧密的反义对照。
