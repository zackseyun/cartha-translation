  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: zh_hans
  text: 是的，弟兄，让我在主里从你获益吧[a]；求你在弥赛亚里使我的心舒畅[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从你获益”也可译作“从你得益”或“因你喜乐”。保罗可能借此与“阿尼西谋”这个名字以及“有用”的意思形成双关。
    reason: lexical_alternative
  - marker: b
    text: “我的心”原文直译为“我的内脏”，是指内心深处的情感或内在感受的习语。
    reason: lexical_alternative
  - marker: c
    text: “弥赛亚”也常译作“基督”；原文Χριστός意为“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: 是的
  rationale: 承接上文并加强保罗恳求的语气；现代汉语中自然、直接。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 单数呼格，直接称呼腓利门这位男性同信者；保留亲切而郑重的关系语气。
- source_word: ἐγώ σου ὀναίμην
  choice: 让我从你得益处吧
  rationale: ὀναίμην是ὀνίνημι的愿望式，表达恳求得到益处；这一措辞也可能与阿尼西谋之名及本书前文的“有用”形成文字呼应。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用的属灵关系或行动范围表达；“主”自然承载κύριος在此处的尊称意义。
- source_word: ἀνάπαυσόν
  choice: 使……舒畅
  rationale: 命令式要求对方带来实际的安慰、释放或振奋，并与本章7节的相关用语相呼应。
- source_word: μου τὰ σπλάγχνα
  choice: 我的心
  rationale: 字面为“我的内脏”，在此是指深层感情或内在生命的习语；“我的心”是现代汉语中自然且庄重的对应。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός在此保有称号意义；“弥赛亚”呈现“受膏者”的称号内涵，并保留行动发生于与弥赛亚联合的关系范围中。
theological_decisions:
- issue: Χριστῷ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 原词是称号“受膏者”；本句以“在……里”的结构强调共同身份和关系范围，译作“弥赛亚”较能显明其称号意义，同时用脚注保留传统译法。
- issue: κυρίῳ的译法
  choice: 主
  alternative: 主人
  rationale: 此处是保罗书信中对耶稣的尊称及关系范围表达；译作“主”既自然，也避免将上下文不必要地收窄为社会性的主奴关系。
- issue: 两处ἐν短语的关系
  choice: 分别保留为“在主里”与“在弥赛亚里”
  alternative: 合并或释义为“为了主／靠着基督”
  rationale: 原文分别修饰请求得益处和使内心舒畅；直译保留其可能兼具关系范围、动机及能力来源的张力，不武断限定单一含义。
translation_notes:
  register: 采用现代、庄重而亲切的书信语体。“吧”传达愿望式恳求，避免译成冷硬陈述；分号保留两项请求之间紧密而清楚的关系。脚注标记均置于对应主文之后。
