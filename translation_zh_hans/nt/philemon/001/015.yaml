  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: zh_hans
  text: 或许他暂时与你分离，正是为了让你永远得回他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“或许他暂时离开了你。”希腊原文用被动式“分离”，可能是委婉地不直接归咎于谁，也可能为上帝隐含的旨意留下余地。
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: 或许
  rationale: 表达保罗试探性的推断和委婉语气，不把他的解释说成确定事实。
- source_word: γὰρ
  choice: （由上下文中的解释语气体现）
  rationale: 本节承接并解释前文；中文若直译为“因为”容易使独立呈现的经文显得突兀，因此以整句的解释语气自然体现。
- source_word: διὰ τοῦτο
  choice: 正是为了
  rationale: 结合后面的ἵνα目的从句，表达“因这缘故／为此”的指向，同时不把背后的行动者明确说成上帝。
- source_word: ἐχωρίσθη
  choice: 与你分离
  rationale: 保留希腊文被动式的含蓄，不明说是阿尼西谋主动离去，也不明说是上帝使他离开。
- source_word: πρὸς ὥραν
  choice: 暂时
  rationale: 这是表示有限时段的惯用语，与后面的“永远”形成鲜明对照，并非字面上的“一小时”。
- source_word: ἵνα
  choice: 为了让
  rationale: 自然表达目的或预期结果，同时容许经文中的目的论意味。
- source_word: αἰώνιον
  choice: 永远
  rationale: 该形容词在这里作补足性的副词用法，与“暂时”相对，表达持久地得回他。
- source_word: αὐτὸν
  choice: 他
  rationale: 指前文的阿尼西谋。
- source_word: ἀπέχῃς
  choice: 得回他
  rationale: 既表达重新拥有或接纳，也符合两人关系恢复的语境；“得回”比单纯“有”更清楚体现重归。
theological_decisions:
- issue: ἐχωρίσθη被动式所暗示的行动者
  choice: 译作“与你分离”，不明确指出行动者
  alternative: “他离开了你”或“上帝使他与你分离”
  rationale: 原文可能委婉淡化阿尼西谋的责任，也可能暗示上帝的护理，但并未明确断定；译文保留这种神学张力。
- issue: διὰ τοῦτο与ἵνα所表达的目的和护理意味
  choice: 译作“正是为了让”，保留目的性的解释，却不点名上帝
  alternative: “所以”或“上帝这样做，是为了”
  rationale: 原文把暂时分离与永久得回联系起来，但保罗以“或许”提出这一解释；译文既保留目的意味，也不将推测提升为明说的神圣行动。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“暂时”与“永远”形成简洁对照；“与你分离”略带书面色彩，以保留原文被动式的含蓄。“得回他”兼顾关系恢复与重新接纳的语境。
