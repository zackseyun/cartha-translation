  text: εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ⸀ἐλλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: zh_hans
  text: 不过，他若亏负了你，或欠你什么，都记在我的账上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都算在我名下。”原文动词是记账用语，指把某项款项或责任归到某人的账上。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: 不过，他若
  rationale: εἰ引出条件，δέ承接上文并带轻微转折；“不过……若”在现代汉语中自然保留这种关系。
- source_word: τι ἠδίκησέν σε
  choice: 亏负了你
  rationale: ἀδικέω表示对人行不义或造成损害；“亏负”既可涵盖人际过错，也可涵盖物质损失，不把含义局限为欺骗或偷窃。τι在汉语中可由这一宽泛表达及后文“什么”自然体现，无须机械重复。
- source_word: ἢ ὀφείλει
  choice: 或欠你什么
  rationale: ὀφείλω在此指欠债或负有义务；“欠你什么”简明自然，也保留可能涉及实际债务的语义。
- source_word: τοῦτο
  choice: 都
  rationale: τοῦτο回指前述亏负或所欠之事。汉语用“都”把两个条件统摄到同一命令之下，比直译“这件事”更顺畅，同时不改变所指范围。
- source_word: ἐμοὶ ἐλλόγα
  choice: 记在我的账上
  rationale: ἐλλογέω带有记账、归账的商业语义，ἐμοί指定由保罗承担；“记在我的账上”准确而自然地保留这一比喻。
theological_decisions:
- issue: 是否将保罗承担的内容限定为金钱债务
  choice: 保留“亏负”与“欠”并列，并用“都记在我的账上”统摄二者
  alternative: 译成“无论欠你多少钱，都由我偿还”
  rationale: 原文既提到一般性的亏负，也提到所欠之物，不能确定只指金钱；译文不将范围缩窄。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“亏负”比“伤害”更能兼顾道德与物质层面的损害；“记在我的账上”保留原文鲜明的记账语感。
