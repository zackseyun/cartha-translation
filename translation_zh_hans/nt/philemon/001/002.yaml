  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: zh_hans
  text: 并致亚腓亚姊妹[a]、我们的战友亚基布，以及在你家里的教会：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我们的姊妹”；本译文所据正文作“姊妹”（原文带定冠词）。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: 亚腓亚
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: ἀδελφῇ
  choice: 姊妹
  rationale: 原词直指女性的“姊妹”，在这里表达信徒之间的属灵亲属关系；中文以“亚腓亚姊妹”自然表达希腊文的同位称呼，不擅自加入物主语“我们的”。
- source_word: Ἀρχίππῳ
  choice: 亚基布
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: συστρατιώτῃ
  choice: 与我们一同作战的
  rationale: 保留原词的军事比喻及共同参与之意；与“亚基布”连用时，比生硬的名词“同袍”更清楚自然。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: 本书信语境中指聚集的基督徒群体，“教会”是现代中文最自然且通行的对应词。
- source_word: κατ’ οἶκόν σου
  choice: 在你家里的
  rationale: 贴近原文“在你家中”的地点表达，不把原文未明说的“聚会”补入正文。
- source_word: καὶ
  choice: 并……、……以及
  rationale: 用现代中文列举结构表达原文连续三个καί所形成的并列关系，避免机械重复“和”而保持庄重流畅。
theological_decisions:
- issue: ἀδελφῇ是否加入物主语“我们的”
  choice: 姊妹
  alternative: 我们的姊妹
  rationale: 所给SBLGNT正文为τῇ ἀδελφῇ，没有ἡμῶν，因此正文不依据其他抄本或传统译法补入“我们的”；抄本差异以脚注保留。
- issue: συστρατιώτῃ的军事意象是否保留
  choice: 与我们一同作战的
  alternative: 与我们一同服事的
  rationale: 原词明确使用共同作战的比喻；译成泛化的“服事”会消除保罗用语中的军事意象。
- issue: κατ’ οἶκόν σου是否明确译成“在你家聚会的”
  choice: 在你家里的教会
  alternative: 在你家聚会的教会
  rationale: 原文说明教会与腓利门住所的关联，却没有显式使用“聚会”一词；正文保留这种简洁程度，不把合理推断写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的书信问候语体。本节承接上一节，因此以“并致”起句。人名使用通行音译；“姊妹”保留早期基督徒亲属称谓，“与我们一同作战的”保留军事比喻。
