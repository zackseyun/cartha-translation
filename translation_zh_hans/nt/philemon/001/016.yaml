  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a slave[a], but more than a slave, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: zh_hans
  text: 不再把他当作奴隶[a]，而要把他当作远胜奴隶的一位亲爱的弟兄；他对我尤其如此，对你更是如此：无论在肉身方面[b]，还是在主里，都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”“奴仆”。希腊词可指不同程度的役属身份；在这里，很可能是指阿尼西谋受奴役的社会处境。
    reason: alternative_reading
  - marker: b
    text: “在肉身方面”在这里很可能指人世间、社会上的关系，或亲身相处，并不是指“罪性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: 不再把他当作奴隶
  rationale: οὐκέτι表示先前情形已经改变；ὡς在此表达看待或接纳他的身份方式。结合阿尼西谋的社会处境，“奴隶”最直接保留δοῦλος所指的受奴役身份。
- source_word: ἀλλὰ ὑπὲρ δοῦλον
  choice: 而是胜过奴隶
  rationale: ὑπέρ在这里表示超越某种身份或价值层次，并非替代意义；“胜过奴隶”保留简洁而有力的比较。
- source_word: ἀδελφὸν ἀγαπητόν
  choice: 是一位亲爱的弟兄
  rationale: 直译并保留基督徒群体中的亲属隐喻；“亲爱的”自然表达ἀγαπητόν。
- source_word: μάλιστα ἐμοί
  choice: 他对我尤其如此
  rationale: μάλιστα表示程度上的格外、尤其；补出“他……如此”，使中文衔接自然，而不增添新的实质内容。
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: 对你岂不更是如此
  rationale: 用反问式“岂不更”传达πόσῳ μᾶλλον的递进与修辞力度，同时保留保罗从自己转向腓利门的强调。
- source_word: καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: 无论按肉身，还是在主里，都是这样
  rationale: “按肉身”保留σάρξ的保罗式措辞及其解释空间；“在主里”直接保留ἐν κυρίῳ所表达的关系或领域。中文以“无论……还是……”自然呈现两个层面。
theological_decisions:
- issue: 在阿尼西谋语境中如何翻译δοῦλος
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: 本信涉及阿尼西谋现实的受奴役社会身份，“奴隶”最清楚地保留这种历史与社会现实，也使“胜过奴隶”的对比保持力度；脚注同时说明该词可能具有较宽的役属含义。
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ的含义
  choice: 无论按肉身，还是在主里
  alternative: 无论在人世关系上，还是在主里；无论当面相处，还是在主里
  rationale: 这组短语很可能并列腓利门与阿尼西谋在人间、具身或社会层面的关系，以及他们在主里的属灵关系。正文保留“肉身”的开放性，不把它误解为“罪性”，也不把其意义限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把他当作”明确ὡς的关系性用法；后两句适度拆分希腊长句，以提高中文可读性，同时保留“奴隶／弟兄”“按肉身／在主里”两组重要张力。所有脚注标记均已置于正文相应位置。
