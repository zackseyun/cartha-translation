  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: zh_hans
  text: 我深信你会顺服，所以写信给你，知道你甚至会做得超过我所说的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “超过我所说的”也可译作“超出我所说的”。保罗可能暗示腓利门会超出他在信中的具体请求，但原文没有说明究竟会怎样做。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: 我深信
  rationale: 完成时主动分词表示一种已经形成并持续的确信状态；“我深信”在现代汉语中自然，也保留保罗笃定的语气。
- source_word: τῇ ὑπακοῇ σου
  choice: 你会顺服
  rationale: ὑπακοή具有“顺服、听从”的明确含义。汉语改用主谓结构，使表达自然，同时保留书信中使徒权柄与受信人回应之间的张力。
- source_word: ἔγραψά σοι
  choice: 所以写信给你
  rationale: 不定过去时在书信语境中可指当前这封信的写作行动；“写信给你”符合现代汉语书信表达，且“所以”呈现前置分词所表达的依据关系。
- source_word: εἰδὼς
  choice: 我知道
  rationale: 完成时分词表达伴随写信行动的确定认知；以独立分句“我知道”呈现，可保持原文的笃定口吻并使中文流畅。
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: 甚至会超过我所说的
  rationale: ὑπέρ加宾格表示“超过、超出”，καί在此加强语气。“甚至会超过我所说的”保留其开放性，不具体说明保罗期待的额外行动。
- source_word: ποιήσεις
  choice: 你所做的
  rationale: ποιέω含义宽泛；配合“超过”重组为“你所做的……超过”，既自然，又不把行动具体化。
theological_decisions:
- issue: ὑπακοή所体现的关系与权柄
  choice: 译为“顺服”
  alternative: 听从；照办；回应
  rationale: 原词明确具有顺服之意。“顺服”保留保罗诉诸权柄的力度，但上下文仍是劝请，因此不额外强化为强制命令。
- issue: “超过我所说的”暗示何种行动
  choice: 正文保持开放，不说明具体行动
  alternative: 明确解释为释放阿尼西慕；或仅指更慷慨地接纳他
  rationale: 原文具有暗示性，却没有说明保罗期待腓利门具体多做什么；译文不替原文消除这一有意保留的张力。
- issue: πεποιθὼς与εἰδὼς的修辞力度
  choice: 分别译作“我深信”和“我知道”
  alternative: 弱化为“我希望”和“我想”
  rationale: 两个分词都表达坚定把握而非不确定愿望；保留这种确信，也不把它解释成关于腓利门行动的神学保证。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我深信……所以……”使希腊文前置分词结构在中文中清楚自然；分号保留“写信”与“知道”之间紧密而有层次的关系。脚注标记置于相关句末。
