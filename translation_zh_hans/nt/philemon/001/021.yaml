  naturalness: 整体书信语体庄重自然；改为“你甚至会做得超过我所说的”后，谓语与比较结构更符合现代汉语，也更贴近希腊文的将来动词ποιήσεις。
  terminology: “顺服”恰当地保留ὑπακοή的力度，且没有把“超过我所说的”具体化为释放或其他行动。腓利门这一人名在脚注中正确。
