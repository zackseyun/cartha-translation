source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: zh_hans
  text: 弟兄啊，我因你的爱大有喜乐，也深受鼓舞，因为众圣徒的心[a]都借着你得了舒畅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”原文直译为“内脏”，在当时的表达中指人的内心深处或深厚情感。
    reason: 说明 σπλάγχνα 的身体意象及其惯用含义，避免现代读者误解，同时保留原文的语义厚度。
lexical_decisions:
- source_word: χαρὰν
  choice: 喜乐
  rationale: 采用保罗书信中自然、庄重的常用表达，传达 χαρά 的欢乐之意。
- source_word: πολλὴν ἔσχον
  choice: 大有
  rationale: 这里的 ἔχω 表示经历或具有；“大有”自然表达 πολλήν 所强调的程度，又避免生硬直译为“有许多”。
- source_word: παράκλησιν
  choice: 深受鼓舞
  rationale: παράκλησις 在此指因腓利门的爱而得到的鼓励和振奋；“深受鼓舞”与前面的“大有喜乐”搭配自然。
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: 因你的爱
  rationale: ἐπί 加与格在此表示缘由或根据；译为“因”清楚呈现保罗喜乐和受鼓舞的原因。
- source_word: ἀγάπῃ
  choice: 爱
  rationale: “爱”是 ἀγάπη 在现代汉语中的直接、通行对应词，语境无需另作限定。
- source_word: σπλάγχνα
  choice: 心
  rationale: 该词字面指内脏，在此是指人的内心深处、深厚情感和整个内在生命；“心”是现代汉语中自然的功能对等表达，并以脚注保留原文意象。
- source_word: τῶν ἁγίων
  choice: 众圣徒
  rationale: 保留保罗称信徒为归属上帝、分别为圣之人的群体用语；“众”也自然表达复数和整体范围。
- source_word: ἀναπέπαυται
  choice: 得了舒畅
  rationale: 完成时表达已经发生且效果仍然存在的安歇与振奋；“得了舒畅”兼顾释然、恢复精神的关系性语境。
- source_word: διὰ σοῦ
  choice: 借着你
  rationale: διά 加属格表示媒介或施事；“借着你”保留腓利门作为这一果效之途径的含义。
- source_word: ἀδελφέ
  choice: 弟兄啊
  rationale: 保留基督徒群体中的亲属式称呼和阳性单数所指；句首加“啊”自然表达呼格语气而不额外加入“亲爱”等修饰。
theological_decisions:
- issue: τῶν ἁγίων 的群体称谓
  choice: 众圣徒
  alternative: 上帝的子民；众圣洁的人
  rationale: “圣徒”保留保罗关于信徒蒙上帝分别为圣的群体语言；这里不是指后世经特定程序册封的人，也不宜在正文中把该称谓解释性改写。
- issue: σπλάγχνα 的人论意象
  choice: 心
  alternative: 内心深处；肺腑
  rationale: 原词以身体内部器官指代深层情感和内在生命。“心”在现代汉语中最自然，也不把含义缩窄为单一情绪；脚注说明其更贴近字面的语感。
- issue: ἀναπέπαυται 的完成时及被动意义
  choice: 得了舒畅
  alternative: 得到了安歇；获得了振奋
  rationale: 该译法既表明圣徒因腓利门而蒙受这一果效，也让已发生之行动所带来的持续状态保持可见，不将其限定为身体休息。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。以“弟兄啊”呈现直接呼语，以“大有喜乐，也深受鼓舞”保留两个并列名词的情感力度；“众圣徒的心都借着你得了舒畅”保持原句因果推进和牧养语气。脚注标记置于其实际说明的“心”之后。
