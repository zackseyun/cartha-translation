  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: zh_hans
  text: 愿恩典、平安从我们的父神和主耶稣弥赛亚临到你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣基督。”希腊语Χριστός既可作为称号，意为“弥赛亚”，在某些语境中也可更像名称的一部分，译作“基督”。
    reason: 保留Χριστός在称号性与名称化用法之间的语义可能。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 既保留书信问安的功能，也承载保罗用语中的神学分量，避免弱化为一般的“恩惠”。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 与补出的祈愿式“愿”相配，按现代汉语自然表达希腊语问安句中的与格。
- source_word: εἰρήνη
  choice: 平安
  rationale: 保留问安意义及其与希伯来语“shalom”相呼应的完整福祉意涵。
- source_word: ἀπὸ
  choice: 从
  rationale: 明确表示恩典和平安的来源。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父神
  rationale: 将属格词组理解为同位关系，即神是“我们的父”；此译法简洁自然，并避免译成暗示不同句法结构的“我们的神和父”。
- source_word: κυρίου
  choice: 主
  rationale: 保留该尊称在保罗书信中的尊荣和基督论分量。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: “耶稣”按名字音译；Χριστός在此标准称号组合中仍可表达“受膏者／弥赛亚”的头衔意义。脚注同时保留其较名称化的传统译法“基督”。
theological_decisions:
- issue: Χριστοῦ在Ἰησοῦ Χριστοῦ中的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός既可作为“弥赛亚”的称号，也可在固定组合中趋于名称化。正文显明其称号含义，脚注保留传统且可能更名称化的译法，不消除原文在两种用法之间的张力。
- issue: θεοῦ πατρὸς ἡμῶν与κυρίου Ἰησοῦ Χριστοῦ所表达的来源关系
  choice: 恩典、平安同样“从”父神和主耶稣弥赛亚而来
  alternative: 重复介词，译作“从我们的父神，也从主耶稣弥赛亚而来”
  rationale: 希腊文一个ἀπό统摄两个以καί连接的来源；中文共用“从”忠实保留这一并列结构，不额外界定二者之间的神学关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。原文是省略动词的书信问安语，中文补出“愿……临到你们”，以清楚表达祈愿功能；用顿号连接“恩典、平安”，避免重复连词造成生硬感。
