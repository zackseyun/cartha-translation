  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: zh_hans
  text: 但因着爱，我宁可恳求；我保罗，已经年老，如今又是弥赛亚耶稣的囚犯——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: 为了爱
  rationale: διά加宾格在此可表达动机或缘由；“为了爱”自然地保留“因着爱／为爱的缘故”的含义，并衔接第8节与第9节的对比。
- source_word: μᾶλλον παρακαλῶ
  choice: 宁可请求你
  rationale: μᾶλλον承接第8节“吩咐”的可能，表示保罗反而选择请求；παρακαλῶ在此是基于关系的恳切请求，不是命令。补出宾语“你”符合汉语表达，所指由上下文明确。
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: 我既是这样的一个人——我保罗
  rationale: 原文表达略显省略而庄重；译文保留“这样的一个人”的自我指称，并以破折号引出保罗接下来的身份描述，没有把其逻辑关系解释得过满。
- source_word: πρεσβύτης
  choice: 年老的人
  rationale: 该词通常指年长者；这里译作年龄意义，避免误作教会职分“长老”，也不采用来自相近异词的“使者／大使”。
- source_word: νυνὶ δὲ καὶ δέσμιος
  choice: 如今又是……的囚犯
  rationale: “如今”体现νυνί的时间强调，“又”体现καί所添加的另一重身份；“囚犯”直接对应δέσμιος。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣的
  rationale: Χριστός在这里仍具有称号意味，译作“弥赛亚”；属格保留为“……的囚犯”，不强行判定是因他被囚、属于他，还是为他服事而被囚。
theological_decisions:
- issue: πρεσβύτης的含义
  choice: 年老的人
  alternative: 使者；长老
  rationale: SBLGNT正文是πρεσβύτης，最自然的词义是年长男子。译作“使者”通常涉及与πρεσβευτής的关联，而“长老”会引入职分含义，二者均不如年龄义直接。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός与Ἰησοῦ连用，但仍可听出称号意义；“弥赛亚耶稣”保留这一点，同时不改变其传统所指。
- issue: “弥赛亚耶稣的囚犯”中属格的关系
  choice: 保留“……的囚犯”的开放表达
  alternative: 为弥赛亚耶稣被囚的人；属于弥赛亚耶稣的囚犯
  rationale: 原文属格可包含归属、关联或因服事而受囚等意味；直译式汉语能够保留这种神学张力，避免单一化解释。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。以“但……宁可……”承接上一节“本可吩咐”的对比；保留原句未完的破折号结构，因为第10节将继续说明请求的内容。所有脚注标记均置于正文相应位置。
