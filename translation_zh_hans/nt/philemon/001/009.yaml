  rationale: 修订删除原文本节未明说的“你”，以免提前限定受词；将破折号前的自我描述改为自然连贯的现代汉语，同时保留原文庄重而略带附加说明的语气。脚注a置于“恳求”后、脚注b置于“年老”后即可；脚注b改正“大使／使节”这一替代理解的术语。
