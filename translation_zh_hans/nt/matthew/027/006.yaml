id: MAT.27.6
reference: Matthew 27:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: zh_hans
  text: 祭司长们拿起那些银钱，说：“这钱不可放进圣殿的银库[a]，因为是血价[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作 κορβανᾶν（音译“各耳板”），指圣殿的银库或献给圣殿的款项。
    reason: lexical_alternative
  - marker: b
    text: 或译“血钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: 祭司长们
  rationale: 这是福音书中对资深祭司领袖的常用称呼；复数用“们”自然表达。
- source_word: λαβόντες
  choice: 拿起
  rationale: 以自然的叙事表达呈现不定过去时分词所表示的先行或伴随动作，不刻意强化动作先后。
- source_word: τὰ ἀργύρια
  choice: 那些银钱
  rationale: 承接上文所说的银子，保留其具体的钱财含义，同时不擅自指定原文未注明的币种。
- source_word: Οὐκ ἔξεστιν
  choice: 不可
  rationale: 简洁表达在律法及宗教规例上不被许可，并符合祭司长讨论圣殿款项时的语境。
- source_word: βαλεῖν
  choice: 放进
  rationale: βάλλω可指“投、放”；在将钱纳入银库的语境中，“放进”最自然，也不过度渲染动作。
- source_word: κορβανᾶν
  choice: 圣殿的银库
  rationale: 该词在此指圣殿的神圣库款或银库；正文译出实际所指以便现代读者理解，音译信息保留在脚注。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 清楚引出祭司长认为不可将钱放入银库的理由。
- source_word: τιμὴ αἵματός
  choice: 血价
  rationale: 贴近“血的价款”这一希腊语结构，简洁保留其凝练而带张力的表达；较具解释性的“血钱”列入脚注。
theological_decisions:
- issue: 如何翻译 κορβανᾶν，既说明实际所指，又保留其犹太宗教背景
  choice: 圣殿的银库
  alternative: 各耳板；圣库
  rationale: 上下文谈的是圣殿款项及其宗教规例上的洁净问题。正文直译其所指，比单纯音译更易懂；脚注则保留原词音译，避免文化信息完全消失。
- issue: 如何处理 τιμὴ αἵματός 的凝练含义
  choice: 血价
  alternative: 血钱；流人血的价款
  rationale: “血价”保留原文“血的价款”可能兼指以出卖性命换来的钱及导致死亡的报酬之张力，不在正文中把含义收窄；脚注提供更通俗的译法。
translation_notes:
  register: 采用庄重而现代的叙事语言。“不可”体现律法及宗教规例层面的禁止；“圣殿的银库”让普通读者直接理解所指，“血价”则保留原文简洁、强烈且未完全展开的表达。
