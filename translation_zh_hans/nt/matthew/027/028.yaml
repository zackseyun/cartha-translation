  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: zh_hans
  text: 他们脱去他的衣服后，就给他披上一件猩红色的披风[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“猩红色的外袍”。希腊语这个词也可较宽泛地指外衣或披风。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες αὐτόν
  choice: 脱去他的衣服
  rationale: ἐκδύω表示脱去衣物或剥去衣服；希腊文直译近于“把他脱光/脱去他的衣服”。此处用自然、庄重的现代汉语表达，并保留该动作先于披衣发生的关系。
- source_word: χλαμύδα
  choice: 斗篷
  rationale: χλαμύς指披在身上的外衣，常为较短的斗篷，也可用于军人或官员所穿的披风。“斗篷”直接表达衣物形制，同时不把语境中的戏谑性加冕过度解释进译文。
- source_word: κοκκίνην
  choice: 朱红色的
  rationale: κόκκινος表示鲜明的红色或朱红色；“朱红色”比笼统的“红色”更准确地保留颜色的鲜艳感。
- source_word: περιέθηκαν αὐτῷ
  choice: 给他披上
  rationale: περιτίθημι在此表示把衣物放在或围在某人身上。“给他披上”符合现代汉语习惯，也体现斗篷环披于身的动作。
- source_word: καὶ
  choice: 他们……，给他……
  rationale: καί连接连续动作。汉语以逗号和顺承结构自然体现“并且/然后”的叙事连接，无须机械译出“又”。
theological_decisions:
- issue: 戏弄场景中衣物的性质
  choice: 朱红色的斗篷
  alternative: 朱红色的外袍
  rationale: 本节描写士兵以披衣方式戏弄耶稣。“斗篷”保留χλαμύς较具体的衣物含义，但不额外加入“王袍”等原文未明说的王权解释；脚注同时保留较宽泛的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“脱去他的衣服”避免生硬直译“脱去他”；“给他披上”简洁呈现连续动作。脚注标记紧随其所解释的“斗篷”。
