  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: zh_hans
  text: 从第六时辰起，整个地区都陷入黑暗，直到第九时辰。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第六时辰约为正午，第九时辰约为下午三点。
    reason: cultural_note
  - marker: b
    text: “整个地区”或译“全地”或“全世界”；希腊语γῆ可指一片土地，也可指大地或世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: 从……起
  rationale: ἀπό表示起点；δέ在这里是轻微的承接词。中文无需另加“这时”或“但”，以免强化原文并不明显的时间提示或转折。
- source_word: ἕκτης ὥρας
  choice: 第六时辰
  rationale: 保留原文的计时方式，并在脚注说明其约合现代时间的正午。
- source_word: σκότος
  choice: 黑暗
  rationale: 采用直接、自然的对应词，保留原文对这一现象简洁而强烈的描写。
- source_word: ἐγένετο
  choice: 陷入
  rationale: 在“地区都陷入黑暗”这一结构中自然表达黑暗开始出现并笼罩该处的动态含义。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 整个地区都
  rationale: γῆ既可指一片土地或地区，也可指全地、世界。正文采用较贴合受难叙事现场且不过度限定事件全球范围的译法，另在脚注保留更广义的可能。
- source_word: ἕως ὥρας ἐνάτης
  choice: 直到第九时辰
  rationale: 保留原文的计时表达，并在脚注说明约合下午三点。
theological_decisions:
- issue: 黑暗所覆盖范围中γῆ的含义
  choice: 整个地区
  alternative: 全地／全世界
  rationale: γῆ本身具有“土地、地区”与“大地、世界”等可能含义。正文采用范围较克制的译法，避免将全球性范围强加给原文；脚注保留宇宙性理解的语言依据，不消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第六时辰”“第九时辰”保留古代计时特色，以脚注帮助现代读者理解；正文不额外加入强化转折或时间推进的连接词。
