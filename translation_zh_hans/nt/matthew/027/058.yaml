  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: zh_hans
  text: 这人来到彼拉多面前，请求领取耶稣的遗体。于是彼拉多下令把遗体交给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回上一节的亚利马太人约瑟；保留指示代词的力度，同时符合现代汉语叙事。
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: 来到彼拉多面前
  rationale: 表达先于主句发生的趋近动作；“来到……面前”自然且保留向彼拉多进见的意味。
- source_word: ᾐτήσατο
  choice: 请求领取
  rationale: 该动词表示提出请求；结合宾语和后文的交付动作，“请求领取”比单说“要”更清楚，也不过度增添法律程序色彩。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: 耶稣的遗体
  rationale: σῶμα本义为“身体”，但此处明确指死后的身体；现代汉语用“遗体”自然、庄重，且避免“尸体”的生硬感。
- source_word: τότε
  choice: 于是
  rationale: 既承接请求，也推进随后发生的事件，符合上下文中的结果性叙事连接。
- source_word: ἐκέλευσεν
  choice: 下令
  rationale: 准确表达彼拉多以权柄发出命令，在行政语境中简洁自然。
- source_word: ἀποδοθῆναι
  choice: 把遗体交给他
  rationale: 被动不定式表示遗体被交付；汉语改用兼语式主动表达更自然。“他”是上下文明确但希腊文未明说的领受者约瑟。
theological_decisions: []
