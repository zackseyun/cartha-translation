  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: zh_hans
  text: 当时，他们拘押着一个臭名昭著、名叫耶稣·巴拉巴[a]的囚犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本只作“巴拉巴”，省略“耶稣”。
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: 他们有
  rationale: 未完成时复数动词表示当时有人将这名囚犯掌握在押；中文以“他们有”保留原文未明确指明的复数主语和管押含义。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词；现代汉语承接上下文时无需机械加入“而”或“这时”，避免与τότε重复。
- source_word: τότε
  choice: 那时
  rationale: 直接保留明确的时间指示，简洁自然。
- source_word: δέσμιον
  choice: 囚犯
  rationale: 准确表达受拘押之人，符合审判和羁押语境。
- source_word: ἐπίσημον
  choice: 臭名昭著的
  rationale: 该词可指显著、知名；用于囚犯时很可能含负面意味。“臭名昭著”自然表达其恶名，但原词本身仍有较中性的“知名”可能。
- source_word: λεγόμενον
  choice: 名叫
  rationale: 该分词在此引出姓名；“名叫”比直译“被称为”更符合现代汉语。
- source_word: Ἰησοῦν Βαραββᾶν
  choice: 耶稣·巴拉巴
  rationale: 依SBLGNT所载正文保留Ἰησοῦν，并用间隔号清楚标示完整姓名；异文在脚注说明。
theological_decisions:
- issue: 巴拉巴完整姓名的文本形式
  choice: 正文译作“耶稣·巴拉巴”
  alternative: 仅作“巴拉巴”
  rationale: 所给SBLGNT正文含Ἰησοῦν，应按原文证据译入正文；不少抄本省略该名，故以脚注保留重要异文，不在正文中消解文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“臭名昭著”传达该司法语境中ἐπίσημον最可能的负面色彩；句法尽量保留原文未明说“他们”具体所指的特点。
