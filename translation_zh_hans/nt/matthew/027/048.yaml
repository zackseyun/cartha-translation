  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: zh_hans
  text: 他们中有一个人立刻跑去，拿了一块海绵，蘸满了酸酒[a]，把它放在一根芦苇上，给他喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酸酒”也可译作“醋”或“酒醋”。希腊语ὄξος可指酸酒或酒醋。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 自然准确地表达动作随即发生，符合现代汉语叙事。
- source_word: δραμὼν
  choice: 跑去
  rationale: 将希腊语不定过去时分词自然转为汉语连动结构，并保留行动的急迫感。
- source_word: εἷς ἐξ αὐτῶν
  choice: 其中有一个人
  rationale: 清楚保留部分结构，表明是前述人群中的一人。
- source_word: λαβὼν σπόγγον
  choice: 拿了一块海绵
  rationale: 用量词“块”构成自然的现代汉语表达，并体现动作次序。
- source_word: πλήσας τε ὄξους
  choice: 蘸满酸酒
  rationale: 海绵吸满液体在汉语中说“蘸满”较自然；ὄξος指酸败的酒或酒醋，“酸酒”既贴近原词，也避免让现代读者只联想到调味醋。
- source_word: περιθεὶς καλάμῳ
  choice: 绑在一根芦苇上
  rationale: περιτίθημι在此表示把海绵装到或安置在芦苇上；“绑在”使实际动作清楚，同时保留κάλαμος的直接对应“芦苇”。
- source_word: ἐπότιζεν αὐτόν
  choice: 送到他嘴边让他喝
  rationale: ποτίζω表示使人喝；这一表述在钉十字架的场景中自然，也为未完成时所可能呈现的持续或尝试性动作保留空间，而不武断断定耶稣实际喝下。
theological_decisions:
- issue: 给耶稣的饮料性质
  choice: 酸酒
  alternative: 醋
  rationale: ὄξος可指酸酒或酒醋。“酸酒”更能让现代读者理解这是可饮用的廉价酸性酒液，又不排除酒醋这一词义范围。
- issue: ἐπότιζεν是否表示耶稣实际喝下
  choice: 送到他嘴边让他喝
  alternative: 给他喝
  rationale: 原动词表示使人饮用，未完成时在语境中可含持续或尝试意味；译文不额外断定饮用是否完成，保留原文的叙事张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以连动句呈现原文一连串分词动作；不用古雅的“旋即”等词。
