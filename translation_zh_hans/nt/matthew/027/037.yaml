  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: zh_hans
  text: 他们把写着对他的控罪的牌子放在他头上方[a]：“这是耶稣，犹太人的王[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“控告他的罪名”。原文此词在这里具有司法含义，可指对他的控罪。
    reason: lexical_alternative
  - marker: b
    text: 或译：“犹太地人的王”。原文“犹太人”也可按地域理解为“犹太地人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: 安放了
  rationale: 表示把写有罪状的牌子实际放置在耶稣头上方；“安放”自然、庄重，也保留具体动作。
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: 在他头上方
  rationale: ἐπάνω加属格表示位于上方；此译避免让人误解为直接放在头上。
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: 写着他罪状的牌子
  rationale: αἰτία在此有司法语境中的“控罪、罪状”之意；结合γεγραμμένην，汉语需适度补出承载文字的“牌子”，使动作与句意自然清楚。
- source_word: γεγραμμένην
  choice: 写着
  rationale: 该完成时被动分词说明罪状已经写成并呈现在牌上；“写着”符合现代汉语铭牌表达。
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: 这是耶稣
  rationale: 直接保留指示代词、系词和人名的简明陈述。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 保留王权称号及所属关系；这是受难叙事中政治性控罪牌上的固定称谓。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: 在此王权控罪公式中通常指犹太民族；同时以脚注保留“犹太地区的人”这一可能的地域性理解。
theological_decisions:
- issue: 十字架牌上司法用语的表达
  choice: 罪状
  alternative: 控告他的罪名
  rationale: “罪状”简洁地传达αἰτία在处刑语境中的正式司法含义，而不额外加入神学判断。
- issue: Ἰουδαίων的族群或地域含义
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 受难叙事中的王号通常以民族政治称谓理解；但原词也可能具有地域含义，因此在脚注中保存这一歧义。
- issue: 补出承载文字的实体
  choice: 牌子
  alternative: 不补出，仅译作“把写下来的罪状放在他头上方”
  rationale: 原文以阴性宾格τὴν αἰτίαν为ἐπέθηκαν的宾语，并未明说“牌子”；但现代汉语若完全不补出载体会生硬且易被误解。“牌子”是语境所含信息，不改变控罪内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“罪状”保留司法色彩；“牌子”为使汉语动作关系清晰而作的语境性补充。所有脚注标记均置于相关词语之后。
