revisions:
- from: 他们在他头上方安放了一块写着他罪状的牌子[a]：“这是耶稣，犹太人的王[b]。”
  to: 他们把写着对他的控罪的牌子放在他头上方[a]：“这是耶稣，犹太人的王[b]。”
  rationale: 修订以“对他的控罪”对应原文司法语境中的αἰτία，并避免“罪状”可能带来的既定罪责含义。“牌子”作为由“放在他头上方”这一动作和处刑场景所蕴含的载体予以保留，但使其从属于所写的控罪。脚注b调整为自然的现代汉语，同时保留原词的族群／地域歧义。
