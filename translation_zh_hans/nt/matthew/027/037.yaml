    rationale: αἰτία在这里是处刑所列的控告／指控，重点是针对耶稣的司法控罪；“控罪”较能避免把指控直接表述为既定事实。
  - severity: low
    issue: 脚注b的地域性替代译法不够自然
    rationale: “犹太地区的人的王”在现代汉语中冗长且不利于辨识术语对应；“犹太地人的王”更直接保留Judeans的地域理解。
