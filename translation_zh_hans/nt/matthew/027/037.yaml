review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了把带有司法控罪的文字置于耶稣头上方，以及牌上所写王号的基本意思。不过原文的宾语是“对他的控罪／指控”，并未明说“一块牌子”；虽可按处刑场景补出牌子，中文措辞宜使控罪本身成为核心。
  naturalness: “安放了一块写着他罪状的牌子”可懂，但“安放”略显刻意，“他罪状”也稍欠自然。改为“把写着对他的控罪的牌子放在他头上方”更符合现代庄重汉语。
  terminology: αἰτία在此应保持司法性的“控罪”或“指控”，不宜将其表述为已被确认的“罪状”。“犹太人的王”保留固定王号。地域义脚注应译为自然且语义对应的“犹太地人的王”，而非冗长的“犹太地区的人的王”。
  issues:
