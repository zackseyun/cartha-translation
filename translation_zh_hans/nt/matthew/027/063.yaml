  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: zh_hans
  text: 说：“大人，我们想起那个骗子还活着时曾说：‘三天后，我复活。’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我要复活”或“我将被使复活”。希腊语这里使用现在时形式，直译为“我复活”。
    reason: 说明原文动词的时态形式及中间、被动语态上的可能理解。
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在分词承接上一节并引出直接引语；汉语用“说”自然保持这一衔接。
- source_word: Κύριε
  choice: 大人
  rationale: 这里是祭司长和法利赛人对彼拉多的尊称，并非称他为神圣之“主”；“大人”能表达对官长的敬称。
- source_word: ἐμνήσθημεν
  choice: 我们想起
  rationale: 不定过去时在此表示他们现已回想起此事；“想起”既贴近时态动作，也符合现代汉语。
- source_word: ἐκεῖνος ὁ πλάνος
  choice: 那个骗子
  rationale: “那个”保留指示词的疏远语气，“骗子”体现 πλάνος 在敌意言语中“欺骗人、引人走迷”的含义。
- source_word: ἔτι ζῶν
  choice: 还活着的时候
  rationale: 明确这话是在耶稣死前所说，同时保持自然、简洁的汉语表达。
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: 三天后
  rationale: μετά 加宾格通常表示“……之后”；不将其协调改写成“第三天”。
- source_word: ἐγείρομαι
  choice: 我复活
  rationale: 希腊语为现在时形式，形态上可作中间或被动理解。汉语“复活”在“三天后”的时间框架中可自然指将来，又不强行标明自主复起或被使复活。
theological_decisions:
- issue: 如何表达耶稣所预言的复活
  choice: 三天后，我复活
  alternative: 三天后，我要复活／三天后，我将被使复活
  rationale: 正文保留希腊语现在时形式及中间、被动之间的张力，也避免与别处的复活预言措辞强行协调。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“大人”用于对彼拉多的官长敬称；引语中的“骗子”保留说话者明显的敌意。
