  text: And sitting there[a], they kept watch over him.
translation:
  language: zh_hans
  text: 他们坐在那里[a]看守他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在那里坐下后，就看守他。”
    reason: 原文分词既可理解为与主句同时发生的状态，也可按先行动作表达为“坐下后”；两种译法并不改变他们持续看守耶稣的基本意思。
lexical_decisions:
- source_word: καὶ
  choice: （不另译）
  rationale: 此处连接词承接前文；汉语叙事中可由句序自然表达，不必机械译作“又”或“然后”，以免增添原文未明确表达的时间意味。
- source_word: καθήμενοι
  choice: 坐着
  rationale: 现在分词表示与主句动作同时发生的伴随状态；“坐着”自然地保留他们在看守时处于坐姿这一画面。
- source_word: ἐτήρουν
  choice: 看守
  rationale: 未完成时表示持续进行的动作；结合处刑现场，τηρέω在此指守卫、监看。“看守”既符合语境，也不额外强化动作。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词，承接上文的耶稣，直译为“他”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 地点副词说明行动发生之处；置于“坐着”之后符合现代汉语语序。
theological_decisions: []
