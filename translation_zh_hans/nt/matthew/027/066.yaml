  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: zh_hans
  text: 他们就去，同守卫一起封住石头，把墓守卫妥当。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们封住石头时，守卫在场。”也可能理解为：“他们封住石头，又派守卫看守。”希腊文“同守卫一起”表示与守卫有关的伴随关系；原文没有用独立动词明确说明守卫如何被派驻。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: 他们就去
  rationale: 将附带情状的过去时分词自然转为汉语连动表达；δέ在这里承接叙事，用“就”体现上下文推进，不强化转折。
- source_word: ἠσφαλίσαντο
  choice: 把墓封妥
  rationale: ἀσφαλίζω表示使某处稳妥、安全，语境中指采取措施防止墓被动过；“封妥”既自然，也与下文封石相呼应。
- source_word: τὸν τάφον
  choice: 墓
  rationale: 指耶稣安葬之处；“墓”是清楚、通行的现代汉语表达。
- source_word: σφραγίσαντες
  choice: 封住了
  rationale: 该过去时分词说明使墓安全所用的方式或伴随行动；“封住”在汉语中自然，并保留其与主要动词的紧密关系。
- source_word: τὸν λίθον
  choice: 石头
  rationale: 原文仅说“石头”，上下文已表明是墓口的石头，不在正文中补入“墓门口”等解释性信息。
- source_word: μετὰ τῆς κουστωδίας
  choice: 同守卫一起
  rationale: μετά加属格通常表示伴随；κουστωδία是指一队守卫的拉丁语借词。“同守卫一起”保留守卫在场或参与的紧凑表达，不断定其具体隶属。
theological_decisions:
- issue: μετὰ τῆς κουστωδίας如何关联封墓行动
  choice: 译作“同守卫一起封住了石头”，表达守卫与封石行动相伴。
  alternative: 也可理解为“在守卫看守下封住石头”，或“封住石头，又派守卫看守”。
  rationale: 希腊文表达简洁，明确提到守卫与行动相伴，却没有用独立动词明说“派驻”守卫。正文尽量保留这种紧凑性，脚注说明其他可能理解，避免把某一程序细节写死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“封妥”简洁表达使墓安全稳妥，“同守卫一起”保留原文关于守卫参与或在场方式的含混性。
