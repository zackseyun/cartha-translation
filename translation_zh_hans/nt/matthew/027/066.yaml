  source_fidelity: 正文将ἠσφαλίσαντο（使……安全、妥善设防）译为“把墓封妥”，随后又译σφραγίσαντες为“封住了石头”，使两个不同的希腊语动作在汉语中重复为“封”，且“封妥”容易预先限定“使墓安全”的具体方式。修订将前者表达为“把墓守卫妥当”，后者保留为“封住石头”，并维持μετὰ τῆς κουστωδίας的伴随含义。
  naturalness: 原句“他们就去把墓封妥，同守卫一起封住了石头”连动关系不够清楚，“封妥／封住”连续重复也略显生硬。修订后的语序更符合现代汉语叙事表达，同时保持庄重简洁。
  terminology: “守卫”适当地对应κουστωδία，不断定其为罗马兵或圣殿警卫。“石头”保留原文的非扩展说法；“墓”维持上下文惯用而清楚的表达。
