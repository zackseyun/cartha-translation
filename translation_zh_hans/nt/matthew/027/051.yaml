  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: zh_hans
  text: 看哪，圣殿里的幔子[a]从上到下裂成两半；大地震动，岩石也裂开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“圣所的幔子”或“圣殿的帷幕”。希腊语καταπέτασμα可指圣殿内的幔子，通常理解为与内部圣所相关的帘幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并加强戏剧性的叙事标记；“看哪”庄重而为现代读者所能理解。
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: 圣所的幔子
  rationale: ναός在此具体指圣殿中的圣所，而καταπέτασμα指其中的帷幔；“圣所的幔子”既准确又避免让人误以为是整个圣殿建筑的普通帘子。
- source_word: ἐσχίσθη
  choice: 裂成两半
  rationale: 对应不定过去时被动式，并结合εἰς δύο自然表达结果；不明说施事者，以保留原文形式。
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: 从上到下
  rationale: 自然、准确地保留撕裂的方向及其叙事强调。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 在伴随耶稣之死的异象性征兆语境中，“大地”比局部性的“地面”或“土地”更合适，同时不额外界定震动范围。
- source_word: ἐσείσθη
  choice: 震动
  rationale: 符合现代汉语叙述习惯，并准确传达地震般的摇动。
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: 磐石也裂开了
  rationale: “磐石”适合表达较大的岩体，“裂开”自然反映σχίζω用于岩石时的含义；“也”承接连续发生的征兆。
theological_decisions:
- issue: 圣所幔子裂开的神学意义
  choice: 正文只如实叙述幔子裂开，不加入象征意义的解释。
  alternative: 明确解释为通向上帝的道路开启，或对圣殿制度的审判。
  rationale: 本节报告事件，却未直接阐明其神学意义；不在译文中替作者作出解释，可保留原文的神学张力。
- issue: 撕裂动作的施事者
  choice: 采用不明说施事者的表达“裂成两半”。
  alternative: 译为“上帝把幔子撕成两半”。
  rationale: 希腊文使用被动语态，可能暗示神圣施事，但并未明说；译文因此不补出“上帝”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留原文突发而郑重的提示力；分号呈现幔子裂开与随后大地、磐石异动之间的并列推进。脚注标记[a]已置于正文对应词语之后。
