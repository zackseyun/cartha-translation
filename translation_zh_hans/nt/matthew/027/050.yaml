  source_fidelity: 正文“交出了自己的灵”虽试图保留ἀφῆκεν τὸ πνεῦμα的字面意象，但“自己的”并非原文所有格，且该搭配在现代汉语中不够自然。此处是表示死亡的惯用表达，正文采用“断了气”可准确传达其语义；脚注保留原文措辞及其歧义。
  naturalness: “耶稣却再次大声呼喊，交出了自己的灵”中的“却”在脱离上下文时略显突兀，“再次”不如叙事中的“又”简练；尤其“交出了自己的灵”不属于自然的现代汉语死亡表达。“耶稣又大声呼喊，随即断了气”庄重、清楚且自然。
  terminology: “灵”可用于在脚注中提示πνεῦμα的字面措辞，但不宜在正文以“自己的灵”形成生硬表达，或将其未经说明地固定为专门神学术语。“断了气”在此只译出死亡习语，不对耶稣之灵的性质作额外断定。
  issues:
