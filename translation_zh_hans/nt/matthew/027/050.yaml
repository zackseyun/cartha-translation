  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: zh_hans
  text: 耶稣又大声呼喊，随即断了气[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“交出了灵。”希腊文直译为“释放了灵”或“交出了灵”，是表示死亡的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δέ在这里承接上文，并带有轻微的转折或叙事推进。“却”简洁自然，也突出了叙事焦点重新落在耶稣身上；其力度不宜理解为强烈对立。
- source_word: πάλιν
  choice: 再次
  rationale: πάλιν明确表示动作重复。“再次”符合现代书面汉语，简洁而庄重。
- source_word: κράξας
  choice: 呼喊
  rationale: κράζω表示发出响亮的喊声。译作“呼喊”，并与“大声”组合，既传达声音的强度，也避免“大声喊叫”可能带来的口语或失控色彩。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 该与格短语说明呼喊的方式或声音强度。汉语以“大声呼喊”自然表达“用洪亮的声音呼喊”，无需逐字译为“以大声音”。
- source_word: ἀφῆκεν
  choice: 交出了
  rationale: ἀφίημι基本义涉及放开、释放或交出；与τὸ πνεῦμα构成死亡表达。“交出了”保留主动谓语形式及“放出/交出”的意象，比单译“死了”更贴近原文。
- source_word: τὸ πνεῦμα
  choice: 自己的灵
  rationale: πνεῦμα可指灵、气息或生命之气。原文有定冠词而无所有格，但现代汉语在此需补出反身领属才自然；“灵”保留该词的词汇和神学张力，脚注说明其死亡习语义。
theological_decisions:
- issue: 如何翻译死亡表达ἀφῆκεν τὸ πνεῦμα
  choice: 交出了自己的灵
  alternative: 断了气；咽了气；交付了灵魂
  rationale: “断了气”更直接表达死亡，却把πνεῦμα限定为气息，并抹去ἀφῆκεν的主动表达；“交付了灵魂”容易加入“灵魂”这一更专门的汉语神学术语。正文保留“交出……灵”的措辞，脚注交代其可按死亡习语理解，不进一步断定这一主动措辞的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“大声呼喊”自然承载分词短语与方式状语；“交出了自己的灵”略带庄严感，但仍可理解，并借脚注说明习语意义。
