revisions:
- from: 耶稣却再次大声呼喊，交出了自己的灵[a]。
  to: 耶稣又大声呼喊，随即断了气[a]。
  rationale: 修订以“又大声呼喊”自然表达πάλιν、κράξας与φωνῇ μεγάλῃ；以“随即断了气”译出ἀφῆκεν τὸ πνεῦμα在本语境中的死亡习语义。脚注保留“交出了灵”的较贴近字面替代，并说明该表达的习语性质，避免将“灵”或主动“交出”作超出经文本身的教义性推论。
