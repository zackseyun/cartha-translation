    issue: “自己的”添加了原文未明示的反身领属强调。
    rationale: 希腊文为τὸ πνεῦμα（“那灵/灵”），没有“自己的”这一反身所有格；汉语虽有时需要补足领属，但本句并无必要，且会造成不必要的强调。
  - severity: medium
    issue: “交出了自己的灵”在现代标准汉语中不够自然，且未充分显明该短语是死亡习语。
    rationale: ἀφῆκεν τὸ πνεῦμα在此表示死亡。以自然的“断了气”置于正文，并在脚注保留“交出了灵”的字面替代，能兼顾语义与原文措辞。
  - severity: low
    issue: “却再次”在此叙事衔接中略显生硬。
    rationale: δὲ可仅作轻微承接，不必在汉语中以带较明显转折感的“却”表达；“又”同时自然表达πάλιν及叙事推进。
