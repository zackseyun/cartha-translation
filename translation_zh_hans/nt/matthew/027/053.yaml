source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: zh_hans
  text: 他们在他复活以后从坟墓里出来，进了圣城[a]，并向许多人显现。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣城”指耶路撒冷。
    reason: cross_reference
  - marker: b
    text: 希腊文把“在他复活以后”放在“从坟墓里出来”与“进了圣城”之间；也可理解为：“他们从坟墓里出来，在他复活以后进了圣城，并向许多人显现。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 出来
  rationale: 不定过去时分词表示相对于主要叙事动作的伴随或先行动作；汉语以连动结构“出来，进了”自然表达，不必生硬译出分词形式。
- source_word: μνημείων
  choice: 坟墓
  rationale: μνημεῖον 指安葬遗体的墓穴；结合上一节坟墓被打开的语境，“坟墓”准确而通俗。
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: 在他复活以后
  rationale: μετά 加宾格表示时间上的“以后”；ἔγερσις 在此指耶稣复活。保留代词“他”，不在正文中增补名字。
- source_word: εἰσῆλθον
  choice: 进了
  rationale: 简洁表达不定过去时的叙事动作，比“进入了”更符合现代汉语叙事语感。
- source_word: τὴν ἁγίαν πόλιν
  choice: 圣城
  rationale: 保留圣经中指耶路撒冷的固定称谓，不在正文中把含蓄称谓直接改写为地名。
- source_word: ἐνεφανίσθησαν
  choice: 显现
  rationale: 该被动形式在此表示变得可见、向人出现；“显现”既准确又符合庄重叙事语体。
- source_word: πολλοῖς
  choice: 许多人
  rationale: 将希腊文未明说名词的复数形容词自然补足为“人”，使现代汉语语义完整。
theological_decisions:
- issue: “在他复活以后”与“从坟墓里出来”及“进了圣城”的句法关系
  choice: 正文将时间短语与“从坟墓里出来”相连，表达他们在耶稣复活以后出墓，随后进城。
  alternative: 也可把时间短语主要连于“进了圣城”，译作“他们从坟墓里出来，在他复活以后进了圣城”。
  rationale: 希腊文把时间短语置于分词短语“从坟墓里出来”之后、主要动词“进了”之前。正文采用最自然的就近理解，同时以脚注保留另一种可能的句法关联，不据此消解上一节与本节之间的时间张力。
- issue: “他”所指为何人
  choice: 正文保留原文代词“他”。
  alternative: 明说“耶稣”。
  rationale: 上下文足以表明所指是耶稣；保留代词更贴近原文，也避免不必要的解释性增补。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“出来，进了”保留原文动作次序；“圣城”和“显现”维持经文语体，但不使用生僻或宗派化措辞。
