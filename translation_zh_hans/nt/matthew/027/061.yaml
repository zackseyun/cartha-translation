  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: zh_hans
  text: 抹大拉的马利亚和另一位马利亚都在那里，坐在坟墓对面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: 都在那里
  rationale: 希腊文动词虽为单数，但后置主语是两位并列的人物；现代汉语用“都在那里”自然表达二人同在，并以“都”明确涵盖两人。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处 δέ 是轻微的叙事衔接语，并无强烈转折；汉语承接上下文时省译更自然，也避免加入并非时间副词的“这时”或“当时”。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经语境中通行且清楚的地名修饰式人名译法。
- source_word: ἡ ἄλλη Μαρία
  choice: 另一个马利亚
  rationale: 直译 ἄλλη 所表达的区别，指与抹大拉的马利亚不同的那位马利亚，不额外推定其身份。
- source_word: καθήμεναι
  choice: 坐在
  rationale: 该现在分词描述两人当时持续的姿态；“坐在”简明自然。
- source_word: ἀπέναντι τοῦ τάφου
  choice: 坟墓对面
  rationale: ἀπέναντι 表示处于相对或面对的位置；“坟墓对面”保留空间关系，而不进一步限定具体距离或朝向。
- source_word: τάφος
  choice: 坟墓
  rationale: 在安葬叙事中指埋葬遗体的墓穴；“坟墓”是现代汉语中准确、庄重且易懂的表达。
