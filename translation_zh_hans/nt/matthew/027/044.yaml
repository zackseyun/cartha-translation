  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: zh_hans
  text: 同样，连那些和他一同被钉十字架的强盗也辱骂他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同样”也可译作“也做同样的事”；“辱骂”也可译作“斥骂”或“讥诮”。
    reason: 说明 τὸ αὐτό 的习语意义，并保留 ὠνείδιζον 的词义范围。
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: 同样
  rationale: 该短语在这里作副词用，回指前文所述的讥诮方式；“同样”简洁自然，也保留“做同样的事”这一可能的字面理解。
- source_word: καὶ
  choice: 连……也
  rationale: 此处 καί 带有递进强调：不仅路人和宗教领袖如此，连同钉十字架的人也参与辱骂。
- source_word: λῃσταὶ
  choice: 强盗
  rationale: λῃστής 通常指抢劫者或匪徒；“强盗”是现代中文中清楚且不过度限定其政治身份的译法。
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: 那些和他一同被钉十字架的
  rationale: 定冠词加分词结构修饰“强盗”，表明他们是与耶稣一同被钉者；译文保留被动意义和共同受刑的关系。
- source_word: ὠνείδιζον
  choice: 辱骂
  rationale: 该词表示以责骂、侮辱性的言语攻击；未完成时态描写当时持续或反复进行的行为。中文“辱骂”自然地兼顾侮辱与言语攻击。
- source_word: αὐτόν
  choice: 他
  rationale: 直接宾语，指耶稣。
theological_decisions:
- issue: 是否为与《路加福音》中一名罪犯后来有不同言行的记载相协调，而弱化这里的复数表达
  choice: 按马太的叙述，以复数“强盗”表达他们辱骂耶稣，不加限制
  alternative: 将复数弱化为其中一人，或用含混措辞消除福音书叙事之间的张力
  rationale: 希腊文明确使用复数名词 οἱ λῃσταὶ，并配复数动词 ὠνείδιζον。翻译应保留马太此处的陈述，不以协调性解释改写经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一同被钉十字架”准确表达共同受刑；“连……也”体现语境中的递进强调。脚注标记置于全句之后，涵盖两项紧密相关的词汇备选。
