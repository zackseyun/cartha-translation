  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: zh_hans
  text: 耶稣站在总督面前。总督问他：“你是犹太人[a]的王吗？”耶稣说：“是你说的。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。希腊语在某些语境中既可泛指犹太人，也可特指犹太地的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“你说的是”，或“正如你所说的”。希腊原文十分简短，并带有省略和含蓄的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: 站在
  rationale: 这里是不及物意义，表示耶稣站在总督面前；不译成“被叫来站着”，以免加入原文未明说的使役含义。
- source_word: ἔμπροσθεν
  choice: 面前
  rationale: 既自然表达空间位置，也符合受审的正式场景。
- source_word: ἡγεμών / ἡγεμόνος
  choice: 总督
  rationale: 在此指罗马行政长官；“总督”清楚、通行，也比“统治者”具体，比“长官”更能体现其职位。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 上下文已清楚表明这是审讯场景，现代汉语用“问”简洁自然；“盘问”或“审问”会额外强化语气。
- source_word: λέγων
  choice: 问他
  rationale: 希腊语分词“说着”在汉语中无需机械重现，合并为引出直接问话的“问他”，使句子自然。
- source_word: βασιλεὺς
  choice: 王
  rationale: 直接对应王权称号，并保留彼拉多问题中的政治含义。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 在受难叙事的罗马政治指控语境中，通常指犹太民族；“犹太地区的人”仍是词义上可能的理解，故列入脚注。
- source_word: ἔφη
  choice: 说
  rationale: φημί在此仅引出耶稣的回应；“说”最直接，不额外加入“回答”或“宣告”的解释色彩。
- source_word: Σὺ λέγεις
  choice: 是你说的
  rationale: 保留第二人称代词的强调，也维持原文简短、省略而有所保留的语气；不像“正如你所说的”那样把回答处理成毫无保留的肯定。
theological_decisions:
- issue: 耶稣回答“Σὺ λέγεις”的语气
  choice: 译为“是你说的”，保留间接且有所保留的肯定意味。
  alternative: “你说的是”或“正如你所说的”，可更直接地理解为肯定。
  rationale: 原文既没有直截了当地否认，也没有完全照着总督的政治表述作无条件确认。译文应保留这种张力，不把它化解为明确的承认或否认。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。省去希腊语连接词在汉语中不必要的机械对应，并将“问……说”自然化为“问他”。脚注标记放在各自所说明的词语或回答之后。
