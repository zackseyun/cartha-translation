  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: zh_hans
  text: 经过的人辱骂他[a]，摇着头[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毁谤他”或“亵渎他”。原文这个动词可以指恶言辱骂或毁谤，并非只指狭义上对上帝的亵渎。
    reason: lexical_alternative
  - marker: b
    text: 摇头是表示蔑视或讥诮的动作；参诗篇22:7。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: 从那里……的人
  rationale: δέ是轻微的叙事连接词，汉语在此不必明译；冠词加分词构成实体化表达，译作“……的人”。
- source_word: παραπορευόμενοι
  choice: 从那里经过
  rationale: 现在分词描写经过受刑地点的人及其行进中的动作；“从那里经过”自然清楚，也保留现场感。
- source_word: ἐβλασφήμουν
  choice: 辱骂
  rationale: 未完成时表示持续或反复的行为。βλασφημέω用于针对人时可指毁谤、辱骂或恶言攻击；现代汉语“亵渎”通常限于神圣对象，直接用于“他”容易预先替读者判定神学含义，因此正文采用“辱骂”，并以脚注说明较强的词义可能。
- source_word: αὐτὸν
  choice: 他
  rationale: 直接宾语，指耶稣。
- source_word: κινοῦντες
  choice: 摇着
  rationale: 现在分词表示与辱骂同时发生的伴随动作；“摇着”符合现代汉语表达。
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: 头
  rationale: 希腊文直译为“他们的头”；汉语在多人各自摇头的语境中自然说“摇着头”，无需机械保留复数所有格。
theological_decisions:
- issue: 受难叙事中βλασφημέω指向耶稣时的语义和神学张力
  choice: 正文译作“辱骂”，脚注注明也可理解为“毁谤”或“亵渎”
  alternative: 正文译作“亵渎”
  rationale: 该动词比一般的“嘲笑”更强，但在希腊语中并非只能指冒犯上帝。现代汉语“亵渎他”会强烈暗示对象具有神圣身份，从而替原文消除词义张力；“辱骂”准确表达此处针对耶稣的恶言攻击，同时由脚注保留更强译法及其神学回响。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从那里经过的人”比名词化的“过路人”更贴近分词的进行性；“摇着头”自然表达伴随动作。句末保留逗号，以承接下一节的引语。
