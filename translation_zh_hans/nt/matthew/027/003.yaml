id: MAT.27.3
reference: Matthew 27:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: zh_hans
  text: 那时，出卖耶稣的犹大见耶稣已经被定罪，就懊悔了，把那三十块银子还给祭司长和长老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为叙事中的时间推进标记，既可承接前文，也符合庄重自然的现代汉语。
- source_word: ἰδὼν
  choice: 见……已经
  rationale: 该不定过去时分词在此带时间和情境关系；用“见……已经”自然表达犹大得知判决后的反应。
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: 出卖耶稣的
  rationale: 带冠词的现在分词用于标明犹大的身份和角色；“出卖”符合本段背叛并交付耶稣的语境。为消除汉语代词指向不清，重复“耶稣”。
- source_word: ὅτι κατεκρίθη
  choice: 耶稣已经被定罪
  rationale: ὅτι引出所见内容，κατεκρίθη为不定过去时被动；“已经被定罪”清楚呈现先于犹大反应的判决。
- source_word: μεταμεληθεὶς
  choice: 懊悔了
  rationale: μεταμέλομαι表示后悔、懊悔；此译法保留情感和道德分量，却不把它强化为对犹大属灵状态作结论的“悔改”。
- source_word: ἔστρεψεν
  choice: 还给
  rationale: 在银钱和间接受词的语境中表示归还；“还给”是准确自然的现代汉语。
- source_word: τὰ τριάκοντα ἀργύρια
  choice: 那三十块银子
  rationale: ἀργύρια指银制货币或银钱单位；“三十块银子”兼顾传统熟悉度与原文未明确币种的宽泛性。
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: 祭司长和长老
  rationale: 这是马太福音中对犹太领袖群体的标准、准确称谓。
theological_decisions:
- issue: μεταμεληθεὶς是否应译为具有完整神学含义的“悔改”
  choice: 懊悔了
  alternative: 悔改了／改变了心意
  rationale: 原文使用μεταμέλομαι而不是μετανοέω。译作“懊悔”呈现犹大的后悔，却不超出经文，对其是否真正悔改作神学裁断。
- issue: παραδιδοὺς在此强调一般性的交付还是背叛
  choice: 出卖
  alternative: 交出／交付
  rationale: 该词本身可指交付，但在犹大收取银钱并把耶稣交给领袖的叙事中，“出卖”自然传达其背叛性质，同时不添加宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式按汉语习惯重组为“见……就……”，保留原文动作间的时间与因果关联；以“耶稣”替代容易产生歧义的两个“他”。
