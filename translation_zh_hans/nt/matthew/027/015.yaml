id: MAT.27.15
reference: Matthew 27:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: zh_hans
  text: 每逢节期[a]，总督照例给群众释放一个他们想要的囚犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“节日”。
    reason: 词语ἑορτή既可译为“节期”，也可译为“节日”；两者都能表达宗教节庆。
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: 每逢节期
  rationale: κατά加宾格在这里表示节期之时；结合εἰώθει所表达的惯常做法，用“每逢”自然传达反复发生的时间背景。δέ仅作轻微承接，不必另译为“现在”。
- source_word: ἑορτὴν
  choice: 节期
  rationale: ἑορτή指宗教节庆；“节期”既符合上下文中的逾越节背景，也保留较宽泛的节庆含义。
- source_word: εἰώθει
  choice: 照例
  rationale: 该词表达过去惯常的做法；“照例”简洁、自然地保留习惯性含义。
- source_word: ὁ ἡγεμὼν
  choice: 总督
  rationale: 此处指罗马的地方行政长官；“总督”是清楚且符合叙事背景的现代汉语称呼。
- source_word: ἀπολύειν
  choice: 释放
  rationale: 此处指解除拘押，“释放”符合司法和羁押语境。
- source_word: ἕνα
  choice: 一个
  rationale: 明确保留原文所说释放一名囚犯。
- source_word: τῷ ὄχλῳ
  choice: 给群众
  rationale: 与格表示受益者或相关对象；“给群众释放”自然表达按群众意愿放人的意思，同时保留“群众”这一集体称谓。
- source_word: δέσμιον
  choice: 囚犯
  rationale: δέσμιος指受捆绑或被拘押的人；“囚犯”在此最清楚。
- source_word: ὃν ἤθελον
  choice: 他们想要的
  rationale: 关系从句修饰“一个囚犯”，说明由群众意愿决定释放哪一人；此译法保留原文简洁结构，不额外解释选择程序。
