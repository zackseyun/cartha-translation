  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: zh_hans
  text: 约在下午三点，耶稣大声喊道：“以利！以利！拉马撒巴各大尼？”[a]意思是：“我的神！我的神！你为什么离弃我？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的措辞呼应《诗篇》22:1。
    reason: cross_reference
  - marker: b
    text: “离弃”所译的希腊语动词是不定过去时，也可理解为“你为什么曾离弃我？”正文未加汉语体标记，以保留原文在此处的时体开放性。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: 约在下午三点
  rationale: περί加时间宾格表示“大约”。“第九时”按当时从日出计时约为现代的下午三点；正文采用现代读者易懂的时间表达，不另行强化轻微连接词δέ。
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 合并表达动词所含的高声呼喊之意和方式短语φωνῇ μεγάλῃ，中文自然且保留强调。
- source_word: λέγων
  choice: 说
  rationale: 分词引出呼喊的内容，译作“说”符合现代汉语叙事习惯。
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: 以利！以利！拉马撒巴各大尼？
  rationale: 马太先保留闪语呼喊，再给出解释；正文同样音译，以保存叙事形式及其与后文误听“以利”的联系。
- source_word: τοῦτ’ ἔστιν
  choice: 意思是
  rationale: 自然、简洁地引出原文所给的翻译说明。
- source_word: Θεέ μου θεέ μου
  choice: 我的上帝！我的上帝！
  rationale: 保留呼格的重复与强烈语气，也维持诗篇22:1的回响。
- source_word: ἱνατί
  choice: 为什么
  rationale: 直接对应询问原因的副词。
- source_word: ἐγκατέλιπες
  choice: 离弃
  rationale: 该词为不定过去时，语境中指向已发生且在呼喊当下仍具现实效力的离弃；现代汉语“你为什么离弃我”自然保留这层开放性，无须强行标明完成体。
theological_decisions:
- issue: 耶稣的呼喊与诗篇22:1的关系
  choice: 如实译为真实而直接的离弃之问，同时以脚注指出诗篇回响，不在译文中解释其神学机制。
  alternative: 将其主要处理成引用诗篇的提示语，或用释义缓和“离弃”的含义。
  rationale: 希腊文没有附加解释或缓和语。直译既保留呼喊的切身力度，也保留经文内部的神学张力。
- issue: 是否在正文保留闪语呼喊
  choice: 保留音译，随后照原文给出中文意思。
  alternative: 只译出中文含义。
  rationale: 马太有意同时保存原话和解释；保留二者忠实反映原文结构，并为相邻叙事中旁人误以为他在呼叫以利亚提供语言背景。
- issue: ἐγκατέλιπες的时体表达
  choice: 译作“你为什么离弃我”，不加“曾经”或“已经”。
  alternative: 译作“你为什么曾离弃我”或“你为什么已经离弃我”。
  rationale: 希腊语不定过去时本身不强制一种汉语体貌解释；不添加体标记，可避免把行动限定为纯粹过去或过度凸显完成状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“下午三点”将古代“第九时”转换为现代时间；闪语音译沿用中文圣经读者较熟悉的形式。感叹号用于呈现重复呼格的呼喊力度，问号涵盖整句疑问。
