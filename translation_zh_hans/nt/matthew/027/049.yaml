base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: zh_hans
  text: 其余的人却说[a]：“别管他[b]！我们看看以利亚是不是会来救他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其他人却说。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“由他吧。”原文在“是不是”引出的间接疑问中使用现在时“来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: 其余的人却
  rationale: “其余的人”自然表达 λοιποί 所指的其余在场者；“却”体现 δέ 在语境中的转折或对比。
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时可能含持续或反复意味，但汉语叙事用“说”最自然，不额外强化原文未明确要求的反复性。
- source_word: Ἄφες
  choice: 别管他
  rationale: 这是对单数对象发出的命令，字面可作“任凭、不要干预”。语境中是叫先前拿酸酒的人不要再介入；“别管他”自然地补出所指对象，同时保留停止干预的意思。
- source_word: ἴδωμεν
  choice: 我们看看
  rationale: 第一人称复数劝勉虚拟式，译为“我们看看”简洁自然，也符合现场观察结果的语气。
- source_word: εἰ ἔρχεται
  choice: 是不是会来
  rationale: εἰ 引出间接疑问；现在时 ἔρχεται 在此带有临场和预期色彩。汉语“是不是会来”自然表达尚待观察的来临，同时不武断规定其严格时态。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的先知名译法。
- source_word: σώσων αὐτόν
  choice: 来救他
  rationale: 将未来分词表达的目的与 ἔρχεται 连贯译出。“救”既符合此处从十字架上解救的直接意义，也保留 σῴζω 在受难叙事中的词汇呼应。
theological_decisions:
- issue: 受难语境中 σῴζω 可能具有的神学意味
  choice: 译为“救他”，在直接语境中指从十字架和死亡中解救。
  alternative: 译为“搭救他”或“救下他”。
  rationale: 说话者是在等待可见的身体解救，并非直接论述永恒救恩；但“救”是 σῴζω 的常规对应，也能保留受难叙事中的反讽和神学张力，而不加以解释消解。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“别管他”符合现场直接说话的语气；“是不是会来”使现代读者容易理解，同时脚注保留原文现在时及另一种较贴近形式的译法。
