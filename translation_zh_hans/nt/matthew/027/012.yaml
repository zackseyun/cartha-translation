id: MAT.27.12
reference: Matthew 27:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: zh_hans
  text: 祭司长和长老控告他的时候，他什么也没有回答[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他没有作答。
    reason: ἀπεκρίνατο 与 οὐδέν 的组合既可较直译为“什么也没有回答”，也可自然概括为“没有作答”；脚注保留这一措辞选择。
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: 控告他的时候
  rationale: ἐν 加冠词化不定式在这里表达同时发生的情形；“……的时候”自然地传达了希腊文的时间关系，句中的被动意义则按现代汉语习惯转为主动句，由施事者“祭司长和长老”作主语。
- source_word: κατηγορεῖσθαι
  choice: 控告他
  rationale: 该词指向某人提出指控；“控告”适合彼拉多审讯的司法语境，也不额外强化为定罪或谴责。
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: 祭司长和长老
  rationale: 福音书中的复数 ἀρχιερεῖς 通常指祭司领袖群体，惯译“祭司长”；πρεσβύτεροι 在此指犹太领袖中的长老。
- source_word: οὐδὲν
  choice: 什么也没有
  rationale: 保留 οὐδέν 作为 ἀπεκρίνατο 内容宾语的直接表达，而不把它解释性地改写为“一言不发”。
- source_word: ἀπεκρίνατο
  choice: 回答
  rationale: 该动词在此表示回应指控；“回答”准确、自然，并与“什么也没有”组成现代汉语常用表达。
- source_word: καὶ
  choice: （由上下文衔接，不单独译出）
  rationale: 句首 καί 承接前文；汉语叙事在本句以时间从句开头时无需机械译作“并且”，省略连接词更自然，同时不增加原文没有的转折。
theological_decisions:
- issue: 耶稣面对控告时的沉默
  choice: 按叙事本身译为“他什么也没有回答”
  alternative: 解释性地译作“他一言不发”，或加入与《以赛亚书》53章应验有关的措辞
  rationale: 本节只陈述耶稣没有回应控告。虽然这一情景可能使读者联想到受苦仆人的经文，但原句没有明确说明预言应验，因此译文不加入该层解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“控告”符合审讯场景；“什么也没有回答”既贴近原文结构，也便于普通读者理解。脚注标记紧接其所说明的短语，而不附在“长老”之后。
