  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: zh_hans
  text: 他信靠上帝；现在就让上帝救他吧，如果上帝愿意要他[a]，因为他说[b]：‘我是上帝的儿子。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果上帝喜爱他。”这里的措辞呼应《诗篇》22:8；在那一节中，上帝的喜爱或恩待是突出的含义。
    reason: alternative_reading
  - marker: b
    text: 这番讥诮与《诗篇》22:8非常相似，使耶稣所受的嘲弄与那篇诗中受苦的义人相联系。
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: 他信靠上帝
  rationale: πέποιθεν是完成时，表达因先前信靠而形成的持续状态；现代汉语“信靠”自然传达倚赖上帝的意思。汉语不宜机械加入“已经”，以免把重点限于过去。
- source_word: ῥυσάσθω νῦν
  choice: 现在就让上帝救他吧
  rationale: ῥύομαι指从危难中救出；“救”简明自然。“现在就……吧”保留νῦν的即时性以及命令式在讥诮语境中的挑战口吻。希腊文省略主语，但上文的“上帝”显然是施救者，中文明确补出以免两个“他”造成混淆。
- source_word: εἰ θέλει αὐτόν
  choice: 如果上帝愿意要他
  rationale: θέλω通常表示愿意、想要；“愿意要他”贴近原文，也保留此处究竟侧重意愿、接纳还是喜爱的语义张力。再次明说“上帝”可消除中文代词歧义。
- source_word: εἶπεν γὰρ ὅτι
  choice: 因为他曾说过
  rationale: εἶπεν是简单过去时；“曾说过”符合汉语叙事习惯。ὅτι所引内容改用直接引语，清楚而不改变意义。
- source_word: Θεοῦ εἰμι υἱός
  choice: 我是上帝的儿子
  rationale: 此处无冠词的谓语名词结构在马太叙事中具有身份称谓的力量，并非泛指众多神子中的一个；中文“上帝的儿子”自然承载这一特指性，同时避免额外加入原文没有的词。
theological_decisions:
- issue: Θεοῦ εἰμι υἱός的基督论称谓
  choice: 我是上帝的儿子
  alternative: 我是上帝的一个儿子
  rationale: 孤立来看，无冠词形式可能容许不定理解；但在马太福音的叙事语境中，这是已出现的身份称谓。中文不加“一个”能保存其称谓力量，又不把后期信条措辞扩写进经文。
- issue: θέλει αὐτόν是否按诗篇22:8的回声译作“喜爱他”
  choice: 如果上帝愿意要他
  alternative: 如果上帝喜爱他
  rationale: 马太此处的θέλω最直接是“愿意、想要”；诗篇22:8的互文使“喜爱、悦纳”成为真实可能，但不宜在正文中替原文消解这一张力，故列入脚注。
- issue: 讥诮与诗篇22篇义人受苦主题的关系
  choice: 保留讥诮原话，并以脚注指出互文
  alternative: 在正文中解释为诗篇预言的应验
  rationale: 正文只呈现说话者的挑战，不加入原文未明说的解释；脚注帮助读者辨认明显的诗篇回声。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”与既定中文用语一致；句中补明两处“上帝”，避免连续代词造成施事者不清。用分号保留原句前后两项讥诮之间的紧密关系，直接引语则增强可读性。
