id: MAT.27.54
reference: Matthew 27:54
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: zh_hans
  text: 百夫长和那些跟他一起看守耶稣的人，看见地震和所发生的事，就非常害怕，说：“这人真是上帝的儿子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的一个儿子。”希腊原文的“上帝的儿子”没有冠词；本译文依据马太福音的上下文，将它理解为指向耶稣身份的称号。
    reason: 保留无冠词结构可能引起的另一种理解，同时说明主文译法的语境依据。
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: 百夫长
  rationale: 这是现代中文圣经语境中对罗马军官的通行、准确称呼，也保留了原词所指的军职。
- source_word: τηροῦντες
  choice: 看守
  rationale: 此处指行刑现场的守卫职责，不只是观看；“看守”简洁而符合语境。
- source_word: ἰδόντες
  choice: 看见
  rationale: 将不定过去时分词按其时间关系自然译入“看见……就……”结构。
- source_word: σεισμόν
  choice: 地震
  rationale: 这是 σεισμός 在本段叙事中的直接含义。
- source_word: τὰ γενόμενα
  choice: 所发生的事
  rationale: 保留其概括性，使所指不限于地震，也包括周围已经发生的事件。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 非常害怕
  rationale: 自然表达动词与强化副词 σφόδρα 的强烈程度。
- source_word: Ἀληθῶς
  choice: 真是
  rationale: 在直接引语中自然传达“确实、真正”的肯定语气，同时不额外界定说话者认识的神学深度。
- source_word: θεοῦ υἱὸς
  choice: 上帝的儿子
  rationale: 符合马太福音中这一称号的基督论语境；中文没有冠词，“上帝的儿子”既可自然作为称号，也不会像补入“一个”那样过早排除原文形式上的讨论空间。
- source_word: οὗτος
  choice: 这人
  rationale: 比单独译为“这”更合现代中文口语，同时保留指示代词在现场话语中的直接性。
theological_decisions:
- issue: 百夫长宣认中 θεοῦ υἱὸς 的定指或不定指理解
  choice: 上帝的儿子
  alternative: 上帝的一个儿子
  rationale: 原文名词短语没有冠词，但谓语名词无冠词并不必然表示不定；马太福音的整体叙事支持把它理解为指向耶稣身份的称号。中文主文采用“上帝的儿子”，脚注则保留“上帝的一个儿子”这一形式上可能的理解，以免消除真实的释义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“跟他一起看守耶稣的人”自然呈现该群体与百夫长的关系和守卫职责；“看见……就……”符合现代汉语事件推进方式。
