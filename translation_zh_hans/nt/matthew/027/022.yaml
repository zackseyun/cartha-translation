  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: zh_hans
  text: 彼拉多对他们说：“那么，那称为弥赛亚[a]的耶稣，我该拿他怎么办呢？”众人都说：“让他被钉在十字架上！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: 保留χριστός这一称号的传统汉语译法。
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: 那么……我该拿他怎么办呢
  rationale: ποιήσω在此用于商议性问句；现代汉语用“我该……怎么办”自然表达说话者询问应采取何种处置。οὖν译作“那么”，保留承接前文并推出下一步的语篇作用。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 按现代汉语通行形式译写人名。
- source_word: τὸν λεγόμενον χριστόν
  choice: 那称为弥赛亚的
  rationale: λεγόμενον是现在时被动分词，在此作定语，译为“称为”；χριστός在本句中明确作为称号使用，译出其称号含义“弥赛亚”，而不把它处理为姓名的一部分。
- source_word: λέγουσιν πάντες
  choice: 众人都说
  rationale: πάντες的整体性以“众人都”表达；历史现在时λέγουσιν按自然的汉语叙事习惯译为“说”。
- source_word: Σταυρωθήτω
  choice: 让他被钉十字架
  rationale: 第三人称单数不定过去时被动命令式；“让他被……”兼顾强烈要求、第三人称命令和被动形式。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处χριστός出现在“称为……”的结构中，作用是称号而非准姓名；正文译为“弥赛亚”以传达其犹太受膏者称号的意义，同时脚注保留传统译法“基督”。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“我该拿他怎么办”符合普通现代汉语的商议性问句；“让他被钉十字架”略带郑重色彩，以保留原文被动命令式。脚注标记置于“弥赛亚”之后，使其所指明确。
