  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: zh_hans
  text: 他们把他捆绑起来，押走，交给总督彼拉多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: 把他捆绑起来
  rationale: 该词是δέω的不定过去时主动分词，表示在主要动作之前发生的动作。“把他捆绑起来”既保留实际捆绑之意，也以自然汉语呈现其先行动作。
- source_word: ἀπήγαγον
  choice: 押走
  rationale: ἀπάγω可指领走或带走；在拘押和审讯的语境中，“押走”简洁地表达有人看守、带离现场的含义。
- source_word: παρέδωκαν
  choice: 交给
  rationale: παραδίδωμι在此指把耶稣交到彼拉多的权下或监管中。“交给”符合现代汉语，并保留司法移交以及受难叙事中可能具有的更深含义，不额外作神学解释。
- source_word: Πιλάτῳ
  choice: 彼拉多
  rationale: 按现代中文圣经人名的通行译法音译Pilatus。
- source_word: τῷ ἡγεμόνι
  choice: 总督
  rationale: ἡγεμών泛指治理者或地方行政长官；“总督”通俗、准确，也避免用“长官”削弱其统治职权，或用“ prefect（行政长官）”过度限定具体官衔。
- source_word: καὶ … καὶ
  choice: ……，……，……
  rationale: 原文以καί连接连续动作。汉语用逗号顺接“捆绑、押走、交给”，自然地保留紧凑的叙事推进，无须机械重复“然后”和“他们”。
theological_decisions:
- issue: 受难叙事中παραδίδωμι的表达
  choice: 交给
  alternative: 移交给；交付给
  rationale: “交给”首先清楚表达当下把耶稣交到罗马官长权下的司法行动，同时不排除该动词在受难叙事中的神学回响。“移交给”更偏正式司法术语，“交付给”则较书面，均不如正文选择自然。
translation_notes:
  register: 采用现代、庄重而简明的叙事语体。“押走”体现拘押语境；句中连续三个动作保持原文紧凑节奏。未设脚注，因为相关词义差异可在正文中充分表达，且不存在必须向普通读者标示的实质性文本异读。
