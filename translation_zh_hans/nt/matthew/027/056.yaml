  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: zh_hans
  text: 其中有抹大拉的马利亚、雅各和约瑟[a]的母亲马利亚，以及西庇太儿子们的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“约西”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: 其中有
  rationale: 承接上一节所说的妇女群体；“其中有”既保留关系衔接，也符合现代汉语列举成员的自然表达。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 以“抹大拉的”作为地域性称号来辨识这位马利亚，是现代中文圣经语境中清楚而惯用的译法。
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: 雅各和约瑟的母亲马利亚
  rationale: 两个属格名词共同修饰“母亲”；调整为自然的中文定中结构，同时明确这是另一位马利亚。
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 依照SBLGNT正文所采用的读法音译；异文另以脚注说明。
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: 西庇太儿子们的母亲
  rationale: 忠实表达她是西庇太众子的母亲；“儿子们”保留希腊文复数，并采用自然清楚的中文结构。
theological_decisions: []
