source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: zh_hans
  text: 他们拿掺了苦胆的酒给他喝[a]；他尝了，却不愿意喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦胆”原文也可较宽泛地指苦味之物。这里保留马太所用的具体词语；另参马可福音15:23，那里记载的是没药。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: 他们拿……给他喝
  rationale: 既保留 δίδωμι“给”的基本含义，也符合现代汉语表达；不强化为“强迫他喝”或仅译作“递给他”。
- source_word: οἶνον
  choice: 酒
  rationale: οἶνος通常指酒；此处没有理由泛化为“饮料”。
- source_word: μετὰ χολῆς μεμιγμένον
  choice: 掺了苦胆的
  rationale: μεμιγμένον表示已经混合、掺入；χολή可指胆汁、苦胆，也可泛指苦味之物。“苦胆”保留马太用词的具体形象及其经文呼应，同时由脚注说明词义范围。
- source_word: καὶ γευσάμενος
  choice: 他尝了，却
  rationale: γευσάμενος是“尝了、尝过以后”；καί字面为“并且”，但在此连接尝与不愿喝的反差，汉语用“却”自然呈现语篇关系。
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: 不愿意喝
  rationale: θέλω表达意愿；“不愿意”保留意志层面的含义，又不把它强化为更明确的“拒绝”。
theological_decisions:
- issue: χολή在受难叙事及经文呼应中的译法
  choice: 苦胆
  alternative: 苦味之物
  rationale: 原词既可具体指胆汁、苦胆，也可延伸指苦味之物。正文采用“苦胆”，以保留马太措辞的具体性和可能的诗篇呼应；脚注呈现其较宽泛的词义，且不以马可福音15:23的“没药”替换马太的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拿……给他喝”比生硬的“给他酒喝”更自然；分号及“却”清楚呈现先尝后不愿喝的转折。
