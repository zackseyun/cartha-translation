source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: zh_hans
  text: 他们用荆棘编成一个冠冕，把它戴在他头上，又把一根芦苇放在他右手里；随后跪在他面前嘲弄他，说：“犹太人的王，万岁！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地人”。希腊语Ἰουδαίων既可指犹太人，也可指犹太地人；这里用于嘲讽耶稣的王号。
    reason: 保留Ἰουδαίων在族群与地域指称之间的词义可能。
lexical_decisions:
- source_word: πλέξαντες
  choice: 用……编成
  rationale: 表达先于主要动作发生的分词动作，也自然呈现把荆棘编结成冠冕的过程。
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: 用荆棘编成一个冠冕
  rationale: στέφανος可指花冠或冠冕；在戏仿君王的语境中，“冠冕”既保留具体物件，也显明其王权象征。
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: 戴在他头上
  rationale: 符合现代汉语习惯，准确表达把冠冕放到耶稣头上的动作。
- source_word: κάλαμον
  choice: 一根芦苇
  rationale: 保留原文所指的具体物件，不直接译作“权杖”，以免把语境中的象征解释写进正文。
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: 放在他右手里
  rationale: 自然表达芦苇被置于其右手中的位置，同时保留戏仿君王持杖的画面。
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: 跪在他面前
  rationale: 简洁准确地呈现假意臣服的姿态。
- source_word: ἐνέπαιξαν αὐτῷ
  choice: 嘲弄他
  rationale: 体现士兵带有侮辱性的讥讽，比口语化的“取笑”更符合受难叙事的庄重语体。
- source_word: Χαῖρε
  choice: 万岁
  rationale: 此处不是普通问候，而是讽刺性的王室欢呼；“万岁”在现代汉语中能自然传达向君王欢呼致敬的语气和反讽。
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 保留呼格称谓及受难叙事中作为控告与嘲讽用语的王号；Ἰουδαίων在此宜采用较广为人知的“犹太人”。
theological_decisions:
- issue: 如何保留士兵假意朝拜所形成的王权反讽
  choice: “犹太人的王，万岁！”
  alternative: “向你致敬，犹太人的王！”
  rationale: “万岁”带有明确的君王欢呼色彩，能呈现士兵戏仿朝廷礼仪的言行，同时不在正文中替读者解释耶稣王权的神学意义。
- issue: Ἰουδαίων在王号中的范围
  choice: “犹太人”
  alternative: “犹太地人”
  rationale: 该词可具有族群、宗教文化或地域含义；在此固定的受难叙事王号中，“犹太人”最自然，也不会无根据地把范围限于犹太地区。以脚注保留地域性译法的可能。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“冠冕”与“万岁”共同保留戏仿君王礼仪的场景；不把“芦苇”解释性改写为“权杖”。脚注标记置于相关王号之后。
