  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: zh_hans
  text: 他们把唾沫吐在他身上，然后拿起那根芦苇[b]，不住地[a]打他的头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不住地打”也可译作“不断打”或“反复打”。希腊文的未完成时动词可强调动作持续或反复进行。
    reason: lexical_alternative
  - marker: b
    text: “芦苇”也可指芦苇般的杖。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: 吐唾沫在他身上
  rationale: ἐμπτύω与εἰς加宾格连用，表示把唾沫吐在某人身上；这样译具体、自然，并保留羞辱性的动作。分词为不定过去时，在叙事中先于后面的主要动作发生；汉语按语序即可清楚表达先后。
- source_word: ἔλαβον
  choice: 拿过
  rationale: λαμβάνω在此指士兵拿起或拿回先前放在耶稣手里的芦苇；“拿过”简洁自然，不额外加入“夺取”等较强含义。
- source_word: τὸν κάλαμον
  choice: 那根芦苇
  rationale: κάλαμος基本义为“芦苇”，也可延伸指芦苇般的杖。定冠词及上下文指向前文出现的同一根芦苇，“那根”保持叙事衔接和讽刺意味。
- source_word: ἔτυπτον
  choice: 不住地打
  rationale: 未完成时可表现过去持续或反复的动作；“不住地打”以自然汉语明确传达连续、反复击打，同时不夸大为原文未明说的伤害结果。
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: 他的头
  rationale: εἰς在τύπτω的搭配中标示击打目标；汉语“打他的头”自然表达击打头部。
theological_decisions:
- issue: 如何呈现士兵对耶稣的羞辱和暴力
  choice: 以具体、克制的叙事语言直译吐唾沫和反复击打的动作
  alternative: 采用较文言的“吐唾沫在他身上，就拿芦苇打他的头”，或弱化未完成时而只译“打了他的头”
  rationale: 本节并无必须释义化处理的教义争议。译文应如实保留耶稣所受的羞辱和反复暴力，不淡化，也不添加原文没有的情节或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“吐唾沫”比单说“吐”更明确；“不住地打”自然传达未完成时的持续或反复意味。脚注标记均置于正文相关句末。
