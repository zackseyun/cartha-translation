  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: zh_hans
  text: 于是，彼拉多对他说：“他们提出这么多不利于你的证词[a]，你没有听见吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们作证反对你”或“他们作了多少不利于你的见证。”希腊文动词带有法律审讯中作不利证言的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 作为叙事中的时间推进标记，表示接续发生的事件；“于是”符合现代汉语叙事习惯。
- source_word: λέγει
  choice: 说
  rationale: 原文是叙事性历史现在时。现代汉语动词本身不标时态，用“说”既自然，也不必人为添加过去时形式。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 保留原文代词，不把所指对象解释性地展开为“耶稣”；上下文足以明确其所指。
- source_word: ὁ Πιλᾶτος
  choice: 彼拉多
  rationale: 按现代汉语圣经人名的通行译法处理；希腊文专名前的冠词无需另译。
- source_word: Οὐκ ἀκούεις
  choice: 你没有听见吗
  rationale: 保留否定疑问句的语气和ἀκούω“听见”的基本含义；表达自然，并带有彼拉多催促回应的意味，而不将其改写为命令。
- source_word: πόσα
  choice: 这么多事
  rationale: 中性复数在此指数量众多的事项。“这么多事”比“多少事情”更符合汉语反问语气，同时避免直接增译为“罪状”或“指控”。
- source_word: σου
  choice: 指控你
  rationale: 该属格与καταμαρτυρέω连用，语境中具有针对、反对之义；汉语借助“指控你”自然表达这一关系。
- source_word: καταμαρτυροῦσιν
  choice: 他们作证指控
  rationale: 该动词具有法律审讯中“作不利见证”的含义。“作证指控”兼顾作证和针对被告的不利方向，避免只译“控告”而丢失见证语义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法庭叙事用语。句序略按汉语调整，把“这么多事”置于“作证指控你”之后的整体宾语位置；不添加原文没有的说话者或罪名，也不以注释解决语境中的修辞张力。
