  source_fidelity: “取下”超出了本节λαβών（“取了／拿了”）的明示含义；尽管取下十字架可由上下文推知，本节不应将该动作写入正文。其余主要语义——遗体、洁净的细麻布及包裹——基本准确。
  naturalness: “把它裹好”在现代汉语中以“它”指称耶稣的遗体略显生硬，也容易造成不必要的非人格化效果。重复“遗体”在此简洁、庄重且清楚。
  terminology: “遗体”“洁净”“细麻布”均适合死亡与安葬叙事。“细麻布”可在注释中说明也可译为“裹尸布”；不必在中文注释中保留希腊语中性代词的语法说明，因为修订后的中文没有相应代词形式。
