  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: zh_hans
  text: 约瑟取了遗体，用一块洁净的细麻布把遗体裹好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻布”也可译作“裹尸布”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: 取下
  rationale: 这是先于主要动词发生的不定过去时分词。结合上文向彼拉多领取并取得耶稣遗体的情境，译作“取下”符合中文叙事习惯，也自然指向从十字架上取下遗体。
- source_word: τὸ σῶμα
  choice: 遗体
  rationale: σῶμα本义为“身体”；在明确的死亡和安葬语境中，现代汉语用“遗体”自然、庄重，并准确传达所指。原文没有物主代词，因此不增译“他的”。
- source_word: ἐνετύλιξεν
  choice: 裹好
  rationale: ἐντυλίσσω表示包裹、裹住。在安葬语境中“裹好”自然，并传达动作的完成性，不额外引入捆绑之意。
- source_word: αὐτὸ
  choice: 它
  rationale: 该中性单数代词在语法上回指同为中性的σῶμα。中文以“它”回指“遗体”，保留原文的语法关联；也可因实际所指是耶稣而理解为“他”，故加注说明。
- source_word: σινδόνι
  choice: 一块……细麻布
  rationale: σινδών指亚麻布，在此可作裹尸布。译为“细麻布”兼顾材质和传统圣经用语，同时不把一般名词过度限定为特定形制的“裹尸布”。量词“一块”是自然汉语所需。
- source_word: καθαρᾷ
  choice: 洁净的
  rationale: καθαρός在此修饰细麻布，表示干净、洁净。“洁净”较庄重，适合安葬叙事；不将其专门解释为礼仪上的洁净。
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: 约瑟
  rationale: καί承接前文。汉语逐句译出“于是/然后”会增加时间推进色彩，省略连接词仍能自然保留连续叙事。
