- from: 约瑟取下遗体，用一块洁净的细麻布把它裹好[a]。
  to: 约瑟取了遗体，用一块洁净的细麻布把遗体裹好[a]。
  rationale: 将“取下”改为“取了”，使译文严格对应λαβών而不添加本节未明说的动作；以“遗体”替代“它”，使现代汉语更自然清楚。脚注仅保留中文译文中实际相关的σίνδων词义替代，并删除不再有对应表达的代词语法说明。
