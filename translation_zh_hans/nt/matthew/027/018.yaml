  text: For he knew that they had handed him over because of envy[a].
translation:
  language: zh_hans
  text: 因为他知道，他们是出于嫉妒才把耶稣交了出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为嫉妒”或“出于妒忌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 他知道
  rationale: οἶδα在此表示确知、明白；“知道”直接自然，也保留彼拉多对他们动机的判断。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明彼拉多如此行事的原因；现代汉语用“因为”能清楚表达解释关系。
- source_word: ὅτι
  choice: （知道）……
  rationale: ὅτι引出“知道”的内容，汉语无需另译为“那”，直接用宾语小句最自然。
- source_word: διὰ φθόνον
  choice: 出于嫉妒
  rationale: διά加宾格表示原因或动机；φθόνος指因他人的地位或成就而产生的嫉妒。“出于嫉妒”既贴近原文，也明确呈现其动机性质。
- source_word: παρέδωκαν
  choice: 把……交来
  rationale: παραδίδωμι在此指把耶稣交到彼拉多手中。“交来”自然体现行动朝向彼拉多；不译作“出卖”，以免把含义缩窄为犹大的背叛。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 原文代词指耶稣。中文在本句中补出姓名可避免“他知道，他们……把他交来”连续代词造成的指代含混。
theological_decisions:
- issue: 控告耶稣之人的动机
  choice: 彼拉多知道他们是出于嫉妒把耶稣交来
  alternative: 彼拉多知道他们是出于妒忌把耶稣交来
  rationale: 经文将其行动归因于φθόνος。正文用“嫉妒”保留其道德与心理意味，不进一步推断经文未明说的神学原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“才”突出“出于嫉妒”是交付行动的动机，但不增加额外因果内容；补出“耶稣”以消除中文代词歧义。
