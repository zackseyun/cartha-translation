  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: zh_hans
  text: 他却说[a]：“他究竟做了什么恶事？”他们却越发喊叫着说[b]：“把他钉在十字架上！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“为什么？他做了什么坏事？”
    reason: 说明τί γὰρ在此可用更口语化的质问方式表达。
  - marker: b
    text: 原文直译为：“让他被钉在十字架上！”希腊文使用被动命令式；汉语通常以“把他钉在十字架上”表达同一要求。
    reason: 说明希腊文使用第三人称被动命令式，而正文采用自然的汉语主动祈使表达，未指定额外的执行者。
lexical_decisions:
- source_word: ἔφη
  choice: 说
  rationale: 这里的简单过去时用于引出叙事中的话语；现代汉语用“说”自然准确，无须增添“回答”或持续意味。
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: 他究竟做了什么恶事？
  rationale: τί与γάρ在此构成带有质问意味的问题。“究竟”自然传达γάρ在语境中的追问语气，同时“恶事”保留κακόν的道德分量。
- source_word: κακὸν
  choice: 恶事
  rationale: κακόν指坏事或恶行；“恶事”比“错事”更贴近其道德力度，又符合现代汉语表达。
- source_word: περισσῶς
  choice: 越发
  rationale: 该副词表示程度进一步加剧；“越发”简洁传达群众反应升级，而不擅自限定为音量或情绪。
- source_word: ἔκραζον
  choice: 喊叫
  rationale: 该未完成时描写持续展开的喊声。汉语结合“越发”的语境已可表达延续与升级，不必机械加入“不断”。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词与“喊叫”同时发生；“喊叫说”保留原文的话语引介结构，在现代汉语中也清楚自然。
- source_word: Σταυρωθήτω
  choice: 让他被钉十字架
  rationale: 第三人称不定过去时被动命令式表达要求某事临到他身上。“让他被钉十字架”保留命令要求和被动形式，虽较“把他钉十字架”更贴近原文结构。
- source_word: ὁ δὲ ... οἱ δὲ
  choice: 他却……众人却……
  rationale: 两处δέ都带出转折和对比；重复“却”凸显彼拉多的质问与群众要求之间的对立。“众人”按上下文补明复数代词所指。
theological_decisions:
- issue: 群众要求钉十字架时被动命令式的呈现
  choice: 让他被钉十字架
  alternative: 把他钉十字架
  rationale: 原文σταυρωθήτω是第三人称被动命令式。正文保留被动形式和命令力量，避免把句法不必要地改成主动，也不由译者指定执行者；脚注同时提供更惯用的汉语表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“究竟”呈现质问语气；“恶事”保留道德力度；“越发喊叫”体现群众反应的升级。正文尽量保留钉十字架命令的被动形式，并以脚注交代更惯用的主动表达。
