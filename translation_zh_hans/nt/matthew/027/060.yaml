  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: zh_hans
  text: 把遗体安放在他自己的新墓穴里；这墓穴是他在岩石中凿成的。然后，他把一块大石头滚到墓穴入口处[a]，就离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“墓穴门口”。希腊语θύρα可指“门”或“入口”；这里按岩石中凿出的墓穴这一语境译为“入口处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: 把遗体安放
  rationale: τίθημι表示放置；本节所指的是耶稣的遗体。译作“安放”自然庄重，并避免汉语“把它放”指代生硬。
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: 在他自己的新墓穴里
  rationale: μνημεῖον在此指岩石中凿出的安葬之处，译作“墓穴”贴合场景；καινός直译为“新”，不擅自增译为“从未使用过”；αὐτοῦ用“他自己的”体现所属。
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: 这墓穴是他在岩石中凿成的
  rationale: λατομέω指在石中开凿；“凿成”既表达动作，也自然表明墓穴此前已经修成。ἐν τῇ πέτρᾳ保留为“在岩石中”，不额外限定具体工法。
- source_word: προσκυλίσας λίθον μέγαν
  choice: 把一块大石头滚到
  rationale: προσκυλίω表示滚动某物至某处；不定过去时分词表示此动作先于“离开”。“然后”清楚呈现叙事次序。λίθον μέγαν直译为“一块大石头”。
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: 墓穴入口处
  rationale: θύρα可指门或入口。岩石墓穴语境下，“入口处”比容易使人联想到现代铰链门的“门”更清楚，同时以脚注保留词义可能性。
- source_word: ἀπῆλθεν
  choice: 就离开了
  rationale: ἀπέρχομαι在此单纯表示离去；“就离开了”符合现代汉语叙事，也承接此前滚石的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“墓穴”准确体现岩石中凿出的安葬空间；“遗体”使αὐτό在单节呈现时指代清楚。分句处理保留原文动作顺序，并避免过度古雅的措辞。
