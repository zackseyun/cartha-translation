  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: zh_hans
  text: 因此，那块地至今仍被称为“血田”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 表示由前文所述买地及其命名缘由得出的结果；“所以”在现代汉语中自然、清楚。
- source_word: ἐκλήθη
  choice: 还叫
  rationale: 该词是 καλέω 的简单过去时被动形式，意为“被称为／被命名为”。结合“直到今天”，译作“还叫”自然表达这一名称从过去沿用至作者写作之时。
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: 那块地
  rationale: ἀγρός 指田地，ἐκεῖνος 为指示词；量词“块”符合现代汉语习惯，并与后面的地名形成词语呼应。
- source_word: Ἀγρὸς Αἵματος
  choice: 血田
  rationale: 这是由“田”和“血”的属格结构组成的地名。“血田”简洁、自然，并保留名称的叙事力度。
- source_word: ἕως τῆς σήμερον
  choice: 直到今天
  rationale: 忠实表达该名称一直沿用到作者当时；这是清楚而自然的现代汉语说法。
