  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: zh_hans
  text: 他们戏弄完耶稣，就脱下他身上的斗篷，给他穿回自己的衣服，然后把他押去钉十字架。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέπαιξαν αὐτῷ
  choice: 戏弄完耶稣
  rationale: ἐμπαίζω表示带有侮辱性的嘲弄；“戏弄”在现代汉语中自然，也保留了残酷羞辱的意味。以“完”表达ὅτε加不定过去时在叙事中的先行动作。此处明确说“耶稣”，避免连续代词造成指代不清。
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: 脱下他身上的斗篷
  rationale: ἐκδύω指脱去衣物，χλαμύς指斗篷式外衣，常可指军用或官式短斗篷；“脱下他身上的斗篷”符合汉语表达，并保留原文所指的具体衣物。
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: 给他穿回自己的衣服
  rationale: ἐνδύω表示给人穿衣，ἱμάτια是一般性的复数“衣服”；“穿回”自然呈现先前被脱下、现在恢复原衣的语境，而“自己的”明确表达αὐτοῦ，并与斗篷形成对照。
- source_word: ἀπήγαγον αὐτὸν
  choice: 把他押去
  rationale: ἀπάγω可指带走、押走；在士兵看押囚犯的场景中，“押去”比普通的“带走”更准确，也简洁自然。
- source_word: εἰς τὸ σταυρῶσαι
  choice: 钉十字架
  rationale: εἰς加冠词化不定式表达目的；汉语“押去钉十字架”直接自然，并清楚表达他们带走耶稣的目的。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。译文保持原句动作次序，以“戏弄完……就……”呈现时间关系；不增加原文未明说的神学解释。χλαμύς直译为“斗篷”，因此无需另设词义脚注。
