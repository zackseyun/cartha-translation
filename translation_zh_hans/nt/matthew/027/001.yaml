id: MAT.27.1
reference: Matthew 27:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: zh_hans
  text: 天亮以后[a]，所有祭司长和百姓的长老就如何处死耶稣一事进行了商议[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了早晨。”
    reason: lexical_alternative
  - marker: b
    text: “进行了商议”也可译为“共同商议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: 到了早晨
  rationale: 以自然的时间从句表达属格独立结构所标示的场景转换；δέ由语句推进自然体现，不另译。
- source_word: συμβούλιον ἔλαβον
  choice: 一同商议
  rationale: 保留共同磋商、谋议的含义，也符合此处正式的司法语境；不预先解释为已经作出决定。
- source_word: πάντες
  choice: 所有
  rationale: 明确保留原文对参与领导群体之全面性的强调。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是福音书中指耶路撒冷祭司领导阶层的通行、准确译法，避免误解为多位大祭司。
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: 百姓的长老
  rationale: 保留正式领导职称及属格关系，现代汉语中清楚自然。
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: 由全句的致死目的体现敌对指向
  rationale: κατά加属格在本语境中带敌对意义；汉语若硬译“针对耶稣商议”略显生硬，而“要处死耶稣”已清楚显出商议所针对的对象与敌意。
- source_word: ὥστε
  choice: 要
  rationale: 在“商议”之后自然表达不定式结构所含的目的或预期结果，同时保留目的与结果之间的语义张力。
- source_word: θανατῶσαι αὐτόν
  choice: 处死耶稣
  rationale: 符合正式司法语境，比“杀死”庄重，又不像“执行死刑”那样过度具体化法律程序；重复姓名可避免汉语代词指向含混。
theological_decisions:
- issue: 宗教领袖对耶稣之行动的性质
  choice: 译为共同商议并以处死耶稣为目标
  alternative: 译作较弱的“商议有关耶稣的事”，或较强的“密谋杀害耶稣”
  rationale: 原文κατά明确具有敌对指向，θανατῶσαι明确指向死亡；但συμβούλιον ἔλαβον本身未必要求“密谋”的隐秘、阴谋色彩，因此采用“商议”，既呈现敌意与致死目标，又不增添原文未明说的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“到了早晨”自然衔接前文；“祭司长”“百姓的长老”“处死”保持司法场景的正式感。所有脚注标记均置于正文相应词语之后。
