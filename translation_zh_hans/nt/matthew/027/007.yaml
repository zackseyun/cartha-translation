  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: zh_hans
  text: 他们商议后，便用那些银币[a]买下了“陶匠田”，作为安葬外来人[b]的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从它们中”；按上文是指那些银币。
    reason: lexical_alternative
  - marker: b
    text: 或译“陌生人”或“外乡人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: 商议之后
  rationale: 该惯用语直译为“作了商议”，这里以“商议之后”自然表达共同筹议以及分词所表示的先行动作。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要承接前文、推进叙事，并非表示强烈转折；“于是”符合现代汉语叙事习惯。
- source_word: ἠγόρασαν
  choice: 买下了
  rationale: 准确表达不定过去时主动直陈语气，并以“买下”体现交易已经完成。
- source_word: ἐξ αὐτῶν
  choice: 用那些银币
  rationale: 原文直译为“从它们”，中性复数代词按紧接的上文指那些银币；汉语需明确其工具或资金意义，故译为“用那些银币”，并以脚注保留原文字面形式。
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: “陶匠田”
  rationale: 简洁保留属格结构所形成的地名含义，即与陶匠相关的那块田；引号表明它在叙事中作为特定名称使用。
- source_word: εἰς ταφὴν
  choice: 作为安葬……的地方
  rationale: εἰς在这里表达用途或目的；该译法比生硬的“为了埋葬”更符合现代汉语。
- source_word: τοῖς ξένοις
  choice: 外乡人
  rationale: ξένοις在此可指外来者、非本地人，也可较宽泛地指陌生人；“外乡人”适合墓地使用的语境，同时用脚注保留另一可能。
theological_decisions:
- issue: αὐτῶν所指为何
  choice: 按上下文理解为犹大退回的那些银币，译作“用那些银币”
  alternative: 较贴字面可译为“从那些东西中”，但汉语含义不清
  rationale: 前文明确提到银币，中性复数代词与之呼应。译文说明其所指，却不增添有关祭司行为动机的推论。
- issue: ξένοις所指人群的范围
  choice: 译作“外乡人”
  alternative: 可译作“陌生人”或“外来人”
  rationale: 原词本身可能强调外来、非本地或素不相识，译文依安葬场所的语境采用“外乡人”，同时用脚注保留词义宽度，不把它限定为特定民族或法律身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“商议之后”“买下了”清楚呈现事件次序；“陶匠田”作为特定地点名称加引号。译文避免把ξένοις过度限定为具有现代国籍意义的“外国人”。
