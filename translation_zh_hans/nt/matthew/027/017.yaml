reference: Matthew 27:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: zh_hans
  text: 众人聚集之后，彼拉多问他们：“你们要我给你们释放哪一个？耶稣·巴拉巴[a]，还是那称为弥赛亚的耶稣[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本仅作“巴拉巴”，没有“耶稣”。
    reason: textual_variant
  - marker: b
    text: 或译“基督”。希腊语Christos在这里是一个称号，因此正文译作“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: 众人聚集之后
  rationale: 该属格独立结构表达先于彼拉多发问而完成的动作；“之后”自然体现时间关系。οὖν在此主要推进叙事，汉语无需另加生硬的“所以”。
- source_word: Τίνα θέλετε ἀπολύσω ὑμῖν
  choice: 你们要我给你们释放哪一个
  rationale: τίνα在两个具体人选之间提出选择，译作“哪一个”；ἀπολύσω在司法语境中指释放被拘押者，不含“赦免”必有的定罪意味。
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: 耶稣·巴拉巴
  rationale: 依照SBLGNT正文保留Ἰησοῦν，以呈现两个都名叫“耶稣”的人之间的鲜明对照；中点帮助现代中文读者辨识这是一个人的名字。
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: 那称为弥赛亚的耶稣
  rationale: λεγόμενον客观表示“称为”，不增添“所谓”可能带有的轻蔑色彩；χριστός在这里显然作为称号使用，译为“弥赛亚”。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处χριστός由“称为”引出，功能上是称号，而非姓名的一部分；“弥赛亚”保留其受膏者称号的性质，同时在脚注列出传统译法“基督”。
- issue: 巴拉巴之前是否有“耶稣”
  choice: 正文采用“耶稣·巴拉巴”
  alternative: 仅作“巴拉巴”
  rationale: 所提供的SBLGNT正文含Ἰησοῦν，应在正文中如实翻译；抄本差异则以脚注保留，不擅自消除文本问题。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“众人聚集之后”简洁呈现叙事背景；问句保持彼拉多让群众在两人之间选择的直接语气。所有脚注标记均紧接其所说明的词语。
