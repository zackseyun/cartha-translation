  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: zh_hans
  text: 总督回答他们说：“这两个人中，你们要我释放哪一个给你们？”他们说：“巴拉巴。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: 总督问他们
  rationale: 希腊文采用“回答……说”的惯用结构，引出彼拉多针对现场情形所作的回应。汉语用“问他们”自然承载其发问功能，避免生硬重复为“回答他们说”，而“总督”准确反映此处罗马行省长官的身份。
- source_word: Τίνα θέλετε ἀπὸ τῶν δύο
  choice: 这两个人中，你们要……哪一个
  rationale: Τίνα 与 ἀπὸ τῶν δύο 表示在两个既定人选之间作选择；“这两个人中……哪一个”是清楚自然的现代汉语。θέλετε 在此表达意愿或选择，译作“要”保持问题的直接性。
- source_word: ἀπολύσω ὑμῖν
  choice: 我释放哪一个给你们
  rationale: ἀπολύω 在司法语境中指释放、放走。第一人称虚拟式受 θέλετε 支配，汉语自然表达为“你们要我释放……”。ὑμῖν 保留为“给你们”，体现这次释放是按他们的选择而施予。
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ 在此主要推进叙事、引出群众回答，现代汉语无需机械译出连接词；“他们说”简洁而忠实。
- source_word: Τὸν Βαραββᾶν
  choice: 巴拉巴
  rationale: 按现代中文圣经人名惯例音译 Βαραββᾶς；宾格冠词不需另行表达。
