  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: zh_hans
  text: 众人都回答说[a]：“他的血归到我们和我们的儿女身上！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指当时现场聚集的人群；这句话不应被理解为把永久的罪责归给历世历代所有犹太人。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 回答说
  rationale: 分词与限定动词连用，按希腊语习惯引出回应；“回答说”在现代汉语中自然，也保留了回应的意味。
- source_word: πᾶς ὁ λαὸς
  choice: 众人都
  rationale: 表达该场景中聚集者整体作答的集体含义；比“全体人民”更符合具体叙事情境，同时不把所指扩大为跨时代的整个族群。
- source_word: Τὸ αἷμα αὐτοῦ
  choice: 他的血
  rationale: 保留原文简洁而带司法色彩的“血”这一意象，不在正文中明说其隐含的死亡责任或流血罪责。
- source_word: ἐφ’ ἡμᾶς
  choice: 归到我们……身上
  rationale: 希腊文此处省略动词；补出“归到”可自然表达承担后果或责任的祈使、甘愿承受语气，又不把含义解释得过满。
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: 和我们的儿女身上
  rationale: τέκνα直译为“儿女”，不扩展为“后代”；与前一介词短语共同受“归到”支配，形成自然的汉语并列结构。
theological_decisions:
- issue: πᾶς ὁ λαὸς可能被误读为对所有世代犹太人的定罪
  choice: 正文按叙事情境译为“众人都”，脚注说明所指是当时现场聚集的人群。
  alternative: 译作“全体百姓”或“整群人”。
  rationale: 原文描述的是该场景中聚集者的集体回应；译文既不应削弱其整体性，也不应将其扩大为针对所有犹太人及其历代后裔的永久罪责。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“众人都回答说”适合叙事语体；引语以感叹号呈现其强烈、甘愿承担的语气。脚注标记紧接相关叙述。
