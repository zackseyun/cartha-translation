reference: Matthew 27:64
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: zh_hans
  text: 所以，请下令确保坟墓安全，直到第三天，免得他的门徒来[a]把他偷走，又对百姓说：“他已经从死人中复活了[b]。”这样，最后的骗局会比前一个更糟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“来”之后加上“夜里”，成为“免得他的门徒夜里来把他偷走”。这里采用较短的读法。
    reason: textual_variant
  - marker: b
    text: 希腊语为被动式，也可译作：“他已经从死人中被复活了。”原文没有明说是谁使他复活。
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: 请下令
  rationale: 这是要求彼拉多采取明确官方行动的命令式；汉语加“请”符合向掌权者提出请求的语境，而“下令”保留其权威性。
- source_word: οὖν
  choice: 所以
  rationale: 表明本节请求是由前文所述耶稣关于第三日复活的话推导而来；“所以”自然并清楚地保留逻辑关系。
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: 把坟墓严密守住
  rationale: 表达使坟墓处于安全、无法被擅动的状态；“守住”不把具体方式仅限于封印，也与下文采取的看守措施相符。
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: 直到第三天
  rationale: 保留原文时间表达，并与前文关于第三日的预告相呼应。
- source_word: μήποτε
  choice: 免得
  rationale: 自然表达说话者想要防止的可能情况。
- source_word: κλέψωσιν αὐτὸν
  choice: 把他偷走
  rationale: 保留原文以“他”而非明说“尸体”为宾语；“偷走”在现代汉语中自然表达将其移走。
- source_word: τῷ λαῷ
  choice: 对百姓
  rationale: λαός指一般民众，不只是当场聚集的人群；“百姓”在庄重叙事中自然明确。
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: 他已经从死人中复活了
  rationale: 采用现代汉语最自然的复活表述；完成体“已经……了”表达既成事件。希腊语的被动形式在脚注中注明，以免在生硬直译与自然汉语之间悄然消除原文语态信息。
- source_word: ἡ ἐσχάτη πλάνη
  choice: 后一个骗局
  rationale: 在与“前一个”对比的语境中，“后一个”比直译“末后的”更自然；“骗局”表达他们所指控的欺骗性主张。
- source_word: χείρων τῆς πρώτης
  choice: 比前一个更糟
  rationale: 直接保留比较结构，同时不替说话者具体界定所谓前后两次欺骗。
theological_decisions:
- issue: 复活宣称中的被动语态
  choice: 正文作“他已经从死人中复活了”，脚注说明希腊语为被动
  alternative: 他已经从死人中被复活了
  rationale: 希腊语Ἠγέρθη是被动式，可能暗含上帝是使其复活者，但原文没有明说施事者。中文“被复活”虽形式对应，却较生硬；正文采用自然说法，同时以脚注保留语态及其神学张力，不明添施事者。
- issue: 所谓“后一个骗局”与“前一个骗局”的所指
  choice: 保留未解释的比较说法
  alternative: 把两者明确解释为复活宣称与耶稣先前的弥赛亚宣称
  rationale: 原文没有界定两者具体所指；不在译文中加入某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请下令”符合向彼拉多陈情的语境；“严密守住”自然表达确保坟墓安全而不过度限定具体手段。引语和因果推进清楚，避免古奥措辞。
