id: MAT.27.4
reference: Matthew 27:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: zh_hans
  text: 说：“我犯了罪，出卖了无辜者的血。”他们却说：“这与我们何干？你自己负责吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“你会看着办。”这里是推卸责任的说法，意为“这是你自己的事”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: 我犯了罪
  rationale: 不定过去时在认罪陈述中自然译为“犯了罪”，既指向已经发生的行为，也保留当前承担罪责的语气。
- source_word: παραδοὺς
  choice: 出卖了
  rationale: 分词说明所犯之罪的行为或缘由；结合犹大把耶稣交给当局的叙事语境，“出卖”比字面的“交出”更准确自然。
- source_word: αἷμα ἀθῷον
  choice: 无辜者的血
  rationale: 保留“血”的圣经法律—道德意象，同时用“无辜者的”清楚表达形容词ἀθῷον所指的无罪身份，不明说所指就是耶稣。
- source_word: Τί πρὸς ἡμᾶς;
  choice: 这与我们何干？
  rationale: 这是推卸关切和责任的惯用语；该译法简洁、自然，并保留原话冷漠的反问语气。
- source_word: σὺ ὄψῃ
  choice: 你自己负责吧
  rationale: 直译近于“你会看着办”；在此未来时具有命令式、推卸责任的语用功能。“你自己负责吧”自然传达其生硬的打发语气，重音代词σὺ由“你自己”体现。
theological_decisions:
- issue: 是否明说无辜者是耶稣
  choice: 不补出“耶稣”，仅译作“无辜者的血”
  alternative: 我出卖了耶稣这无辜者，犯了罪
  rationale: 希腊文以“无辜的血”表达，所指虽由上下文明确，正文却没有名字；不增补可保存原文的凝练和法律—道德张力。
- issue: 祭司长对责任的回应是陈述未来还是命令式打发
  choice: 按语境译为“你自己负责吧”
  alternative: 你会看着办
  rationale: ὄψῃ形态上是未来时，但该表达在这里惯用地承担“你自己处理”的命令式功能；正文优先传达语用意义，脚注保留较直译形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与我们何干”保留简洁有力的反问；“你自己负责吧”呈现祭司长冷漠、推卸责任的口吻。脚注标记紧随相关句子。
