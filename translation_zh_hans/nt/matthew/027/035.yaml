  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: zh_hans
  text: 他们把他钉在十字架上之后，就抽签分了他的衣服。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文句式：“他们把他钉在十字架上后，便分了他的衣服，抽签决定。”
    reason: 保留希腊文分词结构较形式对应的表达，并呈现“抽签”作为分配衣物的方式。
lexical_decisions:
- source_word: σταυρώσαντες
  choice: 把他钉在十字架上之后
  rationale: 不定过去时分词所表达的动作先于主句动作；用“……之后”自然地保留了先钉十字架、后分衣服的叙事顺序。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里是轻微的叙事连接词；汉语以“就”承接前项时间结构并推进叙事，比机械译作“而”更自然。
- source_word: διεμερίσαντο
  choice: 分了
  rationale: 该动词指分开、分配；“分了”准确、简洁，适合衣物这一具体对象。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 他的衣服
  rationale: ἱμάτια泛指衣物；现代汉语“衣服”清楚自然，而“外衣”在此可能过度限定。
- source_word: βάλλοντες κλῆρον
  choice: 抽签
  rationale: 该分词短语说明分衣服所采用的方式。汉语惯用语“抽签”自然表达以签决定归属的做法，也无需拘泥于κλῆρον的单数形式。
theological_decisions:
- issue: 分词短语βάλλοντες κλῆρον与主句动词διεμερίσαντο的关系
  choice: 译作“就抽签分了他的衣服”，将抽签明确呈现为分衣服的方式。
  alternative: “就分了他的衣服，并且抽签”或“就分了他的衣服，抽着签”
  rationale: 希腊文分词自然修饰主句动词，说明他们如何分配衣服；汉语把“抽签”置于“分”之前，清楚表达手段关系，不增添额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“钉在十字架上”完整表达σταυρόω；“抽签分了”符合现代汉语语序。正文中的脚注标记置于句末。
