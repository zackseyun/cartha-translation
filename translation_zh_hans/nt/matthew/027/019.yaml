  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: zh_hans
  text: 他正坐在审判席上时，他妻子派人给他传话说：“不要与那个义人有任何牵连[a]，因为我今天在梦中因他受了许多苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那个无辜的人”。希腊语该词可指“公义的、正直的”，在司法语境中也可指“无罪的、无辜的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: 他正坐……的时候
  rationale: 以进行性的时间从句表达属格独立结构，保留与主句动作同时发生的背景情形。
- source_word: ἐπὶ τοῦ βήματος
  choice: 坐在审判席上
  rationale: βῆμα在本段司法语境中指官员施行审判时所坐的正式座位；“审判席”准确而易懂。
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: 他妻子派人给他传话说
  rationale: 原文表示妻子差遣人向他传达信息；“派人给他传话”自然地补出汉语所需的传递方式，却未具体指明使者身份。
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: 不要插手那个义人的事
  rationale: 这是一个省略式惯用语，意为不要与此事发生牵连或介入其中；“不要插手……的事”在审判语境中清楚自然。
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: 那个义人
  rationale: “义人”保留δίκαιος的道德和宗教语义，同时在审判语境中也可含无罪、无辜之意；后者列入脚注。
- source_word: πολλὰ γὰρ ἔπαθον
  choice: 因为……受了许多苦
  rationale: πολλὰ πάσχω是“受许多苦、深受折磨”的表达；此译法保留程度，并以“因为”表达γάρ所引出的理由。
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: 我今天在梦中因他
  rationale: “在梦中”自然表达κατ’ ὄναρ所指的梦境经历，“因他”直接保留διά加宾格所表达的原因。
theological_decisions:
- issue: 如何翻译指耶稣的δίκαιος
  choice: 义人
  alternative: 无辜的人；正直的人
  rationale: “义人”保留马太叙事中兼具道德分量的用词，不把妻子的判断仅限缩为法律上的无罪；同时，审判语境下“无辜的人”确属可能含义，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语体。“派人给他传话”符合当代汉语表达；引语中的“不要插手”传达紧迫警告，又避免生硬直译希腊语省略式惯用语。
