review_pass:
  verdict: revise
  source_fidelity: 整体忠实反映原文的时间背景、司法审判席、妻子传话、对“义人”的称呼，以及梦中因他受苦。惟“不要插手那个义人的事”在现代汉语中较容易理解为不要干预该人的私事，或不要介入本不相干的事；在本处审判场景中，原文惯用语是劝彼拉多不要与此人／对此人的案件有牵连。
  naturalness: “他正坐在审判席上的时候”略显重叠；改为“他正坐在审判席上时”更简洁自然。“不要与那个义人有任何牵连”既是自然的现代汉语，也较好保留原文省略惯用语的宽泛性，不把具体行动过度限定为“插手”。其余措辞庄重、通顺。
  terminology: “审判席”准确对应司法语境中的βῆμα。“义人”可保留δίκαιος的道德分量，且脚注适当说明在司法语境下“无辜的人”这一可能译法。脚注说明宜将词义表述为形容词性“公义的、正直的”，避免把词典义误写成抽象名词。
  issues:
  - severity: medium
    issue: “不要插手那个义人的事”可能误导原文惯用语的含义。
    rationale: μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ字面是“你和那义人之间不要有任何事”，在此是劝彼拉多不要卷入、不要与他有牵连。中文“插手……的事”可偏向不相干地干预他人事务，未充分体现对审判案件的抽身警告。
  - severity: low
    issue: 开头时间结构稍显冗余。
    rationale: “正……的时候”虽不算错误，但“正坐在审判席上时”在现代书面叙事中更凝练。
