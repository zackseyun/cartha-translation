revisions:
- from: 他正坐在审判席上的时候，他妻子派人给他传话说：“不要插手那个义人的事[a]，因为我今天在梦中因他受了许多苦。”
  to: 他正坐在审判席上时，他妻子派人给他传话说：“不要与那个义人有任何牵连[a]，因为我今天在梦中因他受了许多苦。”
  rationale: 修订“不要插手那个义人的事”为“不要与那个义人有任何牵连”，以更准确、自然地传达原文的省略惯用语，同时不把其含义狭窄化为某一种具体司法程序。“正坐在审判席上时”改善行文节奏。脚注仅作措辞校正，保留“无辜的人”的合法词汇替代及其司法语境说明。
