  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: zh_hans
  text: 他把那些银钱扔进圣所[a]，就离开了；随后去上吊自尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”指圣殿内的核心建筑；希腊文用的是ναός，而不是泛指整个圣殿区域的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: 把……扔进
  rationale: 不定过去时分词表示先于主要动作发生的伴随动作；汉语按事件次序自然表达，无须另加“之后”。
- source_word: τὰ ἀργύρια
  choice: 那些银钱
  rationale: ἀργύρια字面指“银子、银钱”，上下文中是犹大退还的那笔报酬；“那些”承接前文，同时不额外限定为某种硬币。
- source_word: εἰς τὸν ναὸν
  choice: 进圣所
  rationale: ναός在圣殿语境中通常特指圣殿建筑的核心圣所，而非整个圣殿区域；正文采用“圣所”以直接保留这一词义。
- source_word: ἀνεχώρησεν
  choice: 离开了
  rationale: 该动词表示离去或退开；“离开了”是现代汉语中自然、庄重且准确的表达。
- source_word: ἀπελθὼν
  choice: 随后出去
  rationale: 保留其与ἀνεχώρησεν相区别的第二个移动表达，同时用“随后”呈现动作衔接，避免汉语生硬重复。
- source_word: ἀπήγξατο
  choice: 上吊自尽
  rationale: 中间语态表明动作施于自身；此处通常指以悬吊方式自杀，“上吊自尽”清楚而不含混。
theological_decisions:
- issue: ναός是泛指圣殿还是特指圣所
  choice: 正文译作“圣所”
  alternative: 译作“圣殿”，并以脚注说明也可指圣所
  rationale: 希腊文使用ναός而非通常表示整个圣殿区域的ἱερόν。直接译为“圣所”更精确，同时脚注说明它是圣殿内的核心建筑，避免读者误解为其他圣所。
- issue: ἀπήγξατο所指的死亡方式
  choice: 上吊自尽
  alternative: 勒死自己
  rationale: 该词可从词源层面涉及勒缢，但在此叙事语境中标准且最可能的意义是上吊自杀；此译法不引入额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“银钱”比“银子”更明确地表达此处作为钱款的白银；分号划分离开圣所与随后自尽两个动作阶段。
