  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: zh_hans
  text: 到了傍晚，来了一个财主，是从亚利马太来的，名叫约瑟；他自己也成了耶稣的门徒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他自己也被收为耶稣的门徒”，或“他自己也是耶稣的门徒”。
    reason: 保留ἐμαθητεύθη这一被动形式可能具有的不同侧重：成为门徒、被收为门徒，或处于门徒身份。
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 到了傍晚
  rationale: 这是属格独立结构，表示时间推进；“到了傍晚”自然传达傍晚来临后的叙事转折。δέ的轻微承接作用由汉语语序和上下文体现，无须另加明显连接词。
- source_word: ἦλθεν
  choice: 来
  rationale: ἔρχομαι的简单过去时，在叙事中直译为“来”最自然；与“从亚利马太来的”结合，汉语表达清楚。
- source_word: ἄνθρωπος πλούσιος
  choice: 一个财主
  rationale: “财主”是现代汉语中简洁而庄重的表达，准确指富有的人，也符合马太福音的叙事语体。
- source_word: ἀπὸ Ἁριμαθαίας
  choice: 从亚利马太来的
  rationale: ἀπό表示来源地，“从……来的”清楚保留其出处含义。
- source_word: τοὔνομα Ἰωσήφ
  choice: 名叫约瑟
  rationale: 这是自然的现代汉语姓名介绍方式，保留原文的识别功能。
- source_word: ὃς καὶ αὐτὸς
  choice: 他自己也
  rationale: “也”保留καί所表示的追加关系，“自己”保留αὐτός的强调，表明约瑟也属于耶稣的门徒之列。
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: 成了耶稣的门徒
  rationale: μαθητεύω的被动形式可表示被收为门徒或成为门徒；此译法在汉语中自然，并保留进入门徒身份的结果意义，而不武断限定其成为门徒的具体方式。
theological_decisions:
- issue: ἐμαθητεύθη与耶稣的关系
  choice: 成了耶稣的门徒
  alternative: 被耶稣收为门徒；也是耶稣的门徒
  rationale: 被动形式可能着重“被造就为门徒”，也可能在此语境中表示“成为门徒”。正文采用不刻意限定施动方式的表达，既说明约瑟归属耶稣的门徒群体，也不把原文含义收窄为必然由耶稣亲自训练。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“财主”简洁自然；分号使人物介绍与门徒身份说明层次清楚。脚注标记[a]已置于正文相关分句之后。
