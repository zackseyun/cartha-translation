  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: zh_hans
  text: 同样[a]，祭司长也同经学家和长老一起嘲弄耶稣，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照样，祭司长、经学家和长老也嘲弄耶稣，说：”
    reason: “ὁμοίως καὶ”及伴随短语的语序可用不同的自然汉语结构表达；两种译法都表明这些领袖承接前文，同样参与嘲弄。
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 承接上一节的嘲弄场景，表明这些领袖也以相似的方式嘲弄耶稣；“同样”简洁自然，并保留比较意味。
- source_word: καὶ
  choice: 也
  rationale: 这里具有增添意味，把祭司长等人列入先前提到的嘲弄者之中；译作“也”比单纯的“和”更准确。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指居领导地位的祭司群体；“祭司长”是福音书语境中准确且通行的译法。
- source_word: ἐμπαίζοντες
  choice: 嘲弄耶稣
  rationale: 该分词表达带有侮辱性的讥笑；宾语“耶稣”虽在本节希腊文中省略，却由上下文清楚确定，中文补出可避免歧义。
- source_word: μετὰ
  choice: 同……一起
  rationale: μετά加属格在此表示共同参与，而非仅仅在场；这一译法清楚表明经学家和长老也参与嘲弄。
- source_word: γραμματέων
  choice: 经学家
  rationale: 指熟悉并讲授律法的文士阶层；“经学家”在现代汉语中较易理解，同时保留其群体身份。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 在此指犹太群体中获承认的领袖，而非泛指年长男子；“长老”保留其制度性含义。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊文未完成时可表示持续或反复的言说；中文叙事中“嘲弄……说”已自然呈现当时正在发生的动作，不必生硬增译“不断”。
theological_decisions:
- issue: 参与嘲弄者的范围
  choice: 祭司长、经学家和长老共同参与嘲弄耶稣。
  alternative: 祭司长在经学家和长老面前嘲弄耶稣，而后二者未必参与。
  rationale: μετά加属格在此最自然地表示共同参与；这一处理依据句法和叙事语境，不作额外的教义推断。
- issue: 分词ἐμπαίζοντες与主要动词ἔλεγον的关系
  choice: 译作“嘲弄耶稣，说”，将嘲弄视为引出后续话语的伴随动作。
  alternative: 译作“嘲弄耶稣，并且说”，将两者较明确地并列为两个动作。
  rationale: 希腊文以分词修饰主要动词，中文用“嘲弄……说”既自然，也较贴近其从属结构，同时不排除嘲弄包含言语和行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”比“文士”更便于普通现代读者理解；句末用冒号承接下一节的直接引语。
