  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: zh_hans
  text: 可是，祭司长和长老们说服群众要求释放巴拉巴，却要求杀死耶稣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“处死耶稣”。
    reason: 词义替代译法；说明ἀπολέσωσιν在本段司法语境中可具体指处死。
lexical_decisions:
- source_word: δὲ
  choice: 可是
  rationale: 承接上文并标明情节上的转折；“可是”自然体现这里的反意功能。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指耶路撒冷祭司阶层的领袖；“祭司长”是准确且通行的称呼。
- source_word: πρεσβύτεροι
  choice: 长老们
  rationale: 这里指公认的犹太领袖；保留其制度和历史含义，并以复数形式表达。
- source_word: ἔπεισαν
  choice: 说服
  rationale: 直接表达他们已经影响众人、使众人按其意图行事。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 指当时聚集的人群；现代汉语以“众人”表达最自然，虽未形式化呈现希腊语复数，群体意义仍清楚。
- source_word: ἵνα
  choice: 要他们
  rationale: 在“说服”之后引出劝说的内容和预期行动，符合现代汉语表达。
- source_word: αἰτήσωνται τὸν Βαραββᾶν
  choice: 要求释放巴拉巴
  rationale: 原文直译近于“要求巴拉巴”；结合彼拉多让众人选择释放一人的紧邻语境，汉语需补出“释放”才自然、明确。
- source_word: τὸν δὲ Ἰησοῦν
  choice: 却……耶稣
  rationale: 第二个 δέ 将巴拉巴和耶稣所受的不同处置鲜明对照，以“却”自然呈现。
- source_word: ἀπολέσωσιν
  choice: 除掉
  rationale: 该动词意为使人灭亡、毁灭；“除掉”既保留较宽的词义，又在司法处境中自然指向杀死耶稣。
theological_decisions:
- issue: 司法处境中 ἀπολέσωσιν 的译法
  choice: 除掉耶稣
  alternative: 处死耶稣
  rationale: 希腊语并非专门表示依法处决的技术用词，而是较宽泛地表示使人灭亡。正文用“除掉”保留这一词义范围，同时以脚注给出本处语境明确支持的“处死”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“要求释放巴拉巴”依据紧邻语境补出汉语所需的宾语动作；“除掉”避免把原文较宽的动词无提示地收窄为法律术语。脚注标记紧随其所说明的“耶稣”之后。
