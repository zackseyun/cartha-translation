  rationale: 修订以“杀死”清楚传达ἀπολέσωσιν在本段中的致死含义，避免“除掉”在现代汉语中的含混和委婉；以“却要求杀死耶稣”保留巴拉巴与耶稣之间的对照，并使两个行动都明确属于群众受说服后提出的诉求。保留“释放”是由紧邻上下文明确提供的必要汉语补足，未改变经文所述事件。
