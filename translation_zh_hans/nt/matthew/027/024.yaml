  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: zh_hans
  text: 彼拉多看见毫无成效，反而一场骚乱正在发生，就拿水来，当着众人的面洗手，说：“我对这血没有罪责[a]；你们自己看着办吧[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我从这血是无罪的。”这里的“血”指流血致死；这句话是彼拉多宣称自己不负其责任。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“你们自己负责吧”；直译：“你们自己会看见。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: 彼拉多见
  rationale: δέ在此推进叙事，不必机械译为“但是”；用“见”引出他观察后的行动，简洁自然。
- source_word: οὐδὲν ὠφελεῖ
  choice: 这样做毫无用处
  rationale: 希腊文直译近于“毫无益处”；语境所指是彼拉多平息局面的尝试无效。“这样做”补明隐含所指而不过度解释。
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: 反而要引起骚乱
  rationale: θόρυβος可指喧嚷、骚动或骚乱；此处局势正在恶化，“要引起骚乱”表达γίνεται所呈现的事态发展。
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: 就拿水来……洗手
  rationale: 按动作先后自然转成汉语连动结构，并保留公开洗手这一象征性动作。
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: 当着众人的面
  rationale: 表达动作是在群众面前公开进行，比生硬的空间直译更符合现代汉语。
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: 流这人的血，我没有罪
  rationale: “血”在此转喻此人的死亡及其责任。此译保留血的意象，也用自然汉语表达彼拉多声称自己不负流血之罪。
- source_word: ὑμεῖς ὄψεσθε
  choice: 你们自己负责吧
  rationale: 这里的将来中间形式是惯用语，意为“你们自己看着办/承担此事”；显著的ὑμεῖς用“你们自己”体现强调，“负责吧”明确其责任语境。
theological_decisions:
- issue: 彼拉多关于自己无罪的声明
  choice: 作为彼拉多本人的责任声明来翻译，不认定其声明客观成立
  alternative: 可更直译为“对于这血，我是无罪的”
  rationale: 直接引语只呈现人物的自我宣告；译文不替叙事作出彼拉多确实无罪的神学判断，保留其行动与声明之间的道德张力。
- issue: ὑμεῖς ὄψεσθε所表达的责任转移
  choice: 译为“你们自己负责吧”
  alternative: 可译为“你们自己看着办吧”或直译“你们自己会看见”
  rationale: 上下文表明彼拉多是在把处置及流血责任推给众人；“负责吧”传达该惯用语功能，但仍只是人物试图转移责任，并不证明责任真的完全转移。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“当着众人的面”“你们自己负责吧”符合普通读者的自然表达；保留“血”的圣经意象，并以脚注交代希腊文的字面形式和惯用意义。
