- from: 他连一句话也不回答他[a]，以致总督非常惊讶[b]。
  to: 他连一句话也没有回答总督，以致总督大为惊奇[a]。
  rationale: 为提高现代汉语的自然性和指代清晰度，将“回答他”改为“回答总督”，并以“没有回答”表达叙事中已发生的否定事件。脚注删去与正文意义近乎重复且将ῥῆμα夸张为“一个字”的替代说法，保留对“惊奇／惊讶”的有效词汇替代。
