source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: zh_hans
  text: 他连一句话也没有回答总督，以致总督大为惊奇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“总督非常惊讶。”
    reason: θαυμάζω可表达“惊奇、惊讶”；两种译法在此均传达总督强烈的诧异。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 该词虽为被动形态，实际作中动异相动词使用，意为“回答、回应”；“回答”直接、自然，并与宾语“他”搭配。
- source_word: αὐτῷ
  choice: 他
  rationale: 与“回答”搭配，表示回答的对象；按上下文指总督彼拉多，但原文使用代词，译文予以保留。
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: 连一句话也不
  rationale: 保留 οὐδὲ ἓν 的强调否定和 ῥῆμα 的通常含义“话、言语”；此处采用符合现代汉语习惯的结构，表达完全没有作答。
- source_word: ὥστε
  choice: 以致
  rationale: 明确表达由耶稣沉默所产生的结果，符合原文结果从句的功能。
- source_word: θαυμάζειν
  choice: 惊讶
  rationale: 在 ὥστε 后改用汉语限定动词结构；“惊讶”自然传达总督因其沉默而产生的强烈诧异。
- source_word: ἡγεμόνα
  choice: 总督
  rationale: 在罗马行省语境中指治理者、总督，此处具体为彼拉多；“总督”准确而不将专名增入正文。
- source_word: λίαν
  choice: 非常
  rationale: 自然表达强烈程度，对应原文的程度副词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连……也不”保留原文强调否定；“以致”清楚呈现结果关系。所有脚注标记均置于正文相关词句之后。
