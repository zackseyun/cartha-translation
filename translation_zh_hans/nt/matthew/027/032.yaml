  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: zh_hans
  text: 他们出去的时候，遇见一个古利奈人，名叫西门。他们强迫[a]这人背他的十字架[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“强征这人服役”。希腊文这个动词指掌权者强制征用某人服役。
    reason: lexical_alternative
  - marker: b
    text: 即耶稣的十字架。
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: 他们出去的时候
  rationale: 现在时分词在这里表示与主句同时发生的动作；“……的时候”自然保留其时间关系。δέ只是轻微承接叙事，不必另译为强转折词。
- source_word: εὗρον
  choice: 遇见
  rationale: 在行进途中碰到某人的语境中，“遇见”比字面的“找到”更符合现代汉语，同时保留εὑρίσκω在此处的基本意义。
- source_word: ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα
  choice: 一个古利奈人，名叫西门
  rationale: Κυρηναῖον说明此人的地域归属；“古利奈人”是简洁、通行的地名派生表达，ὀνόματι Σίμωνα自然译作“名叫西门”。
- source_word: τοῦτον
  choice: 这人
  rationale: 希腊文使用明确的指示代词，译作“这人”保留其回指和轻微强调，也符合庄重的叙事语体。
- source_word: ἠγγάρευσαν
  choice: 强迫
  rationale: 该动词指掌权者强征某人服役；“强迫”简洁表达其强制性，脚注补充“征用服役”的制度背景。
- source_word: ἵνα ἄρῃ
  choice: 背
  rationale: ἵνα加虚拟式表示目的；结合十字架游行的情境，αἴρω在汉语中自然译为“背”，同时涵盖拿起并负载的动作。
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: 他的十字架
  rationale: “十字架”准确对应σταυρός；保留αὐτοῦ的代词形式“他的”，不在正文中以专名替换，脚注说明其语境所指。
theological_decisions:
- issue: αὐτοῦ（“他的”）所指为何
  choice: 正文保留“他的十字架”，按上下文指耶稣的十字架
  alternative: 直接译作“耶稣的十字架”
  rationale: 叙事语境表明所指是耶稣，但希腊文使用代词。正文保留代词可忠实呈现原文形式，脚注则避免汉语读者误以为是西门自己的十字架。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“他们”承接上文执行押解的人员；“这人”保留希腊文指示代词的力度。脚注标记均紧随其所说明的词语。
