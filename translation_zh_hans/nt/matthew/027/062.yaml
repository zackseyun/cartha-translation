  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: zh_hans
  text: 第二天，就是预备日后的那一天[a]，祭司长和法利赛人聚集到彼拉多那里，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是在预备日之后。”希腊语这个词可指安息日前的预备日；若译作“星期五”，就比原文作了更多解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 该表达推进叙事时间；δέ仅有轻微连接作用，汉语无需另加“现在”或“于是”。
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: 也就是预备日后的那一天
  rationale: ἥτις在此引出解释性关系从句；译文自然说明这“第二天”是在预备日之后。
- source_word: παρασκευήν
  choice: 预备日
  rationale: 在犹太历法语境中通常指安息日前的预备日；不直接译成“星期五”，以免比原文更具体。
- source_word: συνήχθησαν
  choice: 聚集
  rationale: 该被动形式在这里具有不及物意义，表示众人聚到一起；“聚集”简洁自然。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 指居领导地位的祭司群体，并非多位“大祭司”；采用现代中文圣经语境中通行而准确的称呼。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用该犹太群体名称的标准中文音译。
- source_word: πρὸς Πιλᾶτον
  choice: 到彼拉多那里
  rationale: πρός与表示聚集的动词连用，可表达朝向某人或来到某人面前；此译法保留趋向含义且符合现代汉语。
- source_word: Πιλᾶτον
  choice: 彼拉多
  rationale: 采用该人名的标准中文译名。
