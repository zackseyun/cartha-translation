  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: zh_hans
  text: 有许多妇女在那里，从远处观看；她们从加利利跟随耶稣，服事他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“照料”或“供给”；希腊文动词可指实际的服务和支持。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ
  choice: 有许多妇女也在那里
  rationale: Ἦσαν为存在句，ἐκεῖ表示“在那里”；δέ是轻微连接词。结合上下文用“也”自然承接前文，并不过分强化转折。
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: 远远地观看
  rationale: ἀπὸ μακρόθεν表示空间上的距离，θεωροῦσαι表示持续注视；“远远地观看”简洁保留两者。
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: 她们……就跟随耶稣
  rationale: αἵτινες指明这些妇女的身份特征；ἀκολουθέω在现代汉语中自然译为“跟随”，耶稣作宾语。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利起
  rationale: ἀπό标示跟随行程的起点；“从加利利起”比单说“从加利利”更清楚地表达自该地开始并持续跟随。
- source_word: διακονοῦσαι αὐτῷ
  choice: 服事他
  rationale: διακονέω可指实际照料、供应和服务。“服事”在中文圣经语境中自然且庄重，又不把其含义限定为正式教会职分。
theological_decisions:
- issue: 妇女所作διακονοῦσαι的性质
  choice: 服事他
  alternative: 照料他／供给他
  rationale: 原词涵盖实际服务与支持，却未明确限定具体形式；“服事”保留其广度，不将这些妇女的角色缩减为家务，也不赋予后来制度化的职分含义。
- issue: 从加利利跟随与当前观看之间的时间关系
  choice: 从加利利起就跟随耶稣
  alternative: 从加利利跟随耶稣
  rationale: 不以汉语过去完成时作过度标记，而用“起就”自然表明跟随始于加利利，并先于当前受难场景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“远远地观看”保留持续旁观的画面；分号将现场所见与这些妇女的身份背景清楚连接。脚注标记置于相关词句之后。
