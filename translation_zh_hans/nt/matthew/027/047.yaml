  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: zh_hans
  text: 但站在那里的人中，有些人听见了，就说[a]：“这个人在呼唤以利亚。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为未完成时，也可理解为“正在说”或“不断地说”。
    reason: aspectual_alternative
  - marker: b
    text: 他们很可能把耶稣上一节的呼喊误听成是在呼唤以利亚。
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: 有几个
  rationale: 表示在场者中人数不详的一部分；“有几个”在现代汉语叙事中简洁自然。
- source_word: δὲ
  choice: 但
  rationale: 承接上一节并引出在场者对耶稣呼喊的反应，表达轻微转折。
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: 站在那里的人中
  rationale: 保留定冠词加完成时分词所描绘的在场者及其站立姿态。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 不定过去时分词表示先于主句发生的动作；所听见的内容可由上文自然补足。
- source_word: ἔλεγον
  choice: 就说
  rationale: 未完成时可描写当时正在发生的言说；汉语“就说”自然呈现听见之后的反应，而不强行夸大为反复说。
- source_word: ὅτι
  choice: 直接引语标点
  rationale: ὅτι引出言说内容，现代汉语用冒号和引号转为直接引语最自然。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用现代中文圣经传统中广为人知的先知名译法。
- source_word: φωνεῖ
  choice: 在呼唤
  rationale: 保留现在时所表达的当下动作；“呼唤”可指叫某人的名字、向其喊话或求其前来，不替在场者进一步判定具体意图。
- source_word: οὗτος
  choice: 这个人
  rationale: 保留指示代词的指向性，同时符合现代汉语表达。
theological_decisions:
- issue: 在场者的话是否应译成耶稣确实向以利亚求助
  choice: 按在场者的判断表述为“这个人在呼唤以利亚”
  alternative: 他在求以利亚来帮助他
  rationale: 原文只报告在场者听后所说的话，并未在本节直接说明其误听方式或给该话下神学判断；译文保留叙事张力。
- issue: φωνεῖ Ἠλίαν的关系应具体化为何种呼叫
  choice: 采用较宽泛的“呼唤以利亚”
  alternative: 呼求以利亚／叫以利亚来
  rationale: “呼唤”既可表达向某人喊叫，也可能含召唤意味，避免把原文未明说的求助或召来之意写进正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“站在那里的人中”保留现场画面；“这个人”保留οὗτος的指示意味。所有脚注标记均已置于正文。
