  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: zh_hans
  text: 说：“你这要拆毁圣殿、三天内把它建起来[a]的，救你自己吧！如果你是上帝的儿子，就从十字架上下来吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把它重建起来”。希腊文动词本身只是“建造”，不过这句嘲讽的上下文可能含有重建之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 还说
  rationale: 该现在分词承接上文叙事；“还说”自然体现 καί 的连接作用，并引出众人的嘲讽话语，无须在本节重复明说主语。
- source_word: Ὁ καταλύων
  choice: 你这要拆毁……的
  rationale: 带冠词的分词在这里用作直接称呼；“你这……的”既符合现代汉语，也传达嘲讽语气。“要拆毁”保留其对先前指控或言论的影射。
- source_word: καταλύω
  choice: 拆毁
  rationale: 用于建筑物时，“拆毁”比宽泛的“毁灭”更自然，也准确表达拆除、毁坏之意。
- source_word: ναός
  choice: 圣殿
  rationale: ναός 可特指圣所，但在这句针对耶路撒冷圣殿的嘲讽中，“圣殿”是普通读者最自然且准确的理解。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三天内
  rationale: 简明自然地表达限定在三天这一时段内完成的含义，同时保留原句的时间表述。
- source_word: οἰκοδομῶν
  choice: 把它建起来
  rationale: 原词本义是“建造”，宾语由前面的“圣殿”自然补出。“重建”虽符合语境推断，却比希腊文本表达得更明确，因此列入脚注。
- source_word: σῶσον σεαυτόν
  choice: 救救你自己吧
  rationale: 准确传达命令式和反身代词；叠用“救救”在现代汉语中自然，并适合这里的讥讽挑战。
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: 如果你是上帝的儿子
  rationale: 直接保留条件式挑战和“上帝的儿子”这一基督论称号，不削弱也不扩展其神学含义。
- source_word: κατάβηθι
  choice: 下来吧
  rationale: 自然表达对被举在十字架上的人所发出的向下移动命令。
- source_word: σταυρός
  choice: 十字架
  rationale: 这是受难叙事中标准、清楚且符合语境的现代汉语译法。
theological_decisions:
- issue: 在嘲讽语境中如何翻译 υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  alternative: 上帝之子
  rationale: “上帝的儿子”以普通现代汉语直接保留这一称号及其分量，也让嘲讽者对耶稣身份的挑战保持清楚；不因说话者的敌意而弱化或另加解释。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“你这……的”保留直接称呼中的嘲讽色彩；整句使用口语可懂但不过分随意的措辞。脚注标记紧随其所说明的“建起来”。
