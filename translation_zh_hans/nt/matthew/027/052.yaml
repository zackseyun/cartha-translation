  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: zh_hans
  text: 坟墓被打开了，许多已睡了[a]的圣徒的身体被兴起了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡了”是指“死了”的常用委婉说法。
    reason: 说明原文以睡眠指死亡的惯用表达。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接前文并连接同一叙事中的事件；“也”自然体现并列关系，又不额外限定严格的时间先后。
- source_word: τὰ μνημεῖα
  choice: 坟墓
  rationale: 指安葬死者之处；“坟墓”是现代汉语中自然、明确的对应词。
- source_word: ἀνεῴχθησαν
  choice: 被打开了
  rationale: 保留不定过去时被动语态，不增添打开的方式或行动者。
- source_word: πολλὰ σώματα
  choice: 许多……身体
  rationale: σῶμα直指“身体”；避免译成语气更强且带解释性的“尸体”。
- source_word: τῶν κεκοιμημένων
  choice: 已经睡了
  rationale: 保留以睡眠指死亡的常见委婉表达；“已经”体现希腊语完成时所表达的既成状态。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 作为名词使用时指属神的圣洁之人；“圣徒”保持新约术语的一致性，同时不擅自界定他们的具体身份。
- source_word: ἠγέρθησαν
  choice: 起来了
  rationale: ἐγείρω的被动形式在此可指从死亡中被兴起；“起来了”在上下文中自然，同时不像“复活了”那样预先界定这次事件的确切性质。
theological_decisions:
- issue: ἠγέρθησαν所描述事件的性质
  choice: 译为“起来了”
  alternative: 译为“复活了”
  rationale: 原词可用于复活，但本节本身没有进一步说明这些圣徒所经历之复活的性质；采用较中性的表达，保留上下文中的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式尽量贴近希腊文的两个并列被动事件；保留“身体”为语法主语，并用脚注解释“睡了”的死亡委婉义。
