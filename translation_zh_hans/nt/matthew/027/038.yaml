  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: zh_hans
  text: 随后，有两个强盗[a]和他一同被钉在十字架上，一个在右边，一个在左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强盗”也可译作“匪徒”；希腊语这个词可指使用暴力的劫掠者，在某些语境中也可能包括参与叛乱的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 随后
  rationale: 承接叙事中的下一事件；“随后”自然简洁，也保留时间推进关系。
- source_word: σταυροῦνται
  choice: 被钉十字架
  rationale: 保留现在时被动语态所呈现的生动叙事效果；汉语不必另加进行体标记。
- source_word: σὺν αὐτῷ
  choice: 和他一同
  rationale: 准确表达 σύν 加与格所表示的伴随关系，并自然连接共同受刑的场景。
- source_word: δύο λῃσταί
  choice: 两个强盗
  rationale: λῃστής通常指以暴力劫掠的人，也可译作“匪徒”；“强盗”是清楚、传统而不过度限定其政治身份的表达。
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: 一个在右边，一个在左边
  rationale: 按汉语习惯表达两人的相对位置，准确呈现原文左右对举的结构。
theological_decisions:
- issue: λῃσταί的身份
  choice: 译作“强盗”，不进一步指定其政治身份
  alternative: “匪徒”或“起义者”
  rationale: 该词可指暴力劫掠者，在某些语境中也可能涉及叛乱活动，但本节本身不足以断定他们必为政治起义者，因此不作过度诠释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随后”使事件推进自然；“被钉十字架”沿用普通读者熟悉且准确的表达。
