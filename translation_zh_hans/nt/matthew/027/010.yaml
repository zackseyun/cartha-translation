  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: zh_hans
  text: 他们用那些银钱买了陶匠的田[a]，正如主所吩咐我的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把那些银钱交出，用来取得陶匠的田。”
    reason: 说明原文ἔδωκαν αὐτὰ的基本义为“把那些给了／交出”，而εἰς τὸν ἀγρόν在此购置语境中可表示银钱用于取得这块田。
  - marker: b
    text: 原文保留先知话语中的第一人称“我”，没有按当前叙事语境改写。
    reason: 提示读者注意引文或用典中的第一人称形式及其张力。
lexical_decisions:
- source_word: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως
  choice: 又用那些银钱买了陶匠的田
  rationale: ἔδωκαν αὐτὰ字面为“把它们给了”，其中αὐτά承接上文的银钱；εἰς τὸν ἀγρόν在购置语境中表示钱款用于取得那块田。汉语若直译为“把那些给了陶匠的田”会含混不通，因此用“用那些银钱买了”自然表达交易用途，同时明确复数代词的所指。
- source_word: τοῦ κεραμέως
  choice: 陶匠的
  rationale: 属格结构自然译为领属关系“陶匠的”，不额外判定这田当时仍由陶匠拥有，还是仅以此为名称。
- source_word: καθὰ
  choice: 正如
  rationale: 保留比较和对应的语气，比单用“如”更清楚自然。
- source_word: συνέταξέν
  choice: 吩咐
  rationale: συντάσσω在此表示带权威的命令或指示；“吩咐”庄重而自然，既体现权威，也不像“命令”那样在汉语中显得过强。
- source_word: μοι
  choice: 我
  rationale: 保留希腊文第一人称单数，不按叙事语境改写或调和。
- source_word: κύριος
  choice: 主
  rationale: κύριος在此指主，按圣经汉语惯用表达译为“主”。
theological_decisions:
- issue: 引文或用典中的说话者人称
  choice: 保留“我”
  alternative: 按上下文改成“他们”或省去人称
  rationale: 希腊文明确使用μοι（“我／对我”）。保留第一人称可忠实呈现马太所引用或综合化用的先知话语，并保留其与当前叙事语境之间的张力，不在译文中替作者调和。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“那些银钱”明确承接上文；“买了”按购田语境作必要的汉语习惯化处理。脚注标记均置于正文相应位置。
