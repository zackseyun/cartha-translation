  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: zh_hans
  text: 于是，彼拉多释放了巴拉巴给他们；至于耶稣，鞭打了他[a]，就把他交出去钉十字架。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鞭打”指罗马人用鞭施行的刑罚，也可译作“笞打”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 既承接前文，也自然推进叙事，比单纯的时间表达更符合本节语境。
- source_word: ἀπέλυσεν αὐτοῖς
  choice: 给他们释放了
  rationale: 在司法语境中指释放囚犯；保留与格所表达的接受者或受益者含义。
- source_word: τὸν Βαραββᾶν
  choice: 巴拉巴
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: δὲ
  choice: 却
  rationale: 鲜明呈现巴拉巴获释与耶稣遭受处置之间的对比。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文的通行译名。
- source_word: φραγελλώσας
  choice: 鞭打后
  rationale: 不定过去时分词通常表示先于主要动词发生的动作；“鞭打”清楚表达罗马刑罚，也较“笞打”更易懂。
- source_word: παρέδωκεν
  choice: 交出去
  rationale: 表达把耶稣交由他人执行既定刑罚；补足汉语所需的趋向成分，但不擅自指明未在本句出现的接受者。
- source_word: ἵνα σταυρωθῇ
  choice: 叫人钉十字架
  rationale: 自然表达目的或预定结果，并借“叫人”体现希腊文被动语态，避免误解为耶稣亲自执行动作。
theological_decisions:
- issue: 耶稣受鞭打与被交出的先后次序及行动主体
  choice: 彼拉多先释放巴拉巴；耶稣受鞭打后，彼拉多把他交出去，叫人钉十字架。
  alternative: 彼拉多先把耶稣交出去，之后耶稣才受鞭打。
  rationale: φραγελλώσας是不定过去时分词，最自然地表示其动作先于主要动词παρέδωκεν；译文保留原文次序，不额外推断罗马司法程序。
- issue: ἵνα加虚拟语气的功能
  choice: 译作“叫人钉十字架”，涵盖目的以及预定结果的语义。
  alternative: 译作“好让他被钉十字架”或“交去钉十字架”。
  rationale: 原结构可着重目的，也可带有结果色彩；当前译法自然简洁，不对二者作过度区分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“却”突出人物命运的对照；“鞭打后”明确动作顺序。脚注标记置于整句末尾，对应“鞭打”一词。
