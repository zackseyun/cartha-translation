  rationale: 修订仅改善汉语句法和脚注锚点，并以较少使役色彩的表达对应原文“交出，使他被钉十字架”。“至于耶稣”自然承接δέ所引出的对照；“鞭打了他……就把他交出去”保留分词动作先于主要动词的关系。
