  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: zh_hans
  text: 彼拉多对他们说：“你们有一队守卫[a]。去吧，照你们知道的办法，确保坟墓安全[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带一队守卫去吧”，也可能是：“你们自己有守卫。”希腊文既可理解为彼拉多准许他们使用守卫，也可理解为他指出他们已有可用的守卫。
    reason: alternative_reading
  - marker: b
    text: 或译：“照你们知道的办法，把它弄稳妥。”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: 对他们说
  rationale: φημί是普通的叙事性言说动词，αὐτοῖς是间接宾语；译为“对他们说”自然、准确。
- source_word: Ἔχετε
  choice: 你们有
  rationale: 保留ἔχω现在时直陈语气最直接的字面意义，同时不在正文中断定这是准许领用守卫，还是指他们已有可用的守卫。
- source_word: κουστωδίαν
  choice: 守卫
  rationale: 该词借自拉丁语custodia，在此指负责看守的一队人；“守卫”简洁自然，也可兼指守卫人员整体。
- source_word: ὑπάγετε
  choice: 去吧
  rationale: 表达离去的命令；加语气词“吧”使彼拉多的指示在现代汉语中自然，但不削弱命令意味。
- source_word: ἀσφαλίσασθε
  choice: 把坟墓守牢
  rationale: 该中间语态命令式表示使某物稳妥、安全。上下文明确对象是坟墓；“守牢”既符合设置守卫的场景，也传达确保其牢靠的意思。
- source_word: ὡς οἴδατε
  choice: 照你们所知道的办法
  rationale: 尽量保留“按你们所知道的”这一表达，不将其过度解释为“尽你们所能”。
theological_decisions:
- issue: 彼拉多的Ἔχετε κουστωδίαν究竟是准许他们领一队罗马守卫，还是说他们已有自己的守卫
  choice: 正文译作“你们有守卫”
  alternative: “带一队守卫去吧”或“你们自己有守卫”
  rationale: 希腊文可理解为授权使用守卫，也可理解为指出已有守卫。正文采用较贴近形式且保持开放的译法，脚注列出两种可能，避免对相关历史问题作无根据的裁断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们有守卫”刻意保留原文的语用歧义；“把坟墓守牢”依上下文补明宾语，以避免汉语中的指代含混。
