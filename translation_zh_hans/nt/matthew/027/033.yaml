id: MAT.27.33
reference: Matthew 27:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: zh_hans
  text: 他们来到一个名叫各各他的地方（意思是“髑髅之地”）。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也就是所谓的‘髑髅之地’。”原文是在解释“各各他”这个名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: 他们来到
  rationale: 不定过去时分词在这里表示伴随叙事推进的时间背景；汉语用主句“他们来到”自然简洁，无须生硬译成“来到之后”。
- source_word: τόπον
  choice: 一个……地方
  rationale: τόπος通常指“地方”；原文无冠词，在此自然译作“一个……地方”。
- source_word: λεγόμενον
  choice: 名叫
  rationale: λέγω的被动分词在命名结构中意为“称为、名叫”；“名叫”适合现代汉语地名表达。
- source_word: Γολγοθᾶ
  choice: 各各他
  rationale: 这是闪语地名的希腊文音译，采用中文圣经传统中通行且易辨识的音译“各各他”。
- source_word: ὅ ἐστιν
  choice: 意思是
  rationale: 该解释公式为希腊语读者说明“各各他”这一名称的含义；“意思是”比直译“就是”更清楚地传达释义作用。
- source_word: Κρανίου Τόπος
  choice: 髑髅之地
  rationale: κρανίον意为“头骨、髑髅”，属格修饰τόπος“地方”；“髑髅之地”准确、凝练，并保留庄重语体。
- source_word: λεγόμενος
  choice: 在释义结构中不重复明译
  rationale: 原文重复“称为”，构成对地名的解释；汉语以括号中的“意思是”自然承载其功能，若再译“被称为”会显得累赘。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“髑髅”较“头骨”更符合地名的传统庄重语感；括号保留原文解释性插语的功能。
