  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: zh_hans
  text: '于是，借着耶利米先知所说的话应验了[a]：


    “他们拿了那三十块银钱，


    就是那被估定之人的价钱；


    这人是以色列子孙中一些人所估定的[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马太把这句预言归于耶利米；其措辞却与撒迦利亚书11:12—13最为接近。对此有不同解释：这可能是综合引文，可能指以耶利米为首的先知书卷集，也可能涉及文本传抄问题。
    reason: textual_variant
  - marker: b
    text: 或译：“这人是由以色列子孙估定的。”希腊语短语含义艰涩；正文按部分含义译作“以色列子孙中一些人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接前文并标明叙事进展，比“那时”更自然地表达此处的时间顺序。
- source_word: ἐπληρώθη
  choice: 应验了
  rationale: 保留马太常用的预言应验公式及希腊文被动含义。
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: 借着耶利米先知所说的话
  rationale: “借着”体现διά加属格所表达的中介作用，同时保留经文明确写出的先知姓名。
- source_word: τὰ τριάκοντα ἀργύρια
  choice: 那三十块银钱
  rationale: ἀργύρια指作为钱使用的银块或银币；“银钱”自然清楚，又不武断指定币种。
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: 那位被估定之人的价钱
  rationale: 以“价钱／估定”保留τιμή与τιμάω之间的商业语境和词义联系。
- source_word: ὃν ἐτιμήσαντο
  choice: 给他估定的
  rationale: 继续采用“估定”，反映原文与τετιμημένου重复使用同一词根。
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: 以色列子孙中一些人
  rationale: 该短语语法艰涩；正文采用常见的部分含义理解，同时以脚注保留较直译的可能。
theological_decisions:
- issue: 经文归于耶利米，但措辞最接近撒迦利亚书11:12–13
  choice: 正文保留“耶利米先知”
  alternative: 改作“撒迦利亚”，或模糊处理先知姓名
  rationale: SBLGNT正文明确作Ἰερεμίου；翻译不以协调或推测取代原文，并以脚注说明长期存在的文本与引文问题。
- issue: ἀπὸ υἱῶν Ἰσραήλ的艰涩关系
  choice: 理解为部分含义：“以色列子孙中一些人”
  alternative: 直译为“从以色列子孙那里”
  rationale: 部分含义使汉语句法通顺，也符合一种重要的语法解释；因原文确有歧义，脚注列出较直译的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引文分行以呈现其经文性质；“银钱”“价钱”“估定”保持商业语境及原文的词语重复，不用过于古雅的“作价”。
