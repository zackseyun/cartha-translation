  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: zh_hans
  text: “他救了别人，却不能救自己。他是以色列的王；现在让他从十字架上下来吧[a]，我们就信他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果他是以色列的王，现在就让他从十字架上下来吧，我们就信他。”有些译本补出条件意味，使嘲讽语气更明确；但这里的希腊原文直接陈述这一称号。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: 别人
  rationale: 该词为形容词的实词化用法，指“其他人”。“别人”是自然简洁的现代汉语，并保留与“自己”的鲜明对比。
- source_word: ἔσωσεν
  choice: 救了
  rationale: σῴζω在此可涵盖拯救、救助和医治。“救了”既贴近原文，也保留较宽的语义范围。
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: 却不能救自己
  rationale: 忠实表达反身代词以及δύναμαι加不定式所表示的能力；加入“却”自然呈现原句中的嘲讽性对比，不改变命题内容。
- source_word: βασιλεὺς Ἰσραήλ
  choice: 以色列的王
  rationale: 保留原文直接陈述的王者称号，不增添原文没有的条件词“如果”。
- source_word: καταβάτω
  choice: 让他……下来吧
  rationale: 第三人称不定过去时命令式，在语境中是带有挑战和嘲弄意味的要求；此译法符合现代汉语表达。
- source_word: νῦν
  choice: 现在
  rationale: 直接保留时间副词所强调的即时性。
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: 从十字架上
  rationale: σταυρός在受难语境中标准译为“十字架”；“从……上下来”是自然汉语搭配。
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: 我们就信他
  rationale: πιστεύω与ἐπί加宾格表示以某人为信靠对象。“信他”在此简洁自然；“就”体现前一命令实现后所声称的结果关系。
theological_decisions:
- issue: 如何翻译对耶稣王者身份的嘲讽性声称
  choice: 他是以色列的王
  alternative: 如果他是以色列的王
  rationale: 所给希腊文本是直接的名词性陈述句，并无明确条件连词。正文保留直接陈述，以免把语境暗含的条件意味写进原文；脚注说明另一种可表达嘲讽逻辑的译法。
translation_notes:
  register: 采用现代、庄重而易懂的口语化引语。“却”强化原文并列分句中明显的反差；“吧”自然表达第三人称命令式的挑战语气。正文不补入“如果”，从而保留原文直接称耶稣为“以色列的王”所形成的反讽与神学张力。
