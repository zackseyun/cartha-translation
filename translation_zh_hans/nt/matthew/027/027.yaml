  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: zh_hans
  text: 于是，总督的士兵把耶稣带进总督府[a]，把全队士兵[b]都召集到他周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“总督的官邸”或“总督的总部”。原文所用词指罗马总督的官邸或官方、军事总部。
    reason: lexical_alternative
  - marker: b
    text: “全队”译自罗马军队的编制术语；这里可指这支部队，并不一定表示一个满编单位的每名士兵都实际到场。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 承接前文并推进叙事，符合现代汉语的自然表达。
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: 总督的士兵
  rationale: 保留属格所表达的隶属或关联关系；“总督”在受难叙事中清楚指罗马地方长官。
- source_word: παραλαβόντες τὸν Ἰησοῦν
  choice: 把耶稣带进
  rationale: 将希腊语分词结构自然整合进汉语主句；“带”表达士兵将耶稣置于控制之下并带往某处。
- source_word: εἰς τὸ πραιτώριον
  choice: 进总督府
  rationale: πραιτώριον指罗马总督的官邸或驻地；“总督府”比音译更便于普通读者理解，同时以脚注保留其所指范围。
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: 召集到他周围
  rationale: συνάγω表示召集、聚集；ἐπί加宾格在此表示朝向并围在耶稣周围，译文保留这一场景关系。
- source_word: ὅλην τὴν σπεῖραν
  choice: 全营的士兵
  rationale: σπεῖρα是罗马军队编制术语；“营”简洁保留军制含义，加“士兵”避免现代读者误解为营地。ὅλην译作“全”。
