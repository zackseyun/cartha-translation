  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: zh_hans
  text: 他回答他们说：“天国的奥秘已经赐给你们知道；但没有赐给那些人。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赐给”在原文中没有明说赐予者；按语境，这恩赐来自上帝。
    reason: 保留神圣被动，同时帮助普通读者理解其隐含意义。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: 他回答说
  rationale: 这是受闪语表达影响的常见希腊语结构，现代汉语用“回答说”自然传达回应并开口说话的意思；上下文已经表明回答的对象，因此不必生硬地译出“他们”。
- source_word: Ὅτι
  choice: 不单独译出
  rationale: 这里引出回答的内容；在现代汉语直接引语中，无须另加“因为”或“即”，即可自然衔接。
- source_word: ὑμῖν δέδοται
  choice: 只赐给你们
  rationale: “赐给”保留授予之意；采用无主语的被动意义表达，不明说赐予者。加入“只”使前后两组人的鲜明对照在汉语中清楚，但不改变范围。
- source_word: γνῶναι
  choice: 知道
  rationale: 贴近 γινώσκω 的基本义，也保留“认识、领会”的可能语义空间，避免直接收窄为“明白”。
- source_word: τὰ μυστήρια
  choice: 奥秘
  rationale: “奥秘”是庄重且通行的汉语圣经用语，既可指先前隐藏、如今被启示的真理，也不把它弱化为一般的秘密。
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: 天国的
  rationale: “天国”自然、简洁地对应马太常用的“诸天之国”，保留其国度含义，避免误解为单指天上的地点。
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: 却没有赐给那些人知道
  rationale: “那些人”保留 ἐκείνοις 与“你们”的指示性对比；重复“知道”补足汉语句意，并与前半句平衡。
theological_decisions:
- issue: δέδοται 所暗示的赐予者
  choice: 保留未明说施事者的表达
  alternative: 译作“上帝赐给你们”
  rationale: 希腊文使用被动式，虽很可能是神圣被动，却没有明确写出“上帝”；译文不替原文补明，以保留其神学张力。
- issue: μυστήρια 在天国语境中的意义
  choice: 译作“奥秘”
  alternative: 译作“秘密”或“隐藏的真理”
  rationale: “奥秘”保留神所启示、先前隐藏之事的广度，不把词义缩减为普通秘密，也不加入解释性定义。
- issue: 两组人所得启示的对比
  choice: 译作“只赐给你们……却没有赐给那些人”
  alternative: 弱化为“你们可以知道，他们却不可以”
  rationale: 保留原文“赐给／没有赐给”的平行结构，明确知识是被授予的，而非仅仅描述能力差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天国”“奥秘”“赐给”保持经文语体，但句法按自然汉语调整。脚注标记置于整句之后，说明原文未明说的施事者。
