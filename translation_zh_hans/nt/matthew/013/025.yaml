id: MAT.13.25
reference: Matthew 13:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: zh_hans
  text: 可是在，人们睡觉的时候，他的仇敌来了，把毒麦撒在麦子中间，就走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: 人们
  rationale: 泛指当时睡着的人，不限定为男性；这里的复数名词按上下文指田主手下的人。
- source_word: ὁ ἐχθρὸς
  choice: 那人的仇敌
  rationale: αὐτοῦ指向前文田主；用“那人的”保留所属关系，也避免误解为麦子的仇敌。
- source_word: ζιζάνια
  choice: 毒麦
  rationale: 指生长于麦田、幼苗期与小麦相似的有害杂草，传统且简洁的中文名称“毒麦”比泛称“杂草”更准确。
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: 在麦子中间
  rationale: 直接表达杂草被撒入并混在麦田作物之中的空间关系。
- source_word: ἀπῆλθεν
  choice: 就走了
  rationale: 简明保留敌人撒种后离去的连续动作。
theological_decisions:
- issue: 睡着之人的性别与身份
  choice: 人们
  alternative: 男人们／仆人们
  rationale: ἀνθρώπους本身可泛指人；原文没有明说他们都是男性，也未在本节直接称其为仆人，因此不作额外限定。
- issue: ζιζάνια的具体所指
  choice: 毒麦
  alternative: 稗子／杂草
  rationale: 该词通常指毒麦一类与小麦相似的有害植物；此译法保留比喻中真假难辨的张力，但不在正文添加植物学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文并形成转折；句式按原文事件顺序展开。
