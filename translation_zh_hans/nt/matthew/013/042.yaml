  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: zh_hans
  text: 并把他们扔进烈火的炉中；在那里，他们要哀哭、咬牙切齿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 并
  rationale: 保留与上文的连接，同时自然承接前一节的复数施事者。
- source_word: βαλοῦσιν
  choice: 扔进
  rationale: 表达 βάλλω 所含的强制投入之意；比“投掷”更符合现代汉语在这一语境中的自然表达。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 保留复数代词，指回上文所说将受审判的人，不擅自补明其身份。
- source_word: κάμινον τοῦ πυρός
  choice: 烈火的炉中
  rationale: 保留炉与火的具体审判意象；“烈火的炉”在现代汉语中自然庄重，又不改写为后来的教义术语。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接保留地点副词的指向，回指刚提到的烈火之炉。
- source_word: κλαυθμός
  choice: 哀哭
  rationale: 准确表达悲痛哭泣，并与马太福音反复出现的固定表达保持一致。
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: 咬牙切齿
  rationale: 采用现代汉语中清楚而惯用的对应表达，保留强烈痛苦或愤恨的张力，不限定为单一情绪。
theological_decisions:
- issue: “烈火的炉”所表达的审判性质
  choice: 保留具体而强烈的末世审判意象
  alternative: 直接释义为“地狱之火”或弱化为抽象的“惩罚”
  rationale: 原文使用炉与火的比喻，却未在本句将其等同于某个后来的系统神学术语；译文因此既不淡化，也不越过原文加以界定。
- issue: “哀哭、咬牙切齿”的情绪范围
  choice: 保留固定表达，不说明它仅指悲伤或仅指愤怒
  alternative: 释为纯粹的悲痛，或释为纯粹的愤怒
  rationale: 该短语明确传达审判中的剧烈痛苦，但“切齿”也可能带有愤恨色彩；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“并”使本节自然承接上文；分号对应原文两个紧密相连的分句。“哀哭、咬牙切齿”既保留马太式固定用语，也便于普通读者理解。
