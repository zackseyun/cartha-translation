  source_fidelity: 译文忠实呈现希腊文的未来动作、复数受事者、火炉意象以及地点指向。“把他们扔进烈火的炉中”对应καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός；“在那里，他们要……”准确表达ἐκεῖ ἔσται的地点与将来发生。未将审判意象擅自解释为特定后世教义术语。
  naturalness: “并把他们扔进烈火的炉中；在那里，他们要哀哭、咬牙切齿。”是现代、庄重且可理解的书面汉语。“烈火的炉中”虽带有较正式的圣经语体，但在此审判图像中自然；分号也恰当地连接两个紧密相关的分句。
