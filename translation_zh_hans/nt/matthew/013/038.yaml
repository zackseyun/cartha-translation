id: MAT.13.38
reference: Matthew 13:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: zh_hans
  text: 田地就是世界；好种子，就是天国之子[b]；杂草[a]，就是那恶者之子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“毒麦”；传统译为“稗子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“子”是表示归属关系的说法，指属于天国的人。
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: 田地
  rationale: 符合农业比喻的语境，也比“田野”更明确地指耕种的地块。
- source_word: κόσμος
  choice: 世界
  rationale: 在这里指撒种所在的广阔范围；“世界”是自然、常规且不过度限缩的译法。
- source_word: καλὸν σπέρμα
  choice: 好种
  rationale: 保留种子的农业意象，并与后面的杂草形成清楚对照；现代汉语中“好种”简洁自然。
- source_word: οὗτοί εἰσιν
  choice: 就是
  rationale: 希腊文用阳性复数代词从集合性的“种”转指其所代表的人；汉语用“就是”即可自然表达这种解释关系。
- source_word: οἱ υἱοὶ τῆς βασιλείας
  choice: 天国之子
  rationale: 保留“子”的关系性表达和马太福音一贯的“天国”用语；脚注说明此处所指不限于字面上的男性儿子。
- source_word: ζιζάνια
  choice: 杂草
  rationale: 这是现代读者容易理解的总称；更具体的植物名称“毒麦”置于脚注，以免正文采用生僻植物名。
- source_word: οἱ υἱοὶ τοῦ πονηροῦ
  choice: 那恶者之子
  rationale: “那恶者”体现带冠词的阳性单数形式所指向的具体邪恶者，同时不直接补入原文未明说的专名。
theological_decisions:
- issue: τοῦ πονηροῦ指抽象的“邪恶”，还是具体的“那恶者”
  choice: 那恶者
  alternative: 邪恶
  rationale: 带冠词的阳性单数属格置于“子”之后，在本段两方人物对照中自然指一个有位格的邪恶者；译文不进一步把该称谓替换成某个专名。
- issue: υἱοὶ是否应直接译成包容性的“儿女”
  choice: 子
  alternative: 儿女
  rationale: 原文使用阳性复数υἱοί；正文保留关系性称谓“子”，脚注则说明该表达泛指归属于相应一方的人，避免读者误以为只包括男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个对应解释以分号并列，呈现原文连续使用δέ所形成的平行节奏；“好种”“杂草”保留比喻形象，“天国之子”“那恶者之子”保留原文的关系性张力。
