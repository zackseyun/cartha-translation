  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: zh_hans
  text: 他的姐妹不也都在我们这里吗？那么，这个人从哪里得来这一切呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女性亲属”。这里的希腊词通常指“姐妹”，但有人鉴于后来出现的神学讨论，将它作较宽泛的解释。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: 姐妹
  rationale: 这里是在谈耶稣的家庭成员，普通的亲属义最符合上下文；“姐妹”直接、自然，也不把后来的神学解释带入正文。
- source_word: οὐχὶ πᾶσαι
  choice: 不也都……吗
  rationale: οὐχί引出的反问预期肯定回答，“都”保留πᾶσαι对全部姐妹的强调；这一汉语句式自然表达反问语气。
- source_word: πρὸς ἡμᾶς
  choice: 在我们这里
  rationale: 该短语在此表示与说话者同处一个群体或地方；“在我们这里”比单说“和我们在一起”更贴合乡里居民的语境。
- source_word: πόθεν
  choice: 从哪里得来
  rationale: πόθεν询问来源；“从哪里得来”明确保留对耶稣这一切能力或表现之来源的追问。
- source_word: οὖν
  choice: 那么
  rationale: 此词标示说话者从前述家庭背景作出的推论；“那么”符合现代汉语反问中的推演语气。
- source_word: τούτῳ
  choice: 这个人
  rationale: 指向耶稣，并带有语境中略显轻蔑或疏离的口吻；“这个人”比“他”更能保留指示词的语气。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 概括上文所说的智慧和异能；现代汉语用“这一切”自然地表达该复数短语的总体指向。
theological_decisions:
- issue: 耶稣的“姐妹”所指为何
  choice: 正文按ἀδελφαὶ通常的词义译为“姐妹”，不加入关于具体亲属关系的教义性说明。
  alternative: 女性亲属／表姐妹或堂姐妹
  rationale: 原文在当前家庭语境中的自然意义是“姐妹”。翻译不应为调和后来的神学争论而扩大词义；脚注仅说明存在的宽泛解释，不将其确立为正文含义。
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“不也都在我们这里吗”保留村民自认熟悉耶稣家庭的语气；“这个人”呈现原文指示代词略带疏离的色彩。
