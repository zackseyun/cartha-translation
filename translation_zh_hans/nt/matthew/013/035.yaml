  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: zh_hans
  text: 这是为要应验那借着先知所说的话：“我要用比喻开口；我要说出自创立之初隐藏的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: 这是要应验
  rationale: 以自然的现代汉语表达目的兼结果关系，并保留马太常用的“应验”公式。
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: 借着先知所说的话
  rationale: 保留διά加属格所表达的媒介意义，同时用汉语中清楚自然的关系结构呈现。
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: 我要用比喻开口
  rationale: “用比喻”自然表达ἐν παραβολαῖς的方式意义；“开口”保留引文的诗体意象。
- source_word: ἐρεύξομαι
  choice: 吐露
  rationale: 该词有涌出、说出的色彩；“吐露”既保留形象性和诗意，也符合现代汉语。
- source_word: κεκρυμμένα
  choice: 隐藏的事
  rationale: 将作名词用的完成时被动分词译为“隐藏的事”，保留其被隐藏并持续处于隐藏状态的含义，不解释为特定类型的“奥秘”。
- source_word: ἀπὸ καταβολῆς
  choice: 从创始以来
  rationale: 源文没有κόσμου（“世界的”）；“从创始以来”在汉语中可自然指向起初，同时避免把源文未明说的宾语加入正文。
theological_decisions:
- issue: 先知引文的身份表述
  choice: 借着先知
  alternative: 借着亚萨先知
  rationale: SBLGNT仅有“借着先知”，因此不在正文中补出姓名，也不对诗篇引文的作者身份作额外判定。
- issue: ἀπὸ καταβολῆς的范围
  choice: 从创始以来
  alternative: 从创世以来
  rationale: 正文遵循所给希腊文本，不补入κόσμου；同时以“创始”传达这一惯用语所指向的最初起点。异文中明确加入“世界的”，故列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。引文略具诗体色彩；“吐露”呼应原文动词的形象性。“从创始以来”有意保留源文未明说“世界”的简略表达。
