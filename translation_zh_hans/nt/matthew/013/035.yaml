review_pass:
  verdict: revise
  source_fidelity: 正文正确保留SBLGNT中ἀπὸ καταβολῆς未明说“世界”的简略形式，不应因英语审校轨迹的补足性改写而在中文正文加入“世界”。不过“从创始以来”在现代汉语中所指不够明确，且“创始”更常指某人或某机构开始创办；改为“自创立之初”能较自然地表达καταβολή所指的奠定／创立的起始，同时不补出“世界”。
  naturalness: “这是要应验”可理解，但“这是为要应验那借着先知所说的话”更完整、庄重，也更清楚地标示目的关系。引文中“吐露”虽有诗意，但在此容易带出“揭露秘密”的语用含义；“说出”更直接对应ἐρεύξομαι的发出、讲说，且不预先解释隐藏之事必然被完全揭示。
  terminology: 保留“应验”“先知”“比喻”等稳定而自然的圣经语汇。“隐藏的事”准确对应作名词用的κἐκρυμμένα，未将其诠释为“奥秘”。异文脚注应明确补入的是“世界”，中文宜表述为“从世界创立以来”。
  issues:
  - severity: low
    issue: “从创始以来”的现代汉语指称略显悬空。
    rationale: καταβολῆς在此是“奠定／创立的起始”，希腊文虽未出现“世界”，但中文“创始”通常需要明确谁或何物创始。以“自创立之初”保留省略及起始含义，表达更顺畅。
  - severity: low
    issue: 脚注异文的中文措辞可更精确。
    rationale: 异文是“从世界的创立以来／从创世以来”的完整短语；“从世界创立以来”能明确说明增加的是“世界”，并与正文的“创立之初”形成可见对照。
  - severity: low
    issue: 引介公式可略作调整以提升句法完整性。
    rationale: 加入“为”和“那”后，目的从句及“所说的话”作为应验对象的关系更清晰，且不改变意义。
  revised_text: 这是为要应验那借着先知所说的话：“我要用比喻开口；我要说出自创立之初隐藏的事。”
  revised_footnotes:
  - marker: a
    text: 有些抄本作“从世界创立以来”。
    reason: textual_variant
