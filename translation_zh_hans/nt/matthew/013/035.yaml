revisions:
- from: 这是要应验借着先知所说的话：“我要用比喻开口，吐露从创始[a]以来隐藏的事。”
  to: 这是为要应验那借着先知所说的话：“我要用比喻开口；我要说出自创立之初隐藏的事。”
  rationale: 修订仅改善现代标准汉语的句法与语义清晰度，并使异文脚注更明确。正文仍严格依据所给SBLGNT，不把异文中的“世界”加入正文；也保留引文的诗性和“隐藏的事”这一未加神学阐释的表达。
