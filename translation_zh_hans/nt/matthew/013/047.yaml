  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: zh_hans
  text: 天国又好比一张撒进海里的大拖网[a]，网罗各类鱼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大网”；原文特指一种大型的拖网或围网。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“从各类中聚拢”；“鱼”是捕鱼图景所暗含的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: 又
  rationale: 承接前面的比喻，简洁自然地表示另举一例。
- source_word: ὁμοία ἐστὶν
  choice: 好比
  rationale: 符合现代汉语比喻句的习惯，也保留马太福音中天国比喻的比较形式。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 准确保留马太特有的表达，也是现代中文读者熟悉而自然的译法。
- source_word: σαγήνῃ
  choice: 大拖网
  rationale: 该词特指用于围拢、拖曳渔获的大型渔网；比泛称“网”更具体。
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: 撒进海里的
  rationale: “撒”是中文捕鱼语境中投放渔网的惯用动词；“海”保留原文 θάλασσα 的措辞。
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: 网罗各类鱼
  rationale: “网罗”自然表达渔网聚拢捕获之物；原文未明说“鱼”，但捕鱼图景清楚地暗含这一宾语，因此在正文补出并以脚注说明。
theological_decisions:
- issue: “天国”的表达
  choice: 保留“天国”
  alternative: 上帝的国；天的统治
  rationale: 原文采用马太特有的“诸天之国”表达；不将其改写为“上帝的国”，也不把“国”限定解释为抽象的统治，以保留原文措辞及其神学张力。
- issue: 比喻所网罗对象的范围
  choice: 译作“各类鱼”
  alternative: 各类；各样东西
  rationale: 鱼由捕鱼图景自然暗含，但原文只说“各类”，没有进一步界定具体鱼种或赋予象征意义；脚注保留其省略性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“撒进海里”保持捕鱼画面的动态感；“大拖网”以脚注兼顾术语的准确性与普通读者的理解。所有补足信息均明确标注，未把后文对比喻的解释提前带入本节。
