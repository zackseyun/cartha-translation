  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: zh_hans
  text: 但那撒在好土里的，就是听这道并明白的人；他确实结出果实，并且有收成：有的一百倍，有的六十倍，有的三十倍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: 在好土里
  rationale: 在撒种的农业语境中，γῆ指承接种子的土壤；καλή表示适宜生长、肥沃的“好”，并非强调道德意义。中文以“在好土里”自然延续比喻。
- source_word: σπαρείς
  choice: 撒在
  rationale: 不定过去时被动分词保留种子“被撒”的意象；与中文处所短语结合译作“撒在好土里的”，简洁自然。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: 听了这道……的人
  rationale: λόγος在本段指所传讲的话语或信息；译为“这道”既承接上下文，又保留福音书中“道”的宗教语感。中文用“听了”表达实际领受，不把现在分词机械处理为进行体。
- source_word: συνιείς
  choice: 明白
  rationale: συνίημι在此表示理解所听之道的意义；宾语由上下文自然承接，无须重复。
- source_word: δὴ
  choice: 确实
  rationale: δή具有强调作用；“确实”以轻度强调保留该语气，而不增添额外神学判断。
- source_word: καρποφορεῖ
  choice: 结出果实
  rationale: 保留农业及门徒生命的双重比喻意象，现代中文清楚自然。
- source_word: ποιεῖ
  choice: 产
  rationale: 此处ποιέω指产生收成；“产”与前面的“结出果实”分别对应两个动词，也自然引出数量。
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: 有的产一百倍，有的六十倍，有的三十倍
  rationale: 分配式关系代词结构表示不同个体有不同收成。原文虽未明写“倍”，但农业语境指相对于所撒种子的产量；现代中文若只说“一百、六十、三十”语义不完整，因此以“倍”明确其自然含义。
theological_decisions:
- issue: 对这道的回应之性质
  choice: 按经文本身描述为听见、明白并结出果实，且结果程度不同。
  alternative: 在译文中明确加入“坚持到底”“真正归信”或“重生的证据”等解释。
  rationale: 希腊文本强调听道、明白和结果，却没有在本节直接使用这些后来的教义类别；译文保留经文自身的范畴及其张力，不预先限定宗派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“但……就是……”保留与前述几类土壤的对照；分号划分身份说明与结果表现，使长句清晰。未设置脚注，因为主要词义与产量表达在中文正文中均可自然呈现。
