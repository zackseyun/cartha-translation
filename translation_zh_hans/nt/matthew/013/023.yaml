revisions:
- from: 但那撒在好土里的，就是听了这道并且明白的人；他确实结出果实，有的产一百倍，有的六十倍，有的三十倍。
  to: 但那撒在好土里的，就是听这道并明白的人；他确实结出果实，并且有收成：有的一百倍，有的六十倍，有的三十倍。
  rationale: 修订仅调整体貌表达和中文句法衔接；保留“确实”对δή的轻度强调，保留“结出果实”与“有收成”以分别体现καρποφορεῖ和ποιεῖ，并以“一百倍、六十倍、三十倍”清楚表达农业语境中的不同产量。无需脚注。
