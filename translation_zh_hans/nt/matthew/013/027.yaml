  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: zh_hans
  text: 于是，家主的奴仆来到他跟前，对他说：“主啊，你不是在自己的田里撒了好种子吗？那么，杂草[a]是从哪里来的呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杂草”或译“毒麦”；原文所指很可能是毒麦，一种幼苗期与小麦相似的杂草。
    reason: 保留 ζιζάνια 较具体的植物学所指及传统译法所反映的词义。
lexical_decisions:
- source_word: προσελθόντες
  choice: 前来
  rationale: 不定过去时分词表示在“说”之前发生的伴随动作；“前来对他说”自然地保留了趋近家主的意思。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 在家主与其属下的关系中，该词指处于主人权下的奴隶；“奴仆”既保留其从属身份，也符合现代中文圣经叙事的庄重语体。
- source_word: οἰκοδεσπότου
  choice: 家主
  rationale: 该词本指一家之主；“家主”简洁地保留了家庭领域及权柄含义，并与“奴仆”形成清楚的关系。
- source_word: Κύριε
  choice: 主啊
  rationale: 呼格在此是奴仆对家主的尊称；译作“主啊”保留 κύριος 的基本称谓，同时不把比喻中的称呼过度解释为直接的基督论宣告。
- source_word: οὐχὶ
  choice: 不是……吗
  rationale: 该否定疑问句预期肯定回答；现代汉语“不是……吗”准确传达这一语用力量。
- source_word: καλὸν σπέρμα
  choice: 好种子
  rationale: 直接保留农业语境中的品质判断，表达简明自然。
- source_word: ἔσπειρας
  choice: 撒了
  rationale: σπείρω 专指撒种；中文“撒了……种子”比泛义的“种了”更贴近原文动作。
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: 在自己的田里
  rationale: 反身领属“自己的”在问句中自然地突出田属于受话者，并忠实表达 σῷ。
- source_word: πόθεν οὖν
  choice: 那么……从哪里来的
  rationale: “从哪里”保留对来源的追问，“那么”表达 οὖν 根据前句所作的推论。
- source_word: ἔχει ζιζάνια
  choice: 杂草是从哪里来的
  rationale: 希腊文直译近于“它怎么有杂草”，但中文以“杂草是从哪里来的”更自然，并准确传达对杂草来源的追问。
- source_word: ζιζάνια
  choice: 杂草
  rationale: 该词可能特指毒麦，即幼苗期与小麦相似的有害杂草；正文采用普通读者易懂的“杂草”，具体所指在脚注说明。
theological_decisions:
- issue: 比喻中 δοῦλοι 的社会身份
  choice: 奴仆
  alternative: 仆人
  rationale: “仆人”更自然但可能淡化其属于主人并受其支配的社会身份；“奴仆”较准确地保留原词张力，又不在正文中加入关于奴隶制度的额外判断。
- issue: 比喻对话中 κύριε 的称呼
  choice: 主啊
  alternative: 主人；先生
  rationale: 此处直接语境是对家主的尊称，并不单独构成基督论称号；“主啊”保留原词常规对应及比喻可能承载的神学回响，而不强行消解其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文情节；直接引语保持自然口语感。“奴仆”有意保留古代家户关系中的从属身份。脚注标记置于整句之后，对“杂草”作词义说明。
