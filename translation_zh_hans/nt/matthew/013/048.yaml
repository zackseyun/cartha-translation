  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: zh_hans
  text: 网满了以后，他们把网拉到岸上，坐下来，把好鱼收进容器里[a]，却把腐坏的鱼[b]扔在外面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容器”也可译作“器皿”。希腊语所用的是泛指盛物器具的词，不一定指篮子。
    reason: lexical_alternative
  - marker: b
    text: “腐坏的鱼”也可译作“不好的鱼”或“无用的鱼”。这里的希腊词可指腐烂、变质，也可泛指品质低劣、没有用处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: 网
  rationale: 关系代词回指上一节的撒网；简体中文在新句中重复“网”比直译为“它”更清楚自然。
- source_word: ἐπληρώθη
  choice: 满了
  rationale: 被动不定过去时在此表示网装满了鱼；“满了”简洁自然，也保留原文没有再次明说“鱼”的特点。
- source_word: ἀναβιβάσαντες
  choice: 把网拉上
  rationale: 该分词描写把网从水中拉到岸上的动作；“拉上”准确且符合现代汉语捕鱼语境。
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: 岸
  rationale: αἰγιαλός指水边、岸边；“岸”不额外限定为沙滩或海岸。
- source_word: καθίσαντες
  choice: 坐下来
  rationale: 按叙事次序表达分词动作，现代汉语自然流畅。
- source_word: συνέλεξαν
  choice: 收进
  rationale: 结合后面的εἰς ἄγγη，译为“收进”既表达收集，也自然带出放入容器的动作。
- source_word: τὰ καλά
  choice: 好鱼
  rationale: 原文实为“好的”，所指的鱼由语境省略；中文补出“鱼”可避免含混而不增添新的解释。
- source_word: εἰς ἄγγη
  choice: 容器里
  rationale: ἄγγη是泛指盛放物品的器具，并不专指篮子；“容器”在现代汉语中宽泛而准确。
- source_word: τὰ δὲ σαπρά
  choice: 腐坏的鱼
  rationale: σαπρός可指腐烂、变质，也可泛指无用或不好的；“腐坏”保留捕鱼场景中的具体意象，并以脚注注明较宽泛的可能。
- source_word: ἔξω ἔβαλον
  choice: 扔出去
  rationale: 准确表达向外丢弃和排除的力度，符合现代汉语习惯。
theological_decisions:
- issue: 比喻中分类意象的解释
  choice: 按捕鱼和拣鱼的具体场景翻译，不在本节正文中加入末后审判的解释。
  alternative: 采用预示末后审判的解释性措辞。
  rationale: 本节仍在叙述比喻的画面，解释随后才出现；保持具体意象可避免把后文的神学说明提前写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“网满了以后”简洁承接上一节；以“他们”承载希腊语分词中隐含的捕鱼者主语。正文保留具体捕鱼场景，不提前解释其寓意。
