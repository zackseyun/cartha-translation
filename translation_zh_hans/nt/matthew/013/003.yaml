  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: zh_hans
  text: 他用比喻对他们讲了许多事，说：“看哪，有一个撒种的出去撒种。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: 比喻
  rationale: 这是现代汉语圣经语境中自然、准确的对应词，表达借助熟悉事物作类比的教导形式。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、引出场景的语用功能，同时维持庄重而易懂的叙事语体。
- source_word: ὁ σπείρων
  choice: 一个撒种的
  rationale: 希腊语名词化分词指从事撒种的人；用“一个撒种的”既保留人物类型，也自然引出故事。
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: 出去撒种
  rationale: 以简洁自然的汉语重现“出去，为要撒种”的目的关系，不添加原文未明说的地点或身份。
theological_decisions:
- issue: 是否在本节先把“撒种的”解释为特定人物
  choice: 不作解释，保留故事中的普通人物称谓
  alternative: 译作“那位撒种者”或在正文中指明其象征身份
  rationale: 本节只引出比喻，解释见后文；提前指定身份会消解叙事张力并加入释义。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“讲了许多事”对应 πολλὰ，“说”自然引出直接引语。
