id: MAT.13.32
reference: Matthew 13:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: zh_hans
  text: 它固然比所有的种子都小，但长大后，比园中的植物都大，并且成了一棵树，以致天上的飞鸟[a]来栖息在它的枝上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“空中的飞鸟”。
    reason: lexical_alternative
  - marker: b
    text: 飞鸟栖息在树枝上的图景，可能呼应旧约中以大树描绘大国的意象（例如以西结书17:23；但以理书4:12），但本节并未明确说明这一意象的象征意义。
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: 比所有种子都小
  rationale: 保留希腊文比较级的形式和比较范围，不改写为形态上的最高级；中文表达同时自然传达“比任何种子都小”的意思。
- source_word: μέν ... δέ
  choice: 固然……但……却
  rationale: 清楚呈现种子起初微小与后来长大的对比，并符合现代汉语行文习惯。
- source_word: ὅταν ... αὐξηθῇ
  choice: 长大以后
  rationale: 表达生长完成后随即出现的结果，体现不定过去时虚拟语气将生长视为一个整体。
- source_word: μεῖζον τῶν λαχάνων
  choice: 比园中的其他植物都大
  rationale: λάχανα泛指园中栽培的植物、菜蔬或草本；采用较宽泛的“园中的其他植物”，避免把所指过度限定为现代意义的蔬菜。“其他”明确比较对象不包括已经长大的本株。
- source_word: γίνεται δένδρον
  choice: 成了一棵树
  rationale: 直接保留原文鲜明的树木意象，不弱化为“像树一样”或“大株植物”。
- source_word: ὥστε ἐλθεῖν
  choice: 以致……来
  rationale: 体现ὥστε加不定式所表达的结果关系。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天上的飞鸟
  rationale: 忠实传达“天空／天上的鸟”，且是自然、庄重的现代汉语表达。
- source_word: κατασκηνοῦν
  choice: 栖息
  rationale: 该词表示驻留、安歇；“栖息”适合飞鸟与枝头的语境，同时不强行限定为筑巢。
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: 在它的枝头
  rationale: 自然表达飞鸟停栖于树枝之上的位置；“它”准确回指这棵树。
theological_decisions:
- issue: 飞鸟栖息在大树枝头可能呼应旧约的国度树木意象
  choice: 正文按原文直译该图景，不明说飞鸟象征什么
  alternative: 把飞鸟解释为在上帝国度中得庇护的列国或万民
  rationale: 本节可能呼应以西结书17:23和但以理书4:12等经文，但希腊文本身没有明示象征含义；保留意象及其神学张力，避免把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“固然……但……却”突出由小到大的转折；“园中的其他植物”保持λάχανα的宽泛含义；“栖息”保留原词可指安歇或驻留的弹性。所有脚注标记均置于正文相应位置。
