base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: zh_hans
  text: 耶稣讲完了这些比喻，就离开那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: ……完了……就……
  rationale: 这一组合在叙事中引出随后发生的事。现代汉语用“……完了……就……”自然表达先后衔接，无须生硬直译“事情发生了”。
- source_word: ἐτέλεσεν
  choice: 讲完了
  rationale: τελέω表示完成或结束；结合宾语“比喻”，汉语“讲完了”既表达完成，也自然点明这些比喻是耶稣所讲的。
- source_word: τὰς παραβολὰς ταύτας
  choice: 这些比喻
  rationale: “比喻”是符类福音教学语境中 παραβολή 的通行对应词；“这些”指向紧接此前的一组比喻。
- source_word: μετῆρεν
  choice: 离开
  rationale: μεταίρω在此指从一处移往别处；“离开”准确而自然，不额外说明去向或方式。
- source_word: ἐκεῖθεν
  choice: 那里
  rationale: 与“离开”连用时，现代汉语通常说“离开那里”，已清楚表达“从那里”的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“讲完了……就……”保留原文的时间顺序和叙事推进，同时避免仿照希腊语结构而造成汉语生硬。
