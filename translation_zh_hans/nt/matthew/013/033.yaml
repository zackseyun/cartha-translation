  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: zh_hans
  text: 他又对他们讲了一个比喻：“天国好像酵[a]：一个女人拿了酵，把它藏进三细亚[c]面粉里，直到全团面都发起来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“酵母”。原文指使面团发起来的酵种。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“直到全都发酵了”；“全团面”指由这些面粉形成的整体。
    reason: lexical_clarification
  - marker: c
    text: “细亚”是古代的容量单位；三细亚面粉是很大的分量。
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: 他又对他们讲了一个比喻
  rationale: “又”自然表达ἄλλην的追加意义；“讲了一个比喻”符合现代汉语叙事习惯，也准确传达ἐλάλησεν αὐτοῖς。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音中该短语自然、准确且通行的汉语表达；无需生硬保留οὐρανῶν的复数形式。
- source_word: ζύμῃ
  choice: 面酵
  rationale: 指使面团发酵的酵种。“面酵”既保留比喻意象，也避免让人只联想到现代商品酵母；另在脚注注明通俗替代说法。
- source_word: ἣν λαβοῦσα γυνὴ
  choice: 有一个女人拿来
  rationale: 把分词结构自然转为连续动作，不额外说明面酵从何处取得。
- source_word: ἐνέκρυψεν εἰς
  choice: 藏在
  rationale: 保留ἐγκρύπτω“藏入、隐在其中”的直接词义；“掺进”或“揉进”虽符合烘焙语境，却较具解释性。
- source_word: ἀλεύρου σάτα τρία
  choice: 三细亚面粉
  rationale: “细亚”音译古代容量单位，准确保留原文的具体计量；脚注说明这是很大的分量，以帮助现代读者理解。
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: 直到面全都发起来
  rationale: 用自然汉语表达被动发酵的结果，并以“全都”保留ὅλον所强调的整体范围；“面”依语境指全部面粉形成的面团。
theological_decisions:
- issue: 天国比喻中ζύμη（面酵）的褒贬含义
  choice: 中性译作“面酵”，不在正文中赋予正面或负面的神学评价
  alternative: 根据其他经文中“酵”的用法，把本处明确处理为负面象征；或译成“酵母”，突出日常烘焙图景
  rationale: 本节本身着重描绘面酵隐而遍及全体的作用。译文应保留这一意象及其解释空间，不以措辞预先裁定其神学褒贬。
- issue: ἐνέκρυψεν的动作含义
  choice: 按字面译为“藏在”，并用脚注列出烘焙语境中的可能理解
  alternative: 在正文直接译作“掺进”或“揉进”
  rationale: “藏在”保留原文刻意使用的隐藏意象；较顺畅的烘焙表达属于合理解释，但不应无声取代原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“面酵”略带传统经文语感，但脚注提供“酵母”以方便普通读者；“藏在”有意保留原文的突兀和隐藏意象。
