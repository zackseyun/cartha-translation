  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: zh_hans
  text: 那时，义人将要在他们父的国里像太阳一样发光[a]。有耳可听的[b]，就应当听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发出光来”。
    reason: lexical_alternative
  - marker: b
    text: 原文为单数形式，是对每一位听者发出的代表性呼召。
    reason: source_form
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 承接前文对末世审判的解释，清楚表达时间次序，也符合现代汉语叙事习惯。
- source_word: οἱ δίκαιοι
  choice: 义人
  rationale: 以名词化表达指被视为公义的人；“义人”简洁、庄重，并保留道德与圣约层面的含义。
- source_word: ἐκλάμψουσιν
  choice: 要……发光
  rationale: 未来时动词表示将来发光、照耀；“发光”自然清楚，光辉灿烂的程度由“如同太阳”这一明喻充分表达。
- source_word: ὡς ὁ ἥλιος
  choice: 如同太阳
  rationale: 准确保留ὡς引出的明喻，语言自然而庄重。
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν
  choice: 在他们父的国里
  rationale: 保留介词短语的处所含义以及“他们父”的原文措辞，不擅自添加“天”或“天上”等原文没有的限定。
- source_word: ὁ ἔχων ὦτα
  choice: 有耳的
  rationale: 汉语中自然的名词化结构，传达原文以单数个体为代表所发出的普遍呼召。
- source_word: ἀκουέτω
  choice: 就要听
  rationale: 表达第三人称命令语气；“听”既承接耳朵的意象，也容纳认真听取、领会并回应的语用含义。
theological_decisions:
- issue: 结尾劝诫中的代表性单数
  choice: 译作“有耳的，就要听”
  alternative: 凡有耳的，都应当听
  rationale: 原文采用单数名词化分词和单数命令式，以一个人代表所有听者。汉语本身不强制标明数，因此正文保持简洁，并由脚注说明其单数形式，避免改写成明确复数。
- issue: βασιλεία在本节中的含义
  choice: 译作“国”
  alternative: 统治
  rationale: “在……里”的处所结构以及“他们父的”这一属格修饰，更自然地指向末世性的国度领域；译作“国”同时不否认上帝掌权的动态含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他们父的国”略带经文体色彩，但紧贴原文关系，且不添加原文没有的“天父”或“天国”。结尾用感叹号体现命令与呼召的力度。
