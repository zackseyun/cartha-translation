  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: zh_hans
  text: 在这时代终结的时候，情形将会是这样：天使要出去，把恶人从义人中分别出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这时代圆满完成的时候。”传统译法常作“世界的末了”，但希腊文 αἰών 指“时代”或“世代”，不是“世界”。
    reason: 说明 συντέλεια 可指终结或圆满完成，并澄清 αἰών 的词义及传统译法。
lexical_decisions:
- source_word: οὕτως
  choice: 也要这样
  rationale: 承接撒网比喻，说明比喻所描绘的情形在这世代终结时也会如此；“也”自然体现上下文的类比关系。
- source_word: ἔσται
  choice: 要
  rationale: 表达将来的情形，与“这样”组成自然的现代汉语谓语。
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: 这世代终结时
  rationale: συντέλεια指达到终点或完成，αἰών指一个时代或世代，而非物质世界；“这世代终结时”简明、自然，并结合语境表达定冠词所指的现今世代。
- source_word: ἐξελεύσονται
  choice: 要出去
  rationale: 直接表达ἐξέρχομαι的外出行动，也保留原文未来时的意义。
- source_word: οἱ ἄγγελοι
  choice: 天使
  rationale: 末后审判的语境表明这里指属天的天使，而非一般的人间使者。
- source_word: ἀφοριοῦσιν
  choice: 分别出来
  rationale: 既表达将一群人与另一群人分开的动作，也与ἐκ μέσου所表示的“从……中”相配。
- source_word: τοὺς πονηροὺς
  choice: 恶人
  rationale: 该形容词作名词用，指邪恶的人；“恶人”是清楚、凝练的现代汉语表达。
- source_word: ἐκ μέσου τῶν δικαίων
  choice: 从义人中
  rationale: 准确表达恶人原在混合群体之中、随后被分离出来；“义人”保留δικαίων的伦理与神学含义。
theological_decisions:
- issue: 末世短语中αἰών的含义
  choice: 世代
  alternative: 世界
  rationale: αἰών在这里指现今的时代或秩序；译作“世代”避免把原文默认为物质宇宙的毁灭，同时保留其末世意义。
- issue: ἄγγελοι的身份
  choice: 天使
  alternative: 使者
  rationale: 耶稣解释末后审判的比喻时，语境所指是属天的天使；这是由上下文确定的词义，而非加入特定宗派解释。
- issue: 恶人与义人的分离次序
  choice: 把恶人从义人中分别出来
  alternative: 把义人与恶人分开
  rationale: 保留原文明确以“恶人”为受事、以“义人”为被分离背景的表达，不将其泛化为双方对称的分开。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这世代终结时”保留末世语境而不使用容易引起误解的“世界末日”；“分别出来”清楚呈现从混合群体中分离的动作。
