  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: zh_hans
  text: 他因他们不信，就没有在那里行许多大能的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多神迹”或“许多彰显能力的事”。希腊语原词指能力，也可指彰显能力的作为；在这里是指神奇的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: 就没有……行
  rationale: καί承接前文，在此按汉语叙事关系自然译作“就”；οὐκ ἐποίησεν明确陈述“没有行”，并非“不能行”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点，指耶稣的家乡。
- source_word: δυνάμεις πολλὰς
  choice: 许多大能的事
  rationale: δύναμις在福音书记述中可指彰显能力的奇异作为；“大能的事”既保留“能力”的词义联系，也不把含义完全收窄为“神迹”。
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: 因他们不信
  rationale: διά接宾格在这里表示原因；ἀπιστία译为“不信”，简明保留其否定性的信仰含义。
theological_decisions:
- issue: 本节表达的是耶稣不能行，还是没有行许多大能的事
  choice: 译作“没有……行”，陈述实际未多行这些事。
  alternative: “不能在那里行许多神迹”。
  rationale: 希腊文是οὐκ ἐποίησεν（“没有行”），并未使用表示能力不足或不能的措辞；因此不把马太的陈述强化为“不能”，以保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“大能的事”略带经文语体，但仍自然可解，并保留原词与“能力”的联系。主句依汉语习惯调整语序，将原因置于前面；不改变因果关系。
