  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: zh_hans
  text: “这一切，你们都明白了吗[a]？”他们对他说：“是的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切，你们都明白吗？”
    reason: “明白了吗”较突出截至此刻已经领会的意味；按汉语表达，也可译为一般现在状态的问句“明白吗”。
lexical_decisions:
- source_word: Συνήκατε
  choice: 明白了吗
  rationale: 该词为不定过去时直说语气第二人称复数；在此问句中，“明白了吗”自然地询问门徒到此刻是否已经领会，同时保留复数主语“你们”。
- source_word: ταῦτα πάντα
  choice: 这一切……都
  rationale: ταῦτα是中性复数指示代词，πάντα表示全部；汉语以“这一切……都”自然而明确地指向此前所讲的一切。
- source_word: λέγουσιν αὐτῷ
  choice: 他们对他说
  rationale: 希腊文采用历史现在时；现代汉语叙事无须机械保留时态形式。“对他说”保留了αὐτῷ所指的对象。
- source_word: Ναί
  choice: 是的
  rationale: ναί是单纯的肯定回答。“是的”准确保留其简短语气，不增添原文没有的称谓。
theological_decisions:
- issue: 是否在门徒的回答中增添尊称
  choice: 只译作“是的”
  alternative: “是的，主啊”
  rationale: SBLGNT正文只有ναί，没有“主”或其他尊称；不应根据后期传统或敬虔表达增补原文未说的内容。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“这一切”前置以承接上文，并以“都”体现πάντα；问答保持简洁。
