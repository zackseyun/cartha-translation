  text: The one who has ears[a], let him hear.
translation:
  language: zh_hans
  text: 有耳朵的，就应当听！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: 有……的
  rationale: 定冠词加现在分词构成名词性短语，泛指任何具有这一特征的人。汉语“有……的”自然、简洁，并保留单数泛指的作用，无须添入有性别的人称代词。
- source_word: ὦτα
  choice: 耳朵
  rationale: 原文为“耳”的复数。现代汉语通常以无复数标记的“耳朵”自然表达人体成对器官；在这一惯用劝诫中不必生硬译作“耳朵们”。
- source_word: ἀκουέτω
  choice: 就应当听
  rationale: 第三人称单数现在时命令式表达劝诫和要求。“就应当听”既体现命令语气，又保持ἀκούω“听”的词汇对应；这里的“听”在语境中也包含留心领受之意。
theological_decisions:
- issue: 泛指对象及命令语气
  choice: 有耳朵的，就应当听！
  alternative: 凡有耳朵的，都要听！
  rationale: 原文以单数名词性分词短语泛指人，并以第三人称单数命令式劝诫。主译不加入“他”，因现代汉语无需用阳性代词表达泛指；同时不加入原文没有的“凡”“都”。“应当”传达命令式，不把“听”缩减为单纯的听觉能力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留耶稣格言式劝诫的力度。末尾用感叹号体现命令与呼吁语气。
