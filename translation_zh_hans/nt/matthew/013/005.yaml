  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: zh_hans
  text: 另有一些种子落在石地上[a]，那里没有多少土；它们立刻发芽，因为土层不深。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“多岩石之处”；指底层为岩石、土层浅薄的地面。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: 另有一些种子
  rationale: 中性复数形容词承接上文省略的“种子”；汉语补出“种子”，并以“另有一些”表达分配性的对比。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 按原文保留“落下”的叙事意象，不释作“被撒在”。
- source_word: ἐπὶ τὰ πετρώδη
  choice: 在石地上
  rationale: πετρώδη指多石或底层为岩石之处；“石地”简洁自然，脚注说明其具体地貌。
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: 那里土不多
  rationale: 以自然现代汉语表达该处土壤不多，不强行指定种子或土地为动词的语法主语。
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: 很快就发了芽
  rationale: εὐθέως表示迅速、立即；ἐξανέτειλεν在农作语境中指萌发长出。“很快就发了芽”符合现代汉语表达。
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: 因为土不深
  rationale: διά加冠词化不定式表示原因；“土不深”准确而自然地传达土层浅薄。
theological_decisions: []
