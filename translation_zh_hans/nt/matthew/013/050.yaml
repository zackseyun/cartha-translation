  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: zh_hans
  text: 把他们扔进火炉[a]里；在那里，必有哀哭切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“火的炉子”，也可译作“烈火的炉子”。
    reason: 说明希腊语属格结构及较为直译的替代说法。
lexical_decisions:
- source_word: βαλοῦσιν
  choice: 扔进
  rationale: 该动词在此表示有力地投入某处；“扔进”自然、明确，也保留审判场景中的强制意味。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 阳性复数宾格代词，承接上文所说的恶人；汉语用普通宾语代词即可。
- source_word: κάμινον τοῦ πυρός
  choice: 火炉
  rationale: 希腊语直译为“火的炉子”；现代汉语“火炉”简洁自然，并保留具体的烈火与炉子意象。脚注说明原文结构，以免其形式差异被完全隐藏。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留地点副词的明确指向和强调作用，指向前述火炉之中。
- source_word: ἔσται
  choice: 必有
  rationale: 既表达将来发生，也符合汉语庄重的宣告语气；“有”自然承接后面的名词性表达。
- source_word: ὁ κλαυθμὸς
  choice: 哀哭
  rationale: κλαυθμός指悲痛的哭泣；“哀哭”比单用“哭泣”更能传达哀恸，同时不过度扩展为解释性措辞。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 切齿
  rationale: 这是马太福音中反复出现的固定表达；“切齿”是现代汉语可理解且凝练的对应语，并保留痛苦、愤恨或绝望等可能内涵，不将其限定为单一心理状态。
theological_decisions:
- issue: 末世审判意象的表达
  choice: 保留“火炉”和“哀哭切齿”的具体意象，不作弱化或解释性扩写。
  alternative: 意译为“在烈火中受罚，痛苦地哭喊磨牙”。
  rationale: 原文以具体而强烈的图像陈述审判，却没有在本节解释其性质或持续时间；译文应保留其力度和神学张力，而不额外界定。
- issue: “切齿”所表达的情绪
  choice: 采用固定表达“切齿”，不补入“因痛苦”“因愤怒”等原因。
  alternative: 译为“痛苦得咬牙切齿”或“愤怒地咬牙”。
  rationale: βρυγμός τῶν ὀδόντων本身没有在此明确限定为痛苦、愤怒或绝望；避免解释性增译可以保存原文的含混性。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“扔进”避免“投入”可能带来的自愿色彩；“必有哀哭切齿”保留马太福音审判宣告的凝练节奏。脚注标记已在正文中对应出现。
