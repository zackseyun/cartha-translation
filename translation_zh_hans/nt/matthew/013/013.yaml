id: MAT.13.13
reference: Matthew 13:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: zh_hans
  text: 正因如此，我用比喻对他们说话，因为他们看是看，却看不见；听是听，却听不见，也不明白。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“因为他们看着，却看不见；听着，却听不见，也不明白。”
    reason: 说明两个现在分词也可用较贴近希腊文形式的方式翻译；正文采用更自然的汉语复说结构来呈现其反差。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 保留该短语承接上文并引出原因说明的作用；“正因如此”在现代汉语中自然，也不把语气强化为纯推论性的“因此”。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: 这里的ἐν加与格表示说话的方式；汉语用“用比喻”比机械直译为“在比喻中”更自然。
- source_word: αὐτοῖς λαλῶ
  choice: 我……对他们说话
  rationale: 直接保留与格所指的听众和λαλῶ的现在时陈述，语序符合现代汉语。
- source_word: ὅτι
  choice: 因为
  rationale: 按上下文取原因义，明确说明耶稣为何用比喻对他们说话，同时不改写其中的神学张力。
- source_word: βλέποντες οὐ βλέπουσιν
  choice: 他们看是看，却看不见
  rationale: 用现代汉语的让步式复说保留原文“看”与“不看见”的悖论；既表达外在观看与实际领会之间的反差，又不把后者解释得过窄。
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: 听是听，却听不见
  rationale: 与前句保持平行，保留“听”与“听不见”的修辞反差。
- source_word: οὐδὲ συνίουσιν
  choice: 也不明白
  rationale: οὐδέ延续否定并形成递进；“明白”准确表达συνίημι所指的理解、领会，且通俗庄重。
theological_decisions:
- issue: 分词βλέποντες和ἀκούοντες的语义作用
  choice: 译为“看是看……听是听……”，以汉语让步结构呈现反差
  alternative: 较形式化地译为“看着却看不见，听着却听不见”
  rationale: 希腊文分词本身没有明示“虽然”，但上下文形成明显悖论。所选汉语既传达这种反差，也不额外断言他们不明白的具体原因或责任程度。
- issue: συνίουσιν在本节中的含义
  choice: 明白
  alternative: 领会；理解
  rationale: 本节把外在的看见、听见与对意义的把握相对照。“明白”清楚自然，又不加入原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看是看……听是听……”是自然的汉语让步复说，与原文两组同词反复相应；分号显示两个平行分句，末句“也不明白”构成递进。脚注标记置于相关整句之后。
