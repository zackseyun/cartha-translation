id: MAT.13.52
reference: Matthew 13:52
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: zh_hans
  text: 他对他们说：“所以，凡为天国受过教导的经学家[a]，都像一个家主[b]，从自己的宝库[c]里拿出新的和旧的东西来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为天国受过教导”也可译作“成为天国的门徒”。希腊文分词既可表达成为门徒，也可表达受到门徒式的教导或训练。
    reason: alternative_reading
  - marker: b
    text: “家主”指一家之主或家庭的主管。
    reason: lexical_alternative
  - marker: c
    text: “宝库”也可指储藏贵重物品的库房。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 表达承接上文的推论关系，符合现代汉语习惯。
- source_word: πᾶς γραμματεὺς
  choice: 凡……的经学家
  rationale: “经学家”既保留其研习、讲授圣经律法的身份，也比“文士”更便于现代普通读者理解；πᾶς 以“凡……都”体现。
- source_word: μαθητευθεὶς
  choice: 受过教导
  rationale: 保留被动、受培育的含义，同时不把该词仅限定为归信或正式训练；其“成为门徒”的可能含义列入脚注。
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 为天国
  rationale: 保留与天国相关、以天国为取向的关系，不将罕见的与格结构过度限定为“在天国里”。
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: 一个家主
  rationale: 简洁表达一家之主及其管理家产的角色，又避免“房主”被误解为仅指产权所有人。
- source_word: ἐκβάλλει
  choice: 拿出
  rationale: 在宝库语境中表示从储藏处取出；不用通常带强制意味的“赶出”或“扔出”。
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: 从自己的宝库里
  rationale: 兼顾 θησαυρός 所含的贵重之物与储藏处两层意象，并明确希腊文反身所属关系。
- source_word: καινὰ καὶ παλαιά
  choice: 新的和旧的东西
  rationale: 补出中性复数形容词所省略的“东西”，保留原文先新后旧的次序。
theological_decisions:
- issue: μαθητευθεὶς 与“经学家”和“天国”的关系
  choice: 为天国受过教导的经学家
  alternative: 成为天国门徒的经学家
  rationale: 正文体现此人因天国而受到塑造和教导，却不把含义缩窄为单指归信；脚注保留“成为门徒”的真实语义可能。
- issue: “新的和旧的东西”所指为何
  choice: 不在正文中明确其具体对应物
  alternative: 解释为新旧约、耶稣教训与摩西律法，或新旧真理
  rationale: 原文只呈现比喻性的对照，未直接界定“新”“旧”所指；翻译保留这种开放性，避免引入特定神学体系。
- issue: οἰκοδεσπότης 的社会角色
  choice: 家主
  alternative: 一家之主；户主；房主
  rationale: “家主”保留管理家庭及其储藏的权柄意象，但不据此引申额外的社会或教义主张。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“经学家”比传统的“文士”更透明；“受过教导”保持通俗，同时以脚注保存 μαθητευθεὶς 的门徒语义。所有脚注标记均置于对应词语之后。
