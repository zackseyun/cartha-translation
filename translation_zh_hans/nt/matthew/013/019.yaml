  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: zh_hans
  text: 凡听见天国之道却不明白的人，那恶者[a]就来，把那撒在他心里的道夺去。这就是那撒在路旁的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶者”也可译作“邪恶者”。本句中的用法指一位来夺去所撒之道的恶者。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那撒在路旁的”；“路旁”也可译作“小路边”。
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: 凡听见……的
  rationale: 以现代汉语的泛指结构表达希腊文分词结构及 πᾶς 的周遍、逐一含义，语气自然，也保留“任何人”的普遍性。
- source_word: τὸν λόγον τῆς βασιλείας
  choice: 天国之道
  rationale: λόγος 在此指所传的信息或话语；“天国之道”简洁庄重，并能维系比喻中“道”与种子之间的对应。
- source_word: μὴ συνιέντος
  choice: 却不明白
  rationale: συνίημι 表示理解、领会；“却”自然呈现听见与未能理解之间的反差。
- source_word: ὁ πονηρὸς
  choice: 那恶者
  rationale: 带冠词的形容词在此作名词使用，结合其主动前来夺走所撒之物的叙述，宜表达为具有位格的“恶者”，但不在正文中进一步指明身份。
- source_word: ἁρπάζει
  choice: 夺去
  rationale: ἁρπάζω 含突然、强行攫取之意；“夺去”简洁而有力度。
- source_word: τὸ ἐσπαρμένον
  choice: 撒在……里的
  rationale: 以汉语关系结构表达中性完成时被动分词“已经被撒下的东西”，其所指由上下文自然领会。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 在他心里
  rationale: 直译“心”，保留圣经人论用语；“他”反映原文单数阳性代词，在此作泛指。
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: 那撒在路旁的人
  rationale: 原文以阳性被动分词称呼“被撒在路旁的那一位”，把听道的人与比喻中的撒种形象重叠起来；补出“人”使现代汉语完整，同时用脚注保留原文较凝缩的说法。
theological_decisions:
- issue: ὁ πονηρὸς 的身份
  choice: 译作具有位格的“那恶者”
  alternative: 译作抽象的“邪恶”或直接明确为“魔鬼”
  rationale: 冠词、阳性形式及“来”“夺去”等动作支持位格性理解；但本节本身没有直接写出其专名，因此不越过原文明确为“魔鬼”。
- issue: 比喻中人、种子与土地意象的重叠
  choice: 译作“那撒在路旁的人”
  alternative: 译作“撒在路旁的种子”或仅作“那撒在路旁的”
  rationale: 阳性分词指向人，而“被撒”又延续种子的比喻意象。正文以“人”确保可懂性，脚注说明直译，从而不消除原文刻意形成的意象张力。
- issue: αὐτοῦ 的性与数
  choice: 译作“他心里”
  alternative: 译作“他们心里”或“心里”
  rationale: 原文为单数阳性代词，并在泛指结构中代表任何一个听道者；保留“他”较贴近源文语法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天国之道”保留经文传统语感及种子与道的意象联系；全句避免过度解释，仅在原文凝缩或有词义选择之处加注。
