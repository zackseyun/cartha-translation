id: MAT.13.15
reference: Matthew 13:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: zh_hans
  text: 因为这百姓的心已经迟钝；他们用耳朵听得很吃力[a]，又闭上了眼睛，免得他们用眼睛看见，用耳朵听见，心里明白，回转过来[b][c]，我就医治他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们听得沉重”；原文直译为“他们沉重地听了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“转回”或“归回”。
    reason: lexical_alternative
  - marker: c
    text: 引自《以赛亚书》6:9–10。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: 已经迟钝
  rationale: 该词本义为“变厚、变肥”，与“心”连用时指内在感受和领悟变得迟钝；“已经迟钝”自然清楚，并保留其状态变化。
- source_word: καρδία
  choice: 心
  rationale: 在本节指人的内在理解与意向；下文明确说“心里明白”，因此保留圣经语言中自然的“心”。
- source_word: λαοῦ τούτου
  choice: 这百姓的
  rationale: 保留指示词“这”和所属关系，准确传达“这百姓的心”。
- source_word: βαρέως ἤκουσαν
  choice: 耳朵听得吃力
  rationale: βαρέως 字面有“沉重地”之意，与“听”连用表示听觉迟滞、困难；此译比“听得沉重”更符合现代汉语，同时不把它强化为完全听不见。
- source_word: ἐκάμμυσαν
  choice: 闭上了
  rationale: 主动语态表明百姓自己闭上眼睛；“闭上了”也保留已发生而影响当前的意味。
- source_word: μήποτε
  choice: 免得
  rationale: 简明保留希腊文的否定目的或结果色彩，不把经文中的审判与责任张力解释掉。
- source_word: συνῶσιν
  choice: 明白
  rationale: 表达以心领悟、理解的含义，且符合现代汉语。
- source_word: ἐπιστρέψωσιν
  choice: 回转过来
  rationale: 保留“转回、归回”的方向意味，又避免使用带有后期教会术语色彩的表达。
- source_word: ἰάσομαι
  choice: 我就医治他们
  rationale: 以“就”连接回转与医治的后续关系，同时保留第一人称和“医治”的意象。
theological_decisions:
- issue: μήποτε所引出的话如何呈现神的审判与人的责任之间的张力
  choice: 免得他们……回转过来，我就医治他们
  alternative: 不然，他们就会……回转过来，我也会医治他们
  rationale: 正文贴近μήποτε的表层语力，同时保留百姓主动闭眼的责任，不把该句单一解释为目的、结果或反事实陈述。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“迟钝”“听得吃力”“回转过来”兼顾原文意象与普通读者的可理解性；句法保留眼、耳、心的递进和平行结构。
