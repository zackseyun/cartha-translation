base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: zh_hans
  text: 他回答说：“撒好种的，就是人子。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译为“人的儿子”。希腊语称号“人子”呼应《但以理书》第7章；正文保留这一福音书中沿用已久且具有神学意味的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 希腊语以分词加限定动词引出回答；译作“回答说”既保留回应的语篇功能，也符合现代汉语习惯。
- source_word: Ὁ σπείρων
  choice: 撒……的
  rationale: 带冠词的现在分词以行动指认其人；“撒……的”自然地保留这种表达，不必压缩为名词“撒种者”。
- source_word: τὸ καλὸν σπέρμα
  choice: 好种
  rationale: καλός在这里表示好的、合宜的；σπέρμα为集合意义的单数。结合本章比喻语境，“好种”比“好的种子”更简洁自然，并与上下文术语一致。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是福音书中耶稣惯用的称号，并呼应《但以理书》第7章；“人子”是中文圣经传统中简洁而稳定的对应语。
theological_decisions:
- issue: 基督论称号 υἱὸς τοῦ ἀνθρώπου 的译法
  choice: 人子
  alternative: 那位属人的／人的那一位
  rationale: 原文既采用可按字面理解的闪语式表达，也承载《但以理书》第7章及福音书中的称号意味。“人子”保留其经典互文和神学张力，不将其释义为普通的人或预先限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“回答说”自然传达原文结构；“撒好种的”保留比喻解释中的行动性指称；“人子”沿用通行称号。
