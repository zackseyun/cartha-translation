id: MAT.13.20
reference: Matthew 13:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: zh_hans
  text: 至于那撒在石头地上的[a]，就是听了这道，立刻欢喜领受的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“那撒在多石之处的。”
    reason: 词汇与形式上的另一译法；πετρώδη 可译作“多石之处”，而原文没有明说“地”。
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: 至于那撒在石头地上的
  rationale: 用“至于”表达 δέ 在此处较轻的转折与话题转换；保留“撒在……上的”这一被动播种意象，并维持原文将种子与其所代表之人压缩在同一表达中的张力。
- source_word: πετρώδη
  choice: 石头地
  rationale: 指多石、土层浅的地面；“石头地”是现代汉语中自然且符合农业语境的表达。
- source_word: σπαρείς
  choice: 撒在……上的
  rationale: 保留 σπείρω 不定过去时被动分词的播种意象与被动含义，不扩写为“种子”。
- source_word: οὗτός ἐστιν
  choice: 就是
  rationale: 直接表达原文的辨认句式，不解释性地改写为“代表”。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: 听了这道……的人
  rationale: 以自然的汉语关系结构呈现现在分词；“这道”承接上下文中的 λόγος，既保留“道”的主题呼应，也符合现代圣经语体。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确保留回应迅速这一强调，且为自然的现代标准汉语。
- source_word: μετὰ χαρᾶς
  choice: 欢喜
  rationale: 在“领受”前用状语自然表达“带着喜乐”；“欢喜”庄重而通俗。
- source_word: λαμβάνων αὐτόν
  choice: 领受
  rationale: 此处表示接受所听见的道；“领受”既体现主动接受，也保持庄重的经文语域。汉语可自然省略指回“这道”的宾语代词。
theological_decisions:
- issue: 比喻解释中“被撒者”的所指
  choice: 保留“那撒在石头地上的”这一压缩隐喻，再以“就是……的人”说明所指。
  alternative: 解释性地译为“撒在石头地上的种子，代表那听道的人”。
  rationale: 希腊文在语法上称其为“被撒的那一位”，随后又认定为听道的人。译文不直接补入“种子”或“代表”，以免消解种子、土地与人之间刻意压缩的比喻张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“石头地”贴合农业比喻；“这道”“领受”保留经文的主题关联和适度庄重感。句式尽量贴近原文，同时避免生硬的分词结构。
