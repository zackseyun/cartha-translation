  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: zh_hans
  text: 但你们的眼睛有福了，因为[a]看见；你们的耳朵也有福了，因为听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他们看见；因他们听见。”两处希腊语连词均可译作“因”。
    reason: 保留ὅτι在此可用较书面汉语因果连接方式表达的可能性。
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文那些看却看不见、听却听不见的人，表达鲜明对比。
- source_word: μακάριοι
  choice: 有福的
  rationale: 符合祝福宣告的语境，表达蒙福，而不只是主观上的快乐。
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: 你们的眼睛
  rationale: 按现代汉语自然表达所属关系，并保留对门徒之眼睛的强调。
- source_word: ὅτι βλέπουσιν
  choice: 因为看得见
  rationale: 将ὅτι理解为说明蒙福原因；“看得见”自然保留视觉动词及其语境中的深层含义。
- source_word: τὰ ὦτα ὑμῶν
  choice: 你们的耳朵
  rationale: 采用自然的现代汉语表达，并与“你们的眼睛”保持平行。
- source_word: ὅτι ἀκούουσιν
  choice: 因为听得见
  rationale: 将ὅτι理解为因果连词，并保留“听”的直接感官用语。
- source_word: βλέπουσιν / ἀκούουσιν
  choice: 看得见／听得见
  rationale: 不增译为“领悟”或“明白”，让上下文传达属灵层面的含义，同时在汉语中与上文“看却看不见、听却听不见”的对比自然呼应。
theological_decisions:
- issue: 是否把看见和听见明确译成属灵的领悟
  choice: 保留“看得见”和“听得见”的感官语言
  alternative: 译为“能领悟”和“能明白”
  rationale: 本节原文本身只说眼睛看见、耳朵听见；属灵领受的含义由上下文显明，不应在译文中替作者消解这种张力。
- issue: ὅτι在此表示原因还是陈述内容
  choice: 正文译为“因为”
  alternative: 可理解为“在于……／就是……”
  rationale: 因果理解最符合上下文，即眼睛和耳朵因实际看见、听见而蒙福；但希腊语连词也容许略有不同的关系表达，因此以脚注保留替代译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“也是有福的”补足第二分句中希腊文省略的谓语，以清楚呈现原文平行结构；脚注标记置于整句之后。
