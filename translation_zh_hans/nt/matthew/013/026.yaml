  - severity: medium
    issue: 正文将ζιζάνια固定为“稗子”
    rationale: 该词可泛指田间杂草，传统“稗子”及可能的“毒麦”均属解释性具体化。原文及英文POB审校轨迹均保留其不确定性，正文采用“杂草”、脚注说明传统和可能的具体指认更稳妥。
