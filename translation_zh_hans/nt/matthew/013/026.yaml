  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: zh_hans
  text: 可是，庄稼长起来并结出籽粒的时候，杂草也显露出来了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杂草”传统译作“稗子”；也可能指毒麦一类外形近似麦子的杂草。
    reason: 说明ζιζάνια可作宽泛的“杂草”，并保留“稗子”这一传统译法及可能指毒麦的植物学不确定性。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 可是……的时候
  rationale: ὅτε引出时间从句，δὲ在此承接上文并带轻微转折；用“可是……的时候”自然呈现叙事推进与对比。
- source_word: ἐβλάστησεν
  choice: 苗长起来
  rationale: βλαστάνω指发芽、萌生或长出嫩芽；结合田间作物的语境，“苗长起来”比单说“发芽”更能涵盖此处已经生长并将结实的阶段。
- source_word: ὁ χόρτος
  choice: 苗
  rationale: χόρτος可指草或田间植物；这里所指是麦类作物长出的植株。“苗”简洁自然，又不在本节提前直接补出“麦子”。
- source_word: καρπὸν ἐποίησεν
  choice: 结出穗粒
  rationale: 原文直译为“结出果实”，在麦田语境中指作物形成可辨认的籽粒；“穗粒”既符合农业场景，也解释了为何此时稗子才明显可辨。
- source_word: τότε
  choice: ……的时候
  rationale: τότε标明随后的时间点。汉语将它与前面的时间结构整合为“……的时候”，避免生硬重复“那时”。
- source_word: ἐφάνη
  choice: 显出来了
  rationale: φαίνω在此为不及物/被动意义，表示变得可见、显明；“显出来了”自然表达此前不易分辨、此时才显露的含义。
- source_word: καὶ τὰ ζιζάνια
  choice: 稗子也
  rationale: καί有附加义，译作“也”。ζιζάνια指麦田中的有害杂草，可能特指毒麦；中文圣经传统常用“稗子”，正文保留这一易于理解且符合比喻语境的称呼，并以脚注说明其可能所指。
theological_decisions:
- issue: ζιζάνια所指植物的具体身份
  choice: 正文译作“稗子”
  alternative: 杂草；毒麦
  rationale: 原文所指可能是外形近似麦子的毒麦一类杂草，但无法要求精确的植物学鉴定。“稗子”在中文比喻语境中自然且有传统辨识度；脚注保留较宽泛与较具体的可能译法，不把不确定的鉴定写死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“苗长起来”“结出穗粒”“显出来了”符合普通读者熟悉的农作物生长图景；保留“稗子”这一中文圣经语境中广为人知的用语，并用脚注避免造成过度精确的植物学判断。
