  source_fidelity: 正文基本准确地呈现了作物生长、结实后杂草变得可见的时序。不过，“穗粒”不是现代汉语中自然、稳定的农业表达；改为“籽粒”更准确顺畅。ζιζάνια本身并不要求确定为“稗子”，宜在正文保留较宽泛的“杂草”，并将传统及可能的具体指认置于脚注。
  naturalness: “苗长起来并结出穗粒”可理解，但“穗粒”搭配生硬。“庄稼长起来并结出籽粒”以及“显露出来了”更符合现代标准汉语的自然叙事表达。
  terminology: ζιζάνια宜译为“杂草”，以保留原词植物学身份的不确定性，并与英文POB正文的泛称一致。“稗子”为传统译法，但可能造成具体植物身份已经确定的印象，适合列入脚注；“毒麦”同样应以“可能指”表述。
