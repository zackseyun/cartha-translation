  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: zh_hans
  text: 所以，你们要听撒种之人的比喻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 希腊文明确使用第二人称复数代词，并带有强调意味；汉语明说“你们”，可保留这一强调，并与上文形成衔接。
- source_word: οὖν
  choice: 所以
  rationale: οὖν在此承接前文并引出推论或转折后的吩咐；“所以”自然地表达这一话语关系。
- source_word: ἀκούσατε
  choice: 要听
  rationale: 这是第二人称复数的不定过去时主动命令式。“要听”保留命令语气，也不把“听”过度解释为“明白”。
- source_word: παραβολὴν
  choice: 比喻
  rationale: “比喻”是福音书教导语境中παραβολή准确且通行的译法。
- source_word: τοῦ σπείραντος
  choice: 撒种之人
  rationale: 带冠词的不定过去时分词实质名词化，直指“那位撒过种的人”。“撒种之人”既自然庄重，又不必把它固定化为专名式称号。
theological_decisions:
- issue: “听”是否应解释为“明白”
  choice: 保留“听”
  alternative: 明白
  rationale: 原文使用ἀκούω，而非本章另见的“明白”相关动词συνίημι；因此不宜在译文中消除“听”与“领会”之间的张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“所以，你们”保留原文的衔接和显性主语强调；“撒种之人”贴近分词结构，同时保持普通读者易懂。
