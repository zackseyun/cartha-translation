  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: zh_hans
  text: 天国又好比一个商人，正在寻找上好的珍珠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: 又
  rationale: 承接前一则天国比喻，引出同一系列中的另一项比较；“又”在现代汉语中自然、简洁，并保留篇章推进作用。
- source_word: ὁμοία ἐστὶν
  choice: 好比
  rationale: 准确表达比喻性的比较关系，也是汉语叙述比喻时自然庄重的说法。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音特色表达在中文中的通行译法，简明自然；其含义是诸天之国度或天的国度，并非单指一个地点。
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: 一个商人
  rationale: ἔμπορος已明确此人的身份，汉语无需再重复译为“一个人，一个商人”；同时保留不定、个体性的表达。
- source_word: ζητοῦντι
  choice: 正在寻找
  rationale: 现在分词描写商人持续进行的活动；“正在”清楚传达其过程性。
- source_word: καλοὺς μαργαρίτας
  choice: 上好的珍珠
  rationale: καλός在商业语境中侧重品质优良，而不只是外观美丽；“上好的”自然表达优质珍珠。
theological_decisions:
- issue: 比喻公式中比较对象的范围
  choice: 按希腊文句法，直接说天国好比一个正在寻找珍珠的商人。
  alternative: 把天国理解为商人寻找珍珠这一整幅情景，而不特别以商人为比较中心。
  rationale: ὁμοία ἐστὶν与人称与格短语ἀνθρώπῳ ἐμπόρῳ自然构成“好比一个商人”；译文保留这一直接句法关系，同时不对比喻中商人、寻找行为和珍珠各自的神学所指作额外限定。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“天国又好比……”与本章连续的比喻体例协调；句式清楚，普通读者易懂，同时贴近希腊文的比较结构。
