id: MAT.13.17
reference: Matthew 13:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: zh_hans
  text: 因为我实在告诉你们：许多先知和义人[a]曾渴望看见你们所看见的，却没有看见；也渴望听见你们所听见的，却没有听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人”原文是作名词使用的形容词，也可译为“公义的人”。
    reason: 说明δίκαιοι的语法用法及可行的词汇表达。
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在“我告诉你们”的郑重宣告公式中，“实在”自然传达确实、郑重的语气，又避免仅作音译。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为前面的陈述提供解释或根据；“因为”明确保留这一逻辑联系。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是现代汉语中自然而直接的表达，也保留了耶稣面向听众发言的公式性语气。
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: 许多先知和义人
  rationale: “许多”准确表达数量；“先知”是通行译法；δίκαιοι在此作名词使用，“义人”简洁、庄重，并保留其道德及信仰语境中的含义。
- source_word: ἐπεθύμησαν
  choice: 曾渴望
  rationale: 该动词表示强烈愿望；“渴望”传达其力度，“曾”配合不定过去时所指向的先前世代。
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: 看见你们所看见的，却没有看见
  rationale: 保留“看见”的重复和前后对照，不把所见对象解释性扩展为弥赛亚或天国。
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: 听见你们所听见的，却没有听见
  rationale: 与前半句保持平行，忠实保留原文“听见”的重复及未能听见的历史事实。
theological_decisions:
- issue: δίκαιοι所指的范围
  choice: 译作“义人”，与“先知”并列，表示先知之外更广泛的公义之人。
  alternative: 译作“公义的人”或“正直的人”。
  rationale: 原文为作名词使用的复数形容词，指一类人；“义人”既准确又符合现代汉语圣经语域，不把其范围限缩为先知。
- issue: “所看见的”和“所听见的”具体指什么
  choice: 保留原文隐含表达，不在正文中指明具体对象。
  alternative: 解释性译为“弥赛亚”“耶稣的作为”或“天国的奥秘”。
  rationale: 上下文可使读者联想到耶稣的事工和天国的启示，但本节只用关系从句表达对象；保留这种含蓄可避免替原文消除其开放性与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实在告诉你们”保留郑重宣告的语气；分号呈现“看见／听见”两组平行结构。“却没有……”保留愿望与未实现之间的鲜明对照。
