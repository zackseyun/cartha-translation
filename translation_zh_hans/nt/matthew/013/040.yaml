  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: zh_hans
  text: 所以，正如杂草被收集起来，用火焚烧，在时代的终结时也必是这样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时代的终结”传统也译作“世界的末了”；希腊文为“时代的终结”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: 所以……怎样
  rationale: “所以”保留οὖν承接上文并作出推论的作用；“怎样”与后文“也要怎样”构成自然的汉语比较句，表达ὥσπερ…οὕτως。
- source_word: συλλέγεται
  choice: 被收集起来
  rationale: 保留被动意义，也符合将田间杂草集中起来处理的场景。
- source_word: τὰ ζιζάνια
  choice: 杂草
  rationale: 该词指有害的田间杂草，很可能是毒麦；“杂草”是现代汉语中清楚自然的概括表达，避免采用生僻植物名而造成不必要的限定。
- source_word: πυρὶ καίεται
  choice: 用火焚烧
  rationale: “用火”保留πυρί可能具有的工具格意义；“焚烧”准确表达καίω，并符合庄重而自然的叙述语体。
- source_word: οὕτως ἔσται
  choice: 也要怎样
  rationale: 与前面的“怎样”呼应，清楚表达类比；“要”传达ἔσται的将来意义。
- source_word: ἐν τῇ συντελείᾳ
  choice: 终结时
  rationale: συντέλεια指一个时期达到终点或完成；“终结时”简洁清楚，并保留末世性的时间含义。
- source_word: τοῦ αἰῶνος
  choice: 世代
  rationale: αἰών在此主要指时间性的时代，而非物质世界；“世代”保留这一含义，且比“世界”更贴近原文。
theological_decisions:
- issue: 末世短语ἐν τῇ συντελείᾳ τοῦ αἰῶνος的理解
  choice: 世代终结时
  alternative: 世界末了时
  rationale: 选择“世代”以保留αἰών的时间与救赎历史意味，不将其直接解释为物质宇宙；同时不加入原文没有明说的具体末世体系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“杂草”与上下文一致；比较结构“怎样……也要怎样”保留原文的对应关系。脚注仅说明“世代／世界”的传统译法差异。
