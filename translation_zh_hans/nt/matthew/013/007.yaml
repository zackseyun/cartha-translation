base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: zh_hans
  text: 另有一些种子落在荆棘丛中[a]；荆棘长起来，把它们挤压得不能生长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“落在荆棘上”；这里按撒种的情境译为“落在荆棘丛中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: 另有一些种子
  rationale: ἄλλα是中性复数，在上下文中作名词使用，隐含指前文所说的种子；补出“种子”可使现代汉语清楚自然，又不增加新的所指。
- source_word: δὲ
  choice: 另有
  rationale: δὲ在这里是推进比喻叙述的轻微连接词，并非强烈转折；以“另有”自然引出下一类落种的情形。
- source_word: ἔπεσεν
  choice: 落在
  rationale: πίπτω的简单过去时直接表示“落下”；保留原文动作，不改译为较具解释性的“撒在”。
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: 在荆棘丛中
  rationale: ἐπί加宾格字面可作“在……上”，但在撒种的农业语境中，种子是落入已有或潜藏荆棘的地带；“荆棘丛中”是自然且符合场景的汉语表达。
- source_word: ἀκάνθας / αἱ ἄκανθαι
  choice: 荆棘丛／荆棘
  rationale: ἄκανθα可指带刺植物或荆棘；前处用“荆棘丛”说明落种环境，后处用“荆棘”作生长并挤压种子的主体，既自然又保留重复意象。
- source_word: ἀνέβησαν
  choice: 长起来
  rationale: ἀναβαίνω在植物语境中描写向上长出；“长起来”符合现代汉语，也保留生长上升的动态。
- source_word: ἔπνιξαν
  choice: 挤住了
  rationale: πνίγω本义为使窒息、扼住；在植物竞争的语境中，“挤住了”自然表达荆棘压制种子生长，同时保留原文强烈的阻遏意象。
- source_word: αὐτά
  choice: 它们
  rationale: 中性复数代词回指隐含的多粒种子；“它们”保留复数指称，不把原文进一步解释为已经长成的幼苗。
theological_decisions: []
