  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: zh_hans
  text: 他对他们说：“这是仇敌干的。”奴仆[a]对他说：“那么，你要我们去把它们收集起来吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。原文所用的词可指奴隶，也可指仆人，须按语境理解。
    reason: 词义选择
lexical_decisions:
- source_word: ἔφη
  choice: 说
  rationale: 这是叙事对话中常见的言说动词；“说”简洁自然。
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: 仇敌
  rationale: 原文直译近于“一个敌对的人”，其中ἄνθρωπος使对方个体化；现代汉语用“仇敌”即可自然表达其意义。
- source_word: τοῦτο ἐποίησεν
  choice: 这是……做的
  rationale: 以现代汉语自然的判断句式表达“做了这事”，并保留τοῦτο所指的当前局面。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: δοῦλοι指从属于主人的人。“奴仆”既保留其受支配的社会身份，也符合庄园比喻的语境；“仆人”是较弱的可能译法，列于脚注。
- source_word: Θέλεις
  choice: 你要我们……吗
  rationale: θέλω在此询问主人的意愿；“你要我们……吗”比“你愿意……吗”更清楚地带出后续行动的执行者是奴仆。
- source_word: οὖν
  choice: 那么
  rationale: 此处承接主人对事情缘由的说明，并引出奴仆的提议；“那么”兼具推论和对话推进作用。
- source_word: ἀπελθόντες
  choice: 去
  rationale: 该分词附属于第一人称复数虚拟式，表示先去、继而收拢的行动；汉语用连动式“去把……”最自然。
- source_word: συλλέξωμεν
  choice: 收起来
  rationale: 基本意义是聚集、收集。结合杂草的语境，“收起来”自然表达将其集中清除的行动，同时不把本节未明说的“拔”直接加入正文。
- source_word: αὐτά
  choice: 它们
  rationale: 中性复数代词回指上文的杂草；汉语以“它们”保留原文的代词形式和上下文衔接。
theological_decisions:
- issue: 比喻语境中δοῦλοι的译法
  choice: 奴仆
  alternative: 仆人
  rationale: 原词可按语境指奴隶或仆役。这里人物受家主支配，“奴仆”较充分保留古代社会关系；但比喻的焦点并不取决于其法律身份，因此以脚注保留“仆人”这一较宽泛译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仇敌”保留经文语体而不过分古雅；“那么，你要我们去……”符合自然对话。“收起来”避免生硬的“收集它们”，也避免把下一节明确出现的连根拔除概念提前写入本节。
