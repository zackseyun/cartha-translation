  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: zh_hans
  text: 许多群众聚集到他那里，以致他登上一条船，坐下[a]；全体群众都站在岸上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上了船，坐下来。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“沙滩上”或“海边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: 聚集到他那里
  rationale: συνήχθησαν虽为被动形式，在此自然表示人群聚拢；πρός加宾格表示朝向某人。“聚集到他那里”既保留方向，也符合现代汉语表达。
- source_word: ὄχλοι πολλοί
  choice: 有许多人
  rationale: 原文复数ὄχλοι配πολλοί强调人数众多或多批人群。汉语直译“许多人群”生硬，因此用“有许多人”自然传达场面的规模，同时避免误解为一个有明确边界的群体。
- source_word: ὥστε
  choice: 以致
  rationale: ὥστε引出实际结果；“以致”清楚保留结果关系，又不额外说明耶稣上船的动机。
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: 上了船，坐下来
  rationale: ἐμβαίνω在此指登上或进入船中，καθῆσθαι指坐下。“上了船，坐下来”简洁自然，并保留两个连续动作。
- source_word: πᾶς ὁ ὄχλος
  choice: 众人都
  rationale: 原文从复数人群转为集合性的单数“全体人群”。“众人都”在汉语中自然表达无一例外的整体，同时与前文衔接顺畅。
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: 在岸上
  rationale: αἰγιαλός可指岸、沙滩或海岸；“岸上”是中性而宽泛的译法，并与船所在的水面形成清楚对照。
- source_word: εἱστήκει
  choice: 站
  rationale: 该形式描写众人已经处于站立状态；汉语“站在岸上”自然呈现场景，无须机械体现希腊语过去完成时的形式。
