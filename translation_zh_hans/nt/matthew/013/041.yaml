  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: zh_hans
  text: 人子要差遣他的天使；他们要从他的国中，把使人跌倒的一切事物[a]，以及那些行不法之事的人[b]，都收聚出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一切绊脚石”。希腊词 σκάνδαλα 可指使人犯罪、跌倒或背离的人、事物或影响。
    reason: lexical_alternative
  - marker: b
    text: 直译“那些行不法的人”。这里的措辞可强调持续或具有行为特征的对上帝律法的违背。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: 要差遣
  rationale: 将来时表示将要发生的行动；“差遣”既体现受命派出，也符合庄重而自然的现代汉语表达。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一称号的传统译法及其与《但以理书》异象语言的互文联系，不将其释义化。
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: 他的天使
  rationale: 在末世审判的语境中，ἄγγελοι 指天上的天使，而非一般的人间使者。
- source_word: συλλέξουσιν
  choice: 都收聚出来
  rationale: 保留“聚集、收拢”的基本意义及上下文的收割意象；配合 ἐκ，以“出来”表达从国中移出。
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: 从他的国中
  rationale: ἐκ 表明从某一范围之内移出；“国中”比单说“从他的国”更清楚地体现内部范围。
- source_word: πάντα τὰ σκάνδαλα
  choice: 一切使人跌倒的
  rationale: σκάνδαλα 可指使人犯罪、背离或败落的人、事物或影响。用“使人跌倒的”保留开放范围，不擅自限定为物件或个人。
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: 那些行不法之事的人
  rationale: 保留 ποιέω 与 ἀνομία 的组合及其道德—神学含义；“行不法之事”比笼统的“作恶”更贴近原文。现在分词在此描述这类人的行为特征。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου 的称号表达
  choice: 人子
  alternative: 人之子／那位属人的
  rationale: “人子”是中文圣经传统中成熟且可理解的称号，也保留其末世性及与《但以理书》第七章的可能联系。
- issue: σκάνδαλα 在审判语境中的范围
  choice: 一切使人跌倒的
  alternative: 一切绊脚石／一切使人跌倒的事物
  rationale: 原词可能涵盖引人犯罪的人、事物或影响。省去限定名词，可保存原文在具体所指上的宽度与张力。
- issue: ποιοῦντας 现在分词的行为特征
  choice: 那些行不法之事的人
  alternative: 那些一贯行不法之事的人
  rationale: 现在分词可体现持续或特征性的行为，但正文不额外加入“一贯”，以免把语法体意义说得过满；相关含义放在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“收聚出来”略带经文语体，以保留收割和聚集的意象；句中用“把”字结构处理较长的并列宾语，使信息层次清楚。脚注标记均紧随其所解释的正文成分。
