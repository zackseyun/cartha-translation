  terminology: “先知”“耶稣”“家乡”均恰当。“不受尊重／受尊重”适宜传达ἄτιμος的荣誉语义。“反感”可以接受，虽较“被冒犯／感到冒犯”弱化了受冒犯的语气，但在本节的语境中仍是安全、自然的译法。
