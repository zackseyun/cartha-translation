  source_fidelity: “他们就因他而反感”基本传达ἐσκανδαλίζοντο ἐν αὐτῷ在此处所指的冒犯、排斥反应；“耶稣却对他们说”准确体现δέ的轻微转折。“家里的人中间”可表达οἰκίᾳ的家户／家庭圈子含义，并以脚注保留“家中”的可能性。主要问题在格言后半句的双重否定：“在哪里都不会不受尊重”虽意图保留原文形式，却不合现代汉语惯用逻辑，容易造成理解停顿。
