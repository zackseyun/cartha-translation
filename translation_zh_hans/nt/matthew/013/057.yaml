  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: zh_hans
  text: 他们就因他而反感[a]。耶稣却对他们说：“先知除了在自己的家乡[b]和家里的人[c]中间以外，在哪里都受尊重。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们就因他跌倒”。这里的“跌倒”不是指身体绊倒，而是指因他产生排斥或不信。
    reason: lexical_alternative
  - marker: b
    text: “家乡”也可译作“故乡”或“本乡”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“在自己家中”。希腊语既可指住所，也可指一家人或家庭圈子。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: 因他而反感
  rationale: 此处是因耶稣而产生排斥、反感，不是字面上的绊倒；这一表达自然地保留了关系指向及负面反应。
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣却对他们说
  rationale: δέ承接前文并形成轻微转折，“却”体现众人反感与耶稣回应之间的对照。
- source_word: προφήτης
  choice: 先知
  rationale: 采用现代汉语中明确、通行的对应词，并保留这句格言的直接表达。
- source_word: ἄτιμος
  choice: 不受尊重
  rationale: 体现荣誉与羞辱的社会语义；配合希腊文否定结构译作“不会不受尊重”，保留原文‘并非不受尊重，除非……’的修辞形式。
- source_word: εἰ μὴ
  choice: 除了……
  rationale: 在此例外结构中，“除了”是自然且准确的汉语表达。
- source_word: πατρίδι
  choice: 自己的家乡
  rationale: 叙事场景指耶稣成长的本地，即拿撒勒；“家乡”比“祖国”或“故土”更符合此处范围。
- source_word: οἰκίᾳ αὐτοῦ
  choice: 家里的人
  rationale: οἰκία既可指房屋，也可指家户或家庭圈子。此处与社会关系中的接纳和尊重相关，“家里的人”自然呈现其家庭成员的可能含义，同时用脚注保留“自己家中”的空间性解释。
theological_decisions:
- issue: 耶稣关于先知遭拒的格言所涵盖的范围
  choice: 译为关于先知在家乡及家庭圈子中不受尊重的一般格言，不扩大为对所有拒绝耶稣之事的教义性断言。
  alternative: 解释性地突出耶稣家人的不信，或把这句话扩展为普遍的基督论命题。
  rationale: 原文记载耶稣用格言回应当前处境。译文应保留荣辱和本地排斥的张力，但不加入希腊文本没有明说的神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“反感”清楚传达当时众人因耶稣而排斥他的语境；主句保留原文双重否定式格言结构，以维持修辞张力。“家里的人”避免将οἰκία仅理解为建筑，并以脚注保留两义。
