base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: zh_hans
  text: 他却说：“不，恐怕你们拔除杂草[a]时，会连麦子也一同连根拔起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“稗子”；更具体地说，可能指“毒麦”，一种幼苗期可能与麦子相似的杂草。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ φησιν
  choice: 他却说
  rationale: δέ在上下文中标示回应和轻微转折，译作“却”；φησιν虽为历史现在时，汉语叙事中自然译作“说”。
- source_word: Οὔ
  choice: 不必
  rationale: 这是对仆人所提行动的否定答复；“不必”比孤立的“不”更符合现代汉语对建议的回应，同时保留直接否定的语气。
- source_word: μήποτε
  choice: 免得
  rationale: 表达应避免的可能后果，“免得”自然传达警戒和预防意味。
- source_word: συλλέγοντες τὰ ζιζάνια
  choice: 拔杂草的时候
  rationale: συλλέγοντες本义为收集、聚拢，但结合除去田间杂草的行动，汉语用“拔……的时候”更自然，并与随后“连根拔出”的结果衔接。
- source_word: ζιζάνια
  choice: 杂草
  rationale: 该词指混在麦田中、幼苗期可能与麦子相似的有害植物；“杂草”清楚易懂，具体可能所指保留于脚注。
- source_word: ἐκριζώσητε
  choice: 拔了出来
  rationale: 原词强调连根拔除；在此句中“拔了出来”自然表达误将麦子一同拔起的结果。
- source_word: ἅμα αὐτοῖς
  choice: 连……也一起
  rationale: 清楚表达麦子会随杂草一同被拔出的伴随关系。
- source_word: τὸν σῖτον
  choice: 麦子
  rationale: 在麦田及与ζιζάνια对比的语境中，指麦子比泛称“谷物”更合适。
theological_decisions:
- issue: ζιζάνια在比喻中的译法
  choice: 杂草
  alternative: 稗子；毒麦
  rationale: 原词可能具体指毒麦一类幼苗期近似麦子的杂草，但植物鉴定并非绝对确定。正文采用普通读者易懂的“杂草”，脚注保留传统和较具体的可能译法，不将比喻的含义限定在单一植物上。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“不必，免得……”符合主人制止仆人行动并说明风险的语气；脚注标记已在正文“杂草”之后标出。
