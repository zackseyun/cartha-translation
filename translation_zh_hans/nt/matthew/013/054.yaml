  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: zh_hans
  text: 他来到自己的家乡，在他们的会堂里教导他们，以致他们非常惊讶，说：“这个人从哪里得来这智慧和这些大能的作为[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些能力”；指彰显能力的作为，通常被理解为神迹。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: 家乡
  rationale: 在本段叙事中，指耶稣长大并为当地人所熟悉的地方，而不是现代意义上的国家；“家乡”自然、准确。
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 未完成时描写当时持续进行的教导；汉语结合“就在……里”可自然呈现叙事中的进行状态，无须生硬添加“正在”。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 此处指犹太群体聚集敬拜和受教的会堂，是现代中文圣经语境中清楚而通行的译法。
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: 以致他们都很惊讶，说
  rationale: ὥστε表达结果；改用汉语限定动词结构，既自然又保留他的教导所产生的结果。“很惊讶”传达ἐκπλήσσομαι的强烈反应。
- source_word: Πόθεν
  choice: 从哪里得来
  rationale: 询问智慧和异能的来源；“从哪里得来”比直译“从何处”更符合现代汉语口语，同时保留来源之问。
- source_word: τούτῳ
  choice: 这个人
  rationale: 指示代词在群众话语中带有一定疏离感；“这个人”比单说“他”更能保留这种语气。
- source_word: σοφία
  choice: 智慧
  rationale: 标准且自然的对应词，指听众从耶稣教导中看出的非凡洞见。
- source_word: δυνάμεις
  choice: 异能
  rationale: 复数δύναμεις本义与“能力、大能”相关，在福音书语境中常指彰显能力的非凡作为。“异能”在中文中简洁地指向超常能力或作为，同时以脚注保留“大能的作为”这一更具行动意味的译法。
theological_decisions:
- issue: δυνάμεις用于描述耶稣非凡作为时如何翻译
  choice: 异能
  alternative: 大能的作为；神迹
  rationale: “异能”既保留能力彰显的词义核心，也符合上下文所指的超常活动；不直接译作“神迹”，可避免把原文在此处未明说的解释定为唯一含义。脚注说明其也可指彰显大能的作为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以致”清楚标示结果关系；“这个人”保留当地听众带有疏离意味的提问语气。脚注标记置于“异能”之后，使其与所解释的δυνάμεις准确对应。
