  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: zh_hans
  text: 耶稣用比喻把这一切都讲给众人听；若不用比喻，他就不对他们讲任何话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有不用比喻而对他们讲任何话。”希腊文的未完成时在这里可理解为惯常的做法，也可按一般过去的叙述来表达。
    reason: 说明第二分句可按不同汉语句式表达，并提示未完成时可能具有的惯常或叙事用法。
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: 这一切
  rationale: 保留指示词和涵盖全部内容的语气；现代汉语用“这一切”比“这一切事”更自然。
- source_word: ἐλάλησεν
  choice: 讲给……听
  rationale: 不定过去时概括耶稣此次对众人的讲论；“讲给众人听”自然表达说话对象。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: ἐν加与格在此表示方式或媒介；“用比喻”是自然、准确的现代汉语。
- source_word: τοῖς ὄχλοις
  choice: 众人
  rationale: ὄχλοις为复数，指聚集听讲的人群；“众人”简洁庄重，也避免“群众”可能带有的现代政治语感。
- source_word: χωρὶς παραβολῆς
  choice: 不用比喻
  rationale: χωρίς加属格表示“没有、离开”；汉语无需机械保留希腊语单数，类别性单数可自然译为“不用比喻”。
- source_word: οὐδὲν ἐλάλει
  choice: 他就不对他们讲什么
  rationale: 未完成时在上下文中可表达持续或惯常做法；“不……什么”自然传达“什么也不讲”，而“就”凸显这种一贯关联。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 代词回指众人，直接译出可保持原文衔接。
theological_decisions:
- issue: 第二分句未完成时ἐλάλει的叙事侧重
  choice: 译文以“他就不对他们讲什么”表达在这一讲论情境中惯常如此
  alternative: 他没有不用比喻而对他们讲什么
  rationale: 未完成时可有持续或惯常意味，但汉语不宜用生硬的进行体强行标记；以“就”配合语境保留其概括性，同时不把陈述扩大成对耶稣所有公开教导的绝对断言。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“讲给……听”符合口语理解又不过分随意；“众人”保留圣经叙事语体。脚注标记置于整节末尾，所注内容涉及第二分句。
