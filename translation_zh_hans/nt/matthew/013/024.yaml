  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: zh_hans
  text: 他又给他们讲了一个比喻，说：“天国好比[a]一个在自己田里撒下好种子的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“天国被比作一个在自己田里撒下好种子的人”。原文动词是被动形式，在马太的比喻引言中也可自然理解为“好比”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: 又……一个比喻
  rationale: ἄλλην 表示在前述比喻之外再讲一个；用“又……一个”自然地承接上下文。
- source_word: παρέθηκεν αὐτοῖς
  choice: 给他们讲了
  rationale: παρατίθημι 在这里指把教导陈明、呈现在听众面前。中文若直译为“摆在他们面前”容易被理解为实物动作，因此用自然的教学叙事表达“给他们讲了”。
- source_word: λέγων
  choice: 说
  rationale: 以“说”引出直接引语，准确表达分词与主句的连接。
- source_word: Ὡμοιώθη
  choice: 好比
  rationale: 这是马太引入天国比喻的惯用形式。中文“好比”自然地表达比较关系；被动形式的较直译法保留在脚注中。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太特有表达在现代汉语圣经语境中的简洁、通行译法，指天的统治或国度，并不把复数 οὐρανῶν 生硬译出。
- source_word: ἀνθρώπῳ
  choice: 一个……的人
  rationale: ἀνθρώπῳ 是阳性单数，指比喻中的具体人物；中文以“一个……的人”自然表达。
- source_word: σπείραντι
  choice: 撒下
  rationale: 不定过去时主动分词描述此人已经实施的播种动作；“撒下”简洁而带有完成意味。
- source_word: καλὸν σπέρμα
  choice: 好种子
  rationale: καλόν 在农业语境中表示品质良好，并为后文与莠草的对比作铺垫。
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: 在自己田里
  rationale: ἀγρός 指田地；反身性的“自己”清楚表明这田属于比喻中的那个人。
theological_decisions:
- issue: 马太的“天国”用语
  choice: 天国
  alternative: 诸天之国／天的国度
  rationale: “天国”保留马太具有神学意义的固定表达，又符合现代汉语习惯；不将复数形式机械展开，也不额外解释为某一宗派性的国度观。
- issue: Ὡμοιώθη 的被动形式及比喻公式
  choice: 好比
  alternative: 被比作／已经变得像
  rationale: 在此比喻引言中，Ὡμοιώθη 的功能是建立比较，而非断言天国发生本质变化。“好比”符合自然汉语；脚注同时保留其被动形态可能产生的较直译表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“给他们讲了一个比喻”避免“摆在他们面前”的生硬实物意象；“天国好比”保留马太比喻公式的简洁力度。
