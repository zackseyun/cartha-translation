source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: zh_hans
  text: 那时，耶稣离开众人，进了屋里。他的门徒来到他跟前，说：“请给我们讲明田间杂草[a]的比喻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“稗子”；原文也可能更具体地指一种外形像麦子的毒麦。
    reason: ζιζάνια 的具体植物所指并不完全确定；脚注保留传统译法及可能的较具体指称，正文以“杂草”保留原文歧义。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间与叙事衔接语，承接前一场景并引出随后发生的事；“那时”自然庄重。
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: 离开众人
  rationale: 不定过去时分词表示先于主要动作发生的离开；汉语按顺序表达即可。“众人”自然呈现复数群体而不显生硬。
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: 进了屋里
  rationale: 上下文表示从户外进入特定屋内；“进了屋里”准确、自然。为避免汉语中主语含混，明示“耶稣”。
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒来到他跟前
  rationale: 保留“门徒主动走近耶稣”的动作；“来到他跟前”比单说“来见他”更贴近 προσέρχομαι。
- source_word: Διασάφησον ἡμῖν
  choice: 请给我们讲明
  rationale: διασαφέω 在此要求把比喻清楚说明；“讲明”适合门徒请耶稣解释教导的语境。补入“请”使汉语请求语气自然，并未削弱命令式所表达的直接请求。
- source_word: τὴν παραβολὴν
  choice: 比喻
  rationale: “比喻”是现代汉语圣经语境中自然且稳定的体裁用语。
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: 田间稗子的
  rationale: ζιζάνια 指有害杂草，很可能是外形近似麦子的毒麦；正文采用“稗子”以兼顾传统识别度和作物田地语境，脚注保存物种不确定性。τοῦ ἀγροῦ 以“田间”自然表达其关联。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为使换场后的主语清楚，在希腊文代词所指明确处译出“耶稣”；整体保持简洁，不把比喻内容作神学性预解。
