  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: zh_hans
  text: 但另一些种子落在好土里，并结出果实：有的一百倍，有的六十倍，有的三十倍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……，一份一百倍，一份六十倍，一份三十倍。”希腊文用分配式表达列出不同的收成等级；也可译为“有的……有的……有的……”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: 另一些种子
  rationale: 中性复数形容词作名词用，按撒种比喻的上下文补出“种子”；“另一些”也保留其复数分配意义。
- source_word: δὲ
  choice: 但
  rationale: 在此与前述落在其他地方而不能正常结果的种子形成对比，现代汉语用“但”自然明确。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 直译动词“落下”，不改写成“撒在”，从而保留原文对种子落点的描写。
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: 在好土里
  rationale: 农业语境中 γῆ 指土壤；汉语惯常说种子“落在土里”，而“好土”简洁表达适宜生长、肥沃之意。
- source_word: ἐδίδου καρπόν
  choice: 就结出果实
  rationale: δίδωμι 与 καρπόν 连用表示出产、结出果实；“结出果实”自然并保留农业意象。“就”呈现叙事中的结果关系，未将未完成时机械译为持续体。
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: 有的一百倍，有的六十倍，有的三十倍
  rationale: 用汉语“有的……有的……”对应希腊文分配结构；三个数字都补明“倍”，使产量倍数在汉语中清楚且对称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“好土”“结出果实”保留比喻的传统意象；用分号后的“有的……有的……”清楚表达不同收成。脚注标记置于整节末尾，对应分配结构的另一种译法。
