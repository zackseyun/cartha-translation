    issue: “就结出果实”略加强连接关系。
    rationale: καὶ基本是并列连词；虽然语境确有结果关系，但“并”更直接保留原文的叙述连接。
  - severity: medium
    issue: 脚注的替代译法和说明不够自然、也过度界定分配对象。
    rationale: “一个……另一个……”不合现代汉语表达；希腊文的分配式表达只表明收成有不同等级，不必断定是按“不同部分的种子”还是“个别种子”来计。
