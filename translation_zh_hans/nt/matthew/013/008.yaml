revisions:
- from: 但另一些种子落在好土里，就结出果实：有的一百倍，有的六十倍，有的三十倍。[a]
  to: 但另一些种子落在好土里，并结出果实：有的一百倍，有的六十倍，有的三十倍。[a]
  rationale: 将“就”改为“并”，以免将原文的并列叙述明确化为因果结果。修订脚注，使替代译法在汉语中可理解，并仅说明原文分配结构所能确定的不同收成等级，不对其具体分配单位作超出原文的判断。
