  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: zh_hans
  text: 门徒上前来，对他说[a]：“你为什么用比喻对他们讲话？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上前来”也可译作“走近”。希腊文的分词强调门徒先来到耶稣近前，然后才说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: καί在此承接叙事。现代汉语以紧接上文的语序即可自然表达推进关系；若机械译作“然后”或“于是”，反而略显累赘。
- source_word: προσελθόντες
  choice: 上前来
  rationale: 该不定过去时分词表示门徒先走近耶稣，随后开口；“上前来”自然保留了趋近的动作及先后关系。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词指语境中已知的门徒群体；原文没有明说“他的”，因此不增译。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 忠实保留λέγω的基本意义，也能自然引出后面的直接问句；不改译为“问他”，以免抹去原文的表达形式。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 这是询问原因的普通表达，“为什么”准确、简洁，符合现代汉语。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: ἐν加与格在此表示说话的方式或媒介。汉语“用比喻”比直译“在比喻中”自然，同时保留复数所表达的比喻式言说；汉语名词通常不显式标复数。
- source_word: λαλεῖς
  choice: 讲话
  rationale: 现在时第二人称单数描述耶稣当下或一贯采用的说话方式；“讲话”在此自然庄重，并与“对他们”搭配顺畅。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 与格标明耶稣讲话的对象；“对他们”是直接且合乎现代汉语习惯的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“上前来”保留原文趋近耶稣的动作；问句使用自然口语句式，但避免过度口语化。脚注标记置于“说”之后，对应整段接近后发言的动作。
