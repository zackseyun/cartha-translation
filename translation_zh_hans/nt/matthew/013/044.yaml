  terminology: “天国”符合马太福音中ἡ βασιλεία τῶν οὐρανῶν的通行现代汉语译法。“一个人”恰当地保留ἄνθρωπος的不定指和其在此可泛指人的用法，不应无根据地限缩为“男子”。
