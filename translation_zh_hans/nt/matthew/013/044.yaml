id: MAT.13.44
reference: Matthew 13:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: zh_hans
  text: 天国好比田里藏着的宝藏[a]。有一个人发现了，就把它藏起来；他满心欢喜，便去变卖自己所有的一切，买下那块田。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“天国好比宝藏，藏在田里。”
    reason: 希腊文的比较结构直接以“宝藏”为比较项；汉语可以把“田里藏着的”处理为定语，也可以另作说明。
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: 好比
  rationale: 这是耶稣比喻中常见的比较句式；“好比”自然、庄重，并清楚保留比喻关系。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 马太福音的固定表达；“天国”是现代汉语中简洁而通行的译法，既可涵盖国度，也不排除上帝掌权的动态含义。
- source_word: θησαυρῷ
  choice: 一件宝藏
  rationale: 该名词在比较结构中没有冠词，宜按不定指理解；量词“一件”使现代汉语表达更自然。
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: 藏在田里的
  rationale: 完成时被动分词强调宝藏处于被藏起来的状态；定语结构符合自然汉语。
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: 有一个人发现了
  rationale: 按汉语叙事语序重组，同时保留关系代词所指的宝藏和人物的不定指性质。
- source_word: ἔκρυψεν
  choice: 就把它藏起来
  rationale: 补出汉语所需的宾语“它”，清楚表明此人将所发现的宝藏重新藏好；简单过去叙事由上下文体现。
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: 他欢喜极了
  rationale: 原短语以喜乐说明随后行动的动因；此译自然传达强烈喜悦及其推动作用，同时脚注保留较形式对应的因果表达。
- source_word: ὑπάγει
  choice: 便去
  rationale: 保留叙事动作的推进；“便”也自然承接由喜乐引出的行动。
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: 卖掉自己所有的一切
  rationale: 完整保留πάντα ὅσα的全面性，表明他出售全部所有物。
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: 买下那块田
  rationale: “那块田”准确反映指示词ἐκεῖνον，强调就是藏有宝藏的那块田。
theological_decisions:
- issue: βασιλεία的含义范围
  choice: 天国
  alternative: 天的统治／天的国度
  rationale: βασιλεία可指王权、统治或国度；正文采用通行的“天国”，但不把其意义限定为地点，也不排除上帝掌权的动态含义。
- issue: ἄνθρωπος的人物表达
  choice: 一个人
  alternative: 一名男子
  rationale: ἄνθρωπος在此虽为阳性形式，却可泛指人；上下文没有必须突出生理性别的信息，因此用自然且忠实的不定指“一个人”，不据此引申教义含义。
- issue: 比喻对应范围
  choice: 让“天国好比”在语法上直接连接宝藏，同时保留整个故事作为比喻场景
  alternative: 明确解释天国只对应宝藏，或明确对应寻宝人的全部行动
  rationale: 希腊文在语法上以宝藏作比较项，但比喻的意义也由发现、喜乐、变卖和买田的整个叙事展开；译文不替读者排除其中任何一层。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“藏起来”“卖掉”“买下”是普通读者易懂的现代表达；句子分为三句，以避免希腊文长句在汉语中过于拖沓，同时保留发现、再藏、欢喜、变卖、买田的动作次序。
