revisions:
- from: 因为凡是有的，还要给他，使他富足有余；但凡是没有的，连他所有的也要从他那里夺去。
  to: 因为凡有的，还要给他，他就会有余；但凡没有的，连他所有的也要从他那里拿走。
  rationale: 修订保留原文未说明“有”之对象的开放性、阳性单数泛指在汉语中以“他”呈现的效果，以及καί的递进语气；同时以“他就会有余”表达丰盛的结果，避免加入使役者或物质化含义，并将“夺去”调整为更中性的“拿走”。
