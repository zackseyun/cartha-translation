    rationale: περισσευθήσεται表达此人将处于丰盛、有余的状态；原文并未明确一个“使他……”的施事者。“富足”在现代汉语常偏向物质财富，可能不必要地缩窄原文未明说的对象。
  - severity: low
    issue: “夺去”语气偏强。
    rationale: ἀρθήσεται ἀπ’ αὐτοῦ的基本意思是“将从他那里被取去／拿走”。“夺去”可能暗示强夺，超出原文在此未具体说明的方式。
  - severity: low
    issue: “凡是有的／凡是没有的”略不自然且指称易悬空。
    rationale: 该处ὅστις引出的是泛指的人。汉语格言体用“凡有的／凡没有的”更自然，并能由后接“他”清楚显示其指人。
  revised_text: 因为凡有的，还要给他，他就会有余；但凡没有的，连他所有的也要从他那里拿走。
