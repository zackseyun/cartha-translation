  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: zh_hans
  text: 因为凡有的，还要给他，他就会有余；但凡没有的，连他所有的也要从他那里拿走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: 凡是……的
  rationale: 不定关系代词引出普遍原则；“凡是……的”在现代汉语中自然，并保留逐一适用的概括意义。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文作解释；“因为”清楚表达其因果说明作用。
- source_word: ἔχει
  choice: 有
  rationale: 原文没有明说所拥有的对象，译文同样不补出“领悟”“知识”等，以保留语义开放性。
- source_word: δοθήσεται αὐτῷ
  choice: 还要给他
  rationale: 保留被动意义在汉语中的自然表达，并以“还”体现进一步赐予的语势，而不明确补入原文没有的名词性宾语。
- source_word: περισσευθήσεται
  choice: 使他富足有余
  rationale: 该动词表达增多而达到丰盛的结果；此译法自然庄重，并与前面的赐予构成结果关系。
- source_word: δὲ
  choice: 但
  rationale: 明确标示前后两种情形的对比。
- source_word: οὐκ ἔχει
  choice: 没有
  rationale: 直接保留否定性拥有表达，也不擅自补明其对象。
- source_word: καὶ
  choice: 连……也
  rationale: 此处为递进用法，突出悖论性的结果。
- source_word: ὃ ἔχει
  choice: 他所有的
  rationale: 自然对应“他所拥有的东西”，同时不限定具体所指。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 也要从他那里夺去
  rationale: 表达从某人身上移除或取走；“夺去”保留审判式语境中的力度。
- source_word: αὐτῷ / αὐτοῦ
  choice: 他／他那里
  rationale: 保留原文阳性单数的代表性表达；汉语“凡是……的……他”可自然泛指任何人。
theological_decisions:
- issue: “有”以及“给”所涉及的隐含对象
  choice: 正文不明说对象，保留格言的广泛性和原文的含混性。
  alternative: 具体译作“有领悟的”“有信心的”或“有天国奥秘知识的”。
  rationale: 上下文涉及人对耶稣教导和天国奥秘的领受，但希腊文没有明说宾语；翻译不应替文本缩窄解释范围。
- issue: 阳性单数代词的泛指作用
  choice: 译作“他”，保留单数代表性结构。
  alternative: 改成复数“他们”，或反复使用“那个人”。
  rationale: 原文以阳性单数形式泛指；汉语中的“凡是……的……他”既忠实于形式，也可被理解为普遍适用于人。
- issue: περισσευθήσεται 的语态与结果意义
  choice: 译作“使他富足有余”，着重表达所得达到丰盛的结果。
  alternative: 较形式化地译作“他就要丰盛起来”或“他就要有余”。
  rationale: 该形式在此可表达进入丰盛状态；译文避免就语态作过度神学推论，同时保持与“给他”的紧密联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“富足有余”保留经文格言式节奏；全文不补出“更多”这一原文未明说的宾语，也不把“有”限定为某种特定属灵品质。
