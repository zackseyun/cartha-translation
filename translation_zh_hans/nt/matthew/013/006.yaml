base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: zh_hans
  text: 太阳出来时，苗被晒焦了；因为没有根，就枯干了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: 太阳一出来
  rationale: 这是属格独立结构，表示时间背景。译为“太阳一出来”自然地表达太阳升起后随即发生的情形；上下文的轻微转折可由语序和分句关系体现，无须机械补出“但是”。
- source_word: ἐκαυματίσθη
  choice: 苗就被晒焦了
  rationale: καυματίζω 的被动形式表示受热灼伤；在植物语境中，“被晒焦”准确而自然。“苗”承接上文从石头地里长出的植物，使中文指代清楚。
- source_word: διὰ τὸ μὴ ἔχειν
  choice: 又因为没有
  rationale: διά 加带冠词的不定式明确表示原因，译为现代汉语因果分句，保留原文所说明的直接原因。
- source_word: ῥίζαν
  choice: 根
  rationale: 保留希腊文单数的集合性表达；汉语“没有根”自然，无须改为复数。
- source_word: ἐξηράνθη
  choice: 便枯干了
  rationale: ξηραίνω 在植物语境中表示枯萎、干枯。“枯干”兼顾失水与凋萎的含义，并与“晒焦”形成清楚但不重复的结果描述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免无明确先行词的“它”造成生硬，补出语境所指的“苗”；不增添解释性神学措辞。
