  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: zh_hans
  text: 那一天[a]，耶稣从屋里出来，坐在海边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同一天”，若认为这句话着重表示本节与上文在时间上连续。
    reason: alternative_reading
  - marker: b
    text: “海边”也可译作“海旁”。原文只表示靠近海，并未说明距岸线多远。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 就在那一天
  rationale: 这是常见的时间表达。“就在那一天”既自然地承接上文，也未像“同一天”那样把上下文连续性说得过于明确。
- source_word: ἐξελθὼν
  choice: 出来
  rationale: 不定过去时分词在此先于主要动词发生；汉语用连动结构“从屋里出来，坐……”自然表达动作次序。
- source_word: τῆς οἰκίας
  choice: 从屋里
  rationale: 该属格与ἐξέρχομαι连用，表示离开的处所。“从屋里出来”是现代汉语的自然说法；定冠词在此不必机械译出。
- source_word: ἐκάθητο
  choice: 坐在
  rationale: 该未完成时形式描绘耶稣当时坐着的场景。汉语“坐在海边”可自然承载这一状态性、背景性的意义，无须添加“正在”。
- source_word: παρὰ τὴν θάλασσαν
  choice: 在海边
  rationale: παρά加宾格在此表示靠近海的位置。“海边”简洁自然，但不限定与岸线的确切距离。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 按现代汉语圣经人名的通行音译处理。
