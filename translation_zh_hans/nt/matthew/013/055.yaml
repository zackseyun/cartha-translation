  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: zh_hans
  text: “这不是那木匠的儿子吗？他的母亲不是叫马利亚吗？他的兄弟[a]不是雅各、约瑟[b]、西门和犹大吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟”或可理解为“亲属”或“亲族”。希腊语这个词通常指兄弟，但有人认为本处用的是较宽泛的含义。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“约西”，而不是“约瑟”。
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: 木匠
  rationale: τέκτων可泛指从事木工或建筑工作的工匠；“木匠”是本处自然、通行的译法，同时处于其语义范围之内。
- source_word: υἱός
  choice: 儿子
  rationale: 上下文明确谈论家庭关系，因此采用直接的亲子含义。
- source_word: λέγεται
  choice: 叫
  rationale: 此处现在时被动形式是表示姓名的惯用说法；现代汉语用“叫”自然明白。
- source_word: Μαριὰμ
  choice: 马利亚
  rationale: 采用现代中文《圣经》中通行的人名译法。
- source_word: ἀδελφοὶ
  choice: 兄弟
  rationale: 该词通常指兄弟。主文保留其表层常义，不替读者裁定这些人与耶稣的确切亲属关系；较宽泛的可能含义列入脚注。
- source_word: Ἰάκωβος
  choice: 雅各
  rationale: 采用现代中文《新约》中通行的人名译法。
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 准确反映SBLGNT主文的Ἰωσήφ；异文“约西”在脚注中注明。
- source_word: Σίμων
  choice: 西门
  rationale: 采用现代中文《新约》中通行的人名译法。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用现代中文《新约》中通行的人名译法，不因其他同名人物而改换名称。
- source_word: οὐχ ... ;
  choice: 不是……吗？
  rationale: 以现代汉语反问句再现希腊文预期肯定回答的语气。为使并列的家庭成员信息清楚自然，将后一个较长的希腊文问句分为两个汉语反问句。
theological_decisions:
- issue: ἀδελφοὶ αὐτοῦ所指的耶稣家庭关系
  choice: 主文译作“他的兄弟”
  alternative: “他的亲属”或“他的族人”
  rationale: “兄弟”是该希腊词通常和表层的含义。主文不裁定他们是否为同胞兄弟或其他较广义的亲属，从而保留原文所容许的解释张力；较宽泛的理解在脚注中说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。连续使用“不是……吗？”保留原文的反问语气；中文通行人名便于普通读者辨认。
