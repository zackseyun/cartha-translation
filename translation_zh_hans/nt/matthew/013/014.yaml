  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: zh_hans
  text: '这样，以赛亚的预言正在他们身上应验；这预言说：


    “你们听是会听[a]，却绝不会明白；


    看是会看，却绝不会看见。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“你们必定听，却绝不会明白；看着必定看，却绝不会看见”。两处都以同源词重复构成强调；这是经由希腊文保留下来的希伯来语式表达。
    reason: 说明源文的同源词反复、强调结构及其在译文中的处理。
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: 应验了
  rationale: 现在时被动语态在此构成自然的预言应验表述；汉语用“应验了”简洁自然，同时不把 ἀναπληρόω 过度解释为“完全应验”。
- source_word: αὐτοῖς
  choice: 在他们身上
  rationale: 表达该预言在这些人身上成为现实，符合此处与格的语义，也符合现代汉语习惯。
- source_word: Ἀκοῇ ἀκούσετε
  choice: 你们听是会听
  rationale: 保留源文受希伯来语影响的同词强调结构，在汉语中也能自然传达“确实听”的意味。
- source_word: οὐ μὴ συνῆτε
  choice: 却绝不会明白
  rationale: “绝不会”传达 οὐ μή 的强烈否定；“却”自然呈现前后反差。
- source_word: βλέποντες βλέψετε
  choice: 看是会看
  rationale: 与“听是会听”形成平行，保留源文反复用词所产生的强调效果。
- source_word: οὐ μὴ ἴδητε
  choice: 却绝不会看见
  rationale: 保留 ἴδητε 的基本视觉用语，并借“看”与“看见”的对照传达有观看却没有真正察觉的张力。
theological_decisions:
- issue: 预言应验的性质
  choice: 译作“在他们身上应验了”，只陈述以赛亚的预言在这些人的反应中得到应验。
  alternative: 译作“在他们身上完全应验了”或仅说“在他们身上得到印证”。
  rationale: 不额外说明刚硬、预定或预表等机制，也不弱化或强化应验公式，从而保留经文本身的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听是会听……看是会看”保留引文的平行与强调；分行排列表明诗体引文。
