id: MAT.13.30
reference: Matthew 13:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: zh_hans
  text: 让两样一起生长，直到收割的时候。到了收割的时候，我会对收割的人说：‘先把稗子[a]收集起来，捆成一捆一捆的，好烧掉；但要把麦子收进我的仓里。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稗子”可能指毒麦，一种外形与麦相似的有害杂草；传统译作“稗子”。
    reason: 说明ζιζάνια可能指称的具体植物，并保留传统译名与现代读者之间的可理解性。
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: 让两样一起生长
  rationale: ἄφετε在此是许可性的命令，译作“让”；συναυξάνεσθαι明确表达一同生长，ἀμφότερα指前文的两类植物。
- source_word: μέχρι τοῦ θερισμοῦ
  choice: 直到收割的时候
  rationale: 保留时间终点和这次特定收割事件的含义，同时符合现代汉语表达。
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: 到了收割的时候
  rationale: καιρός指适当或既定的时刻；“到了”自然地引出届时发生的行动。
- source_word: τοῖς θερισταῖς
  choice: 收割的人
  rationale: 准确表达从事收割者，也比书面色彩较浓的“收割者”更通俗自然。
- source_word: Συλλέξατε πρῶτον τὰ ζιζάνια
  choice: 先把稗子收集起来
  rationale: πρῶτον标明行动次序；ζιζάνια是田间有害杂草，常指毒麦一类与麦相似的杂草，正文采用汉语圣经传统且简洁的“稗子”，脚注说明其可能所指。
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: 捆成一捆一捆的
  rationale: 译出捆扎动作以及形成若干捆束的结果；重叠表达在现代汉语中具体自然。
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: 好烧掉
  rationale: 明确保留目的关系；“烧掉”体现κατακαίω焚烧、烧尽的力度，但不额外加入解释。
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: 但要把麦子收进我的仓里
  rationale: δὲ构成对比，συναγάγετε表示聚拢收纳；“收进”在汉语中自然表达进入仓房的动作。
theological_decisions:
- issue: 比喻中最终分开的意象
  choice: 保留收割、焚烧和入仓的农业图景，不在本节正文中明说末日审判
  alternative: 将“烧掉”解释性地译成“彻底毁灭”，或直接加入末日审判措辞
  rationale: 耶稣在本章后文解释比喻；本节应保留原话的比喻形式和神学张力，不提前把解释写入译文。
translation_notes:
  register: 采用现代、庄重而通俗的叙事口吻。保留直接引语的命令节奏，并以“先……但要……”清楚呈现两项行动的对比。
