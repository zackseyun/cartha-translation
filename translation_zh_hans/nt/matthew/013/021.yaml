  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: zh_hans
  text: 但他里面没有根，只能维持一时；一旦因这道遭遇患难或迫害，他立刻就跌倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”也可译为“被绊倒”或“受冒犯”；希腊词可指因某事被绊倒或产生反感。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: 他里面没有根
  rationale: 保留撒种比喻中的“根”这一农业意象，也传达反身表达所指的内在扎根状态；现代汉语自然清楚。
- source_word: πρόσκαιρός
  choice: 只能维持一时
  rationale: 表达仅持续有限时间，且比直译为“暂时的”更适合描述人不能持久的语境。
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: 一旦……遭遇患难或迫害
  rationale: 将属格独立结构按时间关系表达；“一旦”也自然衔接随即发生的跌倒。
- source_word: θλίψεως
  choice: 患难
  rationale: 保留受压、困苦的严肃含义，是现代中文圣经语境中清楚而不古奥的用词。
- source_word: διωγμοῦ
  choice: 迫害
  rationale: 准确表达因认同并持守所传信息而受到的敌对逼迫。
- source_word: διὰ τὸν λόγον
  choice: 因这道
  rationale: “道”保留 λόγος 的福音书用语及其与上下文的词汇联系；“这”明确指本比喻中所听见的信息。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确传达动作迅速发生的强调。
- source_word: σκανδαλίζεται
  choice: 跌倒了
  rationale: 保留该动词“被绊倒”的核心隐喻，又能在本语境中表达人在压力下不能持守；不把含义过度限定为某一套关于背道的教义。
theological_decisions:
- issue: 门徒与比喻语境中 σκανδαλίζεται 的译法
  choice: 跌倒了
  alternative: 离弃了；被绊倒了；因而厌弃这道
  rationale: 希腊词既可指被绊倒、跌倒，也可指因某事反感而放弃。正文采用自然且保留隐喻的“跌倒了”，脚注说明其他可能含义，以保留经文关于受压后失守的神学张力，而不预先判定其系统神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“可是……不过……”体现两个 δὲ 的转折推进；分号保留人物缺乏根基与患难临到后立即跌倒之间的紧密逻辑联系。
