  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: zh_hans
  text: 他又给他们讲了一个比喻，说：“天国好比一粒芥菜种；有一个人拿了它，撒在自己的田里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: 讲了
  rationale: 此处指耶稣向听众提出或陈述一个比喻。现代汉语用“给他们讲了一个比喻”自然清楚，也符合叙事语境。
- source_word: παραβολὴν
  choice: 比喻
  rationale: “比喻”是福音书语境中 παραβολή 的通行译法，保留了这一教导体裁的名称。
- source_word: Ὁμοία ἐστὶν
  choice: 好比
  rationale: “好比”自然地表达比较公式，同时避免把天国与种子作简单、穷尽式的等同。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是马太福音这一特有表达在现代汉语中的惯用译法，简洁而能承载上帝统治与国度的语义范围。
- source_word: κόκκῳ σινάπεως
  choice: 一粒芥菜种
  rationale: κόκκος 表示一粒种子；“一粒芥菜种”既体现量词，也符合现代汉语农业意象。
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: 有一个人拿去
  rationale: 将分词结构转为自然的汉语连续动作；“有一个人”保留故事中单数人物，却不额外强调性别。
- source_word: ἔσπειρεν
  choice: 撒
  rationale: σπείρω 专指撒种；汉语在宾语已明确为种子时，用“撒在田里”准确自然。
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: 在自己的田里
  rationale: “田”符合农业场景；反身领属“自己的”明确保留 αὐτοῦ 指向撒种者。
theological_decisions:
- issue: 如何翻译 βασιλεία τῶν οὐρανῶν
  choice: 天国
  alternative: 诸天的国／天的统治
  rationale: “天国”保留马太福音的固定术语和传统辨识度，又不将其意义限制为空间领域或抽象统治；具体内涵仍由上下文展开。
- issue: 比较公式所涵盖的范围
  choice: 天国好比一粒芥菜种
  alternative: 天国的情形好比一个人撒芥菜种的整个事件
  rationale: 原文在语法上直接以“天国”与“芥菜种”比较，但比喻的意义可能延伸至后续整个情景。正文保留原文的直接表达，不替读者预先消解这种张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“讲了一个比喻”比直译为“把一个比喻摆在他们面前”更符合普通话习惯；全句保留原文动作次序和农业意象。
