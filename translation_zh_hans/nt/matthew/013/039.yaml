id: MAT.13.39
reference: Matthew 13:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: zh_hans
  text: 撒下那些稗子的仇敌就是魔鬼；收割就是这个时代的终结[a]，收割的人就是天使。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个时代的终局”；传统译作“世界的末了”。
    reason: 说明συντέλεια可强调达到终局或完成，而αἰών在这里指“时代”，传统的“世界”容易被理解为空间或物质宇宙。
lexical_decisions:
- source_word: ἐχθρός
  choice: 仇敌
  rationale: 准确表达寓言中与人子敌对的具体行动者，也符合庄重而自然的现代汉语。
- source_word: ὁ σπείρας αὐτά
  choice: 撒下那些稗子的
  rationale: 分词指出仇敌先前完成的撒种行为；代词所指是上文的稗子，译文将所指明示出来，以免汉语中的“它们”含混，同时保留撒种意象。
- source_word: διάβολος
  choice: 魔鬼
  rationale: 这里是对撒稗者身份的明确解释，指作为位格性恶者的魔鬼；不按词源译作“毁谤者”，以免模糊所指。
- source_word: θερισμός
  choice: 收割
  rationale: 保留寓言的农耕意象；现代汉语中既可表示收割行动，也可按语境指收割之时。
- source_word: συντέλεια αἰῶνος
  choice: 这个时代的终结
  rationale: αἰών在此主要指时间性的时代，而非物质世界；συντέλεια表示走向终局、完成或终结。主文采用自然清楚的“终结”，其他可能表达收入脚注。
- source_word: θερισταί
  choice: 收割的人
  rationale: 以通俗自然的汉语保留行动者与收割意象；比“收割者”更符合普通读者的语言习惯。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 虽然该词也可泛指使者，但末世性语境表明这里所指是天上的使者，因此译为“天使”。
- source_word: δέ
  choice: 分号与并列结构
  rationale: 三次δέ推动解释逐项展开；汉语用分号和并列句自然体现其承接作用，不机械重复“而”或“但是”。
theological_decisions:
- issue: 末世短语συντέλεια αἰῶνος的译法
  choice: 这个时代的终结
  alternative: 这个时代的终局；世界的末了
  rationale: “时代”保留αἰών的时间意义，避免把经文预先解释为物质宇宙的毁灭；“终结”既自然，也表达συντέλεια所含的完成和抵达终局之意。脚注保留更强调圆满终局的译法及传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以“稗子”承接上下文的寓言意象；用“这个时代”避免“世代”可能被误解为一代人，并以脚注保存传统表达。
