  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: zh_hans
  text: 他找到一颗价值极高的珍珠[a]后，就去变卖自己所有的一切，并买下了这颗珍珠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一颗珍贵的珍珠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: 他找到……就
  rationale: 不定过去时分词表示先于主要动词发生的动作；δέ在此为轻微承接。汉语用“……就……”自然呈现发现之后随即采取行动的叙事关系。
- source_word: ἕνα
  choice: 一颗
  rationale: 保留原文明确的数词ἕνα，并使用珍珠的自然量词“颗”，突出这是一颗独一而价值非凡的珍珠。
- source_word: πολύτιμον
  choice: 价值极高的
  rationale: 准确表达其极高价值，语言现代清楚；“极高”体现πολύτιμος的强度。脚注保留另一种自然译法。
- source_word: μαργαρίτην
  choice: 珍珠
  rationale: 采用该词在此处的标准词义。
- source_word: ἀπελθὼν
  choice: 去
  rationale: 在连续动作中译作“去”，简洁自然，也保留离开当前所在之处去采取行动的含义。
- source_word: πέπρακεν
  choice: 卖掉了
  rationale: 该完成时形式强调出售行动已经完成；汉语“卖掉了”自然传达完成性，并与随后买下珍珠的动作衔接。
- source_word: πάντα ὅσα εἶχεν
  choice: 自己所有的一切
  rationale: 保留πάντα与ὅσα所表达的完全和彻底，强调他把所拥有的全都卖掉。
- source_word: ἠγόρασεν
  choice: 买了下来
  rationale: “买了下来”是现代汉语中自然的完成性表达，清楚说明交易已经完成。
- source_word: αὐτόν
  choice: 它
  rationale: 代词指回阳性名词μαργαρίτην；汉语按实际所指使用无生命代词“它”。
