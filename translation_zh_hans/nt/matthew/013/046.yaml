  - severity: low
    issue: “卖掉”可改为“变卖”
    rationale: 两者都不违背πέπρακεν；“变卖自己所有的一切”在此交易语境中更凝练自然，并清楚体现出售全部财物以购得珍珠。
  revised_text: 他找到一颗价值极高的珍珠[a]后，就去变卖自己所有的一切，并买下了这颗珍珠。
