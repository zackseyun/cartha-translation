  to: 他找到一颗价值极高的珍珠[a]后，就去变卖自己所有的一切，并买下了这颗珍珠。
  rationale: 修订仅消除汉语代词指代歧义，并以更自然的“变卖”表达出售全部所有；保留原文的动作先后、明确的单数“一颗”、价值强调以及购买对象。
