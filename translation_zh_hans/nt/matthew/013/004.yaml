  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: zh_hans
  text: 他撒种的时候，有些种子[a]落在路旁，鸟儿来了，把它们吃尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“有些东西”；根据上下文，这里补出“种子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: 他撒种的时候
  rationale: ἐν加带冠词的不定式表达同时发生的时间；此译自然、准确。
- source_word: ἃ μὲν
  choice: 有些种子
  rationale: 原文直译为“有些东西”，在上下文中指撒出的种子；补出“种子”使现代汉语清楚通顺，同时以脚注说明原文形式。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 不定过去时在叙事中表示发生的事件，译作“落在”简洁自然。
- source_word: παρὰ τὴν ὁδόν
  choice: 路旁
  rationale: παρά加宾格在这里表示路的旁边；“路旁”符合农田间道路的场景，也保留空间关系。
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: 鸟儿飞来
  rationale: 将表示先后动作的不定过去时分词自然转为汉语谓语；πετεινά指鸟类或飞禽，“鸟儿”最为通俗。“飞来”在汉语中贴合鸟的动作，且不增添平行经文中的“天空”或“空中”。
- source_word: κατέφαγεν
  choice: 吃尽了
  rationale: κατεσθίω含有吃光、吞吃的加强意味；“吃尽了”既体现结果和力度，又比“吞噬”更适合鸟吃种子的日常画面。
- source_word: αὐτά
  choice: 它们
  rationale: 代词回指落下的种子；“它们”清楚且避免重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“路旁”简洁呈现农业场景；“吃尽了”保留原动词的加强语气。
