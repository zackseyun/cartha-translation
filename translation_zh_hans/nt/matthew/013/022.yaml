revisions:
- from: 那撒在荆棘里的，就是听见这道的人；可是今世的忧虑[a]和财富的迷惑[b]把道挤住了，他就结不出果实来。
  to: 那撒在荆棘里的，指的是听了道的人；这个时代的忧虑[a]和财富的欺骗[b]把道挤得不能生长，他就结不出果实来。
  rationale: 修订使“这个时代”更直接对应αἰών，将“财富的欺骗”明确对应ἀπάτη，并以“挤得不能生长”更充分传达συμπνίγει在农业比喻中的窒息性效果。末句仍以“他”指听道者，保持原文解释段落的个人指向。
  reviewer_model: gpt-5.6-terra
