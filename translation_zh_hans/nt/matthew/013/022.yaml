source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: zh_hans
  text: 那撒在荆棘里的，指的是听了道的人；这个时代的忧虑[a]和财富的欺骗[b]把道挤得不能生长，他就结不出果实来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个时代的忧虑”也可译作“今世的忧虑”或“这个世界的忧虑”。
    reason: αἰών主要指时代；“今世”和“世界”是按语境常见的替代表达。
  - marker: b
    text: 也可译作“钱财的欺骗性”。
    reason: ἀπάτη指欺骗、迷惑；此处属格表达财富具有使人受骗的欺骗性。
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: 那撒在荆棘里的
  rationale: 保留撒种比喻的意象，并按阳性单数分词所指向的个人来表达；“在荆棘里”是符合现代汉语习惯的说法。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: 听见这道的人
  rationale: 将现在分词自然地译成关系性短语；“道”在本段指所传讲的信息，也与上下文用语保持连贯。
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: 今世的忧虑
  rationale: μέριμνα带有牵挂、焦虑之意；“今世”保留αἰών的时代性含义，同时在现代汉语中自然凝练。
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: 财富的迷惑
  rationale: ἀπάτη表示欺骗或迷惑，属格结构描写财富具有使人受骗、被迷惑的力量；“财富”比“ riches ”式的古旧表达更现代。
- source_word: συμπνίγει
  choice: 把道挤住了
  rationale: 该动词可表示挤压以致窒息；“挤住”既保留荆棘拥挤压制植物的农业画面，也符合自然汉语。
- source_word: ἄκαρπος γίνεται
  choice: 他就结不出果实来
  rationale: 用结果性表达传达“成为不结果实的”；以“他”承接前面的听道者，避免让读者误以为是道本身内在地失去效力。
theological_decisions:
- issue: αἰών的译法
  choice: 今世
  alternative: 这个时代；这个世界
  rationale: αἰών首先指时代或世代；“今世”既保留其时间和道德语境，也不把它限定为物质世界。脚注列出较直白的时代性译法。
- issue: 结不出果实者的指代
  choice: 他就结不出果实来
  alternative: 它就不结果实；道就不能结果
  rationale: 本句虽延续种子的比喻，却已明确解释为“听见这道的人”；采用人称指代，保留经文从种子意象转向听道者的解释过程，并避免暗示道本身有缺陷。
- issue: συμπνίγει的比喻力度
  choice: 把道挤住了
  alternative: 使道窒息了；把道挤掉了
  rationale: “挤住”保存荆棘围困并压制生长的画面，但不将比喻过度解释成道完全消失或被毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这道”承接本章撒种比喻中的核心用词；“挤住”延续荆棘的农业意象。“他就结不出果实来”自然表达结果，同时清楚指向听道者。所有脚注标记均已置于正文相应位置。
