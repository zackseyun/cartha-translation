  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: zh_hans
  text: 耶稣上前来，对他们说：“天上地上一切的权柄都已经赐给我了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上地上一切的权柄都赐给了我。”希腊语的不定过去时被动语态可这样较为形式对应地翻译；正文用“已经……了”表达授予已经完成，并且其效力持续到现在。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前来
  rationale: 该不定过去时分词表示耶稣朝门徒走近；“上前来”自然保留了空间移动的含义。
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: 对他们说
  rationale: 汉语若逐字译为“对他们讲话，说”会显得重复；合译为“对他们说”可自然表达讲话动作、间接对象和引出直接引语的功能。
- source_word: Ἐδόθη μοι
  choice: 都已经赐给我了
  rationale: 保留被动和领受者。“已经……了”表达已经完成而结果持续至今的授予；“赐”符合权柄由上位者授予的语境，但不明说施事者。
- source_word: πᾶσα ἐξουσία
  choice: 一切的权柄
  rationale: πᾶσα修饰单数抽象名词，表达权柄的全部范围；ἐξουσία主要指合法的统治权、权限或权威，故译“权柄”而非仅指能力的“力量”。
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: 天上地上
  rationale: 采用自然、庄重且简洁的现代汉语对举，涵盖天与地两个领域，并保留介词短语对权柄范围的限定。
theological_decisions:
- issue: 耶稣拥有普世权柄的表述
  choice: 天上地上一切的权柄都已经赐给我了
  alternative: 天上地上一切的权柄都赐给了我
  rationale: 保留Ἐδόθη的被动授予结构，不改写为单纯的“我拥有”，从而维持经文所呈现的授予关系；同时不补出未明说的施事者。“已经……了”突出完成之事的当前效力，另一译法则更形式对应不定过去时。
- issue: ἐξουσία的语义
  choice: 权柄
  alternative: 权力／能力
  rationale: “权柄”兼有正当权限和统治权之意，比“能力”更准确，也避免把本句缩减为对力量大小的陈述。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“上前来”保留动作感；将ἐλάλησεν……λέγων自然合译，避免生硬重复。脚注标记置于所解释的整句话之后。
