id: MAT.28.2
reference: Matthew 28:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: zh_hans
  text: 看哪，发生了大地震，因为主的一位天使从天上下来，走上前去，把石头滚开，坐在上面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、凸显突发景象的叙事语气，同时采用庄重而易懂的现代汉语表达。
- source_word: σεισμὸς ... μέγας
  choice: 大地震
  rationale: 直接传达形容词 μέγας 对地震规模或强度的强调。
- source_word: ἄγγελος ... κυρίου
  choice: 主的一位天使
  rationale: κυρίου 无冠词，按常见新约用法译为“主”；加入“一位”使汉语自然，同时不把该天使特定化。
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: 从天上下来
  rationale: 准确保留移动的来源和方向。
- source_word: προσελθὼν
  choice: 走上前去
  rationale: 表达向坟墓或石头接近的动作；原文未明确宾语，因此不擅自补出。
- source_word: ἀπεκύλισε τὸν λίθον
  choice: 把石头滚开
  rationale: 体现 ἀποκυλίω 将圆石滚离原位的动作。
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: 坐在上面
  rationale: αὐτοῦ 最近且自然的先行词是“石头”；汉语可省略重复名词而保持所指清楚。
theological_decisions:
- issue: 地震与天使降临之间 γάρ 的关系
  choice: 因为主的一位天使从天上下来
  alternative: 原来主的一位天使从天上下来
  rationale: 保留 γάρ 所表达的解释或原因关系，不另行断定地震的具体物理机制。
- issue: 天使降下、接近、滚石和坐下的时序与体貌
  choice: 下来，走上前去，把石头滚开，坐在上面
  alternative: 已经下来……并正坐在上面
  rationale: 按希腊文分词与主要动词呈现自然的动作推进；不依英语过去完成时额外强化先后时间。
translation_notes:
  register: 采用现代、庄重、清楚的叙事语体。“看哪”保留经文的突显效果；其余句式避免过度文言化。
