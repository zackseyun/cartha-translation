  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: zh_hans
  text: 如果这事传到总督那里[a]，我们会说服他，使你们不必担心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果总督听说这事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使你们无忧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: 被……听见
  rationale: 保留原文不定过去时被动语态；这里按语境指这件事被人听说、传入总督耳中。
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: 被总督
  rationale: ἐπί加属格与“听见”连用，在此表示事情进入总督的听闻范围。正文采用简洁自然的汉语被动结构，脚注保留“传到总督那里”的惯用表达。
- source_word: ἡγεμόνος
  choice: 总督
  rationale: 在本段罗马行政语境中，ἡγεμών特指省级总督，即彼拉多；“总督”准确而通行。
- source_word: πείσομεν αὐτόν
  choice: 我们会说服他
  rationale: πείθω通常意为“说服、劝服”。正文不补出原文未明说的说服内容，也不把它明确解释为贿赂、安抚或欺骗。
- source_word: ἀμερίμνους
  choice: 无事
  rationale: 该词本义是“无忧、无须挂虑”；结合守卫可能受处分的处境，“保你们无事”自然表达使他们免受麻烦或后果，同时脚注注明较直译的说法。
- source_word: ποιήσομεν
  choice: 保……
  rationale: ποιέω与表语形容词连用，直译为“使……成为”。汉语以“保你们无事”表达其使役和结果含义，更自然顺畅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被总督听见”保留希腊文被动表达；“保你们无事”符合当代汉语习惯，并由脚注呈现原词“无忧”的字面含义。
