  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: zh_hans
  text: 说：“你们要说：‘他的门徒夜里[a]来，在我们正在睡觉的时候把他[b]偷走了。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在夜间”。原文的νυκτός在这里表示他们前来的时间。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他”，不是“他的身体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词引出所吩咐的内容；中文叙事中直接译为“说”自然简洁。
- source_word: Εἴπατε
  choice: 你们要说
  rationale: 第二人称复数不定过去时命令式；“你们要说”保留明确的复数对象和命令语气。
- source_word: ὅτι
  choice: 以直接引语的标点体现
  rationale: ὅτι在此引出所说的内容；现代中文用引号即可自然表达，无须另加“即”。
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 按普通现代汉语表达所属关系，不额外解释所指对象。
- source_word: νυκτὸς
  choice: 夜里
  rationale: 该属格作副词使用，说明门徒前来的时间；“夜里”自然且准确。
- source_word: ἐλθόντες
  choice: 来
  rationale: 不定过去时分词所表示的动作先于“偷走”；中文以“来……偷走”自然呈现动作次序。
- source_word: ἔκλεψαν
  choice: 偷走了
  rationale: 准确表达盗取并带走的动作；“了”符合中文完成体叙述。
- source_word: αὐτὸν
  choice: 他
  rationale: 保留原文指人的代词，不解释性地改成“他的身体”。
- source_word: ἡμῶν κοιμωμένων
  choice: 趁我们睡觉的时候
  rationale: 属格独立结构说明事情发生时守卫正在睡觉；“趁……的时候”在中文中自然表达所宣称的时机，同时不改变报告内容。
theological_decisions:
- issue: 捏造的说法中αὐτόν所指为何
  choice: 保留人称代词“他”
  alternative: 译作“他的身体”
  rationale: 希腊原文使用人称代词αὐτόν；译作“他的身体”会加入原文未明说的解释。上下文足以表明所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留直接命令和嵌套引语结构，并以“他”维持原文措辞，不把捏造的报告解释性扩写为“他的身体”。
