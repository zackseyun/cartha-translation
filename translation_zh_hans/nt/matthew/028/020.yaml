  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: zh_hans
  text: 教导他们遵守我所吩咐你们的一切。看哪，我天天与你们同在，直到这个时代的终结[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到这个时代的末了。”传统上也译作“直到世界的末了”；希腊文所说的是这个时代（αἰών）的终结，并不特指物质世界的终结。
    reason: 说明συντέλεια τοῦ αἰῶνος的另一自然译法，并澄清αἰών在此不特指物质世界。
lexical_decisions:
- source_word: διδάσκοντες
  choice: 教导
  rationale: 现在时分词承接上一节，使教导成为使人成为门徒的持续方式；“教导”直接、自然，并保留持续施教的意味。
- source_word: τηρεῖν
  choice: 遵守
  rationale: 此处指持守并实行命令；“遵守”兼顾谨慎持守和实际顺服，比单说“服从”更能保留原词的意义范围。
- source_word: πάντα ὅσα
  choice: 一切
  rationale: 概括所有耶稣所吩咐的内容，简洁自然，并保留无所遗漏的全面范围。
- source_word: ἐνετειλάμην
  choice: 我所吩咐
  rationale: ἐντέλλομαι 表示带有权威的命令或嘱咐；“吩咐”在现代汉语中庄重自然，也保留耶稣话语的权威性。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引起郑重注意的话语标记，“看哪”保留原文的强调和庄严语气。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: 我与你们同在
  rationale: 直接表达耶稣与门徒同在；“同在”清楚、庄重，也符合现代中文宗教语境而不额外限定同在的方式。
- source_word: πάσας τὰς ἡμέρας
  choice: 天天
  rationale: 原文直译为“所有的日子”；“天天”以自然汉语保留逐日、持续不断的意味，比抽象的“永远”更贴近原文。
- source_word: συντελείας
  choice: 终结
  rationale: συντέλεια 指一段时期达到其终点或完成；“终结”既保留末期完成的意味，又比“完成”更符合此处的末世语境。
- source_word: αἰῶνος
  choice: 世代
  rationale: αἰών 在此指时代或时期，而非特指物质世界；“世代”避免误译为“世界”，并保留其时间性。
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος 的时间与末世含义
  choice: 直到这世代的终结
  alternative: 直到这世代的末了；传统译法作“直到世界的末了”
  rationale: 原文说的是 αἰών（世代、时代）达到终结，并非明确指物质宇宙毁灭。“这世代的终结”保留其末世指向，同时不把原文未说明的宇宙论含义带入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文郑重的强调语气；“天天与你们同在”兼顾汉语自然度与原文逐日持续的表达。
