  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: zh_hans
  text: 守卫因怕他而颤抖，变得像死人一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“守卫由于怕他而颤抖，变得像死人一样。”
    reason: 词汇与句式的另一种译法；“由于”明确ἀπό在此所表达的原因关系。
lexical_decisions:
- source_word: ἀπὸ
  choice: 因
  rationale: ἀπό与属格在此表示原因；现代汉语用“因”自然地表达守卫的反应源于惧怕。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ是轻微的叙事连接词；本节承接上文，汉语无需机械加入“而”或“但”，省译更自然。
- source_word: φόβου αὐτοῦ
  choice: 怕他
  rationale: φόβος表示惧怕，αὐτοῦ最自然地指上文的天使；“怕他”以现代汉语自然表达这一属格关系，同时不强化为“恐惧万分”。
- source_word: ἐσείσθησαν
  choice: 浑身发抖
  rationale: σείω的被动形式在此描写因恐惧而震颤；“浑身发抖”清楚、生动，也与前文大地震动形成词义呼应而不显生硬。
- source_word: οἱ τηροῦντες
  choice: 守卫
  rationale: 字面为“看守的人”；上下文明确指守墓者，“守卫”简洁且符合现代汉语。
- source_word: ἐγενήθησαν
  choice: 变得
  rationale: γίνομαι表示状态发生变化，“变得”保留这一动态含义。
- source_word: ὡς νεκροί
  choice: 像死人一样
  rationale: ὡς引出比较而非等同；“像死人一样”明确表示他们并未实际死亡。
theological_decisions:
- issue: αὐτοῦ（“他”）所指
  choice: 保留“他”，按上下文最自然地指前一节所述的天使
  alternative: 泛指整个天上显现的事件
  rationale: 最近且语法上最自然的先行对象是前文那位容貌如闪电的天使；保留代词也避免在正文中加入原文未明说的名词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“浑身发抖”比直译“被震动”更符合汉语对恐惧所致身体反应的表达；“像死人一样”保留比喻，不解释为实际死亡。
