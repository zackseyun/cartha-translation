  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: zh_hans
  text: 于是，耶稣对她们说：“不要害怕。去告诉我的弟兄们[a]，叫他们到加利利去；在那里，他们会见到我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的弟兄们”在这里指耶稣的门徒；希腊原文使用阳性复数称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示叙事顺序；“那时”自然庄重，也可理解为“于是”。
- source_word: λέγει αὐταῖς
  choice: 耶稣对她们说
  rationale: λέγει是叙事中的历史现在时，现代汉语通常按上下文译为过去叙事；αὐταῖς为阴性复数，故译“她们”。
- source_word: Μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 准确而自然地表达禁止或安慰性的命令。
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: 去告诉
  rationale: 两个命令依次展开；ἀπαγγέλλω含传达消息之意，此处“告诉”比“报告”更符合现代汉语口吻。
- source_word: τοῖς ἀδελφοῖς μου
  choice: 我的弟兄们
  rationale: 保留阳性复数亲属称谓及其亲密意味，不在正文中直接改释为“门徒”。
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: 让他们到加利利去
  rationale: 此处ἵνα加虚拟语气表达所传命令的内容；“让他们……去”是自然的汉语间接命令。
- source_word: κἀκεῖ με ὄψονται
  choice: 在那里，他们会见到我
  rationale: 保留地点强调和将来意义；ὄψονται基本义为“看见”，此处“见到”自然且不缩窄为“会面”。
theological_decisions:
- issue: “我的弟兄们”的所指
  choice: 正文保留“我的弟兄们”，脚注说明上下文指耶稣的门徒。
  alternative: 直接译作“我的门徒”，或扩大为所有男女跟随者。
  rationale: 原文明确使用阳性复数ἀδελφοῖς；上下文指向门徒，但保留亲属称谓可保存其神学温度和原文表达，避免在正文中消解含义层次。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“她们”明确反映希腊语阴性复数代词；“弟兄们”保留原文的性别形式及亲属意象。脚注标记置于整节末，说明正文中的相关称谓。
