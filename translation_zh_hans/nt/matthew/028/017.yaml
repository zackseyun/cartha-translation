  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: zh_hans
  text: 他们看见他，就敬拜他；但有些人疑惑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹豫”或“动摇”。希腊词可指心里不确定，未必表示坚决不信。
    reason: 词义替代
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见他，就
  rationale: 以“看见他，就……”自然表达希腊语不定过去时分词与主要动词之间的时间关系，同时保留动作先后。
- source_word: προσεκύνησαν
  choice: 敬拜他
  rationale: προσκυνέω 可指俯伏、致敬或敬拜；在马太福音复活叙事中，对象是耶稣，“敬拜”最能体现此处的崇敬分量，同时不必另行补入身体姿势。
- source_word: οἱ δὲ
  choice: 但有些人
  rationale: 带冠词的结构在此形成对照，并省略了所指群体；现代汉语补出“有些人”，自然表达群体中一部分人的反应。
- source_word: ἐδίστασαν
  choice: 疑惑
  rationale: διστάζω 可表示疑惑、犹豫或动摇。“疑惑”保留不确定感，也不像“怀疑”那样容易被理解为明确否认；其他可能含义收入脚注。
theological_decisions:
- issue: 复活后的耶稣所受 προσκυνέω 的性质
  choice: 译为“敬拜他”
  alternative: “向他俯伏”或“向他致敬”
  rationale: 上下文是门徒面对复活的耶稣；“敬拜”既符合该词在此处很可能具有的宗教分量，也没有超出希腊词和叙事语境作进一步教义阐释。
- issue: διστάζω 所表达的不确定程度
  choice: 正文译为“疑惑”
  alternative: “犹豫”或“动摇”
  rationale: 希腊词不一定表示坚定的不信，也可能描写迟疑和摇摆。正文保留张力，脚注说明其词义范围，不把人物的心理状态解释得过于确定。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看见他，就……”符合普通话表达习惯；分号凸显敬拜与疑惑之间的对照。脚注标记紧随其所解释的“疑惑”。
