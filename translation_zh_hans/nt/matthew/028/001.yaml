  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: zh_hans
  text: 安息日过后[a]，七日的第一日将要天亮的时候，抹大拉的马利亚和另一位马利亚来到坟墓察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安息日将尽时，七日的第一日将要天亮。”开头的希腊语既可理解为“安息日过后”，也可理解为“安息日晚些时候（或将尽时）”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: 安息日过后
  rationale: ὀψέ接属格可表示某段时间之后；结合复活叙事的时间背景，译作“安息日过后”最为自然。σαββάτων虽为复数形式，在犹太希腊语中可惯用地指单数的安息日。δέ在此仅作轻微承接，中文无需另加“现在”或“但”。
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: 第一日将要破晓的时候
  rationale: ἐπιφώσκω在这里自然指天色开始发亮；μίαν σαββάτων是“七日的第一日”，即一周第一日。此译法以自然中文表达原文朝向第一日破晓的时间关系。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι在此为叙事中的普通移动动词，译作“来到”自然准确。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经语境中通行且易于辨认的地名修饰式人名。
- source_word: ἡ ἄλλη Μαρία
  choice: 另一个马利亚
  rationale: 保留ἄλλη“另一个”的直接含义，并维持叙事对两位同名妇女的区分。
- source_word: θεωρῆσαι
  choice: 察看
  rationale: θεωρέω表示有意地观看、观察；“察看”比单纯“看”更能表达其关注性，又不至于强化为正式检查。
- source_word: τὸν τάφον
  choice: 坟墓
  rationale: τάφος指耶稣安葬之处；“坟墓”是现代普通中文清楚、庄重的对应词。
theological_decisions:
- issue: 复活叙事开头的时间表达
  choice: 正文译为事情发生在安息日过后、第一日将要破晓之时
  alternative: “安息日将尽、第一日将要破晓的时候”
  rationale: ὀψὲ σαββάτων可理解为“安息日过后”，也可能理解为“安息日晚些时候／将尽时”。正文按上下文采用前者，同时用脚注保留原文真实存在的歧义，不借助福音书之间的协调来消除张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话书面语。“第一日”保留犹太计日表达，并由上下文自然指向一周的第一日；“来到坟墓那里察看”避免误解为进入坟墓内部。
