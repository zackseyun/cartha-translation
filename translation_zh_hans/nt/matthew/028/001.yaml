  naturalness: “第一日将要破晓的时候”不够自然；现代标准汉语宜说“七日的第一日将要天亮的时候”。“另一个马利亚”虽可懂，但称一位已知人物为“另一位马利亚”更合乎叙事书面语。“来到坟墓那里察看”略显重复，改为“来到坟墓察看”较简洁。
  terminology: “安息日”“抹大拉的马利亚”“坟墓”均合适。“七日的第一日”是中文圣经语境中清楚且忠实地表达μίαν σαββάτων的方式，比孤立的“第一日”更不易误解。
