  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: zh_hans
  text: 她们赶快离开坟墓，怀着惧怕[a]和极大的喜乐，跑去向他的门徒报告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惧怕”也可译作“敬畏”。在本语境中，希腊语 φόβος 也可含有肃然敬畏的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: 赶快离开坟墓
  rationale: 以自然的现代汉语表达附带分词及副词 ταχὺ，保留她们迅速离开安葬地点的动作。
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: 怀着惧怕和极大的喜乐
  rationale: μετά 加属格表示伴随情形；并列保留惧怕与喜乐同时存在的张力，不把 φόβος 单一解释为负面的恐惧或敬虔的敬畏。
- source_word: ἔδραμον
  choice: 跑去
  rationale: τρέχω 的简单过去时明确表示奔跑；译作“跑去”保留原文鲜明的身体动作及其目的趋向。
- source_word: ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ
  choice: 向他的门徒报告
  rationale: 不定式表示奔跑的目的；“报告”体现传达消息之意，同时不补出原文未明说的直接宾语。μαθηταί 译作福音书叙事中通行的“门徒”。
theological_decisions:
- issue: 妇女回应中的情感张力
  choice: 惧怕和极大的喜乐
  alternative: 敬畏和极大的喜乐
  rationale: φόβος 在此可能包含面对天使显现和复活事件时的敬畏，但“惧怕”较直接地保留该词的语义宽度，也维持马太将两种情绪并置的张力；脚注说明另一种可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“赶快”“跑去”传达叙事的紧迫感；“怀着惧怕和极大的喜乐”保留原文情绪并置。
