  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: zh_hans
  text: 他不在这里，因为他已经复活了[a]，正如他所说的。来，看看他曾躺卧的地方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复活了”：希腊语动词形式为被动语态；为保留这一形式，也可较直译为“他已经被使复活了”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“他躺着的地方”或“他曾被安放的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: 他不在这里
  rationale: 这是自然的现代汉语地点表述；原文主语由上下文明确，汉语中补出“他”有助于清晰。
- source_word: ἠγέρθη
  choice: 他已经复活了
  rationale: ἐγείρω的被动形式在复活语境中可自然译作“复活了”；现代汉语若直译为“被使起来”既生硬又容易误解。脚注说明其希腊语形式为被动，以保留原文的语态信息。
- source_word: γὰρ
  choice: ；
  rationale: γάρ说明他不在这里的原因。汉语以分号直接连接因果内容更自然，语义关系仍然清楚；“因为”也可成立，但略显解释化。
- source_word: καθὼς εἶπεν
  choice: 正如他所说的
  rationale: “正如”保留καθώς所表达的对应关系，也自然指向耶稣先前的预告。
- source_word: δεῦτε ἴδετε
  choice: 来，看看
  rationale: δεῦτε是邀请或召唤，ἴδετε要求亲自察看；“来，看看”兼顾命令语气与自然口吻。
- source_word: τὸν τόπον
  choice: 地方
  rationale: τόπος指墓中安放身体的具体位置，“地方”是准确而通顺的现代汉语。
- source_word: ὅπου ἔκειτο
  choice: 他原来躺卧的地方
  rationale: ἔκειτο是不完成时的状态表达，意为“躺着、安放着”。“原来躺卧”既体现先前持续的状态，也不把它改写成明确的安放事件。
theological_decisions:
- issue: 复活陈述中的语态与施事者
  choice: 正文采用“他已经复活了”，脚注注明希腊语为被动形式
  alternative: 他已经被复活了／他已经被使从死里起来了
  rationale: 原文ἠγέρθη确为被动形式，可能暗示上帝使他复活；但现代汉语“被复活”不够自然，且容易产生不必要的语义偏差。正文以汉语惯用的“复活了”传达事件，脚注保留原文语态及其潜在神学张力，不据此排除新约其他经文所呈现的不同施事表达。
- issue: 墓中身体状态的表达
  choice: 他原来躺卧的地方
  alternative: 安放他的地方／他曾被安放的地方
  rationale: κεῖμαι主要描述躺着或处于被安放后的状态，而不是明确叙述“安放”这一动作；正文保留状态义，脚注列出可行的被安放式理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“来，看看”保持天使邀请妇女亲自察看的直接语气；避免古雅的“请看”或生硬的被动式。
