  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: zh_hans
  text: 他的容貌如同闪电[a]，衣服洁白如雪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容貌”也可译作“外形”或“样子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接词；汉语承接上文时无需明译，省略可避免加入不必要的转折或推进语气。
- source_word: εἰδέα
  choice: 容貌
  rationale: εἰδέα指可见的外表或形貌；“容貌”在此自然庄重，并适合描述天使显现时的外在形象。
- source_word: ὡς ἀστραπή
  choice: 如同闪电
  rationale: ὡς表示明喻；“如同闪电”保留原文比较，不把它解释为具体的亮度、颜色或动作。
- source_word: ἔνδυμα
  choice: 衣服
  rationale: ἔνδυμα是衣物的通称；“衣服”清楚自然，不擅自具体化为长袍等特定服饰。
- source_word: λευκόν
  choice: 洁白
  rationale: λευκόν表示白色；结合“如雪”的比喻，“洁白”是自然的现代汉语表达，强调白而不额外加入发光之意。
- source_word: ὡς χιών
  choice: 如雪
  rationale: 保留原文以雪比喻衣服之白的表达，简洁而庄重。
theological_decisions:
- issue: αὐτοῦ所指的对象
  choice: 保留为第三人称“他的”，按紧邻上下文指向第2节的主的使者
  alternative: 为消除歧义，明译为“那位天使的”
  rationale: 原文使用代词，最近的先行词是第2节从天降下的主的使者。保留代词既忠于句法，也不在本节加入原文没有重复的名词；其指向应由上下文确定，而不是理解为耶稣。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。两个“如”类比结构对应原文两个ὡς；“衣服洁白如雪”保留原文省略系词的紧凑表达。
