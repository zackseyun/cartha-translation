  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: zh_hans
  text: 她们还在路上时[a]，看哪[b]，守卫中有几个人进了城，把所发生的一切都报告给祭司长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她们走着的时候”。希腊文用属格独立结构，为接下来的事件交代时间背景。
    reason: lexical_alternative
  - marker: b
    text: “看哪”译自希腊文的提示语ἰδού，用来标示叙事中突然出现或值得注意的发展。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: 她们还在路上时
  rationale: 属格独立结构交代后续事件发生的时间背景；上下文中的指称对象是妇女，因此用“她们”。“还在路上时”自然表达同时性，又不在正文中补明目的地。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留希腊文的叙事提示语，提醒读者注意突然出现或值得留意的情节转折；“看哪”庄重而易懂。
- source_word: τινες τῆς κουστωδίας
  choice: 守卫中有几个人
  rationale: κουστωδία指守墓的卫队；此表达清楚保留τινες的部分性，即并非所有守卫都进城。
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: 进了城
  rationale: 不定过去时分词表示先于主要动词发生的伴随行动；汉语按事件次序自然译作“进了城”。
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 该动词表示把消息带去并作出报告；对象是祭司长，用“报告”比“告诉”更贴合正式呈报的语境。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 给祭司长
  rationale: ἀρχιερεῖς在第二圣殿时期语境中指祭司领袖群体，简体中文圣经语体通常译为“祭司长”。
- source_word: ἅπαντα τὰ γενόμενα
  choice: 所发生的一切
  rationale: ἅπαντα强调全部，τὰ γενόμενα指已经发生的诸事；此译简洁自然，并保留完整、无遗漏的意味。
theological_decisions: []
