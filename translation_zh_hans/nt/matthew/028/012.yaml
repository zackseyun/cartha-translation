  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: zh_hans
  text: 祭司长同长老们聚集商议后，给了士兵一大笔银钱，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναχθέντες μετὰ τῶν πρεσβυτέρων
  choice: 和长老聚集
  rationale: 分词 συναχθέντες 表示聚集、会合，μετά 加属格表示与长老一同；译文以自然的汉语顺序表达伴随关系。
- source_word: συμβούλιόν τε λαβόντες
  choice: 商议之后
  rationale: 固定表达 συμβούλιον λαμβάνω 指共同商议或议定对策；“商议之后”既表达其审议含义，也保留分词动作先于主句动作的次序。
- source_word: ἀργύρια ἱκανὰ
  choice: 一大笔银钱
  rationale: ἀργύρια 指银制货币，ἱκανὰ 在此表示数量可观；“一大笔银钱”是现代汉语中自然且贴近原文物质用语的表达。
- source_word: ἔδωκαν
  choice: 给了
  rationale: 直接对应 δίδωμι 的简单过去动作，不额外明说贿赂，以免加入原句未明言的判断。
- source_word: τοῖς στρατιώταις
  choice: 士兵
  rationale: στρατιώτης 的基本义是士兵；虽上下文显示他们担任守卫，仍保留原词的直接含义。
theological_decisions:
- issue: 省略主语的所指
  choice: 明译为“祭司长”
  alternative: 仅译作“他们”
  rationale: 希腊文的复数分词和谓语承接28:11的“祭司长”。汉语单节呈现若只用“他们”会使指代不清，因此补出承前省略的主语；“和长老”则明确长老是与其聚集商议的人。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“聚集商议之后，就……”清楚呈现两个分词与主句谓语之间的先后关系；句末逗号保留本节与下一节话语内容相连的结构。
