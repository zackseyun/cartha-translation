  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: zh_hans
  text: 看哪，耶稣遇见她们，说：“你们好！[a]”她们就上前，抓住他的脚，敬拜他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要喜乐！”希腊语 Χαίρετε 在形式上是复数命令式，字面意思与“喜乐”有关，但在这里用作问候语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向他俯伏”或“向他致敬”。希腊语 προσεκύνησαν 可指俯伏、致敬或敬拜；在这里复活的语境中，“敬拜”的含义较为突出。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引起注意、增强叙事现场感的功能；用语略显庄重，但现代读者仍容易理解。
- source_word: ὑπήντησεν
  choice: 遇见
  rationale: 自然表达耶稣与她们相遇，不额外加入原文未明确强调的方向或意图。
- source_word: Χαίρετε
  choice: 你们好！
  rationale: 该词在形式上是复数命令式，字面与“喜乐”有关，但在这里作为惯用问候语；译作“你们好”最能传达其语境功能，同时以脚注保留字面可能。
- source_word: προσελθοῦσαι
  choice: 上前
  rationale: 清楚表现她们先走近耶稣，随后抱住他的脚并敬拜他的动作次序。
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: 抱住他的脚
  rationale: κρατέω表示牢牢抓住或持住；“抱住”符合此处身体姿态和现代汉语习惯，又避免“抓住”可能带来的粗暴意味。
- source_word: προσεκύνησαν αὐτῷ
  choice: 敬拜他
  rationale: 在复活后的语境中，“敬拜”能体现此动作对耶稣所具有的宗教分量；脚注同时保留该动词可表示俯伏致敬的词义范围。
theological_decisions:
- issue: 如何翻译对复活之耶稣所行的 προσκυνέω
  choice: 敬拜他
  alternative: 向他俯伏／向他致敬
  rationale: 马太福音的复活叙事使这一举动具有强烈的敬拜含义，因此正文采用“敬拜”；但该希腊词本身也可指俯伏或表示尊崇，故在脚注中保留这一真实的词义张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“看哪”保留原文的醒目标记；“你们好”使用自然的现代问候语，并以脚注说明其字面含义。句式依照原文动作顺序推进，避免加入未明说的解释。
