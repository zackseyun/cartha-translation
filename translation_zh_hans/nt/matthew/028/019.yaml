id: MAT.28.19
reference: Matthew 28:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: zh_hans
  text: 所以，你们要去，使万民成为门徒，给他们施洗，使他们归入父、子、圣灵的名下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉父、子、圣灵的名给他们施洗。”希腊文直译为“进入（或归入）……的名”，可能强调进入关系、认同或归属。
    reason: 说明介词εἰς的直译意味，并保留传统而可行的汉语表达。
lexical_decisions:
- source_word: πορευθέντες
  choice: 你们要去
  rationale: 该不定过去时分词位于主要命令语气动词之前，在这里带有伴随命令的作用。译作“你们要去”既自然，也保留差遣的力度；“你们去的时候”容易使行动显得只是附带发生。
- source_word: οὖν
  choice: 所以
  rationale: 承接第18节耶稣关于自己拥有一切权柄的宣告，表达由此得出的行动要求。“所以”在现代汉语中清楚而自然。
- source_word: μαθητεύσατε
  choice: 使……成为门徒
  rationale: 该动词具有使人成为门徒的致使含义。“使万民成为门徒”比把“门徒”生硬地用作动词更符合现代汉语。
- source_word: πάντα τὰ ἔθνη
  choice: 万民
  rationale: ἔθνη在此泛指各民族、各族群，使命范围普及所有人民。“万民”简洁庄重，也不把范围缩窄为仅仅非犹太人。
- source_word: βαπτίζοντες
  choice: 给他们施洗
  rationale: 该分词说明使人成为门徒时所施行的行动。“施洗”是现代汉语基督教语境中通行且中性的表达，不预先判定具体施洗方式。
- source_word: εἰς τὸ ὄνομα
  choice: 使他们归入……的名下
  rationale: εἰς通常表达进入某种关系或归属。“归入……的名下”在自然汉语中保留这种进入、认同和归属的意味，而不把它弱化为单纯凭借某名义行事。
- source_word: τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος
  choice: 父、子、圣灵
  rationale: 三者共同受单数“名”支配，构成并列的神圣称谓。汉语以“父、子、圣灵”自然表达，不另加原文没有的解释。
theological_decisions:
- issue: 洗礼介词εἰς在三一公式中的表达
  choice: 使他们归入父、子、圣灵的名下
  alternative: 奉父、子、圣灵的名给他们施洗
  rationale: “归入……的名下”较直接保留εἰς所含进入关系、认同或归属的方向性，同时不据此建立完整的圣礼理论。传统译法“奉……的名”自然且可行，故列入脚注。
- issue: 单数“名”与父、子、圣灵三个并列属格的关系
  choice: 保留一个共同的“名”，并列译作“父、子、圣灵”
  alternative: 分别展开为父的名、子的名、圣灵的名
  rationale: 希腊文以单数ὄνομα统摄三个并列属格。译文保留这一语法张力和三一公式的结构，不将单数改写为多个名字，也不添加超出经文的神学阐释。
- issue: βαπτίζοντες与“使人成为门徒”的关系
  choice: 以连续分句表达：“给他们施洗，使他们归入……”
  alternative: 明确译作“借着给他们施洗……”
  rationale: 该分词可说明使命实施的方式或伴随行动。正文保留较开放的连接，避免把语法关系限定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“万民”保持经文的普世范围；“施洗”避免卷入洗礼方式之争；“归入……的名下”兼顾希腊文方向性与现代汉语自然度。脚注标记置于其实际所说明的短语之后。
