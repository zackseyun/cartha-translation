  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: zh_hans
  text: 十一个门徒前往加利利，到耶稣曾为他们指定[a]的那座山去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣曾吩咐他们前往的那座山。”这里的希腊语动词可表示“指定、安排”或“指示、吩咐”。
    reason: 保留ἐτάξατο在此处既可侧重指定地点、也可侧重指示门徒前往的词义空间。
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事衔接词；现代汉语无需硬译为“于是”或“但”，上下文已能自然承接，也不宜增添原文没有明确表达的时间或转折色彩。
- source_word: ἕνδεκα μαθηταὶ
  choice: 十一个门徒
  rationale: 准确保留犹大离开后人数为十一的具体信息；“门徒”是福音书叙事中μαθηταί自然且通行的译法。
- source_word: ἐπορεύθησαν
  choice: 往……去，到了
  rationale: πορεύομαι表示前往、行进；结合两个εἰς短语，用“往加利利去，到了……山”既保留移动方向，也符合现代汉语表达。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 往加利利去
  rationale: εἰς与地区名连用，表示向该地区移动；“往加利利去”自然明确。
- source_word: εἰς τὸ ὄρος
  choice: 到了……那座山
  rationale: ὄρος可指山或山区；定冠词及随后的关系从句表明是一座特定的山，因此译作“那座山”。
- source_word: οὗ
  choice: ……的那座山
  rationale: οὗ是地点关系副词“在那里／所到之处”；汉语以定语结构表达最自然。
- source_word: ἐτάξατο
  choice: 曾为他们指定
  rationale: τάσσω在此可表示安排、指定或指示。主文采用“指定”，突出耶稣事先确定会面地点，同时以脚注保留“吩咐他们去”的可能译法。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 保留与ἐτάξατο相连的间接对象含义，并形成自然汉语。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语《圣经》中通行的人名译法。
theological_decisions:
- issue: 耶稣预先确定会面地点的表达强度
  choice: 曾为他们指定
  alternative: 曾吩咐他们去
  rationale: 上下文涉及耶稣事先安排地点；“指定”不把该动词扩大为带有制度性或教会职分意味的“任命”，也不强行判定其是否着重命令。脚注保留命令／指示层面的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“往……去，到了……”顺应汉语行程表达；“那座山”保留原文所指地点的特定性。脚注标记紧随产生词义差异的“指定”之后。
