  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: zh_hans
  text: 天使却对妇女们说：“你们不要害怕[a]，因为我知道，你们是在寻找那位被钉十字架的耶稣[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文明确写出“你们”，带有强调意味：这句安慰特别是对这些妇女说的；原文没有明说与她们形成对比的是谁。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那位曾被钉十字架的耶稣”。希腊文使用完成时被动分词，指已经被钉十字架、而这一事实仍具现实关联的耶稣。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: 天使却……说
  rationale: ἀποκριθείς与εἶπεν构成希腊叙事中常见的发言套语，直译“回答说”在此并非回答一个明确问题，现代汉语用“说”更自然；“却”保留δέ所标示的轻微转折，即从惊惧的场景转向安慰的话。
- source_word: ταῖς γυναιξίν
  choice: 对妇女们
  rationale: 指在场的成年女性；复数“妇女们”明确保留人数，也避免误解为“妻子们”。
- source_word: Μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 这是安慰语境中的自然现代汉语表达，准确传达带μή的命令式。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 希腊文显式使用第二人称复数代词，带有强调作用；汉语主语“你们”既自然，也保留安慰特别指向这些妇女的意味。
- source_word: οἶδα γὰρ ὅτι
  choice: 因为我知道
  rationale: “因为”清楚表达γάρ说明安慰理由的功能；“我知道”引出ὅτι从句的内容。
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: 那位被钉十字架的耶稣
  rationale: 定冠词加完成时被动分词将耶稣表述为“被钉十字架的那一位”。“那位……的耶稣”在汉语中自然地保留限定和尊重语气；“被钉十字架”保留被动及其已完成、结果仍相关的意味。
- source_word: ζητεῖτε
  choice: 你们是在寻找
  rationale: 现在时在此描述妇女当下正在进行的行动；“是在寻找”自然呈现其持续性，并与天使所说“我知道”的内容相接。
theological_decisions:
- issue: 安慰语中显式代词ὑμεῖς的强调
  choice: 正文保留“你们”，并用脚注说明其强调作用。
  alternative: 只译“不要害怕”，或扩译为“你们这些妇女不要害怕”。
  rationale: 原文特别把安慰指向妇女们，但没有明说她们与谁形成对比。保留“你们”而不补出对比对象，可维持原文的强调和含蓄。
- issue: τὸν ἐσταυρωμένον的完成时被动分词
  choice: 译为“那位被钉十字架的耶稣”。
  alternative: “那位曾被钉十字架的耶稣”或“被钉十字架者耶稣”。
  rationale: 所选译法既指出钉十字架是加在耶稣身上的行动，也避免把分词的持续相关性缩减为纯粹过去事件；同时不在本节中额外解释其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“天使却对妇女们说”避免机械复制希腊语“回答说”的套语，同时保留转折；“寻找”比口语化的“找”稍庄重，但仍为普通读者熟悉。正文中的[a]、[b]均与相应脚注准确对应。
