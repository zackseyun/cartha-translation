  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: zh_hans
  text: 你们要赶快去告诉他的门徒：‘他已经从死人中复活了。看哪，他正先你们一步往加利利去；你们将在那里见到他。’看哪，我已经告诉你们了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι εἴπατε
  choice: 你们要赶快去告诉
  rationale: 以自然的现代汉语表达两个分词所承载的命令语气，并保留“赶快”的紧迫感。
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: 他已经从死人中复活了
  rationale: Ἠγέρθη是神学被动式；中文“复活了”自然且不强行明说施动者，“已经”体现完成时所指向的现成结果。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 两处均保留引人注意、郑重强调的语用功能；“看哪”虽较庄重，却是现代中文圣经语体中清楚而简洁的表达。
- source_word: προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν
  choice: 他在你们前面往加利利去
  rationale: 保留προάγει既可表示走在前面、也含先行前往之意的空间关系，不将其窄化为单纯的“先到”。
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: 你们将在那里见到他
  rationale: 直译地点强调与将来时意义，同时采用自然的现代汉语语序。
theological_decisions:
- issue: 复活句中施动者是否明说为上帝
  choice: 不明说施动者，译作“他已经……复活了”
  alternative: “上帝已经使他从死人中复活了”
  rationale: 希腊文使用被动语态，虽可理解为神圣被动，但原句没有明说施动者；译文保留这一形式上的含蓄。
- issue: προάγει的含义范围
  choice: “在你们前面往……去”
  alternative: “先到……去”或“在……带领你们”
  rationale: 该动词在语境中强调耶稣先行前往加利利；所选译法保留“在前面”的意象，又不额外断定是引导门徒同行。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。引语层次明确；“看哪”保留原文两次ἰδοὺ的呼唤注意功能。全文不加脚注，因此正文无脚注标记。
