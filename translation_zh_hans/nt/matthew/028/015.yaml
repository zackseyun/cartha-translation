id: MAT.28.15
reference: Matthew 28:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: zh_hans
  text: 他们拿了银钱，就照所受的指示去做了。这一说法[a]便在犹太人中流传开来，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这一传闻”或“这一消息”。希腊语λόγος可按上下文表示“话”“消息”“说法”或“叙述”。
    reason: 保留λόγος在本语境中的词义选择空间。
lexical_decisions:
- source_word: λαβόντες
  choice: 拿了
  rationale: 不定过去时分词表示先于主句的动作；结合上一节祭司交付银钱的情境，“拿了”自然地承接叙事，也保留了“收下”的可能语感。
- source_word: τὰ ἀργύρια
  choice: 银钱
  rationale: ἀργύρια可指银子或钱财。“银钱”既保留银的具体意象，又不像“银币”那样加入原文未明确表达的形制。
- source_word: ἐποίησαν ὡς ἐδιδάχθησαν
  choice: 就照所受的指示去做了
  rationale: ποιέω是普通的“做”，διδάσκω的被动式在此指他们受到有关如何说话行事的指示；此译符合现代汉语叙事，同时保留被动含义。
- source_word: διεφημίσθη
  choice: 便……流传开来
  rationale: 该动词表示消息被广泛传播；“流传开来”自然表达不定过去时所述传播的发生，而“直到今日”说明其持续影响。
- source_word: ὁ λόγος οὗτος
  choice: 这一说法
  rationale: λόγος语义范围包括话、消息、说法和叙述。上下文指守卫按指示传播的解释性说辞；“说法”贴合语境，又不预先判定其文学体裁。
- source_word: παρὰ Ἰουδαίοις
  choice: 在犹太人中
  rationale: παρά加与格在此表示某群体之中；直译为“在犹太人中”，限定于本段所述说法的流传范围。
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: 直到今日
  rationale: 这是表示一直延续到作者所处当下的固定表达；“直到今日”简洁、庄重且自然。
theological_decisions:
- issue: Ἰουδαίοις在争议性叙事情境中的群体指称
  choice: 在犹太人中
  alternative: 在犹太民众中；在犹太地区的人中
  rationale: 原文指该说法在犹太群体中的流传，并未在本句中作超出叙事情境的普遍神学判断。“犹太人”是直接且通行的对应；“犹太地区的人”会不必要地把群体身份缩限为地域身份。
- issue: ὁ λόγος οὗτος所指内容的性质
  choice: 这一说法
  alternative: 这一传闻；这件事；这番话
  rationale: 上下文表明它指守卫受命传播的解释，但λόγος本身含义宽泛。“说法”既能指传播的内容，也避免把原文的词义张力过度限定为单纯传闻或客观事件。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“就……便……”使动作推进自然；“银钱”保留原文具体意象，“直到今日”沿用普通读者易懂的经典表达。脚注标记紧随其实际说明的“这一说法”。
