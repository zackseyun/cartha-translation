  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: zh_hans
  text: 只是，为了免得冒犯他们，你到海边去，把鱼钩抛下；把首先上来的鱼取上来，打开它的嘴，你会找到一枚斯他特币[b]。拿着它，作为我和你的税款交给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “斯他特”是一种钱币，通常约值四个德拉克马，足够缴纳两个人的圣殿税。
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: 使他们反感
  rationale: 此处指避免因圣殿税之事引起不必要的冒犯或抵触，并非明确指诱使人犯罪；“使他们反感”自然地保留了语用含义。
- source_word: θάλασσαν
  choice: 海边
  rationale: 保留希腊文“海”的称呼；介词短语在此表示前往海那里，现代汉语用“到海边去”较自然。
- source_word: ἄγκιστρον
  choice: 鱼钩
  rationale: “鱼钩”明确、自然，符合捕鱼语境。
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν
  choice: 最先钓上来的鱼
  rationale: 表达第一条从水中被钓上来的鱼，避免生硬直译为“最先上来的鱼”。
- source_word: ἆρον
  choice: 拿起来
  rationale: 保留将鱼取起的动作，并与后续打开鱼嘴的指令自然衔接。
- source_word: στατῆρα
  choice: 一枚斯他特银币
  rationale: 保留原文具体币名，同时加“银币”帮助现代读者辨识其性质；价值另以脚注说明。
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: 替我和你缴税
  rationale: ἀντί在此表示代两人支付；结合上下文明确为缴纳圣殿税，现代汉语如此表达清楚自然。
- source_word: πορευθεὶς
  choice: 你到……去
  rationale: 该分词引出随后的命令行动，译成汉语连动结构比形式化的“去了以后”自然。
- source_word: δὸς αὐτοῖς
  choice: 交给他们
  rationale: 直承前述银币；结合税款语境，“交给”比单纯“给”更贴切，同时不增加收款者身份。
theological_decisions:
- issue: σκανδαλίζω与耶稣缴纳圣殿税的关系
  choice: 译作“为了不使他们反感”，表明缴纳是为避免不必要的冒犯
  alternative: 译作“免得使他们跌倒”，可能被理解为导致道德或信仰上的犯罪
  rationale: 17:24–26先保留“儿子可以免税”的论点，本节又给出实际让步的缘由。译文不把缴税说成承认绝对义务，也不消解二者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句保持连续命令的节奏；币名音译并用脚注解释。英文咨询层的脚注标记与内容明显错位，中文稿按实际对应关系将词义说明置于[a]、币值说明置于[b]。
