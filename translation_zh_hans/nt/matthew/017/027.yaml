    issue: “使他们反感”对σκανδαλίσωμεν的表达偏弱且偏心理反应。
    rationale: 该词在这里是避免造成不必要的冒犯或绊脚石；“免得冒犯他们”在现代汉语中更直接，也不会将其误释为诱人犯罪。
  - severity: low
    issue: “斯他特银币”把στατήρ限定为“银币”。
    rationale: 原文只写币名；虽此处通常理解为四德拉克马的银币，但正文应保留原文的具体而不过度限定的表述。
  - severity: low
    issue: “钓上来的鱼拿起来”动作表达重复。
    rationale: ἆρον是取起、取走那条首先上来的鱼；中文可简洁译为“把……鱼取上来”。
