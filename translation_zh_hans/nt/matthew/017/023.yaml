  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: zh_hans
  text: 他们要杀死他，第三天他必复活[a]。门徒就非常忧愁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为被动式，直译作“他必被使复活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: 他们要杀死他
  rationale: 直译将来主动语态；“杀死”自然、准确，不加入“谋杀”所带的额外法律或道德色彩。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 第三天
  rationale: 这是表示时间的与格，译作“第三天”准确简洁；汉语无需添加介词。
- source_word: ἐγερθήσεται
  choice: 他必复活
  rationale: 这里的被动式指从死里被兴起。正文采用现代汉语中最自然明确的“复活”，脚注注明希腊文的被动形式，以保留其可能暗示上帝施行行动的语态信息。
- source_word: ἐλυπήθησαν σφόδρα
  choice: 门徒就非常忧愁
  rationale: σφόδρα 强烈修饰忧愁；“非常忧愁”庄重而通俗。按上文明确主语为门徒，中文补出“门徒”以避免代词指向含混。
- source_word: καὶ ... καὶ ... καὶ
  choice: ，……。……就……
  rationale: 不机械重复“和”；用并列、断句及“就”自然表达事件次序与门徒随即产生的反应。
theological_decisions:
- issue: 复活预言中的被动语态
  choice: 正文译“他必复活”，脚注说明原文作“他必被使复活”
  alternative: 正文译“他必被使复活”或“他必被复活”
  rationale: 希腊文 ἐγερθήσεται 是将来被动式，可能是神圣被动，暗示上帝使他复活；但“被复活”在现代汉语中生硬，“被使复活”也较拗口。正文用惯常而准确的“复活”，脚注保存原文语态及其神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。“必”表达预告的确定性；补出“门徒”承接上文，使独立经节中的指代清楚。
