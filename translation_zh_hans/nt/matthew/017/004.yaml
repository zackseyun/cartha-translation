  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: zh_hans
  text: 彼得就对耶稣说：“主啊，我们在这里真好！你若愿意，我就在这里搭三座棚[a]：一座给你，一座给摩西，一座给以利亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚”也可译作“帐篷”、“帐幕”或“棚屋”。此词指帐篷或临时搭建的棚；某些译法可能使人联想到会幕或住棚节。
    reason: σκηνάς可指帐篷或临时搭建的棚；保留其他可行译法及其可能的关联，但不在主文断定特定节期或会幕背景。
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: 彼得就对耶稣说
  rationale: ἀποκριθείς与εἶπεν构成常见的希腊语发言引介套语；现代汉语不必机械重复为“回答说”。δὲ在此推进叙事，以“就”自然表达。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος对耶稣的尊称及其可能具有的神学分量；“啊”符合现代汉语直接呼语。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 我们在这里真好
  rationale: 自然表达希腊语不定式结构；“真好”体现καλόν的正面评价，而不额外说明究竟是处境好还是继续停留好。
- source_word: εἰ θέλεις
  choice: 你若愿意
  rationale: θέλω可指意愿或愿望；“若愿意”既自然、庄重，也保留其语义范围。
- source_word: ποιήσω
  choice: 我就……搭
  rationale: 未来时在这里表达彼得主动提出要做的事；搭建临时构筑物用“搭”比泛称“做”更自然。
- source_word: σκηνάς
  choice: 棚
  rationale: σκηνή指帐棚或临时遮蔽物。“棚”简洁自然，并避免主文预先断定住棚节等特定关联；其他可能译法列入脚注。
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: 一座给你，一座给摩西，一座给以利亚
  rationale: 逐一保留μίαν的重复和分配意味；量词“座”适用于所搭的构筑物。
- source_word: ὧδε
  choice: 这里
  rationale: 原文两次出现ὧδε，译文也在“在这里”和“就在这里”中保留重复。
theological_decisions:
- issue: 耶稣受称为κύριος
  choice: 主
  alternative: 老师；主人
  rationale: “主”既可作为尊称，也不排除更深的基督论含义，因而不把称谓削弱为单纯礼貌用语。
- issue: 登山变像场景中σκηνάς的所指与联想
  choice: 棚
  alternative: 帐棚；帐幕；住棚
  rationale: 经文本身没有明确说明这些构筑物与住棚节有关。主文采用中性译法，脚注保留可承载会幕或节期联想的其他译法，以免替读者解决文本未明说的问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼得就对耶稣说”避免生硬直译希腊语套语；“主啊”“你若愿意”保持直接引语的敬意。脚注标记紧随“棚”，使其明确对应σκηνάς。
