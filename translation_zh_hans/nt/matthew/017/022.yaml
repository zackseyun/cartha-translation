source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: zh_hans
  text: 他们在加利利聚集时[a]，耶稣对他们说：“人子将要被交在人手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集”也可译作“聚在一起”。
    reason: lexical_alternative
  - marker: b
    text: “被交”也可译作“被交付”或“被交出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: 聚集
  rationale: 该词是属格独立结构中的现在分词，表达众人聚在一起；“聚集”保留群体会合之意，又不额外限定他们是在行走还是停留。
- source_word: δὲ
  choice: ……的时候
  rationale: δέ在这里承接上下文，而属格独立结构自然译作时间背景；汉语用“……的时候”即可流畅表达两者。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: 在加利利
  rationale: 按其通常的地点含义直译，不扩展为“遍行加利利”。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 准确、自然地表达λέγω加间接受词的结构。
- source_word: Μέλλει
  choice: 将要
  rationale: 表达即将发生或正在逼近的行动，但不把它强化为命定或宿命。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用汉语圣经传统中清楚而凝练的对应语，保留耶稣这一自称的互文和神学张力。
- source_word: παραδίδοσθαι
  choice: 被交
  rationale: 保留被动语态及“交出、交付”的宽泛含义，不提前把行动只解释为背叛或司法移交。
- source_word: εἰς χεῖρας
  choice: 在……的手里
  rationale: 保留原文“进入人的手中”这一权势和控制的身体隐喻，同时采用自然汉语表达。
- source_word: ἀνθρώπων
  choice: 人
  rationale: 希腊语在此泛指人类或人间的行动者；译作“人”既自然，也保留“人子”与“人的手里”之间的措辞呼应。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的
  rationale: “人子”较贴近原文固定表达，并保留福音书及其经文背景中的丰富含义；解释性译法会不必要地缩窄这种张力。
- issue: 受难预告中παραδίδοσθαι的含义
  choice: 被交
  alternative: 被交付；被出卖
  rationale: “被交”保留原文被动式以及行动者未明说的特点，也不把含义仅限于犹大的出卖；原文可涵盖从出卖到交付掌权者的一连串行动。
- issue: ἀνθρώπων与“人子”的关系
  choice: 人的手里
  alternative: 人们的手中
  rationale: “人”在现代汉语中可泛指人类；此译法保留原文在“人子”和“人”之间可能有意形成的语言呼应，而不推断这些人必定全是男性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在加利利聚集的时候”保留原文属格独立结构的背景功能；“将要被交在人的手里”保留将来临近感、被动语态及“手”的隐喻。所有脚注标记均已置于正文相应位置。
