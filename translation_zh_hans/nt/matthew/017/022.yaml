  to: 他们在加利利聚集时[a]，耶稣对他们说：“人子将要被交在人手中[b]。”
  rationale: 修订仅改善现代汉语搭配，并使脚注b保持与原文παραδίδοσθαι相称的宽泛语义。‘被交在人手中’保留被动式、将临意味以及‘手’所表达的受人掌控意象；未指定交出者，也未将其预先限定为犹大的出卖或司法移交。
