source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: zh_hans
  text: 但我告诉你们，以利亚已经来了；他们却没有认出他[a]，反而任意对待他[b]。同样，人子也将要在他们手下受苦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不认识他”或“不承认他”。希腊语可指未能正确辨认或确认他的身份。
    reason: lexical_alternative
  - marker: b
    text: 或译：“想怎样待他就怎样待他”或“按自己的意思对待他”。希腊语表达的是他们照自己的意愿对他采取行动。
    reason: lexical_alternative
  - marker: c
    text: 或译：“就要受苦”。希腊语表达将来、迫近的受苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: 用“但”表达 δέ 与上文预期之间的转折；“我告诉你们”自然地传达直接陈述。
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: 以利亚已经来了
  rationale: “已经来了”既表达 ἤδη，也体现不定过去时所指已经发生、且与当前有关的行动。人名采用现代中文圣经通行译名。
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: 他们却没有认出他
  rationale: ἐπιγινώσκω 在此指未能正确辨认其身份或角色；“认出”比单纯“不认识”更贴合语境。
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: 反而任意对待他
  rationale: 该表达指他们照自己的意愿对他采取行动。“任意对待他”以自然中文保留行动不受约束的意味，也让上下文中的敌意自行显明。
- source_word: οὕτως καὶ
  choice: 同样……也
  rationale: 清楚表达以利亚所受待遇与人子将受之苦之间的类比。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号在现代中文圣经中的通行译法，保留其称号性质及相关经文回响。
- source_word: μέλλει πάσχειν
  choice: 也就要……受苦
  rationale: “就要”表达 μέλλω 加不定式所含的临近、即将发生之意，同时不额外加入“命定”等更强的神学解释。
- source_word: ὑπ’ αὐτῶν
  choice: 在他们手下
  rationale: 自然地表达 ὑπό 加属格所标明的施事者，并在受苦语境中保留敌对行动者的意味。
theological_decisions:
- issue: 以利亚已经来临所指为何
  choice: 正文仍译作“以利亚”，不直接加入施洗约翰的名字。
  alternative: 可根据紧接的上下文直接释为施洗约翰，但这会把后文的解释提前写入本节。
  rationale: 本节希腊文明确说“以利亚”；译文让读者从上下文理解其所指，不在本节内消除这种指称张力。
- issue: μέλλει 与人子受苦的关系
  choice: 译作“就要……受苦”，表达即将发生。
  alternative: “将要受苦”或“注定要受苦”。
  rationale: 本句强调前面的受苦正临近，却没有仅凭 μέλλει 明说更强的神圣必然性；因此避免加入“注定”等解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但”“却”“反而”清楚呈现论述中的转折；“任意对待他”避免生硬直译，同时保留原文未具体说明其所作之事的开放性。分号呈现“以利亚已经来了”与人们未认出他的紧密对照。所有脚注标记均置于对应词句之后。
