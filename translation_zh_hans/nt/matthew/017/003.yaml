  naturalness: “看哪，摩西和以利亚向他们显现，正同他交谈。”在现代标准汉语中通顺、庄重、易懂。“看哪”略具经文语体色彩，但与原文的强调和突现效果相称；“正同他交谈”自然传达持续进行的互动。
