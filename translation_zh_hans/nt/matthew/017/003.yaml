id: MAT.17.3
reference: Matthew 17:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: zh_hans
  text: 看哪，摩西和以利亚向他们显现，正同他交谈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的篇章标记作用，以及场景突现的生动感；“看哪”在现代中文中略带庄重色彩，但仍清楚易懂。
- source_word: ὤφθη
  choice: 显现
  rationale: 该词虽在形式上是被动语态，但在此可自然表达为“显现”，既传达进入可见状态，也避免“被他们看见”在中文中的生硬。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 与“显现”搭配，直接表示显现的见证对象，同时不额外解释“他们”的身份。
- source_word: Μωϋσῆς καὶ Ἠλίας
  choice: 摩西和以利亚
  rationale: 采用简体中文圣经传统中通行的人名译法。
- source_word: συλλαλοῦντες
  choice: 交谈
  rationale: 表达彼此谈话的含义，比单纯“说话”更能体现共同交谈，同时自然、庄重。
- source_word: μετ’ αὐτοῦ
  choice: 同他
  rationale: 准确表达 μετά 加属格所表示的相伴关系，并保留原文代词，不直接替换为“耶稣”。
theological_decisions:
- issue: αὐτοῦ所指的人
  choice: 保留为“他”，在上下文中指耶稣
  alternative: 直接译作“耶稣”
  rationale: 上下文足以明确其所指；保留代词更贴近希腊文，也避免在正文中加入原文未重复的名字。
- issue: 摩西和以利亚出现的方式
  choice: 译作“向他们显现”
  alternative: 译作“被他们看见”
  rationale: 正文确认二人以可见方式出现，却不进一步界定其显现的性质或方式，从而保留叙事本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文突显事件的语气；“正同他交谈”自然呈现分词所描述的同时进行动作。
