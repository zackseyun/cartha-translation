source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: zh_hans
  text: 耶稣斥责那鬼[a]，鬼就从孩子身上出来；从那时起，孩子就痊愈了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“斥责了他（或它）”；这个代词也可能指孩子，但按下文更可能指鬼。
    reason: 保留αὐτῷ在语法形式上的指代歧义，同时说明上下文所支持的主要理解。
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: ἐπιτιμάω表示严厉责斥，在赶鬼语境中也带有权威制止的意味。“斥责”既贴近原文，也不把具体话语过度解释为单纯的“命令”。
- source_word: αὐτῷ
  choice: 那鬼
  rationale: 该与格代词在形式上可指男性或中性对象；紧接着“鬼就从他身上出来”表明，耶稣斥责的对象最可能是鬼。汉语若直译为“他”容易被误解为孩子，因此正文按语境明确为“那鬼”，并用脚注保留原文代词的歧义。
- source_word: τὸ δαιμόνιον
  choice: 鬼
  rationale: δαιμόνιον在此指邪灵。“鬼”是现代汉语圣经语境中简明、通行的对应词；“污灵”并非本节原文用词。
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: 从孩子身上出来
  rationale: 直陈赶鬼的结果。原文末尾代词指那孩子；译出“孩子”可避免连续代词造成指代混乱，同时保留“出来”的具体意象。
- source_word: ἐθεραπεύθη
  choice: 痊愈了
  rationale: 被动形式表示孩子得到医治并恢复健康。“痊愈了”在现代汉语中自然明确，又不把医治局限为特定医学过程。
- source_word: ὁ παῖς
  choice: 孩子
  rationale: παῖς可指孩子、男孩或仆人；上下文明确是父亲的儿子。“孩子”自然且准确，不引入“仆人”的不当含义。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: 从那时起
  rationale: 该短语字面为“从那一时刻起”。“从那时起”保留起点和持续结果的表达，同时比“从那一小时起”更符合现代汉语。
theological_decisions:
- issue: 耶稣斥责时，αὐτῷ所指为何
  choice: 正文译作“那鬼”
  alternative: “他”，可被理解为那孩子
  rationale: 希腊文只用代词，语法形式本身不能完全排除指向孩子；但随后鬼从孩子身上出来，强烈支持斥责对象是鬼。正文采用最符合语境的理解，脚注则保留原文形式上的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“斥责”保留耶稣话语的权威力度；用“那鬼”和“孩子”明确不同指代对象，避免汉语代词含混；“从那时起”兼顾原文结构与现代可读性。
