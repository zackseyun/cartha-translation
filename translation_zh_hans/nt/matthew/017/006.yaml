  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: zh_hans
  text: 门徒听见了，就俯伏在地，十分害怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见了，就
  rationale: 不定过去时分词在此自然表达与主句动作相连的时间关系；中文以“听见了，就”简洁呈现“当他们听见后”的叙事顺序。上文已明确所听见的是声音，因此不另补宾语。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书中 μαθηταί 的通行译法，此处特指耶稣的门徒。
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: 俯伏在地
  rationale: 该短语直指面朝下伏地的姿势；“俯伏在地”是自然、庄重的现代汉语表达，既保留身体动作，也不额外断定这是敬拜礼仪。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 十分害怕
  rationale: “害怕”准确表达 φοβέομαι；“十分”体现 σφόδρα 的强烈程度，语言自然且不夸张。
theological_decisions:
- issue: 门徒听见神圣声音后的反应性质
  choice: 呈现他们俯伏在地并强烈害怕，但不进一步界定为敬拜、恐惧或敬畏。
  alternative: 可将其解释为主要出于敬拜性的敬畏，或主要出于面对神显现时的恐惧。
  rationale: 希腊文只陈述身体姿势和强烈的害怕，没有明确为这种反应加上神学标签；译文保留这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“俯伏在地”比逐字译作“倒在他们的脸上”更符合汉语习惯，同时保留原文所描写的伏地姿势。
