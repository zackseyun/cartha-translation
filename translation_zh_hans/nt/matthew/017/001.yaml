  rationale: 修订将κατ’ ἰδίαν直接译为“单独”，使其自然修饰“领他们上了一座高山”，保留耶稣只带这三位门徒、离开其他人的意思，同时删除原文未表达的目的性和“相处”含义。其余译文保持原有正确的人名、亲属关系及叙事表达。
