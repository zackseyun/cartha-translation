    rationale: κατ’ ἰδίαν意为“私下、单独、离开众人”，在此修饰耶稣领三人上山的行动；“要”引入原文没有的意图，“与他们在一起”也把原文的分离情境改写为相处目的。
  - severity: low
    issue: 脚注的替代译法“私下带他们去”未准确对应现有译文且弱化了上山动作。
    rationale: 脚注应针对“单独”这一译词提供同义的词汇替代，如“私下”，不应以“带他们去”替换整个动作。
