  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: zh_hans
  text: 六天后，耶稣带着彼得、雅各和雅各的兄弟约翰，单独领他们上了一座高山。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “单独”也可译作“私下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: 六天后
  rationale: μετά加宾格表示时间上的随后；“六天后”是现代汉语中自然、准确的表达，也保留了与前文的时间联系。
- source_word: παραλαμβάνει
  choice: 带着
  rationale: παραλαμβάνω在此指把人带在身边、带同前往；“带着”比单说“带”更清楚地表达同行之意。
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: 彼得、雅各和约翰
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 雅各的兄弟
  rationale: 希腊语直译为“他的兄弟”，但在同位结构中最自然地修饰约翰，并以雅各为αὐτοῦ的先行词；中文若译“他的兄弟约翰”容易误指彼得或耶稣，因此适度明示雅各以准确传达句法关系。
- source_word: ἀναφέρει
  choice: 领……上了
  rationale: ἀναφέρω在这里表示带领向上；“领他们上了”自然体现登山的方向和到达。
- source_word: εἰς ὄρος ὑψηλὸν
  choice: 一座高山
  rationale: εἰς与运动动词连用表示目的地；中文借“上了一座高山”自然表达向山上行进。
- source_word: κατ’ ἰδίαν
  choice: 要单独与他们在一起
  rationale: 该短语表示与其他人分开、私下相处；结合句法位置，译文明确耶稣只带这三人离开众人，同时避免让“他们单独”被误解为三位门徒没有耶稣陪同。
theological_decisions:
- issue: 福音书叙事中的历史现在时
  choice: 按现代汉语叙事习惯译为过去完成的事件：“带着……领……上了”
  alternative: 保留形式上的现在时：“带着……领……上”
  rationale: παραλαμβάνει和ἀναφέρει虽为现在时形式，却在过去事件的叙述中发挥历史现在时的鲜活作用。现代标准汉语不以动词形态标示时态，但“了”能自然标明事件推进；这样既不改变事件时间，也避免生硬仿照希腊语形式。
- issue: αὐτοῦ所指对象
  choice: 译作“雅各的兄弟”，理解约翰是雅各的兄弟
  alternative: 译作“他的兄弟”，保留代词表层形式
  rationale: 同位语τὸν ἀδελφὸν αὐτοῦ紧随约翰之后，而αὐτοῦ按自然句法回指雅各，意为“约翰，就是雅各的兄弟”。这也符合《马太福音》其他地方对二人的称呼；明确所指是语言清晰化，不涉及额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“六天后”简洁自然；“带着……领他们上了”避免重复使用“带”。脚注标记置于整句末尾，对应κατ’ ἰδίαν的译法选择。
