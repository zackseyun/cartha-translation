  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: zh_hans
  text: 说：“主啊，求你怜悯我的儿子！他患癫痫[a]，痛苦不堪，因为他常常掉进火里，也常常掉进水里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有癫痫发作”。原文直译“受月亮影响”；这是古代用来描述类似癫痫发作病况的习语，并非精确的现代医学诊断。
    reason: 保留σεληνιάζεται的字面意象、古代语用及现代医学诊断上的不确定性。
lexical_decisions:
- source_word: καὶ λέγων
  choice: 说
  rationale: 这是承接上文的现在分词。汉语用“说”自然地延续前句动作，无须生硬补出“并且说着”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对耶稣郑重而尊崇的呼语；“啊”符合现代汉语呼告语气。
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: 求你怜悯我的儿子
  rationale: 准确表达恳求施予慈悲帮助；υἱός明确指“儿子”。
- source_word: σεληνιάζεται
  choice: 癫痫发作
  rationale: 以现代读者能理解的方式表达古代用语所指的发作性症状，同时用脚注保留其字面月亮意象及诊断上的不确定性。
- source_word: κακῶς πάσχει
  choice: 痛苦不堪
  rationale: 自然传达κακῶς对πάσχει的强烈修饰，突出其所受痛苦的严重程度。
- source_word: πολλάκις
  choice: 常常
  rationale: 准确表达反复发生，并在两个并列分句中保留原文的重复强调。
- source_word: πίπτει εἰς τὸ πῦρ
  choice: 掉进火里
  rationale: “掉进”自然表达非自主坠落；“火里”符合现代汉语习惯。
- source_word: εἰς τὸ ὕδωρ
  choice: 掉进水里
  rationale: 补出与前一分句共享的动词，使汉语并列结构清楚流畅。
theological_decisions:
- issue: 医治与赶鬼语境中σεληνιάζεται的理解
  choice: 正文译作“癫痫发作”，脚注说明其古代字面表达
  alternative: “患癫痫”“受月亮影响”“抽搐发作”
  rationale: 本节记述父亲对儿子状况的描述，并未在此给出现代医学诊断，也不要求读者接受月亮致病的观念。正文表达可观察到的发作性病况，脚注则保存原词的历史意象与语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“求你怜悯”保留恳求的力度；“痛苦不堪”简洁传达病况严重。脚注标记紧随其所解释的“癫痫发作”，避免附着位置含混。
