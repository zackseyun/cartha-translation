  to: 说：“主啊，求你怜悯我的儿子！他患癫痫[a]，痛苦不堪，因为他常常掉进火里，也常常掉进水里。”
  rationale: 仅作必要的汉语句法修订：以“患癫痫”替代不自然的“癫痫发作”。这保留该希腊词在传统译法中的疾病指称，同时脚注保存其与月亮有关的古代习语、以及不宜视为现代精确诊断的语义张力。
