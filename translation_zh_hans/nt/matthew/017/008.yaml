  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: zh_hans
  text: 他们抬起眼来，谁也没有看见，只见耶稣一人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“除了耶稣一人以外，谁也没有看见”。希腊文在“除了”之外，又以带强调意味的代词和“独自／一人”加强排他语气。
    reason: 说明原文的累积强调及较贴近其否定后例外句式的译法。
lexical_decisions:
- source_word: ἐπάραντες
  choice: 抬起……来
  rationale: 不定过去时分词表示先于主句的动作；“抬起眼来”既保留动作次序，也符合现代汉语习惯。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词；汉语可借句序自然承接上下文，若硬译为“于是”或“但”反而可能增添原文没有的时序或转折力度。
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: 眼
  rationale: 保留原文具体的身体表达；“他们抬起眼来”是自然、清楚的汉语说法。
- source_word: οὐδένα εἶδον
  choice: 看见……别无他人
  rationale: εἶδον取普通视觉意义“看见”；οὐδένα与后面的排除结构合译为“别无他人”，清楚表达除耶稣以外没有看见任何人。
- source_word: εἰ μὴ
  choice: 只有
  rationale: 在否定语境中表示“除……以外”；结合汉语句法译作“只有”，并由“别无他人”补足其排他性。
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: 耶稣一人，别无他人
  rationale: αὐτόν与μόνον叠加强调排他性。汉语若直译为“他自己耶稣独自一人”生硬难懂，因此用“耶稣一人，别无他人”自然地保留双重强调。
theological_decisions:
- issue: 异象之后唯有耶稣仍在他们眼前的强调
  choice: 保留双重排他语气：“只有耶稣一人，别无他人”
  alternative: “只看见耶稣”或“只看见耶稣一人”
  rationale: 原文以εἰ μὴ、强调性代词αὐτόν和μόνον层层加强“唯独”的意思。译文保留这种累积强调，只陈述摩西和以利亚已不再可见，不进一步引申教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬起眼来”保留原文形象；“只有耶稣一人，别无他人”以自然汉语再现希腊文的双重排他强调。
