  naturalness: “他们抬起眼来，看见只有耶稣一人”在现代汉语中略显滞涩；“谁也没有看见，只见耶稣一人”更自然、庄重，也更符合叙事语体。
  terminology: “耶稣”译名规范。脚注不宜把αὐτόν直译成“他——耶稣”：此处该代词与专名同位，带有强调作用，而不是需要在汉语正文中独立译作“他”。
