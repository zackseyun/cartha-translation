id: MAT.17.5
reference: Matthew 17:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: zh_hans
  text: 他还在说话的时候，看哪，一朵明亮的云彩笼罩了他们[a]。看哪，有声音从云彩里传来，说：“这是我的爱子，我所喜悦的；你们要听从他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “笼罩”可能呼应圣经中与上帝显现、临在有关的云彩意象。
    reason: cross_reference
  - marker: b
    text: 或译：“你们要听他。”原文的命令既可指聆听，也可含有留心听从的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: 他还在说话的时候
  rationale: 以自然的现代汉语表达属格独立结构所表示的同时动作，并由“还”保留话语被打断的意味。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 原文两次使用引人注意的叙事标记；译文两次保留“看哪”，以呈现现场的突发性和戏剧张力。
- source_word: νεφέλη φωτεινὴ
  choice: 一朵明亮的云彩
  rationale: 直接表达云彩明亮、发光的特征，不在正文中额外解释其象征意义。
- source_word: ἐπεσκίασεν
  choice: 笼罩了
  rationale: “笼罩”自然表达云彩覆盖在他们之上的图景，也容纳该词可能带有的神显语感。
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: 有声音从云彩里传来，说
  rationale: 将分词结构转换为流畅汉语，同时保留声音来自云彩之中的空间关系。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: 我的爱子
  rationale: “爱子”简洁、庄重，兼顾儿子身份与蒙爱含义，在现代中文圣经语境中仍清楚可懂。
- source_word: ἐν ᾧ εὐδόκησα
  choice: 我所喜悦的
  rationale: 保留关系从句结构及神对这位儿子的喜悦，不把不定时态机械处理为仅指过去的动作。
- source_word: ἀκούετε αὐτοῦ
  choice: 你们要听从他
  rationale: “听从”传达命令不仅要求听见，也要求留心接受；中文中比单说“听他”更自然，但不扩写为明确的“服从”。
theological_decisions:
- issue: 父对耶稣身份及喜悦的宣告
  choice: 这是我的爱子，我所喜悦的
  alternative: 这是我的儿子，是我所爱的；我喜悦他
  rationale: 所选译法保留父直接确认耶稣为其子的核心陈述，并同时表达ἀγαπητός与εὐδόκησα，而不加入经文没有明说的后期教义术语。
- issue: ἀκούετε αὐτοῦ的命令力度
  choice: 你们要听从他
  alternative: 你们要听他
  rationale: 原文现在时命令语气在此要求持续留心并接受他的话；“听从”呈现响应性的聆听，同时没有直接扩展成更强的释义“顺服他”。
- issue: 云彩笼罩的神显意涵
  choice: 正文译作“笼罩了他们”，脚注提示可能的神显呼应
  alternative: 正文释译为“神临在的云彩覆盖他们”
  rationale: 原文本身只描写明亮云彩笼罩众人。将可能的圣经神显背景放入脚注，既保留互文可能，也避免在正文中将暗示明说为解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”虽略带提升语体，但为保留原文两次ἰδού的强调作用而使用；句法整体避免文言化。
