  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: zh_hans
  text: 他回答说：“向外人[a]征收。”耶稣对他说：“那么，儿子们[c]就免税了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向不属于自家的人征收”。原文所指的是君王家以外的人，与他自己的儿子们相对，并非特指外国人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“儿子们就是自由的”；按本节税务语境，指他们不必缴纳这种税。
    reason: lexical_alternative
  - marker: c
    text: 或译“孩子们”，但原文明确说“儿子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: 他回答
  rationale: 这是带有转换作用的独立属格结构；结合上文耶稣的提问，译为“他回答”自然地表达彼得作答，同时不把 δέ 生硬译出。
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: 向外人征收
  rationale: ἀλλότριοι 指不属于君王自家的人，与其儿子形成关系和家室层面的对照。“外人”避免了“外国人”可能带来的国籍或族群含义；“征收”承接上文税款，使中文省略句自然。
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 按叙事中 φημί 的通常用法直译，清楚保留说话者和受话者。
- source_word: Ἄρα γε
  choice: 那么
  rationale: 表示由彼得的回答得出的推论；“那么”符合现代汉语对话，也保留推断语气。
- source_word: ἐλεύθεροί
  choice: 自由的
  rationale: 保留形容词“自由”的较宽含义，而不在正文中直接收窄为“免税”；在当前语境中，它自然蕴含不负纳税义务。
- source_word: οἱ υἱοί
  choice: 儿子们
  rationale: 原文明确使用阳性复数“儿子”，并与君王家外的人对比；该译法保留家室、身份及继承关系的意涵。
theological_decisions:
- issue: ἐλεύθεροί 是译作较宽泛的“自由的”，还是按税务语境明确译作“免税”
  choice: 自由的
  alternative: 免税的／不用纳税
  rationale: 原词表达不受义务约束的自由，语境确实指向免税，但正文保留“自由”可避免抹去其与儿子身份相连的较广意涵；脚注说明语境中的具体含义。
- issue: οἱ υἱοί 是否应中性化为“儿女／孩子们”
  choice: 儿子们
  alternative: 儿女／孩子们
  rationale: 原文明确为阳性复数，眼前的比喻谈的是君王的儿子与家外之人的税务地位；保留“儿子们”可准确呈现原文，并不擅自扩大或改写其范围。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“向外人征收”承接上一节所问的税款，保留原文答语的简短形式；“就是自由的”略带强调，体现 Ἄρα γε 所引出的结论。
