  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: zh_hans
  text: 他们到了迦百农，收取两德拉克马税的人[a]来到彼得跟前，问道：“你们的老师不缴两德拉克马税吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“收取两德拉克马的人”，也可译作“两德拉克马税的收税人”。
    reason: lexical_alternative
  - marker: b
    text: “两德拉克马税”指当时缴纳的圣殿税；希腊文直译为“两德拉克马”。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: 他们到了
  rationale: 属格独立结构表达时间背景；“他们到了”在现代汉语中自然简洁。δέ在此仅作轻微承接，不必生硬译出。
- source_word: Καφαρναοὺμ
  choice: 迦百农
  rationale: 采用中文圣经传统中通行且易于辨认的地名译法。
- source_word: προσῆλθον
  choice: 来到……跟前
  rationale: 准确表达向彼得走近、来到他面前的动作，也符合自然现代汉语。
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: 收取两德拉克马税的人
  rationale: 分词短语按其职能指称这群人；λαμβάνω在此语境中是收取款项，补出“税”可清楚传达语境所指，同时以脚注保留希腊文较直译的表达。
- source_word: δίδραχμα
  choice: 两德拉克马税
  rationale: δίδραχμον是价值两个德拉克马的金额；本段语境谈论应缴款项，因此译作“两德拉克马税”，兼顾金额与功能。
- source_word: τῷ Πέτρῳ
  choice: 彼得
  rationale: 采用中文圣经中通行的人名译法；与“来到……跟前”搭配表达希腊文与格关系。
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: 你们的老师
  rationale: διδάσκαλος的基本义是“老师”；既准确又符合现代汉语，不额外强化为“主人”等含义。
- source_word: οὐ τελεῖ
  choice: 不缴……吗
  rationale: τελέω在税款语境中指缴纳应付款项。“不缴……吗”保留希腊文否定问句的形式及其可能期待肯定回答的语用色彩，而不替读者直接断定答案。
theological_decisions:
- issue: δίδραχμα指钱币还是圣殿税
  choice: 正文译作“两德拉克马税”，脚注说明是圣殿税
  alternative: 译作“两枚德拉克马银币”或音译作“迪德拉克马税”
  rationale: 原文表面是“两德拉克马”的复数表达，但上下文关注是否履行缴纳义务。正文用“税”使现代读者明白其功能，脚注注明圣殿税则交代文化背景；这不预先裁定本段后续关于耶稣身份和义务的神学张力。
- issue: 否定问句οὐ τελεῖ的预期答案
  choice: 保留为“不缴……吗？”
  alternative: 按语用意译为“你们的老师会缴……吧？”或“你们的老师缴不缴……？”
  rationale: 原文否定问句通常倾向期待肯定回答，但并未明说。保留否定形式可维持其语气及叙事张力，避免替发问者或彼得预先作答。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“来到彼得跟前”“问道”保持叙事流畅；保留“两德拉克马”这一古代金额名称，并用脚注解释其税款性质。脚注标记按其实际所注内容安放，以避免将地名或“问道”误标为税款说明。
