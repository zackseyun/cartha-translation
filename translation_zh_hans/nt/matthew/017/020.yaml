reference: Matthew 17:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“是因为你们的信心小。[a]我实在告诉你们：你们若有像一粒芥菜种那样小的信心[b]，就会对这座山说：‘从这里移到那里去！’这座山也会移开；没有什么是你们办不到的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是因为你们缺少信心。”原文所用的词更具体地指信心不足或微小，而不一定是完全不信。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“你们若有信心像一粒芥菜种。”这里的比较着重于芥菜种非常微小。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 原文用历史现在时，使叙事更生动；汉语叙事中的“说”不必标明时态，既自然又不损失这一效果。
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: 是因为你们的信心小
  rationale: ὀλιγοπιστία指信心微小或不足，并非必然表示完全不信；译文保留这一词义重点。
- source_word: ἀμὴν
  choice: 实在
  rationale: 这里是引出郑重宣告的话语标记；“我实在告诉你们”是自然、庄重的现代汉语表达。
- source_word: πίστιν
  choice: 信心
  rationale: 本段指门徒对上帝能力的信靠；“信心”比“忠信”更符合语境，同时不把它限定为某一宗派对得救之信的定义。
- source_word: ὡς κόκκον σινάπεως
  choice: 像一粒芥菜种那么大的
  rationale: ὡς表达比较；结合语境，比较点是芥菜种的微小。补出“那么大的”使现代汉语清楚自然，并以脚注保留原文较简洁的形式。
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: 从这里移到那里去
  rationale: μεταβαίνω在对山发出的命令中表示移位；“移到”准确且符合汉语习惯。
- source_word: μεταβήσεται
  choice: 它也会移去
  rationale: 该动词在此为不及物意义，描述山发生位移，不必译成被动式。
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: 没有什么是你们办不到的
  rationale: 这是表达“对你们而言没有什么不可能”的惯用结构；此译自然地保留能力与可能性的含义。
theological_decisions:
- issue: 神迹语境中πίστις的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文谈门徒因信心不足而未能赶鬼，重点是对上帝能力的信靠，不宜解释为人的功德、抽象的得救教义或“忠信”品质。
- issue: 移山应按字面还是修辞理解
  choice: 保留耶稣关于移山的原有形象，不在正文中解释
  alternative: 明确解释为“成就极困难的事”
  rationale: 原文使用具体而强烈的移山图像；译文不应替读者预先消解其修辞力度或神迹含义。
- issue: “没有什么是你们办不到的”的范围
  choice: 不在译文中增添范围限制
  alternative: 增译为“在上帝旨意内，没有什么是你们办不到的”
  rationale: 原文没有明说限定语；虽需结合上下文理解，但正文不应加入原文未表达的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣”承接上下文并明确说话者；希腊文弱连接词δέ未机械译成“但是”，以免在直接回答门徒的问题时造成过强转折。引语层级和命令语气均予保留。
