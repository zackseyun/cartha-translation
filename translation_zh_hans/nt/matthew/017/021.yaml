  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: zh_hans
  text: 但这一类若不借着祷告和禁食，就不会出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本，包括四世纪的西奈抄本和梵蒂冈抄本，也不见于早期叙利亚文和科普特文译本；但拜占庭多数文本传统、拉丁文传统以及大多数叙利亚文见证均收录本节。它很可能是后来的抄写员为与《马可福音》9:29协调一致而加入的。
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: 这一类
  rationale: 此处指某一类别的鬼；“这一类”既保留类别含义，也自然承接上下文。
- source_word: ἐκπορεύεται
  choice: 出去
  rationale: 按其基本方向意义译为“出去”，在上下文中自然指鬼从受害者身上出去，同时不额外把被动驱逐的意思写入正文。
- source_word: εἰ μὴ
  choice: 若不……就不会
  rationale: 在否定主句中表达排他条件；这一结构符合现代汉语，也保留“除非”的逻辑关系。
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: 借着祷告和禁食
  rationale: 介词ἐν在此表示实行或凭借的方式；“借着”比单用“在……中”更自然清楚。
theological_decisions:
- issue: “这一类”的所指
  choice: 不在正文中明说是某一类鬼
  alternative: 译作“这一类鬼”
  rationale: 希腊文本只说τὸ γένος（这一类），其具体所指须由上下文判断；正文保留原文的省略，避免把解释直接写入翻译。
- issue: 祷告和禁食与赶鬼之间的关系
  choice: 保留为必要条件表达，不进一步说明其机制
  alternative: 解释为门徒必须先祷告禁食，或解释为信心的操练
  rationale: 原句只陈述排他条件，并未说明祷告禁食如何产生作用；不应加入宗派性或推论性的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祷告”“禁食”沿用通行的圣经宗教用语；句式简洁，并保留原文的语义张力与省略。
