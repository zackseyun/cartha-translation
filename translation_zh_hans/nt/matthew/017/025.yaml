source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: zh_hans
  text: 彼得说：“是的。”他进了屋，耶稣先开口对他说：“西门，你怎么看？地上的君王向谁征收关税或人头税[a]？是向自己的儿子，还是向外人[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关税或人头税”也可译作“税捐或贡税”。原文用两个不同的词：前者指关税、通行税等间接税，后者指按人口征收的税或贡税。
    reason: lexical_alternative
  - marker: b
    text: “外人”也可译作“别人”或“非自家的人”，指不属于君王自己家族的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: 是的
  rationale: 简明保留肯定回答，在现代汉语中自然直接。
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: 他进了屋
  rationale: 分词的逻辑主语是彼得；用顺承分句自然表达他进入屋内这一背景动作。
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: 耶稣却先开口对他说
  rationale: 表达耶稣抢在彼得说话以前主动发问的语义；“却”也自然带出出乎预期的先行动作。
- source_word: Τί σοι δοκεῖ
  choice: 你怎么看
  rationale: 这是现代汉语中征询判断的自然说法，语气与原文问句相称。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上的君王
  rationale: 保留原文“地上”的广义表达，不将其限缩为某一片土地。
- source_word: τέλη
  choice: 关税
  rationale: 此词指各类间接税、税捐或关卡税；“关税”与后面的按人征收之税形成清楚区别，但脚注保留较宽词义。
- source_word: κῆνσον
  choice: 人头税
  rationale: 指按人口征收的贡税或丁税；“人头税”是普通现代读者容易理解的明确表达。
- source_word: υἱῶν αὐτῶν
  choice: 自己的儿子
  rationale: 保留 υἱῶν 的男性亲属称谓及家族关系，以维持本节与下一节之间潜在的神学张力。
- source_word: ἀλλοτρίων
  choice: 外人
  rationale: 这里指不属于君王自己家族的人；“外人”比泛泛的“别人”更清楚地保留家内与家外的对比。
theological_decisions:
- issue: 比喻中“儿子”可能引出的基督论含义
  choice: 正文直译为“自己的儿子”，不在本节中明说其基督论推论。
  alternative: 译作“自己的子女”或解释为“王室成员”。
  rationale: 原文特指“儿子”，其家族免税的比喻为下一节留下神学含义；翻译应保留这一张力，而不提前解释。
- issue: ἀλλότριοι 所指的身份范围
  choice: 译作“外人”，按与“自己的儿子”相对的非家族成员理解。
  alternative: 译作“外国人”或“臣民”。
  rationale: 语境的核心对比是君王自家之子与家外之人，而不是国籍或政治臣属身份；避免加入原文未明确限定的含义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事与对话体。“彼得”补明原文分词所指的人物，避免连续代词造成歧义；“征收”符合税务语境。“君王”“自己的儿子”“外人”保留原文家族比喻的清晰对照。
