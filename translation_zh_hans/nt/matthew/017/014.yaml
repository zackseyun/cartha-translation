  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: zh_hans
  text: 他们来到众人那里时，有一个人来到他跟前，跪在他面前，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （融入“……时”的叙事衔接）
  rationale: 此处是承接上文的常用连词；汉语借时间从句自然衔接，无须机械译出“并且”。
- source_word: ἐλθόντων
  choice: 他们来到……时
  rationale: 该不定过去时分词与隐含的复数主语构成属格独立结构，表达时间关系；“他们来到……时”既保留复数，也符合现代汉语叙事习惯。
- source_word: πρὸς τὸν ὄχλον
  choice: 众人那里
  rationale: ὄχλος指聚集的人群；“众人”在经文叙事中自然庄重，“那里”与“来到”搭配，表达趋向。
- source_word: προσῆλθεν αὐτῷ
  choice: 走到他跟前
  rationale: προσέρχομαι表示走近、来到某人那里；“走到他跟前”清楚保留朝向该人的动作。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处指一名具体人物；现代汉语的“一个人”自然，不必因希腊语名词的阳性语法形式额外译作“男人”。
- source_word: γονυπετῶν αὐτόν
  choice: 跪在他面前
  rationale: 该现在时分词描写此人走近时的跪拜姿态；“跪在他面前”简洁传达屈膝于某人面前的动作，而不额外判定其礼仪或敬拜性质。
theological_decisions:
- issue: γονυπετῶν所表达的动作是否明确等同于敬拜
  choice: 跪在他面前
  alternative: 向他下拜
  rationale: 原词首先描写屈膝、跪于某人面前的身体动作。译作“跪在他面前”保留尊敬意味，却不把此处的动作预先界定为特定意义上的敬拜。
- issue: 两处代词αὐτῷ／αὐτόν的指称
  choice: 他
  alternative: 耶稣
  rationale: 代词在上下文中指向耶稣，但本节希腊文本使用代词；正文保留“他”，避免把上下文补充直接写成专名。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句末逗号保留原句未完的叙事状态，以便与下一节此人的话直接衔接。
