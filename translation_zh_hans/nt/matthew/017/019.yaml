  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: zh_hans
  text: 那时，门徒私下来到耶稣跟前，说：“为什么我们没能把它[a]赶出去？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他”，若这里的代词指那男孩，而不是邪灵。
    reason: 保留希腊语代词在上下文中可能存在的指代歧义。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间与叙事推进标记，承接前一场景，并自然引出接下来私下发生的对话。
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: 门徒……到耶稣跟前
  rationale: 将附属分词按汉语叙事习惯译为连续动作；“到……跟前”自然表达门徒主动走近耶稣。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 简明表达不在众人面前、单独交谈的情境。
- source_word: εἶπον
  choice: 说
  rationale: 保留 λέγω 的基本意义；后面的直接引语本身已清楚表明这是一个问题，无须改译为“问”。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 现代汉语中询问原因最自然、准确的表达。
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: 我们不能
  rationale: 保留显明的主语“我们”和 δύναμαι 所表达的能力不足；在此处比“没能”更直接对应门徒对自身无能为力的追问。
- source_word: ἐκβαλεῖν
  choice: 赶出去
  rationale: 符合福音书赶逐邪灵语境，也比字面色彩较强的“扔出去”自然庄重。
- source_word: αὐτό
  choice: 它
  rationale: 中性单数代词在上下文中最可能指邪灵；汉语以“它”表达此理解，同时用脚注保留也可能指男孩的歧义。
theological_decisions:
- issue: αὐτό 在赶逐邪灵语境中的所指
  choice: 正文用“它”，理解为邪灵。
  alternative: 也可理解为受折磨的男孩，译作“他”。
  rationale: 紧接前文，门徒失败之处在于未能赶出邪灵，而 ἐκβάλλω 在此类叙事中通常以邪灵为宾语；不过希腊语代词在语境中仍容许指向男孩，因此以脚注保留这一歧义，不将其绝对化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“私下到耶稣跟前”保持叙事流畅；“赶出去”沿用读者易懂的赶逐邪灵用语。脚注标记紧随有歧义的代词，便于读者准确识别说明对象。
