base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: zh_hans
  text: 他们下山的时候，耶稣吩咐他们说：“不要把这异象[a]告诉任何人，直到人子从死人中复活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所看见的景象”。原文直译为“异象”。
    reason: lexical_alternative
  - marker: b
    text: 原文动词为被动式，可理解为“被使复活”或“被兴起”；正文按现代汉语惯用法译为“复活”。
    reason: grammatical_and_lexical_note
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: 他们下山的时候
  rationale: 以自然的现代汉语表达属格独立结构所表示的同时进行动作；“下山”已包含从山上往下而来的空间意义。
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 耶稣吩咐他们说
  rationale: “吩咐”体现命令和郑重嘱咐的语气，“说”保留原文引出直接引语的分词结构，同时符合汉语叙事习惯。
- source_word: Μηδενὶ εἴπητε
  choice: 不要……告诉任何人
  rationale: 准确表达带有 μηδενί 的禁止命令，并以汉语自然的否定句式承接其后的宾语。
- source_word: τὸ ὅραμα
  choice: 这异象
  rationale: “异象”保留 ὅραμα 的启示性和超常所见之含义；“这”按上下文指向刚发生的山上事件，也自然表达希腊文定冠词的特指作用。
- source_word: ἕως οὗ
  choice: 直到
  rationale: 清楚标明禁令持续的时间界限，并保留原句次序。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经语境中通行且简洁的译法，保留这一称号的经文和神学关联，不作解释性改写。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 较具体地保留 ἐκ 的“从……中出来”以及复数 νεκρῶν 所指的死人群体，同时仍是可理解的中文表达。
- source_word: ἐγερθῇ
  choice: 复活
  rationale: “复活”是现代汉语中清楚、自然的复活用语；原文的被动语态难以在中文正文中自然重现，故在脚注中说明。
theological_decisions:
- issue: 复活用语及原文语态
  choice: 从死人中复活
  alternative: 从死人中被复起／被唤醒
  rationale: 希腊文 ἐγερθῇ 是被动语态，可能含有上帝使之复活的神学回响，但直译为“被复活”或“被唤醒”在现代汉语中生硬，且后者可能模糊身体复活之义。正文采用自然明确的“复活”，脚注指出被动语态，以免把原文语法所容纳的神学张力完全抹去。
- issue: ὅραμα 的性质
  choice: 异象
  alternative: 所看见的景象／所看见的事
  rationale: “异象”保留原词可能具有的启示性，不把山上所见简化为普通视觉经验；脚注同时提供较少诠释性的表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“吩咐他们说”保留原文叙事形式；引语按希腊文次序先述禁令，再以“直到”限定期限。所有脚注标记均置于正文相应词语之后。
