  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: zh_hans
  text: 门徒问他：“那么，经学家为什么说以利亚必须先来呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: 问
  rationale: 此处是不定过去时直陈语气，引出直接问句。“问”是自然、准确的现代汉语表达，不额外增加正式或盘诘的意味。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词指上下文中已知的那群门徒。汉语无需另译定冠词，也不增添原文没有的“他的”。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出问题内容。“问他说”既保留其表达功能，也符合庄重而自然的汉语叙事习惯。
- source_word: Τί οὖν
  choice: 那么，为什么
  rationale: τί形式上是“什么”，但在λέγουσιν ὅτι这一问句结构中询问的是理由，宜译为“为什么”；οὖν译作“那么”，承接前文。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: 在福音书语境中，γραμματεῖς指研究、讲授并解释律法的专业人士。“经学家”比传统的“文士”更便于现代普通读者理解，同时保持群体称谓的简洁。
- source_word: λέγουσιν ὅτι
  choice: 说
  rationale: 现在时动词加ὅτι引出其所说的内容。汉语直接用“说”引出宾语从句，无需机械译出“说……这件事”。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用该圣经人物在现代中文中的通行译名。
- source_word: δεῖ ἐλθεῖν
  choice: 必须来
  rationale: δεῖ表达必要性，“必须”保留其力度；ἐλθεῖν译为“来”。
- source_word: πρῶτον
  choice: 先
  rationale: 此处表示次序，即在另一事件之前来到。汉语“先来”比“首先来”更自然，并保留原文的时序含义。
theological_decisions:
- issue: 门徒询问以利亚来临时所带出的解释倾向
  choice: 只呈现门徒追问经学家为何这样说，不预先判断该教导是被肯定、质疑还是将受部分修正。
  alternative: 可用更带质疑语气的措辞，或在本节中补入《玛拉基书》的背景及后文解释。
  rationale: 原文的问题本身保留张力，答案要到马太福音17:11–13才展开；本节不应提前化解。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“问他说”略具经文叙事色彩，但仍属自然表达；“经学家”帮助现代读者理解γραμματεῖς的角色。问末用“呢”自然呈现承接前文的追问语气，不额外加入怀疑或反驳色彩。
