base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: zh_hans
  text: 耶稣走近他们，触摸了他们，说：“起来，不要害怕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: 走到他们跟前
  rationale: προσέρχομαι表示朝某人而来、走近或来到其跟前。结合门徒俯伏在地的场景，“走到他们跟前”自然地表达耶稣向他们靠近，且不额外断定距离。
- source_word: ἁψάμενος αὐτῶν
  choice: 摸了摸他们
  rationale: ἅπτω与属格代词连用表示触摸。“摸了摸他们”符合现代汉语叙事，也不加入原文没有明说的“把手按在他们身上”等细节。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω的普通叙事义是“说”；此处直译自然，无须强化为“吩咐”或“安慰”。
- source_word: Ἐγέρθητε
  choice: 起来
  rationale: ἐγείρω的复数命令式在此呼唤俯伏在地的门徒起身。“起来”简洁自然，同时不把最终姿势过度具体化为“站起来”。
- source_word: μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: φοβέομαι表示害怕、惧怕。“不要害怕”是现代汉语中自然的安慰性命令；现在时命令式在此不足以必须译成“别再害怕了”。
- source_word: καὶ
  choice: 叙事中以逗号连接
  rationale: 重复的καί依次连接靠近、触摸和说话。汉语不必逐一译作“并且”，用顺承分句能保留动作次序并避免生硬。
theological_decisions:
- issue: 如何表达耶稣安慰门徒的命令而不加入额外的牧养或教义含义
  choice: 起来，不要害怕
  alternative: 起来，不要惧怕；站起来，别再害怕了
  rationale: 译文保留身体动作与消除恐惧这两项命令。“站起来”可能过度限定姿势，“别再害怕了”则把持续或停止的意味表达得比原文在此语境中更强。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“走到他们跟前”比“走近”更明确地呈现朝向门徒的动作；“摸了摸”在此表达安抚性的触碰，但不增添触摸方式。经核对，本节没有必须以脚注保留的实质性歧义，因此正文不设脚注标记。
