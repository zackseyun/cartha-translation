  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: zh_hans
  text: 耶稣却回答说：“唉，不信[a]又悖谬[b]的世代啊！我还要和你们在一起多久呢？我还要容忍你们多久呢？把他带到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不信”也可译为“缺乏信心”或“不忠实”。希腊语ἄπιστος既可指不相信，也可指缺乏忠实。
    reason: lexical_alternative
  - marker: b
    text: “悖谬”或译“扭曲”或“败坏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: 耶稣却回答说
  rationale: ἀποκριθεὶς与εἶπεν合用是“回答说”的惯用表达；δέ在这里引出带有责备意味的转折，用“却”自然传达叙事语气。
- source_word: Ὦ
  choice: 唉
  rationale: 该呼语词在此表达沉痛、感叹和责备；“唉”比单纯的“哦”更符合耶稣这句话的语气。
- source_word: γενεὰ
  choice: 世代
  rationale: 保留γενεά所指同时代人群及其先知性、圣经性的表达，不泛化为“人们”。
- source_word: ἄπιστος
  choice: 不信
  rationale: 上下文聚焦于信心不足；“不信”保留主要语义，同时以脚注说明“无信、失信”的可能含义。
- source_word: διεστραμμένη
  choice: 悖谬
  rationale: 该完成时被动分词描绘已经扭曲、偏离正道的状态；“悖谬”兼具道德偏差和严肃责备的语气。
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: 我还要和你们在一起多久呢
  rationale: 以自然现代汉语表达将来时的反问，并用“还要”传出说话者的沉痛与不耐。
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: 我还要容忍你们多久呢
  rationale: ἀνέχομαι在此意为忍受、容忍；“容忍”既准确又保持庄重，不将语气弱化为一般的“包容”。
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: 把他带到我这里来
  rationale: 直截了当地传达复数命令式φέρετέ，以及μοι和ὧδε共同表达的朝向耶稣而来的意思。
theological_decisions:
- issue: ἄπιστος所表达的是“不信”还是“不忠”
  choice: 不信
  alternative: 无信／失信
  rationale: 紧接的叙事背景是门徒未能赶鬼以及信心不足，因此正文采用“不信”；脚注保留该词也可描述缺乏信实的语义，避免把词义范围封闭。
- issue: διεστραμμένη所指的扭曲性质
  choice: 悖谬
  alternative: 扭曲／败坏
  rationale: “悖谬”保留偏离正道和道德扭曲的张力，但不额外断定这种扭曲的具体神学性质。
- issue: 责备对象的范围
  choice: 世代
  alternative: 你们这些人
  rationale: 原文以γενεά作直接呼语，其范围可能超出眼前门徒；保留“世代”而不把对象缩窄到某一群体。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“唉”传达呼语中的沉痛责备；两个平行反问保持原文节奏。“世代”和“悖谬”略带经文语体，但普通读者仍易理解。
