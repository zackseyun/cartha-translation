  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: zh_hans
  text: 他回答说：“以利亚固然要来[a]，并要恢复一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要来”：原文为现在时形式，也可译为“来”；此处语境指向将来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 这一分词加限定动词的表达带有闪语影响；“回答说”在现代汉语中自然，也保留了回应的语气。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: μέν
  choice: 固然
  rationale: μέν在此既有肯定作用，也预示下一节的转折；“固然”能自然保留这种承接张力。
- source_word: ἔρχεται
  choice: 要来
  rationale: 该动词虽为现在时形式，但语境具有面向未来的意义；“要来”清楚表达这种预期，又不额外规定具体时间。
- source_word: ἀποκαταστήσει
  choice: 要复兴
  rationale: 此词表示恢复、复原；“复兴”是庄重而简洁的译法，并保留其未来指向及开放的含义。
- source_word: πάντα
  choice: 万事
  rationale: 中性复数范围广泛；“万事”保留其全面性，不擅自限定所指对象。
theological_decisions:
- issue: 以利亚复兴工作的性质和范围
  choice: 译为“复兴万事”，保持概括性
  alternative: 使一切恢复原状／使万事归正
  rationale: 原文没有在本节界定复兴的具体对象、方式或末世意义，因此不将其缩窄为属灵更新、社会改革或某种特定的末世方案。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“固然”保留μέν所暗示的后续转折；句式简洁，适合经文朗读。
