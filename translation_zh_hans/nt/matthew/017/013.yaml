  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: zh_hans
  text: 这时，门徒明白了，耶稣对他们所说的话是关于施洗约翰[a]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施洗者约翰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 这时
  rationale: 表示门徒在听完耶稣的话后随即明白；“这时”是自然、简洁的叙事衔接语。
- source_word: συνῆκαν
  choice: 明白了
  rationale: 不定过去时在此叙述门徒领会话语含义的时刻；“明白了”准确而自然。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书中对耶稣跟随者的通行称呼，清楚保留原文所指。
- source_word: ὅτι
  choice: （明白）……
  rationale: 引出门徒所明白的内容，中文无需另译“即/那”，采用内容分句更符合现代汉语。
- source_word: περὶ Ἰωάννου τοῦ βαπτιστοῦ
  choice: 谈施洗者约翰
  rationale: περί加属格表示谈话的对象或主题；“谈”自然表达“说的是关于……”。βαπτιστής是施行洗礼者的称号，译作“施洗者”保留其施行动作的含义。
- source_word: εἶπεν αὐτοῖς
  choice: 耶稣是在对他们谈
  rationale: 希腊文动词主语由上下文确定为耶稣；中文补出主语可避免代词指向含混。“是在……谈”表达这番话先于门徒此刻的领会，而不额外扩充内容。
theological_decisions:
- issue: 上下文中以利亚人物所指
  choice: 明确说门徒领会到耶稣所谈的是施洗者约翰
  alternative: 只用代词或含混表达，不明确所指
  rationale: 本节叙事本身明确记载门徒的理解，因此应如实直陈，但不进一步解释约翰与以利亚的关系。
- issue: βαπτιστής作为称号的表达
  choice: 施洗者约翰
  alternative: 施洗约翰
  rationale: “施洗者”较直接体现该希腊名词指施行洗礼的人，也避免将其误解为宗派名称；脚注保留中文传统称法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这时”衔接前文，“明白了”呈现领会的发生；补出“耶稣”以符合中文表达并消除代词歧义。脚注标记已置于正文相应称号之后。
