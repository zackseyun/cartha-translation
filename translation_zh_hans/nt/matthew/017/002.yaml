base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: zh_hans
  text: 他在他们面前变了形象[a]；他的脸像太阳一样发光，他的衣服变得洁白，像光一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“变了形貌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: 改变了形貌
  rationale: 该词为不定过去时被动形式，表示外在形态发生改变；结合脸发光、衣服变白的语境，“改变了形貌”既准确自然，也保留被动含义可由中文语境表达的空间。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 在他们面前
  rationale: 直接表达事件发生在门徒眼前、当着他们的面。
- source_word: ἔλαμψεν
  choice: 发光
  rationale: 直接表达照耀、发出光辉的动作，符合现代汉语习惯。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: 他的脸
  rationale: 此处指耶稣可见的面容；“脸”比“面貌”或“容貌”更直接，也避免与前句重复。
- source_word: ὡς ὁ ἥλιος
  choice: 像太阳一样
  rationale: 保留ὡς所引出的明喻，中文自然清楚。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 衣服
  rationale: ἱμάτια泛指衣物；“衣服”是自然、通俗而准确的现代汉语。
- source_word: ἐγένετο λευκὰ
  choice: 变得……洁白
  rationale: ἐγένετο表达状态变化；“洁白”自然呈现λευκά的白色状态，而不额外加入原文未明说的强度。
- source_word: ὡς τὸ φῶς
  choice: 像光一样
  rationale: 保留原文以“光”为比较对象的明喻，不把它简化为一般性的“明亮”。
theological_decisions:
- issue: 登山变貌事件的表达
  choice: 改变了形貌
  alternative: 变了形象
  rationale: “改变了形貌”准确表达可见形态的改变，并与随后脸和衣服的光辉相衔接；它不额外说明改变的本体性质或机制，因而保留原文的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“改变了形貌”兼顾传统经文语感与当代可读性；分号呈现前后总述与具体描写之间的关系。
