  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: zh_hans
  text: 我把他带到你的门徒那里，他们却没能治好他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: 带到
  rationale: 此处 προσφέρω 的不定过去时表示把一个人带到另一群人面前；“把他带到……那里”自然准确，也符合直接宾语加与格的结构。
- source_word: μαθηταῖς σου
  choice: 你的门徒
  rationale: μαθητής 在福音书语境中指跟随并受教于老师的人；“门徒”是现代中文圣经语境中清楚而通行的表达。
- source_word: οὐκ ἠδυνήθησαν
  choice: 不能
  rationale: δύναμαι 表示能力或可能性；“不能”直接表达门徒未能做到，且符合自然现代汉语。
- source_word: θεραπεῦσαι
  choice: 治好
  rationale: θεραπεύω 在这里指使患病或受苦的孩子恢复健康；“治好”既保留医治含义，也比单用“医治”更口语自然。
- source_word: καὶ ... καὶ
  choice: 我……可是……
  rationale: 首个 καί 在中文中无需机械译出；第二个 καί 连接的内容与预期形成自然转折，译为“可是”能清楚呈现语篇关系，而不增添失败原因。
- source_word: αὐτόν
  choice: 他
  rationale: 代词指上文那位受苦的儿子；译为“他”直接明确。
theological_decisions:
- issue: 门徒失败的性质
  choice: 只陈述他们不能治好他，不补充失败的原因。
  alternative: 明确译成不能赶出鬼，或说明是由于不信。
  rationale: 本节只说门徒未能治好他；关于邪灵及门徒失败原因的信息属于上下文，不应添加到本节正文中。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“把他带到……那里”符合普通读者的表达习惯；“可是”明确前后语义转折；不设置脚注，因为“不能”已充分涵盖 οὐκ ἠδυνήθησαν 的能力含义，没有需要另列的实质性译法差异。
