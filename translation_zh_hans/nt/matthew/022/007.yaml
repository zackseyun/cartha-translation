source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: zh_hans
  text: 王发怒了，就派出自己的军队，除灭了那些凶手，又烧毁了他们的城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: 发怒了
  rationale: 直接表达不定过去时被动形式在此所具有的状态变化含义，现代汉语自然且保留叙事力度。
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: 自己的军队
  rationale: στρατεύματα为复数，但可集合性地指王所辖的军队；汉语用“军队”比机械译作“众军”更自然。
- source_word: ἀπώλεσεν
  choice: 除灭了
  rationale: 表达彻底毁灭、杀灭之意，符合军事惩罚语境，同时保持庄重语体。
- source_word: τοὺς φονεῖς ἐκείνους
  choice: 那些凶手
  rationale: φονεῖς指杀人者；“凶手”准确、简洁，并保留ἐκείνους的指示意味。
- source_word: ἐνέπρησεν
  choice: 烧毁了
  rationale: 该动词意为纵火焚烧；结合宾语“城”，译作“烧毁”自然准确。
theological_decisions:
- issue: 比喻叙事中的王是否需要显明解释为上帝
  choice: 保留为“王”
  alternative: 译释为“上帝”或加解释性措辞
  rationale: 本节原文仍处于比喻叙事层面；不在正文中提前锁定象征对应，以保留文本自身的比喻张力。
- issue: 分词πέμψας与后续动作的关系
  choice: 译为“就派出自己的军队”
  alternative: 译为“派出自己的军队之后”
  rationale: 不定过去时分词表示伴随而通常先于主要动作；“就派出”自然体现动作推进，而不过度强调严格的时间间隔。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文三个连续动作的紧凑节奏，不添加原文没有的解释性脚注。
