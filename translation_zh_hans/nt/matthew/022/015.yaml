  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: zh_hans
  text: 于是，法利赛人去商议，怎样用耶稣所说的话设圈套陷害他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“图谋怎样在言语上设圈套陷害他。”
    reason: 保留συμβούλιον ἔλαβον可较强地译作“图谋”，并保留ἐν λόγῳ可按其较宽泛的范围义译为“在言语上”。
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 承接前文并推进叙事；现代汉语中“于是”比直译“那时”更自然地表达此处的时间顺序。
- source_word: πορευθέντες
  choice: 去
  rationale: 该不定过去时分词先于主要动作发生，在叙事中可自然译作连动结构“去商议”，避免生硬的“去了以后”。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用该犹太宗教群体在现代中文圣经及一般中文语境中的通行名称。
- source_word: συμβούλιον ἔλαβον
  choice: 商议
  rationale: 该习语表示共同谋划或作出计策；译作“商议”保留其商讨性质，不在此短语本身预先加入敌意，恶意由后面的目的内容表达。
- source_word: ὅπως
  choice: 怎样
  rationale: 在“商议”之后自然引出其筹划的内容，同时保留目的意味。
- source_word: αὐτὸν
  choice: 他
  rationale: 指向耶稣；正文补出“耶稣”作为领属成分，以消除中文中“他的话”可能造成的指代含混，而宾语仍译作“他”。
- source_word: παγιδεύσωσιν
  choice: 设圈套陷害
  rationale: 原词带有用陷阱捕捉、使人落入圈套的比喻。“设圈套”保留意象，“陷害”明确此处针对人的恶意目的，符合自然现代汉语。
- source_word: ἐν λόγῳ
  choice: 从耶稣的话中
  rationale: λόγος在此指言语；ἐν表达他们企图以耶稣所说的话为把柄使他落入圈套。此译法自然清楚，同时以脚注保留较简洁的表达。
theological_decisions:
- issue: συμβούλιον ἔλαβον所表达的敌意程度
  choice: 将该短语较中性地译为“商议”，由“设圈套陷害他”表达恶意。
  alternative: 译为“密谋”或“图谋”。
  rationale: 原句的敌意已由目的从句παγιδεύσωσιν明确表达；若将前半句也译成“密谋”，会在同一句中额外强化原习语本身未必单独承载的负面色彩。
- issue: ἐν λόγῳ的工具性或范围性
  choice: 译为“从耶稣的话中”，表达他们企图抓住他言语中的把柄。
  alternative: 译为“用话”或“在言语上”。
  rationale: 希腊语短语简洁，既可突出言语领域，也可暗示借所说的话设陷阱。正文采用自然且符合语境的表达，脚注保留另一种较简洁的译法，不把具体实施方式解释得过细。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“法利赛人”为通行专名；“去商议”符合现代汉语连动结构。“设圈套陷害”既保留捕捉意象，也清楚传达恶意。脚注标记已在正文中以[a]出现。
