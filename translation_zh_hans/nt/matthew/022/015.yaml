review_pass:
  verdict: revise
  source_fidelity: 正文“从耶稣的话中设圈套”把ἐν λόγῳ处理得不够准确、也不够自然，仿佛圈套是从耶稣的话中产生的。该短语指他们要借着／针对他说的话使他落入圈套。改为“用耶稣所说的话”准确表达其语境中的工具性含义；脚注保留“在言语上”的较宽泛表达。
  naturalness: “去商议”在现代叙事汉语中自然。“用耶稣所说的话设圈套陷害他”比“从耶稣的话中设圈套陷害他”更通顺，施事、手段与对象的关系也更清楚。
  terminology: “法利赛人”是通行且合适的群体名称。“商议”恰当保留συμβούλιον ἔλαβον的审议意味；“设圈套陷害”传达παγιδεύσωσιν的诱捕性和敌对目的，未加入教派性解释。
  issues:
  - severity: medium
    issue: “从耶稣的话中设圈套”对ἐν λόγῳ的汉语表达不当。
    rationale: “从……中”通常表示来源或从中找出某物，容易使读者理解为他们要从耶稣的话里找出一个圈套；原文所指的是在言语领域、借他所说的话来诱陷他。
  revised_text: 于是，法利赛人去商议，怎样用耶稣所说的话设圈套陷害他。[a]
