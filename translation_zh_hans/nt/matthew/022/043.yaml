base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: zh_hans
  text: 耶稣对他们说：“那么，大卫怎么会在圣灵里[a]称他为‘主’[b]，说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着圣灵”。希腊文短语既可侧重所处的范围，也可侧重施行的媒介；正文“在圣灵里”较贴近原文措辞。
    reason: lexical_alternative
  - marker: b
    text: 或译“主人”。希腊文 κύριος 常译为“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: 耶稣对他们说
  rationale: 希腊文直译为“他对他们说”，其中现在时是叙事中的历史现在时；现代汉语自然地用“说”。依上下文明确主语为耶稣，以免孤立经节中的代词含混。
- source_word: Πῶς οὖν
  choice: 那么……怎么会
  rationale: “怎么会”保留 πῶς 的疑问语气，“那么”表达 οὖν 的承接和推论意味，符合自然汉语语序。
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经及一般中文语境中通行的人名译法。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 较贴近 ἐν 的形式，并保留该短语可能表达范围或媒介的张力；依引述受默示经文的语境，将 πνεῦμα 理解为圣灵。
- source_word: καλεῖ αὐτὸν κύριον
  choice: 称他为‘主’
  rationale: κύριος 在此是诗篇引文论证中的称号；“主”既是通行译法，也保留其弥赛亚语境中的分量，不把意义缩窄为一般的“主人”。
- source_word: λέγων
  choice: 说
  rationale: 用简洁的汉语引出下一节的直接引语，保留分词与前面“称”为同一言说行为的联系。
theological_decisions:
- issue: ἐν πνεύματι 中 πνεύματι 的所指
  choice: 圣灵
  alternative: 大卫自己的灵或属灵状态
  rationale: 在耶稣引用大卫诗篇作为经文论证的语境中，最自然的理解是大卫在圣灵中说话；正文仍采用贴近原文的“在圣灵里”，不进一步规定究竟侧重范围还是媒介。
- issue: κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 在诗篇110篇的互文和弥赛亚论证中，“主”能保留称号的神学分量及上下文联系；“主人”虽是词义上的可能表达，却容易使此处降为普通社会称谓。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“那么……怎么会”自然呈现问句推论关系；“在圣灵里”略带经文语体，以保存原文的真实歧义。引号用于标明“主”是大卫给那一位的称号；句末保留冒号功能，由逗号和后引号衔接下一节引文。
