  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你要以全部的心、全部的生命、全部的心思爱主——你的上帝。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”所译的希腊语 ψυχή 也可指“自我”或“魂”。这里指人整个有生命的自我。
    reason: lexical_alternative
  - marker: b
    text: “心思”所译的希腊语 διάνοια 也可译作“悟性”或“理解力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的承接语气；现代汉语在引出回答时省译更自然，也不损失叙事关系。
- source_word: ἔφη αὐτῷ
  choice: 耶稣对他说
  rationale: 原文主语是代词“他”，结合上文明确指耶稣；汉语补出姓名可避免含混。“说”忠实对应 ἔφη，不额外加入“回答”的语义。
- source_word: Ἀγαπήσεις
  choice: 你要……爱
  rationale: 将具有命令作用的将来时译为“你要”，既表达诫命的约束力，也保留经文引用的庄重语气。
- source_word: κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: 保留原文“主—你的上帝”的紧密结构及其申命记引文背景；“上帝”是现代汉语中 θεός 的通行庄重译法。
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: 全心
  rationale: ἐν 在此表达投入爱的范围或方式；汉语“全心”自然凝练，并准确传达全部、毫无保留之意。
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: 全心灵
  rationale: ψυχή 可指生命、自我或魂；此处用“心灵”保留与“心”和“心思”的区分，同时指向完整的有生命之自我。
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: 全心思
  rationale: διάνοια 指思考、理解的官能；“心思”在现代汉语中自然，并保留诫命所含的思想与理解层面。
theological_decisions:
- issue: 如何呈现申命记引文中的三重表达
  choice: 保留“全心、全心灵、全心思”三个并列成分
  alternative: 合并意译为“全人全意”，或将 διάνοια 译作“悟性”
  rationale: 逐项保留 καρδία、ψυχή、διάνοια 的区别，不把它们硬性界定为彼此分割的人性组成部分，也不以概括性意译消除原文的张力。
- issue: κύριος 在圣经引文中的称谓
  choice: 主
  alternative: 主人
  rationale: 此处 κύριος 位于“你的上帝”之前，承接申命记中神名的语境；“主”既保留这一圣约称谓，也不引入“主人”可能产生的人际从属色彩。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。用“你要”传达引文中将来时所具有的命令效力；三次 ἐν ὅλῃ 的重复以三个“全……”对应，使句子简洁而保留原文的排比和全面性。所有脚注标记均置于正文句末。
