  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: zh_hans
  text: 他们回答他：“凯撒的。”于是他对他们说：“所以，凯撒的东西，当交给凯撒；上帝的东西，当交给上帝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 他们回答他
  rationale: λέγουσιν是历史现在时，按现代汉语叙事习惯译作过去语境中的“回答”；αὐτῷ保留为间接宾语“他”。上下文中此话是对耶稣提问的回应，因此“回答”比单纯“说”更自然。
- source_word: Καίσαρος
  choice: 凯撒的
  rationale: 该属格独立使用，回答钱币上的像和名号属于谁；汉语用“凯撒的”既简洁，又保留原文省略中心词的表达。
- source_word: τότε λέγει αὐτοῖς
  choice: 于是他对他们说
  rationale: τότε标示对话的推进和承接；λέγει是历史现在时，在汉语叙事中自然译为“说”。
- source_word: Ἀπόδοτε
  choice: 要归还
  rationale: ἀποδίδωμι可表示归还、偿付或交付所当给的。“归还”保留了把属于某者之物交还给他的语义，同时脚注说明其较宽的含义。用“要”表达命令，语气庄重而自然。
- source_word: οὖν
  choice: 那么
  rationale: οὖν引出根据对方答案所得的推论；对话中“那么”比书面色彩较强的“因此”更自然，同时保留推论关系。
- source_word: τὰ Καίσαρος Καίσαρι
  choice: 凯撒的东西要归还凯撒
  rationale: 保留原文“属于凯撒的事物—给凯撒”的结构和归属关系，并与后半句形成清楚的平行。
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: 上帝的东西要归还上帝
  rationale: 与前半句保持句法和修辞上的平行，不额外界定哪些事物属于上帝，从而保留原文的开放性与张力。
theological_decisions:
- issue: 耶稣命令中世俗责任与对上帝责任的关系
  choice: 保留“凯撒的……归还凯撒，上帝的……归还上帝”的平行命令，不加解释。
  alternative: 把经文限缩为只谈纳税，或扩展为对国家绝对权力的认可。
  rationale: 原文既区分两种归属，又没有详述各自范围。直译其平行结构，可保留公民责任与上帝终极要求之间的神学张力，避免引入后世政治或宗派体系。
- issue: ἀπόδοτε是否仅指“归还”
  choice: 正文采用“归还”，并以脚注保留“交给、缴纳所当缴的”等可能含义。
  alternative: 只译作“给”，或明确译成“纳税”。
  rationale: “归还”体现ἀποδίδωμι常有的返还或偿付意味；但该词的语义范围更广，因此不应让读者误以为原文只允许一种狭义理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凯撒的东西……上帝的东西……”有意保留原文整齐的平行结构；“那么”自然呈现对话中的推论。
