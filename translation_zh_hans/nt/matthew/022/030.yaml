  rationale: 修订将正文的“在复活的时候”改为“在复活中”，以免把复活后的情形窄化为复活的瞬间，并将时间性译法置于脚注。另调整“天上上帝的天使”的语序，使中文更自然、指向更清楚。其余表达保留原有的婚嫁动词对举及比较而非身份等同。
