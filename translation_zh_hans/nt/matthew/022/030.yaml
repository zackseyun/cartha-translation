source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: zh_hans
  text: 因为在复活中[a]，人既不娶，也不嫁，而是像在天上的上帝的天使一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在复活的时候”。
    reason: 保留ἐν τῇ ἀναστάσει可指复活之时的时间性理解；正文“在复活中”则保留其复活生命状态的含义。
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: 在复活的时候
  rationale: 介词短语既可指复活发生之时，也可指复活后的生命状态；正文采用自然、易懂的时间表达，并用脚注保留状态层面的可能译法。
- source_word: γαμοῦσιν
  choice: 娶
  rationale: 该动词指主动结婚；与后面的被动形式相对，现代汉语用“娶”可简洁保留这一差别。
- source_word: γαμίζονται
  choice: 嫁
  rationale: 该被动形式传统上指被交付婚嫁。汉语成对表达“不娶也不嫁”自然通顺，并保留原文两种婚嫁表述的区别，虽不逐字凸显被动语态。
- source_word: ὡς
  choice: 像……一样
  rationale: ὡς在此表示比较而非身份等同；这一表达清楚表明复活的人与天使相似，并非变成天使。
- source_word: ἄγγελοι θεοῦ
  choice: 上帝的天使
  rationale: 明确译出属格θεοῦ，同时符合现代汉语的自然领属表达。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处指天使所在的属天领域，而非物理意义的天空；“天上”在本句中自然、明确。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明理由；“因为”清楚呈现这一解释关系。
theological_decisions:
- issue: 复活的人与天使之比较的性质
  choice: 译作“像天上上帝的天使一样”，表达相似而非身份转变。
  alternative: 把比较扩大为复活的人具有全面的天使性存在方式，或认为人会变成天使。
  rationale: ὡς明确引入比较，紧邻上下文则把比较重点放在不再婚嫁。译文不把这种相似解释为本体上的等同，也不超出经文界定其全部范围。
- issue: ἐν τῇ ἀναστάσει所指的时间或状态
  choice: 正文译作“在复活的时候”，以时间意义为主。
  alternative: 理解为“在复活的生命中”，侧重复活后的持续状态。
  rationale: 希腊介词短语可容纳时间和状态两方面含义；正文采用较自然的现代汉语，脚注保留另一可能，避免武断排除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不娶也不嫁”是自然的汉语对举，既便于普通读者理解，也对应原文两个不同的婚嫁动词；“像……一样”避免暗示复活的人会变成天使。
