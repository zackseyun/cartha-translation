reference: Matthew 22:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: zh_hans
  text: 他们就派自己的门徒和希律党人[a]一起到耶稣那里，说：“老师，我们知道你为人诚实，按真理教导上帝的道路；你不受任何人影响，因为你不看人的情面[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希律党人”可能指支持希律王朝及其政治利益的人。
    reason: historical_context
  - marker: b
    text: “不看人的情面”意为不偏待人，也不因人的身份、地位或外在情形而改变判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: 就派……到
  rationale: 采用叙事现在时的自然汉语表达“就派”，既保留希腊文现在时的现场感，也承接上下文行动。
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: 自己的门徒
  rationale: “门徒”是福音书语境中 μαθητής 的常用准确译法；“自己的”明确 αὐτῶν 的回指。
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: 和希律党人一起
  rationale: 自然表达 μετά 加属格的同行、联合关系；“希律党人”保留该群体的历史称谓，并以脚注简释。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 对应普通称呼“教师”，现代汉语自然，不额外加入权威或宗教头衔意味。
- source_word: ἀληθὴς εἶ
  choice: 你为人真诚
  rationale: 在描述人的品格时，“为人真诚”比生硬的“你是真的”更符合现代汉语，并保留其诚实可靠之义。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 上帝的道路
  rationale: 保留“道路”这一圣经性隐喻，不将其窄化为单纯的教训或旨意。
- source_word: ἐν ἀληθείᾳ διδάσκεις
  choice: 按真理教导
  rationale: “按真理”保留 ἐν ἀληθείᾳ 可表示合乎真理、真实无伪的张力，同时使汉语顺畅。
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: 你不受任何人影响
  rationale: 该表达在语境中不是说耶稣漠不关心别人，而是说他不因任何人的身份或意见而动摇；此译避免现代汉语中的道德误解。
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: 因为你不看人的情面
  rationale: 以现代汉语成语保留“看人的脸面”这一源语意象及不徇私情的含义；脚注列出更明确的释义。
theological_decisions:
- issue: 不看人的脸面这一惯用语所表达的公正无私
  choice: 因为你不看人的情面
  alternative: 因为你不偏待人；因为你不按外貌或地位看人
  rationale: 主文保留 πρόσωπον（脸面）的源语意象和修辞色彩，同时采用汉语可懂的惯用表达；脚注说明其核心是“不偏待人”，不把含义限定为仅凭外貌判断。
- issue: οὐ μέλει σοι περὶ οὐδενός 是否表示冷漠
  choice: 你不受任何人影响
  alternative: 你不在意任何人；你不顾忌任何人
  rationale: 上下文以“不看人的情面”解释前句，焦点是耶稣不受人的身份、地位或压力左右，并非对人缺乏关怀；译文据此避免错误神学暗示。
- issue: 称赞之语的真假与叙述层面
  choice: 直接保留说话者的陈述，不在正文添加“假意”等评价
  alternative: 老师，我们知道你为人真诚……
  rationale: 本节原文只记录他们所说的话；即使上下文揭示其试探动机，翻译也不应把叙述解释插入引语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“为人真诚”“不受任何人影响”避免逐字翻译造成误解；“上帝的道路”和“不看人的情面”则适度保留原文意象。所有脚注标记均已置于正文相应位置。
