id: MAT.22.3
reference: Matthew 22:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: zh_hans
  text: 他差遣自己的仆人[a]去召那些已经受邀的人[b]来赴婚宴[c]，可是他们不愿意来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”。希腊词可指仆人或奴隶；这里侧重他们奉主人差遣的角色。
    reason: lexical_alternative
  - marker: b
    text: 较字面可译“那些已经蒙召的人”。希腊原文的“召”和“受邀”出自同一动词；在这里是指先前已经受邀的人。
    reason: lexical_alternative
  - marker: c
    text: 或译“婚礼庆典”。原文在这里可指婚礼及其宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 差遣
  rationale: 该词在这里表示派人执行任务；“差遣”自然、庄重，也能体现这些仆人奉主人之命行事。
- source_word: δούλους
  choice: 仆人
  rationale: δοῦλος可指奴隶或仆人。本比喻着重于他们作为主人使者的职分，而非其受奴役的身份，因此正文采用“仆人”，并以脚注保留“奴隶”这一可能译法。
- source_word: καλέσαι
  choice: 去召
  rationale: 不定式表示差遣的目的。“召”保留了与下文同属καλέω词族的呼应，又适合主人命仆人催请宾客赴宴的语境。
- source_word: κεκλημένους
  choice: 那些已经受邀的人
  rationale: 这是καλέω的完成时被动分词，指此前已经得到邀请的人。“已经受邀”清楚表达先前邀请所形成的状态；脚注保留较字面的“已经蒙召的人”。
- source_word: εἰς τοὺς γάμους
  choice: 来赴婚宴
  rationale: 复数γάμοι在此指婚礼庆典，尤其是婚宴。“赴婚宴”符合现代汉语习惯，也准确呈现故事场景。
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: 他们不愿意来
  rationale: ἤθελον加不定式强调意愿。“不愿意来”忠实保留意志层面的含义，而不像“拒绝来”那样加强为明确的拒绝行为。
theological_decisions:
- issue: 比喻叙事中δοῦλος的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 此处重点是这些人受主人差遣、传达召请，并不突出其法律或社会上的奴隶身份。译作“仆人”更贴合叙事功能，同时用脚注保留原词可能包含的身份含义。
- issue: καλέω词族重复与宴席语境的关系
  choice: 正文译为“召……已经受邀的人”
  alternative: “召那些已经蒙召的人”
  rationale: 希腊文有意重复同一动词词族，但中文若完全照译为“召……蒙召”容易使普通读者误以为专指神学意义上的呼召。正文兼顾词语呼应与宴席邀请的明确语境，脚注则保存较字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“差遣”“赴婚宴”保持经文体的端正感，但不过度文言化；“可是”自然呈现末句转折。所有脚注标记均置于正文相应词语之后。
