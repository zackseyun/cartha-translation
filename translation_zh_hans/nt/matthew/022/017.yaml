  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: zh_hans
  text: 那么，请告诉我们，你怎么看？向凯撒交人头税合不合法？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: 你怎么看
  rationale: 自然、准确地表达“你认为怎样”，符合现代汉语提问习惯。
- source_word: ἔξεστιν
  choice: 合不合法
  rationale: 表达“是否获准、是否合乎律法”，并保留问题涉及律法许可的含义。
- source_word: δοῦναι
  choice: 交
  rationale: 在税款语境中，现代汉语通常说“交税”；既传达原文“给”的动作，也避免生硬直译。
- source_word: κῆνσον
  choice: 人头税
  rationale: 该词指罗马征收的贡税或人口税；此处用“人头税”具体呈现其税种。
- source_word: Καίσαρι
  choice: 向凯撒
  rationale: 保留罗马皇帝的称号，并以介词“向”自然表达间接受词关系。
theological_decisions:
- issue: ἔξεστιν所指的规范层面
  choice: 合不合法
  alternative: 可不可以
  rationale: “合不合法”保留问题关于律法许可的张力，不把它缩减为一般可行性或个人意愿。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；问句保留诱导性争议的直接语气。
