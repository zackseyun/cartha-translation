  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: zh_hans
  text: 他们听见这话，感到惊奇，就离开他走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见这话
  rationale: 这是简单过去时主动分词，表示先于主要动词发生的动作；汉语用“听见这话”自然地表达时间顺序，并按上下文补出希腊文省略的宾语。
- source_word: ἐθαύμασαν
  choice: 很惊讶
  rationale: θαυμάζω 表示惊奇、诧异；“很惊讶”是现代汉语中自然清楚的表达，不额外说明他们惊讶的原因或性质。
- source_word: ἀφέντες αὐτὸν
  choice: 离开他
  rationale: 此处 ἀφίημι 表示离开某人；直译为“离开他”，不添加原文没有明说的“让他独自留下”等含义。
- source_word: ἀπῆλθαν
  choice: 走了
  rationale: ἀπέρχομαι 表示离去；与“离开他”连用时译作“走了”，既保留叙事动作，也避免生硬重复“离去”。
- source_word: καὶ ... καὶ
  choice: 就……于是
  rationale: 重复的 καί 串联连续动作。现代汉语用“就……于是”清楚呈现其先后推进，同时保持简洁的叙事节奏。
