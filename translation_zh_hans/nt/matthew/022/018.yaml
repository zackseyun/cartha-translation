id: MAT.22.18
reference: Matthew 22:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: zh_hans
  text: 耶稣却知道他们的恶意，就说：“你们这些假冒为善的人，为什么试探我[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“诱惑”。原文这个词可按语境表示试验、考验或诱惑；这里指他们企图用问题使耶稣陷入圈套。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: 知道
  rationale: 不定过去时分词在此作伴随情状，表示耶稣在说话前已经识破他们的动机；“知道”简洁自然，并保留原文的认知含义。
- source_word: δὲ
  choice: 却
  rationale: δέ在此表示轻微转折；上下文中，对方表面恭维，耶稣却识破其恶意，因此“却”符合语篇关系。
- source_word: πονηρίαν
  choice: 恶意
  rationale: πονηρία可指邪恶、恶毒或恶意；此处着重他们设问背后的不良动机，“恶意”既自然又贴合语境。
- source_word: εἶπεν
  choice: 就说
  rationale: 采用自然的汉语叙事表达；“就”顺接前面的分词情状，不额外增加因果强度。
- source_word: Τί
  choice: 为什么
  rationale: τί与动词连用时在此询问缘由，现代汉语自然表达为“为什么”。
- source_word: πειράζετε
  choice: 试探
  rationale: πειράζω可表示试验、考验或诱惑；此处对方企图以问题使耶稣陷入圈套。“试探”保留其负面意图及较宽的词义范围。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 该词指外表与真实动机不一致、佯装真诚的人；“假冒为善的人”是现代中文圣经语境中清楚而庄重的表达。
theological_decisions:
- issue: 耶稣对反对者内在动机的认识
  choice: 译为耶稣“知道他们的恶意”
  alternative: “看出他们的邪恶”或“知道他们的恶毒”
  rationale: 原文明确陈述耶稣识破了他们行为背后的道德恶意；译文保留这一陈述，但不把它扩展为本节未直接论述的系统神学命题。
- issue: πειράζω在此处的含义
  choice: 试探
  alternative: 考验；诱惑
  rationale: 语境是敌对者设下言语圈套。“试探”可以表达带有恶意的测试，同时不把含义缩窄为引诱人犯罪。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“恶意”准确传达语境中的敌对动机；称呼移至问句前部，使中文自然流畅。所有脚注标记均已在正文中出现。
