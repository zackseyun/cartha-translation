  language: zh_hans
  text: 耶稣问他们：“这像和这铭文是谁的？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“这像和这铭文属于谁？”希腊文用属格疑问词询问归属或关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 问
  rationale: 该动词本义为“说”，但此处直接引出问句；现代汉语用“问”更自然，也准确表达言语行为。希腊语叙事现在时按汉语叙事习惯处理，不另行标示时态。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与“问”搭配，间接宾语自然译为“问他们”。
- source_word: Τίνος
  choice: 是谁的
  rationale: 属格疑问代词询问归属或关联；“是谁的”既保留这种关系，也符合现代汉语表达。
- source_word: εἰκὼν
  choice: 像
  rationale: 指钱币上的人物肖像；“像”简明准确，并避免用“形象”可能带来的抽象含义。
- source_word: αὕτη
  choice: 这
  rationale: 指示代词修饰“像”，译作“这”自然清楚。
- source_word: ἐπιγραφή
  choice: 题字
  rationale: 指钱币上铸刻的文字；“题字”比泛称“文字”更能表达铭刻于物件上的字样，同时比“铭文”更易懂。
- source_word: καὶ
  choice: 和
  rationale: 连接“像”与“题字”，自然译为“和”。
