  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: zh_hans
  text: 天国好比一位为自己儿子举办婚宴的王。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为不定过去时被动式，直译可作“天国被比作”；在比喻的惯用表达中，译作“天国好比”更符合汉语。
    reason: lexical_alternative
  - marker: b
    text: “婚宴”原文为复数，按希腊语习惯可指婚礼庆典或婚筵。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: 好比
  rationale: 这是不定过去时被动式，字面可译“被比作”或“被比拟为”；在汉语比喻引语中，“好比”自然凝练，并保留比较关系。脚注说明其形态与另一种直译。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 保留马太福音特有且已为现代汉语读者熟悉的表达，不改写成“神的国”，也不限定其仅指领域或统治。
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: 一位王
  rationale: ἄνθρωπος与βασιλεύς在此构成自然的称谓组合，重点是“王”；汉语若直译为“一个人，一个王”生硬且易误解。“一位王”不改变所指。
- source_word: ὅστις
  choice: 的
  rationale: 希腊语关系代词引出王所做的事；汉语用定语结构“为……举办婚宴的王”比逐字使用“他……”更自然。
- source_word: ἐποίησεν
  choice: 举办
  rationale: ποιέω与γάμους搭配时指筹办或举行婚庆活动；“举办”准确表达王作为主人所做的事。
- source_word: γάμους
  choice: 婚宴
  rationale: 复数γάμους在此为婚礼庆典的惯用说法；结合后文宴席语境，“婚宴”自然明确。脚注保留其复数形式及较宽泛的可能含义。
- source_word: τῷ υἱῷ αὐτοῦ
  choice: 为自己儿子
  rationale: 与格表示为儿子而办；“自己”清楚回指主语“王”，不额外说明婚礼所属。
theological_decisions:
- issue: “天国”的性质
  choice: 保留“天国”这一马太式用语
  alternative: 神的国；天的统治
  rationale: 不以解释性替换消除原文措辞的文学与神学特色，也让“国度”与“统治”的语义张力保持开放。
- issue: 比喻公式的时态与语气
  choice: 正文采用自然汉语“好比”，脚注交代“被比作”的形态
  alternative: 天国被比作；天国可以比作
  rationale: “可以比作”会加入原文未明说的情态；正文“好比”符合汉语比喻体裁，而脚注保存希腊语被动形态的信息。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“天国”沿用熟悉的圣经用语；“一位王”避免机械保留ἀνθρώπῳ而造成汉语累赘；两个脚注标记均置于正文句末，并分别说明比喻动词和γάμους的翻译。
