  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: zh_hans
  text: 至于死人复活的事，你们难道没有读过上帝对你们所说的话吗？他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: 至于
  rationale: περί加属格引出所谈论的主题，δέ则标示话题推进或转折。“至于”自然地兼顾这两种功能，又不夸大为强烈对比。
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: 死人复活的事
  rationale: ἀνάστασις在此指死人复活；τῶν νεκρῶν是属格，指复活的主体是死人。“死人复活”是现代汉语中清楚、自然的表达。
- source_word: οὐκ ἀνέγνωτε
  choice: 你们难道没有读过
  rationale: 否定疑问句在这里是修辞性反问。“难道没有读过”既体现责问语气，也表达他们本应熟悉经文。
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: 上帝对你们所说的话
  rationale: 原文表达上帝是说话者，听者则是“你们”。汉语以主动结构表达比机械使用被动式更自然，同时完整保留神的发言者身份及经文对听众的直接指向。
- source_word: λέγοντος
  choice: 他说：
  rationale: 该分词引出下一节的直接引语，所指的说话者是上帝。“他说：”清楚保留这一关系，并自然衔接后文引语。
theological_decisions:
- issue: 上帝的发言与经文对听者的指向
  choice: 上帝对你们所说的话
  alternative: 上帝所说给你们的话／对你们说的、出于上帝的话
  rationale: 译文明确保留两点：所引经文是上帝所说的，并且是对耶稣当时的听众说的；不在此基础上增添原文未明说的启示或默示理论。
- issue: 死人复活的含义
  choice: 死人复活
  alternative: 从死人中复活
  rationale: 原文是“死人的复活”，着眼于死人这一群体的复活。译作“死人复活”既符合属格结构，也避免把本句改写成主要描述某一位从死人中复活。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“至于”标示论题转换；“难道没有读过”保留耶稣反问的力度；句末“他说：”为下一节的引语留下自然衔接。
