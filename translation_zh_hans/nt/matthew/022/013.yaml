source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: zh_hans
  text: 于是，王对侍从说：“捆住他的脚和手，把他扔到外面的黑暗里去。在那里将有哀哭和切齿。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接叙事中的下一步行动，现代汉语中自然、简洁。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 准确保留比喻中的君王形象；在上下文中“王”比“国王”更凝练自然。
- source_word: τοῖς διακόνοις
  choice: 对侍从
  rationale: διάκονοι在宴席场景中指听命服侍王的人；“侍从”贴合语境，也避免“执事”所带的教会职分含义。
- source_word: Δήσαντες
  choice: 捆起来
  rationale: δέω表示捆绑；分词与随后命令连用，汉语自然地译作连续命令。
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: 他的脚和手
  rationale: 保留希腊文“脚和手”的次序，不改成熟悉的汉语固定搭配。
- source_word: ἐκβάλετε αὐτὸν
  choice: 把他……扔……去
  rationale: ἐκβάλλω表达强制逐出；“扔到……去”清楚传达动作的强烈和严厉。
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: 到外面的黑暗里去
  rationale: 直观保留“外面”与“黑暗”的空间意象，同时符合现代汉语表达。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接保留地点指向，并与上一句衔接自然。
- source_word: ἔσται
  choice: 他要
  rationale: 未来式在此说明那人将有的处境；结合后面的固定述语，译为“他要”自然明确。
- source_word: ὁ κλαυθμὸς
  choice: 哀哭
  rationale: 既表达哭泣，也保留其中的悲痛色彩，符合马太福音反复出现的审判用语。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 切齿
  rationale: “哀哭切齿”是准确而凝练的汉语表达，可涵盖痛苦或愤怒，未额外限定其情绪性质。
theological_decisions:
- issue: 比喻中被逐到外面黑暗里的意象性质
  choice: 保留“外面的黑暗”这一具体意象，不在正文中解释为地狱、末日审判或仅仅被赶出宴席。
  alternative: 将其明确解释为地狱刑罚，或弱化为单纯不能参加宴席。
  rationale: 希腊文使用鲜明的审判意象，却没有在本句中进一步界定其教义含义；译文应保留这种张力。
- issue: “哀哭切齿”的主体表达
  choice: 译作“他要哀哭切齿”。
  alternative: 采用名词化结构“那里将有哀哭和切齿”。
  rationale: 希腊文为非人称存在句，字面是“那里将有哀哭和切齿”；汉语结合本节唯一被处置的人，用“他要”表达更自然，但不改变审判场景的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“侍从”符合王室宴席语境；“外面的黑暗”保留马太特有表达的空间与审判力度；全句避免古奥措辞及教派化解释。
