base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other slaves[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: zh_hans
  text: 他又派了别的奴仆[a]去，说：“你们要告诉那些已经受邀的人：‘看，我已经预备好了我的筵席；我的公牛和肥壮的牲畜都已经宰好了，一切也都准备好了。来参加婚宴吧！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“别的仆人”。希腊语δοῦλος可按语境指“奴仆”或“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν ἄλλους δούλους
  choice: 他又派了别的奴仆去
  rationale: “又”自然表达重复行动；“派……去”符合差遣传话的语境。δοῦλος在王室家仆的比喻场景中涉及受主人支配的身份，因此正文译作“奴仆”，并以脚注保留“仆人”这一较宽泛的译法。
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: 你们要告诉那些已经受邀的人
  rationale: κεκλημένοις是完成时被动分词，表示这些人先前已经受到邀请，且这一身份在当前仍然有效。
- source_word: Ἰδοὺ τὸ ἄριστόν μου ἡτοίμακα
  choice: 看，我的宴席已经备好了
  rationale: Ἰδού译为现代而有提示力的“看”；ἄριστον指已备妥的一餐，在婚礼语境中译作“宴席”比“午餐”自然；“已经备好了”体现完成时所强调的现成状态。
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: 我的公牛和肥畜
  rationale: ταῦροι明确指公牛；σιτιστά是经过喂养催肥、预备宰杀的牲畜，译作“肥畜”既保留类别的概括性，也避免擅自限定为牛犊。
- source_word: τεθυμένα
  choice: 都已经宰了
  rationale: 此处θύω指为筵席宰杀牲畜，并无必须理解为祭祀的依据；中文用“宰了”准确、自然。
- source_word: καὶ πάντα ἕτοιμα
  choice: 一切也都准备好了
  rationale: 直接保留πάντα的全面范围，并以现代汉语自然表达。
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: 来参加婚宴吧
  rationale: γάμοι为复数，可指婚礼庆典或婚宴整体；结合前文备餐和宰牲畜的语境，“婚宴”最自然，同时保留邀请赴庆典的含义。
theological_decisions:
- issue: 王室家宅比喻中δοῦλος的社会身份
  choice: 奴仆
  alternative: 仆人
  rationale: “奴仆”比单纯的“仆人”更能体现该词在古代语境中的隶属和受支配身份，同时不把这一社会身份进一步神学化；脚注保留语境上可行的较宽泛译法。
- issue: γάμοι所指的范围
  choice: 婚宴
  alternative: 婚礼（或婚庆活动）
  rationale: 复数形式可涵盖整场婚礼庆典；但本节集中描写已备好的食物，故正文采用“婚宴”。这不排除它也可广义指婚礼庆典。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。引语层级清楚；“宴席”和“婚宴”分别对应已备的一餐与受邀参加的婚礼筵席。正文中的脚注标记[a]与脚注完全对应。
