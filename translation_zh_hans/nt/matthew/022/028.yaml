  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: zh_hans
  text: 那么，在复活的时候，她将是这七个人中谁的妻子呢？因为他们都娶过她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“因为他们都曾有过她。”这里指七个人都曾娶她为妻。
    reason: 说明正文“娶过她”所依据的语境，并保留ἔσχον αὐτήν的字面表达。
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: 在复活的时候
  rationale: ἐν加与格在此表示时间或处境；“复活”准确表达上下文所谈将来死人复活之事，“的时候”使现代汉语自然清楚。
- source_word: οὖν
  choice: 那么
  rationale: 承接并推出前述情形下的问题；“那么”既保留推论关系，也符合汉语问句习惯。
- source_word: τίνος τῶν ἑπτὰ
  choice: 这七个人中谁的
  rationale: τίνος是表示所属关系的疑问代词，τῶν ἑπτὰ限定所问范围；此译准确而自然。
- source_word: ἔσται γυνή
  choice: 她将是……的妻子
  rationale: γυνή在婚姻语境中指“妻子”，ἔσται为将来时；补出主语“她”符合现代汉语表达。
- source_word: πάντες γὰρ ἔσχον αὐτήν
  choice: 因为他们都娶过她
  rationale: γάρ说明提出问题的理由；ἔσχον αὐτήν字面为“有过她”，在此婚姻语境中意为都曾以她为妻。“娶过她”自然传达所指，字面形式收入脚注。
theological_decisions:
- issue: 撒都该人所问ἀνάστασις的含义
  choice: 指将来死人复活
  alternative: 泛指死后生命或来世状态
  rationale: 上下文明确说撒都该人否认复活，耶稣随后也直接回答复活的问题；译作“复活”保留其具体所指，不作额外发挥。
- issue: 七兄弟与该女子的婚姻关系
  choice: 表达为七人都曾娶她为妻
  alternative: 按字面译为七人都“有过她”
  rationale: ἔχω在此由前文连续娶妻的叙述确定为婚姻关系；正文采用自然汉语“娶过她”，同时以脚注保留原文简短而可能显得带有占有意味的措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那么”自然承接前文推论；“这七个人中谁的妻子”避免生硬照搬希腊语词序。脚注标记置于其实际说明的分句之后。
