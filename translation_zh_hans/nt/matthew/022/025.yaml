  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: zh_hans
  text: 我们中间有兄弟七人。第一个娶了妻，死了，没有留下后代[a]，就把妻子留给了自己的兄弟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”原文直译为“种子”，这里指子嗣或后裔。
    reason: lexical_alternative
  - marker: b
    text: 这里涉及兄弟婚的习俗：男子去世后，他的兄弟应当娶遗孀，为死者生育后代。参申命记25:5。
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: 我们中间
  rationale: παρά加与格在这里表示处于说话者所指的群体中；“我们中间”自然地保留了这一关联和在场含义。
- source_word: ἑπτὰ ἀδελφοί
  choice: 兄弟七人
  rationale: 此处是兄弟婚习俗的案例，ἀδελφοί明确指同一家中的男性兄弟；“兄弟七人”简洁自然。
- source_word: ὁ πρῶτος
  choice: 其中第一个
  rationale: πρῶτος表示七人中的先后次序，并不明确表示年龄最大，因此不译作“老大”或“长兄”。
- source_word: γήμας
  choice: 娶了妻
  rationale: 不定过去时分词表示结婚先于死亡发生；在男性作主语的语境中，“娶了妻”自然且清楚。
- source_word: ἐτελεύτησεν
  choice: 后来死了
  rationale: τελευτάω直指死亡；“后来”清楚表达分词所含的事件先后关系，而不采用委婉语。
- source_word: μὴ ἔχων σπέρμα
  choice: 没有后代
  rationale: σπέρμα字面为“种子”，在家庭和继承语境中指子嗣或后裔；“后代”既清楚又保留法律—家系层面的含义。
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: 把妻子留给了
  rationale: ἀφίημι在这里指死后留下，并非休妻或遗弃；前文已说明死亡，因此“留下”不会造成明显误解。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 自己的兄弟
  rationale: 与格指出承接寡妇的兄弟。原文只说“兄弟”，没有明说年龄关系，故不擅自译成“弟弟”。
theological_decisions:
- issue: 是否在正文中明说兄弟婚的目的或补出“娶她”
  choice: 只译出原文所说的“把妻子留给自己的兄弟”，将习俗背景放在脚注中。
  alternative: 译作“留下妻子，让自己的兄弟娶她”。
  rationale: 申命记25:5所规定的兄弟婚背景在此是预设信息，但希腊文本本身没有明说“娶她”或“为死者生子”；正文不应越过原文消除其含蓄性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“其中第一个”避免把次序误解为年龄排行；“自己的兄弟”虽略显书面，却保留了原文未说明长幼关系的表达。脚注标记分别紧随其所解释的词语和文化背景所在处。
