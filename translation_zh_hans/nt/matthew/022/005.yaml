id: MAT.22.5
reference: Matthew 22:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: zh_hans
  text: 他们却不理会[a]，就走了：一个到自己的田里去，另一个去做自己的生意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“置之不理”或“并不在意”；按上下文，指他们不理会王的邀请。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες（ἀμελέω）
  choice: 不理会
  rationale: 该分词表达漠视、疏忽或不放在心上；“不理会”符合现代汉语习惯，也保留了原文未明说宾语的特点。上下文表明所指的是王的邀请。
- source_word: ἀπῆλθον（ἀπέρχομαι）
  choice: 就走了
  rationale: 简洁自然地表达他们离开、各往别处去的叙事动作；“就”也顺畅承接前面的漠视态度。
- source_word: ὃς μὲν ... ὃς δὲ
  choice: 一个……另一个……
  rationale: 保留原文的分配和对照结构，清楚说明受邀者分别前往不同地方。
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: 到自己的田里去
  rationale: “田”直接对应 ἀγρός，“自己的”保留 ἴδιον，突出个人事务与王的邀请之间的对照。
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: 去做自己的生意
  rationale: ἐμπορία 指经商、贸易或商业活动；“做自己的生意”是自然的现代汉语，并保留 αὐτοῦ 所表达的所属关系。
theological_decisions:
- issue: ἀμελήσαντες 所隐含的宾语
  choice: 正文译为“不理会”，不明说宾语；脚注说明按上下文指王的邀请。
  alternative: 译为“不理会邀请”或“忽视了这事”。
  rationale: 希腊文没有明示宾语，虽然上下文明确指向王的邀请，正文仍保留这种省略，以免比原文说得更具体；脚注则帮助读者理解语境。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不理会”简明传达轻忽和漠视之意；冒号使后面的分述关系清楚。
