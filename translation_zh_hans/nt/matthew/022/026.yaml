lexical_decisions:
- source_word: ὁμοίως
  choice: 也同样如此
  rationale: 承接上一节所述遭遇，表明随后的人也经历了相同的事；“如此”自然补足汉语表达所需的指代，却没有增添原文未有的具体动作。
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: 第二个、第三个也
  rationale: 两个带冠词的序数词在希腊文中作名词使用；译文保留原文的省略，不明说“兄弟”，并用“也”体现连接词 καὶ 的递进承接作用。
- source_word: ἕως τῶν ἑπτά
  choice: 一直到第七个
  rationale: 表示同样的情况延续到七人中的最后一人。“第七个”符合现代汉语习惯，也保留原文按次序推进至七人的表达。
