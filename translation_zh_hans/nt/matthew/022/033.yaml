base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: zh_hans
  text: 众人听见这话[a]，都对他的教导感到惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听了以后”；较直译：“听见了”。
    reason: 说明ἀκούσαντες的分词表达方式，并指出“这话”是按上下文补出的宾语。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见这话
  rationale: 该词是修饰“众人”的不定过去时主动分词；译为自然的时间性表达。“这话”承接上文耶稣刚才的回答，属于按语境补出的宾语。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 原文为带冠词的复数名词。现代汉语叙事中“众人”自然地表示在场的群众，同时避免生硬地直译复数形式。
- source_word: ἐξεπλήσσοντο
  choice: 都……感到惊讶
  rationale: 未完成过去时描写众人当时持续或鲜明的反应；“感到惊讶”准确而自然，“都”使复数群体的共同反应更清楚。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: 对他的教导
  rationale: ἐπί加与格在此表示引发惊讶的根据或缘由；“对他的教导感到惊讶”符合现代汉语习惯，并保留διδαχή的“教导”含义。
- source_word: καὶ
  choice: （不单独译出）
  rationale: καί连接本句与上文；汉语紧接前文时无需机械译作“于是”或“并且”，省略后叙事衔接仍然清楚自然。
theological_decisions: []
