  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: zh_hans
  text: 这是伟大而居首位的诫命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是首要的诫命。”希腊文有两个并列的描述语，直译为：“这是伟大而第一的诫命。”
    reason: 说明可行的整合译法，并保留原文以两个并列形容词修饰“诫命”的信息。
lexical_decisions:
- source_word: αὕτη
  choice: 这
  rationale: 指回第37节刚引用的诫命；“这”在现代汉语中自然，并保留指示和回指作用。
- source_word: ἐστὶν
  choice: 是
  rationale: 简单的系词，直接译为“是”。
- source_word: μεγάλη
  choice: 最大
  rationale: 此处表示重要性或地位之高。汉语若直译“大的诫命”不自然；结合语境译为“最大”能表达其等级意义，但脚注保留希腊文正级“大的”这一形式信息。
- source_word: πρώτη
  choice: 第一
  rationale: 表示次序或地位居首；译为“第一”直接保留原文与“大”并列的第二个描述。
- source_word: ἐντολή
  choice: 诫命
  rationale: 在圣经和犹太律法语境中，“诫命”比“命令”更贴切，也与上下文谈论律法相呼应。
theological_decisions:
- issue: μεγάλη与πρώτη如何共同描述这条诫命
  choice: 将两个形容词都明确译出：“最大、也是第一的诫命”
  alternative: “首要的诫命”或“最大且第一的诫命”
  rationale: 原文以两个并列形容词修饰“诫命”。正文保留“最大”和“第一”两个概念，不将它们合并为单一的“首要”；脚注则说明μεγάλη在形式上是正级，以保存原文措辞的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“诫命”保留经文和律法语域；用“也是”使两个并列描述在汉语中衔接自然。
