source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: zh_hans
  text: 王对他说：“朋友，你没有穿婚宴的礼服，怎么进到这里来了？”那人却哑口无言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被噤声了。”这个希腊语动词也可指给动物套上笼嘴。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: 朋友
  rationale: 这是呼格称呼；在马太福音的语境中礼貌而带有疏离和责问意味。“朋友”自然地保留了这种张力，不额外强化亲密或敌意。
- source_word: πῶς
  choice: 怎么
  rationale: 询问进入的方式或情形，而非直接追问动机；“怎么”准确反映希腊语的疑问意义。
- source_word: εἰσῆλθες ὧδε
  choice: 进到这里来了
  rationale: 不定过去时指已经完成的进入动作；此译符合现代汉语表达，也保留“进入这里”的空间意味。
- source_word: μὴ ἔχων
  choice: 没有穿
  rationale: 结合衣服这一宾语，汉语用“没有穿”比直译“没有拥有”自然，并保留当时未穿相应礼服的伴随情形。
- source_word: ἔνδυμα γάμου
  choice: 婚宴的礼服
  rationale: 指与婚礼或婚宴相称的衣服；“婚宴的礼服”贴合比喻中的筵席场景，又不武断限定衣服的具体样式。
- source_word: ἐφιμώθη
  choice: 哑口无言
  rationale: 该被动动词本义可指“套上笼嘴”，引申为“使沉默”。本处描写那人无法作答，“哑口无言”以自然汉语表达叙事结果；较直译的含义收入脚注。
theological_decisions:
- issue: 主人称呼衣着不当之人的语气
  choice: 用礼貌却带责问意味的“朋友”
  alternative: 译作“同伴”或采用更严厉的称呼
  rationale: 原文称呼本身兼有表面礼貌与语境中的疏离感；译文保留这种叙事张力，不把它解释成真挚亲密或公开敌视。
- issue: ἐφιμώθη所表达的沉默
  choice: 正文按结果译为“哑口无言”
  alternative: 较形式对应地译为“被噤声了”或按字面背景译为“被套上了笼嘴”
  rationale: 语境首先表明此人无话可答，但被动形式及动词鲜明的字面背景仍有解释价值，因此正文采用自然表达，脚注保留较直译信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王对他说”自然承接上文主语；问句调整为符合汉语习惯的语序。脚注标记紧随其所解释的“哑口无言”。
