  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: zh_hans
  text: 第二条也与它相似[a]：“要爱你的邻舍，如同爱自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“另有第二条，也与它相似。”
    reason: 保留Δευτέρα无冠词而作名词使用时，可表达“第二条”或“另有第二条”的细微差别。
lexical_decisions:
- source_word: Δευτέρα
  choice: 第二条
  rationale: 阴性序数词在此作名词用，承接上文所说的诫命；“第二条”既保留次序，也符合现代汉语表达。希腊文未带冠词所留下的轻微不确定性在脚注中说明。
- source_word: δὲ
  choice: 也
  rationale: 此处是温和的承接，并非强烈转折；“也”自然地推进话语，并显示这条诫命与上一条的关联。
- source_word: ὁμοία αὐτῇ
  choice: 与它相似
  rationale: ὁμοία与第三格αὐτῇ搭配，意为“与它相似”；“它”回指第一条诫命，不额外解释相似的具体层面。
- source_word: Ἀγαπήσεις
  choice: 要爱
  rationale: 将来时直陈语气在所引诫命中具有命令效力。“要爱”在现代汉语中庄重、清楚，并保留诫命语气。
- source_word: τὸν πλησίον σου
  choice: 你的邻舍
  rationale: 该表达指“你的邻舍”，不只表示空间上靠近的人。“邻舍”准确保留经文中的伦理关系用语。
- source_word: ὡς
  choice: 如同
  rationale: 引出比较的标准；“如同”自然且庄重。
- source_word: σεαυτόν
  choice: 自己
  rationale: 反身代词回指受命者；在“如同爱自己”中表达直接、自然。
theological_decisions:
- issue: 第二条诫命与第一条诫命的关系
  choice: 第二条也与它相似
  alternative: 另有第二条，也与它相似
  rationale: 译文保留两条诫命之间的比较，既不把二者合并，也不擅自界定它们在哪一方面相似。正文采用符合上下文的定指表达，脚注保留希腊文无冠词形式可能支持的另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“邻舍”较日常的“邻居”范围更广，也更准确对应原文；避免用“爱人如己”，以免将“你的邻舍”泛化并省去所有格关系。
