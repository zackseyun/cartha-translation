  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: zh_hans
  text: 全部律法和先知书都系于这两条诫命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “系于”直译有“悬挂在……上”的意思；这里表示全部律法和先知书都以这两条诫命为所依。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: 系于这两条诫命
  rationale: 希腊语介词ἐν在这里与κρέμαται共同构成依附的意象。现代汉语用“系于”既能保留“悬系”的比喻，又能自然表达以这两条诫命为所依。
- source_word: ὅλος ὁ νόμος
  choice: 全部律法
  rationale: ὅλος修饰单数νόμος，强调整体和全体范围。“全部律法”简明保留其完整性；“律法”在此指向犹太圣经中的律法传统，而非泛指法律。
- source_word: κρέμαται
  choice: 系于
  rationale: κρέμαται本义为“悬挂”，在本句中表达依附或以某物为纲。“系于”保留原文鲜明比喻，同时在现代汉语中庄重自然，避免用“取决于”过度解释。
- source_word: καὶ οἱ προφῆται
  choice: 和先知书
  rationale: 这里与“律法”组成固定的经书概称。“先知书”比单说“先知”更清楚地表明所指是先知著作及其经文见证，而不是先知个人。
theological_decisions:
- issue: “律法和先知书”的所指范围
  choice: 保留这一固定经书概称，指向整体的圣经见证
  alternative: 仅指律法与先知著作中的伦理教训
  rationale: 马太福音中“律法和先知”是概括权威经书及其教导的惯用表达。译文不将其直接改写为“全部圣经”，以保留原文的犹太经书用语及其可能的范围张力。
- issue: 两条诫命与律法和先知书的关系
  choice: 以“系于”保留依附、悬系的比喻
  alternative: 译为“都以这两条诫命为总纲”或“都取决于这两条诫命”
  rationale: 原文说明整体律法和先知书与两条爱之诫命的根本关系，但没有直接使用“总结”或“总纲”等名词；保留比喻可避免把关系限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“全部律法和先知书”保留传统经书概称；“系于”略带书面色彩，但能简洁保存原文的悬系意象。
