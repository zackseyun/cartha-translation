  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: zh_hans
  text: 法利赛人听说耶稣使撒都该人哑口无言[a]，就聚集在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“给动物戴上口套”。希腊语动词本可指给动物戴上口套；这里比喻使撒都该人在辩论中无话可答。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的叙事承接，并带有与上一场交锋相对照的意味；汉语按事件顺序自然衔接即可，若硬译为“但是”反而显得突兀。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经与历史文献中通行的犹太群体名称音译。
- source_word: ἀκούσαντες
  choice: 听说
  rationale: 不定过去时分词在此表达时间背景；“听说”既自然，也准确传达他们得知先前事件。
- source_word: ἐφίμωσεν
  choice: 使……哑口无言
  rationale: 该动词本义可指给动物套上笼嘴，这里比喻使辩论对手无法回应。“使……哑口无言”保留了强烈、形象的语气，同时符合现代汉语表达。
- source_word: Σαδδουκαίους
  choice: 撒都该人
  rationale: 采用现代中文圣经与历史文献中通行的犹太群体名称音译。
- source_word: συνήχθησαν
  choice: 聚集
  rationale: 该被动形式在上下文中具有不及物或中间语态意义，指众人会聚。
- source_word: ἐπὶ τὸ αὐτό
  choice: 在一起
  rationale: 这一惯用语可表示“同在一处”或“一起”；此处不明确强调地点或目的，因此保留较宽泛的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哑口无言”比单纯的“使……沉默”更能保留原文动词的力度；脚注说明其具体的“套笼嘴”意象。为避免代词指向在单节引用时含混，正文将主语明确译为“耶稣”。
