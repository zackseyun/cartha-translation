  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: zh_hans
  text: 所以，你们要到道路的岔口去[a]；凡是你们遇见的人，都邀请来参加婚宴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到十字路口去”或“到道路的出口去”；希腊原文所指的是道路分岔、交汇或通出的地方。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译“婚礼”（复数）；这里指婚礼庆典或筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: 你们要……去
  rationale: 以自然的现代汉语表达复数命令语气，既清楚又不过分正式。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并表示由此前命令引出的结果；“所以”比“因此”更自然，同时保留逻辑关联。
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: 到大路的岔口去
  rationale: διέξοδοι 可指道路通出、分岔或交汇之处。“大路的岔口”在现代汉语中清楚自然，并保留具体地理形象；脚注说明其他可能理解。
- source_word: ὅσους ἐὰν εὕρητε
  choice: 凡遇见的，都
  rationale: 该结构兼有不确定性与范围广泛之意；“凡……都”自然表达不加筛选，并比单说“无论谁”更贴近原文整体数量范围。
- source_word: καλέσατε
  choice: 邀请
  rationale: 在婚宴语境中，καλέω 指邀请赴宴，而非仅仅呼喊或召唤。
- source_word: εἰς τοὺς γάμους
  choice: 来参加婚宴
  rationale: 复数 γάμοι 在此按惯用法指婚礼庆典或筵席，而非多场婚礼；“参加婚宴”符合现代汉语宴请语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大路的岔口”保留场景感；“凡遇见的，都邀请来”简洁地传达命令的广泛范围。所有脚注标记均置于正文相应词语之后。
