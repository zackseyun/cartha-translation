  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: zh_hans
  text: “老师，律法中哪一条诫命是最大的[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“是大的”；这里也可理解为“最重要的”。
    reason: 说明希腊文形容词采用原级形式，而上下文具有比较或排序的含义。
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是称呼语；“老师”是现代汉语中自然、通行的对应表达，准确传达耶稣作为教导者的身份，又不额外加入“主人”等等级意味。
- source_word: ποία
  choice: 哪一条
  rationale: 该疑问形容词是在一组诫命中询问具体的一条；“哪一条”符合汉语对条文或诫命的自然量词搭配。
- source_word: ἐντολὴ
  choice: 诫命
  rationale: 在犹太律法与经文语境中，“诫命”既准确又沿用现代汉语圣经语汇，并保留其宗教法令含义。
- source_word: μεγάλη
  choice: 最大的
  rationale: 原文虽用原级形容词“大的”，但在“哪一条……是大”的问句结构中具有比较、排序的语用力量；现代汉语用“最大的”才能自然表达这一含义，同时以脚注保留原文形式。
- source_word: ἐν τῷ νόμῳ
  choice: 律法中
  rationale: 此处 νόμος 特指犹太人的律法，即摩西律法；“律法中”简洁、明确，也比音译“妥拉”更便于普通读者理解。
theological_decisions:
- issue: μεγάλη 应按原级形式译作“大的”，还是按语境译作最高级“最大的”
  choice: 最大的
  alternative: 大的／算大的
  rationale: μεγάλη 在形态上是原级，但问题是在众诫命中辨明居首或最重要的一条。汉语若直译为“哪一条……是大的”生硬且可能含混，因此正文采用自然的最高级表达；脚注说明原文形式，以保留其语言张力。
translation_notes:
  register: 采用现代、庄重而口语自然的问句。“老师”符合当面称呼，“律法”和“诫命”保留经文语境中的常用术语。
