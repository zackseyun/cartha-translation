  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们错了[a]，因为你们既不明白圣经，也不知道上帝的大能。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们受了迷惑”，或“你们走入歧途”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣回答他们说
  rationale: 将希腊语常见的“回答着……说”应答结构自然地译为现代汉语“回答他们说”；δέ在此主要承接并略带转折，无须机械另译。
- source_word: Πλανᾶσθε
  choice: 你们错了
  rationale: 此处表示处于错误或迷误之中。“你们错了”自然、直接，又不限定错误必定源于外在欺骗；其他可能译法见脚注。
- source_word: μὴ εἰδότες
  choice: 因为你们既不明白……也不知道……
  rationale: 否定分词在语境中说明他们犯错的原因；用“因为”显明其因果功能，并以“既不……也……”对应与μηδέ构成的并列否定。
- source_word: τὰς γραφὰς
  choice: 圣经
  rationale: 复数γραφαί在犹太及早期基督教语境中指被视为神圣权威的经卷；现代汉语以“圣经”表达自然准确。
- source_word: τὴν δύναμιν τοῦ θεοῦ
  choice: 上帝的大能
  rationale: δύναμις指能力、权能；“大能”保留庄重的经文语体，所有格则自然译作“上帝的”。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 此处θεός指犹太经文语境中的独一神；采用现代中文基督教文本中通行且庄重的“上帝”。
theological_decisions:
- issue: 撒都该人错误的原因
  choice: 耶稣指出，他们错在既不明白圣经，也不知道上帝的大能。
  alternative: 把μὴ εἰδότες仅译成伴随状态“并不明白”，弱化其解释原因的作用。
  rationale: 否定分词μὴ εἰδότες及其由μηδέ连接的两个宾语，在此自然说明Πλανᾶσθε所指错误的原因；译文保留这一因果关系，而不进一步界定他们无知的性质。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“明白圣经”与“知道上帝的大能”既避免生硬重复，又保留两个并列否定对象；脚注保存Πλανᾶσθε可表示受迷惑或陷入迷误的语义幅度。
