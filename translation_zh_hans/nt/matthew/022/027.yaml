  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: zh_hans
  text: 最后，那女人也死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“末了，那女人死了。”希腊文也可较直译为：“在所有人之后，那女人死了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: 最后
  rationale: 与 πάντων 连用，表示叙事次序中的末后阶段；现代汉语用“最后”简洁自然。
- source_word: δὲ
  choice: 也
  rationale: δέ 是较弱的连接词；结合上下文前述各人相继死亡，译作“也”自然承接，并突出那女人同样死亡。
- source_word: πάντων
  choice: （融入“最后”）
  rationale: 该词与 ὕστερον 构成“在所有人之后／最后”的意思。汉语单用“最后”已能自然表达这一顺序，脚注保留较直译的形式。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 直接陈述死亡事件，不使用委婉语。
- source_word: ἡ γυνή
  choice: 那女人
  rationale: γυνή 可指“女人”或“妻子”；此处同一女人先后与多兄弟成婚，译作“那女人”既指向明确，也避免从某一位丈夫的角度称她为“妻子”。
