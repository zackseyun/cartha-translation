  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: zh_hans
  text: 其中有一个律法专家[a]试探耶稣，问他：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法师”。这里指精通犹太律法的人。
    reason: 说明νομικός的语境含义，并保留传统译法，避免读者按现代职业“律师”理解。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本节承接上文；现代汉语在此省略简单连接词更自然，叙事联系仍由语境清楚表达。
- source_word: ἐπηρώτησεν
  choice: 问他
  rationale: 准确表达询问之意；句末冒号自然引出下一节的问题，无须添加原文没有的“一个问题”。
- source_word: εἷς ἐξ αὐτῶν
  choice: 其中有一个
  rationale: 自然表达部分结构，说明此人属于上文所提到的群体。
- source_word: νομικὸς
  choice: 律法专家
  rationale: 在当时犹太语境中指精通摩西律法的人；避免现代“律师”使人误以为是从事民事或法庭业务者。
- source_word: πειράζων
  choice: 试探
  rationale: 分词在此说明发问的意图或伴随情形，带有考验、设难的意味；“试探”保留其可能具有敌意的语义张力。
- source_word: αὐτόν
  choice: 耶稣／他
  rationale: 第一个宾语代词为避免连续使用两个“他”造成指代含混而明示为“耶稣”，在“问他”中则自然使用代词。
theological_decisions:
- issue: πειράζων描述对耶稣行为的语气
  choice: 试探耶稣
  alternative: 考验耶稣
  rationale: 原词可指试验、考验或试探。“试探”保留此处带有挑战或设难的可能性，同时不把它限定为引诱犯罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。调整分词次序为“试探耶稣，问他”，符合汉语表达，并用冒号承接下一节直接引语。
