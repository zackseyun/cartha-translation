source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: zh_hans
  text: “我是亚伯拉罕的上帝、以撒的上帝、雅各的上帝。”上帝不是死人的上帝，而是活人的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 以现代汉语直接表达现在时的自我宣告，并保留引文措辞及耶稣论证所依托的当下关系。
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: 亚伯拉罕的上帝、以撒的上帝、雅各的上帝
  rationale: 逐项保留“上帝”的重复，以体现希腊文的排比和修辞分量；汉语用顿号自然连接各项。
- source_word: οὐκ ἔστιν ὁ θεὸς νεκρῶν
  choice: 上帝不是死人的上帝
  rationale: 保留希腊文第二句明确重复的“上帝”，在汉语中自然清楚，也无需像英文主文那样改用代词。
- source_word: νεκρῶν
  choice: 死人
  rationale: 该复数形容词作名词使用；“死人”简洁自然，并与“活人”构成鲜明对照。
- source_word: ζώντων
  choice: 活人
  rationale: 该现在分词作名词使用；“活人”在现代汉语中自然地保留与“死人”的简洁对偶。
theological_decisions:
- issue: 耶稣以族长在上帝面前仍然活着来论证复活
  choice: 按原文直译为“上帝不是死人的上帝，而是活人的上帝”
  alternative: 上帝不是死人的上帝，而是那些在他面前仍然活着之人的上帝
  rationale: 不把经文扩展为关于复活或中间状态的解释性陈述，保留原句本身的论证力度与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”的重复忠实呈现原文排比；后半句也保留原文明确出现的“上帝”。引号标示耶稣所引用的经文。
