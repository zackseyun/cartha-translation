  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: zh_hans
  text: 于是，他对自己的仆人说：“婚宴已经预备好了，但那些受邀的人[a]不配赴宴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些蒙召的人。”希腊文分词可较直译为此；但在这里的婚宴语境中，是指受邀参加婚宴的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接叙事次序，表示随后发生的行动；现代汉语中“于是”自然流畅。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时以增强叙事现场感；汉语“说”本身不标明时态，既自然，也无需强行改为过去时。
- source_word: δούλοις
  choice: 仆人
  rationale: δοῦλος可指奴隶或仆役；本节是王室婚宴的比喻场景，重点在其奉命办事的身份，因此“仆人”贴合语境，又不额外突出法律上的奴隶身份。
- source_word: Ὁ μὲν γάμος
  choice: 婚宴
  rationale: γάμος在本段指婚礼庆典及宴席，而不只是婚姻关系；“婚宴”简明地传达当前语境。μὲν与后面的δέ共同构成对比，由汉语“但”体现。
- source_word: ἕτοιμός ἐστιν
  choice: 已经预备好了
  rationale: 表达宴席现已就绪；加入“已经”自然体现完成后的当前状态，但不把形容词结构改解为被动动作。
- source_word: οἱ δὲ κεκλημένοι
  choice: 那些受邀的人
  rationale: κεκλημένοι是καλέω的完成时被动分词；在宴席语境中指先前已被邀请的人。“受邀”清楚表达其语境义，同时以脚注保留较直译的“蒙召的人”。
- source_word: οὐκ ἦσαν ἄξιοι
  choice: 配不上
  rationale: ἄξιος可指配得、相称或合宜。“配不上”保留否定性的价值判断，且不擅自说明他们不配的具体原因。
theological_decisions:
- issue: κεκλημένοι是否应译出“蒙召”的神学色彩
  choice: 正文译作“那些受邀的人”
  alternative: 那些蒙召的人
  rationale: 紧接婚宴比喻，词语首先指获邀赴宴者；正文采用语境明确的“受邀”，避免提前引入关于呼召或拣选的特定神学范畴，同时在脚注保留原词较直译的表达。
- issue: ἄξιοι所指“不配”的根据
  choice: 只译作“配不上”，不补充原因
  alternative: 不配参加婚宴；不值得受邀
  rationale: 原文作出评价，却未在本节明确界定“不配”的根据；译文保留这种张力，不把解释写进正文。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“婚宴”“预备好了”“配不上”均为普通读者易懂的表达；保留引语形式及原句的鲜明转折。
