  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: zh_hans
  text: 如果大卫称他为“主”[a]，那么他怎么会是大卫的子孙呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按上下文更明确地译作：“如果大卫称弥赛亚为‘主’，那么弥赛亚怎么会是大卫的子孙呢？”
    reason: 说明代词“他”在上下文中的所指，同时标明这是明确化译法，并非本节希腊文本明说“弥赛亚”。
lexical_decisions:
- source_word: εἰ οὖν
  choice: 那么……既
  rationale: 保留εἰ的条件意味和οὖν的推论作用；现代汉语用“那么……既”能自然承接上文，并引出反问，又不把前提改写成无条件断言。
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: καλεῖ
  choice: 称
  rationale: 这里指以某一称谓称呼某人；“称”准确表达καλέω的命名、称呼意味，也比泛泛的“说”更贴合引文论证。
- source_word: αὐτὸν
  choice: 他
  rationale: 按原文保留代词，让所指承接上文，不在正文中明加“弥赛亚”。
- source_word: κύριον
  choice: 主
  rationale: “主”既是κύριος的标准译法，也保留诗篇引文中的尊称及其基督论张力；“主人”会削弱这种互文意味。
- source_word: πῶς
  choice: 怎么
  rationale: 自然、直接地表达逻辑上的反问，适合现代标准汉语。
- source_word: υἱὸς αὐτοῦ
  choice: 大卫的子孙
  rationale: “子孙”在此自然表达王室谱系中的后裔关系。为避免汉语中连续两个“他”造成所指含混，将属主代词明示为“大卫”；虽比字面的“他的儿子”略作调整，却没有消除原文关于大卫后裔身份的张力。
- source_word: ἐστιν
  choice: 是
  rationale: 直接保留现在时系词所表达的身份关系。
theological_decisions:
- issue: 大卫称那位为“主”与那位是大卫子孙之间的弥赛亚及基督论张力
  choice: 正文保留“主”与“大卫的子孙”并置，不解释二者如何相容。
  alternative: 在正文中明确写成“弥赛亚”，或加入“怎么还能只是大卫的子孙”等解释性措辞。
  rationale: 原文此节只用代词αὐτόν承接上文；明加“弥赛亚”虽可帮助理解，却属于语境补足。译文应让耶稣的反问同时保留大卫后裔身份与超越性主权，不以译者的 doctrinal explanation 消解张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么……既……怎么又……”清楚呈现推论与反问结构；引号标出“主”是大卫对那位的称呼。正文不用生硬的“若因此”，也不加入解释性教义结论。
