  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his slaves, mistreated them and killed them.
translation:
  language: zh_hans
  text: 其余的人却抓住他的奴仆[a]，凌辱他们，又杀了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”（希腊文δοῦλους）。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: 但其余的人却
  rationale: λοιποί指先前受邀者中其余的人；“但……却”自然表达δέ在上下文中的轻微转折，与上一节那些不理会邀请的人形成对照。
- source_word: κρατήσαντες
  choice: 抓住
  rationale: κρατέω在此指强行抓住、控制；汉语按事件顺序连接动作，既自然，也反映不定过去时分词先于主要动作发生。
- source_word: τοὺς δούλους αὐτοῦ
  choice: 他的奴仆
  rationale: δοῦλος可指奴隶或仆人；“奴仆”既保留其隶属身份，也符合尊严而通俗的现代中文表达，并以脚注注明较宽泛的译法。
- source_word: ὕβρισαν
  choice: 凌辱他们
  rationale: ὑβρίζω不只表示言语侮辱，也可涵盖粗暴、羞辱性的虐待；“凌辱”在此简洁地保留这种较强含义。
- source_word: ἀπέκτειναν
  choice: 把他们杀了
  rationale: 直接表达ἀποκτείνω的杀害之意，不额外加入“谋杀”等法律判断。
theological_decisions:
- issue: 比喻语境中δοῦλος的译法
  choice: 奴仆
  alternative: 仆人
  rationale: 此处人物是王所差遣、隶属于王的人。“奴仆”保留原词所含的社会身份，不把他们仅仅现代化为一般雇员；“仆人”仍是语义上可行且更宽泛的译法，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但……却”略显强调，但能清楚承接上一节的对比；“又把他们杀了”使两个并列主要动词在汉语中层次清楚。
