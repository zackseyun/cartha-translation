  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: zh_hans
  text: 王进来察看席间的宾客[b]，看见那里有一个人没有穿婚宴礼服。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有穿婚礼的衣裳。”
    reason: lexical_alternative
  - marker: b
    text: “席间的宾客”原文直译为“斜倚用餐的人”；古代正式宴席上，宾客通常斜倚在席位上进餐。
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν δὲ ὁ βασιλεὺς
  choice: 王进来……时
  rationale: 以时间从句自然表达先于主句发生的简单过去分词；δέ在此推动叙事并带轻微转折，中文无须机械译出“但是”，以免过度强化对比。
- source_word: θεάσασθαι
  choice: 察看
  rationale: 不定式表示王进来的目的。“察看”既保留有意观看、审视的意味，又不把它夸大为正式检查。
- source_word: τοὺς ἀνακειμένους
  choice: 席间的宾客
  rationale: 原文直指“斜倚用餐的人”。“席间的宾客”在现代中文中自然地交代宴席身份和场景；古代宴席斜倚的姿势另以脚注保留。
- source_word: εἶδεν ἐκεῖ
  choice: 看见那里有
  rationale: 直接保留“看见”和地点副词“那里”，并按现代汉语语序组织。
- source_word: ἄνθρωπον
  choice: 一个人
  rationale: 在此指故事中的单个成年男子；现代汉语“人”本身不标语法性别，译作“一个人”准确自然，也不额外强化原文未着重强调的性别。
- source_word: οὐκ ἐνδεδυμένον ἔνδυμα γάμου
  choice: 没有穿婚宴的礼服
  rationale: ἐνδεδυμένον描写此人当时未穿着的状态；ἔνδυμα γάμου可指适合婚宴的衣服。“婚宴的礼服”既合乎语境，也保留单数衣服意象。
theological_decisions:
- issue: 宴席姿势的文化意象
  choice: 正文译作“席间的宾客”，脚注说明原文为斜倚用餐
  alternative: 正文直译为“斜倚席上的人”
  rationale: 这既让普通现代读者立即明白人物是宴席宾客，也没有丢失古代正式宴饮时斜倚用餐的历史细节。
- issue: ἔνδυμα γάμου的具体所指
  choice: 译作“婚宴的礼服”，不说明其来源、发放方式或象征含义
  alternative: 译作“婚礼服”或解释为主人提供的礼服
  rationale: 原文只说此人没有穿ἔνδυμα γάμου，并未说明服装由谁提供，也未在本节明说其神学象征；译文应保留比喻的张力，避免加入推测。
- issue: ἄνθρωπον的性别表达
  choice: 一个人
  alternative: 一个男人
  rationale: 希腊语ἄνθρωπος在具体语境中可指某个人，语法形式为阳性，但不如ἀνήρ明确强调男性身份。中文“一个人”忠实保留指称而不增加性别强调。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“席间的宾客”避免生硬直译，同时用脚注保留古代宴饮姿势；“婚宴的礼服”自然且不对礼服的来源或象征作超出原文的解释。
