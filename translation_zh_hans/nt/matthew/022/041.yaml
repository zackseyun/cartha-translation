base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: zh_hans
  text: 法利赛人聚集在一起的时候，耶稣问他们：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: 聚集在一起的时候
  rationale: 这是属格独立结构中的完成时被动分词，用作全句的背景情境。译为“聚集在一起的时候”，既保留同时发生的时间关系，也体现 συνάγω 的群体聚集含义；汉语无需机械表达被动。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ 在此是轻微的语篇衔接词，并非明确的转折或表示“现在”的时间副词。现代汉语在本句中省略更自然，句间推进可由上下文体现。
- source_word: τῶν Φαρισαίων
  choice: 法利赛人
  rationale: 采用现代中文圣经语境中通行且易懂的群体名称；该属格名词与分词共同构成属格独立结构。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 此处 ἐπερωτάω 引出耶稣接下来向法利赛人提出的问题。“问”准确自然，也避免“质问”所增加的敌对语气。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 直接宾语，回指前面提到的法利赛人。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 专名作主语；希腊语专名前的冠词不需在汉语中另行表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“……的时候”清楚呈现背景从句，末尾用冒号承接下一节耶稣所问的内容。
