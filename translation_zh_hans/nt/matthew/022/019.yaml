  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: zh_hans
  text: “把纳税用的钱币[a]拿给我看。”他们就拿来一枚第纳尔币给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纳税”也可译作“缴人头税”或“缴人口登记税”；原文所用的词指罗马帝国征收的一种税。
    reason: 说明κῆνσος的词义范围及其罗马税制背景，同时避免“户口税”可能造成的误解。
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: 拿给我看
  rationale: 该词是第二人称复数、不定过去时主动命令式，基本意思是“给……看、出示”。“拿给我看”在现代汉语中自然，也保留了让对方拿出实物供察看的意思。
- source_word: νόμισμα
  choice: 钱币
  rationale: νόμισμα指流通的钱币；“钱币”既准确又与下文具体提到的第纳尔币衔接自然。
- source_word: τοῦ κήνσου
  choice: 纳税用的
  rationale: κήνσος是源自拉丁语的借词，指当时向罗马政权缴纳的税。“纳税用的”自然表达了属格在这里所指的用途，同时不在正文中过度限定税种。
- source_word: προσήνεγκαν
  choice: 拿来
  rationale: προσφέρω在此叙事语境中表示把东西带到某人面前；“拿来”简洁自然，也与前面的命令相呼应。
- source_word: δηνάριον
  choice: 一枚第纳尔币
  rationale: δηνάριον是特定的罗马钱币名称。音译为“第纳尔币”保留历史具体性；量词“一枚”符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拿给我看”比“出示给我”更口语自然，但仍适合经文体；“第纳尔币”保留古代钱币名称，避免用现代币值作不准确的替换。
