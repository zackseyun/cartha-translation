  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: zh_hans
  text: 耶稣又回应他们，用比喻说[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣又回答他们，借着比喻说道。”希腊文使用常见的叙事表达“回答”，即使紧接上文并没有明确记载一个问题。
    reason: 说明 ἀποκριθεὶς 的字面译法与叙事惯用含义，并保留较形式对应的备选译文。
lexical_decisions:
- source_word: Καὶ
  choice: 又
  rationale: 结合 πάλιν 译作“又”，自然承接上文，并表达再次说话；不额外强化时间先后。
- source_word: ἀποκριθεὶς
  choice: 回应
  rationale: 该词是 ἀποκρίνομαι 的不定过去时分词。此处虽没有紧接着出现明确问题，却可按希腊叙事惯用法表示对当前情势或对话作出回应；“回应”比“回答”更符合现代汉语语感，同时保留其话语承接功能。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语中通行的专名译法；希腊语专名前的冠词无需另译。
- source_word: πάλιν
  choice: 又
  rationale: 表示动作再次发生；汉语以“又”简洁自然地传达其重复意义。
- source_word: εἶπεν
  choice: 说
  rationale: 表示耶稣开口讲话。汉语可将 εἶπεν 与后面的 λέγων 合并表达，避免机械译成“说……说道”。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: ἐν 加与格在此表达方式或媒介；“用比喻”是自然、清楚的现代汉语。原文使用复数，可能指这一系列比喻性教导，而本节随即引出一个比喻；汉语类名词“比喻”本身不必显式标复数。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与“回应”搭配作宾语，明确耶稣说话所面对的对象。
- source_word: λέγων
  choice: 说
  rationale: 该现在分词引出下文直接话语；在汉语中与主要动词整合为句末“说”，自然引出后文。
theological_decisions:
- issue: 前文没有紧接着出现明确问题时，ἀποκριθεὶς 的叙事惯用含义
  choice: 译为“回应”，保留其对上文情势或话语作出反应的功能
  alternative: 译为“回答”，或省略为“耶稣又用比喻对他们说”
  rationale: “回答”更贴近词的常见字面对应，却容易让现代读者误以为前一刻有明确提问；完全省略又会损失原文的话语承接。译作“回应”兼顾原文形式和自然汉语，不把这里解释成特定的神学主张。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回应他们”保留原文的承接意味，“用比喻说”则自然引出下一节内容。脚注标记已在正文中以 [a] 出现。
