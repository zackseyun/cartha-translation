  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: zh_hans
  text: “主对我的主说：‘你坐在我的右边，直到我把你的仇敌放在你脚下。’？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 两处κύριος均译为“主”，忠实保留希腊文本使用同一称号的特点；以“我的主”体现第二处与说话者的关系，不用“大写的主”把希伯来文神名的区分直接带入希腊文。
- source_word: Εἶπεν
  choice: 说
  rationale: λέγω的不定过去时在引语公式中自然译为“说”，简明且不额外强化语气。
- source_word: τῷ κυρίῳ μου
  choice: 对我的主
  rationale: 与格表示受话者；“我的主”既保留κύριος的称号，也清楚表达μου的所属关系。
- source_word: Κάθου
  choice: 你坐
  rationale: κάθημαι的现在时命令式在登基语境中译为“你坐”简洁自然；汉语补出“你”以明确命令对象。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 准确传达位于说话者右侧这一尊荣与掌权的位置，符合现代汉语表达。
- source_word: ἕως ἂν θῶ
  choice: 直到我把……放在
  rationale: ἕως ἂν加不定过去时虚拟式指向将来界限，“直到我把……放在”自然保留其时间关系。
- source_word: τοὺς ἐχθρούς σου
  choice: 你的仇敌
  rationale: “仇敌”准确表达敌对者，语体庄重而清楚。
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: 在你脚下
  rationale: 按马太希腊文本直译为“在你脚下”，不在正文中补入希腊文未明说的“脚凳”意象；该希伯来语背景在脚注说明。
theological_decisions:
- issue: 诗篇110:1引文中两处κύριος的译法
  choice: 主对我的主说
  alternative: 耶和华对我的主说；主对我的主人说
  rationale: 希腊文本两处均为κύριος，因此正文以同一称号“主”对应两处，保留耶稣论证所依赖的称谓关系与张力。“耶和华”虽反映诗篇希伯来文本第一处背后的神名，却会把希腊引文未明示的区分带入正文；“主人”虽可能，却会削弱两处同词相应的效果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主”两次重复以呈现原文修辞；外层双引号与内层单引号表明本节是在引用一段包含直接话语的经文，句末问号延续耶稣所在问句。
