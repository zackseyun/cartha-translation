  source_fidelity: 正文准确表达了两个相连的否定陈述：无人能够回答耶稣，且自那日以后无人敢再向他发问。“从那天起，也没有人再敢问他什么”恰当传达了ἀπ’ ἐκείνης τῆς ἡμέρας与οὐκέτι的持续性。惟脚注将λόγον释作“一个字”不够准确；此处的“word”是“话语、答话”意义，并非汉语书写单位“字”。
  naturalness: 正文庄重、简洁，符合现代标准汉语。“回答他一句话”虽略带原文结构，但在此强调连一句答话也不能作出，仍自然可懂。
  terminology: “回答”“敢问”“从那天起”“再”均贴合原文叙事语气，没有添加有关耶稣权柄或对手动机的解释。脚注宜避免以“一个字”对应λόγον。
  issues:
