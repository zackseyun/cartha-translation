  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: zh_hans
  text: 没有人能回答他一句话[a]；从那天起，也没有人再敢问他什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“回答他一句话。”希腊语惯用语表示无人能作出任何答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 完整表达否定不定代词，指在场者中无人能够作答，符合现代汉语叙事表达。
- source_word: ἐδύνατο
  choice: 能
  rationale: 表达过去处境中的能力缺失；汉语无需另加过去时标记。
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: 回答他一句话
  rationale: 保留原文中 λόγον（“话、言语”）这一显性成分，并以“一句话”自然传达连一句也答不出的语势。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 承接前一否定分句，清楚表达递进相连的第二重否定。
- source_word: ἐτόλμησέν τις
  choice: 没有人……敢
  rationale: 在否定结构中自然表达 τολμάω 的“敢于、胆敢”之意。
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: 从那天起
  rationale: 准确标示后续情形开始的时间点，并蕴含自此持续的意义。
- source_word: ἐπερωτῆσαι
  choice: 问他什么
  rationale: 结合语境，指继续向耶稣提出问题；此处用“问”比“盘问”克制，也比单独“问他”更符合现代汉语。
- source_word: οὐκέτι
  choice: 再
  rationale: 与否定词搭配构成“没有人再……”，自然表达从那时以后不再发生。
theological_decisions:
- issue: 耶稣回答之后，对手沉默的叙事力度
  choice: 按叙事本身陈述无人能回答、也无人再敢发问
  alternative: 在译文中直接强调耶稣的智慧或权柄胜过众人
  rationale: 上下文暗示耶稣在辩论中占据决定性优势，但本节只明确叙述众人无法回答且不敢继续提问，因此不把隐含的神学结论增添进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回答他一句话”保留原文 λόγον，同时较直译“回答他一个字”更符合汉语习惯；分号清楚呈现两个相连的否定分句。
