  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: zh_hans
  text: 当天，撒都该人[a]来见耶稣；他们说没有复活，就问他：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当天，那些说没有复活的撒都该人来见耶稣，就问他。”
    reason: 希腊语现在分词 λέγοντες 可顺接译为“他们说”，也可理解为说明撒都该人特征性主张的定语。
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 当天
  rationale: 这是自然、简洁的现代汉语时间表达，准确承接同一天发生的叙事。
- source_word: προσῆλθον αὐτῷ
  choice: 来到他面前
  rationale: 既表达“走近、来到某人那里”的含义，也符合庄重而自然的叙事语体；“他”按上下文指耶稣。
- source_word: Σαδδουκαῖοι
  choice: 撒都该人
  rationale: 采用现代中文圣经传统中通行的犹太群体名称音译。
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: 他们说没有复活的事
  rationale: 保留分词结构可表示当时所说之话的读法，同时用脚注注明它也可作为对撒都该人的特征性说明。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 这是该语境中准确且通行的神学用语，不额外补入原文未明说的解释。
- source_word: ἐπηρώτησαν αὐτόν
  choice: 就问他
  rationale: 自然表达向耶稣提出问题的动作；“就”连接前述背景与随后的提问，但不额外强化敌意或审讯意味。
theological_decisions:
- issue: 如何表达撒都该人否认复活的立场
  choice: 他们说没有复活的事
  alternative: 那些说没有复活之事的撒都该人
  rationale: 希腊语现在分词既可顺接叙事为“他们说”，也可理解为说明这一群体一贯主张的定语。正文保留较贴近表层句法的表达，脚注呈现更明确的定语读法；两者都不把叙述者的转述误当作对该主张的认同。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“来到他面前”比生硬直译更符合普通读者习惯；句末用冒号承接下一节的直接引语。
