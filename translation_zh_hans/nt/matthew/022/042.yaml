  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: zh_hans
  text: 说：“你们对弥赛亚[a]怎么看？他是谁的子孙？”他们回答：“大卫的子孙。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文 Χριστός（Christos）在这里用作弥赛亚的称号。
    reason: 保留 Χριστός 的传统对应译名，并说明本处的称号用法。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 这是 λέγω 的现在分词，用来引出耶稣的话。“说”贴近原文，也避免把分词直接解释为“问”。
- source_word: Τί ὑμῖν δοκεῖ
  choice: 你们……怎么看
  rationale: δοκέω 与间接宾语连用，在此询问对方的判断或看法；“怎么看”是自然、清楚的现代汉语表达。
- source_word: περὶ τοῦ χριστοῦ
  choice: 对弥赛亚[a]
  rationale: Χριστός 在此是犹太弥赛亚讨论中的称号，而非姓名式称呼，因此译为“弥赛亚”；脚注保留传统译名“基督”。
- source_word: τίνος υἱός ἐστιν
  choice: 他是谁的子孙
  rationale: υἱός 字面是“儿子”，但此处所问的是家系和后裔身份；现代汉语用“子孙”既能自然表达这一谱系含义，也与回答“大卫的子孙”相衔接。
- source_word: λέγουσιν αὐτῷ
  choice: 他们回答
  rationale: 原文直译为“他们对他说”；因话语是对问题的答复，汉语用“回答”更自然，且未改变叙事关系。
- source_word: Τοῦ Δαυίδ
  choice: 大卫的子孙
  rationale: 希腊文只用属格“大卫的”，省略了问题中的 υἱός；汉语补出“子孙”，使省略所指清楚。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节明确讨论所盼望者的身份和大卫家系，Χριστός 是称号用法；译为“弥赛亚”能显明当时的犹太语境，同时以脚注保留“基督”这一对应译法。
- issue: υἱός 的谱系含义
  choice: 子孙
  alternative: 儿子
  rationale: 问题涉及弥赛亚与大卫的后裔关系，并非直接父子关系。“子孙”传达希腊文在家系语境中的宽泛含义，同时不预先消解随后经文提出的神学张力。
translation_notes:
  register: 采用现代、庄重而口语自然的问答表达。“怎么看”便于普通读者理解；“子孙”准确呈现古代谱系语境。脚注标记已在正文“弥赛亚[a]”处出现。
