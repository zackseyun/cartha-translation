id: MAT.22.14
reference: Matthew 22:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: zh_hans
  text: 因为被召的人多[a]，但被选中的人少[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受邀请的人”；在婚宴比喻的语境中，这个词可带有受邀赴宴的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“蒙拣选的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 人多
  rationale: 该形容词在此作名词用，指“许多人”；译作“人多”既简洁自然，也与后面的“人少”形成鲜明对照。
- source_word: γάρ
  choice: 因为
  rationale: γάρ说明这句话是对前文比喻结语的解释或理由；“因为”在现代汉语中能清楚保留这一连接作用。
- source_word: εἰσιν
  choice: （隐含于‘人多／人少’）
  rationale: 现代汉语表达数量判断时通常不必明说系词；“人多／人少”自然承载了希腊文 εἰσιν 的判断作用。
- source_word: κλητοὶ
  choice: 被召的人
  rationale: κλητοί可指“被召的”或在筵席语境中指“受邀请的”。正文采用“被召的人”，以保留该词较广的语义和与 ἐκλεκτοί 的对应关系；筵席语境中的译法列入脚注。
- source_word: ὀλίγοι
  choice: 人少
  rationale: 直接保留与 πολλοί 的反义对照，并使整句呈现简洁的格言式结构。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里表达前后两项之间的对比，“但”准确而自然。
- source_word: ἐκλεκτοί
  choice: 被选中的人
  rationale: ἐκλεκτοί可译为“被选中的”或“蒙拣选的”。正文采用普通、透明的“被选中的人”，避免把后来的系统神学术语直接带入正文，同时保留被选择的含义。
theological_decisions:
- issue: 如何翻译常用于讨论拣选教义的 ἐκλεκτοί
  choice: 被选中的人
  alternative: 蒙拣选的人
  rationale: 希腊词本身兼有一般的“被选中”和传统神学语境中的“蒙拣选”表达。正文采用语义透明的译法，不预先裁定相关教义争议；脚注保留传统译法。
- issue: 如何在婚宴比喻的语境中翻译 κλητοί
  choice: 被召的人
  alternative: 受邀请的人
  rationale: “受邀请的人”切合婚宴比喻的直接语境，但“被召的人”更能保存该词较宽的语义及其与 ἐκλεκτοί 的张力。脚注注明语境上成立的另一译法。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。句式保持原文的对称和格言感；正文中的两个被动表达保留“召”与“选”之间的神学张力，脚注则交代婚宴语境和传统术语。
