  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those slaves went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: zh_hans
  text: 那些奴隶就到各条路上去，把所遇见的人全都聚集起来，不论恶人还是好人[a]；婚宴厅[b]里便满是斜倚用餐的宾客[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不论坏人还是好人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“婚礼”或“婚宴”；这里因其被赴席者充满，所指很可能是举行婚宴的厅堂或宴席场景。
    reason: lexical_alternative
  - marker: c
    text: 当时正式宴席上的宾客通常斜倚着用餐。
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 保留该词所指的隶属身份，不以较弱的“仆人”淡化其社会现实；在比喻中，他们是受王差遣的家内奴隶。
- source_word: ὁδοὺς
  choice: 大路
  rationale: 这里泛指人们往来的公共道路；“大路”比“街道”涵盖面更广，也符合复数所呈现的各处通道。
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: 把所遇见的人全都聚集起来
  rationale: 既保留“聚集”的动作，也清楚表达 πάντας 的全面范围。
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: 不论恶人还是好人
  rationale: πονηρός 在这里带有鲜明的道德意味，译作“恶人”与“好人”形成对照；“不论……还是……”自然表达两类人都被聚集。
- source_word: γάμος
  choice: 婚宴厅
  rationale: γάμος 可指婚礼或婚宴；本句说其中“满是”用餐者，语境要求一个可容纳宾客的宴席场所，因此正文采用“婚宴厅”，并以脚注保留原词较宽的表达。
- source_word: ἐπλήσθη
  choice: 便满是
  rationale: 自然表达场所被赴宴者充满的被动结果，同时避免用“坐满”抹去下文斜倚进餐的姿势。
- source_word: ἀνακειμένων
  choice: 斜倚席间的宾客
  rationale: 该词指按古代正式宴席习惯斜倚用餐的人；正文保留这一具体姿势，并补出语境隐含的宾客身份。
theological_decisions:
- issue: 被聚集者的道德描述
  choice: 不论恶人还是好人
  alternative: 无论坏人还是好人
  rationale: “恶人”保留希腊文较强的道德分量，同时不把所有人获邀与比喻后文对赴宴者的进一步分辨混为一谈，从而保留经文中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奴隶”准确保留历史身份；“婚宴厅”使“被充满”的空间意象在中文中自然成立；分号对应希腊文两个相连的叙事分句。
