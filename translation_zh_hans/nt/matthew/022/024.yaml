  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: zh_hans
  text: 说：“老师，摩西说：‘如果一个男人死了，没有儿女，他的兄弟就应当娶死者的妻子[a]，为他死去的兄弟兴起后代。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较正式地译作：“他的兄弟应当履行娶其遗孀的义务。”希腊语此处指通常称为“兄终弟及婚”的婚姻义务。
    reason: 说明ἐπιγαμβρεύσει的专门法律含义，并以自然现代汉语表达。
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是对耶稣作为教导者的直接称呼；“老师”是清楚、自然的现代汉语表达。
- source_word: Ἐάν τις ἀποθάνῃ
  choice: 如果一个男人死了
  rationale: 这里陈述的是兄终弟及婚姻法规中的男性个案；用“一个男人”保留原文和法律情境的性别指向。
- source_word: μὴ ἔχων τέκνα
  choice: 没有儿女
  rationale: τέκνα泛指子女，并不专指儿子；“没有儿女”简洁自然，也准确表达无子女的状态。
- source_word: ἐπιγαμβρεύσει
  choice: 就要娶他的妻子
  rationale: 该动词特指与亡兄遗孀成婚、履行夫兄弟义务；正文采用自然明确的表达，专门法律含义以脚注说明。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 他的妻子
  rationale: 代词指死者的妻子；直译保留原文指代，语境已表明她此时是遗孀。
- source_word: ἀναστήσει σπέρμα
  choice: 立后
  rationale: 这是延续死者名分和后代的惯用法律表达；“立后”凝练地传达为死者兴起后嗣的含义。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 为自己的兄弟
  rationale: 与格表示受益或归属对象，即所生后代在法律和家族意义上归于已故兄弟；“为自己的兄弟”清楚保留这一关系。
theological_decisions:
- issue: 法律个案中的性别表达
  choice: 采用“一个男人”和“他的兄弟”
  alternative: 采用性别中性的“一个人……那人的兄弟”
  rationale: 这里引用摩西律法中由男性亲属承担义务的具体制度，保留男性角色符合原文和法律背景。
- issue: ἀναστήσει σπέρμα的家族及法律含义
  choice: 译作“为自己的兄弟立后”
  alternative: 译作“为自己的兄弟生养后代”或“给自己的兄弟兴起后裔”
  rationale: “立后”保留后代归于亡兄、延续其名分的法律意味；不把措辞扩展为更具体的生育机制，也不引入额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“立后”略带法律和家族语域，但在现代汉语中仍可理解，并能简洁表达原文惯用语的归属含义。脚注标记[a]已置于相关正文之后。
