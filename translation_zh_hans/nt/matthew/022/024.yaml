  source_fidelity: 正文准确保留了条件句、无子女、兄弟娶亡者之妻，以及为亡兄延续后代的法律关系。现有“立后”虽试图表达法律归属，但在现代汉语中通常指确立继承人，未必指生育后代，语义范围偏离ἀναστήσει σπέρμα。
  naturalness: “一个男人死了”与“没有儿女”自然通顺。“他的兄弟就要娶他的妻子”在连续“他／他的”指代中略有歧义；改为“死者的妻子”“死去的兄弟”可使汉语读者无须猜测代词所指。脚注中的“夫兄弟的义务”不合现代汉语习惯。
  terminology: “老师”适合此处对Διδάσκαλε的现代直接称呼。“兴起后代”较“立后”更贴近原文“raise up offspring”，并保留后代为亡兄而立的法律含义，不将其缩窄为指定继承人。以“兄终弟及婚”说明该制度的通称可行，但须表述为此处所指的婚姻义务。
