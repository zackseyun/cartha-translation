  to: 说：“老师，摩西说：‘如果一个男人死了，没有儿女，他的兄弟就应当娶死者的妻子[a]，为他死去的兄弟兴起后代。’”
  rationale: 修订将“立后”改为“兴起后代”，以准确表达为亡兄延续后代的含义；同时明确死者与其兄弟的指代，消除汉语连续代词可能造成的歧义。脚注保留并更自然地说明该动词的专门法律意义。
