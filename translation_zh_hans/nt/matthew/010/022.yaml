  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: zh_hans
  text: 你们也将因我的名[a]被众人憎恨；但忍耐到底的人[b]，这人必得救[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因我的名”也可译作“为了我的名”或“因我的缘故”。这里的“名”代表耶稣本人以及人对他的归属。
    reason: lexical_alternative
  - marker: b
    text: “忍耐到底的人”也可译作“坚持到底的人”。
    reason: lexical_alternative
  - marker: c
    text: “得救”按语境也可理解为“获救”“被解救”或“被救出”。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἔσεσθε μισούμενοι
  choice: 你们也将……被……憎恨
  rationale: ἔσεσθε与现在分词构成迂回式将来表达，表示将来的持续处境。“将被憎恨”在现代汉语中自然清楚；καί译作“也”，承接上文所述遭遇。
- source_word: ὑπὸ πάντων
  choice: 被众人
  rationale: ὑπό加属格在被动结构中标明施事者；πάντων具有概括性。“众人”既保留“所有人”的广泛意味，也符合庄重、自然的汉语表达。
- source_word: διὰ τὸ ὄνομά μου
  choice: 因我的名
  rationale: διά加宾格表示原因。“因我的名”保留圣经中“名”所涵盖的本人、权柄以及对他的归属，不将意义缩减为仅仅因为一个称谓。
- source_word: ὁ δὲ ὑπομείνας
  choice: 但忍耐……的人
  rationale: 带冠词的过去时分词在此名词化，指在逼迫中坚持承受的人。“忍耐”保留ὑπομένω承受压力而不退后的含义，又避免加入后来的教义术语。
- source_word: εἰς τέλος
  choice: 到底
  rationale: 该短语表示一直坚持到终点。“到底”是简洁自然的现代汉语，并保留终点本身在上下文中可能具有的开放性。
- source_word: οὗτος
  choice: 这人
  rationale: οὗτος承接前面的名词化分词，并带有强调作用。译出“这人”可在不明显损害汉语自然度的前提下保留原文强调。
- source_word: σωθήσεται
  choice: 必得救
  rationale: σῴζω可指拯救、救援或解救；在本处“得救”保留其较宽广的神学和末世性内涵。“必”表达将来被动陈述的确定语气，并非另加无条件保证之意。
theological_decisions:
- issue: 忍耐与最终得救之间的关系
  choice: 保留“忍耐到底……必得救”的直接联系，不进一步界定其教义机制。
  alternative: 把本句明确解释为肉身获救、末世最终得救，或某一种特定的坚忍教义。
  rationale: 经文本身把受逼迫中的忍耐与得救相连，却没有在本句中系统说明两者的关系。译文应保留这种神学张力，不以宗派框架预先化解。
- issue: σωθήσεται所指的拯救范围
  choice: 译作“必得救”，保留广义。
  alternative: 译作“必获解救”或“必被救出”，限定为具体处境中的脱险。
  rationale: 马太福音的语境容许末世性得救的理解，同时该动词本身也可表示救援或解救；“得救”能让上下文决定其范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因我的名”“忍耐到底”“得救”保留经文惯用表达及其神学广度；分号呈现两分句之间的转折关系，并译出οὗτος为“这人”，保存原文的承接与强调。
