revisions:
- from: 弟兄要把弟兄交出去，使他被处死[a]；父亲也要把自己的孩子交出去。儿女要起来反对父母，并置他们于死地。
  to: 一个兄弟要把另一个兄弟交出去送死，父亲也要把自己的孩子交出去送死；儿女要起来反对父母，并置他们于死地。
  rationale: 修订恢复前两个并列分句共有的死亡结果，并以“兄弟……另一个兄弟”消除现代汉语中“弟兄”的潜在群体称谓歧义。其余措辞保留草稿对原文的准确处理。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:56:44Z'
review_pass:
  verdict: revise
  source_fidelity: 原文两个前半分句并列：兄弟把兄弟、父亲把孩子交出，且都以死亡为结果。草稿第一分句明确了“被处死”，但第二分句在句号后仅说“交出去”，未明确保留“至于死亡”的结果，削弱了与原文的平行和语义。修订在两分句中都明示“交出去送死”。后半句“儿女要起来反对父母，并置他们于死地”准确反映ἐπαναστήσονται和θανατώσουσιν。
  naturalness: “兄弟……另一个兄弟”在现代标准汉语中比“弟兄……弟兄”更明确地表达血缘男性兄弟，避免“弟兄”可能有的教会群体称谓联想；“交出去送死”自然、庄重，并保留交付他人处置而导致死亡的意思。
  terminology: “孩子”“儿女”“父母”与τέκνον、τέκνα、γονεῖς的范围相符；“置他们于死地”适切表达蓄意致死，且“他们”的先行词清楚为“父母”。脚注保留παραδίδωμι可带“出卖”意味的词汇替代，未把该含义强加于正文。
  issues:
  - severity: medium
    issue: 第二个“交出去”未明确死亡结果
    rationale: εἰς θάνατον与“父亲把孩子交出”同属这一并列结构所表达的结果。草稿以句号隔开后，第二分句不再清楚表示父亲交出孩子是为使其死亡；应在两个分句均予保留。
  - severity: low
    issue: “弟兄”可能产生非亲属的教会语域联想
    rationale: 在现代汉语基督教语境中，“弟兄”也常指男性信徒。“兄弟……另一个兄弟”更直接对应此处的家庭关系和原文阳性单数的代表性表达。
  revised_text: 一个兄弟要把另一个兄弟交出去送死，父亲也要把自己的孩子交出去送死；儿女要起来反对父母，并置他们于死地。
  revised_footnotes:
  - marker: a
    text: “交出去”也可译作“交付”；这个动词在背信的语境中也可含“出卖”的意思。
    reason: 词义有“移交、交付”与语境中的“背叛、出卖”两层可能，正文保留较具体而不预断的“交出去”。
  revision_rationale: 修订恢复前两个并列分句共有的死亡结果，并以“兄弟……另一个兄弟”消除现代汉语中“弟兄”的潜在群体称谓歧义。其余措辞保留草稿对原文的准确处理。
