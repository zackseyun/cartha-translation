  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: zh_hans
  text: 一个兄弟要把另一个兄弟交出去送死，父亲也要把自己的孩子交出去送死；儿女要起来反对父母，并置他们于死地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδώσει
  choice: 交出去
  rationale: 表示把人交给敌对者或当权者处置；“交出去”保留具体的移交含义，又不把亲属间的背叛意味规定得过死。第二分句承前省略同一动词，译文予以补出。
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: 弟兄……弟兄
  rationale: 保留原文阳性、单数的代表性表达和重复形成的冲击力。
- source_word: εἰς θάνατον
  choice: 使他被处死
  rationale: 该短语表示移交所指向的结果或目的，即遭受死亡；这样表达在现代汉语中比直译“交到死”自然，也与后文“置……于死地”有所区别。
- source_word: πατὴρ τέκνον
  choice: 父亲……自己的孩子
  rationale: τέκνον不限于儿子，故译“孩子”；补出“自己的”以清楚表达亲属关系。
- source_word: ἐπαναστήσονται
  choice: 要起来反对
  rationale: 保留“起来”的形象性以及针对、敌对之意，不缩窄为政治性的“叛乱”。
- source_word: τέκνα
  choice: 儿女
  rationale: 该复数包括男女后代；“儿女”在此比“孩子们”更庄重，并与“父母”自然对应。
- source_word: ἐπὶ γονεῖς
  choice: 反对父母
  rationale: ἐπί接宾格在敌对语境中表示“针对、反对”；γονεῖς指父母。
- source_word: θανατώσουσιν
  choice: 置……于死地
  rationale: 表达蓄意使人死亡，并保留可能涉及正式处决的庄重语气，比一般的“杀死”更贴近原文。
- source_word: αὐτούς
  choice: 他们
  rationale: 代词最近的先行词是“父母”；保留代词可维持原文行文方式，所指也清楚。
theological_decisions:
- issue: 亲属称谓的性别范围与代表性单数
  choice: ἀδελφός译为“弟兄”，τέκνα与γονεῖς分别按其较广范围译为“儿女”和“父母”
  alternative: 将ἀδελφός泛化为“手足”
  rationale: 原文在ἀδελφός处使用阳性亲属称谓，而τέκνα和γονεῖς本身范围较广；分别处理可准确保留原文的性别与语义范围。
- issue: παραδίδωμι是否明译为“出卖”
  choice: 正文译“交出去”，脚注说明也可含“出卖”之意
  alternative: 正文直接译“出卖”
  rationale: 在亲属相害的语境中确有背叛色彩，但该动词首先描写把人交给他者处置；不在正文中限定为“出卖”，可保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“弟兄要把弟兄”有意保留希腊文的重复和代表性单数；用分号与句号呈现原文并列关系，同时避免中文长句含混。
