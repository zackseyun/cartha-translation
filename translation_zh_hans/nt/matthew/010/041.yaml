id: MAT.10.41
reference: Matthew 10:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: zh_hans
  text: 因对方是先知而接待他的[a]，必得到先知的赏赐；因对方是义人而接待他的[b]，必得到义人的赏赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把先知当作先知来接待”。希腊文此处的短语直译为“为着先知的名”。
    reason: 说明εἰς ὄνομα προφήτου的字面形式及可行译法，避免正文的意译掩盖原文表达。
  - marker: b
    text: 也可译作“把义人当作义人来接待”。希腊文此处的短语直译为“为着义人的名”。
    reason: 说明εἰς ὄνομα δικαίου的字面形式及其与前句的平行关系。
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: 因……而接待他的
  rationale: 带冠词的现在分词表示泛指，即凡以这种方式接待别人的人。中文用省略主语的条件式表达，既自然，也保留普遍适用的含义。
- source_word: προφήτην
  choice: 先知
  rationale: 这是该职分的标准中文译法，不作解释性改写。
- source_word: εἰς ὄνομα προφήτου
  choice: 因对方是先知
  rationale: 此短语按字面是“归入/为了先知之名”，在本句中表示基于对方作为先知的身份而接待他。正文采用现代中文可明白的表达，脚注保留“当作先知”和字面形式。
- source_word: μισθὸν προφήτου
  choice: 先知的赏赐
  rationale: 保留属格关系的简洁与歧义，既可理解为先知所得的赏赐，也可理解为与先知身份相称或相关的赏赐，不在正文中加以限定。
- source_word: λήμψεται
  choice: 必得到
  rationale: 准确表达将来时所含的确定应许；“得到”在现代中文中自然，“必”体现语气的确定性。
- source_word: δίκαιον
  choice: 义人
  rationale: 形容词在此作名词使用，指公义的人。“义人”是自然、庄重且沿用已久的标准中文表达，并可泛指这类人。
- source_word: εἰς ὄνομα δικαίου
  choice: 因对方是义人
  rationale: 与前半句平行，表示因认可对方的义人身份而接待他；脚注保留其他可行表达和希腊文的字面形式。
- source_word: μισθὸν δικαίου
  choice: 义人的赏赐
  rationale: 与“先知的赏赐”保持严格平行，并保留属格关系可能包含的不同理解。
theological_decisions:
- issue: εἰς ὄνομα加属格的含义
  choice: 正文译为“因对方是先知/义人”，脚注注明“当作……”及字面形式。
  alternative: 因着先知/义人的名；把他当作先知/义人来接待。
  rationale: 该结构强调接待是基于对方被认可的身份。若在现代中文正文中直译为“因着……的名”，容易被误解为奉其授权行事；采用清楚的意译，同时以脚注保存原文措辞和意义幅度。
- issue: “先知的赏赐”和“义人的赏赐”中属格的关系
  choice: 保留简洁的“先知的赏赐”“义人的赏赐”。
  alternative: 先知/义人所得的赏赐；接待先知/义人应得的赏赐。
  rationale: 原文没有明确限定这是先知本人所得的赏赐，还是接待者因认同先知或义人而得的相应赏赐。正文不把这种神学上的张力单向化。
- issue: δίκαιος的称谓
  choice: 义人
  alternative: 公义的人；正直的人。
  rationale: “义人”既涵盖行为与身份层面的公义，也符合马太福音的语域；不将其缩减为一般道德意义上的“好人”或“正直的人”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因对方是……”避免中文“奉……的名”所暗示的授权含义；两分句保持整齐平行。“赏赐”保留宗教语境中的庄重感，同时普通读者能够理解。
