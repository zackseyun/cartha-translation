  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: zh_hans
  text: 所以，凡在人面前承认我的，我也要在我在天上的父面前承认他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承认他”原文的介词结构直译可作“在他里面承认”，也可理解为“就他／关于他承认”；这里按汉语习惯译为“承认他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: 所以，凡……的
  rationale: 保留οὖν与上文的推论联系，并以现代汉语常用的“凡……的”表达包举性的泛指结构。
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: 承认我的
  rationale: ὁμολογέω在此指公开表明对耶稣的认同；介词短语ἐν ἐμοὶ按这一搭配译成自然的汉语宾语结构，同时不扩写为“宣告效忠”。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人面前
  rationale: ἀνθρώπων在此泛指人类或众人；“在人面前”既自然，也保留公开承认的场景。
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: 我也要……承认他
  rationale: 重复“承认”以体现前后对应；κἀγώ译作“我也”，ἐν αὐτῷ则按与前句平行的惯用表达处理为“他”。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 我天上的父
  rationale: 以简洁、自然且庄重的现代汉语表达马太常见的称谓；οὐρανοῖς虽为复数形式，汉语通常用单数概念“天上”。
theological_decisions:
- issue: 公开承认耶稣与耶稣相应的承认
  choice: 直接译为相互对应的“承认”，不进一步限定其发生的末世或现世场景
  alternative: 明确译成末日审判时的法庭式认可，或主要解释为现世门徒身份的确认
  rationale: 经文本身强调耶稣在父面前作出相应承认，却没有在本节内明确界定更完整的时间与教义框架，因此保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人”按上下文作泛指，避免把原文泛指的ἀνθρώπων误限于男性；前后均用“承认”，保留希腊文的修辞对应。
