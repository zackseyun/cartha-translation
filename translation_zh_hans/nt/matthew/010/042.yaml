source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: zh_hans
  text: 无论谁，因这些微小者[a]中的一个是门徒[b]，哪怕只给他一杯凉水喝，我实在告诉你们：这人绝不会失去自己的赏赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “微小者”在这里较可能指耶稣的跟随者中地位卑微或不受重视的人，不一定仅指儿童。
    reason: cross_reference
  - marker: b
    text: 较形式对应的译法是“因门徒之名”或“以门徒的名义”；原文短语表示这样做是基于对方的门徒身份。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: 无论谁
  rationale: 关系代词与ἄν构成泛指，表达向所有人开放的一般情形；“无论谁”自然保留这一语气。
- source_word: ποτίσῃ
  choice: 给他……喝
  rationale: 该动词本义为“给……喝”；中文以“给他一杯凉水喝”既准确又自然。
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: 这些微小者中的一个
  rationale: 保留“小、微不足道、地位卑微”的表达范围，不把所指限定为儿童，也不直接将其解释成某一特定类型的信徒。
- source_word: ποτήριον ψυχροῦ
  choice: 一杯凉水
  rationale: ψυχροῦ在这里省略了可由语境补出的“水”；“一杯凉水”符合现代汉语习惯，也体现礼物的普通与微小。
- source_word: μόνον
  choice: 哪怕只
  rationale: 突出所给之物即使仅是极小的帮助也包括在内，兼顾“只”和强调性的语用效果。
- source_word: εἰς ὄνομα μαθητοῦ
  choice: 因为……是门徒
  rationale: 该短语表明行动是基于受惠者的门徒身份；正文采用清楚自然的现代汉语，脚注保留较形式对应的译法。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 这是引出郑重、权威宣告的固定表达；“实在”传达ἀμήν的强调作用。
- source_word: οὐ μὴ ἀπολέσῃ
  choice: 绝不会失去
  rationale: οὐ μή构成强烈否定；“绝不会”准确传达其确定而有力的保证。
- source_word: τὸν μισθὸν αὐτοῦ
  choice: 自己的赏赐
  rationale: μισθός可指工价、报偿或赏赐；在此门徒语境中，“赏赐”最自然，同时“自己的”清楚回指施予者。
theological_decisions:
- issue: “微小者”的所指
  choice: 保留“这些微小者”的宽泛表达，不限定为儿童
  alternative: 儿童；初信或软弱的信徒；地位卑微的门徒
  rationale: 上下文涉及接待耶稣所差遣的门徒，因此较可能指耶稣跟随者中卑微或不受重视的人；但正文不把这一含义收窄为某一特定群体。
- issue: εἰς ὄνομα μαθητοῦ的含义
  choice: 正文译为“因为……是门徒”
  alternative: “以门徒的名义”；“因门徒之名”
  rationale: 此处重点是受惠者的门徒身份构成施予的缘由。正文采用现代汉语的自然表达，脚注列出较贴近原文形式的译法，以保留短语本身的张力。
- issue: 赏赐的性质与施予者身份
  choice: 只陈述施予者绝不会失去其赏赐
  alternative: 进一步界定赏赐为今世或末世报偿，或限定施予者必须属于某一群体
  rationale: 原文没有在本节中具体说明赏赐的时间、形式或施予者的群体身份，译文不作额外教义性补充。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“微小者”略带书面色彩，用以保留原文“小”与“卑微”的双重可能；以脚注避免读者误以为必然专指儿童。正文中的[a]与[b]分别对应相关词语，所有脚注标记均已出现。
