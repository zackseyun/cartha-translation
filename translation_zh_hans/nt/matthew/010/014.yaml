  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: zh_hans
  text: 无论谁不接待你们，也不听你们所说的话[a]，你们从那所房屋或那座城出来的时候，要把脚上的尘土抖掉[c]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不听取你们所说的话”。
    reason: lexical_alternative
  - marker: b
    text: “城”也可译作“城镇”。
    reason: lexical_alternative
  - marker: c
    text: 把脚上的尘土抖掉，是一种表示断绝关系并宣告审判的象征性举动，用来回应那些拒绝所传信息的人。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: 无论谁不
  rationale: 不定关系结构带有泛指意味；“无论谁不”自然地保留“任何这样的人”之意，并与后面的命令相衔接。句首 καί 按汉语篇章衔接自然省译。
- source_word: δέξηται ὑμᾶς
  choice: 接待你们
  rationale: δέχομαι 在这里兼有迎接、款待并接受使者的意味；“接待”既符合住宿语境，也不把含义缩窄为单纯友善欢迎。
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: 也不听你们的话
  rationale: ἀκούω 可指听见或听取；“听你们的话”保留 λόγους 的具体表达，又让语境中的认真聆听之意自然呈现，而不额外加入“顺从”。
- source_word: ἐξερχόμενοι ἔξω
  choice: 走出……的时候
  rationale: 分词与 ἔξω 强调从该处出去；此译既保留动作方向，也自然表达它与主命令同时发生。
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: 那一家或那一城
  rationale: 重复冠词及指示词指向特定的住家或聚落。“家”可能被误解为家庭成员，故用“一家”表达所住的房屋；πόλις 可涵盖城镇，中文圣经语体中的“城”不必然表示大型都市。
- source_word: ἐκτινάξατε
  choice: 跺掉
  rationale: 该动词指抖落、甩掉附着之物；与脚上尘土搭配时，“跺掉”在现代汉语中具体自然，并保留有意除去尘土的动作。
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: 脚上的尘土
  rationale: κονιορτός 特指尘土；属格结构在此表示尘土所在之处，译为“脚上的尘土”清楚自然。
theological_decisions:
- issue: 对拒绝门徒及其信息者所行的象征性行动
  choice: 正文保留具体命令“把脚上的尘土跺掉”，不直接解释其象征意义。
  alternative: 增译“作为反对他们的见证”，或意译为“表明他们将受审判”。
  rationale: 本节只陈述动作，并未明说其解释；不从平行经文补入字句，可保留原文的含蓄性及审判意味所形成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接待”兼顾款待和接受使者的含义；“那一家或那一城”保持地点选择的并列结构；正文不加入平行经文中的解释性措辞。
