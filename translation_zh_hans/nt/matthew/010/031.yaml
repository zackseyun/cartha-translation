  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: zh_hans
  text: 所以，不要害怕；你们比许多麻雀更宝贵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: 所以，不要害怕
  rationale: μὴ与现在时命令语气φοβεῖσθε构成禁止，οὖν承接上文关于天父看顾的论证；“所以”自然保留推论关系。
- source_word: πολλῶν στρουθίων
  choice: 许多麻雀
  rationale: στρουθίον在紧邻上文（太10:29）指麻雀；属格位于比较意义的διαφέρετε之后，表达比较对象。
- source_word: διαφέρετε
  choice: 更宝贵
  rationale: διαφέρω在此不是单指“不同”，而是指在价值或重要性上胜过；“更宝贵”在现代汉语中简洁自然，并保留比较含义。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 显明的代词带有强调，并与麻雀形成对照；“你们”也符合耶稣对门徒说话的复数语境。
theological_decisions:
- issue: 门徒与麻雀的相对价值
  choice: 你们比许多麻雀更宝贵
  alternative: 你们胜过许多麻雀
  rationale: 译文表达上帝对门徒更大的看顾，同时不否认上帝对麻雀的看顾；“更宝贵”保留διαφέρετε在语境中的价值比较。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”清楚连接上文；“不要害怕”符合自然劝诫语气；“更宝贵”比“更有价值”更适合经文语体，且不显商业化。
