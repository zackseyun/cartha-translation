  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: zh_hans
  text: “不要以为我来是要把和平带到世上[a]；我来不是要带来和平，而是剑[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我来”也可译为“我已经来了”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“剑”；结合上下文，这个意象指向分裂，并不是倡导暴力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: 不要以为
  rationale: μή加不定过去时虚拟语气在此构成禁止语；“不要以为”自然、直接，也准确保留了原文的语气。
- source_word: ἦλθον
  choice: 我来
  rationale: 不定过去时在此说明耶稣来到世上的使命或目的。汉语“我来”不必显式标注过去时，也可涵盖“我来了／我已经来”的语义。
- source_word: βαλεῖν
  choice: 带到／带来
  rationale: βάλλω本义为“投、掷”，但与“和平”和“刀剑”搭配时，按汉语习惯译为“带到／带来”更清楚；前句因有“地上”用“带到”，后句用“带来”，表达同一动作而保持自然。
- source_word: εἰρήνην
  choice: 和平
  rationale: “和平”是εἰρήνη在此处直接、标准且符合现代汉语的译法。
- source_word: ἐπὶ τὴν γῆν
  choice: 到地上
  rationale: 这里指范围延及大地或世上；“到地上”与“带到”搭配自然，并保留γῆ的广泛意义，不收窄为某一片“土地”。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 在“不是……而是……”结构中，“而是”清楚表达强烈对比，符合现代汉语习惯。
- source_word: μάχαιραν
  choice: 刀剑
  rationale: μάχαιρα可指剑、短剑或较大的刀。“刀剑”既保留具体武器意象，也避免把器物类型限定得超过原词本身；不在正文中释为“分裂”。
theological_decisions:
- issue: 是否在正文中把“刀剑”弱化或解释为“分裂”
  choice: 保留具体意象“刀剑”
  alternative: 分裂
  rationale: 原文明确使用μάχαιραν。上下文显示其结果涉及人与人之间的分裂，但译文应保留原有意象及张力，不把解释直接代入正文。脚注说明此处并非倡导暴力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要以为”保持直接告诫的语气；“不是……而是……”再现原文鲜明的对照。正文保留“刀剑”的具体意象，脚注仅帮助读者理解其语境作用。
