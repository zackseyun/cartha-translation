id: MAT.10.25
reference: Matthew 10:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: zh_hans
  text: 门徒变得像自己的老师，奴隶像自己的主人，也就够了。如果人们把一家之主叫作别西卜[a]，更何况他家里的人呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作 Beelzebul；Beelzebub 是传统上常见的另一名称形式。
    reason: 说明正文所用通行中文音译与希腊文名称形式及传统形式之间的关系。
lexical_decisions:
- source_word: ἀρκετὸν
  choice: 也就够了
  rationale: 以现代汉语自然表达“足够、足矣”的判断，并与后面的门徒—老师、奴隶—主人两组关系相连。
- source_word: μαθητῇ
  choice: 门徒
  rationale: 保留《马太福音》中跟随、受教和效法老师的关系含义，比单纯的“学生”更贴合语境。
- source_word: ἵνα γένηται
  choice: 能变得
  rationale: 保留 γίνομαι 所含的“成为、变得”之意；这里的 ἵνα 从句接在“够了”之后，译成“能变得”符合现代汉语表达。
- source_word: διδάσκαλος
  choice: 老师
  rationale: 在 μαθητής—διδάσκαλος 的对应关系中译作“老师”，清楚自然，也与后面的 κύριος“主人”相区别。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 本句强调与主人相对的从属身份；“奴隶”比“仆人”更准确地保留古代社会关系的力度。
- source_word: κύριος
  choice: 主人
  rationale: 这里与“奴隶”构成社会身份上的对应，并非直接作为神学称号使用，因此译作“主人”。
- source_word: οἰκοδεσπότην
  choice: 一家之主
  rationale: 该复合词指掌管家庭的人；“一家之主”既保留权柄含义，也自然衔接下文“他的家人”。
- source_word: Βεελζεβοὺλ
  choice: 别西卜
  rationale: 采用现代中文圣经读者较熟悉的音译；脚注说明原文名称形式，以免掩盖 Beelzebul 与传统 Beelzebub 形式的差别。
- source_word: ἐπεκάλεσαν
  choice: 叫作
  rationale: 此处表示给某人冠以某个称呼，“叫作”直接而自然，并能体现带有贬斥意味的命名行为。
- source_word: πόσῳ μᾶλλον
  choice: 更何况
  rationale: 准确表达从一家之主推及家人的加强式论证，也保留原句末尾省略谓语的修辞力度。
- source_word: οἰκιακοὺς
  choice: 家人
  rationale: 指属于该家庭的成员，范围不限于奴隶；“家人”简明地保留这一广泛含义。
theological_decisions:
- issue: κύριος 在家庭类比中的译法
  choice: 主人
  alternative: 主
  rationale: 上下文以 δοῦλος 与 κύριος 对举，并紧接“一家之主”和“家人”的家庭意象；译作“主人”可避免在此处预先强化经文本身未明说的称号性或基督论含义。
- issue: δοῦλος 的社会身份力度
  choice: 奴隶
  alternative: 仆人
  rationale: 本节以地位不对等的奴隶—主人关系说明门徒将遭遇老师所遭遇的事；“奴隶”较完整地呈现这种受支配的身份。
- issue: 末句省略的处理
  choice: 保留为“更何况他的家人呢？”
  alternative: 补足为“他的家人岂不更会被这样叫吗？”
  rationale: 希腊文末句省略了“被叫作”之类的谓语。中文保留省略仍然清楚，并能维持原文简洁有力的递进与开放张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“门徒—老师”和“奴隶—主人”两组对应清楚分开；末句保留原文的省略式反问。脚注标记置于“别西卜”之后，与注释对象直接对应。
