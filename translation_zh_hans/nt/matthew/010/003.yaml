lexical_decisions:
- source_word: Φίλιππος
  choice: 腓力
  rationale: 采用现代中文圣经中易于辨识的传统人名译法。
- source_word: Βαρθολομαῖος
  choice: 巴多罗买
  rationale: 采用现代中文圣经中通行且可辨识的人名音译。
- source_word: Θωμᾶς
  choice: 多马
  rationale: 采用通行的中文人名音译。
- source_word: Μαθθαῖος
  choice: 马太
  rationale: 采用通行的中文人名音译。
- source_word: ὁ τελώνης
  choice: 税吏
  rationale: τελώνης指征收税款或关税的人；“税吏”简洁、自然，也保留新约时代这一身份称谓的历史色彩。
- source_word: Ἰάκωβος
  choice: 雅各
  rationale: 采用中文新约传统中对Ἰάκωβος的通行译名，便于辨识使徒名单中的人物。
- source_word: ὁ τοῦ Ἁλφαίου
  choice: 亚勒腓的儿子
  rationale: 原文属格结构以父名识别雅各；中文明确补出“儿子”，表达自然清楚。
- source_word: Ἁλφαίου
  choice: 亚勒腓
  rationale: 采用通行的中文人名音译。
- source_word: Θαδδαῖος
  choice: 达太
  rationale: 正文依SBLGNT所载Θαδδαῖος翻译；其他抄本异文及平行名单的称呼置于脚注。
- source_word: καὶ
  choice: 和
  rationale: 以“和”保留原文名单中简明的并列结构。
theological_decisions:
- issue: 名单最后一位使徒的身份与名称
  choice: 达太
  alternative: 利拜乌（或“称为达太的利拜乌”）；雅各的儿子犹大
  rationale: 所提供的希腊正文读作Θαδδαῖος，因此正文译为“达太”；不将抄本异文或路加平行名单中的称呼并入正文，而在脚注中保留文本与名单之间的差异。
translation_notes:
