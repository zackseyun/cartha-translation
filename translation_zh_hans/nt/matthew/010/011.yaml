  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: zh_hans
  text: 你们无论进哪一座城或哪一个村庄，都要查问那里谁是适合接待你们的人[a]，就住在他那里，直到你们离开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “适合接待你们的人”也可译作“配得的人”或“合适的人”；这里指适合作为接待这些使者之人的人。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“离开”，没有明确说明是离开所住的房屋，还是离开那座城或那个村庄。
    reason: ambiguity
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: 你们无论进哪一座城或哪一个村庄
  rationale: 用“无论……哪……”表达带ἄν的不定关系从句；“进”自然传达εἰς与εἰσέλθητε的方向性，并保留城与村庄的区别。
- source_word: ἐξετάσατε
  choice: 查问
  rationale: 该命令含认真询问、查明之意；“查问”比单纯“问”更能体现审慎探询，又比“调查”更适合寻找接待者的语境。
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: 那里谁配得接待你们
  rationale: “那里谁”明确指城或村庄中的人；“配得”保留ἄξιος的评价意味，而补出语境隐含的“接待你们”，使现代读者不致误解为赚取上帝恩惠。
- source_word: κἀκεῖ μείνατε
  choice: 就住在他那里
  rationale: κἀκεῖ承接所找到的合适之人及其住所；“就住在他那里”用自然汉语表达持续留宿之意。
- source_word: ἕως ἂν ἐξέλθητε
  choice: 直到你们离开
  rationale: 自然表达未来离开该城或村庄之前一直住在同一处的时间界限；所离开的具体对象在原文中未明说，正文不强行限定。
theological_decisions:
- issue: “配得”（ἄξιος）在差派语境中的含义
  choice: 正文译作“配得接待你们”，指适合或愿意接待使者的人
  alternative: 译作“配得的人”，保留更宽泛的道德评价含义
  rationale: 上下文关乎使徒寻找接待和住宿之处；补出“接待你们”说明语境所指，同时保留“配得”的评价张力，不将其解释为赚取救恩或上帝的恩宠。
- issue: “离开”所指的范围
  choice: 正文仅译“直到你们离开”
  alternative: 明确译作“直到你们离开那地方”或“离开那城”
  rationale: 希腊文ἐξέλθητε没有明说从房屋还是聚落出去，因此不在正文中消除这种指代上的含混，并以脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“查问”体现审慎探询，“住在他那里”符合接待与留宿的语境。所有脚注标记均已置于正文中。
