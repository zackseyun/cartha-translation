id: MAT.10.36
reference: Matthew 10:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: zh_hans
  text: 人的仇敌，就是自己家里的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个人的仇敌，就是他家中的成员。”希腊文“人”采用阳性单数形式，在这里代表一般的人。
    reason: 说明代表性阳性单数，并提供较形式对应的表达。
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不另译）
  rationale: 此处 καί 承接前文并引出并列的下一句。现代汉语分句独立成节时不必机械译作“并且”；省译连接词可自然保留上下文的连续性，而不增加因果等解释。
- source_word: ἐχθροὶ
  choice: 仇敌
  rationale: 该词在此作名词用，指与人敌对者。“仇敌”准确传达强烈的敌对关系，也符合庄重而通俗的经文语体。
- source_word: τοῦ ἀνθρώπου
  choice: 人的
  rationale: 属格表示所属关系。ἄνθρωπος 在这句格言中以阳性单数代表一般的人；汉语“人”自然涵盖任何人，并未抹去原文的代表性单数用法。
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: 自己家里的人
  rationale: οἰκιακοί 指属于某人家户的成员，而不是房屋本身。“自己家里的人”保留 αὐτοῦ 所带的归属和强调，并以现代汉语自然表达 household members；其范围不被限缩为现代核心家庭。
theological_decisions:
- issue: ἄνθρωπος 的阳性单数代表性用法
  choice: 人的
  alternative: 一个男人的
  rationale: 原文阳性单数在此泛指一般的人，而非特指成年男性。现代汉语“人”既准确表达该词的语义，又保留格言式的单数代表意义；译成“一个男人”反而可能错误限定性别。
- issue: οἰκιακοί 的关系范围
  choice: 自己家里的人
  alternative: 自己的家人
  rationale: “家里的人”可以涵盖原文所指家户中的成员，避免把古代 household 的范围无依据地缩小为血缘亲属或现代核心家庭。
translation_notes:
  register: 采用简洁、格言式的现代标准汉语。“就是”呈现原文名词句中主语与表语的对应和强调；“自己家里的人”通俗而庄重，并保留家户成员这一较宽范围。脚注标记已在正文中对应出现。
