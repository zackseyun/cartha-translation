  rationale: 修订补出“人”，并以“背起自己的十字架来跟从我”将两个协调的门徒行动置于同一否定范围内，避免原译产生“未背十字架却跟在我后面”的反向读法。正文用自然的“跟从我”，脚注说明ὀπίσω的附加语义；未增添“作门徒”或“属于我”等原文未明说的关系定义。
