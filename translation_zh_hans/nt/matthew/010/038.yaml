  source_fidelity: 草稿的“背起自己的十字架”准确保留λαμβάνει与σταυρόν的具体意象，“自己的”也恰当地表达泛指结构中αὐτοῦ逐人回指的意义。“配不上我”可自然对应οὐκ ἔστιν μου ἄξιος。可是正文“凡不背起……、跟在我后面的”在汉语句法上会读成“没有背起十字架、却跟在我后面的人”，使否定只修饰第一项；而希腊文的否定应涵盖“背起十字架并跟从我”这个门徒行动。
  naturalness: 原句缺少中心词“人”，且“凡……的，就……”在此显得不完整。改为“凡不背起自己的十字架来跟从我的人，都配不上我”是庄重、通顺的现代标准汉语，并使否定范围清楚。
  terminology: “十字架”“背起”“跟从”“配不上我”均适合本段庄重的门徒训诲语域。为使正文自然，采用“跟从我”；脚注保留原文ὀπίσω所包含的“在我后面”这一较明确的空间／随从语义。
