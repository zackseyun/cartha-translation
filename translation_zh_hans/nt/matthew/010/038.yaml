  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: zh_hans
  text: 凡不背起自己的十字架来跟从我的人，都配不上我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的十字架”是逐人而言：每个跟从者都必须背起自己的十字架。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“跟在我后面”。希腊文更明确地说“跟从在我后面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 凡……的
  rationale: 以现代汉语的周遍性结构表达不定、泛指的关系代词，涵盖每一个符合所述情形的人。
- source_word: λαμβάνει
  choice: 背起
  rationale: 十字架是需要背负的刑具；“背起”既符合具体意象，也自然表达主动承担，较单纯的“拿起”更贴合本处语境。
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: 自己的十字架
  rationale: 保留“十字架”的具体历史与神学意象；“自己的”自然传达希腊文阳性单数代词在泛指结构中的逐人指向，而不把意义抽象化为一般的苦难或舍己。
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: 跟在我后面
  rationale: 明确保留ὀπίσω“在……后面”的空间及门徒身份意涵，比仅译“跟从我”更完整。
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: 就配不上我
  rationale: 直接保留ἄξιος与属格μου构成的个人性评价，不擅自补成“作我的门徒”或“属于我”；现代汉语虽凝练，仍可自然表达“不够资格与我相称”的严肃含义。
theological_decisions:
- issue: 背十字架的门徒教导
  choice: 保留“背起自己的十字架”这一具体意象
  alternative: 解释性地译为“甘愿受苦”“接受羞辱”或“舍己”
  rationale: 原文刻意使用罗马刑具的鲜明形象，包含受苦、羞辱、赴死和忠诚等张力；抽象改写会缩窄其历史和神学内涵。
- issue: μου ἄξιος所表达的关系
  choice: 译为“配不上我”
  alternative: 译为“不配作我的门徒”或“不配属于我”
  rationale: 原文只说“配得上我／与我相称”，没有明说“门徒”或“属于”；正文保留这种凝练和开放性，避免把关系性质解释得过满。
- issue: αὐτοῦ的泛指阳性单数
  choice: 译为“自己的”
  alternative: 译为“他的”
  rationale: 汉语“自己的”在“凡……的”结构中自然地逐一回指每个人，既保留单数个体承担的意义，也避免现代汉语中“他的”可能造成的指代歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“背起十字架”保留强烈具体意象；“跟在我后面”略带具象色彩，以对应原文ὀπίσω；“配不上我”保持原句简洁、直接的个人性判断。
