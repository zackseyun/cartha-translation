  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: zh_hans
  text: 爱父亲或母亲胜过爱我的，不配与我相称[a]；爱儿子或女儿胜过爱我的，也不配与我相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“不配我。”也可译为“不配得我”。此处表达此人与耶稣不相称，未明说具体的身份或结果。
    reason: 保留ἄξιος与属格μου的简练结构及其语义开放性，避免将其限定为“归属于我”或“作我的门徒”。
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: 爱……的
  rationale: 定冠词加现在分词构成实体化表达，泛指以这种爱为特征的人；汉语用“爱……的”自然保留这一泛指作用。
- source_word: πατέρα ἢ μητέρα
  choice: 父亲或母亲
  rationale: 原文关系名词前无冠词，也没有明说物主代词；直译为“父亲或母亲”自然且不过度增译。
- source_word: ὑπὲρ ἐμέ
  choice: 胜过爱我
  rationale: ὑπέρ在这一比较结构中表示爱的程度或优先次序超过耶稣。补出第二个“爱”符合汉语句法，并清楚表达比较对象，而不削弱原文要求。
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: 不配作属我的人
  rationale: ἄξιος与属格μου连用，直译“不配我”在现代汉语中不完整；此译保留“不配”的严肃判断，并以“属我的人”表达与耶稣相称、配得归于他的关系。脚注同时保留更形式对应的译法。
- source_word: καὶ
  choice: 也
  rationale: 两句为严格平行结构；现代汉语在第二句用“也”比“并且”更自然，并清楚标明同样的判断。
- source_word: υἱὸν ἢ θυγατέρα
  choice: 儿子或女儿
  rationale: 直接对应原文关系名词，不加入原文未明说的物主代词。
theological_decisions:
- issue: 耶稣的要求与家庭之爱的关系
  choice: 译作必须爱耶稣胜过最亲近的家人，强调对耶稣的最高忠诚。
  alternative: 弱化为“爱我不如爱家人”，或强化为必须憎恨家人。
  rationale: 原文以ὑπὲρ ἐμέ表达比较性的优先次序，并以“不配”作出严肃判断；既没有否定家庭之爱本身，也不应把这里改写成憎恨家人。
- issue: μου与ἄξιος所表达的关系
  choice: 正文采用“不配作属我的人”，脚注给出“不配得我”这一较形式对应的译法。
  alternative: 只译“不配得我”或解释为“不配作我的门徒”。
  rationale: “不配得我”较贴近词形，却容易被现代读者理解为取得某种奖赏；“作属我的人”使关系含义清楚，同时避免把“门徒”直接加入正文。脚注保留原文表达的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句维持原文平行结构；“胜过爱我”明确比较关系，“不配”保留话语的尖锐力度。
