  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: zh_hans
  text: 我在黑暗中告诉你们的，你们要在光明中说出来；你们在耳边所听见的[a]，要在房顶上[b]宣告出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在耳边所听见的”指私下听到的话。
    reason: idiom_clarification
  - marker: b
    text: 古代房屋多有平顶，房顶是显眼、适合向公众传告的地方。
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: 我……告诉你们的
  rationale: 以自然的现代汉语表达关系从句，同时保留耶稣亲自向门徒传达信息的语气。
- source_word: ἐν τῇ σκοτίᾳ
  choice: 在黑暗中
  rationale: 保留原文与“在光明中”相对的鲜明意象，不直接释为“暗中”或“私下”。
- source_word: εἴπατε
  choice: 要……说出来
  rationale: 以“要”表达命令语气，“说出来”在汉语中自然地体现将所领受的信息公开表达。
- source_word: ἐν τῷ φωτί
  choice: 在光明中
  rationale: 保留原文的光暗对照及其公开显明的含义。
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: 你们耳中所听见的
  rationale: 贴近希腊文单数“耳”的形象，又避免译成“耳语”而增添原文未明说的动作。
- source_word: κηρύξατε
  choice: 要……宣告出来
  rationale: 体现公开传扬、如传令者发布信息的力度，又不把含义局限为正式讲道。
- source_word: ἐπὶ τῶν δωμάτων
  choice: 在房顶上
  rationale: 保留古代平顶房屋上公开传告的文化图景；“房顶”比“屋顶”稍能呼应房屋这一具体背景。
theological_decisions:
- issue: 黑暗／光明与耳中／房顶的语言应保留意象，还是直接解释为私下／公开
  choice: 正文保留“在黑暗中……在光明中……耳中……在房顶上”的意象
  alternative: 译为“私下……公开……悄悄听见……向众人宣布”
  rationale: 原文借对照鲜明的空间意象表达从私下领受转向公开传扬。保留意象可避免抹平耶稣话语的修辞张力，同时以脚注说明其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“黑暗／光明”和“耳中／房顶”的平行对照；两个“出来”使公开表达的方向在汉语中更自然。所有脚注标记均置于正文相应位置。
