  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: zh_hans
  text: 接待你们的，就是接待我[a]；接待我的，就是接待那位差我来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢迎”或“接受”。这里的希腊语动词可指接待、接受或欢迎，尤其可用于接待使者。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: 接待……的
  rationale: 带冠词的现在时分词作名词性用法，表达泛指的人；汉语用“接待……的”自然简洁，也保留持续、一般性的陈述。
- source_word: δέχομαι / δέχεται
  choice: 接待
  rationale: 原文三次重复同一动词，形成使者、耶稣与差遣者之间逐层相连的关系。“接待”既可指迎接款待，也可包含接受来者及其使命的含义，并能自然保留重复。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确呈现第二人称复数，所指为耶稣面前的门徒。
- source_word: ἐμέ
  choice: 我
  rationale: 第一人称单数宾语，指耶稣；按现代汉语直接译作“我”。
- source_word: τὸν ἀποστείλαντά με
  choice: 那差我来的
  rationale: 带冠词的主动分词指一位具体的差遣者。“那差我来的”符合汉语圣经语体，也不在正文中增添原文未明说的“父”。
theological_decisions:
- issue: 差遣耶稣者的身份
  choice: 译作“那差我来的”，不在正文中补出“父”
  alternative: “差我来的父”
  rationale: 马太福音的语境与神学脉络表明差遣者是父，但本节希腊文只说“那差我来的”。保留原文表达，可让其神学指向自然呈现而不作显化增译。
- issue: 接待门徒与接待耶稣及差遣者的关系
  choice: 以三次“接待”保留原文的递进认同链条
  alternative: 分别译为“接待你们、接受我、接受差我来的那一位”
  rationale: 原文刻意重复 δέχεται；统一译法更清楚地传达接待受差者即接待差遣他的耶稣，并进而接待耶稣之差遣者这一关系，同时不将这种关系解释为身份等同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接待”在当代汉语中自然，并适合使者受迎接与被接受的语境；用“就是”清楚呈现两层关系。所有代词按原文人称和数表达。
