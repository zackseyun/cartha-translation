  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: zh_hans
  text: 那家若配得这平安，愿你们的平安临到那家；若不配得，愿这平安回到你们这里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 也可译作“转回到你们那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: 那一家
  rationale: οἰκία可指房屋，也可引申为住在其中的一家人。此处谈接待使者，并以其是否“配得”为条件，译作“那一家”比单指建筑物的“房子”更自然，同时保留家庭与住所相连的含义。
- source_word: ἀξία
  choice: 配得
  rationale: 保留ἄξιος的评价意味，不将其缩窄为单纯“愿意接待”或解释为道德上毫无过失；脚注说明其语境含义。
- source_word: εἰρήνη ὑμῶν
  choice: 你们所祝的平安／你们的平安
  rationale: εἰρήνη直译为“平安”，在犹太问安和差遣语境中兼有祝福与福祉之意。首处补出“所祝的”帮助现代读者理解，却不把平安削弱为一句空泛问候；次处保留简洁的“你们的平安”。
- source_word: ἐλθάτω ... ἐπ’ αὐτήν
  choice: 愿……临到他们
  rationale: 第三人称命令式在汉语中以“愿……临到”自然表达；“临到”保留平安来到并停留于接待者身上的形象。因οἰκία在此按一家人理解，代词相应译为“他们”。
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: 愿……回到你们这里
  rationale: ἐπιστραφήτω表达返回、转回，πρός指向“你们”；此译既保留方向性，也符合现代汉语。
- source_word: μὲν ... δὲ
  choice: 如果……；如果……
  rationale: 以平行条件句自然呈现希腊文的对照结构；后句无需另加“但是”，分号和重复的“如果”已清楚表达转折。
theological_decisions:
- issue: “你们的平安”的性质
  choice: 译为“你们所祝的平安／你们的平安”，保留这是门徒所宣告、能够临到或返回的平安这一具体意象。
  alternative: 译为“你们的问安”或“你们所说的祝福”。
  rationale: 原文没有解释这种平安只是礼貌问候，还是以某种方式实际赐下的祝福；译文不把它简化为社交用语，也不建立机械化的传递教义。
- issue: “配得”的标准
  choice: 正文保留“配得”，脚注按差遣与接待语境说明。
  alternative: 直接译为“愿意接待你们”或“值得”。
  rationale: “愿意接待”过度限定原词，“值得”在现代汉语中容易被理解为一般性的价值判断；“配得”保留经文的评价张力，脚注则防止读成道德上无罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……临到／回到……”自然承载希腊文第三人称命令式的祝愿和命令色彩；避免生硬的“让平安来到它上面”。脚注标记均置于相关词句之后。
