  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: zh_hans
  text: 但连你们头上的每一根头发都已经被数过了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都已经被数清了。”希腊语的完成时被动结构可强调计数已经完成，其结果持续有效。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: 你们的
  rationale: 第二人称复数属格表示领属；简体中文自然译为“你们的”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并带有轻微转折，译作“但”可保留话语推进中的对照。
- source_word: καὶ
  choice: 就连……也
  rationale: 此处具有强调作用；“就连……也”自然地突出连头发这样细微的事物也包括在内。
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: 你们的头发
  rationale: 按现代汉语习惯合并表达领属关系，比直译作“你们头上的毛发”自然且庄重。
- source_word: πᾶσαι
  choice: 全都
  rationale: 保留对每一根头发无一遗漏的总体强调。
- source_word: ἠριθμημέναι εἰσίν
  choice: 数过了
  rationale: 迂回完成时被动结构表示计数已经完成且结果持续有效；“数过了”在现代汉语中能较自然地呈现完成意义，施事者仍由上下文表明。
theological_decisions:
- issue: 经文所暗示的神圣知识与眷顾范围
  choice: 直译头发全都已经被数过这一具体意象，不增添“神知道”或“神掌管”等解释性措辞。
  alternative: 明确译成“神连你们的每一根头发都知道”或加入护理、掌管的表述。
  rationale: 原文以被动结构陈述头发已被数过；神是隐含的施事者，但译文不应把上下文中的神学含义扩写成正文。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“就连……也”传达 καὶ 的强调作用；“数过了”保留完成状态，同时脚注说明被动形式及持续结果。
