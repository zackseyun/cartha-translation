  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: zh_hans
  text: 得着自己的生命的人，必失去自己的生命[a]；为了我失去自己的生命的人，必得着自己的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”也可译作“灵魂”；两处希腊词都是ψυχή，在这里主要指人在跟从耶稣时所保全或舍弃的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: 得着……的
  rationale: 定冠词加不定过去时分词在此作名词用，泛指一类人。中文用“……的”自然地保留代表性单数和格言式表达；“得着”也便于与后文同词根的“必得着”形成对应。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己生命
  rationale: ψυχή在本段作门徒的代价与舍命语境中主要指人的生命，而非专指与身体相对的非物质“灵魂”。用“自己”自然表达回指关系，避免生硬或带有不必要性别限定的“他的”。
- source_word: ἀπολέσει αὐτήν
  choice: 必失去生命
  rationale: ἀπόλλυμι在此表示丧失、失去，不必解释为毁灭。“必”表达将来陈述的确定性；中文重复“生命”比用代词更清楚，也保持两小句的节奏。
- source_word: ὁ ἀπολέσας
  choice: 失去……的
  rationale: 不定过去时分词与将来时主句构成格言式条件关系；中文用“失去……的”表达一般性情形，不强行加入完成体含义。
- source_word: ἕνεκεν ἐμοῦ
  choice: 为我
  rationale: ἕνεκεν加属格表示原因或缘故。“为我”简洁自然，保留因忠于耶稣而承受损失的个人指向，又不额外解释其具体方式。
- source_word: εὑρήσει αὐτήν
  choice: 必得着生命
  rationale: 沿用前半句εὑρίσκω的“得着”，保留刻意的首尾对应和悖论结构；不译作“赢得”，以免加入功绩意味。
theological_decisions:
- issue: 门徒悖论中ψυχή的译法
  choice: 生命
  alternative: 灵魂
  rationale: 上下文谈到因忠于耶稣而保全或舍弃生命，“生命”最贴合此处语义，也保留自保反而失去、为耶稣舍弃反而得着的张力。“灵魂”属于ψυχή可能的词义，故列入脚注，但不应在正文中把本节收窄为身体与灵魂的区分。
- issue: “得着生命”是否解释为永生或得救
  choice: 保留“得着生命”的原有表达
  alternative: 译作“必得永生”或“必得救”
  rationale: 原文只重复ψυχή与εὑρίσκω，并未明确使用“永生”或“得救”等词。正文保留含蓄性，让末世性和门徒论意义存在而不被译文过度界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“得着—失去—失去—得着”保持原文的逆转和对称；不用较口语的“找到”，因为此处不是偶然发现，而是保全或最终获得生命。脚注标记[a]已置于正文首次完整陈述“失去生命”之后，并说明同一词也出现在其余相关位置。
