  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: zh_hans
  text: 倒要到以色列家迷失的羊那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: 去
  rationale: 现在时中间/被动形式的命令语气，第二人称复数；在差遣语境中用“去”最自然，也准确表达命令。
- source_word: δὲ μᾶλλον
  choice: 倒要
  rationale: 两词结合，在上文禁止前往外族人和撒玛利亚人的背景下表达对比与转向；“倒要”简洁自然地体现“反而、却要”的语气。
- source_word: πρὸς
  choice: 到……那里
  rationale: 与移动动词连用，表示前往的方向或对象；中文以“到……那里去”表达自然。
- source_word: τὰ πρόβατα
  choice: 羊
  rationale: 保留原文明确的牧羊隐喻及其经文互文色彩，不改写为“人”或“百姓”。
- source_word: τὰ ἀπολωλότα
  choice: 迷失的
  rationale: ἀπόλλυμι的完成时主动分词作定语；在牧羊隐喻中指已经迷失、处于失丧状态，用“迷失的”既保留状态含义，也避免误解为已经灭亡。
- source_word: οἴκου Ἰσραήλ
  choice: 以色列家
  rationale: 保留圣经中具有群体和盟约意涵的固定表达，比意译为“以色列人”更贴近原文。
theological_decisions:
- issue: 对以色列的牧羊隐喻
  choice: 保留“以色列家迷失的羊”
  alternative: 以色列家那些迷失的人
  rationale: 原文明确使用“羊”的隐喻，并承载希伯来圣经先知传统的互文意义；保留该意象，不将其解释性地改写为“人”。
- issue: οἴκου Ἰσραήλ与“迷失的羊”的句法关系
  choice: 正文采用“以色列家迷失的羊”，自然理解为属于以色列家的迷失之羊
  alternative: 从以色列家迷失的羊
  rationale: 希腊语属格οἴκου Ἰσραήλ可修饰“羊”，通常表示这些羊属于以色列家；但也可能被理解为羊从以色列家中迷失，故以脚注保留这一句法可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒要”承接上文形成鲜明转折；“以色列家”保留圣经语体和群体意涵；“到……那里去”使中文命令句自然流畅。
