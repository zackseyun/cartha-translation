  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: zh_hans
  text: 耶稣把他的十二个门徒召到自己跟前，赐给他们权柄，可以赶出污灵，并医治各样的疾病和病症。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疾病和病症”对应两个意义相近的希腊词（nosos和malakia）；后一个词也可译为“软弱”或“病弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 召到跟前
  rationale: 该词是不定过去时中间语态分词，表示召唤人到自己这里来；“召到跟前”自然保留了这一方向含义。
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: 他的十二个门徒
  rationale: μαθητής在福音书语境中通常译为“门徒”；αὐτοῦ自然译为“他的”。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: δίδωμι基本义为“给”；这里施予者是耶稣，中文用“赐给”庄重自然，但不额外扩展原文含义。
- source_word: ἐξουσίαν πνευμάτων ἀκαθάρτων
  choice: 制伏污灵的权柄
  rationale: ἐξουσία侧重获授的权柄或行事资格；属格πνευμάτων ἀκαθάρτων表示权柄所针对的对象。“制伏……的权柄”在中文中清楚表达对污灵的支配权。
- source_word: ὥστε ἐκβάλλειν αὐτά
  choice: 可以把污灵赶出去
  rationale: ὥστε加不定式可带目的或结果色彩；“可以”承接所赐权柄，既自然又不把语义严格限定为纯目的或纯结果。明确重复“污灵”可避免中文代词指代含混。
- source_word: θεραπεύειν
  choice: 医治
  rationale: 在此指治愈患病者，“医治”符合现代中文圣经语体，也准确表达该动词。
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: 各样的疾病和病症
  rationale: 保留νόσος与μαλακία两个相关而不完全相同的词，不合并为单一概念；“疾病和病症”自然可懂，并维持原文的全面性表达。
theological_decisions:
- issue: 门徒所得的是权柄还是能力
  choice: 权柄
  alternative: 能力
  rationale: ἐξουσία通常指被授予的权柄或行事资格。译作“权柄”凸显这是耶稣所赐，同时不否认施行这一权柄所涉及的能力。
- issue: ὥστε所表达的目的或结果关系
  choice: 可以把污灵赶出去，并医治……
  alternative: 为要把污灵赶出去，并医治……
  rationale: 原结构可能兼具目的和预期结果意味；“可以”把后续行动呈现为所得权柄的实际范围，避免过度锁定其中一种语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“污灵”简洁保留礼仪与道德层面的“不洁”概念；“召到跟前”和“赶出去”则使用自然的现代汉语表达。
