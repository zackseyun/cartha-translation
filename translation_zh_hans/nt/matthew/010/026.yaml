  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: zh_hans
  text: 所以，不要怕他们；因为没有什么被遮盖的事终不会被揭露，也没有什么隐藏的事终不会被人知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: 所以，不要怕他们
  rationale: “所以”承接上文，忠实表达οὖν；“不要怕他们”自然、直接地传达否定命令及复数对象。
- source_word: κεκαλυμμένον
  choice: 被遮盖的事
  rationale: 保留完成时被动分词所表达的受遮盖状态，并与后面的“被揭露”形成鲜明对应。
- source_word: ἀποκαλυφθήσεται
  choice: 不被揭露
  rationale: 以将来被动表达终将显明之意；“揭露”保留揭开遮盖的意象。
- source_word: κρυπτὸν
  choice: 隐藏的事
  rationale: 用名词化表达对应中性形容词的实体化用法，不限定具体所指。
- source_word: γνωσθήσεται
  choice: 不被人知道
  rationale: 以自然汉语表达将来被动“将被知道”；补出泛指施事“人”，不指定具体知晓者。
theological_decisions:
- issue: 普遍陈述的范围
  choice: 保留“没有什么……不……”的绝对式表述
  alternative: 改成“真相终会大白”等概括性意译
  rationale: 原文以两个平行的普遍否定句强调遮盖与隐藏之事终将显明，不宜缩窄其范围或替原文解释具体所指。
- issue: ἀποκαλυφθήσεται与γνωσθήσεται的被动施事
  choice: 前者保留无施事被动，后者用泛指“人”使汉语通顺
  alternative: 明确译成“被上帝揭露／让众人知道”
  rationale: 原文未明说施事者；不应加入上帝、门徒或公众等特定主体。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。两个平行分句分别使用“被遮盖／被揭露”和“隐藏／被人知道”，保留原文结构、意象及末世性或一般性显明之间的张力。
