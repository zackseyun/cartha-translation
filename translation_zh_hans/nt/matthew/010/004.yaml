  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: zh_hans
  text: 奋锐党的西门[a]，以及加略人犹大，就是也曾出卖耶稣的那个人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“迦拿奈人”，是源自亚兰语或希伯来语的称号，通常理解为“热心者”，传统上译作“奋锐党人”。
    reason: lexical_alternative
  - marker: b
    text: “出卖”也可译作“把他交出去”。原文动词本身含义较宽，但在犹大的叙事中具有背叛的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: 奋锐党的
  rationale: 这里的希腊语形式音译自亚兰语或希伯来语称号，通常理解为“热心者”，在使徒名单中即“奋锐党人”。中文若硬作音译，容易被误解为“迦南人”，因此正文采用通行且可理解的意译，并在脚注保留原文形式。
- source_word: Ἰσκαριώτης
  choice: 加略人
  rationale: 采用现代中文圣经中广为人知的传统译名，用作犹大的称号；其词源仍有争议，不在正文中强行解释。
- source_word: παραδοὺς
  choice: 出卖
  rationale: 该动词本义较宽，可指“交出、交付”；在犹大与耶稣的叙事关系中，“出卖”自然表达其背叛性的交付行为，同时用脚注保留较中性的字面译法。
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: 就是后来出卖耶稣的那个人
  rationale: 冠词加分词用于进一步指明犹大。中文补出“后来”，自然表达该分词所指向的后续叙事行动；以“耶稣”代替容易含混的“他”，使单独诵读本节时所指清楚。
theological_decisions:
- issue: παραδοὺς应译为较中性的“交出”，还是带有关系与道德色彩的“出卖”
  choice: 出卖
  alternative: 交出
  rationale: 在马太福音关于犹大的叙事语境中，这一行为是对耶稣的背叛，“出卖”能准确传达语境中的力度；但原动词本身语义范围更宽，因此脚注列出“交出”，避免掩盖原文的措辞。
- issue: Καναναῖος应音译还是按其传统含义意译
  choice: 奋锐党的
  alternative: 迦拿奈人
  rationale: 原词不是表示族裔的“迦南人”，而是源自闪语称号，通常理解为“热心者／奋锐党人”。正文意译可避免误读，脚注则说明原文形式及其传统解释，且不据此断定西门与后来有组织的政治派别之间的具体关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奋锐党的西门”沿用中文读者熟悉的表达，同时脚注交代原文并非普通希腊语“奋锐党人”一词；“就是后来……的那个人”自然呈现原文带冠词分词结构的辨识作用。
