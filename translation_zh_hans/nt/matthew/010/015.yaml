id: MAT.10.15
reference: Matthew 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: zh_hans
  text: 我实在告诉你们：在审判的日子，所多玛和蛾摩拉之地所受的，会比那城所受的更容易忍受。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更容易忍受”也可译作“较能承受”。
    reason: lexical_alternative
  - marker: b
    text: “城”也可译作“市镇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在“ἀμὴν λέγω ὑμῖν”这一郑重宣告公式中，“实在”自然、庄重，也保留了强调所言真实可靠的语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 现代汉语中“我告诉你们”比“我对你们说”更自然，同时保留直接而郑重的宣告语气。
- source_word: ἀνεκτότερον
  choice: 更容易忍受
  rationale: 该比较级意为“较可忍受、较能承受”。此处补出“所受的”，使比较双方在汉语中清楚，又不具体限定所受审判的形式。
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: 所多玛和蛾摩拉之地
  rationale: 保留希腊文“地”的地理表达，不直接简化为两座城或其居民。地名采用现代中文圣经读者熟悉的译名。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 在审判的日子
  rationale: 准确保留“审判之日”的表达及其未来、末世性的庄重意味，而不加入经文未说明的教义细节。
- source_word: τῇ πόλει ἐκείνῃ
  choice: 那城
  rationale: πόλις可指城或市镇；“那城”简洁自然，并指回拒绝使者的具体地方。
theological_decisions:
- issue: “审判的日子”的性质
  choice: 译作“在审判的日子”，呈现未来神圣审判的含义，但不进一步界定其完整教义框架。
  alternative: 理解为较泛指的受审判之时。
  rationale: ἐν ἡμέρᾳ κρίσεως自然指向一个特定的审判之日；直译可保留其末世张力，而不作超出本文的说明。
- issue: 比较对象是地域、城市还是居民
  choice: 正文保留“所多玛和蛾摩拉之地”与“那城”的拟人化比较。
  alternative: 明确译作两地的居民。
  rationale: 希腊文直接以“地”和“城”为承受比较的对象；不将其默默改释为居民，可保存原文的修辞与含义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣宣告公式的郑重感；后半句为符合汉语比较句式，补出两次“所受的”，但没有说明具体所受何物，以免过度解释。所有脚注标记均置于正文相关句末。
