  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: zh_hans
  text: 你们也会因我的缘故，被带到总督和君王面前，向他们[b]和外邦人[a]作见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: “向他们”在上下文中也可理解为“作为不利于他们的见证”，但希腊语与格本身没有明确表达这种敌对含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: 到总督和君王面前
  rationale: ἐπί加宾格与“被带”连用，表示被带到掌权者面前受审或陈述。“总督”贴合ἡγεμών在此政治语境中的常用含义，“君王”直接对应βασιλεῖς。
- source_word: ἀχθήσεσθε
  choice: 你们……会被带到
  rationale: 这是ἄγω的将来时被动形式。“被带到”自然表达被动处境，又不额外加入“拖去”所暗示的暴力程度。
- source_word: ἕνεκεν ἐμοῦ
  choice: 因我的缘故
  rationale: ἕνεκεν加属格表示原因。“因我的缘故”清楚保留事件因耶稣而发生的个人关联，并保持庄重自然。
- source_word: εἰς μαρτύριον
  choice: 作见证
  rationale: εἰς在这里表达目的或结果，μαρτύριον指见证。中文用“作见证”比“作为一个见证”更自然，同时保留其功能性含义。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 与“作见证”搭配时，间接受格最自然地译为“向他们”，所指回到总督和君王；不擅自把它限定为不利于他们的见证。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: ἔθνη在马太福音的犹太语境中常指以色列以外的各族。“外族人”是现代中文中较易懂且不带贬义的表达；“列国”也可能是其字面含义，故收入脚注。
theological_decisions:
- issue: μαρτύριον αὐτοῖς中见证与领受者的关系
  choice: 向他们作见证
  alternative: 作证指控他们
  rationale: 希腊语间接受格αὐτοῖς本身没有明确标示敌对或定罪关系。正文采用中性表达，保留这见证可能成为宣告，也可能因对方拒绝而成为不利证据的张力。
- issue: τοῖς ἔθνεσιν的群体范围
  choice: 外族人
  alternative: 列国
  rationale: 上下文涉及门徒在掌权者面前作见证，ἔθνη很可能指非犹太人；但该词也可指各国、各民族，因此不排除更广的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“总督和君王面前”呈现司法及政治场景；“因我的缘故”保留原文因果重点；脚注次序依正文相关词语出现的位置安排。
