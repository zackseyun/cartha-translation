  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: zh_hans
  text: 但当人把你们交出去时，不要为该怎样说或说什么而忧虑，因为就在那时，你们该说的话必会赐给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必会赐给你们”对应原文的被动表达，未明说施予者；下一节指出是你们父的灵借着你们说话。
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 但当……时
  rationale: ὅταν表示将来可能发生的情形，可译为“当……时”或“每逢”；结合上下文，此处用“当……时”自然清楚。δέ作轻微转折和承接，译为“但”。
- source_word: παραδῶσιν ὑμᾶς
  choice: 人把你们交出去
  rationale: παραδίδωμι在这里指把人交给掌权者处置，具有司法和敌对语境；“交出去”保留这一含义，又不增添原文未明说的“出卖”或具体对象。希腊语动词为第三人称复数，中文补出泛指的“人”以使句子自然。
- source_word: μὴ μεριμνήσητε
  choice: 不要忧虑
  rationale: μεριμνάω在此指因即将受审和作答而焦虑。“不要忧虑”既准确又具有庄重、通顺的现代汉语表达。
- source_word: πῶς ἢ τί λαλήσητε
  choice: 该怎样说或说什么
  rationale: 保留πῶς与τί所区分的表达方式和言语内容，并按ἤ译作“或”。“该……说”自然表达间接疑问中所设想的发言。
- source_word: δοθήσεται
  choice: 必有……赐给你们
  rationale: 保留未来被动的意义及隐含的施予者。“赐”在此符合神圣供应的语境，但不在本节明说施予者是谁。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 原意为“在那一时刻”。“就在那时”以自然现代汉语传达及时性与强调，不拘泥于可能显得生硬的“在那一小时”。
- source_word: τί λαλήσητε
  choice: 当说的话
  rationale: 概括为自然汉语名词短语，同时保留原文所指的发言内容，并与前半句“说什么”呼应。
theological_decisions:
- issue: δοθήσεται所用被动语态隐含施予者
  choice: 保留被动含义，不在正文中明说上帝或圣灵
  alternative: 译作“上帝必赐给你们”或“圣灵必赐给你们”
  rationale: 本节原文只说“必被赐予”，没有明确指出施予者；下一节才说明是父的灵借着门徒说话。因此本节保留原文的含蓄，避免提前补足神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交出去”保留司法语境而不过度解释；“就在那时”自然表达原文“在那一时刻”的即时性。
