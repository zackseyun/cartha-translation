  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: zh_hans
  text: 门徒不高过老师，奴隶[a]也不高过自己的主人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”；希腊文δοῦλος可按语境指奴隶或仆人。
    reason: alternative_reading
  - marker: b
    text: “主人”或译“主”；不过在这里的类比中，希腊文κύριος指人的主人。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητὴς
  choice: 门徒
  rationale: 在《马太福音》的语境中，该词指跟随老师、向其学习的人；“门徒”比偏重课堂身份的“学生”更能保留这种关系与跟随含义。
- source_word: ὑπὲρ
  choice: 高过
  rationale: ὑπέρ后接宾格，在这里表示地位或等级上的超越；“高过”简洁自然，也保留了原文的比较意象。
- source_word: διδάσκαλον
  choice: 老师
  rationale: 这是διδάσκαλος的普通含义；“老师”符合现代汉语，也避免与后半句的“主人”混淆。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 该词可依语境指奴隶或仆人；这里与κύριος构成社会身份上的对比，“奴隶”更准确地呈现从属及归属关系。
- source_word: κύριον
  choice: 主人
  rationale: 这里与δοῦλος配对，指奴隶的人间主人，并非神圣称号；“主人”最符合这一社会关系。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 该属格代词表示这位主人属于前述奴隶所处的关系范围；“他的”自然地保留了原文的单数指代。
- source_word: οὐδὲ
  choice: 也不能
  rationale: 承接前一否定句，引出并列的第二个否定比较；“也不能”是自然、清楚的现代汉语表达。
theological_decisions:
- issue: 非救恩论类比中δοῦλος的译法
  choice: 奴隶
  alternative: 奴仆／仆人
  rationale: 本节以门徒与老师、奴隶与主人两组身份关系作类比。译作“奴隶”能更明确保留δοῦλος所含的受支配地位；较宽泛的译法列入脚注。
- issue: 非神圣称号语境中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 这里的κύριος是与奴隶相对的人间上位者，并非直接用作对上帝或基督的称号；“主人”既清楚又不预先赋予基督论含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留两组平行结构，并用“他的”体现原文αὐτοῦ；脚注分别说明δοῦλος与κύριος的词义范围。
