  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: zh_hans
  text: 你们去时，要宣告说：“天国[b]已经临近了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“近了”或“已经近了”。希腊文使用完成时，强调这临近已经发生，并且其结果仍然有效。
    reason: lexical_alternative
  - marker: b
    text: 马太常用“天国”这一说法；其他福音书在相近语境中常说“上帝的国”。
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: 你们去的时候
  rationale: 现在时分词与命令式主句相配，表示宣告是在他们出行过程中进行；这样译既保留时间关系，也符合现代汉语表达。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 这是承接上文的轻微连接词；汉语在此无需明译，句意和行文衔接仍然清楚，若译作“而”反会显得转折过强。
- source_word: κηρύσσετε
  choice: 要宣告
  rationale: 该命令式动词指公开、郑重地传报信息。“宣告”保留传令式的公开性与权威感，又不把含义局限于宗教讲道。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出宣告的具体内容。译作“宣告说”略有重复，却能自然、清楚地反映原文结构。
- source_word: ὅτι
  choice: （用冒号和引号表达）
  rationale: 此处引出直接话语；现代汉语用冒号和引号即可自然呈现，不必另译为“即”或“说天国……”。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 完成时表示临近这一状态已经来到，并具有持续效力。“已经……了”保留其完成体意味，同时不把经文进一步解释为已经完全实现。
- source_word: ἡ βασιλεία
  choice: 国
  rationale: 与“天”组成汉语中自然且传统的“天国”。“国”在此可涵盖王权、统治及国度，不宜仅窄化为地域或仅改写为“掌权”。
- source_word: τῶν οὐρανῶν
  choice: 天
  rationale: 与 βασιλεία 合译为“天国”，准确保留马太的特色表达；汉语通常用单数概念“天”，不宜机械译成“诸天的国”。
theological_decisions:
- issue: “天国”的含义与马太的特色措辞
  choice: 保留“天国”
  alternative: 上帝的国；天的统治
  rationale: 原文是马太常用的“诸天之国”表达。保留“天国”既不与其他福音书的“上帝的国”强行统一，也不把 βασιλεία 只解释为动态的统治。
- issue: ἤγγικεν 的完成时意义
  choice: 译作“已经临近了”
  alternative: 近了；已经来到；就在眼前
  rationale: 此译表达临近已经发生并仍然有效，同时保留“临近”本身的张力，不擅自断定天国已完全来到或仅仅尚未来到。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们去的时候”清楚交代行动背景；“要宣告说”保留原文两个动词的结构；引语简洁有力。脚注只说明原文可译范围和马太的特色用语，不替经文消除其神学张力。
