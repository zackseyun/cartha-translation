  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: zh_hans
  text: 看哪，我差你们出去，像羊置身狼群中；所以你们要灵巧像蛇，纯良像鸽子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看
  rationale: 保留引人注意的语用功能，同时采用现代汉语中自然、直接的表达。
- source_word: ἀποστέλλω
  choice: 差……出去
  rationale: 表达受差遣执行使命的含义，也保留动作的外向性。
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: 如同羊进入狼群中
  rationale: 保留羊与狼的鲜明比喻；结合“差出去”的动态语境，用“进入”自然表达身处狼群之中的处境。
- source_word: φρόνιμοι
  choice: 机警
  rationale: 此处指面对危险时审慎、有判断力，不宜译成侧重知识或道德品格的“聪明”。
- source_word: οἱ ὄφεις
  choice: 蛇
  rationale: 保留原文动物意象；汉语泛指类别时无须表达希腊语定冠词。
- source_word: ἀκέραιοι
  choice: 纯真
  rationale: 原词有不掺杂、无害、无邪之意；“纯真”与“机警”形成自然张力，而不把含义收窄为单一解释。
- source_word: αἱ περιστεραί
  choice: 鸽子
  rationale: 准确保留比喻意象，采用现代汉语常用名称。
theological_decisions:
- issue: 门徒面对敌意时应兼具的两种品格
  choice: “机警”与“纯真”并列，不消解二者之间的张力
  alternative: 将其解释性地译为“精明却不伤害人”
  rationale: 原文以蛇和鸽子的并列比喻要求审慎与纯正同时存在，并未将其中一项化约为对另一项的限制性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式紧凑，保留命令语气和动物比喻；不添加原文没有的教派性解释。
