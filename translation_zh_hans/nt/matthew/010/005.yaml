  rationale: 修订只处理正文中“外族人的路”在现代汉语里的歧义和不自然之处，按语境将其译为前往外族人地区的禁令；脚注保留原文道路措辞及关系的含混。第二项将口语性的“不要进”调整为较庄重、明确的“不要进入”，不改变意义。
