  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: zh_hans
  text: 耶稣差遣这十二个人出去，吩咐他们说：“不要往外族人地区去；不要进入撒玛利亚人的城镇。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: 这十二个人
  rationale: 直译所指的十二位，避免补入原文没有的“门徒”；汉语中加“个人”较自然。
- source_word: ἀπέστειλεν
  choice: 差遣……出去
  rationale: 既表达“派出”，也保留受命执行使命的语气，而不强化为正式“委任”。
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: 吩咐他们说
  rationale: παραγγέλλω具有明确的指令意味；汉语“吩咐……说”自然地引出直接引语，无须机械重现两个分词。
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: 外族人的路
  rationale: 保留ὁδός的“路”意象和属格结构，不在正文中断定它究竟指通向外族地区的道路，还是外族人所走的路。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 此处从犹太人的语境指非犹太人；“外族人”比“列国”更清楚，也比带特定宗教色彩的称呼更中性。
- source_word: μὴ ἀπέλθητε
  choice: 你们不要走
  rationale: 直接表达否定命令，并与前面的“路”自然搭配。
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: 撒玛利亚人的城镇
  rationale: πόλις可指城或镇；“城镇”不武断限定规模，并保留“撒玛利亚人的”这一属格表达。
- source_word: μὴ εἰσέλθητε
  choice: 你们不要进
  rationale: 简洁、自然地表达禁止进入。
theological_decisions:
- issue: 禁止前往外族人和撒玛利亚人之处的范围与时限
  choice: 按这次差遣中的具体命令直陈，不添加永久性限制
  alternative: 把措辞处理成对外族人和撒玛利亚人的绝对或永久排斥
  rationale: 本节只记述耶稣此次差遣十二人时所下的命令；译文保留禁令的力度，却不加入经文本身未说明的时限或普遍化结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差遣”“吩咐”保留经文的使命与命令语气；引语采用前置话题结构，使两项并列禁令在汉语中清楚有力。
