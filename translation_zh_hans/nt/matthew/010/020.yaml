id: MAT.10.20
reference: Matthew 10:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: zh_hans
  text: 因为说话的不是你们，而是你们的父的灵在你们里面说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着你们说话。”原文直译为“在你们里面”，在这里也可含有父的灵借门徒发言的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……不是
  rationale: γάρ承接上文，说明门徒不必忧虑如何说、说什么的原因；“因为”自然保留解释关系。
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: 说话的不是你们
  rationale: 显明的代词ὑμεῖς和带冠词的分词结构强调说话者的身份；这一汉语结构既保留焦点，也自然流畅。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与前面的“不是”构成“不是……而是……”的强烈对比，准确表达ἀλλά的转折纠正作用。
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: 你们父的灵
  rationale: 忠实保留“你们的父”与“灵”的属格关系，不增添原文没有的“天上”；语境表明这是神的灵。
- source_word: τὸ λαλοῦν
  choice: 说话
  rationale: 现在分词与“灵”同为中性单数，明确是灵在说话；用动词短语自然呈现持续进行的动作。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: ἐν最直接的空间性表达是“在……里面”；虽然语境也可能含有借门徒发言的意思，正文不将其直接改写为工具性的“借着你们”。
theological_decisions:
- issue: ἐν ὑμῖν应表达内在临在还是工具性媒介
  choice: 在你们里面
  alternative: 借着你们
  rationale: 原文使用ἐν而非明确表示媒介的介词。上下文中的发言行动可使“在你们里面”同时暗示灵借门徒说话，因此正文保留原有张力，并以脚注列出自然的语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们父的灵”比“你们的父的灵”更简洁，并避免“你们父亲的灵”可能引起的人类父亲联想；脚注标记置于整句末，所解释的是末尾介词短语。
