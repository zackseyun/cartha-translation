id: MAT.10.17
reference: Matthew 10:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: zh_hans
  text: 但你们要提防人[a]，因为他们会把你们交给议会，也会在他们的会堂里鞭打你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世人”；希腊语原词在这里泛指人，并非仅指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: 要提防
  rationale: 该复数命令式在此警告门徒防备来自敌对者的危险；“要提防”自然、明确，并保留告诫语气。
- source_word: δὲ
  choice: 但
  rationale: δέ承接上文并引出警告性的转折；“但”符合此处语篇功能。
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: 提防人
  rationale: προσέχω与ἀπό连用表示防备危险的来源。ἄνθρωποι在此泛指迫害门徒的人，并非仅指男性；现代汉语“人”准确保留这一泛指意义。
- source_word: παραδώσουσιν
  choice: 会把……交给
  rationale: παραδίδωμι在此表示把人移交给司法或管治机构；“交给”保留法律处境，也不额外加入“出卖”所暗示的关系背叛。
- source_word: συνέδρια
  choice: 议会
  rationale: 复数συνέδρια指地方性的审议或司法机构，不必特指耶路撒冷公议会；“议会”兼顾机构性质与复数语境。
- source_word: συναγωγαῖς
  choice: 会堂
  rationale: 该词在此具体指犹太人的会堂；“会堂”是现代中文圣经语境中清楚而通行的表达。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 属格代词修饰“会堂”，表达这些敌对者所属或相关的会堂。
- source_word: μαστιγώσουσιν
  choice: 会……鞭打
  rationale: μαστιγόω指以鞭笞施行体罚；“鞭打”清楚、庄重，也避免较古旧的措辞。
theological_decisions:
- issue: ἀνθρώπων的性别表达
  choice: 人
  alternative: 男人
  rationale: 该希腊词虽为阳性复数形式，此处语义却泛指将迫害门徒的人类敌对者，并未限定为男性；译作“人”既忠于所指，也避免无根据地缩窄范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交给议会”保留司法移交意味；“他们的会堂”照原文保留可能带有群体区分意味的所有格，不进一步解释其神学含义。
