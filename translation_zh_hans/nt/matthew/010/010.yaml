id: MAT.10.10
reference: Matthew 10:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: zh_hans
  text: 上路时不要带行囊，也不要带两件里衣、鞋或手杖[a]；因为做工的人配得他的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有人认为“鞋或手杖”中的“手杖”是指不可另带一根手杖，尤其考虑到马可福音6:8准许带手杖。
    reason: 说明与马可福音6:8这一平行记载相关的另一种理解；正文仍按马太福音的希腊文本保留对手杖的禁止。
lexical_decisions:
- source_word: πήραν
  choice: 行囊
  rationale: 指旅行时携带、可装食物等用品的袋子；“行囊”自然简洁，并明确体现旅途语境。
- source_word: εἰς ὁδὸν
  choice: 路上
  rationale: 在“路上不要带行囊”中自然表达为旅程携带之意，避免生硬直译。
- source_word: δύο χιτῶνας
  choice: 两件内衣
  rationale: χιτών指贴身穿的基本衣物；“内衣”较准确地反映古代服饰层次，又比音译“长衣”更易懂。
- source_word: ὑποδήματα
  choice: 鞋
  rationale: 泛指绑在脚下的鞋类；“鞋”在现代汉语中自然，也不把原词过度限定为某一种式样。
- source_word: ῥάβδον
  choice: 手杖
  rationale: 这里指旅途使用的杖；“手杖”清楚自然。正文保留马太所述的禁止，不与马可福音6:8调和。
- source_word: ἄξιος
  choice: 配得
  rationale: 保留“有资格、值得获得”的评价意味，也符合庄重而常见的圣经汉语表达。
- source_word: ὁ ἐργάτης
  choice: 工人
  rationale: 直接表达从事工作的人，不引入教会职分等经文未明说的含义。
- source_word: τῆς τροφῆς αὐτοῦ
  choice: 他的食物
  rationale: τροφή最直接指食物或养料；采用具体含义，不扩展为较宽泛的“供养”。
theological_decisions:
- issue: 与平行记载在可携带旅行装备方面可能存在的张力
  choice: 正文按马太的希腊文本保留“也不要带……手杖”。
  alternative: 理解为不可多带一根手杖，或参照马可福音6:8作较宽松的调和式翻译。
  rationale: 希腊文本将ῥάβδον直接列在禁止携带的物品中。为尊重原文并保留福音书平行记载之间的真实张力，正文不作调和，仅在脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“行囊”“手杖”“配得”兼顾历史语境与圣经文体；并列禁令以“也不要”自然衔接。
