  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: zh_hans
  text: 因为我来，是要使一个男人与他的父亲对立[a]，女儿与母亲对立，儿媳与婆婆对立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……对立”也可译作“使……分裂”；希腊语原词可指使人分开，而下文反复出现的“与……对立”说明这里指关系上的冲突。
    reason: lexical_alternative
  - marker: b
    text: “儿媳”所对应的希腊语在某些语境中也可指“新娘”；这里因与“婆婆”相对，意思是“儿媳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: 我来
  rationale: 不定过去时在这里指耶稣的来到及使命；汉语用“我来”自然简洁，无须强行标出过去时。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”比“原来”更直接清楚。
- source_word: διχάσαι
  choice: 使……对立
  rationale: 该不定式表示使之分裂；随后反复出现的 κατά 加属格明确表达关系上的敌对，因此译为“使……对立”既自然又保留强烈语气。
- source_word: ἄνθρωπον
  choice: 儿子
  rationale: ἄνθρωπος 本可泛指“人”或指“男人”，但此处所列三组家庭关系呼应弥迦书7:6；与“父亲”相对时，汉语用“儿子”能准确呈现关系角色，也与后两组“女儿”“儿媳”平行。
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: 与父亲对立
  rationale: κατά 加属格表示敌对或反对；“与……对立”符合现代汉语表达。
- source_word: θυγατέρα
  choice: 女儿
  rationale: 直接、自然地表达该亲属称谓。
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: 与母亲对立
  rationale: 保留与前后分句相同的敌对结构。
- source_word: νύμφην
  choice: 儿媳
  rationale: νύμφη 有“新娘”和“儿媳”两义；因这里与 πενθερά 配对，所指是“儿媳”。
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: 与婆婆对立
  rationale: πενθερά 指丈夫的母亲，即儿媳的“婆婆”；此译符合汉语亲属称谓，也保留反复结构。
theological_decisions:
- issue: 耶稣所说其来到之使命与家庭冲突的关系
  choice: 保留“我来，是要使……对立”的鲜明目的表达，不在正文中把它弱化为单纯、偶然的社会后果。
  alternative: 译成“我的到来会导致……”或补明这是人们对耶稣作出不同回应所造成的结果。
  rationale: 原文使用 ἦλθον 加目的不定式 διχάσαι，措辞刻意而强烈。译文应保留这种神学张力，同时不额外暗示耶稣以家庭敌对本身为终极善，也不把上下文解释直接写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个分句重复“与……对立”，以保存希腊文的平行结构和尖锐语气；亲属称谓按汉语习惯译为“儿子、女儿、儿媳、父亲、母亲、婆婆”。
