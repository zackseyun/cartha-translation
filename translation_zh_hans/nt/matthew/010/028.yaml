  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: zh_hans
  text: 不要怕那些杀身体、却不能杀灵魂的；倒要怕那位能在革赫拿[a]中毁灭灵魂和身体的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “革赫拿”源自“欣嫩谷”之名；在这里指最终审判之处，也常译作“地狱”。
    reason: 说明 γέεννα 的历史词源、此处审判语境中的专门含义及常见译法。
lexical_decisions:
- source_word: φοβεῖσθε
  choice: 怕
  rationale: 两处动词形成鲜明对照，统一译作“怕”，既自然直接，也保留警告的力度；不译作“敬畏”，以免第一处不合语境，并避免在第二处预先限定对象身份。
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: 那些杀……的
  rationale: 带冠词的现在分词指一类人；此译符合现代汉语，并保留泛指意味。
- source_word: σῶμα
  choice: 身体
  rationale: 直接表达人的肉身，与下文“灵魂”构成对照。
- source_word: ψυχήν
  choice: 灵魂
  rationale: 在与“身体”的明确对照中，此处不宜仅译作“生命”；“灵魂”较能保留原文所表达的人之非身体层面。
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: 不能杀
  rationale: 简洁自然地表达能力上的不能，并忠实保留原文含义。
- source_word: μᾶλλον
  choice: 倒要
  rationale: 在否定命令之后引出相反而更应采取的态度，符合汉语对比表达，也保留 μᾶλλον 的纠正性和比较意味。
- source_word: τὸν δυνάμενον
  choice: 那位能……的
  rationale: 保留原文未明说身份的实体化分词表达；“那位”适合指有位格的对象，同时不在正文中径直补作“上帝”或“撒但”。
- source_word: ἀπολέσαι
  choice: 毁灭
  rationale: 表达审判语境中的决定性毁坏，同时不额外规定其具体形态或机制。
- source_word: ἐν γεέννῃ
  choice: 在欣嫩谷里
  rationale: γέεννα 源于“欣嫩谷”之名，并在此指最终审判之处。正文保留其历史名称，脚注说明其语境意义，避免直接以承载较多后世联想的“地狱”取代原词。
theological_decisions:
- issue: “能把灵魂和身体都毁灭在欣嫩谷里的”那一位是谁
  choice: 正文译作“那位”，不明确补出身份
  alternative: 明确译作“上帝”或理解为“撒但”
  rationale: 上下文最自然地指向拥有最终审判权的上帝，但希腊文此处并未直接点名。译文保留原文措辞的开放度，不把解释写入正文。
- issue: γέεννα 的表达
  choice: 正文作“欣嫩谷”，脚注说明其指最终审判之处，也常译“地狱”
  alternative: 正文直接译作“地狱”或音译“革赫拿”
  rationale: “欣嫩谷”保留该词的犹太历史背景，且比生硬音译更便于普通读者理解；脚注补充其在本节中的专门用法。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。以“杀身体／杀灵魂”保留原文的平行和张力，以“不要怕／倒要怕”再现命令式对照。脚注标记[a]已置于正文相应词语之后。
