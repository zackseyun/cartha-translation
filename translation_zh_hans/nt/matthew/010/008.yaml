  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: zh_hans
  text: 医治患病的人，叫死人复活[b]，使麻风病人洁净[a]，赶出鬼魔。你们白白地得来，也要白白地给出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻风病人”也可译作“患严重皮肤病的人”。圣经中这个词所指的范围可能比现代医学所说的麻风病（汉森病）更广。
    reason: 文化与词义说明
  - marker: b
    text: 有些早期抄本没有“叫死人复活”这句话。
    reason: 文本变异说明
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: 医治患病的人
  rationale: ἀσθενέω在此指患病，θεραπεύω在神迹性差遣的语境中指医治；译文自然保留宾语和命令语气。
- source_word: νεκροὺς ἐγείρετε
  choice: 叫死人复活
  rationale: ἐγείρω与“死人”连用，明确指使人从死亡中起来；“叫死人复活”是现代汉语中清楚自然的表达。
- source_word: λεπροὺς καθαρίζετε
  choice: 使麻风病人洁净
  rationale: λεπρός在圣经用法中可涵盖多种严重皮肤病；正文采用读者熟悉的传统说法，并以脚注说明范围。καθαρίζω兼有身体痊愈和礼仪洁净的含义，因此译为“使……洁净”，不简化为“医治”。
- source_word: δαιμόνια ἐκβάλλετε
  choice: 赶出鬼魔
  rationale: δαιμόνια指鬼魔，ἐκβάλλω在驱魔语境中表示逐出；“赶出”直接保留其驱逐力度。
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: 你们白白地得来，也要白白地给出去
  rationale: δωρεάν在两句中重复，意为无偿、免费；重复“白白地”保留原文的平行和强调。“得来”与“给出去”形成自然的汉语对应。
theological_decisions:
- issue: 神迹命令的范围
  choice: 把各项复数命令式直接译为耶稣在差遣语境中对门徒发出的具体命令。
  alternative: 将部分行动解释为隐喻，或仅视为后世教会实践。
  rationale: 希腊文以一连串直接的复数命令式列出具体行动。译文不将其弱化为比喻，也不超出本节去界定这些命令在其他时代的适用范围。
- issue: “洁净”的身体与礼仪含义
  choice: 保留“洁净”，让身体恢复与礼仪洁净的双重关联同时存在。
  alternative: 译为“医治麻风病人”，只突出疾病痊愈。
  rationale: καθαρίζω并非此处通常表示医治的θεραπεύω；保留用词差异可呈现原文的文化和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四个命令保持简洁有力；末句用重复结构再现原文的修辞平衡。脚注标记紧接“洁净”，对应需要说明的“麻风病人”一语。
