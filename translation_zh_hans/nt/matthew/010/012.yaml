  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: zh_hans
  text: 你们进那家时，要向那家[a]问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向那一家人问安。”希腊文直译是“向它问安”，其中“它”指那家，可能是借“家”指住在里面的人。
    reason: 说明οἰκία与αὐτήν所形成的转喻，并提供较显明的词义选择。
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: 你们进……时
  rationale: 现在时分词主格复数在此作伴随情状，修饰复数命令语气；用时间从句自然表达进入之际发生的动作。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的承接连词；上下文关系已由“……时”的句式自然体现，不宜强化为转折。
- source_word: οἰκίαν
  choice: 那家
  rationale: οἰκία既可指房屋，也可转指家庭或家中成员。“那家”在现代汉语中既能配合“进”表示住所，又保留指向一家人的转喻空间。
- source_word: ἀσπάσασθε
  choice: 要……问安
  rationale: 不定过去时中间语态命令式第二人称复数，表达直接指示。“问安”自然、庄重，也符合当时登门致意的语境。
- source_word: αὐτήν
  choice: 向那家
  rationale: 阴性单数代词回指οἰκίαν。重复“那家”比直译成汉语不自然的“向它”更清楚，同时仍保留原文以“家”为受礼对象的转喻表达。
theological_decisions:
- issue: 问安的语法对象是房屋，还是其中的家人
  choice: 正文保留以“那家”为问安对象的转喻说法
  alternative: 向那一家人问安／向家里的人问安
  rationale: 希腊文的阴性单数代词αὐτήν明确回指οἰκίαν，并未直接说“他们”。译作“那家”既忠实保留这一形式，也可在现代汉语中自然转指住在其中的人；脚注说明另一种显明表达，避免在正文中消除原文的张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“那家”兼有住所与家庭的含义，比“房子”更自然，也比“向它问安”更符合汉语习惯；保留“你们”以反映复数形式。
