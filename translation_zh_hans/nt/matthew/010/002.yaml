  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: zh_hans
  text: 十二使徒的名字如下：第一位[a]是称为彼得的西门，和他的兄弟安得烈；西庇太的儿子雅各，和他的兄弟约翰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第一位”也可能暗示彼得在十二使徒中居于显要位置，而不只是名单次序上的第一。
    reason: 保留πρῶτος可能含有的显要或居首意味，避免正文作宗派性定论。
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ只作轻微转折，引入十二使徒的名单；现代汉语可借“名字如下”的句式自然承接，无须添加带明显时间意味的“现在”。
- source_word: δώδεκα ἀποστόλων
  choice: 十二使徒
  rationale: “使徒”是本语境中ἀπόστολος准确且通行的译法，指耶稣所差遣并构成特定群体的十二人。
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: 名字如下
  rationale: 以自然、庄重的现代汉语表达希腊文“名字是这些”的指示结构。
- source_word: πρῶτος
  choice: 第一位
  rationale: 首先保留名单次序的基本含义；“位”适合用于人物列举，同时不在正文中断言权柄上的首位。
- source_word: ὁ λεγόμενος Πέτρος
  choice: 那称为彼得的
  rationale: 贴近希腊文识别性分词结构，说明西门也以“彼得”这一名称为人所称。
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: 他的兄弟
  rationale: ἀδελφός在这里指亲兄弟；两次αὐτοῦ分别指西门和雅各。
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: 西庇太的儿子
  rationale: 希腊文以属格标明家系，汉语需明确补出所隐含的“儿子”，以自然表达身份关系。
theological_decisions:
- issue: πρῶτος用于西门彼得时的含义
  choice: 正文译作“第一位”，按名单次序理解
  alternative: 也可能暗示他在十二使徒中居于显要位置
  rationale: πρῶτος既可表示列举中的首先，也可能带有显要或居首的意味。本节本身不足以确立有关权柄首位的教义，因此正文保留基本词义，脚注说明另一种可能，以保存原文的张力。
translation_notes:
  register: 采用现代标准汉语，语气庄重而易懂。“名字如下”自然引出名单；以分号分隔两组兄弟，使长句清楚。所有人名采用简体中文圣经中通行的译名。
