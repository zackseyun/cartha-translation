id: MAT.10.23
reference: Matthew 10:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: zh_hans
  text: 但每当有人在这座城里迫害你们，你们就逃到另一座城去。[a]我实在告诉你们：人子来到以前，你们绝不会走遍以色列的各城。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们就逃到下一座城去。”原文直译为“逃到另一座去”，其中“城”承接上文而省略。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们绝不会完成以色列的各城。”正文的“走遍”把差遣语境中隐含的巡行各城之意表达出来。
    reason: lexical_alternative
  - marker: c
    text: “人子来到”在这里所指的事件并未明说。有人理解为耶稣得着伸冤和荣耀，有人理解为他临到施行审判，也有人理解为他末后再来。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: 每当
  rationale: 表达不定时间和可能反复发生的情形，比单纯的“当……时”更贴近原文的开放性。
- source_word: διώκωσιν
  choice: 迫害
  rationale: 在差遣门徒的语境中，指敌意的逼迫，而非一般性的追赶。
- source_word: πόλει ταύτῃ
  choice: 这座城
  rationale: 保留近指代词的直接性。
- source_word: φεύγετε
  choice: 逃到……去
  rationale: 准确传达面对迫害时迅速离开的命令语气。
- source_word: εἰς τὴν ἑτέραν
  choice: 到另一座城
  rationale: 原文省略了“城”，需由上文补出；ἑτέραν在此自然表示另一座城，不强行赋予固定的先后次序。
- source_word: ἀμὴν
  choice: 实在
  rationale: 符合耶稣郑重宣告公式在现代中文圣经语体中的自然表达。
- source_word: οὐ μὴ τελέσητε
  choice: 绝不会走遍
  rationale: “绝不会”体现οὐ μή的强烈否定；“走遍”根据宣教巡行语境自然表达τελέω与“各城”搭配时隐含的完成遍历之意。
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: 以色列的各城
  rationale: 直接保留属格关系，并以“各城”自然呈现复数。
- source_word: ἕως ἂν ἔλθῃ
  choice: 来到以前
  rationale: 清楚表达未来界限，同时不增加“来”的性质或方式。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经传统中确立的称谓，保留其字面形式和但以理书背景所承载的神学含义。
theological_decisions:
- issue: “人子来到”在本节具体指什么
  choice: 保留“人子来到以前”，不在正文中明确所指事件
  alternative: 解释为耶稣复活得荣、临到施行审判，或末后再来
  rationale: 原文没有明确限定这里的“来到”指哪一事件；直译并加注可保留其真实的末世论张力，避免把某一解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“每当……就……”使条件与回应关系清楚；“我实在告诉你们”保留郑重宣告的语气。正文不展开有争议的末世论解释。
