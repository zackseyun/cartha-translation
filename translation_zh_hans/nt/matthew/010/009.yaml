  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: zh_hans
  text: 不要置备金、银或铜钱[a]，装在你们的腰带里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”。
    reason: lexical_alternative
  - marker: b
    text: 当时人可把钱放在腰带里，或放在系于腰间的钱袋中。
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: 不要置备
  rationale: κτάομαι意为取得、获得或置备。这里不是单纯禁止随身携带，而是吩咐门徒不要为旅程预先获取或准备钱财；“置备”自然地保留了这一语义。
- source_word: χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν
  choice: 金、银或铜钱
  rationale: 三者本指金、银、铜（或青铜），在此语境中指相应材质的钱币。前两项保留简洁的物质名称，在“铜”后补“钱”，使现代读者清楚整组所指为钱财，同时避免逐项重复“钱”。
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: 为你们的腰带
  rationale: ζώνη是腰带或束腰带，当时可用来盛放钱币；εἰς在这里表达放入或为之预备的方向。“为你们的腰带”保留原文表达，并由脚注说明文化背景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“置备”比“拿”更准确地传达获取、预备之意；主句保持原文中“腰带”的具体意象，并以脚注解释其盛钱功能。
