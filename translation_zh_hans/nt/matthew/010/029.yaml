id: MAT.10.29
reference: Matthew 10:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: zh_hans
  text: 两个麻雀不是卖一阿萨里翁[b]吗？然而，若非你们的父[a]，它们中连一只也不会掉在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“离开你们的父”或“没有你们的父”。这句话可能指并非离开父的知情、看顾或旨意；但希腊原文没有具体说明是哪一种。
    reason: alternative_reading
  - marker: b
    text: “阿萨里翁”是古罗马一种价值很低的小铜币。
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: 麻雀
  rationale: 该词可泛指小鸟，但在这句教导的语境和传统用法中，译作“麻雀”最自然、具体。
- source_word: ἀσσαρίου
  choice: 一个阿萨里翁
  rationale: 这是特定的古罗马小额铜币；保留币名可避免用现代或其他时代的货币作不准确的等值替换，并以脚注解释。
- source_word: πωλεῖται
  choice: 卖
  rationale: 以现代汉语常用的“两个麻雀卖一个……”自然表达希腊文现在时被动形式所指的市售价格。
- source_word: ἓν ἐξ αὐτῶν
  choice: 它们中连一只
  rationale: 自然表达部分关系，并借“连”传达在这些低价小鸟中甚至一只也不例外的强调。
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: 掉在地上
  rationale: 准确而自然地表达小鸟落到地面的动作；上下文可能暗示死亡，但原文并未明说，故不译作“死去”。
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: 若没有你们的父
  rationale: 贴近“没有／离开你们的父”的字面范围，避免擅自限定为父的许可、旨意或知情，同时保持现代汉语基本自然。
- source_word: οὐχὶ ... ;
  choice: 不是……吗？
  rationale: 保留期待肯定回答的反问语气。
- source_word: καὶ
  choice: 可是
  rationale: 结合上下文表达转折和递进：麻雀虽价值低微，其中甚至一只也不在父的关切之外。
theological_decisions:
- issue: “若没有你们的父”如何描述上帝的护理
  choice: 正文保留“若没有你们的父”这一未限定的说法
  alternative: 若没有你们父的许可／若不是你们的父知道／若不是你们父的旨意
  rationale: 原文明确指出麻雀坠地并非与父无关，却没有说明这种关系具体是指他的知情、看顾、许可还是旨意。正文不把其中一种解释写成原文明说的内容。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“两个麻雀不是卖一个……吗”保留反问力度；“它们中连一只”体现递进强调。将两个脚注标记分别紧跟相关词语，币值说明置于“阿萨里翁”后，语义歧义说明置于“父”后。
