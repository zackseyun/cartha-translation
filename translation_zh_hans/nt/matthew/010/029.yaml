revisions:
- from: 两个麻雀不是卖一个阿萨里翁[b]吗？可是，若没有你们的父[a]，它们中连一只也不会掉在地上。
  to: 两个麻雀不是卖一阿萨里翁[b]吗？然而，若非你们的父[a]，它们中连一只也不会掉在地上。
  rationale: 修订仅改善现代汉语的自然度，并更稳妥地保留ἄνευ τοῦ πατρὸς ὑμῶν的未限定关系。“若非你们的父”不将其解释为父的许可、意旨或知情；脚注明确列出这些可能理解而不裁定其中任何一种。其余措辞保留原稿对反问、递进否定和‘掉在地上’而非直接说‘死亡’的忠实处理。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:13:16Z'
review_pass:
  verdict: revise
  source_fidelity: 核心意思基本准确：反问、低价、‘其中一只也不’以及父与其坠地之间未被具体界定的关系均有体现。不过“若没有你们的父”在现代汉语中不够自然，且“若”容易使该短语显得像明确的条件从句；改为“若非你们的父”较能表达 ἄνευ 的‘离开／没有’范围，同时不具体化为知情、许可或旨意。
  naturalness: “两个麻雀不是卖一个阿萨里翁吗？”可懂，但“卖一阿萨里翁”作为市价说法更凝练自然。“若非你们的父”是庄重而通顺的现代书面语，也适合本段耶稣教导的语体。
  terminology: “麻雀”“阿萨里翁”“父”均合适。保留“阿萨里翁”并用脚注说明其为古罗马低值小铜币，恰当地维持历史具体性。“父”不应在正文改写为“父的许可／旨意／知情”。
  issues:
  - severity: medium
    issue: “若没有你们的父”不够自然，并使“若”与“没有”形成生硬的条件表达。
    rationale: ἄνευ τοῦ πατρὸς ὑμῶν意为‘没有／离开你们的父’，但没有明说父以何种方式相关。汉语“若非你们的父”较自然，且不添加原文未明定的神学限定。
  - severity: low
    issue: “卖一个阿萨里翁”略显口语性和冗余。
    rationale: 在价格表达中，“卖一阿萨里翁”更紧凑；不改变ἀσσαρίου所指的一枚阿萨里翁。
