source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: zh_hans
  text: 但无论谁在人面前不认我，我也要在我在天上的父面前不认他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: 但无论谁
  rationale: ὅστις与ἄν构成泛指条件，译作“无论谁”；δέ承接上一节并形成对比，译作“但”。
- source_word: ἀρνήσηταί με
  choice: 不认我
  rationale: ἀρνέομαι在此指公开否认或拒绝承认与耶稣的关系。“不认”自然、庄重，并适合与后半句重复，保留原文的对应结构。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人面前
  rationale: ἔμπροσθεν表示“在……面前、当着……的面”；ἀνθρώπων在这里泛指众人。现代汉语“在人面前”简洁自然，且不制造原文没有的性别限定。
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: 我也要……不认他
  rationale: κἀγώ含“我也”的对应和强调意味；重复“不认”保留两处ἀρνέομαι之间严肃而鲜明的对称。
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: 在我……的父面前
  rationale: 直译其关系表达，并保留耶稣所说“我父”的独特称谓。
- source_word: τοῦ ἐν οὐρανοῖς
  choice: 天上的
  rationale: 希腊文使用复数οὐρανοῖς，但“天上的父”是自然、准确的现代汉语表达，无须机械呈现数的差异。
theological_decisions:
- issue: 两处否认用语的互应
  choice: 不认我……不认他
  alternative: 否认我……否认他；不承认我……不承认他
  rationale: 两处使用同一译词，以保留原文所表达的相应行动及修辞对称；“不认”也能自然表达公开拒绝承认关系的含义。
- issue: 泛指人群与第三人称代词
  choice: 在人面前……不认他
  alternative: 在众人面前……不认那人
  rationale: ἀνθρώπων泛指人类或众人，汉语“人”本身不限定性别；αὐτόν为阳性单数，承接泛指的“谁”，译作“他”符合现代汉语的一般指称方式，不额外限定对象仅为男性。
- issue: “诸天”复数的表达
  choice: 我天上的父
  alternative: 我在诸天之上的父
  rationale: 原文ἐν οὐρανοῖς在形式上为复数，但闪族语境中的复数并不要求译文引入多层天界观；“天上的”保留意义，同时避免加入原文未明说的宇宙论解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“无论谁”呈现普遍条件，“我也要”突出前后对应。句式紧凑，保留原文两次“不认”和两次“在……面前”的平行结构。
