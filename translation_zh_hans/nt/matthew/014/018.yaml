  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: zh_hans
  text: 耶稣却说[a]：“把它们拿到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“它们”指上一节提到的饼和鱼。
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δὲ是较轻的连接词；这里承接门徒上一节所说的困难，并引出耶稣的回应。译作“却”自然地表达轻微转折，而不过分强化对立。
- source_word: εἶπεν
  choice: 说
  rationale: 简单过去时的λέγω在此是普通的言说动词；译作“说”准确，不把动词本身解释为“吩咐”。
- source_word: Φέρετέ
  choice: 拿……来
  rationale: φέρω的现在时主动命令语气第二人称复数，要求门徒把所指之物带来；现代汉语中“拿……来”比“携带”自然，也保留命令语气。
- source_word: μοι
  choice: 到我这里
  rationale: 与ὧδε合译为“到我这里”，既表达与说话者相关的方向，也符合现代汉语习惯。
- source_word: ὧδε
  choice: 这里
  rationale: ὧδε表示地点“这里”；在“拿到我这里来”中保留其空间指向。
- source_word: αὐτούς
  choice: 它们
  rationale: 该阳性复数代词按上下文回指上一节的饼和鱼。正文保留代词表达，不将其所指直接写入正文；中文对物使用“它们”自然清楚。
theological_decisions: []
