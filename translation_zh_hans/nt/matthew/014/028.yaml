  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: zh_hans
  text: 彼得回答他，说：“主啊，如果是你，就吩咐我在水面上走到你那里去[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众水之上。”原文“水”是复数。
    reason: 说明希腊原文τὰ ὕδατα为复数，并提供较贴近字面形式的译法。
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: 彼得就回答他说
  rationale: 这是常见的叙事承接表达；“就”自然体现 δέ 的衔接作用，“回答他”表达 αὐτῷ，而“说”保留引出直接引语的功能。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 在对耶稣的称呼中兼具尊敬与潜在基督论分量的张力，不弱化为单纯的“先生”。
- source_word: εἰ σὺ εἶ
  choice: 如果是你
  rationale: 自然表达对来者身份的确认，不增添“那一位”等原文没有明说的限定。
- source_word: κέλευσόν
  choice: 吩咐
  rationale: 表达带权柄的指示；在现代汉语中比“命令”更符合彼得向主提出请求的语境，同时没有削弱动词的权威意味。
- source_word: με ἐλθεῖν πρὸς σὲ
  choice: 我……走到你那里去
  rationale: πρὸς σέ 表示朝向耶稣移动；汉语用“到你那里去”最自然。为使“在水面上前往”合乎汉语表达，补出语境隐含的“走”，没有改变动作目标。
- source_word: ἐπὶ τὰ ὕδατα
  choice: 从水面上
  rationale: 正文采用现代汉语自然说法“水面上”；原文复数 τὰ ὕδατα 的形式则在脚注中说明，避免正文生硬。
theological_decisions:
- issue: 彼得以 κύριε 称呼耶稣的分量
  choice: 译作“主啊”
  alternative: 老师／先生
  rationale: “主”既符合马太福音中的惯常用语，也保留此称呼可能超过一般礼貌称谓的神学分量，同时不在本节中进一步界定彼得的认信程度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文避免机械复制希腊语分词结构；以“彼得就回答他说”保持叙事承接。用“水面上”确保汉语流畅，并以脚注保留“众水”这一原文形式。
