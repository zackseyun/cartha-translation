  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: zh_hans
  text: 耶稣随即催逼门徒上船，先他一步到对岸去，等他遣散人群[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遣散人群”也可译作“打发人群离开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: 随即
  rationale: 表达动作紧接前文发生，既保留叙事的迅速推进，也符合现代汉语习惯。
- source_word: ἠνάγκασεν
  choice: 催促
  rationale: 此词含有强烈要求或促使之意；“催促”在本语境中自然，并能体现耶稣不是仅仅提出建议。若译作“迫使”，现代汉语容易让人联想到外在强制或暴力，语气可能过重。
- source_word: τοὺς μαθητάς
  choice: 门徒
  rationale: 定冠词指上下文中已知的门徒群体；汉语无需另加“那些”或“他的”也能清楚指称。
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: 上船
  rationale: 准确而简洁地表达登上船只的动作，是现代汉语最自然的说法。
- source_word: πλοῖον
  choice: 船
  rationale: 希腊文虽无冠词，但上下文指向现场的特定船只；汉语“上船”本身自然，无需强加量词或指示词。
- source_word: προάγειν αὐτόν
  choice: 先他一步
  rationale: 保留门徒要走在耶稣前面、比他先行的关系，而不把意思简化为单纯的“先走”。
- source_word: εἰς τὸ πέραν
  choice: 到对岸去
  rationale: 这是表示水域另一边的惯用表达；“对岸”清楚、简洁，并符合场景。
- source_word: ἕως οὗ ἀπολύσῃ
  choice: 等他遣散
  rationale: ἕως οὗ加虚拟语气指向相对于主句尚待完成的行动；汉语“等……遣散”自然地保留这一前瞻关系。
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: 遣散众人
  rationale: 在此语境中指让聚集的人群离开；“遣散”凝练地传达有意识地让人群散去。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 原文是复数，指聚集的多群人；现代汉语“众人”能自然概括这些群众，避免生硬的“众群人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句首补出“耶稣”，使汉语中的主语清楚；“先他一步”则保留原文αὐτόν所表达的先于耶稣而行。脚注标记置于其所说明的“遣散众人”之后。
