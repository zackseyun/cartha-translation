- from: 耶稣随即催促门徒上船，先他一步到对岸去，等他遣散众人。[a]
  to: 耶稣随即催逼门徒上船，先他一步到对岸去，等他遣散人群[a]。
  rationale: 修订仅加强“催促”所不足以表达的原文动词力度，并将“众人”调整为更明确对应ὄχλους的“人群”。句子的时间与行动关系、叙事主语及脚注的词汇替代性质均予保留。
