  naturalness: 原译引语末尾“现在就在这里给我”略显累赘，也使“放在盘子上”的动作与“给我”的核心要求衔接不够自然。改为“拿到这里给我”符合现代汉语，并保留ὧδε的指示意义。
  terminology: “施洗者约翰”准确保留βαπτιστής作为描述性称号；“施洗约翰”可作为传统译法置于紧邻术语的脚注。
