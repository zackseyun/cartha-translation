base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: zh_hans
  text: 她受母亲的指使，就说：“把施洗者约翰[a]的头放在盘子上，拿到这里给我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法作“施洗约翰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: 受了……的指使
  rationale: 该被动分词表示女孩事先受到母亲的推动或授意；“受了……的指使”保留被动关系和先行影响，又不把它窄化为正式教导。
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: 母亲的
  rationale: ὑπό加属格标明被动结构中的施事者；与“受了……的指使”组合，自然表达“受她母亲指使”。
- source_word: Δός μοι
  choice: 请……给我
  rationale: δίδωμι的不定过去时命令式是直接要求；汉语加入“请”使宴席场景中的直接请求自然，但没有削弱其明确性。
- source_word: φησίν
  choice: 就说
  rationale: 希腊文使用历史现在时以增强叙事现场感；现代汉语叙事通常用“就说”自然表达承接与即时回应。
- source_word: ὧδε
  choice: 现在就在这里
  rationale: ὧδε本义为“这里”；结合要求呈上首级的语境，此译突出现场性，而“现在”是语境性显化，并非把该词单独释为时间副词。
- source_word: ἐπὶ πίνακι
  choice: 放在盘子上
  rationale: πίναξ在宴席语境中指盛放食物的盘或托盘；“盘子”是现代汉语最自然且不过度限定器形的表达。
- source_word: τὴν κεφαλὴν
  choice: 头
  rationale: 直译保留原文刻意而骇人的具体性。
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: 施洗者约翰
  rationale: βαπτιστής是描述约翰活动的施事名词；“施洗者”既保留称号的描述功能，也符合现代汉语圣经语体。
theological_decisions:
- issue: 约翰称号βαπτιστής的译法
  choice: 施洗者约翰
  alternative: 施洗约翰
  rationale: “施洗者”直接表达希腊文施事名词的描述性，避免把称号完全固化为名字的一部分；脚注保留汉语传统熟悉的“施洗约翰”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“指使”传达母亲事先施加的明确影响；引语调整为符合汉语信息顺序的表达。“盘子”比“托盘”更少过度限定原物形制。
