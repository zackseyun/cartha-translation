  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: zh_hans
  text: 耶稣却立刻对他们说：“放心，是我[a]，不要怕！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“我是”。这里的希腊语可以只是表明身份，但有些读者也会听出它可能呼应神的自我称谓。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确表达紧接前文发生的时间意义，现代汉语自然明晰。
- source_word: δὲ
  choice: 却
  rationale: 承接上一节门徒的惊恐，并表现叙事中的轻微转折。
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 耶稣……对他们说
  rationale: 将希腊语“开口对他们讲话，说”自然整合为现代汉语，保留说话者、对象和直接引语关系，避免重复累赘。
- source_word: Θαρσεῖτε
  choice: 放心
  rationale: 在安慰受惊门徒的语境中，表达鼓起勇气、恢复信心的命令语气；比“要勇敢”更符合此处自然口语，同时保持庄重。
- source_word: ἐγώ εἰμι
  choice: 是我
  rationale: 直接传达此处自我辨认的语境意义；脚注保留较直译的“我是”，不排除潜在的神学回响。
- source_word: μὴ φοβεῖσθε
  choice: 不要怕
  rationale: 简洁自然地表达否定命令，不把希腊语时体过度解释为“别再害怕了”。
theological_decisions:
- issue: ἐγώ εἰμι 是单纯的自我辨认，还是对神圣“我是”称谓的呼应
  choice: 正文译作“是我”
  alternative: 较直译为“我是”
  rationale: 眼前语境首先是耶稣向惊恐的门徒表明身份；脚注同时保留原文形式及其可能引发的神圣自称回响，避免把这种神学张力武断地消除或明确化。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“放心”贴合安慰受惊者的场景；两个短促命令“放心”“不要怕”保留原句直接有力的语气。
