  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: zh_hans
  text: 但船已经离陆地有许多斯他丢[a][b]远，被浪涛冲击[c]，因为风逆着吹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离岸”或“距岸边”。原文为“离陆地”。
    reason: lexical_alternative
  - marker: b
    text: “斯他丢”是古代长度单位，一斯他丢约为185米。
    reason: cultural_note
  - marker: c
    text: 或译：“被浪猛烈颠簸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: 船
  rationale: 在加利利湖渡行的语境中，“船”是自然、稳妥的现代汉语表达，不夸大船只规模。
- source_word: ἤδη
  choice: 已经
  rationale: 准确表达事情发展到叙事此刻时已经形成的状态。
- source_word: σταδίους πολλοὺς
  choice: 许多斯他丢
  rationale: 保留原文的古代长度单位及“许多”的不确定数量，不擅自换算或泛化；具体单位说明置于脚注。
- source_word: ἀπὸ τῆς γῆς ἀπεῖχεν
  choice: 离岸
  rationale: γῆ字面为“陆地”，在水上航行语境中所指为岸边；“离岸”以自然汉语表达空间距离。
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: 被浪冲击
  rationale: βασανίζω在此描写船遭受波浪猛烈作用；“被浪冲击”既保留受动结构和强烈感，又避免采用通常指有生命者痛苦的“折磨”。
- source_word: ἐναντίος ὁ ἄνεμος
  choice: 风迎面而来
  rationale: 表达风与船前进方向相逆的情形；原文未明说对象，中文也不必补出“它”。
- source_word: δὲ
  choice: 但
  rationale: 体现由耶稣在岸上的场景转向船只困境时的轻微转折。
- source_word: γάρ
  choice: 因为
  rationale: 清楚表达逆风是船受浪冲击的原因。
