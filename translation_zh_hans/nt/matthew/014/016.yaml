  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“他们不用离开；你们给他们一些吃的吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 在门徒建议遣散众人之后，δὲ表示轻微转折；“却”自然呈现耶稣回应与门徒方案之间的对照。
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: 他们不用离开
  rationale: 自然表达“他们没有离开的必要”，既保留χρεία所表示的必要性，也符合现代汉语习惯。
- source_word: δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: 你们给他们吃的吧
  rationale: “给他们吃的”自然传达δίδωμι加φαγεῖν的结构；明确译出“你们”，承载原文独立人称代词ὑμεῖς的强调。
- source_word: δότε
  choice: 给……吧
  rationale: 以祈使表达耶稣的命令；句末“吧”使现代汉语口吻自然，并不取消其命令性质。
theological_decisions:
- issue: 耶稣命令中对门徒责任的强调
  choice: 明确译作“你们给他们吃的吧”
  alternative: “给他们吃的吧”或“你们自己给他们吃的吧”
  rationale: 原文显式使用ὑμεῖς，强调行动者是门徒。“你们”在此语境中已有自然焦点；不加“自己”，避免在汉语中产生超过原文的反身或排他意味。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。“吃的”比“食物”更贴近日常直接引语；全句简洁有力，符合叙事场景。
