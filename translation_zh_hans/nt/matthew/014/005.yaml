  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: zh_hans
  text: 他虽想杀掉约翰，却害怕众人，因为他们把约翰看作先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: 虽想
  rationale: 分词本身表示“想、愿意”，结合主句“却害怕”在语境中形成让步关系；“虽想……却……”既自然，也清楚表达两者张力。
- source_word: ἀποκτεῖναι
  choice: 杀掉
  rationale: 直接表达“杀死、处死”，不额外加入“谋杀”所带的道德定性。
- source_word: ἐφοβήθη
  choice: 害怕
  rationale: 准确表达 φοβέομαι 的含义，符合现代汉语叙事。
- source_word: τὸν ὄχλον
  choice: 众人
  rationale: 指聚集的人群；“众人”在圣经叙事语体中自然、庄重，也比“群众”更适合此处。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出希律害怕众人的原因。
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: 他们把约翰看作先知
  rationale: ἔχω 与宾语及 ὡς 引导的表语结构在此表示“视为、看作”；“看作先知”自然准确，不暗示仅仅相似。
theological_decisions:
- issue: 希腊文以代词指称希律和约翰，汉语中连续使用“他”可能造成歧义
  choice: 在两处宾语位置明确译为“约翰”，主语仍用“他”承接上文
  alternative: 他虽想杀掉他，却害怕众人，因为他们把他看作先知。
  rationale: 希腊文的代词所指由上下文明确，但现代汉语若照搬会使施事者与受事者难以分辨。补出“约翰”不改变所指，只为消除汉语表达中的歧义。
- issue: θέλων 与主句之间的逻辑关系
  choice: 采用让步式“虽想……却……”
  alternative: 他想杀掉约翰，又害怕众人
  rationale: 分词形式未明标让步连词，但上下文显示杀约翰的意愿受到对众人的惧怕所制约。译出让步关系保留了叙事中的张力，而没有改变事件内容。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“杀掉”直接自然；“众人”和“先知”保持圣经语境所需的正式感。为避免汉语代词歧义，按上下文补明“约翰”。
