source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: zh_hans
  text: 可是，门徒看见他在海面上行走，就惊慌不已，说：“是个幽灵[a]！”他们因害怕而喊叫起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幻影”或“显现物”。
    reason: 保留φάντασμα可指幽灵般显现或幻影的词义范围；正文“幽灵”表达门徒在恐惧中的判断，并非叙述者对其本体的断言。
lexical_decisions:
- source_word: δὲ
  choice: 可是
  rationale: 表示叙事推进中的轻微转折，突出门徒所见与随后的惊恐反应。
- source_word: οἱ μαθηταὶ ἰδόντες αὐτόν
  choice: 门徒看见他
  rationale: 将不定过去时分词自然译为汉语时间关系；定冠词所指的群体在上下文中已明确。
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: 在海面上行走
  rationale: ἐπί加属格在此表示在海的表面或范围上；“海面上”既贴近原文，又符合现代汉语表达。
- source_word: ἐταράχθησαν
  choice: 惊慌不已
  rationale: ταράσσω在此表示受到强烈扰乱和惊吓；结合后文喊叫，译文保留其强度而不夸大为特定生理反应。
- source_word: λέγοντες
  choice: 说
  rationale: 引出门徒同时发出的判断和惊呼，现代汉语无需保留分词形式。
- source_word: Φάντασμά ἐστιν
  choice: 是鬼影！
  rationale: φάντασμα指幽灵般的显现或幻影；“鬼影”适合惊恐语境，也避免把门徒的误认写成叙述者对灵体本质的断言。
- source_word: ἀπὸ τοῦ φόβου
  choice: 因害怕
  rationale: ἀπό在此表达原因或来源；“因害怕”简明自然。
- source_word: ἔκραξαν
  choice: 喊叫起来
  rationale: κράζω表示大声呼喊；“喊叫起来”既传达声音强度，也与惊恐语境相称。
theological_decisions:
- issue: 门徒所说φάντασμα的性质
  choice: 正文译作“鬼影”
  alternative: “幽灵”或“幻影”
  rationale: 本节记载的是门徒在恐惧中的误认，并非叙述者对灵体是否存在或其本质所作的教义判断。“鬼影”保留这种感知性和不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惊慌不已”传达强烈扰动，“喊叫起来”体现突发的大声反应。脚注标记紧接其实际所解释的“鬼影”，而不是置于“海面上”之后。
