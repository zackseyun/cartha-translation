  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: zh_hans
  text: 他们恳求耶稣，只要让他们摸一摸他衣裳的边[a]；凡摸着的人，都痊愈了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣裳的边缘”或“衣裳的穗子”。原文这个词可指衣服的边或边饰，也可能包括穗子。
    reason: lexical_alternative
  - marker: b
    text: 或译“都好了”。原文这个动词也可表示“获救”或“被保全”，但这里的上下文指身体得到医治。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: 恳求
  rationale: 未完成时可表达持续或反复的请求；“恳求”既体现迫切，也符合现代汉语叙事语体。
- source_word: ἵνα μόνον ἅψωνται
  choice: 只让他们摸一摸
  rationale: ἵνα加虚拟式说明所求的内容，μόνον强调仅仅触摸即可；“摸一摸”自然表达短暂接触。
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: 他衣裳的边
  rationale: κράσπεδον可指衣服的边、边缘或穗子；ἱμάτιον泛指衣裳或外衣。“衣裳的边”不把可能的穗子含义定得过死，并以脚注保留词义范围。
- source_word: ὅσοι ἥψαντο
  choice: 凡摸着的
  rationale: ὅσοι具有“所有……的人”的概括、分配意味；汉语“凡……的”简洁保留这一含义，所摸的对象可由上文自然补足。
- source_word: διεσώθησαν
  choice: 都痊愈了
  rationale: διασῴζω可表示救出、保全或使恢复健康；本段语境明确涉及身体疾病，“痊愈”准确自然，同时用脚注保留该词更宽的语义。
theological_decisions:
- issue: 医治神迹语境中διεσώθησαν的含义
  choice: 身体得到医治（“痊愈了”）
  alternative: 得救了／获救了／恢复了健康
  rationale: 该动词本身可有获救、被保全等更广含义，但紧邻语境谈的是病人求触摸耶稣衣裳并恢复健康。正文采用“痊愈”避免无根据地将救恩论含义强加于此，脚注则保留原词的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“衣裳”比“袍子”涵盖面更广；分号保留原句前后请求与结果之间的紧密关系。所有脚注标记均置于正文相应词语之后。
