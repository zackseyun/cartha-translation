  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: zh_hans
  text: 他便说：“来！”于是，彼得从船上下去，在水面上行走，向耶稣走去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向耶稣走去”也可译作“来到耶稣那里”。希腊文πρός突出朝着耶稣所在方向移动，本分句不一定明确表示已经到达。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: 来！
  rationale: 这是ἔρχομαι的不定过去时命令式，表达直接、简洁的召唤；“来！”自然保留了命令的力度，不添加原文没有的成分。
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: 从船上下去
  rationale: καταβὰς表示“下去”或“下来”；结合ἀπὸ τοῦ πλοίου，译为“从船上下去”既保留动作次序，也符合现代汉语叙事表达。
- source_word: πλοίου
  choice: 船
  rationale: πλοῖον可指船只；在加利利湖的叙事背景中，现代汉语用“船”准确而自然，无须具体化为大型船舶。
- source_word: περιεπάτησεν
  choice: 行走
  rationale: περιπατέω在此直接指步行；“行走”用语自然庄重，也不额外加入“开始”等原文未明确表达的体貌含义。
- source_word: ἐπὶ τὰ ὕδατα
  choice: 在水面上
  rationale: ἐπί加宾格在此描写越过或立足于水面的移动；汉语“在水面上”清楚表达这一行动，并比直译复数“众水之上”更自然。
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: 向耶稣走去
  rationale: ἦλθεν与πρός共同表达朝耶稣所在方向移动。“向耶稣走去”保留方向性，不武断断定彼得在本分句中已经到达。
- source_word: δὲ
  choice: 便
  rationale: δὲ在这里是轻微的叙事连接词；“便”承接上文自然，不强化为明显的转折。
theological_decisions:
- issue: 彼得朝耶稣移动是否明说已经到达
  choice: 向耶稣走去
  alternative: 来到耶稣那里
  rationale: πρός明确表示朝向耶稣，也可以在语境中理解为到他那里；正文保留方向性，避免把动作终点说得比本分句更明确，并以脚注说明另一种合理译法。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他”保留希腊文ὁ δὲ的代词式承接，不在本节内重复补出姓名；“来！”保持耶稣命令的简明有力。脚注标记紧随其所解释的短语。
