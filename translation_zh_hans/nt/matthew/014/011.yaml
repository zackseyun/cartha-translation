  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: zh_hans
  text: 他的头被放在盘子[a]上，端来交给那女孩；她就把它带给自己的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“托盘”或“碟子”。希腊语πίναξ指盛放或端送食物的盘子或托盘。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: 被……端来
  rationale: 这是φέρω的不定过去时被动式。结合头被放在盛物器皿上的场景，“端来”比泛指的“带来”更自然，同时保留被动意义。
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: 他的头
  rationale: 直接对应原文，不用委婉说法弱化叙事的直白程度。
- source_word: ἐπὶ πίνακι
  choice: 放在盘子上
  rationale: πίναξ指用于盛放或端送物品的盘、托盘或碟。“盘子”是普通现代汉语中自然且涵盖面适当的表达；用脚注保留器皿形制上的词义范围。
- source_word: ἐδόθη
  choice: 交给了
  rationale: 这是δίδωμι的不定过去时被动式。“交给了”自然表达物品被递交给某人的动作；与前面的被动结构共同保留原文的事件顺序。
- source_word: τῷ κορασίῳ
  choice: 那女孩
  rationale: κοράσιον指女孩或年轻女子。“女孩”清楚自然；“少女”虽可用，但可能额外突出年龄阶段。定指词“那”承接上文已出现的人物。
- source_word: ἤνεγκεν
  choice: 又把头拿给
  rationale: 这是φέρω的不定过去时主动式。“拿给”符合现代汉语叙事习惯；重述“头”可避免代词所指含混，也保持原文行动对象的清楚。
- source_word: τῇ μητρὶ αὐτῆς
  choice: 她母亲
  rationale: 直接表达与格短语，所属关系明确指女孩的母亲。
