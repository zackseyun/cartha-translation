  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: zh_hans
  text: 王虽然忧愁，但因自己所起的誓和同席的人[a]，还是下令把所求的给她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“与他一同斜倚席间的人”；斜倚用餐是当时宴席上的惯常姿势。
    reason: cultural_note
  - marker: b
    text: 原文只说“下令给予”，没有明说所给予的是什么，也没有在这一句中明说给谁；这里按上文补译为“把所求的给她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: 虽然忧愁
  rationale: 该不定过去时被动分词表示王感到忧愁；结合上下文，其与随后下令的行动形成让步关系，故译为“虽然忧愁”。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: βασιλεύς直指君王；“王”简洁、庄重，也符合本段对希律的叙事称呼。
- source_word: διὰ τοὺς ὅρκους
  choice: 因自己所起的誓
  rationale: διά加宾格表示原因；ὅρκους为复数“誓言”，上下文表明是王本人所起的誓，因此补出“自己”。
- source_word: τοὺς συνανακειμένους
  choice: 同席的人
  rationale: 该词指与他一同斜倚席间用餐的人；“同席的人”自然简明，保留共同赴宴的社会场景，具体姿势另以脚注说明。
- source_word: ἐκέλευσεν
  choice: 下令
  rationale: κελεύω表示命令或吩咐；“下令”符合王的身份和叙事语体。
- source_word: δοθῆναι
  choice: 把所求的给她
  rationale: 被动不定式本义为“被给予”，受事在希腊文中省略，由前文的请求补足。中文若直译为“给出”不够自然，因此以“所求的”承接上文，并按语境补出接受者“她”，同时用脚注交代原文的省略。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同席的人”避免把古代用餐姿势硬译进正文；“把所求的给她”使中文通顺，同时以脚注保留希腊文宾语及接受者均隐含的特点。
