id: MAT.14.15
reference: Matthew 14:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: zh_hans
  text: 天晚了，门徒来到耶稣跟前，说：“这里荒无人烟[a]，时候已经晚了[b]。请让众人散去，好叫他们到各村庄去，给自己买些食物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是个荒僻的地方。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“时辰已经过去了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: 天晚了
  rationale: 这是表示时间转换的属格独立结构；“天晚了”符合现代汉语叙事习惯。δέ在此推动叙事发展，无须另加“现在”。
- source_word: προσῆλθον αὐτῷ
  choice: 来到耶稣跟前
  rationale: προσέρχομαι意为“来到、走近”。上下文中的αὐτῷ指耶稣，汉语明确说出姓名可避免代词指向含混。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词指上下文中已知的门徒群体；汉语无需补出“他的”。
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: 这里荒无人烟
  rationale: ἔρημος在此强调地点无人居住、远离聚落，并非特指沙漠；“这里荒无人烟”自然地传达这一处境。
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: 时候已经晚了
  rationale: 字面为“时辰已经过去”，在语境中表示天色已晚；此译保留时间含义，同时符合现代汉语表达。
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: 请让众人散去
  rationale: ἀπολύω在这里指遣散、让人离去。祈使语气在汉语直接引语中用“请让”自然表达门徒对耶稣的请求。
- source_word: ἵνα ἀπελθόντες
  choice: 好叫他们……去
  rationale: ἵνα引出目的，ἀπελθόντες表示先离开再去购买；汉语用目的结构自然整合这一动作次序。
- source_word: εἰς τὰς κώμας
  choice: 到各村庄去
  rationale: κώμη指村庄；复数冠词结构在此自然译作“各村庄”，不增添原文未明说的“附近”。
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: 给自己买些食物
  rationale: βρώματα泛指食物，ἑαυτοῖς保留为“给自己”；“些”符合汉语不定量表达，并未规定具体数量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“荒无人烟”避免把ἔρημος误解为特定的沙漠地貌；“众人”比“群众”更适合圣经叙事语体。依据希腊原文重新安置脚注标记，使其分别对应“荒无人烟”和“时候已经晚了”。
