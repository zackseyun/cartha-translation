  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: zh_hans
  text: 他们渡过去以后，到了革尼撒勒的陆地上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们渡过去以后，来到革尼撒勒的陆地上。”希腊原文把“到陆地上”和“进入革尼撒勒”连在一起，表达他们抵达革尼撒勒地区的陆地或岸边；“上岸”是按上下文作出的自然表达。
    reason: 词义与句法存在可保留的译法差异
lexical_decisions:
- source_word: διαπεράσαντες
  choice: 渡过去以后
  rationale: 不定过去时主动分词表示先于主句动作发生的行动；结合乘船过湖的上下文，“渡过去以后”自然保留了横渡之意，又不额外明说交通方式。
- source_word: ἦλθον
  choice: 到了
  rationale: ἔρχομαι 的不定过去时；现代汉语以“到了”表达抵达目的地，比逐字译作“来了”更符合此处叙事视角。
- source_word: ἐπὶ τὴν γῆν
  choice: 陆地上
  rationale: 较直接地保留“到……地上”的空间意象，并在水路航行的语境中明确是从水面抵达陆地；正文与“到了”搭配，使汉语通顺。
- source_word: εἰς Γεννησαρέτ
  choice: 革尼撒勒一带
  rationale: εἰς 表示趋向目的地；此处与“到陆地上”的介词短语叠加，指抵达革尼撒勒地区的陆地。“一带”自然表达地区含义，同时避免把它过度限定为某一座城。
- source_word: Γεννησαρέτ
  choice: 革尼撒勒
  rationale: 采用中文圣经传统中通行、易识别的地名音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“革尼撒勒一带的陆地上”较贴近原文两个目的地表达的结合；脚注交代更自然的“上岸”译法及原文结构。
