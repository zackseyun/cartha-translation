  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: zh_hans
  text: 耶稣立刻伸出手来，抓住他，对他说：“你这信心小的人，为什么会疑惑[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“动摇”。希腊语动词也可表示迟疑或摇摆不定，并不只表示内心怀疑。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达动作随即发生，并保留叙事的紧迫感。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接或转折连接词；现代汉语按动作顺序自然衔接即可，无须生硬增添“但”或“于是”。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸手
  rationale: 以自然简洁的现代汉语保留伸出手的具体动作。
- source_word: ἐπελάβετο αὐτοῦ
  choice: 抓住他
  rationale: 表达动词“抓住、握住”的核心含义，既具体，也不额外推断动作方式。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 希腊文使用历史现在时；汉语叙事中用“说”自然流畅，也不必用时态形式刻意再现。
- source_word: Ὀλιγόπιστε
  choice: 你这小信的人哪
  rationale: 保留直接呼语及“信心小”的含义，不夸大为完全没有信心。
- source_word: εἰς τί
  choice: 为什么
  rationale: 是此语境中自然、准确的现代汉语问法。
- source_word: ἐδίστασας
  choice: 疑惑
  rationale: 该动词可指怀疑、迟疑或动摇；正文采用清楚常见的“疑惑”，并用脚注保留“动摇”这一词义可能。
theological_decisions:
- issue: Ὀλιγόπιστε 与 πίστις（信）的关系
  choice: 你这小信的人哪
  alternative: 你这信心小的人哪
  rationale: 将责备指向信心不足，而不是勇气不足或全然不信；同时保留原文简短而直接的呼语语气。
- issue: ἐδίστασας 所表达的彼得状态
  choice: 疑惑
  alternative: 动摇
  rationale: 原词兼有怀疑、迟疑和摇摆之意；正文不把它强化为彻底不信，脚注保留其语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“立刻—伸手—抓住”保留原文紧凑的动作次序；呼语“你这小信的人哪”略带郑重色彩，以体现耶稣直接而不夸大的责备。
