  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: zh_hans
  text: 他遣散众人后，就独自上山去祷告。到了晚上，他独自一人在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας
  choice: 遣散……后
  rationale: 不定过去时分词表示先于主句动作发生的行动；“遣散”自然表达让聚集的人群离开。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 指聚集的群众；“众人”符合现代汉语叙事习惯，虽未形式保留希腊语复数，但语义清楚。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 上山
  rationale: 简洁自然地表达向山上移动，不额外限定到山顶或山中某一地点。
- source_word: κατ’ ἰδίαν
  choice: 独自
  rationale: 此处表示离开他人、独自一人；与末句 μόνος 的重复对应原文对孤独状态的强调。
- source_word: προσεύξασθαι
  choice: 祷告
  rationale: 目的不定式，与“上山”连用，译为“上山祷告”即可自然表达目的。
- source_word: ὀψίας δὲ γενομένης
  choice: 到了晚上
  rationale: 以自然的时间状语表达属格独立结构所标明的时间推进。
- source_word: μόνος ἦν ἐκεῖ
  choice: 他独自一人还在那里
  rationale: “独自一人”保留 μόνος 的强调；“还”在汉语中自然呈现到了晚上仍处于那里的语境，但不改变核心命题。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“独自”与“独自一人”的重复有意保留原文 κατ’ ἰδίαν 与 μόνος 的呼应。未沿用英文脚注，因为其脚注标记位置与所解释短语不一致，且“独自”在中文正文中已能直接传达该词义，无需另注。
