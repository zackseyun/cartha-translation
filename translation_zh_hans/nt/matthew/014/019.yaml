  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: zh_hans
  text: 他吩咐众人坐在草地上，拿起那五个饼和两条鱼，举目望天，祝福[a]；掰开饼后，把饼递给门徒，门徒再递给众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“称颂上帝”或“作了祝福祷告”。希腊原文只说“祝福”，没有明说受词。
    reason: 保留 εὐλόγησεν 未明示受词所产生的真实歧义。
lexical_decisions:
- source_word: κελεύσας
  choice: 吩咐
  rationale: 表达带有权威的指示；结合不定过去时分词，在汉语中按叙事先后自然展开。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 自然表达聚集的人群；虽未机械保留希腊语复数形式，仍准确传达此处所指。
- source_word: ἀνακλιθῆναι
  choice: 坐
  rationale: 原词可指用餐时斜倚；现代汉语叙事中“坐在草地上”自然易懂，又符合此处预备用餐的场景。
- source_word: ἐπὶ τοῦ χόρτου
  choice: 在草地上
  rationale: 准确表达地点，不增添马可叙事中的“青草”等细节。
- source_word: λαβὼν
  choice: 拿起
  rationale: 将分词自然转为汉语连续动作，保留先拿起、后望天祝福的顺序。
- source_word: τοὺς πέντε ἄρτους
  choice: 那五个饼
  rationale: “饼”是现代中文圣经语境中对当时面饼的简洁自然表达；“那”对应希腊语定冠词并指向已知食物。
- source_word: τοὺς δύο ἰχθύας
  choice: 两条鱼
  rationale: 采用现代汉语中鱼的常用量词。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 举目望天
  rationale: 简洁庄重地表达向上观看、朝向天的动作。
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: 希腊语未明说受词，因此中文也不补出“饼和鱼”或“上帝”，保留原文歧义。
- source_word: κλάσας
  choice: 然后掰开饼
  rationale: “掰开”符合分饼动作；补明“饼”承接后文明确受词 τοὺς ἄρτους，并让中文清楚。
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: 递给门徒
  rationale: “递给”自然表现耶稣把掰开的饼交给门徒；宾语由前面的“饼”清楚承接。
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: 门徒又递给众人
  rationale: 希腊语省略重复动词，中文补出“递给”以确保清楚；“又”体现传递的下一环节。
theological_decisions:
- issue: εὐλόγησεν（祝福）的受词
  choice: 正文仅译“祝福”，不补明受词
  alternative: 译作“为这些食物祝福”，或“称颂上帝／作了祝福祷告”
  rationale: 希腊原文没有明示受词，既可能理解为对食物祝福，也可能是犹太用餐语境中称颂上帝。中文允许不带明示受词，因而可直接保留这一神学与语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以较短的连续动词呈现原文动作顺序；分号清楚区分耶稣交给门徒与门徒分给众人的两个环节。
