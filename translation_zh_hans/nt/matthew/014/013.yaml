  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: zh_hans
  text: 耶稣听见这事后，就从那里乘船，独自前往一处僻静的地方[a]。众人听说后，就从各城镇[b]步行跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荒僻的地方”或“无人居住的地方”。希腊文指偏僻或少有人居住之处，不一定是沙漠。
    reason: lexical_alternative
  - marker: b
    text: 或译“各城”。希腊文在不同语境中可指城镇或城市。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: 听见这事后
  rationale: 将不定过去时分词按时间关系译出；δέ在此主要推进叙事，不必另加表示强烈转折的词。“这事”由上文所述消息补足。
- source_word: ἀνεχώρησεν
  choice: 退到
  rationale: 保留ἀναχωρέω所含离开、退往别处的意味，同时不把行为动机具体解释为避难、哀悼或祷告。
- source_word: ἐν πλοίῳ
  choice: 乘船
  rationale: 自然地表达以船为交通方式。
- source_word: εἰς ἔρημον τόπον
  choice: 到一处僻静的地方
  rationale: ἔρημος在此侧重偏僻、少有人居住，并不必然指沙漠；“僻静的地方”在现代汉语中自然且不过度限定地貌。
- source_word: κατ’ ἰδίαν
  choice: 独自待着
  rationale: 表达私下、与人群分开的意思；与“僻静的地方”连用时语意清楚。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 现代汉语通常以“众人”自然表达复数群众，避免较陈旧的“群众们”或“众多的人群”。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟随他
  rationale: 直接表达实际跟在耶稣后面而行，不额外赋予门徒身份等神学含义。
- source_word: πεζῇ
  choice: 步行
  rationale: 准确表达徒步、经陆路行进，与耶稣乘船形成对照。
- source_word: ἀπὸ τῶν πόλεων
  choice: 从各城镇
  rationale: πόλις可指城市或城镇；“城镇”适合加利利地区的叙事场景，也保留聚居地规模未完全确定的空间。
theological_decisions:
- issue: 耶稣退去的动机
  choice: 仅叙述他听见消息后退到僻静处独自待着
  alternative: 明确说他是为避险、哀悼或祷告而退去
  rationale: 经文交代了先后关系与行动，却没有明说动机；译文不替叙事补定一种解释。
- issue: 群众“跟随”的性质
  choice: 按实际行程译为“跟随他”
  alternative: 把群众描写成已作出门徒式的属灵跟随
  rationale: 本节语境首先描述众人徒步追随耶稣的行动，不应在译文中加入未明说的信仰承诺。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”显出耶稣欲独处与众人随后而来之间的叙事转折；整体保持简洁，不使用教派性术语。
