  text: And he sent and beheaded John in the prison[a].
translation:
  language: zh_hans
  text: 他派人到监牢里去，把约翰斩首了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作：“他派遣了人后，在监牢里把约翰斩首了。”原文以不定过去时分词“派遣”引出主要动词“斩首”；正文用“派人……去”自然表达这一先后关系及受派者执行行动的含义。
    reason: 说明原文的分词结构及动作次序
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上文并推进叙事；在现代汉语中比直译为“并且”自然，同时不额外强化因果关系。
- source_word: πέμψας
  choice: 派人去
  rationale: 这是 πέμπω 的不定过去时分词，表示先派出人员，随后执行主要动作。“派人去”自然地保留了行动经由受派者实施的含义。
- source_word: ἀπεκεφάλισεν
  choice: 斩了……的头
  rationale: ἀποκεφαλίζω 专指斩首。希腊文在语法上仍把此事归于主语，却未明说“下令”，因此不增译为“下令斩首”；与“派人去”连用，也避免暗示希律亲自动手。
- source_word: τὸν Ἰωάννην
  choice: 约翰
  rationale: 原文只用专名，人物身份已由上下文说明，不扩写为“施洗约翰”。
- source_word: ἐν τῇ φυλακῇ
  choice: 在监牢里
  rationale: φυλακή 在此指关押人的具体场所；“监牢”准确、自然，也保留了地点意义。
