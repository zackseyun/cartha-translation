  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: zh_hans
  text: 因此，他就起誓答应她，无论她求什么，都给她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她将来求什么。”希腊原文采用不定关系从句（ὃ ἐὰν αἰτήσηται），表示请求的内容尚未确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 承接上文，表达由先前情形引出的结果；“因此”既保留推论、结果意味，也符合庄重自然的现代汉语。
- source_word: μετὰ ὅρκου
  choice: 起誓
  rationale: 原文直译为“带着誓言”，说明承诺由誓言加以保证；汉语用“起誓答应”自然准确。
- source_word: ὡμολόγησεν
  choice: 答应
  rationale: 此处指作出明确承诺，而非“承认”或“宣认”；与后面的“给她”搭配时，“答应”最符合现代汉语叙事表达。
- source_word: αὐτῇ
  choice: 她
  rationale: 作间接宾语，指上文的女孩；在“答应她”中自然呈现。
- source_word: δοῦναι
  choice: 给她
  rationale: 不定式说明承诺的内容；汉语把受事代词补在“给”后，语义清楚且不增加原文信息。
- source_word: ὃ ἐὰν αἰτήσηται
  choice: 无论她求什么
  rationale: 关系代词配合ἐάν和虚拟语气，构成不定关系从句，表示内容尚未确定的将来请求；“无论她求什么”保留其开放范围与条件意味。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“起誓答应”避免生硬直译“带着誓言承诺”；“无论她求什么”准确传达开放性的将来请求。脚注标记已置于正文。
