  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: zh_hans
  text: 夜里第四更时[b]，耶稣在海面上行走[a]，来到他们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在海上行走。”也有人把这个短语理解为“沿着海边行走”，但上下文强烈支持在水面上行走的意思。
    reason: alternative_reading
  - marker: b
    text: “第四更”是夜里的最后一更；按当时罗马人的分更制度，大约是凌晨三点至六点。
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: 夜里四更天的时候
  rationale: 该与格短语表示时间。“四更天”保留古代夜间分更的背景，同时符合现代汉语叙事习惯；脚注说明其大致时段。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词。汉语按上下文顺接更自然，无须机械译作“而”或“于是”。
- source_word: ἦλθεν πρὸς αὐτούς
  choice: 来到他们那里
  rationale: ἔρχομαι与πρός加宾格共同表达朝向他们而来；“来到他们那里”自然保留这一移动方向。
- source_word: περιπατῶν
  choice: 行走
  rationale: 现在分词表示与主句动作同时发生；采用“在海面上行走，来到……”体现其伴随情形。
- source_word: ἐπὶ τὴν θάλασσαν
  choice: 在海面上
  rationale: ἐπί加宾格与περιπατέω结合，在本语境中指在水面上移动。“海”保留θάλασσα的词汇表达，“海面上”则使现代汉语含义清楚。
theological_decisions:
- issue: 耶稣在水面上行走这一神迹性描述
  choice: 在海面上行走
  alternative: 沿着海边行走
  rationale: 结合句法和上下文，该短语强烈指向在水面上的移动，而非沿岸行走。正文保留原文的神迹性陈述，不加弱化，也不作超出原文的发挥。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“四更天”保留历史文化色彩，并以脚注解释；“海面上”清楚传达原文在水上行走之意。所有脚注标记均置于正文相关成分之后。
