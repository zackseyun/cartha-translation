base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: zh_hans
  text: 吃的人约有五千名男子[a]，不包括妇女和孩子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：未计算妇女和孩子。
    reason: 保留χωρὶς在计数语境中“排除在统计之外”的可选现代汉语表达，并对应英文审校轨迹脚注。
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: 吃的人
  rationale: 带冠词的现在分词在此作名词用，指吃了这顿饭的人；译为“吃的人”自然简洁，不额外强化时态或体。δέ仅有轻微的叙事承接作用，中文无需机械译出。
- source_word: ἦσαν
  choice: 有
  rationale: 这里是表示人数的系词结构；现代汉语用“有”来陈述人数最自然。
- source_word: ἄνδρες
  choice: 男人
  rationale: ἀνήρ在这里特指男性，而非泛指所有人；下文又明确另提妇女和孩子，因此保留性别区分。
- source_word: ὡσεὶ
  choice: 约
  rationale: 表示近似数量；“约”简洁、庄重，并准确传达估数语气。
- source_word: πεντακισχίλιοι
  choice: 五千
  rationale: 直接译出基数。
- source_word: χωρὶς
  choice: 不包括
  rationale: χωρίς加属格在此表明妇女和孩子未计入前述五千人的数目；“不包括”在现代汉语中比“此外”更明确。
- source_word: γυναικῶν
  choice: 妇女
  rationale: 此处没有婚姻关系含义，应译为女性群体；“妇女”也与计数语境相称。
- source_word: παιδίων
  choice: 孩子
  rationale: 自然传达παιδίον的复数含义，不无根据地限定为婴幼儿。
theological_decisions:
- issue: 混合人群中的性别特定计数用语
  choice: 将ἄνδρες译为“男人”，并保留妇女和孩子未计入五千之意。
  alternative: 将ἄνδρες泛化为“人”或“众人”。
  rationale: 希腊文明确以男性为计数对象，又另列妇女和孩子。泛译为“人”会抹去原文的性别区分及其历史语境。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“吃的人约有五千男人”保留原文先提参与者、再说明人数的结构；“不包括”明确说明妇女和孩子不在五千的统计之内。
