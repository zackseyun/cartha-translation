id: MAT.14.33
reference: Matthew 14:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: zh_hans
  text: 船上的人就敬拜他[a]，说：“你真是上帝的儿子[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他下拜”“俯伏在他面前表示敬意”。希腊语动词可指以跪下或俯伏表达尊崇；这里的上下文支持译作“敬拜”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“上帝之子”。希腊语中“上帝”前没有冠词，但这里的短语在上下文中用作称号，并非仅指“上帝的一个儿子”。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐν τῷ πλοίῳ
  choice: 船上的人就
  rationale: οἱ 指船内的人；δέ 是轻微的叙事连接词。译作“就”自然承接前文，又不强化为明显转折。ἐν τῷ πλοίῳ 按现代汉语习惯译为“船上的”。
- source_word: προσεκύνησαν αὐτῷ
  choice: 敬拜他
  rationale: προσκυνέω 可指俯伏、致敬或敬拜。此处紧接耶稣显出制伏风浪的权柄，并伴随“上帝的儿子”这一宣认，因此正文采用“敬拜”，脚注保留动作性和礼敬性的其他可能表达。
- source_word: λέγοντες
  choice: 说
  rationale: 希腊语分词引出敬拜时所说的话；现代汉语用并列谓语“说”最自然，无须机械保留分词形式。
- source_word: Ἀληθῶς
  choice: 真
  rationale: Ἀληθῶς 表示郑重确认。放在“是”前译作“真是”，简洁自然，也保留宣认的力度。
- source_word: θεοῦ υἱὸς
  choice: 上帝的儿子
  rationale: 该无冠词短语在此谓语结构和马太叙事语境中具有称号性及确定性，不宜译成“上帝的一个儿子”。汉语“上帝的儿子”既自然，也无需借助冠词表达其称号功能。
- source_word: εἶ
  choice: 你……是
  rationale: 按汉语直接引语的正常语序明确译出第二人称系词关系。
theological_decisions:
- issue: προσκυνέω 用于耶稣时的语义力度
  choice: 敬拜他
  alternative: 向他下拜；俯伏在他面前表示敬意
  rationale: 该动词本身兼有身体俯伏、致敬和敬拜等语义。此处神迹后的宣认使“敬拜”最符合上下文，但脚注保留词语所包含的动作及礼敬层面，避免把词义范围隐藏起来。
- issue: θεοῦ υἱὸς 的确定性与称号功能
  choice: 上帝的儿子
  alternative: 上帝之子；上帝的一个儿子
  rationale: 希腊语“上帝”前虽无冠词，却不因此成为不定表达；在这一宣认语境中，短语具有称号性。译作“上帝的一个儿子”会不当地削弱原文的力度；“上帝之子”则是可行但较书面的同义表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“就”顺接前文，“真是”保留宣认语气；正文避免古奥的“之子”，但在脚注列为可行的较书面表达。
