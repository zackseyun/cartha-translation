  source_fidelity: 译文准确传达了οἱ δὲ ἐν τῷ πλοίῳ、προσεκύνησαν αὐτῷ、λέγοντες及引语的内容。“船上的人就”在汉语叙事中自然地对应“船里的人／在船上的人”及轻微连接词δέ；“真是”充分表达Ἀληθῶς的郑重确认。“上帝的儿子”在此处自然表达具有称号性质的θεοῦ υἱός，未误作不定的“一个儿子”。
