id: MAT.14.3
reference: Matthew 14:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: zh_hans
  text: 原来，希律曾逮捕约翰，把他捆绑起来，关进监牢，因为希罗底的缘故；她是希律兄弟腓力的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 原来
  rationale: 承接上文，表达解释缘由的作用；现代汉语中“原来”比生硬的“因为”更适合在句首引出背景说明。
- source_word: κρατήσας
  choice: 曾逮捕
  rationale: 该不定过去时分词表示先于主要动作发生的拘捕；“逮捕”符合随后捆绑、监禁的司法拘押语境，“曾”体现背景性的先行动作。
- source_word: ἔδησεν αὐτὸν
  choice: 把他捆绑起来
  rationale: 保留δέω的具体动作含义，同时不擅自限定为用锁链捆绑。
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: 关进监牢
  rationale: 自然表达将约翰置于监禁状态的含义，也保留φυλακή在此处所指的监牢。
- source_word: διὰ Ἡρῳδιάδα
  choice: 因为希罗底的缘故
  rationale: διά加宾格在此表示原因；这一译法清楚、自然，又未额外说明具体原因。
- source_word: τὴν γυναῖκα
  choice: 妻子
  rationale: 在与腓力构成的所属关系中，γυνή明确指妻子，而非泛指女人。
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: 希律兄弟腓力的
  rationale: 将希腊文同位关系自然转化为现代汉语领属结构，明确腓力是希律的兄弟。
theological_decisions:
- issue: 如何表述希罗底与腓力的关系
  choice: 她是希律兄弟腓力的妻子
  alternative: 她是他兄弟腓力的妻子
  rationale: 按本节原文中性陈述其婚姻关系，不提前加入下一节关于这段关系不合律法的评价；补出“希律”可避免汉语代词指向含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“原来”引出对上文的背景解释；用分号分隔原因说明与身份补充，避免末尾多层领属造成理解困难。原文在本节没有必须以脚注保留的实质性歧义，因此不设脚注。
