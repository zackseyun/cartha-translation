id: MAT.14.30
reference: Matthew 14:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: zh_hans
  text: 可是，他看见风势很强[a]，就害怕起来；他开始往下沉，便喊道：“主啊，救我[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风势猛烈”。
    reason: lexical_alternative
  - marker: b
    text: 或译“搭救我”。这里的希腊语动词既可指脱离眼前的危险，也可用于更广泛的拯救。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: 看见
  rationale: 现在时分词表示与随后害怕的反应同时发生的感知；“看见”自然保留了因看见风势而害怕的叙事联系。
- source_word: δὲ
  choice: 可是
  rationale: 这里标志叙事转折，与彼得先前在水上行走形成对照；“可是”符合现代汉语叙事。
- source_word: ἄνεμον ἰσχυρόν
  choice: 风势很强
  rationale: ἰσχυρός直接修饰“风”；“风势很强”在汉语中比“看见强风”更自然，同时保留风力强劲之意。
- source_word: ἐφοβήθη
  choice: 就害怕起来
  rationale: 此处不定过去时表达恐惧的发生；“害怕起来”体现由不怕转为害怕。
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: 开始往下沉
  rationale: 准确表达下沉过程刚刚开始，避免译成“淹死”而过度陈述结果。
- source_word: ἔκραξεν λέγων
  choice: 便喊道
  rationale: 以自然汉语浓缩分词结构，同时保留呼喊的急迫和响亮程度。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在对耶稣的直接称呼中通常译为“主”；呼格语气以“啊”自然表达。
- source_word: σῶσόν με
  choice: 救我
  rationale: 不定过去时命令式表达紧迫请求；“救我”既适合眼前的生命危险，也保留σῴζω较广的拯救语义。
theological_decisions:
- issue: 对耶稣的直接称呼κύριος
  choice: 主啊
  alternative: 老师啊／主人啊
  rationale: “主”保留该称呼在马太福音中的基督论分量，又不额外规定彼得此刻对耶稣身份的理解程度。
- issue: 在眼前危险中翻译σῴζω
  choice: 救我
  alternative: 搭救我
  rationale: 上下文首先指从下沉的危险中获救；“救”同时保留该动词可用于更广泛拯救意义的语义张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“可是”呈现明显转折；“便喊道”避免机械保留希腊语“呼喊说”的重复结构。两个脚注标记均置于所说明的词语之后。
