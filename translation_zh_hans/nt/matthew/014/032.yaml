  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: zh_hans
  text: 他们上了船[a]，风就停了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“他们上到船里以后”。
    reason: 保留ἀναβάντων αὐτῶν与εἰς的字面空间方向及属格独立结构的时间含义。
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: καί承接叙事；结合后面的时间结构，译作“就”自然地表达事件相继发生，又不额外说明因果。
- source_word: ἀναβάντων αὐτῶν
  choice: 他们上了
  rationale: 属格独立结构表示时间背景。ἀναβαίνω本义为“上去”，与“船”搭配时，现代汉语自然说“上了船”；脚注保留较为直译的时间表达。
- source_word: εἰς τὸ πλοῖον
  choice: 船
  rationale: πλοῖον在本段指加利利海上的船只；“船”准确、自然，不必用可能显得过大的“轮船”或较书面的“舟”。
- source_word: ἐκόπασεν
  choice: 停了
  rationale: κοπάζω表示风止息、平息。这里以简洁的“停了”对应不定过去时所叙述的完整事件，不加入渐渐平静的过程含义。
- source_word: ὁ ἄνεμος
  choice: 风
  rationale: 直接对应有冠词的主语；汉语在语境明确时无需另加指示语。
theological_decisions:
- issue: 耶稣对自然权柄的叙事含义
  choice: 只按原文陈述他们上船后风停了，不在正文中增添神迹或权柄的解释。
  alternative: 在译文中明确说风因耶稣的权柄而止息。
  rationale: 上下文能够显明事件的神学意义，但本节原文本身没有明说因果关系；译文应保留这种叙事上的含蓄。
translation_notes:
  register: 采用自然、简洁、庄重的现代标准汉语。“他们上了船”符合普通读者的日常表达；“风就停了”保持原句直接有力的叙事节奏。
