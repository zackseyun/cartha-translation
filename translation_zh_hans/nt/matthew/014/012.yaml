source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: zh_hans
  text: 他的门徒前来，带走尸身，把他安葬了；随后，他们来到耶稣那里，把这事报告给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: 前来
  rationale: 该不定过去时分词引出门徒在约翰死后采取的行动。“前来”自然表达朝事发地点而来的意思，又不把动作过度具体化为“走近”。
- source_word: μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 保留原文代词的表达及“门徒”的学习、跟随关系；按紧邻上下文，“他”指施洗约翰。
- source_word: ἦραν
  choice: 带走
  rationale: αἴρω可指拿起、带走；在安葬语境中，“带走”自然地表达门徒将遗体移去安葬，同时不增添原文没有说明的方式。
- source_word: πτῶμα
  choice: 尸身
  rationale: πτῶμα明确指死者的身体。“尸身”既准确表明已经死亡，又比“尸体”略显庄重，适合叙事语体。
- source_word: ἔθαψαν αὐτόν
  choice: 把他安葬了
  rationale: θάπτω意为埋葬、安葬。“安葬”直接准确，也不加入坟墓形制等原文未提及的细节；宾语阳性代词按人称译为“他”。
- source_word: ἐλθόντες
  choice: 随后，他们去
  rationale: 该分词表示接续发生的移动行动。汉语用“随后……去”自然呈现动作顺序，避免生硬直译为“来到以后”。
- source_word: ἀπήγγειλαν
  choice: 把这事告诉了
  rationale: ἀπαγγέλλω表示报告、告知；原文未明说报告内容，汉语以“这事”承接上下文，保持内容由语境补足。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代简体中文圣经及一般中文中通行的人名译法。
theological_decisions:
- issue: “他的门徒”所指身份
  choice: 正文保留“他的门徒”，上下文所指为施洗约翰的门徒
  alternative: 明确译作“约翰的门徒”；或理解为耶稣的门徒
  rationale: 紧邻上下文叙述施洗约翰被杀及其遗体，因此αὐτοῦ最自然地回指约翰。正文保留原文代词，既忠实于措辞，也不消除语法表面上的指代形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尸身”准确传达πτῶμα为死者身体的含义，无须另设词义脚注；分号体现安葬与随后报告之间的叙事推进。
