base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: zh_hans
  text: 他们却对他说：“我们这里只有五个饼和两条鱼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们却
  rationale: 定冠词作代词，承接上文的门徒；δέ表示与耶稣先前吩咐之间的轻微转折，用“却”自然传达。
- source_word: λέγουσιν αὐτῷ
  choice: 对他说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事通常无须用形态标示过去时，“说”即可自然承载语境中的过去事件。
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: 我们这里只有
  rationale: 否定句加εἰ μή构成排除表达，整体意为“这里除了……以外没有”；汉语用“这里只有……”简洁自然，并保留资源仅限于所列食物的语义。
- source_word: πέντε ἄρτους
  choice: 五个饼
  rationale: ἄρτος在此指可计数的饼；“五个饼”符合现代汉语习惯，也避免把具体形状过度限定为“面包条”等。
- source_word: δύο ἰχθύας
  choice: 两条鱼
  rationale: ἰχθύς意为鱼；汉语以量词“条”搭配鱼，表达自然。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事用语。“我们这里只有……”比逐字译作“我们在这里没有，除非……”更符合现代汉语，同时准确传达否定加例外结构。
