  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: zh_hans
  text: 众人都吃了，并且吃饱了。他们又把剩下的碎块[a]收拾起来，装满了十二个篮子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“零碎”。原文指掰开或断开后剩下的碎块。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: 吃了
  rationale: 不定过去时直陈语气在叙事中表示已经发生的动作，现代汉语自然译为“吃了”。
- source_word: πάντες
  choice: 众人都
  rationale: 保留原文涵盖全体的范围，并按现代汉语习惯明确群体主语。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: 该动词在此表示充分进食而饱足；“吃饱了”自然、准确，也不额外增添神学解释。
- source_word: ἦραν
  choice: 收拾起来
  rationale: αἴρω本义为拿起、提起；在收集剩余食物的语境中，“收拾起来”符合现代汉语表达。
- source_word: τὸ περισσεῦον
  choice: 剩下的
  rationale: 该实词化分词指多出来、剩余之物；与后面的“碎块”合译为“剩下的碎块”。
- source_word: τῶν κλασμάτων
  choice: 碎块
  rationale: κλάσμα指掰开或断开后形成的块，语境中是餐后剩余的零碎食物；“碎块”既保留其具体形象，也不把所指限定得过窄。
- source_word: δώδεκα
  choice: 十二
  rationale: 直接保留原文数目。
- source_word: κοφίνους
  choice: 篮子
  rationale: κόφινος指盛物的篮筐；“篮子”是自然且不过度具体化的现代汉语对应词。
- source_word: πλήρεις
  choice: 装满了
  rationale: 原文表示十二个篮子是满的；结合汉语句法译成“装满了十二篮子”，清楚表达收集结果。
theological_decisions:
- issue: 神迹喂饱众人的结果以普通饱足用语表达
  choice: 吃饱了
  alternative: 得了饱足／饱足了
  rationale: 原文陈述所有人充分进食的结果，并未附加解释性的神学措辞；“吃饱了”保留这一直白含义和完全供应的效果。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“众人都……而且……”保留原文两个并列结果；后句按汉语习惯将“十二个满篮子”表达为“装满了十二篮子”。脚注标记置于实际存在词义选择的“碎块”之后。
