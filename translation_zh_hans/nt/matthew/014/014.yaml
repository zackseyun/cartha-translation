source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: zh_hans
  text: 耶稣上了岸[a]，看见一大群人，就怜悯他们，治好了他们中间患病的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“出来”或“出去”；按上下文，可能是指从船上来到岸上。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 上了岸
  rationale: 该词本义是“出来、出去”；结合前文耶稣乘船来到此处的叙事语境，译作“上了岸”自然明确。脚注保留较直译的可能。
- source_word: εἶδεν
  choice: 看见
  rationale: 直接表达ὁράω不定过去时在此处的普通视觉含义。
- source_word: πολὺν ὄχλον
  choice: 一大群人
  rationale: 既表达πολύς的数量意味，也以现代汉语自然地呈现ὄχλος所指的人群。
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: 怜悯他们
  rationale: σπλαγχνίζομαι表示发自内心的深切怜悯；“怜悯他们”简洁庄重，并保留这种情感和行动动机。
- source_word: ἐθεράπευσεν
  choice: 治好了
  rationale: θεραπεύω在本语境指医治疾病；“治好了”清楚表达医治的实际结果。
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: 他们中间患病的人
  rationale: 希腊文是形容词名词化，指属于或处在人群中的病患；如此翻译比“他们的病人”更符合现代汉语，也不误导为所有权关系。
theological_decisions:
- issue: 耶稣怜悯的表达
  choice: 怜悯他们
  alternative: 对他们动了怜悯的心
  rationale: 正文采用简洁、自然的表达，不削弱σπλαγχνίζομαι所含的深切情感，也不额外强化其程度；脚注列出较具象的传统表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“耶稣”明示希腊文省略的主语，承接上下文并避免汉语指代含混；用“就”自然呈现看见群众与怜悯、医治之间的叙事推进。
