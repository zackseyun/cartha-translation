id: MAT.14.6
reference: Matthew 14:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: zh_hans
  text: 但到了希律庆祝生日的时候[a]，希罗底的女儿在众人中间[b]跳舞，使希律高兴，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“希律生日到了的时候”，或“在希律的生日宴会上”。希腊文所指的是希律庆祝生日这一场合。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在中间”。这里很可能是指她在聚集的众人中间跳舞。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: 到了希律庆祝生日的时候
  rationale: γενέσια指生日或生日庆祝活动，与γενομένοις共同构成时间背景。此译既保留“到了……时候”的时间表达，也显明这里所指的是庆祝生日这一场合，而不只是一年中的日期。
- source_word: δὲ
  choice: 但
  rationale: δὲ在这里推进叙事，同时承接上文带出轻微转折；“但”简洁自然。
- source_word: ὠρχήσατο
  choice: 跳舞
  rationale: ὀρχέομαι在此直接表示跳舞；无需增添舞蹈的性质或形式。
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: 希罗底的女儿
  rationale: 忠实表达属格关系，不引入经文本身未给出的女儿姓名。
- source_word: ἐν τῷ μέσῳ
  choice: 在众人中间
  rationale: 原义是“在中间”；结合宴席场景，“在众人中间”自然表达她处于聚集者当中，同时以脚注保留较为字面的译法。
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: 使希律高兴
  rationale: ἀρέσκω加与格表示使某人喜悦或满意。“使希律高兴”准确、自然，也不额外推断希律所喜悦的具体层面。
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: 希律
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“庆祝生日的时候”清楚交代事件场景；“在众人中间”避免生硬，同时用脚注保留原文较为简略的空间表达。句末逗号承接下一节未完的叙事结构。
