  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: zh_hans
  text: 因为约翰一直对他说：“你娶她是不合律法的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可以娶她。”
    reason: 词义备选：ἔξεστιν既可突出“合乎律法”，也可较一般地表达“获准、可以”。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 一直对……说
  rationale: 未完成时在这里表达过去持续或反复的言说；“一直……说”既保留其延续性，也符合现代汉语习惯。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ为上文说明原因和背景；“因为”清楚保留其解释性连接作用。
- source_word: αὐτῷ ὁ Ἰωάννης
  choice: 约翰一直对他说
  rationale: 保留说话者“约翰”和间接宾语“对他”，并按自然汉语语序重组。
- source_word: Οὐκ ἔξεστίν σοι
  choice: 你……是不合律法的
  rationale: ἔξεστιν表示是否获准、是否合乎律法；“不合律法”保留这句责备的法律—道德力度，又不笼统弱化为“不对”。
- source_word: ἔχειν αὐτήν
  choice: 娶她
  rationale: 在本段婚姻关系的语境中，ἔχειν指以她为妻；直译“拥有她”在现代汉语中生硬且容易产生错误含义，“娶她”自然传达其语境义。
theological_decisions:
- issue: 约翰责备的性质
  choice: 译为“不合律法”，表达明确的律法性和道德性禁止。
  alternative: 译为“不可以”或“不对”。
  rationale: 原文ἔξεστιν关注准许与合法性；“不合律法”保留其尖锐力度，但不在正文中进一步指定所依据的具体律例。
- issue: ἔχειν αὐτήν所指的关系
  choice: 按婚姻语境译为“娶她”。
  alternative: 较形式化地译为“拥有她”或“留她在身边”。
  rationale: 上下文明确涉及希律与希罗底的婚姻关系；“娶她”表达原文在此处的惯用意义，同时避免现代汉语“拥有她”所带来的物化或泛指占有之义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一直”体现未完成时的持续或反复意味；“不合律法”保留原文的法律—道德张力。
