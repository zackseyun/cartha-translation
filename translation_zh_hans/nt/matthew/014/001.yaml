base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: zh_hans
  text: 那时，分封王希律听见了关于耶稣的消息，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于耶稣的报道”。
    reason: 词义备选；ἀκοή可指所听到的报告、消息或报道。
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: 那时
  rationale: 这是惯用的时间标记；“那时”简洁自然，准确表达原文的时间意义。
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 按动词 ἀκούω 的通常意义直译为“听见了”，不进一步解释为“得知”。
- source_word: Ἡρῴδης
  choice: 希律
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ τετραάρχης
  choice: 分封王
  rationale: 这是中文中对该罗马属地统治者职衔的通行译称，既保留历史身份，也比音译术语更易懂。
- source_word: τὴν ἀκοὴν
  choice: 传闻
  rationale: 此处 ἀκοή 指所听见的消息或传报，而非听觉能力；“传闻”适合上下文，同时保留信息经人传播的意味。
- source_word: Ἰησοῦ
  choice: 关于耶稣的
  rationale: 属格在此说明传闻的内容，用“关于耶稣的”符合现代汉语表达。
