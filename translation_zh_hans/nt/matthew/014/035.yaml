  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: zh_hans
  text: 那地方的男人认出他来，就往周围各地派出人去，把所有患病的人都带到他那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就派往周围各地”；希腊文没有明说所派的是人、消息或其他对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες αὐτόν
  choice: 认出他来
  rationale: ἐπιγινώσκω在这里指当地人辨认出耶稣，译为“认出”符合叙事语境，也比“认识”更准确。
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: 当地的人
  rationale: 原文ἀνήρ为阳性复数，但此处着重指当地居民中的人；现代汉语用“当地的人”自然，也不无根据地限定为成年男性。
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: 派人到周围整个地区去
  rationale: ἀποστέλλω意为“差派、派遣”，原文未明说宾语；汉语需补出受派者才能自然成句。“派人”保留行动含义，避免将其具体化为原文未明说的“传消息”。
- source_word: προσήνεγκαν αὐτῷ
  choice: 带到他那里
  rationale: προσφέρω在此指把人带到耶稣面前，而非献祭；此译自然清楚。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 所有患病的人
  rationale: κακῶς ἔχειν是表示身体不适或患病的惯用语；“患病的人”准确而庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留原句两个连续动作的结构；“派人”是为汉语通顺而补明原文隐含的受派对象，并未额外断定所传消息的具体内容。
