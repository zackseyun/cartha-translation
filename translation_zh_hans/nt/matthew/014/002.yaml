  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: zh_hans
  text: 他对自己的侍从说：“这是施洗者约翰。他已经从死人中被复活了；因此，这些大能[a]正在他身上发挥作用。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些神奇的能力”，也可按意思译作“这些神迹”。希腊文为“这些大能”（αἱ δυνάμεις），指在有力作为中彰显出来的超自然能力。
    reason: 词义存在可合理表达为能力本身或其神奇作为的差异，正文保留原文较宽的说法。
lexical_decisions:
- source_word: παισὶν
  choice: 侍从
  rationale: παῖς可指孩子、仆人或侍从；这里是希律对身边人员说话。“侍从”既符合宫廷语境，也不武断限定其具体官阶。
- source_word: ὁ βαπτιστής
  choice: 施洗者
  rationale: 这是约翰的称号，直指他为人施洗的身份；“施洗者约翰”在现代汉语中清楚、庄重。
- source_word: ἠγέρθη
  choice: 已经……复活了
  rationale: 原文是ἐγείρω的简单过去时被动式，表示约翰已从死亡中被唤起。汉语以“复活了”自然表达结果；“已经”凸显这一事件在希律看来已经发生，而不采用生硬的“被复活了”。
- source_word: ἀπὸ τῶν νεκρῶν
  choice: 从死人中
  rationale: 保留复数名词所表达的“从死者当中”之意，同时使用现代汉语可理解的简洁说法。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁表达原文的因果推论：希律把所听闻的大能归因于约翰从死人中复活。
- source_word: αἱ δυνάμεις
  choice: 这些大能
  rationale: δύναμις在此指超自然能力及其有力彰显。“大能”保留“能力”的名词概念，不直接把它收窄为作为结果的“神迹”；“这些”依据上下文指希律所听闻的那些作为。
- source_word: ἐνεργοῦσιν
  choice: 运行
  rationale: ἐνεργέω表示活跃并发挥效力。“运行”在此简洁表达这些大能正在产生作用。
- source_word: ἐν αὐτῷ
  choice: 在他身上
  rationale: 原文直译为“在他里面”。汉语“在他身上运行”更自然，并保留大能以他为作用所在的意思；译作“借着他”则会更明确地加入工具性的解释。
theological_decisions:
- issue: 约翰复活的性质
  choice: 他已经从死人中复活了
  alternative: 他已经从死人中被唤醒了
  rationale: 原文使用被动式，未把约翰描述为凭自己复活。正文用自然汉语表达复活的事实，同时不增添使其复活者是谁的说明；这句话仍是希律的判断，并非叙述者对其判断的认可。
- issue: δυνάμεις在此处的含义
  choice: 这些大能就在他身上运行
  alternative: 这些神奇的能力在他里面发挥作用／这些神迹由他行出来
  rationale: 该词很可能指彰显于神奇作为中的超自然能力。正文保留“能力”这一核心概念，不直接等同于作为结果的“神迹”，也不把ἐν解释性地改成“借着”。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“侍从”适合宫廷场景；“施洗者约翰”清楚呈现称号；“大能……在他身上运行”保留原文概念和一定陌生感，同时脚注说明其神迹语境。脚注标记置于实际所解释的“这些大能”之后。
