base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: zh_hans
  text: 善人从自己善的宝藏中拿出善的事物；恶人从自己恶的宝藏中拿出恶的事物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 上下文谈论人的言语，因此这里的“善的事物”和“恶的事物”尤其可能指善言和恶言；但原文没有明说“话”。
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: 善
  rationale: 以“善”同时修饰人及其所拿出的事物，保留希腊文重复用词和鲜明的道德对照。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处阳性单数作代表性、格言式用法；现代汉语用“人”自然准确，并不排除任何性别。
- source_word: θησαυροῦ
  choice: 宝藏
  rationale: 保留内在积存之物的比喻；“仓库”过于具体，“积存”则会削弱名词意象。
- source_word: ἐκβάλλει
  choice: 拿出
  rationale: 既体现从所积存之处向外取出的动态，又符合现代汉语表达；不采用力度过强的“抛出”。
- source_word: ἀγαθά
  choice: 善
  rationale: 希腊文为中性复数形容词名词化；汉语“善”可宽泛指善的事物、言语或行为，也与前面的“善”形成重复。
- source_word: πονηρὸς
  choice: 恶
  rationale: “恶”保留 πονηρός 较强的道德含义，并与“善”构成简洁、对称的对照。
- source_word: πονηρά
  choice: 恶
  rationale: 以名词化的“恶”表达宽泛的恶事，保留原文与 πονηρός 的词根重复及平行结构。
- source_word: ἐκ
  choice: 从……里
  rationale: 明确表达来源和由内向外的空间意象，与“拿出”搭配自然。
theological_decisions:
- issue: 格言中的内在品格与外在表现
  choice: 保留“善”与“恶”的宽泛所指，表达外在之物源自内在积存，却不限定为某一套后来的教义体系。
  alternative: 依据紧邻上下文，将所拿出的善恶明确译成善言和恶言。
  rationale: 上下文确实聚焦言语，但原文只用名词化形容词 ἀγαθά 和 πονηρά，并未明说“话”；因此正文保留其广度，以脚注指出言语层面的语境关联。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文两组“善/恶”的反复和平行句式。正文中的“人”已自然表达代表性个体，无需另设性别词汇脚注。
