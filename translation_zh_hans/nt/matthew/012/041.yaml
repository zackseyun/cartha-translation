  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: zh_hans
  text: 尼尼微人将在审判的时候和这世代一同起来，定这世代的罪，因为他们因约拿所传的信息而悔改了；看哪，这里有比约拿更大的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用中性表达，直译为“比约拿更大的”；也可译作“这里有一位比约拿更大的”。
    reason: 保留πλεῖον的语法形式及其可能既指耶稣本人、又强调其临在与事工之更大现实的含混。
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: 尼尼微人
  rationale: 原文明确用阳性复数名词ἄνδρες，指尼尼微的男子；但现代汉语“尼尼微人”在此最自然，也能按叙事语境指称这群人，若译作“尼尼微的男人”则显生硬。
- source_word: ἀναστήσονται
  choice: 起来
  rationale: 保留“起身、起来”的形象，也不排除末世复起的意味；结合“审判的时候”，语境足以表明其司法和末世背景。
- source_word: ἐν τῇ κρίσει
  choice: 在审判的时候
  rationale: κρίσις在这里指审判事件；“在审判的时候”是自然、清楚的现代汉语表达。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: 和这世代一同
  rationale: μετά加属格首先表示“与……同在、和……一起”；定罪的对立意味由后面的κατακρινοῦσιν表达，不把μετά本身译成“反对”。
- source_word: κατακρινοῦσιν αὐτήν
  choice: 定这世代的罪
  rationale: κατακρίνω意为宣告有罪、定罪；把代词的所指“这世代”明说出来，可避免汉语代词含混。
- source_word: μετενόησαν
  choice: 悔改了
  rationale: 在先知宣告的语境中，μετανοέω指悔改；“悔改”准确、通行，也保留其宗教和伦理分量。
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: 听了约拿的宣告就
  rationale: εἰς在此表达对约拿所宣告信息的回应；用“听了……就”自然呈现响应关系，κήρυγμα译为庄重而易懂的“宣告”。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意和加强语气的庄重话语标记，比口语化的“你看”更符合经文语体。
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: 这里有比约拿更大的
  rationale: πλεῖον是中性比较形式，原文没有明说“人”或“事”；汉语以“更大的”悬置中心词，既自然地指向耶稣及其临在的现实，也保留原文有意留下的含混。
theological_decisions:
- issue: πλεῖον Ἰωνᾶ如何表达耶稣的自指
  choice: 这里有比约拿更大的
  alternative: 这里有一位比约拿更大的人
  rationale: 原文采用中性比较形式πλεῖον，而非明确表示男性人物的形式。正文不补出“一位”或“人”，以保存它既可指耶稣本人、也可涵盖其身份与事工之更大现实的张力。
- issue: ἄνδρες的性别信息如何在汉语中表达
  choice: 尼尼微人
  alternative: 尼尼微的男人
  rationale: 原文确为阳性复数，但现代汉语若机械译作“男人”会产生不必要的口语色彩，并可能把焦点转向性别对比；“尼尼微人”是自然的群体称谓，不据此引入额外神学结论。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留原文的修辞强调；分号呈现从尼尼微人的悔改转向当前更大现实的对照。正文仅设一个脚注，标记[a]已在正文对应位置出现。
