id: MAT.12.19
reference: Matthew 12:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: zh_hans
  text: 他不争辩，也不喊叫；街上也没有人听见他的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街上”也可译作“广场上”。全句也可译作：“他不争斗，也不扬声；广场上也没有人听见他的声音。”
    reason: 说明ἐρίσει、κραυγάσει和πλατείαι的合理词义选择，并保留引文较形式化的译法。
lexical_decisions:
- source_word: ἐρίσει
  choice: 争辩
  rationale: ἐρίζω指参与争执、争论。“争辩”自然地表现仆人不与人争竞的举止，同时不把经文扩大为绝对不作任何抗争。
- source_word: κραυγάσει
  choice: 喊叫
  rationale: κραυγάζω指高声呼喊。“喊叫”保留公开高声发言的含义，并与“争辩”形成自然并列。
- source_word: ἀκούσει τις
  choice: 也没有人听见
  rationale: 希腊文在否定词οὐδὲ后用不定代词τις，汉语自然译作“也没有人听见”，保留累加否定的语气。
- source_word: ἐν ταῖς πλατείαις
  choice: 街上
  rationale: πλατεῖαι指宽阔的街道或公共通道；“街上”简洁自然，传达公开场所的背景。“广场上”亦有词义依据，列入脚注。
- source_word: τὴν φωνὴν αὐτοῦ
  choice: 他的声音
  rationale: φωνή在这里通常指人的声音；直译既清楚，又衔接“听见”。
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: 不……也不……；也没有……
  rationale: 以现代汉语的连续否定结构保留原文三重否定的累积力度。
theological_decisions:
- issue: 以赛亚仆人引文对弥赛亚举止的描写
  choice: 译文表现他不争竞、不以高声喧嚷来张扬自己。
  alternative: 较形式化地译为“不争斗，也不扬声”，以贴近传统引文措辞。
  rationale: 本句描写耶稣应验以赛亚书42:2时所显出的温和、不争竞姿态；译文不应由此推导出他从不公开讲话或绝对被动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争辩”“喊叫”避免古雅的“争竞”“扬声”成为正文，却在脚注中保留较形式对应的可能译法。
