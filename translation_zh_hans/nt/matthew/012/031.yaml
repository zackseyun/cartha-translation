  terminology: “罪”“亵渎”“赦免”均为恰当且一致的圣经汉语用语。“圣灵”是此处上下文所指的规范中文名称；脚注应保留本节仅作“灵”的原文措辞事实，避免遮蔽文本层面的细节。
