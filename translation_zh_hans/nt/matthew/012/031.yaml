  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: zh_hans
  text: 因此，我告诉你们：人所犯的一切罪和亵渎，都将得到赦免；但对圣灵[a]的亵渎，不会得到赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊原文只写“灵”，未写“圣”；但按上下文，所指的是圣灵。
    reason: 说明上下文所指，并保留本节原文未出现“圣”字这一措辞特点。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文并引出结论，既保留推论关系，也符合现代汉语表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然传达直接而郑重的告知语气。
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: 人所犯的一切罪和一切亵渎
  rationale: “一切”体现πᾶσα的周遍意义；补出“人所犯的”，使后面的与格τοῖς ἀνθρώποις及被动赦免关系在汉语中清楚自然。“亵渎”保留其针对神圣者的冒犯含义。
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: 都将得到赦免
  rationale: ἀφεθήσεται在此表示“被赦免”；借“人所犯的”将τοῖς ἀνθρώποις所指的蒙赦免者自然纳入汉语句式。
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: 但对那灵的亵渎
  rationale: 将属格理解为亵渎所针对的对象；“那灵”保留本节只有πνεύματος而没有ἁγίου这一措辞，同时借指示形式表达定冠词及上下文中特定的所指。
- source_word: οὐκ ἀφεθήσεται
  choice: 不会得到赦免
  rationale: 准确保留将来被动及与前句构成的鲜明对照。
theological_decisions:
- issue: πνεύματος在正文中译作“那灵”还是“圣灵”
  choice: 那灵
  alternative: 圣灵
  rationale: 本节希腊文只有“灵”，没有“圣”一词；上下文清楚表明所指是圣灵，但正文不直接补入原文未写出的限定语，并以脚注说明。
- issue: τοῦ πνεύματος的属格关系
  choice: 理解为对象属格，即“对那灵的亵渎”
  alternative: “那灵的亵渎”
  rationale: 上下文谈论人对神之灵的敌意言论，并非那灵自己发出的亵渎，因此明确译出对象关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“得到赦免”比生硬的“被赦免给人”自然；两句均保留“亵渎—赦免”的平行与对照。
