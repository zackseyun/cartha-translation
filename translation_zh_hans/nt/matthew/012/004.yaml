  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: zh_hans
  text: 他怎样进了上帝的殿，他们又吃了[a]陈设饼[b]；这饼按律法本不是他或与他同行的人可以吃的，只有祭司可以吃？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“他吃了”。
    reason: textual_variant
  - marker: b
    text: “陈设饼”直译为“陈设在面前的饼”，指摆在上帝面前、分别为圣的饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: 怎样
  rationale: 承接上文“你们没有读过吗”的问句，引出大卫事迹的具体内容；“怎样”自然保留原文的修辞问句形式。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 进了上帝的殿
  rationale: 忠实表达进入上帝圣所之意。“殿”在现代中文宗教语境中可指敬拜上帝的圣所，并不在译文中强行改写为会幕或圣殿。
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: 陈设饼
  rationale: 这是该礼仪用语在中文中的通行名称，指陈设在上帝面前的圣饼；用脚注补明其字面和礼仪含义。
- source_word: ἔφαγον
  choice: 他们……吃了
  rationale: 遵从所给SBLGNT正文的复数动词，明确译出复数主语；异文的单数读法另列脚注。
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: 按律法，这饼本来……他……都不可吃
  rationale: “按律法……不可”传达ἐξόν在此处涉及礼仪律例所许可之事，而非普通社会习惯；“这饼”承接关系代词所指的陈设饼。
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: 还是跟随他的人都不可吃
  rationale: 自然表达大卫同行者也被包括在禁令之内，不将其具体身份作超出原文的界定。
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: 只有祭司才可以吃
  rationale: 以现代中文的排他结构准确表达εἰ μὴ与μόνοις共同表示的例外和专属性。
theological_decisions:
- issue: ἐξόν的律法和礼仪效力
  choice: 译作“按律法……不可吃”
  alternative: 本来不许吃
  rationale: 原文讨论的是圣饼在祭司制度下的合法食用资格；此译法保留律法层面的力度，却不额外说明耶稣论证的神学结论。
- issue: ἔφαγον的主语数
  choice: 正文采用复数“他们……吃了”
  alternative: 单数“他吃了”
  rationale: 所给SBLGNT正文采用复数形式，故正文明确保留复数；单数异文影响叙事主语，列入脚注而不静默处理。
- issue: “上帝的殿”的历史所指
  choice: 保留概括性圣所称呼“上帝的殿”
  alternative: 上帝的会幕
  rationale: 原文只说“上帝的家／殿”，并未在本节明确使用“会幕”；不以历史背景替换原文措辞，以免消除其表达范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“他们又怎样”使希腊文复数动词在中文中清楚可见；分号帮助读者辨明随后关于食用资格的说明。用“上帝”译θεός，用“祭司”保留礼仪背景。
