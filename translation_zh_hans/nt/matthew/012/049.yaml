id: MAT.12.49
reference: Matthew 12:49
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: zh_hans
  text: 他向门徒伸出手来，说：“看哪[a]，我的母亲和我的兄弟[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们看”或“瞧”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“兄弟”，是阳性复数；这里不扩译为“兄弟姐妹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: 伸出
  rationale: 不定过去时分词表示与主句紧密相连的先行动作；译为“伸出”既保留具体姿态，也符合现代汉语叙事习惯。
- source_word: τὴν χεῖρα αὐτοῦ
  choice: 手
  rationale: χεῖρα在此通常指“手”；无需扩大译为“手臂”。汉语中不必另译物主代词，仍能明确是耶稣自己的手。
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: 向门徒
  rationale: ἐπί接宾格，在伸手这一语境中表示动作朝向；“向门徒”自然表达方向，又不额外断定耶稣是在用手指点他们。
- source_word: μαθητὰς
  choice: 门徒
  rationale: “门徒”准确保留福音书中老师与受教跟随者的关系，也是现代中文读者熟悉的称呼。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意并带有强调作用的提示语；“看哪”简洁、庄重，同时保留原文的突显语气。
- source_word: μήτηρ
  choice: 母亲
  rationale: 采用普通而庄重的亲属称谓，与原文直接对应。
- source_word: ἀδελφοί
  choice: 兄弟
  rationale: 原文为阳性复数，并与“母亲”一同构成具体的家庭称谓；译作“兄弟”保留其形式和修辞力度，不扩展为原文未明说的“兄弟姐妹”。
theological_decisions:
- issue: 耶稣重新界定亲属关系时的家庭称谓
  choice: 保留“母亲”和“兄弟”这两个具体称谓
  alternative: 概括译为“家人”，或把“兄弟”扩展为“兄弟姐妹”
  rationale: 本节借具体亲属称谓把门徒指认为耶稣真正的家人。概括或包容性扩译会削弱原文的修辞对应，并替文本消解其性别形式。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“向门徒伸出手来”避免生硬直译，也不把动作过度具体化为“指着”。引号内用“看哪”保留强调色彩；“兄弟”比传统教会语体中的“弟兄”更符合普通现代汉语，同时准确保留原文的男性复数形式。
