  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: zh_hans
  text: 因为凡遵行我那在天上的父亲的旨意的人，就是我的兄弟、姐妹和母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: 凡……的人
  rationale: 这一不定关系结构表达开放而普遍的条件；“凡……的人”自然地涵盖任何符合条件的人。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文的解释关系。
- source_word: ποιήσῃ τὸ θέλημα
  choice: 遵行……旨意
  rationale: “遵行旨意”是现代汉语中自然而庄重的搭配，表达实际照此行事，又不将含义缩减为单纯口头服从。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 我在天上的父
  rationale: 贴近原文的修饰结构，既保留“我的父”，也明确其“在天上”，避免改写为较概括的称号“天父”。
- source_word: αὐτός
  choice: 就是
  rationale: 原文代词带强调作用；汉语用判断句中的“就是”自然地突出：这样的人才是耶稣所说的家人。
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: 兄弟、姐妹和母亲
  rationale: 逐一保留原文列举的三个家庭身份，不笼统归并为“家人”。
- source_word: ἐστίν
  choice: 是
  rationale: 以现代汉语判断句对应原文现在时系词。
theological_decisions:
- issue: 阳性单数形式在普遍陈述中的所指范围
  choice: 正文用“凡……的人”表达泛指，并以脚注说明原文语法形式
  alternative: 用“他”直接对应原文阳性单数代词
  rationale: 希腊语的阳性单数在此具有泛指作用，并非只限男性。现代汉语若用“他”，容易被理解为男性限定；“凡……的人”保留普遍范围，而脚注交代原文形式。
- issue: 属灵亲属关系的个别称谓
  choice: 保留“兄弟、姐妹和母亲”三项并列
  alternative: 概括为“家人”
  rationale: 原文有意逐项列出这些身份；概括会削弱修辞力度，并遮蔽“姐妹”和“母亲”的明确出现。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我在天上的父”比“我的天父”更贴近原文结构；“兄弟、姐妹和母亲”保留原文略带张力的家庭称谓并列。
