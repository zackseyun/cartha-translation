  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: zh_hans
  text: 但法利赛人出去后，商议怎样除掉[a]耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”也可译作“杀死”或“置于死地”。希腊原文可指“毁灭、消灭”；在这里的语境中，可包含杀死的意图。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 出去
  rationale: 不定过去时分词在此表示先于主要动作发生的行动；汉语用连动结构“出去，商议”自然地保留事件次序。
- source_word: δὲ
  choice: 但
  rationale: δέ标示叙事转折，将法利赛人的敌对反应与上文耶稣的行动形成对照。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般读者熟悉的群体名称。
- source_word: συμβούλιον ἔλαβον
  choice: 商议
  rationale: 该习语直译为“采取商议”，意为共同谋划；“商议”既自然庄重，也不必在动词本身加入“密谋”所强调的隐秘色彩。
- source_word: κατ’ αὐτοῦ
  choice: 怎样除掉耶稣
  rationale: κατά在此具有敌对含义；中文将对象放入目的内容中，避免连续使用代词造成含混，同时清楚表达商议是针对耶稣。
- source_word: ὅπως
  choice: 怎样
  rationale: 引出商议的内容或目的，保留“如何达成”的筹划意味。
- source_word: ἀπολέσωσιν
  choice: 除掉
  rationale: ἀπόλλυμι可指毁灭、消灭，也可在语境中指杀死。“除掉”保留较宽的措辞，同时在本段敌对语境中能够传达致命意图。
theological_decisions:
- issue: ἀπολέσωσιν所表达的具体程度
  choice: 除掉
  alternative: 杀死／置于死地
  rationale: 上下文很可能指致命意图，但原词比明确表示“杀死”的动词范围更广。正文用“除掉”保留这一宽度，脚注说明语境中可明确理解为杀死。
- issue: συμβούλιον ἔλαβον是否译作“密谋”
  choice: 商议
  alternative: 密谋
  rationale: 敌意已由κατ’ αὐτοῦ及目的从句清楚表达；采用“商议”较贴近原习语，不额外断定其行动必然秘密进行。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“出去，商议怎样……”符合自然汉语语序；以“耶稣”替代连续代词，使单节独立阅读时对象清楚。
