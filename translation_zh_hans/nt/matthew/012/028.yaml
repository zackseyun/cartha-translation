  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: zh_hans
  text: 但我若是靠着上帝的灵[a]赶出鬼，那么上帝的国已经临到你们了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在上帝的灵里。”希腊语短语在这里可以表示所凭借的方式或施事者。
    reason: lexical_alternative
  - marker: b
    text: “临到”也可译作“来到你们这里”或“追上你们”。希腊语动词强调上帝的国已经到达他们那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若是
  rationale: 保留δέ所表达的轻微转折及εἰ引出的条件关系，符合本段论证语气。
- source_word: ἐν πνεύματι θεοῦ
  choice: 靠着上帝的灵
  rationale: ἐν加与格在此可表示凭借或施事；“靠着”自然地表达耶稣借上帝之灵赶鬼，同时以脚注保留“在……里”的可能译法。
- source_word: ἐγὼ
  choice: 我
  rationale: 希腊文显式使用第一人称代词，带有一定强调；汉语保留“我”，但不额外添加强调词，以免过度诠释。
- source_word: ἐκβάλλω
  choice: 赶出
  rationale: 准确表达将鬼逐出的动作，也是现代汉语中自然、清楚的圣经用语。
- source_word: τὰ δαιμόνια
  choice: 鬼
  rationale: “鬼”是普通现代读者熟悉且简洁的对应词；上下文明确指邪灵性存在，并非泛指人的亡灵。
- source_word: ἄρα
  choice: 那么
  rationale: 清楚标示由前述条件推导出的结论，适合汉语“若是……那么……”结构。
- source_word: ἔφθασεν
  choice: 已经临到
  rationale: φθάνω在此表示到达、达到；“已经临到”体现不定过去时所陈述的实际到达及其当前意义，而不弱化为仅仅临近。
- source_word: ἐφ’ ὑμᾶς
  choice: 临到你们
  rationale: 保留国度到达听众面前、作用于他们的鲜明表达；脚注说明也可理解为“来到你们这里”或“追上你们”。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是准确而通行的现代汉语表达，可同时容纳上帝掌权及其国度领域的含义，避免缩减为抽象的“统治”。
theological_decisions:
- issue: 上帝的国与耶稣赶鬼之间的关系
  choice: 将赶鬼呈现为上帝的国已经真实临到听众的证据
  alternative: 上帝的国只是临近，尚未到达；或这里只指未来终末的实现
  rationale: ἔφθασεν表达到达而不只是接近，本句论证也以耶稣当下的作为为上帝掌权已经介入的证据；译文不进一步否定其未来圆满，从而保留经文本身的张力。
- issue: “上帝的灵”的所指
  choice: 保留为“上帝的灵”，指向实施赶鬼的神圣施事者
  alternative: 将其意译为非位格性的“上帝的能力”
  rationale: πνεῦμα θεοῦ原文明确说“上帝的灵”；不把它改写成抽象能力，也不在正文加入原文未明说的进一步教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“但……若是……那么……”清楚呈现原句的转折、条件与推论。“靠着”避免文言化；“已经临到”保留国度到达的力度。所有脚注标记均置于正文相关词句之后。
