  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: zh_hans
  text: 但我告诉你们：人在审判的日子，要为所说的每一句轻率的话[a]作出交代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻率的”也可译为“闲话”或“无益的话”。希腊语形容词可指闲置、无效或无益。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: λέγω是现在时直陈语气，向听众直接陈述；δὲ在上下文中带有温和的转折意味，因此译作“但”。
- source_word: πᾶν ῥῆμα
  choice: 每一句……话
  rationale: πᾶν与单数名词连用，具有逐一涵盖的分配意义；ῥῆμα在这里指说出口的话。
- source_word: ἀργὸν
  choice: 轻率的
  rationale: ἀργός的基本含义包括闲置、不起作用、无益；用于受审判的话语时，“轻率的”自然传达说话者缺乏应有慎重的伦理意味，同时不把它窄化为恶意言语。脚注保留其他可能译法。
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: 人所说的
  rationale: οἱ ἄνθρωποι泛指人类，并非专指男性；中文“人所说的”简洁自然。希腊语将来时在这一普遍性警告中由后文“都要”体现，无须机械添加时间副词。
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: 都要为此作出交代
  rationale: ἀποδίδωμι与λόγος构成“交账、作出说明”的习语，περὶ αὐτοῦ明确指出交代所针对的就是那句话；“为此作出交代”既自然又保留问责含义。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 到审判的日子
  rationale: ἐν在此表达时间；κρίσις具有司法审断的意义。“审判的日子”准确且符合现代中文表达。
theological_decisions:
- issue: ἀργόν在审判语境中的道德力度
  choice: 译作“轻率的”，表达欠缺慎重、须为之负责的话语。
  alternative: 可译作“无益的”“闲散的”，也有传统译法“闲话”。
  rationale: 原词并不限定为恶毒、亵渎或虚假的言语，因此不应扩大其罪责类别；但审判语境也表明它不只是无关紧要的闲谈。“轻率”在两者之间保留了经文的警告力度。
- issue: οἱ ἄνθρωποι的泛指范围
  choice: 译作“人”，涵盖所有人。
  alternative: 若译作“男人”，会错误缩小所指范围。
  rationale: 希腊语此处泛指人类，中文应准确反映其普遍性。
- issue: 末日问责的对象
  choice: 保留“为此”，明确人须为每一句这样的话作出交代。
  alternative: 只译“都要作出交代”，中文虽通顺，却会弱化περὶ αὐτοῦ对具体话语的回指。
  rationale: 原文明确把受审问责与每一句话逐一关联，译文不应省略这一关系。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“作出交代”比“交账”更符合当代通用表达，同时保留审判场景中的问责意味；句式依照中文信息结构调整，但保留“每一句”所表达的逐一性。
