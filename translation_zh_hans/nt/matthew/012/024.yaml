id: MAT.12.24
reference: Matthew 12:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: zh_hans
  text: 法利赛人听见了，就说：“这个人赶鬼，无非是靠着鬼王别西卜[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别西卜”对应希腊文 Beelzebul；传统英语名称形式作 Beelzebub。
    reason: 说明传统名称异形。
lexical_decisions:
- source_word: δὲ
  choice: 就
  rationale: 本节与上文众人的正面反应形成语义对照；现代汉语借上下文及“就说”自然推进叙事，无须机械加入“但是”。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 将不定过去时分词自然处理为先于主句发生的动作；所听内容可由上文补足，汉语无需添加宾语。
- source_word: Οὗτος
  choice: 这个人
  rationale: 保留指示代词在敌对语境中的轻蔑语气，又不额外强化。
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: 赶鬼
  rationale: “赶鬼”是现代汉语中清楚、简洁且符合福音书语境的惯用表达。
- source_word: εἰ μὴ
  choice: 无非是
  rationale: 表达对方所断言的唯一凭借，符合此处排他结构，也自然传达指控语气。
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: 靠着……别西卜
  rationale: 此处ἐν表示手段或凭借；“靠着”比字面的“在……里面”更准确自然，同时不擅自补入“能力”。
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: 鬼王
  rationale: 凝练表达“众鬼的统治者”，是现代汉语易懂而庄重的称谓。
- source_word: Βεελζεβοὺλ
  choice: 别西卜
  rationale: 按希腊文Βεελζεβούλ的名称形式音译；传统名称异形另收入脚注。
theological_decisions:
- issue: 敌意指示语Οὗτος的表达
  choice: 这个人
  alternative: 他／这人
  rationale: “这个人”保留法利赛人谈论耶稣时可能带有的轻蔑意味，但不加入超出原文的评价。
- issue: ἐν Βεελζεβούλ所表达的关系
  choice: 靠着别西卜
  alternative: 奉别西卜／借别西卜的能力
  rationale: 将ἐν理解为手段或凭借，同时避免把原文没有明说的“能力”写入正文。
- issue: Βεελζεβούλ的名称形式
  choice: 别西卜
  alternative: 别西卜伯
  rationale: 正文依SBLGNT的希腊文名称形式Βεελζεβούλ；熟悉的传统异形保留在脚注中。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“赶鬼”和“鬼王”简洁易懂，并与福音书叙事语域相称；句式保留原文指控的直接与尖锐。
