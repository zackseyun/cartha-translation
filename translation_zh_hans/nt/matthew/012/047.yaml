  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: zh_hans
  text: 有人对他说[a]：“看，你母亲和你弟兄们正站在外面，想要跟你说话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有本节。
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: 有人对他说
  rationale: δέ在这里是轻微的叙事连接词，汉语不必机械译出；τις是不定代词，译作“有人”自然准确。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 保留引起注意的指示语气，同时避免使用较古雅的“看哪”。
- source_word: ἡ μήτηρ σου
  choice: 你母亲
  rationale: 按普通亲属称谓和第二人称领属关系直接翻译。
- source_word: οἱ ἀδελφοί σου
  choice: 你弟兄们
  rationale: ἀδελφοί在此指男性亲属；“弟兄们”保留原文的男性复数表达，也不进一步裁定其具体亲属关系。
- source_word: ἔξω ἑστήκασιν
  choice: 正站在外面
  rationale: ἵστημι的完成时表达已经站定而处于站立状态；“正站在外面”在现代汉语中自然，并明确保留ἔξω。
- source_word: ζητοῦντές
  choice: 想要
  rationale: 此处ζητέω结合说话目的，表达他们希望或设法与耶稣说话；“想要”比直译“寻求”更符合现代汉语叙事。
- source_word: σοι λαλῆσαι
  choice: 跟你说话
  rationale: 自然表达λαλέω加与格所指的交谈对象，语体现代而庄重。
theological_decisions:
- issue: 马太福音12:47的文本批判地位
  choice: 依所提供的SBLGNT正文收入本节，并用脚注说明异文
  alternative: 因一些抄本缺少本节而不收入正文
  rationale: 所给希腊文本收录此节，但以文本批判符号标示其存疑范围；正文翻译所给文本，同时以脚注透明保留重要抄本差异，不暗中裁定。
- issue: ἀδελφοί的亲属含义
  choice: 译作“弟兄们”，不在正文中进一步界定
  alternative: 译作“兄弟们”或按特定教义解释为堂表兄弟等亲属
  rationale: 原词在此明确为男性复数亲属称谓，但文本本身未说明年龄次序或更具体的亲属关系，因此保留其语义张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“看”保留现场指示感；省略δέ的显性对应，以免汉语出现不必要的生硬连接。脚注标记[a]已置于正文对应位置。
