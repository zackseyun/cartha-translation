  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: zh_hans
  text: 于是，他对那人说：“伸出你的手来。”他就伸出手来；那只手便复原[a]了，像另一只手一样健康[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复原”也可译作“治好了”；原文动词着重恢复到正常状态。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“像另一只一样健康”；“另一只”指那人的另一只手。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事次序；“于是”自然承接上文，并体现随即发生的动作。
- source_word: λέγει
  choice: 他说
  rationale: 原文为叙事性现在时；现代汉语叙事通常用“说”即可自然表达，不必机械标示现在时。
- source_word: τῷ ἀνθρώπῳ
  choice: 对那人
  rationale: 上下文指一名特定男子；“那人”准确、自然。
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: 伸出你的手来
  rationale: 保留直接命令和“手”的通常含义；句末“来”符合现代汉语口吻。
- source_word: ἐξέτεινεν
  choice: 那人一伸手
  rationale: 与命令中的“伸出”形成呼应；“一……就……”自然呈现动作与结果的紧密衔接。
- source_word: ἀπεκατεστάθη
  choice: 复原了
  rationale: 该被动动词强调恢复到原本正常的状态；“复原”比泛指的“治好”更贴近词义。
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: 像另一只手一样健康
  rationale: 阴性“另一”所省略的名词是“手”；汉语补出“手”可避免歧义，同时保留健康、完好的比较。
theological_decisions:
- issue: 医治结果的性质
  choice: 描述那只手恢复到健康状态
  alternative: 译作“治好了”或“完全好了”
  rationale: “复原”兼顾恢复之义和神迹事实，不加入经文未明说的进一步教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“于是”推进叙事，用“一……就……”表现命令得到执行后立即发生的结果；脚注合并说明“复原”的词义和“另一只”的所指。
