id: MAT.12.12
reference: Matthew 12:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: zh_hans
  text: 那么，人比羊贵重得多！所以，在安息日[a]行善是合乎律法的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在安息日（复数）”；复数形式可惯用地指安息日的遵守或安息日这类日子。
    reason: 说明原文数的形式及其惯用意义。
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: 那么……得多
  rationale: πόσῳ与比较意义连用，构成由小到大的强烈反问；“得多”表达“何等更甚”，“那么”保留οὖν承接上文所得出的推论。
- source_word: διαφέρει
  choice: 贵重
  rationale: 这里不是泛指人与羊“不同”，而是比较二者的价值；“贵重”准确传达人比羊更有价值的语境含义。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处为代表全人类的单数泛称，与一只羊相对；现代汉语用“人”自然涵盖任何人，不额外限定性别。
- source_word: προβάτου
  choice: 羊
  rationale: 该属格用于διαφέρει之后，标明比较对象；汉语“比羊”自然表达这一关系，无须补出量词。
- source_word: ὥστε
  choice: 所以
  rationale: 引出由人与羊价值之比较而得的结论，保留明确的推论关系。
- source_word: ἔξεστιν
  choice: 是合乎律法的
  rationale: 本段争论的是安息日行为是否符合律法，而不只是一般意义上的获准；此译法保留法律与伦理语境。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊文采用复数形式，但这是表示安息日惯常行为的常见说法；汉语用单数类称最自然，并以脚注说明原文形式。
- source_word: καλῶς ποιεῖν
  choice: 行善
  rationale: 简洁自然地表达“做有益、良善之事”，符合该希腊语短语在此处的意义。
theological_decisions:
- issue: ἄνθρωπος的泛称范围
  choice: 人
  alternative: 一个男人；一个人
  rationale: 经文论证关乎人的价值，不是比较成年男性与羊；“人”既忠实于泛称意义，也避免加入原文没有的性别限制。
- issue: 安息日复数形式的处理
  choice: 正文译作“在安息日”，脚注说明希腊文为复数
  alternative: 在各安息日；在安息日子里
  rationale: τοῖς σάββασιν虽为复数，却可惯用地指安息日的遵守或在安息日发生的行为。正文采用自然现代汉语，同时通过脚注保持原文形式的可核查性。
- issue: ἔξεστιν的律法语境
  choice: 是合乎律法的
  alternative: 是可以的；是被允许的
  rationale: 上下文是在回应安息日行为是否合法的问题；“合乎律法”不预先解决更广泛的安息日神学，只准确呈现本句结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么……得多”呈现反问和由小及大的论证力度；感叹号呼应原句的修辞强调。“合乎律法”贴合争议语境，比单说“可以”更准确。
