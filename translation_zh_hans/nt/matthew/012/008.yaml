  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: zh_hans
  text: 因为人子是安息日的主[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人子掌管安息日。”
    reason: lexical_alternative
  - marker: b
    text: “人子”是耶稣在福音书中常用的自称；也可较泛地理解为“人”，但这样会削弱它可能具有的称号意味。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 保留本句承接上文、说明理由的功能；现代汉语中“因为”自然清楚。
- source_word: κύριος
  choice: 主
  rationale: 既表达权柄，也保留该词在基督论语境中的神学分量；不将其弱化为一般的“主人”。
- source_word: τοῦ σαββάτου
  choice: 安息日的
  rationale: 按 κύριος 后接属格的结构译为“安息日的主”，简洁自然，并保留原文关系表达。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用福音书中耶稣这一典型自称的通行译法，保留其称号性质及可能的经文互文意味，而不泛化为“人”。
- source_word: ἐστιν
  choice: 是
  rationale: 直接译出现在时系词，无须增译。
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου 的基督论分量
  choice: 译为“人子是安息日的主”
  alternative: 人子掌管安息日
  rationale: “主”直接保留原文的强权柄称谓及神学张力；“掌管”虽说明含义，却将名词性称号改成了功能性表述。
- issue: ὁ υἱὸς τοῦ ἀνθρώπου 的称号性质
  choice: 译为“人子”
  alternative: 那人／人的儿子
  rationale: “人子”是中文圣经传统中已确立且仍可理解的福音书称号，能保留其可能关联《但以理书》7章的意味，不把它化约为泛指人类。
translation_notes:
  register: 采用现代、庄重而简明的标准普通话。“安息日的主”保留原文语序关系与传统表达；两处脚注标记均已置于正文。
