source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: zh_hans
  text: 耶稣知道他们的心思[a]，就对他们说：“凡一国内部彼此分裂，都必归于荒凉[b]；凡一城或一家[c]内部彼此分裂，都不能长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心思”也可译作“思想”“盘算”。
    reason: lexical_alternative
  - marker: b
    text: “归于荒凉”也可译作“荒废”或“遭到毁坏”。
    reason: lexical_alternative
  - marker: c
    text: “一家”也可指“一所房屋”或“家里的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 该词在这里表示心智上的知晓；“知道”自然准确，又不说明耶稣以何种方式得知。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ表示轻微转折或叙事承接；现代汉语在此省略连接词更自然，语境中的回应关系仍然清楚。
- source_word: τὰς ἐνθυμήσεις αὐτῶν
  choice: 他们的心思
  rationale: ἐνθύμησις可指思想、推想或内在盘算。“心思”涵盖内心所想，同时不把意义限死为明确意图。
- source_word: Πᾶσα βασιλεία
  choice: 凡一国
  rationale: πᾶσα与单数名词构成普遍性陈述；“凡一国”以简洁庄重的现代汉语表达这一原则。
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: 内部彼此分裂
  rationale: 该短语指一个共同体内部形成相互对立的分裂；“内部彼此分裂”避免汉语“自相分裂”可能只让人想到抽象主体自身。
- source_word: ἐρημοῦται
  choice: 必荒废
  rationale: 该动词表示变得荒凉、遭到毁坏。“荒废”保留荒凉败落的意象；“必”在汉语中自然体现该陈述的必然结果。
- source_word: πόλις ἢ οἰκία
  choice: 一城或一家
  rationale: πόλις译作“城”；οἰκία可指房屋，也可指家庭或家族单位，此处用“一家”保留一定语义宽度，并以脚注说明。
- source_word: οὐ σταθήσεται
  choice: 都不能长存
  rationale: 这里的“站立”是维持、存续的习语。“不能长存”清楚表达不能继续稳固存在，适合现代汉语。
theological_decisions:
- issue: 耶稣如何知道他们内心所想
  choice: 只译作“知道他们的心思”，不说明知识的来源或方式
  alternative: 明确译成耶稣以超自然方式洞悉，或凭观察推知
  rationale: 原文只陈述耶稣知道，并未说明是全知、先知性洞察还是处境中的辨识；译文保留这一开放性。
- issue: οἰκία在比喻中的所指
  choice: 正文译作“一家”，脚注保留“房屋／家里人”的可能性
  alternative: 仅译作“一所房屋”或仅译作“一个家庭”
  rationale: 该词既可指建筑物，也可指家庭或家户；上下文的国、城、家并列较可能涉及共同体，但不宜完全排除字面的房屋意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡一国……凡一城或一家……”保留格言式平行结构；以“内部彼此分裂”重复对应原文，以凸显内部对立。“不能长存”传达οὐ σταθήσεται的习语意义，而不拘泥于字面的“站立”。
