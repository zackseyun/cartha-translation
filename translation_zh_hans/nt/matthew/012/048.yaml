  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: zh_hans
  text: 他却回答那位对他说话的人[a]说：“谁是我的母亲？谁是我的弟兄？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“他却回答那位正对他说话的人说。”
    reason: 说明ἀποκριθεὶς εἶπεν所构成的“回答……说”表达，并保留λέγοντι的现在分词所呈现的进行意味。
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: 他却回答
  rationale: ἀποκριθεὶς与εἶπεν构成常见的“回答说”表达；现代汉语用“回答”即可自然传达其义，避免不必要的重复。“却”体现δέ所标示的回应转折。
- source_word: τῷ λέγοντι αὐτῷ
  choice: 那个对他说话的人
  rationale: λέγοντι是现在时主动分词的名词性用法，指当时正在对耶稣说话的人；此译保留动作的进行意味，而不将其缩窄为“告诉他的人”。
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: 谁是我的母亲
  rationale: 直译身份询问，保留原文简洁的反问形式。
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: 谁是我的弟兄
  rationale: 第二个疑问与前句平行；中文无需显式标出复数。ἀδελφοί在本段叙事情境中指耶稣家中的男性手足，故译为“弟兄”，不扩展为“弟兄姊妹”或“兄弟姐妹”。
theological_decisions:
- issue: 耶稣关于家庭身份的反问可能被解释性弱化
  choice: 保留原文直接的反问：“谁是我的母亲？谁是我的弟兄？”
  alternative: “谁才算是我的母亲？谁才算是我的弟兄？”
  rationale: 下文将说明耶稣所指的亲属关系，但本节本身没有“才算是”一类解释性措辞；直译可保留叙事推进及神学张力。
- issue: ἀδελφοί的性别与亲属范围
  choice: 弟兄
  alternative: 兄弟姐妹；手足
  rationale: 直接语境谈到耶稣的母亲和男性兄弟，原词也是阳性复数；因此不将范围扩展为男女兼指。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“回答”自然处理希腊语中“回答说”的惯用重叠；“弟兄”既保持圣经语体的端庄，也准确表达此处男性亲属。脚注标记[a]已置于正文对应位置。
