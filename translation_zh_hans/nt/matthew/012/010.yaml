  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: zh_hans
  text: 看哪，有一个人，他的一只手萎缩了。他们问他：“在安息日[a]医治人合乎律法吗？”为要控告他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“安息日”为复数；此处通常泛指安息日。
    reason: 说明原文的复数语法形式及其惯用含义。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、使叙事场景更鲜明的话语标记；“看哪”庄重而仍易懂。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处指一名具体的人；后文的身体状况足以明确其个体身份，无须增添原文没有的信息。
- source_word: χεῖρα ἔχων ξηράν
  choice: 一只手萎缩了
  rationale: 以自然的现代汉语表达这只手枯萎、失去正常功能的状态，同时避免把具体病理状况说得过死。
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: 他们问耶稣
  rationale: 汉语无需机械保留“问……说”的重复结构；将代词明确为“耶稣”，使指代清楚而不改变原意。
- source_word: ἔξεστι
  choice: 合乎律法吗
  rationale: 问题涉及安息日律法所许可的行为，“合乎律法”比一般性的“可以”更准确地体现法律—宗教语境。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊文为复数，但这里是泛指安息日；现代汉语名词本身通常不标明单复数，因此正文采用自然表达，并以脚注说明原文形式。
- source_word: θεραπεύειν
  choice: 治病
  rationale: 在此语境中指使病患得医治；“治病”是自然明确的现代汉语表达，又不预断医治的具体方式。
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: 为的是要控告他
  rationale: 保留ἵνα所表达的目的，并体现κατηγορέω带有敌对和指控意味的法律色彩。
theological_decisions:
- issue: 安息日争议中τοῖς σάββασιν的复数形式
  choice: 正文译作“在安息日”，脚注说明希腊文为复数
  alternative: 在各安息日／在安息日子里
  rationale: 希腊文复数可泛指安息日，而现代汉语“在安息日”同样可以泛指，若硬译复数反而生硬。脚注保留原文数的透明度，不把它解释成某一特定神学立场。
- issue: ἔξεστι的法律—宗教含义
  choice: 合乎律法吗
  alternative: 可以吗／获准吗
  rationale: 争论焦点是安息日律法是否许可医治；“合乎律法”忠实保留这一张力，而不先行判断提问者或耶稣对律法的解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留叙事中的提示和现场感；其余句式避免过度文言化。“一只手萎缩了”既便于普通读者理解，也不把原文所描述的病症限定为某种现代医学诊断。
