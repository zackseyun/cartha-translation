  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: zh_hans
  text: 我若靠别西布勒[a]赶鬼，你们的儿子[b]又靠谁赶鬼呢？正因如此，他们将成为你们的审判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“别西布勒”（Beelzebul）；传统译名常作“别西卜”（Beelzebub）。
    reason: 说明希腊文本所用名称形式及常见传统异名。
  - marker: b
    text: 原文直译“你们的儿子”；这里也可能指你们中间的人或你们的门徒。
    reason: 保留亲属称谓，同时提示其在本语境中可能具有群体或师徒层面的含义。
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: 靠别西布勒
  rationale: 这里的ἐν表示凭借的力量或手段，用“靠”比机械地译作“在……里面”更符合现代汉语；人名按所给希腊文本Βεελζεβούλ音译为“别西布勒”。
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: 赶鬼
  rationale: ἐκβάλλω在驱魔语境中指把鬼逐出；“赶鬼”简洁自然，并保留逐出的含义。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: 你们的儿子
  rationale: 保留υἱοί的字面亲属称谓，不在正文中预先判定它是指亲生儿子、同群体成员还是门徒；以脚注说明语境中的可能范围。
- source_word: ἐν τίνι
  choice: 靠谁
  rationale: 与前一个ἐν平行，表示所凭借的个人性力量或权柄，因此译为“靠谁”。
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 明确表达由前述反问推出结论的因果和推论力量。
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: 他们将成为审判你们的人
  rationale: 保留谓语名词κριταί和将来时，同时以自然汉语表达“作你们的审判者”之意。
theological_decisions:
- issue: Βεελζεβούλ的名称形式与身份
  choice: 别西布勒
  alternative: 别西卜
  rationale: 正文以所给SBLGNT中的Βεελζεβούλ为准作音译，不用较熟悉但反映另一名称形式的传统译名来取代原文形式。
- issue: “你们的儿子”所指的人群
  choice: 正文保留字面称谓“你们的儿子”
  alternative: 你们的人／你们的门徒
  rationale: 该表达在语境中可能泛指听者所属群体中的驱魔者或其门徒，但希腊文的亲属用语本身留有张力，因此不在正文中将其限定为某一类人。
- issue: “他们将成为审判你们的人”的性质
  choice: 保留未来式的审判陈述
  alternative: 他们就证明你们错了
  rationale: 后者可解释论证作用，却会把κριταί的审判意象缩减为单纯的逻辑反证；正文保留原文较强的审判措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“靠……赶鬼”保持反问的平行结构；“正因如此”清楚连接结论。正文保留“儿子”和“审判”两处原文张力，以脚注说明而不代替正文作单一解释。
