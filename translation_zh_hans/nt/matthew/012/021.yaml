  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: zh_hans
  text: 万国也要仰望他的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外邦人要仰望他的名。”
    reason: ἔθνη可指“万国”或以色列以外的“外邦人”；本处两种理解都可成立。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文的引文，并自然表达递进或补充关系；比在本句句首直译为“并且”更符合现代汉语表达。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: 他的名
  rationale: 这里的与格与“仰望”相连。“名”既可指名字，也可涵盖此名所代表的身份、权柄和声誉；保留“名”可避免把含义限定得过窄。
- source_word: ἔθνη
  choice: 列国
  rationale: 该词可指众国、万族，也可特指以色列以外的外族人。以赛亚书引文的语境强调以色列之外的广大民族，因此正文采用具有旧约语感而现代读者仍能理解的“列国”，并在脚注保留“外族人”这一可能译法。
- source_word: ἐλπιοῦσιν
  choice: 要仰望
  rationale: 这是将来时，表达将要发生的盼望。“仰望”在汉语圣经语境中自然地表示把盼望寄托于某位对象，同时保留ἐλπίζω的盼望意味，而不简化为一般性的“信任”。
theological_decisions:
- issue: 弥赛亚引文中ἔθνη的范围
  choice: 列国
  alternative: 外族人
  rationale: “列国”保留先知性引文面向众民族的广阔视野，也包含以色列以外之人的含义；“外族人”同样符合语境，但会更突出与以色列的族群区分，故列入脚注而不在正文中固定这一侧重。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“列国”承接先知书引文的语域；“仰望他的名”保留原文的神学意象及将来的盼望色彩。
