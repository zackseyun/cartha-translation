  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: zh_hans
  text: 看哪，我所拣选的仆人，我所爱的、我心所喜悦的！我要将我的灵赐给他；他必向列国[a]宣告公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”或译“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: “公义”或译“审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知引文中唤起注意的语气；用语略显庄重，却仍为现代读者所熟悉。
- source_word: παῖς
  choice: 仆人
  rationale: 此处引用以赛亚书的仆人经文，语境所指是受上帝差遣的仆人，而非单纯强调年龄或亲子身份。
- source_word: ᾑρέτισα
  choice: 我所拣选的
  rationale: 自然表达上帝已经作出的选择，同时与后面的定语结构衔接。
- source_word: ὁ ἀγαπητός μου
  choice: 我所爱的
  rationale: 表达上帝对这位仆人的爱，语气自然庄重，并保留原文的名词性称谓。
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: 我心所喜悦的
  rationale: “我心”自然承载希腊文“我的魂”所表达的整个人内在意愿与喜悦，避免生硬直译，同时没有简化为单纯的认可。
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: 我要把我的灵放在他身上
  rationale: 贴近原文“放在……之上”的先知性差遣意象；“我的灵”明确指上帝的灵。
- source_word: τοῖς ἔθνεσιν
  choice: 向列国
  rationale: 在以赛亚书引文的普世使命语境中，“列国”既保留先知性措辞，也表达各民族国家；“外族人”作为可能含义收入脚注。
- source_word: κρίσιν
  choice: 公义
  rationale: 此处指仆人向列国带出的上帝公正秩序，“公义”较“审判”更贴合这段使命语境；该词也可表示“审判”，故列入脚注。
- source_word: ἀπαγγελεῖ
  choice: 宣告
  rationale: 体现公开、正式传达信息的含义，符合先知性和弥赛亚使命的语境。
theological_decisions:
- issue: παῖς所表达的弥赛亚仆人身份
  choice: 译作“仆人”，承接以赛亚书的仆人主题。
  alternative: 孩子；儿子
  rationale: 经文在此直接引用以赛亚书的仆人段落。“仆人”保留旧约互文，也避免从这个词本身加入原文此处未明确表达的父子称谓。
- issue: 使命语境中κρίσις的含义
  choice: 正文译作“公义”。
  alternative: 审判
  rationale: 本节着重仆人向列国宣告并带来上帝公正的秩序；“公义”较能体现这一面。由于κρίσις也可指司法性的判断或审判，脚注保留该译法。
- issue: τοῖς ἔθνεσιν的范围
  choice: 正文译作“向列国”。
  alternative: 向外族人
  rationale: “列国”保留以赛亚引文的普世视野，不把词义过早限定为与犹太人相对的族群称谓；脚注说明另一种合乎语义的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留先知引文的节奏和“看哪”的呼告色彩。三个并列称谓尽量贴近希腊文结构；后半句使用分号呈现赐灵与使命之间的紧密联系。
