  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: zh_hans
  text: 那时，有些文士和法利赛人就对他说：“老师，我们想看你显一个记号[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”在这里可指具有神迹性意义的征兆，即“神迹”。
    reason: 说明σημεῖον在本语境中可能带有超自然含义，同时保留主文较宽的词义。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然承接前文的叙事进程，也符合马太福音常见的时间转换表达。
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: 回应他说
  rationale: ἀποκρίνομαι虽常译作“回答”，但本节紧接的上文没有直接问题；“回应他说”既保留回应含义，也符合现代汉语叙事习惯。
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: 有些经学家和法利赛人
  rationale: τινες表明只是其中一些人；γραμματεῖς在此指熟悉并讲授律法的经学人士，“经学家”比音译式或古旧称谓更便于现代读者理解。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 准确表达对教导者的称呼，不额外加入“主人”等较强的权威意味。
- source_word: θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν
  choice: 我们想看你显一个记号
  rationale: “想看”直接对应 θέλομεν…ἰδεῖν；“你显一个记号”自然表达记号来自耶稣。主文保留 σημεῖον 较宽的“记号”含义，不直接限定为神迹。
theological_decisions:
- issue: σημεῖον所指记号的性质
  choice: 主文译为“记号”
  alternative: 神迹；神奇的征兆
  rationale: 语境中的请求很可能指具有超自然性质、可验证耶稣身份或权柄的神迹，但σημεῖον本身首先是“记号、征兆”。主文保留其范围，脚注说明语境中可能包含的神迹含义，避免替原文过早作出限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“回应他说”避免在没有直接提问时使用略显突兀的“回答”；“显一个记号”略带圣经语体色彩，但仍清楚可懂，并有助于保留原文关键词的开放性。
