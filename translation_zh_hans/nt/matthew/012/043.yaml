  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: zh_hans
  text: “当污秽的灵从那人身上出来时，它经过无水之地[a]，寻找歇息，却找不到。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干旱之地”；原文直译为“无水之地”。
    reason: 词义替代译法：ἄνυδρος字面意为“无水的”；“干旱”较自然，但稍具解释性。
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ……以后，就……
  rationale: ὅταν引出一般性的时间情形；δέ在这里是轻微的承接或转折。现代汉语用“……以后，就……”自然地呈现句间推进，不另加可能显得突兀的“如今”或“但是”。
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: 污灵
  rationale: 保留πνεῦμα“灵”的用词，不改译为“鬼”；“污”简洁体现ἀκάθαρτος在犹太洁净观念背景中的“不洁净”含义。
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: 离开那人
  rationale: 表达从某人身上出去的动作；定冠词用“那人”体现这则比喻所设定的特指人物，同时不把ἄνθρωπος过度具体化为“男人”。
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: 经过无水之地
  rationale: “经过”自然表达διέρχεται的穿行；“无水之地”贴近ἄνυδρος“没有水的”，保留具体意象。
- source_word: ζητοῦν ἀνάπαυσιν
  choice: 寻找安歇
  rationale: ζητοῦν表示有目的地寻找；“安歇”既可指休息状态，又不过度解释成特定的“栖身之处”。
- source_word: καὶ οὐχ εὑρίσκει
  choice: 却找不到
  rationale: 汉语以“却”自然呈现预期落空；宾语承接前面的“安歇”，无需重复。
theological_decisions:
- issue: 赶鬼语境中πνεῦμα的译法
  choice: 灵
  alternative: 鬼；邪灵
  rationale: 原文使用πνεῦμα并由ἀκάθαρτος修饰，而非δαιμόνιον；译作“污灵”既保留原文措辞，也在语境中清楚指向邪恶的灵体。
- issue: ἀνάπαυσις所指的安歇
  choice: 不具体说明安歇的性质
  alternative: 栖身之处；解脱
  rationale: 原文只说“安歇”，没有说明是居所、舒适还是其他状态；译文保留这种开放性，避免加入额外的灵界理论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“污灵”承接福音书洁净观念中的用语；句式简洁，保留原文从离开、经过、寻找至找不到的动作推进。
