  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: zh_hans
  text: 这是要应验那借着先知以赛亚所说的话[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由先知以赛亚所说的话。”希腊文更直译为“借着”，突出先知的传达作用。
    reason: 词义替代译法
lexical_decisions:
- source_word: ἵνα
  choice: 这是要
  rationale: 引出目的或结果，既自然连接上文，也不把两者之间的张力限定为单一含义。
- source_word: πληρωθῇ
  choice: 应验
  rationale: 保留马太福音常见的应验用语；与“要”连用，自然表达ἵνα后被动虚拟式的指向。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 将带冠词的被动分词按汉语习惯译为名词性结构，同时保留“被说出”的含义。
- source_word: διὰ
  choice: 借着
  rationale: διά接属格在此表示中介施事；“借着”比单纯的“由”更清楚地保留先知作为传达者的意味。
- source_word: Ἠσαΐου
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τοῦ προφήτου
  choice: 先知
  rationale: 保留原文对以赛亚身份的明确说明，并按现代汉语置于人名前。
- source_word: λέγοντος
  choice: 所说的话：
  rationale: 该分词引出下文引语；中文以“所说的话”配合冒号，避免生硬重复“说”，同时保留向后引述的功能。
theological_decisions:
- issue: 引文公式中的先知中介作用
  choice: 借着先知以赛亚所说的话
  alternative: 由先知以赛亚所说的话
  rationale: “借着”贴近διά接属格的中介含义，保留信息终极来源与先知传达角色之间的区别，而不额外规定一套教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这是要应验”符合叙事中的经文引述习惯；以冒号承接下一节引文。主文中的[a]与脚注对应。
