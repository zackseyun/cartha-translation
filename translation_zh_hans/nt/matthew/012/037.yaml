  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: zh_hans
  text: 因为要凭你的话定你为义[a]，也要凭你的话定你有罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告你为义”、“判你无罪”或“证明你是正当的”。这里的希腊语动词可指法庭上宣告某人为义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: 凭
  rationale: 此处ἐκ加属格表示审判所依据的证据。汉语“凭”自然地表达“以……为根据”，并保留司法语境。
- source_word: γάρ
  choice: 因为
  rationale: γάρ说明上一节有关言语与审判之警告的理由；“因为”在现代汉语中清楚保留这一解释性连接。
- source_word: λόγων
  choice: 话
  rationale: λόγος的复数在此指人说出的言语。“话”简洁自然，也能在两个平行分句中保持原文的重复。
- source_word: σου
  choice: 自己的
  rationale: 原文为第二人称单数属格“你的”。结合两个被动谓语，译作“自己的”更符合现代汉语习惯，同时仍准确指向受审者本人所说的话。
- source_word: δικαιωθήσῃ
  choice: 被判为义
  rationale: 这是δικαιόω的将来时被动形式；与下文“被定罪”构成司法性的对照。“被判为义”既显明宣告性的法律含义，也保留“义”这一重要词汇联系，避免将其缩窄为单纯“无罪释放”。
- source_word: καταδικασθήσῃ
  choice: 被定罪
  rationale: καταδικάζω的将来时被动形式具有司法含义。“被定罪”准确而自然，并与“被判为义”形成鲜明对照。
theological_decisions:
- issue: δικαιόω在言语与审判语境中的司法含义
  choice: 译作“被判为义”，表示在审判中被宣告为义；人的话是审判所依据的证据。
  alternative: 可译作“被判无罪”或“被证明为正当”。
  rationale: 它与καταδικασθήσῃ（被定罪）直接对举，司法语境明确。“被判为义”保留该词的圣经神学联系，却不把本节扩展成一套关于称义机制的完整教义，也不额外断定言语与内在生命之间的具体关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“凭自己的话”，以保留希腊文两个分句的平行与强调；使用“被判为义／被定罪”维持司法性的反义对照。
