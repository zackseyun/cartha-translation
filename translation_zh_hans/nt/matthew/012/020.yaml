id: MAT.12.20
reference: Matthew 12:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: zh_hans
  text: 压伤的芦苇，他不折断；冒烟的灯芯[a]，他不熄灭，直到他使公理[b]得胜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚麻”，这里指亚麻制的灯芯。
    reason: lexical_alternative
  - marker: b
    text: “公理”或译“审判”。
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: 压伤的芦苇
  rationale: κάλαμος指芦苇或芦苇秆；συντετριμμένον表示已经受压、受损。译作“压伤”既保留其脆弱受损的状态，也避免误示它已经完全折断。
- source_word: κατεάξει
  choice: 折断
  rationale: κατάγνυμι意为折断、折裂；“折断”与芦苇的形象自然搭配，也清楚表达主语不进一步毁坏它。
- source_word: λίνον τυφόμενον
  choice: 冒烟的灯芯
  rationale: λίνον本指亚麻，在灯具语境中指亚麻制的灯芯；τυφόμενον指正在冒烟，描绘火焰微弱、濒临熄灭的状态。“冒烟的灯芯”既贴近原文，也让现代读者容易理解。
- source_word: σβέσει
  choice: 熄灭
  rationale: σβέννυμι指把火或灯弄灭；“熄灭”是现代汉语中准确而庄重的对应表达。
- source_word: ἕως ἂν
  choice: 直到
  rationale: 该结构指向将来达到的界点；“直到”简洁地保留原句的时间关系，不额外解释其神学含义。
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: 使……得胜
  rationale: ἐκβάλλω在此有使之出现、推进或带出的意味，εἰς νῖκος表示达到胜利的结果。“使……得胜”自然表达公理最终取得决定性成果。
- source_word: τὴν κρίσιν
  choice: 公理
  rationale: κρίσις既可指审判、判决，也可指公正秩序。以赛亚仆人之歌的语境侧重仆人使上帝的公正得以实现；“公理”保留庄重的先知性语域，同时以脚注注明“审判”这一真实词义可能。
theological_decisions:
- issue: 以赛亚仆人引文中 κρίσις 的译法
  choice: 公理
  alternative: 审判
  rationale: 上下文描绘仆人温柔却有效地实现上帝的公正，不仅是宣告司法判决。“公理”较能涵盖这种秩序和公正得以确立的意义；但原词确有“审判”之义，因此不应排除该理解，并在脚注中保留。
- issue: λίνον 所指的灯具形象
  choice: 灯芯
  alternative: 亚麻
  rationale: 原词字面指亚麻，但在这里所描绘的是亚麻制的灯芯。“灯芯”让现代读者直接把握比喻所指，而脚注保留原文材料名称，以便查考。
- issue: ἕως ἂν 所连接的时间与结果关系
  choice: 直到他使公理得胜
  alternative: 直到他使审判走向胜利
  rationale: 主句保留原文“直到”的结构，不把它改写成原因或目的，从而避免对前述温柔行动与最终得胜之间的关系作超出文本的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文两幅并列意象及其后的“直到”结构；“压伤—折断”和“冒烟—熄灭”的搭配清楚呈现受损却未被毁灭的形象。
