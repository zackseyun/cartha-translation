id: MAT.12.42
reference: Matthew 12:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: zh_hans
  text: 南方的女王在审判的时候要和这一代人一同起来，并要定他们的罪；因为她从地极而来，要听所罗门的智慧。看哪，这里有比所罗门更大的[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这里有一位比所罗门更大的。”希腊文使用中性形式“更大的”，可能强调耶稣及其事工在这里所显出的超越伟大。
    reason: alternative_reading
  - marker: b
    text: “南方的女王”暗指示巴女王（列王纪上10:1–13；历代志下9:1–12），但希腊文正文没有直接写出“示巴”。
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: 南方的女王
  rationale: 按希腊文属格结构直译，不在正文中直接解释为示巴女王，以免加入原文未明说的名称。
- source_word: ἐγερθήσεται ἐν τῇ κρίσει
  choice: 在审判的时候要……起来
  rationale: “起来”既适合审判场景，也保留ἐγείρω可能含有的复活意味；“在审判的时候”自然表达确定的末后审判。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: 和这一代人一同
  rationale: 保留μετά加属格的通常意义“与……一同”，不提前把它译成“反对”；敌对结果由后面的“定罪”表达。
- source_word: κατακρινεῖ αὐτήν
  choice: 并要定他们的罪
  rationale: κατακρίνω意为判定有罪、定罪；中文以“他们”回指“这一代人”，比按语法性别机械处理更自然。
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: 从地极而来
  rationale: 采用现代中文仍通行的圣经式地理惯用语，表达极其遥远之处。
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: 要听所罗门的智慧
  rationale: 保留目的不定式和属格结构；这里“听……智慧”虽凝练，但中文可理解为聆听智慧的教导。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人郑重注意的语篇功能，同时符合庄重、易懂的现代中文圣经语体。
- source_word: πλεῖον Σολομῶνος
  choice: 比所罗门更大的
  rationale: 希腊文比较级为中性形式。中文“更大的”不强行补成“更大的人”或“更大的事”，从而保留所指范围的张力。
- source_word: ὧδε
  choice: 这里有
  rationale: 以自然中文补出存在结构，准确表达“在这里”。
theological_decisions:
- issue: 中性比较级πλεῖον如何表达与耶稣的关系
  choice: 这里有比所罗门更大的
  alternative: 这里有一位比所罗门更大的
  rationale: 正文避免把中性形式明确改为指人的“一位”，以保留它既指向耶稣本人、又可能涵盖他及其事工所呈现之超越伟大的表达张力。脚注给出常见的指人译法。
- issue: 女王在审判中“起来”的含义
  choice: 在审判的时候要……起来
  alternative: 在审判的时候要被复活
  rationale: 希腊文被动形式可带复活意味，但上下文也有在审判中起身作证的司法色彩；“起来”保留两者而不作过度限定。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“看哪”“地极”保留经文的郑重和凝练感；其余句法作适度汉语化。脚注标记均在正文出现，并分别紧接相关内容。
