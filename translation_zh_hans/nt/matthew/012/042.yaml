  source_fidelity: 译文准确传达了原文的未来时态、审判语境、μετά属格的“与……一同”、定罪的结果、远道而来的目的，以及ἰδού所引出的强调。"起来"恰当地保留ἐγερθήσεται在复活与审判出庭之间的开放性；"比所罗门更大的"未将中性πλεῖον擅自限定为男性个人或某一具体事物。
  naturalness: 整体为庄重且可理解的现代标准汉语。"南方的女王"、"地极"、"看哪"符合中文圣经语体；"这里有比所罗门更大的"虽为凝练的名词化表达，却自然地保留了原文的修辞张力。
  terminology: “审判”“定罪”“所罗门”“地极”等术语使用一致且恰当。正文不把“南方的女王”直接等同为示巴女王，避免超出希腊文的明示信息；脚注以“暗指”说明旧约背景亦合宜。
