  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: zh_hans
  text: 耶稣还在对众人说话的时候，看哪，他的母亲和弟兄们[a]站在外面，想要跟他说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲属”。希腊语ἀδελφοί是阳性复数，正文译作“弟兄们”；在较宽泛的用法中，也可指关系亲近的亲属。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: 耶稣还在……说话的时候
  rationale: 以自然的汉语时间从句表达属格独立结构；“还在”保留ἔτι所表示的持续动作，δέ仅作轻微叙事推进，不必机械译出。主语按上下文明确为耶稣。
- source_word: τοῖς ὄχλοις
  choice: 对众人
  rationale: ὄχλοις为复数，指聚集的人群；现代汉语用“众人”自然庄重，也无需生硬标示复数。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并使叙事生动的语篇功能；“看哪”具有经文语体色彩，但普通读者仍能理解。
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的母亲和弟兄们
  rationale: 所属关系依上下文同时适用于母亲和弟兄；“弟兄们”反映ἀδελφοί的阳性复数形式，同时以脚注保留其可能较宽的亲属义。
- source_word: εἱστήκεισαν ἔξω
  choice: 站在外面
  rationale: εἱστήκεισαν表示已经处于并持续保持站立的状态；汉语“站在外面”自然表达这一状态，不补入原文未明说的“房子”。
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: 想要跟他说话
  rationale: ζητοῦντες在此表达有意寻求机会做某事；“想要”符合现代汉语叙事习惯，“跟他说话”准确传达αὐτῷ λαλῆσαι而不额外规定谈话内容。
theological_decisions:
- issue: ἀδελφοί所指耶稣家人的具体关系
  choice: 弟兄们
  alternative: 兄弟姐妹／近亲
  rationale: 希腊词为阳性复数，正文按其词形和叙事表层译作“弟兄们”。脚注承认该词在某些语境可广指亲属，但不借本节裁定这些人与耶稣之间更精确的亲属关系，以保留相关神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”有意保留原文突显新情节的力度；其余句法按现代汉语调整，避免欧化表达。
