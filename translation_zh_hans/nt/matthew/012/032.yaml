source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: zh_hans
  text: 无论谁说了反对人子的话，都会得到赦免；但无论谁说了反对圣灵的话，都不会得到赦免，无论在今世还是在来世[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “今世……来世”原文直译为“这个时代……将要来的（时代）”；后一句省略了“时代”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: 无论谁……但无论谁
  rationale: 表达带ἐάν/ἄν的不定关系结构所具有的普遍条件意义，同时在两分句间保留鲜明对比。
- source_word: εἴπῃ λόγον κατὰ
  choice: 说话冒犯
  rationale: λόγον表明所说的话，κατά加属格在此表示敌对指向；“说话冒犯”比生硬的“说一句反对……的话”更符合现代汉语，也保留言语攻击的含义。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留这一固定称号及其经文传统和弥赛亚、末世论意蕴，不改释为普通的“人”。
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: 都可得到赦免 / 都不会得到赦免
  rationale: 以汉语自然的被动意义表达将来时被动语态；上下两句保持结构对应，且不擅自明说施赦者。
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: 圣灵
  rationale: 采用现代汉语基督教语境中通行而准确的称谓。
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: 无论在今世，还是在来世
  rationale: αἰών在此指时代而非空间性的世界；后半句以实体化分词省略“世”，汉语用“来世”自然补足其所指，并保留今世与将来时代的末世性对照。
theological_decisions:
- issue: αἰών与μέλλων所表达的时间对照
  choice: 无论在今世，还是在来世
  alternative: 既不在这个世代，也不在将来的世代
  rationale: 正文用现代汉语简洁表达当前与将来时代的对照，不把αἰών误解为空间意义的“世界”；脚注说明其字面结构，以避免把“来世”限定为某一套具体的来生教义。
- issue: 不可赦免之冒犯的性质
  choice: 只保留“说话冒犯圣灵”及其后果
  alternative: 在译文中明确解释为某种特定历史行为或最终不悔改
  rationale: 本节经文本身发出警告，却未在此句中给出后世教义式定义；译文不替文本消除这一解释空间。
- issue: 赦免句的神学主语
  choice: 采用“得到赦免”，不补出施赦者
  alternative: 译作“上帝会赦免他”
  rationale: 希腊文使用神学性被动语态；虽可理解上帝为施赦者，正文仍不补入原文未明说的主语。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“无论谁”保留普遍警告的开放范围；“说话冒犯”避免文言化，也比“亵渎”更贴近本节的εἴπῃ……κατά，因为原文此处并未使用βλασφημέω。“今世、来世”为自然对举，脚注交代αἰών的时代含义和后句的省略。
