  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: zh_hans
  text: “你们要么使[b]树成为好树，果子也成为好果子；要么使树成为坏树，果子也成为坏果子[a]；因为树是凭果子认出来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坏”所译的希腊语可指腐烂、败坏或无用。
    reason: lexical_alternative
  - marker: b
    text: 这里重复使用的“使”也可能带有“看作”或“显明为”的修辞意味；原文形式是命令式。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: 使
  rationale: 保留不定过去时命令式的直接形式及两分句的对称结构；在此语境中可能具有“看作、判定为”的修辞意味，另以脚注说明，不在正文中消解。
- source_word: δένδρον
  choice: 树
  rationale: 直接对应原文意象，是现代汉语中自然、清楚的表达。
- source_word: καλός
  choice: 好
  rationale: 既可表达树与果子的良好品质，也保留语境中的伦理意味；“健全”或“健康”会把含义收窄。
- source_word: καρπός
  choice: 果子
  rationale: 保留原文具体意象，也符合圣经语境中自然、通俗而庄重的汉语表达。
- source_word: σαπρός
  choice: 坏
  rationale: 该词可指腐坏、败坏或无用；“坏”能同时自然修饰树和果子，并保留较宽语义。其更具体的“腐烂、败坏”含义在脚注中注明。
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: 因为……凭果子
  rationale: “因为”表达γάρ的解释关系；“凭果子”以自然汉语表达ἐκ所指的辨认依据。
- source_word: γινώσκεται
  choice: 认出来
  rationale: 表达现在时被动形式“被认识、被辨认”，在现代汉语中比生硬的“被知道”更自然。
- source_word: αὐτοῦ
  choice: 其所指关系由语境表达
  rationale: 汉语在“树是凭果子认出来的”中无需重复所有格，树与其果子的关系已清楚，避免不自然的“它的果子”。
theological_decisions:
- issue: 耶稣比喻中命令式的效力
  choice: 正文保留直接命令式“你们要么使……要么使……”
  alternative: 译作“你们要么把树看作好树……”或改为条件句
  rationale: 原文两次使用命令式，虽可能是修辞性的挑战，正文仍保留其形式和张力，不把解释直接写进经文。
translation_notes:
  register: 采用现代标准普通话，句式对称、简洁而庄重。“要么……要么……”再现原文鲜明的二选一结构；正文保留命令式及“好／坏”的对照，脚注交代词义范围与可能的修辞效力。
