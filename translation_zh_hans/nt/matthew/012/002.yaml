  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: zh_hans
  text: 但法利赛人看见了，就对他说：“看哪，你的门徒正在做在安息日不许做的事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在安息日不被准许做的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 就
  rationale: 承接上一节并转入法利赛人的反应；现代汉语用“就”自然推进叙事，语境本身已显出对立，无须硬译为“但是”或“可是”。
- source_word: ἰδόντες
  choice: 看见了
  rationale: 将不定过去时分词按时间关系自然表达；宾语由上一节门徒掐麦穗吃的行动补足，不另加解释。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 采用现代汉语中性、直接的言语引介公式。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并带有指控意味的感叹语气；“看哪”庄重而仍为普通读者所懂。
- source_word: μαθηταί
  choice: 门徒
  rationale: 准确保留福音书中师徒关系的通行术语。
- source_word: ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν
  choice: 正在做……不许做的事
  rationale: “正在做”体现现在时动作，“不许做”表达ἔξεστιν的许可含义，并以自然汉语保留原文两个ποιέω的呼应。
- source_word: ἐν σαββάτῳ
  choice: 安息日
  rationale: 在“不许做”的结构中，汉语无需另加介词即可清楚表达安息日这一时间和守日语境。
theological_decisions:
- issue: 法利赛人指控的法律性质
  choice: 译为“安息日不许做的事”
  alternative: “安息日不可做的事”或“在安息日做不合法的事”
  rationale: 原文ἔξεστιν强调准许与否，但没有说明所依据的是经文律法还是法利赛传统。“不许做”保留法律—许可层面的指控，同时不裁定其依据或正当性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“看哪”保留原文感叹和指示力度；全句避免过度法律化的“违法”，以免把原文未说明的法律来源固定下来。
