  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: zh_hans
  text: 如果撒但赶出[a]撒但，他就自相分裂了[b]；那么，他的国怎能站立得住呢[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“驱逐”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他已经自相分裂了。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“那么，他的国怎能维持下去呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: 如果
  rationale: καί承接上文的论证，但现代汉语在条件句开头通常不必硬译为“并且”；“如果”自然地保留了条件关系，句间衔接则由上下文体现。
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: 撒但
  rationale: 采用该名称在现代中文圣经语境中的通行音译；主格与宾格在汉语中形式相同。
- source_word: ἐκβάλλει
  choice: 赶出
  rationale: ἐκβάλλω在此处指驱逐邪灵；“赶出”准确、自然，也与本段语境相称。
- source_word: ἐφ’ ἑαυτὸν ἐμερίσθη
  choice: 他就是自相分裂了
  rationale: ἐπί加反身代词表达与自己对立，μερίζω的被动形式表达分裂；“自相分裂”以自然汉语保留内部对立及其结果。
- source_word: πῶς οὖν
  choice: 那么……怎能
  rationale: “那么”体现οὖν的推论意味，“怎能”传达πῶς在此反问中的语气。
- source_word: σταθήσεται
  choice: 站立得住
  rationale: 保留ἵστημι的“站立”比喻，同时用“得住”清楚表达继续存在、稳固不倒的含义。
- source_word: ἡ βασιλεία αὐτοῦ
  choice: 他的国
  rationale: βασιλεία在这里指撒但所辖的国度或统治领域；“他的国”简洁保留了分裂之国的意象。
theological_decisions:
- issue: 撒但赶出撒但与自相分裂之间的逻辑
  choice: 保留为假设性的归谬论证：若撒但赶出撒但，他便自相分裂，其国也就不能稳立。
  alternative: 可按上下文扩写为“一个自相分争的家”，以凸显前一节的比喻。
  rationale: 本节希腊文本直接谈撒但、自相分裂和他的国，并未重复“家”的措辞；不从邻近经文添入意象，可保留本节自身简练的论证。
- issue: ἐμερίσθη的时态与语态
  choice: 译作“就是自相分裂了”，突出假设行为所造成的结果状态。
  alternative: 较形式化地译作“已经与自己分裂”或“被分裂了”。
  rationale: 希腊文是不定过去时被动语态；中文“自相分裂了”既保留结果意味，又避免生硬的被动表达，且不额外指定造成分裂的外在行动者。
- issue: σταθήσεται所表达的国度结局
  choice: 以反问“怎能站立得住”保留不能稳固存续的含义。
  alternative: 译为“怎能维持下去”以直接说明其延续性。
  rationale: “站立得住”保留原文比喻，不把国度概念缩减为纯粹时间上的延续。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自相分裂”和“站立得住”都是自然成语化表达，既保留原文意象，也避免过度口语化或教派性措辞。
