  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: zh_hans
  text: 不与我一同的，就反对我；不与我一同收聚的，就在分散。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: 不……的
  rationale: 希腊语冠词加分词构成泛指人的名词性表达；汉语用“不……的”自然表达这种泛指，不限定性别。
- source_word: μετ’ ἐμοῦ
  choice: 与我同在／与我一同
  rationale: μετά加属格表示关联或共同参与。首句译“与我同在”保留关系与立场含义，次句译“与我一同”自然连接具体行动。
- source_word: κατ’ ἐμοῦ
  choice: 反对我的
  rationale: κατά加属格在此表示敌对或对立；“反对我的”直接保留鲜明的二元对照。
- source_word: συνάγων
  choice: 聚集
  rationale: 该分词指把人或事物聚拢起来；“聚集”保留可能的牧养或收聚意象，不额外限定对象。
- source_word: σκορπίζει
  choice: 在分散
  rationale: 该动词意为使之散开，与“聚集”形成清楚的反义平行；不补出宾语，以保留原文的开放性。
- source_word: καὶ
  choice: ；
  rationale: 希腊语καὶ连接两个并列断言。现代汉语以分号连接更自然，同时保持其并列而非转折关系。
theological_decisions:
- issue: 耶稣所说绝对对立的力度
  choice: 保留“同在／反对”和“聚集／分散”的鲜明二分，不加缓和语。
  alternative: 采用较宽松的意译，弱化立场的绝对对立。
  rationale: 希腊原文以两个紧密平行的句子作无保留的断言；译文应保留这种神学张力，而不进一步推导宗派性结论。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“不……的，就是……”既保留原文泛指单数的功能，也避免古雅的“凡不……者”。两句保持紧凑的对偶结构。
