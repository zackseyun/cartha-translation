  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: zh_hans
  text: 众人都惊奇不已，说：“这莫非就是‘大卫之子’[a]吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫之子”是弥赛亚的称号，指所应许、出自大卫家系的君王和拯救者。
    reason: cross_reference
  - marker: b
    text: 或译得更贴近这个问句的语气：“这不会就是大卫之子吧？”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 惊奇不已
  rationale: 表达强烈而持续的惊异反应，既保留未完成时所呈现的状态，也符合现代汉语叙事习惯。
- source_word: πάντες οἱ ὄχλοι
  choice: 众人都
  rationale: πάντες 的全体含义由“都”体现；ὄχλοι 虽为复数，但汉语以“众人”表达在场群众更自然，避免生硬的“所有群众们”。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示众人持续或相继议论；汉语叙事中用“说”引出共同反应最自然，语境仍能体现众人的议论。
- source_word: Μήτι
  choice: 莫非……吗
  rationale: Μήτι 通常引出倾向于否定答案、同时带有迟疑或试探意味的问句。“莫非……吗”保留这种惊疑语气，却不把它强化为断然否认。
- source_word: ὁ υἱὸς Δαυίδ
  choice: 大卫之子
  rationale: 保留原文的称号形式及其弥赛亚内涵，不直接释为“弥赛亚”；“之子”庄重自然，也适合作为固定称号。
theological_decisions:
- issue: “大卫之子”的弥赛亚含义
  choice: 正文保留“大卫之子”这一称号，并以脚注说明其弥赛亚意义。
  alternative: 直接译作“弥赛亚”或“大卫所应许的后裔”。
  rationale: 原文使用的是具有历史和神学分量的称号，而非解释性称谓；保留原称号可避免替原文消解其含蓄性。
- issue: Μήτι 所表达的疑问倾向
  choice: 译作“这莫非就是……吗”，保留惊讶、试探与迟疑。
  alternative: 译作“难道这不是……吗”或“这不可能是……吧”。
  rationale: 该小词往往预期否定回答，但此处群众的惊异也显示他们正在猜测其弥赛亚身份；主译不将疑问处理成明确否认，脚注则交代更贴近形式的负向问法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“惊奇不已”传达强烈反应；“莫非”自然呈现群众既惊讶又迟疑的猜测。引号标明“大卫之子”为称号，脚注标记均置于正文相应位置。
