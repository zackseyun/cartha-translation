id: MAT.12.45
reference: Matthew 12:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: zh_hans
  text: 于是，它就去带上另外七个比自己更邪恶的灵[a]；它们进去，住在那里。那个人末后的光景变得比先前更坏[b]。这个邪恶的世代也将如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七个与它不同、比它更邪恶的灵”。
    reason: 说明ἕτερα也可突出“不同”的语义色彩。
  - marker: b
    text: 希腊文直译为“那个人末后的事比先前的事更坏”，意思是他最终的处境比原先更糟。
    reason: 解释原文以“末后的”和“先前的”对举来表示处境变化的惯用表达。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接前文并推进叙述次序；“于是”符合现代汉语叙事习惯。
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: 它就去，带来
  rationale: 表达污灵先去、继而带同伴来的动作次序；汉语不必重复“与自己一起”，因为“带来”已自然包含伴随之意。
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: 另外七个……灵
  rationale: ἕτερα在此主要指原先那一个以外的其他灵，并不必然强调种类不同；πνεύματα按原词译为“灵”，由上下文表明其邪恶性质。
- source_word: πονηρότερα ἑαυτοῦ
  choice: 比自己更邪恶
  rationale: 保留比较级及反身比较对象；“邪恶”通俗而庄重。
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: 它们进去，住在那里
  rationale: 将分词结构按汉语顺序化为并列动作。“住在那里”自然传达定居之意；汉语动词不标单复数，也避免过度处理希腊文本中复数分词与单数谓语的形式张力。
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: 那个人末后的光景
  rationale: 这是与先前状况相对的惯用表达；“末后的光景”既保留原文的末后含义，也让现代读者明白所指为最终处境。
- source_word: χείρονα τῶν πρώτων
  choice: 比先前更坏
  rationale: 自然表达最终状况与原先状况的比较，同时保留原文的强烈反差。
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: 这个邪恶的世代也将如此
  rationale: 保留耶稣把比喻应用于当代世代的类比关系；“世代”兼顾原文 γενεά 的群体与时代色彩。
theological_decisions:
- issue: πνεύματα在邪灵语境中的译法
  choice: 灵
  alternative: 鬼魔
  rationale: 原文此处使用“灵”，而上下文已说明是不洁之灵；保留“灵”可避免加入本分句没有使用的更专门称谓。
- issue: ἀνθρώπου的性别表达
  choice: 那个人
  alternative: 那男人
  rationale: 虽然该名词在希腊文中为阳性属格单数，但在此代表受污灵侵扰的个体，并非强调男性身份；现代汉语“那个人”准确、自然，也没有抹去任何与论旨相关的性别信息。
- issue: κατοικεῖ的单数形式与复数语境
  choice: 住在那里
  alternative: 它就住在那里
  rationale: SBLGNT此处谓语为单数，而前面的分词指向多个灵。汉语“住在那里”本身不标数，既能顺畅承接群体，也不必擅自校正文本文法形式。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“它”指前文的不洁之灵；“末后的光景”保留经文语感，同时由脚注解释其惯用含义。所有脚注标记均置于相关正文之后。
