source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: zh_hans
  text: 因为正如约拿在那巨大海中生物的腹中三天三夜[a]，人子也必照样在地的深处[b]三天三夜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巨大海中生物”或译“大鱼”。希腊词指大型海中生物，并非现代动物分类中的特定物种。
    reason: lexical_alternative
  - marker: b
    text: “地的深处”直译为“地的心中”。这句话可能指埋葬、坟墓、地下深处或死人之境；正文保留原文的比喻表达。
    reason: alternative_reading
  - marker: c
    text: “三天三夜”有人理解为一种计日说法，可包括三个日子中的部分时间；也有人按更严格的时长理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……怎样
  rationale: “因为”表达γάρ的解释、承接作用，“怎样”开启ὥσπερ所引出的比较，并与后文“也将照样”自然呼应。
- source_word: Ἰωνᾶς
  choice: 约拿
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐν τῇ κοιλίᾳ
  choice: 在……腹中
  rationale: “腹中”准确表达κοιλία在此处的身体空间含义，又比“胃里”更自然、庄重。
- source_word: τοῦ κήτους
  choice: 那大海兽
  rationale: κῆτος指大型海中生物，范围并不局限于现代动物分类中的鱼；“大海兽”保留其宽泛性，也与约拿故事中的巨大海中生物相符。
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: 三天三夜
  rationale: 直接保留原文重复出现的时间表述，不在正文中判定其为包容式计日还是严格的七十二小时。
- source_word: οὕτως
  choice: 也将照样
  rationale: “照样”明确标示比较的后半部分；“也”使中文对应结构自然流畅。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一耶稣自称的通行中文译法，保留其圣经互文和称号性质。
- source_word: ἔσται
  choice: 将……在
  rationale: 用“将”表达εἰμί将来时，未额外加入“停留”等持续性含义。
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: 在地心里
  rationale: 贴近保留καρδία“心”的隐喻，不在正文中将其解释为坟墓、地下深处或死人之境。
theological_decisions:
- issue: “地心里”的所指
  choice: 在正文中保留“地心里”这一隐喻
  alternative: 坟墓、地下深处、死人之境
  rationale: 希腊文没有明确限定唯一所指；保留隐喻可避免把有争议的神学解释写入正文。
- issue: “三天三夜”的时间含义
  choice: 逐字保留“三天三夜”
  alternative: 包括三个日子的部分时间；严格的七十二小时
  rationale: 原文明确使用这一时间短语，但其计日方式存在不同理解，译文不应替读者作出判定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为……怎样……也将照样”保留原文的解释性连接和比较结构；“大海兽”避免把κῆτος过度限定为现代分类意义上的鱼；“地心里”有意保留原文隐喻及相关神学张力。
