  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: zh_hans
  text: 毒蛇的后代啊[a]！你们既是邪恶的，怎能说出好话来呢？因为心里所充满的[b]，口里就说出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毒蛇的一窝”或“毒蛇的儿女”。
    reason: lexical_alternative
  - marker: b
    text: 原文可指“丰盛”或“满溢之物”；即心中充盈而流露出来的。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: 毒蛇的后代
  rationale: γέννημα指所生或所产生的，配合ἐχιδνῶν构成尖锐的血统与品性隐喻。“毒蛇的后代”在现代汉语中清楚自然，也保留了原文意象。
- source_word: πῶς δύνασθε
  choice: 怎能
  rationale: 这一组合构成带责问意味的反问，表达在所述情形下的不可能或无能为力；“怎能”简洁地保留其力度。
- source_word: ἀγαθὰ λαλεῖν
  choice: 说出好话来
  rationale: ἀγαθά是中性复数名词化用法，指好的言语或好的事；结合λαλεῖν，译作“说出好话来”自然且不过度解释。
- source_word: πονηροὶ ὄντες
  choice: 你们既然邪恶
  rationale: 分词结构说明反问所依据的处境或原因。“既然邪恶”保留明确的道德判断，又符合现代汉语表达。
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: 因为心里所充满的
  rationale: περίσσευμα可指丰盛、盈余或满溢之物。此译借助汉语习惯表达内在的充满，并让下句呈现由内而外流露的关系。
- source_word: τὸ στόμα λαλεῖ
  choice: 口里就说出来
  rationale: 保留“口”这一具体意象，并以自然汉语表达言语从内心发出的结果。
theological_decisions:
- issue: “心”（καρδία）的隐喻范围
  choice: 保留“心”这一圣经用语，不将其缩窄为情感或思想
  alternative: 内心；心思
  rationale: καρδία在此指人的内在中心，包括思想、意志和道德取向；保留“心”可维持原文宽广的人论含义。
- issue: πονηροί的道德力度
  choice: 译为“邪恶”
  alternative: 坏；恶人
  rationale: 这里是明确的道德评断，不只是描述品质欠佳。“邪恶”保留原文力度；同时不把形容词直接改写成身份名词“恶人”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“毒蛇的后代”保留尖锐隐喻；“怎能……呢”呈现责问语气；后半句使用自然的汉语对应结构，保留言语源于内心充满之物的图像。
