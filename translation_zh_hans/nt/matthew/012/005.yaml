  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: zh_hans
  text: 或者，你们没有读过律法[a]上所记的吗？每逢安息日[b]，祭司在圣殿里亵渎安息日[c]，却是无罪的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“律法”指摩西律法，亦即相关的经文；所指可能包括安息日献祭的条例（参《民数记》28:9–10）。
    reason: cross_reference
  - marker: b
    text: 希腊文直译为“在安息日们”，复数形式可能表示每逢安息日、反复发生的情形。
    reason: lexical_alternative
  - marker: c
    text: “亵渎”也可译作“违犯”或“破坏”。希腊文动词含有把神圣之物当作普通之物的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 或者
  rationale: 引出耶稣反驳中的另一个经文论据，保留简洁的修辞衔接。
- source_word: οὐκ ἀνέγνωτε
  choice: 你们没有读过……吗
  rationale: 符合马太福音中常见的反问句式，也自然表达听者本应熟悉经文的意味。
- source_word: ἐν τῷ νόμῳ
  choice: 律法上所记的
  rationale: 指摩西律法这一经书体系；加入“所记的”使现代汉语表达自然，而不改变所指。
- source_word: τοῖς σάββασιν
  choice: 每逢安息日
  rationale: 希腊文为复数，表示一再发生的安息日场合；此译法比生硬的“在众安息日”更自然，并保留反复性。
- source_word: οἱ ἱερεῖς
  choice: 祭司们
  rationale: 直接指在圣殿中履行礼仪职责的祭司。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν可指整个圣殿区域；“圣殿”在此语境中自然明确，不误限定为至圣所或殿所本身。
- source_word: τὸ σάββατον
  choice: 安息日
  rationale: 保留单数所表达的安息日制度或圣日整体。
- source_word: βεβηλοῦσιν
  choice: 冒犯
  rationale: 该动词有使之世俗化、亵渎或违犯之意。“冒犯安息日”保留强烈而反常的措辞，同时在现代汉语中比“亵渎安息日”更容易理解。
- source_word: ἀναίτιοί εἰσιν
  choice: 却不算有罪
  rationale: 表达在律法责任上不被定罪；“不算有罪”清楚呈现法律性判断，并与前面的强烈动词形成张力。
theological_decisions:
- issue: 是否弱化祭司“冒犯安息日”的说法，以避免暗示他们实际违犯安息日
  choice: 保留“冒犯安息日”与“却不算有罪”之间的张力
  alternative: 译为“在安息日工作，却没有罪”或“看似违犯安息日，却是无罪的”
  rationale: 原文有意并置强烈的 βεβηλοῦσιν 与 ἀναίτιοί εἰσιν。译文不加入“看似”等解释，也不把前者弱化为一般的工作，从而保留耶稣论证的修辞和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每逢安息日”既传达复数的反复意味，又避免不自然的逐字翻译；“冒犯……却不算有罪”保留原文刻意形成的尖锐对照。所有脚注标记均置于正文句末。
