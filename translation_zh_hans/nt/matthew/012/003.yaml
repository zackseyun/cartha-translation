base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“你们没有读过吗？大卫饥饿、与他在一起的人也饥饿时，他做了什么？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“饥饿”的动词为单数，语法上明确以大卫为主语；但其后“与他在一起的人”也可理解为省略了同一动词，因此他们也在饥饿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: 耶稣却对他们说
  rationale: 希腊文直译为“他却对他们说”。根据上下文明确“他”是耶稣，中文补出姓名可避免指代含混；δέ在此标示对法利赛人指责的回应，译作“却”自然。
- source_word: Οὐκ ἀνέγνωτε
  choice: 你们没有读过吗
  rationale: 这是以否定形式提出的反问，诉诸听者对经文的熟悉；“没有读过吗”符合现代汉语表达，也保留反问语气。
- source_word: τί ἐποίησεν Δαυὶδ
  choice: 大卫做了什么
  rationale: ποιέω在这里是普通的“做”，无需增添解释。
- source_word: ὅτε ἐπείνασεν
  choice: 饥饿时
  rationale: πεινάω意为“饿、饥饿”。采用简洁庄重的“饥饿时”，不把简单过去时过度解释成“开始饿了”。
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: 和跟随他的人
  rationale: 该短语直指“与他同在的人”。结合事件语境，“跟随他的人”是自然清楚的现代汉语，同时不具体限定其身份。
theological_decisions:
- issue: 饥饿这一状态是否也适用于与大卫同在的人
  choice: 正文按语义将“大卫和跟随他的人”共同置于“饥饿时”之下
  alternative: 只明确说大卫饥饿，随后并列“跟随他的人”
  rationale: ἐπείνασεν是单数，语法上明确以大卫为主语；但后接καὶ οἱ μετ’ αὐτοῦ可理解为省略了共同谓语，使饥饿也适用于同行者。正文采用自然中文呈现后一理解，并用脚注保留希腊文的形式与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“耶稣”由上下文补明主语；问句次序按自然汉语调整。脚注标记已在正文中以[a]出现。
