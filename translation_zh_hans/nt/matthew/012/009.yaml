  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: zh_hans
  text: 耶稣离开那里，进了他们的会堂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 这里是承接上文的常用连接词。现代汉语叙事无须机械译作“于是”或“然后”；通过连续句式自然体现衔接，也避免增添原文未明确表达的时间色彩。
- source_word: μεταβὰς ἐκεῖθεν
  choice: 离开那里
  rationale: μεταβὰς为不定过去时主动分词，结合地点副词ἐκεῖθεν，表示从前一地点转往别处。“离开那里”简洁、自然，并保留地点转换之意。
- source_word: ἦλθεν
  choice: 进了
  rationale: ἔρχομαι在此与εἰς连用，表达进入新的地点。汉语译作“进了”自然地呈现移动方向，并与“离开那里”形成顺畅叙事。
- source_word: εἰς τὴν συναγωγὴν
  choice: 进了……会堂
  rationale: εἰς加宾格表示向内移动；“进了”比仅说“到了”更清楚保留这一方向。
- source_word: συναγωγὴν
  choice: 会堂
  rationale: “会堂”是现代中文圣经语境中对犹太人聚会、敬拜场所的通行而准确的称呼。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 忠实保留第三人称复数属格，不在译文中进一步界定“他们”是谁，也不增添敌对或宗派意味。
- source_word: （ἦλθεν的隐含主语）
  choice: 耶稣
  rationale: 希腊语动词形态只表明第三人称单数，主语由上下文承接为耶稣。中文若仅译“他”，单节呈现时指代不够清楚，因此明确译出“耶稣”。
theological_decisions:
- issue: “他们的会堂”中“他们”的所指
  choice: 保留为“他们的会堂”
  alternative: 译成“当地犹太人的会堂”或带有敌对意味的群体称呼
  rationale: 原文只有αὐτῶν，并未在本句具体界定其所指，也未明说该群体怀有敌意。直译可保存叙事中的开放性，避免加入宗派或论战色彩。
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。“离开那里，进了……”兼顾希腊语分词结构的先后关系与中文叙事习惯；不添加不必要的连接词。
