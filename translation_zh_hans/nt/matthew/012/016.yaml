  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: zh_hans
  text: 他还严厉警告他们，不要让人知道他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严令他们”或“严厉嘱咐他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 并且
  rationale: 保留叙事中的并列连接，不额外加入时间或因果含义。
- source_word: ἐπετίμησεν
  choice: 严厉告诫
  rationale: 该词在这里引出禁止性的内容，表示带权威且语气强烈的警告或吩咐；“严厉告诫”既传达力度，也不像“斥责”那样暗示受话者已有过错。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 按上下文指向耶稣所面对的众人，采用自然的复数代词。
- source_word: ἵνα μὴ
  choice: 不可
  rationale: 在告诫类动词之后表达禁止性的内容；“不可”简洁、庄重，并保留命令力度。
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: 把他公开出去
  rationale: φανερὸν ποιέω表示使某人显明、为人所知或公开；此译突出不得公开宣扬他的意思，同时保留行为具体范围未明说的含混性。
theological_decisions:
- issue: 耶稣限制公开传播的指令性质
  choice: 译作力度较强的告诫，禁止把他公开出去
  alternative: 可理解为斥责他们，或正式命令他们
  rationale: ἐπιτιμάω可涵盖斥责、严厉警告或命令；本句的ἵνα μή从句明确给出禁止内容，却没有说明限制公开传播的神学原因，因此正文不补入动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“严厉告诫”传达原文动词的强度；“公开出去”表达使耶稣为人所知的意思，但不擅自补入“身份”“神迹”或具体传播对象。
