source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: zh_hans
  text: 他对他们说：“你们中间哪一个人，若有一只羊，这只羊在安息日掉进坑里，难道不会抓住它，把它拉上来吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: 你们中间谁
  rationale: 按汉语反问句的自然表达处理；“谁”已涵盖原文以单数“人”为代表的说法，无须生硬译出“哪一个人将会是”。
- source_word: πρόβατον ἕν
  choice: 一只羊
  rationale: 保留数词“一”，同时使用现代汉语合适的量词“只”。
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: 若这羊……掉进
  rationale: “若”保留条件意味；将指示代词 τοῦτο 明确回指为“这羊”，避免汉语代词指向不清。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 原文虽为复数形式，但这里是常见的安息日习语；用单数“安息日”自然表达这一律法争议的场景。
- source_word: εἰς βόθυνον
  choice: 掉进坑里
  rationale: βόθυνος 泛指坑或穴；“坑”准确而不过度限定其具体形制。
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: 不会抓住它
  rationale: οὐχί 表明反问预期肯定回答；“不会……呢”在现代汉语中清楚传达这一语气。κρατέω 在此指牢牢抓住。
- source_word: καὶ ἐγερεῖ
  choice: 把它提上来
  rationale: ἐγείρω 的基本意思是使之起来；结合羊掉进坑里的语境，“提上来”自然表达从坑中举起的动作，同时没有加入“救出”等解释性神学色彩。
theological_decisions:
- issue: 代表性阳性单数 ἄνθρωπος 的表达
  choice: 你们中间谁
  alternative: 你们中间哪一个人
  rationale: 汉语“谁”不标语法性别，却忠实表达原文对在场者所作的代表性反问；这不是出于性别中和而删改意义，而是符合汉语本身的语法与习惯。
- issue: 安息日复数形式 τοῖς σάββασιν
  choice: 在安息日
  alternative: 在各安息日／在一个安息日
  rationale: 此处复数是习惯用法，语境聚焦于安息日行为是否合法；译作单数不会暗示多次事件，也不预先裁定争议。
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“他却”保留 δέ 在争论语境中的转折；“若……不会……呢”使预期肯定回答的修辞力量清晰可懂。
