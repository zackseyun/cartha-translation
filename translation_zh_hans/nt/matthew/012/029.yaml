id: MAT.12.29
reference: Matthew 12:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: zh_hans
  text: 或者，有谁能进到壮汉家里，抢走他的财物[a]，除非先把那壮汉捆住[b]？然后，他才会洗劫那壮汉的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”也可译作“物品”或“器具”；希腊语原词可具体指器皿、器具，也可泛指所有物。
    reason: lexical_alternative
  - marker: b
    text: “捆住”也可译作“绑住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 又
  rationale: 承接上文并引出另一个说明性的反问；现代汉语用“又”比生硬直译为“或者”更自然，同时保留论证的衔接。
- source_word: πῶς δύναταί τις
  choice: 有谁能
  rationale: 以自然的汉语反问表达“某人怎能”，保留其泛指和不可能性的语气。
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: 进到……家里
  rationale: 忠实表达“进入”，不额外加入原文没有明说的破门或非法闯入方式。
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: 壮汉／那壮汉
  rationale: ἰσχυρός在此作名词使用，指强壮有力的男子；“壮汉”简洁自然，并保留比喻中的男性形象。再次出现时加“那”以明确回指。
- source_word: τὰ σκεύη αὐτοῦ
  choice: 他的财物
  rationale: σκεύη可指器皿、器具，也可泛指家中物品或财物；在夺取和洗劫房屋的语境中，“财物”最自然，但以脚注保留其字面范围。
- source_word: ἁρπάσαι
  choice: 抢走
  rationale: 表达强行夺取并带走，与后文较强的διαρπάσει有所区别。
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: 除非先……捆住
  rationale: 保留条件结构及“先”的次序；“捆住”准确表达使其受束缚、无法抵抗。
- source_word: καὶ τότε
  choice: 然后……才
  rationale: “才”自然凸显只有完成前一行动之后，后一行动才可能发生，符合原文的先后逻辑。
- source_word: διαρπάσει
  choice: 会洗劫
  rationale: 该复合动词比前面的ἁρπάζω语气更充分，指大肆抢夺；“洗劫”能体现这种加强意味。
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: 那壮汉的家
  rationale: 保留具体的房屋抢掠比喻，不在正文中将其解释为势力范围、家业或其他神学所指。
theological_decisions:
- issue: 比喻中的男性形象
  choice: 壮汉
  alternative: 强者
  rationale: 原文以阳性实体化形容词描绘一个具体的强壮男子；“壮汉”既保留形象，也符合现代汉语习惯。
- issue: “家”与“财物”的比喻范围
  choice: 保留具体的入屋抢夺画面
  alternative: 将其解释性地译为势力范围与所属之物
  rationale: 上下文涉及耶稣胜过邪灵权势，但本节正文应保留耶稣所用的比喻，不把完整寓意直接写入译文。
- issue: 两个夺取动词的力度差别
  choice: 分别译为“抢走”与“洗劫”
  alternative: 两处均译为“抢夺”
  rationale: 如此可反映ἁρπάζω与加强形式διαρπάζω之间的表达差异，又不把这种差异夸大为不同类别的行动。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“有谁能……除非……”使逻辑清楚；“然后……才……”自然呈现先捆住、后洗劫的次序。正文保留具体比喻，不加入寓意解释。
