id: MAT.12.15
reference: Matthew 12:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: zh_hans
  text: 但耶稣知道了这事[a]，就从那里退去。许多人跟随他，他把他们全都治好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“知道”的对象；“这事”是按上一节的上下文补出的。也可译作“耶稣得知后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: 知道了这事
  rationale: 不定过去时分词表示先于主要动作发生的知悉，并为随后退去提供背景。“这事”自然承接上一节所述的敌对图谋，同时用脚注说明原文没有明说宾语。
- source_word: ἀνεχώρησεν
  choice: 退去
  rationale: ἀναχωρέω在马太福音中常指面对危险或敌意而有意离开；“退去”比中性的“离开”更能保留这一叙事意味，又不暗示怯懦。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 准确、自然地表达从某处离开的方向。
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: 许多人跟随他
  rationale: πολλοί意为“许多人”，原文没有明确使用“群众”一词；此译法简洁自然。
- source_word: ἐθεράπευσεν
  choice: 治好了
  rationale: 在福音书的医治语境中，θεραπεύω表示使病患痊愈；“治好了”是现代汉语中清楚自然的表达。
- source_word: αὐτοὺς πάντας
  choice: 把他们全都
  rationale: 保留πάντας所强调的全部范围，并采用自然的现代汉语语序。
theological_decisions:
- issue: γνοὺς所隐含的宾语
  choice: 正文译作“知道了这事”，以“这事”承接上一节法利赛人的图谋，并加脚注说明原文的含蓄性。
  alternative: 译作“得知后”，不明说所知何事。
  rationale: 希腊文没有明示“知道”的对象，但上下文清楚提供了所指。正文补出“这事”有助于现代读者理解，脚注则避免把上下文推断误当成原文明说。
- issue: 耶稣离开的语气
  choice: 译作“退去”。
  alternative: 译作“离开”或“走了”。
  rationale: 此词在马太叙事中可带有因敌对情势而主动撤离的意味；“退去”保留这一层次，但不把动机解释为惧怕。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“但”承接上一节并体现δὲ的转折推进；句式简洁，保留原文动作次序与“全都”的强调。
