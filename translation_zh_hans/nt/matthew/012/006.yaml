  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: zh_hans
  text: 但我告诉你们，这里有比圣殿更大的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这里有一位比圣殿更大的”，或“这里有比圣殿更大的人”。希腊文的“更大的”采用中性形式，所指在语法上并未明说。
    reason: alternative_reading
  - marker: b
    text: “这里”或译：“在这地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: λέγω与ὑμῖν构成直接对听众说话的常用表达；δέ在此承接上文并带有轻微转折，用“但”自然体现对比。
- source_word: τοῦ ἱεροῦ
  choice: 比圣殿
  rationale: ἱερόν通常指整个圣殿范围，而非较专指内殿的ναός；现代汉语以“圣殿”简洁、自然地表达此处所指。
- source_word: μεῖζόν
  choice: 更大的
  rationale: 该词是中性单数比较级，在这里作名词性用法，但没有明说所指。汉语“更大的”同样可以不点明是人、事物或现实，因而保留原文的开放性。
- source_word: ἐστιν
  choice: 就……在
  rationale: ἐστιν是现在时系词；结合汉语存在句，以“就在这里”自然表达当下的临在，并以“就”加强这句话的郑重语气，而不增添新的所指。
- source_word: ὧδε
  choice: 这里
  rationale: ὧδε是地点副词，意为“这里”或“在这地方”；“这里”在现代汉语中最简洁自然。
theological_decisions:
- issue: 中性比较级μεῖζόν所指的身份
  choice: 正文译作不明说所指的“比圣殿更大的”
  alternative: “有一位比圣殿更大的在这里”或“比圣殿更大的人在这里”
  rationale: 希腊文使用中性单数形式，并未直接使用阳性形式或明说耶稣。上下文虽强烈指向耶稣及其权柄，正文仍保留语法上的未明说状态，避免把解释直接写进经文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“比圣殿更大的”在汉语中可作名词性短语而不明说所指，与希腊文的形式相应；“就在这里”简洁有力，适合耶稣郑重宣告的语境。
