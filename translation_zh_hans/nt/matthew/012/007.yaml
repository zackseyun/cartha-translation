id: MAT.12.7
reference: Matthew 12:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: zh_hans
  text: 但你们若明白“我喜爱怜悯，不喜爱祭祀”[a]是什么意思，就不会定无罪的人[b]有罪了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 耶稣引用何西阿书6:6。
    reason: cross_reference
  - marker: b
    text: “无罪的人”或译“无辜的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: 明白
  rationale: 这里指领会所引经文的含义；在与事实相反的条件句中，“若明白……就不会……”自然表达了对先前未曾领会的责备。
- source_word: τί ἐστιν
  choice: 是什么意思
  rationale: 这是引出经文解释的惯用表达，比直译“是什么”更符合现代汉语，同时不增添解释。
- source_word: Ἔλεος
  choice: 怜悯
  rationale: 准确表达ἔλεος所指向的慈悲与体恤，也符合本段耶稣强调待人的语境。
- source_word: θέλω
  choice: 喜爱
  rationale: 在何西阿书引文中，“喜爱”自然表达上帝所看重、所要的，语体庄重，并保留与祭祀之间的鲜明对照。
- source_word: θυσίαν
  choice: 祭祀
  rationale: 指献祭这一礼仪行为；“祭祀”在现代汉语经文语境中简洁自然。
- source_word: κατεδικάσατε
  choice: 定……有罪
  rationale: 保留该动词的司法意味，并与ἀναιτίους“无罪的人”形成清楚的语义呼应。
- source_word: ἀναιτίους
  choice: 无罪的人
  rationale: 直接表达该词“没有罪责”的法庭性含义；“无辜的人”也是可行译法，列入脚注。
theological_decisions:
- issue: 何西阿书6:6引文中怜悯与祭祀的关系
  choice: 我喜爱怜悯，不喜爱祭祀
  alternative: 我要的是怜悯，不是祭祀
  rationale: 保留希腊文尖锐的否定对照，凸显上帝看重怜悯胜过脱离忠信的礼仪，同时不在译文中进一步推断祭祀本身是否被全面否定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“若明白……就不会……”自然呈现与事实相反的条件关系；引文保持简洁有力。所有脚注标记均置于正文相应位置。
