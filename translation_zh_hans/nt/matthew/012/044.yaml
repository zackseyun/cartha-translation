id: MAT.12.44
reference: Matthew 12:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: zh_hans
  text: 于是它说：“我要回到我出来的那所房子去。”它回来后，发现房子空着[a]，已经打扫干净，收拾整齐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“空的”。
    reason: σχολάζοντα可表示“空着、无人占用”或较一般的“空的”。
  - marker: b
    text: 或译：“布置妥当”或“装饰好了”。
    reason: κεκοσμημένον既可强调整理得井然有序，也可含布置、装饰之意。
lexical_decisions:
- source_word: τότε λέγει
  choice: 于是它说
  rationale: τότε承接前文并推进叙事，译作“于是”自然简洁；λέγει是生动叙事现在时，主语承接上文的污灵，因此用“它说”。
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: 我要回到……那所房子去
  rationale: 保留ἐπιστρέφω的“返回”含义和污灵称其为“我的房子”的占有意味；中文引语中的“回到……去”自然表达其行动方向。
- source_word: ὅθεν ἐξῆλθον
  choice: 我出来的
  rationale: 直接保留“从其中出来”的具体空间意象，不把“房子”解释性改写为“人”或“生活”。
- source_word: ἐλθὸν εὑρίσκει
  choice: 它回来后，发现
  rationale: 将先行的简单过去时分词ἐλθὸν自然处理为时间从句“回来后”，并以“发现”表达叙事现在时εὑρίσκει。
- source_word: σχολάζοντα
  choice: 空着
  rationale: 该词可表示空闲、无人占用或空着；“房子空着”在现代汉语中自然，也保留房子可供占据的含义，而不进一步解释隐喻。
- source_word: σεσαρωμένον
  choice: 已经打扫干净
  rationale: 以“已经”表达完成时被动分词所描述的既成状态；“打扫干净”自然传达房子已被扫净。
- source_word: κεκοσμημένον
  choice: 收拾整齐
  rationale: κοσμέω可指整理、布置或装饰；此处“收拾整齐”兼顾井然有序的状态，又不把装饰意味说得过重。
theological_decisions:
- issue: “房子”的隐喻所指
  choice: 正文保留“房子”的原有意象，不明说它代表人或人的生命。
  alternative: 译作“我要回到我离开的那个人那里去”。
  rationale: 本节经文本身使用“房子”这一形象；保留原喻可避免替读者预先限定其神学解释。
- issue: 房子“空着”的状态
  choice: 译作“空着”，不说明究竟缺少谁或什么。
  alternative: 解释为“没有神居住”或“没有善灵占据”。
  rationale: σχολάζοντα本身只陈述空置状态；经文没有在本句明确指出空缺者，译文应保留这一解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“它”承接上文所说的污灵；“那所房子”保持比喻画面。“打扫干净，收拾整齐”形成自然并列，并体现两个完成时被动分词所描述的现成状态。
