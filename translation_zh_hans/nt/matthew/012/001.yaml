  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: zh_hans
  text: 那时，耶稣在安息日[a]穿过麦田。他的门徒感到饿了，就开始掐麦穗吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安息日”在希腊文中为复数形式；这里是习语用法，意思是“在安息日”。
    reason: 说明原文复数形式及其习语意义。
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: 那时
  rationale: καιρός在这里指叙事中的时机或时段；“那时”自然、简洁地保留了时间衔接。
- source_word: ἐπορεύθη
  choice: 经过
  rationale: πορεύομαι表示行走、前往；与διὰ τῶν σπορίμων连用时，“从麦田经过”符合现代汉语叙事习惯。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 虽然希腊文采用复数形式，但这是通行习语，在本处指一个安息日。
- source_word: διὰ τῶν σπορίμων
  choice: 从麦田
  rationale: σπόριμος指播种作物的田地，尤其是谷物田；“麦田”在本语境中简明易懂，并与后文麦穗自然衔接。
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: δέ在此主要承接叙事，不必译成强烈转折词；另起一句即可自然表达推进。
- source_word: ἐπείνασαν
  choice: 饿了
  rationale: 此处不定过去时可带有起始意味；“饿了”在现代汉语中自然表达进入饥饿状态。
- source_word: ἤρξαντο
  choice: 开始
  rationale: ἄρχομαι加不定式明确表示动作开始。
- source_word: τίλλειν στάχυας
  choice: 掐麦穗
  rationale: τίλλω指用手拔取或掐下，στάχυς指谷物的穗；“掐麦穗”准确且符合汉语习惯。
- source_word: καὶ ἐσθίειν
  choice: 吃
  rationale: 该不定式与τίλλειν并列，同受“开始”支配；汉语无需重复结构成分。
theological_decisions:
- issue: σάββασιν的数与所指
  choice: 在安息日
  alternative: 在安息日的时候／在各安息日
  rationale: 该复数形式在通用希腊语中可作为习语指安息日这一天；译成单数避免让读者误以为事情发生在多个安息日。这是语法与语境判断，并非教义性取舍。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“掐麦穗吃”简洁保留连续动作；“麦田”比“庄稼地”更具体，也与στάχυας相呼应。
