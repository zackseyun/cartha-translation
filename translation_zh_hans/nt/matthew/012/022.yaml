id: MAT.12.22
reference: Matthew 12:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: zh_hans
  text: 那时，有人把一个被鬼附身、又瞎又哑[a]的人带到他面前。他医治了那人，那人就能说话，也能看见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“聋”。希腊语这个词既可指耳聋，也可指不能说话；这里下文说他能说话、能看见了，因此正文译作“哑”。
    reason: 保留κωφός的词义歧义，并说明正文依据上下文所作的选择。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间和叙事推进标记，自然地引出随后发生的事；比单用“于是”更明确保留时间意味。
- source_word: προσηνέχθη αὐτῷ
  choice: 有人把……带到他面前
  rationale: 希腊文为被动式，施事者没有说明。汉语采用不定主语“有人”表达，既自然，也不擅自确定是谁带来的。
- source_word: δαιμονιζόμενος
  choice: 被鬼附身
  rationale: 明确保留原文所说的邪灵性侵扰，不将其改写为现代医学或心理学类别。
- source_word: τυφλὸς
  choice: 瞎
  rationale: 直接表达不能看见的状态，与本句通俗而庄重的叙事语体协调。
- source_word: κωφός
  choice: 哑
  rationale: κωφός可指耳聋或不能说话；本节结果句说那人后来能说话、能看见，因此正文按语境译为“哑”，同时以脚注保留词义上的另一可能。
- source_word: ἐθεράπευσεν αὐτόν
  choice: 他医治了那人
  rationale: “医治”是福音书医治叙事中自然、准确的表达；“那人”清楚指回被带来的人。
- source_word: ὥστε
  choice: ……就……
  rationale: 以现代汉语自然的结果结构表达医治所产生的结果。
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: 那人就能说话，也能看见了
  rationale: 用“能”明确表达能力得到恢复；第二次不重复称“哑者”，避免生硬，同时保留说话和看见两个并列结果。
theological_decisions:
- issue: 如何表达鬼魔造成的侵扰
  choice: 保留明确的“被鬼附身”
  alternative: 患有精神疾病；受折磨
  rationale: δαιμονιζόμενος明确涉及鬼魔，翻译不应将其自然化为临床诊断，也不应弱化为未说明来源的痛苦。
- issue: 本节κωφός的具体含义
  choice: 正文译作“哑”，脚注说明也可指“聋”
  alternative: 聋；又聋又哑
  rationale: 该词本身具有一定语义幅度，但结果句只提到恢复说话和看见，没有提到恢复听觉。正文依近距离语境选择“哑”，脚注则保留真实的词义歧义。
translation_notes:
  register: 采用现代标准普通话，语句简洁、庄重且适合普通读者。“有人把……带到”将希腊文无施事者的被动句自然转成汉语不定主语结构；正文不增加带人者身份，也不把鬼魔语言改写为现代临床术语。
source_grounding:
  english_pob_role: consult_only
