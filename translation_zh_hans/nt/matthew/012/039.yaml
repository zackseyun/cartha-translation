  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: zh_hans
  text: 他却回答他们说：“邪恶、淫乱[a]的世代求神迹；除了先知约拿的神迹以外，不会有神迹赐给这个世代。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫乱”也可能唤起先知书中的意象：以奸淫比喻对上帝或盟约的不忠；这里同时保留其字面的道德指控。
    reason: 说明隐喻及经文互涉，同时不在正文中把含义限定为单纯的“不忠”。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答他们说
  rationale: 保留分词与限定动词构成的叙事表达，同时采用现代汉语仍可自然理解的措辞。
- source_word: Γενεὰ
  choice: 世代
  rationale: 指当时被共同作出道德评价的一群人；“世代”保留了原文单数集合名词的群体性。
- source_word: πονηρὰ
  choice: 邪恶
  rationale: 直接表达原文严厉的道德谴责，庄重而易懂。
- source_word: μοιχαλὶς
  choice: 淫乱
  rationale: 保留与奸淫相关的尖锐意象，不直接释为“背信”，从而兼顾字面道德含义及先知传统中对属灵不忠的暗示。
- source_word: σημεῖον
  choice: 神迹
  rationale: 在本语境中指被索求作为验证的超常记号；“神迹”是现代汉语圣经语境中自然且易懂的表达，但不在正文中进一步限定其具体性质。
- source_word: ἐπιζητεῖ
  choice: 求
  rationale: 简洁表达寻求或索求；上下文本身已经显出这种要求受到否定，无须在动词中额外加入“强求”等解释。
- source_word: δοθήσεται
  choice: 会给
  rationale: 自然呈现将来时被动含义，并避免把未明说的施予者加入正文。
- source_word: αὐτῇ
  choice: 给这个世代
  rationale: 所指回到阴性单数名词“世代”；汉语重复先行词比使用“给它”更清楚自然。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 准确表达否定句中的排除性例外。
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: 先知约拿的神迹
  rationale: 符合自然汉语语序，并保留属格短语本身的开放性，不预先解释该神迹究竟如何与约拿相关。
theological_decisions:
- issue: “淫乱”的含义
  choice: 正文保留“淫乱”，并以脚注指出其可能包含盟约不忠的先知性意象。
  alternative: 不忠
  rationale: 原词既是尖锐的道德指控，也能唤起先知书以奸淫比喻对上帝不忠的传统；只译作“不忠”会消解原文的隐喻张力。
- issue: “约拿的神迹”的性质
  choice: 只译为“先知约拿的神迹”，不在本节正文中解释。
  alternative: 像约拿经历那样的神迹；以约拿本人为神迹
  rationale: 原文在此没有明确展开这一短语的具体所指，紧接的上下文才加以说明，因此译文不应提前选定一种解释。
- issue: 被动式“会给”的施予者
  choice: 保留被动表达，不明说施予者。
  alternative: 上帝不会给这个世代
  rationale: 原文使用被动式而未明说主语；即使语境可能暗示上帝，正文仍不应补入原文没有明说的称谓。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“回答他们说”略带经文叙事色彩，但仍自然，并较完整地对应希腊文表达；“给这个世代”避免生硬的代词回指。英文咨询层所列脚注标记与脚注内容位置彼此错置，因此本稿依原文证据重新设置一个与“淫乱”直接对应的脚注。
