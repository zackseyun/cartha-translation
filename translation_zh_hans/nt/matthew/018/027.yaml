  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: zh_hans
  text: 那奴隶的主人动了怜悯之心，就放他走，并免了他的债[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “债”原文更具体指借款或所借之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: 动了怜悯之心
  rationale: 该分词表达发自内心的深切怜悯；这一说法自然、庄重，也保留了原文的情感力度。
- source_word: δὲ
  choice: 就
  rationale: 此处用于推进叙事；结合前面的分词结构译作“就”，清楚呈现主人因怜悯而采取行动。
- source_word: κύριος
  choice: 主人
  rationale: 在比喻的直接语境中，所指是奴隶的主人，而不是直接用作对上帝的称号；“主人”也符合现代汉语表达。
- source_word: δοῦλου
  choice: 奴隶
  rationale: 原词表示处于主人权下的人；本段的债务、权柄及释放语境使这种身份关系十分重要，不宜弱化为“仆人”。
- source_word: ἀπέλυσεν αὐτόν
  choice: 放他走
  rationale: ἀπολύω可指释放或准其离开；“放他走”自然地表达主人不再扣留或追逼他，同时不额外断定正式解除其奴隶身份。
- source_word: τὸ δάνειον
  choice: 债
  rationale: 该词具体指借出之物或借款，但在此处是被免除的欠款义务；正文译作自然的“债”，并用脚注保留其较具体的借贷含义。
- source_word: ἀφῆκεν αὐτῷ
  choice: 免了他的
  rationale: ἀφίημι在此表示免除、取消偿还义务；“免了他的债”准确体现财务语境，也保留与“赦免”相关的语义联系。
theological_decisions:
- issue: 是否把 κύριος 译成神圣称号
  choice: 译作“主人”，指比喻中的人间主人
  alternative: 译作“主”或“主上”
  rationale: 直接叙事对象是奴隶的主人。译作“主人”可避免在正文中提前把他直接等同于上帝，同时不妨碍读者理解比喻更广的神学指向。
- issue: 是否弱化 δοῦλος 的社会身份
  choice: 译作“奴隶”
  alternative: 译作“仆人”
  rationale: 债务与主人权柄构成这一比喻的重要背景；“奴隶”较准确地保留原文所呈现的不对等隶属关系。
- issue: ἀπέλυσεν 是否表示解除奴隶身份
  choice: 译作“放他走”，不明确断言获得自由身份
  alternative: 译作“释放了他”或“使他自由”
  rationale: 该动词在此可表示释放或让其离开，原文并未明确说明正式解放其奴隶身份，因此保留这一范围上的含混。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“动了怜悯之心”保留情感力度；“放他走”避免过度解释为正式解放奴隶；“免了他的债”符合普通读者的表达习惯，并以脚注说明原文“借款”的具体含义。
