id: MAT.18.9
reference: Matthew 18:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: zh_hans
  text: 如果你的眼睛使你跌倒[a]，就把它挖出来，丢弃。对你来说，独眼进入生命，也比有两只眼睛却被扔进火的欣嫩子谷[b]更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你犯罪”。这个希腊语动词可以指使人绊倒、跌倒，也可以指使人犯罪。
    reason: lexical_alternative
  - marker: b
    text: “欣嫩子谷”译自希腊语“Gehenna”，在这里指最终受审判之地；传统上常译作“地狱”。
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: 使你跌倒
  rationale: 保留“使人绊倒、跌倒”的比喻，同时由脚注说明在本语境中也可指使人犯罪，避免在正文中过早缩窄词义。
- source_word: ἔξελε
  choice: 挖出来
  rationale: 该命令语气强烈；“挖出来”在现代汉语中自然地传达把眼睛强行除去的严厉意象。
- source_word: βάλε ἀπὸ σοῦ
  choice: 丢开
  rationale: 简洁表达果断地将其从自己身边除去，不弱化彻底割舍的意味。
- source_word: καλόν σοί ἐστιν
  choice: 对你来说……更好
  rationale: 后接ἤ所引出的比较，因此这里表达的是两种结局中较好的一种，而不只是一般意义上的“好”。
- source_word: μονόφθαλμον
  choice: 只有一只眼睛
  rationale: 准确传达“独眼的”这一形象，同时符合现代汉语表达习惯。
- source_word: εἰς τὴν ζωήν
  choice: 进入生命
  rationale: 原文只说“生命”，没有明说“永生”；直译可保留其末世意味而不增加原文未明说的限定。
- source_word: βληθῆναι
  choice: 被扔进
  rationale: 保留被动形式以及动作的强烈感，现代汉语清楚自然。
- source_word: γέενναν
  choice: 欣嫩子谷
  rationale: 保留γέεννα所指向的特定犹太历史与末世审判背景，不直接用内涵更宽泛且受后世神学用语影响的“地狱”取代。
- source_word: τοῦ πυρός
  choice: 烈火的
  rationale: 以自然汉语保留原文“火”的鲜明意象，并修饰“欣嫩子谷”。
theological_decisions:
- issue: γέεννα的译法
  choice: 欣嫩子谷
  alternative: 地狱
  rationale: 原文采用特定词γέεννα，并非泛指阴间或刑罚之地的普通词。正文保留其专名性质，脚注交代它在本节所指的最终审判之地。
- issue: εἰς τὴν ζωήν的译法
  choice: 进入生命
  alternative: 进入永生
  rationale: 上下文很可能具有末世含义，但希腊文没有“永恒的”这一形容词；不补入“永”可忠实保留原文措辞及其神学张力。
- issue: 严厉身体意象的处理
  choice: 保留“挖出来，丢开”
  alternative: 意译为“彻底除掉犯罪的诱因”
  rationale: 原文刻意采用强烈而具体的身体意象。译文不把它直接解释成抽象伦理原则，以免消解经文本身的修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使你跌倒”保留原文比喻，并用脚注说明其伦理含义；比较句按汉语语序调整为“也比……更好”。脚注标记均放在相应词语之后。
