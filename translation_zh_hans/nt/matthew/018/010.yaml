id: MAT.18.10
reference: Matthew 18:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: zh_hans
  text: “你们要当心，不可轻看这些小子中的任何一个[a]。因为我告诉你们，他们的天使[b]在天上[c]常常得见我在天上的父亲的面容。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻看”也可译作“藐视”或“看不起”。
    reason: lexical_alternative
  - marker: b
    text: “他们的天使”可能指与这些小子相关或代表他们的天使；本节本身并未完整说明是否每个人都有一位专属的守护天使。
    reason: alternative_reading
  - marker: c
    text: 本节两处“天上”，希腊文直译均为“诸天中”；这里按现代汉语习惯译作“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: 你们要当心，不可轻看
  rationale: Ὁρᾶτε引出警告，译为“要当心”能自然表达警醒、留意的命令语气；καταφρονέω含藐视、看不起或视为无足轻重之意，“轻看”简洁庄重，并保留其态度与评价层面的含义。
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: 这些小子中的任何一个
  rationale: 保留“这些小子”这一较宽泛的称呼，不把所指仅限于年幼儿童；“任何一个”自然传达原文“一个也不可”的个体强调。
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: 自然呈现γάρ的解释关系，并保留耶稣郑重告知的语气。
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: 他们的天使
  rationale: 直接保留属格关系，不在正文中断定这些天使究竟是逐一受派的守护天使，还是以其他方式与这些小子相关。
- source_word: ἐν οὐρανοῖς
  choice: 在天上
  rationale: 希腊文形式为复数，但这是常见的空间表达；现代汉语以“在天上”最为自然。
- source_word: διὰ παντὸς
  choice: 时时
  rationale: 表达持续、经常或随时如此的含义，简洁而符合现代汉语。
- source_word: βλέπουσι τὸ πρόσωπον
  choice: 看见……的面
  rationale: 保留原文“见面”的具体意象及其所暗含的亲近、觐见意味，不改写为解释性的“侍立在……面前”。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 我那位在天上的父
  rationale: 保留“我的父”以及后置修饰语“在天上的”，同时用“那位”使现代汉语句法清楚自然。
theological_decisions:
- issue: “他们的天使”的确切含义
  choice: 正文直译为“他们的天使”，不进一步界定其身份或职责。
  alternative: 明确译作“他们各自的守护天使”，或解释为代表、服事这些小子的天使。
  rationale: 原文说明这些天使与“这些小子”有关，却未明确交代是一人一位、是否专职守护，或属格关系的具体机制；保留原措辞可避免把后来的完整天使论体系写入经文。
- issue: “这些小子”的所指范围
  choice: 采用可涵盖儿童及卑微门徒的“这些小子”。
  alternative: 译作“这些小孩子”，把所指明确限定为儿童。
  rationale: 本章语境确有孩子在场，但“小子”这一称呼也可能延伸指向谦卑、微小的门徒；正文不应无必要地缩窄其范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“小子”比“小孩子”范围更宽，可保留上下文中年龄与身份卑微两方面的可能性；“时时看见……的面”略带经文体色彩，以保存原文的宫廷觐见意象。
