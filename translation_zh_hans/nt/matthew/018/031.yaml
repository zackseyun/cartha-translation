source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: zh_hans
  text: '于是，和他同作奴仆的人[a]看见所发生的事，就非常悲痛；他们来到自己的主人那里，把所发生的一切都详细禀报了他。


    [a] 或译“同伴仆人”。原文指与他同属一位主人的奴仆。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同伴仆人”。原文指与他同属一位主人的奴仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 既承接前文，又推动叙事发展；“于是”比偏重逻辑推论的“因此”更符合此处上下文。
- source_word: σύνδουλοι
  choice: 一同作奴仆的人
  rationale: 保留 σύν- 所表达的共同身份，也明确 δοῦλος 所指的受主人支配的奴仆身份；现代汉语中比生硬的“同奴”自然。
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: 所发生的事 / 所发生的一切
  rationale: 以自然汉语表达名词化分词，并在第二处用“一切”保留 πάντα 的全面性和递进。
- source_word: ἐλυπήθησαν σφόδρα
  choice: 非常悲痛
  rationale: λυπέω 可表达悲伤、痛苦，σφόδρα 强烈加深程度；“非常悲痛”保留情感力度而不额外限定为愤怒或恐惧。
- source_word: ἐλθόντες
  choice: 来到自己的主人那里
  rationale: 将先于主要动作发生的分词转为顺承动作，并明确其趋向主人，符合汉语叙事习惯。
- source_word: διεσάφησαν
  choice: 详细禀报
  rationale: 该动词含说明清楚、详尽报告之意；“禀报”符合下属向主人报告的社会关系，“详细”保留其语义力度。
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: 自己的主人
  rationale: 此处 κύριος 指比喻中的人间主人；“主人”在现代汉语中自然准确，ἑαυτῶν 的反身所属关系由“自己的”明确表达。
theological_decisions:
- issue: 比喻社会背景中 δοῦλος 词族的表达
  choice: 一同作奴仆的人
  alternative: 同伴仆人
  rationale: 债务与主从身份是比喻情节的重要组成部分，因此正文保留“奴仆”，不将其弱化为一般受雇的仆人；脚注列出较柔和的传统表达。
- issue: 人间上位者 κύριος 的表达
  choice: 主人
  alternative: 主
  rationale: 这里所指是比喻中的人间主人。“主人”既准确体现奴仆关系，也避免仅用“主”可能引起的神圣称谓联想。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禀报”体现奴仆向主人陈述的关系，但搭配“详细”仍自然清楚。分号呈现看见、悲痛、前往禀报之间的叙事层次。
