id: MAT.18.12
reference: Matthew 18:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: zh_hans
  text: “你们怎么看？如果一个人有一百只羊，其中一只走迷了路，他难道不会把那九十九只留在山上，去寻找那只迷路的羊吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: 你们怎么看？
  rationale: 采用自然的现代汉语问句，保留复数第二人称和邀请听者判断的语气。
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: 如果一个人有
  rationale: 此处 γίνομαι 加与格表达所有或处境；“一个人有”简洁自然，并保留原文阳性单数的泛指形式。
- source_word: ἑκατὸν πρόβατα
  choice: 一百只羊
  rationale: 准确传达数目，并使用现代汉语中羊的常用量词。
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: 其中一只走迷了路
  rationale: πλανάω 的被动形式在这里可指走迷、游荡或被引入歧途；“走迷了路”符合羊的场景，同时不特指外在施动者。
- source_word: οὐχὶ ἀφήσει
  choice: 他难道不会把……留在
  rationale: “难道不会”体现 οὐχί 预期肯定回答的反问语气；“留在”比“抛弃”更符合暂时离开的语境。
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: 那九十九只
  rationale: 以量词补足自然汉语表达，并清楚回指其余的羊。
- source_word: ἐπὶ τὰ ὄρη
  choice: 在山上
  rationale: 保留 ὄρη 的山地意象；汉语“在山上”自然，也不强行判定为高山还是丘陵。
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: 去寻找
  rationale: 将附带情状分词与主要动词自然整合为汉语连动结构，并用“寻找”准确表达 ζητέω。
- source_word: τὸ πλανώμενον
  choice: 那只迷路的羊
  rationale: 保留与前一 πλανάω 形式的词义呼应；补出“羊”使汉语指称清楚，而不改译为原文未用的“失丧”。
theological_decisions:
- issue: ἀνθρώπῳ 的阳性单数泛指
  choice: 一个人
  alternative: 有人
  rationale: “一个人”自然保留原文单数人物形象，不必将其消解为更抽象的中性表达。
- issue: 羊的 πλανάω 所含的迷失、游荡或受误导意味
  choice: 走迷了路／迷路的羊
  alternative: 走散了／被引入歧途／失丧的羊
  rationale: 所选译法保持牧羊场景及潜在的比喻张力，不指定迷路是自主游荡还是受外力误导，也不引入 ἀπόλλυμι 的“失丧”用语。
- issue: οὐχί 所表达的预期回答
  choice: 难道不会……吗？
  alternative: 不是会……吗？
  rationale: 反问形式清楚传达说话者预期听者回答“会”，同时保留其劝导性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走迷了路”略具口语自然度，“寻找”则维持经文所需的端正文体。原文所含“山／山地”的地形弹性和 πλανάω 的语义张力均未被教义化处理。
