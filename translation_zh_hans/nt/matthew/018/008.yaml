id: MAT.18.8
reference: Matthew 18:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: zh_hans
  text: 如果你的手或脚使你跌倒[a]，就把它砍掉，丢到一边去。你缺一只手或瘸一条腿地进入生命，胜过有两只手或两只脚而被扔进永恒之火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你犯罪。”希腊文动词的字面意象是“使你跌倒”。
    reason: 说明该词保有使人跌倒的比喻，并可在本语境中指使人陷入罪中。
lexical_decisions:
- source_word: σκανδαλίζει
  choice: 使你跌倒
  rationale: 保留希腊文使人绊倒、跌倒的具体比喻；上下文同时赋予它陷入罪中的道德含义，脚注列出较解释性的译法。
- source_word: ἔκκοψον
  choice: 砍下来
  rationale: 准确传达不定过去时命令语气的果断和强烈，也符合手脚被截断的具体语境。
- source_word: βάλε ἀπὸ σοῦ
  choice: 扔掉
  rationale: 用自然的现代汉语表达用力除去并使之远离自己的意思；前文的“把它”也统摄这一动作。
- source_word: καλόν σοί ἐστιν
  choice: 你……胜过……
  rationale: καλόν 在由 ἢ 引出的比较结构中具有“更好”的含义；汉语用“胜过”自然呈现这一比较。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: 进入生命
  rationale: 保留原文单说“生命”而未明说“永生”的措辞，让它与后面的永恒之火形成末世性的对照。
- source_word: κυλλόν
  choice: 缺手
  rationale: 该词在本句截去手的具体语境中指肢体残缺；“缺手”比宽泛的“残疾”更准确，也与“瘸腿”构成清楚对应。
- source_word: χωλόν
  choice: 瘸腿
  rationale: 直接表达因脚或腿有缺损而行动不便，切合截去脚的上下文。
- source_word: ἔχοντα
  choice: 有
  rationale: 自然、明确地呈现分词“有两只手或两只脚”，并维持与缺手、瘸腿的对比。
- source_word: βληθῆναι
  choice: 被扔进
  rationale: 保留被动含义和动作的强烈程度，并自然连接目的地“永恒之火”。
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: 永恒之火
  rationale: 在审判语境中，αἰώνιος 最自然地表示永恒；“永恒之火”庄重、清晰，也避免把它改释为别的时间观念。
theological_decisions:
- issue: σκανδαλίζει 应译为道德化的“使你犯罪”，还是保留跌倒的比喻
  choice: 正文作“使你跌倒”
  alternative: 使你犯罪
  rationale: 原文保有绊倒、跌倒的意象，其道德后果可由上下文领会；脚注说明较明确的解释性译法，避免在正文中压平隐喻。
- issue: εἰς τὴν ζωὴν 中“生命”的末世含义
  choice: 保留“生命”
  alternative: 进入永生
  rationale: 语境显然具有末世意味，但希腊文这里只说“生命”；不补入“永”字，以免把语境所含之意改写成原文未明说的词。
- issue: 截去手脚的命令是否应在译文中解释为夸张说法
  choice: 照原文保留直截而严厉的命令
  alternative: 意译为彻底除去犯罪诱因
  rationale: 原文使用鲜明的身体意象和命令语气；译文不应预先裁定其修辞性质，也不应以解释取代原话。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把它砍下来，扔掉”保留原句的强烈力度；“缺手或瘸腿”具体对应手脚的上下文。正文脚注标记与脚注条目一致。
