  rationale: 修订分别呈现 πεσὼν 的伏地动作与 προσεκύνει 的下拜敬礼；以“请耐心等我”传达 μακροθύμησον 所求的忍耐和延缓，同时保留原文并未明说具体期限的概括性。脚注仍说明该动词在其他上下文可译为“敬拜”，但限定本处为对人类主人的敬礼。
