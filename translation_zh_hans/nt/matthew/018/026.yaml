  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: zh_hans
  text: 于是，那奴隶就伏在地上，向他下拜[a]，说：“请耐心等我，我会把一切都还给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他敬拜”。这个希腊词在其他语境中可指“敬拜”，但这里指奴隶在主人面前俯伏下拜，以示恭敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: 俯伏
  rationale: 该不定过去时分词描写奴隶伏身在地的动作；汉语“俯伏”自然凝练，也保留其卑微恳求的姿态。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文主人下令处置奴隶及其家产，表达由此引出的叙事结果。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 本段涉及主人对其人身及财产的支配，奴役身份在情节中十分突出；“奴隶”比“仆人”更准确地反映当时的社会关系。
- source_word: προσεκύνει αὐτῷ
  choice: 在他面前，恳求
  rationale: προσκυνέω在此指向人类主人行俯伏敬礼，并非必然表示宗教敬拜。结合前面的“俯伏”和随后的请求，译作“在他面前，恳求”既传达敬畏姿态，也以“恳求”体现未完成时所表现的持续动作。
- source_word: λέγων
  choice: 说
  rationale: 该分词引出直接引语；恳求语气已由主句表达，因此直译为“说”即可。
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: 请宽容我
  rationale: 该命令式请求主人暂缓追讨或惩处。“请宽容我”在现代汉语中自然，并保留忍耐、容让的含义。
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此概括全部欠款；“一切”简洁地表达全数偿还的承诺。
- source_word: ἀποδώσω σοι
  choice: 我会……还给你
  rationale: ἀποδίδωμι在债务语境中表示偿还；“还给你”符合现代汉语表达，并与“一切”搭配自然。
theological_decisions:
- issue: προσκυνέω用于人类主人时的含义
  choice: 译作俯伏在主人面前恳求，理解为尊卑关系中的伏地敬礼
  alternative: 敬拜他
  rationale: 比喻情境中的对象是人类君王兼主人，直接语境强调奴隶为债务求情。译为“敬拜”容易加入原文在此处并不要求的宗教含义；正文保留身体姿态与恭敬恳求，脚注则说明该词的其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奴隶”保留历史处境的力度；“俯伏”“宽容”略具庄重感，但仍属当代读者容易理解的表达。
