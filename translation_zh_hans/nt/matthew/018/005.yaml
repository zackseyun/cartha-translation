base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: zh_hans
  text: 无论谁奉我的名接待一个这样的孩子，就是接待我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接待”也可译作“欢迎”或“接纳”；希腊语动词含有这些意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“一个这样的孩子”；本节希腊原文没有“小”这个形容词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: 凡……的
  rationale: 关系代词与ἐάν构成泛指条件；“凡……的”在现代汉语中自然地表达“无论谁”的普遍含义。
- source_word: δέξηται / δέχεται
  choice: 接待 / 接待
  rationale: δέχομαι可指接收、欢迎或接纳。“接待”适合此处的人际语境，也保留两处同一动词的重复，使接待孩子与接待耶稣之间的对应清楚可见。
- source_word: ἓν παιδίον τοιοῦτο
  choice: 一个这样的孩子
  rationale: 直译该短语，并承接前文耶稣所叫来的孩子及其所代表的这一类人；本节没有“小”的对应词，因此正文不增添“小”。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 因我的名
  rationale: 该短语表示接待是以耶稣的名为根据或缘由，也涉及对他的承认。“因我的名”自然简洁，并避免把含义局限为单纯使用某种公式。
- source_word: ἐμὲ
  choice: 我
  rationale: 保留第一人称宾语，并借同一动词的重复突出孩子与耶稣之间的代表性对应。
theological_decisions:
- issue: 孩子与耶稣之间的代表性认同
  choice: 明确表达：因耶稣的名接待这样的孩子，就是接待耶稣本人。
  alternative: 弱化为这种接待仅仅是在尊敬耶稣。
  rationale: 原文以同一动词δέχομαι分别支配“一个这样的孩子”和强调形式的“我”，形成直接而有力的对应；译文保留这一点，不额外加入圣礼或教会职分方面的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，就是……”保持经文的普遍条件和鲜明对应；保留“接待”的重复，不作不必要的润饰。
