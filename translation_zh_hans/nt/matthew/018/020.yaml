  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: zh_hans
  text: 因为有两三个人奉我的名聚集的地方，我就在他们中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: 无论在哪里
  rationale: 引出地点从句；结合后面的“那里”，用“无论在哪里……那里……”自然表达这句格言式陈述。严格说“哪里”也可，但“无论在哪里”更符合现代汉语语流。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对前文的解释或依据关系。
- source_word: δύο ἢ τρεῖς
  choice: 两三个人
  rationale: 现代汉语中“两三个人”自然、准确地表达“两个人或三个人”。
- source_word: συνηγμένοι
  choice: 聚集
  rationale: 该完成时被动分词描写已经聚在一起的状态；汉语“聚集”可自然涵盖这一结果状态，不必生硬标明被动。
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: 奉我的名
  rationale: “奉……的名”是现代汉语中自然且庄重的表达，指以耶稣之名、在其权柄和归属关系下聚集，同时不把原文可能包含的关联范围缩减为单一解释。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 与前面的地点表达相呼应，保留希腊文“哪里……那里……”的结构。
- source_word: εἰμι
  choice: 就有我在
  rationale: 直接表达“我在那里/我在”的现在时断言；“就有我在”符合现代汉语习惯，又不额外规定临在的方式。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 在他们中间
  rationale: 贴近原文的空间意象，现代汉语自然；也可理解为“与他们同在”，但后者解释性更强。
theological_decisions:
- issue: 耶稣在奉其名聚集者中间的临在
  choice: 直译为“那里就有我在他们中间”，肯定耶稣真实的临在，却不界定这种临在的形态。
  alternative: 译作“我就与他们同在”，或按特定圣礼论、教会论传统加以阐释。
  rationale: 原文明确宣告耶稣的临在，但没有说明其形而上方式；译文应保留这一神学张力，不引入宗派性限定。
translation_notes:
  register: 采用自然、庄重、普通现代读者易懂的简体中文。“两三个人”比“两个人或三个人”更符合汉语表达；“奉我的名聚集”保留经文传统语感，也避免过度解释。
