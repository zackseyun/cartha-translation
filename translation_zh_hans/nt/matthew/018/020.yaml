  source_fidelity: 原译基本准确传达了γάρ、人数、奉名聚集及耶稣在聚集者中间的宣告。但“无论在哪里”较原文地点关系词οὗ略增添无条件、普遍化的语气；“那里就有我在他们中间”也未能自然对应“我在那里、在他们中间”的语序和断言。
  naturalness: “两三个人奉我的名聚集”自然且具庄重经文语体。“那里就有我在他们中间”在现代标准汉语中略显拗口，改为“我就在他们中间”更流畅、清楚。
  terminology: “奉我的名”恰当地保留了εἰς τὸ ἐμὸν ὄνομα的惯用宗教语域，且不把其所含的归属、关联或权柄意义限定为单一神学解释。“在他们中间”准确保留空间性意象。
  issues:
