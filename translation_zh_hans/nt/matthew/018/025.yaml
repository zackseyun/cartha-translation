id: MAT.18.25
reference: Matthew 18:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: zh_hans
  text: 由于他无力偿还，主人[a]便下令把他、他的妻子儿女和他所有的一切都卖掉[b]，用所得款项偿还。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”：希腊语κύριος也可译作“主”；这里指比喻中仆人的人间主人。
    reason: lexical_alternative
  - marker: b
    text: 意思是把欠债人和他的家人卖掉，并变卖他的一切财物，以所得款项偿还债务。
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: 由于他无力偿还
  rationale: 该属格独立结构说明原因；ἔχω与不定式连用在这里表示没有偿还能力。译作“无力偿还”自然准确，也避免误解为他没有任何可偿还之物，因为下文明确说他仍有家人与财物。
- source_word: ἐκέλευσεν
  choice: 下令
  rationale: κελεύω表示权威性的命令；“下令”符合主人对仆人的社会关系，也适合现代叙事语体。
- source_word: ὁ κύριος
  choice: 主人
  rationale: κύριος可指“主”或“主人”；此处在比喻的故事层面指仆人的人间主人。“主人”既自然，也不把它直接处理为神圣称号。
- source_word: πραθῆναι
  choice: 卖掉
  rationale: πιπράσκω的被动不定式表示“被卖”；中文随“下令把……”采用主动处置句式，更为自然，并保留出售人的含义。
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: 他的妻子儿女
  rationale: 定冠词所指的归属关系由上下文确定；中文补出“他的”，并以“妻子儿女”简洁表达其家人。
- source_word: πάντα ὅσα ἔχει
  choice: 他所有的一切
  rationale: 贴近原文“凡他所拥有的”，表示其全部财产，同时不把范围过度限定为某类财物。
- source_word: καὶ ἀποδοθῆναι
  choice: 用所得款项偿还
  rationale: 第二个被动不定式表达出售之后应完成偿还。中文补出由出售所得的款项，使动作关系清楚，但不具体声称足以清偿全部债务。
theological_decisions:
- issue: 比喻中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 这里直接所指是故事中仆人的人间主人。译作“主人”保留主仆关系并避免读者误以为原文在此直接使用神圣称号；比喻可能具有的神学指向则不因此被否定。
- issue: 出售家人与财物是否意味着足额清债
  choice: 用所得款项偿还
  alternative: 把债务全部还清
  rationale: 原文只说“使之偿还”，并未说明出售所得足以清偿全部巨债，因此不加入“全部还清”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“由于……便……”清楚呈现原因和结果；“把”字句适合连续列出被出售的人与物。保留原文严厉的债务处置情景，不淡化其冲击，也不额外评判其合法性或道德性质。
