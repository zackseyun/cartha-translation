source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: zh_hans
  text: “如果你的弟兄得罪了你[a]，你要去私下指出他的过错。若他听你的，你就赢得了你的弟兄[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本省略“得罪了你”，作：“如果你的弟兄犯了罪，就去私下指出他的过错。”
    reason: textual_variant
  - marker: b
    text: “弟兄”在希腊文中是阳性单数；在这里也可能较广泛地指一同作门徒的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: 得罪
  rationale: 此处与“你”（εἰς σέ）连用，译作“得罪了你”自然表达针对对方所犯的罪，同时保留道德和宗教意味。
- source_word: εἰς σέ
  choice: 你
  rationale: 融入汉语惯用表达“得罪了你”。SBLGNT正文包含此语，但抄本证据存在异文，故在脚注说明省略该短语的读法。
- source_word: ὁ ἀδελφός σου
  choice: 你的弟兄
  rationale: 保留希腊文阳性单数形式及门徒群体中的亲属称谓；其语境所指可能不限于男性，另以脚注说明。
- source_word: ὕπαγε
  choice: 你就去
  rationale: 简洁传达命令语气，并自然承接条件句。
- source_word: ἔλεγξον
  choice: 指出他的过错
  rationale: ἐλέγχω在此指揭明并使人面对过错；“指出他的过错”比“责备”少一层可能过强的严斥意味，也比单说“面对他”更明确。
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: 趁着只有你和他两个人
  rationale: 自然表达谈话只限当事双方，保留私下处理和排除旁人的重点。
- source_word: ἀκούσῃ
  choice: 听你的
  rationale: 既可包含认真听取，也可暗示接受劝告；不把含义过度限定为单纯听见或完全服从。
- source_word: ἐκέρδησας
  choice: 赢回了
  rationale: 保留κερδαίνω“赢得”的比喻，并以“回”自然表达关系中弟兄被挽回的语境含义。
theological_decisions:
- issue: ἀδελφός是否在正文中包容性展开
  choice: 你的弟兄
  alternative: 你的弟兄或姊妹／一位同信的人
  rationale: 正文遵循希腊文阳性单数形式，不以解释性包容表达取代原文；其可能泛指同作门徒者，在脚注说明。
- issue: εἰς σέ的文本异文
  choice: 正文保留“得罪了你”
  alternative: “如果你的弟兄犯了罪”
  rationale: 所指定的SBLGNT正文含εἰς σέ，因此收入正文；鉴于省略该短语的异文会影响教导范围，脚注如实保留。
- issue: ἐκέρδησας的关系性含义
  choice: 赢回了你的弟兄
  alternative: 赢得了你的弟兄
  rationale: “赢回”在汉语中自然表达劝戒成功所带来的挽回，同时保持“赢得”的比喻；不进一步界定为某种宗派性的悔改程序。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“趁着只有你和他两个人”明确表现私下交谈；“指出他的过错”准确而不过分严厉。脚注标记均置于相关正文处。
