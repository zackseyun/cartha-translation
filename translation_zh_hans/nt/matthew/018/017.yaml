  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: zh_hans
  text: 如果他不肯听他们，就把这事告诉会众[a]；如果他连会众也不肯听，对你来说，他就应当像外邦人和税吏一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“教会”或“聚会的群体”（希腊文：ekklēsia）。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: 不肯听
  rationale: 在本节劝诫与群体处理的语境中，该词不只是“没有听见”，而是拒绝听从或理会；“不肯听”自然地保留了这种意志色彩，又不强化为“违抗”。
- source_word: εἰπὸν
  choice: 把这事告诉
  rationale: 该命令要求将前文所述的事情告知群体；补出汉语所需的宾语“这事”，使表达自然，同时没有增添具体内容。
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: 会众
  rationale: ἐκκλησία在这里指聚集的共同体。“会众”既能表达群体含义，也较少带入后世宗派或机构制度；传统译法“教会”列入脚注。
- source_word: ἔστω σοι
  choice: 对你来说，他就应当
  rationale: 保留命令语气以及与格σοι所表达的“对你而言”，但按现代汉语语序作自然调整，避免直接解释成具体处置程序。
- source_word: ὥσπερ
  choice: 像……一样
  rationale: 直接保留原文的比较结构，不把比喻改写为更强的程序性命令。
- source_word: ὁ ἐθνικὸς
  choice: 外邦人
  rationale: 在犹太语境中指圣约群体之外的非犹太人；“外邦人”是现代中文圣经语境中可识别且不必然带有“异教徒”贬义的表达。
- source_word: ὁ τελώνης
  choice: 税吏
  rationale: 准确表达当时征收税款者这一身份，并与新约语境中通行、庄重的中文用语一致。
theological_decisions:
- issue: 在马太福音这一群体规劝语境中如何翻译ἐκκλησία
  choice: 会众
  alternative: 教会；聚会的群体
  rationale: “会众”保留聚集共同体这一核心意义，并避免把后世特定宗派制度预先读入经文；传统且在语境中可成立的“教会”保留在脚注中。
- issue: 如何表达对不肯听从者的态度
  choice: 对你来说，他就应当像外邦人和税吏一样
  alternative: 你要把他当作外邦人和税吏；你要把他视为局外人
  rationale: 正文保留原文的比较结构和“对你”的关系性表达，不将其扩写成一套完整的开除或绝罚程序，也不消除“外邦人和税吏”在马太福音整体叙事中可能形成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不肯听”体现持续拒绝理会的语气；“把这事告诉”补足汉语中自然需要的宾语；分号呈现两个递进条件句。
