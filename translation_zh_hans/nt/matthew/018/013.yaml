  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: zh_hans
  text: 如果他果真找到了它[a]，我实在告诉你们，他为这一只欢喜，胜过为那九十九只没有迷路的[b]欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果他找到了它。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有走失的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 如果
  rationale: καί承接上文；在现代汉语中，条件句开头不必机械译出“并且”，省去连接词可自然地延续比喻，而不损失语义。
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: 如果他碰巧找到了
  rationale: ἐὰν配合γένηται与不定式，表达带有“事情果真发生”意味的条件。“碰巧找到了”保留其偶然、未必实现的语气，也符合现代汉语表达。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 保留耶稣郑重强调话语真实性的固定表达；“实在”在庄重而现代的汉语中自然。
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: 他为这一只欢喜
  rationale: χαίρω表达喜乐、欢喜；“为……欢喜”自然呈现ἐπί加与格所标明的喜乐对象。“这一只”按羊的语境补出汉语所需量词。
- source_word: μᾶλλον ἢ
  choice: 胜过
  rationale: 直接保留比较关系，不弱化成一般性的同样欢喜，也不表达排斥九十九只的意思。
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: 那九十九只
  rationale: 希腊文没有重说“羊”，汉语用量词“只”即可承接上文并保持清楚。
- source_word: τοῖς μὴ πεπλανημένοις
  choice: 没有迷路的
  rationale: 完成时分词描写仍处于未曾偏离、走失状态的九十九只；“没有迷路的”贴合羊的比喻，并保留结果状态。
theological_decisions:
- issue: 牧人喜乐程度的比较
  choice: 直译为“为这一只欢喜，胜过为那九十九只……欢喜”
  alternative: 把比较弱化为“同样欢喜”或解释为只是夸张说法
  rationale: μᾶλλον ἢ明确构成真实比较。译文保留这一张力，既不暗示牧人不关心九十九只，也不另加关于它们相对价值的神学解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“碰巧”传达原文条件结构中特别凸显的偶然性；“欢喜”“胜过”保留比喻的力度。脚注标记均放在所说明的词语之后。
