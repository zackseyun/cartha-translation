id: MAT.18.28
reference: Matthew 18:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: zh_hans
  text: 可是，那个奴隶出去后，遇见了一个和他同作奴隶的人；那人欠他一百个第纳尔[a]。他一把抓住那人，掐着他的喉咙，说：“把你欠的都还给我！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第纳尔”是当时的银币；一个第纳尔通常相当于普通工人或士兵一天的工钱。
    reason: cultural_note
  - marker: b
    text: 或较直译：“如果你欠了什么，就还给我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 此处的受辖制身份以及主人对人的支配权在比喻中十分显著；“奴隶”比“仆人”更准确地反映当时的社会关系。
- source_word: ἐξελθὼν δὲ
  choice: 可是，……出去后
  rationale: 以自然汉语表达不定过去时分词的先行动作，并用“可是”保留δέ带出的叙事转折。
- source_word: συνδούλων
  choice: 和他同作奴隶的人
  rationale: 明确表达σύν-所含“同为、共同”的意思，同时与δοῦλος译作“奴隶”保持一致。
- source_word: ὤφειλεν
  choice: 欠
  rationale: 上下文谈论金钱债务，现代汉语用“欠”最自然直接。
- source_word: ἑκατὸν δηνάρια
  choice: 一百个第纳尔
  rationale: 保留历史货币名称，以保存本段与前文巨额债务之间的数量对比；文化背景放入脚注。
- source_word: κρατήσας
  choice: 一把抓住
  rationale: 表达动作突然而强硬，符合随后掐喉咙的暴力场景。
- source_word: ἔπνιγεν
  choice: 掐着他的喉咙
  rationale: 未完成时描绘持续进行的暴力动作；这一表达在现代汉语中清楚自然，也避免仅译“掐他”所可能产生的含混。
- source_word: Ἀπόδος
  choice: 还给我
  rationale: 债务语境中的命令是要求偿还；加“给我”自然表达债权人向欠债者索还。
- source_word: εἴ τι ὀφείλεις
  choice: 把你欠的都还给我
  rationale: 将εἴ τι的非限定意味译为“欠的都”，保持“任何所欠之物”的开放性；较直译的条件式表达收入脚注。
theological_decisions:
- issue: 比喻叙事中δοῦλος的译法
  choice: 奴隶／同作奴隶的人
  alternative: 仆人／同伴
  rationale: 本节突出受主人支配的身份及奴隶之间以暴力追债的行为，因此采用较能反映古代受辖制社会身份的“奴隶”，而不以较柔和的“仆人”淡化这种关系。
- issue: εἴ τι ὀφείλεις的开放性
  choice: 把你欠的都还给我
  alternative: 把你欠的还给我／如果你欠了什么，就还给我
  rationale: 原文可按惯用法表达非限定的“任何所欠之物”，也保留较字面的条件式理解。正文采用自然且带开放范围的汉语，脚注注明较直译形式，不将歧义完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一把抓住”“掐着他的喉咙”保留场面的突然性和暴力感；货币名采用音译并以脚注解释。脚注标记均置于正文相关词句之后。
