id: MAT.18.7
reference: Matthew 18:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: zh_hans
  text: 世界因使人跌倒的事有祸了！因为使人跌倒的事必然会出现；但那人有祸了，这使人跌倒的事由他而来！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: 有祸了
  rationale: 保留先知式警告和审判宣告的力度，并在前后两处采用相同表达，维持原文的修辞呼应。
- source_word: κόσμῳ
  choice: 这世界
  rationale: 指广泛的人类世界；“这世界”自然、庄重，也不把含义缩限为物质受造界。
- source_word: ἀπὸ
  choice: 因
  rationale: 此处表示祸患的缘由，用“因”简洁传达原因关系。
- source_word: σκάνδαλα / σκάνδαλον
  choice: 使人跌倒的事
  rationale: 既保留“跌倒”的比喻，也涵盖诱惑、冒犯和导致犯罪的事，不将词义过早缩窄；以“种种”及后文的单数表达尽量体现原文复数与单数的变化。
- source_word: ἀνάγκη
  choice: 必然
  rationale: 表达原文的必要性或不可避免性，却不说明这种必要性的根据，避免擅自引入神直接促成这些事的含义。
- source_word: ἐλθεῖν ... ἔρχεται
  choice: 出现……出现
  rationale: 现代汉语中比直译为“来”更自然，同时保留原文同一动词在两处的重复。
- source_word: πλήν
  choice: 然而
  rationale: 清楚标示从这些事必然出现转向个人责任的强烈转折。
- source_word: ἀνθρώπῳ
  choice: 那人
  rationale: 保留原文阳性单数的个体指称；脚注说明其警告具有代表性。
- source_word: δι’ οὗ
  choice: 借着那人
  rationale: 保留原文以人为媒介或责任主体的表达，不仅笼统译作“由”。
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα 所表达的必要性
  choice: 译作“必然会出现”，承认必要性或不可避免性，但不交代其根源。
  alternative: 译作“必须出现”，可能更容易被理解为强调神的预定；或译作“免不了会出现”，更偏重现实层面的不可避免。
  rationale: 原文明确表达必要性，却没有说明其基础。译文保留这一神学张力，不把它解释为神直接导致罪恶，也不削弱其力度。
- issue: ἀνθρώπῳ 的代表性
  choice: 正文保留单数个体“那人”，脚注说明警告适用于任何成为这种媒介的人。
  alternative: 译作“那个人”或“无论谁”。
  rationale: “那人”较贴近原文阳性单数形式；同时，其语境功能不限于某一已知男子，因此在脚注中说明代表性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有祸了”保留警告与审判语气；“使人跌倒的事”保留核心比喻，并通过重复维持原文的修辞结构。
