revisions:
- from: 这世界因种种使人跌倒的事[a]有祸了！使人跌倒的事必然会出现；然而，使人跌倒的事借着那人[b]出现，那人有祸了！
  to: 世界因使人跌倒的事有祸了！因为使人跌倒的事必然会出现；但那人有祸了，这使人跌倒的事由他而来！
  rationale: 修订删除“种种”，避免添加分类含义；将第二个“有祸了”恢复为直接针对“那人”的宣告，并用“由他而来”自然对应“借着他……来到”。保留“必然会出现”，以表达必要性而不说明其根源。脚注锚点应分别置于首处“使人跌倒的事”和“那人”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:57:59Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确传达了οὐαί的警告、κόσμος的广泛范围、σκάνδαλα/σκάνδαλον的复数与单数对照、以及ἀνάγκη所表达而未说明根据的必要性。不过第二分句将原文“那人有祸了，借着他这使人跌倒的事来到”的语序改为“事借着那人出现，那人有祸了”，虽不致误译，却削弱了原文将“祸”直接宣告在该人身上的焦点；“种种”也额外带入了原文没有明说的“各种类别”意味。
  naturalness: “这世界因种种使人跌倒的事有祸了”基本通顺，但“使人跌倒的事借着那人出现”稍显生硬，且后置“那人有祸了”不如直接以“但那人有祸了”自然有力。修订以“由他而来”表达人的媒介性/责任关联，保持现代庄重的普通话语体。
  terminology: “有祸了”恰当地保留审判性警告；“使人跌倒的事”可保留σκάνδαλον的比喻及其宽广语义。中文不必用“种种”强行标示复数；首处无定、泛指表达可自然涵盖原文复数，第二处以“这使人跌倒的事”保留单数。脚注a的“诱人犯罪”宜改为“诱使人犯罪”，更自然。
  issues:
  - severity: low
    issue: “种种”增加了原文未明确表达的分类色彩。
    rationale: τὰ σκάνδαλα是复数，但并不特别表示“种种类别”。汉语可用零复数的泛指表达保留其意义。
  - severity: medium
    issue: 第二个“有祸了”被置于从句之后，弱化原文对人的直接宣告。
    rationale: 原文为“但那人有祸了，借着他这使人跌倒的事来到”。调整为先宣告“那人有祸了”，更贴近原文焦点和修辞对称。
  - severity: low
    issue: “借着那人出现”略显翻译腔。
    rationale: “由他而来”在此更自然地表达δι’ οὗ的媒介性，同时不把它解释为单纯的直接制造或神学上的因果体系。
  revised_text: 世界因使人跌倒的事有祸了！因为使人跌倒的事必然会出现；但那人有祸了，这使人跌倒的事由他而来！
  revised_footnotes:
  - marker: a
    text: “使人跌倒的事”也可译作“诱使人犯罪的事”“冒犯人的事”或“陷阱”。希腊语可指使人跌倒、受诱惑或陷入罪中的事物。
    reason: lexical_alternative
  - marker: b
    text: 原文“那人”为阳性单数；这里的警告也适用于任何使这种事由他而来的人。
    reason: cultural_note
  revision_rationale: 修订删除“种种”，避免添加分类含义；将第二个“有祸了”恢复为直接针对“那人”的宣告，并用“由他而来”自然对应“借着他……来到”。保留“必然会出现”，以表达必要性而不说明其根源。脚注锚点应分别置于首处“使人跌倒的事”和“那人”之后。
