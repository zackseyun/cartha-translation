id: MAT.18.18
reference: Matthew 18:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: zh_hans
  text: “我实在告诉你们：凡你们在地上捆绑的，在天上也必已经被捆绑；凡你们在地上释放的，在天上也必已经被释放。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较传统的译法：“在天上也必被捆绑……在天上也必被释放。”希腊文可以这样理解；正文则按“将来时动词＋完成时分词”的形式翻译，可能表示到那时在天上已经成立的状态。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在句首表达郑重、权威的肯定；“我实在告诉你们”既自然庄重，也比音译“阿们”更便于普通读者直接理解。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留第一人称发言和复数直接对象，清楚传达耶稣对门徒的郑重宣告。
- source_word: ὅσα ἐὰν
  choice: 凡……的
  rationale: 表达不定关系结构的广泛范围，同时不擅自限定所指究竟是事情、规定还是人。
- source_word: δήσητε
  choice: 捆绑
  rationale: 保留δέω的基本意象及其在本段可能具有的权威或裁断含义，避免直接窄化为“禁止”。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 自然呈现与“在天上”相对的领域。
- source_word: ἔσται δεδεμένα
  choice: 必已经被捆绑
  rationale: 尝试在自然汉语中体现将来时的εἰμί与完成时被动分词所构成的结果状态，传达届时已处于被捆绑状态的含义。
- source_word: ἐν οὐρανῷ
  choice: 在天上
  rationale: 以现代汉语常用表达指向属天领域，并与“在地上”形成对应。
- source_word: λύσητε
  choice: 释放
  rationale: 保留λύω与“捆绑”相反的解除、放开意象，又比单用“松开”更适合此处庄重且可能涉及权威行动的语境；不直接解释为“准许”。
- source_word: ἔσται λελυμένα
  choice: 必已经被释放
  rationale: 与前一分句保持平行，并体现完成结果状态，而不把天上的行动简单表述为随后发生的认可。
theological_decisions:
- issue: 捆绑与释放公式中地上行动和天上状态的时间及神学关系
  choice: 译为“在天上也必已经被捆绑／释放”
  alternative: 译为“在天上也必被捆绑／释放”
  rationale: ἔσται加完成时被动分词可指向将来某时已经成立并持续的状态。正文保留地上行动与天上既成状态之间的张力，不断言天上只是追认地上的决定，也不引入特定宗派对教会权柄的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“捆绑／释放”保留原文成对的动作意象；“凡……的”保留所指对象的开放性。用“必已经被……”呈现希腊文较少见的将来完成结果状态，脚注同时给出传统译法。
