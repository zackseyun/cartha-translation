  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: zh_hans
  text: 耶稣对他说：“我告诉你，不是七次，而是七十七次[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七十个七次”。
    reason: 原文数词短语有两种可能的理解。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事现在时；现代汉语叙事中的“说”不显得突兀，也保留了原文的生动感。
- source_word: αὐτῷ
  choice: 对他
  rationale: 保留原文代词，不根据上文直接替换为“彼得”。
- source_word: Οὐ λέγω σοι
  choice: 我告诉你，不是……
  rationale: 按现代汉语习惯用“告诉你”自然表达“对你说”，并使后接的否定对比清楚流畅。
- source_word: ἕως
  choice: 到……为止
  rationale: 表达次数上的上限，与彼得所问的饶恕限度相呼应。
- source_word: ἑπτάκις
  choice: 七次
  rationale: 该副词表示动作发生的次数，直译为“七次”。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与前面的“不是”构成自然、明确的汉语对比结构。
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: 七十七次
  rationale: 这一希腊语数词短语可以理解为“七十七次”，也可以理解为“七十个七次”；正文采用前一种读法，另一种保留在脚注中。
theological_decisions:
- issue: 耶稣关于饶恕之教导中的数词歧义
  choice: 七十七次
  alternative: 七十个七次
  rationale: ἑβδομηκοντάκις ἑπτά 的句法容许两种传统理解。正文采用“七十七次”，脚注保留“七十个七次”，不把其中任何一种解释成精确的饶恕上限，也不在译文中消解原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到……为止”明确呈现次数上限的语境；引号和标点按现代简体中文规范处理。
