base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: zh_hans
  text: 他开始结算账目时，有一个欠了一万他连得债的人被带到他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: 他开始……时
  rationale: 以时间从句自然表达属格独立结构，保留主句行动发生于开始清账之际的含义；δὲ在此承接叙事，不必机械译出。
- source_word: συναίρειν
  choice: 清算账目
  rationale: 在财务语境中指核算并处理账目；“清算账目”既准确保留记账意象，也符合现代汉语表达。
- source_word: προσηνέχθη αὐτῷ
  choice: 被带到他面前
  rationale: 保留不定过去时被动态，表明此人由别人带来；“到他面前”自然表达呈到王面前的场景。
- source_word: εἷς ὀφειλέτης
  choice: 有一个……的人
  rationale: 保留εἷς所引出的一个具体个案，并用现代汉语关系结构表达“欠债者”，避免生硬的“债户”。
- source_word: μυρίων ταλάντων
  choice: 一万他连得
  rationale: μύριοι按其明确数值译为“一万”；τάλαντον采用音译并加脚注，不换算为有争议的现代金额，也保留其古代计量与货币背景。
