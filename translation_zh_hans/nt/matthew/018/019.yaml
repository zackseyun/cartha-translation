id: MAT.18.19
reference: Matthew 18:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: zh_hans
  text: 我又实在告诉你们：若你们中间有两个人在地上，就他们所求的任何事达成一致[a]，我在天上的父必为他们成就这事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “达成一致”也可译作“同心”。
    reason: lexical_alternative
  - marker: b
    text: 本节紧接18:15—18有关群体劝戒与权柄的教导；不过，本节本身以较宽泛的措辞说到共同所求之事。
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: 我又
  rationale: 承接上文，引出进一步的郑重宣告；“又”自然保留“再次、进一步”的语篇作用。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以现代汉语惯用表达传达耶稣郑重断言的语气，同时避免不必要的音译。
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: 你们中间若有两个人……同心
  rationale: “你们中间”对应ἐξ ὑμῶν；“同心”在请求之事上表达共同一致，比仅指声音和谐更符合此处συμφωνέω。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 保留与后文“在天上”的空间对照。
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: 为所求的任何事
  rationale: πρᾶγμα含义宽泛，可指任何事情或事项；“所求的”自然表达不定关系结构及αἰτέω的请求含义，不额外限定为某一类祷告或教会事务。
- source_word: γενήσεται αὐτοῖς
  choice: 就必为他们成就
  rationale: 表达将来结果，并与后面的父作为来源或施行者相衔接；“成就”比直译“发生”更适合此处请求得到实现的语境。
- source_word: παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 我在天上的父……为他们成就
  rationale: 将παρά加属格理解为行动的来源或施行者，以自然汉语明确父使所求之事实现；οὐρανοῖς虽为复数，汉语惯用“天上”。
theological_decisions:
- issue: 应许的适用范围
  choice: 正文按原文宽泛地译作“所求的任何事”，不在译文中加入额外限制。
  alternative: 明确限定为教会纪律裁决，或解释成对任何祷告都无条件兑现的保证。
  rationale: 紧接的上文涉及群体劝戒、纪律与权柄，但本节措辞本身较为宽泛。译文保留这种语境关联与字面广度之间的张力，不代替经文作教义性收窄或扩张。
- issue: παρά所表达的来源或施行关系
  choice: 采用“父……成就”，在汉语中将父呈现为使事情实现者。
  alternative: 译作“必从我父那里临到他们”，更突出来源而弱化直接施行。
  rationale: παρά加属格可突出来源，而γενήσεται与汉语“成就”结合时，以父为施行者最自然；两者在此并非截然对立。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我又实在告诉你们”保留郑重宣告的语气；“同心”“成就”是普通读者易懂且适合经文语体的表达。所有脚注标记均置于正文相应位置。
