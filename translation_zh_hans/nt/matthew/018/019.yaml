  source_fidelity: 译文整体准确传达了郑重宣告、两人一致、所求事项及天父使其实现的将来应许。惟“为所求的任何事同心”在汉语中修饰关系不够清晰，容易被读作“为祈求某事而同心”，未明确表达“就所求之事达成一致”。
  naturalness: “我又实在告诉你们”及“我在天上的父”符合庄重、现代的经文语体。将 συμφωνήσωσιν 明确译为“就……达成一致”，能使句法更自然，也更准确呈现 συμφωνέω 与 περὶ 的关系。
  terminology: “实在告诉你们”“在地上”“我在天上的父”“成就”均适切。“达成一致”是对 συμφωνέω 的清楚现代表达；脚注保留“同心”这一较具经文语感的替代译法。
