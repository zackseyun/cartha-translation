id: MAT.18.1
reference: Matthew 18:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: zh_hans
  text: 那时，门徒来到耶稣跟前，说：“那么，谁在天国里更大呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 那时
  rationale: 按现代汉语自然表达时间背景；不机械译成“在那一个时辰”。
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: 来到耶稣跟前
  rationale: 准确表达门徒主动走近耶稣的动作，语气自然庄重。
- source_word: ἄρα
  choice: 那么
  rationale: 保留由前情引出的推论或追问语气。
- source_word: μείζων
  choice: 更大
  rationale: 保留希腊文比较级，不擅自改成最高级“最大”；“大”在此自然表示地位或尊荣。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 采用马太福音这一固定表达在现代中文中的通行译法。
theological_decisions:
- issue: μείζων 是比较级，但问题涉及天国中的地位排序
  choice: 更大
  alternative: 最大
  rationale: 原文明确使用比较级，且没有明说比较对象；译文保留这种形式及其张力，不以最高级解释替代原文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“来到耶稣跟前”清楚呈现接近的动作；问句保留原文比较级造成的开放性。
