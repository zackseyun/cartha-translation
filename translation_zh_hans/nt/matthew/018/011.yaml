  language: zh_hans
  text: 因为人子来，是要拯救失丧的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本，包括四世纪的《西奈抄本》和《梵蒂冈抄本》，也不见于早期科普特文译本；但五世纪的《伯撒抄本》、拜占庭多数文本传统和拉丁文《武加大译本》收有本节。它可能是后来的抄写员为与路加福音19:10一致而补入的。
    reason: textual_critical
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 保留本节与上文之间的因果说明关系。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是福音书中固定而庄重的称谓，中文惯译“人子”既简洁，也保留其经文互文与神学张力。
- source_word: σῶσαι
  choice: 拯救
  rationale: 在此救赎语境中，σῴζω表示从失丧和毁灭中救回；“拯救”是自然且准确的现代汉语表达。
- source_word: τὸ ἀπολωλός
  choice: 失丧的
  rationale: 中性单数完成时分词作名词使用，字面可指“那已经失丧的”；译为“失丧的”保留其概括性，不擅自限定为某个具体个人或群体。
theological_decisions:
- issue: τὸ ἀπολωλός所指对象的范围
  choice: 采用不明确限定对象的“失丧的”
  alternative: 失丧的人／那失丧的一个
  rationale: 希腊文使用中性单数实体化分词，语法上没有明说“人”，也可带集合或概括意味；正文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“来，是要……”自然表达不定式所示的目的；正文保留拜占庭底本内容，并用脚注如实交代重要的文本异读。
