lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫来
  rationale: 该词表示把人召到自己跟前；“叫来”自然简洁，也保留了动作方向。
- source_word: παιδίον
  choice: 一个孩子
  rationale: 此处泛指儿童，译作“一个孩子”符合现代汉语叙事表达，不额外限定年龄或性别。
- source_word: ἔστησεν αὐτό
  choice: 让他站
  rationale: 使役形式表示耶稣使孩子站立；“让他站”比单纯“把他放”更准确地保留站立之意。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 在他们中间
  rationale: 直接保留空间关系，并符合自然、庄重的现代汉语。
