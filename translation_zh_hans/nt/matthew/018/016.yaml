id: MAT.18.16
reference: Matthew 18:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: zh_hans
  text: 但他若不听，就再带上一两个人同去，好让每一件事都凭两三个见证人的口[a]得以确定。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭两三个见证人的见证”。
    reason: lexical_alternative
  - marker: b
    text: 这里呼应申命记19:15；那里规定，一件事须凭两三个见证人才可确定。
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: 听
  rationale: 本语境中的“听”不只是听见声音，也包含听从、理会之意；中文“若不听”自然保留了这层语用含义。
- source_word: παράλαβε μετὰ σοῦ
  choice: 带……跟你一起去
  rationale: παράλαβε表示带上某人，μετὰ σοῦ表示陪同；合译既保留命令的具体行动，也符合现代汉语表达。
- source_word: ἔτι ἕνα ἢ δύο
  choice: 另外……一两个人
  rationale: ἔτι在这里表示再增加；“另外”清楚表明这些人是在先前两人之外加入的，同时“一两个人”准确表达ἕνα ἢ δύο。
- source_word: ἵνα
  choice: 好让
  rationale: 表达目的，语气自然，并保留原文的目的从句关系。
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: 凭两三个见证人的口
  rationale: 保留闪语式法律用语及其对申命记19:15的呼应；中文仍可理解为凭见证人的陈述，脚注列出较解释性的译法。
- source_word: σταθῇ
  choice: 得以确定
  rationale: 在法律和查证语境中表示一件事被确立、证实；“得以确定”兼顾被动意味与现代汉语可读性。
- source_word: πᾶν ῥῆμα
  choice: 每一件事
  rationale: ῥῆμα字面可指话语，但在申命记法律公式及当前处境中指需要查明或确立的事项；“每一件事”保留一定宽度，避免缩窄为“指控”。
theological_decisions:
- issue: 旧约法律见证公式在群体劝戒语境中的运用
  choice: 以清楚的法律性汉语表达，同时保留“凭……的口”这一经文惯用语
  alternative: 译作“凭两三个见证人的见证，使每一项指控得到证实”
  rationale: 原文呼应申命记19:15，却没有把πᾶν ῥῆμα明确限定为“指控”。正文因此保留较宽的“每一件事”和原有的“口”之意象，不预先裁定这些同行者只是后来过程的见证人，还是也须就原争议作证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若不听”“另外带上一两个人”等表达简明自然；“凭……的口”刻意保留圣经法律用语，其解释置于脚注。
