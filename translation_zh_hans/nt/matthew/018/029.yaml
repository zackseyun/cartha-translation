  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: zh_hans
  text: 于是，和他一同作奴仆的人[a]俯伏在他面前，恳求他说：“请对我宽容些，我会还给你的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的同奴仆”；指与他同属一位主人的奴仆。也可译作“他的同伴仆人”。
    reason: 说明σύνδουλος所表达的共同主人关系，并提供较弱身份用语的替代译法。
lexical_decisions:
- source_word: σύνδουλος
  choice: 与他同作奴仆的人
  rationale: 该词指与某人同属一位主人的奴仆。译文既保留受主人支配的身份，也用现代汉语清楚表达“同作”的关系。
- source_word: πεσών
  choice: 俯伏在他面前
  rationale: 该分词描写为恳求而伏下身子的动作；“俯伏在他面前”自然呈现谦卑求情的姿态。
- source_word: παρεκάλει
  choice: 恳求
  rationale: 未完成时在此描写持续或反复的迫切请求；“恳求”符合债务人求宽限的语境，又不显古奥。
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: 请宽容我
  rationale: 这一搭配是请求对方暂且忍耐、宽限。汉语“宽容我”能兼顾忍耐与暂缓追讨的语境含义，而不擅自加入具体期限。
- source_word: ἀποδώσω σοι
  choice: 我会还给你的
  rationale: ἀποδίδω在债务语境中表示偿还；未来时表达说话人的承诺。原文此处没有“全部”一词，因此不予增补。
- source_word: οὖν
  choice: 于是
  rationale: 此处连接前文并推动叙事；“于是”比推论色彩更强的“所以”更符合现代汉语叙事。
theological_decisions:
- issue: σύνδουλος所表达的受辖制身份
  choice: 正文译作“与他同作奴仆的人”
  alternative: 同伴；同作仆人的人
  rationale: 比喻中的人物处在主人权下，“奴仆”较完整地保留了原词所指的社会身份；同时用“同作”表明二人同属一位主人，避免把该词仅理解为一般同伴。
- issue: 偿还承诺的范围
  choice: 译作“我会还给你的”，不增添“全部”
  alternative: 我会全部还给你的
  rationale: 本节希腊文本只有ἀποδώσω σοι，并无πάντα。即使上下文可能暗示偿清债务，也不应在本节正文中把这一范围明确化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏”“恳求”“宽容”保留求情场景的郑重感；避免使用“忍耐我”“恒久忍耐”等生硬或容易产生宗教术语色彩的表达。
