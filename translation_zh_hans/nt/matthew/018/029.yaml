  rationale: 修订“同作奴仆”结构以符合现代汉语，并更准确说明σύνδουλος的词义；将请求语气调整为“请对我宽容些”，较清楚体现债务人请求对方耐心宽限，同时不增添原文未明说的期限或偿还范围。
