  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: zh_hans
  text: 他说：“我实在告诉你们：你们若不回转，变得像孩子一样[a]，就绝不能[b]进入天国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为带定冠词的复数，直译可作“像那些孩子一样”；也可泛指“像孩子一样”。这或许呼应上文耶稣置于门徒中间的孩子。
    reason: lexical_alternative
  - marker: b
    text: “绝不能”原文采用强调的否定形式。
    reason: translation_clarity
lexical_decisions:
- source_word: Ἀμὴν
  choice: 实在
  rationale: 在庄严宣告公式中表达郑重、权威的肯定；“我实在告诉你们”自然、庄重，也为现代中文读者所熟悉。
- source_word: στραφῆτε
  choice: 回转
  rationale: 该词在此可作不及物或被动理解，表示决定性的转向。“回转”保留这种属灵和方向性的力度，又不把它限定为后来的技术性术语“归信”或“悔改”。
- source_word: γένησθε
  choice: 变得
  rationale: 直接表达状态的改变，并与前面的“回转”构成两个并列动作。
- source_word: ὡς τὰ παιδία
  choice: 像孩子一样
  rationale: 冠词可指孩子这一类，也可能呼应上文耶稣叫到他们中间的那个孩子。中文用泛指单数“孩子”最自然，同时不擅自加入“天真”“谦卑”等具体品质。
- source_word: οὐ μὴ εἰσέλθητε
  choice: 绝不能进入
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不能”在现代中文中清楚保留其强调语气。
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音的特征性用语；“天国”是准确、简洁且通行的现代中文表达。
theological_decisions:
- issue: στραφῆτε所表达的转变
  choice: 译作“回转”，不采用技术化的“归信”或“皈依”
  alternative: 被转变；归信；悔改
  rationale: 希腊文要求一种决定性的转向，却没有规定后世神学体系中的具体归信术语；“回转”也保留动词在语态上的一定开放性。
- issue: “像孩子一样”具体指什么品质
  choice: 保留比较本身，不在正文中解释为天真、无辜、单纯或谦卑
  alternative: 像孩子那样谦卑；像小孩子那样纯真
  rationale: 本节只提出成为像孩子一样的要求，并未在句内明确界定所比较的品质；翻译不应提前消除这种诠释空间。
- issue: 进入天国的强烈否定
  choice: 译作“绝不能进入”
  alternative: 永远不能进入；断不能进入
  rationale: 既体现οὐ μή的强调作用，又不把否定额外解释成时间意义上的“永远”。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“我实在告诉你们”和“天国”延续读者熟悉的圣经语体；“回转、变得像孩子一样”保持清楚易懂，同时避免教派化术语。脚注标记均置于正文对应位置。
