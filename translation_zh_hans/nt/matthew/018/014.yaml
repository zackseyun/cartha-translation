  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: zh_hans
  text: 同样，你们在天上的父不愿意这些小子中有一个灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迷失。”希腊语动词既可表示“灭亡”，也可表示“迷失”；紧接前文迷失的羊这一语境，后者尤为贴切。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: 同样
  rationale: 承接前面迷羊的比喻及其应用，简洁表达“照样、同样”的关联。
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: 你们的父也不愿
  rationale: 希腊语直译近于“在你们的父面前并不是旨意”；此处用现代汉语自然表达其意愿，同时“也”承接 οὕτως。
- source_word: τοῦ ἐν οὐρανοῖς
  choice: 在天上的
  rationale: 保留原文的方位修饰；希腊语“诸天”为惯用复数，汉语用单数“天上”更自然。
- source_word: ἵνα ἀπόληται
  choice: 灭亡
  rationale: ἀπόλλυμι 可指灭亡，也可指迷失；正文保留较强的负面结局，另以脚注注明紧邻语境支持的另一义。
- source_word: ἓν τῶν μικρῶν τούτων
  choice: 这小子中的任何一个
  rationale: “任何一个”自然传达否定范围内连一个也不例外；“小子”保留对卑微者或门徒的开放指称，不限定为幼童。
theological_decisions:
- issue: ἀπόληται 与前文迷羊比喻的关系
  choice: 灭亡
  alternative: 迷失
  rationale: 该动词既可能表达毁灭、灭亡，也可能表达失落、迷失。正文不削弱警告的严重性，脚注则保留迷羊语境所突出的含义。
- issue: “小子”的指称范围
  choice: 小子
  alternative: 小孩子
  rationale: 上下文可能涉及在门徒群体中卑微、易受伤害的人，不宜将指称严格限定为儿童。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不愿”比生硬的“在……面前不是旨意”更符合汉语表达；“小子”保持经文中的关系性和比喻空间。
