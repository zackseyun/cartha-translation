source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
translation:
  language: zh_hans
  text: 因此，天国好比[b]一个王，他想要同自己的奴隶[a]清算账目。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”或“奴仆”；希腊文δοῦλοι强调他们在王权下受支配的隶属身份。
    reason: alternative_reading
  - marker: b
    text: “好比”直译为“被比作”或“被比拟为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 保留与上文教导之间的推论和因果联系，同时符合现代汉语叙述习惯。
- source_word: ὡμοιώθη
  choice: 好比
  rationale: 自然表达被动式“被比作”的比较功能；具体被动态另在脚注说明，以免正文生硬。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音中该固定表达在现代中文里的通行、简洁译法，指神的统治领域或王权。
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: 一个王
  rationale: βασιλεῖ说明ἀνθρώπῳ的身份；中文无需逐字译作“一个人，就是一个王”。“王”也比仅指现代政体的“国王”更宽泛。
- source_word: ἠθέλησεν
  choice: 要
  rationale: 在此自然表达王的意愿和打算，简洁且符合叙事语体。
- source_word: συνᾶραι λόγον
  choice: 清算账目
  rationale: 准确传达核对并结清账项、要求交账的经济和问责含义。
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: 和自己的奴仆
  rationale: “奴仆”保留δοῦλοι受主人支配、并非普通雇员的身份，同时比单用“奴隶”更贴合王室管事及账务场景。
theological_decisions:
- issue: 王国与王的比喻关系
  choice: 译作“天国好比一个王”，保留原句表面的比较结构
  alternative: 意译为“天国的情形好比一个王……”
  rationale: 原文确实把“天国”与“一个王”相比较，虽可理解为天国情形或运作方式的类比，但正文不擅自补足，以保存比喻表达的张力。
- issue: δοῦλος在王室经济场景中的身份含义
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “奴仆”兼顾其受主人支配的隶属身份与承担王室事务的功能，不将其弱化为普通受雇仆役，也避免“奴隶”在中文中可能过度突出劳役形象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“清算账目”保留财务核算与追责的双重意味；分号使“王”及其行动的关系清晰。
