  rationale: 修订仅处理可安全确定的表达问题：以“谁若”改善条件句；以“把他沉在外海里”恢复原文被动结果并避免抒情增饰；在“驴拉的磨石”中补出由文化语义所蕴含的“大”，并在脚注中说明。保留“小子”“信我的”“跌倒”，以维持原文在儿童意象与卑微／脆弱信徒之间的开放性，且不作教义性限定。
