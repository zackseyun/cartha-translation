  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: zh_hans
  text: 但谁若使这些信我的小子中的一个跌倒[a]，倒不如在他的脖子上挂一块驴拉的大磨石[b]，把他沉在外海里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使……犯罪”。希腊文这个动词可指使人跌倒、离弃信仰或犯罪。
    reason: lexical_alternative
  - marker: b
    text: 直译：“驴的磨石”，指由驴拉动的大磨石，不是用手转动的小磨石。
    reason: cultural_note
  - marker: c
    text: 或译：“沉入深海”。希腊文此处指开阔的海域或外海。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: 使……跌倒
  rationale: 保留希腊文的绊跌隐喻，并涵盖引人犯罪、使人离弃信仰或导致属灵败坏等语义，不将含义收窄为单纯“犯罪”。
- source_word: μικρῶν τούτων
  choice: 这些……小子
  rationale: “小子”既可呼应上下文中的孩子，也可指卑微、弱小或易受伤害的门徒，避免限定为实际年龄幼小的儿童。
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: 信我的
  rationale: 直接、自然地表达以耶稣为信靠对象，并明确这些“小子”是信徒。
- source_word: συμφέρει αὐτῷ
  choice: 倒不如
  rationale: 在严厉警告的反事实比较中，“倒不如”比字面的“对他有益”更符合现代汉语，同时保留比较意味。
- source_word: μύλος ὀνικὸς
  choice: 一块驴拉的磨石
  rationale: 明确这是由驴拉动的大磨石，而非手推的小磨石，保留原文具体的文化图像。
- source_word: καταποντισθῇ
  choice: 让他沉入
  rationale: 表达被投入深水并沉没的被动结果；与“大海”搭配自然，也不额外强化原文未明说的施事者。
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: 茫茫大海
  rationale: πέλαγος指远离岸边、辽阔而深的外海；“茫茫大海”自然传达其开阔无边的意象。
theological_decisions:
- issue: “这些小子”的指涉范围
  choice: 保留为“这些信我的小子”，可包括卑微、弱小或易受伤害的信徒
  alternative: 限定译为“这些信我的小孩子”
  rationale: 眼前的孩子构成语境中的具体形象，但“信我的”使该称呼也能指具有卑微、弱小特征的门徒；译文不强行排除任何一层。
- issue: σκανδαλίσῃ所指的属灵危害
  choice: 译作“使……跌倒”，保留开放性
  alternative: 明确译作“使……犯罪”或“使……离弃信仰”
  rationale: 该动词可能涉及犯罪、跌倒或背离；用隐喻性表达可保留原文的语义张力，不预先裁定具体后果。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“小子”较“小孩子”宽泛，可保留上下文中儿童与卑微信徒之间的联系；“驴拉的磨石”解释性适中且形象明确。所有脚注标记均置于对应词语之后。
