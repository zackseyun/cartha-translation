  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: zh_hans
  text: 那时，彼得走到耶稣跟前，说：“主啊，我的弟兄得罪我，我要饶恕他多少次呢？最多七次吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”原文为阳性单数；在本段语境中，也可能广指同作门徒的人，包括姊妹。
    reason: 说明原文的语法性别及其可能的语境范围。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间兼叙事衔接语，既可承接上文，又符合现代汉语叙事习惯。
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: 彼得走到耶稣跟前，说
  rationale: προσέρχομαι表示走近、来到跟前；将代词所指的耶稣明说，可避免汉语中的指代含混，同时保留普通陈述动词“说”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος在对耶稣直接称呼中的敬称及其潜在神学意味；“啊”自然表达汉语呼格。
- source_word: ποσάκις
  choice: 多少次
  rationale: 这里询问次数，且下文提出具体数字七次；“多少次”比“多久一次”更准确自然。
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: 得罪我
  rationale: 直译为“向我犯罪”在现代汉语中生硬；“得罪我”自然表达罪行或过犯以说话者为对象。
- source_word: ὁ ἀδελφός μου
  choice: 我的弟兄
  rationale: 保留阳性单数形式及门徒群体语境中的传统称谓，不在正文中扩大为“弟兄姊妹”。
- source_word: καὶ ἀφήσω αὐτῷ
  choice: 我要饶恕他
  rationale: ἀφίημι在此伦理语境中意为饶恕；“我要”保留将来时所表达的反复情境和说话者的行动。
- source_word: ἕως ἑπτάκις
  choice: 最多七次吗
  rationale: ἕως在此提出次数上限；“最多七次吗”清楚呈现彼得所设想的界限。
theological_decisions:
- issue: ἀδελφός在本段中的范围
  choice: 正文译为“我的弟兄”
  alternative: “我的弟兄或姊妹”或“同作门徒的人”
  rationale: 希腊文为阳性单数，正文保留其形式；在门徒群体语境中可能广指同作门徒的人，这一可能性用脚注说明，不在正文中直接判定。
- issue: 饶恕次数问题的句法关系
  choice: 译作“我的弟兄得罪我，我要饶恕他多少次呢？”
  alternative: 较贴近形式地译作“我的弟兄得罪我，而我饶恕他，要到多少次呢？”
  rationale: 希腊文以两个将来时从句相连，字面结构在汉语中不够自然；现译保留问题焦点，即面对反复得罪时饶恕应有多少次，不预先引入下一节的回答。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“走到耶稣跟前”清楚交代动作和所指；“得罪”“饶恕”沿用普通读者熟悉的圣经伦理用语。脚注标记置于整句之后，避免打断彼得的问题。
