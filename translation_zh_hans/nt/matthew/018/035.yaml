id: MAT.18.35
reference: Matthew 18:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: zh_hans
  text: 如果你们各人不从心里饶恕自己的弟兄[a]，我的天父也要这样待你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”对应希腊文的阳性单数；在这里具有代表性，指每一位同作门徒或同信的人。
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: 也要这样
  rationale: 承接前面的比喻，把主人处置仆人的方式应用到听众身上；既保留比较与推论意味，也符合现代汉语表达。
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: 我的天父
  rationale: 准确表达“我的”以及 οὐράνιος 所指的属天限定；“天父”是自然、庄重且广为理解的现代汉语说法。
- source_word: ποιήσει ὑμῖν
  choice: 待你们
  rationale: 在“也要这样”的照应下，自然表达神将按比喻所示对待听众；不把具体审判性质扩写进正文。
- source_word: ἐὰν μὴ
  choice: 如果……不
  rationale: 直接保留否定条件句的结构与警告语气。
- source_word: ἀφῆτε
  choice: 饶恕
  rationale: 在债务比喻和人际过犯的语境中，ἀφίημι 表示赦免、饶恕；“饶恕”庄重而易懂。
- source_word: ἕκαστος
  choice: 你们各人
  rationale: 体现单数分配词对复数听众中每一个人的要求。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 自己的弟兄
  rationale: 保留希腊文阳性单数形式及其反身所属关系；其在语境中的代表性范围由脚注说明。
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: 从心里
  rationale: 这是现代汉语表达真诚、内在饶恕的自然说法；虽未逐字保留希腊文“你们的众心”之复数形式，却由“你们各人”清楚呈现逐人的内心要求。
theological_decisions:
- issue: 警告的范围与力度
  choice: 直译为天父将照比喻所示“这样待你们”，保留严肃的条件性警告。
  alternative: 将其弱化为一般管教，或明确扩写为永恒定罪、失去奖赏等特定系统神学结论。
  rationale: 经文本身把警告与前述主人对仆人的处置相连，却没有在本节界定该审判的完整神学类别，因此不加以软化或教义化扩写。
- issue: ἀδελφῷ 的性别与指称范围
  choice: 正文译作“自己的弟兄”，脚注说明其代表性用法。
  alternative: 正文译作“弟兄姊妹”“其他信徒”或“同伴”。
  rationale: 希腊文为阳性单数；保留原文形式，同时说明在本语境中泛指每一位同作门徒或同信的人。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“如果你们各人不……，我的天父也要……”保留原文条件句和结论之间的力度；“从心里饶恕”采用自然汉语惯用表达，突出真诚、内在的饶恕。
