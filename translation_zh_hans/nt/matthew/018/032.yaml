  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: zh_hans
  text: 于是，主人把他叫来，对他说：“你这邪恶的奴仆[a]！你所欠的那笔债，我全都给你免了[b]，因为你恳求过我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“奴隶”或“仆人”。希腊词δοῦλος表示隶属于主人的人；这里比喻中的主从关系十分重要。
    reason: lexical_alternative
  - marker: b
    text: “免了”也可译作“免除了”或“赦免了”。希腊词在这里指免去债务，也常用来表示赦免过犯。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接比喻中的事件发展，既表达时间先后，也自然体现叙事推进。
- source_word: προσκαλεσάμενος
  choice: 把他叫来
  rationale: 准确表达“叫到自己跟前”的意思，并体现主人在此处的权威行动。
- source_word: ὁ κύριος αὐτοῦ
  choice: 主人
  rationale: 此处指奴仆的主人，并非直接用作神圣称号；“主人”符合比喻中的社会关系。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 希腊文使用历史现在时；现代汉语叙事中自然译为过去发生的动作。
- source_word: Δοῦλε πονηρέ
  choice: 你这邪恶的奴仆
  rationale: 保留对其道德品格的严厉谴责；“奴仆”同时体现受主人支配的身份，又比单用“奴隶”更符合现代中文比喻叙事的语体。
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: 你欠的那一切债
  rationale: 明确ὀφειλή是所欠债务，并自然表达πᾶσαν与ἐκείνην的整体和回指含义。
- source_word: ἀφῆκά σοι
  choice: 我都给你免了
  rationale: 在债务语境中直接表达免除债务，同时“免”仍可与赦免语义形成联系，不把该动词仅限于商业性的取消。
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: 因为你恳求过我
  rationale: ἐπεὶ说明主人免债的缘由；“恳求”体现迫切请求，“过”自然指向先前已发生的求告。
theological_decisions:
- issue: 比喻中δοῦλος的身份称谓
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 此处主从之间的隶属关系是比喻的重要背景。“仆人”可能淡化这一点，而“奴隶”在现代中文中容易使读者只联想到近现代奴隶制度；“奴仆”较好地兼顾身份准确性与经文语体。
- issue: 债务语境中ἀφίημι的译法
  choice: 免了
  alternative: 赦免了；取消了；免除了
  rationale: 上下文直接涉及债务，故正文采用自然的“免了”；同时不使用纯商业化的“取消”，以保留该词与马太福音中“赦免”主题的语义联系。脚注说明这一双重含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把他叫来”比“召来”更自然，“邪恶”保留责备的力度；句序基本贴近希腊文，同时调整为流畅的现代汉语表达。
