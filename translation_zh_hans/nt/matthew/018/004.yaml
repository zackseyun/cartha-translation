id: MAT.18.4
reference: Matthew 18:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: zh_hans
  text: 所以，谁像这个孩子一样谦卑自己，谁在天国里就是最大的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις οὖν
  choice: 所以，谁
  rationale: ὅστις在此具有概括性的条件意味；译作“谁”自然表达“无论谁”的开放范围，οὖν承接上文，译作“所以”。
- source_word: ταπεινώσει ἑαυτόν
  choice: 谦卑自己
  rationale: 保留主动使自己降卑的反身表达，也沿用现代中文基督教语境中清楚而庄重的措辞。
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: 像这个孩子一样
  rationale: 直接保留比较结构，不把孩子的具体特质扩释为天真、单纯或地位卑微。
- source_word: ὁ μείζων
  choice: 最大的
  rationale: 原文是带冠词的比较级，以最高级意义使用；“最大的”准确而自然。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 在天国里
  rationale: “天国”是马太福音这一固定表达在现代中文中的简洁、通行译法。
theological_decisions:
- issue: 孩子作为比较对象的确切含义
  choice: 不作解释性扩充，仅译“像这个孩子一样谦卑自己”
  alternative: 译为“像这个孩子一样降卑到卑微的地位”或加入“单纯”之类特质
  rationale: 经文本身强调“谦卑自己”，但未明确界定比较涉及孩子的哪一社会或心理特征；译文应保留这一解释空间。
- issue: 主句中的强调代词οὗτος
  choice: 用“谁……谁……”结构体现指回与强调
  alternative: 省去指回，译作“谁……就是最大的”
  rationale: 原文οὗτος明确回指前述之人；汉语“谁……谁……”既自然，也能保留“正是此人”的强调，而不显生硬。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“谦卑自己”保留经文的反身行动意味；全句以“谁……谁……”呈现希腊文的概括条件与强调回指。
