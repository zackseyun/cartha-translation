id: MAT.18.34
reference: Matthew 18:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: zh_hans
  text: 他的主人动了怒，把他交给施刑的人，直到他偿清所欠的一切[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主”。希腊文是 kyrios；这里在比喻中指仆人的主人，所以正文译作“主人”。
    reason: alternative_reading
  - marker: b
    text: 或译“折磨人的人”；较弱可译“狱卒”。希腊文所指的是施加拷打或折磨的人，并非仅仅普通看守。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: 动了怒
  rationale: 不定过去时被动形分词在此作状语，表达主人发怒后采取行动；“动了怒”自然、庄重，也保留事件推进和情绪力度。
- source_word: κύριος
  choice: 主人
  rationale: 此处指比喻中仆人的人间主上；译为“主人”最符合叙事关系，也避免在正文中直接引入神学头衔。
- source_word: παρέδωκεν
  choice: 交给
  rationale: 表达把人移交到他人控制之下，符合此处惩处和拘押的语境。
- source_word: βασανισταῖς
  choice: 施刑的人
  rationale: 该词指施加拷打或折磨者，不只是普通看守；“施刑的人”保留其严厉含义，同时比“拷刑者”更自然易懂。
- source_word: ἕως οὗ
  choice: 直到
  rationale: 准确表达以随后事件为终点的时间关系。
- source_word: ἀποδῷ
  choice: 偿清
  rationale: 在欠款语境中表示归还、偿付；虚拟语气与ἕως οὗ连用，指向预期的终点。“偿清”自然地传达全部付清之意。
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: 所欠的一切
  rationale: 贴近原文“所有欠着的”，既保留表达的广度，又不必把它收窄为明说的“债款”。
theological_decisions:
- issue: κύριος是否应按神学头衔译为“主”
  choice: 主人
  alternative: 主
  rationale: 在比喻内部，该词直接指仆人的主人。采用“主人”保留叙事层面的明确所指，而不妨碍读者理解比喻可能具有的神学指向。
- issue: βασανισταῖς在审判性比喻中的严厉程度
  choice: 施刑的人
  alternative: 折磨人的人；狱卒
  rationale: 原词明确包含施加痛苦或拷打的含义；“狱卒”会弱化词义。“施刑的人”保留警告的严厉性，但不进一步裁定比喻所涉及的终末审判性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“动了怒”保持叙事力度；“施刑的人”兼顾原词的严厉性与中文自然度。正文中的脚注标记[a][b]均已对应列出。
