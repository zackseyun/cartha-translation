id: MAT.18.30
reference: Matthew 18:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: zh_hans
  text: 可是他不肯，反而去把那人扔进监牢，直到他还清所欠的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他偿还所欠的款项。”
    reason: “还清所欠的”自然表达了偿付完成；原文 τὸ ὀφειλόμενον 也可更明确地理解为“所欠的款项”。
lexical_decisions:
- source_word: ὁ δὲ
  choice: 可是他
  rationale: 定冠词在这里作名词性用法，回指前文那位仆人；“可是他”自然表达了 δέ 的转折。
- source_word: οὐκ ἤθελεν
  choice: 不肯
  rationale: θέλω 表示意愿；结合对方先前的恳求，“不肯”简洁保留其意志上的拒绝，又不额外说明原因。
- source_word: ἀλλὰ ἀπελθὼν
  choice: 反而去
  rationale: “反而”体现 ἀλλά 的强烈对照，“去”以自然汉语表达分词所示的先行动作。
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: 把那人扔进监牢
  rationale: βάλλω 比中性的“关进”更有力度；“扔进”保留行为的粗暴感，“那人”清楚回指欠债的同伴。
- source_word: ἕως οὗ ἀποδῷ
  choice: 直到他还清
  rationale: ἕως οὗ 加虚拟语气指向预期的时间界限；“直到……还清”在现代汉语中自然，并体现偿付完成。
- source_word: τὸ ὀφειλόμενον
  choice: 所欠的
  rationale: 保留名词化分词“所欠之物／款项”的表达，不将其不必要地限定为某种特定债务。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不肯”“反而”凸显上下文中的拒绝与对照；“扔进监牢”保留原文动词的力度。脚注标记置于所注释的句末。
