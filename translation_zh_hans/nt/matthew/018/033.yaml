  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow slave[a], as I also had mercy on you?
translation:
  language: zh_hans
  text: 你不也本该怜悯和你同作奴仆的人[a]，正如我也怜悯了你一样吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的同伴仆人”。希腊语“σύνδουλος”指与自己同属一位主人的奴仆。
    reason: 说明原词所强调的共同主人及受辖身份，并提供较传统的译法。
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: 不也本该……吗
  rationale: ἔδει表示道德上的必要或责任；结合否定式反问和过去语境，“不也本该……吗”自然传达责备及未尽责任之意。
- source_word: καὶ
  choice: 也
  rationale: 表明此人理应以自己先前蒙受的方式同样对待同伴，保留对应关系。
- source_word: ἐλεῆσαι / ἠλέησα
  choice: 怜悯 / 怜悯
  rationale: 两处采用同一词语，以保留ἐλεάω的词汇重复；“怜悯”兼具自然表达与伦理、神学分量。
- source_word: τὸν σύνδουλόν σου
  choice: 和你一同作奴仆的人
  rationale: σύνδουλος指同属一位主人的奴仆。“一同作奴仆的人”既保留共同受主人支配的身份，也比生硬的“同奴”更符合现代汉语。
- source_word: ὡς κἀγὼ
  choice: 像我……一样
  rationale: ὡς引出比较，κἀγώ包含“我也”的对应意味；汉语比较结构已清楚呈现双方行为的对照，无须机械重复“也”。
theological_decisions:
- issue: σύνδουλος中δοῦλος词族的译法
  choice: 和你一同作奴仆的人
  alternative: 你的同伴仆人；与你一同服侍的人
  rationale: 本比喻以君王、债务和受其权辖者为背景，受约束并同属一主的身份不可淡化，因此正文采用“奴仆”；脚注列出较传统但可能弱化受辖意味的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“本该”体现回顾性的责问，“像……一样吗”保持原文反问的力度。正文中的脚注标记与脚注完全对应。
