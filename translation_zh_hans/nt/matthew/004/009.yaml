  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: zh_hans
  text: 他对他说：“我会把这一切都给你，只要你俯伏敬拜我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向我下拜”或“向我表示敬意”。希腊语动词可指下拜或表示敬意，但本处上下文更倾向“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: 他又对他说
  rationale: 保留原文的代词表达，不在本句中补入人物姓名；“又”自然承接叙事，同时不额外强化时间先后。
- source_word: Ταῦτά σοι πάντα δώσω
  choice: 这一切我都要给你
  rationale: “这一切”保留中性复数指示语及 πάντα 的总括意味，指向上一节展示的万国及其荣华；“都要给你”自然表达将来时的许诺或提议。
- source_word: ἐὰν
  choice: 只要
  rationale: 引出提议所附的条件；现代汉语中“只要”能清楚表达该条件关系，与前面的许诺衔接自然。
- source_word: πεσὼν
  choice: 俯伏
  rationale: 保留身体俯身伏地的具体动作；比单纯“跪下”更贴近原词在此处的形象，也不必机械复制希腊语分词形式。
- source_word: προσκυνήσῃς μοι
  choice: 敬拜我
  rationale: 结合试探的宗教语境以及下一节关于唯独敬拜神的回应，“敬拜我”最能传达此处的分量；该动词较宽的语义范围则在脚注中保留。
theological_decisions:
- issue: 撒但要求耶稣 προσκυνέω 时该如何表达
  choice: 敬拜我
  alternative: 向我俯伏；向我表示敬意
  rationale: 该动词可表示俯伏、致敬或敬拜，但下一节强调敬拜唯独归于神，因此本处语境倾向宗教意义的“敬拜”。脚注保留其真实的词义幅度，避免把其他可能含义完全抹去。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“这一切我都要给你”保持原文先提出给予、后说明条件的语序；“俯伏敬拜”同时呈现身体动作与敬拜含义。
