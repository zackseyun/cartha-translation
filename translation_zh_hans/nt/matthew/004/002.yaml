base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: zh_hans
  text: 他禁食了四十昼夜，后来就饿了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύσας
  choice: 禁食了
  rationale: 不定过去时主动分词表示先于主句动作发生的行动。汉语用“禁食了……，后来……”自然表达这一先后关系，无须生硬译成“禁食之后”。
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: 四十昼夜
  rationale: 宾格表示持续时间。“四十昼夜”简洁自然，完整保留“四十天和四十夜”的时长含义。
- source_word: ὕστερον
  choice: 后来
  rationale: 明确标示禁食之后的时间推进，也避免因仅用“就”而弱化原文的显式时间副词。
- source_word: ἐπείνασεν
  choice: 就饿了
  rationale: 自然表达饥饿状态在禁食之后出现；“饿了”比“感到饥饿”更贴近日常现代汉语，同时保留真实的身体需要。
- source_word: καὶ
  choice: 未单独译出
  rationale: 句首 καί 是承接叙事的连接词；本节在中文中直接起句更自然，前后文的连续性并未因此丢失。
theological_decisions:
- issue: 禁食之后耶稣真实的身体饥饿
  choice: 就饿了
  alternative: 就感到饥饿／后来饥饿起来
  rationale: 译文直接陈述真实的饥饿，不额外强化教义解释，也不削弱原文对其身体需要的叙述。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“四十昼夜”凝练且具有合宜的经文语体；“后来就饿了”自然呈现事件次序。原文不存在需要在本节以脚注保留的实质歧义，英文脚注所列差别主要是英语句法表达差异。
