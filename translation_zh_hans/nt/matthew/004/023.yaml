id: MAT.4.23
reference: Matthew 4:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: zh_hans
  text: 他走遍加利利全境，在他们的会堂里教导人，宣讲国度的好消息[a]，医治百姓中各样的疾病和各样的病痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“国度的福音”。
    reason: 说明εὐαγγέλιον也可采用传统教会用语“福音”；标记置于对应词组之后。
lexical_decisions:
- source_word: περιῆγεν
  choice: 走遍
  rationale: 未完成时描写持续的巡行活动；“走遍”自然表达在整个地区各处行走的分布性含义。
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: 加利利全境
  rationale: 结合移动动词，介词短语表示活动遍及整个加利利地区；“全境”简洁传达其范围。
- source_word: διδάσκων
  choice: 教导人
  rationale: 现在分词表示与主要动作同时进行；汉语补出泛指宾语“人”，使表达自然，但不限定受教者范围。
- source_word: συναγωγαῖς αὐτῶν
  choice: 他们的会堂
  rationale: 保留所有格αὐτῶν；“会堂”是现代中文中对犹太教聚会场所的通行称呼。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 表达κηρύσσω公开、郑重传扬信息的含义，比单纯“讲述”更能体现其公开宣告性质。
- source_word: τὸ εὐαγγέλιον
  choice: 好消息
  rationale: 直接表达εὐαγγέλιον的词义，现代读者容易理解；传统译法“福音”置于脚注。
- source_word: τῆς βασιλείας
  choice: 国度的
  rationale: 保留属格结构本身的宽度，既可表示以国度为内容，也可表示属于或体现该国度的好消息；不擅自补入“天”。
- source_word: θεραπεύων
  choice: 医治
  rationale: 在本语境中指使患病者得到医治；“医治”庄重、自然，并保留实际治愈的含义。
- source_word: πᾶσαν νόσον
  choice: 各样的疾病
  rationale: “各样”表达πᾶσαν在此概括各种类别的周全范围；“疾病”与后面的μαλακία所译“病痛”有所区分。
- source_word: πᾶσαν μαλακίαν
  choice: 各样的病痛
  rationale: μαλακία可指身体的软弱、病症或不适；“病痛”与“疾病”构成自然搭配，同时不把两个希腊名词合并为一个概念。
- source_word: ἐν τῷ λαῷ
  choice: 百姓中
  rationale: 表达医治发生在人群当中；“百姓”自然对应λαός，在本节不额外强化技术性的圣约含义。
theological_decisions:
- issue: εὐαγγέλιον的译法
  choice: 好消息
  alternative: 福音
  rationale: “好消息”直接、透明地呈现原词含义；脚注保留教会传统中熟悉的“福音”，两者不造成教义内容差异。
- issue: τῆς βασιλείας所指的国度
  choice: 国度的好消息
  alternative: 天国的福音；关于国度的好消息
  rationale: 原文仅有“国度”，没有“天”或“神”的限定语；保留“国度”可避免从马太福音其他常用表达中补入本节未明说的成分，也保留属格关系可能具有的语义宽度。
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν的医治范围
  choice: 各样的疾病和各样的病痛
  alternative: 一切疾病和一切软弱
  rationale: 重复“各样的”反映两个πᾶσαν所强调的周全范围，同时用两个相关但不同的中文词保留原文并列名词的区别，不把医治范围缩减为笼统概述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留“教导—宣讲—医治”三个同时进行的事工层次；避免生硬照搬希腊分词结构，也不补入原文未明说的“天国”。
