base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: zh_hans
  text: 耶稣对他说：“经上又记着：‘不可试探主——你的上帝。’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“置于考验之中”。希腊语动词 ἐκπειράζω 可指试验、考验。
    reason: lexical_alternative
  - marker: b
    text: 这里引用《申命记》6:16。希腊文“主”沿用《七十士译本》对上帝圣名的译法。
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 按现代汉语自然语序表达简单的说话引介，并保留与格代词所指的受话者。
- source_word: Πάλιν
  choice: 又
  rationale: 这里引出用来回应对方的另一处经文；“又”简洁保留重复援引经文的修辞作用。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引用权威经文的固定表达；“记着”也适度体现完成时所含的持续有效意味。
- source_word: Οὐκ ἐκπειράσεις
  choice: 不可试探
  rationale: 将具有禁令作用的将来时译为汉语律法式禁令“不可”；“试探”在此指蓄意考验上帝，符合上下文及申命记引文。
- source_word: κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: 保留希腊文中“主”与“你的上帝”的同位结构，也保存其七十士译本措辞及圣约语境。
theological_decisions:
- issue: 引文中 κύριος 对以色列之上帝的称呼
  choice: 主
  alternative: 耶和华
  rationale: 直接来源是希腊文 κύριος，而非本节所呈现的希伯来文神名，因此正文译作“主”；脚注说明其七十士译本及神名背景。
- issue: ἐκπειράζω 的语义范围
  choice: 试探
  alternative: 考验
  rationale: “试探”能表达人在不信或挑衅中要求上帝证明自己的语境，同时脚注保留较中性的“考验”这一词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经上又记着”保留经文引用公式；“不可试探主你的上帝”保留律法引文的凝练语气。脚注标记均置于正文中，并安排在各自所说明内容附近。
