base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: zh_hans
  text: 他沿着加利利海边走时，看见兄弟二人，就是那称为彼得的西门和他的兄弟安得烈。他们正往海里撒网[a]，因为他们是渔夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语所用的词指用于抛撒捕鱼的网。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: 他沿着加利利海边行走时
  rationale: 现在分词表示与主句“看见”同时进行的动作；παρά加宾格表示沿着、在旁边。“加利利海”保留传统地名，虽从地理上说是湖。δέ在此为轻微的叙事承接，现代汉语无需机械译出。
- source_word: εἶδεν δύο ἀδελφούς
  choice: 看见兄弟二人
  rationale: 直译叙事动词和数量；ἀδελφούς在此明确指两名男性亲兄弟。
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: 那称为彼得的西门
  rationale: 保留被动分词λεγόμενον的含义，不将其进一步解释为绰号或改名。
- source_word: καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: 和他的兄弟安得烈
  rationale: 按同位关系说明安得烈与西门的亲属关系，表达符合现代汉语习惯。
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: 他们正往海里撒网[a]
  rationale: 现在分词表示被看见时正在进行的动作。ἀμφίβληστρον特指抛撒捕鱼的网，汉语“撒网”自然地兼顾动作和渔具含义；脚注补充其具体词义。
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: 因为他们是渔夫
  rationale: γάρ引出对撒网行为的背景解释；“渔夫”准确指这两名以捕鱼为业的男子。
