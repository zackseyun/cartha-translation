  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: zh_hans
  text: 于是，耶稣对他说：“撒但，走开！因为经上记着：‘要敬拜[a]主你的神，单单事奉[b]他。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜”也可译作“向……下拜”；希腊文这个动词可具体指怀着敬意俯伏或下拜。
    reason: lexical_alternative
  - marker: b
    text: “事奉”所译的希腊文动词可特指献给神的神圣或宗教性服事。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 标示叙事次序和紧接发生的回应；“于是”在现代汉语叙事中自然简洁。
- source_word: λέγει
  choice: 说
  rationale: 原文为叙事中的历史现在时；汉语通常不以时态形态区分，用“说”既自然，也不损失叙事的直接感。
- source_word: Ὕπαγε
  choice: 走开
  rationale: 命令对方离去，语气明确有力；“走开”比单用“去”更完整，也不显古奥。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 按现代中文圣经传统音译这一专名，并保留呼格中的直接斥责。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的完成时被动固定表达；“经上记着”自然传达所写之言持续有效的意味。
- source_word: Κύριον τὸν θεόν σου
  choice: 主你的神
  rationale: 保留“主”与“你的神”的同位关系，并贴近所引经文的庄重语体；不额外补入原文没有的连接词。
- source_word: προσκυνήσεις
  choice: 敬拜
  rationale: 在只归于神的宗教语境中，“敬拜”准确表达该动词的核心意义；其更具体的俯伏、下拜动作义置于脚注。
- source_word: αὐτῷ μόνῳ
  choice: 单单……他
  rationale: “单单事奉他”以自然汉语突出对象的排他性，即只事奉神。
- source_word: λατρεύσεις
  choice: 事奉
  rationale: 该词可指献给神的宗教性服事；“事奉”既保留这一色彩，又与前面的“敬拜”形成原文所有的词义区别。
theological_decisions:
- issue: 如何分别表达 προσκυνέω 与 λατρεύω
  choice: 分别译为“敬拜”和“事奉”
  alternative: 将两词都译作敬拜类用语，或将前者译为“下拜”而后者译为“事奉”
  rationale: 原文并列两个相关但不同的动词。分别译出可保留经文所强调的双重行动：敬拜与宗教性事奉都只归给神，同时不把二者人为合并。
- issue: μόνῳ 所表达的排他性
  choice: 译作“单单事奉他”
  alternative: 译作“只事奉他”或“事奉他而已”
  rationale: 该词与“他”在语法上紧密相连，强调事奉对象的唯一性；“单单事奉他”庄重、自然，也避免让“只”被误读为限制事奉的方式或程度。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”推进叙事，“走开”保留命令的力度；引文用“经上记着”和“单单事奉他”保持经文引语的肃穆感。所有脚注标记均置于相关词语之后。
