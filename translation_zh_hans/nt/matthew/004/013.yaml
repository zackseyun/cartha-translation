  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: zh_hans
  text: 他离开拿撒拉[a]，来到海边的迦百农，在西布伦和拿弗他利境内定居。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“拿撒拉”；许多英文译本作“拿撒勒”。
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: 离开
  rationale: 不定过去时分词表示先于主要动词发生的动作；译为“离开”自然地交代行动次序。
- source_word: Ναζαρὰ
  choice: 拿撒拉
  rationale: 按本节希腊文本的Ναζαρά音译，而不直接改作更常见的“拿撒勒”；后者列入脚注。
- source_word: ἐλθὼν
  choice: 来到
  rationale: 将不定过去时分词按汉语流水句处理，清楚表达他随后到达迦百农。
- source_word: κατῴκησεν
  choice: 定居
  rationale: κατοικέω在此指住下来、建立居所；“定居”比单纯“居住”更能体现这一动态含义。
- source_word: Καφαρναοὺμ
  choice: 迦百农
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
- source_word: τὴν παραθαλασσίαν
  choice: 海边的
  rationale: 该带冠词的形容词修饰迦百农，说明它临海；译为“海边的”简洁自然。
- source_word: ἐν ὁρίοις
  choice: 境内
  rationale: ὅρια可指边界、辖境或地区；此处“境内”保留地域归属意味，又符合现代汉语。
- source_word: Ζαβουλὼν
  choice: 西布伦
  rationale: 采用该支派及地域名称通行的中文圣经译名。
- source_word: Νεφθαλίμ
  choice: 拿弗他利
  rationale: 采用该支派及地域名称通行的中文圣经译名。
