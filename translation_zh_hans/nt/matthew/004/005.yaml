id: MAT.4.5
reference: Matthew 4:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: zh_hans
  text: 随后，魔鬼带他进了圣城[a]，使他站在圣殿的顶端[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣城”指耶路撒冷。
    reason: cross_reference
  - marker: b
    text: 或译“圣殿的翼角”；原文所用的希腊语可指圣殿建筑群突出的一角、边缘或高处，确切位置不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为叙事中的时间承接语，自然引出接下来发生的事；也可译作“随后”，但“那时”较贴近原文。
- source_word: παραλαμβάνει
  choice: 带他进了
  rationale: 原文用历史现在时增强叙事现场感；现代汉语在此采用完成体更自然。“带”保留了将某人带往某处的含义，结合 εἰς 译出“进了”。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 此处 διάβολος 是对撒但的称谓；“魔鬼”是现代汉语中通行且准确的对应词。
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: 进了圣城
  rationale: εἰς 表达向内的移动，译作“进了”；保留原文“圣城”的称号，不在正文中直接改为“耶路撒冷”。
- source_word: ἔστησεν αὐτόν
  choice: 让他站在
  rationale: ἔστησεν 在这里是使役、及物用法，表示魔鬼使耶稣站到某处；“让他站在”比单纯“把他放在”更明确保留站立之意。
- source_word: ἐπὶ τὸ πτερύγιον
  choice: 在……的顶端
  rationale: πτερύγιον 可指翼状突出部分、边角或高处，具体建筑位置不能完全确定；正文采用自然且传统上可理解的“顶端”，脚注保留其他可能。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν 指整个圣殿范围或建筑群，而不专指内殿；汉语正文用通行的“圣殿”，并在相关脚注中说明可能涉及圣殿建筑群。
theological_decisions:
- issue: “圣城”的具体所指
  choice: 正文保留“圣城”，脚注明确这是耶路撒冷。
  alternative: 在正文直接译作“耶路撒冷”。
  rationale: 原文使用尊称式表达 τὴν ἁγίαν πόλιν，而不是专名；保留这一称号可避免用解释取代原文措辞。
- issue: πτερύγιον τοῦ ἱεροῦ 的建筑位置
  choice: 译作“圣殿的顶端”，并用脚注说明词义和位置的不确定性。
  alternative: 译作“圣殿的翼角”或“圣殿建筑群的最高处”。
  rationale: 原文没有精确说明是哪一个建筑部位；“顶端”清楚易懂，但不应据此断定它必然是整个圣殿建筑群的最高点，因此以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那时……带他进了……让他站在……”符合自然汉语语序。正文简洁，脚注说明“圣城”的所指以及 πτερύγιον 的真实词义歧义。
