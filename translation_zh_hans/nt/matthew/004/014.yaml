  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: zh_hans
  text: 为要应验那借着先知以赛亚所说的话：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样就应验了那借着先知以赛亚所说的话。”
    reason: ἵνα 在这里可带目的或结果意味；正文采用“为要”，脚注保留较偏结果的自然中文表达。
lexical_decisions:
- source_word: ἵνα
  choice: 为要
  rationale: 引出目的兼结果关系；“为要”在现代中文中简洁庄重，也保留马太叙事中的目的性语气。
- source_word: πληρωθῇ
  choice: 应验
  rationale: 这是 πληρόω 的不定过去时被动虚拟式。在经文预言语境中，“应验”是自然且固定的中文表达；虽未逐字显出被动形态，却清楚表达所说之话得到实现。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 中性冠词加被动分词作名词用；译为“所说的话”符合现代中文习惯，并保留其内容指向。
- source_word: διὰ
  choice: 借着
  rationale: διά 加属格在此表示以人为媒介；“借着”比单纯的“由”更清楚保留先知作为传达媒介的含义。
- source_word: Ἠσαΐου
  choice: 以赛亚
  rationale: 采用该先知名字在简体中文圣经传统中通行且易识别的译名。
- source_word: τοῦ προφήτου
  choice: 先知
  rationale: 明确保留以赛亚的身份和经文所强调的先知权威；中文无需附加定冠词。
- source_word: λέγοντος
  choice: 所说的话：
  rationale: 该现在主动分词引出下文引语。中文将它自然地整合进“借着先知以赛亚所说的话”，并以冒号标明引文即将开始，避免生硬重复“说”。
theological_decisions:
- issue: 马太福音中的应验公式
  choice: 用“应验”保留明确的经文实现主题，不作神学扩写。
  alternative: 译作“实现”或“成为事实”。
  rationale: “应验”准确承接马太反复使用的 πληρόω 经文公式，也保留其互文和神学分量，而不进一步规定预言实现的具体模式。
- issue: ἵνα 的目的与结果张力
  choice: 译作“为要”，保留较强的目的性，同时允许上下文包含结果意味。
  alternative: 译作“于是就”或“这样就”。
  rationale: 原文 ἵνα 可涉及目的或结果；“为要”较贴近其目的性力度，但不补明行动主体，从而避免超出本节所说。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“借着先知以赛亚”保留原文的媒介关系；将 λέγοντος 融入“所说的话”，避免中文重复，并以冒号承接下一节引文。
