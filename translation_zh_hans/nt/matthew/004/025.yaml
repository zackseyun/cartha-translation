  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: zh_hans
  text: 大批群众从加利利、十城地区、耶路撒冷、犹太地区和约旦河对岸[a]而来，跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约旦河那边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: 来跟随
  rationale: ἀκολουθέω在此叙事语境中首先表示实际跟随耶稣；“来跟随”与后面的来源地搭配自然，也不把这些群众都说成已经委身的门徒。
- source_word: ὄχλοι πολλοὶ
  choice: 许多群众
  rationale: 直译为“许多群众”既保留复数群体和数量含义，也符合现代汉语表达。
- source_word: ἀπὸ
  choice: 从
  rationale: 表示群众的来源地；在中文中置于整组并列地名之前，可统领全列。
- source_word: Γαλιλαίας
  choice: 加利利
  rationale: 采用现代中文圣经和一般读者熟悉的标准地名译法。
- source_word: Δεκαπόλεως
  choice: 十城地区
  rationale: Δεκάπολις字面与历史所指均为“十城”；加“地区”说明这里指该城市群及其周边区域，而非一座城市。
- source_word: Ἱεροσολύμων
  choice: 耶路撒冷
  rationale: 采用标准中文地名；希腊文的复数形态不在中文中体现。
- source_word: Ἰουδαίας
  choice: 犹太
  rationale: 此处指犹太地区；与“从”搭配时简洁自然，也避免误读为“犹太人”。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河东
  rationale: 从加利利、耶路撒冷和犹太一侧的叙述视角看，短语指约旦河对岸或河东地区；正文采用自然的地理表达，并以脚注保留较字面的译法。
- source_word: καὶ ... καὶ ... καὶ
  choice: 、……、……和……
  rationale: 中文以顿号和末项前的“和”自然呈现累积并列关系，无须机械重复每个καί。
theological_decisions:
- issue: “跟随”是否表示正式门徒身份
  choice: 保留“跟随”，不加“成为门徒”等限定
  alternative: 作他的门徒
  rationale: 原文可包含对耶稣的追随和兴趣，但本节称他们为群众，未明确断言他们都已成为委身的门徒。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。地名使用通行译名；语序调整为“从……来跟随他”，使来源短语与中文句法自然衔接。
