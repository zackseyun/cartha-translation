id: MAT.4.3
reference: Matthew 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: zh_hans
  text: 试探者走上前来，对他说：“你若是上帝的儿子[a]，就叫这些石头变成饼吧[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若是”在这里也可能带有挑战意味，可理解为：“既然你是上帝的儿子。”
    reason: alternative_reading
  - marker: b
    text: “饼”原文为复数，也可译作“饼块”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 走上前来
  rationale: 该不定过去时分词表示试探者先向耶稣靠近，再开口说话；“走上前来”自然地保留了趋近的动作。
- source_word: ὁ πειράζων
  choice: 试探者
  rationale: 这是带冠词、作名词用的现在时分词，指正在试探耶稣的那一位；“试探者”既简洁，也符合本段叙事语境。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 直接对应“向他说”，是现代汉语中自然、庄重的表达。
- source_word: Εἰ
  choice: 若
  rationale: 保留希腊文条件句的形式及其挑战意味，不擅自判定说话者是在怀疑，还是以已知事实加以挑衅。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 这里虽为表语结构且“儿子”无冠词，但在马太福音语境中是对耶稣身份的特定称号，不宜译成泛指的“上帝的一个儿子”。
- source_word: εἰπὲ ἵνα
  choice: 叫……变成
  rationale: 命令式“说”后接ἵνα从句，表达以话语使某事发生；“叫……变成”符合现代汉语习惯，又不额外加入“命令”等原文未明说的措辞。
- source_word: οἱ λίθοι οὗτοι
  choice: 这些石头
  rationale: 保留指示词“这些”及λίθος的常用义“石头”。
- source_word: ἄρτοι
  choice: 饼
  rationale: ἄρτοι是复数，可指多个饼；汉语“饼”在此可自然用于类称，复数信息则由脚注说明。
- source_word: γένωνται
  choice: 变成
  rationale: 直接表达γίνομαι在此“成为、变为”的意义，清楚而不过度解释。
theological_decisions:
- issue: 条件句Εἰ υἱὸς εἶ τοῦ θεοῦ的语气
  choice: 正文译作“你若是上帝的儿子”
  alternative: “既然你是上帝的儿子”或“你若真是上帝的儿子”
  rationale: 简单的“若是”保留了原文既可被听作条件、也可带有挑战意味的张力；不加入“真”以免强化怀疑，也不直接译作“既然”以免把条件明确改成承认事实。
- issue: υἱὸς τοῦ θεοῦ的基督论称号
  choice: 上帝的儿子
  alternative: 上帝的一个儿子
  rationale: 马太福音的叙事语境将其作为指认耶稣独特身份的称号；采用特指含义，但不在译文中作超出本句的神学扩展。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“走上前来”保留动作顺序；“你若是……就……”符合汉语条件句习惯；句末“吧”传达带有挑衅意味的命令语气，而不使措辞显得生硬。脚注标记分别置于相关的条件称号与“饼”之后。
