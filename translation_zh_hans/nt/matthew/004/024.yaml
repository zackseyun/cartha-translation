  terminology: “叙利亚”“鬼魔”“瘫痪”“治好了”均适合现代标准汉语。“受鬼魔侵扰的”保留原文所陈述的鬼魔作用，且未把分词的强度过度技术化；脚注中的“被鬼附的”可作为传统替代译法。脚注中“被鬼魔化的”不合现代汉语，宜以“受鬼魔影响的”说明较直译的语义范围。
