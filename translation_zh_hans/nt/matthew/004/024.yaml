source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: zh_hans
  text: 关于他的消息传遍了叙利亚全境。人们把所有患病的，就是被各种疾病和痛苦缠身的、受鬼魔侵扰的[a]、有痉挛发作的[b]和瘫痪的，都带到他那里；他就治好了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被鬼附的”。希腊语也可较直译为“受鬼魔影响的”，指处于鬼魔影响之下的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊语一词字面与“受月亮影响”有关，传统上常译为“癫痫病人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀκοὴ αὐτοῦ
  choice: 关于他的消息
  rationale: 这里指人们所听到的有关耶稣的消息，而不是听觉本身。“关于他的消息”自然清楚，也保留了消息传播的含义。
- source_word: ἀπῆλθεν … εἰς ὅλην τὴν Συρίαν
  choice: 传遍了叙利亚全境
  rationale: 希腊文直译近于“出去，到了整个叙利亚”；中文用“传遍”自然表达消息扩散，并保留覆盖全境的范围。
- source_word: κακῶς ἔχοντας
  choice: 患病的
  rationale: 这是表示身体状况不佳或生病的常用语，译为“患病的”简明准确。
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: 被各种疾病和痛苦缠身的
  rationale: συνέχω带有被紧紧困住、折磨的意味；“缠身”既自然，又保留病痛持续辖制人的力度。βάσανοι在此译为范围较宽的“痛苦”，不武断限定为某种疼痛。
- source_word: δαιμονιζομένους
  choice: 受鬼魔侵扰的
  rationale: 明确保留超自然的鬼魔因素，同时不把这个分词强行限定为一种现代技术化的“附身”等级；传统译法列于脚注。
- source_word: σεληνιαζομένους
  choice: 癫痫发作的
  rationale: 该词字面与月亮相关，传统上常指癫痫患者；正文用现代读者能理解的症状性表达，词源和传统译法保留在脚注。
- source_word: παραλυτικούς
  choice: 瘫痪的
  rationale: 指身体瘫痪的人；这一表达比名词化的专门称呼更符合现代汉语。
- source_word: ἐθεράπευσεν αὐτούς
  choice: 他就治好了他们
  rationale: 准确表达耶稣使这些人痊愈；“就”自然承接众人被带来这一事件。
theological_decisions:
- issue: δαιμονιζομένους所表达的鬼魔作用强度
  choice: 受鬼魔侵扰的
  alternative: 被鬼附的
  rationale: 译文不可淡化或消除经文明确提到的鬼魔活动，但该希腊分词本身未必要求现代汉语中界定较窄的技术性“附身”概念，因此正文保留一定语义宽度，并以脚注提供传统译法。
- issue: σεληνιαζομένους与月亮及癫痫的关系
  choice: 癫痫发作的
  alternative: 受月亮影响的；癫痫病人
  rationale: 正文传达该词在疾病清单中的通常所指，却不认可月亮致病这一古代病因观；脚注保留其字面背景和传统理解，以免掩盖原词特色。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是”表明后面的各类患者是在具体说明“所有患病的”；分号式长句拆成两句，以免清单结构含混。正文中的[a]、[b]均紧随相应词语。
