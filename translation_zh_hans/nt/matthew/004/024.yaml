  to: 关于他的消息传遍了叙利亚全境。人们把所有患病的，就是被各种疾病和痛苦缠身的、受鬼魔侵扰的[a]、有痉挛发作的[b]和瘫痪的，都带到他那里；他就治好了他们。
  rationale: 修订仅处理古代疾病术语的语义宽度和汉语表达。“有痉挛发作的”比“癫痫发作的”更自然，且不把原文具争议的术语固定为现代癫痫诊断；脚注保留词源和传统理解。脚注a改用自然汉语说明替代义。分号自然连接“带到他那里”和“他就治好了他们”，不改变原文事件关系。
