  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: zh_hans
  text: 那坐在黑暗中的百姓看见了大光；那些坐在一片地带和死亡阴影中的人，有光为他们升起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡阴影”也可译为“死荫”。在相关旧约语境中，这个表达有时可理解为“深暗”；但此处希腊文明确含有“死亡”一词。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: 百姓
  rationale: 指一个群体，译作“百姓”自然庄重，也避免“民族”可能带来的现代政治含义。
- source_word: καθήμενος / καθημένοις
  choice: 坐在
  rationale: 保留原文“坐”的具体意象以及前后平行结构；虽可意译为“住在”，但会削弱引自《以赛亚书》的鲜明措辞。
- source_word: σκοτίᾳ
  choice: 黑暗
  rationale: 既可表达实际的黑暗，也保留其比喻空间，不限定为道德、属灵或处境上的黑暗。
- source_word: φῶς εἶδεν μέγα
  choice: 看见了大光
  rationale: 按不定过去时表达已经发生的看见，并以“大光”保留简洁、庄重的经文语体。
- source_word: χώρᾳ
  choice: 地
  rationale: χώρᾳ可指地域；“地”在此比“地区”更凝练，并能与后接的“死亡阴影”自然组成诗性并列。
- source_word: σκιᾷ θανάτου
  choice: 死亡阴影
  rationale: 明确保留希腊文θανάτου“死亡”，同时用现代汉语可理解的表达保存圣经意象，不改译成只表示浓重黑暗的词语。
- source_word: ἀνέτειλεν
  choice: 升起
  rationale: 该动词描绘天体或光升起；“升起”保留原有图像，也比抽象的“照耀”更贴近词义。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 明确表达与格所指的承受者；“有光向他们升起”在汉语中自然，并避免添加原文没有说明的受益含义。
theological_decisions:
- issue: 黑暗与光的意象所具体指向的内容
  choice: 保留开放的预言性意象，不明确限定黑暗或光的所指
  alternative: 把黑暗明确解释为罪、外族人的无知或政治困境，并把光明确解释为弥赛亚的救恩启示
  rationale: 本句本身没有将这些意象限定为某一种解释；译文应保存其丰富的神学张力，而不把释义写进正文。
- issue: σκιᾷ θανάτου中的“死亡”
  choice: 正文明确译出“死亡”
  alternative: 按相关希伯来语背景意译为“幽暗”或“深暗”
  rationale: 现存希腊文明确含有θανάτου，因此译文应保留死亡意象及其经文呼应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看见了大光”与“有光向他们升起”保留诗性平行；不把比喻解释为某一特定教义。脚注标记置于整句末，所释对象为正文中的“死亡阴影”。
