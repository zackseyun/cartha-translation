  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: zh_hans
  text: 他却回答说：“经上记着：‘人活着，不是单靠饼，而是靠从上帝口里所出的一切话[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上帝口里”较直译可作“经由上帝的口”；原文保留了话语经上帝之口发出的意象。
    reason: 说明διά στόματος θεοῦ的字面结构及译文为符合现代汉语所作的调整。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答说
  rationale: 保留原文“回答—说”的叙事表达；现代汉语中自然、清楚。
- source_word: Γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的惯用公式，也能体现完成时所含“已经写下并仍然有效”的意味。
- source_word: ἄρτῳ μόνῳ
  choice: 单靠饼
  rationale: ἄρτος的直接词义是“饼”；不扩大译为泛指的“食物”。“单靠”自然表达μόνῳ以及ἐπί在此所表示的生活依凭。
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: 人活着
  rationale: ὁ ἄνθρωπος在这里泛指人类中的每一个人；汉语“人”自然包含这种普遍意义。未来时在格言式引文中表达人的生存原则，译作“活着”比生硬的“将活”更符合现代汉语。
- source_word: παντὶ ῥήματι
  choice: 一切话
  rationale: ῥῆμα指上帝所说出的言语；“一切话”既保留逐项无遗漏的παντί，也符合汉语表达。
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: 从上帝口里所出
  rationale: 保留言语由上帝之口发出的具体意象。“从……口里所出”是自然汉语，同时涵盖ἐκπορεύομαι的“出来”以及διά所描绘的经由上帝之口。
theological_decisions:
- issue: ὁ ἄνθρωπος的代表性阳性形式
  choice: 人
  alternative: 人类；一个人
  rationale: 这里陈述关于所有人的普遍真理，并非特指某个男性。现代汉语“人”无需添加性别，且不削弱原文的代表性。
- issue: Γέγραπται所体现的经文权威
  choice: 经上记着
  alternative: 有记载说；已经写着
  rationale: 采用常见而庄重的引经公式，不额外加入有关圣经权威性质的神学说明。
- issue: διά στόματος θεοῦ的空间或媒介意象
  choice: 从上帝口里所出
  alternative: 经由上帝的口所出
  rationale: 原文διά加属格可突出“经由”；但与ἐκπορευομένῳ合用时，中文“从……口里所出”更自然，并完整保留神亲口发言的意象。脚注说明其较直译形式，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事及引经语体。“他却回答说”保留上下文中的对比语气；引文使用“饼”“口里所出”等具体词语，不将其抽象化或作神学扩释。
