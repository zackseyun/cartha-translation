  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: zh_hans
  text: 那时，耶稣被圣灵引到旷野，受魔鬼的试探[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受魔鬼的考验”；希腊语动词既可指“试探”，也可指“考验”，但这里的直接语境较支持“试探”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为承接前文、推进叙事的时间连接语，“那时”自然庄重，也保留事件次序。
- source_word: ἀνήχθη
  choice: 被……引到
  rationale: 保留不定过去时被动语态所表达的受领动作；汉语无需生硬译出“向上”的方向成分，语境中“引到旷野”已清楚表达移动。
- source_word: εἰς τὴν ἔρημον
  choice: 到旷野
  rationale: ἔρημος指荒无人烟之地，不必限定为沙漠；“旷野”符合犹太地理背景及现代中文圣经语体。
- source_word: ὑπὸ τοῦ πνεύματος
  choice: 被圣灵
  rationale: 紧接耶稣受洗时圣灵降临的叙事，定冠词所指自然是上帝的灵；中文以“圣灵”明确同一叙事对象。
- source_word: πειρασθῆναι
  choice: 受……试探
  rationale: πειράζω兼有“试探”和“考验”之义；因施动者是魔鬼，正文采用“试探”，并以脚注保留“考验”的词义可能。
- source_word: ὑπὸ τοῦ διαβόλου
  choice: 受魔鬼的
  rationale: διάβολος在此作为那位敌对者的称号，“魔鬼”是现代中文最清楚、通行且不额外解释的对应表达。
theological_decisions:
- issue: τοῦ πνεύματος的身份
  choice: 译作“圣灵”
  alternative: 译作“那灵”或“灵”
  rationale: 前一段明确叙述上帝的灵降在耶稣身上，因此此处最自然地回指圣灵；中文若只译“灵”容易产生不必要的歧义。
- issue: πειρασθῆναι的语义
  choice: 正文译作“受……试探”
  alternative: 译作“受……考验”
  rationale: 魔鬼是直接施动者，随后又诱使耶稣行恶，所以“试探”最贴合近距离语境；但该希腊词本身也可指“考验”，故在脚注保留这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“被圣灵引到旷野”保持被动结构；“受魔鬼的试探”避免连续两个“被”造成生硬。脚注标记紧随存在词义选择的短语。
