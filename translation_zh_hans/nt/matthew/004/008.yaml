id: MAT.4.8
reference: Matthew 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: zh_hans
  text: 魔鬼又带他到一座极高的山上，把世上万国及其荣耀[a]都指给他看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荣华”。
    reason: δόξα 在此语境中可指各国显眼的繁华、威势和壮丽；“荣华”是贴合语境的词义选择。
lexical_decisions:
- source_word: Πάλιν
  choice: 又
  rationale: 表示试探过程中的再次行动；“又”简洁自然，符合现代汉语叙事习惯。
- source_word: παραλαμβάνει
  choice: 带他
  rationale: 表达带同某人前往之意；汉语不必机械保留希腊语的历史现在时。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 此处是对撒但的通行称谓；“魔鬼”清楚、自然，也符合中文圣经语体。
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: 到一座极高的山上
  rationale: “到……山上”自然表达移动的终点；“极高”保留 λίαν 的强调。
- source_word: δείκνυσιν αὐτῷ
  choice: 指给他看
  rationale: 准确表达向某人展示之意，比单说“让他看见”更贴近动作主体明确的原文。
- source_word: πάσας τὰς βασιλείας τοῦ κόσμου
  choice: 世上万国
  rationale: “万国”自然概括所有国度，同时保留 βασιλεία 在此处的政治统治领域含义；并未将 κόσμος 限缩为某一地理区域。
- source_word: τὴν δόξαν αὐτῶν
  choice: 其荣耀
  rationale: “荣耀”保留 δόξα 的核心词义和经文中的词汇联系；此处也可按可见的宏伟与繁华理解为“荣华”，故列入脚注。
theological_decisions:
- issue: 山上展示世上万国这一场景的性质
  choice: 按叙事原样直译，不说明展示是地理视野、异象还是超自然显现。
  alternative: 明确解释为从实体山峰实际看见，或明确解释为异象或超自然展示。
  rationale: 希腊原文只说魔鬼带耶稣到极高的山，并把世上万国及其荣耀指给他看；译文应保留这一叙述及其张力，不加入原文没有说明的机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又”推进连续叙事；“到一座极高的山上”和“指给他看”符合自然汉语表达。脚注标记置于所注释的“荣耀”之后。
