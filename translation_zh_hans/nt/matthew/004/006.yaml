id: MAT.4.6
reference: Matthew 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: zh_hans
  text: '又对他说：“你若是上帝的儿子，就把自己投下去[a]，因为经上记着：


    ‘他要为你吩咐他的天使，


    并且他们要用手托住你[b]，

    免得你的脚撞在石头上。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把自己扔下去”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“托起你”或“承托你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文叙事中的现在时在这里是历史现在时；现代汉语用“说”即可自然承接叙事，不必标明时态。
- source_word: Εἰ
  choice: 若
  rationale: 保留条件句及试探性的挑战语气，不把它解释成已经让步承认的“既然”。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 在《马太福音》的语境中，这是特指耶稣身份的称号；汉语本身不使用冠词，因此无需另加形式来表达英语定冠词。
- source_word: βάλε σεαυτὸν κάτω
  choice: 跳下去
  rationale: 这是现代汉语中表达从高处主动跃下最自然的说法，也保留了反身动作；较直译的“把自己扔下去”略显生硬。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 符合汉语引用圣经的惯用表达，也体现完成时所含“已经写下并仍然有效”的意味。
- source_word: ἐντελεῖται
  choice: 吩咐
  rationale: 表达有权柄者下达命令的意思，并与诗篇引文的庄重语体相称。
- source_word: περὶ σοῦ
  choice: 为你
  rationale: 此处 περί 加属格可指“关于你、为保护你”；“为你”在汉语引文中自然，同时不增添具体命令内容。
- source_word: ἐπὶ χειρῶν
  choice: 用手
  rationale: 现代汉语以“用手托住”自然传达天使用双手承托的图像；机械译为“在手上”不够通顺。
- source_word: ἀροῦσίν σε
  choice: 托住你
  rationale: αἴρω 在这里指抬起、承托；“托住”既清楚又保留保护性的形象。
- source_word: μήποτε προσκόψῃς
  choice: 免得……撞
  rationale: μήποτε 加虚拟式表达防止某事发生；προσκόπτω 与脚和石头连用时具体指碰撞，而不只是一般性的跌倒。
- source_word: πρὸς λίθον
  choice: 在石头上
  rationale: “脚撞在石头上”是自然汉语，并保留 λίθον 无冠词所表达的不定意义。
- source_word: τὸν πόδα σου
  choice: 你的脚
  rationale: 忠实保留希腊文单数。
theological_decisions:
- issue: 试探者所说“上帝的儿子”的基督论分量
  choice: 译作“上帝的儿子”，按上下文保留其称号性质
  alternative: 译作泛指的“上帝的一个儿子”
  rationale: 在《马太福音》的叙事中，这句话针对耶稣已经宣告的身份发出挑战；泛指译法会削弱原文在语境中的称号作用。
- issue: 试探者引用诗篇91篇
  choice: 按其口中所引的经文直接翻译，不在正文加入纠正或评注
  alternative: 在正文中说明这是对经文的误用
  rationale: 本节有意呈现试探者诉诸经文的张力；翻译不应把解释写进引文，而应保留叙事本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又对他说”承接上文，不重复补出希腊文本节没有明说的主语。“若”比口语化的“如果”略庄重，又保留真实条件与挑战语气。诗篇引文分行排布，以显明引语结构；第二个 καί 译作“又说”，帮助现代读者看出试探者继续引用同一段经文。
