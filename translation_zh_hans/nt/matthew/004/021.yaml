id: MAT.4.21
reference: Matthew 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: zh_hans
  text: 耶稣从那里继续往前走，看见另外两兄弟，就是西庇太的儿子雅各和他的兄弟约翰。他们正和父亲西庇太在船上修补自己的渔网。耶稣就呼召他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: 从那里继续往前走
  rationale: προβαίνω的不定过去时分词表示从先前地点继续前行；ἐκεῖθεν表示“从那里”。合译自然地保留移动的延续性。
- source_word: εἶδεν
  choice: 看见
  rationale: 按ὁράω在叙事中的普通含义翻译，不强化为“注意到”。
- source_word: ἄλλους δύο ἀδελφούς
  choice: 另外两兄弟
  rationale: 既保留“两”这一数目，也体现ἄλλους所表达的“此外、另外”。
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: 西庇太的儿子雅各
  rationale: 希腊文以属格表明父子关系；中文明说“儿子”清楚自然。人名采用现代中文圣经通行译名。
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: 他的兄弟约翰
  rationale: αὐτοῦ指向雅各，说明约翰是雅各的兄弟；中文调整语序以求自然。
- source_word: ἐν τῷ πλοίῳ
  choice: 在船上
  rationale: 这里是捕鱼用的船；现代汉语通常说“在船上”，比字面式“在船里”自然。
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: 和父亲西庇太
  rationale: μετά加属格表示陪同；译文明确西庇太是两人的父亲。
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: 修补自己的渔网
  rationale: καταρτίζω在捕鱼语境中指把网整理、修复到可用状态；“修补”最贴切。补出“渔”说明δίκτυα在本段语境中的用途，而“自己的”保留物主关系。
- source_word: ἐκάλεσεν αὐτούς
  choice: 呼召他们
  rationale: καλέω在此处是耶稣发出的门徒召唤；“呼召”保留马太叙事中的召唤意味，但不增添原文未明说的“来跟从他”。
theological_decisions:
- issue: ἐκάλεσεν是否明说门徒跟随的内容
  choice: 呼召他们
  alternative: 叫他们来跟从他
  rationale: 上下文表明这是成为门徒的召唤，但本节只说耶稣呼召他们。译文不补入“来跟从他”，让上下文传达这一含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。分为三句以避免中文长句拖沓，同时保留原文事件顺序。用“耶稣”明确连续主语，避免跨句后代词指向含混。
