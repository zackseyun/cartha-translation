  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: zh_hans
  text: 西布伦地和拿弗他利地，沿海的路，约旦河外，外邦人的加利利——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: 地
  rationale: 在地理称谓中译为“地”，既自然简洁，也保留两次重复形成的平行结构。
- source_word: Ζαβουλὼν
  choice: 西布伦
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: Νεφθαλίμ
  choice: 拿弗他利
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: ὁδὸν θαλάσσης
  choice: 沿海之路
  rationale: 保留“路”与“海”的意象及引文的庄重语体，同时不把它过度限定为某一条已知大道；“之”使诗性地名列举在现代中文中更顺畅。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河对岸
  rationale: 准确表达“在约旦河另一边”的地理习语；“对岸”保留相对视角，而不擅自指定东西方向。
- source_word: Γαλιλαία
  choice: 加利利
  rationale: 采用该地区通行的中文专名。
- source_word: τῶν ἐθνῶν
  choice: 外族人的
  rationale: 在马太的犹太语境和以赛亚书引文背景中，这里主要指非犹太族群；“外族人”比音译或较教会化的术语更易为普通现代读者理解，同时以脚注保留“列国”的词义可能。
theological_decisions:
- issue: τῶν ἐθνῶν 是译作“外族人”还是“列国”
  choice: 外族人的加利利
  alternative: 列国的加利利
  rationale: 上下文突出加利利与非犹太人口的关联，因此正文采用“外族人”；但希腊词本身也可泛指“列国”，故以脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而可懂的引文语体，以逗号保留原文连续列举的节奏，并以破折号表明句意延续到下一节。“沿海之路”略带诗性，但仍属现代读者可自然理解的表达。
