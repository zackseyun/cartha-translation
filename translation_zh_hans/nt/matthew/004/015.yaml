  terminology: 地名“西布伦、拿弗他利、加利利”均恰当。将τῶν ἐθνῶν改为“外邦人”采用现代中文圣经中通行且在此语境中语义准确的术语；脚注“列国”保留不应抹除的词汇层面歧义。
