source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: zh_hans
  text: 于是，魔鬼离开了他。看哪，天使前来服侍他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“天使前来服事他”。“服侍”所译的希腊语动词可指服事或照料；其未完成时态把这行动呈现为进行中的动作。
    reason: 说明词义范围和未完成体的进行性，避免将持续时间或连续性过度具体化。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事次序和结果承接；“于是”在现代汉语中自然，也契合试探结束后的情节推进。
- source_word: ἀφίησιν
  choice: 离开了
  rationale: 此处是希腊语叙事中的历史现在时；汉语以完成性表达“离开了”更自然，并准确表示魔鬼从耶稣那里离去。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在试探叙事中用作撒但的称号；“魔鬼”是现代汉语中明确且通行的对应词。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意、增强现场感的语篇标记；“看哪”庄重而仍易懂。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 上下文所指是属天的使者；“天使”比泛称“使者”更能准确传达此处含义。
- source_word: προσῆλθον
  choice: 前来
  rationale: 表达来到近前的动作；“前来”简洁自然，并与后面的服侍相衔接。
- source_word: διηκόνουν
  choice: 服侍
  rationale: 该词可指服事、照料；未完成时态暗示持续进行，但汉语正文不宜生硬添加时间副词，因此以脚注说明其持续意味。
- source_word: αὐτῷ
  choice: 他
  rationale: 与“服侍”直接搭配，清楚指向耶稣，符合现代汉语习惯。
theological_decisions:
- issue: διάβολος在试探叙事中的译法
  choice: 魔鬼
  alternative: 诽谤者
  rationale: 该词本可按词源译为“诽谤者”，但此处作为试探耶稣者的特定称号使用；译作“魔鬼”可明确所指，又不额外加入教义解释。
- issue: 天使服侍行为的持续性
  choice: 正文译作“服侍他”，脚注交代未完成时态可能表示持续进行
  alternative: 一直在服侍他
  rationale: 希腊语未完成时态呈现进行中的行动，但其持续程度并未被具体限定；避免在正文加入过强的“一直”，可保留原文在体貌上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”自然承接前文，“看哪”保留原文突显新场景的修辞力度。句式简洁，避免古奥表达，也不把未完成时态的持续意味过度具体化。
