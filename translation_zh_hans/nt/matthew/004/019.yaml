  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“来跟从我，我要使你们成为得人的渔夫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事中的“说”本身不标示时态，既自然，也无需改译成带明显过去时色彩的表达。
- source_word: Δεῦτε ὀπίσω μου
  choice: 来跟从我
  rationale: Δεῦτε是召唤“来”，ὀπίσω μου直译为“在我后面”。合译为“来跟从我”，既保留召唤语气，也自然表达作门徒跟随耶稣的含义。
- source_word: ποιήσω ὑμᾶς
  choice: 我要使你们成为
  rationale: 保留将来意义及耶稣主动塑造他们的含义；“使你们成为”符合现代汉语表达。
- source_word: ἁλιεῖς ἀνθρώπων
  choice: 得人的渔夫
  rationale: “得人的渔夫”保留捕鱼的比喻，也符合汉语圣经语体；其中“人”自然泛指人类，不限于男性。
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων的性别与泛指范围
  choice: 得人的渔夫
  alternative: 捕人的渔夫／使人归向我的渔夫
  rationale: ἀνθρώπων在此泛指人类。现代汉语“人”本来就是性别中性的泛称，故无需用脚注补充“包括男女”；同时不增添“归向我”等原文未明说的解释，以保留捕鱼比喻本身的张力。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“来跟从我”比逐字译作“来在我后面”更符合汉语习惯；“得人的渔夫”保留传统而易懂的比喻表达。
