  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: zh_hans
  text: 他们立刻撇下渔网，跟从了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处δέ是轻微的叙事连接词，主要推动情节。现代汉语承接上文时可借语序自然表达；若硬译为“于是”或“而”，可能过度强化结果或转折。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达εὐθέως所强调的即时、迅速反应，也符合现代汉语叙事表达。
- source_word: ἀφέντες
  choice: 撇下
  rationale: 分词所指动作先于主要动词：他们先撇下网，随后跟从耶稣。“撇下”比普通的“留下”更能表达离开手中事物，却不像“抛弃”那样带有过强的负面意味。
- source_word: τὰ δίκτυα
  choice: 渔网
  rationale: δίκτυα泛指网，但上下文明确是捕鱼用的网。汉语单说“网”较含混，译作“渔网”以最小限度明示语境；不添加原文未明说的“他们的”。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟从了他
  rationale: ἀκολουθέω加与格既可表示实际跟在某人后面，也能在福音书语境中指成为门徒。“跟从”保留这两层含义；“了”自然标示叙事中已经发生的动作。
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ所含的门徒意义
  choice: 跟从了他
  alternative: 跟在他后面
  rationale: 原文既描写实际行动，也开启门徒归属的含义。“跟从”保留这种叙事与神学上的双重意味，而不把它明确扩写成“作了他的门徒”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式保持原文动作次序，并以“立刻”突出回应的迅速。
