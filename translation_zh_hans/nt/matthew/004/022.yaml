  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: zh_hans
  text: 他们立刻[a]撇下船和他们的父亲，跟从了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“马上”。
    reason: 词义相近的表达；εὐθέως强调毫不迟延，“立刻”和“马上”都可准确传达。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: οἱ在此作名词用，回指上文提到的两兄弟；δέ是轻微的叙事连接词。现代汉语在这里无需另译“而”或“于是”，省译更自然，也不增添对比或因果意味。
- source_word: εὐθέως
  choice: 立刻
  rationale: 表达行动毫不迟延，并保留马太叙事中这一常见用词所带出的紧迫感。
- source_word: ἀφέντες
  choice: 撇下
  rationale: 不定过去时分词所指的行动先于主要动词：他们先离开船和父亲，继而跟从耶稣。“撇下”既体现决定性，又不必然断言永久遗弃。
- source_word: τὸ πλοῖον
  choice: 船
  rationale: 在加利利捕鱼的语境中，πλοῖον指渔船；“船”比“船只”更自然，也不误导为大型航海船舶。
- source_word: τὸν πατέρα αὐτῶν
  choice: 父亲
  rationale: “他们”已作主语，汉语并列结构“船和父亲”自然清楚；无需重复“他们的”，并保留跟从所涉及的家庭代价。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟从了他
  rationale: ἀκολουθέω兼有实际随行和作门徒跟随的含义；“跟从”在现代中文圣经语境中能保留这两层意义。“了”标明叙事中的完成事件。
theological_decisions:
- issue: 跟从耶稣与离开家庭的关系
  choice: 直译为他们立刻撇下船和父亲去跟从耶稣，但不说明这种离开是否永久。
  alternative: 译成“永远抛弃父亲”，或弱化成“暂时离开父亲”。
  rationale: 经文强调回应的迅速与果断；ἀφέντες本身却没有明确界定离开的期限。因此既不强化为永久遗弃，也不弱化为短暂走开。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“撇下”保留叙事力度，“跟从”保留行动与门徒身份的双重意涵。脚注标记紧随其所说明的“立刻”。
