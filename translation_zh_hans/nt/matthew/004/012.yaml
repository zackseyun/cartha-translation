  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: zh_hans
  text: 耶稣听说约翰已被交出去[a]，就退到加利利去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被捕了。”希腊原词本义较宽，可指被交出或移交；在此语境中可具体指约翰遭当权者拘捕。
    reason: 词义选择：保留παρεδόθη“被交出／被移交”的宽泛词义，同时说明其在本处语境中可指被捕。
lexical_decisions:
- source_word: Ἀκούσας
  choice: 听说
  rationale: 不定过去时分词在此表示相对于主句动作的时间背景；汉语用“听说……就……”自然表达“听见这消息之后”的关系。根据上下文明示主语为耶稣，有助于独立成节时清楚易懂。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事衔接语，并非强烈转折；现代汉语无需机械添加“现在”或“但”，句序本身足以承接上下文。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: παρεδόθη
  choice: 被交了出去
  rationale: 保留παραδίδωμι“交出、移交”的较宽词义及被动语态，不在正文中直接收窄为“被捕”；“了”表明该事先于耶稣退往加利利。
- source_word: ἀνεχώρησεν
  choice: 退到
  rationale: 表达ἀναχωρέω因局势而离开、退往别处的语气，同时避免“逃跑”所暗示的过强动机。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 到加利利去
  rationale: 自然表达εἰς的方向性；汉语地名“加利利”按惯用形式处理。
theological_decisions:
- issue: 约翰所经历的παραδίδωμι应如何表达
  choice: 被交了出去
  alternative: 被捕了
  rationale: 原词比专指逮捕的术语更宽，并在《马太福音》中可保留“被交出”的呼应意味；正文不把含义限定为逮捕，脚注则说明本处语境中的具体理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“听说……就……”使分词与主句的时间关系自然清楚；不硬译轻微连接词δέ。正文保留“被交出去”的词义宽度，并用脚注给出语境上更具体的译法。
