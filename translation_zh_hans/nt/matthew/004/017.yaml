base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: zh_hans
  text: 从那时起，耶稣开始宣讲，说：“你们要悔改，因为天国已经临近了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经临近了”也可译作“已经近了”或“已经靠近了”。希腊语的完成时强调：天国的临近已经发生，而且这一状态仍然持续。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: 从那时起
  rationale: 自然地标示叙事转折，并保留此后展开新阶段的意味。
- source_word: ἤρξατο
  choice: 开始
  rationale: 准确表达动作的起始，符合现代汉语叙事表达。
- source_word: κηρύσσειν καὶ λέγειν
  choice: 宣讲说
  rationale: 既保留公开宣告的含义，也以自然汉语表明后面的引语是宣讲的内容，避免生硬重复为“宣讲并说”。
- source_word: Μετανοεῖτε
  choice: 你们要悔改
  rationale: 表达复数命令，涵盖心思、方向与生活的转变，不缩减为单纯改变看法。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 以“已经……了”体现希腊语完成时所表达的状态已经来到，并仍然有效。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是自然、庄重且广为理解的汉语表达，保留马太的特色措辞；βασιλεία所含王权、统治与国度的张力不在正文中被单向限定。
theological_decisions:
- issue: Μετανοεῖτε的范围
  choice: 你们要悔改
  alternative: 你们要回转；你们要改变心意
  rationale: “悔改”能较完整地承载内在心思与外在生活转向的要求，同时不加入特定宗派的悔改程序。
- issue: ἡ βασιλεία τῶν οὐρανῶν的表达
  choice: 天国
  alternative: 诸天之国；上天的统治
  rationale: “天国”保留马太惯用的表达，也允许“国度”与“王权统治”的语义张力继续存在，不把它仅解释为地点或仅解释为抽象统治。
- issue: ἤγγικεν的时态力度
  choice: 已经临近了
  alternative: 近了；已经来到近处
  rationale: 这一译法兼顾临近的空间隐喻与完成时所表示的现今持续状态，同时不进一步界定天国实现的具体方式或程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣讲说”较贴近原文两个动词，又符合汉语引出直接引语的习惯；引语中的“你们”明确体现复数命令。
