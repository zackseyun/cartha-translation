  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: zh_hans
  text: 他们上前叫醒他，说：“主啊，救我们！我们要丧命了！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: 上前
  rationale: 该不定过去时分词表示他们先向耶稣靠近。“上前”自然地保留动作次序，也不添加原文未明说的细节。
- source_word: ἤγειραν
  choice: 叫醒
  rationale: ἐγείρω在此按睡眠语境取具体意义，指把睡着的人唤醒，而非神学语境中的“使复活”或一般性的“举起”。
- source_word: λέγοντες
  choice: 说
  rationale: 该现在时分词引出直接引语；“说”准确简洁，不额外加入“喊叫”等情绪色彩。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος对耶稣的称呼及其可能具有的尊称和基督论分量；“啊”符合现代汉语呼格表达。
- source_word: σῶσον
  choice: 救救我们
  rationale: 不定过去时命令式表达紧急求救。汉语重叠“救救”自然传达迫切语气；宾语“我们”虽未在该动词中明说，却由随后第一人称复数和上下文清楚蕴含。
- source_word: ἀπολλύμεθα
  choice: 我们快没命了
  rationale: 现在时中间/被动形式在此表达迫近的毁灭或死亡。“快没命了”既体现危急和临近性，又是普通现代读者容易理解的自然说法。
theological_decisions:
- issue: κύριος作为对耶稣的称呼
  choice: 主啊
  alternative: 老师啊／主人啊
  rationale: “主”保留该称呼从尊敬到更深基督论含义之间的张力，不把它缩减为纯功能性的称谓。
- issue: 是否明说σῶσον的受词
  choice: 救救我们
  alternative: 救命啊
  rationale: 原文单个命令式未另列宾语，但紧接着的“我们快没命了”清楚表明求救者包括说话众人。汉语明说“我们”更自然，并未增添教义内容。
- issue: ἀπολλύμεθα所表达的危急程度
  choice: 我们快没命了
  alternative: 我们正在灭亡
  rationale: 这里指风浪中迫近的死亡；所选译法保存紧迫感，不将其抽象化为专门的末世或永恒灭亡术语。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准普通话。直接引语用短促句式呈现危急处境；不额外加入“门徒”或“喊叫”等原文此句未明说的内容。
