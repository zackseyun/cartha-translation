  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: zh_hans
  text: 看哪[a]，海上起了一场猛烈的风暴[b]，以致船正被波浪淹没[c]；耶稣却在睡觉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是引人注意的用语。
    reason: lexical_alternative
  - marker: b
    text: 原文“风暴”一词常可直译为“地震”或“震动”；在本节海上、船和波浪的语境中，指猛烈的风暴。
    reason: lexical_alternative
  - marker: c
    text: 或译：“船正被波浪覆盖。”原文描写波浪持续覆盖船只。
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、增强现场感的话语标记；虽略带庄重色彩，现代读者仍易理解。
- source_word: σεισμὸς μέγας
  choice: 猛烈的风暴
  rationale: σεισμός常指“地震、震动”，但此处海、船和波浪的语境表明是海上的剧烈动荡；译作“猛烈的风暴”自然且符合上下文，并以脚注保留词义信息。
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: 海上忽然起了
  rationale: “海上”忠实保留 θάλασσα；“起了”自然表达事件发生，而“忽然”传达 ἰδού 所营造的突发现场感，同时正文仍以“看哪”明确对应该标记。
- source_word: ὥστε
  choice: 甚至
  rationale: 在此引出风暴造成的强烈结果；汉语用“甚至”连接后果，比机械译作“以致”更流畅，并凸显程度。
- source_word: τὸ πλοῖον
  choice: 船
  rationale: 在加利利海的叙事场景中，“船”准确自然，无须限定为大型“船只”或“小船”。
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: 被波浪遮盖
  rationale: 保留 καλύπτω“遮盖、覆盖”的基本意象及被动结构，也体现现在时不定式所描写的持续过程；脚注给出语境性的理解。
- source_word: αὐτὸς δὲ
  choice: 耶稣却
  rationale: “却”清楚表达风暴与他安睡之间的对比；中文补明“耶稣”以避免孤立经节中的代词指向不清，不增加新的身份解释。
- source_word: ἐκάθευδεν
  choice: 在睡觉
  rationale: 自然体现未完成过去时所表达的持续状态。
theological_decisions:
- issue: σεισμός所指事件的性质
  choice: 正文按海上语境译为“猛烈的风暴”
  alternative: 较字面地译为“大震动”或“大地震”
  rationale: 这是语境与词义的判断，并非教义取舍。海、船和波浪共同指向海上的剧烈风暴；脚注同时保留该词通常可指“地震”或“震动”的事实。
- issue: αὐτός的指称
  choice: 译为“耶稣”
  alternative: 译为“他”
  rationale: 原文在连续叙事中以代词回指耶稣；独立呈现单节时，中文明确姓名可消除歧义，同时不改变所指对象。
translation_notes:
  register: 采用现代、庄重而通俗的书面普通话。“看哪”保留原文鲜明的叙事提示；“猛烈的风暴”避免把海上事件误解为陆地地震；整体句式简洁，并以分号突出风浪与耶稣安睡之间的强烈对照。
