  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你要谨慎，不可告诉任何人；只管去，让祭司察看你，并献上摩西所吩咐的礼物[b]，给他们作见证[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给他们作见证”也可译为“作为给他们的见证”。这句话可能指向向祭司提出的凭证；也有人理解为对那些不肯相信之人的含蓄指证。
    reason: alternative_reading
  - marker: b
    text: 这项吩咐反映摩西律法中患麻风病而得洁净的人应遵行的手续；参见《利未记》14章。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: 你要谨慎，不可告诉任何人
  rationale: Ὅρα在这里是带警戒意味的命令，和后面的虚拟语气共同构成禁止；此译自然地表达郑重嘱咐。
- source_word: ἀλλὰ ὕπαγε
  choice: 只管去
  rationale: ἀλλά在禁令后引出相反的正面命令；“只管去”既体现转折，也符合现代汉语表达。
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: 把自己给祭司察看
  rationale: 保留“把自己给祭司看”的基本意义，同时“察看”自然传达祭司按律法进行检验的语境，而不额外说明检验结果。
- source_word: προσένεγκον τὸ δῶρον
  choice: 献上……礼物
  rationale: προσφέρω在礼仪语境中指献上；δῶρον直译为“礼物”，搭配“献上”即可显明其供献性质。
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: 摩西所吩咐的
  rationale: προστάσσω表示命令或规定；“吩咐”保留权威语气，又适合叙事语体。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 作为给他们的见证
  rationale: 保留εἰς的目的或结果意味，并维持μαρτύριον与αὐτοῖς在见证性质及所指对象上的开放性。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 将希腊文叙事中的历史现在时按自然汉语叙事译为过去语境中的“说”，不改变事件意义。
theological_decisions:
- issue: “作为给他们的见证”的对象与性质
  choice: 保留“他们”和“见证”的含混性
  alternative: 明确译作“给祭司作证据”或“作为反对他们的见证”
  rationale: 原文αὐτοῖς没有明确交代所指群体，μαρτύριον也未明说是正面的凭证还是带有指证意味的见证；正文不替原文作决定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可告诉任何人”表达明确禁令；“给祭司察看”使律法检验的场景易于理解。脚注标记均置于其实际说明的短语之后；因此[a]放在“给他们的见证”之后，[b]放在“摩西所吩咐的礼物”之后。
