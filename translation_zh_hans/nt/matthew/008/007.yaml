  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: zh_hans
  text: 耶稣对他说[a]：“我去医治他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要我去医治他吗？”有些解释者根据上下文把耶稣的话理解为问句，但希腊文措辞本身更自然地读作陈述句。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处καὶ承接叙事；现代汉语无需机械译作“于是”或“并且”，省去可使对话衔接更自然，又不增添原文未明示的时间或因果意味。
- source_word: λέγει
  choice: 说
  rationale: 这是叙事中的历史现在时。现代汉语动词本身不标示时态，译作“说”既自然，也不会把原文的叙事表现力强行改成过去时形式。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 以汉语常用的“对……说”表达λέγει所带的与格间接宾语。上下文已明确受话者，无需重复其身份。
- source_word: Ἐγώ
  choice: 我
  rationale: 原文显式使用第一人称代词，略带强调；汉语“我去医治他”已能自然体现说话者亲自前去，无需加上可能过度强调的“我亲自”。
- source_word: ἐλθών
  choice: 去
  rationale: 不定过去时分词与后面的将来时动词结合，表示伴随或先行动作。汉语依说话者当前所在位置自然说“我去医治他”，比生硬的“我来了以后”更合乎语境。
- source_word: θεραπεύσω
  choice: 医治
  rationale: 在疾病得医治的语境中，θεραπεύω译作“医治”准确、庄重，也符合现代中文圣经叙事用语。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词指前文患病的仆人，译作“他”自然明确。
theological_decisions:
- issue: 此句应译为陈述句还是疑问句
  choice: 陈述句：“我去医治他。”
  alternative: 疑问句：“要我去医治他吗？”或“我去医治他吗？”
  rationale: 希腊文没有疑问词或疑问语气标记，按字面句法最自然地读作陈述。虽然部分解释者依据上下文理解为问句，但正文采用陈述句，同时以脚注保留这一真实存在的语境性歧义。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“耶稣”补明希腊文动词所含的主语，以免单节引用时“他”所指不清；正文中的脚注标记[a]紧随引语提示语，覆盖整句引语的陈述句／疑问句差异。
