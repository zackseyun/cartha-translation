  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: zh_hans
  text: 耶稣进迦百农时，一个百夫长来到他跟前[a]，恳求他[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走近他”。
    reason: lexical_alternative
  - marker: b
    text: 或译“请求他”或“央求他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: 耶稣进……时
  rationale: 以时间从句自然表达属格独立结构及不定过去时分词；“时”不强行限定为严格先后或完全同时。根据上下文明确代词所指为耶稣。
- source_word: εἰς Καφαρναοὺμ
  choice: 进迦百农
  rationale: 采用现代中文圣经语境中通行的地名音译；“进”自然表达进入该地。
- source_word: προσῆλθεν αὐτῷ
  choice: 来到他跟前
  rationale: 准确表达 προσέρχομαι 的“来到某人面前、接近某人”之意，叙事自然，同时不额外推断双方距离或礼仪动作。
- source_word: ἑκατόνταρχος
  choice: 百夫长
  rationale: 这是该罗马军职在中文中的标准译名，既保留具体职衔，也为普通读者熟悉。
- source_word: παρακαλῶν αὐτὸν
  choice: 恳求他
  rationale: 这里的分词说明百夫长来到耶稣跟前时所作的迫切请求。“恳求”比一般的“请求”更能体现语境中的诚恳迫切，又不必强化为哀求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“耶稣”补明希腊文代词在上下文中的指代；句末保留逗号，以衔接下一节百夫长所说的话。英文咨询层的脚注[a]位置与内容不相符，中文稿按希腊词 προσῆλθεν αὐτῷ 将该脚注置于“来到他跟前”之后。
