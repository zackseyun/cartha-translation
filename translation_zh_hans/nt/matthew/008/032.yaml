id: MAT.8.32
reference: Matthew 8:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: zh_hans
  text: 他对它们说：“去吧！”它们就出来，进入猪群中。看哪，整群猪冲下陡坡[a]，进了海里，死在水中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿着悬崖冲下。”希腊语 κρημνός 可指陡坡、陡岸或悬崖。
    reason: lexical_alternative
  - marker: b
    text: 也可按语境译作：“淹死在水中。”希腊文直译为“死在水中”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 去吧
  rationale: 用简短的祈使语准确传达命令；“吧”使现代汉语表达自然，但不削弱命令的明确性。
- source_word: ἐξελθόντες
  choice: 出来
  rationale: 分词表示它们从被附者身上出来；与后面的主要动词顺畅衔接。
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: 进到猪里面
  rationale: 保留介词短语所表达的进入动作，避免把经文仅仅译成走向猪群。
- source_word: χοίρους
  choice: 猪
  rationale: “猪”是现代汉语中普通、准确的对应词，无须采用较书面的“豕”。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文吸引读者注意并增强叙事现场感的话语标记。
- source_word: πᾶσα ἡ ἀγέλη
  choice: 整群猪
  rationale: ἀγέλη是牲畜群，πᾶσα强调全群；“整群猪”简洁自然。
- source_word: ὥρμησεν
  choice: 冲下
  rationale: 该动词表示突然而猛烈地向前奔去；“冲”能体现其力度和速度。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 下陡坡
  rationale: κρημνός可指陡峭的坡岸或悬崖；正文采用涵盖面较宽且自然的“陡坡”。
- source_word: θάλασσαν
  choice: 海
  rationale: 按原文采用“海”，不在正文中改释为“湖”。
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: 死在水中
  rationale: 贴近原文明确陈述的“死在水中”，不把语境所暗示的死因直接写入正文。
theological_decisions:
- issue: 如何描述猪群在水中的死亡
  choice: 死在水中
  alternative: 淹死在水中
  rationale: 上下文强烈暗示猪群是淹死的，但原文动词仅表示“死”；正文保留原文措辞，将较具体的理解列入脚注。
- issue: 进入猪群的动作是否明确为附体
  choice: 进到猪里面
  alternative: 附到猪身上
  rationale: 语境表明污灵进入猪，但原文使用一般性的运动动词和介词；不在正文中加入“附体”这一解释性表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”略带经文体色彩，用以保留原文 ἰδοὺ 的提示和突显作用。代词“它们”承接上文的污灵，符合现代汉语对非人灵体的常见指称。
