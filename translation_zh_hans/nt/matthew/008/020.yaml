- from: 耶稣对他说：“狐狸有洞，天空的飞鸟有巢，但人子没有枕头的地方。”
  to: 耶稣对他说：“狐狸有洞，天空的飞鸟有巢，但人子连安放头休息的地方也没有。”
  rationale: 仅澄清末句在现代汉语中的歧义。“安放头休息”对应“放下头”这一具体表达，且“连……也没有”自然呈现原文与狐狸、飞鸟居所的强烈对比。其余措辞忠实、自然，无须脚注。
