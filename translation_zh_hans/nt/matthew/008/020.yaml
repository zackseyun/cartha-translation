source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: zh_hans
  text: 耶稣对他说：“狐狸有洞，天空的飞鸟有巢，但人子连安放头休息的地方也没有。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中“说”不标明时态，既自然，也无须另加“就”或“曾”。
- source_word: ἀλώπεκες
  choice: 狐狸
  rationale: 该复数名词的直接、自然对应词。
- source_word: φωλεούς
  choice: 洞
  rationale: 指野兽栖身的洞穴；“洞”符合狐狸的语境，也保留原文与鸟类栖身处的对应。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: 既保留τοῦ οὐρανοῦ“天空的”这一形象，又以现代汉语常用的“飞鸟”自然表达。
- source_word: κατασκηνώσεις
  choice: 巢
  rationale: 该词可泛指栖息处、住处；用于鸟类时译作“巢”最自然，但不排除其“栖息之所”的语义背景。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用汉语圣经传统中简洁而稳固的称谓，保留耶稣自称的形式、但以理书背景及原文中的神学张力，不作解释性改写。
- source_word: οὐκ ἔχει ποῦ
  choice: 没有……的地方
  rationale: 按现代汉语习惯表达“没有可供……之处”，忠实传达否定与地点疑问副词的组合。
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: 枕头
  rationale: “枕头”在此作动宾结构，即把头靠下安歇，并非指名词“枕头”；这一汉语惯用说法具体而简洁地再现原文意象。
theological_decisions:
- issue: 耶稣自称ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位人／人之子
  rationale: “人子”既贴近原文构造，又是现代汉语读者可识别的固定称谓；它保留该称谓可能兼具普通人性表达、自我指称及但以理书7章回响的多层含义，不在正文中把它限定为某一种解释。
translation_notes:
  register: 采用现代、凝练而庄重的叙事语言。句式保留狐狸、飞鸟与人子的三重对照；“天空的飞鸟”较“空中的鸟”更直接对应原文，同时仍符合自然汉语。无需脚注，因正文能够准确保留本节的主要词义与神学张力。
