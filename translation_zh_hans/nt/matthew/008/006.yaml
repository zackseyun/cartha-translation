  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: zh_hans
  text: 说：“主啊，我的仆人[a]瘫痪了，正躺在家里，痛苦不堪[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的男孩”或“我的孩子”；希腊语παῖς既可指仆人，也可指男孩或孩子，但在百夫长的语境中，“仆人”较为贴切。
    reason: lexical_alternative
  - marker: b
    text: 或译“正遭受严重的折磨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: 说
  rationale: λέγων是现在分词，承接上一节的叙事动作。汉语以“说”自然衔接上下文；不机械加入“并且”，以免句式生硬。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε既可表示尊敬的称呼，也可能带有更高的信仰含义。“主啊”保留这种开放性，未将其限定为普通的“先生”。
- source_word: ὁ παῖς μου
  choice: 我的仆人
  rationale: παῖς可指仆人、男孩或孩子。按百夫长的社会背景以及路加福音第7章的平行叙述，正文采用“仆人”，并以脚注保留其他词义。
- source_word: βέβληται ἐν τῇ οἰκίᾳ παραλυτικός
  choice: 瘫痪了，躺在家里
  rationale: βέβληται是完成时被动形式，着重其已倒卧并持续处于该状态；“瘫痪了，躺在家里”以自然汉语表达瘫痪卧床在家的结果状态。
- source_word: δεινῶς βασανιζόμενος
  choice: 痛苦不堪
  rationale: 该短语表示正在遭受剧烈的痛苦或折磨。“痛苦不堪”简洁、自然，并保留病人受苦程度之重；较为直译的“受着严重的折磨”列入脚注。
theological_decisions:
- issue: 称呼耶稣时κύριε的语气和含义
  choice: 主啊
  alternative: 先生
  rationale: 此称呼可能只是恭敬的称谓，也可能流露对耶稣更深的认识。“主啊”不把经文预先限定为单纯礼貌用语，同时也不强行说明百夫长已作出完整的信仰宣认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“瘫痪了，躺在家里”保留原文所表达的持续卧倒状态；两个脚注标记均紧随其所说明的正文内容。
