  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: zh_hans
  text: 看哪，全城的人都出来见耶稣；他们看见他，就恳求他离开他们的地区[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的区域”；直译“他们的边界”。
    reason: 说明ὅρια在本语境中指所属的地区或区域，并保留其字面义“边界”。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文吸引读者注意、增强叙事现场感的功能；用语庄重而仍为现代读者所明白。
- source_word: πᾶσα ἡ πόλις
  choice: 全城的人
  rationale: 原文以“全城”统称城中居民；补出“的人”符合现代汉语习惯，也避免把城市本身误解为行动主体。
- source_word: ἐξῆλθεν
  choice: 都出来
  rationale: 表达居民从城里出去的动作；“都”承接“全城的人”的整体性说法，并不强行断定每一个人都在场。
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: 迎接耶稣
  rationale: 这是表示出去与某人相遇的常见结构；“迎接”简洁自然，在此不额外赋予欢迎之意，后文的恳求保留了场景张力。
- source_word: ἰδόντες αὐτὸν
  choice: 他们看见他
  rationale: 将不定过去时分词按语境译成先发生的动作，清楚呈现看见耶稣以后恳求他的叙事次序。
- source_word: παρεκάλεσαν
  choice: 恳求
  rationale: 此处表示郑重而迫切的请求，语气强于一般的“请求”，又不预先解释他们的动机。
- source_word: ὅπως μεταβῇ
  choice: 离开
  rationale: 自然表达恳求的具体内容，即要耶稣从该地离去。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: 离开他们的地区
  rationale: ὅρια 字面为边界，复数在此按范围义指边界以内的地区；“地区”在现代汉语中准确而自然，字面信息置于脚注。
theological_decisions:
- issue: 城中居民为何恳求耶稣离开
  choice: 只陈述他们恳求耶稣离开，不说明动机。
  alternative: 将动机解释为惧怕耶稣的能力、因猪群损失而愤怒，或对事件普遍惊慌。
  rationale: 希腊原文没有明说原因；不把任何推测写入正文，可保留原有的叙事与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留经文的提示语气；分号清楚连接居民出来迎接与随后恳求耶稣离开的两个动作。
