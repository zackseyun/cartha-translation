id: MAT.8.28
reference: Matthew 8:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: zh_hans
  text: 耶稣来到湖的对岸，进入加大拉人的地区[a]。有两个被鬼附的人从坟墓里出来，迎面遇见他。他们极其凶猛，以致没有人能从那条路经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“格拉森人的地区”或“革迦撒人的地区”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: 耶稣来到
  rationale: 属格独立结构在汉语中自然译为时间背景；明确主语为上下文中的耶稣，可避免代词起句含混。
- source_word: τὸ πέραν
  choice: 湖的对岸
  rationale: 指上下文中水域的另一边；补出“湖”使现代汉语表达清楚，但不改变所指。
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: 加大拉人的地区
  rationale: χώρα指地区或地域；按SBLGNT正文Γαδαρηνῶν音译族地称谓。
- source_word: δύο δαιμονιζόμενοι
  choice: 两个被鬼附的人
  rationale: 表达二人受到鬼支配的状态，符合现代中文圣经语体，又不将其处理为纯粹疾病术语。
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: 从坟墓里出来
  rationale: μνημεῖον在此指安葬死者的墓穴；“坟墓”清楚自然。
- source_word: ὑπήντησαν αὐτῷ
  choice: 迎面碰上他
  rationale: 表达相遇之意，并以“迎面”呈现其从墓穴出来与耶稣相遇的动态场景。
- source_word: χαλεποὶ λίαν
  choice: 极其凶猛
  rationale: χαλεπός在此可指凶猛、危险；“凶猛”保留其威胁性而不限定为某一种具体暴力行为，λίαν译为“极其”。
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: 以致没有人能……经过
  rationale: ὥστε表示结果，ἰσχύειν在此指有能力；中文结果句自然清楚。
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: 从那条路经过
  rationale: διά加属格在此表示经过的路线；此译法避免被理解为只是从路旁走过。
theological_decisions:
- issue: 鬼附状态的表达
  choice: 被鬼附
  alternative: 受鬼控制／鬼附身
  rationale: “被鬼附”直接传达δαιμονίζομαι所描述的真实邪灵支配，同时不额外界定其具体机制或程度。
- issue: 地名异文
  choice: 加大拉人的地区
  alternative: 格拉森人的地区／革迦撒人的地区
  rationale: 正文依SBLGNT所印Γαδαρηνῶν；其他有重要抄本依据的地名形式置于脚注，不在正文中消解异文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。将原文较长的一句分成三句，以符合现代汉语节奏，同时保留时间、地点、相遇、人物状态及结果之间的逻辑关系。
