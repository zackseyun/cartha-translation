  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: zh_hans
  text: 耶稣从山上下来时，大批群众跟随他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: 耶稣……下来时
  rationale: 属格独立结构中的不定过去分词自然译为时间从句；补出“耶稣”使现代汉语指代清楚。δέ仅作轻微衔接，无须生硬译出。
- source_word: ἀπὸ τοῦ ὄρους
  choice: 从山上
  rationale: ὄρος可指山或山岭；此处承接前文场景，译作“山”，而“从山上下来”符合自然汉语。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟随他
  rationale: ἀκολουθέω加与格在叙事中表示跟在某人后面；“跟随他”准确、自然，并保留福音书中该动词可能具有的门徒语义回响而不强加解释。
- source_word: ὄχλοι πολλοί
  choice: 有许多群众
  rationale: 保留ὄχλοι的复数群体意象及πολλοί的数量含义；“许多群众”比“很大的群众”更贴近原文的数量表达。
