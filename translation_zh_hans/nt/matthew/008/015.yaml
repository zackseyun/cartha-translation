  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: zh_hans
  text: 耶稣摸了她的手，她的烧就退了；她便起来服侍他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便开始服侍他。”希腊语未完成时可以描述持续的行动，也可能暗示她开始这样做。
    reason: 保留διηκόνει在时体上的可能歧义。
lexical_decisions:
- source_word: ἥψατο
  choice: 摸了
  rationale: ἅπτομαι在此指触碰、接触；“摸了她的手”自然简明，不夸大为抓住。
- source_word: τῆς χειρὸς αὐτῆς
  choice: 她的手
  rationale: χείρ通常指“手”；希腊语在ἅπτομαι后使用属格，汉语自然表达为“摸了她的手”。
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: 烧就退了
  rationale: 原文直译近于“热病离开了她”。现代汉语通常说“退烧”或“烧退了”；此处用“烧就退了”既自然，也保留痊愈紧随触摸发生的叙事关系。
- source_word: πυρετός
  choice: 烧
  rationale: πυρετός指发热、热病；在“烧退了”这一现代汉语惯用表达中译作“烧”准确自然。
- source_word: ἠγέρθη
  choice: 她便起来
  rationale: 该被动形式在这里可按不及物意义理解，指她病愈后起身；不译为“被兴起”，以免无端引入复活联想。
- source_word: διηκόνει αὐτῷ
  choice: 服侍他
  rationale: διακονέω在这一家居场景中指为人提供照料或服务；“服侍他”庄重自然，并保留未完成时所呈现的持续行动，而不强行加入“开始”。
theological_decisions:
- issue: ἠγέρθη是否应带出复活含义
  choice: 译作“她便起来”，按普通叙事理解
  alternative: 她被扶起来；她复起
  rationale: ἐγείρω在别处可用于复活，但本节直接语境只是她退烧后起身；译文不应把此处不要求的神学含义带入。
- issue: διηκόνει的未完成时是否必须译出动作开始
  choice: 正文译作“服侍他”
  alternative: 开始服侍他
  rationale: 未完成时主要呈现过去持续或进行中的行动，在语境中也可能带有起始意味，但“开始”并非词汇明说，因此正文保留较宽的表达，并在脚注说明。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“烧就退了”符合普通现代汉语习惯；“服侍”适合本段家居接待的语境。脚注标记置于相关分句之后。
