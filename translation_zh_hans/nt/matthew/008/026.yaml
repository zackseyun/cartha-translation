source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们这些小信的人，为什么胆怯呢？”于是他起来，斥责风和海，随后就有了极大的平静。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: 胆怯
  rationale: 表达因惧怕而退缩的含义，比单纯“害怕”更贴近该词的责问语气。
- source_word: ὀλιγόπιστοι
  choice: 小信的人
  rationale: 保留原文对信心不足的直接称呼，不扩展为完全没有信心。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留耶稣以权威严厉制止风和海的动作。
- source_word: γαλήνη μεγάλη
  choice: 大大平静
  rationale: 自然呈现形容词“极大”的强调，同时说明平静的是先前的风浪。
theological_decisions:
- issue: ὀλιγόπιστοι所指的信心状态
  choice: 小信的人
  alternative: 没有信心的人
  rationale: 原词表示信心微小或不足，并不等同于全无信心；译文保留这一张力。
- issue: 耶稣斥责的对象
  choice: 风和海
  alternative: 风浪
  rationale: 正文保留原文并列的两个对象，避免把海仅仅解释成浪。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；“胆怯”“小信”“斥责”保留原文责问与权威性的力度。
