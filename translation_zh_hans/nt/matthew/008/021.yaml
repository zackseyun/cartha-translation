  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: zh_hans
  text: 又有一个门徒对他说：“主啊，请准我先去安葬我的父亲。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话可能是指父亲刚刚去世，需要立即安葬；也可能较宽泛地指先尽孝道，等父亲去世后再来。希腊原文没有说明具体是哪一种情形。
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: 又有一个门徒
  rationale: 表达另有一位属于门徒群体的人接着开口；“又有”自然承接上文，也不把 δέ 译成过强的转折。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留直接称呼中的尊敬语气及其可能具有的神学分量，不弱化为单纯的“老师”。
- source_word: ἐπίτρεψόν μοι
  choice: 请准我
  rationale: 准确表达请求许可的祈使语气；“请准我”庄重而自然。
- source_word: πρῶτον ἀπελθεῖν
  choice: 先回去
  rationale: πρῶτον 表示次序上的优先；ἀπελθεῖν 表示离开当前所在之处。“回去”在汉语语境中自然表达离开去处理父亲安葬之事，但不额外指定地点。
- source_word: θάψαι τὸν πατέρα μου
  choice: 安葬我的父亲
  rationale: “安葬”准确、庄重地表达 θάψαι，在现代汉语中比单说“埋葬”更适合亲属丧葬语境。
theological_decisions:
- issue: 请求安葬父亲所指的时间与情形
  choice: 正文直译为请求先去安葬父亲，不判定父亲是否刚刚去世。
  alternative: 可理解为立即办理父亲的丧葬，也可理解为先尽家庭责任、等父亲去世后再来跟从。
  rationale: 希腊文只陈述请求，并未说明父亲当时是否已经去世；译文应保留这种未决性，不把某一种文化或神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请准我”保留请求许可的敬意；“安葬”符合亲属丧葬语境。脚注标记置于整句之后，以说明整项请求的歧义。
