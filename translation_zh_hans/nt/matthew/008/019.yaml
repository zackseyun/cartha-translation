  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: zh_hans
  text: 有一个文士上前，对他说：“老师，无论你往哪里去[a]，我都要跟从你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 该希腊语动词也可较具体地指“离去”或“走开”；但在这里按上下文自然地指“去、前往”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前
  rationale: 该词表示朝耶稣走近后说话；“上前”在现代汉语叙事中自然，并保留趋近之意。
- source_word: εἷς
  choice: 有一个
  rationale: 数词在这里用于引出一个人物；译作“有一个”既自然，也保留原文对单个人物的明确指称。
- source_word: γραμματεὺς
  choice: 文士
  rationale: “文士”是福音书语境中对该身份的通行译法，避免用“律法教师”或“律法专家”增添原文未明说的解释。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接翻译该称呼的基本含义，表达尊敬而不额外强化为“主上”或音译作“拉比”。
- source_word: ἀκολουθήσω
  choice: 我都要跟从你
  rationale: 未来时表达此人所宣告的意愿；“跟从”同时保留实际随行和作门徒的可能含义，“都”与前面的“无论”自然呼应。
- source_word: ὅπου ἐὰν
  choice: 无论……哪里
  rationale: 该组合表达不限定地点的关系意义，现代汉语以“无论……哪里”最为自然。
- source_word: ἀπέρχῃ
  choice: 往……去
  rationale: 该动词可具体表示离去或前往；正文用“往……去”符合语境和现代汉语习惯，同时以脚注保留“离去”的词义色彩。
theological_decisions:
- issue: διδάσκαλος作为对耶稣的称呼
  choice: 老师
  alternative: 夫子／拉比
  rationale: 原文在此明确表达“教师”这一尊称，但并未要求更强的基督论头衔；“老师”准确、自然，也不预先判定说话者对耶稣身份的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有一个文士上前”简洁保留原文语序关系；人物直言使用自然口语句式，但避免过度口语化。
