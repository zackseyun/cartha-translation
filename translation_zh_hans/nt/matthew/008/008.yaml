  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: zh_hans
  text: 百夫长回答说：“主啊，我不配让你进到我屋檐下；只要说一句话[a]，我的仆人[b]就会痊愈。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只要吩咐一声。”希腊文直译为“说一句话”。
    reason: lexical_alternative
  - marker: b
    text: “仆人”或译“男孩”或“孩子”；希腊文在不同语境中可指孩子、少年或仆人。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: 回答说
  rationale: 将分词与陈述动词合并为现代汉语自然的引语引入语，同时保留回应的语气。
- source_word: ἑκατόνταρχος
  choice: 百夫长
  rationale: 这是对罗马军队中统领约百名士兵之军官的传统且准确的汉语称谓。
- source_word: Κύριε
  choice: 主啊
  rationale: 既保留对耶稣的尊称，也不消除该称呼可能具有的基督论分量。
- source_word: οὐκ εἰμὶ ἱκανός
  choice: 我不配
  rationale: 此处表达身份或价值上的不相称，而非单纯没有能力；“不配”自然体现百夫长的谦卑。
- source_word: ὑπὸ τὴν στέγην
  choice: 到我舍下来
  rationale: 保留“在我的屋顶之下”的具体意象，同时以庄重而可懂的现代汉语表达进入家中。
- source_word: μόνον εἰπὲ λόγῳ
  choice: 只要说一句话
  rationale: 表达 μόνον 的限制意味，并贴近希腊文“以一句话说”的结构；汉语中也自然清楚。
- source_word: ἰαθήσεται
  choice: 就会痊愈
  rationale: 准确表达将来被动的医治结果；汉语无需机械保留被动形式。
- source_word: παῖς
  choice: 仆人
  rationale: 结合百夫长的社会处境及平行叙事，“仆人”最符合上下文；该词也可指男孩或孩子，故以脚注保留歧义。
theological_decisions:
- issue: 对耶稣的称呼 κύριος
  choice: 主
  alternative: 先生／主人
  rationale: “主”保留该称呼的尊敬意味及潜在基督论内涵，却不把其含义限定为单纯礼貌称谓。
- issue: παῖς 的身份
  choice: 仆人
  alternative: 男孩／孩子
  rationale: “仆人”最符合叙事语境，但原词有真实的词义幅度，因此在脚注中保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“到我舍下来”保留原文“屋顶之下”的家庭空间意象；脚注标记均置于所说明的词语之后。
