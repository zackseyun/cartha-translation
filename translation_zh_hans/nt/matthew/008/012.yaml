id: MAT.8.12
reference: Matthew 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: zh_hans
  text: 但本来属于这国度的人[a]，反而要被赶到外面的黑暗里。在那里，必有哀哭切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“国度之子”，指那些被视为理当承受或属于这国度的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: 但本来属于这国度的人
  rationale: δέ承接上文形成鲜明对比；“国度之子”是闪语式表达，指被视为理当承受或属于国度的人。正文采用自然现代汉语表达其所指，并以脚注保留原文形式及反讽张力。
- source_word: ἐκβληθήσονται
  choice: 要被赶到
  rationale: 保留将来被动和强制排除的力度；“赶到……里”在汉语中自然，也准确呈现被逐出并投入黑暗之中的意象。
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: 外面的黑暗
  rationale: 贴近马太特有的审判意象，保留“外面”与“黑暗”的具体表达，不释义为“地狱”或其他系统神学术语。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 置于第二句开头，保留原文对审判场所的强调，并使汉语流畅。
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: 必有哀哭切齿
  rationale: “哀哭切齿”是自然、庄重且辨识度高的汉语圣经表达，兼顾κλαυθμός的悲恸与βρυγμὸς τῶν ὀδόντων的咬牙意象。
theological_decisions:
- issue: 如何表达末世性排除和审判的意象
  choice: 保留“被赶到外面的黑暗里”和“哀哭切齿”的具体图像
  alternative: 直接解释为“下地狱”或“受永刑”
  rationale: 本节确实表达严厉的审判与被国度排除，但原文在此使用的是意象，而非这些系统化术语；保留原有图像可避免超出经文措辞。
- issue: υἱοὶ τῆς βασιλείας的性别与习语表达
  choice: 正文译作“本来属于这国度的人”，脚注注明直译“国度之子”
  alternative: 正文直译“国度之子”或译作“国度的儿女”
  rationale: 这里的阳性复数是关系性习语，重点在被视为国度当然成员或承受者，并非只强调男性。现代汉语正文传达其语义，脚注则保留原文形式和继承意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“反而”明确承接上文外来者进入国度与原被视为属于国度者遭排除的对比；不增添经文未明说的审判体系。
