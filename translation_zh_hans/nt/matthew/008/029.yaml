  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: zh_hans
  text: 看哪，他们大声喊道：“上帝的儿子，我们与你有什么相干[a]？所定的时候还没到[b]，你就到这里来折磨我们吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“我们与你之间有什么？”这是表示疏离或抗拒的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“时候还没到。”原文的“时候”可指特定或所定的时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并使场景骤然鲜明的话语标记；“看哪”庄重、简洁，在现代中文中仍可理解。
- source_word: ἔκραξαν λέγοντες
  choice: 他们喊叫说
  rationale: “喊叫”体现 κράζω 的高声与强烈语气，“说”则保留 λέγοντες 的引语引介功能。
- source_word: Τί ἡμῖν καὶ σοί
  choice: 我们与你有什么相干
  rationale: 这是表示疏离、抗拒或质问的闪语式习语。该译法既保留双方关系这一字面意象，也自然传达“你为何来干涉我们”的语用力度。
- source_word: υἱὲ τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接译出对耶稣的称呼，不削弱也不扩展其基督论含义。
- source_word: ἦλθες ὧδε
  choice: 你就到这里来
  rationale: “到这里来”明确表达 ὧδε 的地点意义；配合前置时间分句和“就”，自然呈现来临早于预期的质问。
- source_word: πρὸ καιροῦ
  choice: 所定的时候还没到
  rationale: καιρός 可指特定、合宜或预定的时刻；此译法保留审判时刻尚未来到的语境含义，而不说明是谁或如何定下。
- source_word: βασανίσαι
  choice: 折磨
  rationale: 准确表达 βασανίζω 在审判语境中的剧烈痛苦，同时不把含义限缩为纯粹的肉体酷刑。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 直接对应复数宾格，指附在人身上的邪灵说话者。
theological_decisions:
- issue: 邪灵对耶稣身份的称呼
  choice: 上帝的儿子
  alternative: 神的儿子
  rationale: 原文明确使用 υἱὲ τοῦ θεοῦ 这一称号；正文直译，不淡化邪灵对耶稣身份的承认，也不添加原文未说明的教义阐释。
- issue: καιρός 的末世审判意味
  choice: 所定的时候还没到
  alternative: 时候还没到
  rationale: 上下文暗示折磨或审判有其特定时刻。“所定的时候”保留这种含义，但不进一步指定详细的末世时间表。
- issue: 质问句的语气与关系习语
  choice: 我们与你有什么相干
  alternative: 你要干涉我们吗
  rationale: 保留原文习语的开放性，使其既可表达彼此无关，也可带有抗拒干涉的意味，避免只固定为一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文叙事的突显效果；“有什么相干”略带庄重色彩，但仍属通行表达，并能保留原文习语的张力。问句按自然中文语序重组，将称呼置于句首，并以“还没到……就……”呈现 πρὸ καιροῦ 的提前意味。
