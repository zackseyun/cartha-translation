  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: zh_hans
  text: 到了晚上，人们把许多受鬼魔侵扰的人[a]带到他那里；他用一句话把诸灵赶出去，又医治了所有患病的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被鬼附的人。”希腊文分词指受鬼魔影响的人；“被鬼附”是传统而简洁的译法，但未必精确界定这种影响的程度。
    reason: 说明δαιμονιζομένους的语义范围，避免将其理解为对受影响程度的过度精确界定。
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 到了晚上
  rationale: 这是表示时间的属格独立结构；“到了晚上”自然、简洁，并保留事件发生的时间背景。
- source_word: προσήνεγκαν αὐτῷ
  choice: 人们把……带到他那里
  rationale: προσφέρω在这里指把人带到耶稣面前；补出不定主语“人们”符合现代汉语表达。
- source_word: δαιμονιζομένους πολλούς
  choice: 许多被鬼附的人
  rationale: 该分词指处于鬼魔影响或控制之下的人。“被鬼附”是简洁且通行的汉语译法；脚注保留较宽的词义可能性。
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: 赶出那些灵
  rationale: ἐκβάλλω在赶鬼语境中意为“赶出”；直译τὰ πνεύματα为“那些灵”，不擅自补成“邪灵”，上下文已表明其性质。
- source_word: λόγῳ
  choice: 用一句话
  rationale: 工具格用法，表示借着一句话或一个命令；不补入原文未明说的“他的”，也不加入“只”。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 所有患病的人
  rationale: κακῶς ἔχειν是表示生病、身体不适的常用表达；“患病的人”清楚自然，并与医治的语境相合。
- source_word: ἐθεράπευσεν
  choice: 医治了
  rationale: θεραπεύω在福音书记述中通常指医治；“医治”既准确又符合庄重的现代汉语圣经语体。
theological_decisions:
- issue: δαιμονιζομένους与τὰ πνεύματα所描述的性质
  choice: 译为“被鬼附的人”和“那些灵”
  alternative: “受鬼魔侵扰的人”；或将其心理化为精神疾病
  rationale: 经文本身把赶出诸灵与医治病人并列，译文应保留这两个叙事类别，不将鬼魔现象心理化。同时，脚注说明δαιμονίζομαι未必精确界定影响或控制的程度。
- issue: λόγῳ所表达的方式
  choice: 译为“用一句话”
  alternative: “用他的话”或“借着说话”
  rationale: 保留其工具性和耶稣命令的权威感，同时不添加原文没有明说的所有格，也不作超出本节的教义阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人们”自然补足希腊文未明说的复数主语；分号保留赶鬼与医病两个并列行动。脚注标记置于其实际解释的“被鬼附的人”之后，而非置于时间短语之后。
