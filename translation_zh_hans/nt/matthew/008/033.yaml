  verdict: revise
  source_fidelity: “放猪的人”能指照看猪群者，但“报告给人”在汉语中既不自然，也无必要地补出了泛指受话者。原文只说他们进城报告，并未明说报告给谁。正文将τὰ τῶν δαιμονιζομένων译为“包括有关那两个被鬼附之人的事”，符合上下文中两人的明确指向；脚注保留该属格短语较凝练的字面表达与语义开放性。
  naturalness: “进城把一切都报告给人”搭配生硬；改为“进城去，把一切事……都报告了”更合乎现代标准汉语叙事表达，也不需要补出不明的对象。“看守猪群的人”较“放猪的人”更准确说明其照料猪群的角色。
  terminology: “被鬼附之人”是通行且庄重的译法，可保留。为与现代汉语自然度协调，正文用“被鬼附的人”，脚注仍可用较庄重的“被鬼附之人”。
  issues:
