    rationale: ἀπήγγειλαν只说明他们作了报告；虽然进城暗示城内居民是听者，但原文没有明确宾语。汉语可自然省略受话者，无须加入“给人”。
  - severity: low
    issue: “放猪的人”略易被理解为把猪放出去的人。
    rationale: οἱ βόσκοντες指正在喂养、放牧或照看猪群的人；“看守猪群的人”更清楚准确，也保持现代叙事语体。
  revised_text: 看守猪群的人就逃走了；他们进城去，把一切事，包括有关那两个被鬼附的人的事，都报告了。[a]
