  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: zh_hans
  text: 看守猪群的人就逃走了；他们进城去，把一切事，包括有关那两个被鬼附的人的事，都报告了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以及有关那些被鬼附之人的事。”
    reason: 保留καὶ τὰ τῶν δαιμονιζομένων这一凝练属格短语的较字面表达及其语义宽度。
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: 放猪的人就
  rationale: 分词实指照看前文猪群的人；“放猪的人”比泛称“牧人”更明确自然。δέ以“就”承接叙事进展。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 直接表达φεύγω的逃离之意，并保持叙事的鲜明感。
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: 进城
  rationale: 简洁自然地表达先离开现场、进入城里的动作；汉语按动作顺序即可体现分词与主句的关系。
- source_word: ἀπήγγειλαν πάντα
  choice: 把一切都报告给人
  rationale: “报告”符合ἀπαγγέλλω转告消息的语义；“一切都”保留πάντα的总括性。原文未明说报告对象，汉语补入泛指“给人”以使句子完整，但不限定具体对象。
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: 包括那两个被鬼附之人的事
  rationale: καί在此自然理解为从“一切”中特别列举；属格短语字面为“那些被鬼附者的事/有关他们的事”。“两个”由紧邻上文（太8:28）明确补出。
- source_word: δαιμονιζομένων
  choice: 被鬼附之人
  rationale: 沿用现代中文圣经语境中清楚通行的表达，肯定叙事中的真实鬼魔侵扰，同时不额外界定其机制或程度。
theological_decisions:
- issue: 如何表达δαιμονιζομένων所指的鬼魔侵扰而不加入原文没有的教义区分
  choice: 被鬼附之人
  alternative: 受鬼魔侵扰的人
  rationale: “被鬼附”直接、通行，并符合本段叙事；但不进一步说明附着、控制或压迫的具体方式。
- issue: 是否把καὶ τὰ τῶν δαιμονιζομένων解释为发生在二人身上的具体事件
  choice: 正文采用较自然的“包括那两个被鬼附之人的事”，脚注保留较直译表达
  alternative: 以及有关那些被鬼附之人的事
  rationale: 希腊文属格短语本身较凝练，可指有关他们的情况或事情；正文传达语境意义，脚注保留其措辞上的开放性，避免过度限定为某一件具体遭遇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“放猪的人”明确承接上下文；句式按汉语自然动作顺序铺陈。脚注标记置于相关分句之后。
