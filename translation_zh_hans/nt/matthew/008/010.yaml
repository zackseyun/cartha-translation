  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: zh_hans
  text: 耶稣听见这话[a]，就感到惊讶，对跟随他的人说：“我实在告诉你们，在以色列当中，我没有见过任何人有这么大的信心。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“听见”；“这话”根据上文补出。
    reason: supplied_context
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见这话
  rationale: 不定过去时分词交代耶稣感到惊奇的缘由；原文只说“听见”，“这话”根据上文百夫长所说的话补出，使现代汉语表达完整自然。
- source_word: ἐθαύμασεν
  choice: 感到惊奇
  rationale: 表达耶稣对百夫长之信心的惊异，保留叙事张力，不对其神学含义另作解释。
- source_word: τοῖς ἀκολουθοῦσιν
  choice: 跟随他的人
  rationale: 现在时分词指当时正跟随、陪同耶稣的人；避免直接译成可能带有固定群体意味的“门徒”。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以自然庄重的现代汉语保留耶稣郑重宣告公式的强调语气。
- source_word: παρ’ οὐδενὶ
  choice: 没有从任何人身上
  rationale: παρά加与格在此表示“在某人那里、就某人而言”；该译法明确指出耶稣未在任何人身上发现这种信心。
- source_word: τοσαύτην πίστιν
  choice: 这么大的信心
  rationale: τοσαύτην强调程度；“这么大的信心”在现代汉语中自然，并比单纯“这样的信心”更清楚地传达程度。
- source_word: ἐν τῷ Ἰσραήλ
  choice: 在以色列中
  rationale: 既可表达范围，也保留“以色列”兼指其民众共同体的意味。
- source_word: εὗρον
  choice: 见过
  rationale: 原文为不定过去时；结合否定范围，汉语“没有……见过”自然表达截至当时的经历。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 本处所指的是百夫长对耶稣权柄的相信与倚赖。“信心”既符合语境，也保留该词的常用神学表达；“忠信”在此不如“信心”贴切。
- issue: 耶稣“感到惊奇”的表述
  choice: 直接保留“感到惊奇”
  alternative: 惊叹；希奇
  rationale: ἐθαύμασεν明确描写惊异反应。译文不以解释性措辞削弱或消解这一叙事与神学张力。
- issue: 否定范围及句法关系
  choice: 我在以色列中没有从任何人身上见过这么大的信心
  alternative: 即使在以色列，我也没有见过这么大的信心
  rationale: 主译尽量贴合所给SBLGNT词序和παρ’ οὐδενὶ的个人指向；另一种表达强调“连在以色列也没有”，意义接近，但对否定焦点的安排略有不同。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我实在告诉你们”保留福音书中郑重宣告的语气；“跟随他的人”准确指当时随行者；全句避免文言化的“希奇”和过度口语化表达。
