- from: 耶稣听见这话[a]，就感到惊奇，对跟随他的人说：“我实在告诉你们，我在以色列中没有从任何人身上见过这么大的信心[b]。”
  to: 耶稣听见这话[a]，就感到惊讶，对跟随他的人说：“我实在告诉你们，在以色列当中，我没有见过任何人有这么大的信心。”
  rationale: 调整否定句的汉语表达，使其自然地保留“在以色列当中／任何人／如此大的信心”的范围和重点。删除脚注b，因为其“即使”引入原文没有明确表达的让步语气。
