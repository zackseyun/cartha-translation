id: MAT.8.11
reference: Matthew 8:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: zh_hans
  text: 但我告诉你们，必有许多人从东从西而来，在天国里与亚伯拉罕、以撒、雅各一同坐席[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐席”直译为“斜倚”；古人赴宴用餐时常斜倚在席位上。
    reason: cultural_note
  - marker: b
    text: “从东从西”表示从远方各地而来；按上下文，也可能包括以色列以外的人。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: λέγω意为“说、告诉”，δέ在此承接上文并带有温和的转折。“但我告诉你们”符合现代汉语表达，也保留话语转折。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该形容词在原文中作名词使用。汉语补出“人”更自然，不增加原文没有的身份限定。
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: 从东从西
  rationale: 两个复数名词在此惯用地表示东方和西方的地域。“从东从西”简洁自然，并保留范围广远的地理意象。
- source_word: ἥξουσιν
  choice: 必……而来
  rationale: ἥκω表示“来、到达”，将来时在此译为“必……而来”，自然表达将来的确定事件。
- source_word: ἀνακλιθήσονται
  choice: 一同坐席
  rationale: 该动词指古代赴宴时斜倚用餐。现代汉语“坐席”清楚传达参加筵席、同桌相交的意思；脚注补充其字面文化背景。
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: 与亚伯拉罕、以撒、雅各一同
  rationale: μετά加属格表示相伴、共同参与；此处是在筵席中与三位先祖相交。人名采用现代中文圣经中通行的译名。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 在天国里
  rationale: “天国”是马太这一特有表达在现代汉语中的准确、通行译法；“里”使地点关系自然清楚。
theological_decisions:
- issue: 筵席意象与末世相交
  choice: 译作“与……一同坐席”，保留共同赴席的图景。
  alternative: 译作“与……一同坐下”或仅译作“与……同在”。
  rationale: 原文动词带有赴宴斜倚用餐的含义，不只是处于同一地点。“坐席”既保留筵席相交的神学意象，又不在正文中增添“末世筵席”等解释性措辞。
- issue: “从东从西而来”的人群范围
  choice: 正文只译“许多人从东从西而来”。
  alternative: 明确译为“许多外邦人从东从西而来”。
  rationale: 上下文可能暗示以色列以外的人也包括在内，但希腊文只明说“许多人”。保留地理说法，可避免把合理推论写成原文的明说。
- issue: “天国”的表达
  choice: 沿用“天国”。
  alternative: 译作“诸天之国”或“上天的国”。
  rationale: 原文复数属格τῶν οὐρανῶν是马太惯用语，不要求在汉语中机械保留复数。“天国”既准确又不会额外界定该国度的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从东从西”保留原文的对称节奏；“坐席”比“斜倚”更易理解，同时借脚注保留古代宴饮习俗。正文未把“许多人”直接解释为“外邦人”，以保留原文的含蓄与张力。
