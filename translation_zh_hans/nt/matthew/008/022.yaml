  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: zh_hans
  text: 耶稣却对他说：“跟从我，任凭死人[a]埋葬他们自己的死人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第一处“死人”通常被理解为比喻，指对属灵之事没有回应的人；第二处则指身体已经死亡的人。
    reason: 说明一种常见的解释，同时不在正文中消除原文的双关和歧义。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文并表达温和的转折，体现耶稣对请求的纠正性回应，又不把对比说得过强。
- source_word: λέγει
  choice: 说
  rationale: 希腊文用历史现在时增强叙事现场感；现代汉语的“说”不显时态，可自然保留这种鲜明直接的叙述。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 准确表达直接的命令，也兼具实际随行与作门徒的含义；“跟从”庄重、自然，并保留门徒语境。
- source_word: ἄφες
  choice: 任凭
  rationale: 在此表达放手、不再承担这项事务之意；“任凭……埋葬”在汉语中能自然引出后接的不定式内容，同时避免单纯许可的误读。
- source_word: νεκρούς ... νεκρούς
  choice: 死人……死人
  rationale: 两处使用同一译词，以保留原文刻意的重复、双关和神学张力，不在正文中擅自把第一处明确译成“灵性死亡的人”。
- source_word: θάψαι
  choice: 埋葬
  rationale: 直接准确地表达安葬死者的动作，与“任凭”组成自然的现代汉语结构。
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: 他们自己的死人
  rationale: 保留ἑαυτῶν所带的反身领属和强调；虽然措辞尖锐，却与原文的修辞冲击相称。
theological_decisions:
- issue: 耶稣话语中两处“死人”的含义
  choice: 正文保留“死人……他们自己的死人”的相同措辞，不解释第一处。
  alternative: 把第一处明确译为“灵性死亡的人”，第二处译为身体死亡的人。
  rationale: 第一处很可能是比喻用法，第二处是字面用法，但原文有意使用同一个词形成双关和冲击力。正文不加入“灵性”等解释，以保留真实的歧义与神学张力；常见理解放入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“跟从我”保留门徒召唤的传统语感；“任凭死人埋葬他们自己的死人”刻意保留原文重复及其尖锐、悖论式的表达。脚注标记[a]已置于正文对应位置。
