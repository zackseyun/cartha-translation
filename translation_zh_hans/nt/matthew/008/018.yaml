  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: zh_hans
  text: 耶稣看见有许多群众围着他，就吩咐到对岸去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: 许多人
  rationale: 字面为“许多群众/许多群人”，但现代汉语通常不说“许多群众”；依语境自然表达为“许多人”，同时保留人数众多之意。
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: 表达带有权威的命令，比一般的“说”更准确，也符合现代汉语叙事语体。
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: 往对岸去
  rationale: τὸ πέραν 在加利利湖语境中指水域的另一边；“往对岸去”自然地保留不定式内容，同时不擅自补出船只或具体目的地。
theological_decisions:
- issue: 命令的受命者在希腊文中未明说
  choice: 采用无显式宾语的“吩咐往对岸去”
  alternative: “吩咐门徒往对岸去”或“吩咐众人往对岸去”
  rationale: 原文未注明耶稣吩咐谁；中文省略受命者，可保留这一指称上的含蓄，避免依据后文擅自补明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“就”承接 δέ 的叙事推进功能，不机械译作“但”或“于是”。
