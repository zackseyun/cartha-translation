  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: zh_hans
  text: 看哪，有一个患麻风病的人前来，俯伏在他面前[a]，说：“主啊，你若愿意，就能使我洁净。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他下拜”或“敬拜他”。原文动词可按语境表示俯伏致敬、尊崇或敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文提示读者注意、增强叙事现场感的作用；“看哪”虽略带庄重色彩，但在现代中文圣经叙事中清楚可懂。
- source_word: λεπρὸς
  choice: 一个患麻风病的人
  rationale: 该形容词在此作名词使用，指患有传统上称为“麻风病”之皮肤病的人；此译法既忠实表达病况，也避免用疾病给人定名。
- source_word: προσελθὼν
  choice: 前来
  rationale: 表达此人走近耶稣的动作，简洁自然，并保留朝向性的含义。
- source_word: προσεκύνει
  choice: 俯伏在他面前
  rationale: 该词可指俯伏致敬、表示尊崇或敬拜；主文译出可见的敬畏动作，同时不把其神学含义过早限定为“敬拜”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对耶稣既可表示尊敬与权威、又可能具有基督论分量的称呼范围；“啊”自然呈现直接呼告。
- source_word: ἐὰν θέλῃς
  choice: 你若愿意
  rationale: 自然准确地表达条件式请求所指向的意愿，没有把问题误解为能力上的疑问。
- source_word: δύνασαί
  choice: 就能
  rationale: 明确表达能力或权能；与“你若愿意”连用，简洁呈现此人对耶稣能力的确信。
- source_word: καθαρίσαι
  choice: 使我洁净
  rationale: 既包含病得洁净的身体层面，也保留与麻风病相关的礼仪洁净含义，比泛化为“医治我”更贴近原文。
theological_decisions:
- issue: προσκυνέω用于对耶稣的动作时如何理解
  choice: 主文译作“俯伏在他面前”，脚注说明也可表达敬拜。
  alternative: “敬拜他”或“向他下拜”
  rationale: 上下文明确呈现尊崇性的身体动作，但该词的语义可从俯伏致敬延伸至敬拜。主文保留动作和敬意，脚注呈现更强的神学理解，以免消除原文张力。
- issue: κύριε作为对耶稣的称呼
  choice: 主啊
  alternative: 先生或夫子
  rationale: 该称呼在此至少承认耶稣的权威，也可能具有更深的基督论意义；“主啊”能保留这一语义范围。
- issue: καθαρίσαι的身体与礼仪含义
  choice: 使我洁净
  alternative: 医治我
  rationale: 在麻风病语境中，原词不仅涉及身体康复，也涉及从不洁状态中得到洁净；因此不将其简化为一般性的医治。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看哪”保留原文醒目标记；“患麻风病的人”兼顾准确与对人的尊重；整体句式简洁，适合公开诵读。
