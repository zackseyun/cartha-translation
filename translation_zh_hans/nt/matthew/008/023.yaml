id: MAT.8.23
reference: Matthew 8:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: zh_hans
  text: 他上了船[a]，门徒就跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他上船时”。
    reason: 原文用分词表达时间关系，可侧重于登船之时，也可按叙事次序理解为上船之后。
lexical_decisions:
- source_word: ἐμβάντι
  choice: 上了
  rationale: 不定过去时主动分词与 αὐτῷ 呼应，在这里表示伴随主句的时间背景。译为“上了”自然地表达登船动作，并让后面的“就”体现动作次序；脚注保留“上船时”这一可能的时间侧重。
- source_word: πλοῖον
  choice: 船
  rationale: πλοῖον 可指大小不一的船只；本节没有定冠词。现代汉语中的“上了船”不必用量词来标明定指或不定指，因此既自然，又不强行判定是“那条船”还是“一条船”。
- source_word: ἠκολούθησαν
  choice: 跟随
  rationale: ἀκολουθέω 在此直接描写门徒随耶稣上船，同时在马太福音中也可带有作门徒的含意。“跟随”能保留行动层面与门徒身份之间的呼应。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: μαθηταί 是福音书中对耶稣门徒的常用称呼。汉语在上下文明确时省略“他的”更为自然，而“门徒”仍清楚指向耶稣的门徒。
- source_word: αὐτῷ ... αὐτῷ
  choice: 他……他
  rationale: 两个代词都指向上下文中的耶稣；译文保留代词，不额外补出专名。
theological_decisions:
- issue: ἀκολουθέω 可能含有作门徒的意味
  choice: 译作“跟随”，不作解释性扩写
  alternative: 跟他一同去；成为他的跟随者
  rationale: 本节首先叙述实际行动，但“跟随”也能自然保留马太福音中可能存在的门徒含意，避免只取其中一层。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“上了船……就……”符合汉语叙事习惯；“门徒”“跟随”保留经文传统用语及潜在的门徒主题。
