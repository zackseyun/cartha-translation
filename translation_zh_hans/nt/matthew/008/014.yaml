  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: zh_hans
  text: 耶稣来到彼得家里，看见彼得的岳母躺着，正在发烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来到
  rationale: 不定过去时分词在这里表达先于主句动作发生的时间背景；汉语用“来到……，看见……”自然呈现这一先后关系。
- source_word: οἰκίαν Πέτρου
  choice: 彼得家里
  rationale: 属格表示归属；“彼得家里”既贴近原意，也比“彼得的房屋”更符合现代汉语叙事习惯。
- source_word: πενθερὰν αὐτοῦ
  choice: 彼得的岳母
  rationale: πενθερά意为岳母；将代词所指的彼得明说出来，可避免现代汉语读者误以为是耶稣的岳母。
- source_word: βεβλημένην
  choice: 躺着
  rationale: 该完成时被动分词在患病语境中惯指处于躺卧状态；不补入原文未明说的“床上”或“卧病”。
- source_word: πυρέσσουσαν
  choice: 正在发烧
  rationale: 现在时分词描述当时持续的发热状态；“正在发烧”简洁、自然，并保留进行中的意味。
theological_decisions:
- issue: αὐτοῦ所指的人
  choice: 明确译作“彼得的岳母”
  alternative: 译作“他的岳母”
  rationale: 原文在句法和上下文中均指彼得；汉语若照译“他的”，可能因耶稣是主句主语而产生错误指代。明确彼得只消除目标语歧义，不作超出经文的神学推论。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“躺着，正在发烧”保留原文两个并列分词所描写的状态，不增添“在床上”或“病倒”等原文未明确表达的细节。
