  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: zh_hans
  text: 耶稣伸出手来摸他，说：“我愿意，你洁净吧！”他立刻就从麻风[a]中得了洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“麻风”的希腊词λέπρα，所指可能比现代医学所说的汉森病更广，包括多种严重的皮肤病。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸出手来
  rationale: 自然表达先于“摸他”发生的动作，同时保留具体的身体姿态。
- source_word: ἥψατο αὐτοῦ
  choice: 摸他
  rationale: ἅπτομαι加属格在此通常指触摸；“摸他”简明自然，也符合医治场景。
- source_word: Θέλω
  choice: 我愿意
  rationale: 回应上文对耶稣是否愿意的询问，表达意愿，而不是将其误作单纯的将来时。
- source_word: καθαρίσθητι
  choice: 你洁净了吧
  rationale: 保留“洁净”的身体与礼仪双重含义；“了吧”在现代汉语中可自然表达带有成就意味的命令。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确传达结果随即发生。
- source_word: ἐκαθαρίσθη
  choice: 洁净了
  rationale: 与前句的命令保持词汇呼应，并保留原文的洁净观念，不缩减为单纯的“治好了”。
- source_word: ἡ λέπρα
  choice: 他的麻风
  rationale: 保留圣经传统中可辨识的称呼，并按αὐτοῦ表达为“他的”；用脚注说明其古代语义范围可能较现代麻风病更广。
theological_decisions:
- issue: καθαρίζω所含的洁净与医治含义
  choice: 命令和结果均译作“洁净”
  alternative: 译作“治好”或“痊愈”
  rationale: 原文刻意使用洁净语言，兼具身体康复和礼仪洁净的含义；只译为“治好”会削弱这种张力。
- issue: Θέλω在耶稣回答中的含义
  choice: 我愿意
  alternative: 我要／我肯
  rationale: 此句直接回应病人关于耶稣意愿的请求；“我愿意”既自然，也不加入原文没有明确表达的将来时意味。
- issue: 末句的语法主语
  choice: 他的麻风立刻就洁净了
  alternative: 他立刻就从麻风中得了洁净
  rationale: 保留希腊文以“他的麻风”为主语的结构和καθαρίζω的词汇呼应，虽略带原文色彩，在中文中仍清楚可懂。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“伸出手来摸他”保持叙事动作清晰；“你洁净了吧”比生硬的“要洁净”更自然，同时保留命令语气和洁净主题。
