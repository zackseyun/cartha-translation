  source_fidelity: 译文准确传达了耶稣伸手、触摸、表明意愿、命令洁净，以及即时结果。惟“你洁净了吧”在现代汉语中容易被理解为带确认意味的“……了吧”，不宜作为命令式；末句以“麻风”为“洁净”的主语也带有较强的字面移植感。改为以病人为主语的“从麻风中得了洁净”，不改变原文所强调的洁净语汇。
  naturalness: “耶稣伸出手来摸他”自然庄重。“你洁净吧”是简洁清楚的命令；“他立刻就从麻风中得了洁净”比“他的麻风……洁净了”更符合现代标准汉语，且保留经文的洁净主题。
  terminology: “麻风”保留传统圣经用语，脚注恰当说明λέπρα未必专指现代汉森病。“洁净”在命令和结果中一致保留，避免缩减为单纯的医疗性“治好”。
