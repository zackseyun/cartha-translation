id: MAT.8.17
reference: Matthew 8:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: zh_hans
  text: '为要应验借着以赛亚先知所说的话：


    “他亲自承受了我们的病痛[a]，

    背负了我们的疾病[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “病痛”也可译作“软弱”或“疾病”；希腊语ἀσθένεια的意义范围包括软弱、衰弱和疾病。
    reason: lexical_alternative
  - marker: b
    text: “背负”也可译作“承担”或“承受”；此词保留了与以赛亚书53:4中“承受、背负”意象的联系。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: 为要应验
  rationale: 保留ὅπως加虚拟语气所表达的目的兼结果意味，也保留马太常用的“应验”主题。
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: 那藉着先知以赛亚所说的话
  rationale: “藉着”体现διά加属格所表达的媒介性，不把先知仅仅处理为话语的终极来源；整体表达符合现代汉语。
- source_word: Αὐτὸς
  choice: 他亲自
  rationale: 保留独立代词在原文中的强调语气。
- source_word: ἀσθενείας
  choice: 病弱
  rationale: 兼顾该词“软弱”与“疾病、病痛”的语义范围，并贴合本段医治疾病的上下文；脚注保留较宽泛的译法。
- source_word: ἔλαβεν
  choice: 承担了
  rationale: 在汉语中自然表达“取来、承受在身上”的意思，同时避免译成“除去”而增添原动词未明说的结果。
- source_word: νόσους
  choice: 疾病
  rationale: 准确表达νόσος所指的具体疾病或病症。
- source_word: ἐβάστασεν
  choice: 背负了
  rationale: 保留“携带、负荷”的具体意象，并与所引以赛亚书经文的传统措辞形成可辨识的联系。
theological_decisions:
- issue: 如何在马太的医治语境中翻译以赛亚书53:4的引文
  choice: 以“病弱”和“疾病”明确呈现身体病患，同时用“承担、背负”保留负荷意象。
  alternative: 译作“软弱”和“疾病”，或采用带有更强代替意味的“代替、担当”。
  rationale: 紧接的上下文是耶稣医治病人，因此身体病患不可淡化；但原文动词仍有承担、背负的意象。译文不加入“代替”一词，以免在本节没有明说之处预先限定其救赎论含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“藉着”用于先知引文公式，语体略庄重但仍属当代通行表达；引文分行以凸显其诗性和平行结构。
