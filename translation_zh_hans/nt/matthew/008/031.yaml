  naturalness: “鬼魔”虽可理解，但在现代标准汉语中不如“鬼”自然、简洁；“那些鬼一再求他，说”更符合叙事文体。“送我们进猪群里”比“打发我们进入猪群”更直接地表达“send us into”，同时保持庄重自然。
  terminology: 将δαίμονες译为“鬼”是汉语圣经语境中通行且不混同于“魔鬼”的对应，也保留了原文所指可言说、受驱逐的邪灵实体。保留“赶出去”对应ἐκβάλλεις；“猪群”完整表达ἀγέλην τῶν χοίρων。
