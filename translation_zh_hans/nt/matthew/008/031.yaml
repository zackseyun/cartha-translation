  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: zh_hans
  text: 那些鬼一再求他[a]，说：“你若把我们赶出去，就送我们进猪群里[b]吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一再求”也可译作“不断恳求”或“不断央求”；希腊文动词采用未完成时，表示持续或反复的动作。
    reason: lexical_alternative
  - marker: b
    text: “猪群”也可译作“一群猪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: 那些鬼魔
  rationale: “鬼魔”清楚表达具有位格的邪灵；“那些”承接上文所提到的对象，δέ则以自然的叙事衔接体现，无须生硬译出。
- source_word: παρεκάλουν
  choice: 一再央求
  rationale: 未完成时表示持续或反复的恳求；“一再央求”既传达体貌，也符合现代汉语表达。
- source_word: λέγοντες
  choice: 说
  rationale: 汉语引出直接引语时用“说”自然简洁，不必机械保留分词结构。
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: 你若把我们赶出去
  rationale: 保留条件句的形式与说话者视角；“赶出去”准确传达ἐκβάλλω在驱逐邪灵语境中的含义。
- source_word: ἀπόστειλον ἡμᾶς
  choice: 打发我们
  rationale: “打发”体现ἀποστέλλω所含的差遣、送往之意，并与后面的目的地“进入猪群”自然衔接。
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: 进入猪群
  rationale: εἰς表达进入的方向；“猪群”是现代汉语对一群猪的自然称呼。
theological_decisions:
- issue: 邪灵称谓
  choice: 鬼魔
  alternative: 邪灵；鬼
  rationale: 原文δαίμονες指能说话并向耶稣恳求的邪恶灵体。“鬼魔”保留其位格性与超自然含义，又避免把它与专指撒但的“魔鬼”混同。
- issue: 条件句的语气
  choice: 你若把我们赶出去
  alternative: 既然你要把我们赶出去
  rationale: 保留Εἰ的条件表达，不把鬼魔的预期或确信解释成明说的既定事实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一再央求”传达原文未完成时的持续或反复意味；“你若”保留条件句的开放性；句末“吧”使请求语气在汉语中清楚可闻，而不增加命令意味。
