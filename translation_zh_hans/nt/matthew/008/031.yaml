  to: 那些鬼一再求他[a]，说：“你若把我们赶出去，就送我们进猪群里[b]吧。”
  rationale: 修订保留原文的复数、未完成时的反复性、条件句和请求语气；以更自然的现代汉语表达“鬼”和“送我们进猪群里”。删除无充分依据的异文主张，并将脚注b改为有明确锚点的词汇替代说明。
