  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: zh_hans
  text: 离他们有一段距离[a]的地方，有一大群猪正在觅食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离他们很远”。
    reason: μακράν可强调距离遥远，也可较一般地表示相隔一段距离。
lexical_decisions:
- source_word: ἦν δὲ
  choice: 有
  rationale: ἦν表达存在，译为“有”；δέ是轻微的叙事连接词，本节在现代汉语中无需另加“这时”或“而”。
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: 离他们有一段距离
  rationale: 该短语表示空间上的距离。此译自然，也不过度限定距离究竟有多远；另在脚注保留“离他们很远”的可能译法。
- source_word: ἀγέλη χοίρων πολλῶν
  choice: 一大群猪
  rationale: ἀγέλη是动物的“群”，χοίρων指“猪”；πολλῶν字面为“许多”，与集合名词连用时译作“一大群”最符合现代汉语习惯。
- source_word: βοσκομένη
  choice: 正在觅食
  rationale: 现在分词描写猪群当时在进食。“觅食”适用于猪，也不引入原文未明说的牧人或看管行为。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；保留原文对距离程度的词义空间。
