source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: zh_hans
  text: 因为我也是一个受权柄管辖的人，手下有士兵。我对这个人说：‘去！’他就去；对另一个人说：‘来！’他就来；对我的仆人[a]说：‘做这件事！’他就做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译为“奴隶”（希腊文：δοῦλος）。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……也
  rationale: γάρ引出百夫长作此判断的理由，καί在“我也”中保留类比意味；这样既自然，又呈现他以自身权柄结构说明耶稣权柄的逻辑。
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: 我是一个服在权柄之下的人
  rationale: 保留ἄνθρωπος与ὑπὸ ἐξουσίαν的表述，说明百夫长本人处于上级权柄之下；“服在……之下”在现代汉语中清楚表达隶属和听命关系。
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: 手下也有士兵
  rationale: 自然地表达士兵处于百夫长指挥之下，并与前面的“服在权柄之下”形成上下级对应。
- source_word: λέγω τούτῳ…καὶ ἄλλῳ
  choice: 我对这个说……对那个说
  rationale: 保留τούτῳ和ἄλλῳ的指示、分列语气，使命令与回应的平行结构清晰。
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: 去 / 来 / 做这件事
  rationale: 采用简洁直接的命令语，贴合原文三个祈使形式，也符合军事与家内权柄的语境。
- source_word: πορεύεται / ἔρχεται / ποιεῖ
  choice: 他就去 / 他就来 / 他就做
  rationale: “就”自然体现命令发出后立即照办的关系，但不额外加入原文没有明说的情绪或时间说明。
- source_word: δοῦλος
  choice: 仆人
  rationale: 本句重点在百夫长对家内从属者所具的命令权；“仆人”在现代汉语中较自然，同时用脚注保留“奴仆”这一更凸显身份从属的译法。
theological_decisions:
- issue: 百夫长“在权柄之下”与其权柄来源的关系
  choice: 服在权柄之下
  alternative: 在别人的权下
  rationale: 原文未明说权柄属于谁，也未系统解释耶稣权柄的来源；正文保留简练和开放性，不把类比扩展为额外的神学说明。
- issue: δοῦλος的社会身份
  choice: 仆人
  alternative: 奴仆
  rationale: “仆人”使现代读者容易把握家内命令关系；但δοῦλος可指受主人支配的奴仆，因此以脚注保留较强的身份含义，避免将历史从属关系完全弱化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个命令与三个回应保持紧凑平行；用“这个／那个”保留原文的指示性，用“就”呈现命令与服从之间直接明确的联系。
