  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: zh_hans
  text: 那些人都很惊奇，说：“这是什么样的人，竟连风和海也听从他？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: 众人
  rationale: 原文指船上目睹此事的人；现代汉语用“众人”自然承接叙事，又不把原文一般性的 ἄνθρωποι 过度限定为“男人”。
- source_word: ἐθαύμασαν
  choice: 都很惊奇
  rationale: 表达因非凡事件而产生的惊异和赞叹；“惊奇”庄重而通俗，“都”也使复数主体在汉语中更清楚。
- source_word: λέγοντες
  choice: 说
  rationale: 希腊语分词连接惊奇与随后所说的话；汉语叙事以“说”自然表达这一关系。
- source_word: Ποταπός ἐστιν οὗτος
  choice: 这究竟是什么样的人
  rationale: ποταπός 询问此人的类别或性质；“什么样的人”保留其开放性，“究竟”传达疑问中的强烈惊叹，而不预先给出基督论结论。
- source_word: ὅτι
  choice: （以后一问句直接承接）
  rationale: 此处引出前一疑问的根据或令人惊异之处。汉语分成两个相连的问句，比生硬直译为“以至于”或“因为”更自然，同时保持逻辑关系。
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: 连风和海也
  rationale: 重复的 καί 强调连这些自然力量都包括在内；“连……也……”准确而自然地再现强调。复数“风”在汉语中通常无需形态标明。
- source_word: αὐτῷ ὑπακούουσιν
  choice: 听从他
  rationale: ὑπακούω 可指听命、服从；“听从他”既保留听命于个人权威的意象，又符合风海受命止息的语境。
theological_decisions:
- issue: 门徒之问的基督论分量
  choice: 保留“这究竟是什么样的人”的开放式惊问，并明确风和海听从他，却不增添身份结论。
  alternative: 译成“他到底是谁”或明确说他具有神的身份。
  rationale: 经文本身借耶稣对受造界的权柄引发身份问题，但在本节仍以惊问呈现；译文应保存这种暗示和张力，不替叙事作答。
translation_notes:
  register: 采用现代、通顺而庄重的叙事语言。“究竟”增强现场的惊异感；用两个紧密相连的问句再现希腊文一个带解释从句的惊叹性疑问，适合普通现代读者。
