- from: 众人都很惊奇，说：“这究竟是什么样的人？连风和海也听从他！”
  to: 那些人都很惊奇，说：“这是什么样的人，竟连风和海也听从他？”
  rationale: 将引语恢复为一个完整的惊异性疑问句，以保留ὅτι所引出的说明／根据及“连……也……”的递进强调；主体改为“那些人”，避免“众人”可能造成的泛化。其余措辞保留现代、庄重且不预设基督论结论的表达。
