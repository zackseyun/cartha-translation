  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: zh_hans
  text: 耶稣对百夫长说：“去吧！照你所信的，愿这事成就在你身上。”就在那时，他的仆人[a]得了医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男孩”或“孩子”。希腊语παῖς既可指仆人，也可指年幼的人；本段语境中，“仆人”更符合百夫长属下的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: 百夫长
  rationale: 这是罗马军队中通常统领约一百名士兵的军官；“百夫长”是准确、通行且为现代中文读者熟悉的译法。
- source_word: Ὕπαγε
  choice: 去吧
  rationale: 简明传达离去命令的语气，不增添原文没有的惯用成分。
- source_word: ὡς ἐπίστευσας
  choice: 照你所信的
  rationale: 保留动词ἐπίστευσας所表达的个人相信行为，也保留ὡς所含“照着、正如”的对应关系，避免改写成较抽象的“照你的信心”。
- source_word: γενηθήτω σοι
  choice: 给你成就吧
  rationale: 以自然中文表达γίνομαι不定过去时被动命令式的祈使意味；“成就”传达事情照所信的实现，而不明说原文未明说的施事者。
- source_word: παῖς
  choice: 仆人
  rationale: 结合本段百夫长谈及属下的语境，以及近文所用δοῦλος，“仆人”最符合所指；该词也可指男孩或孩子，故在脚注保留歧义。
- source_word: ἰάθη
  choice: 得了医治
  rationale: 自然表达ἰάομαι的被动形式，清楚传达病患被治愈、恢复健康。
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: 就在那时
  rationale: 保留原文的时间表达及语境中的即时性，同时避免将ὥρα过度限定为精确钟点或瞬间。
theological_decisions:
- issue: πιστεύω的译法
  choice: 所信的
  alternative: 你的信心；所信靠的
  rationale: 采用“信”保留πιστεύω的动词形式和常规神学用语，不把百夫长的相信抽象化为一种可量度的“信心”，也不额外指定其相信内容。
- issue: γενηθήτω的施事者
  choice: 采用不明说施事者的“给你成就吧”
  alternative: 我就给你成就；愿上帝给你成就
  rationale: 希腊文使用被动形式而未明说施事者；译文不补入“我”或“上帝”，从而保留其表达上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“百夫长”保留历史身份的准确性；直接引语简洁有力。“就在那时”既自然呈现医治随即发生，也不过度断定为精确的一瞬间。脚注标记置于存在词义歧义的“仆人”之后。
