review_pass:
  verdict: revise
  source_fidelity: 草稿准确译出鱼、蛇及预期否定回答的反问语气，但“他求鱼，难道会给他蛇吗？”在汉语中两个“他”的角色不清，容易被读作同一人既求鱼又给蛇。原文的主语转换依托上一节“你们中间哪一个人”；中文需要明确承接的父子角色，才能忠实呈现论证关系。
  naturalness: “又或者”可用，但后半句的省略主语造成明显歧义。补出承接上下文的“儿子”和父亲主语后，句子自然、庄重且易懂。
  terminology: “鱼”“蛇”均为恰当的现代标准汉语对应词。“向他要”比单用“求”更符合父子索要食物的日常语境，也避免与祷告语境中的“祈求”混淆。
  issues:
  - severity: medium
    issue: 代词指向和施事关系不清
    rationale: 草稿的“他求鱼，难道会给他蛇吗”没有明确谁是求鱼者、谁是给予者；汉语读者可将两个“他”误解为同一人。希腊文在本节中省略的父亲主语由上一节限定，中文应清楚承接。
  - severity: low
    issue: “求鱼”略显书面且语义范围偏宽
    rationale: 此处是孩子向父亲索要食物；“向他要鱼”更自然、具体，并不改变原文意义。
