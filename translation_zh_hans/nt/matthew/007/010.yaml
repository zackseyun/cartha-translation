  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: zh_hans
  text: 又或者，儿子向他要鱼，难道他会给儿子一条蛇吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: 又或者
  rationale: 承接上一节的第一个例子，引出并列的第二个反问；“又或者”自然表达转接与递进，不机械译出 καί。
- source_word: ἰχθὺν
  choice: 鱼
  rationale: 普通食物语境中的常用义；汉语在此无需添加量词。
- source_word: αἰτήσει
  choice: 求
  rationale: 未来直陈式用于一般性假设情形；汉语用“求”简洁自然，并与祈求的上下文相称。
- source_word: μὴ
  choice: 难道……吗
  rationale: μή 引导预期否定回答的疑问句；“难道……吗”保留鲜明的反问语气。
- source_word: ὄφιν
  choice: 蛇
  rationale: 现代汉语中该动物的普通名称；无需采用较文言或带额外联想的表达。
- source_word: ἐπιδώσει
  choice: 给
  rationale: 本语境指把东西给某人；“给”是清楚自然的对应词。
- source_word: αὐτῷ
  choice: 他
  rationale: 与间接宾语合并表达为“给他”，符合现代汉语习惯；所指是前文求东西的儿子。
theological_decisions:
- issue: 反问句的语力
  choice: 译为“难道会给他蛇吗？”，明确传达预期答案为否定
  alternative: 译为陈述句“不会给他蛇”
  rationale: 希腊文 μή 所引导的问题期待否定回答。保留反问语力，有助于呈现上下文由人间父亲推论天父的论证方式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“又或者”承接上一例，“难道……吗”准确呈现原文期待否定回答的反问。无需脚注；“蛇”已涵盖 ὄφις 在此处的正常词义。
