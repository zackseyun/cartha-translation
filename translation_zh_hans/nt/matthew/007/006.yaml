  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: zh_hans
  text: 不要把圣物给狗[a]，也不要把你们的珍珠丢在猪面前，免得它们用脚践踏珍珠，又转过来把你们撕裂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“神圣的东西”或“圣洁之物”。原文所指较宽，并未明确限定为何物。
    reason: lexical_alternative
  - marker: b
    text: “把你们撕裂”也可译作“把你们撕碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: 圣物
  rationale: 中性单数形容词作名词用，泛指分别为圣或神圣之物；“圣物”简洁自然，同时不限定为教训、祭物或其他特定对象。
- source_word: τοῖς κυσίν
  choice: 给狗
  rationale: 保留原文直白而带冲击力的动物比喻，不作弱化或解释性替换。
- source_word: βάλητε
  choice: 丢
  rationale: βάλλω在此表示投掷；“丢”是现代汉语自然表达，也符合珍珠被弃置在猪面前的画面。
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: 你们的珍珠
  rationale: 保留复数意义及第二人称复数所属关系。
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: 在猪面前
  rationale: 贴合原文空间表达，并保留猪的比喻，不改为解释性称谓。
- source_word: μήποτε
  choice: 免得
  rationale: 自然表达原文所引出的负面目的或可能后果。
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: 它们用脚践踏珍珠
  rationale: “用脚践踏”准确传达动作及工具；以“珍珠”复现指代对象，避免汉语中“它们……它们”的代词歧义。
- source_word: στραφέντες
  choice: 又转过来
  rationale: 体现分词所表达的转身后续动作；“又”使两个危险结果在现代汉语中衔接自然。
- source_word: ῥήξωσιν ὑμᾶς
  choice: 撕咬你们
  rationale: ῥήγνυμι在此描写动物猛烈扑咬、撕裂；“撕咬”保留暴力画面，也比单说“攻击”更贴近原文。
theological_decisions:
- issue: “圣物、狗、珍珠、猪”等比喻的具体所指
  choice: 保留比喻，不在正文中解释其具体所指。
  alternative: 把“圣物”或“珍珠”明确解释为神圣教训、天国信息或福音，并把“狗”和“猪”解释为恶人或敌视福音的人。
  rationale: 原文没有明确定义各意象。保留其开放性，可避免把某一种神学解释写入译文。
- issue: 两个负面结果的施事者
  choice: 依照自然语序，将“践踏珍珠”和“转过来撕咬你们”都表述为猪所做的连续动作。
  alternative: 按现实动物习性，将狗理解为撕咬人的一方。
  rationale: 希腊文最近的复数先行项为“猪”，后续复数动词与分词在语法和句法上自然承接该项；译文不依据动物习性重构施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣物”保留原文概括性；“丢在猪面前”“用脚践踏”“转过来撕咬”维持鲜明的动物意象。正文中的[a]、[b]与脚注逐一对应。
