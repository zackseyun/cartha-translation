  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: zh_hans
  text: 耶稣说完这些话[a]以后[b]，群众都对他的教导感到非常惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些言论”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文较直译为：“事情发生了：当……时。”这是承接叙事的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: 以后
  rationale: 这是承接叙事并引出时间从句的希腊语惯用结构。现代汉语用“……以后”即可自然表达其时间关系；其较完整的字面形式保留在脚注中。
- source_word: ἐτέλεσεν
  choice: 说完
  rationale: 动词表示把一段话讲到结束；结合宾语“这些话”，“说完”比笼统的“完成”更符合现代汉语。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: λόγοι在此指耶稣刚才所说的整段内容；“这些话”保留指示词，也不额外加入“讲章”等解释性标签。
- source_word: ἐξεπλήσσοντο
  choice: 感到非常惊讶
  rationale: 该动词表达强烈的惊异。这样译既体现语气强度，又避免“震惊”在现代汉语中常有的负面意味。
- source_word: οἱ ὄχλοι
  choice: 群众
  rationale: 复数ὄχλοι指聚集听讲的众多人群；“群众”在现代汉语中自然且能体现群体意义。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: 对他的教导
  rationale: ἐπί加与格在此指出惊讶所针对或由之引起的对象；“对他的教导”是自然、清楚的汉语表达。
theological_decisions:
- issue: “这些话”所指的范围
  choice: 直接指耶稣刚刚讲完的内容，不添加专名
  alternative: 译作“这些言论”或解释为“这篇讲章”
  rationale: 原文只说“这些话”，上下文足以确定所指；加入“讲章”会引入原文没有的体裁标签。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“说完……以后”符合汉语叙事习惯；“非常惊讶”保留原文反应的强烈程度。
