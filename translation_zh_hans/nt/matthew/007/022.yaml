id: MAT.7.22
reference: Matthew 7:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: zh_hans
  text: 到那日，许多人会对我说：‘主啊，主啊，我们不是奉你的名说过预言，奉你的名赶过鬼，又奉你的名行过许多大能的事[a]吗？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“行过许多神迹”，也可译“做过许多显出能力的事”。希腊语直译为许多“大能”，在福音书中常指彰显能力的奇事。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该阳性复数形容词在此作名词用；译作“许多人”符合现代汉语习惯，也不额外限定这些人的身份。
- source_word: ἐροῦσίν μοι
  choice: 会对我说
  rationale: 保留将来时和与格所表达的说话对象；“对我说”直接自然。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到那日
  rationale: “到那日”是自然、庄重的汉语时间表达，并保留原文末世性的含蓄指向，不直接增译为“审判之日”。
- source_word: Κύριε κύριε
  choice: 主啊，主啊
  rationale: 重复称呼表现恳切和申辩的语气；“主”保留 κύριος 在此处的一般称谓意义及其基督论分量。
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: 我们不是……说过预言……吗
  rationale: 以汉语反问句重现预期肯定回答的希腊语问法；“说预言”准确而且普通读者容易理解。
- source_word: τῷ σῷ ὀνόματι
  choice: 奉你的名
  rationale: “奉……的名”自然表达借着某人的名、权柄或名义行事；三次重复均予保留，以维持原文的修辞力度。
- source_word: δαιμόνια ἐξεβάλομεν
  choice: 赶过鬼
  rationale: ἐκβάλλω 与 δαιμόνια 连用指赶逐邪灵；“赶鬼”是现代汉语中简明、熟悉的表达。
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: 行过许多大能的事
  rationale: δύναμις 在福音书中常指彰显能力的奇事；“大能的事”保留与“能力”的词义联系，而不把含义完全收窄为“神迹”。
theological_decisions:
- issue: 直接称呼耶稣时 κύριος 的译法
  choice: 主
  alternative: 主人；夫子
  rationale: “主”既能表达称谓本身，也保留本段语境中的基督论分量，不作超出原文的解释。
- issue: “那日”的末世论含义
  choice: 那日
  alternative: 审判之日
  rationale: 上下文指向末后的审判，但原文只说“那日”；正文保留这一圣经惯用语，不把隐含意义直接明说。
- issue: 以耶稣之名行事的含义
  choice: 奉你的名
  alternative: 靠你的名；用你的名
  rationale: 原文可能涉及借其权柄、呼求其名或以其名义行事；“奉你的名”保留这些相关含义，不判定说话者的宣称是否真实有效。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“主啊，主啊”和三次“奉你的名”的重复，以呈现原文的恳切语气与修辞推进；脚注标记置于其实际说明的“大能的事”之后。
