base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: zh_hans
  text: 凡不结好果子的树，都要被砍下来，扔进火里。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不结果子的。”
    reason: lexical_alternative
  - marker: b
    text: “火”是审判的意象；本节本身没有进一步说明这里侧重现世的审判、末后的审判，还是两者兼有。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: 凡……的树，都
  rationale: πᾶν与单数名词连用，具有逐一涵盖的分配意义；“凡……都”在现代汉语中自然地表达“每一棵”的普遍性，并保留格言式语气。
- source_word: μὴ ποιοῦν
  choice: 不结
  rationale: 现在分词修饰“树”，描写其持续或特征性的表现。汉语谈树与果子通常说“结果子”，“不结”比直译为“不产生”更自然；另见脚注[a]。
- source_word: καρπὸν καλὸν
  choice: 好果子
  rationale: καλόν在这里表示好的、健全的或合宜的；“好果子”简明自然，也保留上下文中的评价和道德意味。
- source_word: ἐκκόπτεται
  choice: 要被砍下来
  rationale: 该动词为现在时被动形式，表示这类树所受的处置。对整棵树而言，“砍下来”符合现代汉语习惯；“要”表达格言式陈述所包含的必然结果，而不另行限定时间。
- source_word: εἰς πῦρ βάλλεται
  choice: 扔进火里
  rationale: 保留被动处置的意义以及εἰς所表达的向内移动。“扔进火里”自然、直接；希腊文πῦρ没有冠词，汉语无需添加“那火”或作更具体的教义界定。
theological_decisions:
- issue: 火所表达的审判意象
  choice: 保留树被砍下并扔进火里的意象，不在正文中具体界定“火”的所指。
  alternative: 将“火”明确解释为现世审判、末世审判或地狱。
  rationale: 本节明确传达审判的警告，却没有自行说明其确切时间或范围；译文保留这种张力，不加入比经文本身更狭窄的教义结论。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“凡……都……”保留原文的普遍、警告性语气；“结好果子”“砍下来”“扔进火里”清楚自然。所有脚注标记均置于正文相关句末。
