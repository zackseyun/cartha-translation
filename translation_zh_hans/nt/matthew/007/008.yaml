id: MAT.7.8
reference: Matthew 7:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: zh_hans
  text: 因为凡祈求的，都得到；寻找的，就寻见；叩门的，就会给他开门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明说所打开的是“门”；“门”是从“叩门”的意象中推知的。
    reason: 译文为符合现代汉语表达而补出“门”，但原文并未明确写出这一受事对象。
lexical_decisions:
- source_word: πᾶς
  choice: 凡……的，都
  rationale: πᾶς与带冠词的分词连用，概括所有属于这一类的人；“凡……的，都”自然地保留其普遍范围。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文劝勉的解释作用，现代汉语中清楚自然。
- source_word: ὁ αἰτῶν
  choice: 祈求的
  rationale: 带冠词的现在分词指“祈求的人”，并带有一般性、持续性的意味；上下文涉及向上帝求告，“祈求”比单用“求”更清楚。
- source_word: λαμβάνει
  choice: 得到
  rationale: 表达λαμβάνω在此处“领受、得到”的常用意义；“得到”是普通现代汉语，也避免额外强化宗教语体。
- source_word: ὁ ζητῶν
  choice: 寻找的
  rationale: 保留带冠词分词所指的一般类别，并与前后分句形成简洁的排比。
- source_word: εὑρίσκει
  choice: 寻见
  rationale: 准确表达“找到”，同时与“寻找”形成简明而易记的对应；“寻见”庄重但仍易懂。
- source_word: τῷ κρούοντι
  choice: 叩门的
  rationale: 将与格分词结构自然译成主题式表达；“叩门”保留原文意象及排比节奏。
- source_word: ἀνοιγήσεται
  choice: 就必给他打开
  rationale: 保留将来被动所表达的应许和受益者，同时不明说原文省略的受事对象；“必”体现将来陈述的确定语气。
theological_decisions:
- issue: 应许的范围与力度
  choice: 照原文保留普遍而明确的应许，不在译文中附加限制，也不说明所求必按祈求者设想的方式实现。
  alternative: 将本句译成每一项具体请求都会完全照所求得到，或把应许预先限定为某些属灵事项。
  rationale: 原文使用概括性、普遍性的措辞，应直接呈现；但翻译不应把上下文之外的绝对化解释或神学限制写进经文，从而保留其解释张力。
- issue: 被打开之物
  choice: 正文省略具体受事对象，以“给他打开”保留原文的未明说状态。
  alternative: 直接补成“门就必给他打开”。
  rationale: 从“叩门”的意象可自然推知是门，但希腊文没有明确写出“门”；正文尽量不把隐含信息变成明说信息。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语，保留三个分句的排比和格言式节奏。“祈求—得到、寻找—寻见、叩门—打开”力求清晰易记；正文中的[a]与脚注标记一致。
