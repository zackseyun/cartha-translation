id: MAT.7.23
reference: Matthew 7:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: zh_hans
  text: 到那时，我要向他们宣告：“我从来不认识你们[a]；离开我，你们这些行不法之事[b]的人！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我从来不承认你们”。原文的“认识”可包含关系上的认识或承认，并不只是知道有关某人的事实。
    reason: lexical_alternative
  - marker: b
    text: “行不法之事”也可译作“作恶”或“行罪孽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: 到那时
  rationale: 保留与上文相连的时间推进关系；现代汉语中无需机械加译“并且”，也能自然表达承接。
- source_word: ὁμολογήσω
  choice: 我要向他们明说
  rationale: 此处表示公开而明确地宣告，不是承认过错。“明说”保留郑重、公开表态的语力，同时符合现代汉语。
- source_word: Οὐδέποτε
  choice: 从来不
  rationale: 表达绝对而贯穿始终的否定，简洁自然。
- source_word: ἔγνων
  choice: 认识
  rationale: 保留原文“知道、认识”的关系性表达，不在正文中将其解释为“认可”“接纳”或“属于我”，从而保存原文的含义张力。
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: 离开我吧
  rationale: 准确传达命令和驱离之意；“吧”在此使汉语命令句自然，并不削弱其严肃性。
- source_word: οἱ ἐργαζόμενοι
  choice: 你们这些行……之事的人
  rationale: 分词描述具有代表性或持续性的行为；这一结构在汉语中清楚地指向以此为行径的人。
- source_word: τὴν ἀνομίαν
  choice: 不法之事
  rationale: 保留ἀνομία所含的违背法则、无视律法的意味，比笼统的“恶事”更具体，又比生硬的“无法”更符合现代汉语。
theological_decisions:
- issue: “我从来不认识你们”的含义
  choice: 正文保留“认识”这一关系性而又未完全解释的说法。
  alternative: “我从来不承认你们”或“我从来没有认可你们”
  rationale: 原文直接使用γινώσκω，并未明说“认可”“接纳”或某种特定教义结论。保留“认识”可以维持其关系性、审判性含义及原有神学张力。
- issue: ἀνομία的道德与律法含义
  choice: 译作“不法之事”。
  alternative: “恶事”“邪恶”或“罪孽”
  rationale: “不法之事”保留原文违背法则或律法秩序的语义，不把它泛化为一般邪恶，也不导入特定宗派对律法与救恩关系的解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。直接引语保留审判场景中的郑重和力度；避免古奥词语，也不把关系性的“认识”或ἀνομία的含义作教义化扩写。脚注标记均置于正文相应词语之后。
