- from: 你们要从窄门进去。因为通向毁灭的门是宽的，路是宽阔的[a]，从那里进去的人也多。
  to: 你们要从窄门进去；因为那门是宽的，那路是宽阔的，并且通向毁灭；从那门进去的人也多。
  rationale: 修订将“通向毁灭”明确归于“路”，对应原文分词对ὁδός的修饰；并将末句的指代译为“那门”，体现“穿过门进入”的语义和本节前后窄门／宽门的对照。保留“宽阔”的词汇替代脚注。
