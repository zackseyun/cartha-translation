review_pass:
  verdict: revise
  source_fidelity: 原稿将“通向毁灭的”置于“门”之前，句法上修饰“门”，但希腊文关系分词ἡ ἀπάγουσα修饰的是“路”（ἡ ὁδός）。末句δι’ αὐτῆς在此按语义最自然地指“门”；译作“从那里”虽试图保留形式上的指代空间，却弱化了“穿过门进入”的明确动作，并在汉语中显得指向不清。
  naturalness: “你们要从窄门进去”自然得体。修订后以“那门／那路”维持门与路的对照，以“并且通向毁灭”清楚归于“路”，句法自然且保留原文的警告语气。
  terminology: “窄门”“毁灭”均恰当。“毁灭”不把ἀπώλεια过度限定为特定教义性的终局解释。
  issues:
  - severity: high
    issue: “通向毁灭的”在现有汉语句法中修饰“门”。
    rationale: 原文中ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν是阴性单数分词，修饰紧邻的ἡ ὁδός（路），而不是ἡ πύλη（门）。这改变了原文门与路各自承担的描述。
  - severity: medium
    issue: “从那里进去”未能自然表达末句“穿过它进去”。
    rationale: δι’ αὐτῆς在该图像中最自然是指宽门；汉语“从那里”容易被理解为从某处或沿那条路进入，且不如“从那门进去”准确、清晰。
  revised_text: 你们要从窄门进去；因为那门是宽的，那路是宽阔的，并且通向毁灭；从那门进去的人也多。
  revised_footnotes:
