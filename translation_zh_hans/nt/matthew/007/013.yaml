  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: zh_hans
  text: 你们要从窄门进去；因为那门是宽的，那路是宽阔的，并且通向毁灭；从那门进去的人也多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: 你们要……进去
  rationale: 第二人称复数、不定过去时主动命令语气；用“你们要”清楚表达命令，并以“进去”自然搭配“从……门”。
- source_word: διὰ τῆς στενῆς πύλης
  choice: 从窄门进去
  rationale: διά加属格在此表示穿越；现代汉语通常说“从门进去”，既自然又保留空间意象。
- source_word: ὅτι
  choice: 因为
  rationale: 引出前述命令的解释或根据；“因为”直接、清楚。
- source_word: πλατεῖα ἡ πύλη
  choice: 门是宽的
  rationale: πλατύς在此指宽，与“窄门”形成明确对照。
- source_word: εὐρύχωρος ἡ ὁδός
  choice: 路是宽阔的
  rationale: εὐρύχωρος可表示宽阔或宽敞；“宽阔”适合道路，也保留与窄门的对比。
- source_word: ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν
  choice: 通向毁灭的
  rationale: 将现在分词自然译为“通向”；ἀπώλεια译为“毁灭”，保留严重后果而不额外限定其神学内涵。
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: 从那里进去的人也多
  rationale: 保留“多”的强调。阴性代词αὐτῆς在语法上可与阴性的“门”或“路”呼应；“从那里”避免在正文中把所指强行限定为其中之一。
theological_decisions:
- issue: ἀπώλεια所指结局的性质
  choice: 毁灭
  alternative: 败亡、沉沦
  rationale: 原文宣告灾难性的终局，却未在本节进一步界定其完整神学性质；“毁灭”保留警告的力度和原文张力。
- issue: 末句αὐτῆς的所指
  choice: 从那里
  alternative: 从那门进去；走那条路
  rationale: 代词为阴性，形式上可回指同为阴性的“门”或“路”；语义上“从门进去”很自然，而道路也是整幅图像的重要部分。正文采用不强行消除歧义的表达。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“从窄门进去”符合现代汉语习惯；后半句保留门与路并列的形象，并避免用宗派性术语解释“毁灭”。
