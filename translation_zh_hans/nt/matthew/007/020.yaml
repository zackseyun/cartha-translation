  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: zh_hans
  text: 所以，你们凭着他们的果子，就会认出他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样看来，你们会从他们的果子认出他们。”
    reason: 保留ἄρα γε较明显的推论强调、ἀπὸ较贴近字面的“从”，以及未来式的另一种表达。
lexical_decisions:
- source_word: ἄρα γε
  choice: 所以
  rationale: 该组合承接上文并作出带轻微强调的推论；“所以”在现代汉语中自然、明确。其强调意味及较直译表达在脚注中保留。
- source_word: ἀπὸ
  choice: 凭着
  rationale: 此处表示辨认的依据；“凭着”比单用“从”更自然地表达“以……为判断根据”。
- source_word: καρπῶν
  choice: 果子
  rationale: 保留希腊文复数名词在语境中的果实隐喻，不直接释为“行为”或“结果”；汉语“果子”可作集合性表达，无须机械添加复数标记。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 自然表达属格关系，修饰“果子”。
- source_word: ἐπιγνώσεσθε
  choice: 就能认出
  rationale: 未来时在此表达由所见证据而产生的辨认结果；“认出”准确传达识别这些人的语境含义，“能”使现代汉语表达自然，但不把该动词夸大为“完全认识”。
- source_word: αὐτούς
  choice: 他们来
  rationale: 指回上文所谈的人；“认出他们来”是自然的现代汉语结构。
theological_decisions:
- issue: 以“果子”作为辨认人的依据这一隐喻
  choice: 正文保留“果子”的隐喻
  alternative: 译作“行为”或“结果”
  rationale: 原文用果实隐喻，并与紧邻上下文相连；保留该隐喻避免把其所指范围收窄为某一种特定表现。
- issue: ἐπιγνώσεσθε所表达的认识程度
  choice: 译作“认出”
  alternative: 译作“认识”或“完全认清”
  rationale: 语境强调根据可观察的果子识别人；“认出”贴合这一功能，同时不引入“完全认识”所带来的过强神学或认识论含义。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“果子”保留经文核心隐喻；“凭着……认出”清楚表达判断依据。脚注标记已置于正文句末。
