  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: zh_hans
  text: 雨降下来，河水涌来[a]，风吹着，冲击那座房子；房子就倒了，而且倒得很厉害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“河流来了”；这里也可理解为“洪水来了”。
    reason: 说明ποταμοί的字面意义及其在暴雨语境中的可能含义。
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: 雨降下来
  rationale: 保留καταβαίνω所表达的向下运动，同时符合现代汉语对降雨的自然表达。
- source_word: ἦλθον οἱ ποταμοί
  choice: 河水涌来
  rationale: ποταμοί本义为“河流、河水”；在暴雨语境中，“河水涌来”既保留词义联系，也自然传达水势逼近房屋的画面。
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: 风刮起来
  rationale: 以自然现代汉语表达风开始吹刮；汉语通常不必把复数ἄνεμοι机械译成“众风”。
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: 冲击那座房子
  rationale: 此处προσκόπτω表示撞击而非绊倒；“冲击”传达风作用于房屋的力量，又不额外强化为经文未明说的灾难程度。
- source_word: ἔπεσεν
  choice: 房子就倒了
  rationale: 保留πίπτω的基本意义“倒下”，没有解释性扩展为“彻底坍塌”。重复“房子”比单用代词更清楚自然。
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: 倒得很厉害
  rationale: 以自然汉语保留πίπτω与πτῶσις之间“倒—倒下”的同根呼应，并表达μεγάλη所强调的严重程度。
theological_decisions:
- issue: 比喻结尾所含审判警告的严重性
  choice: 只译作“房子就倒了，而且倒得很厉害”
  alternative: 把结局明确译成“遭到灾难性的毁灭”或直接说明末世审判
  rationale: 原文以房屋倒下的强烈图像作结，却没有在本节直接解释为某种具体的末世惩罚；译文保留警告力度而不加入超出原文的神学阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文连续使用“而且／就”的推进感，但以汉语标点和自然句法避免生硬直译。
