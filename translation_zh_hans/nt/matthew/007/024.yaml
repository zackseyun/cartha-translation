source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: zh_hans
  text: 所以，凡听见我这些话又照着去做的人，都要像一个明智的男人，他把自己的房子盖在磐石上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都要像”也可译作“都要被比作”或“都要被比拟为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: 所以，凡……的人
  rationale: Πᾶς与ὅστις合用，表达周遍、泛指意义；“凡……的人”自然保留这一含义。οὖν承接前文作推论，以“所以”表达。
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: 听见我这些话
  rationale: “听见”直接对应ἀκούει，“我这些话”自然表达μου τοὺς λόγους τούτους，并保留“话”而不窄化为教训或命令。
- source_word: καὶ ποιεῖ αὐτούς
  choice: 又照着去做
  rationale: 直译“做这些话”在现代汉语中生硬；“照着去做”准确传达把所听见的话付诸实行，同时不额外解释具体行为。
- source_word: ὁμοιωθήσεται
  choice: 都要像
  rationale: 该将来时被动态可指“将被比作”或“将像”；正文采用自然的比较表达“要像”，并以脚注保留被动比较的词义可能。
- source_word: ἀνδρὶ φρονίμῳ
  choice: 一个明智的人
  rationale: ἀνήρ在比喻人物中指男性成年人；现代汉语“一个……的人”在此语境可自然指该男子。φρόνιμος侧重审慎而有判断力，“明智”比单纯“聪明”更贴切。
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: 把自己的房子盖
  rationale: 用“把”字句自然表达建造动作及其宾语；αὐτοῦ译为“自己的”，清楚表明房子属于建造者。
- source_word: ἐπὶ τὴν πέτραν
  choice: 在磐石上
  rationale: πέτρα指坚固的岩石；“磐石”保留具体、稳固的建造意象，又不过度具体化为“基岩”。
theological_decisions:
- issue: 比喻人物的性别表达
  choice: 一个明智的人
  alternative: 一个明智的男人
  rationale: 希腊文ἀνήρ确实为阳性、可明确指男人；但现代汉语“人”在本句中能自然承载叙事人物，后续“自己的房子”也无需性别代词。为避免让读者误以为这原则只针对男性，正文采用自然汉语“人”，并不改变“凡……的人”的普遍范围。
- issue: 听见与遵行的关系
  choice: 听见……又照着去做
  alternative: 听从
  rationale: 保留ἀκούει与ποιεῖ两个并列动作，不把二者合并成可能已包含顺服意味的“听从”，从而维持经文对听见和实行的区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”清楚连接前文结论；“照着去做”比“行这些话”自然；“明智”体现审慎判断。“磐石”保留圣经意象但不使用古奥句式。
