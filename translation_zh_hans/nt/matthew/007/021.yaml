  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: zh_hans
  text: “并不是每一个对我说‘主啊，主啊’的人都会进入天国[a]；惟有遵行我在天上的父的旨意的人才会进入。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“诸天的国”；《马太福音》常用这一说法，在其他语境中也称“神的国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: 并不是每一个对我说……的人都
  rationale: οὐ πᾶς 表示部分否定，即“并非每一个”，而不是“没有一个”。用现代汉语关系结构自然表达现在分词 λέγων 的一般性含义。
- source_word: Κύριε κύριε
  choice: 主啊，主啊
  rationale: 保留 κύριος 的通常称呼“主”，并保留重复呼语所表达的强调。
- source_word: εἰσελεύσεται
  choice: 会进入
  rationale: 自然表达将来时所指的进入；第二分句依照汉语表达需要补出省略的谓语，使对比清楚。
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: 进入天国
  rationale: “天国”是现代汉语中自然且明确的表达，也符合《马太福音》这一惯用语；脚注说明原文“诸天”为复数。
- source_word: ἀλλ’ ὁ ποιῶν
  choice: 惟有遵行……的人才会进入
  rationale: 用“惟有……才……”表达 ἀλλά 引出的鲜明对比及带冠词分词的名词性功能，不把经文扩展成更完整的救恩教义陈述。
- source_word: τὸ θέλημα
  choice: 旨意
  rationale: “旨意”在此能自然表达父的意愿、目的与要求，比单纯的“愿望”更符合伦理和神学语境。
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: 我在天上之父
  rationale: 保留“我父”的亲子称谓及修饰语“在天上”；采用“之父”使整句庄重而清晰，并避免把“天父”当作原文中独立出现的固定称号。
theological_decisions:
- issue: 进入天国与口头称耶稣为主、遵行父旨意之间的关系
  choice: 保留经文对口头称呼与实际遵行之间的直接对比，不在译文中说明更完整的救恩机制。
  alternative: 将本节解释为靠行为称义，或解释为口头承认本身足以使人进入天国。
  rationale: 原文明确对比“说”与“行”，但本节本身没有完整阐述称义、信心与行为的系统关系，因此译文应保留警告及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并不是每一个……都”准确表达部分否定；“惟有……才……”使两分句的对比自然清楚。引号内保留重复呼语“主啊，主啊”。
