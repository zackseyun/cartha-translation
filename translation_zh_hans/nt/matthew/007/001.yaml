  text: Do not judge[a], so that you may not be judged.
translation:
  language: zh_hans
  text: 不要论断[a]，免得你们被论断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要定罪，免得你们被定罪。”希腊语动词在某些语境中可有“定罪”的意思，但“论断”含义较宽，也保留了本节前后相同动词的重复。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: 不要论断人
  rationale: μή与现在时命令式构成禁止语气。“不要”自然传达禁令；κρίνετε在此为及物用法，汉语补出泛指宾语“人”，使表达完整。“论断”保留κρίνω较宽的语义，不把它限缩为“定罪”。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: ἵνα加否定虚拟式在此表达所要避免的结果。“免得”简洁、自然地体现这一关系。
- source_word: κριθῆτε
  choice: 你们被论断
  rationale: 这是κρίνω的不定过去时被动虚拟式。译作“被论断”与前句“论断”保持词根重复和修辞对应；“你们”明确表达第二人称复数。
theological_decisions:
- issue: 耶稣禁令中κρίνω的范围
  choice: 正文采用范围较宽的“论断”，不将含义限定为“定罪”。
  alternative: 不要定人的罪，免得你们被定罪。
  rationale: 本节本身没有穷尽何种判断受到禁止；紧接的上下文（7:2—5）会进一步说明。保留较宽的用语，可维持原文的神学张力，避免预先把禁令解释为仅指最终定罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论断”虽略带书面色彩，但在宗教及一般伦理语境中通行，并能准确维持原文的广义与前后呼应。
