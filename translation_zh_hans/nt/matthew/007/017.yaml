  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: zh_hans
  text: 照样[a]，凡是好树都结好果子，腐坏的树[b]却结坏果子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照样”也可译作“因此”或“这样”。
    reason: lexical_alternative
  - marker: b
    text: “腐坏”所译的希腊语也可表示“腐烂的”“坏的”或“不堪用的”。
    reason: lexical_alternative
  - marker: c
    text: “坏果子”也可译作“恶果”；这里采用“坏果子”，以自然保留树木结果的比喻，同时不排除上下文中的道德含意。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 照样
  rationale: 承接上文的比喻并引出相应结论；“照样”既可表达“如此”，也保留比较和推论的作用。
- source_word: πᾶν δένδρον ἀγαθὸν
  choice: 凡是好树
  rationale: πᾶν与单数名词连用，具有逐一概括的普遍意义；“凡是”自然地保留这句格言式的概括。ἀγαθόν译为“好”，与下文“好果子”形成简明呼应。
- source_word: καρποὺς καλοὺς
  choice: 好果子
  rationale: καλός可指美好、优良；在树木结果的语境中，“好果子”自然清楚，也保留其伦理含意由上下文显明。
- source_word: ποιεῖ
  choice: 结
  rationale: ποιέω本义为“做、产生”，但用于树和果子时，现代汉语习惯说“结果子”；译作“结”准确而自然。
- source_word: τὸ δὲ
  choice: 却
  rationale: δέ在此标明两类树的对比；“却”简洁地表达转折关系。
- source_word: σαπρὸν δένδρον
  choice: 腐坏的树
  rationale: σαπρός指腐烂、败坏或不堪用；“腐坏”比笼统的“坏”更具体，同时可承载比喻中的道德意味。
- source_word: καρποὺς πονηροὺς
  choice: 坏果子
  rationale: πονηρός可指坏、邪恶或有害；在农业比喻中，“坏果子”最自然，并未抹去上下文所赋予的负面道德含意。
theological_decisions:
- issue: 树与果子的农业意象是否应直接解释为道德判断
  choice: 保留具体的树与果子比喻，不在正文中明说其所指的人或行为。
  alternative: 使用“败坏的人产生恶行”等解释性表达。
  rationale: 希腊文陈述的是比喻本身；其对假先知的道德应用由上下文提供。保留意象可避免把解释直接写入正文。
- issue: πονηρούς的道德强度
  choice: 译为“坏”，让农业意义与道德含意并存。
  alternative: 译为“恶”或“邪恶”。
  rationale: “恶”能突出伦理色彩，但在“果子”的直接意象中略显解释性；“坏”符合自然汉语，又容许上下文赋予更强的道德意义。
translation_notes:
  register: 采用现代、简明而庄重的普通话。“凡是……都……”保留原句的普遍性和格言语气；两次用“结”符合汉语关于树木结果的自然搭配。
