id: MAT.7.12
reference: Matthew 7:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: zh_hans
  text: 所以，无论什么事，你们希望别人怎样待你们，你们也要照样待他们；因为这就是律法和先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: 所以，无论什么事
  rationale: οὖν承接上文并引出推论，译作“所以”；Πάντα与ὅσα共同表达全面、无例外的范围，译作“无论什么事”符合现代汉语习惯。
- source_word: ὅσα ἐὰν θέλητε
  choice: 你们希望……怎样
  rationale: ἐὰν与关系结构表达不确定而普遍适用的情形；“希望……怎样”自然传达所愿意别人采取的对待方式。
- source_word: οἱ ἄνθρωποι
  choice: 别人
  rationale: 此处ἄνθρωποι泛指与听众交往的其他人，并非专指男性；“别人”在本句中自然、准确，也避免性别限定。
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: 你们也要照样待他们
  rationale: ποιεῖτε为现在时命令语气，要求持续遵行；“也要照样待他们”保留οὕτως καὶ的对应和互惠意味。
- source_word: οὗτος γάρ ἐστιν
  choice: 因为这就是
  rationale: 保留γάρ的解释关系及ἐστιν的直接等同表达，不弱化为“概括了”或“体现了”。
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: 律法和先知
  rationale: 保留犹太传统中概括圣经见证的固定说法，不在正文中释义或改写为抽象的伦理教导。
theological_decisions:
- issue: ἄνθρωποι的泛性所指
  choice: 译作“别人”
  alternative: 译作“人们”或“众人”
  rationale: 上下文陈述普遍的人际伦理原则，不限于男性；“别人”最自然地呈现听众与他人的对应关系。
- issue: “律法和先知”的范围
  choice: 保留为“律法和先知”
  alternative: 意译为“全部圣经的教导”或“律法和先知的教导”
  rationale: 原文使用马太福音及犹太语境中的固定概括语。直译可保留其经文互涉和神学张力，避免把“这就是”提前解释为仅指伦理精义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无论什么事”体现全面范围；“待”比机械的“做给”或“做于”更符合汉语人际表达，同时保留行为上的相互对应。“律法和先知”沿用简洁、可识别的圣经用语。
