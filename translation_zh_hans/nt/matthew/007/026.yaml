  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: zh_hans
  text: 凡听见我这些话却不照着去做的人，都好比一个愚昧的人[a]，把自己的房子盖在沙土上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一个愚昧的男人”。希腊文在这个比喻中使用阳性单数，但所指具有代表性。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: 凡听见……的人，都
  rationale: 冠词化的现在分词在此泛指一切听见的人；这一表达自然地保留了普遍范围。
- source_word: μου τοὺς λόγους τούτους
  choice: 我这些话
  rationale: 保留指示词“这些”和属有关系；“话”是 λόγοι 在本语境中的自然译法。
- source_word: καὶ μὴ ποιῶν αὐτούς
  choice: 却不照着去做
  rationale: ποιέω 在此指实行所听见的话；“照着去做”比生硬的“不做它们”更符合现代汉语，同时未增添具体解释。καί 在对比关系中译作“却”。
- source_word: ὁμοιωθήσεται
  choice: 都好比
  rationale: 未来被动式表达将被比作；“好比”在汉语中自然，并保留比喻关系。
- source_word: ἀνδρὶ μωρῷ
  choice: 一个愚昧的人
  rationale: μωρός 表示缺乏明智判断，译作“愚昧”庄重而贴切；ἀνήρ 为阳性单数，但此处人物承担泛指性的比喻作用，正文用自然汉语“人”，脚注说明原文性别形式。
- source_word: ὅστις ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: 把自己的房子盖
  rationale: 按现代汉语语序处理所有格和宾语；“自己的房子”清楚表达 αὐτοῦ τὴν οἰκίαν。
- source_word: ἐπὶ τὴν ἄμμον
  choice: 在沙土上
  rationale: ἐπί 加宾格在此表示建造所依托的位置；“沙土上”能自然呈现不稳固的地基意象。
theological_decisions:
- issue: 比喻中阳性代表性用语的处理
  choice: 正文译作“一个愚昧的人”，并以脚注说明原文为阳性表达
  alternative: 一个愚昧的男人
  rationale: 希腊文 ἀνήρ 通常指成年男性，但在这里作为适用于所有听而不行之人的代表性比喻。现代汉语“人”自然保留其普遍适用性；脚注不隐藏原文的阳性形式。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“照着去做”传达实行所听之话的含义；句式与前后文的智慧人/愚昧人对比相协调。
