  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: zh_hans
  text: 你这假冒为善的人哪！先把自己眼中的梁木[a]取出来，然后你才能看清楚，能够把你弟兄眼中的小木屑[b]取出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “梁木”也可译作“大木梁”或“木板”。
    reason: lexical_alternative
  - marker: b
    text: “小木屑”也可译作“碎屑”或“干草屑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: 你这假冒为善的人哪
  rationale: 这是阳性单数呼格，直接而严厉地斥责对方。“假冒为善的人”保留了该词在此处的惯常道德含义；“你这……哪”自然表达现代汉语中的呼语和责备语气。
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: 取出来
  rationale: ἐκβάλλω在眼中异物的比喻里表示移除、取出；“取出来”符合现代汉语习惯，并在命令式与后面的不定式中保持一致。
- source_word: πρῶτον
  choice: 先
  rationale: 明确表示行动次序和优先性，简洁自然。
- source_word: δοκόν
  choice: 梁木
  rationale: δοκός指建筑用的大木梁。“梁木”准确保留其巨大、结构性的形象，并与细小的κάρφος形成夸张对比。
- source_word: ὀφθαλμοῦ
  choice: 眼中
  rationale: ὀφθαλμός意为“眼睛”；汉语在描述眼内异物时用“眼中”更自然。
- source_word: διαβλέψεις
  choice: 你才会看清楚
  rationale: διαβλέπω含有看得清楚之意。“才”承接πρῶτον与τότε所强调的先后条件，“看清楚”保留复合动词的强化含义。
- source_word: κάρφος
  choice: 小木屑
  rationale: κάρφος可指细小的干碎片、木屑或草屑。“小木屑”形象具体，也清楚保持与“梁木”的大小反差。
- source_word: ἀδελφοῦ
  choice: 弟兄
  rationale: ἀδελφός是阳性单数，字面为“兄弟”。“弟兄”保留性别和信仰群体中的关系意味，又符合中文圣经语体。
theological_decisions:
- issue: ἀδελφοῦ所表达的性别与群体关系
  choice: 你弟兄
  alternative: 别人；同伴；邻舍
  rationale: 原文是阳性单数，并以亲属称谓描述群体内关系；译作“弟兄”既不将其泛化为无性别用语，也不额外限定为某一宗派身份。
- issue: διαβλέψεις与ἐκβαλεῖν之间的关系
  choice: 你才会看清楚，能把……取出来
  alternative: 你才会看清楚怎样把……取出来
  rationale: 原文不定式可理解为看清之后能够实施移除，也可略带目的或结果色彩。“能把”保留能力与结果的自然联系，不把经文过度解释为只是在辨明具体方法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你这……哪”传达呼格的直接责备；“梁木”与“小木屑”保留原文鲜明而夸张的大小对比。脚注标记紧随各自解释的词语，避免咨询层中标记位置与注释内容错配。
