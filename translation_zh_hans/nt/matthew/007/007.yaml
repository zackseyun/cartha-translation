  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: zh_hans
  text: 你们祈求[a]，就会赐给你们；寻找，就会找到；敲门，就会给你们开门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语的三个现在时命令语气也可以带有持续的意味：“要不断祈求……不断寻找……不断敲门。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: 祈求
  rationale: 现在时主动命令语气、第二人称复数。在本段祷告语境中，“祈求”自然庄重，并保留向某一位对象求取的含义；持续或反复的意味不在正文中强行展开，另见脚注。
- source_word: δοθήσεται
  choice: 会赐给
  rationale: 将来时被动语态。汉语若机械译作“会被给予”不自然；“会赐给你们”以自然表达传达神圣被动所暗示但未明说的施予者。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 明确保留复数第二人称与受益者关系；在首句和末句中均译出。
- source_word: ζητεῖτε
  choice: 寻找
  rationale: 现在时主动命令语气。“寻找”兼具实际和比喻意义，语体庄重而通俗；持续意味留在脚注说明。
- source_word: εὑρήσετε
  choice: 会找到
  rationale: 将来时主动直陈语气，直接保留应许性的将来表达。
- source_word: κρούετε
  choice: 敲门
  rationale: 现在时主动命令语气。原文只说“敲”，但汉语通常说“敲门”；结合随后“开门”的意象补出“门”，不改变其含义。
- source_word: ἀνοιγήσεται
  choice: 会给你们开门
  rationale: 将来时被动语态。此译法比“门会被打开给你们”更符合现代汉语，同时保留未明说开门者的表达效果及“为你们开”的受益关系。
- source_word: καὶ
  choice: 就
  rationale: 三个并列结构中的 καί 连接命令与结果。现代汉语用“就”自然呈现紧密对应关系，同时不增加“然后”所暗示的时间先后。
theological_decisions:
- issue: 三个现在时命令语气的体貌
  choice: 正文用简洁命令式“祈求、寻找、敲门”，将可能的持续意味置于脚注。
  alternative: 正文明确译作“不断祈求……不断寻找……不断敲门”。
  rationale: 希腊语现在时命令语气容许持续或反复的理解，但单凭词形不宜把这种意味绝对化；如此既保持自然中文，也保存原文的解释空间。
- issue: 两个被动式中行动者的身份
  choice: 采用自然汉语“赐给你们／给你们开门”，不在正文直接补出“上帝”。
  alternative: 译作“上帝就会赐给你们／给你们开门”。
  rationale: 原文使用被动式而未明说行动者，语境很可能暗指上帝；正文不直接补名，可避免把含蓄的神圣被动改成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三组“命令—应许”保持平行节奏；首句明示“你们”，后两句按自然汉语省略重复主语，但各句的复数对象不变。
