  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: zh_hans
  text: 因为他教导他们，像有权柄的人，而不像他们的经学家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他带着权柄教导他们，不像他们的经学家。”
    reason: “像有权柄的人”直译ὡς ἐξουσίαν ἔχων；“带着权柄”按现代汉语将其表达为教导的方式，同时保留与经学家的对比。
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: 因为他教导……时
  rationale: ἦν与现在分词构成迂回未完成时，表达过去持续进行的教导；γάρ承接上一节众人的惊讶，说明其原因，因此译作“因为”。
- source_word: αὐτούς
  choice: 他们
  rationale: 作“教导”的直接宾语，指听讲的众人。
- source_word: ὡς ἐξουσίαν ἔχων
  choice: 像有权柄的人
  rationale: 贴近希腊语比较结构，保留耶稣本人拥有权柄这一含义；ἐξουσία在此指正当的权威或权柄，不仅是自信或表达有力。
- source_word: καὶ οὐχ ὡς
  choice: 不像
  rationale: 以自然简洁的汉语保留原文明确的对比。
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: 他们的经学家
  rationale: γραμματεῖς在此指精通并讲授律法的宗教学者；“经学家”比现代通常指抄写人员的“文士”更易让普通读者准确理解其职分，同时保留αὐτῶν“他们的”。
theological_decisions:
- issue: 耶稣教导权柄的性质
  choice: 描述为“像有权柄的人”
  alternative: 明确扩展为来自上帝的神圣权柄，或弱化为单纯的自信和感染力
  rationale: 本节肯定耶稣确有权柄，并将他的教导方式与经学家形成对比，却未在本节说明这权柄的完整神学根源；译文不作超出原文的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经学家”准确传达当时精通律法者的身份；主句保留原文的比较结构，脚注提供更地道的方式状语表达。
