review_pass:
  verdict: revise
  source_fidelity: 主译文保留了γάρ的解释关系、对听众的“他们”、权柄与经学家的对比，以及αὐτῶν的“他们的”。但“教导他们时，像有权柄的人”在汉语中句法不够完整、修饰关系略悬空；脚注的“而是”也把原文的并列否定对比改成了较强的转折替换。
  naturalness: 应删去“时”，并用“而不像”清楚连接两个比较项。这样既保持庄重、现代的普通话，也避免“像有权柄的人”在“时”后成为不自然的断句。
  terminology: “权柄”适合译ἐξουσία，表达权威／正当权力而不将其弱化为自信。“经学家”可传达本处γραμματεῖς作为律法专家的身份；“他们的”应保留。
  issues:
  - severity: medium
    issue: 主译文中“教导他们时，像有权柄的人”句法悬空。
    rationale: 原文的ὡς ἐξουσίαν ἔχων修饰教导的方式；汉语加“时”后，后面的“像有权柄的人”缺少自然的谓语衔接，读起来不顺。
  - severity: medium
    issue: 脚注以“而是”表达对比。
    rationale: καὶ οὐχ ὡς是“并且不像／而不像”的否定比较，不是“不是……而是……”式的替代结构；脚注应保留原文对比的开放性。
  revised_text: 因为他教导他们，像有权柄的人，而不像他们的经学家。[a]
