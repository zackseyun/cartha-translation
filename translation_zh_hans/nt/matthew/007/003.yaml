  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: zh_hans
  text: 可是，你为什么看见你的弟兄[b]眼中的木屑[a]，却没有察觉自己眼中的梁木[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木屑”也可译作“小木刺”、“草梗”或“糠屑”；希腊语 κάρφος 泛指细小而干燥的碎片。
    reason: lexical_alternative
  - marker: b
    text: 希腊语为阳性单数“弟兄”；译文保留原文形式。
    reason: lexical_alternative
  - marker: c
    text: “梁木”也可译作“大梁”或“木梁”；希腊语 δοκός 指建筑用的大块梁材。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: 为什么
  rationale: 在 τί 与 βλέπεις 构成的疑问句中，τί 按惯用法表达原因，译为“为什么”能准确传达反问语气。
- source_word: δὲ
  choice: 可是
  rationale: δὲ 在这里承接上文并带有轻微转折；“可是”自然地表现这种对比。
- source_word: βλέπεις
  choice: 看见
  rationale: 保留 βλέπω 的视觉意象，并与后面的 κατανοεῖς（“察觉”）形成用词上的区别。
- source_word: κάρφος
  choice: 木屑
  rationale: κάρφος 指细小、干燥的碎片，如草梗、糠屑或小木刺。“木屑”适合眼中异物的形象，也能与巨大的“梁木”形成鲜明反差，同时不把其具体形状限定得过死。
- source_word: ἀδελφοῦ σου
  choice: 你弟兄
  rationale: 原文是阳性单数亲属称谓。“你弟兄”保留其形式和群体内亲近关系，不将它擅自改为中性或复数。
- source_word: τῷ σῷ
  choice: 自己
  rationale: σῷ 带有强调，与“你弟兄”的眼睛相对；汉语用“自己”自然地突显这一对比。
- source_word: δοκόν
  choice: 梁木
  rationale: δοκός 指建筑用的大梁。“梁木”既准确保留建筑意象，也凸显与“木屑”之间夸张的大小反差。
- source_word: οὐ κατανοεῖς
  choice: 却没有察觉
  rationale: κατανοέω 有留意、认真观察并认识到之意。“没有察觉”既自然，又保留了讽刺性的对照：能看见别人眼中的小物，却未意识到自己眼中的大梁。
- source_word: ὀφθαλμῷ
  choice: 眼中
  rationale: 按其本义译出，并保留整句具体而夸张的视觉比喻。
theological_decisions:
- issue: ἀδελφοῦ 的性别与关系含义
  choice: 你弟兄
  alternative: 你的弟兄或姐妹；同伴
  rationale: 原文为阳性单数“弟兄”。译文保留这一形式，不因该教训具有普遍适用性而在正文中将其性别中性化，也不把亲属或群体内称谓解释性改写为“同伴”。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“看见”与“察觉”分别对应 βλέπεις 和 κατανοεῖς，保留原文动作层次；“木屑—梁木”保存具体视觉意象及夸张反差。
