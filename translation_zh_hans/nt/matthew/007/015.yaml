id: MAT.7.15
reference: Matthew 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: zh_hans
  text: “你们要提防假先知[a]。他们披着羊皮[b]来到你们这里，里面却是凶残的狼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要警惕假先知。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“穿着羊的衣服。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: 要提防
  rationale: 现在时命令语气要求持续警觉；“提防”自然地表达 προσέχω 与 ἀπό 组合所具有的防备、警戒之意。
- source_word: ψευδοπροφητῶν
  choice: 假先知
  rationale: 准确表达那些冒充先知或以先知身份传讲虚假信息的人，同时不把所指范围限缩为后世某种教会类别。
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: 他们……来到你们这里
  rationale: 保留其主动接近听众的意味；独立成句更符合现代汉语表达。
- source_word: ἐν ἐνδύμασι προβάτων
  choice: 披着羊皮
  rationale: 简洁自然地传达外表如羊的伪装意象；脚注说明原文更直译的表达。
- source_word: ἔσωθεν δέ εἰσιν
  choice: 里面却是
  rationale: “里面”与外在衣着形成鲜明对照，“却”准确体现 δέ 的转折。
- source_word: λύκοι ἅρπαγες
  choice: 凶残的狼
  rationale: ἅρπαγες 强调攫取、掠夺和伤害的本性；“凶残”在汉语中自然有力，也避免“饥饿”可能造成的单纯食欲含义。
theological_decisions:
- issue: 对欺骗人之宗教领袖的警告性质
  choice: 按原文直陈为对假先知的警告，保留外表与内在实质的对照
  alternative: 将“假先知”具体解释为后世教义意义上的异端教师
  rationale: 经文本身使用先知、羊皮和狼的意象揭露伪装与危险，但没有明确限定于后世某一宗派、制度或教义类别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披着羊皮”保留鲜明意象，但不扩展为经文未直接出现的完整成语。“凶残的狼”突出其掠夺性与破坏性。
