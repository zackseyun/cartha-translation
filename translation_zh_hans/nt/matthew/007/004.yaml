  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: zh_hans
  text: 或者，你怎能对你的弟兄[a]说：‘让我把你眼里的木屑[b]取出来’，看哪，你自己眼里却有一根梁木[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”原文为阳性单数；这里也可能以一位弟兄为代表，泛指同作门徒的人。
    reason: cultural_note
  - marker: b
    text: “木屑”也可译作“碎屑”，指一小片干燥的材料。
    reason: lexical_alternative
  - marker: c
    text: “梁木”也可译作“房梁”或“大木头”，指一根大型建筑用木梁。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: 不然，你怎么能……说
  rationale: ἤ承接上一节，引出另一个反问；πῶς与将来时ἐρεῖς在这里质疑这样说的可能性。译为“不然，你怎么能……说”既保留反问力度，也符合现代汉语表达。
- source_word: τῷ ἀδελφῷ σου
  choice: 对你的弟兄
  rationale: ἀδελφός是阳性单数，直译为“弟兄”；在本语境中也可能泛指同一信仰群体中的人，相关范围在脚注说明。
- source_word: Ἄφες ἐκβάλω
  choice: 让我……取出来
  rationale: Ἄφες在此是请求准许的惯用表达，ἐκβάλω结合从眼中除去异物的具体语境，自然译为“取出来”。
- source_word: τὸ κάρφος
  choice: 木屑
  rationale: κάρφος指细小的干燥物碎片。“木屑”在汉语中形象自然，并与后面的巨大梁木构成鲜明夸张对比，但不把它限定为尖锐的刺。
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: ἰδού是唤起注意的语篇标记。“看哪”保留其突显和惊讶作用，并维持庄重而可懂的语体。
- source_word: ἡ δοκὸς
  choice: 一根梁木
  rationale: δοκός指大型建筑用木梁。“梁木”比“木板”更准确，也能充分表现与微小木屑之间的夸张反差。
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: 你自己眼里却有
  rationale: 原文直陈梁木在“你的眼里”；“自己”和“却”把上下文中的强烈对照自然地传达出来，并未改变所指。
theological_decisions:
- issue: ἀδελφῷ的性别与所指范围
  choice: 弟兄
  alternative: 弟兄姊妹；同伴；同信的人
  rationale: 原文是阳性单数，以假设中的一个男性对象作直接称呼；正文保留这一形式，不擅自扩展性别范围。脚注说明它在此可能具有代表性，泛指同作门徒的人。
- issue: κάρφος与δοκός的夸张对比
  choice: 木屑／梁木
  alternative: 碎屑／房梁；小刺／木梁
  rationale: 这一组译词保存耶稣比喻中刻意造成的巨大比例反差，同时避免把κάρφος过度限定为尖刺，也避免将δοκός弱化为普通木板。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不然……怎么能”保持连续反问的力度；“看哪”较日常口语正式，但仍为现代读者所理解，并贴近ἰδού的强调作用。引语使用中文全角标点，木屑与梁木的荒诞画面保持鲜明。
