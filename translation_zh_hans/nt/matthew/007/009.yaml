id: MAT.7.9
reference: Matthew 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: zh_hans
  text: 或者，你们中间有谁，如果他的儿子向他要饼，难道他会给儿子一块石头吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: 或者
  rationale: 承接上一节并引出另一个反问式比喻，保持论述的推进。
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: 你们中间有谁
  rationale: 以现代汉语自然表达部分结构“你们中间”及代表性单数“谁”；ἄνθρωπος在此泛指人，不必生硬译作“男人”。
- source_word: ὁ υἱὸς αὐτοῦ
  choice: 他的儿子
  rationale: 保留原文明确的亲子关系和阳性名词“儿子”，不泛化为“孩子”。
- source_word: αἰτήσει
  choice: 要
  rationale: 该词为将来时，但在一般性假设中，现代汉语通常不显式标记将来；“向他要”自然表达请求取得食物。
- source_word: ἄρτον
  choice: 饼
  rationale: 指当时日常食用的饼类主食；“饼”既保持具体意象，也避免“食物”过度泛化。
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: 难道他会给儿子一块石头吗
  rationale: μή表明反问预期否定回答；“难道……吗”准确传达这一语用力量。“一块石头”符合现代汉语量词习惯。
theological_decisions:
- issue: 代表性性别用语
  choice: 你们中间有谁
  alternative: 你们中间有哪个男人
  rationale: ἄνθρωπος本身可指“人”，此处虽由“他的儿子”构成父子场景，但重点是听众中没有人会如此行；汉语“谁”自然保留代表性范围，又不添加原文没有明说的“父亲”称谓。
- issue: 反问的否定预期
  choice: 难道他会……吗
  alternative: 他会……吗
  rationale: 原文μή明确提示预期答案为“不”；采用“难道”保留反问力度，不把句子改写成直陈否定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将原文关系从句按汉语习惯重组为假设句，但保留“儿子—饼—石头”的具体对比及反问语气。
