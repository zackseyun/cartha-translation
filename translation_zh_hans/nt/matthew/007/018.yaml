  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: zh_hans
  text: 好树[a]不能结坏果子[b]，烂树[c]也不能结好果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好树”或译“健康的树”。
    reason: lexical_alternative
  - marker: b
    text: “坏果子”或译“恶果”。
    reason: lexical_alternative
  - marker: c
    text: “烂树”或译“腐坏的树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: 好树
  rationale: ἀγαθός通常表示“好”；“好树”既保留树的比喻，也保留评价意味，不把含义收窄为单指树的健康状况。
- source_word: οὐ δύναται ... ποιεῖν
  choice: 不能结
  rationale: δύναται在否定式中明确表达不能；ποιεῖν与“果子”连用时，现代汉语自然表达为“结（果子）”，既准确又符合树木意象。
- source_word: καρποὺς πονηρούς
  choice: 坏果子
  rationale: πονηρός可指坏的、恶的或劣质的；“坏果子”在此既自然，又保留品质与道德评价之间的比喻张力。
- source_word: οὐδέ
  choice: 也不能
  rationale: οὐδέ承接前句的否定并形成平行对照；“也不能”符合现代汉语习惯，同时保持两句的均衡结构。
- source_word: δένδρον σαπρόν
  choice: 烂树
  rationale: σαπρός表示腐烂、败坏；“烂树”简洁鲜明，保留原文具体而强烈的意象，比泛化为“坏树”更贴近词义。
- source_word: καρποὺς καλούς
  choice: 好果子
  rationale: καλός在此指品质良好的果子；“好果子”自然地与“坏果子”构成对照，并保留上下文的比喻。
theological_decisions:
- issue: 比喻中“不能”的性质
  choice: 按原文译为绝对性的“不能”
  alternative: 通常不会；不应该
  rationale: 希腊文οὐ δύναται明确表达不能，而非仅指概率低或道德义务。译文保留耶稣此处强烈的对照，但不进一步替读者界定这一比喻在系统神学上的范围。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。“结……果子”符合汉语搭配；两句以“不能／也不能”保持原文平行结构。脚注保留ἀγαθός、πονηρός与σαπρός的合理词义选择，而正文不消解比喻中品质与道德评价之间的张力。
