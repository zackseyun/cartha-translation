  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: zh_hans
  text: 你们会凭着他们的果子认出他们来。[a]人难道会从荆棘上摘葡萄，或从蒺藜上摘无花果吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们会凭着他们的果子认识他们。”
    reason: 词义备选：ἐπιγνώσεσθε可译为“认出”或“认识、知道”；正文的“认出”较贴合根据可观察证据加以辨别的语境。
  - marker: b
    text: 这个问句预期的答案是否定的：人不会从荆棘上摘葡萄，也不会从蒺藜上摘无花果。
    reason: 说明μήτι所标示的反问语气，帮助读者把握原句预期的否定回答。
lexical_decisions:
- source_word: καρπῶν
  choice: 所结的果子
  rationale: 保留具体的果实意象及其比喻张力；现代汉语通常以“果子”作集合性表达，不必机械添加复数标记。“所结的”使所属关系和农业语境自然清楚，但不把比喻解释为“行为”或“成果”。
- source_word: ἐπιγνώσεσθε
  choice: 就会认出
  rationale: 此处表示根据可观察的证据辨认出来；“认出”比宽泛的“知道”更贴合辨别假先知的语境，又不夸大为“完全认识”。
- source_word: ἀπὸ
  choice: 凭着／从……上
  rationale: 第一次表达判断所依据的来源，译作“凭着”；后两次描述从植物上采摘果实，译作“从……上”，分别符合现代汉语习惯。
- source_word: μήτι
  choice: 难道会……吗
  rationale: μήτι引出预期否定回答的反问；“难道会……吗”在现代汉语中自然地保留这一语用力量。
- source_word: συλλέγουσιν
  choice: 摘
  rationale: 在葡萄和无花果的采收语境中，“摘”比泛指收集的“聚集”更自然，同时完整保留农业图景。
- source_word: ἀκανθῶν
  choice: 荆棘
  rationale: 该词可指刺或多刺灌木；“荆棘”简洁、通俗，并能与后面的另一种多刺植物形成平行。
- source_word: σταφυλάς
  choice: 葡萄
  rationale: 直接对应原文复数名词；汉语物质或类属名词通常无需显式复数标记。
- source_word: τριβόλων
  choice: 蒺藜
  rationale: 指一种带刺的杂草或植物；“蒺藜”准确保留与“荆棘”有别的植物形象，也符合庄重的现代书面语。
- source_word: σῦκα
  choice: 无花果
  rationale: 该词的标准现代汉语对应词，保留与葡萄平行的可食果实意象。
- source_word: αὐτῶν / αὐτούς
  choice: 他们的／他们
  rationale: 代词回指上下文所谈论的人；译文保留人的指称，不把它改写为抽象对象。
theological_decisions:
- issue: 以“果子”辨认人的比喻意义
  choice: 保留“所结的果子”这一比喻，不在正文中解释为行为、品格或结果。
  alternative: 译作“凭他们的行为”或“凭他们产生的结果”。
  rationale: 原文有意使用农业比喻，其所指可以涵盖可观察的行为、教导及后果；直接解释成某一项会不必要地缩窄经文的含义。
- issue: 反问所预设的答案
  choice: 用“难道会……吗”明确传达预期的否定回答。
  alternative: 用中性的“人会不会……”提问。
  rationale: μήτι本身标示说话者预期答案为否定；译出这种反问语气忠实于原文，并不增加新的神学判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“认出他们来”具有口语可懂度，“凭着”“荆棘”“蒺藜”则保持经文所需的凝练与尊严。两句保留原文由辨认原则转入农业反问的结构和平行意象。
