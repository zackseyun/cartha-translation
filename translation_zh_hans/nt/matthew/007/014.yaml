id: MAT.7.14
reference: Matthew 7:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: zh_hans
  text: 因为那门是窄的，那条通向生命的路是艰难的，找到它的人也少。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: 窄的
  rationale: 直接表达门的狭窄，与上下文中的宽门形成鲜明对照。
- source_word: τεθλιμμένη
  choice: 艰难的
  rationale: 该完成时被动分词源于“挤压、压迫”，在这里形容道路难行；“艰难”自然传达受压迫、困苦的意味，又避免将意象过度具体化为道路宽度。
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: 通向生命的
  rationale: 准确保留道路所通往的终点；“生命”不额外限定为今生或永生，以保留原文的神学张力。
- source_word: οἱ εὑρίσκοντες αὐτήν
  choice: 找到它的人
  rationale: 保留“找到”这一主动表达，并让代词“它”自然指向前述道路。
theological_decisions:
- issue: τεθλιμμένη是否应译成道路“狭窄”或“艰难”
  choice: 艰难的
  alternative: 狭窄的／受挤压的
  rationale: 词形含有受挤压、受困苦之意，而语境聚焦通往生命之路的艰难；此译法不把它仅仅化约为物理宽度，也不将苦难解释成特定教义。
- issue: ζωή的范围
  choice: 生命
  alternative: 永生
  rationale: 原文仅作“生命”，因此不补入“永”字，保留其在马太福音语境中的丰富含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那门……那条……路”保留希腊文定冠词所指向的具体对比；句式简洁，适合经文诵读。
