  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: zh_hans
  text: 那么，你们虽然邪恶，尚且知道把好礼物给自己的儿女；何况你们那位在诸天里的父亲[a]，岂不更会把好东西[b]赐给求他的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上常译作“在天上的父亲”。希腊原文“诸天”是复数。
    reason: lexical_alternative
  - marker: b
    text: 有些译本作“好礼物”，但这一分句的希腊原文只说“好东西”，没有重复前面的“礼物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: 虽然邪恶
  rationale: 分词结构在语境中带有让步意味。“虽然邪恶”既保留对人的直接负面描述，也符合现代汉语表达；不将其扩展为某种完整的人论教义。
- source_word: οἴδατε διδόναι
  choice: 知道把……给
  rationale: οἴδατε与不定式διδόναι连用，表示知道怎样做、具有实际判断与行动能力；汉语“知道把……给”自然传达这一意义。
- source_word: δόματα ἀγαθὰ
  choice: 好礼物
  rationale: δόματα明确指所赠之物，ἀγαθὰ修饰它；“好礼物”简洁、自然，并保留名词。
- source_word: τοῖς τέκνοις ὑμῶν
  choice: 给自己的儿女
  rationale: τέκνα包含不同性别的子女。“儿女”在现代汉语中自然且具包容性；“自己的”清楚表达ὑμῶν的所属关系。
- source_word: πόσῳ μᾶλλον
  choice: 何况……岂不更
  rationale: 这是由小及大的加强比较论证。汉语“何况……岂不更”自然呈现其修辞力度，并与全句的反问形式协调。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 你们那在诸天之上的父
  rationale: 保留“你们的父”以及随后限定其所在的结构，并以“诸天”反映原文复数τοῖς οὐρανοῖς，而不改写为形容词性的“天父”。
- source_word: δώσει ἀγαθὰ
  choice: 会把好东西赐给
  rationale: 第二处ἀγαθὰ独立作名词使用，原文没有重复δόματα，因此译作“好东西”，不擅自补成“好礼物”。“赐给”适合父神施予的庄重语境。
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: 求他的人
  rationale: 现在分词作名词使用，泛指向他祈求的人；“求他的人”简明自然，也不额外限定所求内容。
theological_decisions:
- issue: “πονηροὶ ὄντες”对人的道德描述力度
  choice: 保留“虽然邪恶”的直接说法
  alternative: 虽然有罪；虽然并不完美；虽然是恶人
  rationale: 原文直接以πονηροί描述听众。译文不把它弱化为一般的不完美，也不扩充为超出本节的系统性人论；同时避免“恶人”可能带来的固定身份标签。
- issue: “ὁ ἐν τοῖς οὐρανοῖς”的表达
  choice: 在诸天之上的父
  alternative: 天父；天上的父
  rationale: 原文是复数方位短语，不是形容词头衔。此译法较透明地保留其形式，同时不对“诸天”的宇宙论含义作额外解释。
- issue: 第二处“ἀγαθὰ”是否补出“礼物”
  choice: 好东西
  alternative: 好礼物；美善的事物
  rationale: 第二分句没有δόματα。“好东西”保留实词化形容词的开放性，避免为追求前后对称而补入原文未重复的名词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上文推论；全句以反问呈现πόσῳ μᾶλλον的修辞力量。“诸天之上”略带经文语体，但用于透明反映原文复数，并由脚注说明传统译法。
