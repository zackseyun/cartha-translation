  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: zh_hans
  text: 雨降下来，河水涌来[a]，风吹，冲击那座房子[b]；房子却没有倒下，因为它原是建基在磐石上的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洪水涌来”；希腊文ποταμοί通常意为“河流”。
    reason: lexical_alternative
  - marker: b
    text: 或译“扑向”或“撞击”那座房子。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: 雨降下来
  rationale: 保留καταβαίνω所表达的向下运动；现代汉语中“雨降下来”自然清楚，也不把βροχή强化为“暴雨”。
- source_word: ἦλθον οἱ ποταμοί
  choice: 河水涌来
  rationale: ποταμοί通常指“河流”；在风雨冲击房屋的语境中，“河水涌来”比直译“河流来了”更符合现代汉语，同时没有直接把词义限定为“洪水”。
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: 风刮起
  rationale: 准确表达风吹动的景象，并采用自然的现代汉语说法。
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: 冲击那座房子
  rationale: προσπίπτω本义为“扑向、撞上”；“冲击”在风暴语境中自然地传达风撞击房屋的力量，同时以脚注保留较贴近字面的译法。
- source_word: οὐκ ἔπεσεν
  choice: 房子却没有倒下
  rationale: 直接保留πίπτω“倒下”的意象；“却”表现预期中的冲击与实际结果之间的转折。
- source_word: τεθεμελίωτο ἐπὶ τὴν πέτραν
  choice: 它原是建基在磐石上的
  rationale: “原是”体现过去完成时所指的先在状态，“建基”保留θεμελιόω的根基意象；“磐石”自然、庄重，又不把πέτρα进一步具体化为“基岩”。
theological_decisions:
- issue: 比喻中根基与磐石的意象
  choice: 建基在磐石上
  alternative: 以基岩为根基
  rationale: 本节只陈述房屋建基于磐石，并未在此直接说明磐石所代表的对象；译文保留比喻本身，不加入特定的神学指认。“基岩”则比希腊文πέτρα更具体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那座房子”明确指实体建筑；分号划分风暴冲击与房屋不倒的结果。两个脚注标记均置于相关词语之后。
