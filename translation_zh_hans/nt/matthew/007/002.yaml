  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: zh_hans
  text: 因为你们用什么判断判断人，也必受什么判断；你们用什么尺度衡量，也必用什么尺度量给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也必量还给你们。”希腊原文没有明说“还”，但其中含有相应回报的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: 判断／判断人／受判断
  rationale: 保留同源词的重复和前后对应关系；“判断”比“定罪”范围更广，不把经文限定为定罪。
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: 尺度／衡量人／量给你们
  rationale: 以“尺度—衡量—量给”再现名词与动词的文字呼应，同时保持现代汉语自然可懂。
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: 用什么……也……什么；用什么……也……
  rationale: 该结构表示所凭借的标准或尺度；中文以平行句式传达工具和标准之意。
- source_word: γὰρ
  choice: 因为
  rationale: 明确本节是对上一节禁令的解释和理由。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 按与格直译其受事方向，不在正文额外加入原文未明说的“回”。
theological_decisions:
- issue: 回报性判断的施行者
  choice: 采用无施事者的被动表达“必受判断／必……量给你们”
  alternative: 明确译成“上帝也必照样判断你们”或“别人也会照样判断你们”
  rationale: 希腊文被动式没有明说施行者；译文不把它限定为上帝的审判或人与人之间的相应对待。
- issue: κρίνω在本节中的含义
  choice: 译为一般性的“判断”
  alternative: 译为较窄的“定罪”
  rationale: 上下文带有警告意味，但词本身仍可指判断、评断或审断；保留其范围可避免过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以两个平行分句保留原文的格言式节奏。“人”在“判断人／衡量人”中是为汉语自然表达补出的宾语，不限定具体对象；“照样”表达两个分句中的对应关系，但不指明施行者。
