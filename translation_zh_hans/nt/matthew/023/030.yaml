  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: zh_hans
  text: 你们又说：‘如果我们生在我们祖先的时代，就不会与他们一同有份于众先知的血了。’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他们一同有份于众先知的血”指参与流众先知的血，或共同承担由此而来的血债。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: 你们还说
  rationale: 现在时直陈语气第二人称复数，是耶稣对听众的直接陈述；“还”自然承接上文列举的行为。
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: 如果我们活在……的日子
  rationale: 未完成时配合带ἄν的主句，构成与过去事实相反的假设；此译法既表达昔日处境，也保留“在……的日子”这一时间意象。
- source_word: τῶν πατέρων ἡμῶν
  choice: 我们祖先
  rationale: πατέρες在这里指先辈；现代汉语用“祖先”比字面的“父辈”更自然，也不会误解为仅指上一代父亲。
- source_word: οὐκ ἂν ἤμεθα
  choice: 就不会……了
  rationale: 以汉语的条件句式表达过去非真实条件的结果。
- source_word: αὐτῶν κοινωνοὶ
  choice: 和他们一同有分
  rationale: κοινωνοί表示共同参与、分享或牵连；“一同有分”保留其关系性和参与性，没有强化成明确的“同谋”。
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: 于众先知的血
  rationale: 保留原文“血”的具体意象及介词结构；语境指参与流先知之血并承担血债，但正文不把隐含意义完全释明。
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι所表达的牵连程度
  choice: 和他们一同有分于众先知的血
  alternative: 和他们一起流众先知的血／成为杀害众先知的同谋
  rationale: 原文表明与先辈共同参与杀害先知所造成的血债，但κοινωνοί本身可表示参与者或共享者。正文保留这种张力，不将其收窄为法律意义上的“同谋”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祖先”清楚表达历史上的先辈；“有分于……的血”略带经文语体，以保存原文的血之意象和参与含义。脚注标记置于整句引语之后。
