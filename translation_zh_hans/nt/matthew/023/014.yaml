base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: zh_hans
  text: “你们这些经学家和法利赛人，假冒为善的人，有祸了！[a]因为你们侵吞寡妇的家产，却以长篇祷告作掩饰。因此，你们将受到更严厉的审判。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本，包括四世纪的《西奈抄本》和《梵蒂冈抄本》，早期科普特文译本也没有本节；但拜占庭多数文本传统、古拉丁文译本、《武加大译本》和叙利亚文译本保存了本节。它可能是后来的抄写员参照《马可福音》12:40和《路加福音》20:47的类似经文增补的。收录本节的抄本对于它应位于第13节之前还是之后也有不同。
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: 侵吞
  rationale: 该词字面为“吞吃”，此处比喻无情剥削寡妇，使其家产遭受损失；“侵吞寡妇的家产”在现代汉语中自然有力，也保留其掠夺意味。
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: 寡妇的家产
  rationale: οἰκίας 字面可指“房屋”或“家”，在此与“吞吃”连用，语境更可能涵盖寡妇的产业和生计；译作“家产”避免被误解为只夺取住宅。
- source_word: προφάσει
  choice: 作掩饰
  rationale: 表示用表面的理由或行为遮盖真实恶意；与“长篇祷告”搭配时，“作掩饰”准确传达祷告成为隐藏剥削行为的幌子。
- source_word: μακρὰ προσευχόμενοι
  choice: 长篇祷告
  rationale: 保留祷告篇幅很长的含义，并以自然的现代汉语表达其刻意延长的外在表现。
- source_word: περισσότερον
  choice: 更重的
  rationale: 在惩罚性 κρίμα 的语境中表示程度更大，译为“更重的”比单纯的“更多”更符合汉语搭配。
- source_word: κρίμα
  choice: 定罪
  rationale: 该词可泛指判断、判决；本句明确指负面的惩罚性裁决，因此“定罪”准确表达语境，同时保留司法性。
- source_word: Οὐαὶ ὑμῖν
  choice: 你们……有祸了
  rationale: 保留先知式警告和哀叹的力度；这一表达比单纯“你们真可悲”更能传达临到的审判。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 指外在敬虔与真实行为不一致的人；采用现代中文圣经读者熟悉且清楚的表达。
theological_decisions:
- issue: περισσότερον κρίμα 所指的审判程度
  choice: 更重的定罪
  alternative: 更严厉的审判
  rationale: 原文表达比较程度，但没有说明审判机制或等级；译文只保留“更重”的比较含义，不进一步作教义化解释。
- issue: 长篇祷告与侵吞寡妇家产的关系
  choice: 却以长篇祷告作掩饰
  alternative: 并且故意作长篇祷告
  rationale: προφάσει 表明祷告被用作托辞或掩饰；“却……作掩饰”保留对伪善的指控，但不推断具体的欺诈方式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“经学家”比“文士”更直接说明其身份；“侵吞”“作掩饰”“更重的定罪”兼顾原文意象、司法语气与普通读者的可理解性。脚注标记紧接整句警告，提示本节整体的文本异文问题。
