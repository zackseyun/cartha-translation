id: MAT.23.34
reference: Matthew 23:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: zh_hans
  text: 所以，看哪，我差遣先知、智慧人和经学家到你们这里来；其中有些人，你们要杀害并钉在十字架上；另有些人，你们要在你们的会堂里鞭打，并从这城追逼到那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 自然表达由上文推导出的因果关系，同时保留原文承接论述的功能。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、带有郑重宣告色彩的语气；现代读者虽较少用于日常口语，但在庄重经文语体中清楚可懂。
- source_word: ἀποστέλλω
  choice: 差遣
  rationale: 准确体现受委派而被派出的含义，并保留耶稣作为差遣者的明确陈述。
- source_word: σοφοὺς
  choice: 智慧人
  rationale: 对应‘有智慧的人’，不额外限定其身份或宗教职分。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 在此指熟悉、讲授并解释经文的人；‘经学家’较‘文士’更便于现代普通读者理解，也不把他们与前文受谴责的特定群体简单等同。
- source_word: μαστιγώσετε
  choice: 鞭打
  rationale: 直接表达以鞭刑责打，符合会堂惩戒的语境。
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: 从这城追逼到那城
  rationale: 既保留连续跨城迫害的动态，也采用自然的现代汉语表达。
theological_decisions:
- issue: 差遣者的身份与现在时态
  choice: 我差遣
  alternative: 我要差遣
  rationale: 原文为第一人称现在时 ἀποστέλλω；直译‘我差遣’保留其即时、庄严的宣告感，不擅自将其纯粹未来化。
- issue: 受害者分组与刑罚之间的关系
  choice: 其中有些人，你们要杀害并钉在十字架上；另有些人……
  alternative: 其中有些人，你们要杀害，有些要钉十字架；另有些人……
  rationale: 原文第一个 ἐξ αὐτῶν 后并列 ἀποκτενεῖτε καὶ σταυρώσετε，语法上可理解为同组人承受所列行为，也可能概括不同受害方式。正文保留紧密并列，不进一步拆分，以免消解原文张力。
- issue: ‘你们的会堂’的归属措辞
  choice: 在你们的会堂里
  alternative: 在各会堂里
  rationale: 保留原文 ὑμῶν 的第二人称所有关系，不弱化耶稣对听众所作的直接指控，也不将其扩展为对所有会堂或所有犹太人的泛化判断。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句式保留原文层层推进的预告与指控；用分号划分两类迫害行为，避免冗长失读。‘看哪’保留经文宣告语气；‘经学家’取代较古旧且容易误解的‘文士’。
