  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: zh_hans
  text: “你们这些伪善的经学家和法利赛人有祸了！因为你们建造先知的坟墓，又装饰义人的纪念碑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纪念碑”也可译作“坟墓”或“墓葬纪念物”。原文此词可指坟墓，也可指与坟墓相关的纪念性标记或建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 你们……有祸了
  rationale: 保留先知式宣告审判的强烈语气；比“你们真可悲”更贴近原文的警告和定罪意味。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指研习并讲授犹太律法的专业人士；现代读者较易理解，也比单用传统称谓“文士”更明确。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经和历史论述中通行的群体名称。
- source_word: ὑποκριταί
  choice: 伪善的
  rationale: 在本段语境中指外表敬虔、实际言行不一的人；采用定语结构，使整句中文自然，同时保留责斥意味。
- source_word: οἰκοδομεῖτε
  choice: 建造
  rationale: 忠实表达修建之意，不擅自具体化为“重修”。
- source_word: τάφους
  choice: 坟墓
  rationale: 指用于安葬的墓穴或墓室，与“建造”搭配自然。
- source_word: κοσμεῖτε
  choice: 装饰
  rationale: 直接表达加以修饰、美化之意，语体清楚而庄重。
- source_word: μνημεῖα
  choice: 纪念墓
  rationale: 该词可指坟墓或纪念性墓冢；译作“纪念墓”既保留其安葬与纪念色彩，又与前面的“坟墓”有所区分。
- source_word: δικαίων
  choice: 义人
  rationale: 保留原文作为名词使用的道德—神学称谓，指被视为正直、忠于上帝的人。
theological_decisions:
- issue: δικαίων所指的身份
  choice: 义人
  alternative: 正直的人
  rationale: “义人”简洁保留原文的道德及神学范畴，却不进一步限定这些人的得救地位或将其纳入某一特定教义体系。
- issue: Οὐαί的语气
  choice: 有祸了
  alternative: 可悲啊
  rationale: 上下文是耶稣对宗教领袖的先知式谴责；“有祸了”同时保留警告与审判意味，不把它弱化为单纯哀叹。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伪善的经学家和法利赛人”把原文同位呼语转换成自然的中文定语结构；以感叹号保留责斥力度，并让“因为”明确引出有祸的原因。
