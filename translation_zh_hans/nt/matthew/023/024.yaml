base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: zh_hans
  text: 瞎眼的领路人哪！你们把蚊蚋[a]滤出来，却把骆驼吞下去！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蚊蚋”也可译作“蚊虫”。原文指极小的飞虫；这里描写过滤饮料，把其中的小虫除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: 向导
  rationale: 该名词指带领、指引别人的人。“向导”自然保留了原文的引导隐喻，并与“瞎眼的”形成鲜明反讽。
- source_word: τυφλοί
  choice: 瞎眼的
  rationale: 原文以身体失明的鲜明意象比喻属灵辨识上的盲目；“瞎眼的”直接、有力，符合责备语气。
- source_word: διϋλίζοντες
  choice: 滤出来
  rationale: 该动词指过滤液体，把其中的杂质或小虫除去。“把……滤出来”准确表达移除的动作，也符合现代汉语习惯。
- source_word: τὸν κώνωπα
  choice: 小飞虫
  rationale: κώνωψ指蠓、蚊一类极小的飞虫。“小飞虫”便于普通现代读者理解，同时保留它与巨大骆驼之间的夸张反差；脚注列出较具体的词义。
- source_word: τὴν δὲ κάμηλον
  choice: 却把骆驼
  rationale: “骆驼”直接对应κάμηλος；“却”清楚表达δέ的强烈对比，突出两种行为之间荒谬的比例失衡。
- source_word: καταπίνοντες
  choice: 吞下去
  rationale: 该分词表示吞下。“吞下去”在现代汉语中自然、形象，并保留原文夸张而尖锐的画面。
theological_decisions:
- issue: 礼仪不洁意象及其比喻力量
  choice: 保留过滤极小飞虫、却吞下巨大骆驼的具体画面，呈现对失衡判断的尖锐责备。
  alternative: 解释性地改写为只顾小过、却忽视大罪。
  rationale: 原文没有直接抽象说明大小过错，而是借两种大小悬殊、在犹太律法背景下都属不洁的动物构成夸张对比。保留画面可避免替原文提前解释，同时保存其神学张力和修辞冲击。
translation_notes:
  register: 采用现代、庄重而易懂的责备语气。“瞎眼的向导啊”保留呼语；后句补出“你们”，使两个希腊语分词在汉语中成为自然完整的句子。两个“把”字结构强化小飞虫与骆驼之间的平行和反差。
