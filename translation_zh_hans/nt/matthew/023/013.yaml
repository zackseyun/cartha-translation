  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: zh_hans
  text: 但你们有祸了，律法教师和法利赛人，假冒为善的人！因为你们在人面前把天国关上；你们自己不进去，也不让那些正在进去的人[a]进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在进去的人”也可译作“正要进去的人”或“想要进去的人”。希腊语分词既可指进入过程中的人，也可指正寻求进入的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: 但你们有祸了
  rationale: 保留 οὐαί 的先知性谴责力度；“但”自然表达 δέ 在一连串祸告中的承接和轻微转折。
- source_word: γραμματεῖς
  choice: 律法教师
  rationale: 在福音书语境中指精通并讲授律法的人；现代读者比从传统音译或古称更容易理解。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经语境中通行的群体名称。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 表达此处宗教和道德上的伪善，并保持庄重、易懂的现代汉语。
- source_word: κλείετε
  choice: 关上
  rationale: 保留把通道关闭、阻止人进入的比喻。
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是马太这一特有表达在现代中文中的自然、通行译法，不额外引入它与“上帝的国”之间的神学区分。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人面前
  rationale: 保留原文空间性比喻，表示他们把入口当着人的面关上，从而拦阻人。
- source_word: οὐκ εἰσέρχεσθε
  choice: 自己不进去
  rationale: “自己”明确原文 ὑμεῖς 的强调，“进去”自然延续关门与进入的图像。
- source_word: τοὺς εἰσερχομένους
  choice: 那些正要进去的人
  rationale: 保留现在分词所含的进行或趋向意味，同时容纳“正在进入”和“试图进入”的语义张力。
- source_word: οὐδὲ … ἀφίετε εἰσελθεῖν
  choice: 也不让……进去
  rationale: 自然表达 ἀφίημι 加不定式的“准许、容许”意义，并明确保留 εἰσελθεῖν。
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν 的表达
  choice: 天国
  alternative: 诸天之国／天上的国
  rationale: 采用自然且广为理解的马太用语，不把复数形式机械化，也不据此建构与“上帝的国”不同的教义类别。
- issue: τοὺς εἰσερχομένους 的体貌和指向
  choice: 那些正要进去的人
  alternative: 那些正在进去的人／那些想要进去的人
  rationale: 原文现在分词可描写进入过程，也可在受阻语境中指趋向或尝试进入者；正文保持开放，并以脚注说明。
- issue: 关上天国的比喻
  choice: 在人面前把天国关上
  alternative: 把通往天国的门关上
  rationale: 正文不补出原文没有明说的“门”，从而保留原句浓缩而强烈的比喻。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“律法教师”帮助普通读者理解 γραμματεῖς 的社会宗教职能；“假冒为善的人”保留熟悉而有力的谴责语气。脚注标记置于相关句末，正文中的[a]与脚注完全对应。
