  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: zh_hans
  text: 你们这些经学家和法利赛人，假冒为善的人哪，你们有祸了！因为你们把杯子和盘子的外面洗得干净，里面却充满了掠夺和放纵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掠夺”也可译作“贪婪”“抢夺”或“勒索”；“放纵”也可译作“不能自制”。希腊语原词可带有剥削性攫取和欲望不受约束的较强含义。
    reason: 说明ἁρπαγή与ἀκρασία的词义范围；保留ἁρπαγή在此语境中可指贪婪攫取、抢夺或勒索的歧义。
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知式谴责和宣告审判的力度，不弱化为单纯的哀叹。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指专门研习并讲解经文的人；比传统的“文士”更便于现代普通读者理解，又避免扩译为特定职能。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用该群体名称在现代汉语圣经语境中的通行音译。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 表达宗教与道德上的伪装和表里不一，保留斥责语气。
- source_word: καθαρίζετε
  choice: 洗得干净
  rationale: 符合杯盘语境中的自然现代汉语，也传达使之洁净的动作。
- source_word: τὸ ἔξωθεν
  choice: 外面
  rationale: 直接保留与ἔσωθεν“里面”的鲜明对照。
- source_word: ποτηρίου καὶ τῆς παροψίδος
  choice: 杯子和盘子
  rationale: 分别表达两种餐具；“盘子”保持παροψίς所指餐桌器皿的宽泛性。
- source_word: γέμουσιν
  choice: 盛满了
  rationale: 复数动词回指杯子和盘子；汉语省略重复主语仍能自然保留这一指向，并以“盛满”贴合容器意象。
- source_word: ἁρπαγῆς
  choice: 贪夺
  rationale: 兼顾贪婪欲望与掠取、侵占他人之物的行为色彩，避免只译成较弱的内在“贪心”。
- source_word: ἀκρασίας
  choice: 放纵
  rationale: 自然表达欲望不受约束、缺乏自制的含义，并与“贪夺”并列为内在污秽。
theological_decisions:
- issue: 杯盘内部污秽的比喻指向
  choice: 仍以杯子和盘子为本句语法与意象中心，译作“里面却盛满了”，不直接改写为宗教领袖的内心。
  alternative: 译作“你们里面却充满了贪婪和放纵”。
  rationale: 希腊文复数γέμουσιν在句法上自然回指杯子和盘子；虽然比喻显然针对受斥责者，译文仍保留原文未直接拆解的意象和张力。
- issue: ἁρπαγή的道德含义
  choice: 译作“贪夺”，同时呈现贪婪和剥削性攫取。
  alternative: 译作“贪心”或“抢夺／勒索”。
  rationale: 原词可指抢夺、掠取，也可在此语境中指贪婪攫取；“贪夺”不把含义单独限定为内在欲望或某一种具体罪行。
translation_notes:
  register: 采用自然、庄重而可懂的现代标准汉语。“你们这些……哪”保留当面斥责的呼告语气；“杯子和盘子”比简称“杯盘”更直白；整句维持原文外面与里面的对照。
