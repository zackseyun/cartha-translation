  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: zh_hans
  text: 瞎眼的人哪！既然如此，哪一个更大呢？是礼物[a]，还是使礼物成圣[b]的祭坛？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”或译“供物”。
    reason: lexical_alternative
  - marker: b
    text: “使礼物成圣”或译“使礼物分别为圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: 瞎眼的人哪
  rationale: 这是形容词作名词用的阳性复数呼格，直接斥责对方属灵判断盲目。“瞎眼的人哪”保留直接称呼，也不擅自加入第17节才有的“愚拙”。
- source_word: τί γὰρ μεῖζον
  choice: 因为哪一个更大
  rationale: “哪一个”表达 τί 在两个对象之间的比较提问；“更大”紧贴 μεῖζον，并保留 γάρ 的解释、论证作用，不将其释义为较主观的“更重要”。
- source_word: τὸ δῶρον
  choice: 礼物
  rationale: δῶρον 的基本义是“礼物”，在圣殿语境中也可指献上的供物。正文保留较贴近原词的“礼物”，脚注说明语境性译法。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 这是 θυσιαστήριον 在祭祀语境中的标准对应词，准确而自然。
- source_word: τὸ ἁγιάζον
  choice: 使……成圣
  rationale: 现在分词修饰“祭坛”。“使……成圣”保留 ἁγιάζω 的圣洁与祭祀含义，同时是现代汉语中简洁、庄重的表达。
theological_decisions:
- issue: 祭坛与礼物之间的成圣关系
  choice: 使礼物成圣的祭坛
  alternative: 使礼物成为圣洁的祭坛；使礼物分别为圣的祭坛
  rationale: 原句明确以祭坛为使礼物成圣者。译文保留这种圣殿礼仪中的圣洁逻辑，不把它弱化为仅仅“使礼物具有宗教用途”，也不进一步解释其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“瞎眼的人哪”保留呼格斥责的力度；整体维持原文的反问结构及 γάρ 的论证衔接。脚注标记放在各自所说明的词语之后，避免歧义。
