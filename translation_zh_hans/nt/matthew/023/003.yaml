  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: zh_hans
  text: 所以，凡他们告诉你们的，你们都要照着做，并且遵守；但不要照着他们的行为去做[a]，因为他们说，却不做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但不要像他们那样行事。”
    reason: κατὰ τὰ ἔργα αὐτῶν可较直译为“照着他们的行为”，也可自然地表达为“像他们那样行事”。
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: 所以，凡……的……都
  rationale: 用“所以”表达 οὖν 的推论关系；“凡……都”自然传达 πάντα 与 ὅσα ἐὰν 所构成的周全语气。
- source_word: εἴπωσιν ὑμῖν
  choice: 他们告诉你们的
  rationale: “告诉”贴合 λέγω 在向人说话这一语境中的常用义，也不额外强化为正式的“教导”或“吩咐”。
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: 照着做，并且遵守
  rationale: “照着做”直接表达 ποιέω；“遵守”表达 τηρέω 的持守、遵行之意，并保留两个命令的区分。
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: 但不要照他们的行为去做
  rationale: “照……行为”保留 κατά 所表达的依照或以之为准则；“行为”自然表达 ἔργα，并以“做”呼应本节反复出现的 ποιέω。
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: 因为他们只说不做
  rationale: “只说不做”是现代汉语中简洁有力的表达，保留说与做的鲜明对照；“只”使希腊文 καί 在否定结构中的反差自然显明，而不补出原文没有明说的宾语。
theological_decisions:
- issue: 是否明确补出文士和法利赛人的教导权柄或“摩西的座位”
  choice: 本节仍用“他们”，不补出上一节的说明
  alternative: 译作“凡他们教导你们的”或“凡他们在摩西座位上告诉你们的”
  rationale: 指代对象由上下文确定，但本节原文没有重述这些内容；不扩写可避免把上下文解释直接并入经文。
- issue: 如何处理 ποιέω 的反复及说与做的张力
  choice: 保留“做……去做……只说不做”的重复和对照
  alternative: 用“实行、效法、实践”等不同词语加以润色
  rationale: 原文反复使用 ποιέω，以言行不一揭露虚伪；汉译保留“做”的回响，比刻意变换措辞更能传达修辞力量。
- issue: πάντα ὅσα 的范围是否需要加以限定
  choice: 译作“凡他们告诉你们的，你们都……”而不在本节内另加限定
  alternative: 明确限定为“凡他们按摩西律法所教导的”
  rationale: 原文本节的表述具有周全语气，具体范围与张力应由上下文承担；译文不宜自行加入神学上的限制条件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……都”保留原文的周全语气；分号呈现命令与警告之间的转折。“只说不做”简练自然，并保留原文言行相悖的警句效果。
