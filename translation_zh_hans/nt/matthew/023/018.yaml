id: MAT.23.18
reference: Matthew 23:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: zh_hans
  text: 又说：“凡指着祭坛起誓的，算不得什么[b]；但凡指着坛上礼物[a]起誓的，就负有义务。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭物”。这个希腊词可指在圣殿中献给上帝的礼物或供物。
    reason: lexical_alternative
  - marker: b
    text: 这是耶稣正在谴责的教导：按这种说法，指着祭坛所起的誓“不算数”，指着坛上礼物所起的誓才有约束力。
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: 又说
  rationale: 承接前一项受谴责的教导，并引出另一句引语；汉语用“又说”比孤立的“并且”更自然。
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: 凡……起誓的；但凡……起誓的
  rationale: ὅς加ἄν及虚拟语气表达泛指条件；“凡……的”保留其普遍、非特指的语气。
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: 指着祭坛
  rationale: 在起誓语境中，ἐν标明誓言所凭借或援引的对象；现代汉语惯用“指着……起誓”。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 准确指圣殿中献祭所用的坛，也是现代汉语圣经语境中的通行称呼。
- source_word: οὐδέν ἐστιν
  choice: 算不得什么
  rationale: 既贴近“是无关紧要的／什么也不是”的字面表达，也自然传达被耶稣谴责的规条所声称的“不算数”。
- source_word: ἐν τῷ δώρῳ
  choice: 指着……礼物
  rationale: δῶρον的直接含义是献给上帝的礼物；在此圣殿语境中也可理解为祭物或供物，故用脚注说明。
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: 坛上
  rationale: 简洁表达礼物位于祭坛之上，并使代词所指在汉语中清楚自然。
- source_word: ὀφείλει
  choice: 负有义务
  rationale: 表达起誓者处于必须承担责任的状态，同时不补出希腊文省略的具体宾语。
theological_decisions:
- issue: 誓言义务所指的省略宾语
  choice: 译作“就负有义务”，不补出义务的具体内容
  alternative: 就必须履行誓言／就受这誓言约束
  rationale: 原文只说ὀφείλει，并未明说“履行誓言”等宾语；正文保留这种简略，虽然上下文清楚表明义务与誓言有关。
- issue: “算不得什么”是谁的判断
  choice: 保留为引述中未加限定的断语，并用脚注说明这是耶稣正在谴责的教导
  alternative: 按他们的说法，这誓言不算数
  rationale: 原文直接引述该规条，没有在句内加入评价性限定；解释放入脚注可避免把该主张误当作耶稣认可的原则，同时不改写正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“指着……起誓”符合汉语誓言表达；“算不得什么”保留原文简短而略带规条式的措辞。脚注标记置于各自所解释的词语之后。
