  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: zh_hans
  text: 也不要称地上的任何人为你们的父[a]，因为你们的父只有一位，就是天上的那一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不要称地上的任何人为父。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为你们的父只有一位，就是天父”；或“因为你们的父只有一位，就是在天上的父”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε
  choice: 不要称……为你们的父
  rationale: μή加不定过去时虚拟语气构成禁令；“称……为”自然表达以“父”作为称号或称谓，同时保留原文直截了当的语气。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 属格代词在此自然译为领属关系，并保留复数第二人称。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上的
  rationale: 表达尘世范围，并与后句“天上的”形成清楚对照。
- source_word: εἷς
  choice: 只有一位
  rationale: 汉语若仅说“一位”容易不够自然；“只有一位”明确传达εἷς在本句语境中的排他力量，却不改变命题内容。
- source_word: ὑμῶν ὁ πατήρ
  choice: 你们的父
  rationale: 保留原文所表达的个人关系，也维持前后两处“父”的对应。
- source_word: ὁ οὐράνιος
  choice: 天上的那一位
  rationale: 该形容词带冠词作实体用法；此译法保留其较为突出的表达，不径直补成“天父”或解释为“在天上的父”。
theological_decisions:
- issue: 耶稣禁令的范围
  choice: 直译为不可称地上的人为“你们的父”，不在正文中限定为“属灵称号”
  alternative: 将其解释为禁止赋予人终极属灵父权，或将其处理为禁止一切日常及亲属意义上的“父”之称呼
  rationale: 原文的禁令措辞鲜明，但本节本身并未明说其与生父称谓等日常用法的关系；译文应保留这一神学张力，由上下文引导理解。
- issue: ὁ οὐράνιος的理解
  choice: 译作“天上的那一位”
  alternative: “天父”或“在天上的父”
  rationale: 原文是带冠词的形容词，既可理解为修饰或同位说明“父”，也可展开为地点性关系从句；正文保留其形式上的独特性，脚注列出自然的替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要称……为”清楚保留禁令；“父”而非“父亲”更适合作称号，并与后句对应。脚注标记均已置于正文相应位置。
