id: MAT.23.28
reference: Matthew 23:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: zh_hans
  text: 你们也同样：在人看来，外表显得公义，里面却充满了伪善和不法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 你们也同样
  rationale: 承接上一节粉饰坟墓的比喻，保留比较和归结的作用；中文表达自然明确。
- source_word: ἔξωθεν μὲν … ἔσωθεν δέ
  choice: 外表……里面却
  rationale: 清楚保留原文外在表象与内在实况的鲜明对照。
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: 在人看来，外表显得公义
  rationale: “显得”表达他人所见的表象，并不肯定他们实际公义；“人”在这里泛指人们。
- source_word: μεστοὶ
  choice: 充满了
  rationale: 直接传达形容词“满是、充满”的含义，符合现代汉语习惯。
- source_word: ὑποκρίσεως
  choice: 伪善
  rationale: 在本段责备宗教表里不一的语境中，“伪善”准确而简洁地表达假装敬虔或正直。
- source_word: ἀνομίας
  choice: 不法
  rationale: 保留该词违背、漠视律法的核心含义，不将其泛化为一般的“邪恶”。
theological_decisions:
- issue: “公义”是实际状况还是在人眼中的表象
  choice: 译为“在人看来，外表显得公义”，明确是人所见的表象
  alternative: 译成“在众人面前是义人”，可能被理解为实际具有义人的身份
  rationale: φαίνεσθε与随后“里面却充满了伪善和不法”的对照表明，耶稣所说的是外在印象，而非确认真实的公义。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“外表……里面却”保持原文修辞对称；“公义、伪善、不法”保留伦理与律法语境的力度。
