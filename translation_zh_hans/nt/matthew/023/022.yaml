id: MAT.23.22
reference: Matthew 23:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: zh_hans
  text: 凡指着天起誓的，就是指着上帝的宝座和坐在宝座上的那一位起誓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坐在其上的那一位。”
    reason: 保留ἐπάνω αὐτοῦ中代词表达的较直译形式；正文为现代汉语的清晰度重复“宝座”。
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: 凡……起誓的
  rationale: 带冠词的不定过去时分词在这里作名词性、泛指用法，表达普遍原则；现代汉语用“凡……的”自然准确，不强调过去时。
- source_word: ἐν
  choice: 指着
  rationale: 在起誓用语中，ἐν加与格表示凭某对象起誓；汉语圣经语境中“指着……起誓”既自然又能保留誓言所牵涉对象的含义。
- source_word: οὐρανῷ
  choice: 天
  rationale: 这里紧接“上帝的宝座”，所指是宗教意义上的天，而非单指物理天空。
- source_word: ὀμνύει
  choice: 就是……起誓
  rationale: 现在时陈述一般真理；“就是”清楚呈现前后行为在效力上的关联。
- source_word: θρόνῳ τοῦ θεοῦ
  choice: 上帝的宝座
  rationale: 自然呈现属格关系，同时保留庄重语体。
- source_word: τῷ καθημένῳ
  choice: 坐在……上的那一位
  rationale: 保留原文名词化分词及敬称式的间接表达，不直接改写成“上帝”；“坐在”也准确反映其持续状态。
- source_word: ἐπάνω αὐτοῦ
  choice: 在宝座上
  rationale: 代词所指是宝座；汉语为避免“它上面”的生硬和可能歧义，明确重复“宝座”，表达登座而坐，而非悬于其上。
theological_decisions:
- issue: “坐在宝座上的那一位”所指为何
  choice: 保留敬称式迂回说法，语境清楚指向在天上登宝座的上帝
  alternative: 直接译作“坐在宝座上的上帝”或较含混的“坐在上面的那一位”
  rationale: “上帝的宝座”已使所指清楚，而原文仍采用“坐在其上的那一位”的表达。译文不把这一迂回说法明说为“上帝”，从而保留原文措辞及其庄严感。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，就是……”适合表达格言式普遍原则；“指着……起誓”符合汉语宗教及法律誓言语境。正文中的脚注标记与脚注相对应。
