id: MAT.23.20
reference: Matthew 23:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: zh_hans
  text: 所以，凡指着祭坛起誓的，就是指着祭坛和坛上的一切起誓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: 所以，凡……起誓的
  rationale: οὖν 表示承接上文所得的推论，译为“所以”；带冠词的过去时分词在此作泛指，现代汉语用“凡……的”自然表达一般性原则。
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: 指着祭坛
  rationale: ἐν 与 ὀμνύω 连用时构成起誓用语，并非表达空间位置；汉语“指着……起誓”既自然又准确。θυσιαστήριον 译为“祭坛”。
- source_word: ὀμνύει
  choice: 就是……起誓
  rationale: 该动词在这里陈述普遍原则；汉语不必标明时态，以“就是”衔接并凸显其推论关系。
- source_word: ἐν αὐτῷ
  choice: 指着祭坛
  rationale: αὐτῷ 回指祭坛。为避免汉语中“指着它”可能产生指代含混，复现“祭坛”，同时保留原文含义。
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: 和坛上的一切
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ 是概括性实体表达，指坛上所有之物。“坛上的一切”自然简洁，也没有将范围缩窄为单一祭物或供物。
theological_decisions:
- issue: “坛上的一切”的所指范围
  choice: 保留为对祭坛上所有事物的概括性指称
  alternative: 译作“坛上的一切祭物”或“坛上方的一切”
  rationale: 上下文涉及坛上的礼物，但本节希腊语措辞更宽泛。正文不额外限定为祭物，可保留原文的范围与论证张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，就是……”适合表达原文的普遍性判断；“指着……起誓”是自然的汉语誓言表达。无需脚注，因为“坛上的一切”已经直接保留原文较宽的语义范围。
