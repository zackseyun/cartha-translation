id: MAT.23.26
reference: Matthew 23:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: zh_hans
  text: 瞎眼的法利赛人哪！先洗净杯子和盘子[a][b]的里面，好使杯子的外面也变得干净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘子”也可译作“碟子”“碗”或“托盘”；希腊词指盛放食物的器皿。
    reason: lexical_alternative
  - marker: b
    text: 有些古抄本没有“和盘子”。
    reason: textual_variant
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: 瞎眼的法利赛人哪
  rationale: 保留单数呼格的直接斥责及属灵盲目的比喻；“哪”自然表达现代汉语中的呼语语气。
- source_word: καθάρισον πρῶτον
  choice: 先洗净
  rationale: “先”保留次序和逻辑上的优先性；对器皿用“洗净”自然，也不妨碍其道德隐喻。
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: 杯子的里面
  rationale: 保留具体器皿意象及内外对照，不把隐喻直接解释为人的内心。
- source_word: καὶ τῆς παροψίδος
  choice: 和盘子
  rationale: παροψίς泛指盛放食物的器皿；“盘子”通俗自然，同时以脚注说明其他可能译法及文本异文。
- source_word: ἵνα γένηται
  choice: 好使……也变得
  rationale: 表达目的或结果，并保留γίνομαι所含“成为、变得”的动态意味。
- source_word: τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: 杯子的外面也变得干净
  rationale: αὐτοῦ为阳性或中性单数，语法上最自然地回指ποτηρίου“杯子”；译文不擅自改成复数，以保留原文在并列器皿后的单数表达。
theological_decisions:
- issue: 具体器皿意象与明确的道德解释
  choice: 正文保留洗净杯盘内外的具体图像
  alternative: 直译其隐含意义，如“先洁净你的内心，使外在生活也洁净”
  rationale: 原文借具体器皿形成隐喻，并未在本句中明说所指；保留图像可避免替读者消解其修辞张力。
- issue: αὐτοῦ的单数所指
  choice: 译为“杯子的外面”
  alternative: 译为“它们的外面”或笼统译为“外面”
  rationale: 单数代词在语法上回指“杯子”最为自然；不改作复数，也保留“和盘子”属于文本异文所造成的句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“瞎眼的”保留斥责力度；“洗净／干净”贴合器皿语境，并让属灵与道德含义由上下文呈现。
