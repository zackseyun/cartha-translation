  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: zh_hans
  text: 你们有祸了，文士和法利赛人，假冒为善的人！因为你们好像刷白的坟墓[a]，外面看起来美观，里面却满是死人的骨头和各样的污秽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“用石灰刷白的坟墓”。
    reason: lexical_alternative
  - marker: b
    text: “污秽”在这里既可使人联想到礼仪上的不洁，也可指道德上的败坏。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知式宣告审判的强烈语气；比“你们真可悲”更准确，也不弱化为单纯哀叹。
- source_word: γραμματεῖς
  choice: 律法教师
  rationale: 在本处指熟悉并讲授犹太律法的宗教学者；现代普通读者较容易理解，且避免“文士”在当代可能被误解为一般文人。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经传统中通行的群体名称。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 表达宗教与道德上的虚假伪装；比直译为“演员”更符合本段语境。
- source_word: παρομοιάζετε
  choice: 你们好像
  rationale: 自然表达比较关系，不把原文不必要地处理成被动句。
- source_word: τάφοις κεκονιαμένοις
  choice: 刷白的坟墓
  rationale: κεκονιαμένοις指用石灰等涂刷变白；“刷白”既准确又保留鲜明的文化意象。
- source_word: ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ
  choice: 外表看起来美观，里面却
  rationale: 保留外在观感与内在实况的鲜明对照，并以自然现代汉语呈现。
- source_word: γέμουσιν
  choice: 装满
  rationale: 与坟墓这一容器意象自然搭配，准确表达“充满”。
- source_word: ὀστέων νεκρῶν
  choice: 死人的骨头
  rationale: 直接、清楚地表达“死者的骨骸”，避免“死骨头”可能产生的歧义。
- source_word: πάσης ἀκαθαρσίας
  choice: 各样的污秽
  rationale: 保留ἀκαθαρσία的宽广语义，不限定为礼仪上的不洁或道德上的败坏。
theological_decisions:
- issue: ἀκαθαρσία在坟墓比喻中的性质
  choice: 译作“污秽”，兼容礼仪不洁与道德败坏
  alternative: 明确译作“礼仪上的不洁”或“道德败坏”
  rationale: 坟墓与死人骨头在犹太背景中自然涉及礼仪不洁，而整段责备又指向内在的道德腐败；宽泛译法保留原文的双重张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们有祸了”保留审判宣告的力度；将γραμματεῖς译为“律法教师”以便普通现代读者理解。重复“你们”以重现直接责备的语势，并保留外表与内里的修辞对照。
