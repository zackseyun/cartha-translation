  naturalness: 原译整体庄重自然。将“里面却装满死人的骨头”调整为“里面却满是死人的骨头”，更符合现代汉语中描述坟墓内部情形的自然搭配，也保持原文现在时的陈述感。
  terminology: “法利赛人”“假冒为善的人”“污秽”均合适。“文士”是对γραμματεῖς更贴近原文且在中文圣经语境中稳定的称谓；可借脚注或读者资源说明其与律法研习、抄写和解释相关，但本节无需添加该说明。“污秽”不应缩窄为单纯礼仪或道德范畴。
