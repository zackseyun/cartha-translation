revisions:
- from: 他们把沉重的担子捆好，搁在人们的肩上，自己却连一根指头也不肯动一动那些担子。
  to: 他们把沉重的担子捆好，放在人们的肩上；自己却连用一根手指去动一动这些担子也不肯。
  rationale: 修订仅消除末句的中文句法歧义，并略微提升语体自然度。“捆好”“沉重的担子”及其未明说所指的隐喻均予保留；“不肯”继续准确表达 θέλουσιν 所强调的意愿性拒绝，“动一动”保留 κινῆσαι 的“挪动”而不将其解释为“卸下”或“帮助承担”。
