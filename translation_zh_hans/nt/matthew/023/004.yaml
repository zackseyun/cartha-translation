  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: zh_hans
  text: 他们把沉重的担子捆好，放在人们的肩上；自己却连用一根手指去动一动这些担子也不肯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: 捆好
  rationale: 保留“捆绑、扎束”的具体动作，也自然呈现预备担子给别人承担的形象。
- source_word: φορτία βαρέα
  choice: 沉重的担子
  rationale: 兼顾字面的重量感与压迫性的隐喻力量，不进一步限定担子所指。
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: 搁在人们的肩上
  rationale: 准确保留把重物放到肩上的具体身体意象；“搁在”符合现代汉语表达。
- source_word: τῶν ἀνθρώπων
  choice: 人们
  rationale: ἄνθρωποι 在此泛指一般人；现代汉语“人们”自然涵盖所有人，无须添加性别含义。
- source_word: αὐτοὶ δὲ
  choice: 自己却
  rationale: “自己”保留代词的强调，“却”突出他们对别人和对自己的鲜明反差。
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: 连一根指头也
  rationale: 以自然汉语保留希腊文单数“指头”及最小程度努力的强调意味。
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: 不肯动一动那些担子
  rationale: “不肯”准确表达意愿上的拒绝，而非无能为力；“动一动”对应 κινῆσαι，并与“连一根指头也”构成自然搭配。
theological_decisions:
- issue: 担子是字面意义还是隐喻
  choice: 保留“沉重的担子”这一具体形象，不明说其所指
  alternative: 明确译为律法要求、宗教规条或义务
  rationale: 上下文表明这是对文士和法利赛人加诸他人之要求的批评，但本节希腊文本身只使用担子的形象。保留隐喻可避免把经文限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“捆好—搁在肩上—连一根指头也不肯动”的连续动作保留原文鲜明的夸张与讽刺。中文“人们”已自然表达泛指，因此不设性别说明脚注。
