review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了“捆绑重担—放在人肩上—自己拒绝稍作挪动”的具体意象，也没有擅自将“担子”解释为律法规条。μως，末句缺少表工具的“用”，使“连一根指头也不肯动一动那些担子”的句法关系不够清楚；应明确是“用一根手指”去挪动担子。
  naturalness: “搁在人们的肩上”可以理解，但在庄重、现代的经文汉语中，“放在人们的肩上”更自然稳妥。末句调整后可清楚且自然地表达“连最微小的帮助也不愿付出”的夸张对比。
  terminology: “沉重的担子”“人们”“自己却”“不肯”均恰当。“一根手指”比“指头”稍庄重，并可通过“用”准确呈现希腊文与格所表达的手段。无需性别脚注：此处“人们”已自然传达 ἀνθρώπων 的泛指意义。
  issues:
  - severity: medium
    issue: 末句缺少工具性表达，句法关系不清。
    rationale: 希腊文 τῷ δακτύλῳ αὐτῶν 表示“用他们的手指”，并修饰 κινῆσαι（挪动）。草稿的“连一根指头也不肯动一动那些担子”在现代汉语中容易读成“手指本身不肯动”，或显得搭配不完整。加入“用”可准确、自然地表达原意。
  - severity: low
    issue: “搁在人们的肩上”略偏口语。
    rationale: “放在人们的肩上”同样保留 ἐπιτιθέασιν ἐπὶ τοὺς ὤμους 的身体意象，且更符合现代庄重书面语体。
  revised_text: 他们把沉重的担子捆好，放在人们的肩上；自己却连用一根手指去动一动这些担子也不肯。
