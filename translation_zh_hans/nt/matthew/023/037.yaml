reference: Matthew 23:37
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: zh_hans
  text: 耶路撒冷啊，耶路撒冷啊！你杀害先知，又用石头打死那些奉差遣到你这里来的人！我多少次想把你的儿女聚集起来，就像母鸡[a]把小鸡聚集在自己的翅膀下，可是你们[b]不愿意！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母鸡”所译的希腊词也可泛指“鸟”；这里把幼雏聚在翅膀下的情景更具体地指向母鸡。
    reason: lexical_alternative
  - marker: b
    text: 原文这里的“不愿意”是复数，指耶路撒冷的儿女或居民；此前的“你”“你的”则是对拟人化的耶路撒冷所用的单数。
    reason: grammatical_clarification
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: 耶路撒冷啊，耶路撒冷啊
  rationale: 采用通行地名译法，保留重复呼告及哀叹语气；“啊”使呼格功能在现代汉语中自然显明。
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: 你杀害先知，又用石头打死
  rationale: 两个现在分词描写耶路撒冷一贯的特征。汉语用直接陈述承接呼告较自然；“用石头打死”准确表达 λιθοβολέω 的处死含义。
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: 那些奉差遣到你这里来的人
  rationale: 保留完成时被动分词的受差遣含义，并以第二人称延续对拟人化城市的直接呼告。
- source_word: ποσάκις ἠθέλησα
  choice: 我多少次想
  rationale: 保留次数之多的感叹以及 θέλω 所表达的真实意愿，不把它强化为预定或决定。
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: 把你的儿女聚集起来
  rationale: “儿女”自然表达性别兼容的 τέκνα，也保留城市与其居民之间的亲子比喻；“聚集起来”体现复合动词的汇聚意味。
- source_word: ὄρνις
  choice: 母鸡
  rationale: 该词可泛指鸟，但这里是把幼雏聚在翅膀下的母性意象，译作“母鸡”最符合具体语境，同时以脚注保留较广词义。
- source_word: τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: 把小鸡聚集在翅膀底下
  rationale: 以现代汉语自然呈现幼雏受翅膀遮护的图像，并保留原文空间关系。
- source_word: καὶ οὐκ ἠθελήσατε
  choice: 可是你们不愿意
  rationale: 同前面的 ἠθέλησα 一样用意愿词表达，保留“我想”与“你们不愿意”的鲜明对照；复数“你们”忠实反映动词的复数形式。
theological_decisions:
- issue: 耶稣的意愿与耶路撒冷居民的不愿之间的张力
  choice: 分别译为“我……想”和“你们不愿意”
  alternative: 将前者强化为“我已经决定”，或弱化为单纯的情感感叹
  rationale: 原文两次使用 θέλω，构成真实的意愿对照。译文保留这一张力，而不替文本裁定有关神圣旨意、人的责任或基督论的进一步争论。
- issue: “你的儿女”的身份
  choice: 保留“你的儿女”这一城市拟人化表达
  alternative: 解释为“你的居民”或限定为某一特定群体
  rationale: 原文没有进一步限定所指群体；保留亲子隐喻可避免超出文本作狭义解释。
- issue: 单数城市与复数对象的转换
  choice: 前文用单数“你”，末句用复数“你们”
  alternative: 全句统一译为单数或复数
  rationale: 希腊文先以单数形式向拟人化的耶路撒冷说话，末尾动词却是复数，指向其儿女或居民；保留转换能呈现原文的修辞与责任指向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。重复呼告和感叹号传达哀叹与责备；“奉差遣”保留经文语域，但整体句法避免文言化。
