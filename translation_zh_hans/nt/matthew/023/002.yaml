base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: zh_hans
  text: 说：“文士和法利赛人坐在摩西的座位上。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坐上了摩西的座位”，也可译：“已经坐在摩西的座位上。”“摩西的座位”指与摩西律法相关的教导权威。原文动词既可较中性地表示“坐在”，也可能侧重坐上或占据这一位置。
    reason: 保留动词时态、体貌及是否带有占据权威位置意味的不同理解，并说明原文的座位意象。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在时主动分词承接上一节并引出耶稣的话；汉语用“说”自然地保留这一衔接，不另行补出主语。
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: 在摩西的座位上
  rationale: ἐπί加属格在此表示占据某一席位；“摩西的座位”既保留原文意象，也可让上下文呈现其教导权柄的含义。
- source_word: ἐκάθισαν
  choice: 坐在
  rationale: 该不定过去时动词在此可描述坐上或占据一个席位。正文采用自然、中性的“坐在”，不把原文未明确表达的反身意味写入正文；完成或就任的可能意味在脚注中保留。
- source_word: οἱ γραμματεῖς
  choice: 文士
  rationale: 指熟悉并讲授律法的专业群体；“文士”是简洁且通行的圣经称谓，避免在正文中扩展为解释性称呼。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经中通行的群体名称音译。
theological_decisions:
- issue: ἐκάθισαν是中性地表示“坐在”，还是暗含“坐上、占据了”权威位置
  choice: 正文译作“坐在”，脚注保留“坐上了／已经坐在”的可能
  alternative: 译作“已经坐上摩西的座位”或“使自己坐在摩西的座位上”
  rationale: 希腊文主动形式本身没有明说“使自己坐下”，因此正文不加入明确的自封意味；同时，不定过去时和“摩西的座位”这一权威意象容许“坐上并占据该位置”的理解，故以脚注保存这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“文士”“法利赛人”沿用读者熟悉的通行称谓；保留“摩西的座位”这一具体意象，不在正文中直接释为“摩西的权威”，以免消除原文的比喻性和解释空间。
