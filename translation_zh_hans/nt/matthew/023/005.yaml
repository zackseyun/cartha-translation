id: MAT.23.5
reference: Matthew 23:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: zh_hans
  text: 但他们所做的一切，都是为了给人看；因为他们把经文匣[a]做宽，把衣穗[b]加长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经文匣”是内装经文段落的小皮匣；有些犹太人按照《申命记》6:8等经文佩戴它。
    reason: cultural_note
  - marker: b
    text: 或译“衣边的穗子”。参《民数记》15:38–39，其中吩咐以色列人在衣服边角做穗子。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: 他们所做的一切事
  rationale: 完整表达“他们全部的行为”，比直译为“他们一切的工作”更符合现代汉语，同时保留πάντα所强调的总体范围。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成转折，指出他们虽教导人，行事动机却有问题。
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: 都是为了给人看
  rationale: 保留目的结构及被人观看之意；“给人看”自然、直接，也不把ἄνθρωποι限于男性。
- source_word: φυλακτήρια
  choice: 经文匣
  rationale: 指内装经文、佩戴在身上的小匣。“经文匣”在中文中具体易懂，又避免采用可能暗示迷信用途的“护身符”。
- source_word: πλατύνουσι
  choice: 做宽
  rationale: 直接表达使之宽大的动作，并与经文匣的外观相合。
- source_word: κράσπεδα
  choice: 衣穗
  rationale: 在此犹太礼仪语境中指衣服边角上的穗子；“衣穗”比泛称“边饰”更具体。
- source_word: μεγαλύνουσι
  choice: 加长
  rationale: 该动词本义为使之变大；用于下垂的衣穗时，“加长”是自然且符合具体形态的汉语表达。
theological_decisions:
- issue: 如何表达犹太宗教服饰而不把批评指向这些物件本身
  choice: 正文采用中性的“经文匣”和“衣穗”，注释说明其经文背景
  alternative: 把φυλακτήρια译作“护身符”，或使用带贬义的描述
  rationale: 本节责备的是为了受人注目而夸大外观的动机，并非否定佩戴这些物件本身；中性名称可避免增添原文没有的反犹或贬抑意味。
- issue: μεγαλύνουσι用于衣穗时是泛指做大还是具体指加长
  choice: 译为“加长”
  alternative: 译为“做大”或“放大”
  rationale: “做大衣穗”在现代汉语中不自然；“加长”具体呈现衣穗被刻意做得更显眼的方式，同时不改变经文的核心批评。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“给人看”保留口语自然度，却不失经文责备的力度；两个文化专词均用脚注简要解释。
