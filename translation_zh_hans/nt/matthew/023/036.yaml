  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: zh_hans
  text: 我实在告诉你们，这一切[a]都要临到这一代人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这一切事”。希腊文为复数，直译是“所有这些事”。
    reason: lexical_alternative
  - marker: b
    text: “这一代人”也有人理解为“这类人”或更广义的不信世代；但希腊文最直接的意思是“这一代人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在“ἀμὴν λέγω ὑμῖν”这一郑重宣告公式中，ἀμήν用于强调话语真实可靠。“实在”既传达其郑重肯定的语气，也符合现代汉语表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 直接表达“我对你们说”的意思；与“实在”连用时，“我实在告诉你们”自然、庄重，并保留权威宣告的语气。
- source_word: ἥξει
  choice: 都要临到
  rationale: ἥκω的将来时在此表示前文所述之事将会来到并落在所指对象身上。“临到”能自然地与后面的ἐπί结构衔接，并保留审判语境的庄重感；“要”表达将来意义，“都”与“这一切”呼应。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 希腊文为中性复数，直指前文所说的各样事情。“这一切”是现代汉语中自然的总括说法；脚注注明其复数形式，避免把原文的信息完全隐去。
- source_word: ἐπὶ
  choice: 临到
  rationale: ἐπί接宾格，在这里与表示来到的动词合用，说明这些事将落到这一代人身上。汉语以“临到”整体表达这一关系，比机械译作“在……之上”自然。
- source_word: γενεὰν ταύτην
  choice: 这一代人
  rationale: γενεά在此最直接指“世代、同一代的人”。“这一代人”既符合汉语习惯，也保留原文直接的时间与群体指向，不把它解释性改写为“这个时代”或某种跨时代群体。
theological_decisions:
- issue: “这一代人”（γενεὰν ταύτην）的所指
  choice: 按原文直译为“这一代人”，不在正文中扩展其范围。
  alternative: 也有人将其理解为“这类人”、更广义的不信世代、跨时代的犹太民族，或“这个时代”。
  rationale: 希腊文最直接的表达是“这一代人”。译文不替读者裁定其末世论或群体范围，以保留经文本身的张力，并让上下文承担解释作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣郑重宣告的语气；“临到”符合审判语境，又不过度添加“惩罚”或“报应”等原文未明说的内容。脚注标记紧随各自所说明的词语。
