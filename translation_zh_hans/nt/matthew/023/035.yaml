id: MAT.23.35
reference: Matthew 23:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: zh_hans
  text: 好叫地上所流的一切义人的血都临到你们身上[a]，从义人亚伯的血起，直到巴拉加之子撒迦利亚的血[b]，就是你们在圣所和祭坛之间杀害的那位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”也可译作“这片土地上”。希腊词可指全地，也可指某一片土地。
    reason: lexical_alternative
  - marker: b
    text: “巴拉加之子撒迦利亚”的身份存在争议。有人认为他是先知撒迦利亚；也有人认为他是耶何耶大之子撒迦利亚（代下24:20–22）。正文依照希腊文本原样翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: 为要使
  rationale: 承接上文，保留目的与结果之间的语义张力；现代汉语中自然且庄重。
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: 归到你们身上
  rationale: 表达血债临到并由听者承担的审判含义；比直译“来到你们身上”更符合现代汉语习惯。
- source_word: πᾶν αἷμα δίκαιον
  choice: 一切义人的血
  rationale: 希腊文以“义”修饰“血”，属转喻用法；汉语译为“义人的血”可清楚表达无辜义人遭流的血，同时保留单数集合意义。
- source_word: ἐκχυννόμενον
  choice: 所流的
  rationale: 保留现在时被动分词对历代持续流血事件的概括，同时采用自然的汉语定语结构。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上
  rationale: γῆ可指全地或特定土地；正文取范围较广的“地上”，另一可能在脚注说明。
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: 从义人亚伯的血起
  rationale: 保留亚伯“义人”的称谓，并以“从……起”自然引出范围。
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: 直到比利家之子撒迦利亚的血
  rationale: 准确呈现ἀπό…ἕως的起讫结构，并照希腊文本保留父名。
- source_word: ὃν ἐφονεύσατε
  choice: 他就是你们……杀害的
  rationale: φονεύω带有非法夺命的强烈道德指控；“杀害”在现代汉语中自然，并非中性的“杀死”。
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: 在圣所和祭坛之间
  rationale: ναός特指圣殿核心的圣所，而非整个殿区；“圣所”比“圣殿”更精确。
theological_decisions:
- issue: “比利家之子撒迦利亚”的身份
  choice: 按希腊文本原样保留父名，不在正文中协调或改写。
  alternative: 将他认作先知撒迦利亚，或认作历代志下24:20–22所载耶何耶大之子撒迦利亚，并据此处理父名难题。
  rationale: 经文所指人物的具体身份存在争议；翻译应忠实呈现现存希腊文本，并在脚注中保留问题，而不替读者消除历史张力。
- issue: 血“归到你们身上”的含义
  choice: 保留承担血债及审判临到的表达，不进一步解释其机制。
  alternative: 明确改写为“你们要为……受惩罚”或“……的罪都要归给你们”。
  rationale: 原文使用血临到某人身上的司法性意象，并未在本句详述责任如何归算；正文不应增加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“为要使……都归到你们身上”保留目的／结果关系和审判意象；“圣所”准确区分ναός所指的殿内核心建筑与整个圣殿区域。所有脚注标记均已置于正文对应位置。
