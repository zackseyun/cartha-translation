  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: zh_hans
  text: 但凡高举自己的，必被降卑；凡使自己降卑的，必被高举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被降卑……被高举”也可译作“被压低……被举高”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: 凡……的
  rationale: 不定关系代词在这里表达适用于任何人的普遍原则；“凡……的”自然保留了格言式语气。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并带有轻微转折，“但”准确体现这一语篇作用。
- source_word: ὑψώσει ἑαυτόν
  choice: 高抬自己
  rationale: 既保留“抬高”的形象，也自然表达自我 exaltation 的含义。
- source_word: ταπεινωθήσεται
  choice: 必被降卑
  rationale: 保留将来意义和被动形式，不明说施事者，以维持原文可能暗含而未明言的神圣施事。
- source_word: ταπεινώσει ἑαυτόν
  choice: 使自己降卑
  rationale: 保留主动使役及反身结构，并避免把该词仅限于内在谦逊，使身份降低与谦卑态度两方面的含义仍有空间。
- source_word: ὑψωθήσεται
  choice: 必被高抬
  rationale: 保留被动形式，并与前句“高抬自己”形成原文中的词根呼应和鲜明对照。
theological_decisions:
- issue: 两个被动动词的施事者
  choice: 保留“被降卑”“被高抬”的被动表达，不点明施事者
  alternative: 译成“上帝必使他降卑／高升”
  rationale: 希腊文没有明说施事者。被动表达既允许读者理解为上帝的作为，也不把这一隐含意义直接写入正文。
- issue: 自我降卑的含义范围
  choice: 译作“使自己降卑”
  alternative: 译作“谦卑自己”
  rationale: “谦卑自己”较偏重内在品格；“使自己降卑”更贴近使役形式，并保留自愿居于卑微位置的社会与属灵层面。
- issue: 格言中阳性单数形式的普遍指向
  choice: 用不标性别的汉语结构“凡……的”
  alternative: 加入“他”来对应阳性单数
  rationale: 现代汉语无需以代词标示这一语法性别；“凡……的”准确传达该陈述代表任何人的普遍意义，并未改变其所指范围。
translation_notes:
  register: 采用现代、庄重而清楚的格言式表达。重复“高抬／降卑”以呈现原文两个词根交错反转的修辞；两个“必被”保留将来被动语气。
