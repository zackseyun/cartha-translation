  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: zh_hans
  text: 又喜欢人在集市上向他们问安，并称他们为“拉比”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: 问安
  rationale: 指公开场合中的致意、问候；“问安”简洁庄重，也能与本句所强调的受人尊崇相协调。
- source_word: ἀγοραῖς
  choice: 集市
  rationale: 指城镇中兼具交易与公共交往功能的市场或广场；“集市”自然易懂。
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: 人
  rationale: ἄνθρωποι在此泛指众人，而非特指男性；中文以“人”准确保留其普遍含义。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留这一犹太宗教称谓的音译；其基本意思是“我的老师”，但在此作为受人尊称的头衔。
theological_decisions:
- issue: “拉比”是否意译为“老师”
  choice: 保留音译“拉比”
  alternative: 老师／夫子
  rationale: 原文特意保留闪语称谓Ῥαββί；音译可保留其一世纪犹太语境以及作为尊称的色彩，不预先缩减为一般教师称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又喜欢”承接上文的动词语义，使作为残句提供的本节在中文中较为顺畅；引号使用中文弯引号。
