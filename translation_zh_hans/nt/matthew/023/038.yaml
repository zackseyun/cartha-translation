  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: zh_hans
  text: 看哪，你们的家将被留给你们，成为荒凉之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的家”也可理解为“你们的圣殿”；这句话可能特指圣殿，但希腊原文的表达范围更广。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 采用现代中文仍可理解、且带有庄严宣告意味的提示语，保留原文唤起注意的力量。
- source_word: ἀφίεται
  choice: 要留给
  rationale: 保留被动意味和“留给你们”的原文结构；结合语境，用“要”自然表达即将落实的审判宣告，同时不明确补出施事者。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 贴近与格表达，保留这家被留给他们的意味，不改写成较具解释性的“任凭你们”。
- source_word: ὁ οἶκος ὑμῶν
  choice: 你们的家
  rationale: 按原文字面保留“家”的宽泛隐喻，不在正文中限定为圣殿、耶路撒冷或以色列家。
- source_word: ἔρημος
  choice: 成为荒凉之地
  rationale: 表达被弃置、荒凉的审判图景；补入“成为”使后置形容词在现代汉语中自然，并保留其结果状态。
theological_decisions:
- issue: “你们的家”的所指
  choice: 正文保留“你们的家”
  alternative: 你们的圣殿；耶路撒冷；以色列家
  rationale: 上下文很可能指向耶路撒冷，尤其是圣殿，但希腊语 οἶκος 本身更宽泛。保留“家”可维持原文的隐喻空间和神学张力。
- issue: ἀφίεται 的时间与语态
  choice: 译作“要留给”，保留被动而以将来趋向表达审判宣告
  alternative: 正被留下；被遗弃
  rationale: 原文是现在时被动直陈式，可描写正在发生或确定临到的事。汉语“要留给”在此更自然，也避免用“被遗弃”过度强化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知性宣告的语气；正文维持简洁，并以脚注说明“家”可能特指圣殿。
