  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: zh_hans
  text: 但你们不要被人称为“拉比”[a]，因为你们的老师只有一位；你们都是弟兄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉比”是犹太人的称谓，意为“老师”。这里保留音译，以呈现犹太背景，并与本节后面的“老师”有所区别。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”译自阳性复数 ἀδελφοί；在这里可统指同作门徒的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: 不要让人称为
  rationale: 这是带 μή 的不定过去时被动虚拟式，在此构成禁令。“不要让人称为”既保留被动含义，也以自然的现代汉语表达耶稣的直接吩咐。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 希腊文本采用音译的犹太称谓。保留“拉比”可呈现历史和犹太背景，并避免与本节后面的 διδάσκαλος 都译成“老师”而抹去用词差异。
- source_word: εἷς
  choice: 只有一位
  rationale: εἷς 的基本意义是“一”。汉语若直译“你们的一位是老师”不自然；“只有一位”清楚表达这里由理由句和语境形成的单一性，同时不另行指明经文本身未明说的身份。
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: 你们只有一位老师
  rationale: 属格 ὑμῶν 表明这位老师与门徒的关系。译为“你们……老师”符合现代汉语习惯，并保留原文的关系性表达。
- source_word: πάντες δὲ ὑμεῖς
  choice: 你们彼此都是
  rationale: πάντες 与显出的 ὑμεῖς 强调全体门徒具有同等的群体身份。“彼此”自然呈现这种相互关系，“都是”保留全体性的强调。
- source_word: ἀδελφοί
  choice: 弟兄
  rationale: 该词是阳性复数，并以家庭关系比喻门徒群体。“弟兄”保留原文形式和庄重的经文语域；脚注说明在此可统指同作门徒的人。
theological_decisions:
- issue: 耶稣的禁令是绝对禁止一切人的尊称，还是针对门徒群体中的地位追求
  choice: 按原文保留直接禁令及其理由，不在译文中扩大或缩小其适用范围。
  alternative: 将其解释为绝对禁止所有类似称谓，或仅解释为谴责虚伪的求荣心。
  rationale: 本节明确禁止门徒被称为“拉比”，并以一位老师和众门徒彼此为弟兄作为理由，却没有详述后世各种称谓的具体适用原则。译文不应预先解决这一神学张力。
- issue: “一位老师”的身份
  choice: 不在正文中补出“基督”“神”或其他身份。
  alternative: 根据邻近经文或特定神学理解，明确补出这位老师是谁。
  rationale: 本节现有希腊文本仅说“你们的一位老师”，未在此句直接命名；译文保留这种指称方式，避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“拉比”保留历史语境；“老师”比“教师”更自然；“弟兄”保留家庭隐喻及原文阳性复数形式，并以脚注说明其语境范围。
