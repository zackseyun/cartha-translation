source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: zh_hans
  text: 你们有祸了，文士和法利赛人，假冒为善的人！因为你们走遍海洋和陆地，为要使一个人成为归信者[a]；他一成为归信者，你们就使他成为一个欣嫩谷之子[b]，比你们还要加倍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归信者”也可译作“改信者”或“入教者”；原文为“proselyte”，此处指归入犹太信仰群体的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“欣嫩谷之子”。“欣嫩谷”（Gehenna）也常译为“地狱”；这里保留原文术语及“……之子”的归属性表达。
    reason: historical_and_lexical_clarification
lexical_decisions:
- source_word: Οὐαὶ
  choice: 有祸了
  rationale: 保留先知式宣告审判的强烈语气，比单纯表达悲叹的“可悲啊”更符合上下文。
- source_word: γραμματεῖς
  choice: 律法教师
  rationale: 在现代汉语中清楚表达这一群体作为犹太律法学者和教师的身份；“文士”虽传统，但普通读者容易误解为一般抄写员或文人。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及相关文献中通行的群体名称。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 自然传达宗教与道德上的伪装和表里不一；比音译或表演意义的措辞更贴合此处。
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: 走遍海洋陆地
  rationale: 既保留海与陆的整体表达，也自然传达四处奔走、付出极大努力的含义。
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: 使一个人成为归信者
  rationale: προσήλυτος在此指归入犹太信仰群体的人；“归信者”较易懂，同时脚注保留传统术语。
- source_word: ὅταν γένηται
  choice: 他一成为归信者
  rationale: 把希腊文所省略但由上下文明确的身份补出，使汉语衔接自然，并保留单数所指。
- source_word: υἱὸν γεέννης
  choice: 欣嫩谷之子
  rationale: 保留γεέννα的历史和末世审判背景，并保留闪语式“……之子”的强烈归属表达，不直接将其扁平化为泛称的“地狱”。
- source_word: διπλότερον ὑμῶν
  choice: 比你们加倍严重
  rationale: 自然表达相对于受话者而言的双倍程度；“严重”补足汉语比较结构，但不另行规定这种程度具体指品格还是结局。
theological_decisions:
- issue: γεέννα的译法
  choice: 欣嫩谷
  alternative: 地狱
  rationale: 原文使用γεέννα，源自耶路撒冷附近的欣嫩谷，并在犹太末世语境中指向审判。正文保留其历史术语，脚注说明常见意译，避免把丰富背景直接归并为后来的泛称。
- issue: υἱὸν γεέννης的习语
  choice: 欣嫩谷之子
  alternative: 该下地狱的人
  rationale: 保留原文的闪语式亲属隐喻及其修辞力度，不把归属、性质或命运之间的张力单独解释成某一种。
- issue: διπλότερον的比较范围
  choice: 比你们加倍严重
  alternative: 比你们更该下双倍的地狱
  rationale: 原文明确表达双倍比较，却没有具体说明所比较的是邪恶程度、归属还是受审判程度，因此正文不作超出原文的限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“律法教师”替代容易被现代读者误解的传统称谓“文士”；保留“欣嫩谷之子”的陌生化表达，并由脚注提供必要背景。
