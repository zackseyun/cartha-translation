  naturalness: “走遍海洋陆地”在现代汉语中搭配略生硬，改为“走遍海洋和陆地”更自然。“使他成为一个欣嫩谷之子，比你们还要加倍”在汉语中虽保留原文修辞张力，也清楚表明比较落在“欣嫩谷之子”的程度上。
  terminology: “法利赛人”“假冒为善的人”恰当。“归信者”可保留，并以脚注说明“proselyte”的较贴近术语和本处的犹太语境。“欣嫩谷”可保留，以免直接以“地狱”取代γεέννα；脚注应称“地狱”为常见译法，而不称其为“意译”，并避免将该词在本节未明说的具体审判细节扩展进正文。
