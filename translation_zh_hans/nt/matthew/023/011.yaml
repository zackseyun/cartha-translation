  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: zh_hans
  text: 但你们中间最大的，要作你们的仆人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们中间较大的，要作你们的仆人。”希腊文使用比较级，但在这里可表示群体中地位最高的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成对比，指出耶稣的群体秩序与追求尊位相反。
- source_word: μείζων
  choice: 最大的
  rationale: 这是比较级，直译可作“较大的”，但在群体范围内可表达最高等级；现代汉语用“最大的”自然地传达此意，同时以脚注保留原文形式。
- source_word: ὑμῶν（第一个）
  choice: 你们中间
  rationale: 该属格表示整体中的一部分，指受话群体中居首位的人。
- source_word: ἔσται
  choice: 必作
  rationale: 表达将来时，同时保留这句话带有规范性和郑重性的语气；“作”与身份性的表语“仆人”搭配自然。
- source_word: ὑμῶν（第二个）
  choice: 你们的
  rationale: 表示 διάκονος 与受话群体的关系，即服事他们的人。
- source_word: διάκονος
  choice: 仆人
  rationale: 此处指服事别人的人，并非后来的教会职分；“仆人”清楚保留身份与地位倒转的力度。
theological_decisions:
- issue: 伟大与服事之间的地位倒转
  choice: “你们中间最大的，必作你们的仆人”
  alternative: “你们中间较大的，要作你们的服事者”
  rationale: 译文保留耶稣对地位观念的逆转：群体中居首位者以服事众人为其身份，不将 διάκονος 技术化为教会职分，也不削弱“最大”与“仆人”之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”明确承接上文的对比；“必作”简洁郑重；不用“执事”或“传道人”，以免误读为特定教会职分。
