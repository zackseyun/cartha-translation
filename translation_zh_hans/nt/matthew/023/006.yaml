  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: zh_hans
  text: 他们喜爱宴席上的首位[a][c]和会堂里的上座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首位”也可译作“席间最尊贵的位置”，指古代正式宴席中受尊崇者斜倚用餐的位置。
    reason: lexical_alternative
  - marker: b
    text: “上座”也可译作“首席”，原文强调地位最高或最优先的座位。
    reason: lexical_alternative
  - marker: c
    text: 古代地中海地区的宴席往往按身份高低公开安排席位，因此这里所批评的是对显赫地位的贪恋，并非只是追求舒适。
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: 喜爱
  rationale: 此处表示强烈的偏爱，而非盟约性或神学意义上的爱；“喜爱”自然直接，也保留耶稣批评的力度。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的承接词，延续上文对经学家和法利赛人行为的描述；现代汉语中省译更流畅，并不损失语义。
- source_word: πρωτοκλισίαν
  choice: 首位
  rationale: 指正式筵席中最尊贵的斜倚席位。“首位”简洁、庄重，能表达身份与尊荣的优先地位；古代进餐方式另以脚注说明。
- source_word: ἐν τοῖς δείπνοις
  choice: 宴席上
  rationale: δεῖπνον在本段社会地位的语境中指较正式、公开的聚餐或筵席；“宴席”比普通的“晚饭”更贴合语境。
- source_word: πρωτοκαθεδρίας
  choice: 上座
  rationale: 指地位最高、最受尊重的座位。“上座”是现代汉语中自然且能体现尊卑次序的表达。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂里
  rationale: 按其地点意义直接翻译；“会堂”在本书语境中指犹太人的聚会场所。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“首位／上座”形成对称，既贴近两个希腊复合词所共有的“居首”含义，又保留宴席与会堂两种场合各自自然的汉语说法。所有脚注标记均置于对应词语之后。
