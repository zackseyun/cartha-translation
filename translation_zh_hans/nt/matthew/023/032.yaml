  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: zh_hans
  text: 你们也把你们祖先的量度填满吧！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们也来把你们祖先的罪恶之量填满吧！”希腊文直译为“把你们祖先的量度填满”。这里以量器或定量被填至满额为喻，指累积的罪责达到限度。动词为命令式；在上下文中带有反讽和审判的意味。
    reason: 说明“量度”的另一种上下文性表达、原文隐喻，以及命令式的反讽性修辞力量。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上一节，并突出听者同其祖先行为之间的延续；汉语在此用“也”比直译为“并且”更自然。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 保留希腊文显明写出的第二人称复数及其强调意味。
- source_word: πληρώσατε
  choice: 去把……填满吧
  rationale: 保留不定过去时命令式的语法形式和“填满”的比喻；“去……吧”在现代汉语中可表达此处带讽刺、审判意味的命令，而不改写成预言。
- source_word: τὸ μέτρον
  choice: 分量
  rationale: 保留 μέτρον 所表达的量度、限额意象；与“填满”搭配，使累积至满额的比喻可辨。
- source_word: τῶν πατέρων ὑμῶν
  choice: 你们祖先的
  rationale: πατέρων 字面为“父辈”，但语境指杀害先知的先祖；“祖先”在现代汉语中准确自然，也避免误解为听者各自的亲生父亲。
theological_decisions:
- issue: 耶稣此言是命令，还是带预言意味的反讽
  choice: 按形态译作命令，并保留其反讽和审判语气
  alternative: 译成陈述或预言：“你们将要把……填满”
  rationale: πληρώσατε 是第二人称复数不定过去时主动命令式。正文因此不将其软化为单纯预言；同时，句末“吧”和脚注说明其并非赞许，而是谴责性的反讽。
- issue: “祖先的分量”所指为何
  choice: 正文保留凝练的量器比喻
  alternative: 在正文直接解释为“祖先罪恶的满额”
  rationale: 原文没有明说“罪恶”，虽上下文强烈指向累积的罪责，仍应把这一解释置于脚注，以保存原文的隐喻和张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祖先”比“父辈”更准确地传达上下文中的历代先人；正文保留“分量填满”的陌生化隐喻，脚注解释其罪责累积之意。句末感叹号反映严厉谴责的语气，不把命令误读为赞许。
