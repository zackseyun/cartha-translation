  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: zh_hans
  text: 那时，耶稣对众人和他的门徒说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 表示叙事的时间推进；“那时”自然、简洁，也保留与前文场景相接的作用。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 专有名词前的冠词属于希腊语常见叙事用法，现代汉语无需另行表达。
- source_word: ἐλάλησεν
  choice: 说
  rationale: λαλέω在这里指开口讲话；结合后文将引出直接话语，译作“说”最自然，且不额外加入“训诲”或“宣告”等语气。
- source_word: τοῖς ὄχλοις
  choice: 对众人
  rationale: ὄχλοις为复数，指聚集的人群；现代汉语用“众人”可自然涵盖多个群体，避免“群众”可能带有的现代政治语感。
- source_word: καὶ
  choice: 和
  rationale: 简单连接两个听众群体。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 他的门徒
  rationale: 准确表达复数名词μαθηταῖς及属格代词αὐτοῦ；“门徒”是福音书语境中自然且通行的对应词。
