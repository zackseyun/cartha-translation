reference: Matthew 23:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: zh_hans
  text: 凡指着圣殿起誓的，就是指着圣殿和住在其中的那一位起誓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指着圣殿……指着圣殿”也可直译为“在圣殿里……在其中”；希腊语介词原义是“在……里面”，但在这里的起誓用语中有“指着……起誓”的意思。
    reason: 保留介词ἐν的字面译法及其在起誓公式中的语境义。
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: 凡……起誓的
  rationale: 带冠词的不定过去时分词作名词使用，泛指任何这样起誓的人；“凡……的”自然保留其普遍性。
- source_word: ἐν τῷ ναῷ
  choice: 指着圣殿
  rationale: ἐν本义常为“在……里面”，但在本段起誓公式中表示起誓时所援引的对象；汉语习惯表达为“指着……起誓”。
- source_word: ναῷ
  choice: 圣殿
  rationale: ναός在此指耶路撒冷圣殿，尤其可侧重圣所；“圣殿”既符合上下文，也适合现代中文圣经语域。
- source_word: ὀμνύει
  choice: 就是……起誓
  rationale: 现在时陈述普遍成立的原则；加入“就是”清楚表达前后行为在效力上的关联。
- source_word: ἐν αὐτῷ
  choice: 指着圣殿
  rationale: αὐτῷ回指圣殿；为避免中文代词可能误指，重述“圣殿”，并按起誓公式译出ἐν。
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: 住在其中的那一位
  rationale: 现在时分词表达居住者；“那一位”自然指向上帝，同时不在正文中额外明说身份。“住在其中”保留圣殿作为上帝居所的意象。
theological_decisions:
- issue: 住在圣殿中的那一位的身份
  choice: 以“住在其中的那一位”含蓄指上帝
  alternative: 直译为“住在其中的人”或明译为“住在其中的上帝”
  rationale: 上下文清楚表明所指是上帝，但希腊正文没有在此直接写出“上帝”；译文既保留明确的尊称指向，也避免把隐含信息扩写进正文。
- issue: 指着圣殿起誓与指着上帝起誓的关系
  choice: 保留“就是……和……”的并列论断
  alternative: 解释为“等于也指着上帝起誓”
  rationale: 原文直接断言起誓所涉及的两个对象，未进一步阐释其法律或神学机制，因此不在译文中加以消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的”保留泛指语气；“指着……起誓”符合中文惯用表达。脚注标记[a]已置于正文对应句末。
