  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: zh_hans
  text: 愚昧瞎眼的人哪！因为究竟哪一个更大呢？是金子，还是使金子成圣[a]的圣殿[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使金子成为圣洁”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语ναός在这里也可较具体地指圣殿的主体建筑或圣所。
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: 愚昧的人
  rationale: 这是复数呼格，用于直接斥责。“愚昧”保留原文的强烈责备，又避免采用带现代辱骂或医学色彩的词。与下文“瞎眼”合并为自然的汉语称呼“愚昧瞎眼的人哪”。
- source_word: τυφλοί
  choice: 瞎眼的人
  rationale: 同为复数呼格，指受斥责的具体对象；“瞎眼”在此保留原文具有比喻意味的尖锐表达。
- source_word: τίς γὰρ μείζων ἐστίν
  choice: 因为究竟哪一个更大呢
  rationale: τίς是在两个明确对象之间发问，译作“哪一个”；γάρ具有解释、论证作用，译作“因为”；“究竟……呢”使反问在现代汉语中自然有力。
- source_word: ὁ χρυσὸς
  choice: 金子
  rationale: 所指是上下文中谈到的特定金子；汉语无需机械添加指示词，也能由语境表达其特指性。
- source_word: ὁ ναὸς
  choice: 圣殿
  rationale: ναός可特指圣殿主体或圣所。“圣殿”既符合此处耶路撒冷圣殿的语境，也比单译“殿”更清楚；其较窄的可能含义以脚注说明。
- source_word: ὁ ἁγιάσας
  choice: 使……成圣
  rationale: 保留ἁγιάζω赋予神圣地位的礼仪性含义。希腊语不定过去时分词在这里说明圣殿使金子成为圣洁的根据；汉语不强行加入一次性过去时标记，以免把普遍论证窄化为单一历史事件。
- source_word: τὸν χρυσόν
  choice: 金子
  rationale: 重复“金子”，对应原文的明确宾语，并保留问句两端的修辞呼应。
theological_decisions:
- issue: 圣殿语境中ἁγιάζω的译法
  choice: 使金子成圣
  alternative: 使金子成为圣洁；把金子分别为圣
  rationale: “成圣”简洁地保留原文关于神圣地位的礼仪和神学含义，却不额外说明其具体机制；脚注提供更通俗的释义。
- issue: ναός所指的范围
  choice: 圣殿
  alternative: 圣所
  rationale: “圣殿”便于普通读者理解，也符合上下文；同时以脚注保留ναός可能较具体地指圣殿主体或圣所的语义范围。
translation_notes:
  register: 采用现代、庄重而有力度的直接斥责语气。“人哪”自然体现呼格；问句分为总问与二选一的具体问项，使论证清晰。保留γάρ的解释作用，并避免用过分古雅或带宗派色彩的措辞。
