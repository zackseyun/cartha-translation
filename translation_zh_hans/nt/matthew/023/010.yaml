id: MAT.23.10
reference: Matthew 23:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: zh_hans
  text: 也不要让人称你们为“导师”，因为你们的导师只有一位，就是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: 也不要
  rationale: 承接上文一连串禁令；用“也不要”保留连接关系，并符合现代汉语表达。
- source_word: κληθῆτε
  choice: 让人称你们为
  rationale: 该被动式在此指接受某种称号；汉语用使动式更自然，也保留了“被如此称呼”的意义。
- source_word: καθηγηταί / καθηγητής
  choice: 导师
  rationale: καθηγητής可指引导并教导人的人。“导师”兼具指导和教导之意，也避免与邻近经文中的διδάσκαλος简单合并为同一个“教师”称谓。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出禁令的理由，现代汉语自然清楚。
- source_word: ὑμῶν ἐστιν εἷς
  choice: 你们的导师只有一位
  rationale: 以自然汉语表达所属关系，并保留εἷς所强调的唯一性。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 定冠词表明此处作为称号使用；“弥赛亚”传达“受膏者”的犹太背景。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处ὁ χριστός明显作为称号，译作“弥赛亚”可显明其称号意义和犹太语境；脚注保留教会传统中常用的“基督”。
- issue: 唯一导师的句法强调
  choice: 你们的导师只有一位
  alternative: 一位是你们的导师
  rationale: 选择符合现代汉语习惯的表达，同时保留原文对“一位”的强调，不进一步解释这项禁令的适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“导师”保留指导与教导两方面含义；引号标示其作为称号的用法。
