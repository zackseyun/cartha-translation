id: MAT.23.39
reference: Matthew 23:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: zh_hans
  text: 因为我告诉你们：从今以后，你们绝不会再见到我，直到你们说[a]：‘奉主名来的是当受称颂的！’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到你们说”表示将来的界限或条件；原文没有说明这句话将在何时、何种事件中说出。
    reason: theological_ambiguity
  - marker: b
    text: 引自《诗篇》118:26。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: 保留γάρ承接上文哀叹与审判宣告的解释作用；“我告诉你们”是自然、庄重的现代汉语表达。
- source_word: οὐ μή
  choice: 绝不会
  rationale: οὐ μή与虚拟语气构成强烈否定；“绝不会”清楚传达其强调力度，又不把时间含义绝对化为脱离后续“直到”的“永远不会”。
- source_word: με ἴδητε
  choice: 见到我
  rationale: ἴδητε源自ὁράω，此处指看见、见到；“见到我”比“看见我”更自然地表达未来再次相见。
- source_word: ἀπ’ ἄρτι
  choice: 从今以后
  rationale: 准确表达以当前时刻为起点的时间范围，并符合庄重的现代汉语。
- source_word: ἕως ἂν εἴπητε
  choice: 直到你们说
  rationale: 保留ἕως ἄν加虚拟语气所标示的未来界限或条件，不额外规定其发生的具体历史或末世时点。
- source_word: Εὐλογημένος
  choice: 当受称颂的
  rationale: 在这一肖似诗篇的欢呼语中，表达对来者的祝颂；既保留经文语感，也避免“有福的”可能造成的被动受福歧义。
- source_word: ὁ ἐρχόμενος
  choice: 来的是
  rationale: 忠实表达带冠词的分词，同时采用简洁自然的汉语结构；不强化为特定称号“那将要来者”。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名
  rationale: “奉……名”自然表达凭其权柄、代表其而来的含义，并保留“主”对κύριος的常规译法。
theological_decisions:
- issue: 将来“见到”与说出祝颂之语所指的事件
  choice: 不在译文中限定具体时点，只保留不再见到直至说出该话的宣告
  alternative: 明确解释为凯旋进城、第二次降临，或以色列将来的悔改
  rationale: 原文没有明确界定这一时刻或事件；直译其时间界限，保存经文本身的神学张力。
- issue: “奉主名来的”是否作为专门的弥赛亚称号
  choice: 保留诗篇引语的普通关系从句形式
  alternative: 译作带有明确称号意味的“那位要来的”
  rationale: ὁ ἐρχόμενος可以在语境中具有弥赛亚意蕴，但本句直接引用诗篇，译文不宜把可能的称号意味强化为唯一解释。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。“绝不会”体现原文的强烈否定；引语采用有经文韵律但不古奥的表达。所有脚注标记均置于正文相应位置。
