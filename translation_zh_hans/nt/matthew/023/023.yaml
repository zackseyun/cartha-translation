reference: Matthew 23:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: zh_hans
  text: “经学家和法利赛人，你们这些假冒为善的人有祸了！因为你们连薄荷、莳萝和孜然也取十分之一来奉献，却忽略了律法中更重大的事，就是公正、怜悯和信实[a]。这些是你们应当行的，那些也不可忽略。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信心”。这里的希腊词可以表示信、信靠，也可以表示忠信或信实；在本节的伦理语境中，许多人理解为忠信。
    reason: 保留πίστις在此处“信心”与“信实”之间的词义歧义。
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 你们……有祸了
  rationale: 保留先知性谴责与审判警告的力度；比单纯表达哀叹更符合本段语境。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指熟悉并讲授律法的犹太宗教人士；“经学家”在现代汉语中比“文士”更易理解，也不把含义扩展为泛称教师。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 表达此处伦理意义上的虚伪与伪善，符合现代汉语习惯。
- source_word: ἀποδεκατοῦτε
  choice: 献上十分之一
  rationale: 明确表达按十分之一缴纳或奉献的具体行为，并保留其律法与宗教背景。
- source_word: τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον
  choice: 薄荷、莳萝和孜然
  rationale: 采用这些香草与香料在现代标准汉语中的通行名称。
- source_word: ἀφήκατε
  choice: 忽略了
  rationale: 此处表示把应做之事搁置不顾；“忽略”自然地传达责备语气。
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: 律法中更重大的事
  rationale: βαρύτερα以重量比喻重要程度；“更重大”既保留一定的重量意象，也符合自然汉语。
- source_word: τὴν κρίσιν
  choice: 公正
  rationale: 在伦理要求的并列结构中，指按正义待人，而非单指作出判决的行为。
- source_word: τὸ ἔλεος
  choice: 怜悯
  rationale: 准确表达对困苦者施予慈悲和仁爱的伦理要求，并保留圣经语体。
- source_word: τὴν πίστιν
  choice: 信实
  rationale: 在“公正、怜悯”这一伦理并列语境中，πίστις较可能指忠信、可靠地尽责；同时以脚注保留“信心”的可能译法。
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: 这些是你们应当行的，那些也不可忽略
  rationale: 分别保留ταῦτα与κἀκεῖνα的指示关系：前者指公正、怜悯、信实，后者指献上香草的十分之一；也保留两者并非彼此排斥的张力。
theological_decisions:
- issue: 伦理并列语境中πίστις的含义
  choice: 信实
  alternative: 信心
  rationale: 该词可表示信、信靠，也可表示忠信或可靠；本节将其与公正、怜悯并列为律法的伦理要求，因此正文采用“信实”，但不排除“信心”，并在脚注中注明。
- issue: 耶稣对献十分之一与更重大律法要求之间关系的表述
  choice: 这些是你们应当行的，那些也不可忽略
  alternative: 只突出更重大的要求而弱化后半句
  rationale: 原文同时责备忽略更重大的事，又明确说较细微之事也不应撇下；译文保留这一神学与伦理张力，不替原文判定其后续适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经学家”避免“文士”可能造成的古雅与职业误解；“有祸了”保留强烈的审判警告；整体句式适合公开诵读。
