  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: zh_hans
  text: “你们有祸了，瞎眼的向导！你们说：‘谁指着圣殿起誓，所起的誓言就不算什么[a]；谁指着圣殿的金子起誓，就有义务履行所起的誓言。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“什么也不是”；这里指这种誓言被视为没有约束力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知性谴责和审判警告的语气；比单纯表示悲叹的“可叹”更符合本段语境。
- source_word: ὁδηγοὶ τυφλοὶ
  choice: 瞎眼的向导
  rationale: 直接保留“引路者自己却看不见”的鲜明比喻；“向导”比泛称“领袖”更贴近ὁδηγοί。
- source_word: οἱ λέγοντες
  choice: 你们说
  rationale: 将带冠词的分词结构按现代汉语自然转为承接前一呼语的陈述。
- source_word: Ὃς ἂν ὀμόσῃ
  choice: 凡……起誓的
  rationale: 表达关系代词加ἄν和虚拟式所构成的泛指条件，兼顾准确与汉语习惯。
- source_word: ἐν τῷ ναῷ
  choice: 指着圣殿起誓
  rationale: ἐν字面可译“在……里”，但在此誓言公式中表示援引圣殿作为起誓凭据；“指着……起誓”是自然、明确的现代汉语表达。
- source_word: οὐδέν ἐστιν
  choice: 不算什么
  rationale: 保留原文简短而省略的说法，同时在汉语中自然传达这种誓言被视为不具约束力。
- source_word: χρυσῷ τοῦ ναοῦ
  choice: 圣殿的金子
  rationale: 直接呈现属格关系，并清楚保留圣殿与其金子之间的对比。
- source_word: ὀφείλει
  choice: 必须履行誓言
  rationale: 该词表示负有义务；结合起誓语境，将省略的义务内容补明，使现代读者能立刻理解此句所说的约束力。
theological_decisions:
- issue: 誓言约束力的省略表达
  choice: 首句译为“不算什么”，次句译为“必须履行誓言”
  alternative: 两处都保留更生硬的省略形式，如“什么也不是……就欠着了／有义务了”
  rationale: 原文以οὐδέν ἐστιν和ὀφείλει形成简短对照，批评人为划分誓言是否有效的诡辩。译文保留第一句的简洁，同时按语境补明第二句所负的义务，不把经文扩展为某一宗派的誓言教义。
- issue: ἐν τῷ ναῷ的空间义与誓言公式义
  choice: 正文采用“指着圣殿起誓”，脚注保留“在圣殿里起誓”的字面可能
  alternative: 正文直译为“在圣殿里起誓”
  rationale: 上下文将圣殿与圣殿的金子并列为起誓所援引的对象，因此公式义最符合语境；脚注仍呈现介词结构的字面形式，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们有祸了”保留审判性警告；“瞎眼的向导”保留原文比喻；引语中的“凡……的”形成简洁、对称的规条式表达。
