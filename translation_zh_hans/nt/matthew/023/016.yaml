  to: “你们有祸了，瞎眼的向导！你们说：‘谁指着圣殿起誓，所起的誓言就不算什么[a]；谁指着圣殿的金子起誓，就有义务履行所起的誓言。’”
  rationale: 为消除中文中“不算什么”的悬空指代，正文补出“所起的誓言”，并在第二分句对应地补出履行对象。此修订只明示希腊文在誓言语境中已蕴含的内容，未改变两种誓言被区别对待的批评性对照。脚注重新编号，使实际锚点与脚注一致；空间义的替代译法保留为脚注b。
