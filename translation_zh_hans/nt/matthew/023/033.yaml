  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: zh_hans
  text: 蛇啊，毒蛇的后代！你们怎能逃脱革赫拿[a]的审判？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “革赫拿”：希腊文为Gehenna；该名称与欣嫩谷有关，常译作“地狱”。
    reason: 保留原文术语及其历史背景，并说明常见译法。
lexical_decisions:
- source_word: ὄφεις
  choice: 蛇
  rationale: 作呼格，直接而强烈地斥责对方；“蛇”是现代汉语自然、准确的对应。
- source_word: γεννήματα
  choice: 后代
  rationale: 表达“所生的、后裔”之意，并保留名词加属格的结构关系；比传统的“种类”更直接反映原文。
- source_word: ἐχιδνῶν
  choice: 毒蛇
  rationale: 指蝰蛇一类的毒蛇；现代普通读者对“毒蛇”更易理解，也保留了比一般“蛇”更强的意象。
- source_word: πῶς
  choice: 怎能
  rationale: 引出带有强烈否定意味的修辞问句，既表达逃脱的可能性受到质疑，也不把句子改写成直陈断言。
- source_word: φύγητε
  choice: 逃脱
  rationale: 此处指从审判中逃开、免受其后果；“逃脱……审判”符合现代汉语搭配。
- source_word: κρίσεως
  choice: 审判
  rationale: 保留该词宽泛的司法意义，不预先收窄为“定罪”或“刑罚”。
- source_word: γεέννης
  choice: 欣嫩谷
  rationale: 音义背景上对应源自希伯来地名的“Gehenna”，保留其犹太历史与末世审判背景；脚注说明常见意译。
theological_decisions:
- issue: γέεννα的译法
  choice: 欣嫩谷
  alternative: 地狱
  rationale: 原文使用具有特定犹太背景的γέεννα。正文保留其地名来源，避免将后世关于“地狱”的全部观念未经说明地带入；脚注给出常见意译。
- issue: πῶς φύγητε的语气
  choice: 你们怎能逃脱
  alternative: 你们将怎样逃脱
  rationale: 原句是面向未来审判的修辞问句。“怎能”在现代汉语中自然传达逃脱几无可能的责问，但仍保留问句形式，不改写为绝对断言。
translation_notes:
  register: 采用现代、庄重且有力度的汉语。首句保留原文重复递进的辱斥意象；第二句以自然的修辞问句呈现审判警告。
