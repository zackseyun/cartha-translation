  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: zh_hans
  text: 这样，你们就指证自己是那些杀害先知之人的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向自己作见证。”希腊文按字面可这样理解；在本段语境中，这见证却成为对他们自己的指证。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 这样
  rationale: 承接上文并引出由其言行所得出的结论；“这样”在现代汉语中自然，也保留推论意味。
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: 指证自己
  rationale: 字面可理解为“向自己作见证”，但语境中该见证使他们自陷其罪；“指证自己”简洁地表达这种自我归罪的语用效果，同时以脚注保留字面可能。
- source_word: ὅτι
  choice: 是
  rationale: 引出见证的具体内容，而非原因。
- source_word: υἱοί
  choice: 子孙
  rationale: 此处既涉及与杀害先知者的血缘承继，也暗含行为和立场上的延续。汉语“子孙”保留男性家族称谓与世代关系，比单用“儿子”更自然地指向祖辈的后代。
- source_word: τῶν φονευσάντων
  choice: 那些杀害……之人
  rationale: 分词指以杀害先知这一既成行为来识别有关的人；“杀害”明确表达不义夺命，且符合庄重语体。
- source_word: τοὺς προφήτας
  choice: 先知
  rationale: 准确保留以色列历史中上帝使者这一特定群体的称谓。
theological_decisions:
- issue: υἱοί应按字面译作“儿子”，还是按此处的亲属和承继含义译作“子孙”。
  choice: 子孙
  alternative: 儿子；后代
  rationale: 希腊文的阳性亲属称谓具有修辞力度，但这里所指的是杀害先知者的后世子孙，而非直接父子关系。“子孙”既保留男性家族语言，也自然涵盖血缘延续，并容纳语境所暗示的道德连带；不将这种连带扩写为原文没有明说的解释。
- issue: μαρτυρεῖτε ἑαυτοῖς是否应明确译成不利于自己的见证。
  choice: 指证自己
  alternative: 向自己作见证；为自己作证
  rationale: 与上下文的责备相合，见证在语用上使听者自陷其罪。不过，因与格ἑαυτοῖς本身可较字面地理解为“向自己”，故以脚注保留该歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那些杀害先知之人的子孙”保留原句的家族关系和控诉力度；主句用“指证自己”避免生硬直译，并通过脚注呈现原文表达的字面层面。
