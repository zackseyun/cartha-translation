source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: zh_hans
  text: 耶稣弥赛亚的诞生是这样的：他的母亲马利亚已经许配给约瑟[a]，两人还没有同房[b]，马利亚就被发现已经怀孕；她所怀的孕是从圣灵而来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许配”指正式、受法律和社会认可的婚约，比现代一般所说的“订婚”更有约束力。
    reason: cultural_note
  - marker: b
    text: “同房”直译可作“在一起”；这里按上下文指婚姻中的性结合。
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: 诞生
  rationale: 在本节的叙事语境中，指耶稣的出生或来到世上的经过；“诞生”自然、庄重，也与下文相合。
- source_word: Ἰησοῦ χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在这里具有称号意义；译作“弥赛亚”可保留其“受膏者”的身份内涵，而不将其处理成姓氏。
- source_word: οὕτως ἦν
  choice: 是这样的
  rationale: 这是引出事情经过的惯用表达；简洁地保留了原文说明方式的功能。
- source_word: μνηστευθείσης
  choice: 已经许配
  rationale: 指正式且具有约束力的婚约关系。“许配”比现代的“订婚”更能体现当时的法律和社会含义。
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: 两人还没有同房
  rationale: συνέρχομαι本义可为“在一起”，此处语境委婉指向婚姻的性结合。中文“同房”既保留委婉语气，也自然表达该含义。
- source_word: εὑρέθη
  choice: 被发现
  rationale: 保留原文被动结构，不增添是谁发现或如何发现等原文未说明的信息。
- source_word: ἐν γαστρὶ ἔχουσα
  choice: 怀了孕
  rationale: 这是该希腊语习语在现代汉语中的自然表达。
- source_word: ἐκ πνεύματος ἁγίου
  choice: 是从圣灵而来的
  rationale: ἐκ表示来源；此译法明确把怀孕的来源归于圣灵，同时保留原文的来源关系。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本叙事开头着重表明耶稣的身份称号，译出“弥赛亚”能让普通读者看见该词的称号意义；“基督”是传统音意转译形式，故列为脚注中的可选译法。
- issue: πνεύματος ἁγίου的所指
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 在马太福音降生叙事中，该短语指上帝的圣灵；希腊语没有冠词并不要求将其理解为不定的某种灵。
- issue: συνελθεῖν的含义范围
  choice: 同房
  alternative: 在一起／共同生活
  rationale: 原词本身可泛指聚在一起，但此处婚约与怀孕的语境使婚姻结合、尤其圆房的含义最为自然；采用委婉的中文表达，避免粗直，也不额外发展教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。“诞生”“许配”“同房”兼顾叙事尊严与普通读者的可理解性；未添加原文没有的时间副词。“马利亚”重复名词而不单用“她”，使较长句子的指向在中文中更清楚。
