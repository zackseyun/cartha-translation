  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: zh_hans
  text: 所罗门生罗波安，罗波安生亚比雅，亚比雅生亚萨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“亚撒”，与《列王纪上》15章及《历代志下》14—16章所记的犹大王同名；这里采用的希腊正文作“亚萨”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在父系家谱中表示生育或成为后代之父；“生”是现代汉语家谱最简洁、自然的表达，也保留了原文重复句式。
- source_word: δὲ
  choice: 不单独译出，以逗号连接
  rationale: 此处是家谱链条中的轻微承接语气，并非转折；汉语用并列分句自然表达连续关系，无须逐次译作“又”或“而”。
- source_word: Σολομών
  choice: 所罗门
  rationale: 采用现代中文圣经与历史文化语境中通行的人名译法。
- source_word: Ῥοβοάμ
  choice: 罗波安
  rationale: 采用现代中文圣经中通行的人名译法，与旧约人物名称保持可识别的连续性。
- source_word: Ἀβιά
  choice: 亚比雅
  rationale: 采用对应希伯来王名的通行中文译法，便于读者识别其与旧约人物的关联。
- source_word: Ἀσάφ
  choice: 亚萨
  rationale: 严格按所给SBLGNT正文的Ἀσάφ翻译，不在正文中将其协调为犹大王亚撒；异文另以脚注说明。
theological_decisions:
- issue: 是否为配合旧约犹大诸王名单而把Ἀσάφ译作“亚撒”
  choice: 正文保留“亚萨”
  alternative: 正文译作“亚撒”
  rationale: 所给希腊正文明确为Ἀσάφ，因此按原文优先原则保留“亚萨”，不作无说明的协调；同时用脚注呈现“亚撒”异文及其旧约背景。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，并保留原文家谱式的三重平行结构。脚注标记紧随存在异文的人名“亚萨”，以免误指“罗波安”。
