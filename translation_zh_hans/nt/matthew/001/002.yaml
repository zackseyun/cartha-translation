translation:
  language: zh_hans
  text: 亚伯拉罕生了以撒[a]；以撒生了雅各；雅各生了犹大和他的弟兄们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伯拉罕作以撒的父亲。”希腊文这个动词在家谱中也可较正式地译为“作……的父亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生了
  rationale: 在家谱语境中，γεννάω表示男性生育或成为某人的父系祖先。“生了”是现代汉语圣经家谱中自然、简洁的表达，保留父系谱系作用，同时不强行限定为紧邻的一代。
- source_word: δὲ
  choice: 以分号衔接，不另译
  rationale: 此处δέ是轻微的承接词，并非强烈转折。汉语用分号自然呈现家谱逐代推进，若逐一译作“又”或“而”反显累赘。
- source_word: Ἰούδαν
  choice: 犹大
  rationale: 这里指族长雅各之子犹大；“犹大”是现代汉语中这一旧约人物的标准译名。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: 他的弟兄们
  rationale: ἀδελφούς为阳性复数，此处特指犹大的男性兄弟，即雅各的其他儿子。“弟兄们”准确保留其性别和家族语境。
- source_word: Ἀβραὰμ / Ἰσαὰκ / Ἰακώβ
  choice: 亚伯拉罕／以撒／雅各
  rationale: 采用现代简体中文圣经中通行且易于辨认的人名译法。
theological_decisions:
- issue: 家谱动词的译法
  choice: 全文用“生了”
  alternative: 译作“作……的父亲”或“成为……的父亲”
  rationale: “生了”保留希腊文的父系家谱重点，且符合自然、庄重的现代汉语；脚注说明该词也可表达“成为……的父亲”，避免把谱系关系无意中限定为必然直接相邻的父子关系。
translation_notes:
  register: 采用现代、庄重而易懂的家谱体。以分号区分逐代关系，使重复结构清楚流畅；保留“弟兄们”以准确指男性兄弟。
