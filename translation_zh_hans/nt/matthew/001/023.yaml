  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: zh_hans
  text: “看哪，那童贞女[a]将要怀孕，生一个儿子；人们要称他为以马内利[b]。”（“以马内利”翻译出来就是“上帝与我们同在”。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “童贞女”也可译为“年轻女子”。但在马太福音的语境中，希腊文παρθένος及其周围的出生叙事支持译作“童贞女”。
    reason: lexical_alternative
  - marker: b
    text: “以马内利”也可音译为“厄玛奴耳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知引文中唤起注意的语气，同时符合庄重而易懂的现代汉语表达。
- source_word: ἡ παρθένος
  choice: 那童贞女
  rationale: παρθένος在马太叙述耶稣非同寻常的受孕这一语境中指童贞女；定冠词译作“那”，也符合引文对特定人物的指称。
- source_word: ἐν γαστρὶ ἕξει
  choice: 将要怀孕
  rationale: 这是希腊语“腹中有”的习语，现代汉语自然对应为“怀孕”，并保留将来时意义。
- source_word: τέξεται υἱόν
  choice: 生一个儿子
  rationale: 直接、自然地表达分娩及宾语关系，不增添原文没有的信息。
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: 人们要称他的名为
  rationale: καλέσουσιν是未明确主语的第三人称复数；“人们”保留其泛指性质，避免改成被动句或指定某一主体。
- source_word: Ἐμμανουήλ
  choice: 以马内利
  rationale: 采用现代中文圣经传统中通行且易辨识的音译。
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: 翻译出来就是
  rationale: 以自然现代汉语表达解释性分词结构，并清楚引出名字的含义。
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: 上帝与我们同在
  rationale: 准确传达名字的解释，保持其神学分量而不扩展为道理性释义。
theological_decisions:
- issue: 在童贞受孕语境中如何翻译παρθένος
  choice: 童贞女
  alternative: 年轻女子
  rationale: 在马太福音第一章的直接叙事语境中，παρθένος与非同寻常的受孕相呼应，主文译作“童贞女”最符合希腊文本；不以《以赛亚书》希伯来词的争议取代马太此处的希腊用词。
- issue: “以马内利”含义的表达
  choice: 上帝与我们同在
  alternative: 与我们同在的是上帝
  rationale: 采用清楚自然的中文直陈其名义，不进一步加入“道成肉身”等虽相关但本节未明说的神学阐释。
- issue: καλέσουσιν的未定复数主语
  choice: 人们要称
  alternative: 他的名要称为
  rationale: 保留原文主动语态及泛指复数，不把称名者限定为约瑟、马利亚或其他特定群体。
translation_notes:
  register: 采用庄重、自然、适合公开诵读的现代标准普通话。“看哪”保留先知引文的提升语体；其余句式避免古奥化。引号和括注清楚区分引文、名字及马太的解释。
