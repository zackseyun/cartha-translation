  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: zh_hans
  text: 所罗巴伯生亚比玉[a]，亚比玉生以利亚敬，以利亚敬生亚所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为……的父亲”。圣经家谱有时会省略若干代，因此这里反复使用的“生”可以概括谱系关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: 所罗巴伯
  rationale: 按现代中文圣经通行形式音译人名，并与同一历史人物的惯用名称保持一致。
- source_word: δέ
  choice: — / 后两分句以逗号连接
  rationale: 在家谱中，δέ只是推进名单的轻微连接词，并不表示明显转折；中文用并列分句自然呈现其连续性，无须逐次译为“又”或“而”。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在父系家谱公式中表示生育或谱系承接。“生”简洁、庄重，符合现代中文家谱表达，同时不强行断定每一代都必为直接父子关系。
- source_word: Ἀβιούδ
  choice: 亚比玉
  rationale: 采用现代中文圣经中较通行的音译形式。
- source_word: Ἐλιακίμ
  choice: 以利亚敬
  rationale: 采用现代中文圣经通行人名形式，也便于与旧约同名人物的译名对应。
- source_word: Ἀζώρ
  choice: 亚所
  rationale: 采用现代中文圣经中常见的音译形式，避免加入原文没有的释义。
theological_decisions:
- issue: 家谱中的 γεννάω 是否必然指直接父子关系
  choice: 生
  alternative: 是……的祖先 / 生了
  rationale: “生”保留希腊文反复使用的家谱公式及其直接性，但圣经家谱有时会压缩世代，因此不在正文中将其明确解释为每一环都相隔一代；脚注提示这种真实的语义范围。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。保留家谱的重复节奏；人名使用简体中文圣经读者较熟悉的传统音译。
