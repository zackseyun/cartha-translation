id: MAT.1.10
reference: Matthew 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: zh_hans
  text: 希西家生玛拿西；玛拿西生阿摩司[a]；阿摩司生约西亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本在这里作“亚们”，使这个名字与《列王纪下》21章中的犹大王一致；《马太福音》的希腊文本作“阿摩司”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在家谱中表示生育或父系传承。现代汉语家谱惯用“生”，简洁自然，也不把原文扩展成较为解释性的“作……的父亲”。
- source_word: Ἑζεκίας
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Μανασσῆς
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Ἀμώς
  choice: 阿摩司
  rationale: 按SBLGNT正文的希腊名称Ἀμώς翻译，不在正文中将其协调为旧约犹大王的名字“亚们”。
- source_word: Ἰωσίας
  choice: 约西亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: δέ
  choice: 分号承接
  rationale: 在重复的家谱句式中，δέ用于推进名单；中文以分号自然呈现各代之间的承接关系，无须机械重复“又”或“然后”。
theological_decisions:
- issue: 马太希腊文本中的名字与旧约王名不同
  choice: 正文采用希腊文本所写的“阿摩司”
  alternative: 采用“亚们”，与《列王纪下》21章及《历代志下》33章中的犹大王名协调
  rationale: 原文优先于后来的协调处理。SBLGNT正文在此作Ἀμώς，因此正文保留“阿摩司”；同时用脚注说明读者熟悉的“亚们”，不悄然消除文本张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以分号划分三代，符合中文家谱列举的节奏；脚注标记紧随存在异名问题的“阿摩司”。
