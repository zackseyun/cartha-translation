  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: zh_hans
  text: 被掳到巴比伦之后[a]，耶哥尼雅生了撒拉铁；撒拉铁生了所罗巴伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦流亡之后”。这里的希腊语指民众被迫迁离故土，被迁往巴比伦流亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: 之后
  rationale: μετά加宾格表示时间上的“在……之后”；δέ是轻微承接词，汉语在此无需另译，也能自然衔接上文。
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: 被掳迁到巴比伦
  rationale: μετοικεσία指被迫迁移、放逐。“被掳迁到巴比伦”既明确迁移并非自愿，也符合家谱所指的历史事件；“流亡巴比伦”作为可行译法列入脚注。
- source_word: Ἰεχονίας
  choice: 耶哥尼雅
  rationale: 采用现代中文圣经读者较熟悉、并与旧约人物名称相衔接的译名。
- source_word: ἐγέννησεν
  choice: 生了
  rationale: γεννάω在家谱中表示父系的生育或世系承接。“生了”简洁自然，并保留家谱惯用表达，不额外断定每一代都必为紧邻的生物学父子关系。
- source_word: Σαλαθιήλ
  choice: 撒拉铁
  rationale: 采用中文圣经传统中通行、便于与旧约人物对应的译名。
- source_word: δὲ
  choice: ；
  rationale: 第二个δέ承接下一项家谱关系；用分号体现连续而略有分节的关系，比机械加入“而”更符合现代汉语。
- source_word: Ζοροβαβέλ
  choice: 所罗巴伯
  rationale: 采用中文圣经传统中通行、可与旧约人物对应的译名。
theological_decisions:
- issue: 家谱中γεννάω所表达的世系关系
  choice: 译作“生了”，按家谱惯例表达父系世系承接
  alternative: 译作“作了……的父亲”或“生下了”
  rationale: “生了”保留原文重复的家谱公式，语言自然，也不把家谱体裁可能容纳的隔代关系收窄为必然直接相邻的生物学父子关系。
translation_notes:
  register: 采用现代、庄重而简明的家谱语体。人名沿用简体中文圣经中较通行的形式；两次“生了”保持原文公式的重复。脚注标记已在正文对应位置标出。
