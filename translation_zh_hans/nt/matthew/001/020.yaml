id: MAT.1.20
reference: Matthew 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: zh_hans
  text: 他正思量这些事的时候，看哪，主的一位天使在梦中向他显现，说：“大卫的子孙约瑟，不要怕把你的妻子马利亚接过来[a]，因为她腹中所怀的，是出于圣灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接过来”也可译作“接到家里”；原文在这里指接纳她进入自己的家庭并共同生活。
    reason: 说明παραλαμβάνω在本语境中的婚姻和家庭含义，同时避免把它误读成此时才缔结婚姻。
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: 正思量
  rationale: 表达约瑟持续而审慎的内心考虑，不将其理解为已经作出决定。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文用于引起注意、增强叙事现场感的标记；在庄重的现代中文中仍可理解。
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: ἄγγελος无冠词，因此用“一位天使”，避免擅自等同于特指性的“主的使者”；κυρίου译为“主”。
- source_word: κατ’ ὄναρ
  choice: 在梦中
  rationale: 符合希腊语惯用表达，也是在现代中文中最自然的说法。
- source_word: ἐφάνη
  choice: 向他显现
  rationale: 准确表达启示性人物的出现，并保留与格αὐτῷ所指的对象。
- source_word: υἱὸς Δαυίδ
  choice: 大卫的子孙
  rationale: 中文“子孙”既可表达大卫后裔的谱系关系，也保留其大卫家系的含义；直译“儿子”在现代中文中容易误解为直接父子关系。
- source_word: μὴ φοβηθῇς
  choice: 不要怕
  rationale: 自然、直接地表达否定命令及φοβέομαι的情感含义。
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: 把你的妻子马利亚接过来
  rationale: 保留τὴν γυναῖκά σου对马利亚现有婚姻身份的同位说明，并以“接过来”表达迎接她共同生活的语境，不暗示她此时才成为妻子。
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: 她里面所孕育的
  rationale: 保留中性实词化分词的非明确指称，不提前补出“孩子”；“所孕育的”自然表达胎内形成的生命。
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: 是出于圣灵
  rationale: “出于”清楚表达ἐκ所表示的来源；“圣灵”作为固定的神圣称谓，符合本段语境。
theological_decisions:
- issue: ἄγγελος κυρίου中κυρίου的译法及天使是否特指
  choice: 主的一位天使
  alternative: 主的使者
  rationale: 译出“主”，同时尊重ἄγγελος前无冠词这一形式，不把经文强行解释为旧约中某个特定的神显身份。
- issue: πνεύματός ... ἁγίου所指
  choice: 圣灵
  alternative: 圣洁的灵／一种圣灵
  rationale: 在马太福音降生叙事中，此词组指向神的圣灵，是孕育的来源，而非一种不定的灵或仅指非人格性的能力。
- issue: 马利亚在παραλαβεῖν Μαρίαν τὴν γυναῖκά σου中的婚姻身份
  choice: 你的妻子马利亚
  alternative: 接马利亚为妻
  rationale: 原文称马利亚为“你的妻子”；所吩咐的是接纳她，而不是明确说在此刻才使她成为妻子。译文保留订婚婚姻背景中的张力，不替经文规定更细的法律阶段。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”刻意保留原文的叙事提示语；“她里面所孕育的”略带经文语体，但可理解，并能保留原文未直接说出“孩子”的表达。
