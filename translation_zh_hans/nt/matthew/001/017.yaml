id: MAT.1.17
reference: Matthew 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: zh_hans
  text: 这样，从亚伯拉罕到大卫，一共有十四代；从大卫到被掳到巴比伦，一共有十四代；从被掳到巴比伦到弥赛亚，一共有十四代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: 这样……一共有……代
  rationale: οὖν在这里总结前面的家谱，译作“这样”自然地表达归纳意味；Πᾶσαι与αἱ γενεαὶ合用，借“一共有……代”体现全部世代的总数。
- source_word: ἀπὸ ... ἕως
  choice: 从……到……
  rationale: 准确而自然地表达家谱两个节点之间的范围。
- source_word: γενεαὶ δεκατέσσαρες
  choice: 十四代
  rationale: γενεά在家谱语境中指相继的世代；“代”是现代汉语中简洁清楚的对应词。三次均译为“一共有十四代”，保留原文整齐的三段结构。
- source_word: μετοικεσίας Βαβυλῶνος
  choice: 被掳往巴比伦
  rationale: μετοικεσία指被迫迁移、放逐的历史事件。“被掳往巴比伦”既体现迁往巴比伦的方向，也保留事件的强制性质。
- source_word: τοῦ χριστοῦ
  choice: 弥赛亚
  rationale: 此处χριστός带冠词，并作为家谱的终点，具有称号意义；译作“弥赛亚”比将其作为名字音译更能传达“受膏者”的身份称号。
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: 亚伯拉罕／大卫／巴比伦
  rationale: 采用现代中文圣经与一般读者熟悉的标准专名形式。
theological_decisions:
- issue: χριστός作为家谱终点的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节的定冠词及家谱的高潮结构表明χριστός在此主要是称号。“弥赛亚”保留其犹太受膏者称号的意义，同时不额外解释其神学内涵。
- issue: 巴比伦事件的性质
  choice: 被掳往巴比伦
  alternative: 迁居巴比伦／流亡巴比伦
  rationale: 原词强调迁移或放逐这一事件。“被掳往”清楚表明并非自愿迁居，又不把经文扩展成对整个被掳时期的说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三个分句使用完全平行的句式和分号，保留希腊文的总结性、程式化节奏；不为十四代的计算方式添加原文没有的解释。
