  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: zh_hans
  text: 约瑟直到马利亚生下一个儿子，都没有与她同房[a][b]；他给孩子取名叫耶稣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有认识她”；“认识”在这里是指发生性关系的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: “直到”说明在耶稣出生以前一直如此；这个词本身并不能断定出生以后发生了什么。
    reason: alternative_reading
  - marker: c
    text: 较贴近原文可译作“他称他的名为耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: 与她同房
  rationale: 原文直译为“认识她”，在这里是指性关系的委婉说法。现代汉语中的“认识”通常没有这一含义，若照字面翻译会造成误解，因此正文采用自然、明确而仍庄重的“与她同房”，并在脚注保留原文措辞。
- source_word: ἕως οὗ
  choice: 直到……都没有
  rationale: 准确表达从此前一直延续到生产这一时间界限的状态；该表达本身不对生产之后的情况作出断定。
- source_word: ἔτεκεν
  choice: 生下
  rationale: “生下”是现代汉语表达分娩、生育结果的自然说法，符合此处叙事语境。
- source_word: υἱόν
  choice: 一个儿子
  rationale: 原文υἱόν没有冠词，此处自然理解为非特指，译作“一个儿子”，不额外加入原文未明说的强调。
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: 他给孩子取名叫耶稣
  rationale: 以自然现代汉语表达原文“称他的名为耶稣”的命名公式，同时保留约瑟执行命名这一动作。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用新约人物名字在现代汉语中的标准译名；虽与希伯来名字“约书亚”同源，此处不宜改用后者。
theological_decisions:
- issue: “直到”是否暗示马利亚后来不再保持童贞
  choice: 正文只陈述约瑟在耶稣出生以前没有与马利亚同房，不据此断言出生以后发生了什么。
  alternative: 有些读者认为这句话暗示二人后来有正常夫妻关系；另一些读者认为该时间表达并不暗示此后情况有所改变。
  rationale: 希腊语ἕως οὗ标明所述状态持续到耶稣出生这一界限，但该短语本身不足以裁定之后的情况。译文与脚注保留这一解释空间，不引入宗派立场。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“与她同房”避免将希腊语委婉语机械译成现代汉语中容易误解的“认识她”；“给孩子取名叫”符合当代汉语习惯。为避免连续代词造成指代含混，补出“约瑟”“马利亚”和“孩子”，这些所指均由上下文清楚确定。
