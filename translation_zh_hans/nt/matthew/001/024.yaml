  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: zh_hans
  text: 约瑟从睡梦中醒来，就照主的使者所吩咐的去做，把妻子接到自己身边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接到自己身边”也可译作“接纳了妻子”或“把妻子接进家里”。原文动词可指把某人接到自己这里或自己的家中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: 约瑟从睡梦中醒来
  rationale: 将不定过去时被动分词按上下文作不及物理解，并以自然的汉语时间顺序表达；δὲ在此推动叙事，无须另译为强转折词。
- source_word: ἐποίησεν ὡς
  choice: 就照……去做
  rationale: 表达行动与命令相符，同时保留叙事推进的连贯性。
- source_word: προσέταξεν
  choice: 吩咐
  rationale: 该词表示有权威的命令；“吩咐”在本语境中既庄重自然，也保留权威意味。
- source_word: ὁ ἄγγελος κυρίου
  choice: 主的使者
  rationale: 忠实表达属格结构，并采用现代中文圣经语体中清楚、庄重的说法。
- source_word: παρέλαβεν
  choice: 接到自己身边
  rationale: παραλαμβάνω可表示接纳某人到自己这里或家中；此译法较单译“娶”更能避免提前断定具体婚礼程序，也比单译“接”清楚。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻子
  rationale: γυνή可指女人或妻子；本段的婚约及法律婚姻框架支持译作“妻子”，但不暗示婚姻已经圆房。
theological_decisions:
- issue: 尚未圆房的婚约语境中γυνή的译法
  choice: 妻子
  alternative: 那女人／未婚妻
  rationale: 马太在当时婚约所构成的法律婚姻框架内称马利亚为约瑟的妻子；此译法不额外暗示两人已经发生夫妻关系。
- issue: ἄγγελος κυρίου中κυρίου的译法
  choice: 主的使者
  alternative: 耶和华的使者／主所差的使者
  rationale: 希腊文本为κύριος的属格，并未在此直接出现神名；译作“主”保留原文措辞及其传统圣经表达。
- issue: παρέλαβεν所指行动的具体性质
  choice: 接到自己身边
  alternative: 娶了／接进家里／接纳了
  rationale: 原动词可以包含接到自己这里或家庭中的含义，但经文本身没有详细说明婚礼程序或住所安排，因此正文保留一定宽度，并用脚注列出可行理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“睡梦中醒来”比直译“从睡眠起来”自然；“照……所吩咐的去做”清楚呈现顺服命令的行动。脚注保留παρέλαβεν在婚姻及家庭语境中的词义幅度。
