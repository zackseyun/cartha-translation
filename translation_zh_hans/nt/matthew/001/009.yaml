  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: zh_hans
  text: 乌西雅生约坦[a]，约坦生亚哈斯，亚哈斯生希西家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生”对应希腊语 ἐγέννησεν，是家谱中表示父系承接关系的传统简洁说法，也可译作“作了……的父亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: 乌西雅
  rationale: 采用现代中文圣经中对应旧约犹大王的通行译名，而不按希腊语字形另作音译。
- source_word: δὲ
  choice: 以逗号衔接，不逐一译出
  rationale: 这里的 δέ 是推动家谱名单的轻微连接词；中文用逗号连接重复分句，更自然地保留其连续推进的作用。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 家谱语境中表示父系生育关系；“生”简洁、庄重，并能保留原文反复公式的节奏。
- source_word: Ἰωαθάμ
  choice: 约坦
  rationale: 采用与旧约犹大王相对应的通行中文译名。
- source_word: Ἀχάζ
  choice: 亚哈斯
  rationale: 采用与旧约犹大王相对应的通行中文译名。
- source_word: Ἑζεκίαν
  choice: 希西家
  rationale: 采用与旧约犹大王相对应的通行中文译名。
theological_decisions:
- issue: γεννάω 在家谱中的关系含义
  choice: 译为“生”，按经文表面呈现父系家谱承接关系
  alternative: 作“是……的祖先”或“作了……的父亲”
  rationale: 马太使用程式化、反复的家谱句式。“生”既保留词义与文学节奏，也不把家谱有时可能省略世代的现象解释性地写入正文。脚注说明其家谱用法，避免将其机械限定为对生育过程的详述。
translation_notes:
  register: 采用现代、简洁而庄重的家谱体。重复“生”以保留希腊原文的公式化节奏；人名使用现代中文圣经读者熟悉的旧约通行译名。
