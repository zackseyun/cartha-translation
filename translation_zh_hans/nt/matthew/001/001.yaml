- from: 弥赛亚耶稣[b]的家谱[a]：他是大卫的子孙，也是亚伯拉罕的子孙。
  to: 耶稣——弥赛亚、大卫之子、亚伯拉罕之子——的家谱。
  rationale: 修订保留原文作为标题的紧凑结构和词序关系：耶稣由“弥赛亚”“大卫之子”“亚伯拉罕之子”连续界定。破折号在中文中清楚标示这些称号和谱系身份均说明耶稣；“大卫之子”也保留了原文υἱός的字面及其既有的弥赛亚称号色彩。脚注内容维持原有的词义歧义说明。
