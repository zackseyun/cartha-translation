  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: zh_hans
  text: 耶稣——弥赛亚、大卫之子、亚伯拉罕之子——的家谱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βίβλος γενέσεως
  choice: 家谱
  rationale: 这一短语可指谱系的书卷或记录；鉴于下文紧接家系名单，简洁译作“家谱”最自然。“γένεσις”兼有“起源、出生”之意，另在脚注保留。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代中文通行的人名译法。
- source_word: χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，指受膏者；中文以“弥赛亚”呈现其犹太语境和称号性质，并按自然汉语置于人名前。
- source_word: υἱοῦ Δαυὶδ
  choice: 大卫的子孙
  rationale: υἱός字面为“儿子”，但在跨世代的家谱和弥赛亚称号中表示后裔；“子孙”既符合现代汉语，也保留其王室谱系含义。
- source_word: υἱοῦ Ἀβραάμ
  choice: 亚伯拉罕的子孙
  rationale: 此处同样指跨世代的后裔关系；“子孙”准确传达家谱联系，并保留与亚伯拉罕之约的关联。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节用该词介绍耶稣的受膏者身份，称号意味鲜明；“基督”作为传统音意译在脚注中保留。
- issue: γενέσεως在标题中的含义
  choice: 家谱
  alternative: 起源；出生
  rationale: 紧接其后的内容是家系名单，因此正文采用“家谱”；但原词更广的“起源、出生”意涵并未排除，故用脚注保留其歧义。
- issue: υἱός在大卫和亚伯拉罕之后的含义
  choice: 子孙
  alternative: 儿子
  rationale: 两处均非直接父子关系，而是谱系中的后裔关系；译作“子孙”避免现代读者误解，同时仍呈现大卫王系和亚伯拉罕谱系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“弥赛亚”置于“耶稣”之前，以符合汉语称号加人名的通常语序；用冒号展开两个谱系身份，使标题式原文在中文中清楚易读。
