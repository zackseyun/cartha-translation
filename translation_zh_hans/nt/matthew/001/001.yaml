  terminology: “弥赛亚”适合呈现χριστός的称号性质；“家谱”适合γενέσεως的上下文。“大卫之子”是中文中既自然又保留原文弥赛亚称号力度的表达；“亚伯拉罕之子”保持对应的谱系语法，且不误作直系父子。
  issues:
