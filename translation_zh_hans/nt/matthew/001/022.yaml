  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: zh_hans
  text: 这一切事的发生，是要使主借着先知所说的话得以应验[a]；先知说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这整件事发生了。”希腊语此处以单数指前面所述事件的整体，并强调其完整性。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: 这一切
  rationale: τοῦτο以中性单数把前述事件视为一个整体，ὅλον强调其全部范围；“这一切”在现代汉语中自然地兼顾整体指称和完整性。δὲ在此主要承接叙事，不必另加“如今”等时间词。
- source_word: γέγονεν
  choice: 发生
  rationale: γίνομαι的完成时在此指前述事情已经发生；汉语叙事用“发生”简洁自然，无须机械标出完成体。
- source_word: ἵνα πληρωθῇ
  choice: 是要使……得以应验
  rationale: 保留ἵνα可能兼具目的与结果的意味，并以“得以应验”表达被动语态，不把经文限定为单纯目的或单纯结果。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 将名词化的被动分词译为自然的汉语关系结构，指已经说出的话。
- source_word: ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: 主借着先知
  rationale: “主”是话语的最终发出者，“先知”是传达的媒介；“借着”保留ὑπό与διά所标示的不同施事层次。
- source_word: λέγοντος
  choice: 先知说
  rationale: 该属格分词紧接“先知”，用于引出下一节的引文；另起短句“先知说：”在现代汉语中清楚自然，也保留其引语导入功能。
theological_decisions:
- issue: 预言话语中的施事关系
  choice: “主借着先知所说的话”
  alternative: “先知从主那里所说的话”
  rationale: 原文以ὑπό加属格标明主为最终说话者，以διά加属格标明先知为媒介；译文保留这一层次，而不扩展为经文本身没有明说的系统教义。
- issue: 应验公式中的目的与结果
  choice: “是要使……得以应验”
  alternative: “结果……应验了”
  rationale: ἵνα加虚拟式可承载目的、结果或二者交叠的意味；“是要使……得以应验”保留其指向性及神学张力，避免只解释为事后的结果。
- issue: λέγοντος的语法指向
  choice: 译作“先知说”
  alternative: 译作不明示说话者的“说道”
  rationale: 分词在形式和位置上最自然地与“先知”相连；译文据此清楚引出引文，但不据此增添关于启示方式的说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主借着先知”清楚区分最终说话者与传达媒介；“得以应验”保留被动和应验公式。“先知说：”为下一节引文提供自然衔接。
