  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: zh_hans
  text: 耶西生了大卫王。大卫从乌利亚的妻子[a]生了所罗门，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“从乌利亚的〔那位女子〕”。“女子”或“妻子”是原文省略而含蓄表达的；马太在这里没有提拔示巴的名字。
    reason: 说明原文的省略结构及马太对这位女子的间接指称。
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生了
  rationale: 在家谱语境中，γεννάω表示父系生育或世系关系。“生了”是现代汉语家谱中简洁自然的表达，并保留原文逐代相承的结构。
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: 大卫王
  rationale: 原文用带冠词的“王”特别标明大卫的君王身份；“大卫王”在现代汉语中自然、明确，也保留这一强调。
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: 从乌利亚的妻子
  rationale: 原文直译近于“从乌利亚的那位〔女子〕”，省略了“女子”或“妻子”。译作“从乌利亚的妻子”既符合汉语表达，也保留马太不直呼拔示巴姓名、而以她和乌利亚的关系来指称她的特点。
- source_word: Ἰεσσαί
  choice: 耶西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Δαυίδ
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Σολομών
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Οὐρίας
  choice: 乌利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在这里是家谱叙述中的轻微衔接词。汉语凭句序即可清楚表达承接关系，逐一译作“又”或“而”反而显得累赘。
theological_decisions:
- issue: 马太间接指称拔示巴
  choice: 保留“乌利亚的妻子”，不补出拔示巴的名字
  alternative: “拔示巴”或“曾作乌利亚妻子的女人”
  rationale: 希腊原文刻意借乌利亚来指称这位女子。保留这种间接表达，能维持其与《撒母耳记下》相关叙事的文学和道德张力，避免用熟悉的人名消解原文的表达重点。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语，延续家谱的重复节奏。“大卫王”突出原文赋予大卫的王室身份；标点末尾保留逗号，以便与下一节家谱接续。
