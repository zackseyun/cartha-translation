  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: zh_hans
  text: 亚兰[a]生亚米拿达，亚米拿达生拿顺，拿顺生撒门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兰”。希腊文作“亚兰”（Ἀρὰμ）；希伯来文家谱中的对应人名通常作“兰”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: 亚兰
  rationale: 按希腊文人名Ἀράμ音译为“亚兰”；希伯来文家谱中的对应形式通常译作“兰”，故在脚注保留这一译法。
- source_word: δὲ
  choice: 不单独译出，以逗号衔接
  rationale: 本节中δὲ用于推进家谱次序，并无明显转折；汉语以重复句式和逗号自然表达连续关系。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在男性家谱语境中指生育或成为后代的祖先；“生”简洁、自然，并保留家谱公式的传统庄重感。
- source_word: Ἀμιναδάβ
  choice: 亚米拿达
  rationale: 采用现代中文圣经中较易辨认的惯用人名形式，对应希腊文Ἀμιναδάβ。
- source_word: Ναασσών
  choice: 拿顺
  rationale: 采用与希伯来文对应人名相协调的中文惯用译名，便于跨经卷辨认。
- source_word: Σαλμών
  choice: 撒门
  rationale: 采用现代中文圣经常见的人名译法，清楚对应家谱中的Σαλμών。
theological_decisions:
- issue: ἐγέννησεν所表达的是直接父子关系还是较宽泛的祖先关系
  choice: 正文沿用家谱公式译作“生”，不额外限定每一代必为直接父子关系
  alternative: 译作“作了……的父亲”
  rationale: 希腊语γεννάω在家谱中可构成固定的世系表达；“生”既忠实于公式，也避免加入原文未明说的世代间隔判断。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语家谱句式；连续三次使用“生”，重现原文重复结构。脚注标记紧随“亚兰”，与所说明的人名准确对应。
