  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: zh_hans
  text: 犹大从他玛生法勒斯和谢拉；法勒斯生希斯仑；希斯仑生亚兰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本作“兰”，反映了不同的音译或传承；此处希腊文本作“亚兰”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: 犹大
  rationale: 家谱中指希伯来圣经里的族长犹大；采用现代中文圣经通行译名，也避免与新约中通常称作“犹大”的其他人物混淆时产生不必要的歧义。
- source_word: δὲ
  choice: 分号衔接，不逐一明译
  rationale: 此处δέ是家谱叙述中的轻微承接词，并非表示强烈转折；中文以分号自然呈现连续关系。
- source_word: ἐγέννησεν
  choice: 生
  rationale: γεννάω在父系家谱中表示生育或成为先祖；“生”简洁、自然，也符合中文家谱体例，同时不把谱系关系过度解释为每一代都必然是直接父子关系。
- source_word: Φαρὲς
  choice: 法勒斯
  rationale: 对应希伯来文名字פֶּרֶץ，采用现代中文圣经中较熟悉的旧约人名形式，以保持经卷之间的连贯性。
- source_word: Ζάρα
  choice: 谢拉
  rationale: 对应希伯来文名字זֶרַח，采用中文圣经中通行的旧约人名形式。
- source_word: ἐκ τῆς Θαμάρ
  choice: 从她玛
  rationale: ἐκ加母亲的名字表示母系来源；“从她玛生”准确保留母亲在家谱中的特别提及，并符合庄重而自然的现代中文。
- source_word: Θαμάρ
  choice: 她玛
  rationale: 采用中文圣经中通行的人名译法。
- source_word: Ἑσρώμ
  choice: 希斯仑
  rationale: 对应希伯来文名字חֶצְרוֹן，采用中文旧约传统中熟悉的形式，以维持正典内的人名一致性。
- source_word: Ἀράμ
  choice: 亚兰
  rationale: 严格依照所给SBLGNT希腊文本Ἀράμ翻译，不自行与其他家谱传统中的“兰”协调。
theological_decisions:
- issue: 末一人名是否与常见的旧约家谱译名协调
  choice: 亚兰
  alternative: 兰
  rationale: 所给希腊文本明确作Ἀράμ，因此正文按原文译作“亚兰”；读者可能从其他家谱或译本熟悉“兰”，故在脚注保留该差异，不在正文中默默协调。
translation_notes:
  register: 采用简洁、庄重的现代中文家谱句式，以分号划分三组谱系关系。脚注标记置于其实际说明的“亚兰”之后，而非置于“她玛”之后。
