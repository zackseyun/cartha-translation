id: MAT.1.21
reference: Matthew 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: zh_hans
  text: 她将生一个儿子，你要给他取名叫耶稣[a]，因为他要把自己的子民从他们的罪中拯救出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣”是与希伯来语或亚兰语“耶书亚”（即“约书亚”）相对应的希腊语形式；这个名字与“耶和华拯救”的意思有关。下文“因为他要……拯救”正是对这个名字的呼应。
    reason: 说明人名的原语言背景及原文中的文字呼应；这一关联在中文音译“耶稣”中无法直接显现。
lexical_decisions:
- source_word: τέξεται
  choice: 将生
  rationale: 这是τίκτω的将来时形式，语境明确指分娩；“将生一个儿子”自然、庄重，并保留预告意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的承接词。现代汉语无需另加“而”或“但”也能自然衔接，避免制造原文没有的转折。
- source_word: υἱὸν
  choice: 一个儿子
  rationale: 在生育语境中，这一不带冠词的宾语自然译为“一个儿子”。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: 你要给他取名叫
  rationale: 原文直译近于“你要称他的名为”。“给他取名叫”符合现代汉语的命名表达，同时保留命名这一正式行动。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用新约人物在现代汉语中的标准译名；脚注说明其希伯来语或亚兰语名称背景及本节的文字呼应。
- source_word: αὐτὸς
  choice: 他
  rationale: 希腊语显明孩子本人是拯救的施行者；汉语主语“他”在因果说明中已能自然承载这一焦点，不额外加入可能显得过强的“亲自”或“正是他”。
- source_word: γὰρ
  choice: 因为
  rationale: 引出取名缘由；“因为”清楚表达解释关系，符合现代汉语。
- source_word: σώσει
  choice: 要……拯救出来
  rationale: σῴζω在这里指从罪中施行拯救。“拯救”保留其救赎含义，“出来”与ἀπό所表达的脱离关系相配。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 自己的子民
  rationale: λαός常指归属于某人的人民，并可带有圣约语境。“自己的子民”自然表达归属关系，但不在本节中擅自限定为以色列或扩大为全人类。
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: 从他们的罪中
  rationale: ἀπό表示脱离；“从……中”在汉语中清楚表达从罪的处境或权势下获救。保留复数所涵盖的具体罪行，不抽象化为单数概念。
theological_decisions:
- issue: αὐτός对耶稣施行拯救的强调
  choice: 译为“他要……拯救”，由明确主语和语序承载焦点
  alternative: 译为“他亲自要……”或“正是他要……”
  rationale: 原文的αὐτός明确指出这孩子是拯救者，但现代汉语若加入“亲自”可能引入与代理施行相对的额外含义，“正是”也可能强化过度。正文保留明确主体而不扩张其语用力度。
- issue: “自己的子民”的范围
  choice: 保留为“自己的子民”，不进一步界定
  alternative: “自己的以色列子民”或“所有属于他的人”
  rationale: 马太福音的直接背景具有犹太和圣约色彩，但本节本身未明说范围；译文不将其限缩为以色列，也不扩展为全人类，以保留原文的解释空间。
- issue: “从他们的罪中拯救”的性质
  choice: 直接保留从罪中得拯救的表述
  alternative: 解释为仅免除罪责、脱离罪的权势，或停止犯罪
  rationale: 原文没有在本节细分拯救与罪的关系；译文保留其神学张力，不把某一种系统解释写入正文。
translation_notes:
  register: 采用现代、清楚而庄重的书面汉语。“给他取名叫”比直译式的“称他的名为”更符合普通读者的自然表达；“子民”保留λαός在圣约语境中的群体与归属意味。脚注标记紧随“耶稣”，对应所解释的人名。
