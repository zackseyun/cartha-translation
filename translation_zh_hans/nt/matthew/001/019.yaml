language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: zh_hans
  text: 她的丈夫约瑟[a]是个义人，又不愿使她公开蒙羞[b]，就打算暗中与她离婚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的未婚夫”。原文直译为“她的男人／丈夫”；按当时犹太人的习俗，订婚具有法律约束力。
    reason: lexical_alternative
  - marker: b
    text: 或译“拿她示众”或“公开羞辱她”。
    reason: lexical_alternative
  - marker: c
    text: 或译“暗中遣走她”。按本节语境，这是指正式解除订婚期间已具有法律效力的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: 她的丈夫
  rationale: ἀνήρ在关系语境中可指“丈夫”。马太叙事中的订婚具有法律约束力，且下文使用ἀπολῦσαι，表明这里所说的是需正式解除的婚姻法律关系；“丈夫”在现代汉语中最自然，订婚阶段则在脚注说明。
- source_word: δίκαιος
  choice: 义人
  rationale: “义人”既自然简洁，也保留δίκαιος在圣经中的道德与神学含义，不将其局限为守法或怜悯中的某一方面。
- source_word: δειγματίσαι
  choice: 使她公开蒙羞
  rationale: δειγματίζω含有公开暴露、使人受辱之意；此译法明确表达公开羞辱的语境含义，同时不额外指定具体惩处方式。
- source_word: ἐβουλήθη
  choice: 打算
  rationale: βούλομαι表示经过考虑的意愿或意图；“打算”是清楚自然的现代汉语叙事表达。
- source_word: λάθρᾳ
  choice: 暗中
  rationale: λάθρᾳ指隐秘地、不公开地；“暗中”与前面的“公开蒙羞”形成清楚对照，又不必暗示不正当的鬼祟行为。
- source_word: ἀπολῦσαι αὐτήν
  choice: 与她离婚
  rationale: 在当时具有法律效力的订婚背景下，ἀπολύω指正式解除双方关系。“与她离婚”能使现代读者明白其法律性质；较字面的“遣走她”列入脚注。
- source_word: δὲ
  choice: 省略显性连接词
  rationale: δὲ是轻微的叙事连接词。汉语本节直接承接上文，以主语开句更自然，其推进功能无需机械译为“而”或“于是”。
- source_word: ὢν καὶ μὴ θέλων
  choice: 是……又不愿
  rationale: 以并列背景分句表达希腊文分词结构，既保留约瑟为义人和不愿公开羞辱马利亚这两项叙述，也符合现代汉语句法。
theological_decisions:
- issue: 约瑟被称为δίκαιος的含义
  choice: 译为“义人”，不说明这是严格守法、怜悯待人，还是二者兼有。
  alternative: 译作“正直的人”，或解释性地突出守法或仁慈。
  rationale: 原文把约瑟的“义”与他不愿公开羞辱马利亚并置，却没有对二者关系作单一解释；译文保留这种神学与伦理张力。
- issue: 约瑟与马利亚的法律关系
  choice: 正文采用“丈夫”和“离婚”。
  alternative: 采用“未婚夫”和“解除婚约”，或较字面的“她的男人”和“遣走她”。
  rationale: 原文用ἀνὴρ及ἀπολύω表明当时的订婚关系具有婚姻法律效力，需要正式解除。正文用现代读者容易理解的法律关系用语，订婚阶段及直译可能则保留在脚注中。
- issue: δειγματίσαι所指的公开羞辱
  choice: 不将其具体化为审判、刑罚或某种特定法律程序。
  alternative: 将其解释为公开控告、游街示众或使她受特定刑罚。
  rationale: 该动词表达公开暴露并使人蒙羞，但本句没有明确指出具体实施方式；译文不超出文本证据。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“义人”保留圣经语体及原文的神学内涵；“公开蒙羞”与“暗中”形成自然对照。所有脚注标记均置于相应词语之后，并依正文出现顺序排列。
