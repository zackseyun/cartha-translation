  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: zh_hans
  text: 以律生以利亚撒，以利亚撒生马但，马但生雅各。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: 以律
  rationale: 按现代中文圣经人名的通行译法音译，保持家谱人物名称前后一致。
- source_word: δὲ
  choice: 以逗号连接分句
  rationale: 此处δέ是轻微的承接连词，用来推进家谱名单；中文以并列分句和逗号自然表达其连续关系，无须逐一译作“又”或“然后”。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在父系家谱语境中表示生育或成为后代的父系祖先；“生”简洁、自然，也保留家谱公式的传统庄重感，并不额外限定每一代必为直接父子关系。
- source_word: τὸν
  choice: 不单独译出
  rationale: 希腊语冠词在此标示专名作直接宾语；现代汉语在人名前无需对应冠词，其语法功能已由语序体现。
- source_word: Ἐλεάζαρ
  choice: 以利亚撒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: Ματθάν
  choice: 马但
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: Ἰακώβ
  choice: 雅各
  rationale: 采用现代中文圣经中约定俗成的人名译法。
theological_decisions:
- issue: 家谱中ἐγέννησεν是否必须表达直接父子关系
  choice: 译作“生”，不另加“儿子”或“直接”
  alternative: 译作“作了……的父亲”或“生了儿子……”
  rationale: γεννάω在家谱中可用于父系生育或祖先传承；简洁的“生”既符合中文家谱表达，也不把原文可能容许的代际概括缩窄为明确的直接父子关系。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留原文三段重复的家谱公式；不使用较古雅的“生了”或“乃生”，也不添加原文没有的称谓。
