  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: zh_hans
  text: 撒门与喇合生了波阿斯[a]，波阿斯与路得生了俄备，俄备生了耶西，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“撒门从喇合生了波阿斯”；下句同。希腊文在两位母亲的名字前都用了表示来源的ἐκ。
    reason: 说明原文ἐκ＋母亲姓名的母系来源表达，并交代正文为符合现代汉语而采用“与……生了……”的说法。
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生了
  rationale: 在家谱语境中指生育、成为后代的父亲。“生了”是现代汉语圣经家谱中自然而简洁的表达，并由男性主语保留父系家谱结构。
- source_word: ἐκ
  choice: 从
  rationale: ἐκ加母亲姓名表示母系来源或亲子关系。译作“从喇合”“从路得”贴近希腊文，并明确保留母亲的名字；脚注补充更自然的汉语表达。
- source_word: δὲ
  choice: 以逗号连接
  rationale: 这里的δέ是家谱连续叙述中的轻微连接词，并无转折意义。汉语用逗号顺接比逐一译成“又”或“而”更自然。
- source_word: Σαλμὼν
  choice: 撒门
  rationale: 采用现代简体中文圣经中通行的旧约人物译名，便于跨经卷辨认。
- source_word: Βόες
  choice: 波阿斯
  rationale: 采用该旧约人物的通行中文译名，保持新旧约人物名称的一致性。
- source_word: Ῥαχάβ
  choice: 喇合
  rationale: 采用该人物的通行中文圣经译名。
- source_word: Ἰωβὴδ
  choice: 俄备
  rationale: 采用该旧约人物的通行中文译名，保持正典内名称的一致性。
- source_word: Ῥούθ
  choice: 路得
  rationale: 采用该人物及同名旧约书卷的通行中文译名。
- source_word: Ἰεσσαί
  choice: 耶西
  rationale: 采用该旧约人物的通行中文译名。
theological_decisions:
- issue: 家谱句式及母亲姓名的保留
  choice: 保留男性作主语的“生了”句式，并明确译出“从喇合”和“从路得”。
  alternative: 译作“喇合为撒门生下波阿斯，路得为波阿斯生下俄备”，或只说“撒门是波阿斯的父亲”。
  rationale: 希腊文既维持父系家谱的句法，又不寻常地用ἐκ加母亲姓名。正文保留这两方面，避免抹去母亲的明确出现，也不把父系句式改写成以母亲为主语。
translation_notes:
  register: 采用现代、庄重而简洁的家谱文体。人名遵循简体中文圣经的通行形式。保留经文末尾的逗号，以衔接下一节家谱。
