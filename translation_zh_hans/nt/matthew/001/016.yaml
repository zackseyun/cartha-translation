id: MAT.1.16
reference: Matthew 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: zh_hans
  text: 雅各生约瑟；约瑟是马利亚的丈夫。那称为弥赛亚[a]的耶稣，是由马利亚所生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Christos 在这里用作称号，意为“受膏者”。
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出，以分号承接）
  rationale: 此处 δέ 只是轻微推进家谱叙述；现代汉语无需逐字译成“而”或“又”，用分号自然承接即可。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 家谱语境中的 γεννάω 表示生育或父系传承。“生”简洁自然，也符合中文家谱的传统表达。
- source_word: τὸν ἄνδρα Μαρίας
  choice: 马利亚的丈夫
  rationale: ἀνήρ 在属格短语“马利亚的”限定下明确指婚姻关系，译作“丈夫”而非泛指“男人”。
- source_word: ἐξ ἧς
  choice: 由马利亚
  rationale: 阴性单数关系代词 ἧς 专指马利亚。中文重复“马利亚”比“由她”更清楚，并保留此处从惯常父系家谱句式转向马利亚的变化。
- source_word: ἐγεννήθη
  choice: 所生
  rationale: 被动式与前面的主动式“生约瑟”形成刻意区别；“由马利亚所生”自然保留被动含义，没有说约瑟生了耶稣。
- source_word: ὁ λεγόμενος
  choice: 那称为
  rationale: 表达耶稣以该称号为人所称，紧密修饰“耶稣”，且保持庄重自然。
- source_word: χριστός
  choice: 弥赛亚
  rationale: 此处 χριστός 明显作为称号使用，而非姓名的一部分；“弥赛亚”能显明其受膏者称号的功能。
theological_decisions:
- issue: 基督论身份称谓 χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: ὁ λεγόμενος χριστός 是身份称号结构。正文译作“弥赛亚”以保留称号含义，同时在脚注提供中文传统译名“基督”。
- issue: 约瑟的家谱关系与耶稣出生的措辞变化
  choice: “雅各生约瑟”，但耶稣“由马利亚所生”
  alternative: 把两处都译成相同的主动生育句式
  rationale: 原文从主动 ἐγέννησεν 转为被动 ἐγεννήθη，并以阴性单数 ἐξ ἧς 专指马利亚。译文保留这一变化，不额外断定文本未明说的生理或法律关系。
translation_notes:
  register: 采用现代、庄重而易懂的家谱语言。将希腊语单句分成两个中文分句，以免“约瑟是马利亚的丈夫”与“耶稣由马利亚所生”之间的关系产生歧义；同时把“那称为弥赛亚的”置于“耶稣”之前，使称号所修饰的对象清楚明确。
