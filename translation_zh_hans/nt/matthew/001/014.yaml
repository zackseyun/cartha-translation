  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: zh_hans
  text: 亚所生撒督，撒督生亚金，亚金生以律。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: 亚所
  rationale: 按现代中文圣经人名的通行音译处理，并与本段家谱中常见译名保持一致。
- source_word: δέ
  choice: （不单独译出）
  rationale: δέ在此是家谱各分句之间较弱的连接词；中文依靠重复句式和逗号即可自然表达连续关系，无须逐一译作“又”或“然后”。
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在男性家谱语境中表示生育或成为后裔链条中的父系先祖；“生”简洁、自然，并保留原文家谱公式的紧凑结构。
- source_word: τὸν
  choice: （不单独译出）
  rationale: 希腊语宾格冠词用于标示专名作直接宾语，现代汉语在此不需要对应词。
- source_word: Σαδώκ
  choice: 撒督
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἀχίμ
  choice: 亚金
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἐλιούδ
  choice: 以律
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: ἐγέννησεν在家谱中是否必须限定为直接父子关系
  choice: 译作“生”，不另加“直接”或“亲生”等限定
  alternative: 译作“作……的父亲”或“是……的祖先”
  rationale: 原词在家谱公式中可以表达父系生育与谱系承接；中文“生”保留原文简洁措辞，不主动解决家谱是否存在代际省略的问题。
translation_notes:
  register: 采用简洁、庄重而易懂的现代书面汉语，保留原文三段重复的家谱节奏；本节无须脚注。
