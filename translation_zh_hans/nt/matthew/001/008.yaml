source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: zh_hans
  text: 亚萨生约沙法[a]，约沙法生约兰，约兰生乌西雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“亚撒”，而不是“亚萨”；“亚撒”也与旧约家谱中这位犹大王的名字相符。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: 亚萨
  rationale: 按SBLGNT正文所载希腊名字Ἀσάφ音译为“亚萨”，不在正文中默默协调为旧约君王“亚撒”；相关异文及家谱背景在脚注说明。
- source_word: δὲ
  choice: （不单独译出，以逗号衔接）
  rationale: δέ在家谱中是轻微的承接词，并非转折；现代汉语以分句和逗号自然表达其连接作用。
- source_word: ἐγέννησεν
  choice: 生
  rationale: “生”是现代中文圣经家谱中简洁、自然且庄重的父系谱系表达，也避免使用较古雅的“生了”或冗长的“作……的父亲”。
- source_word: Ἰωσαφάτ
  choice: 约沙法
  rationale: 采用与旧约犹大王通行中文名一致、便于辨认的译名。
- source_word: Ἰωράμ
  choice: 约兰
  rationale: 采用希腊文Ἰωράμ所对应的通行中文名“约兰”，与相关旧约人物名称保持可辨识性。
- source_word: Ὀζίαν
  choice: 乌西雅
  rationale: 采用该犹大王的通行中文名“乌西雅”，比直接按希腊形式音译更便于普通读者辨认。
theological_decisions:
- issue: 如何处理家谱中重复出现的δὲ和ἐγέννησεν
  choice: 保留每一层“甲生乙”的父系链条，用逗号连接三个对称分句。
  alternative: 逐次加入“又”或“然后”，或译作“成为……的父亲”。
  rationale: 这主要是文体选择。中文的对称短句既完整保留家谱次序，也比机械译出每个连接词更自然。
- issue: 是否在正文中把Ἀσὰφ协调为旧约家谱所预期的“亚撒”
  choice: 正文依SBLGNT译作“亚萨”，脚注保留“亚撒”异文及其旧约家谱依据。
  alternative: 正文直接采用“亚撒”，使其与旧约犹大王的名字一致。
  rationale: 以所给希腊正文为首要依据，不无声改正或协调文本；同时用脚注透明呈现抄本异文和历史家谱上的张力。
translation_notes:
  register: 采用现代、简洁、庄重的家谱文体。“生”在此表达父系谱系关系；三个分句保持原文的重复结构，但不机械译出每个δέ。正文中的脚注标记[a]与脚注完全对应。
