  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: zh_hans
  text: 约西亚生耶哥尼雅和他的弟兄，在被掳往巴比伦的时候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“流亡巴比伦期间”。希腊语词可指被迫迁移，也可指由此形成的流亡时期；“被掳往巴比伦”凸显这次迁移的强制性质。
    reason: 词义替代
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 生
  rationale: 在马太的家谱格式中，γεννάω表示男性一系的传承。“生”简洁自然，符合现代中文家谱表达，也不额外断定每一环都必须是未经省略的直接父子关系。
- source_word: Ἰεχονίαν
  choice: 耶哥尼雅
  rationale: 采用现代中文圣经语境中通行、易识别的人名音译。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: 他的弟兄
  rationale: 希腊语为阳性复数；“弟兄”在此准确指男性亲属，并与家谱语境相称。
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: 正值被掳迁往巴比伦之时
  rationale: μετοικεσία可指迁离、强制迁徙或流亡；“被掳迁往”凸显事件的强制性质，ἐπί加属格在此作时间标记，Βαβυλῶνος在该表达中指迁往的目的地。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在连续家谱中只是轻微的衔接词；中文不必逐一明译，省略后更自然且不损失实质意义。
theological_decisions:
- issue: 马太家谱可能存在的世代省略
  choice: 按希腊文所陈述的家谱关系直译，不在正文中处理历史协调问题
  alternative: 将“生”展开解释为包括较远祖先在内的谱系传承
  rationale: 家谱体裁中的γεννάω可能容许跨代关系，但译文应保留原文的简洁陈述，不以解释性措辞预先消除历史张力。
- issue: 迁往巴比伦所指的是事件还是流亡时期
  choice: 正文译为“被掳迁往巴比伦之时”，以事件为重，同时保留时间范围的弹性
  alternative: 译为“流亡巴比伦期间”
  rationale: μετοικεσία既可着眼于强制迁移事件，也可延伸指相关的流亡时期；正文凸显强制迁移，脚注保留另一种理解。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；“正值……之时”与家谱文体相称，“被掳迁往”兼顾自然表达和原文的历史力度。
