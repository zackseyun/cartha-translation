id: MAT.21.32
reference: Matthew 21:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: zh_hans
  text: 因为约翰循着义的道路来到你们这里[a]，你们却不信他；税吏和妓女倒信了他。可是你们看见这事之后，竟也没有改变心意[c]，以致信他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “循着义的道路”也可译作“以合乎义的方式”或“行在义路上”。原文既可能描述约翰的生活和事工方式，也可能指他所宣告的义路。
    reason: lexical_alternative
  - marker: b
    text: “信他”也可译作“信任他”。原文动词既可表示相信某人的话，也可表示信任某人。
    reason: lexical_alternative
  - marker: c
    text: “改变心意”也可译作“后悔”或“悔悟”。这里的希腊语动词是μεταμέλομαι，不是新约中更常译作“悔改”的μετανοέω，较着重事后的心意改变或懊悔。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: 因为……来到
  rationale: γάρ说明前文责备的理由，译为“因为”能自然保留论证关系；ἦλθεν用普通叙事用语“来到”。
- source_word: πρὸς ὑμᾶς
  choice: 来到你们这里
  rationale: 表达πρός加宾格所指向听众而来的动作，也符合现代汉语习惯。
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: 循着义的道路
  rationale: 保留ὁδός的道路意象和δικαιοσύνη的“义”，同时不限定这话只指约翰的生活方式、事工方式或他所宣告的道路。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: 不信他／信了他
  rationale: πιστεύω加与格在此表示相信或信任某人；前后采用相同译法，以突出宗教领袖与税吏、妓女之间的对比。
- source_word: τελῶναι
  choice: 税吏
  rationale: 这是古代承包或代收税款者的常用汉语称呼，简洁并保留当时的社会身份。
- source_word: πόρναι
  choice: 妓女
  rationale: 直接表达该词所指以卖淫为业的女性，使用现代读者容易理解而不过分委婉的称呼。
- source_word: ἰδόντες
  choice: 看见这事以后
  rationale: 把不定过去时分词自然译成时间关系；“这事”指前句税吏和妓女相信约翰一事，是汉语为明确衔接所作的必要补足。
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: 后来还是没有改变心意
  rationale: 保留ὕστερον的时间含义和οὐδέ的递进语气；“改变心意”较准确地区分μεταμέλομαι与更常译作“悔改”的μετανοέω。
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: 去信他
  rationale: 此处属格不定式表达他们本应产生的结果或趋向，即改变心意而相信约翰。
theological_decisions:
- issue: δικαιοσύνη在“道路”意象中的含义
  choice: 义
  alternative: 公义；正义
  rationale: “义”既保留马太福音中δικαιοσύνη的道德及与神旨意相符的含义，也避免把它缩窄为社会司法意义。脚注保留该短语可指生活、事工或所宣告道路的歧义。
- issue: πιστεύω αὐτῷ所表达的回应
  choice: 信他
  alternative: 信任他；信靠他
  rationale: 经文直接描述人们对约翰及其信息的相信；“信他”不额外引入“信入”或完整救恩论表述。
- issue: μεταμέλομαι与悔改用语的区分
  choice: 改变心意
  alternative: 后悔；悔悟；悔改
  rationale: 该动词着重事后的心意改变或懊悔，并非新约较常用于“悔改”的μετανοέω；正文因此不将两者无差别地译成同一术语，同时由脚注说明其道德分量。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“却”和“倒”呈现原文两组人的鲜明对比，“还是”传达看见事实之后仍无转变的责备语气。正文保留“义的道路”这一圣经意象，并用脚注说明其真实歧义。
