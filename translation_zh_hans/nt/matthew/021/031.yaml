source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: zh_hans
  text: “这两个儿子中，哪一个遵行了父亲的旨意？”他们说：“第一个。”耶稣对他们说：“我实在告诉你们，税吏和娼妓正走在你们前面[a]，进入神的国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“比你们先进入神的国”。希腊原文直译为“走在你们前面”，强调先后次序，但不一定表明你们最终被排除在外。
    reason: 说明另一种自然译法，并保留προάγουσιν关于先行而非最终排除的语义张力。
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: 这两个儿子中，哪一个
  rationale: 保留ἐκ的部分范围含义；结合紧接上文所说的两个儿子补出“儿子”，使现代汉语自然清楚。
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: 遵行了父亲的旨意
  rationale: “遵行……的旨意”是自然、庄重的现代汉语，也保留ποιέω所表达的实际行动；“父亲”在此首先指比喻中的父亲。
- source_word: Ὁ πρῶτος
  choice: 第一个
  rationale: 保留希腊文简短的省略式回答，现代汉语无需重复“儿子”。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以通顺的现代汉语传达Ἀμὴν引出的郑重断言，同时保留第一人称宣告形式。
- source_word: τελῶναι
  choice: 税吏
  rationale: 这是福音书语境中对税收承包体系从业者的通行、简洁译法。
- source_word: πόρναι
  choice: 娼妓
  rationale: 准确指从事卖淫的女性，比泛译为“淫乱的女人”更贴近词义，也保持庄重语体。
- source_word: προάγουσιν ὑμᾶς
  choice: 正走在你们前面
  rationale: 保留现在时的进行意味和“走在前面”的动态意象，只表达先行，不擅自断定听众最终必被排除。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 进入神的国
  rationale: “进入”体现εἰς的方向性；“神的国”是清楚且通行的现代汉语表达。
theological_decisions:
- issue: προάγουσιν ὑμᾶς是否明确断言宗教领袖不能进入神的国
  choice: 正走在你们前面，进入神的国
  alternative: 比你们先进入神的国
  rationale: 原文动词的基本意象是“走在前面”。正文保留先行和次序上的警告，却不把它强化为听众最终必然被排除，从而保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵行了父亲的旨意”比机械的“做了父亲的意愿”自然；末句有意保留“走在前面”的移动意象，并用逗号连接其目标“进入神的国”。
