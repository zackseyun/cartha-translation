  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: zh_hans
  text: 这事发生，是要应验那借着先知所说的话[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由先知所说的话。”希腊文较直译为“借着先知”，突出先知作为传话的媒介。
    reason: 说明διά加属格在此可译为“借着”或“由”，并交代正文选择“借着”的语义重点。
lexical_decisions:
- source_word: Τοῦτο
  choice: 这事
  rationale: 中性单数指示代词概括紧接在前的整个事件；“这事”自然简洁，也不把单数扩展成“这些事”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接语气，并非强烈转折；现代汉语在上下文中无需另加“如今”或“但是”，即可自然衔接。
- source_word: γέγονεν
  choice: 发生
  rationale: γίνομαι的完成时在应验公式中表示事件已经发生并具有现实意义；“发生”符合现代叙事表达。
- source_word: ἵνα πληρωθῇ
  choice: 是要应验
  rationale: 保留ἵνα所含的目的／结果张力，并用“应验”表达被动式所指的经言得到实现；不强行限定为单一的目的或结果解释。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 将带冠词的被动分词按名词性结构处理，既保留“被说出”的含义，又符合现代汉语习惯。
- source_word: διὰ τοῦ προφήτου
  choice: 借着先知
  rationale: διά加属格在此表示媒介或代理；“借着”保留话语经由先知传达的意味。
- source_word: λέγοντος
  choice: 冒号引出下文引语
  rationale: 该分词用于引出随后引用的内容；汉语以“所说的话：”自然承担“说：”的功能，避免累赘的“所说的话，说”。
theological_decisions:
- issue: 应验公式中的先知角色
  choice: “要应验那借着先知所说的话”
  alternative: “要应验先知所说的话”或“要应验由先知所说的话”
  rationale: “借着先知”保留希腊文的媒介性：话语经由先知传达；同时不额外明说未在本节显式出现的说话主体。
- issue: ἵνα在应验公式中的目的与结果关系
  choice: “是要应验”
  alternative: “于是应验了”或“为要应验”
  rationale: “是要”既保留目的色彩，也允许读者感受到事件带来应验的结果，不将原文可能兼有的目的／结果关系单方面化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这事发生”简洁叙事；“借着先知”保留经由先知传话的意味。以冒号承接下一节引语，避免不自然地重复“说”。
