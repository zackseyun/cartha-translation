source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“我实在告诉你们：如果你们有信心，毫不疑惑[a]，不但能做这无花果树所经历的事，就是对这座山说：‘移开，投进海里！’也必成就。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毫不动摇”或“内心不摇摆”。
    reason: διακρίνω在此可表示疑惑、动摇或内心摇摆；脚注保存其词义幅度。
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣回答他们说
  rationale: 以自然现代汉语表达回应语气；δὲ在此是轻微的叙事转折，无须机械译出“但是”。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 保留耶稣郑重、权威的引言公式，同时符合现代汉语习惯。
- source_word: ἐὰν ἔχητε πίστιν
  choice: 如果你们有信心
  rationale: 此处πίστις指向对上帝信靠的信心，而非品格意义上的忠信。
- source_word: μὴ διακριθῆτε
  choice: 毫不疑惑
  rationale: 在此语境中表达内心疑惑或动摇；正文采用最清楚自然的说法，脚注保留其他语义色彩。
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: 不但能做这无花果树所经历的事
  rationale: 原文τὸ τῆς συκῆς是省略表达，回指紧邻上文无花果树发生的事；译文补足关系，但不具体解释其机制。
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: 就是对这座山说
  rationale: κἄν将论述推进到更惊人的例子；“就是”在汉语中自然承接“不但”，并保留递进强调。
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: 起来，投进海里
  rationale: 两个被动命令式在汉语直接命令中不宜生硬地译作“被举起、被投入”；此译保留山被移起并投入海中的鲜明动作意象。
- source_word: γενήσεται
  choice: 也必成就
  rationale: 表达所命令之事将会发生；“成就”庄重简洁，且不增加行为主体。
theological_decisions:
- issue: 神迹语境中πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 语境强调不疑惑的信靠，因此“信心”最贴切；“忠信”容易被理解为持久的品格特质。
- issue: 移山之言的性质
  choice: 保留原文的强烈形象，不限定为纯字面神迹或纯粹比喻
  alternative: 严格解释为山体迁移的应许；解释为克服困难的比喻
  rationale: 翻译应保留话语本身的张力和范围，不在正文中替读者作神学或修辞裁决。
- issue: 无花果树事件的表述
  choice: 这无花果树所经历的事
  alternative: 向无花果树所做的事；无花果树枯死的事
  rationale: 原文是省略结构；所选译法明确回指该事件，又避免把语法关系或事件解释得比原文更窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我实在告诉你们”保留经文宣告语体；整句维持原文的条件结构、递进和移山意象。
