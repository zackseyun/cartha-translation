id: MAT.21.26
reference: Matthew 21:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: zh_hans
  text: 但如果我们说：‘是出于人[a]’，我们又怕众人，因为他们都把约翰看作先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是源于人的。”
    reason: 说明ἐξ ἀνθρώπων表达人的来源或起源；替代译法可帮助读者理解这不是专指男性。
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: 但如果我们说
  rationale: ἐὰν加不定过去时虚拟语气表达一种可能的条件；“但如果我们说”自然地保留了他们权衡答案时的条件意味。
- source_word: Ἐξ ἀνθρώπων
  choice: 是出于人
  rationale: ἐξ表示来源，ἀνθρώπων泛指人类，与上文“出于天”形成鲜明对照；“出于人”简洁保留这种来源对比，并不专指男性。
- source_word: φοβούμεθα τὸν ὄχλον
  choice: 我们又怕众人
  rationale: φοβούμεθα在此为主动意义，τὸν ὄχλον指聚集的群众；“怕众人”直接表达他们对群众反应的畏惧，“又”使转折后的顾虑在汉语中更顺畅。
- source_word: πάντες
  choice: 他们都
  rationale: 承接“众人”，明确表达群众全体的共同看法。
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: 把约翰看作先知
  rationale: ἔχω加宾语及ὡς谓语成分在此表示把某人视为某种身份；这一译法自然保留评价意义，不额外断定叙述者的立场。
theological_decisions:
- issue: “出于天”与“出于人”的来源对比
  choice: 是出于人
  alternative: 是源于人的／是人定的
  rationale: 原文用极简短的ἐξ ἀνθρώπων与上文ἐξ οὐρανοῦ对举，重点在神圣来源与人间来源的区别。“出于人”既保留原文形式和张力，也避免把含义缩窄为仅仅“人所制定”。
- issue: 众人对约翰先知身份的看法
  choice: 他们都把约翰看作先知
  alternative: 他们都认定约翰是先知
  rationale: “看作”准确呈现本句所报告的群众评价，不把“认定”可能带出的更强确定语气加入原文，也不替叙述者进一步作神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于人”呼应上文“出于天”的简洁对照；“众人”符合福音书叙事语体，“把约翰看作先知”则是自然的现代汉语表达。
