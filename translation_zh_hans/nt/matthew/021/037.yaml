  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: zh_hans
  text: 但后来，他派他的儿子到他们那里，说：“他们会尊重[a]我的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们会敬重我的儿子。”此希腊语动词可表示尊重或表示敬意；在其他语境中也可表示“感到羞愧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: 后来
  rationale: 表示时间上的“后来、之后”；“后来”自然地承接前文次序，又不加入“最后”可能带有的终局意味。
- source_word: δὲ
  choice: 却
  rationale: δέ在此标示轻微转折和情节升级：先前派仆人，如今派儿子；“却”能自然体现这一转折。
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: 派到他们那里
  rationale: ἀποστέλλω表示“派遣”，πρός加宾格表示朝向某些人；此译符合现代汉语表达，并避免赋予该动词技术性的使徒含义。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 自己的儿子
  rationale: “自己的”清楚指明儿子与园主的关系，并在汉语中自然体现反身所属；不加入原文没有的“爱子”等修饰。
- source_word: λέγων
  choice: 说
  rationale: 分词引出园主所说的话；汉语叙事中简译为“说”最自然。
- source_word: Ἐντραπήσονται
  choice: 会尊重
  rationale: ἐντρέπομαι带直接宾语时，在此语境表示对某人表示敬重、顾忌或礼让；“尊重”清楚自然，同时以脚注保留“敬重”及该词与“羞愧”相关的语义范围。
- source_word: τὸν υἱόν μου
  choice: 我的儿子
  rationale: 保留说话者亲自表达的所属关系和亲情意味，不将普通的υἱός提前解释为称号。
theological_decisions:
- issue: 比喻中的“儿子”是否应按基督论所指作明示性翻译
  choice: 自己的儿子／我的儿子
  alternative: 爱子／圣子
  rationale: 比喻显然指向耶稣，但本节使用普通的υἱός，既无ἀγαπητός“所爱的”，也没有要求译成神学称号的语言标记。因此保留故事层面的普通称谓，让基督论含义由上下文显明。
- issue: 是否将园主的预期解释为敬拜
  choice: 尊重
  alternative: 敬畏／尊崇
  rationale: ἐντρέπομαι在此首先表达社会关系中的敬重或顾忌；译为“敬畏”或“尊崇”可能加入敬拜或宗教崇敬的意味，超过本句词义所必然表达的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“派到他们那里”准确表达方向；“尊重”是普通读者容易理解的核心义。脚注保留ἐντρέπομαι较宽的语义范围。
