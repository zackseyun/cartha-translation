  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: zh_hans
  text: 你们祷告时，无论求什么[a]，带着信心祈求，就必得着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡所求的”或“一切所求的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: 无论求什么
  rationale: πᾶς与ὅσος合用，构成范围全面而不限定具体内容的表达。“无论求什么”在现代汉语中自然地传达“凡所求的／一切所求的”之意。
- source_word: ἂν αἰτήσητε
  choice: 求
  rationale: ἄν与虚拟语气用于不定关系结构；汉语借“无论……什么”已表达这种不定性，无须另加“可能”。
- source_word: ἐν τῇ προσευχῇ
  choice: 祷告时
  rationale: 介词短语表示在祷告之中。“祷告时”自然清楚，也保留求告发生于祷告中的关系。
- source_word: πιστεύοντες
  choice: 存着信心
  rationale: 现在分词与“求”同时发生，描述祷告者求告时相信的状态。“存着信心”符合现代汉语，又没有像“只要相信”那样把分词明确改写成条件从句。
- source_word: λήμψεσθε
  choice: 就必得着
  rationale: 将来时表达确定的应许；“必得着”庄重而通顺。“就”承接前面的祷告与信心，但不另行界定应许的神学范围。
theological_decisions:
- issue: 信心与祷告蒙应允之间的关系
  choice: 用“存着信心”保留伴随性的分词表达
  alternative: 只要相信／如果你们相信
  rationale: 希腊文以现在分词把相信与祈求联系起来，而不是明用条件从句。译文因此不把两者的关系进一步规定为形式化条件，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并且”对应句首καί，并保留与上文的衔接；“得着”比口语化的“得到”更符合经文语体，但仍为当代读者所理解。
