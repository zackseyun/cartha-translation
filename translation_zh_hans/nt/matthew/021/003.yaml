id: MAT.21.3
reference: Matthew 21:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: zh_hans
  text: 如果有人对你们说什么，你们就说：‘主[a]需要它们。’他就会立刻送它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可译作“主人”。
    reason: 保留 κύριος 在此处可能具有的一般称谓意义。
  - marker: b
    text: 原文没有明说“他”指谁；较自然是指先前出言的人。“送它们”也可按语境理解为“让人把它们牵走”。
    reason: 说明第三人称主语的含混，并交代希腊语“送”在此语境中的可能表达。
lexical_decisions:
- source_word: ἐάν τις
  choice: 如果有人
  rationale: 保留不定条件的开放性，指任何可能出言干预的人。
- source_word: ὑμῖν
  choice: 对你们
  rationale: 明确保留第二人称复数，所指为受差遣的门徒。
- source_word: εἴπῃ τι
  choice: 说什么
  rationale: 按其宽泛含义翻译，不限定为询问或质问。
- source_word: ἐρεῖτε
  choice: 你们就说
  rationale: 以自然汉语表达将来时在此所具有的指示、吩咐语气。
- source_word: Ὁ κύριος
  choice: 主
  rationale: 既保留 κύριος 作为尊称或称号的分量，也不在正文中把它缩窄为动物的普通主人。
- source_word: αὐτῶν
  choice: 它们
  rationale: 复数代词回指上一节的母驴和驴驹；现代汉语以“它们”指动物。
- source_word: χρείαν ἔχει
  choice: 需要
  rationale: 自然、准确地表达“有需要”这一希腊语习语，避免生硬直译。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确表达行动毫不耽搁。
- source_word: ἀποστελεῖ αὐτούς
  choice: 他就会……送它们
  rationale: 保留“送”这一基本词义，不擅自加入“送回”、明确目的地或许可、释放等含义。
theological_decisions:
- issue: Ὁ κύριος 的所指与称谓力度
  choice: 主
  alternative: 主人
  rationale: “主”可承载耶稣自称时的权威和基督论意味，同时原词在语境中也可能按一般意义理解为“主人”；以脚注保留后一可能。
- issue: ἀποστελεῖ 的主语
  choice: 正文保留代词“他”
  alternative: 明确译为“那人”或理解为“主”
  rationale: 希腊语动词只以第三人称单数词尾标示主语，没有明说所指。较自然的语法衔接是先前出言的人，但正文不应消除这一含混。
translation_notes:
  register: 采用现代、简洁而庄重的叙事用语。“你们”保留复数；“说什么”保持宽泛；正文避免用“送来”“送回”或“释放”等词替原文补出方向或结果。
