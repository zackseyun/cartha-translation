source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: zh_hans
  text: 耶稣进了圣殿院内[a]，赶出所有在其中买卖的人；又推翻兑换钱币的人的桌子和卖鸽子的人的座位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿”或“圣殿区域”；希腊文这个词指较广的圣殿建筑群及其院落，并非专指内层圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: 圣殿院区
  rationale: 该词指整个圣殿建筑群及其院落，不专指内层圣所（ναός）。“圣殿院区”既自然清楚，也避免让读者误以为耶稣进入了圣所内部。
- source_word: ἐξέβαλεν
  choice: 赶了出去
  rationale: 保留动词所表达的强制、果断驱离，同时符合现代汉语叙事习惯。
- source_word: πάντας
  choice: 所有……的人都
  rationale: 明确保留原文涵盖范围，不弱化“所有”的语意。
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: 买卖的人
  rationale: 以现代汉语惯用的并列词“买卖”概括正在出售和购买的两类人，简洁且完整。
- source_word: τράπεζας
  choice: 桌子
  rationale: 采用该词在此处的普通具体含义，不额外译作柜台。
- source_word: κολλυβιστῶν
  choice: 兑换钱币之人
  rationale: 准确说明这些人的活动是兑换流通钱币；“钱币”比泛称“钱”更贴合历史场景。
- source_word: κατέστρεψεν
  choice: 掀翻
  rationale: 在家具语境中表达将其翻倒，生动而不误解为彻底毁坏。
- source_word: καθέδρας
  choice: 座位
  rationale: 保持原词较宽泛的含义，不武断限定为椅子或凳子。
- source_word: περιστεράς
  choice: 鸽子
  rationale: 该词可指鸽类；“鸽子”是现代汉语中自然且适合献祭背景的统称。
theological_decisions:
- issue: ἱερόν所指的空间范围与耶稣行动的地点
  choice: 译作“圣殿院区”，表明耶稣进入的是较广的圣殿范围，而非内层圣所。
  alternative: 笼统译作“圣殿”，不标明院区与圣所的区别。
  rationale: 原文使用ἱερόν而非通常特指圣所的ναός。译出空间区别有助于准确呈现历史场景，同时不增添经文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“院区”清楚表达圣殿建筑群及院落的范围；“掀翻”保留动作的力度，但不夸大为毁坏。句中保留“所有……都”，忠实呈现原文的范围。
