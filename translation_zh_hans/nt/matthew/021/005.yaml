  rationale: 将πῶλον由“驴驹”改为“幼畜”，以保留希腊词的概括性，并让后面的“负重牲口的幼崽”承担其说明作用。调整谓语和介词结构，使中文更自然，同时保留马太希腊文本的双重乘骑措辞。脚注b虽保留以供词义参照，但原草稿未在正文设置[b]锚点；为避免无锚点脚注，完整修订脚注集不保留该未锚定项目。
