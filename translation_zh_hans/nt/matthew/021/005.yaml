reference: Matthew 21:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: zh_hans
  text: '要对锡安的女儿说[a]：


    “看哪，你的王正来到你这里；


    他是温柔的，骑在驴上，


    又骑在一头幼畜上，就是负重牲口的幼崽[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锡安的女儿”是先知书中对锡安的拟人称呼，并由此指向锡安。
    reason: cultural_background
  - marker: c
    text: 马太保留了先知引文中两个相连的乘骑表达：“骑在驴上，又骑在一头幼畜上，就是负重牲口的幼崽。”这里不把原文的双重措辞合并。
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: 要……说
  rationale: 不定过去时主动命令语气复数，表达对多人发出的指令；结合引文结构译为“要对……说”，自然且保留命令力量。
- source_word: τῇ θυγατρὶ Σιών
  choice: 锡安的女儿
  rationale: 保留先知文本中把锡安人格化的称呼，不将其解释性地改写为“锡安的居民”或“耶路撒冷人”。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的指示词，“看哪”在现代中文圣经语体中庄重而易懂，比单纯“看”更能体现宣告意味。
- source_word: ὁ βασιλεύς σου
  choice: 你的王
  rationale: 直接保留第二人称所属关系及君王称号，不额外明说其弥赛亚身份。
- source_word: ἔρχεταί σοι
  choice: 正来到你这里
  rationale: 现在时带有生动、临近的动态感；“来到你这里”明确表达 σοι 的趋向或受益关联，同时避免略去重复出现的第二人称。
- source_word: πραῢς
  choice: 温柔
  rationale: 该词可指温柔、谦和或谦卑；“温柔”在此自然地表现君王不强暴、不张扬的品格，同时以脚注保留“谦和／谦卑”的可能。
- source_word: ἐπιβεβηκὼς
  choice: 骑着
  rationale: 完成时主动分词表示已经骑上而处于乘骑状态；中文“骑着”简洁自然，能统摄后面的两个并列介词短语。
- source_word: ἐπὶ ὄνον
  choice: 骑着驴
  rationale: 按其通常意义直译，并维持与后面“又骑着驴驹”的并列形式。
- source_word: πῶλον
  choice: 驴驹
  rationale: πῶλος 指幼畜；上下文由 υἱὸν ὑποζυγίου 进一步限定。中文直接译“驴驹”清楚自然，也符合此处先知性引文的语境。
- source_word: υἱὸν ὑποζυγίου
  choice: 负重牲口的崽子
  rationale: 保留闪语式“……之子”所表达的幼畜关系及 ὑποζύγιον 的负重牲畜含义；“崽子”在现代中文中比字面的“儿子”更适用于动物，同时不将“负重牲口”过度限定为驴。
theological_decisions:
- issue: 如何处理撒迦利亚书9:9背景下 πραῢς 的含义
  choice: 正文译“温柔”，脚注列出“谦和”或“谦卑”
  alternative: 正文译“谦卑”或“谦和”
  rationale: 马太的希腊词本身容许温柔、谦和及谦卑等语义。正文选用自然且能体现君王非强制性品格的“温柔”，但不以此排除先知文本语境中的谦卑含义。
- issue: 是否把两个乘骑短语合并为同一头动物的单一表达
  choice: 保留“骑着驴，又骑着驴驹”的双重并列表述
  alternative: 合并为“骑着驴驹”或解释为“骑着驴，就是驴驹”
  rationale: 马太的希腊文本明确保留 καὶ 连接的两个 ἐπί 短语。翻译不应为消除解释上的张力而擅自合并，也不应强行判定二者为同位关系；脚注说明这是先知引文的双重措辞。
- issue: 是否在正文中明说这是弥赛亚君王
  choice: 仅译“你的王”
  alternative: 译为“你的弥赛亚君王”
  rationale: 经文在叙事和先知引文背景中具有弥赛亚意义，但希腊正文只写“你的王”；翻译保留原文表达，不把神学推论加入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“看哪”保留先知宣告的语气；“正来到你这里”体现生动临近感。正文保留“锡安的女儿”和两个并列乘骑短语，以维护原文意象及其解释张力；较不直观之处由脚注说明。
