id: MAT.21.46
reference: Matthew 21:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: zh_hans
  text: 他们想要逮捕耶稣，却害怕众人，因为众人把他看作先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: 想要
  rationale: 现在时分词表达持续的意图；结合主句，以“想要……却……”自然呈现其行动意图与因惧怕而受阻之间的转折关系。
- source_word: κρατῆσαι
  choice: 逮捕
  rationale: 在敌对的叙事语境中，此词指强行拘拿某人；“逮捕”比单纯的“抓住”更准确地传达这里的行动目的。
- source_word: ἐφοβήθησαν
  choice: 害怕
  rationale: 简洁保留不定过去时的陈述，不额外加入“开始”等起始体含义。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 指聚集的民众；“众人”是现代中文叙事中自然、庄重的表达，也可涵盖希腊文复数所指的人群。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 明确引出他们害怕众人的原因。
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: 众人把他看作先知
  rationale: 按惯用结构译为“把……看作……”，表达民众对耶稣的认定；补出“众人”以消除中文连续代词可能造成的指代歧义。
- source_word: προφήτην
  choice: 先知
  rationale: 中文类属名词通常无需不定冠词；此译法表达众人将耶稣归入先知之列。
theological_decisions:
- issue: 如何表达众人对耶稣是“先知”的认定，而不越过本节对其身份作进一步界定
  choice: 众人把他看作先知
  alternative: 众人认为他是先知
  rationale: 经文是在报告众人的看法，并非对耶稣完整身份作穷尽性定义；“看作”保留叙事视角，既不把众人的判断直接变成旁白的完整断言，也不暗示耶稣仅仅是先知。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“想要……却……”清楚呈现意图与畏惧之间的张力；重复“众人”而不连续使用“他们”，以确保指代清晰。
