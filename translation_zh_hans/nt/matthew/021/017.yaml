id: MAT.21.17
reference: Matthew 21:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: zh_hans
  text: 他离开他们，出了城，往伯大尼去，在那里过夜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那里住宿”或“在那里住了一夜”。
    reason: 词义可涵盖住宿或度过一夜；正文采用简洁自然的“过夜”。
lexical_decisions:
- source_word: καταλιπὼν
  choice: 离开
  rationale: 不定过去时分词表示这一行动先于主要动词发生；“离开”在现代汉语中自然简洁，也不必生硬地译出“已经”。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 直译代词，并保留其指向上文在场之人的语境关联，不额外限定身份。
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: 出了城
  rationale: 动词与介词结构共同强调离开城内；“出了城”以自然汉语表达这一方向，不造成不必要的重复。
- source_word: πόλεως
  choice: 城
  rationale: 此处所指为耶路撒冷；“城”符合叙事语境，也比“城市”更自然庄重。
- source_word: εἰς Βηθανίαν
  choice: 往伯大尼去
  rationale: 表达εἰς所指的移动方向；此译法自然，并没有过度强调进入村内。
- source_word: ηὐλίσθη
  choice: 过夜
  rationale: 该动词在此表示住宿、度过夜晚；“过夜”简明地保留其时间含义。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 明确回指伯大尼，符合现代汉语表达习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。句序基本保留原文动作推进：离开他们、出城、前往伯大尼、在那里过夜。脚注标记置于其实际说明的“过夜”之后。
