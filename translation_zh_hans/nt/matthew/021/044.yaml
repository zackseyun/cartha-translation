review_pass:
  verdict: approve
  source_fidelity: 译文准确保留了两幅方向相反的画面：人跌在石头上而受损，以及石头落在人身上而将其毁坏。“凡……的”恰当地表达带冠词分词的泛指格言语气；“这块石头”忠实保留 λίθος 的具体意象。“必摔得粉碎”自然传达 συνθλασθήσεται 的严重破碎结果，并与后句“压碎”保持适度区分。“这石头落在谁身上，就必把谁压碎”准确反映后半句中石头成为落下动作的主语，以及不定关系结构的开放指向。
  naturalness: 正文为自然、庄重且易懂的现代标准汉语。“凡跌在……上的，必……”和“……落在谁身上，就必把谁……”具备适合本段格言式宣告的节奏。重复“谁”在汉语中清楚地建立回指关系，无需添加性别代词。
  terminology: “石头”与上下文意象一致，且没有把其所指解释性地加入正文。“压碎”在石头下落的具体图像中通顺有力；脚注适当地保留 λικμήσει 所可能包含的“碾成粉末”及扬散意象。脚注也准确、克制地说明本节在部分马太抄本中缺失，并指出路加福音20:18的平行经文。
