  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: zh_hans
  text: 凡跌在这块石头上的，必摔得粉碎；这石头落在谁身上，就必把谁压碎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有本节；路加福音20:18有内容相近的经文。“压碎”也可理解为“碾成粉末”或“像糠秕一样吹散”。
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: 凡跌……的
  rationale: 带冠词的分词作名词使用，泛指任何一个符合此情形的人；“凡……的”在现代汉语中自然地保留了单数格言式的普遍意味。
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: 在这块石头上
  rationale: 按空间关系直译，并保留“石头”的具体意象，使其与上文的石头比喻相连。
- source_word: συνθλασθήσεται
  choice: 必摔得粉碎
  rationale: 表达将遭受严重碎裂的被动结果；“摔得”也自然对应人跌在石头上的撞击情景，并与后句石头主动“压碎”有所区别。
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: 这石头落在谁身上
  rationale: 保留撞击方向的反转：前句是人跌在石头上，后句则是石头落在人身上；“谁”传达不定关系结构的开放范围。
- source_word: λικμήσει
  choice: 必把谁压碎
  rationale: 该词可指彻底碾碎或如扬糠般吹散；在石头落下的语境中，“压碎”清楚有力，同时不把可能的扬净意象强行写入正文。
- source_word: αὐτόν
  choice: 谁
  rationale: 汉语以“落在谁身上，就必把谁……”回指同一人，准确保留单数泛指关系，无须另加有性别的代词。
theological_decisions:
- issue: 石头意象与审判比喻
  choice: 保留具体的“石头”以及人跌石上、石落人身的双重意象，不在正文中明说石头所指。
  alternative: 在正文中直接解释石头为弥赛亚或耶稣，或将两个动词统一译成笼统的“毁灭”。
  rationale: 上下文会引导读者理解石头的身份，但本节本身以格言式图像说话；保留原有比喻，可避免把解释加入译文，也保留两个动作的张力。
- issue: 本节的抄本存疑
  choice: 正文收入本节，并以脚注说明部分抄本缺少此节。
  alternative: 从正文删除，或不提示文本异文。
  rationale: SBLGNT将整节以文本存疑符号标出；译文应如实呈现该节，同时让读者知道其抄本证据存在重要差异，且路加福音20:18有平行经文。
- issue: λικμήσει的语义幅度
  choice: 正文译作“压碎”，不确定的更强烈图像在脚注中说明。
  alternative: 正文定译为“碾成粉末”或“像糠秕一样吹散”。
  rationale: 该动词既可唤起粉碎，也可能带有扬净、吹散的意象；正文采用适合石头语境且不排除彻底毁坏意味的表达，脚注保留词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的……；……谁……就……”具有格言式节奏；“摔得粉碎”与“压碎”分别呈现两个希腊动词，并清楚表现撞击方向的反转。脚注标记置于全节末，兼顾整节文本异文与后一个动词的词义说明。
