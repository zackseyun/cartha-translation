id: MAT.21.25
reference: Matthew 21:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: zh_hans
  text: “约翰的洗礼是从哪里来的？是从天上来的[a]，还是从人来的[b]？”他们彼此商议说：“如果我们说‘是从天上来的’，他就会问我们：‘那么，你们为什么不信他呢？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“从上帝来的”。原文作“从天上来的”，是对神圣来源或授权的一种敬称。
    reason: lexical_alternative
  - marker: b
    text: “从人来的”指来源于人，与来自天上的神圣来源相对；这里的“人”泛指人类，并非专指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 这里指约翰所施行并代表的洗礼，而不只是正在进行的施洗动作；“洗礼”是现代汉语中准确、自然且通行的表达。
- source_word: τὸ Ἰωάννου
  choice: 约翰的
  rationale: 属格表明这洗礼与约翰相关，由他施行；汉语所有格结构简洁自然。
- source_word: πόθεν ἦν
  choice: 是从哪里来的
  rationale: πόθεν询问来源或根源；这一译法既保留来源之问，也符合现代汉语习惯。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 直译“从天上”，保留原文以“天”敬称上帝、指向神圣来源或授权的表达，不在正文中直接改译为“从上帝来的”。
- source_word: ἐξ ἀνθρώπων
  choice: 从人来的
  rationale: ἀνθρώπων泛指人类，与“从天上来的”构成来源上的对比，并非专指男性。
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: 彼此商议
  rationale: 未完成时表示持续的权衡和讨论；“彼此商议”自然传达他们在群体内部反复盘算。
- source_word: Ἐὰν εἴπωμεν
  choice: 如果我们说
  rationale: 自然表达原文条件句，不额外加强其假设程度。
- source_word: ἐρεῖ ἡμῖν
  choice: 他就会问我们
  rationale: 原文λέγω字面为“说”，但随后内容是直接问句；汉语用“问”能自然引出该问题，同时不改变言语行为。
- source_word: Διὰ τί οὖν
  choice: 那么，为什么
  rationale: “那么”保留οὖν由前一假设答案推出质问的论证力量。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: 你们为什么不信他
  rationale: πιστεύω加与格在此表示相信约翰、接受他的信息与权威；“信他”简洁并保留一定语义张力。
theological_decisions:
- issue: “从天上来”的神学指向
  choice: 正文保留“从天上来的”
  alternative: 从上帝来的
  rationale: 原文使用“天上”作为对神圣来源或授权的敬称。直译可保留其表达方式及与“从人来”的修辞对照，脚注再说明其含义。
- issue: “从人来”的所指范围
  choice: 从人来的
  alternative: 出于人的／从人那里来的
  rationale: 这里所对比的是仅仅出于人的来源和来自天上的来源，并非讨论性别；“人”在现代汉语中可自然泛指人类。
- issue: “信他”的含义
  choice: 保留“信他”
  alternative: 相信他的话／信任他
  rationale: 原文可能同时涉及相信约翰本人、接受其宣讲和承认其权威；不把宾语具体化，可保留这一语义宽度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问答结构清楚直接；“彼此商议”保留宗教领袖内部权衡的语气。“从天上来的／从人来的”形成整齐对照，并通过脚注解释其文化与神学含义。
