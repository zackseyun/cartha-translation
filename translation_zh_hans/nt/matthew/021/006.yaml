  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: zh_hans
  text: 门徒就去了，照耶稣吩咐他们的那样做了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“门徒就去了，照耶稣命令他们的那样做了。”希腊语动词既可指下达命令，也可指作出指示；这里的上下文较支持“吩咐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: 去
  rationale: 不定过去时分词在此表示先于主句动作发生的行动；汉语叙事用“去”自然呈现，不必形式化译为“去了以后”。
- source_word: δὲ
  choice: 就
  rationale: δέ在此承接上文，并显示门徒响应耶稣先前吩咐的叙事进展；“就”符合现代汉语表达。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书语境中μαθηταί的标准译法，指跟随耶稣并向他学习的人。
- source_word: ποιήσαντες
  choice: 做了
  rationale: 该分词与πορευθέντες并列，概括门徒执行吩咐的行动；“做了”简洁自然，并与后面的“照……的”搭配。
- source_word: καθὼς
  choice: 照
  rationale: 表示行动与耶稣的吩咐相符合；汉语“照……做”自然地保留这一对应关系。
- source_word: συνέταξεν
  choice: 吩咐
  rationale: συντάσσω可指下达命令或作出指示；此处耶稣先前给出具体安排，“吩咐”既体现权威性，也不显得过度强硬。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 作为συνέταξεν的间接宾语，汉语自然表达为“吩咐他们”。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 按现代中文圣经人物名称的通行译法处理，希腊语冠词无需另译。
