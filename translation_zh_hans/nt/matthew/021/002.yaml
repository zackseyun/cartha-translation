  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: zh_hans
  text: 对他们说：“你们到你们对面的村子去[a]，马上会发现一头拴着的母驴，和一头同它在一起的驴驹[b]。把它们解开，牵到我这里来[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们对面的”也可译作“你们前面的”。
    reason: lexical_alternative
  - marker: b
    text: “驴驹”指幼小的驴。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“解开以后，牵到我这里来”；这里译成两个接续的命令，以符合现代汉语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 对他们说
  rationale: 以自然的现代汉语保留分词引出耶稣话语的功能；本节承接上文，汉语无需勉强复制希腊语分词结构。
- source_word: Πορεύεσθε
  choice: 去
  rationale: 在命令语境中，简洁的“去”最自然，准确表达前往某处的意思。
- source_word: κώμην
  choice: 村子
  rationale: κώμη通常指规模小于城的村落；“村子”是普通读者易懂的现代汉语。
- source_word: κατέναντι ὑμῶν
  choice: 你们对面的
  rationale: 保留该短语的空间关系；原词也可理解为“你们前面的”，故加注说明。
- source_word: εὐθέως
  choice: 马上
  rationale: 准确表达εὐθέως的即时性，比“立即”略口语而仍适合庄重叙事。
- source_word: ὄνον δεδεμένην
  choice: 一头拴着的母驴
  rationale: δεδεμένην表示处于被拴住的状态；ὄνον及其修饰语为阴性，随后αὐτῆς也指向雌性个体，因此译作“母驴”可在汉语中清楚呈现。
- source_word: πῶλον μετ’ αὐτῆς
  choice: 一头驴驹和它在一起
  rationale: πῶλος泛指幼畜，在本语境中是幼驴；“驴驹”简明准确。“和它在一起”保留μετά所表达的相伴关系。
- source_word: λύσαντες
  choice: 把它们解开
  rationale: 该不定过去时分词与后面的命令构成先后相接的动作；汉语用并列命令最自然。复数宾语由下一个复数命令及前述两头牲畜明确得出。
- source_word: ἀγάγετέ μοι
  choice: 牵到我这里来
  rationale: ἄγω用于牲畜可指带领或牵引；“牵来”符合汉语场景，并准确表达朝说话者而来的方向。
theological_decisions: []
translation_notes:
  register: 采用自然、清楚而庄重的现代标准汉语。“母驴”呈现希腊文的阴性指称，也使后文驴驹与它相伴的关系更清楚；命令句保持简洁有力。脚注标记均放在所说明的词句之后。
