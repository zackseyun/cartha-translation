  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“经上记着：‘我的家必称为祷告之家。’你们却把它变成强盗[b]的巢穴。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里结合了以赛亚书56:7和耶利米书7:11。
    reason: cross_reference
  - marker: b
    text: “强盗”也可译作“匪徒”；希腊词可指抢劫者或以暴力劫掠的匪帮成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时增强现场感；现代汉语动词本身不标时态，“说”可自然承载这一叙事功能，无须强加过去时或另加“这时”。
- source_word: Γέγραπται
  choice: 经上记着
  rationale: 体现完成时被动式所表达的“已经写下并持续有效”，也是现代汉语引述经文时自然、庄重的说法。
- source_word: οἶκός μου
  choice: 我的家
  rationale: 保留 οἶκος 的基本意象和引文中的所有格；“殿”虽符合语境，却会把原文较宽的“家／房屋”提前限定为圣殿。
- source_word: οἶκος προσευχῆς
  choice: 祷告之家
  rationale: 以自然而庄重的汉语表达属格结构，同时重复“家”的意象，使以赛亚书引文的结构清楚可辨。
- source_word: κληθήσεται
  choice: 必称为
  rationale: 直接表达将来被动意义；“必”在经文引语中自然，也传达宣告的确定性，但不额外解释是谁命名。
- source_word: ποιεῖτε
  choice: 把它变成了
  rationale: 采用现代汉语自然的处置式结构，表达对方正在造成且已呈现的结果；相较“使它成为”，语气更贴近日常而仍保持庄重。
- source_word: σπήλαιον
  choice: 巢穴
  rationale: 在此不是单指天然洞穴，而是强盗藏身之处；“巢穴”自然传达窝藏、藏匿的负面意象，并保留耶利米书典故的力度。
- source_word: λῃστῶν
  choice: 强盗
  rationale: 该词可指抢劫者，也可指以暴力劫掠的匪徒；“强盗”是简洁、常用且能涵盖暴力意味的对应词，另以脚注提示可能译法。
theological_decisions:
- issue: 旧约引文与典故
  choice: 保留“我的家必称为祷告之家”和“强盗的巢穴”两组可辨认的经文措辞
  alternative: 采用更自由的现代改写，如“这里本该是人祷告的地方，你们却拿它当贼窝”
  rationale: 耶稣的话结合了以赛亚书56:7和耶利米书7:11；保留两处意象可使经文之间的联系及其先知性指控保持透明。
- issue: οἶκος 的圣殿语境
  choice: 译作“家”，不在正文直接释为“圣殿”
  alternative: 译作“殿”或“圣殿”
  rationale: 上下文明确指圣殿，但引文原词仍是“家／房屋”；保留“家”既符合“神的家”这一经文意象，也避免把语境解释取代原文字面表达。
- issue: λῃστῶν 所指群体的性质
  choice: 正文译作“强盗”，脚注保留“匪徒”的可能性
  alternative: 正文直接译作“匪徒”或“暴徒”
  rationale: 原词语义可涵盖一般抢劫者与暴力匪帮，不宜在正文中把身份限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经上记着”保留正式的经文引述语气；“祷告之家”和“强盗的巢穴”维持两处旧约文本的互文联系。标点将以赛亚书引文独立出来，并把互文脚注置于该引文之后；词义脚注紧随“强盗”。
