base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: zh_hans
  text: 在圣殿区[a]里，盲人和瘸腿的人来到耶稣跟前，他治好了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“圣殿区”指整个圣殿建筑群或院区，并非专指内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: 来到耶稣跟前
  rationale: προσέρχομαι与人称代词的与格连用，表示朝某人走近；“来到耶稣跟前”在现代汉语中自然，也明确交代代词所指。
- source_word: τυφλοὶ καὶ χωλοὶ
  choice: 盲人和瘸腿的人
  rationale: 两个形容词均作名词使用，指相应的人群。“盲人和瘸腿的人”准确、易懂，并避免使用可能带贬义的旧式称呼。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区里
  rationale: ἱερόν在此通常指整个圣殿建筑群或其院区，而非专指内殿；“圣殿区”直接保留这一空间范围。
- source_word: ἐθεράπευσεν αὐτούς
  choice: 他就治好了他们
  rationale: θεραπεύω在福音书医治叙事中意为治愈；“治好了”自然表达医治的实际结果。
theological_decisions:
- issue: 医治发生地点中ἱερόν的范围
  choice: 圣殿区，即较广的圣殿建筑群或院区
  alternative: 圣殿；圣殿院内
  rationale: 原文使用ἱερόν而非通常专指内殿的ναός，因此不应使读者误以为这些人进入了内殿。“圣殿区”较准确，同时不进一步断定具体是哪一重院落。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。语序将地点置于句首，以流畅呈现场景；用“耶稣”明确原文代词所指。“瘸腿的人”较口语可懂，同时保持叙事尊严。
