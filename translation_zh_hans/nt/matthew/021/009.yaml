id: MAT.21.9
reference: Matthew 21:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: zh_hans
  text: 走在耶稣前面的群众和跟在后面的人不断高喊：“和散那[a]归于大卫之子[b]！奉主名而来的，是当受称颂的[c]！至高之处，和散那！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和散那”源自希伯来语，意思近于“求你拯救”或“现在拯救”；在这里，它也用作赞颂的欢呼。
    reason: lexical_alternative
  - marker: b
    text: “大卫之子”是具有君王性和弥赛亚含义的称号。
    reason: cultural_note
  - marker: c
    text: 这句话呼应《诗篇》118:26；该处希伯来文本中的“主”对应神名YHWH。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: 群众
  rationale: “群众”是自然、现代的汉语，准确表达聚集的大群人，也适合游行队伍的场景。
- source_word: οἱ προάγοντες αὐτὸν καὶ οἱ ἀκολουθοῦντες
  choice: 走在耶稣前面的群众和跟在后面的人
  rationale: 明确前后两组人在行进中的位置；补出“耶稣”比使用代词更符合汉语表达，也不暗示前面的人正式带领他。
- source_word: ἔκραζον λέγοντες
  choice: 不断高喊
  rationale: 以“不断”体现未完成过去时所表示的持续或反复动作；汉语无需机械保留“说”，引号已自然引出喊话内容。
- source_word: Ὡσαννά
  choice: 和散那
  rationale: 保留已进入汉语基督教传统的音译，以呈现其礼仪性欢呼功能；其源自希伯来语的祈求含义在脚注说明。
- source_word: τῷ υἱῷ Δαυίδ
  choice: 归于大卫之子
  rationale: “归于”可自然连接颂赞式呼喊与领受者，同时保留与格的方向；“大卫之子”原样保存君王及弥赛亚称号。
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: 那一位是当受称颂的
  rationale: 保留分词所指的单数人物，并以庄重而自然的现代汉语表达祝颂含义。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名而来
  rationale: “奉……名”是自然且准确的汉语表达，保留代表主、凭主权柄而来的含义及诗篇引文的措辞。
- source_word: ἐν τοῖς ὑψίστοις
  choice: 响彻至高之处
  rationale: “至高之处”保留复数形式所指的最高天界而不过度具体化；补入“响彻”使汉语中的欢呼语义完整，并避免令人误解为向至高者发出“拯救”的请求。
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ中的弥赛亚君王称号
  choice: 在正文保留“大卫之子”这一称号
  alternative: 译作“弥赛亚”
  rationale: 希腊文本使用的是大卫谱系的称号，而非“弥赛亚”一词；保留原称号可维持其历史和神学张力，不把解释直接写入正文。
- issue: Ὡσαννά的祈求含义与赞颂功能
  choice: 正文音译为“和散那”，脚注说明其词源意义
  alternative: 正文译为“求你拯救”或“现在拯救”
  rationale: 在此处，该词既承载希伯来语祈求的背景，也已成为礼仪性的欢呼；音译并加注可以同时保留两方面，而不将其单纯化为求救或赞美。
- issue: 诗篇引文中κυρίου的所指
  choice: 正文译作“主”，脚注交代希伯来文本中的神名背景
  alternative: 正文译作“耶和华”或“上主”
  rationale: 新约希腊文本写的是κύριος，直译为“主”最为稳妥；其所引用的诗篇希伯来文本使用神名YHWH，适合在脚注中说明而不取代正文希腊措辞。
- issue: ἐν τοῖς ὑψίστοις的空间含义
  choice: 译作“至高之处”，不明确增译“天上”
  alternative: 译作“至高的天上”
  rationale: 此语很可能指最高的天界，但原文表达较为凝练；“至高之处”既保留礼仪语气，也避免超出文本明确程度。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“不断高喊”呈现持续动作；两个“和散那”保留礼仪呼喊的节奏。正文中的[a]、[b]、[c]均紧随相应词句，脚注不替正文消除词源、称号和神名背景中的张力。
