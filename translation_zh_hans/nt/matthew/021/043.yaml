  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: zh_hans
  text: 所以我告诉你们，神的国必从你们那里夺去，赐给一个结出属于神的国的果实的民族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个民”。希腊语ἔθνος可指国家、民族或一个民众群体；本句以是否结出果实来刻画这个群体，却没有更具体说明其身份。
    reason: 说明词义范围，并避免将这个群体过早限定为某一特定族群或神学身份。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 承接前面的比喻和引文，引出由此得出的结论；“所以”简洁自然，保留推论关系。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 准确表达第一人称对复数听众的直接宣告，也符合现代汉语习惯。
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: 必从你们那里夺去
  rationale: 保留将来被动和与受话者分离、失去的含义；“夺去”也传达审判语境中的力度。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 沿用准确而通行的表达，兼容神的统治及其领域等语义，不将其缩减为抽象的“王权”或某种特权。
- source_word: δοθήσεται
  choice: 赐给
  rationale: 与前一被动动词相呼应；汉语无需重复“必被”，而“赐给”自然表达由神授予。
- source_word: ἔθνει
  choice: 一个民族
  rationale: 保留该词所指的群体性接受者，不在正文中将其具体认定为教会、外邦人或以色列余民；另以脚注说明也可译作“一个民”。
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: 结出神国果实的
  rationale: 分词描述这个群体持续表现出的特征；“结出……果实”在汉语中自然保留果实隐喻，并明确阴性代词αὐτῆς最自然地回指“国”。
theological_decisions:
- issue: ἔθνει所指的群体
  choice: 正文泛译为“一个民族”，不进一步指明其身份。
  alternative: 明确译为教会、外邦人，或包括耶稣门徒在内的更新之神子民。
  rationale: 原文强调的是一个以结出果实为特征的群体，却没有在本句中作更狭窄的身份界定；保持开放可避免把后来的宗派解释或取代论结论写入正文。
- issue: “神的国”在审判宣告中的含义
  choice: 保留“神的国”。
  alternative: 释义为“神的统治”或“属于神子民的特权”。
  rationale: 原文措辞具有较完整的神学语义范围；释义会把本句的审判对象限定得比希腊文更窄。
- issue: αὐτῆς所指
  choice: 译为“神国果实”，按语法将代词理解为回指“神的国”。
  alternative: 以“其果实”保留汉语表面上的指代含混，或理解为该民族自己的果实。
  rationale: 希腊文阴性单数代词与阴性单数的βασιλεία一致，而ἔθνει为中性单数，因此最自然的语法回指是“神的国”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“夺去”保留审判宣告的力度；“结出神国果实”延续上下文的果实意象。脚注标记置于其实际解释的“民族”之后。
