  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: zh_hans
  text: 耶稣却回答他们：“我也要问你们一个问题[a]。你们若回答我，我也会告诉你们，我凭什么权柄做这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“问你们一件事”；λόγον ἕνα较直译为“一个词”或“一句话”。希腊语 λόγον ἕνα 在这里可指一个问题或一件所谈论的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣却回答他们
  rationale: 将分词与主要动词合并为自然的汉语叙事表达；“却”体现 δέ 在争辩语境中的轻微转折。
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: 我也要问你们
  rationale: “也”保留 κἀγώ 所表达的对等回应：他们既盘问耶稣，耶稣也反问他们。
- source_word: λόγον ἕνα
  choice: 一个问题
  rationale: λόγος 本可指“话”或“事情”，但在 ἐρωτάω 引出的语境中指所要提出的问题；译作“一个问题”最符合现代汉语。
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: 你们若回答我
  rationale: 直译近于“你们若告诉我”；在问答语境中，“回答我”准确传达条件句的实际含义。
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: 我也会告诉你们
  rationale: 保留第二个 κἀγώ 的互惠意味，并以自然汉语表达 ἐρῶ。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: ἐν 在此表达行动所依据的授权；“凭什么权柄”既自然，又保留 ἐξουσία 的权威与授权含义。
- source_word: ταῦτα ποιῶ
  choice: 做这些事
  rationale: 保留 ταῦτα 的复数指向，泛指当时受到质疑的那些行动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄”比单纯的“权力”更能表达获得授权而行动的含义，也符合本段宗教与公开质询的语境。句子分为两句，以便普通读者清楚把握条件关系，同时不改变原文逻辑。
