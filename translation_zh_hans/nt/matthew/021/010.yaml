id: MAT.21.10
reference: Matthew 21:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: zh_hans
  text: 耶稣进入耶路撒冷时，全城都轰动了[a]，人们说：“这是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“震动了。”原文动词既可指实际的摇动，也可像这里一样形容人群受到震动而骚动。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: 耶稣进入……时
  rationale: 属格独立结构表达时间关系；译作“进入……时”自然且不把先后关系说得过细。代词按本段明确所指译为“耶稣”，避免中文句首所指不清。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般中文通行的地名译法。
- source_word: ἐσείσθη
  choice: 轰动了
  rationale: 该动词本义为“震动、摇动”，此处用于全城对耶稣进城的集体反应。“轰动了”在现代汉语中自然表达全城受到强烈震动与骚动，同时以脚注保留较直译的可能。
- source_word: πᾶσα ἡ πόλις
  choice: 全城
  rationale: 简洁自然地表达“整个城”的集合意义，并可转喻城中居民。
- source_word: λέγουσα
  choice: 人们说
  rationale: 希腊文以单数分词配合“城”这一集合名词；中文补出“人们”，明确实际发话者，又不改变其集体反应。
- source_word: Τίς ἐστιν οὗτος;
  choice: 这是谁？
  rationale: 直接保留原文简短问句，不增添原文没有的“人”等成分。
theological_decisions:
- issue: 全城反应是字面震动还是比喻性骚动
  choice: 正文译为“全城都轰动了”，按语境表达公众受到强烈震动、产生骚动。
  alternative: “全城都震动了”
  rationale: 上下文描述耶稣进城引发的公众反应，并未明确叙述地震；正文采用自然的比喻义，但脚注保留原动词“震动”的形象和潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全城都轰动了”符合当代用法；“人们说”自然展开希腊文以“城”为主语的集合表达。
