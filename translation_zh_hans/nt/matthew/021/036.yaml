  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: zh_hans
  text: 他又差派了另一批仆人[a]，人数比先前那一批更多；佃户也照样对待他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”。希腊语δοῦλος可按语境指“仆人”或“奴仆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示行动再次发生；“又”符合现代汉语叙事习惯，简洁自然。
- source_word: ἀπέστειλεν
  choice: 差派了
  rationale: 表达主人有目的地派出属下，比单用“派了”略显庄重，也保留ἀποστέλλω在此处的使者性语感。
- source_word: ἄλλους δούλους
  choice: 另一批仆人
  rationale: ἄλλους指另外的人，而后文又比较人数，因此译作“另一批”最自然。δοῦλος在此寓言中强调受主人差遣的身份，正文采用“仆人”，并以脚注保留“奴仆”这一词义可能。
- source_word: πλείονας τῶν πρώτων
  choice: 人数比先前那一批更多
  rationale: 该比较结构说明第二批的人数多于第一批；明确补出“人数”，避免误解为身份或程度上的“更多”。
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: 也照样对待他们
  rationale: 这是汉语中自然的对应表达，回指上一节那些仆人所受的虐待，同时不在本节重复其具体内容。
theological_decisions:
- issue: 寓言中δοῦλος的译法
  choice: 仆人
  alternative: 奴仆
  rationale: 本段重点在于这些人受主人差遣并遭佃户虐待，而非凸显其法律上的被奴役身份。“仆人”适合正文的现代汉语表达；脚注说明“奴仆”也可作为原词译法，以保留其语义范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“另一批”与“先前那一批”使两组人的对比清楚；补出主语“佃户”承接上文，避免汉语中的指代含混。
