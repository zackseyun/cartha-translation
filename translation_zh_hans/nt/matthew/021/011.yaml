  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: zh_hans
  text: 众人都说[a]：“这是先知耶稣，来自加利利的拿撒勒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“先知”前有定冠词，可理解为“那位先知”；也可理解为“一位先知”。这可能反映众人把耶稣认作一位公认的、或所期待的先知人物。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: 众人
  rationale: ὄχλοι为复数，指聚集的人群；现代汉语以“众人”自然简洁。δέ在此为轻微承接，汉语叙事中不必机械译出。
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时可表示当时持续或反复发生的言说；汉语“众人说”在上下文中自然，也不额外强化为“不断说”。
- source_word: Οὗτός ἐστιν
  choice: 这是
  rationale: 直接表达指示代词与系词构成的辨认句，符合现代汉语习惯。
- source_word: ὁ προφήτης
  choice: 先知
  rationale: 希腊文带定冠词，可能指众人所认定的那位先知；汉语名词通常不靠冠词区分定指与不定指，因此正文用“先知”保留语义空间，并以脚注说明。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: 是从加利利的拿撒勒来的
  rationale: 该带冠词的介词短语进一步说明耶稣的籍贯；“加利利的拿撒勒”自然表达拿撒勒位于加利利这一地理关系。
theological_decisions:
- issue: ὁ προφήτης应理解为定指的“那位先知”还是类别性的“一位先知”
  choice: 正文译作“先知”，脚注说明原文带定冠词，可能意为“那位先知”
  alternative: 一位先知；那位先知
  rationale: 原文的定冠词可能带有对特定、受认可或所期待之先知的辨认意味，但语境也容许将其视为称谓。中文正文用不显式标示冠词的“先知”，避免过早消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“是从……来的”清楚连接名字与籍贯；脚注保留希腊文冠词所带来的真实歧义。
