id: MAT.21.30
reference: Matthew 21:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: zh_hans
  text: 他又走到第二个儿子跟前，对他说了同样的话。儿子回答说：“我去，父亲[a]。”可是他没有去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我，主（或：先生、主人）”；这是省略式的应允，意思是“我去”。这里是儿子对父亲的尊称。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: 他又走到……跟前
  rationale: 分词表示父亲随后走近第二个儿子；“又”自然承接上文，“走到……跟前”明确表达趋近动作。
- source_word: τῷ δευτέρῳ
  choice: 第二个儿子
  rationale: 原文直译为“第二个”，但所指的“儿子”由上下文省略；中文补出可避免表达生硬或指代不清。
- source_word: εἶπεν ὡσαύτως
  choice: 对他说了同样的话
  rationale: ὡσαύτως 指父亲向第二个儿子发出与先前相同的吩咐；此译简洁自然。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答说
  rationale: 保留原文“回答—说”的叙事表达，在现代中文中仍自然庄重。
- source_word: Ἐγώ
  choice: 我去
  rationale: 希腊文只有强调代词“我”，是省略式应允；按语境补出“去”，既传达承诺，也保持简洁。
- source_word: κύριε
  choice: 父亲
  rationale: κύριε 本义可作尊称“主、先生”，此处儿子面对父亲说话；中文家庭语境中直称“父亲”较自然，也避免误读为神圣称号。脚注保留原词的称谓特点及其他译法。
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: 可是他没有去
  rationale: καί 字面为“并且”，但此处结果与口头应允形成鲜明反差，中文用“可是”准确呈现语篇关系。
theological_decisions:
- issue: κύριε 是否译成神圣称号“主”
  choice: 父亲
  alternative: 主；先生
  rationale: 这里是比喻中儿子对人间父亲的尊称，并非明确的基督论或神圣称号。正文按人物关系译为“父亲”，脚注说明原文也可译为“先生”或“主人”，避免把神学含义强加于叙事。
- issue: Ἐγώ 的省略式回答
  choice: 我去
  alternative: 我；我愿意
  rationale: 原文仅有“我”，其未明说的谓语须由父亲先前的命令补足。译作“我去”使普通读者清楚其应允内容，同时不削弱随后“没有去”的反差。
translation_notes:
  register: 采用现代、清楚而庄重的叙事中文。“我去……可是他没有去”保留口头承诺与实际行动之间的张力；不把 κύριε 神学化。
