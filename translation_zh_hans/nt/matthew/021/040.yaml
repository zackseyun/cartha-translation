  terminology: “葡萄园主”避免把此处寓言角色的κύριος误作神圣称号，同时保持简洁。“佃户”虽比γεωργός的孤立词义具体，但由本段前文明确的出租情节支持；脚注也适当说明该词可泛指农夫或耕种者。脚注a所列“葡萄园的主人”是合宜的词汇替代。
