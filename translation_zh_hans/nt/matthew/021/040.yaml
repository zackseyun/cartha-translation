  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: zh_hans
  text: “那么，葡萄园主[a]来到时，会怎样处置那些佃户[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“葡萄园的主人”。原文κύριος常可译作“主”，但这里指寓言中葡萄园的所有者。
    reason: lexical_alternative
  - marker: b
    text: 原文也可泛指“农夫”或“耕种的人”；本寓言的前文表明，他们是租种葡萄园的佃户。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 与虚拟式ἔλθῃ构成时间从句，指寓言中预期将发生的时刻；译为“来到时”比表示反复情形的“每当”更合适。
- source_word: οὖν
  choice: 那么
  rationale: 承接前文并引出由寓言情节自然产生的问题；“那么”在现代汉语中兼具推论和转折推进作用，也比“因此”更符合问句语气。
- source_word: ἔλθῃ
  choice: 来到
  rationale: ἔρχομαι的不定过去时虚拟式在ὅταν之后表示未来预期发生的动作；汉语用“来到时”自然表达。
- source_word: κύριος
  choice: 园主
  rationale: κύριος在此由“葡萄园的”限定，指寓言中葡萄园的主人或所有者，不宜机械译作带神圣称号意味的“主”。“葡萄园主”简洁自然。
- source_word: ἀμπελῶνος
  choice: 葡萄园
  rationale: ἀμπελών在农业及寓言语境中的标准对应表达。
- source_word: τί ποιήσει
  choice: 会怎样处置
  rationale: 疑问代词τί与将来时动词询问园主将采取什么行动；后接与格对象，语境又涉及审判。“怎样处置”自然表达针对这些人的行动，但不预先说明具体结果。
- source_word: γεωργοῖς
  choice: 佃户
  rationale: γεωργός本义较广，可指耕种者；本寓言前文说明园子租给他们，因此“佃户”准确传达此处角色。脚注保留原词较宽的词义范围。
- source_word: ἐκείνοις
  choice: 那些
  rationale: 保留指示代词的特指和一定的疏离意味，明确指向寓言中的那一群佃户。
theological_decisions:
- issue: 寓言语境中κύριος的译法
  choice: 葡萄园主
  alternative: 葡萄园的主人；葡萄园的主
  rationale: 这里首先是故事世界中葡萄园所有者的称谓，并非直接使用神圣称号。译作“葡萄园主”保留寓言本身的明义，同时不否认读者可能理解的寓意。
- issue: 是否在γεωργοί的译文中明确租佃关系
  choice: 佃户
  alternative: 农夫；耕种葡萄园的人
  rationale: 单独看γεωργοί，词义可泛指耕种者；但本寓言前文的ἐξέδετο明确说明葡萄园租给了他们。因此按上下文译作“佃户”，不是额外加入宗派性解释，而是呈现叙事中已交代的关系；脚注同时说明原词范围。
translation_notes:
  register: 采用现代、庄重而口语自然的问句。“那么”承接前文推论；“来到时”避免生硬照搬希腊语结构；“处置”符合即将讨论惩罚的语境，却不提前揭示下一节给出的答案。所有脚注标记均置于相应词语之后。
