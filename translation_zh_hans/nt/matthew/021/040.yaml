  source_fidelity: 译文准确传达了ὅταν οὖν引出的、面向将来的问题：“那么……来到时，会怎样处置……呢？”“葡萄园主”恰当表达κύριος τοῦ ἀμπελῶνος在寓言故事内的所有者身份；“那些佃户”保留ἐκείνοις的指示性，并依据紧邻上下文所已说明的租佃关系表达γεωργοῖς。 “会怎样处置”对应τί ποιήσει，既表达行动指向，也没有提前指定其后的惩罚内容。
