  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: zh_hans
  text: 他们对他说：“他必使那些恶人惨遭灭亡[a]，并把葡萄园租给别的佃户[b]；这些佃户会在适当的时候[c]把果子交给他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以同一词根的形容词和副词构成双关，直译可作“他必悲惨地毁灭那些恶人”或“他必使那些恶人惨遭灭亡”，强调审判的严厉。
    reason: lexical_alternative
  - marker: b
    text: 或译“把葡萄园出租给别的耕作者”。
    reason: lexical_alternative
  - marker: c
    text: 或译“按时”；原文指适当或规定的时机。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 他们对他说
  rationale: 叙事中的现在时可按历史现在时理解；汉语用过去叙事中自然的“说”即可，无须标示时态。
- source_word: Κακοὺς κακῶς
  choice: 那些恶人恶有恶报
  rationale: 原文以同根的形容词和副词形成强调性双关。“恶人恶有恶报”在现代汉语中自然地重现词根呼应和审判意味，又不限定具体惩罚方式。
- source_word: ἀπολέσει
  choice: 把他们除灭
  rationale: 表达决定性的毁灭性审判，同时避免具体化为某一种处死方式。
- source_word: τὸν ἀμπελῶνα
  choice: 葡萄园
  rationale: 准确保留比喻中的农业意象及其与先知书葡萄园意象的联系。
- source_word: ἐκδώσεται
  choice: 租给
  rationale: 在农业产业语境中指把地产出租给承租耕作者；“租给”是清楚自然的现代汉语。
- source_word: ἄλλοις γεωργοῖς
  choice: 别的园户
  rationale: γεωργοί在本比喻中既是耕种者，也是承租者；“园户”兼顾葡萄园劳作和租佃语境。
- source_word: οἵτινες
  choice: 这些园户
  rationale: 用重复名词形成自然的汉语衔接，也略显出这类园户会履行应尽责任的定性意味。
- source_word: ἀποδώσουσιν αὐτῷ
  choice: 交给他
  rationale: 表示把所欠或应交之物交付给主人，适合租佃收成的语境。
- source_word: τοὺς καρποὺς
  choice: 果子
  rationale: 保留葡萄园的具体农业图景及“结果子”的潜在比喻共鸣。
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: 按时
  rationale: 简洁表达在各自适当、应当的时节交付果实；不强行判断是收成季节还是约定交租时间。
theological_decisions:
- issue: 园户所受审判的严厉程度与性质
  choice: 他必叫那些恶人恶有恶报，把他们除灭
  alternative: 他必凄惨地除灭那些恶人
  rationale: 译文保留κακοὺς κακῶς的强烈谴责和同根修辞，并以“除灭”表达严厉审判；不把经文进一步解释为某种特定的末世刑罚形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恶人恶有恶报”略带成语色彩，用来重现原文同根双关；“园户”符合比喻中的葡萄园租佃场景。本文无脚注标记。
