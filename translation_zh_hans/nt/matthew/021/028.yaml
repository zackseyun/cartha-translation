  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: zh_hans
  text: “那么，你们怎么看？有一个人有两个孩子[a]。他走到第一个孩子跟前，说：‘孩子，你今天到葡萄园里去干活。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“两个儿子”。希腊原文 τέκνα 的字面意思是“孩子”，并不专指儿子。
    reason: 说明传统译法与希腊词语范围之间的差别。
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: 可是，你们怎么看？
  rationale: 用现代汉语的自然问法表达征询听者判断的语气，并以“可是”保留 δέ 轻微的转折或承接作用。
- source_word: ἄνθρωπος
  choice: 有一个人
  rationale: 在比喻叙事中自然引入一位男性家长；汉语无需另加“某”来表达希腊文并未明说的含义。
- source_word: τέκνα δύο
  choice: 两个孩子
  rationale: τέκνα 是泛指“孩子”的词，并不专指儿子；译文保留原文较宽泛的称谓。
- source_word: προσελθὼν τῷ πρώτῳ
  choice: 走到第一个孩子跟前
  rationale: 把分词结构顺畅地转成连续动作；补出“孩子”使汉语中的序数所指清楚，但未增加新的角色。
- source_word: Τέκνον
  choice: 孩子
  rationale: 保留 τέκνον 的宽泛亲属称谓及直接呼语，不擅自缩窄为“儿子”，也不增添原文没有明说的“我的”。
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: 你今天……去干活
  rationale: 以自然的现代汉语命令句表达两个祈使语气，并准确保留“今天”的时间限定。
- source_word: ἐν τῷ ἀμπελῶνι
  choice: 到葡萄园里
  rationale: 结合汉语动词“去”使用趋向结构，自然表达前往并在葡萄园中工作的意思，同时保留葡萄园意象。
theological_decisions:
- issue: 是否按传统把 τέκνα／τέκνον 译成“儿子”
  choice: 孩子／孩子
  alternative: 儿子／儿子
  rationale: 本节希腊文使用较宽泛的 τέκνα 和 τέκνον，而不是专指儿子的 υἱοί／υἱέ。译作“孩子”可避免在原文没有限定之处提前缩窄含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们怎么看”口语清楚但不随便；“去干活”比“去作工”更符合当代普通读者的表达习惯。引号中的第二人称“你”明确直接命令的对象。
