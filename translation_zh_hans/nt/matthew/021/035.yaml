  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
translation:
  language: zh_hans
  text: 佃农抓住他的奴隶[a]；他们打了其中一个，杀了另一个，又用石头打了另一个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλοι可按语境指“奴隶”或“仆人”。
    reason: 词义备选
lexical_decisions:
- source_word: γεωργοὶ
  choice: 佃户
  rationale: 在比喻中，这些人受托租种园主的葡萄园；“佃户”既表明耕作者身份，也体现其与园主的租佃关系。
- source_word: λαβόντες
  choice: 抓住
  rationale: 分词表示先于后续暴力行为发生的动作；“抓住”在现代汉语中自然，并能表达此处带有敌意的控制行动，而不必强化为“擒拿”。
- source_word: δούλους
  choice: 奴仆
  rationale: δοῦλος可指奴隶或仆役。“奴仆”保留其隶属主人、奉主人差遣的身份，同时比单用“奴隶”更符合本段叙事中的自然汉语表达；脚注注明另一常见译法。
- source_word: ἔδειραν
  choice: 打了
  rationale: 该动词指殴打，也可在某些语境中指鞭打；原文未明说工具或方式，因此用不作过度限定的“打了”。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 直接表达夺去性命，不额外加入“谋杀”所带的法律定性。
- source_word: ἐλιθοβόλησαν
  choice: 用石头打了
  rationale: 明确传达以石头攻击的方式；原文在此未明确说明受害者是否因此死亡，而“用石头打死”会增加原文没有明说的结果。
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: 一个……一个……又……一个
  rationale: 以现代汉语的分列结构清楚表现不同奴仆分别遭受的三种对待。
theological_decisions:
- issue: 比喻叙事中δοῦλος的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “奴仆”没有把这些受差遣者淡化为现代雇员，也不把该词在本语境中的功能单纯限定为法律身份；它保留其归属主人并代表主人行事的含义。
- issue: ἐλιθοβόλησαν是否包含死亡结果
  choice: 用石头打了
  alternative: 用石头打死了；拿石头砸了
  rationale: 与前项“杀了”并列时，原文可能描述另一种攻击，也可能暗示石刑，但句中没有明说结果；译文不替原文消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“佃户”简洁交代租种关系；三个短分句保留原文紧凑、递进的暴力节奏。
