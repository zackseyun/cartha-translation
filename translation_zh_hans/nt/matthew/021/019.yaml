id: MAT.21.19
reference: Matthew 21:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: zh_hans
  text: 他看见路旁有一棵无花果树，就走到树前，在树上什么也没找到，只有叶子。于是他对树说：“愿你永远不再结果子！”那棵无花果树立刻枯萎了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: 一棵无花果树
  rationale: μίαν在这里可自然地用汉语量词“一棵”表达，不必另加“单独一棵”，既体现原文又符合现代汉语。
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: 路旁
  rationale: 这里描述树所在的位置；“路旁”比字面的“路上”更符合语境和汉语习惯。
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: 走到树前
  rationale: 表达朝树走近的动作，也避免汉语代词连续使用造成含混。
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: 却在树上什么也没找到，只有叶子
  rationale: “在树上”符合汉语谈论树上果实与叶子的习惯；“什么也没找到，只有叶子”保留原文排除并强调仅有叶子的结构。
- source_word: λέγει αὐτῇ
  choice: 于是他对树说
  rationale: 原文为历史现在时；现代汉语叙事无需机械标示时态，用“说”自然连贯。“于是”体现叙事推进。
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: 愿你永远不再结果子
  rationale: “不再”对应Μηκέτι，“永远”对应εἰς τὸν αἰῶνα；“结果子”是汉语对树产生果实的自然说法，同时保留庄严的祈使、宣告语气。
- source_word: ἐξηράνθη παραχρῆμα
  choice: 立刻枯萎了
  rationale: “枯萎”准确表达树变干枯，“立刻”保留παραχρῆμα所强调的即时性。
theological_decisions:
- issue: 耶稣对无花果树所说之话的语气
  choice: 用“愿你永远不再结果子”表达带有咒诅性质的祈使／宣告
  alternative: 译作预测性的“你将永远不再结果子”，或更直译为“愿果子永远不再从你而出”
  rationale: Μηκέτι与虚拟式γένηται构成禁止或咒诅式表达，不只是对未来情况的中性预测。“愿……”保留其郑重语力，同时不在正文中加入无花果树的象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“路旁”“走到树前”“结果子”“枯萎了”均为自然现代汉语；保留原文的强调、即时性以及话语中祈使与宣告之间的张力。
