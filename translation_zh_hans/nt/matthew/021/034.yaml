  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: zh_hans
  text: 收果子的时节临近时，他就派自己的仆人[a]到佃户[b]那里，收取属于他的果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”。希腊语δοῦλος既可指“仆人”，也可指“奴隶”；这里侧重他们奉主人差遣的身份。
    reason: lexical_alternative
  - marker: b
    text: 或译“农夫”“耕种的人”。希腊语γεωργός指耕作者；在这个比喻中，他们耕种的是别人的葡萄园，因此正文译作“佃户”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ ἤγγισεν
  choice: 到了……的时候
  rationale: ὅτε引出时间从句，δέ在此是轻微的叙事衔接，汉语无需生硬译出；ἤγγισεν表示时机临近，译为“到了……的时候”符合现代汉语叙事习惯。
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: 收果子的时候
  rationale: καιρός指合宜或特定的时节；结合葡萄园语境，τῶν καρπῶν指收获果实的时节。“收果子的时候”自然清楚，并保留“果子”的具体意象。
- source_word: τοὺς δούλους αὐτοῦ
  choice: 自己的仆人
  rationale: δοῦλος可指奴仆或奴隶；本段着重他们受主人差遣的身份，因此正文采用现代读者更自然的“仆人”，并以脚注保留“奴仆”的可能译法。
- source_word: πρὸς τοὺς γεωργοὺς
  choice: 到佃户那里
  rationale: γεωργός本义为耕作者；在比喻中，他们耕种别人所有的葡萄园，故“佃户”比泛称“农夫”更准确地表达其处境。
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: 收取属于他的果子
  rationale: λαβεῖν在这里指从佃户那里取得园主所有的收成；“收取”切合索取应得份额的语境，“属于他的”明确保留αὐτοῦ的所有关系，但不额外规定具体份额。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“到了……的时候”避免逐词硬译，同时准确表达果实成熟、可收取之时已经临近。正文保留“果子”意象，并用“属于他的”传达所有关系，不把它具体化为租金、分成或全部收成。
