  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: zh_hans
  text: 清早，耶稣回城时饿了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: 清早
  rationale: 表示一天较早的时段；“清早”自然简洁，也保留了时间上的强调。
- source_word: δὲ
  choice: 不单独译出
  rationale: 这里是轻微的叙事连接词，并非强烈转折；现代汉语在此无需另加“这时”或“然而”，上下文即可自然推进。
- source_word: ἐπανάγων
  choice: 回……的时候
  rationale: 现在时主动分词表示与主句动作同时发生的背景动作；“回城的时候”自然传达“正在返回”的关系。
- source_word: εἰς τὴν πόλιν
  choice: 回城
  rationale: εἰς表示朝向或进入城内的运动；结合ἐπανάγων，汉语“回城”简洁自然，不强行断定当时已经进城。
- source_word: ἐπείνασεν
  choice: 饿了
  rationale: 简单过去时在此可表达进入饥饿状态；汉语“饿了”既自然，又比“感到饥饿”更简洁地保留事件性。
- source_word: （隐含主语）
  choice: 耶稣
  rationale: 希腊文由动词和分词形态承接上下文中的耶稣；汉语明说“耶稣”可避免孤立经节中主语不清，并未增加新的叙事人物。
theological_decisions:
- issue: 耶稣饥饿所涉及的基督论含义
  choice: 直接陈述耶稣真实地饿了
  alternative: 用弱化或象征化的措辞处理饥饿
  rationale: 原文把饥饿作为真实的人身经历来叙述。直译其叙事意义即可见证耶稣真实的人性，同时不加入超出经文的教义解释。
translation_notes:
  register: 采用现代、简洁而庄重的叙事汉语。“清早”比“早晨”更突出时间较早；“回城的时候，饿了”口吻自然，并保留分词背景动作与主句事件之间的关系。
