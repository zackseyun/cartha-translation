  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: zh_hans
  text: 可是，祭司长和文士看见他所行的奇妙之事，又看见孩子们在圣殿[a]里高声喊着说：“和散那归于大卫之子！”[b]就大为恼怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“圣殿”的希腊词指整个圣殿建筑群或院区，并非专指内殿。
    reason: cultural_note
  - marker: b
    text: “和散那”是源自希伯来语的欢呼语，原意近于“求你拯救”或“现在拯救吧”；到当时也已用作赞颂的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见
  rationale: 不定过去时分词交代主句“恼怒”发生的情境；用“看见……就……”自然表达其时间和因由关系。
- source_word: δὲ
  choice: 可是
  rationale: 承接上文并带出祭司长和经学家与群众反应之间的轻微转折。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指圣殿体制中的主要祭司领袖；采用现代中文圣经语境中通行且准确的称谓。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指熟悉并讲解律法的文士；“经学家”较能让现代读者直接理解其身份，又不增添原文没有的判断。
- source_word: τὰ θαυμάσια
  choice: 奇妙之事
  rationale: 该形容词名词化，泛指令人惊奇的作为；不限定为神迹，保留原文较宽的范围。
- source_word: ἐποίησεν
  choice: 他所行的
  rationale: 以关系结构自然修饰“奇妙之事”，忠实表达耶稣所做的事。
- source_word: παῖδας
  choice: 孩子们
  rationale: 本语境最自然的含义是儿童；“仆人”不合语境，“男孩”则无必要地限定性别。
- source_word: κράζοντας
  choice: 高声喊着
  rationale: 表达公开而响亮的呼喊，同时不暗示敌意。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: 主文采用自然通行的表达；脚注说明这里指整个圣殿区域，而非专指内殿。
- source_word: λέγοντας
  choice: 说
  rationale: 与“高声喊着”结合为“高声喊着说”，明确引出直接引语，并保留分词所表达的动作。
- source_word: Ὡσαννὰ
  choice: 和散那
  rationale: 原文保留了源自希伯来语的礼仪性欢呼；中文音译可同时保存其求救本义与赞颂功能，具体含义见脚注。
- source_word: τῷ υἱῷ Δαυίδ
  choice: 归于大卫之子
  rationale: 与“和散那”构成向“大卫之子”发出的欢呼；保留马太叙事中这一弥赛亚称号的字面形式和分量。
- source_word: ἠγανάκτησαν
  choice: 很恼怒
  rationale: 表达强烈的不悦和愤慨，语气自然，又不过度强化为暴怒。
theological_decisions:
- issue: “大卫之子”的弥赛亚意义
  choice: 保留称号“大卫之子”
  alternative: 大卫的后裔；大卫王位的继承者
  rationale: 原文直接使用 υἱὸς Δαυίδ；在《马太福音》中这是具有弥赛亚含义的称号。直译既保留其叙事和神学分量，也不把隐含意义直接写进正文。
- issue: “和散那”的祈求与颂赞双重功能
  choice: 正文音译为“和散那”，脚注说明其含义
  alternative: 求你拯救；现在拯救吧
  rationale: 此词源于求救用语，在本处又已作为欢呼赞颂语使用。音译能保留两者之间的张力，避免只选一种含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是……就……”清楚呈现原句分词结构与主句的关系；两个“看见”使并列宾语层次明确。“奇妙之事”避免把原文范围收窄为单指神迹。脚注标记均放在正文对应词语之后。
