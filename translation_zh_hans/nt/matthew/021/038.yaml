id: MAT.21.38
reference: Matthew 21:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: zh_hans
  text: 可是，那些佃户看见儿子，就彼此说：“这是继承人。来吧，我们杀了他，夺取他的产业[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“得到（或拥有）他的产业”；这里按上下文指把产业强行据为己有。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: 佃户
  rationale: 在比喻语境中，这些人受托租种园主的葡萄园，并非一般雇农。“佃户”简洁而明确地表达其租种者身份。
- source_word: ἰδόντες
  choice: 看见……就
  rationale: 以现代汉语的时间兼承接结构表达简单过去时分词，清楚呈现看见儿子之后随即商议的动作顺序。
- source_word: τὸν υἱὸν
  choice: 儿子
  rationale: 原文有定冠词，却没有明说“他的”；上下文已清楚表明父子关系，因此不补入所有格，以保留原文叙事措辞。
- source_word: ἐν ἑαυτοῖς
  choice: 彼此说
  rationale: 此处指佃户在自己这群人中商议；“彼此说”比直译“在自己里面说”自然，也保留群体内部交谈之意。
- source_word: κληρονόμος
  choice: 继承人
  rationale: 准确表达法律和产业承继含义，也是现代汉语中自然、通行的对应词。
- source_word: δεῦτε
  choice: 来吧
  rationale: 该词在此引出共同采取行动的劝说；“来吧”自然表达其号召语气。
- source_word: ἀποκτείνωμεν
  choice: 我们杀了他
  rationale: 以“我们……”承接“来吧”，自然表达第一人称复数劝勉语气；“杀”不额外加入司法处决或更强的法律定性。
- source_word: σχῶμεν
  choice: 夺取
  rationale: 该动词字面为“拥有、取得”，但在杀害继承人的图谋中，实际指以强力把产业据为己有；“夺取”简洁呈现语境中的敌意，脚注保留较字面的译法。
- source_word: κληρονομίαν αὐτοῦ
  choice: 他的产业
  rationale: “产业”能与“继承人”形成清楚关联，又避免“遗产”可能暗示物主已经死亡的额外含义；“他的”明确对应 αὐτοῦ。
theological_decisions:
- issue: 比喻中“儿子”的所指
  choice: 正文仅译作“儿子”，不直接注明其代表耶稣
  alternative: 在译文中以解释性措辞明说儿子象征耶稣
  rationale: 马太福音的整体叙事使这一基督论指向清楚，但本节在比喻故事层面只说“儿子”。保持原有措辞，可避免把解释直接写入正文，并保留比喻本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文形成转折；引语用自然口语化的号召句，但不降低比喻的严肃语气。脚注标记置于其实际说明的“夺取他的产业”之后。
