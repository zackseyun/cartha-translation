  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: zh_hans
  text: 人群中大多数人[a]把自己的衣服[b]铺在路上；另一些人则从树上砍下枝子，也铺在路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大部分群众”。
    reason: lexical_alternative
  - marker: b
    text: “衣服”也可译作“外衣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: 人群中大多数人
  rationale: πλεῖστος与集合名词ὄχλος连用，表示人群中的“大多数”或“大部分”。汉语用“人群中大多数人”自然清楚；δέ的承接作用由句子推进体现，不另加“这时”等原文没有的时间词。
- source_word: ἔστρωσαν
  choice: 铺
  rationale: στρώννυμι在此指把物件展开或铺放在地面上；“铺”准确而简洁。
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: 自己的衣服
  rationale: ἑαυτῶν明确表示反身所属，译作“自己的”；ἱμάτια泛指衣服，常可特指外衣，因此正文采用宽泛易懂的“衣服”，并以脚注说明。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 这里指实际道路的表面，现代汉语惯用“在路上”，而非抽象意义的“道路”。
- source_word: ἄλλοι δὲ
  choice: 另一些人则
  rationale: 表示人群中的另一部分人；“则”保留δέ轻微的转接和分组作用，但不强化为明显对立。
- source_word: ἔκοπτον
  choice: 砍下
  rationale: 指从树上砍取枝子。希腊语未完成时态描绘当时持续进行的场景；汉语在并列叙事中不必机械加入“正在”，以免句式生硬。
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: 从树上砍下枝子
  rationale: κλάδους是树枝，ἀπὸ τῶν δένδρων说明来源；这一表达符合自然汉语。
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: 也铺在路上
  rationale: 原文重复“铺在路上”，正文予以保留；“也”自然连接另一群人的相同行动，并承接前文省略宾语“枝子”。
theological_decisions: []
