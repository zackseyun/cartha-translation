  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: zh_hans
  text: 门徒看见了，就很惊奇，说：“这棵无花果树怎么立刻就枯萎了？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见了
  rationale: 不定过去时分词在此表示先于主句发生的情境，译为“看见了”符合现代汉语叙事习惯；原文未明说宾语，中文也可自然省略，由上文补足。
- source_word: ἐθαύμασαν
  choice: 很惊奇
  rationale: 表达门徒因所见之事而惊讶、诧异；“很惊奇”自然清楚，并与后面的问话衔接。
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词引出伴随的言语，现代汉语用“说”简洁自然。
- source_word: Πῶς
  choice: 怎么
  rationale: 引出关于事情如何发生的疑问；“怎么”也自然传达门徒的惊奇语气。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 直接保留“立即、当即”的时间含义，语体庄重而通俗。
- source_word: ἐξηράνθη
  choice: 枯萎了
  rationale: 该不定过去时被动形式在无花果树的语境中指变得干枯；汉语“枯萎了”自然表达结果，不必生硬标示被动。
- source_word: ἡ συκῆ
  choice: 这棵无花果树
  rationale: 准确译出树种；量词“棵”符合汉语习惯，“这”指向上下文中刚提到的那棵树。
theological_decisions: []
