  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: zh_hans
  text: 他们回答耶稣说：“我们不知道。”耶稣也对他们说：“我也不告诉你们我是凭什么权柄做这些事的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 回答
  rationale: 以自然的现代汉语保留分词所表达的回应动作，并与“说”连用，准确呈现回答的引介结构。
- source_word: Οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: 直接、完整地表达否定知识陈述，符合庄重而自然的对话语体。
- source_word: ἔφη
  choice: 说
  rationale: 采用中性、常用的言说动词，不额外加入“宣告”等语气。
- source_word: καὶ αὐτός
  choice: 耶稣也
  rationale: “也”体现双方相应的回应关系；重复“耶稣”比单用“他”在中文中更清楚自然。
- source_word: Οὐδὲ ἐγὼ
  choice: 我也不
  rationale: 保留οὐδέ与ἐγώ的否定及对比重点，表明耶稣相应地拒绝告知。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 此处λέγω指向披露所问的信息，汉语用“告诉”比直译为“对你们说”更符合语境。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: “凭”自然表达行动所依据的授权或资格；“权柄”兼顾合法权利与施行权能的含义，并符合经文争议语境。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示，回指耶稣受到质问的各项行动。
- source_word: ποιῶ
  choice: 做
  rationale: 用一般现在意义的“做”自然表达耶稣在当前语境中的行动。
theological_decisions:
- issue: 耶稣回答中ἐξουσία的性质
  choice: 权柄
  alternative: 权力；权利；权限
  rationale: ἐξουσία在此不仅可能涉及能力，也涉及耶稣采取这些行动的合法依据及来源。“权柄”较完整地保留这种司法性和神学张力，而不把含义缩窄为单纯能力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“我也不告诉你们”自然传达希腊语现在时在语境中的拒绝意味；不擅自补出他们声称不知道的原因，也不解释耶稣权柄的来源。
