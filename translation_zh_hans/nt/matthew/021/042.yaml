source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: zh_hans
  text: '耶稣对他们说：“你们从来没有在圣经里读过吗？


    ‘匠人所弃的石头，

    已经成了房角石[a]；

    这事出于主[b]，

    在我们眼中是奇妙的。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“顶石”；直译“角的头”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“主”；所引诗篇的希伯来文使用神名“耶和华”（YHWH）。
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中用“说”自然流畅，也不必明确标示时态。
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: 从来没有……读过吗
  rationale: 保留 οὐδέποτε 的加强语气，并以现代汉语常用的反问句式表达耶稣援引圣经时的质问。
- source_word: ἐν ταῖς γραφαῖς
  choice: 在圣经上
  rationale: γραφαί 在此指以色列的神圣经卷；“在圣经上读过”是清楚自然的现代汉语表达。
- source_word: Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες
  choice: 匠人所弃的石头
  rationale: “匠人”简洁保留建造者的比喻；“所弃”表达经检验后判为不合用而拒绝的含义，并维持诗歌引文的凝练语体。
- source_word: οὗτος ἐγενήθη εἰς
  choice: 已经成了
  rationale: 表达该石头地位发生的转变及其既成结果；汉语无需另译强调性的 οὗτος，因为复指“这块石头”会使诗句累赘。
- source_word: κεφαλὴν γωνίας
  choice: 房角石
  rationale: 这是自然且通行的汉语建筑隐喻，同时用脚注保留该短语也可能指“顶石”的词义空间。
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: 这是出于主
  rationale: παρά 加属格表示来源；“出于主”准确保留来源意义，也保持诗篇引文的庄重语气。
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: 在我们眼中是奇妙的
  rationale: 贴近希腊文意象和语序，既自然，又保留共同见证者对这事的惊叹。
theological_decisions:
- issue: 诗篇引文中 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 马太福音的希腊文本为 κυρίου，正文据此译作“主”；其所引诗篇的希伯来文本使用神名 YHWH，因此在脚注中透明说明。
- issue: 石头意象的弥赛亚应用
  choice: 保留比喻，不在正文中增添身份解释
  alternative: 在正文中明确把石头解释为弥赛亚或耶稣
  rationale: 上下文显示耶稣将经文用于自己，但本节引文仍以石头比喻呈现；不加解释可避免把诠释写入译文。
- issue: κεφαλὴ γωνίας 所指建筑构件
  choice: 正文译“房角石”，脚注保留“顶石”可能
  alternative: 正文译“顶石”
  rationale: 该希腊短语直译为“角的头”，具体建筑指称存在讨论；正文采用较通行且语境适切的“房角石”，同时不压平另一种真实可能。
translation_notes:
  register: 正文采用现代、庄重而易懂的普通话。“匠人所弃”与分行排版保留诗篇引文的凝练节奏；反问句使用“从来没有……读过吗”传达原文力度。所有脚注标记均置于相关词语之后。
