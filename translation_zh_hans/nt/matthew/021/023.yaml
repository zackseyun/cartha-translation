id: MAT.21.23
reference: Matthew 21:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: zh_hans
  text: 耶稣进了圣殿[a]，正在教导时，祭司长和百姓的长老来到他跟前，说：“你凭什么权柄做这些事？谁给了你这权柄？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语ἱερόν指整个圣殿建筑群或圣殿院区，并非专指内殿（ναός）。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: 耶稣进了
  rationale: 属格独立结构在这里具有时间意味；结合上下文明确主语为耶稣，用“进了”自然交代他进入圣殿区域。
- source_word: ἱερὸν
  choice: 圣殿
  rationale: ἱερόν指整个圣殿建筑群或院区，而非专指内殿；正文采用通行而易懂的“圣殿”，并以脚注说明范围。
- source_word: προσῆλθον αὐτῷ
  choice: 来到他跟前
  rationale: 表达有关领袖主动走近耶稣的动作，比单说“来见他”更贴近προσέρχομαι的空间意味。
- source_word: διδάσκοντι
  choice: 正在教导的时候
  rationale: 现在分词表示其动作与“来到”同时发生，用“正在……的时候”清楚呈现时间重叠。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数形式在第二圣殿时期指祭司阶层中的领袖，并非表示同时有多位大祭司；“祭司长”是准确且通行的译法。
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: 民间的长老
  rationale: 指百姓中公认的领袖；“民间的长老”自然保留其与百姓群体的关系。
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: 这里质问的是耶稣行动所依据的合法授权；“凭什么权柄”既符合现代汉语，也保留挑战性的语气。
- source_word: ταῦτα ποιεῖς
  choice: 做这些事
  rationale: 直译并保留“这些事”所指范围由上下文决定的开放性，不擅自限定为教导、洁净圣殿或某一单独行动。
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: 谁给了你这权柄
  rationale: 忠实呈现对授予者身份的追问，并以“给了”表达不定过去时所指的授予行动。
theological_decisions:
- issue: 领袖质问中ἐξουσία的含义
  choice: 权柄
  alternative: 权利；能力
  rationale: 语境重点是耶稣凭谁的授权行事，而不只是拥有何种能力；“权柄”兼有合法资格和实际支配力，同时不预先替读者判定其来源。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到他跟前”保留人物走近的场景感；两个直接问句简洁有力，呈现宗教领袖公开质问耶稣的语气。
