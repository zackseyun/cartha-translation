  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: zh_hans
  text: 他们把母驴和驴驹牵来，把外衣搭在它们身上；耶稣就坐在它们上面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更具体地译作：“耶稣就坐在铺在驴身上的外衣上。”原文“它们”也可能指那些外衣。
    reason: 保留并说明末句复数代词所指对象的歧义，避免读者误以为经文明说耶稣同时坐在两头驴上。
lexical_decisions:
- source_word: ἤγαγον
  choice: 牵来
  rationale: ἄγω在此可指“带来”或“牵来”；对象是驴，现代汉语用“牵来”自然，并保留门徒把牲口领到耶稣面前的动作。
- source_word: τὴν ὄνον
  choice: 母驴
  rationale: ὄνος本可泛指驴，但此处带阴性冠词，且与驴驹并列；译作“母驴”简明地传达原文所显示的性别和母子关系。
- source_word: τὸν πῶλον
  choice: 驴驹
  rationale: πῶλος指幼小的牲畜；在本段语境中是幼驴。“驴驹”比泛称“小牲口”准确，也比“幼驴”更符合叙事用语。
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: 把自己的外衣搭在它们身上
  rationale: ἱμάτια在此指门徒的外衣；“自己的”由叙事语境自然补明。“搭在”符合把衣服放到牲口背上的动作，也不额外说明其具体铺放方式。
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: 耶稣就坐在它们上面
  rationale: 原文末尾使用复数代词，可能回指两头驴，也可能回指搭在驴身上的外衣。译文保留复数代词，不在正文中消除这一句法歧义；“耶稣”依上下文补出，以免现代汉语主语不清。
theological_decisions:
- issue: 末句复数代词αὐτῶν所指为何
  choice: 正文译作“坐在它们上面”，保留复数形式及其可能的双重指向
  alternative: 明确译作“坐在外衣上”，或解释为坐在其中一头驴上
  rationale: 这是句法和叙事上的真实歧义，而非必须在正文中裁定的教义问题。原文最近的复数名词既可能理解为外衣，也可能联系前述两头驴；正文不作无依据的单一化处理，脚注说明常见的具体理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“母驴”“驴驹”准确而不生硬；“外衣”比“衣裳”更明确。“它们”刻意保留原文复数代词造成的歧义，并以脚注提供较具体的理解。
