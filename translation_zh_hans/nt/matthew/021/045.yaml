id: MAT.21.45
reference: Matthew 21:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: zh_hans
  text: 祭司长和法利赛人听见他的比喻，就知道他说的是他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他谈论的是他们”。上下文表明，他们认出这些比喻是指着他们说的。有些译本较具解释性地译作“针对他们”。
    reason: 说明περὶ αὐτῶν的词义范围，并保留“关于”与语境中“针对”之间的区别。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见……就
  rationale: 不定过去时分词表示先于主句动作发生的情形；用“听见……就……”自然表达时间次序，并保留他们随即领会的语气。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是现代中文圣经语境中对犹太高级祭司领袖群体的通行称呼；复数并不表示当时同时有多位在任大祭司。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文对这一犹太群体名称的通行音译。
- source_word: παραβολὰς
  choice: 比喻
  rationale: “比喻”是符类福音中耶稣此类故事、譬喻和象征性言论的通行译法，能保留其文学类别。
- source_word: ἔγνωσαν
  choice: 知道
  rationale: 此处表示他们听后认出、领会了所指；“知道”贴近原词，也由上下文自然呈现认识的形成。
- source_word: περὶ αὐτῶν
  choice: 说的是他们
  rationale: περί加属格基本义为“关于、论到”；中文“说的是他们”自然表达这些比喻所谈论或所指的人是他们，而不把隐含的批评强化为词面上的“反对他们”。
- source_word: λέγει
  choice: 说的是
  rationale: 历史叙事中的现在时在中文间接叙述中宜按语境表达；“说的是”既自然，也保留耶稣言论所指向的对象。
theological_decisions:
- issue: 是否明说耶稣的比喻是在谴责这些宗教领袖
  choice: 他说的是他们
  alternative: 他是在针对他们／反对他们说话
  rationale: 原文περὶ αὐτῶν只明说耶稣所谈的是他们。上下文确有批评意味，但正文不把这种语境含义提升为介词本身没有明说的敌对含义。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“祭司长”“法利赛人”“比喻”沿用读者熟悉且准确的圣经术语；句式简洁，保留原文先听见、后认出的叙事次序。
