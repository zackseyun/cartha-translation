id: MAT.21.16
reference: Matthew 21:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: zh_hans
  text: 他们对他说：“你听见这些人在说什么吗？”耶稣对他们说：“听见了。你们从来没有读过这话吗？‘你从婴孩和吃奶的孩子口中预备了赞美。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 耶稣在这里引用的是希腊文圣经传统中的诗篇8:2。希伯来文本通常译作：“你从婴孩和吃奶孩子的口中建立了能力。”
    reason: 说明马太所引希腊文传统与诗篇希伯来文本之间的措辞差异。
lexical_decisions:
- source_word: Ἀκούεις
  choice: 你听见……吗
  rationale: 按直接问句处理现在时，保留祭司长和经学教师质问耶稣的语气；“听见”比“留意听”更贴近原词。
- source_word: τί οὗτοι λέγουσιν
  choice: 这些人在说什么
  rationale: 用现代汉语自然语序表达持续发生的言说；“这些人”保留οὗτοι略带疏离或轻蔑的指称语气，不进一步说明其身份。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时以增强叙述的生动感；现代汉语的“说”本身不强制标明时态，因此既自然，也不必人为改成带明显过去意味的表达。
- source_word: Ναί
  choice: 听见了
  rationale: 这是对“你听见吗”的直接肯定回答；按汉语对话习惯译为“听见了”比机械译成“是的”更自然，同时保持回答简短明确。
- source_word: οὐδέποτε ἀνέγνωτε
  choice: 你们从来没有读过这话吗
  rationale: 保留反问和责备意味，并用“这话”自然引出随后引用的经文。
- source_word: Ἐκ στόματος
  choice: 从……口中
  rationale: 贴近介词短语的空间意象，同时符合现代汉语表达。
- source_word: νηπίων
  choice: 婴孩
  rationale: 表示年幼的孩子，并与后面的“吃奶的孩子”保持词义上的区分。
- source_word: θηλαζόντων
  choice: 吃奶的孩子
  rationale: 直接呈现分词“正在吃奶者”的形象；用“孩子”避免与前面的“婴孩”完全合并为同一称谓。
- source_word: κατηρτίσω
  choice: 预备了
  rationale: 按马太所引希腊文本表达“使之完备、预备成”的意思，不以希伯来文本的“建立”取代。
- source_word: αἶνον
  choice: 赞美
  rationale: 该名词在此指向对上帝的赞颂；抽象名词“赞美”简洁且符合经文语体。
theological_decisions:
- issue: 耶稣引用诗篇8:2时，马太所载希腊文与希伯来文本措辞不同
  choice: 正文依马太的希腊文译作“你……预备了赞美”
  alternative: 按希伯来文本译作“你……建立了能力”
  rationale: 本节应忠实呈现马太实际记录的引文，不把它协调为希伯来文本的措辞；读者可能熟悉另一译法，因此在脚注中说明文本传统的差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话简洁直接；引文尽量保留希腊文的口部意象及“预备赞美”的措辞。脚注标记置于诗篇引文之后，以清楚标示注释对象。
