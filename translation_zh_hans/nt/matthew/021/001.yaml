id: MAT.21.1
reference: Matthew 21:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: zh_hans
  text: 他们快到耶路撒冷，来到橄榄山的伯法其[a]时，耶稣就差遣了两个门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来到伯法其，到了橄榄山”。
    reason: 原文连续使用两个表示趋向的介词短语，后一个既可看作对伯法其所在地的补充说明，也可较形式化地译作另一移动目标。
lexical_decisions:
- source_word: ἤγγισαν
  choice: 快到
  rationale: 表示在空间上接近某地；“快到耶路撒冷”是自然的现代汉语，也保留了尚未抵达的含义。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文圣经和一般中文通行的地名译法。
- source_word: ἦλθον
  choice: 来到
  rationale: 直接表达抵达伯法其的移动，与前面的“快到”形成自然区分。
- source_word: Βηθφαγὴ
  choice: 伯法其
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 橄榄山的
  rationale: 在此串联地点的结构中，用作伯法其的地理定位；这样译成自然汉语，同时用脚注保留介词短语也可理解为另一移动目标的可能性。
- source_word: τότε
  choice: 就
  rationale: “就”自然标示前述到达与随后行动之间的叙事承接。
- source_word: ἀπέστειλεν
  choice: 差遣了
  rationale: 表示耶稣派门徒执行任务；“差遣”庄重而通俗，并符合福音书叙事语域。
- source_word: δύο μαθητὰς
  choice: 两个门徒
  rationale: 准确表达数词和名词；“门徒”是 μαθητής 在福音书语境中的通行译法。
theological_decisions:
- issue: 耶稣被点名前，复数动词的叙事主语
  choice: 以“他们”承接上下文，到希腊文明确出现耶稣之处才点出“耶稣”
  alternative: 明确补作“耶稣和门徒”
  rationale: 原文只以复数动词隐含同行者，并未在本节开头明说“耶稣和门徒”；保留这种简约表达，避免添加原文没有明示的主语成分。
- issue: 伯法其与橄榄山之间的句法关系
  choice: 译作“橄榄山的伯法其”，将后一个介词短语理解为对伯法其的地理定位
  alternative: 译作“来到伯法其，到了橄榄山”
  rationale: 原文连续使用 εἰς，句法关系略显紧凑，可理解为同一地点的进一步说明，也可形式上视为另一移动目标。正文采用较自然且符合地理关系的中文，脚注保留另一种较贴近表层结构的译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他们”保留原文隐含的复数同行主体；“快到……来到……时”清楚呈现两个连续动作，不额外点明同行者身份。
