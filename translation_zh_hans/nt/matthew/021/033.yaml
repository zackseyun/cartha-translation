id: MAT.21.33
reference: Matthew 21:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: zh_hans
  text: “你们再听一个比喻：有一个园主，栽了一个葡萄园，在四周设了围栏[b]，在园里挖了一个榨酒池，又盖了一座塔楼[a]。随后，他把葡萄园租给佃农[c]，便离开了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 栽种葡萄园、在四周围护、挖榨酒池和建造塔楼的景象，呼应《以赛亚书》5:1–2。
    reason: cross_reference
  - marker: b
    text: “围栏”也可译作“篱笆”。原文可指围住园子的屏障，如围栏或树篱。
    reason: lexical_alternative
  - marker: c
    text: “租给佃农”也可译作“出租给农夫”，指把葡萄园租给负责耕作经营的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: 你们再听一个比喻
  rationale: ἀκούσατε是复数命令式，用“你们……听”明确表达对众人的直接吩咐；“比喻”是现代汉语中παραβολή在耶稣教导语境下准确而通行的译法。
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: 有一个地主
  rationale: οἰκοδεσπότης指家宅或产业的主人；本节涉及葡萄园及租赁关系，“地主”简洁、自然地表达其土地所有者身份。“有一个”也符合汉语叙事开头的习惯。
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: 栽了一个葡萄园
  rationale: 保留φυτεύω“栽种”和ἀμπελών“葡萄园”的具体农业意象，也维持与以赛亚书5章的呼应。
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: 在四周设了围栏
  rationale: φραγμός泛指起围护作用的篱笆、围栏或其他屏障。“围栏”在正文中自然且不过度限定材料；其词义范围以脚注说明。
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: 在园里挖了一个榨酒池
  rationale: ὀρύσσω意为“挖”，ληνός指压榨葡萄用的酒榨或榨酒池。“榨酒池”既保留挖掘形成的设施形象，也便于现代读者理解。
- source_word: ᾠκοδόμησεν πύργον
  choice: 盖了一座塔楼
  rationale: πύργος只明确表示“塔”，并未明说其用途；“塔楼”自然表达园中的建筑，同时避免擅自译成“瞭望塔”。
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: 把葡萄园租给佃农
  rationale: ἐκδίδωμι的中间语态在这里表示出租；γεωργοί是耕作者，在此租赁关系中是承租经营葡萄园的农户。“佃农”准确体现其身份，而不把他们误解为普通雇工。
- source_word: ἀπεδήμησεν
  choice: 出远门去了
  rationale: ἀποδημέω表示离开本地外出。“出远门去了”符合现代汉语叙事表达，并且没有添加原文未说明的目的地。
theological_decisions:
- issue: 与以赛亚书5:1–2的葡萄园意象互文
  choice: 正文保留栽葡萄园、设置围护、挖榨酒池和盖塔楼等具体意象，在脚注中指出呼应
  alternative: 在正文采用更具传统互文色彩的固定措辞，或直接点明以赛亚书
  rationale: 马太的措辞明显唤起以赛亚书5章，但正文不应把读者需要辨认的互文直接改写成解释；脚注既能提示背景，又不替正文消除其叙事和神学张力。
- issue: 园主与耕作者之间的经济关系
  choice: 译为“租给佃农”
  alternative: 译为“交给农夫”或“租给种葡萄的人”
  rationale: 原文动词表达出租，γεωργοί在情境中是承租耕作的人。“佃农”保留租赁关系，这一关系对后续比喻情节具有意义，但不在本节正文进一步解释其象征对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们再听”保留面对听众的直接语气；“地主”“围栏”“榨酒池”“塔楼”“佃农”均力求具体清楚。句子按汉语节奏分为园主建设葡萄园和出租远行两部分，同时保留原文连续动作的推进感。
