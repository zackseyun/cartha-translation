  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: zh_hans
  text: 他回答说：“我不愿意。”后来他改变了主意[a]，去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“后悔了”或“回心转意了”。希腊语这个分词也可含有因懊悔而改变原先决定的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答说
  rationale: 这是叙事中常见的分词表达；译作“回答说”符合现代汉语习惯，也保留了回应的语义。
- source_word: Οὐ θέλω
  choice: 我不愿意
  rationale: θέλω可表示意愿、愿望或意志；“我不愿意”自然直接，准确表达儿子的拒绝，又不把语气强化为绝对的“我不去”。
- source_word: ὕστερον
  choice: 后来
  rationale: 准确表达随后发生之事，简洁而自然。
- source_word: μεταμεληθεὶς
  choice: 改变了心意
  rationale: 该词可包含后悔、懊悔并转变做法的意思；此处上下文着重表现儿子从拒绝转为顺从。“改变了心意”保留行为转向，又不额外限定为带有特定神学含义的“悔改”。
- source_word: ἀπῆλθεν
  choice: 就去了
  rationale: 上下文表明他去做父亲所吩咐的事；“就去了”既自然，也表达转念之后随即采取行动的叙事关系。
theological_decisions:
- issue: 比喻语境中 μεταμεληθεὶς 的译法
  choice: 改变了心意
  alternative: 后悔了；回心转意了；悔改了
  rationale: 原文描述的是从拒绝到行动的转变，也可能含有后悔之意。译作“悔改了”容易过度明确其神学内涵；“改变了心意”保留原文的行为转向，并以脚注说明其可能包含的懊悔意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。用“我不愿意”保留直接拒绝的口吻；将希腊语分词自然转换为汉语并列叙述，同时用脚注保留 μεταμεληθεὶς 在“改变心意”与“后悔”之间的语义幅度。
