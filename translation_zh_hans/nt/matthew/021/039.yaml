  source_fidelity: 译文准确保留希腊文三个连续动作及其顺序：λαβόντες（抓住）、ἐξέβαλον ἔξω τοῦ ἀμπελῶνος（扔到葡萄园外）、ἀπέκτειναν（杀了）。尤其没有按平行经文改写为先杀后弃于园外。
  naturalness: “他们抓住他，把他扔到葡萄园外，杀了他”符合现代标准汉语，节奏紧凑，适合比喻叙事的庄重语体。“扔到葡萄园外”自然表达强制逐出及其终点。
