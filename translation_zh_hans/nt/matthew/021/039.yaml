  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: zh_hans
  text: 他们抓住他，把他扔到葡萄园外，杀了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: 抓住
  rationale: 这是 λαμβάνω 的不定过去时分词，在此与后续动作相连。结合恶佃户对园主儿子的暴力行为，“抓住”自然表达将他控制住，但不额外加入原文未明说的法律逮捕意味。
- source_word: ἐξέβαλον
  choice: 扔到……外
  rationale: ἐκβάλλω 在这里表示强行使人离开某处；与 ἔξω τοῦ ἀμπελῶνος 连用，译作“扔到葡萄园外”既体现暴力动作，也符合现代汉语。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: 到葡萄园外
  rationale: 该短语表示动作的终点在葡萄园之外。“到……外”清楚保留从园内向园外移动的含义。
- source_word: ἀμπελῶνος
  choice: 葡萄园
  rationale: ἀμπελών 通常指栽种葡萄的园地；“葡萄园”准确、通行，也符合比喻语境。
- source_word: ἀπέκτειναν
  choice: 杀了他
  rationale: ἀποκτείνω 直接表示杀死。“杀了他”简洁自然，不像“谋杀”那样额外强化法律或道德定性。
theological_decisions:
- issue: 赶出葡萄园与杀害的叙事次序及其与平行经文的关系
  choice: 保留马太所述次序：先把儿子扔到葡萄园外，随后杀死他。
  alternative: 依照马可或路加的平行叙述，将次序理解或调整为先杀死、再扔出去。
  rationale: 希腊文依次写作 λαβόντες、ἐξέβαλον、ἀπέκτειναν，明确呈现抓住、扔到园外、杀死的动作顺序。译文不为协调平行记载而改变马太本身的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抓住—扔到……外—杀了”保留原文紧凑连续的三个动作；不添加主观动机或宗派性解释。
