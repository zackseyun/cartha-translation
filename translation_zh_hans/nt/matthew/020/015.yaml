  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: zh_hans
  text: 难道我无权用自己的东西做我想做的事吗？还是因为我良善，你的眼睛就变得邪恶吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还是因为我慷慨，你就嫉妒吗？”“眼睛邪恶”是表示嫉妒、眼红或因别人得好处而不满的希腊语习语。
    reason: 说明“邪恶的眼睛”这一源文习语的通常含义，并提供按语境表达其含义的自然汉语替代译法。
lexical_decisions:
- source_word: ἔξεστίν
  choice: 无权
  rationale: 这里表示获准或有权做某事。放在否定反问“难道我无权……吗”中，既保留权利、许可的意味，也符合现代汉语表达。
- source_word: ὃ θέλω ποιῆσαι
  choice: 做我想做的事
  rationale: 直接表达说话者的意愿，现代、自然，不增添更强的任性或意志论色彩。
- source_word: ἐν τοῖς ἐμοῖς
  choice: 用自己的东西
  rationale: 这里指属于家主的财物；“用自己的东西”清楚表达所有权，也适合葡萄园雇工比喻中的经济语境。
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: 你的眼就恶了
  rationale: 保留希腊语“恶眼”的具体意象及其与后文“为善”的对照；中文读者可能不熟悉这一习语，因此用脚注说明嫉妒、眼红的含义。
- source_word: ἀγαθός
  choice: 为善
  rationale: ἀγαθός基本义为“善的、好的”。此处虽可按语境理解为慷慨，但“为善”保留“恶—善”的词义对照，且与家主主动善待人的语境相合。
theological_decisions:
- issue: 是否在正文中直接解释“你的眼是恶的”这一习语
  choice: 正文保留“你的眼就恶了”的源文意象
  alternative: 译为“你就嫉妒（眼红）吗”
  rationale: 源文刻意把雇工的“恶眼”与家主的“善”相对照。正文保留这一张力，不把它缩减为单一心理解释；脚注则交代其通常表达嫉妒或因别人得好处而不满。
- issue: ἀγαθός应译为一般性的“善”还是语境化的“慷慨”
  choice: 译为“为善”
  alternative: 译为“慷慨”或“厚道”
  rationale: 语境确实包含慷慨，但源词本身较宽泛，并与πονηρός形成鲜明对照；保留“善”可避免把家主的品格限定为慷慨这一层面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句用“难道……吗”传达反问；次句保留“眼恶”这一源文意象，并以脚注消除可能的理解障碍。
