  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: zh_hans
  text: 耶稣把他们叫到身边，说：“你们知道，外邦人[a]的统治者辖制他们，大人物[b]也对他们行使权柄。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。
    reason: alternative_reading
  - marker: b
    text: 或译“显要人物”或“高官”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 把他们叫到身边
  rationale: 这个不定过去时中间语态分词表示耶稣先招呼门徒到自己身边；此译法自然表达了动作的指向，又不过度增译。
- source_word: Οἴδατε
  choice: 你们知道
  rationale: οἶδα虽在形式上是完成时，在这里却具有现在时意义；“你们知道”符合现代汉语习惯。
- source_word: ἄρχοντες
  choice: 统治者
  rationale: 该词泛指掌权治理的人；“统治者”清楚、庄重，也符合本节的政治语境。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 在耶稣对犹太门徒说话的语境中，ἐθνῶν通常指犹太人以外的各族；“外族人”能表达这一相对关系，同时脚注保留“列国”的可能译法。
- source_word: κατακυριεύουσιν
  choice: 辖制
  rationale: 这个复合动词不只是中性地“治理”，还带有以主宰姿态支配人的意味；“辖制”简洁地保留了这种负面语气。
- source_word: οἱ μεγάλοι
  choice: 大人物
  rationale: 实词化的形容词指社会或政治上居高位、具影响力的人；“大人物”既保留其宽泛性，也比直接限定为某一种官职更忠于原文。
- source_word: κατεξουσιάζουσιν
  choice: 操权管辖
  rationale: 该动词表示对人运用权柄，语境中可带强势意味；“操权管辖”与前面的“辖制”形成平行，又避免把两个动词译得完全相同。
- source_word: αὐτῶν
  choice: 他们
  rationale: 两处代词都回指外族人，即受统治、受管辖的人；汉语用“他们”自然清楚。
theological_decisions:
- issue: 耶稣在犹太语境中所说的ἐθνῶν
  choice: 外族人
  alternative: 列国
  rationale: “外族人”体现了相对于犹太群体而言的非犹太各族，但原词也可从政治群体角度理解为“列国”，因此以脚注保留该歧义，不把两者之间的张力抹平。
- issue: οἱ μεγάλοι所指人物的身份与性别表达
  choice: 大人物
  alternative: 显要人物；高官
  rationale: 希腊语为阳性复数，但此处重点在其社会政治地位，未明确限定为某类官员。“大人物”不额外锁定身份；脚注提供更正式或更具体的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“叫到身边”体现叙事动作，“辖制”和“操权管辖”保留两个希腊动词的平行关系及其中较强的支配意味。所有脚注标记均置于其所说明的词语之后。
