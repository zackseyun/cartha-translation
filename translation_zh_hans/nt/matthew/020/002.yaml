  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: zh_hans
  text: 他同工人讲定一天一个第纳尔[a]的工钱后，就派他们到自己的葡萄园里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第纳尔是当时劳工通常一天的工钱。
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: 讲定
  rationale: 不定过去时主动分词表示先于主要动词发生的动作；“讲定”自然地表达双方达成约定。
- source_word: δὲ
  choice: 就
  rationale: δέ在此是轻微的叙事连接词；结合分词结构译作“就”，使前后动作衔接自然，不赋予强烈转折意味。
- source_word: ἐργατῶν
  choice: 工人
  rationale: 符合葡萄园雇工的语境，也是现代汉语中清楚、自然的称呼。
- source_word: ἐκ δηναρίου
  choice: 一个第纳尔
  rationale: 该表达说明双方约定的工资数额；保留古代货币名称，避免用现代币值替代。
- source_word: τὴν ἡμέραν
  choice: 一天
  rationale: 时间范围的宾格，与工资金额连用，表示一天的工价，不额外添加原文未明说的细节。
- source_word: ἀπέστειλεν
  choice: 打发
  rationale: 在雇主派工人前往做工的叙事语境中，“打发……去”自然准确，不含贬义。
- source_word: ἀμπελῶνα
  choice: 葡萄园
  rationale: 直接对应原词的通常含义。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 反身领属形式清楚表明葡萄园属于前文的园主。
