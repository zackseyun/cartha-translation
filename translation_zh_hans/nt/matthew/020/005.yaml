  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: zh_hans
  text: 他们就去了。他又在约第六时和第九时[a]出去，也照样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按当时犹太人的计时法，约为中午十二点和下午三点。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: 他们就去了
  rationale: οἱ回指先前受邀的工人；δέ在此是轻微的叙事连接，用“就”自然承接上文；ἀπῆλθον译为“去了”，简洁保留行动推进。
- source_word: πάλιν
  choice: 又
  rationale: πάλιν表示动作再次发生；“又”符合现代汉语叙事习惯。
- source_word: ἐξελθὼν
  choice: 出去
  rationale: 该不定过去时分词与主句动作构成顺承关系；汉语中把“出去”置于时间短语之后，表达自然，同时不额外限定其时间关系。
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: 约第六时和第九时
  rationale: περί译作“约”；保留犹太计时法中的序数时辰，以保存源文化表达，并用脚注说明现代时间。
- source_word: ἐποίησεν ὡσαύτως
  choice: 也是这样做
  rationale: ποιέω的具体内容由ὡσαύτως和上文补足；“也是这样做”既自然，又保留对先前行动的概括性指涉。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“第六时和第九时”保留原文的文化计时方式，脚注提供现代时间换算；句法略作汉语化调整，但不补明“这样做”的具体内容，以保留原文依赖上下文的表达。
