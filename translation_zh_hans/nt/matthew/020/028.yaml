id: MAT.20.28
reference: Matthew 20:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: zh_hans
  text: 正如人子来，不是要受人服侍，而是要服侍人，并且舍出自己的生命，作许多人的赎价。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作赎价，代替许多人。”
    reason: 保留 ἀντί 较明确的替代性语义，正文则采用较自然凝练的汉语。
lexical_decisions:
- source_word: ὥσπερ
  choice: 正如
  rationale: 引出与上文教导的比较，保留原文的比较语气，在现代汉语中自然清楚。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用这一自称的通行译法，保留其称号性质以及与《但以理书》的互文联系。
- source_word: οὐκ ἦλθεν
  choice: 来，不是要
  rationale: 以简洁的过去行动表述其使命目的；汉语用“来，不是要……而是要……”自然呈现原文结构。
- source_word: διακονηθῆναι
  choice: 受人服侍
  rationale: 保留被动意义，并与后面的主动“服侍人”形成清楚、自然的对照。
- source_word: ἀλλὰ διακονῆσαι
  choice: 而是要服侍人
  rationale: 保持与前一动词的词根呼应和主动、被动对照，避免采用过于教会化的措辞。
- source_word: καὶ δοῦναι
  choice: 并且舍出
  rationale: “舍出”既表达主动给予，也符合生命交付至死的语境，同时没有增添原文未明说的动作主体。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的生命
  rationale: 此处 ψυχή 指为死亡而交出的生命，并非专指与身体相对的“灵魂”；“自己的”也自然反映 αὐτοῦ 的回指。
- source_word: λύτρον
  choice: 赎价
  rationale: 准确表达为使人获释而付出的代价，简洁并保留救赎意象。
- source_word: ἀντὶ πολλῶν
  choice: 作许多人的赎价
  rationale: 正文采用自然凝练的汉语表达；ἀντί 所含较明确的替代意味则在脚注中保留，避免在正文中把其语义张力处理得过死。
theological_decisions:
- issue: 赎价语句中 ἀντί 的语义力度
  choice: 正文译为“作许多人的赎价”，脚注注明“代替许多人”的较明确表达。
  alternative: 作赎价，代替许多人
  rationale: 原文把耶稣之死描述为带有代表和替代意味的赎价。正文译法符合自然汉语且不排除替代含义；脚注明示 ἀντί 常有交换或取代之意，以保存重要的神学与词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“受人服侍／服侍人”保留原文鲜明对照；“舍出自己的生命”自然表达自愿交付生命的含义。脚注标记置于其实际所解释的“赎价”短语之后。
