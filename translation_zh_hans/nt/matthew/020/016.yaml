  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: zh_hans
  text: 这样，那些在后的，将要在前；那些在前的，将要在后。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，在后的将要在前，在前的将要在后。”
    reason: 说明 οὕτως 也可译为较明确表示推论的“因此”，并提供更凝练的汉语句式。
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 承接并总结前面的比喻，保留“如此、这样”的结果或推论意味，同时符合现代汉语表达。
- source_word: ἔσονται
  choice: 将要
  rationale: 明确表达 εἰμί 的将来时意义；分别与“在前”“在后”搭配，使句子自然。
- source_word: οἱ ἔσχατοι
  choice: 那些在后的
  rationale: 定冠词加形容词作名词用；译为“那些在后的”既准确，又避免把次序或处境过度解释为价值上的“最小”。
- source_word: πρῶτοι
  choice: 在前
  rationale: 保留与“在后”相对的次序或地位意象，并维持原文简洁的对称结构。
- source_word: καὶ
  choice: ；
  rationale: 原文为并列连词。汉语用分号连接两个对称分句，清楚呈现并列关系，不额外加入转折意味。
- source_word: οἱ πρῶτοι
  choice: 那些在前的
  rationale: 与“那些在后的”形成严格平行，体现原文中形容词名词化的结构。
- source_word: ἔσχατοι
  choice: 在后
  rationale: 与前半句的“在前”构成完整反转，保留原文的修辞平衡及语义开放性。
theological_decisions:
- issue: 这句反转之言的具体所指
  choice: 译成简洁的反转格言，不限定“在后／在前”具体指时间次序、社会地位、奖赏还是救恩次序。
  alternative: 将其明确解释为社会地位的反转、门徒所得奖赏的反转，或得救次序的反转。
  rationale: 希腊文本本身只陈述反转，没有在本句中进一步限定范围；译文应保留这种神学张力与语义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那些在后的／那些在前的”清楚表达希腊语形容词名词化；分号保持格言式的平衡和力度。
