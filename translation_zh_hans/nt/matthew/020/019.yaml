revisions:
- from: 又把他交给外族人，让他们戏弄、鞭打、钉十字架；到第三天，他必复活[a]。
  to: 他们会把他交给外邦人，好让他们戏弄他、鞭打他，并把他钉在十字架上；第三天，他必复活[a]。
  rationale: 修订“外邦人”“第三天”及钉十字架的表达，以更准确反映原文的语境、时间意义和共享宾语。正文仍用自然的“必复活”，并借脚注保留ἐγερθήσεται的被动形式及其可能暗示的上帝行动，不将该神学含义强加于正文。
