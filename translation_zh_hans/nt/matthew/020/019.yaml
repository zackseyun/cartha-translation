source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: zh_hans
  text: 他们会把他交给外邦人，好让他们戏弄他、鞭打他，并把他钉在十字架上；第三天，他必复活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他将被使复活”。希腊语动词是被动式，是谈论复活时常见的表达，可能暗示是上帝使他复活。
    reason: 保留原文被动语态及其可能包含的神学含义，同时避免正文采用生硬或不自然的汉语被动表达。
lexical_decisions:
- source_word: παραδώσουσιν
  choice: 把他交给
  rationale: 表达把人移交到他人权下的意思，符合受难预告的语境，也不把词义窄化为“出卖”。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 此处指犹太人以外的人，具体涉及罗马当局；“外族人”较自然，也保留其族群层面的含义。
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: 让他们戏弄
  rationale: εἰς加冠词不定式表示目的或结果；补出“让他们”可使现代汉语自然，并明确后续动作的施事者。
- source_word: μαστιγῶσαι
  choice: 鞭打
  rationale: 准确表达司法惩罚中的鞭笞，现代读者易懂且不显古奥。
- source_word: σταυρῶσαι
  choice: 钉十字架
  rationale: 直接对应处以十字架刑的动词；与前面的“他”共享宾语，不必在每个并列动词后重复。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 到第三天
  rationale: 自然表达该时间点；“到”符合汉语受难预告的叙述节奏。
- source_word: ἐγερθήσεται
  choice: 他必复活
  rationale: 现代汉语通常以“复活”表达复活语境中的ἐγείρω；正文自然清楚，脚注交代希腊语被动形式及其可能暗示的上帝行动。
theological_decisions:
- issue: 复活动词的语态
  choice: 正文译“他必复活”，脚注说明原文为被动式
  alternative: 他必被使复活／他必被复活
  rationale: 希腊语ἐγερθήσεται为将来被动式，可能是暗示上帝行动的神圣被动；但汉语直译为“被复活”生硬且容易误解。正文采用惯用的“复活”，并以脚注保留原文语态及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“戏弄、鞭打、钉十字架”构成紧凑的并列结构；“必”体现将来预告的确定性。
