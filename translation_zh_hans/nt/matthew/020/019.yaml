    text: 直译“他将被使复活”。希腊语动词是被动式，是谈论复活时常见的表达，可能暗示是上帝使他复活。
    reason: 保留原文被动语态及其可能包含的神学含义，同时避免正文采用生硬或不自然的汉语被动表达。
  revision_rationale: 修订“外邦人”“第三天”及钉十字架的表达，以更准确反映原文的语境、时间意义和共享宾语。正文仍用自然的“必复活”，并借脚注保留ἐγερθήσεται的被动形式及其可能暗示的上帝行动，不将该神学含义强加于正文。
