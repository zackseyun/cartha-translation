review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了交出、戏弄、鞭打、钉十字架及第三天复活的预告。然“外族人”未能充分体现此处犹太语境中τοῖς ἔθνεσιν所指的“外邦人”；“到第三天”较易理解为“截至第三天”，不如“第三天”准确。汉语中“钉十字架”也须明确受事及处所，避免歧义。
  naturalness: 原文庄重通顺，但“外族人”在现代普通话圣经语体中不如“外邦人”自然、明确；补出并列动作的宾语后，句子更清楚自然。
  terminology: 建议采用通行且语境准确的“外邦人”。“钉在十字架上”准确表达σταυρῶσαι。“复活”是现代汉语中自然的表达；脚注应保留希腊语将来被动式及其可能的神圣被动含义。
  issues:
  - severity: medium
    issue: “外族人”应改为“外邦人”
    rationale: τοῖς ἔθνεσιν在本段受难预告的犹太语境中指非犹太人，尤其是外邦统治者。“外邦人”既是现代汉语圣经语体的通行术语，也比可泛指外国人或其他族群的“外族人”更准确。
  - severity: medium
    issue: “到第三天”应改为“第三天”
    rationale: τῇ τρίτῃ ἡμέρᾳ是“在第三天”的时间表达；“到”在汉语中可能带有截止或经过一段时间才达到的意味。
  - severity: medium
    issue: “钉十字架”需明确对象和处所
    rationale: 希腊语的共享宾语是“他”。汉语若仅说“钉十字架”，受事不够明确，也可能造成动作对象的歧义；“把他钉在十字架上”自然而准确。
  revised_text: 他们会把他交给外邦人，好让他们戏弄他、鞭打他，并把他钉在十字架上；第三天，他必复活[a]。
  revised_footnotes:
