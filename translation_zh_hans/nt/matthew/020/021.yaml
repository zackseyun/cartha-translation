id: MAT.20.21
reference: Matthew 20:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: zh_hans
  text: 他对她说：“你想要什么？”她对他说：“请你吩咐[a]，让我这两个儿子在你的国[b]里，一个坐在你右边，一个坐在你左边。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐”原文直译为“说”；在这里也可理解为“宣告”，但译作“准许”会加入原文未明说的解释。
    reason: lexical_alternative
  - marker: b
    text: “国”也可译作“国度”，并可理解为“统治”或“王权”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: 你想要什么
  rationale: 直截了当地询问她所求之事；现代汉语自然清楚，同时保留原文的直接语气。
- source_word: Εἰπὲ
  choice: 请你吩咐
  rationale: 该词字面为“说”，但此处接表示请求内容的 ἵνα 从句，所求的是耶稣作出具有决定效力的表示；“请你吩咐”在汉语中较自然，也避免把含义进一步解释成“准许”或“赐给”。
- source_word: ἵνα καθίσωσιν
  choice: 让……坐
  rationale: 表达请求的内容，既可含准许，也可含安排座位；不额外限定其方式。
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: 我这两个儿子
  rationale: 保留 οὗτοι 的指示意味，并以自然汉语表达母子关系。
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: 一个坐在你右边，一个坐在你左边
  rationale: 准确表达左右两侧的位置，并保留原文对称结构；在王权语境中也自然传达尊位含义。
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: 在你的国里
  rationale: βασιλεία 可指国度、统治或王权；“国”在本句中简洁自然，并保留空间领域与君王统治两方面的可能含义。
theological_decisions:
- issue: 所请求的座位与耶稣王权的关系
  choice: 按原文译为在耶稣的国里坐在其左右，不说明这是地上的国度还是终末天上的国度。
  alternative: 明确解释为地上的弥赛亚国度，或最终实现的天上国度。
  rationale: 原文只说明在耶稣的 βασιλεία 中居于左右尊位；译文应保留王权与尊荣意味，而不引入特定的末世论框架。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请你吩咐”体现请求语气；左右座位的表述保持简洁对称，不把其中的尊位含义扩写进正文。
