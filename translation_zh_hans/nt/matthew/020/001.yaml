id: MAT.20.1
reference: Matthew 20:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: zh_hans
  text: 因为天国好比一个家主，他清早出去，为自己的葡萄园雇工人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 采用简洁、自然且为中文圣经读者熟悉的表达，准确传达“诸天之国”的惯用含义。
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: 一个家主
  rationale: ἀνθρώπῳ在此引出比喻中的人物，οἰκοδεσπότῃ说明其身份；中文“一个家主”已自然包含“一个人”的信息，避免生硬重复为“一个人，一个家主”。
- source_word: ἅμα πρωῒ
  choice: 清早
  rationale: 表示一大早、清晨时分；“清早”自然简洁，并未过度限定具体时刻。
- source_word: μισθώσασθαι ἐργάτας
  choice: 雇工人
  rationale: 保留以报酬雇用劳动者之意；“雇工人”符合现代汉语叙事表达。
- source_word: εἰς τὸν ἀμπελῶνα αὐτοῦ
  choice: 为自己的葡萄园
  rationale: 此处εἰς表达雇来进入并在葡萄园工作的目的；中文以“为……雇工人”自然传达该关系，αὐτοῦ译作“自己的”。
theological_decisions:
- issue: γάρ与前文的论证联系
  choice: 因为
  alternative: 原来／不译
  rationale: 保留γάρ所标示的解释或论证关系，使本节与上文相连，同时不预先限定其具体神学逻辑。
- issue: 天国比喻的对应范围
  choice: 按原句译作“天国好比一个家主……”
  alternative: “天国好比家主出去雇工这件事”
  rationale: 保留希腊文的表层比喻结构，不在译文中替读者判定天国究竟对应家主、整段情景或其行动。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“家主”略带经文语体，但含义清楚，也比“户主”更能体现οἰκοδεσπότης作为一家之主并管理产业的角色。
