  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: zh_hans
  text: 耶稣上耶路撒冷去的时候，把十二个门徒单独带到一旁，在路上对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: 上……去的时候
  rationale: 现在分词表示与主句动作同时发生；“上耶路撒冷去”既符合汉语对前往高处或重要地点的表达，也保留了原文的上行方向感。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷去
  rationale: εἰς在此表示朝向、目的地；现代汉语自然译为“去耶路撒冷”，与“上”组合成“上耶路撒冷去”。
- source_word: παρέλαβεν
  choice: 带到一旁
  rationale: 该动词有带同、带走之意；结合κατ’ ἰδίαν，译为“把……单独带到一旁”，准确呈现带离众人的动作。
- source_word: τοὺς δώδεκα μαθητὰς
  choice: 十二个门徒
  rationale: 明确保留原文中的人数和μαθητάς；“门徒”是福音书语境中准确、通行且易懂的译法。
- source_word: κατ’ ἰδίαν
  choice: 单独……到一旁
  rationale: 该惯用语表示与其他人分开、私下相处；此译法兼顾空间上的分离和谈话的私密性。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 直接而自然地保留行程中的场景。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 忠实对应普通言说动词λέγω，并以冒号承接下一节的话语内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“上耶路撒冷去”保留原文方向感；“单独带到一旁”避免只用抽象的“私下”，使动作和场景更清楚。经文以冒号结尾，以衔接下一节耶稣所说的话。
