  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: zh_hans
  text: 耶稣动了怜悯之心，就摸他们的眼睛；他们立刻看见了[a]，并且跟从了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恢复了视力。”希腊文动词也可较字面地译为“抬头看”；但在本处医治盲人的上下文中，指他们得以看见。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: 动了怜悯之心
  rationale: 该分词表达发自内心的深切怜悯；这一译法自然、庄重，也保留了情感力度。
- source_word: δὲ
  choice: 就
  rationale: 此处δέ是轻微的叙事连接词，并无强烈转折；结合汉语语序，用“就”自然承接耶稣因怜悯而采取的行动。
- source_word: ἥψατο
  choice: 摸
  rationale: 在医治语境中，ἅπτομαι表示身体上的触碰；“摸”是现代汉语中清楚自然的表达。
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: 他们的眼睛
  rationale: 该属格结构受ἅπτομαι支配，汉语自然表达为“摸他们的眼睛”。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确传达医治即时发生的时间意味，同时符合现代叙事语言。
- source_word: ἀνέβλεψαν
  choice: 重见光明
  rationale: 在盲人得医治的语境中，该动词指恢复视力；“重见光明”清楚而自然，同时以脚注保留“又看见了”的词义表达。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟从了他
  rationale: 既可表达实际随行，也保留可能具有的门徒含义，而不把经文明确化为“成为他的门徒”。
theological_decisions:
- issue: ἀνέβλεψαν所表达的医治结果
  choice: 真实而即时地恢复视力
  alternative: 仅表示他们抬头看，或较笼统地开始看见
  rationale: 在两个盲人得医治的上下文中，ἀνέβλεψαν与“立刻”连用，明确指视力即时恢复；译文不增加医治方式等原文未述内容。
- issue: ἠκολούθησαν αὐτῷ的含义范围
  choice: 跟从了他
  alternative: 成为了他的门徒
  rationale: 原文可兼有随行与门徒式跟从的意味，但没有明确说明其身份、深度或持续时间，因此保留原有张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“动了怜悯之心”保留原文的情感力度；“重见光明”符合医治盲人的语境。主文中的脚注标记[a]与脚注对应。
