  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: zh_hans
  text: 耶稣停下脚步[a]，呼唤他们，说：“你们要我为你们做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“站住”。
    reason: 词汇与表达形式的另一种译法；στὰς字面可表达“站住”，在此语境中指停止前行。
lexical_decisions:
- source_word: στὰς
  choice: 停下脚步
  rationale: 这是ἵστημι的不定过去时主动分词，在此先于主要动作，表示耶稣停止前行。“停下脚步”既准确表达叙事动作，也比直译“站住”更符合现代汉语。
- source_word: ἐφώνησεν
  choice: 叫他们过来
  rationale: φωνέω可表示呼叫或召来。结合宾语αὐτούς，“叫他们过来”在现代汉语中自然清楚；“过来”表达呼叫他们到跟前的语境含义，但不改变动作主体。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 阳性复数宾格代词，指上文的两个盲人。
- source_word: Τί θέλετε
  choice: 你们要……什么
  rationale: τί是疑问代词“什么”，θέλετε表示意愿或想要。此译法直接、自然，并保留问题的开放性。
- source_word: ποιήσω
  choice: 我……做
  rationale: 不定过去时虚拟语气与θέλετε连用，表达他们希望耶稣所做的事。汉语用“要我……做”自然呈现这一从属关系。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 与ποιήσω连用的复数与格在这里具有受益含义，表示替他们或为他们做事。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 按现代汉语通行译名处理专名；希腊语冠词无需另译。
theological_decisions:
- issue: 耶稣问话的语气与力度
  choice: “你们要我为你们做什么？”
  alternative: “你们愿意我为你们做什么？”
  rationale: 原文是直接询问对方意愿，并未明确加入责问、考验或其他神学解释。“要”在现代汉语中自然直接，保留了耶稣亲自回应他们的语气，也不把经文本身没有说明的动机带入译文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事句简洁流畅，问句保持直接、亲切，不使用文言化的“欲”“愿我”等表达。
