  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: zh_hans
  text: 那时，西庇太儿子们的母亲和她的儿子们一同来到耶稣面前，向他下拜[a]，求他一件事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜他”；希腊语这个动词可按语境表示俯伏致敬、下拜或敬拜。
    reason: 词义存在真实幅度，正文不宜排除更强的敬拜含义。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为叙事中的时间连接语，自然地引出接下来的事件，也可理解为“然后”。
- source_word: προσῆλθεν αὐτῷ
  choice: 来到耶稣面前
  rationale: προσέρχομαι表示走近、来到某人那里；将代词所指的耶稣明确译出，符合汉语叙事习惯。“面前”也自然承接随后下拜和请求的动作。
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: 西庇太儿子的母亲
  rationale: 按希腊文属格结构直译其身份，避免加入原文未明说的姓名。
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: 和她的儿子们一同
  rationale: μετά加属格表示陪同；“一同”清楚表达母亲与儿子们同行。
- source_word: προσκυνοῦσα
  choice: 向他下拜
  rationale: προσκυνέω可指俯伏、下拜、致敬或敬拜；“下拜”保留可观察到的尊崇动作，而不在正文中限定其神学含义。
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: 求他一件事
  rationale: αἰτέω表示求、请求，τι是不定宾语“一件事”；此译简洁自然，并保留请求内容尚未说明这一点。
theological_decisions:
- issue: προσκυνοῦσα用于对耶稣所行之举时的含义
  choice: 向他下拜
  alternative: 敬拜他；向他俯伏致敬
  rationale: 该动词既可描述身体上的俯伏或尊崇，也可表示敬拜。当前语境直接呈现的是向耶稣提出请求前的尊敬举动，因此正文采用含义较宽的“下拜”，脚注保留“敬拜”的可能性，不消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“西庇太儿子的母亲”贴近原文身份表达；“求他一件事”比“向他请求某事”更符合自然汉语。脚注标记已置于相关词语之后。
