  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: zh_hans
  text: 看哪，有两个盲人坐在路旁。他们听见耶稣经过，就高声喊道：“主啊，大卫之子，求你怜悯我们！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留这个引人注意的叙事标记及其鲜明感；“看哪”虽略显庄重，却是现代中文读者容易理解的圣经叙事用语。
- source_word: δύο τυφλοὶ
  choice: 两个盲人
  rationale: 准确表达数量和所指的两名男性；中文“盲人”自然、尊重，也无需另加“男子”才能表达原意。
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: 坐在路旁
  rationale: 自然、简洁地保留人物的姿态和所在位置。
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: 他们听见耶稣经过
  rationale: 把不定过去时分词按语境译为先于呼喊发生的时间背景；“经过”贴切表达 παράγει。
- source_word: ἔκραξαν λέγοντες
  choice: 就高声喊道
  rationale: “高声喊”传达 κράζω 的强烈语气；“道”自然涵盖 λέγοντες，避免生硬重复为“喊着说”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 在这里的尊敬和潜在基督论分量；与“大卫之子”并用时，“主”比“先生”更符合弥赛亚性呼求。
- source_word: ἐλέησον ἡμᾶς
  choice: 求你怜悯我们
  rationale: 自然表达命令式所承载的恳求语气，并保留 ἐλεέω 所指的怜悯与援助。
- source_word: υἱὸς Δαυίδ
  choice: 大卫之子
  rationale: 保留马太福音中这个具有王室和弥赛亚含义的称号，不将其弱化为单纯的家谱描述“ 大卫的后裔”。
theological_decisions:
- issue: 直接称呼耶稣时 κύριος 的译法
  choice: 主啊
  alternative: 先生／老师
  rationale: 该称呼与“大卫之子”连用，带有敬畏和弥赛亚意味；译作“主”既保留其神学张力，也不额外界定说话者对耶稣身份的完整认识。
- issue: υἱὸς Δαυίδ 的弥赛亚称号性质
  choice: 大卫之子
  alternative: 大卫的后裔
  rationale: 直译能够保留这一固定称号的王室—弥赛亚共鸣，而“后裔”容易将其压缩为一般的血统说明。
- issue: 呼语在中文中的排列
  choice: 主啊，大卫之子，求你怜悯我们
  alternative: 主啊，求你怜悯我们，大卫之子
  rationale: 原文先出现祈求，后置“大卫之子”；但中文照搬会显得断裂甚至造成称呼对象不清。把两个呼语相连不改变其指向或神学内容，并使恳求自然清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文的引人注意功能；其余句式避免古奥。“高声喊道”表现紧迫感，直接引语使用自然的现代中文呼语和恳求格式。
