  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: zh_hans
  text: 约在第三时辰[a]，他出去，看见另一些人闲站[b]在集市上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即约上午九点。“第三时辰”是从日出开始计算白昼时间。
    reason: cultural_note
  - marker: b
    text: 或译：“闲着；没有做工。”原文意为闲着、没有做工。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出去
  rationale: 不定过去时分词表示伴随叙事推进的先行动作；结合καί译为“又出去”，自然承接上文，并保留随后看见人的动作次序。
- source_word: περὶ τρίτην ὥραν
  choice: 约在第三时辰
  rationale: 保留原文按日出计时的文化表达；περί表达约略时间，因此译作“约在”。
- source_word: εἶδεν
  choice: 看见
  rationale: 按ὁράω在叙事中的通常含义直译，不加强为“注意到”。
- source_word: ἄλλους
  choice: 另一些人
  rationale: 该形容词在此作名词使用；译文补出汉语所需的“人”，但不限定性别。
- source_word: ἑστῶτας
  choice: 站
  rationale: 完成时主动分词在此具有状态意义，表示这些人当时站在那里。
- source_word: ἀγορᾷ
  choice: 集市
  rationale: ἀγορά指兼具交易和公共活动功能的市场区域；“集市”简明自然，符合本段招募雇工的场景。
- source_word: ἀργούς
  choice: 闲站
  rationale: ἀργός表示没有做工、处于闲着的状态；与ἑστῶτας合译为“闲站”，既自然又避免引入现代制度意义较强的“失业”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主文保留“第三时辰”以呈现原文文化背景，并以脚注说明现代时间；“闲站”兼顾ἑστῶτας与ἀργούς，避免把古代临时雇工的处境直接套入现代“失业”概念。
