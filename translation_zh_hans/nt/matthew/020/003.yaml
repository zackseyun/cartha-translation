  source_fidelity: 主句基本准确呈现了“出去／看见／另一些人／站着／闲着／在集市上”的叙事。惟“又出去”中的“又”在本节希腊文καὶ ἐξελθών中没有对应词；虽可由上下文推知这是再次外出，主文不宜增添该时间性强调。
  naturalness: “约在第三时辰，他出去，看见另一些人闲站在集市上”自然、庄重，也保留了原文的计时方式。“闲站”在此语境中能清楚表达站着而未做工。原脚注b的“没有工作地站着”搭配不合现代汉语语法，需改正。
  terminology: “第三时辰”与“集市”恰当；脚注说明从日出计算白昼时间，足以帮助现代读者理解。“闲站”不把ἀργούς过度现代化为“失业”，处理合宜。
