id: MAT.20.8
reference: Matthew 20:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: zh_hans
  text: 到了傍晚，葡萄园主对管事的说：“把工人叫来，给他们发工钱，从最后来的开始，直到最先来的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: 傍晚
  rationale: 自然准确地表达一天工作结束时的晚间时段。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: 葡萄园主
  rationale: 简洁表达葡萄园的主人，符合现代汉语习惯。
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: 管事的
  rationale: 指受园主委托管理事务并负责付款的人；比“管家”更少引入家内职务色彩。
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: 给他们发工钱
  rationale: ἀπόδος含付给应得之物的意思；“发工钱”在雇工场景中自然清楚。
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: 从最后来的开始，直到最先来的
  rationale: 上下文表明先后指受雇或到来的次序；补出“来的”使中文清楚，又不把它解释为身份等级。
theological_decisions:
- issue: 叙事现在时 λέγει
  choice: 译作“说”
  alternative: “说道”或“就对……说”
  rationale: 希腊文用历史现在时增强叙事现场感；现代汉语叙事通常以无时态标记的“说”自然表达，不必机械改成显著的现在时形式。
- issue: “最后”与“最先”的所指
  choice: 按工人到来的先后翻译
  alternative: 直译为“末后的”与“首先的”
  rationale: 本节直接语境是不同时间受雇的工人及发薪顺序；此译保留顺序反转的重点，同时避免在本节中先行扩展为神学身份判断。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达；引语清晰，适合普通读者朗读和理解。
