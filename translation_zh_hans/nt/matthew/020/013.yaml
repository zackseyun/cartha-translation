id: MAT.20.13
reference: Matthew 20:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: zh_hans
  text: 他却回答其中一个人说：“朋友，我并没有亏待你。你不是跟我讲定了一个第纳尔[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第纳尔”是罗马的一种常用银币，通常相当于普通工人一天的工钱。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答……说
  rationale: 保留分词所表达的回应动作，同时采用现代汉语中自然、庄重的引语结构。
- source_word: ἑνὶ αὐτῶν
  choice: 其中一个人
  rationale: 准确表达单数与部分属格的关系，即主人从那群人中回应一人。
- source_word: Ἑταῖρε
  choice: 朋友
  rationale: 这是对人的直接称呼；“朋友”是现代汉语中最自然的对应语，也容许上下文中较克制、疏远而非亲昵的语气。
- source_word: οὐκ ἀδικῶ σε
  choice: 我并没有亏待你
  rationale: “亏待”自然表达对某人行事不公或使其受屈的意思，并保留直接宾语“你”；“并没有”加强对指控的否定，而不改变原意。
- source_word: οὐχὶ
  choice: 你不是……吗
  rationale: 采用期待肯定回答的汉语反问句式，保留原文的修辞力量。
- source_word: δηναρίου
  choice: 一个第纳尔
  rationale: 保留历史币名，不将其泛化为“银币”或直接解释为“一天的工钱”；量词“一個”也与约定的金额相称。
- source_word: συνεφώνησάς μοι
  choice: 跟我讲定了
  rationale: “讲定”自然表达双方先前谈妥并达成约定，适合雇工与工价的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“朋友”保留原称呼可能带有的克制语气；“亏待”比抽象的“对你不公”更口语自然，同时仍准确传达公义层面的含义。
