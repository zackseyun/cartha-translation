  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: zh_hans
  text: 约在第十一个时辰，他出去，看见另一些人站在那里[a]，就对他们说[b]：“你们为什么整天站在这里闲着呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第十一个时辰”约为下午五点，即日落前约一小时。
    reason: 说明古代按日出起算的时辰表达，帮助现代读者理解时间。
  - marker: b
    text: 直译：“他对他们说。”希腊文在这里使用叙事现在时。
    reason: 正文采用自然的汉语叙事时态，脚注说明原文的历史现在时。
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: 约在第十一个时辰
  rationale: περί加宾格表示约略时间；保留“第十一个时辰”这一古代计时表达和比喻中的时间框架，并用“约”体现近似义。
- source_word: ἐξελθὼν
  choice: 他出去
  rationale: 不定过去时分词表示先于主句动作发生；汉语以顺承谓语自然表达“出去后看见”的动作次序。
- source_word: εὗρεν ἄλλους ἑστῶτας
  choice: 看见另一些人站在那里
  rationale: εὗρεν在此可自然译为“看见”，ἄλλους不额外限定性别；ἑστῶτας表达持续站立的状态。
- source_word: καὶ λέγει αὐτοῖς
  choice: 就对他们说
  rationale: λέγει是叙事历史现在时；现代汉语通常以过去叙事中的“说”自然承载其功能，脚注保留原文时态信息。
- source_word: Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί
  choice: 你们为什么整天站在这里闲着呢？
  rationale: τί在此问句中意为“为什么”；ἑστήκατε的完成时呈现持续至今的站立状态，“整天站在这里”在汉语中自然表达；ἀργοί译为“闲着”，不加入“失业”等社会经济含义。
theological_decisions: []
