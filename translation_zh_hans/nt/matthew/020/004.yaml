  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: zh_hans
  text: 他对他们说：‘你们也进葡萄园去吧；我会给你们应得的。[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “应得的”也可译作“公道的”“公平的”或“合宜的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις εἶπεν
  choice: 他对他们说
  rationale: 按叙事语境自然表达间接宾语；ἐκείνοις指刚才提到的那些工人，无须强化为“那些人”。
- source_word: Ὑπάγετε καὶ ὑμεῖς
  choice: 你们也进……去吧
  rationale: 保留复数命令及καὶ ὑμεῖς所表达的加入、包括之意；“去吧”在现代汉语中自然且符合主人吩咐工人的语气。
- source_word: εἰς τὸν ἀμπελῶνα
  choice: 进葡萄园
  rationale: ἀμπελών通常指种植葡萄的园地；“葡萄园”是准确、通行的对应词。以“进……去”自然呈现εἰς的方向性。
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: 该给多少
  rationale: 中性关系结构在工资语境中指合宜、正当的数额；正文采用自然汉语，但不把标准限定为主观的“公平”。脚注保留较直译的可能。
- source_word: δώσω ὑμῖν
  choice: 我就给你们多少
  rationale: 保留δίδωμι的“给”，不擅自改为原文未明说的“付工钱”；以相关结构补出“多少”，使汉语完整并对应ὃ。
theological_decisions:
- issue: 工资语境中δίκαιον的含义
  choice: 该给多少
  alternative: 合宜的／公正的／公平的
  rationale: δίκαιον可指正当、公正或合宜之事。在本节的工资承诺中，正文用“该给多少”传达主人承诺给出正当数额，同时不预先断定这是法律意义的公正还是一般意义的公平；脚注明示词义范围。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“去吧”避免命令显得生硬；分号清楚连接吩咐与承诺。脚注标记置于相关整句之后。
