  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: zh_hans
  text: 他们领到钱后[a]，就开始埋怨家主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们领了钱，就一直埋怨园主。”
    reason: 原文分词可译为“领了”，未完成过去时也可侧重持续性的埋怨；“园主”则按本比喻的葡萄园语境表达οἰκοδεσπότης。
lexical_decisions:
- source_word: λαβόντες
  choice: 领到钱后
  rationale: 不定过去时分词表示动作先于主句发生。原文宾语省略，按上文所发的一银币补出“钱”，使现代汉语自然清楚。
- source_word: δὲ
  choice: 就
  rationale: δέ在此是轻微的叙事连接词；结合“……后，就……”表达事件推进，不强化转折。
- source_word: ἐγόγγυζον
  choice: 开始埋怨
  rationale: 未完成过去时可表达持续或起始中的动作；“开始埋怨”体现领钱之后怨言随即出现，也保留γογγύζω所含不满抱怨的意味。
- source_word: κατὰ
  choice: （埋怨的对象直接作宾语）
  rationale: κατά加属格表示针对、反对某人。现代汉语中“埋怨家主”比“向着家主埋怨”自然，并保留其指向性。
- source_word: τοῦ οἰκοδεσπότου
  choice: 家主
  rationale: οἰκοδεσπότης指一家或产业的主人。“家主”简洁保留词语的家庭主事者含义；本比喻语境也可理解为雇用工人的园主。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“领到钱后，就开始埋怨”清楚呈现动作次序；正文保留“家主”的源语构词色彩，脚注提供贴合场景的“园主”及未完成过去时的另一种理解。
