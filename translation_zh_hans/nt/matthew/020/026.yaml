  naturalness: 修订后的“在你们中间不可这样；相反，谁想在你们中间为大，谁就要作你们的仆人”是自然、庄重且易懂的现代普通话。“为大”在此类群体关系与教导语境中比“大人物”更准确，也避免后者在现代汉语中偏向社会名流或权势人物的联想。
  terminology: “仆人”可恰当地译διάκονος，保留服事关系而不预设后来的教会职分。“为大”对应μέγας γενέσθαι，并保留“成为／取得为大地位”的动态和语境限定。
