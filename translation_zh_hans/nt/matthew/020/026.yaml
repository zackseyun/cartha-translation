  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: zh_hans
  text: 在你们中间不可这样[a]；相反，谁想在你们中间为大，谁就要作你们的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你们中间将不会这样。”希腊文用将来时“将会是”；在这里可表达耶稣门徒中不应有的情形。
    reason: 保留ἔσται的将来形式，同时说明该将来式在此语境中可能具有规范性的用法。
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: 你们中间却不可这样
  rationale: ἔσται虽是将来时，但在此语境中带有规范、禁阻意味。译作“不可这样”既自然表达耶稣对门徒群体秩序的要求，也没有把它弱化为单纯描述现状。“你们中间”对应ἐν ὑμῖν的群体关系含义。
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: 相反，……谁想……，谁……
  rationale: ὃς ἂν加虚拟式表达不定、普遍条件，汉语用“谁……，谁……”自然传达；θέλῃ表示意愿，译作“想”简明现代。
- source_word: μέγας γενέσθαι
  choice: 成为大人物
  rationale: 保留γενέσθαι“成为”的动态意味；“大人物”在这里指群体中有地位、受看重的人，比单说“成为大的”更符合现代汉语。
- source_word: διάκονος
  choice: 仆人
  rationale: διάκονος在此指服事他人的人，不必然指后来的教会职分；“仆人”保留具体的服事与地位反转意象，同时避免译作“执事”而制度化。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 属格ὑμῶν表示服务对象和群体关系，汉语自然译为“你们的仆人”。
theological_decisions:
- issue: 耶稣门徒群体中“为大”的性质
  choice: 将本句译为对世俗权力秩序的规范性反转，并保留“仆人”的具体意象
  alternative: 把διάκονος理解为教会职分“执事”，或泛化为抽象的谦卑态度
  rationale: 上下文将外邦统治者的辖制方式与门徒应有的关系相对照。本节不是取消“为大”的概念，而是以服事重新界定它；译文不引入后期教会职制，也不淡化原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却不可这样”承接上文形成鲜明对比；“相反”明确ἀλλά的转折。“大人物”用于社会关系意义，不带褒贬定论；句式“谁……，谁……”符合现代汉语的普遍条件表达。
