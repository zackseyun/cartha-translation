- from: 你们中间却不可这样[a]。相反，你们中间谁想成为大人物，谁就要作你们的仆人。
  to: 在你们中间不可这样[a]；相反，谁想在你们中间为大，谁就要作你们的仆人。
  rationale: 修订以“为大”取代“大人物”，避免添加原文未明说的社会显要含义，并在后半句重现“在你们中间”，使群体范围与原文重复的ἐν ὑμῖν相应。脚注调整为直接反映将来时的替代译法，同时不取消其在语境中的规范性理解。
