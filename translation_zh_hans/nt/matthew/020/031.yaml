id: MAT.20.31
reference: Matthew 20:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: zh_hans
  text: 众人却斥责他们，叫他们住口；他们反而喊得更厉害[a]，说：“主啊，大卫之子[b]，求你怜悯我们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“喊得更大声。”希腊语比较级既可泛指呼喊越发强烈，也可特指音量更大。
    reason: lexical_alternative
  - marker: b
    text: “大卫之子”在这里是弥赛亚称号，不只是说明他是大卫的后裔。
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: 众人
  rationale: 这里指现场聚集的人群；“众人”在现代汉语叙事中自然简洁，也与单数集合名词的语义相符。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: ἐπιτιμάω表示带有责难意味的严厉制止；“斥责”保留其力度，又不额外加入命令的具体措辞。
- source_word: ἵνα σιωπήσωσιν
  choice: 叫他们住口
  rationale: ἵνα从句在这里说明众人斥责的目的。“叫他们住口”自然表达要他们停止出声的意图。
- source_word: μεῖζον
  choice: 更厉害
  rationale: 这个作副词用的比较级强化“喊”，既可泛指喊得越发强烈，也可能特指声音更大；“更厉害”在正文中保留较宽的含义，脚注列出较具体的可能译法。
- source_word: ἔκραξαν
  choice: 喊
  rationale: κράζω指大声呼喊；“喊”简洁自然，而与“更厉害”搭配可传达呼喊的强度和迫切感。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος在对耶稣的直接称呼中既可表示尊敬、又可能含有更深基督论意味的张力；“啊”符合汉语呼语习惯。
- source_word: ἐλέησον ἡμᾶς
  choice: 求你怜悯我们
  rationale: 准确表达命令式恳求的语气；加入“求你”使现代汉语自然，并未削弱原文迫切的请求。
- source_word: υἱὸς Δαυίδ
  choice: 大卫之子
  rationale: 直译并保留该称号在《马太福音》中的王权和弥赛亚内涵，避免淡化为单纯的血统说明。
theological_decisions:
- issue: 对耶稣使用的弥赛亚称号
  choice: 正文译作“大卫之子”
  alternative: 大卫的后裔
  rationale: 原文不只是说明家谱关系；该表达在叙事中具有王权和弥赛亚称号的功能。直译可保留其神学和叙事分量，而不作超出经文的解释。
- issue: 对耶稣的κύριος称呼
  choice: 译作“主”
  alternative: 先生；主人
  rationale: “主”既能表达直接称呼中的敬意，也保留潜在的基督论分量；“先生”会明显弱化这种张力，“主人”则会把关系限定得过窄。
- issue: 呼语在汉语引语中的次序
  choice: 译作“主啊，大卫之子，求你怜悯我们”
  alternative: 主啊，求你怜悯我们，大卫之子
  rationale: 原文把“大卫之子”置于请求之后，但两个称呼都指向耶稣。调整为自然的汉语呼语次序，不改变称号的对象或请求内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“住口”准确呈现要求停止出声的语境；“喊得更厉害”保留μεῖζον所容许的语义宽度。引语中调整呼语次序，使中文自然，同时保留“主”和“大卫之子”的神学张力。
