  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: zh_hans
  text: 拿属于你的那份，走吧！但我愿意给这个最后来的[a]，和给你的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“这个最后的”；在上下文中指最后受雇的人。
    reason: 说明原文的名词化阳性单数表达及其上下文所指，避免将“最后来的”误解为抽象事物。
lexical_decisions:
- source_word: ἆρον
  choice: 拿走
  rationale: 此处是不定过去时命令式，要求工人拿上归他的东西离开；“拿走”自然地体现动作和语气。
- source_word: τὸ σὸν
  choice: 你应得的
  rationale: 原文直译为“属于你的”；结合工钱已付的上下文，“你应得的”自然且不必在本句补出原文没有明说的“工钱”。
- source_word: ὕπαγε
  choice: 走吧
  rationale: 此处为带有遣离意味的命令；“走吧”简洁自然，又不额外强化为敌意的“滚开”。
- source_word: θέλω δὲ
  choice: 我愿意
  rationale: θέλω表达主人的意愿和决定；“愿意”适合此处施予的语境。δέ所含的轻微转折由前后句关系自然体现，未机械加上“但”。
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: 这最后来的
  rationale: ἐσχάτῳ意为“最后的”；上下文指最后受雇的工人。“这最后来的”在现代汉语中自然，并保留其个人指称。
- source_word: δοῦναι
  choice: 给
  rationale: δίδωμι的基本义是“给”；虽在支付工钱的场景中，仍保留原文较宽的措辞，不改译为“付”。
- source_word: ὡς καὶ σοί
  choice: 和给你的一样
  rationale: 该比较结构表示给最后来者的与给先来者的相同；此译法补足汉语所需的比较关系，同时不增加所给之物的具体名称。
theological_decisions:
- issue: 阳性单数人物指称的表达
  choice: 这最后来的
  alternative: 这最后一个人／这最后来的工人
  rationale: 希腊文以阳性单数指向比喻中的一名工人。汉语无需用性别代词也能保持具体个人指称；“这最后来的”既没有中性化为抽象类别，也避免补入本节未重复出现的名词。
- issue: 主人意愿与同等给予之间的张力
  choice: 我愿意给……和给你的一样
  alternative: 我要给……也像给你一样
  rationale: 保留θέλω所强调的主人自主意愿，并明确ὡς καὶ σοί所表达的同等给予，不把它解释成某种特定的神学分配原则。
translation_notes:
  register: 采用自然、庄重而直接的现代标准汉语。前句保留主人简短的命令语气；后句用“愿意”表达自主意愿。“你应得的”承接上下文中的工钱，但避免把“工钱”直接加入本节。
