  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: zh_hans
  text: 说：“这些最后来的人只做了一小时的工，你却使他们与我们这些承受了一天的重担和酷热的人同等[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你却把他们和我们同样看待。”
    reason: ἴσους……ἐποίησας可较直译为“使……同等”，也可按语用表达为“同样看待”。
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在分词承接上一节的叙事动作；汉语用“说”自然延续工人的抱怨。
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: 这些后来的人
  rationale: ἔσχατοι 在比喻语境中指最后受雇的人；“后来的人”简洁保留先后对比。
- source_word: μίαν ὥραν ἐποίησαν
  choice: 只做了一个小时
  rationale: ποιέω 与时段连用在此表示做工；“只”传达抱怨中一小时与整日劳动的鲜明反差。
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: 你却使他们跟我们……同等
  rationale: 直接保留“使……同等”的结构与工人抗议的语气，不把他们对公平的判断写入译文。
- source_word: τοῖς βαστάσασι
  choice: 我们这些承受……的人
  rationale: βαστάζω 兼有负重和忍受之意；“承受”可同时容纳体力负担与忍耐艰苦的意象。
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: 整天重担
  rationale: 保留 βάρος 的“重担”意象，同时以“整天”自然表达一整日劳作所承受的负荷。
- source_word: τὸν καύσωνα
  choice: 酷热
  rationale: καύσων 指灼人、难耐的热气；“酷热”在现代汉语中准确而自然。
theological_decisions:
- issue: 比喻中工人对同等待遇的抗议
  choice: 按原话直译为“使他们跟我们……同等”
  alternative: 解释为“你竟把他们当作和我们一样”或直接说待遇不公平
  rationale: 本节只陈述工人的抗议；译文保留其情绪和关于“同等”的措辞，不预先裁定比喻所涉及的公平与恩典问题。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“只”和“却”凸显原句中一小时与整日劳作之间的抗议性对比；保留“重担”意象，并避免加入关于主人是否公平的解释。
