  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: zh_hans
  text: 其余十个门徒听见了，就对这兄弟二人很恼怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: 其余十个门徒
  rationale: 原文直译为“那十个”；结合上下文，所指是其余十个门徒。补出“其余”和“门徒”，使现代中文指代清楚。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 自然表达分词的时间背景，与后面的主要动作衔接。原文未明说听见的具体内容，因此不增补“这事”。
- source_word: ἠγανάκτησαν
  choice: 很恼怒
  rationale: 表达因不满而愤怒的强烈情绪，符合该词在本句中的语气。
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: 对这兄弟二人
  rationale: περί在情绪动词后表示情绪所针对或关涉的对象；中文以“对”最自然，同时不额外说明恼怒的原因。
theological_decisions:
- issue: 十个门徒恼怒所针对的对象
  choice: 对这兄弟二人
  alternative: 因这兄弟二人而恼怒／为这兄弟二人的事恼怒
  rationale: 原文περί保留一定的关系性宽度，但在本语境中明确关涉两兄弟；“对”既自然，也不推断他们究竟为何恼怒。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。“这兄弟二人”比“两个兄弟”更明确地指向上下文中的雅各和约翰；不加脚注，因为本节没有必须另行说明的文本或翻译异读。
