  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: zh_hans
  text: 耶稣却回答说：“你们不知道自己在求什么。我将要喝的那杯，你们能喝吗？”他们对他说：“我们能。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杯”是圣经中常见的比喻，可指一个人所要承受的份，尤其与苦难有关；这里指向耶稣将要承受的苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: 耶稣却回答说
  rationale: “却”表达δέ在此处温和的转折；“回答说”自然保留分词与限定动词构成的叙事表达。
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: 你们不知道自己在求什么
  rationale: 按οἶδα直译为“不知道”，不扩大为“不了解”；“自己在求什么”符合现代汉语，也保留请求行为的进行意味。
- source_word: δύνασθε πιεῖν τὸ ποτήριον
  choice: 你们能喝……杯吗
  rationale: “能”明确表达δύνασθε所指的能力；“喝杯”保留原文比喻，不在正文中直接解释为受苦。
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: 我要喝的
  rationale: 汉语“我要喝的”自然表达μέλλω加不定式所指向的将来行动，同时避免把时间上的迫近程度说得过满。
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: 他们对他说：“我们能。”
  rationale: 用过去时语境下自然的汉语叙事表达历史现在时，并以前后相同的“能”对应δύνασθε与Δυνάμεθα。
theological_decisions:
- issue: “杯”的比喻含义
  choice: 正文保留“杯”，不直接释为苦难或死亡
  alternative: “我要承受的苦难，你们能承受吗？”或“我将要喝的苦杯”
  rationale: ποτήριον本身保留了圣经中“所分定之份”的比喻空间，在本段中指向耶稣将受的苦难，却不宜在正文中把其丰富含义压缩成单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你们不知道自己在求什么”直接清楚；问答中的“能”保持简洁有力。脚注标记置于本节末尾，说明整句中的“杯”之比喻。
