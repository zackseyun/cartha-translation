  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我的杯，你们固然要喝[a]；可是，坐在我的右边和左边，并不是由我来赐予；我父为谁预备，就赐给谁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杯”在这里比喻耶稣所要承受的苦难或所领受的命运；门徒也将有分于其中。
    reason: metaphor_explanation
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: 耶稣对他们说
  rationale: 希腊文使用叙事性的历史现在时；现代汉语叙事用“说”自然表达，不必机械标示现在时。主语按上下文明确为耶稣。
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: 我的杯，你们固然要喝
  rationale: 保留“杯”的隐喻，不在正文中提前解释；“固然”体现 μὲν 与后文 δὲ 构成的肯定—转折关系，πίεσθε 按将来时理解。
- source_word: τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: 可是，坐在我的右边和左边
  rationale: “右边和左边”保留原文的空间表达，也让上下文所指的尊荣位置自然可懂；“可是”承接 μὲν…δὲ 的对照。
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: 并不是由我来赐予
  rationale: 避免译成“我不能赐”，以免把原文关于归属或职分的表达改成能力不足；“赐予”适合分派尊荣位置的语境。
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: 而是给……为之预备的人
  rationale: 原文在 ἀλλά 后省略了与前文相关的成分；汉语补出“给”使句意完整，同时保留“为谁预备就给谁”的限定。完成时被动态以“预备”结合句式表达既已作成的安排。
- source_word: ὑπὸ τοῦ πατρός μου
  choice: 我父
  rationale: 忠实表达被动动作的施事者“我的父”；不添加原文没有的“独自”等限定语。“我父”在庄重的现代汉语经文语体中简洁自然。
theological_decisions:
- issue: 耶稣说这些座位“不是由我来赐予”所形成的基督论张力
  choice: 直接保留“并不是由我来赐予”，不增添解释性限定
  alternative: 译作“不是由我自行赐予”或“不是我离开父就能赐予的”
  rationale: 原文没有“自行”或“离开父”等限定。译文应保留耶稣话语本身关于父所预备之安排的张力，而不借翻译进行教义调和。
- issue: “杯”的含义
  choice: 正文保留“杯”的隐喻，并在脚注说明
  alternative: 正文直接译作“苦难”或“命运”
  rationale: 原文明确使用 ποτήριον（杯）；保留意象能维持与耶稣受难传统及上下文的联系，也避免把多层隐喻压缩成单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“固然……可是……”呈现原文的对照结构；“并不是由我来赐予”避免“不能”可能带来的能力含义。脚注标记紧接“喝”，使注释对象清楚。
