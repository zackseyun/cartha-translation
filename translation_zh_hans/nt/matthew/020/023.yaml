  to: 耶稣对他们说：“我的杯，你们固然要喝[a]；可是，坐在我的右边和左边，并不是由我来赐予；我父为谁预备，就赐给谁。”
  rationale: 仅修订末句，以明确父为哪些人预备尊荣的位置，同时不补入教义性说明，也不把原文省略的宾语过度具体化。用“我父为谁预备，就赐给谁”是自然的汉语对应，保留父作为预备者及该位置并非由耶稣授予的文本张力。
