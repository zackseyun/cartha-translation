id: MAT.20.18
reference: Matthew 20:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: zh_hans
  text: “看哪，我们正上耶路撒冷去；人子[a]将被交给[b]祭司长和文士，他们要定他死罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是耶稣常用的自称，可能呼应《但以理书》7:13–14。
    reason: cross_reference
  - marker: b
    text: “被交给”也可译作“被移交”；在较狭义的语境中，这个动词也可表示“被出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引起听者注意的语篇功能；现代中文仍能理解，也比单说“看”更庄重。
- source_word: ἀναβαίνομεν
  choice: 我们正上……去
  rationale: “正”体现现在时所表达的正在进行，“上……去”保留前往耶路撒冷的上行含义。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留福音书中耶稣惯用的自称及其可能具有的《但以理书》背景，不将其释为泛指的人。
- source_word: παραδοθήσεται
  choice: 将被交给
  rationale: 准确表达未来被动和落入他人权下的含义，不把本节未明说的行动狭义限定为“被出卖”。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 祭司长
  rationale: 中文圣经语境中的通行译法，指主要的祭司权威群体，并非多位“大祭司”。
- source_word: γραμματεῦσιν
  choice: 经学家
  rationale: 自然表达其抄写、研习并讲授经文和律法的身份，比“文士”更便于普通现代读者理解。
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: 他们要定他死罪
  rationale: 以自然、简洁的现代中文表达司法上的定罪及死刑判决。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου 的基督论称号
  choice: 人子
  alternative: 那一位人／人之子
  rationale: 采用已确立且贴近原文形式的称号，保留耶稣自称的特点以及对《但以理书》7:13–14的可能呼应，不消解其神学张力。
- issue: παραδοθήσεται 的语义范围
  choice: 将被交给
  alternative: 将被出卖
  rationale: 原文在此强调被移交到敌对权势手中；“被出卖”会过早将语义限于背叛行为及其具体行动者。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”保留原文的提醒语气；“经学家”比传统的“文士”更透明；句子按中文叙述节奏分为两句，同时保持原文各分句的逻辑关系。
