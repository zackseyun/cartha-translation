  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: zh_hans
  text: 他们对他说：“主啊[a]，愿我们的眼睛得以睁开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生。”
    reason: κύριε既可作带有权柄意味的“主啊”，也可在直接称呼中表示尊敬，译作“先生”。
lexical_decisions:
- source_word: λέγουσιν
  choice: 他们……说
  rationale: 希腊文用叙事现在时；现代汉语叙事通常无需显明时态，译作“说”自然地表达当时的回答。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与格代词表示说话的对象，译作“对他说”符合现代汉语习惯。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格在这里用于称呼耶稣；“主啊”既保留尊称及权柄意味，也不把称呼本身所能承载的基督论含义限定得过窄。
- source_word: ἵνα
  choice: 愿
  rationale: 这里的ἵνα引出对前文问题的回答和所求内容；“愿”在汉语中能自然表达请求，同时保留其目的或期望色彩。
- source_word: ἀνοιγῶσιν
  choice: 得以睁开
  rationale: 该词为不定过去时被动虚拟语气复数第三人称；“得以睁开”保留眼睛承受动作及愿望语气，避免直接改写成解释性的“能看见”。
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: 我们的眼睛
  rationale: 忠实表达带定冠词的名词及第一人称复数属格代词。
theological_decisions:
- issue: 对耶稣的称呼κύριος如何翻译
  choice: 主啊
  alternative: 先生
  rationale: “主啊”保留马太叙事中这一称呼可能具有的尊崇和权柄意味；同时以脚注列出较弱的礼貌称呼“先生”，保留该词在直接称呼中真实存在的语义幅度。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“愿……得以……”略带正式色彩，适合恳求语境，并较好保留希腊文被动虚拟语气；未将“眼睛睁开”解释性改写为“恢复视力”。
