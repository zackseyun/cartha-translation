  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: zh_hans
  text: 他们从耶利哥出来的时候，有一大群人跟着他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: 出来的时候
  rationale: 现在时中间语态分词属格复数，与αὐτῶν构成属格独立结构，作时间状语；此译法自然表达他们正在离开城中的时间背景。
- source_word: ἀπὸ Ἰεριχὼ
  choice: 从耶利哥
  rationale: ἀπό表示离开某地；与“出来”搭配，清楚传达从耶利哥离开的意思。
- source_word: ἠκολούθησεν
  choice: 跟着
  rationale: 该词在此表示随在某人之后行进；“跟着”是现代汉语中自然、清楚的表达。
- source_word: αὐτῷ
  choice: 他
  rationale: 保留希腊文与前半句复数“他们”之间的单复数转换；单数代词按上下文指耶稣。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: πολύς在此强调人数众多；“一大群人”符合现代汉语习惯，也避免古雅的“许多群众”。
theological_decisions:
- issue: 复数分词结构之后单数代词αὐτῷ的所指
  choice: 人群跟着“他”，即耶稣
  alternative: 将所指顺译为整个同行群体，即“他们”
  rationale: 希腊文明确从复数“他们出来”转为单数“跟着他”。上下文最自然地以耶稣为单数所指，因此保留这一转换，不将其抹平。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他们从耶利哥出来的时候”保留时间从句及复数主语，“跟着他”则保留原文刻意呈现的单数焦点。未添加脚注，因为英语脚注所列“离开耶利哥”只是可由正文充分涵盖的措辞替换，并非实质性文本或释义差异。
