  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: zh_hans
  text: 最先受雇的工人[a]来到时，以为会多得一些；可是他们也各得了一个第纳尔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指比喻中最先受雇的那批工人。
    reason: lexical_alternative
  - marker: b
    text: 第纳尔是当时普通工人常见的一日工资。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: 到了
  rationale: 不定过去时分词在这里表示时间关系；译为“到了”自然地交代他们前来领工钱的叙事顺序。
- source_word: οἱ πρῶτοι
  choice: 先来的人
  rationale: 指比喻中最先受雇的那一批工人，而不是抽象的身份等级；“先来的人”简洁并保留复数群体含义。
- source_word: ἐνόμισαν
  choice: 以为
  rationale: νομίζω在此表示主观推想或期待；“以为”符合现代汉语叙事，也不暗示他们对此有把握。
- source_word: πλεῖον
  choice: 多得一些
  rationale: 比较级在此指所得报酬更多；“多得一些”比单说“得更多”更顺畅，同时不擅自规定多出的数额。
- source_word: λήμψονται
  choice: 会……得
  rationale: 将思想内容中的将来预期，用现代汉语的“会”表达，符合过去叙事视角下的间接引语。
- source_word: τὸ ἀνὰ δηνάριον
  choice: 各得了一个第纳尔
  rationale: ἀνά带宾格表达逐一分配，即每人一个；保留古代钱币名称“第纳尔”，避免用现代币值造成误解。
- source_word: καὶ αὐτοί
  choice: 他们也
  rationale: 保留附加强调，突出先来者与后来者所得相同这一出人意料的结果。
theological_decisions:
- issue: 连接词καί在预期与实际结果之间的语气
  choice: 可是
  alternative: 并且
  rationale: καί本身通常是连接词，但上下文形成明显的预期落空；“可是”自然呈现这一语篇转折，不加入额外的神学解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“第纳尔”保留历史文化背景，并用脚注说明；句式简洁，适合叙事语境。
