  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: zh_hans
  text: 他们对他说：“因为没有人雇我们。”他对他们说：“你们也到葡萄园里去吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: 他们回答
  rationale: 原文是历史现在时，直译为“他们说”；现代汉语叙事无需以形态标示过去时。结合问答语境译作“回答”，自然地表达其话语功能。
- source_word: Ὅτι
  choice: 因为
  rationale: 这里引出他们仍站着的原因；“因为”准确保留解释性的语义。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 这是 οὐδεὶς 在本语境中自然、清楚的标准对应语。
- source_word: ἐμισθώσατο
  choice: 雇我们
  rationale: 动词指雇人做工。汉语无需另加完成体标记，语境已表明截至此时无人雇用他们。
- source_word: λέγει αὐτοῖς
  choice: 他对他们说
  rationale: 保留说话者、对象及历史现在时所呈现的直接叙事感；现代汉语不必强行区分现在与过去。
- source_word: Ὑπάγετε
  choice: 去吧
  rationale: 在此是直接的命令；句末“吧”使现代汉语表达自然，同时不削弱吩咐的语气。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 保留 καί 的包含意义，表明这一组人也和先前的人一样受邀进入葡萄园。
- source_word: ἀμπελῶνα
  choice: 葡萄园
  rationale: 这是该名词在本段语境中的标准、明确译法。
