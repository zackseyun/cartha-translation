base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: zh_hans
  text: 那些大约在十一时来的，每人领了一个得拿利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得拿利”是当时通行的一种罗马银币，通常相当于普通工人一天的工资。
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本节承接上文，现代汉语无需机械译出连接词，也能保持自然的叙事连贯。
- source_word: ἐλθόντες
  choice: 来的人
  rationale: 以定语结构自然表达不定过去时分词，既保留“来”的明说动作，也不增添原文此处未明说的“受雇”。
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: 那些约在十一点钟……的人
  rationale: περὶ加时间宾格表示“大约在”；“十一点钟”保留古代按日出起算的时辰说法，具体换算可由语境或注释说明。
- source_word: ἔλαβον
  choice: 领了
  rationale: 在结算工钱的语境中，“领了”比“拿了”更自然，也清楚表达他们收到了所付的钱。
- source_word: ἀνὰ
  choice: 每人
  rationale: 准确传达分配义，即每个人各得同样数额。
- source_word: δηνάριον
  choice: 一个得拿利
  rationale: 保留古罗马钱币名称，避免把约略购买力直接代入正文；文化背景置于脚注。
