  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your slave[a].
translation:
  language: zh_hans
  text: 你们中间无论谁想居首，就要成为你们的奴隶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος比上一节的διάκονος语气更强，通常指奴隶或受束缚服役的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: 谁想……谁
  rationale: 关系代词配合ἄν和虚拟语气表达泛指条件。汉语用“谁想……谁……”自然地保留“无论何人”的概括性和θέλω的意愿含义。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 此处指群体内部的地位和次序，“你们中间”符合现代汉语表达。
- source_word: εἶναι πρῶτος
  choice: 居首
  rationale: πρῶτος在此指居于最高地位；“居首”简洁、庄重，并保留社会排序的含义。
- source_word: ἔσται
  choice: 就要作
  rationale: 保留将来时在语境中的规范性力量，但不直接改译为更强的命令式“必须”。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 忠实表达属格所指的关系：此人要处于服事众人的地位。
- source_word: δοῦλος
  choice: 奴仆
  rationale: δοῦλος通常指奴隶或受主人支配的人，且比上一节的διάκονος语气更强。“奴仆”在现代中文圣经语体中既保留从属和降卑的力度，也避免“奴隶”在此比喻性教导中可能造成的不必要生硬；脚注交代更直白的译法。
theological_decisions:
- issue: 门徒教导中δοῦλος的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “仆人”会削弱本节相对于上一节διάκονος的递进；“奴隶”最直接，却可能使现代读者首先联想到特定历史制度。“奴仆”保留受支配、彻底服事众人的含义，并以脚注呈现词义强度及替代译法，不淡化耶稣对争居首位者的反转要求。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“谁想……谁……”呈现原文的泛指条件结构；“居首”与“奴仆”形成鲜明反转。脚注明确本节用词比上一节更强。
