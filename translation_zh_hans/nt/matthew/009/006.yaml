source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: zh_hans
  text: 但要让你们知道，人子[a]在地上有赦罪的权柄——于是他对那瘫痪的人说：“起来，拿起你的褥子[b]，回家去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”也可译作“人之子”。这里保留传统译法，因为这是耶稣的一个重要称号，并可能呼应《但以理书》7章。
    reason: lexical_alternative
  - marker: b
    text: 或译“卧榻”“床铺”。希腊语 κλίνη 可以指床、榻或简易卧具。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: 但为了让你们知道
  rationale: ἵνα表达目的，δέ带出轻微转折或话语推进；此译兼顾两者，并符合现代汉语表达。
- source_word: ἐξουσίαν ἔχει
  choice: 有……的权柄
  rationale: ἐξουσία在此着重合法的权威和权利，而不只是施行神迹的能力；“权柄”也保留经文庄重语体。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其可能与《但以理书》7章相关的互文意味，不用解释性意译消除其张力。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 自然表达行为所处的领域，也保留它与赦罪这一神圣权能之间的语境张力。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 赦罪
  rationale: ἀφίημι在此意为赦免、免除；“赦罪”准确、简洁，也是自然的圣经汉语。
- source_word: τότε λέγει
  choice: 于是他……说
  rationale: τότε标示随后的行动；希腊文历史现在时在现代汉语叙事中以“说”自然呈现，无须机械标明时态。
- source_word: τῷ παραλυτικῷ
  choice: 对那瘫痪的人
  rationale: 该形容词在原文中名词化使用；此译比“瘫子”更中性、自然，也不添加原文未明说的性别称谓。
- source_word: Ἐγερθεὶς
  choice: 起来
  rationale: 形式上是过去时分词，但在连续命令中具有命令语力；“起来”准确而自然。
- source_word: ἆρόν
  choice: 拿起
  rationale: αἴρω在此指拿起并带走；“拿起”简洁地保留动作含义。
- source_word: κλίνην
  choice: 褥子
  rationale: κλίνη可指床、卧榻或简易卧具；结合此人能拿起它的叙事情境，“褥子”自然且不过度具体化。
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: 回家去吧
  rationale: οἶκος在此自然指此人的家；上下文意味着回到自己的住处。“去吧”传达命令，同时符合现代汉语口吻。
theological_decisions:
- issue: 基督论称号 ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  alternative: 人之子；那位属人的
  rationale: “人子”是耶稣这一自称在汉语中的固定译法，可保存其称号性质以及可能呼应《但以理书》7章的含义，而不以释义替代原文。
- issue: 赦罪语境中 ἐξουσία 的性质
  choice: 权柄
  alternative: 权力；权利；能力
  rationale: 本节强调人子拥有赦罪的正当权威，不仅是实际能力；“权柄”保存这一神学主张，又不扩展原文。
- issue: 耶稣话语与叙述插语的边界
  choice: 以破折号和引号标明耶稣的话被叙述插语打断
  alternative: 将整节改写为间接引语或拆成两个完整句子
  rationale: 原文先给出目的从句，随后以“于是他对……说”插入叙述，再转向直接命令；保留这种中断可呈现原文的修辞结构，而不替作者补全未明说的主句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄”“人子”“赦罪”保留必要的圣经神学语汇；“瘫痪的人”“褥子”“回家去吧”则避免过度古雅。主文中的[a]、[b]与脚注逐一对应。
