id: MAT.9.11
reference: Matthew 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: zh_hans
  text: 法利赛人看见了[a]，就对他的门徒说：“你们的老师为什么跟税吏和罪人一起吃饭？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“看见”的对象；按上下文，是指看见耶稣与税吏和罪人同席吃饭的情景。也可译作“法利赛人看见这事”。
    reason: 说明原文隐含宾语，并保留可行的较明确译法。
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见了
  rationale: 不定过去时分词在此承接上文，可自然译为“看见了”；希腊文未明说所见的宾语，中文也可保留这种省略。
- source_word: ἔλεγον
  choice: 就……说
  rationale: 未完成过去时在叙事中可引出当时的发言；现代汉语用“就……说”表达事件推进较自然，不必机械译出持续体。
- source_word: μαθηταῖς
  choice: 门徒
  rationale: “门徒”是福音书语境中 μαθητής 的通行译法，保留师徒关系，也为普通读者熟悉。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 直接、自然地表达原因问句。
- source_word: τελωνῶν
  choice: 税吏
  rationale: “税吏”是新约语境中 τελώνης 的简明通行译法，能传达其征税职业及相关社会身份。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 直译 ἁμαρτωλός，保留原文对这一群体的道德与社会性称呼，不另作解释。
- source_word: ἐσθίει
  choice: 一起吃饭
  rationale: μετά 与 ἐσθίει 表示同席进食；“跟……一起吃饭”是自然现代汉语，也呈现问题所针对的交往行为。
- source_word: διδάσκαλος
  choice: 老师
  rationale: 准确表达“教导者”，并与门徒语境相称；比“夫子”更现代，比音译称号更透明。
theological_decisions:
- issue: 是否明说法利赛人所看见的对象
  choice: 正文保留隐含宾语，仅以脚注说明所指
  alternative: 译作“法利赛人看见这事”或“法利赛人看见他与他们吃饭”
  rationale: ἰδόντες 没有明示宾语，语境指向前述筵席场景。中文允许“看见了”不带明说宾语，因此可保留原文的含蓄，避免把语境推断写入正文。
- issue: ἔλεγον 的未完成体如何呈现
  choice: 译为“就……说”
  alternative: 译为“不断地说”或“正对……说”
  rationale: 未完成体并不必然表示反复；此处主要引出直接引语。避免加上原文未明确表达的持续或反复意味。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“法利赛人”“门徒”“税吏”“罪人”沿用读者熟悉的新约核心词汇；问句保持直接，不增加解释性或宗派性措辞。
