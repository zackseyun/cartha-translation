id: MAT.9.28
reference: Matthew 9:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: zh_hans
  text: 他进了屋子，那两个盲人就来到他跟前。耶稣问他们：“你们相信我能做这事吗？”他们回答：“是的，主[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可译作“先生”。这里的希腊语既可用作尊称，也可能表示他们承认耶稣的权柄。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: 他进了屋子
  rationale: 不拘泥于分词形式，以自然的汉语叙事表达“进入屋内”这一先行动作；定冠词所指房屋在上下文中可识别，译作“屋子”。
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: 那两个盲人就来到他跟前
  rationale: προσέρχομαι表示来到某人面前或靠近某人；根据紧接的上文明确为两名男性，补出“两个”，既自然又不增加新信息。
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣问他们
  rationale: 后接直接疑问句，汉语用“问”比机械直译“对他们说”更自然；汉语动词本身不标时态，因此无需人为区分历史现在时和过去时。
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: 你们相信我能做这事吗
  rationale: “相信”准确表达πιστεύω在此处对耶稣能力的信赖；“能做这事”简洁保留δύναμαι与ποιῆσαι的能力和行动含义。
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 他们回答：‘是的’
  rationale: 面对问题时译作“回答”符合现代汉语；“是的”直接表达肯定答复。
- source_word: κύριε
  choice: 主
  rationale: 保留对耶稣称呼中可能兼有敬称与承认权柄的含义，不把它缩减为单纯的“先生”。
theological_decisions:
- issue: 对耶稣的称呼κύριε
  choice: 主
  alternative: 先生
  rationale: κύριε在此既可能是礼貌称呼，也可能表达对耶稣权柄更深的承认。正文译“主”保留这层神学与叙事张力，脚注说明较弱的敬称可能。
- issue: “相信”的具体对象
  choice: 相信我能做这事
  alternative: 相信我能医治你们
  rationale: 原文只说“这事”，虽在语境中指医治，仍不在正文中明说，以保留原文的指代方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到他跟前”自然表达接近耶稣；汉语不以动词形态标示时态，因此无须刻意复制希腊语的历史现在时。
