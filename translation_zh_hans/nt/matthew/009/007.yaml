  text: And he got up and went away to his house[a].
translation:
  language: zh_hans
  text: 那人就起来，往自己家去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人起来，离开往自己家去了。”
    reason: “离开”明确表达ἀπῆλθεν所含的离去意味；正文以更自然的汉语表达同一行动。
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上文命令及随后的行动，以自然的现代汉语推进叙事；在此语境中表达顺承，不额外强化因果关系。
- source_word: ἐγερθεὶς
  choice: 那人起来
  rationale: 该词是ἐγείρω的不定过去时被动分词，此处作不及物义，表示他起身；补出“那人”可使汉语指代清楚。
- source_word: ἀπῆλθεν
  choice: 去了
  rationale: ἀπέρχομαι表示离开所在之处而去；与“回自己家”组合后，“去了”已自然包含离去之意，避免生硬重复。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 回自己家
  rationale: εἰς表示朝向或进入，οἶκος指其住处。汉语“回自己家”自然表达前往本人住所；“回”依据叙事情境合宜，但原文形式上仅说往他的房屋去。
theological_decisions: []
