  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: zh_hans
  text: 他们的眼睛就开了。耶稣严厉地警告他们[a]说：“你们要当心，不可让任何人知道[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严令他们”或“严正告诫他们”。希腊文动词含有强烈情绪和严厉告诫的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“不可有任何人知道。”所知道的内容由这次医治的上下文补足。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: 开了
  rationale: 这是ἀνοίγω的不定过去时被动语态；“眼睛开了”既贴近希腊文形式，也以自然的汉语表达视力恢复。
- source_word: οἱ ὀφθαλμοί
  choice: 他们的眼睛
  rationale: 忠实表达希腊文的所有关系，符合现代汉语习惯。
- source_word: ἐνεβριμήθη
  choice: 严厉地警告
  rationale: ἐμβριμάομαι在此带有强烈情绪和严正告诫的力度；结合随后禁令，“严厉地警告”比单纯“吩咐”更充分传达语气，同时不揣测耶稣的动机。
- source_word: Ὁρᾶτε
  choice: 你们要当心
  rationale: 该复数现在时命令式在这里引出警戒性的命令；“你们要当心”自然保留提醒他们务必留意的语力。
- source_word: μηδεὶς γινωσκέτω
  choice: 不可让任何人知道
  rationale: μηδείς与第三人称现在时命令式构成禁令。汉语用“不可让任何人知道”清楚自然；所知道的内容仍由上下文补足，没有擅自明说。
- source_word: λέγων
  choice: 说
  rationale: 以“警告他们说”自然表达该分词与主要动词同时发生，并引出警告内容。
theological_decisions:
- issue: 医治之后耶稣命令的力度与动机
  choice: 以“严厉地警告”表达强烈禁令，但不说明禁止传扬的原因。
  alternative: “严令”或“斥责”
  rationale: 经文明确呈现有力的禁止，却未交代动机；译文保留这种张力。“斥责”可能过度强调责备，“严令”则较少表现原词所含的强烈情绪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼睛就开了”保留原文的被动式表达及圣经叙事语感；“你们要当心，不可让任何人知道”既保留警戒命令，也避免补入原文未明说的宾语或禁令动机。脚注标记按其实际说明对象放置。
