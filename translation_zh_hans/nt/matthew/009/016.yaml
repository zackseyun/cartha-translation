  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: zh_hans
  text: 没有人把一块未缩水的布补在旧衣服上[a]，因为补上的那块布会从衣服上扯下来，裂口就更大了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未经整理的布”。希腊文指尚未经过缩绒等整理工序的布；这种布还会缩水，因而会拉扯旧衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: 没有人
  rationale: οὐδεὶς表达无一例外的否定；δὲ在此承接并略带转折，中文不必机械译出“但是”，省略后更自然，语篇关系仍清楚。
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: 把……布补在……上
  rationale: ἐπιβάλλει本义是放上、加上，ἐπίβλημα指衣物上的补片；合译为中文惯用的“把布补在衣服上”，不必将动作过度具体化为“缝”。
- source_word: ῥάκους ἀγνάφου
  choice: 未缩水的布
  rationale: 指尚未经过整理加工的布，实际含义是仍会缩水；“未缩水的布”让现代读者直接明白比喻中的作用，同时脚注保留“未经整理”的词义层面。
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: 在旧衣服上
  rationale: ἱμάτιον可泛指衣服或外衣；“旧衣服”自然、宽泛，不无根据地限定为袍子。
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: 会把衣服扯破
  rationale: αἴρει在此描写补片从衣服上拉扯、带走材料的结果。中文若直译“补丁从衣服上拉开”略显生硬；“把衣服扯破”自然呈现其分离作用，并与下句裂口变大衔接。
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: 补丁
  rationale: 字面为“它的填补物”，在语境中即用来补衣服的布片；译作“补丁”可清楚指明所指。
- source_word: χεῖρον σχίσμα γίνεται
  choice: 裂口就更大了
  rationale: σχίσμα是裂口，χεῖρον表示情况变得更糟；汉语通常用“裂口更大”表达衣物破损加剧，既自然又保留结果含义。
theological_decisions: []
