  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: zh_hans
  text: 因为，哪一样更容易呢：说“你的罪蒙赦免”，还是说“起来行走”？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: 因为……哪一样更容易呢
  rationale: τί与比较级εὐκοπώτερον要求在两个说法之间作比较；译为“哪一样更容易”自然清楚。γάρ译作“因为”，保留本节对上文的解释关系。
- source_word: εἰπεῖν
  choice: 说
  rationale: 两处不定式都指说出一句话，统一译为“说”，简洁且符合现代汉语。
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: 你的罪得赦免了
  rationale: ἀφίενταί是现在时被动语态，主语是“你的罪”。“得赦免了”以自然汉语表达被动及现存结果，同时不明确限定赦免发生的具体时间。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: “罪”是现代汉语圣经语境中准确而通行的表达；汉语集合名词无需复数标记。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 该简短命令在医治语境中是叫人起身；“起来”自然、有力。
- source_word: καὶ περιπάτει
  choice: 行走
  rationale: περιπάτει命令对方起身后走动。“行走”庄重而易懂，也保留动作持续展开的意味。
- source_word: σου
  choice: 你的
  rationale: 保留第二人称单数所属关系，直接指向被医治的人。
theological_decisions:
- issue: 耶稣宣告赦罪时的时态表达
  choice: 你的罪得赦免了
  alternative: 你的罪已经蒙赦免
  rationale: 希腊文现在时被动可表示现存状态，但不要求译文进一步断定赦免发生的时间。“得赦免了”保留宣告的直接力量及时间上的一定开放性。
translation_notes:
  register: 采用现代、庄重且口语可懂的普通话。“因为”保留与上文的论证联系；两项引语保持平行结构。脚注呈现现在时被动语态可能具有的结果状态含义，而不在正文中消除其时态张力。
