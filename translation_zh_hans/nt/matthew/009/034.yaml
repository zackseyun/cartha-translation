  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: zh_hans
  text: 可是，法利赛人却说：“他是靠着鬼王[a]赶鬼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“群鬼的统治者”。
    reason: 说明“鬼王”所对应的ἄρχων τῶν δαιμονίων也可展开译为“群鬼的统治者”，避免把“王”理解为世袭贵族称号。
lexical_decisions:
- source_word: δὲ
  choice: 可是
  rationale: 在上下文中表示转折：众人惊奇赞叹，法利赛人却作出敌意解释。“可是”自然地传达这一转折。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代汉语中通行的犹太群体名称；汉语无需另行表达希腊文定冠词。
- source_word: ἔλεγον
  choice: 却说
  rationale: 希腊文未完成时可表示持续或反复的言说；本句汉语用叙事性的“说”最自然，不以“不断说”等措辞过度限定其体貌含义。
- source_word: Ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: 靠着鬼王
  rationale: ἐν加与格在此表示凭借或能力来源；“靠着”准确而自然。“鬼王”简洁表达“群鬼的统治者”，并保留其权柄关系。
- source_word: ἐκβάλλει
  choice: 赶
  rationale: 在赶鬼语境中，“赶鬼”是现代汉语清楚、自然且固定的表达，对应把鬼逐出的动作。
- source_word: τὰ δαιμόνια
  choice: 鬼
  rationale: δαιμόνια特指超自然的邪灵存在；在“赶鬼”这一固定搭配中译为“鬼”最自然，也未将其泛化为抽象的邪恶力量。
theological_decisions:
- issue: 法利赛人所指的能力来源
  choice: 靠着鬼王
  alternative: 靠着群鬼的统治者
  rationale: 原文指控耶稣凭借统辖群鬼者的权势赶鬼。“鬼王”保留这一超自然及权柄层面的指控，但不额外把该统治者明确命名为撒但，以免超出本节原文。
- issue: δαιμόνια在赶鬼语境中的译法
  choice: 鬼
  alternative: 邪灵
  rationale: 原词是δαιμόνια而非πνεύματα；“鬼”在汉语“赶鬼”语境中直接对应所指存在，并保留原文的超自然主张。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“靠着……赶鬼”符合普通读者习惯；保留法利赛人指控的直接性，不补出原文未明说的专名或动机。
