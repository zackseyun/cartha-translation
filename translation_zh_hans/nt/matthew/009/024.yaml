base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: zh_hans
  text: 他对他们说：“你们离开吧，因为这女孩没有死，而是睡着了。”他们就讥笑他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 他一直说
  rationale: 未完成时可表示当时持续或反复的言说；“一直说”在现代汉语中自然地保留这一体貌。
- source_word: Ἀναχωρεῖτε
  choice: 你们出去吧
  rationale: 复数命令式要求在场众人离开；按室内场景译为“出去”自然明确，“吧”缓和汉语语气而不取消命令意味。
- source_word: οὐ γὰρ
  choice: 因为……没有
  rationale: γάρ说明要求众人出去的原因；“因为”清楚表达因果关系。
- source_word: ἀπέθανεν
  choice: 没有死
  rationale: 不定过去时把死亡作为事件来陈述；汉语“没有死”简洁自然，并与下文“在睡觉”形成对照。
- source_word: τὸ κοράσιον
  choice: 这女孩
  rationale: κοράσιον指女孩或年幼女子；“这女孩”自然，并借指示词承接当前场景中的对象，不额外强化其年龄。
- source_word: ἀλλὰ καθεύδει
  choice: 而是在睡觉
  rationale: 现在时描述当前动作或状态；“在睡觉”保留耶稣话语中的字面意象及其张力。
- source_word: κατεγέλων αὐτοῦ
  choice: 众人却嘲笑他
  rationale: καταγελάω表示带有轻蔑意味地笑人，即嘲笑；“嘲笑”比单纯“笑他”更准确表达该词本身的讥诮色彩。“众人”依据复数动词和场景补出主语，使中文通顺。
theological_decisions:
- issue: 耶稣说女孩“没有死，而是在睡觉”
  choice: 正文按字面保留“在睡觉”，不作解释性扩展
  alternative: 译为“只是在睡觉”，或在正文中说明“睡觉”是死亡的比喻
  rationale: 原文以鲜明对照保留叙事和神学张力，并未在此解释这句话的性质；译文不应自行判定这是比喻、表象描述还是预示性的说法。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“他一直说”保留未完成时的持续性；末句用“嘲笑”直接传达原文的讥诮含义，因此无需另设词义脚注。
