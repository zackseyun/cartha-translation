  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: zh_hans
  text: 他们出去的时候，看哪，有些人把一个不能说话[a]、被鬼附[b]的人带到他跟前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耳聋的人”。希腊语κωφός按语境可指不能说话或听不见；下一节说这人开口讲话，因此正文译作“不能说话”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“受鬼控制”或“被鬼侵扰”。原文没有进一步说明这种状况的具体方式或程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: 他们出去的时候
  rationale: 以时间从句表达属格独立结构；上下文已足以标明人物，因此不增添原文未明说的身份。δέ在此主要推动场景转换，汉语无需另译“但”。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文提示读者注意、增强叙事现场感的作用；这一表达庄重且为普通中文读者所能理解。
- source_word: προσήνεγκαν αὐτῷ
  choice: 有人把……带到他跟前
  rationale: 第三人称复数的主语未明，译作“有人”符合现代汉语；“带到他跟前”自然体现προσφέρω与间接受词αὐτῷ。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处重点在患者的状况，现代汉语用“一个……的人”自然准确，也不额外强化原文在本句中并非重点的性别信息。
- source_word: κωφὸν
  choice: 不能说话
  rationale: κωφός可指耳聋或不能说话；下一节说这人开口讲话，因此正文采用符合近上下文且清楚自然的“不能说话”，同时以脚注保留“耳聋”的词义可能。
- source_word: δαιμονιζόμενον
  choice: 被鬼附
  rationale: 简明表达福音书叙事中的邪灵侵扰，并保留被动受制的含义；不进一步界定其作用方式或程度。
theological_decisions:
- issue: 如何翻译邪灵侵扰的表述
  choice: 被鬼附
  alternative: 受鬼控制／被鬼侵扰
  rationale: 原文直接陈述这人的状况，却未解释邪灵作用的具体机制。“被鬼附”在中文圣经语境中清楚、简洁，并避免添加经文没有给出的系统性区分。
- issue: κωφός在本节指不能说话还是耳聋
  choice: 正文译“不能说话”
  alternative: 耳聋
  rationale: 该词本身可有两义，下一节“那不能说话的人就说出话来”支持此处理解为言语能力受阻；脚注仍保留真实的词义歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”有意保留原文的叙事提示语；其余句法按汉语习惯重组。正文不补出“耶稣”，以“他”对应原文代词，并由上下文确定所指。
