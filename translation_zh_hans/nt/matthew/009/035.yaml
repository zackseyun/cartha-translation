id: MAT.9.35
reference: Matthew 9:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: zh_hans
  text: 耶稣走遍各城各村，在他们的会堂里教导人，宣讲国度的好消息[a]，医治一切疾病和一切病弱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“国度的福音”。
    reason: lexical_alternative
  - marker: b
    text: “病弱”也可译作“病症”或“软弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: 走遍
  rationale: 未完成时描写持续、巡回的行动；“走遍”自然表达耶稣在各地往来，同时与后面的“各城各村”紧密衔接。
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: 各城各村
  rationale: 分别保留较大聚居地与较小村落的区别；“各……各……”简洁体现范围的周遍性。
- source_word: διδάσκων
  choice: 教导人
  rationale: 准确表达持续进行的教导活动；补出泛指宾语“人”符合现代汉语表达，不限定具体听众。
- source_word: συναγωγαῖς αὐτῶν
  choice: 他们的会堂
  rationale: “会堂”保留第一世纪犹太宗教与社群场所的历史含义；“他们的”对应原文代词，指各地社群的会堂。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 兼具公开宣告和讲说之意，比单纯“讲”更能体现 κηρύσσω 的传扬色彩，又不过度教会化。
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: 国度的好消息
  rationale: “好消息”直接传达 εὐαγγέλιον 的词义；“国度”保留属格结构及原文未明说国度所属者的表达，避免擅自补入“上帝”或改作“天国”。
- source_word: θεραπεύων
  choice: 医治
  rationale: 符合福音书中治疗疾病的语境，也是自然、庄重的现代汉语。
- source_word: πᾶσαν νόσον
  choice: 一切疾病
  rationale: “疾病”准确表达 νόσος；“一切”保留 πᾶσαν 所表达的全面范围。
- source_word: πᾶσαν μαλακίαν
  choice: 一切病弱
  rationale: μαλακία 可指虚弱、病弱或病症；“病弱”兼顾疾病和衰弱的语义，并与前面的“疾病”保持区别。
theological_decisions:
- issue: εὐαγγέλιον 的译法
  choice: 好消息
  alternative: 福音
  rationale: “好消息”让现代普通读者直接理解其词义；脚注保留传统且具有神学沿用背景的“福音”。
- issue: τῆς βασιλείας 中“国度”的所指
  choice: 国度
  alternative: 上帝的国度；天国
  rationale: 原文此处只有带定冠词的“国度”，没有明说“上帝”或“天”；正文保留其简约表达，不替读者消除语境中的隐含关系。
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν 所表达的医治范围
  choice: 一切疾病和一切病弱
  alternative: 各种疾病和各种病症
  rationale: 重复“一切”对应两次 πᾶσαν，保留原文强调的全面范围；同时不将这句话扩展为原文之外的系统性教义主张。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“各城各村”“会堂”“宣讲”等表达简洁而保留历史语境；正文中的脚注标记 [a]、[b] 分别紧跟相关词组。
