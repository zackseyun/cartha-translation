  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: zh_hans
  text: 耶稣来到那位首领[a]的家里，看见吹笛的人[b]和正在喧闹的人群[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“官长”；参照平行记载，也可理解为“会堂主管”。马太在这里用的只是较宽泛的“首领”一词。
    reason: alternative_reading
  - marker: b
    text: 当时的丧礼通常会有吹笛者等职业哀悼人员在场。
    reason: cultural_note
  - marker: c
    text: 或译“骚动不已”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来到
  rationale: 不定过去时分词表示叙事中的先后或伴随动作；用“来到”配合后面的“看见”，符合现代汉语叙事习惯，也保留动作次序。
- source_word: οἰκίαν
  choice: 家里
  rationale: 在此叙事情境中指那人的住宅；“家里”比“房屋里”更自然，又不过度发挥。
- source_word: ἄρχοντος
  choice: 首领
  rationale: 原词泛指掌权者或领袖；“首领”保留马太措辞的宽泛性，不把平行记载中的“会堂主管”直接写入正文。
- source_word: ἰδὼν
  choice: 看见
  rationale: 准确表达普通的视觉感知和叙事动作，不强化为“察看”或“注意到”。
- source_word: αὐλητὰς
  choice: 吹笛的人
  rationale: 指吹奏笛或管乐器的人；此译清楚、自然，并避免使用现代读者可能陌生的专门称谓。
- source_word: ὄχλον
  choice: 人群
  rationale: 这是叙事语境中对ὄχλος自然、常用的对应表达。
- source_word: θορυβούμενον
  choice: 喧闹的
  rationale: 该分词描写人群处于嘈杂骚动之中；“喧闹的”保留声音与混乱感，却不额外断定他们具体的情绪或行为。
theological_decisions:
- issue: 屋主身份的具体认定
  choice: 首领
  alternative: 官长；会堂主管
  rationale: 马太此处只使用ἄρχων这一宽泛称谓。正文不借平行记载将其明确为会堂主管，从而尊重本节自身的措辞；其他可能译法放入脚注。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。经文在本节末仍承接下一节，因此保留句末逗号。脚注标记紧跟各自所说明的词语，便于阅读。
