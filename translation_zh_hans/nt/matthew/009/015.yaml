source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“新郎还和婚礼宾客在一起时，婚礼宾客怎能哀恸呢？[a]但日子将到，新郎要从他们身边被带走[b]，那时他们就要禁食。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婚礼宾客”原文直译为“婚房之子”，是一种习语，指新郎的同伴或参加婚宴的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“从他们身边被除去”。原文采用被动说法，意味不只是普通的离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: 宾客
  rationale: 字面为“婚房之子”，是闪语式习语，指婚礼中与新郎一同庆贺的人。译作“宾客”自然易懂，也符合喜宴场景；脚注保留其较具体的字面和角色含义。
- source_word: πενθεῖν
  choice: 哀恸
  rationale: 表示哀伤、悲悼，与婚礼的喜庆气氛和后文的禁食形成鲜明对照；“哀恸”庄重而通俗。
- source_word: ἐφ’ ὅσον
  choice: ……的时候
  rationale: 在句中表达持续时段，即“只要……还在”；结合“还”自然传达其延续意味。
- source_word: νυμφίος
  choice: 新郎
  rationale: 现代汉语中“新郎”准确自然，并保留原文的婚礼隐喻，不在正文中进一步解释其基督论含义。
- source_word: ἀπαρθῇ
  choice: 被带走
  rationale: 保留被动语态及非普通自行离去的意味，同时不把被带走的方式或施事者明说出来。
- source_word: νηστεύσουσιν
  choice: 就要禁食
  rationale: 准确表达将来的禁食行动；“就”对应“那时”所强调的时间转折。
- source_word: Μὴ δύνανται ... ;
  choice: 怎能……呢？
  rationale: 以汉语反问句体现 μή 所预期的否定回答，比平铺直叙更贴近原文语气。
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: 但日子将到
  rationale: 保留原文常见的预告式表达和 δέ 的转折作用，语言庄重自然。
theological_decisions:
- issue: 新郎意象可能具有的基督论意义
  choice: 保留“新郎”的隐喻，不在正文中明说耶稣是弥赛亚新郎
  alternative: 解释性地扩写为“作为弥赛亚新郎的耶稣”
  rationale: 原文本身让耶稣借新郎意象谈论自己，但没有在本节明说其完整神学含义；直保留隐喻可避免超出文本，并让读者体会其张力。
- issue: ἀπαρθῇ 是否明确指暴力死亡
  choice: 译作被动的“被带走”，保留暗示而不明说死亡
  alternative: 译作“被杀”或弱化为“离开”
  rationale: 原词的被动措辞比普通离去更强，可能预示耶稣受难，但本节没有直接说“被杀”；译文应兼顾这种暗示和原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎能……呢”保留反问语气；“哀恸—禁食”维持原文的情感与宗教实践联系。脚注标记均置于正文对应位置。
