id: MAT.9.18
reference: Matthew 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: zh_hans
  text: 耶稣正对他们说这些话的时候，看哪，有一位官长前来，向他下拜，说：“我的女儿刚刚死了。但请你来，把手按在她身上，她就会活过来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留原文引人注意、推动叙事的语气；用简洁而庄重的现代汉语表达。
- source_word: ἄρχων
  choice: 领袖
  rationale: 原词仅说明此人是有权位者，并未在本节限定其具体职务；“领袖”保留这一概括性。
- source_word: προσεκύνει
  choice: 向他下拜
  rationale: 表达俯伏致敬或敬拜的动作，同时不替上下文预先判定其神学含义。
- source_word: ἄρτι ἐτελεύτησεν
  choice: 刚刚死了
  rationale: 直接呈现ἄρτι的时间意味和ἐτελεύτησεν在此处的死亡含义。
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: 把手按在她身上
  rationale: 自然传达按手于某人身上的具体动作。
- source_word: ζήσεται
  choice: 会活过来
  rationale: 在女儿已经死亡的语境中，明确表达恢复生命，而不添加原文没有的机制说明。
theological_decisions:
- issue: προσκυνέω所指的是一般尊敬还是敬拜
  choice: 译作“向他下拜”
  alternative: “敬拜他”或“跪拜他”
  rationale: 原词可涵盖俯伏致敬与敬拜；中性动作表达保留此处的语义和神学张力。
- issue: 领袖对耶稣能力的确信程度
  choice: “她就会活过来”
  alternative: “她便必活了”
  rationale: 保留原文直陈式所表达的确信，同时避免额外强化为原文没有明说的教义性宣告。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“看哪”略带经文体色彩，用来保留ἰδού的突显作用；其余措辞尽量自然顺畅。
