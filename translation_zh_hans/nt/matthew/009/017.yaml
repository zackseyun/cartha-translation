id: MAT.9.17
reference: Matthew 9:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: zh_hans
  text: 人也不把新酒装在旧皮袋里；不然，皮袋就会胀裂，酒漏出来，皮袋也毁了。相反，人把新酒装在新皮袋[a]里，这样两样都能保全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文形容酒的“新”（νέος）与形容皮袋的“新”（καινός）用了不同的词：前者侧重新近，后者侧重崭新、状态合用。
    reason: 说明原文在两个“新”之间的词汇差异，避免中文相同译词掩盖这一细微区别。
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: 人也不把……装在
  rationale: οὐδέ承接上一则比喻，引出另一个否定例证；“也不”保留连接作用。“装在”符合把酒存入皮袋的现代汉语习惯。
- source_word: οἶνον νέον
  choice: 新酒
  rationale: 指新近酿成的酒；“新酒”简洁自然，并保留与旧皮袋的对比。
- source_word: ἀσκοὺς παλαιούς
  choice: 旧皮袋
  rationale: ἀσκός指以兽皮制成、可盛液体的袋；上下文已明确所盛的是酒，因此“皮袋”准确而不过度解释。παλαιός直译为“旧”。
- source_word: εἰ δὲ μή γε
  choice: 不然
  rationale: 这是引出后果的条件性警告；“不然”自然地表达“若不是这样”的含义。
- source_word: ῥήγνυνται
  choice: 胀裂
  rationale: 新酒发酵产生的压力会使旧皮袋裂开；“胀裂”既传达破裂，也使具体情境清楚，但未添加原文之外的解释句。
- source_word: ἐκχεῖται
  choice: 漏出来
  rationale: 皮袋裂开后，酒会流失；“漏出来”贴合容器破裂的语境，比中性的“倒出来”更准确。
- source_word: ἀπόλλυνται
  choice: 毁了
  rationale: 这里指皮袋遭破坏、不能再用；“毁了”保留损坏与损失的力度。
- source_word: ἀλλὰ
  choice: 相反
  rationale: 标明正确做法与前述错误做法之间的鲜明转折。
- source_word: ἀσκοὺς καινούς
  choice: 新皮袋
  rationale: καινός强调皮袋崭新、状态合用；正文用自然的“新皮袋”，并以脚注说明它与形容酒的νέος在希腊文中并非同一个词。
- source_word: ἀμφότεροι συντηροῦνται
  choice: 这样两样都能保全
  rationale: “两样”明确指酒与皮袋；“保全”准确表达二者均得保存、不致损失。
theological_decisions:
- issue: 同一节中νέος与καινός的区别
  choice: 正文均用自然汉语“新”，脚注说明希腊文用词有别
  alternative: 把οἶνον νέον译为“新酿的酒”，把ἀσκοὺς καινούς译为“崭新的皮袋”
  rationale: 希腊文以νέος形容酒的新近，以καινός形容皮袋崭新、状态合用。正文若刻意采用两个较长的修饰语，会削弱比喻的简洁力度；脚注则能保存原文的词汇差异，又不把该差异扩展成特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“皮袋”保留古代生活背景；“胀裂、漏出来、毁了”构成清晰而有力度的后果链。“这样”使末句在汉语中顺畅表达正确做法所带来的结果。
