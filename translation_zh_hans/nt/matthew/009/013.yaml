- from: 你们去揣摩这句话的意思：‘我要的是怜悯，不是祭祀。’[a] 因为我来，不是要召义人，而是要召罪人。[b]
  to: 你们去学习这是什么意思：‘我要的是怜悯，不是祭祀。’[a] 因为我来不是召义人[b]，而是召罪人。
  rationale: 修订以“去学习这是什么意思”更直接对应 πορευθέντες δὲ μάθετε τί ἐστιν，保留命令和理解经文含义的要求；保留“我要的是怜悯，不是祭祀”的先知性对照，不扩展为对祭祀制度的绝对否定；保留“义人”的原文歧义，并将相关脚注准确锚定于该词。
