  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: zh_hans
  text: 你们去学习这是什么意思：‘我要的是怜悯，不是祭祀。’[a] 因为我来不是召义人[b]，而是召罪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《何西阿书》6:6。
    reason: cross_reference
  - marker: b
    text: “义人”也可能指“自以为义的人”；希腊文直说“义人”。
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: 你们去揣摩
  rationale: 不拘泥于分词形式，按其与命令式连用的惯用表达处理；“去揣摩”既自然，也保留了带有责备意味的拉比式劝诫。
- source_word: τί ἐστιν
  choice: 这句话的意思
  rationale: 结合随后引文，译出其要求理解经文含义的语用功能；更直译可作“这是什么”。
- source_word: Ἔλεος
  choice: 怜悯
  rationale: “怜悯”是现代汉语中自然且庄重的对应词，兼顾对人的慈悲行动与《何西阿书》引文的宗教伦理意涵。
- source_word: θέλω
  choice: 我要的是
  rationale: 在“不是……”的对照结构中，“我要的是”清楚表达意愿和重视次序，同时不把引文扩大解释为绝对废除祭祀。
- source_word: θυσίαν
  choice: 祭祀
  rationale: 贴合献祭活动的语境，并在汉语中比单用“祭”更易懂。
- source_word: ἦλθον καλέσαι
  choice: 我来……是要召
  rationale: 保留耶稣使命陈述中的“来”与“召”；“召”比“邀请”更能保存呼召和召集的开放语义。
- source_word: δικαίους
  choice: 义人
  rationale: 按希腊文实译为类别称谓，不在正文中明确解释为“自以为义的人”。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 保留原文与“义人”之间鲜明而简洁的对照。
theological_decisions:
- issue: 《何西阿书》6:6引文中怜悯与祭祀的关系
  choice: 译作“我要的是怜悯，不是祭祀”
  alternative: 译成“我喜爱怜悯胜过祭祀”或扩写为上帝拒绝一切祭祀
  rationale: 正文保留先知性对照的力度，却不额外断定这句话在所有意义上废除祭祀。
- issue: “义人”的所指
  choice: 正文保留“义人”
  alternative: 译作“自以为义的人”
  rationale: 上下文可能带有反讽，但希腊文本身只说“义人”；不应在正文中消除这项真实的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们去揣摩”保留教导兼责备的语气；引文用简洁的对照句式。所有脚注标记均置于相关正文之后。
