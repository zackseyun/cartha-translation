language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: zh_hans
  text: 众人看见这事，就惧怕[a]，并将荣耀归给那位把这样的权柄赐给人的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就心生敬畏。”原文动词通常指害怕，但这里也可能包含敬畏和惊异。
    reason: lexical_alternative
  - marker: b
    text: 原文为复数，也可译作“人们”或“人类”。这里保留“人”，指向上帝所赐给人的权柄，并保留本句在耶稣行使此权柄的叙事语境中所产生的张力。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见这事
  rationale: 不定过去时分词在此表达先于主要动作发生的情境，可自然译为“看见”。原文未明说宾语；“这事”承接上文耶稣医治瘫子的事件，同时避免过度具体化。
- source_word: δὲ
  choice: 就
  rationale: δέ在此主要推动叙事并转向众人的反应。汉语用“就”连接所见与反应，比生硬加入“但是”更符合语篇关系。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 原文为复数，指在场的群众。“众人”是现代汉语中自然、庄重的集合表达。
- source_word: ἐφοβήθησαν
  choice: 惧怕起来
  rationale: φοβέομαι的基本义是害怕、惧怕；“惧怕”也能保留此处可能包含敬畏和惊异的语义张力，不直接弱化为“惊叹”。
- source_word: ἐδόξασαν
  choice: 将荣耀归给
  rationale: δοξάζω在此指尊崇上帝、把荣耀归给上帝。此译法既保留“荣耀”这一核心词义，也比直译作“荣耀了上帝”更符合现代汉语。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 作为ἐδόξασαν的直接宾语，采用现代汉语基督教文本中通行且庄重的称谓。
- source_word: τὸν δόντα
  choice: 他……赐给了
  rationale: 带冠词的不定过去时分词修饰“上帝”，说明他是赐下权柄的那一位。汉语用独立分句承接，保持关系明确而不使长定语累赘；“了”体现赐予先于众人的反应。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: ἐξουσία侧重合法的权限、权威或行使权力的资格；“权柄”比单纯的“能力”更准确，并与本段赦罪权柄的语境呼应。
- source_word: τοιαύτην
  choice: 这样的
  rationale: 直接保留指示性质，指向众人刚刚从耶稣言行中看见的这类权柄，不擅自解释其程度。
- source_word: τοῖς ἀνθρώποις
  choice: 给了人
  rationale: ἄνθρωποι为复数，可泛指人、人们或人类。汉语集合名词“人”既忠实保留原文的人类指称，也保留众人因耶稣行使权柄而说上帝把权柄赐给“人”的叙事张力。
theological_decisions:
- issue: 众人的反应是恐惧还是敬畏惊叹
  choice: 惧怕起来
  alternative: 心生敬畏／惊叹不已
  rationale: 原文动词明确具有“害怕、惧怕”之义，语境虽可能包含敬畏和惊异，却不宜在正文中把较强的恐惧意味消解掉。
- issue: τοῖς ἀνθρώποις所指是某个男人、众人还是人类
  choice: 人
  alternative: 人们／人类
  rationale: 原词ἄνθρωπος不同于专指成年男性的ἀνήρ，在复数中可以泛指人类。译作“人”不限定为男性，同时保留原文复数表达所产生的神学张力：众人回应的是耶稣所显出的权柄，却说上帝把这样的权柄赐给了人。
- issue: 分词τὸν δόντα表达定语还是原因
  choice: 以分句“他把……赐给了人”说明上帝的行动
  alternative: 译为“因为他把……赐给了人”
  rationale: 原文是修饰“上帝”的带冠词分词，并未明说因果连词。分句表达既自然，又避免把隐含关系锁定为单一的因果解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“惧怕”保留恐惧与敬畏之间的张力；“将荣耀归给上帝”和“权柄”保留关键神学词汇而不显生硬。分号使修饰上帝的希腊语分词在汉语中成为清楚的承接分句。
