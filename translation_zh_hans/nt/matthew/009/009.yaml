source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: zh_hans
  text: 耶稣从那里往前走时，看见一个名叫马太的人坐在收税处，就对他说：“跟从我。”马太便起来，跟从了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: 从那里往前走时
  rationale: 现在分词与地点副词共同描写耶稣离开先前地点继续前行；此译既保留动作的进行性，也符合现代汉语叙事习惯。
- source_word: ἄνθρωπον
  choice: 一个……的人
  rationale: 此处指一位具体的男性；结合后面的姓名，译作“一个名叫马太的人”自然准确。
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: 坐在税关
  rationale: τελώνιον 指征收税款或关税的地点。“税关”简洁地保留当时征税关卡的场景，避免现代行政机构色彩较重的“税务局”。
- source_word: Μαθθαῖον λεγόμενον
  choice: 名叫马太
  rationale: λεγόμενον 在这里引出此人的名字；“名叫”是自然、明确的现代汉语表达。
- source_word: λέγει αὐτῷ
  choice: 就对他说
  rationale: 希腊文使用历史现在时以增强叙事的鲜明感；现代汉语动词本身不标记过去或现在，因此“就对他说”自然承接情节而不必强加时态。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 直接保留命令语气以及跟随耶稣的含义，不增添“作我的门徒”等解释性措辞。
- source_word: ἀναστὰς
  choice: 便起来
  rationale: 不定过去时分词表示先于主要动作发生的回应；“便”也传达紧接着行动的叙事次序。
- source_word: ἠκολούθησεν αὐτῷ
  choice: 跟从了他
  rationale: 既表达马太实际随耶稣而行，也保留成为跟随者的含义，不将其窄化为抽象的身份说明。
theological_decisions:
- issue: 耶稣对马太呼召的性质
  choice: 直译为“跟从我”
  alternative: “来作我的门徒”或“加入我的行列”
  rationale: 上下文显明这是对马太的门徒呼召，但原文只用简洁的命令句。正文保留这一简洁性，让行动本身呈现其神学分量，不加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“税关”保留历史场景，“跟从”比日常口语“跟着”更能兼顾实际随行与门徒关系。希腊文的历史现在时在汉语中无需另设时态标记。
