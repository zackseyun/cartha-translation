  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: zh_hans
  text: 于是，他对自己的门徒说[a]：“庄稼固然多[b]，工人却少。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里采用历史现在时，直译仍是“说”；也可按汉语叙事习惯理解为“说道”。
    reason: lexical_alternative
  - marker: b
    text: “庄稼固然多”也可译作“收成确实丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事次序；“于是”简洁自然，并衔接上文情境。
- source_word: λέγει
  choice: 说
  rationale: 原文使用叙事中的历史现在时；汉语“说”无需强制标明过去时，既自然又保留原文的叙事鲜活感。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对自己的门徒
  rationale: 明确保留αὐτοῦ的所属含义；“门徒”是μαθητής在本语境中的通行译法。
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: 固然……却……
  rationale: 自然呈现μέν…δέ所构成的对照关系，又避免生硬的逐词对应。
- source_word: θερισμός
  choice: 庄稼
  rationale: 在汉语圣经语境中能自然承载收割的农业意象及其比喻意义；不在正文中解释其所指。
- source_word: πολύς
  choice: 多
  rationale: 直接表达数量丰盛，并与后面的“少”形成鲜明对应。
- source_word: ἐργάται
  choice: 工人
  rationale: 准确指从事收割工作的人，现代、清楚，并保留比喻框架。
- source_word: ὀλίγοι
  choice: 少
  rationale: 直接对应原文谓语形容词，并与“多”构成简洁对照。
theological_decisions:
- issue: “庄稼”的比喻含义
  choice: 保留农业比喻，不在正文中明说庄稼所代表的人群或使命对象。
  alternative: 意译为“等候福音的人很多”或类似解释性表达。
  rationale: 本节原文只陈述比喻，具体指向须由上下文显明；正文不应提前消解其开放性。
- issue: μέν…δέ的强调与对照
  choice: 译作“固然……却……”，保留庄稼多与工人少之间的张力。
  alternative: 仅译作“……多，但……少”。
  rationale: “固然……却……”较完整地呈现原文成对结构，同时符合现代汉语表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自己的门徒”保留原文明确的所属关系；“庄稼—工人”的农业图像保持简洁，不加入解释性神学措辞。
