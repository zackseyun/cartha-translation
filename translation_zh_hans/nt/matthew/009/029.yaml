  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: zh_hans
  text: 于是，耶稣摸了他们的眼睛，说：“照着你们的信心[a]，愿这事成就在你们身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照着你们的信靠，愿这事发生在你们身上。”希腊语“πίστις”也可译为“信靠”；在某些其他语境中也可表示“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中紧接着发生的动作；“于是”在现代汉语叙事中自然简洁。
- source_word: ἥψατο
  choice: 摸了
  rationale: 此处指实际触碰；“摸了他们的眼睛”准确而自然，不额外扩展动作。
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: 他们的眼睛
  rationale: 该属格结构表示所触碰的部位，按现代汉语习惯译作宾语。
- source_word: λέγων
  choice: 说
  rationale: 现在分词表示与触摸动作相伴的言说；汉语用连动结构“摸了……，说”更自然。
- source_word: Κατὰ
  choice: 照着
  rationale: κατά加宾格在此表示相称、依照或衡量标准；“照着”保留这种关系，不强化为明确的因果或功劳依据。
- source_word: τὴν πίστιν ὑμῶν
  choice: 你们的信心
  rationale: πίστις在此语境中指两个盲人对耶稣医治能力的信靠；“信心”是现代中文圣经语域中自然且明确的表达。
- source_word: γενηθήτω
  choice: 成全吧
  rationale: 该词为γίνομαι的不定过去时被动命令式，在这里构成带施行效力的宣告；“成全吧”保留命令/允准语气，并自然表达所求之事得以实现。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 与格在这里表达接受者或受益者；“给你们成全”符合现代汉语表达。
theological_decisions:
- issue: 医治宣告中πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文聚焦于求医者对耶稣能力的相信，因此“信心”最贴切。“信靠”可说明其关系性含义；“忠信”虽属πίστις在其他语境中的可能义项，但在本节并不自然。
- issue: 信心与医治之间关系的表达
  choice: 照着你们的信心
  alternative: 因着你们的信心；按你们信心的大小
  rationale: 原文κατά表达相称或依照，未明确断定信心是医治的功劳性原因，也没有明说按信心大小分配医治程度；主译保留这一神学张力。
- issue: γενηθήτω的施行性语气
  choice: 给你们成全吧
  alternative: 愿这事为你们成就；让这事发生在你们身上
  rationale: 采用带命令/允准色彩的宣告，而不是仅仅表达愿望；同时不把未明说的施事者补入正文。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“于是”推进叙事，“摸了他们的眼睛，说”保留动作与言说的紧密联系。正文中的脚注标记[a]置于整句之后。
