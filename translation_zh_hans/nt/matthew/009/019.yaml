base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: zh_hans
  text: 耶稣就起身跟着他去，他的门徒也跟着去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: 起身
  rationale: 该词是ἐγείρω的不定过去时被动分词，此处按不及物意义使用，表示耶稣从原来的姿势起来并开始行动。“起身”自然、庄重，也准确衔接下文。
- source_word: ἠκολούθει
  choice: 跟着他去
  rationale: ἀκολουθέω的未完成过去时可带有持续意味；在本叙事中，“跟着他去”既传达跟随的动作和方向，也符合现代汉语叙事习惯，无须刻意译成进行体。
- source_word: αὐτῷ
  choice: 他
  rationale: 该与格代词受ἀκολουθέω支配，所指承接上一节前来求助的管会堂者。汉语用“跟着他”自然表达。
- source_word: μαθηταὶ
  choice: 门徒
  rationale: “门徒”是福音书中μαθηταί的通行而准确译法，保留师徒关系及跟随者的特定含义。
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒也跟着去了
  rationale: 希腊文在第二个并列分句中省略重复的动词。汉语补出“跟着去了”，清楚说明门徒也随行；“他的”指耶稣。
