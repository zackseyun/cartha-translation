id: MAT.9.12
reference: Matthew 9:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: zh_hans
  text: 耶稣听见了，就说：“健康的人不需要医生，有病的人才需要。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见了
  rationale: 不定过去时分词表示先于主句或与主句紧密相连的动作；所听见的内容可由上文补足，中文无需添加宾语也很自然。
- source_word: δὲ
  choice: 就
  rationale: δέ在此承接上文，并带出耶稣针对所听之话的回应；中文用“就”自然表达这一衔接，不刻意强化为较重的转折。
- source_word: εἶπεν
  choice: 说
  rationale: 忠实保留普通言说动词的含义，不增译为“回答”。主语由上下文明确为耶稣，中文明说主语以避免歧义。
- source_word: οἱ ἰσχύοντες
  choice: 健康的人
  rationale: ἰσχύω本义涉及强健、有力量；在与“有病的人”和“医生”的对照中，指身体健康者。“健康的人”既符合医疗语境，也保留强健之意。
- source_word: Οὐ χρείαν ἔχουσιν ἰατροῦ
  choice: 不需要医生
  rationale: χρείαν ἔχειν为“有需要”的惯用表达；现代中文以“不需要医生”简洁自然地传达原意。
- source_word: οἱ κακῶς ἔχοντες
  choice: 有病的人
  rationale: κακῶς ἔχειν在此医疗语境中是“患病、身体不适”的惯用表达；“有病的人”与“健康的人”形成清楚、自然的对照。
theological_decisions:
- issue: 医病格言的字面意义与属灵应用
  choice: 正文按原文直译为关于健康者、病人和医生的格言，由上下文呈现其对罪人的应用。
  alternative: 在正文中解释性地译出罪人属灵上的需要。
  rationale: 本节原文本身使用医疗图像，并未在句内明说属灵含义。保留字面比喻可避免提前消解其神学张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“医生”比“医师”更符合当代日常用语，同时不失端正；整句保留格言式的简洁与对称。
