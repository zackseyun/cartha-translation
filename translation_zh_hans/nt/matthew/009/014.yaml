id: MAT.9.14
reference: Matthew 9:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: zh_hans
  text: 那时，约翰的门徒到他跟前，说：“为什么我们和法利赛人常常禁食[a]，你的门徒却不禁食呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多次禁食”；希腊语πολλά与“禁食”连用，表示经常这样做。
    reason: 保留πολλά在此处所表达的频率含义，并以自然的现代汉语说明替代译法。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间和叙事衔接语，既承接前文，又自然引出接下来的事件。
- source_word: προσέρχονται αὐτῷ
  choice: 到他跟前
  rationale: 准确表达向某人走近、来到某人面前的意思，并保留原文代词“他”。
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: 约翰的门徒
  rationale: 以现代汉语自然的领属结构表达“约翰的门徒”。
- source_word: λέγοντες
  choice: 说
  rationale: 希腊语分词表示与主要动作同时发生的言说，汉语用连动结构“到……跟前，说”最为自然。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 直接、自然地表达询问原因。
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: 我们和法利赛人
  rationale: 保留原文明确列出的第一人称群体及法利赛人，也保留ἡμεῖς所带的对比意味。
- source_word: νηστεύομεν
  choice: 禁食
  rationale: “禁食”是现代汉语中清楚、通行的宗教用语，准确表达出于宗教目的不进食。
- source_word: πολλά
  choice: 常常
  rationale: πολλά在这里修饰“禁食”，表达多次、频繁的惯常实践；“常常”自然且准确，同时以脚注保留其他可能的直译表达。
- source_word: οἱ δὲ μαθηταί σου
  choice: 你的门徒却
  rationale: “却”自然体现δέ在问句中的鲜明对比作用。
- source_word: οὐ νηστεύουσιν
  choice: 不禁食
  rationale: 现在时在此与“常常”相对，表示惯常做法，而非仅指某一次正在发生的行为。
theological_decisions:
- issue: 禁食质问的性质
  choice: 把问题译为对惯常宗教实践的比较，不进一步断定耶稣的门徒违背了义务。
  alternative: 把话译成对耶稣门徒疏忽规定的明确指控，或限定为某一次特定禁食。
  rationale: 现在时动词和πολλά共同指向反复、惯常的实践；译文保留质问中的张力，但不加入原文未明说的定罪或特定场景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到他跟前，说”保留原文动作与言说的顺序；问句末用“呢”自然呈现比较性质的追问。脚注标记紧跟其所说明的“常常禁食”。
source_grounding:
  english_pob_role: consult_only
