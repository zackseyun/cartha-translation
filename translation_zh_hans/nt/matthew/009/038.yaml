base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: zh_hans
  text: 所以，你们要恳切地祈求庄稼的主，差遣工人到他的庄稼中去收割[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赶出去”。原文动词比一般的“差遣”语气更强；在这里是指把工人派出去，到庄稼中收割。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: 恳切祈求
  rationale: 该词在此是命令语气，表达向上主迫切恳求；“恳切祈求”既保留祷告语境，也传达急迫意味。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文“庄稼多，工人少”所得出的劝勉；“所以”自然清楚地表达推论关系。
- source_word: κυρίου
  choice: 主
  rationale: κύριος 表示对庄稼拥有权柄者；译作“主”保留圣经用语及权柄含义。
- source_word: θερισμοῦ
  choice: 庄稼
  rationale: 在“庄稼的主”和“收他的庄稼”中保留收割及聚集的比喻；按现代汉语搭配，后半句以动词“收”使表达自然。
- source_word: ὅπως
  choice: （祈求……）差遣
  rationale: 在汉语中由“祈求”直接引出所求内容最自然，无须另译连接词。
- source_word: ἐκβάλῃ
  choice: 差遣……出去
  rationale: 此处指派出工人进入收割工作。“差遣……出去”符合语境，同时脚注说明原词比一般的“差遣”语气更强。
- source_word: ἐργάτας
  choice: 工人
  rationale: 直接指从事收割工作的人；“工人”是清楚、自然且能维持比喻的现代汉语。
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: 出去收他的庄稼
  rationale: εἰς 表达进入收割任务或领域。汉语若直译“进入他的庄稼”不自然，因此译为“出去收他的庄稼”，既保留所属关系，也不增添原文没有的“田地”。
theological_decisions:
- issue: “庄稼的主”的身份
  choice: 仅译作“庄稼的主”，不进一步指明其身份
  alternative: 明确解释为父神、耶稣或泛指上帝
  rationale: 本节没有明确说明所指是谁；保留原文称号，可避免把经文本身未限定的神学身份加以窄化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“恳切祈求”传达命令中的迫切感；“收他的庄稼”比生硬的“进入他的庄稼”更符合现代汉语，同时保留收割比喻。
