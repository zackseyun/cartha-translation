  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: zh_hans
  text: 耶稣转过身，看见她，就说：“女儿，鼓起勇气来！你的信心救了你。[a]”从那一刻起，那女人就痊愈了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救了你”也可译作“使你痊愈了”或“治好了你”。希腊语动词可以表示拯救、医治或使人恢复健全；正文保留耶稣这句话较宽广的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: 转过身，看见她
  rationale: 将两个不定过去时分词按自然汉语处理为连续动作，既保留动作次序，也不生硬复制希腊语分词结构；“转过身”符合此处语境，但不进一步限定转身方向。
- source_word: Θάρσει
  choice: 鼓起勇气来
  rationale: 表达 θαρσέω 命令式所含的勇气与振作之意，现代汉语自然清楚；也可译作“放心吧”或“振作起来”，但前者可能弱化勇气的语义。
- source_word: θύγατερ
  choice: 女儿
  rationale: 保留称呼中的亲切与接纳，不增添原文没有的“亲爱的”等修饰语。
- source_word: πίστις
  choice: 信心
  rationale: 此处指女人对耶稣所怀的相信和倚靠；“信心”在现代中文圣经语境中自然，并保留信仰层面的含义。
- source_word: σέσωκέν σε
  choice: 救了你
  rationale: σῴζω 的完成时可涵盖拯救、医治和恢复健全；正文采用较宽广的“救了你”，不把耶稣话语中的多重意味仅限于身体医治。
- source_word: ἐσώθη
  choice: 痊愈了
  rationale: 同一动词在叙事结语中明确指向女人身体状况的恢复；译作“痊愈了”清楚交代眼前结果，同时与前句较宽广的“救了你”形成原文所容许的语义张力。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: 从那一刻起
  rationale: ὥρα 在此为时间点表达；现代汉语“从那一刻起”比字面“从那时辰起”自然，并准确表示医治自当时开始生效。
theological_decisions:
- issue: πίστις 的表达
  choice: 信心
  alternative: 信靠
  rationale: “信心”兼顾传统可识别性和现代可懂度；“信靠”更突出关系性的倚靠，也属可能译法，但正文不必据此缩窄 πίστις 的范围。
- issue: 两处 σῴζω 的译法
  choice: 耶稣的话译作“救了你”，叙事结果译作“痊愈了”
  alternative: 两处均按医治义译作“治好了你／痊愈了”
  rationale: 耶稣话语中的完成时可同时唤起拯救和医治的意义，而叙事结尾明确陈述身体痊愈。分别处理既符合上下文，也避免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“女儿”保留亲切称呼；感叹号传达命令式的鼓励语气。正文避免生硬照搬希腊语分词和“从那时辰起”等不够自然的结构。
