  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: zh_hans
  text: 他看见众人，就怜悯他们，因为他们受困扰、被撇下[a]，如同没有牧人的羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“困苦无助。”这两个希腊词也可理解为众人疲惫不堪、无力照顾自己。
    reason: 词义存在合理的直译与解释性译法差异；正文保留受困扰和被弃置的意象，脚注说明常见的处境性理解。
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: 他看见……就
  rationale: 以现代汉语的承接结构表达不定过去时分词与主句之间的时间关系；δὲ在此仅轻微推进叙事，不必另译为带转折意味的“但是”。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: ὄχλοι指成群聚集的人；“众人”自然、庄重，也符合现代汉语叙事习惯。
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: 就怜悯他们
  rationale: σπλαγχνίζομαι表达发自内心的深切怜悯；“怜悯”既保留情感力度，也避免过度解释。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出他怜悯众人的原因。
- source_word: ἐσκυλμένοι
  choice: 受尽困扰
  rationale: 该词可指遭受烦扰、折磨或恶待；“受尽困扰”保留被动受压和疲惫不堪的意味，又不过度限定困扰的来源。
- source_word: καὶ ἐρριμμένοι
  choice: 倒卧在地
  rationale: ῥίπτω的完成时被动分词带有被扔下、倒在地上的鲜明形象；此译法保留原文图像，而非直接解释成“无助”。
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: 如同没有牧人的羊
  rationale: 直接保留牧羊比喻及其所呈现的无人引领、保护的脆弱状态。
theological_decisions:
- issue: 耶稣怜悯众人的表述
  choice: 就怜悯他们
  alternative: 就对他们动了慈心
  rationale: “怜悯”准确表达深切的慈悲，同时采用自然的现代汉语，不将原文的内在情感习语木直地搬入译文。
- issue: 众人处境的描写
  choice: 受尽困扰，倒卧在地
  alternative: 困苦无助
  rationale: 所选译法保留两个希腊语被动分词的受压状态和“被扔倒”的具体图像；备选译法更侧重解释其无力自顾的处境。译文不把牧羊比喻预先收窄为某一种教义性应用。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“受尽困扰，倒卧在地”保留原文的被动状态和牧羊场景中的具体图像；脚注则呈现更解释性的可能译法。
