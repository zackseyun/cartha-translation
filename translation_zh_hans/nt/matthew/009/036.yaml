revisions:
- from: 他看见众人，就怜悯他们，因为他们受尽困扰，倒卧在地[a]，如同没有牧人的羊。
  to: 他看见众人，就怜悯他们，因为他们受困扰、被撇下[a]，如同没有牧人的羊。
  rationale: 修订避免将第二个分词不必要地具体化为实际“倒卧在地”，并删除“受尽”所增加的程度含义。“受困扰、被撇下”保留两个完成被动分词所描绘的受压和被弃置状态，与“没有牧人的羊”的比喻自然连贯；脚注保留非排他的解释性替代译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:56:45Z'
review_pass:
  verdict: revise
  source_fidelity: “倒卧在地”过于具体地把ἐρριμμένοι限制为实际躺倒在地，也与羊群“没有牧人”的比喻衔接稍显生硬。该完成被动分词可保留“被撇下／被弃置”的意象；与ἐσκυλμένοι合用时，宜表达受困扰、被撇下的无依状态。
  naturalness: “他看见众人，就怜悯他们”自然庄重。“受尽困扰，倒卧在地”中“受尽”略加强为穷尽性，“倒卧在地”在现代汉语中容易理解为身体实际伏倒，建议改为“受困扰、被撇下”，既自然也更贴合语境。
  terminology: “众人”“怜悯”“牧人”均恰当，且保留了牧羊意象。脚注的“困苦无助”可作为解释性替代，但应说明它对应整组描述；“疲惫不堪、无力照顾自己”是可接受的解释，不应替代正文的意象性表达。
  issues:
  - severity: medium
    issue: “倒卧在地”将ἐρριμμένοι具体化为实际倒在地上。
    rationale: ῥίπτω的被动形象确可有被扔下之意，但在本节对群众及随后牧羊比喻的描述中，未要求指称身体姿态。译为“被撇下”保留被动、弃置和无依的意象，也避免不必要的具体化。
  - severity: low
    issue: “受尽困扰”略增添了原文未明说的程度。
    rationale: ἐσκυλμένοι表达受扰、受折磨或困苦的状态；“受困扰”已足以传达其意义，而“受尽”容易暗示困扰已达到完全穷尽的程度。
  - severity: low
    issue: 原脚注以“倒卧”作为正文图像的说明基础，需随正文调整。
    rationale: 修订正文后，脚注应继续提供“困苦无助”这一解释性译法，并准确说明其与“受困扰、被撇下”相对应。
