  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: zh_hans
  text: 耶稣上了船，渡到对岸，来到自己的城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的家乡”。希腊文直译为“自己的城”；按本段叙事语境，很可能指迦百农。
    reason: 说明词义上的另一译法，并保留该城市身份在原文中的含蓄性。
lexical_decisions:
- source_word: ἐμβὰς
  choice: 上了
  rationale: 这是ἐμβαίνω的不定过去时分词，表示先于主要动词发生的动作。汉语用“上了船”自然地呈现这一先后关系，无须生硬译成从属结构。
- source_word: πλοῖον
  choice: 船
  rationale: 该词泛指水上交通工具；在加利利海的语境中译作“船”准确自然。希腊文无冠词，现代汉语无需强加“一条”。
- source_word: διεπέρασεν
  choice: 渡到对岸
  rationale: διαπεράω表示从一边越过水面到另一边；“渡到对岸”保留了横渡和方向意味。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι在此表示到达；“来到”符合叙事视角，也与后面的地点自然搭配。
- source_word: τὴν ἰδίαν πόλιν
  choice: 自己的城
  rationale: 直译其归属或关联之意，不在正文中把它解释为“家乡”或直接指明迦百农。
- source_word: Καὶ ... καὶ
  choice: 顺承语序，不逐一译出
  rationale: 重复的καί连接连续动作。现代汉语通过动词顺序和逗号即可自然表达这种叙事推进；逐字重复“又……又……”会显得累赘。
theological_decisions:
- issue: “自己的城”所指何处
  choice: 正文保持“自己的城”，不指明具体城市
  alternative: 按马太叙事语境明确译为“迦百农”，或解释为“他的家乡”
  rationale: 希腊文本没有写出城名；上下文很可能指迦百农，但翻译不应把语境推断写入正文，也不应将归属关系限定为出生地或家乡。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免汉语中省略主语可能造成歧义，明确补出“耶稣”；动作链保持简洁流畅。
