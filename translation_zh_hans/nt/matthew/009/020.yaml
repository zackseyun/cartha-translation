  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: zh_hans
  text: 看哪，有一个女人，流血不止已有十二年；她从他身后走近，摸了他衣服的边缘[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “边缘”也可译作“穗子”或“下摆”；希腊文可指衣服的边缘或边饰，也可能包括犹太服饰上的穗状边饰。
    reason: lexical_alternative
  - marker: b
    text: 关于以色列律法中衣服边缘的穗子，参民数记15:38；申命记22:12。
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留ἰδού引人注意、凸显叙事转折的作用；“看哪”庄重而仍为现代读者所理解。句首Καί在此承接叙事，其作用由汉语行文自然体现，不机械译作“并且”。
- source_word: γυνὴ
  choice: 一个……女人
  rationale: 按原文作首次出现的不定指称，不额外说明其身份。
- source_word: αἱμορροοῦσα
  choice: 流血不止
  rationale: 表达持续出血的病况，避免“出血”可能让人误解为短暂急症，也比传统术语“患血漏”更便于普通现代读者理解。
- source_word: δώδεκα ἔτη
  choice: 已有十二年
  rationale: 自然表达持续时间，并与现在分词所呈现的延续状态相配。
- source_word: προσελθοῦσα ὄπισθεν
  choice: 从他身后走近
  rationale: 保留她由后方接近他的空间关系，也体现分词动作先于“摸”。
- source_word: ἥψατο
  choice: 摸了
  rationale: 在本语境中准确表达接触，不强化为抓住或紧握。
- source_word: τοῦ κρασπέδου
  choice: 衣边
  rationale: κράσπεδον可指衣服的边缘、下摆或穗饰；正文采用较宽泛的“衣边”，避免过早限定为某一种具体形制。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: 他外衣的
  rationale: ἱμάτιον通常指外层衣服；“外衣”比笼统的“衣服”稍具体，又不限定为袍子或斗篷。
theological_decisions:
- issue: κράσπεδον是否特指以色列律法所规定的衣服穗子
  choice: 正文译作较宽泛的“衣边”
  alternative: 译作“穗子”以突出民数记15:38和申命记22:12的文化背景，或译作“下摆”以强调衣服边缘
  rationale: 该词可能包含犹太服饰穗子的含义，但本节没有明说其象征意义。正文保留词义范围，脚注说明可能的具体所指及律法背景，不将可能性写成定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“流血不止”清楚传达长期病况；“衣边”保留原词在衣缘、下摆和穗饰之间的语义开放性。脚注标记[a][b]均置于正文相关词语之后。
