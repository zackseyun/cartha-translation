  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: zh_hans
  text: 人群被赶到外面以后，耶稣进去，握住她的手；女孩就起来了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“女孩被兴起了。”希腊语动词为被动形式，也可作此理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ……后，……就……
  rationale: ὅτε引出时间从句，δέ作轻微的叙事连接。汉语用“……后，……就……”自然表达动作的时间关系和推进，不必生硬译出转折词。
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: 众人被赶出去
  rationale: 保留ἐξεβλήθη的被动语态；“赶出去”符合此处将围观、哀哭的人清出屋外的语境，又不带汉语中与赶鬼相关的特殊措辞。ὄχλος在上下文中自然译作“众人”。
- source_word: εἰσελθὼν
  choice: 耶稣就进去
  rationale: 将希腊语不定过去时分词按叙事顺序译为汉语谓语。“耶稣”由上下文补明主语，使现代汉语表达清楚自然。
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: 拉住女孩的手
  rationale: κρατέω加属格表示抓住或握住；“拉住……的手”简明自然，并保留实际接触的动作。
- source_word: ἠγέρθη
  choice: 起来了
  rationale: ἐγείρω的不定过去时被动形式在此可按不及物意义理解为“起来”，也可理解为“被使起来”。正文采用自然且不过度指明施动者的“起来了”，另以脚注保留被动译法。
- source_word: τὸ κοράσιον
  choice: 女孩
  rationale: κοράσιον指年幼的女孩；“女孩”是现代汉语中准确、自然的称呼。
theological_decisions:
- issue: 复生语境中ἠγέρθη的语态与施动者
  choice: 女孩便起来了
  alternative: 女孩便被使起来了
  rationale: 希腊语形式为被动，但ἐγείρω的被动形式可具有不及物表达效果。正文采用自然汉语“起来了”，不额外指明施动者；脚注保留形式上更明确的被动理解，以保存原文的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众人”比“人群”更适合室内外这一具体叙事场景；以“耶稣”补足分词结构中承接上文的隐含主语，避免中文代词指向含混。脚注标记按要求置于正文相应句末。
