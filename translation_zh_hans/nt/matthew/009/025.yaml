  rationale: 修订“拉住”为“握住”，以准确表达κρατέω在此处的接触动作；将“赶出去”明确为“赶到外面”，并改写脚注，使其既保留ἠγέρθη被动形式可能带来的译法差异，也符合现代汉语的可读性。正文仍采用“起来了”，不擅自补出施动者。
