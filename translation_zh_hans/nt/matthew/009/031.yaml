  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: zh_hans
  text: 他们出去后，却把有关他的消息传遍了那一带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那全地”。希腊语γῆ可指“地”、“地区”或“地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文耶稣严禁他们张扬此事的命令，并表达温和而清楚的转折。
- source_word: ἐξελθόντες
  choice: 出去后
  rationale: 不定过去时分词表示先于主要动词发生的动作；“出去后”自然地保留了时间先后。
- source_word: διεφήμισαν
  choice: 传遍
  rationale: 该动词指广泛传播消息、使人闻名；“传遍”简洁地体现广为传播的意味，并与后面的范围短语自然搭配。
- source_word: αὐτὸν
  choice: 他的事
  rationale: 希腊文以“他”为直接宾语，意为宣传他、传扬有关他的消息。汉语用“把他的事传遍”既自然，也避免误解为把他本人带到各处。
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: 那一带
  rationale: γῆ在此可指土地、地方或地区；上下文是当地范围，“那一带”符合现代汉语叙事表达，同时保留地域范围而不夸大为全国。
theological_decisions:
- issue: γῆ所指的地理范围
  choice: 那一带
  alternative: 那全地
  rationale: 上下文描述消息在当地传开，不要求理解为全国性或普世性的范围。“那一带”较自然地表达局部地域，同时脚注保留“地”的可能译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“却”凸显他们的行为与耶稣上文命令之间的转折；脚注标记置于正文句末，说明地域词的词义弹性。
