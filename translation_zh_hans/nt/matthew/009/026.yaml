  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: zh_hans
  text: 这消息传遍了那一带[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那整个地区”或“那片土地”。希腊语 γῆ 可指土地、地域或地区；此处较可能是指周围一带，而不是整个地球。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接前述神迹及其结果；在现代汉语叙事中，“于是”自然表达事件随之发生，并未增加因果细节。
- source_word: ἐξῆλθεν
  choice: 传遍了
  rationale: 原义为“出去”，主语是消息时表示消息传播出去；与范围短语结合译为“传遍了”，比直译“出去了”自然，同时保留传播的动态。
- source_word: ἡ φήμη αὕτη
  choice: 这消息
  rationale: φήμη在此指有关所发生之事而流传的消息；“消息”不含“谣言”可能带有的虚假意味。αὕτη直译为“这”。
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: 那一带
  rationale: γῆ可指地、土地或地区；叙事语境所指是周围地区。“那一带”是自然现代汉语，而“传遍”已体现ὅλην所表达的全部范围。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“传遍了那一带”避免生硬照译“进入那整个地”，并准确表达消息扩散至当地全境。
