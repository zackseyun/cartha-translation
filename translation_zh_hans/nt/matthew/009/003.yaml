  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: zh_hans
  text: 看哪，有些经学家心里说[a]：“这个人在说亵渎的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此私下说”。希腊语这一表达既可指内心思量，也可指私下交谈。
    reason: 保留 εἶπαν ἐν ἑαυτοῖς 在内心言说与私下言说之间的词义可能性。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处是承接叙事的常用连接词。现代汉语若在句首硬译为“并且”会显得生硬；通过语序自然承接上下文即可体现其功能。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留原文提示读者注意、增强叙事现场感的语篇功能；“看哪”庄重而且在经文语体中清楚可懂。
- source_word: τινες τῶν γραμματέων
  choice: 有几个经学家
  rationale: τινες表示人数不明的一部分人；γραμματεῖς在此指熟悉并讲授犹太律法的专家。“经学家”比音义较旧的“文士”更便于现代读者理解，又不把其角色过度限定为一般教师。
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: 心里说
  rationale: 贴近“在自己里面说”的表达，也符合下文耶稣知道他们心思的语境；同时以脚注保留其也可能指彼此私下言说的歧义。
- source_word: Οὗτος
  choice: 这个人
  rationale: 自然表达指示代词的指称作用，并可传达说话者带有距离感的语气，而不额外加入“这家伙”等更强烈的贬义。
- source_word: βλασφημεῖ
  choice: 在说亵渎的话
  rationale: 自然表达现在时的指控，保留其宗教语境中冒犯、侮辱上帝的含义；不提前解释他们为何这样判断。
theological_decisions:
- issue: 经学家对耶稣的指控
  choice: 这个人在说亵渎的话
  alternative: 这个人亵渎上帝
  rationale: 原文动词本身提出“亵渎”的指控，却没有在本节明说其对象。译文不补出“上帝”，以保留叙事中的神学张力，避免把隐含内容写成明说内容。
- issue: 经学家的话是内心思想还是私下交谈
  choice: 正文采用“心里说”，脚注注明另一可能
  alternative: 彼此私下说
  rationale: ἐν ἑαυτοῖς可指内在思量，也可能指群体中的私下言说；邻近语境较支持内心言说，但不应消除原表达的可能歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文语体的注意提示功能；“经学家”帮助普通读者识别该群体的律法专业身份；全句避免古奥措辞，也不扩展原文未明说的神学解释。
