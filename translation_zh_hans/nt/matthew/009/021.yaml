  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: zh_hans
  text: 因为她心里一直说：“我只要摸到他的衣裳，就会得救[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就会痊愈”或“就会好起来”。希腊原文直译为“就会得救”，所用动词在本处语境中也可指病得医治。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 一直说
  rationale: 未完成时表示持续或反复的内心言语；“一直说”自然地保留这一体貌。
- source_word: γὰρ
  choice: 因为
  rationale: 说明她先前行动的缘由，在现代汉语中用“因为”清楚表达解释关系。
- source_word: ἐν ἑαυτῇ
  choice: 心里
  rationale: 这是表示内心自语的惯用表达；“心里说”符合现代汉语习惯。
- source_word: Ἐὰν μόνον
  choice: 只要
  rationale: 表达唯一且最低限度的条件，并自然传达“仅仅……就……”的强调。
- source_word: ἅψωμαι
  choice: 摸到
  rationale: 在ἐάν引导的条件句中表示预期可能实现的一次触碰；“摸到”兼顾动作及达成之意。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: 他的衣裳
  rationale: ἱμάτιον可指衣服，尤其外衣；“衣裳”自然且不把具体款式限定得过窄。
- source_word: σωθήσομαι
  choice: 就会得救
  rationale: σῴζω在此语境可指病得医治，也保有“拯救、得救”的较广词义；正文保留其词汇张力，脚注说明语境义。
theological_decisions:
- issue: 医治语境中σωθήσομαι的译法
  choice: 就会得救
  alternative: 就会痊愈／就会好起来
  rationale: 上下文直接涉及身体疾病的医治，但原文使用意义较广的σῴζω，而不是仅限医疗的动词。正文译作“得救”保留其词义广度及潜在神学回响，同时以脚注交代本处明确的医治语境，不把两层意义强行合并或排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里一直说”保留未完成时的持续或反复意味；“衣裳”较自然，又避免过度限定为某一种外衣。
