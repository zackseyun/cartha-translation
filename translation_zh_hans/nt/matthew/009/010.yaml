  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: zh_hans
  text: 耶稣在屋里[b]斜倚着用饭时[a]，看哪，有许多税吏和罪人前来，与耶稣和他的门徒一同斜倚着用饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文具体描写当时用饭的姿势，即斜倚着用饭；较为意译可作“在屋里用饭时”。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“在屋里”，本节本身没有明确说明这是谁的屋子。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: 耶稣……斜倚席间用饭的时候
  rationale: καὶ ἐγένετο在这里主要引出叙事场景，中文用“……的时候”自然表达其时间和过渡作用；ἀνάκειμαι在用餐语境中指按当时习俗斜倚进餐，因此保留这一姿势意象。
- source_word: ἐν τῇ οἰκίᾳ
  choice: 在那屋里
  rationale: 定冠词所限定的οἰκία指语境中的那所房屋；译文不擅自说明房主是谁。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留吸引读者注意、增强叙事现场感的话语标记，而不将其淡化省略。
- source_word: τελῶναι
  choice: 税吏
  rationale: 这是福音书语境中τελώνης的准确、通行译法，也保留该群体在当时社会中的身份色彩。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 此处形容词作名词使用；“罪人”保留原文中的社会—宗教分类，不另加解释。
- source_word: ἐλθόντες
  choice: 来了
  rationale: 将希腊语不定过去时分词按中文叙事习惯译为连续动作中的谓语，简明自然。
- source_word: συνανέκειντο
  choice: 同……一起斜倚席间用饭
  rationale: 复合动词表示与他人共同斜倚进餐；译文同时保留共同用饭、席间交往和当时用餐姿势。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 他的门徒
  rationale: “门徒”准确表达μαθητής所含的师徒和跟随关系，也是现代中文圣经语境中的通行用语。
theological_decisions:
- issue: 用餐姿势与同席交往的意象
  choice: 两处均译出“斜倚席间用饭”
  alternative: 用饭；吃饭；坐席
  rationale: 原文ἀνάκειμαι及其复合词συνανάκειμαι明确描写斜倚用餐。保留这一意象可显明耶稣、门徒与税吏和罪人共同坐席的场景，却不额外加入神学判断。
- issue: “那屋”属于谁
  choice: 正文只译“那屋”，不注明房主
  alternative: 耶稣的家；马太的家
  rationale: 本节希腊文仅说ἐν τῇ οἰκίᾳ，并未在本句中明说是谁的房屋；译文保留这种未明确性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斜倚席间用饭”略带历史场景色彩，用以准确呈现古代用餐姿势；“看哪”保留原文突出的叙事提示语。人名采用中文通行形式“耶稣”。
