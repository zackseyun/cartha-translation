id: MAT.9.33
reference: Matthew 9:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: zh_hans
  text: 鬼被赶出去以后[a]，那哑巴就说出话来。众人都很惊奇，说：“在以色列从来没有见过这样的事！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哑巴”所对应的希腊词也可指“聋人”；这里下文强调他能说话，因此译作“哑巴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: 被赶出去以后
  rationale: 不定过去时被动分词构成属格独立结构，表示赶鬼先于那人开口；此译自然保留先后关系。
- source_word: δαιμονίου
  choice: 鬼
  rationale: δαιμόνιον 在福音书赶鬼语境中指邪灵；现代汉语圣经语体中“鬼”简洁、明确。
- source_word: ἐλάλησεν
  choice: 说出话来
  rationale: 既表达“说话”，又与先前不能说话的状态形成自然对照；没有额外加入持续说话等含义。
- source_word: ὁ κωφός
  choice: 那哑巴
  rationale: κωφός 可指聋或哑；本句以“说出话来”为直接结果，语境重点是不能说话。“那”承接上一节已提及的人。
- source_word: ἐθαύμασαν
  choice: 都很惊奇
  rationale: 准确表达众人的惊异，也符合现代标准汉语叙事表达。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 原文为复数，指在场群众；汉语通常以集合性称谓“众人”自然表达，无须机械体现复数。
- source_word: Οὐδέποτε
  choice: 从来没有
  rationale: 直接表达“从未”的时间否定，并适合群众的感叹语气。
- source_word: ἐφάνη οὕτως
  choice: 没有见过这样的事
  rationale: ἐφάνη 是 φαίνω 的被动形式，可按语境理解为“被看见”；汉语用经验句式“没有见过这样的事”自然表达这种事情在以色列前所未见，同时不把焦点限定为某个单一细节。
- source_word: ἐν τῷ Ἰσραήλ
  choice: 在以色列
  rationale: 简洁保留原文范围，既可指以色列民中，也可指以色列的社会地域范围。
theological_decisions:
- issue: κωφός 在医治与赶鬼语境中的语义范围
  choice: 译作“哑巴”
  alternative: 聋人
  rationale: 该词本身可指耳聋或不能说话，但紧接着的结果是“说出话来”，因此本节突出的是失语；脚注保留另一可能，避免掩盖原词的语义范围。
- issue: ἐφάνη 的表达方式
  choice: 译作“见过”
  alternative: 出现过
  rationale: 被动形式可作“被看见”理解；“见过这样的事”是自然汉语，并保留群众宣称此类事件在以色列前所未见的意思，不进一步界定他们具体比较的是赶鬼、医治还是整件事。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“说出话来”与“哑巴”形成符合汉语习惯的照应；末句使用感叹号传达群众引语的惊叹语气。
