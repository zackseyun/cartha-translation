id: MAT.9.4
reference: Matthew 9:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: zh_hans
  text: 耶稣知道他们的心思[a]，就说：“你们为什么心里怀着恶念呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “知道他们的心思”也可译作“察觉到他们的心思”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 该分词表示耶稣知悉他们内在的思量；“知道”简洁自然，同时不把经文扩展成额外的教义说明。
- source_word: ἐνθυμήσεις
  choice: 心思
  rationale: 该名词指内在的思想、思量或盘算；“心思”符合现代汉语，也与下文“心里”相呼应。
- source_word: Ἱνατί
  choice: 为什么
  rationale: 直接表达对原因或动机的询问，是现代汉语中自然清楚的对应。
- source_word: ἐνθυμεῖσθε
  choice: 怀着
  rationale: 该现在时中间语态动词描述内心正在进行的思量；结合宾语“恶念”，译作“怀着”自然地表达持续存在于内心的思想。
- source_word: πονηρὰ
  choice: 恶念
  rationale: 中性复数形容词在此作名词使用，指邪恶的思想或意念；“恶念”既简洁，又适合本句关于内心思量的语境。
- source_word: καρδίαις
  choice: 心里
  rationale: 保留καρδία所表达的内在人格、思想与意向之所在，避免将其缩减为单纯的理智活动。
theological_decisions:
- issue: 耶稣知悉他人未说出口的内在思想
  choice: 耶稣知道他们的心思
  alternative: 耶稣察觉到他们的心思
  rationale: 译文如实保留耶稣知悉其内在思量这一陈述，但不进一步说明这种知识的方式或将其扩展为经文本身未明说的教义命题。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“心思—心里—恶念”保留原文关于内在思量的语义联系；问句末用“呢”使直接质问在汉语中自然，但不削弱其力度。
