base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: zh_hans
  text: 耶稣从那里往前走的时候，有两个盲人跟着他，高声呼喊说：“大卫之子[a]啊，怜悯我们吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫之子”是具有王室和弥赛亚含义的称号，表明耶稣是所应许的大卫王室后裔。
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: 从那里继续往前走的时候
  rationale: 现在分词与“从那里”共同表示与主句同时发生的动作；此译法自然地呈现耶稣离开该处、继续前行的叙事进程。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟着他
  rationale: 这里的 ἀκολουθέω 首先指实际跟随；“跟着他”符合现代汉语叙事表达，也不额外赋予门徒身份的含义。
- source_word: δύο τυφλοὶ
  choice: 两个盲人
  rationale: 阳性复数形容词在此名词化，指两名失明者；“两个盲人”简洁、清楚，并符合上下文。
- source_word: κράζοντες καὶ λέγοντες
  choice: 高声喊道
  rationale: κράζω 表达响亮而急切的呼喊；汉语用“高声喊道”自然涵盖其后 λέγοντες 的引语功能，避免生硬重复“喊着说”。
- source_word: Ἐλέησον ἡμᾶς
  choice: 可怜我们吧
  rationale: 此处是不定过去时命令式的直接恳求，求耶稣施以怜悯和帮助；“可怜我们吧”在现代汉语中自然地表达这种急切请求。
- source_word: υἱὲ Δαυίδ
  choice: 大卫之子啊
  rationale: 保留传统的王室—弥赛亚称号，而不弱化为单纯的“大卫后裔”；呼格语气以“啊”表达。
theological_decisions:
- issue: “大卫之子”的弥赛亚意义
  choice: 正文保留称号“大卫之子”
  alternative: 译作“大卫的后裔”或解释性地译作“弥赛亚、大卫之子”
  rationale: 希腊文使用既有称号而未在正文中加以解释。“大卫之子”既保留其字面形式，也保留其王室和弥赛亚意涵；脚注提供必要背景而不把解释加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“继续往前走”体现动作进程；“高声喊道”传达呼喊的响亮与急切。称号使用“大卫之子”，以保留经文的传统形式及神学张力。
