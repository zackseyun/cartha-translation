source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: zh_hans
  text: 看哪，他们正把一个躺在床上的瘫痪的人抬到他面前。耶稣看见他们的信心[a]，就对那瘫痪的人说：“孩子，放心吧！你的罪得到赦免了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”是复数，可能指抬他来的人，也可能包括这个瘫痪的人；原文没有明确说明。
    reason: preserve_ambiguity
  - marker: b
    text: 也可译作“你的罪蒙赦免了”。原文是被动表达，没有明说施行赦免的是谁。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、使场景鲜明呈现的话语标记，同时符合庄重的现代汉语叙事。
- source_word: προσέφερον
  choice: 抬到……面前
  rationale: προσφέρω的核心意思是带到、送到；结合病人躺在床上的情境，用“抬到”自然明确，但不额外说明抬床者的身份或人数。未刻意用进行体，因为此处未完成过去时在连续叙事中可自然译为完整事件。
- source_word: παραλυτικὸν
  choice: 一个瘫痪的人
  rationale: 形容词在原文中作名词使用；译为“瘫痪的人”比带有标签色彩的名词表达更自然，也不擅自限定其性别。
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: 那人躺在床上
  rationale: 表达病人的姿势和处境。κλίνη可指床或卧榻；“床”简明稳妥，不无根据地具体化为褥子或担架。
- source_word: πίστιν
  choice: 信心
  rationale: 在本语境中指由行动表现出来的信靠；“信心”是自然且不作过度解释的对应词。
- source_word: Θάρσει
  choice: 放心吧
  rationale: 该命令式用于安慰和鼓励。“放心吧”在现代汉语中自然传达安慰语气；“鼓起勇气”也可能，但更突出个人奋起的动作。
- source_word: τέκνον
  choice: 孩子
  rationale: 保留τέκνον作为亲切称呼的语气，不增添原词本身没有明说的性别，也不额外加入“亲爱的”。
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: 你的罪得到赦免了
  rationale: 以汉语自然的被动意义表达耶稣当下的赦罪宣告，同时像希腊文一样不明说施事者。句末“了”呈现宣告所确立的状态，而不强行判定为过去完成。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 汉语“罪”通常可作集合性表达，能自然涵盖希腊文复数所指的诸般过犯。
theological_decisions:
- issue: τὴν πίστιν αὐτῶν中复数代词的所指
  choice: 正文保留“他们的信心”，不限定具体包括哪些人
  alternative: 仅指抬病人的人，或同时包括瘫痪者
  rationale: αὐτῶν是复数，至少涉及一群与瘫痪者相关的人，但原文没有明确说明瘫痪者是否包括在内；脚注保留这一歧义。
- issue: 赦罪宣告的施事者与时态力量
  choice: 译作“你的罪得到赦免了”，不明说谁施行赦免
  alternative: “你的罪已经蒙上帝赦免”或“我赦免你的罪”
  rationale: 希腊文使用现在时被动形式，施事者未明说。正文保留被动表达，既呈现即时宣告，也不把隐含的神学解释直接加入译文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留马太叙事中引人注意的语气；其余措辞避免过度古雅。“瘫痪的人”采用以人为先的自然表达，“孩子”保留耶稣亲切安慰的称呼。
