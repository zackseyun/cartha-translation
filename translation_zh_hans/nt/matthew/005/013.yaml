id: MAT.5.13
reference: Matthew 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: zh_hans
  text: “你们是世上的盐。但盐若失了味，还能用什么使它再有咸味呢？它就再也没有用处，只能丢在外面，任人践踏。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 明示的复数代词带有强调；现代汉语句首“你们”已能自然体现焦点，无须加译“你们自己”。
- source_word: τὸ ἅλας τῆς γῆς
  choice: 世上的盐
  rationale: γῆ可指大地、土地或世界；此处是范围广泛的比喻。“世上的盐”自然、庄重，也保留“盐”这一核心意象。
- source_word: μωρανθῇ
  choice: 失了味
  rationale: 该动词本义与“愚拙”相关，但用于盐时表示变得淡而无味。“失了味”符合现代汉语表达，并保留盐变质的隐喻。
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: 怎能使它再咸呢？
  rationale: 希腊文是将来时被动态，直问盐凭什么被变咸。汉语如此表达自然，并保留恢复咸味所需手段成疑的意味。
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: 它就再也没有用处
  rationale: ἰσχύω在这里指有效、适用或有用；译文准确表达其彻底失去功用。
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: 只能丢在外面
  rationale: 保留ἔξω明确的空间意义，同时用“只能”自然表达εἰ μή所限定的唯一结果。
- source_word: καταπατεῖσθαι
  choice: 践踏
  rationale: 准确传达踩踏、踏在脚下的鲜明图景，且语体简洁庄重。
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: 任人
  rationale: ἄνθρωποι泛指人类而非特指男性；现代汉语“人”本身不带性别限制，“任人践踏”也自然表达被动关系。
theological_decisions:
- issue: “世上的盐”这一身份隐喻的陈述力度
  choice: 保留直接的身份陈述“你们是世上的盐”
  alternative: 你们好像世上的盐
  rationale: 原文用ἐστε直接断言身份，没有明示“好像”；不把隐喻弱化为明喻，以保留其修辞和神学张力。
- issue: μωρανθῇ中“失味”与“愚拙”的词义关联
  choice: 正文译作“失了味”
  alternative: 变得愚拙
  rationale: 盐的语境要求“失味”义；不把词源关联强行译入正文，也不据此加入额外的道德解释。
- issue: ὑπὸ τῶν ἀνθρώπων的泛指范围
  choice: 任人践踏
  alternative: 被男人践踏
  rationale: 原文在此泛指人，不限定男性；汉语“人”准确保留其普遍范围，无须另加性别说明。
translation_notes:
  register: 采用现代、简明而庄重的普通话。保留盐、失味、再咸、丢在外面和践踏等连续意象；不在正文中解释盐的象征意义，以免消解原文开放而严肃的劝诫张力。
