  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: zh_hans
  text: 人也不会点了灯又把它放在量斗[a]下面，而是放在灯台上，灯就照亮屋里所有的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“量篮”。希腊词μόδιος指一种干量，也可指用来量取这种干量的容器；传统译作“斗”。
    reason: lexical_alternative
  - marker: b
    text: 或译“灯就为屋里所有的人发光”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: 人也不会
  rationale: 承接上一节的比喻，保留“也不”的连接和否定作用；中文用泛指的“人”表达希腊文未明说主语的通则性复数。
- source_word: καίουσιν λύχνον
  choice: 点一盏灯
  rationale: καίω与λύχνος搭配时指点燃灯；“点一盏灯”是自然、具体的现代汉语表达。
- source_word: ὑπὸ τὸν μόδιον
  choice: 放在量器下面
  rationale: μόδιος首先指一种干量单位，也可指相应的量具或容器。“量器”保留该物件的计量功能，避免把材质武断确定为篮子。
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: 而是放在灯台上
  rationale: λυχνία指放置灯的台架；“灯台”准确、简洁，也符合经文的具体意象。
- source_word: λάμπει
  choice: 它就照亮
  rationale: λάμπω本义为“发光、照耀”；结合与格πᾶσιν，译作“照亮……的人”自然表达灯光惠及众人的结果。
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: 屋里所有的人
  rationale: 保留πᾶσιν的全称范围，并按空间语境将οἰκία译为“屋里”，而非关系性的“家人”。
theological_decisions:
- issue: 希腊文泛指第三人称复数没有明说主语
  choice: 人也不会点一盏灯
  alternative: 也没有人点一盏灯
  rationale: 用泛指“人”保留谚语式的普遍陈述，不引入具体的“他们”；“不会”在此表达通常做法，而非能力不足。
- issue: λάμπει与受益者之间的表达
  choice: 它就照亮屋里所有的人
  alternative: 它就为屋里所有的人发光
  rationale: 前者以自然汉语表达灯光的作用；后者更贴近“发光”的形式。两者神学含义无实质差异。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留灯、量器、灯台和屋内众人的具体生活图景；不把比喻的寓意直接写进正文。
