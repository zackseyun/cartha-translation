base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: zh_hans
  text: 又有话说：“无论谁休妻，都要给她休书。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “休妻”也可译作“把妻子遣走”；“休书”即离婚文书。希腊语动词本可指“遣走”，但在这里的婚姻法律语境中指离婚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: 又有话说
  rationale: 这一无主语被动引语公式承接前文并引出下一条传统教导；“又有话说”在现代汉语中自然、庄重，也不预先表明耶稣对所引内容的态度。δέ在此可表示话题推进，不必强译为强烈转折。
- source_word: Ὃς ἂν
  choice: 无论谁
  rationale: 关系代词与ἄν构成泛指条件，“无论谁”准确表达适用于任何人的一般情形。
- source_word: ἀπολύσῃ
  choice: 休妻
  rationale: ἀπολύω本可指“打发走、遣走”，但与婚姻对象及ἀποστάσιον连用时指解除婚姻；“休妻”简洁保留古代法律语境和原文的男性主体，同时现代读者也能理解。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻
  rationale: γυνή在离婚语境中明确指妻子；汉语“休妻”已自然包含“他的妻子”这一关系，无须机械重复所有格。
- source_word: δότω αὐτῇ
  choice: 都要给她
  rationale: 第三人称命令式表达法律性要求；现代汉语用“要”比“让他给”更自然，“她”明确保留间接宾语。
- source_word: ἀποστάσιον
  choice: 休书
  rationale: 该词指证明婚姻解除的书面文书。“休书”是简明而为现代读者普遍可识别的法律文化用语；脚注补充“离婚文书”这一现代说法。
theological_decisions:
- issue: 本句与摩西离婚规定的关系
  choice: 按引述法律性说法来译，不在本节中加入赞同或反对的解释
  alternative: 把它解释性地译成认可离婚程序的命令，或仅描述当时流行观点
  rationale: 本节只是引出耶稣下一节将回应的说法；译文应保留引语形式及其张力，不提前解决离婚伦理上的神学问题。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“休妻、休书”保留经文的古代法律语感，并以脚注说明其含义；正文避免过度口语化，也不把后文的评价提前带入本节。
