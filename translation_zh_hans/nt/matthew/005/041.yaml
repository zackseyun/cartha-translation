base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: zh_hans
  text: 无论谁强迫你走一罗马里[a]，你就同他走两罗马里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强迫”所译的动词可指受官方权力强征服役；“一罗马里”约合1.48公里。
    reason: lexical_and_historical_clarification
  - marker: b
    text: 原文直译为“同他走两”；第二处的距离单位由上文补足。
    reason: source_ellipsis
lexical_decisions:
- source_word: ὅστις
  choice: 无论谁
  rationale: 这是不定关系代词，引出适用于任何人的一般情形；“无论谁”自然地保留了其广泛、概括的语气。
- source_word: ἀγγαρεύσει
  choice: 强迫你走
  rationale: 此动词指强征或迫使人服役，常涉及官方权力；结合距离表达，译作“强迫你走”既传达强制性，也不在正文中擅自加入士兵、搬运等原文未明说的细节。
- source_word: μίλιον ἕν
  choice: 一里路
  rationale: 指一罗马里。正文采用现代读者熟悉且简洁的“一里路”，脚注说明其历史单位，避免误解为现代中国市里。
- source_word: ὕπαγε
  choice: 要……走
  rationale: 命令式在这里表示继续前行；以“要……走”自然呈现劝令语气。
- source_word: μετ’ αὐτοῦ
  choice: 同他
  rationale: μετά加属格表示陪同，“同他”直接而庄重。
- source_word: δύο
  choice: 两里
  rationale: 希腊文只写“两”，承接前面的距离单位；中文补出“里”，使句意自然清楚，同时在脚注交代原文的省略结构。
theological_decisions:
- issue: 强制服役的历史社会背景
  choice: 正文表达为受到强迫而同行，不明确指定强迫者的身份
  alternative: 明确译为罗马士兵强征服役
  rationale: 用词和罗马距离单位很可能使当时读者想到官方强征，但原文没有明说罗马士兵。译文保留强制场景，却不把可能的历史背景提升为正文明确陈述。
- issue: 第二个距离是否只指额外再走一里
  choice: 译为总共走两里
  alternative: 译为再多走两里
  rationale: δύο与前面的“一里”形成数量对照，通常表示同行至两里的总距离；原文并非“一里之外再加两里”。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“无论谁……都……”适合一般性教导；“同他走”比口语化的“陪他走”更贴近原文的同行关系。
