id: MAT.5.17
reference: Matthew 5:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: zh_hans
  text: “不要以为我来是要废除律法或先知[a]；我来不是要废除，而是要成全[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法或先知”是指以色列的圣经，也就是律法书和先知书；这里的“或”并不是说耶稣只谈其中一类。
    reason: referential_clarification
  - marker: b
    text: “成全”也可理解为“使之完成”或“使之充分彰显”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: 不要以为
  rationale: μή加不定过去时虚拟语气构成禁止语；“不要以为”自然直接，也准确保留原文的劝诫力度。
- source_word: ἦλθον
  choice: 我来
  rationale: 中文在说明使命或来意时通常用“我来”，无需硬性标出希腊语不定过去时；此译法也能自然覆盖“我来了／我已经来”的语境意味。
- source_word: καταλῦσαι
  choice: 要废除
  rationale: 此处宾语是“律法或先知”，所指并非物质上的毁坏，而是废止、取消其效力；“废除”清楚而符合现代汉语。
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: 律法或先知
  rationale: 这是对以色列圣经的惯用概括。“律法”和“先知”在中文圣经语境中已能表达其经卷类别意义，不必借助英文式大写。
- source_word: ἀλλὰ πληρῶσαι
  choice: 而是要成全
  rationale: “成全”保留πληρόω使之达到丰满、实现或完成其旨意的宽广语义，并避免把本节限定为某一种神学解释。
theological_decisions:
- issue: 耶稣以πληρῶσαι说明自己与“律法或先知”的关系
  choice: 成全
  alternative: 使之完成／充分彰显／应验
  rationale: 原词在此可涉及实现、使达到圆满或充分表达等层面。“成全”保留其神学张力，不在正文中预先裁定具体机制。
- issue: “律法或先知”所指对象
  choice: 按指代以色列圣经的整体性表达处理
  alternative: 仅指摩西律法及历代先知个人
  rationale: 这一并列表达在马太福音语境中通常具有经书或圣经整体的意味，但正文仍直译为“律法或先知”，不扩写为“圣经”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要以为……不是……而是……”保留原文鲜明的对照结构；不添加“它们”，因为中文省略宾语更自然，所指仍清楚。
