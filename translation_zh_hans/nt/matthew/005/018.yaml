id: MAT.5.18
reference: Matthew 5:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: zh_hans
  text: 因为我实在告诉你们：直到天地消逝，律法中的一点[a]一画[b]也绝不会消逝，直到一切都成就。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“一个约塔字母”；约塔是希腊字母中最小的字母，也可能令人联想到希伯来文中最小的字母。
    reason: lexical_alternative
  - marker: b
    text: 或译“一小划”，指用来区别字母的极小笔画。
    reason: lexical_alternative
  - marker: c
    text: 或译“直到一切都发生”或“直到一切都实现”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在耶稣郑重宣告的句首，ἀμήν用于确证随后所说的话；“实在”自然、庄重，也保留其强调语气。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为前一句提供解释或根据；“因为”清楚保留这一逻辑联系。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 符合现代汉语表达，同时保留耶稣直接而有权威的语气。
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 直到天地消逝
  rationale: παρέρχομαι在此表示过去、消逝或终结；“天地消逝”简洁自然，并保留原文的宇宙性范围。
- source_word: ἰῶτα ἓν
  choice: 一点
  rationale: ἰῶτα指极小的字母；汉语惯用“一点一画”表达文字中最细微的部分，正文因此自然易懂，脚注说明其具体所指。
- source_word: μία κεραία
  choice: 一画
  rationale: κεραία指字母上极小的笔画或凸出小划；“一画”与“一点”配合，既保留书写意象，又符合现代汉语。
- source_word: οὐ μὴ παρέλθῃ
  choice: 也绝不会消逝
  rationale: οὐ μή加虚拟语气构成强烈否定；“绝不会”准确体现这种强调。
- source_word: ἀπὸ τοῦ νόμου
  choice: 律法中的
  rationale: 原文直译为“从律法中”；中文用“律法中的”能自然表达其中最微小的文字成分也不会消逝。
- source_word: ἕως ἂν πάντα γένηται
  choice: 直到一切都成就
  rationale: γίνομαι可表示发生、成为或实现；“成就”适合本段庄重语境，但脚注保留“发生／实现”的可能，以免把含义限于单一解释。
theological_decisions:
- issue: νόμος在此处的范围
  choice: 译作“律法”，指向上文所说具有经文权威的律法
  alternative: 特指摩西五经；或由此延伸指整部旧约圣经
  rationale: 马太福音5:17的近邻语境是“律法和先知”。正文仅译作“律法”，不擅自限定其范围，让上下文承担进一步说明的作用。
- issue: πάντα γένηται的含义
  choice: 直到一切都成就
  alternative: 直到一切都发生；直到一切都实现
  rationale: 原句既可着重一切事情发生，也可表达所指的一切得到实现或完成。正文采用庄重而自然的“成就”，脚注明列其他可能，以保留原文的神学张力。
- issue: 律法细微文字的持续性
  choice: 保留“绝不会消逝”的绝对强调
  alternative: 弱化为“不会轻易废去”
  rationale: οὐ μή是强烈否定，翻译不应把耶稣的断言弱化，也不在本节内额外解释其与“成就”的关系。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“一点一画”是自然汉语成语式搭配，但分别加注，以呈现ἰῶτα与κεραία各自的书写意象。句首保留“因为”，使本节与上文的解释关系清晰；“绝不会”传达原文强烈否定。
