  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: zh_hans
  text: 耶稣看见众人，就上了山；他坐下后[a]，他的门徒来到他跟前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他坐下的时候”。原文采用属格独立结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: 看见
  rationale: 不定过去时分词在此交代主句动作的背景情形；结合汉语叙事习惯，以“看见……就……”自然表达关联，同时不必硬译为独立从句。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的衔接或转折语气；汉语上下文无需另加“但”或“于是”，否则会赋予过重的语篇意义。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 原文为复数，指聚集的人群；“众人”在现代汉语中自然庄重，能表达群体意义而不显生硬。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 上了山
  rationale: 表达向山上移动；“上了山”简洁自然，并保留动作完成的叙事推进。
- source_word: τὸ ὄρος
  choice: 山
  rationale: ὄρος可指山或山区；此处译作“山”最直接。汉语通常不以冠词区分特指与泛指，因而不额外添加解释。
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: 他坐下后
  rationale: 属格独立结构表示与随后动作有关的时间背景；“坐下后”自然呈现先后关系。由于也可较宽泛地理解为“他坐下的时候”，以脚注保留该可能。
- source_word: προσῆλθαν αὐτῷ
  choice: 来到他跟前
  rationale: προσέρχομαι表示走近或来到某人那里；“来到他跟前”符合现场叙事，也比单纯“来找他”更贴近空间含义。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: μαθηταί在本福音语境中指跟随老师学习的人；“门徒”是准确、通行且庄重的对应词。原文所有关系由汉语语境即可明确，无需重复“他的”。
theological_decisions:
- issue: τὸ ὄρος中定冠词的表达
  choice: 山
  alternative: 那座山
  rationale: 希腊文使用定冠词，但汉语不必逐一显化冠词。“那座山”可能使读者误以为经文指向一座此前已明确提到的特定山，故正文采用自然的“山”，不据此认定具体地点。
- issue: καθίσαντος αὐτοῦ的时间关系
  choice: 他坐下后
  alternative: 他坐下的时候
  rationale: 该属格独立结构为门徒前来的动作提供时间背景，通常可表达先行动作，但不应由此引申出经文未明说的仪式性或教职含义。脚注保留较宽泛的同时性表达。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“耶稣”作为主语承接上文语境，使本节单独阅读时指代清楚；原文此处仅用第三人称代词。避免文言式“登山”“就座”及过度技术化措辞。
