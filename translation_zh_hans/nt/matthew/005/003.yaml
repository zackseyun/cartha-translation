  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: zh_hans
  text: 灵里贫穷的人[b]有福了[a]，因为天国[c]是他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福了”也可译作“快乐”或“真有福”。希腊语表示一种蒙上帝恩眷、令人羡慕的福分，不只是快乐的感受。
    reason: lexical_alternative
  - marker: b
    text: “灵里贫穷”也可理解为“在灵性上贫穷”或“认识到自己有属灵需要”。正文保留希腊语表达的开放性，不限定为某一种解释。
    reason: alternative_reading
  - marker: c
    text: 希腊语直译为“诸天的国”，是马太福音颇具特色的表达；这里按汉语惯例译作“天国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 有福了
  rationale: 这是祝福宣告中的惯用表达，表示蒙上帝恩眷、处于可羡慕的福分中，不仅指主观上感到快乐。
- source_word: οἱ πτωχοὶ
  choice: 贫穷的人
  rationale: πτωχός表示贫穷、匮乏；加冠词后具有名词性。“贫穷的人”自然地保留了这一含义，而“乞丐”则过于具体。
- source_word: τῷ πνεύματι
  choice: 心灵
  rationale: 与“贫穷”组合为“心灵贫穷”，既符合现代汉语，也保留希腊语短语的凝练和一定的解释空间；不明确指定为圣灵，也不在正文中扩写为对自身属灵需要的认识。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出蒙福的理由；“因为”是清楚、自然的现代汉语表达。
- source_word: αὐτῶν ἐστιν
  choice: 是他们的
  rationale: 保留ἐστιν的现在时，并传达前置代词αὐτῶν所强调的归属关系，不改写为将来的奖赏。
- source_word: ἡ βασιλεία
  choice: 国
  rationale: βασιλεία既可涉及王权统治，也可涉及其国度；在马太福音的固定表达中，“国”最自然，并与传统而易懂的“天国”相合。
- source_word: τῶν οὐρανῶν
  choice: 天
  rationale: 希腊语字面为复数“诸天的”，但“天国”是现代汉语中自然且通行的对应表达，也保留了马太特有的措辞。
theological_decisions:
- issue: “心灵贫穷”的含义
  choice: 正文保留“心灵贫穷”这一凝练表达，不作解释性扩写。
  alternative: 译作“在灵性上贫穷”“谦卑的人”或“知道自己有属灵需要的人”。
  rationale: 原文的表达具有丰富含义和一定开放性；若在正文中改为“谦卑”或“意识到需要”，就会把原文未明说的解释固定下来。
- issue: 天国归属的时态
  choice: 译作现在时意义的“天国是他们的”。
  alternative: 译作“天国将是他们的”。
  rationale: 原文使用现在时ἐστιν，表明这种归属不应被翻成纯粹将来的奖赏。
- issue: πνεῦμα是否指圣灵
  choice: 不把它明确译为“圣灵”。
  alternative: 译作“在圣灵里贫穷”。
  rationale: 原文没有冠词，语境也没有明确要求把πνεῦμα专指圣灵；译文不应加入这一限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有福了”延续汉语圣经祝福宣告的自然语感；“心灵贫穷”避免生硬的“在灵里贫穷”，同时以脚注保留原文的解释空间。
