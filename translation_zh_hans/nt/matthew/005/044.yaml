id: MAT.5.44
reference: Matthew 5:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: zh_hans
  text: 但我告诉你们：要爱你们的仇敌，并要为迫害你们的人祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为……祷告”也可译作“替……祷告”。
    reason: 说明ὑπέρ可表达为了某人的益处或代表某人；正文采用更自然、涵盖面更广的“为”。
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: 但我告诉你们
  rationale: “但”保留δέ所表达的鲜明转折；“我”体现ἐγώ的强调；“告诉你们”在现代汉语中自然庄重，并准确传达λέγω ὑμῖν。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 用“要”明确表达命令语气；“爱”直接保留ἀγαπάω的伦理要求，不擅自限定为情感、行动或某种具体实践。
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: 你们的仇敌
  rationale: 直接、自然地保留ἐχθρός所含的敌对关系，不将其弱化为一般的反对者。
- source_word: προσεύχεσθε
  choice: 要……祷告
  rationale: “祷告”是προσεύχομαι的标准对应；再次使用“要”使第二个并列命令在汉语中清楚可辨。
- source_word: ὑπὲρ
  choice: 为
  rationale: 此处ὑπέρ加属格表示为某人的益处或代表某人祷告；“为”最简洁自然，同时保留语义范围。
- source_word: τῶν διωκόντων ὑμᾶς
  choice: 迫害你们的人
  rationale: 保留分词的动作含义，并以自然现代汉语表达持续或惯常实施迫害的人。
theological_decisions:
- issue: 爱仇敌这一命令的具体范围
  choice: 直接译出“要爱你们的仇敌”，不进一步说明这种爱主要是情感、善意行动或绝对不抵抗。
  alternative: 将“爱”扩译为“善待”，或加入具体的行为要求。
  rationale: 原文发出真实而强烈的命令，却未在本节界定其全部实践含义；直译可保留其神学张力。
- issue: 为迫害者祷告的具体内容
  choice: 译作“为迫害你们的人祷告”，不注明应求祝福、悔改或归信。
  alternative: 扩译为“求上帝赐福迫害你们的人”或“为他们悔改祷告”。
  rationale: 原文指出祷告的对象，却没有限定祷告事项；不应把合理的解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仇敌”比“敌人”略具经文语体色彩，但仍为当代读者熟悉，并能准确表达关系性的敌对。“迫害”保留原文的强烈程度。
