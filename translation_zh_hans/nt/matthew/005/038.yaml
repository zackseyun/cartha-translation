base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: zh_hans
  text: “你们听见有话说：‘以眼还眼，以牙还牙。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 你们听见
  rationale: 希腊语第二人称复数不定过去时在这一固定引语句式中，指听众已经听过并领受的教导；中文用“你们听见”自然简洁，也保留原文对听众的直接称呼。
- source_word: ὅτι ἐρρέθη
  choice: 有话说
  rationale: ὅτι引出所听见的内容，ἐρρέθη是λέγω的被动式。中文“有话说”以自然的无主句保留原文未明说发言者的特点，避免擅自补出“古人”或“律法”。
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: 以眼还眼
  rationale: ἀντί表达对应、交换或替代关系；“以眼还眼”是现代中文可懂且广为人知的法律格言形式，准确传达原文的对称结构。
- source_word: καὶ
  choice: 以
  rationale: 原文καί连接两个平行分句。中文格言惯用“以眼还眼，以牙还牙”，用逗号并重复“以”来表达并列，比直译“和”更自然，同时保持平行。
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: 以牙还牙
  rationale: 与前一分句严格平行，表达牙与牙相对应的补偿或报复原则；不进一步解释其实施方式。
theological_decisions:
- issue: 如何呈现耶稣所引用的同态报复法律格言
  choice: 以眼还眼，以牙还牙
  alternative: 眼代替眼，牙代替牙
  rationale: 所选译法忠实传达ἀντί所表示的对应交换关系，并保留这一格言的法律性和辨识度；不预先断定它要求私人报复、字面伤害或仅指等比例赔偿，从而保留上下文中的神学张力。
- issue: 是否明确补出原先说话者或受话者
  choice: 有话说
  alternative: 对古人说／律法上说
  rationale: 本节希腊文本只有非人称被动“被说”，没有明确出现“古人”或“律法”。因此不把上下文推断写入正文，以免消除原文的含蓄性。
translation_notes:
  register: 采用庄重而通行的现代标准汉语。“有话说”自然地对应希腊语非人称被动；引文采用读者熟悉的四字平行格言，节奏清楚，适合公开诵读。原文没有需要另加脚注才能保留的实质歧义，因此不设脚注。
