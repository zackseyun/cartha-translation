id: MAT.5.39
reference: Matthew 5:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: zh_hans
  text: 可是我告诉你们：不要抗拒恶人[a]。相反，无论谁打你的右脸，也把另一边脸转向他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要抗拒恶”；也可译：“不要抗拒那恶者。”
    reason: 原文τῷ πονηρῷ在语法上可能指抽象的“恶”、泛指的“恶人”，或人格化的“那恶者”。
  - marker: b
    text: 直译：“也把另一个转向他”；“另一个”按上下文指另一边脸。
    reason: 说明原文省略了第二个“脸”字，并保留其简练表达。
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: 可是我告诉你们
  rationale: 保留δέ与上文形成的转折，以及耶稣直接而有权威的教导语气；“告诉你们”符合现代汉语表达。
- source_word: μὴ ἀντιστῆναι
  choice: 不要抗拒
  rationale: ἀνθίστημι的基本意思是抵抗、对抗。“抗拒”保留宽泛语义，不把命令过早局限为法律上的反抗或报复。
- source_word: τῷ πονηρῷ
  choice: 恶人
  rationale: 带冠词的形容词在此可能指“恶”、“恶人”或“那恶者”。下文立即以打人者为例，因此正文采用人格化而泛指的“恶人”，同时用脚注保留真实歧义。
- source_word: ὅστις σε ῥαπίζει
  choice: 无论谁打你
  rationale: ὅστις表达不定泛指；ῥαπίζω指用手击打，常含扇耳光及羞辱意味。汉语“打你的右脸”自然简洁，并由“脸”明确击打方式。
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: 你的右脸
  rationale: σιαγών可指下颌或面颊；在掌击语境中译作“脸”最自然。
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: 也把另一边脸转向他
  rationale: 保留στρέφω“转”的直接动作，并依据语境补出“脸”；“也”表达καί，现代汉语语序自然。
theological_decisions:
- issue: τῷ πονηρῷ的所指
  choice: 正文译作“恶人”
  alternative: “恶”或“那恶者”
  rationale: 该形式在语法上可作中性抽象概念、阳性泛指的人，或特指邪恶者。紧接着的打脸例子偏向人类施害者，但不足以消除其他可能，故在脚注中保留。
- issue: μὴ ἀντιστῆναι的伦理范围
  choice: 译作“不要抗拒”，不在正文中限定为“不报复”
  alternative: “不要反抗”或“不要报复”
  rationale: 原词语义比“报复”更广；上下文虽突出不以牙还牙，却不宜由译文直接裁定该命令在所有情形中的具体适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”承接前文形成鲜明转折；正文保持命令的力度，不加入“任由”“主动献上”等可能扩大解释的措辞。所有脚注标记均已置于正文对应位置。
