  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: zh_hans
  text: 他开口教导他们，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“他张开口，持续教导他们，说。”
    reason: 说明原文“开口”的较完整形式，以及未完成时动词所带的持续性；正文采用更自然的现代汉语。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处καί承接上文；现代汉语经文按节连续阅读时无需机械译作“并且”，省略可避免生硬，同时保留叙事衔接。
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: 他开口
  rationale: 希腊文直译为“他张开他的口”。现代汉语“开口”既保留了以郑重发言引出下文的表达，也比“张开他的口”自然。
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 未完成过去时呈现持续进行的教导行动；汉语动词本身通常不标时态，结合语境即可表达，避免增添“开始”这一并非必然的起始含义。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 保留代词，不在本节中将其明确解释为“门徒”或“众人”，从而保存原文指代需由上下文判断的空间。
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出教导的具体内容。译作“说”符合现代汉语引语格式，并保留与主要动词的联系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“开口……说”保留原文郑重引出讲话的语气；“教导他们”不预先限定代词的具体所指。脚注标记置于冒号后，与整句翻译选择相连。
