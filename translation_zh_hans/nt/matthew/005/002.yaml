  source_fidelity: 正文准确传达了καὶ ἀνοίξας τὸ στόμα αὐτοῦ ἐδίδασκεν αὐτοὺς λέγων的核心语义。“他开口”自然保留“张开口”这一郑重引出言语的表达；“教导他们”保留未限定的αὐτούς，不擅自定为门徒或群众；“说：”恰当地引出下文内容。汉语不必强制标示未完成时的持续性，未增添“开始教导”等原文未明示的含义。
  naturalness: “他开口教导他们，说：”属于庄重、清晰且可用于经文的现代汉语。虽保留了较接近原文的“开口……说”框架，但并不生硬；冒号也符合后文直接引语的汉语排版。
