  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: zh_hans
  text: 我实在告诉你：你绝不能从那里出来，直到你还清最后一枚夸德兰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸德兰”是面额很小的罗马钱币。
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在符类福音的“ἀμὴν λέγω σοι”宣告式中，ἀμήν用于郑重确认，引出带权威的话；“实在”自然、庄重，也不误作约翰福音中的双重“实实在在”公式。
- source_word: λέγω σοι
  choice: 我告诉你
  rationale: 保留第二人称单数的直接称呼和宣告语气，符合现代汉语表达。
- source_word: οὐ μὴ ἐξέλθῃς
  choice: 你绝不能……出来
  rationale: οὐ μή加不定过去时虚拟语气构成强烈否定；“绝不能”明确传达其强调力度，同时适合受拘禁的语境。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 该词表示从某处离开；“从那里出来”准确而自然。
- source_word: ἕως ἂν ἀποδῷς
  choice: 直到你还清
  rationale: ἕως ἄν与不定过去时虚拟语气表示以将来某事完成为界限；“还清”兼顾偿付债务的语境与完成含义。
- source_word: τὸν ἔσχατον
  choice: 最后一个
  rationale: 表达欠款必须全部付清，连最末一枚也不例外，不过度添加原文没有明说的强调词。
- source_word: κοδράντην
  choice: 夸德兰
  rationale: 保留特定罗马钱币名称，避免用“一文钱”等中国传统币名造成文化错置；以脚注说明其为小额钱币。
theological_decisions:
- issue: 是否把本句明确解释为末日审判、炼净，或仅限于世俗法律与监禁场景
  choice: 保留偿债与受拘禁的具体图景，不在译文中指定其教义含义。
  alternative: 将其明确译作关于神的审判、末世刑罚或死后炼净的陈述。
  rationale: 希腊文本本身只说当事人在完全偿清以前不能出来；上下文虽可能具有更深的审判意味，译文不应替读者消除这一解释张力。
- issue: “直到”是否暗示最终必定能够偿清并出来
  choice: 按原文保留“直到”的界限表达，不断言债务实际上能够或必将偿清。
  alternative: 将其改写为“永远不能出来”，或明确断言“偿清后就会出来”。
  rationale: ἕως ἄν陈述出来所需满足的条件，并不自行解决该条件是否可能实现；保留这种开放性可避免加入原文未明说的结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不能”传达希腊文强烈否定；“夸德兰”保留历史文化特指，并用脚注解释。所有脚注标记均置于正文对应词后。
