base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: zh_hans
  text: “你们听见过有人说[a]：‘要爱你的邻舍，也要恨你的仇敌。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前半句呼应《利未记》19:18；后半句“也要恨你的仇敌”并非旧约的直接引文，而是反映耶稣在此纠正的既有教导。
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 你们听见
  rationale: 该简单过去时用于耶稣反复采用的教导引语格式，指听众先前领受过的教导；现代汉语用“你们听见”自然简明，也不额外限定听见的时间或方式。
- source_word: ἐρρέθη
  choice: 有话说
  rationale: 保留希腊文无人称被动表达，不明确指定说话者，也避免暗示整句话都是直接引自圣经。
- source_word: Ἀγαπήσεις
  choice: 要爱
  rationale: 此处将来时具有命令作用；“要爱”在现代汉语中清楚表达训令语气，并符合所呼应的利未记命令。
- source_word: τὸν πλησίον σου
  choice: 你的邻舍
  rationale: “邻舍”是此伦理及经文互文语境中 πλησίον 的准确、稳固译法，既可指邻近者，也保留其较广的人际含义。
- source_word: μισήσεις
  choice: 恨
  rationale: 该将来时与前面的命令式引语并列；汉语在“要爱……，恨……”的结构中可自然承接同一训令语气，无须重复“要”。
- source_word: τὸν ἐχθρόν σου
  choice: 你的仇敌
  rationale: “仇敌”直接传达 ἐχθρός 所指与人敌对者，并与“邻舍”形成鲜明伦理对照。
theological_decisions:
- issue: “恨你的仇敌”这一分句的地位
  choice: 将它译为耶稣所述听众曾听见之教导的一部分，但不暗示它是旧约的直接引文。
  alternative: 把整句话都处理成同等直接引自圣经，或在正文中直接标明后半句属于解释传统。
  rationale: 希腊文把两分句置于同一个“有话说”所引出的言论中；然而只有前半句呼应利未记19:18。正文忠实保留该整体引语结构，脚注则说明两部分来源性质的差异，不在正文中替耶稣的论证预先作解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有话说”保留原文被动而不指定发言者；“邻舍”虽较书面，但在圣经伦理语境中准确且为普通读者熟悉。
