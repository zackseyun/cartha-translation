  naturalness: “为义受迫害的人有福了，因为天国是他们的”在现代标准普通话中简洁、庄重、顺畅，也与本段八福体裁相称。“有福了”和“天国”虽带有圣经文体色彩，仍属现代中文读者可自然理解的规范宗教语体。
