id: MAT.5.10
reference: Matthew 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: zh_hans
  text: 为义受迫害的人有福了[a]，因为天国是他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“正义”。希腊词既可指合乎上帝旨意的正直，也可含有公平正义的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 这是现代中文《八福》语境中自然、庄重的宣告语，既不把福分缩减为主观的快乐，也保留上帝赐福与认可的意味。
- source_word: οἱ δεδιωγμένοι
  choice: 受迫害的人
  rationale: 定冠词加完成时被动分词作名词使用，指因迫害而处于受迫害境况的人；中文以“受迫害的人”表达自然，并可涵盖已经遭受及持续承受迫害的状态。
- source_word: ἕνεκεν
  choice: 为
  rationale: 在“为义受迫害”这一结构中，“为”简洁自然，表达迫害是因义而起，也保留“为了……的缘故”的意味。
- source_word: δικαιοσύνης
  choice: 义
  rationale: “义”是简洁而有圣经语感的现代中文表达，可指合乎上帝旨意的正直与行为；其可能包含的公平、正义意味在脚注中保留。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出这项福分的理由，符合现代汉语表达。
- source_word: αὐτῶν ἐστιν
  choice: 是他们的
  rationale: 直接保留希腊文的归属表达，并与本章其他福句的宣告形式协调。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音特有表达在中文中的准确而通行译法，所指是上帝属天的王权与国度，并非单指一个地点。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 正义
  rationale: 本句首先指人因遵行上帝所看为正的事而遭迫害；“义”较能保留道德、关系及遵从上帝旨意等多重含义。但原词也可突出公平正义，因此以脚注保存这一可能性，不在正文中排除。
- issue: 天国归属的时态
  choice: 是他们的
  alternative: 将来必归他们
  rationale: 希腊文使用现在时ἐστιν，正文据此保留当前归属的宣告，不将其改写为纯粹将来的应许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有福了”保留八福宣告的正式语气；句式简洁，并使脚注标记紧随存在词义张力的“义”。
