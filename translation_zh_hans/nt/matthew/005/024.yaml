  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: zh_hans
  text: 把你的礼物留在祭坛前；先去与你的弟兄[b]和好[a]，然后来献上你的礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与你的弟兄和解。”
    reason: lexical_alternative
  - marker: b
    text: “弟兄”译自希腊文阳性单数词；在本段语境中，和好的原则可能也适用于更广泛的人际关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: 留在那里
  rationale: ἀφίημι在这里指把礼物留在原处，ἐκεῖ保留明确的地点指向；“留在那里”自然且符合献祭场景。
- source_word: τὸ δῶρόν σου
  choice: 你的礼物
  rationale: δῶρον可指献给上帝的礼物或供物；上下文中的“祭坛”和“献上”已清楚表明其献祭性质，因此保留“礼物”的基本词义。
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: 放在祭坛前
  rationale: 准确表达礼物与祭坛的空间关系；补出“放在”使现代汉语句法顺畅，但没有增加新的动作内容。
- source_word: ὕπαγε πρῶτον
  choice: 先去
  rationale: 保留命令语气和πρῶτον所强调的优先次序：必须先处理关系，再完成献礼。
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: 与你的弟兄和好
  rationale: “与……和好”是现代汉语表达关系恢复的自然说法，也能传达διαλλάγηθι的被动形式所指向的和好状态，而不擅自限定由哪一方主动。
- source_word: καὶ τότε ἐλθὼν
  choice: 然后回来
  rationale: τότε标明其后的时间次序；ἐλθών在此语境中表示办完前事后再来到祭坛处，译作“回来”使隐含的空间返回关系清楚自然。
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: 献上你的礼物
  rationale: προσφέρω在祭祀语境中是把供物呈献上去；“献上”准确而庄重。
theological_decisions:
- issue: διαλλάγηθι的被动语态及其与间接宾语的关系
  choice: 与你的弟兄和好
  alternative: 让自己同你的弟兄和好
  rationale: 原文采用被动命令式，重点是进入恢复关系的状态，并未具体说明谁先采取行动。“与你……和好”在汉语中既自然，也避免把责任单方面归给任何一方；脚注保留较显明体现被动形式的译法。
- issue: 伦理语境中ἀδελφός的性别与关系范围
  choice: 弟兄
  alternative: 弟兄或姐妹／他人
  rationale: 原文是阳性单数，正文以“弟兄”保留其语法形式及第一世纪群体称谓；同时不把经文原则限缩为男性亲兄弟，因此脚注说明其伦理原则可能有更广的适用范围。
- issue: 和好与献礼的先后次序
  choice: 先去……和好，然后回来献上
  alternative: 在献礼的同时寻求和好
  rationale: πρῶτον与τότε明确建立先后关系，正文保留这种张力，不把和好仅处理成与敬拜并行的笼统劝勉。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“祭坛”“献上”保留敬拜语境；以分号清楚呈现暂缓献礼与先行和好的命令次序。脚注标记按各自所解释的词语放置，因此[b]紧随“弟兄”，[a]紧随“和好”。
