id: MAT.5.33
reference: Matthew 5:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: zh_hans
  text: 你们又听见过这样的话，是对古人说的：‘不可起假誓[a]，却要向主[b]履行你的誓言。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可违背誓言”；这个动词既可指虚假起誓，也可指不守所起的誓。
    reason: lexical_alternative
  - marker: b
    text: 或译“向耶和华”，反映这句话在旧约中的圣约神名背景。
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: 又
  rationale: 承接前文一连串的对比教导，简洁自然地表达“再次、进一步”的推进关系。
- source_word: ἠκούσατε
  choice: 你们听见
  rationale: 在这一固定引述句式中，用现代汉语的一般表达即可传达其既往领受并持续相关的含义。
- source_word: ἐρρέθη
  choice: 有话……说
  rationale: 保留希腊文未明确说话者的被动表达，同时符合现代汉语习惯。
- source_word: τοῖς ἀρχαίοις
  choice: 对古人
  rationale: 指从前世代的人，而非单指年长者；“古人”简洁庄重。
- source_word: Οὐκ ἐπιορκήσεις
  choice: 不可起假誓
  rationale: ἐπιορκέω可指虚假起誓，也可涉及违背誓言；正文采用涵盖面较广且具有经文语体的“起假誓”，另以脚注保留另一可能。
- source_word: ἀποδώσεις
  choice: 履行
  rationale: 此处指践行由誓言所承担的义务；“履行”比字面的“偿还”更符合现代汉语搭配。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: 按现存希腊文κύριος直译为“主”；上下文所指为上帝。
- source_word: τοὺς ὅρκους σου
  choice: 你的誓言
  rationale: ὅρκος明确指誓言；这一译法简明，并保留第二人称单数所有格的泛指表达。
theological_decisions:
- issue: 在以色列经文背景的引述或概述中如何翻译κύριος
  choice: 主
  alternative: 耶和华
  rationale: 希腊文本使用κυρίῳ，而此处是对经文教导的概述，并非直接呈现希伯来文神名；正文忠实译作“主”，脚注保留旧约背景下“耶和华”的可能表达。
- issue: ἐπιορκέω的语义范围
  choice: 起假誓
  alternative: 违背誓言
  rationale: 该动词既可表示虚假起誓，也可表示不守所起的誓；正文不采用范围更窄的现代法律术语“作伪证”，并用脚注呈现另一语义侧重。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有话对古人说”保留原文未点明说话者的形式；“却要”表达δέ在禁令与正面义务之间的转折。“你的”虽为单数形式，在引语中按汉语习惯作为对每个人的泛指。
