  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: zh_hans
  text: 有人想告你[a]，要拿走你的里衣[b]，连你的外衣也让他拿去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跟你打官司”。希腊文直译为“与你受审”，这里指通过法律程序与你争讼。
    reason: lexical_alternative
  - marker: b
    text: “里衣”指贴身穿的内层衣物；“外衣”指穿在外面的衣物。
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: 有人想
  rationale: 带冠词的现在分词泛指任何有此意愿的人；“有人想”符合现代汉语习惯，也保留 θέλω 的意愿含义。
- source_word: σοι κριθῆναι
  choice: 告你
  rationale: κριθῆναι 字面涉及在法律场合受审；结合后面的“拿走你的里衣”，这里指向对听者提起法律行动。“告你”简洁自然，法律语境清楚；较字面的译法收入脚注。
- source_word: χιτῶνά
  choice: 里衣
  rationale: χιτών 指贴身穿的内层衣物。“里衣”既保留古代服饰背景，也清楚区别于 ἱμάτιον 所指的外衣。
- source_word: λαβεῖν
  choice: 拿走
  rationale: λαμβάνω 在此指取得并占有衣物；“拿走”能自然表达诉讼所追求的结果。
- source_word: ἄφες αὐτῷ
  choice: 让他拿去
  rationale: ἀφίημι 的命令式在此表示放手、任由对方取得。“让他拿去”保留直接命令的力度，又符合现代汉语表达。
- source_word: ἱμάτιον
  choice: 外衣
  rationale: ἱμάτιον 指穿在 χιτών 外面的衣物。“外衣”准确呈现两类衣物的对照，也比音译或古奥名称更易懂。
- source_word: καὶ ... καὶ
  choice: （承接上下文）……连……也
  rationale: 句首 καί 承接前文，在中文单句中可不机械译出；第二个 καί 具有追加意味，以“连……也”突出连外衣也交出的反常力度。
theological_decisions:
- issue: 耶稣对法律纠纷所作教导的伦理力度
  choice: 译为直接而尖锐的命令：对方若借诉讼取得里衣，连外衣也任他拿去。
  alternative: 弱化为一般性的“放弃权利”原则，或仅视为不必照字面理解的比喻。
  rationale: 原文使用命令式 ἄφες，并以两件具体衣物构成鲜明画面。译文应保留不报复和慷慨让予的激进要求，同时不额外限定其系统神学或法律适用范围。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“告你”贴近日常法律用语；“里衣／外衣”保留古代衣着层次的对照。句式避免生硬复制希腊语结构，同时维持命令的直接性和教导的张力。
