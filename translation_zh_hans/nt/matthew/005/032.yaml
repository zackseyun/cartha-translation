source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: zh_hans
  text: 但我告诉你们：凡与妻子离婚的，除非是因淫乱[a]的缘故，就是使她犯奸淫[b]；谁娶了离婚的妇人，谁就犯奸淫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫乱”译自希腊语 porneia，是泛指不正当性行为的词；也可译作“不贞”或“淫行”。
    reason: lexical_alternative
  - marker: b
    text: 或较直译为“使她成为犯奸淫的人”；希腊文的不定式在形式上是被动语态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: 与妻子离婚 / 离婚的妇人
  rationale: 在婚姻语境中，ἀπολύω 指解除婚姻关系；译为“离婚”比字面的“打发走”更准确、自然，并使前后两个分词的法律—婚姻含义保持一致。
- source_word: γυναῖκα
  choice: 妻子
  rationale: γυνή 可指“女人”或“妻子”；这里有属格 αὐτοῦ，并处于离婚语境中，因此译为“妻子”。
- source_word: παρεκτὸς λόγου πορνείας
  choice: 除非是因为淫乱
  rationale: παρεκτός 明确引出例外，λόγου 在此表示缘由或事由；“淫乱”保留 πορνεία 对不正当性行为的宽泛指涉，不把它限定为某一种行为。
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: 使她犯奸淫
  rationale: ποιέω 加不定式表示使某事发生。“使她犯奸淫”在现代汉语中清楚自然；由于 μοιχευθῆναι 在形式上是被动语态，其可能的结果性含义另以脚注保留。
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: 谁娶了……，谁就……
  rationale: 关系代词加 ἐάν 表达不定的一般条件；这一汉语句式简洁地传达“无论谁”的普遍性。
- source_word: μοιχᾶται
  choice: 犯奸淫
  rationale: 此处现在时形式表达一般性的行为判断；“犯奸淫”是自然且庄重的汉语表达。
- source_word: πᾶς ὁ ἀπολύων
  choice: 凡与妻子离婚的
  rationale: 阳性单数分词结构具有泛指作用；“凡……的”传达普遍范围，而“妻子”保留原句所呈现的男性主体社会情境。
theological_decisions:
- issue: 例外条款 παρεκτὸς λόγου πορνείας 的含义
  choice: 直译为真实的例外：“除非是因为淫乱”
  alternative: “除非涉及所谓淫乱的事”或把 πορνεία 特指为不合法的婚姻
  rationale: 希腊文明确使用例外结构，但没有进一步界定 πορνεία 的具体范围。译文既不淡化例外，也不替原文限定其范围，从而保留相关的神学张力。
- issue: ποιεῖ 后面 μοιχευθῆναι 的语态和含义
  choice: 正文采用自然表达“使她犯奸淫”，脚注说明被动形式可能表达“使她成为犯奸淫的人”
  alternative: “使她成为淫妇”或“使她遭受奸淫”
  rationale: 不定式在形式上是被动的，但此结构的具体语义存在讨论。正文优先清楚自然，同时通过脚注保留形式和结果性含义，不把争议静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离婚”比“休妻”更符合当代通用语，同时保留原文的婚姻法律语境；“奸淫”用于区别较宽泛的“淫乱”，并维持经文语体。所有脚注标记均置于其所解释的词句之后。
