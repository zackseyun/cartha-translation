  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: zh_hans
  text: 心里纯洁的人有福了[a]，因为他们必看见上帝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“内心洁净的人有福了。”
    reason: lexical_alternative
  - marker: b
    text: “看见上帝”可能指直接进入上帝的同在，也包括这应许在将来的完全实现；正文保留原文措辞，不限定其含义。
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 采用现代中文中庄重而自然的福语表达，既体现蒙上帝赐福、处境可羡，也不把含义缩减为主观的“快乐”。
- source_word: καθαροὶ
  choice: 纯洁
  rationale: 在本句内在与道德语境中，“纯洁”比“干净”自然；同时以脚注保留“洁净”这一可能译法。
- source_word: τῇ καρδίᾳ
  choice: 心里
  rationale: 此处与 καθαροί 连用，说明纯洁所涉及的层面。“心”在原文中指人的内在生命，不仅是情感；“心里”符合现代中文表达。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后半句对前述福分所作的理由或根据说明。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 原文代词带强调意味，指明正是这些心里纯洁的人将领受应许；中文的主语“他们”结合句式已能自然体现所指。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 作为 ὄψονται 的直接宾语，直译为“上帝”，不作解释性扩展。
- source_word: ὄψονται
  choice: 必看见
  rationale: 表达将来的应许；“必”自然传达确定性，而“看见”保留原文直接、开放的措辞。
theological_decisions:
- issue: “看见上帝”的含义
  choice: 保留为“必看见上帝”，不作解释性扩写
  alternative: 将其具体译为“必亲近上帝的同在”或“末后必瞻仰上帝”
  rationale: 原文措辞简洁，可能涉及直接进入上帝的同在，并包含将来终极实现的意味，但没有在本句中限定其方式或时间。直译可保存其神学深度与张力。
translation_notes:
  register: 采用现代、庄重、普通读者易懂的简体中文。“有福了”延续福语体裁；“心里纯洁”突出人的内在生命而非仅指情绪或外在礼仪状态。脚注标记按正文出现次序排列。
