id: MAT.5.20
reference: Matthew 5:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: zh_hans
  text: 因为我告诉你们：你们的义[a]若不胜过经学家和法利赛人的义，就绝不能进天国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义”。希腊词 δικαιοσύνη 可指合乎正道的状态和行为，也可含公正、正义之意；本节译作“义”较符合上下文。
    reason: 保留原词的词义广度，并说明正文选择而不排除词汇上的另一可能。
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: γάρ承接上文，带有解释缘由的作用，译作“因为”；λέγω ὑμῖν保留耶稣对听众直接说话的语气，译作自然的现代汉语“我告诉你们”。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 这一组合提出不可缺少的否定条件；“若不”简洁庄重，并与后面的“就绝不能”自然呼应。
- source_word: περισσεύσῃ … πλεῖον
  choice: 胜过
  rationale: 这里表示在程度上超过比较对象。“胜过”既保留比较意味，也比直译为“更加充足”更符合现代汉语表达。
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: 你们的义
  rationale: δικαιοσύνη在此指合乎上帝旨意的正直状态与生活实践。“义”是简洁、传统而仍可理解的对应词，也保留该词可能涵盖公正的语义广度。
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: 经学家和法利赛人的义
  rationale: γραμματεῖς指熟悉并讲授律法的专业人士，“经学家”比仅指抄写职业的“文士”更便于现代读者理解。汉语补出“人的义”，明确所比较的是双方的义，而不是人与人。Φαρισαῖοι按通行名称译为“法利赛人”。
- source_word: οὐ μὴ εἰσέλθητε
  choice: 就绝不能进
  rationale: οὐ μή与虚拟语气构成强烈否定。“绝不能”准确传达 emphatic negation，并保持自然有力的现代汉语。
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音的特色表达；“天国”是准确、简洁且广为理解的汉语译法，表达天的统治领域而非仅指地点。
theological_decisions:
- issue: δικαιοσύνη在马太福音语境中的译法
  choice: 义
  alternative: 公义；正义
  rationale: 本节与登山宝训中遵行上帝旨意的生活相连，“义”最能兼顾人的正直状态与合宜行为，同时不把含义缩窄为社会司法层面的“正义”。脚注保留“公义”这一可能译法，以提示原词的语义范围。
- issue: “胜过”所比较的对象
  choice: 你们的义胜过经学家和法利赛人的义
  alternative: 你们比经学家和法利赛人更有义
  rationale: 希腊文的比较结构可能在目标语中产生比较对象不清的问题。补出第二个“义”，明确比较的是“义”的程度或性质，而不进一步解释这种超越究竟是数量、质量、内在动机还是其他层面，从而保留经文的神学张力。
- issue: οὐ μή的强烈否定
  choice: 绝不能进天国
  alternative: 必不能进天国；绝不会进天国
  rationale: “绝不能”保留原文强烈而确定的否定，却不额外说明进入天国与行为、身份或恩典之间的系统神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”保留本节与上文的解释关系；“若不……就绝不能……”清楚呈现条件句及强烈否定。“经学家”帮助现代读者理解其律法专家身份；“天国”沿用马太福音特色表达。脚注标记紧随“义”，对应其词汇说明。
