  source_fidelity: 译文准确保留了 γάρ 的承接解释语气（“因为”）、ἐὰν μὴ 的必要否定条件（“若不”）、περισσεύσῃ πλεῖον 的比较意义（“胜过”），以及 οὐ μή εἰσέλθητε 的强烈否定（“就绝不能进”）。补出第二个“义”恰当地明确了原文比较的是“义”，而非将人彼此比较。"天国"忠实而自然地对应马太特有的 βασιλεία τῶν οὐρανῶν。
  naturalness: “因为我告诉你们：你们的义若不胜过经学家和法利赛人的义，就绝不能进天国。”在现代标准普通话中通顺、庄重且适合经文体裁。条件句和结果句衔接清晰；“经学家”可自然表达此处作为律法经卷专家的 γραμματεῖς。
  terminology: “义”与马太福音此处 δικαιοσύνη 的语境相称，避免把含义单一限缩为司法意义的“正义”。“法利赛人”和“天国”为稳定且恰当的常用圣经术语。脚注以紧随“义”的 a 标记对应词汇说明，且“公义”作为可行的词汇替代得到保留；未将有争议的神学解释写入正文。
