  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: zh_hans
  text: 你们要欢喜，也要欣喜雀跃，因为你们在天上[a]的赏赐是极大的；因为从前人们也这样迫害过那些在你们以前的先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在诸天中”。马太常使用复数形式，而现代汉语通常说“天上”。
    reason: 保留原文复数形式这一语言特征，同时在正文中采用自然的现代汉语表达。
lexical_decisions:
- source_word: χαίρετε
  choice: 要欢喜
  rationale: 现在时命令语气、第二人称复数，呼吁听众持续以喜乐回应；“要欢喜”自然、庄重，也保留命令语气。
- source_word: ἀγαλλιᾶσθε
  choice: 也要欣喜雀跃
  rationale: 该词表达比一般“欢喜”更强烈、更洋溢的喜乐；“欣喜雀跃”在现代汉语中能体现这一递进，同时避免只重复“欢喜”。
- source_word: μισθὸς
  choice: 赏赐
  rationale: 该词可指工价、报酬或奖赏；本处谈到因受迫害而从神所得的回报，“赏赐”符合语境，也不致把关系表达成纯粹的商业交易。
- source_word: πολὺς
  choice: 极大的
  rationale: 作表语说明赏赐之大；“极大的”在汉语中自然，并保留原文的强调。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在天上
  rationale: 原文为复数“在诸天中”，但现代汉语通常以“天上”自然表达这一属天领域；脚注保留其复数形式信息。
- source_word: οὕτως
  choice: 也是这样
  rationale: 该副词指方式，表明门徒遭受的迫害与先知遭受迫害的方式相应；“也是这样”使比较关系清楚自然。
- source_word: ἐδίωξαν
  choice: 迫害
  rationale: διώκω在此处承接前文受逼迫的语境，明确表示敌意的迫害，而不是一般的追赶。
- source_word: προφήτας
  choice: 先知
  rationale: 这是对以色列先知人物的标准、清楚译法。
- source_word: τοὺς πρὸ ὑμῶν
  choice: 在你们以前的
  rationale: 该短语修饰“先知”，指历史上先于门徒而来的先知；此译法保留原文简洁结构和时间意义。
theological_decisions:
- issue: “在诸天中”的含义与表达
  choice: 译作“在天上”，指赏赐处于属天的领域，并以脚注说明希腊文使用复数。
  alternative: 较形式对应地译作“在诸天中”。
  rationale: 这里不需要借译文裁定额外的教义问题。希腊文复数带有马太常见的闪语式色彩，而现代汉语“在天上”更自然，脚注则保存原文形式。
- issue: 先知受迫害与门徒受迫害的对应关系
  choice: 以“也是这样”表达方式上的对应。
  alternative: 仅译作“同样”或“所以”。
  rationale: οὕτως主要表示方式；译文保留先知与门徒经历之间的类比，而不进一步限定两者在每个细节上完全相同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欣喜雀跃”呈现第二个喜乐动词的加强语气；“赏赐”符合经文语境；分号保留前后两句之间紧密的因果与类比关系。
