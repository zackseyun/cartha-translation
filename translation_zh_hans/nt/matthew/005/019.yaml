id: MAT.5.19
reference: Matthew 5:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: zh_hans
  text: 所以，凡废除这些诫命中最小的一条[a]，又教导别人这样做的，他在天国里将被称为最小的；但凡遵行并教导这些诫命的，这人在天国里将被称为大的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废除”所译的希腊语动词本义是“解开”，在这里也可译作“放松”“取消”或“破坏”，意思是削弱诫命的约束力，或把它当作不再具有约束力。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接上一节关于律法持久效力的陈述，表达由此得出的结论；“所以”自然、庄重而不过分书面。
- source_word: λύσῃ
  choice: 废除
  rationale: λύω本义为“解开”，在诫命语境中可指解除其约束力、使之不再有效。“废除”与5:17的语境呼应，同时以脚注保留“放松、破坏”等可能语感。
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: 这些诫命中最小的一条
  rationale: 保留属格结构所表达的分类和等级，即在“这些诫命”中被视为最小的一条，而不把ἐλαχίστων弱化为单纯的尺寸概念。
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: 又教导别人这样做
  rationale: οὕτως回指前面的行为，“这样做”使指向清楚；τοὺς ἀνθρώπους泛指人，用现代汉语自然表达为“别人”，不限定性别。
- source_word: ἐλάχιστος κληθήσεται
  choice: 将被称为最小的
  rationale: 直译未来被动式，保留“被称为”而不解释为被排除或被判定；“最小的”与后文“大的”形成原文的不对称对比。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 在天国里
  rationale: “天国”是马太福音中该固定表达自然且通行的现代汉语译法；“里”明确保留其在国度之内的表述。
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: 遵行并教导这些诫命
  rationale: ποιέω在诫命语境中译为“遵行”比机械的“做”更自然，又不加入“完全遵守”等额外含义；补出共同宾语，使汉语清楚。
- source_word: οὗτος
  choice: 这人
  rationale: 保留指示代词的强调作用，使后半句与前半句形成鲜明对照。
- source_word: μέγας
  choice: 大的
  rationale: 直译μέγας，并与“最小的”构成等级对照；不擅自译成最高级“最大的”或技术性的身份称号。
theological_decisions:
- issue: “在天国里被称为最小”所表示的身份
  choice: 按字面保留为天国之内的相对地位，不说明其被排除在天国外，也不把它定义为特定奖赏等级。
  alternative: 解释为被排除在天国外，或解释为一种技术性的天上奖赏等级。
  rationale: 原文明确说“在天国里”，但没有进一步说明救恩、奖赏或身份体系；译文应保留这种神学张力。
- issue: “这些诫命”所指范围
  choice: 保持原文指示语，不在正文中限定为摩西律法的某一部分、耶稣的教训，或二者的特定关系。
  alternative: 明确增译为“摩西律法的诫命”或“我所赐的诫命”。
  rationale: τούτων的具体范围须结合上下文理解，而本节本身没有把所指完全展开，故不在翻译中替解释作决定。
- issue: τοὺς ἀνθρώπους的泛指性质
  choice: 译为“别人”，自然表达所有受教导的人。
  alternative: 译为“男人”或“众人”。
  rationale: 该阳性复数在这里具有泛指人类的作用；现代汉语“别人”准确传达所指，也避免产生仅限男性的误解。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。句式保留原文前后对照和未来被动表达；以“最小的／大的”保存原文ἐλάχιστος与μέγας并非严格对称的措辞，不把“大”擅自提升为“最大”。
