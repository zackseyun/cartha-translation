  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: zh_hans
  text: 你们若只问候自己的弟兄[a]，有什么特别的呢？外邦人[b]不也这样做吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可能泛指自己群体中的人，包括弟兄姊妹。
    reason: lexical_alternative
  - marker: b
    text: 或译：“外族人”；也有人译作“异教徒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: 问候
  rationale: 该动词在这里指向人致意、打招呼；“问候”自然准确，也不额外引入接待或热情款待的含义。
- source_word: ἀδελφοὺς
  choice: 弟兄
  rationale: 保留希腊语阳性复数的形式和群体内成员的语境；其所指也可能宽泛地包括姊妹或自己群体中的人，故以脚注说明。
- source_word: μόνον
  choice: 只
  rationale: 清楚表达行为仅限于某一群体。
- source_word: τί περισσὸν ποιεῖτε
  choice: 有什么超越常人之处呢
  rationale: περισσόν表示超出通常、格外之处；此译法保留反问力度，并比直译“多做了什么”更自然。
- source_word: ἐθνικοὶ
  choice: 外族人
  rationale: 在犹太语境中主要指非犹太人；“外族人”保留族群及盟约群体之外的对照，又避免“异教徒”可能附加的较强贬义。
- source_word: τὸ αὐτὸ
  choice: 这样
  rationale: 承接前述只问候自己人的行为；汉语以“也这样做”表达自然。
theological_decisions:
- issue: ἀδελφοὺς在伦理教导中的范围
  choice: 正文译作“弟兄”，并以脚注注明可能泛指自己群体中的人，包括弟兄姊妹。
  alternative: 弟兄姊妹；自己人
  rationale: 既保留原文阳性复数的形式，也不把其实际社会指称武断地限于男性或血缘兄弟。
- issue: ἐθνικοὶ的含义
  choice: 译作“外族人”。
  alternative: 外邦人；异教徒
  rationale: 原词在此首先标示非犹太人以及群体之外的人；“外族人”不把族群对照过度解释成宗教贬称。
- issue: περισσόν的伦理张力
  choice: 译作“超越常人之处”。
  alternative: 多做了什么；有什么特别之处
  rationale: 保留耶稣要求门徒的行为超出一般互惠规范这一反问含义，同时不具体规定这种“超越”应采取何种形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己的弟兄”体现群体内部关系；两个反问句保持原文的劝诫力度。
