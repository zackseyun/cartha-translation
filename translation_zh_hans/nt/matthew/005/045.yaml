id: MAT.5.45
reference: Matthew 5:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: zh_hans
  text: 好使你们成为你们天父的儿子[a]；因为他使自己的太阳升起，照在恶人和好人身上；又降雨给义人和不义的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“你们的父”后加上“那位在诸天之中者”，这是修饰“父”的表达。“儿子”是原文用词，在这里涵盖所有门徒；也可译作“你们天父的儿女”。
    reason: 说明原文的阳性亲子称谓，并澄清“在诸天之中者”修饰“父”。
  - marker: b
    text: “降雨给”也可直译为“降雨在义人和不义的人身上”。
    reason: 保留βρέχει与介词ἐπί的较直译表达。
lexical_decisions:
- source_word: ὅπως
  choice: 好使
  rationale: 引出目的或结果；“好使”在现代汉语中自然地保留此处的目的意味。
- source_word: γένησθε
  choice: 成为
  rationale: 保留 γίνομαι“成为、变成”的动态语义，不弱化为静态的“是”，也不额外解释其神学机制。
- source_word: υἱοὶ
  choice: 儿子
  rationale: 原文明确使用阳性复数“儿子”，保留其亲子称谓；在这里所指包括所有门徒，另以脚注说明可按涵盖意义理解为“儿女”。
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: 你们天父的
  rationale: “天父”是现代汉语中自然、庄重且通行的表达，概括“你们的父、那位在诸天之中的”；脚注保留原文较完整的空间表述。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后半句对前面劝勉所作的解释或根据。
- source_word: τὸν ἥλιον αὐτοῦ
  choice: 自己的太阳
  rationale: 保留 αὐτοῦ 的所有关系，并自然表达太阳属于且受制于父。
- source_word: ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: 使自己的太阳升起，照着恶人，也照着好人
  rationale: ἀνατέλλει 带宾语“太阳”时具有使之升起的因果表达；补出“照着”使汉语关系清楚，同时保持恶人与好人的平衡对照。
- source_word: βρέχει
  choice: 降雨给
  rationale: 原文可直译为“降雨在……之上”；“降雨给”在汉语中自然，并保留上帝主动施予雨水的意思。
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: 给义人，也给不义的人
  rationale: 以“义人／不义的人”保留 δίκαιος／ἄδικος 的既定道德对照；第二项补出“人”以避免“给不义”在汉语中产生歧义。
theological_decisions:
- issue: 带性别的亲子称谓
  choice: 你们天父的儿子
  alternative: 你们天父的儿女
  rationale: 原文是 υἱοί（儿子），并非 τέκνα（儿女、孩子），因此正文保留“儿子”的称谓和意象；脚注说明此处涵盖门徒群体，避免读者误以为只指男性。
- issue: γένησθε 与神的儿子身份之间的关系
  choice: 成为
  alternative: 作／显明是
  rationale: “成为”忠实保留动词的动态力度。经文把效法父普施恩惠的行动与儿子身份相连，但没有在此详细说明身份产生的救恩机制，译文因此不把它解释成单纯“显明是”，也不另加教义限定。
- issue: 神对善恶双方的普遍恩惠
  choice: 太阳照着恶人和好人，雨降给义人和不义的人
  alternative: 将其解释为救赎性的恩典
  rationale: 经文本身陈述的是日照与降雨这一普遍护理事实；译文不把这种恩惠扩大解释为救赎地位，也不削弱神对双方主动施予的含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“好使”保留目的关系；分号和“也……也……”呈现希腊文两个平行对句。正文以“天父”保持汉语流畅，脚注交代原文“在诸天之中”的结构。
