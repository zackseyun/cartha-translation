  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: zh_hans
  text: 怜悯人的有福了，因为他们必蒙怜悯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为将来时被动语态，直译为“将被怜悯”；施事者未明说。
    reason: 说明原文的语态及其保留的施事者歧义。
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 表示处于上帝恩惠之下、享有真正福分的状态，不只是主观上的快乐；“有福了”也保留八福宣告简洁庄重的形式。
- source_word: οἱ ἐλεήμονες
  choice: 怜悯人的人
  rationale: 定冠词加形容词在此作名词使用，指以怜悯待人的人。“怜悯”又与后面的同词根动词相呼应。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后半句是前半句称其有福的缘由，符合现代汉语。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 原文代词带有强调意味，突出怜悯人的正是将蒙怜悯的人；汉语用“他们”已可自然表达这种对应。
- source_word: ἐλεηθήσονται
  choice: 必蒙怜悯
  rationale: 保留将来被动的意义，并与前句“怜悯”形成词汇呼应；“必”表达将来应许的确定性，“蒙”使被动表达自然庄重。
theological_decisions:
- issue: 所应许之怜悯的施予者
  choice: 用“必蒙怜悯”保留施予者未明说的被动表达
  alternative: 译作“上帝必怜悯他们”或“别人必怜悯他们”
  rationale: 原文是将来被动式，没有明说施予者。语境虽强烈暗示上帝，却不宜在正文中补出原文未明说的主体。
translation_notes:
  register: 采用现代、简洁而庄重的普通话，保留八福宣告的格言式节奏；前后重复“怜悯”，以呈现原文同词根的修辞呼应。
