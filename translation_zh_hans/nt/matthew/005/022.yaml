  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: zh_hans
  text: 但我告诉你们：凡向弟兄发怒的，难免受审判[a][d]；凡对弟兄说“拉加”的，难免受公议会审判[b][c]；凡说“蠢货”的，难免被交付在火的矶汉拿[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“向弟兄发怒”之后加上“无缘无故”；最早且证据最充分的抄本没有这几个字。
    reason: textual_variant
  - marker: b
    text: “拉加”是一个亚兰语侮辱词，大意是“空脑袋”或“没用的东西”。
    reason: cultural_note
  - marker: c
    text: “公议会”也可译作“议会”；这里可能特指犹太人的最高议会，即公会（Sanhedrin）。
    reason: alternative_reading
  - marker: d
    text: 原文“弟兄”是阳性单数，但可作代表性称呼；这句话的适用范围并不限于男性亲兄弟。
    reason: lexical_alternative
  - marker: e
    text: “矶汉拿”也常译作“地狱”或“火狱”。此词源于耶路撒冷附近的欣嫩子谷，在犹太传统中成为审判的意象。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: 但我告诉你们
  rationale: “但”保留与上文的鲜明对比；明示“我”体现ἐγώ的强调。“告诉你们”是现代汉语中自然、庄重的表达。
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: 凡……发怒的
  rationale: 以“凡……的”表达名词化现在分词所具有的普遍、格言性含义，不额外限定怒气持续多久。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 向弟兄
  rationale: “向……发怒”符合现代汉语搭配；“弟兄”保留阳性单数形式，同时可具有代表性，范围说明置于脚注。
- source_word: ἔνοχος ἔσται
  choice: 要被判罪／要受……审判／要被判入
  rationale: 按三个不同补语采用自然汉语搭配，统一保留须为言行承担司法后果的含义，并呈现逐步加强的审判意象。
- source_word: τῇ κρίσει
  choice: 被判罪
  rationale: κρίσις在此具有司法审判意味；译文不把它过度具体化为某一级地方“法庭”。
- source_word: Ῥακά
  choice: 拉加
  rationale: 这是由亚兰语转写而来的侮辱语；正文音译以保留原文特色，含义在脚注解释。
- source_word: τῷ συνεδρίῳ
  choice: 公议会
  rationale: 该词可指议事或审判的公会，在此很可能指犹太人的最高议会；“公议会”兼顾历史语境和普通读者的可理解性。
- source_word: Μωρέ
  choice: 蠢货
  rationale: 这是直接称呼人的贬斥语。“蠢货”比单称“愚笨”更能体现辱骂语气，又避免现代医学或智力分类色彩。
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: 被判入火的欣嫩谷
  rationale: “欣嫩谷”保留γέεννα的具体犹太历史意象；“火的”贴近属格结构，并借“被判入”呈现εἰς所指向的刑罚结局。
theological_decisions:
- issue: γέεννα的译法
  choice: 欣嫩谷
  alternative: 地狱／火狱
  rationale: 保留耶稣所用词语背后的具体地名和犹太审判意象，避免直接把后期“地狱”概念的全部联想带入正文；脚注说明其象征审判的用法。
- issue: ἀδελφός的范围
  choice: 弟兄
  alternative: 弟兄姊妹／同胞／同伴
  rationale: 正文保留原文阳性单数，同时不把其代表性用法限制为亲生男性手足；脚注说明其适用范围可以更广。
- issue: 三重司法警告之间的关系
  choice: 保留“判罪—公议会审判—判入火的欣嫩谷”的递进表达
  alternative: 将三者统一译为一般性的“受审判”
  rationale: 原文有明显递进的司法与终末审判意象；译文保留这种张力，但不武断规定每一项必然对应某一历史法院等级。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留三段平行递进结构；“拉加”音译并加注，“蠢货”传达直接辱骂的力度；避免古奥的“凡骂……拉加者”一类文言句法。
