revisions:
- from: 但我告诉你们：凡向弟兄发怒的，都要被判罪[a]；凡对弟兄说“拉加”的，都要受公议会审判[b][c][d]；凡说“蠢货”的，都要被判入火的欣嫩谷[e]。
  to: 但我告诉你们：凡向弟兄发怒的，难免受审判[a][d]；凡对弟兄说“拉加”的，难免受公议会审判[b][c]；凡说“蠢货”的，难免被交付在火的矶汉拿[e]。
  rationale: 修订以“难免受审判／难免受公议会审判／难免被交付在……”对应三次ἔνοχος，保留法律责任与警告的力度，却不预断已然定罪。以“矶汉拿”保留γέεννα这一专门术语，并在脚注交代其历史来源和审判意象；同时调整脚注锚点，使“弟兄”说明附于首次出现处、“公议会”说明附于相应术语处。
