review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了三段平行的警告及其递进，但将τῇ κρίσει译为“被判罪”把“须对审判负责／难免受审判”的法律责任预先落实为定罪；末句“被判入火的欣嫩谷”亦把ἔνοχος（须承担、难免受）强化为既成判决，并将γέεννα直接等同于具体的“欣嫩谷”。
  naturalness: “火的欣嫩谷”不合现代汉语习惯，也容易把已具审判含义的γέεννα误解为普通地理山谷。“公议会”可保留，但“受公议会审判”较自然。
  terminology: 建议将γέεννα音译为“矶汉拿”，并以脚注说明其与欣嫩子谷及审判意象的关联；这样既不直接套入“地狱”的后期概念，也不把该术语简化为现实中的山谷。保留“弟兄”、 “拉加”和“公议会”均可。
  issues:
  - severity: medium
    issue: “被判罪”过度落实τῇ κρίσει。
    rationale: ἔνοχος ἔσται τῇ κρίσει表示对“审判”负有法律责任、难免受审判，并非在此明确说已经被判定有罪。
  - severity: high
    issue: “火的欣嫩谷”将γέεννα按普通地名直译，且表达不自然。
    rationale: γέεννα在本句是承载终末审判意象的专门术语，虽源自欣嫩子谷，不能不加区分地等同于实际山谷；音译并注释较能保留原文的历史与语义张力。
  - severity: medium
    issue: “被判入”比原文的法律责任表述更确定。
    rationale: 三处ἔνοχος应尽量以相近的“难免受／难免被交付于”类表达呈现，避免前两处是责任、末句成为已执行判决的失衡。
