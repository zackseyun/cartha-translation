id: MAT.5.4
reference: Matthew 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: zh_hans
  text: 哀恸的人有福了[a]，因为他们必得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“悲伤的人。”希腊文含义宽泛，没有说明哀恸的原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 沿用汉语中庄重而自然的八福宣告表达，体现上帝所认可并赐福的状态；比“快乐”更能避免仅指主观情绪。
- source_word: οἱ πενθοῦντες
  choice: 哀恸的人
  rationale: 将带冠词的现在分词自然译为一类人。“哀恸”可涵盖因丧失、苦难、罪或其他原因而悲痛，且不擅自限定对象。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后句是前面称福宣告的理由或根据，符合现代汉语。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 保留代词所指的同一群体；希腊文略带强调，但译成“他们自己”在此会显得生硬。
- source_word: παρακληθήσονται
  choice: 必得安慰
  rationale: 表达将来被动意义，即他们将领受安慰；“必”自然传达这一应许的确定性，而“得安慰”符合现代汉语习惯。
theological_decisions:
- issue: 哀恸的范围
  choice: 宽泛译作“哀恸的人”，不说明哀恸的具体原因
  alternative: 限定为“为罪哀恸的人”、一般遭遇悲伤的人，或为以色列境况哀恸的人
  rationale: 希腊原文没有说明哀恸的对象或原因。保留宽泛表达，可容纳因丧失、苦难、罪、压迫或末世盼望而有的哀恸，避免把某一种解释写入正文。
- issue: 安慰的施行者
  choice: 保留被动表达“必得安慰”
  alternative: 明说“上帝必安慰他们”
  rationale: 原文使用将来被动式，语境中可理解为上帝施行安慰，但正文并未明说施行者，因此译文保留这种含蓄。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“有福了”保留八福宣告的传统辨识度和评价意味；“哀恸”虽较“悲伤”庄重，但仍属通行词，并较能表达 πενθέω 的深切悲痛。
