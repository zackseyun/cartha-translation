  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: zh_hans
  text: 但我告诉你们：凡注视一个女人、意图贪恋她的，心里已经与她犯奸淫了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；希腊文 γυνή 可按语境表示二者。
    reason: lexical_alternative
  - marker: b
    text: “意图贪恋她”也可译作“为了欲求她”或“要对她动淫念”；原文结构强调观看所指向的目的或意图。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: 但我告诉你们
  rationale: 保留 δέ 的对比作用和 ἐγώ 的强调，同时采用自然、庄重的现代汉语表达。
- source_word: πᾶς ὁ βλέπων
  choice: 凡注视……的
  rationale: 表达 πᾶς 加分词结构的普遍范围；“注视”比单纯“看见”更能体现持续或有意观看，同时不自行加入经文未明说的细节。
- source_word: γυναῖκα
  choice: 一个女人
  rationale: γυνή 可指“女人”或“妻子”；此处希腊文未明确其婚姻身份，因此正文采用范围较宽的“女人”，并以脚注保留另一可能。
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: 意图贪恋她
  rationale: “意图”体现 πρὸς 加冠词不定式所表达的目的或趋向；“贪恋”在本语境中自然传达 ἐπιθυμέω 所指的不正当性欲，又避免“想要她”可能产生的含混。
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: 已经与她犯奸淫了
  rationale: “已经”对应 ἤδη；“与她犯奸淫”以自然汉语表达 μοιχεύω 与宾语 αὐτήν 的关系。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心里
  rationale: 保留 καρδία 的圣经意象，指人的内在思想、意愿和欲望；“心里”是现代汉语中简洁自然的表达。
theological_decisions:
- issue: γυνή 在奸淫语境中应译为“女人”还是“妻子”
  choice: 女人
  alternative: 妻子
  rationale: 原文没有明确标示婚姻身份。正文采用“女人”以免缩窄原文范围，同时通过脚注保存“妻子”的词义可能。
- issue: ἐπιθυμέω 应译作较宽泛的“欲望”，还是明确带负面性的“贪恋”
  choice: 贪恋
  alternative: 想要；欲求
  rationale: 该词本身可泛指渴望，但此处由观看目的及奸淫语境限定为不正当的性欲。“贪恋”在中文中既自然又能传达语境中的伦理性质。
- issue: 本节责备的是无意看见，还是以欲念为目的的观看
  choice: 以贪恋为意图的注视
  alternative: 任何因观看而产生欲望的情形
  rationale: πρὸς τὸ 加不定式通常表达目的或趋向，因此译文保留意图成分，不将本句扩大为对一切无意看见或非自愿诱惑的直接判定。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“注视”与“意图”共同呈现有意识、带目的的观看；“贪恋”符合本节性伦理语境。正文所有脚注标记均已列出。
