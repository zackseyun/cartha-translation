source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: zh_hans
  text: 但如果你的右眼使你跌倒[a]，就把它剜出来，扔到一边去。因为你身体的一个部分丧失，比你全身被扔进革赫拿[b]更有益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你犯罪”。
    reason: lexical_alternative
  - marker: b
    text: “革赫拿”是与“欣嫩谷”这一名称相关的希腊语形式；传统译作“地狱”。
    reason: historical_and_translation_note
lexical_decisions:
- source_word: σκανδαλίζει
  choice: 使你跌倒
  rationale: 保留希腊文“使人绊跌”的比喻，同时由脚注说明本句语境中“使你犯罪”的含义。
- source_word: ἔξελε
  choice: 剜出来
  rationale: 这个命令语气强烈；“剜出来”既适用于眼睛，也保留原文急迫而严厉的意象。
- source_word: βάλε ἀπὸ σοῦ
  choice: 从你身边扔开
  rationale: “扔开”体现 βάλλω 的力度，“从你身边”则保留 ἀπὸ σοῦ 所表达的分离。
- source_word: συμφέρει
  choice: 宁可……也胜过
  rationale: 按汉语比较句式自然表达“对你更有益、更好”，并清楚呈现两种结果之间的对比。
- source_word: ἀπόληται
  choice: 失去
  rationale: 在身体部分的语境中，“失去”自然表达该部分丧失的意思，同时避免把词义限定为彻底毁灭。
- source_word: ἓν τῶν μελῶν σου
  choice: 你身体的一部分
  rationale: μέλος 指身体的一个部分；此处所指为眼睛，译作“身体的一部分”比“一个肢体”更符合现代汉语习惯。
- source_word: βληθῇ
  choice: 被扔进
  rationale: 准确保留 βάλλω 被动式的力度及方向。
- source_word: γέενναν
  choice: 革赫拿
  rationale: 采用专名音译，保留原文所用的特定名称，不在正文中直接将其概括为后来的通称“地狱”；其历史名称和传统译法在脚注中说明。
- source_word: ὁ δεξιὸς
  choice: 右
  rationale: 保留原文明说的方位细节。
- source_word: δὲ
  choice: 但
  rationale: 体现本句承接上文时所带的轻微转折。
theological_decisions:
- issue: γέεννα 的译法
  choice: 革赫拿
  alternative: 地狱
  rationale: 音译保留希腊文中的特定名称及其历史背景，避免在正文中直接以较宽泛、带有后期神学联想的通称取代它；脚注提供传统译法。
- issue: σκανδαλίζω 的比喻力度
  choice: 使你跌倒
  alternative: 使你犯罪
  rationale: 正文保留原文“绊跌”的比喻及其张力，不把它直接收窄为解释性译法；脚注说明在本段罪的语境中可译为“使你犯罪”。
- issue: 严厉身体意象的处理
  choice: 按原文保留“剜出来”和“扔开”
  alternative: 意译为彻底除去犯罪诱因
  rationale: 原文使用鲜明、严厉的身体意象；翻译不把它改写成解释性的伦理命令，以免预先判定其修辞和应用方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剜出来”保留原文的强烈意象；“宁可……也胜过……”使希腊文的利益比较在汉语中自然清楚。专名“革赫拿”配以脚注，兼顾原文区分与普通读者理解。
