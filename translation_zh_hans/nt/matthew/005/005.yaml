  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: zh_hans
  text: 温柔[b]的人有福了，因为他们将承受大地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。此处很可能呼应《诗篇》37:11；那里的应许既可从圣约之地的角度理解，也可有更广的含义。
    reason: alternative_reading
  - marker: b
    text: 或译“谦和”。这里的“温柔”指谦卑柔和，并非软弱。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: “有福了”是汉语中自然而庄重的祝福宣告，表达蒙上帝眷顾和最终得福，不把词义缩减为主观的“快乐”。
- source_word: οἱ πραεῖς
  choice: 温柔的人
  rationale: πραεῖς指谦和、柔顺而有节制的人，并非软弱怯懦；“温柔的人”比“ meek ”式的生硬直译更符合现代汉语，也保留其品格含义。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出这项福分的根据；“因为”清楚、自然。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 希腊文代词带强调意味；汉语以“他们”承接前句已经足够自然，若译作“正是他们”则会增加正文的语势，但可在理解上保留其强调。
- source_word: κληρονομήσουσι
  choice: 将承受
  rationale: κληρονομέω指作为产业而领受；“承受”既保留产业、应许的语感，也适合庄重的经文语体。
- source_word: τὴν γῆν
  choice: 大地
  rationale: γῆ既可指“大地/地球”，也可指特定的“土地”。正文用“大地”可自然表达较广的范围，同时借脚注保留诗篇37:11背景下“土地”的可能含义。
theological_decisions:
- issue: τὴν γῆν的范围
  choice: 大地
  alternative: 土地
  rationale: γῆ本身允许普世性的“大地”和圣约语境中的“土地”两种理解。本句很可能呼应诗篇37:11，因此正文不把含义限定为某一块土地，脚注则明确保留“土地”的读法，以维持原文的张力。
- issue: πραεῖς的品格含义
  choice: 温柔的人
  alternative: 谦和的人
  rationale: 该词不是称赞无能或怯弱，而是指谦和、柔顺和受约束的力量。“温柔”适合正文，“谦和”作为词义补充保留其内涵。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“有福了”延续八福的宣告体；“承受大地”保留产业与应许的色彩。脚注标记紧随各自所解释的词语，并按正文出现顺序排列为[b]、[a]，与所给标记对应。
