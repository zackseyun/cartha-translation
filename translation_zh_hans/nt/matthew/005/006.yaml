id: MAT.5.6
reference: Matthew 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: zh_hans
  text: 饥渴慕义的人有福了[a]，因为他们必得饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”，可指正直、公正，或合乎上帝心意的事。
    reason: 保留 δικαιοσύνη 的语义广度及可行的替代译法。
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 沿用汉语《八福》庄重而自然的宣告用语，表达蒙福的客观处境，而不只指主观快乐。
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: 饥渴慕……的人
  rationale: “饥渴”保留原文以饥饿、口渴表达强烈而持续渴求的意象；“慕”使其与宾语的关系符合现代汉语表达。
- source_word: τὴν δικαιοσύνην
  choice: 义
  rationale: “义”简洁承载 δικαιοσύνη 所含的正直、公义以及合乎上帝旨意的宽广意义，不把原文限定为个人德行或社会正义之一。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后句是前述蒙福宣告的理由。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 以正常汉语主语表达原文代词；上下文已足以体现所指正是这群人，无须生硬译作“他们自己”。
- source_word: χορτασθήσονται
  choice: 必得饱足
  rationale: 保留吃喝至满足的意象，并以“得”自然表达原文将来被动形式；“必”体现将来应许的确定性。
theological_decisions:
- issue: δικαιοσύνη 的译法
  choice: 义
  alternative: 公义；正义；合乎上帝心意的事
  rationale: 原词在本节可涵盖个人正直、关系与社会层面的公正，以及在上帝面前正确的状态。“义”在正文中保留其神学广度，脚注说明其他可能侧重，避免擅自缩窄。
- issue: χορτασθήσονται 的被动施事者
  choice: 必得饱足
  alternative: 上帝必使他们饱足
  rationale: 原文使用被动语态而未明说施事者，虽可能是指上帝使之满足，正文不把这一隐含意义明文化，以保留原文表达。
translation_notes:
  register: 采用现代、庄重且为普通读者熟悉的《八福》句式。“饥渴慕义”凝练而具节奏感；“必得饱足”呼应饥渴意象，并保留原文未明说施事者的被动表达。
