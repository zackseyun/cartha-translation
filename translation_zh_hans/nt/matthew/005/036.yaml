id: MAT.5.36
reference: Matthew 5:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: zh_hans
  text: 也不可指着自己的头起誓，因为你不能使一根头发变白或变黑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: 也不可
  rationale: 承接上文一连串的禁止，以现代汉语自然表达并列的否定关系。
- source_word: ἐν τῇ κεφαλῇ σου
  choice: 指着自己的头
  rationale: ἐν 与“起誓”连用时标明誓言所凭借或援引的对象；“指着……起誓”是自然、庄重的汉语表达。
- source_word: ὀμόσῃς
  choice: 起誓
  rationale: 准确表达誓言行为，并保留 μήτε 加虚拟语气所构成的禁止语气。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出禁止如此起誓的理由，保留原文的因果关系。
- source_word: οὐ δύνασαι
  choice: 你不能
  rationale: 简洁自然地表达人的无能力，不弱化 δύνασαι 所强调的能力限制。
- source_word: μίαν τρίχα
  choice: 一根头发
  rationale: 保留数词“一”对最小单位的强调；汉语量词“根”符合通常用法。
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: 变白或变黑
  rationale: 保留原文两个基本颜色词的鲜明对照，不解释为“灰白”或“深色”。
- source_word: ποιῆσαι
  choice: 使……变
  rationale: 此处表示使某物成为某种状态；“使一根头发变……”准确且符合现代汉语习惯。
theological_decisions:
- issue: 禁止起誓的范围
  choice: 按本节具体措辞，直接禁止指着自己的头起誓，不把它扩写成对一切誓言的绝对教义判断。
  alternative: 将其解释为禁止所有场合的一切誓言，或仅仅谴责操纵性、规避性的起誓套语。
  rationale: 本节明确谈到以自己的头为凭据起誓，并以人的能力有限作为理由；译文应保留这一具体表述及其神学张力，不替正文解决更广泛的争论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“指着自己的头起誓”保留古代誓言表达的具体形象；“使一根头发变白或变黑”紧贴原文，并自然传达人对自身受造状态缺乏终极支配权。
