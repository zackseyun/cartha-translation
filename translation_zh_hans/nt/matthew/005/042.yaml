  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: zh_hans
  text: 凡向你求的，就给他；想向你借的，不要避开他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: 求的人
  rationale: 带冠词的现在分词作名词用，泛指向听者有所求的人；“求的人”简洁自然，也不擅自限定所求之物。
- source_word: δός
  choice: 要给他
  rationale: δίδωμι的不定过去时命令式，表达直接命令；汉语用“要给他”清楚传达命令语气，没有增添原文未明说的条件。
- source_word: θέλοντα
  choice: 想……的
  rationale: 带冠词的现在分词作名词用；“想”自然表达θέλω在此处的意愿含义。
- source_word: ἀπὸ σοῦ
  choice: 从你这里
  rationale: 按其来源义直译，表明借取的对象来自“你”。
- source_word: δανίσασθαι
  choice: 借东西
  rationale: 此中间语态不定式在语境中指借取；原文未限定为钱，因此用“借东西”避免不必要的窄化，并使汉语句意完整自然。
- source_word: μὴ ἀποστραφῇς
  choice: 不要转身避开他
  rationale: μή加不定过去时虚拟式构成禁令；“转身避开”保留ἀποστρέφω的动作意象，同时在现代汉语中表达不应回避求借者。
theological_decisions:
- issue: 耶稣伦理命令的范围与力度
  choice: 译为直接、普遍的命令，不在正文中添加资格条件
  alternative: 将命令限于某类配得帮助的人，或直接意译为“不要拒绝”
  rationale: 希腊文以两个直接命令陈述，并未在本节给请求者增设条件。译文保留其广泛性和伦理张力，也保留“转身避开”的形象，不用解释性译法预先限定实际应用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句用话题前置结构“向你求的人，要给他”，贴近原文焦点；后半句以“不要转身避开他”保留原文意象。未加脚注，因为正文能够自然表达关键语义，且本节没有必须另注的文本异读。
