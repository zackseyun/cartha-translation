source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: zh_hans
  text: 也不可指着地起誓，因为地是他的脚凳[b]；也不可指着耶路撒冷起誓[a]，因为耶路撒冷是大君王的城[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“向着耶路撒冷”，这里可能是起誓用语，意思是“指着耶路撒冷起誓”。
    reason: lexical_alternative
  - marker: b
    text: 参以赛亚书66:1：“地是我的脚凳。”
    reason: cross_reference
  - marker: c
    text: 参诗篇48:2，那里称耶路撒冷为“大君王的城”。
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: 也不可
  rationale: 承接上一节连续的禁令；现代汉语用“也不可”自然清楚。
- source_word: ἐν τῇ γῇ
  choice: 指着地起誓
  rationale: ἐν在此处的起誓语境中表示凭借某物起誓；“指着……起誓”既符合中文习惯，也保留誓言所凭对象。
- source_word: γῇ
  choice: 地
  rationale: 上下文将其与天和耶路撒冷并列，指大地而非某一特定地域。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达禁令的原因。
- source_word: ὑποπόδιόν
  choice: 脚凳
  rationale: 准确对应ὑποπόδιον，并保留相关经文的庄重意象。
- source_word: τῶν ποδῶν αὐτοῦ
  choice: 他的脚凳
  rationale: 汉语“他的脚凳”自然表达“他双脚的脚凳”；“他”仍由上下文指向上帝，不以排版额外明示。
- source_word: εἰς Ἱεροσόλυμα
  choice: 指着耶路撒冷起誓
  rationale: εἰς在这里按起誓习语表达为以耶路撒冷作誓言凭据；正文采用自然汉语，介词形式上的特殊之处收入脚注。
- source_word: πόλις
  choice: 城
  rationale: “城”简洁自然，并与诗篇相关措辞相称。
- source_word: τοῦ μεγάλου βασιλέως
  choice: 大君王的
  rationale: 保留属有关系及经文引语的庄重语体。
theological_decisions:
- issue: “他的脚凳”中“他”的所指
  choice: 保留普通代词“他”，由上下文表明所指是上帝
  alternative: 译成“上帝的脚凳”以明示所指
  rationale: 希腊文αὐτοῦ本身只是代词；不把解释直接写入正文，可保持原文表达，同时上下文和经文典故足以指向上帝。
- issue: “大君王”的身份
  choice: 保留“大君王”这一称号，不在正文中改写为“上帝”
  alternative: 译作“伟大的君王上帝”
  rationale: 原文使用称号并借用诗篇措辞；保留称号可避免消除典故本身的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“指着……起誓”保持两项禁令的平行结构；“脚凳”和“大君王的城”保留经文典故的语感。
