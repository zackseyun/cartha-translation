id: MAT.5.25
reference: Matthew 5:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: zh_hans
  text: 你要赶快对控告你的人表示善意[a]，趁你还和他在路上的时候，免得他把你交给审判官，审判官再把你交给差役，你就被投入监牢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按这里的法律语境，也可更通顺地译作：“赶快同控告你的人和解。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: 要……表示善意
  rationale: 保留“要处于善意相待的状态”这一核心词义，也体现现在时分词所传达的持续取向；不在正文中直接扩展为“和解”或“达成协议”。
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: 控告你的人
  rationale: 上下文出现审判官、差役和监牢，法律语境明确；此译法比宽泛的“对头”更清楚，同时避免采用可能暗示现代检控官身份的专门称谓。
- source_word: ταχὺ
  choice: 赶快
  rationale: 自然地表达命令中的紧迫感。
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: 趁你还和他在路上的时候
  rationale: 保留同行在路上的具体意象，不把原文未明说的目的地直接译成“法庭”。
- source_word: μήποτέ
  choice: 免得
  rationale: 准确表达警告和避免某种后果的语气，适合现代汉语。
- source_word: παραδῷ
  choice: 交给
  rationale: 在司法移交的语境中简洁自然，并保留从一方转交另一方的动作。
- source_word: κριτῇ / κριτὴς
  choice: 审判官
  rationale: 清楚表达司法职能，也较“法官”略具古代叙事语体而仍易懂。
- source_word: ὑπηρέτῃ
  choice: 差役
  rationale: 指奉命执行审判官命令的下属人员；比“执达员”等现代专门职称更少文化限定。
- source_word: εἰς φυλακὴν
  choice: 监牢
  rationale: 符合庄重的经文语体，并明确表达拘禁场所。
- source_word: βληθήσῃ
  choice: 被投入
  rationale: 保留 βάλλω 的力度和被动意义，比单纯“被关进”更接近原文意象。
theological_decisions:
- issue: 开头命令应按法律语境意译为达成和解，还是保留 εὐνοέω 所表达的善意取向
  choice: 正文译为“对控告你的人表示善意”
  alternative: “赶快同控告你的人和解”或“赶快同他达成协议”
  rationale: 法律语境确实使和解或庭外解决成为合理含义，但原词首先表达有善意、友好相待。正文保留其词义及潜在张力，脚注说明更符合语境的惯用理解，避免把推论写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。句式保留原文由警告推动的司法递交链条；“路上”按字面保留，不补出“去法庭”。正文中的脚注标记[a]与脚注完全对应。
