  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: zh_hans
  text: 人若因我辱骂你们、迫害你们，又捏造各种恶言攻击你们，你们就有福了。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂”或译“毁谤”。
    reason: lexical_alternative
  - marker: b
    text: “捏造各种恶言攻击你们”或译“虚假地说各种恶言攻击你们”。
    reason: lexical_alternative
  - marker: c
    text: “因我”或译“为我的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: 你们就有福了
  rationale: 保留八福宣告的固定表达和神学分量；“有福”既自然，又不把含义弱化为世俗意义上的幸运。因汉语条件句习惯，将这一宣告置于句末，并用“就”清楚连接条件与结果。
- source_word: ὅταν
  choice: 人若……
  rationale: 原文以虚拟式表达一般性、可发生的情形；“人若”在现代汉语中自然地传达这种条件关系，而不限定为某一次事件。
- source_word: ὀνειδίσωσιν
  choice: 辱骂你们
  rationale: 表达以言语侮辱、毁谤人的敌对行为，较“责备”更符合语境，也比生僻或过度书面的说法更易懂。
- source_word: διώξωσιν
  choice: 迫害你们
  rationale: 保留该词在本语境中因跟随耶稣而遭受敌意对待的广泛含义，不限于身体暴力、法律行动或社会排斥中的任何一种。
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: 说各种恶言诬蔑你们
  rationale: “各种恶言”自然传达 πᾶν πονηρόν 的广泛性；“诬蔑你们”体现 καθ’ ὑμῶν 所指针对人的恶意言论，并与后面的 ψευδόμενοι 合并为流畅汉语。
- source_word: ψευδόμενοι
  choice: 诬蔑
  rationale: 将分词所表达的“说谎、虚假地说”融入“诬蔑”，明确这些恶言并不属实，同时避免生硬的“说谎地说”。
- source_word: ἕνεκεν ἐμοῦ
  choice: 因我
  rationale: 直接表达遭受敌对行为的缘由，即与耶稣的关系；简洁、现代，并保留“为我的缘故”这一可能的目的或忠诚色彩于脚注中。
theological_decisions:
- issue: 敌对行为的性质
  choice: 译文并列保留辱骂、迫害和虚假恶言，涵盖因耶稣而遭受的多种敌对行为。
  alternative: 把“迫害”仅限于身体暴力，或把整节仅理解为毁谤。
  rationale: 原文三个并列动词所涵盖的范围较广，不宜缩减为某一种法律、身体或社会形式。
- issue: ἕνεκεν ἐμοῦ 所表达的关系
  choice: 译为“因我”，突出这些苦难是由于人与耶稣的关系而发生。
  alternative: 译为“为了我”或“为我的缘故”，较突出忠诚、委身或目的色彩。
  rationale: 原文可以自然表达缘由，也带有“为……缘故”的语感；正文采用现代汉语最直接的说法，脚注保留另一种表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为符合汉语表达，将原文句首的“你们有福了”移到条件分句之后；三个脚注标记均置于相关整句末尾。
