  naturalness: 句末置“你们就有福了”符合现代汉语条件句的自然语序。“捏造各种恶言攻击你们”能更明确、自然地表达虚假恶言，同时避免“说各种恶言诬蔑你们”中动词关系略显含混的问题。
  terminology: “有福”“迫害”“因我”均恰当，并保留八福及因耶稣而受敌对的庄重语体。“辱骂”适合ὀνειδίσωσιν；“捏造”明确ψευδόμενοι的虚假、编造含义，而不限定诬告的具体形式。
