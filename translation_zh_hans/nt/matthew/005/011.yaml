  rationale: 修订明确呈现ψευδόμενοι所表达的虚假、捏造性质，并保留πᾶν πονηρόν的广泛恶意言论、κατά所表示的针对性，以及三项并列的敌对行为。未缩窄“迫害”的范围，也未将ἕνεκεν ἐμοῦ限定为单一的因果或目的解释。
