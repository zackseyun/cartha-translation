id: MAT.5.16
reference: Matthew 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: zh_hans
  text: 照样，让你们的光照在人前，使他们看见你们的善行，把荣耀归给你们在诸天里的父。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们在天上的父”。希腊文“天”在这里是复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 同样
  rationale: 承接前文灯和光的比喻，表达“照样、以同一方式”的语篇联系。
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: 你们的光也要照
  rationale: 以自然的现代汉语传达第三人称单数命令式的劝令语气，同时保留“光”的单数集体意象。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人前
  rationale: ἄνθρωποι在此泛指人类或众人；“在人前”简洁自然，不限定为男性，也保留公开可见的含义。
- source_word: ὅπως ἴδωσιν
  choice: 使他们看见
  rationale: 明确表达ὅπως加虚拟式所具有的目的意味，并符合汉语句法。
- source_word: τὰ καλὰ ἔργα
  choice: 善行
  rationale: καλά在此指美好、可称许的行为；“善行”简洁庄重，比逐字译作“好的工作”更准确自然。
- source_word: δοξάσωσιν
  choice: 把荣耀归给
  rationale: 自然表达δοξάζω用于上帝时“尊崇、归荣耀”的含义，避免汉语中直接说“荣耀某人”可能产生的生硬感。
- source_word: τὸν πατέρα ὑμῶν
  choice: 你们……的父
  rationale: 保留马太福音重要的关系性称谓，并按现代汉语自然表达领属关系。
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: 那位在诸天之上的
  rationale: 保留希腊文οὐρανοῖς的复数形式；“诸天之上”在汉语中庄重且可理解。
theological_decisions:
- issue: ἀνθρώπων的泛指范围
  choice: 在人前
  alternative: 在众人面前；在人们面前
  rationale: 该词在语境中泛指人，并非只指男性；译文不额外引入性别限制。
- issue: οὐρανοῖς的复数形式
  choice: 在诸天之上
  alternative: 在天上
  rationale: 正文保留原文复数所呈现的表达，不将其无提示地化为传统单数；脚注说明更常见的汉语译法。
- issue: 善行与归荣耀的关系
  choice: 使他们看见你们的善行，就把荣耀归给……父
  alternative: 使他们看见你们的善行，并荣耀……父
  rationale: 保留原文所表达的目的关系：门徒的可见善行最终指向父，而非使门徒自己得荣耀；不进一步界定这一关系的系统神学含义。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“在人前”保留经文的凝练节奏；“善行”和“把荣耀归给”兼顾普通读者的可懂度与宗教语境的准确性。
