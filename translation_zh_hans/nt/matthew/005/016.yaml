  rationale: 将“在诸天之上”改为“在诸天里”，以准确反映ἐν τοῖς οὐρανοῖς，同时保留“诸天”的复数。将开头调整为“照样，让……”以自然表达οὕτως及第三人称命令式λαμψάτω；其余内容维持原有意思与庄重语体。
