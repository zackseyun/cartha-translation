base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: zh_hans
  text: 你们是世上的光。一座坐落在山上的城是无法隐藏的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“一座位于山上的城是无法隐藏的。”原文此处描写城所处的位置和状态。
    reason: κείμενη意为“位于、坐落”，强调城的所在状态，而非建造行为。
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 希腊文明确使用第二人称复数代词，并带有强调意味。现代汉语须明说“你们”；其直接、突出的语气已能体现原文重点，无须增译“你们自己”。
- source_word: τὸ φῶς
  choice: 光
  rationale: 汉语通常不以冠词对应希腊文定冠词；“是……光”自然保留了这一确定而直接的隐喻。
- source_word: τοῦ κόσμου
  choice: 世上的
  rationale: κόσμος在这里广义指人类所处的世界。“世上的光”自然对应属格关系，也避免增添目的性的“给世人的”。
- source_word: οὐ δύναται
  choice: 是无法……的
  rationale: 自然表达原文所指的不能或不可能，并与整句的判断语气相称。
- source_word: πόλις
  choice: 一座……城
  rationale: πόλις通常指城；量词“一座”符合现代汉语对城邑的表达。
- source_word: κρυβῆναι
  choice: 隐藏
  rationale: 被动不定式意为“被隐藏”。在“是无法隐藏的”这一汉语结构中，被动含义可由语境自然体现，无须生硬加入“被”。
- source_word: ἐπάνω ὄρους
  choice: 在山上
  rationale: ὄρος可指山或山岭。这里采用范围较宽且自然的“山”，不把地形限定为较低的“山冈”。
- source_word: κειμένη
  choice: 建在
  rationale: 该分词本义为“位于、坐落于、躺在”。对“城”而言，“建在”是自然的现代汉语表达，但比“坐落在”略具解释性，因此以脚注保留更贴近字面的译法。
theological_decisions:
- issue: 门徒被直接认同为世上的光
  choice: 你们是世上的光
  alternative: 你们是给世人的光
  rationale: 保留原文直接的身份隐喻及属格结构，不把它解释为目的或受益关系，也不加入额外的教义说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“世上的光”保留熟悉且自然的圣经表达；后半句以“一座建在山上的城”形成清晰可见的形象。脚注标记置于相关整句之后，并与脚注条目对应。
