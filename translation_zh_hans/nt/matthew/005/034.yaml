source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: zh_hans
  text: 但我告诉你们，根本不可起誓：不可指着天起誓，因为天是上帝的宝座；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: 但我告诉你们
  rationale: 保留与前文教导的转折和第一人称权威语气；现代汉语中“告诉你们”自然清楚。
- source_word: μὴ ὀμόσαι ὅλως
  choice: 根本不可起誓
  rationale: ὅλως在此加强全面否定；“根本不可”比单纯“不可”更明确地传达这种力度，而“起誓”准确对应ὀμόσαι。
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: 不可指着天起誓
  rationale: 希腊语ἐν用于起誓对象时，汉语惯用“指着……起誓”；补出“起誓”使句意完整自然。
- source_word: ὅτι
  choice: 因为
  rationale: 按其因果意义直译，说明为何不可指着天起誓。
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: 天是上帝的宝座
  rationale: 保持表语结构及所有关系；“上帝”是现代普通话中自然、庄重且广泛可懂的θεός译法。
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως所表达的禁令范围
  choice: 根本不可起誓
  alternative: 不可随意起誓／不可虚假起誓
  rationale: 原文直接给出全面措辞ὅλως，不把它缩限为仅禁止轻率或虚假的誓言；至于其与其他经文中誓言的关系，译文不作额外教义化解释。
- issue: 天与上帝宝座的关系
  choice: 天是上帝的宝座
  alternative: 天象征上帝的宝座
  rationale: 原文使用直接判断句，不加入“象征”等解释性限定，以保留耶稣论证的原有力度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“根本不可”传达全面禁令的强调；分号保留本节作为连续论述一部分的开放结构。
