  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: zh_hans
  text: 所以，你们要完全[a]，正如你们的天父是完全的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完整”“全备”或“成熟”。希腊语 τέλειος 除了“完全”，也可表示完整无缺或成熟。
    reason: 说明原词的语义范围，并保留其在本段伦理语境中的真实含混性。
lexical_decisions:
- source_word: Ἔσεσθε
  choice: 要……
  rationale: 这是 εἰμί 的将来时直陈式，在本段结语中具有命令、劝勉的语气。现代汉语用“要”能自然传达这一庄重要求，同时不把它误解为单纯预言。
- source_word: οὖν
  choice: 所以
  rationale: 表明本节是从前文关于爱仇敌的教导所得出的结论；“所以”在现代汉语中清楚、自然。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 原文明确使用第二人称复数代词并带有强调意味；译文保留“你们”，也明确这是对门徒群体所说的话。
- source_word: τέλειοι / τέλειός
  choice: 完全
  rationale: 同一词在本节重复两次，译文也用同一词保持对照和修辞力度。“完全”直接保留其强烈的伦理要求，同时脚注说明该词也可表达完整、全备或成熟。
- source_word: ὡς
  choice: 正如
  rationale: 引出门徒与天父之间的比较。“正如”比单用“像”更适合庄重语体，并清楚保留比较关系。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: 你们的天父
  rationale: “天父”是现代汉语中自然、凝练的表达，准确传达“你们那位属天的父”，并保留父与门徒之间的关系。
theological_decisions:
- issue: 伦理劝勉中 τέλειος 的含义
  choice: 正文译为“完全”，脚注保留“完整、全备、成熟”等语义可能。
  alternative: 可译为“完整”“全备”或“成熟”。
  rationale: 上下文聚焦于爱仇敌、不只爱自己人，因而该词包含爱不分对象、完整无缺的含义；但正文不应削弱原文以天父为标准的强烈要求，也不应擅自把它限定为某一系统神学意义上的“无罪完美”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”衔接前文；“你们要完全”保留劝勉力度；后半句重复“完全”，对应希腊原文的词语复现。脚注标记置于正文相关词之后。
