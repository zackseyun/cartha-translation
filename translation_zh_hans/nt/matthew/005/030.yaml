  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: zh_hans
  text: 如果你的右手使你跌倒[a]，就把它砍掉，扔掉。因为对你来说，失去一个肢体，胜过整个身体进入革赫拿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你犯罪”。希腊文直译为“使你跌倒”。
    reason: lexical_alternative
  - marker: b
    text: 或译“地狱”。“革赫拿”这一名称源自欣嫩子谷；此处用作与末世审判相关的术语。
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά σου χεὶρ
  choice: 你的右手
  rationale: 采用现代汉语中自然、明确的身体部位名称，并保留与上一节“右眼”相呼应的具体性。
- source_word: σκανδαλίζει σε
  choice: 使你跌倒
  rationale: 保留希腊文“使人绊跌”的隐喻；在本语境中指诱使人犯罪，另以脚注说明。
- source_word: ἔκκοψον αὐτὴν
  choice: 把它砍下来
  rationale: 直接表达果断切除手的命令，符合不定过去时命令式的强烈语气。
- source_word: βάλε ἀπὸ σοῦ
  choice: 扔掉
  rationale: 用自然简洁的现代汉语表达从自己身边除去并弃绝之意，无须机械补出“离开你”。
- source_word: συμφέρει γάρ σοι
  choice: 因为对你来说……胜过……
  rationale: 以汉语比较句自然表达“对你更有益、更好”，并保留严肃的利害对比。
- source_word: ἵνα ἀπόληται ἓν τῶν μελῶν σου
  choice: 失去一个肢体
  rationale: 在汉语中自然表达一个身体部分遭毁损、丧失的意思；“肢体”保留 μέλος 的身体意象。
- source_word: ὅλον τὸ σῶμά σου
  choice: 整个身体
  rationale: 准确保留“一个肢体”与“全身”之间的强烈对照。
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: 进入革赫拿
  rationale: ἀπέρχομαι 与 εἰς 表示进入某处；音译 γέεννα，以免正文直接把该历史及末世审判术语完全等同于后世汉语“地狱”的全部含义。
theological_decisions:
- issue: γέεννα 的译法
  choice: 革赫拿
  alternative: 地狱
  rationale: 音译保留希腊原词与欣嫩子谷背景，以及其在犹太末世审判语境中的张力；脚注提供读者较熟悉的“地狱”作为语境译法，而不在正文中把二者不加说明地完全等同。
- issue: σκανδαλίζει 的伦理含义
  choice: 使你跌倒
  alternative: 使你犯罪
  rationale: 正文保留原文的绊跌隐喻，不把它静默化约为解释性译法；脚注说明在本段语境中所指的是诱使人犯罪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句保持简短有力；比较句按汉语习惯重组，但保留“一个肢体”与“整个身体”的对照。正文保留“跌倒”的隐喻和“革赫拿”的源语术语，并用脚注帮助普通读者理解。
