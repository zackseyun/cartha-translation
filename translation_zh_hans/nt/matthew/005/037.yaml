  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: zh_hans
  text: 但你们的话应当是：“是，是；不，不。”超过这些的，是出于那恶者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出于恶。”希腊语 τοῦ πονηροῦ 既可指人格化的“那恶者”，也可指非人格化的“恶”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: 只要……就说
  rationale: 这是 εἰμί 的第三人称现在时命令式，在本句中表达对日常言语的要求；用“只要……就说”自然传达劝令语气，并与后面的肯定、否定回答顺畅衔接。
- source_word: ὁ λόγος ὑμῶν
  choice: 你们说话
  rationale: λόγος 在这里指人口中所说的话。译为“你们说话”比生硬的“你们的话语要成为”更符合现代汉语，同时保留其对言语真实性的关注。
- source_word: ναὶ ναί, οὒ οὔ
  choice: “是”就说“是”，“不是”就说“不是”
  rationale: 保留原文肯定词与否定词各自重复的结构和节奏；汉语以“就说”连接，清楚表达所说的话应当直接、确实。οὔ 在此为否定回答，译作口语自然的“不是”。
- source_word: τὸ δὲ περισσὸν τούτων
  choice: 超过这些的
  rationale: περισσόν 是名词化形容词，指超出上述直接肯定或否定的话；“超过这些的”简洁保留比较和超出之意。
- source_word: ἐκ
  choice: 出于
  rationale: ἐκ 表示来源；“出于”准确表达起源或根源，也符合庄重而自然的汉语经文语体。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的属格单数形式既可能指人格化的“恶者”，也可能泛指“恶”。马太福音中 ὁ πονηρός 常具人格含义，因此正文采用“那恶者”，同时以脚注保留非人格化理解。
theological_decisions:
- issue: τοῦ πονηροῦ 应理解为非人格化的“恶”，还是人格化的“那恶者”
  choice: 那恶者
  alternative: 恶
  rationale: 希腊语形式本身存在歧义；鉴于马太福音中 ὁ πονηρός 常可指人格化的邪恶者，正文采用“那恶者”。但不把语法上的另一可能排除，故在脚注中注明“恶”。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。正文保留原文“是……是；不是……不是”的重复和格言式节奏，并以“只要……就说”避免生硬直译。脚注明确保留 τοῦ πονηροῦ 的真实歧义。
