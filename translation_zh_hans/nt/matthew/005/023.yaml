id: MAT.5.23
reference: Matthew 5:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: zh_hans
  text: 所以，你若把礼物献在祭坛上，在那里想起你的弟兄[a]对你有所不满，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的弟兄或姊妹”；希腊文作阳性单数“你的弟兄”，在本语境中可能具有代表性。
    reason: 说明原文的性别形式及其可能的代表性用法。
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以，你若
  rationale: οὖν承接上文，表达推论；ἐὰν引出条件。译作“所以，你若”既保留逻辑联系，也符合现代汉语表达。
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: 把礼物献
  rationale: προσφέρω在祭祀语境中指献上，δῶρον本义为“礼物”，在此指献给上帝的礼物；“把礼物献”兼顾原文字面与祭坛场景。
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: 在祭坛上
  rationale: θυσιαστήριον明确指祭坛；ἐπί加宾格在此描绘把礼物呈献到祭坛上的动作，译文保留其空间意象。
- source_word: κἀκεῖ μνησθῇς
  choice: 在那里想起
  rationale: κἀκεῖ强调就在献礼物之处；μνησθῇς自然译为“想起”，不额外判定这记忆是自行浮现还是受提醒而来。
- source_word: ὁ ἀδελφός σου
  choice: 你的弟兄
  rationale: 原文是阳性单数“弟兄”。正文保留其形式，不将其直接改写为中性或复数；脚注说明在语境中可能具有代表性。
- source_word: ἔχει τι κατὰ σοῦ
  choice: 对你有所不满
  rationale: 该短语表示对某人有不利的事由、怨言或不满；“有所不满”自然表达这一含义，同时保留τι所带的不确定性，不具体说明缘由。
theological_decisions:
- issue: ἀδελφός这一性别明确的亲属称谓
  choice: 你的弟兄
  alternative: 你的弟兄或姊妹；另一位信徒
  rationale: 希腊文为阳性单数。正文按原文形式译为“弟兄”，避免把可能的广泛应用直接写进经文；脚注提示其在本语境中可能具有代表性。
- issue: 对方“有事反对你”的性质
  choice: 对你有所不满
  alternative: 对你有怨言；有事要责怪你
  rationale: 原文τι刻意未说明具体事情，也没有裁定不满是否正当；译文不添加过错、罪责或争端性质，以保留原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“礼物”“祭坛”“弟兄”保留经文的祭祀与亲属意象；句末用逗号，因为本节的条件结构在下一节继续。
