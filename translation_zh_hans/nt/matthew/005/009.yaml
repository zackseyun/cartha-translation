id: MAT.5.9
reference: Matthew 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: zh_hans
  text: 缔造和平的人有福了，因为他们必称为上帝的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的儿女”。希腊文直译为“上帝的儿子”，这里以阳性复数的亲属称谓作代表性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 采用汉语《八福》中自然庄重的表达，指蒙上帝赐福、处于可称羡的境况，不仅是主观上的快乐。
- source_word: εἰρηνοποιοί
  choice: 缔造和平的人
  rationale: 保留复合名词的主动施事含义，表达积极促成和平的人，而非仅仅性情温和或避免冲突的人。
- source_word: ὅτι
  choice: 因为
  rationale: 直接表达此处引出福分根据或缘由的因果关系。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 以主语代词自然承接前句；汉语无需添加“他们自己”，也能在此句式中保留指向前述那一类人的强调。
- source_word: υἱοὶ θεοῦ
  choice: 上帝的儿子
  rationale: 按原文保留阳性复数的儿子称谓及其亲属身份色彩；汉语复数由“他们”及谓语结构自然体现，并用脚注说明其代表性、包容性用法。
- source_word: κληθήσονται
  choice: 必称为
  rationale: 保留将来被动语义和宣告、命名的含义；不擅自限定称呼者，也不将其弱化为仅仅“被认为是”。
theological_decisions:
- issue: υἱοὶ θεοῦ 的性别化亲属称谓
  choice: 上帝的儿子
  alternative: 上帝的儿女
  rationale: 正文保留希腊文阳性复数“儿子”的形式及其可能承载的身份含义，同时以脚注交代这里可具有代表性、包容性的指称，不把女性排除在应许之外。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“缔造和平”比“使人和睦”更贴近主动促成和平的广义含义；“必称为”保持经文凝练的宣告语气。
