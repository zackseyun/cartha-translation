  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: zh_hans
  text: 你们听见从前对古人所说的话[a]：“不可杀人[b]；凡杀人的，必受审判。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对古时的人所说的话。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“杀人”通常指非法杀害，并非泛指一切致死行为；也可译作“谋杀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 你们听见
  rationale: 希腊语不定过去时在这一讲论公式中指听众已经领受的教导；中文用“你们听见”自然简洁，也与后文“有话……说”衔接。
- source_word: ἐρρέθη
  choice: 有话……说
  rationale: 保留被动表达的非特指性质，不擅自确定说话者；现代中文以“有话对……说”表达较自然。
- source_word: τοῖς ἀρχαίοις
  choice: 对古人
  rationale: 与格最直接理解为话语的领受者，即古时的人；“古人”简洁庄重。原文也可能在语用上被理解为自古传下来的话，故以脚注提示。
- source_word: Οὐ φονεύσεις
  choice: 不可杀人
  rationale: φονεύω指蓄意或非法夺取人命，并非泛指一切致死行为；“不可杀人”是中文诫命的自然表达，脚注说明其较准确的范围。
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: 凡杀人的
  rationale: 关系代词加ἄν及虚拟语气表达普遍而不限定的条件，中文“凡……的”准确自然。
- source_word: ἔνοχος ἔσται
  choice: 必受
  rationale: ἔνοχος表示须承担法律责任；结合“审判”，译作“必受审判”比逐字译为“将对审判负有责任”更符合现代汉语。
- source_word: τῇ κρίσει
  choice: 审判
  rationale: κρίσις具有司法裁断之意；不具体译成“法庭”，以免过早限定为某一审判机构。
theological_decisions:
- issue: 第六诫中φονεύω的范围
  choice: 正文采用传统而自然的“不可杀人”，并以脚注限定为蓄意或非法杀害
  alternative: 不可谋杀
  rationale: 原词并非泛指所有杀戮；但现代汉语“谋杀”容易被理解为现代刑法中预谋杀人的狭义类别。“杀人”配合脚注既保持诫命体裁，也避免把原文扩展为禁止一切致死行为。
- issue: τοῖς ἀρχαίοις所表达的关系
  choice: 对古人说
  alternative: 古人所说／自古以来所说
  rationale: 与格首先支持领受者意义，应在正文保留；同时承认该短语在解释传统中存在“古时传下”的理解，因此脚注提示而不在正文消除张力。
- issue: τῇ κρίσει的具体所指
  choice: 审判
  alternative: 法庭／定罪
  rationale: 原文可指司法审判或审判机关，但并未明确具体机构；采用较宽的“审判”保留其开放性。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“有话对古人说”保留原文被动式与领受者关系；分号体现命令及其司法后果构成同一段所引教导。
