base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: zh_hans
  text: “你们听见过这样的话[a]：‘不可奸淫。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用不指明说话者的被动式；也可译作：“你们听见有话说。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 你们听见
  rationale: 第二人称复数不定过去时在这一引述公式中指听众已经听过并领受的教导。现代汉语用“你们听见”自然简洁，也保留了希腊文的过去事件视角；“你们曾听见”亦可，但略显书面。
- source_word: ὅτι
  choice: 有话说
  rationale: ὅτι引出所听见的内容。与被动式ἐρρέθη合译为汉语惯用的“有话说”，比逐字译作“听见……被说”自然。
- source_word: ἐρρέθη
  choice: 有话说
  rationale: λέγω的不定过去时被动在这里是不指明说话者的表达；“有话说”保留这种非人称性质，不额外判定是谁说的或对谁说的。
- source_word: Οὐ μοιχεύσεις
  choice: 不可奸淫
  rationale: 未来时直陈语气在此表达禁令，并呼应十诫的措辞。“不可奸淫”是现代中文圣经语体中简洁、准确且辨识度高的诫命形式。
theological_decisions:
- issue: 与十诫引文的关系
  choice: 采用诫命式“不可奸淫”
  alternative: 不要通奸
  rationale: 耶稣引用的是十诫传统中的禁令。保留庄重简洁的诫命形式可显明互文联系，同时不加入额外解释。
- issue: ἐρρέθη是否明说受话对象
  choice: 不补出“对古人”或其他对象
  alternative: 有话对古人说
  rationale: 本节所给希腊文本只说“有话说”，没有明示间接受词；译文不从相近经文或传统表达中补入对象，以保留原文范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可奸淫”保留十诫式的法律命令语气；“有话说”自然呈现原文不指明说话者的被动结构。脚注标记已置于正文相应位置。
