  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: zh_hans
  text: 因为你们若爱那些爱你们的人，有什么赏赐呢？税吏不也这样做吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: 因为……若
  rationale: γάρ承接上文并说明理由，译作“因为”；ἐάν引出条件，译作“若”。这一语序既保留逻辑联系和条件意味，也符合现代汉语表达。
- source_word: ἀγαπήσητε
  choice: 爱
  rationale: ἐάν后的不定过去时虚拟语气构成一般条件句；汉语用“若……爱”自然表达，不额外突出时体。
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: 那些爱你们的人
  rationale: 该分词作名词使用，指以爱听众为特征的一群人；译文也保留了与前一个“爱”相同的词根呼应。
- source_word: τίνα μισθὸν ἔχετε
  choice: 有什么赏赐
  rationale: μισθός可指工钱、报酬或赏赐；本段伦理教导的语境中，“赏赐”自然保留所得回报的含义，同时不暗示机械式功德观。
- source_word: οὐχὶ καὶ
  choice: 不也……吗
  rationale: οὐχί引出预期肯定答案的反问，καί在此有强调兼附加作用；汉语“不也……吗”自然传达“连税吏也如此”的修辞力度。
- source_word: οἱ τελῶναι
  choice: 税吏
  rationale: τελῶναι指收取税款或关卡税的人；“税吏”是简洁、通行且符合福音书历史语境的中文称呼。
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: 这样做
  rationale: 字面为“做同样的事”，在承接前述行为时，现代汉语用“这样做”更自然，意义完整。
theological_decisions:
- issue: 耶稣伦理教导中μισθός的含义
  choice: 赏赐
  alternative: 工钱／报酬
  rationale: “赏赐”适合登山宝训中神所给予之回报的语境，又不把经文限定为雇佣关系或引入特定的功德教义。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“只”将原文条件句在语境中的互惠限制显明化，使中文自然；其含义来自“爱那些爱你们的人”与上文爱仇敌的对比，并未改变论证。反问句保持简洁有力。
