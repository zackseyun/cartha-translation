  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: zh_hans
  text: 因为我的轭是美好的，我的担子是轻省的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明人能在耶稣那里得安息的缘由。
- source_word: ζυγός
  choice: 轭
  rationale: 保留原文具体意象及其关于约束、教导与服从的含义。
- source_word: χρηστός
  choice: 合宜的
  rationale: 该词可表示良善、仁慈、适用或不磨人的；“合宜”既保留轭与负载相称、好承受的意象，也避免只译“容易”而削弱其良善意味。
- source_word: φορτίον
  choice: 担子
  rationale: 自然表达所负载之物，并与“轭”的比喻协调。
- source_word: ἐλαφρόν
  choice: 轻省的
  rationale: 准确传达与沉重相反、负担不重之意，符合现代汉语表达。
theological_decisions:
- issue: χρηστός是否译作“容易”或“仁慈”
  choice: 合宜的
  alternative: 容易的／仁慈的／柔和的
  rationale: 原词在轭的语境中兼有良善、适用、易承受的意味；“合宜”保留这种语义张力，不把本句解释为毫无要求，也不把形容轭的词完全人格化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“轭”这一核心圣经意象，并以“合宜”“轻省”形成自然、易懂的平行结构。
