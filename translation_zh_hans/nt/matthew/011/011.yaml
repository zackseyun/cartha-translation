id: MAT.11.11
reference: Matthew 11:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: zh_hans
  text: 我实在告诉你们：在妇人所生的人中[b]，从未兴起过比施洗约翰更大的人[a]；然而，天国里最小的[c]比他更大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兴起过”也可译作“被兴起”。这里最可能是指有人出现于历史舞台，而不是指复活。
    reason: lexical_alternative
  - marker: b
    text: “妇人所生的人”是闪语式说法，意为人类或世人。
    reason: cultural_note
  - marker: c
    text: “最小的”原文形式也可译作“较小的”或“较小者”；这里指在天国中地位或身份最小的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以自然、庄重的现代汉语表达这一郑重而权威的引言公式；“实在”传达ἀμὴν的确认语气。
- source_word: οὐκ ἐγήγερται
  choice: 从未兴起过
  rationale: 保留ἐγείρω在此处“兴起、出现于历史中”的表达，也尽量不把它误解为复活；完成时的结果性结合上下文译为“从未……过”。
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: 在妇人所生的人中
  rationale: 保留原文带有闪语色彩的说法，同时补出“人”，使现代汉语清楚自然。
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: 比施洗约翰更大的人
  rationale: 按比较结构直译“更大”，不擅自限定为品德、职分或救恩历史地位。
- source_word: τοῦ βαπτιστοῦ
  choice: 施洗约翰
  rationale: 这是现代中文圣经语境中清楚、通行的称谓，也直接反映其施洗者身份。
- source_word: ὁ δὲ μικρότερος
  choice: 然而，……最小的
  rationale: μικρότερος形式上是比较级，可指“较小的”；在此与整体范围“天国里”连用，汉语以“最小的”最自然，同时用脚注保留形式上的可能性。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 天国里
  rationale: “天国”是马太福音这一惯用表达在现代汉语中的准确、简洁译法。
- source_word: μείζων αὐτοῦ ἐστιν
  choice: 比他更大
  rationale: 直接保留悖论性的比较，不说明“大”具体指何种地位或特权。
theological_decisions:
- issue: 约翰的伟大与天国成员的比较
  choice: 直接译出“天国里最小的比他更大”，不解释其神学机制
  alternative: 解释为新约特权、救恩历史地位，或个人圣洁程度的比较
  rationale: 原文提出强烈而含蓄的对比，却没有在本节说明原因；译文应保留这种神学张力，不把某一种解释写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我实在告诉你们”保留耶稣郑重宣告的语气；正文维持“兴起”“更大”“最小”等原文意象和比较张力，并借脚注交代词义上的真实歧义。
