  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: zh_hans
  text: 人子来了，也吃也喝，人们就说：‘看哪，这人贪食好酒，是税吏和罪人的朋友！’智慧由她的作为证实是对的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧因她的作为得以辩明。”
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“儿女”，而不是“作为”，即：“智慧由她的儿女证实是对的。”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号在中文圣经传统中的通行译法，保留其闪族语背景及弥赛亚意涵，不作解释性扩写。
- source_word: ἐσθίων καὶ πίνων
  choice: 也吃也喝
  rationale: 按字面表达惯常行为，并自然呈现上下文中与约翰生活方式的对比，不夸张为宴饮。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留指示兼感叹的语气，适合公开指责的语境，也具有庄重而易懂的现代书面色彩。
- source_word: φάγος καὶ οἰνοπότης
  choice: 贪食好酒
  rationale: 两个词在此都是贬义指控；合译为自然的汉语并行表达，既传达贪吃，也传达嗜酒过度，而非中性地说饮酒。
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: 税吏和罪人的朋友
  rationale: 保留原文属格结构及这些社会、宗教标签的力度，不把“罪人”解释性弱化。
- source_word: ἐδικαιώθη
  choice: 证实是对的
  rationale: 此处意为被证明正确或得到辩明；采用现代汉语易懂表达，同时在脚注保留较形式对应的译法。
- source_word: ἡ σοφία
  choice: 智慧
  rationale: 不解释为耶稣、上帝的计划或其他特定对象；以“她”延续希腊文中的拟人表达。
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: 由她的作为
  rationale: “作为”准确涵盖ἔργα在此所指的行动或成果；“由”表达这些作为构成智慧得证为正确的根据。
theological_decisions:
- issue: 末句“智慧”的所指
  choice: 保留“智慧”的拟人表达，并用“她”指代，不明确等同于耶稣、上帝的智慧或救赎计划。
  alternative: 将“智慧”明确解释为耶稣本人或上帝的救赎计划。
  rationale: 原文采用拟人格言，其具体所指留有文学及神学张力，译文不应擅自限定。
- issue: 末句的文本形式
  choice: 正文依SBLGNT采用“作为”（ἔργων）。
  alternative: 采用部分抄本的“儿女”（τέκνων）。
  rationale: 指定的原文版本作ἔργων；“儿女”是重要异文，也与路加福音7:35的平行经文相合，故收入脚注。
- issue: ἐδικαιώθη在本句中的表达
  choice: 正文译作“证实是对的”。
  alternative: 译作“证明为义”或“得以辩明”。
  rationale: 正文选择现代读者容易理解的语义等值表达，避免“智慧被称义”在汉语中产生不必要的教义化误读；脚注保留形式更贴近的可能译法。
translation_notes:
  register: 采用现代、庄重且通俗的普通话书面语。“贪食好酒”保持指控的尖锐语气；末句保留“智慧—她”的拟人结构。连接词按καί直承上文，不额外加入“然而”等转折意味。
