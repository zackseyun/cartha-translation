id: MAT.11.14
reference: Matthew 11:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: zh_hans
  text: 如果你们愿意接受这话[a]，他就是那位将要来的以利亚。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“接受”的宾语，也可译作“如果你们愿意领受”。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的“他”指施洗约翰。耶稣把他认作应许中将要来的以利亚；参玛拉基书4:5和马太福音17:10–13。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ θέλετε δέξασθαι
  choice: 如果你们愿意接受这话
  rationale: θέλετε与不定式δέξασθαι表达“愿意接受”。原文未明说接受的宾语；中文需适度补出“这话”，指耶稣对约翰身份的说明，同时以脚注保留原文省略宾语的特点。句首καί在中文中不必机械译作“并且”，省略后更自然，条件关系仍清楚。
- source_word: αὐτός
  choice: 他
  rationale: 指施洗约翰。现代汉语用“他”最自然；原文可能带有一定强调，但不足以必须译成“他本人”。
- source_word: ἐστιν Ἠλίας
  choice: 就是……以利亚
  rationale: 保留原文直接的身份判断，不弱化为“像以利亚”或“担当以利亚的角色”；“就是”也自然传达αὐτός在此可能具有的强调。
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: 那位将要来的
  rationale: 定冠词结构将“将要来”作为对以利亚的限定，表达预期中的来临。“那位将要来的以利亚”既保持未来指向，也符合中文表达。
theological_decisions:
- issue: 施洗约翰与以利亚的认同
  choice: 直译为“他就是那位将要来的以利亚”
  alternative: 他担当以利亚的角色／他像以利亚
  rationale: 希腊文以αὐτός ἐστιν Ἠλίας直接作出认同，同时用“如果你们愿意接受”保留听者是否领受这一认同的张力。正文不自行解释这种认同的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接受这话”较“领受”更符合当代通用表达；脚注保留“领受”这一较贴近δέχομαι的译法。正文保留原文对约翰与以利亚的直接认同及其解释张力。
