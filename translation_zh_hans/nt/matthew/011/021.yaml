id: MAT.11.21
reference: Matthew 11:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: zh_hans
  text: 哥拉汛啊，你有祸了！伯赛大啊，你有祸了！因为在你们中间所行的那些大能之事[a]，若行在推罗和西顿，他们早已披麻蒙灰悔改了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神迹”；希腊文意为“大能之事”或“能力的作为”。
    reason: 词义存在可合理表达的替代译法；正文保留δυνάμεις与“能力”的联系，脚注说明通行译法。
lexical_decisions:
- source_word: Οὐαί σοι
  choice: 你有祸了
  rationale: 保留先知式宣告中哀叹与审判警告并存的语气；比单纯的“可叹”更能表达此处迫近的审判，同时符合现代汉语表达。
- source_word: Χοραζίν
  choice: 哥拉汛
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: Βηθσαϊδά
  choice: 伯赛大
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: αἱ δυνάμεις
  choice: 大能之事
  rationale: δυνάμεις在福音书语境中指彰显能力的作为；“大能之事”既保留其与“能力”的词义联系，也不将其过早收窄为现代意义下的“神迹”。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 复数ὑμῖν指这些城中的居民；译作“在你们中间”表明这些作为发生在他们当中，而不是发生在他们内心。
- source_word: πάλαι ἂν ... μετενόησαν
  choice: 他们早已……悔改了
  rationale: “早已”表达πάλαι的时间意味，“早已……了”配合反事实条件自然呈现ἄν与不定过去时所表达的假设结果；“悔改”准确且自然地表达μετανοέω在此处的含义。
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: 披麻蒙灰
  rationale: 采用自然凝练的中文惯用表达，保留以麻衣和灰表示哀恸、谦卑与悔改的文化图像。
theological_decisions:
- issue: 耶稣将哥拉汛、伯赛大与推罗、西顿作比较的性质
  choice: 按经文呈现为真实的反事实比较，突显亲见大能作为却不悔改者所负的更大责任。
  alternative: 仅视为修辞夸张，不涉及真实的责任与审判比较。
  rationale: 原文以明确的反事实条件句加强对两城的祸患宣告。译文保留这一比较及其张力，不另加有关神知、预定或审判机制的教义结论。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。以“你有祸了”传达直接的先知式警告，以“披麻蒙灰”保留文化意象并保持朗读流畅。反事实结构调整为符合汉语习惯的“若……，早已……了”，不削弱原文的假设性质。
