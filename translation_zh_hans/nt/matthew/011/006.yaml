base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: zh_hans
  text: 凡不因我而跌倒的，就有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡不以我为冒犯的，就有福了”，或“凡不因我而失去信心的，就有福了”。
    reason: 说明σκανδαλισθῇ ἐν ἐμοί也可指因耶稣而感到冒犯，或因此在信心上动摇；这些译法不把含义限缩为单纯情绪，也不预设必然的弃绝。
lexical_decisions:
- source_word: καί
  choice: 就
  rationale: 结合“凡……的”构成自然的汉语条件—结论句式，并承接上文；不机械译作“并且”，以免汉语生硬。
- source_word: μακάριος
  choice: 有福
  rationale: “有福”保留耶稣宣告中宗教性和恩福性的分量，也与福音书中同类句式一致；“快乐”过于侧重主观感受，“幸运”则较为世俗。
- source_word: ὃς ἐὰν μὴ
  choice: 凡不……的
  rationale: 表达原文所指的任何一个符合此条件的人，同时在现代汉语中简洁自然。
- source_word: σκανδαλισθῇ
  choice: 跌倒
  rationale: 保留原词的绊倒隐喻及其可能包含的动摇、拒绝或离弃之意，不把含义缩减为单纯情绪上的“反感”。汉语不强行标出希腊语被动形式，以免译成“被绊倒”而显得生硬。
- source_word: ἐν ἐμοί
  choice: 因我而
  rationale: 表明耶稣是导致此人跌倒或反感的缘由或契机；较直译的“在我里面”在此不合现代汉语习惯。
theological_decisions:
- issue: σκανδαλισθῇ ἐν ἐμοί所表达的“跌倒”与“厌弃/反感”之间的张力
  choice: 正文译作“因我而跌倒”，保留绊倒隐喻及信心动摇或离弃的较强含义。
  alternative: “因我而反感”或“厌弃我”
  rationale: 原文不只描述情绪上的冒犯感，也可能指人因耶稣的身份、言行或施行工作的方式而成为信仰上的绊脚石。正文保留较宽且较强的隐喻，脚注列出语境上可行的解释性译法，不替读者消解其中张力。
translation_notes:
  register: 采用现代、庄重而易懂的福音书宣告语体。“凡……的，就……”自然表达普遍条件；“有福”保留传统圣经语汇的宗教分量，同时普通读者容易理解。脚注标记[a]已在正文中对应出现。
