  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: zh_hans
  text: 他们说：“我们为你们吹笛，你们却不跳舞；我们唱哀歌，你们却不捶胸哀悼[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捶胸哀悼”直译为“捶打自己”，指当时哀丧时常见的悲痛动作。
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: 他们说
  rationale: 希腊语用现在时生动引出比喻中孩子们的话；汉语动词不标时态，“他们说”自然保留这一叙述效果。
- source_word: Ηὐλήσαμεν
  choice: 我们为你们吹笛
  rationale: αὐλέω特指吹奏笛或管乐器；“吹笛”简明自然，也保留了乐器的具体含义。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 此处指面向对方演奏，“为你们”比“向你们”更符合现代汉语表达。
- source_word: ὠρχήσασθε
  choice: 你们却不跳舞
  rationale: 中间语态在此无需译出反身含义；“跳舞”准确表达对喜庆乐声应有的响应。
- source_word: ἐθρηνήσαμεν
  choice: 我们唱哀歌
  rationale: θρηνέω指发出哀歌或哀哭，常见于丧葬情境；“唱哀歌”既与上句的演奏形成平行，也保留其表演性。
- source_word: ἐκόψασθε
  choice: 你们却不捶胸哀悼
  rationale: κόπτω的中间语态在此指哀悼时击打自己身体的动作；“捶胸哀悼”同时传达具体姿态和其悲悼含义。
theological_decisions: []
