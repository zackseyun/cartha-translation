  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: zh_hans
  text: 因为众先知和律法都预言到约翰为止[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到约翰”或“直到约翰的时代”。这句话可能把约翰看作先知见证的顶点，也可能把他看作标志其转折的界线。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: 众
  rationale: 与“先知”连用，概括全体先知；“众先知”在现代中文中简洁、自然。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本句为上文提供解释或根据；译作“因为”保留其连接和说明作用。
- source_word: οἱ προφῆται
  choice: 先知
  rationale: 这是指奉上帝之名传言的人，采用通行且准确的中文译法。
- source_word: ὁ νόμος
  choice: 律法书
  rationale: 此处与“众先知”并列，指以色列圣经中的律法部分，而非泛指法规；“律法书”能在不依赖英文大小写的情况下显示其经卷所指。
- source_word: ἕως Ἰωάννου
  choice: 直到约翰
  rationale: ἕως加属格表示时间界限；“直到约翰”简洁保留了约翰究竟属于这一先知见证的顶点，还是标志其转折界线的歧义。
- source_word: ἐπροφήτευσαν
  choice: 都说了预言
  rationale: 保留主动陈述和预言含义，并让“众先知和律法书”共同作主语，从而保存律法书也作先知性见证的拟人表达。
theological_decisions:
- issue: ὁ νόμος应泛指律法，还是指圣经中的律法部分
  choice: 律法书
  alternative: 律法
  rationale: 上下文把它与“众先知”并列，所指是以色列圣经中公认的律法经卷，而非一般法律原则；“律法书”可清楚传达这一经卷性含义。
- issue: ἕως Ἰωάννου是否把约翰包括在先知时代之内
  choice: 直到约翰
  alternative: 到约翰为止；直到约翰的时代
  rationale: 希腊语本身未完全确定约翰是先知见证的 culmination，还是一个时代转折的界标；正文不强行消除这一神学张力，脚注说明两种可能。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“众先知”保持经文语体的凝练；以“律法书”明确经卷所指；保留“直到约翰”的简短边界表达及其真实歧义。
