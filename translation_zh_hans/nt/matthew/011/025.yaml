source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: zh_hans
  text: 那时，耶稣回答说：“父啊，天地的主，我称颂你[a]，因为你向有智慧、通达的人隐藏了这些事，却把这些事启示给小孩子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我感谢你”。这里的希腊词也可表示公开承认或称颂。
    reason: lexical_alternative
  - marker: b
    text: 也可译“婴孩”。这里的“小孩子”可能带有比喻含义，指谦卑或像孩子一样乐于领受的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: 那时
  rationale: 以自然简洁的现代汉语保留叙事中的时间衔接，不把时间范围说得过于具体。
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν
  choice: 耶稣回应说
  rationale: 保留“回答/回应而说”的源文表达；即使上文没有直接问句，此短语也可表示针对当时情势作出回应。
- source_word: Ἐξομολογοῦμαί σοι
  choice: 我颂赞你
  rationale: 此处动词表示公开承认并带有赞美或感谢之意；“颂赞”符合向父发出的庄重称颂，同时脚注保留“感谢”的可能。
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 父啊，天地的主
  rationale: 保留连续呼语及父作为天地之主的权柄；按现代汉语语序置于主要陈述之前。
- source_word: ὅτι
  choice: 因为
  rationale: 将其理解为引出颂赞的缘由，同时承认“即/就是”作为内容引导词在语法上也有可能。
- source_word: ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν
  choice: 你把这些事向有智慧、通达的人隐藏起来
  rationale: 保留神为主动者、“这些事”的开放指向，以及 σοφῶν 与 συνετῶν 之间“智慧”和“领悟、通达”的并列层次。
- source_word: ἀπεκάλυψας αὐτὰ
  choice: 却向……显明了
  rationale: “显明”自然表达揭开、使人得知之意；“却”清楚呈现隐藏与启示之间的对照。
- source_word: νηπίοις
  choice: 婴孩
  rationale: 保留该词所指婴幼儿的鲜明形象，也不把其在语境中可能具有的比喻义直接改写为“谦卑的人”等解释性措辞。
theological_decisions:
- issue: 神在隐藏和显明中的主动作用
  choice: 直译为“你……隐藏起来，却……显明了”
  alternative: 弱化为“你容许这些事仍然隐藏”
  rationale: 希腊文以父为两个主动动词的主语。译文保留这一直接归因及其神学张力，不加入预定、任凭或审判性刚硬等超出本节的解释。
- issue: νηπίοις 的字面形象与比喻意义
  choice: 正文采用“婴孩”
  alternative: 解释为“谦卑的人”或采用较宽泛的“小孩子”
  rationale: “婴孩”贴近源词，并让读者看见与“有智慧、通达的人”的反差；脚注提示其可能比喻谦卑、像孩子一样领受的人，而不在正文中锁定解释。
- issue: Ἐξομολογοῦμαί σοι 的赞美与感谢含义
  choice: 正文采用“我颂赞你”
  alternative: “我感谢你”或“我向你承认”
  rationale: 语境具有称颂神作为的意味；“颂赞”避免现代汉语中“承认”可能产生的负面或认罪联想，同时由脚注保留感谢和公开承认的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“父啊，天地的主”保留祷告式呼语，以“颂赞”“显明”维持经文语体但避免生僻古奥；不把“婴孩”直接释作某一神学群体。
