  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: zh_hans
  text: 可是，你们出去是要看什么？一个穿着华美的衣服的人吗？看哪，那些穿华美的衣服的人是在君王的宫殿里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在君王的房屋里”。“华美的衣服”原文直译为“柔软的衣服”，指精致、奢华的服饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上一节的反问并形成转折；“可是”自然保留了对比语气。
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: 你们出去要看什么
  rationale: 按目的结构表达“出去看什么”，保留 τί 所引出的反问，现代汉语也流畅。
- source_word: ἄνθρωπον
  choice: 一个……的人
  rationale: 这里具体指一个人，并在上下文中指向施洗约翰；汉语以“一个……的人”自然承接后面的穿着描写。
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: 穿着柔软衣服
  rationale: μαλακοῖς 字面为“柔软的东西／衣物”，语境含精细、奢华服饰之意；正文保留具体意象，不把含义过度解释为“华服”。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意和强调的修辞力量；“看哪”庄重、简明，也为现代读者所能理解。
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: 那些穿柔软衣服的人
  rationale: φοροῦντες 可表示惯常穿着；重复“柔软衣服”维持原文两处 μαλακός 的词语呼应。
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: 住在王宫里
  rationale: 原文直译为“在君王的房屋里”；汉语“住在王宫里”自然传达其所在与生活环境，同时不改变复数君王居所的概括意义。
theological_decisions: []
