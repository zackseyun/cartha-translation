  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: zh_hans
  text: 可是，自施洗约翰的日子以来，直到现在，天国遭受暴力，强暴的人强夺它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天国正强力地推进，强力之人夺取它。”译作“遭受暴力”的希腊语动词，也可按中间义理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: 可是，从
  rationale: ἀπό表示时间起点“从”，δέ是较弱的连接或转折词；译作“可是，从”既承接上文，也不过分强化对立。
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: 施洗约翰的日子
  rationale: 保留原文“日子”的表达，同时采用现代汉语中清楚、庄重的“施洗约翰”。
- source_word: ἕως ἄρτι
  choice: 直到现在
  rationale: 自然表达从约翰的日子延续到说话当下的时间跨度。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音特色用语在现代中文圣经语境中的自然、准确表达，兼具“国度”与“掌权”的内涵而不在正文中扩译。
- source_word: βιάζεται
  choice: 遭受暴力
  rationale: 按被动意义翻译，与下句强暴之人的行动自然衔接；原词也可能取中间或不及物意义，因此另以脚注保留。
- source_word: βιασταὶ
  choice: 强暴的人
  rationale: 表达以强力或暴力行事者；“人”在现代汉语中自然涵盖原文阳性复数所指的一群人，不额外限定为成年男性。
- source_word: ἁρπάζουσιν αὐτήν
  choice: 强夺它
  rationale: ἁρπάζω含强行夺取、攫取之意；“强夺”简洁地保留暴力色彩，并以“它”回指天国。
theological_decisions:
- issue: βιάζεται描述天国时的语态和意义
  choice: 正文采用被动义：“天国遭受暴力”
  alternative: 中间或不及物义：“天国正强有力地推进，强有力的人把握住它”
  rationale: 希腊文在此确有语态和意义上的争议。被动读法与紧接着的“强暴的人强夺它”衔接较直接；中间或不及物读法也有词汇和解释依据，故不将其排除，而在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文尽量保持原文紧凑结构和重复的暴力意象；脚注保留关键希腊语歧义，不在正文中消解长期存在的解释张力。
