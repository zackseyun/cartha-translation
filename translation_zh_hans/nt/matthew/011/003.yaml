id: MAT.11.3
reference: Matthew 11:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: zh_hans
  text: 对他说：“你是那将要来的那一位[a]吗？还是我们该期待另一位？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那将要来的人”或“那要来的”。这个希腊语表达在此语境中可以用作弥赛亚的称号。
    reason: 词义替代译法，并说明该实体化分词可能具有的称号功能。
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 直译为“对他说”，自然承接上文；希腊文本此处没有另一个表示“并且”的词，因此不另加“又”。
- source_word: Σὺ εἶ
  choice: 你就是……吗
  rationale: 显明表达主语代词 σύ 所带的强调，同时符合现代汉语疑问句的自然语序。
- source_word: ὁ ἐρχόμενος
  choice: 那位要来者
  rationale: 保留带冠词的现在分词所具有的实体化和称号意味；“要来者”既能指将要来的人，也能在语境中承载弥赛亚期待，而不直接增译为“弥赛亚”。
- source_word: ἢ
  choice: 还是
  rationale: 在选择疑问句中自然表达两个选项之间的转折。
- source_word: ἕτερον
  choice: 另一位
  rationale: 表达“另一个、不同的一个”；用量词“位”表明所指为人，同时不把含义扩展为更具体的身份。
- source_word: προσδοκῶμεν
  choice: 我们该等候
  rationale: 此处虽形式上是现在时直陈语气，在选择疑问中却有商议意味；“该等候”自然传达“我们是否应继续期待”的意思，并与那位将来者的语境相合。
theological_decisions:
- issue: ὁ ἐρχόμενος 的弥赛亚称号意味
  choice: 译作“那位要来者”
  alternative: “那位将要来的人”或“那位要来的”
  rationale: 冠词、分词形式及上下文支持称号式理解，但原文并未直接使用“弥赛亚”一词。译文保留其称号意味和潜在的弥赛亚指向，也保留字面上“将要来的人”的开放性。
- issue: 约翰的问题是否预设另一位同类人物
  choice: 译作“另一位”
  alternative: “别人”或“另一人”
  rationale: ἕτερον 可表示另一个或不同的一个；译文不进一步判定约翰是在怀疑、求证，还是区分不同角色。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那位要来者”略带称号色彩，适合本节的期待语境；问句分为两句，以清楚呈现选择疑问。
