base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: zh_hans
  text: 这些人离去的时候，耶稣开始对众人谈论约翰，说：“你们到旷野去，是要看什么[a]呢？是一根被风吹动的芦苇吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是要观看什么？”
    reason: lexical_alternative
  - marker: b
    text: 这个反问期待否定的回答。被风吹动的芦苇可能使人联想到摇摆不定；耶稣借此引导众人思考他们所见的约翰是怎样的人。
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: 这些人离去的时候
  rationale: 以独立属格结构表示与主句同时发生的动作。“这些人”保留原文的指示表达；按上文所指，他们是约翰的门徒，但正文不把上下文说明直接替换进原文。
- source_word: ἤρξατο ὁ Ἰησοῦς λέγειν
  choice: 耶稣开始……说
  rationale: 保留ἄρχομαι加不定式所表达的“开始”之意，并以现代汉语自然引出后面的直接引语。
- source_word: τοῖς ὄχλοις περὶ Ἰωάννου
  choice: 对众人谈起约翰
  rationale: περί加属格表示谈论的主题；“谈起约翰”比生硬的“关于约翰说”更符合现代汉语。ὄχλοις虽为复数，汉语集合名词“众人”已自然表达多人群体。
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: 你们出去到旷野，是要看什么？
  rationale: τί按“什么”处理，不改译为“为什么”；ἐξέρχομαι的“出去”和εἰς τὴν ἔρημον的目的地都得到表达。θεάομαι在此指有意去看、观看，正文用自然的“看”，脚注保留“观看”的替代译法。
- source_word: κάλαμον
  choice: 一根……芦苇
  rationale: 采用κάλαμος在此处的常用义“芦苇”，并保留单数的具体形象。
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: 被风吹得摇动的
  rationale: 保留被动关系及分词所描绘的持续动态；“吹得摇动”在现代汉语中比直译“被风摇动”更自然。
theological_decisions:
- issue: Τούτων（“这些人”）的具体所指
  choice: 正文译作“这些人”，由上下文确定为约翰的门徒
  alternative: 直接译作“约翰的门徒”或较含混的“他们”
  rationale: “这些人”既忠实保留原文的指示性，也不在正文中加入原句未明说的身份；上文足以说明其所指。
- issue: 风中芦苇这一反问的含义
  choice: 正文保留形象和反问，不直接释义；脚注谨慎说明其可能暗示摇摆不定，并指出问句期待否定回答
  alternative: 在正文中直接译成约翰并非“摇摆不定的人”
  rationale: 原文只给出比喻性问题，直接释义会消除修辞张力；脚注可帮助现代读者理解，同时以“可能”避免把隐含意义绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出去到旷野”略保留原文的移动结构；连续两个问句维持原文的反问节奏。脚注标记均放在正文相应位置。
