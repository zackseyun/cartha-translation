revisions:
- from: 于是，耶稣开始责备那些他行了最多大能之事[a]的城，因为城里的人并没有悔改。
  to: 那时，耶稣开始斥责那些城，因为他大部分大能作为[a]发生在那里，那里的人却没有悔改。
  rationale: 修订保留原文的时间推进、开始性动作、对城市的斥责及其理由；以“发生在”对应ἐγένοντο，避免无必要地把原文事件性表达改为明确主动句；以“那里的人”自然呈现城市指居民的转喻。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:56:40Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的ἐγένοντο（“发生／出现”）并未明确说耶稣是动作施事者；草稿的“他行了”虽符合上下文，却比原文略为具体化。将其译为“他大部分大能作为发生在……”，可保留原文事件发生的表达，同时仍清楚表明这些作为属于耶稣。πλεῖσται指“大部分／绝大多数”，不宜用汉语中搭配不够自然的“最多大能之事”。
  naturalness: “那些他行了最多大能之事的城”结构偏重，且“最多大能之事”不够地道。改为“耶稣开始斥责那些城，因为他大部分大能作为发生在那里，那里的人却没有悔改”更符合现代标准汉语，也清晰表达“城”转喻其居民。
  terminology: “悔改”准确对应μετενόησαν，应保留。“大能作为”比“大能之事”更自然，且可保留δυνάμεις所含的能力／权能意味。ὀνειδίζειν带有斥责、责难之意，“斥责”较“责备”更能体现其力度，而未增添正式审判的含义。
  issues:
  - severity: medium
    issue: “他行了”将ἐγένοντο明确处理为耶稣主动施行。
    rationale: 原文采用“发生／出现”的表述，虽由αὐτοῦ表明这些大能作为属于耶稣，却没有在此明确使用主动动词。可用“发生在”保留这一表达。
  - severity: low
    issue: “最多大能之事”不符合自然汉语搭配。
    rationale: πλεῖσται在这里是“大部分／绝大多数”，而非单纯数量意义的“最多”；“大部分大能作为”更准确自然。
  - severity: low
    issue: 脚注替代译法“显能的事”生硬。
    rationale: “能力的作为”是较自然且能反映δυνάμεις语义范围的替代译法。
  revised_text: 那时，耶稣开始斥责那些城，因为他大部分大能作为[a]发生在那里，那里的人却没有悔改。
