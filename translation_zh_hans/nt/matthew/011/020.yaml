  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: zh_hans
  text: 那时，耶稣开始斥责那些城，因为他大部分大能作为[a]发生在那里，那里的人却没有悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能作为”或译“神迹”或“能力的作为”（希腊文：δυνάμεις）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 作为叙事中的时间与承接标记，“于是”自然地引出下一步行动。
- source_word: ἤρξατο ὀνειδίζειν
  choice: 开始责备
  rationale: 保留ἤρξατο的起始意味；“责备”传达ὀνειδίζω的谴责、斥责之意，又不夸大为正式定罪。
- source_word: τὰς πόλεις ἐν αἷς
  choice: 那些……的城
  rationale: 以自然的现代汉语关系结构表达“在其中的那些城”，避免生硬直译。
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: 他行了最多大能之事
  rationale: “行了”符合汉语描述耶稣作为相关行动主体的习惯；“最多”保留πλεῖσται的最高级意义；“大能之事”保留δυνάμεις对能力、权能的强调。
- source_word: ὅτι οὐ μετενόησαν
  choice: 因为城里的人并没有悔改
  rationale: “因为”清楚表达原因；“悔改”准确承载μετανοέω在此处的道德与属灵分量。补出“城里的人”，避免汉语中将城本身拟人化为悔改主体，同时不改变所指。
theological_decisions:
- issue: 神迹语境中δυνάμεις的译法
  choice: 大能之事
  alternative: 神迹；显能的事
  rationale: “大能之事”既指耶稣所行的超常作为，也保留原词对能力、权能的突出，不把其范围无提示地收窄为现代分类词“神迹”。
- issue: μετενόησαν的译法
  choice: 悔改
  alternative: 回转；改变心意
  rationale: 本节所说的是人面对耶稣大能作为却未作出应有的道德和属灵回应；“悔改”在现代汉语中准确、庄重，也不额外加入宗派解释。
- issue: 城市作为悔改主体的转喻
  choice: 城里的人并没有悔改
  alternative: 那些城并没有悔改
  rationale: 希腊文以“城”转喻居民。汉语明确译出“城里的人”，使实际主体清楚，同时保存原意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”衔接上文；“责备”保持语气力度；关系从句按自然汉语调整。脚注标记已在正文“大能之事”后标出。
