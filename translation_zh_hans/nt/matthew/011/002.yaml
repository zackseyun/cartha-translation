  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: zh_hans
  text: 约翰在监狱里听见弥赛亚[a]所做的事，就派他的门徒前去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: 保留Χριστός作为称号的传统音译替代译法。
lexical_decisions:
- source_word: δὲ
  choice: 就（融入句间衔接）
  rationale: δὲ在这里推动叙事，不必机械译成“现在”或“但”；中文以“就”衔接听见与差遣两个动作，自然表达叙事进展。
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词表示先于主要动词发生的动作；用“听见……就……”自然呈现其时间关系。
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: 在监狱里
  rationale: 准确表达约翰身处囚禁之地，符合现代汉语习惯。
- source_word: τὰ ἔργα
  choice: 所做的事
  rationale: ἔργα在此泛指弥赛亚的作为，包括大能的事和服事行动；“所做的事”比“工作”更自然，也不把范围限于神迹。
- source_word: τοῦ χριστοῦ
  choice: 弥赛亚
  rationale: χριστός在此作为称号，意为受膏者；“弥赛亚”保留其犹太语境和称号功能。
- source_word: πέμψας
  choice: 托……去问
  rationale: πέμπω本义为差遣；本节句法延续至下一节，所差遣的门徒承担问话任务，因此中文补出“去问”以形成自然且完整的跨节表达。
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: 托他的门徒
  rationale: διά加属格表示中介或代理；“托他的门徒”自然表达门徒作为传话者。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里有定冠词且作为称号使用；译作“弥赛亚”直接传达“受膏者”的称号含义，同时在脚注保留传统译法“基督”。
- issue: 本节末尾与下一节的句法衔接
  choice: 译作“去问他：”，以冒号连接下一节
  alternative: 译作“差遣他的门徒去”，在本节末悬置
  rationale: 希腊文πέμψας διὰ τῶν μαθητῶν αὐτοῦ的内容由下一节λέγων引出。中文用“去问他：”既忠实呈现差遣目的，也清楚表明话语将在下一节出现，避免本节成为不自然的残句。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“在监狱里”直白易懂；“所做的事”涵盖广泛，不把ἔργα过度限定为神迹。冒号表明本句在下一节继续。
