source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: zh_hans
  text: 我父已把一切交给我；除了父，没有人认识子；除了子和子愿意向其启示父的人以外，也没有人认识父。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: 一切
  rationale: 中性复数具有广泛、概括性的范围；“一切”保留其全面性，又不擅自限定所指领域。
- source_word: παρεδόθη
  choice: 交给了
  rationale: παραδίδωμι 的不定过去时被动式，表示父已经完成交付；“交给了”是现代汉语中直接自然的表达，不额外加入“托付”所可能带出的管理意味。
- source_word: ὑπὸ τοῦ πατρός μου
  choice: 由我的父
  rationale: 既保留施事关系，也保留耶稣所说“我的父”这一特定关系称谓；用“父”而非“父亲”，与下文“父／子”的对称称谓一致。
- source_word: ἐπιγινώσκει
  choice: 认识
  rationale: ἐπιγινώσκω 在此表示对位格的认识；其前缀是否必须表达强化含义并不确定，因此正文采用不夸大的“认识”，在脚注列出“充分认识／真正认识”的可能译法。
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: 子／父
  rationale: 二者在经文中形成彼此对应的独特关系称谓；简体中文无需借助大小写，即可由定指语境辨明。
- source_word: εἰ μὴ
  choice: 除了
  rationale: 在否定句中表达排除和例外，“除了……没有人……”自然地保留原文结构。
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: 子愿意把父启示给的人
  rationale: “愿意”表达 βούλομαι 的真实意愿和主动性，同时比“意欲”自然；“把父”由紧邻上下文补明为 ἀποκαλύψαι 隐含的宾语。
- source_word: ἀποκαλύψαι
  choice: 启示
  rationale: “启示”准确表达揭开、显明原先不能由人自行得知之事的含义，并符合庄重而通俗的现代汉语经文语域。
theological_decisions:
- issue: 父与子彼此认识时 ἐπιγινώσκω 的力度
  choice: 正文译作“认识”
  alternative: “充分认识”或“真正认识”
  rationale: 复合动词在此未必明确要求强化翻译；正文避免把“完全”这一解释直接写入经文，同时以脚注保留深入或充分认识的词义可能。排他性的“没有人……除了……”仍完整保留父与子独特的相互认识。
- issue: βούληται 所表达的意愿
  choice: “愿意”
  alternative: “选择”或“定意”
  rationale: “愿意”保留子在启示上的主动意志，不把它弱化为单纯愿望，也不引入特定宗派对拣选方式的进一步解释。
- issue: ἀποκαλύψαι 的隐含宾语
  choice: 在正文补出“父”
  alternative: 只译“启示”而不补宾语
  rationale: 上句的“认识父”清楚提供了所启示的对象；补出“父”使现代汉语完整易懂，却没有增加新的神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“父／子”维持原文平衡的关系称谓；分号呈现两个排他性认识陈述的平行结构。
