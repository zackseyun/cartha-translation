id: MAT.11.22
reference: Matthew 11:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: zh_hans
  text: 不过，我告诉你们：在审判之日，推罗和西顿所受的，将比你们所受的更容易忍受。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在审判之日，推罗和西顿所受的，将比你们所受的更可忍受。”
    reason: “更可忍受”是ἀνεκτότερον的较贴近字面的中文表达；保留原文对审判处境的比较，不误作双方忍受能力的比较。
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 承接前文的斥责并形成鲜明转折；“不过”自然、庄重，保留了逆接语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 准确表达第一人称对复数听众的直接、郑重宣告，也符合现代汉语习惯。
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: 泰尔和西顿所受的
  rationale: 希腊语与比较级连用的与格表示比较所涉及的对象；汉语补出“所受的”，使审判处境的比较清楚自然。
- source_word: ἀνεκτότερον
  choice: 更容易忍受
  rationale: 保留比较级和“可承受、可忍耐”的核心含义，同时比生硬的“更可忍受”更符合现代汉语。
- source_word: ἔσται
  choice: 要……
  rationale: 以“要”表达将来发生的情形；汉语无需照搬希腊语系词结构。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 在审判之日
  rationale: 表达该事件发生的时间，并以庄重而清楚的措辞保留末后审判的语境。
- source_word: κρίσεως
  choice: 审判
  rationale: 保留司法裁断这一较宽泛的含义，不缩窄为审判结果“定罪”。
- source_word: ἢ ὑμῖν
  choice: 比你们所受的
  rationale: 明确完成比较；“你们”保留原文复数，补出“所受的”使中文句法完整。
theological_decisions:
- issue: 所指审判的性质
  choice: 审判之日
  alternative: 一个审判的日子
  rationale: 虽然希腊语短语没有冠词，但在马太福音的语境中指向公认的末后审判事件；“审判之日”既符合汉语习惯，也不添加经文未说明的教义细节。
- issue: 比较的具体内容
  choice: 泰尔和西顿所受的，要比你们所受的更容易忍受
  alternative: 泰尔和西顿受到的刑罚会比你们轻
  rationale: 原文只说其处境“更可忍受”，没有明确使用“刑罚更轻”等措辞，因此保留其含蓄性及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“审判之日”保持经文语域的郑重感；整体避免古奥措辞，也不把比较具体化为原文没有明说的刑罚等级。
