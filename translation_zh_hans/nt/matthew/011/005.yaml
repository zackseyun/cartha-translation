  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: zh_hans
  text: 失明的人重见光明，瘸腿的人行走，患麻风病的人得洁净，聋人听见，死人复活，有好消息传给穷人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有好消息传给穷人”也可译作“有福音传给穷人”。希腊文动词是被动式，强调穷人是所宣告之好消息的领受者。这一连串话呼应《以赛亚书》35:5–6和61:1，呈现与弥赛亚工作相关的记号。
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: 瞎眼的看见
  rationale: ἀναβλέπω在医治语境中指恢复或得到视力；中文用“看见”简洁自然，并与后续一连串神迹相称。
- source_word: χωλοὶ περιπατοῦσιν
  choice: 瘸腿的行走
  rationale: 保留原文简短的名词化形容词与现在时陈述；“行走”用语庄重而清楚。
- source_word: λεπροὶ καθαρίζονται
  choice: 患麻风病的得洁净
  rationale: λεπρός指古代所归类的麻风或严重皮肤病患者；καθαρίζονται不只表示身体得医治，也包含礼仪上洁净的含义，因此译作“得洁净”。
- source_word: κωφοὶ ἀκούουσιν
  choice: 耳聋的听见
  rationale: κωφός可指聋或哑，但与“听见”搭配时明确指耳聋。
- source_word: νεκροὶ ἐγείρονται
  choice: 死人复活
  rationale: ἐγείρονται为被动形式，在此指死人被使之起来；汉语“复活”自然凝练，虽未形式化标出被动，却保留神迹语境中的受动含义。
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: 穷人听见传给他们的好消息
  rationale: εὐαγγελίζονται为被动，表示穷人是好消息宣告的接受者。此译既显明信息传给他们，又避免将动词过早技术化为后世教会术语。
theological_decisions:
- issue: εὐαγγελίζονται与“福音”术语的关系
  choice: 穷人听见传给他们的好消息
  alternative: 有福音传给穷人／穷人得着福音
  rationale: 原词是“宣告好消息”的被动形式。正文用普通现代汉语保留“好消息”的词义及穷人作为领受者的重点，同时脚注给出较传统、较凝练的译法。
- issue: 神迹清单与弥赛亚应验的关系
  choice: 正文只陈述这些作为，不添加“应验”或“弥赛亚”的解释
  alternative: 在正文中明说这是弥赛亚应验以赛亚预言的记号
  rationale: 原文借用以赛亚书的语言形成强烈呼应，却没有在本节直接加入“应验”一词；因此将互文背景放入脚注，而不写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。各分句保持原文排比和简洁节奏；避免使用贬损性的疾病称谓，以“患麻风病的”表达。正文保留古代文本的洁净观念及以赛亚式“向穷人报好消息”的神学张力。
