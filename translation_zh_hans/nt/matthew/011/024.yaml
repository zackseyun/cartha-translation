  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: zh_hans
  text: 但我告诉你们：在审判的日子，所多玛之地所受的审判，要比你所受的审判更容易忍受[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“更可忍受。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 但
  rationale: 此处引出与上文形成强烈对照的严肃宣告；“但”简洁自然，符合现代汉语表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你
  rationale: 按上下文，ὑμῖν虽为复数，但耶稣正在向被人格化的城发出宣告；汉语用单数“你”承接后文单数σοί，并保持直接讲话的力度。
- source_word: γῇ Σοδόμων
  choice: 所多玛之地
  rationale: 明确保留γῇ“地、地域”，不把该短语简化为单独的城名“所多玛”。
- source_word: ἀνεκτότερον
  choice: 更容易忍受
  rationale: 表达ἀνεκτός比较级“较可忍受、较能承受”的含义；结合审判语境，以“所受的……更容易忍受”构成自然汉语。
- source_word: ἔσται
  choice: 所受的，要……
  rationale: 希腊文未来系词在汉语中结合比较结构表达；“要”保留将来指向，而补出的“所受的”使审判处境中的比较关系清楚。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 在审判的日子
  rationale: 贴近原文时间短语，并保留其末世审判含义。
- source_word: ἢ σοί
  choice: 比你所受的
  rationale: 保留σοί的单数直接称呼；补出“所受的”是为完成现代汉语比较句，并未具体限定刑罚的性质。
theological_decisions:
- issue: 单数σοί所指
  choice: 保留单数“你”，视为对该城人格化的直接称呼
  alternative: 译作“你们”或“你那里的人”
  rationale: 原文σοί为单数，延续上下文先知式地向城发言的修辞。保留单数可避免把原文未明说的群体解释加入正文。
- issue: 审判中比较对象的省略
  choice: 译为“所多玛之地所受的……比你所受的更容易忍受”
  alternative: 译为“所多玛之地的刑罚……比你的轻”
  rationale: 原文只说“更可忍受”，没有明确使用“刑罚”或“较轻”等词；本译文补足汉语句法，却不进一步界定审判的具体形式或程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所多玛之地”保留原文对土地或地域的明确提及；整体句式兼顾原文比较结构与自然汉语。
