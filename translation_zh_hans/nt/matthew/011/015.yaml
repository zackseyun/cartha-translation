  text: The one who has ears[a], let him hear.
translation:
  language: zh_hans
  text: 有耳朵的，应当听[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为：“有耳朵的人，应当听。”希腊文采用阳性单数的泛指表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: 有……的
  rationale: 定冠词加现在分词构成名词性短语，泛指任何具有这一特征的人。汉语用“有……的”既自然简洁，也保留了泛指作用。
- source_word: ὦτα
  choice: 耳朵
  rationale: 原文为复数“耳朵”。现代汉语在这一惯用表达中通常不必另加复数标志。
- source_word: ἀκουέτω
  choice: 就要听
  rationale: 这是第三人称现在时命令式。“就要听”在现代汉语中表达直接的劝令，同时保留“听见、留心领会并作出回应”的语义空间，不把含义缩窄为单纯的听觉活动。
theological_decisions:
- issue: 阳性单数的泛指表达
  choice: 有耳朵的，就要听
  alternative: 有耳朵的人，让他听吧
  rationale: 希腊文以阳性单数形式作泛指。汉语的“有……的”本身不标明语法性别或数，却仍可自然地泛指每一个人；不额外添加“他”，可避免“让他听”在现代汉语中被误解为准许某人听，同时不改变原文所指。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“有耳朵的”保留原文格言式呼吁；“就要听”传达命令语气，并容纳“听从、领会”的语用含义。
