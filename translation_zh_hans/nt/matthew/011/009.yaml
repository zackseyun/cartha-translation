  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: zh_hans
  text: 但你们出去是要看什么？是看先知吗？是的，我告诉你们，而且他不只是先知。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为简略的比较表达，直译可作“而且比先知更多”（即“more than a prophet”）；也可译为“而且他比先知更大”。
    reason: 说明καὶ περισσότερον προφήτου的字面比较形式，并保留“更大”这一可行但较具体的理解，不将其定为正文唯一含义。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接前面的反问并形成转折，现代汉语中自然简洁。
- source_word: τί ἐξήλθατε
  choice: 你们出去是要看什么
  rationale: τί在此问所要看见的对象，而非单纯询问原因；这一表达兼顾目的意味和汉语自然度。
- source_word: ἰδεῖν
  choice: 看
  rationale: 作为目的不定式，表示出去所要看见的人；“看”简明自然。
- source_word: προφήτην
  choice: 先知
  rationale: 汉语无需以冠词标示不定，问句中的“先知”自然对应原文单数名词。
- source_word: ναί
  choice: 是的
  rationale: 直接肯定前面的反问，保留原文鲜明的回答语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 准确而自然地再现常见的强调性话语公式。
- source_word: καὶ περισσότερον προφήτου
  choice: 他比先知更大
  rationale: 比较级与属格构成“超过先知”的比较。汉语需补出语境中明确指向约翰的主语；“更大”表达身份或地位上的超越，同时脚注保留更贴近字面的译法。
theological_decisions:
- issue: 耶稣对施洗约翰身份和地位的评价
  choice: 译作“他比先知更大”
  alternative: “而且不只是先知”或“而且超过先知”
  rationale: 原文肯定约翰超越“先知”这一类别，却未在本分句说明超越的具体方式。正文采用自然汉语表达其比较含义，不增添“普通先知”等限定，也不解释其神学原因。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。连续问句保留耶稣话语的修辞力度；末句为汉语通顺补出“他”，但不补入原文未明说的身份解释。
