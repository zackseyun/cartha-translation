  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: zh_hans
  text: 所有辛劳、背负重担的人，都到我这里来吧；我必使你们得安息[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“我必使你们得歇息。”这个动词可以表示使人安歇，也可以表示使人恢复精神。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: 到我这里来吧
  rationale: Δεῦτε在此是邀请性的命令语气，与πρός με合起来表示来到说话者面前；“到我这里来吧”自然、直接，并保留邀请意味。
- source_word: πάντες
  choice: 凡……的人，都
  rationale: 用汉语的“凡……都”结构表达邀请对象无一例外的广泛范围。
- source_word: οἱ κοπιῶντες
  choice: 劳苦
  rationale: 保留分词所表达的辛劳、费力做工之意，同时避免擅自限定为身体、精神或宗教层面的劳苦。
- source_word: πεφορτισμένοι
  choice: 背负重担
  rationale: 以自然现代汉语表达被加上重担后仍承受其压力的状态；脚注补明希腊文完成时被动分词的语法含义。
- source_word: κἀγὼ
  choice: 我必
  rationale: 明确保留第一人称主语；“必”自然表达将来应许的确定性，而不额外强化“我自己”的对比意味。
- source_word: ἀναπαύσω ὑμᾶς
  choice: 使你们得安息
  rationale: 保留动词“使人休息、得到安歇”的使动意义，也让“安息”维持其较宽广的含义，不把它限缩为身体休息或情绪恢复。
theological_decisions:
- issue: ἀναπαύσω所应许之“安息”的性质
  choice: 使你们得安息
  alternative: 使你们恢复精神；使你们舒畅
  rationale: 本节本身没有明确把这种安息限定为身体、情绪、属灵或末世性的安息；采用较宽泛的译法，可保存原文的神学丰富性与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都”使长句关系清楚；“来吧”体现邀请语气；“安息”虽略带庄重色彩，但在此能兼顾自然表达与原文宽泛含义。所有脚注标记均置于对应词语之后。
