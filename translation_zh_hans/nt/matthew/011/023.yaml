source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: zh_hans
  text: 迦百农啊，你难道会被高举到天上吗？你必降到阴间[a]。因为，如果在你那里所发生的那些大能之事曾发生在所多玛，它就会存留到今天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死者的领域”。希腊文为“哈得斯”（ᾅδης），不是“基亨纳”（Gehenna）。
    reason: 说明原词并保留其与另一审判用语的区别，避免把“阴间”未经说明地理解为“地狱”。
lexical_decisions:
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经传统中通行且易于辨认的地名音译。
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: 你难道会被高举到天上吗？
  rationale: 将 μή 与将来时被动形式理解为期待否定回答的反问；“被高举到天上”保留被动语态及空间性意象，不把反问改写成直陈否定。
- source_word: ἕως ᾅδου καταβήσῃ
  choice: 你必降到阴间
  rationale: “降到”直接表达 καταβαίνω 的向下运动；“阴间”是现代中文对 ᾅδης 较自然的对应，并借脚注说明其所指，避免与 Gehenna 混同。
- source_word: δυνάμεις
  choice: 大能之事
  rationale: 兼顾 δύναμις 所含的能力与具体作为两方面，比单译“神迹”更能保留原词的语义宽度。
- source_word: γενόμεναι ἐν σοί
  choice: 在你那里所行的
  rationale: 延续对城市的第二人称称呼，并以自然中文说明这些大能之事发生在迦百农。
- source_word: ἐγενήθησαν
  choice: 若行在
  rationale: 配合反事实条件句，用简洁中文表达这些大能之事若曾发生在所多玛；“行”与上文“大能之事”搭配自然。
- source_word: ἔμεινεν ἂν
  choice: 早就会存留
  rationale: “会存留”表达带 ἄν 的反事实结果；补入“早就”使中文反事实语气自然，但不改变存留至今的时间范围。
- source_word: μέχρι τῆς σήμερον
  choice: 到今天
  rationale: 直接、清楚地保留原文的时间终点。
theological_decisions:
- issue: ᾅδης 的译法
  choice: 阴间
  alternative: 哈得斯；死人的境域；地狱
  rationale: “阴间”在现代中文中较自然，并可指死者所在的境域；脚注明示希腊文为 ᾅδης，以避免将其直接等同于表示末后刑罚的 Gehenna，也不在正文中预先裁定更细的教义含义。
- issue: μὴ ἕως οὐρανοῦ ὑψωθήσῃ 的句法
  choice: 译作期待否定回答的反问
  alternative: 译作直陈句“你绝不会被高举到天上”
  rationale: 疑问式能较好反映 μή 引出的修辞问句，同时保留原文在句法理解上的张力，并与下句的降卑形成鲜明对照。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“迦百农啊”保留直接呼告；“你难道……吗？你必……”呈现反问与判语的力度；“大能之事”兼顾可懂度与原词的语义广度。
