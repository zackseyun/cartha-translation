  timestamp: '2026-07-14T02:07:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现两个命令、耶稣自述的原因从句，以及将来的应许。“负起我的轭”“向我学习”“温柔，心里谦卑”“得安息”均妥当。可是 καί 在此连接前述命令与应许，译为“这样”会增添汉语中较强的推论／方式色彩；宜直译为“并且”，以免改变原文较开放的并列承接关系。
  naturalness: “你们要负起我的轭，向我学习，因为我温柔，心里谦卑；并且你们必为自己的心灵得安息。”庄重、自然，并保留经文的节奏。“为自己的心灵得安息”较准确反映 ταῖς ψυχαῖς ὑμῶν 的与格；“心灵”在此可接受。
  terminology: “轭”“温柔”“谦卑”“安息”都符合现代中文圣经语体，且保留关键隐喻与神学语汇。将 ψυχαῖς 译作“心灵”是可行的解释性对应，但“自己的心灵”须避免被误解为主语自行取得安息，故以“为……得安息”表达受益对象。
  issues:
  - severity: low
    issue: “这样”对 καί 的处理偏解释性。
    rationale: 原文仅以 καί 连接“你们必得安息”，没有明示“这样／因此”的逻辑结论。用“并且”更贴近原文，也保留其承接关系。
  - severity: low
    issue: “你们的心灵就必得安息”的句法稍弱化与格。
    rationale: ταῖς ψυχαῖς ὑμῶν 是“为你们的心灵／给你们的心灵”，而不是单纯以“心灵”为得安息的主语。“你们必为自己的心灵得安息”更明确且自然。
  - severity: low
    issue: 现有脚注说明了一个不宜保留的“这样”。
    rationale: 修订后不再有该词，脚注也不再提供有助于读者理解的原文异文、词义替代或翻译说明，应删除。
  revised_text: 你们要负起我的轭，向我学习，因为我温柔，心里谦卑；并且你们必为自己的心灵得安息。
  revised_footnotes: []
