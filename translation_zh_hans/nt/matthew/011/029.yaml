revisions:
- from: 你们要负起我的轭，向我学习，因为我温柔，心里谦卑；这样，你们的心灵就必得安息。[a]
  to: 你们要负起我的轭，向我学习，因为我温柔，心里谦卑；并且你们必为自己的心灵得安息。
  rationale: 以“并且”对应 καί，避免“这样”所增加的推论色彩；以“为自己的心灵得安息”更清楚表达 ταῖς ψυχαῖς ὑμῶν 的受益与格。其余措辞维持原译对原文的忠实和现代庄重的语体。
