  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: zh_hans
  text: 你们要负起我的轭，向我学习，因为我温柔，心里谦卑；并且你们必为自己的心灵得安息。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: 你们要负起我的轭
  rationale: 保留“轭”的具体比喻，并以现代汉语“负起”表达接受、承担此轭的命令，而不只表示把它举起。
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: 向我学习
  rationale: 自然表达从耶稣领受教导、以他为师的含义；不把原文进一步限定为单纯模仿或只学习某一种品格。
- source_word: ὅτι
  choice: 因为
  rationale: 按解释原因理解，说明耶稣为何是人可以亲近并向其学习的老师。
- source_word: πραΰς
  choice: 温柔
  rationale: 表达柔和、不苛刻的正面品格，避免“软弱”的误解。
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: 心里谦卑
  rationale: 保留“心”所指的内在性情，并以自然、庄重的现代汉语表达 ταπεινός。
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: 就必得安息
  rationale: 未来时在语境中带有应许意味；“安息”保留经文传统与相关圣经意象。
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: 你们的心灵
  rationale: ψυχή 在此指人的内在生命乃至整个人；“心灵”在现代汉语中比直译“灵魂”更自然，同时不把含义缩减为情绪上的放松。
theological_decisions:
- issue: πραΰς καὶ ταπεινὸς τῇ καρδίᾳ 对耶稣品格的描述
  choice: 我温柔，心里谦卑
  alternative: 我柔和，内心卑微
  rationale: “温柔、谦卑”清楚保留耶稣的自我描述及其内在品格，也避免“卑微”可能主要被理解为社会地位低下。
- issue: ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν 所指的安息
  choice: 你们的心灵就必得安息
  alternative: 你们自己就必得安息
  rationale: 保留 ψυχή 的内在生命意涵和圣经语言的回响，同时不将其教义化地限定为死后灵魂的归宿。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“负起我的轭”保留核心比喻；“向我学习”避免古雅的“学我的样式”。将 καί 译作“这样”是为显明前两项命令与所得安息之间的承接关系，脚注保留较形式对应的连接方式。
