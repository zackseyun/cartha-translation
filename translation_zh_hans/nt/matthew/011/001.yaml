source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: zh_hans
  text: 耶稣向他的十二个门徒吩咐[a]完以后，就离开那里，到他们的城镇[b]去教导和宣讲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐”也可译作“指示”或“命令”。
    reason: lexical_alternative
  - marker: b
    text: “他们的城镇”在希腊文中所指不明确，可能指门徒们所属的城镇，也可能泛指当地人的城镇。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ……以后，就……
  rationale: 这是马太常用的叙事过渡句式，主要引出先后发生的行动。用现代汉语的“……以后，就……”自然表达时间关系和叙事推进，不生硬直译为“事情发生了”。
- source_word: ἐτέλεσεν
  choice: 完
  rationale: 表达前一行动已经完成，并与随后“离开”形成清楚的先后次序。
- source_word: διατάσσων
  choice: 吩咐
  rationale: 该词表示带有权威地作出指示或命令。“吩咐”既保留权威意味，也符合耶稣差遣十二门徒这一语境下的自然现代汉语。
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: 他的十二个门徒
  rationale: 明确保留“十二”和所属关系；“门徒”是福音书语境中 μαθητής 的通行而准确的译法。
- source_word: μετέβη ἐκεῖθεν
  choice: 离开那里
  rationale: 自然表达从先前地点转往别处的动作，同时保留 ἐκεῖθεν 的地点信息。
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: 去教导和宣讲
  rationale: 此处带冠词的不定式表示目的；“去……”符合现代汉语目的结构，并保留“教导”与“宣讲”两个不同的行动。
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: 到他们的城镇
  rationale: “城镇”适合 πόλις 在加利利地区可指城市或市镇的语义范围；保留“他们的”，不替原文判定代词具体指谁。
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν 中 αὐτῶν 的所指
  choice: 保留“他们的城镇”这一含混表达
  alternative: 明确译为“门徒们的城镇”或“那一带的城镇”
  rationale: 希腊文没有明说 αὐτῶν 的先行词，可能指门徒所属的城镇，也可能较宽泛地指当地人的城镇。译文不作原文未作的解释性限定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“吩咐”体现权威而不过度军事化；“宣讲”准确表达公开传扬信息的 κηρύσσω，并与“教导”保持区别。所有代词歧义均按原文保留。
