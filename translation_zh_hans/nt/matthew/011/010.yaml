  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: zh_hans
  text: '这就是经上所记、论到的那一位：


    “看哪，我要差遣我的使者在你面前；

    他要在你前面预备你的道路。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός
  choice: 这人就是
  rationale: 用于明确指认施洗约翰，保留指示代词的强调作用；现代汉语自然、庄重，又不额外增添身份解释。
- source_word: περὶ οὗ
  choice: 所记的
  rationale: 与“经上”构成自然的现代汉语引文公式；关系对象由“这人”清楚表达，语义相当于“关于他”。
- source_word: γέγραπται
  choice: 经上所记的
  rationale: 保留圣经引用公式及完成时被动语态所体现的既成、持续有效之意，同时避免生硬直译。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知性引文中引人注意的庄重语气，比口语化的“看”更符合文体。
- source_word: ἀποστέλλω
  choice: 我要差遣
  rationale: 此处引文中的现在时带有临近或将来指向；“我要差遣”在汉语中自然呈现宣告性的未来含义。
- source_word: ἄγγελόν
  choice: 使者
  rationale: ἄγγελος在此指作为先行者的施洗约翰，语境要求译为人的“使者”，而非天使。
- source_word: πρὸ προσώπου σου
  choice: 在你面前
  rationale: 保留原文“在你的面前/面容之前”的具体表达，也符合现代汉语习惯。
- source_word: κατασκευάσει
  choice: 要……预备
  rationale: 准确表达将来的预备行动，并与“道路”的意象自然搭配。
- source_word: τὴν ὁδόν σου
  choice: 你的道路
  rationale: “道路”兼有实际道路和比喻性道路的可能，保留原文ὁδός的双重意蕴。
- source_word: ἔμπροσθέν σου
  choice: 在你前面
  rationale: 与前一句“在你面前”有所区分，同时保留原文第二个方位短语及其强调作用。
theological_decisions:
- issue: 经文引语中两个相近方位短语的处理
  choice: 保留“在你面前”和“在你前面”两个短语
  alternative: 合并或统一译为“在你前头”
  rationale: 希腊文同时保留πρὸ προσώπου σου与ἔμπροσθέν σου。分别译出可保存引文的形式结构和重复强调，不以流畅为由将两者合并。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“看哪”维持先知性引文的提升语域；其余措辞避免古奥。“在你面前／在你前面”的轻微重复有意对应原文。
