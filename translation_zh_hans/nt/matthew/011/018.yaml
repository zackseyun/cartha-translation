- from: 因为约翰来了，不吃也不喝，他们就说：“他有鬼附着[a]。”
  to: 因为约翰来了，不吃也不喝，他们说：“他被邪灵附了[a]。”
  rationale: 修订只处理不自然的“他有鬼附着”，以“他被邪灵附了”表达原文所报道的指控；脚注保留 ἔχει（“有”）的字面表达，避免将惯用语的解释性译法误作唯一措辞。保留“因为”“约翰来了”“不吃也不喝”和未特指的“他们”，不从平行经文补入“饼”或“酒”。
