    issue: “他有鬼附着”汉语表达失当
    rationale: 该短语把“有鬼”和“附着”不自然地拼合，既不符合通常搭配，也使原文的指控难以清楚理解。
  - severity: low
    issue: “就”略增原文未明示的结果/即时语气
    rationale: καὶ λέγουσιν 只是连接并以现在时陈述人们的说法；“他们说”已足够自然且更中性。
