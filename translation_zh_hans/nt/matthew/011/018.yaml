base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: zh_hans
  text: 因为约翰来了，不吃也不喝，他们说：“他被邪灵附了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有一个邪灵。”希腊文直译为“他有一个邪灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 来了
  rationale: 不定过去时在此指约翰来到人们中间、开始公开活动；“来了”直接自然，不额外解释为“出现了”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表明本句是在说明前面的论述；现代汉语中“因为”能清楚体现其解释性。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经及基督教语境中通行的人名译法；上下文表明所指为施洗约翰。
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: 不吃也不喝
  rationale: 保留 μήτε…μήτε 的并列否定和原文简练说法，指约翰禁欲节制的生活方式；不从路加福音的平行经文加入本节未明说的“饼”和“酒”。
- source_word: καὶ λέγουσιν
  choice: 他们就说
  rationale: “他们”保留希腊文未明确指名的复数主语；“就”自然表达叙事中对约翰生活方式作出的反应，λέγουσιν 的现在时在中文叙事中无需机械标示。
- source_word: Δαιμόνιον ἔχει
  choice: 他有鬼附着
  rationale: δαιμόνιον 指邪灵而非魔鬼撒但；“有鬼附着”在现代汉语中自然表达“有邪灵在身”的指控，同时脚注保留原文更贴字面的结构。
theological_decisions:
- issue: 如何翻译针对约翰的 δαιμόνιον ἔχει 指控
  choice: 他有鬼附着
  alternative: 他被鬼附了；他有鬼
  rationale: 这是众人对约翰的指控，并非叙述者的断言。“有鬼附着”既符合现代汉语表达，又没有强化为更具解释性的状态描述；脚注交代希腊文直译，以保留措辞及其张力。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“不吃也不喝”保留原文的概括与修辞性，不把它误解为约翰绝对不摄取任何饮食；上下文会使读者理解这是对其禁欲生活方式的概括。
