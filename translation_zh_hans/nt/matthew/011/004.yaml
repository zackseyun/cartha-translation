  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: zh_hans
  text: 耶稣回答他们说[a]：“你们去，把所听见、所看见的告诉约翰：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“耶稣回答并对他们说。”
    reason: 说明希腊语ἀποκριθεὶς ... εἶπεν αὐτοῖς的双重叙事表达；正文的“回答他们说”以自然汉语保留其功能。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处承接上文，现代汉语叙事中无需机械译为“于是”或“并且”；省略可避免加入原文未明确表达的时间意味。
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: 耶稣回答他们说
  rationale: 保留希腊语“回答……说”的叙事结构；现代汉语中自然通顺，也比仅译“回答他们”更清楚地引出直接引语。
- source_word: Πορευθέντες
  choice: 你们去
  rationale: 这一先行动词与后面的命令式连用，具有伴随并衔接命令的作用；译作“你们去”保留行动次序和命令语气。
- source_word: ἀπαγγείλατε
  choice: 告诉
  rationale: 此词在语境中指把亲自听见、看见的事带回去转告约翰。“告诉”比“报告”更符合普通现代汉语，同时保留传达消息的含义。
- source_word: Ἰωάννῃ
  choice: 约翰
  rationale: 与格表示信息传达的对象；汉语以“告诉约翰”自然表达。人名采用通行圣经译名。
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: 所听见、所看见的
  rationale: 以“所”字结构对应中性复数关系代词所涵盖的事情，并保留“听见”和“看见”的并列及当前亲身见证的意味。
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν 的叙事公式
  choice: 耶稣回答他们说
  alternative: 耶稣回答他们
  rationale: 汉语“回答……说”既贴近原文双重表达，又是可接受的现代叙事用语；这属于文体选择，不改变神学含义。
- issue: 门徒所传信息的证据性质
  choice: 把所听见、所看见的告诉约翰
  alternative: 把你们听到和看到的报告给约翰
  rationale: 保留原文以亲耳听见、亲眼看见为信息内容的开放表达，不提前解释下一节所列事件的神学意义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留“回答他们说”的原文叙事特色；命令简洁直接。冒号置于本节末尾，以表明耶稣的话在下一节继续。
