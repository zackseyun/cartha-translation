  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: zh_hans
  text: 可是，我拿这一代人跟什么相比呢？这一代人好像坐在集市里的孩子们，向其他人喊着说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: 可是，我拿……跟什么相比呢
  rationale: δὲ在此表示轻微转折；未来时ὁμοιώσω具有修辞性的自问语气。译文采用现代汉语自然的比较句式。
- source_word: τὴν γενεὰν ταύτην
  choice: 这一代人
  rationale: γενεά在此指同时代的一群人；加“人”可避免中文“这一代”被误解为抽象时代，同时保留群体指向。
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: 他们好像……孩子
  rationale: 原文按语法以单数“这一代”为主语，中文则自然地按其群体意义用“他们”；παιδίοις泛指孩子，不必强化为“小孩子”。
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: 坐在集市上的
  rationale: ἀγορά指用于交易和公众聚集的市场或广场；“集市”简洁地保留公共市场场景。
- source_word: ἃ προσφωνοῦντα
  choice: 向……喊着说
  rationale: προσφωνέω表示出声招呼或喊话；“喊着说”既体现公开呼喊，也顺畅引出下一节的直接引语。
- source_word: τοῖς ἑτέροις
  choice: 其他人
  rationale: 原文只说“其他的（人）”，并未再次明说“孩子”；译文保留这种省略及其语境含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“可是”体现温和转折，“呢”保留耶稣修辞性自问的语气。句末用冒号承接下一节孩子们所喊的话。
