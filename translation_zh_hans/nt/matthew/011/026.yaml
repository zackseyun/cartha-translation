  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: zh_hans
  text: 是的，父啊，因为这样合你的心意。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这是你的美意。”
    reason: “合你的心意”表达εὐδοκία ἐγένετο ἔμπροσθέν σου所含的喜悦、称许；“美意”保留另一常见译法及其意愿／目的色彩，避免在正文中将该词义定为单一神学含义。
lexical_decisions:
- source_word: ναί
  choice: 是的
  rationale: 在祷告语境中表达肯定和认同；“是的”直接、自然，也保留了对上文的承接。
- source_word: ὁ πατήρ
  choice: 父啊
  rationale: 带冠词的主格在此作称呼使用；“父啊”以现代而庄重的汉语清楚表达直接呼告。
- source_word: ὅτι
  choice: 因为
  rationale: 引出前面肯定之语的原因，保留希腊文较自然的因果关系。
- source_word: οὕτως
  choice: 这样
  rationale: 回指上一节所说隐藏与启示的方式；“这样”既简洁，又不把所指内容解释得过窄。
- source_word: εὐδοκία ἐγένετο
  choice: 是好的
  rationale: 该短语表达某事在父面前蒙悦纳、合其心意。“是好的”配合“你看”形成自然汉语，同时避免过度强化为预定的旨意。
- source_word: ἔμπροσθέν σου
  choice: 你看
  rationale: 字面为“在你面前”，在此表示按父的眼光或判断；译作“你看”是自然的现代汉语表达。
theological_decisions:
- issue: εὐδοκία 是否应译得带有神圣谕旨或预定目的的含义
  choice: 你看这样是好的
  alternative: 因为这是你的美意
  rationale: 正文表达父对此方式的喜悦、认可或美意，但不将名词的含义限定为预定性的旨意；脚注保留传统而可能更具目的色彩的译法。
- issue: ὅτι 的关系是原因还是内容
  choice: 因为
  alternative: 即／就是
  rationale: 在此最自然地说明耶稣为何如此称谢并认同父；同时不对更宽泛的解释可能性作教义化处理。
translation_notes:
  register: 采用现代、庄重且口语可懂的祷告语言。“父啊”保留直接呼告；正文避免生硬的“在你面前是蒙悦纳的”，以“你看这样是好的”自然传达原文，同时用脚注呈现重要词义选择。
