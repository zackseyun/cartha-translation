  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: zh_hans
  text: 新郎迟迟未到[a]，她们就都打起了瞌睡，睡着了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“新郎来得很迟。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“她们都渐渐困倦，正在睡觉。”希腊文先说她们开始困倦（ἐνύσταξαν），再以未完成时说她们在睡觉（ἐκάθευδον）。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: 迟迟未到
  rationale: 该现在分词构成属格独立结构，表示新郎花了比预期更久的时间。结合迎候新郎的语境，“迟迟未到”自然传达延迟之意，同时不明确归因于任何人。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ表示轻微转折或叙事推进；汉语借“迟迟未到”与后句因果承接已能自然体现这一转折，若硬译“但是”略显生硬。
- source_word: νυμφίου
  choice: 新郎
  rationale: νυμφίος指婚礼中的新郎；现代汉语“新郎”准确、自然，也保留比喻本身而不把其基督论含义明说出来。
- source_word: ἐνύσταξαν
  choice: 打起了瞌睡
  rationale: 该不定过去时表示开始困倦；“打起了瞌睡”保留由清醒转为昏昏欲睡的起始意味，并与随后实际睡着有所区别。
- source_word: πᾶσαι
  choice: 她们就都
  rationale: 阴性复数指前文所有童女；“她们都”明确表达无一例外。
- source_word: ἐκάθευδον
  choice: 睡着了
  rationale: καθεύδω表示睡觉。结合前面的“打起了瞌睡”，“睡着了”自然呈现从困倦到入睡的进程；脚注另保留未完成时可表达持续状态的可能。
theological_decisions:
- issue: 新郎意象的比喻含义
  choice: 保留“新郎”这一叙事意象，不在正文中明说其所指。
  alternative: 在译文中解释性地写成基督或弥赛亚。
  rationale: 马太福音整体语境使该意象具有基督论共鸣，但本节仍在讲述比喻。译文应保留意象及其解释空间，不把隐含认同扩写进正文。
- issue: 新郎延迟的施事与语气
  choice: 译作“迟迟未到”，表达时间超过预期而不指定是谁造成延误。
  alternative: 译作“被耽搁了”，可能暗示外在原因或被动施事。
  rationale: 原文χρονίζω可指耽延或花很长时间，并未交代延迟原因；中译应避免增添施事解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“迟迟未到”符合等候场景；“打起了瞌睡，睡着了”清楚保留两个动词所呈现的进程。所有脚注标记均置于正文。
