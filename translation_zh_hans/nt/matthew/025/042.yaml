  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: zh_hans
  text: 因为我饿了，你们没有给我吃的；我渴了，你们没有给我喝的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: 我饿了
  rationale: 该词为不定过去时直陈语气，描述说话者过去处于饥饿状态；“我饿了”是自然、清楚的现代汉语。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上下文，说明判决的理由；汉语用“因为”能明确表达其解释和因果作用。
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: 你们没有给我吃的
  rationale: 原文较直译为“没有给我吃”，其中μοι保留了对“我”的个人指向，φαγεῖν则以自然的汉语“吃的”表达，既贴近结构又通顺。
- source_word: ἐδίψησα
  choice: 我渴了
  rationale: 与“我饿了”平行，简洁地表达过去的口渴状态。
- source_word: ἐποτίσατέ με
  choice: 你们没有给我喝的
  rationale: ποτίζω在此指给人饮用之物；“给我喝的”符合现代汉语，也与前句“给我吃的”形成平行。
theological_decisions:
- issue: 否定的供给行为应采用多大程度的显化表达
  choice: 译作“你们没有给我吃的／喝的”
  alternative: 你们没有给我吃／没有给我喝；你们没有给我食物／饮水
  rationale: 此处重点是人在审判语境中没有向耶稣所认同的人施行怜悯。所选译法保留“给我”的个人焦点和吃、喝的平行结构，同时不额外解释“这些最小的弟兄”是谁，也不消解上下文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我饿了／我渴了”简明口语化但不失经文语体；两个分句保持紧密平行。原文信息已可在正文中自然呈现，因此无需脚注。
