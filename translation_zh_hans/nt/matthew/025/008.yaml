  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: zh_hans
  text: 那些愚拙的对那些明智的说：“分些你们的油给我们吧，因为我们的灯[a]正在熄灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灯”或译“火把”（希腊文 λαμπάδες）；这个词可指手持的燃烧照明物，具体译法取决于如何理解当时的场景。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: 愚拙的
  rationale: 这是形容词作名词使用，指比喻中那一组童女；“愚拙的”自然保留了与“聪明的”之间关乎判断和预备的对比。
- source_word: φρονίμοις
  choice: 聪明的
  rationale: 此词强调实际的明智、审慎和有预备；“聪明的”符合现代汉语表达，也与“愚拙的”形成清楚对应。
- source_word: Δότε
  choice: 分些……给我们吧
  rationale: 该词是复数命令式；结合ἐκ所表达的部分意义，译为请求对方从自己的油中分出一些，语气直接而自然。
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: 些你们的油
  rationale: ἐκ加属格在这里具有部分意义，表示从对方所拥有的油中取一部分；汉语用“分些你们的油”自然表达。
- source_word: λαμπάδες
  choice: 灯
  rationale: λαμπάς可指灯或火把；本比喻提到油及盛油器具，正文采用读者熟悉且符合语境的“灯”，并在脚注保留“火把”这一可能译法。
- source_word: σβέννυνται
  choice: 快要灭了
  rationale: 现在时中间/被动形式描写火焰正在熄灭的过程；“快要灭了”在现代汉语中自然传达尚未完全熄灭、却正在走向熄灭的状态。
- source_word: ὅτι
  choice: 因为
  rationale: 引出请求的原因；“因为”清楚保留其因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“愚拙的／聪明的”承接上文所指的两组童女，避免不必要地重复名词；对白使用“吧”自然表达请求语气。
