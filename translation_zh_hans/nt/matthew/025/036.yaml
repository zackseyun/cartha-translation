  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: zh_hans
  text: 我赤身露体，你们给我穿上衣服；我病了，你们探望我[a]；我在监狱里，你们到我这里来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “探望”也可译作“照顾”；希腊文动词可含带着关心去看望、照料的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译是“你们到我这里来”；也可按语境译作“你们来看我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: 赤身露体
  rationale: 直接表达没有衣服遮体的状态，并与下文“给我衣服穿”形成清楚对应；在本段怜悯行动的语境中，也可涵盖缺少足够衣物的处境。
- source_word: περιεβάλετέ
  choice: 给我衣服穿
  rationale: περιβάλλω在此指把衣物穿在某人身上；这一表达自然易懂，并保留具体行动。
- source_word: ἠσθένησα
  choice: 我病了
  rationale: 该动词可泛指软弱，但此处与探望和照料相关，“病了”最符合上下文中的通常含义。
- source_word: ἐπεσκέψασθέ
  choice: 探望
  rationale: ἐπισκέπτομαι可指带着关切去看望，甚至含照料之意；“探望”保留基本动作，又不把关怀的含义扩展得过于明确。
- source_word: φυλακῇ
  choice: 监里
  rationale: φυλακή在此指拘禁人的处所；“在监里”是简洁、自然且庄重的现代汉语表达。
- source_word: ἤλθατε πρός με
  choice: 到我这里来
  rationale: 严格对应希腊文“你们来到我这里”，保留原文简朴的措辞，不重复添加前句“探望”的概念。
theological_decisions:
- issue: 怜悯行动用语的解释性扩展程度
  choice: 保留“给我衣服穿”“探望我”和“到我这里来”等具体动作，不扩写为照顾、服侍等更强的解释。
  alternative: 把ἐπεσκέψασθέ με译为“照顾我”，或把ἤλθατε πρός με译为“来看望我”。
  rationale: 原文强调实际的怜悯行动，但措辞本身简明。直译这些动作既保留其具体性，也避免加入原文没有明说的牧养或教义含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“赤身露体”保留原文力度；“给我衣服穿”比“给我穿上”指向更明确。“在监里”简洁自然。分号呈现三个平行的处境与回应。
