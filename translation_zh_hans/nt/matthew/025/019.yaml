  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those slaves comes and settles accounts with them.
translation:
  language: zh_hans
  text: 过了很久，那些奴仆的主人回来，跟他们结算账目。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: 过了很久
  rationale: μετά加宾格表示时间上的“在……之后”；δέ在此是轻微的叙事衔接，汉语用“过了很久”即可自然推进叙事，无须另加“但”或“于是”。
- source_word: ἔρχεται
  choice: 回来
  rationale: 原文用历史现在时，使叙述生动；现代汉语叙事通常不必机械保留时态形式。结合主人离开后再出现的语境，“回来”比单纯“来”更自然，并未增加原文情节。
- source_word: ὁ κύριος τῶν δούλων ἐκείνων
  choice: 那些奴仆的主人
  rationale: κύριος在此指比喻中对这些δοῦλοι拥有权柄的人，译作“主人”符合家庭经济关系；δοῦλος具有受主人支配、并非普通雇员的含义，“奴仆”兼顾其受辖制身份和庄重的圣经叙事语体。
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: 跟他们结算账目
  rationale: 该习语表示与人核算、清账。“结算账目”在现代汉语中清楚保留本段的财务核算意象。
theological_decisions:
- issue: 比喻中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 本句直接呈现的是比喻内部主人与奴仆的社会关系，而不是明确使用基督论称号；译作“主人”避免在措辞中预先坐实寓意，同时不妨碍读者从整体语境理解其神学指向。
- issue: δοῦλος的译法
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “仆人”可能弱化其受主人辖制的身份，“奴隶”虽更直接，却在现代汉语中容易使本句语体显得突兀；“奴仆”较自然地保留从属与非自由身份。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。语序依汉语习惯调整为“那些奴仆的主人”；不另设脚注，因为“主人／奴仆”的语义搭配已能在正文中充分表达此处关系，且本节没有需要由异文或实质歧义说明的内容。
