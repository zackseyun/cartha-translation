  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: zh_hans
  text: 其中五个是愚拙的，五个是明智的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: 五个
  rationale: 基数词直译为“五个”；汉语量词“个”自然承接上文所说的十个童女，并保留原文两次出现“五”的平衡结构。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要起轻微的承接和转折作用；本句内部鲜明的两组对照已能自然体现其语篇功能，若硬译为“而”或“但”反而会加重转折。
- source_word: ἐξ αὐτῶν
  choice: 其中
  rationale: 准确表达从上文群体中取出一部分的部分关系，也符合现代汉语习惯。
- source_word: ἦσαν
  choice: 是
  rationale: 未完成时在此作描述性的系词；汉语用“是”自然表达这种身份或性质判断，无须另行标示过去时。
- source_word: μωραὶ
  choice: 愚拙的
  rationale: μωρός表示缺乏判断力、愚昧；“愚拙”既保留寓言中的道德与实践判断色彩，也具有庄重而易懂的经文语体。
- source_word: φρόνιμοι
  choice: 明智的
  rationale: φρόνιμος可指明智、审慎、有见识；“明智”既与“愚拙”形成清楚对照，又不过度限定为单纯聪颖或某一种特定德性。
theological_decisions:
- issue: μωραί与φρόνιμοι所表达的对比性质
  choice: 译为“愚拙的／明智的”
  alternative: “愚笨的／聪明的”或“愚拙的／谨慎的”
  rationale: 原文对比重在判断与行事是否有见识，而不只是智力高低；“明智”可保留实践智慧的含义，同时不预先把寓意收窄为某一项神学德性。
translation_notes:
  register: 采用现代、简洁而庄重的叙述语体。保留原文“五个……五个……”的对称结构；第二分句省略重复的“是”，符合汉语表达习惯，同时不损害两组之间的清晰对照。
