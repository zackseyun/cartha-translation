id: MAT.25.34
reference: Matthew 25:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: zh_hans
  text: 那时，王要对他右边的人说：‘来吧，蒙我父赐福的人[a]！承受那自创世以来为你们预备好的国[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我父所赐福的人。”
    reason: 保留属格结构较为贴近字面的表达。
  - marker: b
    text: “自创世以来”也可译作：“从创世之时起。”
    reason: 说明介词短语的另一种自然时间表达。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示审判场景中的时间推进；“那时”自然、庄重，也准确承接上文。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 定冠词表明这里指上下文中那位特定的王；汉语不以大小写区分专称，“王”既简洁又保留其审判者的王权身份。
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: 他右边的人
  rationale: 保留原文的空间位置，也让上下文所含的尊荣意味自然呈现，不额外解释。
- source_word: Δεῦτε
  choice: 来吧
  rationale: 这是带有召唤意味的命令式；“来吧”在现代汉语中自然，并符合庄重邀请的语气。
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: 蒙我父赐福的人
  rationale: 完整表达完成时被动分词的受惠状态，并将属格自然理解为福分的来源或施予者。
- source_word: κληρονομήσατε
  choice: 承受
  rationale: 保留“作为产业继承、取得”的家族与盟约色彩，比泛泛的“接受”更贴近原词。
- source_word: τὴν ... βασιλείαν
  choice: 国
  rationale: 这里的对象能够被承受并已为他们预备，译作“国”最能呈现末世国度的领域含义，同时不排除王权统治的内涵。
- source_word: τὴν ἡτοιμασμένην ὑμῖν βασιλείαν
  choice: 为你们预备好的国
  rationale: “预备好的”体现完成时被动分词所表达的既已完成、现仍有效的预备。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 自创世以来
  rationale: 以自然的现代汉语表达从世界奠基之时开始的时间范围，并保留其与“预备好”的直接联系。
theological_decisions:
- issue: τοῦ πατρός μου 是表示来源或施事，还是保留较字面的所属表达
  choice: 译为“蒙我父赐福的人”，明确父是赐福的来源或施予者。
  alternative: 译为“我父所赐福的人”或较字面的“我父的蒙福者”。
  rationale: 该属格与被动分词连用时自然指出赐福的来源；所选译法清楚顺畅，却不增加原文没有的神学解释。
- issue: βασιλεία 在末世承受产业的语境中指“国”还是“统治”
  choice: 译为“国”。
  alternative: 译为“王权”或“统治”。
  rationale: “承受”和“为你们预备”使国度领域的含义在此更为突出；“国”也仍可包含王权和统治的概念。
- issue: ἀπὸ καταβολῆς κόσμου 的句法连接和时间含义
  choice: 将其与“为你们预备好的”相连，译为“自创世以来为你们预备好的国”。
  alternative: 译为“从创世之时起为你们预备的国”，或较宽泛地理解为修饰整个邀请。
  rationale: 它在句法上最自然地修饰相邻的“预备好的”；此译法保留从创世起预备国度的含义，而不把本节扩展成某种特定的预定论体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“王”与“承受……国”保持宣告式语气；不添加“永恒”“天上”等原文未明说的限定。引号内用“来吧”和感叹号传达召唤的力度，但不夸张语气。
