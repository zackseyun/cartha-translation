id: MAT.25.35
reference: Matthew 25:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: zh_hans
  text: 因为我饿了，你们给我吃的；我渴了，你们给我喝的；我是陌生人，你们接待了我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们收留了我。”这里的希腊语动词本义是“聚集”或“带到一起”，在此指以善意接纳、款待陌生人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: 我饿了
  rationale: 以现代汉语自然表达过去经历的饥饿状态，不采用生硬的“我饥饿”。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对上文的解释，保留原文的因果衔接。
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: 你们给我吃的
  rationale: 自然表达“给某人东西吃”的结构，既不拘泥于字面，也不把所给之物具体化为原文未明说的某种食物。
- source_word: ἐδίψησα
  choice: 我渴了
  rationale: 简洁自然地表达过去经历的口渴状态。
- source_word: ἐποτίσατέ με
  choice: 你们给我喝的
  rationale: 表达给人饮用之物的意思，并与前句“给我吃的”保持平行；不擅自限定为水。
- source_word: ξένος
  choice: 陌生人
  rationale: 保留此词所指的无既有社会关系、需要他人接待之人的宽泛含义，避免把它缩窄为现代法律或政治意义上的“外国人”。
- source_word: συνηγάγετέ με
  choice: 你们接待了我
  rationale: 该动词本义与“聚集、带到一起”有关，但与“陌生人”连用时表达以善意接纳、款待之意；“接待”自然且不过度补入“家中”等原文未明说的信息。
theological_decisions:
- issue: ξένος与συνάγω组合中的款待含义
  choice: 译为“我是陌生人，你们接待了我”
  alternative: “我寄居异乡，你们收留了我”
  rationale: 所强调的是对缺乏原有社会归属之人的怜悯接纳。正文避免把ξένος限定为族裔、国籍或法律身份，也不把接待的具体场所说死；脚注保留“收留”的语义可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三个分句保持紧凑平行；“陌生人”保留原文身份关系上的开放性，“接待”传达款待之意而不加入特定地点。
