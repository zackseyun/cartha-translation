  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: zh_hans
  text: 万国都要聚集在他面前[a]；他要把他们彼此分开，好像牧人把绵羊和小山羊[b]分开一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万国”也可译作“万民”；希腊原文为πάντα τὰ ἔθνη。
    reason: lexical_alternative
  - marker: b
    text: 译作“小山羊”的希腊词ἐρίφων可以特指幼小的山羊；也可较概括地译作“山羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: 都要聚集
  rationale: 该词为将来时被动语态；汉语“聚集”可自然表达众人被汇聚的情景，又不必增添原文未明说的施事者。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 在他面前
  rationale: 直接而自然地保留空间和审判场景中的临在含义。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 保留ἔθνη的群体性和广泛范围；“万国”庄重、简洁，也不把含义收窄为“外邦人”。脚注说明亦可理解为“万民”。
- source_word: ἀφορίσει
  choice: 要……分开
  rationale: 准确表达将一群与另一群区分、隔开的动作。
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: 把他们彼此分开
  rationale: 保留ἀπ’ ἀλλήλων所表达的相互分离关系，不预先解释“他们”内部具体如何分组。
- source_word: ὥσπερ
  choice: 好像……一样
  rationale: 以现代汉语自然、清楚地引出明喻。
- source_word: ὁ ποιμὴν
  choice: 牧人
  rationale: 此处定冠词用于泛指典型的牧人；汉语无需另加量词或定指词。
- source_word: τὰ πρόβατα
  choice: 绵羊
  rationale: 具体保留羊群中“羊”的形象，并与山羊形成清楚对照。
- source_word: τῶν ἐρίφων
  choice: 山羊羔
  rationale: ἔριφος通常指幼小的山羊；“山羊羔”既保留其具体含义，也避免现代汉语中“孩子”等歧义。
theological_decisions:
- issue: πάντα τὰ ἔθνη的范围
  choice: 万国
  alternative: 万民；所有外邦人
  rationale: 译文保留该短语在末世审判语境中的广泛性，不将其限定为外邦人，也不替文本决定其所指是政治民族还是各族人民。
- issue: αὐτούς所指对象及分组方式
  choice: 把他们彼此分开
  alternative: 把万民分成两群
  rationale: 紧随原文代词与相互关系的表达，不增添“两群”等虽由比喻可推知、却未在本分句明说的解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“万国”延续经文语体而不过度古雅；分号呈现两个相连的主要动作。“好像……一样”使牧人比喻在现代汉语中自然清楚。
