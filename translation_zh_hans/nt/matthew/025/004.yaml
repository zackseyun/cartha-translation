  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: zh_hans
  text: 但聪明的把油装在容器里，连同自己的灯一起带着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灯”或译“火把”；希腊文 lampadas 按语境可指灯或火把。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: 聪明的
  rationale: 表示有实际判断力、行事明智的人；“聪明的”自然承接上下文与“愚拙的”之间的对照，又不把含义缩减为仅仅“有准备的”。
- source_word: ἔλαβον
  choice: 带着
  rationale: 在叙事语境中表示随身带上；译作“带着”比“拿了”更自然，也不误作“领受”。
- source_word: ἔλαιον
  choice: 油
  rationale: 原词通常指油，往往是橄榄油；正文用泛称“油”，避免加入原文未明说的种类。
- source_word: ἀγγείοις
  choice: 容器
  rationale: 原词泛指盛放物品的器皿，并未限定形状或材质；“容器”保留其概括性。
- source_word: λαμπάδων
  choice: 灯
  rationale: λαμπάς可指灯或火把；本段提到另带油，“灯”是自然且传统的译法，但“火把”仍是可成立的词义，故收入脚注。
- source_word: ἑαυτῶν
  choice: （体现在“带着灯”中）
  rationale: 反身代词表明灯属于这些女子；现代汉语在主语明确时通常不必另加“自己的”，否则略显累赘。
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: 带着灯，又……
  rationale: μετά加属格表示伴随。汉语用“带着灯，又用容器装了油”自然表达她们除灯以外也携带装在容器中的油。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但”保留与上一节的转折；调整语序以符合现代汉语表达，同时保留油装在容器中并与灯一同携带的意思。
