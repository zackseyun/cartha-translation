id: MAT.25.29
reference: Matthew 25:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: zh_hans
  text: 因为凡有的，还要给他，并且他会有余；但从那没有的人，连他所有的也要被拿走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: 因为凡有的
  rationale: γάρ承接上文作解释，译为“因为”；带冠词的分词与παντί构成泛指、分配性的表达，译作“凡有的”，既简洁自然，也保留原文未明说“有什么”的开放性。
- source_word: δοθήσεται
  choice: 还要给他
  rationale: 这是δίδωμι的将来时被动形式。汉语用无主句“还要给他”自然表达被动意义；“还”体现进一步加给。
- source_word: καὶ περισσευθήσεται
  choice: 使他有余
  rationale: περισσεύω在此表示达到丰裕、有余的状态。译作“使他有余”自然地呈现前一被动动作所带来的结果，同时保留“富余、超过所需”的含义。
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: 但那没有的
  rationale: δέ标明鲜明对比；带冠词的否定分词是泛指的单数实体表达。译作“那没有的”保留代表性单数及原文未交代缺少何物的含蓄。
- source_word: καὶ ὃ ἔχει
  choice: 连他所有的也
  rationale: καί在这里有递进意味，译为“连……也”，突出“没有”之人竟仍会失去现有之物的反常张力。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 要从他那里夺去
  rationale: αἴρω在此意为拿走、除去，ἀπό表示从某人处离开。译作“从他那里夺去”保留将来被动意义及剥夺色彩。
theological_decisions:
- issue: “有”与“没有”的所指
  choice: 不补出恩赐、才干、信心或忠心等具体宾语
  alternative: 按比喻语境明确译为“有所得／善用所得”或某一种属灵品质
  rationale: 希腊文只用ἔχω而未明说宾语。保留这种省略，可让本节继续由上下文界定，也避免把某一解释直接写入正文。
- issue: 泛指阳性单数结构
  choice: 采用“凡有的……他／那没有的……他”
  alternative: 改用复数“凡有的人……他们”或完全回避代词
  rationale: 原文以阳性单数分词作泛指。现代汉语中的“他”可承担代表性单数功能，既不限定实际适用对象的性别，也保留两类个体之间的修辞对照。
- issue: 施予者与夺取者未明说
  choice: 使用汉语无主结构，不补出“上帝”或“主人”
  alternative: 明确译为“上帝还要给他／要从他那里夺去”
  rationale: 原文使用神学被动或未明施事的被动形式。正文不替原文确定行动者，可保存其叙事及神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留格言式的紧凑对称：“凡有的”与“那没有的”、“给”与“夺去”相对。中文“有余”准确表达περισσευθήσεται的丰裕结果，无需脚注；本节没有脚注标记。
