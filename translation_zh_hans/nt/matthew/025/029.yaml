review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现γάρ的解释关系、两类泛指对象的对比、将来被动的“给／夺去”，以及“连……也”的递进语气。惟“使他有余”在汉语中较强地把后半句处理成明确的使役结果；原文καὶ περισσευθήσεται更直接是“并且他将有余／丰足”的并列将来陈述。
  naturalness: “凡有的”简练自然；但“那没有的”在现代汉语中略显悬空，容易首先被理解为“那个没有的东西”。补出原文已由阳性分词所指的人称范畴为“那没有的人”，不增加所“有”的内容，表达更清楚自然。
  terminology: 不补足“有／没有”的宾语是恰当的，也不应指定施事者。“拿走”比“夺去”更中性，较贴近αἴρω在此“取去、移除”的基本义，避免额外加强暴力或抢夺的色彩。
  issues:
  - severity: low
    issue: “使他有余”带有较明确的使役关系。
    rationale: περισσευθήσεται是与δοθήσεται并列的将来式，意为“将有余、将丰足”；中文改为“并且他会有余”更直接保留其句法独立性。
  - severity: low
    issue: “那没有的”在现代普通话中指人不够明确。
    rationale: 希腊文带冠词的阳性分词明确指“那没有的人”。译为“那没有的人”使指称清楚，同时仍保留未说明缺少何物的开放性。
  - severity: low
    issue: “夺去”略强化αἴρω的语气。
    rationale: 此处αἴρω的核心意义是拿走或移除；“拿走”保持惩戒性后果而不额外引入抢夺或暴力的语感。
  revised_text: 因为凡有的，还要给他，并且他会有余；但从那没有的人，连他所有的也要被拿走。
