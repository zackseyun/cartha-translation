  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: zh_hans
  text: 那领了两他连得的也上前来，说：“主啊[a]，你交给我两他连得[b]。请看，我又赚了两他连得。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主人”。希腊语 κύριος 通常译作“主”；在这个比喻中，也可用作仆人对主人的尊称。
    reason: alternative_reading
  - marker: b
    text: “他连得”是古代很大的重量和货币计算单位，并不是指人的天赋或才干。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前来
  rationale: 该词是 προσέρχομαι 的不定过去时分词，表示仆人走近主人并开口禀报；“上前来”自然地保留了趋近的动作。
- source_word: δὲ καὶ
  choice: 也
  rationale: 这里承接前一位仆人的禀报，并突出这位领两他连得的人同样前来；汉语用“也”即可自然表达递进与并列。
- source_word: ὁ τὰ δύο τάλαντα
  choice: 那领了两他连得的
  rationale: 原文以冠词加宾语短语指称这名仆人；“领了”依据紧邻语境补出其受领钱财的关系，使现代汉语清楚顺畅。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 的呼格。在比喻的社会场景中可指主人，但“主”既是该词的常规对应，也保留其可能具有的更深叙事意涵；“啊”自然标示呼语。
- source_word: παρέδωκας
  choice: 交给
  rationale: παραδίδωμι 表示交付、交在某人手中；“交给”保留具体的交付动作，而不把受托管理的含义过度明说。
- source_word: ἴδε
  choice: 请看
  rationale: 该命令式用来引导对方注意眼前成果；“请看”符合仆人对主人说话时的恭敬语气，也保留了指示功能。
- source_word: ἄλλα δύο τάλαντα
  choice: 又……两他连得
  rationale: ἄλλα 与数词连用，表示同等数量的额外所得；汉语以“又赚了两他连得”自然表达“另外两个”。
- source_word: ἐκέρδησα
  choice: 赚了
  rationale: κερδαίνω 在钱财语境中表示赚取、获利；“赚了”比泛称“得了”更准确，也未限定具体经营方式。
- source_word: τάλαντα
  choice: 他连得
  rationale: τάλαντον 是古代很大的重量及货币计算单位。采用传统音译“他连得”以保留原文文化称谓，并用脚注说明它不是现代所说的才干。
theological_decisions:
- issue: 比喻中称呼 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 眼前情境确实是仆人称呼主人，因此“主人”在语义上成立；但译作“主”更直接对应 κύριος，并保留比喻叙事可能产生的神学回响，而不在正文中把含义限死。脚注列出“主人”这一语境译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上前来”“交给”“请看”“赚了”均为当代普通读者自然可懂的表达；保留“他连得”这一传统文化术语，并借脚注避免与现代“才能”概念混淆。
