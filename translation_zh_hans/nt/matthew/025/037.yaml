  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: zh_hans
  text: 那时，义人要回答他，说：“主啊，我们什么时候见你饿了，给你吃的，或见你渴了，给你喝的呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间副词，承接审判场景中接续发生的对话；“那时”自然且庄重。
- source_word: ἀποκριθήσονται αὐτῷ
  choice: 就回答他说
  rationale: 将未来时态依上下文表达为将来场景中的接续动作；“回答他说”保留了间接宾语 αὐτῷ，也自然引出后面的直接引语。
- source_word: οἱ δίκαιοι
  choice: 义人
  rationale: 该形容词名词化，指场景中被认定为义的人；“义人”是简明、通行且不额外解释其称义方式的译法。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 在直接称呼中的尊称及其基督论意蕴；“啊”符合现代汉语呼格表达。
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: 饿了，就给你吃的
  rationale: πεινῶντα 描述所看见的状态，τρέφω 表示供养、喂食；此译具体自然，不增添“吃饱”等原文未明说的结果。
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: 渴了，就给你喝的
  rationale: ἐποτίσαμεν 是 ποτίζω 的简单过去时，意为给人喝；“给你喝的”自然保留具体行动，并与前句形成平行。
theological_decisions:
- issue: 直接称呼耶稣时 κύριος 的译法
  choice: 主啊
  alternative: 主人啊
  rationale: “主”既能表达尊敬，也保留马太福音语境中可能具有的基督论分量，同时不把这一称呼限定为普通主仆关系。
- issue: οἱ δίκαιοι 的身份含义
  choice: 义人
  alternative: 公义的人
  rationale: 采用传统而清楚的名词化表达，不在译文中进一步说明他们为何或如何被视为义，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。以“给你吃的／给你喝的”构成自然平行，避免生硬直译，也不加入原文没有的食物种类、饮料或饱足结果。
