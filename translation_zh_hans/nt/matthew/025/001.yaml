  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: zh_hans
  text: 那时，天国将好比十个童女[a]；她们拿着自己的灯[b]，出去迎接新郎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将好比”按原文也可译作“将被比作”；原文动词是将来时被动语态。
    reason: 保留比喻引介公式的将来时、被动语态及可译空间。
  - marker: b
    text: “灯”或译“火把”；原词可指婚礼行列中手持的光源。
    reason: 原词在此语境中可指灯或火把，具体形制不能完全确定。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间和篇章衔接语，承接前文末世性的警醒教导；“那时”自然地保留了这一联系。
- source_word: ὁμοιωθήσεται
  choice: 好比
  rationale: 原文是将来时被动语态，直译可作“将被比作”；汉语比喻引介式“好比”更自然，并以脚注保留被动形式的语法信息。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: 这是《马太福音》的常用表达；“天国”是现代汉语中简洁、通行且庄重的对应语。
- source_word: δέκα παρθένοις
  choice: 十个童女
  rationale: παρθένος在婚礼语境中指未婚年轻女子，并含童贞之意；“童女”比“少女”更直接保留其词义，又符合圣经汉语语体。
- source_word: αἵτινες
  choice: 她们
  rationale: 承接“十个童女”引出描述性关系从句；拆为分句后用“她们”符合自然汉语。
- source_word: λαβοῦσαι
  choice: 拿着
  rationale: 不定过去时分词表示先于或伴随主要动作的行动；“拿着……出去”在汉语中自然呈现其动作关系。
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: 自己的灯
  rationale: λαμπάς可指灯或火把；正文采用传统且易懂的“灯”，而反身代词以“自己的”明确表达。
- source_word: ἐξῆλθον
  choice: 出去
  rationale: 准确表达向外移动，且是自然现代汉语。
- source_word: εἰς ὑπάντησιν
  choice: 迎接
  rationale: 这一惯用结构表示出去与来者相会并接迎；婚礼场景中“迎接”比单纯“去见”更贴切。
- source_word: τοῦ νυμφίου
  choice: 新郎
  rationale: νυμφίος在婚礼语境中特指新郎；“新郎”是现代汉语准确、通行的对应词。
theological_decisions:
- issue: 比喻引介公式的语态
  choice: 天国好比十个童女
  alternative: 天国将被比作十个童女
  rationale: 正文采用自然汉语表达比喻关系，同时不把比喻对象解释为某一单独人物或特质；脚注保留原文将来时被动语态，避免掩盖其形式。
- issue: παρθένοις的译法
  choice: 童女
  alternative: 少女；未婚女子
  rationale: “童女”保留原词在婚礼语境中的未婚及童贞含义，不将其泛化为仅指年龄的“少女”，也不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“好比”自然引入比喻，用脚注保存原文被动语态；“童女”保留词义特征，“灯”则以脚注注明“火把”的可能性。
