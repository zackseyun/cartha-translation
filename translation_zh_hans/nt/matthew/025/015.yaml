  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: zh_hans
  text: 他给一个人五他连得[a]，给另一个人两个，又给另一个人一个，按各人自己的能力；他随即[b]出门远行了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代很大的重量和货币单位；这里指一大笔钱财，并不是指人的天赋或才能。
    reason: lexical_clarification
  - marker: b
    text: “随即”所对应的希腊词也可与下一句相连，译作：“那领了五他连得的立刻去……”
    reason: textual_syntactical_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: 他连得
  rationale: 这是古代很大的重量及货币单位；采用音译可保留历史语境和比喻中的专门称谓，同时以脚注防止读者误解为现代汉语所说的天赋或才能。
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: 给一个人……给另一个人……又给另一个人
  rationale: 自然呈现希腊文的分配结构及 μέν/δέ 所标示的递进对照。
- source_word: ἕν
  choice: 一个
  rationale: 承接前文的“他连得”，名词可自然省略，不损失意义。
- source_word: ἑκάστῳ
  choice: 各人
  rationale: 准确表达与格单数的分配含义，也符合现代汉语习惯。
- source_word: κατὰ τὴν ἰδίαν δύναμιν
  choice: 按照各人自己的能力
  rationale: δύναμις 在此指个人承受或经营所托财物的能力，并非神迹能力；“各人自己的”保留 ἑκάστῳ 与 ἰδίαν 的分配及反身意味。
- source_word: ἀπεδήμησεν
  choice: 出门远行了
  rationale: 该动词指离家外出、远行；此译比单纯“离开”更充分保留旅行语义。
- source_word: εὐθέως
  choice: 随后就
  rationale: 正文分节在此存在句法归属的真实歧义；将其与远行相连，并用“就”表达紧接发生，保持自然汉语，同时以脚注说明另一种断句。
theological_decisions:
- issue: κατὰ τὴν ἰδίαν δύναμιν 的分配性所指
  choice: 按照各人自己的能力
  alternative: 按照他自己的能力
  rationale: 希腊文以单数分配结构表达每一位仆人的个人能力。汉语“各人自己的”既保留单数分配意味，又避免代词指向含混，不改变神学含义。
- issue: τάλαντα 在比喻中的含义
  choice: 作为古代巨额货币单位的“他连得”
  alternative: 大笔钱财
  rationale: 上下文讲主人托付财产，不能让现代读者把“他连得”理解为天赋才能；音译保留历史术语，脚注明确其财物含义。
- issue: εὐθέως 的句法归属
  choice: 修饰主人远行
  alternative: 修饰下一节仆人的行动
  rationale: 所给 SBLGNT 文本将 εὐθέως 置于本节末，形式上可与前句或后句连接。正文依当前分节把它理解为主人随即远行，但以脚注保留另一种断句，以免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他连得”为圣经历史术语，配合解释性脚注；其余句式尽量自然简洁。所有脚注标记均已在正文出现。
