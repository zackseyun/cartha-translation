  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: zh_hans
  text: 那时，他们也要回答说：“主啊，我们什么时候见你饿了，或渴了，或作客旅，或赤身露体，或患病，或在监狱里，却没有服事你呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“照料”或“供给所需”（希腊文 διακονέω）。
    reason: 说明该动词包含实际服务、照料和供应需要等语义范围。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示审判场景中的时间推进；“那时”自然、庄重，也与上下文衔接。
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: 他们也要回答说
  rationale: 保留将来时、καὶ αὐτοὶ 的附加强调，以及分词引出直接引语的功能；现代汉语以“回答说”表达最自然。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 在此是对耶稣的直接称呼；“主啊”兼具呼格语气、尊称意味和经文中的基督论回响。
- source_word: πεινῶντα ἢ διψῶντα
  choice: 饿了，或渴了
  rationale: 两个现在分词在 εἴδομεν 后作宾语补足成分，描述所见状态；用汉语状态表达简洁自然。
- source_word: ξένον
  choice: 作客旅
  rationale: 在本段施怜悯的语境中，指身处异地、需要接待的人；“作客旅”保留陌生人、外来者与旅居者之间的语义宽度，且不限定族裔。
- source_word: γυμνὸν
  choice: 赤身露体
  rationale: 直接保留缺少衣物的强烈字面意义，并与本段平行表述相称；不擅自弱化为“衣不蔽体”。
- source_word: ἀσθενῆ
  choice: 患病
  rationale: ἀσθενής 可指软弱或患病；在身体和社会困境并列的清单中，“患病”最符合语境。
- source_word: ἐν φυλακῇ
  choice: 在监里
  rationale: 直接表达处于监禁中的状态，通俗而庄重。
- source_word: οὐ διηκονήσαμέν σοι
  choice: 却没有服事你
  rationale: διακονέω 表示以实际行动服务、照料或供给；“服事”保留其宽泛的服务含义，以及向王所作之事的关系指向，而不将其限缩为教会职务。
theological_decisions:
- issue: κύριος 作为对耶稣的称号
  choice: 主啊
  alternative: 老师啊／主人啊
  rationale: “主”既准确传达尊称，也保留《马太福音》语境中的基督论含义，不额外规定说话者对此称号理解到何种程度。
- issue: διακονέω 在末句中的含义
  choice: 服事你
  alternative: 照料你／伺候你
  rationale: “服事”保留实际援助和服务的广度，并维持本段把对困苦者的行动视为对王所作之事的张力；“照料”可能过度收窄为照护，“伺候”则语体和关系色彩不合。
translation_notes:
  register: 采用现代标准普通话的庄重经文语体。“作客旅”“赤身露体”“服事”略带传统圣经措辞，但仍为普通读者可懂，并有助于保持原文的凝练、平行结构及神学关联。脚注标记置于整句引语之后。
