  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: zh_hans
  text: 所以，你本该把我的钱[a]存放在银行家那里；这样我回来时，我本会连同利息收回我的钱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱”也可译作“银子”；“存放在银行家那里”也可较直译为“把我的银子交给银行家”。
    reason: ἀργύριον可指银子或钱财；βαλεῖν本义为“放、交付”，在本句金融语境中指交存。
lexical_decisions:
- source_word: ἔδει
  choice: 本该
  rationale: 未完成时的非人称动词表示过去本来应当履行却未履行的责任；“本该”自然地保留责备和反事实意味。
- source_word: οὖν
  choice: 所以
  rationale: 表示从前一句责备所得出的推论；“所以”清楚、自然地衔接上下文。
- source_word: βαλεῖν
  choice: 存到
  rationale: βάλλω本义为“放、投入”，但与钱财和τραπεζίταις连用时指把钱交存；“存到”符合现代汉语的金融语境。
- source_word: τὰ ἀργύριά μου
  choice: 我的银钱
  rationale: ἀργύριον既可指银子，也可泛指钱财。“银钱”保留银的具体意象，同时让现代读者明白这里指可交存的钱财。
- source_word: τοῖς τραπεζίταις
  choice: 钱庄
  rationale: τραπεζίτης指经营兑钱或存贷业务的人；本句提到利息，故采用能自然表达此类机构和从业者的“钱庄”，而不限定为现代银行。
- source_word: ἐλθὼν ἐγὼ
  choice: 等我回来
  rationale: 不定过去时分词相对于主句表示时间先后；“等我回来”在汉语中自然表达主人返回后收款的情景。
- source_word: ἐκομισάμην ἂν
  choice: 就可以……收回
  rationale: 中间语态的κομίζω在此有“为自己取回、收回”之意，配合ἄν表达未实现情形下本会出现的结果；“就可以……收回”保留这一反事实意味。
- source_word: τὸ ἐμὸν
  choice: 属于我的
  rationale: 名词化的所有格强调主人所有之物；“属于我的”保留此所有权重点，而不擅自缩窄为某一种钱款。
- source_word: σὺν τόκῳ
  choice: 连本带利
  rationale: τόκος在此指钱款产生的利息。“连本带利”是自然、准确的现代汉语表达，并不带“高利贷”的额外贬义。
theological_decisions:
- issue: 比喻中的金融措辞是否构成对收取利息的一般道德判断
  choice: 按比喻中的普通经济场景中性翻译，不暗示经文赞同或谴责一切收息行为。
  alternative: 用“高利”或带贬义的措辞，使译文进入后世关于放贷取息的道德争论。
  rationale: 本节借交存钱财并取得利息说明比喻中的责任；原文在此没有对所有收息行为作普遍伦理裁决，译文不应加入该判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“本该”体现责备语气，“钱庄”避免把古代τραπεζίταις完全现代化为今日银行；“连本带利”简洁呈现本金与利息，同时保持金融措辞的中性。
