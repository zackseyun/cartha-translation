  terminology: ἀργύρια在此金融语境中译为“钱”清楚自然；脚注保留“银子”的字面可能及“存放”的较直译表达。τραπεζίταις宜译为“银行家”而非“钱庄”，以保留原文所指的人。τόκος译为“利息”中性准确，不引入对取息的伦理判断。
