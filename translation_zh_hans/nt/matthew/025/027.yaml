- from: 所以，你本该把我的银钱[a]存到钱庄；等我回来，就可以连本带利收回属于我的了。
  to: 所以，你本该把我的钱[a]存放在银行家那里；这样我回来时，我本会连同利息收回我的钱。
  rationale: 修订将τραπεζίταις译为指人的“银行家”，避免把原文的从业者改为机构；并以“我本会”明确保留ἄν所表达的未实现结果。其余措辞维持庄重、自然的现代汉语，并以“利息”中性处理比喻中的金融语言。
