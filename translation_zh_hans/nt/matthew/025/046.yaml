  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: zh_hans
  text: 这些人要离去，进入永远的刑罚中[a]；义人却要进入永远的生命中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按某种有争议的理解译：“一个时代的刑罚……一个时代的生命。”形容词αἰώνιος在某些语境中的含义存有争议；但本句用同一个词修饰“刑罚”和“生命”，所以正文两处都译作“永远的”，以保留原文的平行结构。
    reason: 词义上的另一种译法
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: 要离去
  rationale: 这是ἀπέρχομαι的将来时形式，表示离开、前往；“要离去”自然地保留了动作及其结果，而不增添原文没有的解释。
- source_word: οὗτοι
  choice: 这些人
  rationale: 指回前文刚刚描述的那一群人；汉语补出“人”可使指代清楚，同时保持与“义人”的简洁对照。
- source_word: κόλασιν
  choice: 刑罚
  rationale: 在末后审判的语境中，此词指惩罚性的后果；“刑罚”庄重、明确，也比“管教”更符合上下文。
- source_word: αἰώνιον
  choice: 永远的
  rationale: 同一个形容词分别修饰“刑罚”和“生命”；两处都译为“永远的”，既自然，也保留希腊文严整的平行结构。有关“历世的”这一词义理解，列于脚注。
- source_word: δίκαιοι
  choice: 义人
  rationale: 形容词作名词使用，指被算为义或以义为特征的人；“义人”是简明、通行且能保留道德与盟约意味的表达。
- source_word: ζωὴν
  choice: 生命
  rationale: 这是ζωή的常规对应词；本节无需增译其性质或状态。
- source_word: δὲ
  choice: 却
  rationale: 此词在这里标明两群人及其结局之间的对照；“却”能以自然汉语清楚表达这种转折。
theological_decisions:
- issue: 如何翻译κόλασιν αἰώνιον和ζωὴν αἰώνιον中成对出现的αἰώνιον
  choice: 两处都译为“永远的”
  alternative: 两处都译为“历世的”或“长达世代的”
  rationale: 同一个形容词在同一句中同时修饰“刑罚”和“生命”，因此译文不应在两处赋予不同的时限或性质。“永远的”是现代汉语中最自然、通行且有词义依据的译法；脚注保留另一种有争议的词义理解，而不替读者消除原词所引发的讨论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“进入”在第二分句中补出，以符合汉语表达并清楚呈现两个并列结局；分号强化原句两部分的对称和对照。
