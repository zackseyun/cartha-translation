  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: zh_hans
  text: 他却回答说：“我实在告诉你们，我不认识你们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不认得你们。”原文的动词通常意为“知道”；此处直译为“我不认识你们”，在本段语境中可含有关系上的不承认之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: 他却回答说
  rationale: 保留分词加限定动词的叙事表达，同时用“却”体现 δέ 与前文恳求之间的转折；“回答说”在现代汉语中自然且庄重。
- source_word: Ἀμὴν
  choice: 实在
  rationale: 在符类福音固定句式中，“我实在告诉你们”清楚表达郑重断言，也比音译“阿们”更适合现代汉语正文。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然地保留第一人称陈述和对复数对象的直接称呼。
- source_word: οὐκ οἶδα
  choice: 我不认识
  rationale: οἶδα 的基本意义是“知道、认识”。此处“认识”既符合人物相认的语境，也可承载关系上的否认，而不把隐含意义扩写成明确教义判断。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确表达第二人称复数宾语，适合对童女群体的称呼。
theological_decisions:
- issue: 比喻中“οὐκ οἶδα ὑμᾶς”的分量
  choice: 正文译作“我不认识你们”，保留其关系性否认和排拒意味，但不进一步解释。
  alternative: “我不认得你们”或“我与你们没有关系”
  rationale: 原文措辞简洁，却在上下文中具有沉重的关系和排拒含义。“我与你们没有关系”解释过度；正文保留较直译的表达，更能维持原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实在告诉你们”沿用读者熟悉的福音书郑重宣告句式；“不认识”保持简洁，并借脚注说明词义范围，不在正文中消解原文的含蓄与张力。
