  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: zh_hans
  text: 于是，那些童女全都起来，整理好自己的灯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“火把”。希腊词λαμπάς可指手持的灯或火把；本段提到油和预备，两种理解都有可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中紧接着发生的事；“于是”自然地承接上文并推进情节。
- source_word: ἠγέρθησαν
  choice: 起来
  rationale: 在睡眠和随后行动的语境中，指从睡卧状态起身；希腊语被动形式在此不必译成“被唤醒”。
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: 那些童女全都
  rationale: παρθένοι直接指未婚的贞洁女子；“童女”保留婚礼语境中的词义特征，“全都”准确表达πᾶσαι。
- source_word: ἐκόσμησαν
  choice: 整理好
  rationale: κοσμέω基本义为整理、使之有序；用于灯时指为使用作好准备，可能包括整理灯芯，但原文没有明说具体步骤，因此不窄化为“修剪灯芯”。
- source_word: λαμπάδας
  choice: 灯
  rationale: λαμπάς可指灯或火把；下文提到油和预备，正文采用自然且符合语境的“灯”，同时以脚注保留“火把”的可能。
- source_word: ἑαυτῶν
  choice: 自己的
  rationale: 反身代词表示这些灯属于童女本人；汉语用“自己的”自然地体现反身关系。
theological_decisions: []
