  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: zh_hans
  text: 同样，那领了两个的又赚了两个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照样，那有两个的又得了两个。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: 同样
  rationale: 承接第16节，将这个仆人的行动与前一个仆人的行动相比较；“同样”简洁自然，并保留原文的比较作用。
- source_word: ὁ τὰ δύο
  choice: 那领了两个的
  rationale: 原文是带宾语短语的省略表达，按上下文指领了两个他连得的仆人；中文补出“领了”可自然地标明所指，又不过度补入原文没有的信息。
- source_word: ἐκέρδησεν
  choice: 赚了
  rationale: 在钱财经营的语境中表示通过活动获得额外收益；“赚了”符合现代汉语习惯，也比“挣得”更少带有工资报酬的意味。
- source_word: ἄλλα δύο
  choice: 又赚了两个
  rationale: ἄλλα δύο表示同类事物中额外的两个；以“又……两个”清楚表达增加之意，并自然承接动词。
theological_decisions: []
