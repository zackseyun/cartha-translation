  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: zh_hans
  text: 主人对他说：“做得好，你这良善又忠心的仆人[a]！你在少许事上忠心，我要派你管理许多事。进入你主人的喜乐中吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴隶”。希腊语δοῦλος可按语境指仆人或奴隶。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: 对他说
  rationale: 自然准确地表达叙事中的直接引语引介。
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: 他的主人／你主人的
  rationale: 寓言情境中指仆人的主人；译作“主人”既符合人物关系，也不提前把寓意中的人物直接标题化为“主”。
- source_word: Εὖ
  choice: 做得好
  rationale: 这是现代汉语中自然的称许语，准确传达评价性的赞许。
- source_word: δοῦλε
  choice: 仆人
  rationale: 既保留上下从属关系，也符合现代中文寓言叙述；希腊词也可指奴隶，相关语义以脚注说明。
- source_word: ἀγαθὲ καὶ πιστέ
  choice: 又良善又忠心
  rationale: 准确传达两个并列的呼格形容词，并使“忠心”与下文πιστός保持词汇呼应。
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: 你在少许的事上忠心
  rationale: 保留原文“少许”与下文“许多”的数量对比，同时表达受托责任的范围。
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: 我要派你管理许多的事
  rationale: καθίστημι在此表示委派、使其负责；“派你管理”自然清楚地传达扩大职责之意。
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: 进来享受……的喜乐吧
  rationale: 保留“进入”的空间意象，同时以“享受”表达进入喜乐即参与其中的自然汉语含义。
theological_decisions:
- issue: 寓言中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 故事层面所指是仆人的主人。采用“主人”避免直接将其处理为神圣称号，同时不妨碍读者从上下文理解寓言的神学意义。
- issue: δοῦλος在本节的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 本节重点是受托者的忠心及所得称许，“仆人”在现代中文中自然且保留从属关系；“奴隶”这一可能语义用脚注保留。
- issue: εἴσελθε εἰς τὴν χαρὰν的意象
  choice: 进来享受你主人的喜乐
  alternative: 进入你主人的喜乐
  rationale: “进来”保留原文进入的意象，“享受”使现代中文明确表达参与主人喜乐的含义，而不把喜乐仅解释为奖赏或筵席。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。称许语用“做得好”，责任范围用“少许的事／许多的事”形成原文的平行对照；句末“吧”使命令兼具邀请和接纳的语气。
