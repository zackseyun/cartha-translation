  source_fidelity: 草稿在主要词义上大体准确，但将SBLGNT正文未出现的“来了”加入直接引语，改变了所给底本的文本。所给希腊文为“看，新郎！出来迎接他！”；不能把可能的异读当作正文，并以“有些抄本没有”倒置说明。
