  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: zh_hans
  text: 到了半夜，忽然响起一声呼喊：“看，新郎！出来迎接他！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: 半夜却
  rationale: μέσης νυκτός是表示时间的习语，意为“半夜”；δέ在叙事中作轻微转折，用“却”自然承接前文。
- source_word: κραυγὴ γέγονεν
  choice: 有人喊道
  rationale: 该表达指喊声突然出现；现代汉语用“有人喊道”自然清楚，也保留事件突发的效果。
- source_word: Ἰδοὺ
  choice: 看
  rationale: ἰδού是引人注意的提示语；“看”简洁、现代，保留其呼唤听者注意的语用功能。
- source_word: ὁ νυμφίος
  choice: 新郎
  rationale: νυμφίος在婚礼语境中特指新郎；“新郎”是现代汉语直接而明确的对应词。
- source_word: ἐξέρχεσθε
  choice: 出来
  rationale: 该复数命令式可表示“出去／出来”；这里是向听见呼喊的人发出召唤，“出来”在汉语直接引语中更自然。
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: 迎接他
  rationale: 这一习语表示出去与来者相会；在婚礼行列的语境中，“迎接他”比单纯“去见他”更准确自然。
theological_decisions:
- issue: νυμφίος在比喻中的指代
  choice: 译作普通名词“新郎”，不加特殊标示，也不在正文中明说其代表基督
  alternative: 译作带有尊称意味的“新郎”或直接解释为基督
  rationale: 本节处于比喻的叙事层面，只明说“新郎”；保留这一文学层次，可避免把上下文中的神学指向直接写进译文。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“有人喊道”适合可朗读的直接引语；“新郎”保留婚礼意象。正文中的“来了”依据SBLGNT在νυμφίος后的文本变异标记予以保留，并用脚注交代省略该词的抄本读法。
