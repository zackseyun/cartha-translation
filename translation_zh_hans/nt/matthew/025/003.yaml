base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: zh_hans
  text: 因为那些愚拙的拿了灯，却没有随身带油。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节，说明她们为何被称为愚拙；现代汉语中用“因为”自然保留解释性的连接作用。
- source_word: μωραὶ
  choice: 那些愚拙的
  rationale: 阴性复数形容词在此名词化，回指上文的童女；不重复“童女”，同时保留希腊文简洁的指称。
- source_word: λαβοῦσαι
  choice: 拿着
  rationale: 不定过去时分词与主句动作相关；“拿着”在汉语中自然表达她们携灯而行的情形，并与下文“带油”形成对照。
- source_word: λαμπάδας
  choice: 灯
  rationale: λαμπάς可指灯或火把；本段明确提到油，正文采用传统且自然的“灯”，并以脚注保留“火把”这一可能译法。
- source_word: οὐκ ἔλαβον
  choice: 却没有……带
  rationale: 译出否定，并用“却”凸显拿灯而未带油的反差；“带”比重复“拿”更符合现代汉语表达。
- source_word: μεθ’ ἑαυτῶν
  choice: 随身
  rationale: 自然表达反身短语“与她们自己一道”，即携带在身边。
- source_word: ἔλαιον
  choice: 油
  rationale: 直接对应原文，语境中指供灯燃烧的油。
