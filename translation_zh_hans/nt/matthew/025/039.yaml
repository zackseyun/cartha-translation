  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: zh_hans
  text: 我们什么时候见你病了，或在监牢里，并到你那里去呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并去探望你呢？”希腊文较直译为“并到你那里去呢？”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: 什么时候
  rationale: 疑问副词，询问这些行动发生的时间；“什么时候”是现代汉语直接问句中自然、准确的表达。
- source_word: δέ
  choice: 不单独译出
  rationale: 此处是连续问句中的轻微连接词。汉语承接上文时无需机械译作“而”或“又”，省略更自然，且不损害语义。
- source_word: εἴδομεν
  choice: 见
  rationale: 不定过去时在此指过去所见之事；汉语借上下文和问句表达过去指向，无须另加“曾经”。
- source_word: ἀσθενοῦντα
  choice: 病了
  rationale: 分词在此描述身体患病的状态，与上下文的饥饿、口渴、缺衣和被囚并列；“病了”比宽泛的“软弱”更准确。
- source_word: ἐν φυλακῇ
  choice: 在监牢里
  rationale: 指处于拘禁之所。“监牢”庄重且易懂，也避免现代法律语境中“看守所”等更具体的区分。
- source_word: ἤλθομεν πρός σε
  choice: 到你那里去
  rationale: 原文直译为“来到你那里”。在对耶稣说话的汉语视角中，“到你那里去”自然地表达朝向对方而去，并保留原文动作的朴素性，不直接解释成“探望”。
theological_decisions:
- issue: ἤλθομεν πρός σε 应译为一般性的“到你那里去”，还是更具体的“探望你”
  choice: 到你那里去
  alternative: 探望你
  rationale: 经文语境确实涉及向被囚者施怜悯，但希腊文使用的是表示来到某人那里的一般表达，并非明确表示探望的专门动词。正文保留较贴近原文的说法，脚注列出符合语境的惯用译法，以免把解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而口语自然的直接问句。“或”对应两个处境之间的选择关系；“就”使“见到”与“到那里去”的行动衔接符合现代汉语习惯。保留问句中的惊讶与不知情语气，不额外补入施助、照顾等原文未明说的内容。
