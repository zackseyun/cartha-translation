id: MAT.25.38
reference: Matthew 25:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: zh_hans
  text: 我们什么时候见你是陌生人[a]，就接待了你[b]；或见你赤身露体[c]，就给你穿上衣服呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外乡人”。原文可指陌生、不相识或圈子之外的人；这里的重点是一个需要接待的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“领进来”或“收纳”；这里指把人接进来，给予款待。
    reason: lexical_alternative
  - marker: c
    text: 或译“衣不蔽体”。原文既可指赤身露体，也可指没有足够衣物遮体。
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: 什么时候
  rationale: 疑问副词，询问这些行为发生在何时；“什么时候”是自然、准确的现代汉语表达。
- source_word: δέ
  choice: （不单独译出）
  rationale: δέ在这里轻微承接上文，汉语借连续问句已能自然体现衔接，若硬译“而”或“但是”会增加原文没有的明显转折。
- source_word: ξένον
  choice: 陌生人
  rationale: ξένος在此指圈子之外、不相识而需要款待的人；“陌生人”保留这种社会关系层面的含义，不限定为外国人。
- source_word: συνηγάγομεν
  choice: 接待了
  rationale: συνάγω本义可指聚集、领进来，在本段语境中指把人接进来并给予款待；“接待”自然地传达好客收纳的行动。
- source_word: γυμνὸν
  choice: 赤身露体
  rationale: γυμνός可指全身裸露，也可指衣不蔽体；“赤身露体”保留直译力度，并以脚注说明较宽的可能含义。
- source_word: περιεβάλομεν
  choice: 给你穿上衣服
  rationale: περιβάλλω在这里是给人披上或穿上衣物；该译法比单用“穿衣”更清楚地表达施助者给对方衣服穿。
theological_decisions:
- issue: 审判比喻中ξένος所指的身份
  choice: 陌生人
  alternative: 外乡人／外国人
  rationale: 原词强调不相识、在群体之外且需要款待的人，并不必然限定国籍或族群；译作“陌生人”避免加入原文未明说的身份界线。
- issue: γυμνός所描述的缺衣程度
  choice: 正文译“赤身露体”，脚注保留“衣不蔽体”的可能
  alternative: 衣不蔽体
  rationale: 原词既可表示裸体，也可表示衣着严重不足；正文保留较直接的措辞，同时用脚注维持其语义幅度，不替读者消除原文的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“陌生人”“接待”“给你穿上衣服”便于普通读者理解；句式保留原文连续列举善行的问句结构。所有词义上的真实歧义均由脚注呈现。
