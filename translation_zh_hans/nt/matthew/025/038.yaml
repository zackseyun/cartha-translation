  source_fidelity: 译文准确呈现了原文的两个并列回顾性问句：“何时看见你是陌生人而接待你”，以及“何时看见你缺衣而给你穿衣”。“接待了你”在此处恰当表达 συνηγάγομεν 的款待、收留之意；“给你穿上衣服”准确表达 περιεβάλομεν。
  naturalness: 措辞为自然、庄重的现代标准汉语。"我们什么时候见你是陌生人，就接待了你……呢？"虽略带书面语色彩，但在比喻中的正式问答语境中流畅清楚；两个分句的平行结构也保留良好。
