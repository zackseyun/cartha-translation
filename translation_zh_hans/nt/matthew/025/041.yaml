  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: zh_hans
  text: 那时，他也要对在左边的人说：“你们这些受咒诅的人，离开我，进入那为魔鬼和他的天使所预备的永恒之火。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示审判场景中接续发生的时序，简洁自然。
- source_word: τοῖς ἐξ εὐωνύμων
  choice: 左边的人
  rationale: 结合上文，这是指被安排在王左边的那一群人；采用现代汉语的自然表达。
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: 离开我
  rationale: 命令语气强调与说话者分离；“离开我”准确而有力度，不额外增强原文语气。
- source_word: οἱ κατηραμένοι
  choice: 你们这被咒诅的人
  rationale: 保留完成时被动分词的受动含义，并以适合直接称呼的现代汉语表达。
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: 到……永远之火里去
  rationale: “到……里去”保留εἰς所表达的进入目标；“永远之火”传达αἰώνιον在末世审判语境中的通常含义，同时保持庄重。
- source_word: τὸ ἡτοιμασμένον
  choice: 所预备的
  rationale: 保留完成时被动分词所表达的已经预备妥当并处于此状态的意思。
- source_word: τῷ διαβόλῳ
  choice: 为魔鬼
  rationale: 在此末世审判语境中，διάβολος是对撒但的固定称谓，不宜泛译为“毁谤者”。
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: 他的使者
  rationale: ἄγγελοι在这里指隶属魔鬼的超自然使者；“使者”保留词义，也由语境明确其非人类身份。
theological_decisions:
- issue: 审判语境中αἰώνιον的译法
  choice: 永远之火
  alternative: 永恒的火；属于那时代的火
  rationale: 在本段终末审判语境中，“永远”是该词最通常且最清楚的译法；不借译文进一步界定刑罚性质或建立特定教义体系。
- issue: διάβολος与ἄγγελοι的所指
  choice: 魔鬼和他的使者
  alternative: 毁谤者和他的信使
  rationale: 此处是约定俗成的超自然所指；按普通名词直译会弱化上下文明示的末世性与人格性所指。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留直接宣告的严肃语气，避免文言化的“尔等”“受诅者”，也不加入原文没有的教义解释。
