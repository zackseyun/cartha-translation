  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: zh_hans
  text: 但那领了一他连得银子的人走开了，在地里挖了一个坑，把主人的钱[a]藏了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“把主人的银子藏了起来。”
    reason: 保留ἀργύριον较为字面的“银子”义。
lexical_decisions:
- source_word: ὁ δὲ τὸ ἓν λαβὼν
  choice: 但那领了一他连得银子的
  rationale: δέ承接上文并形成对比，译作“但”；τὸ ἓν按25:15的语境补明为“一他连得银子”，既保留古代计量单位，也让省略的所指清楚；λαβών表示先于后续动作发生的领受。
- source_word: ἀπελθὼν
  choice: 走开
  rationale: 表达离开原处再采取行动的先后关系，现代汉语简洁自然。
- source_word: ὤρυξεν γῆν
  choice: 在地里挖了一个坑
  rationale: 希腊语字面为“挖地”；汉语通常需补出动作结果“一个坑”，才能自然表达埋藏钱财的情景。
- source_word: ἔκρυψεν
  choice: 藏了起来
  rationale: 准确表达κρύπτω的隐藏义，并以趋向补语形成自然的现代汉语叙事。
- source_word: τὸ ἀργύριον
  choice: 钱
  rationale: ἀργύριον既可指银子，也可泛指钱财；此处指主人交托的资金，正文译“钱”最清楚，脚注保留“银子”的字面可能。
- source_word: τοῦ κυρίου αὐτοῦ
  choice: 主人的
  rationale: κύριος在比喻的故事层面指仆人的人间主人，译作“主人”自然准确，不在本句中预先强化为神圣称号。
theological_decisions:
- issue: 比喻叙事中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 直接所指是故事中仆人的主人；“主人”保留权属与主仆关系，同时避免把故事层面的称谓直接处理成神圣头衔。
- issue: τὸ ἀργύριον的物质义与货币义
  choice: 正文译“钱”，脚注注明“银子”
  alternative: 正文译“银子”
  rationale: 原词确有“银子”和“钱财”两义；语境强调受托财物，正文用“钱”便于理解，脚注则保存其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他连得”保留古代大额重量或货币单位，并补出“银子”以避免现代读者误把它当作普通数字；“却”强化本仆人与前两位仆人的行为对比。
