  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: zh_hans
  text: 所以，你们要警醒[a]，因为你们不知道那日子，也不知道那时刻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “警醒”也可译作“保持清醒”或“警觉”。希腊文的命令含有持续警戒的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 现在时主动命令语气、第二人称复数，要求持续保持警觉。“警醒”既保留不睡着的比喻意味，也能自然表达随时预备的劝诫。
- source_word: οὖν
  choice: 所以
  rationale: 承接前面的比喻并引出结论；“所以”在现代汉语中自然、清楚。
- source_word: ὅτι
  choice: 因为
  rationale: 引出命令的原因，直接保留因果关系。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 准确呈现第二人称复数及对“知道”的否定，不增加“确切”等原文没有的限定。
- source_word: τὴν ἡμέραν
  choice: 那日子
  rationale: 保留定冠词所带的特指意味，同时不把上下文所指的事件明说出来。
- source_word: οὐδὲ τὴν ὥραν
  choice: 也不知道那时刻
  rationale: 汉语重复谓语能清楚、自然地表达οὐδέ所连接的第二个否定成分；“时刻”比“小时”更符合此处表示具体时间点的含义。
theological_decisions:
- issue: 警醒命令的比喻意象
  choice: 要警醒
  alternative: 要保持清醒；要警觉；要儆醒
  rationale: “警醒”兼具不睡着和持续警觉的含义，能保留比喻张力而不将其缩减为抽象的心理状态；采用现代常用字“警”，避免较旧的“儆”。
- issue: “那日子、那时刻”的所指范围
  choice: 不在正文中补明所指事件
  alternative: 人子来临的日子和时刻；指定的时间
  rationale: 上下文可帮助读者理解其所指，但本节希腊文只说“那日子”和“那时刻”；译文不加入原文未明说的末世论解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“所以”明示推论关系；“那日子，也不知道那时刻”保留原文表达的含蓄性，并以汉语自然的重复谓语呈现双重未知。
