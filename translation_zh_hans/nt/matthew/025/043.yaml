  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: zh_hans
  text: 我是异乡人，你们没有接待我[a]；我衣不蔽体，你们没有给我衣服穿；我患病或在监狱里，你们没有来探望我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“收留我”“接纳我”。希腊语动词本义为“聚集”，这里指把异乡人接进来，以款待相待。
    reason: lexical_alternative
  - marker: b
    text: “探望”在这里也含有关心、看顾的意思，不只是一般的社交拜访。
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: 异乡人
  rationale: 这里指身处他人群体之外、需要被接纳和款待的人。“异乡人”比“外国人”少了国籍或族裔限定，也比“客人”更能表现其孤立无助的处境。
- source_word: συνηγάγετέ
  choice: 接待
  rationale: συνάγω本义为“聚集”，但与ξένος连用时指把人接进来并给予款待。“接待”自然清楚，并保留好客接纳的含义。
- source_word: γυμνός
  choice: 赤身露体
  rationale: γυμνός可指完全裸体，也可指衣不蔽体；此处与“给我衣服穿”相对。“赤身露体”保留原文强烈直接的表达，而不把意义限缩为仅仅衣着不足。
- source_word: περιεβάλετέ
  choice: 给我衣服穿
  rationale: 该动词本义是“披在周围”，在这里即给人穿衣。“给我衣服穿”符合现代汉语口吻，也明确表达所缺少的怜悯行动。
- source_word: ἀσθενής
  choice: 病了
  rationale: 该词也可泛指软弱，但在这组照料困苦者的行为中，身体患病最符合语境。
- source_word: ἐν φυλακῇ
  choice: 在监牢里
  rationale: φυλακή在此指被监禁的处境。“在监牢里”准确且为普通现代读者容易理解。
- source_word: ἐπεσκέψασθέ
  choice: 来探望
  rationale: ἐπισκέπτομαι指带着关切前去探视，并可含照料之意。“来探望”保留具体行动，同时脚注说明其关怀意味。
theological_decisions:
- issue: ἐπεσκέψασθέ所表达的怜悯行动
  choice: 来探望我
  alternative: 看顾我／照料我
  rationale: “探望”保留原文所指的具体亲身探视，不将它抽象化为一般照料；同时以脚注说明这种探望含有关心和照顾，并非普通社交拜访。
- issue: ξένος的社会身份
  choice: 异乡人
  alternative: 陌生人／外国人／客旅
  rationale: 原词并不必然限定为外国人，也不表示已经成为受欢迎的客人。“异乡人”保留其身处群体之外、需要接纳的脆弱处境，而不加入族裔或国籍判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现三组平行处境；“我病了，又在监牢里”顺承原文紧凑结构，不额外断言患病与被监禁必定同时发生。脚注标记均置于其所解释的词语之后。
