  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: zh_hans
  text: 他的主人[b]对他说：“好，你这良善又忠心的仆人[a]！你在不多的事上忠心，我要委派你管理许多事。进到你主人的喜乐中吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”。希腊语 δοῦλος（doulos）按语境可指仆人或奴仆。
    reason: alternative_reading
  - marker: b
    text: 希腊语 κύριος（kyrios）也可译作“主”；这里译作“主人”，以符合比喻中仆人与主人之间的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: 对他说
  rationale: 按现代汉语叙事习惯表达直接引语的引入语，同时准确保留说话对象。
- source_word: κύριος
  choice: 主人
  rationale: 比喻的直接语境是仆人与其主人之间的关系；“主人”既自然，又不把故事层面的称谓直接处理成基督论头衔。
- source_word: δοῦλε
  choice: 仆人
  rationale: 在本段称赞与委派责任的语境中，“仆人”自然地表达从属和服事关系；原词也可指“奴仆”，故以脚注保留。
- source_word: Εὖ
  choice: 好
  rationale: 这里是主人表示认可的感叹语；“好！”简洁、自然，也保留原文副词式称赞，而不额外补入“做得”。
- source_word: ἀγαθὲ καὶ πιστέ
  choice: 又良善又忠心
  rationale: 分别保留两个并列的品格词，并用自然汉语结构连接。
- source_word: πιστός
  choice: 忠心
  rationale: 与前句的 πιστέ 采用同一译词，保留重复及仆人尽忠可靠的含义。
- source_word: ἐπὶ ὀλίγα
  choice: 在少许的事上
  rationale: 表达受托责任的范围，也保留与后文“许多的事”的数量对比。
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: 我要委派你管理许多的事
  rationale: καθίστημι 在此表示任命、安排承担更大责任；“委派你管理”清楚呈现 ἐπί 所含的管辖关系。
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: 进到……的喜乐中吧
  rationale: 保留“进入”的空间隐喻，不将其释义化为单纯“分享喜乐”。
theological_decisions:
- issue: 比喻中的 κύριος 是否译成带明确神学头衔意味的“主”
  choice: 主人
  alternative: 主
  rationale: 故事表层明确呈现仆人与主人之间的社会关系。译作“主人”不妨碍读者领会比喻所指，却避免在对话中直接加入原文没有明说的基督论头衔。
- issue: δοῦλος 在本节中的身份色彩
  choice: 仆人
  alternative: 奴仆
  rationale: “仆人”适合本段关于忠心服事和受托管理的称赞语境；但 δοῦλος 可指处于奴属身份的人，因此用脚注保留“奴仆”这一可行译法。
- issue: “进入主人的喜乐”应保留隐喻还是解释为参与筵席或救恩
  choice: 保留“进到……喜乐中”的隐喻
  alternative: 分享主人的喜乐／进入主人的筵席
  rationale: 原文没有明说筵席，也没有在本句中解释喜乐的具体所指；保留原有表达可维护比喻的开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好！”保留简洁的称许语气；“委派你管理”清楚表达从较少托付到较多责任的提升；末句保留原文“进入喜乐”的意象。
