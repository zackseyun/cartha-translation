  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: zh_hans
  text: 王要回答他们：“我实在告诉你们[a]：凡你们做在我这些最微小的弟兄中的一个身上的，就是做在我身上了。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我实在告诉你们”更贴近字面的译法是“阿们，我告诉你们”。
    reason: 说明Ἀμὴν λέγω ὑμῖν这一郑重宣告公式的字面形式。
  - marker: b
    text: “我这些最微小的弟兄”可能特指耶稣的门徒，也可能泛指信徒，或更广泛地指弱小、易受伤害的人；原文在这里没有明确裁定。
    reason: 保留“这些弟兄”的所指及其解释空间，不预先决定争议性解释。
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς
  choice: 王要回答他们说
  rationale: 将分词ἀποκριθείς与将来时ἐρεῖ合并为自然的汉语表达，既保留“回答”的回应意味，也保留引出直接引语的“说”。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 用现代汉语中庄重而易懂的固定表达传达耶稣宣告的郑重语气；脚注注明更贴近字面的“阿们”。
- source_word: ἐφ’ ὅσον
  choice: 既
  rationale: 在本句结构中表达行为所及与结论之间的对应关系，汉语简洁自然，同时不把原文自由改写为泛指“无论什么事”。
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: 我这些最微小的弟兄中的一个
  rationale: 保留ἑνί的个体化意味、τούτων的指示性、ἀδελφῶν的阳性复数形式及ἐλαχίστων所表达的卑微或不受重视之意，不预先限定这群人的身份。
- source_word: ἐμοὶ ἐποιήσατε
  choice: 就是做在我身上了
  rationale: 与前一分句“做在……身上”形成平行，直接表达对弟兄所做的事等同于对王所做；“了”使已发生行为的汉语表达自然。
theological_decisions:
- issue: “我这些弟兄”的所指
  choice: 保留“我这些……弟兄”，不指明其专指门徒、泛指信徒，还是更广泛地指弱小者。
  alternative: 译文直接解释为“我的门徒”“所有信徒”或“贫困弱势的人”。
  rationale: 本节措辞本身没有明确裁定相关解释争议；保留原文称谓和指示语，可维持其真实的神学张力。
- issue: ἀδελφῶν的性别表达
  choice: 弟兄
  alternative: 弟兄姊妹；手足；同胞
  rationale: 希腊词为阳性复数；译作“弟兄”既准确反映形式，也避免因所指范围有争议而擅自扩展。
- issue: τῶν ἐλαχίστων的含义范围
  choice: 最微小的
  alternative: 最卑微的；最不重要的；最弱小的
  rationale: “最微小的”可涵盖地位低微、不受重视及弱小等语义，不把原文窄化为单一社会或物质类别。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的标准普通话。“王”依上下文指比喻中的末世君王；中文一般不以大小写标示尊称。“最微小的”保留传统经文语感，但仍为普通读者可理解。
