  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: zh_hans
  text: 所以，从他那里拿走那一他连得[a]，交给那有十他连得的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他那里取去”。希腊语命令式吩咐人把这东西从他那里移走。
    reason: lexical_alternative
  - marker: b
    text: “他连得”是古代很大的重量单位，也用来表示相应数额的钱。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: 拿过来
  rationale: 这是αἴρω的简单过去时主动命令语气复数，在此命令听者把财物从受罚的仆人手中移走；“拿过来”自然地保留命令和移取之意。
- source_word: οὖν
  choice: 所以
  rationale: 表示根据前文判决得出的结论；“所以”在现代汉语中清楚、自然地连接上下文。
- source_word: ἀπ’ αὐτοῦ
  choice: 把他那……拿过来
  rationale: ἀπό加属格表示从那人那里分离或取走；汉语用“把他那……拿过来”自然体现来源关系。
- source_word: τὸ τάλαντον
  choice: 那一他连得
  rationale: 保留古代重量及货币单位的历史称谓，并以“那一”指向前文已提及的特定数额，避免解释成天赋才能。
- source_word: δότε
  choice: 交给
  rationale: δίδωμι的简单过去时主动命令语气复数；在财物转交的语境中，“交给”比单用“给”更明确，同时保留命令力度。
- source_word: τῷ ἔχοντι
  choice: 那……的人
  rationale: 带冠词的分词作名词使用；译作“那……的人”符合现代汉语，并保留特指。
- source_word: τὰ δέκα τάλαντα
  choice: 十他连得
  rationale: 指向叙事中已经提到的特定十他连得；汉语不需另加定冠词即可由“那……的人”表达其特指性。
theological_decisions:
- issue: 比喻中τάλαντον的含义
  choice: 译作古代计量和货币单位“他连得”
  alternative: 银子／一大笔钱
  rationale: 原文指按重量计算、进而作为金额使用的古代单位。保留历史称谓能避免把它直接解释为人的天赋，也不替读者预先确定比喻的属灵对应意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”承接前文结论；“拿过来……交给”保持两个命令的推进。历史单位采用中文圣经语境中较熟悉的“他连得”，并用脚注防止读者误解为现代汉语所说的才干。
