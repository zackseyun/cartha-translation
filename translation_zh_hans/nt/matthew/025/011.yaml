  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: zh_hans
  text: 后来，其余的童女也来了，说：“主啊，主啊，给我们开门吧！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“给我们打开”；“门”由上下文补出。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: 后来
  rationale: 表示叙事中随后发生的事；“后来”自然、简洁，准确保留时间顺序。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的衔接词；汉语以“后来”和句序即可自然表达转折推进，无须生硬增译。
- source_word: ἔρχονται
  choice: 来了
  rationale: 希腊文用叙事现在时增强现场感；现代汉语叙事通常用“来了”表达这一动作，更自然。
- source_word: καὶ
  choice: 也
  rationale: 表达添加关系，说明其余童女继先前人物之后也来到。
- source_word: αἱ λοιπαὶ παρθένοι
  choice: 其余的童女
  rationale: λοιπαί意为余下的、其余的；παρθένοι直译为“童女”，既符合婚礼比喻的背景，也保留原文措辞。
- source_word: λέγουσαι
  choice: 说
  rationale: 以自然的汉语引出直接引语，准确表达伴随来到而发出的请求。
- source_word: Κύριε κύριε
  choice: 主啊，主啊
  rationale: 保留κύριος可能兼具尊称与神学含义的张力，并保留重复所传达的急切。
- source_word: ἄνοιξον ἡμῖν
  choice: 给我们开门吧
  rationale: 原文直为“向我们打开”，宾语“门”由上下文明确。汉语若完全省略宾语会不自然，因此在正文补出“门”，并以脚注说明。语气词“吧”自然表达祈使请求。
theological_decisions:
- issue: 直接称呼中的κύριος如何翻译
  choice: 主
  alternative: 先生；主人
  rationale: “主”既可作为尊称，也能保留《马太福音》中可能具有的更深神学回响，避免把含义限定为纯粹社会称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“其余的童女”较准确对应原文；直接引语中的重复和呼语保留其急切感。
