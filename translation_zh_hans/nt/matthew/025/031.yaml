source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: zh_hans
  text: 但当人子在他的荣耀中降临，所有天使都与他同来时，他将坐在他荣耀的宝座上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他荣耀之宝座。”
    reason: 保留θρόνου δόξης αὐτοῦ的属格结构，并提示“荣耀”与“宝座”的较贴近原文的表达方式。
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: 然而，当……时
  rationale: ὅταν引出指向未来事件的时间从句；δὲ在此标示话语转折或推进。“然而，当……时”既保留轻微的转折意味，也符合现代汉语叙述习惯。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定称号及其与《但以理书》第7章的互文联系，避免改为解释性较强的称谓。
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: 在他的荣耀中
  rationale: 较直接地保留介词结构；“荣耀”兼具尊荣、威严彰显的含义，也延续圣经用语的关联。
- source_word: πάντες οἱ ἄγγελοι
  choice: 所有天使
  rationale: 原文是“所有天使”，并无显式物主代词，因此不增译为“他所有的天使”。
- source_word: μετ’ αὐτοῦ
  choice: 都跟他同来
  rationale: 表达天使与人子一同到来的伴随关系；“同来”简洁自然。
- source_word: τότε καθίσει
  choice: 他就要坐
  rationale: τότε表示前述事件之后的结果或次序，以“就”自然体现；将来时καθίσει译作“要坐”。
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: 坐在他那荣耀的宝座上
  rationale: ἐπί与属格在此表示位于宝座之上；将属格短语δόξης αὐτοῦ自然处理为“他那荣耀的宝座”，同时在脚注保留更贴近原文结构的译法。
theological_decisions:
- issue: “人子”（ὁ υἱὸς τοῦ ἀνθρώπου）的称号
  choice: 人子
  alternative: 那位属人的／那一位人
  rationale: “人子”是中文圣经传统中明确而凝练的称号，能保留其弥赛亚、审判者身份及《但以理书》第7章背景，而不提前消解称号本身的张力。
- issue: θρόνου δόξης αὐτοῦ的属格关系
  choice: 他那荣耀的宝座
  alternative: 他荣耀的宝座
  rationale: 正文采用自然的现代汉语，表达宝座以荣耀为特征；脚注保留形式上更贴近“他荣耀之宝座”的结构，使原文可能强调“他的荣耀”这一点仍然可见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“然而”承接并推进末世审判的论述；“在他的荣耀中降临”和“人子”保留经文的圣经语汇与互文色彩。
