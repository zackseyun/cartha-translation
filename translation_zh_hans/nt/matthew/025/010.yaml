  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: zh_hans
  text: 她们去买的时候，新郎来了；那些预备好了的姑娘就同他进去参加婚宴[a]，门也关上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婚礼庆典”，也可简称“婚礼”。希腊语此处用复数形式，可指整个婚礼庆祝活动。
    reason: 说明γάμοι的词义范围及可接受的译法；标记置于其实际对应的“婚宴”之后。
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: 她们出去购买的时候
  rationale: 属格独立结构表示与主句同时发生的动作；“出去……的时候”保留ἀπέρχομαι离开原处的意味，目的不定式ἀγοράσαι译为“购买”，并按原文不补出所买之物。δέ在此承接并转折，中文语序和分号已自然体现，无须生硬译出。
- source_word: ὁ νυμφίος
  choice: 新郎
  rationale: “新郎”是现代汉语中婚礼语境下对νυμφίος自然、准确的称呼，也保留比喻的婚礼意象。
- source_word: αἱ ἕτοιμοι
  choice: 那些预备好的姑娘
  rationale: 阴性复数形容词在此作名词用，指上下文中已经预备好的童女；译为“姑娘”使所指清楚，同时不增加解释性神学含义。
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: 就同他进去
  rationale: 准确表达与新郎一同进入的叙事动作；“就”自然呈现事件紧接发生的次序。
- source_word: εἰς τοὺς γάμους
  choice: 赴婚宴
  rationale: γάμοι虽为复数形式，但可指婚礼庆典或筵席整体；“赴婚宴”符合本段情境和现代汉语表达，脚注保留其他可能译法。
- source_word: ἐκλείσθη ἡ θύρα
  choice: 门便关上了
  rationale: 保留不定过去时被动态，不说明关门者；“关上了”简洁自然，并传达场景的终局性。
theological_decisions:
- issue: 比喻中婚礼意象的处理
  choice: 按叙事情境保留“新郎”和“婚宴”，不在正文中明说其基督论所指。
  alternative: 在译文中直接把新郎解释为基督，或把婚宴解释为天国筵席。
  rationale: 原句本身以比喻叙事呈现这些形象；其神学意义应由上下文显明，不宜借翻译扩写，以免消除比喻本有的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“购买”略具正式感但仍属常用词；全句以分号衔接连续事件，末句简短，以保留原文肃穆而决绝的效果。
