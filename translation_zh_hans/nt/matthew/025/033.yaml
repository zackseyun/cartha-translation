  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: zh_hans
  text: 他要把绵羊安置在他的右边[b]，把小山羊安置在左边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小山羊”或译“山羊”；希腊文所用词通常指幼小的山羊。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“从他的右边……从左边”，是表示安置在右侧和左侧的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: 安置
  rationale: 此处是ἵστημι的将来时主动语态，带直接宾语，意为使之站在某处、安排到某一位置。“安置”自然地表达有意将两群分别置于两侧。
- source_word: πρόβατα
  choice: 绵羊
  rationale: πρόβατα是普通的“羊、绵羊”；在与山羊对举的语境中译作“绵羊”，可清楚保留两类动物的区别。
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: 在自己的右边
  rationale: ἐκ加方位词属格在此是表示位置的惯用法。“在自己的右边”准确、自然地说明相对于他的方位，并保留反身所指。
- source_word: ἐρίφια
  choice: 山羊羔
  rationale: ἐρίφια通常特指幼小的山羊。“山羊羔”在现代汉语中明确保留物种与年龄含义，避免单译“羊羔”可能被理解为绵羊羔。
- source_word: ἐξ εὐωνύμων
  choice: 在左边
  rationale: 该短语是“在左侧”的惯用表达；希腊文未重复αὐτοῦ，汉语也可自然省略“他的”，由平行结构补足。
- source_word: μὲν ... δὲ
  choice: 把……，把……
  rationale: 该关联结构划分并对照两个群体。现代汉语用两个平行的“把”字结构即可清楚呈现对照，不必机械加入“但是”。
theological_decisions:
- issue: 是否在左右方位中明说尊荣或弃绝的象征意义
  choice: 仅译为空间位置“右边……左边”
  alternative: 扩译为“蒙恩的一边……受弃的一边”
  rationale: 原文直接陈述的是审判场景中的位置安排。左右两侧在上下文中虽有评价含义，但本节没有把该含义明说，因此不在译文中作解释性扩展。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以平行的“把”字结构再现两群的对照；“右边、左边”保持空间意义，不把上下文中的象征评价直接写入正文。所有脚注标记均置于相关正文之后。
