  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: zh_hans
  text: 那领了五他连得的仆人上前来，带来另外五他连得[a]，说：“主啊，你交给我五他连得；看，我另外赚了五他连得。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代很大的重量单位，也用作大额货币单位。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前来
  rationale: 表达仆人走近主人、当面交账的场景，比单说“来”更完整，也符合现代汉语。
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: 那领了五他连得银子的仆人
  rationale: 希腊文以带冠词的分词结构指先前领受五他连得的那一位；按上下文补出“仆人”使汉语指代自然，“领了”保留此前发生的动作。
- source_word: τάλαντα
  choice: 他连得
  rationale: 保留原文的大额重量兼货币单位名称，不把材质缩窄为金或银；首次出现时加“银子”表明这里是钱财。
- source_word: προσήνεγκεν
  choice: 带来
  rationale: 在交账场景中自然表达把新增的钱带到主人面前；避免“献上”可能产生的祭祀意味。
- source_word: ἄλλα πέντε τάλαντα
  choice: 又带来五他连得／又赚了五他连得
  rationale: ἄλλα表示同等数目的额外增加；“又……五他连得”在两处分别与动词自然搭配，并保留原文重复。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在比喻内可指仆人的主人；“主啊”既是自然称呼，也保留马太叙事中可能存在的更广泛呼应。
- source_word: παρέδωκας
  choice: 交给我
  rationale: 准确表达“交付、交在某人手中”，比“委托”少一层解释，在现代汉语中也清楚自然。
- source_word: ἴδε
  choice: 看
  rationale: 保留原文引人注意的指示语气，简洁而现代。
- source_word: ἐκέρδησα
  choice: 赚了
  rationale: κερδαίνω在钱财语境中表示获利或赚得；“赚了”自然表达已经取得并现今拿出的收益。
theological_decisions:
- issue: 比喻中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 本节直接语境是仆人称呼其主人，但译作“主”既可自然用于这种上下关系，也不抹去马太福音可能赋予该称谓的叙事神学回响；正文不进一步明定其基督论含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。正文保留“他连得”这一源语文化单位，并用脚注解释；“上前来”“交给我”“看”使直接引语自然清晰。
