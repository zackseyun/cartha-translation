  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: zh_hans
  text: 那些聪明的女子回答说：“不行，恐怕怎么也不够给我们和你们。[a] 你们还是到卖油的人那里，自己买吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“恐怕”之后使用强调否定，强烈表示担心现有的油绝不会足够双方使用。
    reason: 说明原文“μήποτε οὐ μή”的罕见组合及其强调语气，同时保留它作为担忧而非确定断言的含义。
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: 聪明的回答说
  rationale: 保留形容词作名词的表达，并用现代汉语自然的叙事引语格式合并“回答”和“说”；所指人物由上下文确定，不在本节另加身份称谓。
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: 不行，恐怕怎么也不够
  rationale: “不行”表达语境中隐含的拒绝；“恐怕怎么也不够”兼顾 μήποτε 所表达的担忧和 οὐ μή 的强调否定，不把这种担忧改写成绝对断言。
- source_word: ἡμῖν καὶ ὑμῖν
  choice: 我们和你们一起用
  rationale: 以自然汉语表达双方都需要供应的意思；“一起用”没有断定油的具体分配方式。
- source_word: πορεύεσθε μᾶλλον
  choice: 你们还是到……那里
  rationale: “还是”自然表达 μᾶλλον 所标示的替代做法，并保留命令语气。
- source_word: πρὸς τοὺς πωλοῦντας
  choice: 到卖油的人那里
  rationale: 希腊文直译为“到卖东西的人那里”；根据紧接的上下文，所售之物是油。汉语补出“油”可避免“卖东西的人”这一不自然且过于宽泛的说法。
- source_word: ἀγοράσατε ἑαυταῖς
  choice: 自己买吧
  rationale: “自己”清楚表达反身代词 ἑαυταῖς；句末“吧”使直接命令在对话中自然，但不削弱让对方自行购买的要求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。“聪明的”沿用比喻内部的对照称谓；“不行”直接明快，“恐怕怎么也不够”保留原文强烈但仍带忧虑性质的否定。
