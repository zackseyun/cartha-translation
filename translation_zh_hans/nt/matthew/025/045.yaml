  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: zh_hans
  text: 那时，他要回答他们说：“我实在告诉你们：凡是你们没有为这些最微小的人[a]中的一个做的事，也就是没有为我做的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些最微小的人”可能特指耶稣的门徒，也可能更广泛地指卑微和有需要的人；正文保留原文的说法，不在翻译中限定其所指。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 承接审判场景中的先后次序；现代汉语自然庄重。
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: 他要回答他们说
  rationale: 保留将来时、间接宾语和引出直接引语的结构，符合圣经叙事语体。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 表达耶稣这一固定宣告句式的郑重与强调；比音译“阿们”更便于普通现代读者理解。
- source_word: ἐφ’ ὅσον
  choice: ……没有……的，也就是……没有……
  rationale: 本句处于否定结构中，直译为“在多大程度上”在汉语中生硬；用对应关系表达其范围和关联，同时避免弱化为单纯因果。
- source_word: οὐκ ἐποιήσατε
  choice: 你们没有为……做
  rationale: 上下文已明确所指的是照顾饥饿、口渴、寄居、赤身、患病和被囚者的行动，汉语无需补出一个含混的“这事”。
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: 这些最微小的人中……其中一个
  rationale: 保留指示语、最高级意义和群体中的单数个体，不把这群人的身份解释为特定类别。
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: 也就是没有为我做
  rationale: οὐδέ在此把对最微小者的不作为与对耶稣的不作为直接对应；“为我做”符合汉语搭配，也保留重复动词的强调。
theological_decisions:
- issue: “这些最微小的人”的身份
  choice: 正文保留“这些最微小的人”，不进一步界定其所指。
  alternative: 明确译作耶稣的门徒或使者；或明确泛指卑微贫困、需要帮助的人。
  rationale: 本节直接表明耶稣与他们认同，却未在本句中明确解决其范围；翻译应保留这一解释张力。
- issue: 对最微小者所做之事与对耶稣所做之事的关系
  choice: 译为“也就是没有为我做”，呈现两者的直接对应。
  alternative: 译为较弱的因果关系，如“所以也没有为我做”。
  rationale: 原文οὐδέ及重复的ἐποιήσατε形成强烈对应，不宜添加原文未明说的因果连接。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我实在告诉你们”保留耶稣宣告句式的郑重感；句法适度调整以避免欧化，同时维持原文的否定平行和神学张力。
