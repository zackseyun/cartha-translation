  rationale: 将后半句改为“凡是……做的事，也就是没有为我做的事”，以自然现代汉语表达ἐφ’ ὅσον引出的范围／对应关系，并补出汉语所需的中心词“事”。这并非添加具体行动或界定“最微小的人”的身份；“事”仅指上下文和ποιέω所隐含的行动。保留“这些最微小的人”及其脚注，以维持原文的解释开放性。
