  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: zh_hans
  text: 我因为害怕，就去把你那一他连得[a]藏在地里。看，你的还在这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代的重量单位，也用作大额货币的计算单位；这里指一大笔钱，并非人的天赋或才干。
    reason: 说明历史货币单位，防止现代语义误解。
lexical_decisions:
- source_word: φοβηθεὶς
  choice: 因害怕
  rationale: 该词为φοβέομαι的不定过去时被动形态分词，在此表示伴随情形并说明仆人自称的行动动机；译作“因害怕”自然地表达因果关系，同时不把它解释为敬畏。
- source_word: ἀπελθὼν
  choice: 就去
  rationale: 该不定过去时分词与主要动词ἔκρυψα构成先后相接的动作；“就去……藏”符合现代汉语叙事习惯，并保留行动次序。
- source_word: ἔκρυψα
  choice: 藏
  rationale: κρύπτω的直接意义是隐藏、藏匿；地点短语“在地里”已经表明埋藏情境，因此不把动词本身强化为“埋”。
- source_word: τὸ τάλαντόν σου
  choice: 你的一他连得
  rationale: τάλαντον是古代大额重量及货币计算单位。采用音译“一他连得”保留历史语境和原文单位，所有关系“你的”也予以保留；脚注说明其货币含义，避免现代读者将其误解为才干。
- source_word: ἐν τῇ γῇ
  choice: 在地里
  rationale: γῆ在此指用来藏匿钱财的土地；“在地里”是准确而自然的现代汉语表达。
- source_word: ἴδε
  choice: 看
  rationale: ἴδε用于唤起对方注意；“看”简明、自然，也不带古奥语体。
- source_word: ἔχεις τὸ σόν
  choice: 属于你的在这里
  rationale: 原文是简略而带指示性的表达，直意近于“你有那属于你的”。“属于你的在这里”保留所有权的强调，并以自然的呈现句表达仆人把原物交还给主人。
theological_decisions:
- issue: τάλαντον在比喻中的含义
  choice: 正文保留历史单位“一他连得”，脚注说明这是高额钱财单位，并非人的天赋或才干。
  alternative: 译作“一大笔钱”或具体换算成某种现代金额。
  rationale: 原文所指是古代重量和货币单位，而非天赋。保留音译可维持历史与文学特征；由于其实际价值会随金属种类及换算方式而异，不在正文中给出可能造成虚假精确感的现代金额。
- issue: 仆人害怕与藏钱之间的关系
  choice: 译作“因害怕，就去……藏”，呈现他自己所陈述的动机。
  alternative: 仅译作“害怕着”以弱化因果，或译作“出于敬畏”以赋予宗教含义。
  rationale: 分词在语境中自然说明行动缘由，但经文本身并未认可该理由，也未把这种怕界定为敬畏；译文不替叙事作进一步神学判断。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“一他连得”保留古代单位名称，并借脚注释义；“属于你的在这里”呈现仆人当面交还主人财物时的简短语气。
