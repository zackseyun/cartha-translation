base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: zh_hans
  text: 主人却回答他说：“你这又恶又懒的仆人[a]！你知道我在没有撒种的地方收割，在没有撒播的地方收聚吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”。希腊语doulos可按语境指仆人或奴隶。
    reason: lexical_alternative
  - marker: b
    text: 这句话也可读作陈述句：“你知道我在没有撒种的地方收割，在没有撒播的地方收聚。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ
  choice: 主人却回答他说
  rationale: 以自然的汉语叙事句式表达分词结构和δέ所带的轻微转折；本比喻的主仆关系中，κύριος译作“主人”比“主”更贴切。
- source_word: Πονηρὲ δοῦλε καὶ ὀκνηρέ
  choice: 你这又恶又懒的仆人
  rationale: “恶”保留πονηρός的道德贬义，“懒”准确表达ὀκνηρός不愿行动的含义；δοῦλος在此译作通顺的“仆人”，同时用脚注保留“奴仆”这一可行译法。
- source_word: ᾔδεις ὅτι
  choice: 你既知道……是吗
  rationale: ᾔδεις陈述仆人所声称知道的事；结合上下文，将整句话处理为主人反诘，并用“既……是吗”呈现论辩语气。
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: 我没有撒种的地方也要收割
  rationale: 保留撒种与收割的农业意象，并以符合现代汉语习惯的语序表达。
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: 没有撒下的也要收聚
  rationale: 按原文保留“撒下”而不补入“种子”；“收聚”对应συνάγω，也与前面的“收割”有所区分。
theological_decisions:
- issue: 末句的语气与标点
  choice: 译为反问句，并以“是吗”明确反诘语气
  alternative: 译为陈述句：“你知道我没有撒种的地方也要收割，没有撒下的也要收聚。”
  rationale: 希腊文没有现代标点，语法上可作陈述，也可结合前一节理解为主人借仆人的话反问他。正文采用更符合论辩脉络的反问读法，脚注保留陈述读法，避免消除原有歧义。
- issue: 主人话语是否认可仆人对其品格的描述
  choice: 不在译文中说明主人是在认可、反讽或仅沿用仆人的前提
  alternative: 明确解释为主人承认仆人的指控，或明确解释为反讽
  rationale: 本节本身没有明确判定主人对仆人描述的认可程度；直译其回应并保留反问/陈述的张力，不额外导入教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“又恶又懒”保留责备力度；“撒下”不擅自补出原文没有明说的“种子”。所有脚注标记均置于正文相应位置。
