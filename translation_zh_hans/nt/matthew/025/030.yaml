  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless slave into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: zh_hans
  text: 把这个无用的奴仆[a]扔到外面的黑暗里去；在那里，必有哀哭切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语 doulos 可译为“仆人”或“奴隶”；这里的比喻突出其受主人支配的身份，因此译作“奴仆”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: 无用的
  rationale: 该词指在主人评判中没有用处、未尽功用的人。“无用的”直接保留本段语境中的评价，也比“无价值的”更自然，且不把人的本体价值作超出原文的断言。
- source_word: δοῦλον
  choice: 奴仆
  rationale: δοῦλος可指奴隶或仆人；本比喻中的主从与受支配身份十分明显。“奴仆”既体现这种身份，又符合现代中文叙事语体。脚注说明其词义范围。
- source_word: ἐκβάλετε
  choice: 扔到……里去
  rationale: 该不定过去时命令语气强烈，表示坚决逐出。“扔到……里去”自然、鲜明，保留原文动作的力度。
- source_word: σκότος τὸ ἐξώτερον
  choice: 外面的黑暗
  rationale: 直译这一马太特有的审判意象，表达被排除在内、置于外面的黑暗中，不额外解释其具体所指。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 自然地回指刚提到的“外面的黑暗”，保留地点指向。
- source_word: κλαυθμὸς
  choice: 哀哭
  rationale: “哀哭”准确表达悲痛哭泣，也是现代中文可理解且庄重的说法。
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: 切齿
  rationale: “切齿”是简洁而惯用的中文表达，可保留痛苦和愤怒之间未被原文消除的含义张力。
theological_decisions:
- issue: 比喻中审判意象的性质
  choice: 保留被逐入外面黑暗及哀哭切齿的意象，不在正文中明确等同于地狱、最终审判或其他特定惩罚。
  alternative: 在译文中直接解释为地狱或仅属暂时、象征性的排斥。
  rationale: 这是马太福音反复出现的审判语言，但本节自身以意象表达。译文应保留其严肃性及解释空间，不加入原文没有明说的系统性结论。
- issue: 哀哭切齿所表达的情绪
  choice: 使用传统而自然的合成表达“哀哭切齿”，不限定为单纯悲伤或单纯愤怒。
  alternative: 明确译作因痛苦而哭泣，或因愤怒而咬牙。
  rationale: 原文并未说明切齿的单一心理原因；保持开放可避免消解其可能兼含的痛苦、懊悔或愤怒。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“扔到……里去”体现命令的力度；“外面的黑暗”和“哀哭切齿”保留原文反复出现的审判意象。
