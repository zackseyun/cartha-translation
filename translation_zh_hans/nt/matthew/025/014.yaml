id: MAT.25.14
reference: Matthew 25:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own slaves and entrusted his possessions to them.
translation:
  language: zh_hans
  text: 因为，这就好比一个人要出门远行，便叫来自己的奴隶[a]，把他的财物交托给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”或“奴仆”。希腊语doulos可按语境指仆人或奴隶；这里译作“奴隶”，因为经文突出了主人对他们的所有权和权柄。
    reason: 说明δοῦλος的语义范围及本处译法。
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: 因为，这就好比
  rationale: γάρ承接上文并作解释，ὥσπερ引出比喻。原文省略了比较所指，中文补出“这”以构成自然完整的句子，但不明说“天国”，避免把省略处解释得过满。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 这里指比喻中的一名男子；现代汉语用“一个人”自然清楚，无须额外标明性别。
- source_word: ἀποδημῶν
  choice: 要出门远行
  rationale: 该分词表示离开本地前往别处；“出门远行”保留离去旅行之意，又不武断限定为出国。
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 既表达召唤，也符合主人把家中奴隶叫到面前的具体场景，比单用“呼叫”自然。
- source_word: τοὺς ἰδίους δούλους
  choice: 自己的奴隶
  rationale: ἰδίους强调这些人属于他；δοῦλος在此处的家主—奴隶关系中带有隶属和权柄含义，译作“奴隶”避免淡化其社会身份。
- source_word: παρέδωκεν
  choice: 交托
  rationale: 表示把财物交给他们管理并使其承担责任；“交托”兼顾交付与委托之意。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 他的财物
  rationale: 指这个人所拥有的产业或物品；“财物”简洁自然，也适合比喻中的经济语境。
theological_decisions:
- issue: 比喻中的δοῦλος应译为“奴隶”还是“仆人”
  choice: 奴隶
  alternative: 仆人；受主人约束的仆役
  rationale: 本段突出主人的所有权、权柄以及财物的托付，因此“奴隶”更能保留古代社会关系的实际含义；脚注列出较宽泛的可能译法，以承认该词的语义范围。
- issue: Ὥσπερ所比较的对象是否应明确补为“天国”
  choice: 用“这”承接上文，不直接补出“天国”
  alternative: 因为，天国又好比
  rationale: 希腊文本在本节没有明说比较对象。用“这”可使中文通顺并保留原文的省略，不把上下文推断直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便叫来”使动作衔接自然；“交托”保留管理责任的含义。脚注标记紧随其实际说明的“奴隶”，而不是放在“远行”之后。
