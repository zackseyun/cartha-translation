  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: zh_hans
  text: 那领了一个他连得的人也上前来，说：“主啊，我知道你是个严厉的人[a]：在你没有撒种的地方收割，又从你没有撒开的地方收聚[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉”也可译作“严酷”或“苛刻”。原文这个词可表示坚硬、严厉或苛刻。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“从你没有撒开的地方收聚。”动词未说明所撒开的是什么；在农业语境中可理解为种子，但原文没有明确说出。
    reason: source_ambiguity
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前来
  rationale: 表达分词所描述的先行行动，符合仆人依次到主人面前回报的叙事场景。
- source_word: δὲ καὶ
  choice: 也
  rationale: καί表明这个仆人同样上前；汉语叙事中不必另译δέ，也能自然体现情节推进。
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: 那领了一个他连得的人
  rationale: 保留定冠词加分词结构的识别作用；“领了”简洁表达此前已经领受且仍与当前问责相关。
- source_word: τάλαντον
  choice: 他连得
  rationale: 采用音译以保留古代重量及货币单位，避免误解为现代汉语的“才干”；具体价值不在本节明说。
- source_word: Κύριε
  choice: 主啊
  rationale: 既是对主人的尊称，也保留κύριος在马太福音中的语义与神学回响，不强行限定为单纯的“主人”。
- source_word: ἔγνων σε ὅτι
  choice: 我知道你是
  rationale: 按现代汉语自然表达其对主人性情的自称认识；不机械复制希腊语中的宾语代词结构。
- source_word: σκληρὸς ἄνθρωπος
  choice: 严厉的人
  rationale: σκληρός在此描述性情强硬、苛严；“严厉”自然且仍给“严酷”等较强理解留下空间。
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: 没有撒种的地方，你也收割
  rationale: 保留撒种与收割的农业对照，并以汉语主题结构清楚呈现地点关系。
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: 没有扬谷的地方，你也收聚
  rationale: 结合收割场景，将διασκορπίζω理解为扬散谷物、συνάγω理解为收聚谷粒；同时用脚注保留较一般的“撒开”可能。
theological_decisions:
- issue: 比喻中κύριος的称呼
  choice: 主啊
  alternative: 主人啊
  rationale: “主”既适合作为仆人对主人的称呼，也避免抹去该词可能具有的更广泛叙事回响。
- issue: 仆人对主人的评价
  choice: 按仆人的原话译为“严厉的人”
  alternative: 译为“严酷的人”或弱化为“严格的人”
  rationale: 本节陈述的是仆人的指控；译文既不替他背书，也不替主人缓和，保留比喻中的张力。
- issue: διασκορπίζω在农业意象中的所指
  choice: 扬谷
  alternative: 撒开／撒种
  rationale: “收聚”与谷场上扬散后收聚谷粒可形成自然对应，但原词本身没有明说宾语，因此以脚注保存较宽泛的直译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“他连得”作为古代单位音译，需要依赖全段语境或术语表说明；本节不擅自换算金额。标点和语序突出两组平行的农业动作。
