  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: zh_hans
  text: 那领了五个他连得[a]的人，去用这些钱作买卖[b]，又赚了五个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代很大的一种重量和货币单位，在这里指一大笔钱，并不是指人的天赋或才能。
    reason: cultural_note
  - marker: b
    text: 也可译作“用这些钱经营”；原文强调积极运用这些钱来获利。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: 出去
  rationale: 以自然的汉语有限动词表达先行分词所交代的行动次序；不加入原文没有明说的“立刻”。
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: 那领了五个他连得的人
  rationale: 保留带冠词分词结构的指称作用，按此人先前所领受的数额来辨明他。
- source_word: τάλαντα
  choice: 他连得
  rationale: 采用这一古代重量及货币单位的音译，避免译成“才干”而误导读者；其货币含义由脚注说明。
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: 用这些钱经营
  rationale: ἐργάζομαι 搭配 ἐν 加与格，在这里指积极运用所领的钱财以求收益；“经营”既符合商业语境，也不过度限定为某一种具体交易。
- source_word: ἐκέρδησεν
  choice: 赚了
  rationale: κερδαίνω 在金钱语境中指获得利润；“赚了”是现代汉语中清楚自然的对应表达。
- source_word: ἄλλα πέντε
  choice: 又……五个
  rationale: 表达在原有五个之外再增加五个的含义，并保持汉语叙事简洁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他连得”保留传统单位名称，并用脚注消除现代读者可能产生的“才能”联想；未把分词擅自强化为“立刻”。
