id: MAT.16.6
reference: Matthew 16:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“你们要当心，提防法利赛人和撒都该人的酵[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“酵母”。原文使用面团中的发酵物作比喻；耶稣在后文说明其所指。
    reason: 说明词义选择及比喻性质，同时不在正文中提前释义。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示与上文的轻微转折；“却”自然地承接门徒先前的议论，又不过分强化对立。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 直接、自然地对应“向他们说”，并保留普通叙事语气。
- source_word: Ὁρᾶτε
  choice: 要当心
  rationale: 此处不是字面上的“看”，而是警告性的命令；“要当心”符合现代汉语表达。
- source_word: προσέχετε
  choice: 提防
  rationale: 与“要当心”并列，保留原文两个警告命令所形成的加强语气，同时自然引出所要防备的对象。
- source_word: ἀπὸ
  choice: 提防……
  rationale: ἀπό与警戒类动词连用时表示远离、防备；汉语宜融入“提防”的句式，不逐字译作“从”。
- source_word: ζύμης
  choice: 酵
  rationale: 保留原文比喻，不在本节提前解释为“教导”或“影响”；“酵”也延续圣经语境中面团发酵物的意象。
- source_word: Φαρισαίων
  choice: 法利赛人
  rationale: 该犹太群体名称的通行汉语译名。
- source_word: Σαδδουκαίων
  choice: 撒都该人
  rationale: 该犹太群体名称的通行汉语译名。
theological_decisions:
- issue: “酵”的比喻意义
  choice: 正文保留“酵”这一比喻，不直接解释
  alternative: 译作“教导”或“影响”
  rationale: 本节原文本身使用ζύμη；后文才说明其所指。保留比喻可维持叙事展开及原文在此处的张力，避免提前代入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“要当心，提防”保留两个命令的加强效果；“酵”简洁且具有经文语境中的比喻色彩。
