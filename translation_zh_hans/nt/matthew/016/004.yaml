  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: zh_hans
  text: 邪恶、淫乱的世代寻求神迹[a]，而不会有神迹赐给它，除了约拿的神迹[b]以外。于是，他离开他们，去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”原文也可译作“记号”，指用来证明身份或权柄的标志。另，“淫乱”可能呼应先知书以婚姻不忠比喻人对神不忠的说法。
    reason: lexical_alternative
  - marker: b
    text: “约拿的神迹”在马太福音12:39—40中与约拿三日三夜在大鱼腹中，以及人子三日三夜的经历相联系。
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: 世代
  rationale: 在马太福音中，γενεά常指当时的一代人；“世代”既保留集体含义，也与上下文用语一致。
- source_word: πονηρὰ
  choice: 邪恶
  rationale: 直接表达道德上的败坏，语体自然、庄重。
- source_word: μοιχαλὶς
  choice: 淫乱
  rationale: 保留原文与奸淫有关的尖锐比喻，同时容纳先知传统中对背约、不忠的暗示，不在正文中将其单一解释为“不忠”。
- source_word: σημεῖον
  choice: 神迹
  rationale: 此处所求的是用来验证身份或权柄的超常记号；现代中文圣经语境中“神迹”自然清楚，但脚注提示原词也可译为“记号”，避免遮蔽其指示性。
- source_word: ἐπιζητεῖ
  choice: 寻求
  rationale: 对应持续或强烈寻求之意，不把上下文中的敌意额外强化为“强求”。
- source_word: δοθήσεται
  choice: 赐给
  rationale: 准确表达未来被动式；在神迹由神给予的语境中，“赐给”比一般的“给”更自然。
- source_word: αὐτῇ
  choice: 给它
  rationale: 阴性单数代词回指“世代”；中文用“它”保留代词衔接，虽也可为清楚而重复“这个世代”。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 清楚标明唯一例外。
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: 约拿的神迹
  rationale: 保留属格短语本身的简洁与歧义，不在正文中直接解释为死亡与复活。
- source_word: καταλιπὼν αὐτοὺς
  choice: 离开他们
  rationale: 自然表达先行的分词动作。
- source_word: ἀπῆλθεν
  choice: 就走了
  rationale: 简洁表达离去；与前面的“离开他们”共同保留原文动作顺序。
theological_decisions:
- issue: “淫乱的世代”的含义
  choice: 正文保留“淫乱”这一比喻，使其可同时带有道德败坏和对神不忠的含义。
  alternative: 译作“不忠的世代”。
  rationale: 原文使用与奸淫相关的词，可能呼应先知书以婚姻不忠描写背约的传统；不宜在正文中把比喻化约为单一解释。
- issue: “约拿的神迹”的含义
  choice: 正文仅保留这一简洁说法，另以脚注指出马太福音12:39—40的解释。
  alternative: 在正文中明说这是指耶稣的死与复活。
  rationale: 本节没有展开解释；保留措辞可避免把平行经文的完整说明直接嵌入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邪恶、淫乱的世代”保留原文并列修饰语的力度；末句补出主语“耶稣”，使中文指代清楚。所有脚注标记均置于正文中。
