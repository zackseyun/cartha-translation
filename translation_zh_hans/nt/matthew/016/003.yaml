source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: zh_hans
  text: 早晨，你们又说：‘今天会有风雨，因为天空发红而阴沉。’你们知道分辨天色[a]，却不能分辨时代的征兆[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“天空的面貌”。
    reason: lexical_alternative
  - marker: b
    text: “时代的征兆”可指当下这个特殊时刻在属灵上的意义，其中包括耶稣所行、显明其身份与使命的事。原文没有把它仅限于末世征兆。
    reason: alternative_reading
  - marker: c
    text: 有些古抄本省略了从16:2下半节关于傍晚观天象的话，到本节末尾的整段话。
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: 早晨
  rationale: 作时间副词，与上文傍晚观天象的说法相对；“早晨”在现代汉语中简明自然。
- source_word: χειμών
  choice: 风雨
  rationale: 此处指恶劣、暴风雨般的天气，而非“冬天”；“会有风雨”符合汉语预报天气的表达。
- source_word: πυρράζει
  choice: 发红
  rationale: 准确表达天空呈红色的状态，同时保留天气谚语式的简洁。
- source_word: στυγνάζων
  choice: 阴沉
  rationale: 该分词描写天空暗淡、阴郁而有风雨之势；“阴沉”比单纯“多云”更能保留其威胁感。
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: 天色
  rationale: 字面为“天空的面貌”；“天色”是自然的现代汉语，指天空可观察到的外观。
- source_word: γινώσκετε διακρίνειν
  choice: 知道分辨
  rationale: 保留“知道如何”与“辨别、判断”的双重意味，并与后句形成直接对照。
- source_word: σημεῖα
  choice: 征兆
  rationale: 既可表示可辨认的迹象，也保留其具有启示意义的内涵；此处“征兆”与“时代”搭配自然。
- source_word: καιρῶν
  choice: 时代
  rationale: καιρός在此不是气候季节，而是具有特殊意义的时机或时期；“时代”保留其宽广含义，不将其限定为单一的末世解释。
- source_word: οὐ δύνασθε
  choice: 却不能分辨
  rationale: 明确表达能力上的否定，并补出由前句承接而来的“分辨”，使汉语对比清楚。
theological_decisions:
- issue: “时代的征兆”的具体所指
  choice: 保留“时代的征兆”这一宽泛表达
  alternative: 译作“这时代的弥赛亚征兆”或“末世的征兆”
  rationale: 上下文指向听众未能认出当前时刻及耶稣作为的属灵意义，但原文并未把范围仅限于弥赛亚事工或末世事件，因此不在正文中缩窄其含义。
- issue: 天气谚语与属灵辨识之间的责备力度
  choice: 用“知道……却不能……”保留鲜明反差
  alternative: 弱化为“会……却不会……”
  rationale: 原文既陈述他们具备判断天象的能力，也责备他们不能判断时代征兆；译文保留这种反讽和责备，不另行解释其原因。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“今天会有风雨”符合口语化天气判断，却不失经文语体；“天色”避免生硬直译“天空的脸”，“时代的征兆”则保留原文的神学张力与解释空间。
