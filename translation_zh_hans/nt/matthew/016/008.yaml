  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: zh_hans
  text: 耶稣知道了，就说：“你们这些信心不足的人哪，为什么彼此议论，说没有带饼[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有拿饼。”
    reason: 保留οὐκ ἐλάβετε较为字面的译法；在上下文中，“拿”可具体理解为随身带来。
lexical_decisions:
- source_word: γνοὺς
  choice: 知道了
  rationale: 用简洁自然的汉语表达不定过去时分词所表示的先行动作：耶稣察知门徒所议论的事，随后开口回应；原文宾语未明说，译文也不另加“这事”。
- source_word: δὲ
  choice: 就
  rationale: 此处主要推动叙事并引出耶稣的回应；汉语用“就”自然连接“知道”与“说”，不把轻微转折强化为明显对立。
- source_word: Τί διαλογίζεσθε ἐν ἑαυτοῖς
  choice: 为什么彼此议论
  rationale: τί在此询问议论的缘由；διαλογίζεσθε结合ἐν ἑαυτοῖς指门徒相互思量、谈论。译作“彼此议论”符合上下文，也保留责问语气。
- source_word: ὀλιγόπιστοι
  choice: 你们这些信心不足的人哪
  rationale: 保留对门徒信靠不足的直接责备，并以现代汉语可理解而庄重的方式表达马太福音中这一称呼。
- source_word: ὅτι
  choice: 说
  rationale: 按内容连接词理解，引出门徒议论的内容；汉语用“说”比直译“即”或“因为”更自然。因ὅτι也可能带因果意味，相关张力在神学决策中说明。
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: 没有带饼
  rationale: λαμβάνω本义为“拿、取”，在本段行旅语境中指没有随身带上饼；“带饼”自然传达该处具体含义，同时以脚注保留较直译的表达。
theological_decisions:
- issue: ὀλιγόπιστοι责备的力度
  choice: 译为“你们这些信心不足的人哪”，明确指出门徒在当前处境中信靠不足
  alternative: 较弱地译作“你们怎么还不明白”，只突出理解方面的问题
  rationale: 原词直接涉及πίστις（信心、信靠），不能淡化为单纯的误解；同时不把这句扩展成对门徒整体得救状况的判断。
- issue: ὅτι所表达的内容或原因
  choice: 正文按内容性用法译为“说没有带饼”
  alternative: 按因果性用法译为“因为没有带饼”
  rationale: 两种句法理解在语境中都说得通；正文选择更贴近门徒所议论内容的读法，但不借此否认问句也含责备他们因缺饼而忧虑的意味。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“信心不足的人哪”保留呼语和责备力度，避免生硬的“小信者”；问句结构简明，适合公开诵读。
