  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: zh_hans
  text: 门徒到了对岸，忘了带饼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“饼”为复数；正文按现代汉语习惯译作“饼”，不明确限定数量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: 到了
  rationale: 将不定过去时分词按时间关系自然表达为“到了”，与主句“忘了”衔接，同时避免生硬的分词结构。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书语境中 μαθηταί 特指耶稣的门徒；“门徒”是现代汉语中准确且通行的译法。
- source_word: εἰς τὸ πέραν
  choice: 对岸
  rationale: 这是跨越湖海后到达另一边的惯用表达；“对岸”简洁自然，也符合上下文。
- source_word: ἐπελάθοντο
  choice: 却忘了
  rationale: ἐπιλανθάνομαι 表示“忘记”。“忘了”自然表达已经发生的疏忽；“却”使到达对岸与未带食物之间的转折在汉语中更顺畅，但不增添新的事实。
- source_word: ἄρτους
  choice: 饼
  rationale: 希腊文为复数，字面指多个饼；汉语“饼”在此可作无标记数量的食物名称，比“几个饼”更自然，也不擅自确定数目。
- source_word: λαβεῖν
  choice: 带
  rationale: 在出行语境中，λαβεῖν 指随身取带；译作“带”比字面的“拿”更符合现代汉语习惯。
