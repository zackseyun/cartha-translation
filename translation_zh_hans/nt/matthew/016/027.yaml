  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: zh_hans
  text: 因为人子将要在他父亲的荣耀中，同他的众天使降临[a]；那时，他要按照各人所行的报偿各人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将要……降临”也可译作“快要来”或“将来临”。希腊文使用“将要”一词，保留了事情临近、即将发生的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“按照他的行动”。希腊文“行动”是单数，随“各人”作分配性使用，指每个人所行的事或一贯行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: 将要
  rationale: “将要”自然表达μέλλω加不定式所含的临近、即将发生之意，又不擅自规定具体时间。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”比句首“原来”更直接清楚。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用中文圣经传统中固定而简洁的称号，并保留其与《但以理书》意象的互文联系。
- source_word: ἔρχεσθαι
  choice: 降临
  rationale: 在末世语境中，“降临”自然传达“来”的含义及其庄严色彩；其本身不额外规定时间。
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: 在他父的荣耀中
  rationale: 保留ἐν的范围或彰显之意，以及“他父”的属格关系，不改写为人子自身的荣耀。
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: 同他的众天使
  rationale: 准确表达μετά加属格所表示的陪同，并保留“他的”这一所属关系。
- source_word: καὶ τότε
  choice: 那时
  rationale: 清楚标明先降临、后施行报应的时间次序；分号已承担连接作用，无须机械译出καί。
- source_word: ἀποδώσει
  choice: 报应
  rationale: 表达按各人所当得的给予，兼容正面与负面的审判结果，避免“奖赏”只偏向正面。
- source_word: ἑκάστῳ
  choice: 各人……各人
  rationale: 以汉语复现与格受事者及其逐一、个别性的分配意味。
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: 照各人所行的
  rationale: 自然表达按其行为而定；虽希腊文πρᾶξις为单数，此处随ἑκάστῳ作分配性使用，可指每个人的所作所为。
theological_decisions:
- issue: μέλλει所表达的人子降临之时间意味
  choice: 译为“将要……降临”，保留临近或即将发生的意味。
  alternative: “必……降临”或单纯“要……降临”
  rationale: 原文明确使用μέλλω加不定式；不把它削弱成一般将来，也不进一步解释其应验方式或具体时限。
- issue: 按行为施行审判
  choice: 译为“照各人所行的报应各人”。
  alternative: “照各人的行为奖赏各人”或“照各人的行为偿还各人”
  rationale: ἀποδίδωμι在审判语境中指给予各人所当得的；“报应”保留司法与回报意味，同时不把本节纳入或限定于某一特定教义体系。
- issue: 荣耀的所属关系
  choice: 保留“他父的荣耀”。
  alternative: “他自己的荣耀”或“父与子的荣耀”
  rationale: 原文的属格明确指向人子的父；译文不扩展父子荣耀关系的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人子”“荣耀”“天使”“降临”保留必要的圣经术语；句法按汉语信息顺序调整，以分号清楚呈现降临与审判的先后关系。
