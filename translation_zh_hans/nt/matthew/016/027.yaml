  rationale: 修订仅处理两处安全且必要的表达：以“他父亲”替换较旧式的“他父”，并以语义较中性的“报偿”替换通常偏指负面惩罚的“报应”。其余措辞及脚注保留，以维持μέλλει的迫近意味、天使的复数、先降临后报偿的时序，以及πρᾶξις单数的分配性用法。
