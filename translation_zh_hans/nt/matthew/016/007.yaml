  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: zh_hans
  text: 他们彼此议论，说：“我们没有带饼[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们没有带着饼。”
    reason: λαμβάνω在此旅行语境中指拿取、随身携带；“带饼”是自然的现代汉语表达，“带着饼”保留较显性的携带状态。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: δέ在这里是轻微的叙事连接词；现代汉语可不另译，以免用“却”或“但是”强化原文并不明显的转折。
- source_word: διελογίζοντο
  choice: 议论
  rationale: 未完成时表示持续进行的思量和交谈；“议论”既能表达他们在推想，也符合多人相互交谈的语境。
- source_word: ἐν ἑαυτοῖς
  choice: 彼此
  rationale: 指他们在自己这个群体中相互交谈；“彼此”是自然简洁的现代汉语表达。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出议论的具体内容，译为“说”自然且忠实。
- source_word: Ἄρτους
  choice: 饼
  rationale: 原文虽为复数，但这里泛指旅途所需的饼；汉语用“饼”即可自然表达，不必机械标明复数。
- source_word: οὐκ ἐλάβομεν
  choice: 我们没有带饼来
  rationale: λαμβάνω基本义为“拿、取”，在出行和携带食物的语境中指带在身边；“带饼来”清楚表达门徒没有把饼带来的意思，同时以脚注保留另一种贴近字面的表达。
theological_decisions:
- issue: ὅτι所引内容是否补出因果关系
  choice: 不补出“这是因为”
  alternative: “这是因为我们没有带饼来”
  rationale: ὅτι在此可直接引出他们所说或所想的内容。上下文可能暗含他们把耶稣的话归因于没有带饼，但本节原文没有明说“这是因为”；正文保留这种简略和语境张力。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“彼此议论”保留群体内部持续商议的意味；未添加原文没有明说的宾语或因果解释。
