revisions:
- from: 从那时起，耶稣开始向门徒指明：他必须前往耶路撒冷，从长老、祭司长和经学家那里受许多苦[a]，并且被杀[b]，第三日被使复活[c]。
  to: 从那时起，耶稣开始向他的门徒指明：他必须前往耶路撒冷，从长老、祭司长和文士那里遭受许多苦难[a]，并且被杀[b]，在第三日复活[c]。
  rationale: 修订仅解决汉语表达和术语精确性问题：以“在第三日复活”取代不自然的“被使复活”，并借脚注保留原文被动语态而不在正文指定施事者；以“文士”直接对应γραμματεῖς；以“遭受许多苦难”提升自然度并保留原文含义。
