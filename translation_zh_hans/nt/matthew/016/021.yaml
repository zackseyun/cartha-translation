id: MAT.16.21
reference: Matthew 16:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: zh_hans
  text: 从那时起，耶稣开始向他的门徒指明：他必须前往耶路撒冷，从长老、祭司长和文士那里遭受许多苦难[a]，并且被杀[b]，在第三日复活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“受许多苦”。原文直译是“受许多事”，着重所受苦难的众多或多样。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被处死”。
    reason: lexical_alternative
  - marker: c
    text: 原文采用被动语态，意为“被使从死里起来”；施事者没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: 从那时起
  rationale: 自然地标示叙事转折，并保留此后进入新阶段的时间意味。
- source_word: ἤρξατο
  choice: 开始
  rationale: 准确表达动作的起始，表明耶稣由此开始一段新的教导。
- source_word: δεικνύειν
  choice: 指明
  rationale: 兼顾“显示、使人明白”的词义，比单纯“告诉”更贴近原文，也不把它过度解释为详细讲解。
- source_word: δεῖ
  choice: 必须
  rationale: 保留原文强烈的必要性，同时不在正文中断定这必要性的具体来源。
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: 前往耶路撒冷
  rationale: 符合现代汉语，又保留朝向耶路撒冷而去的意思。
- source_word: πολλὰ παθεῖν
  choice: 受许多苦
  rationale: 保留πολλά的复数意味，既可表达苦难之多，也可暗示所受苦难种类繁多。
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: 从长老、祭司长和经学家那里
  rationale: 直接反映ἀπό所表达的来源或施事关系，不将其作用范围解释得超出原文句法。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 这是当时犹太领袖群体的通行、直接译法。
- source_word: ἀρχιερέων
  choice: 祭司长
  rationale: 复数在此指祭司阶层中的领袖，并非同时有多位在任大祭司。
- source_word: γραμματέων
  choice: 经学家
  rationale: 在现代汉语中既保留“文士、抄写者”的历史背景，也较清楚地传达其研究和讲授经文的身份。
- source_word: ἀποκτανθῆναι
  choice: 被杀
  rationale: 简洁、直接地保留被动语态。
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: 第三日被使复活
  rationale: 明确保留ἐγερθῆναι的被动形式及第三日的时间表达；施事者仍不明说。
theological_decisions:
- issue: δεῖ所表达之必要性的来源
  choice: 译作“必须”，不在正文说明是谁的旨意或哪一种必要性
  alternative: 译作“注定要”或“按照上帝的旨意必须”
  rationale: 原句表达强烈的必要性，却未在此从句中明说其来源；较简洁的译法可保留神学分量和原有张力。
- issue: ἐγερθῆναι的语态
  choice: 译作“被使复活”
  alternative: 译作“复活”
  rationale: 希腊文是被动语态。保留被动可避免抹去隐含的施事关系，同时不在正文中补出原句未明说的施事者。
- issue: ἀπό短语与受苦、被杀之间的关系
  choice: 将“从长老、祭司长和经学家那里”直接连接“受许多苦”
  alternative: 译成“在长老、祭司长和经学家手下受许多苦，并被杀”，使其在语义上也涵盖被杀
  rationale: 按原文次序和最直接的句法关系，该短语首先修饰“受苦”；不应在正文中强行排除或确认它是否也在语义上涉及随后的“被杀”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“前往”“指明”保持叙事的郑重感；“经学家”比传统的“文士”更便于当代普通读者理解其群体身份。正文保留原文的必要性、被动语态和施事关系上的张力。
