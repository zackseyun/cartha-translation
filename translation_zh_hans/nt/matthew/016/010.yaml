  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: zh_hans
  text: 也不记得那七个饼给四千人吃，又收拾了多少大筐吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: 也不
  rationale: 本词承接上一节连续的反问；汉语用“也不记得”自然地延续否定问句，并补出语境中省略的“记得”。
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: 七个饼
  rationale: ἄρτος在喂饱众人的叙事中指具体的饼；“七个饼”简洁自然，也保留数量。
- source_word: τῶν τετρακισχιλίων
  choice: 给那四千人的
  rationale: 该属格指与四千人那次喂饱事件的关联；译作“给那四千人的”在现代汉语中清楚表达饼与受食者的关系。
- source_word: πόσας
  choice: 多少
  rationale: 直接表达修饰σπυρίδας的疑问数量。
- source_word: σπυρίδας
  choice: 大筐
  rationale: σπυρίς指较大的筐，与五千人事件所用的κόφινος形成词汇区别；“大筐”保留这一差异。
- source_word: ἐλάβετε
  choice: 收拾了
  rationale: 这里指门徒把剩余食物收集起来；“收拾”符合汉语叙事习惯，并与上下文中的零碎相配。
