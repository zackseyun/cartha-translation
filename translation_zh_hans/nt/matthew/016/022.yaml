  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: zh_hans
  text: 彼得把他拉到一旁，开始责备他，说：“主啊，万万不可[a]！这事绝不会临到你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊语是省略性的惯用表达，字面含有“愿有恩慈临到你”的意思；也可译作“愿上帝怜悯你”或“绝不能有这样的事”。
    reason: 说明Ἵλεώς σοι的惯用、含蓄性质，并保留主要译法。
lexical_decisions:
- source_word: προσλαβόμενος
  choice: 把他拉到一旁
  rationale: 该中间语态分词在此表示彼得把耶稣拉到自己身边，可能是要私下说话；“拉到一旁”自然传达这一语境含义，又不强化为粗暴抓住。
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: 开始责备
  rationale: 保留ἤρξατο加不定式的起始意义；ἐπιτιμάω表示严厉斥责或责备，“责备”直接而自然。
- source_word: Ἵλεώς σοι
  choice: 万万不可
  rationale: 这是省略性的惯用表达，字面涉及“向你施怜悯／恩待”，在本语境中表达强烈否定与劝阻。“万万不可”符合现代汉语表达，也不把原文未明说的“上帝”加入正文。
- source_word: κύριε
  choice: 主啊
  rationale: 保留κύριος的基本称谓及其在《马太福音》中的基督论意味；呼格语气用“啊”自然呈现。
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: 这事绝不会临到你
  rationale: οὐ μή加将来时构成强烈否定，“绝不会”传达其强调语气；“临到你”自然保留σοι所表达的受事关系。
theological_decisions:
- issue: 如何翻译彼得的强烈劝阻而不加入原文未明说的神学内容
  choice: 主啊，万万不可！
  alternative: 主啊，愿上帝怜悯你！／主啊，绝不能有这样的事！
  rationale: Ἵλεώς σοι是含蓄而省略的希腊惯用语，可能隐含祈求上帝施恩，也在语境中表示“愿此事远离你”。正文采用自然的汉语劝阻语“万万不可”，保留其强烈语气而不明加“上帝”；脚注说明字面色彩和其他译法，以保留原文的歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拉到一旁”体现私下劝阻的场景；“万万不可”是普通读者易懂的强烈劝止语。“开始责备”刻意保留原文的起始体表达。
