  source_fidelity: 译文准确反映了原文的主要成分和语气：彼得把耶稣带到一旁（προσλαβόμενος），开始责备（ἤρξατο ἐπιτιμᾶν），称“主啊”（κύριε），并以强烈否定表达抗拒；“这事绝不会临到你”恰当传达οὐ μὴ与将来时的强调否定及σοι的指向。将Ἵλεώς σοι正文译为“万万不可”是在紧接后句的语境中自然且可辩护的惯用语处理，未把原文未明言的“上帝”写入正文。
  naturalness: “彼得把他拉到一旁，开始责备他，说：‘主啊，万万不可！这事绝不会临到你。’”符合现代标准汉语的庄重叙述语体，语序顺畅，人物称谓和直接引语自然。“拉到一旁”也妥善表达私下拉开谈话的语境，不必进一步强化动作力度。
  terminology: “主啊”保留κύριε的常规称谓及福音书语境中的分量；“责备”适合ἐπιτιμάω；“绝不会”充分表达οὐ μή的强调。脚注正确指出Ἵλεώς σοι的省略性和惯用性质，并提供不把单一解释绝对化的替代译法。
