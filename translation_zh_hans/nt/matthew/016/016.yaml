  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: zh_hans
  text: 西门彼得回答说：“你是弥赛亚[a]，是永活的上帝的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。希腊文称号Χριστός意为“受膏者”，与“弥赛亚”相对应。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 回答说
  rationale: 这一分词与限定动词的组合是希腊语常见的引语引入方式。译作“回答说”既自然，也保留彼得是在回应耶稣的问题。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此表示轻微的叙事承接；汉语用“西门彼得回答说”已能自然体现上下文衔接，无须另加“但”或“于是”。
- source_word: Σίμων Πέτρος
  choice: 西门彼得
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: Σὺ
  choice: 你
  rationale: 希腊原文显式使用第二人称代词，带有一定强调；中文将“你”置于判断句句首，可自然保留其焦点。
- source_word: ὁ χριστὸς
  choice: 弥赛亚
  rationale: Χριστός在这里是称号，指受膏者；“弥赛亚”能明确保留其犹太弥赛亚语境，另以脚注提供“基督”这一传统译法。
- source_word: ὁ υἱὸς
  choice: 儿子
  rationale: 冠词使该表达具有特指和称号意味；中文在“上帝的儿子”结构中不需另加相当于定冠词的词。
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: 永生上帝的
  rationale: τοῦ ζῶντος是修饰“上帝”的现在分词，意为“活着的”。“永生上帝”是庄重自然的中文称谓，表达上帝是永活者，并与无生命的神祇形成隐含对比。
theological_decisions:
- issue: Χριστός应译为称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 彼得在此作身份宣认，Χριστός明显作为弥赛亚称号使用。正文译“弥赛亚”凸显“受膏者”的犹太语境，同时脚注保留传统称号“基督”。
- issue: “上帝的儿子”的神学力度
  choice: 是永生上帝的儿子
  alternative: 不作解释性扩展
  rationale: 直接保留原文的特指性宣认，不把它弱化为泛指，也不加入后期神学术语，从而保留经文本身的神学分量与张力。
- issue: τοῦ ζῶντος的表达
  choice: 永生上帝
  alternative: 活着的上帝
  rationale: “永生上帝”在现代中文中更庄重自然，并传达上帝是永活者；但不将此短语扩写为超出原文的本体论说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“回答说”符合中文叙事习惯；“弥赛亚”保留称号及犹太语境；“永生上帝”采用中文基督教语境中自然而有尊严的表达。
