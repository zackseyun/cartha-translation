base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: zh_hans
  text: 你们怎么不明白，我不是对你们讲饼的事呢？你们却要提防法利赛人和撒都该人的酵[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们却要当心法利赛人和撒都该人的酵。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“酵”是比喻；下一节说明它指法利赛人和撒都该人的教导。
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: 你们怎么还不明白
  rationale: πῶς与否定词οὐ构成带责备意味的反问；“怎么还不明白”既自然，也传达门徒本应领会却仍未领会的语气。
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: 我对你们说的不是饼
  rationale: περὶ ἄρτων意为“关于饼”；ἄρτων虽为复数，但现代汉语在泛指食物时自然用“饼”。此译保持直接陈述，不把经文提前解释为教训。
- source_word: προσέχετε
  choice: 要提防
  rationale: 这里是带警戒意味的命令，不只是“留意”；“提防”能自然配合ἀπό所表达的防备、远离之意。
- source_word: δὲ
  choice: 可是
  rationale: δὲ在这里标示由纠正误解转到真正警告的轻微转折；“可是”符合现代汉语语流，又不过分强化对立。
- source_word: ἀπὸ τῆς ζύμης
  choice: 酵
  rationale: ζύμη指使面团发酵的酵，在此具有比喻义。“酵”保留原文意象及其经文语境中的呼应，不提前改译成其所指的“教导”。
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: 法利赛人和撒都该人的
  rationale: 采用现代中文圣经中通行的群体名称；属格表达与这些群体有关、具有其特征的“酵”。
theological_decisions:
- issue: “酵”的比喻意义
  choice: 正文保留“酵”的比喻，不在本节直接释为“教导”。
  alternative: 直接译作“法利赛人和撒都该人的教导”。
  rationale: 本节原文使用ζύμη这一比喻，下一节才明确说明它指法利赛人和撒都该人的教导。保留比喻可维持叙事推进，并避免把后文解释提前写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎么还不明白”保留责问语气；“饼”符合上下文中的日常食物用语；“酵”保留原文比喻，并以脚注帮助普通读者理解。
