id: MAT.16.19
reference: Matthew 16:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: zh_hans
  text: 我要把天国[a]的钥匙给你；凡你在地上捆绑[c]的，必已在天上被捆绑[b]；凡你在地上释放的，必已在天上被释放。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“诸天的国”。这是马太福音经常使用的表达。
    reason: lexical_alternative
  - marker: b
    text: 传统译法常作“也必在天上被捆绑……也必在天上被释放”。原文采用将来时的“是”与完成被动分词，更可理解为“必已被捆绑……必已被释放”。
    reason: alternative_reading
  - marker: c
    text: “捆绑”和“释放”可含有禁止与准许，或加上与解除义务的意思；正文保留了原文的比喻。
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: 我要……给你
  rationale: 以自然的现代汉语表达将来主动直陈语气及与格间接宾语，保留明确的应许语气。
- source_word: τὰς κλεῖδας
  choice: 钥匙
  rationale: 保留原文复数名词的意象，不在正文中解释为某一种特定形式的权柄。
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是现代汉语中自然、庄重且为读者熟悉的马太用语；原文“诸天”的复数形式以脚注说明。
- source_word: ὃ ἐὰν
  choice: 凡……的
  rationale: 自然表达不定关系结构，并在捆绑与释放两个平行分句中保持对应。
- source_word: δήσῃς
  choice: 捆绑
  rationale: 保留原文的比喻及其权威性、裁定性回响，不直接窄化为“禁止”或“定罪”。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 以惯用汉语呈现与“在天上”相对的空间表达。
- source_word: ἔσται δεδεμένον
  choice: 必已在天上被捆绑
  rationale: 用“必已”尽可能传达将来时的系词与完成被动分词所构成的将来完成状态，同时避免生硬的逐词直译。
- source_word: λύσῃς
  choice: 释放
  rationale: 与“捆绑”形成清楚对照，也保留解除束缚的比喻；较“松开”更适合此处庄重语境。
- source_word: ἔσται λελυμένον
  choice: 必已在天上被释放
  rationale: 与前一分句平行，传达将来时点上已经形成的被动完成状态。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在天上
  rationale: 这是现代汉语的自然表达；希腊文复数不必机械译为“在诸天中”。
theological_decisions:
- issue: 捆绑与释放公式的体貌及其神学含义
  choice: 译作“必已在天上被捆绑／释放”
  alternative: “也必在天上被捆绑／释放”
  rationale: ἔσται加完成被动分词凸显在将来时点已经成立的状态，可能表明地上的行动与天上的决定相应，而非必然由地上的行动发动。译文反映这一语法特点，却不把它发展为特定宗派的教会权柄学说。
- issue: “天国的钥匙”的含义
  choice: 保留“钥匙”这一比喻
  alternative: 直解为“准许进入或拒绝进入的权柄”或“管家的权柄”
  rationale: 钥匙意象确实带有权柄意味，但正文没有将其限定为某一种制度或职分；保留比喻可避免加入经文本身未明说的教会论体系。
- issue: “捆绑”和“释放”的具体指向
  choice: 正文保留比喻，脚注提示可能的禁准或责任含义
  alternative: 正文直接译成“禁止／准许”
  rationale: 这些词在相关语境中可有裁定、禁止、准许、加上或解除义务的含义，但原句仍使用形象化语言；不宜在正文中消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我要把……给你”自然表达应许；分号呈现三个紧密相连的平行分句。“必已”虽略带书面色彩，但比“将会已经”自然，并能较准确地保留原文完成状态的意味。
