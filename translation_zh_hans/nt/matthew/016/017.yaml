  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: zh_hans
  text: 耶稣就回答他：“西门·巴约拿[a]，你是有福的！因为不是属血肉的人把这事启示给你的，而是我在天上的父[c]启示给你的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约拿的儿子西门”。“巴约拿”保留了希腊文中亚兰语父名的形式。
    reason: lexical_alternative
  - marker: c
    text: 原文作“在诸天之中的”；这里按现代汉语习惯译作“在天上的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: 耶稣就回答他
  rationale: 分词加限定动词构成常见的“回答说”表达；译作“回答他”符合现代汉语叙事习惯，“就”自然承接上文并体现 δέ 的推进作用。
- source_word: Μακάριος
  choice: 你是有福的
  rationale: “有福”保留 μακάριος 的祝福意味及神学分量，比偏重主观感受的“快乐”更准确。
- source_word: Σίμων Βαριωνᾶ
  choice: 西门·巴约拿
  rationale: 按希腊文本保留其中的亚兰语父名形式，以“巴约拿”音译，并用脚注说明其含义。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出西门蒙福的原因，“因为”清楚表达因果关系。
- source_word: σὰρξ καὶ αἷμα
  choice: 血肉之人
  rationale: 该习语泛指人或出于人的来源；译作“血肉之人”既保留原文意象，又使现代汉语读者容易理解其施事功能。
- source_word: ἀπεκάλυψέν σοι
  choice: 启示给你的
  rationale: “启示”保留 ἀποκαλύπτω 所含揭开、显明的意义及神圣启示语境；“这”由前文语境补出，使汉语表达完整自然。
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: 而是我……的父
  rationale: “而是”明确保留 ἀλλά 对人间来源与父神启示之间的强烈对比。
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: 在天上的
  rationale: 希腊文形式为复数“诸天”，但“在天上的父”是自然、庄重且语义相当的现代汉语表达。
theological_decisions:
- issue: 西门认信的启示来源
  choice: 将“血肉之人”与“我在天上的父”并列对照，表明这认识并非源于人，而是源于父的启示。
  alternative: 将“血肉”特指西门自己的天然推理，或特指某一位人间教师。
  rationale: 原文广泛排除人的来源，却没有进一步限定究竟是西门自身还是其他人；译文保留这一范围，不扩展为完整的默示教义。
- issue: 启示的隐含宾语
  choice: 在汉语中补出“这”，指向上文西门的认信。
  alternative: 不补宾语，译成较生硬的“没有启示给你”。
  rationale: 希腊文可由语境理解宾语；补出“这”只使汉语句法自然，并不额外界定启示的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你是有福的”保留宣告祝福的语气；“血肉之人”兼顾原文意象与汉语可读性；后半句重复“启示给你的”，使对比清楚，避免仅用省略结构造成歧义。
