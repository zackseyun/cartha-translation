  text: He says to them[a], “But who do you say that I am?”
translation:
  language: zh_hans
  text: 他对他们说：“但你们说我是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 他问
  rationale: 原词直译为“他说”，但本句内容是直接问句；现代汉语用“他问”自然清楚，也保留历史现在时所带来的叙事临场感。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与言说动词连用，指耶稣向门徒发问；“问他们”自然表达其间接宾语功能。
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 明确保留第二人称复数，并借“但你们”的位置体现原文显明代词所带的强调。
- source_word: δὲ
  choice: 但
  rationale: 承接上文别人对耶稣身份的看法，并与门徒自己的判断形成对比。
- source_word: τίνα
  choice: 谁
  rationale: 在间接问句“说我是谁”中，“谁”是现代汉语自然且准确的表达。
- source_word: με
  choice: 我
  rationale: 原文在宾格加不定式结构中使用宾格；汉语按有限分句习惯表达为“我是谁”。
- source_word: λέγετε
  choice: 你们说
  rationale: 保留第二人称复数和现在时语义；这里的“说”也可涵盖“认为、宣认”的语境含义，而不提前加入解释。
- source_word: εἶναι
  choice: 是
  rationale: 原文为“是”的不定式；汉语自然重组为“说我是谁”。
theological_decisions:
- issue: 门徒自身判断的强调
  choice: “但你们说我是谁？”
  alternative: “那么，你们说我是谁？”
  rationale: “但”保留δὲ与上文众人意见之间的对比，“你们”则保留Ὑμεῖς的明确强调；不在本节提前加入彼得随后才说出的基督论称谓。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他问他们”比逐字的“他对他们说”更符合汉语问句引语习惯；正文无须脚注，因为希腊语宾格加不定式可直接而无损地转为汉语“说我是谁”。
