  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: zh_hans
  text: 你们还不明白，也不记得那给五千人吃的五个饼，以及你们收了多少篮吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: 还不
  rationale: 表达“直到现在仍未”的时间意味，也保留耶稣反问中责备的语气；现代汉语中自然简洁。
- source_word: νοεῖτε
  choice: 明白
  rationale: 这里指领会先前神迹的意义，而非单纯感知；“明白”符合现代汉语习惯。
- source_word: οὐδὲ
  choice: 也不
  rationale: 连接两个否定谓语“明白”和“记得”，准确体现原文并列否定结构。
- source_word: μνημονεύετε
  choice: 记得
  rationale: 直接指记起先前使众人吃饱的事件。
- source_word: τοὺς πέντε ἄρτους
  choice: 那五个饼
  rationale: ἄρτος在本叙事中指可分给众人的饼；“那”指向门徒已知的先前事件。
- source_word: τῶν πεντακισχιλίων
  choice: 给五千人吃
  rationale: 该属格简略地关联五饼与五千人的事件；补出“给……吃”可在中文中自然清楚地表达这一关系。
- source_word: πόσους κοφίνους
  choice: 多少篮
  rationale: 保留具体容器及数目的问题；上下文已表明篮中装的是剩余食物，无须增译“篮子”。
- source_word: ἐλάβετε
  choice: 收了
  rationale: λαμβάνω基本义为“拿、收取”；在此语境中指收起剩余食物。“收了”既自然，又比“收集了”更贴近原词的宽泛含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“还不明白吗”保留οὔπω既可理解为“仍不”也可直译为“尚未”的时间意味。后半句保留原文较紧凑的列举结构，不额外解释神迹的寓意。
