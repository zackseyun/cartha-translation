- from: 你们还不明白吗？也不记得那五个饼给五千人吃，以及你们收了多少篮吗？
  to: 你们还不明白，也不记得那给五千人吃的五个饼，以及你们收了多少篮吗？
  rationale: 合并为一个反问句，以对应希腊文对两个否定动词的统一疑问统摄；调整“五个饼”短语语序，使其在现代汉语中自然清楚。保留“收了多少篮”，不增译原文未明说的“零碎”。
