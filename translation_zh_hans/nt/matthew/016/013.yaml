  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: zh_hans
  text: 耶稣来到凯撒利亚·腓立比一带，问他的门徒说：“人们说人子[b]是谁？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“人们说人子是什么人？”
    reason: 原文采用宾格加不定式的间接陈述结构；两种汉语表达均可传达其意思，正文采用更简洁自然的“是谁”。
  - marker: b
    text: “人子”是耶稣常用的自称。其希腊文短语按字面可理解为“人的儿子”，并可能使人联想到《但以理书》7章中的人物。
    reason: 说明该称号的字面构成、福音书中的自称用法及可能的互文关联，而不将其含义限定为单一解释。
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: 来到……就
  rationale: 不定过去时分词交代先行背景，δέ作轻微场景转换；现代汉语用“来到……就”自然呈现动作次序，无须添加原文没有的明确时间副词。
- source_word: εἰς τὰ μέρη
  choice: 一带
  rationale: μέρη在此指某城周围的地区；“一带”比直译为“各部分”自然准确。
- source_word: Καισαρείας τῆς Φιλίππου
  choice: 凯撒利亚·腓立比
  rationale: 采用现代中文圣经地名的通行音译，并以间隔号表明复合地名。
- source_word: ἠρώτα
  choice: 问
  rationale: 未完成过去时可带持续或展开中的意味，但在引出直接问话的叙事语境中，汉语简单动词“问”最自然；不强行译成“一直问”，以免过度解释体貌。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 他的门徒
  rationale: “门徒”准确保留福音书中μαθητής作为跟随者和受教者的惯用含义；αὐτοῦ译为“他的”。
- source_word: λέγων
  choice: （不另译）
  rationale: 希腊语常以“问……说”引出直接引语；现代汉语仅用“问”即可完整表达，若机械加入“说”会显得累赘。
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: 人们说……是谁
  rationale: ἄνθρωποι泛指众人，不限男性；汉语间接问句用“说……是谁”既自然，又忠实传达宾格加不定式结构。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣在福音书中具有代表性的自称及其与《但以理书》等经文的互文联系，避免用解释性译法预先限定其含义。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的／那一位人
  rationale: “人子”是中文圣经传统中简洁而稳定的表达，既可作为耶稣的自称，也保留该短语可能包含的普通人性、代表性人物及《但以理书》7章意象之间的张力；正文不把其中任何一层含义定为唯一解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“一带”符合普通话地理用语；“就问”流畅呈现背景动作与主要动作的衔接。保留“人子”这一具有经文传统和神学张力的称呼，并用脚注提示其开放含义。
