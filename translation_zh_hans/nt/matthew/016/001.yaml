  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: zh_hans
  text: 法利赛人和撒都该人前来试探耶稣，请他向他们显一个从天上来的神迹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”或译“记号”。“试探”也可译作“考验”；这里含有敌意，也可能有想要套住他的意思。
    reason: 说明σημεῖον与πειράζοντες的词义范围，并保留原文对敌对动机的表达张力。
lexical_decisions:
- source_word: προσελθόντες
  choice: 前来
  rationale: 该不定过去时分词表示他们来到耶稣跟前，先于主要动作发生；“前来”简洁自然，并保留趋近之意。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般读者熟悉的群体名称。
- source_word: Σαδδουκαῖοι
  choice: 撒都该人
  rationale: 采用现代中文圣经及一般读者熟悉的群体名称。
- source_word: πειράζοντες
  choice: 试探耶稣
  rationale: πειράζω可指试验、考验或试探；本处语境带有敌意。“试探”在中文里自然，并保留其动机所具有的张力；补出“耶稣”使指代清楚。
- source_word: ἐπηρώτησαν
  choice: 求
  rationale: 该动词本义为询问或请求；因其后接“显给他们看”的不定式内容，中文用“求”比“问”更符合句法和语境。
- source_word: σημεῖον
  choice: 神迹
  rationale: σημεῖον直指具有指示、验证作用的“记号”；本处要求来自天上的超自然凭证。中文圣经语境中的“神迹”自然且易懂，但脚注保留较形式对应的“记号”。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上来的
  rationale: 明确表达该记号的来源，同时保持自然的现代汉语语序。
- source_word: ἐπιδεῖξαι
  choice: 显个……给他们看
  rationale: 该不定式意为展示、显给人看；此译法口吻自然，也保留公开展示的意味。
theological_decisions:
- issue: 法利赛人与撒都该人请求的敌对意味
  choice: 译作“试探耶稣”
  alternative: 考验耶稣／想要套住他
  rationale: “试探”能传达πειράζω在本语境中的敌对倾向，又不像“想要套住他”那样把其具体策略解释得过满。
- issue: σημεῖον所指的性质
  choice: 正文译作“神迹”，脚注说明也可译“记号”
  alternative: 记号／凭证
  rationale: 语境要求耶稣展示一个来自天上的超自然征兆；“神迹”对普通中文读者最自然。脚注则保留该词“记号”的基本词义，避免抹去其验证性含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“法利赛人”“撒都该人”“神迹”沿用中文读者熟悉的圣经用语；句式避免生硬照搬希腊语分词结构。
