id: MAT.16.18
reference: Matthew 16:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: zh_hans
  text: 我也对你说：你是彼得；我要在这磐石[a]上建立我的教会，阴间[b]的门绝不能胜过它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“彼得”（Petros）与“磐石”（petra）形成文字关联。“这磐石”可理解为彼得本人、彼得的宣认，或作为宣认者和使徒代表的彼得。
    reason: 保留原文文字关联及其所指上的解释空间。
  - marker: b
    text: “阴间”即死者的领域；希腊文为Hades。传统上有时译作“地狱”。
    reason: 说明原词含义，并避免与最终刑罚之地混同。
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: 我也
  rationale: κἀγώ带有强调和回应意味，δὲ表示承接或轻微转折；“我也”自然承接彼得先前的宣认，又不过分强化对比。
- source_word: σοι λέγω
  choice: 对你说
  rationale: 忠实保留λέγω的直接言说形式，并符合现代汉语表达。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经中通行的人名译法；希腊文Πέτρος与下文πέτρα之间的文字关联则在脚注中说明。
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: 在这磐石上
  rationale: 保留ἐπί加与格的空间意象以及ταύτῃ的指示意味，不在正文中限定“磐石”的具体所指。
- source_word: οἰκοδομήσω
  choice: 我要……建立
  rationale: 既表达将来意义，也保留οἰκοδομέω的建造意象；中文以“建立教会”较自然，而“磐石”仍维持建筑隐喻。
- source_word: μου τὴν ἐκκλησίαν
  choice: 我的教会
  rationale: “教会”是此处ἐκκλησία在基督信仰群体语境中的通行而准确的译法，并保留μου所表达的归属关系。
- source_word: πύλαι ᾅδου
  choice: 阴间的门
  rationale: ᾅδης指死者的领域，并非特指最终刑罚之地；“阴间”比“地狱”更贴近原词，同时保留“门”的形象。
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: 绝不能胜过它
  rationale: κατισχύω有胜过、压倒或占优势之意；“胜过”简洁自然，“绝不能”传达οὐ与将来时所表达的明确否定，代词“它”回指教会。
theological_decisions:
- issue: “这磐石”（πέτρα）的所指
  choice: 正文保留“这磐石”，不限定其所指，并以脚注列出主要理解。
  alternative: 明确译成彼得本人、彼得的宣认，或作为宣认者及使徒代表的彼得。
  rationale: 希腊文以Πέτρος和πέτρα形成明显关联，但本句本身并未明确消除有关具体所指的解释空间。译文不应替读者解决跨传统的神学争议。
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 地狱；死者的领域
  rationale: “阴间”能简明表达死者领域的含义，又避免把ᾅδης等同于表示最终刑罚的概念。
- issue: “阴间的门”与教会的关系
  choice: 译作“绝不能胜过它”，保留对抗性意象。
  alternative: 不能拘禁它；不能抵挡它。
  rationale: κατισχύω直接表示胜过或压倒；本文没有明确说明这形象偏重防御、进攻还是死亡的拘禁能力，因此不在译文中进一步具体化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。用分号呈现“你是彼得”与“在这磐石上建立”之间紧密但不被译文强行界定的关系；保留磐石、建立和门的整体意象。
