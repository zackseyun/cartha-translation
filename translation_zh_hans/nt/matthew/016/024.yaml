  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: zh_hans
  text: 于是，耶稣对他的门徒说：“如果有人愿意来跟从我，就当否认自己，背起自己的十字架，并且跟随我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 作为叙事中的时间与承接标记，既表明事件随前文而来，也符合现代汉语自然表达。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对门徒
  rationale: “门徒”准确保留福音书中学习者兼跟随者的关系；汉语语境已清楚表明是耶稣的门徒，省略“他的”更自然且不损失所指。
- source_word: Εἴ τις θέλει
  choice: 如果有人愿意
  rationale: 保留条件结构、不定范围和意愿含义；“有人”在汉语中自然涵盖任何人，无须标示语法性别。
- source_word: ὀπίσω μου ἐλθεῖν
  choice: 跟从我
  rationale: 该表达字面为“到我后面来”，在门徒语境中意为跟从；“跟从”保留门徒跟在老师之后的意象，并与末尾较常用的“跟随”略作措辞区分。
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: 就应当舍弃自己
  rationale: 第三人称命令在现代汉语中用“应当”自然表达；“舍弃自己”传达不以自我为主、放弃自我主张的决断，不误解为否认自身存在。
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: 背起自己的十字架
  rationale: 在十字架刑罚的历史图景中，αἴρω包含拿起并负载之意；汉语“背起十字架”自然、庄重，也保留个人所承担代价的含义。
- source_word: ἀκολουθείτω μοι
  choice: 并且跟随我
  rationale: “跟随我”准确表达门徒持续跟从耶稣的命令；“并且”清楚连接三个要求。
theological_decisions:
- issue: “舍弃自己”的含义
  choice: 舍弃自己
  alternative: 否认自己／不认自己
  rationale: ἀπαρνέομαι可表示否认、拒绝承认或弃绝；这里以自己为宾语，重点是放弃自我主权和自我中心。“舍弃自己”保留严肃要求，又避免汉语“否认自己”可能被理解为否认自身存在或价值。
- issue: 十字架意象是否解释为一般苦难
  choice: 保留“自己的十字架”而不加解释
  alternative: 承担自己的苦难／牺牲
  rationale: 原文使用具体而强烈的刑具意象，也预示耶稣的受难；直接保留可避免把它缩减为泛指人生困难或预先限定其神学意义。
- issue: 希腊文代表性阳性单数在汉语中的表达
  choice: 用无性别标记的单数泛指“有人……自己”
  alternative: 用“他……他自己”显明阳性单数形式
  rationale: 汉语口语中的“有人”和“自己”本身不标语法性别，却准确保持单数泛指和普遍范围；加入“他”会在现代书面汉语中造成不必要的男性限定，而非忠实反映原文意图。
- issue: 两个“跟从”表达的关系
  choice: 前句译“跟从我”，末句译“跟随我”
  alternative: 前句直译“到我后面来”，末句译“跟随我”
  rationale: 前者是来到耶稣身后作门徒的惯用表达，后者是直接的持续跟随命令。采用近义而不完全相同的措辞，既显示语义联系，也不把两个希腊表达机械合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的条件结构与三个连续要求；不加宗派性解释。汉语天然不标示代表性阳性，因此无需为性别另设脚注。
