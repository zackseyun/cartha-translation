  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: zh_hans
  text: 因为，凡想保全自己生命的，必失去生命；但，凡为我失去生命的，必得着生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节中各处的“生命”，希腊文也可译作“性命”“自己”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: 因为，凡……的……；但凡……的……
  rationale: 两个带条件语气的不定关系结构表达普遍条件，用“凡……的”自然传达；γάρ译为“因为”，承接上文，δέ译为“但”，突出两句的反差。
- source_word: θέλῃ
  choice: 想
  rationale: θέλω在此表示意愿；“想”是现代汉语中自然、简洁的表达。
- source_word: ψυχὴν
  choice: 生命
  rationale: ψυχή在此门徒舍己的语境中指人的生命，并与“保全、失去、得着”构成悖论；它也可指“性命”或“灵魂”，故以脚注保留词义幅度。
- source_word: σῶσαι
  choice: 保全
  rationale: σῴζω在这里指设法保存自己的生命；“保全”比单独的“救”更清楚地表达此处保存生命的意思。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 必失去 / 失去
  rationale: ἀπόλλυμι在此指失去生命。第一处为将来时，以“必失去”表达结果；第二处位于不定条件结构中，译作“失去”。
- source_word: ἕνεκεν ἐμοῦ
  choice: 为我
  rationale: ἕνεκεν加属格表达缘由或动机；“为我”简洁自然，也保留因忠于耶稣而付代价的个人指向。
- source_word: εὑρήσει
  choice: 必得着
  rationale: εὑρίσκω本义为“找到”；在“生命”作宾语的汉语搭配中，“得着生命”比“找到生命”更自然，同时保留获得而非解释性扩展的意味。
- source_word: αὐτοῦ / αὐτήν
  choice: 自己 / 生命
  rationale: 希腊文以阳性单数作泛指。汉语用“自己”自然涵盖泛指对象；重复“生命”可避免代词指向不清，并维持两句平行。
theological_decisions:
- issue: 门徒悖论中ψυχή的译法
  choice: 生命
  alternative: 灵魂；性命；自己
  rationale: 上下文谈到跟从耶稣、舍己以及可能面对死亡，“生命”最能自然承载保全、失去和得着的悖论，同时不把ψυχή局限为与身体相对的非物质“灵魂”。脚注保留其他可能含义，以免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“因为”保留与上文的论证联系；两次“必”体现主句将来结果的确定性。“保全—失去—得着”形成清楚的悖论和平行结构。
