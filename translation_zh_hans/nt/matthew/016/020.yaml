id: MAT.16.20
reference: Matthew 16:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: zh_hans
  text: 于是，他严令门徒不要告诉任何人，他就是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文“Χριστός”是称号，意为“受膏者”。
    reason: 说明称号的传统译法及原义。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事事件的先后承接；“于是”在现代汉语中简洁自然。
- source_word: διεστείλατο
  choice: 严令
  rationale: 该动词在此表达强烈而明确的禁令；“严令”保留其力度，又避免把它误解为单纯警告危险。
- source_word: τοῖς μαθηταῖς
  choice: 门徒
  rationale: 指上下文中已知的耶稣门徒群体；汉语无需补出“他的”。
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: 不可告诉任何人
  rationale: ἵνα 加虚拟式在此说明命令的内容；此译法自然地表达全面禁止。
- source_word: ὅτι αὐτός ἐστιν
  choice: 他就是
  rationale: 表达所禁止透露的内容；“就是”自然体现此处认定身份的语气，而不把 αὐτός 过度强化为“他本人”。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: Χριστός 在此是特定称号，与希伯来传统中的“弥赛亚”相对应；采用“弥赛亚”可使读者清楚这不是姓名，而是所期待之受膏者的称号。
theological_decisions:
- issue: Χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督；受膏者
  rationale: 此处 Χριστός 带冠词并作为身份称号使用。“弥赛亚”保留其犹太弥赛亚背景；脚注列出传统译法“基督”并说明其含义，避免把称号当作姓名，也不额外界定该称号的神学内涵。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“严令”传达命令的强度；“不可告诉任何人”清楚易懂。保留原文代词“他”，不添加原文未明说的专名。
