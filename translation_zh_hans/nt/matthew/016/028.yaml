  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: zh_hans
  text: 我实在告诉你们：站在这里的人中，有些人绝不会经历死亡[a]，直到他们看见人子在自己的国度[c]中降临[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“绝不会尝到死亡的滋味”；希腊文使用强调否定。
    reason: lexical_alternative
  - marker: b
    text: “人子在自己的国度中降临”可能指登山变像、复活与升高、五旬节、对耶路撒冷的审判，或末后的再来；经文本身没有明确说明是哪一事件。
    reason: alternative_reading
  - marker: c
    text: “国度”也可译作“王权”或“统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 作为庄重的断言引出权威性话语；“实在”在现代中文中自然，也保留了郑重语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然保留第一人称陈述和对听众的直接称呼。
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: 站在这里的人中，有些人
  rationale: 明确表达分属关系，即所说的是在场者中的一部分人。
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: 绝不会尝到死味
  rationale: “绝不会”传达οὐ μή的强烈否定；“尝到死味”保留原文鲜明且可理解的隐喻。
- source_word: ἕως ἂν ἴδωσιν
  choice: 直到他们看见
  rationale: 自然表达以未来事件为界限的时间关系，不额外规定该事件发生后的情形。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣在本语境中的称号及其经文和末世意涵，不作解释性改写。
- source_word: ἐρχόμενον
  choice: 来临
  rationale: 直接表达分词“来到／来临”的意义，不从平行经文加入“带着能力”等原文没有的成分。
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: 在他的国度中
  rationale: “国度”保留βασιλεία可指国或王权统治的语义空间；正文不把它单限定为领域或抽象统治。
theological_decisions:
- issue: “人子在他的国度中来临”所指的事件
  choice: 按原文直译，不在正文中确定具体事件
  alternative: 登山变像、复活与升高、五旬节、对耶路撒冷的审判，或末后的再来
  rationale: 希腊文本本身没有明确指认其中哪一事件；译文应保留这一解释上的开放性和神学张力。
- issue: βασιλεία的侧重点
  choice: 国度
  alternative: 王权、统治、作王掌权
  rationale: 该词既可侧重国度，也可侧重君王的统治。“国度”保留传统意象和较宽语义，不把经文缩窄为单一抽象概念。
- issue: 死亡之前必看见之应许的强度
  choice: 以“绝不会”表达强调否定
  alternative: 不会、断不会
  rationale: οὐ μή与虚拟式构成强烈否定；译文保留其确定而郑重的语气，同时不进一步解释应许如何应验。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尝到死味”保留原文隐喻；“来临”比日常口语“来”更符合经文语体，但不额外加入解释。脚注标记置于各自相关词句之后。
