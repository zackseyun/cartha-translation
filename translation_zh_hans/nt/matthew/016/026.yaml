  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: zh_hans
  text: 人若赚得全世界，却丧失自己的生命，有什么益处呢？人又能拿什么来换取自己的生命呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“生命”也可译作“灵魂”。希腊语词 ψυχή 可按语境指“生命”、“自己”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: 又有什么……呢
  rationale: τί引出反问，γάρ承接并说明前文；汉语用“又”自然体现承接和论证关系。
- source_word: ὠφεληθήσεται
  choice: 有什么益处
  rationale: 该词为将来时被动态，表示得到益处；反问句中译作“有什么益处”自然且准确。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处为泛指的人，现代汉语“人”可准确表达其代表性，无须按语法阳性译为“男人”。
- source_word: ἐὰν
  choice: 即使
  rationale: 在反问语境中，“即使”清楚呈现假设条件，并突出所得与所失之间的强烈反差。
- source_word: τὸν κόσμον ὅλον
  choice: 全世界
  rationale: 保留κόσμος与ὅλος所表达的世界整体和全面性。
- source_word: κερδήσῃ
  choice: 赚得
  rationale: 该词表示获得、赢得；“赚得”保留与赔失相对的经济隐喻。
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: 却赔上自己的生命
  rationale: δέ表达转折；ψυχή在此可指生命、自己或灵魂，正文取自然且语境适切的“生命”，另以脚注保留“灵魂”。
- source_word: ζημιωθῇ
  choice: 赔上
  rationale: 该被动态可指蒙受损失、丧失；“赔上”在汉语中凝练地表现为获取世界而付出自身生命的代价。
- source_word: ἢ τί
  choice: 他还能拿什么
  rationale: ἤ引出并列的第二个反问；“还能”自然强化在人失去生命后无物可换的反问意味。
- source_word: δώσει
  choice: 拿
  rationale: 与“什么”和“换回”搭配，汉语以“拿什么换”自然表达“将给出什么作为交换”。
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: 换回自己的生命
  rationale: ἀντάλλαγμα指作为交换而给出的东西；“拿什么换回”保留交换隐喻，也准确表达属格所指的交换对象。
theological_decisions:
- issue: 终极损失语境中ψυχή的译法
  choice: 生命
  alternative: 灵魂；自己
  rationale: 本节并未要求把人严格区分为身体和非物质灵魂；ψυχή可指人的生命或整个自我。正文译作“生命”较自然，也避免加入经文本身未明确规定的人论体系；传统且合理的“灵魂”译法以脚注保留。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“赚得／赔上／换回”贯穿商业交换意象；两处ψυχή统一译为“生命”，并用脚注保存其真实语义幅度。
