id: MAT.16.23
reference: Matthew 16:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: zh_hans
  text: 耶稣转过身来，对彼得说：“退到我后面去[a]，撒但！你是我的绊脚石，因为你所想的不是上帝的事，而是人的事[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走到我后面去。”这句话既可表示不要挡在前面，也保留了“在我后面”的空间意味。
    reason: lexical_alternative
  - marker: b
    text: “人的事”指属于人的想法和考量；这里的“人”泛指人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 转过身来
  rationale: 该不定过去时被动分词在此作不及物用，表示耶稣转身面向彼得；“转过身来”自然地保留了说话前的身体动作。
- source_word: Ὕπαγε ὀπίσω μου
  choice: 退到我后面去
  rationale: 既保留ὀπίσω的空间意象，也用现代汉语自然表达严厉的命令；“退到”还能传达彼得不应拦阻耶稣、而应回到跟随者位置的语境意味，但正文不把这一含义解释得过满。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 在此是呼格称谓；采用通行音译，保留斥责的强度及其与试探叙事的呼应，不改译为较弱且带解释性的“敌对者”。
- source_word: σκάνδαλον
  choice: 绊脚石
  rationale: 保留使人绊倒之障碍的具体比喻，符合彼得试图阻拦耶稣道路的上下文；比“冒犯”更具体，也不转成“网罗”的另一种意象。
- source_word: ἐμοῦ
  choice: 我的
  rationale: 与“绊脚石”组合为自然汉语“我的绊脚石”，清楚表示彼得对耶稣构成阻碍；若直译作“属我的”则生硬且可能误解。
- source_word: φρονεῖς
  choice: 你所想的
  rationale: φρονέω在此指思想取向和关注所在，而非一闪而过的念头；结合后面的对比，“你所想的”自然、清楚，并保留其心思取向的含义。
- source_word: τὰ τοῦ θεοῦ
  choice: 上帝的事
  rationale: 较贴近希腊文的实词化复数结构，保留与“人的事”的平行对照，又避免提前限定为“利益”或“计划”。
- source_word: τὰ τῶν ἀνθρώπων
  choice: 人的事
  rationale: “人”在现代汉语中可自然泛指人类，准确表达与“上帝的事”相对的人之考量；脚注说明其语境含义而不在正文中过度释义。
theological_decisions:
- issue: 耶稣以“撒但”称呼彼得的含义
  choice: 正文直接保留“撒但”这一称谓，不说明彼得究竟被等同于撒但，还是在充当撒但式的拦阻者。
  alternative: 译作“敌对者”，或明确解释为耶稣在对借彼得行事的撒但说话。
  rationale: 希腊文的严厉称呼本身具有神学张力；音译“撒但”保留其正典呼应和解释空间，避免译文替读者裁定。
- issue: “上帝的事”与“人的事”的范围
  choice: 保留两组宽泛而平行的表达。
  alternative: 具体译为“上帝的旨意/利益”与“人的顾虑/利益”。
  rationale: 原文没有明确限定为旨意、计划、利益或顾虑；较直译的表达能保留语义范围及彼此的强烈对照。
- issue: 命令“退到我后面去”的意义
  choice: 保留空间性的措辞，同时让其在语境中可含“不要拦阻、回到跟随者位置”的意味。
  alternative: 直接意译为“别挡我的路”或“离开我”。
  rationale: 原文ὀπίσω μου确实包含“在我后面”的表达；不应只保留排斥含义，也不应在正文中把门徒身份的解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“上帝的事／人的事”的对称结构和“绊脚石”的鲜明比喻；引号与脚注标记按简体中文出版习惯处理。
