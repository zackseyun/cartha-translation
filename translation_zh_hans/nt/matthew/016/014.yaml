id: MAT.16.14
reference: Matthew 16:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: zh_hans
  text: 他们说[a]：“有人说是施洗者约翰，有人说是以利亚，还有人说是耶利米，或先知中的一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作：“他们说：‘有人说你是施洗者约翰，有人说你是以利亚，还有人说你是耶利米，或先知中的一位。’”
    reason: 说明原文依据上文省略了各项身份判断的对象；中文可按语境明确补出“你是”。
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ在此承接叙事，无须在中文中硬译为表示转折的连词；εἶπαν自然译为“说”。
- source_word: Οἱ μὲν
  choice: 有人说
  rationale: μέν开启与后面的ἄλλοι、ἕτεροι相配的分列结构；“有人说”符合现代汉语表达，并保留原文省略判断对象的形式。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: 施洗者约翰
  rationale: “施洗者”直接表达βαπτιστής的身份和行动，也避免把称号误解为名字的一部分。
- source_word: ἄλλοι δὲ
  choice: 有人说
  rationale: 继续分列不同人群的回答；中文重复“有人说”比逐字加入转折连词更自然。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
- source_word: ἕτεροι δὲ
  choice: 还有人说
  rationale: 标明分列中的又一组人，并自然呈现递进的列举关系。
- source_word: Ἰερεμίαν
  choice: 耶利米
  rationale: 采用现代简体中文中通行的人名译法。
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: 或先知中的一位
  rationale: 保留ἤ所表达的选择关系；原文没有“其他”一词，因此不增译“其他先知”。
theological_decisions:
- issue: 各项身份判断中被省略的对象
  choice: 正文保留省略，只译“有人说是施洗者约翰……”，由上文耶稣的问题确定所指。
  alternative: 明确译作“有人说你是施洗者约翰……”
  rationale: 希腊文本以宾格人名列出各项回答，没有在本节重述“你是”。中文加入系词“是”可使句子成立，同时不补出代词“你”；脚注说明更明确的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。分列结构用“有人说……有人说……还有人说……”清楚呈现；正文尽量保留原文的简略表达，必要的语境补足放入脚注。
