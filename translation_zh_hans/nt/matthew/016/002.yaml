  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: zh_hans
  text: 他回答他们说：“到了傍晚，你们会说：‘天气会晴，因为天空发红。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答……说
  rationale: 保留希腊文常见的叙事引语公式，同时符合现代汉语的庄重表达。
- source_word: Ὀψίας γενομένης
  choice: 到了傍晚
  rationale: 将属格独立结构按时间关系自然译出，表达傍晚来临之时。
- source_word: λέγετε
  choice: 你们会说
  rationale: 此处现在时表示惯常判断；“会说”在汉语中自然体现这种习惯性。
- source_word: Εὐδία
  choice: 天气会晴
  rationale: 该词指良好、晴朗的天气；结合后面的天色征兆，译为预测性的“天气会晴”最自然。
- source_word: πυρράζει
  choice: 发红
  rationale: 准确表达天空呈红色的状态，也符合汉语描述天象的习惯。
- source_word: οὐρανός
  choice: 天空
  rationale: 语境明确涉及天气征兆，指可见的天空，而非神学意义上的“天”。
theological_decisions: []
