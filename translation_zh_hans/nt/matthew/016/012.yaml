base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: zh_hans
  text: 那时，他们才明白，他不是说要提防饼的酵[a]，而是要提防法利赛人和撒都该人的教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“饼（复数）的酵。”希腊语“饼”在这里是复数。
    reason: 说明τῶν ἄρτων为复数，同时保留中文正文以集合性“饼”表达的自然性。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 标明门徒终于领会耶稣话意的时点，现代汉语自然清楚。
- source_word: συνῆκαν
  choice: 他们才明白
  rationale: 不定过去时在上下文中表示此刻领会；“才”自然体现经过先前误解后终于明白。
- source_word: οὐκ εἶπεν προσέχειν
  choice: 他不是说要提防
  rationale: προσέχω与ἀπό连用在警告语境中表示警戒、防备；“提防”简洁且符合现代汉语。
- source_word: ἀπὸ τῆς ζύμης τῶν ἄρτων
  choice: 饼的酵
  rationale: 保留ζύμη的字面意象“酵”，并将复数ἄρτων译作汉语自然的集合性表达“饼”；不把比喻提前解释为别的道德性质。
- source_word: ἀλλὰ ἀπὸ τῆς διδαχῆς
  choice: 而是要提防……的教导
  rationale: ἀλλά构成“不是……而是……”的鲜明对比；补出前文支配的不定式意义，使汉语结构完整。διδαχή译为通俗而准确的“教导”。
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: 法利赛人和撒都该人
  rationale: 采用现代中文圣经语境中通行的群体名称音译。
theological_decisions:
- issue: “酵”的比喻所指
  choice: 正文只按经文本身将“酵”与法利赛人和撒都该人的“教导”相对照
  alternative: 在正文中扩译为“虚伪”“败坏的教导”等
  rationale: 本节将比喻解释为“教导”，却没有在此进一步界定其具体道德性质；不从平行经文或特定释经传统补入额外结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是……而是……”清楚呈现希腊文οὐκ…ἀλλά的对照；“才明白”符合叙事进程。脚注标记[a]已置于正文相应位置。
