  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: zh_hans
  text: 耶稣却一直沉默不语。大祭司对他说：“我凭永生的上帝，要你起誓[a]告诉我们：你是不是弥赛亚[b]，上帝的儿子？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我凭永生的上帝郑重命令你告诉我们。”希腊文采用庄严的誓言约束公式。
    reason: lexical_alternative
  - marker: b
    text: 或译：“基督。”希腊文称号Christos在这里用作称号，因此正文译为“弥赛亚”，而不把它当作姓名。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: 一直沉默不语
  rationale: 未完成时表示持续的沉默；“一直沉默不语”以自然的现代汉语体现其延续性。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是犹太祭司体系中该最高职分的标准、准确译法，也符合审讯语境。
- source_word: Ἐξορκίζω
  choice: 命令你起誓回答
  rationale: 此处不是“驱魔”，而是带有司法和宗教约束力的庄严起誓命令；该译法在现代汉语中清楚传达其效力。
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: 凭永生的上帝
  rationale: κατά加属格与ἐξορκίζω连用，表示以永生的上帝为庄严凭据；“凭”符合汉语宣誓表达。
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: 回答
  rationale: 此结构说明大祭司要求耶稣说出的内容；结合直接问话译为“回答”简洁自然，“我们”已由问话语境充分体现。
- source_word: ὁ χριστὸς
  choice: 弥赛亚
  rationale: 定冠词表明此处是称号，指所期待的受膏者，而不是姓名；“弥赛亚”能保留其犹太弥赛亚语境。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留这一确定的基督论称号，不加解释，也不削弱其含义。
- source_word: ὁ δὲ Ἰησοῦς
  choice: 耶稣却
  rationale: δέ在此承接前文并形成轻微对比；“却”自然表现耶稣面对指控仍不回答的反差。
theological_decisions:
- issue: 在直接的基督论质问中如何翻译Χριστός
  choice: 弥赛亚
  alternative: 基督
  rationale: ὁ χριστός在这里明显是“受膏者”这一称号，并非近似姓名的用法；正文用“弥赛亚”保留当时犹太语境，同时在脚注列出传统译法“基督”。
- issue: 大祭司所用公式Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος的效力
  choice: 庄严的起誓命令
  alternative: 一般性的郑重命令
  rationale: 原文正式援引永生的上帝，在审讯场景中带有宣誓约束力；译文明确表达这层效力，同时不引入原文没有的后世法律细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与审讯用语。“一直沉默不语”体现未完成时的持续性；问句保持直接、紧迫的法庭语气。脚注标记按其所解释的词语在正文中的出现顺序排列。
