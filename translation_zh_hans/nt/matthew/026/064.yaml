  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你说的是。[a]然而我告诉你们：从今以后，你们将看见人子坐在那权能者的右边[b]，驾着天上的云而来。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这是你说的”。原文是一种含蓄的肯定回答。
    reason: lexical_alternative
  - marker: b
    text: “权能者”是对上帝的敬称。原文称为“那权能”。
    reason: cultural_note
  - marker: c
    text: 这里呼应《但以理书》7:13和《诗篇》110:1。
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: 你说的是
  rationale: 保留原文“你说了”的措辞，同时用现代汉语自然表达一种含蓄而真实的肯定；不把它强化成毫无保留的“是”，也不误解为回避回答。
- source_word: πλὴν
  choice: 然而
  rationale: 标明耶稣从直接回应转入庄严宣告的强转折；语体庄重而不古奥。
- source_word: ἀπ’ ἄρτι
  choice: 从今以后
  rationale: 表达从此刻起开始的新局面，又不限定为仅在当下立刻发生。
- source_word: ὄψεσθε
  choice: 你们将看见
  rationale: 直接表达ὁράω将来时的视觉或见证含义，并保留复数所指向的在场众人。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留这一固定自称及其《但以理书》背景，不以解释性的称谓取代。
- source_word: καθήμενον
  choice: 坐在
  rationale: 忠实呈现分词，并在“权能者的右边”这一语境中自然传达登基、尊荣与权柄。
- source_word: ἐκ δεξιῶν
  choice: 在……的右边
  rationale: 保留圣经中象征尊荣、亲近和权柄的位置表达，同时符合现代汉语习惯。
- source_word: τῆς δυνάμεως
  choice: 权能者
  rationale: 原文以“权能”敬称上帝。汉语若直译为“权能的右边”极不自然，因此以“权能者”保留敬称的间接性，并用脚注说明。
- source_word: ἐρχόμενον
  choice: 而来
  rationale: 保留运动方向及《但以理书》异象的呼应，不将其弱化为普通的“到达”。
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 驾着天上的云
  rationale: 以自然庄重的汉语表达在天云之上或伴随天云而来的图景，同时保留原文介词短语可能具有的意象张力。
theological_decisions:
- issue: 耶稣回答“Σὺ εἶπας”的语力
  choice: 译作“你说的是”，视为带有原文措辞特点的肯定回答。
  alternative: 直译为“你说了”，或明确译作“是的”。
  rationale: 单译“是的”会抹去耶稣实际采用的表达，纯粹译成“你说了”又容易让现代读者误以为他没有回答；现译兼顾肯定语力和原文形式。
- issue: “权能”（τῆς δυνάμεως）的所指
  choice: 译作“权能者”，作为对上帝的敬称，并加脚注说明。
  alternative: 直接译作“上帝”，或生硬直译为“权能”。
  rationale: 直接写“上帝”虽说明了所指，却比原文更明说；“权能者”在自然汉语中保留原文敬避直称的语气。
- issue: “你们将看见”与坐在右边、驾云而来的时间关系
  choice: 把登基尊荣与驾云而来并列保留，不在译文中规定单一的应验时序。
  alternative: 全部限定为近期应验，或全部限定为遥远未来的再来。
  rationale: 原文让两个分词共同受“你们将看见”支配，并同时呼应《诗篇》110篇和《但以理书》7章；译文应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“你说的是”避免过度直白或显得闪避；“权能者”兼顾汉语自然度与原文敬称的含蓄性；末句保持异象语言，不替读者解决其应验时序。
