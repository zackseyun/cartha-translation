source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: zh_hans
  text: 然后，他来到门徒那里，对他们说[a]：“现在你们睡吧，歇息吧。看，时候临近了[b]，人子正被交在罪人手里[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们还在睡觉、歇息吗？”希腊文也可理解为反问；正文保留这句话可能含有的反讽意味。
    reason: alternative_reading
  - marker: b
    text: 或译：“时候到了”或“时候近在眼前了”。
    reason: lexical_alternative
  - marker: c
    text: “被交”也可译为“被交付”或“被出卖”；希腊文的含义比“出卖”更宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 然后
  rationale: 作为叙事中的时间连接词，表示事件接续，现代汉语中自然简洁。
- source_word: ἔρχεται πρὸς τοὺς μαθητὰς καὶ λέγει αὐτοῖς
  choice: 他来到门徒那里，对他们说
  rationale: 用汉语叙事惯用形式表达希腊文历史现在时；不机械保留现在时，以免显得突兀。
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: 现在你们睡吧，歇息吧
  rationale: 保留表面的陈述式命令语气及其可能的反讽或让步意味，不在正文中直接改成问句。
- source_word: ἰδοὺ
  choice: 看
  rationale: 自然、现代而庄重地引起听者注意。
- source_word: ἤγγικεν ἡ ὥρα
  choice: 时候临近了
  rationale: 既表达ἐγγίζω完成时所指的临近已成为现实，也保留“临近”与“已经来到”之间的语义张力。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用汉语圣经传统中清楚且通行的耶稣自称，不作释义性改写。
- source_word: παραδίδοται
  choice: 正被交
  rationale: 保留“交出、交付”的宽泛含义，不将其缩窄为单指“出卖”；“正”体现此事迫近并正在展开。
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: 在罪人手里
  rationale: 采用自然的汉语固定表达，同时保留“落入其掌控”的具体意象。
theological_decisions:
- issue: Καθεύδετε……καὶ ἀναπαύεσθε的语气
  choice: 正文译作“现在你们睡吧，歇息吧”
  alternative: “你们还在睡觉、歇息吗？”
  rationale: 希腊文形式容许命令式、让步式或带反讽的理解，而紧接着的宣告形成明显张力。正文保留表层语气，脚注说明问句理解，避免替原文消除歧义。
- issue: παραδίδοται在受难语境中的含义
  choice: 正被交
  alternative: 正被出卖
  rationale: “交”同时容纳犹大的出卖、被移交给人的行动，以及被动表达可能具有的更广泛含义，不把经文限定为单一施事或教义解释。
- issue: ἤγγικεν ἡ ὥρα的时间意味
  choice: 时候临近了
  alternative: 时候到了
  rationale: 原词直接表达“已经临近”，而语境也可使人理解为“已经来到”。正文贴近词义，脚注保留后一种自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“睡吧，歇息吧”保留原句突然转向“时候临近”的张力；“被交在罪人手里”延续希腊文的具体意象。所有脚注标记均置于正文相应位置。
