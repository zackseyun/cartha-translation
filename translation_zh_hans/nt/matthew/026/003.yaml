  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: zh_hans
  text: 那时，祭司长们和百姓的长老聚集在名叫该亚法的大祭司的庭院里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庭院”也可译作“宅邸的院庭”；原词可指大型住宅的庭院区域。原文“聚集”所对应的动词为被动形式，也可表达为“被召集在一起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间推进标记，引出随后发生的事件；“那时”自然、庄重，也可涵盖“然后”的语篇功能。
- source_word: συνήχθησαν
  choice: 聚集
  rationale: 该词虽为被动形式，但在此可表达众人会合、聚到一处；汉语用“聚集”较自然，不强行加入施事者，同时脚注说明原文形式。
- source_word: ἀρχιερεῖς
  choice: 祭司长们
  rationale: 在福音书语境中指祭司阶层中的领袖，并非多位同时在任的大祭司；加“们”明确复数。
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: 民间的长老
  rationale: 保留属格关系，指百姓中公认的领袖；“民间的长老”符合现代汉语圣经语域。
- source_word: εἰς τὴν αὐλὴν
  choice: 到……院子里
  rationale: εἰς带有趋向含义，“到……里”保留聚集所趋之处；αὐλή在此可指大型住宅的院落，也可能含宅邸院庭之意。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司的
  rationale: 原文为单数，指当时的大祭司这一职分持有人。
- source_word: τοῦ λεγομένου Καϊάφα
  choice: 这位大祭司名叫该亚法
  rationale: 以独立分句自然表达该分词结构的指认功能，并清楚表明“该亚法”修饰大祭司。
theological_decisions: []
