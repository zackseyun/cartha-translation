  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: zh_hans
  text: 但我复活以后[a]，要比你们先到加利利去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我被复活之后。”希腊文此处使用被动形式。
    reason: 说明较贴近希腊文语态的译法，同时保留正文自然的现代汉语表达。
lexical_decisions:
- source_word: μετὰ δὲ
  choice: 但……以后
  rationale: μετά与冠词化不定式构成时间表达，意为“……以后”；δέ在此与上文门徒将跌倒的预告形成轻微转折，因此译作“但”。
- source_word: τὸ ἐγερθῆναί με
  choice: 我被复活
  rationale: ἐγερθῆναι是ἐγείρω的简单过去时被动不定式，με是其逻辑主语。译文保留被动形式，不明确补出施事者，也不把它直接改为主动意义的“我复活”。
- source_word: προάξω
  choice: 要在你们之前往……去
  rationale: προάγω在这里表示走在某人前面、先于某人前往；此译保留先行的方向关系，又避免额外强调正式的带领含义。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数宾格，指耶稣当时所对的众门徒。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 往加利利去
  rationale: εἰς表达朝向或进入某地的移动；现代汉语以“往……去”自然传达这一方向意义。
theological_decisions:
- issue: ἐγερθῆναί的复活表述及被动语态
  choice: 正文译作“我被复活”，保留原文的被动形式。
  alternative: “我复活”
  rationale: 被动不定式可能含蓄指向使耶稣复活的施事者，但原句没有明说。译文因此保留被动和相关神学张力，不在正文中补出施事者；较自然的主动式列入脚注。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“被复活”在汉语中略显非常规，但为有意保留希腊文被动形式；脚注提供更自然的“我复活”。“在你们之前往加利利去”清楚表达先行关系，不加入原文未明说的带领或会合含义。
