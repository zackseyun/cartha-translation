  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: zh_hans
  text: 于是，他对他们说：“我的心极其忧伤，几乎要死[a]。你们留在这里，和我一同警醒[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忧伤至死”。“几乎要死”表达忧伤强烈到死亡的程度。
    reason: lexical_alternative
  - marker: b
    text: 或译“和我一同保持清醒”。原文既可指不睡着，也可指警觉守望。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 作为叙事中的时间连接词，承接前一事件并引出随后发生的事；“于是”符合现代汉语叙事习惯。
- source_word: λέγει
  choice: 说
  rationale: 原文使用历史现在时以增强现场感；现代汉语不必以形态标示时态，“说”可自然地置于过去的叙事流程中。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 准确表达动词 λέγει 所带的间接宾语。
- source_word: Περίλυπός
  choice: 忧伤至极
  rationale: περίλυπος 表示强烈、深重的悲痛或忧愁；“忧伤至极”庄重自然，并充分传达其强度。
- source_word: ἡ ψυχή μου
  choice: 我的心灵
  rationale: 保留原文明确的名词 ψυχή，同时“心灵”在现代汉语中自然表达人的内在生命与感受，不把该词限定为一套技术性的人论术语。
- source_word: ἕως θανάτου
  choice: 甚至到了死亡的地步
  rationale: 保留“达到死亡”这一极限性表达，不明确断定其仅是夸张、濒死状态或预示实际死亡。
- source_word: μείνατε
  choice: 留在
  rationale: 表达门徒要继续待在所指地点的命令，比“停留”更自然，也比口语化的“待着”庄重。
- source_word: ὧδε
  choice: 这里
  rationale: 直接、自然地表达地点副词。
- source_word: γρηγορεῖτε
  choice: 警醒
  rationale: γρηγορέω 在此既可指保持清醒、不睡着，也可含警觉守望之意；“警醒”保留较宽的语义范围，字面的“不睡”之意列入脚注。
- source_word: μετ’ ἐμοῦ
  choice: 同我一起
  rationale: 清楚表达 μετά 加属格所表示的陪伴，与“警醒”搭配自然。
theological_decisions:
- issue: 耶稣陈述中的 ψυχή 如何表达
  choice: 我的心灵
  alternative: 我忧伤至极／我的灵魂忧伤至极
  rationale: “我的心灵”既保留原文的显式名词，又自然表达耶稣真实而深切的内在痛苦；同时避免把 ψυχή 处理成过于技术化的“灵魂”，也不将它简化为单纯的第一人称代词。
- issue: ἕως θανάτου 所表达的极限
  choice: 甚至到了死亡的地步
  alternative: 几乎要死／忧伤至死
  rationale: 原短语可表示忧伤强烈到死亡的程度，也可能带有趋近死亡或持续至死的张力；正文保留其开放性，不擅自确定单一解释。
- issue: 语境中 γρηγορεῖτε 的语力
  choice: 警醒
  alternative: 保持清醒／不要睡着
  rationale: 该命令在客西马尼的具体处境中涉及实际不睡着，也带有警觉守望的意味；正文采用涵盖面较广的“警醒”，脚注保留字面方向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“于是”保持叙事推进；引语避免古雅表达。“心灵”保留 ψυχή 的名词形式而不过度术语化；“警醒”符合经文语境，并以脚注说明其实际保持清醒的含义。
