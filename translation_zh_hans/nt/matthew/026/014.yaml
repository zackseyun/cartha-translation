  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: zh_hans
  text: 那时，十二人中的一个——名叫加略人犹大的——去见众祭司长，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间性叙事标记，引出紧接着发生的事；“那时”自然地承接上文。
- source_word: πορευθεὶς
  choice: 去见
  rationale: 该不定过去时分词在句中表示朝向祭司长的行动。汉语用“去见”既表达移动方向，也自然连接对象，避免生硬直译为“去了以后”。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人中的一个
  rationale: 保留希腊文的部分关系表达，同时不借助大小写把“十二”额外处理为专名。
- source_word: ὁ λεγόμενος
  choice: 就是那称为
  rationale: 保留原文同位说明的识别功能和略带强调的结构。
- source_word: Ἰούδας Ἰσκαριώτης
  choice: 加略人犹大
  rationale: 采用现代中文圣经语境中通行的人名和称号译法；“加略人”保留该称号可能指地域身份的形式，而不武断解释其词源。
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: 去见祭司长
  rationale: πρός加宾格表示趋向；ἀρχιερεῖς为复数，指祭司群体中的高级领袖。中文“祭司长”作为集合性职称可由语境表达复数，且比“众祭司长”更自然。
theological_decisions:
- issue: τῶν δώδεκα是否作为固定群体称号处理
  choice: 十二人中的一个
  alternative: 十二使徒中的一个
  rationale: 原文只有“十二”，没有“使徒”一词；译文保留其简约性和群体指向，不补入身份称谓。
- issue: Ἰσκαριώτης的含义
  choice: 加略人
  alternative: 伊斯加略
  rationale: 该称号的词源与确切含义存在讨论；采用通行译名而不在正文中断定其来源或神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式尽量贴近希腊文的信息次序，同时按自然汉语将分词结构处理为主要动作。“就是那称为加略人犹大的”保留原文对人物身份的郑重辨明。
