  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: zh_hans
  text: 从那时起，他就一直寻找机会，要把耶稣交出去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出卖他。”希腊文这个动词较直译为“把他交出去”或“把他交给别人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: 从那时起
  rationale: 准确表达由某一时点开始并延续下去的时间关系，符合现代汉语习惯。
- source_word: ἐζήτει
  choice: 就一直寻找
  rationale: 未完成过去时表示持续或反复的行动；“一直寻找”自然体现其延续性，“就”与前面的起始时间衔接。
- source_word: εὐκαιρίαν
  choice: 机会
  rationale: 指适宜、有利的时机；汉语“机会”简洁自然，具体的有利意味可由语境体现。
- source_word: ἵνα
  choice: 要
  rationale: 在这里引出寻找机会的目的；“要”以自然汉语表达目的关系。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 希腊文为代词“他”，其所指在上下文中是耶稣。为避免同一句中两个男性第三人称造成汉语指代含混，正文明确译出“耶稣”。
- source_word: παραδῷ
  choice: 交出去
  rationale: 保留 παραδίδωμι 的基本意义“交出、交给”，不在正文中直接缩窄为带有评价色彩的“出卖”。
theological_decisions:
- issue: 犹大语境中 παραδῷ 的译法
  choice: 交出去
  alternative: 出卖他
  rationale: 在此语境中，犹大的行为确属背叛，但希腊动词本身意义较宽，基本义是“交出”。正文保留这一词义宽度，脚注说明符合语境的另一译法，以保存原文的措辞和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从那时起……就一直……”清楚呈现行动的起点及持续性；将 αὐτὸν 明译为“耶稣”，避免“他……把他……”在中文中指代不清。
