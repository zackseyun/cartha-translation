  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: zh_hans
  text: 他们唱了赞美诗[a]，就出去，往橄榄山去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“唱诗赞美”。希腊语动词可泛指以歌唱来赞美；按当时筵席的语境，译作“唱了赞美诗”也很贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: 唱了赞美诗
  rationale: 这是ὑμνέω的不定过去时主动分词，表示在主要动作之前唱诗赞美。译作“唱了赞美诗”自然庄重，也符合逾越节筵席的语境；脚注保留较宽泛的“唱诗赞美”之意。
- source_word: ἐξῆλθον
  choice: 出去
  rationale: ἐξέρχομαι在此直接表示“出去、离开”；“出去”简洁地保留原文的移动含义。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 往橄榄山去了
  rationale: εἰς表示朝向或目的地；“橄榄山”是该地名在现代汉语中的通行译法。
- source_word: καὶ
  choice: 就
  rationale: καί连接前后动作；结合前置分词结构，译作“就”自然表达唱诗之后随即出去，但不增加强于语境的因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“他们唱了……就……”符合普通现代汉语习惯；保留“橄榄山”这一通行地名。
