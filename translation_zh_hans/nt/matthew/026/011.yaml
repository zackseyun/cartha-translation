  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: zh_hans
  text: 因为你们身边总有穷人[a]，却不总有我在你们身边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫穷的人”。
    reason: 词汇替代译法；说明“穷人”指贫穷者这一群体。
lexical_decisions:
- source_word: πάντοτε
  choice: 总
  rationale: 表示持续、经常可接触的状态；两处均用“总”，保留原文的重复和鲜明对照。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语用“因为”能清楚表达其解释关系。
- source_word: τοὺς πτωχοὺς
  choice: 穷人
  rationale: 指贫穷者这一群体；“穷人”简明自然，不增添原文没有的限定。
- source_word: ἔχετε
  choice: 有
  rationale: 这里表示有人在身边、可以接触，并非所有权意义上的“拥有”；在“身边总有”这一结构中表达自然。
- source_word: μεθ’ ἑαυτῶν
  choice: 身边
  rationale: 表达这些人与门徒相伴、在他们当中的关系，避免生硬直译为“与你们自己一起”。
- source_word: ἐμὲ
  choice: 我
  rationale: 直接指耶稣本人，按现代汉语译为“我”。
- source_word: δὲ
  choice: 但
  rationale: 标明穷人持续在他们身边与耶稣不会一直在他们身边之间的对照。
- source_word: οὐ πάντοτε
  choice: 不会总
  rationale: 与前句的“总有”呼应，保留时间上的否定和对照；“不会”也自然传达即将发生的处境变化。
theological_decisions:
- issue: 耶稣临在的含义
  choice: 将本句译成穷人持续在门徒身边，而耶稣不会一直在他们身边的时间性对照。
  alternative: 把本句理解为贬低或淡化照顾穷人的责任。
  rationale: 希腊文直接形成的是时间上的对比，并未作出轻视穷人的道德判断。译文保留耶稣即将离去所造成的独特时机，同时不加入有关施舍或怜悯的额外结论。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“身边总有”比“常有……与你们同在”更自然，也避免“同在”可能带来的额外神学色彩；后句省略重复的“身边”，符合汉语习惯，同时上下文关系明确。
