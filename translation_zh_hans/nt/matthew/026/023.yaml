  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: zh_hans
  text: 他回答说：“和我一同把手蘸在碗[a]里的那个人，这人要出卖[b]我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盘子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把我交出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 这是受闪语表达影响的常见“分词＋限定动词”结构；译作“回答说”既保留回应和发言两层意思，也符合现代汉语习惯。
- source_word: ἐμβάψας
  choice: 蘸
  rationale: 该词指浸入或蘸入；结合不定过去时分词，以“蘸在……里”自然表达用于辨认那人的动作，而不额外补出经文未明说的食物。
- source_word: μετ’ ἐμοῦ
  choice: 同我一起
  rationale: 准确表达 μετά 加属格所表示的伴随关系。
- source_word: τὴν χεῖρα
  choice: 把手
  rationale: 希腊语用定冠词指身体部位，现代汉语无需直译为“那只手”；“把手”自然且明确保留原文所说的是手。
- source_word: ἐν τῷ τρυβλίῳ
  choice: 在碗里
  rationale: τρύβλιον 指盛食物的碗或盘；“碗”是清楚、日常的现代汉语，另一可能译法收入脚注。
- source_word: οὗτός
  choice: 那个人，就是
  rationale: 以“那个人，就是……”再现指示代词的强调作用，比单用“他”更能保留原文的指认语气。
- source_word: παραδώσει
  choice: 要出卖
  rationale: παραδίδωμι 基本义为交出、交付；在犹大将耶稣交给敌对者的叙事语境中，“出卖”准确传达其背叛性质，同时在脚注保留较字面的译法。
theological_decisions:
- issue: 受难叙事中 παραδίδωμι 的译法
  choice: 要出卖我的人
  alternative: 要把我交出去的人
  rationale: 上下文表明这里所指的交付带有背叛性质，因此正文采用自然且合乎语境的“出卖”；但原词本身也可较宽泛地表示“交出”，故以脚注保留该语义，避免掩盖词义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“同我一起”保留共同动作的意味；不将“手”改成“饼”，以免补入本节原文没有明说的对象。脚注标记紧随各自对应词语。
