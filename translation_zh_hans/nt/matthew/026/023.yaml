  source_fidelity: 核心意思译出准确：耶稣回答，指出那位与他同在同一器皿中蘸手的人将要背叛／交出他。原文的强调性指示代词οὗτός宜在汉语中明确保留为“这人”，而非改作较迂回的“就是……的人”。
  naturalness: 原译“同我一起把手蘸在碗里的那个人，就是要出卖我的人”可以理解，但定语较长，且“碗里”紧接“那个人”时句法关系稍显拥挤。改为“和我一同把手蘸在碗里的那个人，这人要出卖我”更贴近原文的指认和断言结构，也更自然。
  terminology: “碗”可对应τρυβλίον，脚注保留“盘子”合宜。“出卖”在此叙事语境中恰当表达παραδίδωμι的背叛意味；脚注保留较字面的“把我交出去”，不应删去。
