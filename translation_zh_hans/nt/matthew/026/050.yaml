  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: zh_hans
  text: 耶稣却对他说：“朋友，你既是为这事来的，就去做吧。[a]”于是，他们上前，伸手抓住耶稣，制住了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朋友，你为何而来？”希腊原文十分简略，也可理解为问句。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: 朋友
  rationale: 这是耶稣对犹大的呼语；“朋友”在现代汉语中自然，也能保留原词克制、并不特别亲昵的语气。
- source_word: ἐφ’ ὃ πάρει
  choice: 你来是为了什么，就做吧
  rationale: 原文极为简略，可能是省略式陈述，带有准许或揭明其来意的意味，也可能理解为问句。正文采用前一种理解，但用脚注保留问句读法。
- source_word: προσελθόντες
  choice: 上前来
  rationale: 表达拘捕者朝耶稣走近，符合分词所呈现的动作顺序，也合乎现代汉语叙事习惯。
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: 下手拿住耶稣
  rationale: 这是表示以敌对方式动手控制某人的习语；此译法自然地传达实际抓拿的动作。
- source_word: ἐκράτησαν αὐτόν
  choice: 把他制伏了
  rationale: κρατέω在此表示强行控制、扣住。前句已译“拿住”，故用“制伏”呈现动作结果，并避免重复或过早加入正式法律意义上的“逮捕”。
- source_word: δὲ
  choice: 却
  rationale: δέ在这里表示轻微转折；“却”自然衔接犹大的行动与耶稣的回应。
theological_decisions:
- issue: 耶稣对犹大的称呼及其简略回应应如何理解
  choice: 正文译作“朋友，你来是为了什么，就做吧”，保留称呼中克制的张力，并将后半句理解为省略式准许或揭明。
  alternative: “朋友，你来是为了什么？”或“朋友，你为什么来？”
  rationale: 希腊语短语在句法上高度压缩，陈述式与疑问式理解都有依据。正文不把“朋友”强化为亲密称呼，也不把它改成明确谴责；脚注保留真实存在的疑问式理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“下手拿住”保留敌对抓捕的惯用色彩；“制伏”突出强行控制，同时避免在原文并未明确使用法律术语之处直接译作“逮捕”。
