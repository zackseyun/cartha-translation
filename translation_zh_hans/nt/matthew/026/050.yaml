revisions:
- from: 耶稣却对他说：“朋友，你来是为了什么，就做吧。[a]”于是那些人上前来，下手拿住耶稣，把他制伏了。
  to: 耶稣却对他说：“朋友，你既是为这事来的，就去做吧。[a]”于是，他们上前，伸手抓住耶稣，制住了他。
  rationale: 修订使正文一致采用“为此而来、就去做”的省略式理解，同时以脚注保留有根据的疑问式读法。后半句按原文的两个动作分别表达为“伸手抓住”与“制住”，既保留叙事次序，也避免加入过强的“制伏”含义。
