    issue: 正文中“你来是为了什么，就做吧”句式混合了疑问性措辞与命令式补足。
    rationale: 原文短语可理解为“为你所来之事〔去做〕”，也可理解为“你为何而来？”；正文既采用前者，就应避免保留“为了什么”这一更像疑问的汉语结构。
  - severity: low
    issue: “把他制伏了”略强化了第二个动词。
    rationale: ἐκράτησαν表示抓住、控制或拘捕；“制伏”可带有将对方打败或压服的意味。改为“制住了他”更贴近实际抓捕动作。
