review_pass:
  verdict: revise
  source_fidelity: 正文前半句“你来是为了什么，就做吧”把可作疑问理解的“为了什么”与补出的命令“就做吧”直接拼合，汉语逻辑不够清楚，也未能恰当地呈现正文所选的省略式理解。后半句“下手拿住……把他制伏了”大意正确，但“制伏”较容易暗示制服、战胜的结果，超过κρατέω在此处着重的抓捕、扣住动作。
  naturalness: “朋友，你既是为这事来的，就去做吧”是现代汉语中自然、庄重的表达，并以“为这事而来”表达正文所采取的理解。将后半句改为“伸手抓住耶稣，制住了他”，可清楚保留两个连续动作，且避免“下手拿住”的略显陈旧搭配。
  terminology: “朋友”恰当保留Ἑταῖρε克制而非亲昵的称呼。“制住”对应ἐκράτησαν的强行控制，不预设正式法律程序；脚注以“你为何而来？”保留该简略短语可作疑问的读法。
  issues:
