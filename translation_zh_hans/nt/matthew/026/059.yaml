  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: zh_hans
  text: 祭司长和全体公议会[b]正在寻找控告耶稣的假证词[a]，好把他处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“假见证”。希腊语这个词在司法语境中可指虚假的证言，也可指作假见证者。
    reason: lexical_alternative
  - marker: b
    text: “公议会”指当时犹太人的最高议事和审判机构。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 这里是轻微的叙事衔接；汉语上下文已能自然承接，若硬译为“现在”或“但是”，会增加原文没有的时间意味或强烈转折。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是现代中文圣经语境中对犹太高级祭司领袖群体的通行、准确称呼，并非指同时在任的多位大祭司。
- source_word: συνέδριον ὅλον
  choice: 全公议会
  rationale: “公议会”简洁指称当时犹太人的最高议事与审判机构；“全”对应 ὅλον，强调该机构整体。脚注补充其文化背景。
- source_word: ἐζήτουν
  choice: 都在设法寻找
  rationale: 以“在”体现未完成过去时所表达的持续行动；“设法”传达他们带着明确目的搜求证词，而不把动作压缩成一次性的“寻找了”。
- source_word: ψευδομαρτυρίαν
  choice: 假证词
  rationale: 在司法语境中，首要意义是虚假的证言内容；同时保留脚注说明也可理解为“假见证”。
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: 不利于耶稣的
  rationale: κατά 加属格在这里表示司法上的针对与指控；此译法与“证词”自然搭配，并清楚表达证词针对耶稣。
- source_word: ὅπως
  choice: 好
  rationale: 自然、简洁地表达目的关系，相当于“为的是”。
- source_word: θανατώσωσιν
  choice: 把他处死
  rationale: 保留司法语境和正式语气；不具体断定是亲手杀害还是促成执行死刑。
theological_decisions:
- issue: 宗教领袖行动的司法性质与目的
  choice: 译为持续寻找假证词，目的是把耶稣处死
  alternative: 可较简略地译作“寻找假见证，要杀死耶稣”
  rationale: 未完成过去时 ἐζήτουν 与目的从句 ὅπως…θανατώσωσιν 共同描写一项持续、有意的司法谋划。译文呈现这种叙事与道德张力，但不加入原文以外的教义评断。
- issue: ψευδομαρτυρίαν 指证言还是作证者
  choice: 正文采用“假证词”
  alternative: “假见证”
  rationale: 该词可涉及虚假证言或法律意义上的假见证。正文选用现代汉语中更明确指向证言内容的“假证词”，脚注保留词义范围，避免消除原文可能的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“都在设法寻找”保留持续谋划的意味；“处死”符合审判场景的正式语体。脚注标记均置于正文相应词语之后。
