  text: καὶ οὐχ εὗρον ⸂πολλῶν προσελθόντων ψευδομαρτύρων. ὕστερον δὲ προσελθόντες δύο⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: zh_hans
  text: 尽管有许多假见证人上前来，他们还是没有找到所要的[a]。后来又有两个人上前来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们还是一无所获”。希腊文没有明说“找到”的宾语；按上下文，所指的是他们想要用来控告耶稣的证词或罪名。
    reason: 词义选择
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: 他们还是没有找到所要的
  rationale: 希腊文没有明说“找到”的宾语；结合上一节，所寻找的是能用来控告耶稣的证词或罪名。“所要的”在现代汉语中自然，同时避免把隐含对象限定为某一种。
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: 尽管有许多假见证人上前来
  rationale: 属格独立结构在语境中表达让步关系。ψευδομάρτυρες处于司法审讯场景，译作“假见证人”比泛指“说谎的人”准确；προσέρχομαι译作“上前来”，符合出庭作证的情境。
- source_word: ὕστερον δὲ
  choice: 后来又
  rationale: ὕστερον表示程序中的较后时点，δέ带出轻微转折或叙事推进；“后来又”简洁自然，并承接先前已有多人上前的叙述。
- source_word: προσελθόντες δύο
  choice: 有两个人上前来
  rationale: 保留人数信息，并用符合司法场景的“上前来”表达；汉语按自然语序处理。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所要的”保留原文宾语未明说的特点；让步结构前置，使长句在汉语中清楚自然。句末逗号表示本节语意延续至下一节。
