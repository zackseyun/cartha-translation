  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: zh_hans
  text: 他们正在吃的时候[a]，耶稣拿起饼，祝福之后[b]，就掰开，递给门徒，说：“你们拿着吃吧[c]；这是我的身体[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们吃的时候”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“祝福了饼之后”；也有人把这里的动作理解为为饼献上感谢。原文没有明说“祝福”的受词。
    reason: lexical_alternative
  - marker: c
    text: 原文是两个接连出现的命令：“拿，吃。”也可顺译作“拿着吃吧”。
    reason: lexical_alternative
  - marker: d
    text: 希腊文直译为“这是我的身体”。有人将这句话解释为“这代表（或象征）我的身体”，但正文保留原文的说法。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: 他们吃的时候
  rationale: 属格独立结构交代同时发生的背景动作；这样译自然地保留“当……时”的时间关系。δέ在这里是轻微的叙事衔接词，不必另译为强转折。
- source_word: λαβὼν
  choice: 拿起
  rationale: 不定过去时分词表示先于后续动作发生；汉语用连动式“拿起”既自然，也保留动作次序。
- source_word: ἄρτον
  choice: 饼
  rationale: ἄρτος可泛指面包，也可指一块饼。宴席语境中译作“饼”简洁自然，并符合本段动作所呈现的具体食物。
- source_word: εὐλογήσας
  choice: 祝福后
  rationale: 保留εὐλογέω“祝福、称颂”的基本语义及其分词所表达的先后关系；原文没有明说受词，因此正文也不强行判定是“祝福饼”还是“称颂上帝”。
- source_word: ἔκλασεν
  choice: 就掰开
  rationale: κλάω指把饼掰开；汉语“掰开”比泛泛的“弄破”更符合用餐动作。“就”使连续叙事顺畅，不增加实质内容。
- source_word: δοὺς τοῖς μαθηταῖς
  choice: 递给门徒
  rationale: 将分词按汉语连动叙事译出。“递给”自然表达把掰开的饼交给门徒；原文只说“门徒”，不增添“他的”。
- source_word: Λάβετε φάγετε
  choice: 拿着，吃吧
  rationale: 原文是两个连续的不定过去时命令式，中间没有连词。用两个并列祈使语保留这种简短有力的表达，同时“吧”使现代汉语口吻自然。
- source_word: τοῦτό ἐστιν
  choice: 这是
  rationale: 直接保留简单系词ἐστιν的“是”，不在正文中改译为“代表”或“象征”，以免预先解决原文本身留下的神学张力。
- source_word: τὸ σῶμά μου
  choice: 我的身体
  rationale: σῶμα通常意为“身体”，物主关系直接译为“我的”。
theological_decisions:
- issue: 耶稣设立圣餐时的话应如何理解
  choice: 将τοῦτό ἐστιν τὸ σῶμά μου直译为“这是我的身体”。
  alternative: “这代表我的身体”或“这象征我的身体”。
  rationale: 希腊文使用普通系词ἐστιν（“是”）。正文保留原句措辞，不把某一种圣餐神学解释写进译文。
- issue: εὐλογήσας所指的祝福行为
  choice: 正文译作不带明示受词的“祝福后”。
  alternative: “为饼祝福后”或“献上感谢后”。
  rationale: 原文分词本身没有明说受词；这样处理可避免在“祝福饼”“称颂上帝”及“献上感谢”等相关理解之间作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拿起—掰开—递给”形成自然的汉语动作链；直接引语简洁有力。正文避免教派化术语和解释性扩写，并借脚注说明真实的词义与句法选择。
