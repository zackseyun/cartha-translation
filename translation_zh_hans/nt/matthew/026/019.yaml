  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: zh_hans
  text: 门徒照着耶稣所吩咐的去做，预备了逾越节[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逾越节筵席”。“逾越节”一词也可泛指逾越节的庆祝活动，包括为此预备的筵席。
    reason: 词义范围及语境中的另一译法
lexical_decisions:
- source_word: ἐποίησαν
  choice: 去做
  rationale: 与ὡς συνέταξεν连用，表示门徒按所受指示行事；“去做”自然地承接前文的差遣和吩咐。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书中μαθηταί的标准译法，准确表达跟随耶稣并向他学习的人。
- source_word: ὡς
  choice: 照着
  rationale: 表达行动与耶稣吩咐相符合，比机械直译为“如同”更符合现代汉语。
- source_word: συνέταξεν
  choice: 所吩咐的
  rationale: συντάσσω在此指带有权威的指示；“吩咐”既保留权威意味，也适合叙事语境。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 准确表达使某事准备妥当；“预备”庄重、自然，也与教会及普通读者熟悉的表达相符。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα可指逾越节庆典，也可依语境指逾越节筵席或相关祭牲；正文采用较宽泛的“逾越节”，不把所指范围限定得超过原文。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代简体中文通行的专名译法。
theological_decisions:
- issue: τὸ πάσχα的所指范围
  choice: 逾越节
  alternative: 逾越节筵席；逾越节羊羔
  rationale: 上下文涉及为共同用餐作准备，因此筵席含义很突出；但希腊词本身仍可涵盖节期、筵席及相关祭牲。正文保留较宽泛的表达，并用脚注说明语境中的可能含义，以免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照着……所吩咐的去做”符合当代普通话习惯，并保留耶稣指示中的权威性；“预备”与逾越节语境搭配自然。
