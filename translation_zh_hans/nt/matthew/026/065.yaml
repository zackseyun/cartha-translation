id: MAT.26.65
reference: Matthew 26:65
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: zh_hans
  text: 于是，大祭司撕裂自己的衣服[a]，说：“他说了亵渎的话！我们还需要什么见证人呢？你们看，现在已经亲耳听见这亵渎的话了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撕裂衣服在当时是公开表示震惊、悲痛或愤慨的举动。
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 作为叙事中的时间承接词，表示紧接着发生的事；“于是”符合现代汉语叙事习惯。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 准确指当时担任这一职位的人，也是中文圣经及历史语境中通行的称谓。
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: 撕裂自己的衣服
  rationale: 保留撕裂衣物这一公开动作，不把广义的ἱμάτια过度限定为祭司礼服。
- source_word: Ἐβλασφήμησεν
  choice: 他说了亵渎的话
  rationale: 自然表达这项宗教与法律性质的指控，同时避免生硬的“他亵渎了”；这是大祭司的判断，并非译文替叙述者确认该指控。
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: 我们还需要什么见证人呢？
  rationale: 贴近原文“我们还有什么对见证人的需要”，并以自然的汉语反问保留其宣称无需更多证人的语气。
- source_word: ἴδε νῦν ἠκούσατε
  choice: 你们看，现在已经亲耳听见
  rationale: “你们看”体现ἴδε唤起注意的功能；“现在已经亲耳听见”保留νῦν的即时性，并使听见即成为现场证据的语气清楚。
- source_word: τὴν βλασφημίαν
  choice: 这亵渎的话
  rationale: 以指示词承接刚才的发言；“亵渎的话”保留大祭司所作指控的宗教与法律分量，又比抽象的“这亵渎”更合乎现代汉语。
theological_decisions:
- issue: βλασφημέω／βλασφημία所表达的指控
  choice: 译作“他说了亵渎的话／这亵渎的话”，将其保留为大祭司的直接指控
  alternative: 译作“他说了不敬的话／这番不敬的话”
  rationale: “亵渎”保留该指控在当时宗教与审讯语境中的严重性；直接引语结构表明这是大祭司的判断，不暗示叙述者认可其判断。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“大祭司”“见证人”“亵渎”等词保留历史与审讯语境；句式避免文言化，也不把“衣服”擅自具体化为祭司礼服。
