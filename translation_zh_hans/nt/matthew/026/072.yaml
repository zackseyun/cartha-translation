  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: zh_hans
  text: 他又发誓说：“我不认识那个人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  choice: 又
  rationale: 自然表达叙事的连接和彼得再次否认的重复性，不额外强化时间含义。
- source_word: ἠρνήσατο
  choice: 否认说
  rationale: 动词表示否认，后接ὅτι引出的否认内容；汉语用“否认说”可自然引出直接引语，无须补出含混的宾语“这事”。
- source_word: μετὰ ὅρκου
  choice: 发誓
  rationale: 准确表达伴随誓言而作出否认；较“宣誓之下”自然，也避免暗示正式司法程序。
- source_word: ὅτι
  choice: 冒号及直接引语
  rationale: 此处引出否认的具体内容，现代汉语以冒号和引号呈现直接话语最自然。
- source_word: Οὐκ οἶδα
  choice: 我不认识
  rationale: 在谈论是否与某人相识的语境中，οἶδα译为“不认识”比“不知道”更符合现代汉语习惯。
- source_word: τὸν ἄνθρωπον
  choice: 那个人
  rationale: 保留原文明确的“人”这一称呼及彼得刻意疏远的语气，不直接替换为“耶稣”或“他”。定冠词在此语境中自然译作“那个人”。
theological_decisions:
- issue: 彼得所说“那个人”的指称方式
  choice: 保留“那个人”
  alternative: 他；耶稣
  rationale: 原文明确使用τὸν ἄνθρωπον，保留这一表达能呈现彼得否认时的疏离语气；改成“耶稣”或“他”会抹去原文的修辞力度。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“发誓否认说”紧贴希腊文语序，同时清楚表达誓言伴随否认；本节无需脚注，因为汉语“否认说”可自然保留后接内容从句的结构，不必像英语那样补出形式宾语。
