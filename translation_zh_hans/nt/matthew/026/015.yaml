  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: zh_hans
  text: 他说：“你们愿意给我什么，我就把他交给你们[a]？”他们就称出三十块银子给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他出卖给你们”。希腊语这个动词可以指“交出、交给”，在这里也有“出卖”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: 你们愿意给我什么
  rationale: θέλω可表达意愿或想要；在议价语境中，“愿意给我什么”自然保留了意愿意味，也没有把话改写成已经确定的价码。
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: 我就把他交给你们
  rationale: παραδίδωμι的基本语义包括“交出、交给”；此处行为在语境中构成出卖，但主句采用较宽的“交给”，保留原词的语义幅度，并在脚注说明语境义。
- source_word: οἱ δὲ
  choice: 他们就
  rationale: δέ是较弱的叙事连接词；“就”自然表达对犹大提议的随即回应，不刻意强化转折。
- source_word: ἔστησαν αὐτῷ
  choice: 称出……给他
  rationale: ἵστημι在这一交易表达中表示定下或交付金额；“称出”保留古代银钱按重量计量的具体色彩，并与撒迦利亚书11:12的背景相呼应。
- source_word: τριάκοντα ἀργύρια
  choice: 三十块银子
  rationale: ἀργύρια指银制钱币或银钱，但原文没有说明具体币种；“三十块银子”既自然，也避免增添未经明说的面额。
theological_decisions:
- issue: 犹大所说παραδώσω的译法
  choice: 把他交给你们
  alternative: 把他出卖给你们
  rationale: “出卖”准确点明了行为的道德性质和上下文功能，但παραδίδωμι本身的词义更宽。正文采用“交给”，避免把语境判断完全并入动词，同时由脚注保留“出卖”的合理读法。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“你们愿意给我什么”保留议价语气；“三十块银子”沿用清楚自然的传统说法，不擅自指定银币种类。
