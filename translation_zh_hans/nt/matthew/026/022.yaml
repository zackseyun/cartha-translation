  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: zh_hans
  text: 他们非常忧愁，就开始一个接一个地问他：“主啊，难道是我吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的问法预期否定的回答，也可译作“不会是我吧，主？”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: 非常忧愁
  rationale: 分词与强化副词共同描写门徒当时持续而强烈的悲伤；“非常忧愁”自然、庄重，也贴近原文。
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: 就开始……问他
  rationale: 保留“开始”的起始意味；鉴于后面是直接疑问句，汉语用“问他”比字面化的“对他说”更自然。
- source_word: εἷς ἕκαστος
  choice: 一个接一个地
  rationale: 表达逐一、各自回应的分配意义，符合上下文，也比“每一个”更自然。
- source_word: Μήτι ἐγώ εἰμι
  choice: 难道是我吗
  rationale: “难道……吗”传达 μήτι 所引导、预期否定回答的问句语气，同时保留门徒不安的自问。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε 是直接称呼；“主啊”保留其称号及叙事中的神学分量，不降格为单纯礼貌称谓。
theological_decisions:
- issue: 对耶稣的称呼 κύριε
  choice: 主啊
  alternative: 先生／主人
  rationale: 原词在某些语境可作礼貌称呼，但马太受难叙事中“主”更能保存这一称号的叙事和神学张力，又不作额外解释。
- issue: μήτι 问句的预期回答
  choice: 难道是我吗
  alternative: 是我吗
  rationale: 原文预期否定回答；采用“难道”呈现这一语用倾向，但不把实际答案写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一个接一个地问他”使逐一发问的场景清楚；保留“主啊”作为直接称呼。英文资料中脚注[a]的位置或内容似有错配：其“each one / one after another”对应 εἷς ἕκαστος，而所列[b]才对应 μήτι；本稿按希腊原文重新安排，仅为确有必要说明的 μήτι 设置脚注[a]。
