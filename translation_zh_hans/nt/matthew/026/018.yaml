source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: zh_hans
  text: 他说：“你们进城，到某人那里去，对他说：‘老师说：我的时候近了；我要在你那里[a]同我的门徒守逾越节[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你那里”原文直译为“与你”；在此款待的语境中，可指在对方那里或由对方接待，但原文没有明说是“在你家”。
    reason: 说明πρὸς σέ的字面表达及其在语境中的地点、接待含义。
  - marker: b
    text: “守逾越节”也可译作“庆祝逾越节”或“过逾越节”。原文直译为“行（或作）逾越节”。
    reason: 说明ποιῶ τὸ πάσχα的惯用语含义。
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 你们去
  rationale: 以自然的复数命令式表达行动指示，不额外加入“离开”等语气。
- source_word: πρὸς τὸν δεῖνα
  choice: 到某人那里
  rationale: δεῖνα指一位特定却有意不具名的人；“某人”简洁、庄重，也避免“某某”过于口语化。
- source_word: Ὁ διδάσκαλος
  choice: 老师
  rationale: 准确表达διδάσκαλος作为对耶稣的称谓；现代汉语自然，不混同于κύριος所常表达的“主”。
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: 我的时候近了
  rationale: 保留καιρός较宽泛的含义，不擅自限定为死亡、筵席或使命完成的具体时刻。
- source_word: πρὸς σὲ
  choice: 在你那里
  rationale: 紧贴原文“与你/到你那里”的表达，同时在款待语境中自然传达地点，不擅自补出原文没有明说的“家”。
- source_word: ποιῶ τὸ πάσχα
  choice: 守逾越节
  rationale: ποιέω与πάσχα构成惯用语，意为遵守或庆祝逾越节；“守逾越节”是简洁而准确的现代汉语表达。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: 同我的门徒
  rationale: “门徒”保留福音书中μαθηταί既有的关系及神学含义。
theological_decisions:
- issue: 耶稣所说“我的时候”具体指什么
  choice: 译作“我的时候近了”
  alternative: “我指定的时候近了”或“我的时辰近了”
  rationale: 本节只强调其临近，并未明确限定为死亡、逾越节筵席或使命的最终成就；较宽的译法保留叙事与神学张力。
- issue: ποιῶ使用现在时的语气
  choice: 译作“我要……守”
  alternative: “我……守”或“我正在守”
  rationale: 在即将进行的逾越节安排中，现在时可表达确定的近期行动；“我要”符合汉语语境，但不把它解释成单纯意愿。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“某人”表达特定但未具名的人；“在你那里”避免擅自补出“家”。引号层级清楚，适合正文朗读。
