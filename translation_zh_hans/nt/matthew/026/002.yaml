  naturalness: “两天后就是逾越节”自然通顺。“人子将被交出去，钉在十字架上”中后半句缺少被动标记，语法上可能造成不必要的歧义；改为“为要被钉十字架”既自然，也更清楚地连结前后的关系。“被交付”比“被交出去”更庄重、凝练，且在本语境中更合汉语书面圣经语体。
  terminology: “逾越节”“人子”“十字架”均为恰当且通行的术语。“被交付”保留παραδίδοται的宽泛含义；脚注保留“被出卖”为可行的较窄译法，不将正文解释为单指背叛。
