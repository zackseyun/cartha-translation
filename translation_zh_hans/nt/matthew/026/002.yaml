source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: zh_hans
  text: “你们知道，两天后就是逾越节；人子将被交付[a]，为要被钉十字架。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被出卖”。希腊语动词可以表示出卖，但更广泛地指“交出”或“交付”。
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: 你们知道
  rationale: οἶδα为第二人称复数，完成时形式而有现在时意义；“你们知道”准确、自然，并保留复数对象。
- source_word: μετὰ δύο ἡμέρας
  choice: 两天后
  rationale: μετά接宾格表示时间上的“在……之后”；现代汉语用“两天后”最为自然。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα指逾越节；采用现代中文圣经语境中通行且清楚的名称，不额外添加原文没有的“筵席”等词。
- source_word: γίνεται
  choice: 就是
  rationale: γίνομαι在此表示逾越节届临或举行。结合“两天后”，译作“就是逾越节”符合自然汉语，也表达该节期即将来到。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣自称的固定称号及其圣经互文和神学张力，不作解释性改写。
- source_word: παραδίδοται
  choice: 将被交出去
  rationale: 现在时被动态在预告语境中指向迫近的事件。“被交出去”保留παραδίδωμι较宽的语义，不将其限定为“被出卖”。“将”使现代汉语的时间关系清楚。
- source_word: εἰς τὸ σταυρωθῆναι
  choice: 钉在十字架上
  rationale: εἰς加冠词化不定式表达目的或结果；此处承接“被交出去”，用“钉在十字架上”直接表达被动的钉十字架刑罚。
theological_decisions:
- issue: 受难预告中παραδίδοται的译法
  choice: 将被交出去
  alternative: 将被出卖
  rationale: 上下文确实涉及犹大的出卖，但该希腊语动词含义更广，也可指交付或交出。采用“被交出去”可同时容纳人的背叛、权力机构的移交以及经文可能蕴含的神学层面，不把张力过早收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“两天后就是逾越节”比逐字式表达更符合汉语习惯；分号呈现两个彼此关联的预告。脚注标记紧随其所解释的“被交出去”。
