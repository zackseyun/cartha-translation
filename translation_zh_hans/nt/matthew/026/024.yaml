  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: zh_hans
  text: 人子固然要离去，正如经上指着他所写的；但那出卖[a]人子的人有祸了！那人若没有出生，对他倒更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖”也可译为“交出”或“交给人”。这里因上下文涉及犹大的背信行为，故译为“出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: 人子固然
  rationale: “人子”保留这一固定称号；“固然”自然体现 μὲν，并与后面的“但”构成对照。
- source_word: ὑπάγει
  choice: 要离去
  rationale: 保留“去、离去”的基本意义，同时用“要”表达当前语境中即将发生之事，不在正文中直接解释为“受死”。
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: 正如经上指着他所写的
  rationale: γέγραπται 表示已经写下且仍然有效；汉语圣经语体以“经上……所写的”自然表达，“指着他”准确传达 περὶ αὐτοῦ。
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: 但那……的人有祸了
  rationale: “有祸了”保留 οὐαί 的先知性警告和审判力度；“但”呈现 δέ 与前句的鲜明对照。
- source_word: δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται
  choice: 那出卖人子的人
  rationale: 关系结构调整为自然汉语定语；在犹大的背叛语境中，“出卖”清楚表达 παραδίδοται 的背信含义。
- source_word: καλὸν ἦν αὐτῷ
  choice: 对他倒更好
  rationale: 该表达在反事实条件句中表示对那人而言较为有利；“倒更好”是自然汉语，也体现与实际出生事实的反差。
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: 那人若没有出生
  rationale: 准确表达未实现的反事实，并保留 ὁ ἄνθρωπος ἐκεῖνος 对同一人的强调指称。
theological_decisions:
- issue: 经上所写与出卖者责任之间的关系
  choice: 同时保留人子照经上所写而离去，以及出卖者遭受祸患这两项陈述。
  alternative: 偏向决定论而淡化犹大的责任，或只强调人的行为而淡化经文应验。
  rationale: 原文将两者并列对照，译文不替读者消解其中的神学张力。
- issue: “没有出生倒更好”的力度
  choice: 按严厉的审判宣告直译其反事实含义。
  alternative: 将其弱化为纯粹夸张，或扩展为某种详细的终局教义。
  rationale: 译文保留原句的严重性，但不加入本节没有明说的系统神学结论。
- issue: παραδίδοται 的语义范围
  choice: 正文采用“出卖”，突出当前语境中的背叛。
  alternative: 译作“交出”或“交给人”。
  rationale: 犹大的背信行为在上下文中明确，但该词更宽的“交出”含义不应被否认；本节无需以脚注制造与英文审校层标记位置不符的问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“固然……但……”清楚呈现希腊文 μὲν…δέ 的结构；避免把“离去”解释性扩写为“受死”，并保持审判用语的力度。
