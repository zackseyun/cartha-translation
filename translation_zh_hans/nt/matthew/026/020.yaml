lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 到了晚上
  rationale: 这是属格独立结构，用来交代时间背景。“到了晚上”符合现代汉语表达，并保留原文的时间推进。
- source_word: ἀνέκειτο
  choice: 坐席
  rationale: 该词在宴席语境中指斜倚进餐。汉语传统而通行的“坐席”自然表达入席用餐，不致误解为单纯躺卧；原文并未明说“桌旁”，因此不另加“在桌旁”。
- source_word: μετὰ
  choice: 和……一同
  rationale: μετά加属格表示陪同关系；“和……一同”准确而自然。
- source_word: τῶν δώδεκα μαθητῶν
  choice: 十二个门徒
  rationale: SBLGNT正文包含μαθητῶν，应明确译出；“门徒”是福音书语境中μαθητής准确且通行的译法。
- source_word: 隐含主语（ἀνέκειτο，第三人称单数）
  choice: 耶稣
  rationale: 希腊文依上文省略主语；汉语补出“耶稣”可避免指代含混，属于语境所要求的自然补足。
