  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: zh_hans
  text: 彼得却远远地跟着他，一直到大祭司的院子。他进去后，就和差役[a]坐在一起，要看看事情的结局[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆役”“侍从”或“卫兵”。希腊语ὑπηρέται可指下属办事人员或侍从；这里的具体身份不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: 直译“要看结局”或“要看终局”；这里指想看看发生在耶稣身上的事最终会怎样。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: 跟着
  rationale: 未完成时描写彼得当时持续跟随的背景动作；现代汉语“远远地跟着”已自然表达这一持续过程，无须生硬添加体标记。
- source_word: ἀπὸ μακρόθεν
  choice: 远远地
  rationale: 自然、简洁地表达彼得与耶稣保持一段实际距离。
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: 一直到大祭司的院子
  rationale: “一直到”保留ἕως所表达的范围终点；“院子”指大祭司住所内或附属的庭院。
- source_word: εἰσελθὼν ἔσω
  choice: 进去后
  rationale: 明确分词动作先于“坐着”，同时符合现代汉语的叙事顺序。
- source_word: ἐκάθητο
  choice: 坐在一起
  rationale: 未完成时描写持续状态；结合“和……坐在一起”，汉语无需另加“正在”也能自然传达其状态。
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: 和差役
  rationale: ὑπηρέται在此指隶属于当局、执行事务的下属人员；“差役”比“仆人”更能体现其职务性质，又不武断限定为武装卫兵。
- source_word: ἰδεῖν τὸ τέλος
  choice: 要看看事情的结局
  rationale: 不定式表示目的；“结局”既保留τέλος的“终局”意味，也自然表达彼得想知道事情最终会怎样。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“大祭司”沿用通行圣经用语；“差役”体现官署或权贵属员的职能，但脚注保留其身份范围的不确定性。脚注标记按其实际所释词语放置，分别对应ὑπηρέται和τὸ τέλος。
