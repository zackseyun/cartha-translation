  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: zh_hans
  text: 那出卖耶稣的犹大问道：“拉比，难道是我吗？”耶稣对他说：“你自己说了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: 那出卖耶稣的
  rationale: 分词短语指正在把耶稣交给敌对者的犹大；中文用“出卖”自然传达其背叛性质，并明确代词所指。
- source_word: Μήτι ἐγώ εἰμι
  choice: 难道是我吗
  rationale: μήτι引导预期否定回答的问句；“难道是我吗”保留犹大期待得到否定答复的语气。
- source_word: ῥαββί
  choice: 老师
  rationale: 这是对犹太宗教教师的称呼；“老师”在现代汉语中自然易懂，也保留门徒对耶稣的称谓。
- source_word: Σὺ εἶπας
  choice: 你自己说了
  rationale: 尽量保留希腊语简短而含蓄的固定回答，不将其扩写成直接的“是”，从而保存原文的语用张力。
theological_decisions:
- issue: 耶稣回答是否应明确译为肯定句
  choice: 你自己说了
  alternative: 是的，就是你
  rationale: 原文Σὺ εἶπας字面为“你说了”，在语境中带有确认作用，却采用含蓄表达；译文不替原文消除这种含蓄性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；删去汉语中累赘的“回答说”，以“问道”表达ἀποκριθεὶς…εἶπεν的叙事功能。
