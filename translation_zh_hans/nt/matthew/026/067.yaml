  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: zh_hans
  text: 于是，他们朝他脸上吐唾沫，用拳头打他；另一些人则扇他耳光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中紧接着发生的事；“于是”自然简洁，也保留事件推进的关系。
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: 吐唾沫在他脸上
  rationale: ἐμπτύω意为“吐唾沫”，εἰς τὸ πρόσωπον表示直接朝着或吐在脸上；此译法在现代汉语中清楚表达侮辱行为，也避免“向他脸上吐唾沫”可能只表示方向而未落在脸上的歧义。
- source_word: ἐκολάφισαν αὐτόν
  choice: 用拳头打他
  rationale: κολαφίζω通常指用拳头击打；明确译出方式，比笼统的“打他”更贴近原文。
- source_word: οἱ δὲ ἐράπισαν
  choice: 另一些人则扇他耳光
  rationale: 冠词οἱ作名词性用法，指“另一些人”；ῥαπίζω常指用手掌击打，即扇耳光。原文宾语承前省略，汉语中补出“他”更自然。
- source_word: δέ
  choice: 则
  rationale: δέ在此轻微转换到另一组人的动作，并非强烈转折；“则”既表现区分，又保持叙事流畅。
theological_decisions:
- issue: 公议会前对耶稣的羞辱和殴打
  choice: 具体译出吐唾沫、拳打和扇耳光，不作弱化。
  alternative: 概括译为“虐待他”或“殴打他”。
  rationale: 原文逐项陈述侮辱和暴力行为；具体翻译保留叙事力度，同时不加入原文以外的神学解释。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“吐唾沫在他脸上”保留直接侮辱的力度；“用拳头打”和“扇耳光”具体区分两种击打方式。分号帮助读者辨明前后两组动作。
