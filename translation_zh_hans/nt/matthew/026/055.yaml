  rationale: 修订仅处理现代汉语表达和脚注措辞：“难道是把我当作强盗吗”自然表达原文的比较性反问；“圣殿里”和“抓住我”更顺畅而不改变意义；脚注则更准确限定λῃστής的语义范围。
