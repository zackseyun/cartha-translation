  terminology: “刀剑和棍棒”“强盗”“圣殿”均适切。“圣殿里”在本节语境下可自然指ἱερόν所说的圣殿整体范围，不会要求读者理解为内殿。脚注应避免暗示λῃστής可普通地指非暴力“小偷”；其重点是强盗、匪徒一类，且某些语境可带反叛者含义。
