  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: zh_hans
  text: 就在那时，耶稣对众人说：“你们带着刀剑和棍棒出来抓我，难道是把我当作强盗[a]吗？我天天坐在圣殿里教导人，你们却没有抓住我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强盗”也可译作“匪徒”；在某些语境中还可指“叛乱者”。希腊词 λῃστής 不只是指小偷，也可指使用暴力的强盗、匪徒或反叛者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 既自然表达时间衔接，也以“就”保留原文所强调的即时性。
- source_word: τοῖς ὄχλοις
  choice: 对众人
  rationale: 希腊文为复数；汉语“众人”自然涵盖在场的多群人，不必生硬译成“各群人”。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: 好像我是强盗
  rationale: 自然传达原文“如同对付一个强盗”的比较意味，同时用脚注保留该词可能包含的暴力匪徒或叛乱者色彩。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 带着刀剑和棍棒
  rationale: 按武器功能表达两类器具；“刀剑”可涵盖 μάχαιρα 所指的短剑或大刀，“棍棒”则明确 ξύλα 在此不是一般木材。
- source_word: συλλαβεῖν με
  choice: 抓我
  rationale: 在武装拘捕的语境中简洁自然，并与后面的 κρατέω“拿住”保持词语区别。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 准确表达分配性的“每天、日复一日”，符合现代汉语口吻。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区里
  rationale: ἱερόν 指整个圣殿范围，而非内殿；“圣殿区”可避免误解为耶稣在内殿中教导。
- source_word: ἐκαθεζόμην διδάσκων
  choice: 坐在……教导人
  rationale: 保留未完成时所描写的持续、惯常活动，也保留“坐着教导”的具体姿态。
- source_word: οὐκ ἐκρατήσατέ με
  choice: 你们却没有拿住我
  rationale: κρατέω 在此意为抓住、拿住；“却”凸显他们过去公开场合不动手与如今武装前来的反差。
theological_decisions:
- issue: λῃστής 所指罪犯的性质
  choice: 强盗
  alternative: 匪徒；叛乱者
  rationale: 该词可指使用暴力的强盗或匪徒，在某些语境中也可带叛乱者意味。本节重点是他们把耶稣当作危险罪犯对待，正文不宜擅自限定为政治叛乱者，因此采用较宽泛的“强盗”，并在脚注中保存其他可能含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。耶稣的问话保留直接、带责问意味的语气；“圣殿区”用于准确区分整个圣殿范围与内殿。
