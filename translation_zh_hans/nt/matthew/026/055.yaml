  source_fidelity: 译文整体忠实呈现了时间引介、面对群众的发言、携带武器前来拘捕、日日在圣殿范围内教导，以及当时未被抓捕的对比。λῃστής译为“强盗”可取，脚注也恰当保留其可指暴力匪徒或反叛者的较宽语义。建议将问句改为“难道是把我当作强盗吗”，以更准确、自然地表达ὡς ἐπὶ λῃστήν的“如同对付强盗一般”。
