base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: zh_hans
  text: 他们正在吃饭时，耶稣说：“我实在告诉你们，你们中间有一个人要出卖我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“交出我”或“把我交出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: 他们吃饭的时候
  rationale: 属格独立结构表示与主句同时发生的动作；这一译法自然地保留“正在吃饭时”的时间关系。
- source_word: Ἀμὴν
  choice: 实在
  rationale: 这里用于郑重引出耶稣权威而确定的宣告；“实在”既符合现代中文圣经语体，也比音译“阿们”更直接传达其语用功能。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留第一人称陈述和对门徒的直接称呼，同时符合现代汉语表达。
- source_word: εἷς ἐξ ὑμῶν
  choice: 你们中间有一个人
  rationale: 准确表达部分关系，即在听话者当中有一人，又保持自然清楚的汉语语序。
- source_word: παραδώσει
  choice: 要出卖
  rationale: 该动词本义较宽，可指“交出、交付”；在本段叙事中指门徒以背信的方式把耶稣交给对方，因此正文用“出卖”传达语境含义，并以脚注保留较字面的可能译法。
- source_word: με
  choice: 我
  rationale: 作动词的直接宾语，指说话的耶稣；无需扩译。
theological_decisions:
- issue: 受难叙事中 παραδώσει 的译法
  choice: 要出卖我
  alternative: 要把我交出去／要把我交给人
  rationale: 希腊词本身可以只表示“交出、交付”，并不在所有语境中都必然含有背叛之意；但此处是一名门徒将耶稣交给敌对者，关系上的背信十分突出。正文采用自然明确的“出卖”，脚注则保留原词较宽的字面意义，避免遮蔽其词义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我实在告诉你们”保留耶稣郑重宣告的语气；脚注标记置于“出卖我”之后，与其所说明的词语准确对应。
