source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: zh_hans
  text: 那时，耶稣对他们说：“今夜，你们都要因我跌倒[a]，因为经上记着：‘我要击打牧人，羊群中的羊就要四散。’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”也可译作“失足”“因我而动摇”或“离弃我”。这里的上下文指门徒当夜离开耶稣，但原词本身保留从受绊到背离的语义幅度。
    reason: lexical_alternative
  - marker: b
    text: 引自《撒迦利亚书》13:7。
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然承接叙事次序，对应时间副词，语体庄重而不生硬。
- source_word: λέγει
  choice: 说
  rationale: 希腊文是叙事中的历史现在时；现代汉语叙事不以动词形态区分现在与过去，用“说”即可自然传达。
- source_word: Πάντες ὑμεῖς
  choice: 你们都
  rationale: 保留原文“你们”与“都”的强调，明确所指包括所有门徒。
- source_word: σκανδαλισθήσεσθε
  choice: 跌倒
  rationale: “跌倒”保留该词从受绊到背离的语义张力；上下文表明这里具体表现为门徒离弃耶稣，又不把它过度解释为最终背道。
- source_word: ἐν ἐμοὶ
  choice: 因我
  rationale: 表达门徒的跌倒与耶稣及将发生在他身上的事有关，同时保留关系性和因由性。
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: 今夜
  rationale: 简洁自然地表达“这一夜”，适合耶稣当下对门徒所说的话。
- source_word: γέγραπται γάρ
  choice: 因为经上记着
  rationale: 采用现代汉语中引介经文的自然固定表达，并体现完成时所含“已经写下、仍然有效”的意味。
- source_word: Πατάξω
  choice: 我要击打
  rationale: 直接保留第一人称未来行动及击打意象，不增添“击倒”或“杀死”等原文未明说的结果。
- source_word: τὸν ποιμένα
  choice: 牧人
  rationale: 准确保留牧养隐喻；引文中不必机械添加定冠意义。
- source_word: διασκορπισθήσονται
  choice: 就要四散
  rationale: “四散”自然呈现羊被分散、各自逃离的图景；汉语形式虽无显式被动标志，受事主语仍清楚。
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: 羊群的羊
  rationale: 保留原文同时出现“羊”和“羊群”的完整措辞，不简化为单独的“羊”。
theological_decisions:
- issue: σκανδαλισθήσεσθε 所指的跌倒程度
  choice: 译作“跌倒”，由上下文显示为门徒因耶稣遭遇之事而离弃他
  alternative: 译作“离弃我”“背弃我”或“厌弃我”
  rationale: “跌倒”保留希腊词可涵盖受绊、失足、离弃的幅度，也与后文门徒逃散相呼应；不把暂时离弃预先界定为最终背道。
- issue: ἐν ἐμοὶ 的关系与因由
  choice: 译作“因我”
  alternative: 译作“在我里面”或“因我的缘故离弃我”
  rationale: 此处不是静态的联合表达，而是指耶稣成为他们跌倒所关涉的对象或缘由；“因我”简明且不额外限定具体机制。
- issue: “我要击打牧人”中第一人称主语的神学张力
  choice: 照引文保留“我要”，不说明行动者如何实施击打
  alternative: 改写为“牧人将被击打”以淡化第一人称施事
  rationale: 原文明确保留第一人称，译文不应消除其中关于上帝旨意、许可与人类行动之间的张力，也不在本节中加以系统解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“今夜”适合直接引语；“经上记着”自然引介圣经引文；保留“羊群的羊”这一略带重复的原文表达，以呈现引文措辞。脚注标记均已置于正文相应位置。
