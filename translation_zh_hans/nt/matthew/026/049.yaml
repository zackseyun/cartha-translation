base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: zh_hans
  text: 他立刻走到耶稣跟前，说：“你好，拉比！”[a]并亲了他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你喜乐，拉比！”这里的“你好”原意与“喜乐”有关，但常用作见面问候。
    reason: lexical_alternative
  - marker: b
    text: “亲了”所用的原文动词可能含有强化意味，也可理解为“热切地亲了他”或“连连亲他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达动作随即发生，语言自然，并保留叙事的紧迫感。
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: 走到耶稣跟前
  rationale: 表达犹大主动走近耶稣的实际动作，比生硬的“来到耶稣那里”更符合现代汉语。
- source_word: Χαῖρε
  choice: 你好
  rationale: 此处是当时惯用的问候语；“你好”在现代汉语中清楚自然，不把它误解为命令“要喜乐”。
- source_word: ῥαββί
  choice: 拉比
  rationale: 保留原文所采用的闪语称谓音译；“拉比”也是中文圣经语境中通行且可辨识的称呼。
- source_word: κατεφίλησεν
  choice: 亲了
  rationale: 正文采用自然简洁的表达；该动词可能带有热切、用力或反复亲吻的强化意味，保留在脚注中，以免正文过度限定。
- source_word: αὐτόν
  choice: 他
  rationale: 指代耶稣，按现代汉语自然译出。
theological_decisions:
- issue: 如何表达犹大的问候 Χαῖρε
  choice: 你好
  alternative: 愿你喜乐；向你问安
  rationale: 在本语境中，该词首先是日常见面问候，并非神学宣告。采用现代问候语，让背叛行为造成的反讽由叙事本身显明。
- issue: 是否明确 κατεφίλησεν 的强化意味
  choice: 正文译作“亲了”，脚注说明可能的强化意味
  alternative: 热切地亲了他；连连亲他
  rationale: 该复合动词可能强调亲吻的热切或反复，但具体是哪一种并不确定。正文不替原文消除歧义，脚注则保存其可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你好”体现惯用问候，“拉比”保留历史称谓；两个脚注分别保存问候语的字面背景和亲吻动词未完全确定的强化意味。
