  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: zh_hans
  text: 耶稣知道了这事，就对他们说：“为什么难为这女人呢？她为我做了一件美好的事。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她向我做了一件美事。”
    reason: εἰς ἐμέ可表达行动向着耶稣或与耶稣相关的指向；καλόν可简洁译作“美事”。
lexical_decisions:
- source_word: γνοὺς
  choice: 知道了
  rationale: 该不定过去时分词表示耶稣得知或察觉了门徒所说的话；中文依上下文用“知道了”即可自然承接，不必补出宾语。
- source_word: δὲ
  choice: 就
  rationale: δέ在此推动叙事，并带有从门徒非议转向耶稣回应的轻微转折；中文用“就”连接语势更自然，反驳意味由上下文本身显明。
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: 为什么难为这女人呢？
  rationale: κόπους παρέχετε是使人受烦扰、困苦的表达。“难为”在现代汉语中简洁自然，既可指给她添麻烦，也可指令她为难，保留责问语气。
- source_word: ἔργον καλὸν
  choice: 一件美好的事
  rationale: καλός兼有美好、可嘉、合宜的意味；“美好的事”比单说“好事”更能传达耶稣对这一行动的赞许，同时不加入功德性解释。
- source_word: ἠργάσατο
  choice: 做了
  rationale: 该动词指已经完成的行动；汉语用“做了”简明自然，并由语境表达其当前意义。
- source_word: εἰς ἐμέ
  choice: 为我
  rationale: εἰς用于人时可表达指向或关联；“为我”在此最符合现代汉语习惯，同时在脚注保留较贴近空间意象的译法。
theological_decisions:
- issue: 对女人行动的评价
  choice: 一件美好的事
  alternative: 一件善事／一件可嘉的事
  rationale: 译文保留καλός兼具美好与善的正面评价，但不把这行动解释为赚取功德或赋予额外礼仪意义。
- issue: 女人行动与耶稣的关系
  choice: 为我做了
  alternative: 在我身上做了
  rationale: “为我”自然表达行动以耶稣为指向或对象；脚注保留“在我身上”的可能译法，以免消除εἰς在受膏语境中可能具有的具体指向。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“难为这女人”保留耶稣直接责问的力度；“美好的事”兼顾καλός的道德与审美色彩。
