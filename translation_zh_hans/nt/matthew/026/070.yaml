  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: zh_hans
  text: 他却当着众人否认[a]，说：“我不知道你在说什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说他所否认的具体对象。
    reason: 保留原文中宾语省略所产生的语义开放性。
lexical_decisions:
- source_word: ἠρνήσατο
  choice: 否认
  rationale: 原文没有明说“否认”的宾语；中文用不带宾语的“否认”既能承接上文的指控，也避免擅自限定为否认耶稣或否认认识某人。
- source_word: ἔμπροσθεν πάντων
  choice: 当着众人
  rationale: 准确表达“在所有人面前、在众人面前”的公开场合；“当着众人”符合现代汉语叙事习惯。
- source_word: λέγων
  choice: 说
  rationale: 以汉语顺承结构自然表达希腊文分词，保持动作之间的紧密联系。
- source_word: Οὐκ οἶδα
  choice: 我不知道
  rationale: 直接表达对“知道”的否定，语气自然庄重。
- source_word: τί λέγεις
  choice: 你在说什么
  rationale: 贴近原文“你说什么”，同时用现代汉语进行体“在说”自然表达对方正在作出的指控。
theological_decisions:
- issue: 彼得否认的具体对象
  choice: 不在正文中补出宾语
  alternative: “否认这事”或“否认耶稣”
  rationale: 希腊文仅说“他否认”，具体对象由上文语境提供。保留这一省略，可避免把经文的含义收窄为某一种解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“当着众人”清楚呈现公开否认的场景；直接引语保持简洁有力。
