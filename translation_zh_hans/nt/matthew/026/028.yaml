id: MAT.26.28
reference: Matthew 26:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: zh_hans
  text: 因为这是我的立约之血[a]，为许多人[b]流出，使罪得赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我的新约之血”。
    reason: textual_variant
  - marker: b
    text: 或译“替许多人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: 这
  rationale: 按希腊文直译指示代词，不补入本句没有的“杯”；所指之物由上下文说明。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对前文饮用命令的解释作用，也符合现代汉语表达。
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: 我的立约之血
  rationale: 保留“血”的献祭与盟约意涵；“立约之血”在汉语中比“盟约的血”更自然，并维持“血”与约的紧密关系。
- source_word: περὶ πολλῶν
  choice: 为许多人
  rationale: 在献祭语境中表示为了许多人、使他们得益处；不把 πολλῶν 扩大译成“所有人”，也不借此解决救赎范围的神学争议。
- source_word: ἐκχυννόμενον
  choice: 流出
  rationale: 以自然汉语表达现在时被动分词，保留血被倾流、献上的图像；由语境可明白其被动含义。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 使罪得赦免
  rationale: 清楚表达 εἰς 在此所含的目的或结果关系，同时避免生硬的名词串联。
theological_decisions:
- issue: “约”前是否加入“新”
  choice: 立约之血
  alternative: 新约之血
  rationale: 所给SBLGNT正文没有 καινῆς（“新”），因此正文不从平行经文或异文补入；常见异文另列脚注。
- issue: “为许多人”在救赎范围上的含义
  choice: 为许多人
  alternative: 为所有人
  rationale: 忠实保留 πολλῶν（“许多人”），不以本节经文之外的神学体系把它改为“所有人”，也不据此排除更广泛的神学讨论。
- issue: εἰς 所表达的逻辑关系
  choice: 使罪得赦免
  alternative: 为了罪得赦免
  rationale: 希腊语可承载目的或结果色彩；“使……得……”自然地保留血流出与赦罪之间的指向关系，而不额外界定其机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立约之血”保留圣经盟约语汇和献祭意象；句序尽量贴近希腊文，同时以“使罪得赦免”避免不自然的抽象名词堆叠。脚注标记均置于正文相应词语之后。
