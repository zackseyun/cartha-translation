  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: zh_hans
  text: 他带着彼得和西庇太的两个儿子，开始忧伤、极其苦恼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始悲痛、深感不安。”
    reason: 词义范围允许用不同的汉语措辞表达 λυπεῖσθαι 和 ἀδημονεῖν 所描写的悲痛与强烈内在困扰。
lexical_decisions:
- source_word: παραλαβὼν
  choice: 带着
  rationale: 此处不定过去时分词表示耶稣带上特定的同伴同行。“带着”在现代汉语中自然地表达这一伴随关系。
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: 西庇太的两个儿子
  rationale: 依照希腊文保留本节的称呼，不解释性地补出雅各和约翰的名字。
- source_word: ἤρξατο
  choice: 开始
  rationale: 明确保留希腊文所表达的起始义。
- source_word: λυπεῖσθαι
  choice: 忧伤
  rationale: 表达真实的悲痛与忧愁，并保持本段庄重的语体。
- source_word: ἀδημονεῖν
  choice: 深感不安
  rationale: 该词表示强烈的内在困扰、焦灼或痛苦；“深感不安”既与前面的“忧伤”有区别，也避免把语义过度强化为绝望。
- source_word: καὶ ... καὶ
  choice: 和；并列停顿
  rationale: 按现代汉语习惯处理希腊文的并列结构，使同行者和两种情绪状态的累加关系清楚自然。
theological_decisions:
- issue: 如何描述耶稣的情绪状态
  choice: 直接译出他真实的忧伤和强烈不安
  alternative: 为淡化其情感脆弱而弱译，或超出词义强化为恐惧、绝望
  rationale: 两个动词都应按其通常词义译出，呈现耶稣真实的人性痛苦，同时不将原文并未明确表达的绝望加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“西庇太”沿用中文圣经中通行的人名译法；句式简洁，并保留原文情绪逐步加重的效果。
