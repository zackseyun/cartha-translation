  source_fidelity: “带着彼得和西庇太的两个儿子”准确保留了 παραλαβών 和原文未明说儿子姓名的表达；“开始”也正确表达 ἤρξατο 的起始义。不过，“深感不安”在现代汉语中通常偏指不安、忧虑，力度不足以充分承载 ἀδημονεῖν 所指的强烈内在困苦。
  naturalness: 原句整体通顺庄重。将后一个情绪词改为“极其苦恼”，能更自然清楚地表达与“忧伤”有别而更强烈的痛苦；在情绪短语处设置脚注锚点也更明确。
  terminology: “西庇太”是通行且合宜的人名译法。“忧伤”和“极其苦恼”分别对应 λυπεῖσθαι 与 ἀδημονεῖν，不引入“绝望”等原文未明确的含义。
  issues:
