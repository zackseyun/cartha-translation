  rationale: 修订仅增强“ἀδημονεῖν”的汉语力度，并将脚注锚点移至所注释的情绪短语后。“开始”仍统摄两个并列不定式；未补出雅各、约翰的姓名，也未对耶稣的情绪作神学性弱化或强化。
