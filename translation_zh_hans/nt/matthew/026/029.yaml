revisions:
- from: 但我告诉你们：从今以后，我绝不再喝这葡萄树的果实，直到那一天，我在我父的国里同你们喝这新的[a]。
  to: 但我告诉你们：从今以后，我绝不再喝这葡萄树的出产，直到那一天，我在我父的国度里同你们喝它；那时所喝的是新的[a]。
  rationale: 修订仅处理中文搭配和指代清晰度。“葡萄树的出产”保留原文未明说为酒的表述；“那时所喝的是新的”让“新的”有可识别的回指对象，并借脚注保留其可理解为“重新”或“以新的方式”的可能。
  reviewer_model: gpt-5.6-terra
