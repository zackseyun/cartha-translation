  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: zh_hans
  text: 但我告诉你们：从今以后，我绝不再喝这葡萄树的出产，直到那一天，我在我父的国度里同你们喝它；那时所喝的是新的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重新”或“以新的方式”。希腊语形容词可表示性质或状态上的新；这里也可能指在将来的国度里以新的方式同饮。
    reason: 说明καινὸν的词义选择及原文保留的歧义。
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: δέ在这里表示轻微转折或话语推进；“但”自然地承接上文，又不把对比说得过强。
- source_word: οὐ μὴ πίω
  choice: 我绝不再喝
  rationale: οὐ μή加不定过去时虚拟语气构成强烈的将来否定；“绝不再喝”兼顾强调语气和从此刻起停止饮用的语境。
- source_word: ἀπ’ ἄρτι
  choice: 从今以后
  rationale: 准确表达以说话当下为起点、延续至未来的时间意义。
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: 喝这葡萄树的果实
  rationale: γένημα意为出产或果实；保留原文“葡萄树的果实”的表达，不直接改写为“酒”，同时让读者可从上下文理解为杯中之物。
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: 直到那一天
  rationale: 保留指示词ἐκείνης所指向的特定未来日子及其末世意味。
- source_word: ὅταν αὐτὸ πίνω
  choice: 我……喝这
  rationale: ὅταν加虚拟语气在此指将来发生之时；“这”回指前述葡萄树的果实，符合现代汉语的指代习惯。
- source_word: καινὸν
  choice: 新的
  rationale: 直译形容词καινόν，保留其可能表示性质上的新、全新状态或重新饮用的开放性；脚注说明另一种理解。
- source_word: μεθ’ ὑμῶν
  choice: 同你们
  rationale: 简洁、庄重地表达共同参与。
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: 在我父的国里
  rationale: 贴近希腊语结构，并自然保留耶稣所说“我父”的庄重称谓。
theological_decisions:
- issue: 是否把杯中之物明确译作“酒”
  choice: 正文保留“葡萄树的果实”
  alternative: 酒；葡萄酒
  rationale: 原文使用γένημα τῆς ἀμπέλου，而非οἶνος。保留原有说法可避免增加经文没有明说的礼仪或象征限定。
- issue: καινὸν在未来国度筵席中的确切含义
  choice: 正文译为“新的”，不限定其新在何处
  alternative: 重新；以新的方式；全新的
  rationale: 原文可涉及性质或状态上的新，也可能在语境中带有“重新、以新的方式”的意味。正文不替经文消除这层歧义，脚注列出可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我绝不再喝”传达强烈否定；“这新的”在上下文中承接“葡萄树的果实”，并有意保留原文形容词的简约与歧义。
