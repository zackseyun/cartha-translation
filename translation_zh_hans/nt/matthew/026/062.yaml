  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: zh_hans
  text: 大祭司就站起来，对他说：“你一句也不回答吗？这些人是在作证控告你什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 这里是不定过去时分词，表示大祭司开口前起身的动作；“站起来”自然清楚，也保留现场的戏剧性。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是当时犹太教最高祭司职分的通行准确译名。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 依照希腊文保留代词，不以“耶稣”替换。
- source_word: Οὐδὲν ἀποκρίνῃ
  choice: 你一句也不回答吗
  rationale: οὐδέν在此作回答内容的宾语；这样译成现代汉语自然，并传达带有责问意味的否定问句。
- source_word: τί
  choice: 究竟是什么
  rationale: τί询问证词的具体内容；“究竟”体现连续追问的语气，但不增添新的命题内容。
- source_word: οὗτοί
  choice: 这些人
  rationale: 阳性复数指在场作证的人；“这些人”在汉语中明确而自然。
- source_word: σου
  choice: 告你的
  rationale: 与καταμαρτυροῦσιν连用，表示针对被告的不利证言；“告你”体现司法语境中的敌对方向。
- source_word: καταμαρτυροῦσιν
  choice: 作证告
  rationale: 保留该动词“作证反对某人”的司法含义及现在时的现场感，比单译“控告”更贴近见证行为。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作证告你的”保留法庭语境；第二问调整为自然汉语语序，同时保留τί所询问的证词内容。
