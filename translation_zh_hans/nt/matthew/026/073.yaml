  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: zh_hans
  text: 过了不久，站在那里的人走近彼得，对他说：“你确实也是他们中的一个，因为连你的口音[a]也暴露了你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口音”也可译作“言语”或“说话方式”。希腊语 λαλιά 可指言语、说话方式或口音。
    reason: 保留 λαλιά 的词义范围，避免将原文唯一限定为现代语言学意义上的“口音”。
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: 过了不久
  rationale: 这是表示短暂时间间隔的惯用语；“过了不久”自然、简洁，也准确保留了叙事时间的推进。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词；现代汉语可借时间短语和语序自然承接，无须另加“但”或“而”。
- source_word: προσελθόντες
  choice: 走近
  rationale: 保留了这些人朝彼得移动并接近他的动作，比单说“来”更准确。
- source_word: οἱ ἑστῶτες
  choice: 站在那里的人
  rationale: 贴近原文“站着的人”，并按语境补出汉语自然需要的“在那里”，不将他们进一步解释为特定身份。
- source_word: Ἀληθῶς
  choice: 确实
  rationale: 表达说话者确信无疑的断言，在现代汉语对话中自然且庄重。
- source_word: καὶ σὺ
  choice: 你……也
  rationale: 保留彼得也属于那一群人的强调。
- source_word: ἐξ αὐτῶν
  choice: 他们中的一个
  rationale: 自然表达属于前文所指群体，同时不在本节内额外说明该群体的身份。
- source_word: καὶ γὰρ
  choice: 因为连……也
  rationale: “因为”表达γάρ的理由关系，“连……也”体现καί在此处可能具有的强调作用。
- source_word: ἡ λαλιά σου
  choice: 你的口音
  rationale: 语境表明众人从彼得说话的特点辨认他；“口音”是现代汉语中最简明的表达，同时脚注保留“说话方式”等词义可能。
- source_word: δῆλόν σε ποιεῖ
  choice: 把你显露出来了
  rationale: 尽量保留原文“使你成为明显的”这一直接指向彼得的结构；汉语也能自然表达他的说话特征使其身份无法隐藏。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。引语保留现场指认的直接感；“他们中的一个”不额外添加“门徒”等解释。“把你显露出来了”较贴近希腊语结构，同时仍为普通读者所能理解。
