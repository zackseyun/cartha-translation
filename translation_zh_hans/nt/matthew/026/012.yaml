base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: zh_hans
  text: 因为她把这香膏倒在我身上，是为了预备我的安葬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσα
  choice: 把……倒在
  rationale: βάλλω在这里按语境指把香膏倾倒、施用在身体上，而不是字面的“投掷”。中文用“倒在”自然准确。
- source_word: γὰρ
  choice: 不单独译出
  rationale: γάρ承接上文，引出耶稣对女子行为的解释。独立成节时硬译“因为”会使中文句子悬空；其解释关系可由上下文自然体现。
- source_word: αὕτη
  choice: 她
  rationale: 所指女子在上下文中明确，现代汉语用“她”自然；无需生硬地译作“这个女人”。
- source_word: μύρον
  choice: 香膏
  rationale: μύρον指带香气、可用于膏抹的油膏；“香膏”兼顾其香气和膏抹用途，也符合本段语境。
- source_word: ἐπὶ τοῦ σώματός μου
  choice: 在我身上
  rationale: ἐπί加属格在此表示接触或所在位置；“在我身上”是自然的现代汉语表达。
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: 为安葬我作准备
  rationale: πρός加带冠词不定式表达目的；ἐνταφιάζω在此涉及为安葬而料理、预备身体。该译法既保留目的，也体现预备安葬的含义。
- source_word: ἐποίησεν
  choice: 是……作准备
  rationale: ποιέω是主句动词，概括女子刚才所做的事。中文采用“是为……作准备”的判断结构，可避免重复“她这样做”，同时保留主句功能。
theological_decisions:
- issue: ἐνταφιάζω与耶稣死亡的关系
  choice: 女子的举动被耶稣解释为为安葬他作准备
  alternative: 仅译作“为了我的安葬”，不明说预备身体的含义
  rationale: 该动词不只表示埋葬动作，也可指为安葬料理、预备遗体。译文保留耶稣对自己将死并被安葬的前瞻性解释，但不加入更多神学推论。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“香膏”比“香水”更能体现当时用于膏抹的芳香油膏。“为安葬我作准备”清楚表达原文目的结构及ἐνταφιάζω的语义。
