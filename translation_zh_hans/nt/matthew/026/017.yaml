  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: zh_hans
  text: 除酵节的第一天[a]，门徒来到耶稣跟前，说：“你要我们在哪里为你预备逾越节的筵席，好让你吃[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“除酵饼的第一天”，指除酵节期；有关逾越节时序的问题，不宜单凭译文加以解决。
    reason: cultural_note
  - marker: b
    text: 原文作“吃逾越节”。“逾越节”在此语境中可指逾越节的筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: 除酵节的第一天
  rationale: 时间与节期表达直接对应希腊文。δὲ在此是轻微的叙事衔接词，现代汉语无需另译为“现在”或“但”。τῶν ἀζύμων是形容词名词化的复数形式，指除酵节期。
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: 门徒来到耶稣跟前
  rationale: προσῆλθον表示来到某人那里或走近；“来到……跟前”自然保留趋近之意。原文是“门徒”，不必增添“他的”。
- source_word: λέγοντες
  choice: 说
  rationale: 分词表示门徒来到时所说的话；汉语用连续谓语“来到……说”比直译为“说着”更自然，并且不把言语行为进一步解释为“问”。
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: 你要我们在哪里为你预备
  rationale: θέλεις表达意愿；第一人称复数虚拟式用于间接商议性问句，译为“你要我们……”自然准确。σοι明确保留为“为你”。
- source_word: φαγεῖν τὸ πάσχα
  choice: 逾越节的筵席
  rationale: πάσχα可指逾越节，也可依语境指逾越节的筵席。这里与“预备”和“吃”连用，所指是筵席；汉语译作“预备逾越节的筵席”自然传达吃席的含义，避免生硬的“吃逾越节”。
theological_decisions:
- issue: “除酵节的第一天”与逾越节筵席时间之间的福音书记载关系
  choice: 照译“除酵节的第一天”，不作历法调和
  alternative: 解释性改译为“除酵节前一天”或“逾越节的第一天”
  rationale: 希腊文明确写作“除酵节的第一天”。有关逾越节日期与福音书时序的讨论不应由译文预先解决，因此正文保留原文表述及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来到耶稣跟前”保留趋近动作；问句简洁自然。“筵席”比“餐”更符合经文节期场景，但仍为普通读者熟悉。
