  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: zh_hans
  text: 那么，经上的话所说的‘这些事必须这样发生’，怎能应验呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: 那么……怎能
  rationale: πῶς引出带有反问意味的问题，οὖν承接上文并表示推论；合译为“那么……怎能”自然地保留逻辑联系和反问语气。
- source_word: πληρωθῶσιν
  choice: 应验
  rationale: 该词为不定过去时被动虚拟式；在“怎能”引导的反问中表达可能性。汉语“怎能应验”简洁自然，也保留被动含义，不必生硬添加“被”。
- source_word: αἱ γραφαί
  choice: 经上的话
  rationale: 复数形式在此指以色列的神圣经文。“经上的话”是现代汉语中清楚、庄重且易懂的表达，并非泛指普通著作。
- source_word: ὅτι
  choice: 以分句和问号呈现其内容关系
  rationale: ὅτι可引出经文所表明的内容。汉语若直译为“即这些事必须……”略显生硬，因此用相邻分句表达，同时以脚注保留也可把后半句直接纳入问句的理解。
- source_word: οὕτως
  choice: 这样
  rationale: 指耶稣被捕及受难之事正以这种方式展开；“这样”是自然、准确的现代汉语。
- source_word: δεῖ γενέσθαι
  choice: 必须这样发生
  rationale: δεῖ表达必要性，γενέσθαι指事情发生。“必须……发生”保留其力度，又不额外说明这种必要性的神学来源。
theological_decisions:
- issue: δεῖ所表达的必要性
  choice: 只译为“必须”，不增添“按上帝的旨意／计划”等解释
  alternative: 必须按上帝的旨意发生
  rationale: 经文借“应验”和δεῖ暗示与神圣安排有关的必要性，但原文并未在此明确展开；直译“必须”可保留这种神学张力。
- issue: ὅτι与前句的句法关系
  choice: 正文采用两个紧密相连的句子：“怎能应验呢？这些事必须这样发生。”
  alternative: 合为一个问句：“经上的话怎能应验，说明这些事必须这样发生呢？”
  rationale: ὅτι可能引出经文的内容；拆分能使现代汉语清楚自然，但不应掩盖原文可连续读作一个问句的可能，故以脚注注明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经上的话”比“诸经”更自然，比“圣经”更贴近原文复数γραφαί的指称方式；“这些事”补出汉语所需的主语，所指由上下文明确。
