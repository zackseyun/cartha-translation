  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: zh_hans
  text: 但这一切已经发生了，是要使众先知的经文得以应验。于是，所有门徒都撇下他[a]，逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撇下他”也可译作“离弃他”；原文分词ἀφέντες在此语境中可能含有更强的弃绝意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: 但这一切
  rationale: 自然地总括此前发生的整件事，并以“但”保留δέ较轻的转折或承接作用。
- source_word: γέγονεν
  choice: 发生了
  rationale: 表达事件已经发生；汉语无需机械复制希腊语完成时，也能由上下文体现其当前关联。
- source_word: ἵνα πληρωθῶσιν
  choice: 是要使……得以应验
  rationale: 兼顾ἵνα所表达的目的或结果关系，并保留被动语态的应验措辞。
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: 先知们的经文
  rationale: “经文”明确指神圣文献；属格简洁保留为“先知们的”，不擅自解释为先知所说或所写。
- source_word: τότε
  choice: 于是
  rationale: 自然标示紧接着发生的叙事结果与时序。
- source_word: οἱ μαθηταὶ πάντες
  choice: 所有门徒
  rationale: 保留πάντες所强调的全体性，不添入原文未明说的“他的”。
- source_word: ἀφέντες αὐτὸν
  choice: 撇下他
  rationale: “撇下”既可表示离开，也带有在危急中弃置不顾的语感，适合本处语境，同时保留较强译法的可能性。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 准确而自然地传达因惧怕或危险而逃离的动作。
theological_decisions:
- issue: 先知经文的应验
  choice: 是要使先知们的经文得以应验
  alternative: 这样，先知们所写的就实现了
  rationale: 保留马太福音明确的“经文”和“应验”用语，也保留ἵνα可能兼具目的与结果的张力，不把属格扩写成原文未明确表达的“所写”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得以应验”保留经文传统中的神学表达；“撇下他逃走了”简洁有力。脚注标记置于相关句末。
