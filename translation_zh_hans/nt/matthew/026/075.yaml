id: MAT.26.75
reference: Matthew 26:75
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: zh_hans
  text: 彼得想起耶稣说过的话：“公鸡叫以前，你会三次不认我。”他就到外面去，痛哭起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: 想起
  rationale: 该不定过去时形式在这里表示彼得此刻回想起先前的话；“想起”自然、简洁，并保留叙事中的骤然醒悟。
- source_word: ῥήματος
  choice: 话
  rationale: ῥῆμα在此指说出来的话；现代汉语用“话”比直译为单个“字”或较书面的“言语”更自然。
- source_word: εἰρηκότος
  choice: 说过
  rationale: 完成时主动分词指耶稣先前已经说出、此时仍具有现实意义的话；“说过”自然表达这一先行关系。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: 公鸡叫以前
  rationale: 将不定式时间结构译为自然的汉语时间短语。“公鸡”准确表达ἀλέκτωρ；汉语在这里不强制区分定指与不定指，因此无需人为加入“这只”或“一只”。
- source_word: τρὶς
  choice: 三次
  rationale: 直接、清楚地表达动作发生三次。
- source_word: ἀπαρνήσῃ
  choice: 你会……不认我
  rationale: ἀπαρνέομαι在语境中指否认与耶稣的关系；“不认我”符合彼得实际所作的否认，也比抽象的“否定我”自然。
- source_word: ἐξελθὼν ἔξω
  choice: 到外面去
  rationale: 以自然汉语保留离开现场、走到外面的动作，同时避免机械重复“出去到外面”。
- source_word: ἔκλαυσεν πικρῶς
  choice: 痛哭起来
  rationale: “痛哭”凝练表达πικρῶς所含的强烈悲痛，“起来”则使叙事中的动作起始自然流畅，不额外规定其悔恨的心理内容。
theological_decisions:
- issue: 是否在耶稣的名字前添加称号
  choice: 耶稣
  alternative: 主耶稣
  rationale: 希腊原文只有Ἰησοῦ，没有“主”等称号；译文不增添原文未有的基督论称谓。
- issue: 彼得哭泣的内在原因
  choice: 只译作“痛哭起来”
  alternative: 因悔恨而痛哭起来
  rationale: 上下文可使读者理解彼得的悲痛与悔意，但本节原文只明说他痛哭，没有明说心理原因，因此不将推断写入正文。
translation_notes:
  register: 采用现代、庄重而通俗的叙事汉语。“公鸡叫以前”保留原文时间关系；汉语无冠词，因而无需像英语那样为“a/the rooster”的差别设置脚注。句式简洁，并保留两个并列叙事动作的推进。
