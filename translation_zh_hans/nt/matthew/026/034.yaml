  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: zh_hans
  text: 耶稣对他说：“我实在告诉你，就在今天夜里[a]，公鸡还没有叫[b]，你就会三次不认我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就在今晚”。希腊文直译“在这夜里”，“这”带有强调。
    reason: lexical_alternative
  - marker: b
    text: 希腊文没有限定为某一只特定的公鸡。
    reason: lexical_note
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 按希腊文叙事语序自然转为现代汉语；“说”准确传达普通的过去时言说动词，不额外加强语气。
- source_word: Ἀμὴν λέγω σοι
  choice: 我实在告诉你
  rationale: “实在”表达ἀμήν在句首所带的郑重确认语气；“我告诉你”自然保留第一人称权威陈述和对彼得的单数直接称呼。
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: 就在今天夜里
  rationale: “今天夜里”符合现代汉语，“就在”保留ταύτῃ所突出的“这一个夜晚”之强调。
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: 鸡还没有叫
  rationale: 用“还没有……就……”这一汉语结构自然表达πρίν引出的先后关系；“鸡”不限定某一只，与无冠词的ἀλέκτορα相称。
- source_word: τρὶς
  choice: 三次
  rationale: 直接、清楚地表达次数。
- source_word: ἀπαρνήσῃ με
  choice: 你就会三次不认我
  rationale: “不认我”准确表达此处否认与耶稣关系的意思，又避免“否认我”在现代汉语中可能被理解为否认其存在；“会”表达将来的预告。
theological_decisions:
- issue: 耶稣引入预告时所用的Ἀμὴν λέγω σοι
  choice: 我实在告诉你
  alternative: 阿们，我对你说；我郑重地告诉你
  rationale: 正文保留该公式的郑重性和耶稣亲自宣告的权威，同时不用音译词引入礼仪联想，也不将其扩写为超出原文的解释。
- issue: ἀπαρνήσῃ με所指的否认
  choice: 不认我
  alternative: 否认我；不承认我
  rationale: “不认我”保留彼得将否认与耶稣有关系这一语境含义，但不进一步规定其动机或神学性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就在今天夜里”略带强调，以对应希腊文指示词；全句使用“还没有……就……”使时间关系清晰流畅。
