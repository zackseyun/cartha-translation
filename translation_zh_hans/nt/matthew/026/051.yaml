revisions:
- from: 看哪，同耶稣在一起的人中，有一个伸手拔出自己的刀，砍了大祭司的奴仆一刀，削掉了他的一只耳朵。[a]
  to: 看哪，跟耶稣在一起的人中有一个伸手拔出自己的刀，砍了大祭司的奴隶，把他的耳朵削掉了。
  rationale: 修订删除原文未表达的“一刀”，将终句改为自然的结果表达，并将δοῦλος译为“奴隶”以保留其社会从属身份。删除无必要的脚注；译文不补入持刀者、被砍者姓名或耳朵左右方位。
