  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s slave, and cut off his ear.
translation:
  language: zh_hans
  text: 看哪，跟耶稣在一起的人中有一个伸手拔出自己的刀，砍了大祭司的奴隶，把他的耳朵削掉了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留叙事中的突发感和引人注意的功能，也符合庄重而易懂的现代中文表达。
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: 同耶稣在一起的人中，有一个
  rationale: 忠实表达部分结构，不根据其他经文补明此人的身份。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸手
  rationale: 以自然简洁的中文表达先于拔刀发生的动作。
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: 拔出自己的刀
  rationale: ἀποσπάω在此指将武器拔出；“自己的”明确保留αὐτοῦ的所属关系。
- source_word: μάχαιραν
  choice: 刀
  rationale: μάχαιρα可指短剑或大刀具；中文“刀”能保留其范围，避免过度限定具体形制。
- source_word: πατάξας
  choice: 砍了……一刀
  rationale: 结合所用武器和随后耳朵被削掉的结果，传达猛烈击打，同时保持自然的中文叙事。
- source_word: δοῦλον
  choice: 奴仆
  rationale: “奴仆”保留其受主人支配的社会身份，又比单用“奴隶”更符合该家庭或官邸从属人员的叙事语境。
- source_word: ἀρχιερέως
  choice: 大祭司的
  rationale: 这是ἀρχιερεύς在犹太宗教职分语境中的通行准确译法。
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: 削掉了他的一只耳朵
  rationale: 以独立谓语反映希腊文有限动词ἀφεῖλεν，并自然说明刀击所造成的结果。
- source_word: ὠτίον
  choice: 耳朵
  rationale: 虽为指小形式，此处通常泛指耳朵；不具体化为“耳垂”。
theological_decisions:
- issue: δοῦλος在具体社会关系中的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “仆人”可能淡化受支配身份，“奴隶”则在现代中文里容易使读者只联想到特定近代奴隶制度；“奴仆”较能兼顾原词的从属地位和本段语境，不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“看哪”保留马太叙事的现场感；连续动作用简洁谓语展开。未从平行经文补入持刀者姓名、奴仆姓名或耳朵的左右方位。
