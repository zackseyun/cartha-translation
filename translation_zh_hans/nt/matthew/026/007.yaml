reference: Matthew 26:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: zh_hans
  text: 有一个女人来到耶稣跟前，拿着一只盛有极贵香膏的雪花石瓶[a]。耶稣正斜倚席间[b]，她就把香膏倒在他的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香膏”也可译作“香油”；希腊文 μύρον 可指芬芳的膏油，并不只指现代意义上的液体香水。
    reason: lexical_alternative
  - marker: b
    text: 当时的人用餐时通常斜倚在席位上。
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: 来到耶稣跟前
  rationale: 表达朝某人走近的方向；补出“耶稣”比连续使用代词更符合现代汉语，也未增加新的指称。
- source_word: γυνή
  choice: 有一个女人
  rationale: 原文是不定指单数，且本节没有给出身份说明。
- source_word: ἔχουσα
  choice: 拿着
  rationale: 在具体携带容器的语境中，“拿着”比直译为“有”自然。
- source_word: ἀλάβαστρον μύρου
  choice: 一只盛有……香膏的雪花石瓶
  rationale: ἀλάβαστρον指雪花石制或此类样式的容器；μύρον是带香气的膏油，“香膏”能保留其不一定是现代液体香水的含义。
- source_word: βαρυτίμου
  choice: 极贵
  rationale: 简洁传达其价值非常高的加强语气。
- source_word: κατέχεεν
  choice: 倒在
  rationale: 准确表达把液体或膏油倾倒于某物之上的动作，方向由后接短语说明。
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: 在他的头上
  rationale: 直接表达香膏接触并落在头上的位置。
- source_word: ἀνακειμένου
  choice: 正斜倚席间
  rationale: 该词在进餐语境中指按当时习俗斜倚用餐；“席间”自然点明宴席背景。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“斜倚席间”既保留古代用餐姿势，又避免读者误解为普通躺卧；脚注标记均置于相关词语之后。
