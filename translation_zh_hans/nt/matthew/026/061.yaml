source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: zh_hans
  text: 他们说：“这个人说过：‘我能拆毁上帝的殿，并在三天内[a]把它建起来。’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“在三日之间”。原文的时间表达可表示在这一时段内完成。
    reason: lexical_alternative
  - marker: b
    text: 参约翰福音2:19—21；那里说明耶稣所说的“殿”是指他的身体。
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: 他们说
  rationale: 不定过去时直陈式在此以简单过去事件引出证人的指控；“他们说”符合现代汉语叙事习惯。
- source_word: Οὗτος
  choice: 这个人
  rationale: 保留庭审指控中指示性的语气，也比生硬的“这个”更符合现代汉语。
- source_word: ἔφη
  choice: 说过
  rationale: φημί在此仅引述被指称说过的话；“说过”自然表达先前言论，不额外加入“声称”等评价。
- source_word: Δύναμαι
  choice: 我能
  rationale: 准确表达能力或可能性，同时比“我有能力”更自然简洁。
- source_word: καταλῦσαι
  choice: 拆毁
  rationale: 用于建筑物时可指拆除、毁坏；“拆毁”既保留建筑语境，也与后面的建造形成鲜明对应。
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: 上帝的殿
  rationale: ναός在这里指上帝的圣殿；“上帝的殿”清楚而庄重，并保留原文所有格关系。
- source_word: διὰ τριῶν ἡμερῶν
  choice: 在三天内
  rationale: διά加属格在此表示一段时间，译作“在三天内”自然表达建造在该时段内完成；脚注保留另一种时间理解。
- source_word: οἰκοδομῆσαι
  choice: 把它建起来
  rationale: 宾语由前面的“殿”承接，汉语补出“它”使句意完整；“建起来”比“重建”更贴近原词，避免加入原文未明说的重复建造含义。
theological_decisions:
- issue: 指控中“上帝的殿”所指为何
  choice: 正文按证人的表面指控译为上帝的圣殿，不在译文中直接改释为耶稣的身体。
  alternative: 让约翰福音2:19—21对耶稣身体的解释直接控制本节正文。
  rationale: 马太福音此处是在转述庭审中的证词。译文应呈现证人声称耶稣说过什么，而不在正文中与约翰福音作解释性合并；相关基督论联系以脚注提示。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这个人”保留指控场景中的指示语气；引语层次清楚，不把约翰福音的解释直接写入马太的庭审证词。
