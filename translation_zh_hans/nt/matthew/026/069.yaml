  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: zh_hans
  text: 彼得正坐在外面的院子里；一个使女[a]走到他跟前，说：“你也曾和加利利人耶稣在一起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”，也可译“女奴”。希腊语παιδίσκη指年轻的女性仆役，有时具有奴隶身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 这时
  rationale: 作为叙事中的轻度转接语，衔接场景而不过分强调转折；放在第二句更符合现代汉语叙事习惯。
- source_word: ἐκάθητο ἔξω
  choice: 正坐在外面
  rationale: “正坐”体现未完成时所表达的持续状态；“外面”指相对于室内审讯场景的位置。
- source_word: ἐν τῇ αὐλῇ
  choice: 院子里
  rationale: αὐλή在此指大祭司宅邸的内院或庭院；“院子”自然易懂，且不额外加入原文未明说的宅邸信息。
- source_word: προσῆλθεν αὐτῷ
  choice: 走到他跟前
  rationale: 准确表达向彼得靠近的动作，也符合现代汉语叙事表达。
- source_word: μία παιδίσκη
  choice: 一个使女[a]
  rationale: “使女”表达年轻女性仆役的身份，并保留μία所引入的一个特定人物；脚注说明可能具有奴隶身份。
- source_word: λέγουσα
  choice: 说
  rationale: 汉语用并列谓语“走到……说”比保留分词形式更自然，同时不改变动作关系。
- source_word: Καὶ σὺ
  choice: 你也是
  rationale: 保留καί与强调代词σὺ所表达的“你也在其中”的语气。
- source_word: ἦσθα μετὰ
  choice: 跟……一起的
  rationale: 直接表达彼得曾与耶稣同在，不扩展为明确的门徒身份。
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: 那加利利人耶稣
  rationale: 保留“加利利人”作为识别耶稣的称谓；“那”使口语指认自然，但不增加实质信息。
