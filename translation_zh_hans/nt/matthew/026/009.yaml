base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: zh_hans
  text: 因为这东西本可以卖得一大笔钱，分给穷人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一大笔钱”也可译作“许多钱”或“高价”。希腊原文使用表示价格的属格。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: 本可以
  rationale: 未完成时的 δύναμαι 与不定式连用，表示过去存在但未实现的可能；“本可以”自然传达这一含义。
- source_word: γὰρ
  choice: 因为
  rationale: 保留其对前一句抱怨所作的解释说明作用。
- source_word: τοῦτο
  choice: 这东西
  rationale: 中性单数指示代词回指上文所说之物；“这东西”在现代汉语中自然，也没有把具体名词直接补入正文。
- source_word: πραθῆναι
  choice: 卖
  rationale: πίπράσκω 的不定过去时被动不定式意为“被卖”；汉语“卖得”无需显式使用被动形式，且与“本可以”自然搭配。
- source_word: πολλοῦ
  choice: 一大笔钱
  rationale: 价格属格表示售卖所得的高价；此译法自然明确，同时不擅自规定具体金额。
- source_word: δοθῆναι
  choice: 分给
  rationale: δίδωμι 的不定过去时被动不定式与 πραθῆναι 并列；按语境，所给的是售卖所得的钱，“分给”在汉语中自然表达给多个穷人。
- source_word: πτωχοῖς
  choice: 穷人
  rationale: 形容词作名词用的与格复数，泛指贫穷的人；“穷人”简洁并保留集合意义。
