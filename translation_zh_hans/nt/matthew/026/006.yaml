  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: zh_hans
  text: 耶稣在伯大尼，麻风病人西门[b]的家里时[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当耶稣在伯大尼时。”希腊文使用属格独立结构，在时间上交代这一幕的背景。
    reason: lexical_alternative
  - marker: b
    text: “麻风病人”沿用原文对西门的识别性称号。原词可指多种皮肤疾患，不一定专指现代医学所说的麻风病；这里也没有说明西门当时仍患病，还是以前曾患过这种病。
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: 耶稣……的时候
  rationale: 这是属格独立结构，在这里用来交代事件发生时的背景；译作“……的时候”既符合现代汉语，也保留其时间性和伴随情境，不把 γίνομαι 生硬译成“成为”。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ 在此是轻微的叙事衔接语，并非强烈转折；本句作为时间从句已自然承接上下文，若另加“现在”或“但”反会显得过重。
- source_word: ἐν Βηθανίᾳ
  choice: 在伯大尼
  rationale: 按地点义直译；“伯大尼”采用通行中文地名。
- source_word: ἐν οἰκίᾳ
  choice: 在……家里
  rationale: οἰκία 在这里指西门的住所；现代汉语用“家里”比“房屋中”自然，同时保留具体地点。
- source_word: Σίμωνος
  choice: 西门
  rationale: 所有格关系在汉语中通过“西门家里”自然表达，无须另加“的”。
- source_word: τοῦ λεπροῦ
  choice: 麻风病人
  rationale: 保留原文用来识别西门的称号，同时以脚注说明该词的疾病范围及其不能确定西门当时是否仍患病。
theological_decisions:
- issue: “麻风病人”这一称号是否表示西门当时仍患病
  choice: 保留“麻风病人西门”这一叙事称号，不断定他当时仍患病或已经痊愈
  alternative: “从前患麻风病的西门”或“患皮肤病的西门”
  rationale: 希腊文只给出识别性称号，没有说明病况的时间，也不能据此作出现代医学上的精确诊断；译文不补入原文未明说的医治经历。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。整句是承接下一节的时间从句，因此保留句末逗号；不额外加入“现在”“后来”等原文没有明确表达的时间副词。
