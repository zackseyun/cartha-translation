base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: zh_hans
  text: 彼得出去，到了院门口，另一个女人看见他，就对在那里的人说：“这个人曾跟拿撒勒人耶稣在一起。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: 门廊
  rationale: 指通向院落的门口或门道区域；“门廊”在本处自然，并与彼得从院内向外移动的场景相符。
- source_word: ἄλλη
  choice: 另一个女人
  rationale: 阴性形式表明是另一名女性；明说“女人”可在中文中保留原文信息。
- source_word: λέγει
  choice: 说
  rationale: 原文使用历史现在时，使叙事生动；现代汉语通常不以时态形态区分，译作“说”即可自然承载这种叙事推进。
- source_word: μετά
  choice: 跟……是一伙的
  rationale: 不仅表达空间上的同行，也自然传达旁人所指认的归属关系；语气符合公开指认的场景。
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: 拿撒勒人耶稣
  rationale: 保留地域称号的名词性表达，比“来自拿撒勒的耶稣”更简洁，也符合中文圣经叙事的庄重语体。
theological_decisions:
- issue: μετά所表达的关系
  choice: 跟拿撒勒人耶稣是一伙的
  alternative: 曾跟拿撒勒人耶稣在一起
  rationale: 前者保留现场指认彼得属于耶稣一方的语用力度，但不额外规定门徒身份或具体关系。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“就对那里的人说”使动作衔接自然；不以中文生硬复制希腊语历史现在时。
