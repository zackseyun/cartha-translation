  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: zh_hans
  text: 他又离开他们，走开去第三次祷告，再次说同样的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: 离开他们
  rationale: 不定过去时分词在此表示耶稣离开门徒；译为“离开他们”自然并保留叙事顺序。
- source_word: πάλιν ἀπελθὼν
  choice: 又……走到一边
  rationale: πάλιν表示动作再次发生；ἀπέρχομαι表示从门徒那里走开。“走到一边”符合场景，也避免生硬重复“离开”。
- source_word: προσηύξατο
  choice: 祷告
  rationale: 该中动形式在此为异相动词，用通常的“祷告”准确表达。
- source_word: ἐκ τρίτου
  choice: 第三次
  rationale: 这是表示“第三次”的惯用表达，现代汉语无需另加介词。
- source_word: τὸν αὐτὸν λόγον
  choice: 同样的话
  rationale: λόγος虽为单数，在此指所说的内容；“同样的话”既自然，又比“同样的事情”更具体地保留言说含义。
- source_word: εἰπὼν πάλιν
  choice: 还是说
  rationale: 末尾πάλιν再次强调祷告内容的重复；“还是说”以自然汉语表达“再次说同样的话”，避免不必要的“又……同样……”叠加。
theological_decisions:
- issue: 祷告的重复
  choice: 明确保留这是第三次祷告，并且内容与先前相同
  alternative: 为行文简洁而弱化或省略末尾的πάλιν
  rationale: 原文既有ἐκ τρίτου，也在末尾有πάλιν，分别突出祷告次数和内容重复；译文不对这种重复作神学评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事；通过“又”和“还是”分别体现原文两处πάλιν，同时避免汉语措辞累赘。
