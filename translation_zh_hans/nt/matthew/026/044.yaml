review_pass:
  verdict: revise
  source_fidelity: “走到一边”把ἀπελθών具体化为“到一边”，原文只表示走开／离去，未说明具体位置。末尾“还是说”在现代汉语中较容易表达持续状态，未能清楚对应第二个πάλιν的“再次”。修订以“走开去”保留离去动作，并以“再次说”明确保留两处重复标记。
  naturalness: 修订后的句子符合现代标准汉语叙事语序；“走开去第三次祷告”自然地表达离开门徒而去祷告的动作链，避免无根据地补足地点。
  terminology: “祷告”庄重、通行且准确对应προσηύξατο；“同样的话”可自然表达τὸν αὐτὸν λόγον在此指重复的祷告言辞，不强加特定神学解释。
