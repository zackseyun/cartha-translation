  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: zh_hans
  text: 他们商议，要用诡计捉拿耶稣并杀害他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: 商议
  rationale: 该词表示共同谋划、商议；结合上下文，其目的带有敌意。“商议”自然准确，不额外强化为原文未明说的正式阴谋组织。
- source_word: δόλῳ
  choice: 用诡计
  rationale: δόλος指欺骗、诡诈或暗中设计；“用诡计”保留其欺骗性，比单纯“暗中”更贴近词义。
- source_word: κρατήσωσιν
  choice: 抓住
  rationale: 在此语境中指捉拿、拘捕耶稣；“抓住”是现代汉语中直接易懂的表达。
- source_word: ἀποκτείνωσιν
  choice: 杀掉
  rationale: 明确表达使人死亡的意图，与原文直接而强烈的措辞相称。
theological_decisions:
- issue: ἵνα所表达的目的关系
  choice: 译作“要”，表明他们商议的目的
  alternative: “好叫他们可以”
  rationale: ἵνα在此引出谋议的目标；汉语用“商议要……”自然地保留目的关系，无须加入可能性意味。
- issue: δόλῳ修饰行动的范围
  choice: 让“用诡计”直接修饰“抓住耶稣”
  alternative: 理解为同时修饰抓捕和杀害
  rationale: 词序最自然地把δόλῳ与κρατήσωσιν相连；译文不把“诡计”明确扩展到杀害行为，以免消除原文句法上的范围差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“商议要……抓住……杀掉”简洁有力，适合叙事语境；不添加原文没有的主语，因为本节希腊文以承接上文的连词开头，中文可自然承前省略。
