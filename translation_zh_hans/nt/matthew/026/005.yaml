base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: zh_hans
  text: 他们却说：“节期中不可动手，免得百姓中发生骚动。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时描写他们商议时持续或反复表达的意见；现代汉语叙事中用“说”最自然，语境已能体现商议过程。
- source_word: δέ
  choice: 却
  rationale: 表示与前文谋划形成的轻微转折：他们要设法拿住并杀害耶稣，却对行动时间有所顾忌。
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: 节期中不可动手
  rationale: 原文是省略式表达，直译近似“不要在节期中”；汉语补出语境所含的“动手”，使句意完整，同时不具体限定行动方式。ἐν在此表示时间范围，ἑορτή指逾越节这一节期。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 既自然表达所要避免的结果，也保留原文的目的意味。
- source_word: θόρυβος
  choice: 骚乱
  rationale: 指公众中的喧乱或社会秩序失控；“骚乱”保留严重性，又不像“暴动”那样把程度说得过满。
- source_word: γένηται
  choice: 发生
  rationale: γίνομαι在此表示某事出现或发生；与“骚乱”搭配自然。
- source_word: ἐν τῷ λαῷ
  choice: 百姓中
  rationale: λαός在此指聚集的民众；“百姓中”既贴近原文，也符合庄重而通俗的叙事语体。
theological_decisions: []
