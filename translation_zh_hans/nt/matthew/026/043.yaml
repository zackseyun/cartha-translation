  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: zh_hans
  text: 他又回来，见他们正在睡觉，因为他们的眼睛发沉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的眼睛很沉重。”
    reason: 保留βεβαρημένοι所表达的眼睛处于沉重状态这一较贴近字面的译法；正文“发沉”采用自然的现代汉语表达。
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: 又回来
  rationale: 不定过去时分词与副词πάλιν共同表示他再次来到门徒那里；“又回来”符合现代汉语叙事习惯，并保留动作的重复性。
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: 见他们睡着了
  rationale: εὗρεν在此表示发现、看见某种状况；现在分词καθεύδοντας描述当时正在持续的睡眠状态。“见他们睡着了”自然简洁。
- source_word: ἦσαν γὰρ
  choice: 因为……
  rationale: γάρ解释他们睡着的原因；汉语用“因为”清楚表达这一说明关系。
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: 他们双眼
  rationale: 按汉语习惯将属格结构译为领属短语；“双眼”自然表达复数οἱ ὀφθαλμοί。
- source_word: βεβαρημένοι
  choice: 沉重
  rationale: 这是βαρέω的完成时被动分词，表示眼睛已受重压而处于沉重状态。“沉重”保留其结果状态和形象，同时避免增添原文未明说的“睁不开”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“双眼沉重”保留原文形象及一定的表达张力，不把它解释性扩写为“困得睁不开”。脚注标记置于所说明的短语之后。
