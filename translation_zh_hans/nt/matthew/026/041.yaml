  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: zh_hans
  text: 要警醒，并祷告，免得你们进入试探[a]。心灵固然愿意，肉体却软弱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“试炼”。希腊词πειρασμός既可指引诱人犯罪，也可指使人经受检验的处境。
    reason: 保留πειρασμός在原文中的词义范围，避免只限定为犯罪诱惑；标记置于对应的“试探”之后。
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 该复数命令式本义为“保持清醒、警醒”。在客西马尼园的语境中既涉及门徒睡着，也含属灵警觉；“要警醒”自然地保留两层含义。
- source_word: προσεύχεσθε
  choice: 祷告
  rationale: 现在时命令式要求持续祷告；现代汉语中与“要警醒”并列的“祷告”已能自然表达命令，不必生硬加入进行体。
- source_word: ἵνα μὴ εἰσέλθητε
  choice: 免得你们进入
  rationale: ἵνα μή加虚拟式表达防止某事发生的目的。“免得”符合现代汉语，“进入”保留原文的空间隐喻，没有解释性地改成“陷入”。
- source_word: πειρασμόν
  choice: 试探
  rationale: πειρασμός可指引诱人犯罪的试探，也可指考验或患难。此处面对即将发生的道德失败，“试探”最贴合上下文；脚注保留其较宽的语义范围。
- source_word: τὸ μὲν πνεῦμα
  choice: 心灵固然
  rationale: πνεῦμα在此与肉体形成对照，较可能指人的内在意愿。“心灵”在现代汉语中比单用“灵”更自然，也避免明确指向圣灵；“固然”传达μέν…δέ的让步对照。
- source_word: πρόθυμον
  choice: 愿意
  rationale: πρόθυμος表示甘愿、热切或准备好；“愿意”简明地表达门徒内心有意顺服，却未夸大其热情或能力。
- source_word: ἡ δὲ σὰρξ
  choice: 肉体却
  rationale: σάρξ在这里指人在身体处境中的脆弱，并非明确的“罪性”。译作“肉体”保留圣经意象及其与“心灵”的张力，避免过度诠释为“身体”或“罪恶本性”。
- source_word: ἀσθενής
  choice: 软弱
  rationale: ἀσθενής意为弱、无力；“软弱”准确表达门徒无法实践其良好意愿的脆弱状态，并与“愿意”形成自然对照。
theological_decisions:
- issue: πνεῦμα所指为何
  choice: 译作“心灵”，主要理解为人的内在意愿
  alternative: “灵”或“圣灵”
  rationale: 上下文描述门徒真诚愿意却实际失败，并与“肉体”对照，因此人的心灵或内在倾向更合适。“心灵”也不把圣灵的解释强加给经文。
- issue: σάρξ的含义
  choice: 译作“肉体”，保留人受身体限制而软弱的意象
  alternative: “身体”或“罪恶本性”
  rationale: 此处重点是人的脆弱，不是保罗书信中较完整的罪性概念。直译“肉体”保留原文的张力，不把含义缩减为纯生理身体，也不扩大为特定罪性教义。
- issue: πειρασμός的双重语义
  choice: 正文译“试探”
  alternative: “考验”或“患难”
  rationale: 即将临到的压力会引发门徒的道德失败，所以“试探”适合正文；但希腊词也可指测试性的考验，故以脚注保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要警醒祷告”简洁有力，符合复数命令语气；“心灵固然愿意，肉体却软弱”保留原文对称结构、让步关系和神学张力。脚注标记[a]已置于正文对应词组之后。
