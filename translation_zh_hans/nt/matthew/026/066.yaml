  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: zh_hans
  text: “你们怎么看？”他们回答说：“他应受死刑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有死罪”或“他该被处死”。原文是法律判决用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: 你们怎么看？
  rationale: δοκέω与与格ὑμῖν构成询问意见或判断的惯用表达；“你们怎么看？”自然、直接，也适合此处要求众人作出裁断的语境。
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: 他们回答说
  rationale: 分词ἀποκριθέντες与εἶπαν合用，是常见的叙事表达；汉语用“回答说”简洁自然。δέ在此仅作轻微衔接，无须另译“但是”或“于是”。
- source_word: Ἔνοχος θανάτου
  choice: 他该死
  rationale: ἔνοχος接属格θανάτου表示在法律意义上应负死亡之刑、当受死刑。“他该死”是现代汉语中简洁有力的判决式表达；脚注保留“犯了该死的罪”和“应当被处死”等较显明的法律性译法。
- source_word: ἐστίν
  choice: 他……
  rationale: 希腊文系词带有由上下文补出的主语；汉语明确补出“他”，使判决对象清楚。
theological_decisions:
- issue: 公议会判决的司法性质
  choice: 他该死
  alternative: 他犯了该死的罪；他应当被处死
  rationale: 此句陈述的是审讯者对耶稣作出的判决，不等于叙述者宣告他在上帝面前确有罪。“他该死”保留他们判决的直接力度，而脚注说明原文的法律含义，避免将其误读为译者认可该判决。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“你们怎么看”保留直接问句；“他该死”符合庭审中简短裁决的力度。脚注明示其司法语义及可行替代译法。
