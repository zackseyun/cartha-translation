revisions:
- from: 于是，他开始赌咒，又起誓说[a]：“我不认识那个人！”立刻，鸡就叫了。
  to: 于是，他开始赌咒起誓，说：“我不认识那个人！”立刻，公鸡叫了。
  rationale: 将两个并列的希腊语不定式以自然的汉语固定搭配“赌咒起誓”表达，避免“又”所带来的轻微顺序化；将脚注改为更贴近词义的“呼求咒诅”。“公鸡”明确对应ἀλέκτωρ，未改变原有叙事语气或神学含义。
