  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: zh_hans
  text: 于是，他开始赌咒起誓，说：“我不认识那个人！”立刻，公鸡叫了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中紧接着发生的事；“于是”简洁自然，也保留事件推进的意味。
- source_word: ἤρξατο
  choice: 开始
  rationale: 保留起始体意义，显出彼得否认的进一步升级。
- source_word: καταθεματίζειν
  choice: 赌咒
  rationale: 该词指祈求咒诅临到，以加强话语的可信性；在起誓语境中，“赌咒”比一般的“咒骂”更贴切，同时不在正文中明定咒诅的对象。
- source_word: ὀμνύειν
  choice: 起誓
  rationale: 明确表达郑重发誓，而不是现代汉语中可能仅指说粗话的“咒骂”。
- source_word: ὅτι
  choice: 说
  rationale: 此处引出誓言或否认的内容，以直接引语呈现最符合现代汉语叙事习惯。
- source_word: Οὐκ οἶδα
  choice: 我不认识
  rationale: 在人物关系语境中，οἶδα表达认识或知道某人；“不认识”是自然、准确的汉语。
- source_word: τὸν ἄνθρωπον
  choice: 那个人
  rationale: 指前文所谈及的耶稣；“那个人”自然传达带定冠词的特指，又不额外加入轻蔑色彩。
- source_word: καὶ εὐθέως
  choice: 立刻
  rationale: 突出耶稣预言随即应验的紧迫性；汉语无需机械翻出句首连接词。
- source_word: ἀλέκτωρ
  choice: 鸡
  rationale: 原词在此指公鸡；现代汉语通常用“鸡叫”表达这一固定情景，比“公鸡啼叫”更自然。
- source_word: ἐφώνησεν
  choice: 叫了
  rationale: 用于鸡鸣时，“鸡叫了”是现代汉语最自然的表达。
theological_decisions:
- issue: καταθεματίζειν所指的咒诅性质与对象
  choice: 正文译作“赌咒”，表示以咒诅加强否认，但不明定咒诅对象；脚注说明很可能是求咒诅临到自己。
  alternative: 译作“咒骂”，或直接译成“求咒诅临到自己”。
  rationale: 该词与“起誓”并列，在此最可能指带有自我咒诅性质的誓言，而不是说粗话或咒诅耶稣；但原文没有明说“自己”，因此将这一较可能的理解放入脚注，可同时保存语义强度与原文的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赌咒，又起誓”保留原文两个并列动作及否认逐步加剧的力度；“鸡就叫了”则保持叙事简洁、即时。
