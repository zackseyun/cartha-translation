    reason: 说明καταθεματίζειν较为字面的含义及其在起誓语境中的可能所指，同时避免把“临到自己”当作原文明说的内容。
  revision_rationale: 将两个并列的希腊语不定式以自然的汉语固定搭配“赌咒起誓”表达，避免“又”所带来的轻微顺序化；将脚注改为更贴近词义的“呼求咒诅”。“公鸡”明确对应ἀλέκτωρ，未改变原有叙事语气或神学含义。
