reference: Matthew 26:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: zh_hans
  text: 他来到门徒那里，见他们正在睡觉，就对彼得说：“怎么[a]，你们连一个小时也不能同我警醒[b]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样”。
    reason: οὕτως 可形式对应地译为“这样”，但在这里也可作带惊讶、责备意味的语气表达。
  - marker: b
    text: 或译：“保持清醒”。
    reason: γρηγορέω 在此与睡觉相对，可具体理解为保持清醒；“警醒”同时保留警觉守望的意味。
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文使用历史现在时，使叙事更鲜活；现代汉语动词本身不标时态，“来到”在连续叙事中自然，也不额外添加原文没有的时态标记。
- source_word: πρὸς τοὺς μαθητὰς
  choice: 门徒那里
  rationale: 配合运动动词译作“来到门徒那里”，自然表达 πρός 在此处所指的趋向和到达。
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: 见他们正在睡觉
  rationale: “见……正在睡觉”保留分词 καθεύδοντας 的进行性动作，也清楚呈现后文“警醒”与睡觉之间的对照。
- source_word: λέγει τῷ Πέτρῳ
  choice: 就对彼得说
  rationale: “对彼得说”准确保留单数受话者；“就”自然衔接发现门徒睡觉之后的言语行动。
- source_word: Οὕτως
  choice: 怎么
  rationale: 此处 οὕτως 带有惊讶和责备语气；汉语疑问句中的“怎么”比机械直译“这样”更自然地传达这一语用功能，同时用脚注保留较形式对应的译法。
- source_word: οὐκ ἰσχύσατε
  choice: 你们连……也不能
  rationale: ἰσχύω 在这里表示有能力；“不能”简洁自然。“你们”明确保留第二人称复数，与前句单独提到彼得之间的张力。
- source_word: μίαν ὥραν
  choice: 一个小时
  rationale: 宾格在此表示持续时间；汉语在“警醒”前直接说“一个小时”即可自然表达时长。
- source_word: γρηγορῆσαι
  choice: 警醒
  rationale: γρηγορέω 既有不睡、保持清醒的具体含义，也含警觉守望的意味。“警醒”在庄重而通俗的经文语体中兼顾两层意思；脚注提供更具体的“保持清醒”。
- source_word: μετ’ ἐμοῦ
  choice: 同我
  rationale: 直接表达陪伴、共同参与之意；“同我”简练庄重，符合现代书面汉语。
theological_decisions:
- issue: 耶稣对彼得说话，但 ἰσχύσατε 是第二人称复数
  choice: 保留“对彼得说”与复数“你们”并置
  alternative: 将问话改成单数“你”，或增补说明彼得代表众门徒
  rationale: 原文明确指出受话者是彼得，却用复数动词责问多人。译文不把人数转换抹平，也不增添解释，让彼得与门徒群体之间的关系张力保留下来。
- issue: γρηγορέω 的具体清醒义与警觉守望义
  choice: 正文译为“警醒”
  alternative: “保持清醒”或“守望”
  rationale: 上下文与“睡觉”直接对照，具体指不入睡；但该词也可带警觉、守望意味。“警醒”兼容二者，脚注说明更具体的译法，避免排除原词的语义幅度。
translation_notes:
  register: 采用现代、自然而庄重的普通话书面语。“怎么……连……也不能……吗”传达温和却明确的责备。正文中的“你们”刻意保留希腊文复数，不因耶稣单独对彼得说话而改成单数。所有脚注标记均已置于正文相应位置。
