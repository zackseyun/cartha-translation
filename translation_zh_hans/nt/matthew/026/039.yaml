  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: zh_hans
  text: 他往前走了一小段，就俯伏在地[a]，祷告说：“我父啊，如果可能，愿这杯[b]离开我；然而，不要照我的意思，而要照你的意思。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“面伏于地”。
    reason: lexical_alternative
  - marker: b
    text: “杯”是圣经中表示所分定承受之份的意象，在这里尤指将要临到的苦难；参马太福音20:22；26:42。
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: 往前走了一小段
  rationale: 准确表达向前移动一段短距离；“一小段”自然体现 μικρόν，而“往前”保留 προέρχομαι 在此处的方向感。
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: 俯伏在地
  rationale: 这是表示整个人面向地面伏下的惯用表达；中文“俯伏在地”既自然庄重，也清楚呈现祷告时的身体姿态。
- source_word: προσευχόμενος καὶ λέγων
  choice: 祷告说
  rationale: 两个现在分词描述与俯伏同时进行的动作；中文合为“祷告说”简洁自然，不损失语义。
- source_word: Πάτερ μου
  choice: 我父啊
  rationale: 保留 μου 的亲密归属意味和呼格语气，同时维持庄重的祷告语体，不额外加入原文没有的情感修饰。
- source_word: εἰ δυνατόν ἐστιν
  choice: 如果可能
  rationale: 忠实保留条件表达，不擅自补明究竟对谁或在何种意义上“可能”。
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: 愿……离开我
  rationale: 以愿望式请求表达第三人称命令语气；“离开我”自然传达 παρελθάτω 与 ἀπ’ ἐμοῦ 的组合意义。
- source_word: τὸ ποτήριον τοῦτο
  choice: 这杯
  rationale: 保留原文具体而富有经文互文意义的“杯”这一意象，不将其直接解释为苦难、命运或刑罚。
- source_word: πλὴν
  choice: 然而
  rationale: 清楚标示对前一请求的强烈转折和限定，语气庄重而符合现代汉语。
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: 不要照我的意思，而要照你的意思
  rationale: 中文补出第二分句省略的内容，使表达完整自然；“意思”在这里可指意愿，既保留双方意愿的对照，也避免生硬地名词化为“我的意志”。
theological_decisions:
- issue: 耶稣祷告中“杯”的隐喻
  choice: 正文保留“这杯”，并以脚注提示其经文意象
  alternative: 直接译为“这苦难”或“这命运”
  rationale: ποτήριον 的字面形象在圣经中可指所分定承受的份，尤其与苦难相关。保留“杯”能维持互文和神学张力，而不在正文中过早限定其全部含义。
- issue: 耶稣的意愿与父的意愿之间的关系
  choice: 译为“不要照我的意思，而要照你的意思”
  alternative: “不要照我所想要的，而要照你所想要的”或“不要成就我的意志，而要成就你的意志”
  rationale: 译文既呈现耶稣真实表达自己的意愿，也呈现他对父的顺服；不把这种张力弱化为一般偏好，也不加入原文未明说的系统神学术语。
- issue: “如果可能”的开放性
  choice: 不补充“对你来说”或“按你的旨意”
  alternative: “如果你愿意”或“如果对你来说可能”
  rationale: 希腊文只说“如果可能”，没有明说可能性的依据。保留这种简洁和开放性，避免把后半句的顺服提前并入条件句。
translation_notes:
  register: 采用现代、自然而庄重的普通话。祷告称呼用“我父啊”，保留亲密与敬意；正文保持简洁叙事节奏。脚注标记均置于其实际说明的词语之后，并纠正咨询层中标记位置与脚注内容不相符的问题。
