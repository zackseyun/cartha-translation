  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: zh_hans
  text: 耶稣讲完了这一切话，就对门徒说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ……完了……，就……
  rationale: 这是马太常用、带闪语色彩的叙事衔接结构。现代汉语无需机械译出“事情发生了”；用“……，就……”自然表达时间承接关系，同时保留叙事推进作用。
- source_word: ἐτέλεσεν
  choice: 讲完了
  rationale: 动词表示完成、结束；与宾语“话”搭配时，“讲完了”比单说“完成了”更自然，也清楚表明此前言论已经结束。
- source_word: πάντας τοὺς λόγους τούτους
  choice: 这一切话
  rationale: πάντας与τούτους分别表达“一切”和“这些／这一”，λόγους直指所说的话；“这一切话”既忠实又符合现代汉语习惯，并保留马太结束一段讲论的公式性表达。
- source_word: εἶπεν
  choice: 说
  rationale: 采用叙事中λέγω最直接、自然的对应词，不额外加入“吩咐”或“告诉”等原文未明示的语气。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对门徒
  rationale: “门徒”是μαθηταί的常规对应词；汉语在主语已明确为耶稣时通常不必再译所有格“他的”，所属关系并无歧义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“讲完了这一切话”既承接前文整段讲论，也避免生硬的直译；不设脚注，因为形式化译法“事情发生了，当……”在中文中明显累赘，并未承载需要另行保存的实质歧义。
