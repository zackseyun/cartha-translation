  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: zh_hans
  text: 起来，我们走吧。看，那出卖我的人[a]已经近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“把我交出去的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: 起来
  rationale: 复数命令式，直接吩咐门徒起身；“起来”符合现代汉语口语，也保留紧迫感。
- source_word: ἄγωμεν
  choice: 我们走吧
  rationale: 第一人称复数劝勉虚拟式；“我们走吧”自然表达共同采取行动的劝促。
- source_word: ἰδού
  choice: 看
  rationale: 用于提醒听者注意眼前迫近的事态；“看”简洁有力，不带古语色彩。
- source_word: ἤγγικεν
  choice: 近了
  rationale: 完成时强调已经临近并形成当前状态；“近了”兼具临近过程及眼下结果，符合紧迫语境。
- source_word: ὁ παραδιδούς με
  choice: 出卖我的人
  rationale: 名词化现在分词直指正在把耶稣交出去的人；“出卖”在受难叙事中自然表达背叛含义，脚注保留“交出”的具体动作义。
theological_decisions:
- issue: 受难语境中 παραδιδούς 的译法
  choice: 出卖我的人
  alternative: 把我交出去的人
  rationale: 原词具体指把耶稣交给他人的人，在此语境中该行为构成背叛。“出卖我的人”是自然且贴合上下文的关系性表达；脚注说明较直译的动作义，避免抹去原文的语义层次。
translation_notes:
  register: 采用现代、庄重而自然的直接引语。“起来，我们走吧！”以感叹号体现连续命令和现场紧迫感；“看”保留 ἰδού 的提示功能。“近了”避免较书面的“已经临近”，适合普通读者。
