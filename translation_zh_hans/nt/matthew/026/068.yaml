  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: zh_hans
  text: 说：“弥赛亚啊，向我们预言吧！打你的是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时主动分词承接上文施暴者的动作并引出他们的话；汉语用“说”自然衔接，不另添原文没有的连词。
- source_word: Προφήτευσον
  choice: 说预言吧
  rationale: 不定过去时命令式，在这里是带嘲弄意味的命令，要求耶稣凭先知能力辨认打他的人；“说预言”保留了动词意义和讥讽语气。
- source_word: ἡμῖν
  choice: 向我们
  rationale: 与说话类动词连用的与格，表示预言所针对的听者；“向我们”符合现代汉语表达。
- source_word: χριστέ
  choice: 弥赛亚
  rationale: Χριστός为呼格，在此作为称号受到嘲弄；译作“弥赛亚”能突出其受膏者称号的含义，而不把它处理成名字的一部分。
- source_word: τίς ἐστιν
  choice: 是谁
  rationale: 用于询问并辨认具体的人；汉语“是谁”简洁自然。
- source_word: ὁ παίσας σε
  choice: 打你的
  rationale: 不定过去时分词名词化，直指刚才击打耶稣的那个人；“打你的”既保留具体动作，也与“是谁”构成自然问句。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里是呼格称号，并带有讥讽性的弥赛亚宣称；“弥赛亚”更明确显示其称号功能。脚注保留传统译法“基督”，避免掩盖两种汉语称谓所对应的是同一个希腊词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用两个短句呈现施暴者讥讽式的挑战；“吧”传达命令在此处的挑衅语气，但不额外解释他们如何要求耶稣辨认施打者。
