  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: zh_hans
  text: 那些抓住耶稣的人把他带到大祭司该亚法那里；经学家和长老已经聚集在那里了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经被召集在那里了。”这里的希腊语动词既可按不及物意义理解为“已经聚集”，也可按被动意义理解为“已经被召集”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: 那些……的人
  rationale: 定冠词加分词构成名词性短语，译为“那些……的人”；δέ仅轻微推进叙事，中文无需另加明显的转折词。
- source_word: κρατήσαντες
  choice: 抓住
  rationale: 保留κρατέω“抓住、控制住”的基本含义，避免用法律色彩更强的“逮捕”过度诠释；其动作先于主句的“带到”。
- source_word: ἀπήγαγον
  choice: 把他带到
  rationale: 自然表达ἀπάγω所指的带离并带往某处；上下文已经表明耶稣受人控制，无须额外加入“押送”的语义。
- source_word: πρὸς Καϊάφαν
  choice: 到……该亚法那里
  rationale: πρός加宾格表示朝向某人，直译其移动方向，不增添原文未明说的“该亚法家里”或“面前”。
- source_word: τὸν ἀρχιερέα
  choice: 大祭司
  rationale: 这是ἀρχιερεύς在此处作为该亚法职衔的标准中文表达。
- source_word: ὅπου
  choice: 在那里
  rationale: 以自然中文表达地点关系，同时清楚指回该亚法所在之处。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: γραμματεῖς在此指熟悉并讲授犹太律法的宗教法律专家；“经学家”较“文士”更便于现代普通读者理解，也不过度扩写为解释性短语。
- source_word: οἱ πρεσβύτεροι
  choice: 长老
  rationale: 保留该群体作为公认领袖的传统而准确的称谓。
- source_word: συνήχθησαν
  choice: 已经聚集
  rationale: 不及物式表达自然呈现他们在耶稣被带来以前已经聚在那里的叙事次序；脚注保留被动理解的可能。
theological_decisions: []
