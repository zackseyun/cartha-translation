  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: zh_hans
  text: 门徒看见后，就很愤慨，说：“为什么这样浪费？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这种浪费是为了什么？”
    reason: 保留Εἰς τί较为字面的目的性问法，以及原文名词短语“这浪费”。
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见了
  rationale: 将不定过去时分词按时间关系自然译出；希腊文未明说宾语，中文也可依上文理解为看见那妇人所做的事，无须补出“这事”。
- source_word: δὲ
  choice: 就
  rationale: δέ在此推动叙事并带轻微转折；中文用“就”自然连接前事与门徒的反应，不必用较强的“但是”。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 福音书叙事中μαθηταί的标准译法；原文没有显式的“他的”，故不增补。
- source_word: ἠγανάκτησαν
  choice: 很气愤
  rationale: 表达强烈的不满和愤慨；“气愤”自然、准确，“很”体现该动词较强的语气。
- source_word: λέγοντες
  choice: 说
  rationale: 以现代汉语的连动结构表达分词关系，避免生硬直译为“说着”。
- source_word: Εἰς τί
  choice: 为什么
  rationale: 该短语直指目的或缘由；在责问语境中，“为什么”最自然，同时脚注保留较直译的目的含义。
- source_word: ἡ ἀπώλεια αὕτη
  choice: 这样浪费
  rationale: ἀπώλεια可指损失、毁坏或浪费；结合贵重香膏被倒出的语境，“浪费”最贴切。用“这样”体现αὕτη对眼前行为的指称，并形成自然的中文问句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“很气愤”保留门徒强烈且带判断意味的反应；正文简洁，脚注呈现原文问句较直译的另一种理解。
