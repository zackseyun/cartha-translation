  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: zh_hans
  text: 他第二次又离开去祷告，说：“我的父啊，如果这事不能过去，除非我把它喝下去[a]，愿你的旨意成就。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事”和“它”指上一节所说的苦杯；本节希腊文只说“这事”和“它”。
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: 又第二次
  rationale: 同时保留πάλιν所表达的重复和ἐκ δευτέρου所表达的次数；“又第二次”在叙事中简洁自然。
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: 离开，祷告说
  rationale: 将先行的分词与主要动词按现代汉语叙事顺序表达，既清楚又不改变动作关系。
- source_word: Πάτερ μου
  choice: 我的父啊
  rationale: 直接保留亲属称谓和第一人称所属关系；“啊”自然体现呼语。
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: 如果这事不能过去
  rationale: 保留否定可能性、指示代词和“过去”的意象，不在正文中补入本节未明说的“杯”。
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: 除非我喝下它
  rationale: “除非”准确表达ἐὰν μή的必要条件；“它”回指τοῦτο，同时保留原文中“喝”的具体意象。
- source_word: γενηθήτω τὸ θέλημά σου
  choice: 愿你的旨意成就
  rationale: “愿……成就”自然表达祈愿中的第三人称命令语气，并与马太福音6:10的祷告措辞相呼应。
theological_decisions:
- issue: 是否在正文中把τοῦτο／αὐτό明确译为“这杯”
  choice: 正文保留“这事……它”，并以脚注说明所指
  alternative: 译作“这杯……它”或“这杯……这杯”
  rationale: 上下文表明所指是前一节的杯，但本节希腊文只用指示代词和代词。保留这种表达可避免把上下文中的名词直接加入正文，同时脚注保障读者理解。
- issue: 如何表达耶稣对父旨意的顺服
  choice: 愿你的旨意成就
  alternative: 你的旨意成就吧；愿你的旨意实现
  rationale: 此译保留祈愿和顺服的力度，也维持与主祷文相近的措辞，不额外解释神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“这事／它”的含蓄指代，以脚注交代上下文；正文中的“愿……成就”适合祷告语体。
