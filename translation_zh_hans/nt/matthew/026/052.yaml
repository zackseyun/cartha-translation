id: MAT.26.52
reference: Matthew 26:52
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: zh_hans
  text: 于是耶稣对他说：“把你的刀收回原处！因为凡动刀的[a]，必死在刀下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿刀的”；这里很可能指诉诸武力，而不只是拿起武器。
    reason: 说明λαβόντες μάχαιραν既可按字面译为“拿刀”，在语境中又很可能具有诉诸暴力的惯用含义。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接前一事件并推进叙事，符合现代汉语叙事习惯。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 希腊文使用历史现在时；汉语以过去事件的自然叙述方式表达，无须标明时态转换。
- source_word: Ἀπόστρεψον
  choice: 收回
  rationale: 命令对方立即使已经拔出或拿出的武器回到原处；“收回”自然传达这一逆转动作，同时不擅自加入“入鞘”。
- source_word: τὴν μάχαιράν σου
  choice: 你的刀
  rationale: μάχαιρα可指刀、匕首或短剑；“刀”在此处简洁自然，也能在后半句中保留格言式重复。
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: 原处
  rationale: 表达武器应回到其本来的位置；不具体断定该位置必为刀鞘。
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: 因为凡动刀的
  rationale: 带冠词的分词结构表达普遍原则；“动刀”既保留刀的意象，也自然表示诉诸武力，而非仅仅手握器物。
- source_word: ἐν μαχαίρῃ
  choice: 在刀下
  rationale: 工具性与方式性的含义在汉语中以“死在刀下”自然表达，并保留前后对应。
- source_word: ἀπολοῦνται
  choice: 必死
  rationale: 此处指因刀而丧命或灭亡；“必死”准确、凝练，并体现将来陈述的确定意味。
theological_decisions:
- issue: 耶稣关于刀的这句话适用范围多广
  choice: 译为普遍性的原则：“凡动刀的……必死在刀下”，不进一步限定其教义范围。
  alternative: 将其解释为绝对禁止一切武力，或仅限于当时对那名门徒的预言。
  rationale: 希腊文的概括性结构涵盖“所有这样做的人”。译文保留这句话的广度，但不把某一宗派对武力的完整立场加入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”推进叙事；“收回原处”“动刀”“死在刀下”均为普通读者易懂的表达。保留原文中“刀……刀”的格言式对应，不补入“刀鞘”、彼得姓名或对武力伦理的额外解释。
