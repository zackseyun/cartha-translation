  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: zh_hans
  text: 他拿起一个杯[a]，感谢后递给他们，说：“你们都要从这杯里喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那个杯”。希腊文“杯”前没有冠词，但席间的语境也可能使它指一个特定的杯。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: 拿起
  rationale: 不定过去时分词表示先于主句发生的动作；“拿起”在现代汉语中自然，也保留了动作次序。
- source_word: ποτήριον
  choice: 一个杯
  rationale: 希腊文名词前没有冠词；用“一个杯”较直接地反映其形式，同时以脚注保留按席间语境理解为特指杯子的可能。
- source_word: εὐχαριστήσας
  choice: 献上感谢后
  rationale: 准确表达“感谢、感恩”及其先于“递给”的时间关系，不译成“祝福”或采用带有后世圣礼色彩的术语。
- source_word: ἔδωκεν αὐτοῖς
  choice: 递给他们
  rationale: 在杯子这一具体语境中，“递给”比笼统的“给”更自然；受词由上文明确，无须重复。
- source_word: λέγων
  choice: 说
  rationale: 自然引出直接引语；汉语不必机械保留分词形式。
- source_word: Πίετε
  choice: 要……喝
  rationale: 表达复数命令语气；“要”使对全体听者的吩咐清楚而自然。
- source_word: ἐξ αὐτοῦ
  choice: 从这个杯里喝
  rationale: ἐξ表示来源；此译法避免把话误解成“把杯中之物全喝完”。
- source_word: πάντες
  choice: 你们都
  rationale: 清楚表明命令面向在场的全体人，而不是说明饮用的数量。
theological_decisions:
- issue: εὐχαριστήσας是否采用圣礼化或“祝福”措辞
  choice: 献上感谢后
  alternative: 祝谢后；祝福了以后
  rationale: εὐχαριστέω的基本意义是感谢、感恩。所选译法忠实于词义，不把后来的礼仪术语或特定圣餐神学预先带入叙事。
- issue: πάντες的管辖范围
  choice: 你们都
  alternative: 全都喝了；把它全喝了
  rationale: πάντες最自然地指命令的全体听者。译作“你们都”既保留复数命令，也排除它修饰饮用数量的误读。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“献上感谢”避免口语中略显突兀的“感谢了”，也不明说感谢的对象，因为本节希腊文本身未明说。“你们都要从这个杯里喝”保留来源关系，并明确πάντες所指的是全体听者。
