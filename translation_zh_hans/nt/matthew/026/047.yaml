  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: zh_hans
  text: 耶稣还在说话的时候，看哪，十二人中的一个，就是犹大，来了；跟他一起来的还有一大群人，带着刀剑和棍棒[a]，是从祭司长和百姓的长老那里来的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“木棍”。原词本指木头或木制物件，在这里很可能指用作武器的棍棒。
    reason: lexical_alternative
  - marker: b
    text: 也可按语境理解为“是祭司长和百姓的长老派来的”。希腊原文较直译为“从祭司长和百姓的长老那里来的”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: 耶稣还在说话的时候
  rationale: 属格独立结构表示同时发生的动作；“还在……的时候”自然传达ἔτι及时间关系。汉语为明确主语补出“耶稣”，所指在上下文中清楚。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留提示读者注意、增强现场感的叙事标记，不将其过度解释为“突然”。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人中的一个
  rationale: 直接保留部分属格结构，不在正文中补入原文未明说的“门徒”，同时符合汉语表达。
- source_word: ὄχλος πολὺς
  choice: 一大群人
  rationale: 传达群体人数众多，不使用带有更强敌意色彩的“暴徒”。
- source_word: μετὰ μαχαιρῶν
  choice: 带着刀剑
  rationale: μάχαιρα可指剑或较短的刀；“刀剑”在现代汉语中自然，并保留词义范围。
- source_word: καὶ ξύλων
  choice: 和棍棒
  rationale: ξύλον本义为木头或木棍，在此武装场景中指用作武器的棍棒；脚注保留较字面的译法。
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: 是从祭司长和民间的长老那里来的
  rationale: ἀπό表示来源；译文保留“从……那里来”，让读者根据语境理解其授权关系，而不在正文中增添“奉差遣”。
theological_decisions:
- issue: 是否明确说这一大群人是受犹太领袖差遣而来
  choice: 是从祭司长和民间的长老那里来的
  alternative: 是祭司长和民间的长老派来的
  rationale: 上下文暗示这些人受领袖授权，但希腊文只用ἀπό表示来源，没有使用“差遣”的动词。正文保留原文的开放程度，脚注说明语境上可能的表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”略带经文语体，用来保留原文叙事中的提示和现场感；其余措辞避免过度古雅。标点突出犹大的同位说明，并使长句层次清楚。
