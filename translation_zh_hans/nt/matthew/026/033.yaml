  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: zh_hans
  text: 彼得却回答耶稣说：“即使众人都因你跌倒[a]，我也绝不会跌倒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“离弃”“失足”或“因你而动摇”。希腊语动词可指被绊倒、因某人而反感，也可指背离。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: 彼得却回答他说
  rationale: 将希腊语叙事中“回答”分词加“说”这一常见结构自然地译出，同时保留 αὐτῷ 的间接宾语；“却”传达 δέ 在上下文中的轻微转折。
- source_word: Εἰ πάντες
  choice: 即使众人都
  rationale: εἰ 字面为“如果”，但彼得将自己与所有其他人作强烈对比，此处具有让步意味；“即使”符合现代汉语表达。
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: 跌倒
  rationale: σκανδαλίζω 可指被绊倒、因某人而动摇或离弃。“跌倒”保留其形象性和语义张力，既可涵盖信心动摇和背离，又不把此处限定为终极意义的叛教。
- source_word: ἐν σοί
  choice: 因你
  rationale: 这里 ἐν 与 σκανδαλίζω 连用，表示因某人或与某人有关而跌倒；“因你”简洁自然，并保留因果关联。
- source_word: ἐγὼ οὐδέποτε
  choice: 我也绝不会
  rationale: 显明主语“我”与“众人”形成强调对比；“绝不会”传达 οὐδέποτε 强烈的时间性否定。
theological_decisions:
- issue: 门徒失败语境中 σκανδαλίζω 的译法
  choice: 跌倒
  alternative: 离弃；失足；因……而动摇
  rationale: “跌倒”保留希腊词的比喻及其开放幅度，可指受绊、动摇乃至离弃。它符合本段门徒因耶稣受难而失守的语境，同时不预先裁定这是暂时失败还是最终叛教。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人”与“我”形成鲜明对比；“跌倒”兼顾原文意象、上下文含义及神学上的开放性。
