  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: zh_hans
  text: 随后，耶稣和他们来到一个名叫客西马尼的地方，对门徒说：“你们坐在这里，等我到那边去祷告。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们坐在这里，直到我到那边去祷告。”希腊语 ἕως οὗ 的字面意思是“直到……的时候”；正文用“等我”更符合现代汉语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 随后
  rationale: 作为叙事时间连接词，表示事件接续；“随后”符合现代汉语叙事习惯。
- source_word: ἔρχεται
  choice: 来到
  rationale: 原文是历史现在时，用来增强叙事现场感；汉语动词本身不标时态，“来到”可自然承接上下文，又表达抵达该处。
- source_word: μετ’ αὐτῶν
  choice: 和他们
  rationale: 准确表达 μετά 加属格所表示的伴随关系。
- source_word: χωρίον
  choice: 一个……地方
  rationale: 该词可指地方、地块或产业；马太此处没有明说是园子，因此采用范围较宽且自然的“地方”。
- source_word: λεγόμενον
  choice: 名叫
  rationale: 用于引出地点名称；“名叫”在现代汉语中自然简洁。
- source_word: Γεθσημανί
  choice: 客西马尼
  rationale: 采用该地名通行的现代汉语音译。
- source_word: λέγει
  choice: 对……说
  rationale: 原文也是历史现在时；汉语无需刻意添加时态标记，“对门徒说”自然连接叙事与直接引语。
- source_word: Καθίσατε
  choice: 坐在
  rationale: 简单命令式，译为“坐在这里”简洁自然，不额外加入“留下”等原文未明说的意思。
- source_word: αὐτοῦ
  choice: 这里
  rationale: 地点副词，指门徒所在之处；“这里”直接且口语自然。
- source_word: ἕως οὗ
  choice: 等我
  rationale: 字面表示“直到……的时候”；结合汉语命令句，“等我……”自然表达门徒在耶稣离开祷告期间等候的意思，同时脚注保留较形式对应的译法。
- source_word: ἀπελθὼν
  choice: 到那边去
  rationale: 该不定过去时分词表达先行的离开动作；结合 ἐκεῖ 译为“到那边去”，自然呈现动作及地点转移。
- source_word: ἐκεῖ
  choice: 那边
  rationale: 与前面的“这里”形成明确的指示对照。
- source_word: προσεύξωμαι
  choice: 祷告
  rationale: 准确表达向神祈祷；置于“去”之后，符合现代汉语目的结构。
theological_decisions:
- issue: 客西马尼这一地点的性质
  choice: 将 χωρίον 译为“地方”
  alternative: “园子”
  rationale: 马太的措辞只称其为 χωρίον，并未在本节说明它是园子；译作“园子”会把约翰福音18:1的细节带入马太文本。
- issue: 门徒等候与耶稣祷告之间的时间关系
  choice: 正文采用自然汉语“等我到那边去祷告”
  alternative: “直到我到那边去祷告”
  rationale: ἕως οὗ 形式上表示“直到……”，在此语境中也涵盖门徒暂留原处、耶稣前去祷告这一时段。正文不把它扩写成“等我祷告回来”，以免加入原文未明说的返回或完成含义；脚注保留更贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随后”推进事件，“这里／那边”保留原文的空间对照。没有沿用传统中可能从别处经文引入的“园子”，也没有将末句扩写为“等我祷告回来”。
