  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: zh_hans
  text: 那出卖他的人已经给了他们一个记号[a]，说：“我亲吻的那个人就是他；抓住他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信号”。这里指预先约定、用来识别耶稣的记号。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: 出卖
  rationale: 该词本义可指“交出、交给”，但在受难叙事中指犹大的背叛行为；“出卖”既表达语境中的道德意味，也符合现代汉语习惯。
- source_word: σημεῖον
  choice: 暗号
  rationale: 这里指预先约定、用于辨认耶稣的信号。“暗号”自然地传达其识别功能；“记号”是较贴近词形的一种译法。
- source_word: Ὃν ἂν φιλήσω
  choice: 我亲谁
  rationale: 不定关系结构表示以亲吻的对象来确定身份；“我亲谁”简洁自然，并保留原文未明说问候方式的特点。
- source_word: φιλήσω
  choice: 亲
  rationale: 原词在此指亲吻这一识别动作。“亲”在现代汉语中简洁自然，无须增译为“以亲吻问候”。
- source_word: αὐτός ἐστιν
  choice: 谁就是他
  rationale: 保留原文简短而带强调的身份确认表达，不增添“你们要找的人”等原文未明说的内容。
- source_word: κρατήσατε
  choice: 抓住
  rationale: 该动词表示牢牢抓住或控制住；“抓住”兼顾实际动作和拘捕语境，又不把它限定为正式法律程序中的“逮捕”。
theological_decisions:
- issue: παραδιδοὺς用于犹大时所带的道德意味
  choice: 译为“出卖耶稣的人”
  alternative: “把耶稣交出去的人”
  rationale: 本段叙事明确描写犹大的背叛，因此“出卖”准确传达语境中的行为性质，同时脚注保留“交出”的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“暗号”清楚表达亲吻作为预定识别信号的作用；“谁就是他”有意保留原文紧凑、强调的指认句式。
