  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: zh_hans
  text: 我实在告诉你们：无论这福音[a]在全世界哪个地方被传扬，这个女人所做的事也会被人述说，作为对她的纪念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这好消息”。
    reason: lexical_alternative
  - marker: b
    text: 或译“人也会述说她所做的事，来记念她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在耶稣郑重宣告的句首，“实在”自然地表达确认和强调的语气，也比音译“阿们”更便于现代读者理解。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 直接保留第一人称和复数受词，是自然、清楚的现代汉语表达。
- source_word: ὅπου ἐὰν
  choice: 无论在……什么地方
  rationale: 表达原文不定地点的含义，并与后面的“全世界”自然衔接。
- source_word: κηρυχθῇ
  choice: 被传扬
  rationale: 保留希腊文的被动语态及公开宣告的意味；“传扬”也不局限于正式讲道。
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: 这福音
  rationale: “福音”是现代汉语中稳定而简洁的对应词，既保留“好消息”的词义，也符合本句庄重语体。
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: 在全世界
  rationale: 直接表达原文广泛、普世的空间范围。
- source_word: λαληθήσεται
  choice: 人也会述说
  rationale: 用泛指的“人”自然表达未来被动含义；“述说”适合以她所做之事为内容，避免与前面的“传扬”机械重复。
- source_word: ὃ ἐποίησεν αὕτη
  choice: 她所做的这件事
  rationale: 关系代词所指的是她的行动；“这件事”在汉语中清楚承接上文，而“她”保留原文的指示对象。
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: 来记念她
  rationale: 表达该事被述说所具有的纪念目的或结果，同时保持简洁自然。
theological_decisions:
- issue: εὐαγγέλιον的译法
  choice: 福音
  alternative: 好消息
  rationale: “福音”在现代汉语中已是通行且可理解的词，较能保持本句的正式宣告语体；脚注保留其普通词义译法，避免把词义限定为术语。
- issue: εἰς μνημόσυνον αὐτῆς的关系
  choice: 来记念她
  alternative: 作为对她的记念
  rationale: 原文可表达目的或纪念性的结果；正文采用自然的目的式表达，脚注保留更偏名词性的译法，不把其神学意义扩大为特定礼仪或教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣宣告的郑重语气；句中以“人也会述说”自然转换希腊文被动结构，但不改变行动将被广泛传述的重点。正文中的脚注标记[a]、[b]均与脚注对应。
