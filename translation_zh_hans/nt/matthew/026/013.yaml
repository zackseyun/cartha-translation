  source_fidelity: 原文的郑重宣告、地点不定条件、福音在全世界被传扬、该女子所做之事将被传述，以及其纪念性质，均应明确保留。原稿的“来记念她”可成立，但较明确地把 εἰς 处理为目的；“作为对她的纪念”更贴近 μνημόσυνον 的名词性纪念／纪念物含义，并保留原文关系的开放性。
  naturalness: “无论在全世界什么地方”可以理解，但“无论……在全世界哪个地方”更合乎现代普通话语序。“她所做的这件事”略显重复；改为“这个女人所做的事”既自然，也反映 αὕτη 的指示性。
  terminology: “福音”是 εὐαγγέλιον 在此庄重语境中稳妥、通行的译法；脚注保留“好消息”的词义替代。“传扬”“述说”分别恰当表达 κηρύσσω 与 λαλέω，避免不必要地混同二者。
