  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: zh_hans
  text: 彼得对他说：“即使我必须和你一同死，我也绝不会不认你。”所有门徒也都这样说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用叙事性现在时，现代汉语叙事中用“说”即可自然承载其话语功能，无须刻意标示时态。
- source_word: Κἂν
  choice: 即使
  rationale: κἄν在此引出让步条件，“即使”准确传达彼得强调的让步语气。
- source_word: δέῃ με
  choice: 我必须
  rationale: δέῃ表达必要性；“我必须”简洁自然，并保留原文的强制意味。
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: 和你一同死
  rationale: 既保留同行、共同承受的含义，也符合现代汉语表达。
- source_word: οὐ μή
  choice: 绝不会
  rationale: οὐ μή构成强烈否定；“绝不会”自然、明确地体现其强调力度。
- source_word: ἀπαρνήσομαι
  choice: 不认
  rationale: 在福音书有关彼得否认耶稣的语境中，“不认”比泛泛的“否认”更自然地表达拒绝承认与耶稣的关系，同时不增添“弃绝”等更强含义。
- source_word: ὁμοίως
  choice: 同样这样
  rationale: 表达“以同样方式、说同样的话”，在句中清楚指向彼得刚才的表态。
- source_word: πάντες οἱ μαθηταὶ
  choice: 其他门徒也都
  rationale: πάντες明确为“都”；汉语加入“其他”是由彼得本身也属门徒这一语境自然得出，用来避免把彼得再次包含在后一句主语中。
- source_word: εἶπαν
  choice: 说
  rationale: 直译其普通陈述意义，不添加“宣称”等额外语气。
theological_decisions:
- issue: 彼得否认声明的强度
  choice: 以“绝不会不认你”表达οὐ μή的强烈否定
  alternative: 我永远不会不认你
  rationale: “绝不会”保留强烈的将来否定，又不把时间范围明确扩大为“永远”；同时维持彼得自信承诺与随后失败之间的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“和你一同死”略带庄重感但不古奥；“绝不会不认你”保留原文强烈否定。原文不存在必须另列的文本异读或难以容纳于正文的歧义，因此不设脚注。
