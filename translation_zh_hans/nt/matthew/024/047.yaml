  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: zh_hans
  text: 我实在告诉你们，主人必委派他管理自己所有的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主人自己所有的财物。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在对观福音的庄重宣告公式中，译作“实在”既保留权威与郑重语气，也符合现代汉语表达；原文仅出现一次，不宜译成重复形式。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然呈现第一人称动词与复数间接宾语，并与“实在”组成现代汉语中庄重而清楚的宣告公式。
- source_word: ὅτι
  choice: 不单独译出
  rationale: 该词引出宣告的内容；现代汉语在“我实在告诉你们”之后无需另加对应词，内容关系仍然清楚。
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: 管理自己所有的财物
  rationale: ἐπί与καθίστημι在此表示受派负责某一范围；τοῖς ὑπάρχουσιν指属于主人的一切所有物。“财物”简洁自然，脚注保留更宽泛的直译。
- source_word: καταστήσει
  choice: 要派……管理
  rationale: 该动词在语境中指委派某人担任管理职分，不是单纯把人放在某处；“派……管理”清楚表达任命和职责。
- source_word: αὐτόν
  choice: 他
  rationale: 指上文忠信而有智慧的仆人，保留希腊文阳性单数所指。
- source_word: αὐτοῦ
  choice: 自己
  rationale: 其先行所指是执行任命的主人；汉语用“自己”可自然消除连续两个“他”可能造成的指代混淆，而不改变原意。
theological_decisions:
- issue: 主人所赐奖赏或托付的性质
  choice: 按比喻本身直译为主人委派仆人管理全部财物，不加入进一步的神学解释。
  alternative: 将其明确解释为教会权柄，或末世天上奖赏。
  rationale: 本节直接描述仆人在比喻中的职分提升与更大托付；其教会论或末世论含义可由读者结合上下文理解，不应写入译文本身。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“主人”在希腊文本节中未明说，但由动词的第三人称主语及上文语境明确，补出可避免汉语中“他……他……”的指代含混；措辞不引入特定宗派解释。
