  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: zh_hans
  text: 但你们要祷告，求你们逃离的事不要发生在冬天或安息日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύχεσθε
  choice: 要祷告
  rationale: 现在时命令语气，第二人称复数；“要祷告”自然表达持续有效的吩咐，不额外强化为“切切祷告”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并带有轻微转折；“但”简洁保留这一话语关系。
- source_word: ἵνα μὴ γένηται
  choice: 求……不要在
  rationale: ἵνα加虚拟语气在“祷告”之后说明祷告内容。结合时间短语，汉语用“求……不要在……”比直译“不要发生”更自然。
- source_word: ἡ φυγὴ ὑμῶν
  choice: 你们逃走的时候
  rationale: φυγή指逃离、逃走；译作“逃走的时候”既符合灾难语境，也不暗示必然成功脱险。
- source_word: χειμῶνος
  choice: 在冬天
  rationale: 该属格表示时间或季节；现代汉语自然译为“在冬天”。
- source_word: μηδὲ σαββάτῳ
  choice: 也不要在安息日
  rationale: μηδέ连接第二个否定情形。σαββάτῳ指安息日；汉语通常无需用冠词区分“一个”或“那个”，因此正文采用自然且不强行确定的“安息日”。
theological_decisions:
- issue: σαββάτῳ是否表达特指
  choice: 安息日
  alternative: 某个安息日；那个安息日
  rationale: 希腊文无冠词，但安息日作为制度性日名在希腊文中可不带冠词。现代汉语本身没有冠词，“在安息日”能够保留所指而不强行判定是类别性还是特指性；脚注提示这一语法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“逃走的时候”比名词化的“逃亡”更口语自然，同时保留紧迫的灾难语境。正文中的[a]与脚注对应。
