revisions:
- from: 但你们要祷告，求你们逃走的时候不要在冬天，也不要在安息日[a]。
  to: 但你们要祷告，求你们逃离的事不要发生在冬天或安息日。
  rationale: 调整句法，使“发生”明确以“逃离的事”为主语，并使“冬天”和“安息日”作为并列的时间条件；删除会误导读者把希腊语无冠词形式机械等同于特定汉语冠词义的脚注。未改变经文的命令语气、逃离含义或安息日所指。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:14:38Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了祷告的命令、逃离、冬天及安息日这两个不利时机。可是“逃走的时候不要在冬天”在汉语中句法搭配不够顺畅，且容易把“时候”作为一个需要处于某地或状态的主体；希腊文所说的是这次逃离不要发生在这些时段。
  naturalness: “但你们要祷告”庄重自然。“求你们逃离的事不要发生在冬天或安息日”更符合现代汉语，也更直接对应γένηται（发生）。
  terminology: “祷告”及“安息日”均为准确、通行且符合经文体裁的术语。“逃离”准确表达φυγή，且不预设逃离是否成功。原脚注把希腊文无冠词直接转为“某个／那个安息日”的汉语语义选择，容易夸大汉语正文实际无法编码的冠词差异；此处不宜保留。
  issues:
  - severity: medium
    issue: “求你们逃走的时候不要在冬天，也不要在安息日”句法和语义连接不够自然。
    rationale: “不要在冬天”更自然地修饰“逃离的事发生”，而非“逃走的时候”本身。改为“逃离的事不要发生在……”既保留原文的事件性γένηται，也使两个时间条件并列清晰。
  - severity: low
    issue: 脚注将无冠词的σαββάτῳ解释为“某个安息日”或“那个安息日”。
    rationale: 无冠词并不自动产生这两个确定的汉语释义；“安息日”在汉语中不标示冠词，正文已可自然保留原文的未明确性。
  revised_text: 但你们要祷告，求你们逃离的事不要发生在冬天或安息日。
