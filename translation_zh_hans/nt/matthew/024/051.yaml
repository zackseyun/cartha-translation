  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: zh_hans
  text: 还要把他劈成两半[a]，并把他的一份定在假冒为善的人当中[b]。在那里，必要哀哭切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严厉惩罚他。”原文动词直译为“劈成两半”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“把他的一份定在假冒为善的人当中。”
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: 把他劈成两半
  rationale: 保留该动词“劈为两半”的具体、强烈意象，不将其直接弱化为一般性的“严惩”；脚注说明可能的惯用理解。
- source_word: μέρος
  choice: 同得一份
  rationale: μέρος本义为“部分、份额”；在审判语境中指所分定的份或结局。“同得一份”既贴近原文，也不把它过度限定为地点。
- source_word: ὑποκριτῶν
  choice: 假冒为善的人
  rationale: 这是现代汉语中对ὑποκριτής自然且具马太福音主题一致性的表达，指外表与实质不一致的人。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接保留地点副词，并自然回指前述与假冒为善者同得的结局。
- source_word: κλαυθμὸς
  choice: 哀哭
  rationale: 符合马太福音反复出现的审判用语，兼具悲痛和哀号的语气。
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: 切齿
  rationale: “哀哭切齿”是准确、凝练且已为中文读者熟悉的固定表达，保留原文鲜明意象。
theological_decisions:
- issue: 是否把διχοτομήσει淡化为比喻性的惩罚用语
  choice: 正文保留“把他劈成两半”
  alternative: 严厉惩罚他
  rationale: 原文使用具体动词，且随后另述他被分定的结局。保留强烈意象可避免在翻译中预先裁定它究竟是字面刑罚还是比喻。
- issue: 如何表达τὸ μέρος αὐτοῦ ... θήσει所指的结局
  choice: 定他与假冒为善的人同得一份
  alternative: 把他安置在假冒为善的人中；定他与假冒为善的人同一命运
  rationale: “一份”保留μέρος的份额含义，而“定”体现分派、裁定；不进一步断言该份额具体是地点、命运还是刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“劈成两半”保留警告的力度；“假冒为善的人”和“哀哭切齿”延续马太福音中的主题性表达。脚注标记依其所解释内容置于“同得一份”后的[b]和“劈成两半”相关分句后的[a]；为与所给审定层的标记顺序保持一致，正文呈[b][a]。
