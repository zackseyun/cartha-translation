  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: zh_hans
  text: 耶稣从圣殿[a]出来，正要离去时，门徒上前，把圣殿的建筑指给他看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“圣殿”（希腊文ἱερόν）指整个圣殿建筑群或院区，并非专指内部的圣所。
    reason: 说明原文词义范围，并区别于通常指内部圣所的ναός。
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出来
  rationale: 该不定过去时分词表示先于主句动作发生的伴随动作；“从圣殿出来”既保留方向性，也不作过度解释。
- source_word: ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν在这里指整个圣殿建筑群及其院区，而非专指内部圣所；正文采用现代中文圣经中自然通行的“圣殿”，并以脚注说明其范围。
- source_word: ἐπορεύετο
  choice: 正离开那里
  rationale: 未完成时形式描写正在持续的移动；“正离开那里”保留进行中的意味，并使中文叙事自然。
- source_word: προσῆλθον
  choice: 上前
  rationale: προσέρχομαι表示走近或来到某人跟前；“上前”简洁地保留了趋近耶稣的动作。
- source_word: ἐπιδεῖξαι
  choice: 把……指给他看
  rationale: 该不定式表示门徒上前的目的；结合具体建筑，用“指给他看”比笼统的“展示”更符合现代汉语。
- source_word: οἰκοδομὰς
  choice: 建筑
  rationale: οἰκοδομή在此指圣殿建筑群中的各座建筑或构筑物；“建筑”准确、自然，并为下文有关拆毁的论述作铺垫。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿的
  rationale: 属格说明这些建筑属于圣殿建筑群；重复“圣殿”保留原文措辞及叙事重点。
theological_decisions:
- issue: ἱερόν与ναός的区分
  choice: 正文译作“圣殿”，脚注说明指整个圣殿建筑群或院区
  alternative: 正文直译为“圣殿建筑群”或“圣殿院区”
  rationale: 原文使用ἱερόν，范围包括整个圣殿区域，并非仅指内部圣所。正文采用通行而庄重的“圣殿”以保持可读性，同时借脚注保存原文的重要语义区别，不引入额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“正离开那里”体现未完成时的持续动作；“上前，把……指给他看”符合自然汉语，同时保留原文动作次序和目的关系。
