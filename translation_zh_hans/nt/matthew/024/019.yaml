  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: zh_hans
  text: 在那些日子，怀孕的妇女和给婴儿哺乳的妇女有祸了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: 有祸了
  rationale: 保留先知性警告与悲叹的强烈语气；比单纯的“可怜”更能表达临近的苦难。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是较弱的承接或转折。汉语直接以时间短语开头更自然，且上下文关系仍然清楚；若译作“但是”容易夸大对比。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 怀孕的
  rationale: ἐν γαστρὶ ἔχω是“怀孕”的惯用表达；此译法简洁自然，并保留希腊文名词化分词的结构。
- source_word: ταῖς θηλαζούσαις
  choice: 哺乳的
  rationale: θηλάζω指给婴儿喂奶；“哺乳的”在现代汉语中庄重而清楚，无须补出原文省略的宾语。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 直接、自然地保留原文的时间指示。
theological_decisions:
- issue: 阴性与格冠词及分词所指的人群
  choice: 译为“怀孕的和哺乳的”
  alternative: “怀孕和哺乳的妇女”
  rationale: 希腊文的阴性形式明确指女性，但没有明说“妇女”这一名词。汉语名词化的“……的”既自然，也避免无必要的增词，同时不会使所指含混。
- issue: οὐαί的功能
  choice: 译作面向当事人的“有祸了”
  alternative: 译作表达同情的“苦啊”或“可怜啊”
  rationale: 该词兼有悲叹和灾祸警告的张力。“有祸了”较能保留灾难临到的力度，而不把它仅仅解释为同情。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“在那些日子”前置，使汉语句子流畅；末尾用感叹号体现οὐαί的感叹力度。未设置脚注，因为“怀孕的和哺乳的”已准确表达原文，补出“妇女”只是汉语风格上的可选表达，并无实质性词义差异。
