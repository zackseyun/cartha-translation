  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: zh_hans
  text: 在田里的人也不要回去拿自己的外衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“自己的衣服”或“自己的外袍”。
    reason: 词义备选：ἱμάτιον可泛指衣服，也常指外衣或外袍。
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: 在田里的人
  rationale: 定冠词短语在这里作名词用，指身处田里的人；中文无需标明男性，也能保留代表性的单数表达。
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: 不要回去
  rationale: μή加不定过去时命令语气表达禁止；ἐπιστρέφω与ὀπίσω连用表示返回、往回走。译作“不要回去”自然地传达紧迫的禁令。
- source_word: ἆραι
  choice: 拿
  rationale: 不定式表示回去的目的；αἴρω在此指取走或拿上某物，“拿”简洁自然。
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: 自己的外衣
  rationale: ἱμάτιον通常指穿在外面的衣服或披在身上的衣物。“外衣”比宽泛的“衣服”更具体，同时避免把古代服饰过度限定为某一种样式；反身式“自己的”在中文中清楚对应αὐτοῦ的所指。
theological_decisions:
- issue: 阳性单数冠词短语所指的性别范围
  choice: 在田里的人
  alternative: 在田里的男人
  rationale: 希腊语形式虽为阳性单数，但在这段警告中具有泛指、代表性作用，并非只限定男性。中文用“人”既不缩窄所指，也保留个体性的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要回去拿”保留原文命令的紧迫感；“外衣”符合古代语境，又不过度古雅。
