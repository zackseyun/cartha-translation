source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: zh_hans
  text: 但你们要知道这一点：家主若知道贼会在第几更来到[a]，就会保持警醒，不让人把自己的房屋挖穿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更”指夜间划分的时段；也可译作“在夜里的哪个时段”。
    reason: cultural_note
  - marker: b
    text: 原文直译为“挖穿”。古代房屋的墙体或屋顶可能被挖开，盗贼便可由此进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: 但你们要知道这一点
  rationale: 保留δέ所标示的转折或话题推进，并以现代汉语自然表达面向听众的郑重提醒；γινώσκετε在形式上可作陈述，语境中则带有劝告意味。
- source_word: οἰκοδεσπότης
  choice: 家主
  rationale: 指一家之主或管理全家的人；“家主”简洁地保留其社会角色，又避免现代“房主”偏重产权的含义。
- source_word: ποίᾳ φυλακῇ
  choice: 在哪一更
  rationale: φυλακή在此指夜间划分的时段。“更”保留古代夜间计时的文化特色，并用脚注说明。
- source_word: ὁ κλέπτης ἔρχεται
  choice: 贼会……来
  rationale: 希腊文使用现在时，但在反事实条件句中表达家主所不知道的来临时段；汉语用“会……来”自然传达预期中的行动，不强行复制时态形式。
- source_word: ἐγρηγόρησεν ἂν
  choice: 就会保持警醒
  rationale: γρηγορέω既可指不睡觉，也可指保持警觉；此处用“保持警醒”兼顾夜间不睡和防备贼人的语境。
- source_word: οὐκ ἂν εἴασεν
  choice: 不让
  rationale: 自然清楚地表达不会准许或任由某事发生。
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: 自己的房子被人挖穿
  rationale: διορύσσω字面指“挖穿”，反映古代房屋可由墙体等处被挖开进入；正文保留具体意象，脚注补充其文化背景。
theological_decisions:
- issue: 家主形象的表达
  choice: 家主
  alternative: 房主；一家之主
  rationale: 这是比喻中的社会角色，并非带有特定教义含义的称号。“家主”既保留原词含义，也不引入现代产权观念。
- issue: 警醒一词的语义范围
  choice: 保持警醒
  alternative: 保持清醒；守望
  rationale: 原词在本语境中同时涉及夜间不睡和保持戒备。“保持警醒”保留这两层可能性，不把它缩窄为纯粹生理上的清醒，也不额外赋予专门宗教术语色彩。
- issue: 古代盗贼入屋意象
  choice: 房子被人挖穿
  alternative: 房子被人闯入
  rationale: 正文保留原文具体而具有历史背景的“挖穿”意象，避免只译出概括性结果；脚注帮助现代读者理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“家主”“哪一更”保留原文的社会与文化背景；句式简洁，维持条件句的反事实关系及比喻的警戒语气。
