  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: zh_hans
  text: 无论尸体在哪里，鹰都会聚集在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”也可译为“秃鹫”。希腊词通常指鹰；但在鸟聚集于尸体周围的图景中，也可理解为秃鹫等食腐鸟。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: 在哪里
  rationale: ὅπου与ἐάν及虚拟式ᾖ构成不定地点关系表达。汉语“在哪里……也……在哪里”自然地保留“无论何处”的泛指意味，并呈现原句的对应结构。
- source_word: πτῶμα
  choice: 尸体
  rationale: πτῶμα指倒下的身体，尤指尸体。“尸体”准确、通行，也不预先限定为人或动物。
- source_word: συναχθήσονται
  choice: 会聚集
  rationale: 该词虽为将来时被动形式，但在此可自然表达鸟群聚拢的结果；译作“会聚集”符合现代汉语，又避免生硬的“将被聚集”。
- source_word: ἀετοί
  choice: 秃鹫
  rationale: ἀετός通常可指鹰，但尸体周围群鸟聚集的语境更符合食腐的秃鹫；正文采用“秃鹫”，脚注保留“鹰”这一确有根据的词义。
theological_decisions:
- issue: 比喻意象的末世论所指
  choice: 只直接翻译尸体与鸟群聚集的图景，不说明其象征对象
  alternative: 将其明确解释为必然临到的审判、人子的显现、耶路撒冷被毁或罗马军旗
  rationale: 希腊文本本身没有明说尸体或鸟象征什么；直译意象可保留上下文中的神学张力，避免把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尸体在哪里，秃鹫也会聚集在哪里”保留原文平行而近似格言的结构；脚注标记置于完整句末。
