  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: zh_hans
  text: 由于不法之事增多[a]，许多[b]人的爱将会冷淡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由于不法之事的增多。”
    reason: lexical_alternative
  - marker: b
    text: 也可译为“众人的爱”；原文未明确界定所指的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: 因为……增多
  rationale: διά加带冠词的不定式表示原因；“因为……增多”在现代汉语中自然，并保留了原文的动词性表达。
- source_word: ἀνομίαν
  choice: 不法的事
  rationale: ἀνομία指无视或违背律法，尤其是上帝的律法。“不法的事”比“邪恶”更具体，也比“罪孽”更直接易懂。
- source_word: ψυγήσεται
  choice: 就会渐渐冷淡
  rationale: 该词在这里以变冷比喻感情消退；“渐渐冷淡”符合现代汉语习惯，也保留了冷却的隐喻。
- source_word: ἀγάπη
  choice: 爱心
  rationale: “爱心”是现代中文圣经语境中对ἀγάπη自然且易懂的表达，在此指人的爱逐渐消退。
- source_word: τῶν πολλῶν
  choice: 许多人的
  rationale: 保留希腊文范围广泛而不确定的说法，不将其扩大为“多数人”，也不限定为某一特定群体。
theological_decisions:
- issue: “许多人的爱心”的所指范围
  choice: 不说明这些人是全人类、信徒，还是混合群体
  alternative: 译成“信徒之间的爱心”或“世人的爱心”
  rationale: τῶν πολλῶν并未明确界定群体；保持“许多人”可避免加入原文没有明说的神学解释。
- issue: 不法增多与爱心冷淡之间的关系
  choice: 译为明确的因果关系“因为……就……”
  alternative: 较弱地译成“不法增多时”
  rationale: διά加带冠词的不定式明确表达原因，因此应保留因果联系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不法的事”准确呈现ἀνομία的律法含义；“爱心渐渐冷淡”保留原文的温度隐喻。主文中的脚注标记均与脚注对应。
