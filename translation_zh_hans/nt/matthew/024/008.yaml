  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: zh_hans
  text: 但这一切是阵痛的开始[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分娩之痛的开始”或“生产的疼痛的开始”。希腊语以分娩时的疼痛为喻，表示将临困苦的初始阶段。
    reason: 说明词义选择及原文的分娩隐喻。
lexical_decisions:
- source_word: πάντα…ταῦτα
  choice: 这一切
  rationale: 合译为现代汉语中自然的回指短语，涵盖前文所述的全部事件，也保留原文的总体指称。
- source_word: δὲ
  choice: 但
  rationale: 表示从前述事件转向对其意义的概括，带有轻微转折：这些事虽令人震动，却还不是终局。
- source_word: ἀρχὴ
  choice: 开始
  rationale: 表达某一过程的初始阶段；在“是……的开始”这一结构中，汉语无须另加定冠意义的形式。
- source_word: ὠδίνων
  choice: 阵痛
  rationale: 该词指分娩时的疼痛。“阵痛”是现代汉语中简洁自然的对应词，保留生产的隐喻，而没有泛化为普通的苦难。
theological_decisions:
- issue: ὠδίνων的分娩隐喻
  choice: 保留为“阵痛”
  alternative: 苦难、灾难；或“生产之痛”
  rationale: 原文把前述动荡描绘成分娩疼痛的初始阶段，而不只是笼统的苦难。保留这一隐喻可维持末世语境中的过程感和张力，又不额外规定其具体教义进程。
- issue: ἀρχὴ所表达的阶段性
  choice: 译作“开始”
  alternative: 开端、起头
  rationale: “开始”清楚表明这些事件属于初始阶段，并未把它们等同于终局；同时避免加入原文没有明说的时间表。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不过”使转折和限定关系更自然：前述一切虽然重大，却只是初始阶段；该词未增加新的事件内容。脚注提供较直译的表达，并解释隐喻。
