    issue: “攻打”可能把敌对冲突收窄为军事作战。
    rationale: ἐγερθήσεται…ἐπὶ…是“起来反对／攻击”的冲突习语；虽可包含战争，却未明确限定作战方式。译为“攻击”较为宽泛且自然。
  - severity: low
    issue: “必有”加强了原文未明确标示的必然性。
    rationale: ἔσονται是将来时的存在表达；“将有”足以表达预告性的将来意义。
  - severity: low
    issue: “民”“国”在现代普通话中指称范围较含混。
    rationale: “民族”与“国家”更清楚地呈现原文ἔθνος与βασιλεία的平行而有区别的群体／政治实体。
  revised_text: 因为一个民族要起来攻击另一个民族，一个国家要起来攻击另一个国家；各处[a]将有饥荒和地震。
  revised_footnotes:
