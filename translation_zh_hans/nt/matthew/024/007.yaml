revisions:
- from: 因为民要起来攻打民，国要起来攻打国；各处必有饥荒和地震。[a]
  to: 因为一个民族要起来攻击另一个民族，一个国家要起来攻击另一个国家；各处[a]将有饥荒和地震。
  rationale: 修订以“一个民族……另一个民族”及“一个国家……另一个国家”清楚表达原文重复名词所蕴含的相互敌对关系，并维持ἔθνος与βασιλεία的词汇区别。“攻击”避免将冲突过度限定为军事“攻打”；“将有”准确反映简单将来时。脚注内容保留，并将标记移至“各处”之后，以明确对应κατὰ τόπους。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:14:38Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了γάρ的解释性连接、两组敌对对象的平行结构，以及饥荒、地震在多个地点发生的意思。不过，“攻打”较容易限定为军事进攻，原文ἐγερθήσεται…ἐπὶ…的范围可包括更广义的敌对和冲突；“必有”也比单纯将来时略强。
  naturalness: “民要起来攻打民，国要起来攻打国”带有传统经文风格，但对现代普通话读者而言，“民族／国家”及“攻击”更明确、自然；将脚注标记紧随“各处”能更清楚地锚定所注短语。
  terminology: 以“民族”对应ἔθνος、以“国家”对应βασιλεία，保留二者的区别，而不将ἔθνος限为“外邦人”。“攻击”表达敌对行动，较不把原文限定为正式军事作战。“饥荒”“地震”准确。
  issues:
