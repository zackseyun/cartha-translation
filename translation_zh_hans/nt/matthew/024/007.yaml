  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: zh_hans
  text: 因为一个民族要起来攻击另一个民族，一个国家要起来攻击另一个国家；各处[a]将有饥荒和地震。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各处”也可译作“在不同地方”或“一处又一处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: 要起来攻打
  rationale: 该将来时被动/中间形式在“民攻打民”的习语中表示起而敌对、爆发冲突；译作“要起来攻打”自然地传达敌对行动，又不暗示文本未明说的神圣施动者。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明先前所述之事的缘由；现代汉语用“因为”能清楚保留解释关系。
- source_word: ἔθνος
  choice: 民
  rationale: 此处指具有群体和政治性质的人民共同体，并与“国”平行；“民”可保留其民族—人民层面的含义，避免与后面的“国”完全同词。
- source_word: ἐπὶ ἔθνος
  choice: 攻打民
  rationale: ἐπί加宾格在这一敌对习语中意为“反对、攻击”；“攻打”在汉语中比直译“起来反对”更自然地表达群体冲突。
- source_word: βασιλεία
  choice: 国
  rationale: 这里指政治疆域或王国，与ἔθνος形成平行；简洁的“国”符合现代汉语经文语体。
- source_word: ἔσονται
  choice: 必有
  rationale: 这是存在用法；“必有”既表达将来发生，也符合预告性语境，但不额外说明发生机制。
- source_word: λιμοὶ
  choice: 饥荒
  rationale: 复数形式指多起或多处严重缺粮灾害；汉语集合名词“饥荒”无需机械标出复数。
- source_word: σεισμοὶ
  choice: 地震
  rationale: 在此语境中明确指地震；汉语“地震”自然、准确。
- source_word: κατὰ τόπους
  choice: 各处
  rationale: 该分配性短语表示事情发生在不同地点；“各处”简洁保留这种分布意义。
theological_decisions:
- issue: 末世冲突话语中ἔθνος的范围
  choice: 民
  alternative: 民族；国家
  rationale: “民”既可指人民群体，也能与政治性的“国”构成原文的平行而不把两词完全等同；不限定为外邦人，也不缩窄为现代民族国家。
- issue: ἐγερθήσεται是否暗示神圣被动
  choice: 要起来攻打
  alternative: 要被兴起攻打；要起来反对
  rationale: 上下文习语描述敌对冲突的兴起，并未明确交代施动者；主动式汉语不额外加入神使其兴起的因果解释。
- issue: 将来表达的确定性
  choice: 必有
  alternative: 将有；会有
  rationale: 预告语境允许用“必有”表达将发生之事；该译法不对灾难的神学原因或具体时间作额外界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“民要起来攻打民，国要起来攻打国”保留原文紧凑的平行结构；分号清楚区分战争与灾害两组预告。脚注标记置于所注释短语所在句末。
