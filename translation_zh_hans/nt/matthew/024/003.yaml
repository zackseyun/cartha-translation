id: MAT.24.3
reference: Matthew 24:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: zh_hans
  text: 耶稣坐在橄榄山上时，门徒私下里来到他跟前，说：“请告诉我们，这些事什么时候会发生？你来临[a]和这个时代的终结[b]的预兆是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来临”也可译作“临在”或“到来”。
    reason: lexical_alternative
  - marker: b
    text: “这个时代的终结”也可译作“这个时代达到圆满”；传统上有译作“世界的末了”。
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: 耶稣坐……时
  rationale: 这是属格独立结构，表达同时发生的背景动作。用“坐……时”自然保留其持续和时间关系；根据上下文将代词明确为“耶稣”，便于本节独立阅读。
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: 橄榄山
  rationale: 采用现代汉语中通行且清楚的地名译法。
- source_word: προσῆλθον αὐτῷ
  choice: 来到他跟前
  rationale: 既表达门徒朝他走近，也符合现代汉语叙事习惯。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 表示门徒避开其他人、单独与耶稣交谈；“私下”简洁自然。
- source_word: Εἰπὸν ἡμῖν
  choice: 请告诉我们
  rationale: 将命令式按此处请求的语用功能译出；加入“请”使汉语对话自然，但不改变请求内容。
- source_word: πότε ταῦτα ἔσται
  choice: 这些事什么时候会发生
  rationale: ἔσται 字面为“将是”，在事件语境中译作“会发生”更符合现代汉语，同时保留“这些事”的指向。
- source_word: σημεῖον
  choice: 预兆
  rationale: 这里指预示将来事件的可识别征象；“预兆”比单独的“记号”更贴合末后事件的提问语境。
- source_word: παρουσίας
  choice: 来临
  rationale: παρουσία 可指到来或临在；在面向未来的提问中，“来临”能自然保留到达并显现的含义，又不具体规定方式或时间。
- source_word: συντελείας
  choice: 终结
  rationale: 该词强调一个时期达到尽头或完成；“终结”比单纯“结束”略为庄重，也不必然表示物质世界毁灭。
- source_word: αἰῶνος
  choice: 时代
  rationale: αἰών 在这里指时代或时期，而不是物质宇宙；译作“时代”避免把原文扩大为“世界”。
theological_decisions:
- issue: 末世语境中 παρουσία 的译法
  choice: 来临
  alternative: 临在；到来
  rationale: 原词兼有到达与临在的语义范围。上下文的问题指向未来，因此正文采用“来临”；脚注保留其他真实可行的词义，不进一步断定其具体模式。
- issue: συντελείας τοῦ αἰῶνος 的范围
  choice: 这时代终结
  alternative: 这时代达到圆满；世界的末了
  rationale: 原文说的是该时代达到终点，并未直接说物质世界被毁灭。“这时代终结”贴近原文，也保留“终结”可能含有完成、圆满的意味。
- issue: σημεῖον 与两个属格短语的关系
  choice: 将“来临”和“这时代终结”共同置于一个“预兆”之下
  alternative: 分别理解为两个预兆
  rationale: 希腊文只有一个带定冠词的单数 σημεῖον，随后以 καί 连接两个属格短语。译文保留一个共同的“预兆”，不擅自拆成两个问题。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。问句分为两句以符合汉语节奏，同时保留原文两个并列疑问的结构。正文中的[a]、[b]紧随各自所解释的词语。
