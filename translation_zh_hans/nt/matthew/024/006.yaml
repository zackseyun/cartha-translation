  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: zh_hans
  text: 你们将要听见战争和战争的消息[a]。你们要当心，不要惊慌，因为这些事必定会发生，但终局还没有到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战争的消息”也可译作“战争的传闻”。希腊语可指消息、报道或传闻，并不必然暗示消息不实。
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: 将要
  rationale: μέλλω的将来时与不定式连用，表示预期将发生的事；“将要”既保留前瞻意味，也符合现代汉语表达。
- source_word: ἀκούειν
  choice: 听见
  rationale: 在“战争”和“战争的消息”这一宾语结构中，指听闻相关信息；“听见”自然简洁。
- source_word: πολέμους
  choice: 战争
  rationale: πόλεμος通常指战争，而非单次战役；此处按复数语境理解为多处或多次战争。
- source_word: ἀκοὰς πολέμων
  choice: 战争的消息
  rationale: ἀκοή可指所听见的消息、报道或传闻；“消息”范围较广，不预设真假，保留原文的词义空间。
- source_word: ὁρᾶτε
  choice: 你们要当心
  rationale: ὁρᾶτε在此引出警戒或劝告；“要当心”与后面的否定命令衔接自然。
- source_word: μὴ θροεῖσθε
  choice: 不要惊慌
  rationale: θροέομαι表示受到扰乱、惊恐或陷入慌乱；“不要惊慌”准确且符合现代汉语。
- source_word: δεῖ γὰρ γενέσθαι
  choice: 因为这些事必定会发生
  rationale: δεῖ表达必然或必要，γενέσθαι意为发生；希腊文未明说主语，汉语补出承接上文的“这些事”，使句意清楚而不限定具体事件之外的含义。
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: 但终局还没有到
  rationale: τέλος在此指末后的终点或结局；“终局”保留末世语境的广度，“还没有到”是自然汉语表达。
theological_decisions:
- issue: τὸ τέλος的末世含义
  choice: 终局
  alternative: 末日；终结
  rationale: “终局”保留希腊文所指的最终结局，却不把它限定为某一种千禧年、灾难期或末世时间表。
- issue: δεῖ所表达的必然性
  choice: 必定会发生
  alternative: 必须发生
  rationale: “必定会发生”传达神学语境中的必要性与确定性，但不额外说明其原因或施行者，从而保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“战争的消息”避免传统“风声”可能造成的古雅或含混；“不要惊慌”直接清楚。脚注标记置于全节末尾，明确对应本节的词汇异译。
