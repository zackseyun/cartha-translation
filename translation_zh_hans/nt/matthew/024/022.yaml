  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: zh_hans
  text: 若那些日子没有被缩短，就没有一个人能够存活；但为了蒙拣选的人，那些日子将被缩短。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被缩短”也可译作“被截短”。希腊文同一动词在前半句为过去时、后半句为将来时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: 被缩短了 / 将被缩短
  rationale: κολοβόω表示使某物缩短或截短；这里指那些日子的时段受到缩减。“被缩短”自然、清楚，也保留了两个被动语态和前后时态的差别。
- source_word: οὐκ ἂν ἐσώθη
  choice: 都不能得救
  rationale: 该结构表达与事实相反的结果。σῴζω既可指拯救，也可指保全性命；“得救”保留其较宽的语义范围，而注释说明本段语境也可理解为活下来。
- source_word: πᾶσα σάρξ
  choice: 凡有血肉的
  rationale: πᾶσα σάρξ直译为“所有血肉”，在否定句中意为没有任何有血肉的人。“凡有血肉的……都不能”既保留圣经惯用语，也符合现代汉语表达。
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: 但为了蒙拣选的人
  rationale: διά加宾格在这里表示缘故或受益关系；“为了”准确传达“为……的缘故”。“蒙拣选的人”保留ἐκλεκτοί的称谓，不进一步界定其群体范围。
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: 那些日子
  rationale: 直接保留指示语的指向，表达自然。
- source_word: καὶ εἰ μὴ
  choice: 若不是
  rationale: 自然呈现希腊文明确的否定条件结构；句首καί在本节承接上文，中文无需机械译出“并且”。
theological_decisions:
- issue: 末世论讲论中“蒙拣选的人”的所指
  choice: 保留“蒙拣选的人”，不作解释性扩展
  alternative: 上帝所拣选的子民／信徒／忠信的余民
  rationale: 本节称这群人为ἐκλεκτοί，却没有在此明确界定其完整范围；不将其限定为某一特定群体，可避免替经文解决神学争议。
- issue: σῴζω在本节中的含义
  choice: 正文译作“得救”，并以脚注提示“保住性命／活下来”的语境义
  alternative: 活下来／保住性命
  rationale: 灾难语境明显涉及生命得以保存，但σῴζω的意义不必被缩窄为单纯的生存；正文和脚注共同保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“凡有血肉的”略带圣经语体，以保留原文惯用表达；其余措辞尽量自然。条件句用“若不是”，避免过度古雅；两个“被缩短”保持原文的重复和被动表达。
