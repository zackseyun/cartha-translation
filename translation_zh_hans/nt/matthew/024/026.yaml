id: MAT.24.26
reference: Matthew 24:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: zh_hans
  text: 所以，如果有人对你们说：‘看，他在旷野里’，不要出去；‘看，他在内室里’，不要相信。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以，如果
  rationale: οὖν承接上文的警告，表示推论；ἐὰν引出条件情形。“所以，如果”在现代汉语中自然地保留两者。
- source_word: εἴπωσιν ὑμῖν
  choice: 有人对你们说
  rationale: 希腊语第三人称复数在这里具有不定所指的用法；汉语用“有人”比直译为“他们”更自然，又不指定某一群体。
- source_word: Ἰδοὺ
  choice: 看
  rationale: ἰδού用于唤起注意。“看”简洁、现代，并保留现场指示的语气。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野里
  rationale: ἔρημος可指旷野或荒漠；“旷野”既符合马太福音中的常见语境，也避免限定为沙质沙漠。
- source_word: ἐστίν
  choice: 他在
  rationale: 原文省略主语，语境中指被宣称出现的那一位。汉语需补出“他”，但不在正文中额外加入“基督”或“耶稣”。
- source_word: μὴ ἐξέλθητε
  choice: 不要出去
  rationale: μή加不定过去时虚拟语气构成禁令；“不要出去”直接保留ἐξέρχομαι所表达的向外移动。
- source_word: ἐν τοῖς ταμείοις
  choice: 在内室里
  rationale: ταμεῖον可指内室、储藏室或隐秘房间。此处“内室”自然地表达屋内较深、较私密的空间，同时不把“储藏”或“秘密”的含义说得过死。
- source_word: μὴ πιστεύσητε
  choice: 不要相信
  rationale: πιστεύω在此指相信所传的消息。汉语中“不要相信”可自然省略宾语，并让所指保持为前述宣称，而非特指说话的人。
theological_decisions:
- issue: ἐστίν所省略的主语
  choice: 译作“他在”，不增加身份称号
  alternative: “基督在那里”或“他在那里”
  rationale: 上下文表明这是关于基督或人子所在之处的虚假传言，但本句希腊文没有明说称号。补“他”满足汉语表达需要，同时避免把上下文解释直接写入正文。
- issue: 两个地点宣称之间的关系
  choice: 用分号并列，不添加“或者”
  alternative: 在第二个宣称前加“或者”
  rationale: 原文在同一个条件结构中并列两个平行情形，却没有明示选择连词。分号既清楚呈现平行关系，也不补入原文没有的逻辑标记。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旷野”“内室”保留圣经语境所需的凝练感；整体句法依照原文的两个平行警告，以冒号、分号清楚组织。
