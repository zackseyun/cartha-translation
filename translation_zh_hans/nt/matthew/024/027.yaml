  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: zh_hans
  text: 因为闪电从东方发出，直到西方都能看见；人子的来临[a]也会如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临在”。希腊语παρουσία可指“临在”或“到来”；这里按语境指人子将来的来临。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……怎样
  rationale: “因为”保留γάρ的解释作用，“怎样……也怎样”自然呈现ὥσπερ与οὕτως构成的比较结构。
- source_word: ἡ ἀστραπή
  choice: 闪电
  rationale: 准确表达该名词通常所指的自然现象，也符合本句比喻。
- source_word: ἐξέρχεται
  choice: 发出
  rationale: 原词有“出来、发出”之意；用于闪电时，“发出”既自然，又保留其从一处出现并展开的动态。
- source_word: ἀπὸ ἀνατολῶν
  choice: 从东方
  rationale: 在与“西方”的方向对举中，ἀνατολαί清楚指东方。
- source_word: φαίνεται ἕως δυσμῶν
  choice: 直到西方都看得见
  rationale: “看得见”保留φαίνεται的可见性，“直到西方”表达ἕως所标明的范围，突出公开而广远的景象。
- source_word: οὕτως ἔσται
  choice: 也会怎样
  rationale: 与前面的“怎样”呼应，保留比较结构，并以“会”表达将来时态。
- source_word: παρουσία
  choice: 来临
  rationale: 在本段末世语境中指人子未来的来到；“来临”清楚表达事件性，同时以脚注保留“同在”这一可能词义。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是该称号在中文圣经传统中清楚、简洁的对应，也保留其与《但以理书》7章的互文联系。
theological_decisions:
- issue: 末世言论中παρουσία的译法
  choice: 来临
  alternative: 同在
  rationale: 本句把闪电公开、明显的出现与人子未来的παρουσία相比，因此正文采用具有事件意味的“来临”。不过，该词本身也可表示“同在”，故以脚注保留这一词义，不将其神学张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎样……也会怎样”保持原文鲜明的比喻结构；“直到西方都看得见”避免把φαίνεται过度解释为“照亮”，并突出其公开可见性。
