  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: zh_hans
  text: 同样，你们看见这一切的时候，要知道：近了，就在门口了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他近了。”希腊文没有明确说出主语。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同样，你们
  rationale: οὕτως承接前面的无花果树比喻，表示“照样／同样”；καὶ ὑμεῖς把门徒列为相应的观察者。此译简洁地保留比较关系。
- source_word: ὅταν ἴδητε
  choice: 看见……的时候
  rationale: ὅταν与不定过去时虚拟语气在此指向将来发生的情形，现代汉语自然译作“……的时候”，不必译成带反复意味的“每当”。
- source_word: πάντα ταῦτα
  choice: 这一切
  rationale: 概括中性复数“所有这些事”，现代汉语用“这一切”自然、准确，也不额外限定为某类事件。
- source_word: γινώσκετε
  choice: 就要知道
  rationale: 保留现在时命令语气的劝告／指示力量；“就要知道”在条件语境中比单独的“知道”更自然。
- source_word: ἐγγύς ἐστιν
  choice: 已经近了
  rationale: 希腊文没有明说主语。汉语可省略主语，因此无需添加“他”或“这事”，从而比必须补出代词的语言更直接地保留原文歧义。“已经”表达当前临近的状态，不表示事情已经实现。
- source_word: ἐπὶ θύραις
  choice: 就在门口
  rationale: 这是表示极其临近的惯用语。希腊文虽用复数θύραις，汉语惯用单数式“门口”；若硬译“门口处／众门前”反而不自然且可能误导。
theological_decisions:
- issue: ἐγγύς ἐστιν的隐含主语
  choice: 正文省略主语：“已经近了”
  alternative: “他已经近了”或“这事已经近了”
  rationale: 原文没有明确主语，可能指人子，也可能指相关事件、终局或国度。现代汉语允许无主句，因此正文不替原文作神学判定，并以脚注说明另一种可能理解。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“就在门口”保留原文形象及极度临近之意；正文无主句自然地保存希腊文的指称歧义。
