  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: zh_hans
  text: 两个女人正在用手磨磨粮[a]；一个被带走，另一个被留下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“正在磨”的分词为阴性复数，因此这里明确指两个女人。原文的“手磨”也可指磨石或磨具；此处的日常劳作场景很可能是家用手磨。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“一个被带走，另一个被留下”；本句本身没有说明被带走是得救还是受审判。
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: 两个女人正在……推磨
  rationale: ἀλήθουσαι是阴性复数的现在主动分词，虽无明示名词，却明确指两名女性；“正在推磨”自然表达分词所描绘的同时进行场景。
- source_word: ἐν τῷ μύλῳ
  choice: 在磨坊推磨
  rationale: μύλος可指磨、磨石或磨具；“磨坊”保留场所或设施层面的宽度，“推磨”则清楚表达当时的劳作，又不限定具体磨具构造。
- source_word: μία παραλαμβάνεται
  choice: 一个被带走
  rationale: παραλαμβάνεται是现在时被动语态；“被带走”简洁自然，并不在译文中预先判定这是蒙拯救还是受审判。
- source_word: καὶ μία ἀφίεται
  choice: 另一个被留下
  rationale: ἀφίεται是现在时被动语态；“被留下”直接对应其基本意义。“另一个”在现代汉语中自然呈现两者之间的对照，而不增强原文的褒贬色彩。
theological_decisions:
- issue: 是否明示分词所含的女性主语
  choice: 译作“两个女人”
  alternative: 译作“两个人”或“两个推磨的”
  rationale: ἀλήθουσαι的阴性复数形态明确限定主语为女性，译文应体现这一语法信息。
- issue: 是否解释“被带走”和“被留下”的末世论意义
  choice: 保留中性的“被带走／被留下”
  alternative: 明确译为一人被接去得救、另一人留下受审判，或作相反解释
  rationale: 本句只陈述两人被分开，并未在句内明确说明哪一种处境代表拯救或审判；译文因此保留原有的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“正在……推磨”使场景清晰；“被带走／被留下”保持简洁对称，并避免加入原文未明说的末世论判断。
