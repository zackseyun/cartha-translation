  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that slave will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: zh_hans
  text: 那个奴隶的主人会在他没有料到的日子、在他不知道的时辰来到。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”或译“主”。希腊语κύριος既可指“主”，也可指“主人”；这里指比喻中奴隶的主人。
    reason: lexical_alternative
  - marker: b
    text: “奴隶”或译“仆人”。希腊语δοῦλος指处于受支配服役关系的人；这里主人与奴隶的身份关系较为突出。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: 会……来到
  rationale: ἥκω的将来时表示到来；“会……来到”自然表达未来，并保留主人意外归来的语境。
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: 那个奴隶的主人
  rationale: 属格结构直指前文所说那个奴隶的主人；在比喻的家庭权属关系中，κύριος译为“主人”比“主”更清楚，ἐκείνου译为“那个”。
- source_word: δούλου
  choice: 奴隶
  rationale: δοῦλος指处于隶属服役关系的人；本段主人与奴隶的身份关系十分鲜明，因此保留“奴隶”的社会含义。
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: 在他没有料到的日子
  rationale: 保留“日子”的时间意象和不确定性；“没有料到”自然传达προσδοκάω所表示的期待、预料。
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: 在他不知道的时辰
  rationale: “时辰”保留ὥρα与前面“日子”的平行结构，“不知道”直接对应γινώσκω。
theological_decisions:
- issue: 比喻中的κύριος是否作为神圣称号处理
  choice: 主人
  alternative: 主
  rationale: 本句直接描写奴隶与其人间主人的关系；“主人”保留比喻场景，不把该词在句法层面直接处理为基督论称号，同时不否认整个比喻的末世指向。
- issue: δοῦλος的身份用语
  choice: 奴隶
  alternative: 仆人
  rationale: 主人—奴隶的权属结构在上下文中突出；“奴隶”比“仆人”更充分呈现δοῦλος所含的受支配身份。
translation_notes:
  register: 采用庄重而自然的现代汉语。“日子—时辰”保留原文的平行结构；两个“他”依照上下文均指那个奴隶。脚注标记[a][b]均已置于正文。
