  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: zh_hans
  text: 但如果那个恶仆心里说：“我的主人耽延了，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 但如果
  rationale: ἐὰν与虚拟语气构成条件句，δέ带有轻微转折或承接意味；“但如果”自然保留两者。
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: 那个恶仆
  rationale: κακός在这里指道德上的恶；δοῦλος在家宅比喻中指受主人支配并承担职责的人，“仆”简洁而庄重；ἐκεῖνος译作“那个”，保留指示意味。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心里
  rationale: 这是表示内心思想或自言自语的惯用表达；“心里说”既保留“心”的意象，也符合现代汉语。
- source_word: Χρονίζει
  choice: 迟迟不来
  rationale: 动词表示耽延、迟延；在等候主人归来的语境中，“迟迟不来”自然传达主人延后归来的意思，同时不把原因说死。
- source_word: μου ὁ κύριος
  choice: 我的主人
  rationale: κύριος在当前家宅比喻层面指仆人的主人；“主人”清楚表达双方关系，并保留μου的所属意义。
theological_decisions:
- issue: 家宅比喻中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 眼前叙事层面是仆人与其家宅主人的关系，因此译作“主人”最符合语境；同时不否认整段比喻可能具有更深的指涉。
- issue: δοῦλος的译法
  choice: 仆
  alternative: 奴隶
  rationale: 本节着重其受托身份与行为，“仆”在现代汉语中更自然；原词所含的从属、受支配地位仍由“主人—仆”的关系体现。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“恶仆”凝练并符合比喻警告的语气；引语延续至下一节，因此以逗号收束。
