  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: zh_hans
  text: 至于那日和那时[a]，没有人知道；连天上的天使和子也不知道，只有父知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本省略“子也不知道”。正文采用SBLGNT的读法。
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: περί加属格引出话题，δέ表示承接中略带转折的话题转换；“至于”在现代汉语中自然地保留这一功能。
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: 那日子和时刻
  rationale: ἐκείνης统摄并列短语，指特定的末后时间；“那日子和时刻”既保留“日子”与“时刻”的并列，也符合现代汉语表达。
- source_word: οὐδεὶς οἶδεν
  choice: 没有人知道
  rationale: οὐδείς表示全称否定，οἶδα在此具有现在时意义；译文直接清楚。
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: 天上的天使不知道
  rationale: οὐδέ把天使纳入否定范围并带递进意味；汉语借重复“知道”清楚呈现递进关系，τῶν οὐρανῶν自然译作“天上的”。
- source_word: οὐδὲ ὁ υἱός
  choice: 子也不知道
  rationale: 保留原文明确的否定陈述及其与前项的递进并列；ὁ υἱός在语境中是公认称号，译作“子”。
- source_word: εἰ μὴ
  choice: 唯有
  rationale: 在否定陈述之后表示排除性例外；结合μόνος译为“唯有”，自然表达“除……以外无人”的意思。
- source_word: ὁ πατὴρ μόνος
  choice: 唯有父知道
  rationale: μόνος将知情者严格限定为父；汉语补出谓语“知道”，使句意完整清晰，同时保留排他性。
theological_decisions:
- issue: “子也不知道”所带来的基督论张力
  choice: 在正文中完整保留“子也不知道”，不作弱化或解释性扩写。
  alternative: 因抄本差异省略此语，或用释义方式缓和它与子之神性的表面张力。
  rationale: SBLGNT正文含οὐδὲ ὁ υἱός。翻译应忠实呈现经文所作的陈述，保留其神学张力，而不在译文中代为调和。
- issue: 父是唯一知道者的排他性
  choice: 译作“唯有父知道”。
  alternative: 译作较弱的“父知道”，不明确表达μόνος的限定作用。
  rationale: μόνος明确表示只有父知道；“唯有”准确保留这一排他限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于”自然引出话题；后半句重复“知道”，使层层递进的否定和最终的排他性例外在汉语中清晰有力。
