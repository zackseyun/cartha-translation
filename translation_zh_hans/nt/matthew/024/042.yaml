id: MAT.24.42
reference: Matthew 24:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: zh_hans
  text: 所以，你们要警醒[a]，因为你们不知道你们的主哪一天[b]来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要守望”或“要保持警觉”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在哪一天”。
    reason: lexical_alternative
  - marker: c
    text: 或译“会来”或“将要来”。希腊文使用现在时形式。
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 现在时主动命令语气复数要求听众持续保持警觉。“警醒”既保留醒着、守望的意象，也符合现代汉语中劝诫性的庄重表达。
- source_word: οὖν
  choice: 所以
  rationale: 表明本句是根据上文所得出的结论；“所以”在现代汉语中自然、清楚。
- source_word: ὅτι
  choice: 因为
  rationale: 引出必须警醒的理由，直接对应原文的因果关系。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 直接表达否定的认知动词，不添加“确切”等原文没有的限定。
- source_word: ποίᾳ ἡμέρᾳ
  choice: 哪一天
  rationale: 原文与格短语表示时间。“哪一天”是自然的现代汉语，并保留具体日期未知这一重点。
- source_word: ὁ κύριος ὑμῶν
  choice: 你们的主
  rationale: 自然表达定冠词名词与第二人称复数属格代词的关系，并保留κύριος作为新约称号和权威称谓的含义。
- source_word: ἔρχεται
  choice: 来
  rationale: 汉语动词本身不强制标明时态；在“哪一天来”中既能自然指向将来的来临，也不必把希腊文现在时形式明确改写成单纯将来时，从而保留原文的生动性与张力。
theological_decisions:
- issue: ἔρχεται现在时形式的末世论含义
  choice: 译作不带显式时态标记的“来”
  alternative: 译作“会来”或“将要来”
  rationale: 上下文明确指向将来的来临，但希腊文采用现在时形式。汉语“来”在此语境中可以自然指将来，同时避免额外规定来临时间的迫近程度，保留原文的紧迫感和时态张力。
translation_notes:
  register: 采用现代、自然而庄重的劝诫语体。“警醒”适合圣经语境，同时普通读者也容易理解；句法简洁，保留原文的因果关系、未知日期和来临时态的开放性。
