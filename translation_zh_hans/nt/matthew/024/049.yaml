  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow slaves[a], and eats and drinks with drunkards[b],
translation:
  language: zh_hans
  text: 就开始殴打与他一同作奴仆的人[a]，又与那些醉酒的人[b]一起吃喝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同伴仆人”。原文直译为“同作奴仆的人”，强调他们同属一位主人。
    reason: alternative_reading
  - marker: b
    text: 或译“醉鬼”。原文的分词可指以醉酒为特征的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: 开始殴打
  rationale: ἄρξηται与不定式τύπτειν构成“开始做某事”的表达；“殴打”自然传达持续或反复施暴的语境力量。
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: 和他一同作奴仆的人
  rationale: σύνδουλος指同属一位主人的奴仆；此译保留共同受主人支配的身份，也比生硬的“同奴”更符合现代汉语。
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: 又……一起吃喝
  rationale: 两个现在时虚拟式描写其行为；“吃喝”简洁保留原文动词组合。δέ在此为轻度承接，译作“又”。
- source_word: μετὰ τῶν μεθυόντων
  choice: 跟那些醉酒的人一起
  rationale: 现在分词可指正在或惯常醉酒的人；正文采用自然、不过度标签化的表达，并以脚注保留“醉鬼”的可能译法。
theological_decisions:
- issue: σύνδουλος中δοῦλος成分的社会身份
  choice: 和他一同作奴仆的人
  alternative: 他的同伴仆人
  rationale: 比喻中的主人—奴仆关系具有实质意义；译文保留从属身份和他们同属一主的重点，同时避免把“奴仆”误解为该恶仆所拥有的人。
- issue: μεθυόντων所指行为的性质
  choice: 那些醉酒的人
  alternative: 醉鬼
  rationale: 原文分词既可描写醉酒行为，也可指以醉酒为特征的人；正文不将其固定为身份标签，脚注注明较凝练的另一译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“和他一同作奴仆的人”虽稍长，却能准确表达共同归属同一主人的关系；保留经文作为长句片段的句末逗号，以衔接下一节。
