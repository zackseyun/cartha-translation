  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: zh_hans
  text: 主人来到时，看见那仆人正这样做，那仆人就有福了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: 有福了
  rationale: 表达蒙福、处于可称羡境况的意思，保留本段宣告性的语气。
- source_word: δοῦλος
  choice: 仆人
  rationale: 在主仆关系的语境中自然准确；此处不必用现代政治社会语境色彩较强的“奴隶”。
- source_word: κύριος
  choice: 主人
  rationale: αὐτοῦ表明这是该仆人的主人；中文以“主人”最自然地呈现此处的主仆关系，同时不排除比喻中更深的基督论指向。
- source_word: ἐλθών ... εὑρήσει
  choice: 来到时，看见
  rationale: 将希腊语分词与将来时主句自然重组，清楚表达主人将来抵达并发现仆人行为的情景。
- source_word: οὕτως ποιοῦντα
  choice: 正这样做
  rationale: οὕτως回指前文所述忠心按时分粮的行为；“正”体现主人到来时仆人持续如此行。
theological_decisions:
- issue: κύριος在比喻层面的称谓
  choice: 主人
  alternative: 主
  rationale: 直接叙事层面是仆人与其主人的关系，“主人”在现代汉语中清楚自然；比喻所指并未因此被限定或消解。
- issue: μακάριος的福分性质
  choice: 有福了
  alternative: 是幸福的／值得称羡
  rationale: 采用圣经汉语中通行而庄重的祝福宣告，不额外说明福分来自奖赏、救恩或末世地位，以保留经文本身的开放性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。调整语序，使条件情景先行、福分宣告落在句末，符合中文表达习惯，并保留原文的强调重点。
