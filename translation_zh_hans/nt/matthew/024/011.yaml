  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: zh_hans
  text: 并且将有许多假先知兴起，迷惑许多人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欺骗许多人。”
    reason: lexical_alternative
  - marker: b
    text: “兴起”或译：“被兴起。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多
  rationale: 这是自然、准确的数量表达，也保留原文未加限定的广泛含义。
- source_word: ψευδοπροφῆται
  choice: 假先知
  rationale: 准确表达冒充或虚假的先知，也是现代中文圣经语境中清楚而庄重的惯用说法。
- source_word: ἐγερθήσονται
  choice: 将……兴起
  rationale: 在此语境中表示这类人物将出现或起来活动；“兴起”自然地传达其事件性，同时避免误解为复活。
- source_word: πλανήσουσιν
  choice: 迷惑
  rationale: 可涵盖使人走迷、误导和欺骗，保留原词在教义、道德及属灵层面上的宽泛含义。
- source_word: πολλούς
  choice: 许多人
  rationale: 补出“人”使中文宾语清楚自然，同时忠实表达原文的广泛数量。
- source_word: καὶ ... καὶ
  choice: 并且……，……
  rationale: 用中文自然的并列结构连接两项将来的行动，保留原文警告的累加推进。
theological_decisions:
- issue: πλανήσουσιν所指迷惑的性质
  choice: 译为宽泛的“迷惑”，不限定其具体方式或范围。
  alternative: 明确译成教义上的欺骗，或限定为道德、末世方面的误导。
  rationale: 原文动词可涵盖教义、道德和属灵层面的误导；译文不应把警告缩窄到某一神学类别。
- issue: ἐγερθήσονται的被动形式
  choice: 正文按语境译为“兴起”，另以脚注保留“被兴起”的形式可能。
  alternative: 正文直译为“被兴起”。
  rationale: “兴起”更符合现代汉语对人物出现并展开活动的表达，也不暗示复活；脚注则保留希腊语被动形式可能带出的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“假先知”“兴起”“迷惑”保留经文语感，但不过分古雅；正文中的[a][b]与脚注标记完全对应。
