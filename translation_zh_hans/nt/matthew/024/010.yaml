id: MAT.24.10
reference: Matthew 24:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: zh_hans
  text: 那时，许多人会跌倒[a]，会彼此出卖[b]，也会彼此憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“会离弃信仰”、“会被绊倒”或“会感到被冒犯”。
    reason: lexical_alternative
  - marker: b
    text: 或译作“会彼此交出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示事件在前述患难与迫害中接续发生；“那时”自然地承接上下文。
- source_word: σκανδαλισθήσονται
  choice: 会离弃信仰
  rationale: 此处的被动形式在末世迫害语境中指人在压力下跌倒、背离；这一译法表达其严重性，但以脚注保留“跌倒”和“因而反感”的词义可能。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 形容词作名词使用，指数量众多的人；“许多人”是现代汉语中直接自然的表达。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互施加行动的互惠意义，并适合本句重复使用。
- source_word: παραδώσουσιν
  choice: 出卖
  rationale: 该词本义为“交出、交给”，但在迫害和彼此敌对的语境中带有背叛并把人交出去的意味；“出卖”兼顾此语用力量与现代可读性。
- source_word: μισήσουσιν
  choice: 仇恨
  rationale: 直接表达主动而强烈的敌意。
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: 那时……，……，……。
  rationale: 汉语以并列分句和重复“彼此”保留原文逐步加剧的节奏；省去机械重复的“并且”，使表达自然而庄重。
theological_decisions:
- issue: 末世迫害语境中 σκανδαλισθήσονται 的含义
  choice: 会离弃信仰
  alternative: 会跌倒；会因而反感
  rationale: 上下文呈现从内在动摇到彼此出卖、仇恨的恶化过程。“离弃信仰”传达背离的严重程度，却不进一步界定其是否永久或涉及某一特定的救恩论立场；脚注保留原词较宽的语义范围。
- issue: παραδώσουσιν 是泛指背叛还是实际交出
  choice: 彼此出卖
  alternative: 彼此交出
  rationale: “出卖”符合人际背叛和迫害的语境，同时脚注保留较字面的“交出”，不排除把人交给当权者处置的具体含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离弃信仰—彼此出卖—彼此仇恨”形成清楚的递进；两处脚注分别保留 σκανδαλίζω 和 παραδίδωμι 的真实词义幅度。
