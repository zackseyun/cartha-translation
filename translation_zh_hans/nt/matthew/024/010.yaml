revisions:
- from: 那时，许多人会离弃信仰[a]，彼此出卖[b]，彼此仇恨。
  to: 那时，许多人会跌倒[a]，会彼此出卖[b]，也会彼此憎恨。
  rationale: 修订以“会跌倒”作为σκανδαλισθήσονται的较开放正文译法，避免把上下文所支持但原文未明说的“信仰”写入正文；脚注仍完整保留“离弃信仰”这一在本段语境中重要的解释性译法，以及被动和受冒犯的替代含义。调整末项谓语及连接词，使中文自然，同时保留原文递进的三项将来陈述和互指关系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:07:14Z'
review_pass:
  verdict: revise
  source_fidelity: “离弃信仰”符合本段受迫害而背离的语境，但原文σκανδαλισθήσονται并未明说“信仰”，且该被动动词仍可指被绊倒或感到冒犯。为避免把语境推断写死在正文中，宜以“会跌倒”为正文，并在脚注保留较强的“离弃信仰”解释。其余三个将来时及两次互指关系均应明确保留。
  naturalness: “那时，许多人会跌倒，会彼此出卖，也会彼此憎恨”是自然、庄重的现代普通话；重复“会”清楚呈现原文连续的将来行动。“彼此憎恨”比“彼此仇恨”更适合作谓语。
  terminology: “跌倒”保留圣经汉语中与σκανδαλίζω相应的宽泛用法；脚注以“离弃信仰”说明此处很可能的语境含义，而不将其作为原文明确说出的宾语。“出卖”恰当表达παραδίδωμι在此敌对语境中的背叛意味；“交出”作为脚注中的较字面替代译法可予保留。
  issues:
  - severity: medium
    issue: 正文“会离弃信仰”增添了原文未明说的宾语，并收窄σκανδαλισθήσονται的语义。
    rationale: 虽然上下文支持在逼迫中背离的理解，原文动词本身也可表示“被绊倒”或“感到被冒犯”。正文应保留这种必要的语义开放性。
  - severity: low
    issue: 脚注“会因而反感”不自然，且未准确表达“take offense”的意思。
    rationale: “因而”缺少明确所指；“会感到被冒犯”更自然地表达该词可指的受冒犯含义。
  - severity: low
    issue: “彼此仇恨”略偏名词化。
    rationale: “彼此憎恨”在此作将来行为的谓语更顺畅，并直接对应μισήσουσιν。
