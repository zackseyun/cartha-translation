  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: zh_hans
  text: 那时，将有两个人在田里；一个被带走[a]，一个被留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被带在身边”。这个动词本身并未说明被带走是为得救还是为受审判。
    reason: 词义可能有不同理解，且需要保留原文在末世论意义上的开放性。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间副词，承接前面的末世语境；“那时”自然简洁，也保留时间上的衔接。
- source_word: δύο ἔσονται
  choice: 两个人
  rationale: 希腊文直译为“两个将会在”，而后续 εἷς…εἷς 为阳性形式，且下一节以女性作平行例子；译为“两个人”既符合现代汉语表达，也不额外使用更强的“两个男人”。
- source_word: ἐν τῷ ἀγρῷ
  choice: 在田里
  rationale: 直接表达地点，符合现代汉语习惯，不增添原文没有的描写。
- source_word: παραλαμβάνεται
  choice: 被带走
  rationale: 被动形式置于将来场景的生动叙述中。“被带走”在汉语中自然，同时不自行判定这是蒙拯救还是受审判；脚注说明其词义张力。
- source_word: ἀφίεται
  choice: 被留下
  rationale: 在此处表示一人相对于另一人被留下；避免使用带有特定末世论联想的术语，也不强化为“被抛弃”。
theological_decisions:
- issue: παραλαμβάνεται 所指的是蒙拯救还是受审判
  choice: 正文采用中性的“被带走”，不判定其结果
  alternative: 译成表示“被接去得救”或“被带去受审判”的措辞
  rationale: 动词本身在此并未明确说明被带走是为得救还是为受审判；上下文容许讨论，翻译应保留这种神学张力。
- issue: 是否明确两人为男性
  choice: 译为中性的“两个人”，同时不掩盖后续阳性形式所指的个体
  alternative: 译为“两个男人”或只译“两人”
  rationale: δύο 本身只表示“两个”，εἷς…εἷς 虽为阳性，但现代汉语“一个”不标语法性别；“两个人”自然且不过度指定生理性别，下一节的女性平行场景仍清楚可见。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那时”承接上文；以逗号和句号呈现原句的鲜明对照。避免使用可能预先锁定特定末世论体系的表达。
