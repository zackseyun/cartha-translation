  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: zh_hans
  text: 因为正如在洪水以前的日子里，人们吃喝、结婚、把人许配出去[a]，直到挪亚进入方舟的那一天，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把人许配出去”也可译为“被许配”。希腊文在“结婚”和这里所用的词之间有所区别；后者可指把人许配出去，也可能指被许配。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: 因为，正如
  rationale: “因为”保留γάρ承接上文的解释作用，“正如”保留ὡς所引出的比较；本节的比较到下一节才完整，因此保留未完句式。
- source_word: ἦσαν … τρώγοντες καὶ πίνοντες
  choice: 人们一直吃喝
  rationale: ἦσαν与分词构成迂说式，描写持续进行的日常活动；“一直”表达持续性，“人们”按上下文补出隐含的主体。
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: 洪水以前的那些日子
  rationale: 自然表达时间范围，并以“洪水”清楚连接挪亚叙事；“那些”对应重复冠词所限定的特定日子。
- source_word: τρώγοντες καὶ πίνοντες
  choice: 吃喝
  rationale: 中性地表达日常活动，不擅自加入放纵、宴乐或醉酒等道德判断。
- source_word: γαμοῦντες
  choice: 结婚
  rationale: 直接表达γαμέω的常用义，同时避免将其不必要地限定为男性“娶妻”。
- source_word: γαμίζοντες
  choice: 为人操办婚事
  rationale: 与“结婚”保持词义区别，并表达使他人进入婚姻或把人许配出去的主动含义；脚注保留其可能涉及“被嫁娶”的理解。
- source_word: ἄχρι ἧς ἡμέρας
  choice: 直到……的那一天
  rationale: 自然准确地标明前述持续活动的时间终点。
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: 挪亚进入方舟
  rationale: “进入”对应εἰσῆλθεν的决定性动作；“方舟”是挪亚叙事中κιβωτός的通行、明确译法。
theological_decisions:
- issue: 所列活动应否译成带有罪恶放纵意味的行为
  choice: 用中性措辞描写吃喝与婚姻活动
  alternative: 使用暗示纵欲、宴乐或道德麻木的措辞
  rationale: 希腊文分词本身只陈述普通生活活动，并无明确的贬义修饰。上下文的重点是审判临到前生活仍在持续，不宜由译文额外判定这些活动本身有罪。
- issue: 是否把γαμοῦντες与γαμίζοντες合并为泛指“嫁娶”
  choice: 分别译作“结婚、为人操办婚事”
  alternative: 合并译作“嫁娶”或都译作“结婚”
  rationale: 分别翻译可保留原文使用两个不同动词所形成的词义张力，同时不把婚姻行为局限于某一性别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。本节在希腊文中是跨节比较句的一部分，因此以逗号收尾，保留与下一节的句法连接。
