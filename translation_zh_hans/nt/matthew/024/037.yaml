  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: zh_hans
  text: 挪亚的日子怎样，人子的来临也要怎样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临在”。希腊语这个词可指“临在”或“到来”；这里指人子将来的来临。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: 怎样……也会怎样
  rationale: 保留希腊文前后呼应的比较结构，同时符合现代汉语表达。
- source_word: γὰρ
  choice: 不单独译出
  rationale: γὰρ承接上文并作解释；本节独立成句时，直译“因为”会显得悬空，汉语可由上下文自然体现其解释关系。
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: 挪亚的日子
  rationale: 保留原文的时代性说法，不添加原文省略的谓语；后半句的“也会怎样”使比较关系清楚。
- source_word: Νῶε
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἔσται
  choice: 会怎样
  rationale: 在相关比较句式中表达εἰμί将来时的“将是如此”，既保留未来指向，也避免生硬直译为“将会是”。
- source_word: παρουσία
  choice: 来临
  rationale: 此处指人子未来的到来；“来临”自然庄重，并兼具到达事件及临在开始的意味。其可译作“临在”的词义在脚注中保留。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用中文中已经确立的称号，保留其与《但以理书》背景及耶稣自称的互文和神学分量。
theological_decisions:
- issue: 末世语境中παρουσία的译法
  choice: 来临
  alternative: 临在
  rationale: 语境所指是人子未来的到来，“来临”最能自然表达事件性；但παρουσία也可表示“临在”，故以脚注保留词义张力，不把语义范围缩窄而不作说明。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“挪亚的日子怎样……也会怎样”保留原文的省略和比较力度；正文脚注标记与脚注完全对应。
