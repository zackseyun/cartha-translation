  rationale: 修订“冒我的名”为“打着我的名号”，以较完整且自然地表达原文所指借耶稣名号或身份而来的情形；将称号译为“弥赛亚”，并在脚注保留“基督”的传统对应词。其余句法、因果连接、将来意义和迷惑他人的主动含义均予保留。
