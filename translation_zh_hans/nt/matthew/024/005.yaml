  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: zh_hans
  text: 因为将有许多人打着我的名号而来，说：‘我就是弥赛亚[a]’，并且会迷惑许多人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”意为“受膏者”；希腊原文为ὁ χριστός，传统上也常译作“基督”。
    reason: 说明此处称号的词义及“基督”这一传统常见译法。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 保留数量形容词的通常含义，在现代汉语中自然明确。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节的警告，保留原文的解释性连接。
- source_word: ἐλεύσονται
  choice: 将……而来
  rationale: 准确表达将来时的‘来’，并与汉语句式自然结合。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 冒我的名
  rationale: 在此语境中指借用耶稣的名义或身份而来；比单纯的‘奉我的名’更能避免误解为受耶稣差遣，同时仍保留名义与身份层面的含义。
- source_word: λέγοντες
  choice: 说
  rationale: 直接引出冒名者所宣称的内容，不额外加入‘声称’所带的判断色彩。
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: 我就是基督
  rationale: 将带冠词的 χριστός 作为称号处理；‘就是’自然体现 ἐγώ 的强调。
- source_word: πλανήσουσιν
  choice: 会使……受迷惑
  rationale: 表达使人陷入错误、被引离正道的使役含义，也符合现代汉语经文语体。
- source_word: πολλοὺς
  choice: 许多人
  rationale: 明确补出汉语所需的中心语‘人’，自然表达原文宾语。
theological_decisions:
- issue: 虚假弥赛亚宣称中 Χριστός 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: χριστός 是希腊语称号，‘基督’是中文圣经传统中直接而广为人知的对应词；脚注说明其含义为‘弥赛亚’，既维持正文庄重自然，也显明这里是称号而非名字。
- issue: ἐπὶ τῷ ὀνόματί μου 所表示的身份或授权关系
  choice: 冒我的名
  alternative: 奉我的名
  rationale: 后文表明这些人虚假宣称自己是基督，因此‘冒我的名’更清楚地表达借耶稣名义或身份而来；同时不把他们误呈现为真正受耶稣授权。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留 γὰρ 的因果衔接，并用‘受迷惑’呈现 πλανάω 所包含的欺骗和偏离正道之意。
