    issue: “冒我的名”对ἐπὶ τῷ ὀνόματί μου的表达偏窄
    rationale: 该短语指以耶稣的名号或身份为依据而来；“冒我的名”可被理解为假冒姓名本身。“打着我的名号而来”更充分保留原文的身份／名义范围，同时上下文仍清楚显示其虚假性。
  - severity: medium
    issue: 正文“基督”未充分显明此处为假冒者自称的弥赛亚称号
    rationale: ὁ χριστός带定冠词，指“那位受膏者／弥赛亚”。译作“弥赛亚”能在现代汉语中清晰表达称号意义，并与项目既定的英文术语决定一致。
  revised_text: 因为将有许多人打着我的名号而来，说：‘我就是弥赛亚[a]’，并且会迷惑许多人。
