  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: zh_hans
  text: 因为那时必有大患难[a]，这是从世界开始直到如今未曾有过、将来也绝不会再有的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大患难”也可译作“大苦难”或“大困苦”。希腊语可指严重的困境、压力或压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: 因为那时
  rationale: γάρ承接上文并说明原因，τότε标明时间；“因为那时”自然保留二者的功能。
- source_word: ἔσται
  choice: 必有
  rationale: 以汉语存在句表达将来发生；“必”也符合语境中的确定语气，但不承担末句强烈否定的全部力度。
- source_word: θλῖψις μεγάλη
  choice: 大患难
  rationale: θλῖψις可指严重的困苦、压迫或灾难；“大患难”既保留本段末世语境中的分量，也不预先限定其具体性质。
- source_word: οἵα
  choice: 这样的患难
  rationale: 将定性比较关系明确表达出来，指前述患难在程度上空前绝后。
- source_word: οὐ γέγονεν
  choice: 未曾有过
  rationale: 自然表达完成时所涵盖的、截至当前从未发生或存在过的状态，不强行只取“发生”或“存在”其中一义。
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: 从世界的开始直到如今
  rationale: κόσμος按字面译为“世界”，不扩展为原文未明说的“创造”；整个短语保留时间范围。
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: 将来也绝不会再有
  rationale: οὐ μή加虚拟式构成强烈的将来否定；“绝不会”传达强调，“再有”承接前面的比较，避免不自然的重复。
theological_decisions:
- issue: θλῖψις在末世语境中的译法
  choice: 大患难
  alternative: 大苦难／大灾难／大困苦
  rationale: “大患难”在现代中文中可懂，也保留该词的严重性及其经文互文色彩，同时不加入某一宗派对事件性质、时序或对象的特定解释。
- issue: 空前绝后的比较是否限定为单一事件
  choice: 保留“未曾有过……绝不会再有”的开放表述
  alternative: 明确译成“从未发生过这样的事件，以后也不会发生”
  rationale: γίνομαι在此可自然理解为发生或出现；译文不额外界定患难是一个技术性命名事件，保留原文的概括性与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大患难”沿用普通读者熟悉的圣经用语，脚注补充其较宽的词义范围；句式力求清楚呈现从世界之初、直到如今、并延伸至未来的强烈比较。
