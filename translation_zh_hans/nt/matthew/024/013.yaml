  text: But the one who endures to the end will be saved[a][b].
translation:
  language: zh_hans
  text: 但忍耐到底的人，必得救[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“忍耐到最后的人。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“必蒙解救。”希腊语既可指从危险中获救，也可指得着救恩；本译文保留较宽广的含义，因为上下文并未要求将其限定为其中一种。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文多人跌倒、彼此陷害与爱心冷淡的警告，表达温和而清楚的转折。
- source_word: ὁ ... ὑπομείνας
  choice: 坚持……的人
  rationale: 带冠词的简过去时分词在此作名词性用法，泛指在患难中持续坚忍的人；用“……的人”自然表达，不限定性别。
- source_word: ὑπομείνας (ὑπομένω)
  choice: 坚持
  rationale: 该词指在压力或患难下仍然坚忍、不退缩。“坚持”通俗自然，并保留持续承受考验的含义。
- source_word: εἰς τέλος
  choice: 到底
  rationale: 表示持续达到终点。“到底”是现代汉语中简洁自然的表达，也保留“直到终结”的可能理解。
- source_word: οὗτος
  choice: 由“……的人”承接，不另译为“这人”
  rationale: 原文以指示代词强调并回指前面的分词短语；汉语用“……的人，必然……”即可自然承载这一回指与强调，若硬译“这人”会显得生硬。
- source_word: σωθήσεται
  choice: 必然得救
  rationale: 未来被动式可指获救、蒙拯救或得救；“得救”保留其较宽广的末世与神学含义。“必然”自然表达未来陈述的确定性，并非把语法上的被动施事者具体化。
theological_decisions:
- issue: 末世忍耐语境中“σωθήσεται”的范围
  choice: 译为“必然得救”，不具体限定为今世脱险或最终救恩
  alternative: “必蒙解救”或“最终必得救”
  rationale: 原句没有明确界定这里是指从患难中获救、末后的救恩，还是兼含二者；正文保留这种神学张力，不加入特定宗派对坚忍与救恩关系的解释。
- issue: 坚持与得救之间关系的表述
  choice: 保持原文条件式陈述，不补入功德、因果机制或救恩次序
  alternative: 解释为坚持赚取救恩，或解释为坚持仅是已得救的外在证据
  rationale: 原文宣告坚持到底的人将得救，却未在本节说明两者关系的完整神学机制，因此不应在翻译中替作者作出裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚持到底”是自然常用的表达；“必然得救”保留应许的确定语气，同时避免生硬复现希腊语的回指结构。所有脚注标记均已置于正文。
