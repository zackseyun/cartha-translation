  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: zh_hans
  text: 所以，你们也要预备好，因为人子会在你们料想不到的时候来到。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为人子会在你们想不到的时刻来到。”希腊语动词可表示“想”“认为”或在此语境中引申为“料想、预料”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 该短语回指前文，并引出由此得出的劝诫；“所以”在现代汉语中自然、明确地保留其因果推论关系。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: καί与明说的代词ὑμεῖς共同带出包含和强调意味；“你们也”简洁地保留这一重点。
- source_word: γίνεσθε ἕτοιμοι
  choice: 要准备好
  rationale: 现在时命令语气要求听众处于预备好的状态；“要准备好”既自然，又传达命令语气，不把它过度限定为单次的‘开始准备’。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出必须准备好的原因，译作“因为”最清楚。
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: 在……的时候，你们想不到
  rationale: 该结构直指一个听众并未想到或料到的时刻；“想不到”保留δοκεῖτε的‘想、认为’这一基本义，也自然包含语境中的‘未曾预料’。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: “人子”是该称号在中文圣经传统中准确、简洁且广为人知的对应语，保留其闪语背景、但以理书共鸣及基督论含义。
- source_word: ἔρχεται
  choice: 到来
  rationale: 希腊文现在时在此具有将来指向和鲜明感；嵌入“在人子到来的时候”可自然表达事件临到，同时避免生硬的汉语进行体。
theological_decisions:
- issue: 如何翻译基督论称号ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  alternative: 那位属人的／人类之子
  rationale: “人子”贴近原文形式，并保留福音书中这一称号的既定表达、但以理书背景及未被完全解释的神学张力；解释性改写会缩窄其含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以”顺接前文警告；“要准备好”具有直接劝诫力。主文用“想不到”较贴近δοκέω的基本义，脚注列出语境中更明确的“料想不到”。
