  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: zh_hans
  text: 你们要从无花果树学习这个比喻[a]：它的枝条变得柔嫩，叶子长出来[b]，你们就知道夏天[c]近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比喻”也可译作“教导”或“例子”。
    reason: lexical_alternative
  - marker: b
    text: “长出来”也可译作“萌发出叶子”或“抽出新叶”。
    reason: lexical_alternative
  - marker: c
    text: 原文词θέρος通常指“夏天”，在某些语境中也可涉及收获的季节；这里无花果树的季节性图景较适合译作“夏天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: 从无花果树
  rationale: Ἀπό加属格表示学习所取材或所依据的来源。汉语用“从无花果树”自然地保留这一关系；δέ仅有轻微承接作用，不另加“现在”等时间词。
- source_word: μάθετε
  choice: 要……学
  rationale: 这是μανθάνω的第二人称复数不定过去时命令式，译为直接的吩咐“要……学”，而不把它改成只强调结果的“明白”。
- source_word: τὴν παραβολήν
  choice: 这个比喻
  rationale: παραβολή指借比较来说明事理的比喻或例证。“比喻”保留福音书中的常用术语，后文则给出其具体内容。
- source_word: ὅταν ἤδη
  choice: 一……
  rationale: ὅταν引出一般性的时间条件，ἤδη突出征兆已经开始出现。汉语“一……就……”简洁地表达征兆一出现便可作出判断。
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: 它的枝条一变嫩
  rationale: γένηται表示状态发生变化，ἁπαλός描写新生枝条柔嫩。“变嫩”既准确又符合现代汉语的植物描写。
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: 长出叶子
  rationale: ἐκφύῃ指萌发、长出；“长出叶子”是自然、清楚的现代汉语表达。
- source_word: γινώσκετε
  choice: 你们就知道
  rationale: 这是第二人称复数现在时直陈式，在一般性情形中表示观察后所得的认识，故译作“你们就知道”，不按命令式处理。
- source_word: ἐγγὺς τὸ θέρος
  choice: 夏天近了
  rationale: θέρος在无花果树发叶的季节图景中主要指“夏天”；ἐγγύς表示临近。“夏天近了”符合现代汉语习惯。
theological_decisions:
- issue: 无花果树意象的含义
  choice: 按季节征兆的比喻来翻译，不在正文中指定无花果树另有所指。
  alternative: 把无花果树明确解释为象征以色列，或明确断定它只是一种普通自然例子。
  rationale: 本节希腊文本本身强调由可见征兆知道某事临近，却没有在本节明说无花果树所象征的对象。译文保留意象及其可能的末世论张力，不把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一……就……”使条件与判断之间的关系清楚；“枝条变嫩”“长出叶子”保持具体的植物生长图景。脚注标记均紧随其所说明的词语。
