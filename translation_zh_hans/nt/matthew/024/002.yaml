  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们没有看见这一切吗？我实在告诉你们，这里绝不会有一块石头留在另一块石头上而不被拆毁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被推倒”。这个希腊语动词可指拆除或毁坏建筑；“被拆毁”表达建筑遭彻底毁坏的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答……说
  rationale: 这是带有闪语色彩的希腊语常用表达；“回答……说”既保留两个动词的形式，也符合现代汉语叙事习惯。
- source_word: Οὐ βλέπετε
  choice: 你们没有看见……吗
  rationale: οὐ引导的问句期待肯定回答；此译保留反问语气，也兼顾实际观看与意识到眼前景象的含义。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 自然表达中性复数短语，按上下文指前面提到的圣殿建筑。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: “实在”清楚传达ἀμήν在耶稣郑重宣告公式中的确认与强调作用。
- source_word: οὐ μὴ ἀφεθῇ
  choice: 绝不会有……留在
  rationale: 用“绝不会”表达οὐ μή加虚拟语气所构成的强烈否定，并使预言的确定语气在汉语中清楚可闻。
- source_word: ὧδε
  choice: 这里
  rationale: 直接保留地点副词，指当时眼前的圣殿区域。
- source_word: λίθος ἐπὶ λίθον
  choice: 一块石头留在另一块石头上
  rationale: 既保留原文“石头在石头上”的具体建筑图像，也用“一块……另一块……”形成自然清楚的现代汉语。
- source_word: καταλυθήσεται
  choice: 被拆下来
  rationale: καταλύω在此指建筑遭拆除；“拆下来”既表达拆毁，也突出石头从原位被移开的具体图像。
theological_decisions:
- issue: 耶稣关于圣殿的预言所指范围与力度
  choice: 按具体建筑图像表达圣殿将遭彻底拆除的预言，不附加本节未明说的末世论框架。
  alternative: 将此话主要理解为象征性的审判宣告，或明确纳入某一种后世末世论体系。
  rationale: 原文以石头是否留在另一块石头上来描述建筑被拆除，措辞具体；译文应保留这一力度，同时不替经文解决其未明确说明的历史或末世论关联。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“回答……说”和“我实在告诉你们”保留经文叙述及郑重宣告的风格；句末结构稍具原文张力，但在现代汉语中仍清楚可懂。
