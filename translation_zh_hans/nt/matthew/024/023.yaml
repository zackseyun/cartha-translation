  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: zh_hans
  text: 那时，如果有人对你们说：“看，弥赛亚在这里！”或说：“在这里！”你们不要相信这种说法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示时间承接，将本句的警告与前文的末世论述联系起来；“那时”在现代汉语中自然、庄重。
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: 如果有人对你们说
  rationale: 保留条件结构和不定主体；“有人”准确传达 τις，并保留 ὑμῖν 的复数对象。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引人注意的指示语，“看”简洁自然，也保留原文要求听者注意的语气。
- source_word: ὧδε
  choice: 在这里／在那里
  rationale: ὧδε 本义为“这里”。首处直译为“在这里”；第二处因汉语直接引语中的指示视角及与首句的并列关系，译作“在那里”，表达说话者指向另一处地点的自然语气。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处带冠词，并处于辨认受膏者身份与所在之处的语境中，明显作为称号使用；“弥赛亚”比名称化的“基督”更清楚地保留称号功能。
- source_word: ἤ· Ὧδε
  choice: 或说：“在那里！”
  rationale: 原文为省略表达，仅重复地点副词。汉语可保留这种简短、突兀的指认，同时补出“说”以使并列结构清楚；不额外补入原文没有明说的主语。
- source_word: μὴ πιστεύσητε
  choice: 你们不要相信
  rationale: μή 加不定过去时虚拟语气构成禁止语。汉语无需强行补出宾语，语境自然表明不可相信的是上述宣称。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督／那位基督
  rationale: 本节谈论人们声称所期待的受膏者在某处，标题意义突出。采用“弥赛亚”可避免把 Χριστός 默认为专名，同时不加入特定宗派解释。
- issue: 第二个 Ὧδε 的省略结构
  choice: 在那里！
  alternative: 他在那里！／这里！
  rationale: 原文没有明说主语或谓语，故不补“他”，以保存省略和一定程度的含混；按中文直接引语的指示习惯译为“在那里”，与前一处所宣称的位置形成自然的另一次指认。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“弥赛亚”保留称号性质；末句不补“这话”或“他们”，避免把原文所否定的相信对象限定得过窄。
