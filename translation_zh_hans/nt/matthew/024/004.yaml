base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们要当心，不要让任何人把你们引入歧途。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欺骗你们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: 回答他们说
  rationale: 这是受闪语表达影响的希腊语叙事结构。译作“回答他们说”既保留回应和发言两层意思，又符合现代汉语的自然表达。
- source_word: Βλέπετε
  choice: 你们要当心
  rationale: 这里的现在时命令语气表示持续警觉、防备；“要当心”比直译“要看”更准确地传达该习语在上下文中的警戒含义。
- source_word: μή τις
  choice: 不要让任何人
  rationale: μή加虚拟语气承接命令，表达防止某事发生；这一译法自然地体现“务必不让任何人……”的意思。
- source_word: πλανήσῃ
  choice: 把你们引入歧途
  rationale: πλανάω兼有使人走偏、误导和欺骗之意。“引入歧途”保留路径意象，也没有把警告缩窄为单纯的认知欺骗。
theological_decisions:
- issue: πλανήσῃ所指警告的性质
  choice: 把你们引入歧途
  alternative: 欺骗你们
  rationale: 本节在末世言论的语境中警告门徒提防错误引导。“引入歧途”同时容纳受骗和偏离正道的含义，不把经文限定为仅仅相信了错误信息。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你们要当心”清楚传达复数命令的警戒语气；正文保留“引入歧途”的宽广语义，并以脚注列出“欺骗你们”这一重要词义选项。
