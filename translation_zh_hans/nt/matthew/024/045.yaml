id: MAT.24.45
reference: Matthew 24:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: zh_hans
  text: 那么，谁是那个忠心又明智的奴仆[a]，主人[b]派他管理家中众人，为要按时给他们食物呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος可按语境指奴隶或仆人；此处“奴仆”较能保留此人处于主人权下的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“主”。此处是在家庭管理的比喻中，因此正文译作“主人”。
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: 那么，谁
  rationale: τίς引出疑问，ἄρα承接上文并表示推论；“那么，谁”自然保留这种承接和追问的语气。
- source_word: πιστὸς
  choice: 忠心
  rationale: 此处指受托者忠于职责、可靠可信；“忠心”既符合管家职责的语境，也保留道德层面的意味。
- source_word: δοῦλος
  choice: 奴仆
  rationale: δοῦλος指处于主人权下的人。“奴仆”比单说“仆人”更能保留其受支配的身份，同时在现代中文中仍适合比喻语境；脚注列出较弱的译法。
- source_word: φρόνιμος
  choice: 明智
  rationale: φρόνιμος强调实际判断力和审慎行事；“明智”比单纯表示智力的“聪明”更贴合受托管理的语境。
- source_word: κατέστησεν
  choice: 派他管理
  rationale: καθίστημι在此表示把人安置在负责的位置上；“派他管理”自然表达任命和所授责任。
- source_word: κύριος
  choice: 主人
  rationale: 本节采用家庭和奴仆的比喻，“主人”直接表达双方的社会关系；“主”作为可能译法收入脚注。
- source_word: οἰκετείας
  choice: 家中众人
  rationale: οἰκετεία指一家之内的人员或家属群体，尤其包含家中的仆役；“家中众人”与后面的复数代词“他们”衔接清楚，也避免把范围不必要地限定为家仆。
- source_word: τοῦ δοῦναι
  choice: 为要……给
  rationale: 带冠词的不定式在此表达目的；“为要……给”明确保留主人任命奴仆的目的。
- source_word: τροφὴν
  choice: 食物
  rationale: τροφή泛指食物或养料；语境可能涉及定量供应，但原文没有明确说“口粮”，故采用较宽泛的“食物”。
- source_word: ἐν καιρῷ
  choice: 按时
  rationale: καιρός在此指合宜、指定的时间；“按时”简洁表达在适当时候供应食物。
theological_decisions:
- issue: 家庭比喻中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 眼前语境着重主人任命奴仆管理家中众人的家庭图景，因此正文用“主人”，不在比喻表层直接强化为称号。更广的上下文仍可让读者理解其所指，脚注则保留“主”这一可能译法。
- issue: δοῦλος所表达的身份强度
  choice: 奴仆
  alternative: 仆人
  rationale: “奴仆”保留此人处于主人权下、受主人差遣的较强含义，又不额外引入特定制度细节；脚注保留现代中文中较常见而语义较弱的“仆人”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留全句的反问形式，并用“为要”明确原文不定式所表达的目的关系；不把比喻的指向直接写入正文。
