  to: 那时，人子的兆头要在天上显现[a]；那时，地上的各族[b]都要哀哭。他们将看见人子带着能力和大荣耀，乘着天上的云而来[c]。
  rationale: 修订不改变段落的释义取向或神学张力。“人子的兆头”保留原文属格的歧义；γῆ仍在正文译为普世性的“地上”，并在脚注保留“那地”的可能。修改“万族”为“各族”以贴近φυλαί，修改云的表达以提升中文自然度，并将[c]移到实际受注释的短语之后。
