source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: zh_hans
  text: 那时，人子的兆头要在天上显现[a]；那时，地上的各族[b]都要哀哭。他们将看见人子带着能力和大荣耀，乘着天上的云而来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”也可译作“天空”。希腊语οὐρανός按语境可指天上或天空。
    reason: lexical_alternative
  - marker: b
    text: “地上的各族”也可译作“那地的各族”。希腊语γῆ可指全地，也可指特定的土地。
    reason: alternative_reading
  - marker: c
    text: “乘着天上的云而来”呼应《但以理书》7:13。
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: 要……显现
  rationale: 按此处不及物意义翻译，表达兆头变得可见；“显现”也保留启示文学的庄重语气。
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子的兆头
  rationale: 保留属格结构的歧义，不断定这是属于人子的兆头，还是人子自己作为兆头。
- source_word: ἐν τῷ οὐρανῷ
  choice: 在天上
  rationale: οὐρανός既可指“天上”，也可指“天空”；正文采用较符合末世语境的“天上”，脚注保留另一可能。
- source_word: κόψονται
  choice: 要哀哭
  rationale: κόπτω的中间语态在此指因悲痛而哀悼；“哀哭”自然清楚，又不把具体的捶胸动作强加于正文。
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: 地上的万族
  rationale: φυλαί译作“族”，既能表达各支族群，也较符合中文启示文学语体；γῆ正文取普世性的“地上”，脚注注明也可理解为“那地”。
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 驾着天上的云
  rationale: 以自然庄重的中文表达在云上而来的图景，同时保留与《但以理书》7:13的呼应。
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: 带着能力和大荣耀
  rationale: 依照希腊语结构，让“大”直接修饰“荣耀”，不把它同时移用于“能力”。
theological_decisions:
- issue: “人子的兆头”的所指
  choice: 保留“人子的兆头”这一属格表达
  alternative: 明确译成“属于人子的兆头”或“人子自己这个兆头”
  rationale: 希腊语没有排除这些理解中的某一种，因此正文不替读者解决这一末世论争议。
- issue: γῆ的范围
  choice: 正文译作“地上”
  alternative: 译作“那地”，指特定地区或以色列地
  rationale: 上下文具有宇宙性和启示文学色彩，较支持普世范围；但原词也可指特定土地，所以在脚注中保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人子”“兆头”“荣耀”等沿用读者熟悉的圣经核心用语；句法略作中文化调整，把“带着能力和大荣耀”前置，使“驾着天上的云而来”成为清晰自然的收束。所有脚注标记均置于对应正文处。
