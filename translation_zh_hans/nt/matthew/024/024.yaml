id: MAT.24.24
reference: Matthew 24:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: zh_hans
  text: 因为假弥赛亚[a]和假先知将要兴起，施行大神迹和奇事，以致若有可能[c]，连蒙拣选的人也会被迷惑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“假基督”。希腊语使用称号 Christos；这里译作“弥赛亚”，因为此处更像称号，而不是专名。
    reason: alternative_reading
  - marker: b
    text: 或译“被引入歧途”。这个动词可以指使人偏离正路，因而也有“迷惑”的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译“倘若这是可能的”。希腊原文只说“若有可能”，没有明说其中的神学含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: 将要兴起
  rationale: 这里是指这些人出现并开始活动；“兴起”自然保留了原文的被动形式所具有的惯用意义，又不会使人误以为是在说复活。
- source_word: ψευδόχριστοι
  choice: 假弥赛亚
  rationale: Χριστός在这里是称号，指受膏的拯救者；译作“弥赛亚”能清楚表达其称号性质，ψευδο-则直译为“假”。
- source_word: ψευδοπροφῆται
  choice: 假先知
  rationale: 这是该复合词直接、通行且符合上下文的译法。
- source_word: δώσουσιν
  choice: 施行
  rationale: δίδωμι本义为“给”，但与“神迹和奇事”搭配时，现代汉语自然说“施行”。
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: 大神迹和奇事
  rationale: 保留“神迹和奇事”这一对称表达；σημεῖα不简化为泛称的“奇迹”，以保留其作为记号或征兆的意味。
- source_word: ὥστε πλανῆσαι
  choice: 以致……被迷惑
  rationale: ὥστε加不定式可以表达预期或自然结果；“以致”在汉语中顺畅地呈现结果趋向，同时不必把它严格限定为主观目的。
- source_word: εἰ δυνατὸν
  choice: 若有可能
  rationale: 直接保留原文简洁的条件说法，不擅自加强为反事实语气。
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: 连蒙拣选的人也
  rationale: καί在此有递进意味，译为“连……也”；“蒙拣选的人”既准确又比单独使用术语“选民”更便于普通读者理解。
theological_decisions:
- issue: ψευδόχριστοι中Χριστός作为称号的译法
  choice: 假弥赛亚
  alternative: 假基督
  rationale: 此处谈论冒充受膏拯救者的人，Χριστός明显具有称号性质；“弥赛亚”能保留其犹太背景，也避免将称号误读为专名。
- issue: εἰ δυνατὸν对蒙拣选之人的神学含义
  choice: 若有可能
  alternative: 倘若这是可能的
  rationale: 原文只提出简洁的条件，并未明说这件事事实上是否可能；译文不替原文解决有关蒙拣选之人能否最终受迷惑的神学争议。
- issue: ὥστε πλανῆσαι所表达的是目的还是结果
  choice: 以致……被迷惑
  alternative: 为要迷惑
  rationale: 原结构可涉及预期结果或自然结果。“以致”较少把经文限定为纯粹的主观目的，同时仍表达神迹奇事导向迷惑的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大神迹和奇事”保留原文的成对表达；“蒙拣选的人”兼顾经文语体与普通读者的可理解性。脚注标记紧随各自所解释的词语或短语。
