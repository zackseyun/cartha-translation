  naturalness: 建议改为“他们毫不知情，直到洪水来到，把他们全都冲走”，这是现代汉语中更自然、清晰的叙述方式，也避免“察觉”缺少明确宾语所带来的轻微悬置。
  terminology: “洪水”“人子”“来临”均准确、庄重且符合既有经文用语。“冲走”恰当地传达洪水语境下的ἦρεν，未将其过度释义为“毁灭”。
