  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: zh_hans
  text: 他们毫不知情，直到洪水来到，把他们全都冲走；人子的来临也将是这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: 仍然没有察觉
  rationale: 这里不是泛指缺乏知识，而是说他们直到灾难临到仍未认识到所处的情势；“察觉”在现代汉语中自然，也保留其未警醒之意。
- source_word: ὁ κατακλυσμός
  choice: 洪水
  rationale: 指挪亚时代的大洪水；正文语境已经明确，无须另加限定。
- source_word: ἦρεν ἅπαντας
  choice: 把他们全都冲走
  rationale: αἴρω可表示带走、除去；在洪水语境中译作“冲走”既贴合意象，也不额外明说其最终命运。
- source_word: ἡ παρουσία
  choice: 来临
  rationale: παρουσία可指到来、临在；此处指人子将来的到来。“来临”庄重自然，并避免加入正文没有明说的术语色彩。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留这一固定称号及其经文互文，不释义为其他基督论称谓。
theological_decisions:
- issue: 人子来临与洪水事件之间类比的范围
  choice: 译作“也将是这样”
  alternative: 译作“人子来临时也会这样”
  rationale: 保留οὕτως与καί表达的类比，同时不擅自限定相似之处究竟侧重突然性、世人的不察觉，还是审判的结果。
- issue: 洪水“带走”众人的含义
  choice: 译作“冲走”而不补充“毁灭”或“杀死”
  alternative: 译作“把他们全都除灭”
  rationale: 原文ἦρεν本身较宽，洪水语境自然暗示灾难性结局；不在译文中把隐含意义解释得更窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“直到……仍然……”清楚呈现ἕως所标示的时间界限；分号保留前后类比关系。无须脚注。
