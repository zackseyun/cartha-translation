  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: zh_hans
  text: 天地都要过去，但我的话绝不会过去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝不会”原文采用强调否定的表达方式。
    reason: 说明原文οὐ μή所表达的强烈否定语气。
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天地
  rationale: 这是表示受造秩序的固定宇宙性搭配；“天地”是现代汉语中自然、庄重且范围准确的表达。
- source_word: παρελεύσεται
  choice: 都要过去
  rationale: 这里指现今受造秩序将会消逝。“过去”保留原词意象，不额外说明其消逝的具体方式；“都”顺应汉语集合主语的表达。
- source_word: δὲ
  choice: 但
  rationale: 明确传达天地会过去与耶稣的话绝不会过去之间的强烈对比。
- source_word: οἱ λόγοι μου
  choice: 我的话
  rationale: 指耶稣所说的话、宣告和教导；“我的话”直接、自然，并保留其广泛指向。
- source_word: οὐ μὴ παρέλθωσιν
  choice: 绝不会过去
  rationale: οὐ μή与虚拟语气构成强烈否定；“绝不会”在现代汉语中自然地表达其强调语气。
theological_decisions:
- issue: 耶稣关于自己话语恒久性的宣告力度
  choice: 以“绝不会过去”直译其强调否定，与天地的消逝形成鲜明对照。
  alternative: 译作“永远不会废去”，更突出话语的持续有效性。
  rationale: 原文强调耶稣的话断不会消逝，但没有在本节中进一步解释其教义含义；译文保留这一分量，同时避免加入“权威”“应验”或“废去”等原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“天地”凝练自然；“过去”与前后两处同一希腊动词相对应；“绝不会”清楚传达强调否定。
