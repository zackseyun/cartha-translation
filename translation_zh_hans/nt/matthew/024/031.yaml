  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: zh_hans
  text: 他要差遣他的天使，伴着洪亮的号声[a]；他们要把他所拣选的人[b]从四方的风中[c]、从诸天的一端到另一端[d]聚集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伴着宏大的号角”，或“伴着号角吹响的声音”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的选民”。
    reason: lexical_alternative
  - marker: c
    text: “四方的风”是表示各个方向、远至四极的惯用说法。
    reason: cultural_note
  - marker: d
    text: 直译：“从诸天的尽头直到它们的尽头”；意思是从一个极端到另一个极端。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: 要差遣
  rationale: 未来时主动直陈语气。“差遣”既表达派出，也保留受命执行任务的意味，在现代汉语中庄重而自然。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 在此末世性语境中，所指是超自然的使者，而非普通的人间信使。
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: 伴着洪亮的号声
  rationale: μετά加属格表示伴随；σάλπιγξ指号角，μεγάλης在这里可描述宏大或响亮。汉语用“洪亮的号声”自然表达听觉意象，同时在脚注保留“大号角”等可能译法。
- source_word: ἐπισυνάξουσιν
  choice: 聚集起来
  rationale: 未来时主动复数，主语是天使。“聚集起来”体现前缀所带的汇拢意味，又符合现代汉语表达。
- source_word: ἐκλεκτούς
  choice: 所拣选的人
  rationale: 直接表达“被选择的人”，避免单用带有较强体系神学色彩的术语，同时不削弱原文的拣选含义。
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: 从四方的风
  rationale: 保留原文“四风”的具体意象；此表达指向各个方向和最远之处，其惯用含义在脚注说明。
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: 从诸天的一端到另一端
  rationale: 以自然汉语表达从一个极端到另一个极端的总括结构，并以“诸天”反映οὐρανῶν的复数形式。
theological_decisions:
- issue: 末世语境中ἐκλεκτούς的译法
  choice: 他所拣选的人
  alternative: 他的选民
  rationale: 原文说明这些人是属于他并被拣选的，却没有在本节展开一套系统神学框架。“所拣选的人”保留词义，又避免由传统术语预先限定其神学含义。
- issue: 聚集范围的意象
  choice: 从四方的风、从诸天的一端到另一端
  alternative: 从世界的四面八方
  rationale: 主文保留原文的风与诸天所构成的宇宙性意象，不把它缩减为单纯的地理释义；脚注再说明其惯用含义。
- issue: 号角短语所指
  choice: 伴着洪亮的号声
  alternative: 带着大号角
  rationale: 原文可强调号角宏大、声音响亮，或以号角代指号声。主文采用符合汉语习惯的听觉表达，但通过脚注保留词组的其他理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“差遣”“拣选”“诸天”保留经文语域，但句法按现代汉语调整。主文保留“四方的风”和“诸天”的宇宙性图景，并用脚注解释其惯用含义及可替代译法。
