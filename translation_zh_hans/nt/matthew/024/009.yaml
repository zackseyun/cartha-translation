  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: zh_hans
  text: 那时，人要把你们交给患难，并且杀害你们；你们要因我的名[a]被万国[b]憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因我的名”原文直译为“因为我的名”；这里的“名”也指耶稣本人以及归属于他。
    reason: 说明“名”的代表性含义，同时保留正文的原文表达。
  - marker: b
    text: “万国”也可译作“各国”；在别的语境中，原词也可指“外邦人”。
    reason: 交代ἔθνη的词义范围及本节较自然的理解。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 表示话语中事件的时间推进；“那时”自然、庄重，也可承接上下文所述情形。
- source_word: παραδώσουσιν ὑμᾶς
  choice: 人要把你们交给
  rationale: παραδίδωμι指把人交出、置于他人权势之下；不特指“出卖”，故避免加入原文未明说的背叛含义。希腊文主语隐含于第三人称复数动词，汉语用泛指的“人”表达。
- source_word: εἰς θλῖψιν
  choice: 给患难
  rationale: θλῖψις可指苦难、压迫或灾难；“患难”既符合本节受迫害的语境，也保留本章末世话语中的较重意味。与“交给”组合为“交给患难”，虽带圣经文体色彩，却保留原文意象及其语义张力。
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: 并且杀害你们
  rationale: 直译未来主动语态；“杀害”比“处死”少加司法程序之意，也比“谋杀”少加法律或道德定性。
- source_word: ἔσεσθε μισούμενοι
  choice: 你们还要……被……憎恨
  rationale: 准确表达将来被动意义；“还要”自然承接前述遭遇，但不改变逻辑关系。
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: 被万国的人
  rationale: ἔθνη在此更自然地指列国、万国，而非狭义的外邦人；加“的人”使现代汉语明确表达施事者。
- source_word: διὰ τὸ ὄνομά μου
  choice: 因我的名
  rationale: διά加宾格表示原因。“我的名”保留原文的圣经概念，不将其直接释义为“信奉我”或“效忠我”。
theological_decisions:
- issue: 末世话语中θλῖψις的译法
  choice: 患难
  alternative: 苦难、迫害、灾难
  rationale: “患难”可涵盖困苦与压迫，并保留可能的末世分量；不把该词收窄为单一形式的“迫害”，也不把它技术化为某一特定末世体系中的“大灾难”。
- issue: πάντων τῶν ἐθνῶν的范围
  choice: 万国的人
  alternative: 所有外邦人、各国的人
  rationale: 此处重点较可能是敌对范围的普世性，而非犹太人与外邦人的族群对比；“万国的人”保留广泛范围，又不导入原文未必要求的族群限定。
- issue: “因我的名”的含义
  choice: 正文保留“因我的名”，脚注解释
  alternative: 因信奉我、因效忠我
  rationale: “名”代表耶稣本人及人与他的关系，但正文保留原文措辞，可避免把丰富的神学内涵压缩成单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交给患难”略带圣经文体色彩，用来保存希腊文παραδίδωμι εἰς θλῖψιν的意象与歧义；整体避免教派化的末世术语。所有脚注标记均已置于正文相关词语之后。
