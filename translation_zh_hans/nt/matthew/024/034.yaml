  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: zh_hans
  text: 我实在告诉你们，这一代人绝不会逝去，直到这一切都发生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个民族”或“这一族类”。希腊语γενεά有时可作较宽泛的理解，但这里最直接的译法是“这一代人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在“ἀμὴν λέγω ὑμῖν”这一郑重宣告公式中，“实在”自然、庄重，并保留强调其话语真实可靠的作用。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 符合现代汉语表达，也准确保留第一人称陈述和对复数听众的直接称呼。
- source_word: ὅτι
  choice: 不单独译出
  rationale: 希腊语以ὅτι引出所说的内容；现代汉语在“我告诉你们”之后通常无需另加对应词，内容从句仍然清楚。
- source_word: οὐ μὴ παρέλθῃ
  choice: 绝不会过去
  rationale: οὐ μή加虚拟式表达强烈否定；“绝不会”保留强调语气，“过去”也保留παρέρχομαι在此处可能涉及消逝或离去的表达张力。
- source_word: ἡ γενεὰ αὕτη
  choice: 这一代人
  rationale: γενεά在此最直接、通常的意义是同一世代的人；“这一代人”比单说“这一代”更自然明确，同时不替读者解决末世论上的争议。
- source_word: ἕως ἂν
  choice: 直到
  rationale: 准确表达带未来不定意味的时间界限。
- source_word: πάντα ταῦτα
  choice: 这一切
  rationale: 自然地表达中性复数所指的全部这些事，并与前文所列事件相衔接。
- source_word: γένηται
  choice: 发生
  rationale: γίνομαι在这里指诸事出现或成为事实；“发生”是现代汉语中最自然的表达。
theological_decisions:
- issue: 末世言论中“ἡ γενεὰ αὕτη”的含义
  choice: 正文译作“这一代人”，不作解释性扩展。
  alternative: “这个民族”或“这一族类”
  rationale: “这一代人”是此处最直接的词义，也保留经文本身在时间与末世论解释上的张力，不将某一特定末世框架写入正文；较宽泛的可能理解置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣郑重宣告的语气；“绝不会”体现希腊语强烈否定。脚注标记[a]已置于正文对应句末。
