  text: then those in Judea must flee to the mountains,[a]
translation:
  language: zh_hans
  text: 那时，在犹太地的人必须逃往山里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让他们逃往山里去。”
    reason: 保留第三人称复数命令式较为形式对应的汉语表达。
lexical_decisions:
- source_word: τότε
  choice: 那么
  rationale: 承接前文所说的情形，标明随后应采取的行动；“那么”在现代汉语中自然地保留了时间和顺承意味。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地区的人
  rationale: 定冠词加介词短语在此作名词性成分，指身处该地的人；这样译不额外限定其身份。
- source_word: Ἰουδαίᾳ
  choice: 犹太地区
  rationale: 指罗马时期的地理区域；加“地区”可避免现代读者误将其理解为族群名称。
- source_word: φευγέτωσαν
  choice: 要逃
  rationale: 第三人称现在时主动命令式复数；“要逃”以自然、简洁的现代汉语表达直接而紧迫的命令，同时保留“当逃”的形式对应作为脚注备选。
- source_word: ἐπὶ τὰ ὄρη
  choice: 到山里去
  rationale: ἐπί加宾格与移动动词连用，表示朝向目的地；“到山里去”自然表达进入山区避难的方向，而不弱化ὄρη的山地含义。
theological_decisions:
- issue: 末世警告中命令式的语气
  choice: 译作直接而紧迫的命令“要逃”
  alternative: 较形式对应地译作“当逃”
  rationale: 本节给出实际行动指令；译文保留命令的紧迫性，不加入对末世事件时间或性质的特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“犹太地区”明确地理所指；“到山里去”比“往诸山”自然，同时保持原文的复数山地意象。
