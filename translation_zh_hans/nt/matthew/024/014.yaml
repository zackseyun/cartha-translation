  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: zh_hans
  text: 这国度的好消息[a]要在全世界[b]传扬，作为向万国[c]的见证；然后，终局就会来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“福音”。
    reason: lexical_alternative
  - marker: b
    text: 或译“整个有人居住的世界”。
    reason: lexical_alternative
  - marker: c
    text: 或译“万民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: 要传遍
  rationale: 该词是将来时被动语态，表示公开宣告。结合后面的地域范围，用“要传遍”自然表达信息将被广泛宣扬；其中“传”保留公开传讲之意。
- source_word: εὐαγγέλιον
  choice: 好消息
  rationale: 直译其核心含义，现代读者容易理解，也避免只依赖教会术语；脚注保留传统译法“福音”。
- source_word: τῆς βασιλείας
  choice: 国度的
  rationale: 保留属格结构及“国度”这一概念，不擅自补入原文未明说的限定语，也不把它完全释义为“关于上帝掌权”。
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: 传遍全世界
  rationale: οἰκουμένη指人类居住的世界；“全世界”在现代汉语中自然，并清楚表达普世范围。脚注列出较贴近字面的译法。
- source_word: εἰς μαρτύριον
  choice: 作见证
  rationale: 保留目的或结果的开放性：这宣告成为见证，而不明确解释为有利于或不利于听众的证词。
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: 向万国
  rationale: ἔθνη在这里广指世上各国或各族，而非专指与犹太人相对的外邦人。“万国”简洁并保留圣经语境中的广度；脚注提示“万民”这一可能译法。
- source_word: ἥξει
  choice: 会来到
  rationale: 自然表达ἥκω的“来、到达”之意，并保留将来指向。
- source_word: τὸ τέλος
  choice: 终局
  rationale: 表达“终结、结局”而不加上原文未明说的末世时间体系。“终局来到”也保留原文将终结拟作临到之事的表达。
theological_decisions:
- issue: οἰκουμένη与ἔθνη在末世言论中的范围
  choice: 采用“全世界”和“万国”，保留宣告范围的普世性。
  alternative: 可译“整个有人居住的世界”和“万民”，以突出第一世纪地理语感或族群含义。
  rationale: 原文把这宣告与“终局”相连，却未说明其精确历史范围、实现方式或末世时间表。译文不把范围缩限为罗马帝国，也不将其改写成某一特定宣教或末世体系。
- issue: “国度”的所指
  choice: 译作“这国度的好消息”，保留上下文所指而不在正文补入“上帝”。
  alternative: 可释义为“关于上帝掌权的好消息”或沿用“天国的福音”。
  rationale: 上下文中的国度具有神学所指，但本节希腊文本只写“国度”。正文保持形式与含义的张力，避免加入原文未明说的词。
- issue: “见证”的作用
  choice: 只译“向万国作见证”，不说明这是为万国、给万国，还是针对万国的见证。
  alternative: 可译“给万国作证据”或“作为给万国的见证”。
  rationale: εἰς μαρτύριον可表达目的或结果，其见证究竟带来邀请、证实还是审判，原文本身没有在此明确限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好消息”比单用传统术语“福音”更透明；“万国”“终局”保持经文语体的分量，但不过度技术化。分号呈现宣告普及与终局来到之间的顺序关系。
