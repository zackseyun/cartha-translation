revisions:
- from: 然而，那些日子的患难一过，太阳就要立刻变黑，月亮也不再发光；众星要从天上坠落[a]，诸天的力量都要震动[b]。
  to: 然而，在那些日子的患难以后，立刻，太阳将要变黑，月亮也不发光；众星要从天上坠落[a]，诸天的力量要震动[b]。
  rationale: 修订以“在……以后，立刻”直接对应μετὰ……Εὐθέως，避免“一过”可能带来的完成性暗示；将“就要立刻”调整为更自然的“立刻，……将要”；删去无原文对应的“都”。其余措辞及脚注均保留，以维持原文的先知性语体、宇宙图景和解释上的开放性。
