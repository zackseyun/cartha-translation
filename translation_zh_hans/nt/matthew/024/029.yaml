  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: zh_hans
  text: 然而，在那些日子的患难以后，立刻，太阳将要变黑，月亮也不发光；众星要从天上坠落[a]，诸天的力量要震动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”也可译作“天空”。
    reason: lexical_alternative
  - marker: b
    text: “诸天的力量”可能指宇宙中的力量、天体，或属天的权能；希腊语原文在这里含义宽泛。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ μετὰ
  choice: 然而……一过……立刻
  rationale: 保留 δὲ 的轻微转折和 Εὐθέως 的强烈时间意味；用“一过……立刻”自然表达紧接发生的关系。
- source_word: τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: 那些日子的患难
  rationale: “患难”准确涵盖 θλῖψις 的苦难、困厄之意，也保留原文中“那些日子的”所属关系和末世语境的分量。
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: 太阳就要……变黑
  rationale: “变黑”是现代汉语中自然清楚的表达；“就要”承接前面的紧迫时间关系，同时保留将来意义。
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: 月亮也不再发光
  rationale: 以自然汉语表达“不发出它的光”；“也”体现并列，“不再”符合太阳变黑之后月亮不发光的语境。
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: 众星要从天上坠落
  rationale: “众星”保留复数总体意象，“坠落”比一般的“落下”更符合从天而降的庄严灾变图景；οὐρανός 的“天上／天空”歧义以脚注说明。
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: 诸天的力量
  rationale: “诸天”反映 οὐρανῶν 的复数，“力量”保持 δυνάμεις 的宽泛含义，不擅自限定为天体、宇宙力量或属天存在。
- source_word: σαλευθήσονται
  choice: 都要震动
  rationale: 准确传达将来被动式所描绘的摇撼、震动，并保持先知性语气。
theological_decisions:
- issue: 启示文学中宇宙异象的性质
  choice: 直接保留太阳变黑、月亮不发光、众星坠落和诸天力量震动的图景，不判定其仅为字面事件或仅为象征。
  alternative: 将这些表达明确解释为天文学灾变，或明确解释为政治与审判动荡的象征。
  rationale: 原文采用先知性、启示文学式的宇宙图景，本节本身没有解除字面与象征之间的张力，译文不应加入特定末世论体系。
- issue: “诸天的力量”所指
  choice: 采用范围宽泛的译法，并用脚注保留可能指宇宙力量、天体或属天权能的歧义。
  alternative: 明确译为“天体”“天使势力”或“宇宙力量”。
  rationale: 希腊语 αἱ δυνάμεις τῶν οὐρανῶν 本身没有在这些可能含义中作出明确限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难”“众星”“诸天”保持经文的先知性格调；通过较自然的句式“一过……立刻”避免生硬直译。脚注标记均放在所解释的具体短语之后。
