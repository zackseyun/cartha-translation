  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: zh_hans
  text: 在房顶[a]上的人，不要下来拿他屋里的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“房顶”指当时房屋平坦、可供人活动的屋顶。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: 在房顶上的人
  rationale: 带冠词的短语在此作名词用，指“在房顶上的人”。这样既保留单数代表性表达，也避免把所指限定为男性。
- source_word: δώματος
  choice: 房顶
  rationale: δώμα在此指房屋顶部；当时常见的是平坦且可供人活动的屋顶。“房顶”在现代汉语中自然，并保留具体的建筑场景。
- source_word: μὴ καταβάτω
  choice: 不要下来
  rationale: 准确表达第三人称命令式的禁止语气，并保留从房顶向下移动的空间含义。
- source_word: ἆραι
  choice: 拿
  rationale: 不定式在此表示下去的目的，即取走或带上物品；“拿”简洁自然，不额外限定如何处置这些物品。
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: 他屋里的东西
  rationale: 中性复数冠词所构成的省略表达指屋内的物品。“屋里的东西”保留其宽泛性，没有收窄为特定种类的财物。
- source_word: οἰκίας
  choice: 屋里
  rationale: 上下文强调从房顶下到房屋内部取物，“屋里”比偏重情感归属的“家里”更清楚地呈现具体空间。
- source_word: αὐτοῦ
  choice: 他
  rationale: 保留原文阳性单数代词及其代表性用法；现代汉语中的“他”在此可自然泛指前述那个人。
theological_decisions:
- issue: 阳性单数的代表性指称
  choice: 用“人”指主体，并在所属关系中保留单数“他”
  alternative: 用“他们”或省去代词
  rationale: 原文是阳性单数的代表性表达，并非关于性别的教义陈述。译文避免把主体明确说成“男人”，同时以“他”保留原文单数代词。
translation_notes:
  register: 采用现代、简洁而庄重的命令语气。“不要下来拿”传达逃离情境中的紧迫禁止；句式贴近原文，同时符合普通读者的现代汉语习惯。
