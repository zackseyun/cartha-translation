  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: zh_hans
  text: 所以，当你们看见那造成荒凉的可憎之物[b]，就是借先知但以理所说的，立在圣地[a]时（读者应当明白），
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一处圣洁的地方”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“那荒凉的可憎之物”“那使地荒凉的可憎之物”。此语呼应《但以理书》。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: 所以，当……时
  rationale: Ὅταν加虚拟语气指向将来的情形；“当……时”自然表达这一时间关系。οὖν译作“所以”，保留与上文的推论和过渡联系。
- source_word: ἴδητε
  choice: 你们看见
  rationale: 直接表达ὁράω的基本意义，并明确希腊语动词所含的第二人称复数。
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: 那荒凉之可憎物
  rationale: 以较凝练的名词结构保留希腊语属格表达及其与《但以理书》的互文联系，不在正文中径直判定它是“造成荒凉”还是“带来毁坏”的事物。
- source_word: τὸ ῥηθὲν
  choice: 所说的
  rationale: 自然表达这个被动分词所指的先前预言之言。
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: 借着先知但以理
  rationale: διά加属格表示媒介或代理；“借着”保留预言是经由但以理说出的意味。
- source_word: ἑστὸς
  choice: 立在
  rationale: 直接呈现ἵστημι完成时分词所表达的站立、处于某处的状态，不擅自译成“被设立”。
- source_word: ἐν τόπῳ ἁγίῳ
  choice: 在圣洁之处
  rationale: “圣洁之处”既自然又不强行加入希腊文没有明示的定指，避免正文直接限定为圣殿中的某一特定区域。
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: 读者应当领会
  rationale: 保留插入语和劝告语气；“领会”比单纯“注意”更贴近νοέω所表达的理解、思量。
theological_decisions:
- issue: τόπῳ ἁγίῳ是否特指圣殿中的“圣地”
  choice: 圣洁之处
  alternative: 圣地
  rationale: 原文没有冠词，虽很可能唤起圣殿背景，却并不单凭语法强制要求特指。正文保留较开放的表达，传统且更具特指色彩的译法列入脚注。
- issue: βδέλυγμα τῆς ἐρημώσεως中属格的关系
  choice: 那荒凉之可憎物
  alternative: 那使地荒凉的可憎之物；那带来毁坏的可憎之物
  rationale: 该短语明显呼应《但以理书》，而属格可被理解为描述荒凉、带来荒凉或造成毁坏。正文保留紧凑且未完全释义的形式，脚注列出较解释性的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荒凉之可憎物”略带经文术语色彩，用来保留原文名词结构和《但以理书》的回声；破折号标明作者对读者的插入劝告。
