  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: zh_hans
  text: 耶稣叫了众人来，对他们说：“你们要听，也要明白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 于是
  rationale: 在此承接并推进叙事；“于是”比逐字译作“并且”更符合现代汉语叙事习惯，又不增加明显的因果含义。
- source_word: προσκαλεσάμενος
  choice: 把……叫到跟前
  rationale: 该不定过去时中间语态分词表示主句动作之前或伴随发生的召唤动作；“叫到跟前”自然表达 προσκαλέομαι 的趋向意味。
- source_word: τὸν ὄχλον
  choice: 众人
  rationale: ὄχλος 指聚集的人群；“众人”在叙事中简洁自然，也保留群体所指。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 直接对应“他说给他们”，是现代汉语中自然且庄重的叙述表达。
- source_word: Ἀκούετε
  choice: 你们要听
  rationale: 复数现在时命令语气要求众人认真听；加“你们要”明确复数命令意味，同时避免仅指生理上的听见。
- source_word: συνίετε
  choice: 也要明白
  rationale: 此处指领会所听内容的意义；“明白”清楚通俗，并与“听”构成原文的并列劝令。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把众人叫到跟前”保留召集并使其靠近的画面；引语中的“你们要听，也要明白”明确两个并列的复数命令，不额外解释下文内容。
