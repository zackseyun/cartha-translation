  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: zh_hans
  text: 假冒为善的人哪！以赛亚论到你们所说的预言，确实说得恰当。他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: 假冒为善的人哪
  rationale: 复数呼格，直接而严厉地斥责受话者；“假冒为善”是现代汉语中自然且为读者熟悉的表达，也保留其道德和宗教层面的谴责意味。“哪”明确体现呼语。
- source_word: καλῶς
  choice: 说得真准
  rationale: 该副词修饰“说预言”，在此表示以赛亚的预言恰当、准确地适用于这些人；“真准”比生硬的“很好地”更符合现代汉语，并保留耶稣的强调语气。
- source_word: ἐπροφήτευσεν
  choice: 所说的预言
  rationale: 保留“说预言”的先知性含义，同时采用适合汉语定语结构的表达；时态由语境自然体现为以赛亚过去所说的话。
- source_word: περὶ ὑμῶν
  choice: 指着你们
  rationale: 表达περί加属格的“关于、论到”之意；“指着你们说预言”是自然且庄重的汉语，清楚表明预言适用于当前受责备的人。
- source_word: Ἠσαΐας
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的先知人名译法。
- source_word: λέγων
  choice: 他说：
  rationale: 作为引出后续引文的现在分词，译为独立短句“他说：”，在现代汉语中清楚自然，并保留引语导入功能。
theological_decisions:
- issue: 耶稣对法利赛人和经学教师的称呼力度
  choice: 采用直接谴责性的呼语“假冒为善的人哪”
  alternative: 较弱的“装模作样的人”或不带呼语语气的“假冒为善的人”
  rationale: ὑποκριταί在此是强烈的道德与宗教判断。弱化措辞会削减耶稣斥责的力度，也会削弱它与随后以赛亚引文之间的联系。
- issue: καλῶς对以赛亚预言的评价
  choice: 理解为预言说得准确、恰切，正适用于受话者
  alternative: 泛指以赛亚“很好地”履行了说预言的行为
  rationale: 语境重点在于以赛亚的话准确刻画了眼前这些人，而不是笼统赞美其说预言的方式；译文保留这种针对性，但不扩展为预言只关乎这些人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以感叹号体现呼格斥责的力度；将希腊语较紧凑的分词结构拆为“他说：”，便于自然引出下一节经文。
