review_pass:
  verdict: revise
  source_fidelity: “假冒为善的人哪”准确传达复数呼格ὑποκριταί的严厉斥责；“以赛亚”“你们”和“他说：”也与原文相符。但原句“以赛亚指着你们所说的预言说得真准”因定语位置而易读成“你们所说的预言”，并且“说得真准”偏口语，且重复“说”使表达不够清晰。
  naturalness: 需要修订。“以赛亚论到你们所说的预言，确实说得恰当”以“论到你们”明确修饰以赛亚的预言，语序自然，语体庄重而现代。
  terminology: 保留“假冒为善的人”“以赛亚”“预言”等通行且恰当的圣经术语。“恰当”表达καλῶς在此“正确、切合”的评价，不把其弱化为仅仅说话技巧上的“说得好”。
  issues:
  - severity: medium
    issue: “指着你们所说的预言”存在修饰关系歧义。
    rationale: 该串联表达可被理解为“你们所说的预言”，但περὶ ὑμῶν修饰的是以赛亚的说预言行为，意为以赛亚论到受话者而预言。
  - severity: low
    issue: “说得真准”语体偏口语且与“所说的预言”重复。
    rationale: 原文是καλῶς修饰ἐπροφήτευσεν；译为“确实说得恰当”更庄重、清楚，也保留预言针对受话者的切合性。
