  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: zh_hans
  text: 看哪，有一个迦南妇人从那一带出来，不住地喊着说：“主啊，大卫之子，可怜我吧！我女儿被鬼附得很厉害[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受鬼严重压制”，或“被鬼折磨得很厉害”。
    reason: 词义备选；δαιμονίζεται明确表示邪灵作用，却未必规定其具体方式或程度。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留这一引人注意的叙事标记及其鲜明语气；“看哪”在现代中文中略显庄重，但仍清楚易懂。
- source_word: Χαναναία
  choice: 迦南妇人
  rationale: 忠实保留马太所用的族群称呼及其唤起的以色列历史背景，不以马可平行经文中的“叙利腓尼基人”替代。
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: 从那一带
  rationale: ὅρια在此指地域或境内；“那一带”自然表达复数所指的区域范围，避免生硬译成“边界”。
- source_word: ἐξελθοῦσα
  choice: 出来
  rationale: 以自然的中文顺承结构表达不定过去时分词，保留她从当地出来的动作。
- source_word: ἔκραζεν
  choice: 不住地喊着
  rationale: 用“不住地”体现未完成过去时所含的持续或反复意味，并保留呼喊的强烈程度。
- source_word: Ἐλέησόν με
  choice: 可怜我吧
  rationale: 这是现代中文中自然、急切的恳求，表达求对方施怜悯之意；句末“吧”使直接命令在汉语中成为恳求。
- source_word: κύριε
  choice: 主啊
  rationale: 与“大卫之子”连用时，这称呼具有敬畏和弥赛亚语境中的分量；“主”也保留其可能超越一般礼貌称呼的含义。
- source_word: υἱὸς Δαυίδ
  choice: 大卫之子
  rationale: 直译这一具有大卫王权与弥赛亚意味的称号，并采用庄重而易懂的表达。
- source_word: κακῶς
  choice: 很厉害
  rationale: 自然地表达女儿所受状况的严重程度，避免过于临床化。
- source_word: δαιμονίζεται
  choice: 被鬼附
  rationale: 这是中文圣经语境中简洁而通行的表达，明确保留邪灵作用；脚注同时说明原词也可译为受鬼压制或折磨，以免把其具体状态规定得过细。
theological_decisions:
- issue: κύριε在弥赛亚称呼语境中的译法
  choice: 主啊
  alternative: 先生啊／主人啊
  rationale: 妇人随即称耶稣为“大卫之子”，因此κύριε很可能不只是一般礼貌称呼。“主啊”保留敬畏及潜在的弥赛亚分量，却不据此断定她已经作出完整的神学认信。
- issue: δαιμονίζεται所指邪灵作用的程度
  choice: 被鬼附
  alternative: 受鬼严重压制／被鬼折磨得很厉害
  rationale: 原文明确把女儿的苦况归于邪灵作用，但该动词未必精确界定这种控制的具体机制。正文采用通行译法，脚注保留较宽泛的可能译法，以维持原文的语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“看哪”和“大卫之子”保留经文的醒目及弥赛亚色彩；“不住地喊着”体现未完成时的持续性。脚注标记紧随“被鬼附得很厉害”，对应实际存在词义差异的短语。
