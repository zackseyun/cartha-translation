  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: zh_hans
  text: “你的门徒为什么违背古人的传统？因为他们吃饼[b]时不洗手[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所说的洗手，是古人传统所要求的做法，并非仅指日常卫生。
    reason: cultural_note
  - marker: b
    text: 或译：“吃饭时”。希腊语“饼”有时可泛指食物或一餐。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: 为什么
  rationale: 直接、自然地表达询问原因的语气。
- source_word: παραβαίνουσιν
  choice: 违背
  rationale: 表达越过或违反具有约束力的传统；比“打破”更符合现代汉语习惯，又不带过强的法律术语色彩。
- source_word: τὴν παράδοσιν
  choice: 传统
  rationale: 指从前人传承下来的规范性做法；“传统”既保留传承含义，也不削弱其权威性。
- source_word: τῶν πρεσβυτέρων
  choice: 古代长老的
  rationale: 这里不是泛指年长者，而是指与传承有关的前代权威人物。“古代长老”既保留“长老”的原词含义，也避免读者误以为是当时在场或教会中的长老。
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: 他们……不洗手
  rationale: νίπτω常指洗身体的某一部分；汉语以“不洗手”自然表达动词、宾语和所属关系。
- source_word: ὅταν
  choice: ……时
  rationale: 配合现在时态的虚拟语气，表达反复或通常发生的情形；汉语由上下文自然体现习惯性。
- source_word: ἄρτον
  choice: 饼
  rationale: 保留原文“饼”的具体用词，而不在正文中直接解释为泛指食物或一餐；其转喻可能性在脚注说明。
- source_word: ἐσθίωσιν
  choice: 吃
  rationale: 在时间从句中以简洁的现代汉语表达通常性的进食行为。
theological_decisions:
- issue: 洗手所指行为的性质
  choice: 正文只说明争议关乎古代长老的传统，不直接加入“礼仪性”“洁净礼”或“卫生”之类解释。
  alternative: 在正文中明确译作“按洁净礼洗手”或将其理解为普通卫生习惯。
  rationale: 经文本身把问题框定为是否遵守长老传统，却没有在本节进一步界定其性质；正文应保留这一张力，文化背景另以脚注说明。
- issue: ἄρτον在语境中的范围
  choice: 正文译作“饼”，保留字面意象。
  alternative: 正文译作“饭”或“一餐”。
  rationale: ἄρτον本义是饼，但可转喻食物或一餐。正文保留较具体的原文措辞，并用脚注呈现较宽泛的理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。问句保持直接质问的语气；“古代长老”说明这些人是与传承相关的前代权威，同时避免把背景解释写入正文。脚注标记均置于相关句末。
