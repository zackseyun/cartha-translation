id: MAT.15.32
reference: Matthew 15:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: zh_hans
  text: 耶稣叫门徒到他跟前来，说：“我怜悯这群人，因为他们跟我在一起已经三天了，现在没有什么可吃的。我不愿让他们饿着回去[a]，免得他们在路上体力不支[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饿着”直译可作“空着肚子”或“没有进食”；这里不是指宗教性的禁食。
    reason: lexical_alternative
  - marker: b
    text: “体力不支”也可译作“昏倒”或“支撑不住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫……到他跟前来
  rationale: 体现中间语态所含的方向意味，即耶稣把门徒叫到自己这里来；表达自然清楚。
- source_word: Σπλαγχνίζομαι
  choice: 我怜悯
  rationale: 表达发自内心的深切怜悯；“怜悯”庄重而通俗，也保留动词的情感力度。
- source_word: ὄχλον
  choice: 这群人
  rationale: 在直接引语中比“群众”更自然，同时准确指向当时聚集的人群。
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: 他们跟我在一起已经三天了
  rationale: 保留 προσμένω 所表达的持续留在耶稣身边之意，并采用自然的现代汉语时长表达。
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: 现在没有什么可吃的
  rationale: 自然传达他们缺少食物的意思；“现在”结合语境表现眼下的处境，但不额外引入因果。
- source_word: ἀπολῦσαι
  choice: 让……回去
  rationale: 这里指遣散聚集的人群，使他们踏上归程；“回去”符合后文“在路上”的语境。
- source_word: νήστεις
  choice: 饿着
  rationale: 原词字面可指“未进食、空腹”，此处不是宗教性禁食；“饿着”以自然汉语传达实际处境。
- source_word: μήποτε
  choice: 免得
  rationale: 准确表达所担心的结果，符合现代汉语习惯。
- source_word: ἐκλυθῶσιν
  choice: 体力不支
  rationale: 该词在此表示因饥饿而疲惫、虚弱甚至昏倒；“体力不支”保留一定幅度，不把结果限定为实际昏厥。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 简洁自然地指他们离开后返程的途中。
theological_decisions: []
