  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: zh_hans
  text: 吃过的人共有四千名男子，另外还有妇女和孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妇女和孩子不计算在内。”
    reason: χωρίς既可从“另外还有”的角度表达，也可直陈这些人未计入四千名男子之数。
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: 吃过的人
  rationale: 带冠词的分词作名词用，指参与这顿饭的人；虽然ἐσθίοντες在形式上是现在分词，但按已经结束的用餐情境，译为“吃过”更符合现代汉语。δέ是轻微连接词，本句无需另加可能显得突兀的“但”或“于是”。
- source_word: ἦσαν τετρακισχίλιοι
  choice: 共有四千名
  rationale: ἦσαν是系词，τετρακισχίλιοι给出人数；汉语用“共有四千名”自然地表达统计结果。
- source_word: ἄνδρες
  choice: 男子
  rationale: ἀνήρ在这里特指成年男性，与随后另行提到的妇女和孩子相区别；“男子”既准确，也适合人数统计的语境。
- source_word: χωρὶς
  choice: 另外还有
  rationale: χωρίς表示妇女和孩子不包括在四千名男子之内；“另外还有”自然表达他们是这项数字以外的人。
- source_word: γυναικῶν καὶ παιδίων
  choice: 妇女和孩子
  rationale: γυνή在此泛指妇女，而非专指妻子；παιδίον在此宜作一般性的“孩子”，不必收窄为幼儿。
theological_decisions:
- issue: 按性别区分的计数表述
  choice: 保留“四千名男子”，并将妇女和孩子列为该数字以外的人。
  alternative: 译作“四千人”，把男子、妇女和孩子一并理解为总人数。
  rationale: 原文明确使用ἄνδρες（男子），随后又分别提到妇女和孩子；译作笼统的“人”会抹去原文的区分。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“共有四千名男子”符合汉语计数习惯；“另外还有”避免生硬直译，同时保留原文中四千名仅指男子的意思。
