source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: zh_hans
  text: 他却没有回答她一句话。门徒上前来，一再求他，说：“请打发她走[a]，因为她在我们后面[b]不停地喊叫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打发她走”也可理解为“答应她的请求，让她走吧”，或仅指“把她遣走”。门徒的话没有明确说明是哪一种意思。
    reason: 保留 Ἀπόλυσον αὐτήν 在语境中的意图歧义。
  - marker: b
    text: 或译：“跟在我们后面”。希腊语既可表示所处的位置，也可表示跟随、追在后面。
    reason: 说明 ὄπισθεν ἡμῶν 的词义范围。
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: 一句话也不回答她
  rationale: 保留“一句话也没有回答”的强调语气，同时采用自然的现代汉语表达。
- source_word: προσελθόντες
  choice: 上前来
  rationale: 准确表达门徒朝耶稣走近的动作，比单说“来”更清楚，又不显生硬。
- source_word: ἠρώτουν
  choice: 一再求
  rationale: 未完成时可表示持续或反复的请求；“一再求”体现这一语气，同时避免把 ἐρωτάω 过度强化为苦苦哀求。
- source_word: Ἀπόλυσον αὐτήν
  choice: 请打发她走
  rationale: ἀπολύω 在此可指让人离开或把人遣走；这一译法不说明门徒是否希望耶稣先答应她的请求。
- source_word: κράζει
  choice: 不停地喊叫
  rationale: κράζω 表示大声呼喊；结合现在时及门徒持续请求的场景，“不停地喊叫”自然呈现持续性。
- source_word: ὄπισθεν ἡμῶν
  choice: 在我们后面
  rationale: 保留最直接的空间意义；原文也可能表示“跟在我们后面”，故以脚注说明。
theological_decisions:
- issue: 门徒说 Ἀπόλυσον αὐτήν 的意图
  choice: 译作“请打发她走”，不明确她应以何种方式离开
  alternative: “答应她，让她走吧”或“把她赶走吧”
  rationale: 希腊文命令本身没有说明门徒是要耶稣满足她的请求后让她离开，还是只要将她遣走。正文保留这种叙事张力，不替读者作出判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一句话也不回答她”保留原文强调；“一再求”与“不停地喊叫”呈现动作的持续性。脚注标记均置于相关词语之后，并纠正咨询层脚注标记与内容错位的问题。
