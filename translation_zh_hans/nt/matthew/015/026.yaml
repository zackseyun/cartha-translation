  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: zh_hans
  text: 他回答说：“拿儿女的饼扔给小狗[a]，是不合适的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小狗”也可理解为“家犬”或“幼犬”；希腊语在这里用了指小形式，可能指小狗或家养的狗，而不是街头游荡的狗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 保留分词加限定动词所表达的回应意味；“回答说”在现代汉语中自然，也贴近原文形式。
- source_word: καλὸν
  choice: 合适
  rationale: 此处表示行为是否妥当、合宜，并非单指道德上的“好”；“合适”符合上下文语气。
- source_word: λαβεῖν
  choice: 拿
  rationale: 表达把饼拿来并转给另一对象的动作，是此处朴素直接的对应。
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: 儿女的饼
  rationale: “儿女”不限定性别，并保留“饼”这一具体比喻形象和属有关系。
- source_word: βαλεῖν
  choice: 扔给
  rationale: 保留 βάλλω 的鲜明动作感；汉语“扔给”同时自然表达接受对象。
- source_word: τοῖς κυναρίοις
  choice: 小狗
  rationale: κυνάριον 是“小狗”的指小形式，也可能让人联想到家养的狗；正文用“小狗”保留该词形上的细微意味而不作过度解释。
theological_decisions:
- issue: 如何呈现“儿女、饼和小狗”的比喻而不预先解释其族群指向或耶稣的语气
  choice: 正文直接保留“儿女的饼”和“小狗”的意象
  alternative: 在正文中明确解释儿女和狗各自指谁，或将“小狗”处理为弱化比喻的“家犬”
  rationale: 本节的上下文有助于理解比喻，但本节本身没有明说各意象的所指。直译核心意象可保留原话的张力，避免把特定神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“实在不合适”将希腊语否定判断置于汉语句末，使整句话流畅；正文保留比喻的直接性与冲击力。
