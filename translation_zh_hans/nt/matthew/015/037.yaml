  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: zh_hans
  text: 众人都吃了，也都吃饱了；他们收集了七筐满满的剩余碎块。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七个装满的较大筐子。”这里译作“筐”的希腊词（σπυρίς）可指一种较大的筐具；在其他记载分给众人食物的段落中，所用的筐子名称不同。
    reason: 保留σπυρίς可能带有较大筐具之义的词汇差异，同时不在正文中将其大小确定化。
lexical_decisions:
- source_word: ἔφαγον
  choice: 吃了
  rationale: 不及物用法，原文没有明说宾语；译作“吃了”简洁自然。
- source_word: πάντες
  choice: 众人都
  rationale: 保留原文涵盖全体的范围，也自然表达复数主语所指的群众。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: 此处表示吃到饱足；“吃饱了”比直译“得了饱足”更符合现代汉语，同时准确传达语义。
- source_word: τὸ περισσεῦον
  choice: 剩下的
  rationale: 冠词化分词表示“所剩下的东西”，在此修饰并统摄后面的碎块。
- source_word: κλασμάτων
  choice: 碎块
  rationale: 指掰开后剩余的食物块；“碎块”既保留破开、零散之意，又不过度补明为饼。
- source_word: ἦραν
  choice: 收拾起来
  rationale: αἴρω基本义为拿起、取起；在收集剩余食物的语境中，“收拾起来”自然地表达将其捡取归集。
- source_word: ἑπτὰ
  choice: 七个
  rationale: 直接对应基数词，并按现代汉语为筐子添加量词。
- source_word: σπυρίδας
  choice: 筐子
  rationale: 该词指一种筐，可能是较大的筐；正文采用一般称呼以免把相对大小解释写死，词义细节收入脚注。
- source_word: πλήρεις
  choice: 装满了
  rationale: 原文是表语形容词“满的”，说明七个筐子的状态；汉语改用结果表达“装满了”更自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众人都……吃饱了”贴近日常表达；后半句按汉语信息顺序重组为“把……收拾起来，装满了……”，不改变原文事件关系。脚注标记置于“筐子”相关陈述之后，使其所注对象清楚。
