  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: zh_hans
  text: 他却回答说：“我被差遣来，只到以色列家迷失的羊那里去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“我没有被差遣到别处，只到以色列家迷失的羊那里去。”
    reason: 说明希腊语 Οὐκ…εἰ μὴ 的否定加排除结构；正文以自然汉语“只”表达同一限制。
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: 他却回答说
  rationale: 希腊语以不定过去时分词加限定动词引出回应；“回答说”自然保留其结构与叙事功能。“却”表达 δέ 在上下文中的轻微转折。
- source_word: Οὐκ ἀπεστάλην
  choice: 我奉差遣
  rationale: 不定过去时被动语态表示受差派、领受使命；“奉差遣”在现代汉语中简洁庄重，也保留被动受命的含义。
- source_word: εἰ μὴ
  choice: 只
  rationale: 在 Οὐκ…εἰ μὴ 结构中表示排除和限定；正文用自然的汉语限制式表达，脚注补充更贴近希腊语形式的译法。
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: 迷失的羊
  rationale: 保留羊的比喻；ἀπολωλότα 在此指走失、迷失，而非强调已经灭亡。“迷失”比“失丧”更符合普通现代读者的自然用语。
- source_word: οἴκου Ἰσραήλ
  choice: 以色列家
  rationale: 保留圣经传统中的民族与群体称谓，也再现属格结构的关系，避免解释性扩写。
theological_decisions:
- issue: 耶稣在这句话中所述使命的范围
  choice: 按原文明确译为此处使命对象受到限定，只到以色列家迷失的羊那里去。
  alternative: 译成仅表示先后次序，或加入后来向万民使命的解释。
  rationale: Οὐκ…εἰ μὴ 是明确的限制结构。译文应保留叙事中的神学张力，不以更广的正典背景在本节中将其弱化或预先化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉差遣”保留使命与受差派意味；“以色列家”保留经文惯用表达。脚注标记置于整句引号之后。
