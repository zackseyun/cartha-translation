  source_fidelity: 正文准确保留了ὁ δὲ ἀποκριθεὶς εἶπεν的回应引语、Οὐκ…εἰ μὴ的排他性限定、羊的比喻及“以色列家”的传统表达。不过“我奉差遣，只到……那里去”虽可理解，中文中“奉差遣”未明示该差遣的完成性使命，且“到……去”略显口语化、行程化。改为“我被差遣来，只到……”更清楚地传达ἀπεστάλην的被动受差使命，并保持原文限制。
  naturalness: “他却回答说”及“以色列家迷失的羊”庄重自然。将“我奉差遣”改为“我被差遣来”，并将“只”调整为“只被差遣到”，可使句法更顺畅，且避免把限定误读为单纯的行动目的地。
  terminology: “以色列家”“迷失的羊”恰当，保留经文意象和传统宗教语域。“被差遣”比“奉差遣”更直接对应被动语态，同时不引入使徒职分等额外神学含义。
