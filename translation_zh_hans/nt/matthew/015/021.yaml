base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: zh_hans
  text: 耶稣离开那里，退到推罗和西顿一带[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开那里，前往推罗和西顿地区。”原文动词也可较中性地译作“离开、前往”，但“退到”保留了马太反复使用这个动词时可能含有的退避意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处是承接上下文的简单连接词。现代汉语叙事中不必机械译作“于是”或“并且”；直接起句更自然，也不改变经文关系。
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: 离开那里
  rationale: 不定过去时分词表示先于主要动词的动作。“离开那里”自然合并表达“从那里出去”，既保留离开先前地点的意思，也避免生硬重复。
- source_word: ἀνεχώρησεν
  choice: 退到
  rationale: 该动词在马太福音中常有离开、退去或避开的意味。“退到”保留可能含有的策略性退避色彩，但不把它强化为因败退而“撤退”，也不明说动机。
- source_word: εἰς τὰ μέρη
  choice: 到……一带
  rationale: μέρη指某些地区或地域；“一带”符合现代汉语地理表达，并表明目的地是两座城相关的区域，不必断定耶稣进入城内。
- source_word: Τύρου καὶ Σιδῶνος
  choice: 推罗和西顿
  rationale: 采用现代中文圣经读者熟悉的传统地名译法；两个属格共同修饰“地区”。
theological_decisions:
- issue: 耶稣前往与外邦人相关地区时，其行动所含的叙事意味
  choice: 将ἀνεχώρησεν译为“退到”，但不交代退去的原因。
  alternative: 较中性地译为“去到”或“离开，前往”；较强地译为“撤退到”。
  rationale: 原文可能带有退避或策略性离开的意味，且这一动词在马太叙事中有重复用法，但本节没有说明耶稣为何离开。译文保留这层张力，不添加心理、策略或神学动机。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“离开那里，退到……”用两个连续动作对应希腊文分词与主要动词；“一带”避免让读者误以为经文明确说耶稣进入推罗、西顿两城。
