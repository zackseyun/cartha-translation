  to: 于是，耶稣回答她说：“妇人啊，你的信心[a]真大！就照你所愿的，给你成就吧。”从那一刻起[b]，她的女儿就痊愈了。
  rationale: 仅作一处低风险的汉语语序与搭配调整：“照你所愿的，给你成就吧”比“照你所愿的为你成就吧”更自然，仍保留原文被动命令式所带的宣告语气、σοι的“给你/为你”关系和ὡς θέλεις的“照你所愿”。保留“妇人啊”、 “信心”、 “痊愈”及两条脚注，因为它们与希腊文及本段庄重语体相符。
