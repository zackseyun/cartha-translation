  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: zh_hans
  text: 于是，耶稣回答她说：“妇人啊，你的信心[a]真大！就照你所愿的，给你成就吧。”从那一刻起[b]，她的女儿就痊愈了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信靠”；这里着重指她对耶稣的相信和倚靠。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“从那时辰起”，意思是从当时、从那一刻起。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 作为叙事中的时间与承接标记，连接前文对话及耶稣随后的回应；“于是”在现代汉语中自然流畅。
- source_word: ἀποκριθεὶς … εἶπεν αὐτῇ
  choice: 回答她说
  rationale: 希腊语分词与限定动词共同构成惯用的引语引入式；译为“回答她说”既保留回应之意，也明确αὐτῇ所指的对象。
- source_word: Ὦ γύναι
  choice: 妇人啊
  rationale: 保留呼语和Ὦ所表达的郑重、强调语气；在本语境中是直接称呼，并非轻蔑。
- source_word: μεγάλη σου ἡ πίστις
  choice: 你的信心真大
  rationale: 以“真大”体现前置形容词μεγάλη的强调，同时采用自然的现代汉语语序。
- source_word: πίστις
  choice: 信心
  rationale: 此处指妇人对耶稣所表现的相信与倚靠；“信心”是贴合语境且通行的译法，同时以脚注保留“信靠”的词义侧重。
- source_word: γενηθήτω σοι ὡς θέλεις
  choice: 就照你所愿的为你成就吧
  rationale: 保留被动命令式的成就/发生含义及宣告效力；“为你”对应σοι，“照你所愿的”对应ὡς θέλεις。
- source_word: ἰάθη
  choice: 痊愈了
  rationale: 准确表达ἰάομαι不定过去时被动式所指的医治结果，汉语中简洁自然。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: 从那一刻起
  rationale: 这是现代汉语表达即时起点的自然说法；脚注保留希腊语字面的“从那时辰起”。
theological_decisions:
- issue: 耶稣称赞妇人的πίστις应如何表达
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文突出妇人对耶稣持续恳求、相信他能施行医治，因此“信心”最合适；“信靠”可表达关系性的侧重，故列入脚注，而“忠信”在此并非主要含义。
- issue: γενηθήτω的宣告效力
  choice: 为你成就吧
  alternative: 愿它为你实现；让事情照你的愿望发生
  rationale: 此句是耶稣带有施行效力的宣告，而不只是表达愿望；“成就”既保留被动意义，又避免明说原文未明说的施行机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妇人啊”保留原文呼语的郑重感，并不含粗暴或轻蔑之意；整体尽量保存原文简洁、有力的叙事节奏。
