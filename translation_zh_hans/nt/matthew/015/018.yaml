id: MAT.15.18
reference: Matthew 15:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: zh_hans
  text: 但从口里出来的，是从心里出来的；这些使人污秽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人污秽”或译“使人成为不洁净的”。
    reason: 保留 κοινόω 在洁净语境中“使之不洁”与较广义“玷污”之间的词义幅度。
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: 从口里出来的
  rationale: 中性复数分词作名词用，泛指从口中说出或发出的事物；译文保留“出来”的具体意象，并以“的”字结构自然表达。
- source_word: στόματος
  choice: 口
  rationale: 按其本义译为“口”，保留耶稣所用的身体意象，并与上下文关于入口和出口的对比呼应。
- source_word: καρδίας
  choice: 心
  rationale: 这里指人的内在中心，包括思想、意愿和道德倾向；“心”既保留圣经惯用意象，也符合现代汉语表达。
- source_word: ἐξέρχεται
  choice: 发出来
  rationale: 该单数动词与中性复数主语搭配，整体说明来源；“从心里发出来”自然地表达由内而外的动态，同时避免把含义缩减为单纯的空间移动。
- source_word: κἀκεῖνα
  choice: 这些
  rationale: 该词是“并且那些”的缩合形式，回指前面从口里出来的事物；汉语用“这些”回指更自然清楚。
- source_word: κοινοῖ
  choice: 使人污秽
  rationale: 在本段洁净与不洁净的语境中，κοινόω表示使人成为不洁或受玷污；“使人污秽”保留礼仪与道德层面的张力，不把含义限定在其中一面。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 带冠词的单数在此具有代表性，泛指人；现代汉语“人”自然保留这种普遍指称，不带男性专指意味。
theological_decisions:
- issue: 污秽的内在来源
  choice: 译文表明，从口中出来的事物源于人的“心”，并使人污秽。
  alternative: 仅理解为言语造成礼仪上的不洁。
  rationale: 上下文把外在入口之物与从内心发出之物相对照。保留“心”和“使人污秽”，既呈现道德内在性的重点，也不抹去洁净语境中的礼仪用语。
- issue: κοινοῖ所含礼仪与道德语义
  choice: 主文采用“使人污秽”。
  alternative: 使人成为不洁净的。
  rationale: “污秽”较凝练，并能承载玷污与不洁的双重语感；脚注列出更贴近洁净术语的译法，以保存原词在此处的语义张力。
- issue: ἄνθρωπον的代表性单数
  choice: 译为泛指的“人”。
  alternative: 那个人。
  rationale: 希腊文虽为单数，但在此是代表性泛指。汉语“人”本身可自然表达这一点，无须引入男性限定，也不必把它改写成复数。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“从口里出来的……从心里发出来”保留原文重复的出发意象；分号呈现两个分句间的因果推进。“才”突出与前文外在入口之物的对比，不改变命题内容。
