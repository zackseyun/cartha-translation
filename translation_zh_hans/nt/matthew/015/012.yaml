  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: zh_hans
  text: 于是，门徒上前对他说：“你知道法利赛人听见这话[a]就觉得受了冒犯[b]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”指耶稣前面所说的话。
    reason: cross_reference
  - marker: b
    text: 也可译作“感到反感”；较直译为“被绊倒了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 表示叙事中的时间承接和事件推进；“于是”比“那时”更自然地连接上下文。
- source_word: προσελθόντες
  choice: 上前
  rationale: 保留门徒走近耶稣的动作，并与后面的主要动词自然衔接。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词所指对象由上下文明确；现代汉语中无需机械补出“那些”或“他的”。
- source_word: λέγουσιν αὐτῷ
  choice: 对他说
  rationale: 将叙事历史现在时按现代汉语习惯表达，不改变事件时序；同时保留代词“他”，不增添原文未明说的名字。
- source_word: Οἶδας
  choice: 你知道……吗
  rationale: 直接保留询问形式；不采用解释性更强的“你有没有意识到”。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般宗教语境中通行的群体名称。
- source_word: ἀκούσαντες τὸν λόγον
  choice: 听了这话
  rationale: λόγος在这里指耶稣刚才所说的话；“这话”既自然又保留单数指称，不扩写为“你的教导”。
- source_word: ἐσκανδαλίσθησαν
  choice: 感到反感
  rationale: 此处描述法利赛人听见耶稣的话后的负面反应；该表达符合现代汉语，同时用脚注保留“被冒犯／绊倒”的词义幅度。
theological_decisions:
- issue: 非救恩论语境中σκανδαλίζω的表达
  choice: 感到反感
  alternative: 觉得受了冒犯；被绊倒
  rationale: 上下文首先呈现法利赛人对耶稣言论的强烈负面反应。“感到反感”不把该词过度解释为离弃信仰或道德跌倒；脚注同时保留其被动形式及“绊倒”意象所带来的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是……上前对他说”保持叙事流畅；问句保留门徒直接询问的语气。脚注标记均置于所解释的词语之后。
