  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: zh_hans
  text: 她却来到他跟前，向他下拜[a]，说：“主啊，帮助我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜他。”希腊语动词可按语境表示俯伏致敬、尊崇或敬拜。
    reason: 保留προσκυνέω在此处真实存在的词义与神学歧义。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文并表达轻微转折，突出她在受挫后仍继续恳求。
- source_word: ἐλθοῦσα
  choice: 上前来
  rationale: 将不定过去时分词自然转化为汉语连续动作；既表达她来到耶稣跟前，也避免生硬直译。
- source_word: προσεκύνει αὐτῷ
  choice: 俯伏在他面前
  rationale: προσκυνέω可指俯伏致敬、敬拜等；正文呈现可见的身体姿态和敬意，不把她当时的神学认识限定得过窄，并以脚注保留“敬拜他”的可能。未采用“跪在他面前”，因为原词更广，可包含俯身或俯伏。
- source_word: λέγουσα
  choice: 说
  rationale: 用自然汉语引出直接引语，无须机械保留分词结构。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε是对耶稣庄重而有分量的称呼；“主”保留其尊称及可能的更深含义，“啊”符合汉语呼语。
- source_word: βοήθει μοι
  choice: 帮助我
  rationale: 准确保留现在时命令语气所表达的直接、迫切恳求，也保持原文简短有力。
theological_decisions:
- issue: 对耶稣所用προσκυνέω的译法
  choice: 俯伏在他面前
  alternative: 敬拜他
  rationale: 该动词可表示俯伏致敬、表示尊崇或敬拜。正文选择能明确呈现外在动作、同时不过早判定妇人神学认知的译法；脚注保留马太语境中成立的“敬拜”译法，以维持原文的神学张力。
- issue: κύριε作为对耶稣的称呼
  choice: 主啊
  alternative: 先生
  rationale: 此处称呼既可具有礼貌尊称色彩，也可能承载更深的基督论分量；“主啊”比“先生”更能保留这种开放性，并与上下文的迫切求告相称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“她却上前来”流畅表达转折与动作推进；“俯伏在他面前”保留古代恳求场景中的身体姿态，但以脚注避免把该词仅限于致敬。引语简洁急切，贴合原文。
