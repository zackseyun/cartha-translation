  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: zh_hans
  text: 他回答说：“你们为什么也因着你们的传统，违犯上帝的诫命呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: 他回答他们说
  rationale: 保留“回答”与“说”两个表达成分，同时采用自然、庄重的现代汉语句式，并明确回答的对象。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 自然对应询问原因的希腊语表达。
- source_word: καὶ ὑμεῖς
  choice: 你们为什么也
  rationale: “也”承接上文对门徒的指责，并突出耶稣反问对方的对应关系，不额外加强为“连你们也”。
- source_word: παραβαίνετε
  choice: 违犯
  rationale: 准确表达越过、违反诫命之意；比“触犯”更适合与“诫命”搭配，也比“破坏”更明确。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 上帝的诫命
  rationale: “诫命”保留经文及盟约语境中的庄重色彩，并与人的“传统”形成鲜明对照。
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: 因着你们的传统
  rationale: διά加宾格在此可表示原因，也可能带有“为了、为维护”的意味；正文以自然的“因着”表达原因，脚注保留目的或维护传统的可能语气。“你们的传统”使责备限于对方所持的传统，并非笼统否定一切传统。
theological_decisions:
- issue: 上帝的诫命与人的传统之间的对照
  choice: 保留“上帝的诫命”与“你们的传统”的直接对照
  alternative: 将“传统”译作“教导”或“习俗”
  rationale: 原文针对对方所传承的具体传统如何导致违犯上帝诫命，并没有在本节中宣告一切传统本身都有错。因此采用“你们的传统”，既保留张力，也避免扩大经文的批评范围。
- issue: διὰ τὴν παράδοσιν ὑμῶν所表达的因果或目的关系
  choice: 正文译为“因着你们的传统”
  alternative: 译为“为了维护你们的传统”
  rationale: 原文介词结构容许原因性理解，也可在语境中听出为了传统而违犯诫命的意味。正文不把目的成分说得过满，脚注则保留另一种合理理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“他回答他们说”略带经文叙事风格，但在汉语中仍自然，并较完整地反映原文；问句末用“呢”传达反问语气。
