  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: zh_hans
  text: 这些是使人污秽的；至于用没有洗过的手吃饭，并不会使人污秽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人污秽”也可译作“使人不洁净”。这里既涉及礼仪上的不洁，也涉及使人受到道德玷污的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: 这些才是……的
  rationale: 保留指示代词的强调，并用“才”自然表达上下文中真正使人污秽之事与洗手问题的对比。
- source_word: κοινοῦντα / κοινοῖ
  choice: 使人污秽
  rationale: 在洁净礼仪的语境中，κοινόω 指使人成为不洁；“污秽”既能承载礼仪不洁的背景，也保留耶稣所强调的道德污染含义。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 希腊文带冠词的单数在此作泛指。现代汉语用单数“人”可自然表达普遍适用于人的真理，无须加入性别限定。
- source_word: τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν
  choice: 至于用没洗过的手吃饭
  rationale: “至于”清楚标示对比话题；“用没洗过的手吃饭”自然准确地反映该与格短语及不定式结构。
theological_decisions:
- issue: 洁净争议中 κοινόω 的含义
  choice: 使人污秽
  alternative: 使人成为不洁净
  rationale: “使人污秽”同时保留礼仪洁净的语境和内在道德败坏的广义，不把耶稣的话局限为单纯的礼仪判定。
- issue: 泛指单数 ἄνθρωπον
  choice: 人
  alternative: 一个人
  rationale: “人”在现代汉语中能以单数形式自然表达泛指，也避免把原文无意强调的个体性加入译文。
- issue: δέ 所表达的关系
  choice: 至于……并不会
  alternative: 但是……不
  rationale: 原文以 δέ 将真正使人污秽之事与未洗手吃饭形成对照；这一结构在汉语中清楚、自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“没洗过的手”比“未洗的手”更口语自然，但整体仍保持经文体的凝练；末句仅置一个脚注标记，说明两次出现的同一希腊动词。
