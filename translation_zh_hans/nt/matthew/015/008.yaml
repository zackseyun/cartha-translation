  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: zh_hans
  text: “这百姓用嘴唇尊敬我，他们的心[a]却远离我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们各人的心都远离我。”希腊文“心”是单数，可能是把百姓作为一个整体来说。
    reason: 说明原文集合单数在汉语中也可作分配性理解。
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: 这百姓
  rationale: 保留指示词 οὗτος 和 λαός 的群体含义；“这百姓”也自然呼应先知引文的庄重语气。
- source_word: τοῖς χείλεσίν
  choice: 用嘴唇
  rationale: 将工具用法的与格译为“用”，并保留“嘴唇”的具体身体意象，不抽象化为“言语”。
- source_word: τιμᾷ
  choice: 尊敬
  rationale: 准确表达 τιμάω 在此处“给予尊荣、表示敬重”的意思；“尊敬我”是现代汉语中自然且庄重的说法。
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: 他们的心却
  rationale: 保留原文单数 καρδία，以集合单数表现全体百姓共同的内在倾向；“却”清楚传达 δέ 的转折。
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: 远离我
  rationale: 简洁自然地表达距离甚远及关系疏离的意象，同时不额外解释其原因或性质。
theological_decisions:
- issue: “心”的集合单数与分配性复数
  choice: 正文保留单数“他们的心”
  alternative: “他们的心都”或“他们的众心”
  rationale: 希腊文 καρδία 为单数，可能把百姓视为一个整体，描述其共同的内在状态。保留单数可维持先知引文的修辞张力；脚注说明现代汉语也可按个体理解为复数。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这百姓”保留引文色彩；“用嘴唇尊敬我”维持外在敬奉与内心疏离之间的鲜明对照。脚注标记置于与其所说明的后半句相邻之处。
