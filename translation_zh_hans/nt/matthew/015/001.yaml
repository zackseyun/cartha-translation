  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: zh_hans
  text: 那时，从耶路撒冷来的法利赛人和文士[b]来到耶稣跟前[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走近耶稣”。
    reason: lexical_alternative
  - marker: b
    text: “文士”也可译作“经学家”“律法专家”或“律法教师”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间性叙事标记，引出下一幕；“那时”自然庄重，也不把事件间的时间关系说得过强。
- source_word: προσέρχονται
  choice: 来见
  rationale: 表达朝向并接近某人的动作；在此处“来见耶稣”符合现代汉语习惯。希腊文为历史现在时，但汉语动词本身不标时态，可自然保留叙事的临场感。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: 与 προσέρχονται 连用，表示前去接近的对象；采用通行中文人名。
- source_word: ἀπὸ Ἱεροσολύμων
  choice: 从耶路撒冷
  rationale: ἀπό 表示来源或出发地；不额外推断这些人具有官方身份。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用该犹太群体的通行历史宗教名称。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 在本语境中指熟悉并讲授律法的文士或律法专家；“经学家”比现代汉语中的“文士”更能直接传达其职能，同时不将其限定为某一种正式职位。
- source_word: καὶ
  choice: 和
  rationale: 直接连接两个群体。
- source_word: λέγοντες
  choice: 说
  rationale: 现在主动分词引出下一节的直接引语；汉语用“说”简洁自然地保留句法衔接。
theological_decisions:
- issue: 历史现在时的表达
  choice: 不另加显式时态标记，以汉语叙事形式“来见……说”表达
  alternative: 译作“来到……说”或“来到了……说”以突出过去事件
  rationale: προσέρχονται 是历史现在时，带有叙事临场感。现代汉语动词不发生时态屈折，因此无需强加完成体“了”；当前译法既自然，也避免抹去原文的鲜活效果。
- issue: γραμματεῖς 的身份含义
  choice: 经学家
  alternative: 文士；律法专家；律法教师
  rationale: 该词在福音书语境中常指精通犹太律法和经文的人。“经学家”保留其经文研究身份，而脚注说明其他合理译法，避免把其角色过度制度化。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“那时”承接上下文；“来见”比“走近”更符合日常汉语，但以脚注保留动作含义。主句中两个脚注标记均紧邻相关内容，其中[b]放在引语提示语之后，说明“经学家”的译名。
