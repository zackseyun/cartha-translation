  text: καὶ ⸀παραγγείλας ⸂τῷ ὄχλῳ⸃ ἀναπεσεῖν ἐπὶ τὴν γῆν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/035.yaml
  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: zh_hans
  text: 他吩咐众人坐在地上，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“斜倚在地上。”希腊语动词可指就席用餐，常含斜倚而坐的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不另译）
  rationale: καί在这里承接叙事。现代汉语若直译为“然后”或“并且”略显累赘，省略仍能清楚表达动作的连续性。
- source_word: παραγγείλας
  choice: 吩咐
  rationale: 该词为不定过去时主动分词，主语由上下文确定为耶稣，表示先于下一节主要动作发生的指令。“吩咐”自然、庄重，也保留了命令意味。
- source_word: τῷ ὄχλῳ
  choice: 众人
  rationale: 指聚集的人群；“众人”符合现代中文叙事习惯，比“群众”更适合经文语境。
- source_word: ἀναπεσεῖν
  choice: 坐
  rationale: 在用餐语境中，该动词指就席，常含斜倚而坐的意味。中文若译“斜躺”容易令人误解为完全躺卧，因此正文采用自然的“坐”，并以脚注保留原词的姿态含义。
- source_word: ἐπὶ τὴν γῆν
  choice: 在地上
  rationale: 此处γῆ指地面，而非全球意义的“大地”或特定地域；“在地上”准确且自然。
theological_decisions: []
