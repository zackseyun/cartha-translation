  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: zh_hans
  text: 她说：“是的，主啊[a]，因为就连小狗[b]也吃从它们主人桌子上掉下来的碎屑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可理解为表示尊敬的“先生”；这里保留《福音书》中对κύριος的通常译法。
    reason: alternative_reading
  - marker: b
    text: 或译“狗”“家犬”或“幼犬”。希腊文使用指小形式，可能让人想到体形较小的狗或家养的狗。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: 是的
  rationale: 直接表达肯定与认同，保留妇人顺着耶稣前一句话回应的语气。
- source_word: κύριε
  choice: 主啊
  rationale: κύριος在这里既可作尊称，也可能含有对耶稣权柄的承认；“主啊”保留了这两方面的可能性。
- source_word: καὶ γὰρ
  choice: 因为就连……也
  rationale: “因为”表达γάρ的解释作用，“就连……也”表达καί的递进、强调意味，呈现妇人接受比喻并由此继续申辩的逻辑。
- source_word: κυνάρια
  choice: 小狗
  rationale: 希腊词使用指小之形式；“小狗”保留其词形意味，又不擅自限定为幼犬或家犬。
- source_word: ψιχίων
  choice: 碎屑
  rationale: 指桌上掉落的细小食物残屑；“碎屑”自然呈现这一饭桌意象。
- source_word: τῶν πιπτόντων
  choice: 掉下来的
  rationale: 以现代汉语定语从句自然表达现在分词所描述的一般性动作。
- source_word: τῶν κυρίων αὐτῶν
  choice: 它们主人
  rationale: 此处κύριος指狗的主人，并非对耶稣的称呼；“主人”符合人与动物关系的语境。
theological_decisions:
- issue: 妇人称呼耶稣为κύριε
  choice: 主啊
  alternative: 先生
  rationale: 此称呼可以只是礼貌尊称，也可能含有更深的权柄或信仰意涵。“主啊”符合《马太福音》中通常的译法，同时用脚注保留“先生”的可能理解。
- issue: κυνάρια的指小形式
  choice: 小狗
  alternative: 狗、家犬、幼犬
  rationale: 原文的指小形式应予体现，但不能据此断定它专指幼犬或家养犬。“小狗”既保留词形色彩，也不消除比喻本身的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“是的……因为……”保留原文表面上的顺承论证，不另加“不过”等转折词，以免替读者消解妇人回应中的修辞张力。
