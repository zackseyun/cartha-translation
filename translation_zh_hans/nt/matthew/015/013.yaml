  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: zh_hans
  text: 他回答说：“凡不是我天父所栽种的[a]，都必连根拔起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡不是我天父所栽种的植物，都必被连根拔起。”
    reason: 词义选择：φυτεία可指“植物”或“所栽种之物”。正文以“所栽种的”保留原文比喻的开放指涉，不将其限定为教训、传统或人。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答说
  rationale: 保留希腊文两个动词所构成的常见叙事表达；“回答说”在现代汉语中自然、庄重。
- source_word: Πᾶσα φυτεία
  choice: 凡……的
  rationale: Πᾶσα 在单数名词前具有逐一概括的意义；结合关系从句译作“凡……的”，既自然，也不强行把 φυτεία 限定为植物、教训、传统或人。
- source_word: ἐφύτευσεν
  choice: 栽种
  rationale: 保留农业意象，并与后面的“连根拔起”形成连贯的比喻。
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: 我天父
  rationale: 简洁、自然地表达“我的、属天的父”，也是现代汉语中易懂而庄重的称谓。
- source_word: ἐκριζωθήσεται
  choice: 要连根拔起
  rationale: 准确表达未来被动形式及“从根拔除”的含义；汉语未明说施事者，与原文被动表达一致。
theological_decisions:
- issue: “凡栽种之物”的比喻所指
  choice: 用“凡不是我天父栽种的”保留开放的比喻，不说明具体所指
  alternative: 明确译成“每一种教训”“每一种传统”或“每一个人”
  rationale: 原文 φυτεία 可指栽种、所栽种之物，而上下文并未在本句中明确定义其比喻所指；不具体化可避免加入解释性的神学结论。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“连根拔起”清楚保留审判性的农业意象；正文避免使用可能把比喻过早限定为教训、传统或人的名词。
