base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: zh_hans
  text: 彼得就回答耶稣说：“请给我们讲明这个比喻。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请把这个比喻讲给我们听”，或“请使我们明白这个比喻。”
    reason: 词义备选：φράζω可侧重“告诉”“说明”或“使……明白”。
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: （由“彼得却对他说”的言语结构体现回应）
  rationale: 这是ἀποκρίνομαι的不定过去时被动形分词，作中动含义使用，表示彼得接着前文作出回应。现代汉语若直译为“回答说”较显重复，因此融入“对他说”的叙事表达。
- source_word: δὲ
  choice: 却
  rationale: δέ在这里标示轻微转折或话语推进；“却”自然地表现彼得在耶稣先前发言之后提出请求。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: λέγω加与格代词表示向某人说话；“对他说”准确、自然。代词“他”在上下文中指耶稣。
- source_word: Φράσον
  choice: 请……讲明
  rationale: φράζω的不定过去时命令式意为说明、使人明白。“讲明”兼顾说出和解释的语义；加入“请”使汉语中的请求语气自然，并未削弱命令式。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 与“讲明”搭配，现代汉语自然表达为“给我们讲明”。
- source_word: τὴν παραβολὴν ταύτην
  choice: 这个比喻
  rationale: παραβολή在福音书中通常译为“比喻”；ταύτην指向刚才所说的话，译作“这个”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼得却对他说”避免生硬直译“彼得回答说”，同时保留回应关系；“讲明”保留φράζω在“说出”与“解释清楚”之间的语义幅度。脚注标记已置于正文相应位置。
