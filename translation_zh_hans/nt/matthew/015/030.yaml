  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: zh_hans
  text: 许多群众来到耶稣那里，带着不能说话的人[a]、失明的人、腿脚不便的人、肢体残缺的人[b]，以及许多其他人；他们把这些人放在耶稣脚前，耶稣就治好了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不能说话的人”：原文也可指耳聋的人，或兼指耳聋和不能说话的人。
    reason: lexical_alternative
  - marker: b
    text: “肢体残缺的人”：原文也可指肢体畸形或功能受损的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: 来到耶稣那里
  rationale: 准确表达“走近、来到某人面前”的叙事动作；明确代词所指，使中文独立成节时自然清楚。
- source_word: ὄχλοι πολλοί
  choice: 许多群众
  rationale: 保留原文“许多”的数量含义以及群体性；现代中文自然通顺。
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: 带着
  rationale: 原意为“随身有、与自己同在”，在此语境中表示群众把病患带来。
- source_word: κωφούς
  choice: 不能说话的
  rationale: κωφός可指耳聋、不能说话，或两者兼有；本节后文15:31提到“不能说话的人说话”，支持此处采用言语障碍的含义，同时不否认词本身的歧义。
- source_word: τυφλούς
  choice: 失明的
  rationale: 准确对应τυφλός，并采用现代、尊重人的表达。
- source_word: χωλούς
  choice: 腿脚不便的
  rationale: 表达行走能力受损，避免现代中文里可能带贬损色彩的旧称，同时与κυλλούς所指的肢体残缺相区别。
- source_word: κυλλούς
  choice: 肢体残缺的
  rationale: κυλλός指手脚等肢体残缺、畸形或失去功能的人；此译法在当前语境中较明确，并保留较广的指涉范围。
- source_word: ἑτέρους πολλούς
  choice: 许多其他病患
  rationale: 原文直译为“许多其他人”；依据医治场景补出“病患”，使中文指代明确而不改变所指。
- source_word: ἔρριψαν αὐτούς
  choice: 把这些人安置
  rationale: ῥίπτω基本义可为“扔下、放下”；在把病患带到耶稣面前的语境中，“安置”传达其结果而避免无根据地暗示粗暴。
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: 在耶稣脚前
  rationale: 自然表达这些人被放在耶稣近旁、他的脚前；再次明确代词所指。
- source_word: ἐθεράπευσεν αὐτούς
  choice: 治好了他们
  rationale: 准确表达福音书医治叙事中的θεραπεύω，并自然体现医治的完成。
theological_decisions:
- issue: κωφούς所指的是耳聋还是不能说话
  choice: 正文译为“不能说话的”
  alternative: “耳聋的”或“聋哑的”
  rationale: 该词本身具有歧义，但紧接本节的15:31特别说不能说话的人开口说话，为当前语境提供了较强线索；不采用“聋哑的”，以免断定两种障碍必然同时存在。
translation_notes:
  register: 采用现代、庄重且尊重残障人士的普通话表达，尽量避免可能带贬损色彩的标签。句式保持叙事简洁；用“耶稣”明确原文代词的所指，方便经节单独阅读。
