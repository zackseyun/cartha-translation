base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: zh_hans
  text: 耶稣问他们：“你们有多少个饼？”他们说：“七个，还有几条小鱼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 问
  rationale: 希腊文直译为“说”，但其后内容是问句；现代汉语用“问”自然准确地表达言语行为。叙事现在时按汉语叙事习惯处理，不另行标示。
- source_word: Πόσους ἄρτους
  choice: 多少个饼
  rationale: ἄρτους 是可数的饼；“多少个饼”既保留数量提问，也符合现代汉语表达。
- source_word: ἔχετε
  choice: 你们有
  rationale: 直接、自然地表达第二人称复数现在时。
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ 在这里主要推动叙事，并无明显转折；汉语无需机械译出连接词。
- source_word: Ἑπτά
  choice: 七个
  rationale: 承接前文可数的“饼”，补出量词“个”，符合汉语省略名词的回答方式。
- source_word: ὀλίγα
  choice: 几条
  rationale: 表示数量不多；与鱼搭配时用“几条”自然，并与后面的复数名词相合。
- source_word: ἰχθύδια
  choice: 小鱼
  rationale: 该词是 ἰχθύς 的指小形式，译作“小鱼”保留其形态所表达的微小含义。
