  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: zh_hans
  text: 他拿起那七个饼和鱼，献上感谢后，就把饼掰开，接连把饼和鱼递给门徒；门徒又递给人群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: 拿起
  rationale: 这里描写耶稣开始处理食物的动作；“拿起”符合现代汉语叙事，也比“领受”更贴合语境。
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: 那七个饼
  rationale: ἄρτος在此指可数的饼；“七个饼”具体自然，指回上文已提到的食物。
- source_word: τοὺς ἰχθύας
  choice: 鱼
  rationale: 现代汉语通常不必用量词或复数标记即可表达这里的复数概念。
- source_word: εὐχαριστήσας
  choice: 献上感谢后
  rationale: 不定过去时分词表示先于掰饼发生的动作；“……后”清楚表达先后关系，同时不补出原文未明说的感谢对象。
- source_word: ἔκλασεν
  choice: 把饼掰开
  rationale: κλάω在供食叙事中指掰饼。希腊文省略宾语，汉语为清楚自然而依语境补出“饼”，避免让人误以为鱼也要“掰开”。
- source_word: ἐδίδου
  choice: 接连把饼和鱼递给
  rationale: 未完成过去时呈现持续或反复分发的过程，“接连……递给”保留这一体貌；依上下文补明所递的是饼和鱼。
- source_word: τοῖς μαθηταῖς
  choice: 给门徒
  rationale: 与格表示接受者；原文没有“他的”，因此不增补。
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: 门徒又递给人群
  rationale: 希腊文后半句省略动词，汉语自然补出“递给”；“人群”保留ὄχλοι的群体含义，而不把它解释为某一特定类别的人。
theological_decisions:
- issue: εὐχαριστήσας是否应采用带有圣餐色彩的措辞
  choice: 译作普通叙事性的“献上感谢后”
  alternative: 采用更礼仪化的措辞，突出圣餐联想
  rationale: 该措辞可能使读者联想到主餐，但本节直接叙述的是耶稣为食物感谢。译文不扩展为原文没有明说的圣礼解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“献上感谢”比口语“道谢”更符合向上帝感谢的语境，同时未在正文中补出希腊文省略的对象；分号清楚呈现耶稣交给门徒、门徒再交给人群的两阶段分发。
