  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: zh_hans
  text: 但他们敬拜我，却是徒然的；把人的诫命当作教义来教导。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所教导的教义，不过是人的诫命。”
    reason: 原文中“教义”和“人的诫命”之间的关系表达得较为压缩，可作同位式理解。
lexical_decisions:
- source_word: μάτην
  choice: 也是徒然
  rationale: 该副词表示“毫无功效、徒劳”。“也是徒然”在现代汉语中自然庄重，并保留先知话语的责备语气。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接上文并带有轻微转折；“但”符合上下文中的对比和责备意味。
- source_word: σέβονταί με
  choice: 他们敬拜我
  rationale: σέβομαι用于对神的敬奉或崇敬；“敬拜”准确表达以神为对象的宗教行为。
- source_word: διδάσκοντες
  choice: 他们……来教导
  rationale: 现在分词说明其敬拜之所以徒然的伴随情形或方式。以分号连接两个分句，保留这种联系而不把它限定为时间或原因。
- source_word: διδασκαλίας
  choice: 当作教义
  rationale: 此词与ἐντάλματα构成紧密而略显压缩的关系；“当作教义”自然表达他们赋予人的诫命以教义权威的意思。
- source_word: ἐντάλματα
  choice: 诫命
  rationale: 该词指具有约束力的命令或规条。“诫命”保留正式的宗教语域，也与经文引语的背景相称。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: ἄνθρωπος在此为泛指，强调来源于人而非神；汉语“人的”自然涵盖所有人，并清楚呈现神与人的对比。
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων的压缩句法
  choice: 把人的诫命当作教义来教导
  alternative: 所教导的教义，不过是人的诫命
  rationale: 原文可理解为把“人的诫命”作为“教义”来传授。正文明确呈现这一关系，却不额外规定这些教导的具体内容；脚注保留更贴近同位关系的另一种表达。
- issue: διδάσκοντες与主句的逻辑关系
  choice: 用分号连接，不明说“因为”
  alternative: 因为他们把人的诫命当作教义来教导
  rationale: 分词可暗示原因，也可表示伴随方式。正文不加入明确的因果连词，以保存原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“敬拜”“诫命”“教义”保持经文所需的宗教语域；分号既使句意清楚，也避免把希腊语分词的逻辑关系解释得过死。
