  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: zh_hans
  text: 但你们却说：‘无论谁对父亲或母亲说：“你本来可以从我得到的，无论是什么，都是供物[a]，”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”。这里的“供物”指献作宗教礼物之物；本句所指的是原可用来帮助父母的财物被这样宣布。参马可福音7:11，那里使用“各耳板”一词。
    reason: 说明δῶρον的词义范围及本句语境，同时不把马可福音所用的专门术语或本节未明说的细节写入正文。
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: 但你们却说
  rationale: δὲ承接上文并形成鲜明对比；“但……却……”自然体现其转折和责备语气。
- source_word: Ὃς ἂν εἴπῃ
  choice: 无论谁……说
  rationale: 关系代词加ἄν及虚拟语气表达泛指条件，“无论谁”保留普遍概括的力量。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 对父亲或母亲
  rationale: 与格表示说话的对象；汉语无须补出物主代词，亲属关系可由语境自然理解。
- source_word: Δῶρον
  choice: 作为礼物献给上帝
  rationale: δῶρον可指“礼物”或献给上帝的“供物”。本句语境涉及将财物奉献，从而不再用来供养父母；译文保留“礼物”的基本词义，并明确汉语中否则难以显出的奉献指向。
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: 你本来可以从我得到的供养
  rationale: 原句直指父母原可从说话者获得的益处。ὠφεληθῇς为被动形式；“本来可以……得到”保留未实现的受益意味，“供养”结合父母语境自然表达实际帮助。
theological_decisions:
- issue: 是否把马可福音7:11的专门术语“各耳板”引入马太的正文
  choice: 正文保留马太所用δῶρον的词义，译作“礼物”
  alternative: 译作“各耳板”或“献给上帝的供物”
  rationale: 马太使用δῶρον，而非马可所见的κορβᾶν。正文不引入另一处经文的音译术语；脚注说明其在这里指献给上帝之物。
- issue: 是否明确礼物献给谁
  choice: 译作“作为礼物献给上帝”
  alternative: 仅译作“是礼物”
  rationale: 在当时宗教语境中，δῶρον指奉献给上帝的礼物。若汉语只说“是礼物”，句意会突兀且容易误解；补明接受者传达语境隐含信息，并由脚注标示其解释性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“供养”准确契合子女对父母的物质扶助；引号结构保留耶稣转述对方说法及其中话语的层次。本节句法延续至下一节，因此结尾不作完整句处理。
