  source_fidelity: “已经作为礼物献给上帝了”超出了本节希腊文的明示内容：δῶρον意为“礼物／供物”，但原文没有“已经”、没有完成式的“献给了”，也没有明确写出“上帝”。“供养”虽符合上下文，却把较宽泛的ὠφεληθῇς（得益、受帮助）具体化得过强。
  naturalness: 现有中文整体通顺，但“你本来可以从我得到的供养”与“已经作为礼物献给上帝了”将解释性背景置入正文。改为“你本来可以从我得到的，无论是什么，都是供物”保留原文的省略和未完句式，也在现代汉语中自然可懂。
  terminology: δῶρον在此采用“供物”，既保留其献礼语境，也不把马可福音的“各耳板”直接移入马太正文。脚注说明其基本词义及语境，不将“献给上帝”当作本节逐字明说的内容。
