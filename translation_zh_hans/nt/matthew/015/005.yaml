  to: 但你们却说：‘无论谁对父亲或母亲说：“你本来可以从我得到的，无论是什么，都是供物[a]，”’
  rationale: 修订以希腊文为先：保留“但你们却说”的对比、泛指的“无论谁”、以及原文在本节末尚未完结的引语结构。将解释性较强的“已经作为礼物献给上帝了”收回脚注；以“供物”传达δῶρον在此的礼仪语境，并以“你本来可以从我得到的，无论是什么”较完整地对应ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς，而不窄化为物质供养。
