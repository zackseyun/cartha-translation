    rationale: 上下文确实涉及奉养父母，但该词本义是“得益／受帮助”。正文宜保留较宽的表达，具体的父母供养背景可在脚注解释。
  - severity: low
    issue: 脚注锚点置于引语结束后
    rationale: 脚注专门解释δῶρον，锚点宜紧随“供物”，以明确所注词语。
