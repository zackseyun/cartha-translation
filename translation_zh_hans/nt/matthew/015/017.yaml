  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: zh_hans
  text: 难道你们不明白吗？凡进入口里的，都进到腹中，最后排到厕所里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厕所”或译“便所、粪坑”；该词也可指排污沟一类的排泄处。
    reason: ἀφεδρών指排泄之处；具体所指设施及其现代对应词存在词义上的选择。
lexical_decisions:
- source_word: νοεῖτε
  choice: 明白
  rationale: 这里指领会耶稣所讲的道理；“明白”自然地传达责问语气。
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: 凡进入……的
  rationale: 中性单数冠词化分词具有概括意义；“凡……的”保留其广泛指称，也符合现代汉语表达。
- source_word: εἰς τὸ στόμα
  choice: 进入口里
  rationale: 保留 εἰς 所表达的向内运动及原文具体的身体意象。
- source_word: κοιλίαν
  choice: 腹中
  rationale: 此处语境明确指消化系统；“腹中”准确、庄重，也比严格限定为现代解剖意义的“胃”稍宽，符合 κοιλία 的语义范围。
- source_word: χωρεῖ
  choice: 进到
  rationale: 在消化语境中表示食物进入或移行至腹中；“进到”简洁自然。
- source_word: ἀφεδρῶνα
  choice: 茅厕
  rationale: 该词指排泄之处、厕所或便所；“茅厕”能体现古代设施，又不至于过分粗俗。
- source_word: ἐκβάλλεται
  choice: 被排到
  rationale: 保留被动形式和排出体外的过程；与地点短语“茅厕里”自然搭配。
theological_decisions:
- issue: 耶稣这句话与礼仪洁净条例的关系
  choice: 按原文直译其关于消化和排泄的陈述，不在本节增添“因此各样食物都是洁净的”等解释。
  alternative: 加入解释性措辞，明说所有食物由此被宣告为洁净。
  rationale: 本节本身描述入口之物的生理过程，以支持耶稣关于真正污秽来源的论证，但没有马可福音7:19中的解释性语句；不增补可保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们还不明白吗”保留原文责问语气；“腹中”避免把 κοιλία 过度限定为单一器官；正文中的脚注标记与脚注相对应。
