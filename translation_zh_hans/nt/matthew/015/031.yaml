source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: zh_hans
  text: 以致众人看见不能说话的人说话[a]、肢体残缺的人恢复健全[b]、瘸腿的人行走、失明的人看见，就都惊奇；他们也荣耀以色列的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“聋人说话”。希腊语这个词既可指耳聋的人，也可指不能说话的人；这里因紧接着说“说话”，正文译作“不能说话的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“肢体受损的人康复”或“肢体残缺的人变得健全”。原文描述肢体残缺或受损的人处于健康、健全的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 自然表达前述医治所产生的结果，保留希腊语的结果含义。
- source_word: ὄχλον
  choice: 众人
  rationale: 符合叙事场景和现代汉语习惯，也准确指在场的人群。
- source_word: θαυμάσαι
  choice: 惊奇
  rationale: 表达众人因亲眼看见这些医治而产生的惊异反应。
- source_word: βλέποντας
  choice: 看见
  rationale: 说明众人惊奇的原因，保留亲眼目睹的含义。
- source_word: κωφοὺς
  choice: 哑巴
  rationale: κωφός可指耳聋或不能说话的人；这里与“说话”直接对照，因此正文采用“哑巴”。
- source_word: λαλοῦντας
  choice: 说话
  rationale: 直接、自然地表达恢复言语能力。
- source_word: κυλλοὺς ὑγιεῖς
  choice: 肢体残缺的人恢复健全
  rationale: κυλλός指肢体残缺、畸形或受损的人，ὑγιής描述其成为健全的状态；此译也与后面的“瘸子”有所区分。
- source_word: χωλοὺς περιπατοῦντας
  choice: 瘸子行走
  rationale: 准确保留原文中原先行动不便者如今行走的鲜明对照。
- source_word: τυφλοὺς βλέποντας
  choice: 瞎子看见
  rationale: 保留原文简洁而有力的对照结构。
- source_word: ἐδόξασαν
  choice: 荣耀
  rationale: 保留δοξάζω向神归荣耀、尊崇神的神学分量。
- source_word: τὸν θεὸν Ἰσραήλ
  choice: 以色列的神
  rationale: 忠实保留原文对神的称谓及其与以色列的关系。
theological_decisions:
- issue: κωφός在“κωφοὺς λαλοῦντας”中的含义
  choice: 哑巴说话
  alternative: 聋人说话
  rationale: 该词确可指聋人或哑巴，但紧接的“说话”使恢复言语能力成为最直接的对照；脚注保留另一可能。
- issue: δοξάζω用于人对神的回应
  choice: 荣耀以色列的神
  alternative: 赞美以色列的神
  rationale: “荣耀”较完整地保留将荣耀归给神的含义，而不把它缩减为一般性的赞美。
- issue: κυλλοὺς ὑγιεῖς所描述的医治
  choice: 肢体残缺的人恢复健全
  alternative: 残疾的人康复
  rationale: 正文既体现κυλλός所指肢体残缺或受损，也按ὑγιεῖς的形容词含义表达恢复后的健全状态，并避免与χωλός所指的“瘸子”混同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。四组医治尽量保持原文并列、简洁的节奏；用“肢体残缺的人”与“瘸子”作出必要区分。正文中的[a]、[b]与脚注逐一对应。
