  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: zh_hans
  text: 他遣散众人后，就上了船，来到马加丹一带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“马加大拉”，而不是“马加丹”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: 遣散……后
  rationale: 不定过去时分词表示先于主要动作发生的行动；“遣散”自然表达让群众离开的意思。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 原文为复数，指聚集的群众；现代汉语用“众人”简洁自然，不必生硬译作“众群众”。
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: 上了船
  rationale: 这是表示登船的常见表达；“上了船”准确、自然，并保留具体动作。
- source_word: ἦλθεν
  choice: 来到
  rationale: 按叙事中的移动语境译为“来到”，既贴近ἔρχομαι，也与目的地自然衔接。
- source_word: τὰ ὅρια
  choice: 一带
  rationale: 复数ὅρια在这里不是单指边界线，而是指某地周边的区域；“一带”符合现代汉语地理表达。
- source_word: Μαγαδάν
  choice: 马加丹
  rationale: 依SBLGNT正文音译该地名；异文“马加大拉”置于脚注说明。
theological_decisions:
- issue: 本节末尾地名的文本形式
  choice: 马加丹
  alternative: 马加大拉
  rationale: 这是经文文本与地名形式问题，并非教义判断。正文遵从所给SBLGNT的Μαγαδάν，同时在脚注保留抄本异文，以呈现文本证据。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文隐含主语为“他”，不额外补入姓名；脚注标记置于相关地名所在句末，避免误以为异文涉及“众人”。
