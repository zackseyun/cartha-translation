  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: zh_hans
  text: 不是进入口里的东西使人污秽[a]，而是从口里出来的东西——这才使人污秽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人污秽”也可译作“使人成为不洁净的”；原文用词可指人在洁净意义上受到玷污或成为不洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: 使人污秽
  rationale: 在本段洁净与不洁净的语境中，该动词表示使人成为不洁或受玷污。“使人污秽”既保留礼仪层面的含义，也能承载道德层面的意味，不会缩减为一般的肮脏或卫生问题。
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: 进入口里的东西
  rationale: 带冠词的分词在此作名词用；译成“……的东西”符合现代汉语，也保留了进入口中的具体意象。
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: 从口里出来的东西
  rationale: 以自然汉语表达名词化分词，并明确保留ἐκ所表示的“从……出来”。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 希腊文单数名词在这里具有泛指、代表性用法。汉语“人”自然涵盖任何人，同时保留单数类指功能，无须人为增添性别限制。
- source_word: τοῦτο
  choice: 这才
  rationale: 用“这才”明确呈现指示代词的强调作用，突出真正使人污秽的是从口里出来的东西。
- source_word: οὐ ... ἀλλὰ
  choice: 不是……而是……
  rationale: 这是现代汉语中清楚、自然的对照结构，准确传达原文鲜明的否定与转折。
theological_decisions:
- issue: κοινόω所含的洁净观念
  choice: 译作“使人污秽”，保留礼仪不洁与道德玷污两方面的可能意味。
  alternative: 译作“使人成为不洁净的”或“玷污人”。
  rationale: 本句置于有关洁净的争论中，但耶稣的话又把焦点引向从口而出的内容。译文不应预先把含义限定为单纯礼仪状态或纯粹道德败坏。
- issue: ἄνθρωπον的泛指作用
  choice: 译作“人”。
  alternative: 译作“一个人”或“那人”。
  rationale: 原文虽为单数，但在此代表一般人类个体。现代汉语的“人”可以自然保留这种泛指作用，且不需要添加原文没有强调的男性含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“进入口里”与“从口里出来”形成清楚对照；破折号和“这才”共同保留原文τοῦτο的强调。
