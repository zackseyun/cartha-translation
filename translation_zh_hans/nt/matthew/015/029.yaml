  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: zh_hans
  text: 耶稣离开那里，来到加利利海边[a]。他上了山，坐在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿着加利利海而行。”希腊语介词既可表示来到海边，也可表示沿着岸边移动。
    reason: lexical_alternative
  - marker: b
    text: “坐在那里”也可译作“当时正坐在那里”；希腊语未完成过去时可突出持续的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: 离开那里
  rationale: 不定过去时分词表示相对于主句动词在先的行动；汉语按叙事顺序译为“离开那里”，自然且保留动作先后。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι的不定过去时在此表示移动到某处；“来到”符合现代汉语叙事习惯。
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: 加利利海边
  rationale: παρά接宾格并与移动动词连用，可指来到海边，也可指沿海而行；正文采用简洁自然的“海边”，并以脚注保留方向上的歧义。
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: 上了山
  rationale: 不定过去时分词表达在先动作；“上了山”自然传达登上山地或山坡，不把定冠词误解为一座已明确命名的山。
- source_word: ἐκάθητο
  choice: 坐在那里
  rationale: κάθημαι的未完成过去时描写当时持续的坐姿或状态；汉语正文无需强加“坐下”的起始含义，脚注说明其持续意味。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点副词“那里”。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。两个分句按希腊文动作顺序展开；不以生硬的分词结构复制原文句法，也不把“坐”明确改成“坐下”，以免消除未完成过去时所保留的状态性。
