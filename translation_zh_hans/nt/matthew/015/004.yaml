  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: zh_hans
  text: 因为上帝说：“要孝敬父亲和母亲。”又说：“咒骂父亲或母亲的，必须死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: 因为上帝
  rationale: γάρ承接上文，为耶稣的论证提出依据；“因为”自然保留其解释、因果作用，不额外强化主语。
- source_word: εἶπεν
  choice: 说
  rationale: 此处λέγω引出经文引语；“说”保留普通词义，不因引文内容是命令而改译为“吩咐”。
- source_word: Τίμα
  choice: 要孝敬
  rationale: τιμάω指给予父母当得的尊荣；在现代汉语的诫命语境中，“孝敬”庄重、自然，并包含尊重和实际奉养的伦理分量。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父亲和母亲
  rationale: 希腊文有定冠词而无物主代词；汉语诫命表达无需补出“你的”，仍能自然指向受命者的父母。
- source_word: Ὁ κακολογῶν
  choice: 咒骂……的
  rationale: κακολογέω可指恶言毁谤、辱骂或咒诅；在所引法律文本的亲子语境中，“咒骂”凝练地保留言语攻击及咒诅色彩。
- source_word: πατέρα ἢ μητέρα
  choice: 父亲或母亲
  rationale: 按其泛指结构直译，不补入希腊文未明说的物主代词。
- source_word: θανάτῳ τελευτάτω
  choice: 必须处死
  rationale: 这是庄严的死刑判决公式。虽然字面结构可表达“必死”，其所引法律语境表明是司法处死；“必须处死”在现代汉语中清楚呈现其法律效力。
theological_decisions:
- issue: 所引律法中死刑公式的译法
  choice: 必须处死
  alternative: 必要死；必定死
  rationale: θανάτῳ τελευτάτω本身未直接点明执行者，但在出埃及记律法引文中是死刑判决公式。“必须处死”准确传达法律语境，同时不添加谁来执行。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“孝敬”沿用现代汉语中自然且广为理解的诫命用语；两个引语分句清晰呈现原文的并列结构。
