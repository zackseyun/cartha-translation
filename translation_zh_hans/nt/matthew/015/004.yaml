  source_fidelity: “因为上帝说”恰当体现γάρ的论证性因果及εἶπεν；“要孝敬父亲和母亲”准确、自然地传达Τίμα τὸν πατέρα καὶ τὴν μητέρα。“咒骂”可用于κακολογῶν在此律法引文语境中的恶言辱骂／咒诅含义。可是“必须处死”在现代汉语通常要求一个施事，且较明确地表述由人执行；θανάτῳ τελευτάτω虽为严正的死刑公式，却未明确执行者。宜改为不预设施事的“必须死”。
