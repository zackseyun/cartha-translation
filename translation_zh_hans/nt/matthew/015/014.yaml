  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: zh_hans
  text: 任凭他们吧！他们是瞎眼的向导，给瞎眼的人领路。[a]如果一个盲人给另一个盲人带路，两个人都会掉进坑里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本缺少“他们是瞎眼的向导，给瞎眼的人领路”这一整句。
    reason: textual_variant
  - marker: b
    text: “坑”也可译作“沟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: 任凭他们吧
  rationale: 这里的 ἀφίημι 是“任其如此、不要管”的命令，并非“赦免”；“任凭他们吧”在现代汉语中自然，也保留了吩咐中决然的语气。
- source_word: τυφλοί
  choice: 瞎眼的／瞎子
  rationale: 保留原文关于“失明”的鲜明比喻，不在正文中解释为“属灵瞎眼”或“无知”。谓语处用“瞎眼的”，谚语式单数处用自然的类称“瞎子”。
- source_word: ὁδηγοὶ τυφλῶν
  choice: 给瞎眼的人领路的向导
  rationale: ὁδηγός 是“向导、领路者”；属格 τυφλῶν 可表达其所引领的对象。这样的译法保留向导和领路的连续意象。
- source_word: τυφλὸς ... τυφλὸν
  choice: 瞎子给瞎子
  rationale: 原文以单数构成泛指性的谚语。汉语“瞎子给瞎子领路”自然简洁，并不限定为男性。
- source_word: ἐὰν ὁδηγῇ
  choice: 如果……领路
  rationale: ἐάν 加虚拟式构成一般条件句；“如果……领路”准确表达这一条件关系，并与“向导”的意象一致。
- source_word: ἀμφότεροι
  choice: 两个人都
  rationale: 明确表达双方无一例外，同时符合现代汉语习惯。
- source_word: εἰς βόθυνον
  choice: 掉进坑里
  rationale: βόθυνος 可指坑、沟或洞；“坑”范围较广，形象而自然，正文采用此义，脚注保留“沟”的可能。
- source_word: πεσοῦνται
  choice: 都会掉进
  rationale: 准确呈现将来结果；“掉进”与处所补语“坑里”搭配自然。
theological_decisions:
- issue: “瞎眼”的比喻意义
  choice: 正文保留“瞎眼／瞎子”的比喻，不加解释
  alternative: 译作“灵性瞎眼”或“无知的领袖”
  rationale: 原文让语境承担比喻解释；在正文中明说其属灵含义会缩小比喻的张力，并加入原文未明说的诠释。
- issue: 谚语中单数阳性形式的表达
  choice: 译作类称性的“瞎子给瞎子”
  alternative: 译作“一个瞎眼的男人给另一个瞎眼的男人”
  rationale: 希腊语阳性单数在此具有代表性、泛指性。现代汉语“瞎子”不标示男性，既保持单数谚语结构，又避免误导读者以为只适用于男性。
- issue: 异文所造成的句法差异
  choice: 正文依 SBLGNT 译为“他们是瞎眼的向导，给瞎眼的人领路”
  alternative: 较短读法：“他们是瞎眼的向导”
  rationale: 所给 SBLGNT 正文含 τυφλῶν（“瞎眼之人的”），应在正文中体现；同时以脚注说明部分抄本缺少这一成分。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“任凭他们吧”传达命令语气；后半句保持简洁的谚语节奏。正文中的脚注标记均置于相应内容之后。
