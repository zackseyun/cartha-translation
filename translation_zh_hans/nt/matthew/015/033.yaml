  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: zh_hans
  text: 门徒对他说：“在这荒僻的地方[a]，我们哪来这么多饼[b]，能让这么一大群人都吃饱[c]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在这荒野中”或“在这无人居住的地方”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“这么多个饼”；这里的“饼”也可按食物的集合意义理解。
    reason: lexical_alternative
  - marker: c
    text: 或译“喂饱”；这个希腊词指让人充分进食、得到饱足。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: 说
  rationale: 这是希腊叙事中常见的历史现在时；现代汉语叙事用“说”即可自然表达，不必另加过去时标记。
- source_word: οἱ μαθηταί
  choice: 门徒
  rationale: 定冠词表明这是上下文中已知的那群门徒；汉语无需补出原文未明说的“他的”。
- source_word: Πόθεν ἡμῖν
  choice: 我们哪来
  rationale: Πόθεν询问来源，ἡμῖν表示与门徒有关；“我们哪来”既符合现代汉语习惯，也保留了反问式的困惑语气。
- source_word: ἐν ἐρημίᾳ
  choice: 在这荒僻的地方
  rationale: ἐρημία指无人居住或偏僻荒凉之地；“荒僻的地方”不把场景限定为沙漠，“这”则自然指向眼前处境。
- source_word: ἄρτοι τοσοῦτοι
  choice: 这么多饼
  rationale: 保留ἄρτοι的复数数量意象和τοσοῦτοι“这么多”的强调；“饼”在汉语中也可自然地统指这类食物。
- source_word: ὥστε χορτάσαι
  choice: 能让……吃饱
  rationale: ὥστε加不定式表达足以产生的结果；χορτάσαι强调使人充分进食而饱足，“能让……吃饱”自然且准确。
- source_word: ὄχλον τοσοῦτον
  choice: 这么一大群人
  rationale: “一大群人”自然表达ὄχλος，“这么”保留τοσοῦτον对人数规模的强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“我们哪来……”传达门徒面对现实条件时的疑问；“都”虽无独立对应词，却自然凸显要使整群人饱足的范围，未改变原意。脚注标记均紧随相关词语。
