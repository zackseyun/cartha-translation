  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: zh_hans
  text: 他就根本不必孝敬[b]自己的父亲了。而你们因自己的传统，废掉了神的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“神的诫命”，而不是“神的话”。
    reason: textual_variant
  - marker: b
    text: 这里的“孝敬”很可能包括实际奉养父母的责任，并不只是表示尊重。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: 根本不必孝敬
  rationale: οὐ μή构成强烈否定；结合上文所述传统判例，此处不是单纯预告将来不会孝敬，而是表示孝敬父亲的义务被免除。“根本不必”既体现强调语气，也自然传达上下文含义。
- source_word: τὸν πατέρα αὐτοῦ
  choice: 父亲
  rationale: 原文明确使用单数“他的父亲”；汉语主语已经表明所属关系，无须重复“他的”，也不扩写为“父母”。
- source_word: ἠκυρώσατε
  choice: 废掉了
  rationale: ἀκυρόω指使某事失效、作废。“废掉”简洁有力，保留了耶稣指责他们使神的话失去效力的强烈语气。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神的话
  rationale: 依照SBLGNT正文翻译λόγον（“话”），不以异文ἐντολήν（“诫命”）替换正文。
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: 因自己的传统
  rationale: διά加宾格在此表示原因；“因”准确简练。“自己的”自然表达ὑμῶν，并突出这传统属于受责备者，而非来自神。
- source_word: καὶ
  choice: 这样……就
  rationale: καί在论证中承接前述做法及其结果。汉语用“这样……就”比机械译作“并且”更自然，同时没有增加新的因果内容。
theological_decisions:
- issue: 是否把τιμάω明确译成供养父母
  choice: 正文译作“孝敬”，并在脚注说明其中包括实际奉养责任。
  alternative: 直接译作“供养”或“照顾”。
  rationale: 争论确实涉及物质奉养，但τιμάω本义较宽，也呼应“当孝敬父母”的诫命。保留“孝敬”可避免把词义收窄，同时由脚注交代此处的实际含义。
- issue: 是否按上下文或异文协调正文
  choice: 依SBLGNT译作单数“父亲”和“神的话”。
  alternative: 扩写为“父亲或母亲”，或采用异文译作“神的诫命”。
  rationale: 正文应忠实呈现所给希腊文本，不以邻近经文或异文替代；重要异文在脚注保留。
- issue: οὐ μή在此表达预言还是义务免除
  choice: 译作“根本不必”，表达传统判例宣称此人不再负有孝敬义务。
  alternative: 译作“绝不会”或“绝不可”。
  rationale: 强烈否定本身可有不同语用效果；结合上文献给神的宣告和本段对规避奉养责任的批评，义务免除的理解最符合语境，但不将“孝敬”窄化成单一经济行为。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“根本不必”保留强烈否定，“废掉”保持责备力度；脚注标记均置于正文相关词语之后。
