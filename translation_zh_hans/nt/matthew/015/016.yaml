  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: zh_hans
  text: 耶稣却说[a]：“连你们也还是不明白吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们到现在也还不明白吗？”
    reason: Ἀκμήν可显明译为“到现在还”，而καὶ ὑμεῖς也可较平直地译为“你们也”。
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: 耶稣却说
  rationale: ὁ在这里作代词用，按上下文指耶稣；现代汉语自然补明“耶稣”。δὲ表示回应中的轻微转折，用“却”体现；εἶπεν译为“说”。
- source_word: Ἀκμὴν
  choice: 还是
  rationale: Ἀκμήν在此表示一种持续到当前的状态，即“仍然、到现在还”；汉语用“还是”自然表达门徒至今仍未明白的责问语气。
- source_word: καὶ ὑμεῖς
  choice: 连你们也
  rationale: καὶ与明示且带强调的ὑμεῖς结合，突出门徒竟也包括在不明白的人之中；“连你们也”能传达这种意外和责备的意味。
- source_word: ἀσύνετοί ἐστε
  choice: 不明白吗
  rationale: ἀσύνετος在本段指缺乏理解或领悟，并非必然指道德上的愚蠢；“不明白”准确、自然，也避免无根据地加重责斥。疑问助词“吗”体现原文问句。
theological_decisions:
- issue: 耶稣责备门徒的语气
  choice: 译作带有惊讶和责备意味的反问：“连你们也还是不明白吗？”
  alternative: “你们到现在也还不明白吗？”
  rationale: 原文既指出门徒持续缺乏领悟，也以καὶ ὑμεῖς突出“你们也”；所选译文保留责备力度，却不把ἀσύνετος夸大为更严厉的道德定罪。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“连你们也还是”符合当代普通话反问表达，并保留原文的强调、持续性和温和但明确的责备。
