  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: zh_hans
  text: 因为邪恶的念头、谋杀、通奸、淫乱、偷窃、假见证和毁谤[a]，都是从心里出来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎”。原文这个词既可指毁谤人，也可指亵渎上帝，具体含义取决于上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: 因为从心里
  rationale: γάρ承接上文并作解释，译作“因为”；ἐκ表示来源，καρδία指人的内在生命与意志，保留“心”的圣经意象。
- source_word: ἐξέρχονται
  choice: 出来
  rationale: 直译其“出来、发出”之意，与“从心里”搭配，清楚呈现这些恶行源自人的内心。
- source_word: διαλογισμοὶ πονηροί
  choice: 邪恶的念头
  rationale: διαλογισμοί可指思想、盘算或谋划；“念头”自然且不把含义过度限定为阴谋。
- source_word: φόνοι
  choice: 凶杀
  rationale: 准确表达蓄意非法杀人的道德含义；汉语用集合性名词列举恶行，比机械复现希腊语复数更自然。
- source_word: μοιχεῖαι
  choice: 通奸
  rationale: 明确指破坏婚姻关系的性行为，现代汉语准确而庄重。
- source_word: πορνεῖαι
  choice: 淫乱
  rationale: 概括不正当的性行为，保留πορνεία较宽的语义范围，避免缩窄为某一种行为。
- source_word: κλοπαί
  choice: 偷窃
  rationale: 简洁、自然地表达盗取他人财物的行为。
- source_word: ψευδομαρτυρίαι
  choice: 作假见证
  rationale: 保留μαρτυρία的作证及法律语境，比泛称“说谎”更准确。
- source_word: βλασφημίαι
  choice: 毁谤
  rationale: 该词可指对人的毁谤，也可指对上帝的亵渎；在一般恶行清单中，正文采用较宽泛而自然的“毁谤”，并以脚注保留另一可能。
theological_decisions:
- issue: βλασφημίαι在恶行清单中的对象范围
  choice: 正文译作“毁谤”
  alternative: “亵渎”
  rationale: 上下文没有明确限定言语攻击的对象是人还是上帝。正文采用可指损害他人名誉之言的“毁谤”，脚注说明若对象为上帝，也可理解为“亵渎”，从而保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。保留“从心里出来”的来源意象；恶行清单使用汉语自然的集合性名词，不机械复制希腊语复数。脚注标记置于“毁谤”之后，与其所解释的词直接对应。
