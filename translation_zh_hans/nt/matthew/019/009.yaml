source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: zh_hans
  text: 但我告诉你们：无论谁与妻子离婚，若不是因为淫乱[a]，又娶别的女人，就是犯奸淫；娶已离婚的女人的，也犯奸淫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若不是以淫乱为理由。”希腊语πορνεία也可较狭义地译为“淫行”，或被一些人理解为“性方面的不忠”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“娶已离婚的女人的，也犯奸淫”这句话。
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: δέ承接上文并带轻微转折；“我告诉你们”自然表达λέγω加间接受词的权威陈述。
- source_word: ὃς ἂν
  choice: 无论谁
  rationale: 关系代词与ἄν构成泛指条件，译作“无论谁”既准确又符合现代汉语。
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: 休妻
  rationale: 在婚姻语境中ἀπολύω指解除婚姻。“休妻”简洁明确，并保留原文以丈夫休妻为所论个案的表述。
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: 若不是因为淫乱
  rationale: 表达例外条件；“淫乱”在当代圣经语体中可涵盖πορνεία所指的不正当性行为，而不把它窄化为“奸淫”。
- source_word: γαμήσῃ ἄλλην
  choice: 又另娶
  rationale: ἄλλην为阴性，隐含“另一个女人”；“另娶”自然传达再娶另一女子之意。
- source_word: μοιχᾶται
  choice: 就是犯奸淫
  rationale: 清楚表达该动词所指的通奸行为，并保留陈述性的道德判断。
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: 娶被休之妇的，也是犯奸淫
  rationale: 以泛指结构表达带冠词的分词短语；“被休之妇”保留完成时被动分词所表示的已遭离婚状态。
theological_decisions:
- issue: 例外条款中πορνεία的含义
  choice: 译为“淫乱”，作为涵盖性较广的表述
  alternative: 奸淫；婚前性行为；性方面的不忠
  rationale: πορνεία的语义范围通常比专指通奸的μοιχεία更广。正文不将其限定为某一种具体情形，脚注说明可能的较窄理解，以保留经文的解释张力。
- issue: 末句καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται的收录
  choice: 按SBLGNT所列文字收入正文，并加文本异文脚注
  alternative: 因部分抄本无此句而不收入正文
  rationale: 所提供的希腊文本收录该句，但以异文符号标示其文本不确定性；因此正文翻译，同时在脚注如实交代抄本证据差异。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“休妻”“另娶”“犯奸淫”在婚姻伦理语境中简明自然；正文保留原文从丈夫休妻这一具体个案出发的措辞。所有脚注标记均置于相关正文位置。
