id: MAT.19.24
reference: Matthew 19:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: zh_hans
  text: 我又告诉你们：骆驼[b]穿过针眼[a]，比富人进入上帝的国还容易。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“针孔”；原文指缝衣针上的孔。
    reason: lexical_alternative
  - marker: b
    text: 有人主张这里应理解为“绳索”，但所据希腊文本作“骆驼”。
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: 我又告诉你们
  rationale: πάλιν表示重复，译作“又”；δέ是轻微承接词，不必在现代汉语中另行直译；“告诉你们”自然保留直接对听众说话的语气。
- source_word: εὐκοπώτερόν ἐστιν
  choice: 还容易
  rationale: 这是比较结构，与后面的ἤ相呼应；汉语用“比……还容易”清楚而自然。
- source_word: κάμηλον
  choice: 骆驼
  rationale: 所据希腊文本明确作κάμηλον，通常意为“骆驼”；这一译法也保留原句鲜明而强烈的夸张画面。
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: 穿过针眼
  rationale: τρύπημα指孔洞，ῥαφίς指缝衣针；“针眼”是现代汉语对针上小孔自然、准确的称呼。
- source_word: εἰσελθεῖν
  choice: 穿过／进入
  rationale: 同一个不定式在两个比较项中按汉语搭配分别表达：骆驼“穿过”针眼，富人“进入”上帝的国；意义不变，表达更自然。
- source_word: πλούσιον
  choice: 富人
  rationale: 指富有的人；“富人”简洁、庄重，也不额外限定原文未强调的身份特征。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 进入上帝的国
  rationale: εἰς与εἰσελθεῖν共同表达进入；“上帝的国”保留这一核心国度用语，且避免把“国”误解为单纯地点之外再作解释。
theological_decisions:
- issue: 骆驼穿针眼这一比喻的解释
  choice: 保留骆驼穿过缝衣针针眼这一极强的夸张性不可能画面
  alternative: 将“针眼”解释为耶路撒冷某个所谓的小门，或把“骆驼”改读为“绳索”
  rationale: 所据希腊文本直陈“骆驼”和“针眼”，没有提供城门寓意；保留原有张力最能传达本句，并不在本节内提前消解其神学力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“比……还容易”使比较关系顺畅；冒号保留耶稣郑重引出格言式陈述的语气。
