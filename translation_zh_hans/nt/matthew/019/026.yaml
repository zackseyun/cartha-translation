id: MAT.19.26
reference: Matthew 19:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: zh_hans
  text: 耶稣却看着他们，说：“对人来说，这是不可能的；但对上帝来说，凡事都可能。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: 看着
  rationale: 表示把目光投向某人。“看着”符合现代汉语叙事习惯，也不把动作强化为“凝视”。
- source_word: δὲ
  choice: 却
  rationale: δέ在这里承接上文并带有轻微转折；“却”自然体现耶稣的话与门徒所感到的困难之间的对照。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 希腊文明确包含复数间接宾语αὐτοῖς；汉语以“他们”保留这一信息。句中因“看着他们，说”这一结构，受话对象已经清楚，无须重复“对他们”。
- source_word: παρὰ ἀνθρώποις
  choice: 对人来说
  rationale: παρά加与格在此表示所处范围或立场；“对人来说”自然表达这种意义。ἄνθρωποις泛指人类，并非特指男性，因此译为“人”。
- source_word: τοῦτο
  choice: 这
  rationale: 指向上文所谈的事情；“这”简洁自然，并保留指示词的回指作用。
- source_word: ἀδύνατόν ἐστιν
  choice: 是不可能的
  rationale: 直接、清楚地表达谓语形容词与系词的含义。
- source_word: παρὰ δὲ θεῷ
  choice: 但对上帝来说
  rationale: 与前面的παρὰ ἀνθρώποις形成平行对照；“但对上帝来说”在现代汉语中清楚自然。
- source_word: πάντα δυνατά
  choice: 凡事都可能
  rationale: 保留πάντα的总体范围和δυνατά的“可能”意义，同时形成简洁有力的格言式表达。
theological_decisions:
- issue: ἄνθρωποις在泛指陈述中的表达
  choice: 人
  alternative: 世人／人类
  rationale: 该复数名词在此泛指人类整体，而非男性群体。“人”在现代汉语中自然、包容，并与“上帝”构成简明对照。
- issue: πάντα δυνατά的范围
  choice: 凡事都可能
  alternative: 上帝凡事都能
  rationale: 原文是省略系词的“所有事都是可能的”，其范围受当前关于人得救之可能性的语境制约。译文保留原句的概括性，不额外加入宾语或把它扩展成脱离语境的全能命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对人来说……对上帝来说……”既保留原文两次παρά加与格的平行结构，也比生硬的“在人……在上帝……”更符合当代汉语表达。
