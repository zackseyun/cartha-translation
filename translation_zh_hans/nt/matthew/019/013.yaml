  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: zh_hans
  text: 那时，有人把孩子们带到耶稣面前，要他给他们按手并祷告；门徒却斥责他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的“他们”可能指孩子们，也可能指带孩子来的人。
    reason: 保留原文代词所指的真实歧义。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 表示叙事次序；“那时”自然、简洁，也符合庄重的现代汉语叙事语体。
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: 有人把孩子们带到耶稣面前
  rationale: 原文是被动式“孩子们被带到他那里”。汉语用“有人把……”更自然；“耶稣”按上下文补明代词所指，并未改变意义。
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: 要他给他们按手
  rationale: ἵνα表达目的；“按手”准确传达“把手放在……上”的动作，也是现代中文读者可理解的圣经惯用语。
- source_word: καὶ προσεύξηται
  choice: 祷告
  rationale: 原文只说“祷告”，没有明说“为他们祷告”，因此不增添宾语，以保留原文表达。
- source_word: οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς
  choice: 门徒却斥责他们
  rationale: δέ在此带出对比，用“却”自然呈现；ἐπιτιμάω语气较强，“斥责”比“责备”更贴近其力度。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 末尾代词可能指孩子，也可能指带孩子来的人；中文“他们”可以保留这一指代歧义。
theological_decisions:
- issue: 末尾αὐτοῖς所指对象
  choice: 他们
  alternative: 孩子们；带孩子来的人
  rationale: 希腊文代词在语法和语境上均可能有两种所指。正文不替原文作决定，并以脚注说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“按手”保留原文具体动作及常见圣经表达；分号呈现请求与门徒反应之间的转折。
