id: MAT.19.20
reference: Matthew 19:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: zh_hans
  text: 那年轻人对他说：“这一切我都遵守了[a]，还缺少什么呢？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切我都谨守了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我还有什么不足呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事中直接译作“说”自然得体，不必机械标示时态。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与 λέγει 合译为现代汉语惯用表达“对他说”。
- source_word: ὁ νεανίσκος
  choice: 那年轻人
  rationale: νεανίσκος 指年轻男子；不加入本节没有明说的“官”或“财主”等身份。“那”承接上文已出现的人物。
- source_word: Πάντα ταῦτα
  choice: 这一切
  rationale: 指前文刚列出的各条诫命，简洁自然，并保留中性复数所表达的概括范围。
- source_word: ἐφύλαξα
  choice: 我都遵守了
  rationale: φυλάσσω 在诫命语境中表示遵守、谨守；“遵守”比字面的“守住”更符合现代汉语用法。“了”表达既往行为与当前自我评价的关联。
- source_word: τί
  choice: 什么
  rationale: 在直接问句中自然译为“什么”。
- source_word: ἔτι
  choice: 还
  rationale: 表达尚有余留、进一步欠缺之意，符合现代汉语口语与书面语。
- source_word: ὑστερῶ
  choice: 缺少
  rationale: ὑστερέω 可表示缺少、欠缺或未达到；正文“缺少”简明且不预先限定所缺的是事物、行为还是资格。
theological_decisions:
- issue: 年轻人对自己守诫命情况的评价
  choice: 直接保留他的自我陈述，不暗示经文赞同、讽刺或否定
  alternative: 译文可暗示他的说法自负、错误或言过其实
  rationale: 希腊文本身平直记录这一宣称；其真实性及属灵意义应由上下文呈现，不由译文预先裁断。
- issue: ὑστερῶ 所指的欠缺
  choice: 译为开放性的“缺少什么”
  alternative: 具体化为“哪一点还没有做到”或“离完全还差什么”
  rationale: 原文没有明确限定欠缺的类别；保留开放性可维持其语义与神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。对话保持简洁；“那年轻人”承接上下文，“这一切”回指前述诫命。脚注标记均置于正文相应位置。
