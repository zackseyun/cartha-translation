  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: zh_hans
  text: 于是彼得回答他说：“你看，我们已经撇下一切，跟从了你；那么，我们会得到什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 你看
  rationale: 保留引起对方注意的语用功能，比古雅的“看哪”更符合现代普通话。
- source_word: ἀφήκαμεν πάντα
  choice: 我们已经撇下一切
  rationale: “撇下”自然表达为跟从耶稣而离开原有的人事物；“一切”保留原文的概括性。
- source_word: ἠκολουθήσαμέν σοι
  choice: 跟从了你
  rationale: “跟从”兼具实际随行与门徒身份的含义，贴合本段语境。
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: 那么，我们会得到什么呢
  rationale: 原文直译近于“那么，对我们会有什么”；中文以“会得到什么”自然传达彼得询问自己一方将有什么回报或所得，同时不具体限定其内容。
theological_decisions:
- issue: 彼得所问的回报性质
  choice: 保持“什么”的开放性，不说明是今生、来世、地位或奖赏
  alternative: 译为“我们会得到什么奖赏呢”
  rationale: 原文未出现“奖赏”一词，具体内容由下文回答展开，不宜在本节预先限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文；“你看”自然呈现彼得强调门徒处境的口吻。
