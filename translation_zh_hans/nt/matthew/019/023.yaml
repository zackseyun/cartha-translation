  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: zh_hans
  text: 于是，耶稣对他的门徒说：“我实在告诉你们，富人要进天国，是很难的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 于是
  rationale: 承接前文那人忧愁离去的叙事进展；“于是”自然表达转折后的推进，而不把连接词省略。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对他的门徒
  rationale: 保留原文明确的所属代词 αὐτοῦ；“门徒”是福音书语境中 μαθηταί 的通行译法。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以现代汉语自然表达耶稣郑重宣告的固定句式；“实在”传达 Ἀμήν 在句首所强调的真实性与权威性。
- source_word: πλούσιος
  choice: 富人
  rationale: 该形容词在此作名词使用，指一个富有的人。“富人”简洁、自然，也没有“财主”可能带出的额外贬义。汉语名词本身不标语法性别，无须添加原文未明说的“男人”。
- source_word: δυσκόλως
  choice: 是很难的
  rationale: 表达“困难地、艰难地”的方式意义，不提前强化为近乎不可能；不可能性的鲜明比喻在下一节展开。
- source_word: εἰσελεύσεται
  choice: 要进
  rationale: “要”在此自然承载将来与情态色彩，“进”直接表达进入，符合现代汉语习惯。
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: 天国
  rationale: 这是马太福音中该固定短语自然且通行的汉语表达；“国”保留王权、国度的概念，“天”按汉语习惯不机械体现希腊语复数。
theological_decisions:
- issue: 富人进入天国的难度
  choice: 富人要进天国，是很难的
  alternative: 富人几乎不能进天国
  rationale: δυσκόλως 表示“困难地”，本节本身尚未直接说“几乎不能”。所选译法保留本节的措辞力度，也让下一节关于骆驼与针眼的说法继续发挥其加强作用。
- issue: Ἀμήν 在耶稣宣告句式中的表达
  choice: 我实在告诉你们
  alternative: 阿们，我告诉你们
  rationale: “实在”清楚传达句首 Ἀμήν 的郑重确认作用；直接音译“阿们”虽较形式对应，却容易被普通读者首先理解为祷告结语。
- issue: πλούσιος 的语法阳性
  choice: 富人
  alternative: 富有的男人
  rationale: 希腊语形式为阳性单数，但此处作为代表性个体提出一般论断。现代汉语“富人”不标语法性别；增译“男人”会不自然地突出生理性别，并可能缩窄该警告的适用范围。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“我实在告诉你们”保留福音书宣告句式的郑重感；“富人要进天国，是很难的”使用自然汉语话题结构，同时紧贴原文语义，不把困难预先解释成绝对不可能。
