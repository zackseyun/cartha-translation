source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: zh_hans
  text: 耶稣却说：“让孩子们到我这里来，不要拦阻他们来，因为天国属于这样的人。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译可作：“因为天国是这样之人的。”
    reason: lexical_alternative
  - marker: b
    text: “这样的人”既可指眼前这些孩子，也可泛指属于这一类的人；原文没有明说相似之处是什么。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  choice: 让
  rationale: 这里的 ἀφίημι 是准许、容让之意；“让……来”在现代汉语中自然地表达了命令语气，并不误解为“离开”。
- source_word: τὰ παιδία
  choice: 孩子们
  rationale: παιδία 指儿童，语境中可能偏年幼；“孩子们”准确自然，又不额外强化为“婴孩”或“小孩子”。
- source_word: μὴ κωλύετε
  choice: 不要拦阻
  rationale: κωλύω 可指拦阻、阻止或禁止；“不要拦阻”保留其一般含义，也符合庄重而通俗的现代汉语表达。
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: 他们……到我这里来
  rationale: 与“拦阻”结合后，汉语用“不要拦阻他们”即可自然承接前句“到我这里来”，清楚表达他们来到耶稣面前的意思，同时避免累赘重复。
- source_word: τῶν γὰρ τοιούτων
  choice: 因为……属于这样的人
  rationale: τοιούτων 不仅指现场这些具体的孩子，也具有“这一类人”的代表意味；“这样的人”保留了这种开放性，没有擅自说明他们究竟在哪一方面像孩子。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是马太这一特有表达在现代汉语中的准确、简洁且通行的译法。
- source_word: ἐστὶν
  choice: 属于
  rationale: 希腊文以属格 τῶν τοιούτων 配合 ἐστίν，直译近于“天国是这样之人的”；译为“属于”能以自然汉语表达这一所属关系，又不作进一步神学阐释。
theological_decisions:
- issue: 耶稣所说的是仅限于眼前的儿童，还是也包括具有某种相似特征的人
  choice: 译作“这样的人”，同时保留对眼前孩子的直接指向和更广的类别含义。
  alternative: 可窄译为“这些孩子”，或解释性地译为“像孩子一样的人”。
  rationale: τοιούτων 表示“这样的、这一类的”，但经文本身没有明确指出所强调的是儿童的哪一种特征。译作“这样的人”保留原文的神学张力，既不把范围限制为在场儿童，也不自行补出“像孩子一样”的具体含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣却说”保留 δέ 的转折推进；命令句简洁直接。两处脚注标记均置于其所说明的末句之后。
