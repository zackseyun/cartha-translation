  rationale: 修订仅改善现代普通话的自然度：以“又说”替代较生硬的“并且说”，并以“结合”替代不常用的“连合”。保留本节作为承接上文的问句，保留性别明确的婚姻引文、二人的明示，以及“成为一体”的既定婚姻合一隐喻。
