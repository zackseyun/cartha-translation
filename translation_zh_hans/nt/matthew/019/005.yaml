id: MAT.19.5
reference: Matthew 19:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: zh_hans
  text: 又说：“因此，男人要离开父亲和母亲，与妻子结合[a]，二人成为一体。”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译“与妻子联合”或“依附妻子”。原文动词表示紧密地联结或依附。
    reason: 说明 κολληθήσεται 的词义范围，并保留其可能侧重紧密依附的语义。
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: 因此
  rationale: 保留因果和推论意味，同时符合现代汉语引述经文时的自然表达。
- source_word: καταλείψει
  choice: 要离开
  rationale: 既体现将来时，也可表达这段婚姻格言中的规范性结果；比“将离弃”自然，且避免暗示不当抛弃。
- source_word: ἄνθρωπος
  choice: 男人
  rationale: 这里与“他的妻子”相对应，特指婚姻中的男性一方，并非泛指全人类。
- source_word: κολληθήσεται
  choice: 与……连合
  rationale: 表达紧密联结、依附的含义，并保留婚姻结合的庄重语体；脚注列出可体现依附意味的译法。
- source_word: γυναικὶ αὐτοῦ
  choice: 妻子
  rationale: γυνή 在此婚姻语境中明确指妻子。
- source_word: οἱ δύο
  choice: 二人
  rationale: 保留原文明确的“两者”，同时采用自然、庄重的现代汉语。
- source_word: εἰς σάρκα μίαν
  choice: 成为一体
  rationale: 以现代汉语中通行且自然的表达传达进入合一状态的婚姻隐喻，没有将其缩减为单纯情感或法律关系。
theological_decisions:
- issue: 婚姻引文中的性别特指
  choice: 男人……妻子
  alternative: 人……配偶
  rationale: 原文男性单数与“他的妻子”构成明确对应；保留这一性别表达，避免把具体婚姻表述改成抽象、中性的陈述。
- issue: 婚姻合一隐喻
  choice: 二人成为一体
  alternative: 二人成为一个肉身
  rationale: “成为一体”在现代汉语中自然地保留关系和身体合一的整体隐喻；“一个肉身”虽较逐字，却容易被理解为两个身体在物质上合成一个。
- issue: 本节延续上文问句
  choice: 引文后保留“吗？”
  alternative: 以陈述句句号结束
  rationale: 希腊文以问号结束，本节在句法上延续第4节“难道你们没有读过……吗”的问题；保留问句可避免把耶稣的问题改成独立陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留本节承接上文的句法，以“并且说”开头并以问号结束；“连合”略带经文语体，但意义清楚，脚注补足其紧密依附的含义。
