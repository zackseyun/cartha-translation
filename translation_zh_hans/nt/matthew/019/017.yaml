id: MAT.19.17
reference: Matthew 19:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: zh_hans
  text: 他对那人说[a]：“你为什么问我什么是善？良善者只有一位[b]。不过，你若想进入生命，就要遵守诫命。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本以及平行经文作：“你为什么称我是良善的？除了独一的上帝以外，没有一个是良善的。”SBLGNT 所采用的马太本文则作：“你为什么问我什么是善？良善者只有一位。”
    reason: textual_variant
  - marker: b
    text: 或译：“只有一位是良善的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: 你为什么问我什么是善？
  rationale: 将中性单数 τοῦ ἀγαθοῦ 理解为抽象或客观意义的“善”，忠实保留马太本文的问法，不按马可、路加的平行经文改写为“为什么称我是良善的”。
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: 良善者只有一位
  rationale: ὁ ἀγαθός 是名词化形容词，指“那位良善者”；此译法既保留其人格指向，也用自然汉语表达 εἷς 的唯一性。脚注列出更偏谓语式的译法。
- source_word: εἰ δὲ θέλεις
  choice: 不过，你若想
  rationale: θέλω 表示意愿或想要；“想”是自然现代汉语。δέ 在这里带轻微转折，用“不过”衔接。
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: 进入生命
  rationale: 保留“进入生命”的末世性表达，不擅自增译本文此处没有明说的“永生”。
- source_word: τήρησον τὰς ἐντολάς
  choice: 就要遵守诫命
  rationale: τηρέω 与诫命连用时自然译作“遵守”；ἐντολή 在此指具有神圣权威的诫命。用“就要”清楚表达条件句后的命令。
theological_decisions:
- issue: 耶稣的话与上帝的良善及基督论之间的关系
  choice: 按马太的希腊本文译为询问“什么是善”，并说“良善者只有一位”，不把这句话解释成否认耶稣的良善，也不与马可、路加的措辞调和。
  alternative: 按平行经文译作：“你为什么称我是良善的？除了独一的上帝以外，没有一个是良善的。”
  rationale: SBLGNT 所列马太本文与马可、路加的形式不同。译文应保留马太自身的措辞及其神学张力，不在翻译中加入对基督身份的否定或额外论证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他对那人说”避免连续两个“他”造成指代不清；“良善者只有一位”保留原文名词化形容词的质感，同时不显得生硬。脚注标记均放在对应正文处。
