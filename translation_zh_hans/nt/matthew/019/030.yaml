  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: zh_hans
  text: 但许多在先的，将要在后；在后的，将要在先。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“但许多首先的将成为末后的，末后的将成为首先的。”希腊原文格外简练，具有格言式的对称结构。
    reason: 说明原文简练的谓语结构及可行的较直译表达。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多
  rationale: 该形容词在此作名词用，泛指许多人；译作“许多”简洁自然，也不额外限定其身份。
- source_word: δὲ
  choice: 但
  rationale: δέ承接上文并带有轻微转折意味；“但”能体现关于地位与次序的反转。
- source_word: ἔσονται
  choice: 将要
  rationale: 这是εἰμί的将来时形式；与后面的“在后”或“在先”组合，清楚表达将来的状态。
- source_word: πρῶτοι
  choice: 在先的
  rationale: 此处主要表示次序或地位，而非单纯时间上的最早；“在先的”既保持广义，也适合格言式对举。
- source_word: ἔσχατοι
  choice: 在后的
  rationale: 与πρῶτοι构成直接反义对照，表示次序或地位上的末后；“在后的”保留这种对称。
- source_word: πρῶτοι ἔσχατοι
  choice: 在先的，将要在后
  rationale: 原文省略汉语通常需要的结构成分，补出“在”可自然表达从在先到在后的反转，同时不增加具体解释。
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: 在后的，将要在先
  rationale: 希腊文第二分句省略了可由前文理解的动词。汉语补出“将要”，使句义明确，并保持两分句整齐有力的对举。
theological_decisions:
- issue: 反转格言的范围
  choice: 保留为关于次序或地位反转的概括性陈述，不限定具体所指。
  alternative: 将其明确解释为得救、进入天国、门徒所得赏赐或社会地位的反转。
  rationale: 本节本身没有把反转严格限定在某一个层面；直译其宽泛、格言式表达，可保留上下文中的神学张力，避免加入经文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在先的／在后的”比“第一的／最后的”更自然地表达身份、次序或地位，同时不把含义缩窄为特定教义。正文保留鲜明的对举，并以脚注交代原文的极简格言结构。
