  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: zh_hans
  text: “当孝敬父亲和母亲，并且要爱邻如己。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要爱”原文为将来时直陈语气；在此律法引文中具有命令效力。
    reason: 说明Ἀγαπήσεις与前面的命令式Τίμα在语法形式上的差异，同时不把中文的自然命令表达误作单纯将来陈述。
lexical_decisions:
- source_word: Τίμα
  choice: 当孝敬
  rationale: 此处沿用十诫的命令措辞；“孝敬”不仅指内心尊重，也包含给予父母当得的敬重，符合现代中文圣经语体。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父亲和母亲
  rationale: 希腊文使用定冠词而未明说物主代词；中文十诫的惯用表达无需补出“你的”，仍能清楚表达受命者自己的父母。
- source_word: Ἀγαπήσεις
  choice: 要爱
  rationale: 该将来时直陈语气出现在律法引文中，具有命令效力；译作“要爱”自然地保留命令语气，而形式上的“你要爱”列入脚注说明。
- source_word: τὸν πλησίον σου
  choice: 邻
  rationale: 此处呼应利未记19:18；“邻”是简洁而庄重的传统表达，指与人相关联的他者，不限于住处相近的人。
- source_word: ὡς σεαυτόν
  choice: 如己
  rationale: 准确而简洁地表达“像自己一样”，并保留经文已形成的中文惯用措辞。
theological_decisions:
- issue: 律法引文中命令式与将来时直陈语气的并列
  choice: 正文分别译为“当孝敬”和“要爱”，均按中文命令表达处理
  alternative: 较形式对应地译为“当孝敬父亲和母亲，并且你要爱邻如己”
  rationale: 希腊文先用命令式Τίμα，后用具有律法命令效力的将来时Ἀγαπήσεις。中文正文保留两者的命令效力，同时在脚注交代后者较形式对应的译法，避免抹去原文语法差异。
translation_notes:
  register: 采用现代、庄重且易懂的中文，并保留“孝敬”“爱邻如己”等已广为理解的经文措辞。引号表明耶稣在列举经文命令；“又”自然连接两条引文。
