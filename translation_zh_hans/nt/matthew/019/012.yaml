id: MAT.19.12
reference: Matthew 19:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: zh_hans
  text: 因为有些阉人从母腹生来就是这样，也有些阉人是被人阉割的，还有些阉人为了天国使自己成为阉人[a]。能接受这话的，就接受吧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“阉割自己。”许多解释者认为这里是比喻，指为了天国选择独身或不婚。
    reason: 保留该短语在字面动作与比喻性自我克制之间的真实解释张力。
  - marker: b
    text: 或译：“能领受这话的，就让他领受吧。”原词也有“容纳、容得下”的意思。
    reason: 呈现χωρέω较形式对应的译法及其空间意象。
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: 阉人
  rationale: 保留原文反复出现的同一名词及其直白、强烈的表达，不在正文中先行释为“独身者”。“宦官”容易使人联想到宫廷官职，“太监”则带有更强的特定文化色彩，均不如“阉人”贴近此处所指的人身状态。
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: 从母腹生来就是这样
  rationale: 保留“从母腹”这一具体意象，同时以现代汉语自然表达“生来如此”。
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: 被人变成阉人的
  rationale: 保留名词与动词之间的词根呼应，也避免把原文可涵盖的社会身份完全收窄为解剖动作；“被人阉割的”可作为更明确的释义。
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: 使自己成为阉人
  rationale: 按原文字面保留其令人不安而又可能具有比喻意味的说法，不擅自在正文中确定为实际自阉或为天国选择独身。
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: 为了天国
  rationale: διά加宾格在此表达目的或缘由；“为了”简洁自然，传达这种舍弃是以天国为目标或动机。
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: 能接受这话的，就应当接受
  rationale: χωρέω在这里是容纳、领受或接受艰难教导的惯用表达；“接受”符合现代汉语，同时保留末尾命令语气。补出“这话”，使汉语所指清楚，但不额外限定它只指本节某一个短语。
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς应按字面还是比喻理解
  choice: 正文译作“使自己成为阉人”，保留原文的字面形式及其解释张力。
  alternative: “阉割自己”，或理解为“为了天国选择独身、不婚”。
  rationale: 原文本身没有明确说明第三类是实际自阉、夸张说法，还是自愿独身的比喻。正文不替读者消除这种歧义，脚注则交代主要理解。
- issue: 末句χωρεῖν的含义
  choice: 译作“接受”。
  alternative: “领受”或“容得下”。
  rationale: “接受”能以自然现代汉语表达对艰难教导的领会和接纳；脚注保留较贴近原词空间意象的译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“阉人”虽较直白，却最能保留原文三次重复及其修辞冲击；避免使用带有中国宫廷制度色彩的“宦官”或“太监”。末句用“就应当接受”表达第三人称命令式的劝勉力量。
