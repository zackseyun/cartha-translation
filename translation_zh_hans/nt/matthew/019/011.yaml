  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: zh_hans
  text: 他却对他们说：“这话[a]不是人人都能接受；只有那些得蒙赐予[b]的人才能接受。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这句话”或“这教导”。
    reason: lexical_alternative
  - marker: b
    text: “得蒙赐予”原文为被动语态，可能暗示赐予者是上帝，但希腊文没有明确说出赐予者。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 这是叙事中 λέγω 的普通过去时形式；“说”自然、准确，不额外加入“回答”等语义。
- source_word: Οὐ πάντες
  choice: 不是人人都
  rationale: 以现代汉语自然表达否定全称，说明并非所有人都能接受。
- source_word: χωροῦσι
  choice: 能接受
  rationale: χωρέω 本有“容纳、腾出空间”之意，与 λόγος 连用时指容纳或接受某句话；“能接受”清楚传达这里的惯用含义。
- source_word: τὸν λόγον τοῦτον
  choice: 这话
  rationale: λόγος 在这里指紧接上文的言论或教导；“这话”简洁自然，并保留它究竟指一句话还是相关教导的空间。
- source_word: ἀλλ’ οἷς
  choice: 只有……的人
  rationale: 以限制性结构自然表达 ἀλλά 与关系从句构成的对比：能够接受的范围仅限于某些人。
- source_word: δέδοται
  choice: 蒙赐
  rationale: 保留 δίδωμι 完成时被动语态所表达的“已经被赐予且结果持续”的含义，同时不明说赐予者，也不强行补出所赐之物。
theological_decisions:
- issue: 被动式 δέδοται 所暗示的赐予者
  choice: 正文用“蒙赐”，不明说赐予者
  alternative: 只有上帝赐给的人才能接受
  rationale: 经文可能以神圣被动式暗示上帝是赐予者，但希腊文没有明说主语；保留被动表达可避免把解释直接写入正文。
- issue: δέδοται 所赐的是接受能力、许可，还是这话本身
  choice: 不在正文中明确所赐的具体内容
  alternative: 只有得着接受能力的人才能接受
  rationale: 希腊文只说“赐给了他们”，未明言所赐之物；“蒙赐的人”保留原文的含蓄与神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他”忠实保留希腊文承接上下文的代词，不在本节自行补出“耶稣”。两个脚注标记均置于其实际说明的词句之后。
