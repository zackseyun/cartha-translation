  rationale: 修订仅调整中文措辞和脚注锚点：以“得蒙赐予”较完整地表达未明示施事者和所赐内容的完成时被动式，并将脚注 b 紧置于其所解释的词语之后。保留“接受”及限制性“只有”，不将隐含的赐予者明确写为上帝，也不把所赐内容解释为特定的能力、许可或这句话本身。
