id: MAT.19.16
reference: Matthew 19:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: zh_hans
  text: 看哪，有一个人来到耶稣跟前，对他说：“老师，我必须做什么善事[a]，才能得永生？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么善的事”。希腊语τί ἀγαθὸν既可指“善的事”，与“做”连用时也可意指“善事”或“善行”。
    reason: 保留τί ἀγαθὸν在较宽泛的“善的事”与具体“善事、善行”之间的词义空间。
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留ἰδού唤起注意、增强叙事现场感的作用；汉语“看哪”也自然承接上文所隐含的καί。
- source_word: εἷς
  choice: 有一个人
  rationale: εἷς在此独立使用，指某一个人，但本节尚未说明其性别、财富或年龄。“有一个人”是现代汉语自然的引介方式，其中“人”取泛指义，不提前引入后文或平行经文的资料。
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: 来到耶稣跟前，对他说
  rationale: 以先行的动作“来到……跟前”体现不定过去时分词先于“说”的叙事次序。为避免现代汉语中代词指向含混，在“跟前”处明示耶稣，随后仍以“他”对应αὐτῷ。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接表达“教导者、教师”的称呼义；“老师”是现代汉语中清楚、自然且庄重的称谓，不采用可能带有主仆意味的“主人”。
- source_word: τί ἀγαθὸν
  choice: 什么善事
  rationale: 中性单数ἀγαθόν在ποιέω的语境中可指所做的好事或善行。“善事”自然贴合汉语，同时用脚注保留较形式对应的另一种表达。
- source_word: ποιήσω
  choice: 我必须做
  rationale: 这是商议性的不定过去时虚拟语气；“必须……？”自然传达说话者询问所需行动的实际语力，又不替经文判定功德或救恩教义。
- source_word: ἵνα σχῶ
  choice: 才能得
  rationale: “才”表达ἵνα所引出的目的或预期结果，“得”在此自然表达ἔχω的拥有、获得之义；不把两者之间的神学关系解释得超出原文。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是准确、凝练且为现代汉语读者熟悉的对应，表达此处“永恒的生命”。
theological_decisions:
- issue: 是否在本节提前说明来者是男性、青年或财主
  choice: 有一个人
  alternative: 一个男人；一个有钱的年轻人
  rationale: 本节只用εἷς引介此人；采用泛指的“人”，不把后文或平行经文的信息提前加入。
- issue: 行动与永生之间的关系
  choice: 我必须做什么善事，才能得永生？
  alternative: 我该行什么善事来赚得永生？
  rationale: 译文保留提问者以行动为导向的问法及ἵνα结构，但不用“赚得”等词预先断定功德、报偿或得救机制，从而保留原文的神学张力。
- issue: τί ἀγαθὸν所问的是抽象的善还是具体善行
  choice: 正文采用“什么善事”，脚注保留“什么善的事”
  alternative: 我必须做什么善的事
  rationale: ποιήσω使具体行动的理解很自然，但τί ἀγαθὸν本身仍可较宽泛地理解为“什么善的事”；脚注保留这点词义开放性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“看哪”略带经文传统色彩，但仍易懂，并保留原文的提示作用；其余措辞避免古奥表达。
