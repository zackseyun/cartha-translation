  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我实在告诉你们：你们这些跟从了我的人，在复兴的时候[a]，当人子坐在他荣耀的宝座上时，也要坐在十二个宝座上，审判以色列的十二个支派[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复兴”也可译为“再生”“重生”或“更新”。此处的语境指向与人子登基相连的未来复兴。
    reason: lexical_alternative
  - marker: b
    text: “审判”也可能含有统治或治理的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: 我实在告诉你们
  rationale: 采用现代中文圣经语体中自然而庄重的郑重宣告公式，表达该词所引出的权威性断言。
- source_word: ἀκολουθήσαντές μοι
  choice: 你们这些跟从了我的人
  rationale: 保留分词对受话群体的限定，并以“了”体现已经发生的跟从行动，同时明确保留“我”这一宾语。
- source_word: ἐν τῇ παλιγγενεσίᾳ
  choice: 在万物更新的时候
  rationale: παλιγγενεσία可指再生、重生或更新；本节语境是人子将来登基，因此译作末世性的“万物更新”，避免误解为个人重生。“的时候”使中文时间关系清楚。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用这一称号的标准中文译法，保留其但以理书背景及弥赛亚意蕴。
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: 坐在他荣耀的宝座上
  rationale: 自然表达属格所传达的荣耀性质，同时保持庄重语气。
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: 你们……也要坐
  rationale: “也”保留καί所强调的对应关系，“要”自然表达将来意义。
- source_word: κρίνοντες
  choice: 审判
  rationale: 保留该动词最直接的司法含义，不在正文中将其单一解释为统治；其可能兼有治理含义，列入脚注。
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: 以色列十二个支派
  rationale: 采用准确、通行的中文表达。
theological_decisions:
- issue: παλιγγενεσία在本节中的含义
  choice: 与人子登基相连的末世性万物更新
  alternative: 个人重生；新时代；新世界
  rationale: 紧邻语境谈到人子登基、门徒坐宝座并施行审判，所指更可能是将来的整体更新，而不是个人归信经历；译文不进一步限定任何千禧年体系。
- issue: κρίνοντες的范围
  choice: 审判
  alternative: 统治；治理
  rationale: 正文保留希腊词最直接的意义，同时借脚注承认在此语境中可能包含施行统治或治理权柄的意味，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“在万物更新的时候”将παλιγγενεσία置于未来人子登基的语境中；脚注仅说明“审判”的可能语义范围。
