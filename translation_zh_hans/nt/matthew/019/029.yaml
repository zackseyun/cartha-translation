id: MAT.19.29
reference: Matthew 19:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: zh_hans
  text: 凡为我的名离开房屋、兄弟、姐妹、父亲、母亲、妻子、儿女或田地的人，都必得到百倍，并且承受永生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: 凡……的人
  rationale: 表达逐一适用而又概括普遍的范围，符合现代汉语习惯。
- source_word: ἀφῆκεν
  choice: 离开
  rationale: 保留离开、舍下的基本意义，不用“抛弃”或“遗弃”，以免额外加入道德评价。
- source_word: οἰκίας
  choice: 房屋
  rationale: 保留具体的房产含义，并与后面的田地相呼应；不将其仅解释为家庭生活。
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: 兄弟、姐妹
  rationale: 原文分别列出男性和女性手足，译文也分别保留。
- source_word: πατέρα ἢ μητέρα
  choice: 父亲、母亲
  rationale: 按原文保留单数亲属称谓。
- source_word: γυναῖκα
  choice: 妻子
  rationale: 在家庭成员的列举中，此词指配偶最为自然；译作泛指的“女人”不合语境。
- source_word: τέκνα
  choice: 儿女
  rationale: 自然表达子女整体，也适合亲属名单的语境。
- source_word: ἀγρούς
  choice: 田地
  rationale: 具体表达耕地或土地产业，不把含义限缩为整座农场。
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: 为我的名
  rationale: 保留“名”这一原文意象及其关于耶稣身份、权柄和声誉的内涵，不简化为“为了我”。
- source_word: ἑκατονταπλασίονα
  choice: 百倍
  rationale: 简洁而准确地表达一百倍之多，在现代汉语中自然，也保留原文强烈的数量表达。
- source_word: κληρονομήσει
  choice: 承受
  rationale: 保留继承产业的语义背景，同时“承受永生”是庄重且可理解的汉语表达。
theological_decisions:
- issue: 家庭舍离语境中 γυνή 的含义
  choice: 妻子
  alternative: 女人
  rationale: 上下文列举亲属与产业，因此配偶义最符合语境；这并不把经文解释成对女性的一般性舍弃。
- issue: 是否保留“我的名”
  choice: 为我的名
  alternative: 为了我／因我
  rationale: 保留原文的“名”，使耶稣的身份、权柄和被承认的名号所具有的神学分量不被释义消解。
- issue: ἑκατονταπλασίονα 的数量力度
  choice: 百倍
  alternative: 一百倍之多
  rationale: “百倍”既直接对应原文，也不说明回报的具体方式，从而保留经文本身的开放性。
- issue: 永生与继承意象
  choice: 承受永生
  alternative: 得到永生
  rationale: κληρονομέω 带有继承、承受产业的意象；保留这一意象，又不进一步界定永生在末世或现世中的实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。列举结构紧凑，保留原文从房产、亲属到田地的次序；不补充回报的对象或实现方式，以保存“得到百倍”在原文中的简约与张力。
