  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: zh_hans
  text: 许多群众跟随他，他在那里医治了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: 跟随
  rationale: 此处是叙事中实际随行的意思；“跟随”自然、准确，也不额外强化门徒身份。
- source_word: αὐτῷ
  choice: 他
  rationale: 作ἀκολουθέω所支配的对象，现代汉语用“跟随他”表达。
- source_word: ὄχλοι πολλοί
  choice: 许多人
  rationale: 原文直译为“许多群众”；结合汉语习惯，此处用“许多人”自然地表达人数众多的人群，避免“许多群众”的生硬。
- source_word: ἐθεράπευσεν
  choice: 医治了
  rationale: θεραπεύω在福音书的语境中指医治疾病；“医治”准确且符合庄重的叙事文体。
- source_word: αὐτούς
  choice: 他们
  rationale: 复数代词回指前面的众人，译为“他们”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留地点副词的简单指示意义。
- source_word: καὶ ... καὶ
  choice: 有……，……就……
  rationale: 首个καί承接上文，在单节中文中不必机械译出“又”；第二个καί连接随后发生的行动，用“就”形成自然叙事，但不强加因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的福音书叙事语体。“许多人”比“许多群众”更符合普通读者的汉语习惯；句式简洁，并保留原文中跟随、地点和医治三项信息。
