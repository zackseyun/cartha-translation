  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: zh_hans
  text: 他对他们说：“摩西因你们心硬，准许你们与自己的妻子离婚[a]；但起初并不是这样[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与自己的妻子离婚”直译为“把你们的妻子打发走”；在这里指离婚。
    reason: lexical_alternative
  - marker: b
    text: 即按上下文而言，这种许可并不反映创造之初的秩序；参本章4—6节。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: 他对他们说
  rationale: 希腊文用叙事性历史现在时；现代汉语叙事无需用“现在说”，译作“说”自然准确。αὐτοῖς明确译为“对他们”。
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: 因为你们心硬
  rationale: πρός加宾格在此表示缘由或针对的情形。“心硬”保留圣经具体意象，也符合现代汉语习惯；“因为”清楚传达其因由关系。
- source_word: ἐπέτρεψεν
  choice: 才准许
  rationale: 该词表示许可而非命令。“准许”适合此处法律讨论的语境；“才”自然体现这是因人心刚硬而有的让步，但不把许可误写成赞同。
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: 休妻
  rationale: ἀπολύω本义可指打发离开，但在婚姻语境中指解除婚姻。传统而仍通行的“休妻”简洁表达丈夫与妻子离婚的特定方向，并由脚注保留字面意象。
- source_word: ἀπ’ ἀρχῆς
  choice: 起初
  rationale: 简洁保留对紧邻上文创造秩序的指涉，不在正文中扩写为解释。
- source_word: οὐ γέγονεν οὕτως
  choice: 并不是这样
  rationale: γέγονεν为完成时，指已经形成或存在的情形；汉语“并不是这样”自然表达从起初而言这种情形并不成立，同时避免生硬套用时态。
theological_decisions:
- issue: 摩西的规定应表达为命令、认可还是许可
  choice: 摩西……才准许
  alternative: 摩西吩咐／摩西认可
  rationale: ἐπέτρεψεν明确表示许可。“才”表明这许可针对人心刚硬而作，却不将其说成创造秩序中的理想，也不暗示摩西命令人离婚。
- issue: 是否在正文中明确补出“上帝起初的设计”
  choice: 但起初并不是这样
  alternative: 但这并不是上帝起初的设计
  rationale: 原文没有明说“上帝的设计”；上下文已使创造背景清楚。正文保留简练表达，以免把隐含意义变成明说，脚注可提示其上下文指向。
- issue: 完成时γέγονεν的神学及时间语气
  choice: 并不是这样
  alternative: 从起初到现在一直不是这样
  rationale: 不将完成时过度扩写成一种绝对、持续至今而没有任何历史让步的陈述；译文保留耶稣将摩西许可与起初情形对照的张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“心硬”保留圣经意象；“休妻”虽略带传统色彩，但准确体现原文从丈夫角度所说的解除婚姻，并以脚注说明。标点与引语符合简体中文出版习惯。
