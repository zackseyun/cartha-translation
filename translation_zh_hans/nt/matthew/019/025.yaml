  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: zh_hans
  text: 门徒听见这话，就非常惊讶，说：“那么，谁能得救呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见这话
  rationale: 不定过去时分词交代主句反应发生前的情境；“这话”依据上文补出所听见的内容，符合现代汉语叙事习惯。
- source_word: δὲ
  choice: 就
  rationale: δέ在此表示叙事推进并略带承接；结合前置的时间情境，用“就”自然呈现门徒随即产生的反应。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 这是福音书语境中对耶稣门徒的通行、准确称呼。
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: 非常惊讶
  rationale: ἐξεπλήσσοντο表达强烈的震惊反应，σφόδρα进一步加强程度；“非常惊讶”自然清楚，同时保留原文的强调。
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词引出伴随的言语，在现代汉语叙事中用限定动词“说”最为自然。
- source_word: Τίς ἄρα
  choice: 这样，谁
  rationale: ἄρα表示由耶稣前一句话得出的推论；“这样”既承接上文，也传达门徒惊讶中的推断意味。
- source_word: δύναται
  choice: 能
  rationale: 直接表达能力或可能性，简洁自然。
- source_word: σωθῆναι
  choice: 得救
  rationale: 在进入天国的上下文中指完整意义上的救恩；“得救”是现代汉语圣经语境中准确而通行的表达，并保留被动含义而不额外说明施救者或方式。
theological_decisions:
- issue: σωθῆναι在本段中的含义
  choice: 得救
  alternative: 获救／被救出
  rationale: 上下文讨论进入天国以及财主进入天国之难，因此门徒所问的是救恩意义上的得救，而非仅指脱离眼前危险；译文不进一步界定得救的机制，以免加入原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样”自然体现ἄρα的推论语气；句式简洁，保留门徒强烈的惊讶和问题本身的神学张力。
