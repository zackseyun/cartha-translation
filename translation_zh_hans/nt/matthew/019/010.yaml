source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: zh_hans
  text: 门徒对他说：“若男人同妻子之间的情形是这样[a]，结婚就没有益处。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若男人与妻子的情形是这样。”原文表达简练；其中“情形”也可译作“事情”或“状况”。
    reason: 说明ἡ αἰτία及整个短语可有不同的自然表达方式。
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ οἱ μαθηταί
  choice: 门徒对他说
  rationale: 现在时在叙事中作历史现在时，现代汉语自然地按上下文译为过去叙事；“门徒”保留了既跟随又受教的含义。
- source_word: Εἰ οὕτως ἐστίν
  choice: 若是这样
  rationale: 自然表达条件关系，并保留门徒针对耶稣前述教导所作回应的指向。
- source_word: ἡ αἰτία
  choice: 情形
  rationale: 此处不是严格意义上的“原因”，而指所谈论的情况或事态；“情形”在现代汉语中自然且能保留原文的概括性。
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: 男人和妻子的
  rationale: 上下文明确谈论婚姻，ἀνθρώπου为泛指的男性，γυναικός在此指妻子；译文保留原文的男女婚姻框架。
- source_word: οὐ συμφέρει
  choice: 没有益处
  rationale: συμφέρει表示有利、有益；“没有益处”直接保留其利益判断，避免把话意解释性地改成单纯的劝告“不宜”。
- source_word: γαμῆσαι
  choice: 结婚
  rationale: 以现代汉语常用表达对应不定式“进入婚姻”。
theological_decisions:
- issue: ἀνθρώπου与γυναικός的性别及婚姻关系
  choice: 男人和妻子
  alternative: 人与配偶；男人和女人
  rationale: 原文使用阳性单数ἀνθρώπου，并在婚姻语境中使用γυναικός；“男人和妻子”既保留性别指向，也明确其婚姻关系。
- issue: 门徒对婚姻的利益判断
  choice: 结婚就没有益处
  alternative: 不宜结婚；倒不如不结婚
  rationale: 保留οὐ συμφέρει较直接的“无益/不利”语义，不将门徒的判断弱化为一般建议，也不强化成明确的比较命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“若是这样”简洁自然；“没有益处”略带正式色彩，适合经文语体，并贴近原文的利益判断。
