id: MAT.19.22
reference: Matthew 19:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: zh_hans
  text: 那青年听见这话，就忧愁地走了，因为他有许多财产。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词在这里表示先于主句的动作；结合“就”自然呈现“听见之后便离开”的叙事顺序。
- source_word: δὲ
  choice: 那……就
  rationale: δέ承接上文并带出反应上的转折；汉语用话题推进和“就”表达这一叙事转向，比生硬加入“但是”更自然。
- source_word: ὁ νεανίσκος
  choice: 那青年
  rationale: νεανίσκος意为青年或年轻人；不从平行经文引入“官”这一身份。“那”指回上文已出现的人物。
- source_word: τὸν λόγον
  choice: 这话
  rationale: λόγος在此指耶稣刚才所说的话；现代汉语“这话”自然清楚，也保留其所指，不必抽象化为“信息”。
- source_word: ἀπῆλθεν
  choice: 走了
  rationale: 表示离开现场；“走了”是自然、简洁的现代叙事表达。
- source_word: λυπούμενος
  choice: 忧愁地
  rationale: 现在时分词描述他离开时持续伴随的情绪状态；“忧愁地走了”准确呈现方式或伴随状态。
- source_word: ἦν γὰρ ἔχων
  choice: 因为他有
  rationale: 这一迂回结构表达持续拥有的状态；汉语自然简化为“他有”，γάρ译为“因为”，说明他忧愁离开的缘由。
- source_word: κτήματα πολλά
  choice: 许多财产
  rationale: κτήματα指所拥有的财物、产业，πολλά强调数量多；“许多财产”既准确又符合现代汉语，不将其误解为价值“巨大”。
theological_decisions:
- issue: 是否从平行记载引入“官”的身份
  choice: 只译为“青年”
  alternative: 年轻的官／青年官长
  rationale: 马太本节的希腊文只称他为νεανίσκος。加入“官”会用路加的资料协调马太，而不是直接翻译本节。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“忧愁地走了”保留分词所表达的伴随状态；“许多财产”忠实体现πολλά的数量含义。本节没有必须以脚注保留的实质歧义。
