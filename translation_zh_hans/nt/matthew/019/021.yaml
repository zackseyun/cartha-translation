id: MAT.19.21
reference: Matthew 19:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你若愿意成为完全的人[a]，就去变卖你的财产，分给穷人，你就会有财宝在天上；然后来跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全”也可译作“完备”或“成熟”。
    reason: τέλειος具有“完全、完备、成熟”等相近含义；脚注保留其真实的词义幅度，避免正文被理解为只指无罪的完美状态。
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 按希腊语叙事语序自然转为现代汉语；“说”不额外限定说话方式。
- source_word: τέλειος
  choice: 完全的人
  rationale: τέλειος可指完全、完备或成熟；“成为完全的人”保留本句对整全生命与全心跟从的要求，也避免将词义窄化为单纯的成熟。脚注保留其他可能译法。
- source_word: ὕπαγε
  choice: 去
  rationale: 直接表达离去并执行随后命令的祈使语气。
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: 变卖你的财产
  rationale: τὰ ὑπάρχοντα指此人所拥有的产业或财物；“变卖你的财产”在现代汉语中简明而庄重。
- source_word: δὸς πτωχοῖς
  choice: 分给穷人
  rationale: πτωχοῖς为名词化形容词，指穷人；“分给”自然表达把变卖所得给予穷人，且不增添对象范围。
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: 你就会有财宝在天上
  rationale: 忠实保留将来时及“财宝在天上”的意象；希腊语οὐρανοῖς虽为复数，汉语惯用“天上”。
- source_word: δεῦρο ἀκολούθει μοι
  choice: 然后来跟从我
  rationale: “来”保留δεῦρο的召唤意味，“然后”清楚呈现这些命令的语序，“跟从我”保留福音书中的门徒召唤用语。
theological_decisions:
- issue: τέλειος在门徒生命要求中的含义
  choice: 正文译为“完全的人”
  alternative: “完备的人”或“成熟的人”
  rationale: 本句可强调完整、无所缺欠或成熟，不能仅凭翻译断定为抽象的无罪状态，也不应削弱耶稣对全然委身的要求。正文采用传统且词义贴近的“完全”，脚注明确其语义范围，以保留张力。
- issue: 变卖财产与跟从之间的关系
  choice: 依原文保留一连串直接命令，不添加普遍化或个别化说明
  alternative: 解释为只针对该人，或解释为所有门徒一概适用的财产规定
  rationale: 原文直接向此人发出命令，但本节本身没有明说其适用范围；译文不替读者解决这一神学问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“变卖你的财产”“财宝在天上”“跟从我”既自然，又保留经文的命令力度和门徒语汇。
