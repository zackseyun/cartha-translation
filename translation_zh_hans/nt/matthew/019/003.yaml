  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: zh_hans
  text: 法利赛人来到耶稣跟前，试探他，说：“男人因任何理由与自己的妻子离婚，按律法可以吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθον
  choice: 来到……跟前
  rationale: 表达向某人走近、前来的方向意味，也符合现代汉语叙事表达。
- source_word: πειράζοντες
  choice: 试探
  rationale: 保留“测试、考验”的基本含义，并由语境体现敌意和设难意味，不直接增译为“设圈套”。
- source_word: ἔξεστιν
  choice: 合乎律法吗
  rationale: 这里询问某种行为是否获准，处于犹太律法争议的语境中；“合乎律法”比一般的“可以”更明确地传达法律性质。
- source_word: ἀνθρώπῳ
  choice: 男人
  rationale: 虽然该词可泛指人，但后文说“他的妻子”，此处具体指作为丈夫的男性。
- source_word: ἀπολῦσαι
  choice: 休妻
  rationale: 该动词本义可指释放或遣走，但在婚姻语境中是离婚用语；“休妻”简洁地保留当时由丈夫解除婚姻的社会法律背景。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻
  rationale: γυνή在此因物主关系及离婚语境明确指妻子；汉语“休妻”已自然包含所属关系。
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: 无论因什么缘故
  rationale: 表达问题所涵盖的宽泛范围，同时不预先断定提问者是指“任何一个理由”还是“每一种理由”。
theological_decisions:
- issue: 如何呈现关于离婚理由的律法争议而不预先给出教义结论
  choice: 男人无论因什么缘故休妻，都合乎律法吗？
  alternative: 丈夫可以随便找个理由与妻子离婚吗？
  rationale: 所选译法保留这是一个关于律法许可范围的挑战性问题，也保留κατὰ πᾶσαν αἰτίαν的广泛性；不使用“随便找个理由”，以免过早加入轻率或捏造理由的评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到……跟前”自然传达接近动作；“试探”保留原文动机上的张力；“休妻”符合古代语境，并避免用现代双向离婚措辞掩盖原文由丈夫采取行动的具体表述。
