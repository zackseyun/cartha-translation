review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达法利赛人前来、试探耶稣，以及他们就丈夫是否可基于广泛理由离婚所提出的律法问题。可是“试探他说”缺少必要停顿，容易造成修饰关系不清；“休妻”虽有历史语境根据，但在现代标准汉语中带有较强的传统法律/社会色彩，且不如“与自己的妻子离婚”直接对应原文的婚姻法律动作。
  naturalness: 改为“试探他，说”使分词结构在汉语中清晰自然。以“按律法可以吗”表达ἔξεστιν的许可／律法争议语境，既自然也不把问题泛化为单纯的实际可行性。
  terminology: “法利赛人”“试探”“离婚”“妻子”均为清楚、通行且适合庄重叙事文体的用语。“男人”保留ἀνθρώπῳ在紧邻“自己的妻子”所确定的丈夫指向；“因任何理由”保留κατὰ πᾶσαν αἰτίαν的宽泛范围。
  issues:
  - severity: low
    issue: “试探他说”标点和句法连接不够清楚。
    rationale: 原文πειράζοντες αὐτὸν καὶ λέγοντες表示“试探他，并说”；汉语应写作“试探他，说”，以明确“他”是被试探者，后文是所说的话。
  - severity: low
    issue: “休妻”在现代标准汉语中不够中性、自然。
    rationale: 该词可反映古代丈夫主动解除婚姻的背景，但现代读者较易将其理解为特定传统制度性术语。原文在此使用婚姻语境中的ἀπολύω；“与自己的妻子离婚”更清楚、通行，且不增添教义判断。
  revised_text: 法利赛人来到耶稣跟前，试探他，说：“男人因任何理由与自己的妻子离婚，按律法可以吗？”
  revised_footnotes:
  - marker: a
    text: 或译：“因每一种理由”或“基于任何理由”。希腊语短语所问的是：离婚是否可基于任何理由或任何一种理由而获准。
    reason: 保留κατὰ πᾶσαν αἰτίαν的宽泛表达，并说明其所涉及的是离婚许可理由的范围，而不预先判定其法律或教义结论。
  revision_rationale: 修订使“试探他，说”的句法关系明确，并用现代、庄重的“与自己的妻子离婚”替代带有较强传统色彩的“休妻”。“按律法可以吗”保留ἔξεστιν在争议语境中的许可含义；脚注继续呈现“任何理由／每一种理由”的表达幅度。
