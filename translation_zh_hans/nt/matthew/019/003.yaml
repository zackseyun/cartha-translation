  to: 法利赛人来到耶稣跟前，试探他，说：“男人因任何理由与自己的妻子离婚，按律法可以吗？”
  rationale: 修订使“试探他，说”的句法关系明确，并用现代、庄重的“与自己的妻子离婚”替代带有较强传统色彩的“休妻”。“按律法可以吗”保留ἔξεστιν在争议语境中的许可含义；脚注继续呈现“任何理由／每一种理由”的表达幅度。
