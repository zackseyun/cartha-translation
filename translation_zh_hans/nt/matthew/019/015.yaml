  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: zh_hans
  text: 他把手按在他们身上，然后离开了那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 然后
  rationale: 这里连接前后相继发生的叙事动作；译作“然后”符合现代汉语表达，也不增加因果含义。
- source_word: ἐπιθεὶς
  choice: 把……按在……身上
  rationale: 这是ἐπιτίθημι的不定过去时分词，所指动作先于主要动词发生。汉语以“然后”标明动作次序，比生硬保留分词结构更自然。
- source_word: τὰς χεῖρας αὐτοῖς
  choice: 把手按在他们身上
  rationale: ἐπιτίθημι τὰς χεῖρας加与格是把手按在某人身上的常见表达。汉语无需补出“他的”，主语已清楚是耶稣。
- source_word: ἐπορεύθη
  choice: 离开了
  rationale: πορεύομαι在此表示从该处离去；“离开了”自然、庄重，并与ἐκεῖθεν的起点含义衔接。
- source_word: ἐκεῖθεν
  choice: 那里
  rationale: 与“离开”搭配时，“离开了那里”自然表达“从那里离去”的意思，无需重复添加“从”。
theological_decisions:
- issue: 耶稣按手这一行动的性质
  choice: 正文具体译作“把手按在他们身上”
  alternative: 直接意译为“给他们祝福”
  rationale: 原文明确陈述按手这一身体动作；上下文虽表明与祝福有关，但本节没有使用“祝福”一词，因此不以推断的意义取代原文动作。
translation_notes:
  register: 采用自然、清楚而庄重的现代标准汉语。以两个顺承分句再现分词动作与主要动词的先后关系；不添加礼仪性或圣礼性的术语。
