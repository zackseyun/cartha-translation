  source_fidelity: “摩西为什么吩咐”准确保留了ἐνετείλατο（提问者的“命令”措辞）及其与下一节的张力；“那么，为什么”也恰当表达Τί οὖν的承接性反问。现译的“给妻子休书”与“休掉她”基本传达离婚文书和解除婚姻的语境，但“休掉她”较口语化，且“休书”偏古雅，不完全符合现代标准汉语的庄重叙事语体。
