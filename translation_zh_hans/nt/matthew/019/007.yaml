  terminology: “离婚书”清楚表达βιβλίον ἀποστασίου所指的书面离婚文书，避免现代行政术语“离婚证”。“遣走她”不预先将ἀπολύω完全同化为“离婚”，并以脚注保留其在此处的法律含义。
