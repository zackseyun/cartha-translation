  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: zh_hans
  text: 他们对他说：“那么，摩西为什么吩咐人给她一份离婚书，并且遣走她呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 他们对他说
  rationale: 希腊文以叙事性现在时表达过去发生的对话；现代汉语叙事自然译作“说”，不必显明时态。
- source_word: Τί οὖν
  choice: 那么，为什么
  rationale: 这里承接耶稣先前的话提出质疑，“为什么”比直译为“什么”更准确地传达论辩语气。
- source_word: Μωϋσῆς ἐνετείλατο
  choice: 摩西吩咐
  rationale: ἐντέλλομαι 表示命令、吩咐。保留“吩咐”，忠实呈现提问者的措辞，不提前引入下一节所说的“准许”。
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: 给妻子休书
  rationale: βιβλίον ἀποστασίου 指申命记24:1背景下正式解除婚姻的书面文书。“休书”是现代汉语仍可理解的简洁法律性表达；补出“妻子”作为间接对象，使汉语通顺，但不增添“给我们”等原文没有的成分。
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: 并且休掉她
  rationale: ἀπολύω 字面可指打发离开，在此婚姻法律语境中指休妻、离婚。“休掉她”既保留行为的方向性，也清楚表达离婚含义。
- source_word: αὐτήν
  choice: 她
  rationale: 阴性单数代词指上下文中的妻子。
theological_decisions:
- issue: 是否按照下一节耶稣的纠正，把“吩咐”弱化为“准许”
  choice: 保留“吩咐”
  alternative: 准许
  rationale: 本节的 ἐνετείλατο 明确表达提问者将摩西律法说成命令；翻译应保留其论证措辞及其与下一节之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“休书”与“休掉她”在本节法律及婚姻语境中含义清楚，并保留原文“离婚文书”与“打发她离开”两个彼此相关而不完全重复的表达。
