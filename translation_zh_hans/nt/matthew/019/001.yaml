id: MAT.19.1
reference: Matthew 19:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: zh_hans
  text: 耶稣说完这些话以后，就离开加利利，来到约旦河对岸[a]的犹太地区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约旦河那边”。
    reason: 保留 πέραν 的空间表达差异；它可译作“对岸”或“那边”，原文本身没有明说东岸。
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε ἐτέλεσεν
  choice: 说完……以后，就
  rationale: 这是马太常用的叙事过渡语。现代汉语不必逐字补出“事情发生了”；用“……以后，就……”既自然，也清楚表达前一行动完成后才发生下一行动。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 指耶稣刚刚讲完的整段言论；“这些话”自然、庄重，也不把 λόγοι 缩窄为格言式的“语录”。
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: 离开加利利
  rationale: μετῆρεν 表示从一地动身离去；“离开”准确而符合现代汉语叙事习惯。
- source_word: ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας
  choice: 来到……犹太地区
  rationale: ὅρια 在此可指疆界内的地域或地区，而非仅指边界线；“犹太地区”避免误解为只到边界。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河对岸
  rationale: πέραν 表示在河的另一边或越过河；原文没有明确使用“东边”，所以不把方向写死。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“说完……以后，就……”保留事件先后关系，同时避免仿古的“事情发生了”。脚注标记放在其实际说明的地理短语之后。
