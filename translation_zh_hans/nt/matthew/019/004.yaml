  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: zh_hans
  text: 他回答说：“你们难道没有读过，那位从起初创造他们的，是把他们造为男和女的吗[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们没有读过……吗？”
    reason: 原文的否定疑问句既可译为带反问语气的“难道没有读过”，也可较直接地译为“没有读过吗”。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 这一分词加限定动词的表达带有闪语式色彩；译作“回答说”在现代汉语中自然，也保留了回应与说话两层意思。
- source_word: Οὐκ ἀνέγνωτε
  choice: 你们难道没有读过
  rationale: 否定疑问句带有反问和责问语气，是在诉诸听者应当熟悉的经文；“难道没有读过”自然传达这一语用力量。
- source_word: ὁ κτίσας
  choice: 那位……创造他们的
  rationale: 保留定冠词化分词所表达的“那位创造的”，而不直接把它处理成称号“创造主”；宾语“他们”按上下文补出，使汉语结构完整。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 贴近原文，并呼应《创世记》的创造叙述；其位置保留与“创造”紧密相连的关系。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男和女
  rationale: 直接保留《创世记》引文中的成对用语及创造语境；“男和女”在现代汉语中简洁、自然。
- source_word: ἐποίησεν αὐτούς
  choice: 把他们造为
  rationale: 用“造为”表达使其成为某种样式或类别的意义，同时与前面的“创造”有所区别。
theological_decisions:
- issue: 如何呈现与《创世记》1:27相呼应的创造陈述
  choice: 在正文中保留“男和女”的成对表达，不作神学扩写。
  alternative: 把他们造为男人和女人
  rationale: 原文使用ἄρσεν καὶ θῆλυ，直接呼应创造记载；“男和女”既保留其创造框架，也不加入本节未明说的进一步教义结论。
- issue: ὁ κτίσας是否译为神学称号
  choice: 译作“那位……创造他们的”
  alternative: 译作“创造主”
  rationale: 原文是定冠词化分词，并非明确使用一个称号；正文保留其语法形态，脚注提供较凝练的称号式译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他回答说”符合叙事文体；整句将原文的内容从句处理为汉语反问句，并尽量保留“从起初”与创造行动的紧密联系。
