  naturalness: “他回答说”和“你们难道没有读过”自然且符合庄重叙事语体。主要问题是“那位……的，把……”不合现代书面汉语的正常句法。改为“那位从起初创造他们的，是把他们造为男和女的”可保留原文的定冠词化分词形式，并使引述内容完整通顺。
  terminology: “从起初”“男和女”恰当，并保留与《创世记》创造叙述的呼应。“创造主”仅置于脚注作为备选译法是适当的。
