  rationale: 修订仅解决正文的汉语句法问题：以“是……的”连接“那位……的”与“把他们造为男和女”，使其成为完整、庄重而自然的内容从句。保留“从起初”与“创造”相连的安排、两次“他们”的指向，以及“男和女”的原文措辞。脚注b虽在此节正文未另设锚点，属于对“那位……创造……的”这一表达的说明；为避免未锚定脚注，正文在该短语后保留[b]锚点。
