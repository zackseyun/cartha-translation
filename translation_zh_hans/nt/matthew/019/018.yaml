id: MAT.19.18
reference: Matthew 19:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: zh_hans
  text: 他问耶稣：“哪些诫命？”耶稣说：“就是：不可杀人，不可奸淫，不可偷盗，不可作假见证，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: 哪些诫命
  rationale: 原文直译为“哪些”，但汉语需根据上一节所谈的诫命补出“诫命”，使指代自然清楚。
- source_word: Τὸ
  choice: 就是：
  rationale: 此处冠词引出随后列举的诫命。用“就是：”保留其引介功能，也避免照搬英语层的生硬表达“The:”。
- source_word: Οὐ φονεύσεις
  choice: 不可杀人
  rationale: φονεύω 指非法夺取人的生命；“不可杀人”是十诫在汉语中的自然、庄重表达。
- source_word: Οὐ μοιχεύσεις
  choice: 不可奸淫
  rationale: μοιχεύω 特指通奸；“奸淫”准确且符合经文语体。
- source_word: Οὐ κλέψεις
  choice: 不可偷盗
  rationale: κλέπτω 意为偷窃；“偷盗”简洁自然。
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: 不可作假见证
  rationale: 该动词指作虚假的证词；译法保留司法与一般见证语境。
theological_decisions:
- issue: Τὸ 在诫命清单前的功能
  choice: 译作“就是：”以引出列举
  alternative: 省略不译，直接说“不可杀人……”
  rationale: 希腊文本保留了冠词 Τὸ，虽结构略显不规则，却具有引介下文的作用；显式译出可较好反映原文，同时保持现代汉语通顺。
- issue: φονεύσεις 的范围
  choice: 不可杀人
  alternative: 不可谋杀
  rationale: 该词通常指非法杀人；“不可杀人”沿用十诫的传统而自然的汉语表达，不在译文中进一步界定所有伦理边界。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。叙述时态按汉语习惯处理为“问”“说”；用“耶稣”替代连续代词以避免指代含混。保留句末逗号，因为本节的引语与诫命清单在下一节继续。
