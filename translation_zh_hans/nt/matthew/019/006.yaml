id: MAT.19.6
reference: Matthew 19:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: zh_hans
  text: 这样，他们不再是两个人，而是一体了。因此，上帝所结合的，任何人[a]都不可分开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“人”为单数，在这里是泛指，意思是任何人都不可把上帝所结合的分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 这样
  rationale: 承接前文两人成为一体的陈述，表达结果和推论；现代汉语自然明晰。
- source_word: οὐκέτι εἰσὶν δύο
  choice: 他们不再是两个人
  rationale: 保留“不再”的状态变化及“二”与“一”的鲜明对照；按汉语表达补出“他们”和量词。
- source_word: σὰρξ μία
  choice: 一体
  rationale: 这是对《创世记》婚姻用语的呼应。汉语圣经语境中“一体”既自然又能保留两人成为一个整体的意涵；若直译“一肉”则生硬且容易误解。
- source_word: ὃ οὖν
  choice: 因此……所……的
  rationale: οὖν 的推论作用译作“因此”；中性关系代词 ὃ 所指是上帝所成就的结合，用汉语“所”字结构自然呈现，并不把所指缩窄为具体物件。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 对 θεός 的直接、庄重且通行的现代汉语译法。
- source_word: συνέζευξεν
  choice: 所结合的
  rationale: 该动词有连接、同负一轭之意；“结合”符合婚姻语境，也保留上帝主动促成联合的意思。
- source_word: ἄνθρωπος
  choice: 任何人
  rationale: 此处单数 ἄνθρωπος 泛指人类中的任何个体。现代汉语“任何人”准确体现其普遍禁令，不宜机械译为带性别歧义的“男人”。
- source_word: μὴ χωριζέτω
  choice: 都不可分开
  rationale: μή 加现在时命令语气构成禁止；“不可”保留明确、庄重的禁令力量，“分开”直接对应婚姻联合被拆散。
theological_decisions:
- issue: ἄνθρωπος 在婚姻禁令中的泛指范围
  choice: 译作“任何人”，并以脚注说明泛指人类
  alternative: 译作“人”或“男人”
  rationale: 希腊词在此虽为单数，却没有限定男性，而是泛指任何人。采用“任何人”避免现代读者误以为禁令只针对男性，同时不增添特定宗派解释。
- issue: σὰρξ μία 对《创世记》婚姻语言的呼应
  choice: 译作“一体”
  alternative: 译作“一个身体”或“一肉”
  rationale: “一体”是自然、庄重的现代汉语，能维持两人成为一个整体的经文联系，又不把“肉”的字面形象误读为仅指身体层面。
- issue: 上帝的结合与人的禁止之间的推论关系
  choice: 保留“因此”及“上帝所结合的，任何人都不可分开”的直接禁令
  alternative: 解释为特定婚姻制度或加入例外条件
  rationale: 经文本身从上帝的结合推导出人的禁止，但本节未在此处展开制度细节或例外；译文不应替经文消解其张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文从结果到禁令的推进。“一体”维持《创世记》婚姻用语的互文性；脚注仅澄清 ἄνθρωπος 的泛指性质。
