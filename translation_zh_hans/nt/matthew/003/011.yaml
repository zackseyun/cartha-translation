    issue: The phrase “为悔改而施洗” repeats the verb already used in “我用水给你们施洗.”
    rationale: The Greek has one occurrence of βαπτίζω followed by the prepositional phrase εἰς μετάνοιαν. The repetition makes the Chinese construction less natural and can obscure that the phrase qualifies the one baptism.
  - severity: low
    issue: “鞋” is broader than the source term ὑποδήματα.
    rationale: “凉鞋” more specifically conveys the ancient sandal-like footwear while remaining natural Modern Mandarin.
