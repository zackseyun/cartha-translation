id: MAT.3.11
reference: Matthew 3:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: zh_hans
  text: 我用水为悔改给你们施洗[a][b]；但在我之后来的那一位比我更强大，我连替他拿凉鞋都不配。他要亲自用圣灵与火给你们施洗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用水”也可译作“在水中”；后面的“用圣灵与火”同样可译作“在圣灵与火中”。希腊语介词ἐν在这些短语中可以表示所用的媒介，也可以表示所在的范围。
    reason: lexical_alternative
  - marker: b
    text: “为悔改”原文带有朝向或目的的意味，但没有明确说明悔改是在施洗之前发生，还是施洗所指向或表明的。
    reason: lexical_alternative
  - marker: c
    text: 这里的“火”可以理解为洁净，也可以理解为审判；原文在本句中保留了这一意象的开放性，应结合上下文理解。
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: 施洗
  rationale: 采用现代汉语中通行且庄重的礼仪用语，不以“浸入”限定施洗的具体方式。
- source_word: ἐν ὕδατι
  choice: 用水
  rationale: ἐν加与格在此可表达媒介或范围；“用水施洗”在现代汉语中自然，同时以脚注保留“在水中”的可能译法。
- source_word: εἰς μετάνοιαν
  choice: 为悔改而施洗
  rationale: 保留εἰς所表达的趋向或目的关系，又不在正文中明确判定悔改是在施洗之前发生，还是由施洗所指向或表明。
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: 在我之后来的那一位
  rationale: 自然呈现分词结构及ὀπίσω μου的时间、次序含义。
- source_word: ἰσχυρότερός μού
  choice: 比我更强大
  rationale: 直接表达比较意义，兼顾能力与权势，不采用较古雅的措辞。
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: 我连……都不配
  rationale: ἱκανός本可指够资格、足以胜任；在此谦卑语境中，“不配”最自然地传达其语用含义。
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: 替他拿鞋
  rationale: βαστάσαι是“拿、携带”，不是“脱下”；“鞋”在现代汉语中自然概括当时所穿的便鞋，也保留仆役性工作的含义。
- source_word: αὐτός
  choice: 他要亲自
  rationale: 保留强调代词所表达的对比：与约翰的施洗相对，那一位自己将要施洗。
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: 用圣灵与火
  rationale: “用”符合现代汉语表达，并与前面的“用水”构成平行；“圣灵与火”按原文保留，不解释火是洁净还是审判。
theological_decisions:
- issue: “圣灵与火”的含义
  choice: 正文直译为“圣灵与火”，不添加解释性限定语。
  alternative: “圣灵与洁净之火”或“圣灵与审判之火”
  rationale: 原文的火意象在此可让人联想到洁净，也可结合上下文理解为审判；译文应保留这一神学张力。
- issue: πνεύματι ἁγίῳ的所指
  choice: 译作“圣灵”。
  alternative: “圣洁的灵”或“圣灵的能力”
  rationale: 在马太福音的语境中，此词组通常指圣灵；不扩写为一种非人格性的能力，也不加入原文没有的教义说明。
- issue: εἰς μετάνοιαν中施洗与悔改的关系
  choice: 译作“为悔改而施洗”，并用脚注说明其趋向性。
  alternative: “使你们悔改”或“表明你们已经悔改”
  rationale: 原文没有明确解决悔改与施洗之间的时间和逻辑次序，因此避免在正文中把它单一定义为施洗产生悔改或仅证明先前的悔改。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我用……；但……”保持约翰与后来者之间的鲜明对比；“连替他拿鞋都不配”以自然汉语传达卑微仆役工作的语气。所有存在实质解释分歧之处均在正文中保持简洁，并以脚注说明。
