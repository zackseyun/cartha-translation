id: MAT.3.10
reference: Matthew 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: zh_hans
  text: 斧子已经搁在树根上了[a]。所以，凡不结好果子的树，都要被砍下来，扔进火里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“斧子已经放在树根旁了。”
    reason: κεῖται可译为“搁着、放着”，πρός在这里可着重表示靠近或朝向树根；正文采用更凝练的汉语意象。
lexical_decisions:
- source_word: ἤδη δὲ
  choice: 已经
  rationale: ἤδη强调审判迫近且已临到眼前；δὲ在此仅作轻微承接，现代汉语不必另译连词，以免行文生硬。
- source_word: ἡ ἀξίνη
  choice: 斧子
  rationale: 准确保留砍树工具的具体意象，也是现代普通话的自然说法。
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: 搁在树根上了
  rationale: κεῖται可指“放着、搁着”；“搁在树根上”自然地呈现斧子已经就位、随时要砍的画面，同时不把状态动词强化为已经挥砍。
- source_word: πᾶν οὖν δένδρον
  choice: 所以，凡……的树，都……
  rationale: οὖν表达由前一幅画面推出的结果；“凡……都……”自然传达πᾶν的周遍意义。
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: 不结好果子
  rationale: 汉语谈树木时以“结果子”表达ποιεῖν καρπόν最自然，并保留καλόν所表达的好、合宜之意。
- source_word: ἐκκόπτεται
  choice: 要被砍下来
  rationale: 保留希腊文被动语态及审判将临的语势；“砍下来”符合树木意象。
- source_word: εἰς πῦρ βάλλεται
  choice: 扔进火里
  rationale: 现代汉语清楚有力地表达βάλλεται，并原样保留“火”的审判意象而不作神学扩写。
theological_decisions:
- issue: “火”的具体所指
  choice: 保留为“火”，不加解释
  alternative: 明确译作末世审判、现世审判或地狱之火
  rationale: 经文本身采用审判性的火之意象，却未在本句中进一步界定其具体性质；直译可保留原有的神学张力。
- issue: 现在时被动动词的语势
  choice: 以“都要被……，扔进……”表达确定而迫近的结果
  alternative: 译为一般现在式“都被砍下、扔进火里”
  rationale: 结合“已经”以及斧子就位的画面，汉语用“要”较自然地传达即将执行且确定的审判，但不把它解释为已经完成。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斧子”“树根”“好果子”“砍下来”“扔进火里”具体有力，保留施洗约翰警告中的紧迫感。正文中的脚注标记与脚注对应。
