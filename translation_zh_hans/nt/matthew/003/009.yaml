  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: zh_hans
  text: 不要以为自己可以说[a]：‘亚伯拉罕是我们的父亲。’因为我告诉你们，神能从这些石头中为亚伯拉罕兴起儿女来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在心里说。”希腊语这一短语既可指各人在心里的自语，也可指他们在群体中彼此所说的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: 不要自以为可以
  rationale: 这里的 μή 加不定过去时虚拟语气构成禁令，警告听众不要抱有自信却错误的念头；“不要自以为可以”既保留思量之意，也传达其自恃成分。
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: 彼此说
  rationale: 复数反身代词可指各自在心里说，也可指群体内部彼此说；正文采用自然的群体性表达，并以脚注保留内心自语的可能。
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: 我们有亚伯拉罕作我们的父
  rationale: 保留原文“有……作父”的结构与祖先身份所带来的自恃语气，而不进一步解释其盟约或民族含义。
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: “因为”明确保留 γάρ 的解释关系；“我告诉你们”是庄重而自然的现代汉语表达。
- source_word: δύναται
  choice: 能
  rationale: 直接表达神具备这样的能力，简洁自然，并保留原文的能力含义。
- source_word: ἐκ τῶν λίθων τούτων
  choice: 从这些石头中
  rationale: 准确保留 ἐκ 的来源意象及指示词“这些”。
- source_word: ἐγεῖραι
  choice: 兴起
  rationale: 此处指使后代出现或产生，并非明确指复活；“兴起”保留动词力度和经文语感，同时避免把含义限定为生育或创造。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα 为性别包容的子女或后代用语；“儿女”在现代汉语中自然，也不缩窄为男性后裔。
- source_word: τῷ Ἀβραάμ
  choice: 为亚伯拉罕
  rationale: 与格表达与亚伯拉罕的关系或为其而有，指成为他的后裔；“为亚伯拉罕”保留原文关系而不过度阐释。
theological_decisions:
- issue: 亚伯拉罕血统在约翰警告中的意义
  choice: 译文呈现对倚仗亚伯拉罕血统之安全感的驳斥，但不否认亚伯拉罕在历史上是以色列人的祖先。
  alternative: 将此话仅视为不含血统批判的修辞夸张，或将其解释为对以色列整体的取代。
  rationale: 经文明言不可倚仗“有亚伯拉罕作父”的身份，并宣告神能另行兴起儿女；译文保留这一张力，不引入本节未陈明的取代论或其他体系性结论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“自以为可以”传达错误而自恃的判断；“兴起儿女”保留经文意象和神学张力。脚注标记已在正文中对应出现。
