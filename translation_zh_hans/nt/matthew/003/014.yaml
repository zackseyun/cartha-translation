  rationale: 修订仅调整汉语中主语对比和施事关系的表达：“是我”对应原文对第一人称的强调，“受你所施的洗”明确保留“由你施洗”的意义。“一再拦阻”“反倒”继续自然体现未完成体的反复性及反问中的对比，且不补充任何经文未明说的神学解释。
