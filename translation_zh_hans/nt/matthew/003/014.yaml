  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: zh_hans
  text: 但约翰一再拦阻他[a]，说：“是我需要受你所施的洗，你反倒到我这里来吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约翰试图拦阻他。”希腊语未完成时动词可以表示反复或持续的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: 一再拦阻
  rationale: 未完成时体现持续或反复的拦阻；“一再拦阻”在现代汉语中自然地保留这一未完成体意味，同时脚注说明也可作较弱处理。
- source_word: λέγων
  choice: 说
  rationale: 汉语用连动结构“拦阻他，说”自然表达分词与主要动作的紧密联系。
- source_word: χρείαν ἔχω
  choice: 我才需要
  rationale: “需要”准确传达该习语；“才”与后句形成自然的主语对比，但不额外解释约翰为何有此需要。
- source_word: ὑπὸ σοῦ
  choice: 受你的洗
  rationale: 在汉语惯用表达中，“受你的洗”清楚表示施洗者是“你”，对应被动不定式中的施事者。
- source_word: βαπτισθῆναι
  choice: 受……洗
  rationale: 采用现代中文圣经语境中通行且易懂的“受洗”，不把具体施行方式限定为浸入。
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: 你反倒到我这里来吗？
  rationale: “反倒”自然传达 καί 在反问中承接的强烈对比；保留“到我这里来”的表层表达，不补明“受洗”。
- source_word: δὲ
  choice: 但
  rationale: 清楚表达本句与耶稣前来行动之间的转折。
theological_decisions:
- issue: 约翰反对为耶稣施洗
  choice: 直译约翰自己需要受耶稣的洗，并以反问凸显双方位置的反差，不说明其完整神学依据。
  alternative: 明确解释为耶稣无罪，或仅解释为身份与权柄高低。
  rationale: 经文本身表明约翰承认耶稣的优越地位及自己的需要，却没有在本节完整说明原因；译文应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的简体中文。“我才……你反倒……”使原文的主语对比和反问在汉语中清楚自然；不增补耶稣来此的目的，也不限定洗礼方式。
