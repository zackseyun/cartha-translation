  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: zh_hans
  text: 那时，耶稣从加利利来到约旦河，到约翰那里，为要由他施洗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要受他施洗。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为时间和叙事衔接语，引出接下来的事件；“那时”自然庄重，也可理解为“于是”。
- source_word: παραγίνεται
  choice: 来到
  rationale: 该词为叙事性的历史现在时，表达抵达或来到；现代汉语叙事通常不以形态标示历史现在，译作“来到”既自然又保留动作感。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利
  rationale: ἀπό表示出发地或来源，“从加利利”准确简明。
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: 来到约旦河
  rationale: ἐπί加宾格在此表示朝向某地的移动；汉语补出“河”可清楚标明地理名称，未改变所指。
- source_word: πρὸς τὸν Ἰωάννην
  choice: 到约翰那里
  rationale: πρός加宾格表示朝向某人；“到约翰那里”清楚呈现耶稣来约旦河的具体对象，且不添加本节未明说的“施洗者”称号。
- source_word: τοῦ βαπτισθῆναι
  choice: 要受……的洗
  rationale: 带冠词的不定式在此表达目的；“要受他的洗”在现代汉语中自然地传达“为要受洗”的目的意义。
- source_word: ὑπ’ αὐτοῦ
  choice: 他的
  rationale: ὑπό加属格标示施事者，所指为约翰；汉语惯用“受他的洗”表达由他施洗，同时保留代词形式。
theological_decisions:
- issue: 耶稣前来受约翰施洗的目的关系
  choice: 译作“要受他的洗”
  alternative: “为要让他施洗”或“为要受他的洗”
  rationale: 原文目的不定式明确指出此行目的；所选译法不解释这一行动的神学缘由，只保留经文本身的目的关系。
- issue: 约翰的称号
  choice: 正文仅译“约翰”
  alternative: “施洗者约翰”或“施洗约翰”
  rationale: 本节原文只有专名Ἰωάννην；上下文已能辨明其身份，因此不把称号增入正文。
- issue: 历史现在时παραγίνεται
  choice: 按自然汉语叙事译作“来到”
  alternative: 以“这时耶稣来……”刻意凸显现场感
  rationale: 希腊语历史现在具有生动叙事作用，但现代汉语没有对应的时态形态；采用自然叙事表达，避免制造不地道的时态效果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到约旦河，到约翰那里”保留原文从地点到人物的推进关系；“受他的洗”符合汉语基督教语境，也不比原文作更多神学解释。
