  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: zh_hans
  text: 他们在约旦河里由他施洗，承认自己的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们受洗。”希腊语未完成时可强调当时持续或反复发生的动作。
    reason: 说明ἐβαπτίζοντο的未完成时体貌及可采用的简略译法；“持续或反复”描述叙事中动作的展开，不表示同一人多次受洗。
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: 受他的洗
  rationale: 采用现代汉语中已经确立的礼仪用语“受洗”，并用“他的”表达施行者；不译成“浸入”或“洗净”，以免替原文规定具体方式。希腊语未完成时可表示当时持续或反复发生的情形，但汉语在此无需生硬添加进行体标记。
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: 在约旦河里
  rationale: ἐν加与格表示地点，ποταμῷ明确说明约旦是河流；“在约旦河里”自然且保留了河中这一地点信息。
- source_word: ὑπ’ αὐτοῦ
  choice: 他的
  rationale: ὑπό加属格标明施事者；“他的洗”在汉语中自然表达“由他施洗”，同时保留原文代词，不在本节直接补出“约翰”。
- source_word: ἐξομολογούμενοι
  choice: 承认
  rationale: 分词表示与受洗同时发生的行动，指公开承认过犯；“承认自己的罪”是清楚、自然的现代汉语表达。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 自己的罪
  rationale: 保留罪的含义和归属关系；汉语集合名词“罪”在此可自然涵盖原文复数所指的各样罪行。
- source_word: καὶ
  choice: （不单独译出）
  rationale: καί连接前文；本节独立呈现时，汉语不必以“并且”起句，语篇衔接仍可由上下文体现。
theological_decisions:
- issue: 洗礼术语是否规定具体方式
  choice: 采用“受洗”，不明确规定动作方式
  alternative: 译作“受浸”或“被浸入水中”
  rationale: 本节说明众人在约旦河里由他施洗，却没有在措辞中明确界定具体实施方式；采用通行礼仪术语可保留这一开放性，避免引入宗派结论。
- issue: 未完成时的叙事体意义
  choice: 正文采用自然汉语“受他的洗”，脚注说明持续或反复的可能性
  alternative: 正文译作“不断受他的洗”或“正在受他的洗”
  rationale: 希腊语未完成时可描绘一段时间内持续或反复发生的行动，但中文若加“不断”可能过度强调个体重复受洗；将体貌信息置于脚注更准确。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“受他的洗”保留原文施事代词并避免具体化洗礼方式；“承认自己的罪”通俗清楚。脚注标记[a]已在正文中出现。
