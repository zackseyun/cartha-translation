  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: zh_hans
  text: 耶稣却回答他：“你暂且容许吧，因为我们理当这样成全一切的义。”于是约翰就答应了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: 耶稣却回答他
  rationale: ἀποκριθεὶς与εἶπεν合用是“回答说”的惯用表达，现代汉语压缩为“回答”；δέ承接上一节约翰的阻拦，译作“却”以体现转折。
- source_word: Ἄφες ἄρτι
  choice: 暂且这样做吧
  rationale: ἀφίημι在此意为准许、容让，并非“赦免”；ἄρτι表示眼下、此刻。“暂且这样做吧”自然地表达耶稣要约翰此时容许并施行洗礼。
- source_word: οὕτως γὰρ
  choice: 因为我们这样
  rationale: οὕτως指向眼前所说的方式，即约翰为耶稣施洗；“这样”保留其指示作用，γάρ译作“因为”。
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: 我们……是合宜的
  rationale: πρέπον表示合宜、适当，既有处境上的适切性，也不排除道德意义；“我们”保留ἡμῖν，包含耶稣和约翰双方。
- source_word: πληρῶσαι
  choice: 成全
  rationale: πληρόω在马太福音中常带有使上帝旨意落实、达成的意味；“成全”保留这种马太式呼应，又不把含义限缩为单纯完成任务。
- source_word: πᾶσαν δικαιοσύνην
  choice: 一切的义
  rationale: 直译保留原文表达的广度及神学张力，不将其窄化为每一项律法要求；此处的“义”广义指合乎上帝公义旨意的事。
- source_word: τότε ἀφίησιν αὐτόν
  choice: 于是约翰就让他这样做了
  rationale: ἀφίησιν是叙事中的历史现在，汉语按上下文用完成体表达。希腊文主语虽省略，但语境明确是约翰；“让他这样做”表达约翰不再阻拦并应允耶稣的要求，避免误解为约翰离开耶稣。
theological_decisions:
- issue: “一切的义”的含义
  choice: 保留广义表达，指此刻借着耶稣接受约翰的洗礼，成全合乎上帝公义旨意的一切事。
  alternative: 将其收窄为履行全部律法要求，或译作“一切公正”。
  rationale: 原文没有把δικαιοσύνη限定为法律义务，也没有在本节展开完整教义体系；译文因此保留其涵盖上帝旨意与正当作为的宽广含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“暂且这样做吧”比“现在容许”更符合汉语对话习惯；末句明说语境中隐含的主语“约翰”，并用“让他这样做了”避免生硬或产生“离开他”的歧义。
