  naturalness: 原句“因为我们这样成全一切的义，是合宜的”语序略显拗口。改为“因为我们理当这样成全一切的义”符合现代庄重汉语，并保留原文“对我们是合宜的”的意味。
  terminology: “成全一切的义”恰当保留πληρῶσαι πᾶσαν δικαιοσύνην的马太式措辞、广度与未决的神学张力。“义”可保留为正文，脚注说明“公正”为可行词义替代，避免将其限定为律法主义或特定教义解释。
