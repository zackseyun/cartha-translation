  rationale: 修订使许可的命令及约翰随后应允的动作更清楚，同时改善中文语序。正文仍保留“我们”“这样”“成全”“一切的义”等原文关键表达；脚注继续呈现δικαιοσύνη的可选词义，且不引入超出本节的教义限定。
