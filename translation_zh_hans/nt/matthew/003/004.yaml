  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: zh_hans
  text: 约翰本人穿着用骆驼毛制成的衣服[a][b]，腰间系着皮腰带；他的食物是蝗虫和野蜜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰的装束令人联想到先知以利亚的形象，参《列王纪下》1:8；这是马太描写约翰时的重要背景。
    reason: cross_reference
  - marker: b
    text: 或译：“约翰本人的衣服是骆驼毛的，腰间系着皮腰带。”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: 约翰本人
  rationale: αὐτός带强调意味，译作“本人”；δέ是轻微的衔接或转折，中文在此无需另加生硬的连接词。
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: 穿着……衣服
  rationale: εἶχεν字面为“有”，但此处描述约翰身上的衣着；“穿着”符合语境，也避免“有一件衣服”的歧义。
- source_word: ἀπὸ τριχῶν καμήλου
  choice: 骆驼毛制成的
  rationale: ἀπό在这里表示材料来源；该译法清楚自然，并保留衣物由骆驼毛制成之意。
- source_word: ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ
  choice: 腰间束着皮带
  rationale: ζώνη指腰带，δερματίνη指皮制；“腰间束着”自然表达περί所表示的环绕位置。
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: 他的食物是
  rationale: τροφή意为食物或养料；直译为“食物”简明准确，δέ以分号承接下一项描述。
- source_word: ἀκρίδες
  choice: 蝗虫
  rationale: 该词通常指可食用的蝗虫，没有充分的词汇或语境依据改译为植物。
- source_word: μέλι ἄγριον
  choice: 野蜜
  rationale: ἄγριον表示野生、野外所得；“野蜜”简洁地表达并非人工饲养生产的蜂蜜。
theological_decisions:
- issue: 约翰的装束与以利亚形象的呼应
  choice: 正文只直接描写约翰的衣着和食物，将与以利亚的联系置于脚注
  alternative: 在正文中采用更明确暗示以利亚的解释性措辞
  rationale: 原文没有明说以利亚；保持叙事描述，可避免把合理的互文理解直接写成正文断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“约翰本人”保留原文强调；“穿着”按语境处理εἶχεν。“野蜜”沿用简洁、熟悉的圣经表达。脚注标记均置于正文相关衣着描述之后。
