id: MAT.3.16
reference: Matthew 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: zh_hans
  text: 耶稣受了洗，随即从水中上来。看哪，诸天开了；他看见上帝的灵仿佛鸽子[a]降下，来到他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿佛”也可译作“好像”或“如同”；原文表达比较，并没有说上帝的灵就是一只鸽子。
    reason: 保留比较结构的范围及其未决之处。
  - marker: b
    text: 有些译本作“停落在他身上”；原文所用的动词更直译为“来到”。
    reason: 说明传统译法与原文较宽泛动词之间的差别。
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: 耶稣受了洗
  rationale: 以“受了洗”保留不定过去时被动分词的被动意义，并在汉语中自然表达其先于主句动作发生的背景；不把轻微连接词 δέ 生硬译出。
- source_word: εὐθὺς
  choice: 随即
  rationale: 准确表达紧接着发生的次序，语体自然而庄重。
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: 从水中上来
  rationale: 保留“上来”这一方向性，并以“从水中”自然表达 ἀπό 所指的离开水域，不借此规定具体施洗方式。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、增强现场感的叙事标记。
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: 诸天开了
  rationale: 保留 οὐρανοί 的复数和被开启的意义；汉语“开了”可自然承载希腊文被动形式，而不必增添未明说的施动者。
- source_word: εἶδεν
  choice: 他看见
  rationale: 按上下文以“他”承接耶稣，同时保留原文代词所具有的简洁指代。
- source_word: πνεῦμα θεοῦ
  choice: 上帝的灵
  rationale: 直接保留属格结构及原文称谓，不擅自改成原句未使用的专名“圣灵”，也不弱化为泛指的“一个灵”。
- source_word: καταβαῖνον
  choice: 降下
  rationale: 表达现在分词所描写的下降动作，简洁而具动态感。
- source_word: ὡσεὶ περιστερὰν
  choice: 仿佛鸽子
  rationale: “仿佛”明确保留 ὡσεὶ 的比较意味，不把上帝的灵直接等同于一只鸽子。
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: 来到他身上
  rationale: 贴近“来”与 ἐπί 所表达的趋向和临到；不把一般性的“来到”具体化为“停落”。
theological_decisions:
- issue: πνεῦμα θεοῦ 是泛指来自上帝的灵，还是指上帝的灵
  choice: 上帝的灵
  alternative: 来自上帝的一个灵；圣灵
  rationale: 洗礼叙事的语境支持特指，但译文仍严格采用原文“上帝的灵”的表达，既不泛化，也不以更具解释性的称号取代它。
- issue: ὡσεὶ περιστερὰν 是相似性描述，还是把灵认定为鸽子
  choice: 仿佛鸽子
  alternative: 成为一只鸽子；像鸽子一样
  rationale: 比较词 ὡσεὶ 要求保留相似关系。译文不裁定相似之处究竟在形态、可见呈现还是下降方式，从而保留原文张力。
- issue: ἐρχόμενον ἐπ’ αὐτόν 是否应具体译为停落
  choice: 来到他身上
  alternative: 停落在他身上
  rationale: 原文动词是“来”，并未专门使用表示鸟停落的动词；较宽泛的译法避免让前面的鸽子比喻支配后一个动词的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“看哪”刻意保留经文的提示语气；“诸天”保留原文复数及其圣经语境色彩。句式不过度欧化，并避免借“从水中上来”或“停落”暗中规定施洗方式及圣灵显现的具体物理形态。
