  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: zh_hans
  text: 那时，耶路撒冷、全犹太地和约旦河周围整个地区的人，都纷纷到他那里去。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纷纷到他那里去”也可译作“不断到他那里去”；希腊语未完成时表示这一行动持续或反复发生。
    reason: lexical_alternative
  - marker: b
    text: “全犹太地”和“约旦河周围整个地区”是概括性的地域表达，说明响应约翰的人来自广大地区，不一定是指当地每一个人。
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间和叙事衔接语，承接前文约翰的事工；“那时”简洁自然。
- source_word: ἐξεπορεύετο
  choice: 纷纷到……去
  rationale: 希腊语未完成时表示过去持续或反复发生的行动。“纷纷”以自然汉语传达各地的人不断前往的动态，同时避免生硬直译为“正在出去”。
- source_word: πρὸς αὐτόν
  choice: 到他那里去
  rationale: πρός加宾格在移动动词后表示朝向某人；此处所指为前文的约翰。“到他那里去”符合现代汉语习惯。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷……的人
  rationale: 原文以城名转指其中居民。汉语补出“人”，使三个地域名称共同构成清楚自然的主语。
- source_word: πᾶσα ἡ Ἰουδαία
  choice: 全犹太
  rationale: 保留原文概括整个地区的广泛表达；这里是地域性的总称，不必机械理解为每一个居民。
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: 约旦河周围整个地区
  rationale: περίχωρος指周边地区；属格τοῦ Ἰορδάνου表明该地区以约旦河为地理参照。“约旦河周围整个地区”准确且符合现代汉语。
- source_word: καὶ … καὶ
  choice: 、……以及
  rationale: 用汉语列举结构呈现原文三个地域单位的累加关系，避免连续使用“和”造成拗口。
theological_decisions:
- issue: 地域总称“全犹太”和“整个地区”的范围
  choice: 保留广泛的地域总称，并在脚注说明不一定指每一个居民
  alternative: 意译为“来自耶路撒冷、犹太各地和约旦河周围地区的许多人”
  rationale: 原文强调约翰事工引起广泛响应，但这类概括性地域用语通常不要求数学意义上的全体。正文保留原有修辞力度，不在正文中擅自缩小为“许多人”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“纷纷”传达未完成时的持续、反复动态；补出共同中心语“人”，清楚表达城名和地区名转指居民的用法。
