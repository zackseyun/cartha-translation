  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: zh_hans
  text: 并说：“你们要悔改[a]，因为天国[b]已经临近了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔改”也可按字面译作“改变心意”；这里不只是指感到懊悔，而是指心思和生活方向的根本转变。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“诸天的国”。“国”也可包含王权或统治的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 保留 λέγω 分词的基本含义，并承接上一节对施洗约翰的叙述；不额外加入“宣讲”或“宣告”等较具体的意思。
- source_word: Μετανοεῖτε
  choice: 你们要悔改
  rationale: μετανοέω 在这里是第二人称复数、现在时命令式，要求听众彻底改变心思和人生方向。“悔改”是现代汉语基督教语境中自然而庄重的表达，但脚注说明其含义不只是懊悔或内疚。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 体现 ἐγγίζω 完成时的意味：天国已经来到近处，如今就在近旁；比单说“近了”更充分地传达其时态体意义。
- source_word: γὰρ
  choice: 因为
  rationale: 明确表示后句是前面命令的根据，符合现代汉语因果表达。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天国
  rationale: “天国”是自然、凝练且广为理解的汉语表达，保留马太特有的措辞；βασιλεία 可兼指王权、统治和国度，不在正文中将其窄化为其中一义。
theological_decisions:
- issue: “天国”的含义
  choice: 正文保留“天国”
  alternative: 天的统治；上帝的国
  rationale: 原文是马太具有特色的“诸天的国”。译作“天国”既保留其神学措辞，也不把 βασιλεία 仅解释为抽象的“统治”，或用对观福音中的近似说法“上帝的国”取代原文。
- issue: 悔改的性质
  choice: 使用“悔改”，并在脚注说明其包含心思与方向的根本改变
  alternative: 改变心思；回转
  rationale: μετανοεῖτε 不应被缩减为单纯感到内疚，也不宜只按词源处理成纯认知活动；在施洗约翰的呼召中，它指向面对天国临近而产生的整体重新定向。
translation_notes:
  register: 采用现代、庄重而易懂的宣告语体。“你们要”清楚表达复数命令；“已经临近了”兼顾完成时意味和自然汉语。正文作为上一节的延续，以“说”开头，不擅自补出主语。
