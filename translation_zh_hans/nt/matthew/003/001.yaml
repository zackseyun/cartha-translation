  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: zh_hans
  text: 那些日子，施洗者[a]约翰来到[b]，在犹太地区的旷野宣讲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施洗者”也可译作“施行洗礼的人”。
    reason: lexical_alternative
  - marker: b
    text: “来到”也可译作“出现”；原文这里使用叙事性的现在时。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: 那些日子
  rationale: Ἐν加与格构成时间短语，直译为“在那些日子”；中文叙事中省去“在”更自然。δέ仅是轻微的承接语气，不必另加“现在”或强转折词。
- source_word: παραγίνεται
  choice: 来到
  rationale: 该动词在此表示约翰进入叙事并开始公开活动。原文使用历史现在时，现代汉语叙事不必机械保留时态形式；“来到”自然且不暗示神奇的突然显现。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ βαπτιστὴς
  choice: 施洗者
  rationale: 该称号指施行洗礼的人。“施洗者”既简洁自然，也保留了βαπτιστής的动作施行者含义，并避免使读者误以为这是宗派名称。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 现在分词表示与主动作同时进行的公开传告。“宣讲”保留其作为传令者公开宣布信息的含义，也符合庄重而易懂的现代汉语。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在……旷野
  rationale: ἔρημος指人烟稀少、荒凉的地区；“旷野”比“沙漠”更准确，避免限定为沙地地貌。
- source_word: τῆς Ἰουδαίας
  choice: 犹太的
  rationale: 此处Ἰουδαία指犹太地区；“犹太的旷野”在现代中文中清楚表达所属地域。
theological_decisions:
- issue: 约翰称号βαπτιστής的译法
  choice: 施洗者
  alternative: 施行洗礼的人
  rationale: 这是身份称号和词义选择，而非宗派归属。“施洗者”准确保留其施行洗礼的含义，并采用中文读者熟悉的表达。
- issue: παραγίνεται是否译为“出现”
  choice: 来到
  alternative: 出现
  rationale: 两者在语境中都可能成立；“来到”较自然地描写约翰进入场景，而“出现”更突出人物登场。正文不把该词解释成超自然显现，并以脚注保留另一可能。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“那些日子”承接前文而不额外强化转折；句序尽量贴近希腊文，同时把地点短语置于“宣讲”之前，使中文自然清楚。
