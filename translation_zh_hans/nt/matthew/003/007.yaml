id: MAT.3.7
reference: Matthew 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: zh_hans
  text: 可是，约翰看见法利赛人和撒都该人中有许多人前来参加他的洗礼，就对他们说：“毒蛇的后代[a]！谁警告你们要逃避将要临到的震怒[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“毒蛇的一窝”。
    reason: lexical_alternative
  - marker: b
    text: 或译“将来的震怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: 可是，约翰看见……就
  rationale: 用“看见……就……”自然表达希腊语不定过去时分词与主句的关系；“可是”保留 δέ 在上下文中的轻微转折。主语“约翰”由上文明确，在中文中补出可避免指代含混。
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: 法利赛人和撒都该人中有许多人
  rationale: 明确表达“许多……中的人”这一部分属格结构，不把斥责无差别地扩大到两派所有成员。
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: 前来参加他的洗礼
  rationale: 保留他们朝着约翰的洗礼而来的意思，同时不擅自断定本节所述每个人实际都接受了洗礼。脚注说明 αὐτοῦ 的抄本异文。
- source_word: Γεννήματα ἐχιδνῶν
  choice: 毒蛇的后代
  rationale: “后代”贴近 γεννήματα 所表达的所生者、后裔之意；“毒蛇”准确而鲜明地传达 ἔχιδνα。脚注保留更具集合意象的传统译法。
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: 谁警告你们
  rationale: ὑποδείκνυμι 可指指示、说明；在逃避将临震怒的语境中，“警告”最能传达其紧迫的告诫意味。
- source_word: φυγεῖν ἀπὸ
  choice: 逃避
  rationale: 表达 φυγεῖν 的逃离动作及 ἀπό 的远离含义，符合现代汉语习惯。
- source_word: τῆς μελλούσης ὀργῆς
  choice: 将要临到的震怒
  rationale: “将要临到”表达 μελλούσης 的未来、迫近意味；“震怒”保留 ὀργή 的强烈神学分量，不弱化为泛称的后果或惩罚。
theological_decisions:
- issue: 受斥责者的范围
  choice: 法利赛人和撒都该人中有许多人
  alternative: 把法利赛人和撒都该人作为整体一概而论
  rationale: πολλούς 加部分属格表明所说的是两派中的许多人；译文既保留对在场者的严厉斥责，也不超出原文而泛化。
- issue: ὀργή 的末世性分量
  choice: 震怒
  alternative: 审判；惩罚
  rationale: 原词直接表示愤怒或震怒，在此具有将临的审判背景；译作“震怒”可保留这一神学张力，而不把愤怒本身改写成其结果。
- issue: 这些人前来的意图与结果
  choice: 前来参加他的洗礼
  alternative: 前来接受约翰的洗礼
  rationale: 原文说他们朝着“他的洗礼”而来，却没有在本节明说他们最终受了洗；译文避免把行动结果写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“毒蛇的后代”保持先知式斥责的力度；“震怒”保留末世审判语境中的强度。所有脚注标记均在正文中对应出现。
