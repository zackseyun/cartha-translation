id: MAT.3.17
reference: Matthew 3:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: zh_hans
  text: 看哪，有声音从诸天[a]传来，说：“这是我的爱子，我喜悦他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数“诸天”；也可译作“天上”。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“我在他里面喜悦。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: ἰδού在此是引人注意的话语标记；“看哪”保留其庄重、醒目的语气，也符合现代中文经文体。连接词καί不机械译成“并且”，以免中文生硬。
- source_word: φωνὴ
  choice: 有声音
  rationale: φωνή在此指能说出话来的声音，而非一般声响；“有声音……传来”是自然的中文表达。
- source_word: ἐκ τῶν οὐρανῶν
  choice: 从诸天传来
  rationale: 原文οὐρανῶν为复数。“诸天”保留原文形式及其犹太—希腊语表达色彩；“传来”自然表达声音的来源。
- source_word: λέγουσα
  choice: 说
  rationale: 该分词修饰“声音”并引出直接引语；中文以“说”承接最自然。
- source_word: Οὗτός ἐστιν
  choice: 这是
  rationale: 准确、自然地保留指示代词与系词的直接认定语气。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: 我的爱子
  rationale: “爱子”简洁地表达“我所爱的儿子”，保留ἀγαπητός的深切爱意以及全句庄重的宣告语气，不额外扩展其含义。
- source_word: ἐν ᾧ εὐδόκησα
  choice: 我喜悦他
  rationale: 这是该希腊语结构在现代中文中的自然表达，传达上帝对他的喜悦与认可；脚注保留介词结构较直译的形式。
theological_decisions:
- issue: 上帝宣告耶稣为他的儿子
  choice: 我的爱子
  alternative: 我所爱的儿子
  rationale: 译文保留明确的父子关系及ἀγαπητός所表达的爱，不将其弱化为纯粹的职分称谓，也不加入原文没有说明的神学术语。
- issue: ἐν ᾧ εὐδόκησα中喜悦的对象与表达方式
  choice: 我喜悦他
  alternative: 我在他里面喜悦
  rationale: 正文采用自然中文，同时脚注保留ἐν ᾧ较贴近字面的表达，以免掩盖原文介词结构；不进一步解释这种喜悦的神学性质。
- issue: οὐρανῶν的复数形式
  choice: 诸天
  alternative: 天上
  rationale: 正文保留原文复数，脚注说明现代中文也常按惯用法译作单数性的“天上”，不赋予复数形式额外的宇宙层级含义。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“看哪”保留原文显著的话语标记；“诸天”略带经文色彩，用以忠实呈现复数形式，并以脚注补充更惯用的译法。引语简洁有力，适合公开诵读。
