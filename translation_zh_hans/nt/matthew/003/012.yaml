id: MAT.3.12
reference: Matthew 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: zh_hans
  text: 他手里拿着扬谷铲[a]，要把自己的打谷场彻底清理干净，把麦子收进仓里[b]；至于糠秕，他要用无法扑灭的火烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扬谷叉”；传统译法常作“簸箕”。原词指扬谷时所用的农具，具体形制不能确定。
    reason: lexical_alternative
  - marker: b
    text: “仓”也可译作“粮仓”或“仓房”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: 扬谷铲
  rationale: 指把谷物扬到空中、借风分开谷粒与糠秕的农具。原词不能确定具体形制，可能类似铲或叉；“扬谷铲”在正文中清楚表达其用途，并以脚注保留其他可能。
- source_word: διακαθαριεῖ
  choice: 要……彻底清理干净
  rationale: 该复合动词带有加强意味，表示完全清理；这一译法既保留强度，也符合现代汉语表达。
- source_word: ἅλωνα
  choice: 打谷场
  rationale: 指脱粒并扬谷的场地，是准确、自然且容易理解的农业用语。
- source_word: σῖτον
  choice: 麦子
  rationale: 该词可泛指谷物，但在与糠秕相对的扬谷图景中，译作“麦子”自然贴切。
- source_word: ἀποθήκην
  choice: 仓里
  rationale: 原词泛指存放物品的地方；结合收存麦子的语境，“仓”简洁自然，又不限定过于具体的建筑形制。
- source_word: ἄχυρον
  choice: 糠秕
  rationale: 在扬谷语境中指与谷粒分离、没有价值的干燥残余；“糠秕”准确保留这一对比意象。
- source_word: κατακαύσει
  choice: 烧尽
  rationale: 该复合动词表达彻底焚烧、烧毁的意味；“烧尽”保留了动作的完全性。
- source_word: πυρὶ ἀσβέστῳ
  choice: 用无法扑灭的火
  rationale: 与格可表达手段；“无法扑灭”直接传达ἄσβεστος的意义，同时避免仅用“不灭”可能产生的含混。
- source_word: οὗ … αὐτοῦ
  choice: 他……自己的
  rationale: 关系代词回指上一节将要来的那一位。汉语以“他”承接上文，并用“自己的”自然表达打谷场和麦子属于他。
theological_decisions:
- issue: 麦子与糠秕分开的审判意象
  choice: 保留具体农业比喻及未来审判的严厉后果，不在正文中明说麦子和糠秕各自象征谁。
  alternative: 将麦子与糠秕解释性地改写为义人和恶人。
  rationale: 原文借完整的农业图景表达分别与审判；直陈其象征对象会超出本节明说的内容，并消解原有意象和张力。
- issue: “无法扑灭的火”的时间与性质
  choice: 按原文译为“无法扑灭的火”，不进一步解释其持续时间或教义含义。
  alternative: 在正文中明确改写为“永远燃烧的火”或其他系统神学表述。
  rationale: ἄσβεστος强调火不能被扑灭；译文应保留这一明确断言，而不额外规定原文在此没有展开的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留打谷、扬谷、麦子、糠秕和火的具体意象；分号突出麦子与糠秕两种结局的鲜明对照。
