  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: zh_hans
  text: 所以，你们要结出与悔改相称的[a]果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“结出符合悔改的果子。”
    reason: “相称的”也可译为“符合……的”，两者都表达果子应当与悔改相对应。
lexical_decisions:
- source_word: ποιήσατε
  choice: 要结出
  rationale: 这是不定过去时主动命令语气、第二人称复数，表达明确而有力的命令。汉语通常说“结出果子”，比直译为“做出果子”自然，也保留了行动要求。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文的警告和劝告，表明推论关系；“所以”在现代汉语中清楚自然。
- source_word: καρπὸν
  choice: 果子
  rationale: 保留原文的果实隐喻；单数在此具有集合意义，可指悔改所产生的可见行为和结果。
- source_word: ἄξιον
  choice: 相称的
  rationale: ἄξιος与属格连用，在这里表示相符、相配，而不是靠行为赚取悔改。“相称的”既贴近原义，也符合现代汉语表达。
- source_word: μετανοίας
  choice: 悔改
  rationale: μετάνοια在施洗约翰的宣讲语境中指人真实地回转，不仅是思想改变；“悔改”是准确、自然且通行的译法。
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας所表达的关系
  choice: 要求结出与真实悔改相称的果子
  alternative: 要求结出足以赚取悔改或与悔改价值相等的果子
  rationale: 属格结构在这里表达合宜、对应的关系，而非功德或交换关系。译文保留了行为必须与悔改相符的道德要求，同时不把果子解释为获得悔改的代价。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们”明确反映第二人称复数；“结出……果子”保留原文隐喻，并符合自然汉语搭配。
