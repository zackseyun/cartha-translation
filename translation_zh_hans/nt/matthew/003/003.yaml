id: MAT.3.3
reference: Matthew 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: zh_hans
  text: 因为这人就是借着先知以赛亚所说的那一位。以赛亚说：“有人在旷野[a]呼喊的声音：‘要预备主[b]的道路，把他的路径修直。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可断句为：“有人呼喊的声音：‘要在旷野预备主的道路……’”
    reason: 保留ἐν τῇ ἐρήμῳ修饰范围及引文断句上的歧义。
  - marker: b
    text: 也可译为“耶和华”。这里引用以赛亚书40:3；该处希伯来文本为神名“耶和华”。
    reason: 说明希腊文“主”背后的希伯来文神名背景，并保留相应的可选译法。
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指向上文的施洗约翰；“这人”既保留指示意味，也符合现代汉语表达。
- source_word: γάρ
  choice: 因为
  rationale: 引出对上一节所述约翰身份和使命的解释。
- source_word: ὁ ῥηθεὶς
  choice: 所说的那一位
  rationale: 将带冠词的被动分词作为指人的名词性结构处理，并保留“被提到、被说及”的含义。
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: 借着先知以赛亚
  rationale: διά加属格在此表达中介；“借着”保留预言由以赛亚传达的意味，不简化为单纯的作者署名。
- source_word: λέγοντος
  choice: 以赛亚说
  rationale: 分词在语法上与“先知以赛亚”呼应；在汉语中明确主语，避免“他说”被误解为约翰说。
- source_word: Φωνὴ βοῶντος
  choice: 有声音……呼喊
  rationale: 以自然汉语保留“声音”和“呼喊”两个意象；不生硬直译为“一个呼喊者的声音”。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: 符合约翰事工的地理背景，也延续以赛亚引文的荒野意象；其修饰范围的另一种理解列入脚注。
- source_word: Ἑτοιμάσατε τὴν ὁδὸν
  choice: 要预备……的道路
  rationale: 命令语气以“要”表达；“道路”兼顾实际道路和属灵预备的比喻。
- source_word: κυρίου
  choice: 主
  rationale: 直接对应希腊文κύριος；以赛亚书40:3希伯来文本使用神名的背景另见脚注。
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: 把他的路径修直
  rationale: “修直”自然呈现使道路笔直的行动意象，“路径”与前面的“道路”形成诗歌式对应，并保留αὐτοῦ的人称指向。
theological_decisions:
- issue: 马太引用以赛亚书40:3时，κύριος背后的希伯来文是神名YHWH
  choice: 正文译作“主”
  alternative: 可按希伯来文背景理解为“耶和华”
  rationale: 正文优先呈现现存希腊文本κύριος，同时用脚注说明引文在希伯来文本中的神名背景，从而不掩盖其互文和神学张力。
- issue: ἐν τῇ ἐρήμῳ的修饰范围
  choice: 正文理解为声音在旷野呼喊
  alternative: 也可理解为命令人在旷野预备主的道路
  rationale: 希腊语标点并非原始文本的一部分；通行的马太叙事理解使该短语描述呼喊发生之处，但以赛亚书希伯来文本的句法传统容许另一种断句，因此在脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着先知以赛亚”保留先知作为传达者的表达；引文使用平行的“道路／路径”和“预备／修直”，维持先知性诗句的节奏。
