id: MAT.2.6
reference: Matthew 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: zh_hans
  text: '你这犹大地的伯利恒啊，

    在犹大的众首领中，

    你绝不是最小的；

    因为将有一位统治者从你而出[a]，

    他要牧养[b]我的子民以色列。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从你而出”也可译作“从你那里出来”；原文动词有“出去、出来”的意思。
    reason: lexical_alternative
  - marker: b
    text: “牧养”也含有“治理”的意思，同时保留君王领导与牧人照料的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ Ἰούδα
  choice: 犹大地
  rationale: γῆ在这里指与犹大相关的地域；译作“犹大地”既保留地理含义，也能自然地修饰“伯利恒”。
- source_word: οὐδαμῶς
  choice: 绝不是
  rationale: 该副词带有强烈否定语气；“绝不是”比单纯的“不是”更准确地传达强调。
- source_word: ἐλαχίστη
  choice: 最小的
  rationale: 此处涉及地位或重要性上的最低等级。“最小的”保留原文最高级形式，也与伯利恒规模虽小、地位却不低的反差相呼应。
- source_word: ἡγεμόσιν
  choice: 众首领
  rationale: 该词表示掌权或领导者。“众首领”保留原文所说的治理角色，同时不限定为某种具体官职。
- source_word: ἐξελεύσεται
  choice: 从你而出
  rationale: ἐξέρχομαι的将来时具有“出去、出来”的基本含义；“从你而出”简洁庄重，并自然表达这位统治者出自伯利恒。
- source_word: ἡγούμενος
  choice: 一位统治者
  rationale: 此处为名词化分词，指承担领导、治理职责的人。“统治者”保留其政治和君王层面的含义。
- source_word: ποιμανεῖ
  choice: 牧养
  rationale: ποιμαίνω本义为像牧人一样照管羊群，也可比喻治理。正文保留“牧养”，以呈现牧人意象；其治理含义在脚注中说明。
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: 我的子民以色列
  rationale: 这一译法直接保留圣约性的“我的子民”，并让“以色列”作为同位语指明这子民的身份。
theological_decisions:
- issue: 将要来临者身上的君王治理与牧人照料双重意象
  choice: 将ἡγούμενος译作“一位统治者”，将ποιμανεῖ译作“牧养”。
  alternative: 把两个词都处理成政治语言，如“领袖／治理”；或都处理成牧养语言。
  rationale: 原文有意并置治理与牧养的意象。分别译作“统治者”和“牧养”，可避免把经文的张力缩减为单纯的政治统治或单纯的牧人照料。
- issue: 伯利恒与“犹大的众首领”之间不寻常的比较
  choice: 保留“在犹大的众首领中”的原文表达。
  alternative: 为求顺畅而改译为“在犹大的诸城中”或“在犹大的各地区中”。
  rationale: 希腊文本明确使用表示首领或掌权者的ἡγεμόσιν。虽然城镇与首领之间的比较在中文中略显突兀，但不应擅自把它改成城镇或行政区，以免消除引文自身的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“你这……啊”体现直接呼语；按诗体分行，以呈现引文的节奏。正文避免古奥词语，但用“从你而出”保持经文语体的凝练。
