id: MAT.2.22
reference: Matthew 2:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: zh_hans
  text: 但他听说亚基老接替他父亲希律，在犹太地作王，就害怕到那里去；又在梦中得到警示[a]，便退往加利利一带。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得到指示”；原文动词常指来自神的警告或指示，但此处没有明说发出者。
    reason: 说明词义范围及原文隐含而未明说的神圣施事者。
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: 但他听说
  rationale: 不定过去时分词交代先于主要动作的情形；“听说”符合消息传闻的语境，δὲ则以“但”表现叙事中的转折。
- source_word: Ἀρχέλαος βασιλεύει τῆς Ἰουδαίας
  choice: 亚基老……在犹太作王
  rationale: βασιλεύω带属格表示统治某地；“在犹太作王”既保留君王含义，也符合现代汉语表达。
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: 接替父亲希律
  rationale: ἀντί在此表示取代、继任；“接替”自然清楚，但不额外断言正式继承的具体政治性质。
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: 就不敢到那里去
  rationale: 原意是因害怕而不愿前往；汉语“不敢”自然表达恐惧对行动造成的阻止作用。
- source_word: χρηματισθεὶς
  choice: 得到警示
  rationale: 该被动分词在马太福音中常涉及来自神的警告或指示；“得到警示”保留被动含义，同时不在正文中补出原文未明说的施事者。
- source_word: κατ’ ὄναρ
  choice: 在梦中
  rationale: 准确而自然地表达借梦领受启示的情境。
- source_word: ἀνεχώρησεν
  choice: 退往
  rationale: ἀναχωρέω在此指因危险或所得警示而有目的地离开；“退往”比一般的“前往”更能体现避开的意味。
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: 加利利一带
  rationale: μέρη为复数，指某地的区域；“一带”是现代汉语中自然的地域表达，也避免生硬直译为“各地区”。
theological_decisions:
- issue: 是否明确指出警示来自神
  choice: 正文采用“得到警示”，不补出“神”作为施事者。
  alternative: “蒙神警示”或“得到神的指示”
  rationale: 上下文和χρηματίζω的用法暗示神圣启示，但希腊文此处使用被动式而未明说施事者。保留这种含蓄表达，既不削弱启示意味，也不超出本节明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“在犹太作王”“不敢到那里去”“退往加利利一带”兼顾原文语义与自然汉语；脚注标记紧随其所说明的“得到警示”。
