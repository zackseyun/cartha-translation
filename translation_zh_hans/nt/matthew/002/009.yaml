id: MAT.2.9
reference: Matthew 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: zh_hans
  text: 他们听了王的话，就上路了。看哪，他们先前在东方[a]看见的那颗星一直走在他们前面，直到来到孩子所在之处的上方，便停住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在东方”或译“（星）升起时”。希腊语这一表达既可指东方这个地域或方向，也可指星的升起。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: 听了王的话
  rationale: ἀκούω加人物属格表示听某人所说的话；这样译成现代汉语自然，也不把上下文中的“希律”补入本节。
- source_word: ἐπορεύθησαν
  choice: 就上路了
  rationale: 表达他们听完王的话之后启程前行，符合不定过去分词与主句动词的先后关系。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文提示读者注意突发景象的叙事标记及其生动感。
- source_word: ὁ ἀστὴρ ὃν εἶδον
  choice: 他们先前……看见的那颗星
  rationale: “先前”清楚表达看见星发生在本段星引路以前；“那颗星”符合汉语特指表达。
- source_word: ἐν τῇ ἀνατολῇ
  choice: 在东方
  rationale: 保留该短语常见的地域性理解，同时以脚注注明也可指星的升起，不消除希腊语本身的歧义。
- source_word: προῆγεν αὐτούς
  choice: 走在他们前面
  rationale: 贴近προάγω“在前面行进”的形象，不额外说明这颗星以何种机制引领他们。
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: 直到来到……就停住了
  rationale: 自然呈现先来到、继而停住的动作次序；“停住”在现代汉语中比字面“站住”更适合描述星。
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: 孩子所在之处的上方
  rationale: 准确表达星位于孩子所在地点之上，不把原文未明说的建筑或具体位置加入译文。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: 直接对应παιδίον，不额外强化年龄。
theological_decisions:
- issue: 星“在东方”还是“升起时”被看见
  choice: 正文译“在东方”，脚注保留“升起时”
  alternative: 他们看见它升起
  rationale: ἐν τῇ ἀνατολῇ既可按地域理解为“在东方”，也可能是天文学意义上的“在它升起时”。正文采用熟悉且通顺的地域译法，脚注保存真实歧义，不借翻译裁定星象解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“看哪”有意保留经文叙事中的注意标记；其余句式避免古奥化。脚注标记[a]紧随存在歧义的短语。
