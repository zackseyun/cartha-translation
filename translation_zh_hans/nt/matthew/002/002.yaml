  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: zh_hans
  text: 他们问道：“那位生来就是犹太人之王的在哪里？因为我们在东方[a]看见了他的星，所以来向他下拜[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在它升起的时候。”希腊语短语既可表示“在东方”，也可指这颗星的升起。
    reason: alternative_reading
  - marker: b
    text: 或译：“敬拜他。”原词可指向君王俯伏致敬，也可指敬拜，须由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 问道
  rationale: 该现在分词引出智者所说的问话；汉语叙事中“问道”比直译“说着”更自然，又不改变言语行为的内容。
- source_word: Ποῦ ἐστιν
  choice: 在哪里
  rationale: 直接保留原文的处所问句，不作弱化或扩展。
- source_word: ὁ τεχθεὶς
  choice: 那位生下来的
  rationale: 保留带冠词的被动分词所指的那一位及其出生事实；结合后面的王号，以“生下来就是”自然表达其出生时即具有王的身份，而不额外限定为婴儿。
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人之王
  rationale: 以庄重而通行的王号表达属格结构，保留其政治及弥赛亚意味。
- source_word: εἴδομεν γὰρ
  choice: 因为我们……看见了
  rationale: “因为”明确表达γάρ所引出的理由；“看见了”自然对应简单过去事件。
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: 他的星
  rationale: 自然表达所有关系，同时不擅自说明这颗星的性质。
- source_word: ἐν τῇ ἀνατολῇ
  choice: 在东方
  rationale: 采用在语境中成立且传统通行的方位义；原短语也可能指星升起，故在脚注保留该解释。
- source_word: ἤλθομεν
  choice: 就来
  rationale: 在汉语直接引语中自然表达他们因见星而来到此地，以及此行动与当前说话处境的关联。
- source_word: προσκυνῆσαι αὐτῷ
  choice: 向他下拜
  rationale: “下拜”保留俯伏致敬这一动作，也能涵盖臣民向君王致敬和宗教性的敬拜，不在正文中提前消除原词的语义张力。
theological_decisions:
- issue: προσκυνῆσαι用于孩童耶稣时应表达王者礼敬还是宗教敬拜
  choice: 向他下拜
  alternative: 敬拜他
  rationale: 上下文直接称他为“犹太人之王”，因此王者礼敬是明确的语境框架；但该动词也可表示敬拜。“下拜”兼顾可见动作和两种可能指向，脚注则明示“敬拜他”这一重要译法，从而保留马太叙事中的基督论张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那位……的，在哪里”保留原句焦点；“犹太人之王”沿用清晰正式的王号；两处真实歧义均在正文标注并由脚注说明。
