id: MAT.2.19
reference: Matthew 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: zh_hans
  text: 但希律死后，看哪，主的一位天使[a]在梦中向身在埃及的约瑟显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主的那位天使。”希腊文在“天使”前没有冠词。
    reason: 保留非特指与传统特指译法之间的可能差异，避免正文替原文解决其未明确限定的身份问题。
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: 但希律死后
  rationale: 将属格独立结构按时间关系自然译为“希律死后”；“但”保留 δὲ 所表达的轻微转折和叙事推进。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留马太叙事中这一引人注意的鲜明标记，同时维持庄重的经文语体。
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: ἄγγελος 前无冠词，因此用“一位”表达非特指；κύριος 在此按惯用的神圣称谓译为“主”。
- source_word: φαίνεται
  choice: 显现
  rationale: 该词为叙事中的历史现在时；汉语“显现”无需强加过去时标记，也保留其生动感。
- source_word: κατ’ ὄναρ
  choice: 在梦中
  rationale: 这是马太用来表示借梦得启示的固定表达，译为“在梦中”自然明确。
- source_word: τῷ Ἰωσὴφ
  choice: 向……约瑟
  rationale: 与“显现”搭配，用“向”自然表达与格所标示的对象。
- source_word: ἐν Αἰγύπτῳ
  choice: 身在埃及的
  rationale: 原文位置短语可理解为约瑟所在之处；译作“身在埃及的约瑟”清楚表达场景，同时不改变事件内容。
theological_decisions:
- issue: ἄγγελος κυρίου 中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处是指向上帝的惯用称谓，“主”既符合上下文，也不额外引入特定宗派解释。
- issue: ἄγγελος 前无冠词
  choice: 主的一位天使
  alternative: 主的那位天使
  rationale: 正文以“一位”反映希腊文中 ἄγγελος 无冠词的形式；传统上可能出现的特指理解以脚注保留，不把相关互文或神学身份直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文的文学性和叙事突显作用；整体语序按现代汉语调整，使“身在埃及”明确修饰约瑟。
