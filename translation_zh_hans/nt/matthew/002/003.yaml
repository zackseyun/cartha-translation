  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: zh_hans
  text: 希律王听见这事，就感到不安；整个耶路撒冷[a]也和他一同不安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “整个耶路撒冷”是用城名代指城中居民；这也可能是一种概括或夸张的说法，描写全城普遍的不安。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见这事
  rationale: 该不定过去时分词在句中表示时间背景；“这事”承接上文博士所报告的消息，使现代汉语表达自然清楚。
- source_word: δὲ
  choice: 就
  rationale: δέ是轻微的衔接词；结合时间性分词，用“就”自然呈现事件承接，不另作强转折。
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: 希律王
  rationale: 符合现代汉语称谓次序，同时保留其君王头衔和专名。
- source_word: ἐταράχθη
  choice: 心里不安
  rationale: ταράσσω在此指内心受到扰动、惊慌不安；“心里不安”自然且不过度限定情绪强度。
- source_word: πᾶσα Ἱεροσόλυμα
  choice: 全耶路撒冷
  rationale: 保留原文以城市名代指其居民的转喻，也不擅自把范围缩小为领袖阶层。
- source_word: μετ’ αὐτοῦ
  choice: 也同他一起
  rationale: 准确表达μετά加属格所表示的伴随关系；“也”清楚连接希律与耶路撒冷共同的不安。
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα的范围
  choice: 保留“全耶路撒冷”这一整体性、转喻性的说法
  alternative: 理解为耶路撒冷许多人，或特别指城中的领导阶层
  rationale: 原文把整座城作为整体来陈述，可能带有概括或夸张色彩，但没有明确限定为某一群体，因此正文不替原文缩窄范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“心里不安”避免单用“不安”可能造成的句式生硬；分号呈现希律与全城反应之间紧密而有层次的并列关系。
