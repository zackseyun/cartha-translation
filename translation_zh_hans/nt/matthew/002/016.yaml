  to: 那时，希律见自己被星相家[a]愚弄了，就大为恼怒，便派人杀了伯利恒和它四周所有地区两岁及以下的男孩；年龄的界限是照着他从星相家那里仔细查明的时间。
  rationale: 修订直接保留“按着／照着他从星相家那里仔细查明的时间”这一原文依据关系，避免将隐含的年龄判断进一步表达为明确的“定”范围；同时移除原文未指定的“城里”。其余关键语义、叙事语体和脚注锚点均予保留。
