id: MAT.2.16
reference: Matthew 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: zh_hans
  text: 那时，希律见自己被星相家[a]愚弄了，就大为恼怒，便派人杀了伯利恒和它四周所有地区两岁及以下的男孩；年龄的界限是照着他从星相家那里仔细查明的时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“博士”。这里的希腊词指古代与星象、占卜和学问相关的人。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然承接前文，表达事件随即发生，不增加原文没有的精确时间含义。
- source_word: ἰδὼν ὅτι ἐνεπαίχθη
  choice: 见自己被……愚弄了
  rationale: 保留“看出/意识到”的感知含义；“愚弄”兼有受骗和被当作笑柄的意味，较好呈现ἐμπαίζω在本语境中的张力。
- source_word: τῶν μάγων
  choice: 星相家
  rationale: μάγοι在此指与星象、占卜及学问相关的人；“星相家”比传统的“博士”更具体，又不采用生硬音译。
- source_word: ἐθυμώθη λίαν
  choice: 大为恼怒
  rationale: 准确表达动词的发怒含义和λίαν的强烈程度，语体庄重而自然。
- source_word: ἀποστείλας
  choice: 于是派人
  rationale: 分词表示希律差遣执行者；原文未明说宾语，中文为使行动关系清楚而补出泛指的“人”。
- source_word: ἀνεῖλεν
  choice: 杀了
  rationale: 直接表达ἀναιρέω在此处“杀死”的含义，不作淡化。
- source_word: πάντας τοὺς παῖδας
  choice: 所有……男孩
  rationale: παῖδας本可泛指孩子，但本叙事中希律寻找的是男孩，故用“男孩”明确其语境所指。
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: 伯利恒城里和周围各处
  rationale: ὅρια在此指伯利恒周围所辖或邻近地区；“周围各处”比直译“边界”更符合现代汉语。
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: 两岁以内
  rationale: 表达包括两岁在内的年龄上限，简洁自然。
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: 照着他向星相家仔细查明的时间
  rationale: 保留κατά的依据关系和ἀκριβόω“准确、仔细查明”的含义；后补“这个年龄范围……定的”使其与前面的年龄限制在中文中关系清楚。
theological_decisions:
- issue: μάγοι的身份称谓
  choice: 星相家
  alternative: 博士／智者
  rationale: “博士”是熟悉的传统译法，却容易使现代读者联想到学位；“星相家”更直接反映这些人的历史文化身份，同时不引入后来关于人数、王者身份等传统。
- issue: ἐνεπαίχθη所表达的是欺骗还是嘲弄
  choice: 愚弄了
  alternative: 骗了／戏弄了
  rationale: 该词可指嘲弄，也可指使人受愚弄。本处叙事强调他们没有按希律的要求返回；“愚弄”既传达受骗的情境，也保留希律觉得自己被人当作愚人的意味，避免只锁定其中一面。
- issue: παῖδας的性别范围
  choice: 男孩
  alternative: 孩子
  rationale: 该名词本身可泛指儿童，但上下文所追杀的对象由“那个孩子”及男性弥赛亚的叙事目标限定为男童；采用“男孩”呈现语境所指，并不扩大为所有儿童。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“大为恼怒”“仔细查明”保持经文语体的严肃性；分号将屠杀命令与年龄依据清楚连接。脚注标记[a]紧随“星相家”，与脚注内容准确对应。
