  source_fidelity: 草稿整体忠实呈现叙事次序、希律的强烈愤怒、差遣人手、杀害对象、地域和年龄上限。“愚弄”能保留ἐνεπαίχθη在此既有受骗又有受辱的语气；“星相家”也可作为μάγοι的现代汉语表达。惟“这个年龄范围，是……定的”把原文“按着他从星相家那里仔细查明的时间”改写为对年龄范围的明确设定，虽属合理推论，却略增解释；修订为直接附带该依据。并删去“城里”，因为原文只说伯利恒，未特别标作城。
  naturalness: 修订后句法更紧凑自然，避免分号后以解释性完整分句突兀地重述年龄范围。“伯利恒和它四周所有地区”也比“伯利恒城里和周围各处”更直接对应原文的并列地点。
  terminology: 保留“希律”“伯利恒”“星相家”“大为恼怒”等用语。“星相家”不等同现代学术天文学家，脚注说明其古代文化语境即可；“两岁及以下”明确包括两岁。
