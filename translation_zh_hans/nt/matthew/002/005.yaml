base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: zh_hans
  text: 他们对他说：“在犹太地的伯利恒，因为先知曾这样写道：[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“因为经上是借着先知这样写的。”原文用完成时被动式，是引用经文的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν αὐτῷ
  choice: 他们回答他
  rationale: οἱ承接上一节的祭司长和经学家；δέ是轻微承接，中文不必另译。“回答他”结合语境自然表达εἶπαν αὐτῷ，同时不增添原文没有的信息。
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: 在犹太的伯利恒
  rationale: ἐν表示地点；属格τῆς Ἰουδαίας用于指明是哪一座伯利恒。“犹太”采用现代中文圣经地名的通行形式。
- source_word: οὕτως γὰρ
  choice: 因为……这样
  rationale: γάρ说明他们作答的依据；οὕτως向后指向下一节所引的经文。中文将“这样”置于“记载”前，既自然又保留其前指引文的作用。
- source_word: γέγραπται
  choice: 曾……记载
  rationale: 这是γράφω的完成时被动式，也是引用经文的惯用表达。“曾记载”体现过去写成而现今仍具效力的语感；“经上记着”亦属可能译法，见脚注。
- source_word: διὰ τοῦ προφήτου
  choice: 先知……记载
  rationale: διά加属格表示媒介或施事。为使现代中文顺畅，将媒介短语融入主动式表达；此处仍表明引文经由先知传达，未指定先知姓名。
theological_decisions:
- issue: 先知作为启示的传达媒介
  choice: 先知曾这样记载
  alternative: 经上借着先知这样写着
  rationale: 所选译文自然表达先知的媒介角色，不额外明说终极说话者；备选更形式对应，但现代中文稍显拗口。
- issue: γέγραπται的经文引用公式
  choice: 曾……记载
  alternative: 经上记着
  rationale: 正文兼顾完成时语感和中文自然度；脚注保留传统、惯用的经文引用表达，避免将完成时的意义限定得过窄。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“在犹太的伯利恒”简洁指明地点；以逗号连接回答和依据，保留原文连续引语及γάρ的因果关系。
