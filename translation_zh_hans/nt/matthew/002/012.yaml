  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: zh_hans
  text: 他们在梦中受到警告，不要回到希律那里；他们就从另一条路回自己的国家去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在梦中得到指示……”。原文的被动语态暗示这警告来自神，但本节没有明确提到神。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: 得到指示
  rationale: 该被动分词在马太福音的语境中指领受来自神的警示或指示。“得到指示”自然庄重，也保留了原文未明说施事者的特点。
- source_word: κατ’ ὄναρ
  choice: 在梦中
  rationale: 这是马太常用的表达，指人在梦中领受启示；“在梦中”符合现代汉语习惯。
- source_word: μὴ ἀνακάμψαι
  choice: 不要回到
  rationale: μή加不定式表达指示的内容；此处是叫他们不要返回希律那里。
- source_word: πρὸς Ἡρῴδην
  choice: 希律那里
  rationale: πρός加宾格表示朝向某人；结合“回到”，译作“希律那里”最自然。
- source_word: δι’ ἄλλης ὁδοῦ
  choice: 从另一条路
  rationale: ὁδός在旅行叙事中指道路或路线；“从另一条路”具体清楚，并贴近原文。
- source_word: ἀνεχώρησαν
  choice: 去了
  rationale: ἀναχωρέω可指离开、退去；与目的地和路径连用时，汉语以“回……去了”自然表达离去并返乡的动作。
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: 回自己的国家
  rationale: χώρα可指国家、地区或地方；结合他们返乡的叙事语境，“自己的国家”清楚表达目的地及所属关系。
theological_decisions:
- issue: 警示或指示的隐含神圣来源
  choice: 正文采用“得到指示”，不明加“神”作施事者。
  alternative: “得到神的指示”或“受到神的警告”
  rationale: 被动式在上下文中强烈暗示指示来自神，但本节希腊文没有明确说出神；译文保留这种暗示和含蓄。
translation_notes:
  register: 采用现代、自然且庄重的叙事语言。“回自己的国家去了”符合普通话行程叙述习惯；脚注说明“得到指示”也可理解为“受到警告”，并保留神圣施事者未明说的张力。
