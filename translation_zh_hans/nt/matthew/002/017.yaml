  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: zh_hans
  text: 那时，借着耶利米先知所说的话就应验了：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 保留叙事中的时间推进；“那时”在现代汉语中自然、庄重，也不额外解释事件之间的因果关系。
- source_word: ἐπληρώθη
  choice: 就应验了
  rationale: 准确保留马太反复使用的“应验”用语；“就”承接“那时”，使汉语句势自然，但不把原文扩写为目的关系。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 将带冠词的被动分词实体化，译成自然的现代汉语，同时保留“已经说出之话”的含义。
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: 借着耶利米先知
  rationale: “借着”保留διά加属格所表达的媒介或代理意味；“耶利米先知”符合自然汉语称谓。
- source_word: λέγοντος
  choice: 冒号引出下文引语
  rationale: 该分词引出下一节的引文，并在语法上与“耶利米”呼应。若机械译作“说”，会与“所说的话”重复且形成生硬汉语；冒号清楚保留其引介引文的功能。
theological_decisions:
- issue: 马太的应验公式
  choice: 明确保留“应验了”
  alternative: 发生这事是要应验／使……得以应验
  rationale: 原文此处是简单的被动式“应验了”，并未明说目的关系；译文保留马太的神学文学用语，同时不添加原文没有的因果或目的说明。
- issue: 预言话语的媒介
  choice: “借着耶利米先知所说的话”
  alternative: “耶利米先知所说的话”
  rationale: 保留διά的媒介意味，使先知作为话语传达者的角色可见，却不进一步界定话语最终来源。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。语序尽量贴近原文，又避免把λέγοντος机械重复译成“说”所造成的累赘；以冒号自然衔接下一节引文。
