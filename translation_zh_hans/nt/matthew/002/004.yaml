id: MAT.2.4
reference: Matthew 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: zh_hans
  text: 他召集了百姓中所有的祭司长和经学家，向他们询问弥赛亚[a]要在哪里出生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”，意为“受膏者”。这里采用“弥赛亚”，以体现当时犹太人期待受膏君王的语境。
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: 召集了
  rationale: 不定过去时分词所表示的动作在主句的询问之前发生；汉语用“召集了……，向……”自然呈现这一先后关系。
- source_word: πάντας
  choice: 所有的
  rationale: 保留原文涵盖全部相关祭司长和经学家的语义。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指当时犹太人的高级祭司领袖，并非多位同时在任的大祭司；“祭司长”是准确且通行的译法。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 这些人是研究、解释并教授律法的专家；“经学家”比现代汉语中容易被理解为抄写员的“文士”更清楚，同时避免扩写为解释性称谓。
- source_word: τοῦ λαοῦ
  choice: 百姓中
  rationale: 以自然汉语表达这些祭司长和经学家属于本民族百姓这一范围，不额外加入原文未明说的族名。
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: 向他们询问
  rationale: 保留未完成时的过程性语气，同时不以“不断追问”等措辞过度强化反复意味。
- source_word: ποῦ
  choice: 在哪里
  rationale: 直接对应地点疑问词。
- source_word: ὁ χριστὸς
  choice: 弥赛亚
  rationale: 此处指犹太人所期待的受膏君王，作为称号译为“弥赛亚”最能体现语境；脚注列出传统译名“基督”。
- source_word: γεννᾶται
  choice: 要……出生
  rationale: 原文为现在时被动式，但在有关所期待之弥赛亚出生地点的间接问句中具有预期、将来的指向；汉语用“要……出生”自然传达此意。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 希律所问的是犹太预言中受期待的受膏者，故正文采用更直接呈现犹太弥赛亚语境的“弥赛亚”；脚注保留“基督”这一传统对应译法，不把称号当作人名处理。
- issue: γεννᾶται的时间指向
  choice: 要在哪里出生
  alternative: 在哪里出生
  rationale: 现在时形式处于关于预期人物出生地的间接问句中，语境指向将来或预定发生之事；“要”呈现这种预期，但不把它解释成道德义务。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“祭司长”沿用清楚稳定的宗教历史称谓；“经学家”突出其律法研究与解释职能。句式紧凑，并保留召集在先、询问在后的动作关系。
