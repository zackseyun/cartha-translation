language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: zh_hans
  text: 他们进了房子，看见孩子同他母亲马利亚在一起，就俯伏在地，向他致敬[a]。他们打开自己的宝物，把礼物献给他：黄金、乳香和没药。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜他。”希腊语动词既可指敬拜，也可按语境指以俯伏表示尊崇或敬意。
    reason: 保留 προσκυνέω 在本处可能具有的宗教敬拜与王者致敬两种语义力度。
lexical_decisions:
- source_word: οἰκίαν
  choice: 房子
  rationale: 直接表达具体的居住建筑，不把场景泛化为“家中”，也不增添客店或马棚等原文没有的信息。
- source_word: παιδίον
  choice: 孩子
  rationale: 准确保留对年幼者的普通称呼；“男孩”比希腊词本身更具体，“婴孩”则可能暗示更小的年龄。
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: 和他母亲马利亚在一起
  rationale: 自然表达 μετά 的陪同关系，并清楚保留马利亚是孩子母亲这一同位说明。
- source_word: πεσόντες
  choice: 俯伏在地
  rationale: 在汉语中自然、鲜明地呈现身体伏下的姿态，同时与随后表示尊崇的动词区分开来。
- source_word: προσεκύνησαν
  choice: 向他致敬
  rationale: προσκυνέω 可指敬拜，也可指向尊贵者俯伏致敬；正文用“致敬”保留直接语境中的尊崇含义，并以脚注保留“敬拜”的可能。
- source_word: θησαυροὺς
  choice: 宝匣
  rationale: 本处说“打开”后取出礼物，语境指盛放贵重物品的容器；“宝匣”在现代汉语中比直译为“珍宝”更自然，也不必具体想象为大型箱子。
- source_word: προσήνεγκαν αὐτῷ δῶρα
  choice: 把礼物献给他
  rationale: “献给”符合正式而尊敬的赠礼场景，并保留 προσφέρω 所带的郑重意味；“礼物”则不预先限定为祭物。
- source_word: χρυσὸν καὶ λίβανον καὶ σμύρναν
  choice: 黄金、乳香和没药
  rationale: 分别采用准确且已通行的现代中文名称；λίβανος 特指乳香，而非泛指香料或香。
theological_decisions:
- issue: προσκυνέω 用于孩童耶稣时应译作“致敬”还是“敬拜”
  choice: 向他致敬
  alternative: 敬拜他
  rationale: 这个动词既可描述向君王或尊贵者俯伏致敬，也可表示宗教性的敬拜。叙事中的举动具有深切尊崇意味，但正文不应强行排除王者致敬或神圣敬拜中的任何一层可能，因此采用较宽的“致敬”，并在脚注列出“敬拜”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“俯伏在地，向他致敬”把身体动作与其尊崇含义分别表达；“随后”使一连串希腊语分词在汉语中衔接清楚。“就是”自然引出三样礼物。脚注标记紧随存在翻译歧义的“致敬”之后。
