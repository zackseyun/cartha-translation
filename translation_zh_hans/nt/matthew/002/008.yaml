source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: zh_hans
  text: 他派他们往伯利恒去，说：“你们去仔细查访那孩子；找到了，就报告给我，好让我也去敬拜他[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他俯伏致敬”或“向他表示敬意”。希腊语这个动词既可指敬拜，也可指在君王面前俯伏致敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: 派他们……去
  rationale: 不定过去时分词与主句动词“说”联系紧密，表示希律差派他们前往伯利恒；汉语以连动结构表达最自然，也不必强行加入原文未明说的“之后”而造成时间上的生硬感。
- source_word: Πορευθέντες
  choice: 你们去
  rationale: 该分词与命令式ἐξετάσατε连用，在此具有伴随命令的作用；译作“你们去……查访”符合现代汉语指令表达。
- source_word: ἐξετάσατε ἀκριβῶς
  choice: 仔细查访
  rationale: ἐξετάζω含详加询问、调查之意，ἀκριβῶς强调准确、周密；“仔细查访”既体现调查与询问，也适合寻找孩子的叙事情境。
- source_word: περὶ τοῦ παιδίου
  choice: 那孩子
  rationale: περί在查问动词之后标明调查对象；汉语可直接说“查访那孩子”，比“查访关于那孩子的事”简洁自然。定冠词在既知所指的语境中译作“那”。
- source_word: ἐπὰν δὲ εὕρητε
  choice: 找到了
  rationale: ἐπάν加虚拟式表达将来未定而预期的情形。汉语“找到了”自然保留条件兼时间意味，不把它过度限定为纯粹的“如果”或确定的“等到”。
- source_word: ἀπαγγείλατέ μοι
  choice: 回来报告我
  rationale: ἀπαγγέλλω表示把消息报告给某人；“报告我”保留回报之意。语境中的“回来”是汉语自然表达的方向补充，说明他们须将结果带回希律。
- source_word: ὅπως κἀγὼ
  choice: 好让我也
  rationale: ὅπως表示目的，κἀγώ为καὶ ἐγώ的缩合，突出“我也”；“好让我也”自然传达希律所声称的共同目的。
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: 去敬拜他
  rationale: 分词ἐλθών与虚拟式προσκυνήσω组成先行并相连的动作，汉语译作“去敬拜”。προσκυνέω可指俯伏致敬，也可指敬拜；正文采用“敬拜”，同时以脚注保留王室敬礼的词义可能。
theological_decisions:
- issue: προσκυνέω用于婴孩耶稣时应译为宗教性的“敬拜”还是王室性的“俯伏致敬”
  choice: 敬拜他
  alternative: 向他俯伏致敬／向他表示敬意
  rationale: 该词本身涵盖敬拜与向尊贵者俯伏致敬。马太叙事中以耶稣为对象时容许较强的“敬拜”含义，但本节说话者希律声称要朝见一位王，也使王室致敬的意义保持可能。因此正文采用“敬拜”，脚注明确保留词义张力，不以希律真实意图来消除原话的双重意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“仔细查访”比单纯“寻找”更能体现详加调查的含义；“找到了”保留ἐπάν结构在条件与时间之间的自然张力。脚注标记紧接“敬拜他”，准确对应存在词义歧义的位置。
