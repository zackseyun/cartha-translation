id: MAT.2.14
reference: Matthew 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: zh_hans
  text: 于是他起来，连夜带着孩子和孩子的母亲，往埃及去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 于是
  rationale: 这里是轻微的叙事连接词，并承接上一节的命令；“于是”自然地推进情节，也表达约瑟随即遵行。
- source_word: ἐγερθεὶς
  choice: 起来
  rationale: 不定过去时分词表示先于主要动词或与之紧密相连的动作；“起来”符合现代汉语叙事表达，不必生硬译成“既已起身”。
- source_word: παρέλαβε
  choice: 带着
  rationale: παραλαμβάνω在此指把人带在身边同行；“带着”比单译“带”更自然，也不会误解为“接纳”。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: 忠实表达παιδίον的普通含义，不额外加入“幼小”等原文未强调的信息。
- source_word: τὴν μητέρα αὐτοῦ
  choice: 孩子的母亲
  rationale: 希腊文直译为“他的母亲”，其中代词指孩子；汉语若译“他的母亲”可能误指约瑟，因此明说“孩子的母亲”以消除目标语自身造成的歧义。
- source_word: νυκτὸς
  choice: 连夜
  rationale: 时间属格表示夜间行动；“连夜”在现代汉语中自然简洁，并在不夸张原意的前提下体现他们夜间立即启程。
- source_word: ἀνεχώρησεν
  choice: 去了
  rationale: ἀναχωρέω在此表示离开并前往别处；与“往埃及”搭配时，“去了”自然庄重，且没有额外强化为逃亡或撤退。
- source_word: εἰς Αἴγυπτον
  choice: 往埃及
  rationale: εἰς表示朝向目的地的移动；“往埃及去了”准确、自然地传达这一方向和终点。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是……连夜……去了”保持原文动作紧凑的次序。英文咨询文本所列脚注内容“Or ‘to Egypt.’”与其正文标记位置不一致；因希腊文εἰς Αἴγυπτον在本句中没有需要读者特别留意的实质歧义，中文稿不设脚注。
