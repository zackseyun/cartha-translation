  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: zh_hans
  text: “在拉玛听见了声音：哭泣和极大的哀号。拉结为她的儿女哭泣，不愿受安慰[a]，因为他们已经不在了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不肯受安慰”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为他们不在。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: 在拉玛听见了声音
  rationale: 保留φωναί的“声音”及ἠκούσθη的被动表达，也使中文语序自然；拉玛按通行译名音译。
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: 哭泣和深切的哀号
  rationale: κλαυθμός指可听见的哭泣，ὀδυρμός指哀恸、哀号；πολύς在此加强哀恸程度，译作“深切的”庄重而不过度发挥。
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: 拉结为她的儿女哭泣
  rationale: 用通行圣经人名“拉结”；τέκνα是涵盖性别的“儿女”，κλαίουσα表现持续哭泣。
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: 不肯受安慰
  rationale: οὐκ ἤθελεν直译为“不愿意”，但现代汉语“不肯”简洁自然，且仍保留意志层面；被动不定式译作“受安慰”。
- source_word: ὅτι οὐκ εἰσίν
  choice: 因为他们已经不在了
  rationale: 原文直为“因为他们不在”；“已经不在了”保留死亡或失去所造成的不在场这一含蓄而沉痛的表达，不直接增译“死了”。
theological_decisions:
- issue: 引文中拉结的身份与象征意义
  choice: 正文保留拉结作为哭泣的母亲形象，不解释其象征对象
  alternative: 直接说明拉结象征以色列的母亲们
  rationale: 希腊文本只呈现耶利米书引文中的拉结形象；翻译不应在正文中消解其预言性、母性及群体象征之间的张力。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“哀号”传达ὀδυρμός的可听见哀恸；避免古奥措辞，也不把“他们不在”明确解释为“他们死了”。所有脚注标记均置于相关正文之后。
