  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: zh_hans
  text: '他就住在那里，直到希律死去。这样，主借着先知所说的话[a]就得到了应验：


    “我从埃及召出我的儿子。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主曾借着先知所说的话”。
    reason: ῥηθέν为被动分词；中文可按语境以“曾说”表达其先前已说出的意味。
  - marker: b
    text: 引自何西阿书11:1；该处原指以色列是上帝的儿子，马太在这里指出这话在耶稣身上得到应验。
    reason: 交代引文出处及其原始语境，同时不替正文限定应验的具体方式。
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: 他在那里
  rationale: 按未完成时的简单表述直译为“在那里”，不额外加入“停留”或“住下”的含义；中文结合上文可自然理解其延续状态。
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: 一直到希律死去
  rationale: τελευτή在此指生命终结；用自然的现代汉语动词结构表达，同时保留时间界限。
- source_word: ἵνα πληρωθῇ
  choice: 这是要使……得到应验
  rationale: 保留ἵνα与被动语态所表达的目的或结果意味，不将其简化成主动的“应验了”。
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: 主借着先知所说的话
  rationale: “主”是话语的最终来源，“先知”是传达者；“借着”保留διά所表达的中介关系。
- source_word: λέγοντος
  choice: 冒号引出引文
  rationale: 中文用冒号自然承担“说”的引文引介功能，避免重复成“所说的话，说”。
- source_word: Ἐξ Αἰγύπτου
  choice: 从埃及
  rationale: ἐξ表示起点及由内向外的离开；现代汉语“从埃及”自然准确，“从埃及召出”则在动词中体现“出来”的方向。
- source_word: ἐκάλεσα
  choice: 我……召出
  rationale: καλέω在本语境中是呼召离开埃及；“召出”比单说“呼叫”自然，并保留发出召唤及离开的意象。
- source_word: τὸν υἱόν μου
  choice: 我的儿子
  rationale: υἱός明确指“儿子”；这一单数亲子称谓对何西阿书原境及马太的引用都十分重要。
theological_decisions:
- issue: 何西阿书11:1的应验方式
  choice: 保留马太明确的“得到应验”，不在正文界定应验机制
  alternative: 把经文直接解释为仅仅是预言，或在正文中明说这是预表性的重演
  rationale: 马太宣称耶稣从埃及归回应验了先知的话，但正文没有解释这种应验的具体机制；译文应保留何西阿原指以色列、马太在此用于耶稣所形成的经文张力。
- issue: κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 希腊文此处是κύριος；译作“主”忠于现有希腊文本，也不把其背后的希伯来神名直接加入正文。
- issue: “儿子”的所指
  choice: 正文保留单数“我的儿子”，脚注交代原语境与马太的运用
  alternative: 在正文改成“以色列”或加上“耶稣”
  rationale: 正文应保存引文原貌，不能将解释性的所指直接代入引语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这是要使……得到应验”保留马太应验公式的神学分量；引文另起一段，以清楚呈现经文引用。避免生硬复制希腊语的“说”，改用中文冒号引出直接引语。
