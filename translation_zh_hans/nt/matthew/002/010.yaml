  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: zh_hans
  text: 他们看见那颗星，就大大欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“他们以极其巨大的喜乐欢喜”，以同源词并层层加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见……就
  rationale: 不定过去时分词在此具有时间关系，表示看见星之后随即产生喜乐；“看见……就”自然地保留这一关系。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词；汉语借“就”承接前后动作已足够自然，无须机械加上“而”或“于是”。
- source_word: τὸν ἀστέρα
  choice: 那颗星
  rationale: ἀστήρ意为“星”；定冠词指向上下文中已经提到的特定星体，量词“颗”符合现代汉语习惯。
- source_word: ἐχάρησαν χαρὰν μεγάλην σφόδρα
  choice: 欣喜若狂
  rationale: 原文以同源宾语χαράν和形容词μεγάλην，再加副词σφόδρα层层强化喜乐。“欣喜若狂”以自然、庄重且有强烈程度的现代汉语传达整体效果；脚注保留原文独特的叠加强调形式。
