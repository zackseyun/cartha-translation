  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: zh_hans
  text: 耶稣出生在犹太地的伯利恒后，正当希律王在位时，看哪，有几位从东方来的智者[a]来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玛吉”（magi）。希腊语原词指来自东方的学识之士，可能与星象观察或宫廷学识有关。
    reason: 说明μάγοι的词义范围；保留较技术性的替代译法，同时避免把这些人物限定为施法者、君王或特定人数。
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: 耶稣……生于……之后
  rationale: 属格独立结构为主要事件提供时间背景，所述出生先于智者抵达；“……之后”在现代汉语中自然地表达这一时间关系。δέ仅有轻微的叙事衔接作用，不另加意义过重的连接词。
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: 犹太地的伯利恒
  rationale: 保留地名，并用“犹太地的”标明所属地区，也可与其他同名城镇区别。
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: 在希律王执政期间
  rationale: 这一表达用于标定历史时期；“执政期间”自然传达“在……的日子里”，同时清楚保留希律的王者身份。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引起读者注意的叙事标记；“看哪”保留其突显作用和庄重语气。
- source_word: μάγοι
  choice: 智者
  rationale: 该词指来自东方、可能从事星象观察或服务宫廷的学识之士。“智者”通俗而不过度限定其具体职业；脚注交代原词的文化含义，避免将其误解为现代学位意义上的“博士”，也不引入他们是君王或人数为三的后世传统。
- source_word: ἀπὸ ἀνατολῶν
  choice: 从东方
  rationale: 希腊语复数形式在此泛指东方地区；现代汉语以“从东方”表达最自然。
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: 来到耶路撒冷
  rationale: 动词表示来到现场或抵达，εἰς标明目的地；“来到耶路撒冷”准确而自然。
theological_decisions:
- issue: 如何翻译μάγοι而不引入后世传统
  choice: 智者
  alternative: 术士／星象学家／博士
  rationale: “智者”保留这些人物是东方学识之士这一核心信息，却不武断断定其具体职务，也不暗示他们是君王或共有三人。“术士”在现代汉语中容易使人联想到施法者，“星象学家”可能过度收窄词义，“博士”则容易被理解为现代学位。原词涉及星象或宫廷智慧的背景在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“生于”和“看哪”略带经文语体，但在当代普通读者可理解的范围内；不采用可能被误解为现代学历称号的“博士”。
