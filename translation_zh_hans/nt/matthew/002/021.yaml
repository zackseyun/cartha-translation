  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: zh_hans
  text: 于是约瑟起身，带着孩子和孩子的母亲，进入以色列地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 于是
  rationale: 此处用于推进叙事，并非表示强烈转折；“于是”自然承接前文，也保留行动的顺承关系。
- source_word: ἐγερθεὶς
  choice: 起来
  rationale: 该不定过去时被动分词在此按不及物意义使用，指起身行动；“起来”符合现代汉语叙事表达。
- source_word: παρέλαβε
  choice: 带着
  rationale: παραλαμβάνω在这里指把人带在身边同行；“带着”比单纯的“带”更自然，也准确表现同行之意。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: παιδίον泛指孩子；不额外译作“幼童”，以免加入原文未明确要求的年龄细节。
- source_word: τὴν μητέρα αὐτοῦ
  choice: 他母亲
  rationale: αὐτοῦ最自然地回指孩子；“他母亲”简洁地保留希腊文的所属关系。
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: εἰσέρχομαι意为进入或走进；“进入”庄重而自然，并与后面的地域表达相配。
- source_word: εἰς γῆν Ἰσραήλ
  choice: 以色列地
  rationale: 该短语指以色列的地域；“以色列地”是简洁、自然且具有经文语体感的现代中文表达。
- source_word: ὁ
  choice: 约瑟
  rationale: 希腊文用冠词将前文的行动者再次主语化，可直译为“他”；为避免汉语中“他”可能误指孩子，并依据直接语境明确行动者，译出“约瑟”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……起来，带着……”保持原文动作次序；明确译出“约瑟”以消除现代汉语代词歧义，不增添神学解释。
