id: MAT.2.7
reference: Matthew 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: zh_hans
  text: 于是，希律暗中召来那些星象学者，向他们查明确切时间：那颗星是什么时候出现的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “星象学者”或译“智者”。希腊语μάγοι较具体地指来自东方、精通星象等学问的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 作为叙事中的时间推进标记，承接前文并引出希律随后的行动；现代汉语中“于是”自然流畅。
- source_word: Ἡρῴδης
  choice: 希律
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: λάθρᾳ
  choice: 暗中
  rationale: 表达行动有意避人耳目；比“私下”更能体现其隐秘性。
- source_word: καλέσας
  choice: 召来
  rationale: 分词表示先于主要动词发生的行动；“召来”既保留召唤意味，也符合希律的身份和叙事情境。
- source_word: τοὺς μάγους
  choice: 那些星象学者
  rationale: μάγοι在此指来自东方、研究星象等学问的人；这一译法避免后世关于人数、王者身份等传统意象，同时比生硬音译更易懂。
- source_word: ἠκρίβωσεν
  choice: 查明确切时间
  rationale: 该动词含仔细查证、弄准确之意；将准确性明确表达出来，符合原文语义。
- source_word: παρ’ αὐτῶν
  choice: 向他们
  rationale: παρά加属格表示信息来源；汉语以“向他们查明”自然表达从他们那里取得信息。
- source_word: τὸν χρόνον
  choice: 时间
  rationale: 指所询问的时间点；准确之意已由ἠκρίβωσεν表达。
- source_word: τοῦ φαινομένου ἀστέρος
  choice: 那颗星是什么时候出现的
  rationale: 将属格分词结构自然转换为汉语间接问句；φαινομένου在语境中指星显现或出现的时间。
theological_decisions: []
