id: MAT.2.13
reference: Matthew 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: zh_hans
  text: 他们离开以后，看哪，主的一位天使[a]在梦中向约瑟显现，说：“起来，带上孩子和他母亲，逃到埃及去，留在那里，直到我告诉你。因为希律就要[b]寻找这孩子，要杀死他[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的天使”。希腊语“天使”一词在这里没有冠词，但有些读者会把整个短语理解为圣经中熟悉的固定表达。
    reason: alternative_reading
  - marker: b
    text: 希腊语含有“即将、就要”的意思，表达迫近的意图。
    reason: lexical_alternative
  - marker: c
    text: 希腊语直译为“毁灭他”或“除灭他”；在这里指使他死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: 他们离开以后
  rationale: 这是属格独立结构，表示先于主句发生的动作。“他们”按上下文指刚离开的来访者；此译自然保留时间先后。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留马太用来引起注意、突出突发神圣介入的叙事标记；措辞庄重而仍易懂。
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: 希腊语中ἄγγελος没有冠词，因此正文不将其强行确定为某一位特指的天使；κύριος按圣经称谓译为“主”。
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: 在梦中向约瑟显现
  rationale: κατ’ ὄναρ是“在梦中”的惯用表达；φαίνεται虽为历史现在时，汉语叙事无需用形态时态标示，译为“显现”自然准确。
- source_word: Ἐγερθεὶς παράλαβε
  choice: 起来，带上
  rationale: 分词Ἐγερθεὶς在连续命令中具有命令作用；παράλαβε在此指带着同行，“带上”比单说“带”更清楚。
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: 孩子和他母亲
  rationale: 忠实保留原文以孩子为中心的指称次序，也不把约瑟与马利亚的关系作原文未明说的改写。
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: 逃到埃及去
  rationale: φεῦγε含有躲避危险、迅速逃离之意；“逃到……去”符合现代汉语表达。
- source_word: ἴσθι ἐκεῖ
  choice: 留在那里
  rationale: 字面是“在那里”，语境要求持续停留，译作“留在那里”自然表达其延续含义。
- source_word: ἕως ἂν εἴπω σοι
  choice: 直到我告诉你
  rationale: 保留不定将来界限，也不补出原文没有明说的具体信息，如“回来”或“下一步怎么办”。
- source_word: μέλλει
  choice: 就要
  rationale: 表达即将发生和已有意图的语气，比一般将来式更具紧迫感。
- source_word: ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό
  choice: 寻找这孩子，要杀死他
  rationale: τοῦ加不定式表示寻找的目的；ἀπόλλυμι本义范围包括毁灭、使丧失，在此针对孩子，语境明确指致其死亡，故正文采用自然明确的“杀死”。
theological_decisions:
- issue: ἄγγελος κυρίου中κύριος及冠词状态的处理
  choice: 主的一位天使
  alternative: 主的天使
  rationale: “主”保留κύριος作为神圣称谓的通常译法；同时以“一位”反映ἄγγελος无冠词，避免正文直接把该短语处理成固定、特指的“主的使者”。脚注保留惯用表达的可能性。
- issue: ἀπολέσαι在此处的语义
  choice: 杀死他
  alternative: 除灭他／毁掉他
  rationale: 原词本身较宽，可指毁灭或使之丧失；本句中希律针对孩子采取行动，实际目的为使其死亡。正文清楚传达语境含义，脚注则保留原词较宽的字面色彩。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“看哪”保留原文鲜明的叙事提示；命令部分使用“起来、带上、逃到、留在”等普通读者容易理解的动词。脚注标记均放在其实际说明的词语之后，并纠正咨询层中标记位置与脚注内容不相配的问题。
