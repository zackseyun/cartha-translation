  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: zh_hans
  text: 他来到一座名叫拿撒勒的城，住了下来，为要应验借着众先知所说的话：“他将被称为拿撒勒人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按希腊词形音译作“拿撒赖人”（Nazorean）。至于“他将被称为拿撒勒人”具体以哪些先知话语为背景，学者看法不一；马太可能是在概括众先知的相关主题，而不是逐字引用某一处经文。
    reason: 保留Ναζωραῖος可译作Nazorean的词形替代可能，并说明此应验引文的具体先知背景存在争议。
lexical_decisions:
- source_word: ἐλθὼν
  choice: 他来到
  rationale: 不定过去时分词先于主要动作；用“来到”与后面的“住了下来”顺接，既自然又保留动作次序。
- source_word: κατῴκησεν
  choice: 住了下来
  rationale: κατοικέω表示在某地居住、定居；“住了下来”符合现代汉语，也比单纯“住”更清楚地表达迁居后落脚之意，同时不过度强调永久性。
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: 一座名叫拿撒勒的城
  rationale: 介词εἰς与居住动词连用时，汉语无需直译为“进入”；πόλις直译为“城”，句式自然并贴近原文。
- source_word: ὅπως
  choice: 为要
  rationale: 保留马太应验公式中的目的兼结果色彩，不把经文单纯改写为事后结果。
- source_word: πληρωθῇ
  choice: 应验
  rationale: 准确传达“使先前所说的话得到实现”的被动虚拟语气含义；汉语“应验”在此公式中自然，无需机械补出被动形式。
- source_word: τὸ ῥηθὲν
  choice: 所说的话
  rationale: 以自然汉语表达带冠词的被动分词结构，保留先前宣告的含义。
- source_word: διὰ τῶν προφητῶν
  choice: 借着众先知
  rationale: “借着”保留διά加属格所表达的媒介性；“众先知”明确反映原文复数。
- source_word: Ναζωραῖος
  choice: 拿撒勒人
  rationale: 在本语境中指与拿撒勒有关的称号；“拿撒勒人”是清楚自然的现代汉语表达，并避免误译成“拿细耳人”。
- source_word: κληθήσεται
  choice: 他必称为
  rationale: “必称为”保留将来被动和预言语体；比“必命名为”更符合称号语境。
theological_decisions:
- issue: 本节应验引文没有一处完全对应的旧约原句
  choice: 正文照原文译作“借着众先知所说的话”，不指定某一处先知书为唯一出处。
  alternative: 解释为以赛亚书11:1“枝子”的文字关联，或概括弥赛亚受轻视等多项先知主题。
  rationale: 原文使用“先知们”的复数，可能指综合性或主题性的先知见证；翻译应保留这种开放性，不在正文中加入未经明说的具体解释。
- issue: Ναζωραῖος的身份含义
  choice: 译为“拿撒勒人”。
  alternative: 采用更贴近希腊词形的音译称号，或误解为“拿细耳人”。
  rationale: 上下文紧接拿撒勒城，表明称号与该地有关。Ναζωραῖος并非表示许拿细耳愿之人的专门希腊词，因此不译作“拿细耳人”；词形及其先知背景的争议则在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“住了下来”自然表达迁居落脚；“为要应验”保留马太应验公式的目的—结果张力；“众先知”明确呈现原文复数。脚注标记紧随争议称号之后。
