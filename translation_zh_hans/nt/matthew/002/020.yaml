id: MAT.2.20
reference: Matthew 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: zh_hans
  text: 说：“起来，带着孩子和他母亲，往以色列地去，因为那些要取孩子性命的人都已经死了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那些寻索孩子性命的人已经死了。”
    reason: 保留 οἱ ζητοῦντες 与 τεθνήκασιν 较贴近形式的译法，供读者看见原文“寻索”及完成时表达。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节天使的显现并引出其话语；汉语用“说”最自然，同时保留与上文的衔接。
- source_word: Ἐγερθεὶς
  choice: 起来
  rationale: 不定过去时被动分词在此与命令语气连用，具有惯用的命令作用；译作“起来”简洁自然。
- source_word: παράλαβε
  choice: 带着
  rationale: 此处指把孩子和母亲带在身边一同前往；“带着”比单说“带”更清楚地表达同行之意。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: 准确表达 παιδίον 的通常含义，不额外加入“小”或“幼小”等原文未明确强调的信息。
- source_word: τὴν μητέρα αὐτοῦ
  choice: 他母亲
  rationale: 按希腊文代词关系直译，现代汉语中自然清楚。
- source_word: πορεύου
  choice: 去
  rationale: 该中间语态命令式在此是直接的行动命令；“去”最简明自然。
- source_word: εἰς γῆν Ἰσραήλ
  choice: 往以色列地
  rationale: 保留 γῆ 的地域含义；“往”自然表达目的地，“以色列地”兼具准确性和庄重语体。
- source_word: τεθνήκασιν
  choice: 都已经死了
  rationale: 完成时强调死亡所造成的现存状态；“已经死了”兼顾已发生的事件及其结果，“都”对应复数主语的整体范围。
- source_word: οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου
  choice: 那些要取孩子性命的人
  rationale: “寻索某人的性命”在此语境中是企图杀害的惯用表达；“要取……性命”在现代汉语中自然且准确，也保留其致命意图。
theological_decisions:
- issue: 在致命威胁语境中如何翻译 ψυχή
  choice: 性命
  alternative: 灵魂
  rationale: “寻索某人的 ψυχή”在本叙事中指企图杀死那人，而非寻求其非物质的灵魂；“性命”准确传达上下文含义，避免引入原文此处没有的神学限定。
- issue: 是否把复数 οἱ ζητοῦντες 限定为希律一人
  choice: 保留复数“那些……的人”
  alternative: “希律”或“那要害孩子的人”
  rationale: 希腊原文明用复数，可能涵盖希律及与其行动相关者；译文不将其缩减为单数，以保留原文范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“带着”“往……去”符合自然汉语叙事；“取……性命”清楚传达死亡威胁，同时避免误译为“灵魂”。脚注标记置于其实际说明的句末分句，而非置于引语引导词之后。
