id: MAT.6.17
reference: Matthew 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: zh_hans
  text: 但你禁食的时候，要在头上抹油[a]，也要洗脸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在头上抹油”是当时日常梳洗修饰的一部分；希腊语动词也可译作“膏抹”。
    reason: lexical_alternative
  - marker: b
    text: 意思是保持平常的仪容，不要刻意让别人看出自己正在禁食。
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你
  rationale: 独立代词 σὺ 带有强调，δέ 表示与上文假冒为善者的做法相对照；“但你”简洁保留了这种直接对比。
- source_word: νηστεύων
  choice: 禁食的时候
  rationale: 现在分词在此作时间性修饰语；译为“禁食的时候”符合现代汉语表达，也不把禁食理解为一次性的行为。
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: 要在头上抹油
  rationale: ἀλείφω 指涂抹油，在此语境中是日常梳洗修饰的一部分。“抹油”比“膏抹”更自然，也避免无根据地赋予这一动作礼仪含义；“头上”保留 κεφαλή 的字面指向。
- source_word: καὶ
  choice: 也
  rationale: 连接两个并列命令；汉语用“也”自然承接前一动作。
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: 要洗脸
  rationale: νίπτω 常指洗身体的某一部分，πρόσωπον 在此指脸；“洗脸”准确、简明，符合现代汉语习惯。
theological_decisions:
- issue: 禁食时整理外表这一命令的性质
  choice: 耶稣吩咐禁食者保持平常的梳洗仪容，不刻意让别人看出自己在禁食。
  alternative: 这里是在命令一种礼仪性的膏抹，或是在禁止一切公开禁食。
  rationale: 上下文把假冒为善者故意弄得面容难看，与门徒照常抹油洗脸相对照。本节既没有把抹油明确规定为礼仪，也没有禁止禁食本身；翻译保留具体动作，把其语境意义放入注释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“但你”保留原文对第二人称单数的强调和与上文的对比；“抹油”避免“膏抹”在现代中文里可能产生的专门宗教联想。两个“要”使并列命令清楚有力。
