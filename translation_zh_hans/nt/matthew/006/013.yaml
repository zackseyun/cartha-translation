id: MAT.6.13
reference: Matthew 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: zh_hans
  text: 不要带我们进入试探[a]，却要救我们脱离那恶者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”或“试炼”。希腊语此词既可指引诱人犯罪的试探，也可指考验人的艰难处境。
    reason: lexical_alternative
  - marker: b
    text: 或译“邪恶”。希腊语此处既可指位格性的“那恶者”，也可泛指“邪恶”。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: 不要带我们进入
  rationale: 保留原文“带入、领入”的直接祈求形式，不改写为解释性的“不要容许我们受试探”。现代汉语虽常说“不叫我们遇见”，但“不要带我们进入”更贴近 εἰσφέρω 的空间性表达，同时仍自然可懂。
- source_word: πειρασμόν
  choice: 试探
  rationale: πειρασμός 可指引诱人犯罪的“试探”，也可指考验或艰难的试炼。正文采用中文圣经语境中自然且熟悉的“试探”，脚注保留其较广语义。
- source_word: ῥῦσαι
  choice: 救……脱离
  rationale: ῥύομαι 表达从危险或辖制中施行拯救；“救我们脱离”既体现主动救援，也符合庄重而自然的祷告语言。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的 πονηροῦ 在形态上既可作阳性，指“那恶者”，也可作中性，指“邪恶”。正文采用具有充分语法和语境根据的位格性理解，并以脚注保留非位格性的读法。
theological_decisions:
- issue: τοῦ πονηροῦ 是指位格性的“那恶者”，还是泛指“邪恶”
  choice: 那恶者
  alternative: 邪恶
  rationale: 希腊语形式确有阳性与中性之间的歧义。正文选择“那恶者”，因为带冠词的表达可自然指向邪恶的位格性敌对者，且与前面的试探相衔接；但不把这一选择绝对化，脚注明确保存“邪恶”这一同样可能的理解。
- issue: πειρασμός 的性质
  choice: 试探
  alternative: 考验或试炼
  rationale: 此词可能涉及犯罪诱惑，也可能涉及人在考验中的处境。正文不以扩写方式限定其范围，脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而直接的祷告语体。“不要带我们进入”有意保留原文措辞所带来的神学张力，不解释性改写为“不要让我们陷入”。“那恶者”较“恶者”更能体现希腊语冠词，但脚注保留“邪恶”的非位格性理解。
