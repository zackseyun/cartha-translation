lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: 我们……的饼
  rationale: ἄρτος直译为“饼”，虽可泛指食物或生活所需，正文保留具体意象；ἡμῶν表达所属关系。
- source_word: τὸν ἐπιούσιον
  choice: 每天所需的
  rationale: ἐπιούσιος极为罕见，确切含义有争议。“每天所需的”在现代汉语中自然，也兼顾日常供应和实际需要，但不排除“今日的”或“来日的”等理解，故用脚注说明。
- source_word: δὸς ἡμῖν
  choice: 赐给我们
  rationale: δὸς是δίδωμι的命令式；祷告语境中“赐给”自然、庄重，ἡμῖν译作“我们”。
- source_word: σήμερον
  choice: 今天
  rationale: 直接保留σήμερον的时间含义，并采用现代汉语常用表达。
theological_decisions:
- issue: 主祷文中ἐπιούσιον的含义
  choice: 每天所需的
  alternative: 今日的；来日的；维持生存所需的
  rationale: 该词可能指当天、将来的一天，或生存所必需的供应。“每天所需的”适合正文，表达逐日倚靠上帝的祈求，同时在脚注中保留原文真实存在的歧义。
translation_notes:
  register: 采用现代、清楚而庄重的祷告语言。“赐给”符合向上帝祈求的语域；调整汉语语序，将宾语前置，以免“今天”与“每天”相邻而显得拗口。
