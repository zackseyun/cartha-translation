  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: zh_hans
  text: 但你周济穷人的时候[a]，不要让左手知道右手所做的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“施舍的时候”；希腊语指向穷人施舍、进行慈善救济。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: 但你……的时候
  rationale: 属格独立结构与δέ承接上文并形成对比；译为“但你……的时候”符合现代汉语表达，也保留了转折语气。
- source_word: ἐλεημοσύνην
  choice: 周济穷人
  rationale: 该词在此指向穷人施舍、进行慈善救济。“周济穷人”既清楚表达对象和行动，也比传统的“施舍”更少带有居高临下的现代语感；脚注保留“施舍”这一较形式对应的译法。
- source_word: μὴ γνώτω
  choice: 不要让……知道
  rationale: μή加第三人称不定过去时命令语气表达禁止；此译法自然，并保留左右手拟人化的鲜明意象。
- source_word: ἡ ἀριστερά σου
  choice: 左手
  rationale: 直接对应原文，保留比喻及左右手的对称结构。
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: 右手所做的
  rationale: 准确表达“右手在做什么”。“所做的”在汉语中简洁自然，并不把这个生动说法解释性改写。
theological_decisions:
- issue: 左右手意象的含义
  choice: 保留原文的拟人化和夸张表达，强调周济时不自我张扬
  alternative: 直接解释为“行善要完全保密”，或泛化为“凡事都要谦卑”
  rationale: 原文用左右手构成鲜明的夸张意象。直保意象可传达隐秘、不求自我炫耀的重点，同时避免将其扩大为对一切公开慈善行为的绝对禁令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“周济穷人”清楚传达ἐλεημοσύνην的实际含义；句式保留原文简洁有力、便于记忆的左右手意象。
