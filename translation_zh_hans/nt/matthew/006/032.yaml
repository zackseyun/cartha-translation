  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: zh_hans
  text: 因为外邦人[a]寻求这一切[b]；因为你们的天父知道，你们需要这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国之人”；也可译“异教徒”。希腊语可泛指各国各族的人；在这里很可能指盟约群体以外的人。
    reason: alternative_reading
  - marker: b
    text: 也可译“追求”或“竭力寻求”；原词可含认真、持续寻求的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 这里指与耶稣门徒相对的、盟约群体以外的人。“外族人”在现代汉语中较自然，也保留了历史和群体层面的区别；脚注列出“列国之人”和“异教徒”等可能译法。
- source_word: ἐπιζητοῦσιν
  choice: 追求
  rationale: ἐπιζητέω在此表示持续寻求、以之为追求目标。“追求”比单纯的“寻求”更能表达语境中的投入，但不额外加入“拼命”等过强语气。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: 你们的天父
  rationale: 自然、简洁地保留“你们的”以及“属天的”这一限定，符合现代汉语宗教语境，同时不改变原文关系。
- source_word: οἶδεν
  choice: 知道
  rationale: οἶδα虽在形态上为完成时形式，却具有现在时意义；译为“知道”准确自然。
- source_word: χρῄζετε
  choice: 你们需要
  rationale: 直接对应原文所表达的需要，现代汉语清楚自然。
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: 因为……这一切……这一切
  rationale: 保留原文对“这一切”的重复，以维持强调；首个γάρ译为“因为”，使其与上文的劝告形成自然的解释关系。
- source_word: γὰρ ... γὰρ
  choice: 因为……；……
  rationale: 第一个γάρ明确译为“因为”；第二个γάρ所表达的进一步理由借分号及并列句自然体现，避免汉语连续两次使用“因为”的生硬，同时保留论证层次。
theological_decisions:
- issue: τὰ ἔθνη在耶稣教导中的所指
  choice: 译为“外族人”，保留耶稣门徒与盟约群体以外之人的历史性对照
  alternative: 列国之人；异教徒
  rationale: “异教徒”容易突出宗教贬义，“列国之人”较为直译但现代汉语不够自然。“外族人”能保留群体边界，又不把原文扩展成对所有非犹太人的绝对道德评断。
- issue: 天父的知情与门徒的需要
  choice: 直译为“你们的天父知道，你们需要这一切”
  alternative: 可意译为“你们的天父知道这一切都是你们所需要的”
  rationale: 直译保留原文关于父的认知和门徒实际需要之间的陈述，不进一步推导供应方式或结果。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“外族人”避免“外邦人”较强的传统译经色彩，同时以脚注保存其他可能译法；句法尽量贴近原文的解释结构，并保留“这一切”的重复。
