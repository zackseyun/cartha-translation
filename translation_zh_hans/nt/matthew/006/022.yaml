  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: zh_hans
  text: “眼睛是身体的灯。所以，你的眼睛若健康[a]，全身就会明亮；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“专一”、“清澈”或“正常”；这个希腊词也可含有未分裂或专一的意思，在某些语境中还可表示“慷慨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: 灯
  rationale: 通常指具体的灯具；译作“灯”保留眼睛照亮身体的具体比喻。
- source_word: σῶμα
  choice: 身体
  rationale: 采用现代汉语中的常用对应词，直接保留身体意象。
- source_word: ὀφθαλμός
  choice: 眼睛
  rationale: 既准确表达身体器官，也能承载上下文中的道德比喻。
- source_word: ἐὰν οὖν
  choice: 所以……若
  rationale: “所以”表达οὖν的推论关系，“若”表达ἐὰν所引出的条件，且符合自然汉语语序。
- source_word: ἁπλοῦς
  choice: 健全
  rationale: 在眼睛与身体得光的直接比喻中，“健全”自然表示眼睛功能正常，同时避免把该词潜在的“专一”或“慷慨”含义强行定为唯一解释。
- source_word: ὅλον
  choice: 全身
  rationale: 将ὅλον与σῶμα自然合译为“全身”，保留完整、无遗漏的意义。
- source_word: φωτεινὸν
  choice: 明亮
  rationale: 准确表达受光照而明亮的状态，汉语简洁自然，并保留光的意象。
- source_word: ἔσται
  choice: 就会
  rationale: “会”保留希腊文将来时，“就”自然呈现条件句的结果关系。
theological_decisions:
- issue: 比喻中ἁπλοῦς的含义
  choice: 正文译为“健全”
  alternative: “专一”、“清澈”、“正常”，或在某些语境中“慷慨”
  rationale: 本节直接谈眼睛作为身体的灯，下一节又与“坏”的眼睛形成对照，因此正文采用与视觉功能正常相符的“健全”。不过，ἁπλοῦς也可带有单一、不分心或慷慨的语义色彩，故以脚注保存其真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼睛是身体的灯”保留原文简洁有力的隐喻；“所以……若……就会……”清楚呈现推论和条件关系。分号依照该句与下一节紧密相连的语势。
