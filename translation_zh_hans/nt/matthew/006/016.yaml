  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: zh_hans
  text: 每逢你们禁食，不要像假冒为善的人那样面带愁容；因为他们使自己的面容变得难看，好让人看出他们在禁食。我实在告诉你们，他们已经得到了全部的赏报。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: 你们禁食的时候
  rationale: ὅταν加虚拟语气表示不定或反复发生的情形；汉语“……的时候”自然涵盖每逢禁食之意。δὲ在此承接前文关于施舍和祷告的平行教导，无须另译为强转折。
- source_word: μὴ γίνεσθε ὡς οἱ ὑποκριταὶ σκυθρωποί
  choice: 不要像那些假冒为善的人一样，故意面带愁容
  rationale: γίνεσθε含进入或采取某种状态的意味；σκυθρωποί指愁苦阴沉的面色。结合下文所述目的，加入“故意”明确这种外在表现是刻意为之，而非一般性的忧愁。
- source_word: ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν
  choice: 他们弄得面容憔悴
  rationale: ἀφανίζω本义涉及使之不显或损坏，在此指刻意改变、糟蹋或疏于整理面容，使禁食显在脸上。“弄得面容憔悴”保留具体的脸部意象，也比“毁容”更符合现代汉语语境。
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: 好让人看出他们在禁食
  rationale: ὅπως表达目的，φανῶσιν可指显出或被看出；τοῖς ἀνθρώποις在此泛指人们。“让人看出”自然传达其向公众展示禁食的意图。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 保留耶稣郑重而权威的宣告公式，同时符合现代中文圣经语体。
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: 他们已经得到了全部的赏报
  rationale: ἀπέχω在收据和商业语境中可表示已经足额收取；“已经得到全部”传达其赏报已经结清、没有更多可领的含义。μισθός在这里是行为所得的报偿，译作“赏报”可与本章上下文相呼应。
theological_decisions:
- issue: τοῖς ἀνθρώποις所指的范围
  choice: 人
  alternative: 男人／众人
  rationale: ἄνθρωποι虽然形态为阳性复数，此处语义泛指其他人或公众，并非专指男性；现代汉语用“人”准确且自然。
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν的报偿含义
  choice: 已经得到了全部的赏报
  alternative: 已经有了他们的赏报／已经领受了赏报
  rationale: 此表达具有足额收讫的习语色彩。译文保留警告中的张力：他们从人的注意所得，就是已经全部得到的报偿；但不额外补入“神不会再赏赐”等原文未明说的话。
- issue: 禁食本身的评价
  choice: 不把禁食译成负面行为，只谴责表演性的外貌
  alternative: 将本节处理为对禁食的否定
  rationale: 原文以“你们禁食的时候”为前提，命令针对的是故作愁容、求人看见，并不否定禁食本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的命令、原因、目的和郑重结论。“假冒为善的人”为读者熟悉的经文用语；“面容憔悴”避免“毁容”在现代汉语中过强且容易误解的含义。
