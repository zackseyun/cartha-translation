  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: zh_hans
  text: 求你免除我们所欠的债[a]，如同我们也免除欠我们债之人的债。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “债”在这里用作罪或过犯的比喻。原文直译为“债”，并以相应的“欠债之人”指那些欠我们债的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: 免
  rationale: 在祷告语境中，ἀφίημι 表示免除、赦免；与“债”搭配时译作“免”既自然，也保留免债的比喻。
- source_word: τὰ ὀφειλήματα
  choice: 我们的债
  rationale: ὀφειλήματα 字面指所欠之物或债务；保留“债”可与后面的“欠债的人”形成同源呼应，并承载罪与过犯的道德比喻。
- source_word: ὡς
  choice: 如同
  rationale: 明确保留祈求上帝赦免与人对他人施行宽免之间的比较关系，不进一步解释其神学逻辑。
- source_word: καὶ ἡμεῖς
  choice: 我们也
  rationale: 显明第二个 καί 的附加强调，保留希腊文“我们也”的表达。
- source_word: ἀφήκαμεν
  choice: 免了
  rationale: 简单过去式形式可自然对应希腊文不定过去时，表达已经完成的行动，同时不强行加入现代汉语完成时以外的时态含义。
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: 欠我们债的人
  rationale: 以自然现代汉语保留与“债”的词根联系；较“我们的债户”更通俗，也比直接译为“得罪我们的人”更贴近原文比喻。
theological_decisions:
- issue: ὀφειλήματα 的道德债务比喻
  choice: 正文保留“债”，脚注说明这里比喻罪或过犯。
  alternative: 直接译作“过犯”或“罪”
  rationale: 原文连续使用“债”和“欠债的人”的同源词。保留这一比喻最透明，也避免把其所指范围过早限定为某一种罪论表述。
- issue: ἀφήκαμεν 的时间与体貌
  choice: 译作“免了”
  alternative: 译作“已经免了”或“曾免过”
  rationale: 希腊文不定过去时把行动作为整体陈述；“免了”在现代汉语中自然表达完成性，又不将其限定为久远的一次事件。
- issue: ὡς 所表达的关系
  choice: 译作“如同”，保留比较张力。
  alternative: 解释为“因为”或“按照……的条件”
  rationale: ὡς 明示比较，却没有在本节中把该关系完整界定为原因、功德或条件；译文不替原文解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而通俗的祷告语言。“免我们的债”保留原文核心比喻；“欠我们债的人”避免生硬的“债户”，同时维持上下文的词语呼应。脚注标记置于相关整句之后。
