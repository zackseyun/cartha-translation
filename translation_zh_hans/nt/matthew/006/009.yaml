  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: zh_hans
  text: '所以，你们要这样祷告：


    “我们在诸天中的父啊，


    愿你的名被尊为圣[a]；”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按传统译作“愿人都尊你的名为圣”。原文为被动式，没有明说是谁尊这名为圣。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: 所以……这样
  rationale: οὖν承接上文，表达推论，译作“所以”；Οὕτως说明祷告的方式或范式，译作“这样”，自然且保留教导作用。
- source_word: προσεύχεσθε ὑμεῖς
  choice: 你们要……祷告
  rationale: 现在时命令语气带有直接吩咐的力量，明示代词ὑμεῖς强调听众；“你们要”在现代汉语中清楚传达复数对象和指令语气。
- source_word: Πάτερ ἡμῶν
  choice: 我们的父
  rationale: 保留呼格中的直接称呼和共同体性的第一人称复数。未扩译为“天父”，以免与后面的地点短语合并。
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: 在诸天之上的
  rationale: τοῖς οὐρανοῖς为复数。“诸天”保留原文形式；“之上”在庄重而现代的祷告语体中自然地修饰“父”。
- source_word: ἁγιασθήτω
  choice: 愿……被尊为圣
  rationale: 不定过去时被动命令语气在此表达祈愿。“被尊为圣”既保留被动形式，也传达将上帝的名承认为圣、敬为圣的含义。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 按原文保留“名”，不把其所涵盖的身份、声誉或启示出来的品格直接展开在正文中。
theological_decisions:
- issue: 祷告开头如何同时表达亲近与超越
  choice: 我们在诸天之上的父
  alternative: 我们在天上的父；我们的天父
  rationale: 原文使用复数“诸天”。所选译法保留“父”的关系性称呼及复数的空间表达，不把地点短语改写成性质性的“天父”。
- issue: ἁγιασθήτω的祈愿与被动语态
  choice: 愿你的名被尊为圣
  alternative: 愿人都尊你的名为圣；愿你的名成圣
  rationale: “愿人都……”明确补出了施事者，而原文并未说明是谁使或承认这名为圣；“被尊为圣”较好保留神学上的开放性和被动形式，也避免“成圣”可能使人误解为上帝的名原先并不圣洁。
translation_notes:
  register: 采用自然、庄重、适合共同诵读的现代标准汉语。“诸天”略带经文语体色彩，用来准确保留希腊文复数；整体避免古雅难懂的“尔”“祷曰”等表达。
