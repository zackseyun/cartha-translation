id: MAT.6.5
reference: Matthew 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: zh_hans
  text: “你们祷告的时候，不可像那些假冒为善的人；因为他们喜欢站在会堂里和大街的拐角上祷告，好让人看见他们。我实在告诉你们：他们已经得到了自己的报偿。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经得到了”也可译作“已经把报偿全数收到了”；原文动词可用于表示款项已经收讫。
    reason: 说明ἀπέχουσι在此可能具有商业用语中“收足、收讫”的意味，同时避免在正文中过度限定。
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: 你们祷告的时候
  rationale: ὅταν与现在时虚拟语气表达一般性、反复出现的情形；现代汉语用“……的时候”自然涵盖“每逢”的意义。
- source_word: οὐκ ἔσεσθε ὡς
  choice: 不可像
  rationale: 将带禁止意味的将来时直陈语气译为现代汉语训诫式“不可”，既保留庄重语气，也避免生硬的“将不会像”。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 此处指以公开敬虔博取观感的人；“假冒为善的人”是中文圣经语境中清楚且贴合上下文的表达。
- source_word: φιλοῦσιν
  choice: 喜欢
  rationale: 表达他们以这种公开展示为乐、乐意如此行；“喜欢”在现代汉语中自然准确。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 在会堂里
  rationale: 保留第一世纪犹太处境中“会堂”这一具体场所。
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: 在大街的拐角上
  rationale: πλατεῖα指宽阔的街道或公共通道；“大街的拐角”兼顾原文细节与中文自然度。
- source_word: ἑστῶτες προσεύχεσθαι
  choice: 站在……祷告
  rationale: 保留“站着”这一姿态及其与地点的句法联系，不暗示站立祷告本身受到谴责。
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: 好让人看见他们
  rationale: 清楚表达目的；ἀνθρώποις在此泛指人，不限于男性。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 采用自然、庄重的现代汉语，保留耶稣郑重宣告的公式。
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: 他们已经得到了自己的报偿
  rationale: ἀπέχω在收付语境中可表示款项已收取；“已经得到了”传达所得报偿已落实，同时把“已收足”的语用可能留给脚注说明。
theological_decisions:
- issue: 责备的对象是站立祷告还是为求被看见而祷告
  choice: 通过“好让人看见他们”明确目的关系，不把站立本身说成错误
  alternative: 将“站着祷告”直接描述为受责备的行为
  rationale: 原文的批判焦点在炫示性的目的，而非站立这一常见祷告姿势。
- issue: ἀπέχουσι所表达的报偿是否为“全数收讫”
  choice: 正文译作“已经得到了自己的报偿”，脚注注明可理解为“已经把报偿全数收到了”
  alternative: 正文直接译作“已经把他们的报偿全数收到了”
  rationale: 商业用语色彩支持“收足”的理解，但正文不把这一语用含义强化为唯一读法，以保留原文措辞的张力。
- issue: ἀνθρώποις的指称范围
  choice: 人
  alternative: 男人
  rationale: 这里泛指观看他们的众人，并非仅指男性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首“你们”以及动词形式均按复数理解。保留“会堂”和“大街的拐角”等历史与空间细节；标点按现代中文直引语规范处理。
