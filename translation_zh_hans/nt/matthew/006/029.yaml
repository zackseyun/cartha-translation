    issue: “极尽荣华之时”把原文的状态性短语处理为时间短语。
    rationale: ἐν πάσῃ τῇ δόξῃ αὐτοῦ意为“在/带着他一切的荣华中”，强调所罗门全部的王者华美；“之时”并非原文所表达，且可能把重点移至其生平某一时期。
  - severity: low
    issue: 脚注中的“也没有一身装扮比得上”增添了“一身”，并将原文“像一朵花那样被/穿戴”的比较改得较为游离。
    rationale: 原文重点是所罗门的穿戴状态不如任何一朵这些花；脚注宜维持该衣饰比较而不增加量词性对象。
