  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: zh_hans
  text: 但我告诉你们：就是所罗门纵有极盛的荣华，也没有穿得像这些花中的一朵那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我告诉你们：所罗门在他一切的荣华中，也没有像这些花中的一朵那样穿戴。”
    reason: 较形式地保留“在他一切的荣华中”及“穿戴”的表达；“荣华”在此指所罗门王室的华美与显赫。
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: 但我告诉你们
  rationale: λέγω加与格ὑμῖν自然译为“我告诉你们”；δέ在此承接上文并带有轻微转折，用“但”表现耶稣将所罗门的荣华与花作对比。
- source_word: οὐδὲ
  choice: 就连……也不
  rationale: 准确传达οὐδέ所加强的否定语气，突出连所罗门也达不到这一比较标准。
- source_word: Σολομὼν
  choice: 所罗门
  rationale: 采用现代中文圣经及一般读者熟悉的标准人名译法。
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: 极尽荣华之时
  rationale: δόξα在此指君王外在的华美、显赫与排场；“极尽荣华”自然表达πάσῃ的周全、极致意味，又避免误解为神性的荣耀。
- source_word: περιεβάλετο
  choice: 所穿戴的
  rationale: 该中间/被动形式在语境中指穿衣装扮；“所穿戴的”既符合中文表达，也保留人与花之装饰状态的比较。
- source_word: ὡς ἓν τούτων
  choice: 不如这些花中的一朵
  rationale: 保留ἓν的单数强调；“这些花”明确承接上文所指的野地花草，避免中文代词所指不清。
theological_decisions:
- issue: 所罗门的δόξα具有何种性质
  choice: 译作“荣华”，理解为君王尘世的华美与显赫
  alternative: 荣耀；华美
  rationale: 本节比较的是所罗门的王室盛装与上帝赋予花朵的装饰，并非谈论神性的荣耀；“荣华”既贴合语境，也保留其显赫、灿烂的意味。
- issue: περιεβάλετο的语态如何在中文中体现
  choice: 译作“所穿戴的”，不明确指定是自己穿上还是被人装扮
  alternative: 打扮自己；被装扮
  rationale: 原文形式可按中间或被动意义理解，而语境重点在其衣着状态；中文采用中性表达，可避免无根据地限定施事。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“极尽荣华之时”避免生硬直译，同时保留君王盛极一时的画面；补出“花”承接上下文，使独立经节中的指代清楚。脚注标记已在正文中以[a]出现。
