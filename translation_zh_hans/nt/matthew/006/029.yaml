revisions:
- from: 但我告诉你们：就连所罗门极尽荣华之时，所穿戴的也不如这些花中的一朵。[a]
  to: 但我告诉你们：就是所罗门纵有极盛的荣华，也没有穿得像这些花中的一朵那样。[a]
  rationale: 修订去除“之时”所引入的时间限定，以“纵有极盛的荣华”表达原文在全部王者华美中的让步式比较；“穿得像……那样”在现代汉语中自然呈现περιεβάλετο与ὡς ἓν τούτων的衣饰类比。脚注则提供较形式对应的替代表达。
