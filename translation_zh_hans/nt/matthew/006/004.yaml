id: MAT.6.4
reference: Matthew 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: zh_hans
  text: 使你给穷人的施舍在暗中进行；你父看见你在暗中所做的，必报答你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“必在明处报答你”。
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: 使
  rationale: 承接上文并表达目的，简洁保留目的从句的作用。
- source_word: ᾖ
  choice: 是在
  rationale: 与“使”共同表达目的语气，在现代汉语中自然，不机械复制希腊语虚拟式。
- source_word: ἐλεημοσύνη
  choice: 对穷人的施舍
  rationale: 明确表示给穷人的财物，而非泛指怜悯或一般慈善行为；“施舍”也保留传统经文语域。
- source_word: ἐν τῷ κρυπτῷ
  choice: 在暗中
  rationale: 表达不为公众看见的隐秘状态，并在两处采用相同措辞，以保留原文重复。
- source_word: ὁ πατήρ σου
  choice: 你父
  rationale: 原文只说“你父”，未明说“天父”；不从相邻经文补入“天”。
- source_word: ὁ βλέπων
  choice: 察看
  rationale: 自然表达父持续看见隐秘之事的含义，同时比单纯“看”更符合庄重语境。
- source_word: ἀποδώσει
  choice: 必报答
  rationale: 保留“偿还、回报”的基本意义，同时适合这里正面的神圣回应；不限定报答的形式或时间。
- source_word: σοι
  choice: 你
  rationale: 作为“报答”的宾语自然融入汉语句法。
theological_decisions:
- issue: ἀποδώσει所表达的神圣回报性质
  choice: 必报答你
  alternative: 必赏赐你
  rationale: “报答”较直接保留原词回报、偿付的幅度；经文并未说明回报是今世或永恒、物质或属灵，因此不进一步界定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“对穷人的施舍”澄清ἐλεημοσύνη的具体对象；两次使用“在暗中”保留原文刻意重复。正文依据SBLGNT较短读法，异文置于脚注。
