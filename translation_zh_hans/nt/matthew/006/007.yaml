  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: zh_hans
  text: 你们祷告的时候，不要像外邦人[a]那样堆砌空话[b]，因为他们以为话说得多，就会蒙垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各族的人”。这里指犹太人以外的各族，即非犹太人；“异教徒”也是一种较具解释性的译法。
    reason: lexical_alternative
  - marker: b
    text: 或译“喋喋不休”或“作无意义的重复”。这里的希腊语动词很少见，大概是指空洞、机械或冗长的话语，并非泛指一切真诚的重复祷告。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: 你们祷告的时候
  rationale: 将情境性分词自然译为时间从句，符合现代汉语训诲语体。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接上文并转入下一项教导；汉语无需用“而且”或“但是”明示，以免强化原文没有的对比。
- source_word: μὴ βατταλογήσητε
  choice: 不要……堆砌空话
  rationale: 罕见动词 βατταλογέω 大概指空洞、机械或冗长的话语。“堆砌空话”兼顾多言和内容空泛，也不暗示一切重复祷告都受禁止。
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: 像外族人那样
  rationale: ἐθνικοί 在犹太语境中指圣约群体之外的非犹太各族。“外族人”比“异教徒”少一层宗教解释，同时较自然地表达群体身份。
- source_word: δοκοῦσιν
  choice: 他们以为
  rationale: 准确表达其主观设想，并带有这种设想并不正确的语用含义。
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: 话说得多
  rationale: πολυλογία 指多言或冗长言说；结合“以为”译出其所认定的蒙垂听依据，简洁自然。
- source_word: εἰσακουσθήσονται
  choice: 会蒙垂听
  rationale: 该被动式含有得到有利听取的意味。“蒙垂听”保留被动和祷告语境，又不扩大为必然得到所求的答复。
theological_decisions:
- issue: 耶稣禁止的是一切重复祷告，还是空洞冗长的话语
  choice: 主文译作“堆砌空话”，表明所责备的是把空洞多言当作蒙垂听手段。
  alternative: 不要喋喋不休；不要作无意义的重复
  rationale: βατταλογέω 词义罕见，可能涵盖含糊的喋喋不休、机械重复或空洞冗言。此译不把经文绝对化为禁止所有真诚的重复祷告，同时以脚注保留词义范围。
- issue: ἐθνικοί 强调族群／圣约身份还是宗教身份
  choice: 外族人
  alternative: 异教徒；外邦人
  rationale: 原词在此犹太语境中首先指非犹太各族，即圣约群体之外的人；避免直接译成“异教徒”而将宗教性质置于前景。脚注提供传统对应词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“堆砌空话”具有清晰形象感；“蒙垂听”适合祷告语境，虽略带书面色彩但仍为现代读者熟悉。所有脚注标记均已置于主文相应词语之后。
