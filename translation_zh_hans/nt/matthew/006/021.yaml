id: MAT.6.21
reference: Matthew 6:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: zh_hans
  text: 因为你的财宝在哪里，你的心也会在哪里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你的财宝在哪里，你的心也就在哪里。”有些译本将这句话译作不受时间限制的一般现在时；希腊原文的动词是将来时，可译为“会在”。
    reason: 说明一般现在时的可行译法，同时交代正文保留原文将来时的依据。
lexical_decisions:
- source_word: ὅπου
  choice: 在哪里
  rationale: 引出地点关系从句，并与后面的“也会在哪里”呼应；现代汉语自然且准确。
- source_word: γάρ
  choice: 因为
  rationale: 明确保留本节对前文有关积攒财宝之教导的解释关系。
- source_word: θησαυρός
  choice: 财宝
  rationale: 既能表达贵重财富，也保留上下文中的比喻力量，不把名词过度解释为“所珍爱的事物”。
- source_word: σου
  choice: 你的
  rationale: 忠实表达财宝和心都由第二人称单数属格代词限定；汉语中自然译为“你的”。
- source_word: ἐκεῖ
  choice: 也会在哪里
  rationale: 在汉语中以重复疑问代词的关系结构自然表达希腊语“ὅπου……ἐκεῖ……”的对应关系。
- source_word: ἔσται
  choice: 会在
  rationale: 保留εἰμί将来时的时间和趋向意味，不将其平化为一般现在时。
- source_word: καρδία
  choice: 心
  rationale: “心”是准确而传统的对应词，可涵盖人的愿望、忠诚和内在取向，避免缩窄语义。
- source_word: καὶ
  choice: 也
  rationale: 保留财宝所在之处与心所在之处之间的附加和对应关系。
theological_decisions:
- issue: 智慧格言中ἔσται的时间意味
  choice: 明确译作将来意味的“会在”
  alternative: 译作一般现在时“就在”
  rationale: 原文使用将来时。保留这一形式，既呈现财宝与心的对应，也不排除心随财宝而趋向其所在之处的动态含义；同时不将这种含义扩展成超出经文的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接前文论述；“财宝在哪里……心也会在哪里”保留原文简洁的平行结构和将来时意味。
