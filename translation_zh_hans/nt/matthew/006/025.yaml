review_pass:
  verdict: revise
  source_fidelity: Draft correctly renders the inferential Διὰ τοῦτο, the prohibition against anxious care (μὴ μεριμνᾶτε), ψυχή as “生命” in its food-related context, and σώμα as “身体.” However, the Greek concludes with one coordinated rhetorical question, not two independent questions. A single Chinese rhetorical question preserves the syntax and parallelism more closely.
  naturalness: “不要为自己的生命忧虑，吃什么” is understandable but its comma creates a slightly abrupt and potentially unclear attachment in modern Mandarin. Recasting it as “不要为自己的生命忧虑吃什么” is concise and natural in this biblical register. Combining the final comparisons into one question is also smoother.
  terminology: “生命”“身体”“食物”“衣服” are accurate, current, and appropriately neutral. The footnote correctly identifies “灵魂” as a lexical alternative without forcing a theological sense.
  issues:
  - severity: low
    issue: The final rhetorical question is divided into two questions.
    rationale: οὐχὶ governs the coordinated comparison “生命……并且身体……”; retaining one question better reflects the original discourse structure.
  - severity: low
    issue: The first two prohibitions are punctuated in a way that weakens the attachment of the indirect questions.
    rationale: Removing the commas after “忧虑” allows “忧虑吃什么／忧虑穿什么” to read naturally as the content of the concern, while preserving the Greek meaning.
  revised_text: 所以我告诉你们：不要为自己的生命忧虑吃什么，也不要为自己的身体忧虑穿什么。生命不比食物更重要，身体不比衣服更重要吗？[a]
  revised_footnotes:
