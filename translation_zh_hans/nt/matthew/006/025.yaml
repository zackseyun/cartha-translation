id: MAT.6.25
reference: Matthew 6:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: zh_hans
  text: 所以我告诉你们：不要为自己的生命忧虑吃什么，也不要为自己的身体忧虑穿什么。生命不比食物更重要，身体不比衣服更重要吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”或译“灵魂”；但本节谈到吃什么，语境更支持“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 承接上文并引出结论；“所以”自然、清楚地保留推论关系。
- source_word: μεριμνᾶτε
  choice: 不要……忧虑
  rationale: 表达因生活所需而焦虑挂心的意思；“忧虑”既准确又符合庄重的现代汉语。
- source_word: ψυχῇ / ψυχὴ
  choice: 生命
  rationale: 本节谈吃喝及维持生存所需，ψυχή在此主要指人的生命，而非特指与身体相对的非物质“灵魂”。
- source_word: τί φάγητε
  choice: 吃什么
  rationale: 间接疑问表达面向将来的生活顾虑；汉语无需明示将来时。
- source_word: σώματι / σῶμα
  choice: 身体
  rationale: 直指需要衣物遮蔽的肉身。
- source_word: τί ἐνδύσησθε
  choice: 穿什么
  rationale: 以自然简洁的现代汉语表达穿戴衣物。
- source_word: οὐχὶ
  choice: 不……吗
  rationale: 保留预期肯定回答的反问语气。
- source_word: πλεῖόν
  choice: 更重要
  rationale: 此处不只是数量上的“更多”，而是生命相对于食物、身体相对于衣服具有更高分量；“更重要”自然传达比较含义，同时不扩展为明确的经济价值判断。
- source_word: τροφῆς
  choice: 食物
  rationale: 指维持生命的食物，直接清楚。
- source_word: ἐνδύματος
  choice: 衣服
  rationale: 泛指人所穿的衣物；“衣服”比“衣裳”或“服饰”更符合普通现代读者的用语。
theological_decisions:
- issue: ψυχή在本节中的含义
  choice: 译为“生命”
  alternative: 灵魂
  rationale: 吃什么的语境指向人的现世生命或生存，而不是专门讨论非物质灵魂；此译法避免将身心二分的神学主张带入经文。
- issue: πλεῖόν所表达的比较
  choice: 译为“更重要”
  alternative: 更多；更宝贵
  rationale: 反问强调赐下生命和身体者也能供应较小的需要。“更重要”传达其分量上的超越，却不把隐含论证过度解释进正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文从上文推出结论的“所以”，并将希腊文末尾一个并列反问按汉语习惯分成两个平行反问。脚注标记置于整节末尾，正文与脚注对应。
