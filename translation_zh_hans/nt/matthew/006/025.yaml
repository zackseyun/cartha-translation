    text: “生命”或译“灵魂”；但本节谈到吃什么，语境更支持“生命”。
    reason: lexical_alternative
  revision_rationale: The revision retains all lexical and theological decisions of the draft, improves the natural Mandarin linkage between “忧虑” and its indirect questions, and restores the source text’s single coordinated rhetorical question. No doctrinal interpretation has been added.
