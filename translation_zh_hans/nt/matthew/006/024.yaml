id: MAT.6.24
reference: Matthew 6:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: zh_hans
  text: 没有人能服侍两个主人；因为他要么恨这一个而爱那一个，要么忠于这一个而轻看那一个。你们不能既服侍上帝，又服侍玛门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛门”意为财富或钱财。原文使用一个源自亚兰语的借词；在这里可理解为将财富拟人化为与上帝争夺人之服侍的另一个主人。
    reason: 解释借词的词义及其拟人化修辞作用。
lexical_decisions:
- source_word: Οὐδεὶς
  choice: 没有人
  rationale: 准确表达全称否定，在现代汉语中自然、庄重。
- source_word: δύναται / δύνασθε
  choice: 能 / 不能
  rationale: 直接表达能力与不可能性，并保留原文前后呼应。
- source_word: δυσὶ κυρίοις
  choice: 两个主人
  rationale: 复数 κύριοις 与 δουλεύειν 构成主仆关系；译作“主人”既符合语境，也避免误作神圣称号。
- source_word: δουλεύειν
  choice: 服侍
  rationale: 原词指像奴仆一样效劳；“服侍主人”是自然且庄重的汉语搭配，并由“主人”保留从属意味。
- source_word: μισήσει / ἀγαπήσει
  choice: 恨 / 爱
  rationale: 保留原文鲜明的反义对举，不将“恨”弱化为“少爱”。
- source_word: ἑνὸς ἀνθέξεται
  choice: 忠于这个
  rationale: ἀντέχομαι 在此表示紧紧依附、坚定站在一方；“忠于”适合主人与仆人的关系语境，且现代读者易懂。
- source_word: καταφρονήσει
  choice: 轻看那个
  rationale: 表达看不起、轻蔑之意；比“鄙视”稍自然，同时保留贬抑力度。
- source_word: θεῷ
  choice: 上帝
  rationale: 现代标准普通话中对独一神的清楚、庄重称谓。
- source_word: μαμωνᾷ
  choice: 玛门
  rationale: 保留源自亚兰语的借词及其作为与上帝争夺人之服侍的拟人化力量，并在脚注解释词义。
theological_decisions:
- issue: κύριος 在非神圣社会关系中的译法
  choice: 主人
  alternative: 主
  rationale: 本节复数形式处于奴仆服侍的社会关系图景中，“主人”最能传达原意，也不会与上帝的称号混淆。
- issue: μαμωνᾶς 的译法
  choice: 玛门
  alternative: 财富；钱财
  rationale: 保留借词，使财富作为敌对主人的修辞张力不被消解；脚注同时交代其词义。
- issue: μισέω 的力度
  choice: 恨
  alternative: 少爱
  rationale: 原文以“恨—爱”和“忠于—轻看”构成强烈对举；正文不应擅自弱化其张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准普通话。用“不是……就是……”呈现两个选择的排他性；“这个／那个”保留希腊文两组对应关系。脚注标记置于“玛门”之后，明确对应需解释的词。
