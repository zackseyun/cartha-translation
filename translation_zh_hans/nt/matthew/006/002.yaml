id: MAT.6.2
reference: Matthew 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: zh_hans
  text: 所以，你施舍的时候，不要在你前面吹号，像那些假冒为善的人在会堂和街上所做的，好叫人荣耀他们。我实在告诉你们，他们已经得到了自己的全部报偿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经得到了自己的全部报偿”也可译作“已经领足了他们的报偿”。原文用了商业收据中表示“已收足”的说法，意思是他们已得到自己所追求的全部回报。
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: 所以，你……的时候
  rationale: ὅταν加虚拟式表示一般或反复发生的情形；现代汉语用“……的时候”自然表达。οὖν译作“所以”，承接上文并保留推论关系。
- source_word: ποιῇς ἐλεημοσύνην
  choice: 施舍
  rationale: 这是指向贫困者进行慈善给予的固定表达。“施舍”简洁、通行，并保留具体的赈济行为。
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: 不要在自己前面吹号
  rationale: 保留原文“吹号”的鲜明形象，不预先判定它是字面行为、夸张还是比喻；“在自己前面”也准确传达ἔμπροσθέν σου。
- source_word: οἱ ὑποκριταί
  choice: 那些假冒为善的人
  rationale: 在本语境中指以敬虔行为作秀的人；此表达比单独使用“伪君子”更具体、庄重。
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: 在会堂和街上
  rationale: “会堂”指犹太会堂；“街上”自然表达公开场所，与炫示行为的语境相合。
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: 为要得人的荣耀
  rationale: 保留δοξάζω较强的“荣耀”用语，同时以自然汉语表达被人荣耀、获取公众称誉的目的；“人”在此为泛指。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 其实我告诉你们
  rationale: “其实”在现代中文中可自然引出郑重、确定的宣告，并体现ἀμήν在句首所强调的真实性；“我告诉你们”保留直接语气。
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: 他们已经得到了全部的报偿
  rationale: ἀπέχω是商业收据用语，可表示款项已收足；译文明确表达其报偿已经全数领取、不再另有所得的含义。
theological_decisions:
- issue: δοξασθῶσιν所表达的人间称誉强度
  choice: 得人的荣耀
  alternative: 受人称赞／得人的尊重
  rationale: 采用“荣耀”保留原词的较强措辞和与周边经文中神之报偿的张力，不将其弱化为一般赞美。
- issue: ἀπέχουσιν的完成性和报偿含义
  choice: 已经得到了全部的报偿
  alternative: 他们得了自己的报偿
  rationale: 商业性惯用语含有“已经收足”的意味；译出“已经”和“全部”能说明这就是他们所得的全部，而不额外断定报偿的终极性质。
- issue: 吹号形象的解释
  choice: 保留字面形象，不判定为史实习俗或纯粹比喻
  alternative: 不要大张旗鼓地宣扬
  rationale: 原文明确使用吹号意象，但其修辞性质存在解释空间；正文保留这种张力，避免把一种解释写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“施舍”“会堂”“荣耀”“报偿”保持经文语域，但句式避免文言化。脚注标记[a]已置于正文相关句末。
