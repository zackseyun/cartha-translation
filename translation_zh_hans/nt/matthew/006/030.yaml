source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: zh_hans
  text: 田野里的草今天还在，明天就被扔进炉中[b]；上帝若这样给它披上衣裳，何况你们呢？你们这些信心小的人！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心小的人”也可译作“信心不足的人”。希腊语ὀλιγόπιστοι是直接称呼，带有对信靠不足的责备。
    reason: lexical_alternative
  - marker: b
    text: 这里的“炉”指烤炉；晒干的草和田间植物可以用作燃料。
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: 田野里的草
  rationale: χόρτος可指草或草本植物；此处强调田野中短暂的植物生命。“田野里的草”自然、准确，也不把所指限缩为花。
- source_word: σήμερον ὄντα
  choice: 今天还在
  rationale: 按汉语习惯表达ὄντα的存在意义，并以“还”衬托其转瞬即逝。
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: 明天就被扔进炉里
  rationale: κλίβανος指烤炉或炉子，并非冶炼用熔炉；被动式保留βαλλόμενον的语态。“就”自然呈现今天与明天的强烈对照。
- source_word: οὕτως ἀμφιέννυσιν
  choice: 尚且这样给它装扮
  rationale: ἀμφιέννυμι本义为穿衣；用于草时，“装扮”在现代汉语中更自然，并保留与下文给人穿衣之间的比喻联系。
- source_word: οὐ πολλῷ μᾶλλον ὑμᾶς
  choice: 何况你们呢？他岂不更要给你们穿上衣服吗？
  rationale: 原文省略重复的ἀμφιέννυσιν。汉语补出“给你们穿上衣服”以明确宾语关系，并用反问表达从小到大的论证。
- source_word: ὀλιγόπιστοι
  choice: 你们这些信心小的人
  rationale: 保留复数呼格的直接责备及“小信”这一程度含义；不用“没有信心”，以免强化原文。
- source_word: εἰ δὲ
  choice: 田野里的草……上帝尚且
  rationale: 汉语以“尚且……何况……”重构条件论证，比机械译作“但是，如果”更自然，同时保留δέ的推进和轻微转折作用。
theological_decisions:
- issue: 从较小者到较大者的上帝供应论证
  choice: 保留反问，明确上帝既装扮短暂的草，更会给门徒穿衣。
  alternative: 将反问改译为陈述句，或泛化为上帝满足人的一切需要。
  rationale: οὐ πολλῷ μᾶλλον构成明确的反问式由小及大论证；译文限于衣着供应这一语境，不扩展为额外教义主张。
- issue: ὀλιγόπιστοι所指的信心程度
  choice: 译为“信心小的人”，表达信靠不足的责备。
  alternative: 译为“没有信心的人”或“缺乏信仰的人”。
  rationale: 该词责备信心微小或不足，并不等同于完全没有信仰；应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。以“尚且……何况……”自然呈现希腊语条件句和由小及大的反问论证；脚注标记均置于正文中。
