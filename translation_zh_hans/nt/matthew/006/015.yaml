  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: zh_hans
  text: 但你们若不饶恕人，你们的父也不会饶恕你们的过犯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过犯”也可译作“过错”或“冒犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: 但……若不
  rationale: ἐάν引出条件，δέ承接上文形成转折，μή否定该条件；译为“但……若不”既保留逻辑关系，也符合现代汉语表达。
- source_word: ἀφῆτε / ἀφήσει
  choice: 饶恕 / 饶恕
  rationale: ἀφίημι在此指对人的过犯予以宽免；前后两处采用同一译词，以保留原文的重复和对应结构。
- source_word: τοῖς ἀνθρώποις
  choice: 人
  rationale: ἄνθρωποι泛指人，并非专指男性；“人”简洁、自然，也比按语境补译为“别人”更贴近原文名词。
- source_word: οὐδὲ
  choice: 也不会
  rationale: οὐδέ在否定条件之后表示相应的否定结果；汉语用“也不会”自然地体现“同样不”的对应关系。
- source_word: ὁ πατὴρ ὑμῶν
  choice: 你们的父
  rationale: 原文只有“你们的父”，没有“天上的”；不增添本节未出现的修饰语。
- source_word: τὰ παραπτώματα ὑμῶν
  choice: 你们的过犯
  rationale: παράπτωμα指越轨、冒犯或过失。“过犯”保留其道德分量，在现代中文圣经语境中也清楚可懂。
theological_decisions:
- issue: 人饶恕与父饶恕之间的条件关系
  choice: 保留原文直接的条件陈述：“若不……也不会……”。
  alternative: 将其解释性地弱化为人的饶恕只是蒙神饶恕的证据，或仅涉及与神相交而非饶恕本身。
  rationale: 希腊文明确陈述否定条件及其否定结果。译文不应借释义化表达消解经文本身的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“饶恕”保留经文语体和神学分量；“若不……也不会……”清楚呈现条件结构。脚注标记置于相关词语之后。
