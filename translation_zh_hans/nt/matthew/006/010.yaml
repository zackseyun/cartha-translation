id: MAT.6.10
reference: Matthew 6:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: zh_hans
  text: 愿你的国降临；愿你的旨意成就[a]，如同在天上，也在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为：“愿你的国降临；愿你的旨意成就，如同在天上，也在地上。”其中“如同在天上，也在地上”同时适用于前面两个祈求。
    reason: 保留比较短语修饰范围的另一种可能理解。
lexical_decisions:
- source_word: ἐλθέτω
  choice: 愿……降临
  rationale: 这是ἔρχομαι的简单过去时主动命令语气第三人称单数，在祷告中表达向上帝所求之事。“愿……降临”自然保留祈愿和命令语气的力量。
- source_word: ἡ βασιλεία σου
  choice: 你的国
  rationale: βασιλεία既可指王权、统治，也可指国度。中文圣经语境中的“你的国”简洁自然，并能承载上帝掌权的含义，而不把词义限缩为抽象的“统治”。
- source_word: γενηθήτω
  choice: 愿……成就
  rationale: 这是γίνομαι的简单过去时被动命令语气第三人称单数；与θέλημα连用时，表示所意愿的事得以实现。“成就”比“被做成”更符合现代汉语，同时保留实现、发生的语义。
- source_word: τὸ θέλημά σου
  choice: 你的旨意
  rationale: θέλημα指所意愿、希望或定意之事。“旨意”在庄重而通俗的祷告语体中自然，也保留其意愿与目的的神学分量。
- source_word: ὡς
  choice: 如同
  rationale: ὡς引入比较；“如同”准确、自然，不额外规定比较关系的范围。
- source_word: ἐν οὐρανῷ
  choice: 在天上
  rationale: ἐν加与格表示所在领域；单数οὐρανός在此适合译为“天上”，与下文“地上”形成自然对举。
- source_word: καὶ ἐπὶ γῆς
  choice: 也在地上
  rationale: καί在ὡς…καί…结构中完成对应比较，ἐπί加属格表示“在……之上”。“也在地上”简洁呈现“如同在天上，也在地上”的对应关系。
theological_decisions:
- issue: 比较短语ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς的修饰范围
  choice: 正文按最直接的句法关系，将“如同在天上，也在地上”接在“愿你的旨意成就”之后。
  alternative: 该短语也可能同时修饰“愿你的国降临”和“愿你的旨意成就”两个祈求。
  rationale: 希腊文古代抄本的标点不能决定其范围；就邻近关系而言，接续第二个祈求最自然，但句法和思想联系容许较广的理解，因此在脚注中保留这种可能性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“降临”“旨意”“成就”保留经文的尊严与神学张力；分号区分两个平行祈求，脚注明示希腊语中比较短语范围的真实歧义。
