  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: zh_hans
  text: 因为你们若饶恕别人的过犯[a]，你们的天父[b]也必饶恕你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“过错”、“冒犯”或“罪过”。希腊语这个词指道德上的失足或过失。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译“你们的父，那位属天的”；传统译作“你们在天上的父”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: 因为……若
  rationale: γάρ承接并解释上文，因此译作“因为”；ἐάν与虚拟语气构成真实呈现的条件句，译作“若”。
- source_word: ἀφῆτε / ἀφήσει
  choice: 饶恕／必饶恕
  rationale: ἀφίημι在这里指对道德过犯的宽免。前后采用同一词根译法，以保留原文的对应关系；未来时译作“必饶恕”。
- source_word: τοῖς ἀνθρώποις
  choice: 人
  rationale: ἄνθρωποι泛指人，并非特指男性；“人”在现代汉语中简洁自然。
- source_word: τὰ παραπτώματα αὐτῶν
  choice: 人的过犯
  rationale: παράπτωμα指越轨、失足或道德上的冒犯；“过犯”既保留其道德分量，也适合本节的人际关系语境。属格代词按汉语习惯与前面的“人”合并表达。
- source_word: καὶ ὑμῖν
  choice: 也必饶恕你们
  rationale: καί译作“也”，保留人饶恕他人与父饶恕人之间的对应；ὑμῖν在汉语中自然作“饶恕”的宾语。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: 你们的天父
  rationale: 这是现代汉语中自然、庄重的表达，传达“你们的父，那位属天的”这一称谓，同时以脚注保留原文结构及传统译法。
theological_decisions:
- issue: 人饶恕他人与上帝饶恕人之间的条件关系
  choice: 按原文直接译为“若……也必……”，保留明确的条件陈述。
  alternative: 将其解释为人的饶恕赚取上帝的饶恕，或仅仅证明人已经先蒙饶恕。
  rationale: 希腊文直接提出条件，并未在本节说明这种关系属于功劳性的因果还是先蒙恩后的证据；译文不替原文消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“因为”显明本节对上文的解释作用；“若……也必……”保持原文条件结构。“饶恕”前后重复，以体现希腊文同一动词的修辞对应。脚注标记均置于所说明的词语之后。
