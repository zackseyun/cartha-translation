id: MAT.6.31
reference: Matthew 6:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: zh_hans
  text: 所以，不要忧虑[a]，说：‘我们吃什么？喝什么？穿什么？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要焦虑”。
    reason: 词义备选；μεριμνάω在此可强调内心焦虑不安。
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: 所以，不要忧虑
  rationale: οὖν承接上文的论证，译为“所以”；μεριμνάω在本段指为生活所需焦虑不安，“忧虑”既自然庄重，也保留禁令的力度。
- source_word: λέγοντες
  choice: 说
  rationale: 按其伴随情形的分词用法直译为“说”，引出忧虑时所说的三个问题。
- source_word: Τί φάγωμεν
  choice: 我们吃什么
  rationale: τί引出直接问句；φάγωμεν是商议式虚拟语气，在此表达对所需食物的担忧，现代汉语用“我们吃什么”自然传达其意。
- source_word: Τί πίωμεν
  choice: 喝什么
  rationale: 与前一问平行，主语“我们”在汉语中可自然省略，避免重复而不损失意义。
- source_word: Τί περιβαλώμεθα
  choice: 穿什么
  rationale: περιβάλλω在这里指穿上衣物；“穿什么”是现代汉语中最自然简洁的表达。
- source_word: ἤ ... ἤ ... ἤ
  choice: 三个并列问句
  rationale: 希腊语以重复的ἤ连接三项。汉语用依次并列的短问句表达同样的三重选择关系，比逐项加入“还是”更自然。
theological_decisions:
- issue: 耶稣对物质需要之忧虑的禁令性质
  choice: 将μεριμνήσητε译为“不要忧虑”，指向焦虑不安，而非禁止审慎筹划。
  alternative: 不要挂虑；不要担心
  rationale: 上下文针对的是为饮食衣着而焦虑，并未明说禁止对未来作负责任的安排。“忧虑”保留原文力度，同时不把禁令扩大为对一切关切或计划的否定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以”清楚承接上文；后三问压缩重复成分，保持耶稣话语简洁有力的节奏。
