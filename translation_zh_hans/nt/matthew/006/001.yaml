id: MAT.6.1
reference: Matthew 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: zh_hans
  text: 但你们要谨慎，不可在人面前行义，故意让人看见[a]；不然，你们在天上的父就不会给你们奖赏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行义”也可译为“行义行”。有些抄本作“行施舍”。
    reason: 保留δικαιοσύνην的广义，以及ἐλεημοσύνην（“施舍”）这一文本异文。
  - marker: b
    text: 原文直译“你们在诸天中的父”；“诸天”在原文中为复数，通常译作“天上”。“在……父那里”也可理解为“从……父而来”。
    reason: 说明τοῖς οὐρανοῖς的复数形式，并保留παρά加与格可表达所在处或来源的语义张力。
lexical_decisions:
- source_word: Προσέχετε
  choice: 要谨慎
  rationale: 现在时命令语气复数，要求门徒持续警醒；“要谨慎”自然地保留警告意味。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并转入警告，带有轻微转折意味。
- source_word: δικαιοσύνην
  choice: 义
  rationale: SBLGNT正文是δικαιοσύνην，范围可广指合乎上帝心意的正义或义行；“义”保留其广度，不在正文中限缩为施舍。
- source_word: μὴ ποιεῖν
  choice: 不可……行
  rationale: μή加不定式说明应当避免的行为；“行……义”符合现代汉语的圣经语体，也表达实践之意。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人面前
  rationale: 指在人类观察者面前，并非专指男性；“人”在此为泛指。
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: 目的是让他们看见
  rationale: πρός加带冠词不定式明确表达目的；译文保留行为动机这一重点及被看见的含义。
- source_word: εἰ δὲ μή γε
  choice: 不然
  rationale: 以自然简洁的汉语表达条件性警告及其后果。
- source_word: μισθὸν
  choice: 奖赏
  rationale: 此处指来自父的报偿；“奖赏”比“工钱”更适合敬虔行为的语境。
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: 你们的父所赐的
  rationale: παρά加与格可表达在某者那里或来自某者；结合“奖赏”，译为父所赐，清楚表达来源，同时在神学说明中保留另一语法可能。
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: 在诸天之上的
  rationale: 保留希腊文τοῖς οὐρανοῖς的复数形式及马太的表达特色；“诸天之上”在庄重现代汉语中可理解。
theological_decisions:
- issue: δικαιοσύνην的范围
  choice: 正文广义译作“义”，指义的实践，不限于施舍
  alternative: 义行；施舍
  rationale: SBLGNT采用δικαιοσύνην；虽然后文谈施舍，且有异文ἐλεημοσύνην，但不宜据此把正文含义静默限缩。脚注保留具体化理解和文本异文。
- issue: ἀνθρώπων的泛指性质
  choice: 人
  alternative: 男人；众人
  rationale: 这里泛指观看者，不专指男性；“人”简洁且符合原意。
- issue: παρὰ τῷ πατρὶ的关系
  choice: 父所赐的奖赏
  alternative: 在父那里有奖赏
  rationale: 语境侧重奖赏的来源，但παρά加与格也可强调奖赏在父那里；正文采用自然汉语，不据此建立超出经文的奖赏理论。
- issue: τοῖς οὐρανοῖς的复数
  choice: 诸天
  alternative: 天上
  rationale: 保留原文复数和马太式用语，不赋予复数额外的宇宙层级含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行你们的义”略带圣经语体，但比“实践你们的义”自然，并保留δικαιοσύνην的神学与语义张力。正文中的[a]、[b]均与脚注对应。
