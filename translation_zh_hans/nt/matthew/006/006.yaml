id: MAT.6.6
reference: Matthew 6:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: zh_hans
  text: 但你祷告的时候，要进你的内室[a]，关上门，向你那位在隐秘中的父祷告；你那位在隐秘中察看的父，必报答你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“内间”、“私室”或“储藏室”。希腊语指住宅内部可用来独处或储物的房间。
    reason: lexical_alternative
  - marker: b
    text: 或译“回报你”或“奖赏你”。希腊语动词可表示“归还”、“偿还”或“报答”，具体含义视上下文而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你
  rationale: 强调代词σὺ配合δέ，与上文假冒为善者的公开祷告形成鲜明对比；“但你”在现代汉语中简洁自然地保留这一转折和强调。
- source_word: ὅταν προσεύχῃ
  choice: 祷告的时候
  rationale: ὅταν加虚拟语气表示一般性或反复出现的时间情形；“……的时候”既自然，也不把它局限为一次行动。
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: 要进你的内室
  rationale: εἴσελθε是命令式；ταμεῖον指住宅内部可供储藏或独处的房间。“内室”保留内部、隐蔽空间的含义，又避免现代“衣橱”造成的误解。
- source_word: κλείσας τὴν θύραν σου
  choice: 关上门
  rationale: 不定过去时分词表示相对于主要命令先发生或伴随完成的行动；汉语顺承结构“关上门”清楚呈现行动次序。
- source_word: πρόσευξαι τῷ πατρί σου
  choice: 向……你的父祷告
  rationale: 直接保留“向你的父祷告”的关系性表达，不增添原文没有的“天上的”等限定语。
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: 那位在隐秘中的
  rationale: 此短语修饰“父”，表达隐藏、不显露的状态或领域；“在隐秘中”尽量保留其既可带处所意味、又可表达隐而不显的含混性。
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: 那位在隐秘中察看的
  rationale: 保留ἐν τῷ κρυπτῷ在本节中的重复。“察看”表达持续、留意地看见，同时不擅自补出“你所做的事”。
- source_word: ἀποδώσει σοι
  choice: 必报答你
  rationale: ἀποδίδωμι可指归还、偿还或按行为给予回报；本语境中“报答”自然表达父对真诚祷告的回应，又比“奖赏”稍少限定回报的具体性质。
theological_decisions:
- issue: ἐν τῷ κρυπτῷ的重复及其含义
  choice: 两处均译为“在隐秘中”
  alternative: “在隐秘处”；“暗中”；第二处译作“察看隐秘之事”
  rationale: 原文先描述父“在隐秘中”，继而描述父“在隐秘中察看”，形成刻意重复。统一译法保留公开炫耀与隐秘祷告之间的张力，也不把短语完全限定为物理处所或所见之事。
- issue: πατήρ作为对上帝的称呼
  choice: 父
  alternative: “天父”；“父神”
  rationale: 原文在此仅用“你的父”，故不从邻近经文补入“天上的”，也不加解释性神学称谓。
- issue: ἀποδώσει所表达的神圣回应
  choice: 报答
  alternative: “奖赏”；“偿还”；“回报”
  rationale: 该动词语义包括归还、偿付和报答；此处语境具有正面回报意味，但译文不说明回报的方式或内容，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但你”保留与上文的对比；两个“在隐秘中”有意重复，以反映希腊原文的修辞结构和未完全限定的语义。脚注标记分别置于其所解释的“内室”和“报答你”之后。
