source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: zh_hans
  text: 为的是叫你禁食不让人看见，只让你在隐秘中的父看见；你在隐秘中察看的父，必报答你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: 为的是
  rationale: 引出目的，保留原文的目的意义，同时符合现代汉语表达。
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: 不让人看出你在禁食
  rationale: φανῇς在此表示显露于观察者眼前；这一译法自然表达“不在人前显出禁食”的意思。ἀνθρώποις泛指人，不限男性，因此译作“人”。
- source_word: ἀλλὰ τῷ πατρί σου
  choice: 只让你……的父看见
  rationale: ἀλλά与前面的否定构成“不是……而是……”的对照。补出“看见”是汉语句法所需，也承接φανῇς，并未添加新的语义对象。
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: 那在隐秘中的
  rationale: 保留κρυφαίῳ的隐秘含义及其与后半句重复用语的呼应，不把它过度具体化为某个房间或地点。
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: 在隐秘中察看
  rationale: “察看”自然地表达持续观看、知悉之意，同时没有像“看见隐秘中所做的事”那样明说原文省略的宾语。
- source_word: ἀποδώσει σοι
  choice: 必报答你
  rationale: ἀποδίδωμι有偿还、给予相应回报之意；“报答”保留神对行为作出回应的语义，也避免把具体奖赏内容说得过满。
theological_decisions:
- issue: τοῖς ἀνθρώποις的泛指范围
  choice: 译作“人”，泛指人的观察者
  alternative: 男人；众人；别人
  rationale: 上下文不是专指男性。现代汉语“人”既准确又自然，无须用脚注澄清性别范围。
- issue: κρυφαίῳ两次出现的意义与呼应
  choice: 两处均译作“在隐秘中”
  alternative: 在暗中；在隐秘处；私下
  rationale: 一致译法保留原文的修辞联系，也保留它可指隐秘领域或情境的轻微开放性。
- issue: ἀποδώσει的神学语气
  choice: 译作“必报答”
  alternative: 必奖赏；必偿还
  rationale: “报答”表达相应回报而不预先限定其形式；“奖赏”较正面但更具体，“偿还”在现代汉语中容易带债务色彩。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“父”沿用本段对上帝的亲属称谓；“你父”比“你的父亲”更凝练，也符合经文语体。前半句通过“不让……只让……”清楚呈现μὴ…ἀλλά的对照。
