id: MAT.6.28
reference: Matthew 6:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: zh_hans
  text: 你们为什么为衣着忧虑呢？仔细观察野地里的百合花[a]是怎样生长的：它们既不劳作，也不纺线。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百合花”也可能宽泛指野花。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: 为衣着
  rationale: ἔνδυμα在此泛指供人穿着的衣物；“衣着”作为类别词，比“一件衣服”更符合上下文。介词短语与μεριμνᾶτε结合，译作“为衣着忧虑”自然清楚。
- source_word: τί μεριμνᾶτε
  choice: 为什么……忧虑呢
  rationale: τί在这里表达“为什么”，μεριμνάω指对生活所需怀有焦虑和挂虑。“忧虑”既保留其内在不安的意味，也与本段反复出现的劝诫相协调。
- source_word: καταμάθετε
  choice: 仔细观察
  rationale: 这个命令不仅指看见，还要求通过认真观察而领会；“仔细观察”兼顾观察和思考的含义，又符合现代汉语表达。
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: 野地里的百合花
  rationale: κρίνα最直接的对应是“百合花”，τοῦ ἀγροῦ说明它们生长在野外；“野地里的”比生硬的“田野的”更自然。该词也可能宽泛指野花，故以脚注保留。
- source_word: πῶς αὐξάνουσιν
  choice: 是怎样生长的
  rationale: αὐξάνω在此指植物自然生长；这一译法保留πῶς所引出的观察内容。
- source_word: οὐ κοπιῶσιν
  choice: 不劳作
  rationale: κοπιάω表示辛苦做工或劳作。“劳作”简洁地保留了付出劳力的含义，并与下句“纺线”构成对照。
- source_word: οὐδὲ νήθουσιν
  choice: 也不纺线
  rationale: νήθω特指把纤维纺成线；补出“线”使现代读者立即明白，又不增加原文没有的实质内容。
theological_decisions:
- issue: 耶稣论上帝供应时μεριμνάω的含义
  choice: 忧虑
  alternative: 操心／担心
  rationale: 此处针对的是人因衣着等生活所需而产生的焦虑，不是否定一切计划或劳动。“忧虑”保留这种内在不安，也避免把经文解释成禁止合理关切。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“衣着”概括生活所需的衣物；“仔细观察”传达命令语气及由观察而领会的意味。句末以“既不……也不……”再现原文两个否定分句的平行结构。
