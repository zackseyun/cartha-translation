id: MAT.6.33
reference: Matthew 6:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: zh_hans
  text: 但你们要先寻求他的国和他的义[a]，这一切也都要加给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。希腊原词可指合乎神旨意的正直状态和行为，也可包含公平正义的意思。
    reason: 保留δικαιοσύνη的词义范围及其可能译法，避免将其仅限于司法或社会正义。
lexical_decisions:
- source_word: ζητεῖτε
  choice: 寻求
  rationale: 现在时命令语气复数表达持续、积极的追求；“寻求”简洁自然，也保留了行动指向。
- source_word: δὲ
  choice: 但
  rationale: 承接上文关于忧虑和物质需要的论述，表达转折，突出应当优先追求的对象。
- source_word: πρῶτον
  choice: 先
  rationale: 既保留“首先”的词义，也自然表达优先次序；置于“寻求”之前符合现代汉语习惯。
- source_word: βασιλείαν
  choice: 国
  rationale: βασιλεία可指王权、统治或国度；“国”是马太福音相关表达中简洁而宽广的译法，可容纳神掌权及其国度的含义。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”在汉语圣经语境中能够涵盖合乎神旨意的正直关系与行为，比单译“公义”更简洁，并保留该词不只涉及司法或社会正义的宽广含义。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 照原文保留代词；上下文表明所指是神（天父），无需在正文中明确替换。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 回指上文的吃、喝、穿等生活所需；“这一切”自然保留指示和总体含义。
- source_word: προστεθήσεται
  choice: 也都要加给
  rationale: 未来时被动语态表示这些事将在首要寻求之外被增添；“加给”保留原文“添加”的意象，“也”体现附加关系。
- source_word: ὑμῖν
  choice: 你们
  rationale: 与复数受词一致；在“加给你们”中自然表达希腊文与格关系。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 公义；正义
  rationale: 此处所指不限于司法或社会层面的正义，也包括合乎神旨意的正直状态与行为。“义”保留较宽的神学和伦理范围；脚注列出其他可能译法。
- issue: αὐτοῦ的所指
  choice: 他的
  alternative: 神的
  rationale: 上下文清楚表明代词指神（天父），但正文保留原文代词，避免不必要的明说。
- issue: βασιλεία的语义范围
  choice: 国
  alternative: 王权；统治
  rationale: “国”既是自然且沿用已久的表达，也不排除神实际掌权的动态含义；不在正文中将其收窄为疆域或抽象统治。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寻求他的国和他的义”保持简洁、平行；“也都要加给你们”保留原文被动和附加之意。所有代词均按上下文使用现代复数形式。
