id: MAT.6.8
reference: Matthew 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: zh_hans
  text: 所以，不要变得像他们一样[a]；因为你们的父亲在你们求他以前，就知道你们所需要的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要像他们一样”。原文动词为被动形式。
    reason: 词义及语态的译法选择
lexical_decisions:
- source_word: μὴ οὖν
  choice: 所以，不要
  rationale: μή构成禁止，οὖν承接上文并表达推论；“所以，不要”自然地保留了与前文警告之间的逻辑联系。
- source_word: ὁμοιωθῆτε
  choice: 变得和……一样
  rationale: 该词为不定过去时被动虚拟式，用于禁止。“变得和……一样”既符合现代汉语，也保留了趋向或仿效某种样式的意味；被动形态的可能表达另见脚注。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 代词指向上文所说的人；汉语直接使用“他们”即可保持上下文衔接，不必在本节补明身份。
- source_word: οἶδεν
  choice: 知道
  rationale: οἶδα虽具有完成时形式，在这里表达现在意义，“知道”准确自然。
- source_word: ὁ πατὴρ ὑμῶν
  choice: 你们的父
  rationale: 原文仅作“你们的父”，没有明说“天父”；译文不增添原文未有的修饰语。
- source_word: ὧν χρείαν ἔχετε
  choice: 你们需要什么
  rationale: 自然表达关系结构所指的需要内容，简洁且忠实。
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: 在你们向他祈求以前
  rationale: πρὸ τοῦ加不定式表示先于某事发生；“向他祈求”在汉语中自然，并明确保留αὐτόν所指的对象。
theological_decisions:
- issue: 上帝预知人的需要与祷告之间的关系
  choice: 直接陈述父在人祈求以前已经知道其需要
  alternative: 加入解释，说明既然父已知道，人为何仍要祷告，或借译文强化某种预知论立场
  rationale: 本节只肯定父预先知道门徒的需要，并未解释祷告的功能或展开系统教义；译文保留这一张力，不越过经文本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们的父”紧贴原文，不擅自补入“天上的”；全句保持教导语气，并使普通读者易于理解。
