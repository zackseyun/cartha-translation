  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: zh_hans
  text: 却要为自己在天上积攒财宝；在那里，衣蛾和腐坏[a]都不能毁坏，贼也不会挖墙而入[b]，也不会偷窃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锈蚀”。希腊原词也可较广泛地指吞食、耗损或腐坏。
    reason: lexical_alternative
  - marker: b
    text: 直译“挖穿”。当时盗贼可能挖穿房屋的墙壁进入。
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: 积攒
  rationale: 保留积聚财宝的比喻，并以现代汉语祈使表达持续实行的要求。
- source_word: δὲ
  choice: 却
  rationale: 承接上一节的禁令，清楚表达“不要……却要……”的对比。
- source_word: ὑμῖν
  choice: 为自己
  rationale: 体现与格所表达的受益或反身含义。
- source_word: θησαυροὺς
  choice: 财宝
  rationale: “财宝”自然承接“积攒”，也保留原文的财富意象；汉语名词通常不标复数。
- source_word: ἐν οὐρανῷ
  choice: 在天上
  rationale: 直接保留原文的方位表达和未加解释的比喻。
- source_word: σὴς
  choice: 蛀虫
  rationale: 指毁坏衣物等储藏物品的衣蛾；“蛀虫”比单说“飞蛾”更清楚地体现其破坏作用。
- source_word: βρῶσις
  choice: 侵蚀
  rationale: 该词可指啃食、消耗或使物品败坏之物；“侵蚀”保留较宽泛的损坏含义，避免限定为金属生锈。
- source_word: ἀφανίζει
  choice: 毁坏
  rationale: 自然表达使财物消失、败坏或毁灭的结果，并可同时搭配“蛀虫”和“侵蚀”。
- source_word: διορύσσουσιν
  choice: 挖墙而入
  rationale: 保留“挖穿”的具体图景；在古代房屋语境中，指盗贼挖穿墙壁进入。
- source_word: κλέπτουσιν
  choice: 偷窃
  rationale: 直接、准确地表达盗取财物。
theological_decisions:
- issue: “天上的财宝”的性质
  choice: 保留“在天上积攒财宝”的比喻，不作解释性扩写
  alternative: 译作“天上的赏赐”或“属灵的财富”
  rationale: 原文没有在本节界定财宝的具体性质；保留比喻可避免加入特定的功德、奖赏或属灵财富体系。
- issue: βρῶσις所指的败坏方式
  choice: 采用较宽泛的“侵蚀”
  alternative: 译作“锈蚀”“生锈”或“耗损”
  rationale: 原词的范围可能不只指金属锈蚀，也可指吞食、消耗或腐坏；宽泛译法保留词义张力，并维持地上财物会朽坏的对比。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“却要”呈现与上一节的鲜明对比；“积攒财宝”保留核心比喻。脚注标记置于各自所解释的词语之后，以免混淆。
