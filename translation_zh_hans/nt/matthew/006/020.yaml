  naturalness: 句式庄重、清楚，适合现代标准汉语。“衣蛾和腐坏都不能毁坏”虽保留了原文中破坏者/败坏现象并列的表达，仍属自然可懂；“贼也不会挖墙而入，也不会偷窃”流畅。
