  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: zh_hans
  text: 不要为自己在地上积攒财宝；在那里，蛾和腐蚀[a]会毁坏它们；盗贼也会破墙而入[b]，把它们偷走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锈蚀”或“腐坏”。希腊词本有“吞吃、耗损”的意思，可泛指使物品逐渐损坏的作用，并不只限于金属生锈。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“挖穿”；当时的盗贼可能挖穿泥砖墙进入屋内。
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: 不要……积攒
  rationale: μή加现在时命令式表达禁止；“积攒”自然地传达持续聚积财物的动作。
- source_word: ὑμῖν
  choice: 为自己
  rationale: 此处与命令式连用，含反身意义，指为自身拥有或受益而积存。
- source_word: θησαυροὺς
  choice: 财宝
  rationale: 保留与“积攒”相连的财富意象，范围不限于金钱。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 保留地点含义，并为下文与“天上”的对照预留空间；现代汉语中简洁自然。
- source_word: σὴς
  choice: 蛀虫
  rationale: 指损坏所收藏衣物等物品的衣蛾一类害虫；“蛀虫”比单说“蛾”更清楚地表现其毁坏作用。
- source_word: βρῶσις
  choice: 侵蚀
  rationale: 原词基本意象为吞吃、耗损，可指广义的损耗或腐坏；“侵蚀”不把意义限定为金属生锈。
- source_word: ἀφανίζει
  choice: 会使财宝毁坏
  rationale: 该动词表示使之消失、败坏或毁掉；补出上下文中的“财宝”，使汉语关系明确。
- source_word: κλέπται
  choice: 盗贼
  rationale: 准确而庄重的现代汉语对应词。
- source_word: διορύσσουσιν
  choice: 破墙而入
  rationale: 原义是“挖穿”；在当时房屋背景下指盗贼穿墙闯入。“破墙而入”既保留具体意象，也符合汉语表达。
- source_word: κλέπτουσιν
  choice: 把财宝偷走
  rationale: “偷走”直接表达盗取；补出宾语“财宝”以避免汉语句意悬空。
theological_decisions:
- issue: γῆ的范围及其与下文的对照
  choice: 在地上
  alternative: 在人间
  rationale: “在地上”保留具体的空间表达，并能直接对应下一节“在天上”，不额外引入对“世俗”的神学解释。
- issue: βρῶσις的具体所指
  choice: 侵蚀
  alternative: 锈蚀／腐坏
  rationale: 希腊词比金属氧化的“锈蚀”更宽泛。正文采用“侵蚀”以保留广义耗损，脚注列出传统可能译法，而不武断限定财宝的材质。
- issue: διορύσσουσιν的文化意象
  choice: 破墙而入
  alternative: 闯入
  rationale: 原文具体说“挖穿”，很可能涉及泥砖墙。正文保留穿破建筑而入的画面，脚注说明其字面意义和历史背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“积攒财宝”延续原文动词与名词的同根意象；分号和并列结构清楚呈现地上财宝所面临的两类危险。所有脚注标记均置于正文相关词语之后。
