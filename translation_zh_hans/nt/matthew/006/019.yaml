  - severity: low
    issue: 正文首句后的并列结构可更明确地对应原文重复的“哪里／在那里”。
    rationale: 以“在那里，蛾和腐蚀会毁坏它们；盗贼也会……”可清楚表达两类使地上财宝失去的威胁，并避免“地上有……也有……”造成的结构松散。
  revised_text: 不要为自己在地上积攒财宝；在那里，蛾和腐蚀[a]会毁坏它们；盗贼也会破墙而入[b]，把它们偷走。
