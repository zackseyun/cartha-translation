revisions:
- from: 不要为自己在地上积攒财宝；地上有蛀虫和侵蚀[a]，会使财宝毁坏，也有盗贼破墙而入[b]，把财宝偷走。
  to: 不要为自己在地上积攒财宝；在那里，蛾和腐蚀[a]会毁坏它们；盗贼也会破墙而入[b]，把它们偷走。
  rationale: 修订仅作两项安全调整：以“蛾”准确对应σὴς，并重组平行分句以使现代汉语更流畅、清楚地呈现原文的重复结构。保留“腐蚀”的广义处理及其脚注，也保留“破墙而入”与文化说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:42:52Z'
