  source_fidelity: “蛀虫”泛指蛀蚀物品的虫类，未能准确体现σὴς所指的“蛾”；改为“蛾”可保留原文的具体意象。其余主要对应关系准确：为自己积攒、在地上、腐蚀／耗损、盗贼破墙而入并偷走，均反映希腊文。补出的“它们”在汉语中使两个毁坏／偷盗动作的宾语明确，不增添原意。
  naturalness: 原译通顺，但“地上有蛀虫和侵蚀，会使财宝毁坏，也有盗贼……”的并列关系略显松散。以“在那里……；盗贼也……”重组后，更自然地呈现原文两次ὅπου所引出的平行危险。
  terminology: “财宝”“盗贼”“积攒”庄重且符合现代汉语圣经语体。“腐蚀”可作为βρῶσις广义耗损的暂定译法，脚注恰当地保留“锈蚀／腐坏”等可能；不宜在正文将其限定为“锈蚀”。“破墙而入”配合脚注保留διορύσσω的具体文化意象。
