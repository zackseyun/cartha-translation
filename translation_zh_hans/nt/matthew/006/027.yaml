id: MAT.6.27
reference: Matthew 6:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: zh_hans
  text: 你们中间谁能靠忧虑使自己的寿数增加一肘呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己的身量增加一肘呢？”原文“ἡλικία”既可指寿数、年龄，也可指身量。
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: 你们中间谁
  rationale: 这是自然的现代汉语反问表达；δέ在此仅作轻微衔接，中文无需硬译为“但是”或“而且”。
- source_word: μεριμνῶν
  choice: 靠忧虑
  rationale: 分词在此可表手段，“靠忧虑”既传达忧虑、担心之意，也贴合反问所强调的无能为力。
- source_word: δύναται προσθεῖναι
  choice: 能……增加
  rationale: 准确表达能力与增添的含义，同时保持现代汉语流畅。
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: 使自己的寿数
  rationale: ἡλικία可指寿命、年龄，也可指身量；上下文谈生命与忧虑，正文采用“寿数”，但在脚注保留另一真实可能。泛指结构在汉语中自然译作“自己的”。
- source_word: πῆχυν ἕνα
  choice: 一肘
  rationale: 保留原文以长度单位衡量生命的具体比喻，不换算成现代单位，也不消解其修辞张力。
theological_decisions:
- issue: ἡλικία在本句中的含义
  choice: 寿数
  alternative: 身量
  rationale: “寿数”与上下文关于生命和忧虑的论述契合，也保留以“一肘”形容生命长度的鲜明比喻；但“身量”在词汇上同样成立，故列入脚注而不将歧义抹去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寿数”比“寿命”略具经文语体色彩，但仍为普通读者易懂；“一肘”保留古代度量及原文比喻。
