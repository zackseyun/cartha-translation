id: MAT.6.23
reference: Matthew 6:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: zh_hans
  text: 但你的眼睛若不好[a]，全身就会黑暗。因此，你里面的光若是黑暗，那黑暗该是何等深重！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不好”也可译作“邪恶”或“不健全”；结合“眼睛”的惯用说法和上下文，也可能含有“吝啬、不慷慨”的意思。
    reason: 保留πονηρός在此处的词义范围，以及“眼睛”这一比喻可能具有的惯用含义。
lexical_decisions:
- source_word: πονηρὸς
  choice: 不好
  rationale: “不好”保留该词在此处“坏、邪恶、不健全”等较宽的语义范围，也不把“眼睛”的比喻只限定为视力有缺陷或为人吝啬。
- source_word: σκοτεινὸν
  choice: 黑暗
  rationale: 以简洁自然的谓语表达“处于黑暗中”的状态，并与后文的“光”和“黑暗”保持鲜明对照。
- source_word: φῶς
  choice: 光
  rationale: 保留原文的光暗比喻，不在正文中解释为内在认知、道德判断或属灵眼光。
- source_word: σκότος
  choice: 黑暗
  rationale: 直接对应原词，并保留与“光”的对照以及末句的强调。
- source_word: πόσον
  choice: 何等深重
  rationale: 原文末句省略谓语，以程度感叹收束；“何等深重”在现代汉语中自然地表达其强烈警告，同时不补入具体成因。
- source_word: ὀφθαλμός
  choice: 眼睛
  rationale: 保留身体器官的直译，使关于感知、意向和道德取向的比喻保持开放。
- source_word: ὅλον τὸ σῶμά σου
  choice: 全身
  rationale: 自然、准确地传达“整个身体”，并保留ὅλον的整体性强调。
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: 你里面的光
  rationale: 贴近原文的介词结构，避免译成“内在之光”等可能带有额外思想含义的固定说法。
- source_word: οὖν
  choice: 因此
  rationale: 明确呈现推论关系：既然眼睛可使全身陷入黑暗，若人里面本应为光的竟成了黑暗，结果就更加严重。
theological_decisions:
- issue: “不好的眼睛”这一比喻的含义
  choice: 正文采用宽泛的“不好”，不把比喻限定为邪恶、不健全或吝啬。
  alternative: 可理解为“邪恶的眼睛”“不健全的眼睛”，结合财宝与财富的上下文，也可能含有“吝啬、不慷慨”的闪族惯用意味。
  rationale: 马太福音6:19–24的上下文容许道德败坏、认知失真和不慷慨等含义彼此重叠。正文保留这种神学与解释上的张力，具体可能性列入脚注。
- issue: “你里面的光”所指为何
  choice: 保留“光”的原始比喻，不在正文中解释其确切所指。
  alternative: 可解释为人的内在认知、道德辨识或属灵眼光。
  rationale: 原文没有在本句中直接界定“光”，直译能避免把开放的比喻收窄为单一教义概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的眼睛若不好”保留原文简洁的身体比喻；末句用感叹式“何等深重”再现希腊文省略句的强烈语气。脚注标记[a]已置于相关词语之后。
