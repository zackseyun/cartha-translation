  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: zh_hans
  text: 你们看天空的飞鸟[a]：它们不撒种，不收割，也不收进仓房；你们的天父养活它们。你们不是比它们贵重得多吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的飞鸟”；传统译法也常作“空中的飞鸟”。
    reason: οὐρανός可按语境译为“天空”“天”或“空中”；此处正文采用指可见天空的自然表达。
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: 你们要看看
  rationale: 传达不定过去时命令语气所要求的定向关注；“看看”自然明白，又不额外强化为“仔细观察”。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: πετεινά指鸟类或飞禽；“天空”贴合此处可见的受造界，也避免把οὐρανός不必要地理解为神圣居所。
- source_word: ὅτι
  choice: 以冒号引出所观察的事实
  rationale: ὅτι在此可引出“看”的内容，也可带说明意味。中文用冒号自然连接命令与后续事实，不强行限定为单纯因果。
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν εἰς ἀποθήκας
  choice: 撒种，不收割，也不收进仓里
  rationale: 保留三个并列的农业动作及其递进画面；“仓里”是ἀποθήκας在此语境中的自然表达。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: 你们的天父
  rationale: 简洁保留“父”的关系性称谓和“属天的”限定，是现代汉语中庄重而通行的表达。
- source_word: τρέφει
  choice: 养活
  rationale: 此处不只描写一次喂食，而是神持续供应飞鸟生存所需；“养活”自然表达这一语境含义。
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: 你们不是比它们贵重得多吗？
  rationale: 保留期待肯定回答的反问，并以“贵重得多”表达διαφέρω与μᾶλλον所构成的价值比较。
theological_decisions:
- issue: 人和飞鸟在上帝看顾中的相对价值
  choice: 译文明说听众比飞鸟贵重得多，但不解释这种价值差异的神学根据。
  alternative: 补明人因具有上帝的形象，或因盟约关系，而比飞鸟更有价值。
  rationale: 原文只陈述比较关系，并未在本节说明其根据；不应把可能正确但未明说的教义解释写进正文。
- issue: 天父供应飞鸟与听众免于忧虑之间的关系
  choice: 保留“尚且”所表达的由较小者推及较大者的论证语气。
  alternative: 只译为“你们的天父养活它们”，不显出中文中的论证承接。
  rationale: καί本身通常是“并且”，但本句与随后“岂不更……”的反问构成明显的递进论证；“尚且”在中文中自然显出这一语用关系，而不把供应方式绝对化。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“撒种—收割—收进仓里”保留农业意象和并列节奏；反问句保持耶稣教导中的劝勉力度。
