  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: zh_hans
  text: 所以，不要为明天忧虑，因为明天会为自己忧虑。一天的难处[a]，一天承受就够了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “难处”或译“恶”。原文这个词可指“恶”，但这里更可能是指每天遇到的困苦或患难。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: 忧虑
  rationale: 本段中该动词指使人焦虑不安的挂虑；“忧虑”既自然，也与马太福音6:25—34反复出现的主题一致。
- source_word: εἰς τὴν αὔριον
  choice: 为明天
  rationale: 介词短语表示忧虑所指向的未来；“为明天忧虑”是现代汉语中自然且准确的表达。
- source_word: ἡ αὔριον
  choice: 明天
  rationale: 原文把“明天”拟人化为下一分句的主语，汉语可直接用“明天”保留这一修辞。
- source_word: μεριμνήσει αὑτῆς
  choice: 自有明天的忧虑
  rationale: 直译可作“会为自己忧虑”。这里采用汉语惯用表达，以“自有”保留反身含义，并重复“忧虑”以维持原文的词语呼应与拟人色彩。
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: 一天……一天担当就够了
  rationale: “就够了”表达ἀρκετός的“足够”之意；“一天……一天”传达就每一天而言的分配性，并形成自然、庄重的汉语格言句式。
- source_word: ἡ κακία αὐτῆς
  choice: 一天的难处
  rationale: κακία本可指“恶”，但在忧虑与每日负担的语境中更可能指患难、困苦。“难处”保留实际困境之意，不把它不必要地限定为道德邪恶。
theological_decisions:
- issue: κακία在有关忧虑的格言中的含义
  choice: 正文译作“难处”
  alternative: “恶”或“邪恶”
  rationale: 上下文谈的是对未来的忧虑，末句说明每一天已有其足够承担的困苦；“难处”最贴合语境。但原词确有“恶”的词义，故以脚注保留这一真实的词汇可能性。
- issue: “明天会为自己忧虑”的拟人表达
  choice: 译作“明天自有明天的忧虑”
  alternative: “明天会为自己忧虑”
  rationale: 所选译法保留明天被拟人化以及前后“忧虑”的呼应，同时更符合现代汉语格言式表达；不将其解释成明天会自动解决问题。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“所以”承接上文结论；末句用“一天的难处，一天担当就够了”表达原文的智慧格言语气。脚注标记置于相关句末，并保留κακία的词义张力。
