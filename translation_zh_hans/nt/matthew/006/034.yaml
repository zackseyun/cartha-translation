revisions:
- from: 所以，不要为明天忧虑，因为明天自有明天的忧虑。一天的难处，一天担当就够了。[a]
  to: 所以，不要为明天忧虑，因为明天会为自己忧虑。一天的难处[a]，一天承受就够了。
  rationale: 修订恢复“明天会为自己忧虑”中原文的拟人、动词呼应和反身含义，并将脚注锚定在“难处”上。末句保留 κακία 在此处较可能指每日困苦的语境义，同时以自然的现代汉语表达“每一天已有足够难处”的格言判断。
