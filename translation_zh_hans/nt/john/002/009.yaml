  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: zh_hans
  text: 当宴席总管[a]尝了那已经变成酒的水[b]，却不知道它是从哪里来的（那些舀水的仆人却知道）时，就叫新郎来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴席总管”也可译作“宴席主管”，指负责管理宴席的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“已经成为酒的水”；也可译作“那变成了酒的水”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文此处用叙事现在时，直译为“叫”；汉语的“就叫”不必另加过去时标记。
    reason: source_form
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: 宴席总管
  rationale: 指负责管理宴席的人。“宴席总管”清楚表达其职能，又不把此人过窄地限定为普通侍者或现代意义上的司仪。
- source_word: ἐγεύσατο
  choice: 尝了
  rationale: 直接表达在宴席中品尝饮品的动作，符合不定过去时在叙事中的用法。
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: 那已经变成酒的水
  rationale: γεγενημένον是完成时分词，表达变化已经完成且结果仍然存在；“已经变成酒”保留这一状态变化。
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: 却不知道是从哪里来的
  rationale: πόθεν询问来源；现代汉语用“从哪里来的”自然准确。“却”也承接下文仆人知道来源的对照。
- source_word: διάκονοι
  choice: 仆人
  rationale: 此处是婚宴叙事，指负责服侍的人，并非后来的教会职分。
- source_word: ἠντληκότες
  choice: 打水的
  rationale: 准确表达从水源或容器中汲水的动作；在定语结构中简洁自然。
- source_word: φωνεῖ
  choice: 便叫……来
  rationale: φωνέω在此表示叫来或召来某人。希腊文使用历史现在时；汉语动词本身不强制标明过去时，“便叫……来”可自然推进叙事。
- source_word: νυμφίον
  choice: 新郎
  rationale: 现代汉语中婚礼场景的标准称谓，准确对应νυμφίος。
- source_word: ὡς δὲ
  choice: 以“……尝了”从句起句
  rationale: ὡς引出“当……时”的时间关系，δέ推进叙事。汉语无需机械添加“现在”或“但”；按事件顺序直接起句更自然，关系也清楚。
theological_decisions:
- issue: 神迹中水与酒的关系
  choice: “那已经变成酒的水”
  alternative: “那变成了酒的水”或较弱化的“那喝起来像酒的水”
  rationale: 原文明确说水已经成为酒；译文既不增加神学解释，也不将实际的状态变化弱化为味觉印象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宴席总管”交代社会角色，“仆人”符合具体场景；括号保留原文插入说明的效果。句末补出汉语召唤表达所需的“来”，不增加新的参与者或行动结果。
