  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: zh_hans
  text: 于是，犹太人说[a]：“这座圣殿用了四十六年才建成，你竟要在三天内把它立起来吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。希腊原文作“犹太人”；约翰福音使用这个称谓时，具体所指随语境而异。
    reason: alternative_reading
  - marker: b
    text: “把它立起来”也可按说话者对建筑的理解译作“把它重建起来”。这里保留“立起来”的措辞，因为下文把这话与耶稣的身体及复活联系起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接耶稣上一句话，表达随之而来的回应；现代汉语自然，也不过度强化因果。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接保留希腊语通常所指；本节没有明说仅限领袖，因此不在正文中擅自缩小范围。约翰福音中该称谓随语境可有不同所指，故以脚注说明。
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη
  choice: 用了四十六年才建成
  rationale: 表达与格时间短语所含的建造历时，并以“才”自然传达说话者对“三天”的难以置信；不译成“四十六年前”，以免改变时间关系。
- source_word: ὁ ναὸς οὗτος
  choice: 这座圣殿
  rationale: ναός较具体地指圣殿或圣所；“这座圣殿”在现代汉语中准确、庄重且自然。
- source_word: καὶ σὺ
  choice: 你竟能
  rationale: σὺ带强调，问句具有惊讶和质疑语气；“竟能”自然体现这种反问意味，同时避免把可能性说成确定事实。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 在三天内
  rationale: 准确表达限定时段，也与上下文关于第三日和复活的语言联系相容。
- source_word: ἐγερεῖς αὐτόν
  choice: 把它立起来
  rationale: 保留ἐγείρω“使起来、立起”的措辞，而不直接译作“重建”；这样既容纳听者对建筑的理解，也保留下一节所揭示的复活双关。
theological_decisions:
- issue: οἱ Ἰουδαῖοι在约翰福音中可能引发把局部冲突泛化为所有犹太人的误解
  choice: 正文译作“犹太人”，并加脚注说明其语境性
  alternative: 犹太地区的人；犹太人的领袖
  rationale: 原文没有在本节明说“领袖”，因此正文不作缩窄性解释；脚注提醒读者该称谓在约翰福音中的指涉随语境而异。
- issue: ἐγερεῖς同时涉及建筑物被立起与耶稣复活的叙事双关
  choice: 译作“把它立起来”
  alternative: 把它重建起来
  rationale: “重建”只保留听者对圣殿建筑的理解，会过早消除作者在下一节解释的神学张力；“立起来”较能保存原文的双重可能。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“用了……才……”呈现四十六年与三天之间的强烈反差；“你竟能……吗”传达原句的强调与质疑。“圣殿”比泛称“殿”更清楚，“立起来”则有意保留约翰叙事中的歧义和神学张力。
