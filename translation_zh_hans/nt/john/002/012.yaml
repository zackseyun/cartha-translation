id: JHN.2.12
reference: John 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: zh_hans
  text: 这事以后，耶稣和他的母亲、弟兄[a]及门徒下到迦百农去，在那里住了不多几天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲属”或“族亲”；希腊文这个词可狭义地指兄弟，在某些语境中也可指较广的家族关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: 这事以后
  rationale: 自然地表达时间上的承接，同时保留单数指示语 τοῦτο 的意味。
- source_word: κατέβη
  choice: 下到
  rationale: 保留动词所表达的向下行进之意，也符合从迦拿前往迦百农的地理叙述。
- source_word: εἰς Καφαρναοὺμ
  choice: 到迦百农去
  rationale: 采用现代汉语表达目的地的自然说法；地名按通行译名音译。
- source_word: αὐτὸς
  choice: 耶稣
  rationale: 希腊文使用明确代词承接上文；汉语为避免孤立的“他”所可能造成的指代不清，按上下文明确为耶稣。
- source_word: ἡ μήτηρ αὐτοῦ
  choice: 他的母亲
  rationale: 忠实保留原文，没有补入本节未出现的名字“马利亚”。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄
  rationale: ἀδελφοί 为阳性复数，在此最直接指兄弟；“弟兄”是汉语圣经语境中自然且尊重原文形式的表达。较广的亲属义保留在脚注中。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: “门徒”是福音书中 μαθηταί 的通行对应词，兼含学习者与跟随者的意味。
- source_word: ἐκεῖ ἔμειναν
  choice: 在那里住了
  rationale: 复数动词表明全组人在那里停留；“住了”在现代汉语叙事中自然。
- source_word: οὐ πολλὰς ἡμέρας
  choice: 不多几天
  rationale: 贴近原文否定式表达，没有顺译为更解释性的“只有几天”。
theological_decisions:
- issue: ἀδελφοί 所指的耶稣家属关系
  choice: 正文译作“弟兄”
  alternative: 亲属、族亲
  rationale: 该词最直接的词义是兄弟，但在某些语境中也可泛指较广的亲属关系。正文不借翻译解决后来的教义争议，脚注则保留真实存在的词义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这事以后”“下到”“不多几天”适度保留原文结构；正文中的脚注标记与脚注完全对应。
