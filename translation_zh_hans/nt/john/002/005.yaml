base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: zh_hans
  text: 他母亲对侍者说：“无论他对你们说什么，你们就照着做。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: 他母亲
  rationale: 以现代汉语自然表达属格关系，同时保留叙事中的亲属身份。
- source_word: διακόνοις
  choice: 宴席的侍者
  rationale: 本段是婚宴场景，所指是负责席间服侍的人，并非后来教会中的职分；加上“宴席的”可避免“仆人”可能引出的身份误解。
- source_word: Ὅ τι ἂν
  choice: 无论……什么
  rationale: 传达不定关系结构与ἄν所表达的开放、不确定范围，符合现代汉语习惯。
- source_word: λέγῃ ὑμῖν
  choice: 他吩咐你们
  rationale: 此处不只是一般发言，而是要求侍者执行的话；“吩咐”自然传达语境中的指令意味，同时保留隐含主语“他”。
- source_word: ποιήσατε
  choice: 你们都照着做
  rationale: 以明确的复数称呼和祈使语气表达要求；“照着”承接前面的“什么”，无需另补具体宾语。
theological_decisions:
- issue: “无论他吩咐你们什么”中隐含主语的所指
  choice: 译作“他”，由上下文指向耶稣
  alternative: 明译为“耶稣”
  rationale: 希腊文动词主语隐含，语境足以确定所指；保留“他”既清楚，也避免不必要的解释性扩写。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“宴席的侍者”贴合婚宴语境；整句保留母亲简洁、直接的命令口吻。
