  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: zh_hans
  text: 但耶稣所说的，是指他身体的圣殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他身体的圣所”。这里的希腊语ναός通常较具体地指圣殿中的殿宇或圣所，而不是整个圣殿范围。
    reason: 词义备选；说明ναός与泛指整个圣殿区域的词在范围上的差别。
lexical_decisions:
- source_word: ἐκεῖνος
  choice: 耶稣
  rationale: 该指示代词在上下文中指耶稣。汉语若直译为“那一位”显得生硬；明确译作“耶稣”可自然消除代词所指不清的问题，并未增加新的解释。
- source_word: δὲ
  choice: 但
  rationale: δέ在此表示与前一节犹太人的误解形成轻微转折，“但”能自然传达这一关系。
- source_word: ἔλεγεν
  choice: 所说的
  rationale: 未完成时在这里回顾并说明耶稣先前话语的所指；“所说的”保留了言说动作，避免用“意思是”过度解释。
- source_word: περὶ
  choice: 是指
  rationale: περί加属格表示“关于、论到”。在现代汉语解释性句式中，“是指”自然清楚，同时保留其所论对象。
- source_word: ναοῦ
  choice: 殿
  rationale: ναός通常特指圣殿的殿宇或圣所，而非整个圣殿范围。正文用“殿”简洁保留比喻，脚注说明其较具体的词义。
- source_word: σώματος
  choice: 身体
  rationale: 直接对应σῶμα，并保留本节具有神学意义的身体意象。
- source_word: αὐτοῦ
  choice: 他
  rationale: 该属格代词表明这是耶稣自己的身体；“他身体的殿”保留原文的属格结构和比喻关系。
theological_decisions:
- issue: 耶稣身体与殿的比喻性关联
  choice: 保留“他身体的殿”这一直接比喻
  alternative: “以他的身体比作殿”或“他的身体就是殿”
  rationale: 原文用属格结构表达“他身体的殿”，正文不展开比喻的具体方式，也不将其改写为明确的等同判断，从而保留约翰解释语句的凝练性及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“耶稣所说的，是指……”符合汉语表达习惯；保留“他身体的殿”这一略带陌生感的比喻结构，以免释义性改写消解原文张力。
