  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: zh_hans
  text: 他对卖鸽子的人说：“把这些东西从这里拿走！不要把我父的家变成做买卖的地方[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“不要把我父的家变成买卖之家”，原文在这句话中两次使用“家”一词。
    reason: 说明原文用词重复及较直译的表达。
lexical_decisions:
- source_word: περιστερὰς
  choice: 鸽子
  rationale: 指在圣殿中出售、供献祭使用的鸽类；“鸽子”是现代汉语自然且不过度细分物种的表达。
- source_word: πωλοῦσιν
  choice: 卖……的人
  rationale: 保留现在分词用持续活动来界定这群人的作用，汉语表达简洁自然。
- source_word: Ἄρατε
  choice: 拿走
  rationale: 表达不定过去时命令语气所具有的明确、果断要求，也与表示离开此处的ἐντεῦθεν自然搭配。
- source_word: ταῦτα
  choice: 这些东西
  rationale: 保留中性复数指示词的概括性，不擅自限定为鸽子、笼具或其他货物。
- source_word: ἐντεῦθεν
  choice: 从这里
  rationale: 准确表示从说话者所在之处移走；与“拿走”连用符合现代汉语习惯。
- source_word: μὴ ποιεῖτε
  choice: 不要把……变成
  rationale: 直接表达μή加现在命令式的禁止语气；“变成”在汉语中自然呈现ποιέω在此处“使成为”的结构。
- source_word: οἶκον τοῦ πατρός μου
  choice: 我父的家
  rationale: 保留μου所表达的“我父”这一明确而独特的亲子关系，也保留οἶκος的“家／房屋”意象；上下文清楚指圣殿。
- source_word: οἶκον ἐμπορίου
  choice: 做买卖的地方
  rationale: ἐμπόριον表示商业、贸易活动；此译自然传达含义。希腊文重复οἶκος所形成的修辞则在脚注中说明，因为直译成“买卖之家”在现代汉语正文中较生硬。
theological_decisions:
- issue: 耶稣称圣殿为“我父的家”
  choice: 保留“我父”的单数第一人称所属关系
  alternative: “我们的父的家”或“上帝的殿”
  rationale: 希腊文明确使用πατρός μου，既不可扩展为“我们的父”，也不应改写成较笼统的“上帝”；此译保留耶稣在本段中所宣告的亲子关系与权柄，同时不作超出经文的教义发挥。
- issue: οἶκος在一句中的重复
  choice: 正文采用自然汉语“家……做买卖的地方”，脚注交代原文重复
  alternative: 正文直译为“家……买卖之家”
  rationale: 原文“我父的家／买卖之家”的对照具有修辞意义，但“买卖之家”在现代汉语中不够自然；脚注保存形式信息，正文优先做到清楚、庄重。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拿走”保留命令的力度；感叹号体现命令语气，但不额外增强内容。“我父的家”既自然表达父子关系，也让“家”的意象得以保留；圣殿所指由上下文确定。
