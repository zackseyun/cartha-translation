  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: zh_hans
  text: 犹太人的逾越节快到了[a]，耶稣上耶路撒冷去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的逾越节”。在约翰福音中，Ἰουδαῖοι 在某些语境可指“犹太地人”，而不泛指“犹太人”；但这里最自然的理解是说明逾越节属于犹太人的节期。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: 快到了
  rationale: 此处表示时间临近。“快到了”是自然的现代汉语，也保留了原文简明的时间意义。
- source_word: πάσχα
  choice: 逾越节
  rationale: 这是该犹太节期在现代汉语中的通行名称。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 此处修饰“逾越节”，最自然地说明这是犹太人的节期；“犹太地区人的”这一可能词义以脚注保留。
- source_word: ἀνέβη
  choice: 上……去
  rationale: 保留前往耶路撒冷时惯用的“上去”表达，既可反映地势，也符合朝圣行程的传统说法。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用该城名的现代汉语标准译名。
- source_word: Καὶ
  choice: （首个不另译；第二个译为“就”）
  rationale: 首个连接词承担叙事承接作用，汉语中无需机械译出；第二个连接词用“就”自然衔接节期临近与耶稣上耶路撒冷两个分句，但不额外强化因果关系。
theological_decisions:
- issue: 约翰福音中 Ἰουδαῖοι 的译法
  choice: 犹太人的
  alternative: 犹太地区人的
  rationale: 本节说的是逾越节这一犹太节期，并非特指某个地区性或对立性群体，因此正文采用“犹太人的”；同时用脚注保留该词在约翰福音其他语境中可能指“犹太地区人”的词义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“快到了”表达时间临近；“上耶路撒冷去”保留原文的行程方向和传统朝圣用语。
