  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: zh_hans
  text: 耶稣和他的门徒也受邀参加婚宴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: 受邀
  rationale: καλέω的被动式在参加婚礼这一社交场合中自然表示“被邀请”；“受邀”简洁、庄重，也符合现代汉语习惯。
- source_word: δὲ καὶ
  choice: 也
  rationale: δέ是轻微的连接词，紧接的καί表示增添；汉语用“也”即可自然承接上一节，并表明耶稣及门徒也在受邀者之列。
- source_word: ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: 耶稣和他的门徒
  rationale: καί在这里并列耶稣与他的门徒。“门徒”准确保留μαθητής所包含的学习者关系及福音书中的群体身份。
- source_word: εἰς τὸν γάμον
  choice: 参加婚宴
  rationale: γάμος在本段语境中指婚礼庆典。“婚宴”是自然的现代汉语表达，并能体现受邀参加庆典的场景；“参加”则是汉语中与“受邀”自然搭配的必要表达。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。将希腊语较直译的“耶稣也被邀请，他的门徒也被邀请，到婚礼”整合为符合汉语信息结构的主动式并列主语加被动表达；未增加原文没有的神学含义。
