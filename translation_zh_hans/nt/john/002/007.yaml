base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: zh_hans
  text: 耶稣对他们说：“把这些水缸灌满水。”他们就把水缸灌满了，直到缸口。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中用“说”自然流畅，不必显明时态转换。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 准确表达复数与格所标示的说话对象。
- source_word: Γεμίσατε
  choice: 装满
  rationale: 不定过去时主动命令语气复数，表示直接吩咐；“装满”自然表达动作及其预期结果。
- source_word: τὰς ὑδρίας
  choice: 这些水缸
  rationale: ὑδρία指盛水的缸或罐；结合上文已提及的器皿，定冠词自然译为“这些”。本节不重复添加“石制”，因为原文此处没有该词。
- source_word: ὕδατος
  choice: 水
  rationale: γεμίζω之后的属格表示所盛装的内容；汉语“把水缸装满水”清楚自然。
- source_word: ἐγέμισαν αὐτάς
  choice: 他们就装满了
  rationale: 不定过去时陈述其完成了所吩咐的动作；“就”自然体现紧接命令而行动，但不额外引入神学含义。
- source_word: ἕως ἄνω
  choice: 一直装到缸口
  rationale: 字面意为“直到上面／顶部”，强调水缸被彻底装满；“到缸口”在此语境中具体、自然，又不采用可能显得口语化的“满到顶”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文简洁直接的命令与执行结构；不补入本节未重复出现的“石制”，也不把仆人的身份明说出来，因为本节仅用“他们”。
