  rationale: 修订仅改善现代汉语中盛水动作的搭配和末句的句法清晰度。“灌满水”对应γεμίζω加内容属格；“灌满了，直到缸口”保留完成动作及ἕως ἄνω所表达的达到器皿上端之意。
