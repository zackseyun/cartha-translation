  naturalness: 建议将动词改为“灌满／灌到”，这在水注入缸中的语境更自然；补出“水缸”使执行动作清晰。
  terminology: “耶稣”“水缸”“水”均恰当。“这些”可自然承接上文已提及的水缸；本节不应自行补出“石制”或“仆人”。
