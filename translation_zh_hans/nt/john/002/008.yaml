  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: zh_hans
  text: 他对他们说：“现在舀出来，送给宴席总管[a]。”他们就送去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宴席负责人”“宴席主管”。希腊语指负责管理宴席的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 这是叙事中的历史现在时，现代汉语自然地用“说”表达，不必刻意标出时态。
- source_word: Ἀντλήσατε
  choice: 舀出来
  rationale: 该动词指从容器中汲取液体；结合上文水缸的语境，“舀出来”准确且符合现代汉语习惯。
- source_word: νῦν
  choice: 现在
  rationale: 保留命令的即时性。
- source_word: φέρετε
  choice: 送给
  rationale: 这里表示把所舀出的液体拿到宴席负责人那里；“送给”在汉语中自然，并清楚表达动作方向。
- source_word: ἀρχιτρικλίνῳ
  choice: 宴席总管
  rationale: 该词指负责管理宴席的人。“宴席总管”既简明庄重，也避免把其职责过度限定为现代餐厅领班或司仪。
- source_word: οἱ δὲ ἤνεγκαν
  choice: 他们就送去了
  rationale: δέ在此为轻微承接；“就”自然表现他们随即照办。原文未明说宾语，汉语也可依上下文省略，以免不必要地补出所送之物。
