source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: zh_hans
  text: 他用绳子做了一条鞭子后，把他们全都赶出圣殿院落[a]，羊和牛也在内[b]；又倒出兑换钱币的人的钱币，推翻他们的桌子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿院落”所译的希腊文指整个圣殿建筑群或院落，不是专指内殿。
    reason: cultural_note
  - marker: b
    text: 原文先说“把他们全都赶出”，再提“羊和牛”；经文没有明确说鞭子曾用在人身上。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας φραγέλλιον ἐκ σχοινίων
  choice: 用绳索做成一条鞭子
  rationale: 以自然的现代汉语表达先做鞭子、继而采取行动的顺序；“绳索”保留材料含义，“鞭子”准确而通俗。
- source_word: πάντας ἐξέβαλεν
  choice: 把他们全都赶出
  rationale: “赶出”体现ἐκβάλλω在此处强力逐出的动作；“他们全都”保留πάντας的概括性，不在正文中限定其只指人或只指牲畜。
- source_word: τοῦ ἱεροῦ
  choice: 殿院
  rationale: ἱερόν指整个圣殿区域或院落，并非特指内殿；“殿院”简洁地区别于内层圣所。
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: 羊和牛也在内
  rationale: 保留原文在“全都”之后补充羊和牛的结构；“牛”是现代汉语中对βόας自然且范围合宜的表达。
- source_word: κολλυβιστῶν
  choice: 兑换银钱之人
  rationale: 准确表达在圣殿区域从事钱币兑换的人；措辞庄重且易懂。
- source_word: ἐξέχεεν τὰ κέρματα
  choice: 倒出……钱币
  rationale: “倒出”保留ἐκχέω的具体动作意象，“钱币”对应κέρματα，避免把动作解释性地改成“撒落”。
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: 推翻他们的桌子
  rationale: “推翻”清楚表达桌子被掀翻的动作；依汉语语境补出“他们的”，使所属关系自然明确。
theological_decisions:
- issue: 耶稣逐出对象的范围以及鞭子的使用对象
  choice: 正文译作“把他们全都赶出……羊和牛也在内”，但不说明鞭子打在人身上。
  alternative: 可理解为逐出所有相关的人和牲畜，也可把后面的羊和牛看作“全都”所着重指明的对象。
  rationale: 希腊文以πάντας概括逐出对象，随后提到羊和牛；句法没有明确说明鞭子实际用在谁身上。译文及脚注保留这一张力，避免作过度断定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿院”兼顾准确与简洁；分号保留原句两个连续动作组之间的层次。
