  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: zh_hans
  text: 他在圣殿[a]里发现卖牛、羊和鸽子的人，以及坐着的换钱者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“圣殿”的希腊词是ἱερόν，指整个圣殿建筑群或院区，并非专指内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: 看见
  rationale: 此处指耶稣进入圣殿区域后所见的情景。译作“看见”符合现代汉语叙事习惯；“发现”虽更贴近常见词义，但在此容易带出此前未知或刻意寻找的意味。
- source_word: ἱερῷ
  choice: 圣殿
  rationale: ἱερόν在这里指整个圣殿建筑群或院区，并非专指内殿；正文采用通行且自然的“圣殿”，由脚注说明空间范围。
- source_word: πωλοῦντας
  choice: 卖……的人
  rationale: 以汉语关系结构表达名词化的现在分词，并保留正在从事售卖活动的场景。
- source_word: βόας
  choice: 牛
  rationale: βοῦς在此泛指作为祭牲买卖的牛类；汉语“牛”自然准确，也避免“公牛”对性别作过度限定。
- source_word: πρόβατα
  choice: 羊
  rationale: 在祭牲语境中，πρόβατα通常指羊；“羊”是清楚自然的现代汉语对应词。
- source_word: περιστερὰς
  choice: 鸽子
  rationale: περιστερά可指鸽类；“鸽子”在现代汉语中自然易懂，又不强行区分斑鸠或家鸽。
- source_word: κερματιστὰς
  choice: 兑换银钱的人
  rationale: 该词指兑换钱币者。“兑换银钱的人”既准确表达其职业活动，也比单说“兑换钱币者”更符合普通读者的语言习惯。
- source_word: καθημένους
  choice: 坐着的
  rationale: 保留分词所描写的姿态和他们设点经营的现场感；原文没有与“那里”对应的独立词，因此不额外加入“在那里”。
theological_decisions:
- issue: ἱερόν所指的耶路撒冷圣殿范围
  choice: 正文译作“圣殿”，理解为圣殿建筑群或院区，并以脚注澄清。
  alternative: 圣殿院区；圣殿范围；内殿
  rationale: 出售祭牲和兑换银钱的场景表明这里不是专指内殿。保留“圣殿”可维持通顺和传统辨识度，脚注则避免读者误解其空间范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式尽量贴近原文两个并列宾语群，同时避免生硬直译；脚注标记置于相关场景描述之后。
