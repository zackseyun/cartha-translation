  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们拆毁这殿，我三日内要使它立起来。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拆毁”也可译作“拆掉”。原文这里译作“使它立起来”的动词，也可按圣殿的表层语境译作“重建”；该词同时可以带有复活的意味。约翰随后说明，耶稣所说的殿是他的身体（2:21）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: 耶稣回答他们说
  rationale: 保留原文“回答……说”的叙事结构；这种表达在现代汉语中庄重自然，也不必省略其中任一动词。
- source_word: Λύσατε
  choice: 拆毁
  rationale: 此处 λύω 指拆除、毁坏圣殿；“拆毁”既符合建筑语境，也比笼统的“毁灭”更自然。
- source_word: τὸν ναὸν τοῦτον
  choice: 这殿
  rationale: ναός 在这里指圣殿或圣所；“这殿”简洁自然，并保留指示词所带出的现场感和后文才揭示的双重指向。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三天之内
  rationale: 准确表达 ἐν 加时间范围的含义，同时不对三天的具体计算方式作额外限定。
- source_word: ἐγερῶ αὐτόν
  choice: 我要把它兴起
  rationale: ἐγείρω 可用于使建筑立起，也具有使人复起、复活的意味；“兴起”保留这种语义张力，避免用“重建”把意思局限在建筑层面。
theological_decisions:
- issue: 是否在本节明说“这殿”就是耶稣的身体
  choice: 正文只译作“这殿”
  alternative: 这殿，也就是我的身体
  rationale: 本节的话有意保持含蓄，约翰到2:21才说明所指；译文不应提前消除叙事悬念和神学张力。
- issue: ἐγερῶ 应采用建筑语言还是兼有复活意味的语言
  choice: 译作“我要把它兴起”
  alternative: 我要重建它
  rationale: “重建”虽符合听众对圣殿的表层理解，却会削弱后文所揭示的复活意味；“兴起”能够兼顾两层含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这殿”比“这座圣殿”更凝练，并维持耶稣话语的含蓄；“兴起”略具经文语体色彩，但普通读者可懂，且有助于保存原文在建筑与复活之间的双关。
