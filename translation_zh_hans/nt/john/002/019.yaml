  rationale: 仅调整不自然的汉语动宾搭配，并相应更新脚注措辞。“使它立起来”直接体现ἐγείρω的“使……起来／竖立”含义，不把谜语式的话语化约为单纯建筑重建，也不在正文预先解释其身体与复活的指向。
