base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: zh_hans
  text: 耶稣对她说：“这事跟我和你有什么相干？[a]妇人，[b]我的时刻还没有到。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“我与你有什么相干？”这是表示当事双方在关切或立场上有距离的惯用语，不一定含有敌意。
    reason: lexical_alternative
  - marker: b
    text: “妇人”在当时是正常而可表示尊重的称呼，并不一定粗鲁；现代汉语读来可能显得生硬。
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语的“说”本身不标明时态，既自然，也保留其叙事功能。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: 这事跟我和你有什么关系呢
  rationale: 这是一个表示彼此关切或立场有所距离的惯用语，并非单纯询问彼此关系。译文采用自然现代汉语，同时避免把语气强化成敌意或断绝关系。
- source_word: γύναι
  choice: 妇人
  rationale: 该呼格直译为“妇人”。在当时可作正常且尊重的称呼，并不必然无礼；译作“亲爱的母亲”会加入原文没有明说的亲昵，译作“女士”则容易带入现代社交语感，因此保留较直译的表达并加注说明。
- source_word: οὔπω
  choice: 还没有
  rationale: 准确表达截至当时相关时间尚未来到，符合现代汉语习惯。
- source_word: ἥκει
  choice: 到
  rationale: 该动词表示来到或已经临到；与“时刻”搭配时，“到”简洁自然。
- source_word: ἡ ὥρα μου
  choice: 我的时刻
  rationale: “时刻”既贴近ὥρα，又能保留《约翰福音》中这一用语所承载的主题意义，而不把它泛化为普通的“时间”，也不在正文中过度解释其所指。
theological_decisions:
- issue: 耶稣对母亲说话的语气和力度
  choice: 保留尊重中带有距离的回应，不译成侮辱
  alternative: 译成严厉斥责，或译成明显亲昵的称呼
  rationale: Τί ἐμοὶ καὶ σοί表示关切、立场或行动上的距离，而γύναι在当时可为正常称呼。译文保留这种张力，不把耶稣的语气处理得过分严厉或过分温情。
- issue: “我的时刻”的约翰神学意涵
  choice: 保留“我的时刻”这一主题性表达，不在正文中限定其范围
  alternative: 只理解为行这个神迹的当下时机，或改成不带主题意味的一般“时间”
  rationale: 《约翰福音》中的“时刻”常与耶稣使命、受难及得荣耀相联系，但本节没有把全部内涵明说出来；直译能让读者看见这种呼应，同时保留具体所指的解释空间。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文按希腊文语序先呈现表示距离的问句，再保留“妇人”这一称呼；两个脚注分别说明惯用语的语力和称呼的文化语感。“我的时刻”保留约翰著作中的主题呼应。
