source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: zh_hans
  text: 他也不需要任何人为人的事[a]作见证，因为他自己知道人里面有什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在原文中是泛指的单数，可指一个人，也可泛指人类；后一句的“人”同样如此。
    reason: 说明希腊语单数ἄνθρωπος的泛指用法，并保留两处措辞的呼应。
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: 不需要
  rationale: 希腊语习语意为“有需要”；与否定词连用时，现代汉语自然译作“不需要”，准确保留原意。
- source_word: ἵνα τις μαρτυρήσῃ
  choice: 任何人……作见证
  rationale: μαρτυρέω具有“作见证、证明”的含义；“作见证”保留其见证语义，也符合约翰福音的用词风格。τις在否定语境中自然译为“任何人”。
- source_word: περὶ τοῦ ἀνθρώπου
  choice: 为人
  rationale: ἄνθρωπος是带冠词的单数，在此具有泛指意义，可涵盖个体之人和人类。译作“人”既保留单数形式，也不限定性别；“为人作见证”是自然汉语表达。
- source_word: αὐτὸς γὰρ
  choice: 因为他自己
  rationale: “他自己”保留αὐτός的强调，突出耶稣无需外来见证，亲自便知道；γάρ按其解释作用译为“因为”。
- source_word: ἐγίνωσκεν
  choice: 知道
  rationale: 未完成时在此表达持续或一贯的认识；汉语“知道”自然地表达这种状态，无需生硬标出持续体。
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: 人里面有什么
  rationale: 这一表达保留原文宽泛的内在指向，并与前面的“人”相呼应；不把所知内容限定为思想、品格或人性。
theological_decisions:
- issue: 耶稣对人的认识所涵盖的范围
  choice: 直译为“他自己知道人里面有什么”，保留对个体之人和人类普遍状况均可适用的宽度。
  alternative: “他知道每个人心里所想的”或“他知道人性如何”
  rationale: 原文单数ἄνθρωπος具有代表性或泛指性，且“里面有什么”故意保持宽泛。若译成“每个人心里所想的”，会将范围收窄为思想；若译成“人性”，又会偏向一般性概括。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不需要任何人……作见证”自然清晰；两处“人”保留原文重复及代表性单数。“人里面有什么”有意不具体化，以保存原文的开放性和神学张力。
