  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: zh_hans
  text: 第三天，在加利利的迦拿有一场婚宴[a]，耶稣的母亲也在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婚礼”。希腊语γάμος既可指结婚礼仪，也可指婚庆筵席。
    reason: 保留原词在“婚礼事件”与“婚庆筵席”之间的语义范围。
lexical_decisions:
- source_word: Καὶ
  choice: 第三天（不单独译出句首连接词）
  rationale: 句首καί承接前文叙事；现代汉语在时间语开头时无需机械译作“并且”，省去更自然，也不改变其承接功能。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 第三天
  rationale: 忠实保留明确的时间标记，同时不加入“后来”等原文没有的说明，也不在译文中赋予象征意义。
- source_word: γάμος
  choice: 婚宴
  rationale: γάμος可指婚礼、婚姻或婚庆筵席；本段叙事情境尤其涉及宴席。“婚宴”自然贴切，并以脚注保留较宽泛的译法。
- source_word: ἐγένετο
  choice: 有一场
  rationale: 这里的γίνομαι用于引入发生的事件；汉语说“有一场婚宴”简洁自然，比“发生了一场婚宴”更符合惯用表达。
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: 在加利利的迦拿
  rationale: 以自然汉语表达地点所属关系，同时保留“迦拿”与“加利利”两个地名。
- source_word: καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ
  choice: 耶稣的母亲也在那里
  rationale: 第二个καί在这里自然译作“也”；ἦν提供背景状态，直译为“在那里”，不扩展成“受邀出席”等原文未说明的内容。
theological_decisions:
- issue: “第三天”的叙事与象征意义
  choice: 作为时间标记直译为“第三天”
  alternative: 在译文中明示它预表或暗示复活
  rationale: 该短语在本节直接承担时间定位功能。约翰叙事可能让读者联想到更深主题，但译文应保留这种潜在张力，不把某种神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有一场婚宴”符合当代普通话习惯；“耶稣的母亲”贴近希腊语所属结构，并延续本节含蓄的叙述方式。
