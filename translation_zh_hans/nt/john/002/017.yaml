  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: zh_hans
  text: 他的门徒想起经上写着：“我为你的殿所发的热心，必吞噬我。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些诗篇文本传统作“已经吞噬我”；约翰此处的希腊文作“必吞噬我”。
    reason: 说明相关文本传统的另一种时态措辞，同时明确本节希腊文所采用的将来时。
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: 想起
  rationale: 不定过去时被动形式在此作异相动词使用；“想起”自然、直接，符合门徒忆起经文的语境。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: “门徒”是 μαθητής 在新约语境中的标准译法，兼有跟随者和受教者之意。
- source_word: γεγραμμένον ἐστίν
  choice: 经上写着
  rationale: 这是引述圣经的固定表达；“经上写着”既传达完成时所含的持续有效性，也符合现代汉语经文语体。
- source_word: Ὁ ζῆλος τοῦ οἴκου σου
  choice: 我为你的殿心里火热
  rationale: ζῆλος 表示强烈的热忱；将属格结构自然地译为“为你的殿心里火热”。οἶκος 字面为“房屋、家”，但此处在诗篇引文和约翰叙事中明确指上帝的殿，“殿”比“家”更能让普通读者准确理解，同时未引入额外解释。
- source_word: καταφάγεταί με
  choice: 这热忱必吞噬我
  rationale: 保留将来时以及动词“吞食、吞噬”的强烈意象；补出“这热忱”作为汉语主语，使所指清楚。
- source_word: με
  choice: 我
  rationale: 保留诗篇引文中第一人称受事者，不将其解释性改写为“他”或直接替换为耶稣。
theological_decisions:
- issue: 诗篇引文中的动词时态及其对耶稣的应用
  choice: 保留将来指向：“必吞噬我”
  alternative: “已经吞噬我”或“吞噬了我”
  rationale: 约翰此处的希腊文 καταφάγεταί 是将来时。译文依从约翰现有措辞，不按诗篇某些文本传统的过去时含义加以协调，从而保留其前瞻性及神学张力。
- issue: ζῆλος 的含义
  choice: 译作“心里火热”，并以“这热忱”承接
  alternative: “嫉妒”“热心”
  rationale: 此处指对上帝之殿强烈、炽热的委身。“心里火热”在现代汉语中自然且有力度；“嫉妒”容易误导，“热心”单独使用则力度偏弱。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“经上写着”保留圣经引文公式；“心里火热”使 ζῆλος 的强烈情感自然可懂，“吞噬”则保留原文的鲜明隐喻。脚注标记 [a] 已置于正文相应位置。
