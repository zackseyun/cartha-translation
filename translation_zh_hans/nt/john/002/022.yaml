  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: zh_hans
  text: 因此，耶稣从死人中被使复活以后，他的门徒想起他曾经说过这话，就相信了圣经和耶稣所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε οὖν
  choice: 所以，……以后
  rationale: ὅτε引出时间关系，οὖν承接上文并带有推论或叙事推进作用；此表达在现代汉语中自然地保留两者。
- source_word: ἠγέρθη
  choice: 被复活
  rationale: 该动词为被动语态，在复活语境中表示从死亡中被兴起；“被复活”保留原文语态，且不把施事者明说出来。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 原文νεκρῶν为复数，字面指从死者当中；此译法既符合汉语表达，也保留该结构。
- source_word: ἐμνήσθησαν
  choice: 想起了
  rationale: 表示门徒后来回想起先前所听见的话；“想起了”自然传达不定过去时所呈现的事件。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 以自然的汉语所有关系表达原文。
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: 他曾说过这话
  rationale: 未完成时指向耶稣先前的言说；上下文未必要求反复或持续之意，“曾说过”自然表达回顾关系，同时脚注保留体貌上的其他可能。
- source_word: ἐπίστευσαν
  choice: 相信了
  rationale: πιστεύω后接与格宾语，此处表示接受圣经及耶稣之言为可信；“相信”最少添加解释。
- source_word: τῇ γραφῇ
  choice: 圣经
  rationale: γραφή单数在此指具有权威的经文或圣书；“圣经”符合现代中文基督教语境，同时保持单数集合概念。
- source_word: τῷ λόγῳ
  choice: 话
  rationale: λόγος在此具体指耶稣先前所说的言语；中文“话”比“道”或“信息”更贴合直接语境，并避免与约翰福音1章的专门用法不必要地混同。
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: 耶稣所说的
  rationale: 关系从句修饰λόγος；“耶稣所说的话”准确而自然地表达先前的言说。
theological_decisions:
- issue: 复活动词的被动语态
  choice: 从死人中被复活
  alternative: 从死人中复活
  rationale: 原文ἠγέρθη是被动形式；正文保留被动语态，不明说施事者，也不否定其他经文采用主动或不及物表达。
- issue: πιστεύω与与格宾语的表达
  choice: 相信了圣经和耶稣所说的话
  alternative: 信靠圣经和耶稣所说的话
  rationale: 此处重点是门徒相信圣经及耶稣之言的真实性；“相信”比“信靠”少一层关系性解释，较忠实地保留原文范围。
- issue: γραφή单数的所指
  choice: 圣经
  alternative: 那段经文
  rationale: 原文没有明确指出某一具体经句；译作“那段经文”会缩窄所指，因此正文保留较宽泛的“圣经”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“所以”承接前文，“以后”清楚标示时间关系；“被复活”虽不如“复活”常见，却有意保留希腊文被动语态。正文避免使用较具特定神学色彩的“道”，因为此处λόγος明确指耶稣先前说出的那句话。
