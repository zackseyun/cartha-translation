  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: zh_hans
  text: 耶稣在加利利的迦拿行了这件事；这是他所行神迹的开端。他显明了自己的荣耀，他的门徒就信了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: 这是……所行的
  rationale: ταύτην回指刚才叙述的变水为酒之事；不擅自补入“奇事”或“神迹”。将ἐποίησεν译为“所行的”，符合现代汉语叙述习惯，也保留ποιέω宽泛的“做、行”之义。
- source_word: ἀρχὴν τῶν σημείων
  choice: 神迹的开端
  rationale: ἀρχή首先是“开端、起头”，这里表明迦拿之事开启了耶稣所行的一系列σημεῖα；正文保留“开端”，另以脚注说明可译作“第一个神迹”。
- source_word: σημείων
  choice: 神迹
  rationale: σημεῖον在约翰福音中既指超常作为，也指向借此显明的身份与荣耀。现代中文圣经语境中的“神迹”自然庄重；其“指示性”由紧接着的“显明了自己的荣耀”清楚呈现，避免使用容易被理解为普通符号的“记号”。
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: 在加利利的迦拿
  rationale: 自然地表达地点及所属区域，并贴近希腊文的地名结构。
- source_word: ἐφανέρωσεν
  choice: 显明了
  rationale: φανερόω指使某事显露、可知；“显明”既保留揭示的含义，也与“荣耀”搭配自然庄重。
- source_word: τὴν δόξαν αὐτοῦ
  choice: 自己的荣耀
  rationale: δόξα是约翰福音的重要术语，译作“荣耀”可保留其尊荣、威荣及神圣显现的丰富含义；“自己的”明确反身所指而不改变意义。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 信了他
  rationale: πιστεύω εἰς表达指向耶稣的信靠。“信了他”简洁自然，并保留叙事中的起始或确认意味；不增译为特定宗派色彩更强的表达。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 这是该名词短语自然、准确的现代汉语表达。
theological_decisions:
- issue: 约翰福音中σημεῖον的术语意义
  choice: 译作“神迹”并在语境中保留其显明功能。
  alternative: 记号；奇迹
  rationale: “奇迹”偏重超自然能力，容易削弱其指向耶稣身份和荣耀的作用；“记号”虽较贴近字面，却在现代汉语中容易被理解为普通标识。“神迹”兼顾可读性、庄重感和约翰叙事中的启示功能。
- issue: ἀρχὴν τῶν σημείων的句法与含义
  choice: 译作“神迹的开端”。
  alternative: 第一个神迹
  rationale: “开端”直接反映ἀρχή，并让读者听见这件事开启后续一系列神迹的意味；“第一个”同样可能，故列入脚注，不把原文的表达范围收窄为单纯的序数。
- issue: 门徒“信了他”的叙事张力
  choice: 不增补“从此”“更加”或“坚定地”。
  alternative: 门徒就更加信他了；门徒从此信了他
  rationale: 原文只说ἐπίστευσαν εἰς αὐτόν。鉴于门徒在此前已经跟随耶稣，信心在此究竟是开始、加深还是得到确认，文本保留一定张力，译文不替作者作出限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。正文以两个句子承载原文连续并列结构，避免汉语长句拖沓；用“神迹的开端”保留源文措辞和约翰福音的系列性，并以脚注交代自然可行的序数译法。
