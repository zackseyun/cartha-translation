  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: zh_hans
  text: 耶稣在耶路撒冷，正逢逾越节节期的时候，许多人看见他所行的神迹[b]，就信了他的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信了他的名”也可译为“信了他”；“名”在这里指他所显明的身份。
    reason: lexical_alternative
  - marker: b
    text: “神迹”原文也有“记号”的意思；约翰常用这个词表示那些指向耶稣身份的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: 耶稣在耶路撒冷……的时候
  rationale: ὡς引出时间背景，δέ仅作轻微承接；中文不必另译连接词。原文主语由上下文确定为耶稣，中文明说姓名可避免代词起句含混。
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: 过逾越节、参加节期
  rationale: 两个ἐν短语共同交代节庆背景；πάσχα指逾越节，ἑορτή进一步说明当时正值节期。采用并列式中文，避免生硬重复“在”。
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: 信了他的名
  rationale: 保留约翰独特的“信入/信他的名”表达及其指向耶稣所显明身份的含义，不提前把它简化为“信了他”，也不根据下文贬低这种信。
- source_word: θεωροῦντες
  choice: 因看见
  rationale: 分词表示他们相信时正在观看这些神迹，并在语境中带有明显的缘由意味；现代汉语以“因看见”自然表达两者关系。
- source_word: τὰ σημεῖα
  choice: 神迹
  rationale: σημεῖον本义为具有指向作用的“记号”；在约翰福音中指显明耶稣身份的超常作为。正文采用中文圣经语体中自然的“神迹”，脚注说明其“记号”内涵。
- source_word: ἃ ἐποίει
  choice: 他所行的
  rationale: ἐποίει为未完成过去时，描写耶稣当时持续施行这些神迹；“所行的”在中文中简洁自然，并与“神迹”惯常搭配。
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ所描述之信的性质
  choice: 直译为“信了他的名”，不在本节中加上“表面上”或“初步”等限定
  alternative: 译作“因神迹而对他产生了肤浅的信心”
  rationale: 本节明确陈述许多人信了；下一节才以耶稣不把自己交托给他们形成张力。译文应保留这种叙事和神学张力，而不预先替读者作出判断。
- issue: σημεῖα的神学指向
  choice: 正文译“神迹”，脚注说明其也是指向耶稣身份的“记号”
  alternative: 正文仅译“奇迹”或仅译“记号”
  rationale: “神迹”能自然表达这些作为的超常性质，但原词在约翰福音中又强调其启示功能；以脚注保留这一层含义，避免正文冗长。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。以“耶稣”明示跨节主语；正文保留“信了他的名”这一约翰式表达。两个脚注标记均置于相关词语之后：a对应“他的名”，b对应“神迹”。
