  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: zh_hans
  text: 但耶稣自己并不把自己交托给他们[a]，因为他知道所有人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在上一节和本节使用同一个动词：许多人“信”耶稣，耶稣却不把自己“交托”给他们。
    reason: 说明正文无法完全复现的原文词语呼应。
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: 但耶稣自己却
  rationale: 保留主格 αὐτός 的强调作用，并用“但……却”体现 δέ 所引出的转折，与上一节许多人信耶稣形成对照。
- source_word: οὐκ ἐπίστευεν
  choice: 不把……交托
  rationale: πιστεύω 在这里以反身代词作直接宾语、以与格表示对象，意思是把自己托付或交托给某人。未完成时态在此表达持续的态度；现代汉语无需另加进行体标记。
- source_word: αὑτὸν αὐτοῖς
  choice: 把自己交托给他们
  rationale: “自己”保留反身含义，“给他们”明确交托的对象，也自然表达个人的自我委身。
- source_word: διὰ τὸ
  choice: 因为
  rationale: διά 加冠词化不定式在这里表示原因，“因为”是自然、清楚的现代汉语表达。
- source_word: αὐτὸν γινώσκειν
  choice: 他知道
  rationale: 将希腊语不定式结构自然转换为汉语原因从句；γινώσκω 在此指认识、了解。
- source_word: πάντας
  choice: 所有人
  rationale: 阳性复数在语境中泛指人。“所有人”既不局限于前述群体，也与下一节对“人”的论述衔接。
theological_decisions:
- issue: 如何体现第23—24节 πιστεύω 的重复和文字呼应
  choice: 正文按各自语境分别译为上一节的“信”和本节的“交托”，并以脚注说明原文使用同一个动词。
  alternative: 两节都使用“信”或“信任”，以形式上的重复换取较生硬或可能误解的表达。
  rationale: 这里有刻意的反差：许多人“信”耶稣，耶稣却不把自己“交托”给他们。汉语难以用同一词语同时自然表达两种用法，因此正文优先准确传意，脚注保留原文的文字呼应。
- issue: πάντας 的范围
  choice: 译为“所有人”，保持概括性，不限定为前述相信的人。
  alternative: 译为“他们所有人”或“众人”，将范围更紧密地限制在现场群体。
  rationale: 原文 πάντας 没有明示限定语，下一节又转向对“人”的普遍认识；“所有人”保留其广泛范围，同时不额外扩展为系统性的教义陈述。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“交托”虽略带书面色彩，但能自然表达将自己托付给人的含义，并与“信”形成可理解的对照。
