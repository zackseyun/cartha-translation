  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: zh_hans
  text: 于是，犹太人回答他说[a]：“你做这些事，给我们看什么神迹呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太领袖”，或“犹太地区的人”。在《约翰福音》中，“犹太人”有时按上下文较狭义地指某个代表群体，尤其是犹太地区的权威人士。
    reason: 说明οἱ Ἰουδαῖοι在约翰语境中可能具有较狭义的所指，避免读者误解为全体犹太人。
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: 于是……回应
  rationale: οὖν承接上文并带出由圣殿事件引起的反应，译为“于是”；ἀπεκρίθησαν表示作出回应，译为“回应”，保留对话的响应性质。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按希腊文直译，不在正文中擅自限定为领袖或犹太地区的人；其在《约翰福音》中的具体所指以脚注说明。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 直接表达说话对象；与“回应”合用，保留原文ἀπεκρίθησαν与εἶπαν并列的表达。
- source_word: Τί σημεῖον
  choice: 什么神迹
  rationale: σημεῖον在《约翰福音》中通常指具有指示和印证作用的超常作为；“神迹”是现代中文圣经语境中自然且易懂的对应语。
- source_word: δεικνύεις ἡμῖν
  choice: 能显……给我们看
  rationale: δεικνύεις要求对方展示可见的凭证；中文用“显……给我们看”自然传达这一挑战。“能”在疑问句中表达所要求的能力或凭据，并非改动动词时态。
- source_word: ὅτι ταῦτα ποιεῖς
  choice: 你做这些事
  rationale: ὅτι在此连接他们索要神迹与耶稣所做之事，可理解为依据或缘由。中文采用并置结构，避免过度锁定为“因为”或“既然”，并保留原文关系上的张力。
theological_decisions:
- issue: “犹太人”（οἱ Ἰουδαῖοι）的所指
  choice: 正文保留“犹太人”
  alternative: 犹太领袖；犹太地区的人
  rationale: 本节希腊文本身没有明确加上“领袖”等限制语。虽然上下文可能指一个代表群体，尤其是犹太地区的权威人士，但应在脚注中提示，而不把解释直接写入正文。
- issue: 所求σημεῖον的性质
  choice: 译为“神迹”
  alternative: 记号；凭证
  rationale: 这里所求的不只是抽象证明，而是可展示、能印证耶稣行事权柄的标志性作为。“神迹”符合约翰叙事中的用语功能；同时不进一步说明其必然形式，以免加入原文未说的内容。
- issue: ὅτι与前句的逻辑关系
  choice: 用中文并置结构表达：“你做这些事，能显……”
  alternative: “既然你做这些事”；“你凭什么做这些事”
  rationale: ὅτι可引出索要凭证的依据，但其表达可保留一定开放性。并置结构既让中文读者看出两者相关，也不把关系完全解释成因果或改写成“凭什么”。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语体。“回应他说”略保留原文“回答并说”的双重结构，但避免生硬直译为“回答并对他说”。问句用“给我们看呢”体现当面对质和索取凭据的语气。
