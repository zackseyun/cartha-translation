base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: zh_hans
  text: 酒用完了[a]，耶稣的母亲对他说[b]：“他们没有酒了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“酒缺乏的时候。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文这里使用叙事性现在时，直译为“说”；汉语的“说”本身不标明时态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: 酒用完了
  rationale: 这是属格独立结构，以不定过去时分词交代主句之前出现的情形。译作“酒用完了”符合现代汉语习惯，也准确表达酒已经短缺、告罄；脚注保留较直译的可能。
- source_word: λέγει
  choice: 对他说
  rationale: 原文用叙事性现在时，使叙述更鲜活。现代汉语动词本身不标明过去或现在，因此“说”既自然，又不必把原文明确改成过去时。
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: 耶稣的母亲
  rationale: 贴近原文措辞，也保留约翰在本段中称呼她的方式。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: πρὸς αὐτόν指出说话的对象；汉语将其与“说”合译为“对他说”最为自然。
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: 他们没有酒了
  rationale: 复数动词的主语在原文中没有明说。译作“他们”保留其未明确的所指，不擅自限定为婚宴主人或某一群体；句末“了”自然表达当前出现的无酒状态。
- source_word: οἶνος
  choice: 酒
  rationale: 此处是普通的“酒”，上下文没有理由弱化或改写这一词义。
theological_decisions:
- issue: 约翰叙事中的历史现在时
  choice: 采用不标时态的汉语“对他说”，并以脚注说明希腊文为现在时
  alternative: 为表现过去叙事而译作“对他说了”或明确说明“当时说”
  rationale: 汉语动词不按形态区分过去时与现在时，正文无需人为添加过去时标记；脚注则保留原文叙事性现在时的语篇特色。
- issue: “他们没有酒了”中隐含复数主语的所指
  choice: 保留为“他们”
  alternative: 明确译作“婚宴主人没有酒了”或“婚宴的人没有酒了”
  rationale: 原文没有明说复数主语指谁。保留“他们”可维持这一真实的语境性含混，避免加入原文没有指定的对象。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“酒用完了”比生硬的“酒缺乏”更符合普通读者的表达习惯；“耶稣的母亲”保留原文称谓；正文简洁直接，并借脚注呈现形式层面的细节。
