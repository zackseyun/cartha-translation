base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: zh_hans
  text: 那里摆着六口石制水缸，供犹太人行洁净礼仪时使用[a]；每口能盛两三量水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“按着犹太人的洁净礼仪摆放”。“洁净”在这里指礼仪性的洗濯或洁净惯例。
    reason: lexical_alternative
  - marker: b
    text: “量”（希腊文metretēs）是古代液量单位，约合35至40升；因此每口水缸约可盛70至120升。
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ ... κείμεναι
  choice: 那里摆着……
  rationale: δέ在此是轻微的叙事连接词，不必另译为“现在”；ἐκεῖ译为“那里”，κείμεναι结合水缸的场景译为“摆着”，自然表达器皿被安置在该处。
- source_word: λίθιναι ὑδρίαι
  choice: 石水缸
  rationale: λίθιναι说明材质为石头，ὑδρίαι指盛水的缸或罐。“石水缸”既保留材质和用途，也符合现代汉语习惯。
- source_word: ἓξ
  choice: 六口
  rationale: 准确表达数目，并以“口”作为大型缸类器皿的自然量词。
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: 供犹太人的洁净礼俗使用
  rationale: κατά在这里可表达与惯例相符或相应的用途；καθαρισμός在本语境中指礼仪性的洁净。“洁净礼俗”传达宗教礼仪背景，又不加入具体经文未明说的程序。
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: 每口能盛两三“量”
  rationale: χωροῦσαι表示容量，ἀνά具有逐一分配的意思，故译出“每口”。μετρητής是古代液量单位，正文保留为“量”，并用脚注说明其大致现代容量，避免在正文中制造不必要的精确度。
theological_decisions:
- issue: τῶν Ἰουδαίων在约翰叙事中的含义
  choice: 犹太人的
  alternative: 犹太地人的
  rationale: 此处所说的是群体所遵行的宗教洁净礼俗，而非强调地域身份，因此“犹太人的”最符合语境，也不赋予该词额外的负面色彩。
- issue: κατὰ τὸν καθαρισμόν所表达的关系
  choice: 供……洁净礼俗使用
  alternative: 按着……洁净礼俗设置
  rationale: 该短语可侧重用途，也可侧重符合礼俗。正文采用在场景中较自然的用途表达，脚注保留“按着”的可能译法，以免掩盖介词关系的细微弹性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摆着”和“每口能盛”符合普通话习惯；以引号标示“量”为古代专门计量单位，并由脚注解释。
