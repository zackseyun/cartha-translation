base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: zh_hans
  text: 宴席总管对新郎说：“人人都是先摆上好酒，等客人喝醉了，才摆上次等的酒；你倒把好酒留到现在。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喝醉了”也可译作“醉了”。希腊语动词通常明确指醉酒；有些译本译得较含蓄，如“喝足了”或“喝了很多以后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: 他对那人说
  rationale: λέγει是叙事中的历史现在时，现代汉语通常按叙事语境译作“说”；“那人”自然指向前文的耶稣，又避免汉语代词连续出现时指代含混。
- source_word: Πᾶς ἄνθρωπος
  choice: 人人总是
  rationale: 该单数泛指结构表示普遍的人情惯例，并不限于男性；“人人总是”在引述一般做法时自然且准确。
- source_word: πρῶτον τὸν καλὸν οἶνον τίθησιν
  choice: 先摆上好酒
  rationale: πρῶτον表示次序；τίθησιν在宴席语境中指把酒摆出供客人饮用。“摆上”既贴近“放置”，又符合汉语宴席表达。
- source_word: ὅταν μεθυσθῶσιν
  choice: 等客人都喝醉了
  rationale: μεθύω通常指醉酒，不因伦理或教义顾虑而弱化；补出“客人”使汉语所指清楚，“等……了”自然表达ὅταν加不定过去时虚拟语气所指的一般时序。
- source_word: τὸν ἐλάσσω
  choice: 次等的
  rationale: ἐλάσσω表示质量较低；“酒”由上下文省略，汉语用“次等的”可自然承接，也不误解为数量较少或价格较低。
- source_word: σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι
  choice: 你倒把好酒留到现在
  rationale: σὺ带有对比强调，以“你倒”体现；τετήρηκας的完成时表示一直保留至今所得的结果，“留到现在”准确自然。
theological_decisions:
- issue: 酒宴语境中μεθυσθῶσιν是否应弱化
  choice: 译作“喝醉了”
  alternative: “喝得尽兴了”或“喝了很多以后”
  rationale: 该动词通常明确表示醉酒。这里是宴席总管对社会惯例的描述，并不等于经文认可醉酒；直译可保留原文的现实感和伦理张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“人人总是”传达泛指惯例；“摆上”符合宴席场景；末句用“你倒”凸显原文主语σὺ的对比。脚注标记置于整句引语之后，说明本节最重要且具有伦理张力的词义选择。
