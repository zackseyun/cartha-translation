  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: zh_hans
  text: 尼哥底母回答他，说：“这些事怎么可能发生呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事怎么可能呢？”
    reason: 反映γενέσθαι在此可作较简省的“是／成为”理解，并保留英文POB审校轨迹中的词汇替代译法。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 该动词在对话叙事中通常表示回应；“回答”自然、准确，无须额外发挥。
- source_word: Νικόδημος
  choice: 尼哥德慕
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 保留原文的代词，不把“他”解释性地改成“耶稣”；与前面的“回答”连用，中文自然表达为“回答他说”。
- source_word: Πῶς
  choice: 怎么
  rationale: 引出对方式或可能性的疑问；在直接对话中，“怎么”比“如何”更自然，同时保持庄重。
- source_word: δύναται
  choice: 可能
  rationale: 表达能力或可能性。这里尼哥德慕质疑这些事如何能够发生，“怎么可能”符合现代汉语习惯。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数所指，回指耶稣刚才所讲的各项现实。
- source_word: γενέσθαι
  choice: 发生
  rationale: γίνομαι在这里具有发生、成为现实的事件性含义；“发生”自然地传达这些事如何能够成就，而不把含义压平为单纯的“是”。
theological_decisions:
- issue: 尼哥德慕对重生及耶稣所述现实的疑问应如何表达
  choice: 这些事怎么可能发生呢？
  alternative: 这些事怎么可能成为现实呢？／这些事怎么可能呢？
  rationale: “发生”保留γίνομαι所含的发生、成就之意，也不进一步断定尼哥德慕究竟是在追问机制、质疑可能性，还是两者兼有。
translation_notes:
  register: 采用自然、现代而庄重的叙事语言。“回答他说”略带经文叙事色彩，却仍为普通读者所理解；问句使用“怎么可能发生呢”体现口语中的真实疑问，同时避免过度随意。
