base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: zh_hans
  text: 约翰回答说：“人若没有从天上赐给他的，就连一样东西也不能领受。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: 约翰回答说
  rationale: “回答说”自然保留了原文“回答并说”的叙事公式，同时避免现代汉语中生硬的重复。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处为单数泛指，表示一般意义上的人，并不限定男性；现代汉语“人”准确而自然。
- source_word: Οὐ δύναται…λαμβάνειν
  choice: 不能领受
  rationale: “不能”保留能力或可能性上的否定；“领受”体现所得之物来自赐予，而非主动夺取。
- source_word: οὐδὲ ἓν
  choice: 连一样也
  rationale: 保留原文加强否定的语气，突出连最少的一样也不例外。
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: 若不是……蒙赐
  rationale: “若不是”表达例外条件；“蒙赐”以自然汉语概括完成时被动结构及其受益者关系，表明人是接受者。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 直译原文的来源表达，保留其对神圣来源的含蓄指称，不直接改译为“从上帝”。
theological_decisions:
- issue: 天上赐予这一原则的范围
  choice: 保留陈述的宽泛形式，使其在上下文中适用于职分、影响力和所得的一切，同时不把它扩写成完整的决定论命题。
  alternative: 明确限定为事工职分；或解释为关于一切人类行为的强决定论。
  rationale: 上下文直接涉及约翰与耶稣的事工和地位，但本句措辞本身较为宽泛。译文维持这种张力，不替原文限定或扩张。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙赐”略带经文语体，但仍为普通读者所理解，并能简洁呈现原文的被动受赐关系。
