source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: zh_hans
  text: 娶新娘的是新郎；但新郎的朋友[a]站着听他，因听见新郎的声音，就满心欢喜[b]。所以，我这喜乐已经圆满了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新郎的朋友”也可按其文化角色理解为类似今天的“伴郎”，但希腊文直译是“新郎的朋友”。
    reason: cultural_note
  - marker: b
    text: 直译“以喜乐来喜乐”，是加强语气的表达。
    reason: lexical_alternative
  - marker: c
    text: “圆满了”也可译作“成全了”或“达到了丰满的地步”；此处可指喜乐达到完全或圆满。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: 娶得新娘的
  rationale: 保留“拥有／得着新娘者”的关系含义，并用现代汉语婚礼语境中自然的“娶得”表达；不把新娘解释为教会或上帝的子民。
- source_word: νυμφίος
  choice: 新郎
  rationale: 准确保留婚礼比喻，也是现代汉语对该角色最自然、明确的称呼。
- source_word: φίλος τοῦ νυμφίου
  choice: 新郎的朋友
  rationale: 按希腊文直译为“朋友”，不在正文中缩窄为特定文化角色“伴郎”。
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: 站在那里听着他
  rationale: “站在那里”表达完成时分词所呈现的在场、侍立状态；“听着他”保留代词宾语，不提前补入后文的“声音”。
- source_word: χαρᾷ χαίρει
  choice: 满心欢喜
  rationale: 以自然汉语传达同源名词与动词连用所产生的强烈强调，同时避免生硬的“以喜乐来喜乐”。
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: 因听见新郎的声音
  rationale: διά加宾格表示原因；补出汉语所需的“听见”，使因果关系清楚，并与前面的“听着他”呼应。
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: 所以，我这喜乐
  rationale: “所以”保留推论关系，“我这喜乐”同时体现指示词与带强调意味的所有格。
- source_word: πεπλήρωται
  choice: 如今已经圆满了
  rationale: 以“已经……了”表达完成时的结果状态；“圆满”兼顾达到丰满与完成之意，而不特指预言应验。
theological_decisions:
- issue: 婚礼意象及施洗约翰的自我定位
  choice: 保留新郎、新娘和新郎朋友的完整比喻，不明说各角色所象征的对象。
  alternative: 把“新娘”直接解释为教会或上帝的子民，或把“新郎的朋友”译作“伴郎”。
  rationale: 本节本身没有明确说明新娘是谁，也没有使用“伴郎”这一专门称谓；正文应保存意象及其解释空间，不把后来的教会论结论写入译文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“娶得新娘的才是新郎”以“才是”呈现主语与表语之间的辨识意味；“满心欢喜”传达希腊文的强调结构；全节不加入对“新娘”身份的解释。所有脚注标记均置于相关正文之后。
