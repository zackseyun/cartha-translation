  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: zh_hans
  text: 那从上面来的是在万有之上[a]；那来自地上的，是来自地上的，也从地上说话[b]。那从天上来的是在万有之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上面”也可译作“从天上”；希腊语 ἄνωθεν 表示来自上方，后面的“从天上”进一步说明了这个意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“也说地上的事”。原文直译再次是“从地上说话”，可表示言说的来源、领域或内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: 从上面
  rationale: 这里与分词“来”连用，表示来源于上方，而非“再次”。译作“从上面”既保留约翰用词的含义空间，也让后文“从天上”进一步说明其所指。
- source_word: ἐπάνω πάντων
  choice: 在万有之上
  rationale: 表达超越与至高地位；“万有”可自然涵盖中性复数 πάντων 的广泛所指，又保留空间比喻。
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: 那出于地的
  rationale: 保留冠词加分词结构所指的人，并突出其来源，与“从上面来”和“从天上来”形成对照。
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: 是属地的
  rationale: 在自然中文中表达其性质和归属，同时与前面的“出于地”共同保留原文重复强调的效果。
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: 从地而说
  rationale: 尽量保留第三次 ἐκ τῆς γῆς 及其来源意味，不把其含义限定为谈论地上的事或按属世观点说话。
- source_word: οὐρανός
  choice: 天上
  rationale: 此处指与地相对的天上领域及来源，不是单指可见的天空。
theological_decisions:
- issue: “从上面”与“从天上”的关系
  choice: 分别译作“从上面”和“从天上”
  alternative: 两处都译作“从天上”
  rationale: 原文使用两个相关而不相同的表达。分别翻译可保留修辞递进：后一句更明确地阐明前一句的天上来源，同时不抹平约翰的措辞。
- issue: 三次属地来源表达的力度
  choice: 以“出于地……属地……从地而说”保留三重强调
  alternative: 合并为“属地的人按属地的方式说话”
  rationale: 原文反复出现 ἐκ τῆς γῆς，强调来源、性质和言说之间的联系；不应为求流畅而完全消除重复，也不应把最后一处的语义限定为某一种解释。
- issue: πάντων 的所指
  choice: 译作“万有”
  alternative: 译作“所有人”或“一切”
  rationale: 希腊文属格复数本身未明确限定为人；“万有”保留较宽泛的宇宙性范围，并与基督来自天上的至高地位相称，而不把所指缩窄为所有人。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“那……的”用于对应原文三个带冠词的实体化分词结构；保留对称句式及属地语言的反复。用“属地的”使第二次重复在中文中较自然，但脚注保留第三处可能表示内容的歧义。
