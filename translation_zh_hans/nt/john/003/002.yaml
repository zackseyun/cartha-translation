  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: zh_hans
  text: 这人夜里[a]来见耶稣，对他说：“拉比，我们知道你是从上帝而来的老师，因为没有人能行你所行的这些记号[b]，除非上帝与他同在[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在夜间”。在约翰福音中，“夜”或“黑暗”有时也带有象征意味；本句是否有这层含义，原文没有明说。
    reason: lexical_alternative
  - marker: b
    text: 或译“这些神迹”。希腊语“记号”在约翰福音中指具有超自然性质、同时又指向更深意义的作为。
    reason: lexical_alternative
  - marker: c
    text: 原文作“除非上帝与他同在”，保留了尼哥德慕由第二人称“你”转为第三人称“他”的说法。
    reason: source_form
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 承接上一节刚介绍的尼哥德慕，保留指示代词的力度，同时符合现代汉语叙事习惯。
- source_word: νυκτός
  choice: 夜里
  rationale: 自然表达时间属格；既不把它明说成象征，也保留约翰福音中“夜”可能具有的主题意味。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留希腊文本所沿用的犹太称谓及历史语境，不直接简化为“老师”。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 忠实保留第一人称复数，不擅自改成“我知道”。
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: 你是从上帝那里来作老师的
  rationale: 表达从上帝而来的来源及老师的身份或职分，同时不加入原文未明说的“奉差遣”。
- source_word: ταῦτα τὰ σημεῖα
  choice: 这些记号
  rationale: 保留约翰使用“记号”所强调的指向作用，不只突出超自然性质；脚注说明也可译作“神迹”。
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: 能行你所行的
  rationale: 保留原文两次使用 ποιέω 的重复，中文也自然简洁。
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: 除非上帝与他同在
  rationale: 保留条件句，也保留尼哥德慕由直接称呼“你”转为第三人称“他”的原文措辞。
theological_decisions:
- issue: 约翰语境中 σημεῖα 的译法
  choice: 记号
  alternative: 神迹
  rationale: 这些作为本身具有超自然性质，但在约翰福音中也指向耶稣的身份与使命；“记号”较完整地保留这种神学张力。
- issue: 是否把末句第三人称改成第二人称
  choice: 保留“上帝与他同在”
  alternative: 上帝与你同在
  rationale: 原文先直接对耶稣说“你”，后改用第三人称“他”。保留这一转换，避免抹平原文可能带有的正式或概括性表达。
- issue: ἀπὸ θεοῦ ἐλήλυθας 是否明说差遣
  choice: 从上帝那里来
  alternative: 受上帝差遣而来
  rationale: 本节明确表达来源，却没有使用“差遣”的动词；译文不把约翰福音其他经文的差遣主题直接加进本句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来见耶稣”补明代词所指，以免连续两个“他”造成歧义；其余尽量保留原文的重复、条件结构和人称转换。
