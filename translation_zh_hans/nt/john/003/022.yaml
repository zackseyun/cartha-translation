  rationale: 修订“犹太地”以采用清楚、规范的地名；以“同他们逗留”表达διατρίβω及未完成体所示的持续性，避免加入明确时长或居住含义。保留“他……施洗”的单数语法指向，并以脚注忠实呈现4:2的后续说明。脚注锚点紧邻“施洗”，对应关系明确。
