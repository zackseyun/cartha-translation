  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: zh_hans
  text: 这些事以后，耶稣和他的门徒来到犹太地；他在那里同他们逗留，并施洗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰福音4:2后来说明，不是耶稣亲自施洗，而是他的门徒施洗。
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语和约翰叙事中的时间承接，现代汉语也自然。
- source_word: ἦλθεν
  choice: 来到
  rationale: 希腊文直译为“来”；汉语叙事中配合目的地使用“来到”自然，并保留原动词的视角。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 自然、准确地表达所属关系。
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: 来到犹太地区
  rationale: γῆ在这里指地域；“犹太地区”既反映Ἰουδαίαν γῆν，又避免把它误解为土壤或现代国家意义的领土。
- source_word: διέτριβεν
  choice: 住了一段时间
  rationale: 表达未完成时所呈现的持续状态；διατρίβω在此指逗留、停留一段时间。
- source_word: μετ’ αὐτῶν
  choice: 和他们
  rationale: 直接保留与门徒同在的意思。
- source_word: ἐβάπτιζεν
  choice: 给人施洗
  rationale: 采用现代中文基督教语境中通行且不限定施洗方式的表达，并体现持续进行的活动。
theological_decisions:
- issue: “施洗”的语法主语与约翰福音4:2的说明
  choice: 正文保留耶稣为语法主语：“并给人施洗”
  alternative: 在正文中改写为门徒施洗，或采用无明确主语的表达
  rationale: 本节单数动词ἐβάπτιζεν自然承接耶稣为主语；约翰福音4:2随后说明实际施洗的是门徒。正文不提前消解这一叙事张力，而以脚注提示后文说明。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“这些事以后”略带经文叙事风格但清楚易懂；“犹太地区”比“犹太地的乡间”更少加入原文未明说的城乡区分。脚注标记置于“施洗”之后，使其所说明的内容对应明确。
