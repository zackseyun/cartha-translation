  naturalness: 原句以分号连接并非错误，但“他在那里和他们住了一段时间”略显口语化且“住”容易偏向居住。改为“他在那里同他们逗留，并施洗”更简洁、庄重，也自然地表达持续的叙事背景。
  terminology: “犹太地”宜作为Judea的规范地名；“施洗”是中性且通行的宗教术语。脚注应说明4:2所作的限定，但不应以“实际”抹去本节的语法表述，故采用“耶稣亲自施洗”的措辞。
