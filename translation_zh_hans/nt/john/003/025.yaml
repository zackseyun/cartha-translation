base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: zh_hans
  text: 于是，约翰的门徒和一个犹太人就洁净的问题起了争论。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净”也可译作“净化”。这个词可泛指洁净；在这里很可能带有礼仪上的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: 发生了
  rationale: 这里的 γίνομαι 表示一件事出现或发生；“发生了争论”符合现代汉语习惯，并保留事件开始出现的叙事意味。
- source_word: οὖν
  choice: 于是
  rationale: οὖν 在此承接上文并推动叙事；“于是”既表达上下文关联，也不把逻辑因果说得过强。
- source_word: ζήτησις
  choice: 争论
  rationale: ζήτησις 可指讨论、辩论或争议；结合语境中的张力，“争论”比“讨论”更能体现分歧，同时不夸大为激烈冲突。
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: 约翰的门徒和一个犹太人
  rationale: 字面结构是争论“从约翰的门徒而起，与一个犹太人进行”；按自然汉语表达为双方“发生争论”。Ἰουδαίου 是单数，故保留“一个”。
- source_word: περὶ καθαρισμοῦ
  choice: 为洁净礼
  rationale: καθαρισμός 可泛指洁净，也常带宗教礼仪上的洁净含义。结合约翰福音邻近语境，“洁净礼”自然地传达很可能存在的礼仪背景；脚注同时保留较宽泛的词义。
theological_decisions:
- issue: καθαρισμός 是否应明确译为礼仪性的洁净
  choice: 正文译作“洁净礼”，并以脚注保留“洁净”的宽泛可能
  alternative: 译作“洁净”或“礼仪性的洁净”
  rationale: 上下文很可能涉及犹太人的礼仪洁净，但本节没有说明争论的具体范围。“洁净礼”符合语境，脚注则避免把该词的意义限制得过死。
- issue: Ἰουδαίου 的文本异读
  choice: 按 SBLGNT 正文译作单数“一个犹太人”
  alternative: 部分抄本作复数“犹太人”
  rationale: 所给原文版本采用单数，但复数异读会改变参与争论者的人数，属于值得向读者说明的文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”自然承接上文；“发生了争论”符合汉语搭配。正文以“洁净礼”呈现语境中很可能存在的礼仪意味，并用脚注保留原词较宽的语义范围。
