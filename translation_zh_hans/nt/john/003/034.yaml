  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: zh_hans
  text: 因为上帝所差来的那一位说上帝的话；因为上帝赐圣灵不是按限量的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他赐圣灵不是按限量的。”这里的“他”可指上帝所差来的那一位。
    reason: 原文“赐”的主语没有明说；按上下文，主语可理解为上帝，也有人理解为上帝所差来的那一位。
lexical_decisions:
- source_word: ὃν
  choice: ……的那一位
  rationale: 关系代词为阳性单数宾格，在此实体化指上帝所差来的那一位；此译法自然，并保留原文所指的人。
- source_word: ἀπέστειλεν
  choice: 差来
  rationale: 简明呈现不定过去时，并保留《约翰福音》中反复出现的“差遣”主题；在此处“差来”比单说“差”更符合现代汉语。
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: 上帝的话
  rationale: ῥήματα 指说出的话语；汉语“上帝的话”既自然，又准确表达属格关系。
- source_word: λαλεῖ
  choice: 说
  rationale: 直接表达 λαλέω 的“说话、讲说”之义，符合现代汉语，不采用较生硬的“发言”或“宣讲”。
- source_word: οὐ … ἐκ μέτρου
  choice: 没有限量
  rationale: 保留“按尺度/限量”的比喻意义，同时以自然汉语表达不是有限、定量地赐下。
- source_word: δίδωσιν
  choice: 赐下
  rationale: 现在时表达一般性陈述；“赐下”适合上帝赐予圣灵的语境，又没有增加原文没有的方式信息。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 约翰语境中最自然地指上帝的灵；汉语以“圣灵”明确该所指，但不借字体大小写作区分。
theological_decisions:
- issue: δίδωσιν（“赐下”）的隐含主语
  choice: 正文明确为“上帝赐下圣灵”，理解上帝是施予者。
  alternative: 所差来的那一位（即子）赐下圣灵，没有限量。
  rationale: 前文最近的明确主语是“上帝”，而且此理解能说明所差来的那一位为何说上帝的话；下一节也说父把万有交在子手里。不过希腊文在 δίδωσιν 前没有明示主语，因此脚注保留以所差来的那一位为主语的可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝所差来的那一位”保留关系结构；正文通过补出“上帝”使汉语清楚，脚注则保存希腊文隐含主语所产生的真实歧义。
