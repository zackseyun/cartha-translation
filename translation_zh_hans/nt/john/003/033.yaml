  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: zh_hans
  text: 接受他见证的人，就证明了上帝是真实的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“就盖上印，证明上帝是真实的。”
    reason: 保留ἐσφράγισεν“盖印”的字面意象；正文以“证明”表达其在此处郑重证实的比喻义。
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: 接受……的人
  rationale: 带冠词的过去时分词作名词性用法，泛指任何接受这见证的人；中文用“接受……的人”自然，并保留接受这一行动的整体性。
- source_word: αὐτοῦ τὴν μαρτυρίαν
  choice: 他的见证
  rationale: αὐτοῦ在上下文中自然指向那位从天上来的、作见证者；μαρτυρία译为“见证”，既可指所作的证言，也呼应约翰著作中的见证主题。
- source_word: ἐσφράγισεν
  choice: 确认了
  rationale: 该词本义为“盖印、加印”，此处比喻郑重认可或证实。正文译作“确认了”符合现代汉语，字面意象收入脚注。
- source_word: ὅτι
  choice: （确认）……是
  rationale: 此处引出确认的内容，而非表示原因；中文以宾语从句自然表达。
- source_word: ὁ θεὸς ἀληθής ἐστιν
  choice: 上帝是真实可信的
  rationale: ἀληθής在此既表达“真实”，也涉及上帝所说的话可靠、诚实；“真实可信”较单用“真实”更清楚地传达语境含义，同时保留真理语汇的回响。
theological_decisions:
- issue: “盖印”比喻的表达
  choice: 正文译为“确认了”，脚注保留“盖印确认”的字面说法
  alternative: 已盖印证明；已证实
  rationale: 接受这见证就是郑重承认上帝真实可信。正文优先清晰自然，脚注则保存原文鲜明的盖印意象，不额外引入教派性解释。
- issue: ἀληθής的语义范围
  choice: 真实可信的
  alternative: 真实的；诚实的
  rationale: 这里既可能强调上帝是真的，也在见证语境中强调上帝诚实可靠。“真实可信”避免把原文张力缩窄为单一层面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”依项目常用圣经语体；句式简洁，适合普通读者。脚注标记[a]已置于正文相应位置。
