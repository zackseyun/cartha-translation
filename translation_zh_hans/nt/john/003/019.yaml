id: JHN.3.19
reference: John 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: zh_hans
  text: 审判就在于此：光已经来到世上，人却爱黑暗胜过爱光，因为他们的行为是恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: 审判
  rationale: 保留该词在约翰语境中既指审判性评断、又可能包含定罪结果的宽广含义，不提前收窄为“定罪”。
- source_word: τὸ φῶς
  choice: 光
  rationale: 保留约翰福音既有的核心隐喻，不在正文中直接释作耶稣或基督。
- source_word: ἐλήλυθεν
  choice: 已经来到
  rationale: 以“已经”体现希腊语完成时所强调的来到及其持续结果。
- source_word: εἰς τὸν κόσμον
  choice: 来到世上
  rationale: “世上”是自然的现代汉语表达，也保留约翰著作中 κόσμος 所具有的世界及其中人类的语义空间。
- source_word: οἱ ἄνθρωποι
  choice: 人
  rationale: 此处泛指人类，并非只指男性；汉语“人”自然、简洁且准确表达其概括意义。
- source_word: ἠγάπησαν ... μᾶλλον ... ἢ
  choice: 爱……胜过爱……
  rationale: 既保留 ἀγαπάω 的“爱”，也明确表达 μᾶλλον ... ἢ 的比较关系。
- source_word: τὸ σκότος
  choice: 黑暗
  rationale: 与“光”形成约翰式象征对照，并保留原文隐喻。
- source_word: πονηρὰ τὰ ἔργα
  choice: 行为是恶的
  rationale: “行为”自然表达 ἔργα 在此处所指的所作所为；“恶的”准确保留其明确的道德判断。
theological_decisions:
- issue: “光”的指称
  choice: 正文保留“光”的隐喻
  alternative: 直接译为“耶稣”或将“光”明确作基督论称号
  rationale: 上下文强烈指向圣子的启示性来临，但本节原文本身仍使用隐喻；保留隐喻可维持约翰文本的神学张力。
- issue: κρίσις 的范围
  choice: 译作“审判”
  alternative: 译作“定罪”或“判决”
  rationale: 本节既说明审判显明于人对光的回应，也暗含不利结果；“审判”能保留这种较宽的含义。
- issue: οἱ ἄνθρωποι 的泛指意义
  choice: 译作“人”
  alternative: 译作“世人”或“人类”
  rationale: 该复数名词在此泛指人，不限于男性；“人”在现代汉语中最自然，也不额外扩大为经文未明说的绝对全称。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“审判就在于此”清楚引出随后对审判实质的说明；“爱黑暗胜过爱光”保留原文重复和强烈的道德取向。无需脚注。
