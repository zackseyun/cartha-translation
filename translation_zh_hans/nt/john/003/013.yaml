  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: zh_hans
  text: 没有人曾升到天上，只有那位从天上降下来的[a]，就是人子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从天上降下来”也可译作“从天上下来”。
    reason: lexical_alternative
  - marker: b
    text: “人子”是耶稣常用的自称，并呼应《但以理书》7:13–14。
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 自然、准确地表达全称否定，不使用可能显得古旧或限于男性的说法。
- source_word: ἀναβέβηκεν
  choice: 升到
  rationale: 以“升到天上”表达完成并具有现时关联的行动；现代汉语通常不另以形态标示希腊语完成时，其语境意义由整句承担。
- source_word: εἰς τὸν οὐρανὸν
  choice: 到天上
  rationale: 表达朝向并进入天上的运动，与下文“从天上降下来”形成清楚对照。
- source_word: εἰ μὴ
  choice: 只有
  rationale: 在“没有人……只有……”结构中自然地标明唯一例外，准确传达排除性。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: 那从天上降下来的
  rationale: 保留带冠词分词短语的实体性，并与前面的“升到天上”形成升降对照。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用福音书中耶稣这一自称的通行译法，保留其与但以理书7:13–14的互文联系及称号意味，不解释为泛指的“人”。
theological_decisions:
- issue: “人子”的基督论意味
  choice: 译作公认称号“人子”，不作释义性改写。
  alternative: 译作“那位属人的”或“人之子”。
  rationale: 原语兼有惯用表达、耶稣自称和末世性互文色彩；保留“人子”可维持这些层面的张力。
- issue: 升天与降下之时态及含义
  choice: 译作“升到……降下来”，不在正文中增添时间或教义解释。
  alternative: 译作“上过……下来”或补明为道成肉身、升天等具体事件。
  rationale: 经文强调人子的天上来源及独特资格，但希腊文本本身未在此进一步解释时间关系；译文应保留陈述，不替经文消解其时态和叙事张力。
- issue: 例外结构的指涉
  choice: 用“只有……就是人子”将唯一例外明确指向人子。
  alternative: 将“人子”处理为松散同位语，或扩写为“除了已经升天的人子”。
  rationale: 希腊语以εἰ μὴ引出唯一例外，并以“人子”同位说明该位；中文需清楚呈现此句法关系，同时避免额外补义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“没有人……只有……”符合自然汉语；“就是”明确同位关系。所有脚注标记均置于正文相应位置。
