- from: 我对你们说了地上的事[a]，你们都不信；要是我对你们说天上的事[b]，你们怎么会信呢？
  to: 我若把地上的事[a]告诉了你们，你们还不信；若把天上的事[b]告诉你们，你们怎会信呢？
  rationale: The revision removes the unsupported “都,” while “还不信” expresses the rhetorical contrast without imposing a claim about every addressee. “若” maintains the future-oriented condition with a more fitting register. The paired terms and their footnote alternatives are retained because they faithfully preserve the source’s broad earthly/heavenly contrast.
