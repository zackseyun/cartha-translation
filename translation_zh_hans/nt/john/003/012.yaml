review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the basic contrast, the past reference of εἶπον, the conditional construction, and the rhetorical future question. However, “都” adds an unexpressed distributive/universal nuance to οὐ πιστεύετε. The Greek simply states that the hearers do not believe; the contrast is better conveyed by “还不信.”
  naturalness: The current wording is generally natural. Replacing colloquial “要是” with “若” gives the line a more suitably elevated but still modern biblical register, and “还不信／怎会信呢” makes the rhetorical progression concise and idiomatic.
  terminology: “地上的事／天上的事” is a sound, symmetric rendering of τὰ ἐπίγεια and τὰ ἐπουράνια. It retains the intended breadth without deciding whether the terms denote earthly/heavenly realities, realms, illustrations, or mysteries. “不信” appropriately renders πιστεύω in this Johannine context.
  issues:
  - severity: medium
    issue: “都” in “你们都不信” is not represented in the Greek.
    rationale: οὐ πιστεύετε negates the verb without adding a distributive “all” or an explicit universal claim about each individual. Removing “都” avoids strengthening the statement beyond the source.
  - severity: low
    issue: “要是” is somewhat conversational for the passage’s otherwise formal register.
    rationale: It is not inaccurate, but “若” is more natural in a concise, dignified modern Scripture translation and still clearly renders ἐάν.
  revised_text: 我若把地上的事[a]告诉了你们，你们还不信；若把天上的事[b]告诉你们，你们怎会信呢？
