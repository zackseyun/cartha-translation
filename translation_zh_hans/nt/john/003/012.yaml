id: JHN.3.12
reference: John 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: zh_hans
  text: 我若把地上的事[a]告诉了你们，你们还不信；若把天上的事[b]告诉你们，你们怎会信呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上的事”也可译作“属地的事”。
    reason: lexical_alternative
  - marker: b
    text: “天上的事”也可译作“属天的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: 地上的事
  rationale: 中性复数形容词在此作名词用，与“天上的事”形成直接对照。“地上的事”自然清楚，同时不限定为地上的比喻、发生在地上的事，或属地的事务。
- source_word: εἶπον
  choice: 我对你们说了
  rationale: 简单过去时指耶稣先前所说的话；“对你们说了”自然体现与格ὑμῖν，并保留回指既有言说的语气。
- source_word: οὐ πιστεύετε
  choice: 你们都不信
  rationale: 现在时陈述听者当前的反应。“不信”符合约翰福音中πιστεύω的常用译法；“都”在此表达“连这些也不信”的语势，并非逐一断言每个人的内心状态。
- source_word: πῶς ... πιστεύσετε
  choice: 你们怎么会信呢
  rationale: 保留反问形式，并以“会信”自然表达将来时所指向的预期反应，不改译成能力上的“怎么能信”。
- source_word: ἐὰν εἴπω
  choice: 要是我对你们说
  rationale: ἐὰν加虚拟式表示面向未来的条件；“要是……说”是自然现代汉语，也保留条件性。
- source_word: τὰ ἐπουράνια
  choice: 天上的事
  rationale: 中性复数形容词作名词用，与τὰ ἐπίγεια严格对应。“天上的事”保留广义，不擅自解释为某类更深的奥秘。
theological_decisions:
- issue: “地上的事”与“天上的事”的对照所指为何
  choice: 直接保留两类事物的宽泛对照，不进一步界定。
  alternative: 把“地上的事”明确解释为取自尘世经验的比喻或发生在地上的真理，把“天上的事”解释为更深的神圣奥秘。
  rationale: 原文确实对照两类启示内容，却没有在本节内把二者的范围说死；宽泛翻译可保留其真实歧义和神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“地上的事／天上的事”形成简洁对称；分号清楚呈现前一条件与后一反问之间的递进关系。
