source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: zh_hans
  text: 但实行真理的人来到光的面前[a]，为要显明他的行为是在上帝里面做成的[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “实行真理”直译为“做真理”，也可译作“行真理”或“做真实的事”。
    reason: lexical_alternative
  - marker: b
    text: 这里也可译作：“为要显明他的行为，因为这些行为是在上帝里面做成的。”原文连接词既可引出所显明的内容，也可说明行为得以显明的原因。
    reason: alternative_reading
  - marker: c
    text: “在上帝里面”也可能含有“由上帝”“靠上帝”或“借着上帝”的意味；原文没有把具体关系限定下来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: 但实行真理的人
  rationale: δέ承接上一节形成温和对比；带冠词的现在分词指以这种持续行动为特征的人。“实行真理”在现代汉语中比生硬的“做真理”自然，同时保留真理被付诸行动的约翰式含义。
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: 来到光中
  rationale: 表达向光而来的动作，并以自然汉语保留“光”的启示性隐喻；也可直译为“来到光这里”。
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: 为要显明他的行为
  rationale: ἵνα表达目的；φανερωθῇ为被动形式，但汉语“显明”可自然涵盖“被显明”，而“行为”准确表达ἔργα在此处所指的所作所为。
- source_word: ὅτι
  choice: （融入）显明……是在……做成的
  rationale: 将ὅτι理解为引出所显明的内容，即这些行为是在上帝里面做成的；这种句式在汉语中无需另译“即”，仍清楚保留内容关系。
- source_word: ἐν θεῷ
  choice: 在上帝里面
  rationale: 尽量直接保留ἐν的开放表达，不限定为“靠上帝”“由上帝”或“借着上帝”，从而保留范围、关系及施动等可能意味。
- source_word: ἐστιν εἰργασμένα
  choice: 做成的
  rationale: 该迂回完成时被动结构强调行为已经完成并处于既成状态；“做成的”在汉语中简洁地传达这一结果意味。
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν这一表达的含义
  choice: 实行真理
  alternative: 行真理；按真理而行；做真实的事
  rationale: “实行真理”既是自然的现代汉语，也保留真理不只是被认识或相信、还被付诸行动的神学张力；不把它缩窄为一般的诚实行事。
- issue: ὅτι所表达的逻辑关系
  choice: 理解为引出被显明的内容
  alternative: 理解为“因为”，引出行为得以显明的原因
  rationale: 两种分析在语法上都有可能。正文采用内容读法，使“这些行为是在上帝里面做成的”成为被显明之事；脚注保留原因读法。
- issue: ἐν θεῷ的意味
  choice: 在上帝里面
  alternative: 由上帝；靠上帝；借着上帝；与上帝联合
  rationale: 原文可涉及上帝的领域、关系或施动，但没有把其中一种意味明确化。直译保留这种开放性，避免加入特定教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“实行真理”兼顾原文独特表达与普通读者的可理解性；“在上帝里面”有意保留原文的神学开放性。
