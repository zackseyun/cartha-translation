  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: zh_hans
  text: 信子的人有永生；但不顺从子的人[a]必不得见生命；上帝的震怒仍在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拒绝相信子的人”。这里的希腊语动词既可含有拒绝相信的意思，也可含有不顺从的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: 信从子的人
  rationale: πιστεύω εἰς 表达指向某人的信靠。“信从”在现代汉语中兼具相信和归向、信靠之意，并与后文“不顺从”形成清楚而不过度简化的对照。
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: 子
  rationale: 原文使用带冠词的称号，没有明说“上帝的”；汉语以“子”保留约翰著作中的基督论称号，也不增添原文没有的所有格。
- source_word: ἔχει
  choice: 有
  rationale: 现在时直陈语气表示现今已经拥有，而非仅指将来的盼望。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是自然、通行且准确的约翰用语，既涵盖无尽的持续，也承载末世生命的性质。
- source_word: ὁ δὲ ἀπειθῶν
  choice: 不顺从……的人
  rationale: ἀπειθέω 可指不服从，也可指拒绝相信。正文用“不顺从”保留其较广的词义，并以脚注说明另一种可能，避免把相信与顺从之间的张力消解掉。
- source_word: οὐκ ὄψεται ζωήν
  choice: 必不得见生命
  rationale: 保留原文“见生命”的约翰式表达；“必不得”自然传达将来时的确定否定，不将其改写为单纯的“没有生命”。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 上帝的震怒
  rationale: “震怒”明确表达针对罪恶的神圣忿怒与审判，不将其弱化为一般的不悦。
- source_word: μένει
  choice: 仍在
  rationale: 现在时表示持续存在的状态；“仍在”在现代汉语中自然地传达“继续停留”的意思。
- source_word: ἐπ’ αὐτόν
  choice: 在他身上
  rationale: 自然表达震怒临到并持续在该人身上；“他”沿用原文泛指单数，并不限于男性。
theological_decisions:
- issue: ἀπειθῶν 与 πιστεύων 对照时的含义
  choice: 正文译为“不顺从子的人”，脚注保留“拒绝相信子的人”这一可能。
  alternative: 拒绝相信子的人；不信的人
  rationale: 上下文的对照表明不信之意确实在场，但 ἀπειθέω 本身也包含不服从的语义。正文与脚注共同保留相信和顺从之间的神学张力。
- issue: 永生与上帝震怒的时间指向
  choice: 保留“有”和“仍在”所表达的现今状态，同时用“必不得见”表达将来的结果。
  alternative: 把永生和震怒都仅处理为将来的状态
  rationale: ἔχει 与 μένει 都是现在时直陈语气，而 ὄψεται 是将来时；译文不把这种现今与将来的张力彼此调和或抹平。
- issue: “子”的称号
  choice: 译为“子”，不扩写为“上帝的儿子”。
  alternative: 上帝的儿子
  rationale: 原文在此使用“子”这一称号，并未加入显式所有格；保留简洁称号更贴近原文及约翰语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“信从／不顺从”形成语义呼应；保留“见生命”这一略带经文色彩但清楚可懂的表达。分号呈现两类人的鲜明对照，“却”突出末句与“见生命”的反转关系。
