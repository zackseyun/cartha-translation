  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: zh_hans
  text: 信他的人不被定罪[a]；不信的人已经被定罪，因为他没有信上帝独一的儿子的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不被定罪”和下文“已经被定罪”也可译作“不受审判”和“已经受了审判”。希腊语动词 κρίνω 可指“审判”，在本段语境中也可指作出不利判决，即“定罪”。
    reason: lexical_alternative
  - marker: b
    text: “独一的儿子”也可译作“唯一的儿子”；传统译作“独生子”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: 信他的人
  rationale: 带冠词的现在分词作名词用，表达一般性、持续性的相信；“信他的人”既贴近原文结构，也符合现代汉语。πιστεύω εἰς 表示以某人为信靠对象，汉语自然译作“信他”。
- source_word: οὐ κρίνεται
  choice: 不被定罪
  rationale: κρίνω 本义范围包括“审判、判断”，但在约翰福音3:17—19救与定罪的语境中，这里指不利的审判结果；译作“定罪”能传达其司法性含义，同时以脚注保留“受审判”的可能译法。
- source_word: ὁ δὲ μὴ πιστεύων
  choice: 不信的人
  rationale: δέ 表示与前句的对照；汉语分号已清楚呈现转折关系，无须机械加入“但是”。带冠词的否定分词自然译作“不信的人”。
- source_word: ἤδη κέκριται
  choice: 已经被定罪
  rationale: 完成时表示已经发生并延续至今的状态；“已经被定罪”保留了完成及当前结果两方面的力量。
- source_word: ὅτι μὴ πεπίστευκεν
  choice: 因为他没有信
  rationale: ὅτι 引出理由，译作“因为”；πεπίστευκεν 为完成时，在汉语中以“没有信”结合前文当前的定罪状态自然表达其持续后果。
- source_word: εἰς τὸ ὄνομα
  choice: 信……的名
  rationale: 保留约翰著作中“信入/信靠其名”的具体表达。“名”指向那位的启示身份与权柄，但正文不将其解释性展开。
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: 上帝独一的儿子
  rationale: μονογενής 在此强调这位儿子独一无二的身份；“独一的儿子”清楚自然，且避免现代读者从“独生”误读出生物性的生育含义。属格结构译为“上帝……的儿子”。
theological_decisions:
- issue: 本节 κρίνω 的译法
  choice: 两处均译作“定罪”
  alternative: 两处均译作“审判”或“受审判”
  rationale: 紧邻语境将拯救与不利的司法判决相对照，因此“定罪”更能表达这里的语境义；不过 κρίνω 的词义本身较宽，脚注保留更形式对应的译法，不把这一词汇张力隐藏起来。
- issue: μονογενής 的译法
  choice: 独一的
  alternative: 独生的；唯一的
  rationale: 原词在约翰语境中突出儿子无可比拟、独一无二的身份。“独一的”不削弱其独特性，也不把后来的教义术语直接置入正文；脚注保留传统译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”用于 θεός；句式保持简洁对称，以呈现原文信与不信的鲜明对照。正文中的每个脚注标记均与脚注对应。
