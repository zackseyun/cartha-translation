  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: zh_hans
  text: 耶稣回答他，说：“你是以色列的教师[a]，还不知道这些事吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是以色列的一位教师。”希腊文此处有定冠词，直译为“那位／这位以色列的教师”；这称呼可能带有尖锐的反问意味。
    reason: 词义备选；说明定冠词及其可能的修辞作用。
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: 耶稣回答他说
  rationale: 保留希腊文“回答并对他说”的双动词叙事公式，同时采用现代汉语中自然、庄重的表达。
- source_word: Σὺ
  choice: 你
  rationale: 明示第二人称，置于问句开头，保留原文显式代词所带的强调。
- source_word: ὁ διδάσκαλος
  choice: 教师
  rationale: “教师”准确表达 διδάσκαλος，语体庄重而易懂；定冠词的特指和反问语气通过“以色列的教师”及脚注说明体现。
- source_word: τοῦ Ἰσραὴλ
  choice: 以色列的
  rationale: 按属格直译，表示在以色列中具有代表性身份的教师，而不只表示地理位置。
- source_word: ταῦτα
  choice: 这些事
  rationale: 自然对应中性复数指示词，概括指向上文耶稣所讲的内容。
- source_word: οὐ γινώσκεις
  choice: 还不知道
  rationale: “知道”保持 γινώσκω 的词义透明度；“还”自然传达在其教师身份背景下反问所具有的诧异和责问意味。
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ 对尼哥德慕称呼的力度
  choice: 译作“以色列的教师”，保留定指意味
  alternative: “以色列的一位教师”
  rationale: 原文有定冠词，称呼带有尖锐的修辞意味，突出尼哥德慕作为公认教师却不明白这些事的反差；不进一步解释为正式头衔，以免超出文本证据。
- issue: γινώσκεις 在语境中的认知含义
  choice: 译作“不知道”
  alternative: “不明白”
  rationale: “不知道”较直接对应原词，也可在本语境中自然包含“不理解”的意思，避免替原文消除“知道”与“明白”之间的语义张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“回答他说”略带经文叙事风格，但仍为现代读者所懂，并保留原文双动词公式。脚注标记置于整个问句之后。
