    rationale: ὃ ἑωράκαμεν是μαρτυροῦμεν的对象；中文应表达“我们为……作见证”，以保留原文的见证动作及其对象。
  - severity: medium
    issue: “亲眼见过”增添了原文未明示的“亲眼”限定。
    rationale: ἑωράκαμεν是“我们已经看见／所看见的”；虽视觉动词通常蕴含亲历，译文不宜额外强调。
  - severity: medium
    issue: “可是”将末尾καί强化为转折。
    rationale: 本句希腊文使用καί（“和／而”）；上下文存在对比，但正文宜保留较中性的连接。
  - severity: low
    issue: 脚注把“我实实在在地”称为“直译为‘阿们，阿们’”不够准确。
    rationale: “阿们，阿们”是原文音译式对应；“我实实在在地”是该公式在中文句中的意译，且“地”属于中文句法而非该希腊词组本身。
