revisions:
- from: 我实实在在地告诉你，我们所说的，是我们知道的；我们所见证的，是我们亲眼见过的；可是你们不接受我们的见证。[a]
  to: 我实实在在告诉你，我们说我们所知道的，也为我们所见过的作见证，而你们不接受我们的见证。[a]
  rationale: 修订恢复原文两个关系从句分别作“说”和“作见证”的对象，删除“亲眼”这一额外限定，并将末尾连接词译为较中性的“而”。脚注准确说明“阿们，阿们”为可选译法，同时保留单复数人称转换及第一人称复数所指未定的文本现象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:32Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了ἀμὴν ἀμὴν的强调、σοι（单数）至λαμβάνετε（复数）的转换，以及“我们／我们的”复数歧义。不过，“我们所见证的，是我们亲眼见过的”改变了原文的动宾关系：原文是“我们为我们所见过的作见证”，并非“我们所见证的内容就是我们亲眼见过的”。末尾καί宜译为“而／并且”，不应强化为“可是”。
  naturalness: 原译整体庄重通顺，但“我实实在在地告诉你”中“地”修饰“告诉”略不自然；现代汉语可用“我实实在在地告诉你”但更紧凑的“我实实在在告诉你”更合适。修订后的平行句式自然清晰。
  terminology: “见证／接受”适当保留约翰福音的见证与领受语汇。“亲眼”比原文单纯的“看见”更具体，宜删除。保留“我们”而不说明其范围，避免作解释性限定。
