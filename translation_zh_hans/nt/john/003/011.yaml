  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: zh_hans
  text: 我实实在在告诉你，我们说我们所知道的，也为我们所见过的作见证，而你们不接受我们的见证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “实实在在”也可译为“阿们，阿们”。本节希腊文先用单数“你”，后用复数“你们”；“我们”具体包括谁，原文没有说明。
    reason: lexical_and_ambiguity_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地
  rationale: 以现代中文中庄重而熟悉的表达传达双重“阿们”的郑重强调；脚注保留较为直译的形式。
- source_word: λέγω σοι
  choice: 告诉你
  rationale: 自然表达当前对单数听者尼哥德慕的直接宣告。
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: 我们所说的，是我们知道的
  rationale: 保留“我们”的复数和“知道—说”的对应关系，同时调整语序以符合现代汉语。
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: 我们所见证的，是我们亲眼见过的
  rationale: “见证”保留约翰著作中的证言语汇；“亲眼见过”自然体现视觉经验及完成时所表达的持续关联。
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: 我们的见证
  rationale: 与动词“见证”保持词根关联，并保留第一人称复数而不界定其所指群体。
- source_word: οὐ λαμβάνετε
  choice: 你们不接受
  rationale: λαμβάνω在此指对见证的领受或接纳；“接受”在现代中文中比机械直译“领取”准确自然。
- source_word: καὶ
  choice: 可是
  rationale: 末一καί形式上是“并且”，在语境中连接真实见证与听者拒绝之间的反差；“可是”自然传达该语篇关系。
theological_decisions:
- issue: 第一人称复数“我们／我们的”所指为何
  choice: 保留复数，不在正文中限定所指
  alternative: 解释为耶稣与门徒、修辞性复数，或更广义的天上／神圣见证者
  rationale: 希腊文明确使用第一人称复数，但具体包括谁存在争议；译文保留这一神学张力。
- issue: 单数“你”与复数“你们”的转换
  choice: “告诉你”用单数，“你们不接受”用复数
  alternative: 两处都泛化为“你／你们”
  rationale: 忠实呈现σοι的单数与λαμβάνετε的复数，显示话语从直接对尼哥德慕说话转向更广泛群体的可能性，而不替文本确定该群体。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留“知道—说”“看见—见证”的平行结构，并明确反映原文单复数人称变化；不对“我们”的身份作教派性或解释性限定。
