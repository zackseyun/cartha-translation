  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: zh_hans
  text: 正如摩西在旷野把蛇举起来[a]，人子也必须照样被举起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参民数记21:8—9，那里记载摩西在旷野把蛇举起来。
    reason: cross_reference
  - marker: b
    text: 或译“被高举”。希腊语动词既可指实际被举高，也可指被尊崇；约翰在这里很可能兼有这两层含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ καθὼς
  choice: 摩西怎样……也……照样
  rationale: 用现代汉语自然的关联结构表达原文的比较关系；句首不机械译出 καί，而将其承接作用融入句式。
- source_word: ὕψωσεν
  choice: 举起……来
  rationale: 在民数记的背景中首先指把蛇实际举高，同时与后半句重复的同一词根保持呼应。
- source_word: τὸν ὄφιν
  choice: 蛇
  rationale: 准确、自然地表达 ὄφις，也与民数记21章的叙事用语相符。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是清楚而庄重的现代圣经用语，符合以色列人在旷野的叙事背景。
- source_word: οὕτως
  choice: 照样
  rationale: 与前面的“怎样”构成自然的对应，明确表达类比关系。
- source_word: ὑψωθῆναι
  choice: 被举起来
  rationale: 保留被动语态，并维持约翰用语中“实际被举高”与“被高举、得荣耀”之间的双重含义。
- source_word: δεῖ
  choice: 必须
  rationale: 表达原文所含的必然性，而非仅仅预告将要发生的事。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文中通行且简洁的称号，保留其在但以理书及约翰福音中的神学回响。
theological_decisions:
- issue: ὑψόω 在约翰福音中的双重含义
  choice: 两处均译为“举起”，第二处用被动式“被举起来”
  alternative: 将第二处译为“被高举”或“被升高”
  rationale: “被举起来”既能对应蛇被实际举起，也能指向人子在十字架上被举起，并仍容许“被高举、得荣耀”的含义，不把经文的张力限定为其中一面。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“怎样……也必须照样……”清楚呈现原文的对应结构；“举起……来／被举起来”保留关键词重复及其有意的双重含义。脚注标记按内容置于相应词句之后。
