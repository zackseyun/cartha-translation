  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: zh_hans
  text: 他必兴旺[a]，我必衰微。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必增大，我必变小。”
    reason: 保留更贴近原文 αὐξάνειν 与 ἐλαττοῦσθαι 的词面对应及其宽泛含义。
lexical_decisions:
- source_word: ἐκεῖνον
  choice: 他
  rationale: 该指示代词在“δεῖ + 不定式”结构中是不定式的逻辑主语，所指为上文的耶稣。现代汉语用“他”自然明确；原文并无通过大写表达尊称的词汇特征。
- source_word: δεῖ
  choice: 必
  rationale: 表达必要性或必然性。“必”简洁有力，并使前后两个不定式共同受这一必要性支配，而不额外界定这是命令、预言还是具体形式的神圣旨意。
- source_word: αὐξάνειν
  choice: 兴旺
  rationale: 该现在时不定式表示持续增长或变得更大；结合施洗约翰与耶稣影响力的语境，“兴旺”既自然，又不局限于人数或物质数量。
- source_word: ἐμὲ
  choice: 我
  rationale: 该宾格代词是不定式的逻辑主语，汉语自然译为“我”。
- source_word: δὲ … δὲ
  choice: ……，……
  rationale: 两个 δὲ 构成鲜明对照。汉语通过平行分句和语义反差即可自然呈现；不机械重复连接词，以保持简洁有力。
- source_word: ἐλαττοῦσθαι
  choice: 衰微
  rationale: 表示变小、变少或降低。“衰微”与“兴旺”形成凝练的对举，也符合约翰的地位与影响逐渐退居次位的语境；脚注保留更贴近形式的译法。
theological_decisions:
- issue: δεῖ 所表达的必要性
  choice: 以“必”保留必要性和救恩历史秩序的分量，但不进一步明定其机制
  alternative: 译成单纯现实趋势，或明确扩写为上帝的命令或预定
  rationale: δεῖ 常可带有神圣必要性的意味，但本句没有具体说明这种必要性如何运作。“必”既保留其神学分量，也避免加入经文本身未明说的教义解释。
- issue: “兴旺”与“衰微”的范围
  choice: 保持宽泛，可涵盖地位、影响和公众关注的消长
  alternative: 限定为人数增长、个人能力增强，或本体性质上的增减
  rationale: 上下文涉及耶稣事工日益显明与约翰事工退居其后；原词本身宽泛，不宜把含义收窄为某一种可量化变化。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“兴旺／衰微”形成自然有力的对举，适合本句近似格言的语气；脚注补充较直译的表达。
