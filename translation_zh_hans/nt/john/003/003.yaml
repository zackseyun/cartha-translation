  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: zh_hans
  text: 耶稣回答他说：“我实实在在地告诉你，人若不是从上面生的[a]，就不能看见上帝的国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“再生一次”，即“重生”。希腊语这个副词既可表示“从上面”，也可表示“再次”；下一节的对话正是围绕这双重含义展开。
    reason: 保留 ἄνωθεν 的真实词义歧义及其在下文对话中的作用。
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: 回答他说
  rationale: 保留原文“回答”和“说”两个动词，同时采用自然、庄重的现代汉语叙事表达。
- source_word: Ἀμὴν ἀμὴν λέγω σοι
  choice: 我实实在在地告诉你
  rationale: 以现代读者易懂的惯用表达传达双重“阿们”的郑重和强调，也保留第二人称单数所指的直接语气。
- source_word: ἐὰν μή τις
  choice: 人若不是
  rationale: 用泛指的“人”自然表达原文不限定性别的 τις；“若不是”准确表达否定条件。
- source_word: γεννηθῇ
  choice: 生的
  rationale: 原词为 γεννάω 的被动形式，在这里表达“出生、被生”；不把 ἄνωθεν 的含义并入动词而预先译成“重生”。
- source_word: ἄνωθεν
  choice: 从上面
  rationale: 该副词可指“从上面”，也可指“再次”。约翰福音中的天上来源主题支持正文采用“从上面”，同时以脚注保留推动下文对话的另一层含义。
- source_word: οὐ δύναται
  choice: 不能
  rationale: 简洁、自然地表达原文所说的无能力或不可能。
- source_word: ἰδεῖν
  choice: 看见
  rationale: 采用直接的词义对应，不将其收窄为“理解”或“进入”，从而保留约翰文体中视觉与属灵领悟可能重叠的含义。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: “国”既可涉及统治权，也可涉及国度领域；“上帝的国”是准确、庄重且普通现代读者容易理解的表达。
theological_decisions:
- issue: ἄνωθεν 在耶稣话语中的含义
  choice: 正文译作“从上面”
  alternative: 也可译作“再次”，在此语境中即“重生”
  rationale: 原词确有“从上面”和“再次”两种可能。约翰福音的天上来源主题支持把“从上面”放入正文，而尼哥德慕在下一节的回应显明他听出了“再次”的意思。正文与脚注共同保留这有意的双重含义，不将神学张力消解。
- issue: “看见上帝的国”的含义范围
  choice: 保留“看见”
  alternative: 译作“领会”或“经历”
  rationale: 原文 ἰδεῖν 的直接含义是“看见”。不把它解释性地改译为属灵领会、经历或进入，以免超出本节措辞并缩窄可能含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我实实在在地告诉你”保留双重郑重语气；“人若不是”作无性别限定的泛指。正文保留“回答他说”的双动词结构，但不追求生硬逐词对应。
