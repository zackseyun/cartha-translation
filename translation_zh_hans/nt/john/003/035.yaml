base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: zh_hans
  text: 父爱子，已经把一切都交在他手中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他手中”；这是表示将权柄、管理权或所有权托付给某人的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 在《约翰福音》的语境中，这是指上帝与子之关系的称谓；现代中文以“父”自然、庄重地保留这一关系性称号。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 现在时表达持续成立的现实；中文“爱”无需另加进行标记，也能自然传达这种持续性。
- source_word: τὸν υἱόν
  choice: 子
  rationale: 与“父”相对应，指耶稣独特的子之身份；保留原文简洁而明确的关系性称谓。
- source_word: πάντα
  choice: 一切
  rationale: 中性复数表示范围全面；“一切”在现代中文中简洁自然，同时不限定所包括的具体内容。
- source_word: δέδωκεν
  choice: 已经把……交
  rationale: 完成时表示已经发生并具有持续结果的行动；“已经”体现完成性，“交”结合手的意象传达托付、支配或掌管之意。
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: 在他手中
  rationale: 贴近原文的字面表达，并且在中文里同样可自然表示处于某人的掌管、权柄或支配之下。
theological_decisions:
- issue: 父与子的关系
  choice: 保留“父”和“子”这两个相互对应的关系性称谓
  alternative: 改写为“上帝”和“耶稣”或采用一般亲属称谓
  rationale: 原文刻意使用“父”与“子”，应保留其基督论关系，同时不加入经文未明说的神学阐释。
- issue: 交给子的范围与持续结果
  choice: 译为“已经把一切都交在他手中”
  alternative: 译为“把一切给了他”
  rationale: “一切”保留范围的全面性，“已经”体现完成时，而“在他手中”保留权柄、托付和占有之间的丰富意涵，不把它收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“交在他手中”既保留希腊文的手之意象，也符合自然中文；句式简洁，适合经文朗读。
