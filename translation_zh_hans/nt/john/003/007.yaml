base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: zh_hans
  text: 不要因我对你说：‘你们必须从上面而生’[a][b]，就惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上面”也可译作“再次”或“重新”。希腊语ἄνωθεν兼有这些含义。
    reason: alternative_reading
  - marker: b
    text: 前一个“你”（“我对你说”）在希腊语中是单数；“你们必须”中的“你们”是复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: 你不要……惊讶
  rationale: μή加不定过去时虚拟语气构成禁止语；“不要惊讶”自然、庄重，并准确表达θαυμάζω的语力。
- source_word: ὅτι
  choice: 因为
  rationale: 此处ὅτι可理解为引出惊讶的缘由；汉语用“因为……而惊讶”比直译为“不要惊讶我说……”更自然，同时不改变所指内容。
- source_word: εἶπόν σοι
  choice: 我对你说过
  rationale: σοι是单数，译作“对你”；不定过去时在此回指此前的话，“说过”符合现代汉语语境。
- source_word: Δεῖ
  choice: 必须
  rationale: Δεῖ表达必要性；“必须”简洁有力，不将其弱化为一般建议。
- source_word: ὑμᾶς
  choice: 你们
  rationale: ὑμᾶς明确为复数；汉语可在正文中直接体现，并与前面的单数“你”形成原文中的数的对照。
- source_word: γεννηθῆναι
  choice: 生
  rationale: 该不定式为被动形式。与“从上面”连用时，汉语“从上面生”保留出生意象，也避免“被生下来”过于生硬。
- source_word: ἄνωθεν
  choice: 从上面
  rationale: ἄνωθεν既可表示“从上面”，也可表示“再次／重新”。正文采用符合约翰神学中天上来源含义的“从上面”，另一义项以脚注保留。
theological_decisions:
- issue: ἄνωθεν在重生话语中的含义
  choice: 从上面
  alternative: 再次／重新
  rationale: 约翰福音第3章的语境有意容纳“从上面”和“再次”两层含义。正文采用较能体现源自上帝、源自天上之意的“从上面”，同时用脚注保留另一真实义项，不消除原文的张力。
- issue: σοι与ὑμᾶς的单复数转换
  choice: 正文分别译为“你”和“你们”
  alternative: 两处都译作不标数的“你”
  rationale: 耶稣先单独对尼哥德慕说话，随后用复数表明这项必要性不只针对他个人。现代汉语能够直接呈现这一差别，宜在正文保留，并以脚注提示其意义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“从上面生”略带陌生感，但这是为保留原文ἄνωθεν的空间意象和约翰叙事中的双关；以脚注说明“再次／重新”的可能含义。正文直接区分“你”与“你们”，使希腊语的单复数变化在中文中清楚可见。
