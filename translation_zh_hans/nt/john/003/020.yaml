  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: zh_hans
  text: 因为凡作恶的人，都恨光，也不走近光，免得自己的行为被揭露。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被揭露”也可译作“被责备”或“被证明有错”；希腊文动词可指揭露恶行、显明过错或使人知罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: 因为凡……的
  rationale: γάρ承接并解释上文，译作“因为”；πᾶς与带冠词的分词构成泛指，汉语用“凡……的”自然表达每一个具有这种行为特征的人。
- source_word: φαῦλα πράσσων
  choice: 作恶的
  rationale: φαῦλα在本段光与暗的伦理对比中指邪恶之事；现在分词πράσσων可表示持续或特征性的行为。汉语“作恶”既自然，也保留这种道德与行为含义。
- source_word: μισεῖ τὸ φῶς
  choice: 恨光
  rationale: 直译μισεῖ的强烈敌对含义，并保留约翰福音中“光”的核心启示性意象，不作解释性改写。
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: 也不来就光
  rationale: 保留ἔρχεται πρός所表达的朝向、接近之意。“来就光”用语简洁庄重，并与约翰福音的光之意象相称。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 在此表达避免某结果的否定目的；“免得”准确而自然。
- source_word: ἐλεγχθῇ
  choice: 被揭露
  rationale: ἐλέγχω可指揭露、证明有错或责备。光照显行为的语境首先突出显露，故正文译“被揭露”，同时用脚注保留其他可能语义。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 自己的行为
  rationale: ἔργα指所做的事或行为。汉语以反身领属“自己的”自然回指泛称的“凡……的”，无需复制希腊语阳性形式，也不改变其普遍适用性。
theological_decisions:
- issue: ἐλεγχθῇ在光之意象中的含义
  choice: 被揭露
  alternative: 被责备；被定为有错
  rationale: 上下文强调光使人的行为显明；“揭露”保留这一启示与道德显明的重点，但该动词也可能含责备或证明有罪之意，因此在脚注中注明。
- issue: 泛指结构中的阳性单数形式
  choice: 凡作恶的……自己的行为
  alternative: 凡作恶的人……他的行为
  rationale: 希腊语以阳性单数作泛指，并非只限男性。现代汉语反身代词“自己”能够准确保持单数泛指及回指关系，又避免误解为性别限定。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。“光”保留约翰福音中的原有隐喻；“作恶”表达特征性行为；“来就光”略带经文语体但仍易于理解。脚注标记置于其所说明的“被揭露”之后。
