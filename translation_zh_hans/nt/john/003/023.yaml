  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: zh_hans
  text: 约翰也在靠近撒冷的哀嫩施洗[a]，因为那里水多；人们陆续前来受洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施洗”所译的希腊语动词也可译作“施浸”；这里采用通行术语“施洗”，这个译法本身并不判定具体采用哪一种方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: 约翰也……施洗
  rationale: ἦν与现在分词βαπτίζων构成迂回未完成时，表示过去持续进行的行动；“也”体现καί，δέ仅作轻微衔接，中文无须生硬译出。
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: 在靠近撒冷的哀嫩
  rationale: 按现代汉语地名表达调整语序；Αἰνών和Σαλείμ分别音译为传统常用译名“哀嫩”和“撒冷”。
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: 因为那里水多
  rationale: ὅτι在此表原因；“水多”自然简洁，并保留复数ὕδατα可能指丰富水源或多处水体的开放性。
- source_word: παρεγίνοντο
  choice: 不断前来
  rationale: 未完成时表示持续或反复发生；“不断”在中文中清楚体现这一体貌。
- source_word: ἐβαπτίζοντο
  choice: 受洗
  rationale: 未完成时被动语态表示人们持续接受施洗；与前面的“不断前来”结合，已自然传达持续性。
theological_decisions:
- issue: βαπτίζω的译法
  choice: 施洗／受洗
  alternative: 浸／受浸
  rationale: “施洗／受洗”是现代中文圣经及基督教语境中通行而中性的术语，保留其宗教行为含义，不在正文中借译词裁定具体施行方式；可能的“浸”义在脚注说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“靠近撒冷的哀嫩”避免欧化语序；分号清楚连接地点原因与群众持续前来受洗的叙述。
