  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: zh_hans
  text: 他所看见、所听见的，他为这事作见证[a]；没有人接受他的见证。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为这事作见证”也可译作“见证这些事”。
    reason: lexical_alternative
  - marker: b
    text: “没有人接受他的见证”是鲜明的概括；下一节随即谈到接受他见证的人。
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: 所……的
  rationale: 中性单数关系代词指向所看见、所听见的内容；用“所……的”自然地保留这一内容指向。
- source_word: ἑώρακεν
  choice: 所看见
  rationale: 希腊语完成时表示已经看见且其结果仍具现实意义；汉语在此不必另加时态助词，语境已能表达。
- source_word: ἤκουσεν
  choice: 所听见
  rationale: 与“所看见”并列，忠实表达听见的内容；汉语不强行标出与前一动词不同的希腊语体貌。
- source_word: τοῦτο
  choice: 为此
  rationale: 回指刚才提到的所见所闻，并保留原文先提出内容、再用指示词复指的结构。
- source_word: μαρτυρεῖ
  choice: 作见证
  rationale: 保留约翰著作中法律性和见证性的语义，也与后面的“见证”形成同词根呼应。
- source_word: μαρτυρίαν
  choice: 见证
  rationale: 与动词“作见证”保持词汇呼应，并符合现代中文圣经语域。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 直接保留原文鲜明的全称否定，不弱化为“很少有人”。
- source_word: λαμβάνει
  choice: 接受
  rationale: 此处指对见证的领受和认可；现代汉语说“接受见证”比“接收见证”自然，同时不额外解释接受的方式。
theological_decisions:
- issue: “没有人接受他的见证”这一全称否定的范围
  choice: 保留“没有人”的鲜明概括
  alternative: 译为“很少有人接受他的见证”，或将其解释为数学意义上的绝对无人接受
  rationale: 原文明确使用全称否定；下一节却谈到接受其见证的人。译文应保留约翰式修辞所形成的张力，而不在正文中加以软化或绝对化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他所……的，他就……”保留原文的复指结构；“作见证／见证”维持同词根呼应。分号和“可是”清楚呈现转折，但不解释其神学张力。
