id: JHN.3.8
reference: John 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: zh_hans
  text: 风随自己的意思吹[a]，你听见它的声音[b]，却不知道它从哪里来、往哪里去；凡从圣灵生的，也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“风”和“灵”使用同一个词（pneuma）。本节前后重复这个词，形成双关；中文无法用同一个自然的词完整保留。
    reason: lexical_alternative
  - marker: b
    text: “声音”也可译作“声”；原词也可指“嗓音”，这里是指风可听见的声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα（本节前半）
  choice: 风
  rationale: 与动词 πνεῖ（吹）及可听见的 φωνή（声音）搭配，具体指风；同时与后半节“圣灵”形成原文有意的双关。
- source_word: ὅπου θέλει
  choice: 随自己的意思
  rationale: 保留 θέλει 所表达的意愿及拟人色彩，同时符合现代汉语表达。
- source_word: πνεῖ
  choice: 吹
  rationale: 以“风”为主语时，“吹”最自然，也清楚呈现气象意象。
- source_word: φωνήν
  choice: 声音
  rationale: φωνή 可指“声音”或“嗓音”；此处指风可听见的动静，因此译作“声音”自然，同时以脚注保留另一可能。
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: 却不知道它从哪里来、往哪里去
  rationale: 直接呈现 πόθεν 与 ποῦ 的对应关系；“来、去”简洁自然。
- source_word: οὕτως ἐστίν
  choice: 也是这样
  rationale: 自然表达风的现象与从圣灵而生之人的类比关系。
- source_word: πᾶς ὁ γεγεννημένος
  choice: 凡……生的
  rationale: “凡”体现整体、泛指意义；“生的”在上下文中自然承接重生主题。希腊语完成时分词强调已经发生并持续有效的状态，汉语在此无需生硬添加时态词。
- source_word: ἐκ τοῦ πνεύματος（本节后半）
  choice: 从圣灵生
  rationale: ἐκ 表明来源；约翰福音3章的语境指向圣灵。“从……生”也与本章前文措辞自然衔接。
theological_decisions:
- issue: 同一希腊词 πνεῦμα 在本节中的双重含义
  choice: 前半译作“风”，后半译作“圣灵”
  alternative: 两处均译作“灵”或前半译作“灵”
  rationale: 前半因“吹”和“听见声音”明显描写风，后半因“从……生”的上下文指圣灵。现代汉语不能用一个常用词自然地兼具两义，因此正文区分，脚注说明原文双关。
- issue: οὕτως ἐστὶν πᾶς ὁ γεγεννημένος 的比较对象
  choice: 译作“凡从圣灵生的，也是这样”
  alternative: 明确解释为“圣灵在每个重生者身上的工作也是这样”或“每个重生之人的行动都像风一样”
  rationale: 原文没有进一步说明类比具体落在圣灵的工作、重生过程，还是重生之人的状态上；译文保留这种张力，不在正文中补入解释。
- issue: πνεῦμα 是否明确为圣灵
  choice: 后半使用“圣灵”
  alternative: 译作较宽泛的“灵”
  rationale: 紧接约翰福音3:5—6“从圣灵生”的语境，所指为神的灵；“圣灵”在现代汉语中清楚且不依赖宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“随自己的意思吹”保留拟人意味；分号连接风的比喻与其应用。所有脚注标记均置于正文相应位置。
