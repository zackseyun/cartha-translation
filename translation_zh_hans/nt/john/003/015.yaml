base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: zh_hans
  text: 为使凡信靠他的人都有永生[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一个信靠他的人。”
    reason: lexical_alternative
  - marker: b
    text: 有些译本将此短语译作“信入他”，但希腊文原作“在他里面”（ἐν αὐτῷ）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 为使
  rationale: 引出与上文相连的目的或结果。“为使”简洁自然，也保留了从属目的分句的作用。
- source_word: πᾶς ὁ πιστεύων
  choice: 凡信靠他的人
  rationale: 带冠词的现在分词作名词用，泛指所有相信的人。“凡……的人”在现代汉语中自然地表达其普遍、包容的范围。
- source_word: πιστεύων
  choice: 信靠
  rationale: 约翰著作中的 πιστεύω 表示相信、信赖；“信靠”在本句中既自然，又能清楚表达信仰所指向的对象，而不把现在分词误解为仅强调持续动作。
- source_word: ἐν αὐτῷ
  choice: 他
  rationale: 希腊文使用 ἐν（直译“在他里面”），但现代汉语不能自然地说“在他里面相信”。主文以“信靠他”表达该关系，并用脚注保留介词形式以及“信入他”的可能译法。
- source_word: ἔχῃ
  choice: 有
  rationale: ἵνα 所支配的现在虚拟式在汉语中由“为使……有”自然表达，无须另加可能性词语，以免让读者误以为结果本身不确定。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是准确、简明且通行的表达，既可涵盖生命无尽的延续，也保留其末世性的生命品质。
theological_decisions:
- issue: 如何表达约翰式相信用语中的 ἐν αὐτῷ
  choice: 主文译作“信靠他”，脚注说明希腊文直译为“在他里面”
  alternative: 信入他；在他里面相信
  rationale: 原文确实是 ἐν，而不是约翰著作中更常见的 εἰς，因此不能无说明地把它等同于“进入”的说法；但“在他里面相信”在现代汉语中生硬且容易误解。主文采取自然的关系性表达，脚注则保留原文介词的形式与张力。
- issue: πᾶς ὁ πιστεύων 的范围
  choice: 凡信靠他的人
  alternative: 每一个信靠他的人
  rationale: 该结构是泛指且具有包容性。“凡……的人”清楚表达所有符合这一描述者，也不加入原文没有的性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“为使”表明本节是承接上文的目的分句；“都有永生”保持简洁，不额外加入“可以”所可能带来的不确定意味。
