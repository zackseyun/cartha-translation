  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: zh_hans
  text: 你们自己为我作证，我曾说过：“我不是弥赛亚[a]，而是奉差遣在他以前来的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: 称号 Χριστός 可按传统译作“基督”；正文用“弥赛亚”凸显其受膏者称号的意义。
  - marker: b
    text: 或译：“我是受差遣在他前面的”，或“我曾受差遣在他以前来”。
    reason: Ἀπεσταλμένος εἰμί 可侧重现有的受差遣身份，也可侧重先前发生的差遣；希腊文兼有完成及持续结果的意味。
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: 你们自己
  rationale: 保留双重代词所表达的强调，突出听众本人就是见证者；现代汉语自然明白。
- source_word: μοι μαρτυρεῖτε
  choice: 为我作证
  rationale: 保留约翰福音中“作证”的见证、证言色彩；与格 μοι 表明所作的见证支持约翰先前所说的话。
- source_word: εἶπον
  choice: 我曾说过
  rationale: 指约翰先前已经明确说过的话；“曾说过”在现代汉语中自然地表达这一过去事件。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处 Χριστός 是对所期待之受膏者的称号，而非姓名式称呼；“弥赛亚”能清楚保留这一称号的语境意义。
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: 已受差遣
  rationale: 该完成时迂说结构兼有先前受差遣及其结果持续至今的意味；“已受差遣”简洁保留被动和现时有效的使命身份。
- source_word: ἔμπροσθεν ἐκείνου
  choice: 走在他前面
  rationale: 表达约翰受差遣先行、为那一位预备道路的关系，同时不把“前面”解释成地位高低。
theological_decisions:
- issue: Χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 施洗约翰否认自己是众人所期待的受膏者；译作“弥赛亚”较清楚地显示这是称号，同时以脚注保留传统译名“基督”。
- issue: Ἀπεσταλμένος εἰμὶ 所表达的差遣状态
  choice: 已受差遣走在他前面
  alternative: 我是受差遣在他前面的；我曾受差遣走在他前面
  rationale: 正文兼顾先前完成的差遣和仍然有效的使命，不额外说明差遣者是谁，也不超出经文界定约翰与“他”之间的先行关系。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“为我作证”保留见证语汇；“已受差遣走在他前面”既自然，又维持原文对约翰先行使命的简洁陈述。脚注标记均置于正文相应词句之后。
