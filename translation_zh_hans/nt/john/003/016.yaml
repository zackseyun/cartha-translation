id: JHN.3.16
reference: John 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: zh_hans
  text: 因为上帝就是这样[a]爱世人：他赐下自己的独一儿子[b]，使凡信他的人都不至灭亡，反得永生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝如此爱世人。”这里的希腊文更可能强调上帝爱的方式，即他怎样爱世人。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“独生子”；也可理解为“独特无二的儿子”。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: 就是这样
  rationale: 这里主要说明上帝爱的方式，后面的“赐下”具体解释他怎样爱；“就是这样”既自然，也避免把重点仅仅理解为爱的程度。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文的解释和论证作用。
- source_word: ἠγάπησεν
  choice: 爱
  rationale: 汉语通常不必用“爱了”标明希腊文简单过去时；上下文中的赐子行动使其历史指向清楚。
- source_word: τὸν κόσμον
  choice: 世人
  rationale: 在此处指上帝所爱的世界，重点落在人类身上；“世人”是自然庄重的现代汉语表达，同时保留其普遍范围。
- source_word: ὥστε
  choice: ：他赐下
  rationale: 冒号自然引出上帝以何种方式爱世人，也表达由此显出的实际结果，不把连接词机械直译。
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: 自己的独一儿子
  rationale: μονογενής在这里强调圣子的独特、无可相比的儿子身份；“独一儿子”比容易被仅按生育意义理解的表达更清楚，传统译法列入脚注。
- source_word: ἔδωκεν
  choice: 赐下
  rationale: “赐下”保留给予的宽广含义，不在正文中限定为差遣、道成肉身或交付受死中的某一个方面。
- source_word: ἵνα
  choice: 使
  rationale: 自然表达目的及预期结果。
- source_word: πᾶς ὁ πιστεύων
  choice: 凡信他的人
  rationale: 准确表达这一实词化分词结构的概括性和包容范围，又符合庄重自然的汉语。
- source_word: εἰς αὐτὸν
  choice: 信他
  rationale: “信他”是现代汉语表达πιστεύω εἰς关系性信靠的自然说法，避免生硬直译为“信入他”。
- source_word: μὴ ἀπόληται
  choice: 不至灭亡
  rationale: 保留目的从句中的严肃后果及虚拟语气所表达的目的，不进一步规定“灭亡”的具体方式。
- source_word: ἀλλὰ ἔχῃ ζωὴν αἰώνιον
  choice: 反得永生
  rationale: “反”清楚呈现ἀλλά的强烈转折；“得永生”是自然、凝练且广为理解的汉语。
theological_decisions:
- issue: Οὕτως表示方式还是程度
  choice: 正文采用方式义：“就是这样”
  alternative: “如此深爱”或“这么爱”
  rationale: 随后的赐子行动具体说明上帝怎样爱世人。此译法不否认爱之深厚，却不把原文主要重心从爱的行动转为程度。
- issue: μονογενής用于圣子时的含义
  choice: “独一儿子”
  alternative: “独生子”或“独特无二的儿子”
  rationale: 正文突出圣子与父独一无二的关系，不把词义缩减为生育方式；同时在脚注保留具有历史和神学重要性的传统译法。
- issue: πᾶς ὁ πιστεύων的范围
  choice: “凡信他的人”
  alternative: “每一个信他的人”
  rationale: 保留原文普遍而概括的措辞，不借翻译预先裁决有关拣选、救赎范围或人的回应等后续神学争论。
- issue: ἔδωκεν所指的赐予行动
  choice: 宽泛译作“赐下”
  alternative: “差遣”或“交付”
  rationale: 原文没有在此将给予单独限定为差遣、道成肉身或受死，因此正文保持其神学张力和包容性。
translation_notes:
  register: 采用现代标准普通话，语气庄重而便于普通读者理解。“就是这样……：”使解释关系清晰；“凡……都……”和“不至灭亡，反得永生”保持经文的概括性、对比和节奏。脚注标记均置于正文对应词语之后。
