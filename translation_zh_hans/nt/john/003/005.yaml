id: JHN.3.5
reference: John 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: zh_hans
  text: 耶稣回答说：“我实实在在地告诉你，人若不是从水和圣灵而生[b]，就不能进上帝的国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “从水和圣灵而生”有不同理解，包括指洁净和更新的意象、肉身出生与属灵出生，或指洗礼。这里照原文保留这一表达，不在正文中裁定其具体含义。“圣灵”也可译作“灵”。
    reason: 保留πνεύματος的指称可能及整组短语的解释张力。
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: 耶稣回答说
  rationale: 采用现代汉语叙事中自然、庄重的对话引介，保留ἀπεκρίθη的回应意味。
- source_word: Ἀμὴν ἀμὴν λέγω σοι
  choice: 我实实在在地告诉你
  rationale: “实实在在”保留双重Ἀμὴν的郑重强调；“告诉你”符合现代汉语习惯，也保留直接宣告的语气。
- source_word: ἐὰν μή τις
  choice: 人若不是
  rationale: 以泛指的“人”表达τις，不引入男性限定；“若不是”自然表达必要条件。
- source_word: γεννηθῇ
  choice: 而生
  rationale: 保留被动出生概念；本节没有ἄνωθεν，因此不擅自加入“重生”或“从上面生”。
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: 从水和圣灵而生
  rationale: “从……而生”贴合ἐκ与γεννάω的关系；正文保留“水和圣灵”的原有并列，不把其具体所指写入译文。
- source_word: οὐ δύναται εἰσελθεῖν
  choice: 就不能进
  rationale: 简洁、自然地表达能力上的否定及进入之意。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是准确而通行的现代汉语圣经表达，保留βασιλεία兼具统治与领域的语义张力。
theological_decisions:
- issue: πνεύματος在“水和πνεῦμα”中的所指
  choice: 圣灵
  alternative: 灵，指一般的属灵因素或人的灵
  rationale: 约翰福音的上下文较可能指上帝的灵；中文必须通过“圣灵”或“灵”作出一定词汇选择，正文采用较可能的“圣灵”，并以脚注保留另一种可能。
- issue: “从水和圣灵而生”的具体含义
  choice: 正文照原文保留统一而未加解释的表达
  alternative: 洁净与更新的意象；肉身出生与属灵出生；特指洗礼
  rationale: 原文没有在本节明确裁定这些解释，因此不在正文中加入宗派性或过度确定的说明，脚注列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我实实在在地告诉你”保留耶稣双重阿们公式的郑重感；避免使用较生硬的“无法进入”，以“不能进”呈现自然口语与经文庄重感的平衡。仅设[b]脚注，因为所给英文资料中[a]标记与脚注内容明显错位；中文稿将相关解释统一置于实际对应短语之后。
