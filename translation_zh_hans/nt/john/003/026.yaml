source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: zh_hans
  text: 他们来到约翰那里，对他说：“拉比，从前在约旦河对岸和你在一起、你为他作过见证[a]的那一位——你看，这个人[b]正在施洗，众人都往他那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你向他作过见证。”原文的与格结构可有这两种理解。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他。”原文“这个人”带有更明确的指示意味，可能表现说话者刻意强调的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: 他们来到约翰那里
  rationale: 按叙事视角将 ἔρχομαι 译为“来到”，自然表达他们趋近约翰。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留犹太称谓及《约翰福音》的语言特色；不直接意译为“老师”。
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: 从前在约旦河对岸和你在一起……的那一位
  rationale: “那一位”自然对应关系代词所指的人；“约旦河对岸”准确保留地理表达，“从前”则体现未完成过去时所述的先前情形。
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: 你为他作过见证
  rationale: “作见证”保留约翰著作中 μαρτυρέω 的关键词联系；“作过”体现完成时所指先前发生而仍与当前有关的见证。与格关系可能表示向他或为他作见证，故用脚注保留另一理解。
- source_word: ἴδε οὗτος
  choice: 你看，这个人
  rationale: “你看”保留引人注意的语气；“这个人”体现 οὗτος 的指示性和说话者较为尖锐的强调。
- source_word: βαπτίζει
  choice: 正在施洗
  rationale: 进行体自然表达此处现在时所报告的持续活动。
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: 众人都到他那里去了
  rationale: “众人都”保留带有夸张色彩的概括，不将 πάντες 误解为严格无一例外；“到……那里去”符合门徒向约翰报告他人转向耶稣时的视角。
theological_decisions:
- issue: 约翰著作中的见证用语
  choice: 作见证
  alternative: 证明；作证
  rationale: “作见证”既是现代中文可理解的表达，也较稳定地保存 μαρτυρέω 在《约翰福音》中的反复用语及其神学分量。
- issue: 与格关系 ᾧ 的指向
  choice: 为他作过见证
  alternative: 向他作过见证；为那人所作的见证
  rationale: 希腊文与格可容许不同关系理解；正文采用自然且符合上下文的“为他”，脚注说明“向他”的可能，避免把原文歧义完全抹平。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“拉比”“作见证”“施洗”延续经文中的关键宗教词汇；破折号呈现门徒先以关系从句指认耶稣、随后突然以“你看”转入抱怨重点的语势。
