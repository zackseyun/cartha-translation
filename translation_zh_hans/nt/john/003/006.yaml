  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: zh_hans
  text: 从肉身而生的就是肉身[a]；从圣灵而生的就是灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉身”在某些语境中可指堕落或有罪的人性；但这里主要是与从圣灵而生相对。
    reason: lexical_alternative
  - marker: b
    text: 也可意译为“从圣灵而生的具有属灵的性质”。希腊原文直译为“就是灵”，强调与“肉身”在性质上的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: 从……生的
  rationale: 中性单数冠词加完成时被动分词在这里作概括性陈述；“从……生的”自然表达出生的来源，并保留普遍、类别性的语气。
- source_word: ἐκ
  choice: 从
  rationale: 在出生语境中表示来源；现代汉语用“从……生”简洁自然。
- source_word: σάρξ / σαρκὸς
  choice: 肉身
  rationale: 保留约翰原文中“肉身”与“灵”的对应和张力。此处重点是天然的人类出生与从圣灵而生的对比，不宜直接窄化为“罪性”。
- source_word: πνεύματος
  choice: 圣灵
  rationale: 结合紧邻语境，带冠词的该词指作为新生来源的圣灵；汉语以“圣灵”明确其所指。
- source_word: πνεῦμα
  choice: 灵
  rationale: 谓语名词不带冠词，具有性质或类别意味。“灵”既贴近原文名词形式，也避免直接等同于作为来源的圣灵；“属灵的”可作为较解释性的译法。
- source_word: ἐστιν
  choice: 就是
  rationale: “就是”自然保留原文简洁、断言式的系词结构，并突出两组对应关系。
theological_decisions:
- issue: σάρξ在第一分句中的含义
  choice: 译作“肉身”，主要指天然、属人的生命领域
  alternative: “人的本性”或“罪性”
  rationale: σάρξ在某些语境可有伦理性的负面含义，但本节直接对比人的自然出生与从圣灵而生。译成“罪性”会将经文限定在较窄的神学解释上；“肉身”则保留原文张力。
- issue: 第二分句谓语πνεῦμα的所指和性质
  choice: 译作“灵”
  alternative: “圣灵”或“属灵的”
  rationale: 这里的谓语πνεῦμα不带冠词，较自然地表达从圣灵而生者所得生命的性质。“灵”保留原文的名词形式和定性意味，同时不把所生的直接等同于圣灵本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以两个对称分句保留原文格言式结构。用“圣灵”明确第一个πνεῦμα在语境中的来源性所指，用“灵”保留第二个πνεῦμα的定性含义和原文的神学张力。
