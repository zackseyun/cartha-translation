  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: zh_hans
  text: 因为那时约翰还没有被投入监牢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指施洗者约翰。
    reason: 交叉参照及人物身份说明；正文保留原文较简略的称呼。
lexical_decisions:
- source_word: οὔπω
  choice: 还没有
  rationale: 表示截至叙事所指的时间，该事尚未发生；“还没有”是自然、准确的现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: 在此引出解释性的背景，说明前文所述情形何以可能；“因为”清楚保留其解释作用。
- source_word: ἦν βεβλημένος
  choice: 被投入
  rationale: 这是迂回构成的过去完成时被动形式，表示在叙事参照点以前尚未发生的被动动作。汉语借“那时……还没有”自然表达其先后关系；“投入”也保留 βάλλω 的方向性和力度。
- source_word: εἰς τὴν φυλακήν
  choice: 监牢
  rationale: φυλακή 在这里指关押之处或监禁状态；结合 εἰς，以“投入监牢”自然表达进入监禁之中。
- source_word: ὁ Ἰωάννης
  choice: 约翰
  rationale: 原文只称“约翰”，上下文可确定其身份；正文不增添原文未明说的称号。
theological_decisions:
- issue: ὁ Ἰωάννης 的身份说明
  choice: 正文译作“约翰”
  alternative: 正文译作“施洗者约翰”或“施洗约翰”
  rationale: 上下文所指确为施洗者约翰，但希腊文本本节只写“约翰”。为避免把解释加入正文，保留简单人名，并用脚注说明身份。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“那时”虽无独立对应词，却将希腊语过去完成意义在汉语中明确表达；句首“因为”保留 γὰρ 与上下文的解释关系。
