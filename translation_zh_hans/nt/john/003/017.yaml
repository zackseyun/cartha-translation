source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: zh_hans
  text: 因为上帝差遣他的儿子进入世上，不是要他审判世人[a]，而是要世人借着他得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“定世人的罪”。希腊语动词在本语境中可以这样作较窄的理解，但其基本含义是“审判”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……不是
  rationale: γάρ承接并解释上一节；“因为”自然保留这一话语关系，οὐ则否定“差遣”的目的陈述。
- source_word: ἀπέστειλεν
  choice: 差遣
  rationale: 既准确表达“派出、差去”，又保留约翰福音中上帝差遣子的主题，比普通的“送”更庄重自然。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 定冠词加θεός在此指独一的上帝；现代汉语中直接译为“上帝”。
- source_word: τὸν υἱὸν
  choice: 子
  rationale: 原文是“那子”，没有明说“他的”；汉语在上帝与子的语境中用“子”可保留其称号意味，又避免添加所有格。
- source_word: εἰς τὸν κόσμον
  choice: 进入世上
  rationale: εἰς表达进入某一领域的方向；“进入世上”自然体现这一动态含义。
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: 要他审判世人
  rationale: ἵνα表目的；κρίνω的基本义较宽，为“审判”，不在正文中缩窄为“定罪”。κόσμος在这里作为审判和拯救的对象，主要指世上的人，译为“世人”符合现代汉语且避免把无生命的世界说成得救。
- source_word: ἀλλ’ ἵνα
  choice: 而是要
  rationale: 清楚保留两个目的从句之间的强烈对比，并使汉语结构平行自然。
- source_word: σωθῇ
  choice: 得救
  rationale: 被动虚拟式表达目的中的受拯救；“得救”简洁保留救援与救恩的宽广含义。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 同一希腊词在两处保持同一译法；在本句中其所指是作为审判或拯救对象的人类世界。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示途径或中介；“借着他”准确保留中介意义而不过度解释。
theological_decisions:
- issue: κρίνῃ与σωθῇ对照时的含义
  choice: 审判
  alternative: 定罪
  rationale: κρίνω本义范围较宽，可指审判；上下文虽可支持带有不利判决意味的“定罪”，正文仍保留较宽的词义及神学张力，并在脚注列出较窄的语境译法。
- issue: κόσμος的汉语表达
  choice: 世人
  alternative: 世界
  rationale: κόσμος可指世界或人类；这里它是能被审判并得救的对象，“世人”在汉语中更自然。此选择是语境化表达，并不把经文的范围缩减为某一特定群体。
- issue: τὸν υἱὸν是否补出所有格
  choice: 子
  alternative: 他的儿子
  rationale: 原文只有定冠词而无明确所有格。译作“子”保留称号性和父子关系的语境含义，不额外补入原文未明说的成分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不是要……而是要……”呈现两个ἵνα目的从句的平行对比；脚注标记[a]已置于正文相应位置。
