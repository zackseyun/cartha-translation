base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: zh_hans
  text: 有一个法利赛人，名叫尼哥底母，是犹太人[a]的官长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译为“犹太地人”。这个希腊词可泛指犹太人，在某些语境中也可特指犹太地人或犹太权威人士。
    reason: 保留Ἰουδαίων在约翰福音语境中族群、地域及权威群体之间的真实歧义。
lexical_decisions:
- source_word: Ἦν δὲ
  choice: 有一个
  rationale: ἦν引入人物，δέ轻微承接并推进叙事；现代汉语以“有一个”自然引出人物，无须另加带明显时间意味的“那时”或生硬的“而”。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处指具体男性，但后文“法利赛人”和姓名已明确其身份；“有一个……人”符合现代汉语表达。
- source_word: ἐκ τῶν Φαρισαίων
  choice: 法利赛人
  rationale: ἐκ加属格表示属于该群体。汉语直接称“一个法利赛人”自然、准确，已包含“来自／属于法利赛人群体”的意思。
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: 名叫尼哥底母
  rationale: 这是介绍姓名的惯用结构；“名叫”简洁自然，并保留人名的传统中文译法。
- source_word: ἄρχων
  choice: 领袖
  rationale: 该词指拥有权威或领导地位的人。“领袖”比“统治者”更符合此处犹太群体领导层的语境，同时不进一步断定其具体职位。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: Ἰουδαῖοι可泛指犹太人，也可能按语境指犹太地区的人或犹太权威人士。正文采用较宽泛、自然的“犹太人的”，并在脚注保留另一种可能。
theological_decisions:
- issue: 约翰福音中Ἰουδαίων的范围
  choice: 犹太人的
  alternative: 犹太地区之人的；犹太人中的掌权者
  rationale: 本节将尼哥底母描述为法利赛人和ἄρχων，语境倾向犹太群体的领导层，但希腊词本身仍可具有族群、宗教或地域含义。正文不把它收窄为特定地域或机构，脚注说明语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“尼哥底母”“法利赛人”等通行圣经专名；不把“领袖”具体化为公会成员，以免超出本节原文。
