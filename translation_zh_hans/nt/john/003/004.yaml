id: JHN.3.4
reference: John 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: zh_hans
  text: 尼哥底母对他说：“人已经老了，怎么能出生呢？难道他还能第二次进入母腹再出生吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: 对他说
  rationale: λέγει是叙事中的历史现在时；现代汉语叙事无须标明过去时，用“对他说”自然传达其叙事功能。
- source_word: Νικόδημος
  choice: 尼哥底母
  rationale: 采用现代中文圣经传统中通行且易辨识的人名音译。
- source_word: Πῶς δύναται
  choice: 怎么能
  rationale: 自然表达对可能性的疑问，也保留尼哥底母难以置信的语气。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处为泛指的单数名词；汉语“人”自然保留其普遍、代表性的含义，无须加入性别限定。
- source_word: γεννηθῆναι
  choice: 出生
  rationale: 在母腹语境中，γεννάω的被动式指“出生”；不在此词本身加入“重生”或“再生”的解释。
- source_word: γέρων ὤν
  choice: 已经老了
  rationale: 以自然汉语表达伴随情形；“已经”凸显年老与再次出生之间的反差。
- source_word: μὴ δύναται
  choice: 难道他还能……吗
  rationale: μή引出的问句预期否定回答；“难道……还……吗”准确传达这种反问和惊疑。
- source_word: κοιλίαν
  choice: 母腹
  rationale: 与“母亲”连用时明确指母腹或子宫；“母腹”庄重自然，也适合经文语体。
- source_word: δεύτερον
  choice: 第二次
  rationale: 明确保留“第二次”的字面意义，突显尼哥底母把耶稣的话理解为再次肉身出生。
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: 进入……再出生
  rationale: 保留两个并列不定式的动作次序和具体形象；“再”在汉语中自然连接第二个动作。
theological_decisions:
- issue: 泛指名词ἄνθρωπος的译法
  choice: 人
  alternative: 一个男人
  rationale: 希腊词虽为阳性单数，但在这里具有泛指作用。现代汉语“人”既忠实表达普遍指称，也不会不必要地将范围限定为男性。
- issue: 是否从约翰福音3:3引入“重生”或“再生”的措辞
  choice: 出生……第二次……再出生
  alternative: 重生／再生
  rationale: 本节明确使用δεύτερον（“第二次”），呈现尼哥底母的字面理解。译文不把上一节ἄνωθεν的歧义预先带入本句，从而保留叙事中的误解与神学张力。
- issue: μή疑问句所预期的回答
  choice: 难道他还能……吗
  alternative: 他不能……是不是？
  rationale: 原文问题预期否定回答。“难道……吗”符合现代汉语表达，并保留尼哥底母的惊疑，不将其改成单纯陈述。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“母腹”较“子宫”更符合经文语体，“难道……还能……吗”保留反问力度。原文没有需要另设脚注才能保存的实质性异文或歧义，因此正文不设脚注。
