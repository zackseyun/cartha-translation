base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: zh_hans
  text: 差役回答说：“从来没有人像他这样说话！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 回答说
  rationale: 该动词在叙事对话中表示“回答”；“回答说”符合现代汉语圣经叙事的自然表达。
- source_word: οἱ ὑπηρέται
  choice: 差役
  rationale: 上下文指祭司长和法利赛人派去捉拿耶稣的执行人员（7:32、45）。“差役”既体现受命执行公务的身份，又避免把“圣殿警卫”这一上下文推断直接写入正文。
- source_word: Οὐδέποτε
  choice: 从来没有
  rationale: 准确表达截至说话时任何时候都未发生的绝对否定，并符合自然汉语。
- source_word: ἐλάλησεν οὕτως
  choice: 像他这样说话
  rationale: οὕτως表示方式。“像他这样说话”在汉语中自然地传达比较含义；补出“他”使所指清楚，但没有增加新的实质信息。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处单数ἄνθρωπος具有代表性、泛指作用。现代汉语“没有人”自然保留泛指意义；汉语名词本身不标语法性别，若译作“男人”反而会不必要地把范围限于男性。
theological_decisions:
- issue: ἄνθρωπος的单数代表性与性别表达
  choice: 没有人
  alternative: 没有一个人／从来没有一个男人
  rationale: 希腊文用阳性单数ἄνθρωπος作泛指。汉语“人”不标语法性别，能准确表达其代表性范围；“男人”会产生仅指成年男性的额外限制。
- issue: 对耶稣说话方式的强调
  choice: 像他这样说话
  alternative: 这样说过话
  rationale: 补出比较对象“他”使汉语完整自然，并保留原文对耶稣独特说话方式的惊叹；不进一步解释其权柄或神学原因。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“差役”与本章上下文衔接；引语用感叹号呈现原话中强烈的惊叹语气，原文虽无现代标点，但句意明显带有惊异和强调。
