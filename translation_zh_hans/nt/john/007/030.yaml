source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: zh_hans
  text: 于是，他们试图抓住他[a]，却没有人向他下手，因为他的时候还没有到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抓住”也可译作“逮捕”或“捉拿”；原文动词基本意为抓住、擒住，在这里很可能含有拘捕之意。
    reason: lexical_alternative
  - marker: b
    text: “他的时候”是约翰福音中反复出现的说法，指耶稣使命中神所安排的时刻，尤其与他的受难、死亡、复活和得荣耀有关。
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: 想要
  rationale: 未完成时描写当时持续的意图或企图；结合后接不定式，用“想要”自然表达“设法、企图”的含义，同时不把动作说成已经完成。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并表达由前述言论引出的叙事结果；“于是”符合现代汉语叙事语流。
- source_word: πιάσαι
  choice: 抓住
  rationale: 保留动词“抓、擒住”的基本意义；上下文可指拘捕，但原词本身未明确采用法律术语，故在脚注说明这一可能。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 直接、自然地对应否定代词，保持主语范围不受限制。
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: 下手拿他
  rationale: 以自然汉语表达“把手加在他身上”这一带有捉拿意味的习语，并保留与前句“抓住”的语义呼应。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚引出无人动手的原因。
- source_word: οὔπω
  choice: 还没有
  rationale: 自然表达截至该叙事时点尚未发生。
- source_word: ἐληλύθει
  choice: 到
  rationale: 希腊语过去完成时表示在当时之前尚未来到；汉语借“还没有到”自然呈现这一时序。
- source_word: ἡ ὥρα αὐτοῦ
  choice: 他的时候
  rationale: 保留约翰福音反复出现的“时候”意象及其神学含义，又避免中文“他的时辰”可能产生的生硬或宿命色彩。
theological_decisions:
- issue: “他的时候”（ἡ ὥρα αὐτοῦ）在约翰福音中的含义
  choice: 正文保留“他的时候”，不在正文中具体限定其所指。
  alternative: 译作“为他所定的时候”或“他受死的时候”。
  rationale: 该短语在约翰福音中指向耶稣使命中按神安排而来的决定性时刻，尤其涉及受难、死亡、复活与得荣耀；但本节没有把它仅仅界定为被捕或死亡，因此正文保留其张力，脚注提供必要背景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；“下手拿他”比逐字译作“把手放在他身上”更符合汉语习惯，也保留了实际捉拿的语境。正文与脚注标记[a]、[b]完全对应。
