  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: zh_hans
  text: 他们回答他说：“难道你也是从加利利来的吗？你去查考，就会知道，没有先知是从加利利兴起的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兴起”也可译作“被兴起”，可能含有先知由上帝兴起的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 他们回答他说
  rationale: 保留约翰叙事中“回答并说”的双动词句式，同时采用现代汉语中自然、庄重的表达。
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: 难道你也是从加利利来的吗？
  rationale: 用“难道……吗”体现 μή 疑问句预期否定回答的反问和轻蔑语气，同时保持汉语自然。
- source_word: ἐραύνησον καὶ ἴδε
  choice: 你去查考，就会知道
  rationale: 将两个命令式按汉语惯用的动作—结果关系表达；“查考”体现认真检索、考察的含义，“知道”传达 ἴδε 在此处“查明”的语用功能。
- source_word: προφήτης
  choice: 先知
  rationale: 原文无冠词，此处泛指先知，并非特指某一位末世性的“那先知”。
- source_word: οὐκ ἐγείρεται
  choice: 没有……兴起
  rationale: “兴起”既自然表达先知出现，也保留该动词可能暗含蒙上帝兴起的意味，而不在正文中把这一层明确化。
theological_decisions:
- issue: 否定式反问的语气
  choice: 难道你也是从加利利来的吗？
  alternative: 你不也是从加利利来的吧？
  rationale: μή 表明说话者预期否定回答。“难道”在现代汉语中能自然传达其反问与排斥语气，且不把语气解释得过满。
- issue: ἐγείρεται 是否暗示上帝兴起先知
  choice: 兴起
  alternative: 被兴起
  rationale: 中间/被动形式可理解为“兴起、出现”，也可能保留神圣被动的意味。正文采用不明说施事者的“兴起”，以保存这种张力；脚注说明另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“难道……吗”保留原文预期否定回答的反问力度；“查考”适合经文语境但仍为当代读者熟悉。脚注标记置于相关分句之后。
