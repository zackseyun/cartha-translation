base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: zh_hans
  text: 正因如此，摩西把割礼赐给了你们——其实割礼并非源于摩西[a]，而是源于先祖——而你们在安息日也给一个男子行割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并不是因为割礼源于摩西，而是源于先祖。”这句插入语说明，割礼并非始于摩西，而是始于摩西以前的先祖。
    reason: 保留οὐχ ὅτι可作更正性说明或原因表达的句法可能，并交代插入语的历史来源含义。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 保留这一连接语的因果和解释作用，并以现代汉语自然承接上文。
- source_word: Μωϋσῆς δέδωκεν ὑμῖν
  choice: 摩西把……给了你们
  rationale: 以自然汉语表达完成时所指的既成授予；上下文已表明这项规定对听众仍具现实意义，无须另加解释性词语。
- source_word: τὴν περιτομήν
  choice: 割礼
  rationale: 采用通行且准确的圣经术语，所指是割礼这一制度和礼仪。
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: 其实割礼并非源于摩西，而是源于先祖
  rationale: 将插入语明确处理为对历史源头的说明；“源于”自然表达ἐκ的来源含义，“先祖”保留其对早于摩西的族长先辈之指向，同时不作过度具体化。
- source_word: ἐν σαββάτῳ
  choice: 在安息日
  rationale: 按时间用法自然翻译，表达一般性的安息日实践，而非某一个特定日期。
- source_word: περιτέμνετε ἄνθρωπον
  choice: 给人行割礼
  rationale: 表达第二人称复数现在时所指的惯常行为；“行割礼”本身已限定接受者为男性，汉语用“人”较自然，也未改变实际所指。
theological_decisions:
- issue: “先祖”（τῶν πατέρων）的所指
  choice: 保留“先祖”，理解为摩西以前领受割礼的族长先辈
  alternative: 泛指以色列人的历代祖先
  rationale: 经文的论证重点是割礼早于摩西；译文保留历史与律法层面的张力，不在正文中擅自补入亚伯拉罕等具体名字。
- issue: 插入语与“摩西把割礼给了你们”的关系
  choice: 译作对割礼来源的更正说明：“其实……并非……而是……”
  alternative: 译作原因结构：“并不是因为割礼源于摩西，而是因为源于先祖”
  rationale: οὐχ ὅτι可以引出更正性的说明，也可能被理解为原因表达；正文采用更符合此处插入语功能和现代汉语习惯的前者，脚注保留后者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“正因如此”保持论证衔接；破折号标示原文插入语。“给人行割礼”符合当代汉语表达，避免生硬直译，同时不淡化该礼仪针对男性的事实。
