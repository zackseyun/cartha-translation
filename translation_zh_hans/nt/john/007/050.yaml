  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: zh_hans
  text: 尼哥底母，就是先前曾来见耶稣的那个人，也是他们中的一员，对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用叙事性现在时；现代汉语叙事中用“说”自然，也无须标明时态。句末冒号承接下一节的话。
- source_word: Νικόδημος
  choice: 尼哥底母
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: πρός加宾格用于言说动词后，表示说话的对象；“对他们说”是自然、准确的现代汉语表达。
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: 就是先前曾来见耶稣的那个人
  rationale: 冠词加分词短语作为同位说明，用“就是……的那个人”清楚标明其识别作用。πρότερον译作“先前”；结合约3:1–2，αὐτόν所指为耶稣。中文若仅作“来见他的那个人”，代词可能误指尼哥底母本人，故按上下文明示“耶稣”。
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: 也是他们中的一员
  rationale: 保留该分词结构提供的身份背景，不将其解释为因果关系；“一员”自然表达他属于这一群体。
theological_decisions:
- issue: αὐτόν在“先前曾来见……”中的指代
  choice: 正文明确译为“耶稣”
  alternative: 形式上保留为“他”
  rationale: 约3:1–2明确记载尼哥底母来见耶稣。现代汉语在此若照字面使用“他”，容易因最近先行词“尼哥底母”而产生错误指代；明示“耶稣”是语境澄清，并未加入新的神学解释。
- issue: εἷς ὢν ἐξ αὐτῶν是否带有因果意味
  choice: 作为身份背景译为“也是他们中的一员”
  alternative: 译作“因为他也是他们中的一员”
  rationale: 原文分词本身未明确标示因果关系，因此不增添“因为”。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。保留原文先介绍尼哥底母、再以两个背景成分说明其身份、最后引出发言的结构；为避免中文代词误指，按清楚的篇章语境将αὐτόν明示为“耶稣”。
