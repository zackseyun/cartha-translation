  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: zh_hans
  text: 于是，人群中有些人听见这些话，就说：“这位真是那位先知[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位先知”很可能指人们所期待的、像摩西一样的先知（见申命记18:15）；但也有人认为，这里是较宽泛地说“那先知”。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: 人群中有些人
  rationale: 明确表达介词短语的部分含义：说话的是人群中的一部分，而不是全体；现代汉语自然清楚。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，既保留连接作用，又比“因此”更符合此处群众听后作出反应的语境。
- source_word: ἀκούσαντες
  choice: 听见……就
  rationale: 把不定过去时分词所表达的先行动作自然译成汉语连动结构，表明他们听见之后便作出回应。
- source_word: τῶν λόγων τούτων
  choice: 这些话
  rationale: 指耶稣刚才所说的话；译法直接、自然。
- source_word: ἔλεγον
  choice: 说
  rationale: 汉语中的“说”可自然概括当时人群中持续或纷纷出现的言论；若译作“不断说”会过度强调希腊语未完成时的反复意味。
- source_word: Οὗτός ἐστιν
  choice: 这位……是
  rationale: “这位”保留指向耶稣的鲜明指示意味，同时比指人的“这个”更庄重自然。
- source_word: ἀληθῶς
  choice: 真是
  rationale: 准确表达确认其真实身份的强调语气，符合现代汉语直接引语。
- source_word: ὁ προφήτης
  choice: 那位先知
  rationale: 定冠词在语境中带有特指和称号意味；“那位先知”可指向群众所期待的特定先知，同时不把其身份直接等同于弥赛亚。
theological_decisions:
- issue: “ὁ προφήτης”所暗示的身份
  choice: 译作“那位先知”，保留其称号式和特指意味
  alternative: 译作泛指的“一个先知”或直接释为“弥赛亚”
  rationale: 约翰福音的语境很可能暗指申命记18:15中像摩西的先知，但本节没有明确说明该称号与弥赛亚完全等同。译文保留这种神学张力，不作超出原文的身份判定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”自然承接上文；“这位”避免对人的生硬指称；脚注保留对“那位先知”身份的解释空间。
