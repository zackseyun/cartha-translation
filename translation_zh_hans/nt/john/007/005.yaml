  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: zh_hans
  text: 因为连他的弟兄们也不信他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为连他的弟兄们当时也一直不信他。”希腊文未完成时可以表示过去持续的状态；正文按自然汉语译作“不信”。
    reason: 语法体态的另一种译法
lexical_decisions:
- source_word: οὐδὲ
  choice: 连……也不
  rationale: 此处不是单纯并列，而是加强否定；“连……也不”自然传达“甚至不”的强调意味。
- source_word: γὰρ
  choice: 因为
  rationale: γὰρ说明前文所述情况的原因；“因为”在现代汉语中能清楚、自然地保留这一解释关系。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的弟兄们
  rationale: 阳性复数ἀδελφοί在本叙事语境中指耶稣的男性兄弟或男性亲属；“弟兄们”保留原文的性别指向，也采用庄重、通行的圣经语体。
- source_word: ἐπίστευον
  choice: 信
  rationale: 未完成时可表达过去持续或惯常的状态，但汉语“信”在“因为”引出的过去叙事背景中无需添加生硬的进行标记，也能自然涵盖当时持续不信的状态。
- source_word: εἰς αὐτόν
  choice: 信他
  rationale: πιστεύω εἰς在约翰著作中表示将信靠指向某人；现代汉语“信他”自然表达对耶稣的相信与信靠，而不把εἰς机械译为方位介词。
theological_decisions:
- issue: 约翰用语πιστεύω εἰς αὐτόν的含义
  choice: 信他
  alternative: 信靠他
  rationale: “信他”保留对耶稣个人的相信和信靠，符合现代汉语习惯；经文只陈述他的弟兄们当时缺乏这种信，并未进一步说明原因或作出后来的教义判断。
- issue: ἀδελφοί所指的亲属关系
  choice: 弟兄们
  alternative: 兄弟们／男性亲属
  rationale: 原文确指男性多人，但单凭本节不能裁定他们与耶稣的精确亲属关系。“弟兄们”保留这一语义范围，不在译文中加入特定教派对其亲属身份的解释。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“因为”承接前文并说明缘由；“连……也不”保留强调。“弟兄们”比“兄弟姐妹”更符合原文阳性复数，同时避免武断界定具体亲属关系。
