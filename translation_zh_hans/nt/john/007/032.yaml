  source_fidelity: 译文准确传达了原文的叙事关系：法利赛人听见群众就耶稣所作的低声、不公开且可能不满的议论；祭司长和法利赛人随后差派执行人员，目的在于捉拿他。“这样低声议论他”自然承接ταῦτα，虽未逐字保留复数“这些事”，但没有损失实质含义。“去捉拿他”恰当表达ἵνα加虚拟式的目的及πιάζω的抓捕意味。
  naturalness: 行文符合现代汉语庄重叙事语体，句子流畅、逻辑清楚。“祭司长和法利赛人就派差役去捉拿他”简洁自然；“差役”带有适度的历史叙事色彩，在此处可理解为受差派执行公务的人员。
