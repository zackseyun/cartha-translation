source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: zh_hans
  text: 法利赛人听见众人这样低声议论他[a]，祭司长和法利赛人就派差役[b]去捉拿他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低声议论”也可译作“窃窃私语”或“抱怨”。希腊语可指压低声音、并可能带有不满的谈论。
    reason: lexical_alternative
  - marker: b
    text: “差役”也可译作“卫兵”或“圣殿警卫”，指受犹太领袖差派、执行公务的人员。
    reason: lexical_alternative
  - marker: c
    text: “捉拿”也可译作“逮捕”。希腊语较直译为“抓住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: 听见
  rationale: 此处表示法利赛人得知或听到群众的议论；“听见”简明自然，也符合不定过去时在叙事中的用法。
- source_word: τοῦ ὄχλου
  choice: 众人
  rationale: ὄχλος指聚集的群众；“众人”符合现代汉语叙事习惯，也不显古奥。
- source_word: γογγύζοντος
  choice: 低声议论
  rationale: 该词表示压低声音的议论，常可带不满意味；“低声议论”保留其隐约、私下交谈的语气，而不把负面意味定得过重。
- source_word: περὶ αὐτοῦ ταῦτα
  choice: 这样……议论他
  rationale: περὶ αὐτοῦ表示“关于他”，ταῦτα指前述这些话或事情；汉语用“这样议论他”自然地承接上文，同时保留所议论的对象和内容。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数形式在当时语境中指祭司阶层的领袖，并非多位同时在任的大祭司；“祭司长”是准确而通行的译法。
- source_word: ἀπέστειλαν
  choice: 派
  rationale: 表示奉命差遣人员执行任务；“派”比“差遣”更符合现代汉语，同时保留官方行动的意味。
- source_word: ὑπηρέτας
  choice: 差役
  rationale: 在《约翰福音》的语境中指受犹太领袖指挥、执行公务的人员；“差役”既体现其隶属和执法职能，又不过度限定为某一种现代警务机构。
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: 去捉拿他
  rationale: ἵνα加虚拟式表达目的，πιάζω本义为抓住、擒拿；“去捉拿他”自然表达差派的目的，并保留实际拘捕的动作感。
theological_decisions:
- issue: ὑπηρέτας的机构身份
  choice: 祭司长和法利赛人手下执行公务的“差役”
  alternative: 圣殿卫兵；侍从
  rationale: 经文明确这些人受宗教领袖差派去捉拿耶稣，但没有在词形本身明确规定其具体组织名称。“差役”保留官方执行人员的身份，不额外断定其制度细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“低声议论”避免把群众的话一概解释为明确抱怨；“差役”体现官方身份而不作过度制度化说明；“捉拿”保留原文动作性。所有脚注标记均紧随其所说明的词语。
