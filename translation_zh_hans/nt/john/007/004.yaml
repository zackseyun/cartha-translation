  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: zh_hans
  text: 因为没有人暗中做事，却又想公开露面[a]。你若做这些事，就向世界显明自己吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公开露面”或译“公开为人所知”或“处于公开状态”。希腊语在这里强调公开、不隐藏的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: 因为没有人
  rationale: 保留γάρ承接上文的解释作用；“没有人”自然表达概括性的否定。
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: 暗中行事
  rationale: ἐν κρυπτῷ表示隐秘、不公开；中文用“暗中行事”简洁自然，也保留泛指意味。
- source_word: καὶ ζητεῖ αὐτὸς
  choice: 一面又想让自己
  rationale: 用“一面……一面又……”表达暗中行事与追求公开显露之间的反差；“自己”体现αὐτός对同一主体的强调。
- source_word: ἐν παρρησίᾳ εἶναι
  choice: 公开显露
  rationale: 此处παρρησία主要指公开、可见的状态，而非言语上的胆量；“公开显露”符合兄弟们要求耶稣公开行动的语境。
- source_word: εἰ ταῦτα ποιεῖς
  choice: 你若做这些事
  rationale: 保留条件句形式及ταῦτα的复数指代，不把条件所含的语气解释得过强。
- source_word: φανέρωσον σεαυτὸν
  choice: 显明自己吧
  rationale: φανερόω在此要求公开呈现自己；“显明自己”直接、庄重，也保留命令语气。
- source_word: τῷ κόσμῳ
  choice: 向世人
  rationale: κόσμος在此既涉及公开对象，也带有约翰著作中“世界”的词汇回响；“世人”在现代中文中自然地表达向世界上的人公开自己。
theological_decisions:
- issue: κόσμος在约翰语境中的含义
  choice: 世人
  alternative: 世界／公众
  rationale: “公众”会削弱约翰用κόσμος形成的文学和神学回响；“向世界显明自己”在中文略显生硬，“向世人”既适合当前公开显露的语境，也不过度限定其神学含义。
- issue: ἐν παρρησίᾳ εἶναι是公开可见还是放胆说话
  choice: 公开显露
  alternative: 公开为人所知／坦然无惧
  rationale: 上下文聚焦耶稣的作为能否公开被看见，因此采用公开可见的意义，但以脚注保留“公开为人所知”等合理译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“一面……一面又……”清楚呈现两种行为之间的张力；句末“吧”使兄弟们带有催促意味的命令在中文中自然。脚注标记置于整节末尾，并与脚注内容对应。
