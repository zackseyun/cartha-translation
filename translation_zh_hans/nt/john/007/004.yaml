  timestamp: '2026-07-14T03:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: 原译基本准确传达了“没有人暗中做事，却寻求公开”的常理性论述，以及随后要求其向κόσμος显明自己的命令。不过，“想让自己公开显露”带有不必要的使役色彩，且中文略显拗口；“向世人”较“向世界”弱化了原文κόσμος在约翰文本中的用词连贯性。
  naturalness: “一面……一面又……”可以表达并列，但本句以“却又”呈现暗中行事与公开露面的反差更自然。“公开露面”是现代普通话中对本处公开可见／为人所知含义的自然表达。
  terminology: 将τῷ κόσμῳ译为“向世界”保留约翰福音中“世界”的关键词，并在当前语境仍可自然理解为向公众显露。φανέρωσον σεαυτόν译为“显明自己”恰当。脚注应紧邻其所说明的“公开露面”，而非置于全节末。
  issues:
  - severity: medium
    issue: “想让自己公开显露”措辞不够自然，并略带使役意味。
    rationale: ζητεῖ…εἶναι意为“寻求／想要处于公开状态”，并非明确说“使自己显露”。改为“想公开露面”既保留公开可见的含义，也更符合现代汉语。
  - severity: low
    issue: “向世人”未充分保留κόσμος的约翰式关键词。
    rationale: 本处虽有公众的即时语境，但直译“向世界”在现代汉语中通顺，并更好地维持与约翰福音中κόσμος用语的连贯性。
  - severity: low
    issue: 脚注标记没有紧邻所注释的词语。
    rationale: 脚注说明的是ἐν παρρησίᾳ εἶναι的译法，应置于“公开露面”之后，以明确锚定对象。
  revised_text: 因为没有人暗中做事，却又想公开露面[a]。你若做这些事，就向世界显明自己吧。
