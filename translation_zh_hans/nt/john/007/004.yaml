revisions:
- from: 因为没有人一面暗中行事，一面又想让自己公开显露。你若做这些事，就向世人显明自己吧。[a]
  to: 因为没有人暗中做事，却又想公开露面[a]。你若做这些事，就向世界显明自己吧。
  rationale: 修订以“暗中做事，却又想公开露面”自然表达原文两个并列谓语及其语境中的反差，避免给ζητεῖ…εἶναι加入使役含义。将“向世人”改为“向世界”，以保留κόσμος的词汇连贯性；并将脚注标记移至所注释的译词之后。
