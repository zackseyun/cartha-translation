  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: zh_hans
  text: 你们上去过节吧。我不上去[a]参加这次节期，因为我的时机[b]还没有成熟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“我还不上去参加这次节期。”
    reason: textual_variant
  - marker: b
    text: 也可译作：“我所定的时候还没有圆满。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: 上去
  rationale: 保留“上行”的方向含义；在前往耶路撒冷守节的语境中，这也是自然的汉语表达。
- source_word: ἑορτή
  choice: 节
  rationale: 指上下文所说的宗教节期；“过节”比直译为“筵席”更符合现代汉语。
- source_word: οὐκ ἀναβαίνω
  choice: 我不上去
  rationale: 按SBLGNT的οὐκ译为“不”，不在正文中加入“还”；现在时结合当前行程可自然译作“不上去”。
- source_word: καιρός
  choice: 时候
  rationale: 保留该词“时机、特定时候”的语义空间，不在正文中明说这是“指定”的时候。
- source_word: πεπλήρωται
  choice: 还没有满
  rationale: 保留完成时被动态所表达的达到圆满或完成状态之意，避免弱化为单纯的“还没有到”。
theological_decisions:
- issue: 耶稣是否说自己“不”上去过节
  choice: 正文依SBLGNT的οὐκ译作“我不上去过这个节”
  alternative: 若按异文οὔπω，可译作“我还不上去过这个节”
  rationale: 依所提供的希腊文本保留“不”的较强表述，不为消除与后文之间的张力而擅自加入“还”；同时以脚注交代重要异文。
- issue: καιρός是否应明确译成神所指定的时间
  choice: 正文译作“我的时候”
  alternative: “我所定的时候”或“我的定期”
  rationale: “指定”在语境和约翰神学中可能成立，但并未由该词组本身明说，因此正文保留含义张力，脚注提供较明确的理解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“你们……吧”自然表达复数命令语气；“上去过节”保留前往耶路撒冷的方向感。“我的时候还没有满”略带经文语体，以保留πεπλήρωται的圆满、完成含义。
