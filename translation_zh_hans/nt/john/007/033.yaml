base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: zh_hans
  text: 于是耶稣说：“我还要和你们同在一小段时间[a]，然后到差我来的那一位[b]那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我和你们同在的时间不多了。”
    reason: lexical_alternative
  - marker: b
    text: 按约翰福音更广的语境，“差我来的那一位”指父。
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文祭司长和法利赛人差人捉拿耶稣的情节，既可表达叙事推进，也保留一定的逻辑承接意味。
- source_word: Ἔτι χρόνον μικρόν
  choice: 时间不多了
  rationale: ἔτι 表示“还、仍”，χρόνον μικρόν 表示“一小段时间”；此译自然表达剩余时间短暂，同时以脚注保留较形式对应的译法。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: 我和你们同在
  rationale: 直接保留“与……同在”的结构和现在时语气，不把它扩展为“留在”。
- source_word: καὶ ὑπάγω
  choice: 随后我就要到……那里去
  rationale: ὑπάγω 在此表示离去并前往某处；中文以“要……去”自然表达即将发生的行动。“随后”从前句的短暂剩余时间呈现次序，但不加入具体时限。
- source_word: πρὸς τὸν πέμψαντά με
  choice: 到那差我来的那里去
  rationale: 保留实词化分词“那差我来的”及 πρὸς 的趋向意义，不在正文中直接把所指明说为父。
theological_decisions:
- issue: “那差我来的”所指是谁
  choice: 正文保留间接称谓“那差我来的”
  alternative: 译作“差我来的父”
  rationale: 约翰福音更广的语境表明所指是父，但本节希腊文本没有直接出现“父”；保留原有表达可避免把语境解释写入正文。
- issue: ὑπάγω 是否明说死亡、升天或归父
  choice: 仅译为“到……那里去”
  alternative: 译作“回到父那里”或“离世归父”
  rationale: 本句具有约翰福音中的神学深意，但动词本身仍以离去、前往为基本表达；不在正文中消解其含蓄性。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“同在”保留经文关系性用语；“那差我来的”虽略具书面色彩，却准确保留原文的间接指称。
