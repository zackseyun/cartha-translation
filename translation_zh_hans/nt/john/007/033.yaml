review_pass:
  verdict: revise
  source_fidelity: 草稿基本传达了“还与听者同在片刻，继而往差遣者那里去”的意思。但“时间不多了”弱化了ἔτι（“还、仍”）以及“同在”的持续性；“随后我就要”将原文仅由上下文显出的先后关系和将来趋向表达得稍强。另，“那差我来的那里”把人称指代处理得不够自然。
  naturalness: “于是耶稣说”自然。“到那差我来的那里去”在现代汉语中略显拗口；改为“到差我来的那一位那里去”既保留间接称谓，也更符合普通话表达。
  terminology: “同在”适合保留μεθ’ ὑμῶν εἰμι的关系性措辞。“差我来的那一位”忠实保留实词化分词，正文不直接补出“父”。脚注可说明约翰福音语境中的所指，但不应把该说明写入正文。
  issues:
  - severity: medium
    issue: “时间不多了”未明确表达“我还要……同在”的持续时段。
    rationale: Ἔτι χρόνον μικρόν与μεθ’ ὑμῶν εἰμι连用，重点是耶稣仍将同在一小段时间；“我还要和你们同在一小段时间”更完整而自然。
  - severity: low
    issue: “随后我就要”略强化了原文。
    rationale: καὶ ὑπάγω为并列的“并且我去／我往……去”；时间上的先后可由“还要……一小段时间”自然推出，但“就要”额外加强迫近感。
  - severity: medium
    issue: “那差我来的那里”指称结构不自然。
    rationale: πέμψαντά με指“差我来的那一位”，是人而非地点；中文可在保留“那里”的趋向表达时说“到差我来的那一位那里去”。
  revised_text: 于是耶稣说：“我还要和你们同在一小段时间[a]，然后到差我来的那一位[b]那里去。”
