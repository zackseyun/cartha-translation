- from: 于是耶稣说：“我和你们同在的时间不多了[a]，随后我就要到那差我来的那里去。”[b]
  to: 于是耶稣说：“我还要和你们同在一小段时间[a]，然后到差我来的那一位[b]那里去。”
  rationale: 修订恢复ἔτι所表达的“还要／仍”以及“同在一小段时间”的完整句意，避免以“就要”加强原文未明说的迫近性；同时将差遣者改为自然的“那一位”，保留正文原有的间接指称和πρὸς所要求的趋向表达。
