  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: zh_hans
  text: 于是，犹太人[a]在节期中寻找他，不断地问：“那个人在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地的居民”；按《约翰福音》的叙事语境，这里也可能更具体地指犹太地的犹太当局。
    reason: 保留Ἰουδαῖοι在地域、族群及权力群体之间的语义可能性，避免正文武断限定其所指。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推动叙事发展；“于是”在现代汉语中自然，也保留了原文连接词的推展作用。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 该词可泛指犹太人，也可按语境指犹太地区的人或犹太当局。本节本身没有明确限定为领袖，因此正文采用词义较直接的“犹太人”，并以脚注保留较窄的语境理解。
- source_word: ἐζήτουν
  choice: 一直寻找
  rationale: 未完成时表达当时持续进行的动作；“一直寻找”以自然汉语呈现这种持续性。
- source_word: ἐν τῇ ἑορτῇ
  choice: 在节期中
  rationale: 定冠词表明这是上文已提到的节期；“在节期中”兼顾活动场合与持续时段。
- source_word: ἔλεγον
  choice: 并问
  rationale: 原义为“说”，但后接直接疑问句；汉语用“问”更自然，也不改变话语内容。与前面的持续语境结合，可理解为他们当时反复或持续发问，但不额外加入“不断”等强化词。
- source_word: ἐκεῖνος
  choice: 那个人
  rationale: 指示代词比单纯的“他”更有距离感；“那个人”既清楚自然，也不额外赋予贬义。
theological_decisions:
- issue: 《约翰福音》中 Ἰουδαῖοι 的所指
  choice: 正文译作“犹太人”，不明确收窄为领袖或犹太地区的人
  alternative: “犹太地区的人”或“犹太人的领袖”
  rationale: 原词在《约翰福音》中可随语境具有不同范围，而本节没有明说是领袖群体。正文保留较宽泛的词义，脚注提示叙事语境中可能存在的较窄理解，以免把解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”用于自然承接叙事；“一直寻找”呈现未完成时的持续性；直接引语中的“那个人”保留原文指示代词所带的距离感。脚注标记紧接其所说明的“犹太人”。
