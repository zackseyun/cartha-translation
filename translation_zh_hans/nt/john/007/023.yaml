  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: zh_hans
  text: 如果一个人在安息日受割礼，为的是不违背摩西的律法[a]，你们因我在安息日使整个人恢复健康[b]，就向我发怒吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违背”也可译作“破坏”“废掉”或“使失效”。
    reason: lexical_alternative
  - marker: b
    text: “整个人”突出这里的对照：割礼涉及身体的一部分，而耶稣使整个人恢复健康。
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: 受割礼
  rationale: 这是现代汉语表达该希腊语习语最自然、准确的说法；无需生硬直译为“接受割礼”。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 语境中的割礼表明所指为男性，但汉语“人”在此已足够明确，也比“一个男人”更自然。
- source_word: ἐν σαββάτῳ
  choice: 在安息日
  rationale: 准确表达时间用法，并符合现代中文圣经语体。
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: 为的是不违背摩西的律法
  rationale: λύω在法律语境中可指破坏、废除或违犯；“不违背”自然地表达不使律法遭到违反，同时以脚注保留其他词义可能。
- source_word: χολᾶτε
  choice: 向我发怒
  rationale: 直接表达愤怒或恼怒，力度适中，并保留反问语气。
- source_word: ὅλον ἄνθρωπον
  choice: 一个完整的人
  rationale: 保留ὅλον的显著位置及其与只处理身体一部分的割礼之间的修辞对照。
- source_word: ὑγιῆ ἐποίησα
  choice: 使……恢复健康
  rationale: 既体现“使……健康”的使役结构，也符合该处医治后恢复健全的语境；比单译“医治”更能保留原文措辞。
theological_decisions:
- issue: 耶稣将安息日行割礼与安息日治病相比的含义
  choice: 保留由安息日可以行割礼，推进到更应当使整个的人恢复健康的论证。
  alternative: 概括为礼仪律与怜悯行动之间的一般性对比。
  rationale: 原文的论证具体建立在割礼与“整个的人”之间的对照上；译文保留这一由小及大的张力，不引入对摩西律法的后期宗派性评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“受割礼”符合通行表达；“使一个完整的人恢复健康”略带强调，以保留原文ὅλον ἄνθρωπον的修辞对照。所有脚注标记均置于正文相应位置。
