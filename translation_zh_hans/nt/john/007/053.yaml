  text: 众人各自回自己的家去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: 于是
  rationale: 这里承接前文，并引出众人散去的结果；译作“于是”比单纯的“和”更符合现代汉语叙事习惯，同时保留连接作用。
- source_word: ἐπορεύθη
  choice: 回……去了
  rationale: 该动词表示前往、离去；与“自己的家”搭配时，现代汉语自然表达为“回家去了”。
- source_word: ἕκαστος
  choice: 众人各自
  rationale: 原文为单数形式，逐一强调每个人；“众人各自”既保留个体分别行动之意，也避免生硬的“每一个人”。
- source_word: οἶκον
  choice: 家
  rationale: οἶκος可指房屋、家或家室；短语εἰς τὸν οἶκον αὐτοῦ在此指各人自己的住处，译作“家”最自然。
theological_decisions:
- issue: 约翰福音7:53—8:11的文本地位
  choice: 将经文保留在正文中，并以脚注交代抄本证据
  alternative: 从正文删除，或不加说明地收入正文
  rationale: 拜占庭文本传统包含本节，但最早期的重要希腊抄本及若干早期译本缺少整段，且该段在部分抄本中的位置不一。保留正文同时明确说明文本证据，既不掩盖文本疑问，也不武断否定其悠久的教会传承。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“众人各自回家去了”准确表达原文逐人散去的意思；句首“于是”使其与前文衔接顺畅。脚注以普通读者可理解的方式如实呈现复杂的抄本证据，不对该段的原始归属作超出证据的断言。
