  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: zh_hans
  text: 这些事以后，耶稣在加利利行走；他不愿在犹太地区行走，因为犹太人[a]正设法杀害他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地区的人”。在约翰福音中，“犹太人”有时按叙事语境指犹太地区中反对耶稣的人，尤其可包括有关领袖，并非泛指所有犹太人。
    reason: 说明οἱ Ἰουδαῖοι在本叙事语境中的可能所指，保留正文的形式对应，同时避免将其误读为对全体犹太人的概括。
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语所承接的前文，同时采用自然、庄重的现代汉语时序表达。
- source_word: περιεπάτει / περιπατεῖν
  choice: 在……各处行走 / 在……行走
  rationale: περιπατέω在本节重复出现；译文保留“行走”的词语呼应。首处未完成时表示持续活动，加“各处”传达在加利利境内往来的语境，但不扩大为“遍及”。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: 在加利利
  rationale: 按处所义直译；结合持续性的περιεπάτει，整体表述为“在加利利各处行走”。
- source_word: οὐ γὰρ ἤθελεν
  choice: 不愿
  rationale: 准确表达意愿上的否定，不暗示能力不足；汉语因果关系由后面的“因为”自然呈现。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地区
  rationale: 这里指罗马时期的犹太地域，与加利利形成地理对照；加“地区”可避免现代读者误解为泛指犹太群体。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚引出耶稣不愿在犹太地区行走的原因。
- source_word: ἐζήτουν
  choice: 想要
  rationale: 结合目的不定式ἀποκτεῖναι，表达持续存在的敌对图谋；现代汉语比“寻求杀害”更自然，也不将其弱化为单纯寻找。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 正文保留希腊语的直接称谓，并以脚注说明约翰叙事中的具体语境，避免将其误读为对全体犹太人的概括。
- source_word: ἀποκτεῖναι
  choice: 杀他
  rationale: 直接、自然地表达目的不定式及其宾语，不额外引入司法处决的含义。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，脚注说明此处按叙事语境指敌对耶稣的犹太地区人士，尤其是有关领袖。
  alternative: 正文译作“犹太领袖”或“犹太地区的人”。
  rationale: 保留原文称谓及其可能的语义范围，同时防止把特定叙事中的敌对群体错误扩大为所有犹太人；也不在正文中把所指过早限定为领袖。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“这些事以后”保留约翰式承接；“行走”保留原文同一动词的重复。地名“犹太地区”明确其地理意义。
