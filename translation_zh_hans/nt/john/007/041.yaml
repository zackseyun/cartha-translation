id: JHN.7.41
reference: John 7:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: zh_hans
  text: 另一些人说：“这位就是弥赛亚[a]。”但也有人说：“难道弥赛亚会出自加利利吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: 另一些人
  rationale: 用作名词的复数形容词，指人群中的另一部分人；“另一些人”自然呈现群体间的区分。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示当时人群中持续或反复出现的言论；现代汉语在这一叙事语境中用“说”即可自然表达，不必机械添加进行标记。
- source_word: Οὗτός ἐστιν
  choice: 这位就是
  rationale: 指向一位人物并作身份认定；“这位”比“这个人”更简洁庄重，“就是”体现明确判断。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是群众争论中的称号，指所期待的受膏者；采用现代中文通行的音译“弥赛亚”。
- source_word: οἱ δὲ
  choice: 但也有人
  rationale: 带冠词的复数结构引出与前一群人相对的另一群人；“但也有人”既表达转折，也符合自然汉语。
- source_word: Μὴ γὰρ
  choice: 难道……吗
  rationale: μή引导预期否定答案的问句，γάρ带有解释或推断色彩；汉语反问格式“难道……吗”自然保留说话者认为答案应是否定的语气。
- source_word: ἐκ τῆς Γαλιλαίας
  choice: 出自加利利
  rationale: ἐκ表示来源或出身；“出自”比单纯“从……来”更贴合此处关于弥赛亚出处的争议。
- source_word: ἔρχεται
  choice: 会出自
  rationale: 现在时在此陈述一般性的弥赛亚期待；结合来源短语译为“会出自”，自然表达其所否定的可能性，而非一次具体移动。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός是群众争论的弥赛亚称号，并非姓名式用法。“弥赛亚”更直接呈现所期待的受膏者含义；脚注保留传统译法“基督”。
- issue: 反问是否断定耶稣实际来自加利利
  choice: 保留群众的反问，不替叙述者纠正其前提
  alternative: 增补说明耶稣来自伯利恒
  rationale: 原文只记录群众基于其认知提出的反问。译文不应把后文或其他经文的信息加入正文，也不应消除其讽刺性或叙事张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“这位就是”适合公开议论中的身份认定；“难道……吗”准确而自然地传达预期否定答案的反问。正文仅设置一个有实际信息价值的脚注，且标记[a]已在正文出现。
