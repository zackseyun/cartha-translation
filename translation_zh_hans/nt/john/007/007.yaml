  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: zh_hans
  text: 世人[a]不能恨你们，却恨我，因为我作证说，他们所做的事是邪恶的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”也可译作“世界”。约翰常用这个词指与上帝敌对的人类世界或秩序，并非指受造的宇宙本身。
    reason: lexical_and_contextual_note
  - marker: b
    text: “他们所做的事”也可译作“他们的行为”或“他们的作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: 不能
  rationale: 直接保留 δύναμαι 所表达的能力或可能性含义；“不能”在现代汉语中自然，也没有额外解释其原因。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 此处 κόσμος 指与耶稣形成敌对关系的人类社会，而非受造宇宙；“世人”能在自然汉语中表达这一指向，同时避免生硬的“世界恨”。脚注说明其约翰语境中的更深层含义。
- source_word: μισεῖν / μισεῖ
  choice: 恨
  rationale: 两处均译为“恨”，保留原文重复、强烈的措辞，以及“你们”和“我”之间鲜明的对比。
- source_word: ἐμὲ δὲ
  choice: 却恨我
  rationale: “却”清楚表达 δέ 的转折对比，并以自然汉语突出耶稣与弟兄们处境的差异。
- source_word: μαρτυρῶ περὶ αὐτοῦ
  choice: 我指证他们
  rationale: μαρτυρέω 带有作见证、出面证实的意味；在此负面语境中，“指证”自然呈现耶稣公开作证揭露世人的行为，同时保留见证性的语义。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 他们所做的事
  rationale: 以现代汉语自然表达 ἔργα；脚注保留较形式对应的“行为”这一译法。
- source_word: πονηρά
  choice: 恶的
  rationale: 表达明确的道德邪恶，而不弱化为一般意义上的“不好”。
theological_decisions:
- issue: 约翰语境中“κόσμος”的所指及神学张力
  choice: 正文译作“世人”，脚注指出其也可译作“世界”，并说明约翰常用该词指与上帝敌对的人类秩序
  alternative: 正文直译为“世界”
  rationale: “世人”避免现代汉语读者将主语误解为物质宇宙，也使拟人化的“恨”更自然；脚注则保留该词在约翰著作中层次丰富的神学含义，不把它收窄为所有人毫无例外。
- issue: 耶稣对世人恶行的见证性质
  choice: 译作“指证他们，说……”
  alternative: “为他们作见证，说……”或“作证指出……”
  rationale: “指证”符合上下文中耶稣揭露恶行而招致仇恨的语境；它没有改变 ὅτι 从句的内容，也未把耶稣的见证扩展为某一特定审判教义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“不能……却……”保留原文鲜明对照；代词按“世人”处理为复数“他们”。正文避免生硬直译，同时用脚注保留 κόσμος 与 ἔργα 的词义层次。
