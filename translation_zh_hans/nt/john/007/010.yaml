  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: zh_hans
  text: 但他的弟兄们上去过节以后，他也上去了；不是公开地去，而是仿佛在暗中去的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而是暗中去的。”希腊文直译为“而是仿佛在暗中”，其中“仿佛”可能使语气稍显缓和。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: 但……以后
  rationale: ὡς与不定过去时动词构成时间从句，表示“当……以后”；δέ在叙事中带出轻微转折。中文以“但……以后”兼顾时间次序和与上文的对照。
- source_word: ἀνέβησαν ... ἀνέβη
  choice: 上去……上去了
  rationale: ἀναβαίνω意为“上去”，既符合前往耶路撒冷的地理方向，也保留朝圣上行的表达。前后重复“上去”，对应原文，并由“以后”清楚表达先后次序。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他弟兄们
  rationale: 上下文中的ἀδελφοί指耶稣的男性兄弟；“弟兄们”准确保留性别和亲属关系，也符合庄重而自然的圣经叙事语体。
- source_word: εἰς τὴν ἑορτήν
  choice: 去过节
  rationale: ἑορτή在上下文中特指住棚节。正文用现代汉语自然的“过节”，既表达赴节期之意，又避免在本节重复补出上下文已经明确的节名。
- source_word: τότε καὶ αὐτὸς
  choice: 他也
  rationale: καὶ αὐτός强调耶稣也采取了相同行动；时间副词τότε的先后意义已由“……以后”自然呈现，无须生硬重复“那时”。
- source_word: οὐ φανερῶς
  choice: 不是公开地去
  rationale: φανερῶς表示公开、显明地。“不是公开地去”直接表达行动方式，并与下句形成清楚对照。
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: 而是仿佛暗中去的
  rationale: ἐν κρυπτῷ表示暗中、隐秘地；ὡς使说法略带限定，可译作“仿佛”。此译法保留原文的细微缓和语气，而不直接断言“秘密地”。
theological_decisions:
- issue: 耶稣此次上去与他先前所说不上去之间的关系
  choice: 按原文直述：弟兄们上去以后，耶稣也上去，但没有公开地去。
  alternative: 通过意译说明他改变了主意，或补充理由以消解与7:8之间的张力。
  rationale: 本节只交代行动的时间与方式，并未解释耶稣先前的话和此次行动之间的关系。译文不添加协调性解释，以保留叙事本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上去”保留前往耶路撒冷的原文方向感；分号突出“公开”与“暗中”的对照。脚注标记置于所解释短语之后。
