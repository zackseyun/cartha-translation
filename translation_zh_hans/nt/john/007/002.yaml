  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: zh_hans
  text: 犹太人的节期——住棚节[a]——快到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“搭棚节”。
