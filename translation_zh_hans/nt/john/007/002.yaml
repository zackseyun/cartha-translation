lexical_decisions:
- source_word: δὲ
  choice: 不另译
  rationale: 这是轻微的叙事衔接词；本句在现代汉语中无需显式译出，省略可避免加入原文没有的“现在”或过强的转折意味。
- source_word: ἐγγὺς
  choice: 快到了
  rationale: 这里表示时间临近；“快到了”自然、清楚，也符合现代汉语叙事表达。
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: 犹太人的节期
  rationale: 属格短语说明这是犹太人的宗教节期；此译法既贴近原文，也不赋予该称谓额外的 polemical 色彩。
- source_word: ἡ σκηνοπηγία
  choice: 住棚节
  rationale: 这是该犹太秋季朝圣节期通行而易懂的中文名称；其字面构词意义以脚注补充。
theological_decisions:
- issue: τῶν Ἰουδαίων 在节期名称中的表达
  choice: 犹太人的节期
  alternative: 犹太节期
  rationale: 采用所有格形式保留原文结构和归属含义；这里是在辨明节期，并非对“犹太人”作论战性陈述。
- issue: σκηνοπηγία 的节期名称
  choice: 住棚节
  alternative: 搭棚节
  rationale: 正文采用现代中文读者熟悉的传统名称，脚注则保留该词更贴近构词的译法，不额外解释其神学意义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两个破折号标明“住棚节”是对“犹太人的节期”的同位说明，并保持原句信息焦点。
