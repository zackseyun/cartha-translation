id: JHN.7.6
reference: John 7:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: zh_hans
  text: 于是耶稣对他们说：“我的时候还没有到[a]，你们的时候却随时都合适。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我预定的时候还没有到。”原文所用的词可指合适或特定的时机，不只是一般意义上的时间。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接兄弟们此前的话，既可表示推论，也自然推进叙事。
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: 耶稣……说
  rationale: 希腊文使用历史现在时；现代汉语叙事用“说”即可自然表达，不必机械标示时态。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 忠实表达与格间接宾语，并保留本节对指代对象的简洁表述。
- source_word: καιρός
  choice: 时候
  rationale: 这里指适宜、特定或预定的时机，而非单纯流逝的时间；“时候”在汉语中自然，并能保留一定语义开放性。
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: 我的时候
  rationale: 保留强调性的所属对比，同时不把本节的 καιρός 改译成约翰福音另一个常见词 ὥρα 所对应的“时辰”。
- source_word: οὔπω πάρεστιν
  choice: 还没有到
  rationale: 自然表达该时机尚未来临，也准确传达 οὔπω 与 πάρεστιν 的组合意义。
- source_word: δὲ
  choice: 却
  rationale: 清楚呈现耶稣的“时候”与他们的“时候”之间的对比。
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: 你们的时候
  rationale: 与“我的时候”形成平行结构，保留原文鲜明的所属对照。
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: 随时都合适
  rationale: “随时”自然传达 πάντοτέ；以“合适”修饰“时候”，比直译为“时候总是准备好了”更符合现代汉语，同时体现 ἕτοιμος 的可用、适宜之意。
theological_decisions:
- issue: 约翰语境中耶稣“时候”的含义
  choice: 正文译作“我的时候”，不扩展其神学所指
  alternative: 我的预定时机；我的时辰
  rationale: 约翰福音中耶稣的时间常与其使命和得荣耀相关，但本节用的是 καιρός，而不是 ὥρα。译文保留原词的语义范围及其神学张力，不在正文中预先限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的时候／你们的时候”保留原文的平行对比；“随时都合适”避免生硬直译，同时未将兄弟们的时机解释为某一种特定神学含义。
