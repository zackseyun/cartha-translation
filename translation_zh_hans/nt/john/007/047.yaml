  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: zh_hans
  text: 于是，法利赛人回答他们：“难道连你们也受迷惑了吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被欺骗了吗？”原文动词可指被误导、受迷惑或受欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 回答
  rationale: 这是叙事对话中表示回应的常用动词；“回答”自然、准确。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并表示随之发生的回应；“于是”符合现代汉语叙事，也保留了语篇联系。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 按上下文指法利赛人所回应的差役；中文以“回答他们”自然表达与格间接宾语。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经与一般中文中通行的群体名称。
- source_word: Μὴ καὶ ὑμεῖς
  choice: 难道连你们也……吗
  rationale: “难道……吗”体现 μή 疑问句预期否定回答的反问语气；“连你们也”表达 καὶ ὑμεῖς 的递进和惊讶意味。
- source_word: πεπλάνησθε
  choice: 受迷惑了
  rationale: 该完成时被动/中间形式在这里表示已被引入错误；“受迷惑”保留被动意味，并以自然中文传达误导或欺骗的语义范围。
theological_decisions:
- issue: μή 问句的反问力度
  choice: 译作“难道连你们也……吗？”
  alternative: “你们也受迷惑了吗？”
  rationale: 原文预期否定回答，并带有法利赛人惊讶、责斥的口吻；“难道”可自然体现这一点，而不额外加入原文没有的断言。
- issue: πεπλάνησθε 所表达的错误状态
  choice: “受迷惑了”
  alternative: “被欺骗了”或“走迷了路”
  rationale: 这里既可能侧重被误导，也可能侧重受欺骗。“受迷惑”保留语义张力，不把对象明确说成某人的欺骗，也不将其窄化为行为或道德上的偏离。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“难道连你们也”保留法利赛人反问中预期否定回答和责斥的语气；脚注标记置于对应问句末尾。
