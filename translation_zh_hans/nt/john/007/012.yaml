base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: zh_hans
  text: 群众中对他有许多私下的议论[a]。有些人说：“他是个好人。”另一些人却说：“不，他是在误导群众[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “私下的议论”也可译作“低声抱怨”或“窃窃私语”。
    reason: lexical_alternative
  - marker: b
    text: “误导群众”也可译作“欺骗群众”或“把群众引入歧途”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: 议论纷纷
  rationale: 该词指低声、非公开的议论，语气可能包含不满。“议论纷纷”在现代汉语中自然地表现群众中广泛而未公开的议论；其可能带有的抱怨或窃窃私语意味保留在脚注中。
- source_word: περὶ αὐτοῦ
  choice: 对他
  rationale: 与“议论纷纷”搭配自然，准确表达议论所围绕的对象。
- source_word: πολύς
  choice: 纷纷
  rationale: 希腊文强调这种议论很多、很广泛；汉语用叠义副词“纷纷”自然传达其程度和范围。
- source_word: ἐν τοῖς ὄχλοις
  choice: 群众中
  rationale: 保留ὄχλοις所指聚集的人群；现代汉语在此不必机械呈现希腊文复数。
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: 有些人……另一些人却……
  rationale: 清楚呈现群众内部彼此对立的两种看法，“却”标明反差而不增加解释。
- source_word: Ἀγαθός ἐστιν
  choice: 他是个好人
  rationale: 希腊文直译为“他是好的”，但现代汉语这样表达人物品格不自然；“他是个好人”是谓语形容词用于人的自然对应，不增添宗派性或教义性判断。
- source_word: Οὔ, ἀλλὰ
  choice: 不，……却/而是
  rationale: 这里先直接否定前一种评价，再提出相反判断。正文以“不”配合上下句的“却”自然表达这一反驳关系。
- source_word: πλανᾷ
  choice: 是在误导
  rationale: πλανάω可指欺骗或引入歧途。“误导”既可侧重造成错误认识，也不必断定主观欺骗意图；“是在”表现对方所指控的持续行为。
- source_word: τὸν ὄχλον
  choice: 群众
  rationale: 表达作为整体的人群，并与本节前半句的群众保持词汇联系。
theological_decisions:
- issue: 群众对耶稣品格与行为的相反评价
  choice: 以直接引语并列“他是个好人”和“他是在误导群众”
  alternative: 把其中一种评价改写为叙述者认可或否定的说法
  rationale: 本节报道群众内部相互冲突的判断，并未在此由叙述者裁定。译文中性呈现双方说法，保留原文的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“议论纷纷”比生硬的“有许多低语”更自然；“好人”符合汉语对人物品格作判断的习惯；整体保留群众私下议论及意见分裂的场景。
