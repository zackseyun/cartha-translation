  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: zh_hans
  text: 你看，他正公开地讲话，他们却不对他说什么。莫非[a]官长们真的知道这人就是弥赛亚吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道官长们真的知道这人就是弥赛亚吗？”
    reason: μήποτε可表示带惊讶的试探性推断，也可译成反诘意味较强的“难道……吗”。
lexical_decisions:
- source_word: ἴδε
  choice: 你看
  rationale: 作引人注意的感叹语处理；“你看”符合现代汉语现场对话，也保留了原文指示听者留意的作用。
- source_word: παρρησίᾳ
  choice: 公开
  rationale: 这里强调耶稣在众人面前毫不隐蔽地讲话；“公开”比“大胆”更贴合场景，也避免过度突出勇气。
- source_word: λαλεῖ
  choice: 正在……讲论
  rationale: 用进行体呈现众人当场观察到的持续动作；“讲论”自然庄重，适合公开教导的语境。
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: 他们却什么也不对他说
  rationale: 直接保留 οὐδέν 和与格 αὐτῷ 的表达，不增添原文未明说的“反对”或“制止”。“却”体现现场反差。
- source_word: μήποτε
  choice: 莫非
  rationale: 表达带惊讶和疑惑的试探性推断，既不是单纯陈述“也许”，也不把问题强行处理成明确否定。
- source_word: ἀληθῶς
  choice: 真的
  rationale: 自然传达“确实、真实地”的强调作用，符合现代口语中的疑问语境。
- source_word: ἔγνωσαν
  choice: 知道
  rationale: 虽然原文为不定过去时，这里所问的是官长是否已经得知并持有这一认识；现代汉语用“知道”最自然，也不将词义收窄为“认出”。
- source_word: οἱ ἄρχοντες
  choice: 官长们
  rationale: 指语境中的犹太治理和宗教领袖；“官长”既保留掌权者的含义，又符合经文语域。
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: 这人就是弥赛亚
  rationale: χριστός 在这里是群众所议论的受膏者称号，用“弥赛亚”保留其犹太背景和称号功能；“就是”体现系词结构中的确认意味。
theological_decisions:
- issue: ὁ χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处群众是在判断耶稣是否为所期待的那位受膏者，χριστός 明显作为称号使用。“弥赛亚”更直接呈现该称号的犹太语境；“基督”虽是传统译法，但在现代汉语中也容易被理解为名称的一部分。
- issue: μήποτε 疑问的倾向
  choice: 莫非……吗
  alternative: 难道……吗
  rationale: 原文保留惊疑中的可能性，并未作出确定判断。“莫非”较好地兼顾试探性推测和意外感；“难道”也可成立，但通常带有更强的反诘或预期否定色彩。
translation_notes:
  register: 采用现代、自然而庄重的叙事对话语体。“你看”保留现场感；“讲论”“官长”维持经文所需的正式程度。未将群众的惊疑改写成确定的否定或肯定。
