  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: zh_hans
  text: 于是，耶稣回答他们说：“我的教导不是我自己的，而是那差我来的那一位的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而是属于那差我来的那一位。”希腊文的所有格表达可同时突出来源和归属。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: 于是，耶稣回答他们说
  rationale: 保留οὖν承接上文的作用，也保留希腊文“回答……说”的叙事表达；现代汉语虽可压缩为“回答”，但完整表达自然且庄重。
- source_word: Ἡ ἐμὴ διδαχή
  choice: 我的教导
  rationale: “教导”是διδαχή在此处自然、通俗的对应词，比“教义”少一层后世技术性意味。
- source_word: οὐκ ἔστιν ἐμή
  choice: 不是我自己的
  rationale: 既表达所属关系，也可指并非独立源自耶稣自己；“我自己的”在汉语中使前后对比清楚。
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: 而是那差我来者的
  rationale: 用“的”保留希腊文所有格的简洁性及其在来源与归属之间的开放性；“差我来者”准确表达πέμψαντός με，并符合庄重的现代汉语。
theological_decisions:
- issue: 耶稣的教导与差他来者之间的关系
  choice: 保留“不是我自己的，而是那差我来者的”这一来源兼归属的对比
  alternative: 明确译成“是从那差我来者而来的”或“属于那差我来者”
  rationale: 希腊文所有格既能突出归属，也能暗示来源；正文不把它限定为单一关系，从而保留经文本身的神学张力，既不把耶稣描写成独立发言，也不额外说明其位格或本体关系。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“于是”承接前文，“差我来者”保留约翰福音常见的差遣措辞。脚注标记置于相关分句之后。
