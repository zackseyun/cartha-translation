  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: zh_hans
  text: 于是，耶稣在圣殿里教导人时高声说：“你们知道我，也知道我是从哪里来的。[a]然而，我并不是凭自己[c]来的；差我来的那一位是真实的[b]，你们却不认识他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可能按语境听作带有反讽或挑战意味：“你们真知道我，也知道我是从哪里来的吗？”不过，希腊原文在形式上是陈述句。
    reason: alternative_reading
  - marker: b
    text: “真实的”也可译作“真正的”；在约翰福音中，这个词可以指完全真实、名副其实。
    reason: lexical_alternative
  - marker: c
    text: “凭自己”直译为“从自己”，也可理解为“自行”或“出于自己的意思”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: 高声说
  rationale: 表达公开而响亮的宣告，符合圣殿中的场景，同时避免“喊叫”可能带出的失控或痛苦意味。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿建筑群或院区；“在圣殿里”是现代汉语中自然且通常不会限于内殿的表达。
- source_word: διδάσκων ... καὶ λέγων
  choice: 教导人时……说
  rationale: 用时间结构自然呈现分词所表达的持续教导背景，并保留“说”的引语引入功能。
- source_word: Κἀμὲ οἴδατε
  choice: 你们知道我
  rationale: 保留陈述句形式和对“我”的直接指向，不额外加入反问或讽刺语气。
- source_word: οἴδατε ... οἴδατε
  choice: 知道……也知道
  rationale: 保留原文重复，维持修辞力度及上下文可能具有的反讽或挑战意味。
- source_word: πόθεν εἰμί
  choice: 我是从哪里来的
  rationale: 自然表达来源，既不局限为地理籍贯，也不直接增译为天上的来源。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 凭自己
  rationale: 在现代汉语中自然表达并非出于自己的主动或权柄；脚注补充较形式对应的译法。
- source_word: οὐκ ἐλήλυθα
  choice: 并不是……来的
  rationale: 汉语不以形态区分完成时；此表达自然传达其来到及当前使命的事实。
- source_word: ἀληθινὸς
  choice: 真实的
  rationale: 保留ἀληθινός在约翰著作中“真实、真正”的主要语义，并避免仅缩窄为“诚实守信”。
- source_word: ὁ πέμψας με
  choice: 那差我来的
  rationale: 保留差遣者的个人性和关系性，不在本句中增添“父”这一未明说的称谓。
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: 你们却不认识他
  rationale: “认识”适合指对某一位的关系性认知；“却”自然显明与前文声称知道耶稣的对照。
theological_decisions:
- issue: “你们知道我，也知道我是从哪里来的”是直接陈述还是带有反问、讽刺意味
  choice: 正文按原文语法译为陈述句
  alternative: 译成反问句“你们真知道我，也知道我是从哪里来的吗？”或明示讽刺
  rationale: 希腊文形式上是陈述句，但语境可使其带有反讽或挑战意味；正文不替读者消解这层张力，脚注说明其可能语气。
- issue: “我是从哪里来的”所指的是地理出身还是更深的神圣来源
  choice: 使用宽泛的“我是从哪里来的”
  alternative: 明确译为地理籍贯，或增译为从天上而来
  rationale: 约翰福音常以来源语言承载多层意义；宽泛表达同时容纳众人所认定的人间来源和耶稣使命的更深来源。
- issue: “凭自己来”的含义
  choice: 表达耶稣并非自主而来，但不展开其差遣关系
  alternative: 译为“不是从自己而来”或“不是擅自来的”
  rationale: “凭自己”自然表达非自行发起；避免“擅自”可能附加不当行为的负面色彩。
- issue: “那差我来的”是谁
  choice: 保持关系性称呼，不增译“父”
  alternative: 译为“差我来的父”
  rationale: 本句原文没有明确使用“父”这一称谓，因此让约翰福音的上下文确定所指。
- issue: ἀληθινός表达“真实”还是“信实”
  choice: 正文译为“真实的”
  alternative: “信实的”“真正的”
  rationale: “真实的”较能保留此词在约翰语境中兼具真实、真正之意的幅度；脚注提示可译“真正的”，而不单独限定为道德上的可信。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。语序按汉语习惯调整，将分词结构译作“教导人时高声说”。保留“知道……知道”与“认识”的语义对照；不在正文中明示反讽，不增添“父”或“从天上”等解释性内容。脚注标记依其所解释内容分别置于相关短语之后。
