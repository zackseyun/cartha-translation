source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: zh_hans
  text: 于是，犹太人[a]彼此说：“这个人要到哪里去，以致我们找不到他呢？难道他要到散居在希腊人中间的犹太人那里去，并教导希腊人吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地区的人”。希腊语这个词既可泛指犹太人，在某些语境中也可指来自犹太地区的人。
    reason: lexical_alternative
  - marker: b
    text: “散居在希腊人中间的犹太人”指散居于希腊人或希腊语文化群体中的犹太人，并不是指散居各地的希腊人。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按通常族群含义直译；本节没有明确依据将所指范围缩小为“犹太领袖”。“犹太地区的人”虽在某些语境可能成立，但这里的对比主要是犹太人与希腊人，而非地域对比。
- source_word: πρὸς ἑαυτούς
  choice: 彼此说
  rationale: 语境表明是群体成员互相交谈；“彼此说”自然保留了相互意味。
- source_word: Ποῦ οὗτος
  choice: 这个人要到哪里去
  rationale: “这个人”既符合现代汉语，也保留 οὗτος 在对立者口中可能带有的疏离语气。
- source_word: μέλλει πορεύεσθαι
  choice: 要到……去
  rationale: μέλλω 加不定式在此表达将要发生或打算采取的行动；“要……去”在疑问语境中自然，并不过度限定为迫近或明确意图。
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: 竟使我们找不到他
  rationale: 在汉语中自然表达前句所设想的结果，同时不额外加入“不能”等能力含义。
- source_word: μὴ
  choice: 难道……吗
  rationale: 以“难道……吗”表达 μή 所引导、预期否定回答的反问。
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: 散居在希腊人中间的犹太人
  rationale: διασπορά 在此指散居外邦的犹太群体；将隐含对象明示为“犹太人”，可避免现代读者误解为“希腊人的散居群体”。
- source_word: Ἕλληνας
  choice: 希腊人
  rationale: 保留词语通常的族群文化含义，不扩大译为泛指的“外邦人”。
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: 并教导希腊人
  rationale: 直接保留并列结构和教导对象，也保留叙事中的反讽意味。
theological_decisions:
- issue: 约翰叙事中 Ἰουδαῖοι 的范围
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 希腊文没有明说“领袖”，本节也不要求地域性限定，因此正文采用最直接的对应词，并在脚注保留地域性译法的可能。
- issue: διασπορά 所指群体
  choice: 散居在希腊人中间的犹太人
  alternative: 希腊人中的散居群体
  rationale: 此处依犹太语境应理解为散居于希腊人中的犹太人，而不是由希腊人构成的散居群体；译文澄清文化所指，但不把后一个“希腊人”泛化为所有外邦人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留两个“希腊人”的对应关系；以“难道……吗”再现预期否定回答的反问。脚注标记均置于相关正文位置。
