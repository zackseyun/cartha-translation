  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: zh_hans
  text: 于是，人群中因他起了分歧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: 纷争
  rationale: 该词在这里指人群因意见相左而分裂。“纷争”是自然的现代汉语，既表达争议，也保留群体分化的含义。
- source_word: οὖν
  choice: 于是
  rationale: 该连接词承接前文众人对耶稣的不同看法，表示由此产生的结果；“于是”自然流畅，又不过分强化形式逻辑。
- source_word: ἐγένετο
  choice: 起了
  rationale: γίνομαι与“纷争”搭配，表示一种局面产生；“起了纷争”符合现代汉语习惯。
- source_word: ἐν τῷ ὄχλῳ
  choice: 人群
  rationale: 介词短语指出分裂发生在聚集的群众当中。汉语用“人群……起了纷争”即可自然表达这一范围，无须机械译出“在……中”。
- source_word: δι’ αὐτόν
  choice: 因他
  rationale: διά加宾格在此表示原因。“因他”直接、简洁，并保留代词表达。
theological_decisions:
- issue: αὐτόν的指代
  choice: 保留为“他”，上下文所指为耶稣
  alternative: 明译为“耶稣”
  rationale: 原文使用代词，且上下文指向清楚；保留代词既忠于原文，也避免加入不必要的解释。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“起了纷争”兼顾原文的群体分裂意味与普通读者的自然理解。
