id: JHN.7.27
reference: John 7:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: zh_hans
  text: 可是，我们知道这个人是从哪里来的；但弥赛亚来的时候，没有人知道他是从哪里来的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上文并引出鲜明转折；“可是”符合现代汉语口语场景，又不失庄重。
- source_word: τοῦτον
  choice: 这个人
  rationale: 指向耶稣本人；“这个人”自然地保留了说话者具体而略带指点意味的称呼。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 直接表达说话者自认为已经掌握的信息。
- source_word: πόθεν ἐστίν
  choice: 是从哪里来的
  rationale: 既可表达地域来源，也可涵盖出身或来历；两处采用相同译法，以保留原文的重复和对照。
- source_word: ὁ δὲ χριστός
  choice: 但弥赛亚
  rationale: χριστός在这里是众人所期待之受膏者的称号，因此译为“弥赛亚”；“但”保留δέ所标示的对照。
- source_word: ὅταν ἔρχηται
  choice: 来的时候
  rationale: ὅταν加虚拟式指尚未实现而被期待的将来情形；汉语“来的时候”自然表达这一含义。
- source_word: οὐδεὶς γινώσκει
  choice: 没有人知道
  rationale: 准确表达普遍否定，并以自然现代汉语呈现。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节谈论众人所期待的那位受膏者，χριστός明显作为犹太弥赛亚称号使用，而非近似专名。
- issue: 众人关于弥赛亚来历的说法
  choice: 按其原话直接翻译，不加解释
  alternative: 扩译为“没有人知道弥赛亚将从何处出现”
  rationale: 这是经文中众人的判断，不是叙述者明确认可的教义陈述；直译可保留其可能的误解及经文中的张力。
translation_notes:
  register: 采用自然、清楚而庄重的现代标准汉语。分号保留两项认知主张之间的紧密对照；两次“是从哪里来的”对应原文重复，不把来源具体限定为出生地、居住地或天上起源。
