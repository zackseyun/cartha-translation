  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: zh_hans
  text: 他说这话，是指着信他的人将要领受的圣灵[a]说的；因为圣灵还没有赐下[b]——这是因为耶稣还没有得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“灵”；这里按上下文译作“圣灵”。
    reason: lexical_clarity
  - marker: b
    text: 希腊原文直译为“因为灵还没有”，没有明说“赐下”；这里根据上下文译为“圣灵还没有赐下”。这件事与耶稣尚未得荣耀相联系。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: 圣灵
  rationale: 上下文明确指信徒将要领受的上帝之灵。现代汉语通常用“圣灵”指称这一位；虽原文没有ἅγιον，但若只译“灵”，容易被理解为一般的灵。
- source_word: οὗ
  choice: 在后句重复“圣灵”
  rationale: 希腊文关系代词回指圣灵；现代汉语若直译为“他／祂”，既可能引入原文没有的代词性别信息，也不够自然，因此以重复名词明确所指。
- source_word: ἔμελλον λαμβάνειν
  choice: 将要领受
  rationale: 保留μέλλω加不定式的前瞻意味，同时比“即将”更少限定时间上的紧迫程度。
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: 信他的人
  rationale: 自然表达约翰惯用的“信入／信靠他”这一结构；不强加过去完成时，因为分词主要界定将要领受圣灵的人。
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: 因为那时还没有圣灵
  rationale: 尽量保留原文“灵还没有”的简练和神学张力，不在正文补入原文没有的“赐下”。“那时”使汉语时序自然，但不改变其与耶稣尚未得荣耀的关联。
- source_word: ἐδοξάσθη
  choice: 得荣耀
  rationale: 保留约翰福音中δοξάζω的主题性用语，不将其缩窄为升天、复活或受死中的某一方面。
theological_decisions:
- issue: 如何翻译οὔπω γὰρ ἦν πνεῦμα，同时不暗示圣灵此前并不存在
  choice: 正文保留“那时还没有圣灵”的张力，并以脚注说明可按语境理解为“圣灵还没有赐下”。
  alternative: 因为圣灵还没有赐下
  rationale: 原文没有“赐下”一词，直接补入会替读者消解原句刻意留下的张力；脚注则可帮助读者理解这里谈的是耶稣得荣耀之后信徒领受圣灵这一历史阶段。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这是指着……说的”保留τοῦτο δὲ εἶπεν περὶ的解释性语气；分号划分说明与内容，避免过度欧化。正文有[a]、[b]两个标记，均与脚注对应。
