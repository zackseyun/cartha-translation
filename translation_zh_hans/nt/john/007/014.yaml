  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: zh_hans
  text: 节期已经过了一半时，耶稣上圣殿去，在那里教导人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“圣殿”指整个圣殿区或院落，不是专指内殿。
    reason: cultural_note
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  choice: 节期已经过了一半的时候
  rationale: 以时间从句表达属格独立结构；“已经”对应ἤδη，“过了一半”自然传达μεσούσης所指节期来到中段。δὲ在此是轻微的叙事推进，汉语无需另加“但是”或“于是”。
- source_word: ἀνέβη
  choice: 上……去
  rationale: 保留ἀναβαίνω的向上移动含义，也符合前往耶路撒冷圣殿的叙述习惯。
- source_word: εἰς τὸ ἱερόν
  choice: 上圣殿去
  rationale: “圣殿”是自然、庄重的通行译法；ἱερόν具体指整个圣殿区或院落，而非仅指内殿，此点在脚注说明。
- source_word: ἐδίδασκεν
  choice: 在那里教导人
  rationale: 未完成时表示当时持续进行的教导；不译作“开始教导”，以免加入原文未明确表达的起始意义。“人”为汉语中教导动作自然隐含的受事，并未限定特定群体。
theological_decisions:
- issue: ἱερόν所指的范围
  choice: 正文译“圣殿”，脚注说明是圣殿区或院落
  alternative: 正文译“圣殿院内”或“圣殿区”
  rationale: 保留读者熟悉的经文用语，同时避免让人误以为耶稣进入仅祭司可入的内殿。
- issue: ἐδίδασκεν的时态体意义
  choice: 译为“在那里教导人”，表达持续进行的动作
  alternative: “开始教导”或“教导了人”
  rationale: 未完成时本身清楚支持过去持续动作，却不必然具有起始义；因此不将含混之处解释为明确的“开始”。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“节期”承接上下文所指的住棚节；本节不擅自补出节名。“在那里”使汉语句法流畅，并清楚交代教导发生于圣殿区。
