  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: zh_hans
  text: 难道官长或法利赛人中有谁信了他吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文用μή构成问句，预期的回答是“没有”。
    reason: 说明原文否定问句的语用力量，同时保留正文的反问形式。
lexical_decisions:
- source_word: μή τις
  choice: 难道……有谁……吗
  rationale: μή引导预期否定回答的问句；用“难道……有谁……吗”既保留反问形式，也自然传达说话者预期答案为“没有”的语气。
- source_word: ἐκ τῶν ἀρχόντων
  choice: 官长……中
  rationale: ἄρχοντες在此指犹太人中有公认地位的统治或议事权威；“官长”简洁庄重，也比泛指性的“领袖”更贴近其社会政治身份。
- source_word: ἐπίστευσεν
  choice: 信了
  rationale: 简单过去时“信了”自然对应不定过去时，并保持约翰福音中πιστεύω用语的一致性。
- source_word: εἰς αὐτόν
  choice: 信了他
  rationale: 现代汉语通常以“信某人”表达πιστεύω εἰς αὐτόν；不机械译出介词，以免形成不自然的“信入他”。
- source_word: ἢ
  choice: 或
  rationale: 保留两个群体之间的简单并列关系，不额外加入“甚至”等解释性语气。
- source_word: ἐκ τῶν Φαρισαίων
  choice: 法利赛人中
  rationale: 与“官长……中”共同受“中有谁”支配，表达群体成员关系；“法利赛人”是通行译名。
theological_decisions:
- issue: 否定问句的反问力量
  choice: 译作预期否定答案的反问句，但不改写为明说的否定陈述。
  alternative: 官长或法利赛人中没有一个信他的。
  rationale: 希腊文μή τις表明说话者预期答案是“没有”，但原文仍采用问句。保留反问形式，可维持叙事语气和说话者轻蔑、排斥的态度，而不超出原文明确表达的程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……有谁……吗”准确呈现反问语气；“官长”保留当时宗教政治权威的正式色彩。
