  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: zh_hans
  text: 于是，他的兄弟们对他说：“你离开这里，到犹太地区去吧，好让你的门徒也看见[a]你所做的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就会看见”或“观看”。希腊语动词可着重于观看、观察或目睹；这里在目的从句中使用将来时形式，也可带有预期结果的意味。
    reason: 词义及语气的可选译法
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 作为自然的叙事连接词，保留承接和推展语意，不把逻辑关系说得过强。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的弟弟们
  rationale: 此处指耶稣的男性手足；现代汉语在已知耶稣为长子的叙事背景下，用“弟弟们”比含混的“弟兄们”更自然、明确，同时不扩展为男女兼指。
- source_word: Μετάβηθι ἐντεῦθεν
  choice: 你离开这里
  rationale: 直接传达不定过去时命令语气所表达的离开当前地点之要求；补出“你”使汉语对话自然。
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: 到犹太去吧
  rationale: 以现代汉语自然表达前往该地区的命令；“吧”使兄弟劝促式的语气自然，但不削弱命令意味。
- source_word: Ἰουδαίαν
  choice: 犹太
  rationale: 采用该地理区域在中文圣经传统中通行且易懂的名称。
- source_word: ἵνα καὶ
  choice: 好让……也
  rationale: “好让”表达目的关系，“也”保留 καὶ 对门徒的附加意味。
- source_word: οἱ μαθηταί σου
  choice: 你的门徒
  rationale: 保留约翰福音中师徒关系的主题性称谓，不泛化为“跟随者”。
- source_word: θεωρήσουσιν
  choice: 看见
  rationale: θεωρέω 可指观看、观察或目睹；此处置于 ἵνα 目的从句中，中文用“好让……看见”自然表达目的，同时脚注保留其将来形式及较强观看意味的可能性。
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: 你所做的事
  rationale: 自然表达“你的那些作为，就是你正在做的”；“事”在现代汉语中通顺，并保留 ἔργα 对耶稣行动的概括，不擅自具体化为神迹。
theological_decisions:
- issue: “他的弟弟们”的身份
  choice: 按叙事表层译为耶稣的男性手足，不进一步界定亲属关系的教义含义。
  alternative: 译作“他的弟兄们”或理解为较广义的男性亲属。
  rationale: ἄδελφοι 的直接意义是男性兄弟；约翰福音7:3–5将他们作为家族成员描写。译文明确其家庭关系，但不借此处理超出本节的后世教义争论。
- issue: ἵνα 后将来直陈式的语气
  choice: 按目的从句译为“好让……看见”。
  alternative: 按形式较直译为“这样……就会看见”，或将 θεωρέω 译为“观看／观察”。
  rationale: 希腊文形式保留“将会看见”的结果色彩，但 ἵνα 在此主要引出目的。正文采用自然汉语表达目的，脚注提示形式和词义上的其他可能。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。对话中的“吧”符合兄弟劝促耶稣行动的语境；正文避免古旧的“往犹太去”和可能造成教会称谓误解的“弟兄”。脚注标记紧接其所说明的“看见”。
