  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: zh_hans
  text: 于是，差役来到祭司长和法利赛人那里，祭司长和法利赛人就问他们：“你们为什么没有把他带来？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文差役未能捉拿耶稣的情节，表达叙事上的结果与推进。
- source_word: ὑπηρέται
  choice: 差役
  rationale: 这里指受宗教当局差遣、前去拘拿耶稣的执行人员；“差役”比泛称“仆人”更符合语境，同时避免把原文未明说的机构名称加入正文。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指祭司阶层中的领袖，是该复数名词在本语境中的通行译法。
- source_word: Φαρισαίους
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般读者熟悉的群体名称。
- source_word: ἐκεῖνοι
  choice: 他们
  rationale: 原文以指示代词强调先行所提的祭司长和法利赛人。中文若直译为“那些人”略显疏离且可能含贬义；依语境用“他们”自然指回这两群人，并通过将受话者明确为“差役”消除代词歧义。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 自然、准确地表达原因问句。
- source_word: οὐκ ἠγάγετε αὐτόν
  choice: 没有把他带来
  rationale: ἄγω本义可指“领、带”，此处涉及奉命拘拿耶稣并将他带回，译作“把他带来”最符合方向和语境。
theological_decisions:
- issue: 是否把差役的任务直接表述为“逮捕”或“捉拿”
  choice: 正文保留“把他带来”
  alternative: “没有把他抓来”或“没有逮捕他”
  rationale: 上下文确实是拘拿耶稣，但本节动词本身是“领来、带来”；保留较宽的措辞，既符合原文，也不将上下文推论直接代入动词。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“回到……那里”根据前文差役奉差离开后归来这一语境表达希腊文ἦλθον πρὸς的实际方向；分号清楚区分差役返回与当局发问两个动作。
