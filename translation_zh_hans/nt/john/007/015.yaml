  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: zh_hans
  text: 于是，犹太人[a]感到惊奇，说：“这个人没有受过学，怎么会有这样的学问呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“犹太人”按上下文是指在耶路撒冷与耶稣交谈或反对他的犹太人，很可能包括犹太权威人士，并不是泛指所有犹太人。
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: 很惊讶
  rationale: 未完成时描写当时持续的反应；现代汉语用“很惊讶”自然表达他们因耶稣的学识而诧异。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文耶稣上殿教导的叙事发展，比“所以”更符合此处的叙事语气。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 保留约翰福音中这一表达的基本词义，不在正文中直接缩窄为“犹太领袖”；脚注说明本处的语境所指。
- source_word: λέγοντες
  choice: 说
  rationale: 自然地引出直接引语，准确传达希腊语分词的功能。
- source_word: Πῶς
  choice: 怎么会
  rationale: 既表达对途径的疑问，也自然传达说话者惊讶、不解的语气。
- source_word: οὗτος
  choice: 这个人
  rationale: 符合现代汉语指人的习惯，并保留原文略带距离感的指称。
- source_word: γράμματα
  choice: 经书
  rationale: γράμματα可指文字、典籍或学问；在圣殿教导和未受正式学习的语境中，“经书”自然体现其对神圣典籍的知识，同时以脚注保留“文字、学问”等词义范围。
- source_word: οἶδεν
  choice: 懂得
  rationale: 表达οἶδα的状态性知识，并与“经书”搭配自然。
- source_word: μὴ μεμαθηκώς
  choice: 没有受过教导
  rationale: 保留完成分词所指未经历学习或受教的状态，又不把原文进一步限定为某一特定拉比学校或教育制度。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι在本节的所指
  choice: 正文译作“犹太人”，以脚注交代语境
  alternative: 犹太领袖；犹太地区的人
  rationale: 原文使用一般性群体称谓，正文保留其措辞和可能的张力；但本节场景位于耶路撒冷，语境所指是当时与耶稣对话或反对他的犹太人，很可能包括当地权威人士，并非对全体犹太民族的概括。
- issue: γράμματα所指的知识范围
  choice: 正文译作“经书”，脚注保留“文字、典籍或学问”的可能性
  alternative: 文字；学问
  rationale: 上下文谈耶稣在圣殿中的教导，因而很可能侧重他对经书的掌握；不过该词本身的意义较宽，脚注避免把词义绝对限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”自然承接上文；问句使用“怎么会”体现惊讶。“没有受过教导”避免生硬的“未曾学习”，也不擅自加入“正式”或“拉比门下”等原文未明说的信息。
