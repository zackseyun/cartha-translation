  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: zh_hans
  text: 众人回答说：“你被鬼附了[a]！谁想要杀你？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你有鬼。”直译：“你有一个鬼。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: 用于叙事中的对话回应；“回答说”符合现代汉语圣经叙事的庄重自然语体。
- source_word: ὁ ὄχλος
  choice: 众人
  rationale: 指现场聚集的人群；“众人”简洁自然，也避免较生硬的“群众”。
- source_word: Δαιμόνιον ἔχεις
  choice: 你有鬼附着
  rationale: 原文直译为“你有鬼”。汉语中“有鬼附着”既保留“有”的表达，又清楚传达这是对耶稣受邪灵影响的敌意指控，而非叙述者的判断。
- source_word: τίς
  choice: 谁
  rationale: 保留原文明确的疑问代词及反问语气，不改写为直接否认。
- source_word: ζητεῖ
  choice: 想要
  rationale: 在“想要杀你”中自然表达对方正在谋求、意图采取行动；较“寻找机会”更少增添原文没有明说的内容。
- source_word: ἀποκτεῖναι
  choice: 杀
  rationale: 直接对应“杀死”，不加入“谋杀”所带的额外法律或道德定性。
theological_decisions:
- issue: 群众用 δαιμόνιον 对耶稣所作的指控
  choice: 正文译作“你有鬼附着”
  alternative: “你被鬼附了”或直译“你有鬼”
  rationale: 这是群众的敌意指控，并非经文叙述者认可的判断。“你有鬼附着”保留原文“有鬼”的措辞，同时让现代读者明白其惯用含义；脚注列出更直译和更解释性的表达。
translation_notes:
  register: 采用现代、自然而庄重的叙事用语。“众人”适合现场人群；引语保留突兀的指控和反问。脚注标记置于整句引语之后，说明“有鬼”这一表达的直译与惯用含义。
