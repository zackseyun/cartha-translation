  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: zh_hans
  text: 人若愿意遵行他的旨意，就会知道这教导究竟是出于上帝，还是我所说的是出于我自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我凭自己说话”，或“我凭自己的权柄说话”。希腊文的字面意思是“我从自己而说”。
    reason: 词义替代：说明ἀπ’ ἐμαυτοῦ按字面指话语的来源，也可含有独立地或凭自身权柄说话的意思。
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: 人若愿意
  rationale: ἐάν加虚拟语气表达一般条件；θέλω兼有意愿和愿望之意。“人若愿意”自然地保留了意志层面的含义。
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: 遵行他的旨意
  rationale: ποιεῖν与θέλημα连用，意为实行某人的旨意。现代汉语中“遵行……的旨意”比逐字译作“做……的旨意”自然庄重，同时保留代词“他的”。
- source_word: γνώσεται
  choice: 就会知道
  rationale: 将来时在条件句后表达由此产生的认识或辨明；“就会知道”简洁自然，也呈现条件与结果的关系。
- source_word: περὶ τῆς διδαχῆς
  choice: 这教导
  rationale: περί加属格表示关于某事；定冠词所指的是上下文正在讨论的耶稣的教导。汉语以“知道这教导……”自然承接后面的来源判断，无须机械加入“关于”。
- source_word: πότερον ... ἢ
  choice: 究竟是……还是……
  rationale: 该关联结构明确列出两个备选判断；“究竟是……还是……”符合现代汉语表达，并保留辨别两种来源的张力。
- source_word: ἐκ τοῦ θεοῦ
  choice: 出于上帝
  rationale: ἐκ表示来源或起源；“出于上帝”直接保留来源意象，也不额外补入“而来”。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 出于自己
  rationale: 该短语字面表达“从我自己”，着重话语的来源。“出于自己”在汉语中既可理解，又避免在正文中过度明确为“凭自己的权柄”。
- source_word: λαλῶ
  choice: 我……说的
  rationale: 希腊文现在时指耶稣当下所说的话；汉语用“我……说的”自然地嵌入“是……还是……”的判断结构。
theological_decisions:
- issue: αὐτοῦ在“他的旨意”中的指代
  choice: 保留“他的”，由上下文指向上帝
  alternative: 明确译作“上帝的旨意”
  rationale: 上下文讨论耶稣的教导是否出于上帝，因此指代相当清楚；正文保留原文代词，避免不必要地将所指明说出来。
- issue: ἀπ’ ἐμαυτοῦ的含义范围
  choice: 正文译作“出于自己”，保留来源表达
  alternative: “凭自己说”或“凭自己的权柄说”
  rationale: 原文直接表达来源或起点，并可能含有独立行事、凭自身权柄的意味；正文不将这一含义过度限定，其他可能译法置于脚注。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“遵行他的旨意”符合常用宗教语境，但不过分古雅；“究竟是……还是……”清楚呈现原文的两项选择。脚注标记置于其实际说明的“出于自己说的”之后。
