  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: zh_hans
  text: 耶稣说了这些话，自己仍留在加利利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指向前文耶稣所说的内容；“这些话”在现代汉语中自然，也保留了复数所涵盖的多项言语内容。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要承担轻微的叙事推进功能；汉语以分句次序即可自然表达，若机械译作“然后”或“但”反而可能增添原文没有的强烈时间或转折色彩。
- source_word: εἰπὼν
  choice: 说了
  rationale: 不定过去时分词表示其动作先于主句“留在”；“说了这些话”简洁自然地传达“说完/说过这些话以后”，又不夸大动作完成性的语义。
- source_word: αὐτὸς
  choice: 自己
  rationale: 显式代词具有一定强调作用，并可能与上下文中耶稣的弟弟们形成对照；“自己”保留这种强调，同时符合现代汉语表达。
- source_word: ἔμεινεν
  choice: 仍留在
  rationale: μένω在此为“停留、留在”；“仍留在”既自然表达持续停留，也与上下文中暂不前往犹太的情境相合，而不赋予该词额外神学含义。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: 在加利利
  rationale: 直接、自然地表达地点关系，并准确保留地名。
theological_decisions:
- issue: αὐτός是否应明确保留强调
  choice: 译作“自己”
  alternative: 仅以“耶稣”作主语，不另译强调
  rationale: 原文显式使用αὐτός，虽可仅承担主语指称，但在此语境中可能凸显耶稣本人的行动与弟弟们的行动不同。译作“自己”保留这层真实而不过度的强调。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。补出主语“耶稣”以避免汉语单节引用时指代不清；语序保持自然，不机械复制希腊语分词结构。
