  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: zh_hans
  text: 不要按外表判断[a]，却要作公正的判断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要凭表面现象判断，却要作公正的判断。”
    reason: 说明κατ’ ὄψιν也可较完整地表达为“凭表面现象”，突出以所见表象为依据的含义。
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: 不要……判断
  rationale: μή加现在时命令语气在这里自然表达禁令；不强行把体貌解释为“停止”。
- source_word: κατ’ ὄψιν
  choice: 按外表
  rationale: 指以眼前所见或表面现象为判断依据；“按外表”简洁自然，并保留原文的表层观感含义。
- source_word: ἀλλὰ
  choice: 却要
  rationale: 明确呈现前后两种判断方式的强烈对比，同时衔接汉语中的禁令与正面命令。
- source_word: τὴν δικαίαν κρίσιν
  choice: 公正的判断
  rationale: δικαίαν在此兼具正当、公义与公平的伦理司法意味；现代汉语用“公正”既自然，也不把含义限缩为单纯程序公平。
- source_word: κρίνετε
  choice: 作……判断
  rationale: 与前句“判断”重复，保留希腊文同一动词构成的修辞呼应；“作公正的判断”也自然承接其宾语结构。
theological_decisions:
- issue: δικαίαν在伦理—司法语境中的表达
  choice: 公正的
  alternative: 公义的／正义的
  rationale: “公正的判断”是自然、庄重的现代汉语，涵盖合乎正道与不偏不倚之意；“公义”虽有圣经语感，却在此可能显得术语化，“正义的判断”则略不如“公正”地道。
- issue: 经文是否禁止一切判断
  choice: 保留对判断依据与方式的对照
  alternative: 释义为“不可论断人”
  rationale: 原文先禁止κατ’ ὄψιν的判断，继而命令作δικαία κρίσις；译文不把它绝对化为禁止所有判断，也不额外限定判断对象。
translation_notes:
  register: 采用现代标准普通话，语气简洁、庄重且易懂。前后重复“判断”，保留原文的平行与对照；避免使用过度教会化或法律术语化的措辞。
