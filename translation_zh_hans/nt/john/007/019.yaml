id: JHN.7.19
reference: John 7:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: zh_hans
  text: 摩西不是把律法赐给你们了吗？可是你们没有一个人遵行律法[a]。你们为什么想要杀我？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“行律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ Μωϋσῆς δέδωκεν ὑμῖν τὸν νόμον;
  choice: 摩西不是把律法赐给你们了吗？
  rationale: 句首的οὐ表明反问预期肯定回答；“不是……了吗”自然保留这一修辞力量。δέδωκεν是完成时，中文句式不必强行标出英语式的时态区别，也能表达律法已赐下且其效力延续至今。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 因经文明说由摩西赐下，此处特指摩西律法；中文“律法”已足以明确所指，无须增译“摩西的”。
- source_word: καὶ
  choice: 可是
  rationale: καί在这里连接一个与前句形成明显反差的陈述；“可是”以自然中文表达这一转折关系。
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: 你们没有一个人
  rationale: 保留全称否定及其强调语气，比单说“你们都不”更贴近原文结构。
- source_word: ποιεῖ τὸν νόμον
  choice: 遵行律法
  rationale: ποιέω字面为“行、做”，与“律法”搭配时意为实行、遵守律法；“遵行律法”在现代中文中自然清楚，同时保留行为层面的含义。
- source_word: τί με ζητεῖτε ἀποκτεῖναι;
  choice: 你们为什么想要杀我？
  rationale: τί在此表示原因，译作“为什么”；ζητεῖτε加不定式表示企图或意图，“想要杀”自然表达持续的杀害意图，又不额外断定行动进展到何种程度。
theological_decisions:
- issue: “律法”的所指
  choice: 指借摩西赐给以色列的律法
  alternative: 泛指一般性的道德法则
  rationale: 经文直接提到摩西赐下律法，因此最自然的所指是摩西律法；译文不添加解释性限定，以免超出原文。
- issue: “没有一个人遵行律法”的绝对措辞
  choice: 保留原文的全面指控
  alternative: 弱化为“没有人完全遵守律法”
  rationale: 原文没有“完全”一词；增添它会把话语明确限定为遵守程度的问题。译文保留耶稣话语本身的尖锐与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赐给”符合律法作为神圣托付的语境；“可是”清楚呈现上下句反差；避免使用生硬的“做律法”，并以脚注保留原文较直译的表达。
