  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: zh_hans
  text: 但他们中有些人想要抓住他[a]，却没有人伸手抓他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抓住”也可译作“拘捕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: 但……有些人
  rationale: τινὲς指未明确的一部分人；δὲ在上下文中带出与前面群众反应的对比，用“但”自然表达。
- source_word: ἤθελον
  choice: 想要
  rationale: 未完成时表达过去持续存在或尚未实现的意图；“想要”既自然，又不把意图误译成实际行动。
- source_word: ἐξ αὐτῶν
  choice: 他们中
  rationale: 表达从前述群体当中划出一部分人的意思，简洁自然。
- source_word: πιάσαι
  choice: 抓住
  rationale: πιάζω的基本意思是抓住、拿住；本处语境可以含有拘捕之意，但正文保留较宽的动作含义。
- source_word: ἀλλ’ οὐδεὶς
  choice: 可是没有一个人
  rationale: ἀλλά形成强烈转折，οὐδείς彻底否定任何人实际采取行动；此译清楚呈现意图与结果的反差。
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: 下手拿他
  rationale: 原文是把手加在某人身上的惯用表达，指敌意地动手抓拿；“下手拿他”在现代汉语中自然，并保留实际动手的形象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“抓住”保留原词的动作性和拘捕语境之间的张力；后半句用“下手拿他”避免与前半句机械重复，同时对应原文“把手加在他身上”的惯用表达。
