  naturalness: “但他们中有些人想要抓住他”自然。将末句改为“却没有人向他下手”虽较自然，却仍可能含混；“却没有人向他伸手”亦不够明确。用“却没有人伸手抓他”最清楚自然，并保留从意图到未实际动手的对比。
