base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: zh_hans
  text: 节期的最后一天，就是那隆重的日子，耶稣站着，高声呼喊说：“谁口渴，就到我这里来喝！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 节期的末日
  rationale: ἐν加与格表示时间，δέ是轻微的承接词；汉语叙事无须机械译出。将“节期”提前，可使句子自然，同时保留“末日”这一直接的时间表述。
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: 就是那隆重的日子
  rationale: μέγας修饰“日子”，表明这是节期中格外隆重、重要的一日。“隆重”比直译“大”更符合现代汉语节庆语境，又不具体判定是哪一天。
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: 耶稣站着
  rationale: 该形式表示耶稣处于站立状态。“站着”自然地保留姿态，不额外引申为“挺身而出”或“站起来”。
- source_word: ἔκραξεν λέγων
  choice: 高声说
  rationale: κράζω表示大声公开呼喊；“高声说”庄重自然，也避免“喊叫”可能带有的失控色彩。分词λέγων在汉语中融入引语动词即可，无须重复译作“说着”。
- source_word: Ἐάν τις διψᾷ
  choice: 谁渴了
  rationale: τις为不定、泛指的单数表达；“谁……就……”是现代汉语自然的泛指条件结构。保留“渴”的意象，不在正文中解释其属灵含义。
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: 就到我这里来喝
  rationale: 两个现在时命令语气表达邀请兼命令。汉语用“就”承接条件句，并以“来喝”自然保留两个动作及其连续关系。
theological_decisions:
- issue: 口渴与喝水的比喻含义
  choice: 正文保留“渴”和“喝”的原始意象，不解释为相信、得生命或领受圣灵。
  alternative: 意译为“谁渴慕生命，就到我这里来领受”。
  rationale: 本节的开放性意象在随后经文中继续展开；提前释义会消解约翰叙述刻意保留的神学张力。
- issue: τις的泛指表达
  choice: 译作“谁……就……”，涵盖任何人而不添加性别。
  alternative: 译作“若有人渴了，他就当到我这里来喝”。
  rationale: 希腊语τις在此是语法上的单数泛指，并不指定男性。汉语“谁……就……”既保持单数泛指功能，也无需引入原文没有的性别信息。
- issue: “节期末日”具体所指
  choice: 仅译为“节期的末日，就是那隆重的日子”。
  alternative: 在正文中明确译为住棚节第七日或第八日。
  rationale: 本节本身没有明确判定具体日次；译文不应借解释性传统消除这一历史问题上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“末日”在节期语境中意为最后一天；“隆重的日子”传达μέγας的强调。“高声说”体现公开而郑重的呼告。全节不需脚注。
