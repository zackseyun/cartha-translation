base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: zh_hans
  text: 然而，没有人公开谈论他，因为怕犹太人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的“犹太人”按语境也可能更具体地指“犹太领袖”或“犹太地的当权者”。在《约翰福音》中，这个词有时泛指犹太人，有时则指反对耶稣的耶路撒冷当权群体。
    reason: 说明原词在约翰叙事中的指称范围，保留歧义并避免时代错置或反犹误读。
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 完整表达不定否定代词，指当时议论耶稣的人群中无人敢公开发言。
- source_word: μέντοι
  choice: 然而
  rationale: 承接上文众人私下的不同议论，并形成温和转折。
- source_word: παρρησίᾳ
  choice: 公开
  rationale: 此处侧重不加掩饰、在公众场合明说；“公开”自然准确，也与下文的惧怕形成对照。
- source_word: ἐλάλει
  choice: 谈论
  rationale: 未完成时呈现当时持续或反复发生的言谈情形；现代汉语不必另加进行体标记，也可由语境体现。
- source_word: περὶ αὐτοῦ
  choice: 谈论他
  rationale: 自然表达 περί 加属格所表示的“关于他”。
- source_word: διὰ τὸν φόβον
  choice: 因为怕
  rationale: 表达 διά 加宾格的原因意义；比直译为“因为恐惧”更符合现代汉语，同时保留因惧怕而不敢公开说话的关系。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 保留原词较宽的字面指称，不在正文中强行限定为领袖；脚注说明本段语境中可能更具体地指犹太领袖或犹太地区的当权者。
theological_decisions:
- issue: 约翰叙事中 τῶν Ἰουδαίων 的具体所指
  choice: 正文译作“犹太人”，并加脚注说明语境上的较窄可能性。
  alternative: 犹太领袖；犹太地区的当权者；犹太地人
  rationale: 原词可泛指犹太人，也可在约翰福音某些语境中指耶路撒冷一带反对耶稣的权势群体。正文保留词义张力，脚注防止把特定冲突错误扩大为对全体犹太人的概括。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”体现与上文的转折；将原因短语前置，使“因为怕……，没有人……”符合自然汉语语序。正文保留“犹太人”的原文宽度，并以脚注交代较可能的具体语境。
