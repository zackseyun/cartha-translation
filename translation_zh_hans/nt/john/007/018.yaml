id: JHN.7.18
reference: John 7:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: zh_hans
  text: 凭自己说话的人，是在寻求自己的荣耀[a]；但寻求那差派他的人的荣耀的人，这人是真实的[b]，他里面没有不义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭自己”也可译作“出于自己”或“凭自己的权柄”。
    reason: lexical_alternative
  - marker: b
    text: “真实的”也可译作“诚实可信的”。
    reason: lexical_alternative
  - marker: c
    text: “不义”也可译作“不公”或“恶行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: 凭自己
  rationale: 保留“从自己而出”的基本意象及其与“受差派”之间的对比，同时符合现代汉语表达；不在正文中把隐含意思限定为“凭自己的权柄”。
- source_word: λαλῶν
  choice: 说话的人
  rationale: 现在分词带冠词，在句中指一类人；译为“说话的人”自然地表达其概括性。
- source_word: τὴν δόξαν τὴν ἰδίαν
  choice: 自己的荣耀
  rationale: “荣耀”保留约翰著作中 δόξα 的重要语义与神学呼应，“自己的”准确呈现 ἰδίαν，并与差派者的荣耀形成对照。
- source_word: ζητεῖ / ζητῶν
  choice: 寻求
  rationale: 两处使用同一译词，保留原文的重复和平行对比。
- source_word: τοῦ πέμψαντος αὐτόν
  choice: 那差派他来者
  rationale: 准确表达带冠词的过去分词及其个人施事性；“差派”清楚呈现使命关系，“来”使汉语自然，但不额外指定差派者身份。
- source_word: οὗτος
  choice: 这人
  rationale: 保留指示代词的强调作用，比单译“他”更贴近原文，同时在现代汉语中自然。
- source_word: ἀληθής
  choice: 真实的
  rationale: 保留该词可指真实、可靠或诚实的语义宽度以及约翰式“真”的用语，不将它缩窄为仅仅“不说谎”。
- source_word: ἀδικία
  choice: 不义
  rationale: “不义”兼具道德与神学幅度，比单指社会层面不公平的“不公”更能覆盖原词，但其他可能译法列入脚注。
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: 他里面没有
  rationale: 保留原文“在他里面”的内在品格表述，同时是清楚可懂的汉语。
theological_decisions:
- issue: “凭自己说话”与寻求差派者荣耀之间的对比
  choice: 按原文呈现自我来源、自我荣耀与受差派、寻求差派者荣耀的对照，不进一步技术化解释其权柄性质。
  alternative: 将 ἀφ’ ἑαυτοῦ 明确定译为“凭自己的权柄”。
  rationale: 上下文涉及教导的来源和目的，但希腊语本身保留一定语义空间；正文应避免把隐含意义变成唯一解释。
- issue: ἀληθής 对受差派者品格的描述
  choice: 译作“真实的”，保留“真、可靠、诚实”的交叠含义。
  alternative: 译作“诚实可信的”。
  rationale: “真实的”延续约翰文献的关键词联系；脚注承认上下文中有关可信与诚实的具体语感。
- issue: ἀδικία 的道德与神学范围
  choice: 译作“不义”。
  alternative: 译作“不公”或“恶行”。
  rationale: 本句描述人的内在正直，“不义”能够同时涵盖不正、不公和错误行为，而不把含义局限于司法或社会层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那差派他来者”略带经文体色彩，用来简洁保留原文的关系结构；分号呈现两个平行分句之间鲜明的对照。所有脚注标记均紧随相应词语。
