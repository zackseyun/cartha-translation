  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: zh_hans
  text: 我认识他，因为[a]我出于他[b]，并且是他差遣了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”所译的希腊语连接词也可理解为引出内容，即“我知道我出于他”；不过，上下文较支持原因的意思。
    reason: lexical_alternative
  - marker: b
    text: “我出于他”也可译作“我从他那里来”或“我从他面前而来”。希腊语短语可特别表示来源或起源。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留明说的第一人称代词；在上下文中，这使耶稣的自我宣告与众人的无知形成鲜明对照。
- source_word: οἶδα
  choice: 认识
  rationale: οἶδα在此表示现时的认识状态。对作为人的宾语，用“认识”比单用“知道”更自然，也保留关系性的含义。
- source_word: αὐτόν
  choice: 他
  rationale: 按上下文指父；正文保留代词，不加入解释性称谓。
- source_word: ὅτι
  choice: 因为
  rationale: 将ὅτι理解为引出原因，即耶稣认识他的缘由；上下文较支持这一读法，同时以脚注保留内容从句的可能性。
- source_word: παρ’ αὐτοῦ
  choice: 出于他
  rationale: παρά加属格可表示来源或起源。“出于他”简洁地保留这种来源关系，又不把意思局限为地点或单纯的差遣行动。
- source_word: εἰμι
  choice: 我出于他
  rationale: 保留εἰμι的现在时状态含义，以“出于”构成自然而庄重的汉语表达，不扩写成“我从他那里来了”。
- source_word: κἀκεῖνός
  choice: 并且是他
  rationale: κἀκεῖνος由καί与ἐκεῖνος缩合而成；“并且是他”既表达连接，也保留该指示代词在此处对差遣者的强调。
- source_word: με
  choice: 我
  rationale: 作为ἀπέστειλεν的直接宾语，按现代汉语自然译为“我”。
- source_word: ἀπέστειλεν
  choice: 差遣了
  rationale: 用“差遣”表达受命执行使命的语义，并以“了”自然呈现不定过去时所指的既成差遣行动。
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι所表达的耶稣与父的关系
  choice: 我出于他
  alternative: 我从他那里来；我来自他面前
  rationale: “出于他”表达来源或起源，同时保留约翰文本的神学深度，不将其窄化为单纯的行程、地点或差遣。
- issue: ὅτι在句中的功能
  choice: 因为（原因）
  alternative: 即／就是（引出所知道的内容）
  rationale: 因果读法最顺合当前论证：耶稣认识父，因为他出于父；但希腊语ὅτι也可能引出内容，因此在脚注中保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“认识”适合以人为宾语；“出于他”略带庄严色彩，但在现代宗教及正式语境中清楚自然，并能较贴近原文对来源关系的含蓄表达。
