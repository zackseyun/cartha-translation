  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: zh_hans
  text: 经上不是说，弥赛亚[a]出自大卫的后裔，也出自伯利恒——大卫所在的村庄吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文为ὁ χριστός，意为“受膏者”。
    reason: 提供传统称号译法，并说明希腊文含义。
lexical_decisions:
- source_word: ἡ γραφή
  choice: 经上
  rationale: 在约翰福音中指具有权威的圣经；“经上”是现代中文引用圣经见证时自然、庄重的表达。
- source_word: εἶπεν
  choice: 说
  rationale: 希腊语不定过去时指经文已经说过的话；中文反问句用“不是说”即可自然表达其持续有效的权威。
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: 出自大卫的后裔
  rationale: σπέρμα在此表示血统或后代，并非字面的“种子”；此译保留来源关系和家系含义。
- source_word: ἀπὸ Βηθλέεμ
  choice: 出自……伯利恒
  rationale: ἀπό表示来源；“出自”准确传达弥赛亚与伯利恒之间的地域来源关系。
- source_word: τῆς κώμης
  choice: 村庄
  rationale: κώμη指村庄或较小的聚落；“村庄”比“城”或“城镇”更贴近原词。
- source_word: ὅπου ἦν Δαυίδ
  choice: 大卫所在的
  rationale: 原文只说“大卫在那里/所在之处”，没有明说是出生、居住还是故乡；该译刻意保留这种简约与含混。
- source_word: ἔρχεται
  choice: 出自
  rationale: 在讨论弥赛亚来源的语境中，中文用“出自”比直译“来”更自然，并与两个来源短语顺畅衔接。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是犹太人所期待的受膏君王之称号，并非姓名化用法；“弥赛亚”能清楚呈现该称号在争论中的含义。
theological_decisions:
- issue: ὁ χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文讨论圣经对受膏者出身的期待，因此采用表达犹太弥赛亚称号的“弥赛亚”，同时在脚注保留传统译名“基督”。
- issue: ὅπου ἦν Δαυίδ所指关系
  choice: 大卫所在的
  alternative: 大卫的故乡／大卫住过的
  rationale: 原文没有明确说明伯利恒与大卫的关系究竟是故乡、出生地还是居住地，正文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。反问结构保留原文论辩语气；两个“出自”对应并列的家系来源与地域来源。“大卫所在的”略带书面色彩，但可避免把原文未明说的关系解释为“故乡”或“住过的地方”。
