  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: zh_hans
  text: 信我的人，正如圣经所说，活水的江河要从他[a]腹中[b]流出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”通常理解为信的人；也有人认为这里指弥赛亚，即活水从他里面流出。
    reason: alternative_reading
  - marker: b
    text: “腹中”也可译作“里面”或“内心深处”；原词可直指腹部或母腹，这里很可能比喻人的内在深处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: 信我的人
  rationale: 带冠词的现在分词作名词用，指以信为特征的人；“信我的人”在现代汉语中自然，也保留单数概括性的表达。εἰς ἐμέ 与 πιστεύω 连用，表示信靠的对象，译作“信我”最符合汉语习惯。
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: 正如圣经所说
  rationale: “正如”表达 καθὼς 的比较和引证作用；“圣经”保留 ἡ γραφή 的单数权威性用法。“所说”是汉语引述经文时自然庄重的表达。
- source_word: ποταμοὶ
  choice: 江河
  rationale: ποταμοί 为复数，所指规模大于一般溪流；“江河”既保留复数和丰盛意象，又符合现代汉语圣经语体。
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: 从他腹中
  rationale: “腹中”直接保留 κοιλία 的身体意象，同时在汉语中可以承载“人的内在深处”的比喻义；“他”反映希腊文阳性单数代词，但其所指仍存在解释上的张力。
- source_word: ῥεύσουσιν
  choice: 必……流出来
  rationale: 译出将来时所表达的应许；“必”在此表示确定的将来，“流出来”自然呈现水从内向外流动。
- source_word: ὕδατος ζῶντος
  choice: 活水
  rationale: “活水”保留约翰福音中的核心意象及其神学回响，不将其单一化地解释为“赐生命的水”或仅仅“流动的水”。
theological_decisions:
- issue: αὐτοῦ（“他”）的所指
  choice: 正文按最近的语法先行词理解为信的人
  alternative: “他”也可能指弥赛亚／耶稣，即活水从基督里面流出
  rationale: 最近且最自然的语法先行词是“信我的人”，并与下一节信徒将领受圣灵的说明相协调；但弥赛亚为活水源头的理解有其解释传统，故以脚注保留，不在正文中暗自排除。
- issue: κοιλία 的比喻意义
  choice: 正文译为“腹中”
  alternative: 可意译为“内心深处”或“里面”
  rationale: 直译保留原文鲜明而略显突兀的身体意象，也避免预先限定它只指思想、情感或灵性中心；脚注说明其可能的比喻用法。
- issue: καθὼς εἶπεν ἡ γραφή 与上下文的连接
  choice: 按通常读法，将“圣经所说”引向随后关于活水江河的陈述
  alternative: 也可能把“正如圣经所说”与前面的“信我”联系起来
  rationale: 希腊文原稿没有现代标点，句法连接存在一定歧义；正文采用较常见、较顺畅的理解，但不声称对应某一处逐字引文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“江河”“腹中”“活水”保留原文浓厚的意象；句序调整为自然汉语，同时没有消除代词所指和身体隐喻所含的解释张力。
