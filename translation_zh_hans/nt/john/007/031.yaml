source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: zh_hans
  text: 不过，人群中有许多人信了他[a]。他们一直在说：“弥赛亚来的时候，难道会行比这个人所行的更多神迹吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”；希腊文 Χριστός 的意思是“受膏者”。这里用作犹太人所期待之来者的称号。
    reason: 说明称号的另一传统译法及其语境含义。
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: 不过，人群中有许多人
  rationale: ἐκ τοῦ ὄχλου 表明这些人是从较大人群中划分出来的一部分；汉语用“人群中有许多人”自然地保留这一部分含义。δὲ 在上下文中构成轻微转折，译作“不过”。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 信了他
  rationale: πιστεύω 与 εἰς 连用，表示以某人为信靠的对象。“信了他”简明自然，也避免加入原文没有明说的信心程度。
- source_word: ἔλεγον
  choice: 一直在说
  rationale: 未完成时态呈现持续或反复的言说；“一直在说”在现代汉语中清楚保留这一体貌。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 这里是带冠词的称号，并处于犹太人期待受膏者来临的语境中；“弥赛亚”比名称化的“基督”更能显出其称号功能。
- source_word: ὅταν ἔλθῃ
  choice: 来的时候
  rationale: ὅταν 加虚拟语气指向尚未发生的将来情形；在这个问句中，“来的时候”比“如果来”更自然，同时不把它误译为已经实现的时间陈述。
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: 难道会行……更多神迹吗
  rationale: μή 引导的问句通常预期否定回答。“难道……吗”保留这种反问语气；πλείονα 表数量较多，因此译作“更多”，而不是“更大的”。
- source_word: σημεῖα
  choice: 神迹
  rationale: 约翰福音中的 σημεῖον 指具有启示和指向作用的超常作为。现代中文圣经语域中的“神迹”既自然，也保留了“迹”所含的标记意味；单译“记号”在此容易被普通读者误解。
- source_word: οὗτος ἐποίησεν
  choice: 这个人所行的
  rationale: οὗτος 在人群的话语中指耶稣，译作“这个人”符合公共议论的口吻；“所行的”与前面的“行……神迹”照应，并保留已完成行为与将来比较的关系。
theological_decisions:
- issue: Χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处“弥赛亚来的时候”清楚呈现犹太人对那位受膏者的期待，因此主文采用称号性更鲜明的“弥赛亚”；脚注保留“基督”这一传统对应词。
- issue: μή 所引反问的力度
  choice: 用“难道……吗”表达预期否定回答
  alternative: 译成中性的“会不会……”
  rationale: 希腊文问句期待的回答是“不会”，反映人群认为耶稣所行神迹足以支持其弥赛亚身份；译文保留这种推论力度，却不直接替说话者断言耶稣的身份。
- issue: “信了他”的叙事含义
  choice: 保留未经限定的信的表述
  alternative: 解释为完全委身或仅仅初步认同
  rationale: 本节本身没有界定这些人的信达到何种深度；直译可保留约翰叙事中“信”可能具有的张力，不预先作神学判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不过”表现上下文转折；拆为两句以避免长句拖沓。“难道……吗”自然传达原文反问所预期的否定回答。
