  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: zh_hans
  text: “他所说的这话是什么意思[a]：‘你们会寻找我，却找不到我；而我所在的地方[b]，你们不能来’？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他所说的这话是什么？”希腊语λόγος按语境可指“话、话语、说法”或“信息”。
    reason: lexical_alternative
  - marker: b
    text: 有些译本译作“我要去的地方”，但这里的希腊原文是“我所在的地方”，保留了约翰行文中刻意留下的张力。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: 话
  rationale: 这里指耶稣所说内容，而不是单个字词。“话”在现代汉语中自然、庄重，也能涵盖“话语、说法、言论”的语义范围。
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: 这话是什么意思
  rationale: 希腊语直译近似“这话是什么”，但现代汉语如此表达不自然；按语境译为“这话是什么意思”，清楚传达众人对耶稣话语含义的疑问。
- source_word: Ζητήσετέ με
  choice: 你们会寻找我
  rationale: ζητέω意为“寻找、寻求”。“寻找我”既符合此处实际寻找的语境，也保留较正式的语气；“会”对应将来时。
- source_word: οὐχ εὑρήσετε
  choice: 却找不到
  rationale: 准确表达将来否定；“却”自然显明寻找与找不到之间的转折关系，宾语“我”可由前句承接而不必重复。
- source_word: ὅπου εἰμὶ ἐγώ
  choice: 我所在的地方
  rationale: 严格保留εἰμί的现在时“我在/我所在”，不解释为“我要去的地方”，并以自然汉语表达空间关系。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 你们不能来
  rationale: “不能来”自然、准确地表达δύνασθε所指的能力或可能性受限；比“没有能力来”更符合现代汉语。
- source_word: εἶπε
  choice: 他所说的
  rationale: 用定语结构自然引出被询问的那句话，并准确对应“他说”。
theological_decisions:
- issue: 耶稣话语中的现在时（“我所在的地方”）
  choice: 保留现在时“我所在的地方”
  alternative: “我要去的地方”
  rationale: 希腊文本使用现在时εἰμί（“我在”），而不是表示“去”的动词。保留这一表达，可维持约翰福音中有关耶稣所在、来源及其与父关系的张力，不以解释性译法提前消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这话是什么意思”符合自然汉语；引语保持为一个由前后两部分组成的连续话语。“我所在的地方”虽略显郑重，却能准确保留原文现在时及其神学张力。
