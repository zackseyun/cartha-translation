base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: zh_hans
  text: 可是，这群不懂律法[b]的人是被咒诅的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是在咒诅之下的”。
    reason: lexical_alternative
  - marker: b
    text: “律法”在这里指犹太人的律法，即妥拉。
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上文并表达强烈转折，符合争辩语境中的现代汉语表达。
- source_word: ὁ ὄχλος οὗτος
  choice: 这群……的人
  rationale: ὄχλος指群众；结合后面的限定分词译成“这群……的人”较自然，也不额外加入“暴民”的贬义。
- source_word: ὁ μὴ γινώσκων
  choice: 不懂
  rationale: 此处表示他们被说成不了解律法；“不懂”简洁自然，并保留说话者轻蔑的判断。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 在此指犹太人的律法，即妥拉；“律法”是现代中文圣经语境中清楚而庄重的对应词。
- source_word: ἐπάρατοί εἰσιν
  choice: 是受咒诅的
  rationale: 保留谓语形容词的断言和原文严厉的谴责语气；“受咒诅”也自然表达处在咒诅之下的含义。
theological_decisions:
- issue: 是否把说话者对群众的敌意判断处理成叙述者的神学断言
  choice: 直接保留在对话中的严厉断言，不软化，也不另加疏离措辞
  alternative: 增译为“他们说这群人受了咒诅”，明确与叙述者拉开距离
  rationale: 原文处于耶稣反对者的直接引语中；译文应忠实呈现其谴责，却不增添原文没有的叙述评论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这群……的人”避免把集合名词生硬地单独作主语；“受咒诅”保留原文强烈且带神学色彩的敌意判断。所有脚注标记均置于正文相应位置。
