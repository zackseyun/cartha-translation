base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“我做了一件事[a]，你们都感到惊讶。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一件事”也可译作“一项工作”。原文此词在《约翰福音》中常用来指耶稣所做的事，保留“工作”的译法可显示这一用词上的关联。
    reason: lexical_alternative
  - marker: b
    text: 这里很可能是回指耶稣在安息日治好病人的事，见《约翰福音》5:1—18。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: 回答……说
  rationale: 保留原文两个动词构成的叙事表达，同时符合现代汉语习惯。
- source_word: Ἓν ἔργον
  choice: 一件事
  rationale: 保留Ἓν所强调的“一件”；ἔργον在此指耶稣所做之事，译作“一件事”自然清楚，但以脚注注明“工作”这一可保留约翰用词呼应的译法。
- source_word: ἐποίησα
  choice: 我做了
  rationale: 以简明的完成性表达对应不定过去时，避免加入“施行”等原文没有的解释。
- source_word: πάντες
  choice: 都
  rationale: 结合第二人称复数动词译为“你们……都”，明确指受话的整个群体。
- source_word: θαυμάζετε
  choice: 惊讶
  rationale: 表达因不解而诧异的宽泛含义，不将其限定为正面的赞叹；以“就”自然呈现语境中的反应关系，但不增添因果强度。
theological_decisions:
- issue: ἔργον在约翰福音中的神学呼应
  choice: 正文译“一件事”，脚注列“一个工作”
  alternative: 正文译“一个工作”
  rationale: “工作”更能保持约翰反复使用ἔργον的术语联系，但现代汉语在此容易显得生硬；“一件事”较自然，脚注则保存其词汇与神学呼应。
- issue: 所指事件
  choice: 不在正文中明说，以脚注说明很可能指约翰福音5:1—18的安息日医治
  alternative: 在正文中补明为医治瘫子
  rationale: 原文只说“一件事”，具体所指来自上下文推断，应保存正文的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回答他们说”保留原文叙事句式；“惊讶”兼容诧异、困惑等语气，不把反应解释为赞赏。所有脚注标记均置于正文。
