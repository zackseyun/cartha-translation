  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: zh_hans
  text: 于是，有些耶路撒冷人说：“这不就是他们想要杀的人吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: 说
  rationale: 希腊语未完成时描写当时正在发生或反复出现的议论；现代汉语在这一叙事语境中用“说”即可自然表达，不必生硬增添“不断”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，既保留连接作用，也符合现代汉语表达。
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: 有些耶路撒冷人
  rationale: τινες表示不确定的一部分人，ἐκ表示他们出自耶路撒冷居民这一群体；“有些耶路撒冷人”简洁自然，并准确传达范围。
- source_word: Οὐχ οὗτός ἐστιν
  choice: 这不就是……吗
  rationale: Οὐχ引导预期肯定回答的反问；“这不就是……吗”保留其确认式的修辞语气。
- source_word: ζητοῦσιν
  choice: 他们想要
  rationale: 本处ζητέω结合杀害的不定式，表达正在谋求或企图做某事；“想要”在现代汉语中自然表达其当前意图，同时不额外断定行动进展。
- source_word: ἀποκτεῖναι
  choice: 杀
  rationale: 直接传达“杀死”的基本词义，不加入司法处决等原文未明说的含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。将“耶路撒冷人”理解为耶路撒冷居民；中文表述本身已涵盖“从耶路撒冷人中有些人”的意义，无需脚注。
