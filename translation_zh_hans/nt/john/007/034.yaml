  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: zh_hans
  text: 你们会寻找我，却找不到；我所在的地方，你们不能来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: 会寻找
  rationale: 这是第二人称复数的将来时主动直陈式。“会寻找”既保留将来意义，也自然表达试图找到耶稣，不额外赋予属灵追求的含义。
- source_word: με
  choice: 我
  rationale: 直接宾语代词，指耶稣。
- source_word: οὐχ εὑρήσετε
  choice: 却找不到
  rationale: 保留否定的将来结果；“却”自然显明寻找与找不到之间的转折，而不增添原文没有的强调程度。
- source_word: ὅπου εἰμὶ ἐγώ
  choice: 我所在的地方
  rationale: 自然表达地点关系，并借“我所在”保留ἐγώ所形成的主语对照，不添加原文没有的“那里”。
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: 你们不能来
  rationale: “不能”明确表达δύνασθε所涉及的能力，而非许可；“来”保留ἐλθεῖν以耶稣所在之处为趋向点的表达。
theological_decisions:
- issue: “你们不能来”所指的无能性质
  choice: 仅译为能力上的“不‌能”，不说明其成因
  alternative: 译成“你们不得来”，理解为禁止
  rationale: δύνασθε表达能力或可能性，而非许可；本节没有说明这种无能究竟是道德、属灵、审判性还是暂时的，因此译文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会寻找……却找不到”清楚传达将来行动及其结果；后半句保持简洁，不用神学术语解释原文未明说的原因。
