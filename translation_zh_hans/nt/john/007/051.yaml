  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: zh_hans
  text: 我们的律法岂会在未先听取他本人的陈述[a]、查明他在做什么之前，就审判一个人[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先听他说。”原文较直译为“先从他那里听取”。
    reason: lexical_alternative
  - marker: b
    text: 原文用泛指的单数“人”。
    reason: lexical_clarification
lexical_decisions:
- source_word: Μὴ
  choice: 难道……吗
  rationale: 句首的 μή 表明这个反问预期否定回答；“难道……吗”自然传达“当然不”的语气。
- source_word: ὁ νόμος ἡμῶν
  choice: 我们的律法
  rationale: 保留定冠词所指的共同体法律规范及第一人称复数领属关系，同时不把范围限定为仅指摩西五经。
- source_word: κρίνει
  choice: 审判
  rationale: κρίνω 在此处具有法律语境中的判断、审理之意；“审判”保留法律色彩，又不强化为“定罪”。
- source_word: τὸν ἄνθρωπον
  choice: 一个人
  rationale: ἄνθρωπος 在这里是泛指单数；“一个人”既保留单数形式，也自然涵盖一般意义上的人。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 这一组合引出审判之前不可缺少的否定条件；“若不”简洁而庄重。
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: 先听他本人的陈述
  rationale: ἀκούω 与 παρά 加属格表示直接从当事人那里听取；此译法清楚呈现程序顺序和信息来源。
- source_word: γνῷ
  choice: 查明
  rationale: γινώσκω 在司法语境中指经过听取而获知案情；“查明”比静态的“知道”更能体现查清事实的过程。
- source_word: τί ποιεῖ
  choice: 他在做什么
  rationale: 保留 ποιεῖ 的现在时态，不提前解释成“他做过什么”或特定罪行。
