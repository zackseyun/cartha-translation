  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: zh_hans
  text: 耶稣爱马大、她的姊妹和拉撒路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: 爱
  rationale: ἀγαπάω的未完成时在这里描述过去持续存在的态度；现代汉语用“爱”即可自然表达这种持续的爱，无须生硬地译成“正在爱着”。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的篇章连接词，并无明确的时间意义或强烈转折。汉语承接上文时省译更自然，也避免增添“这时”或“但是”等原文未明确表达的含义。
- source_word: τὴν Μάρθαν
  choice: 马大
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: 她妹妹
  rationale: 直指马大的姊妹；结合11:1所述马利亚与马大的关系，中文用“妹妹”自然明确，同时不在本节补出原文未重复的人名。
- source_word: τὸν Λάζαρον
  choice: 拉撒路
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: καὶ ... καὶ
  choice: 、……和……
  rationale: 希腊文并列三个受词；现代汉语以顿号加末项前的“和”表达同等并列，既忠实又自然。
theological_decisions:
- issue: 未完成时ἠγάπα所表达的耶稣之爱
  choice: 陈述耶稣持续爱马大、她妹妹和拉撒路
  alternative: 译为“开始爱”或强调为“当时一直爱着”
  rationale: 该未完成时最自然地描写过去持续存在的状态；简洁译作“爱”保留其持续性，又不额外强化起始或进行意味。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。句式简洁，保持三个人物并列；不添加解释性或宗派性措辞。
