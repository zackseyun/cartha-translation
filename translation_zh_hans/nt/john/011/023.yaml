  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: zh_hans
  text: 耶稣对她说：“你兄弟必复活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事中“说”本身不强制标明过去或现在，既自然，也保留原文的现场感。
- source_word: αὐτῇ
  choice: 对她
  rationale: 以“对她说”自然表达与格所标示的受话人。
- source_word: Ἀναστήσεται
  choice: 必复活
  rationale: 此处语境明确涉及拉撒路从死里起来；“复活”是现代汉语中准确、自然的表达。“必”体现将来陈述的确定语气，而不改为被动式，以免额外凸显原文在此没有明说的施动者。
- source_word: ὁ ἀδελφός σου
  choice: 你兄弟
  rationale: 自然表达第二人称所属关系；“兄弟”可指男性手足，符合这里拉撒路与马大的关系。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语圣经传统中通行的人名译法；希腊文冠词无需另译。
theological_decisions:
- issue: 复活表述及其时间指向
  choice: 必复活
  alternative: 必再起来；必被复活
  rationale: “复活”明确传达从死里起来，也符合上下文；本节本身没有说明这是即将发生的复生还是末日的复活，因此不在译文中补充时间或方式。“必被复活”会比希腊文形式更明显地引入施动者。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“你兄弟”比“你的兄弟”更凝练自然；全句保留原文直接、含有张力的应许语气。
