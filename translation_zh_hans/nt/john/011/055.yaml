source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: zh_hans
  text: 犹太人的逾越节[a]快到了，许多人从乡间上耶路撒冷去，为要在逾越节前洁净自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“犹太人的逾越节”，这是约翰福音中反复出现的说法；按节期含义，也可理解为“犹太人的逾越节期”。
    reason: lexical_alternative
  - marker: b
    text: 指在守逾越节之前按礼仪洁净自己。
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: 快到了
  rationale: ἐγγύς在这里表示时间临近；“快到了”是自然、清楚的现代汉语。δέ仅作轻微衔接，不必机械译出。
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: 犹太人的逾越节
  rationale: 保留属格结构以及约翰福音反复使用的表达，同时采用πάσχα通行的汉语译名“逾越节”。
- source_word: ἀνέβησαν
  choice: 上……去
  rationale: 既表达前往耶路撒冷，也保留前往耶路撒冷在地理和朝圣习惯上所具有的“上去”意味。
- source_word: ἐκ τῆς χώρας
  choice: 从乡间
  rationale: χώρα在此指城外各地或乡野地区；“乡间”自然地呈现其与耶路撒冷城的对照。
- source_word: πρὸ τοῦ πάσχα
  choice: 在逾越节前
  rationale: 直接、清楚地表达时间关系。
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: 为要……洁净自己
  rationale: ἵνα加虚拟语气表示目的；“洁净自己”保留礼仪洁净的含义，而不在正文中过度解释。
theological_decisions:
- issue: 逾越节前洁净的性质
  choice: 译作“洁净自己”，并以脚注说明这是为守逾越节所作的礼仪洁净。
  alternative: 行洁净礼；使自己成圣洁
  rationale: 上下文指犹太人在逾越节朝圣前所作的礼仪预备，不应将其直接解释为后来的基督教圣礼观念或内在道德洁净。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上耶路撒冷去”保留朝圣行程的传统空间表达；“为要”清楚标示目的，又不过分书面化。脚注标记分别紧随所解释的词语。
