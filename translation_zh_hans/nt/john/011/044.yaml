id: JHN.11.44
reference: John 11:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: zh_hans
  text: 那死了的人就出来了，手脚都用布条裹着，脸上包着一块布。耶稣对他们说：“解开他，让他走。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: 那死了的人
  rationale: 用名词化表达保留完成时分词所指的既成死亡状态，同时避免增添原文此处未出现的人名。
- source_word: κειρίαις
  choice: 布条
  rationale: 指缠裹遗体所用的布条；译作“布条”简明自然，又符合安葬语境。
- source_word: ἡ ὄψις
  choice: 脸上
  rationale: 本义可指面容、脸；结合被布包裹的动作，以现代汉语“脸上”表达最自然。
- source_word: σουδαρίῳ
  choice: 一块布
  rationale: 指包头或包脸用的小布巾；原文没有要求采用专门礼仪术语，故以通俗而准确的表达翻译。
- source_word: Λύσατε
  choice: 解开他
  rationale: 命令式复数，指解除裹在他身上的布条；中文以“解开他”自然涵盖此义。
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: 让他走
  rationale: 保留“允许／任凭他离去”的结构和简洁力度，不额外限定目的地。
theological_decisions:
- issue: 叙事现在时 λέγει 的时态表达
  choice: 耶稣对他们说
  alternative: 耶稣对他们说道／耶稣对他们说着
  rationale: 希腊文以历史现在时增强叙事现场感；现代汉语叙事通常不以形态时态区分，译为“说”既准确自然，也不把它误解为持续动作。
- issue: 复活后之人的称谓
  choice: 那死了的人
  alternative: 死人／那曾经死去的人
  rationale: 原文仍以“已经死了的那人”称呼他，形成死亡与如今走出的张力；“那死了的人”保留这种张力，而“曾经死去”更明确解释其当前状态。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式紧凑，保留原文先描述走出、再交代缠裹状态、最后记录耶稣命令的叙事次序。
