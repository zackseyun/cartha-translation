  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: zh_hans
  text: 但若有人在夜里行走，就会绊倒，因为光不在他里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“光不在他身边。”原文直译为“光不在他里面”，可能不仅指缺少外在的光照。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: 但人若
  rationale: 保留δέ的转折和ἐὰν的条件意味；τις作泛指，用“人”自然表达“任何人”的代表性含义。
- source_word: περιπατῇ
  choice: 行走
  rationale: 保留动词“行走”的具体图像，同时不排除约翰语境中的道德或属灵意味。
- source_word: ἐν τῇ νυκτί
  choice: 在夜里
  rationale: 贴近原文介词结构和“夜”的意象，不预先解释为抽象的“黑暗”。
- source_word: προσκόπτει
  choice: 绊倒
  rationale: 自然表达因看不见而失足，也保留可能的比喻含义。
- source_word: ὅτι τὸ φῶς
  choice: 因为光
  rationale: ὅτι在此引出原因；“光”保留上下文中明确而富有象征性的概念，汉语无需用冠词另作标示。
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: 不在他里面
  rationale: 直接保留ἐν αὐτῷ的“在他里面”，不将其弱化为仅仅缺少外在照明。
theological_decisions:
- issue: “光不在他里面”的所指及含义
  choice: 保留“在他里面”的内在措辞
  alternative: 译作“他身边没有光”或“没有光照着他”，仅指外在照明
  rationale: 原文ἐν通常表示“在……里面”。约翰著作中的光暗意象常具有更深层含义；直译可同时容纳眼前的夜行图景和潜在的属灵意味，而不替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行走”比“走路”略显端正，并能保留潜在的比喻意义；“在他里面”虽不如纯情境化译法口语化，却忠实呈现原文有意保留的张力。
