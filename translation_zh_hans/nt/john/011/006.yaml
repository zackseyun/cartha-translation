  naturalness: 原译整体通顺。“在他所在的地方停留了两天”在现代标准汉语中自然、庄重，也比“在原地住了两天”更准确地表达暂时停留而非居住。
  terminology: “听说”“拉撒路”“病了”均恰当。中文在间接引语后的“病了”可自然表达希腊文现在时所指的当时患病状态，无须设置时态脚注。
