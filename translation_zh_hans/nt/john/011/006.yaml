base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: zh_hans
  text: 所以，他听说拉撒路病了，就在他所在的地方停留了两天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: 所以……听说……后
  rationale: ὡς兼有时间关系，οὖν承接上文并推动叙事；汉语用“所以”承接，以“听说……病了”的句式自然表达时间关系。
- source_word: ἤκουσεν
  choice: 听说
  rationale: 这里指听到关于拉撒路患病的消息；“听说”比单说“听见”更符合现代汉语语境，也不额外说明消息传递方式。
- source_word: ὅτι ἀσθενεῖ
  choice: 拉撒路病了
  rationale: ἀσθενέω在本段明确指身体患病。希腊文用现在时，现代汉语在“听说”之后用“病了”自然表达当时已经处于患病状态；明说“拉撒路”可避免连续两个“他”造成指代混乱，所指由紧邻上文明确提供。
- source_word: τότε μὲν
  choice: 仍
  rationale: μέν在这里带出叙事中的轻微强调，并为随后行动的转折铺垫。结合上下文，“仍”自然保留了听闻病情后继续停留的张力，而不对原因作解释。
- source_word: ἔμεινεν
  choice: 住了
  rationale: μένω在此指留在某地；“住了两天”是现代汉语表达停留时长的自然说法。
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: 在原地
  rationale: 直译为“在他所在的地方”在汉语中较累赘；“在原地”准确表达他留在当时所在之处，没有移往别处。
- source_word: δύο ἡμέρας
  choice: 两天
  rationale: 这是表示持续时间的宾格，直接译为“两天”。
theological_decisions:
- issue: 耶稣听闻拉撒路患病后仍停留两天所形成的叙事张力
  choice: 直述“仍在原地住了两天”，不解释其动机
  alternative: 在正文中补充这是出于慈爱、计划或神圣目的
  rationale: 原文刻意将听闻病情与继续停留并置；译文应保留这种张力，让后文自行展开其意义，而不提前作神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”保留与上文的逻辑承接，“仍”凸显出乎读者预期的继续停留，但不把关系强化成原文未明说的强烈对立。
