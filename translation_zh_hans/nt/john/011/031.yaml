revisions:
- from: 所以，那些在屋里陪着马利亚、安慰她的犹太人[a]，看见她很快站起来走了出去，就跟着她，以为她要到坟墓那里去哭。
  to: 于是，那些在屋里陪着马利亚、安慰她的犹太人[a]，看见马利亚急忙起身出去，就跟着她，以为她是到坟墓去，在那里哭。
  rationale: 将“所以”调整为更自然的叙事承接词“于是”；以“急忙起身出去”流畅地表达马利亚迅速离开的动作；并改为“到坟墓去，在那里哭”，明确保留原文ἐκεῖ“在那里”，同时避免“坟墓那里去哭”的轻微重复。其余用语及脚注均可保留。
