source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: zh_hans
  text: 于是，那些在屋里陪着马利亚、安慰她的犹太人[a]，看见马利亚急忙起身出去，就跟着她，以为她是到坟墓去，在那里哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。《约翰福音》中的“犹太人”有时可较狭义地指犹太地人或犹太人的领袖；这里所指的是陪伴马利亚、与她一同哀伤的那群人。
    reason: 保留Ἰουδαῖοι可能具有的地域性含义，并避免把本节理解为泛指所有犹太人。
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: 所以……犹太人
  rationale: οὖν在这里承接叙事，译作“所以”自然清楚。Ἰουδαῖοι在本节指在屋里陪伴马利亚、为她哀伤的人，正文直译为“犹太人”，同时用脚注保留“犹太地人”这一可能的地域性理解。
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: 那些在屋里陪着马利亚、安慰她的
  rationale: 将两个修饰成分合并为自然的现代汉语定语；παραμυθέομαι表示给予安慰，在丧葬语境中译作“安慰”准确且通顺。
- source_word: ἰδόντες
  choice: 看见
  rationale: 希腊语不定过去时分词表达先于主句动作发生的情形；汉语借上下文和“就”自然呈现事件次序。
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: 很快站起来走了出去
  rationale: ἀνέστη在这里指从原来的姿势起身，并非复活；“站起来”能避免误解。ἐξῆλθεν直译为“走了出去”。
- source_word: ἠκολούθησαν αὐτῇ
  choice: 就跟着她
  rationale: 这里描述实际行动上的跟随，不带必须理解为门徒身份的含义；“就”衔接他们所见与随后的反应。
- source_word: δόξαντες
  choice: 以为
  rationale: δόξαντες表示基于所见作出的推测或判断；“以为”简洁而自然，并保留其判断未必正确的意味。
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: 她要到坟墓那里去
  rationale: ὑπάγει表示前往；μνημεῖον在拉撒路安葬的语境中指墓穴，译作“坟墓”符合现代汉语习惯。
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: 去哭
  rationale: ἵνα加虚拟语气表达目的；汉语用“去哭”自然呈现此目的。“那里”的地点意义已由前面的“坟墓那里”明确表达。
theological_decisions:
- issue: 《约翰福音》中Ἰουδαῖοι的指称范围
  choice: 正文译作“犹太人”，指当时在屋里陪伴并安慰马利亚的那群人。
  alternative: 犹太地人
  rationale: Ἰουδαῖοι在《约翰福音》中可按语境指犹太人、犹太地人，或某些犹太领袖。本节的直接指称对象是与马利亚一同哀伤的人，并非泛指全体犹太人，也没有充分理由把它限定为领袖群体；正文保留直接译法，脚注则保存地域性译法的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“陪着……安慰她”贴合丧亲场景；句式依照希腊文的信息次序展开，同时以“就”和“以为”使汉语衔接自然。
