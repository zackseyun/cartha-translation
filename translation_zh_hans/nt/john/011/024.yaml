  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: zh_hans
  text: 马大对他说：“我知道，在末日复活的时候，他必复活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中的“说”不标明时态，既自然又保留对话引语的功能。
- source_word: αὐτῷ
  choice: 对他
  rationale: 与“说”搭配，清楚表达说话的对象，符合现代汉语习惯。
- source_word: ἡ Μάρθα
  choice: 马大
  rationale: 采用中文圣经传统中通行且易于辨认的人名译法。
- source_word: Οἶδα
  choice: 我知道
  rationale: 直接表达马大确定的认知，语气自然，也不额外强化为“我确信”。
- source_word: ἀναστήσεται
  choice: 他必复活
  rationale: 该动词在此复活语境中指从死亡中起来；“复活”是简洁、明确且通行的中文表达。“必”表达未来陈述的确定语气，但不将动词改释为显式被动。
- source_word: ἐν τῇ ἀναστάσει
  choice: 复活的时候
  rationale: 这里指末世复活这一事件发生之时；与后面的“在末日”合并为自然的汉语时间结构，避免生硬直译为“在复活中”。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: “末日”简明地对应“最后一日”，并保留约翰福音中末世性时间指向。
theological_decisions:
- issue: 末日复活的指向
  choice: 译作“在末日复活的时候”，明确指向将来末日的复活事件。
  alternative: 将其泛化为死后仍有生命的盼望。
  rationale: ἀναστήσεται、ἀνάστασις与“末日”共同表明马大所说的是将来的末世复活，而不只是笼统的死后生命；译文不进一步加入经文本身未说明的教义细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。语序调整为“在末日复活的时候”，使两个ἐν短语之间的修饰关系在中文中自然清楚，同时保留“复活”一词的重复，以呈现原文的强调。
