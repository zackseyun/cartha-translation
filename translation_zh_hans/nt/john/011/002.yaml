  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: zh_hans
  text: 这位马利亚，就是那位用香膏[a]抹主，又用自己的头发擦他的脚的人；她的兄弟拉撒路患病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香油”；希腊语所指的是带香气的油或膏。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ ἡ ἀλείψασα
  choice: 这位马利亚，就是那位……抹……的人
  rationale: 用现代汉语的判断、同位结构表达原文对马利亚的辨认说明；不把 δέ 生硬译成时间性的“当时”或“现在”。
- source_word: τὸν κύριον
  choice: 主
  rationale: 保留 κύριος 在约翰叙事中对耶稣的尊称及其神学分量。
- source_word: μύρῳ
  choice: 用香膏
  rationale: μύρον 指带香气的油或膏；“香膏”在此处自然，并适合“抹”的动作。
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: 又……擦他的脚
  rationale: 准确表达 ἐκμάσσω 的擦拭含义，同时依照现代汉语习惯安排宾语。
- source_word: ταῖς θριξὶν αὐτῆς
  choice: 用自己的头发
  rationale: 工具格译为“用”；“自己的”清楚指回马利亚。
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: 患病的拉撒路是她的兄弟
  rationale: 把较难自然保留的希腊语属格关系从句转换为独立分句，仍明确马利亚与拉撒路的姐弟或兄妹关系；“兄弟”不擅自判定其年龄长幼。
- source_word: ἠσθένει
  choice: 患病
  rationale: 此处 ἀσθενέω 指身体生病；“患病”庄重、清楚，也与上节语境衔接。
theological_decisions:
- issue: κύριος 用于耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: “主”既符合本段对耶稣的尊称，也保留原词可能具有的神学分量，避免缩减为单纯社会身份。
- issue: 马利亚与拉撒路的亲属关系
  choice: 兄弟
  alternative: 哥哥／弟弟
  rationale: ἀδελφός 本身不说明拉撒路比马利亚年长还是年幼，因此不补入原文没有提供的信息。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这位……就是那位……”承担原文的辨认说明功能；分号使后半句的亲属关系和患病信息清楚可读。所有代词均保持原文指向，不提前补出“耶稣”。
