  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: zh_hans
  text: 于是，门徒对他说：“主啊，他若睡着了[a]，就会康复[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经睡着了。”耶稣先前以睡眠比喻拉撒路的死，门徒却以为他说的是普通睡眠。
    reason: lexical_alternative
  - marker: b
    text: 原文动词也可译作“得救”；这里指从疾病中恢复，即“康复”或“好起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接耶稣前一句话，并引出门徒由此作出的回应；“于是”在现代汉语叙事中自然，也保留了上下文的推论关系。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词所指的人物在上下文中明确；汉语无需另加“他的”，即可自然表达。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 保留原文代词所指，不将其明说为“耶稣”；“对他说”符合汉语引出直接引语的习惯。
- source_word: Κύριε
  choice: 主啊
  rationale: “主”保留 κύριος 的基本称谓及《约翰福音》中可能具有的基督论意味；语气词“啊”使直接称呼自然庄重。
- source_word: εἰ
  choice: 若
  rationale: 表达原文真实条件关系；“若”简洁庄重，又不显古奥。
- source_word: κεκοίμηται
  choice: 睡着了
  rationale: 该完成时形式可指进入睡眠后处于睡着的状态，也可婉指死亡。此处门徒按普通睡眠来理解耶稣的话，因此正文采用自然的睡眠用语，同时以脚注说明双重含义。
- source_word: σωθήσεται
  choice: 就会康复
  rationale: σῴζω 可表示“拯救”，但在疾病语境中也可指恢复健康。门徒以为拉撒路只是在睡觉，所以“康复”准确传达此处语境意义；“就”也自然呈现条件句的结果。
theological_decisions:
- issue: 对耶稣的直接称呼 Κύριε 如何译出
  choice: 主啊
  alternative: 先生；老师
  rationale: “主”既符合词义，也保留这一称呼在《约翰福音》中尊称与更深基督论含义并存的可能，不把它弱化为单纯礼貌称呼。
- issue: 是否在正文中直接表明 κεκοίμηται 婉指死亡
  choice: 正文译作普通睡眠用语“睡着了”
  alternative: 安睡了；已经死了
  rationale: 叙事张力来自耶稣以睡眠比喻死亡，而门徒误以为他说的是普通睡眠。正文采用“睡着了”可保留门徒的误解，并让后文自行澄清。
- issue: σωθήσεται 是否译为具有救恩色彩的“得救”
  choice: 就会康复
  alternative: 就会得救；就会好起来
  rationale: 原词本身有“被拯救”的宽广义域，但在本节疾病与睡眠的语境中，门徒所表达的是身体恢复。译作“康复”避免无根据地引入救恩含义，同时用脚注保留原词可能的直译。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“于是”清楚衔接上文；“若……就……”略带书面色彩但普通读者容易理解。“睡着了”保持门徒按字面理解的语气，“康复”准确表达疾病语境。脚注标记分别紧随所解释的词语，避免标记与注释错位。
