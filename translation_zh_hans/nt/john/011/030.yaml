  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: zh_hans
  text: 耶稣还没有进村子，仍在马大与他相会[a]的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“马大出去迎接他的地方。”
    reason: ὑπαντάω可指“相会”或“前去迎接”；上下文显示马大曾出去见耶稣。
lexical_decisions:
- source_word: οὔπω
  choice: 还没有
  rationale: 准确表达某事截至当时尚未发生，也符合现代汉语叙事习惯。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事衔接；汉语无需添加“这时”或“却”，句内对比已足以体现行文关系。
- source_word: ἐληλύθει
  choice: 进
  rationale: 在“进村子”这一搭配中自然表达来到并进入村庄；结合否定和上下文，保留相对于叙事时点尚未发生的意义。
- source_word: κώμην
  choice: 村子
  rationale: κώμη通常指规模较小的聚居地，“村子”通俗、准确。
- source_word: ἀλλ’
  choice: 仍
  rationale: 原文以ἀλλά对比尚未进村与继续留在原处；汉语用逗号加“仍”可自然体现这一转折与持续关系。
- source_word: ἔτι
  choice: 仍
  rationale: 表达耶稣继续停留在同一地点。
- source_word: τόπῳ
  choice: 地方
  rationale: 对应一般性的地点用语，简明自然。
- source_word: ὅπου
  choice: ……的地方
  rationale: 以汉语关系结构自然表达地点从句。
- source_word: ὑπήντησεν
  choice: 迎接
  rationale: ὑπαντάω可指前去与来者相会；上下文中马大出村去见耶稣，因此“迎接”比单纯“遇见”更贴合语境，同时不必增添原句未明说的动作细节。
- source_word: αὐτῷ
  choice: 他
  rationale: 在“迎接他”中自然呈现与动词连用的与格对象。
- source_word: Μάρθα
  choice: 马大
  rationale: 采用现代中文圣经传统中通行的人名译法。
