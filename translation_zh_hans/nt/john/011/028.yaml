source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: zh_hans
  text: 她说了这话，就走开，私下叫她的姊妹[a]马利亚，对她说：“老师在这里，正在叫你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语只说“她的姐妹”，没有说明马利亚是姐姐还是妹妹。
    reason: source_ambiguity
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: 她说了这话
  rationale: 将不定过去时分词按先于主句动作的时间关系自然表达，既保留所指，也避免生硬直译。
- source_word: ἀπῆλθεν
  choice: 就离开那里
  rationale: 表达从当时所在之处离开；“那里”依据叙事情境补明出发点，使现代汉语顺畅而不增加新的事件。
- source_word: ἐφώνησεν Μαριὰμ
  choice: 叫马利亚来
  rationale: φωνέω在这里是叫人前来；加“来”能自然传达召唤之意，而不是仅仅呼喊名字。
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: 她妹妹
  rationale: 该同位语说明马利亚是她的姐妹；结合约11:1、3、5所呈现的叙述关系，采用自然的亲属称谓。
- source_word: λάθρᾳ
  choice: 私下
  rationale: 表示避开公众听闻而传话；“私下”保留低调、非公开的含义，又不额外暗示欺骗或危险。
- source_word: εἰποῦσα
  choice: 对她说
  rationale: 以自然汉语引出直接引语，同时清楚标明受话者。
- source_word: Ὁ διδάσκαλος
  choice: 老师
  rationale: διδάσκαλος的基本含义是教导者；“老师”作为称呼自然、尊重，也不加入“主人”等并非词义所必需的权威色彩。
- source_word: πάρεστιν
  choice: 来了
  rationale: πάρεστιν本义为“在场、在这里”；在传话场景中，“来了”是自然汉语，表达他已经到场，而不改变其状态意义。
- source_word: φωνεῖ σε
  choice: 正在叫你
  rationale: 保留现在时所呈现的当下、持续意味；这里指耶稣叫马利亚过去，而非仅喊她的名字。
theological_decisions:
- issue: 耶稣称号διδάσκαλος的译法
  choice: 老师
  alternative: 夫子；主人
  rationale: 按普通词义翻译为“老师”，保留叙事中的尊称而不扩大为更强的主权称号；“夫子”虽传统但较古雅，“主人”则偏离教导者这一核心语义。
- issue: λάθρᾳ所暗示的传话方式
  choice: 私下
  alternative: 暗暗地；秘密地
  rationale: 原文说明谈话不让旁人听见，却没有明确交代隐瞒的动机。“私下”保留这种开放性，不推定欺骗、惧怕或其他神学动机。
- issue: φωναῖ σε的时态与召唤含义
  choice: 正在叫你
  alternative: 叫你；请你过去
  rationale: “正在叫你”既反映希腊语现在时，也保留φωνέω可指呼叫或召唤的语义范围；不将其明确改写成较礼貌但解释性更强的“请你过去”。
translation_notes:
  register: 采用现代、简洁而庄重的叙事汉语。句子按汉语信息顺序重组，以“私下”紧邻召唤动作。“老师”保持普通读者易懂；不使用较古雅的“夫子”。原文没有必须以脚注保留的重大文本或语义分歧，因此正文不设脚注标记。
