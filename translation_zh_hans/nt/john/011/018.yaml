  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: zh_hans
  text: 伯大尼离耶路撒冷不远，相距约十五斯塔迪昂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约合两英里，即大约三公里。
    reason: 文化说明：将古代距离单位换算为现代读者熟悉的单位。
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接词，并不表示强烈转折；现代汉语承接上下文时无需加“但”或“如今”，以免增添原文没有的强调或时间意味。
- source_word: Βηθανία
  choice: 伯大尼
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: 离耶路撒冷不远
  rationale: ἐγγύς表示空间上的接近；此译法自然、清楚，并与后面的具体距离衔接顺畅。Ἱεροσόλυμα采用通行译名“耶路撒冷”。
- source_word: ὡς
  choice: 约
  rationale: ὡς用于度量表达时表示近似，译作“约”保留距离并非精确数值的含义。
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: 约有十五斯塔迪昂
  rationale: ἀπό在这里表达相隔的距离；στάδιον是古代长度单位，正文保留并音译为“斯塔迪昂”，现代距离换算置于脚注，以保留原文的历史文化形式。
