  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: zh_hans
  text: 耶稣说了这些话，随后对他们说：“我们的朋友拉撒路睡着了[a]，但我要去叫醒他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按语境明确译为“已经死了”。耶稣在这里以“睡着”喻指死亡；门徒在接下来的经文中起初按字面理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: 说了这些话以后
  rationale: 保留ταῦτα的复数回指和μετὰ τοῦτο的时间次序，同时以自然的现代汉语合并表达。
- source_word: λέγει αὐτοῖς
  choice: 他又对他们说
  rationale: 历史现在时按汉语叙事习惯译为“说”；“又”自然承接前一次讲话及随后发生的言说。
- source_word: Λάζαρος
  choice: 拉撒路
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: ὁ φίλος ἡμῶν
  choice: 我们的朋友
  rationale: 自然准确地表达带冠词的名词及第一人称复数所属关系。
- source_word: κεκοίμηται
  choice: 睡着了
  rationale: 保留原文以睡眠喻指死亡的表达及完成状态，不提前消解随后门徒误解所形成的叙事张力。
- source_word: ἀλλὰ πορεύομαι
  choice: 但我要去
  rationale: “但”保留转折；“我要去”在现代汉语中自然表达当前意向和即将进行的行动。
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: 叫醒他
  rationale: 以目的性的汉语动词结构表达ἵνα加虚拟式，并延续“睡着”这一隐喻。
theological_decisions:
- issue: κεκοίμηται应直译为睡眠，还是解释为死亡
  choice: 正文保留“睡着了”的隐喻
  alternative: 已经死了
  rationale: 耶稣在此有意以睡眠指死亡，后文门徒因按字面理解而误会；保留隐喻可维持原文的歧义、叙事推进和神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“说了这些话以后”忠实保留复数回指；“睡着了／叫醒”保持原文成对的隐喻。未加脚注，因为正文无需异文说明；“已经死了”属于语境释义而非文本异读。
