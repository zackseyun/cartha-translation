base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: zh_hans
  text: 于是，那些犹太人说[a]：“看哪，他多么爱他！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些犹太地区的人。”这里可能较具体地指当时在场的犹太人。
    reason: 保留οἱ Ἰουδαῖοι可能具有地域性指向的替代理解，并澄清本节所指为现场人群。
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示当时正在发生或多人相继作出的言说；现代汉语在此用“说”最自然，叙事语境已能体现过程性。
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节耶稣流泪这一情景，既可表达叙事推进，也保留由所见而生的反应。
- source_word: οἱ Ἰουδαῖοι
  choice: 那些犹太人
  rationale: 保留Ἰουδαῖοι的基本族群称谓，并以“那些”限定为现场所指的一群人，避免误解为对全体犹太人的概括。
- source_word: Ἴδε
  choice: 看哪
  rationale: 表达引人注意的命令语气，庄重而仍为现代读者易懂。
- source_word: πῶς
  choice: 多么
  rationale: 在感叹句中自然表达程度，同时不对耶稣感情的具体方式作额外解释。
- source_word: ἐφίλει
  choice: 爱
  rationale: 此处指耶稣对拉撒路的个人 affection；“爱”直接自然，不必刻意与ἀγαπάω建立僵硬的词义区分。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词，语境中指拉撒路。
theological_decisions:
- issue: 《约翰福音》中οἱ Ἰουδαῖοι的译法
  choice: 那些犹太人
  alternative: 那些犹太地人
  rationale: 原词可按族群译为“犹太人”，在某些语境也可能带有地域或群体性的“犹太地人”含义。本节指现场看见耶稣流泪的人，不应理解为对所有犹太人的笼统陈述；正文保留基本称谓，脚注保存地域性译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留引人注意的语气；“多么爱他”以汉语感叹句自然传达πῶς ἐφίλει的程度意味。
