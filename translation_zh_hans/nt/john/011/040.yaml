  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: zh_hans
  text: 耶稣对她说：“我不是对你说过吗？你若信，就会看见上帝的荣耀。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: 耶稣对她说
  rationale: 希腊文以历史现在时叙事；现代汉语自然地用“说”，不必另行标示时态。“对她”保留与格间接宾语，并按上下文指向马大。
- source_word: Οὐκ εἶπόν σοι
  choice: 我不是对你说过吗
  rationale: 保留预期肯定回答的反问语气；“说过”自然表达先前已经说出的意思，又不把动词强化为更具体的“告诉”。
- source_word: ἐὰν πιστεύσῃς
  choice: 你若信
  rationale: “信”简洁保留约翰著作中 πιστεύω 的核心用语；“若”准确表达条件关系，且符合庄重而自然的经文语体。
- source_word: ὄψῃ
  choice: 就会看见
  rationale: 自然表达将来结果；“看见”保留实际看见与领会神圣显现之间可能存在的语义张力。
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: 上帝的荣耀
  rationale: “荣耀”是 δόξα 在约翰语境中的常规对应，保留神圣显现的神学内涵；属格自然译作“上帝的”。
theological_decisions:
- issue: 信与看见上帝荣耀之间的关系
  choice: 直译为对马大所说的条件性应许：“你若信，就会看见……”
  alternative: 将其明确解释为适用于所有神迹的一般原则，或限定解释为只关乎拉撒路复活
  rationale: 原文直接陈述条件与结果，却没有在本节界定这一应许的普遍范围；译文不替经文解决该神学张力。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“我不是对你说过吗？”保持反问力度；“你若信”比“如果你相信”更凝练，仍为普通现代读者所熟悉。
