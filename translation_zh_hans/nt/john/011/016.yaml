  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: zh_hans
  text: 于是，多马，就是那称为“低土马”[a]的，对同作门徒的人说：“我们也去吧，好和他一同死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低土马”是希腊语名称，意思是“双胞胎”。
    reason: 说明希腊语Δίδυμος的词义。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文耶稣决定前往犹太的对话，既可表达叙事推进，也保留一定的逻辑承接。
- source_word: Θωμᾶς
  choice: 多马
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: ὁ λεγόμενος Δίδυμος
  choice: 那称为“低土马”的
  rationale: Δίδυμος既是希腊语称号，也意为“双胞胎”。正文音译以保留原文称名形式，脚注说明其含义。
- source_word: τοῖς συμμαθηταῖς
  choice: 对一同作门徒的人
  rationale: 准确体现συμμαθητής“同作门徒者”的构词意义，同时避免将所属关系解释得过强。
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: 我们也去
  rationale: 以第一人称复数劝勉语气表达“一起去吧”，并保留καί对“我们”的包含与强调。
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: 好和他一同死
  rationale: “好”自然表达ἵνα所引出的目的或预期结果；“和他一同死”保留陪同及共同命运的直白措辞。
theological_decisions:
- issue: 多马这句话的语气与动机
  choice: 不添加语气标签，按原文直译为劝同行并一同赴死
  alternative: 将其明确处理为英勇忠诚、悲观认命或讽刺
  rationale: 希腊文本没有明说多马的心理状态；直白表达可保留忠诚、悲观和决绝等可能性之间的张力。
- issue: μετ’ αὐτοῦ中“他”的指代
  choice: 保留代词“他”
  alternative: 明说“耶稣”
  rationale: 上下文足以指向耶稣，保留代词更贴近原文，也不作不必要的显化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一同作门徒的人”略带正式感，但清楚传达原文罕见合成词συμμαθηταί；引语简洁有力，不预设多马的情绪。
