  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: zh_hans
  text: 马大听说耶稣要来[a]，就去迎接他；马利亚却坐在屋里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣正来。”希腊文在转述的话中使用现在时，也可较形式对应地译为生动的现在表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 就
  rationale: 在叙事中承接上文，并自然引出马大的反应；中文以“就”表达前后顺承，不必生硬译作“所以”。
- source_word: ὡς
  choice: 听说……，就
  rationale: ὡς在此引导时间从句。中文用“听说……，就……”自然表达“当……时”的时间关系，又不强化为“一……立刻就……”。
- source_word: ἤκουσεν
  choice: 听说
  rationale: ἀκούω本义为“听见、听说”；此处信息内容由ὅτι从句说明，译作“听说”最符合现代汉语。
- source_word: ἔρχεται
  choice: 来了
  rationale: 希腊文在间接引语中使用现在时，描写耶稣正在来到。叙事中文译作“来了”自然；脚注保留更贴近希腊文时态的“正来”。
- source_word: ὑπήντησεν
  choice: 去迎接
  rationale: 保留ὑπαντάω所含朝对方而去、与之相会的方向意味，比单译“见他”或“遇见他”更准确。
- source_word: δὲ
  choice: 却
  rationale: 突出马大的行动与马利亚留在屋里的状态之间的轻微对比。
- source_word: ἐν τῷ οἴκῳ
  choice: 在屋里
  rationale: 直接表达具体的室内地点，现代汉语自然，也不把它泛化为“在家”。
- source_word: ἐκαθέζετο
  choice: 仍坐着
  rationale: 未完成时描写过去持续的状态；“坐着”体现延续性，“仍”以简洁中文传达她没有随马大出去的语境对比。
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: 马大／马利亚／耶稣
  rationale: 采用现代简体中文圣经人名的通行译法。
