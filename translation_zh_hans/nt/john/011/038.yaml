  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: zh_hans
  text: 于是，耶稣心里又强烈地激动起来[a]，来到坟墓前。那坟墓是个洞穴，有一块石头挡在洞口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心中又愤慨起来”，或“心中又深感不安”。希腊文这个动词语气很强，所表达的可能不只是悲伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事发展；“于是”在现代汉语中自然，也保留了连接和推演意味。
- source_word: πάλιν
  choice: 又
  rationale: 表明耶稣的强烈情绪反应再次出现，与前文呼应。
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: 心里又强烈激动
  rationale: ἐμβριμάομαι语气很强，可包含愤慨、震动或深受扰动等色彩；正文保留情绪强度而不限定其具体性质，较强的可能译法置于脚注。
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文使用历史现在时；汉语叙事中用“来到”自然地表达事件进展。
- source_word: μνημεῖον
  choice: 坟墓
  rationale: 指安放死者的墓穴；下文明确说明它是洞穴。“坟墓”通俗、庄重且符合语境。
- source_word: σπήλαιον
  choice: 洞穴
  rationale: 直接表达洞穴式墓葬的形态，比“山洞”更不额外限定地貌。
- source_word: λίθος
  choice: 石头
  rationale: 常用而准确的对应词；在此指封挡墓穴入口的石块。
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: 有一块石头挡在洞口
  rationale: 原文描述石头置于墓穴之上或之前。鉴于墓穴是洞穴，汉语用“挡在洞口”清楚表达封住入口的实际位置，同时不暗示石头平放在墓顶。
theological_decisions:
- issue: ἐμβριμώμενος用于耶稣时的情绪色彩
  choice: 正文译作“心里又强烈激动”，不把情绪限定为悲伤或愤慨
  alternative: “心里又愤慨起来”或“心里又深受扰动”
  rationale: 该动词表达强烈的内在反应，但在此处究竟侧重愤慨、震动还是混合情绪存在争议。正文保留强度和歧义，脚注列出主要可能性，避免消解经文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里”自然表达ἐν ἑαυτῷ；“强烈激动”保留原词力度但不武断指定情绪。“坟墓是个洞穴”及“挡在洞口”使墓穴结构对普通读者清楚可见。
