  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: zh_hans
  text: 所以，耶稣看见她在哭，又看见同她一起来的犹太人[a]也在哭，就在灵里深受激动[b]，自己也烦乱起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可按地域背景理解为“犹太地区的人”。这里具体指同马利亚前来的犹太吊唁者，并非泛指全体犹太人。
    reason: lexical_alternative
  - marker: b
    text: “深受激动”所译的动词也可译为“愤慨”或“强烈震动”，表达内在的强烈扰动。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接前文并推进叙事，保留由上文情境引出的连接作用；现代汉语中自然清楚。
- source_word: ὡς εἶδεν
  choice: 看见……就
  rationale: ὡς与不定过去时在此表示时间关系；用“看见……就”自然呈现先后次序。
- source_word: κλαίουσαν / κλαίοντας
  choice: 在哭
  rationale: κλαίω指带有外在表现的哭泣；“在哭”自然易懂，又不武断地限定为礼仪性的哀号。
- source_word: συνελθόντας αὐτῇ
  choice: 同她一起来的
  rationale: 体现这些人与马利亚一同前来，也符合本段叙事情境。
- source_word: Ἰουδαίους
  choice: 犹太人
  rationale: 采用直接而通行的称谓；脚注说明此处具体指陪同马利亚的犹太吊唁者，并非泛指所有犹太人。
- source_word: ἐνεβριμήσατο
  choice: 深受激动
  rationale: 该动词表达强烈的内在震动，也可能带有愤慨或严厉的意味；正文不把情绪单一定为悲伤或愤怒。
- source_word: τῷ πνεύματι
  choice: 在灵里
  rationale: 保留希腊文所表达的情绪发生之内在领域，不将πνεῦμα具体化为较具解释性的“心灵深处”。
- source_word: ἐτάραξεν ἑαυτόν
  choice: 使自己心中烦乱
  rationale: 保留ἐτάραξεν的扰动含义及ἑαυτόν明确的反身表达，同时使中文基本通顺。
theological_decisions:
- issue: ἐνεβριμήσατο所描述的耶稣之情绪
  choice: 译作“深受激动”，保留强烈情绪而不指明究竟是悲痛、愤慨还是怒气。
  alternative: “愤慨”“心中震动”“发怒”
  rationale: 该词确有强烈、甚至带愤慨的语义色彩，但经文本身没有明说这种情绪的对象；正文避免消解这一诠释张力，较强的可能含义留在脚注中。
- issue: ἐτάραξεν ἑαυτόν的反身表达
  choice: 译作“使自己心中烦乱”。
  alternative: “心里烦乱起来”“感到烦扰”
  rationale: 希腊文明说“使自己”受到扰动；保留反身形式可避免将耶稣仅仅描写为被动地陷入某种情绪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在灵里”略具经文语体色彩，用以贴近原文τῷ πνεύματι；“使自己心中烦乱”有意保留原文少见而明确的反身结构。
