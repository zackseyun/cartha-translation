  text: Jesus wept[a].
translation:
  language: zh_hans
  text: 耶稣流泪了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣哭了。”希腊语动词特指流下眼泪，有别于本段其他地方所描写的哭泣或哀哭。
    reason: 词义备选
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: 流泪了
  rationale: 该词是 δακρύω 的简单过去时主动直陈语气第三人称单数，指流下眼泪。“流泪了”自然简洁，准确表达这一动作，也不把它强化为放声哀哭；“了”呈现叙事中已经发生的事件，但不额外赋予“开始流泪”的起始含义。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 带冠词的专名在句中作主语。现代汉语在人名前不对应翻译希腊语冠词，因此译作“耶稣”。
theological_decisions:
- issue: 耶稣情感的描写
  choice: 耶稣流泪了
  alternative: 耶稣哭了
  rationale: 原文直接而克制地描写耶稣真实的情感流露。译文既不淡化他的流泪，也不把这一动作扩展成原文未明确表达的号哭或哀号，从而保留经文本身的简洁与张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“流泪了”符合原文极短叙事句的力度，并保留原句的主语后置所造成的聚焦效果所能在汉语中自然承载的核心信息；未刻意仿造希腊语词序。
