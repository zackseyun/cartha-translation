  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: zh_hans
  text: 耶稣说：“把石头挪开。”死者[a]的姐妹马大对他说：“主啊，他现在已经发臭了[b]，因为他死了已有四天[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那已经死去的人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语动词意为“散发气味”；这里指发出难闻的气味。
    reason: lexical_alternative
  - marker: c
    text: 直译“因为他是第四天的”，意思是他已经死了四天。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: 挪开
  rationale: 这是αἴρω的简单过去时命令语气复数；此处是吩咐在场的人移走墓口的石头。“挪开”符合现代汉语表达，也清楚传达移除之意。
- source_word: τὸν λίθον
  choice: 石头
  rationale: 在墓穴语境中指挡住墓口的石头；“石头”自然、准确。
- source_word: τοῦ τετελευτηκότος
  choice: 死者
  rationale: τελευτάω的完成时主动分词指已经死去、现处于死亡状态的人。“死者”简洁自然，并保留完成时所含的结果状态。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε在这里是马大对耶稣的直接称呼。“主啊”既符合《约翰福音》的语境，也保留该称呼可能具有的敬意和信仰分量，而不把它弱化为单纯的礼貌称谓。
- source_word: ἤδη ὄζει
  choice: 现在已经发臭了
  rationale: ἤδη表示到此时该情形已经出现；ὄζει意为散发气味，在死亡语境中明确指难闻的气味。“现在已经发臭了”在现代汉语中直接而自然。
- source_word: τεταρταῖος γάρ ἐστιν
  choice: 因为他死了已有四天
  rationale: τεταρταῖος字面表示“第四天的”，此处意指死者已经死了四天。汉语需要适度展开，才能自然清楚地表达其含义；γάρ译为“因为”，保留解释理由的关系。
theological_decisions:
- issue: 马大称呼耶稣时κύριος的译法
  choice: 主啊
  alternative: 先生
  rationale: 该词在称呼中可以表示礼貌尊称，但《约翰福音》中马大对耶稣的认识使“主”更能保留原文可能具有的较深分量；同时，本节本身并未要求把这一称呼解释成完整的神学宣认。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对墓口石头用“挪开”，对尸体气味用直接但不过分口语化的“发臭”；保留“主啊”作为有分量但仍具语境弹性的称呼。
