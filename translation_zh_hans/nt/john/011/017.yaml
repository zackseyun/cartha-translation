  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: zh_hans
  text: 于是，耶稣来到，发现拉撒路已经在墓中四天了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: 到了以后
  rationale: 不定过去时分词在这里表示先于主句的动作；“到了以后”自然地体现耶稣抵达后得知情况的叙事次序。
- source_word: οὖν
  choice: 所以
  rationale: 这里主要承接上文并推进叙事；“所以”既保留上下文联系，也符合现代汉语表达。
- source_word: εὗρεν
  choice: 得知
  rationale: εὑρίσκω在此不是说耶稣找到拉撒路本人，而是发现或了解到他已在墓中四天；“得知”在汉语中能清楚表达这一语境含义。
- source_word: αὐτὸν
  choice: 拉撒路
  rationale: 希腊文代词所指由上文明确。汉语若直译为“他”容易暂时误指耶稣，因此明说“拉撒路”以保证清晰，并未增加新信息。
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: 已经四天了
  rationale: 这一习语结构表示某种状态已持续四天；配合“在墓里”，译为“已经四天了”自然、准确，并保留ἤδη“已经”的含义。
- source_word: μνημείῳ
  choice: 墓里
  rationale: μνημεῖον在本段指安放死者的坟墓；“墓”准确而简洁，“在墓里”也保留原文的方位表达。
theological_decisions:
- issue: αὐτόν的指代是否明说
  choice: 明说“拉撒路”
  alternative: 保留代词，译作“得知他在墓里已经四天了”
  rationale: 原文代词的指代在上下文中明确；汉语明说姓名可避免“他”被理解为耶稣，不涉及教义性解释。
- issue: εὗρεν的语义表达
  choice: 译作“得知”
  alternative: 译作“发现”或按字面译作“找到”
  rationale: 本句重点是耶稣抵达时了解到拉撒路已安葬四天，而不是找到其身体；“得知”避免产生错误的空间或动作联想，同时不改变叙事内容。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“所以”承接前文；“到了以后，得知……”符合普通读者的现代汉语习惯。原文无需要在正文标示的文本异读或实质歧义，故不设脚注。
