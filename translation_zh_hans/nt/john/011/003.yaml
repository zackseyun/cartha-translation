  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: zh_hans
  text: 于是，姐妹俩派人去告诉耶稣说：“主啊，你看，你所爱的人病了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: 派人去告诉耶稣
  rationale: 这里表达姐妹二人差人向耶稣传话；中文用“派人去告诉”自然清楚，并补出上下文中所指的“耶稣”，避免代词指向含混。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留尊称及直接呼语的语气。
- source_word: ἴδε
  choice: （不单独译出）
  rationale: 此处是引起对方注意的语用标记；若直译为“看哪”或“你看”，现代汉语容易显得生硬。通过“主啊”及整句告知语气传达其功能。
- source_word: ὃν φιλεῖς
  choice: 你所爱的人
  rationale: 忠实保留关系从句及 φιλέω 的爱意，不擅自补出拉撒路的名字。
- source_word: ἀσθενεῖ
  choice: 病了
  rationale: 按语境表达当前患病状态，简洁自然。
theological_decisions:
- issue: φιλέω 所表达的爱
  choice: 爱
  alternative: 疼爱／所亲爱的人
  rationale: “爱”保留原文宽度，不把这里与其他表示爱的希腊词之间的潜在差异解释得过细，也不额外强化亲疏程度。
- issue: ἴδε 的显性呈现
  choice: 不单独译出，以自然呼语承载其提醒功能
  alternative: 你看／看哪
  rationale: 该词在此主要用来引起注意，并非要求耶稣实际观看病人；省去生硬直译不改变信息内容。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“姐妹俩”准确体现复数及已知的两位姐妹；引语简洁，符合托人传话的口吻。
