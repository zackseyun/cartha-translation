source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: zh_hans
  text: 我为你们的缘故而高兴：我当时不在那里，好叫你们相信[a]。不过，我们到他那里去吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始相信”。希腊文的动词采用不定过去时虚拟语气，可能侧重开始相信；但正文保留含义较宽、解释较少的“相信”。
    reason: 词义备选
lexical_decisions:
- source_word: χαίρω
  choice: 感到高兴
  rationale: 直译其现在时的积极情感，同时使用自然的现代汉语；比“欢喜”更口语通达，也不额外解释耶稣高兴的具体对象。
- source_word: δι’ ὑμᾶς
  choice: 为你们的缘故
  rationale: διά加宾格在此表示与门徒利益相关的缘由；这一表达兼顾“因为你们”和“为了你们”的含义。
- source_word: ἵνα πιστεύσητε
  choice: 好使你们相信[a]
  rationale: ἵνα加不定过去时虚拟语气表达目的。“相信”保留约翰文献中πιστεύω的常用表达，不在正文中断定门徒此前完全不信。
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: 因为我当时不在那里
  rationale: ὅτι在此引出耶稣感到高兴的内容或缘由；“当时”自然体现未完成过去时及上下文所指的拉撒路死前那段时间。
- source_word: ἀλλὰ
  choice: 不过
  rationale: 表示从解释转向行动的对照和转折；“不过”在此比强烈的“但是”更自然。
- source_word: ἄγωμεν
  choice: 我们……去吧
  rationale: 第一人称复数现在时虚拟语气作劝勉用，译为“我们……去吧”准确而自然。
- source_word: πρὸς αὐτόν
  choice: 到他那里
  rationale: πρός加宾格表示朝向某人移动；“到他那里”符合现代汉语表达，并保留“他”所指对象由上下文确定。
theological_decisions:
- issue: 约翰语境中πιστεύσητε的语力
  choice: 相信
  alternative: 开始相信
  rationale: 不定过去时虚拟语气可能带有起始意味，但经文本身并不要求据此断定门徒先前全无信心。“相信”保留了其信心得以产生或加深的开放性。
- issue: 耶稣因自己不在场而高兴的表述
  choice: 我为你们的缘故感到高兴，因为我当时不在那里
  alternative: 为了你们，我很高兴自己当时不在那里
  rationale: 译文明确这种高兴与门徒的益处及信心有关，而不暗示耶稣以拉撒路之死本身为乐；同时没有加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为你们的缘故”略具书面色彩，适合经文语体；“我们到他那里去吧”则保持耶稣劝勉门徒行动时的自然口吻。
