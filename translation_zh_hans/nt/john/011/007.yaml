  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: zh_hans
  text: 这事以后，他对门徒说：“我们再往犹太地去吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: 这事以后
  rationale: 两个时间表达共同标明叙事的先后次序。中文合译为“这事以后”自然清楚，也避免生硬重复为“然后，在这事以后”。
- source_word: λέγει
  choice: 说
  rationale: 这是约翰叙事中常见的历史现在时；现代汉语动词本身不按时态变形，“说”既符合中文叙事习惯，也无须人为改写出额外的时态色彩。
- source_word: τοῖς μαθηταῖς
  choice: 对门徒
  rationale: 忠实表达与格所标明的说话对象；原文没有明说“他的”，因此不增译。
- source_word: Ἄγωμεν
  choice: 我们……去吧
  rationale: 第一人称复数劝勉虚拟式，译为“我们……去吧”自然表达共同前往的提议或劝请。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 往犹太去
  rationale: εἰς 表示朝向或进入某地；“往犹太去”在现代汉语中自然，并保留明确的移动方向。
- source_word: πάλιν
  choice: 再
  rationale: 表明重返先前去过的地区；“再”简洁准确，并紧接移动表达以避免误解为“又说”。
theological_decisions:
- issue: 约翰叙事中的历史现在时
  choice: 采用汉语无形态时态的“说”
  alternative: 增添过去时间色彩，译作“说了”或以其他措辞明确处理为过去叙事
  rationale: 汉语的“说”可自然用于过去叙事，无须强加英语式现在时或过去时的对立；这样既保留原文的叙事活力，也不制造并不存在的神学含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“往犹太去”比“进入犹太”更符合中文地域移动的常用表达；原英文脚注所说的“into/to”差异在中文中不构成需要另注的实质歧义。
