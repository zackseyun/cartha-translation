  source_fidelity: 时间推进、说话对象、劝勉式“我们……去吧”及“再”均准确传达原文。惟“犹太”在现代汉语中通常指犹太民族、文化或宗教，而此处Ἰουδαία指地理区域Judea，须译作“犹太地”（或“犹太地区”）以避免地域名称被误解。
  naturalness: “这事以后，他对门徒说”自然、庄重，适合现代标准汉语叙事；“我们再往……去吧”也通顺。将目的地改为“犹太地”后更合乎中文圣经地名惯例且语义明确。
