id: JHN.11.4
reference: John 11:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: zh_hans
  text: 耶稣听见后，就说：“这病不至于死[a]，而是为了上帝的荣耀，使上帝的儿子借着这病得荣耀。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不会以死亡告终”。希腊语这一表达可以表示，死亡并不是这病最终的结局或目的。
    reason: 说明πρὸς θάνατον的词义范围，并保留它与后续叙事之间的张力。
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: 耶稣听见后
  rationale: 以自然的汉语时间结构表达不定过去时分词所交代的背景；所听见的是上文关于拉撒路患病的消息，不必在正文中补明。δέ在此是轻微的叙事推进，汉语无需机械译出连接词。
- source_word: ἀσθένεια
  choice: 病
  rationale: 指拉撒路所患的疾病；“病”简洁自然，也避免过度临床化。
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: 不至于死
  rationale: 保留πρός所含的趋向、结局或目的意味，也保留与后文拉撒路实际死亡之间的张力；不把它扁平化为“他不会死”。
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: 为了上帝的荣耀
  rationale: ὑπέρ在此表达目的或所带来的益处；此译法准确而自然，并保留“荣耀”的神学分量。
- source_word: ἵνα δοξασθῇ
  choice: 使……得荣耀
  rationale: 用目的结构表达ἵνα，并以“得荣耀”保留希腊语的被动语态。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接而准确地翻译基督论称号，符合现代标准汉语。
- source_word: δι’ αὐτῆς
  choice: 借着这病
  rationale: διά加属格表示媒介或途径；明确补出所指的“这病”，比单用“借着它”更符合汉语表达且不增加原文信息。
theological_decisions:
- issue: “不至于死”与拉撒路随后实际死亡的关系
  choice: 将该短语译为“不至于死”，并用脚注说明它可指死亡不是这病最终的结局或目的。
  alternative: 译为“拉撒路不会死”或仅译为“这不是绝症”。
  rationale: 叙事后来明确说拉撒路死了，因此不可把本句处理成否认过程中会发生死亡的直白预言；同时正文应保留原句的张力，而不在译文中提前解释复活结局。
- issue: “上帝的荣耀”与“上帝的儿子得荣耀”的关系
  choice: 分别保留两个分句：这病为了上帝的荣耀，并使上帝的儿子借此得荣耀。
  alternative: 将两者合并为笼统的“彰显神圣荣耀”。
  rationale: 原文明确区分上帝的荣耀与上帝儿子的得荣耀，同时以目的关系将二者相连；分别译出可保存经文的基督论表达而不额外作教义阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不至于死”保留经文的凝练和含义张力；“借着这病得荣耀”既清楚交代代词所指，也保持原文的被动表达。
