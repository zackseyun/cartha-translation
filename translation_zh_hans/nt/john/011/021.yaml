  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: zh_hans
  text: 于是，马大对耶稣说：“主啊[a]，你若当时在这里，我的兄弟就不会死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希腊语κύριε既可用作尊敬的称呼，也可能含有“主”的神学分量。
    reason: 保留称呼在礼貌用语与神学称谓之间的语义幅度。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事；“于是”在现代汉语中自然，也保留了连接词的作用。
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: 对耶稣说
  rationale: 符合汉语表达习惯，准确表明耶稣是说话的对象。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留尊称和在《约翰福音》中可能具有的神学分量；呼格语气用“啊”自然表达。
- source_word: εἰ ἦς ὧδε
  choice: 你若早在这里
  rationale: 这是与过去事实相反的条件句；“早”并非另译词义，而是以自然汉语明确其过去未实现的意味。
- source_word: οὐκ ἂν ἀπέθανεν
  choice: 就不会死了
  rationale: 准确表达过去非现实条件所设想的结果；“就……了”与前面的条件分句自然呼应。
- source_word: ὁ ἀδελφός μου
  choice: 我兄弟
  rationale: 这里指马大的男性手足拉撒路；“我兄弟”自然且不额外断定其为兄或弟。
theological_decisions:
- issue: 马大称呼耶稣时 κύριος 的译法
  choice: 主
  alternative: 先生；夫子
  rationale: “主”既可表达尊敬，也保留《约翰福音》中潜在的基督论意味，而不强行判定马大此刻称呼的完整神学内涵。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“我兄弟”避免把ἀδελφός具体化为“哥哥”或“弟弟”；反事实条件句以“若早在……就不会……”自然呈现。
