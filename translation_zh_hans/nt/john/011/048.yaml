source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: zh_hans
  text: 如果任由他这样下去，人人都会信他；罗马人就会来，把我们的地方[a]和民族[b]都夺走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿”。希腊文直译为“地方”，可能特指圣殿，也可能较广地指他们的所在地、地位或立足之处。
    reason: alternative_reading
  - marker: b
    text: “民族”或译“人民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: 任由他这样下去
  rationale: ἀφῶμεν在此表示准许或放任，οὕτως指“这样”。合译为“任由他这样下去”，自然表达继续容许当前情形发展的意思。
- source_word: πάντες
  choice: 人人
  rationale: 表达泛指的“所有人、每个人”，简洁自然。
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: 都会信他
  rationale: 忠实反映约翰著作中常见的πιστεύω εἰς结构；“信他”在现代汉语中自然，也不额外限定这种相信的具体表现。
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: 罗马人就会来
  rationale: 直接表达将来时与明确主语；“就”呈现前后所设想的后果关系。
- source_word: ἀροῦσιν
  choice: 夺走
  rationale: αἴρω在此有拿走、除去之意；“夺走”符合罗马强权介入的语境，但不像“毁灭”那样加入原词未明说的结果。
- source_word: τόπον
  choice: 地方
  rationale: τόπος的基本义是“地方”。此处可能特指圣殿，也可能较宽泛地指他们的所在地、地位或立足之处；正文保留原文的开放性。
- source_word: ἔθνος
  choice: 民族
  rationale: ἔθνος可指民族或人民群体；“民族”适合这里对犹太民族共同体的忧虑，同时保留“人民”这一可能译法于脚注。
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: 把我们的地方和民族都夺走
  rationale: “我们的”按希腊语结构同时统领两个宾语，“都”体现两个并列对象一并被夺走。
theological_decisions:
- issue: τόπον（“地方”）具体指什么
  choice: 正文保留为“地方”
  alternative: “圣殿”或“地位／立足之处”
  rationale: 上下文可能主要涉及圣殿，也可能连同宗教领袖的制度地位或犹太人的立足之地；希腊词本身没有把所指限定为其中一种，因此正文不替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“任由……这样下去”符合议事语境；分号清楚呈现领袖们所设想的行为与后果。“地方”虽比“圣殿”宽泛，却有意保留原文歧义，并由脚注说明。
