source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: zh_hans
  text: 门徒对他说：“拉比，犹太人[a]刚才还想拿石头打你，你还要再到那里去吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译为“犹太地人”，或按语境理解为“犹太领袖”。约翰常用这个称呼指犹太地反对耶稣的人，并非泛指所有犹太人。
    reason: 保留 οἱ Ἰουδαῖοι 的词义范围及其在约翰福音中的语境性所指，避免将反对者误解为整个犹太民族。
lexical_decisions:
- source_word: λέγουσιν
  choice: 说
  rationale: 希腊文用历史现在时叙述过去事件；现代汉语叙事无需用形态标示时态，以“说”自然表达。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留希腊文音译的闪族称谓及约翰福音的表达特色，不将其直接意译为“老师”。
- source_word: νῦν
  choice: 刚才还
  rationale: 此处强调危险发生在不久之前；“刚才还”既表达时间临近，也自然衔接门徒的反问。
- source_word: ἐζήτουν
  choice: 想
  rationale: 未完成时表示过去持续的企图；结合不定式，“想用石头打你”是自然汉语，并保留企图而未得逞的语意。
- source_word: λιθάσαι
  choice: 用石头打
  rationale: 直接表达以石头攻击的动作；原文未明说“打死”，故不在正文补入结果。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 采用该词通常的直接对应；约翰福音中有时特指犹太地区反对耶稣的人或领袖，因此在脚注保留语境性理解。
- source_word: πάλιν
  choice: 再
  rationale: 自然、直接地表达“再次”。
- source_word: ὑπάγεις
  choice: 要……去吗
  rationale: 在指向先前地点的语境中表示前往；汉语以“还要再到那里去吗”自然传达反问语气。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 指回犹太地区这一危险之地。
theological_decisions:
- issue: 约翰福音中 οἱ Ἰουδαῖοι 的所指
  choice: 正文译作“犹太人”
  alternative: “犹太地区的人”或按语境理解为“犹太人的领袖”
  rationale: “犹太人”保留词语本身较宽的含义，不在正文中擅自缩小所指；脚注则说明约翰的用法常指犹太地区反对耶稣的人，并非泛指整个犹太民族。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。门徒的话保留急切的反问语气；“拉比”保留原有称谓，“用石头打”不补入原文未明说的“死”。
