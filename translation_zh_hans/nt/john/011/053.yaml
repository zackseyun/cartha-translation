base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: zh_hans
  text: 从那天起，他们就商定要杀他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: 从那天起
  rationale: 准确表达以“那一天”为起点并延续下去的时间关系；现代汉语自然简洁。
- source_word: οὖν
  choice: 就
  rationale: 承接前文公会的议论，表达由此产生的结果；“就”在此比单独使用“所以”更自然，并保留叙事上的因果推进。
- source_word: ἐβουλεύσαντο
  choice: 商议
  rationale: 该词表示共同谋划、议定行动；“商议”既保留复数主体共同筹谋的意味，也不把结果过度解释为正式司法裁决。
- source_word: ἵνα ἀποκτείνωσιν
  choice: 要杀掉
  rationale: 在“商议”之后，“要”自然表达其谋划的内容和目的；“杀掉”直接传达ἀποκτείνω的致死含义，不额外引入司法处决色彩。
- source_word: αὐτόν
  choice: 他
  rationale: 按原文保留代词；其所指由上下文清楚确定为耶稣，无须在正文中补出名字。
theological_decisions:
- issue: 宗教领袖对耶稣之意图的性质
  choice: 译为他们共同商议要杀掉他，明确呈现致死意图。
  alternative: 译为“他们考虑要杀他”或“他们讨论是否处死他”。
  rationale: 原文不是仅仅提出可能性，而是描述共同谋划以杀害耶稣；同时避免用“处死”等措辞擅自强化正式司法程序的意味。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“从那天起……就……”符合现代汉语习惯；“商议要杀掉他”保留共同筹谋和明确杀意，且不过度添加法律或教派性解释。
