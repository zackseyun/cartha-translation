id: JHN.11.51
reference: John 11:51
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: zh_hans
  text: 这话不是他凭着自己说的[a]；他既是那一年的大祭司，就预言耶稣将要为这个民族而死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭着自己”也可译作“出于自己的意思”。
    reason: lexical_alternative
  - marker: b
    text: “为这个民族而死”也可译作“代表这个民族而死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: 这话
  rationale: 用“这话”承接上文；δέ仅有轻微的转接作用，中文无需另加明显的时间词或强转折词。
- source_word: ἀφ’ ἑαυτοῦ
  choice: 凭自己
  rationale: 表达话语并非出于该亚法本人，同时保留“靠自己／出于自己”的语义范围。
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: 他既是那一年的大祭司，就
  rationale: “既……就……”自然表达分词结构的背景兼因由关系，而不超出原文断言。
- source_word: ἐπροφήτευσεν
  choice: 预言
  rationale: 直接保留原文明确的先知性用语，不将其弱化为讽刺或一般预测。
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: 将要……死
  rationale: 表达未来将发生之事，同时不把 μέλλω 过度限定为迫在眉睫或命定。
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: 为本民族而死
  rationale: “为”保留受益、代表等可能含义；“本民族”在此指该亚法和犹太领袖所属的民族，也与下一节“不但为本民族”自然衔接。
theological_decisions:
- issue: 该亚法的话为何称为预言
  choice: 按原文陈述，他因担任那一年的大祭司而说出了预言。
  alternative: 该亚法有意识地受默示说预言；或这仅是约翰的反讽，并非真实预言。
  rationale: 原文明确使用“预言”，但没有说明该亚法的主观意识、品格或完整的默示机制，因此译文既保留预言的真实性，也不补入额外理论。
- issue: ὑπὲρ 与耶稣之死的关系
  choice: 译作“为本民族而死”。
  alternative: 替本民族而死；代表本民族而死。
  rationale: “为”容纳受益性和代表性等神学内涵，不在本节单独把介词收窄为某一种技术性的赎罪表述。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“本民族”较单说“国民”或“国家”更准确地指向此处的犹太民族，并保留与约翰福音11:52的语篇联系。
