  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: zh_hans
  text: 她听见后，就赶快起身，往耶稣那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: 她
  rationale: 该指示代词承接上文的马利亚；现代汉语自然地用“她”，且上下文所指清楚。
- source_word: δὲ
  choice: 就（借句式体现叙事推进）
  rationale: δέ在这里是轻微的叙事连接，并非强烈转折；汉语无需逐词另译，用“一……就……”自然体现情节推进。
- source_word: ὡς ἤκουσεν
  choice: 一听见
  rationale: ὡς在此引出时间关系；“一听见”既自然，又结合ταχύ所表达的迅速反应，但没有把它夸大为绝对的“立刻”。“听见”的内容可由上文补足，无须增添宾语。
- source_word: ἠγέρθη
  choice: 起身
  rationale: 形式虽为被动形态，此处按不及物意义理解为“起来、起身”，并不暗示有外在施动者。
- source_word: ταχὺ
  choice: 赶快
  rationale: 表达动作迅速和反应及时，符合现代汉语叙事语感。
- source_word: ἤρχετο
  choice: 去
  rationale: 未完成时描写她正朝耶稣移动；正文用简洁自然的“去”，避免生硬地译成“正在前往”。
- source_word: πρὸς αὐτόν
  choice: 到耶稣那里
  rationale: πρός加宾格表示朝向某人移动。汉语补明“耶稣”可避免代词连续造成歧义，并自然表达目的方向。
