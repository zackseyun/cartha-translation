  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: zh_hans
  text: 于是，耶稣明明白白地对他们说：“拉撒路死了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: 于是……就
  rationale: τότε表示时间或叙事推进，οὖν带有承接或推论意味；合译为“于是……就”，既自然，也保留从前文转入明确说明的推进关系。
- source_word: εἶπεν αὐτοῖς
  choice: 告诉他们
  rationale: λέγω加间接宾语可译为“对他们说”或“告诉他们”；此处“告诉他们”符合现代汉语表达，并未增加原文信息。
- source_word: παρρησίᾳ
  choice: 明明地
  rationale: 这里与先前用“睡了”的间接说法形成对照，表示公开、直截了当而不含糊地说；“明明地”能自然表达这种明确性。
- source_word: Λάζαρος
  choice: 拉撒路
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 不定过去时陈述死亡事件；汉语“死了”自然表达已经发生且与当前情境相关的事实，无须机械体现希腊语时态形式。
theological_decisions:
- issue: 耶稣对拉撒路状况的陈述性质
  choice: 直接说明拉撒路已经肉身死亡
  alternative: 继续保留前文“睡了”的比喻性含混
  rationale: 本节以ἀπέθανεν明确解释前文关于“睡了”的说法，原文本身在这里消除了歧义，因此译文也应直接、清楚。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“明明地”略带经文语体色彩，但在此处清楚自然，并准确突出耶稣不再使用比喻、而是直说事实。
