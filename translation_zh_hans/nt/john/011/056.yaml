  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: zh_hans
  text: 于是，他们一直在找耶稣；他们站在圣殿区域[a]内，彼此议论说：“你们怎么看？他绝不会来过节吧？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿区域”：原文ἱερόν指整个圣殿建筑群及其院落、范围，并非专指内殿。
    reason: cultural_note
  - marker: b
    text: “绝不会”：原文使用强调否定（οὐ μή）；也可译作“他一定不会来过节吧？”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: 寻找
  rationale: 未完成时表示当时持续或反复进行的寻找；“寻找”在现代汉语中自然，也符合众人想找到耶稣的语境。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事；“于是”比“所以”更适合此处的叙事衔接。
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: 彼此议论说
  rationale: 未完成时可表示持续或反复的交谈；“彼此议论说”既保留相互谈论的含义，也自然引出直接引语。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿院区里
  rationale: ἱερόν指整个圣殿建筑群或范围，而非专指内殿；“圣殿院区”能较清楚地表达这一空间范围。
- source_word: ἑστηκότες
  choice: 站在
  rationale: 该完成时分词描写他们处于站立状态；与地点短语合译为“站在圣殿院区里”，简洁自然。
- source_word: Τί δοκεῖ ὑμῖν;
  choice: 你们怎么看？
  rationale: 这是询问意见的惯用表达；“你们怎么看？”符合现代汉语口吻，同时保持庄重自然。
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: 他一定不会来……吗？
  rationale: οὐ μή加虚拟语气表达强烈否定；“一定不会”保留强调语气，而句末“吗”使ὅτι所引内容自然地成为对前一问句的具体说明。
- source_word: εἰς τὴν ἑορτήν
  choice: 来过节
  rationale: 上下文所指是逾越节；“来过节”在汉语中比“来到节期”更自然，并避免在本节重复补出上下文已明确的节名。
theological_decisions:
- issue: οὐ μὴ ἔλθῃ在问句中的语气
  choice: 译作“他一定不会来过节吗？”
  alternative: “他绝不会来过节吧？”
  rationale: 原文的强烈否定可以理解为众人试探性地推测耶稣不会来，也可带有期待对方回应的意味。正文保留问号和“一定不会”，不把它改写成确定陈述；脚注提示更强的直译形式。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是”衔接上文；“站在圣殿院区里彼此议论说”保留两个未完成时所呈现的持续场景。问话不替读者确定众人的心理倾向，尽量保存原文强烈否定与疑问形式之间的张力。
