id: JHN.11.34
reference: John 11:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: zh_hans
  text: 耶稣说：“你们把他安放在哪里了？”他们对他说：“主[a]啊，来看看吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生”。希腊语 κύριε 既可表示“主”，也可用作礼貌的尊称。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 保留 λέγω 的基本含义；虽然下文是问句，但不解释性地改译为“问”。根据上下文将隐含主语明确为“耶稣”，使现代汉语叙事清楚自然。
- source_word: Ποῦ
  choice: 在哪里
  rationale: 直接表达地点疑问。
- source_word: τεθείκατε
  choice: 安放在哪里了
  rationale: τίθημι 的完成时指已经完成的放置行为；“安放”适合安置遗体的语境，“了”在现代汉语中自然体现动作已经完成。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数代词，指拉撒路。
- source_word: λέγουσιν
  choice: 他们对他说
  rationale: 将希腊文叙事中的历史现在时按现代汉语惯例译为过去叙事表达，并保留间接宾语“对他”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε 是对耶稣的直接称呼；“主”保留可能的基督论分量，“啊”自然标示呼语。其也可能只是尊称，故以脚注说明“先生”这一译法。
- source_word: ἔρχου καὶ ἴδε
  choice: 来看看吧
  rationale: 自然表达两个相连的命令“来”和“看”；叠词“看看”及语气词“吧”符合邀请对方前去查看的现代汉语语气，而未改变基本行动内容。
theological_decisions:
- issue: 对耶稣的称呼 κύριε 如何翻译
  choice: 主啊
  alternative: 先生
  rationale: “主”既可作为对耶稣的称呼，也保留约翰叙事中潜在的神学意蕴；但此处希腊词也可作礼貌尊称，因此不排除“先生”，并在脚注中保留这一真实语义空间。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“安放”贴合遗体被置于坟墓中的语境；“来看看吧”使原文两个命令在汉语中流畅自然。脚注标记紧接其所说明的“主”。
