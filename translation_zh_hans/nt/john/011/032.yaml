source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: zh_hans
  text: 于是，马利亚来到耶稣所在的地方，看见他，就俯伏在他脚前，对他说：“主[a]啊，你若早在这里，我兄弟就不会死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生。”希腊语 κύριε 既可作尊敬的称呼，也可译为“主”；这里依照本书对耶稣的整体描写译作“主”。
    reason: 保留κύριε在本处可能是礼貌尊称的语义歧义。
lexical_decisions:
- source_word: οὖν
  choice: 就（借“一……就……”体现叙事推进）
  rationale: 承接上文并推动叙事；汉语无需机械译作“所以”，以“一看见……就……”自然呈现事件推进。
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: 到了耶稣所在的地方
  rationale: ὡς在此引出时间情境；“到了……地方”准确而自然地表达马利亚来到耶稣所在之处。
- source_word: ἰδοῦσα αὐτόν
  choice: 一看见他
  rationale: 分词表示伴随并紧接着发生的动作；“一……就……”清楚呈现看见耶稣后立刻俯伏。
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: 俯伏在他脚前
  rationale: 该表达描写人在某人脚前倒下或俯伏；“俯伏在……脚前”符合庄重、自然的现代汉语，也保留姿态所含的敬意或悲痛。
- source_word: λέγουσα αὐτῷ
  choice: 对他说
  rationale: 以汉语并列谓语自然表达该分词所引出的直接话语。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριε可能具有的尊称与更深的基督论分量；呼格助词“啊”使直接称呼自然。
- source_word: εἰ ἦς ὧδε
  choice: 你若早在这里
  rationale: 这是与过去事实相反的条件；“若早在这里”用自然汉语明确表达未曾在场的过去反事实含义。
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: 就不会死了
  rationale: οὐκ ἄν与不定过去时表达过去非现实结果；此译准确传达“本来不会死亡”的意思。
- source_word: μου ὁ ἀδελφός
  choice: 我兄弟
  rationale: μου是所属属格；“我兄弟”是自然简洁的亲属称谓，并不额外判定其年龄长幼。
theological_decisions:
- issue: 马利亚称耶稣为κύριε
  choice: 主啊
  alternative: 先生啊
  rationale: κύριε既可作礼貌尊称，也可称“主”。约翰福音的叙事语境容许更丰富的分量，因此正文采用“主”，同时以脚注保留“先生”这一真实语义可能，避免把马利亚此刻话语的神学含义限定过死。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“我兄弟”避免把ἀδελφός具体化为哥哥或弟弟；“俯伏”比单纯“倒下”更贴合脚前姿态，但不强行判定这是敬拜行为。
