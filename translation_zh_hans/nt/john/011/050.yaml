  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: zh_hans
  text: 你们也没有考虑到：一个人为百姓[a]而死，而不是整个民族灭亡，这对你们是有利的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为百姓”也可译为“代表百姓”或“替百姓”；原文也可能含有“代替百姓”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: 你们也不想一想
  rationale: οὐδὲ承接上文的责备，λογίζεσθε表示思量、权衡；合译为自然的现代汉语，同时保留责备语气。
- source_word: συμφέρει ὑμῖν
  choice: 这对你们更有利
  rationale: συμφέρει表达实际利益或权宜上的好处，ὑμῖν是利益与格，突出该方案对议会成员有利。
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: 让一个人……死
  rationale: 以“让”引出ἵνα从句，在汉语中自然表达被认为有利的方案；“一个人”保留单数和阳性个体化表达。
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: 替百姓
  rationale: “替”在现代汉语中既可表达为百姓的利益而死，也可带有代替百姓承受死亡的意味，适合保留该处政治与预言层面的双重张力。
- source_word: καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται
  choice: 而不让整个民族灭亡
  rationale: καὶ μή在对比结构中表达避免另一结果；ἔθνος指作为政治—族群整体的民族，ἀπόληται在此表示遭毁灭、灭亡。
theological_decisions:
- issue: ὑπὲρ与耶稣之死的关系
  choice: 正文译为“替百姓”
  alternative: “为百姓”或“为了百姓的利益”
  rationale: 该亚法在直接语境中主张政治上的权宜之计，而叙述者在下一节指出此话具有他本人未意识到的预言意义。“替”能够容纳“为了、代表”与“代替”的语义可能，不把其中的神学张力单向定死；脚注进一步明示其范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“百姓”与“民族”分别对应λαός和ἔθνος，以保留原文在群体称谓上的区别；调整语序，把“这对你们更有利”置于句末，使长句在汉语中更清楚自然。
