  rationale: 修订以“为百姓而死”作为对ὑπέρ的较宽译法，并把替代性保留在脚注中，避免在正文中预断其神学或语义重心。删去“更”，使“有利”直接对应συμφέρει；改写句法以减少汉语中不必要的使令色彩，同时保留一个人死亡与整个民族不灭亡之间的原文对比。
