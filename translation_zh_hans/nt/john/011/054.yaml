source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: zh_hans
  text: 因此，耶稣不再公开地在犹太人中间[a]活动，而是离开那里，前往靠近旷野的地区，到一座名叫以法莲的城，并和门徒住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地区的人”。在约翰福音中，“犹太人”有时会随语境较具体地指犹太地区的人或犹太当局。
    reason: 保留Ἰουδαῖοι在本节中可能具有的地域性含义，也说明其在约翰福音中可能有较具体的语境所指，避免将范围解释得过窄或过宽。
lexical_decisions:
- source_word: οὖν
  choice: 因此
  rationale: 承接上文杀害耶稣的谋划，表达叙事上的结果和因果关系。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达先前行为就此停止的时间性否定。
- source_word: παρρησίᾳ
  choice: 公开地
  rationale: 本处指不避人耳目、公开露面，并非主要强调内在的胆量。
- source_word: περιεπάτει
  choice: 活动
  rationale: 该未完成时动词在此描述耶稣持续公开往来、行动；译作“活动”比字面的“行走”更符合现代汉语叙事，同时保留其行动范围的含义。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: 在犹太人中间
  rationale: 保留Ἰουδαῖοι通常而熟悉的译法，同时用脚注说明本处也可能带有地域性的“犹太地区的人”之意，避免将其一概理解为所有犹太人或仅指宗教领袖。
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: 离开那里
  rationale: 简洁表达从先前地点离去的叙事动作。
- source_word: χώραν
  choice: 地区
  rationale: 指一片地域或地带，并非现代意义上的国家。
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: 靠近旷野
  rationale: ἔρημος在此指人烟稀少的荒野地带；“旷野”符合圣经地理语境。
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: 到了一个名叫以法莲的城
  rationale: 自然表达前往目的地，并以“城”对应πόλις；“以法莲”采用通行圣经地名译法。
- source_word: κἀκεῖ ἔμεινεν
  choice: 并……留在那里
  rationale: 在旅行叙事中，μένω表示在该处停留；“留在那里”自然且贴近原文。
- source_word: μετὰ τῶν μαθητῶν
  choice: 和门徒
  rationale: 原文只有定冠词而无物主代词；上下文已明确是耶稣的门徒，因此不另添“他的”。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖοι的所指
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 该词在约翰福音中可依语境指犹太人、犹太地区的人或犹太权势群体。本节侧重耶稣不再公开置身于相关人群中，并非对所有犹太人作神学判断；正文采用通行译法，脚注保留地域性理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“公开地……活动”自然呈现耶稣停止公开往来的含义；句式保留原文从因果承接、离开、前往到停留的动作次序。
