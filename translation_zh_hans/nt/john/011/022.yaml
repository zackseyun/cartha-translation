  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: zh_hans
  text: 但就是现在[a]，我也知道，无论你向神求什么[b]，神都会赐给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而现在”。希腊语连词可单纯译作“而”，但结合上下文，也可表达马大在提到拉撒路之死后所作的转折。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“你求神”；按现代汉语习惯译作“你向神求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 但即使现在
  rationale: καί本可作“而、并且”，但在上下文中承接马大的前一句并形成转折；“但即使现在”既保留νῦν的时间意义，也表达她在拉撒路已经死去之后仍有的信心。
- source_word: οἶδα
  choice: 我也知道
  rationale: οἶδα虽为完成时形式，却具有现在时意义，直译为“我知道”最为准确；“也”使中文承接自然，但不削弱其确定语气。
- source_word: ὅσα ἂν
  choice: 无论……什么
  rationale: 关系代词与ἄν构成不定、概括性的表达；“无论……什么”自然地保留其开放范围。
- source_word: αἰτήσῃ τὸν θεόν
  choice: 你向神求
  rationale: 希腊文以“神”为αἰτέω的直接宾语；现代汉语在祈求语境中通常说“向神求”，既自然又不增添原文未说明的所求之物。
- source_word: δώσει σοι ὁ θεός
  choice: 神都会赐给你
  rationale: 保留将来意义和明确主语“神”；“赐给”符合向神祈求的语境，也准确表达δίδωμι的给予含义。
- source_word: θεός / ὁ θεός
  choice: 神……神
  rationale: 两处均译为“神”，不擅自扩展为“父”；第二处的冠词在希腊文中标明其为主语，中文无需另行体现。
theological_decisions:
- issue: 马大所说耶稣向神祈求、神赐给他的这句话，可能被过度解读为否认耶稣的神性。
  choice: 照原文保留马大的话：“无论你向神求什么，神都会赐给你。”
  alternative: 为避免表面上的从属意味而改写，或把“神”扩译为“父”
  rationale: 本节是在叙述马大的发言，应保留《约翰福音》叙事中的张力，不以系统神学措辞替她补充或修正。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但即使现在”表达上下文中的转折和让步意味；“向神求”符合现代汉语习惯；“赐给”适合祈求语境而不过度宗教化。
