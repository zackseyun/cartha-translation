  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: zh_hans
  text: 祭司长和法利赛人已经下令：若有人知道他在哪里，就要报告，好让他们捉拿他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捉拿”也可译作“逮捕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: 已经下令
  rationale: 该词为δίδωμι的过去完成时，表示下令这一行动在叙事所述时点之前已经完成；现代汉语用“已经”自然表达这种先时关系。
- source_word: δὲ
  choice: 不另译
  rationale: 此处主要承接并推进叙事，并非强烈转折；汉语不加显式连接词更自然，也不引入原文没有的具体时间意味。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数形式在第二圣殿时期及约翰福音的语境中指祭司阶层的领袖，而不是多位同时在任的大祭司。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般宗教历史语境中通行的群体名称。
- source_word: ἐντολὰς
  choice: 令
  rationale: 此处指宗教领袖发出的权威性命令；与“下”组合成自然的现代汉语“下令”。
- source_word: ἵνα ἐάν τις γνῷ
  choice: 若有人知道
  rationale: 保留命令内容中的一般条件关系；“若”简洁庄重，同时符合现代汉语。
- source_word: ποῦ ἐστιν
  choice: 他在哪里
  rationale: 原文用现在时“是/在”；汉语“在哪里”本身不需依照过去时主句进行时态倒移，因而自然保留原文的表达。
- source_word: μηνύσῃ
  choice: 就要报告
  rationale: μηνύω表示把消息告知或向有关权威报告；原文未明说受报者，中文也不补出，以避免过度解释。
- source_word: ὅπως
  choice: 好让
  rationale: 自然表达目的关系，说明报告其所在的目的。
- source_word: πιάσωσιν
  choice: 捉拿
  rationale: πιάζω在此表示抓住、拘拿；“捉拿”既符合敌对行动的语境，也不把原词过度限定为正式司法程序。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“已经下令”体现过去完成的叙事关系；不显译弱连接词δὲ，以免加入不必要的时间或转折色彩。代词“他”保留原文指代方式，不在本节中补写“耶稣”。
