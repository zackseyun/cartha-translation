  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: zh_hans
  text: 但他们中有一个人，就是那一年担任大祭司的该亚法，对他们说：“你们什么都不知道[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们什么都不懂。”原文用加强语气的否定表达，带有严厉责斥的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: 但他们中有一个人
  rationale: εἷς与τις合用，是从这一群人中引出一位人物；现代汉语自然表达为“他们中有一个人”。δέ在此表示轻微转折或承接，译为“但”。
- source_word: Καϊάφας
  choice: 该亚法
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 准确指称当时担任最高祭司职分的人，避免与复数意义上的祭司领袖混淆。
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: 那一年正担任大祭司
  rationale: 分词ὢν描述该亚法当时的身份；“那一年”自然对应τοῦ ἐνιαυτοῦ ἐκείνου，“正担任”则用现代汉语清楚表达其任职状态。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 按λέγω加间接受词的常规意义直译，简洁自然，不额外强化为命令或训斥。
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 保留明示的第二人称复数主语；其强调语气由整句措辞和感叹号共同体现。
- source_word: οὐκ οἴδατε οὐδέν
  choice: 什么都不懂
  rationale: 希腊语否定词与οὐδέν连用，构成强烈的全面否定。“什么都不懂”在现代汉语中自然表达责斥语气，并比“什么都不知道”更符合此处指责对方缺乏判断或见识的语境。
theological_decisions:
- issue: 约翰关于该亚法当年职分的时间说明
  choice: 那一年正担任大祭司
  alternative: 是那一年的大祭司
  rationale: 将其作为历史与叙事性的身份说明处理，不加入有关大祭司任期制度、神意或叙事反讽的解释，从而保留上下文自行展开其意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“名叫该亚法”帮助普通读者顺畅识别同位语；末句用“什么都不懂”及感叹号传达原文强烈的责斥语气，同时以脚注保留较形式对应的译法。
