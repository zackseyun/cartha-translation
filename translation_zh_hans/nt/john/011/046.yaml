  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: zh_hans
  text: 可是，他们中有些人去见法利赛人，把耶稣所做的事告诉了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他们报告了耶稣所做的事。”希腊文没有明确说明这些人去见法利赛人的动机。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: 可是，他们中有些人
  rationale: τινὲς ἐξ αὐτῶν指前述人群中的一部分；δὲ在上下文中与那些信耶稣之人的反应形成对照，因此译作“可是”。
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: 到法利赛人那里去
  rationale: 自然表达他们离开现场、前往法利赛人那里的动作，同时不以生硬的“离去”增加不必要的强调。
- source_word: εἶπαν αὐτοῖς
  choice: 告诉了他们
  rationale: 在叙事语境中表示把事情告知对方；用中性措辞，不暗示告密或敌对动机。
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: 耶稣所做的事
  rationale: 保留关系代词复数所指的行为，并以自然现代汉语表达已发生的行动。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 去见法利赛人的动机
  choice: 采用中性的“告诉了他们”
  alternative: “向他们告发耶稣”或“向他们报告耶稣的事”
  rationale: 希腊文只陈述他们前去并告知耶稣所做的事，没有明确说明其动机；译文不把可能的敌意写成经文明说的事实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可是”体现上下文中的对比；“到……那里去”符合现代叙事习惯；整体避免文言化，也不补入原文未明说的敌意。
