  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: zh_hans
  text: 但其中有些人说：“这使那盲人看见的人，难道不能使这个人不至于死吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: 但其中有些人
  rationale: τινές ἐξ αὐτῶν意为“他们中间有些人”；δέ承接上文并形成反差，译作“但”。
- source_word: εἶπαν
  choice: 说
  rationale: 不定过去时在叙事中自然译为简单过去动作；现代汉语无需另加时态标记。
- source_word: Οὐκ ἐδύνατο
  choice: 难道不能……吗
  rationale: 保留带否定词的反问语气，既表达过去处境中的能力，也传达说话者隐含的质疑。
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: 这个开了瞎子眼睛的人
  rationale: 第一个οὗτος指耶稣，带有较为直接的指称语气；分词短语自然处理为定语，并呼应约翰福音第9章的医治事件。
- source_word: ποιῆσαι ἵνα
  choice: 使
  rationale: 该结构在此表达造成某一结果；汉语用“使……不死”简洁自然，也贴近其使役意义。
- source_word: καὶ οὗτος
  choice: 这个人
  rationale: καί所表达的递进在汉语反问语境中已自然体现；第二个οὗτος指拉撒路，重复“这个人”可保留希腊文两个指示词所指对象的对照。
- source_word: μὴ ἀποθάνῃ
  choice: 不死
  rationale: 在ἵνα从句中表示所要促成的结果，即使拉撒路免于死亡；不额外限定为“救活”，以免越过经文本句。
theological_decisions:
- issue: 说话者反问的语气
  choice: 译作带质疑意味的反问：“难道不能……吗？”
  alternative: 较中性地译作“他不能……吗？”
  rationale: Οὐκ置于问句开头，通常预期肯定回答；本句既承认耶稣先前的神迹能力，又隐含对他未阻止拉撒路死亡的批评。译文保留这种张力，不进一步断定说话者的动机。
- issue: “使……不死”所指的行动
  choice: 保留宽泛的使役表达，不说明耶稣本应以何种方式阻止死亡
  alternative: 译作“救这个人不死”或“医好这个人，使他不死”
  rationale: 原文只说ποιῆσαι ἵνα……μὴ ἀποθάνῃ，并未明说医治方式；宽泛译法避免添加经文没有交代的细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“开了瞎子眼睛”保留约翰叙事中“开眼”的具体表达；“难道不能使这个人不死吗”自然呈现反问及其中的批评意味。无需脚注，因为“使……不死”已同时覆盖使役结构和“阻止他死亡”的自然含义。
