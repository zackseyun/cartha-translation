  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: zh_hans
  text: 有一个人患病，名叫拉撒路，来自伯大尼——马利亚和她的姊妹马大的村庄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说马大是马利亚的女性手足，没有说明她是姐姐还是妹妹。
    reason: preserve_kinship_ambiguity
lexical_decisions:
- source_word: Ἦν δέ
  choice: 有……病了
  rationale: Ἦν构成存在句，δέ是轻微的叙事衔接词。现代汉语在此无需另加“现在”或强转折词，按自然叙事语序表达其推进作用。
- source_word: τις
  choice: 有一个人
  rationale: τις指一个尚未具体介绍、但确有其人的对象；“有一个人”自然保留其不定而具体的性质。
- source_word: ἀσθενῶν
  choice: 病了
  rationale: 在本段语境中指患病，而非一般性的软弱；“病了”简洁自然，并与后文病情发展相接。
- source_word: Λάζαρος
  choice: 拉撒路
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: ἀπὸ Βηθανίας
  choice: 来自伯大尼
  rationale: ἀπό表示来源；“来自”直接传达拉撒路与伯大尼的地域关系。
- source_word: ἐκ τῆς κώμης
  choice: 所在的村庄
  rationale: κώμη指村庄或较小的聚落。“所在的村庄”既保留地点说明，也避免汉语中连续重复“来自”。
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: 马利亚和她的姐妹马大
  rationale: 属格短语把该村庄与马利亚、马大联系起来；同位语τῆς ἀδελφῆς αὐτῆς说明马大是马利亚的女性手足。“姐妹”不擅自判定长幼。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“也就是”自然引出对伯大尼的补充说明；不把δέ误译成带明确时间意义的“现在”。
