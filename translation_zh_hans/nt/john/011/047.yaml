  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: zh_hans
  text: 于是，祭司长和法利赛人召集了议会[a]，说：“我们在做什么？因为这个人行许多神迹。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“公会”，即当时犹太人的最高议事机构。
    reason: 说明 συνέδριον 在此可能特指耶路撒冷的犹太统治议会，同时保留正文较宽泛的表达。
lexical_decisions:
- source_word: συνήγαγον
  choice: 召集了
  rationale: 该词为简单过去时主动直陈式；“召集了”自然表达领袖们使议会聚集开会的动作，并以 συνέδριον 为宾语。
- source_word: οὖν
  choice: 于是
  rationale: 承接拉撒路复活后所引发的反应，兼具叙事推进和结果意味，又不把逻辑关系表达得过强。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指犹太祭司阶层中的领导人物，并非严格意义上的多位现任大祭司；“祭司长”是准确而通行的译法。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般宗教历史语境中通行的名称。
- source_word: συνέδριον
  choice: 议会
  rationale: 保留该词既可指议事会议、也可指犹太统治议会这一机构的空间；正文不直接采用专名式的“公议会”，具体所指在脚注说明。
- source_word: ἔλεγον
  choice: 彼此说
  rationale: 未完成时表示当时持续进行的商议；中文无需机械译成“正在说”，“彼此说”自然呈现会议中的讨论情境。
- source_word: Τί ποιοῦμεν
  choice: 我们在做什么？
  rationale: 按现时直陈式直译，保留既可理解为对自身无所作为的责问、也可在语境中表达“我们该怎么办”的商议意味。
- source_word: ὅτι
  choice: （后句直接说明理由）
  rationale: 希腊文 ὅτι 引出发问的原因。现代中文在紧接的两个问答式分句之间可不明说“因为”，仍能清楚表达因果关系，并避免直译造成生硬。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: 这个人
  rationale: 准确保留指称，并传达说话者刻意不称耶稣名字的疏离语气。
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: 正行许多神迹
  rationale: “正行”体现现在时的持续性；“神迹”是自然、通行的中文表达，在约翰福音中指彰显并指向耶稣身份的非凡作为。
theological_decisions:
- issue: 约翰福音中 σημεῖα 的译法
  choice: 神迹
  alternative: 记号；奇迹；神奇的记号
  rationale: “神迹”既符合现代中文宗教语境，也能表达这些作为超乎寻常并具有启示意义。“记号”虽更贴近该词“指向”的词义，却容易被普通读者误解为符号或标记；不在正文另加解释，以免替作者展开其神学含义。
- issue: συνέδριον 所指的机构
  choice: 议会
  alternative: 公议会；犹太公会；一次会议
  rationale: 上下文很可能指耶路撒冷的犹太统治议会，但该普通名词本身也可指议事会议。正文译作“议会”，脚注交代传统上的具体识别，以保留词义范围。
- issue: Τί ποιοῦμεν 的语气
  choice: 我们在做什么？
  alternative: 我们该怎么办？
  rationale: 希腊文采用现在时直陈式，字面是对目前作为的质问；在此语境中也含有商议下一步行动的意味。正文保留其形式和张力，不直接改成单纯求策的问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“召集了议会”清楚表达会议由祭司长和法利赛人发起；“彼此说”呈现商议场景。“我们在做什么”保留原文直陈式所带的责问和商议双重意味。脚注标记紧随“议会”，使注释对象明确。
