source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: zh_hans
  text: 她对他说：“是的，主啊，我已经信了，你就是弥赛亚，是上帝的儿子，就是那位要到世上来的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: 她对他说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事无需刻意标出时态。主语“她”由上下文中的马大补出。
- source_word: Ναί, κύριε
  choice: 是的，主啊
  rationale: Ναί是直接肯定的回答；κύριε在这一庄重认信的语境中译为“主啊”，兼顾称呼形式与敬虔分量。
- source_word: ἐγὼ πεπίστευκα
  choice: 我已经信了
  rationale: 完成时表达过去形成、如今仍然有效的确信；“已经信了”比单说“我信”更能体现这种结果性，同时符合自然汉语。
- source_word: ὅτι σὺ εἶ
  choice: 你就是
  rationale: ὅτι引出所信的内容；强调代词σὺ和系词合译为“你就是”，保留认信中的强调。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是身份称号，译作“弥赛亚”可清楚保留受膏者及犹太盼望的背景，而不把它处理成名字。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留这一确定而庄重的基督论称号。
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: 就是那位要到世上来的
  rationale: 带冠词的现在分词指向那位受期待而来的身份；“那位要……来的”在现代汉语中自然，并保留其预期和称号性质。
- source_word: κόσμον
  choice: 世上
  rationale: 在“来到κόσμος”这一表达中，“到世上来”比“进入世界”更符合现代汉语，也准确指向人类所处的世界。
theological_decisions:
- issue: Χριστός作为认信称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文是对耶稣身份的正式认信。“弥赛亚”显明其称号意义与犹太救赎盼望；“基督”虽为传统音译，但现代读者容易将其视作专名。
- issue: κύριε在马大称呼中的语气
  choice: 主啊
  alternative: 先生
  rationale: 紧接着的“弥赛亚、上帝的儿子”认信使这一称呼明显超出一般礼貌用语；“主啊”保留敬意与可能的神学分量，同时不额外解释其全部含义。
- issue: πεπίστευκα的完成时力度
  choice: 我已经信了
  alternative: 我信；我已经相信了
  rationale: 译文保留先前形成且持续至今的信念。此处不把完成时过度释义为某个明确的归信过程。
- issue: ὁ ἐρχόμενος的时间和称号性质
  choice: 就是那位要到世上来的
  alternative: 就是来到世上的那一位；就是那位正来到世上的
  rationale: 该分词既可描述“来”的行动，也可承载“那要来的”这一期待性称号。“要……来的”保留其前瞻和弥赛亚期待，不强行限定为正在发生或已经完成。
translation_notes:
  register: 采用现代、庄重而口语可懂的认信语体。“是的，主啊”保留对话感；后半句以“你就是……是……就是……”呈现原文连续同位称号的层次。无需脚注，因为主要词义与语法张力可在正文中自然保留。
