  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: zh_hans
  text: 耶稣所说的原是指拉撒路的死；他们却以为他所说的是实际的睡眠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“睡眠的睡眠”，指实际睡觉，而不是死亡。
    reason: 说明希腊文重复使用与睡眠有关的名词，并表明门徒按字面理解耶稣的话。
lexical_decisions:
- source_word: εἰρήκει
  choice: 说的原是
  rationale: 愈过去时表明耶稣的话先于门徒的误解；“说的原是”在现代汉语中自然地兼顾先时关系和解释语气。
- source_word: δὲ … δὲ
  choice: 原是……却
  rationale: 第一个 δέ 轻微承接并引出解释，第二个 δέ 表示鲜明转折；汉语以“原是……却”自然呈现两者的关系。
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: 指拉撒路的死
  rationale: περί 加属格意为“关于、指”；αὐτοῦ 在上下文中指拉撒路。明说姓名可避免汉语“他的死”被误解为耶稣自己的死。
- source_word: ἐκεῖνοι
  choice: 他们
  rationale: 指上文的门徒；现代汉语用“他们”最自然。
- source_word: ἔδοξαν
  choice: 以为
  rationale: 这里表示门徒的错误理解；“以为”比中性的“认为”更能自然传达误会。
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: 说的是睡觉休息
  rationale: 该短语指实际的睡眠，与以“睡了”婉指死亡形成对照。“睡觉休息”既通顺，也保留 κοιμήσεως 与 ὕπνου 的叠加意味；较直译形式列入脚注。
- source_word: λέγει
  choice: 说的是
  rationale: 形式上为现在时，在叙事中用于回指耶稣方才所说的话；嵌入“以为”之后译作“说的是”符合现代汉语习惯。
theological_decisions:
- issue: “睡”与死亡的关系是否暗示死后状态的特定教义
  choice: 明译耶稣所指的是拉撒路的死，同时把门徒的理解译为实际睡觉休息
  alternative: 用可能暗示“灵魂沉睡”等特定中间状态教义的措辞
  rationale: 本节的重点是耶稣以睡眠喻指死亡，而门徒误以为是实际睡眠；译文保留叙事中的双关和误解，不据此扩展死后状态的教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“原是……却”清楚呈现解释与误解之间的转折；用“拉撒路”明确代词所指，避免“他的死”在汉语中的歧义。
