  terminology: “犹太人”适合本节中中性、广义的Ἰουδαῖοι。“犹太地人”可在脚注中保留为可能译法，但原脚注的“或译：‘犹太地人中’”并非与加注词语直接对应的自然汉语表达，宜改为说明该词亦可译作“犹太地人”。马大、马利亚的通行译名可保留。
