  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: zh_hans
  text: 许多犹太人[a]已经来到马大和马利亚那里，要就她们兄弟的事安慰她们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译为“犹太地人”。希腊语这个词既可泛指犹太人，在《约翰福音》的某些语境中也可较具体地指犹太地人。
    reason: 保留Ἰουδαῖοι在约翰文献语境中的词义歧义。
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: 有许多
  rationale: πολλοί意为“许多”；δέ在此是轻微的承接词，汉语叙事无需机械译出，以免造成不必要的转折。
- source_word: ἐκ τῶν Ἰουδαίων
  choice: 犹太人中
  rationale: ἐκ加复数属格构成部分关系，即“犹太人中的许多人”。Ἰουδαῖοι在《约翰福音》中可依语境指犹太人或犹太地人；本节是对前来慰问者的中性描述，正文采用较广义、自然的“犹太人”，并以脚注保留另一可能。
- source_word: ἐληλύθεισαν
  choice: 已经来到
  rationale: ἔρχομαι的过去完成时表示相对于叙事时点已经发生的行动，故译为“已经来到”。
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: 来到马大和马利亚那里
  rationale: πρός加宾格在此表示到某人那里；人名采用现代中文圣经读者熟悉的译法。
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: 为……安慰她们
  rationale: ἵνα加虚拟语气表示目的；παραμυθέομαι在丧亲语境中指安慰、慰问。调整为自然汉语目的结构。
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: 为她们兄弟的死
  rationale: περί加属格表示“关于、因着”；原文只说“那兄弟”，但丧亲慰问的语境明确指其死亡。汉语若直译“为她们的兄弟安慰她们”较含混，故明确表达语境中隐含的“死”，同时不改变事件指向。
theological_decisions:
- issue: 约翰文献中Ἰουδαίων的译法
  choice: 犹太人
  alternative: 犹太地人
  rationale: 本节并非论战语境，而是描述前来慰问马大和马利亚的人。广义的族群—宗教称谓“犹太人”在正文中较合适；不过该词在《约翰福音》部分语境中可有地域意义，因此脚注保留“犹太地人”的可能，避免消除真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文按汉语习惯将部分关系表达为“有许多犹太人”，不生硬复制希腊语结构；用“安慰”准确呈现丧亲慰问语境。脚注标记紧随存在词义歧义的“犹太人”。
