source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: zh_hans
  text: 于是，他们把石头挪开了。耶稣抬眼向上望[a]，说：“父啊，我感谢你，因为你已经垂听我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“举目望天”或更简洁地译作“向上望”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你垂听了我。”希腊文此处用不定过去时；正文的“已经”表达该行动已经完成，并与当下有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: 挪开了
  rationale: αἴρω在此指把堵住墓口的石头移走；“挪开”符合具体语境，也避免“举起”可能造成的误解。
- source_word: οὖν
  choice: 于是
  rationale: 表示前文命令所带来的叙事结果；“于是”自然地承接上下文。
- source_word: λίθον
  choice: 石头
  rationale: λίθος在墓葬语境中指封墓的石头；“石头”是现代汉语中的通常表达。
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: 举目向上
  rationale: 保留原文“抬起眼睛、朝上”的具体意象，同时用简洁、庄重而自然的汉语表达。
- source_word: δὲ
  choice: 未单独明译
  rationale: δέ在此是轻微的叙事转换；汉语分句与主语转换已经清楚表达其功能，若硬译为“而”可能显得有不必要的对比。
- source_word: Πάτερ
  choice: 父啊
  rationale: 准确表达呼格祷告称呼；语气直接、庄重，不增添原文没有的称谓。
- source_word: εὐχαριστῶ σοι
  choice: 我感谢你
  rationale: 直接对应现在时感谢表达，符合现代汉语习惯。
- source_word: ὅτι ἤκουσάς μου
  choice: 因为你已经垂听了我
  rationale: “已经”体现不定过去时在此所表达的完成事件；“垂听”符合汉语祷告语境，并传达听取祈求的含义，但不扩展说明所求内容。
theological_decisions:
- issue: 耶稣在祷告中对上帝的称呼
  choice: 父啊
  alternative: 父亲啊
  rationale: “父啊”既保留原文简洁的呼格，也符合庄重的现代汉语祷告语体；不加入关于父子关系的额外解释。
- issue: ἤκουσάς μου在祷告语境中的含义
  choice: 你已经垂听了我
  alternative: 你听了我
  rationale: 所选译法表达父已经听取耶稣，保留该行动的完成性及当前关联，同时不进一步推演有关祷告回应或神学关系的结论。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“举目向上”保留原文身体动作的意象；“垂听”用于祷告语境，较“听了我”自然，但未添加祷告内容。所有脚注标记均置于其所说明的短语之后。
