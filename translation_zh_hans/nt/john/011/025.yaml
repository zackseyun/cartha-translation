  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: zh_hans
  text: 耶稣对她说：“我就是复活，就是生命。信我的人，即使死了，也必活过来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: 对她说
  rationale: 自然表达叙事中的说话引介，并保留阴性单数间接宾语；上下文所指是马大。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: “就是”在现代汉语中自然承载强调性的身份断言，也保留约翰叙事中这句话的启示性分量。
- source_word: ἡ ἀνάστασις
  choice: 复活
  rationale: 此处指从死人中复活；与“我就是”连用已形成确定而强调的身份认同，汉语无需另加冠词。
- source_word: ἡ ζωή
  choice: 生命
  rationale: 保留与“复活”平行的身份断言及约翰著作中的神学分量，不弱化为“赐生命的”。
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: 信我的人
  rationale: 现代汉语自然表达一般性的单数类指，兼顾持续相信和关系性信靠的含义；不需要以性别代词标示希腊文的代表性阳性。
- source_word: κἂν ἀποθάνῃ
  choice: 即使死了
  rationale: 准确传达让步条件；“死了”是现代汉语对不定过去时虚拟语气在此语境中的自然表达。
- source_word: ζήσεται
  choice: 也必活过来
  rationale: “必”表达将来应许的确定性；“活过来”在死亡语境中自然指向死亡之后得生命，同时避免把内涵收窄为仅仅延续现世生命。
theological_decisions:
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή 的身份断言
  choice: 我就是复活，就是生命
  alternative: 我赐下复活和生命
  rationale: 原文将“复活”和“生命”直接用作耶稣的表语，并非只说他赐予二者；译文保留这一基督论张力而不作解释性扩写。
- issue: ὁ πιστεύων 及后续单数动词的代表性阳性形式
  choice: 信我的人，即使死了，也必活过来
  alternative: 凡信我的，即使死了，也必活过来
  rationale: 汉语“人”可作无性别限定的单数类指，既保留个体性与普遍适用性，也无需生硬引入“他”或复数形式。
- issue: ζήσεται 所指生命的范围
  choice: 必活过来
  alternative: 必将活着
  rationale: 紧接“死了”的语境使“活过来”更清楚地表达死亡之后的生命，并与前句“复活”呼应；但不添加原文没有明说的时间、方式或末世次序。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我就是复活，就是生命”以汉语自然的重复系词保持两个并列身份断言的力度；全句适合普通读者朗读和理解。
