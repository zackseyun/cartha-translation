  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: zh_hans
  text: 说完这些话，他高声呼喊：“拉撒路，出来！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到外面来！”
    reason: 说明δεῦρο ἔξω也可较展开地表达其“到外面来”的方向含义。
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 原文是中性复数指示代词，回指耶稣刚才所说的内容；译作“这些话”既保留复数含义，也符合现代汉语表达。
- source_word: εἰπὼν
  choice: 说完
  rationale: 不定过去时分词表示该动作先于主句动作发生；“说完”自然清楚地呈现先后次序。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 该短语直指声音洪亮；“高声”简洁自然，并与“呼喊”搭配，保留原文对音量的强调。
- source_word: ἐκραύγασεν
  choice: 呼喊
  rationale: κραυγάζω表示高声喊叫；“呼喊”庄重而不古奥，与前面的“高声”共同传达原文力度。
- source_word: Λάζαρε
  choice: 拉撒路
  rationale: 采用现代中文圣经传统中通行的人名音译，并体现原文呼格中的直接称呼。
- source_word: δεῦρο ἔξω
  choice: 出来
  rationale: δεῦρο在此具有命令意味，ἔξω表示向外；合译为“出来”直接、有力，是自然的现代汉语召唤语。
theological_decisions:
- issue: 如何翻译耶稣施行神迹时的命令，同时避免增添古雅或教派性语气
  choice: 出来
  alternative: 到外面来
  rationale: “出来”准确传达δεῦρο ἔξω的方向和命令语气，简洁有力；不借助古奥措辞，也不对神迹的方式作原文以外的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“说完……他……”清楚呈现动作次序；“高声呼喊”保留原文中声音洪亮与喊叫动作的双重强调。引号内命令简短直接，符合叙事现场的力度。
