  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: zh_hans
  text: 但我知道，你总是垂听我；只是我说这话，是因周围站着的众人的缘故，为要使他们相信，是你差遣了我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是你差遣了我”：原文明确用了“你”这个代词，带有强调意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδειν
  choice: 我知道
  rationale: οἶδα的过去时用法；汉语“我知道”自然表达耶稣在说话时所陈明的既有认知，不必生硬译成“我早已知道”。
- source_word: πάντοτέ μου ἀκούεις
  choice: 你常常听我
  rationale: πάντοτε意为“总是、常常”；ἀκούω接属格μου，在祷告语境中指垂听。译文保持简洁，也不额外扩展为“应允”。
- source_word: ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα
  choice: 不过，我说这话是为了周围站着的众人
  rationale: ἀλλά标示转折；διά加宾格可表示缘故或为了某人的益处。结合后面的目的从句，“为了”自然呈现这里的指向，同时保留其与“因为”的语义邻近性。περιεστῶτα描写众人站在周围。
- source_word: εἶπον
  choice: 我说这话
  rationale: εἶπον本义为“我说了”；补出“这话”是汉语所需的最小语境补足，指耶稣刚才公开说出的祷告。
- source_word: ἵνα πιστεύσωσιν
  choice: 使他们相信
  rationale: ἵνα加虚拟式表达目的；“使他们相信”准确而自然地保留目的关系。
- source_word: ὅτι σύ με ἀπέστειλας
  choice: 是你差了我来
  rationale: 显明的主语代词σύ带有强调意味，故用“是你”体现；ἀποστέλλω译作“差……来”，保留约翰福音中受差遣的使命主题。
theological_decisions:
- issue: 父常常听耶稣的含义
  choice: 直译为父“常常听”耶稣，不进一步释为必然应允每项祈求
  alternative: 译成“你总是垂听我”或扩展为“你总会应允我”
  rationale: 原文陈述父听耶稣，语境显示亲密的父子相交，但译文不以“应允”替原文预先解释其神学范围。
- issue: 公开说出祷告的目的
  choice: 耶稣为周围众人的缘故公开说话，目的是使他们相信父差遣了他
  alternative: 把目的限定为只相信这一次神迹，或扩展为完整的后期教义表述
  rationale: ἵνα从句明确把目的落在“相信是你差了我来”；译文保留这一措辞，不缩窄也不扩张。
- issue: σύ的强调
  choice: 译为“是你差了我来”
  alternative: 译为较无标记的“你差了我来”
  rationale: 原文显式使用σύ，而动词本身已能标明人称，因此该代词具有强调作用；汉语焦点结构可自然体现这一点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“常常听我”比“恒常俯听于我”自然，也避免用“应允”过度解释ἀκούω；“差了我来”保留圣经语体中适度的庄重感。
