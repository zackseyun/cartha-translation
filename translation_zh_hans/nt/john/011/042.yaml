review_pass:
  verdict: revise
  source_fidelity: 译文总体准确地保留了父听耶稣、耶稣因在场群众而说话，以及使他们相信父差遣他的目的。但πάντοτε宜译为“总是”而非较弱的“常常”；διά＋宾格在此首要表达“因/为了在场的群众”的缘故，中文用“因……的缘故，为要……”能更清楚保留缘由与目的的层次。
  naturalness: “你常常听我”在祷告语境中稍显口语且“常常”弱化了“总是”。“你总是垂听我”庄重、自然，也不把“听”扩展为“应允”。“因周围站着的众人的缘故，为要……”符合现代汉语的庄重圣经语体。
  terminology: “差遣”比“差了我来”更稳定地对应ἀποστέλλω，也保留约翰福音中父差遣子的使命用语。“是你差遣了我”自然表达显式σύ所带出的焦点；不需添加原文未明说的地点意义。
  issues:
  - severity: medium
    issue: “常常”未充分表达πάντοτε的无例外、持续性语义。
    rationale: πάντοτε通常为“总是、始终”；中文“常常”可表示频繁但并非每次。
  - severity: low
    issue: “为了周围站着的众人，使他们相信”将缘由和后续目的关系略为压缩。
    rationale: διὰ τὸν ὄχλον表达为群众的缘故，ἵνα从句才明确说明目的；以“因……的缘故，为要……”可更清晰保留句法层次。
  - severity: low
    issue: “差了我来”带出“来”的方向性，且不如“差遣”稳定对应约翰福音的使命术语。
    rationale: ἀπέστειλας意为“差遣了我”，原文此处未明确表达“来”的方向或地点。
  revised_text: 但我知道，你总是垂听我；只是我说这话，是因周围站着的众人的缘故，为要使他们相信，是你差遣了我。[a]
  revised_footnotes:
