revisions:
- from: 但我知道，你常常听我；不过，我说这话是为了周围站着的众人，使他们相信，是你差了我来。[a]
  to: 但我知道，你总是垂听我；只是我说这话，是因周围站着的众人的缘故，为要使他们相信，是你差遣了我。[a]
  rationale: 修订以“总是”准确表达πάντοτε，以“垂听”在祷告语境中自然对应ἀκούω而不释作“应允”。“因……的缘故，为要……”分别呈现διά＋宾格的缘由和ἵνα从句的目的。“差遣了我”保留ἀποστέλλω的约翰福音使命术语，并避免“来”所可能额外带出的方向意义。保留脚注锚点，说明σύ的强调。
