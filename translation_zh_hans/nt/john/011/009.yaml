  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: zh_hans
  text: 耶稣回答说：“白昼不是有十二个小时吗？人若在白昼行走，就不至于绊倒，因为他看见这世上的光。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这世上的光”在直接语境中是白昼行走时可见的光；在约翰福音的语境里，这一措辞也可能使人联想到更广泛的神圣光照主题。正文保留原文措辞，不明确限定其所指。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: 耶稣回答说
  rationale: 采用自然、庄重的叙事表达；“回答说”准确呈现回应并引出直接引语。
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: 白昼不是有十二小时吗
  rationale: 保留期待肯定回答的反问语气。“白昼”在本节比笼统的“一天”更准确，并与下文“在白昼行走”形成呼应；“小时”避免使用现代汉语中通常指两小时的“时辰”。
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: 人若在白昼行走
  rationale: “人若”自然表达泛指单数的条件结构；“行走”既保留实际走路的图像，也不排除上下文可能具有的引申意味。
- source_word: οὐ προσκόπτει
  choice: 就不会跌倒
  rationale: “跌倒”保留因碰撞而失足的具体图像，也容许潜在的比喻意味；“就”清楚表达条件句的结果。
- source_word: ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: 因为他看得见这世上的光
  rationale: “看得见”自然说明人在光照下不会跌倒的原因；“这世上的光”贴近原文，并保留约翰文献中“光”可能具有的更深共鸣，而不在正文中将其明解为基督或神的引导。
theological_decisions:
- issue: “这世上的光”是否应明确解释为耶稣或神圣光照
  choice: 正文保留普通光照的图像及原文措辞，不明说其象征对象
  alternative: 译成或增补为“耶稣的光”或“神所赐的光”
  rationale: 本句直接层面是关于人在白昼行走的格言式陈述；与此同时，约翰福音中的“光”常有神学深意。保留原文开放性，可使直接意义与潜在象征意义并存。
- issue: 泛指单数 τις…βλέπει 的表达
  choice: 译作“人若……他”
  alternative: 译作“任何人若……他们”或完全省去后续主语
  rationale: 现代汉语中的“人若……他”能自然保留原文泛指单数的代表性表达，并不将所指限定为男性。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“白昼”比“白天”略正式，并与本节反复出现的 ἡμέρα 相称；“十二小时”按古代将白昼划分为十二段的说法表达，并非强调每一段恒为现代六十分钟。
