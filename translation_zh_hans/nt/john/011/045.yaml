  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: zh_hans
  text: 所以，那些到马利亚那里来的犹太人中，有许多人看见了耶稣所做的事，便信了耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在约翰福音的某些语境中，Ἰουδαῖοι也可能译作“犹太地区人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: 有许多人
  rationale: 自然表达不确定但数量可观的一群人，并与ἐκ τῶν Ἰουδαίων的部分结构顺畅结合。
- source_word: οὖν
  choice: 所以
  rationale: 承接拉撒路复活的前文，保留推论或结果关系；现代汉语中比“因此”更自然。
- source_word: ἐκ τῶν Ἰουδαίων
  choice: 犹太人中
  rationale: 保留希腊文“从……当中”的部分意义，同时采用简洁自然的现代汉语表达。
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: 那些到马利亚那里来的
  rationale: 将带冠词的分词结构译为限定性关系短语，明确所指的是此前来到马利亚那里的人。
- source_word: θεασάμενοι
  choice: 看见了
  rationale: 符合叙事情境，也保留亲眼目睹耶稣行动的含义；不额外强化为“仔细察看”。
- source_word: ἃ ἐποίησεν
  choice: 耶稣所做的事
  rationale: 希腊文主语隐含为耶稣；汉语明说姓名可避免代词连续造成歧义，并自然表达中性复数关系代词的集合意义。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 信了他
  rationale: 约翰著作中πιστεύω εἰς表示信心指向某人；“信了他”简明自然，并保留个人信靠的指向。
theological_decisions:
- issue: 约翰语境中πιστεύω εἰς αὐτόν的表达
  choice: 信了他
  alternative: 信靠了他
  rationale: “信了他”直接对应动词及其指向，符合现代汉语圣经语体；“信靠了他”会更明确加入倚靠的解释性意味。
- issue: Ἰουδαῖοι的群体称谓
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 本节最自然地指叙事中被称为犹太人的群体；同时以脚注说明部分约翰语境中可能强调犹太地区身份，避免把有争议的地域含义直接写入正文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“所以”清楚连接上文；调整汉语语序，使“犹太人中，有许多人”保留原文的部分结构。脚注标记置于完整句末。
