source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: zh_hans
  text: 并且不只是为这个民族[a]，也是为了把四散的上帝的儿女聚集归一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个民族”在上下文中指犹太民族。
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: 民族
  rationale: 在上下文中特指犹太民族；“民族”保留单数、整体性的含义，又不把所指直接写入正文。
- source_word: ἵνα
  choice: 也是要
  rationale: 自然表达目的意味，并承接“不但……也……”的对比结构。
- source_word: τέκνα τοῦ θεοῦ
  choice: 上帝儿女
  rationale: τέκνα包括男女；“儿女”准确而自然，不缩窄为男性的“儿子”。
- source_word: διεσκορπισμένα
  choice: 四散的
  rationale: 保留完成时被动分词所表达的分散状态；“四散”在中文中简洁且符合语境。
- source_word: συναγάγῃ
  choice: 聚集
  rationale: 表达ἵνα之后虚拟式动词的目的；中文无需另加情态词，也能自然呈现目的关系。
- source_word: εἰς ἕν
  choice: 为一
  rationale: 保留希腊文简洁而开放的表述，不擅自补入“身体”“群体”或“合一”等解释性名词。
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: 不但为这民族，也是
  rationale: 承接上一节关于耶稣替人死的思想，以“为”表达ὑπέρ；“不但……也……”保留原文的对比结构。
theological_decisions:
- issue: “上帝儿女”的身份
  choice: 保留为范围较广、四散而将因耶稣之死被聚集的上帝子民，不进一步限定其身份。
  alternative: 仅指散居各地的犹太人；或明确指犹太人和外邦人中的选民。
  rationale: 经文把“这民族”与范围更广的“四散的上帝儿女”相对照，但没有在本节明确界定后者的全部范围，因此译文保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这民族”照应上下文中特定的犹太民族；“聚集为一”保留原文的简洁和潜在多义性。
