  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: zh_hans
  text: 凡活着并信我的人，必永远不死。你信这话吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: 凡活着并信我的人
  rationale: 保留两个现在分词所表达的并列特征；“信我”自然传达 πιστεύων εἰς ἐμέ 的信靠指向。
- source_word: οὐ μὴ ἀποθάνῃ
  choice: 必……不死
  rationale: οὐ μή 加虚拟式构成强烈否定，以“必不”体现其确定性。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该习语自然且准确的现代汉语表达；与前面的强烈否定合起来译为“必永远不死”。
- source_word: πιστεύεις τοῦτο;
  choice: 你信这话吗？
  rationale: τοῦτο 指向耶稣刚才所作的宣告；“这话”在汉语中比单独的“这”更自然。
theological_decisions:
- issue: “永远不死”与肉身死亡之间的张力
  choice: 保留“必永远不死”的直陈表达
  alternative: 将其解释性译为“即使肉身死了，也必得永生”
  rationale: 原文在上下文中有意把死亡、生命与复活并置；译文不应自行消解这一神学张力。
- issue: ὁ ζῶν 的含义
  choice: 译为“活着”
  alternative: 译为“得生命”或“有永生”
  rationale: 原文使用一般性的“活着”，可能具有上下文中的深层含义，但不宜在正文中预先限定为某种解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的人”适合概括性宣告；句末问句简洁直接，保留耶稣对马大的个人追问。
