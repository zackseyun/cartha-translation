  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: zh_hans
  text: 从现在起，在事情发生以前，我先告诉你们，好让事情发生的时候，你们相信我就是那一位[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“我是。”这个希腊语表达也可能呼应《以赛亚书》以及《约翰福音》其他地方神圣的自我宣告。
    reason: 保留原文无明示谓语的表达及其可能具有的神学回响。
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: 从现在起
  rationale: 这是表示以当前时刻为起点的时间短语；“从现在起”自然地保留了向后的时间指向。
- source_word: λέγω ὑμῖν πρὸ τοῦ γενέσθαι
  choice: 事情还没有发生，我就先告诉你们
  rationale: 用现代汉语的“还没有……就先……”结构表达πρὸ τοῦ加不定式所表示的事前时间关系，同时保留事件本身未明说的特点。
- source_word: ἵνα
  choice: 好让
  rationale: 清楚表达目的关系，比单纯表示结果更贴近此处的用法。
- source_word: ὅταν γένηται
  choice: 事情发生的时候
  rationale: ὅταν加虚拟式指向将来发生之事；此译法在汉语中自然，又不额外限定事件内容。
- source_word: πιστεύσητε
  choice: 你们相信
  rationale: 保留πιστεύω的基本语义及本句的目的意味，不擅自解释为“开始相信”或“信靠”。
- source_word: ὅτι ἐγώ εἰμι
  choice: 你们相信我就是那一位
  rationale: “就是那一位”在现代汉语中可理解为自我身份确认，同时避免明确补入原文没有的具体谓语；脚注保留更贴近字面的“我是”及其可能的经文回响。
theological_decisions:
- issue: 约翰语境中绝对用法ἐγώ εἰμι可能带有神圣自我启示的回响
  choice: 我就是那一位
  alternative: 我是
  rationale: 希腊文没有明说谓语，既可在语境中理解为身份确认，也可能呼应《以赛亚书》及《约翰福音》其他地方的神圣自我宣告。正文采用自然而不过度具体化的汉语，脚注则保存字面形式与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“事情还没有发生，我就先……”符合自然汉语叙述；“那一位”不指明原文未提供的身份称号，并以脚注保留其开放性。
