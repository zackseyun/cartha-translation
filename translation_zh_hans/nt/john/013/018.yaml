  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: zh_hans
  text: “我这话不是指你们所有人。我知道我拣选了谁。但为要使经上的话应验：‘吃我饼的人，向我抬起他的脚跟。’[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自或化用《诗篇》41:9；按希伯来文及七十士译本的编号为41:10。
    reason: cross_reference
  - marker: b
    text: “向我抬起他的脚跟”是表示敌对和背叛的形象说法；也可译作“向我扬起脚跟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: 我不是指你们所有人说的
  rationale: 自然表达“不是关于你们所有人而言”的范围否定，同时保留 περὶ 的“关于、针对”之意。
- source_word: οἶδα
  choice: 我知道
  rationale: οἶδα 虽为完成时形式，在通用希腊语中通常具有现在时意义。
- source_word: τίνας ἐξελεξάμην
  choice: 我拣选了谁
  rationale: 保留 τίνας 所指的具体人以及 ἐκλέγομαι 的“选择、拣选”含义；中文用“了”自然表达先前选择在当前语境中的关联。
- source_word: ἀλλ’ ἵνα
  choice: 但这是要使
  rationale: 明确承接前句并引出目的或结果，但不额外断定背叛与神意之间更具体的因果模式。
- source_word: ἡ γραφὴ πληρωθῇ
  choice: 经上的话应验
  rationale: 符合现代中文圣经语域，也准确传达 γραφή 指圣经以及 πληρόω 的应验含义。
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: 吃我饼的人
  rationale: 按原文将 μου 与“饼”相连，简洁保留实体化分词“那吃……的人”。
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: 抬起脚跟攻击我
  rationale: 保留诗篇引文中的“脚跟”意象，并以“攻击”表达 ἐπ’ ἐμέ 的敌对方向，而不将比喻直接改写成“背叛”。
theological_decisions:
- issue: 耶稣的拣选与背叛者之间的关系
  choice: 直译为“我拣选了谁”，不在正文中限定这种拣选属于救恩拣选还是使徒职分的选召。
  alternative: 明确译作“我拣选谁得救”或“我选谁作使徒”。
  rationale: 本节没有界定“拣选”的神学类别；保留原文张力，避免把某一宗派解释写进译文。
- issue: ἀλλ’ ἵνα 与背叛及经文应验的关系
  choice: 译为“但这是要使经上的话应验”。
  alternative: 译为“但这事发生，是因为经上的话必须实现”。
  rationale: 保留约翰福音的经文应验表述，却不增添原文未明说的决定论式因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“抬起脚跟”的诗歌意象，以脚注说明其敌对和背叛含义；“拣选”沿用清楚而具经文语体的常用词，不作教义性扩写。
