base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: zh_hans
  text: 西门彼得问他：“主啊，你要到哪里去？”耶稣回答：“我所去的地方，你现在还不能跟随我[a]，但以后你会跟随。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不能”所译的希腊文动词明确含有能力或可能性的意思。
    reason: lexical_alternative
  - marker: b
    text: “以后你会跟随”可能暗指彼得后来在受苦或死亡上跟随耶稣；这句话本身没有说明具体方式。
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: 问
  rationale: 希腊文用历史现在时“说”；汉语叙事中结合随后问句自然译为“问”，不机械保留时态形式。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος作为对耶稣的尊称及其潜在的神学分量；“啊”符合现代汉语直接称呼习惯。
- source_word: ποῦ ὑπάγεις
  choice: 你要到哪里去
  rationale: ὑπάγω在此表示“去、离去”；该译法自然，并与耶稣回答中的同一动词形成呼应。
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 准确、自然地表达对话中的回应。
- source_word: Ὅπου ὑπάγω
  choice: 我要去的地方
  rationale: 保留与彼得问题的词语呼应，同时符合现代汉语表达。
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: 你现在还不能跟随我
  rationale: “不能”明确表达δύναμαι所指的能力或可能性；“还”与后文“以后”构成自然对照，但不额外说明不能跟随的原因。
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: 但以后你会跟随
  rationale: 保留将来时及δέ带出的转折；不补入原文未重复出现的“我”，使汉语简洁，同时语境中的跟随对象清楚。
theological_decisions:
- issue: 彼得日后“跟随”的具体含义
  choice: 正文只说“以后你会跟随”，不明确其实现方式。
  alternative: 明确译成彼得日后在受苦、殉道、复兴后的门徒生涯或进入荣耀中跟随耶稣。
  rationale: 希腊文没有说明彼得将以何种方式跟随；保持叙事和神学上的开放性，避免把某一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持彼得问题与耶稣回答中“去”的呼应，并以“现在还不能／但以后”清楚呈现时间上的对照。所有脚注标记均置于正文相应位置。
