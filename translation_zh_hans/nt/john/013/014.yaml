  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: zh_hans
  text: 既然我这位主和老师洗了你们的脚，你们也应当彼此洗脚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: 所以……若
  rationale: 以“若”保留条件句的形式，以“所以”表达οὖν承接上文、引出推论的作用；整体符合现代汉语论证语气。
- source_word: ἐγὼ
  choice: 我这位
  rationale: 希腊文显式使用第一人称代词，带有强调作用；“我这位”既突出耶稣本人，也自然引出后面的两个身份称谓。
- source_word: ἔνιψα
  choice: 洗了
  rationale: 表达刚刚完成的洗脚行动；汉语用“了”自然体现动作已经完成及其当前关联。
- source_word: ὑμῶν τοὺς πόδας
  choice: 你们的脚
  rationale: 按现代汉语习惯表达领属关系，同时准确保留具体对象。
- source_word: ὁ κύριος
  choice: 主
  rationale: 在此作为耶稣自称的尊称，并呼应上文门徒对他的称呼；“主”保留其称号及基督论意味。
- source_word: ὁ διδάσκαλος
  choice: 老师
  rationale: “老师”是现代标准汉语中自然、庄重且通俗的称谓，准确表达教导者的身份。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: “也”保留耶稣的行动与门徒责任之间的对应关系；显式“你们”体现原文代词的强调。
- source_word: ὀφείλετε
  choice: 应当
  rationale: 表达基于身份和榜样而产生的道德义务，不把陈述式的责任措辞过度强化为直接命令。
- source_word: ἀλλήλων
  choice: 彼此
  rationale: 是现代汉语表达相互关系的标准用语，简洁准确。
- source_word: νίπτειν τοὺς πόδας
  choice: 洗脚
  rationale: 保留原文所指的具体行为，不将其泛化为抽象的谦卑服事。
theological_decisions:
- issue: κύριος作为基督论称号的译法
  choice: 主
  alternative: 主人
  rationale: 本节中κύριος与“老师”并列，是耶稣认可并用于自身的称号；译作“主”既与上下文相符，也保留其超越一般师长身份的意味。
- issue: 洗脚要求的性质
  choice: 在正文中保留具体的“彼此洗脚”
  alternative: 彼此谦卑服事
  rationale: 原文明确说洗脚。该行动虽具有示范和象征意义，翻译仍不应在本节正文中将其改写成概括性的应用。
- issue: 条件句的解释
  choice: 保留“若”的条件形式
  alternative: 既然……就
  rationale: εἰ οὖν在语境中可有“既然”的论证力量，但原文仍采用条件句形式；译文保留“若”，避免替读者消除这一修辞张力。
translation_notes:
  register: 采用现代、清晰而庄重的口吻。“我这位主和老师”突出原文ἐγώ的强调，同时避免生硬直译；“所以……若……也应当……”保留推论、条件与义务三层逻辑。
