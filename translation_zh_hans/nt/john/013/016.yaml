  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a slave is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：奴隶[a]不能大过主人[b]，使徒[c]也不能大过差遣他的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”；原文指处在主人权下的人，“奴隶”更鲜明地保留其身份关系。
    reason: lexical_alternative
  - marker: b
    text: 原文也常译作“主”；这里按奴隶与主人的社会关系译为“主人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“使者”；原文也强调其受委派、被差遣的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 约翰福音中重复的“阿们”是郑重而强调的宣告公式。“实实在在”以现代汉语自然表达其重复和强调作用，并与后面的 λέγω ὑμῖν 合成通顺的引语公式。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 该词表示隶属于主人权下的人；本节以主人与奴隶的身份等级作比较，“奴隶”比“仆人”更充分保留这种强烈的社会关系。
- source_word: μείζων
  choice: 大过
  rationale: 这里指身份、地位或权柄上的高下。“大过”保留原文宽泛的比较含义，也自然适用于两个平行分句。
- source_word: κύριος
  choice: 主人
  rationale: 在奴隶与 κύριος 的社会关系中，此词意为掌权的主人；译作“主人”能清楚保持比喻中的对应关系。
- source_word: ἀπόστολος
  choice: 受差遣的人
  rationale: 此处重在被委派、被差遣者与差遣者之间的关系，且紧接 πέμψαντος。“受差遣的人”显明这种关系，同时避免把该词在这里不必要地限定为专称“使徒”。
- source_word: τοῦ πέμψαντος αὐτόν
  choice: 差遣他的那一位
  rationale: 以自然汉语表达带冠词的过去分词结构，并保留差遣者与受差遣者之间的平行关系。
theological_decisions:
- issue: κύριος 在本节是否作为尊称“主”
  choice: 主人
  alternative: 主
  rationale: 上下文构成“奴隶—主人”与“受差遣者—差遣者”的社会身份类比，并非直接使用基督论尊称。译作“主人”既保留原意，也不排除耶稣借此说明自己与门徒关系的上下文含义。
- issue: ἀπόστολος 是否译作专称“使徒”
  choice: 受差遣的人
  alternative: 使徒／使者
  rationale: 原文在这里可泛指奉命而出的人，且与“差遣他的”形成词义上的直接对应。采用描述性译法保留其一般意义，不把范围预先限定为十二使徒或某一教会职分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我实实在在地告诉你们”保留约翰福音郑重宣告的语气；两个“不能大过”维持原文整齐的平行结构。
