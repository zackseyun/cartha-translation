  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: zh_hans
  text: 这样，耶稣洗完他们的脚，拿起自己的衣服，又斜倚在席上，就对他们说：“你们明白我为你们[b]所做的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“对你们”；原文与格在这里既可理解为“为你们”，也可理解为“对你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: 于是
  rationale: 在叙事中自然承接上文，并配合后续动词次序表达“当这些事完成后”的时间推进；避免生硬直译为“所以当……时”。
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: 洗完他们的脚
  rationale: “洗完”表达不定过去时在此处所指的已完成动作，“他们的脚”准确、自然地对应原文宾语。
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: 拿起自己的衣服
  rationale: ἔλαβεν 的基本义是“拿、取”；“拿起”贴近原文，又不擅自把动作明确解释为“穿上”。ἱμάτια 译作宽泛的“衣服”，不额外限定为外衣。
- source_word: καὶ ἀνέπεσεν
  choice: 又斜倚席上
  rationale: ἀναπίπτω 在宴席语境中指斜倚用餐；此译保留古代席间姿势，同时以“又”体现动作的恢复。
- source_word: Γινώσκετε
  choice: 你们明白……吗
  rationale: 问题所关切的是门徒是否领会耶稣行动的意义，因此“明白”比单纯的“知道”更符合语境。
- source_word: τί πεποίηκα ὑμῖν
  choice: 我为你们所做的
  rationale: 完成时 πεποίηκα 表明已经完成而仍具现实意义的行动；ὑμῖν 在服事语境中可自然理解为受益与格“为你们”，但脚注保留“对你们”的可能译法。
theological_decisions:
- issue: 耶稣洗脚后回到席间的姿势
  choice: 又斜倚席上
  alternative: 又坐下；又入席
  rationale: 原文动词在用餐场景中通常指斜倚席上。主文保留历史文化图景，不把它泛化为现代坐姿。
- issue: ὑμῖν 在耶稣问题中的语义作用
  choice: 为你们
  alternative: 对你们
  rationale: 与格可表示受益者，也可较一般地表示动作所及的对象。上下文突出服事，故主文采用“为你们”，同时用脚注保留未完全排除的“对你们”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“斜倚席上”略具历史色彩，用以准确呈现第一世纪宴席姿势；其余措辞保持简洁自然。
