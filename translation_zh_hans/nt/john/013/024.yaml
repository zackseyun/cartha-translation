base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: zh_hans
  text: 于是，西门·彼得向他示意，要他问耶稣所说的是谁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化地说：“于是，西门·彼得向他示意，要他询问耶稣所说的是谁。”
    reason: 保留πυθέσθαι较正式的“询问”；τίς ἂν εἴη的未定、探询意味在汉语“是谁”的间接疑问中自然体现。
lexical_decisions:
- source_word: νεύει
  choice: 示意
  rationale: 表示以动作或神态传递信号；“示意”自然且不过度限定具体动作，避免武断译作“点头”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节并表明随后的行动，符合现代汉语叙事习惯。
- source_word: τούτῳ
  choice: 向他
  rationale: 指向上文已出现、靠近耶稣的那位门徒；汉语用“他”比“这人”更自然，所指仍由语境确定。
- source_word: πυθέσθαι
  choice: 让他问
  rationale: 不定式表达彼得示意那位门徒去询问；补出使令关系，使汉语句法清楚。
- source_word: τίς ἂν εἴη
  choice: 是谁
  rationale: 疑问代词与带ἄν的愿望式含有不确定、试探询问的意味；汉语疑问句中的“是谁”通常已自然包含这种未知性，无须生硬加入“可能”。
- source_word: περὶ οὗ λέγει
  choice: 耶稣所说的是谁
  rationale: 直译为“他是在说谁”；明确“耶稣”可避免连续代词造成歧义，同时保留询问其所指之人的意思。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“向他示意”保留非言语动作的宽泛含义；正文补出“耶稣”，以免读者误把两个“他”理解为同一人。
