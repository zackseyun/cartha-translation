id: JHN.13.20
reference: John 13:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：无论我差遣谁，接待他的，就是接待我；接待我的，就是接待那差遣我的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 实实在在地
  rationale: 保留约翰福音中双重“阿们”的郑重、强调语气，同时采用现代汉语读者熟悉而庄重的表达。
- source_word: λέγω ὑμῖν
  choice: 我……告诉你们
  rationale: 自然传达说话动词及复数间接受词，符合耶稣郑重宣告时的汉语表达。
- source_word: ὁ λαμβάνων
  choice: 接待……的
  rationale: 此处为泛指性的冠词化现在分词。“接待”既可指迎接，也包含接受其身份与使命；并能在全句中保留λαμβάνω的重复。
- source_word: ἄν τινα πέμψω
  choice: 无论我差遣谁
  rationale: ἄν、τινα与虚拟式πέμψω共同表达不限定对象的泛指条件；“无论……谁”自然保留开放范围。
- source_word: ἐμὲ λαμβάνει
  choice: 就是接待我
  rationale: 保留代表关系及λαμβάνω的词语重复；“就是”清楚呈现两者之间的等同关联。
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: 接待我的
  rationale: δέ在此主要承接并推进平行结构，而非表示强烈转折，因此汉语无需译为“但是”。
- source_word: τὸν πέμψαντά με
  choice: 那差遣我的
  rationale: 忠实保留关系性称谓，不在正文中直接补出“父”，使身份由上下文显明。
theological_decisions:
- issue: “那差遣我的”所指的身份
  choice: 那差遣我的
  alternative: 差遣我的父
  rationale: 约翰福音的语境表明这是指父，但本节原文没有明说“父”；正文保留原文措辞，避免把语境解释直接并入经文。
- issue: 冠词化阳性单数分词的泛指范围
  choice: 接待……的
  alternative: 接待他的人
  rationale: 这里不是限定男性，而是泛指任何接待者；汉语“……的”可自然、无性别限制地表达这一点。
- issue: 差遣者、受差者与耶稣之间的代表关系
  choice: 接待他的，就是接待我；接待我的，就是接待那差遣我的
  alternative: 欢迎他，就是欢迎我；欢迎我，就是欢迎父
  rationale: 保留原文三次λαμβάνει的链式重复及逐层上升的代表关系，不把“接待”缩窄为款待，也不把“那差遣我的”解释性改写为“父”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“实实在在地告诉你们”沿用广为人知的约翰式郑重宣告表达；全句保留“接待”的重复，以呈现原文严整的代表关系链。原文不存在必须以脚注处理的文本或语义歧义，因此不设脚注。
