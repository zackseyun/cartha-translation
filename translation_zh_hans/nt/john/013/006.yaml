source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: zh_hans
  text: 于是，他来到西门·彼得跟前。彼得对他说：“主啊[a]，你给我洗脚吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生。”希腊语κύριε可以用作尊敬的称呼；正文采用“主”。
    reason: 说明κύριε在此可作礼貌的尊称，同时保留正文“主”的译法。
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文用历史现在时增强叙事的现场感；现代汉语叙事通常不以动词形态标时，“来到”既自然，也准确表达朝彼得走近的动作。
- source_word: οὖν
  choice: 于是
  rationale: 在此承接上文并推进叙事；“于是”比“所以”更符合现代汉语的叙事语气。
- source_word: πρὸς Σίμωνα Πέτρον
  choice: 西门·彼得跟前
  rationale: πρός加宾格表示朝向某人移动；“来到……跟前”自然表达耶稣依次走到彼得那里。
- source_word: λέγει αὐτῷ
  choice: 彼得对他说
  rationale: 希腊文直译为“他对他说”，但主语需由彼得的话语内容判断。汉语若连续使用两个“他”会造成严重歧义，因此明示“彼得”，同时保留αὐτῷ所表达的“对他说”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε既可作尊称，也在《约翰福音》中带有基督论意味；正文采用“主”，并以语气词“啊”自然呈现直接称呼。
- source_word: σύ
  choice: 你
  rationale: 希腊文显式主语σύ带强调意味；汉语问句中明说“你”，结合彼得惊讶的语境，可传达“竟是你”的强调，而不额外增添原文没有的词。
- source_word: μου
  choice: 我的
  rationale: 属格代词修饰“脚”；译作“我的”准确且符合现代汉语。
- source_word: νίπτεις
  choice: 要洗
  rationale: νίπτω指清洗身体的一部分。此处彼得面对耶稣来到自己跟前的举动发问，“要洗”自然表达眼前即将施行的动作，不把它误解为全身沐浴。
- source_word: τοὺς πόδας
  choice: 脚
  rationale: πόδας意为“脚”；汉语在“我的脚”中不需另译希腊文冠词。
theological_decisions:
- issue: 彼得称呼耶稣时κύριε的译法
  choice: 主啊
  alternative: 先生
  rationale: “主”保留该称呼在本场景中的敬意，也保留《约翰福音》可能具有的基督论深度；但κύριε在某些语境也可只是礼貌称呼，因此脚注列出“先生”，不强行消除词义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”推进叙事；以“彼得”明确转换后的说话者，避免汉语代词歧义。历史现在时不作机械形式对应，而以紧凑、无显式时态标记的叙述保留现场感。
