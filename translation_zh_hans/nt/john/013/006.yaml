  terminology: “西门·彼得”“主啊”“洗脚”均符合现代标准汉语圣经语域。“先生”作为κύριε的脚注替代译法可保留；脚注说明宜明确这是尊敬称呼的可能性，而不将基督论解释作为词义本身强加于正文。
