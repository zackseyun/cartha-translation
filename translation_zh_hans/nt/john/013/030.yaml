base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: zh_hans
  text: 于是，那人[b]拿了那一小块饼[a]，立刻就出去了。当时正是夜间[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那一口食物”或“那一小块”。希腊语ψωμίον指席间的一小块饼或食物。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译“那一个”；这里的说法比单用“他”更有强调意味，可能是特意把注意力引向犹大。
    reason: lexical_alternative
  - marker: c
    text: “夜间”首先是实际的时间说明，也可能呼应约翰福音中光明与黑暗的主题。
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: 拿了
  rationale: 不定过去时分词在这里表示先于主句动作发生的行动；汉语用“拿了……就……”自然地保留动作次序。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，比“所以”更符合此处的叙事语气。
- source_word: τὸ ψωμίον
  choice: 那一小块饼
  rationale: ψωμίον指席间递出的一小块饼或食物；“那一小块饼”既具体清楚，也保留定冠词所指的已知对象。
- source_word: ἐκεῖνος
  choice: 那人
  rationale: 指示代词比普通的“他”更有强调和疏离色彩；“那人”在现代汉语中可自然保留这一修辞力度。
- source_word: ἐξῆλθεν
  choice: 出去了
  rationale: 保留ἐξέρχομαι的空间意义，比单译“离开了”更贴近原文。
- source_word: εὐθύς
  choice: 立刻
  rationale: 准确表达行动毫不迟延，并符合本段庄重简洁的叙事语体。
- source_word: ἦν δὲ νύξ
  choice: 当时正是夜间
  rationale: 按字面陈述时间，同时保留简短而富有文学意味的表达，不在正文中明说其可能的象征含义。
theological_decisions:
- issue: “夜间”在约翰福音语境中可能具有的象征意味
  choice: 正文按时间陈述译为“当时正是夜间”。
  alternative: 在正文中明确译出属灵黑暗的象征意义。
  rationale: 原文是简洁的时间陈述；约翰福音虽常以光明与黑暗承载象征意义，但此处应保留字面与象征并存的张力，不把解释写入正文。
- issue: ἐκεῖνος对犹大的指称力度
  choice: 译作“那人”，保留强调和疏离感。
  alternative: 译作普通代词“他”。
  rationale: 原文没有使用普通人称代词，而用了带标记的指示代词；保留其修辞力度不会额外加入教义判断。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“于是”推进情节，“拿了……立刻就……”符合自然汉语节奏；末句保持短促独立，以保存原文的文学力度和潜在双重意涵。
