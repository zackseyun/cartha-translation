source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: zh_hans
  text: 耶稣回答说：“你愿意为我舍命吗？我实实在在地告诉你：鸡绝不会叫，直到你三次不认我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: 回答说
  rationale: 希腊文用历史现在时引出耶稣的回应；现代汉语叙事自然地译为“回答说”。
- source_word: Τὴν ψυχήν σου…θήσεις
  choice: 你愿意……舍命吗
  rationale: τίθημι τὴν ψυχήν 是约翰福音中舍弃生命的固定表达；“舍命”准确、凝练，也避免把 ψυχή 在此误解为专指非物质的“灵魂”。
- source_word: ὑπὲρ ἐμοῦ
  choice: 为我
  rationale: ὑπέρ 在此表示为了某人、代某人；“为我”是自然且保留原文简洁性的译法。
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你
  rationale: 保留约翰福音中双重 ἀμήν 的郑重强调，并采用现代中文圣经语体中清楚而庄重的表达。
- source_word: οὐ μὴ…φωνήσῃ
  choice: 鸡叫以前……必
  rationale: 原文 οὐ μή 构成强烈否定，整句意为在彼得三次否认耶稣之前，鸡绝不会叫；汉语以“鸡叫以前，你必……”自然表达这一确定预告。
- source_word: ἀλέκτωρ φωνήσῃ
  choice: 鸡叫
  rationale: “鸡叫”是现代汉语对公鸡啼叫最自然的惯用表达，无须生硬译作“公鸡发声”。
- source_word: ἀρνήσῃ με
  choice: 不认我
  rationale: ἀρνέομαι 在此指否认与耶稣的关系；“不认我”在汉语中直接表达这种否认或拒绝承认，且与后文叙事相符。
- source_word: τρίς
  choice: 三次
  rationale: 直译次数，符合现代汉语习惯。
theological_decisions:
- issue: ψυχή 在舍己语境中的含义
  choice: 舍命
  alternative: 舍弃灵魂／舍下性命
  rationale: 上下文谈的是彼得声称愿意为耶稣而死，因此此处指现实生命。“舍命”保留牺牲含义，又不引入灵魂与身体二分的额外主张。
- issue: 鸡叫与三次否认的先后及确定性
  choice: 鸡叫以前，你必三次不认我
  alternative: 鸡绝不会叫，直到你三次不认我
  rationale: 所选译文符合自然汉语，并传达原文强烈否定所产生的确定预告；替代译法更形式对应，却在中文中略显拗口。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“舍命”“实实在在”“不认我”既保留约翰叙事的传统辨识度，也能被普通现代读者自然理解。原文此节无须用脚注才能保留的实质歧义，因此正文未设脚注标记。
