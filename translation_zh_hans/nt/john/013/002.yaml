  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: zh_hans
  text: 用晚餐的时候[a]，魔鬼已经把[b]要出卖耶稣[c]的念头放进加略人西门的儿子犹大心里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正吃晚餐的时候。”原文不是说晚餐已经结束。
    reason: lexical_alternative
  - marker: b
    text: 直译：“已经把……放进心里”；也可译作“已经唆使”。
    reason: lexical_alternative
  - marker: c
    text: “出卖”也可译作“交出去”。在此语境中，“出卖”更能表达原文的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: 晚餐进行时
  rationale: 属格独立结构表示与下文同时发生的情境；此译法自然且明确，不会误导读者以为晚餐已经结束。
- source_word: διάβολος
  choice: 魔鬼
  rationale: 在约翰福音的叙事中指那位邪恶者；采用现代汉语中已确立的称谓。
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: 已经把……的念头放进了……心里
  rationale: 保留原文“放进心里”的意象，并以“念头”补足汉语表达所需的宾语，使其自然可懂；“已经”体现完成时所表达的先行情形。
- source_word: καρδίαν
  choice: 心里
  rationale: 保留圣经语言中“心”作为意志、思想和意图所在的意象，而不缩减为单纯的情绪。
- source_word: ἵνα παραδοῖ
  choice: 出卖
  rationale: παραδίδωμι本义可指“交出去”，在犹大的语境中具有背叛、出卖的含义；“出卖”在现代汉语中准确传达此处的语境力量。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 原文代词指耶稣；本节在汉语中若孤立呈现，用姓名可避免指代不清。
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: 加略人犹大——西门的儿子
  rationale: 按较可能的句法，“加略人”识别犹大，“西门的儿子”补充其父子关系；破折号避免误读成“加略人西门”。
theological_decisions:
- issue: 犹大出卖耶稣时魔鬼的作用与犹大本人的责任
  choice: 表述为魔鬼已把出卖耶稣的念头放进犹大心里，同时仍由犹大作为将要出卖耶稣的人。
  alternative: 译作“魔鬼已经唆使犹大”，或表述为魔鬼借犹大作出决定。
  rationale: 原文既陈述魔鬼的影响，也把παραδοῖ的行动归于犹大；译文保留这种张力，不对决定论或唯一因果作额外判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“晚餐进行时”准确表达同时发生的背景；“放进了……心里”保留原文意象。以破折号标明“西门的儿子”是对犹大的补充说明，避免将“加略人”误接到西门身上。所有脚注标记均在正文出现。
