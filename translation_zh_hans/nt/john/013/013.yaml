base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: zh_hans
  text: 你们称我为“老师”和“主”[a]；你们说得对，因为我确实是。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主人”。希腊语κύριος可指“主人”或具有权柄者；这里正文保留“主”，作为称号使用。
    reason: 词义备选
lexical_decisions:
- source_word: φωνεῖτέ με
  choice: 称我为
  rationale: 在“称某人为某称号”的结构中，“称我为”既自然又直接，准确表达门徒用这些称号称呼耶稣。
- source_word: Ὁ διδάσκαλος
  choice: 老师
  rationale: διδάσκαλος在此是对耶稣的称号；“老师”是现代汉语中清楚自然的对应表达。希腊语冠词标示称号，汉语无需机械译出“那位”。
- source_word: Ὁ κύριος
  choice: 主
  rationale: κύριος在此作为对耶稣的称号，既包含权柄意味，也承载新约中“主”这一称谓的分量；译作“主”避免与διδάσκαλος混同。
- source_word: καλῶς λέγετε
  choice: 你们说得对
  rationale: 这一表达评价他们所说的话正确；“说得对”比逐字式的“说得好”更准确，也符合现代汉语习惯。
- source_word: εἰμὶ γάρ
  choice: 因为我本来就是
  rationale: 汉语需要根据上文补足隐含的表语。“本来就是”简洁地表明耶稣确认这两个称号确实适用于自己，同时没有额外界定其含义。
theological_decisions:
- issue: κύριος作为耶稣的称号如何翻译
  choice: 主
  alternative: 主人
  rationale: “主”保留了该词作为新约重要称号的神学分量，也能表达权柄；“主人”虽可反映社会关系或支配权，却可能把此处称号的含义收窄。脚注保留这一词义可能性。
- issue: εἰμί所确认的范围
  choice: 让“我本来就是”承接“老师”和“主”两个称号
  alternative: 明确扩写为“因为我就是老师和主”
  rationale: 希腊文省略表语，由上下文自然补足。正文维持这种简洁承接，不另行重复称号，以免增加原文没有的强调方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称我为”适合称号语境；分号使前后“称号—确认”的逻辑清楚。引号标明“老师”和“主”是门徒对耶稣所用的称号。
