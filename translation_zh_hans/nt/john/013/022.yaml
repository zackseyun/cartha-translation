base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: zh_hans
  text: 门徒彼此看着[a]，不知道他在说谁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“门徒不断彼此看着，对他在说谁感到困惑。”
    reason: 词义与体貌的另一种译法：以“不断”较明确表现ἔβλεπον的持续或反复意味，并以“感到困惑”较形式地对应ἀπορούμενοι。
lexical_decisions:
- source_word: ἔβλεπον
  choice: 看着
  rationale: 未完成时描绘当时持续进行的动作；“彼此看着”在现代汉语中自然地保留这一场景感。
- source_word: εἰς ἀλλήλους
  choice: 彼此
  rationale: 表达门徒之间互相观看，简洁而符合叙事语体。
- source_word: οἱ μαθηταὶ
  choice: 门徒们
  rationale: 定冠词指上下文中已知的门徒群体；不增添原文没有明说的“他的”。
- source_word: ἀπορούμενοι
  choice: 不知道
  rationale: 该分词表示困惑、拿不准；结合后面的间接疑问，“不知道”是自然清楚的现代汉语表达。
- source_word: περὶ τίνος
  choice: 是（指）谁
  rationale: περί加属格疑问代词询问所谈论的人；汉语用“说的是谁”准确表达。
- source_word: λέγει
  choice: 他说的是
  rationale: 保留“说、谈论”的言语含义，不将其解释性地改成“指的是”或“意思是”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“彼此看着”呈现席间门徒互相观望的场景；主句不加逗号后的生硬书面结构。脚注保留未完成时与分词的较形式对应译法。
