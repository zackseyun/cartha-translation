  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: zh_hans
  text: 逾越节以前，耶稣知道他要离开这个世界、到父那里去的时候已经到了。他既爱世上属自己的人，就爱他们到底。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱他们到底”也可理解为“一直爱到最后”或“完全地爱他们”。原文可能兼有爱持续到最后时刻和爱达到完全这两层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: 逾越节以前
  rationale: πρό加属格表示时间上的“以前”；δὲ为轻微承接词，汉语无需生硬译出。上下文已明确是逾越节期，“逾越节”自然涵盖节期含义。
- source_word: εἰδὼς
  choice: 知道
  rationale: 该分词表达耶稣在行动时清楚意识到自己的时刻已经来到；“知道”自然、直接。
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: 自己的……时候已经到了
  rationale: 保留约翰福音中“时候到了”的重要表达，同时按现代汉语语序把相关不定式内容嵌入其中。
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: 离开这个世界、到父那里去
  rationale: μεταβῇ表示从一个领域转到另一个领域；此译既保留空间转换意象，也不把死亡与得荣耀的内涵单独窄化为其中之一。
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: 世上属自己的人
  rationale: “属自己的人”保留τοὺς ἰδίους宽广而亲密的关系含义，不擅自限定为“门徒”；“世上”准确传达其所在领域。
- source_word: ἀγαπήσας
  choice: 既然爱
  rationale: 以汉语关联结构表达分词所概括的既有之爱，并与后面的高潮性陈述自然衔接；不将其强解为单纯时间先后。
- source_word: εἰς τέλος
  choice: 到底
  rationale: “到底”可表达爱持续到终点，也可带出爱得完全、彻底的意味，较好保存原语的双重可能。
- source_word: ἠγάπησεν αὐτούς
  choice: 就爱他们
  rationale: 直译ἀγαπάω为“爱”，并用“就”与前面的“既然”衔接，形成自然而庄重的汉语句式。
theological_decisions:
- issue: εἰς τέλος是时间性的“直到最后”，还是程度性的“完全、彻底”
  choice: 正文译作“到底”，保留时间与程度两方面的共鸣。
  alternative: 一直爱到最后；完全地爱他们
  rationale: 该短语可能同时指耶稣爱属自己的人直到最后时刻，也指他的爱达到完全。正文不把约翰式的丰富含义压缩为单一解释，脚注明示两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“父”保留约翰福音的关系称谓；避免添加“他的父”或将“属自己的人”缩窄为“门徒”。脚注标记置于其所说明的“爱他们到底”之后。
