  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: zh_hans
  text: 随后，他把水倒进水盆里[a]，就开始洗门徒的脚，并用系在腰间的毛巾[b]擦拭他们的脚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盆”。希腊语此词指洗涤用的器皿。
    reason: lexical_alternative
  - marker: b
    text: 或译“他系在身上的毛巾”。希腊语这一表达指他为服侍而系在身上的毛巾。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: 随后
  rationale: 表示叙事中动作的先后承接；“随后”自然、庄重，也不添加原文没有的时间间隔。
- source_word: βάλλει
  choice: 把水倒进
  rationale: βάλλω本义较宽，可指“放、投入”；以水和盆为宾语时，汉语惯用“倒进”，准确表达此处动作。
- source_word: νιπτῆρα
  choice: 水盆
  rationale: 该词指用于洗涤的盆状器皿。“水盆”比单说“盆”更明确，又避免把器皿的固定用途限定为只供洗脚。
- source_word: ἤρξατο νίπτειν
  choice: 就开始洗
  rationale: 保留ἄρχομαι加不定式所表达的动作起始，并以“就”自然连接前后动作。
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: 门徒的脚
  rationale: 以现代汉语自然的领属结构准确表达希腊文属格关系。
- source_word: ἐκμάσσειν
  choice: 擦干
  rationale: 该动词可指擦拭或擦干；在洗脚后用毛巾处理脚的语境中，“擦干”清楚自然。
- source_word: τῷ λεντίῳ
  choice: 用……毛巾
  rationale: λέντιον在此指用于擦拭的布巾；“毛巾”是普通读者容易理解的现代对应词，并不意指现代特定材质。
- source_word: ᾧ ἦν διεζωσμένος
  choice: 系在腰间的
  rationale: 该结构描写耶稣以这条巾束身；“系在腰间”自然表达当时为服侍而束巾的动作，避免生硬的“束着自己”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“随后……就开始……”保持动作推进；“系在腰间”传达希腊语习语而不使用现代汉语中生硬的“束腰”。
