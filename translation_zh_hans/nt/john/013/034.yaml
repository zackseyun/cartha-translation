source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: zh_hans
  text: “我给你们一条新诫命[a]：你们要彼此相爱。我怎样爱你们，你们也要怎样彼此相爱[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“命令”。“诫命”较能保留此处正式的伦理约束力。
    reason: lexical_alternative
  - marker: b
    text: 后半句也可译：“我怎样爱你们，你们也彼此相爱。”此处的“要怎样”是为在汉语中表达劝令和比较关系而作的自然表达。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: 诫命
  rationale: “诫命”保留了ἐντολή在约翰著作中正式的伦理约束力，也符合现代汉语的经文语体；“命令”则是可取的较日常译法。
- source_word: καινὴν
  choice: 新
  rationale: 直译καινός，不在正文中限定其所指是时间上的新、性质上的新，还是在耶稣榜样中获得新的实现。
- source_word: δίδωμι ὑμῖν
  choice: 我给你们
  rationale: 明确表达现在时动词及与格受事者，语言自然直接，并保留耶稣亲自颁下诫命的语气。
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: 你们要彼此相爱
  rationale: 这里的ἵνα从句说明诫命的内容，同时具有劝令意味；“要”在现代汉语中自然传达这一力度。
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: 相爱 / 爱
  rationale: 统一使用“爱”来保留原文ἀγαπάω词根的重复与神学重点；中文不必机械标示不定过去时。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: “彼此”准确表达相互关系，并适合庄重而通俗的现代汉语。
- source_word: καθὼς
  choice: 怎样……也要怎样……
  rationale: 以自然汉语清楚表达比较关系，表明耶稣的爱是门徒彼此相爱的模式和尺度。
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: 你们也要怎样彼此相爱
  rationale: 保留καὶ ὑμεῖς对“你们也”的强调，并以“要”传达语境中的劝令意味；ἵνα也可能偏重目的或结果，故列入脚注。
theological_decisions:
- issue: “新诫命”的新意
  choice: 正文仅译作“一条新诫命”，不解释其新在何处。
  alternative: 可理解为时间上的新、性质上的新，或借着耶稣的爱而有新的实现。
  rationale: 本节称诫命为“新”，却没有在句内明确界定其新意；不加解释可保留原文的神学张力。
- issue: 耶稣的爱与门徒相爱的关系
  choice: 译成“我怎样爱你们，你们也要怎样彼此相爱”，呈现榜样和尺度的关系。
  alternative: 后一个ἵνα也可较明确地理解为目的或结果：“为要使你们也彼此相爱。”
  rationale: καθὼς明确建立比较关系，而第二个ἵνα的句法功能具有一定开放性，不宜在正文中彻底排除目的或结果的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我给你们”直接自然；“彼此相爱”保留约翰福音中的关键词重复。比较结构采用“怎样……也要怎样……”，避免生硬的“正如我爱了你们”，同时不额外说明“新”的神学含义。
