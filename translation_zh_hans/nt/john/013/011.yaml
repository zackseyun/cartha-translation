id: JHN.13.11
reference: John 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: zh_hans
  text: 因为他知道要出卖他的是谁；所以他说[a]：“你们不都是洁净的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖”或更直译为“交出”。在本段语境中，指犹大的背叛。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知道
  rationale: οἶδα的过去完成时形式在此表达耶稣当时已有并持续具有的认知；汉语叙事中用“知道”自然准确。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明上一节话语的原因；“因为”清楚保留解释关系。
- source_word: τὸν παραδιδόντα αὐτόν
  choice: 要出卖他的是谁
  rationale: παραδίδωμι本义为“交出、交付”，在本段受难叙事中指犹大的背叛。“出卖”符合语境；“要……的是谁”以自然汉语表达带定冠词的现在分词，并不把行为说成已经完成。
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 该短语明确引出基于前述认知所得的结果；“所以”简洁自然地呈现因果联系。
- source_word: εἶπεν ὅτι
  choice: 他说
  rationale: ὅτι在此引入直接引语，汉语以冒号和引号自然体现，无须另译“说 that”。
- source_word: Οὐχὶ πάντες
  choice: 不都是
  rationale: 在否定词位于πάντες之前的结构中，表达部分否定，即并非每一个人都洁净；“不都是”准确且自然。
- source_word: καθαροί
  choice: 洁净
  rationale: “洁净”既可承接洗脚的洁净意象，也能保留道德和属灵层面的含义，避免单译为“纯洁”而消除双关张力。
- source_word: ἐστε
  choice: 是
  rationale: 与表语“洁净的”组成自然的现代汉语判断句。
theological_decisions:
- issue: παραδιδόντα所指行为的表达
  choice: 出卖
  alternative: 交出／交付
  rationale: “交出”较贴近字面，但在约翰受难叙事中，此词指犹大的背叛行为。“出卖”使普通读者能立即把握语境意义；脚注同时保留字面词义。
- issue: καθαροί在洗脚语境中的含义
  choice: 洁净
  alternative: 纯洁
  rationale: “洁净”同时容纳身体洗涤意象和属灵状态，不把经文限定为单纯的道德评断。
- issue: οὐχὶ πάντες的否定范围
  choice: 你们不都是洁净的
  alternative: 你们并非人人都洁净
  rationale: 两者都表达部分否定；所选译法更贴近原文词序，并以简洁自然的汉语保留“不是所有人”的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洁净”与前文洗脚语境衔接，并保留其属灵含义；分号呈现原文两个因果相连分句的结构。
