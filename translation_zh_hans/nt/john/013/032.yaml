  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: zh_hans
  text: 如果上帝在他身上得了荣耀[a]，上帝也要在自己身上使他得荣耀[b]，并且立刻使他得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“既然上帝在他身上得了荣耀。”希腊文用“如果”，但按上下文，这个条件很可能被视为已经成立。
    reason: alternative_reading
  - marker: b
    text: 原文直译可作“在自己里面”；也可理解为“借着自己”。“使他与自己同享荣耀”是对此短语的一种解释性理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: 如果
  rationale: 保留希腊文条件连词的基本形式；上下文可能把条件视为已经成立，但不在正文中直接改写为因果关系。
- source_word: ἐδοξάσθη
  choice: 得了荣耀
  rationale: 以自然的现代汉语表达不定过去时被动语态，并与后文 δοξάσει 的“使他得荣耀”保持词义呼应。
- source_word: ἐν αὐτῷ
  choice: 在他身上
  rationale: 保留 ἐν 的宽泛关系意义，同时比生硬的“在他里面”更符合此处现代汉语表达；不直接限定为“借着他”。
- source_word: δοξάσει
  choice: 要使……得荣耀
  rationale: 表达 δοξάζω 的将来主动语态，并保留本节反复出现的“荣耀”主题。
- source_word: ἐν αὑτῷ
  choice: 在自己里面
  rationale: 按所给 SBLGNT 文本把反身代词理解为回指上帝，尽量保留希腊文紧凑而含义丰富的表达，不径自解释为“借着自己”或“与自己同享荣耀”。
- source_word: εὐθύς
  choice: 立刻
  rationale: 准确而自然地传达即时性，避免弱化为“很快”。
theological_decisions:
- issue: εἰ 在上下文已暗示事实成立时的条件语气
  choice: 正文保留“如果”
  alternative: “既然上帝在他身上得了荣耀”
  rationale: 希腊文明确使用 εἰ；虽然上下文很可能把前件视为真实，正文仍保留条件形式，并以脚注说明因果式理解。
- issue: ἐν αὑτῷ 的关系含义
  choice: “在自己里面”
  alternative: “借着自己”或“与自己同享荣耀”
  rationale: 保留原文的简练和神学张力，不把介词 ἐν 的具体关系单一化。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“上帝”沿用咨询文本的称谓；三次使用“荣耀”以保持约翰福音原文的关键词复现。“在他身上”使中文自然，同时脚注保留相关语义开放性。
