  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: zh_hans
  text: 因为我给你们作了榜样[a]，使你们也照着我向你们所做的那样去做。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “榜样”或译“范例”或“模范”。
    reason: lexical_alternative
  - marker: b
    text: “我向你们所做的”也可译为“我为你们所做的”或“我对你们所做的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: 榜样
  rationale: 该词指供人效法的范例或模式；“榜样”在现代汉语中自然、庄重，也切合耶稣刚才行动所具有的示范作用。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为耶稣先前的行动和教导说明理由；“因为”清楚保留这一解释关系。
- source_word: ἔδωκα ὑμῖν
  choice: 我给你们作了
  rationale: 直译为“我给了你们”，但汉语通常说“给……作榜样”；“作了”也自然表达已经完成而仍具现实意义的行动。
- source_word: ἵνα
  choice: 好让
  rationale: 表达目的或预期结果；“好让”是清楚自然的现代汉语说法。
- source_word: καθὼς
  choice: 照着
  rationale: 表示门徒的行动应与耶稣的行动相对应；“照着”兼有比较和效法之意。
- source_word: ἐποίησα ὑμῖν
  choice: 我为你们所做的
  rationale: ποιέω意义宽泛，ὑμῖν为与格；结合洗脚的语境，“为你们所做的”自然表达耶稣向门徒施行的行动，同时保留其惠益意味。
- source_word: καὶ ὑμεῖς ποιῆτε
  choice: 你们也……去做
  rationale: “也”保留καί所表达的对应加入；目的从句中的虚拟式在汉语中以“好让……去做”自然呈现，不另加生硬的情态词。
theological_decisions:
- issue: 耶稣榜样对门徒所具有的效法要求
  choice: 译文明确表明耶稣的行动是要门徒照着去做的榜样，但不进一步界定这种效法是否必须成为固定礼仪。
  alternative: 将本节明确译成所有信徒在一切处境中都必须举行洗脚礼，或将其处理成完全没有具体行动要求的象征。
  rationale: 原文明确含有榜样、目的和对应行动，却未在本节内说明后世教会应如何制度化这一行动；译文因此保留其实际的伦理要求，而不加入宗派性结论。
- issue: ὑμῖν在ἐποίησα后的语义
  choice: 正文采用“为你们所做的”，并以脚注保留“给你们做的”这一较贴近形式的表达。
  alternative: 只译作“对你们所做的”或“给你们做的”，完全不体现语境中的惠益意味。
  rationale: 希腊语与格可按受事相关或受益关系理解；洗脚语境支持惠益意味，但该形式本身不必被限定为单一类别，故正文取自然表达，脚注保存另一译法。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“作了榜样”是自然搭配；“好让……去做”清楚表达目的和预期行动，既避免古奥，也不把从句改写成直接命令。
