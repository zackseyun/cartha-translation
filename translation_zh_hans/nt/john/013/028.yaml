  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: zh_hans
  text: 可是，同席的人没有一个知道他为什么对他说这话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他是为了什么目的对他说这话。”
    reason: 词语“πρὸς τί”可较形式地表达为询问目的；正文“为什么”在现代汉语中更自然，并可兼含原因与目的。
lexical_decisions:
- source_word: τοῦτο
  choice: 这话
  rationale: 指向耶稣刚才所说的内容；汉语用“这话”比单用“这”更清楚自然，也保留了指示作用。
- source_word: δὲ
  choice: 可是
  rationale: 表示叙事中的轻微转折：耶稣虽已吩咐犹大，在席者却不明白其用意。
- source_word: οὐδεὶς
  choice: 没有一个
  rationale: 与“同席的人”组成自然的汉语部分否定结构，准确表达无人知晓。
- source_word: ἔγνω
  choice: 知道
  rationale: 此处表示在席者并不知道耶稣说话的用意；“知道”保持原词较宽的语义，不必强化为“明白”。
- source_word: τῶν ἀνακειμένων
  choice: 同席的人
  rationale: 原词描写古代用餐时斜倚席上的姿势；现代汉语“同席的人”自然传达参与这次筵席的人，而不使读者误以为重点在身体姿势。
- source_word: πρὸς τί
  choice: 为什么
  rationale: 自然表达所问的原因或目的，同时以脚注保留更形式对应的目的含义。
- source_word: εἶπεν αὐτῷ
  choice: 他……对他说
  rationale: 保留两个男性单数代词在原文中的指称方式，不擅自以姓名消除语境所承载的指代关系。
theological_decisions: []
