  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: zh_hans
  text: 你们若知道这些事，并照着去做，就有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福的”也可译作“有福气的”或“幸运的”；原文所指不只是感到快乐，而是处于蒙眷顾、兴盛的美好境况。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: 既
  rationale: 此处形式上是条件句，但结合下文“若”所引出的实践条件，前句更自然地表达为对门徒已有认知的承认；“既知道”保留了条件所带的语用含义，又符合现代汉语表达。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词，回指耶稣此前的榜样和教导，不压缩为单数“这件事”。
- source_word: οἴδατε
  choice: 知道
  rationale: 直接对应知识、知晓之意；不扩大解释为“明白”或“领会”。
- source_word: μακάριοί
  choice: 有福的
  rationale: 表达处于蒙福、可称为有福的状态，保留圣经语境中的神学分量，而不缩减为主观的快乐感。
- source_word: ἐὰν
  choice: 若
  rationale: 与虚拟式动词连用，表示有待实现的条件；“若”简洁、庄重且自然。
- source_word: ποιῆτε
  choice: 照着去做
  rationale: “做”准确传达付诸行动；补入“照着”明确其对象是前述所知道的事，但没有把动词过度解释为长期“践行”。
- source_word: αὐτά
  choice: 照着
  rationale: 汉语中以“照着去做”自然承接“这些事”，避免生硬直译为“做它们”，同时保持回指关系。
theological_decisions:
- issue: 门徒知道与实行之间的关系
  choice: 以“既……若……”区分已有认知和有条件的实行
  alternative: “如果你们知道这些事，并且去做，就有福了”
  rationale: 原文先有 εἰ 引导“知道”，再由 ἐὰν 明确限定“做”；译文不把两者合并成同一并列条件，也不暗示仅有知识便足以蒙福。
- issue: μακάριοι 的含义
  choice: 有福的
  alternative: 快乐的；幸运的
  rationale: “有福”既不局限于情绪，也不暗示偶然运气，可保留蒙眷顾、处于美好境况的开放性及圣经传统用语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照着去做”比“实行它们”自然；句末“就是有福的”保留判断语气。脚注标记置于完整经文末尾。
