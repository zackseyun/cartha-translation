  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: zh_hans
  text: 彼得对他说：“主啊，我为什么现在[a]不能跟随你？我要为你舍命[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “现在”也可译作“此刻”或“现在就”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“放下我的生命”；这里的意思是“舍命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性的历史现在时；现代汉语叙事用“说”即可自然表达，不必另行标明时态。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留直接称呼中的尊敬意味及其可能具有的神学分量，同时不把含义解释得过满。
- source_word: διὰ τί οὐ δύναμαί
  choice: 我为什么……不能
  rationale: 符合现代汉语疑问句语序，也准确表达彼得追问自己为何不能这样做。
- source_word: σοι ἀκολουθῆσαι
  choice: 跟随你
  rationale: “跟随”既可指随同前往，也保留约翰福音中作门徒跟从耶稣的含义。
- source_word: ἄρτι
  choice: 现在
  rationale: 自然表达当前这一时间点；脚注补充“此刻、现在就”的较强即时语气。
- source_word: τὴν ψυχήν μου
  choice: 命
  rationale: 在“为某人舍下ψυχή”的表达中，ψυχή指人所付出的生命，而非专指与身体相对的“灵魂”。
- source_word: ὑπὲρ σοῦ
  choice: 为你
  rationale: 保留ὑπέρ所表达的为了对方、为对方缘故的宽泛关系，不强行限定为代替意义。
- source_word: θήσω
  choice: 舍
  rationale: τίθημι与ψυχή连用，构成舍弃生命的惯用表达；“舍命”在现代汉语中简洁、自然，并准确传达愿意赴死的意思。
theological_decisions:
- issue: ψυχή在彼得宣言中的含义
  choice: 译为“命”，组成“舍命”
  alternative: 译为“灵魂”或直译为“生命”
  rationale: 上下文说的是彼得愿意为耶稣而死。“舍命”准确表达这一惯用语，不引入希腊文在此处没有强调的灵魂—身体二分观。
- issue: ἀκολουθέω的双重意味
  choice: 译为“跟随”
  alternative: 译为“跟你去”或“陪同你”
  rationale: “跟随”同时容纳实际随行和作门徒跟从耶稣两层意味，保留约翰叙事中的张力。
- issue: 彼得话语的承诺力度
  choice: 译为“我要为你舍命”
  alternative: 译为“我愿意为你舍命”
  rationale: θήσω是将来时的直接宣告，语气近于“我将要/我要”；采用“我要”比“我愿意”更贴近彼得明确而自信的承诺。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。“主啊”符合汉语呼语习惯；“跟随”保留字面行动与门徒身份的双重含义；“舍命”是普通读者容易理解的凝练表达。
