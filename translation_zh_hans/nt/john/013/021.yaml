  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: zh_hans
  text: 耶稣说了这些话，心里忧愁，就作见证说：“我实实在在地告诉你们，你们中间有一个人要出卖我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要把我交出去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: 说了这些话
  rationale: 将不定过去时分词自然处理为先于主句动作发生的时间背景，简洁保留事件次序。
- source_word: ἐταράχθη τῷ πνεύματι
  choice: 心里忧伤
  rationale: τῷ πνεύματι 表示内在感受的层面；“心里忧伤”是现代汉语中自然而庄重的表达，不额外添加希腊文未明说的强度。
- source_word: ἐμαρτύρησεν
  choice: 郑重作证
  rationale: 保留约翰著作中 μαρτυρέω 的见证、作证用语；加“郑重”传达此处发言的严肃见证性质，避免单译“宣告”而削弱其词汇特色。
- source_word: Ἀμὴν ἀμὴν
  choice: 实实在在地
  rationale: 采用现代中文圣经语体中易懂且庄重的固定表达，传达双重 ἀμήν 的郑重强调；汉语不机械重复，以免显得生硬。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 符合当代标准汉语的自然表达，同时保留耶稣直接面向门徒说话的语气。
- source_word: εἷς ἐξ ὑμῶν
  choice: 你们中有一个人
  rationale: 自然表达部分关系，并保留此人出自门徒群体之中的震撼意味。
- source_word: παραδώσει με
  choice: 要出卖我
  rationale: 上下文指犹大的背叛行为，“出卖”准确传达这里的语境意义；原词较字面的“交出”保留在脚注中。
theological_decisions:
- issue: 如何表达耶稣内在的扰动
  choice: 心里忧伤
  alternative: 灵里不安／心灵受到扰动
  rationale: 让经文本身所呈现的耶稣真实内在痛苦充分保留，不削弱其人性，也不加入后来的教义解释；“心里”在现代汉语中自然表达内在层面。
- issue: 如何翻译背叛预告中的 παραδίδωμι
  choice: 要出卖我
  alternative: 要把我交出去
  rationale: 直接语境中的行为带有亲近者背叛的性质，因此正文用“出卖”；同时以脚注保留“交出”这一较字面的语义，使受难叙事中的词汇联系仍可查考。
translation_notes:
  register: 采用自然、庄重、适合公众朗读的现代标准汉语。“郑重作证说”保留约翰式见证用语；引语使用现代标点。脚注标记紧随其所说明的“出卖我”之后。
