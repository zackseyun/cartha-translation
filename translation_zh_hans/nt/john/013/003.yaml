  verdict: approve
  source_fidelity: 正文准确保留了 εἰδὼς 的背景性“知道”、父把“万有”交在耶稣手中的完整范围，以及“从神而来”和“到神那里去”的来源与去向。没有把 ἀπὸ θεοῦ 改写为“从父而来”，也没有在正文加入原文未明说的“回”。“要到神那里去”在此叙事语境中可自然传达 ὑπάγει 所指向的即将离去。
