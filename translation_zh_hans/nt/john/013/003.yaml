id: JHN.13.3
reference: John 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: zh_hans
  text: 耶稣知道父已把万有交在他手中，也知道自己从神而来[a]，又要到神那里去[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从神而出”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要回到神那里去”；希腊原文只说“要到神那里去”。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 以分词说明随后行动的背景和缘由；“知道”自然简明，不额外强化时态。
- source_word: πάντα
  choice: 万有
  rationale: 保留中性复数所表达的全面范围；“万有”在庄重的现代汉语中自然，也比单说“一切”更明确地指向所有事物。
- source_word: ἔδωκεν
  choice: 已把……交
  rationale: 不机械复制希腊语不定过去时，而用“已”表明这件事相对于当前场景已经完成；“交在他手中”同时含有托付和权柄的意味。
- source_word: εἰς τὰς χεῖρας
  choice: 交在他手中
  rationale: 保留“手中”这一具体比喻；现代汉语也能自然表达掌管、支配或受托的含义。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文是带冠词的“父”，没有明说“他的”；约翰福音中这是具有分量的称谓，译作“父”可避免增添所有格。
- source_word: ἀπὸ θεοῦ
  choice: 从神
  rationale: 忠实保留原文的“神”，不改成“父”或“神那里”。
- source_word: ἐξῆλθεν
  choice: 而来
  rationale: 在本语境中表达来源和使命；“从神而来”是自然现代汉语，并保留其基督论分量。
- source_word: πρὸς τὸν θεὸν
  choice: 到神那里
  rationale: 直接表达朝向神的行动，同时不把 πρός 的关系意味扩写为“与神同在”。
- source_word: ὑπάγει
  choice: 要……去
  rationale: 结合叙事语境表达即将离去；不擅自加入“回”或更具体的离世解释。
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθεν 所表达的基督来源
  choice: 从神而来
  alternative: 从神而出
  rationale: 正文自然地表达耶稣来自神，同时不把本节扩展成后期教义术语；脚注保留更贴近动词字面的译法。
- issue: πρὸς τὸν θεὸν ὑπάγει 所表达的目的地
  choice: 要到神那里去
  alternative: 要回到神那里去
  rationale: 上下文可使人理解为返回神那里，但本分句本身没有明说“回”；正文避免把语境推论写入原文，脚注说明这一自然的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“万有”“交在他手中”保留约翰叙事的神学分量和具体意象。经文以逗号结尾，因为本节在希腊原文中是延续到下一节的从属结构。
