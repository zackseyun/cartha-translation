  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: zh_hans
  text: 耶稣回答：“我把这块饼蘸了递给谁，谁就是那个人。”于是，耶稣蘸了饼，就把饼递给加略人西门的儿子犹大[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西门的儿子加略人犹大。”希腊文的措辞可以有这两种理解。
    reason: 保留Ἰσκαριώτου究竟修饰西门还是犹大的句法歧义。
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: 回答
  rationale: 希腊文用历史现在时推进叙事；现代汉语的“回答”无需标明时态，也能自然保留现场感。
- source_word: Ἐκεῖνός ἐστιν
  choice: 就是……那个人
  rationale: 该结构用于明确指出某人的身份；“就是……那个人”在汉语问答语境中自然，并保留其强调和指认作用。
- source_word: ᾧ
  choice: 给他的
  rationale: 关系代词为与格，与后面的“递给”构成自然的汉语关系从句；译文不把它误解为受益者。
- source_word: βάψω
  choice: 将要蘸
  rationale: 明确表达将来时，并把 βάπτω 在此处译作食物蘸取的动作，不引入洗礼或礼仪含义。
- source_word: τὸ ψωμίον
  choice: 这块饼／饼
  rationale: ψωμίον 指一小块饼或食物；引语中用“这块饼”使指示对象清楚，后句按汉语习惯简化为“饼”，避免累赘。
- source_word: καὶ δώσω αὐτῷ
  choice: 递给他
  rationale: “递给”符合席间把一块饼交给某人的具体动作；宾语“饼”可由上文自然补足。
- source_word: βάψας οὖν
  choice: 于是，耶稣蘸了饼
  rationale: “于是”承接 οὖν；“蘸了”表示分词动作先于主要动作发生，同时符合现代汉语叙事习惯。
- source_word: δίδωσιν
  choice: 就递给
  rationale: 希腊文为历史现在时；汉语以“就”紧接前一动作，保留叙事的即时推进感。
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: 递给加略人西门的儿子犹大
  rationale: 按希腊词序和最直接的属格关系理解，Ἰσκαριώτου 修饰 Σίμωνος，即“加略人西门”；同时以脚注保留另一种可行分析。
theological_decisions:
- issue: 末尾短语中“加略人”修饰西门还是犹大
  choice: 正文作“加略人西门的儿子犹大”
  alternative: “西门的儿子加略人犹大”
  rationale: Σίμωνος Ἰσκαριώτου 在句法上最直接可理解为“加略人西门的”，但传统称谓及上下文也容许把“加略人”理解为犹大的称号。正文遵循紧邻的语法关系，脚注保留真实歧义，不据神学传统强行消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“递给”比泛泛的“给”更贴合席间动作；在第二分句重复“耶稣”以避免连续代词造成指代不清。脚注标记置于实际存在歧义的末尾人名短语之后。
