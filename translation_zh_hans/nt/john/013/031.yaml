source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: zh_hans
  text: 他出去以后，耶稣就说：“如今，人子得了荣耀，神也在他身上得了荣耀[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神借着他也得了荣耀。”希腊语短语既可理解为神在他身上得荣耀，也可理解为神借着他得荣耀。
    reason: 保留ἐν αὐτῷ可能具有的关系性与工具性两种理解。
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: 他出去以后……就
  rationale: ὅτε引出时间从句，οὖν承接前文并推动叙事。“……以后……就”以自然的现代汉语同时表达先后关系和叙事推进。
- source_word: ἐξῆλθεν
  choice: 出去以后
  rationale: ἐξέρχομαι在此承接上文犹大的离席，保留“出去”的空间含义；“以后”清楚表明此事先于耶稣接下来的话。
- source_word: λέγει
  choice: 说
  rationale: 希腊语使用历史现在时；现代汉语叙事中直接译作“说”自然流畅，无须刻意复制时态形式。
- source_word: Νῦν
  choice: 如今
  rationale: 保留νῦν的时间和话语强调，表明犹大出去后，耶稣所宣告的时刻已经来到。
- source_word: ἐδοξάσθη
  choice: 得了荣耀
  rationale: 以汉语常用的被动意义表达该不定过去时被动语态，同时不把所指局限为十字架、复活或升天中的某一事件。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其与《但以理书》传统的互文关联，也是现代中文圣经语境中清楚而庄重的表达。
- source_word: ὁ θεὸς
  choice: 神
  rationale: θεός在此指神；“神”是现代标准汉语中简洁、庄重且不附加解释的对应词。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直接保留ἐν的关系性或范围性表达及αὐτῷ的代词形式，不将其无提示地限定为工具义；较自然的工具义理解另列脚注。
theological_decisions:
- issue: 耶稣所说“得了荣耀”的范围
  choice: 按原文译为已经发生意义上的“得了荣耀”，不具体限定所指事件
  alternative: 只解释为受难，或只解释为复活、升高
  rationale: 约翰福音可将耶稣的受死、复活与回到父那里作为彼此关联的荣耀进程来表达。本译文保留这种广度和张力。
- issue: ἐν αὐτῷ的含义
  choice: 神“在他里面”得了荣耀
  alternative: 神“借着他”得了荣耀
  rationale: 该介词短语既可作关系性或范围性的理解，也可能带工具意味。正文采用较贴近形式的译法，并以脚注保留另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人子”和“得了荣耀”保留约翰福音的核心术语；句式简洁，并用“以后……就”自然呈现叙事衔接。
