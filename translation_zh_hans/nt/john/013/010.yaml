  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: zh_hans
  text: 耶稣对他说：“洗过澡的人[a]，除了洗脚以外，不需要洗；他全身都是洁净的。你们也是洁净的，但并不都是洁净的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文用了两个不同的“洗”字：λούω指沐浴、洗全身；νίπτω常指洗身体的某一部分，如洗脚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: 洗过澡的人
  rationale: λελουμένος是λούω的完成时分词，表示全身沐浴已经完成、其结果仍然有效；“洗过澡的人”既保留单数泛指，也自然体现这一状态。
- source_word: οὐκ ἔχει χρείαν
  choice: 就不需要再洗了
  rationale: ἔχει χρείαν意为“有需要”；结合洗浴语境补出“再洗”，使现代汉语完整自然，并与下文唯一的例外衔接。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 此处引出前述“不需要”的唯一例外；“除了……以外”准确而自然。
- source_word: τοὺς πόδας νίψασθαι
  choice: 洗脚
  rationale: νίπτω常指洗身体的局部，此处宾语明确为“脚”；汉语“洗脚”无需补出物主代词。
- source_word: καθαρὸς ὅλος
  choice: 全身都是洁净的
  rationale: ὅλος强调完整、全然；此译在洗浴语境中自然，同时保留καθαρός可能具有的象征性含义。
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: 你们也是洁净的
  rationale: 保留复数称呼以及καθαρός的重复，使字面洁净与更深层含义并存。
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: 但不都是
  rationale: πάντες指受话群体中的所有人；“不都是”简洁保留群体内部存在例外的表达。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: λέγει是叙事中的历史现在时；现代汉语通常不以动词形态区分过去时，“说”自然传达叙事动作。
theological_decisions:
- issue: 字面洗涤意象与象征性、属灵洁净之间的关系
  choice: 保留“洗过澡”“洗脚”“洁净”等意象，不在正文中明说其象征意义。
  alternative: 解释性译为“在属灵上洁净”，或把λούω与νίπτω都笼统译作“洗”。
  rationale: 本节刻意让实际洗涤和更深层的洁净含义彼此呼应；保留两个洗涤动词的差别及“洁净”的开放含义，可避免替读者预先限定神学解释。
- issue: 单数阳性分词的泛指功能
  choice: 译为“洗过澡的人”。
  alternative: 译为带明确男性限定的“洗过澡的男人”或“他”。
  rationale: 希腊语分词虽为阳性单数，在格言式陈述中却具有泛指功能；“……的人”既保留单数概念，又不加入原文并未强调的性别限定。
- issue: “不都是”所指的群体内部例外
  choice: 保留含蓄说法“但不都是”。
  alternative: 解释性点明“但你们中有一个不洁净”或直接指出犹大。
  rationale: 原文在本句中没有明说例外者是谁；保留含蓄表达，可维持叙事推进及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“洗过澡”与“洗脚”清楚呈现原文两个动词的区别；“洁净”比单纯的“干净”更能兼顾约翰叙事中字面与象征层面的双重意味，又不把象征意义明说出来。脚注标记[a]置于“洗过澡的人”之后，以提示相关词汇差异。
