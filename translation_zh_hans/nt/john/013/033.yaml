id: JHN.13.33
reference: John 13:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: zh_hans
  text: 孩子们，我再和你们在一起一小会儿。你们会寻找我。正如我曾对犹太人[a]说：‘我要去的地方，你们不能来。’如今我也这样对你们说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在约翰福音中，“犹太人”有时可按语境较具体地指“犹太领袖”或“犹太当权者”。
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: 孩子们
  rationale: 这是带有亲昵意味的复数称呼，表达如父母对孩子般的疼爱。“孩子们”在现代汉语中自然保留家庭性的比喻；不加“小”可避免让人误以为只指年幼者，也不加原文没有明说的“亲爱的”。
- source_word: ἔτι μικρὸν
  choice: 再……一小会儿
  rationale: 该短语表示剩余时间很短。“我再和你们在一起一小会儿”自然表达“还会同在片刻”的时限。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: 我……和你们在一起
  rationale: 直接保留耶稣当下与门徒同在的陈述，不额外译成“留下”。
- source_word: ζητήσετέ με
  choice: 你们会寻找我
  rationale: ζητέω在这里可指寻找、找寻。“寻找”比单纯的“找”略显庄重，同时不预先断定寻找的动机或性质。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 按词面保留较宽的指称。约翰福音中此词有时可随语境特指犹太当权者，但本节本身不足以要求在正文中缩窄范围。
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: 我要去的地方
  rationale: ὑπάγω在此表示离去或前往；“我要去的地方”是自然的现代汉语，也保留目的地尚未明说的张力。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 你们不能来
  rationale: 自然、准确地表达“没有能力/不能够来”，不额外说明这种不能是暂时、属灵、道德或空间上的限制。
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: 如今我也这样对你们说
  rationale: “如今”对应ἄρτι，“也这样”清楚呈现此话先前对犹太人说过、现在又用于门徒的平行关系。
theological_decisions:
- issue: 约翰福音中τοῖς Ἰουδαίοις的指称范围
  choice: 正文译作“犹太人”
  alternative: “犹太领袖”或“犹太当权者”
  rationale: 原文使用一般称谓Ἰουδαῖοι。虽然在约翰福音的某些语境中它可能指较具体的犹太权势群体，但本节是回指先前的话，不宜在正文中无明文依据地缩窄其范围；脚注保留语境上的可能性。
- issue: 门徒“不能来”的性质
  choice: 只译出“不能来”
  alternative: 解释为暂时不能跟随、不能立即进入荣耀，或不能随耶稣赴死
  rationale: 本句只明说门徒不能到耶稣所去之处，并未在此解释原因或持续时间，因此正文保留这一未决张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“孩子们”保留亲昵的家庭性称呼而避免古旧的“小子们”；句式略作汉语化调整，将短时同在表达为“我再和你们在一起一小会儿”。英文咨询层所给脚注标记与脚注内容位置明显错配，因此本稿只在“犹太人”后设置与内容相符的脚注；“你们不能来”本身已自然完整，无需另设仅属措辞替换的脚注。
