  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: zh_hans
  text: 他从席上起来，脱下外衣，拿起一条毛巾，束在自己腰间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται ἐκ τοῦ δείπνου
  choice: 从席间起身
  rationale: ἐγείρεται 是叙事中的历史现在时，中文自然叙事可用“起身”；ἐκ τοῦ δείπνου 指从正在进行的宴席中起身，“从席间”比直译“从晚餐”更自然，也不附加现代用餐时段的含义。
- source_word: τίθησιν τὰ ἱμάτια
  choice: 脱下外衣
  rationale: τίθησιν 在这里表示放下、除去；ἱμάτια 依语境指外层衣服。“脱下外衣”既准确表达动作，也避免让人误以为完全脱去衣服。
- source_word: λαβὼν λέντιον
  choice: 拿了一条毛巾
  rationale: λεντίον 指用于服侍的布巾或毛巾；“毛巾”是现代中文清楚自然的对应词。分词 λαβών 按汉语顺承动作译为“拿了”。
- source_word: διέζωσεν ἑαυτόν
  choice: 束在腰间
  rationale: διαζώννυμι 表示给自己束上、围上；结合前面的毛巾，中文用“束在腰间”自然明确，宾语可由语境承接，无须生硬重复。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文连续动作的简洁节奏；历史现在时不机械复制为中文现在时，因为中文动词本身通常不标时态。“席间”涵盖用餐场景而不限定为现代意义的晚餐。
