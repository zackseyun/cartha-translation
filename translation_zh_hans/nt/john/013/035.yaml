  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: zh_hans
  text: 你们若彼此相爱[b]，众人就会借此[a]知道你们是我的门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借此”也可译为“在这事上”或“凭此”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在彼此之间有爱”，即彼此相爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 因此
  rationale: 此处的介词短语指向彼此相爱这一可辨认的标志，可表达凭据或途径。“因此”在现代汉语中自然地传达“凭这一点”的意思，同时以脚注保留“在这事上／借此”的可能表达。
- source_word: γνώσονται
  choice: 就会知道
  rationale: γινώσκω的将来时在这里表示得知或辨认某一事实。“就会知道”自然且保留较宽的语义；“认出”虽可能，但解释性稍强。
- source_word: πάντες
  choice: 所有人
  rationale: 阳性复数在这里是泛指，并非只指男性。“所有人”准确表达其普遍范围。
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: 你们是我的门徒
  rationale: 与μαθηταί连用的ἐμοί表达归属关系；“我的门徒”是自然且准确的汉语，也保留师徒与跟从关系。
- source_word: ἐὰν
  choice: 若
  rationale: ἐὰν加虚拟语气引出条件。“若”简洁庄重，保留原文的条件形式，不把它改写成时间关系或必然前提。
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: 彼此相爱
  rationale: 原文较直译为“在彼此之间有爱”。“彼此相爱”是自然的现代汉语，清楚表达爱的相互关系；脚注保留原文的表达形式。
theological_decisions:
- issue: ἐὰν所引条件的性质
  choice: 你们若彼此相爱
  alternative: 你们彼此相爱的时候
  rationale: “若”保留希腊文的条件句式。此句把彼此相爱呈现为门徒身份可被识别的标志或凭据，并未说明人借此赚取门徒身份。
- issue: πάντες的泛指范围
  choice: 所有人
  alternative: 众人
  rationale: 原文在语法上虽用阳性复数，语义却是泛指。“所有人”不限定性别，并清楚保留普遍范围。
- issue: 爱与门徒身份之间的关系
  choice: 就会因此知道你们是我的门徒
  alternative: 凭这一点，众人都会认出你们是我的门徒
  rationale: 译文保留原文所说的识别关系：彼此相爱是外界知道其门徒身份的标志。没有进一步断定这种爱是身份的成因，也没有把“知道”缩窄为单纯视觉上的“认出”。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“若……就……”清楚呈现条件与结果；“门徒”保留福音书中固定且重要的师徒、跟从关系。句序略按汉语习惯调整，把条件从句置前，同时完整保留原文各项语义。
