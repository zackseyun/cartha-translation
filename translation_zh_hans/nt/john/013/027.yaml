base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: zh_hans
  text: 那一小块饼过后[a]，撒但就进到他里面。于是，耶稣对他说：“你正在做的，快些做吧[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那一小块食物之后”；这里按上下文指席间蘸过后递出的那一小块饼。
    reason: lexical_alternative
  - marker: b
    text: 或译“赶快做吧”。希腊文“快些”采用比较级形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: 一小块饼
  rationale: 指一小块食物；结合席间语境，具体译为“一小块饼”，既自然清楚，也保留其小块、蘸过后递出的具体意象。
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: 进了他里面
  rationale: 保留“进入”及εἰς所表达的向内进入，不弱化为“控制了他”，也不扩展为原文未明说的附身理论。
- source_word: ὁ Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的专名译法，不在正文中改译为解释性的“敌对者”。
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: 于是耶稣对他说
  rationale: οὖν译为自然的叙事连接词“于是”；希腊文的历史现在时按现代汉语叙事习惯处理，不生硬标示时态。
- source_word: Ὃ ποιεῖς
  choice: 你正在做的
  rationale: 保留现在时所呈现的正在进行或当前着手之事，不解释为“你将要做的”。
- source_word: ποίησον
  choice: 做吧
  rationale: 以简洁的祈使表达再现命令的直接性；句末“吧”使现代汉语自然，但不削弱催促意味。
- source_word: τάχιον
  choice: 快些
  rationale: “快些”自然保留希腊文比较级的形式和语气，比单纯“赶快”更贴近“更快一些”。
theological_decisions:
- issue: 撒但对犹大的行动性质
  choice: 直译为“撒但就进了他里面”
  alternative: “撒但控制了他”或“犹大向撒但屈服”
  rationale: 原文陈述撒但亲自进入他里面；译文既不把它淡化成纯粹心理影响，也不补充原文未说明的控制程度或责任关系。
- issue: 耶稣命令与犹大行动的关系
  choice: “你正在做的，快些做吧”
  alternative: “你要做的，赶快去做”
  rationale: 保留现在时“正在做”的张力，不把耶稣的话解释成对未来行动的许可、差遣或道德认可。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。“那一小块饼之后”刻意贴近原文的省略表达，避免在本节擅自补入“吃了”或“接过”；“进了他里面”保留原文直接而带神学张力的措辞。
