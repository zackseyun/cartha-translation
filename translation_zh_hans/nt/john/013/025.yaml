  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: zh_hans
  text: 他就这样向后一靠，倚在耶稣胸前[a]，问耶稣：“主啊，是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“斜倚在耶稣胸前”。希腊文反映当时人侧卧席间用餐的姿势。
    reason: 说明ἀναπίπτω在用餐场景中的含义及其所反映的席间姿势。
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: 向后一靠
  rationale: 该分词在席间语境中可指斜倚用餐；结合后面的方向性短语，具体描写他向后靠近耶稣的动作。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 直译为“那人”在现代汉语叙事中较生硬；上文所指明确，用“他”自然，也不额外加入原文没有的“门徒”。
- source_word: οὕτως
  choice: 就这样
  rationale: 承接上一节所述的位置和动作方式，同时保留原文明确表达的方式含义。
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: 倚在耶稣胸前
  rationale: στῆθος指胸部；介词短语在此结合向后靠的动作，表达靠向并贴近耶稣胸前的位置。
- source_word: λέγει αὐτῷ
  choice: 问耶稣
  rationale: 后接直接疑问句，因此汉语用“问”最自然；重复“耶稣”可避免连续两个“他”造成指代含混。希腊文历史现在时按自然汉语叙事处理。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος对耶稣既可作尊称、又具有更深基督论意味的开放性；“啊”符合现代汉语直接称呼。
- source_word: τίς ἐστιν;
  choice: 是谁？
  rationale: 希腊文省略具体所指，汉语“是谁”同样自然，并保留简洁的询问形式。
theological_decisions:
- issue: 对耶稣的直接称呼 κύριος
  choice: 主
  alternative: 先生；老师
  rationale: “主”既符合《约翰福音》的惯常称呼，也不把此处仅仅限定为一般礼貌称谓，从而保留原文可能具有的神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“向后一靠，倚在”兼顾动作过程和席间姿势；脚注补充古代用餐背景，避免正文显得生硬。
