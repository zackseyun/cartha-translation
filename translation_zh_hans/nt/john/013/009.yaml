  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: zh_hans
  text: 西门·彼得对他说：“主啊[a]，不只洗我的脚，连我的手和头也要洗！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可译作“先生”或“主人”。希腊文：Kyrios（库里奥斯）。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事中直接译作“说”既自然，也不必刻意标示时态。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 按原文保留代词，不将所指明说为耶稣；上下文足以确定对象。
- source_word: Σίμων Πέτρος
  choice: 西门·彼得
  rationale: 采用现代中文圣经人名的通行音译，并以间隔号连接双名。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε是直接称呼；“主啊”保留尊称及约翰福音中的神学意蕴，也符合自然汉语呼语。
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: 不只……连……也……
  rationale: 这一结构表示范围的对比扩展；该译法自然地传达“不仅前项，还包括后项”的强调。
- source_word: τοὺς πόδας μου ... τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: 我的脚，连手和头
  rationale: “我的”在并列结构中统摄脚、手和头，中文无需逐项重复。
- source_word: 省略的谓语（由上下文 νίψῃς 补足）
  choice: 洗……也要洗
  rationale: 本句希腊文是承接上文的省略表达。中文若完全照搬会显得突兀，因此从紧邻上下文补出“洗”，明确彼得要求耶稣洗脚、手和头。
theological_decisions:
- issue: κύριος作为彼得对耶稣的称呼
  choice: 主
  alternative: 老师／主人
  rationale: “主”最能保留该称呼在当前语境中的尊敬意味及约翰叙事中可能承载的更深意蕴，同时不强行限定彼得当时理解的程度。
- issue: 是否把彼得的话理解为全身礼仪性洁净
  choice: 只译出洗脚、手和头的字面请求
  alternative: 释译为“给我全身洗净”
  rationale: 原文列举具体身体部位，并未直接说明某种礼仪或教义含义；译文保留字面表达及其与下文之间的张力。
translation_notes:
  register: 采用现代、庄重而口语自然的对话体。“连手和头也要洗”补足原文因承接上文而省略的“洗”，避免中文误解为仅列举身体部位；感叹号体现彼得急切而强烈的回应。脚注标记置于完整引语之后。
