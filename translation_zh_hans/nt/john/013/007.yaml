  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: zh_hans
  text: 耶稣回答他，说：“我所做的，你现在还不知道；这些事以后[b]，你就会明白[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不知道”和“明白”所对应的希腊文是两个不同的动词；后一个也可译作“知道”或“认识”。
    reason: lexical_alternative
  - marker: b
    text: “这些事以后”可能指本段随后发生的事，也可能更广泛地指后来使人明白耶稣这一行动的事件。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: 回答他，说
  rationale: 保留原文“回答”与“说”两个叙事动词，同时采用现代汉语自然的引语结构。
- source_word: Ὃ ἐγὼ ποιῶ
  choice: 我所做的
  rationale: 指耶稣当下正在进行的行动；“我所做的”在上下文中自然，也保留关系从句的结构。
- source_word: οὐκ οἶδας ἄρτι
  choice: 你现在还不知道
  rationale: οἶδα首先按“知道”译出，ἄρτι译为“现在”；加入“还”自然地衔接后面的未来转折，但不改变其时间对比。
- source_word: γνώσῃ
  choice: 你就会明白
  rationale: γινώσκω在这里指后来认识并领会这行动的意义；译为“明白”既符合语境，也显出它与前面οἶδα所用词语不同。
- source_word: δὲ
  choice: ；……就……
  rationale: 用分号和未来结果结构表现现在不知道与后来明白之间的转折；汉语不必机械加入“但是”。
- source_word: μετὰ ταῦτα
  choice: 这些事以后
  rationale: 贴近原文复数指示语，避免直接简化为“后来”，从而保留它可能指本段随后之事或更后事件的开放性。
theological_decisions:
- issue: 耶稣所说将来明白的具体时间范围
  choice: 译作“这些事以后”，不限定所指事件
  alternative: 明确译成洗脚结束以后、复活以后，或圣灵来到以后
  rationale: 原文没有明确限定时间节点；保留概括表达，可涵盖本段随后的解释，也可能指向十字架、复活或此后更完整的认识。
- issue: οἶδα与γινώσκω之间的词汇差异
  choice: 分别译为“不知道”和“会明白”
  alternative: 两者都译为“知道”，或都译为“明白”
  rationale: 分别用词既忠实呈现原文用了两个不同动词，也传达从当下不知到后来领会的推进，而不把这种差异绝对化为特定神学区分。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“回答他，说”保留约翰叙事中两个并列言说动词；正文不擅自确定“这些事以后”的神学时间点。
