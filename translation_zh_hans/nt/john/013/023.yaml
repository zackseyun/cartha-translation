  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: zh_hans
  text: 耶稣的门徒中有一个，是耶稣所爱的，正斜倚在耶稣怀中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在耶稣的怀中”。古人用餐时常斜倚而坐；这里描写这位门徒紧挨着耶稣的席位。
    reason: 说明 κόλπος 在本节古代用餐语境中的空间含义，同时保留正文的字面意象。
lexical_decisions:
- source_word: ἀνακείμενος
  choice: 正侧身躺着
  rationale: 该词描写古代宴席上斜倚进餐的姿势；“侧身躺着”既交代历史场景，也便于现代读者理解。
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 有一个门徒
  rationale: 自然表达希腊文的部分结构，即耶稣众门徒中的一位；上下文已明确这些是他的门徒。
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: 在耶稣怀中
  rationale: 较形式对应地保留 κόλπος 的身体意象及约翰著作中的呼应，同时用脚注说明这是古代席间相邻斜倚的位置，避免按现代姿态误解。
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: 就是耶稣所爱的
  rationale: 直接保留关系从句和“爱”的基本语义，不额外判定该门徒的身份。
theological_decisions:
- issue: 耶稣所爱门徒与耶稣相对位置的表达
  choice: 在正文中译作“在耶稣怀中”，并以脚注解释宴席姿势
  alternative: 紧挨着耶稣；在耶稣身旁
  rationale: 原文的 κόλπος 具有明确的胸怀意象，也与约翰福音1:18的用语形成潜在呼应；正文保留这一意象，但脚注明确其首要场景意义是席间位置，不将其单纯解释为神秘联合。
- issue: “耶稣所爱的”门徒的身份
  choice: 保留未具名的关系从句
  alternative: 认定并写明为约翰
  rationale: 本节原文没有给出姓名，译文不应替原文解决身份问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侧身躺着”交代古代席间姿势；“怀中”保留原文意象，并借脚注防止现代读者误解。
