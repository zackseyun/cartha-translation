  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: zh_hans
  text: 有些人以为，因为犹大管着钱匣[a]，耶稣是在吩咐他说：“去买我们为节期[b]所需要的东西”，或是要他给穷人一些东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“钱袋”。原文所用的词指存放他们共同款项的容器。
    reason: lexical_alternative
  - marker: b
    text: 这里的“节期”按本段上下文指逾越节。
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: 有些人
  rationale: 指在场者中的一部分人；译为“有些人”简洁自然，并保留不定复数的意味。
- source_word: ἐδόκουν
  choice: 以为
  rationale: 表示他们当时的判断或推测；“以为”符合叙事语境，也不把这种判断说成确定事实。
- source_word: ἐπεὶ
  choice: 既然
  rationale: 引出他们作出推测的根据，即犹大管着钱匣；“既然”在此比机械重复“因为”更符合现代汉语句法。
- source_word: τὸ γλωσσόκομον
  choice: 钱匣
  rationale: 指存放这个群体公款的容器。“钱匣”贴近词义，又不把容器过度具体化为某一种袋子或箱柜。
- source_word: εἶχεν
  choice: 管着
  rationale: 原词基本义为“有、持有”，上下文则表明犹大负责保管钱匣；“管着”自然表达这种受托持有的关系。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣是在对他说
  rationale: 将希腊文叙事中的历史现在时自然转为汉语过去叙事语境，同时保留门徒对耶稣话意的推断。
- source_word: Ἀγόρασον
  choice: 去买
  rationale: 直接呈现简单明确的命令；“去买”符合现代汉语口吻。
- source_word: ὧν χρείαν ἔχομεν
  choice: 我们……所需要的东西
  rationale: 自然表达关系结构与“有需要”的含义，不采用生硬的逐词对应。
- source_word: εἰς τὴν ἑορτήν
  choice: 过节
  rationale: ἑορτή指宗教节期或节庆；本段背景是逾越节，但本节没有再次明说“逾越节”，因此正文保留较宽的“节”。
- source_word: τοῖς πτωχοῖς
  choice: 给穷人
  rationale: 将形容词名词化结构自然译为“穷人”，并与“给”直接搭配。
- source_word: ἵνα τι δῷ
  choice: 要他给……一些东西
  rationale: 表达门徒所理解的另一种意图。“一些东西”保留τι的不确定性，不擅自限定为钱。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“有些人以为……耶稣是在……”清楚呈现人物的推测；两个并列理解分别译作直接命令和间接意图。脚注标记均放在其所解释的词语之后。
