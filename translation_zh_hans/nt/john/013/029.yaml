  naturalness: 原句的“有些人以为，犹大既然……，耶稣是在对他说……”可理解，但因果关系嵌入“以为”的内容时，用“因为”并调整语序更顺畅。将“耶稣是在对他说”改为“耶稣是在吩咐他”也更贴合后面的命令内容和现代叙事表达。
