  to: 有些人以为，因为犹大管着钱匣[a]，耶稣是在吩咐他说：“去买我们为节期[b]所需要的东西”，或是要他给穷人一些东西。
  rationale: 修订只改善句法和“为节期”的语义对应，未改变众人所作的两种推测，也未在正文中将节期明确化为逾越节。脚注标记仍分别紧随“钱匣”和“节期”，与注释对象一致。
