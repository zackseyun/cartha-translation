  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: zh_hans
  text: 彼得对他说：“你绝不可洗我的脚，永远不可！”耶稣回答他说：“我若不洗你，你就与我无分。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  choice: 你绝不能……永远不能
  rationale: οὐ μή与不定过去时虚拟式构成强烈否定，εἰς τὸν αἰῶνα进一步加强这种坚决拒绝。中文用前后呼应的“绝不能……永远不能”自然传达其强调语气。
- source_word: μου τοὺς πόδας
  choice: 我的脚
  rationale: 直接保留希腊文明确的所有关系和复数身体部位；现代汉语通常以“脚”统摄双脚，无须生硬地译作“我的双脚”。
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: 耶稣回答他说
  rationale: 忠实保留叙事中的回应动词及间接宾语，语言庄重而清楚。
- source_word: Ἐὰν μὴ νίψω σε
  choice: 我若不洗你
  rationale: 保留条件结构及明确的第一人称主语；“洗你”也保留从洗脚转向整个人的宾语变化，不将其窄化为“洗你的脚”。
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: 你就与我无分
  rationale: μέρος可指份、分或参与关系；“与我无分”简洁保留关联和归属层面的开放性，同时μετά仍译为“与……”，不改写成约翰著作中另一种“在我里面”的表达。
theological_decisions:
- issue: 耶稣所说“与我有分”的具体含义
  choice: 译作“与我无分”，保留与耶稣同有一分、参与或归属的广义含义
  alternative: 明确解释为得救、圣礼洁净，或单指谦卑服事
  rationale: 原文断言接受耶稣的洗是“与他有分”的必要条件，却没有在本节界定其确切神学机制；译文不替文本消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。彼得的话以重复强化的否定表现其坚决拒绝；耶稣的话保持简洁郑重。“无分”略带经文体色彩，但在现代汉语中仍清楚自然，并能较好承载μέρος的语义张力。
