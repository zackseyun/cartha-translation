    issue: 彼得的话中“绝不能……，永远不能”的措辞略显重复，且“不能”可被理解为能力上的不能。
    rationale: 希腊文 οὐ μή 与 εἰς τὸν αἰῶνα 表达彼得坚决拒绝耶稣将来为他洗脚。中文“绝不可……，永远不可”较直接地表达拒绝／不容许，且保留强化。
  - severity: low
    issue: 脚注的替代译文“不能与我同有一分”不自然。
    rationale: “同有一分”不是现代汉语中表达 relational participation 的惯用说法；正文“与我无分”已忠实而简洁，删除该脚注不会损失原文的必要歧义。
