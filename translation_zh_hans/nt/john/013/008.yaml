  verdict: revise
  source_fidelity: 译文准确保留了彼得强烈、面向将来的拒绝，以及耶稣所设的条件和“与我有分”的开放含义。惟“你绝不能……，永远不能”在中文中略显重复且“不能”容易偏向能力不足；改为“你绝不可洗我的脚，永远不可！”更明确表达坚决拒绝与持续性否定。
  naturalness: “彼得对他说”“耶稣回答他说”“我若不洗你，你就与我无分”均庄重、清楚且符合现代经文汉语。“绝不可……，永远不可”虽带适度庄重色彩，仍自然地传达原文双重强化。
  terminology: “洗我的脚”准确；“洗你”恰当保留宾语从脚转为彼得本人；“与我无分”可自然承载 μέρος μετ’ ἐμοῦ 所指的份、分或参与关系，而不预设具体教义解释。原脚注的“不能与我同有一分”不够自然，也未构成有益的词义替代，宜删除。
  issues:
