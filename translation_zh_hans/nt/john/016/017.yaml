  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: zh_hans
  text: 于是，他的门徒中有几个人彼此说：“他对我们说的这话是什么意思呢？‘过不多时，你们就看不见我；再过不多时，你们就会看见我。’还有：‘因为我要到父那里去。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还有：‘我要到父那里去。’”希腊语连接词可表示原因（“因为”），也可用来引出所说的内容。
    reason: 保留ὅτι在此处可能具有因果或引语内容两种句法理解。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节耶稣的话，兼具叙事推进和由此引发反应的意味；“于是”符合现代汉语叙事习惯。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 门徒中有几个人
  rationale: 保留ἐκ的部分含义，明确说话者只是门徒中的一部分，而不是全体。
- source_word: πρὸς ἀλλήλους
  choice: 彼此说
  rationale: 自然表达相互交谈的意思。
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: 他对我们说的这话是什么意思呢
  rationale: 希腊语字面结构近于“他对我们说的这个是什么”；汉语用“是什么意思”自然表达门徒对话语含义的困惑。
- source_word: Μικρὸν
  choice: 过不多时
  rationale: 此处为时间用法；“过不多时”既清楚又庄重，并适合前后重复的句式。
- source_word: θεωρεῖτέ με
  choice: 看不见我
  rationale: 表达视觉或感知意义；与后面的“看见我”形成清楚的修辞对应，同时不额外解释所指事件。
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: 再过不多时，你们还要看见我
  rationale: “再……还要……”自然保留πάλιν及未来式所表达的再次看见。
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: 因为我要到父那里去
  rationale: 将ὅτι按因果连词处理，与上一节的表述相应；但其引出所说内容的可能性保留在脚注中。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 原文为“那父/父”，未出现“我的”；译作“父”保留约翰语境中的称谓，也避免增添所有格。
theological_decisions:
- issue: 耶稣所说离去与再被看见具体指什么
  choice: 正文不指明具体事件，保留门徒的困惑
  alternative: 明确解释为死亡与复活、复活后的显现、升天，或借圣灵而有的临在
  rationale: 本节只呈现门徒不明白耶稣的话，本身并未解释其确切所指；翻译不应提前消除这种张力。
- issue: ὅτι在末句中的功能
  choice: 正文译为因果性的“因为”
  alternative: 译为引出所说内容的“他说他要到父那里去”
  rationale: ὅτι通常可表原因，并与上一节“因为我要到父那里去”相呼应；但句法上也可能引出门徒所引用的另一句话，因此以脚注保存歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“过不多时”保留原文两次μικρόν的重复；引号层次清楚呈现门徒引用耶稣的话。脚注标记置于相关引语之后。
