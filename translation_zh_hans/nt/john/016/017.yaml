  - severity: low
    issue: “还要看见我”语义语气不够准确
    rationale: “还要”在现代汉语中可能暗示义务或持续；ὄψεσθέ为单纯将来意义，宜译“就会看见我”。
  - severity: low
    issue: 脚注的替代译文层级不清
    rationale: 脚注写作“又说：‘我要……’”会重复正文的引述层次；应直接说明ὅτι也可引出所引的话，并给出不含“因为”的对应译法。
