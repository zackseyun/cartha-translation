revisions:
- from: 于是，门徒中有几个人彼此说：“他对我们说的这话是什么意思呢？他说：‘过不多时，你们就看不见我；再过不多时，你们还要看见我。’又说：‘因为我要到父那里去。’[a]”
  to: 于是，他的门徒中有几个人彼此说：“他对我们说的这话是什么意思呢？‘过不多时，你们就看不见我；再过不多时，你们就会看见我。’还有：‘因为我要到父那里去。’”[a]
  rationale: 修订使末句作为门徒所困惑的另一项引述而非明确新增的叙述动作，改善现代汉语语序和将来语气，并使脚注的替代译法与正文的引述层级一致。未改变离去与再见的指向，也未增添神学解释。
