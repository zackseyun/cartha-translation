  source_fidelity: 基本忠实地保留了部分门徒彼此交谈、两次“过不多时”以及末句ὅτι的因果理解，并以脚注保留另一句法可能。不过，原文末尾的καί连同引号所列的是门徒困惑的另一项引述；正文用“又说”将其明确处理为耶稣再次说话，略增原文未明说的叙述结构。
  naturalness: “门徒中有几个人彼此说”可以理解，但“他的门徒中有几个人彼此说”更符合现代汉语。“再过不多时，你们还要看见我”的“还要”容易带出“仍然需要／还得”的语气；改为“就会”更自然且准确表达将来时。
  terminology: “父”忠实保留了τὸν πατέρα而未增译“我的”；“到父那里去”在约翰福音语境中是可接受的庄重表达。保留“看不见／看见”的重复，恰当地不解释其所指事件。
