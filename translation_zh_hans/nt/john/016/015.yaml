  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: zh_hans
  text: 父所有的一切都是我的；所以我曾说，他从我所有的一切中领受，并要向你们宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ὅσα
  choice: 所有的一切
  rationale: 保留原文涵盖无遗的总括意味，同时符合现代汉语表达。
- source_word: ἔχει ὁ πατὴρ
  choice: 父所有的
  rationale: 以“所有”自然表达 ἔχω 的拥有义；“父”在约翰语境中指上帝。
- source_word: ἐμά ἐστιν
  choice: 都是我的
  rationale: 直接保留原文强烈的所属断言，不增添原文没有的神学术语。
- source_word: διὰ τοῦτο εἶπον
  choice: 因此我说
  rationale: 简洁表达原文的因果推论关系，并以过去时语境自然呈现 εἶπον。
- source_word: ἐκ τοῦ ἐμοῦ
  choice: 从我所有的
  rationale: 原文是省略式表达；此译补足汉语所需结构，同时不把所指内容限定为某一种事物。
- source_word: λαμβάνει
  choice: 领受
  rationale: λαμβάνω 可表示“拿取”或“领受”；此处“领受”能自然表达从某一来源取得，脚注保留另一可能。
- source_word: ἀναγγελεῖ
  choice: 要……宣明
  rationale: “要”保留将来意味；“宣明”体现 ἀναγγέλλω 在本段中传达、揭示的庄重语气。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 准确表达复数第二人称的间接受词，所指为耶稣正在对话的门徒。
theological_decisions:
- issue: 父所有的一切与子的关系
  choice: 父所有的一切都是我的
  alternative: 父所拥有的一切都属于我
  rationale: 保留经文本身对父与子之间共有所属的强烈陈述，不借后期教义术语进一步界定。
- issue: 圣灵从子所有的领受
  choice: 他从我所有的领受
  alternative: 他从我所有的取用
  rationale: 原文 λαμβάνει 兼有“拿取”和“领受”的语义可能；正文采用较自然且体现来源关系的“领受”，脚注保留“取用”，避免消除原文的语义张力。
- issue: λαμβάνει 的时态表达
  choice: 他从我所有的领受
  alternative: 他要从我所有的领受
  rationale: 原文 λαμβάνει 为现在时，而 ἀναγγελεῖ 为将来时；正文保留这种时态区别，不受英语咨询文本将两者并列理解的影响。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量贴近希腊文的因果结构，并保留 λαμβάνει（现在时）与 ἀναγγελεῖ（将来时）的区别。
