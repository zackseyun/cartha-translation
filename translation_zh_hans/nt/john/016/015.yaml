revisions:
- from: 父所有的一切都是我的。因此我说，他从我所有的领受[a]，并要向你们宣明。
  to: 父所有的一切都是我的；所以我曾说，他从我所有的一切中领受，并要向你们宣告。
  rationale: 修订只处理汉语句法、过去时提示及现代语体。用“从我所有的一切中领受”恢复希腊文省略而由上下文明确的受事，仍将其表述为来源关系；没有添加关于父、子或圣灵关系的教义性解释。脚注继续保留λαμβάνει的词汇歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:08Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了父所拥有的一切属于子、圣灵从属于子之事物取得并向门徒传达的基本意义，也恰当地保留了λαμβάνει（现在时）与ἀναγγελεῖ（将来时）的时态差别。不过“从我所有的领受”在汉语中缺少受事，句法不完整；补出原文省略而语境明确的“一切”，可自然表达ἐκ τοῦ ἐμοῦ的来源意义，且不额外限定其内容。
  naturalness: “父所有的一切都是我的”庄重、清楚，符合约翰福音中“父”的称谓。原句“他从我所有的领受”不合现代汉语的常规搭配；“他从我所有的一切中领受”则完整自然。“我曾说”比“我说”更明确对应εἶπον的过去时；“宣告”较“宣明”更为现代而仍保有庄重的启示性语体。
  terminology: “父”“我的”“领受”“宣告”均适合现代标准汉语的经文语域。“父”在本书上下文中是上帝的称谓，无须添加“天”或其他解释性成分。“领受”可保留其接受、取得的含义；脚注宜将“取用”改为更直接的“拿取”，以反映λαμβάνω的另一可行语义，而不使“取用”引入工具性用途的联想。
  issues:
  - severity: medium
    issue: “他从我所有的领受”句法不完整。
    rationale: “领受”在此需要明示所领受的内容；希腊文ἐκ τοῦ ἐμοῦ虽为可省略的“从属于我的（事物）”，汉语不能自然地仅以“我所有的”作“领受”的来源补语。补作“从我所有的一切中领受”既保持“从……中”的来源关系，也仅恢复由前半句提供的概括性所指。
  - severity: low
    issue: “因此我说”未清晰体现εἶπον的过去时。
    rationale: 汉语不强制标示时态，但“我曾说”在此更自然地指回前文耶稣已经说过的话，同时保持因果连接。
  - severity: low
    issue: “宣明”略显生硬、偏古雅。
    rationale: “宣告”在现代庄重汉语中更自然，并能表达ἀναγγελεῖ向门徒公开传达、告知的意思。
  revised_text: 父所有的一切都是我的；所以我曾说，他从我所有的一切中领受，并要向你们宣告。
  revised_footnotes:
  - marker: a
    text: “领受”也可译为“拿取”。
    reason: λαμβάνει可表示“领受”或“拿取”；正文采用“领受”以自然表达从子所有的一切中取得，脚注保留另一词汇可能。
  revision_rationale: 修订只处理汉语句法、过去时提示及现代语体。用“从我所有的一切中领受”恢复希腊文省略而由上下文明确的受事，仍将其表述为来源关系；没有添加关于父、子或圣灵关系的教义性解释。脚注继续保留λαμβάνει的词汇歧义。
