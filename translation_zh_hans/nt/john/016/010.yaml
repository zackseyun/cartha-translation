  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: zh_hans
  text: 至于义[a]，是因为我到父那里去，而你们不再看见我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。原文这个词可指“义”或“正义”；这里正文译作“义”，以保留较广的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: 至于
  rationale: 在第9—11节连续列举的结构中，“至于”自然地保留了各分句之间的对应关系。
- source_word: δικαιοσύνης
  choice: 义
  rationale: “义”是现代中文圣经语体中对 δικαιοσύνη 简洁而涵盖面较广的表达，可指合乎正道、正义或被显明为正；此处不在正文中限定为某一种解释。
- source_word: δέ
  choice: （融入“至于”结构）
  rationale: δέ 在这里推进列举，而非表达强烈转折；中文用“至于”承接即可，无须另译“但是”。
- source_word: ὅτι
  choice: 是因为
  rationale: 这里引出所说“关于义”的原因，“是因为”明确保留因果关系。
- source_word: πρὸς τὸν πατέρα
  choice: 到父那里去
  rationale: πρός 与表示移动的 ὑπάγω 连用，表示去向；原文为“父”而非“我的父”，故不增添物主成分。
- source_word: ὑπάγω
  choice: 我要……去
  rationale: 现在时在语境中指向将要发生的离去；“我要……去”在现代汉语中自然，也保留行动的临近感。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达从此以后停止发生的意思。
- source_word: θεωρεῖτέ
  choice: 看见
  rationale: 此处指门徒不再目睹耶稣；“看见”比“观看”更符合现代汉语语境，又不过度强化观察的意味。
theological_decisions:
- issue: δικαιοσύνη 在此处的神学含义
  choice: 正文译作“义”，脚注保留“正义”的可能
  alternative: 正义
  rationale: “义”既能承载道德正当、正直以及得到证实等意味，也不把经文完全限定为司法性的“正义”。耶稣到父那里去可能暗示他的正当性得到显明，但译文不把这一解释直接加入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于……是因为……”保留上下文列举和解释的结构；“父”按原文保留关系称谓，不增译“我的”。
