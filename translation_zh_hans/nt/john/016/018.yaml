base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: zh_hans
  text: 于是，他们一再问道：“他说的‘一会儿’是什么意思？我们不知道他在说什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 不断地问
  rationale: 未完成时表示持续或反复发生的言语行为；其后内容是疑问句，因此用“问”比机械重复“说”更符合现代汉语，同时“不停地”保留其持续体意义。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文门徒的困惑并推进叙事；“于是”自然体现这里的语篇衔接。
- source_word: Τί ἐστιν τοῦτο ὃ λέγει μικρόν
  choice: 他说‘不久’，这是什么意思？
  rationale: 保留“小久／不久”这一令门徒困惑的原话，并以自然汉语表达“这是什么”的求解意味，不额外解释所指时间。
- source_word: μικρόν
  choice: 不久
  rationale: 此处为表示短暂时间的椭圆用法；“不久”简洁自然，并能与上下文中的重复措辞保持一致。
- source_word: οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: 直接表达否定的认知状态，语体庄重而自然。
- source_word: τί λαλεῖ
  choice: 他在说什么
  rationale: 直接对应其言说内容，保留门徒的不理解；不译成“他是什么意思”，以免把原文的表达进一步解释化。
