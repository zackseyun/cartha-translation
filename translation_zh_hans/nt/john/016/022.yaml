  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: zh_hans
  text: 所以，你们现在也有忧愁；但我会再见到你们[a]，你们的心会喜乐，也没有人能从你们那里夺走你们的喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也有人按重逢的含义译作“你们会再见到我”。希腊文直译是“我会再见到你们”，可能强调耶稣主动回到门徒那里。
    reason: 交代常见意译，同时说明原文的明确语法和可能的强调重点。
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接上一节妇人生产的比喻，引出对门徒处境的应用；“所以”自然表达推论关系。
- source_word: νῦν μὲν λύπην ἔχετε
  choice: 你们现在也有忧愁
  rationale: λύπη在此指忧伤、悲痛；“忧愁”符合现代汉语，也与下文“喜乐”形成鲜明对照。μέν不机械译出，其对比作用由后面的“但”体现。
- source_word: πάλιν δὲ
  choice: 但……再
  rationale: δέ表达与当前忧愁的转折，πάλιν表示再次相见；拆开表达更符合汉语语序。
- source_word: ὄψομαι ὑμᾶς
  choice: 我要再见到你们
  rationale: 希腊文明确以耶稣为第一人称主语、门徒为宾语。保留这一结构，不与16:16等处的措辞趋同，也保留耶稣主动与门徒重逢的意味。
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: 你们的心就会喜乐
  rationale: “心”在希腊文中为单数，指门徒内在生命和情感的整体；“喜乐”保留χαίρω的动态意味，并与下文χαρά形成词语呼应。
- source_word: τὴν χαρὰν ὑμῶν
  choice: 你们的喜乐
  rationale: 直接保留所有格结构，并维持与前面“喜乐”的词根呼应。
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: 也没有人能从你们那里夺走
  rationale: αἴρω在此有拿走、夺去之意。“能……夺走”自然表达这种喜乐不受任何人支配的确定性；全句的未来语境使汉语无需另加“将”。
theological_decisions:
- issue: 未来重逢的主语及其强调
  choice: 我要再见到你们
  alternative: 你们会再见到我
  rationale: 原文语法明确是第一人称主语“我”看见第二人称宾语“你们”。正文据此直译，以免受邻近经文或翻译传统影响；脚注交代按重逢这一相互事件所作的常见意译。
- issue: 无人夺走喜乐的时态与性质
  choice: 没有人能……夺走
  alternative: 没有人会……夺走
  rationale: 希腊文使用现在时αἴρει，但处于未来重逢的语境中，也可表达概括性的确定事实。汉语用“能”既保持恒常、确定的意味，也自然适用于将来的处境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“忧愁—喜乐”保持原文对照；“你们的心”保留原文单数集合性表达。句子用分号和逗号呈现由当前忧愁转向未来喜乐的推进。
