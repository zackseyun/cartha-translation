source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: zh_hans
  text: 耶稣知道他们想要问他，就对他们说：“你们彼此讨论这件事，是因为我说过[a]：‘再过片刻，你们就不再看见我；再过片刻，你们还要看见我’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是因为我说过”也可理解为“你们是在彼此讨论我所说的这句话吗”。原文中的连接词既可说明原因，也可引出讨论的内容。此外，原文两处“看见”使用不同的动词：前一个可含“观看、看得到”之意，后一个是通常的“看见”。
    reason: 保留ὅτι的句法歧义，并说明θεωρέω与ὁράω的词汇差异。
lexical_decisions:
- source_word: ἔγνω
  choice: 知道
  rationale: 此处表示耶稣察知门徒想要发问的意图；“知道”自然直接。
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: 他们想要问他
  rationale: 保留持续意愿和人际询问的语气，不将其强化为质问。
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: 你们彼此询问
  rationale: ζητέω在这里指门徒彼此探询、试图弄明白耶稣的话；此译兼顾原词的探求意味和现代汉语自然度。
- source_word: ὅτι εἶπον
  choice: 是因为我说
  rationale: ὅτι既可表示原因，也可引出所谈内容；正文采用自然的原因读法，歧义在脚注中保留。
- source_word: Μικρὸν
  choice: 再过片刻
  rationale: 中性形容词在此作时间用，表示短暂间隔；在两个平行分句中重复，以保留原文结构。
- source_word: οὐ θεωρεῖτέ με
  choice: 你们就看不见我
  rationale: 时间语境使现在时具有临近将来的意义；“看不见”不额外加入“再也/不再”的终止含义。
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: 再过片刻，你们还要看见我
  rationale: “还要”自然表达πάλιν的再次之意，并保留ὄψεσθε的将来意义。
theological_decisions:
- issue: θεωρέω与ὁράω在两个平行分句中的差异
  choice: 正文都译作“看见”
  alternative: 前者译作“观看/看得到”，后者译作“看见”
  rationale: 原文确实使用两个不同动词，但上下文重点是暂时看不见与再次看见。统一译法可保留平行关系，词汇差异则由脚注说明，避免人为赋予不同种类之“看见”的神学含义。
- issue: ὅτι的句法功能
  choice: 正文译作原因：“是因为我说”
  alternative: 内容读法：“你们彼此询问我所说的这句话吗”
  rationale: 两种分析在希腊文中都成立。正文选用流畅的原因读法，同时以脚注明示内容读法，不消除原文歧义。
- issue: 耶稣话语的语气
  choice: 译为问句
  alternative: 译为陈述式揭示：“你们正在彼此询问……”
  rationale: 标点与语境支持一个揭示门徒私下讨论的探问；保留问句可传达其直接、探询的语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“再过片刻”比“等不多时”更符合当代用语；问句结构力求清楚，同时避免加入原文没有的教派性解释。
