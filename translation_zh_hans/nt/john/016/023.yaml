  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: zh_hans
  text: 到那日，你们什么也不会问我了[a]。我实实在在地告诉你们：你们无论向父求什么，他必奉我的名赐给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节前后用了两个不同的希腊语动词：这里的ἐρωτάω可指“询问”，后面的αἰτέω则侧重“请求、祈求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到那日
  rationale: 采用自然的现代汉语时间表达，同时保留“那日”在约翰福音中的指向性和末世意味。
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: 你们什么也不会问我了
  rationale: 明确保留“我”这一宾语和完全否定；句末“了”自然表达届时情形的转变，但不把动词过度限定为“质问”或“请教”。
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: “实实在在”以现代而庄重的方式体现原文重复所带出的郑重强调，并符合耶稣在约翰福音中的惯用宣告句式。
- source_word: ἄν τι αἰτήσητε
  choice: 无论……求什么
  rationale: 自然表达带ἄν的不定关系范围，避免把它收窄为单一条件句。
- source_word: τὸν πατέρα
  choice: 向父
  rationale: 原文仅作“父”，没有“我的”；“向父求”准确表达请求的对象。
- source_word: δώσει ὑμῖν
  choice: 他都会……赐给你们
  rationale: “赐给”适合父作为施予者的语境；“都”承接前面的“无论……什么”，使汉语句法完整而不另加请求内容。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 保留约翰福音中重要的“在我的名里／奉我的名”表达；“奉我的名”是自然、庄重且不过度释义的中文。
theological_decisions:
- issue: ἐρωτάω与αἰτέω两种“问／求”动词的区别
  choice: 前者译为“问我”，后者译为“向父求”
  alternative: 两处都译为“求”，或把前者译为“询问／请教”
  rationale: 中文可以自然地区分询问耶稣与向父祈求，既体现词义差异，又不把前者过度解释为某一种具体提问。
- issue: “奉我的名”修饰“赐给”还是“求”
  choice: 依所给SBLGNT正文的词序，将其译为“他都会奉我的名赐给你们”
  alternative: “你们奉我的名向父求什么，他都会赐给你们”
  rationale: 所给正文把ἐν τῷ ὀνόματί μου置于δώσει ὑμῖν之后，因此正文保留它与“赐给”连接的可能性，不因熟悉的祷告措辞而静默改接到“求”。异文词序则在脚注中说明。
- issue: 奉耶稣之名祈求的应许范围
  choice: 直接翻译应许，不在正文中添加限制条件
  alternative: 增译为“合乎耶稣旨意的，无论求什么”
  rationale: 本节没有明说这类限定；应由更广的约翰语境参与解释，而不应由译文预先消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实实在在地告诉你们”保留约翰福音宣告语的辨识度；“问”与“求”在正文中自然呈现两个希腊语动词的差别。正文按所给SBLGNT词序处理“奉我的名”，并以脚注保留异文所支持的另一种连接方式。
