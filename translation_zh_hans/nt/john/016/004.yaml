id: JHN.16.4
reference: John 16:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: zh_hans
  text: 然而，我已经把这些事告诉你们，是要叫你们当他们的时刻来到时，想起他们，也想起我曾告诉过你们。至于这些事，我起初没有告诉你们，因为我和你们在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λελάληκα
  choice: 我已经……告诉你们
  rationale: 完成时表示先前说出的警告在将来仍有现实意义；“已经”体现其持续关联，“告诉”符合现代汉语表达。
- source_word: ταῦτα
  choice: 这些事
  rationale: 复数指示词回指耶稣刚才所说的警告；“这些事”自然、明确，也不把所指范围缩窄为单纯的言辞。
- source_word: ἵνα
  choice: 为要使
  rationale: 保留目的含义，同时保持庄重而易懂的现代汉语语体。
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: 在他们的时候来到时
  rationale: ὅταν加虚拟式指向未来发生之时；ὥρα可指特定或预定的时刻。“他们的时候”保留属格αὐτῶν的歧义，不擅自判定它具体指人、逼迫者或所预告的事件。
- source_word: μνημονεύητε αὐτῶν
  choice: 记得这些事
  rationale: 将SBLGNT所保留的第二个αὐτῶν明确表达出来；汉语用“这些事”承接前文，比机械译成“记得他们”更易理解，同时不省略该代词。
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: 记得我曾告诉过你们
  rationale: ὅτι引出的内容说明他们所要记起的事实；重复“记得”使两个αὐτῶν及后续从句在汉语中衔接清楚，也保留强调性的ἐγώ。
- source_word: ἐξ ἀρχῆς οὐκ εἶπον
  choice: 起初没有告诉
  rationale: “起初”准确表达ἐξ ἀρχῆς；汉语无需机械保留介词结构，否定范围仍清楚。
- source_word: μεθ’ ὑμῶν ἤμην
  choice: 我和你们在一起
  rationale: 直接保留同在的关系，不增添“始终”“那时”等原文未明说的时间限定。
theological_decisions:
- issue: 两个αὐτῶν的所指及其句法关系
  choice: 正文将第一个译为“他们的”，将第二个译为“这些事”，并以重复“记得”衔接ὅτι从句。
  alternative: 可将第二个αὐτῶν视为复指或在译文中省略，译作“到他们的时候来到时，你们会记得我曾告诉过你们”；也可按异文只保留其中一个代词。
  rationale: SBLGNT正文含有两次αὐτῶν。译文尽量让两者都有对应，同时借脚注说明原文结构不寻常，避免在正文中武断消除文本上的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他们的时候来到时”略带陌生感，但有意保留约翰原文“他们的时刻”这一不寻常且含义开放的表达；全节避免加入特定宗派解释。
