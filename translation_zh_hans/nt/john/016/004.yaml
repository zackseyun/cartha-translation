revisions:
- from: 然而，我已经把这些事告诉你们，为要使你们在他们的时候来到时[a]，记得这些事，记得我曾告诉过你们。至于这些事，我起初没有告诉你们，因为我和你们在一起。
  to: 然而，我已经把这些事告诉你们，是要叫你们当他们的时刻来到时，想起他们，也想起我曾告诉过你们。至于这些事，我起初没有告诉你们，因为我和你们在一起。
  rationale: 修订以“时刻”替换不自然的“时候”，使中文语法通顺，同时保留“他们的”所造成的指涉开放性。第二个αὐτῶν改译为“他们”，不预先判断其必然指“这些事”；脚注说明其所指、句法关系及异文问题。其余内容维持原稿对完成时、目的从句、起初未说及同在理由的忠实表达。
