review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了本节的目的结构、完成时的持续关联，以及第二句“起初没有说”的理由。但“在他们的时候来到时”不合现代汉语习惯；“时候”应改为“时刻”。此外，第二个αὐτῶν宜在正文中保留为开放的“他们”，而不直接确定为“这些事”，以免把代词所指的歧义消解为单一解释。
  naturalness: “当他们的时刻来到时”虽仍刻意保留原文的不寻常感，但在现代汉语中可理解且句法自然。以“想起他们，也想起我曾告诉过你们”承接两个代词及ὅτι内容从句，较原稿重复“记得”更流畅。
  terminology: “这些事”“告诉你们”“起初”“和你们在一起”均恰当。将ὥρα译为“时刻”比“时候”更能体现约翰文本中可具有特定、指定时机意味的用语，同时不将其解释为某一特定事件。
