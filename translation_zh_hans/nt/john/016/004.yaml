    issue: “在他们的时候来到时”不自然且搭配不当。
    rationale: 汉语中“时候来到”可以成立，但“他们的时候”十分生硬，也未能自然表达ἡ ὥρα αὐτῶν这一带属格的名词短语；“他们的时刻来到时”更准确通顺。
  - severity: medium
    issue: 第二个αὐτῶν被正文确定译作“这些事”。
    rationale: 第二个代词的所指及其与前一代词的关系存在句法和文本上的困难。译为“这些事”虽可理解，却比原文更明确；译作“他们”并以脚注说明歧义，更能保留原文张力。
  - severity: low
    issue: “记得这些事，记得我曾告诉过你们”略显重复，且后一句的内容关系不够自然。
    rationale: “想起他们，也想起我曾告诉过你们”更自然地表达“记念他们／记念我已告诉你们”这一原文的并置关系。
