  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: zh_hans
  text: “这些事，我已经用比喻的话[a]对你们说了。时刻[b]将到，那时我不再用比喻的话对你们说，而要明明白白地[c]把有关父的事告诉你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐晦的话”或“寓意的话”；希腊语在这里指形象或间接的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“时候”；约翰福音常用“时刻”一词表达具有特殊意义的时间。
    reason: lexical_alternative
  - marker: c
    text: 或译“直截了当地”或“坦率地”；这里强调直接、清楚、不再使用隐晦的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: 比喻的话
  rationale: 该词在约翰著作中指形象、间接而略显隐晦的表达，不宜径直套用对观福音中较为专门的“比喻故事”。“比喻的话”既自然，也保留其表达方式上的间接性。
- source_word: λελάληκα
  choice: 我一直……说
  rationale: 希腊语完成时表示此前所说的话在当下仍有影响；“一直……说”在现代汉语中自然地体现此前持续或累积的言说，并与下文“对你们说”形成呼应。
- source_word: ἔρχεται ὥρα
  choice: 时刻将到
  rationale: “时刻”既符合现代汉语，也保留约翰福音中 ὥρα 常有的叙事和神学分量；不译成计量单位意义的“小时”。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达将来发生的对照和状态转变，简洁自然。
- source_word: λαλήσω
  choice: 对你们说
  rationale: 与前面的 λελάληκα 保持词语呼应，突出言说方式将发生改变。
- source_word: παρρησίᾳ
  choice: 明明白白地
  rationale: 本节将其与“用比喻的话”对照，重点是直接、清楚而不隐晦，并非主要强调公开发言或勇敢无惧。
- source_word: ἀπαγγελῶ
  choice: 告诉
  rationale: 此处表示把有关父的事直接传达给门徒；“告诉”自然清楚，又不额外加入正式宣告的色彩。
- source_word: περὶ τοῦ πατρὸς
  choice: 有关父的事
  rationale: 忠实表达“关于父、涉及父”的范围；保留约翰语境中“父”的关系性称谓，不擅自扩展具体内容。
theological_decisions:
- issue: 约翰语境中 ὥρα 的译法
  choice: 时刻将到
  alternative: 时候将到
  rationale: “时刻”保留约翰福音中该词可能具有的特殊叙事与神学意味，同时没有把原文未明说的具体事件直接写入译文。
- issue: παρρησίᾳ 与 ἐν παροιμίαις 的对照
  choice: 明明白白地
  alternative: 公开地；坦率地
  rationale: 上下文着重对照隐晦、间接的表达和清楚、直接的讲说，因此采用“明明白白地”；同时以脚注保留“直截了当”等可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“比喻的话”与“明明白白地”构成清楚对照；“父”保留约翰福音的核心关系称谓。所有脚注标记均置于其所说明的词语之后。
