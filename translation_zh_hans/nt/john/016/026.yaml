  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: zh_hans
  text: 到那日[a]，你们要奉我的名祈求；我并不是对你们说，我要为你们求父[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在那日”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在本节用了两个不同的“求”：门徒的“祈求”是αἰτέω，耶稣向父的“求”是ἐρωτάω。
    reason: lexical_alternative
  - marker: c
    text: “为你们”也可译作“关于你们”或“就你们的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到那日
  rationale: 这是表示时间的介词短语；“到那日”符合现代汉语习惯，也保留了指示词“那”的强调。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: “奉……的名”是自然、庄重的汉语表达，保留了约翰福音中与耶稣的身份和权柄相关的含义，而不把它窄化为单纯的授权公式。
- source_word: αἰτήσεσθε
  choice: 你们要……祈求
  rationale: 该词为将来时、中间语态、第二人称复数；在祷告语境中译作“祈求”自然，并可与后面的ἐρωτάω略作区分。
- source_word: οὐ λέγω ὑμῖν ὅτι
  choice: 我并不是对你们说
  rationale: 保留“对你们”和ὅτι所引出的陈述内容；“并不是”自然表达本句在上下文中的限定作用。
- source_word: ἐρωτήσω τὸν πατέρα
  choice: 我要……求父
  rationale: 保留将来时以及“父”这一约翰福音的重要称谓；用较简洁的“求”与前面的“祈求”形成轻微区别，但不夸大两个希腊动词的语义差异。
- source_word: περὶ ὑμῶν
  choice: 为你们
  rationale: περί加属格在此可表示涉及某人，也可带有代表某人请求的意味。“为你们”在汉语中最自然地表达语境中的代求含义，同时以脚注保留“关于你们”的字面可能。
theological_decisions:
- issue: 耶稣是否在此否定自己任何将来的代求角色
  choice: 按原文译为“我并不是对你们说，我要为你们求父”，只表达耶稣此处没有这样说。
  alternative: 解释性地译成耶稣绝不会为门徒代求，或门徒亲近父完全不涉及任何中保。
  rationale: 紧接的上下文强调门徒奉耶稣的名向父祈求，但本句本身并未全面否定耶稣的代求。直译其否定范围，可保留新约相关经文之间的神学张力。
- issue: περὶ ὑμῶν所表达的是“关于你们”还是“为你们”
  choice: 正文采用语境自然的“为你们”，并用脚注注明较字面的译法。
  alternative: 译作“关于你们”或“就你们的事”。
  rationale: 该介词结构容许“涉及你们”和“为你们的缘故”两种相近理解；正文不宜用生硬措辞消除其代求语境，脚注则保留词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“奉我的名”保留约翰福音的固定神学用语；句式尽量贴近原文，同时用“并不是”避免生硬。所有脚注标记均已置于正文对应位置。
