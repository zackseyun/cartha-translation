base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: zh_hans
  text: 但现在，我要到那差我来的那一位那里去；你们中间没有一个人问我：“你要到哪里去？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: 但现在
  rationale: 保留δέ所表达的语篇转折，同时符合现代汉语的自然表达。
- source_word: ὑπάγω
  choice: 我要到……去／你要到哪里去
  rationale: 按上下文将现在时的行进意义自然译出；“要……去”既适合汉语，也不过度解释为单纯离开。
- source_word: πρὸς τὸν πέμψαντά με
  choice: 到那差我来的那一位那里去
  rationale: 保留带冠词分词结构的指称方式，不在正文中增添原文未明说的“父”。
- source_word: πέμψαντά
  choice: 差我来的
  rationale: “差”准确传达约翰福音中πέμπω的差遣含义；加“来”符合汉语中“差某人来”的习惯表达。
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: 你们中间却没有人
  rationale: 自然表达部分关系和全称否定；补出“却”使句内反差清楚。
- source_word: ἐρωτᾷ με
  choice: 问我
  rationale: 此处指提出问题，“问我”是简明自然的现代汉语。
- source_word: Ποῦ ὑπάγεις;
  choice: 你要到哪里去？
  rationale: 用现代汉语自然表达直接问句，并保留ὑπάγω的方向性。
theological_decisions:
- issue: “那差我来的那一位”的身份
  choice: 正文只译作“那差我来的那一位”
  alternative: “差我来的父”
  rationale: 原文此处用带冠词的分词指称，并未明确写出“父”；译文保留原文措辞，不把上下文中清楚但本句未明说的身份直接加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那差我来的那一位”略带郑重感，以对应原文的指称结构；分号呈现两个并列分句之间的紧密转折关系。
