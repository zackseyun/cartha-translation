  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: zh_hans
  text: 看哪，时候将到，并且已经到了：你们将要分散，各归自己的地方[a]，留下我独自一人。然而我并不是独自一人，因为父与我同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各自归向自己所有的事物”。希腊语所指比某个特定地点更广，也可泛指各人自己的住处、事物或所属范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的篇章标记和庄重语气；“看哪”在现代中文圣经语体中清楚而不失尊严。
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: 时候将到，并且已经到了
  rationale: 保留希腊文现在时与完成时并置的张力：这一决定性时刻既将来到，也已经临到；中文不加“一个”，更合乎自然表达。
- source_word: ἵνα
  choice: ：
  rationale: 此处引出该时刻所包含或带来的事件，用冒号自然连接，避免把 ἵνα 过度限定为目的。
- source_word: σκορπισθῆτε
  choice: 你们要分散
  rationale: 表达被动形式所呈现的离散结果；中文“分散”自然，也保留门徒彼此离开的图景。
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: 各归自己的地方
  rationale: “各归自己”在中文中略显悬空，补入“地方”以求自然；同时以脚注说明 τὰ ἴδια 的范围更广，并不只指具体地点。
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: 留下我独自一人
  rationale: 准确表达门徒离去后耶稣被留下的意思；不采用语义更强的“抛弃”，以免过度诠释。
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: 然而我并不是独自一人
  rationale: 将 καί 在上下文中的轻微转折作用自然表达出来，并保留前后“独自一人”的呼应。
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: 因为父与我同在
  rationale: 清楚表达原因；“父”保留约翰福音中的关系性称谓，“与我同在”直接对应原文。
theological_decisions:
- issue: 门徒离散与父同在之间的关系
  choice: 然而我并不是独自一人，因为父与我同在
  alternative: 我却不孤单，因为父与我同在
  rationale: 保留耶稣确实被门徒独自留下、却因父的同在而并非真正独自一人的张力，不引入本节之外的神学结论。
- issue: ἕκαστος 的逐一分配意味
  choice: 各归自己的地方
  alternative: 各归各处／各归自己的家
  rationale: “各”简洁保留每个人分别离去的分配性含义，又不必在中文中添加原文没有强调的性别信息；避免把 τὰ ἴδια 狭义限定为“家”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留郑重的提示语气；以“时候”而非“一个时辰”表达约翰福音中决定性时刻的惯用说法。脚注标记[a]已置于主文相应位置。
