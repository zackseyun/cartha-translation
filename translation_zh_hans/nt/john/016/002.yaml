  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: zh_hans
  text: 他们要把你们逐出会堂[a]。而且，时候将到，那时凡杀你们的，都会以为自己这样做是在事奉上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你们赶出犹太会堂”，或“把你们排除在会堂群体之外”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“是在敬拜上帝”；较贴近原文可译为“是在向上帝献上宗教性的服事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: 他们要把你们逐出会堂
  rationale: 该结构表示使人成为被会堂群体排斥的人。“逐出会堂”以自然简洁的现代汉语表达被驱逐、被排除在宗教群体之外的含义；“会堂”在此按犹太教语境理解。
- source_word: ἀλλ’
  choice: 而且
  rationale: 此处不是单纯转折，而是把迫害从逐出会堂推进到杀害。“而且”自然地体现递进和加重语气。
- source_word: ἔρχεται ὥρα ἵνα
  choice: 时候将到，那时
  rationale: “时候将到”保留约翰著作中反复出现的时间表达；“那时”自然引出这个将临时刻的具体内容，而不把ἵνα机械地译为目的关系。
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: 凡杀你们的
  rationale: 以汉语泛指结构准确传达πᾶς的普遍范围和分词结构的泛指意义。
- source_word: δόξῃ
  choice: 都会以为
  rationale: 表达迫害者主观上的判断和自我认定，不暗示这种认定真实或正确。
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: 自己这样做是在事奉上帝
  rationale: “事奉上帝”自然传达λατρεία的宗教性服事含义；“这样做”把“献上/呈上”的行为性与杀害这一行动联系起来，同时避免生硬的汉语搭配。脚注保留“敬拜”和较贴近形式的译法。
theological_decisions:
- issue: 如何表达迫害者对杀人行为的宗教性自我理解
  choice: 以为自己这样做是在事奉上帝
  alternative: 以为是在敬拜上帝；以为是在向上帝献上宗教性的服事
  rationale: 译文保留原文令人震惊的反讽：杀害门徒的人会把自己的行为误认作献给上帝的宗教性服事。措辞只陈述其主观认定，并不暗示上帝认可这种行为。
- issue: πᾶς ὁ ἀποκτείνας的泛指与语法性别
  choice: 凡杀你们的
  alternative: 每一个杀你们的人
  rationale: 现代汉语不需要为这一泛指结构添加性别代词；“凡……的”保留普遍范围，也不额外限定行为者性别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“逐出会堂”简洁呈现宗教群体排斥；“而且”体现迫害程度的递进；“事奉上帝”是普通读者可理解的宗教表达，同时借脚注保留λατρεία与προσφέρειν所具有的敬拜、献上宗教性服事等语义层次。
