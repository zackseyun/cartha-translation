  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: zh_hans
  text: 父自己爱你们；因为你们爱我，并且相信我是从上帝那里出来的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是从上帝而来的。”原文也可含有“从上帝所在之处出来”的意味。
    reason: παρά与ἐξέρχομαι的组合可表达从上帝而来，也可暗示从上帝所在之处出来；脚注保留这一来源及动态的替代理解。
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: 因为父亲自己
  rationale: γάρ承接上文作解释；αὐτός强化“父亲”，用“自己”保留强调，同时保持现代汉语自然。
- source_word: φιλεῖ ὑμᾶς
  choice: 爱你们
  rationale: φιλέω在此表达亲密而真实的爱；“爱”自然庄重，也避免用“喜欢”削弱其关系深度。
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: 因为你们爱我
  rationale: ὅτι在此表示原因；显式的ὑμεῖς在汉语主语“你们”中得到体现。完成时所表达的持续关联由语境承载，不机械添加“已经”或“一直”。
- source_word: καὶ πεπιστεύκατε
  choice: 并且相信
  rationale: καί并列爱与信这两个理由；πιστεύω后接命题内容，译作“相信”比“信靠”更贴切。完成时的现今关联由上下文自然表达。
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: 相信我是从上帝那里出来的
  rationale: 第二个ὅτι引出所信的内容。παρά加属格可表达从某一位那里或其所在之处而来，ἐξῆλθον具有“出来、出发”的动态含义；此译法保留起源与差遣语义，不扩写为教义解释。
theological_decisions:
- issue: “我是从上帝那里出来的”的基督论含义
  choice: 按原文译出耶稣从上帝那里出来，不进一步解释其方式
  alternative: 我是由上帝差来的；我从上帝的同在中出来
  rationale: 原文同时可涉及来源、所在之处和使命。直译其关系与动态，既保留约翰福音的基督论力度，也不把某一种系统性解释加入正文。
- issue: 父爱门徒与门徒爱并信耶稣之间的因果表达
  choice: 保留“因为”所表达的因由关系
  alternative: 弱化为“这表现在”或改写为单纯并列
  rationale: 第一个ὅτι在句法上自然说明父爱他们的理由。译文保留这一神学张力，不擅自将其改写为仅仅是爱的证据或结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父亲自己”保留原文强调；连续两个“因为”对应γάρ与第一个ὅτι的解释、因由关系，虽有重复，却清楚保留原句逻辑。称神为“上帝”，与项目所给咨询层一致。
