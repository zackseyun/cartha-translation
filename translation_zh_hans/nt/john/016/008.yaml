  to: 当那一位[a]来时，他要就罪、义[b]和审判指证世人有错[c]。
  rationale: 本次仅作低风险的汉语措辞调整：“当……来时，他要”使分词所表达的时间关系与主句将来时更清晰；“就罪、义和审判”简洁保留原文三重περί；“指证世人有错”较“证明世人有错”更自然地传达ἐλέγχω的揭露和证明其错误的法庭性意味。脚注c相应更新，以与主译文一致。
