  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: zh_hans
  text: 当那一位[a]来时，他要就罪、义[b]和审判指证世人有错[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他”。原文是带强调意味的指示代词，直译近于“那一位”，指上文所说将要来的保惠师。
    reason: lexical_alternative
  - marker: b
    text: “义”也可译作“公义”或“正义”。
    reason: alternative_reading
  - marker: c
    text: “指证……有错”也可译作“揭露……的过错”“证明……有错”或“使……知错”；原词兼有揭露、指证、责备的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来的时候
  rationale: 将不定过去时分词的时间作用自然地译出；不刻意保留“来了之后”之类较生硬的形式。
- source_word: ἐκεῖνος
  choice: 那一位
  rationale: 原文使用带强调意味的指示代词，承接上文将要来的保惠师。“那一位”既保留强调，也不在本节额外明说其身份。
- source_word: ἐλέγξει
  choice: 证明……有错
  rationale: ἐλέγχω在此有揭露过错、使人无可推诿或证明其错误之意；此译法保留道德与审判语境中的指证意味，又避免把结果限定为主观悔悟。
- source_word: τὸν κόσμον
  choice: 世人
  rationale: κόσμος在此是被指证的对象，指世上的人；汉语用“世人”比把无生命的“世界”说成有错更自然，同时保留约翰语境中的整体性。
- source_word: περὶ
  choice: 在……的事上
  rationale: 三个περί共同支配罪、义、审判，说明指证所涉及的事项。汉语合并表达，仍保留三项平行结构。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 保留单数和核心神学用语，并让下一节进一步说明其具体所指。
- source_word: δικαιοσύνης
  choice: 义
  rationale: δικαιοσύνη在本段由下一节基督到父那里去加以说明。“义”较“正义”更能保留称义、正直与合乎神标准等语义空间。
- source_word: κρίσεως
  choice: 审判
  rationale: 保留法律性与末世性的广度，不提前窄化为“定罪”这一审判结果。
theological_decisions:
- issue: ἐκεῖνος的指代与强调
  choice: 译作“那一位”，承接上文的保惠师并保留指示代词的强调。
  alternative: 译作普通代词“他”。
  rationale: 上下文足以确定所指，但本节本身不宜额外加入“圣灵”等解释性称谓；“那一位”忠实呈现原文强调。
- issue: ἐλέγχω所表达的工作
  choice: 译作“证明世人有错”。
  alternative: “使世人知罪”“责备世人”“揭露世人的过错”。
  rationale: 原词可包含揭露、责备、证明有错等意味。主译文不把它仅理解为内在认罪或悔改，也不把三项都归并为狭义的“知罪”。
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 公义；正义
  rationale: 本节与16:10的基督论解释相连，“义”能保留较宽的神学语义；脚注提示也可按语境理解为“公义”或“正义”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在……的事上”使三个περί所引出的项目在汉语中保持平行；“证明世人有错”略带法庭语感，与“审判”相应，但不使用艰深术语。
