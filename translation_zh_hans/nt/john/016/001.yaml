  text: I have spoken these things to you so that you may not fall away.
translation:
  language: zh_hans
  text: 我把这些事告诉了你们，是要使你们不至于跌倒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被绊倒”“受冒犯”；也可指在信仰上动摇，甚至背离。
    reason: 保留σκανδαλισθῆτε的词义范围，以及在逼迫语境中可能具有的严重含义。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 中性复数指示代词回指耶稣先前所说的话；译为“这些事”保留复数和约翰叙事中的回指方式。
- source_word: λελάληκα
  choice: 我把……告诉了
  rationale: λαλέω的完成时主动直陈式，表示已经说出且其作用延续至当前；汉语“告诉了”自然表达对门徒说这些话这一已完成行动。
- source_word: ὑμῖν
  choice: 你们
  rationale: 第二人称复数与格；“告诉了你们”既明确复数对象，也符合现代汉语表达。
- source_word: ἵνα μὴ
  choice: 是要使……不至于
  rationale: 保留目的从句的功能；“是要使……不至于”自然、明确地表达预防性的目的。
- source_word: σκανδαλισθῆτε
  choice: 跌倒
  rationale: σκανδαλίζω的不定过去时被动虚拟式。此处可指因逼迫而在信仰上绊跌，甚至背离；“跌倒”保留绊倒意象及语义张力，不把含义限定为最终离弃。
theological_decisions:
- issue: 门徒在逼迫背景下“跌倒”的严重程度
  choice: 跌倒
  alternative: 背离信仰；被绊倒；因而厌弃
  rationale: 紧接着的逐出会堂与杀害预告表明，这不是普通的不快，而是可能动摇信仰的危机；但原词本身可涵盖从受绊到背离的范围，因此正文保留“跌倒”，脚注说明其较强含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我把这些事告诉了你们”比直译“我已经向你们说了这些事”更自然；“不至于跌倒”保留经文意象与神学张力。
