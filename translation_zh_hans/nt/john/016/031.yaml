  yaml_path: translation/nt/john/016/031.yaml
  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: zh_hans
  text: 耶稣回答他们：“你们现在信吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们现在信了。”希腊文也可理解为陈述句，不过上下文较支持反问。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是ἀποκρίνομαι的简单过去时叙事用法；“回答”自然、庄重，也不额外添加原文没有的语气。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与“回答”搭配作间接对象；现代汉语说“回答他们”简洁自然。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: Ἄρτι
  choice: 现在
  rationale: 保留该词所表达的当下、此刻之意；“现在”在此简明自然。
- source_word: πιστεύετε
  choice: 信
  rationale: πιστεύω在约翰福音中通常译作“信”；此处用“信”直接保留其核心含义，并以“你们”体现第二人称复数。
theological_decisions:
- issue: Ἄρτι πιστεύετε的语气
  choice: 正文译作反问：“你们现在信吗？”
  alternative: “你们现在信了。”
  rationale: 希腊文原稿本身没有现代标点，这句话在语法上既可理解为问句，也可理解为陈述句。下节预告门徒将要分散，语境更支持带有质询意味的问句；脚注保留陈述句的真实可能性，不消除原文的张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“你们”明确表达原文第二人称复数；正文措辞简洁，保留耶稣话语中的质询与上下文张力。
