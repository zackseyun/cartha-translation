review_pass:
  verdict: revise
  source_fidelity: “从属于我的领受”缺少名词中心语，在现代汉语中不能自然表达 ἐκ τοῦ ἐμοῦ（“从属于我的［事物］中”）的开放性指涉。补出概括性的“事物”可使出处关系和未明说的内容均得到保留。将“这事”改为“所领受的”，更贴合原文中由前句语义承接的隐含宾语，且不将内容限定为单一事件。
  naturalness: 原译的“从属于我的领受”语法不完整、读起来生硬。修订后句法完整，保持现代普通话庄重清晰的经文语体。
  terminology: “荣耀”恰当保留 δοξάζω 在约翰福音中的重要语域；“领受”和“告诉”自然表达 λήμψεται 与 ἀναγγελεῖ，未导入后期教义性限定。
  issues:
  - severity: medium
    issue: “从属于我的领受”缺少必要的名词中心语。
    rationale: “属于我的”在汉语中通常须修饰明示名词；原句因此不通顺，也不利于读者理解其泛指“属于我的事物”的含义。
  - severity: low
    issue: “把这事宣告给你们”将隐含宾语表成单数的“这事”。
    rationale: 原文并未把所传达的内容限定为一件事；“把所领受的告诉你们”更直接承接前句，也更符合现代汉语。
  revised_text: 他要荣耀我，因为他要从属于我的事物中领受，并把所领受的告诉你们。
