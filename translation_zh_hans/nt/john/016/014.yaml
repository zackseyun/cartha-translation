- from: 他要荣耀我，因为他要从属于我的领受，并把这事宣告给你们。
  to: 他要荣耀我，因为他要从属于我的事物中领受，并把所领受的告诉你们。
  rationale: 修订仅补足汉语表达所需的概括性名词，并以“所领受的”承接原文隐含宾语；保留“从……中”的来源关系以及“属于我的”未具体说明的广泛含义。
