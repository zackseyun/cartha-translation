  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: zh_hans
  text: 他要荣耀我，因为他要从属于我的事物中领受，并把所领受的告诉你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: 他
  rationale: 承接上文所说的真理之灵。现代汉语用“他”自然明确；上下文已经足以标示所指，无须硬译指示代词的形式。
- source_word: ἐμὲ
  choice: 我
  rationale: 作“荣耀”的宾语，直接译为“我”。
- source_word: δοξάσει
  choice: 要荣耀
  rationale: 保留约翰著作中 δοξάζω 的神学分量，不弱化为一般性的“尊敬”或“称赞”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出圣灵荣耀耶稣的原因，因果关系清楚。
- source_word: ἐκ τοῦ ἐμοῦ
  choice: 从属于我的
  rationale: 原文为中性冠词与物主形式的组合，泛指属于耶稣的事物；此译法避免擅自限定为教导、权柄或启示。
- source_word: λήμψεται
  choice: 领受
  rationale: λαμβάνω 可指“拿取”或“领受”；在启示与传达的语境中，“领受”较自然，同时不为中间语态强加反身含义。
- source_word: ἀναγγελεῖ
  choice: 把这事宣告
  rationale: 表达“报告、宣告、使人知道”的意思；“这事”承接前面的“属于我的”，使现代汉语句意完整。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 准确表达第二人称复数与格，明确受话者为众门徒。
theological_decisions:
- issue: 圣灵与耶稣在“ἐκ τοῦ ἐμοῦ λήμψεται”中的关系
  choice: 他要从属于我的领受
  alternative: 他要从我领受；他要取用属于我的
  rationale: 保留原文宽泛的所属关系，不把它缩窄为后期神学中的技术性命题，也不限定圣灵所领受的具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荣耀”保留经文的神学语域；“从属于我的领受”略带书面色彩，但能较准确地保存原文的开放性。未设置脚注，因为正文采用“领受”，已直接体现 λαμβάνω 在此语境中较合适的含义。
