  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: zh_hans
  text: 妇女分娩时会忧愁，因为她临产的时候到了；但生下孩子后，她因一个人降生到世上而喜乐，就不再记得那痛苦了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: 女人
  rationale: 这是关于生产的一般性比喻，“女人”比“妻子”更符合语境。
- source_word: ὅταν τίκτῃ
  choice: 生产的时候
  rationale: 表达生产这一正在发生的过程，同时保持现代汉语自然。
- source_word: λύπην ἔχει
  choice: 会忧愁
  rationale: λύπη不只指身体疼痛，也含忧伤、愁苦；“忧愁”保留了与上下文中喜乐相对的情感层面。
- source_word: ἡ ὥρα αὐτῆς
  choice: 她的时候
  rationale: 保留“时候”的直译及《约翰福音》中ὥρα可能具有的主题呼应，而不缩减为单纯的“产期”。
- source_word: γεννήσῃ τὸ παιδίον
  choice: 生下孩子以后
  rationale: 体现不定过去时所指的生产已经完成；παιδίον自然译作“孩子”。
- source_word: οὐκέτι μνημονεύει
  choice: 不再记得
  rationale: 直接、自然地对应μνημονεύει。
- source_word: τῆς θλίψεως
  choice: 那苦难
  rationale: θλῖψις指生产过程中所受的重大痛苦和困厄；“苦难”保留其较宽的语义，不把它局限为肉体疼痛。
- source_word: διὰ τὴν χαράν
  choice: 因……而喜乐
  rationale: 清楚表达διά加宾格所表示的原因，并使汉语句式流畅。
- source_word: ὅτι ἐγεννήθη
  choice: 因……诞生
  rationale: 将ὅτι理解为说明喜乐的缘由；“诞生”自然体现已经出生的事件。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: ἄνθρωπος在这里泛指一个人类生命，并不特指男性；“一个人”既贴近原文，也比“一个人类”更符合现代汉语。
- source_word: εἰς τὸν κόσμον
  choice: 到世上
  rationale: 自然对应“进入世界”，指孩子出生来到世上。
theological_decisions:
- issue: ἄνθρωπος是否特指男性
  choice: 一个人
  alternative: 一个男孩／一个人类
  rationale: 该词虽为阳性形式，在此语境中却是泛指新生的人，并无证据限定为男性；译作“一个人”保留泛指意义，也避免不必要的性别限定。
- issue: “她的时候”是否意译为“产期”
  choice: 她的时候
  alternative: 她的产期
  rationale: 原文ὥρα在本句直接指生产之时，但在《约翰福音》中也常有主题性分量；保留“时候”可兼顾直接语境与潜在呼应，不额外解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式顺应汉语表达，将喜乐的原因置于“不再记得”之前；保留“她的时候”这一略带经文色彩的措辞，以承载约翰文本中的词语呼应。
