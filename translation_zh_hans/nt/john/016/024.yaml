  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: zh_hans
  text: 到现在为止，你们还没有奉我的名求过什么[a]。你们求[b]，就必得着，好使你们的喜乐得以满足[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉我的名”可指祈求与耶稣本人、他的权柄和使命相符；正文保留原文富有含义的说法，不把它限定为一种解释。
    reason: lexical_alternative
  - marker: b
    text: “求”也可理解为“不断地求”或“继续求”；这里的希腊语现在时命令在语境中可能表示持续或反复的行动。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使你们的喜乐得以充满”或“使你们的喜乐达到圆满。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: 到现在为止
  rationale: 自然地表达截至说话当下的时间范围，保留原文的时间意味。
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: 还没有……求过什么
  rationale: 在“到现在为止”的语境中，用“没有……过”自然表达截至目前的经历；“求”也符合向能够赐予者提出请求的语境。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 这是现代汉语基督教语境中自然、庄重而广为理解的表达，同时保留“我的名”这一约翰福音中的重要措辞，不在正文中把它局限为“凭我的权柄”或“代表我”等单一解释。
- source_word: αἰτεῖτε
  choice: 你们求
  rationale: 简洁自然地表达现在时命令；希腊语现在时可能含持续或反复之意，但正文不将这一语体意义绝对化。
- source_word: λήμψεσθε
  choice: 就必得着
  rationale: 表达将来必然得到所求的回应；“得着”比口语化的“拿到”更适合祈求的语境。
- source_word: ἵνα
  choice: 好使
  rationale: 清楚保留目的或所导致结果的意味，且符合庄重的现代汉语。
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: 你们的喜乐得以充满
  rationale: 保留“充满”的意象，并以“得以”表达达到并处于充足状态的结果；不将其简化为只有抽象意味的“完全”。
theological_decisions:
- issue: “奉我的名”在祈求中的含义
  choice: 正文保留“奉我的名”，不作解释性扩写
  alternative: 凭我的权柄；代表我；与我联合
  rationale: 原短语涵盖与耶稣的身份、权柄和使命相关的丰富含义。正文保留其神学张力，避免选定某一种解释而排除其他可能层面。
- issue: 应许“就必得着”的范围
  choice: 按原文直接保留应许，不增添限制语
  alternative: 增译为“合乎我旨意的就必得着”
  rationale: 本节没有明说额外限定；翻译不从其他经文引入解释性条件。上下文与“奉我的名”的含义仍为理解这项应许提供空间。
translation_notes:
  register: 采用自然、庄重、适合普通现代读者的简体中文。“奉我的名”和“得着”保留经文语体的庄重感，但句法保持简明；脚注分别说明该短语的丰富含义、现在时命令可能具有的持续意味，以及“充满”的可选译法。
