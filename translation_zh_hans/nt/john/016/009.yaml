lexical_decisions:
- source_word: περὶ
  choice: 论到
  rationale: περί加属格引出圣灵所要指证的事项；“论到”自然、庄重，并可与后续经节的平行结构呼应。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 保留单数抽象名词的范畴意义，不扩展为“罪性”或具体的诸罪。
- source_word: μέν
  choice: 不单独译出
  rationale: μέν标示系列中的第一项，与后文第10—11节形成篇章配列；现代汉语可由平行句式和标点体现，无须生硬译作“固然”或“一方面”。
- source_word: ὅτι
  choice: 是因为
  rationale: 此处可表原因或解释，说明前述“罪”所指为何；正文采用“是因为”体现语境中的解释性因果关系，同时以脚注保留“就是”这一可能译法。
- source_word: οὐ πιστεύουσιν
  choice: 他们不信
  rationale: 准确表达现在时直陈语气所陈述的持续现实；“不信”是现代汉语中简洁自然的对应。
- source_word: εἰς ἐμέ
  choice: 不信我
  rationale: πιστεύω εἰς在约翰著作中表达指向耶稣的信靠；汉语通常自然地说“信我”，不宜机械译出介词。
theological_decisions:
- issue: 本节所指的“罪”与不信耶稣的关系
  choice: 把“不信我”译作对“罪”的直接解释或根据，不作超出经文的教义扩展。
  alternative: 将其理解为一般人类罪恶中的一个例子。
  rationale: ὅτι从句直接连接“论到罪”和“他们不信我”；译文保留这种紧密联系，同时不额外断定本节穷尽了“罪”的全部含义。
- issue: ὅτι的解释性或内容性歧义
  choice: 正文译为“是因为”，强调解释性因果。
  alternative: 译为“就是他们不信我”，将从句视为对“罪”的内容说明。
  rationale: 两种理解在此高度接近，希腊语ὅτι容许这两种表达；正文依上下文选择“因为”，脚注保留另一译法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论到”保持第9—11节系列结构的正式感；“不信我”简洁自然，并保留约翰文本中信靠对象的直接性。
