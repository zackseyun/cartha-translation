source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: zh_hans
  text: 现在我们知道，你知道万事，也不需要任何人来问你[a]。由此我们相信，你是从上帝那里来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任何人向你发问”。原文动词可指询问或提出问题；这里的上下文涉及门徒想问却尚未说出口的问题。
    reason: 保留ἐρωτάω在本处“问／发问”的表达选择，并说明采用“来问你”的语境依据。
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 作时间副词，标明门徒此刻所得的认识；“现在”简洁自然。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽具完成时形式，在此表达现在的“知道”，用一般现在意义最贴切。
- source_word: οἶδας πάντα
  choice: 你知道万事
  rationale: πάντα涵盖一切；“知道万事”既保留原文广度，也避免用“无所不知”把门徒的话扩写成术语化的教义陈述。
- source_word: οὐ χρείαν ἔχεις
  choice: 也不需要
  rationale: 以现代汉语自然表达“不具有需要”这一希腊语结构。
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: 任何人向你发问
  rationale: ἐρωτάω可指询问、提出问题，也可指请求；“向你发问”契合上下文中门徒想问却尚未开口的情形，又不带敌意色彩。
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 这里表示门徒相信的根据；“由此”清楚传达依据关系，同时保持简洁。
- source_word: πιστεύομεν
  choice: 我们相信
  rationale: 在门徒作出信仰表白的语境中，“相信”是πιστεύω直接而自然的译法。
- source_word: ἀπὸ θεοῦ
  choice: 从上帝那里
  rationale: 忠实保留原文明确的“从上帝”，不按邻近经文具体化为“从父那里”。
- source_word: ἐξῆλθες
  choice: 来的
  rationale: 此处ἐξέρχομαι指耶稣的来源或差遣；与“从上帝那里”连用时，“来”符合现代汉语习惯。
theological_decisions:
- issue: “你知道万事”的基督论分量
  choice: 直接译为“你知道万事”
  alternative: 译为“你无所不知”，明确使用全知的教义性措辞
  rationale: 原文记录门徒对耶稣知识的陈述，具有重要的基督论分量；译文应保留这分量，却不把它扩写成原文没有明说的系统神学术语。
- issue: ἀπὸ θεοῦ ἐξῆλθες的含义
  choice: 你是从上帝那里来的
  alternative: 你是从父那里来的；你是从上帝里面出来的
  rationale: 直译保留耶稣的神圣来源与使命，同时不以附近语境中的“父”替换本节的“上帝”，也不采用可能暗示空间或本体分割的生硬说法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“知道万事”比“无所不知”更贴近原文措辞；“由此”简明表达证据或依据关系。脚注标记已在正文对应位置列出。
