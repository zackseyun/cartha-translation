  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: zh_hans
  text: 他们会做这些事，是因为他们既不认识父，也不认识我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有认识父，也没有认识我”，或“没有开始认识父，也没有开始认识我”。这里的希腊语动词可以有不止一种自然的汉语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 承接上文，不另译为“并且”
  rationale: 此处连接上文；现代汉语用因果句式自然承接，不必机械译出连接词。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示语，回指上文所说的敌对行为。
- source_word: ποιήσουσιν
  choice: 要做
  rationale: 准确表达将来时及 ποιέω 在此处“做、行”的常用意义。
- source_word: ὅτι
  choice: 是因为
  rationale: 明确表达此处的原因关系。
- source_word: οὐκ ἔγνωσαν
  choice: 不认识
  rationale: γινώσκω 在约翰语境中不只是知道有关信息，也可指关系性的认识；汉语“不认识”简洁自然，并保留时态解释上的空间。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 在约翰福音中是指上帝与子的关系性称谓；“父”自然、庄重，也避免添加原文没有的说明。
- source_word: οὐδὲ ἐμέ
  choice: 也不认识我
  rationale: 将 οὐδέ 的递进否定自然表达为“既不……也不……”，明确父与耶稣同为“不认识”的宾语。
theological_decisions:
- issue: 约翰著作中关于认识父与耶稣的语言
  choice: 既不认识父，也不认识我
  alternative: 既没有认识父，也没有认识我；从未认识父，也从未认识我
  rationale: “认识”保留关系性认识与认知层面的张力，不把经文扩展为特定教义解释；同时避免用“从未”强化原文未必明确表达的时间范围。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“之所以……是因为……”自然呈现因果关系；“既不……也不……”准确传达 οὐκ…οὐδέ 的双重否定。脚注标记已置于正文。
