  naturalness: “他们之所以要做这些事，是因为……”语法可通，但“他们会做这些事，是因为……”更简洁自然，也更直接。脚注原有的完整句式重复“是因为”，且“没有认识”不如作为动词短语列出清楚。
  terminology: “父”符合约翰福音中对神的称谓及现代汉语圣经的庄重语域；“认识”恰当地保留γινώσκω可含关系性认识的宽度，而不作额外教义阐释。
