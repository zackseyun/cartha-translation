  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: zh_hans
  text: 但因为我对你们说了这些事，忧愁就充满了你们的心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们各人的心”。希腊文用复数“你们的”搭配单数“心”，可能表达这一群人共同的内在忧愁。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 表示与上文形成转折；“但”自然、简洁，并保留原文的对比关系。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出门徒忧愁的原因，而非单纯引出所说的内容。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示语，指耶稣刚才所说的各项事情，也符合现代汉语表达。
- source_word: λελάληκα
  choice: 我……说了
  rationale: 原文为完成时，表示已经说出的事带来当前影响；汉语以“说了”结合下句结果自然传达这一点。
- source_word: ὑμῖν
  choice: 对你们
  rationale: 明确保留复数受话者和间接宾语关系。
- source_word: ἡ λύπη
  choice: 忧愁
  rationale: 既可表达内心深切的悲伤，也符合本段庄重而自然的语体。
- source_word: πεπλήρωκεν
  choice: 就充满了
  rationale: 保留 πληρόω 的“充满”意象；“就”自然标示前述原因所产生的结果。
- source_word: ὑμῶν τὴν καρδίαν
  choice: 你们的心
  rationale: 保留希腊文复数所有格与单数“心”的组合，可表达众门徒共同的内在忧愁。
theological_decisions:
- issue: 单数“心”与复数受话者之间的关系
  choice: 你们的心
  alternative: 你们的心里；你们各人的心
  rationale: 希腊文以复数“你们的”修饰单数 καρδίαν，可能把门徒群体共同的内在状态呈现为“一颗心”。正文保留这一张力，不擅自改成明确的逐一分配表达。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“忧愁充满了你们的心”有意保留原文意象与集体单数结构；标点和语序则按自然现代汉语处理。
