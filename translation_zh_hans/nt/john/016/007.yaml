  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: zh_hans
  text: 但我告诉你们真话：我离去对你们有益。因为我若不离去，那位辩护者[a]就绝不会到你们这里来；但我若去，我就会差遣他到你们这里来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辩护者”也可译作“帮助者”“劝慰者”或“安慰者”；希腊文音译为“帕拉克利特”。
    reason: παράκλητος语义范围较广，任何单一汉语对应词都难以完全涵盖。
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文门徒的忧愁并形成转折；“但”简洁自然。
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: 我把真相告诉你们
  rationale: 保留郑重声明所说内容真实的语气，同时符合现代汉语表达。
- source_word: συμφέρει ὑμῖν
  choice: 对你们有益
  rationale: 准确表达有利、带来益处之意，且不把这种益处具体化为原文未说明的内容。
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: 我离去
  rationale: 在“有益”之后自然表达有益之事的具体内容，并保留离开的含义。
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: 因为我若不离去
  rationale: “因为”体现γάρ的解释作用，“若不”保留条件结构，并与前句“离去”形成重复。
- source_word: ὁ παράκλητος
  choice: 那位辩护者
  rationale: παράκλητος在约翰著作中是具有人格性、代表性和援助作用的称号。“辩护者”较好保留其为人申辩、代言的一面；其较广语义范围列入脚注。
- source_word: οὐ μὴ ἔλθῃ
  choice: 绝不会到……来
  rationale: 以“绝不会”体现οὐ μή加虚拟式的强烈否定语气。
- source_word: πρὸς ὑμᾶς
  choice: 到你们这里来
  rationale: 明确表达朝向门徒而来的动态意义，符合现代汉语习惯。
- source_word: ἐὰν δὲ πορευθῶ
  choice: 但我若去
  rationale: 保留δέ所表达的对比和条件结构；“去”自然呈现πορεύομαι在本语境中的意义。
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: 就会差他到你们这里来
  rationale: “差”准确表达奉差派而来；“他”体现原文对παράκλητος的人格性指称。
theological_decisions:
- issue: 约翰著作中παράκλητος这一称号的译法
  choice: 辩护者
  alternative: 帮助者、劝慰者、安慰者、帕拉克利特
  rationale: 没有一个汉语词能涵盖该词全部语义。“辩护者”保留其代表、代言和申辩的维度，同时通过脚注呈现援助与劝慰等可能含义，不把文本限定为单一神学解释。
- issue: 对辩护者的人格性指称
  choice: 他
  alternative: 它
  rationale: 原文以阳性代词αὐτόν回指阳性名词παράκλητος，且叙述这位受差而来的行动者；用“他”忠实反映这种人格性表达，避免将其非人格化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“真相”在此指耶稣所说之事的真实；“那位”使称号的人格性与特指性清楚。保留“离去／去”的条件对应以及原文强烈否定的力度。
