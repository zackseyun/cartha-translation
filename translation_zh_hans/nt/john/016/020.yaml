id: JHN.16.20
reference: John 16:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：你们将要哭泣哀恸，世界却要欢喜；你们将要忧愁，但你们的忧愁将变为喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的忧愁将转成喜乐。”
    reason: “将变为”与“将转成”都可自然表达 εἰς χαρὰν γενήσεται 所指的转变；正文选择前者以更贴近 γίνομαι 的基本语义。
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: “实实在在”以现代中文中庄重而自然的固定表达传达重复所带的郑重强调；与后面的“告诉你们”共同构成完整的约翰式宣告语。
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: 你们将要哭泣哀号
  rationale: “哭泣”对应 κλαύσετε，“哀号”对应表达公开悲恸的 θρηνήσετε，既保留两个动词，又避免把二者合并成一个笼统说法。
- source_word: ὁ δὲ κόσμος χαρήσεται
  choice: 世界却要欢喜
  rationale: “世界”保留约翰福音中 κόσμος 的宽广而富有张力的用语；“却”明确表现 δέ 所标出的对比。
- source_word: λυπηθήσεσθε / ἡ λύπη ὑμῶν
  choice: 你们将要忧愁 / 你们的忧愁
  rationale: 重复使用“忧愁”保留动词 λυπηθήσεσθε 与同根名词 λύπη 之间的词汇联系，也与“欢喜、喜乐”形成清楚对照。
- source_word: εἰς χαρὰν γενήσεται
  choice: 将变为喜乐
  rationale: “变为”自然表达 εἰς 加 γενήσεται 所表示的转变结果；“喜乐”对应 χαρά，并与前面的“欢喜”保持语义联系。
theological_decisions:
- issue: 约翰福音中 κόσμος 的含义
  choice: 译作“世界”，不在正文中加以限定
  alternative: 不信的世人；敌对上帝的世界
  rationale: 本节以“世界”与门徒形成对照，但没有在此明说其中每一个人都不信，也没有将其定义为某种抽象体系。保留“世界”可维持原文的广度及约翰式神学张力，避免把解释写入正文。
- issue: 忧愁“变为”喜乐的关系
  choice: 保留忧愁本身“变为喜乐”的强烈表述
  alternative: 忧愁过后便有喜乐；喜乐取代忧愁
  rationale: εἰς χαρὰν γενήσεται 描写的是转变，不只是时间上的先后或一种情绪被另一种情绪替换；因此不把这种关系弱化。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我实实在在地告诉你们”保留约翰福音宣告公式的郑重感；分号呈现门徒与世界之间的平行对照。
