id: JHN.16.33
reference: John 16:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: zh_hans
  text: 我已经把这些事告诉你们，是要让你们在我里面有平安。在世上，你们有患难[a]；但要有勇气[b]，我已经胜过了世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“苦难”、“困苦”或“忧患”。
    reason: lexical_alternative
  - marker: b
    text: “要有勇气”也可译作“要放心”或“要振作起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示语，指向耶稣此前所讲的整段话，而不把它收窄为单一事项。
- source_word: λελάληκα
  choice: 我已经把……告诉你们
  rationale: 用“已经”体现希腊语完成时所表达的已完成行动及其当前效力；“告诉”在现代汉语中比直译“说了”更自然，也清楚表达受话对象。
- source_word: ἵνα
  choice: 是要让
  rationale: 自然表达目的关系，同时避免过度书面化。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 保留约翰著作中具有神学分量的“在……里面”表达，不解释性地改写为“借着我”或“与我联合”。
- source_word: εἰρήνην ἔχητε
  choice: 有平安
  rationale: “平安”既符合上下文中的安稳与慰藉，也保留该词更广的完整、安好的含义；汉语无需另加情态词便可自然表达目的从句。
- source_word: ἐν τῷ κόσμῳ
  choice: 在世上
  rationale: “在世上”是自然现代汉语，同时保留约翰所用“世界/世上”与“在我里面”的对照，不扩写为“堕落的世界体系”。
- source_word: θλῖψιν
  choice: 患难
  rationale: 该词表示压力、苦难、困厄；“患难”在现代汉语中庄重、易懂，并保留原词较重的语义力度。
- source_word: ἔχετε
  choice: 你们有
  rationale: 直接对应现在时陈述，保留其现实且持续的意味，不擅自改成将来时“你们会有”。
- source_word: θαρσεῖτε
  choice: 要有勇气
  rationale: 清楚表达命令语气和面对患难时应有的信心；比“要勇敢”稍能体现内在振作、放心的含义。
- source_word: νενίκηκα
  choice: 我已经胜过了
  rationale: “已经……了”体现完成时所指的决定性胜利及其持续效力；“胜过”也与约翰著作常见用语协调。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: 保留κόσμος的宽广性及约翰式张力，让上下文表明它在此涉及敌对上帝的世界秩序，而不以释义限制其含义。
theological_decisions:
- issue: κόσμος在本节中的含义
  choice: 分别译作“世上”和“世界”，保留同一希腊词的关联及自然汉语表达。
  alternative: 世界体系；这个堕落的世界
  rationale: 原文既指门徒身处的领域，也指耶稣胜过的对象；不加解释性限定，可保留约翰用词的多层含义和神学张力。
- issue: 两个完成时的效力
  choice: 均用“已经”体现已完成且持续有效的行动。
  alternative: 用一般过去表达：“我告诉了”“我胜过了”
  rationale: λελάληκα与νενίκηκα都强调行动已经完成并在当前仍有效；尤其“我已经胜过了世界”在受难事件尚未于叙事中完成时，保留了原文刻意形成的前瞻性张力。
- issue: “在我里面”与“在世上”的对照
  choice: 保留空间性介词表达：“在我里面”与“在世上”。
  alternative: “靠着我”与“生活在这个世界时”
  rationale: 直保留原文结构，使平安的领域或关系与患难的领域形成鲜明对照，不把“在我里面”简化为工具关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难”和“平安”保留经文应有的分量但并不晦涩；“要有勇气”比口语化的“别怕”更贴近原文命令，也避免削弱其劝勉力度。所有脚注标记均置于相关词语之后。
