id: JHN.16.13
reference: John 16:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: zh_hans
  text: 但当他——真理的灵——来到时，他要引导你们进入一切真理。[a]因为他不凭自己说话；他听见什么，就要说什么，并且要把将要来的事告诉你们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切真理中引导你们。”原文介词通常意为“在……中”；在这里与“引导”连用，也可理解为“进入”。
    reason: alternative_reading
  - marker: b
    text: “将要来的事”也可译作“将来的事”或“将要发生的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 然而，当……时
  rationale: ὅταν引出将来取向的时间从句；δέ承接上文并带轻微转折，译作“然而”较自然。
- source_word: ἔλθῃ ἐκεῖνος
  choice: 当他……来到时
  rationale: 不定过去时虚拟式与ὅταν连用，表达将来发生之时；ἐκεῖνος虽与中性名词πνεῦμα同位，却采用阳性形式，保留其人格化指称为“他”。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 那真理的灵
  rationale: 保留属格结构“真理的灵”，不将其解释性改写为“就是真理的灵”；“那”体现冠词及同位说明的明确指称。
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: 要引导你们进入全部真理
  rationale: ὁδηγέω取“引导”；ἐν字面可作“在……中”，但与引导意象结合可表达进入某领域。πάσῃ修饰带冠词的ἀληθείᾳ，故译“全部真理”，而非离散的“每一项真理”。
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: 因为他不是凭自己说话
  rationale: ἀφ’ ἑαυτοῦ直译为“从自己”，汉语以“凭自己”自然表达话语并非自主发出，同时避免增添“权柄”等原文未明说的概念。
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: 而是把所听见的说出来
  rationale: 保留“听见—说出”的接受与传达关系；ὅσα概括所听见的一切内容，不必在汉语中补出“一切”。
- source_word: τὰ ἐρχόμενα
  choice: 将要发生的事
  rationale: 带冠词的现在分词表示正在来临或未来的事；汉语“将要发生的事”自然，但不把它限定为某一类预言事件。
- source_word: ἀναγγελεῖ ὑμῖν
  choice: 要……告诉你们
  rationale: ἀναγγέλλω有宣告、报告、使人知道之义；“告诉”在现代汉语中清楚自然，并保留向门徒传达的方向。
theological_decisions:
- issue: 圣灵的人格指称
  choice: 用“他”指真理的灵
  alternative: 重复“真理的灵”以回避代词，或按πνεῦμα的中性语法形式采用非人格表达
  rationale: 原文以阳性ἐκεῖνος指称中性名词πνεῦμα，明确采用人格化的篇章指称；汉语用“他”最能保存这一现象。
- issue: ἐν τῇ ἀληθείᾳ πάσῃ的方向或范围含义
  choice: 正文译“进入全部真理”
  alternative: “在全部真理中”
  rationale: ἐν通常表示“在……中”，但与“引导”搭配时可呈方向或结果意义。正文采用自然的方向表达，同时以脚注保留形式上更贴近介词的译法。
- issue: ἀφ’ ἑαυτοῦ所表达的关系
  choice: 译作“不是凭自己说话”
  alternative: “不是出于自己说话”或“不是自行说话”
  rationale: 不扩展为“凭自己的权柄”，以免替原文明确其未说明的神学关系；“凭自己”兼顾可懂性与来源、独立性的张力。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。以“他，就是那真理的灵”保存ἐκεῖνος的强调及同位关系；用分号划分听见、说出与告知未来之事的连续动作。所有脚注标记均置于正文相应位置。
