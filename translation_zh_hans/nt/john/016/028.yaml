  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: zh_hans
  text: 我从父那里出来，已经来到世上；我又要离开世界，往父那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: 我从父那里出来
  rationale: ἐξέρχομαι与ἐκ共同表达从父而出的动作及来源。“从父那里出来”在现代汉语中自然，也比单说“来自父”更充分保留原文的移动意象，同时不增添原文未明说的教义解释。
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: 已经来到世上
  rationale: 完成时ἐλήλυθα表示已经完成而仍具当前关联的来到；“已经来到”体现这一点。εἰς表示进入，“世上”是现代汉语中表达进入人类世界的自然说法。
- source_word: πάλιν
  choice: 如今
  rationale: πάλιν通常可作“又、再次”，但此处连接从父而来与离世归父这两个相继且相对的行动；“如今”自然呈现叙述转折与当前阶段，避免让“再次”误示耶稣曾多次离开世界。脚注保留较形式对应的译法。
- source_word: ἀφίημι τὸν κόσμον
  choice: 我要离开这世界
  rationale: 现在时在语境中指即将发生的行动。“我要离开”符合现代汉语表达临近未来的方式；“这世界”作为当前所处并将离开的领域，比重复“世上”更自然。
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: 到父那里去
  rationale: πορεύομαι与πρός表达朝向父的移动。“到父那里去”简洁自然，保留方向与目的地，不扩写为“回到父身边”等原文未明说的内容。
theological_decisions:
- issue: “从父那里出来”所表达的耶稣与父的关系
  choice: 按原文直译为耶稣从父那里出来，并到父那里去
  alternative: 弱化为“从上帝那里来”，或扩写成明确的先存、道成肉身教义陈述
  rationale: 原文明确以“父”为来源和归向，具有重要的基督论含义；译文应保留这一张力与宣告，但不以教义性释义超出经文本身。
- issue: πάλιν在两段行动之间的功能
  choice: 正文译为“如今”，脚注注明“又”或“再次”
  alternative: 正文直接译为“再次”
  rationale: “再次”虽较贴近πάλιν的常见词义，却可能在汉语中被理解为重复离开世界。正文采用语境化的“如今”，脚注保留原词可能的形式对应，避免静默消除歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“父”沿用约翰福音在相关语境中的简洁称谓；用分号清楚呈现从父而来、进入世界，以及离开世界、归向父的对称结构。
