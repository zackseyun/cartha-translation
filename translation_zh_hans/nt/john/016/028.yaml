  verdict: revise
  source_fidelity: 需修订。πάλιν的基本语义是“又、再次”；正文“如今”把重复／再度的语义替换为时间上的“现在”，未能忠实呈现原文。其余各分句准确保留了从父而出、进入世界、离开世界并往父那里去的对称运动；“已经来到”也适当表达完成时的结果关联。
  naturalness: 修订后的“我又要离开世界，往父那里去”是自然、庄重的现代汉语。“又要”既保留πάλιν，也在上下文中自然表示随后的另一行动；不必把原文的简洁表达扩展为教义性说明。
  terminology: “父”“世界”符合约翰福音语境且前后一致。“从父那里出来”可保留ἐξῆλθον ἐκ所含的动作和来源；“往父那里去”准确表达πρὸς的趋向。
