  to: 我从父那里出来，已经来到世上；我又要离开世界，往父那里去。
  rationale: 将πάλιν由“如今”修订为“又”，以保留原文的重复／再度及连接语义，同时采用“又要”自然表达现在时所指向的即将发生之事。脚注应在“又”后标注[a]，完整排版为：“我从父那里出来，已经来到世上；我又[a]要离开世界，往父那里去。”其余措辞无需改动。
