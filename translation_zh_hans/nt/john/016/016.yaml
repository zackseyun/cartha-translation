id: JHN.16.16
reference: John 16:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: zh_hans
  text: 过不多时，你们就不再看见我；再过不多时，你们还会看见我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在前后两处“看见”用了两个不同的希腊语动词：第一处是θεωρέω，第二处是ὁράω。两者可能略有语气差别，但意义多有重叠；本节主要强调时间上的对照，因此正文均译作“看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: 过不多时
  rationale: 中性单数形容词在此作副词性时间表达，指一段短暂时间；“过不多时”自然、庄重，也保留两处重复形成的平衡。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达从某一时点起停止某种状态或经历。
- source_word: θεωρεῖτέ
  choice: 看见
  rationale: 此处指门徒看见耶稣；虽然该词可带观看、观察的意味，但上下文不足以要求与后面的ὁράω作明确语义区分。
- source_word: πάλιν
  choice: 再
  rationale: 表示随后情形再次发生或出现逆转，与第二个时间短语自然衔接。
- source_word: ὄψεσθέ
  choice: 还会看见
  rationale: ὁράω的将来时形式，在此自然表示将来的看见；“会”体现将来意义，“还”与“再过不多时”共同传达再次看见。
- source_word: με
  choice: 我
  rationale: 作两个视觉动词的宾语，指说话者耶稣。
- source_word: καὶ
  choice: ；／再
  rationale: 希腊文反复使用καὶ连接平衡分句；中文以分号和“再”表达其并列及时间推进关系，避免生硬重复“并且”。
theological_decisions:
- issue: 是否用不同中文动词区分θεωρέω与ὁράω，从而暗示两种不同的“看见”
  choice: 正文两处均译为“看见”，并以脚注说明原文用词不同
  alternative: 第一处译“见到”或“观看”，第二处译“看见”
  rationale: 两个希腊动词在约翰著作中的意义有相当重叠；若强行区别，容易加入原文并未明确表达的神学解释。经文首要凸显的是“不再看见”与“还会看见”的时间性对照。
- issue: “再过不多时，你们还会看见我”具体指复活显现、圣灵中的经历，还是末后再临
  choice: 保持经文本身开放，不在正文中限定所指事件
  alternative: 明确译成复活后或再临时的看见
  rationale: 本节只陈述短暂离别与再次相见，没有在句内明确界定其实现方式；翻译不应替正文消除这一解释张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“过不多时……再过不多时”保留原文重复和节奏；“不再……还会……”清楚呈现转折性的时间对照。脚注标记置于整句之后，以说明两处“看见”的共同翻译。
