id: JHN.16.29
reference: John 16:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: zh_hans
  text: 他的门徒说：“你看，现在你说得明明白白[a]，也不说任何隐晦的话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坦率地”或“公开地”。希腊文可指公开、直白或坦率地说话。
    reason: lexical_alternative
  - marker: b
    text: 或译“比喻”“格言”或“含蓄的说法”。这里指比喻性或间接、隐晦的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: 说
  rationale: 希腊文是叙事中的历史现在时；现代汉语用“说”自然地引出直接引语，不必刻意标示进行状态。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 自然、准确地表达所属关系，并延续上下文中的指称。
- source_word: Ἴδε
  choice: 你看
  rationale: 作为引起注意的语气词，“你看”符合现代汉语对话习惯，也保留了原文提示对方注意当前变化的作用。
- source_word: νῦν
  choice: 现在
  rationale: 直接保留时间副词，表明门徒认为耶稣此刻的说话方式有所不同。
- source_word: ἐν παρρησίᾳ
  choice: 明明白白
  rationale: 本节与“隐晦的话”形成对照，重点是表达公开、清楚、不隐晦；“明明白白”在现代汉语中自然，并保留“坦率、公开”这一语义范围于脚注。
- source_word: λαλεῖς
  choice: 你说得
  rationale: 以汉语补语结构“说得明明白白”自然表达正在呈现的说话方式。
- source_word: παροιμίαν
  choice: 隐晦的话
  rationale: 在《约翰福音》的语境中，该词不只指格言，也可指比喻、寓意或间接隐晦的说法；“隐晦的话”最能呈现它与“明明白白”之间的对照，同时在脚注保留其他可能译法。
- source_word: οὐδεμίαν
  choice: 不说任何
  rationale: “任何”配合否定词，保留原文全面否定的力度。
- source_word: λέγεις
  choice: 说
  rationale: 按原词的基本意义译为“说”，与宾语“隐晦的话”搭配自然，也保留两处分属不同动词的表达。
theological_decisions:
- issue: ἐν παρρησίᾳ与παροιμία的对照
  choice: 理解为耶稣说得清楚直白，不采用隐晦或间接的表达
  alternative: 理解为耶稣勇敢、坦率或公开地说话
  rationale: 本句将ἐν παρρησίᾳ直接与“不说任何παροιμία”并列对照，因此语境首先关乎表达是否清楚、直接，而不是说话者是否勇敢；脚注仍保留“坦率、公开”的词义可能。
translation_notes:
  register: 采用现代、庄重而口语自然的对话表达。“你看”保留原文引起注意的语气；“明明白白”与“隐晦的话”构成清晰对照。所有脚注标记均置于所注释的词语之后。
