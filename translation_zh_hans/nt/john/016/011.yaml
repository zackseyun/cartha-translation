  text: περὶ δὲ κρίσεως, ὅτι ὁ ἄρχων τοῦ κόσμου τούτου κέκριται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: zh_hans
  text: 至于审判，是因为这世界的统治者[a][b]已经受了审判。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这世界的掌权者”。
    reason: lexical_alternative
  - marker: b
    text: 这称号很可能指撒但；参见约翰福音12:31；14:30。
    reason: cross_reference
  - marker: c
    text: 也可译为“已被判定”。希腊文为完成时，强调审判已经发生，其效力仍然持续。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: 至于审判
  rationale: περί加属格引出论题；δέ承接前文。中文以“至于”自然延续“罪、义、审判”的并列次序，无须生硬加入“并且”。
- source_word: ὅτι
  choice: 是因为
  rationale: 此处ὅτι说明圣灵使世人为审判而知罪的理由；“是因为”明确表达因果关系。
- source_word: ὁ ἄρχων
  choice: 统治者
  rationale: ἄρχων指掌权或施行权柄者。“统治者”是现代中文中直接、清楚的对应词，也避免“王子”可能造成的身份误解。
- source_word: τοῦ κόσμου τούτου
  choice: 这世界的
  rationale: κόσμος在约翰福音中通常译作“世界”；这里保留原文指示语“这”，忠实呈现τοῦ κόσμου τούτου。
- source_word: κέκριται
  choice: 已经受了审判
  rationale: 这是κρίνω的完成时被动直陈式。“已经受了审判”保留被动语态，并表达审判已经发生、其结果持续有效；不直接译成“已经被定罪”，以免缩窄词义。
theological_decisions:
- issue: “这世界的统治者”的身份
  choice: 正文保留称号，不直接写成“撒但”
  alternative: 撒但，这世界的统治者
  rationale: 约翰福音12:31和14:30表明这称号很可能指撒但，但本节本身只使用称号。正文不补入专名，脚注提供可能的身份及交叉经文。
- issue: κέκριται所表达的审判性质
  choice: 已经受了审判
  alternative: 已经被定罪；如今已被判定有罪
  rationale: κρίνω在此语境中包含不利审判的意味，但原词本身比“定罪”范围更宽。译文保留其词义张力，并以脚注说明完成时的持续结果。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于……是因为……”贴合本段排比结构；“统治者”清晰表达权柄含义。所有补充解释均置于脚注，正文保留原文的简洁与神学张力。
