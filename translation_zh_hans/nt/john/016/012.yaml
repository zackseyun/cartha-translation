base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: zh_hans
  text: “我还有许多事要对你们说，但你们现在承受不了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受不了”也可译作“负荷不了”或“忍受不了”。原文动词可表示负载、承担或忍受。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: 还
  rationale: 表示到目前为止仍有尚未说出的内容；“还”符合现代汉语表达，也自然衔接上下文。
- source_word: πολλὰ
  choice: 许多事
  rationale: 中性复数形容词在此作名词使用；译作“许多事”明确其隐含对象，又不增添具体内容。
- source_word: ἔχω
  choice: 有
  rationale: ἔχω与不定式连用，表达仍有某事待说；“有……要……”自然保留这一结构。
- source_word: ὑμῖν λέγειν
  choice: 要对你们说
  rationale: λέγειν含义宽泛，ὑμῖν标明说话对象；“对你们说”比“告诉你们”更贴近原文而较少解释色彩。
- source_word: ἀλλ’
  choice: 但
  rationale: 直接表达转折，简洁自然。
- source_word: οὐ δύνασθε
  choice: 不了
  rationale: 与“承受”构成可能补语，地道表达当下没有这种能力；没有将其改释为单纯“不明白”。
- source_word: βαστάζειν
  choice: 承受
  rationale: 保留原词关于负载、承担或忍受的比喻空间，可同时涵盖认知、情感和属灵层面的容量，而不把含义限定为“理解”或“忍耐”。
- source_word: ἄρτι
  choice: 现在
  rationale: 明确当前时点，并与后文将要发生的事形成时间对照。
theological_decisions:
- issue: 门徒目前不能βαστάζειν更多教导的具体含义
  choice: 译作“承受不了”，保留他们目前无法负荷更多教导的宽泛含义。
  alternative: 译作“不能明白”或“忍受不了”。
  rationale: 原文动词可以表示负载、承担或忍受；上下文可能涉及理解能力，也可能涉及情感和属灵承受力。采用“承受不了”可保留这种张力，不将经文限定为纯粹认知或纯粹情绪层面的无能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“我还有许多事要对你们说”贴近原文结构；“承受不了”在现代汉语中自然，并保留原文比喻及其含义范围。脚注标记紧随其所说明的词语。
