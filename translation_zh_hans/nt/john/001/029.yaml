  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: zh_hans
  text: 第二天，约翰看见耶稣向他走来，就说：“看，神的羔羊，那除去世人的罪的！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 第二天
  rationale: 自然、准确地表达次日，承接上文叙事。
- source_word: βλέπει
  choice: 看见
  rationale: 保留历史现在时的叙事生动性所表达的动作，同时按现代汉语叙事习惯处理。
- source_word: ἐρχόμενον πρὸς αὐτόν
  choice: 向他走来
  rationale: 准确表达朝约翰而来的方向，并比“来到他那里”更自然。
- source_word: Ἴδε
  choice: 看
  rationale: 保留引人注目的祈使语气，用现代读者容易理解的表达，避免过于古雅的“看哪”。
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: 神的羔羊
  rationale: 保留属格结构及其浓厚的祭献和神学意象，不擅自限定为某一种解释。
- source_word: ὁ αἴρων
  choice: 那除去……的
  rationale: αἴρω可有“拿走、除去”之意；此处译为“除去”，保留其对罪之处理的核心含义。
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: 世人罪
  rationale: 原文“罪”为单数，指作为整体的罪；κόσμος在此涉及全人类世界，译作“世人”使中文自然，同时不译成复数“罪恶”。
theological_decisions:
- issue: “神的羔羊”的具体所指
  choice: 直译为“神的羔羊”
  alternative: 解释性译为“神所预备的祭牲”或明确指向逾越节羔羊
  rationale: 原文意象可能唤起献祭、逾越节、受苦仆人等多重经文背景；正文不应将其收窄为单一解释。
- issue: αἴρων的语义
  choice: 除去
  alternative: 担当／背负
  rationale: 该词既可表示“拿起、背负”，也可表示“拿走、除去”。本句传统且语境适切的理解是“除去”，但不额外说明其实现方式，以免消解神学张力。
- issue: κόσμος的范围
  choice: 世人
  alternative: 世界
  rationale: 这里指向人类世界及其罪；“世人罪”在现代汉语中比“世界的罪”更清楚，但仍保留普世范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“神的羔羊”这一核心圣经意象和“罪”的单数整体性；引语以“看”传达Ἴδε的提示与强调。
