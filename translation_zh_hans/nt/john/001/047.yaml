base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: zh_hans
  text: 耶稣看见拿但业向他走来，就说起拿但业来：“看，这真是一个以色列人，他心里没有诡诈。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: 看
  rationale: 保留引人注意的命令语气，同时采用现代汉语中简洁自然的表达。
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: 这真是个以色列人
  rationale: ἀληθῶς修饰“以色列人”，强调他名副其实；此译法自然地传达这一判断。
- source_word: ἐν ᾧ δόλος οὐκ ἔστιν
  choice: 他心里没有诡诈
  rationale: ἐν ᾧ直译为“在他里面”，这里指人的内在品格；“心里”符合现代汉语表达，而“诡诈”保留δόλος所指的欺骗、奸诈意味。
- source_word: λέγει περὶ αὐτοῦ
  choice: 就谈到他说
  rationale: 保留περὶ αὐτοῦ“关于他、谈到他”的含义，避免将其误解为直接对拿但业说话。
theological_decisions:
- issue: “真是个以色列人”的含义
  choice: 保留耶稣对拿但业内在真实和无诡诈品格的直接称许
  alternative: 解释为“真正属灵的以色列人”或特定的救恩论身份
  rationale: 原文没有明说后者；译文不加入宗派性或体系化解释，以保留文本本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谈到他说”略带书面感，用以清楚区分“论到他”与“对他说”；引语简洁有力。
