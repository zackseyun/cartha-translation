  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: zh_hans
  text: 他在世界中，世界借着他而有[a]，世界却不认识他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世界是借着他造成的。”希腊语动词意为“成为”或“开始存在”。
    reason: lexical_alternative
  - marker: b
    text: “不认识他”也可含有“没有认出他”或“不承认他”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: 世界
  rationale: 本节三次使用 κόσμος。统一译作“世界”，既保留其对受造界的指向，也容纳约翰语境中“世人”及与神疏离之世界的意味，避免在某一处过早收窄含义。
- source_word: ἦν
  choice: 在
  rationale: 未完成时 ἦν 表明持续的存在状态；“他在世界中”以自然的现代汉语表达“他当时身处世界”，又不以“曾”暗示后来必然不再如此。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά 加属格表达媒介或中介作用。“借着他”清楚保留这一关系，也与约翰福音1:3的创造表述相呼应。
- source_word: ἐγένετο
  choice: 而有的
  rationale: ἐγένετο 指开始存在、成为。“而有的”在现代汉语中简洁表达世界借着他而存在的起源，并与前句表示持续存在的 ἦν 保持区别；“造成的”列入脚注作为更明确的创造性译法。
- source_word: ἔγνω
  choice: 不认识
  rationale: γινώσκω 的基本义是“认识、知道”。上下文也可能包含“认出”或“承认”的意味；正文用“不认识”保留较宽的约翰式含义，其他可能性置于脚注。
- source_word: αὐτοῦ / αὐτόν
  choice: 他
  rationale: 代词回指上文的“道”。译作男性人称代词“他”，保留希腊文在语篇中明确的位格性指向。
theological_decisions:
- issue: 省略主语所指是谁
  choice: 以“他”补出主语，指向紧接上文的“道”
  alternative: 若孤立地把“道”理解为抽象概念，可用非人称表达
  rationale: 本节希腊文虽没有再次写出主语名词，但上文已将“道”作为有位格的行动者叙述。用“他”遵循上下文，不把这位借着他世界得以存在者非人格化。
- issue: “道”的先存与世界的受造
  choice: 用“在”对应 ἦν，用“而有的”对应 ἐγένετο，以保留两个动词的区别
  alternative: 将后半句译作“世界是借着他造的”
  rationale: 序言刻意区分“存在”与“开始存在”。正文保留这一语言张力，表达世界的起源，却不额外加入原文没有的后期教义术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三次 κόσμος 均译作“世界”，保留原文的反复及多层含义；句中以“却”呈现末一分句的反差。脚注标记均紧随其所说明的词句。
