  rationale: 修订仅使正文清楚呈现ἐκ所表达的来源关系，并将标点调整为不额外加强语气。脚注保留εἶναι的较直译表达，说明正文“出”是为适应汉语而采用的来源性表达；不改变拿但业问题的怀疑性反问，也不加入更强的轻蔑含义。
