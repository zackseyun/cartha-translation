  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: zh_hans
  text: 拿但业对他说：“拿撒勒能出什么好东西吗？”腓力对他说：“你来看看。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: 拿但业对他说
  rationale: 用自然的现代汉语叙事表达简单连接词καὶ及“对他说”的结构；本节紧接上文，无须机械译出“于是/并且”。人名按通行译法作“拿但业”。
- source_word: Ἐκ Ναζαρὲτ
  choice: 拿撒勒……
  rationale: ἐκ表示来源；在汉语疑问句“能有什么……吗”中，地点直接作话题即可自然表达“从拿撒勒而来”的来源含义。地名采用通行译法“拿撒勒”。
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: 能有什么好东西吗
  rationale: 保留δύναμαι所表达的可能性及反问语气；τι ἀγαθόν自然译为“什么好东西”。此表达清楚传达“会有任何好事物存在/出现”的意思，同时保持拿但业的怀疑态度。
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: 腓力对他说
  rationale: 希腊文使用历史现在时λέγει；现代汉语叙事不必用显式时态变化。“对他说”准确表达与格代词。人名采用通行译法“腓力”。
- source_word: Ἔρχου καὶ ἴδε
  choice: 你来看看
  rationale: “来看看”是自然、简洁的现代汉语邀请语，既保留两个命令动作，也保留约翰福音中“看见”所可能具有的认识意味；加入“你”使直接引语自然，但未增添实质信息。
theological_decisions:
- issue: 拿但业提问的语气
  choice: 译作直接的反问“拿撒勒能有什么好东西吗？”
  alternative: “从拿撒勒能有什么好东西出来呢？”或更直译为“拿撒勒能有任何好东西吗？”
  rationale: 原文显出怀疑，却没有明确标示讥讽或轻蔑的强度；译文保留反问力度，不额外加入贬斥语气。
- issue: εἶναι与ἐκ Ναζαρὲτ的关系
  choice: 正文采用汉语惯用表达，并以脚注保留“来自拿撒勒”的较直译形式
  alternative: 在正文中明确译作“能有任何好东西来自拿撒勒吗？”
  rationale: εἶναι本义为“是、存在”，并非字面上的“出来”；但ἐκ标明来源。正文追求自然表达，脚注则让读者看见原文结构及其可能的翻译方式，避免把“出来”误认作原文动词。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“你来看看”口吻自然，符合面对面的邀请；感叹号表达命令式邀请的鲜明语气，但不将其夸大为斥责。
