    rationale: 两个祈使语气构成明确邀请，但原文没有独立的情绪标记；以句号呈现仍保留邀请和命令的力度，也较为克制。
  revised_text: 拿但业对他说：“拿撒勒能出什么好东西吗？”腓力对他说：“你来看看。”
