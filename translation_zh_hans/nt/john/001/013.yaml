  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: zh_hans
  text: 这些人并非由血缘所生，也不是出于肉体的意愿，也不是出于男人的意愿，而是由神所生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ
  choice: 这些人
  rationale: 关系代词承接上一节所说的人；汉语用“这些人”可自然延续指代。
- source_word: ἐξ αἱμάτων
  choice: 从血缘
  rationale: αἱμάτων是不同寻常的复数形式，语境中指天然血缘或人的生育来源；“血缘”在现代汉语中清楚自然，复数这一形式特征在脚注说明。
- source_word: θελήματος
  choice: 意愿
  rationale: 保留原文两次重复的“意愿”，既可涵盖欲望，也可涵盖意志或决定，而不把含义限定得过窄。
- source_word: σαρκὸς
  choice: 肉体
  rationale: 保留σάρξ的具体用语及其神学张力；本处语境涉及人天然的生育冲动或能力，并非直接等同于“罪性”。
- source_word: ἀνδρὸς
  choice: 男人
  rationale: ἀνήρ在这里指成年男性，可能特指男性在生育中的意愿或作用；“男人”保留其性别和单数含义，避免泛化为“人”。
- source_word: ἐκ θεοῦ
  choice: 从神
  rationale: 自然表达来源，并与前面三个被否定的人间来源形成鲜明对照。
- source_word: ἐγεννήθησαν
  choice: 生的
  rationale: γεννάω的被动形式在此可自然译为“生的”，既表达出生，也容纳“由……所生”的来源含义。
theological_decisions:
- issue: 人的天然来源与从神而生之间的对比
  choice: 经文否定血缘、肉体意愿和男人意愿是这种出生的来源，并肯定其来源是神。
  alternative: 也可将重点较窄地理解为排除族裔血统，或按后来的传统赋予更具体的圣礼性、重生论或形而上解释。
  rationale: 三重否定与末尾“而是从神”的转折，最直接地构成人的自然生育与神所赐之出生的对比；译文不进一步规定其宗派性机制。
- issue: “肉体”在本节中的含义
  choice: 保留“肉体”，让其在生育语境中指向人的天然欲望或能力。
  alternative: 可解释性地译为“人的本性”或“身体的欲望”。
  rationale: 直译“肉体”可避免把σάρξ预先解释成某一套特定神学概念，同时保留原文与“男人的意愿”之间并不完全相同的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留三重否定的平行结构和“肉体／男人”之间的区别；“从血缘”兼顾自然表达与原文所指，异常复数在脚注交代。
