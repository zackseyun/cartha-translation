source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: zh_hans
  text: 他们又问他：“那么，你是以利亚吗？”他说[b]：“我不是。”“你是那位先知[a]吗？”他回答：“不是。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那先知”；这里很可能指人们所期待的、像摩西一样的先知（申18:15、18）。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“他说”，使用历史现在时，使叙述更有现场感。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 问
  rationale: 不定过去时在这里直接引出问话；“问”符合现代汉语叙事习惯，不额外加入审问或盘问的意味。结合 καί 译作“又问”，体现问话承接上文。
- source_word: Τί οὖν;
  choice: 那么
  rationale: 这是承接前文否认而提出后续问题的简短表达；汉语用“那么”自然保留其推接关系和简洁语气。
- source_word: σὺ Ἠλίας εἶ
  choice: 你是以利亚吗
  rationale: 按现代汉语疑问句表达；“你”体现原文显式人称代词，专名采用通行译名“以利亚”。
- source_word: Οὐκ εἰμί
  choice: 我不是
  rationale: 保留原文否定系词的简短、直接，不补出原文没有的宾语。
- source_word: Ὁ προφήτης
  choice: 那位先知
  rationale: 定冠词指向一个问话双方所知的特定、受期待的人物；“那位先知”既体现特指，也不在正文中断定其具体身份。
- source_word: λέγει
  choice: 他说
  rationale: 原文为叙事中的历史现在时。正文采用现代汉语自然叙事形式“他说”，并以脚注说明希腊文时态所带来的现场感。
- source_word: ἀπεκρίθη
  choice: 他回答
  rationale: 采用标准、自然的叙事应答用语。
- source_word: Οὔ
  choice: 不是
  rationale: 独立否定词是对身份问题的直接否定；汉语以“不是”回应“你是……吗”比单说“不”更自然，同时保持简短。
theological_decisions:
- issue: “那位先知”的身份
  choice: 正文译作“那位先知”，不作解释性扩展。
  alternative: 直接译成“那位像摩西的先知”，或泛化为“一位先知”。
  rationale: 原文定冠词表明这是特定且受期待的人物，很可能使人联想到申命记18:15、18，但正文不应替读者完全确定其所指。
- issue: 约翰否认自己是以利亚
  choice: 直译为“我不是”，不加限定。
  alternative: 扩写为“我不是以利亚本人”，或按其他经文作协调性解释。
  rationale: 本节呈现的是约翰直接的否认；翻译应保留这一表述及其与其他经文之间可能形成的神学张力，不在正文中予以调和。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。连续问答保持原文短促的节奏。脚注标记按其实际解释对象放置：[a]置于“那位先知”之后，[b]置于“他说”之后。
