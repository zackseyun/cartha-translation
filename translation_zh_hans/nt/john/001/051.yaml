  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: zh_hans
  text: 他对他说：“我实实在在地告诉你们[a]：你们将看见天已经敞开着，上帝的天使在人子身上上去下来。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说耶稣对“他”（单数）说话，随后“告诉你们”和“你们将看见”都用复数，表明这番话的对象不只眼前这一人。
    reason: lexical_alternative
  - marker: b
    text: 这里的景象呼应《创世记》28:12中雅各的梦；此处天使的上去下来以人子为中心。
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 以现代汉语中庄重而自然的固定表达传达双重“阿们”的郑重、强调语气；不在正文中音译，以免普通读者误解。
- source_word: ὑμῖν / ὄψεσθε
  choice: 你们 / 你们将看见
  rationale: 两个形式在希腊文中均为复数；简体中文可以直接显明这一点，并保留叙事中由对“他”说话转向对“你们”宣告的变化。
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: 天敞开
  rationale: 完成时分词描绘天已经开启而处于敞开状态；“敞开”比单纯“开了”更能保留这一状态含义，同时符合现代汉语表达。
- source_word: τοὺς ἀγγέλους τοῦ θεοῦ
  choice: 上帝的天使
  rationale: 在属天异象及《创世记》背景中，ἀγγέλους 指超自然的天使，而非一般使者。
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: 上去下来
  rationale: 保留两个方向相反的动作及其对《创世记》28:12的呼应；表达直白自然，不另加解释。
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 在人子身上
  rationale: 较直接地保留 ἐπί 加宾格所呈现的关系意象，不将其解释为“围绕”“借着”或其他神学性释义。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用这一具有经文互文和末世意涵的称号，不以“那位人”之类释义改写。
theological_decisions:
- issue: 叙事中的单数受话者与耶稣话语中的复数听众之间的转换
  choice: 正文明确译作“对他说”与“告诉你们……你们将看见”，并加脚注说明
  alternative: 将复数泛化为不标数目的“你”，或把“他”直接解释为拿但业
  rationale: 希腊文清楚地从单数 αὐτῷ 转为复数 ὑμῖν、ὄψεσθε；中文能够自然保留这一有释经意义的转换。
- issue: 天使上去下来与雅各之梦的互文关系
  choice: 正文只保留原有意象，脚注指出《创世记》28:12的呼应
  alternative: 在正文中加入梯子、通道或耶稣取代梯子等解释
  rationale: 原文没有明说梯子，也没有展开这一意象的神学含义；译文应保留互文张力而不替读者作出单一解释。
- issue: ἐπί 所表达的天使与人子之间的空间或关系意象
  choice: 译作“在人子身上”
  alternative: 译作“在人子上方”“围绕人子”或“借着人子”
  rationale: “在人子身上”最直接保留原文措辞及其不寻常之处，避免把隐含关系预先解释为位置、环绕或中介功能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“实实在在地”传达双重“阿们”的郑重语气；“天敞开”和“上去下来”保留异象的具体动态，不在正文中扩展其神学解释。
