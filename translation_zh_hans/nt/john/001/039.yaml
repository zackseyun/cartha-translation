  to: 他对他们说：“你们来，就会看见。”于是他们去了，看见他住在哪里；那一天他们就留在他那里。那时约是第十时[a]。
  rationale: 将“那一天便和他住在一起”改为“那一天他们就留在他那里”，以准确传达μένω与παρ’ αὐτῷ所指当天在耶稣处停留、与他同在的意思，避免现代汉语“住在一起”可能带出的长期共同居住含义。其余译文及脚注可保留。
