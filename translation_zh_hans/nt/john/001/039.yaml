  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: zh_hans
  text: 他对他们说：“你们来，就会看见。”于是他们去了，看见他住在哪里；那一天他们就留在他那里。那时约是第十时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若从日出算起，约为下午四点；有人认为这里按罗马计时法计算，约为上午十点。
    reason: 原文没有说明“第十时”所采用的计时制度，因此列出两种主要理解。
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: 你们来
  rationale: 这是现在时中间语态命令式复数，在此用作邀请；“你们来”直接自然，不额外添加原文没有的语气。
- source_word: ὄψεσθε
  choice: 就会看见
  rationale: 保留将来时的意义；“就”自然表达来与看见之间的承接关系，同时没有把邀请改成命令性的结果保证。
- source_word: ἦλθαν οὖν
  choice: 于是他们去了
  rationale: οὖν表示顺承结果，译为“于是”；ἦλθαν字面可译“来了”，但从叙事中门徒回应邀请并前往耶稣住处的视角看，“去了”更符合现代汉语。
- source_word: εἶδαν
  choice: 看见
  rationale: 采用直接对应词，并与前面的“会看见”形成原文ὁράω词根的呼应。
- source_word: ποῦ μένει
  choice: 他住在哪里
  rationale: 本处μένω指耶稣当时居住或落脚的地方；“住在哪里”自然明白，又不擅自限定为旅店或永久住所。
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: 和他住在一起
  rationale: παρά加与格表示与他同在，ἔμειναν表示停留、住下；此译兼顾陪伴和留住之意，也与前面的“住”保持词语呼应。
- source_word: τὴν ἡμέραν ἐκείνην
  choice: 那一天
  rationale: 按原文保留时间表达，不增译为“那天余下的时间”或“整整一天”。
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: 那时约是第十时
  rationale: 保留原文按序数报时的表达，并以“约”对应ὡς，不在正文中确定原文未说明的计时制度。
- source_word: λέγει αὐτοῖς
  choice: 他对他们说
  rationale: λέγει是叙事性历史现在时；现代汉语叙事无需显式标注时态，译文自然呈现为当时发生的言说。
theological_decisions:
- issue: “第十时”的计时方法
  choice: 正文保留“第十时”
  alternative: 若从日出计时，约为下午四点；若按一种罗马计时理解，约为上午十点
  rationale: 原文没有说明采用哪一种计时制度。正文不替读者裁定，脚注列出主要理解，以保留真实的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第十时”略带古代计时色彩，是为保留原文形式；脚注帮助现代读者理解。正文中的脚注标记紧随相关时间表达。
