  naturalness: 整体流畅、庄重。“那一天便和他住在一起”略显累赘，且“住在一起”易引起不必要的长期共同居住联想；“那一天他们就留在他那里”更自然准确。
  terminology: “第十时”恰当地保留古代计时表达；脚注准确呈现日出计时与罗马计时两种主要理解，且不在正文中裁定。
