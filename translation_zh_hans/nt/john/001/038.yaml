id: JHN.1.38
reference: John 1:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: zh_hans
  text: 耶稣转过身来，看见他们跟着，就问他们：“你们在寻求什么？”他们说：“拉比（翻译出来就是‘老师’）[a]，你住在哪里？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉比”是希伯来语或亚兰语称谓，意思是“老师”。
    reason: cultural_note
  - marker: b
    text: “住”所译的希腊词，也可译作“停留”或“常在”；约翰福音其他地方常用这个词表达“常在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 转过身来
  rationale: 准确表达转身的动作，又不额外限定具体方向，符合现代汉语叙事习惯。
- source_word: θεασάμενος
  choice: 看见
  rationale: 表达有意识的视觉注意；“看见”简洁自然，不额外加入“留意到”等解释。
- source_word: ἀκολουθοῦντας
  choice: 跟着
  rationale: 既符合此处实际跟随耶稣的场景，也不排除约翰叙事中逐渐显出的门徒含义。
- source_word: Τί ζητεῖτε;
  choice: 你们在寻求什么？
  rationale: ζητέω既可指寻找，也可指追求或渴求；“寻求”保留此处日常问话与潜在深层含义之间的张力。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留犹太称谓的音译，因为原文随即提供解释；这也使叙事的文化背景清楚可见。
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: 翻译出来就是‘老师’
  rationale: 自然地重现作者给读者的解释。“老师”准确传达呼格 Διδάσκαλε 在此作为称谓的功能。
- source_word: ποῦ μένεις;
  choice: 你住在哪里？
  rationale: 此处 μένω 的直接语境是询问耶稣住处；“住在哪里”是自然的现代汉语，同时以脚注提示该词在约翰福音中的更广词义。
theological_decisions:
- issue: 约翰福音中 μένω 后来具有重要神学分量，而此处首先是实际询问
  choice: 你住在哪里？
  alternative: 你停留在哪里？／你常住在哪里？
  rationale: 按眼前对话，门徒是在问耶稣的住处。正文采用自然的情境义，不把后文充分发展的“住在／常在”主题提前强加于此；脚注则保留词语联系。
- issue: ζητέω 可能兼有普通寻找和属灵寻求的双层意味
  choice: 你们在寻求什么？
  alternative: 你们在找什么？
  rationale: “寻求”在现代汉语中仍然清楚可懂，并能比“找”更好地保留约翰叙事可能蕴含的深层追问，而不把该层含义说死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们在寻求什么”保留约翰文体可能具有的双层意味；“你住在哪里”则顺应具体对话场景。括号重现原文作者的解释，脚注标记均置于正文相应位置。
