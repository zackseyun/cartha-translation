  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: zh_hans
  text: 他先找到了自己的兄弟西门，对他说：“我们已经找到弥赛亚了。”（“弥赛亚”译出来就是“受膏者”[a]。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”传统上译作“基督”。原文将闪语称号“弥赛亚”解释为其希腊语对应词“受膏者”。
    reason: 说明原文括注的跨语言释译关系，并交代中文读者熟悉的传统译名。
lexical_decisions:
- source_word: εὑρίσκει
  choice: 找到
  rationale: 希腊文用历史现在时叙事；现代汉语在这里用完成性表达“找到”更自然，也忠实传达事件。
- source_word: οὗτος
  choice: 他
  rationale: 该指示代词承接上文的安得烈；汉语叙事用“他”自然清楚。
- source_word: πρῶτον
  choice: 先
  rationale: 保留其时间或次序含义，表明他首先采取的行动。
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: 自己的兄弟
  rationale: “自己”保留ἴδιον的强调；“兄弟”不擅自断定西门比安得烈年长或年幼。
- source_word: Σίμωνα
  choice: 西门
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 自然呈现历史现在时，并保留“向他说话”的直接结构。
- source_word: Εὑρήκαμεν
  choice: 我们找到了
  rationale: “了”体现完成时所表达的发现已经实现，并与当前宣告相关。
- source_word: Μεσσίαν
  choice: 弥赛亚
  rationale: 音译这个源自闪语的称号，保留当时的犹太背景及原文随后加以翻译的结构。
- source_word: μεθερμηνευόμενον
  choice: 翻译出来就是
  rationale: 明确表示作者正在把“弥赛亚”译成希腊语对应称号，而不只是作宽泛解释。
- source_word: χριστός
  choice: 受膏者
  rationale: χριστός在此是对Μεσσίας的希腊语语义对应词；译为“受膏者”可使中文读者看出括注的解释作用。
theological_decisions:
- issue: 弥赛亚称号及其希腊语对应词的译法
  choice: 正文用“弥赛亚”，括注用“受膏者”
  alternative: “弥赛亚……翻译出来就是基督”
  rationale: 原文先保留闪语称号Μεσσίας，再用希腊语χριστός翻译。中文若两处都作“弥赛亚”，会抹去括注的解释作用；以“受膏者”表达χριστός的词义，既保留关系，也不把后来的专名化用法强加于本句。脚注同时交代传统译名“基督”。
- issue: ἀδελφός是否标明长幼
  choice: 兄弟
  alternative: 哥哥；弟弟
  rationale: 原文只说明男性手足关系，并未交代西门与安得烈的长幼，因此不作超出文本的判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自己的兄弟”略带书面色彩，但可避免现代汉语“哥哥／弟弟”所要求、而原文未提供的长幼判断。引语末用感叹号体现发现弥赛亚时宣告的力度，但不增加额外命题。
