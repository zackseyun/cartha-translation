  to: 他先找到了自己的兄弟西门，对他说：“我们已经找到弥赛亚了。”（“弥赛亚”译出来就是“受膏者”[a]。）
  rationale: 修订仅处理标点结构、表达自然度和语气审慎性，不改变经文含义。“自己的兄弟”保留ἴδιον的强调而不判断长幼；“弥赛亚……受膏者”保留原文先用闪语称号、后以希腊语释译的结构。
