  naturalness: “他先找到了自己的兄弟西门，对他说”自然、庄重。“我们找到弥赛亚了！”可以理解，但“我们已经找到弥赛亚了。”更平稳地表达完成时及其现时关联，也不额外以感叹号强化原文未标出的语气。
  terminology: “弥赛亚”对应Μεσσίας，“受膏者”对应χριστός，术语处理恰当；脚注可简洁说明“基督”为传统译名及原文的跨语言释译关系。
