  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: zh_hans
  text: 拿但业对他说：“你怎么认识我？[a]”耶稣回答他说：“腓力叫你以前，我看见你在无花果树下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“你从哪里认识我？”
    reason: Πόθεν字面为“从哪里”；在此与γινώσκεις连用，是询问认识的来源或根据，正文以自然的汉语译作“怎么认识我”。
lexical_decisions:
- source_word: Πόθεν
  choice: 怎么
  rationale: Πόθεν本义为“从哪里”，但与γινώσκεις连用时是在询问耶稣认识拿但业的途径或根据。“怎么”是现代汉语中自然、准确的表达；字面形式另列脚注。
- source_word: γινώσκεις
  choice: 认识
  rationale: 此处指对一个人的认识或了解。“认识”比单用“知道”更符合汉语中谈论个人相识的习惯。
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: 回答他说
  rationale: 保留原文“回答”和“说”两个动词，同时符合较庄重的现代汉语叙事表达。
- source_word: Πρὸ τοῦ ... φωνῆσαι
  choice: ……叫你以前
  rationale: Πρὸ τοῦ加不定式明确表示先后时间；此译法简洁地表达腓力呼叫拿但业之前。
- source_word: φωνῆσαι
  choice: 叫
  rationale: φωνέω在此指呼叫某人；“叫”自然贴合上下文，又不额外强化为正式召唤。
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: 你在无花果树下时
  rationale: 分词ὄντα说明耶稣看见拿但业时的处境；用“……时”自然保留其时间兼情境作用。
- source_word: εἶδόν σε
  choice: 我就看见你了
  rationale: 直译为“我看见你”；“就”和“了”在汉语中自然呼应前面的“以前”，清楚表达先于腓力呼叫的看见，而不解释其方式。
- source_word: συκῆν
  choice: 无花果树
  rationale: 这是συκῆ的标准现代汉语名称。
theological_decisions:
- issue: 耶稣认识并看见拿但业的性质
  choice: 直接陈述耶稣先前看见了拿但业，不说明这种看见或认识的机制。
  alternative: 在译文中明确解释为超自然洞见、先知性知识，或普通的事先观察。
  rationale: 本节只陈述耶稣在腓力呼叫拿但业以前已看见他，却没有说明如何看见。直译保留经文本身的神学张力，不替读者作出解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“拿但业”“腓力”“无花果树”沿用通行圣经专名；“回答他说”适度保留约翰叙事的原文句式。
