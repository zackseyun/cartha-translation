source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: zh_hans
  text: 这是约翰的见证：当犹太人[a]从耶路撒冷派祭司和利未人来问他：“你是谁？”时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太领袖”或“犹太地人”。在《约翰福音》中，“犹太人”常常尤其指犹太地的宗教权威，而不是泛指所有犹太人。
    reason: 说明 οἱ Ἰουδαῖοι 的词义与语境所指，保留原文歧义并防止过度泛化。
lexical_decisions:
- source_word: μαρτυρία
  choice: 见证
  rationale: 保留约翰福音中作证、证言的语义色彩；在现代中文里，“见证”既自然，也能承载本书反复出现的法律性意涵。
- source_word: τοῦ Ἰωάννου
  choice: 约翰的见证
  rationale: 将属格理解为主语属格，即约翰所作的见证，而不是关于约翰的见证。
- source_word: ὅτε
  choice: （以冒号引出具体场景）
  rationale: 原词标明见证发生的场合。中文用冒号接续叙事情境，比直译为“当……的时候”更自然，同时不改变时间关系。
- source_word: ἀπέστειλαν
  choice: 派
  rationale: “派”自然表达由某群体授权人员前去执行任务的意思，比单用“送”更符合本处语境。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 正文保留原文较宽泛的群体称谓，不把解释直接写入正文；脚注说明本处很可能尤其指耶路撒冷的犹太宗教领袖。
- source_word: ἐξ Ἱεροσολύμων
  choice: 从耶路撒冷
  rationale: 准确表达出发地或来源地。
- source_word: ἱερεῖς καὶ Λευίτας
  choice: 祭司和利未人
  rationale: 保留两个不同的圣殿相关群体及其传统称谓。
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: 来问他
  rationale: “来”结合“问”自然表达差派的目的，简洁清楚。
- source_word: Σὺ τίς εἶ;
  choice: 你是谁？
  rationale: 符合现代汉语问法；“你”在句中自然承载希腊文显式代词的焦点。
theological_decisions:
- issue: 约翰福音中 οἱ Ἰουδαῖοι 的所指
  choice: 正文译作“犹太人”，并以脚注说明语境中的较窄所指
  alternative: “犹太领袖”或“犹太地人”
  rationale: 原文措辞本身较宽，正文不宜完全消除其歧义；但本节由耶路撒冷派出祭司和利未人的情境表明，此处尤其涉及犹太宗教权威，而非泛指所有犹太人。脚注既保留原文形式，也避免把称谓误读为对整个民族的概括。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以下是”自然引出后续见证内容；冒号使中文句流清楚。保留“祭司”“利未人”等通行圣经术语。
