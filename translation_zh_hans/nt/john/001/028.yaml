id: JHN.1.28
reference: John 1:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: zh_hans
  text: 这些事发生在约旦河对岸的伯大尼[a]，约翰当时正在那里施洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本及较晚的翻译传统作“伯大巴拉”，而不是“伯大尼”。
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留希腊文复数指示代词，回指前述的问答和事件，也符合约翰叙事的表达方式。
- source_word: ἐν Βηθανίᾳ
  choice: 在……伯大尼
  rationale: ἐν加地名表示地点；结合中文语序，与后面的方位说明合译为“在约旦河对岸的伯大尼”。
- source_word: ἐγένετο
  choice: 发生
  rationale: 此处γίνομαι表示事件发生；“发生”是自然、简洁的现代汉语叙事用语。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河对岸
  rationale: πέραν加属格表示位于河的另一边；“对岸”清楚自然，同时保留其相对方位。
- source_word: ὅπου
  choice: 那里
  rationale: 用“那里”承接前述地点，合乎现代汉语表达，并准确引出约翰施洗所在之处。
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: 约翰当时正在那里施洗
  rationale: ἦν与现在分词βαπτίζων构成迂说未完成时，表示当时持续进行的行动；“当时正在”体现这一体貌。
theological_decisions:
- issue: 地名Βηθανίᾳ（“伯大尼”）与异文Βηθαβαρᾷ（“伯大巴拉”）
  choice: 正文采用“伯大尼”
  alternative: 一些抄本及较晚的翻译传统作“伯大巴拉”
  rationale: 所据SBLGNT正文为Βηθανίᾳ，应按原文证据译入正文；具有历史影响的异文则在脚注中保留，不在正文中取代批判文本。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“施洗”沿用汉语圣经语境中通行且清楚的表达；“当时正在”呈现原文持续进行的动作。
