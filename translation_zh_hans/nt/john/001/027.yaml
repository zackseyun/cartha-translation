  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: zh_hans
  text: 那在我以后来的那一位，我连解开他凉鞋的带子也不配。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：我不配解开他凉鞋的带子。
    reason: 保留希腊文“他的凉鞋的带子”的领属结构，并说明正文“连……也”所表达的强调。
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: 那在我以后来的
  rationale: 定冠词加现在分词作为名词使用，指一位特定的人；“在我以后来的”保留其来到及先后次序的含义，不把上下文中的尊荣高低直接添入本句。
- source_word: οὗ
  choice: 给他……鞋带
  rationale: 关系代词为属格，与后面的鞋及鞋带构成所属关系；汉语以“他”的领属关系自然表达，不拘泥于希腊语句法次序。
- source_word: οὐκ εἰμὶ ἄξιος
  choice: 我连……也不配
  rationale: ἄξιος表示配得或够资格；“不配”准确传达约翰的自谦，“连……也”自然凸显所说之事即使卑微，他仍自认不配。
- source_word: ἵνα λύσω
  choice: 解开
  rationale: 在表示配不配的结构之后，ἵνα加虚拟式说明所涉及的行动；现代汉语用“解开”简明自然。
- source_word: τὸν ἱμάντα τοῦ ὑποδήματος
  choice: 鞋带
  rationale: ἱμάντα是系鞋的皮带或带子，ὑπόδημα指鞋类，按当时情境多为凉鞋；“鞋带”在现代汉语中清楚自然，但可能让人联想到现代绳状鞋带，因此以脚注保留更具体的直译。
theological_decisions:
- issue: “在我以后”与那位来者的关系
  choice: 按时间和事工次序译为“在我以后来的”
  alternative: “跟在我后面来的”
  rationale: ὀπίσω μου在这里可表示居后或随后而来；译文保留先后次序，不从邻近经文直接加入“地位高于我”等解释。
- issue: 约翰所表达的不配
  choice: 保留为不配从事解鞋带这一卑微行动
  alternative: 解释为不配作那位来者的仆人
  rationale: 解鞋带带有卑微服事的文化意味，但原句没有明说“仆人”；正文不将隐含意义扩写成明确身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“就是”使本节作为前文未完引语的延续较为自然；分号呈现两个紧密相连的分句。脚注标记置于相关整句之后。
