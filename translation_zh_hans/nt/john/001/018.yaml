source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: zh_hans
  text: 从来没有人见过神；那位在父的怀中的独一无二的神[a]，已经把他显明出来了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“独一的儿子”（或“独生子”），而不是“独一无二的神”。
    reason: textual_variant
  - marker: c
    text: 或译“把他解释出来了”或“把他启示出来了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: 神
  rationale: 作ἑώρακεν的直接宾语，在这里绝对地指神；“神”是现代汉语圣经语体中准确而自然的对应。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 保留普遍否定，符合现代汉语表达。
- source_word: ἑώρακεν πώποτε
  choice: 从来没有……见过
  rationale: 以“从来没有……过”自然表达否定完成时与πώποτε合在一起的“任何时候都未曾”之意。
- source_word: μονογενὴς θεὸς
  choice: 独一无二的神
  rationale: 依照SBLGNT正文保留θεός，并将μονογενής理解为独特、仅有的一位，而不把“生”直接视为该词在此处必然包含的词义。
- source_word: ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς
  choice: 就是在父怀中的那一位
  rationale: “父怀中”保留κόλπος的身体意象和亲密关系；“那一位”使分词结构在汉语中清楚自然，并与后面的强调代词相衔接。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 保留希腊文指回前述那一位的强调性指示代词；汉语用“他”另起主语，既清楚又保留强调。
- source_word: ἐξηγήσατο
  choice: 把神显明了
  rationale: 该动词可表示讲述、解释或使人认识；“显明”在此传达启示性的揭示，同时不局限于口头解释。
theological_decisions:
- issue: μονογενὴς θεὸς与ὁ μονογενὴς υἱός的文本异读
  choice: 正文依SBLGNT译作“独一无二的神”
  alternative: “独一的子”或传统译法“独生子”
  rationale: 所给原文采用μονογενὴς θεός。这是重要的文本与基督论难题，因此正文忠实采用所指定的希腊文本，并在脚注中透明保存另一主要异读，不暗中消解张力。
- issue: μονογενής的译法
  choice: 独一无二的
  alternative: 独生的；独特的
  rationale: 现有词汇证据支持“独特、仅有的一位”这一语义；“独一无二”在现代汉语中清楚传达此意，又避免断言该词本身必然编码“受生”的概念。传统说法在异读脚注中保留。
- issue: 首句的“神”与后句“独一无二的神”之间的指称张力
  choice: 不添加“子”“他所是的父”等解释性词语
  alternative: 为消除潜在歧义而把后句解释为“独生子”
  rationale: 希腊正文刻意使用θεός，并以“在父怀中”描述这一位；译文保留原文的基督论表达和张力，不借增词预先裁定其含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“父怀中”保留约翰原文的亲密意象；句中重复“那一位……他”是为体现ἐκεῖνος的强调作用，并使复杂的希腊语同位结构在汉语中保持清楚。
