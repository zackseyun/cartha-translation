  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: zh_hans
  text: 第二天，耶稣想要动身前往加利利[a]。他找到腓力，就对他说[b]：“跟从我[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“进入加利利”。希腊文介词表示朝向或进入某地的移动。
    reason: lexical_alternative
  - marker: b
    text: “找到”和“说”在希腊文中都用现在时，是叙事中增强现场感的“历史现在时”。
    reason: lexical_alternative
  - marker: c
    text: “跟从我”既可指实际跟随耶稣同行，也可指接受召唤、作他的门徒。
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 第二天
  rationale: 这是自然、简洁的现代汉语时间表达，准确承接前文的叙事次序。
- source_word: ἠθέλησεν
  choice: 想要
  rationale: 保留θέλω所表达的意愿或意图，不强化为已经作出正式决定。
- source_word: ἐξελθεῖν
  choice: 动身前往
  rationale: 结合目的地短语，用自然汉语表达“出去、启程”的动作；比单说“去”更能体现ἐξέρχομαι的出发意味。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 前往加利利
  rationale: εἰς表示朝向或进入某地的移动；“前往”在汉语中自然，同时脚注保留更贴近形式的“进入”这一可能表达。
- source_word: εὑρίσκει
  choice: 找到
  rationale: 准确表达εὑρίσκω；希腊文的历史现在时无法在汉语中以相同方式自然标记，因此以叙事语境表达，并在脚注说明。
- source_word: λέγει
  choice: 就对他说
  rationale: 明确说话对象，并用“就”自然连接连续动作；希腊文历史现在时的特点在脚注中说明。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 既可指实际随行，也能自然承载成为耶稣门徒的召唤，比单纯的“跟我来”更完整地保留语义张力。
- source_word: Φίλιππον
  choice: 腓力
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 在汉语首句中明确主语，使单节阅读自然清楚；希腊文稍后才明说耶稣是说话者，但语境表明前后动作的主体相同。
theological_decisions:
- issue: 耶稣对腓力命令的含义
  choice: 译作“跟从我”，同时保留实际随行和蒙召作门徒两层含义。
  alternative: 译作“跟我来”，主要突出实际同行。
  rationale: 福音书中的ἀκολούθει μοι通常具有门徒召唤的深意，但本场景也涉及实际行动和路程；“跟从我”不必在正文中排除任何一层。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“动身前往”体现出发动作，“跟从我”保持福音书召唤用语的深度而不过度解释。正文脚注依出现顺序标为[a]、[b]、[c]。
