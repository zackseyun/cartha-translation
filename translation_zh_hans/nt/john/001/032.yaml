id: JHN.1.32
reference: John 1:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: zh_hans
  text: 约翰作见证说：“我看见圣灵仿佛鸽子[a]从天上[b]降下，并停留在他身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如同鸽子”。希腊语在此表达相似或比较。
    reason: lexical_alternative
  - marker: b
    text: 或译“从天而来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: 作见证
  rationale: 既保留“见证、作证”的语义，也符合约翰福音反复使用的见证主题；比单纯的“说”更准确。
- source_word: λέγων
  choice: 说
  rationale: 该现在分词引出见证的内容；汉语用“作见证说”自然地保留原句结构。
- source_word: Τεθέαμαι
  choice: 我看见
  rationale: 完成时强调约翰亲历过这一景象，且其见证在当前仍有效；现代汉语“我看见”在引述见证时足以自然表达，不采用古雅的“我曾目睹”。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 本节及1:33的语境明确指向圣灵。汉语没有英文大小写手段，译作“圣灵”可清楚标明所指，避免“那灵”在现代汉语中显得含混。
- source_word: καταβαῖνον
  choice: 降下
  rationale: 准确表达向下移动，也比“降临”少一层可能的神学化含义。
- source_word: ὡς περιστερὰν
  choice: 仿佛鸽子
  rationale: ὡς在这里自然表达比较或相似；“仿佛鸽子”保留意象，同时不武断断定圣灵在本体上变成鸽子。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上
  rationale: 保留ἐξ所表达的来源和空间运动；“从天上”是现代汉语最自然的说法。
- source_word: ἔμεινεν ἐπ’ αὐτόν
  choice: 停留在他身上
  rationale: “停留”保留μένω的持续意味，并与约翰福音中该词的主题性用法相容；省略重复主语可避免给圣灵添加原文没有明示的性别代词。
theological_decisions:
- issue: τὸ πνεῦμα所指为何
  choice: 译作“圣灵”
  alternative: 译作“那灵”或“灵”
  rationale: 紧接着的1:33明确说“圣灵”，因此这里的定冠词短语在上下文中指同一位圣灵。此译法澄清汉语所指，却不增添本节以外的教义说明。
- issue: ὡς περιστερὰν的表达力度
  choice: 理解为比较：“仿佛鸽子”
  alternative: 译作“作为一只鸽子”或“像一只鸽子一样”
  rationale: ὡς最自然地标示相似性。译文保留这种形象及其可能涉及外观或下降方式的开放性，不进一步断定圣灵采取了鸽子的实体形态。
- issue: 圣灵的后续主语表达
  choice: 在“并停留”处省略代词
  alternative: 译作“他停留”或“它停留”
  rationale: 希腊语动词以隐含主语回指中性的πνεῦμα，但语法性并不决定圣灵的位格性别。汉语省略代词既自然，也避免把原文未明说的性别或非人格含义带入译文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作见证”保留本书的重要法律与见证语感；句式简洁，适合普通读者。两个脚注标记均紧随相关短语，且未沿用英文资料中脚注a误置于“testified”后的排版。
