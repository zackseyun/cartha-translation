  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为律法是借着摩西赐下的；恩典和真理是借着耶稣这位弥赛亚[a]而来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法：“耶稣基督”。“基督”和“弥赛亚”都是称号，意为“受膏者”。
    reason: 说明Χριστός的传统译法及称号含义。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出对前一句的解释或根据；“因为”自然保留其因果、说明作用。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 指借摩西颁布的律法；中文圣经语境中的“律法”明确而庄重，无须另加原文没有的限定语。
- source_word: διὰ Μωϋσέως
  choice: 借着摩西
  rationale: διά加属格表示中介或施行途径；“借着”也与后半句形成准确的平行。
- source_word: ἐδόθη
  choice: 赐下
  rationale: 保留被动语态和“给予”的含义；“赐下”在中文中自然传达律法来自上帝，同时没有把摩西说成最终源头。
- source_word: ἡ χάρις καὶ ἡ ἀλήθεια
  choice: 恩典和真理
  rationale: 采用约翰福音中自然且稳定的对应词，并与1:14的用语相呼应。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣这位弥赛亚
  rationale: 再次保留διά所表达的中介关系；把Χριστός按称号意义译为“弥赛亚”，并用“这位”使中文姓名与称号的关系自然清楚。
- source_word: ἐγένετο
  choice: 而来
  rationale: 表达恩典和真理借着耶稣进入历史现实、临到世人的意思，也保留它与前句“赐下”在动词上的区别。
theological_decisions:
- issue: 如何翻译Ἰησοῦ Χριστοῦ中的Χριστός
  choice: 耶稣这位弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός在这里可作为称号理解，含义是“弥赛亚／受膏者”。正文译出称号的意义；脚注保留中文教会传统中更熟悉的表达。
- issue: 律法与恩典、真理之间的关系
  choice: 以分号并列两句，不增添“但是”或“取代”等解释
  alternative: 加入“但是／却”强化对比
  rationale: 原文以平行结构形成对照，却没有显式的转折连词；译文保留张力，不把这种对照解释成原文未明说的废除或取代。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。分号呈现原文两半的平行对照；“借着”在两处重复，以保留希腊文结构。脚注标记紧随其所说明的“弥赛亚”。
