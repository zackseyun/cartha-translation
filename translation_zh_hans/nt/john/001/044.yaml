  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: zh_hans
  text: 腓力来自伯赛大[a]；安得烈和彼得也来自那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“腓力来自伯赛大，来自安得烈和彼得的城。”原文重复使用表示来源的介词；“城”也可译为“镇”。
    reason: 说明原文重复的来源结构，并保留“城”（πόλις）可指城或镇的词义范围。
lexical_decisions:
- source_word: ἦν
  choice: 是
  rationale: 未完成时在这里表示过去的身份或籍贯背景；汉语用“是……人”自然表达其来源，无须另加过去时标记。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接语。现代汉语若硬译为“现在”或“而”会产生不必要的时间或转折意味，因此由上下文承载其衔接作用。
- source_word: ὁ Φίλιππος
  choice: 腓力
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἀπὸ Βηθσαϊδά
  choice: 是伯赛大人
  rationale: ἀπό表示来源；“是伯赛大人”以自然汉语准确说明腓力来自伯赛大。
- source_word: ἐκ τῆς πόλεως
  choice: 伯赛大也是……的家乡
  rationale: ἐκ再次表示来源，πόλις指城镇；结合后面的属格，汉语以“家乡”清楚表达这是安得烈和彼得所来自的地方。
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: 安得烈和彼得
  rationale: 采用现代中文圣经传统中通行的人名译法；两个属格在此表示与该城的籍贯关系。
