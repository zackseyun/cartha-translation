  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: zh_hans
  text: 第二天，约翰又站在那里，他的两个门徒也在场。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 第二天
  rationale: 这是表示时间的惯用语，意为“第二天”或“次日”；“第二天”自然、清楚，并承接前文叙事。
- source_word: πάλιν
  choice: 又
  rationale: 表示先前情景的重复；“又”简洁地保留了叙事连续性。
- source_word: εἱστήκει
  choice: 站在那里
  rationale: 该形式在此描述过去持续的站立状态。“站在那里”符合现代汉语场景叙述；“那里”是为汉语表达自然所作的补足，并非原文中另有对应词。
- source_word: ὁ Ἰωάννης
  choice: 约翰
  rationale: 采用该人名通行的中文译法。上下文表明他是施洗约翰，但原文只写“约翰”，正文不作扩充。
- source_word: καὶ
  choice: 也
  rationale: 原文以连词并列约翰和两个门徒；结合补出的在场状态，译作“也”自然地表达二者同处该场景。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: 他的两个门徒也在场
  rationale: 直译为“他门徒中的两个”。“他的两个门徒”保留部分关系；因希腊文此处省略可由场景补足的谓语，译文补出“也在场”，避免误解为门徒同样在站立。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留原文简洁的叙事推进；不把“约翰”扩写为“施洗约翰”，也不把门徒的姿态规定为“站着”，以免超出原文。
