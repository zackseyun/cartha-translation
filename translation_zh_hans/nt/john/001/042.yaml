  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: zh_hans
  text: 他把西门带到耶稣那里。耶稣定睛看着他，说：“你是约翰[a]的儿子西门；你将被称为矶法[b]。”（“矶法”译作“彼得”。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“约拿”；SBLGNT正文作“约翰”。
    reason: textual_variant
  - marker: b
    text: “矶法”是与希腊语名字“彼得”相对应的阿拉米语名字，含有“磐石”或“石头”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: 他把西门带到耶稣那里
  rationale: ἄγω在此表示把人带到另一人面前；中文用“带到……那里”自然表达已完成的动作。依上文明确宾语为西门，以姓名代替连续两个“他”，避免现代汉语中不必要的指代含混。
- source_word: ἐμβλέψας αὐτῷ
  choice: 定睛看着他
  rationale: ἐμβλέπω表示专注地注视，不只是随意看一眼；“定睛看着”既传达其力度，也保持庄重自然。
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: 你是约翰的儿子西门
  rationale: 按希腊文保留直接称呼和父子关系；“约翰”依据SBLGNT正文Ἰωάννου，异文另注。
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: 你将被称为‘矶法’
  rationale: 保留将来时和被动语态的命名意味；Κηφᾶς作为人名按通行中文形式音译为“矶法”。
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: “矶法”译出来就是“彼得”
  rationale: ἑρμηνεύεται在这里引出闪语名字与希腊语名字的对应；正文保留两个名字，不直接把Πέτρος译成“磐石”，以免把词义解释替代命名本身。
theological_decisions:
- issue: 矶法与彼得的解释性对应
  choice: 正文保留“矶法”和“彼得”两个通行音译人名，并在脚注说明共同词义
  alternative: 在正文中直接译为“磐石”或“石头”
  rationale: 经文本身是在叙述耶稣给西门命名，并以希腊名字解释闪语名字。保留人名可忠实呈现命名行为；脚注交代词义，则既保存文字关联，也不把后续神学结论带入正文。
- issue: 父名的文本异文
  choice: 采用SBLGNT正文“约翰”，脚注注明“约拿”异文
  alternative: 正文采用“约拿”
  rationale: 所指定的原文版本读作Ἰωάννου（约翰）；异文具有传统和释经价值，因此不删去，而在脚注中透明呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定睛看着”传达ἐμβλέπω的专注意味；引号清楚标示新名字。脚注标记分别紧随实际相关的“约翰”和“矶法”，避免标记与注释内容错位。
