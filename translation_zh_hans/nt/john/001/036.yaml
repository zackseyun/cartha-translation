  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: zh_hans
  text: 他注视着正在行走的耶稣，说：“看，神的羔羊！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: 注视着
  rationale: 表达专注地看，比一般的“看见”更贴近该动词的凝视意味。
- source_word: περιπατοῦντι
  choice: 正走过的
  rationale: 保留现在分词所表示的进行中动作，并自然修饰“耶稣”。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时；现代汉语叙事中用“说”即可自然呈现，不必机械标出时态转换。
- source_word: Ἴδε
  choice: 看
  rationale: 作为引人注意的呼语，现代汉语“看”直接、自然，也保留原文的现场感。
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: 神的羔羊
  rationale: 沿用清楚且庄重的传统表达，保留属格关系及其可能包含的归属、来源或神所预备等丰富含义，不加解释。
theological_decisions:
- issue: “神的羔羊”的具体神学含义
  choice: 直译为“神的羔羊”，不在正文中展开
  alternative: 译作“神所预备的献祭羔羊”等解释性表达
  rationale: 原文没有明说该称号具体指向逾越节羔羊、献祭制度或其他背景；直译可保存其丰富含义与解释张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言；“注视着”体现动作力度，“看”保留现场呼告感。无须脚注。
