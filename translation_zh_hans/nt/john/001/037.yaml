  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: zh_hans
  text: 那两个门徒听见他这样说，就跟随了耶稣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: 听见
  rationale: 不定过去时在这里叙述一次具体的听闻事件；“听见”自然准确，也不额外强调持续聆听。
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: 那两个门徒
  rationale: 定冠词和数词指向上文与施洗约翰同在的两个门徒。中文省去“他的”，可避免读者误以为他们是耶稣的门徒，同时由上下文清楚确定所指。
- source_word: λαλοῦντος
  choice: 这样说
  rationale: 现在分词与“听见”构成同时发生的动作；结合上一节约翰的具体话语，“听见他这样说”比生硬的“听见他说话”更符合现代汉语叙事。
- source_word: ἠκολούθησαν
  choice: 跟随
  rationale: 既表达他们实际跟在耶稣后面，也保留叙事中成为追随者的潜在意味，不提前限定为纯粹空间移动或正式作门徒。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: ἀκολουθέω所支配的与格表示跟随的对象；现代汉语自然表达为“跟随了耶稣”。
theological_decisions:
- issue: αὐτοῦ（“他的”）所指为何人
  choice: 按上下文理解为施洗约翰，并在正文中译作“那两个门徒”
  alternative: 直译为“他的两个门徒”，保留代词表面的形式
  rationale: 约翰福音1:35明确说约翰与他的两个门徒站在那里，1:36又是约翰发言；因此此处αὐτοῦ自然回指施洗约翰。中文若写“他的两个门徒”，在本句中容易误指耶稣，故以“那两个门徒”清楚承接上文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“这样说”承接上一节的话，“跟随”则保留字面行动与门徒主题之间的叙事张力。
