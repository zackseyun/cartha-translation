  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: zh_hans
  text: 腓力找到了拿但业，对他说：“我们找到了摩西在律法中所写、众先知也所写的那一位：就是从拿撒勒来的约瑟的儿子耶稣[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里“约瑟的儿子”是腓力对耶稣的称呼；原文没有加上“被认为是”之类的限定。
    reason: theological_clarity
lexical_decisions:
- source_word: εὑρίσκει
  choice: 找到
  rationale: 希腊文用历史现在时推进叙事；现代汉语自然地用“找到”，不必机械标示时态。
- source_word: λέγει
  choice: 对他说
  rationale: 按现代汉语叙事习惯表达历史现在时，并明确受话者。
- source_word: Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται
  choice: 摩西在律法书上所写的，以及众先知所写的那一位
  rationale: 保留“摩西”和“众先知”两个书写主体，也保留关系代词所指向的人；“律法书”比泛指规范的“律法”更清楚地指向摩西五经这一经书语境。
- source_word: εὑρήκαμεν
  choice: 我们找到了
  rationale: 希腊文完成时表示发现已经发生、结果仍然有效；“找到了”自然传达这一现时结果。
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: 约瑟的儿子
  rationale: 直接保留腓力在叙事中的日常身份称呼，不添加“被认为是”等解释性限定。
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: 从拿撒勒来的
  rationale: 直接体现ἀπό的来源或关联含义，比仅用地名定语更透明。
- source_word: Φίλιππος / Ναθαναὴλ / Μωϋσῆς / Ἰωσὴφ / Ἰησοῦν / Ναζαρέτ
  choice: 腓力／拿但业／摩西／约瑟／耶稣／拿撒勒
  rationale: 采用现代简体中文圣经传统中通行、易识别的专名译法。
theological_decisions:
- issue: “约瑟的儿子”与基督论的关系
  choice: 保留腓力所说的“约瑟的儿子耶稣”
  alternative: “被认为是约瑟儿子的耶稣”或“约瑟法律意义上的儿子耶稣”
  rationale: 本节按腓力当时的日常社会身份认知来介绍耶稣；译文不应为协调其他经文或后来的教义表述而改写此处。
- issue: “摩西在律法书上……以及众先知”所指的见证范围
  choice: 将摩西和众先知都表达为写到“那一位”的主体
  alternative: 笼统译作“律法和先知所记载的那一位”
  rationale: 所选表达贴近希腊文句法，保留摩西与众先知的双重经文见证，同时不额外规定具体预言段落或解经方式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。句中以“那一位……就是……”处理前置关系结构，使复杂的希腊文句法在中文中清楚可读；保留“从拿撒勒来的”以呈现原文ἀπό的来源含义。
