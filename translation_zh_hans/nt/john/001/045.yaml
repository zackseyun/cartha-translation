revisions:
- from: 腓力找到拿但业，对他说：“摩西在律法书上所写的，以及众先知所写的那一位，我们找到了，就是约瑟的儿子耶稣[a]，从拿撒勒来的。”
  to: 腓力找到了拿但业，对他说：“我们找到了摩西在律法中所写、众先知也所写的那一位：就是从拿撒勒来的约瑟的儿子耶稣[a]。”
  rationale: 修正“律法书上”为“律法中”，以准确表达原文ἐν τῷ νόμῳ并符合汉语习惯；同时将摩西与众先知的见证压缩为自然的并列定语结构。调整身份描述的中文语序，使“从拿撒勒来的”清楚修饰耶稣，而不改变原文的指认内容或其叙事层次。
