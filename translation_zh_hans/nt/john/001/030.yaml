  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: zh_hans
  text: 这就是我曾说的那一位：“有一个人在我以后来，却居于我之先[a]，因为他本来在我以前[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“已经在我前面了”；也可表示“已经超越我”或“地位在我之上”。原文既能表达优先次序，也能表达较高地位。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为他在我以前就已经存在。”原文更简洁，只说“他在我以前”；在本书语境中，这句话可指耶稣的先存。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὑπὲρ οὗ ἐγὼ εἶπον
  choice: 这就是我曾说的那一位
  rationale: 以自然的现代汉语表达强调性的指认，并保留“我曾说到他”的关系结构。
- source_word: Ὀπίσω μου ἔρχεται
  choice: 在我以后来
  rationale: 这里主要表示次序而非空间位置；“在我以后来”保留约翰与耶稣在公开出现时间上的先后对照。
- source_word: ἀνὴρ
  choice: 一个人
  rationale: 原词明确指一名成年男性；“一个人”在汉语中自然，也没有淡化耶稣真实的人性。
- source_word: ἔμπροσθέν μου γέγονεν
  choice: 却居于我之先
  rationale: γέγονεν为完成时，表示已经形成且持续的优先状态；“居于我之先”可涵盖优先次序和较高地位，又避免仅理解为物理位置。“却”显出“以后来”与“居先”之间的反差。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后一分句对前述优先地位所给出的理由。
- source_word: πρῶτός μου ἦν
  choice: 他本来在我以前
  rationale: 保留原文简洁的“在我以前”，既可传达时间上的先在，也不把其神学含义扩写进正文；“本来”自然表现未完成过去时所指的既有事实。
theological_decisions:
- issue: 末句是否明确译出基督的先存
  choice: 他本来在我以前
  alternative: 他在我以前就已经存在
  rationale: 约翰福音的语境强烈指向耶稣的先存，但希腊文只简洁地说“他在我以前”。正文保留这种简洁和张力，脚注说明较明确的可能译法。
- issue: ἔμπροσθέν μου γέγονεν侧重时间还是地位
  choice: 却居于我之先
  alternative: 已经在我前面了／已经超越我
  rationale: 该表达可以指优先地位，也保留先后次序的意象。“居于我之先”不把含义限定为纯粹时间关系或单纯等级关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“那一位”“居于我之先”略带庄重感，适合公开见证的语境；其余措辞保持自然简洁。脚注标记紧跟各自说明的短语，以免错配。
