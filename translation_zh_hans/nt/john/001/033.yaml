  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: zh_hans
  text: 我原先也不认识他[a]；但那位差我来在水里施洗的对我说：‘你看见圣灵降下，停留在谁身上[b]，谁就是在圣灵里施洗的那一位。’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我原先也没有认出他。”原文在此既可表示不认识，也可按语境理解为没有认出。
    reason: lexical_alternative
  - marker: b
    text: “停留”所译的原文动词是约翰著作中的一个关键词，也常译作“住”或“常在”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“用水施洗”……“用圣灵施洗”。原文两处使用同一个介词，直译均为“在……里”；正文保留了这种平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: 我原先也不认识他
  rationale: κἀγώ兼有承接和强调意味，译作“我……也”；未完成时ᾔδειν指此前持续的未知状态。“不认识”在现代汉语中自然，并保留“不熟悉”与“未辨认出”之间的语境张力。
- source_word: ὁ πέμψας με
  choice: 那差我……的
  rationale: 以名词化关系结构表达带冠词的过去时分词，既保留特指，也符合现代汉语表达。
- source_word: βαπτίζειν ἐν ὕδατι
  choice: 在水里施洗
  rationale: 保留ἐν的空间表达，并与后文“在圣灵里施洗”形成原文刻意的平行。
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: 你看见……在谁身上
  rationale: 原文以不定关系结构指出辨认的标志；汉语用“在谁身上……谁就是……”自然地保留这一辨认结构。
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: 圣灵降下，停留在谁身上
  rationale: 根据本节末尾πνεύματι ἁγίῳ明确所指，将τὸ πνεῦμα译为“圣灵”。“停留”准确表达μένω在此处的持续性，同时避免过分教会化的措辞。
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: 谁就是……施洗的那一位
  rationale: 用对应的“谁……谁就是……”结构表达指认公式，并以“那一位”保留带冠词分词结构的特指意味。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里
  rationale: 保留ἐν，并与“在水里”形成同一介词的平行；不预先裁定工具、领域或媒介等细微语义。
theological_decisions:
- issue: πνεῦμα与πνεύματι ἁγίῳ所指
  choice: 圣灵……圣灵
  alternative: 灵……圣灵
  rationale: 末句明确使用“圣灵”，表明前面的“灵”是同一所指；统一译为“圣灵”有助于普通读者正确衔接指代，并未增加原文之外的教义内容。
- issue: 两处施洗短语中ἐν的处理
  choice: 在水里施洗……在圣灵里施洗
  alternative: 用水施洗……用圣灵施洗
  rationale: 原文两处使用同一介词ἐν。正文保留这一平行，也保留其可涉及范围、媒介或领域的语义张力；脚注提供较惯用的工具性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那差我……的”略带经文庄重感，但没有采用文言或过时句式；引语中的“在谁身上……谁就是……”符合自然汉语，也保留原文的指认重点。
