  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: zh_hans
  text: 约翰回答他们说：“我在水中施洗。你们中间站着一位你们不认识的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: 约翰回答他们说
  rationale: 自然保留叙事中的回答动词及引出直接引语的分词结构；不增添原文没有的称号。
- source_word: βαπτίζω
  choice: 施洗
  rationale: 采用现代汉语基督教语境中通行且中性的表达，避免用“浸”将具体方式过度限定。
- source_word: ἐν ὕδατι
  choice: 在水中
  rationale: 较直接地保留介词ἐν的空间表达；虽可译为“用水”，但“在水中”更贴近原文，也不预先限定施洗方式。
- source_word: μέσος ὑμῶν
  choice: 在你们中间
  rationale: 准确而自然地表达某人处于听众之中的意思。
- source_word: ἕστηκεν
  choice: 站着
  rationale: 用汉语状态表达传达完成时所强调的当前站立状态，无须生硬译成“已经站立”。
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: 一位，是你们不认识的
  rationale: “一位”适用于身份尚未明说的人，并保留关系从句所表达的未知状态；“不认识”比“不认出”更少解释性。
theological_decisions:
- issue: 站在他们中间者的身份
  choice: 译作“一位”，不在本节明说其身份
  alternative: 弥赛亚；耶稣；他
  rationale: 上下文最终会说明所指对象，但本节有意暂不点名；译文保留其修辞悬念和神学张力。
- issue: 施洗所用介词ἐν的表达
  choice: 在水中施洗
  alternative: 用水施洗
  rationale: “在水中”更形式对应原文，同时不把施洗方式缩减为单纯工具关系；两种汉语表达均有可能，但正文选择较贴近原文者。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“施洗”保持通行宗教词汇但不加入宗派性的施行方式；整体语序自然，并保留原文中身份未揭示的张力。
