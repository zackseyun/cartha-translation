  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: zh_hans
  text: 他不是那光，而是来为那光作见证的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他不是那光，而是要为那光作见证。”希腊原文第二分句省略了需从上下文补出的成分。
    reason: 说明原文在转折后的目的从句中存在省略，并提供较贴近形式的译法。
lexical_decisions:
- source_word: οὐκ ἦν
  choice: 不是
  rationale: 否定 εἰμί 的未完成时；此处是在叙述中说明约翰的身份，现代汉语用“不是”自然准确，无须生硬标出过去时。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 该指示代词在此承接上文的约翰，并带有一定强调作用；“他”最符合现代汉语，身份对比则由“不是那光”清楚表达。
- source_word: τὸ φῶς
  choice: 那光
  rationale: 定冠词指向序言中已经提及的特定之光；“那光”既保留特指，也比单说“光”更清楚。
- source_word: ἀλλ’ ἵνα
  choice: 而是来……的
  rationale: 原文在 ἀλλά 后省略了需由语境补出的成分，只留下目的从句。译文依上文补出“来”，并用“而是……的”形成自然的身份与使命对比。
- source_word: μαρτυρήσῃ
  choice: 作见证
  rationale: 保留 μαρτυρέω 在约翰著作中重要的见证、作证含义；“作见证”庄重而通俗。
- source_word: περὶ τοῦ φωτός
  choice: 为那光
  rationale: περί 加属格表示见证所关涉的对象。汉语“为那光作见证”自然表达替其作证、见证其身份的意思；“论到那光”则较书面。
theological_decisions:
- issue: 约翰与那光的身份及角色之别
  choice: 明确否认约翰是那光，并说明他来的目的在于为那光作见证。
  alternative: 较为直译作：“他不是那光，而是要为那光作见证。”
  rationale: 译文保持见证者与那光之间的区分，不进一步解释“光”的神学身份；所补的“来”源于上下文中的省略，而非增添新的教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那光”保留原文的特指；“作见证”延续约翰序言中的核心见证用语。脚注交代因汉语通顺而补出的“来”。
