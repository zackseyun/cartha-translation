  naturalness: “你怎么说你自己？”明显生硬，不是自然的现代普通话问法。改为“你说自己是谁？”简洁自然，并在此身份核查的语境中恰当地表达“你对自己作何宣称”。“答复差我们来的人”也比“回复那些差我们来的人”更凝练庄重。
  terminology: 本节没有专门神学术语或专名。保留“差……来的人”可准确反映πέμψασιν（差遣/派遣），不需要引入额外的宗教性措辞。
