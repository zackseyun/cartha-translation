  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: zh_hans
  text: 于是，他们对他说：“你是谁？好让我们答复差我们来的人。你说自己是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进问答，兼顾推论和转折性的叙事衔接；现代汉语中自然简洁。
- source_word: εἶπαν ... αὐτῷ
  choice: 他们问他
  rationale: λέγω本义为“说”，但此处引出两个直接问句，译作“问”更符合现代汉语语境，且不改变言语行为的实质。
- source_word: Τίς εἶ;
  choice: 你是谁？
  rationale: 忠实保留希腊文简短直接的身份询问，不添加额外语气。
- source_word: ἵνα
  choice: 好让
  rationale: 清楚表达目的关系，比“为了使”更自然，同时保留ἵνα的目的含义。
- source_word: ἀπόκρισιν δῶμεν
  choice: 我们回复
  rationale: 希腊文直译为“我们给出一个回答”；汉语“回复”自然表达把答复带回给差遣者的意思。
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: 那些差我们来的人
  rationale: 准确表达实体化分词“差遣我们的人”；补出趋向成分“来”符合汉语表达，并由场景明确支持。
- source_word: τί λέγεις
  choice: 你怎么说
  rationale: 保留λέγω的“说”而不改成较解释性的“认为”，表达对方要求约翰作出自我陈述。
- source_word: περὶ σεαυτοῦ
  choice: 你自己
  rationale: 与“怎么说”组合为自然的现代汉语“你怎么说你自己”，准确表达περί加属格所指的谈论主题。
