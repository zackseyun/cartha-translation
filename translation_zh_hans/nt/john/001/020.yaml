  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: zh_hans
  text: 他承认，并没有否认；他承认说：“我不是弥赛亚[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语称号Χριστός（Christos）意为“受膏者”；这里作为弥赛亚性的称号使用，所以正文译为“弥赛亚”。
    reason: 提供该希腊称号的传统替代译法，并说明正文译法。
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: 承认了／郑重承认
  rationale: 此处指公开、明确地承认或声明。首处译作“承认了”，重述时用“郑重承认”，既保留希腊文的重复和庄重语气，也使现代汉语自然。
- source_word: οὐκ ἠρνήσατο
  choice: 并没有否认
  rationale: ἀρνέομαι在此意为“否认”；直译保留“承认……没有否认”的强调结构。
- source_word: καὶ … καὶ … καὶ
  choice: ……并……又……
  rationale: 希腊文反复使用καί形成层层强调。汉语用“并”和“又”连接，在保留修辞推进的同时避免生硬重复。
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: 我不是
  rationale: 独立人称代词Ἐγώ带有强调意味；汉语直接说“我不是”已能在这句正式否认中自然传达重点，无须增添“我本人”。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: Χριστός在这里是称号，指人们所期待的受膏者；“弥赛亚”能清楚呈现本段的犹太背景。
theological_decisions:
- issue: 称号Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节中，施洗约翰否认自己是那位受期待的受膏者。该词在此作为称号使用，而不是近似专名，因此正文译作“弥赛亚”；脚注保留传统译法“基督”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“承认了……没有否认……又郑重承认”保留原文刻意重复的公开声明语气；脚注标记置于其实际说明的“弥赛亚”之后。
