  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: zh_hans
  text: 西门·彼得的兄弟安得烈，是那两个听了约翰的话、跟从了耶稣[a]的人之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“跟从了他”；按上下文，“他”指耶稣。
    reason: 说明代词的字面形式及其上下文所指，避免中文近距离先行词造成误解。
lexical_decisions:
- source_word: ἦν
  choice: 是
  rationale: 未完成时 εἰμί 在这里作系词，用于说明安得烈是两人中的一个；现代汉语用“是”最自然。
- source_word: Ἀνδρέας
  choice: 安得烈
  rationale: 采用现代中文圣经语境中通行且易辨识的人名译法。
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: 西门·彼得的兄弟
  rationale: 保留亲属关系及“西门·彼得”这一双重称谓；所有格结构符合现代汉语表达。
- source_word: εἷς ἐκ τῶν δύο
  choice: 那两个……的人之一
  rationale: 准确表达部分关系，并以汉语关系结构自然连接后面的两个分词。
- source_word: τῶν ἀκουσάντων
  choice: 听了……的话
  rationale: ἀκούω 在此涉及听取约翰先前所说的见证；补出“话”使现代汉语完整自然，同时不具体增添其内容。
- source_word: παρὰ Ἰωάννου
  choice: 约翰的话
  rationale: παρά 加属格表示信息来自约翰；汉语用“听了约翰的话”自然表达来源。上下文已说明是施洗者约翰，正文不额外补称号。
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: 跟从了耶稣
  rationale: ἀκολουθέω 译为“跟从”；依据约1:35–39的叙事，αὐτῷ 指耶稣。中文若只写“他”容易误指紧邻的约翰，因此正文明确所指，并以脚注交代原文形式。
theological_decisions:
- issue: αὐτῷ 的所指
  choice: 正文译为“耶稣”
  alternative: 按字面译为“他”
  rationale: 希腊文代词本身是“他”，但约1:35–39明确叙述两名门徒听见约翰作见证后跟从耶稣。中文“跟从了他”因“约翰”紧邻而会造成原叙事并无的歧义，所以正文明确为“耶稣”，脚注保留原文信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟从”保留门徒叙事的传统语感，又为普通读者所理解；句式尽量贴近希腊文的信息次序，同时避免生硬直译。
