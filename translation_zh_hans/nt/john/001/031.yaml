  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: zh_hans
  text: 我先前也不认识他[a]；但我来在水中施洗，正是为了让他向以色列人显明出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有认出他。”希腊文既可指原先不认识，也可指没有认出；正文采用含义较宽的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: 我先前也
  rationale: κἀγώ由καί与ἐγώ合成，承接上文并略带强调；结合未完成时οὐκ ᾔδειν，以“我先前也”自然表达叙事衔接和过去状态。
- source_word: οὐκ ᾔδειν αὐτόν
  choice: 不认识他
  rationale: οἶδα的未完成时表示过去持续的认知状态。“不认识他”保留既可指不相识、也可指未认出其身份的宽泛性；脚注列出后一可能。
- source_word: ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ
  choice: 但为了使他向以色列显明
  rationale: ἀλλά引出转折，ἵνα表达目的，φανερωθῇ为被动虚拟式。“使他……显明”保留目的关系与被动含义；“向以色列”对应与被动动词相连的与格。
- source_word: διὰ τοῦτο ἦλθον ἐγὼ
  choice: 我才来
  rationale: διὰ τοῦτο回指所述目的，意为“为此”；汉语用“才”将目的与约翰前来施洗紧密相连，并自然体现显式ἐγώ的焦点。
- source_word: ἐν ὕδατι βαπτίζων
  choice: 在水中施洗
  rationale: ἐν ὕδατι直译为“在水中”；现在分词βαπτίζων与“来”同时，译作“来在水中施洗”，既保留结构，也不额外限定施洗方式。
theological_decisions:
- issue: 约翰所说“不认识他”的含义
  choice: 正文译为“不认识他”，不限定为彼此素不相识或尚未认出其弥赛亚身份。
  alternative: “没有认出他”或“原不知道他是弥赛亚”
  rationale: 原文οὐκ ᾔδειν αὐτόν本身没有说明这种“不认识”的具体层面；采用宽泛译法并以脚注提示词义可能性，可保留经文的张力，避免加入协调性解释。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“向以色列显明”保留原文的群体指向；“在水中施洗”贴近希腊文措辞，不借译法裁定具体施洗方式。
