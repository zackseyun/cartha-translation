  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: zh_hans
  text: 那照亮每一个人的真光，正来到世上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那照亮每一个来到世上的人的真光。”希腊语中的“来到”也可以修饰“每一个人”，而不是“真光”。
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 采用现代汉语普通名词“光”，既保留约翰福音中的象征与基督论含义，也不以特殊排版额外解释。
- source_word: ἀληθινόν
  choice: 真
  rationale: “真光”是自然而庄重的汉语表达，可传达“真实、终极、名副其实”的含义，不限于事实上的正确。
- source_word: φωτίζει
  choice: 照亮
  rationale: “照亮”既保留光的意象，也能承载上下文中的属灵和启示性意味，且比“启迪”更贴近原词意象。
- source_word: πάντα ἄνθρωπον
  choice: 每一个人
  rationale: 准确表达单数泛指的全称范围，在现代汉语中自然、明确，也不加入原文没有的性别限定。
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: 正来到世上
  rationale: 正文按上下文将分词在意义上与“真光”相连；以“正来到”配合未完成时ἦν，表现正在发生的来到，同时将另一种合乎语法的连接方式收入脚注。
- source_word: κόσμον
  choice: 世上
  rationale: 在“来到……”这一固定表达中，“来到世上”比“来到世界”更自然，并保留κόσμος所指的人类世界。
- source_word: ἦν
  choice: 正……
  rationale: 与分词合译为“正来到”，自然体现未完成时与迂回结构的进行意味。
theological_decisions:
- issue: 分词ἐρχόμενον（“来到”）的句法归属
  choice: 正文在意义上修饰“真光”：“真光……正来到世上”
  alternative: 修饰“每一个人”：“照亮每一个来到世上的人”
  rationale: ἐρχόμενον在形态上可与阳性单数宾格ἄνθρωπον一致，但约翰福音的上下文也有充分理由将“来到世上”理解为真光的来临。正文采用基督论读法，脚注保留真实的句法歧义，不将其静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“真光”保持约翰序言的凝练意象；脚注标记置于正文句末，避免打断主句，同时清楚保留原文的句法歧义。
