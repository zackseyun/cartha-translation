  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: zh_hans
  text: 因为我们众人都从他的丰盛中领受了恩典代替恩典[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恩上加恩”，或“一重恩典接着一重恩典”。这个希腊语短语可以表示一种恩典接续另一种恩典，尽管ἀντί更直接的意思是“代替”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出对上文的解释或依据；“因为”自然保留其因果、说明作用。
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: 从他的丰盛中
  rationale: 保留介词所表达的来源，以及 πλήρωμα 所指的充盈、丰盛；中文简洁自然。
- source_word: ἡμεῖς πάντες
  choice: 我们众人都
  rationale: 明确表达原文独立人称代词与 πάντες 共同形成的强调，涵盖“我们所有人”。
- source_word: ἐλάβομεν
  choice: 领受了
  rationale: “领受”适合恩赐语境，并以“了”呈现不定过去时所述已经发生的领受。
- source_word: καὶ
  choice: 并且是
  rationale: “并且”保留连接关系；补入“是”使后面的概括性短语在现代汉语中衔接自然。
- source_word: χάριν ἀντὶ χάριτος
  choice: 恩典代替恩典
  rationale: ἀντί 的基本含义是“代替、取代”；此译法保留原文可能涉及替代或接续的张力，而不直接限定为单纯累加。
theological_decisions:
- issue: χάριν ἀντὶ χάριτος 的含义
  choice: 恩典代替恩典
  alternative: 恩上加恩；一重恩典接着一重恩典
  rationale: 该短语可理解为一种恩典接替另一种恩典，也常被理解为恩典不断累加。正文保留 ἀντί 较直接的“代替”义，不替读者消解替代与接续之间的真实歧义；较流畅但解释性更强的译法列入脚注。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“恩典代替恩典”刻意保留原文略显突兀而富有张力的表达；脚注提供较惯用、解释性较强的读法。
