  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: zh_hans
  text: 这些人是从法利赛人中间被差来的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人是法利赛人差来的。”原文更直接表示他们是从法利赛人中间来的。
    reason: 说明ἐκ所表达的来源含义，并保留强调法利赛人为差遣者的另一种理解。
lexical_decisions:
- source_word: Καὶ
  choice: 不单独译出
  rationale: 此处καί承接上文；现代汉语在独立经节中若直译“并且”显得生硬，句意和叙事衔接并未因此受损。
- source_word: ἀπεσταλμένοι ἦσαν
  choice: 是……奉差来的
  rationale: 完成分词与未完成时系词构成迂回表达，突出他们已经受差遣而处于奉差而来的身份；“奉差来的”在现代汉语中自然，也保留差遣的被动含义。
- source_word: ἐκ
  choice: 从……中间
  rationale: ἐκ加属格首先表示来源或出身；译作“从……中间”保留这些人与法利赛人群体之间的来源关系，不直接断定法利赛人是施事者。
- source_word: τῶν Φαρισαίων
  choice: 法利赛人
  rationale: 采用该犹太群体名称在现代中文圣经中的通行译法。
theological_decisions:
- issue: 受差者与法利赛人的关系
  choice: 这些人来自法利赛人群体，并受差遣而来
  alternative: 这些人是法利赛人差来的，强调法利赛人是差遣者
  rationale: 原文用ἐκ加属格，直接表达来源，而非明确使用表示施事者的结构。因此正文保留来源含义，脚注说明上下文容许的施事理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“奉差来的”略带经文语体，但普通读者容易理解；“从法利赛人中间”刻意保留原文关于来源与施事之间的细微含混。
