  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: zh_hans
  text: 拿但业回答他说：“拉比，你是上帝的儿子，你是以色列的王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是对话叙事中ἀποκρίνομαι自然且直接的现代汉语对应，保留了回应前文话语的语义。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留第一世纪犹太文化中的称谓形式；在本福音书中该词作为直接称呼使用，译作“老师”虽可表达词义，却会削弱其具体文化色彩。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 定冠词结构在语境中具有明确的称号性质；现代汉语无需另加冠词即可自然表达其确定性，并保留其基督论分量。
- source_word: βασιλεὺς
  choice: 王
  rationale: “王”是该词直接、庄重且自然的汉语对应；此处虽为无冠词的表语名词，但由“以色列的”限定，在语境中是明确的王者称号。
- source_word: τοῦ Ἰσραήλ
  choice: 以色列的
  rationale: 直接保留属格关系，与“王”组成自然的汉语称号“以色列的王”，避免扩展为解释性的“统治以色列的王”。
- source_word: σὺ εἶ … σὺ … εἶ
  choice: 你是……你是……
  rationale: 保留希腊文重复的显性主语和系词所形成的强调与平行结构，使拿但业的宣认语气清晰有力。
- source_word: Ναθαναήλ
  choice: 拿但业
  rationale: 采用现代中文圣经语境中通行且易识别的人名音译。
theological_decisions:
- issue: 拿但业宣认“上帝的儿子”的基督论分量
  choice: 按原文保留为明确称号“上帝的儿子”，不弱化也不扩写。
  alternative: “上帝的一个儿子”或加入后期教义性解释
  rationale: 约翰福音语境赋予这一表达显著的弥赛亚与基督论意义；译文保留原文称号本身，不将其不定化，也不加入原文未明说的教义定义。
- issue: “以色列的王”的王权—弥赛亚含义
  choice: 译为正式而直接的称号“以色列的王”。
  alternative: “统治以色列的人”或“以色列的统治者”
  rationale: 该表达唤起以色列所期待之君王的背景；直译既保留王权称号，也避免以解释性措辞替代原文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“拉比”的犹太文化称谓，并以两个“你是”再现原文强调性的平行宣认。经文无脚注标记，因为本节无需以脚注说明正文所保留的歧义或文本问题。
