  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: zh_hans
  text: 他来到自己的地方[a]，自己的人却不接纳他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属于他的一切”。原文这里是中性复数，可指属于他的地方、领域或所有；与下文指人的阳性复数“自己的人”不同。
    reason: alternative_reading
  - marker: b
    text: “接纳”也可译作“接受”或“接待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: 来到自己的地方
  rationale: τὰ ἴδια是中性复数，指属于他的地方、领域或一切，而不是直接指人。“自己的地方”在现代汉语中自然，并与后面的“自己的人”形成原文刻意保留的对照；脚注说明其范围不必局限于某一处住所。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι的不定过去时在这里表示简明的到来；“来到”自然呈现叙述中的移动。
- source_word: οἱ ἴδιοι
  choice: 自己的人
  rationale: οἱ ἴδιοι是阳性复数，明确指人。“自己的人”既简洁自然，也保留与前面中性复数τὰ ἴδια的区别。
- source_word: αὐτόν
  choice: 他
  rationale: 该代词承接上下文中的“道”，现代汉语用“他”自然表达。
- source_word: παρέλαβον
  choice: 接纳
  rationale: παραλαμβάνω在此可含领受、接受或欢迎某人的意思。“接纳”兼顾关系性的迎接与实际的接受，又不把含义缩窄为单纯礼貌接待。
theological_decisions:
- issue: ἴδιος两次出现时所指对象及其差异
  choice: 前一句译作“自己的地方”，后一句译作“自己的人”
  alternative: 两处都理解为“自己的人”，或把前一句具体限定为“自己的家”
  rationale: 原文先用中性复数τὰ ἴδια，后用阳性复数οἱ ἴδιοι，显示前者偏向属于他的地方、领域或所有，后者则指属于他的人。正文呈现这一区别，同时用脚注避免把前者过度限定为住宅、故乡或某一特定群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“自己的地方／自己的人”重现原文中相近措辞所形成的对照；“却”自然表达καί在此语境中的转折关系。
