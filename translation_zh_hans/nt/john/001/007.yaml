id: JHN.1.7
reference: John 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: zh_hans
  text: 这人来，是为作见证[a]，要为那光作证，使众人借着他[b]相信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证”也可译作“作证”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他”按上下文最可能指约翰，即众人借着约翰的见证而相信；也有人认为是指“那光”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回上一节所说的约翰，保留指示代词的强调和承接作用；现代汉语中比“这一个”自然，也比单用“他”更贴近原文。
- source_word: ἦλθεν
  choice: 来
  rationale: 直接表达叙事中的来到，不增添原文没有说明的起点或方式。
- source_word: εἰς μαρτυρίαν
  choice: 是为作见证
  rationale: 表达此处的目的和见证职分，并保留 μαρτυρία 的作证意味。
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: 要为那光作证
  rationale: ἵνα 表示目的；περί 加属格译为“为……作证”，在现代汉语中自然地表达“就……作见证”。定冠词以“那”体现，并承接上下文中特指的光。
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: 使众人……相信
  rationale: 保留第二个目的从句；πάντες 译作“众人”，范围广而不擅自限定对象。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά 加属格表示媒介或途径。“借着他”保留代词所指可能产生的语义张力，不把“他的见证”直接写入正文。
theological_decisions:
- issue: δι’ αὐτοῦ 中“他”的所指
  choice: 正文保留“借着他”，按上下文主要指施洗约翰
  alternative: “他”指那光
  rationale: 本节的主语和最自然的相关人物是约翰，下一节也将约翰与光区分开来；但代词形式本身容许部分读者理解为“那光”，故用脚注保留这一较次要的可能。
- issue: “光”的身份表达
  choice: 译作“那光”，不在正文添加“基督”或“弥赛亚”
  alternative: 直称“基督”或“弥赛亚”
  rationale: 原文只用 τὸ φῶς；应保留约翰福音在上下文中逐步显明其身份的表达方式，不提前解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这人”保留 οὗτος 的回指强调；两个目的层次分别以“是为”和“要……使……”表达。避免用大写等汉语不具备的手段标示“光”，改以“那光”体现特指。
