  source_fidelity: 正文准确保留了οὗτος对上一节约翰的回指（“这人”）、ἦλθεν（“来”）、两个目的层次，以及δι’ αὐτοῦ所表达的媒介意义。将περὶ τοῦ φωτός译为“为那光作证”在汉语中可自然表达就/关于那光所作的见证；“那光”也恰当地保留了原文的特指，未提前释义其身份。
