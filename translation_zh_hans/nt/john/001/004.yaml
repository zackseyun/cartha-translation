  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: zh_hans
  text: 生命在他里面，这生命就是人的光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: ἐν加与格自然表达为“在……里面”；αὐτῷ承接上文的“道”，而序言以位格性的方式描写“道”，所以用“他”而不用“它”。
- source_word: ζωὴ
  choice: 生命
  rationale: ζωή直译为“生命”。此处不增译为“永生”，以保留原文简洁的措辞及其在约翰语境中的丰富含义。
- source_word: ἦν
  choice: 在；就是
  rationale: 两处ἦν都是未完成时的系动词。第一处按汉语习惯与介词结构译为“在”，第二处在表语句中译为“就是”；不额外加入“存在”等解释性词语。
- source_word: ἡ ζωὴ
  choice: 这生命
  rationale: 定冠词使第二次出现的“生命”回指前一句刚提到的生命；现代汉语以“这生命”自然地表达这一回指关系。
- source_word: τὸ φῶς
  choice: 光
  rationale: φῶς译为“光”，保留约翰序言中的核心意象。汉语判断句无需机械添加定冠词对应词，“就是”已清楚表达确定的认同关系。
- source_word: τῶν ἀνθρώπων
  choice: 人的
  rationale: ἄνθρωποι在此泛指人类；“人的光”既贴近属格结构，也在现代汉语中自然包含所有人，不限于男性。
theological_decisions:
- issue: αὐτῷ的指代及位格意味
  choice: 译为“他”，指上文的“道”。
  alternative: 译为“它”，把λόγος较抽象地理解为非位格之物。
  rationale: 上下文以位格性的方式描写“道”，后文又说“道成了肉身”；用“他”保留这一语境指向，但不在本节加入后期教义术语。
- issue: 生命与光的关系
  choice: 译为“这生命就是人的光”，表达主语与表语的认同关系。
  alternative: 译为“这生命给人带来光”，将关系解释为作用或结果。
  rationale: 原文使用系动词ἦν和表语τὸ φῶς，直接把“生命”认定为“人的光”；不应改写为因果关系。
- issue: ἀνθρώπων的泛指范围
  choice: 用“人”泛指全体人类。
  alternative: 译为“人类”，更明确标示集合意义。
  rationale: 希腊语虽为阳性复数，但语义上泛指人。“人的光”在现代汉语中自然且包容，同时比“人类的光”更贴近原文简洁庄重的表达。
translation_notes:
  register: 采用现代、简洁而庄重的经文语体。“生命在他里面”保留原文前置介词短语所强调的内在关联；“这生命”清楚承接前项；“人的光”自然泛指全人类。
