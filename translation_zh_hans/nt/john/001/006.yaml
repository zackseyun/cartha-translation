  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: zh_hans
  text: 有一个人，是从上帝那里受差遣的，名叫约翰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的名字是约翰。”
    reason: 说明希腊语姓名短语较为直白的结构；正文采用更自然简洁的现代汉语表达。
lexical_decisions:
- source_word: Ἐγένετο
  choice: 有一个人……而来
  rationale: 这里的 γίνομαι 用来引入叙事中的新人物。“有一个人……而来”在现代汉语中自然，也保留了人物出现并进入叙事的意味，而不把它解释为受造。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处指具体的男性人物约翰；“一个人”自然准确，无须添加原文没有的身份称谓。
- source_word: ἀπεσταλμένος
  choice: 受差遣
  rationale: 保留完成时被动分词所表达的受差遣状态及被动意义，并体现其使命来自差遣者。
- source_word: παρὰ θεοῦ
  choice: 从上帝那里
  rationale: παρά 加属格主要表示来源。“从上帝那里”保留差遣来源的重点，同时不把表达收窄为单纯的施事关系。
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: 名叫约翰
  rationale: 这是现代汉语中简洁自然的身份介绍，准确传达“他的名字是约翰”的意思。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经及通行用法中的标准人名译法。
theological_decisions:
- issue: 约翰使命的性质
  choice: 约翰是从上帝那里受差遣而来的
  alternative: 约翰由上帝差遣／约翰与上帝有关联
  rationale: ἀπεσταλμένος 与 παρὰ θεοῦ 共同表明差遣的神圣来源。“从上帝那里受差遣”保留这一点，却不额外加入先知职分等本节未明说的神学身份。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“上帝”清楚表达 θεός；句式简洁，适合叙事开篇，并保留差遣来源与被动含义。
