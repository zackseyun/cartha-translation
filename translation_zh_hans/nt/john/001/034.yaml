  source_fidelity: 译文准确传达了κἀγώ的第一人称承接、两个完成时所表达的既成见证，以及ὅτι引出的见证内容。“这一位就是”恰当地保留οὗτός的指示和判断语气；“上帝所拣选的”忠实表达带冠词、名词化的ὁ ἐκλεκτὸς τοῦ θεοῦ，没有以“上帝的儿子”异文取代SBLGNT正文。
  naturalness: “我已经看见了，并且作证说，这一位就是上帝所拣选的”在现代普通话中自然、庄重且易懂。句末以“所拣选的”名词化指人，在“这一位就是”的框架中清楚成立。
  terminology: “上帝”“作证”“拣选”用语前后一致，语域适合经文。“上帝所拣选的”避免了“选民”等可能误导为群体性术语的表达，也保留了该称号的被动及关系性。脚注准确说明“上帝的儿子”这一重要异文，并且锚点位置正确。
