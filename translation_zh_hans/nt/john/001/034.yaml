  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: zh_hans
  text: 我已经看见了，并且作证说，这一位就是上帝所拣选的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“上帝的儿子”，而不是“上帝所拣选的”。
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: 我……并且
  rationale: κἀγώ由καί与ἐγώ合成，既承接上文，又突出施洗约翰本人。汉语以“我”作主语，并用“并且”连接两个完成时动词，比生硬地译成“而我”更自然。
- source_word: ἑώρακα
  choice: 已经看见了
  rationale: 完成时表示已经发生的亲眼看见，并且其效力延续至当前；“已经……了”以自然汉语体现这一点。
- source_word: μεμαρτύρηκα
  choice: 作证
  rationale: 完成时指已经作出的见证具有持续效力。汉语“作证”清楚、庄重；上下文及“已经看见了”足以承载时态关系，无须重复“已经”。
- source_word: ὅτι
  choice: 说
  rationale: 此处ὅτι引出见证的内容，并非表示原因。现代汉语以“作证说”自然引入宾语从句。
- source_word: οὗτός
  choice: 这一位
  rationale: 指示代词直接指向耶稣。“这一位”既保留希腊文的指示力度，也比单说“这”更合乎现代汉语对人的称呼。
- source_word: ἐκλεκτός
  choice: 所拣选的
  rationale: 带冠词的形容词在此名词化，指被拣选者。结合“这一位就是”，译作“上帝所拣选的”自然清楚，并保留被动的拣选关系；不采用较具神学术语色彩的“选民”或“选者”。
- source_word: τοῦ θεοῦ
  choice: 上帝所……的
  rationale: 属格与ἐκλεκτός共同表达此人是由上帝拣选的。汉语“上帝所拣选的”比直译“上帝的被拣选者”更自然，同时没有把关系扩展为原文未明说的含义。
theological_decisions:
- issue: 约翰福音1:34中的基督论称号及文本异文
  choice: 上帝所拣选的
  alternative: 上帝的儿子
  rationale: 所给SBLGNT正文为ὁ ἐκλεκτὸς τοῦ θεοῦ，应按其直接翻译，不以更常见的异文“上帝的儿子”替代。后者是重要的基督论文本异文，因此在脚注中说明，以保存文本证据与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我已经看见了，并且作证说”保留两个希腊文完成时的持续效力，但避免汉语中过度重复时态标记；“这一位就是”体现指示代词与系词的强调。脚注标记[a]已置于相关称号之后。
