  rationale: 删去“本来”，使末句更贴近πρῶτός μου ἦν，并保留其在时间与优先性上的含义张力。将“曾呼喊说”改为“并呼喊说”，使汉语更自然，也避免把完成时的见证仅理解为已终结的过去行动。脚注锚点仍准确对应“已经在我前面了”和“在我以前”。
