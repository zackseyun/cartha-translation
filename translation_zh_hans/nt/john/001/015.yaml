  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: zh_hans
  text: 约翰为他作见证，并呼喊说：“这位就是我所说的那一位：‘那在我以后来的，已经在我前面了[a]，因为他在我以前[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经居于我之上”或“已经超越我”。原文既可表示先后，也可表示地位或等级上的优先。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他在我以前就已经存在。”正文较贴近原文的措辞，同时让上下文保留其先存的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: 为他作见证
  rationale: 现在时带有持续或生动陈述的意味；“作见证”保留了证人作证的语义，也是现代汉语中清楚、庄重的表达。
- source_word: περὶ αὐτοῦ
  choice: 为他
  rationale: 在“作见证”这一汉语搭配中，“为他作见证”自然地表达“关于他作见证”，又不显累赘。
- source_word: κέκραγεν
  choice: 曾呼喊说
  rationale: κράζω 的完成时表示已经发出的公开呼喊，其见证仍具效力；“曾”交代既往行动，“呼喊”保留其强烈、公开的语气。汉语不宜机械复制希腊语完成时。
- source_word: λέγων
  choice: 说
  rationale: 用“呼喊说”自然承接分词结构，避免生硬直译。
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: 这就是我所说的那一位
  rationale: “就是”符合现代汉语的指认句式；“我所说的那一位”保留关系结构，并由上下文体现先前说过。
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: 那在我以后来的
  rationale: 保留实词化分词及“在我以后”的次序含义，同时可让上下文承载事工次序的意味。
- source_word: ἔμπροσθέν μου γέγονεν
  choice: 已经在我前面了
  rationale: “已经……了”体现 γέγονεν 的完成结果；“在我前面”保留 ἔμπροσθεν 可能涉及先后、地位或优越性的开放性，不在正文中预先限定。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后一句是前一句的理由。
- source_word: πρῶτός μου ἦν
  choice: 他本来在我以前
  rationale: “本来”传达 ἦν 所指向的既存状态，“在我以前”保留 πρῶτος 与属格所表达的优先性，同时不把“存在”一词直接增补进正文。
theological_decisions:
- issue: 末句是否明确译出基督的先存
  choice: 译作“他本来在我以前”
  alternative: “他在我以前就已经存在”
  rationale: 上下文强烈指向基督的先存和优越性，但原文只说 πρῶτός μου ἦν。正文采用较贴近原文的表达，让约翰福音的上下文显明其神学分量，而不以解释性增词消除张力。
- issue: ἔμπροσθέν μου γέγονεν 应按时间先后还是地位高低理解
  choice: 译作“已经在我前面了”
  alternative: “已经超越我”或“已经居于我之上”
  rationale: 原语可表达居前、优先或地位超越。保留“在我前面”的意象，可避免只选定时间或等级中的一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为他作见证”“那一位”等表达适合经文语体，但避免文言化。“已经在我前面了”有意保留原文略显反常的先后与地位双重张力，并以脚注说明主要译法。
