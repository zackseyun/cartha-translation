  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: zh_hans
  text: 万物都是借着他而有的；离了他，凡已经存在的，没有一样不是借着他而有的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或从第4节开始断句，译作：“已经存在的，在他里面就是生命。”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 万物
  rationale: 中性复数在这里具有包举一切的含义；“万物”自然、庄重，并保留宇宙性的范围。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示媒介或施事途径；“借着他”既符合现代汉语圣经语体，也保留万物经由“道”而有的关系。
- source_word: ἐγένετο
  choice: 有／得以存在
  rationale: γίνομαι在此指进入存在、开始存在，而不只是被加工制造。首句用“而有”简洁自然；否定句用“得以存在”避免汉语中“没有一样得以有”的生硬表达，同时维持本体论含义。
- source_word: χωρὶς αὐτοῦ
  choice: 离了他
  rationale: χωρίς表达分离或不依赖；“离了他”庄重而自然，清楚否定任何受造之物独立于他而有。
- source_word: οὐδὲ ἕν
  choice: 没有一样
  rationale: 保留οὐδέ与中性单数ἕν所构成的强调性、无例外的否定，同时符合现代汉语表达。
- source_word: ὃ γέγονεν
  choice: 凡已经有的
  rationale: 按所给希腊文本的标点，将关系从句接在第3节末尾；“已经”体现完成时所指已经进入存在并持续存在的结果。“凡……的”自然表达其概括性关系从句功能。
theological_decisions:
- issue: 末句ὃ γέγονεν的归属
  choice: 接在第3节：“离了他，凡已经有的，没有一样得以存在。”
  alternative: 接到第4节开头：“凡在他里面有的就是生命。”
  rationale: 早期希腊抄本原无标点，因此末句既可收束第3节，也可开启第4节。正文采用前一种通顺且广为接受的断句，以强调万物无一例外都借着“道”而有；脚注保留后一种真实可能，不消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万物”“借着他”“离了他”保持序言的崇高语气；避免用“造”将γίνομαι缩减为制造，也避免生硬直译“成为存在”。脚注标记置于全句末尾，指向末句断句的另一可能。
