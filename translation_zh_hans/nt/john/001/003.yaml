revisions:
- from: 万物都是借着他而有的；离了他，凡已经有的，没有一样得以存在。[a]
  to: 万物都是借着他而有的；离了他，凡已经存在的，没有一样不是借着他而有的。[a]
  rationale: 修订使两次“借着他而有”对应原文两次ἐγένετο，并以“凡已经存在的”表达关系从句ὃ γέγονεν的完成体意义。脚注保留无原始标点所产生的真实断句歧义，并按替代断句准确译出“已经存在的，在他里面就是生命”，不对其困难语义作教义性解释。
