  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: zh_hans
  text: 光在黑暗中照耀，黑暗却没有胜过光[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黑暗却没有领会光”，也可译：“黑暗却没有抓住光。”希腊语动词既可指胜过、制伏，也可指抓住、领会。
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 中文以“光”自然表达带冠词的主题性所指；汉语没有冠词，无须另加指示词。
- source_word: σκοτίᾳ / σκοτία
  choice: 黑暗
  rationale: 保留约翰序言中“光”与“黑暗”的鲜明对照及一定程度的拟人色彩。
- source_word: φαίνει
  choice: 照耀
  rationale: 以现在时语感表达持续而鲜明的动作；“照耀”庄重自然，也比单用“照”更清楚。
- source_word: κατέλαβεν
  choice: 胜过
  rationale: 该词可表示抓住、领会或制伏；在光与黑暗的对照意象中，“胜过”较贴合冲突层面，同时以脚注保留认知义的歧义。
- source_word: αὐτό
  choice: 光
  rationale: 希腊语中性代词在中文若译作“它”略显生硬且指代可能不够清楚；重复“光”既符合现代汉语，也保持其与 φῶς 的语法所指，不提前明确译为人格性的“他”。
theological_decisions:
- issue: 光暗对照中 κατέλαβεν 的含义
  choice: 没有胜过光
  alternative: 没有领会光；没有抓住光
  rationale: 原词兼有认知性的“领会”和敌对性的“抓住、制伏”之义。正文采用较符合光暗冲突意象的“胜过”，但不把可能的双关压平，故在脚注列出其他译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光在黑暗中照耀”保持简洁有力；后半句重复“光”以避免中性代词在汉语中的生硬或人格化过度。脚注标记置于整句之后，因为歧义集中在末句动词及其宾语。
