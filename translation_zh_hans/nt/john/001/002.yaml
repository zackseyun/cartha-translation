  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: zh_hans
  text: 他[a]在起初与上帝同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一位在起初与上帝同在。”
    reason: 词汇替代译法：οὗτος形式上是指示代词“这一位”，但在上下文中回指“道”。
lexical_decisions:
- source_word: οὗτος
  choice: 他
  rationale: οὗτος直译为“这一位”，在此回指1:1的“道”。现代汉语用“他”更自然，也保留其人格性指称；脚注列出较贴近形式的译法。
- source_word: ἦν
  choice: 同在（其中“在”体现ἦν）
  rationale: ἦν是εἰμί的未完成过去时，表达在起初已经持续存在的状态。汉语不以时态屈折表达这一点；结合“起初”和“同在”即可自然传达。
- source_word: ἐν ἀρχῇ
  choice: 起初
  rationale: “起初”简洁、庄重，并保留与《创世记》1:1的明显呼应；“在起初”虽更形式对应，但现代汉语中略显生硬。
- source_word: πρὸς
  choice: 与……同在
  rationale: πρός加宾格在此表达面向性的亲密关系，同时保留“道”与上帝之间的区别。“与……同在”比单说“和……在一起”更庄重，也不过度规定其形而上含义。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 定冠词在现代汉语中无需另行翻出。“上帝”是自然、清楚且庄重的θεός译法。
theological_decisions:
- issue: οὗτος与1:1中“道”的关系
  choice: 以人格代词“他”回指“道”
  alternative: 译作“这一位”
  rationale: 本节重申1:1所说“道”在起初与上帝同在。“他”自然地保留人格性回指，却不加入原文没有的身份称谓；“这一位”作为形式上更直接的译法收入脚注。
- issue: πρὸς τὸν θεόν的关系含义
  choice: 译作“与上帝同在”
  alternative: 译作“面向上帝”或“在上帝面前”
  rationale: “与上帝同在”既表达亲密关系，也保留“道”与上帝之间的关系性区别，不进一步界定其形而上性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“起初”保留与《创世记》开篇的互文呼应；“与上帝同在”符合约翰序言的庄重语体。
