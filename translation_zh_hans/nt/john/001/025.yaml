  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: zh_hans
  text: 他们问他，说：“那么，如果你不是弥赛亚，不是以利亚，也不是那位先知[a]，你为什么施洗呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位先知”可能指人们所期待、像摩西一样的先知（参申命记18:15）。
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: 他们就问他
  rationale: 希腊文叠用“问他、对他说”引出直接引语；现代汉语用“问他”即可自然表达完整言语行为，避免生硬重复。
- source_word: Τί οὖν βαπτίζεις
  choice: 那你为什么施洗呢
  rationale: τί在此结合οὖν询问施洗的理由或依据；“那……为什么……呢”自然传达承接上文的质问语气。现在时βαπτίζεις指约翰当下持续进行的施洗活动。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是犹太期待中的称号，并非姓名；“弥赛亚”比“基督”更直接保留对话的犹太语境。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ προφήτης
  choice: 那位先知
  rationale: 定冠词表明所指是听者熟知、受期待的特定人物；“那位”在中文中自然体现这种特指，而不靠英文式大写。
- source_word: οὐδὲ ... οὐδὲ
  choice: 不是……也不是……
  rationale: 在“你不是”之后以并列否定表达三个被排除的身份，符合现代汉语习惯。
theological_decisions:
- issue: Χριστός在身份询问中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词在此明显作为受期待者的称号使用；译作“弥赛亚”保留犹太弥赛亚期待，同时不加入特定宗派解释。
- issue: ὁ προφήτης是否指特定的受期待人物
  choice: 那位先知
  alternative: 先知
  rationale: 冠词及并列结构显示这不是泛指任何先知，而是一个已知的特定称号或期待人物；正文保留其特指性，脚注仅提示可能的经文背景，不把“可能”说成确定。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。将希腊文冗叠的引语公式压缩为“问他”，同时保留οὖν的承接与追问意味。用“那位先知”表达特指，不依赖中文不存在的大小写区别。
