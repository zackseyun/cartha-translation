id: JHN.1.23
reference: John 1:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: zh_hans
  text: 他说：“我就是在旷野呼喊之人的声音[a]：‘要修直主的道路！’正如先知以赛亚所说的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按另一种句法理解为：“我是在旷野的一个声音，属于一位呼喊者。”即“在旷野”可修饰“声音”，而不只修饰“呼喊”。不过，主文的理解更为自然。
    reason: 保留ἐν τῇ ἐρήμῳ在句法上可能与“声音”相连、而不只与“呼喊”相连的歧义。
lexical_decisions:
- source_word: ἔφη
  choice: 他说
  rationale: 这是对话中常见的引语提示语；“他说”自然、准确，不额外加强语气。
- source_word: Ἐγὼ
  choice: 我就是
  rationale: 希腊文明确使用第一人称代词，带有一定强调；“我就是”在中文自我表明身份的语境中自然地传达这种强调。
- source_word: φωνὴ βοῶντος
  choice: 呼喊之人的声音
  rationale: 按最自然的句法，将属格分词 βοῶντος 与“声音”相连，保留“声音属于一位呼喊者”的生动表达。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”既符合约翰活动的地理背景，也保留以赛亚引文的圣经意象；主文将其连接于“呼喊”。
- source_word: Εὐθύνατε
  choice: 要修直
  rationale: 命令式要求直接行动；“修直”既保留使道路笔直的具体图景，也符合现代中文表达。
- source_word: τὴν ὁδὸν
  choice: 道路
  rationale: “道路”兼具实际道路与比喻含义，适合先知性引文。
- source_word: κυρίου
  choice: 主
  rationale: 在以赛亚引文中，“主”保留 κύριος 的尊称及其盟约性、神学性分量，不弱化其所指。
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: 正如先知以赛亚所说的
  rationale: “正如”清楚标明约翰的自我描述与先知话语相对应；“先知以赛亚”是自然的现代中文称法。
theological_decisions:
- issue: 以赛亚引文中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处是对以赛亚书的引用，“主”保留原引文的神圣称谓及其神学张力；译作“主人”会不恰当地削弱这一层含义。
- issue: “在旷野”所修饰的成分
  choice: 在旷野呼喊之人的声音
  alternative: 旷野里的声音，是呼喊者的声音
  rationale: 希腊语序容许不同的句法切分，但将“在旷野”理解为修饰“呼喊”最为自然，也与本福音书中约翰的事奉场景吻合；脚注保留另一种可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我就是”传达自我表明身份时的适度强调；“旷野”“主的道路”保留先知引文的熟悉意象。引文内使用感叹号体现命令和呼喊的力度，但不添加原文没有的解释。
