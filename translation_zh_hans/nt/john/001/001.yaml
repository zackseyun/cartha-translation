  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: zh_hans
  text: 太初[a]有道，道与上帝同在，道就是上帝。[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: “太初”呼应《创世记》1:1，把道与创造的起始联系起来。
    reason: cross_reference
  - marker: b
    text: 末句也可译作“道具有上帝的本质”或“上帝是什么，道也是什么”。希腊文在这里把“上帝”置于谓语位置，常被理解为强调道具有上帝的属性；同时，前一分句表明道与所说的“上帝”有区别。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: 太初
  rationale: 这一短语呼应《创世记》1:1。“太初”简洁庄重，也保留了约翰所强调的创造开始之先与开始之时的语境。
- source_word: ἦν
  choice: 有／同在／就是
  rationale: 希腊文三次使用同一未完成时动词ἦν。汉语若机械地重复“是”会显得生硬，因此按各分句的句法分别译为“有”“同在”“就是”，同时保持道在太初已经存在、与上帝相交并具有上帝本质的陈述。
- source_word: ὁ λόγος
  choice: 道
  rationale: λόγος在此是具有丰富含义的基督论称谓，兼有言说、启示和自我表达等意味。“道”是简洁而成熟的汉语译法；“话语”容易显得非人格化，“理性”则会过度偏向希腊哲学含义。
- source_word: πρὸς τὸν θεόν
  choice: 与上帝同在
  rationale: πρός加宾格在此表达面向、相交和同在的关系。“与上帝同在”是自然汉语，并保留道与上帝之间的关系及位格区别；直译为“朝向上帝”过于生硬。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 带冠词的θεόν在此明确指上帝。“上帝”在现代普通话中清楚、尊崇，也避免单用“神”可能产生的泛称歧义。
- source_word: θεὸς ἦν ὁ λόγος
  choice: 道就是上帝
  rationale: 前置且不带冠词的谓语θεός主要具有性质性的力量，说明道具有上帝的本质，却不把道与前一分句所说的上帝混为同一位格。“道就是上帝”最自然有力地表达原文；相关语法意味在脚注中说明，以免汉语读者误解。
theological_decisions:
- issue: 末句不带冠词的谓语θεός如何翻译
  choice: 道就是上帝
  alternative: 道具有神性／上帝是什么，道也是什么
  rationale: 原文的语序和冠词用法使θεός侧重性质：既充分肯定道具有上帝的本质，又维持道与上一分句中“上帝”的区别。正文采用自然、直接的“道就是上帝”，不把性质性的含义弱化为泛泛的“具有神性”；脚注保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留“太初有道”这一简洁有力的汉语表达。正文维持三个并列分句的节奏；脚注标记依其实际说明内容放置：创造呼应标在“太初”之后，末句的语法说明标在“道就是上帝”之后。
