  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: zh_hans
  text: 耶稣回答他，说：“因为我告诉你，我看见你在无花果树下，你就信了吗？[a]你将看见比这些更大的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你信，是因为我告诉你，我看见你在无花果树下吗？”
    reason: 句首ὅτι所引出的原因可以在汉语中用不同的疑问结构表达；此译法更明显地把疑问焦点放在拿但业相信的原因上。
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: 耶稣回答他说
  rationale: 这是希腊语常见的叙事表达式。译作“回答他说”既保留“回答”与“说”的成分，也符合现代汉语的庄重叙事语体。
- source_word: Ὅτι
  choice: 因为
  rationale: 句首的ὅτι最自然地表达原因，引出耶稣所问的信心缘由；同时以问句和脚注保留其句法表达上的另一种可能。
- source_word: ὅτι
  choice: 我告诉你，我看见你……
  rationale: 第二个ὅτι引出所说的内容。现代汉语在“告诉你”之后无需硬译为“说我……”，用逗号自然表达内容关系。
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: 我看见你在无花果树下
  rationale: 直接保留过去时语义和具体意象；“在无花果树下”是自然、准确的现代汉语。
- source_word: πιστεύεις
  choice: 你就信了吗
  rationale: “信”承接约翰福音中对启示作出信心回应的核心用语；“就”自然呈现前述原因与相信之间的关联，而“吗”保留疑问语气。
- source_word: μείζω τούτων
  choice: 比这些更大的事
  rationale: μείζω是中性复数、作名词使用，τούτων构成比较。“比这些更大的事”准确保留复数所指和比较关系。
- source_word: ὄψῃ
  choice: 你将看见
  rationale: 以现代汉语“将”清楚表达将来意义，同时保持郑重而不古奥的语体。
theological_decisions:
- issue: πιστεύεις的语气和句子功能
  choice: 译为反问式疑问句“你就信了吗？”
  alternative: 译为陈述句“你信了”或加强为责备性的“你竟然就信了吗？”
  rationale: 上下文更支持疑问句，并随即引向将要看见更大之事的应许。译文不把问题削弱成陈述，也不加入原文没有明确表达的强烈责备。
- issue: 相信的原因与句首ὅτι的范围
  choice: “因为我告诉你……，你就信了吗？”
  alternative: “你信，是因为我告诉你……吗？”
  rationale: 两种汉语结构都能表达希腊文的因果性疑问。正文较贴近原文词序，脚注列出更自然地把疑问焦点放在原因上的译法，以保留真实的句法张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“回答他说”保留希腊文叙事公式；其余句式避免生硬欧化。“信”延续约翰福音的关键词用法，却不在本节额外补入信靠对象或神学解释。
