source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: zh_hans
  text: 然而，凡接待他的，就是信他名的人，他就赐给他们成为上帝的儿女的权利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权利”或译“权柄”或“能力”；希腊语这个词可指获授的权柄、权利或能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι δὲ
  choice: 然而，凡……的
  rationale: δὲ承接上文被自己人拒绝的情形，具有转折作用；ὅσοι表示所有属于这一类的人，用“凡……的”自然且保留整体涵盖性。
- source_word: ἔλαβον αὐτόν
  choice: 接待他的
  rationale: λαμβάνω在此不是指实际拿取，而是指接纳、欢迎道成肉身的“他”；“接待”既贴近原文，也比“接受”更能保留关系性的意味。
- source_word: ἔδωκεν αὐτοῖς
  choice: 他就赐给他们
  rationale: δίδωμι直译为“给”；在赐予来自上帝的资格这一语境中，“赐给”自然庄重，而“就”清楚呈现与前述接待者之间的句法关系。
- source_word: ἐξουσίαν
  choice: 权利
  rationale: ἐξουσία可表示权柄、权利或获准而有的资格；此处“权利”最自然地表达成为上帝儿女的获准身份，同时不把它仅仅理解为能力。
- source_word: τέκνα θεοῦ
  choice: 上帝的儿女
  rationale: τέκνα是涵盖男女的“孩子、儿女”，并非专指男性的υἱοί；“儿女”准确且符合现代汉语圣经语体。
- source_word: γενέσθαι
  choice: 成为
  rationale: γίνομαι表示进入一种新的状态；“成为”保留这种转变含义，优于静态的“是”。
- source_word: τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ
  choice: 就是信他名的人
  rationale: 该短语以同位方式进一步说明前面的接待者。“信他名”保留“名”这一重要意象，并以现代汉语中简洁自然的方式表达信靠指向他的身份与所启示的本人。
theological_decisions:
- issue: “接待他”与“信他名”的关系
  choice: 两个表达都保留，并以“就是”把后者呈现为对前者所指之人的进一步说明。
  alternative: 将两者合并，只译成“相信他”或“接受他”。
  rationale: 希腊文同时保留ὅσοι ἔλαβον αὐτόν与τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ；后者说明前者所指的人，却没有取消前一表达。译文因此保留二者及其关系。
- issue: τέκνα θεοῦ所表达的神圣亲子身份
  choice: 译为“上帝的儿女”。
  alternative: 译为“上帝的儿子”。
  rationale: 原文是性别包容的τέκνα，不是专指男性的υἱοί；“儿女”忠实保留原词范围，不额外引入男性限定。
- issue: ἐξουσίαν在此处的含义
  choice: 正文译为“权利”，脚注保留“权柄”或“能力”等可能语义。
  alternative: 正文译为“权柄”“能力”或“资格”。
  rationale: 语境侧重上帝所赐、使人成为其儿女的获准权利，但该词本身语义范围较宽；正文采用自然的语境义，同时以脚注避免过度收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”明确承接上文的对比；“接待”“赐给”“儿女”保留约翰福音的关系性和神学语感。脚注标记置于与ἐξουσίαν相关的整句末尾，避免打断正文阅读。
