  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: zh_hans
  text: 道成了肉身，住在我们中间[a]。我们看见了他的荣耀，如同父的独生子所具有的荣耀；他满有恩典和真理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住”所对应的希腊文也可译为“在我们中间支搭帐幕”或“在我们中间搭起帐棚居住”，带有帐幕的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: 道
  rationale: “道”是汉语圣经传统中对约翰序言这一位格性称号的成熟译法，既简洁，又保留其关乎表达、启示与神圣自我彰显的丰富含义。
- source_word: σὰρξ ἐγένετο
  choice: 成了肉身
  rationale: 直译并保留道成肉身的强烈表达，强调真实、有形的人的存在，而不把“肉身”抽象化为“人性”。
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: 住在我们中间
  rationale: 采用自然清楚的现代汉语；动词所可能唤起的帐幕意象在脚注中说明。
- source_word: ἐθεασάμεθα
  choice: 我们看见了
  rationale: 表达亲身目睹之意，语言自然，不采用较古雅的“瞻仰”。
- source_word: δόξαν
  choice: 荣耀
  rationale: 这是圣经语境中稳定而含义厚重的对应词，并保留本句的重复。
- source_word: ὡς μονογενοῦς παρὰ πατρός
  choice: 正是从父而来的独一者所具有的
  rationale: ὡς 在此描述所见荣耀的性质；μονογενής 的核心语义是独特、无可比拟。希腊文此处没有“儿子”一词，故正文不补入，以保留原文表达。
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: 他满有恩典和真理
  rationale: “满有”符合现代汉语，也保留“恩典和真理”这一具有圣经互文意味的固定表达；补出“他”以使中文指代清楚。
theological_decisions:
- issue: μονογενοῦς 是否译作“独生子”
  choice: 独一者
  alternative: 独生子；独生的；唯一的儿子
  rationale: μονογενής 主要强调独特、无可比拟，而本节希腊文并无 υἱός（儿子）。译作“独一者”既保留基督论含义，也不把上下文可推知的“子”直接写入正文；传统译法列入脚注。
- issue: 是否在正文凸显 ἐσκήνωσεν 的帐幕意象
  choice: 住在我们中间
  alternative: 在我们中间支搭帐幕；在我们中间搭起帐棚居住
  rationale: 正文优先采用自然、庄重且易懂的现代汉语，同时借脚注保留可能指向会幕和神同在的意象，不将互文解释强加于正文。
- issue: πλήρης 的修饰对象
  choice: 以“他”承接前文的道／独一者
  alternative: 理解为修饰“荣耀”
  rationale: 希腊文 πλήρης 为阳性单数，最自然地回指成为肉身的“道”或“独一者”，而不是阴性的“荣耀”；中文补出“他”可消除语法歧义。
translation_notes:
  register: 采用现代、自然、庄重的简体中文。“道成了肉身”保留约翰序言的传统辨识度；后半句适度重组，以清楚表达希腊文的修饰关系，同时保留原文在“独一者”称谓上的简约与张力。
