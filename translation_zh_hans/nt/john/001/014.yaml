  source_fidelity: “道成了肉身”“住在我们中间”“恩典和真理”准确传达原文。后半句的“正是从父而来的独一者所具有的荣耀”虽试图保留 μονογενοῦς 未明说 υἱός 的形式，但“独一者”在现代汉语中不自然，也弱化了该词在“父”这一语境中所指的独特子嗣关系。采用“父的独生子”符合约翰福音直接上下文及英语审计文本，同时在脚注保留“独生的／独一的”这一词义讨论。
  naturalness: 原译前半句自然庄重；“从父而来的独一者所具有的荣耀”结构较重，且“正是”容易把 ὡς 的“如同／仿佛”比较语气处理为等同断言。修订后句法更符合现代标准汉语的圣经文体。
  terminology: “道”“肉身”“荣耀”“恩典”“真理”均应保留。将 μονογενοῦς 在此译为“独生子”，并以注释说明也可按其独特性译为“独一的儿子”，既保留传统可识别的基督论称谓，也不把“独生”误释为生物学意义。
