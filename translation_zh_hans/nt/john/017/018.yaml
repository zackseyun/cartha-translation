  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: zh_hans
  text: 正如你差遣我到世上，我也照样差遣他们到世上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: 怎样……也照样
  rationale: 清楚表达比较关系，并以自然的汉语句式连接父差遣耶稣与耶稣差遣门徒这两件事。
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: 差
  rationale: 两处采用同一动词，保留原文刻意形成的平行结构；“差”简洁自然，也保有受差遣执行使命的含义，而不加入“委任”等较强的解释。
- source_word: εἰς τὸν κόσμον
  choice: 到世上
  rationale: “到”自然表达εἰς所含的趋向；“世上”保留约翰著作中κόσμος所指的人类世界及其神学张力，又不过度限定其含义。
- source_word: κἀγὼ
  choice: 我也照样
  rationale: 兼顾καί的添加意味与ἐγώ的主语强调，并与前面的“怎样”构成流畅的汉语照应。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 按上下文指耶稣的门徒；译作“他们”忠实而自然。
theological_decisions:
- issue: 父差遣子与子差遣门徒之间的使命类比
  choice: 两处均译作“差”，并用“怎样……也照样”保留平行关系。
  alternative: 第一处译“差”，第二处译“委派”或“差遣”。
  rationale: 原文强调两次差遣之间的类比，但并未宣称双方的身份或使命性质完全相同。采用同一动词可保留经文的平行，同时不作超出文本的教义推论。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“差”在本句中自然明确，并避免连续使用较书面的“差遣”造成冗重；整句保留原文的对称结构。
