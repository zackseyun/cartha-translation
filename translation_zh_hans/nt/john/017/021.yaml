source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: zh_hans
  text: 使他们都成为一[a]，正如你——父啊——在我里面，我也在你里面；使他们也在我们里面[b]，好让世人相信[c]，是你差遣了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们都合而为一”。希腊文直译是“使他们都成为一”，这样可保留合一的丰富含义，而不把它限定为某一个方面。
    reason: lexical_alternative
  - marker: b
    text: 本节反复使用“在……里面”（“在我里面”“在你里面”“在我们里面”），反映约翰福音中彼此内在和参与的语言，含义强于仅仅彼此相伴或有关联。
    reason: cross_reference
  - marker: c
    text: 或译“开始相信”。希腊文可以指世人的相信，却没有明确说明重点是开始相信，还是持续相信。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使／好让
  rationale: 本节连续三次使用ἵνα。前两处译作“使”，末处译作“好让”，既保留目的或结果的推进，也符合现代汉语表达。
- source_word: πάντες
  choice: 都
  rationale: “都”自然表达全体范围，并与复数主语“他们”搭配。
- source_word: ἓν
  choice: 一
  rationale: 希腊文使用中性单数“一”，没有具体限定合一的方式；直译为“一”可保留其广度和神学张力。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚标明信徒成为一与父子彼此内在关系之间的类比。
- source_word: πάτερ
  choice: 父啊
  rationale: 保留呼格的直接称呼；“啊”在现代汉语中自然表现呼语。
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: 在我里面……在你里面
  rationale: 一致保留ἐν的“在……里面”意象，不将约翰式的彼此内在语言弱化为仅仅“与……同在”。
- source_word: κἀγώ
  choice: 我也
  rationale: 体现κἀγώ的并列和对应作用，使父在子里面、子也在父里面的相互关系清楚可见。
- source_word: καὶ αὐτοὶ
  choice: 他们也
  rationale: 保留καί的附加意义，将信徒的参与同前述父子关系联系起来。
- source_word: ἐν ἡμῖν
  choice: 在我们里面
  rationale: 忠实保留介词ἐν及约翰福音中参与、内住的丰富含义；“与我们联合”会提前解释其确切性质。
- source_word: κόσμος
  choice: 世人
  rationale: 此处κόσμος指作为相信主体的世界；“世人”在汉语中自然，并保留其广泛的人类范围。
- source_word: πιστεύῃ
  choice: 相信
  rationale: 现在时虚拟语气置于ἵνα之后，可自然译为“相信”；原文没有明确限定是开始相信还是持续相信。
- source_word: ἀπέστειλας
  choice: 差遣了
  rationale: “差遣”准确表达带有使命的派出；“了”自然反映不定过去时所指的差遣行动。
theological_decisions:
- issue: 信徒的“一”与父、子的关系
  choice: 将ἓν译为“一”，并保留“在我们里面”。
  alternative: 译作“合而为一”“团结一致”或“在目标上同心”。
  rationale: 经文以父子关系类比信徒的合一，却没有把这种合一限定为组织、伦理、目标或本体层面的某一种形式。直译可保留原文的深度而避免教义性扩写。
- issue: 约翰著作中的彼此内在语言
  choice: 连续译作“在我里面”“在你里面”“在我们里面”。
  alternative: 译作“与我同在／与你同在／与我们同在”或“同我们联合”。
  rationale: 原文反复使用ἐν；保持同一表达既呈现修辞联系，也不把内住和参与的含义缩减为一般的相伴或关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成为一”略带经文语体，但为保留ἓν的简洁和开放性而有意采用。以破折号标出插入的呼语“父啊”，既贴近希腊文语序，也避免误读。三个脚注标记均放在各自所说明的词语之后。
