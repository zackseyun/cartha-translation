source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: zh_hans
  text: 我把你所赐给我的荣耀赐给了他们[a]，使他们合而为一，正如我们合而为一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也把你所赐给我的荣耀赐给了他们。”句首希腊语κἀγώ可带有“我也”的附加强调。
    reason: 保留κἀγώ兼具承接作用与附加强调的词义可能。
lexical_decisions:
- source_word: κἀγὼ
  choice: 我
  rationale: κἀγώ由καί与ἐγώ缩合而成，既承接上文，也可能带有“我也”的附加强调。正文用自然汉语的“我”承接语流，并以脚注保留附加强调的可能。
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα在《约翰福音》中具有浓厚的神学含义，不只指人的荣誉，也涉及神所彰显的荣美与尊荣；“荣耀”能保留这一分量及全书用语的一致性。
- source_word: ἣν δέδωκάς μοι
  choice: 你所赐给我的
  rationale: 关系从句修饰“荣耀”；“所……的”自然、清楚。完成时δέδωκας表达已经赐下且结果仍然有效，汉语用“赐给”配合语境即可体现，不另加可能显得累赘的体貌词。
- source_word: δέδωκα αὐτοῖς
  choice: 赐给了他们
  rationale: 完成时δέδωκα表示行动已经完成且影响持续；“了”明确礼物已经赐下，而“赐给”符合对象是荣耀的庄重语域。
- source_word: ἵνα
  choice: 使
  rationale: ἵνα引出目的或预期结果；“使”在现代汉语中简洁自然，并保留目的—结果之间未完全限定的关系。
- source_word: ὦσιν ἓν
  choice: 合而为一
  rationale: 希腊文直译为“是一个/是一”。中性单数ἕν强调合一而非成为同一个人；“合而为一”是自然汉语，既表达真实合一，也不具体规定其本体、关系或使命层面的性质。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚表达比较关系，并具有自然、庄重的现代汉语风格。
- source_word: ἡμεῖς ἕν
  choice: 我们是一
  rationale: 希腊文省略第二个系词，汉语补出“是”以成句；保持简洁的“一”，不把父与子的合一进一步解释为某一种特定形式。
theological_decisions:
- issue: 信徒的合一与父子合一之间的性质
  choice: 译为“使他们合而为一，正如我们是一”，直接保留两者之间的比较，不界定这种合一究竟是本体性的、关系性的还是使命性的。
  alternative: 可解释为纯粹的关系合一、参与神的生命，或制度与教会组织上的合一。
  rationale: 经文本身确立了真实的类比，却没有在本节详尽说明类比的具体方式。译文不应替经文预先解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荣耀”“赐给”保留约翰文献的神学分量；“合而为一”使汉语自然，同时避免把中性单数ἕν误解为所有人成了同一个位格。脚注标记[a]已置于正文相应分句之后。
