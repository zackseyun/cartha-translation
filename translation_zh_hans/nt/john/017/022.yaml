    issue: “正如我们是一”不够自然，且句义突兀。
    rationale: 希腊语可省略系词，但现代汉语中“我们是一”通常不构成自然、完整的表述。补足为“我们合而为一”与前面的“他们合而为一”形成清晰平行，忠实表达比较关系，且不额外规定“合一”的具体性质。
