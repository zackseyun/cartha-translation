- from: 我把你所赐给我的荣耀赐给了他们[a]，使他们合而为一，正如我们是一。
  to: 我把你所赐给我的荣耀赐给了他们[a]，使他们合而为一，正如我们合而为一。
  rationale: 仅修改末句，使其符合现代标准汉语的自然句法，并在比较结构中保持“合而为一”的平行表达。原文并未说明这种合一的具体性质，修订亦未作此类界定。脚注锚点及其内容均保留，且与正文对应。
