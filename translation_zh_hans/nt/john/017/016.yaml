  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: zh_hans
  text: 他们不属于这世界[a]，正如我不属于这世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是来自这世界。”希腊语ἐκ可表达来源、出身或归属。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: 属于这世界
  rationale: 希腊语ἐκ本指来源、出身，也可在此语境中表达归属。现代汉语若直译为“不来自世界”容易被理解为空间来源；“不属于这世界”自然地传达约翰语境中的归属关系，同时由脚注保留来源义。两处重复采用同一译法，以保持原文的平行结构。
- source_word: κόσμου
  choice: 这世界
  rationale: 保留κόσμος的简明表达，不扩译为“世界体系”或“堕落秩序”，以免消解约翰著作中“世界”一词的丰富含义和神学张力。
- source_word: οὐκ εἰσὶν / οὐκ εἰμί
  choice: 不属于
  rationale: 否定现在时与ἐκ τοῦ κόσμου合译为“不属于这世界”，表达当前的身份与归属；两小句保持一致。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚、庄重且自然地标示门徒与耶稣之间的对应比较。
- source_word: ἐγώ
  choice: 我
  rationale: 保留原文显出的第一人称代词，使比较对象和语气重点清楚。
theological_decisions:
- issue: 约翰神学中“世界”的含义
  choice: 正文保留“这世界”，不作解释性扩写。
  alternative: 译作“世界体系”或“现今堕落的秩序”。
  rationale: κόσμος在约翰著作中可能指与上帝疏离的人类世界，但本节没有限定为某一种系统性含义；保留原词可避免加入过窄的教义解释。
- issue: ἐκ所表达的来源与归属
  choice: 正文采用“不属于”，脚注说明也可按来源理解为“不来自”。
  alternative: 正文直译为“不来自这世界”。
  rationale: 中文“不属于”较自然，也符合语境中的身份关联；但ἐκ确有来源、出身之义，因此以脚注保存这一真实的词义幅度，不把经文只限定为归属。
translation_notes:
  register: 采用现代、简明而庄重的普通话。保留两小句的重复和平行，不用“世界体系”等解释性术语。
