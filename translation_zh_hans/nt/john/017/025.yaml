id: JHN.17.25
reference: John 17:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: zh_hans
  text: 公义的父啊！世界[a]虽不认识你，我却认识你；这些人也知道，是你差我来的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界”在约翰著作中常不只指受造界，也可指与神疏离的人类。
    reason: semantic_range
  - marker: b
    text: 希腊文“不认识”“认识”“知道”和“差”都使用不定过去时；这里的汉语没有强加“曾经”或“已经”，以保留其时体上的开放性及上下文中的现实关联。
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: 公义的父啊
  rationale: 保留呼格的直接称呼和 δίκαιος 的道德、神学分量；“公义”比仅偏向司法含义的“公正”更贴近圣经语境，“啊”使现代汉语呼语自然庄重。
- source_word: καὶ
  choice: 虽
  rationale: 此处 καὶ 在语境中引出让步与对比；译为“虽”能自然呈现世界不认识父与耶稣认识父之间的张力，同时不把逻辑关系说得过满。
- source_word: ὁ κόσμος
  choice: 世界
  rationale: 保留约翰著作中 κόσμος 的宽广和多层含义，不在正文中限定为“世人”或“世界体系”。
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: 不认识 / 认识 / 知道
  rationale: 前两处涉及对父的认识，用“认识”保留关系性含义；末处接 ὅτι 内容从句，用汉语自然的“知道”。汉语未强加完成体标记，因而可容纳希腊语不定过去时在本语境中的完成与当前关联。
- source_word: ἐγὼ δέ
  choice: 我却
  rationale: “却”明确保留 δέ 的对比作用，与前面的“虽”构成自然而庄重的汉语句式。
- source_word: οὗτοι
  choice: 这些人
  rationale: 忠实表达近指代词所指的一群人，又避免生硬的独立“这些”；不直接译成“门徒”，以免把语境推断写入正文。
- source_word: σύ με ἀπέστειλας
  choice: 是你差我来的
  rationale: “是你……的”突出希腊文显式主语 σύ；“差我来”是现代汉语中自然、庄重的差遣表达，并保留耶稣来自父的意涵。
theological_decisions:
- issue: δίκαιε 所表达的父的属性
  choice: 公义的父
  alternative: 公正的父
  rationale: “公义”既涵盖正直和合宜，也保留经文中的道德与神学厚度，不把含义缩窄为司法公平。
- issue: 约翰语境中 κόσμος 的含义
  choice: 世界
  alternative: 世人；世界体系
  rationale: 原词可指受造世界，也常涉及与神疏离的人类；正文保留其多层性，不替读者消解这种张力。
- issue: γινώσκω 三个不定过去时的时体表达
  choice: 采用汉语无显式时体标记的“认识／知道”
  alternative: 译作“从未认识／已经认识／已经知道”
  rationale: 希腊语形式可强调整体事件，而上下文又显示其现实关联；不额外加入“已经”或“从未”，可避免把时体解释绝对化。
- issue: 父差遣耶稣的陈述
  choice: 是你差我来的
  alternative: 你差遣了我
  rationale: 所选表达保留差遣事实，并借汉语强调结构对应显式的 σύ；不额外说明差遣的方式或时间。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“虽……却……”清楚呈现句间对比；分号区分耶稣对父的认识与“这些人”的认知。避免古雅的“尔、遣”，也不把“世界”解释性改写为“世人”。
