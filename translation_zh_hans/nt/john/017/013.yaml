  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: zh_hans
  text: 但现在，我到你那里去；我在世上说这些话，是要使他们心里充满我的喜乐[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “充满”也可译为“得以满足”或“达到完全”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他们里面”；也可能指“在他们中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: 但现在
  rationale: νῦν标明当前时刻，δέ带有轻微的转折或承接意味；“但现在”既体现语篇转折，也不过分强化对立。
- source_word: πρὸς σὲ ἔρχομαι
  choice: 我要到你那里去
  rationale: ἔρχομαι与πρὸς加宾格表示朝向父而去；结合耶稣即将离世归父的语境，现代汉语用“我要……去”自然地表达临近的行动。
- source_word: ταῦτα λαλῶ ἐν τῷ κόσμῳ
  choice: 我在世上说这些话
  rationale: 保留λαλῶ的“说”以及约翰福音中κόσμος“世界”的主题性用语；“在世上”在本语境中指耶稣仍处于世上的时候，同时不在正文中过度解释。
- source_word: ἵνα ἔχωσιν
  choice: 是要使他们拥有
  rationale: ἵνα引出目的，ἔχωσιν表达“有、拥有”；“是要使”在现代汉语中清楚传达目的关系。
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: 我的喜乐
  rationale: 重复冠词加物主形容词突出这喜乐属于耶稣；“我的喜乐”简洁自然，不额外界定这种喜乐的神学机制。
- source_word: πεπληρωμένην
  choice: 达到完全
  rationale: πληρόω的完成时被动分词表示喜乐已被带到丰满、完满的状态；“达到完全”保留结果状态，也符合汉语搭配。
- source_word: ἐν ἑαυτοῖς
  choice: 在他们里面
  rationale: 反身代词最自然地指喜乐在门徒内在的存有和体验；“在他们里面”形式上贴近原文，同时保留“在他们中间”的可能性于脚注。
theological_decisions:
- issue: “我的喜乐”的性质
  choice: 指属于耶稣、并要由门徒拥有的喜乐
  alternative: 指门徒因耶稣而有的喜乐
  rationale: 物主形容词ἐμὴν最自然地指耶稣自己的喜乐。译文不进一步说明门徒如何分享这喜乐，以免加入经文未明说的神学解释。
- issue: 喜乐“达到完全”的位置或范围
  choice: 在门徒里面达到完全
  alternative: 在门徒群体中间达到完全
  rationale: ἐν ἑαυτοῖς既可按个体内在理解，也可能带有群体内部的意味；正文采用较自然的内在含义，脚注保留群体性读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为在汉语中清楚呈现ἔχωσιν与完成时被动分词πεπληρωμένην的关系，将原文紧密结构展开为“拥有我的喜乐，并使这喜乐……达到完全”，未增添新的命题内容。
