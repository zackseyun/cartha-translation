  source_fidelity: 原译正确把握了“但现在”“到你那里去”“在世上说这些话”及目的从句，也保留了“我的喜乐”和喜乐在门徒之内达到圆满的核心意义。不过，“使他们拥有我的喜乐，并使这喜乐在他们里面达到完全”把希腊文中一个紧密的“有……被充满/成全”的表达拆成两个并列动作；“使这喜乐……达到完全”也较生硬，且“使”似乎将成全喜乐的动作单独归给耶稣。
  naturalness: “使他们心里充满我的喜乐”是现代汉语中自然、庄重的表达，能清楚表达门徒内在拥有耶稣的喜乐，并且该喜乐达至丰满。用分号连接前后两个独立分句，也较贴合祷告中的庄重语气。
  terminology: “世上”“喜乐”符合约翰福音及现代汉语圣经的常用庄重用语。“心里”是对ἐν ἑαυτοῖς的自然意译；脚注保留“在他们里面”及可能的群体性理解，避免将该短语的范围绝对化。
