- from: 但现在，我要到你那里去。我在世上说这些话，是要使他们拥有我的喜乐，并使这喜乐在他们里面达到完全[a][b]。
  to: 但现在，我到你那里去；我在世上说这些话，是要使他们心里充满我的喜乐[a][b]。
  rationale: 修订将目的从句恢复为汉语中紧密、自然的表达：“使他们心里充满我的喜乐”。这对应门徒具有耶稣自己的喜乐、且该喜乐在他们里面处于丰满状态，避免将原文拆作两个独立使役行为。脚注分别保留πεπληρωμένην的“充满／满足／完全”语义范围与ἐν ἑαυτοῖς的内在／群体范围。
