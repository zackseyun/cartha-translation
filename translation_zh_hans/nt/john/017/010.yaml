  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: zh_hans
  text: 凡是我的，都是你的；你的也是我的。我已经在他们身上得了荣耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在他们里面”，在这里也可理解为“借着他们”或“在他们中间”，并可表示荣耀在他们身上彰显出来。
    reason: 保留介词ἐν可能表达的处所、媒介或彰显等语义，不在正文中消除原文的含混性。
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: 凡是我的
  rationale: 中性复数名词化并由πάντα概括，指凡属耶稣的一切。“凡是我的”自然、全面，又避免把所指局限为物品。
- source_word: σά
  choice: 都是你的
  rationale: 以现代汉语的领属表语表达第二人称所有关系；补出“都是”使句子完整，并与πάντα的总体范围相应。
- source_word: τὰ σὰ ἐμά
  choice: 你的也是我的
  rationale: 简洁保留与前句对称的相互所属关系，不把原文缩减为仅仅功能上的合作。
- source_word: δεδόξασμαι
  choice: 我已经……得了荣耀
  rationale: 用“已经……得了荣耀”表达完成时被动语态所指的既成事实及其现存结果；中文虽采用自然的“得荣耀”结构，意义仍是荣耀归于耶稣，而非他使自己得荣耀。
- source_word: ἐν αὐτοῖς
  choice: 在他们身上
  rationale: “他们”按上下文自然指父赐给耶稣的人。“在他们身上”是现代汉语中可懂而庄重的表达，可承载荣耀在他们那里彰显的意思，同时不在正文中强行限定为工具、处所或群体中的临在。
theological_decisions:
- issue: 圣子与父之间相互所属的陈述
  choice: 直接译作“凡是我的，都是你的；你的也是我的”
  alternative: 将其弱化为双方只是在工作或职能上合作
  rationale: 希腊文明确作出双向的领属陈述。译文保留其完整力度，但不加入本节没有明说的后期教义术语。
- issue: ἐν αὐτοῖς的所指与语义作用
  choice: 正文译作“在他们身上”，并用脚注保留其他可能语气
  alternative: 明确译成工具性的“借着他们”，或群体处所性的“在他们中间”
  rationale: ἐν在此可表达所在、媒介或彰显所依托的范围；上下文不能迫使译者只选其中一种，因此正文保持较宽的表达，脚注列出可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡是我的”与“你的也是我的”保持原句的简洁对称；分号突出两项相互所属的陈述，句号使最后的得荣耀陈述清楚有力。脚注标记紧随其所解释的“在他们身上得了荣耀”。
