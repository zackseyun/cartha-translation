id: JHN.17.15
reference: John 17:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: zh_hans
  text: 我不是求你把他们从世上带走，而是求你保守他们脱离那恶者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保守他们脱离邪恶。”希腊语 τοῦ πονηροῦ 既可指“那恶者”，也可指“邪恶”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: 求
  rationale: 这里是耶稣向父祈求；“求”既自然体现当下的请求，也比“祷告”更直接对应原词的“请求、求问”义。
- source_word: ἄρῃς
  choice: 带走
  rationale: αἴρω 在这里指移走、带离；与“从世上”连用时，“带走”符合现代汉语表达。
- source_word: κόσμου
  choice: 世上
  rationale: κόσμος 在约翰著作中含义宽广，此处“从世上带走”自然表达身处世界之中的空间与处境，不额外限定为“世界体系”或“人类社会”。
- source_word: τηρήσῃς
  choice: 保守
  rationale: τηρέω 可指看守、守护、保存；“保守他们脱离……”是庄重而通顺的祈求用语，也保留其保护之意。
- source_word: ἐκ
  choice: 脱离
  rationale: 在 τηρήσῃς … ἐκ 的结构中表示使人免受某者或某事物侵害；“保守……脱离”在汉语中自然，并与前句“从世上带走”形成对照。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的单数形容词在希腊文中既可作阳性，指“那恶者”，也可作中性，指“邪恶”。约翰著作的用法较支持人格化所指，因此正文译为“那恶者”，同时用脚注保留另一可能。
theological_decisions:
- issue: τοῦ πονηροῦ 是指人格化的“那恶者”，还是泛指“邪恶”
  choice: 那恶者
  alternative: 邪恶
  rationale: 希腊文形式本身有歧义；约翰著作中的相关用法及此处求神保护门徒的语境较倾向指向人格化的恶者，但不能排除中性意义，因此在脚注中保留“邪恶”这一译法。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“我不是求你……而是求你……”保留原文清晰的否定—转折结构；脚注标记紧接真正存在歧义的“那恶者”。
