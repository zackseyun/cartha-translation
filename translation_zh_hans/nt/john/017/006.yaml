source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: zh_hans
  text: “我已经向那些你从世上赐给我的人显明了你的名。[a]他们本是你的，你把他们赐给了我；他们已经持守你的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的名”不只是一个称呼，也指上帝所启示的身份和品格。“显明”也可译作“使人知道”或“启示”。
    reason: 说明“名”的文化与神学内涵，并保留φανερόω的词汇替代译法。
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: 我已经……显明
  rationale: φανερόω表示使某事显露、使人知道；“显明”既贴近原文的启示意味，也能自然搭配“你的名”。不译成较宽泛的“告诉”。
- source_word: τὸ ὄνομα
  choice: 你的名
  rationale: 保留原文具体的“名”，不直接释为“你的身份”或“你的品格”，从而保留约翰语境中的丰富含义。
- source_word: τοῖς ἀνθρώποις
  choice: 给……人
  rationale: ἄνθρωποι在此指父赐给耶稣的门徒，但该词本身可泛指人；现代汉语用“人”准确自然，无须显式标注性别。
- source_word: οὓς ἔδωκάς μοι ἐκ τοῦ κόσμου
  choice: 那些你从世上赐给我的人
  rationale: 保留“赐给我”和ἐκ所表达的从世人当中取出的意味；“从世上”在汉语中比“从世界之外”自然，也避免误解为空间迁移。
- source_word: σοὶ ἦσαν
  choice: 他们本是你的
  rationale: “本是”简洁保留未完成过去时的归属表达，并承接随后“赐给了我”的关系。
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: 你把他们赐给了我
  rationale: 以自然汉语语序表达父将这些人赐给子的陈述，不附加任何关于其机制的教义解释。
- source_word: τὸν λόγον σου
  choice: 你的话
  rationale: λόγος在此可指话语、信息或教导；“你的话”保留原词的简洁和约翰文献中的词汇呼应。
- source_word: τετήρηκαν
  choice: 他们也遵守了
  rationale: τηρέω在“话”作宾语时兼有持守与遵行之意；“遵守”是自然现代汉语，完成体以“了”表达已发生且结果持续。副词“也”体现καί的承接。
theological_decisions:
- issue: “你的名”在约翰神学中的含义
  choice: 正文保留“你的名”，脚注说明其所指不限于称呼
  alternative: 意译为“你是谁”或“你的品格”
  rationale: 原文明确使用“名”，其内涵涉及上帝所启示的身份和品格；保留原象可避免把丰富含义压缩成单一解释。
- issue: τοῖς ἀνθρώποις的指称与性别
  choice: 译为“那些……人”
  alternative: 译为“那些男人”或“那些门徒”
  rationale: 上下文所指是耶稣的门徒，但ἄνθρωποι本身是可泛指人的词；“人”忠实保留词义范围，也不把上下文信息写进词本身。
- issue: 父把人赐给子的神学含义
  choice: 直接保留“你把他们赐给了我”
  alternative: 按特定预定论或自由意志体系加以解释
  rationale: 本节肯定这些人由父赐给子，却未在此说明这一赐予的完整机制；译文不替经文解决后来的宗派争论。
- issue: τετήρηκαν所表达的回应
  choice: 译为“遵守了你的话”
  alternative: 译为“持守了你的话”
  rationale: 该动词可涵盖保守、持守和遵行。与“话”搭配时，“遵守”自然地表达依从，但不应扩展为无条件的完全顺服；脚注保留较直译的选择。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“显明”“赐给”“遵守”保留经文的郑重语气，又便于普通读者理解。分号呈现原文后半句的紧密并列关系；不人为解决“从世上”“赐给”所包含的神学张力。
