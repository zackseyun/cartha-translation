base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: zh_hans
  text: 如今，他们已经知道，你赐给我的一切都是从你而来的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所赐给我的一切都出于你。”
    reason: 词语与句式上的另一种译法；“出于你”同样可表达παρὰ σοῦ所指的来源。
lexical_decisions:
- source_word: νῦν
  choice: 如今
  rationale: 表示门徒目前已经达到的认识阶段；“如今”简洁自然，也与上下文的进展相称。
- source_word: ἔγνωκαν
  choice: 已经知道
  rationale: 完成时表达经过认识过程而形成、并持续至今的状态；“已经知道”兼顾已然结果和当前状态。
- source_word: πάντα ὅσα
  choice: 一切
  rationale: 该组合概括所有相关事物；汉语用“一切”自然地保留其全面性。
- source_word: δέδωκάς μοι
  choice: 你赐给我的
  rationale: δίδωμι的完成时强调父所赐之物及其持续意义；“赐给”在父与子的语境中庄重而自然，并未增添原文没有的内容。
- source_word: παρὰ σοῦ
  choice: 从你而来的
  rationale: παρά加属格在此表示来源；该译法明确保留父是这一切之来源的意思。
- source_word: εἰσιν
  choice: 都是
  rationale: 原文为复数动词，与πάντα所指的众多事物相应；“都是”在现代汉语中自然表达这一总括判断。
theological_decisions:
- issue: 父所赐给子的一切与父之间的来源关系
  choice: 译作“你赐给我的一切都是从你而来的”
  alternative: “你所赐给我的一切都出于你”
  rationale: 按παρὰ σοῦ的通常用法表达来源，保留经文关于父与子关系的陈述，不将其扩展为后来的教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如今”体现叙述进展；“已经知道”传达完成时的结果状态；句式保持简洁，并在正文中保留脚注标记[a]。
