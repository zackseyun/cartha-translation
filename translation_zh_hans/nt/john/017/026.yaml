  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: zh_hans
  text: 我已经使他们认识你的名[a][b]，也要使他们认识，好让你爱我的那份爱在他们里面[c]，也让我在他们里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经把你的名显明给他们，也还要显明。”
    reason: lexical_alternative
  - marker: b
    text: “你的名”不只是一个称呼，也指神所启示的身份和品格。
    reason: cultural_note
  - marker: c
    text: “在他们里面”也可译作“在他们中间”；正文译法保留了约翰福音中内住的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: 我已经使他们认识
  rationale: 以“使……认识”表达 γνωρίζω 的使役含义，并用“已经”体现不定过去时所指的已成行动；也与后面的将来时 γνωρίσω 保持对应。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 保留原文具体的“名”，不在正文中释义为“你的品格”或“你是谁”，从而保存约翰文本中的圣经意象及其丰富内涵。
- source_word: γνωρίσω
  choice: 也还要使他们认识
  rationale: 将未来主动直陈式译为“还要”，其宾语承接前文的“你的名”；中文无需机械重复宾语。
- source_word: ἵνα
  choice: 好让
  rationale: 自然表达 ἵνα 所引出的目的或结果，同时不强行限定二者中哪一种语义更突出。
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: 你爱我的那份爱
  rationale: 以现代汉语自然表达关系从句，明确这是父爱子的爱，又不增添这爱与信徒之间关系的解释。
- source_word: ἐν αὐτοῖς
  choice: 在他们里面
  rationale: 直接保留 ἐν 加与格的空间性表达，并与约翰福音中“内住”的主题相呼应；“在他们中间”仍是可能的理解。
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: 我也在他们里面
  rationale: 希腊文省略重复的 ᾖ；中文补出隐含的“在”，保持两项并列，而不说明基督内住与神的爱之间原文未明说的因果关系。
theological_decisions:
- issue: “你的名”在约翰神学中的含义
  choice: 正文保留“你的名”
  alternative: 译作“你是谁”或“你的品格”
  rationale: 这里的“名”涉及父所启示的身份和品格，但原文仍使用“名”；保留这一表达可避免把释义直接写入正文。
- issue: 神的爱与基督内住之间的关系
  choice: 将两者并列译为“那份爱在他们里面，我也在他们里面”
  alternative: 把后半句处理为原因、方式，或另一个展开的目的从句
  rationale: 原文并列呈现这两个现实，却没有明确说明二者的逻辑从属关系，因此译文不替原文消解这种神学张力。
- issue: ἐν αὐτοῖς 的范围含义
  choice: 在他们里面
  alternative: 在他们中间
  rationale: “里面”最直接地保留内在含义，也契合本段的内住语言；同时以脚注承认“中间”在语义上可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使他们认识”略带书面色彩，以准确保留 γνωρίζω 的使役意义；句末保持原文简洁的并列结构。
