source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: zh_hans
  text: 我和他们在一起的时候，我一直凭着你所赐给我的名保守他们，也护卫了他们；他们中没有一个灭亡，只有那灭亡之子[a]，为要使经上的话得以应验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡之子”是希伯来式表达，也可译作“那注定灭亡的人”；传统译法为“沉沦之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: 我和他们在一起的时候
  rationale: 自然表达持续的时间背景，也忠实对应“与他们同在”。
- source_word: ἐτήρουν αὐτοὺς
  choice: 一直……保守他们
  rationale: “一直”体现未完成时的持续动作；“保守”在约翰语境中兼顾看守、持守与护佑之意。
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: 在你所赐给我的名里
  rationale: 依照本节希腊文中性单数关系代词的语法，让“所赐给我的”修饰“名”，并保留“在……名里”的神学含义。
- source_word: καὶ ἐφύλαξα
  choice: 也护卫了他们
  rationale: 以“护卫”区别于前面的 τηρέω，保留 φυλάσσω 较强的守护意味；宾语按汉语需要补出。
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: 他们中没有一个灭亡
  rationale: “灭亡”传达 ἀπόλλυμι 在此处庄重而终极的语义，避免弱化为一般意义上的走失。
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: 那灭亡之子
  rationale: 保留闪族式“……之子”表达及其神学张力，不在正文中扩展为关于命定的明确解释。
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: 好使经上的话得以应验
  rationale: “好使”保留 ἵνα 的目的或结果色彩；“经上的话”是现代汉语中自然且庄重的 γραφή 译法。
theological_decisions:
- issue: ᾧ δέδωκάς μοι 的所指
  choice: 关系从句修饰“你的名”，译作“你所赐给我的名”
  alternative: 将其理解为门徒，即“你所赐给我的人”
  rationale: SBLGNT 本节采用中性单数关系代词 ᾧ，最自然地与中性单数 ὀνόματι（名）呼应，而不是与阳性复数 αὐτούς（他们）呼应。
- issue: ὁ υἱὸς τῆς ἀπωλείας 的含义
  choice: 那灭亡之子
  alternative: 那注定灭亡的人；沉沦之子
  rationale: 形式对应原文的闪族式结构，既提示此人以灭亡为特征或结局，又不把原文扩展为完整的预定论断。
- issue: εἰ μὴ 所表达的例外关系
  choice: 只有那灭亡之子
  alternative: 除了那灭亡之子以外
  rationale: “只有”在汉语中自然表达例外，同时保留句面上此人属于前述群体的张力，不额外解释其门徒身份或最终命运的机制。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“一直……保守”呈现未完成时的持续性，“护卫”则保留两个希腊动词之间的差异。正文只设置一个确有解释价值的脚注，且标记已在正文出现。
