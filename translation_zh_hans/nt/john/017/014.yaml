  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: zh_hans
  text: 我已经把你的话赐给他们，世界恨恶了他们，因为他们不属于这世界，正如我不属于这世界。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκα
  choice: 已经……赐给
  rationale: 希腊文为完成时，表示已经完成而其结果仍然有效；“已经……赐给”在现代汉语中自然地保留这一意味。
- source_word: λόγον
  choice: 话
  rationale: λόγος在此指父借着耶稣传给门徒的话；译作“话”既符合约翰文体，也避免用“信息”作过度解释。
- source_word: κόσμος
  choice: 世界
  rationale: κόσμος在约翰福音中常指与神敌对的人类秩序；保留宽泛的“世界”，让敌对含义由“恨”及上下文显明。
- source_word: ἐμίσησεν
  choice: 就恨
  rationale: 希腊文为不定过去时；“就”自然呈现赐下话语后随之显出的敌意，而“恨”不额外限定其时态或持续方式。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出世界恨门徒的原因，采用明确的因果连词。
- source_word: ἐκ τοῦ κόσμου
  choice: 从这世界而来
  rationale: ἐκ首先表达来源，也可隐含归属；“从这世界而来”保留原文的来源意象，不把它完全化约为社会归属。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 清楚呈现门徒与耶稣在同世界之关系上的类比。
theological_decisions:
- issue: 门徒与耶稣相对于“世界”的关系
  choice: “他们不是从这世界而来的，正如我不是从这世界而来的一样”
  alternative: “他们不属于这世界，正如我不属于这世界一样”
  rationale: 正文直译ἐκ所表达的来源，同时保留它可能涉及归属的张力；不削弱耶稣与门徒之间的真实类比，也不据此加入原文未明说的形而上解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“赐给”适合父所赐话语的语境；“世界就恨他们”保留约翰福音反复使用的“世界”一词及简洁有力的句式。
