id: JHN.17.9
reference: John 17:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: zh_hans
  text: 我为他们祈求[a]；我不为世界祈求，却为你所赐给我的人祈求，因为他们是你的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他们”也可译作“关于他们”；这里的希腊语介词两种意思都可能表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: 祈求
  rationale: 基本意思是“求、请求”；在本节中，耶稣正向父说话，因此“祈求”自然体现语境，同时保留请求的核心含义。
- source_word: περὶ αὐτῶν
  choice: 为他们
  rationale: περί加属格可表示“关于”，在代求语境中也可表示“为了”。“为他们”符合现代汉语的祈祷表达，并与后文的对比平行。
- source_word: κόσμου
  choice: 世人
  rationale: κόσμος在约翰著作中含义宽广；此处与父赐给耶稣的人形成群体对比，译作“世人”较自然，但不进一步限定其神学范围。
- source_word: ὧν δέδωκάς μοι
  choice: 你所赐给我的人
  rationale: 关系代词在语境中指一群人；“所……的人”准确、自然。δέδωκάς的完成时表达已经赐下且结果仍然有效，汉语由“所赐给”及上下文体现。
- source_word: ὅτι σοί εἰσιν
  choice: 因为他们是你的
  rationale: ὅτι在这里最自然地说明祈求的理由；“他们是你的”简洁保留归属和关系意味。
- source_word: ἐγώ
  choice: 我
  rationale: 保留显式主语，与“不是……而是……”的对比结构相配。
theological_decisions:
- issue: ἐρωτῶ是否采用明确的祷告用语
  choice: 译作“祈求”
  alternative: “求”或“请求”
  rationale: 该动词本身是“求、请求”，但此处直接向父说话，汉语“祈求”准确呈现祷告语境，并不增加请求之外的特殊教义含义。
- issue: “世界”的所指范围
  choice: 正文译作“世人”而不进一步解释
  alternative: “世界”
  rationale: 此处κόσμος与被赐给耶稣的人形成对象上的对比；“世人”在汉语中较清楚地指代人群，同时不把它收窄为某种特定神学体系中的“邪恶世界系统”。
- issue: 耶稣说“不为世人祈求”的范围
  choice: 按本句保留直接对比
  alternative: 补充限定为“此刻不为世人祈求”
  rationale: 原文没有明说时间或绝对范围，正文不添加限定，也不把本节扩大解释为关于耶稣一切祈求对象的普遍断言。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“赐给”比“给”略显庄重，也适合父与子之间的语境。保留“不……而是……”的强烈对比。
