  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: zh_hans
  text: 正如你赐给他统管凡有血肉之人[a]的权柄，使他把永生赐给所有你已经赐给他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全人类”。原文直译为“所有肉身”，是指全体人类的圣经惯用语。
    reason: lexical_alternative
  - marker: b
    text: 直译“你赐给他的那一切”；原文使用中性单数的集合表达，指父赐给子的众人。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 保留与上一节祈求之间的比较和对应关系。
- source_word: ἔδωκας αὐτῷ ἐξουσίαν
  choice: 你赐给他……的权柄
  rationale: ἔδωκας用简单过去意义表达父的赐予；ἐξουσία指受委托的权柄和管辖权，不只是能力。
- source_word: πάσης σαρκός
  choice: 凡有血肉之人
  rationale: 保留σάρξ的具体意象，同时按该圣经惯用语明确指向全体人类，避免被误解为所有动物。
- source_word: ἵνα
  choice: 使
  rationale: 简洁表达目的及预期结果，符合现代汉语句法。
- source_word: πᾶν ὃ
  choice: 所有……的人
  rationale: 原文为中性单数集合表达，在此共同指父赐给子的人；汉语用复数性的个人指称较自然。
- source_word: δέδωκας
  choice: 已经赐给
  rationale: 以“已经”体现完成时所表达的既成事实及其持续关联。
- source_word: δώσῃ αὐτοῖς ζωὴν αἰώνιον
  choice: 把永生赐给……的人
  rationale: 自然表达ἵνα后虚拟语气所指的目的，并保留约翰著作中“永生”的标准用语。
theological_decisions:
- issue: 子的普遍权柄与领受永生者的特定指称
  choice: 分别保留“统管凡有血肉之人”与“所有你已经赐给他的人”
  alternative: 将两个范围合并，或把领受永生者解释为全人类
  rationale: 原文一方面宣告子对全人类的权柄，另一方面以集合表达指称父赐给子、由子赐予永生的人。译文保留这一区分和张力，不加入更宽或更窄的宗派性结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡有血肉之人”保留原文意象，并由脚注说明其惯用含义；句序尽量呈现原文先提出受赐群体、再说明赐予永生的逻辑关系。
