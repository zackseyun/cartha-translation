  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: zh_hans
  text: 而永恒的生命就是：他们认识你这独一的真神，也认识你所差来的耶稣，就是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“耶稣基督”。希腊语“Χριστός”既可作头衔，意为“弥赛亚”，在某些语境中也可用作近似名字的称号“基督”。
    reason: 保留Χριστός作为头衔或名称化称号的真实语义可能性。
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: 而……就是
  rationale: δέ承接上文并引出解释；“而……就是”在现代汉语中自然地保留连接作用，不强化为明显转折。
- source_word: ἡ αἰώνιος ζωὴ
  choice: 永恒的生命
  rationale: 这是约翰著作中的重要表达，既指属来世的生命，也有持久不息的含义；“永恒的生命”准确、庄重且易懂。
- source_word: ἵνα γινώσκωσι
  choice: 他们认识
  rationale: 这里的ἵνα从句说明永恒生命的内容。现在时形式可包含持续、关系性的认识；汉语“认识”能自然表达，不额外加入原文没有的情态词。
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: 你这独一的真神
  rationale: 同位结构表明受话者就是“独一的真神”；“你这……”比“你，独一的真神”更清楚地传达句法关系，同时保留原文的直接称呼。
- source_word: καὶ
  choice: 也认识
  rationale: 希腊文以καὶ并列两个认识的对象。汉语补出第二个“认识”，避免误读“你所差来的”为修饰“真神”，但不改变并列关系。
- source_word: ὃν ἀπέστειλας
  choice: 你所差来的
  rationale: 准确表达关系从句及差遣关系；“所……的”结构在现代书面汉语中自然、庄重。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣弥赛亚
  rationale: Χριστός在此仍可听出受膏者的头衔含义，故译“弥赛亚”；同时其用法也可能接近固定称号，因此在脚注保留传统译法“耶稣基督”。
theological_decisions:
- issue: “独一的真神”与耶稣之间的关系
  choice: 按原文称父为“独一的真神”，并把耶稣表述为父所差来的那一位。
  alternative: 在译文中加入说明，以明确某种后来的三一论或反三一论解释。
  rationale: 原句既区分父与受差来的耶稣，又将认识二者并列为永恒生命的内容。译文不增补教义性解释，以保留经文本身的张力。
- issue: Χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”凸显Χριστός的头衔意义；因“基督”也是传统且可能反映名称化用法的译法，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“永恒的生命”较“永生”更透明地保留原文名词短语；第二个“认识”是为汉语句法清晰而补出。脚注标记置于所涉称号之后。
