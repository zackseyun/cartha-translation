  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: zh_hans
  text: 我在他们里面，你在我里面，使他们得以完全地合而为一[a]，使世人知道是你差了我，并且你爱他们，正如你爱我一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们得以被成全，归于一”，或“使他们得以被带到完成，归于一”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: 我在他们里面，你在我里面
  rationale: 保留约翰福音中“在……里面”的彼此内住语言，不改译为较弱的“在他们中间”。
- source_word: τετελειωμένοι εἰς ἕν
  choice: 完全合而为一
  rationale: τετελειωμένοι 是完成时被动分词，指被带到完满、完成的状态；εἰς ἕν 表达趋向或结果。此译自然表达“达到完全的一”，同时避免把重点单独限定为道德上的无罪完美。脚注保留更贴近形式的译法。
- source_word: γινώσκῃ
  choice: 知道
  rationale: 在 ἵνα 引导的目的从句中，以“使世人知道”自然对应现在时虚拟语气，不额外加入“开始认识”等解释。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: κόσμος 在此作为“知道”的主体，语境所指是世上的人；“世人”在现代汉语中比“世界知道”自然，同时仍保留约翰用语所含的群体性指向。
- source_word: ἀπέστειλας
  choice: 差了
  rationale: “差了我”是简洁、庄重的圣经汉语，准确表达父差遣子的行动，又不扩写为“委任”。
- source_word: ἠγάπησας
  choice: 爱
  rationale: 两次采用同一词“爱”，保留原文 ἠγάπησας 的重复及其比较关系。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 明确保留真实而有分量的比较，不将其弱化为仅仅“类似”或“同一种爱”。
theological_decisions:
- issue: “你爱他们，正如你爱我一样”中比较的力度
  choice: 直接译作“正如你爱我一样”
  alternative: 弱化为“以同一种爱爱他们”或只译“像爱我那样”
  rationale: καθὼς 引出直接比较；译文不限定这比较涉及爱的性质、程度或方式，从而保留原文的神学张力。
- issue: τετελειωμένοι 在合一语境中的含义
  choice: 译作“完全合而为一”，并以脚注提供“被成全为一”的形式对应
  alternative: 译作“在一里成为完美”或解释性地译作“在合一中成熟”
  rationale: 原文强调被带到完成状态并归于一；正文以自然汉语表达这一结果，不把它误读成信徒已经达到绝对无罪，同时也不抹去“完全／成全”的力度。
- issue: 两次 ἵνα 的关系
  choice: 平行保留为两个“使……”目的从句
  alternative: 把第二个改写为结果句“这样世人就会知道”
  rationale: 两个 ἵνα 均可表达目的；平行译法保留原文结构，而不武断判定第二项仅为结果。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。保留“在……里面”的约翰式表达和“差了我”的简洁圣经语体；用“世人”避免不自然的“世界知道”。正文脚注标记 [a] 与脚注完全对应。
