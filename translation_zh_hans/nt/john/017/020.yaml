id: JHN.17.20
reference: John 17:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: zh_hans
  text: 我不只为这些人祈求，也为那些借着他们的话[a]而信我的人祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的话”也可译为“他们所传的信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: 祈求
  rationale: 本词基本义为“请求、求”，在约翰福音第17章耶稣向父说话的语境中，“祈求”自然明确，同时仍保留请求的含义。
- source_word: περὶ τούτων
  choice: 为这些人
  rationale: περί加属格表示所求涉及的对象；现代汉语在祈求语境中用“为这些人”比“关于这些人”更自然。“这些人”保留原文指代，不在正文中明说是门徒。
- source_word: Οὐ ... μόνον, ἀλλὰ καὶ
  choice: 不只……也……
  rationale: 准确体现原文的限定、转折和递进关系，也符合现代汉语表达。
- source_word: τῶν πιστευόντων
  choice: 信……的人
  rationale: 保留现在分词的动词性质，不将其静态化为某个固定群体名称，也不添加原文未明说的将来时标记。
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: 借着他们的话
  rationale: διά表示媒介；“借着”保留这一关系。λόγος直译为“话”，同时可按语境理解为他们所传的信息。
- source_word: εἰς ἐμέ
  choice: 信我
  rationale: πιστεύω εἰς在约翰著作中表达以某人为信靠对象；现代汉语“信我”自然，并保留其个人性对象。
theological_decisions:
- issue: 耶稣祈求所涵盖的范围
  choice: 不加“将来”，使经文可自然涵盖借门徒见证而信的人，包括后来的信徒。
  alternative: 明确译作“将要信我的人”，把重点限定为未来信徒。
  rationale: 希腊文使用现在分词τῶν πιστευόντων，没有明示将来时。上下文容许范围延伸至后来相信的人，但正文不应以补入时态的方式消除其时间上的开放性。
- issue: “这些人”的具体身份
  choice: 保留指示语“这些人”，由上下文确定所指。
  alternative: 直接译作“这些门徒”或“使徒”。
  rationale: 原文只用τούτων，并未在本节重述身份；保留指代可避免加入解释性限定。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“祈求”契合整章祷告语境；句式清晰，并保留原文关于相信者时间范围的开放性。
