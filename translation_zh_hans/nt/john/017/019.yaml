  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: zh_hans
  text: 我也为他们的缘故使自己分别为圣[a]，使他们也在真理中得以分别为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己献上，归为圣用。”本句与后面的“分别为圣”在希腊文中使用同一词根。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“借着真理”，或按上下文理解为“在这真理中”；参17:17。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文，并自然表达本句与前文的连接；在汉语中置于主语之后较为顺畅。
- source_word: ὑπὲρ αὐτῶν
  choice: 为了他们
  rationale: ὑπέρ加属格在此表示为他人的益处或缘故。译作“为了他们”自然明确，同时不额外断定其含有代替之意。
- source_word: ἐγὼ ἁγιάζω ἐμαυτόν
  choice: 我自己分别为圣
  rationale: ἁγιάζω在此主要指耶稣为使命而自我奉献、归为圣用，并非从不洁变为圣洁。“分别为圣”保留了圣别和奉献两层含义；“自己”也传达ἐγώ与反身代词ἐμαυτόν的强调。
- source_word: ἵνα
  choice: 使
  rationale: 引出目的或预期结果；“使”在现代汉语中简洁地保留这一目的关系。
- source_word: καὶ αὐτοὶ
  choice: 他们也
  rationale: 保留καί所表达的包含关系，并以自然汉语呈现αὐτοί的强调。
- source_word: ὦσιν … ἡγιασμένοι
  choice: 得以……分别为圣
  rationale: “得以”配合“分别为圣”，表达ἵνα加虚拟式以及完成时被动分词所指向的受动状态，同时与前一分句的同根动词保持词语呼应。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 按ἐν的常见范围或领域意义翻译，并保留无冠词短语的开放性；此译法也让读者听出与17:17的联系，而不把工具意义定为唯一解释。
theological_decisions:
- issue: 耶稣“使自己成圣”的含义
  choice: 译作“自己分别为圣”，理解为耶稣为门徒的益处而把自己献上、归为圣用。
  alternative: “使自己成为圣洁”
  rationale: 这里的重点是自我奉献和为使命分别出来，而不是暗示耶稣原先在道德上不圣洁。“分别为圣”既符合语境，也与后半句的同根表达相连。
- issue: ἐν ἀληθείᾳ的语义关系
  choice: 译作“在真理中”，保留真理作为成圣范围或领域的理解。
  alternative: “借着真理”或“在这真理中”
  rationale: ἐν可表示范围，也可能带有工具意味；原文ἀληθείᾳ没有冠词，因此正文不把其中一种理解排他化，其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“分别为圣”属于大众基督教语境中较为熟悉的表达，也准确保留原文前后同根词的呼应。句式尽量简洁，并以“得以”体现后半句的受动和目的意味。
