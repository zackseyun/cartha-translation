    issue: “我愿我在哪里，他们也同我在哪里”句法歧义且不够自然。
    rationale: θέλω后的ἵνα从句应清楚表达为“我愿……也同我在我所在的地方”。原句重复“我在哪里”，并使“我愿”与后续内容的支配关系不够清楚。
  - severity: medium
    issue: 正文未明确表达“我的荣耀”（τὴν δόξαν τὴν ἐμήν）。
    rationale: “你所赐给我的荣耀”表达了关系从句，却可能只突出“赐给我”，没有将原文先行的“我的荣耀”明确译出。以“我的荣耀，就是你所赐给我的荣耀”可完整保留两层表达。
  - severity: low
    issue: 脚注中“那一个／那一切”不够准确自然地说明中性单数形式。
    rationale: ὃ可按形式说明为“你所赐给我的（事物）”或“那赐给我的”，不宜将“那一切”当作直译；集合性含义应作为语境结论说明。
