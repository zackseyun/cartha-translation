id: JHN.17.24
reference: John 17:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: zh_hans
  text: 父啊，[a]我愿你所赐给我的人也同我在我所在的地方，使他们看见我的荣耀，就是你所赐给我的荣耀；因为你在创世以前就爱我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文按形式可直译为“你所赐给我的（事物）”；这里的中性单数用作集合性表达。下文的复数形式表明，所指的是父赐给子的那些人，因此正文译作“你所赐给我的人”。
    reason: 说明集合性中性单数ὃ与下文复数指代之间的关系，并保留原文在形式上的中性单数。
lexical_decisions:
- source_word: πάτερ
  choice: 父啊
  rationale: 这是对上帝的直接呼语；“父啊”自然、庄重，也不增添原文没有的“我的”。
- source_word: ὃ δέδωκάς μοι
  choice: 你所赐给我的人
  rationale: ὃ 在形式上是中性单数，可直译为“你所赐给我的”；但下文用复数 κἀκεῖνοι 和 ὦσιν，表明这里集合性地指父赐给子的人。正文明确所指，同时以脚注保留原文形式。
- source_word: δέδωκάς
  choice: 所赐给
  rationale: 中文以“所……的”关系结构自然表达完成并持续有效的赐予关系；“赐”也适合父赐给子的庄重语境。
- source_word: θέλω
  choice: 我愿
  rationale: θέλω 表达意愿、愿望或意志。“我愿”保留较强的意愿，又符合祷告语境，不将其处理成单纯命令或未来时。
- source_word: ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: 我在哪里，他们也同我在哪里
  rationale: 保留“也”的附加意味和“同我”的陪伴关系；中文对称句式清楚自然，也反映原文对地点与同在的双重强调。
- source_word: θεωρῶσιν
  choice: 看见
  rationale: θεωρέω 可指观看、注视或看见；“看见”是现代汉语中清楚自然的表达，同时不排除其较深入的观看意味。
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: 你所赐给我的荣耀
  rationale: 中文将关系从句置于“荣耀”之前，既准确表达这荣耀属于子，也指出它是父所赐的。
- source_word: ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου
  choice: 因为在创世以前，你就爱我了
  rationale: 将 ὅτι 译为原因性的“因为”；“在创世以前”准确表达 πρὸ καταβολῆς κόσμου，“就……了”自然突出这爱先于创造。
theological_decisions:
- issue: “在创世以前”所表达的子与父之爱的先存关系
  choice: 直接保留“因为在创世以前，你就爱我了”
  alternative: 将其弱化为预定中的爱，或作比喻性改写
  rationale: 原文作明确的时间陈述；译文不加以弱化，也不扩展为超出本节的教义解释。
- issue: 耶稣祷告中 θέλω 的语气
  choice: 译作“我愿”
  alternative: “我要”或“我希望”
  rationale: “我愿”既保留真实而有力的意志，也适合向父祷告的语境；“我要”容易显得像命令，“我希望”则可能削弱原词力度。
- issue: 父“赐给”子的荣耀与子的荣耀之间的张力
  choice: 保留“你所赐给我的荣耀”
  alternative: 改写为“我本有的荣耀”或仅作“我的荣耀”
  rationale: 原文同时称其为“我的荣耀”并说父已将其赐给子。译文依照本句保留“赐给”的关系，不以系统性解释消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“父啊”保留呼语色彩；“我在哪里，他们也同我在哪里”使用自然的对称结构。“创世以前”比“世界奠基以前”更符合普通现代读者的表达习惯，同时准确传达创造之前的时间含义。
