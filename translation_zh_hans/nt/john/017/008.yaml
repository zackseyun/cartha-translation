id: JHN.17.8
reference: John 17:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: zh_hans
  text: 因为你赐给我的话，我已经赐给他们了[a]；他们领受了这些话，也确实知道我是从你而来的[b]，并且相信是你差遣了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你赐给我的那些言语，我已经给了他们。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我从你那里出来了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 句首ὅτι承接上文，说明前述判断的理由；“因为”在现代汉语中自然保留其解释性和因果作用。
- source_word: τὰ ῥήματα
  choice: 话
  rationale: ῥῆμα在这里指所说的话、言语。译作“话”既保留复数集合的具体意味，又比单数的“信息”更少解释性；汉语无需机械标出复数。
- source_word: ἃ ἔδωκάς μοι ... δέδωκα αὐτοῖς
  choice: 你赐给我的……我已经赐给他们了
  rationale: 两个“赐给”保留原文的词语呼应；“已经……了”表达δέδωκα所强调的已经完成并具有现存结果的给予，同时与前面的不定过去时ἔδωκάς形成适度区别。
- source_word: ἔλαβον
  choice: 领受了
  rationale: 这里是接受由耶稣传给门徒的启示性话语。“领受”符合现代中文宗教语境，并比物理性的“拿了”准确，也不额外强化为主观认同。
- source_word: ἔγνωσαν ἀληθῶς
  choice: 也确实知道
  rationale: “确实”直接保留ἀληθῶς；“知道”自然表达γινώσκω在此达到认识的含义，而不将其过度解释为仅仅“确信”。
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: 我是从你而来的
  rationale: παρά加属格指出来源，ἐξέρχομαι表示出来或来到。此译自然表达来自父的来源，同时不以系统神学术语预先界定其方式。
- source_word: ἐπίστευσαν ὅτι
  choice: 相信……
  rationale: πιστεύω后接ὅτι从句，指相信一个陈述为真；“相信是你差遣了我”保留命题性结构，不改写为较偏关系性的“信靠”。
- source_word: ἀπέστειλας
  choice: 差遣了
  rationale: ἀποστέλλω在此指父差派耶稣。“差遣”比一般的“送”更能传达带着使命而派出的意味，又没有增添原文未明说的具体职分。
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθον所表达的耶稣与父的关系
  choice: 我是从你而来的
  alternative: 我从你那里出来了
  rationale: 正文保留来源及“来”的方向，符合现代汉语，也让这句话本身的神学分量保持开放；脚注列出更贴近ἐξέρχομαι字面的译法，不用后来的教义术语替原文作进一步界定。
- issue: πιστεύω接ὅτι从句的性质
  choice: 相信是你差遣了我
  alternative: 信靠你差遣了我
  rationale: 原文所信的是“你差遣了我”这一命题，因此用“相信”而不用“信靠”，避免模糊句法关系。
- issue: 父将话赐给耶稣、耶稣再赐给门徒的措辞呼应
  choice: 两处均译为“赐给”
  alternative: 前者译“赐给”，后者译“传给”
  rationale: 重复同一动词可保留原文ἔδωκάς与δέδωκα的刻意呼应，并呈现话语从父经由耶稣临到门徒的关系，而不额外把第二次给予解释成某种特定传播方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赐给”保留上下两次给予的呼应；第二句补出“这些话”，使汉语中的宾语关系清楚，但不增加新内容。分号呈现理由句内部从赐下话语到门徒领受、认识并相信的推进。所有脚注标记均已置于正文对应位置。
