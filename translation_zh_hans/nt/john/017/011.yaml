source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: zh_hans
  text: 我不再在世上了，他们仍在世上；我正往你那里去。圣父啊，求你在你的名中保守他们[a]；这名是你赐给我的[b]，使他们合而为一，正如我们合而为一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凭你的名保守他们”或“借着你的名保护他们”。希腊语短语可表示所在的领域、所凭借的方式或权柄。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本读作“保守你所赐给我的人”。本译文依照 SBLGNT 的正文，把关系代词理解为指“名”，即这名是父赐给子的。
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达从说话者当前立场看某种状态即将终止；现代汉语自然简洁。
- source_word: κόσμος
  choice: 世上
  rationale: 此处指门徒仍置身其中、耶稣将要离开的尘世领域；“世上”符合本句空间语境，同时保留约翰用语的广度。
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: 我正到你那里去
  rationale: 以“正……去”表达现在时在语境中的进行及将来趋向；“到你那里”保留 πρὸς σέ 的指向。
- source_word: πάτερ ἅγιε
  choice: 圣父啊
  rationale: 自然呈现呼格称呼，同时保留“父”的亲密关系和“圣”的分别为圣之义。
- source_word: τήρησον
  choice: 保守
  rationale: 涵盖看守、保护与使其持守的语义，不把含义缩窄为仅仅免受身体伤害。
- source_word: ἐν τῷ ὀνόματί σου
  choice: 在你的名里
  rationale: 保留 ἐν 可能表达的领域、凭借或权柄等多重关系，不在正文中单一化解释。
- source_word: ᾧ δέδωκάς μοι
  choice: 这名是你赐给我的
  rationale: 关系代词 ᾧ 与“名”呼应；用独立分句使现代汉语清楚，并明确保留本版希腊文本中父将“名”赐给子的读法。
- source_word: ἵνα ὦσιν ἓν
  choice: 使他们合而为一
  rationale: “使”表达目的；“合而为一”传达中性单数 ἕν 所指的真实合一，而非把众人说成同一个人。
- source_word: καθὼς ἡμεῖς
  choice: 正如我们一样
  rationale: 保留门徒的合一与父子合一之间有分量的类比，同时不额外界定这种类比的性质。
theological_decisions:
- issue: “在你的名里保守他们”的含义
  choice: 正文直译为“在你的名里保守他们”
  alternative: 凭你的名保守他们／借着你的名保护他们
  rationale: ἐν 可表示所在领域、凭借或权柄；直译保留其关系性和神学张力，脚注提示其他可能。
- issue: “使他们合而为一，正如我们一样”的力度
  choice: 保留“正如我们一样”的直接比较
  alternative: 把比较弱化为仅仅同心合作，或强化为门徒与父子具有同一种本体合一
  rationale: 原文确立真实类比，却未在本节具体说明合一的形态；译文既不削弱，也不导入后来的体系化界定。
- issue: 关系代词 ᾧ 的先行词
  choice: 理解为“名”，译作“这名是你赐给我的”
  alternative: 按另一抄本或句法理解，译为“保守你所赐给我的人”
  rationale: 所给 SBLGNT 正文中的关系代词为中性单数，与中性名词 ὄνομα 相合，因此正文依此翻译，并在脚注交代异文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“圣父啊”保留祷告呼语；“在你的名里”虽比日常表达稍具经文色彩，但有意保存原文的语义开放性；分号使“这名是你赐给我的”清楚回指“你的名”。
