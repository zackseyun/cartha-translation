source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: zh_hans
  text: 耶稣说了这些话，就举目望天，说：“父啊，时候到了。愿你荣耀你的儿子，使儿子荣耀你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: 说完这些话
  rationale: Ταῦτα回指前面的讲论；汉语用“说完这些话”自然表达耶稣在此前话语结束后转入祷告。完结意味来自叙事语境，而非把简单过去时机械处理为完成体。
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανόν
  choice: 举目望天
  rationale: 保留抬眼朝向天的身体动作，同时采用现代汉语中简洁、庄重而自然的表达。
- source_word: Πάτερ
  choice: 父啊
  rationale: 原文是单纯的呼格“父”，不增添“我的”；“啊”自然标示直接呼唤。
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: 时候到了
  rationale: 保留约翰福音中“时候”的主题性用语；“到了”自然传达完成时所强调的决定性到来。
- source_word: δόξασόν
  choice: 愿你荣耀
  rationale: δοξάζω在本书兼有彰显荣耀与使受尊荣的丰富含义，“荣耀”能维持其约翰式神学关联；以“愿你”表达祷告中的祈求语气。
- source_word: σου τὸν υἱόν
  choice: 你的儿子
  rationale: 忠实表达属格代词所示的父子关系；中文无需依靠大写标示称号。
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: 使儿子也荣耀你
  rationale: “使”清楚表达ἵνα的目的或结果关系；“也”在汉语中自然呈现父与子彼此荣耀的对应结构，而不作额外神学解释。
theological_decisions:
- issue: 父与子彼此荣耀的表达
  choice: 愿你荣耀你的儿子，使儿子也荣耀你
  alternative: 求你使你的儿子得荣耀，好让你的儿子也使你得荣耀
  rationale: 采用同一动词“荣耀”保持原文δόξασον／δοξάσῃ的对称与神学张力，不把“荣耀”的方式解释为单纯尊崇、显明或受难。
- issue: ὁ υἱός的称谓处理
  choice: 儿子
  alternative: 圣子
  rationale: 中文没有大小写区别；“圣子”会引入原文未明说的后期术语，因此直接译作“儿子”，由“你的儿子”及上下文明确其独特称谓。
- issue: ἵνα从句的语义关系
  choice: 使儿子也荣耀你
  alternative: 好让儿子荣耀你
  rationale: 保留目的与结果之间可兼容的关系，不把从句限定为纯粹结果或纯粹意图。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的标准普通话。“举目望天”“父啊”“时候到了”兼顾自然度与约翰叙事的肃穆语气；不使用宗派化术语，也不添加原文没有的解释。
