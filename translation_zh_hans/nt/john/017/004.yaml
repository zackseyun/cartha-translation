  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: zh_hans
  text: 我在地上借着完成你所赐给我去做的工作，荣耀了你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：我在地上荣耀了你，完成了你所赐给我去做的工作。
    reason: 希腊语分词 τελειώσας 也可较形式对应地译作伴随情形，而不明确加上“借着”。
lexical_decisions:
- source_word: ἐδόξασα
  choice: 荣耀了
  rationale: “荣耀”保留约翰著作中 δοξάζω 所具有的厚重神学含义，不弱化为一般的“尊敬”或“尊崇”。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 直接表达 ἐπί 加属格的空间意义，现代汉语自然清楚。
- source_word: τελειώσας
  choice: 是借着完成
  rationale: 将不定过去时分词理解为方式，说明耶稣如何荣耀父；“借着完成”既呈现句法联系，也避免译成两个彼此割裂的陈述。
- source_word: τὸ ἔργον
  choice: 工作
  rationale: “工作”直接对应 ἔργον，也符合《约翰福音》中耶稣谈论父所交付使命的语境。
- source_word: δέδωκάς μοι
  choice: 你所赐给我
  rationale: “赐给”体现给予者与受领者的关系，并以定语结构自然承接“工作”；上下文仍保留希腊语完成时所表达的既成且持续相关的交付。
- source_word: ἵνα ποιήσω
  choice: 去做
  rationale: 在“赐给我”之后，“去做”以自然汉语表达 ἵνα 加虚拟语气所表示的目的或意图。
- source_word: ἐγώ σε
  choice: 我……你
  rationale: 保留第一、第二人称关系；汉语无需添加“我亲自”，以免过度强化原文虽显明但未必需要明说的主语强调。
theological_decisions:
- issue: τελειώσας 与“我荣耀了你”的关系
  choice: 译为方式：“是借着完成……”
  alternative: 译作伴随或先时动作：“我在地上荣耀了你，完成了……”或“我完成了……以后，在地上荣耀了你。”
  rationale: 该分词最自然地说明耶稣荣耀父的方式，即完成父所交付的工作；脚注保留将其理解为伴随情形的可能，不把句法关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荣耀”保留约翰文本的核心用语；句式以“是借着”明确主要句法理解，同时用脚注保存原文分词关系的歧义。
