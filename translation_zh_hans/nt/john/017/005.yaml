review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了耶稣在世界存在以前与父相关的荣耀，且没有淡化先存含义。不过，“我与你同在时所拥有的荣耀”将原文关系从句处理为一个时间性“……时”，不如直接表达“与父同有”的荣耀贴合；“在你身边”也略偏具体空间位置，原文更宽泛地指在父面前／在父那里。
  naturalness: 原句通顺，祷告语体也合宜；但“世界存在以前，我与你同在时所拥有的荣耀”层次稍显拖沓。改为“我在世界存在以前与你同有的荣耀”更简洁自然。
  terminology: “父啊”“荣耀”“世界”均符合约翰福音及现代标准汉语的庄重语体。“得享荣耀”可保留，既自然又能表达求父使子得荣耀。
  issues:
  - severity: medium
    issue: “我与你同在时所拥有的荣耀”把 παρὰ σοί 的关系性／临在性表达成时间从句。
    rationale: 希腊文的 πρὸ τοῦ τὸν κόσμον εἶναι 修饰“拥有荣耀”的先时背景，而 παρὰ σοί 表示“在你那里／与你”，不是另设一个“同在时”的时间段。译为“与你同有的荣耀”可更清楚保留原句关系。
  - severity: low
    issue: “在你身边”略过于具体化。
    rationale: παρὰ σεαυτῷ 可指在父面前、在父那里或与父同在；“在你面前”在汉语祷告语境中自然，并避免把该表达限缩为物理位置。
  revised_text: 父啊，现在求你使我在你面前[a]得享荣耀，就是我在世界存在[b]以前与你同有的荣耀。
  revised_footnotes:
