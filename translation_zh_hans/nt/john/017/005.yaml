  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: zh_hans
  text: 父啊，现在求你使我在你面前[a]得享荣耀，就是我在世界存在[b]以前与你同有的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你那里”或“与你同在”。原文用语可表示在父面前、在父那里或与父同在。
    reason: lexical_alternative
  - marker: b
    text: 或译“世界尚未有”或“世界形成以前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: 使我……得享荣耀
  rationale: 保留约翰福音中“荣耀”的核心用语，并以自然汉语表达使役含义；不弱化为仅仅“尊荣我”。
- source_word: παρὰ σεαυτῷ
  choice: 在你身边
  rationale: παρά加与格可表达临近或同在；“在你身边”既保留空间、关系意味，也比生硬的“在你自己那里”更符合现代汉语。
- source_word: τῇ δόξῃ
  choice: 得享荣耀，就是……所拥有的荣耀
  rationale: 用解释同位结构自然承接所指定的荣耀，表达耶稣所求的得荣耀与后面关系从句所述荣耀相同。
- source_word: ᾗ εἶχον
  choice: 我……所拥有的荣耀
  rationale: 如实表达未完成过去时所指向的先前拥有，不额外界定这种拥有的性质。
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: 世界存在以前
  rationale: 准确表达带冠词不定式结构的先时关系，也保留 εἶναι 的存在含义。
- source_word: παρὰ σοί
  choice: 我与你同在时
  rationale: 表达 παρά加与格所含的临近、同在关系；与前面的“在你身边”形成自然呼应，而不强求汉语机械重复。
- source_word: σύ, πάτερ
  choice: 父啊……求你
  rationale: 呼语“父啊”配合“求你”，自然呈现祷告语气，并在汉语中体现显式代词 σύ 所加强的对象指向。
- source_word: κόσμον
  choice: 世界
  rationale: 这是约翰福音中 κόσμος 的标准且合乎语境的译法，不擅自扩展为“宇宙”或“受造界”。
theological_decisions:
- issue: 本节所暗示的子的先存
  choice: 直译为耶稣在世界存在以前已与父同在并拥有荣耀。
  alternative: 将其弱化为世界被计划以前预定给耶稣的荣耀。
  rationale: 希腊文直接陈述耶稣在世界存在以前“拥有”在父那里／与父同在的荣耀；译文既不淡化，也不作超出本句的教义扩写。
- issue: 耶稣与父同在时所拥有之“荣耀”的性质
  choice: 保留“荣耀”，不加解释性限定。
  alternative: 译作“威荣”或“尊荣”。
  rationale: 本句宣称这荣耀的先存与共享关系，却没有在此进一步界定其性质；保留约翰式“荣耀”用语，可维持经文本身的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“父啊”符合祷告语境；“得享荣耀”避免逐词硬译造成拗口，同时保留“荣耀”的神学关键词。两个脚注标记均放在其实际所说明的短语之后。
