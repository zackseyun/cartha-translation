- from: 父啊，现在求你使我在你身边[a]得享荣耀，就是世界存在[b]以前，我与你同在时所拥有的荣耀。
  to: 父啊，现在求你使我在你面前[a]得享荣耀，就是我在世界存在[b]以前与你同有的荣耀。
  rationale: 修订保留“荣耀”和世界以前的先存陈述，不作额外教义阐释；同时将末句改为“与你同有的荣耀”，避免把原文的临在／关系表达误作时间从句，并使全句更符合现代汉语。脚注锚点仍分别紧随所说明的短语。
