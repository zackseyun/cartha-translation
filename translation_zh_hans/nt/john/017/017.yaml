  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: zh_hans
  text: 求你使他们在真理中成圣[a]；你的道就是真理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你借着真理使他们成圣。”后一句也可理解为：“你的道就是那真理。”希腊文的表语“真理”没有冠词，可能侧重性质，即神的道本质上是真理，而不只是作简单的同一认定。
    reason: 保留ἐν的领域／工具歧义，以及无冠词表语ἀλήθεια的性质性／定义性理解。
lexical_decisions:
- source_word: ἁγίασον
  choice: 使……成圣
  rationale: 这是ἁγιάζω的不定过去时主动命令式。在祷告语境中译作“求你使……成圣”，既保留分别归给神的含义，也保留圣洁层面的分量；比单译“分别出来”更完整。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 宾格复数代词，指前文中的门徒；现代汉语直接译作“他们”。
- source_word: ἐν τῇ ἀληθείᾳ
  choice: 在真理中
  rationale: 保留ἐν加与格可能具有的领域性与工具性，不收窄为单纯的“借着真理”；定冠词表明这里所说的真理具有特指性。
- source_word: ὁ λόγος ὁ σὸς
  choice: 你的道
  rationale: λόγος在此指神所传达的话语；“道”在约翰著作的汉语表达中庄重而自然。ὁ σὸς表示归属于“你”，合译为“你的道”。
- source_word: ἀλήθειά ἐστιν
  choice: 就是真理
  rationale: ἀλήθεια作无冠词的表语名词，重点可在性质上；“就是真理”保留名词性断言及汉语的自然力度，不弱化成“是真实的”。脚注说明也可理解为定义性的“就是那真理”。
theological_decisions:
- issue: 第二分句中的ἀλήθεια应侧重性质还是定义
  choice: 你的道就是真理
  alternative: 你的道就是那真理
  rationale: 原文表语ἀλήθεια没有冠词，可能强调神之道具有真理的本质，而不是以语法形式明确作单纯的同一认定。正文采用自然且有分量的“就是真理”，脚注保留定义性理解，以免消除原文的张力。
- issue: ἐν τῇ ἀληθείᾳ表达领域还是工具
  choice: 在真理中
  alternative: 借着真理
  rationale: ἐν加与格可表达所处领域，也可带工具意味。译作“在真理中”保留这种宽度，不把成圣的方式限定为工具意义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”使希腊文命令式在向父祷告的汉语语境中自然得体；“成圣”和“道”保留约翰福音的神学分量，同时避免加入宗派性解释。
