  naturalness: “求你使他们在真理中成圣；你的道就是真理”是自然、庄重且可理解的现代汉语祷告体。“成圣”“道”在经文语域中稳定而恰当；“在真理中”虽较贴近原文结构，仍不生硬，并有助于避免将ἐν预先限定为纯工具意义。
