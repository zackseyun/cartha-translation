id: JHN.8.13
reference: John 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: zh_hans
  text: 于是，法利赛人对他说：“你为自己作见证；你的见证不真实。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的见证不成立。”原文直译为“不真实”，在这里也可能含有法律上无效的意思。
    reason: 说明 ἀληθής 在本语境中既可指真实性，也可能涉及法律效力。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并引出法利赛人因耶稣所言而作出的回应，兼顾叙事推进和推论关系。
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: 法利赛人对他说
  rationale: 按现代汉语语序自然表达，同时保留原文的代词“他”，不直接补明为“耶稣”。
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: 你为自己作见证
  rationale: “你”置于句首保留显著强调；“为自己作见证”自然传达 περὶ σεαυτοῦ，并保留本段见证语汇的司法色彩。
- source_word: ἡ μαρτυρία σου
  choice: 你的见证
  rationale: 与前句“作见证”保持词汇呼应，并保留证言、证明等语境含义。
- source_word: οὐκ ἔστιν ἀληθής
  choice: 不真实
  rationale: 直接对应 ἀληθής 的真假含义，又不把法利赛人的异议限定为纯粹的法律效力问题。
theological_decisions:
- issue: 法利赛人反对自我见证的确切含义
  choice: 你的见证不真实
  alternative: 你的见证不成立
  rationale: 上下文带有司法论辩色彩，但 ἀληθής 本身比严格的法律术语更宽。“不真实”保留对真实性的直接质疑，脚注则提示也可能涉及见证是否有效或成立。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作见证”保留约翰福音反复出现的关键词及其法庭语感；句式简洁，适合普通现代读者。
