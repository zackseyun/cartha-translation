  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: zh_hans
  text: 你们将认识真理[a]，真理将使你们得自由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们将会明白真理。”
    reason: lexical_alternative
  - marker: b
    text: 本节的措辞本身没有具体说明是哪一种自由；上下文则将其与脱离罪的辖制联系起来。
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: 将认识
  rationale: 这是 γινώσκω 的将来时形式。“将认识”直接保留将来意义，现代汉语自然通顺，也不把可能的起始性意味过度明确化。
- source_word: ἀλήθειαν / ἀλήθεια
  choice: 真理
  rationale: 希腊文两处都有定冠词，并以同一名词形成强调性的重复。汉语通常不另译定冠词；两处均译“真理”，既自然，也保留其特指性与修辞呼应。
- source_word: ἐλευθερώσει
  choice: 将使……得自由
  rationale: 保留动词的使动含义。“使……得自由”庄重、清楚，又不在正文中擅自说明是从什么辖制下获得自由。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确译出第二人称复数。
- source_word: καὶ ... καὶ
  choice: 并且……，……
  rationale: 句首用“并且”承接上文；第二个 καί 通过并列分句及重复主语自然体现，避免生硬堆叠连接词，同时保留从认识真理到得自由的推进。
theological_decisions:
- issue: “真理将使你们得自由”中自由的性质
  choice: 正文不限定这种自由的具体性质
  alternative: 译作“真理将使你们脱离罪，得着自由”或“使你们在灵性上自由”
  rationale: 本节本身没有明说从什么之下得自由；后文将其与罪的辖制联系起来。正文保留原句的简洁和开放性，由上下文进一步说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并且”保留本节与上文的连接；“得自由”保持经文的凝练，不添加政治、心理或灵性等限定。
