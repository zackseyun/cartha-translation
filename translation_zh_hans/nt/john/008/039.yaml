base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: zh_hans
  text: 他们回答他：“亚伯拉罕是我们的父亲。”耶稣对他们说：“如果你们是亚伯拉罕的儿女，你们就会做亚伯拉罕所做的事。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果你们是亚伯拉罕的儿女，你们就做亚伯拉罕所做的事。”希腊文后件的未完成过去时可按带有反事实含意的条件句理解；由于前件使用现在时，亦可理解为一般条件。
    reason: 说明条件句时态组合所带来的译法歧义，并提供不预断其逻辑强度的替代译文。
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 他们回答他说
  rationale: 保留约翰叙事中“回答”与“说”的双动词表达，同时采用自然、庄重的现代汉语句式。
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: 我们的父是亚伯拉罕
  rationale: 贴近原文语序和强调，清楚表达他们以亚伯拉罕为祖先和父的身份主张。
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 希腊文使用叙事性现在时；汉语叙事无需用时态形态标示，译作普通的“说”自然且不损失话语的直接性。
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: 亚伯拉罕的儿女
  rationale: τέκνα是涵盖男女的亲属称谓；“儿女”既保留父子关系意象，也避免仅指男性。
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: 亚伯拉罕所做的事
  rationale: 在现代汉语中比“亚伯拉罕的工作”更准确自然，表达与其行为相称的具体作为。
- source_word: ἐποιεῖτε
  choice: 就该做
  rationale: 该形式为未完成过去时，在此条件句中可表达与事实相反或未实现的结果；“就该做”自然呈现其行为本应与所声称的身份相符，同时避免过度补入持续体。
theological_decisions:
- issue: 耶稣所说“亚伯拉罕的儿女”属于何种意义
  choice: 保留亲属身份主张与行为不相称之间的张力
  alternative: 明确解释为否认肉身血统，或只指属灵儿女
  rationale: 本节以“儿女”与“亚伯拉罕所做的事”相对照，却没有在本句内完整界定肉身与属灵身份；译文不替经文预先作体系化解释。
- issue: 条件句是否表达反事实
  choice: 正文用“如果……就该……”表达未实现的应然结果，并以脚注说明另一种可能理解
  alternative: 直译为“如果……就做……”或明确译成“如果你们真是……就会……”
  rationale: ἐποιεῖτε的未完成过去时支持反事实理解，但前件ἐστε为现在时，句法具有张力；正文保持自然且不把逻辑强化为绝对否认。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“儿女”保留亲属关系意象并涵盖男女；“所做的事”比生硬的“行为”或易生歧义的“工作”更适合普通读者。脚注标记置于相关条件句末。
