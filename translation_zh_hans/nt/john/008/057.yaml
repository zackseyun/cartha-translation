  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: zh_hans
  text: 于是，犹太人[a]对他说：“你还不到五十岁，竟见过亚伯拉罕吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”，也可按语境理解为“犹太人的领袖”；这里原文所指的范围并未明说。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 这是对希腊语的一般性直接译法；本节并未明说所指仅限于领袖。鉴于《约翰福音》中该称谓可能随语境有不同范围，另以脚注保留其他可能。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文，表示由耶稣先前的话引出的回应；“于是”符合现代汉语叙事习惯。
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: 你还不到五十岁
  rationale: 希腊语直译为“你还没有五十年”，实际是表达年龄；按自然汉语译为“还不到五十岁”。
- source_word: καὶ
  choice: 竟
  rationale: 连接两个形成强烈反差的分句；在这一疑问句中，“竟”自然传达说话者难以置信的语气，而不改变命题内容。
- source_word: ἑώρακας
  choice: 见过
  rationale: 该词为完成时，表示曾经看见并以此作为当前主张的依据；汉语经验体“见过”自然保留这一意味。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 《约翰福音》中 οἱ Ἰουδαῖοι 的所指范围
  choice: 犹太人
  alternative: 犹太地人；犹太人的领袖
  rationale: 原文使用宽泛称谓，未在本节明确限定为领袖。正文保留直接译法，脚注说明可能的语境性理解，避免在正文中提前缩小所指，也不把该群体泛化为所有时代或所有地方的犹太人。
- issue: 说话者对“见过亚伯拉罕”的质疑语气
  choice: 竟见过亚伯拉罕吗
  alternative: 并且你见过亚伯拉罕吗
  rationale: καί 本身是连接词，但此处两个分句构成反差鲜明的反问。“竟”在现代汉语中自然呈现其难以置信的语用效果，而不替说话者回答问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还不到五十岁”处理年龄习语，“竟见过……吗”呈现原句的惊讶和质疑。脚注标记紧随存在词义范围问题的称谓。
