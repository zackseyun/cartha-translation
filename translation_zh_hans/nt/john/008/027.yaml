base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: zh_hans
  text: 他们不明白他是在对他们谈及父[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不知道他是在对他们谈及父。”
    reason: 保留οὐκ ἔγνωσαν较为直译的词义选择。
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: 他们不明白
  rationale: γινώσκω常有“知道”之意，但此处指听众没有领会耶稣所指的是谁；“不明白”在现代汉语中自然地表达这种认知上的未能领会。
- source_word: ὅτι
  choice: （以逗号引出所未明白的内容）
  rationale: ὅτι引出他们未能明白的内容。汉语无需机械译出“即/就是”，用逗号连接更自然，也完整保留内容从句的关系。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 约翰福音的上下文表明，此处特指耶稣所说的父，即上帝；“父”保留了原文的关系性称谓，不额外加入“上帝”来消除原文表达方式。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: λέγω所带的与格对象在汉语中自然译为“对他们”。
- source_word: ἔλεγεν
  choice: 是在……讲论
  rationale: 未完成时呈现正在持续的言说；“是在……讲论”既体现进行中的动作，也适合“讲论某人/某事”的现代汉语搭配。
theological_decisions:
- issue: “父”的所指
  choice: 按上下文理解为耶稣所说的上帝、他的父，并译作“父”
  alternative: 理解为某位人间的父亲，或在正文中明说“父上帝”
  rationale: 约翰福音紧邻上下文反复以“父”指耶稣的父。正文保留“父”这一原文称谓，既反映其神圣所指，也不把解释性成分直接加入经文。
- issue: γινώσκω在本句中的语义
  choice: 译为“不明白”
  alternative: 译为“不知道”或“没有认出”
  rationale: 本句重点是听众未能领会耶稣话语中的所指。“不明白”最符合语境；脚注保留较贴近该词常见义的“不知道”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“讲论父”略带经文语体，但比“谈论父”更庄重，也能与λέγω περὶ所表达的“说到、讲到”相合。正文中的[a]与脚注完全对应。
