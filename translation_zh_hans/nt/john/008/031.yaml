source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: zh_hans
  text: 耶稣于是对那些已经信他的犹太人[a]说：“你们若持守我的话，就真是我的门徒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些已经信靠他的犹太人。”希腊语原文作“那些已经信他的犹太人”，其中“他”是与格，未使用“进入/归入”（εἰς）一类的介词结构。
    reason: 保留πιστεύω后接与格αὐτῷ的句法特点，并提供符合汉语表达习惯的替代译法；不把原文未明说的介词结构加入正文。
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 说
  rationale: 希腊语未完成时在此引出耶稣当时所说的话；汉语用“说”最自然，不勉强加入可能暗示反复的“一直说”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，保留推衍或延续关系，又不过度强化为严格的逻辑结论。
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: 对那些已经信了他的犹太人
  rationale: “已经信了”体现完成时分词所表达的先前行动及其延续状态；“信了他”直接对应带与格的αὐτῷ，不在正文中擅自扩展为“信靠他”或“信入他”。
- source_word: Ἐὰν ὑμεῖς
  choice: 你们若
  rationale: “若”自然表达条件；保留明确出现的“你们”，也传达原文主语代词的强调。
- source_word: μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: 持守我的话
  rationale: “持守”以自然现代汉语表达持续留在、坚守耶稣之话的含义；“我的话”保留λόγος在约翰著作中的用语和内涵，不窄化为“教导”。
- source_word: ἀληθῶς μαθηταί μού ἐστε
  choice: 就真是我的门徒了
  rationale: “真是”表达ἀληθῶς所强调的真实身份；“门徒”符合福音书语境，“了”使条件成立后的判断在汉语中自然清楚。
theological_decisions:
- issue: πιστεύω与与格αὐτῷ的译法
  choice: 已经信了他的
  alternative: 已经信靠他的
  rationale: 原文使用与格代词，并未使用约翰福音中常见的εἰς结构。正文采用较直接且仍可理解的“信了他”，避免把较完整的“信靠”含义无声加入；脚注保留另一种在汉语中更常见的理解。
- issue: μένω ἐν τῷ λόγῳ的表达
  choice: 持守我的话
  alternative: 常在我的话里
  rationale: 直译“常在我的话里”能显出空间性比喻，但现代汉语较生硬；“持守”保留持续、坚守的核心意义，同时不把λόγος解释性地缩减为某套教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留“我的话”“门徒”等约翰福音的重要用语；避免使用生硬的逐词直译，也不把信心的性质作超出原文句法的神学限定。
