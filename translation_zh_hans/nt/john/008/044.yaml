  to: 你们是出于你们的父——魔鬼；你们想要行你们父亲所欲的事。他从起初就是杀人者，在真理中未曾站立，因为他里面没有真理。每当他说虚谎时[a]，他所说的是出于他自己的[b]，因为他是说谎者，也是谎言之父。[c]
  rationale: 修订仅处理汉语搭配、句法完整性和词语自然度，同时保留原文的比喻力度、完成状态的开放性，以及“谎言之父”所含的单数源头意象。脚注锚点均保留并对应相关短语。
