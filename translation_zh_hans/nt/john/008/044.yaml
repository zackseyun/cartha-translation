id: JHN.8.44
reference: John 8:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: zh_hans
  text: 你们是出于你们的父——魔鬼；你们想要行你们父亲所欲的事。他从起初就是杀人者，在真理中未曾站立，因为他里面没有真理。每当他说虚谎时[a]，他所说的是出于他自己的[b]，因为他是说谎者，也是谎言之父。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“每当他说谎时”或“每当他说虚假之言时”。原文较直译为“每当他说那谎言时”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他所说的是出于他自己的”，即出于属于他自身的事物或他的性情。
    reason: lexical_alternative
  - marker: c
    text: 原文也可较直译为“也是它的父”。这里的“它”通常理解为前面的“谎言”；有人概括译作“也是一切谎言之父”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: 出于你们的父——魔鬼
  rationale: ἐκ与εἰμί表达来源或归属；“出于”保留这一力度，破折号清楚表明“魔鬼”是“父”的同位说明。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: 该词泛指强烈愿望，并不限于性欲；“欲望”在现代汉语中自然且保留其负面语境。
- source_word: θέλετε ποιεῖν
  choice: 想要实行
  rationale: 既表达主动意愿，也保留ποιεῖν所指向的实际行事。
- source_word: ἀνθρωποκτόνος
  choice: 杀人的
  rationale: 原词指杀害人的一方；此处用“杀人的”作表语，比名词“凶手”更贴合原句结构，也自然易懂。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 直接保留约翰著作中富有回响的时间表达。
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: 没有站在真理中
  rationale: 保留“站立”的意象以及完成时所呈现的状态，同时不译作“没有持守/停留”，以免断言他先前曾在真理中。
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: 每当他说谎言时
  rationale: “说谎言”保留原文定冠词化单数τὸ ψεῦδος的实体性，比单纯“说谎”更接近原文；顺畅译法置于脚注。
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: 他说的是出于他自己
  rationale: 尽量保留“出于属于他自己的东西”这一简约而含蓄的原文措辞，不在正文中直接补入“本性”。
- source_word: ψεύστης
  choice: 说谎者
  rationale: 直接、自然地表达其持续性的身份特征。
- source_word: ὁ πατὴρ αὐτοῦ
  choice: 谎言之父
  rationale: 按最近且最连贯的先行词τὸ ψεῦδος理解αὐτοῦ；中文若直译“它的父”十分生硬，“谎言之父”清楚表达来源意象而不改成复数。
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ中代词的所指
  choice: 理解为魔鬼是“谎言之父”
  alternative: 理解为“他的父”，或概括译作“众谎言之父”
  rationale: 最近的合理先行词是τὸ ψεῦδος；这样既符合上下文，也避免引入魔鬼另有一位父的推测。“谎言”保持原文单数。
- issue: 是否暗示魔鬼曾经站在真理中而后堕落
  choice: 译作“没有站在真理中”
  alternative: 译作“没有持守真理”或“没有留在真理中”
  rationale: 后两种译法会更强地暗示他先前曾处于真理中；原文在此并未明确解决这一神学问题，因此保留“站”的意象与含混性。
- issue: “出于你们的父——魔鬼”的性质
  choice: 按来源或归属来表达，不扩写为生物学意义上的父子关系
  alternative: 释义为“你们在属灵上以魔鬼为父”
  rationale: 正文保持耶稣话语的尖锐比喻，不加入解释性神学限定。
translation_notes:
  register: 采用现代、庄重且口语可理解的普通话。“出于”“从起初”“站在真理中”保留约翰文本的重要意象；“父——魔鬼”以破折号明确同位关系。所有脚注标记均置于相关正文之后。
