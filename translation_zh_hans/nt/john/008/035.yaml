  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The slave does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: zh_hans
  text: 奴隶[a]不能永远留在家中；儿子[b]却永远留在家中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”；希腊语 doulos 可指仆人或奴隶，但这里与儿子的身份形成对照，译作“奴隶”更能体现其从属地位。
    reason: lexical_alternative
  - marker: b
    text: “儿子”在这里也可能含蓄地指向耶稣，不过本句的措辞本身也具有格言性质。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 此处强调他在家中的从属身份，并与“儿子”的长久地位形成对照；“奴隶”比“仆人”更准确地保留这种身份差异。
- source_word: μένει
  choice: 留在
  rationale: 两处均译为“留在”，保留原文的重复，并自然表达在家中持续拥有位置或地位。
- source_word: οἰκία
  choice: 家中
  rationale: 这里不只是指一座房屋，更涉及人在一个家里的归属与地位；“家中”兼顾空间和家庭关系两层含义。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 以现代汉语惯用表达传达持续不变、没有终止的意思，两处保持一致。
- source_word: υἱός
  choice: 儿子
  rationale: 原文为阳性单数，且与奴隶在家中的身份形成直接对照；“儿子”也保留上下文中可能指向耶稣的意味。
- source_word: δὲ
  choice: 却
  rationale: 将其放在第二分句中自然呈现奴隶与儿子的对比，不另加原文没有的时间副词。
theological_decisions:
- issue: “儿子”在上下文中可能具有的基督论意味
  choice: 译作普通名词“儿子”，不加专名号或其他显明为称号的处理
  alternative: 译作带有明确基督论称号意味的“子”或“圣子”
  rationale: 本节措辞既像关于家庭身份的格言，又在下一节为耶稣的应用铺路。保留普通名词形式，可避免提前消除这种有意的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奴隶—儿子”“留在—留在”“永远—永远”的平行结构保留原文鲜明对照；第二分句补出“家中”，使汉语表达完整清楚，同时不改变原意。
