source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: zh_hans
  text: 犹太人对他说：“现在我们知道你被鬼附了[a]。亚伯拉罕死了，众先知也死了；你却说：‘若有人遵守我的话，就必永远不会尝到死亡[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“你有鬼”；也可译作“你被鬼附了”。
    reason: 说明希腊语δαιμόνιον ἔχεις的字面表达及其自然的现代汉语译法。
  - marker: b
    text: “就必永远不会尝到死亡”在原文中是强烈的否定，意思是绝不会尝到死亡；“永远”说明这种否定不受时间限制，并非指死亡持续的时间。
    reason: 说明οὐ μή与εἰς τὸν αἰῶνα的强调，并保留“尝到死亡”所含死亡性质的叙事张力。
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接保留原文对这一群体的称呼；译作“犹太领袖”会加入原文未明说的身份限定。
- source_word: Νῦν ἐγνώκαμεν
  choice: 现在我们知道
  rationale: 自然表达完成时所指的现今认定状态。
- source_word: δαιμόνιον ἔχεις
  choice: 你有鬼附着
  rationale: 既贴近“有鬼”的字面结构，也以现代汉语清楚表达其指控；不进一步界定附身状态。
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: 亚伯拉罕死了，众先知也死了
  rationale: 补出第二个“死了”，使汉语完整自然，并显明καί的并列递进作用。
- source_word: καὶ σὺ λέγεις
  choice: 你却说
  rationale: 上下文构成明显反差，因此将καί按语境译为转折。
- source_word: τὸν λόγον μου τηρήσῃ
  choice: 遵守我的话
  rationale: “遵守”体现τηρέω在此处守持、践行的含义；“我的话”保留λόγος的约翰用语。
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: 就必永远不尝死味
  rationale: “必……不”传达οὐ μή的强烈否定，“永远”对应εἰς τὸν αἰῶνα，“尝死味”保留原文隐喻且符合庄重的汉语圣经表达。
theological_decisions:
- issue: “尝死味”所指的死亡性质
  choice: 保留“尝死味”，不在正文中限定其所指
  alternative: 明确译成肉身死亡、属灵死亡或永远的死亡
  rationale: 上下文中的反对者按肉身死亡理解，但约翰叙事容许更深层含义；直译可保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有鬼附着”避免单用“有鬼”可能产生的现代口语歧义；引语层次清楚，保留原文关于死亡含义的神学张力。
