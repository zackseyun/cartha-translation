source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: zh_hans
  text: 那差我来的与我同在；他没有撇下我，让我独自一人，因为我总是做他所喜悦的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: 那差我来的
  rationale: 带冠词的不定过去时分词作名词用，指差遣耶稣的那一位。译作“那差我来的”保留原文的关系性称谓，不在正文中直接增补“父”。
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: 与我同在
  rationale: μετά加属格表示陪伴、同在；“与我同在”自然庄重，也表达持续的临在。
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: 他没有撇下我，让我独自一人
  rationale: ἀφίημι在此有留下、撇下之意，μόνον与宾格“我”构成补足关系。“没有撇下我，让我独自一人”清楚传达他并未使耶稣处于孤单无伴的状态。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出前述陈述的理由，采用现代汉语中明确自然的因果连词“因为”。
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: 他所喜悦的事
  rationale: 中性复数形容词名词化，直指“令他喜悦的事”；此译保留评价色彩，同时符合现代汉语习惯。
- source_word: ποιῶ πάντοτε
  choice: 我始终做
  rationale: 现在时可表达一贯的行动，πάντοτε表示在一切时候；“始终做”简洁地传达持续和恒常。
theological_decisions:
- issue: “那差我来的”所指为何
  choice: 保留关系性表达“那差我来的”
  alternative: 明确译为“差我来的父”
  rationale: 约翰福音语境表明所指是父，但希腊文此处没有直接使用“父”一词；保留原文表达可避免解释性增补，并保持约翰的措辞。
- issue: ἀφῆκεν的时态与持续意义
  choice: 译作“没有撇下我”
  alternative: 译作“从未撇下我”或“没有让……一直独自一人”
  rationale: 希腊文不定过去时本身不要求汉语额外加入“从未”或“一直”；前句“与我同在”已显示当前持续的意义，故采用不越出原文的自然表达。
- issue: ὅτι所表达的因果关系
  choice: 明确译为“因为”
  alternative: 译为较宽泛的“因”或解释为结果关系
  rationale: 最自然的句法理解是ὅτι引出那差遣者没有撇下耶稣独自一人的理由。译文保留这一因果陈述及其神学张力，不另加说明来重构父子关系。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。“与我同在”“撇下我”具有经文语体的尊严，但仍为普通读者易懂；分号保留两项紧密相连的陈述。原文不存在必须用脚注呈现的实质歧义，因此正文不设脚注标记。
