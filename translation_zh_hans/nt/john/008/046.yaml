  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: zh_hans
  text: 你们中间谁能指证我有罪[a]？如果我说的是真话，你们为什么不信我[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们中间谁能就罪指证我？”
    reason: lexical_alternative
  - marker: b
    text: “信我”也可理解为“相信我的话”或“信赖我”；希腊语可兼有这两层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: 你们中间谁
  rationale: 准确表达“你们当中的谁”，并保留耶稣向听众发出的直接挑战，符合现代汉语习惯。
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: 能证明我有罪
  rationale: ἐλέγχω在这里带有揭露、证实罪责的意味；与περὶ ἁμαρτίας连用时，译为“证明我有罪”自然地呈现近似司法质询的语气，又不限定某一项具体罪行。
- source_word: εἰ ἀλήθειαν λέγω
  choice: 我既然说的是真话
  rationale: εἰ形式上是条件连词，但在此修辞语境中提出说真话这一被说话者肯定的前提；汉语“既然”自然呈现由此前提引出的质问。
- source_word: διὰ τί
  choice: 为什么
  rationale: 这是询问原因的常用表达，“为什么”准确而自然。
- source_word: πιστεύετέ μοι
  choice: 信我
  rationale: πιστεύω加与格既可表示相信某人的话，也可含信赖某人的意味；“信我”保留这两方面的开放性。
theological_decisions:
- issue: 耶稣关于自己无罪与所言真实的修辞力度
  choice: 直接保留两个质问，不将其弱化，也不把隐含结论扩写出来。
  alternative: 明确扩写为“你们谁能证明我犯过任何罪？”或在正文中直接宣告“我没有罪”。
  rationale: 原文以挑战和反问表达强烈主张。直译其修辞形式，既保留基督论分量，也避免加入原文未明说的解释。
- issue: εἰ在修辞条件句中的理解
  choice: 译作“既然”，呈现语境中说话者认定该前提为真的语用力量。
  alternative: 译作“如果”，更直接保留希腊语条件形式。
  rationale: 这里并非表达耶稣对自己是否说真话存疑，而是以其真实为依据提出质问；现代汉语用“既然”更自然，不过“如果”仍是形式对应更强的可能译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的汉语。首句用“证明我有罪”传达近似法庭质询的力度；次句用“既然”使汉语论证关系自然。“信我”简洁保留相信其言语与信赖其本人的双重可能。
