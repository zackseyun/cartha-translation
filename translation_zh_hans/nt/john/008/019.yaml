id: JHN.8.19
reference: John 8:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: zh_hans
  text: 于是，他们问他：“你的父亲在哪里？”耶稣回答：“你们既不认识我，也不认识我的父亲。你们如果认识我，也会认识我的父亲。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的条件句带有与当前事实相反的意味，即他们并不认识耶稣，也不认识他的父亲。
    reason: 说明原文条件句的反事实语气；现代汉语正文若完全明说，容易加入原文未明示的时间色彩。
lexical_decisions:
- source_word: ἔλεγον
  choice: 他们问他
  rationale: 未完成时可表示当时正在进行或反复发生的言说；因其内容是直接问句，现代汉语用“问”最自然。上下文中的持续背景由叙事衔接表达，不用“不断问”来过度强调反复。
- source_word: οὖν
  choice: 于是
  rationale: 保留承接前文并引出回应的语篇作用，语气自然且庄重。
- source_word: πατήρ / πατέρα μου
  choice: 父亲／我的父亲
  rationale: 同一词在问话和耶稣的回答中保持一致，以保留约翰叙事中的反讽：发问者并未真正明白耶稣所指的是上帝。简体中文没有大小写之分，因此不以不同词形替代原文的同词呼应。
- source_word: οἴδατε / ᾔδειτε
  choice: 认识
  rationale: 在此处，“认识”既可包含认知和辨认，也适合人与人之间的关系性认识；比“知道”更符合“认识我／认识我的父亲”的现代汉语搭配，同时不把含义缩窄为纯粹理智上的了解。
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: 你们既不认识我，也不认识我的父亲
  rationale: 以“既不……也不……”自然对应 οὔτε…οὔτε，并保留两个并列否定项。
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: 你们如果认识我，也会认识我的父亲
  rationale: 以“如果……也会……”表达条件关系，并保留 καί 的“也”。汉语正文自然指向与当前事实不符的情形，但不像加入“其实”或“本来”那样过度解释。
theological_decisions:
- issue: “父亲”所指是否明确标示为上帝
  choice: 正文统一译作“父亲”，由上下文显明所指
  alternative: 将耶稣所说的“我的父”改用带称号色彩的表达
  rationale: 希腊文在双方话语中使用同一名词。统一译法既保留发问者未能领会的反讽，也避免因中文没有大小写而擅自制造原文没有的词汇差异。
- issue: “认识”耶稣与“认识”父的内涵
  choice: 保留宽泛的“认识”
  alternative: 译作“了解”或“认出”
  rationale: “认识”能兼容认知、辨认和关系层面的含义，保留约翰福音中认识耶稣与认识父之间的神学张力，不将其限定为单纯理解或视觉辨认。
- issue: 条件句是否明说与事实相反
  choice: 正文采用自然条件句，脚注说明其反事实意味
  alternative: 正文加入“其实”“本来”或“若是早已”等解释性措辞
  rationale: 原文的未完成时与 ἄν 构成可表达与当前事实相反的条件句。正文保持简洁和时间指向的开放性，脚注交代语法力度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”连接上下文；“问他”比直译为“对他说”更符合汉语问句习惯。“父亲”在全节保持一致，以保存原文同词复现及叙事反讽。
