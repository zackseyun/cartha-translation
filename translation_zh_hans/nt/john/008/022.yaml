  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: zh_hans
  text: 于是，犹太人[a]说：“难道他要自杀吗？因为他说：‘我要去的地方，你们不能来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在约翰福音的语境中，这个称呼也可能指“犹太地人”或“犹太领袖”，具体范围取决于作者在这里所指的人群。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示当时持续或反复的言说；现代汉语叙事中单用“说”最自然，语境已足以表达当时的谈论，不必生硬地译成“不断地说”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节耶稣的话，并引出听者据此作出的反应；“于是”符合现代汉语叙事衔接。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按词语本身保留较宽泛的称呼，不在正文中擅自限定为“犹太领袖”或“犹太地区的人”；其在约翰福音语境中的可能范围用脚注说明。
- source_word: Μήτι
  choice: 难道……吗
  rationale: μήτι引出预期否定答案的疑问；“难道……吗”自然表达说话者怀疑、认为不大可能的语气。
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: 要自杀
  rationale: 准确表达“杀死自己”的反身意义；“自杀”是现代汉语中直接、清楚的说法。
- source_word: ὅτι
  choice: 因为
  rationale: 这里引出他们如此猜测的依据，即耶稣所说的话；“因为”清楚保留因由关系。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊语现在时在引述框架中的生动感，汉语“他说”自然简洁。
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: 我要去的地方
  rationale: ὑπάγω可指“去、离去”；此处译为“我要去”自然表达方向和将临行动，同时不额外限定其含义。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 你们不能来
  rationale: 简洁、自然地表达δύνασθε与不定式所表示的能力或可能性上的不能。
theological_decisions:
- issue: 约翰福音中“οἱ Ἰουδαῖοι”的所指
  choice: 正文译作“犹太人”
  alternative: “犹太地区的人”或“犹太领袖”
  rationale: 原文称谓本身较宽，尽管约翰福音某些语境可能特指犹太地区的反对者或领袖，本节并未明说其范围。正文保留原有张力，脚注提示可能的语境性理解，避免把所指无根据地扩大到所有犹太人，也避免在正文中先行缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道他要自杀吗”保留预期否定答案的疑问语气；引语层次使用中文全角引号。脚注标记紧随“犹太人”，与所说明的词语直接对应。
