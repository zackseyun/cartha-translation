  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：人若遵守我的话，就永远不会见到死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 实实在在地
  rationale: 保留约翰福音中耶稣双重“阿们”的郑重语气，同时采用现代汉语中庄重而易懂的惯用表达。
- source_word: τηρήσῃ
  choice: 遵守
  rationale: 表达持续看重、持守并实行耶稣之话的含义，不弱化为仅仅“听见”或“记住”。
- source_word: τὸν ἐμὸν λόγον
  choice: 我的话
  rationale: λόγος在此指耶稣所说的信息或教导；“我的话”自然简洁，也保留单数形式。
- source_word: θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα
  choice: 就永远不会见到死
  rationale: “绝不会”式的强烈否定与“永远”共同传达οὐ μὴ及εἰς τὸν αἰῶνα；“见到死”保留原文具象而富神学张力的表达。
theological_decisions:
- issue: “永远不会见到死”与信徒肉身死亡之间的张力
  choice: 直译为“永远不会见到死”
  alternative: 解释性译为“永远不会经历永死”
  rationale: 原文没有明说“永死”或限定为肉身死亡。保留耶稣话语本身的绝对性和约翰语境中的神学张力，避免把一种解释写进正文。
translation_notes:
  register: 采用现代、庄重、口语可懂的标准普通话。“实实在在地告诉你们”符合约翰福音公式化宣告的语体；全句简洁有力，不添加原文没有的解释。
