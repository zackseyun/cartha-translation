  to: 耶稣回答说：“如果我荣耀自己，我的荣耀就算不得什么。荣耀我的是我父亲，就是你们所说是我们的上帝[a]的那一位。”
  rationale: 修正关系从句和嵌入陈述的汉语句法，并将略显仿古而不完整的‘我的父’改为自然的现代普通话‘我父亲’。其余内容保留原译的词汇对应、语体和SBLGNT的‘我们的上帝’读法；脚注锚点紧接异文所涉及的短语。
