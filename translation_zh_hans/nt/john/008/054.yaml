  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: zh_hans
  text: 耶稣回答说：“如果我荣耀自己，我的荣耀就算不得什么。荣耀我的是我父亲，就是你们所说是我们的上帝[a]的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你们的上帝”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: 这是对话叙事中自然、庄重的现代汉语表达，也明确引出后面的直接引语。
- source_word: δοξάσω / δοξάζων
  choice: 荣耀／荣耀……
  rationale: 保留约翰福音中“荣耀”主题的神学分量，并使同一希腊词在本节前后对应。
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: 我的荣耀就算不得什么
  rationale: 贴近“是无”的原意，同时比生硬的“我的荣耀是无”更符合现代汉语。
- source_word: ὁ πατήρ μου
  choice: 我的父
  rationale: 忠实保留耶稣与父的关系称谓，不额外加入解释性措辞。
- source_word: ὁ δοξάζων με
  choice: 荣耀我的是……
  rationale: 以汉语判断句自然表达带冠词的现在分词结构，保留其描述性意味。
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: 就是你们所说‘是我们的上帝’的那一位
  rationale: 保留关系代词所指向的“那一位”，同时用嵌入式引语自然呈现你们的宣称；主文本依SBLGNT采用“我们的”。
- source_word: θεὸς
  choice: 上帝
  rationale: 此处指以色列的上帝；“上帝”是现代普通话中清楚、庄重且通行的称呼。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 依照所给SBLGNT主文本；异文“你们的”另列脚注。
theological_decisions:
- issue: θεὸς ἡμῶν/ὑμῶν ἐστιν中的代词异文
  choice: 我们的上帝
  alternative: 你们的上帝
  rationale: 主文本遵循SBLGNT的ἡμῶν，同时在脚注保留有解释意义的ὑμῶν异文，不据上下文擅自消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荣耀”保留约翰福音的关键词复现；“算不得什么”兼顾原文力度与汉语自然度。脚注标记置于相关异文所在分句之后。
