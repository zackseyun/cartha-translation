  naturalness: “由淫乱所生”庄重、自然，并保留原句的论战性。将“所做的，是……所做的事”改为“是在做……的作为”，避免汉语中重复且不够明确的结构。
  terminology: 保留“父亲”以维持本段的关系隐喻和后文张力；“上帝”与项目既有用语一致。“作为”在此可表达ἔργα，且与“做”保持词语呼应。脚注将“私生子”调整为较中性的“非婚生子女”，避免不必要的贬抑色彩，同时说明这是一种可能的意译。
