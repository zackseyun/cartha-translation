  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: zh_hans
  text: 你们是在做你们父亲的作为。”他们对他说：“我们并非由淫乱所生[a]；我们只有一位父亲，就是上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们不是非婚生子女”。希腊文直译为“我们并非由淫乱所生”。
    reason: 说明该表达可能否认非婚生身份，同时保留原文较为含混的字面说法。
lexical_decisions:
- source_word: ποιεῖτε
  choice: 所做的
  rationale: 现在时在语境中指他们正在表现出来的行为；汉语用“所做的”自然承接上下文，不必机械加入“正在”。
- source_word: τὰ ἔργα
  choice: 所做的事
  rationale: 既表达“行为、作为”，又与 ποιεῖτε 的“做”形成原文中的词义呼应。
- source_word: τοῦ πατρὸς ὑμῶν
  choice: 你们父亲
  rationale: 保留“父亲”这一关系和来源隐喻，不提前说明父亲是谁，从而维持上下文的张力。
- source_word: ἐκ πορνείας
  choice: 从淫乱
  rationale: “淫乱”概括 πορνεία 所指的不正当性关系；“从……生的”贴近原文，同时保留它可能暗指非婚生的含义。
- source_word: οὐ γεγεννήμεθα
  choice: 不是……生的
  rationale: 以现代汉语自然表达完成时被动态所陈述的出生身份及其持续结果。
- source_word: ἕνα πατέρα ἔχομεν
  choice: 我们只有一位父亲
  rationale: “只有一位”清楚传达 ἕνα 的唯一性强调，且符合自然汉语。
- source_word: τὸν θεόν
  choice: 就是上帝
  rationale: “就是”自然表达同位关系，说明他们所称的唯一父亲是上帝。
theological_decisions:
- issue: 是否把“从淫乱生的”直接解释为“私生子”
  choice: 正文保留“我们不是从淫乱生的”
  alternative: 我们不是私生子
  rationale: 原文直接说“从 πορνεία 生”，虽很可能暗指非婚生身份，也可能带有更广泛的论战意味；正文保留原有措辞，脚注说明常见含义，避免消除其含混和张力。
- issue: 是否明确说明“你们父亲”是谁
  choice: 不在本节中补明身份
  alternative: 把“父亲”解释为魔鬼或属灵源头
  rationale: 本句本身没有明说，后文才进一步揭示；译文不应抢先解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从淫乱生的”略带原文式的突兀感，这是为保留其论战锋芒和潜在双关；脚注提供更自然的身份性理解。
