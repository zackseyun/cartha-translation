  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: zh_hans
  text: 他们就问他：“你是谁？”耶稣对他们说：“就是我从起初告诉你们的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文句法含混，也可理解为：“我为什么还要对你们说话呢？”另有译法将开头理解为“起初”或“首先”，并把后半句理解为耶稣正在向他们所说的话。
    reason: 原文Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν有多种可行的断句和句法分析；正文采用“从起初所说”的传统理解，脚注保留其他主要理解，而不将其具体化为某个身份称号。
lexical_decisions:
- source_word: ἔλεγον
  choice: 问
  rationale: 未完成时在此引出当时持续进行的对话；结合后面的直接问句，用现代汉语“问”比直译“说”更自然。
- source_word: Τὴν ἀρχὴν
  choice: 从起初
  rationale: 保留“起初、开始”的基本词义，并与耶稣先前一直所说的话相连。
- source_word: λαλῶ
  choice: 告诉
  rationale: 此处指耶稣向他们所讲说的内容；“告诉”既自然，也能回应“你是谁”的提问。
- source_word: καί
  choice: 一直
  rationale: 在所采用的句法理解中，καί加强“从起初便如此讲说”的连续意味；汉语以“一直”自然表达。
theological_decisions:
- issue: 耶稣回答中Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν的句法与含义
  choice: 就是我从起初一直告诉你们的。
  alternative: 我究竟为什么还要对你们说话呢？／首先，我正是对你们所说的。
  rationale: 希腊原句极为简略，句法存在真实争议。正文采用能直接回应“你是谁”、且符合“从起初所讲”的传统理解；不把此回答具体化为某个神学称号，以免补入原文未明说的内容。脚注保存主要异译。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“他们就问他”承接上文；耶稣的回答保持简洁，不擅自补出身份称号。
