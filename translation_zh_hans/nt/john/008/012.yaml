  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: zh_hans
  text: 于是，耶稣又对他们说：“我是世界的光。跟从我的人，绝不会在黑暗中行走[a]，反而要得着生命的光[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文使用强烈的否定形式（οὐ μή），也可译为“必不在黑暗中行走”。
    reason: lexical_alternative
  - marker: b
    text: “生命的光”也可理解为“赐生命的光”。
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: 于是……又
  rationale: Πάλιν表示再次发生，译作“又”；οὖν在这里承接上文，译作“于是”，既保持叙事衔接，也不把它强化为严格的逻辑推论。
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: 耶稣……说
  rationale: 汉语无需逐字重复“讲说……说道”；用一个“说”自然地引出直接引语，同时完整传达原文。
- source_word: Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου
  choice: 我是世界的光
  rationale: 直接保留系词结构和光的隐喻。ἐγώ虽为明示主语，但在带表语的句子中不宜额外加入原文没有明说的神名解释。
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: 跟从我的人
  rationale: 带冠词的现在分词表示具有这一特征的人；此译保留持续跟从的含义，也符合现代汉语表达。
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: 绝不会在黑暗中行走
  rationale: οὐ μή加虚拟语气构成强烈否定，“绝不会”体现其强调语气；“行走”保留περιπατέω兼具实际行走与生活行为隐喻的张力。“黑暗”保留约翰文献中近似领域或状态的意象。
- source_word: ἀλλ’ ἕξει
  choice: 却会拥有
  rationale: ἀλλά表达鲜明转折，译作“却”；ἕξει是ἔχω的将来时，“会拥有”比单说“有”更清楚地体现将来意义。
- source_word: τὸ φῶς τῆς ζωῆς
  choice: 生命的光
  rationale: 保留原文紧凑的属格结构，不将其限定为“赐生命的光”或其他单一解释，从而保留生命与光之间关系的多重可能。
theological_decisions:
- issue: Ἐγώ εἰμι在耶稣自我宣告中的神学意味
  choice: 译作“我是世界的光”，按其与表语相连的普通句法呈现。
  alternative: 通过加重语气或注释，明确将“我是”解释为对神名的呼应。
  rationale: 本句的ἐγώ εἰμι后接明确表语“世界的光”。译文不应排除约翰福音更广泛的神学呼应，也不应把这种呼应直接写进正文。
- issue: “生命的光”中属格的意义
  choice: 保留“生命的光”。
  alternative: 译作“赐生命的光”或“带来生命的光”。
  rationale: τῆς ζωῆς可以表达来源、性质或功效等关系；直译能保留这种开放性和神学张力。
- issue: 跟从者不在黑暗中行走这一应许的力度
  choice: 用“绝不会”表达强烈否定。
  alternative: 用较弱的“不会”，或解释为信徒今生绝无任何过失。
  rationale: 原文οὐ μή语气强烈，但译文不进一步界定这句话所涉及的是属灵领域、生活方向还是绝对无罪，以免加入经文本身未明说的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“跟从”保留圣经语境中的门徒含义；“行走”保留原文意象，不简化为“生活”。句式简洁，适合公开诵读。
