  naturalness: “我的话在你们里面容不下”在现代汉语中搭配和施受关系不自然。改为“我的话在你们里面没有容身之处”自然、庄重，并保留原文的空间隐喻。
  terminology: “后裔”避免将血缘后代预先诠释为属灵儿女；“我的话”保留λόγος在约翰语境中的用词联系。
