  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: zh_hans
  text: 我知道你们是亚伯拉罕的后裔[a]；然而，你们想要杀我，因为我的话在你们里面没有容身之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伯拉罕的子孙”；原文直译为“亚伯拉罕的种子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的话在你们里面找不到容身之处。”也可能有“我的话在你们中间无法进展”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: 亚伯拉罕的后裔
  rationale: σπέρμα在这里是集合意义的单数，指肉身上的血统。“后裔”是现代汉语中自然、庄重的表达，既能涵盖群体，也不像“儿女”那样可能提前引入属灵身份的含义。
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: 你们想要杀我
  rationale: ζητέω加不定式在此可表示寻求、意图或图谋做某事。“想要杀我”自然地表达持续存在的意图，同时不把它过度具体化为已经实施的行动。
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: 我的话
  rationale: 直译为“我的话”，保留约翰著作中λόγος的用词联系与潜在的多层含义；“我的信息”则会使这种联系变弱。
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: 在你们里面容不下
  rationale: χωρέω可表示腾出空间、容纳或取得进展。“在你们里面容不下”保留空间隐喻和内在不接纳的意味，同时不限定为单纯的理解、接受或影响。
- source_word: ἀλλὰ
  choice: 然而
  rationale: 标明他们虽有亚伯拉罕的肉身血统，却企图杀耶稣这一强烈反差；“然而”在此庄重而自然。
- source_word: οἶδα ὅτι
  choice: 我知道
  rationale: 自然表达希腊文引出宾语从句的结构；汉语无需另译相当于英语that的词。
theological_decisions:
- issue: 亚伯拉罕的肉身后裔与真正符合亚伯拉罕身份之间的关系
  choice: 将σπέρμα Ἀβραάμ译作“亚伯拉罕的后裔”，明确承认其血缘意义，但不在本节加入属灵儿女的解释。
  alternative: 亚伯拉罕的儿女
  rationale: 上下文中，耶稣先承认他们的血缘出身，再以他们企图杀他的行为提出挑战。“后裔”保留这处尚待后文展开的神学张力，避免提前把血缘和属灵身份合并或对立起来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“后裔”准确表达集合性的血缘关系；“在你们里面容不下”保留原文的空间隐喻及其歧义。主文本中的[a]、[b]均与脚注对应。
