  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: zh_hans
  text: 所以，子若使你们得自由，你们就会真正自由。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真正”也可译作“确实”或“实在”。希腊语副词强调这种自由是真实的、名副其实的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以，……若……
  rationale: ἐάν引出条件，οὖν承接上文作推论；“所以，……若……”既保留逻辑关系，也符合现代汉语表达。
- source_word: ὁ υἱὸς
  choice: 儿子
  rationale: 定冠词与约翰福音语境表明这是特指耶稣的基督论称谓；汉语“儿子”本身不靠大小写区分，语境保留其专指意义。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确表达希腊语第二人称复数。
- source_word: ἐλευθερώσῃ
  choice: 使……自由
  rationale: 直接表达使役性的释放行动，并与后面的形容词“自由”保留词根呼应。
- source_word: ὄντως
  choice: 真正
  rationale: 强调这种自由是真实、确实的；不额外限定其类别或范围。
- source_word: ἐλεύθεροι
  choice: 自由
  rationale: 译作描述结果状态的谓语形容词，而不是只强调一次释放行为。
- source_word: ἔσεσθε
  choice: 就……了
  rationale: 在汉语条件复句中，“就……了”自然表达条件实现后将成就的状态，保留未来指向。
theological_decisions:
- issue: “儿子”的身份
  choice: 保留“儿子”这一特指称谓，由约翰福音语境指向耶稣
  alternative: 泛指某个儿子
  rationale: 冠词和上下文中的家内身份、权柄及释放行动都支持专指；译文不另加“上帝的”，以免超出本节明说的内容。
- issue: 所说自由的性质
  choice: 译为“真正自由”，保持其真实、充分的强调而不进一步限定义域
  alternative: 明确译成仅属灵的自由、社会自由或政治自由
  rationale: 上文涉及罪的奴役，但本句以概括方式陈述自由的结果；保留广度可避免在翻译中消解其神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“你们”明确复数；“使你们自由”保留原文动词与形容词之间的词义呼应。脚注标记置于完整句末，说明“真正”所对应的强调副词。
