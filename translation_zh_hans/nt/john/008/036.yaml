  terminology: 采用“子”作为约翰福音语境中对耶稣的特指称谓，既避免“儿子”的泛指歧义，也不以“圣子”或“上帝的儿子”加入本节未明示的限定。ὄντως译为“真正”，准确保留其强调真实、确实的含义。
