  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: zh_hans
  text: 可是，正因为我说的是真理[a]，你们才不信我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可是，我说的是真理，你们却不信我。”原文连接词也可较形式化地理解为引出所说的内容，但这里更可能表示原因，即“因为”。
    reason: 说明ὅτι可能采用的陈述性形式译法，并保留其句法上的真实歧义。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留明示的第一人称代词；在汉语中与后面的“你们”形成清楚对照，也体现原文主语的强调。
- source_word: δὲ
  choice: 可是
  rationale: 承接上文并表达鲜明转折；“可是”自然、庄重，也适合此处耶稣与听众之间的对比。
- source_word: ὅτι
  choice: 正因为
  rationale: 按因果关系理解；“正”突出了原句尖锐的反常意味：他们不信，原因恰恰是耶稣所说的是真理。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: “真理”是ἀλήθεια在本段语境中的自然对应，既可指真实无伪，也保留其较庄重的论辩色彩。
- source_word: λέγω
  choice: 我说的
  rationale: λέγω为现在时；采用“我说的是真理”符合现代汉语表达，同时没有把动词扩展为解释性的“告诉”。
- source_word: οὐ πιστεύετέ μοι
  choice: 你们才不信我
  rationale: πιστεύω加与格可表示相信某人。“不信我”直接保留其人际对象；“才”与前面的“正因为”配合，清楚传达因果和讽刺性的反差。
theological_decisions:
- issue: ὅτι所引成分与“不信我”的关系
  choice: 按因果理解：“正因为我说的是真理”
  alternative: 按陈述内容较形式化地理解：“可是，我说的是真理，你们却不信我”
  rationale: 上下文把耶稣所说的真理与对方的不信并置，因果读法最能体现论述中的尖锐反差；这是句法和语篇判断，并不额外加入某一教派的解释。
translation_notes:
  register: 采用现代标准普通话，语气自然而庄重。“正因为……才……”清楚呈现因果关系及原文的强烈反差；脚注保留较形式化的另一种理解。
