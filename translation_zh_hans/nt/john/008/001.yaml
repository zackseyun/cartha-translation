- source_word: ὄρος
  choice: 山
  rationale: 与“橄榄”组合为现代汉语中通行、明确的地名“橄榄山”，无需另译为“山岭”或“高地”。
- source_word: ἐλαία
  choice: 橄榄
  rationale: 希腊文复数属格字面涉及橄榄树，但在该固定地名中按现代汉语惯例译作“橄榄山”。
- source_word: δέ
  choice: 却
  rationale: 承接前文众人各自回家（7:53），同时突出耶稣去向与众人的对照；“却”比单纯的“而”更自然地表达这一轻微转折。
