lexical_decisions:
- source_word: Ὄρθρου
  choice: 清早
  rationale: 这是表示时间的属格，指黎明或日出前后；“清早”简洁自然，也符合现代汉语叙事语体。
- source_word: παρεγένετο
  choice: 来到
  rationale: 该词在此表示抵达某处；结合目的地“圣殿”，“来到”最自然。
- source_word: ἱερόν
  choice: 圣殿
  rationale: 此词指整个圣殿区域，而非内层圣所（ναός）；“圣殿”是通行译法，语境表明耶稣是在可公开教导人的区域。
- source_word: πᾶς ὁ λαὸς
  choice: 众人都
  rationale: 既表达πᾶς的整体性，也比生硬的“所有百姓”更符合现代汉语。
- source_word: καθίσας
  choice: 坐下
  rationale: 不定过去时分词表示这一动作先于教导；“坐下”准确而自然。
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 未完成过去时可表示持续进行，也可能带起始意味；正文采用不额外限定起始或持续的“教导”，保留原文的语义余地。
