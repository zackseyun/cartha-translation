base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: zh_hans
  text: 他对他们说：“你们是从下面来的[a]，我是从上面来的；你们是从这个世界来的[b]，我不是从这个世界来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们属于下面……我属于上面。”
    reason: lexical_alternative
  - marker: b
    text: 在《约翰福音》中，“世界”常常不只指物质的大地，也指与神疏离的人类秩序。
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: 他又对他们说
  rationale: καί承接上文，译作“又”；ἔλεγεν为未完成过去时，但现代汉语通常不以生硬的进行式表达此处叙事背景，因此用自然的“对他们说”，由语境承载其延续意味。
- source_word: Ὑμεῖς / ἐγὼ
  choice: 你们 / 我
  rationale: 希腊文显式使用人称代词以加强双方对比；汉语保留“你们”和“我”，突出耶稣与听众之间的鲜明反差。
- source_word: ἐκ τῶν κάτω
  choice: 从下面来的
  rationale: 保留ἐκ所表达的来源，以及与“从上面来的”相对的垂直意象，不将“下面”直接解释为某个特定道德或宇宙领域。
- source_word: ἐκ τῶν ἄνω
  choice: 从上面来的
  rationale: 与“从下面来的”形成对称，保存约翰文献中的上下意象，同时避免扩译为“从天上”而缩窄原文措辞。
- source_word: κόσμος
  choice: 世界
  rationale: “世界”是κόσμος宽广而惯常的对应词，既可指受造世界，也可在约翰语境中指与神疏离的人类秩序；正文保留其多义空间，并以脚注提示语境含义。
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: 这个世界
  rationale: 两种希腊语词序都强调同一个“这个世界”；汉语采用自然且一致的表达，并保留指示词。
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: 我不是从这个世界来的
  rationale: 直接保留重复的ἐκ结构和来源意味；不改译成“我不属于这个世界”，因为后者会更侧重归属关系。
theological_decisions:
- issue: “从下面／从上面”以及“从这个世界来”的对比所表达的意义
  choice: 保留来源和领域的语言，不把上下意象明确扩写成道德判断或完整的天地二分教义。
  alternative: 可解释性地译为“你们属于地上的领域，我属于天上的领域”，或直接加入善恶对比。
  rationale: 原文呈现强烈的约翰式对比和基督论区分，却没有在本节中把“下面”明说为某一特定道德或宇宙领域；直译其意象能保留真实的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从下面来的／从上面来的”及“从这个世界来的”形成整齐平行，保存原文反复出现的来源结构；标点用分号突出两组彼此关联的对比。
