  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: zh_hans
  text: 于是，他们拿起石头要向他扔去；耶稣却藏起来，从圣殿[a]里出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更准确地说，是“圣殿区域”或“圣殿院区”。这里的希腊词 ἱερόν 指整个圣殿范围，而不是内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: 拿起
  rationale: 在此指把石头拿在手中，准备实施攻击；“拿起”自然、准确，不必把动作具体化为从地上“捡起”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并表达由前述言论引发的结果；“于是”符合现代汉语叙事习惯。
- source_word: λίθους
  choice: 石头
  rationale: 这是 λίθος 在以石攻击语境中的常规译法，也保留了可能以石头处死人的暴力意味。
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: 要砸他
  rationale: ἵνα 加虚拟式表示目的；“要砸他”简洁自然，并比“向他扔”更贴合以石头攻击人的具体语境。
- source_word: ἐκρύβη
  choice: 藏了起来
  rationale: 该被动形式在此可作中间意义理解，表示耶稣自行隐蔽；这样不会暗示有未说明的人把他藏起来。
- source_word: ἐξῆλθεν
  choice: 走出了
  rationale: 直接表达从某处出去的实际移动，与后面的 ἐκ τοῦ ἱεροῦ 自然衔接。
- source_word: ἐκ τοῦ ἱεροῦ
  choice: 走出了圣殿
  rationale: ἱερόν 指整个圣殿建筑群或院区，而非内殿；正文采用读者熟悉的“圣殿”，精确范围由脚注说明。
theological_decisions:
- issue: 耶稣如何脱身
  choice: 只译为耶稣藏起来并走出圣殿，不添加超自然细节。
  alternative: 译作耶稣从他们中间穿过去，或暗示他隐形。
  rationale: SBLGNT 本节只说耶稣藏起来并走出去；其他细节来自后期抄本传统，不应加入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“砸他”清楚表达拿石头攻击的目的；“圣殿”保留通行的经文用语，并以脚注交代其空间范围。
