  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: zh_hans
  text: 你们为什么不明白我的说话方式？因为你们不能听我的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听我的话”也可理解为“听得进我的话”。原文用的是“听”，上下文同时含有领会或接纳的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: 说话方式
  rationale: 此词在这里侧重耶稣说话的方式或表达，译作“说话方式”既自然，也与后句指话语内容的 λόγος 保持区别。
- source_word: γινώσκετε
  choice: 明白
  rationale: 语境所指是理解耶稣所说的，并非仅仅知道或认识；“明白”符合现代汉语表达。
- source_word: ἀκούειν
  choice: 听
  rationale: 保留该词“听”的基本意义，不擅自将其解释为“接受”或“听从”，让语境中的属灵含义保持开放。
- source_word: λόγον
  choice: 话
  rationale: “我的话”在现代汉语中自然，并能表达耶稣所讲的信息，同时与“说话方式”形成区别。
- source_word: οὐ δύνασθε
  choice: 不能
  rationale: 直接表达能力上的否定，简洁自然；不将其弱化为“不愿意”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出前面问题的原因，“因为”最清楚地呈现这一逻辑关系。
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: 我的
  rationale: 以“我的说话方式”和“我的话”保留原文两个所有格结构的对应关系。
theological_decisions:
- issue: “不能听我的话”所指的不能之性质
  choice: 直接译为“不能”，不补充其成因
  alternative: 解释为道德上的不愿意、审判性的刚硬或属灵上的无能力
  rationale: 经文本身陈述了不能，却没有在本节完整说明其机制；译文应保留这一神学张力，不替原文作进一步裁断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“说话方式”与“话”有意对应原文 λαλιὰ 与 λόγος 的词义区别；后句保留略带张力的“不能听”，并以脚注提示其语境含义。
