  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: zh_hans
  text: 我所说的，是我在父那里所看见的；你们呢，也照着从你们的父那里所听见的去做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“去做”的动词形式可理解为直陈语气（“你们正在做”），也可理解为命令语气（“你们应当去做”）。原文第二个“父”没有明说“你们的”；较形式化可译作：“我所说的，是我在父那里所看见的；所以，你们也照着从父那里所听见的去做。”
    reason: 说明ποιεῖτε的形态语气歧义，并说明第二个“父”在原文未带明确的第二人称所有格；改正不自然的“那父”表述。
lexical_decisions:
- source_word: ἃ
  choice: ……的（事）
  rationale: 中性复数关系代词在此引出言说与行动的内容；汉语用“所……的”结构自然表达，无须生硬补出“那些事”。
- source_word: ἑώρακα
  choice: 所看见的
  rationale: 完成时表示过去所见而对当前仍有意义；“所看见的”结合上下文可自然保留这种关联。
- source_word: παρὰ τῷ πατρὶ
  choice: 在父那里
  rationale: παρά加与格主要表示同在、近旁或在其面前；“在父那里”比“从父那里”更准确保留此处的位置与关系含义。
- source_word: λαλῶ
  choice: 我所说的，是……
  rationale: λαλῶ意为“说”；用汉语判断式结构明确“所看见的”是言说内容，同时保持原文语序重心。
- source_word: οὖν
  choice: 呢，也
  rationale: οὖν在这里承接并形成对照或推论；“呢，也”在现代汉语中自然呈现“我……你们也……”的对应关系，避免把逻辑力度表达得过强。
- source_word: ἃ ἠκούσατε
  choice: 所听见的
  rationale: 不定过去时陈述他们听见之事；汉语“所听见的”既自然，也与前半句“所看见的”形成对应。
- source_word: παρὰ τοῦ πατρὸς
  choice: 从你们的父那里
  rationale: παρά加属格表示来源。希腊文没有明说“你们的”，但上下文把耶稣的父与对方的父相对照；补出“你们的”符合汉语表达，也不提前指明其身份。
- source_word: ποιεῖτε
  choice: 照着……去做
  rationale: ποιεῖτε可作直陈或命令理解；“去做”有意保留这种语气上的歧义，而“照着”自然连接所听内容与行动。
- source_word: πατήρ / πατρὸς
  choice: 父／你们的父
  rationale: 首处指耶稣所说的父，即上帝；次处保留较含蓄的称呼，不把第44节才明说的身份提前带入。
theological_decisions:
- issue: 第二个“父”是否应在正文中明确为魔鬼
  choice: 译作“你们的父”，不进一步指明
  alternative: 译作“那父”或“魔鬼”
  rationale: 第44节才明确揭示其身份。本节保留“你们的父”，既呈现上下文中的对照，也维持叙事与论辩逐步揭示的张力。
- issue: ποιεῖτε应理解为直陈还是命令
  choice: 采用可兼容两者的“去做”
  alternative: “你们正在做”或“你们就该做”
  rationale: 该动词形式既可作现在时直陈，也可作现在时命令；文本证据不足以完全消除歧义，因此不在正文中强行判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在父那里”保留παρά加与格的临在含义；前后以“看见／听见”“父／你们的父”形成清楚对照。脚注集中说明原文中真实存在的语气与指称歧义。
