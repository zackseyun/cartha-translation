  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: zh_hans
  text: 她[a]说：“没有人，主啊。”耶稣对她说：“我也不定你的罪。去吧，从今以后不要再犯罪了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是关于行淫时被捉拿的妇人的故事（约翰福音7:53—8:11）的最后一节。参见约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 这是κύριος的呼格；译作“主啊”既自然表达直接称呼，也保留她对耶稣权威的承认，而不把语气弱化为单纯礼貌性的“先生”。
- source_word: κατακρίνω
  choice: 定……的罪
  rationale: 该词在此具有司法语境中的定罪含义；“定你的罪”准确、自然，并与众人控告和意图处置她的上下文相合。
- source_word: μηκέτι ἁμάρτανε
  choice: 从今以后不要再犯罪了
  rationale: μηκέτι表示从此不再继续；配合现在时命令语气ἁμάρτανε，译文清楚传达停止犯罪并不再犯罪的要求。
- source_word: πορεύου
  choice: 去吧
  rationale: 简洁保留现在时命令语气，在现代汉语中自然且庄重。
theological_decisions:
- issue: 耶稣“不定罪”与“不要再犯罪”的并置
  choice: 按原文同时保留赦免式的不定罪宣告和停止犯罪的命令
  alternative: 把“不定罪”扩展解释为无条件认可，或把命令扩展为特定教义表述
  rationale: 原文有意并置怜悯与道德要求；译文不应消解两者之间的张力，也不应加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”保留呼格色彩；“定你的罪”符合司法语境；“从今以后不要再犯罪了”比直译式“不再犯罪”更自然，并明确μηκέτι的时间指向。脚注标记已置于正文“她”之后。
