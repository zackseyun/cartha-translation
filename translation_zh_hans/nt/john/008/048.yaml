  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: zh_hans
  text: 犹太人回答耶稣说[a]：“我们说你是撒玛利亚人，又被鬼附身，难道说得不对吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在约翰福音的一些语境中也可理解为“犹太地区的人”，或特指某些犹太领袖；这里所指的是叙事中反对耶稣的那一群人，并非毫无例外地指所有犹太人。
    reason: alternative_reading
  - marker: b
    text: 原文直译可作：“我们说……，不是说得对吗？”“被鬼附身”原文直译为“有鬼”；有些译本译作“有鬼在身”或“被鬼附”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: 回答
  rationale: 该动词虽为被动形态，却以主动意义使用，意为“回答”；符合约翰叙事用语。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 希腊文直称“犹太人”，本节并未在词汇上明确限定为“犹太领袖”或“犹太地区的人”，故正文保留较直接的译法，并以脚注说明上下文所指并非所有犹太人。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 保留原文在“回答”之后又用“说”的叙事表达；中文以“回答他说”自然呈现。
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: 难道说得不对吗
  rationale: οὐ引出的陈述式反问期待肯定回答；καλῶς在此表示“正确、恰当”，该译法保留反问语气并符合现代汉语。
- source_word: Σαμαρίτης
  choice: 撒玛利亚人
  rationale: 直接保留其族群及宗教身份称谓；在本语境中对方将此称谓用作侮辱。
- source_word: δαιμόνιον ἔχεις
  choice: 有鬼附着
  rationale: 原文直译为“有鬼”；“有鬼附着”既保留“有”的结构，也在现代汉语中较清楚地表达其指控，避免采用更具解释性的“被鬼完全控制”。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι的所指
  choice: 犹太人
  alternative: 犹太地区的人；犹太领袖
  rationale: 正文依照原文保留宽泛称谓，不擅自缩窄为领袖；脚注则提醒读者，约翰叙事中该词常指当场反对耶稣的特定群体，并非泛指每一位犹太人。
- issue: δαιμόνιον ἔχεις的表达强度
  choice: 有鬼附着
  alternative: 被鬼附；被鬼控制；有鬼
  rationale: 选择接近字面而又能被现代读者自然理解的表达，不进一步界定邪灵影响的程度，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“回答他说”略带经文叙事风格，用以保留希腊文两个言说动词；引语采用自然的汉语反问句。
