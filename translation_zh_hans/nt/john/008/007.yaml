  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: zh_hans
  text: 他们不断地追问他，他就直起身来，对他们说：“你们中间谁没有罪，谁就先拿石头打她。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节属于行淫时被抓妇人的故事（约翰福音7:53—8:11）；现存最早的希腊文抄本没有这段经文。参见约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: 不断地追问
  rationale: 未完成时动词与现在分词结合，表达持续、不肯停下的询问；“不断地追问”在现代汉语中自然保留这种持续性。
- source_word: ἀνακύψας
  choice: 直起身来
  rationale: 指耶稣从先前弯身写字的姿势抬起身体；“直起身来”清楚、自然，又不额外断定他完全站立。
- source_word: ἀναμάρτητος
  choice: 没有罪
  rationale: 这个罕见形容词可指“无罪、未犯罪”；“没有罪”保留其道德与司法语境中的张力，不把含义缩窄为只在此事上无过。
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: 先拿石头打她
  rationale: 表达由符合条件的人首先向她投石；“拿石头打她”符合现代汉语表达，也保留处刑场景。
theological_decisions:
- issue: ἀναμάρτητος所指的罪是否限于本案
  choice: 译作“没有罪”，不加限定
  alternative: “在这件事上没有罪”或“没有犯过罪”
  rationale: 希腊文本本身未明说是任何罪、同类罪，还是与指控相关的罪；正文不应替读者消解这种神学与司法上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“追问”体现持续施压，“直起身来”衔接上下文动作；引语简洁有力。脚注标记置于整节末尾，且正文中明确出现[a]。
