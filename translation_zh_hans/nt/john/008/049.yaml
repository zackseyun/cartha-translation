  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: zh_hans
  text: 耶稣回答说：“我并没有被鬼附身；我尊敬我的父亲，你们却羞辱我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: 这是叙事对话中常见的回应动词；“回答说”符合现代汉语的圣经叙事语体，也自然引出直接引语。
- source_word: Ἐγὼ δαιμόνιον οὐκ ἔχω
  choice: 我身上并没有鬼
  rationale: 保留原文“有鬼”的直接表达，同时用“身上”使汉语自然且明确；“并”传达显明主语和否定所带的强调，并与下文“却”形成转折。
- source_word: τιμῶ
  choice: 尊敬
  rationale: 准确表达给予尊重、尊荣之意，在现代汉语中自然明白。
- source_word: τὸν πατέρα μου
  choice: 我的父
  rationale: 保留约翰福音中耶稣对上帝独特而重要的称谓；“父”比普通亲属称呼“父亲”更适合作为此处的神圣称谓。
- source_word: ἀτιμάζετέ
  choice: 羞辱
  rationale: 表达不给尊荣、使之受辱的含义，并与前面的“尊敬”形成清楚的语义对照；比单纯“不尊敬”更能体现原词的力度。
- source_word: με
  choice: 我
  rationale: 直接保留第一人称宾语。
theological_decisions:
- issue: “我的父”所指为何
  choice: 按约翰福音语境，理解为耶稣称上帝为“我的父”。
  alternative: 理解为一般亲属意义上的“我的父亲”。
  rationale: 紧邻语境及约翰福音一贯用法清楚表明这是对上帝的称谓；译文保留原有称谓，不另加解释性词语。
- issue: “有鬼”的含义
  choice: 正文保留“我身上并没有鬼”这一接近原文的说法。
  alternative: 译作“我没有被鬼附身”。
  rationale: 原文直译是“我没有鬼”，在语境中指控者认为耶稣受鬼控制；正文尽量保留原文表达，脚注提供更具解释性的自然汉语说法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我身上并没有鬼”保留希腊文习语的直接性；“尊敬／羞辱”在汉语中形成明确对照，同时避免过度古雅或宗派化措辞。
