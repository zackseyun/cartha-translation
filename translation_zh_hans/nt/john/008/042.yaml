  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“如果上帝真是你们的父，你们就会爱我，因为我从上帝而来，如今在这里。[a]我不是凭自己来的[b]，而是他差遣了我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我从上帝而出，并且已经来到。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我不是从自己而来的。”原文既可强调来源，也可强调不是自行而来。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: 如果上帝是你们的父，你们就会爱我
  rationale: 希腊语以 εἰ 加未完成时，并在结果句中使用未完成时和 ἄν，表达与事实相反的条件。现代汉语通常用“如果……就会……”自然传达这种假设语气；上下文显明说话者认为该条件并不成立。
- source_word: θεὸς πατὴρ ὑμῶν
  choice: 上帝是你们的父
  rationale: 将 θεός 译为“上帝”，πατήρ 译为关系称谓“父”，既自然，也不增加原文没有的限定。
- source_word: ἠγαπᾶτε
  choice: 就会爱我
  rationale: ἀγαπάω 直译为“爱”；结合反事实条件中的未完成时和 ἄν，用“会爱”最符合现代汉语。
- source_word: ἐγὼ γὰρ
  choice: 因为我
  rationale: γάρ 在此说明他们若以上帝为父便会爱耶稣的理由；“因为”清楚呈现因果关系。
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: 我是从上帝那里出来、来到这里的
  rationale: “从上帝那里出来”保留 ἐκ 所表达的来源以及 ἐξέρχομαι 的出来意象；“来到这里”传达 ἥκω 所含已经到达并在场的意味。
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: 我并不是凭自己来的
  rationale: ἀπ’ ἐμαυτοῦ 可涉及来源，也可表示自主行动或独立发起。“凭自己来”在汉语中自然，并保留两者之间的张力；“并不是”承接并加强否定。
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: 而是他差我来的
  rationale: “而是”准确表现 ἀλλά 的转折对照；“差”保留 ἀποστέλλω 的差遣与使命意味，ἐκεῖνος 的强调由对照结构自然体现。
theological_decisions:
- issue: 如何表达耶稣从上帝而来的起源语言，同时避免加入后期神学术语
  choice: 我是从上帝那里出来、来到这里的
  alternative: 我是从上帝而出、已经来了
  rationale: 主译保留耶稣来自上帝并已到场的宣告，也保留“出来”的动词意象，却不把该普通希腊动词直接技术化为后期信经术语。较形式对应的表达列入脚注。
- issue: ἀπ’ ἐμαυτοῦ 所指的是来源还是独立主动性
  choice: 我并不是凭自己来的
  alternative: 我并不是从自己而来的
  rationale: 原短语既可强调“不是以自己为来源”，也可强调“不是自行而来、出于自己的主动”。“凭自己”在现代汉语中较自然，并有意不把这一张力完全消解；较严格的来源表达保留在脚注中。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝”与“父”保持经文的关系性表达；“差我来”保留约翰福音中的使命语言。两个脚注标记均置于对应正文之后。
