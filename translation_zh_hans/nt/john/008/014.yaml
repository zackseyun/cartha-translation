id: JHN.8.14
reference: John 8:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“即使我为自己作见证[a]，我的见证也是真的，因为我知道自己从哪里来、往哪里去；你们却不知道我从哪里来，或往哪里去[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证”也可译作“作证”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“和往哪里去”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: 回答他们说
  rationale: 保留约翰叙事中“回答……说”的双重表达，同时符合现代汉语的自然用法。
- source_word: Κἂν
  choice: 即使
  rationale: 表达让步语气：即使接受对方所设的情形，耶稣的见证仍是真的。
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: 我为自己作见证
  rationale: “作见证”保留本段的见证及司法语域；“为自己”自然表达 περὶ ἐμαυτοῦ，又不把含义限定为纯粹法律上的自我辩护。
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  choice: 我的见证也是真的
  rationale: “真的”保留 ἀληθής 的宽广含义，既可指内容真实，也不排除语境中可信、成立的意味；“也”与“即使”搭配，使让步结构自然。
- source_word: ὅτι οἶδα
  choice: 因为我知道
  rationale: ὅτι 在此引出耶稣见证为真的理由，故译为明确的因果关系。
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: 自己从哪里来、往哪里去
  rationale: 简洁呈现来源与去向；不在本节措辞中额外明说“从天上来”等上下文神学解释。
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: 你们却不知道
  rationale: “却”体现 δέ 的鲜明对比，并保留显式代词 ὑμεῖς 的强调。
- source_word: ἢ
  choice: 或
  rationale: 依 SBLGNT 正文译出选择连词，并以脚注交代读作 καί（“和”）的异文。
theological_decisions:
- issue: 耶稣自我见证的性质
  choice: 将其译为“我的见证也是真的”，并把理由保留为他知道自己的来源和去向。
  alternative: 译成“我的证词也是有效的”，或直接增译其属天来源和归宿。
  rationale: “有效的”会把 ἀληθής 过度收窄为法律效力；直接明说属天来源则把约翰福音上下文中的神学含义提前加入本节。现译文保留原文的真理宣称及其神学张力。
- issue: 末句连接词的文本异文
  choice: 正文依 SBLGNT 采用“或往哪里去”。
  alternative: 一些抄本作“和往哪里去”。
  rationale: 正文忠实反映指定底本的 ἢ，同时用脚注保留 καί 的重要异文，不据语境擅自消除差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作见证”延续约翰福音本段反复出现的见证词汇；句式保留原文的让步、因果和对比结构。脚注标记均置于正文相关词句之后。
