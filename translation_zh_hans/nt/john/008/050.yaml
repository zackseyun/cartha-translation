base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: zh_hans
  text: 但我不寻求自己的荣耀；有一位寻求并审判。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的表达是“有那寻求并审判的一位”。“寻求”的宾语没有明说，通常从前一句承接为耶稣的荣耀。
    reason: lexical_alternative
  - marker: b
    text: 这里没有说出“这一位”是谁；按上下文通常理解为父，但本节没有明确说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: 但我
  rationale: 显明主语“我”，并以“但”表达 δέ 在上下文中的转折作用。
- source_word: οὐ ζητῶ
  choice: 不寻求
  rationale: 采用一般现在时，并保留与后文 ζητῶν 相同的“寻求”一词，以呈现原文的词语呼应。
- source_word: τὴν δόξαν μου
  choice: 自己的荣耀
  rationale: δόξα 在此指归给个人的荣耀或尊荣；“自己的”自然表达 μου 与主语之间的关系，并突出不是为自己求荣耀。
- source_word: ἔστιν ὁ ζητῶν
  choice: 有一位寻求这荣耀
  rationale: 以存在句“有一位”呈现 ἔστιν 和名词化分词；补出“这荣耀”作为 ζητῶν 从前句承接的隐含宾语，使中文通顺，同时用脚注说明原文的简略表达。
- source_word: καὶ κρίνων
  choice: 并施行审判
  rationale: κρίνω 在本段语境中具有判断、审判之意；“施行审判”比单说“判断”更能传达其司法意味，且不补出原文未明说的受审对象。
theological_decisions:
- issue: 寻求荣耀并施行审判者的身份
  choice: 正文称为“有一位”，不明确补作“父”。
  alternative: 有父寻求这荣耀并施行审判。
  rationale: 上下文通常使人理解这位是父，但希腊文本在本节没有明说其身份；保留不具名的表达，可避免把语境推断写成原文明文。
- issue: ζητῶν 的隐含宾语
  choice: 正文补作“这荣耀”，指前句耶稣的荣耀。
  alternative: 直译为“有一位寻求并施行审判”。
  rationale: 希腊文省略了 ζητῶν 的宾语，语法上从前句承接“我的荣耀”；中文补出指示语可避免“寻求”显得悬空，脚注则保留原文形式上的含蓄。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“有一位”保留原文未点明身份的克制；两个脚注标记均置于正文相关句末。
