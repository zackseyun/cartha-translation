  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: zh_hans
  text: 你们是按肉体判断人的[a]；我却不判断任何人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按人的标准”，或“按外表”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确译出第二人称复数；汉语借助与后半句“我”的对照，自然体现原文的强调。
- source_word: κατὰ τὴν σάρκα
  choice: 按着肉体
  rationale: 保留约翰用语的源语言质感与含义张力，不把它限缩为“按人的标准”或“按外貌”。
- source_word: κρίνετε
  choice: 判断人
  rationale: κρίνω在此指对人作判断；补出宾语“人”使现代汉语自然，并与后句“任何人”形成清楚对应。
- source_word: ἐγὼ
  choice: 我
  rationale: 明确译出第一人称代词，与“你们”构成原文鲜明的对照。
- source_word: οὐ κρίνω οὐδένα
  choice: 我不判断任何人
  rationale: 直接保留否定的范围和原句的简洁力度，不预先调和其与本章其他审判表述之间的张力。
theological_decisions:
- issue: κατὰ τὴν σάρκα中σάρξ的含义
  choice: 正文译作“按着肉体”
  alternative: “按人的标准”或“按外貌”
  rationale: 此处很可能指按纯属人的、世俗的或表面的尺度判断，但直译能保留措辞及神学张力；较解释性的读法列入脚注。
- issue: “我不判断任何人”的绝对表述
  choice: 保留原文的直接否定
  alternative: 解释为“我现在不定任何人的罪”或“我不像你们那样判断人”
  rationale: 原句本身简短而绝对；不在正文中加入时间、方式或定罪等原文未明说的限定，以保留其与约翰福音其他相关经文之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着肉体”略带经文语体，但能保留原文关键术语；脚注提供自然的语义替代。
