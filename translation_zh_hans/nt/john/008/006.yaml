  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: zh_hans
  text: 他们[a]说这话，是要试探他，好有把柄控告他。耶稣却弯下身去，用指头在地上写字，并不理会他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节属于行淫时被捉的妇人的故事（约翰福音7:53—8:11）的延续。参见约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: 试探
  rationale: 此处指他们怀着敌意考验耶稣，企图使他陷入两难；“试探”既保留该词的考验意味，也能传达其恶意。
- source_word: κατηγορίαν
  choice: 控告
  rationale: 该词表示针对某人的指控；结合 κατ' αὐτοῦ，译为“控告他”自然，并保留法律语境。
- source_word: κάτω κύψας
  choice: 弯下身去
  rationale: 准确表达耶稣俯身向下的动作，符合现代汉语叙事习惯。
- source_word: ἔγραφεν
  choice: 写字
  rationale: 希腊文未说明所写内容；译作“写字”保留这一未确定性，也反映未完成时所描写的持续动作。
- source_word: μὴ προσποιούμενος
  choice: 并不理会他们
  rationale: 拜占庭文本所含短语表示装作没有注意或不予理会；此译自然传达耶稣对他们当时举动的有意不回应，而不限定为“没有听见”。
theological_decisions:
- issue: 耶稣在地上所写的内容
  choice: 不作说明，仅译“写字”
  alternative: 推断他写的是律法、控告者的罪或某些名字
  rationale: 原文没有交代所写内容，不应把后世解释写入正文。
- issue: μὴ προσποιούμενος 的理解
  choice: 译作“并不理会他们”
  alternative: 译作“仿佛没有听见”
  rationale: 原文并未明确把不理会限于听觉；较宽泛的译法保留语义范围，也避免断言耶稣实际没有听见。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“好有把柄控告他”自然表达目的从句及设套控告的语境；“把柄”并非另添具体罪名，而是表示可供控告的根据。脚注标记置于主语之后，与故事段落的文本鉴别说明对应。
