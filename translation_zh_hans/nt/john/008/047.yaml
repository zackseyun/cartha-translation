  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: zh_hans
  text: 出于神的人听神的话。你们之所以不听，是因为[a]你们不是出于神[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”所译的希腊语连词也可作内容连词，译作“即”或引出“……这一点”；于是后半句也可理解为：“你们不听‘你们不是出于神’这一点。”不过按原因理解更符合上下文。
    reason: alternative_reading
  - marker: b
    text: “出于神”也可译作“属于神”；原文介词主要强调来源或根源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὢν
  choice: 出于神的人
  rationale: 定冠词加现在分词构成实体性表达，指具有这一特征的人；中文用“……的人”自然地保留其代表性单数含义。
- source_word: ἐκ τοῦ θεοῦ
  choice: 出于神
  rationale: ἐκ在这里侧重来源或根源。“出于神”既符合现代中文表达，也保留约翰文本中的来源性对比，不将其简化为所有权或归属关系。
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: 神的话
  rationale: ῥήματα指神所说的话语。中文“神的话”简洁自然，并能表达复数话语的集合意义。
- source_word: ἀκούει / ἀκούετε
  choice: 听 / 不听
  rationale: 保留原文同一动词的重复。语境中的“听”可能包含接受、听从之意，但正文不把这一含义直接解释成“顺从”。
- source_word: διὰ τοῦτο
  choice: 之所以……是因为
  rationale: 这一中文结构自然地表达原文“因此/为此缘故”与随后原因从句之间的逻辑关系。
- source_word: ὅτι
  choice: 因为
  rationale: 按因果连词理解最符合上下文：他们不听，是因为他们不是出于神；同时在脚注中保留其可作内容连词“即/ that”理解的可能。
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: 你们不是出于神
  rationale: 再次保留ἐκ所表达的来源或根源，并维持与前半句“出于神的人”的对应。
theological_decisions:
- issue: “出于神”的神学含义
  choice: 保留来源性表述“出于神”
  alternative: 属于神；由神所生；蒙神拣选
  rationale: 原文强调来源或根源，但没有在本节中将其明确限定为某一后来的系统神学范畴；直译可保留约翰文本中的神学张力。
- issue: ἀκούω在本节中的语力
  choice: 译作“听”
  alternative: 听从；顺服；接受
  rationale: 语境中的真实聆听可能包含接受和回应，但原词首先是“听”。保留“听”既再现前后重复，也避免把语用含义直接写进正文。
- issue: ὅτι的句法功能
  choice: 按原因解作“因为”
  alternative: 按内容连词解作“即/……这一点”
  rationale: 因果解读使论证最为连贯，也符合常见用法；但原词本身存在内容连词的句法可能，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“听”的重复和“出于神”的来源性用语；以“之所以……是因为……”自然呈现希腊文的因果关系，不加入特定宗派的教义解释。
