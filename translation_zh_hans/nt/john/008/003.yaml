lexical_decisions:
- source_word: Ἄγουσιν
  choice: 带来
  rationale: 原文用历史现在时，现代汉语叙事可自然译作“带来”；既表达把人领到耶稣面前，也避免“押来”所增添的强制色彩。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指研习并讲授律法的专业人士；“经学家”在现代汉语中比“文士”更清楚，同时保留其宗教与律法身份。
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: 通奸时被抓住的
  rationale: κατειλημμένην为完成时被动分词，结合ἐν μοιχείᾳ表示她是在通奸情形中被抓获；此译法自然且不额外断定后续审判结果。
- source_word: στήσαντες αὐτὴν ἐν μέσῳ
  choice: 让她站在众人中间
  rationale: στήσαντες表示使她站立或把她置于某处，ἐν μέσῳ指在场人群当中；补出“众人”符合汉语表达，也与叙事情境一致。
