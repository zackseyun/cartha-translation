  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a slave of sin.”
translation:
  language: zh_hans
  text: 耶稣回答他们：“我实实在在地告诉你们，凡犯罪[a]的，都是罪的奴隶[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凡惯于犯罪的”。希腊语这里用现在时分词，可带有持续或特征性的意味；较直译可作“凡行罪的”。
    reason: lexical_alternative
  - marker: b
    text: 或译“仆人”。希腊语 δοῦλος 可指仆人或奴隶；这里译作“奴隶”，是因为上下文着重表达受罪辖制、不得自由。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣回答他们
  rationale: 按希腊语叙事语序的意义自然转为现代汉语语序；“回答”保留对话中的回应意味。
- source_word: Ἀμὴν ἀμὴν
  choice: 实实在在
  rationale: 保留约翰福音中双重 ἀμήν 的重复和郑重语气，同时采用现代中文读者熟悉、自然庄重的表达。
- source_word: λέγω ὑμῖν
  choice: 我……告诉你们
  rationale: “告诉你们”在现代汉语中比直译“对你们说”更自然，也恰当地传达郑重宣告的语气。
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: 凡犯罪的
  rationale: “凡……的”准确表达带冠词分词结构的概括性；“犯罪”保留“行罪”的基本意义，而不把现在分词可能具有的持续或惯常意味绝对化。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 此处比“仆人”更鲜明地表达受辖制、失去自由的状态，与上下文关于自由和奴役的对比相符。
- source_word: τῆς ἁμαρτίας
  choice: 罪的
  rationale: 以所属结构直接表达属罪、受罪支配的关系，并保留原文“罪的奴隶”这一比喻。
theological_decisions:
- issue: 现在分词 ποιῶν 所表达的犯罪性质
  choice: 正文译作“凡犯罪的”，脚注说明可理解为持续或惯常地犯罪。
  alternative: 凡惯于犯罪的／凡一直犯罪的
  rationale: 现在时分词在此可带有持续或特征性的意味，但仅凭时态体不宜把“惯常”或“一直”写死在正文中；简洁译法保留概括性和一定歧义。
- issue: δοῦλος 的奴役比喻
  choice: 译作“奴隶”
  alternative: 仆人
  rationale: 耶稣此处论及罪对人的辖制，并与上下文的“自由”形成对照；“奴隶”更充分保留比喻的力度，但脚注列出较弱的词义可能。
translation_notes:
  register: 采用现代、庄重而通顺的中文。“我实实在在地告诉你们”保留约翰福音郑重宣告的固定语感；“凡犯罪的，都是罪的奴隶”简洁有力，并借脚注交代现在分词的语义范围及 δοῦλος 的可选译法。
