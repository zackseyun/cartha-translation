  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: zh_hans
  text: 难道你比我们的祖先亚伯拉罕更大吗？[a]他死了，众先知也死了。你把自己当成谁了？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文问句预期否定回答，也可译作：“你不会比我们的祖先亚伯拉罕更大吧？”
    reason: lexical_alternative
  - marker: b
    text: 直译近于“你把自己作成谁？”意思是“你自认为是谁？”或“你声称自己是谁？”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: 难道你……吗
  rationale: μή引出的问句预期否定回答；“难道……吗”自然保留了这种强烈的反问和质疑语气。
- source_word: μείζων
  choice: 还大
  rationale: 保留比较级在身份、地位和重要性上的宽泛含义，不擅自限定为“更重要”或“更尊贵”。
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: 比我们的祖宗亚伯拉罕
  rationale: 比较级后的属格用“比”表达；“祖宗”在此自然表达亚伯拉罕作为共同先祖的身份和尊称。
- source_word: ὅστις ἀπέθανεν
  choice: 他死了
  rationale: 直接陈述亚伯拉罕死亡这一历史事实，符合不定过去时的语义。
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: 众先知也死了
  rationale: καί表示追加并列的论据；“也”清楚呈现亚伯拉罕与众先知同样死亡的对照。
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: 你把自己当成谁了
  rationale: 这是带有指责意味的习语，质问对方自居何等身份；此译法现代、自然，同时保留其攻击性语气。
theological_decisions:
- issue: 耶稣是否比亚伯拉罕和众先知更大的身份挑战
  choice: 用“难道……吗”呈现说话者预期否定回答的敌意反问
  alternative: 较中性的“你比我们的祖宗亚伯拉罕还大吗？”
  rationale: 希腊文μή表明说话者预期答案为“不”，经文是在挑战耶稣所暗示的身份与权柄；译文保留这一神学张力，而不在措辞中替说话者或读者作出教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖宗”保留共同先祖及尊称意味；“把自己当成谁了”符合当代汉语的质问语气，但不过度口语化。标点将亚伯拉罕和众先知的死亡作为连续论据呈现。
