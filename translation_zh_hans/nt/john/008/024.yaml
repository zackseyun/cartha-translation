  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: zh_hans
  text: 所以我对你们说，你们必死在自己的罪中；因为你们若不信“我是”[a]，就必死在自己的罪中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直作“我是”，后面没有明说表语；也可按上下文理解为“我就是那一位”。这一措辞在《约翰福音》中可能带有更深的回响。
    reason: 保留原文无显式表语的形式，并说明语境化译法及其可能的约翰式回响。
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: 所以我对你们说
  rationale: οὖν承接上文并表示推论，用“所以”自然呈现；εἶπον与间接宾语ὑμῖν译为“我对你们说”，忠实且符合现代汉语表达。
- source_word: ἀποθανεῖσθε
  choice: 你们必死
  rationale: 该动词为将来时，直指死亡；“必死”既表达将来结果，也体现语境中的确定性，不额外引入“灭亡”等解释。
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: 死在自己的罪中
  rationale: ἐν表示处于罪的状态或范围之内。汉语以“死在……中”表达此意；“自己的罪”明确对应ὑμῶν，并避免误解为别人的罪。希腊文虽为复数，但现代汉语“罪”可作集合概念，无须生硬量化。
- source_word: ἐὰν γὰρ μὴ
  choice: 因为你们若不
  rationale: “因为”保留γάρ对前句的解释作用，“若不”准确表达ἐὰν μή所引出的否定条件。
- source_word: πιστεύσητε
  choice: 信
  rationale: πιστεύω在约翰福音中兼有相信、信赖之意；“信”是简洁、常用且能容纳两层意味的汉语对应词。
- source_word: ὅτι ἐγώ εἰμι
  choice: 信我就是那一位[a]
  rationale: 希腊文在ἐγώ εἰμι之后没有明说表语。主文用“就是那一位”使现代汉语通顺，同时以脚注保留更贴近形式的“我是”及其可能具有的更深回响，避免在正文中把身份进一步具体化。
theological_decisions:
- issue: 如何翻译没有明说表语的约翰式表达ἐγώ εἰμι
  choice: 我就是那一位[a]
  alternative: 我是
  rationale: “我就是那一位”可按语境理解为身份自指，又不说明具体表语；脚注则保留原文形式上的开放性，并指出该措辞在约翰福音中可能具有更深回响。这样既保证汉语可读性，也不把神学张力静默地消解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以……因为……”清楚呈现原文的推论与理由关系；分号使重复的警告保持力度。正文中的脚注标记与脚注完全对应。
