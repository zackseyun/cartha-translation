  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: zh_hans
  text: '[a]在我们的律法中，摩西吩咐要用石头打死这样的女人。那么，你怎么说？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节属于行淫时被抓的女人这一段叙事（约翰福音7:53—8:11）的续文。参看约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: 在我们的律法中
  rationale: 自然表达介词短语的范围；δέ在此承接并略带对照，中文不必机械译出，可由上下文和后句“那么”体现话语推进。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 表达摩西以权威颁下命令；“吩咐”庄重且符合现代汉语经文语体。
- source_word: τὰς τοιαύτας
  choice: 这样的女人
  rationale: 冠词与指示性质形容词均为阴性复数宾格，语境所指是这一类女人；译文明示阴性所指，同时不额外补入原文此处未重复的罪名。
- source_word: λιθοβολεῖσθαι
  choice: 要用石头打死
  rationale: 该被动不定式指以投石执行死刑；此译比单说“用石头打”更清楚传达刑罚的致死性质，也符合现代汉语习惯。
- source_word: σὺ οὖν τί λέγεις
  choice: 那么，你怎么说？
  rationale: οὖν引出基于前述律法要求的问题；保留σὺ的显著人称焦点，用“你”直接向耶稣发问。
theological_decisions:
- issue: 摩西律法所规定刑罚的表述范围
  choice: 按本句说话者的概述译作“摩西吩咐要用石头打死这样的女人”
  alternative: 补充奸夫也应受刑，或说明相关律法条文的具体适用条件
  rationale: 译文应忠实保留说话者在本节中的措辞，不把其他律法经文的内容或解释直接加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“用石头打死”清楚表达处决含义；“那么，你怎么说？”自然保留质问语气。脚注标记置于正文开头，对应整段经文的文本鉴别说明。
