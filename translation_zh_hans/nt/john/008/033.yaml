  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: zh_hans
  text: 他们回答他：“我们是亚伯拉罕的后裔[a]，从来没有作过任何人的奴隶[b]。你怎么说‘你们将成为自由人[c]’呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚伯拉罕的种子”，使用集合单数来表示血统和后代。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从来没有服侍过任何人。”这里的动词也可指服侍，但在本段自由与奴役的对比中，“作奴隶”的含义更为突出。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们将得自由。”原文较直译为“你们将变得自由”，强调状态的转变。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: 他们回答他说
  rationale: 按现代汉语自然表达直接回应耶稣的意思，同时保留回答所指向的对象。
- source_word: Σπέρμα Ἀβραάμ
  choice: 亚伯拉罕的后裔
  rationale: σπέρμα在此是表示血统的集合单数；“后裔”在现代汉语中自然、庄重，也不额外引入其他神学含义。
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: 从来没有作过任何人的奴隶
  rationale: “从来没有”自然表达πώποτε与否定词的合力；“作过……的奴隶”突出δουλεύω在自由与奴役对比中的受奴役含义，并适当体现完成时所指的既往经历。
- source_word: πῶς σὺ λέγεις
  choice: 你怎么说……呢
  rationale: 以自然汉语传达带有质疑和不解意味的问句，并借明确的“你”体现原文σὺ的强调。
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: 你们将成为自由人
  rationale: “成为”保留γενήσεσθε所表达的状态转变，“自由人”清楚对应ἐλεύθεροι，并与前句的奴隶身份形成鲜明对照。
theological_decisions:
- issue: 在自由与奴役的语境中如何翻译δουλεύω
  choice: 作过任何人的奴隶
  alternative: 服侍过任何人
  rationale: 下文继续讨论奴隶与自由（约8:34–36），因此采用明确的奴役用语，更能保留社会层面与神学层面的张力；脚注仍说明较宽的词义可能。
- issue: 如何表达Σπέρμα Ἀβραάμ所指的血统
  choice: 亚伯拉罕的后裔
  alternative: 亚伯拉罕的种子
  rationale: 这里是说话者对肉身血统的宣称。“后裔”准确而自然，不把本节预先套入其他经文中“种子”可能具有的特殊神学用法。
- issue: 如何处理γενήσεσθε的状态转变含义
  choice: 将成为自由人
  alternative: 将得自由
  rationale: “成为”保留γίνομαι的转变意味，也保留说话者质疑自己目前并不自由这一隐含前提所造成的张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事与对话语体。“作过任何人的奴隶”比书面色彩较重的“受制于任何人”更具体，也与后文的奴隶—自由对照一致；引语层级使用中文双引号和单引号。
