  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: zh_hans
  text: 再者，在你们的律法中也写着：“两个人的见证是真的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是有效的。”在这里，“真的”带有法律上成立、可采信的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: 再者……也
  rationale: 既承接上文，又保留轻微的强调语气；现代汉语中自然庄重。
- source_word: νόμῳ
  choice: 律法
  rationale: 这里指耶稣所援引的犹太法律及经文传统；“律法”保留其经文与法律双重色彩。
- source_word: ὑμετέρῳ
  choice: 你们的
  rationale: 直接保留第二人称所有格及其修辞距离，不强化为“你们自己的”。
- source_word: γέγραπται
  choice: 写着
  rationale: 符合汉语引用经文的惯用表达，也传达完成时所含的现今持续有效之意。
- source_word: δύο ἀνθρώπων
  choice: 两个人
  rationale: ἄνθρωπος在此指人类见证人；“两个人”既贴近原文，又不会把常规法律用语误限为成年男性。
- source_word: μαρτυρία
  choice: 见证
  rationale: 保留约翰福音中反复出现的见证主题，同时适合本节的司法语境。
- source_word: ἀληθής
  choice: 真的
  rationale: 直接保留“真实”的基本词义，而不在正文中把司法含义明确化为“有效”。
theological_decisions:
- issue: “你们的律法”的修辞作用
  choice: 保留“你们的律法”
  alternative: “律法”或“你们自己的律法”
  rationale: 原文明确有第二人称所有格。这样既保留耶稣对听众说话时的修辞张力，也不暗示他否定律法本身。
- issue: 法律格言中ἀνθρώπων的所指
  choice: 译作“两个人”
  alternative: “两个男人”或“两位见证人”
  rationale: 原词是泛指“人”的常用词，语境虽涉及法律见证，却没有使用“见证人”一词；“两个人”最能兼顾词义和语境，不额外限定性别或身份。
- issue: ἀληθής的司法含义
  choice: 正文译“真的”
  alternative: “有效的”或“可信的”
  rationale: 原文使用“真实”一词，在司法语境中可蕴含成立、有效之意；正文保留这一张力，脚注说明可能的语境译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在……律法上写着”保留经文引用语感；“再者……也”使连接关系自然。“两个人”避免将原文泛指人的表达不必要地男性化。
