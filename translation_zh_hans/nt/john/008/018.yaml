  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: zh_hans
  text: 我就是那为自己作见证的；那差我来的父也为我作见证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就是那为关于自己作见证的；那差我来的父也为关于我作见证。”
    reason: 保留περί加属格可译为“关于、论到”的形式对应；正文的“为……作见证”更合现代汉语表达。
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: 我……作见证
  rationale: 带冠词的现在分词 ὁ μαρτυρῶν 作名词性成分，与 ἐγώ εἰμι 构成“我是那作见证的”之意。汉语直接译为“我……作见证”更自然，同时保留现在时态所表达的持续性陈述及见证语义。
- source_word: περὶ ἐμαυτοῦ
  choice: 为自己
  rationale: περί 加属格基本义为“关于、论到”；在本段司法式见证语境中，汉语“为自己作见证”自然且不会把“代表自己辩护”等更强含义写入正文。脚注保留“关于自己”的形式对应译法。
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: 为我作见证
  rationale: 重复使用“作见证”对应 μαρτυρέω，以保留两分句之间的关键词呼应及法律证言色彩；“为我”是自然现代汉语，脚注提示 περί 的“关于”义。
- source_word: ὁ πέμψας με πατήρ
  choice: 差我来的父
  rationale: 带冠词的简单过去时分词 πέμψας 修饰 πατήρ，直译为“差我来的父”。不增添原文没有明说的“我的”或“上帝”。
theological_decisions:
- issue: 约翰语境中“父”的所指
  choice: 译作“差我来的父”
  alternative: 差我来的我的父；差我来的父上帝
  rationale: 原文为 ὁ πέμψας με πατήρ，只称“父”，并以“差我来的”限定。译文保留其关系性和神学陈述，不作教义性扩充。
- issue: 见证用语的司法色彩
  choice: 两处统一译作“作见证”
  alternative: 证明；作证
  rationale: “作见证”既保留约翰福音反复出现的见证主题，也适合本段关于见证有效性的准司法语境；统一措辞呈现原文词根重复。
- issue: περί 加属格的关系含义
  choice: 正文采用自然汉语“为自己／为我”，脚注列出“关于自己／关于我”
  alternative: 正文完全译作“关于自己／关于我”
  rationale: “为……作见证”在现代汉语中更自然，但 περί 的基本关系含义可理解为“关于、论到”，故以脚注保存这一真切的词义角度，避免将其完全限定为代言或辩护。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“差我来的父”沿用汉语圣经语体中清楚易懂的关系从句；“作见证”比单用“证明”更能维持约翰福音的关键词网络。脚注标记 [a] 已置于相关短语之后。
