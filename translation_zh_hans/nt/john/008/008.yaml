lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 直接表达动作再次发生，承接上一节，符合现代汉语叙事习惯。
- source_word: κάτω κύψας
  choice: 弯下身去
  rationale: κάτω与κύψας合用，描写身体向下俯屈；“弯下身去”自然清楚，又保留动作方向。
- source_word: ἔγραφεν
  choice: 写字
  rationale: 未完成时可表示正在进行或持续的动作；汉语“在地上写字”在语境中自然呈现这一过程，无须额外加入“继续”等原文未明说的含义。
- source_word: εἰς τὴν γῆν
  choice: 在地上
  rationale: 此处γῆ指眼前的地面；介词短语按自然汉语表达为“在地上”，而非较生硬的“向地里”。
