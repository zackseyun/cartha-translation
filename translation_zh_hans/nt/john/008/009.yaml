- from: 那些人[a]听见后，又受到良心的责备，就从年长的开始，一个接一个地出去，直到最后一个。只剩下耶稣，那妇人仍站在当中。
  to: 那些人[a]听见后，受良心责备，就一个一个地出去，从年长的起，直到最后的。只剩下耶稣，妇人站在当中。
  rationale: 仅作低风险的中文措辞与数的调整，以更自然准确地呈现离去次序；保留原文中“耶稣独自被留下”而妇人仍在场的叙述张力，且不把“最后的”解释为“最年轻的”。
