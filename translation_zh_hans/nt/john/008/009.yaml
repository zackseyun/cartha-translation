    rationale: 希腊文意为离去的次序“从年长者起”；中文以“从年长的起”更简洁自然。
  - severity: low
    issue: “最后一个”将原文τῶν ἐσχάτων的复数表述单数化。
    rationale: 虽不实质改变事件，但“最后的”更保留原文的开放性，不暗示特定的一位最后离开者。
