  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: zh_hans
  text: 那些人[a]听见后，受良心责备，就一个一个地出去，从年长的起，直到最后的。只剩下耶稣，妇人站在当中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节属于约翰福音7:53—8:11的延续。参约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: 良心
  rationale: 指辨别是非并在内心作出道德判断的意识；“良心”是现代汉语中自然、准确的对应词。
- source_word: ἐλέγχω
  choice: 责备
  rationale: 被动分词在此表示他们的良心使其认识到自身有罪；“受到良心的责备”既保留原文的被动表达，也避免过度解释其具体心理过程。
- source_word: πρεσβύτερος
  choice: 年长的
  rationale: 这里与退出次序相连，更可能按年龄或资历描述人群，而不是指正式职分上的“长老”。
- source_word: εἷς καθ' εἷς
  choice: 一个接一个地
  rationale: 自然表达逐一离开的动作和次序。
- source_word: ἕως τῶν ἐσχάτων
  choice: 直到最后一个
  rationale: 保留ἕως所表达的范围终点；“最后一个”不擅自将其具体化为“最年轻的”。
- source_word: ἐν μέσῳ ἑστῶσα
  choice: 仍站在当中
  rationale: 分词完成时体现站立状态的持续；“当中”承接场景位置，不额外说明她站在谁的中间。
theological_decisions:
- issue: μόνος与妇人同时在场的表面张力
  choice: 只剩下耶稣，那妇人仍站在当中
  alternative: 只剩下耶稣和那站在当中的妇人
  rationale: 原文先说耶稣“独自/单独”留下，随后又提妇人仍在场。“只剩下耶稣”保留叙述重心和一定张力，不将μόνος改释为“他们两人”。
- issue: 退出者受责备的原因
  choice: 受到良心的责备
  alternative: 自觉有罪
  rationale: 原文明确说他们受良心责备，却未直接使用“认罪”或“自觉有罪”等措辞；译文避免把隐含结论写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“年长的”“一个接一个地”“直到最后一个”清楚呈现原文次序；不把“最后一个”解释为“最年轻的”，也不把“年长的”职分化为“长老”。
