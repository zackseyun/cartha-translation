review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现了听见、受良心责备、逐一离去、从年长者到最后者，以及耶稣被留下与妇人站在当中的叙述。将“从年长的开始”调整为“从年长的起”，可更准确自然地表达ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων；将“直到最后一个”调整为“直到最后的”，避免在中文中无必要地单数化原文复数形容词。
  naturalness: 原译文通顺，但“从年长的开始”略显口语性且搭配不够凝练。“一个一个地出去，从年长的起，直到最后的”更符合现代庄重叙事汉语，也清楚表达离去的次序。
  terminology: “良心”适切对应συνείδησις；“受良心责备”保留ἐλεγχόμενοι的被动及道德责难含义，未将其扩展为明确认罪。“年长的”不职分化为“长老”，合乎此处与“最后的”的次序对比。
  issues:
