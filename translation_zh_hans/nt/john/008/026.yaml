revisions:
- from: 关于你们，我有许多话要说，也有许多事要判断[a]。但差我来的那位是真实的；我从他那里听见什么，就把这些话讲给世人听[b]。
  to: 关于你们，我有许多话要说，也有许多事要判断[a]。但差我来的那位是真实的；我把从他那里听见的这些事讲给世界听[b]。
  rationale: 修订第二句以“从他那里听见的这些事”准确呈现关系从句与ταῦτα的回指，避免“什么……就……”造成的条件性理解；将“这些话”改为“这些事”，并将“世人”改为“世界”，以保留原文的中性内容指称及κόσμος的术语对应。其余译法维持原稿对语义范围和含蓄称谓的谨慎处理。
