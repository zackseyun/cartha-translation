  - severity: low
    issue: 正文以“世人”替代κόσμος。
    rationale: 在言说对象的语境中“世人”可表达受众，但“世界”更直接保留原词及其约翰文献的术语连贯性。
  - severity: low
    issue: “这些话”略微限缩ταῦτα所指。
    rationale: ταῦτα为中性复数“这些事／这些内容”，虽与说话行为有关，却不必仅指“话”。
