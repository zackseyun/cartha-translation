id: JHN.8.26
reference: John 8:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: zh_hans
  text: 关于你们，我有许多话要说，也有许多事要判断[a]。但差我来的那位是真实的；我把从他那里听见的这些事讲给世界听[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关于你们”也可译作“论到你们”；“判断”也可按较强的司法语气译作“审判”。
    reason: 保留περὶ ὑμῶν及κρίνειν的词义范围。
  - marker: b
    text: 或译：“我从他那里听见的，我把这些事讲给世界听。”原文在“我从他那里听见的”之后明确用“这些事”回指并强调其内容。
    reason: 保留ταῦτα对前面关系从句的显明回指和强调，并保留εἰς τὸν κόσμον的“向世界”表达。
lexical_decisions:
- source_word: πολλὰ
  choice: 许多话／许多事
  rationale: 中性复数形容词作名词用，表示“许多事情”。结合两个并列不定式，分别译作“许多话要说”和“许多事要判断”，使现代汉语自然，同时保留内容的复数和广度。
- source_word: περὶ ὑμῶν
  choice: 关于你们
  rationale: περί加属格表示论及的对象或主题；“关于你们”准确、自然，不预先限定为不利的控告。
- source_word: λαλεῖν
  choice: 要说
  rationale: 首处λαλέω与κρίνειν并列；译作“要说”符合汉语搭配，也保留言说之意。
- source_word: κρίνειν
  choice: 要判断
  rationale: κρίνω语义可涵盖判断、审断，乃至在某些语境中的定罪；此处采用较宽泛的“判断”，不将含义缩窄为“定罪”。
- source_word: ὁ πέμψας με
  choice: 差我来的那位
  rationale: 保留原文名词化分词结构，不在正文中补出“父”，同时以自然汉语表达其人格性指称。
- source_word: ἀληθής
  choice: 真实的
  rationale: 保留ἀληθής在约翰著作中“真实、确实、可信”的语义张力；“真实的”不单限于说话诚实。
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: 我从他那里听见什么
  rationale: 准确表达信息来自差遣者，并保留关系从句的内容性结构。
- source_word: ταῦτα
  choice: 这些话
  rationale: 原文用指示代词回指前面的关系从句并加以强调；正文明确保留回指，以“这些话”适应言说语境。
- source_word: λαλῶ
  choice: 讲给……听
  rationale: 现在时表示耶稣正在持续公开宣讲；“讲给世人听”自然表达向听众发言的方向。
- source_word: εἰς τὸν κόσμον
  choice: 给世人听
  rationale: εἰς在言说动词后表示话语所朝向的对象；κόσμος在此可指世界或世上的人，正文采用符合汉语表达的“世人”，脚注保留“向世界宣讲”的形式对应。
theological_decisions:
- issue: “差我来的那位”的所指
  choice: 正文保留含蓄称谓，不直接补作“父”。
  alternative: 差我来的父
  rationale: 上下文表明所指是父，但本节希腊文并未明说“父”；保留原文表达可避免把语境信息写入正文。
- issue: κρίνειν的语力
  choice: 判断
  alternative: 定罪／审判
  rationale: 该词可有司法意味，但本句本身不要求采用较窄的“定罪”；“判断”保留语义范围及神学张力。
- issue: ἀληθής的含义
  choice: 真实的
  alternative: 诚实的／可信的
  rationale: “真实的”既可涉及所言真实，也可涉及本质上的真实可靠，较能保留约翰语境中的多重回响。
- issue: κόσμος的指向
  choice: 世人
  alternative: 世界
  rationale: 作为言说所朝向的对象，κόσμος在此自然指世界中的人类听众；脚注提供更贴近形式的译法，以免抹去约翰著作中“世界”一词的主题性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现转折后的紧密逻辑；避免古雅的“论断尔等”一类措辞。正文保留原文“这些”所形成的强调，同时用“这些话”使汉语顺畅。
