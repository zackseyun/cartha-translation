  source_fidelity: 原文的主要意思已大致译出：耶稣有许多事可就听众而言说并判断，差遣者真实，并且他将从那位所听见的内容向世界说出。然而“我从他那里听见什么，就……”在现代汉语中容易读成不定疑问或条件关系，未能稳妥呈现希腊文关系从句“我从他那里听见的”及其后由ταῦτα作出的明确回指。正文的“世人”也使κόσμος这一约翰文献中的重要用词不如“世界”清楚可见。
  naturalness: 前半句庄重自然。“我从他那里听见什么，就把这些话讲给世人听”虽可理解，但“什么……就……”带有汉语条件句色彩；改用定语结构和“这些事”的同位回指，会更自然且更贴合原文。
  terminology: “差我来的那位”“真实的”“判断”均可接受，并恰当保留了原文没有明说“父”、κρίνειν不必限缩为“定罪”、以及ἀληθής的宽广含义。“世界”宜保留为κόσμος的正文对应词；“这些事”比“这些话”更不预先把中性复数内容限定为言语本身。
