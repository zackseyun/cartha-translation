source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: zh_hans
  text: 所以，耶稣说：“你们把人子举起来[a]的时候，就会知道我就是[b]，也会知道我不凭自己做任何事；我所说的这些话，是照着父所教导我的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举起来”既可指身体被举起，也可含“被高举、得荣耀”的意思；在约翰福音中，这两个含义可能同时存在。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“我是”。希腊原文只有ἐγώ εἰμι（“我是”），没有明说表语。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文的对话并带出耶稣的回应；“于是”自然保留了推展和承接作用。
- source_word: Ὅταν ὑψώσητε
  choice: 你们把……举起来的时候
  rationale: ὅταν与虚拟式指向将来的事件；“举起来”既可指身体被举起，也可含被高举、得荣耀之意，保留约翰福音中的双重含义。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号在现代汉语圣经语境中的通行译法，并保留其福音书及但以理书背景。
- source_word: τότε γνώσεσθε
  choice: 就会知道
  rationale: 表达在所指事件发生后产生的认识或领悟；“就会知道”简洁自然，并与前面的时间从句呼应。
- source_word: ἐγώ εἰμι
  choice: 我就是
  rationale: 原文没有明说表语。“我就是”在现代汉语中可保持话语的强调性和未尽说明的意味，避免直接补入特定身份称谓。
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: 我不凭自己做任何事
  rationale: “凭自己”自然表达行为并非出于独立的源头或自主倡议；“任何事”传达οὐδέν的全面否定。
- source_word: ἀλλὰ καθὼς ἐδίδαξέν με ὁ πατὴρ
  choice: 而是父怎样教导我，我就怎样
  rationale: 用汉语对应结构表达καθώς所含的相应关系，并保留与前句“不凭自己”的对照。
- source_word: ταῦτα λαλῶ
  choice: 说这些话
  rationale: 保留ταῦτα所指的具体话语内容；“说这些话”比直译式的“讲说这些事”更符合现代汉语。
theological_decisions:
- issue: ἐγώ εἰμι的绝对式或省略式表达
  choice: 我就是
  alternative: 我就是那一位；我是
  rationale: 希腊文没有明示表语，既可按语境理解为“我就是那一位”，也可能带有更深的自我启示意味。正文不补定具体表语，以保留约翰文本的含混性和神学张力；脚注说明原文形式。
- issue: ὑψόω在约翰语境中的含义
  choice: 举起来
  alternative: 钉十字架；高举
  rationale: 该动词可同时唤起耶稣身体被举起以及被高举、得荣耀的含义。译文不把它缩减为单一解释。
- issue: 耶稣“不凭自己做任何事”与父的教导之间的关系
  choice: 保留行为来源与教导相应的表述
  alternative: 解释为能力不足或完全没有能动性
  rationale: 原文强调耶稣的行动和话语不以自己为独立源头，而与父的教导一致；译文不进一步引申其本体论含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子”“父”保留经文中的核心称谓；以“父怎样教导我，我就怎样说这些话”避免生硬欧化句式，同时维持原文的对应关系。脚注标记均放在所解释的词语之后。
