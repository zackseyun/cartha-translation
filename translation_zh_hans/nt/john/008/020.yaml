  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: zh_hans
  text: 耶稣在圣殿[a]的银库处教导时，说了这些话。没有人抓住他，因为他的时刻[b]还没有到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”在这里指整个圣殿建筑群或院区，不只是里面的圣所。
    reason: lexical_alternative
  - marker: b
    text: 在《约翰福音》中，“他的时刻”指耶稣受难并得荣耀的时刻；也可译作“他的时候”。
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: 这些话
  rationale: ῥήματα在这里指刚才所说的话；“这些话”自然、清楚，也不对前文内容作额外解释。
- source_word: ἐλάλησεν
  choice: 说了
  rationale: λαλέω表示说话或发言；与“这些话”搭配时，“说了”符合现代汉语叙事习惯。
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: 在……银库那里
  rationale: γαζοφυλάκιον可指圣殿存放奉献款项的银库，也可能泛指银库所在的区域；加“那里”保留地点含义，并避免误解为耶稣身处单一箱柜之内。
- source_word: διδάσκων
  choice: 教导时
  rationale: 现在分词表示该行动与“说了”同时发生；“教导时”简洁地表达这种时间关系。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿
  rationale: ἱερόν指整个圣殿建筑群或院区，而不只指内层圣所；正文采用通行的“圣殿”，脚注说明其范围。
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: 没有人抓住他
  rationale: πιάζω含抓住、拘拿之意；“抓住”保留动作的敌意和实际性，又不额外限定为正式司法逮捕。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出无人抓住他的原因；“因为”符合现代汉语逻辑表达。
- source_word: οὔπω ἐληλύθει
  choice: 还没有到
  rationale: 过去完成时表明在当时那个叙事节点，这一时刻尚未来到；汉语用“还没有到”即可自然表达。
- source_word: ἡ ὥρα αὐτοῦ
  choice: 他的时刻
  rationale: ὥρα直指“时刻”，在《约翰福音》中又具有贯穿全书的主题意义；“他的时刻”既保留原文措辞，也避免淡化为一般的“时候”。
theological_decisions:
- issue: 《约翰福音》中“他的时刻”的主题含义
  choice: 正文保留“他的时刻”
  alternative: 他所定的时刻／他的时候
  rationale: 原文没有在此明说是谁指定该时刻，也没有展开其全部内涵。保留这一表达，可维持《约翰福音》中耶稣受难与得荣耀之时尚未来到的主题张力，而不在正文中先行解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“银库那里”提示这可能是圣殿银库所在的区域，而非单指一个奉献箱；保留“他的时刻”这一约翰式表达，并以脚注简要说明其主题意义。
