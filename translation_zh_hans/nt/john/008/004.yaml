  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: zh_hans
  text: 他们[a]对他说：“老师，这个女人正在通奸，被当场抓住了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节接续通奸时被抓的妇人的记载（约翰福音7:53—8:11）。参见约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: 对他说
  rationale: 这是叙事中的历史现在时；现代汉语叙事无需显式标出过去时。“对他说”也自然表达了间接宾语 αὐτῷ。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接称呼语，采用现代普通读者自然易懂且庄重的对应词。
- source_word: κατείληπται
  choice: 被……抓住了
  rationale: 保留完成时被动语态所表达的已发生事件及其当前结果；“了”使汉语表达自然。
- source_word: ἐπαυτοφώρῳ
  choice: 当场
  rationale: 该习语指犯罪行为正在发生时被抓获；“当场”简洁自然，并由后面的“正在通奸时”明确其含义。
- source_word: μοιχευομένη
  choice: 正在通奸时
  rationale: 现在分词描述女人被抓住时正在进行的行为；用“正在……时”保留其进行性和时间关系。
