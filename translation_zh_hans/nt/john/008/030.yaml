  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: zh_hans
  text: 耶稣说这些话的时候，许多人信靠他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指向耶稣前面所说的内容；现代汉语用“这些话”既保留复数和语篇联系，也比直译“这些事”更符合此处言说语境。
- source_word: αὐτοῦ λαλοῦντος
  choice: 他说……的时候
  rationale: 属格独立结构搭配现在时分词，表示与主句同时进行的动作；“他说这些话的时候”自然地表达他们是在他讲话期间相信的。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该形容词在原文中作名词使用；汉语补出“人”是自然表达，并未增加特定身份。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 简单过去时将相信作为一个整体事件来叙述；“信了”简洁自然，也不额外限定这是信心的开始或成熟程度。
- source_word: εἰς αὐτόν
  choice: 他
  rationale: πιστεύω与εἰς连用，在约翰福音中通常表示指向某人的信靠；现代汉语“信了他”可自然承载这一关系性含义，并有别于仅仅“相信他所说的话”。
theological_decisions:
- issue: 如何表达约翰福音中的 πιστεύω εἰς αὐτόν
  choice: 信了他
  alternative: 信靠他；相信了他
  rationale: “信了他”简明地保留信心指向耶稣本人的含义，同时避免用更具解释性的“信靠”来预先界定这种信心的性质。紧接着的上下文会检验这些人的门徒身份，因此不把此处的相信默认为成熟或持久的信心。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“这些话”与前文衔接清楚；全句保留原文在耶稣持续讲话时许多人相信他的时间关系，也不消解后续经文对这份相信所形成的张力。
