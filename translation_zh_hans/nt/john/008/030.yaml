  naturalness: “他说这些话的时候，许多人信了他”句法自然，但“信了他”的宾语搭配容易被理解为接受其陈述，而非对其人的信靠。“耶稣说这些话的时候，许多人信靠他”在现代标准汉语中自然、简洁，也避免孤立引文中“他”的指称不明。
