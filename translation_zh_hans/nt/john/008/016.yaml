  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: zh_hans
  text: 不过，即使我判断[a]，我的判断也是真实的，因为我不是独自一人，而是有我和那位差我来的父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如果我判断”或“如果我作出判断”。希腊文的条件表达可以更形式化地翻译，但结合上下文，此处很可能带有让步意味，所以正文译作“即使我判断”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: 即使我判断
  rationale: ἐὰν与现在时虚拟语气κρίνω表示一种条件性的可能；结合上文，此处很可能带有让步意味。译作“即使我判断”既自然，也不抹去原文的条件色彩。
- source_word: δὲ
  choice: 不过
  rationale: δὲ在此标示与上一节的转折。“不过”符合现代汉语表达，同时保留论述推进中的对照。
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: 我的判断
  rationale: 该结构直接表达“属于我的判断”。“判断”保留κρίσις在本段中的审断及司法语感，比“决定”更贴近原文。
- source_word: ἀληθινή
  choice: 真实的
  rationale: ἀληθινή可指真实、可靠或有效。“真实的”保留约翰著作中“真”的语义呼应，也容纳此处判断可靠、有效的含义。
- source_word: μόνος οὐκ εἰμί
  choice: 我不是独自一位
  rationale: 此译保留“并非单独”的关系性与见证语境；“一位”使其自然衔接下文“我和……父”这两个见证主体。
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: 而是有我和差我来的父
  rationale: 此译保留耶稣与差他来的父共同在场的结构，并将分词πέμψας自然译为限定性短语“差我来的”。原文没有“我的”一词，因此不增译“我父”。
theological_decisions:
- issue: 耶稣的判断与父的见证之间的关系
  choice: 将耶稣判断的真实性归因于他并非独自判断，而是与差他来的父同在。
  alternative: 也可较窄地理解为只是在申述法律意义上的双重见证资格，不进一步涉及更广的神学关系。
  rationale: 原文明说其判断为真，是因为他不是独自一位，而有他和差他来的父。译文保留这一依据，却不把它扩展成经文未明说的后期教义表述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不过”呈现转折；“真实的”保留约翰语境中“真”的神学回响；“差我来的父”避免添加原文没有的物主词。正文脚注标记与脚注完全对应。
