source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: zh_hans
  text: 可是现在，你们却想要杀我这个把从上帝那里听见的真理告诉了你们的人。亚伯拉罕没有做这样的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: 可是现在
  rationale: 既保留 νῦν 的时间对比，也体现 δέ 的转折语气；符合现代汉语表达。
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: 你们却想要杀我
  rationale: ζητέω 接不定式表示有意寻求或企图做某事。“想要杀”自然地表达持续的意图；“却”强化上下文及本句的反差，但不增加“谋杀”等法律或道德限定。
- source_word: ἄνθρωπον
  choice: 我这个……的人
  rationale: 原文明确以 ἄνθρωπος 指耶稣本人。汉语若直译为“一个人”略显生硬；“我这个……的人”保留其真实人性及关系从句的结构，同时表达自然。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 约翰语境中的 ἀλήθεια 指确定而真实的信息或真理；汉语“真理”自然庄重，无须用冠词对应形式。
- source_word: ὑμῖν λελάληκα
  choice: 告诉了你们
  rationale: λαλέω 在此指把真理传达给听众；“告诉”比“说给”自然。“了”表达已经发生且与当前指控相关的言说。
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: 从上帝那里听见的
  rationale: παρά 接属格表示来源；“从上帝那里”准确保留来源关系。“听见”对应 ἤκουσα，不将其弱化为泛指的“领受”。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 原文是 θεός，并非“父”；译作“上帝”保持所指明确而不擅自具体化称号。
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: 亚伯拉罕没有做这样的事
  rationale: τοῦτο 回指试图杀害传讲上帝真理之人的行为。“这样的事”比生硬的“这事”更符合现代汉语，同时不把所指缩窄为未经明说的单一解释。
theological_decisions:
- issue: 耶稣以 ἄνθρωπον 描述自己
  choice: 我这个……的人
  alternative: 我这样一个人；一个人
  rationale: 保留耶稣明确自称为人的含义，又避免用不自然的汉语句式；此译法陈述其人性，却不对其神性作任何削弱或额外说明。
- issue: 耶稣所传信息的来源 παρὰ τοῦ θεοῦ
  choice: 从上帝那里
  alternative: 从父那里
  rationale: 原文明确写 θεός 而不是“父”，因此不以约翰福音其他经文中的常见称谓替换本节措辞。
- issue: τοῦτο 的具体回指范围
  choice: 这样的事
  alternative: 这事；这种行为
  rationale: 原文可概括前述企图杀耶稣的行为，并可能连带其拒绝从上帝而来真理的反差。“这样的事”保留一定指代宽度，不在译文中强行限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是现在……却……”清楚呈现转折；整体保留原文直接责问的力度。未设置脚注，因为本节的词义与句法可在正文中自然表达，且无须以脚注处理重要异文或不可兼顾的歧义。
