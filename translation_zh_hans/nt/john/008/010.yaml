id: JHN.8.10
reference: John 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: zh_hans
  text: 耶稣[a]直起身来，看见只剩下那妇人，就对她说：“妇人，那些控告你的人在哪里？没有人定你的罪吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节属于行淫时被捉的妇人这段记载（约翰福音7:53—8:11）；现存最早的希腊文抄本没有这段记载。参看约翰福音7:53注。
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: 直起身来
  rationale: 承接前文耶稣弯腰在地上写字的姿势，表示他把身体重新直起来；比“站起来”更少限定先前是否跪坐。
- source_word: θεασάμενος
  choice: 看见
  rationale: 如实表达分词所指的视觉察看；结合 μηδένα…πλὴν，译为“看见只剩下”可自然传达现场除妇人外已无人留下。
- source_word: οἱ κατήγοροί σου
  choice: 那些控告你的人
  rationale: 保留 κατήγοροί 的法律性含义，也以“那些”对应 ἐκεῖνοι。
- source_word: κατέκρινεν
  choice: 定你的罪
  rationale: 此处处于带有法律意味的质问场景，指作出有罪判定；“定罪”比泛称“判断”准确，同时不额外指定刑罚是否已经执行。
- source_word: Ἡ γυνή
  choice: 妇人
  rationale: 这是当时可用于直接称呼成年女性的用语，并非贬称；“妇人”保持庄重，也与经文语体相称。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“只剩下那妇人”自然表达“除了妇人以外没有看见任何人”，但不暗示耶稣与妇人是现场绝对仅有的两人；问句保留原文的法律语气。
