  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: zh_hans
  text: 你们却不认识他[a]，我却认识他。如果我说我不认识他[b]，我就会像你们一样成为说谎的人。但我认识他，也遵守他的话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们从未真正认识他。”希腊语动词为完成时形式，可强调他们一直处于不认识他的状态。
    reason: lexical_alternative
  - marker: b
    text: 或译：“即使我说我不认识他。”原文为假设性表达；此处“如果我说”自然呈现其语气。
    reason: lexical_alternative
  - marker: c
    text: “遵守”也可译作“持守”或“谨守”；原词兼有忠实守住并实行的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: 不认识
  rationale: 该动词虽为完成时形式，但这里着重于过去未曾真正认识所造成的持续现状。现代汉语用“不认识”最自然；脚注补明“从未真正认识”的可能表达。
- source_word: οἶδα
  choice: 认识
  rationale: οἶδα虽源于完成时形式，在通用希腊语中按现在状态动词使用，意为“知道、认识”。宾语是具有位格的“他”，译作“认识”比“知道”更自然，也保留关系性的含义。
- source_word: κἂν εἴπω
  choice: 我要是说
  rationale: κἄν加虚拟语气在此引出假设。汉语“我要是说”自然地表达未然假设，不把它强化为严格的反事实条件。
- source_word: ἔσομαι ὅμοιος ὑμῖν ψεύστης
  choice: 就是像你们一样说谎了
  rationale: 直译为“我就会成为像你们一样的说谎者”。为符合现代汉语习惯，正文采用“像你们一样说谎”，同时保留直接责备的力度；“了”表达假设结果。
- source_word: τὸν λόγον αὐτοῦ
  choice: 他的话
  rationale: λόγος在此可指所说的话或所传达的信息。“他的话”保留约翰文本中的“话”这一核心用语及其语义宽度。
- source_word: τηρῶ
  choice: 遵守
  rationale: τηρέω涵盖持守、遵守、看守等意思。在“他的话”这一搭配中，“遵守”是自然现代汉语，也清楚表达忠实实行；脚注保留“持守”的可能译法。
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: 却……倒……但
  rationale: 用“却……倒”呈现前半句中对方与耶稣之间的鲜明对比，并用“但”标出假设性虚假陈述与实际事实之间的转折。
theological_decisions:
- issue: 耶稣认识父与其对立者不认识父之间的对比
  choice: 直接译出耶稣真实认识神并遵守其话语的宣称，不添加解释性神学措辞。
  alternative: 扩写为对耶稣独特神圣儿子身份的明说，或将“认识”弱化为一般了解。
  rationale: 本节本身强调认识与不认识、真实与说谎、遵守神话语之间的尖锐对比。译文应保留这种张力，而不超出原文作教义性扩充。
- issue: 条件句的确定程度
  choice: 译为“我要是说……就是……了”，保留假设及其明确后果。
  alternative: 译为“即使我说”或严格处理为与事实相反的条件句。
  rationale: κἂν εἴπω使用虚拟语气提出假设，但原文没有采用完整的过去反事实结构。中文不宜过度限定其语法类别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们却……我倒……”保留原文面对面的强烈对比；“我要是说”口吻自然但不轻佻。“认识”统一对应本节的ἐγνώκατε与οἶδα，以凸显语义对照。所有脚注标记均已置于正文相应位置。
