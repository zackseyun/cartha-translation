  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: zh_hans
  text: 你们的父亲亚伯拉罕欢欣地盼望看见我的日子[a][b]；他看见了，就欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢欣地要看见我的日子”，或“欢欣，为要看见我的日子”。希腊语的ἵνα从句可以有几种彼此相近的理解。
    reason: lexical_alternative
  - marker: b
    text: “我的日子”可广泛指耶稣作为弥赛亚的日子或其成就；本节没有明确说明具体是哪一事件或时期。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ ὁ πατὴρ ὑμῶν
  choice: 你们的祖先亚伯拉罕
  rationale: πατήρ在此指对话者所尊奉的先祖。现代汉语用“你们的祖先亚伯拉罕”比直译“你们的父亲亚伯拉罕”更自然，也保留其血统与信仰传承关系。
- source_word: ἠγαλλιάσατο
  choice: 欢欣
  rationale: 该词表达强烈、洋溢的喜乐；“欢欣”庄重而自然，并与后面的ἐχάρη有所区别。
- source_word: ἵνα ἴδῃ
  choice: 期待看见
  rationale: ἵνα加虚拟式在这里可有目的或所期待内容的意味。“期待看见”自然传达前瞻性，同时不把句法关系限定得过死。
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: 我的日子
  rationale: 保留原文简洁而富有神学内涵的表达，不擅自明确为降生、受难复活、弥赛亚时代或末后的显现。
- source_word: καὶ εἶδεν
  choice: 他看见了
  rationale: 汉语可从上文自然补足所见对象，无须重复“我的日子”。
- source_word: καὶ ἐχάρη
  choice: 就很喜乐
  rationale: χαίρω表示喜乐。“很喜乐”与前面的强烈用词“欢欣”略有区分，并自然承接看见之后的反应。
theological_decisions:
- issue: “我的日子”具体所指
  choice: 保留“我的日子”，不在正文中限定具体事件或时期。
  alternative: 译作“我来临的日子”“弥赛亚的时代”或“我得荣耀的日子”。
  rationale: 本节本身没有明确限定所指；保留字面表达可维持其弥赛亚意义的广度和神学张力。
- issue: ἵνα在亚伯拉罕欢欣这一句中的作用
  choice: 译作“期待看见”，兼顾前瞻期待及内容关系。
  alternative: 译作“为要看见”“因将要看见”或“欢欣地要看”。
  rationale: 该结构可按目的或与欢欣相关的内容来理解；正文采用自然汉语表达，脚注保留相近的其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“祖先”避免“父亲”在现代汉语中被误解为亚伯拉罕是听众的直接生父；“欢欣期待”传达强烈喜乐与前瞻意味。脚注标记按正文首次涉及的语句顺序排列。
