  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: zh_hans
  text: 于是，他又对他们说：“我将要离去。你们会寻找我[a]，也要死在自己的罪中[b]。我要去的地方，你们不能去[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们会找我。”原文动词可指寻找某人；在约翰福音中，也可能带有更深的属灵意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文为单数：“在你们的罪中。”有些译本采用复数“罪恶”，但单数可能强调一种持续处在罪中的状态，而非各项具体罪行。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们不能来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事，既保留推论或承接关系，也符合现代汉语表达。
- source_word: πάλιν
  choice: 又
  rationale: 自然表达动作的重复，准确对应“再次”。
- source_word: Ἐγὼ ὑπάγω
  choice: 我要离去了
  rationale: “离去”保留ὑπάγω在约翰福音中常有的离开、告别意味；“要”在汉语中自然传达即将发生之事，而不明说其最终目的地。
- source_word: ζητήσετέ με
  choice: 你们会寻找我
  rationale: “寻找”既可指实际找寻，也能保留约翰叙事中可能具有的属灵深意。
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: 在自己的罪中
  rationale: 保留介词“在……中”和单数“罪”的整体性，不改译为复数的各样罪行。
- source_word: ἀποθανεῖσθε
  choice: 要死
  rationale: 简明自然地表达将来的死亡。
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: 我要去的地方
  rationale: 以自然汉语保留重复的“去”，又避免在正文中解释耶稣所指的目的地。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 你们不能去
  rationale: 在汉语中，从听者的视角说“不能去”比机械地译作“不能来”更自然，同时保留无能力到达的语气。
theological_decisions:
- issue: ἁμαρτίᾳ是单数，还是按习惯译成复数
  choice: 正文译作“罪”，并以脚注说明希腊文为单数
  alternative: “罪恶”或“罪孽”
  rationale: 单数可能着重于持续处在罪中的状态，而不只是多项罪行；正文保留原文形式及其神学张力，不进一步限定为“不信”等具体解释。
- issue: ὑπάγω所表达的离去
  choice: 首次译作“离去”，后文译作“去”
  alternative: 两处都译作“去”或“离开”
  rationale: “离去”保留耶稣将离开听众的意味，也可容纳约翰福音中更深的指向；后句用自然的“我要去的地方”，不在正文中明说死亡、复活或回到父那里。
- issue: οὐ δύνασθε ἐλθεῖν所表达的不能
  choice: 译作“你们不能去”
  alternative: “你们无法到达”
  rationale: 保留能力或可能性受到限制的直陈语气，不擅自说明这种不能的原因或永久程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句保留原文警告的力度；“却”明确呈现寻找与死在罪中之间的转折关系，但不增添原因解释。所有脚注标记均置于相应词句之后。
