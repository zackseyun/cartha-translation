  rationale: 将“出现”改为“开始存在”，以更准确地反映γενέσθαι的广泛存在论含义，并维持其与ἐγώ εἰμι的刻意对照。保留“我就是”，使原文现在时及其绝对、可能具有神学意味的表达不被顺化。同步调整脚注a，使替代译法在中文中完整可用且说明更精确。
