  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我实实在在地告诉你们，在亚伯拉罕开始存在以前，我就是。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 直接、自然地保留叙事引语的结构和“对他们”的受话对象。
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: “实实在在”传达重复的郑重强调，也符合现代汉语中庄重而易懂的表达；与后面的 λέγω ὑμῖν 合译为完整的引语公式。
- source_word: πρὶν
  choice: 在……以前
  rationale: 准确表达时间上的先后关系，并自然引出不定式短语。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: γενέσθαι
  choice: 出现
  rationale: γίνομαι 在这里比“出生”含义更宽；“出现”在汉语中较自然，也保留从尚未有到有的意味，而不把原文限定为肉身出生。脚注补充更直译的可能表达。
- source_word: ἐγὼ εἰμί
  choice: 我就是
  rationale: 保留希腊文现在时和绝对式表达的突兀力度，不将其顺化为“我早已存在”或“我一直都在”，从而保留经文可能具有的神学呼应与张力。
theological_decisions:
- issue: 在基督论意味浓厚的语境中如何翻译 ἐγὼ εἰμί
  choice: 我就是
  alternative: 我一直都在；我早已存在
  rationale: 原文使用现在时，且表达形式异常绝对。“我就是”既贴近其语法形式，又让可能涉及神圣自我宣告的呼应保持开放；其他译法虽较顺畅，却会把含义收窄为单纯的先存。
- issue: 如何表达 γενέσθαι 与 ἐγὼ εἰμί 之间的对照
  choice: 出现……我就是
  alternative: 出生……我早已存在
  rationale: 所选译法保留亚伯拉罕“开始有”与耶稣“是”之间不对称的动词对照，同时避免将原文的神学张力解释得过满。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重而清楚。“我实实在在地告诉你们”保留约翰福音中反复出现的郑重公式；“我就是”刻意保持原文简短、绝对且略显突兀的表达。
