  terminology: “耶稣”“亚伯拉罕”均为通行译名。“我就是”保留原文现在时和可能的神学呼应，而不在正文中替读者决定其含义。脚注应将“出生”明确作为完整短语中的替代译法，并说明“出现”并非这里最精确的主译。
