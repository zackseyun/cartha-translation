  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: zh_hans
  text: 于是耶稣对他们说：“孩子们，你们没有鱼[a]吗？”他们回答他：“没有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“可佐食的东西”。希腊文προσφάγιον指与面包同吃的食物；在这里的捕鱼情境中，很可能指鱼。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 作为自然的叙事连接词，承接前文情节发展；比“所以”更符合此处中文叙事语流。
- source_word: Παιδία
  choice: 孩子们
  rationale: 保留这一呼语本身亲切且带有长幼关系的语气，不解释为年龄特定的“小伙子们”，也不弱化为“朋友们”。
- source_word: μή τι
  choice: 没有……对吗？
  rationale: μή引导的问题预期否定回答；中文以否定陈述加“对吗”自然表达这种倾向，同时避免把预期强化为绝对断言。
- source_word: προσφάγιον
  choice: 鱼吃
  rationale: 该词指佐食面包的食物；在捕鱼场景中很可能特指鱼。正文以“鱼吃”表达语境所指，并用脚注保留较宽的词义。
- source_word: ἔχετε
  choice: 有
  rationale: 按普通的持有义翻译，并融入自然的中文问句。
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: 他们回答他
  rationale: 直接保留希腊文的叙事回应公式，现代中文自然且庄重。
- source_word: Οὔ
  choice: 没有
  rationale: 按问题内容采用中文自然的简短否定回答；比单说“不”更符合汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“孩子们”保留原文亲切的称呼；问句采用口语自然但不过分随意的“对吗”。本节未设置脚注，因为正文“鱼吃”在此捕鱼语境中清楚自然；较宽泛的“佐食之物”虽是词典义，但在本节并不需要另注。
