source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: zh_hans
  text: 耶稣说这话，是指明彼得将以怎样的死荣耀上帝[a]。说完这话，耶稣对他说[b]：“跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将以何种方式死去，从而荣耀上帝。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文这里使用历史现在时，直译为：“他对他说。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ εἶπεν σημαίνων
  choice: 耶稣说这话，是指明
  rationale: 补明上下文中的主语“耶稣”，使独立经节自然清楚；“指明”保留 σημαίνω 以言语暗示、表明之意，δὲ 不另加生硬的篇章标记。
- source_word: ποίῳ θανάτῳ
  choice: 将以怎样的死
  rationale: “怎样”保留 ποῖος 所强调的性质或方式，不弱化为仅仅询问是哪一次死亡。
- source_word: δοξάσει τὸν θεόν
  choice: 荣耀上帝
  rationale: 直译核心神学表达，不解释彼得的死具体如何荣耀上帝；“将”表达未来指向。
- source_word: καὶ τοῦτο εἰπὼν
  choice: 说完这话
  rationale: 以自然现代汉语表达先行动作；句首 καί 无须机械译为“并且”。
- source_word: λέγει αὐτῷ
  choice: 耶稣对他说
  rationale: 补明主语以避免与前句最近人物“彼得”混淆；中文叙事通常不以现在时形态标示希腊文历史现在，其特点收入脚注。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 简洁保留现在时命令语气所容纳的即时行动与持续作门徒双重意味，不擅自扩写为“继续跟从”。
theological_decisions:
- issue: 彼得的死如何荣耀上帝
  choice: 只保留“以怎样的死荣耀上帝”
  alternative: 明确译作“以殉道忠心见证来荣耀上帝”
  rationale: 原文指出死亡会荣耀上帝，却未在本节说明其具体机制；不把殉道解释扩入正文。
- issue: “跟从我”的时间和门徒含义
  choice: 译为“跟从我”
  alternative: “继续跟从我”或“来跟我走”
  rationale: 原文现在时命令可兼有眼前跟随与持续作门徒的张力，简洁措辞可保留两者。
translation_notes:
  register: 采用现代、庄重且口语可懂的普通话。“上帝”作为 θεός 的标准译法；避免用“殉道”等解释性词语加入原文未明说的内容。所有脚注标记均已置于正文。
