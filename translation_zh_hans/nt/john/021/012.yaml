  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: zh_hans
  text: 耶稣对他们说：“来吃早饭吧[a]。”但门徒中没有一个敢问他[b]：“你是谁？”他们知道他是主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词特指吃早晨的一餐，也可译作“来用早饭吧”。
    reason: lexical_alternative
  - marker: b
    text: 译作“问”的词也可指“查问”或“仔细盘问”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: 来
  rationale: 这里是带命令语气的邀请，意为“来”或“到这里来”；“来”在现代汉语中自然简洁。
- source_word: ἀριστήσατε
  choice: 吃早饭吧
  rationale: 该动词特指吃早晨的一餐；译作“吃早饭”保留时间含义，加“吧”体现邀请语气。
- source_word: οὐδεὶς δὲ
  choice: 门徒中没有一个
  rationale: δέ在此表示轻微转折或叙事推进；汉语借上下文自然呈现转折，无须硬译为“但是”。
- source_word: ἐτόλμα
  choice: 敢
  rationale: τολμάω表达有勇气或胆量做某事；在否定句中译为“不敢”最自然。
- source_word: ἐξετάσαι
  choice: 追问
  rationale: 该词可指询问、盘问或仔细查问；“追问”比一般的“问”更能保留其较强语气，同时符合此处直接提问的情境。
- source_word: Σὺ τίς εἶ;
  choice: 你是谁？
  rationale: 直译身份问题，并保留显明的第二人称代词Σὺ。
- source_word: εἰδότες ὅτι
  choice: 他们知道
  rationale: 用独立分句自然表达希腊文分词结构，不强行限定为原因、伴随或方式，保留其关系上的一定开放性。
- source_word: ὁ κύριός
  choice: 主
  rationale: 在复活后的显现语境中，κύριος指耶稣；“主”保留其基督论分量，又不额外阐释。
theological_decisions:
- issue: 称呼耶稣的κύριος如何翻译
  choice: 主
  alternative: 主人
  rationale: “主”是此处自然且具有叙事与基督论分量的对应词；“主人”会把含义不必要地收窄为社会身份。
- issue: εἰδότες与前句的逻辑关系
  choice: 以独立分句“他们知道”表达
  alternative: 因为他们知道
  rationale: 原文使用分词，可能带原因意味，但未用明确的原因连词；独立分句避免替原文过度确定逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“来吃早饭吧”自然传达邀请；“追问”保留ἐξετάσαι强于普通“问”的语气。两个脚注标记均紧随所说明的表达。
