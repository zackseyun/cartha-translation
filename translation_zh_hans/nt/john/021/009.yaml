  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: zh_hans
  text: 他们上了岸[a]，就看见那里有一堆炭火[b]，上面放着鱼，还有饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们到了陆地上”。原文较直译为“他们出来到了陆地上”，指他们从船上出来。
    reason: lexical_alternative
  - marker: b
    text: “炭火”所译的希腊词也见于约翰福音18:18，使这里与彼得先前否认耶稣时的场景在用词上彼此呼应。
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: 就
  rationale: 结合上下文，以“就”自然表达ὡς的时间关系和οὖν承接叙事的作用；汉语不必逐词另译“所以”。
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: 他们上了岸
  rationale: 原文意为从船上出来、到陆地上；“上了岸”是现代汉语中最自然的说法，同时保留从水上到陆地的场景。
- source_word: βλέπουσιν
  choice: 看见
  rationale: 这是叙事中的历史现在时；汉语以“看见”配合“了”自然叙述已经发生的动作，无须刻意保留现在时形式。
- source_word: ἀνθρακιὰν κειμένην
  choice: 那里有一堆炭火
  rationale: ἀνθρακιά指炭火或一堆燃烧的炭；κειμένην表示已经摆设在那里。译文用存在句自然呈现这一静态场景。
- source_word: ὀψάριον ἐπικείμενον
  choice: 上面放着鱼
  rationale: ὀψάριον在约翰福音中指作为食物的鱼，单数形式在此不必强行译成“一条”；ἐπικείμενον表明鱼在炭火上面。
- source_word: ἄρτον
  choice: 饼
  rationale: ἄρτος可指饼、面包或一块饼；“饼”符合本书饮食语境，也不额外限定数量和形状。
theological_decisions:
- issue: 叙事历史现在时
  choice: 按自然汉语叙事译为“看见”
  alternative: 用鲜活现在时译作“便看见”或刻意标示“正看见”
  rationale: βλέπουσιν虽为现在时形式，却在叙事中指当时发生的事；自然汉语无需用进行体或现在时标记，且这一处理不改变事件次序。
- issue: 炭火一词与彼得否认主场景的文字呼应
  choice: 译作“炭火”，并以脚注指出与约翰福音18:18的用词联系
  alternative: 仅译作“火”或“火堆”，不呈现炭的含义
  rationale: ἀνθρακιά明确指炭火，且本福音仅在18:18和此处使用；保留这一词义可让读者看见原文真实存在的叙事呼应，而不替读者规定其神学意义。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“上了岸”比逐字译法更自然；“一堆炭火”清楚呈现现场景象。“鱼”在现代汉语中不强制标明单复数，因而保留原文在数量上的非强调性。脚注标记[a]、[b]均已置于正文相应词语之后。
