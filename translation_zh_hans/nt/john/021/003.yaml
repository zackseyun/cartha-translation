base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: zh_hans
  text: 西门·彼得对他们说[a]：“我去打鱼。”他们对他说：“我们也和你一起去。”他们就出去，上了船；那一夜什么也没捕到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里采用叙事性现在时，直译为“西门·彼得对他们说……他们对他说”；这是希腊文叙事中常见的表达方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 希腊文采用叙事性现在时；现代汉语叙事无须借助动词时态变化，因此自然译作“对他们说”，并由脚注说明原文形式。
- source_word: Ὑπάγω ἁλιεύειν
  choice: 我去打鱼
  rationale: Ὑπάγω 表示前去，ἁλιεύειν 表示打鱼；“我去打鱼”简洁自然，并保留彼得所陈述的即时打算。
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: 我们也和你一起去
  rationale: “也”体现 καὶ ἡμεῖς 的强调，“和你一起”表达 σύν 的同行关系；按汉语说话视角用“去”比直译为“来”更自然。
- source_word: ἐξῆλθον
  choice: 出去
  rationale: 保留动词所表达的向外行动，同时避免加入原文没有说明的出发地点。
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: 上了船
  rationale: 这是现代汉语表达登船动作最自然简洁的说法；“船”符合加利利海捕鱼场景。
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: 那一夜
  rationale: 自然表达该特定夜间的时间范围，也保留原文指示成分 ἐκείνῃ。
- source_word: ἐπίασαν οὐδέν
  choice: 什么也没捕到
  rationale: 捕鱼语境中 πιάζω 指捕获；该译法准确表达 οὐδέν 所强调的毫无收获。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。“打鱼”适合人物直接引语，“捕到”适合叙述捕鱼结果；用“可是”清楚呈现行动与毫无收获之间的转折。
