id: JHN.21.23
reference: John 21:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: zh_hans
  text: 于是，这话[a]就在弟兄们[b]中间传开了，说那门徒不会死。然而，耶稣并没有对他说那门徒不会死，而是说：“如果我愿意让他留到我来的时候，这跟你有什么关系？”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这个说法”或“这个消息”。希腊语λόγος可表示“话”“陈述”或“消息”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”指门徒群体；希腊语使用阳性复数ἀδελφοί。
    reason: cultural_note
  - marker: c
    text: 耶稣并没有应许这门徒永远不死；他说的是一个假设条件：“如果我愿意让他留到我来的时候……”
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς τοὺς ἀδελφοὺς
  choice: 就在弟兄们中间传开了
  rationale: 按消息或言论在人群中传播的习语理解；“传开了”比字面的“出去”更符合现代汉语，同时保留传播之意。
- source_word: οὗτος ὁ λόγος
  choice: 这话
  rationale: λόγος在此可指话、说法或消息。“这话”自然且较贴近原文，也不预先把它定性为正式报告。
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: 那门徒
  rationale: 保留ἐκεῖνος的指示意味，明确指向上下文中的特定门徒。
- source_word: οὐκ ἀποθνῄσκει
  choice: 不会死
  rationale: 原文现在时在转述内容中表达流传的断言；现代汉语用“不会死”自然，并与下文作者的纠正形成对应。
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: 如果我愿意让他留
  rationale: θέλω表达意愿，译为“愿意”；μένειν译为“留”，简洁自然，并保留约翰文献中“留下/存留”的语义空间。
- source_word: ἕως ἔρχομαι
  choice: 到我来的时候
  rationale: 贴近原文“直到我来”，不加上原文没有明说的“再”或“回来”。
- source_word: τί πρὸς σέ
  choice: 这跟你有什么关系？
  rationale: 用现代汉语惯用表达传达该反问，保留其直接、纠正性的语气。
theological_decisions:
- issue: 流传说法的性质
  choice: 正文译作“这话……传开了”，并由下句明确纠正其内容
  alternative: 译作“这个传言”或“这个消息”
  rationale: 原文λόγος本身可指话、说法或消息；“这话”保留词义弹性，而经文随后清楚表明这不是耶稣作出的不死应许。
- issue: 耶稣话语的条件性
  choice: 保留“如果我愿意……”的假设条件
  alternative: 将其解释为耶稣会让该门徒活到再来
  rationale: ἐάν引出假设条件，原文没有断言该条件实际成立；不可把条件句改成预言或应许。
- issue: “我来”的所指
  choice: 直译为“我来”
  alternative: 解释性译为“我再来”或“我回来”
  rationale: ἔρχομαι没有明说“再”或“回来”；直译可避免在正文中消除其潜在的末世含义及原有张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“弟兄们”保留原文阳性复数形式；“这话”避免把λόγος过度定性为传言，同时脚注说明其词义范围。问句使用现代常用表达，但不弱化耶稣对彼得的直接纠正。
