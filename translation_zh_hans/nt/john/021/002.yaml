  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: zh_hans
  text: 西门·彼得、称为“双生子”的多马[a]、来自加利利迦拿的拿但业、西庇太的儿子们，以及他的门徒中的另外两个人，当时都在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双生子”原文是希腊语Δίδυμος（传统音译“低土马”），意思是“孪生的；双生子”。
    reason: 说明Δίδυμος的词义及传统音译；不把音译误称为不同的原文措辞。
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: 当时都在一起
  rationale: 未完成时ἦσαν描述当时持续的状态；ὁμοῦ表示同在一处。合译符合现代汉语叙事习惯。
- source_word: Σίμων Πέτρος
  choice: 西门·彼得
  rationale: 采用现代中文基督教语境中通行的人名译法，并以间隔号连接名字与称号。
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: 称为“双生子”的多马
  rationale: λεγόμενος意为“称为”；Δίδυμος是有实际含义的称号，意为“双生子、双胞胎”，正文译出其含义，并以脚注保留传统音译信息。
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: 加利利迦拿人拿但业
  rationale: ἀπό表示籍贯或来源；此表达自然地说明拿但业来自加利利的迦拿。
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: 西庇太的儿子们
  rationale: 该省略式属格短语按语境指西庇太的儿子；“儿子们”保留原文复数，不在正文中补出姓名。
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: 他的另外两个门徒
  rationale: 保留ἐκ所表达的从其门徒中另有两人的部分关系；“他的”照应上下文中的耶稣，不在本节明补名字。
- source_word: καί … καί
  choice: 顿号列举，并在末项前用“以及”
  rationale: 原文反复使用καί连接各项；现代汉语用顿号和末项连词表达同等并列关系，更自然且不损失意义。
