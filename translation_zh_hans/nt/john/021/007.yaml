id: JHN.21.7
reference: John 21:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: zh_hans
  text: 于是，耶稣所爱的那个门徒对彼得说：“是主！”西门·彼得一听说是主，就把外衣束在身上——因为他当时衣着单薄[a]——纵身跳进海里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他当时赤身裸体。”希腊语γυμνός既可指赤裸，也可指衣着不足或衣着单薄。
    reason: 保留γυμνός在此语境中的词义歧义。
lexical_decisions:
- source_word: λέγει οὖν
  choice: 于是……说
  rationale: οὖν在这里推动叙事并承接前文；“于是”自然保留这种衔接作用。
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: 耶稣所爱的那个门徒
  rationale: 保留ἐκεῖνος的指示意味“那个”，也保留《约翰福音》中这一特有称呼。
- source_word: Ὁ κύριός ἐστιν
  choice: 是主
  rationale: 符合现代汉语识认某人时的自然表达；“主”保留κύριος在此处既是称号又具有基督论分量的含义。
- source_word: ἀκούσας ὅτι ὁ κύριός ἐστιν
  choice: 一听说是主
  rationale: 以时间性结构表达不定过去时分词，并用“一……就……”自然呈现紧接着发生的动作。
- source_word: τὸν ἐπενδύτην
  choice: 外衣
  rationale: ἐπενδύτης指穿在外面的衣物；“外衣”准确清楚，不擅自限定为某种渔夫服装。
- source_word: διεζώσατο
  choice: 束在身上
  rationale: 表达把衣物围上并束紧的动作，也体现中间语态中动作归于自身；比单说“穿上”更具体。
- source_word: ἦν γὰρ γυμνός
  choice: 因为他当时衣着单薄[a]
  rationale: γυμνός既可指全身赤裸，也可指没有充分穿衣。正文按捕鱼劳动场景采用“衣着单薄”，脚注保留较直接的另一种理解。
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: 纵身跳进海里
  rationale: “纵身跳进”自然传达βάλλω与反身代词构成的主动、迅疾动作；“海”对应θάλασσα及本段用语。
theological_decisions:
- issue: 耶稣被认出时κύριος的译法
  choice: 主
  alternative: 主人／老师
  rationale: “主”既符合本书对复活后耶稣的称呼，也不消解该词兼具日常尊称与基督论意义的张力。
- issue: γυμνός所指彼得的衣着状态
  choice: 衣着单薄
  alternative: 赤身裸体／没有穿衣服
  rationale: 原词容许“赤裸”或“穿得不充分”两种理解。正文依据劳动场景采用较宽和的语境义，同时用脚注明示更直接的词义，避免把歧义静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”与“一……就……”保持叙事节奏；破折号清楚标示原文的解释性插语。
