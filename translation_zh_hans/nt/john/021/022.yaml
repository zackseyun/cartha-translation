  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: zh_hans
  text: 耶稣对他说：“我若要他留到我来[a]，与你有什么关系？你跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到我来”有意保留原文的开放性；耶稣所说的“来”具体指什么，本节没有说明。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐὰν
  choice: 若
  rationale: 引出假设条件，简洁自然，不额外暗示该条件是否会实现。
- source_word: θέλω
  choice: 要
  rationale: 可表达意愿或意志；“要”在现代汉语中自然，并保留两者之间的语义空间。
- source_word: μένειν
  choice: 留
  rationale: 对应“留下、停留”，不将其具体解释为“活着”，从而避免超出原文。
- source_word: ἕως ἔρχομαι
  choice: 直到我来
  rationale: 直译时间从句，不用“再来”等带解释性的措辞，以保留“来”所指事件的开放性。
- source_word: τί πρὸς σέ;
  choice: 与你有什么关系？
  rationale: 自然传达该习语中制止彼得过问他人命运的直接语气。
- source_word: σύ
  choice: 你
  rationale: 保留显式人称代词的强调，与前面的“他”形成对照。
- source_word: μοι ἀκολούθει
  choice: 跟从我吧
  rationale: “跟从”适合庄重而通俗的经文语体；句末“吧”使汉语命令自然，但仍保持明确的劝令语气。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 将叙事性历史现在时按现代汉语叙事习惯处理，不生硬标示时态。
theological_decisions:
- issue: ἕως ἔρχομαι 中耶稣“来”的所指
  choice: 译为“直到我来”，不具体说明所指事件
  alternative: 直到我再来；直到我来施行审判；直到我显现
  rationale: 本节没有界定“来”指哪一事件；采用不加限定的表达，保留原文的末世论及历史指涉上的开放性。
- issue: μένειν 是否明确表示“活到”
  choice: 译为“留到”
  alternative: 活到；存留到
  rationale: 上下文可能使读者联想到继续活着，但动词本身是“留下、停留”；不应把上下文推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与你有什么关系？”保留耶稣回答的直接性；“你跟从我吧”以自然汉语突出“你”与“他”的对照。
