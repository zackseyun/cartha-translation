source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: zh_hans
  text: 彼得转过身来，看见耶稣所爱的那个门徒跟在后面[a]；这就是那位也曾在晚餐时靠在耶稣胸前，问道：“主啊，出卖你的是谁？”的门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说跟随的对象，也可理解为“跟着他”或“跟着他们”。
    reason: 保留ἀκολουθοῦντα未带明示宾语所形成的歧义。
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: 转过身来
  rationale: 以自然的现代汉语表达不定过去时分词所引出的先行动作，并保留彼得回身观看的画面。
- source_word: βλέπει
  choice: 看见
  rationale: 希腊文使用历史现在时；汉语叙事用“看见”即可自然承接上下文，无须机械标示时态。
- source_word: τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς
  choice: 耶稣所爱的那个门徒
  rationale: 保留约翰福音中这一特有称谓及“爱”的明确关系，同时符合现代汉语语序。
- source_word: ἀκολουθοῦντα
  choice: 跟在后面
  rationale: 不擅自补出宾语“他”或“他们”，以保留希腊文未明说跟随对象的含混性；“跟在后面”在汉语中自然呈现当时的行进场景。
- source_word: ἀνέπεσεν … ἐπὶ τὸ στῆθος αὐτοῦ
  choice: 靠在耶稣胸前
  rationale: 用现代读者容易理解的措辞表达席间侧身斜倚并靠近胸膛的动作；明确“耶稣”以避免汉语代词指向不清。
- source_word: ἐν τῷ δείπνῳ
  choice: 在晚餐时
  rationale: 自然表达特指的那次席间场景，不赋予礼仪性含义。
- source_word: Κύριε
  choice: 主啊
  rationale: “主”延续κύριος的常规译法，“啊”符合汉语直接呼语。
- source_word: ὁ παραδιδούς σε
  choice: 出卖你的是谁
  rationale: 在受难叙事语境中παραδίδωμι指背叛并交付；“出卖”简洁自然，也保留背叛含义。
theological_decisions:
- issue: ἀκολουθοῦντα所隐含的跟随对象
  choice: 正文不补宾语，译为“跟在后面”
  alternative: 跟着他；跟着他们
  rationale: 原文分词没有明说宾语；上下文可让人理解为跟在耶稣和彼得后面，也可能聚焦于跟随耶稣。正文保留这种含混，脚注说明。
- issue: “耶稣所爱的门徒”的身份
  choice: 保留叙事称谓，不指名其身份
  alternative: 约翰
  rationale: 本节原文没有给出姓名；译文不应依据传统认定替原文补名。
- issue: παραδιδούς的语义
  choice: 出卖
  alternative: 交出；背叛
  rationale: 在耶稣受难的具体语境中，该词具有背叛并把人交出去的意义；“出卖”能在现代汉语中兼顾两层含义，而不额外展开。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“那个门徒”使限定关系清楚；后半句重组为“这门徒就是……的那一位”，避免照搬希腊文多重关系从句而造成汉语拗口。正文中的脚注标记[a]与脚注对应。
