  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: zh_hans
  text: 彼得看见他，就对耶稣说：“主啊，这个人呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: 看见他
  rationale: 指上文所说的那位门徒；中文用“他”自然承接语境，无须重复身份。
- source_word: οὖν
  choice: 就
  rationale: 在叙事中表达承接与结果关系，比直译为“所以”更符合现代汉语行文。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时；现代汉语叙事通常不以时态形式区分，译作“说”自然且不损失事件性。
- source_word: οὗτος δὲ τί
  choice: 这个人呢
  rationale: 这是省略式问句，意思由语境补足为询问此人将如何；保留简短和含蓄，不擅自补入“会怎样”或“怎么办”。
theological_decisions:
- issue: 彼得的问题是否明确询问那门徒的未来或结局
  choice: 保留省略式问法“这个人呢？”
  alternative: “这个人会怎样呢？”或“这个人怎么办呢？”
  rationale: 原文 οὗτος δὲ τί 本身简略，具体所问可由耶稣随后回答推知，但本节并未明说；保留原有歧义与张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“主啊”准确体现呼语 Κύριε；问句保持简洁，适合普通读者理解。
