id: JHN.21.1
reference: John 21:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: zh_hans
  text: 这些事以后，耶稣在提比哩亚海边再次向门徒显明自己[a]。他是这样显明自己的：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“显现”；希腊语动词可指使自己被看见，也可指使自己被认识。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语的形式及约翰叙事中常见的时间承接方式，同时符合现代汉语表达。
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: 向……显明自己
  rationale: φανερόω在此表示使自己显现并为人所认识；“显明自己”既保留反身结构，也保留主动自我启示的意味。
- source_word: πάλιν
  choice: 再次
  rationale: 准确表达此前已有复活后显现、如今又一次显现的重复意义。
- source_word: τοῖς μαθηταῖς
  choice: 向门徒
  rationale: 原文没有明说所有格，故不增添“他的”；介词“向”自然配合“显明自己”。
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: 在提比哩亚海边
  rationale: ἐπί加属格在此表达地点；“海边”比“海上”更符合本段场景，又保留约翰所用的地名。
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: 他是这样显明自己的
  rationale: 重复“显明”以保留原文的文学呼应，并以自然汉语引出下文所叙述的方式。
theological_decisions:
- issue: 复活后显现用语的译法
  choice: 显明自己
  alternative: 显现；使人认识自己
  rationale: “显明自己”保留耶稣主动自我彰显的语义，同时不把事件仅仅缩减为视觉上的出现，也不否定这是真实的复活后相遇。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“提比哩亚海”沿用中文圣经地名的通行形式；分为两句，以清楚呈现原文重复动词及引出下文的结构。
source_grounding:
  english_pob_role: consult_only
