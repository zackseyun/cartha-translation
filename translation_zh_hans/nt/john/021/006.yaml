  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: zh_hans
  text: 他对他们说：“把网撒在船右边，你们就会找到。”[a] 于是他们撒下网；因为鱼太多，他们再也无力把网拉上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们就会找到”；希腊文没有明说所找到的对象，捕鱼的上下文表明所指的是鱼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: 撒
  rationale: 在捕鱼语境中，βάλλω指把网撒下；现代汉语惯用“撒网”，比一般性的“扔”自然准确。
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: 船的右边
  rationale: μέρη字面为“部分、区域”，此处自然指船右侧的水域；“船的右边”清楚并避免不必要的航海术语。
- source_word: τὸ δίκτυον
  choice: 网
  rationale: 指捕鱼用的网；上下文明确，汉语无需另加“鱼”。
- source_word: εὑρήσετε
  choice: 就会捕到
  rationale: 希腊文直译为“就会找到”，宾语未明说，但捕鱼语境隐含所获之鱼。汉语“捕到”自然表达语境意义，同时不补明数量。
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: 他们竟拉不上来
  rationale: ἑλκύσαι表示拉、拖，ἴσχυον表示有能力或力气；“拉不上来”自然呈现因网中鱼多而无力拉起。οὐκέτι本义为“不再”，此处按叙事结果译为“竟……不上来”，避免生硬。
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: 鱼太多了
  rationale: ἀπό在此表原因，πλῆθος表示数目众多；采用现代汉语因果结构，与后句连贯，并保留鱼数量极多的含义。
