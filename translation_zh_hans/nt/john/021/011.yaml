id: JHN.21.11
reference: John 21:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: zh_hans
  text: 于是，西门·彼得上了船[a]，把网拉到岸上[b]。网里满是大鱼，共一百五十三条；鱼虽这么多，网却没有破。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“上去”；这里可能指彼得上了船。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“到陆地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: 上了船
  rationale: 该词本义为“上去”，在本段捕鱼场景中很可能指彼得上船拉网；正文采用自然的语境表达，同时以脚注保留原文较宽的含义。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文耶稣要门徒拿鱼来的吩咐，表示随后的行动；“于是”符合现代汉语叙事。
- source_word: εἵλκυσεν
  choice: 拉
  rationale: 直接表达用力把鱼网牵引到岸上的动作，不额外强化为拖磨或搬运。
- source_word: τὸ δίκτυον
  choice: 网
  rationale: 在捕鱼语境中指鱼网；上下文明确，无须重复限定为“鱼网”。
- source_word: εἰς τὴν γῆν
  choice: 到岸上
  rationale: 字面为“到陆地上”；捕鱼场景中的自然汉语表达是“到岸上”，并以脚注保留字面形式。
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: 网里满是大鱼
  rationale: 既传达网“装满”的状态，也以自然汉语明确鱼在网中。
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: 共一百五十三条
  rationale: 准确保留明确数目，并用鱼的现代汉语量词“条”；“共”自然引出总数。
- source_word: τοσούτων ὄντων
  choice: 鱼虽这么多
  rationale: 将属格独立结构按语境译为让步关系，保留鱼的数量本应使网承受压力的意味。
- source_word: οὐκ ἐσχίσθη τὸ δίκτυον
  choice: 网却没有破
  rationale: “破”是描述鱼网未裂开的自然现代汉语；“却”清楚呈现与鱼多之间的反差。
theological_decisions:
- issue: 一百五十三条鱼是否具有象征意义
  choice: 只保留原文明确记载的数目，不在正文或脚注中赋予象征解释
  alternative: 补充某种数字象征或教义解释
  rationale: 本节原文本身没有解释这一数字的象征意义；翻译不应加入特定传统或私人诠释。
translation_notes:
  register: 采用清楚、庄重而自然的现代标准汉语。“西门·彼得”按现代人名分隔习惯加间隔号；句式通过“虽……却……”呈现原文让步和反差。脚注标记均置于其所解释的正文词语之后。
