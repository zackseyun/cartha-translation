base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: zh_hans
  text: 耶稣走过来，拿起饼，递给他们；也照样把鱼递给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“鱼也同样。”原文在这里省略了前面所说的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 走过来
  rationale: 表达耶稣来到门徒跟前的动作；现代汉语动词本身不标明过去时或现在时，因此无需生硬地另行标示希腊文的历史现在时。
- source_word: λαμβάνει
  choice: 拿起
  rationale: 在分送已经备好的食物这一语境中，表示拿取食物的简单动作；“拿起”比“领受”自然准确。
- source_word: τὸν ἄρτον
  choice: 饼
  rationale: 指现场那份具体的饼。汉语通常无需用相当于定冠词的词，译作“饼”简洁自然。
- source_word: δίδωσιν αὐτοῖς
  choice: 递给他们
  rationale: “递给”自然表达把手中的食物交给门徒，且没有采用解释性较强的“伺候他们用餐”。
- source_word: τὸ ὀψάριον
  choice: 鱼
  rationale: 本词在这里指作为食物的鱼；原词本身不要求明确译为“烤鱼”或“熟鱼”。
- source_word: ὁμοίως
  choice: 也照样递给他们
  rationale: 原文以“鱼也同样”省略前述动作。汉语补出“递给他们”，清楚传达耶稣对鱼所做的与对饼所做的相同。
theological_decisions:
- issue: 复活显现叙事中的历史现在时
  choice: 采用不带显式时态标记的汉语连续动作“走过来，拿起……递给”
  alternative: 用“走了过来，拿起……递给了”突出已完成的过去动作
  rationale: ἔρχεται、λαμβάνει、δίδωσιν在希腊文中为叙事性的现在时。现代汉语动词不按同样方式屈折变化，主译文可自然保留叙事的现场感，又不额外加入完成体标记；这不改变经文的神学含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“拿起……递给”保持动作清楚连贯；末句补出原文省略的动作，并用脚注保留其简洁的字面形式。
