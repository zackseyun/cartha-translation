base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: zh_hans
  text: 耶稣第二次又问他：“约翰的儿子西门，你爱[a]我吗？”彼得对他说：“是的，主，你知道我爱你。”耶稣对他说：“牧养我的羊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段对话中，希腊文用了两个不同的“爱”字：耶稣问时用 agapaō，彼得回答时用 phileō。有人认为两者在这里有区别，也有人认为只是行文上的变化。正文都译作“爱”，以免把这种差别说得过于确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: 又第二次
  rationale: 两个词都予以体现，保留原文对重复和次序的双重强调；这种表达在现代汉语中虽略带复叠，却自然可懂。
- source_word: Σίμων Ἰωάννου
  choice: 约翰的儿子西门
  rationale: 将属格按父名结构处理，准确反映“约翰之子”，不采用来自其他经文传统的“约拿的儿子”。
- source_word: ἀγαπᾷς με
  choice: 你爱我吗
  rationale: 以现代汉语普通而自然的“爱”表达；不在正文中人为强化其与 φιλέω 的差别。
- source_word: Ναί, κύριε
  choice: 是的，主
  rationale: “是的”直接表达肯定回答；κύριε 在此以尊称“主”译出。
- source_word: σὺ οἶδας
  choice: 你知道
  rationale: 汉语主语“你”自然承载原文显式代词的轻微强调，无须另加“你自己”。
- source_word: ὅτι φιλῶ σε
  choice: 我爱你
  rationale: φιλέω 在本语境中自然译为“爱”；与 ἀγαπάω 的词汇变化在脚注说明，以免正文过度诠释。
- source_word: Ποίμαινε
  choice: 牧养
  rationale: 该词指牧人的照料、引导和看顾；“牧养”既保留牧羊意象，也比单译“喂养”更完整。
- source_word: τὰ πρόβατά μου
  choice: 我的羊
  rationale: 保留 πρόβατα 的具体羊群意象及耶稣对羊的所属关系。
theological_decisions:
- issue: 是否用不同汉语词分别翻译 ἀγαπάω 和 φιλέω
  choice: 正文均译作“爱”，并在脚注说明希腊文用词不同。
  alternative: 将 ἀγαπάω 译作“爱”，将 φιλέω 译作“喜爱”或“疼爱”。
  rationale: 两个动词的变化确实存在，但在约翰著作中的语义可能彼此重叠。正文强行区分会使读者以为此处必然含有明确的爱之等级或心理差别；脚注则能保存原文现象及其解释上的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙述中补出“耶稣”和“彼得”，避免连续三个“他”造成指代含混；对话保持简洁。正文中的脚注标记置于本节末，覆盖“爱”字用词差异的说明。
