  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: zh_hans
  text: 这位门徒就是为这些事作见证[a]、并写下这些事的那一位；我们知道，他的见证是真实的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证”和“见证”在希腊文中是同源词，贯穿本节。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: 就是这位门徒
  rationale: 以强调判断句自然表达希腊文的指认结构，并承接上文刚提到的门徒。
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: 为这些事作见证
  rationale: 现在分词可表达持续或具有特征性的见证行为；“为……作见证”既自然，又与后文“见证”保留同源词呼应。
- source_word: ὁ γράψας ταῦτα
  choice: 写下这些事
  rationale: 不定过去时分词指向已经完成的写作行为；“写下”在现代汉语中清楚而庄重。
- source_word: οἴδαμεν
  choice: 我们也知道
  rationale: 该完成时形式在通用希腊语中具有现在意义；直译复数第一人称，不擅自确定说话者身份。“也”对应 καί，并使汉语衔接自然。
- source_word: ἀληθὴς αὐτοῦ ἡ μαρτυρία ἐστίν
  choice: 他的见证是真实的
  rationale: 保留判断结构以及“见证”的法律与真理宣称色彩；“真实的”直接表达 ἀληθής。
theological_decisions:
- issue: “我们知道”的身份与声音
  choice: 直接译作“我们也知道”，不说明“我们”是谁
  alternative: 解释为福音书作者的编辑性复数，或见证该门徒的一群人
  rationale: 希腊文明确使用第一人称复数，却没有指出其所指；译文应保留有关作者身份和群体见证的开放性。
- issue: 门徒与写作者的关系
  choice: 按同位结构译为同一位门徒既作见证又写下这些事
  alternative: 将“写下这些事”弱化为与该门徒间接相关
  rationale: 两个带冠词的分词短语共同修饰“这位门徒”；译文依照句法呈现，同时不进一步断定写作过程或最终编订方式。
translation_notes:
  register: 采用现代、清楚而庄重的书面普通话。“为……作见证”比“见证这些事”更自然，也保留本节动词与名词的同源呼应；分号呈现指认与共同确认之间的句法转折。
