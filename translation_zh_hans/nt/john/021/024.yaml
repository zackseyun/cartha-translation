  rationale: 修订删除无明确对应的“也”，调整语序以更直接呈现“这位门徒就是……的那一位”的指认结构，并将词汇脚注移至相关词语之后。其余表达保留原译对希腊文句法、见证术语及“我们”身份开放性的忠实处理。
