source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: zh_hans
  text: 他第三次对他说：“约翰的儿子西门，你爱我吗？”[a]彼得很忧愁，因为耶稣第三次对他说：“你爱我吗？”他就对耶稣说：“主啊，你知道一切；你知道我爱你。”[b]耶稣对他说：“喂养我的羊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语用φιλέω（“爱、喜爱”）；此前耶稣的前两次提问用的是ἀγαπάω。有些解释认为两者在此有意义上的区别，另一些解释则认为它们在本段中语义重叠。正文都译作“爱”，不强行加上原文未明确要求的差别。
    reason: lexical_alternative
  - marker: b
    text: 彼得的回答先后用了两个表示“知道”的希腊语动词：οἶδα和γινώσκω。两者在这里都自然译作“知道”；原文的变化可能含有细微意味，但若用不同的汉语词表达，容易造成过度解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: 第三次
  rationale: 自然表达次数，也保留连续三次发问的叙事重点。
- source_word: Σίμων Ἰωάννου
  choice: 约翰的儿子西门
  rationale: Ἰωάννου是表父子关系的属格；依本节希腊文本译作“约翰的儿子”，不采用源于另一传统形式的“约拿的儿子”。
- source_word: φιλεῖς / φιλῶ
  choice: 爱／爱
  rationale: φιλέω在此表示爱与亲爱之情。“爱”庄重自然；不在正文中强行区分它与前两问所用ἀγαπάω的意义。
- source_word: ἐλυπήθη
  choice: 忧愁
  rationale: 准确传达彼得因第三次受问而产生的悲伤与痛苦，也符合现代汉语经文语体。
- source_word: Κύριε
  choice: 主啊
  rationale: 在复活后的耶稣与彼得的对话中，κύριε不只是礼貌称呼；“主啊”保留其郑重的称谓意义。
- source_word: πάντα σὺ οἶδας
  choice: 你知道一切
  rationale: 直接保留πάντα的广泛范围及σὺ所强调的主语，同时表达自然。
- source_word: οἶδας ... γινώσκεις
  choice: 知道……知道
  rationale: 两个希腊动词都可指知道；在现代汉语中重复使用“知道”最自然，避免以不同词语过度解释可能存在的细微差别。
- source_word: Βόσκε
  choice: 喂养
  rationale: βόσκω具体指给牲畜食物、使其得牧养；“喂养”也保留它与ποιμαίνω“牧养”的词汇区别。
- source_word: πρόβατά
  choice: 羊
  rationale: πρόβατα指羊，并非特指羊羔；此译法保留它与第15节ἀρνία“羊羔”的区别。
theological_decisions:
- issue: 是否在耶稣与彼得的对话中突出φιλέω与ἀγαπάω的差异
  choice: 正文均译作“爱”，并以脚注说明希腊语动词的变化
  alternative: 分别译作“爱”与“喜欢／疼爱”，使两者显出不同层次
  rationale: 通用希腊语中这两个动词的语义范围有所重叠，本段的词语变化是否承载明确的神学差别仍有争议。正文不强行判定，脚注则保留解释空间。
- issue: 彼得所说“你知道一切”的分量
  choice: 直译为“你知道一切”
  alternative: 限缩为“这件事你全知道”，或扩写为明确的全知教义陈述
  rationale: 原文πάντα具有广泛而有力的表达。译文既不缩小它，也不加入超出本句的教义说明。
- issue: οἶδα与γινώσκω是否应译出不同的认识方式
  choice: 两者都译为“知道”，并在脚注交代原文用词不同
  alternative: 分别译为“知道”与“了解／认识”
  rationale: 原文变化可能带有细微意味，但上下文不足以确定一种必须明译的区别；强行使用不同汉语词容易替读者作出解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“第三次”“主啊”“你知道一切”等叙事与神学重音；正文不以生硬措辞放大原文中有争议的词汇差异。脚注标记均置于相关句后。
