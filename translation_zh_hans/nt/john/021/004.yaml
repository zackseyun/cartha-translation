language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: zh_hans
  text: 天已经亮了，耶稣站在岸上；可是门徒不知道[a]那是耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有认出那是耶稣”。希腊文直译为“不知道那是耶稣”。
    reason: 词义备选；在本语境中“知道”可带有“认出”的含义，但原文动词本义较宽。
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: 天已经亮了
  rationale: 属格独立结构交代时间背景；“天亮了”以自然现代汉语表达清晨已经来到，ἤδη译作“已经”。δὲ在此是轻微的叙事衔接，不必另加生硬的连接词。
- source_word: ἔστη
  choice: 站在
  rationale: 简明表达ἵστημι不定过去时所叙述的动作及其结果状态。
- source_word: εἰς τὸν αἰγιαλόν
  choice: 在岸上
  rationale: εἰς与站立动词连用时可表达所在位置；αἰγιαλός指岸边或滩岸。“岸上”自然且符合场景。
- source_word: οὐ μέντοι
  choice: 可是……不
  rationale: 保留耶稣已在岸上与门徒仍未知道其身份之间的转折意味。
- source_word: ᾔδεισαν
  choice: 不知道
  rationale: οἶδα本义为“知道”。上下文可含“认出”之意，但正文保留原文较宽泛的措辞，并在脚注列出语境性译法。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词指语境中已知的那群门徒；汉语无需增添原文没有的“他的”。
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: 那是耶稣
  rationale: 用自然汉语表达身份判断，不把ἐστιν误解为单纯表示耶稣在那里。
theological_decisions:
- issue: 复活后的耶稣未被门徒辨认
  choice: 叙述门徒“不知道”那是耶稣，不解释他们未能辨认的原因
  alternative: 译为“没有认出那是耶稣”，或进一步说明其原因
  rationale: 经文本身只陈述门徒当时未能确认耶稣的身份，并未说明是耶稣外貌改变、距离、光线还是门徒的感知所致；译文保留这一神学与叙事张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“天已经亮了”比“清晨已经来到”更符合普通读者的自然表达；分号保留两幅叙事画面之间紧密而带转折的关系。脚注标记置于它所说明的“不知道”之后。
