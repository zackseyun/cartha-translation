base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: zh_hans
  text: 这已经是耶稣从死人中复活后，第三次向门徒显现。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这已经是耶稣从死人中被兴起后，第三次向门徒显现。”原文“被兴起”为被动形式。
    reason: 说明ἐγερθείς的被动语态，并提供自然、完整的替代译法。
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: 这是……第三次
  rationale: τοῦτο回指刚叙述的事件；ἤδη与序数词合用，表示到叙事此处计为第三次。汉语用“这是……第三次”自然传达其指代和计数功能，无须生硬译出“已经”。
- source_word: ἐφανερώθη
  choice: 显现
  rationale: 该词为φανερόω的被动形式，可表达“被显明、显现”。在复活后的相见场景中，“向……显现”既符合现代汉语习惯，也保留约翰文献中显明自身的意味；“被显明”则较生硬。
- source_word: τοῖς μαθηταῖς
  choice: 向门徒
  rationale: 与ἐφανερώθη构成对象关系。原文没有明说“他的”，故正文不增补。
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: 从死人中复活后
  rationale: ἐγερθεὶς是被动分词，指在显现之前已经被兴起；“从死人中复活后”是现代汉语中自然、清楚的复活表述，而脚注保留被动语态的形式信息。
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν的被动语态
  choice: 正文译作“从死人中复活后”
  alternative: “从死人中被唤醒后”或“从死人中被兴起后”
  rationale: 希腊文是被动形式，可能隐含上帝使耶稣复活；但在现代汉语中直译“被兴起”容易被误解为站起或受推举，“被唤醒”也可能弱化死亡与复活的含义。因此正文采用惯用的“复活”，并以脚注说明原文语态，既清楚表达事件，也不抹去源文信息。
- issue: ἐφανερώθη的显明与出现之义
  choice: “向门徒显现”
  alternative: “向门徒显明了自己”
  rationale: “显现”自然适用于复活叙事，并可承载φανερόω的显明意味；不把它缩减为单纯“出现”，也不额外指定显明的方式或目的。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“死人中”保留ἐκ νεκρῶν“从死者当中”的群体性表达；“显现”兼顾约翰文献用词和汉语自然度。
