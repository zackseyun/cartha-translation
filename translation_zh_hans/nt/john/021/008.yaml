  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: zh_hans
  text: 其余的门徒却乘着小船过来；因为他们离岸不远，约二百肘，拖着那张装着鱼的网[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 二百肘约合九十米。原文也可较直译为“鱼的网”；这里可能是指装着鱼的网。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: 其余的门徒却
  rationale: “其余的门徒”准确表达 οἱ ἄλλοι μαθηταί；“却”体现 δέ 与上一节彼得单独行动之间的对照，同时保持叙事自然。
- source_word: τῷ πλοιαρίῳ
  choice: 坐着小船
  rationale: πλοιάριον 是表示较小船只的形式，译作“小船”保留这一语义；“坐着……过来”符合现代汉语对乘船而来的自然表达。
- source_word: ἦλθον
  choice: 过来了
  rationale: 按叙事视角将 ἔρχομαι 的不定过去时译作“过来了”，简洁地表达他们来到耶稣所在之处。
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: 他们离岸不远
  rationale: γάρ 所引出的原因在汉语中可借分号和语序自然体现，不必机械加入“因为”；γῆ 在水上场景中指陆地一侧，译作“岸”比“地”更清楚自然。
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: 约有二百肘
  rationale: ὡς 表示约数；保留古代长度单位“肘”，并在脚注中提供现代公制近似值。“约有”承接“离岸不远”，避免生硬重复。
- source_word: σύροντες
  choice: 拖着
  rationale: 现在分词表示与“过来”同时发生的伴随动作；“拖着”体现 σύρω 所含的牵拉动作及渔网在水中的阻力。
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: 那张装着鱼的网
  rationale: 属格 τῶν ἰχθύων 在此最可能表示网中所装之物；“装着鱼的网”自然表达这一意思，却不额外断言网已“装满”。脚注保留较为字面的另一种表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”承接上节并突出其他门徒与彼得行动方式的对照；用分号呈现 γάρ 引出的解释关系。保留“肘”这一源文化计量单位，并以脚注换算；不把网译成“装满鱼的网”，以免加入原文未明说的程度。
