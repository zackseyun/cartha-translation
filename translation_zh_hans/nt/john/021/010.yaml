base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“把你们刚捕到的一些鱼拿来[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应的译法是：“从你们刚捕到的鱼中拿些来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 这是叙事中的历史现在时；现代汉语叙事用“说”即可自然表达，不必另加过去时标记。
- source_word: Ἐνέγκατε
  choice: 拿……来
  rationale: 该词是复数命令式，要求门徒把鱼带到耶稣这里；“拿……来”在本语境中直接、自然。
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: 鱼拿一些
  rationale: ἀπό与属格在这里表达从整批鱼中取出一部分；汉语用“拿一些”自然体现部分意义。
- source_word: ὀψαρίων
  choice: 鱼
  rationale: ὀψάριον可指作为食物的鱼，有时也含小鱼之意；本节指刚从海里捕获的鱼，译作“鱼”最清楚且不过度限定大小或烹调状态。
- source_word: ὧν ἐπιάσατε νῦν
  choice: 你们刚捕到的
  rationale: 关系从句限定所说的鱼；νῦν在这里强调捕获之事刚刚发生，译作“刚”符合现代汉语表达，也保留其即时性。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“拿……来”保留朝向说话者的动作；“拿一些”清楚表达原文的部分意义。
