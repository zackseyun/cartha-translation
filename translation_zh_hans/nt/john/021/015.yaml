  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: zh_hans
  text: 他们吃过早饭后，耶稣对西门·彼得说：“约翰的儿子西门，你爱我胜过这些吗？”[a]彼得对他说：“主啊，是的，你知道我爱你。[b]”耶稣对他说：“喂养我的小羊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过这些”可能是“比这些人更爱我”，也可能是“爱我胜过这些事物”。希腊文没有明确说明“这些”具体指什么，也没有明确补出比较的方式。
    reason: alternative_reading
  - marker: b
    text: 耶稣问话时用ἀγαπάω（爱），彼得回答时用φιλέω（爱、喜爱）。有些解释者认为两者在这里有所区别，另一些则认为只是用词变化。正文都译作“爱”，以免把原文没有明确表达的差别说得过重。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρίστησαν
  choice: 吃过早饭
  rationale: ἀριστάω指吃早晨的一餐；“吃过早饭”既保留具体含义，也自然表达先后关系。
- source_word: Σίμων Ἰωάννου
  choice: 约翰的儿子西门
  rationale: Ἰωάννου为表父系关系的属格，直译为“约翰的儿子”，不采用源自别处异文传统的“约拿的儿子”。
- source_word: ἀγαπᾷς / φιλῶ
  choice: 爱 / 爱
  rationale: 两个动词在此都可自然译为“爱”。正文不刻意制造程度高低之别，脚注则保留原文用词变化及其解释空间。
- source_word: πλέον τούτων
  choice: 胜过这些
  rationale: 原文省略了比较关系的具体对象。“胜过这些”在中文中简洁自然，并保留“比这些人更爱我”与“爱我胜过这些事物”等可能性。
- source_word: κύριε
  choice: 主啊
  rationale: 在约翰福音的语境中，这是彼得对耶稣带有敬意和信仰分量的称呼；“主啊”比“先生”更合适。
- source_word: Βόσκε
  choice: 喂养
  rationale: βόσκω具体指供给食物、使之得喂养，区别于范围更广的牧养用语。
- source_word: τὰ ἀρνία μου
  choice: 我的小羊
  rationale: ἀρνία指羊羔或幼羊；“我的小羊”语言自然，并保留耶稣对羊群的归属与关怀意象。
theological_decisions:
- issue: 是否在正文中严格区分ἀγαπάω与φιλέω
  choice: 两个动词都译作“爱”，并在脚注说明原文用词不同。
  alternative: 将ἀγαπάω译作“爱”，将φιλέω译作“喜爱”或“有感情”。
  rationale: 约翰是否有意借两个动词表达不同层次的爱，存在争议。若在正文中强行区分，容易加入原文没有明确断定的“更高与较低之爱”；统一译作“爱”而加注，能保留这种张力。
- issue: πλέον τούτων的比较对象
  choice: 译作“胜过这些”，不明确补出比较对象。
  alternative: 译作“比这些人更爱我”，或“爱我胜过这些事物”。
  rationale: 希腊文的比较结构是省略式的，既可能比较彼得与其他门徒爱耶稣的程度，也可能比较彼得对耶稣与对眼前人或事物的爱。正文应保留原有歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吃过早饭”“主啊”“喂养我的小羊”符合当代普通话习惯；保留重复的“对他说”，以体现原文对话结构。
