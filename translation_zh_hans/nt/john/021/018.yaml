source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: zh_hans
  text: 我实实在在地告诉你：你还年轻的时候，自己束上腰带[a]，想去哪里就走到哪里；但等你年老的时候，你要伸出双手[b]，别人要给你束上腰带，并把你带到[c]你不愿意去的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束上腰带”也可译作“束好衣服”。原文动词指把所穿的衣物束紧；前后两次使用同一动词，表现彼得从自己作主到受别人支配。
    reason: lexical_alternative
  - marker: b
    text: “伸出双手”常被理解为暗指彼得将被钉十字架；下一节说明，耶稣这话是在指明彼得将怎样死来荣耀上帝。
    reason: cross_reference
  - marker: c
    text: “带到”也可译作“带去”或“抬去”。原文动词可指把人带往或运往某处，在这里含有身不由己地被带走的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你
  rationale: 以现代汉语中庄重而惯用的约翰式表达传达重复公式的郑重和强调；“实实在在”保留双重强调，且与后面的“告诉你”自然衔接。
- source_word: ὅτε ἦς νεώτερος
  choice: 你年轻的时候
  rationale: 在年龄对比中自然表达比较级 νεώτερος，并与后文“年老的时候”形成清楚对照。
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  choice: 自己束好衣服 / 别人要给你束好衣服
  rationale: ζώννυμι 指束紧、系好所穿的衣物。两处采用同一说法，保留彼得从自主行动转为受人支配的鲜明对照，同时避免在正文中提前解释为捆绑。
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: 想去哪里就走到哪里
  rationale: 这里的 περιπατέω 指实际行走、行动；此译自然地传达随自己意愿行动的自由。
- source_word: ὅταν δὲ γηράσῃς
  choice: 但你年老的时候
  rationale: 以未来指向的时间表达翻译 ὅταν 加虚拟式，并用“但”体现 δέ 所引出的对比。
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: 你要伸出双手
  rationale: 按表层意象直译，不在正文中直接改写为钉十字架；“双手”是现代汉语对复数“手”的自然表达。
- source_word: οἴσει
  choice: 把你带到
  rationale: φέρω 在此可表示带、携往某处。“带到”既符合现代汉语，也保留被他人带往不愿去之处的意味；更强的“抬去”可能性收入脚注。
- source_word: ὅπου οὐ θέλεις
  choice: 你不愿意去的地方
  rationale: 补出汉语所需的“去”和“地方”，清楚表达原文所指的不情愿目的地，而不改变意义。
theological_decisions:
- issue: 是否在正文中把“伸出双手”明确译成钉十字架
  choice: 正文保留“伸出双手”的具体意象
  alternative: 直接译为彼得将被钉十字架
  rationale: 本节本身使用含蓄意象，下一节才由叙述者说明这话指彼得将怎样死。保留原有铺陈次序，避免提前消解文本的含蓄和张力。
- issue: 是否把 ζώσει 解释为“捆绑”
  choice: 按与前半句相同的穿衣语义译为“束好衣服”
  alternative: 译为“捆绑你”
  rationale: 同一动词先用于彼得自己束衣，后用于别人给他束衣，词汇呼应突出自主与受制的反差。“捆绑”虽契合受难语境，却会削弱这一直接呼应并增加解释性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留耶稣宣告的郑重感，并以“自己……别人……”和“想去……不愿意去……”两组对照凸显原文结构。正文不提前明说钉十字架，把相关解释置于脚注。
