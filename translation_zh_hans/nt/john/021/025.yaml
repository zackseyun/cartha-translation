  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: zh_hans
  text: 耶稣所做的还有许多别的事。这些事若一件一件地写下来，我想，连世界本身也容纳不下所写的书[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容纳不下所写的书”也可译作“没有地方容纳那些将要写成的书”。希腊语动词既可表示“有地方容纳”，也可表示“容纳”；这里的分词在假设语境中也可按将产生的结果来表达。
    reason: 说明χωρήσειν的词义范围，以及τὰ γραφόμενα βιβλία在假设语境中的时态表达。
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: 还有许多别的事
  rationale: δὲ在这里是轻微的承接语气，不必生硬译出；καὶ与ἄλλα πολλὰ共同表达除已记载之事以外，另有许多事。
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: 耶稣所做的
  rationale: ποιέω在此泛指耶稣的行动和事迹，用“所做的”自然且范围适当。
- source_word: ἅτινα
  choice: 这些事
  rationale: 承接前面的“许多别的事”，另起一句可使现代汉语清楚流畅，同时保留解释性关系。
- source_word: ἐὰν γράφηται
  choice: 若……写下来
  rationale: ἐάν加虚拟式表达假设条件；被动形式在汉语中以不定施事的“写下来”自然呈现。
- source_word: καθ’ ἕν
  choice: 一件一件地
  rationale: 保留原文逐项、逐一记录的分配意味。
- source_word: οὐδ’ αὐτὸν τὸν κόσμον
  choice: 恐怕连世界本身也
  rationale: “连……也”体现οὐδέ的递进否定，“本身”保留αὐτόν的强调作用；“恐怕”与后面的判断配合，不把修辞夸张误作精确容量陈述。
- source_word: οἶμαι
  choice: 我想
  rationale: 保留作者第一人称的插语及其沉思、推想的语气。
- source_word: χωρήσειν
  choice: 容纳不下
  rationale: χωρέω可表示“有地方容纳”或“容纳”；“容纳不下”既自然，又保留空间容量的形象。
- source_word: τὰ γραφόμενα βιβλία
  choice: 所写的书
  rationale: 以简洁自然的汉语表达被动分词；在假设语境中既可指写作过程中产生的书，也可理解为将要写成的书，相关语义在脚注中说明。
theological_decisions:
- issue: 世界无法容纳书卷的修辞性夸张
  choice: 保留“连世界本身也容纳不下”的完整意象
  alternative: 意译为“要写的书将多得数不清”
  rationale: 原文以强烈的空间性夸张为福音书作结。保留这一形象，既不将它扁平化为普通的数量表达，也不替读者规定应按字面容量理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一件一件地写下来”贴近日常表达，“世界本身”“容纳不下”则保留结语的宏大修辞。将希腊语关系结构拆为两句，避免欧化长句而不改变逻辑关系。
