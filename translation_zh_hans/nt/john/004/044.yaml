  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: zh_hans
  text: 因为耶稣自己作证说：“先知在自己的家乡[a]不受尊重。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“本乡”、“本地”。希腊语πατρίς可指一个人的家乡、故乡或本地区。
    reason: 词义有多种可能；脚注保留其地理范围的开放性。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 此词引出对上下文的解释；“因为”自然保留了原文的因由或说明关系。
- source_word: αὐτὸς ... Ἰησοῦς
  choice: 耶稣自己
  rationale: 保留αὐτός对主语“耶稣”的强调，同时符合现代汉语表达。
- source_word: ἐμαρτύρησεν
  choice: 作证说
  rationale: “作证”保留约翰福音中重要的见证语汇；加“说”可自然引出证言内容。
- source_word: ὅτι
  choice: 说
  rationale: 在汉语中以“作证说”自然引出其证言的内容。
- source_word: προφήτης
  choice: 先知
  rationale: 汉语名词不需冠词；此处自然表达泛指及格言性质。
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: 在自己的家乡
  rationale: “家乡”可指本乡、本地或故乡，既自然易懂，也不武断限定为犹太、加利利或拿撒勒。
- source_word: τιμὴν οὐκ ἔχει
  choice: 不受尊重
  rationale: 这是自然的现代汉语表达，准确传达没有得到尊荣或敬重之意；较之直译“没有尊荣”，用于人际处境更清楚。
theological_decisions:
- issue: 约翰叙事中“自己的家乡”所指的地点与范围
  choice: 正文保留概括性的“自己的家乡”，不指定具体地点。
  alternative: 明确解释为犹太、加利利，或拿撒勒及其周边地区。
  rationale: 原句以一般性格言表述，并未在本节明确说明地理所指；保留宽泛措辞可避免消解叙事中的解释张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“因为”保留与上下文的解释关系；“耶稣自己”体现强调；引号标明耶稣所作证的内容。
