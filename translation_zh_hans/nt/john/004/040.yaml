  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: zh_hans
  text: 于是，撒玛利亚人来到他那里时，就请求[a]他留在他们那里；他便在那里住了两天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请求”所译的希腊文动词采用未完成时，也可译作“不断请求”或“一再请求”。
    reason: 说明希腊文未完成时可能表达持续或反复的请求，同时保留其语义开放性。
lexical_decisions:
- source_word: ὡς οὖν
  choice: 于是
  rationale: 兼顾οὖν承接上文的顺承意味与ὡς所引出的时间关系；中文用“于是”衔接自然。
- source_word: ἦλθον πρὸς αὐτὸν
  choice: 来到他那里
  rationale: 准确表达向某人而来的动作，也符合现代汉语叙事习惯。
- source_word: οἱ Σαμαρῖται
  choice: 撒玛利亚人
  rationale: 直接译出族群称谓，不增添原文没有的限定。
- source_word: ἠρώτων
  choice: 请求
  rationale: 该词在此表示提出请求；正文采用自然的汉语表达，未完成时可能含有持续或反复意味，另在脚注说明。
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: 留在他们那里
  rationale: μένω译为“留在”，παρά加与格表达留在他们身边或他们中间；此译法自然且不作过度解释。
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: 他便在那里住了
  rationale: 再次体现μένω的停留含义，并明确译出ἐκεῖ；因后接“两天”，汉语用“住了”更自然。
- source_word: δύο ἡμέρας
  choice: 两天
  rationale: 直接表达时长宾格所指的持续时间。
