base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: zh_hans
  text: 过了那两天，耶稣离开那里，往加利利去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “往加利利去”也可译作“到加利利去”。
    reason: εἰς既可侧重朝向目的地，也可自然表达抵达或进入该地；两种译法在此意义相近。
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: 过了那两天
  rationale: μετά加宾格表示时间上的“在……之后”；定冠词指向上文所说耶稣在撒马利亚停留的两天。δέ只是轻微承接，中文不必另译“但”或“而”。
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: ἐξέρχομαι在此表示从先前所在之处动身离去；“离开”符合现代汉语行程叙事，也避免生硬直译为“出去”。
- source_word: ἐκεῖθεν
  choice: 那里
  rationale: 表示从前文所述地点出发；与“离开”搭配时，“离开那里”自然且准确。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 往加利利去
  rationale: εἰς表示朝目的地移动；“往加利利去”自然表达方向和目的地，而不额外强调越过边界进入该地。
- source_word: implicit subject of ἐξῆλθεν
  choice: 耶稣
  rationale: 希腊文动词以第三人称单数承接上下文中的耶稣；现代汉语在本句明说主语可避免歧义并使叙事流畅。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“那两天”明确回指上文的两日停留；补出承前省略的主语“耶稣”。脚注标记置于它实际说明的“往加利利去”之后。
