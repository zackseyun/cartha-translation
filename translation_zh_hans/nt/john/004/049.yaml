  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: zh_hans
  text: 那位王室官员对他说：“主啊，求你在我的孩子死以前下去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主啊”也可译作“先生”。希腊语κύριε既可作尊敬的称呼，也可意为“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: 那位王室官员
  rationale: 该词在这里作名词用，指与君王或王室有关的官员。“王室官员”既保留其宫廷关联，也避免把他误解为单指社会阶层的“贵族”或“贵人”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε既可作为尊称，相当于“先生”，也可表达“主”的较丰富含义。正文译作“主啊”，保留《约翰福音》中这一称呼可能具有的双重意味，并用脚注说明较弱的礼貌称谓义。
- source_word: κατάβηθι
  choice: 赶快下去吧
  rationale: 该命令式本义为“下去”，符合从迦拿往迦百农的地势与行程方向。语境中的紧迫请求用“赶快”和语气词“吧”自然传达；“赶快”源于整句所表达的急迫性，并非该动词独立的词义。
- source_word: πρὶν ἀποθανεῖν
  choice: 趁……还没有死
  rationale: πρίν加不定式表示某事发生以前。现代汉语用“趁……还没有……”能自然表达父亲催促耶稣务必在孩子死亡前行动的时间界限。
- source_word: τὸ παιδίον μου
  choice: 我的孩子
  rationale: παιδίον指孩子或年幼的孩子。本节没有用明确表示儿子的υἱός，因此不在正文中过度指定性别。
- source_word: λέγει πρὸς αὐτόν
  choice: 对他说
  rationale: 希腊文用历史现在时引出对话；现代汉语叙事中“对他说”自然清楚，无须机械保留现在时形式。
theological_decisions:
- issue: 对耶稣的称呼κύριε应如何翻译
  choice: 主啊
  alternative: 先生
  rationale: 直接语境允许将其理解为礼貌称呼，但《约翰福音》的叙事也容许“主”这一更丰富的意味。正文保留这种潜在张力，不把说话者的认识限定为纯粹礼貌，也不声称他此时已经作出完整的神学告白；脚注列出“先生”。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“求你……赶快下去吧”体现父亲恳求时的迫切感；保留“下去”的地理方向。“孩子”忠实保留原文在本节中的性别非特指。脚注标记置于整句引语之后。
