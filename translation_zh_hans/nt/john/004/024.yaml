id: JHN.4.24
reference: John 4:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: zh_hans
  text: 神是灵[b]；敬拜他的人，必须在灵和真理中敬拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在圣灵和真理中敬拜。”希腊原文可以作这一较具体的理解；正文的译法则保留了这个短语较宽广的含义。
    reason: alternative_reading
  - marker: b
    text: “神是灵”是在说明神的本质，并不是说神只是众多灵类存在中的一个。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: 灵
  rationale: 这里是置于带冠词主语“神”之前的无冠词表语，主要说明神的本质或属性；译作“灵”而不译作“一个灵体”，避免把神说成众多灵类存在中的一个。
- source_word: ὁ θεός
  choice: 神
  rationale: 冠词标明本句主语；“神”是现代汉语中对此处 θεός 的标准译法。
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: 敬拜他的人
  rationale: 带冠词的现在时分词作名词使用，泛指敬拜神的人；此译法自然，并保留其一般性。
- source_word: ἐν πνεύματι
  choice: 在灵……中
  rationale: πνεύματι 无冠词，并与同样无冠词的 ἀληθείᾳ 并列。正文不把它明确限定为“圣灵”，也不缩减为单纯的内心真诚，以保留原文的广度与歧义。
- source_word: ἀληθείᾳ
  choice: 真理
  rationale: “真理”既符合约翰著作中 ἀλήθεια 的常见用法，也可涵盖真实及神所启示之真理的意味；“诚实”会过度收窄为人的诚恳。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达必要性和约束力，且符合现代汉语表达。
- source_word: προσκυνεῖν
  choice: 敬拜
  rationale: 在本语境中指向神所献的敬拜；不必把该动词历史上俯伏下拜的身体动作明确加入正文。
theological_decisions:
- issue: “神是灵”的含义
  choice: 将其译为关于神本质的质性陈述：“神是灵”。
  alternative: “神是一个灵体。”
  rationale: 原文词序以及 πνεῦμα 不带冠词，支持质性表语的理解。正文因此不暗示神只是众多灵类存在中的一个，也不超出原文进一步界定神的本质。
- issue: “在灵和真理中”的所指
  choice: 正文保留“灵”的宽广表达，不明确指定为圣灵，也不解释成仅仅发自内心或真诚。
  alternative: “在圣灵和真理中”；“以真诚的心敬拜”。
  rationale: πνεύματι 和 ἀληθείᾳ 均无冠词且彼此并列，原文容许更具体的圣灵理解，却没有明说；直译式表达较能保存其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在灵和真理中敬拜”略带原文式结构，但能避免“用心灵”把 πνεῦμα 过早限定为人的内在心灵，也避免传统译法“诚实”削弱 ἀλήθεια 的“真理”含义。分号清楚连接神的本质与敬拜的必要方式。
