  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: zh_hans
  text: 但谁喝我所要赐给他的水，就永远不会渴；我所要赐给他的水，反而要在他里面成为泉源，涌流不息，直达永生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: 就永远不会渴
  rationale: οὐ μή加强否定，εἰς τὸν αἰῶνα表示“永远、直到永世”；这样既保留强烈的永久否定，也符合现代汉语表达。
- source_word: πηγὴ ὕδατος
  choice: 泉源
  rationale: πηγή指涌出水的泉或泉源；“泉源”自然庄重，也能与前文所赐的“水”衔接。
- source_word: ἁλλομένου
  choice: 不断涌流
  rationale: 该分词描写水跃动、涌出的动态；“不断涌流”在汉语中清楚传达持续活跃的泉水意象。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 直至永生
  rationale: εἰς可表达趋向或结果。“直至永生”保留泉水朝向永生涌流的意象，不将其过度解释为单一因果关系。
theological_decisions:
- issue: “永远不会渴”的绝对性
  choice: 保留强烈、永久的否定：“就永远不会渴”
  alternative: “就不再渴”
  rationale: 原文以οὐ μή和εἰς τὸν αἰῶνα共同加强否定，不宜削弱；其属灵意义由上下文展开，本节不另加解释。
- issue: 泉水与永生之间的关系
  choice: 译作“不断涌流，直至永生”
  alternative: “涌出永生”或“带来永生”
  rationale: 原文εἰς保有趋向、终点或结果的张力；所选译法避免明确加入原文未直接规定的因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但……反而……”呈现δέ与ἀλλά的对照；重复“我所要赐给他的水”，保留原文强调。
