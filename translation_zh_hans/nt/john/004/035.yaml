id: JHN.4.35
reference: John 4:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: zh_hans
  text: 你们不是说：‘还有四个月，收割的时候就到了’吗？看，我告诉你们：抬起眼来看看田野，田野已经发白[a]，可以收割了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“田野已经成熟，可以收割了。”希腊文直译为“田野已经白了”，以视觉景象表示庄稼已可收割。
    reason: 说明“发白”的字面意象及“成熟”的释义性译法。
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: 你们不是说……吗
  rationale: 用现代汉语的反问句式表达希腊语否定疑问句，并保留第二人称复数主语所带的轻微强调。
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: 还有四个月
  rationale: 自然表达距离收割尚余四个月的时间间隔，不把希腊语形容词结构生硬直译出来。
- source_word: ὁ θερισμὸς ἔρχεται
  choice: 收割的时候就到了
  rationale: “收割的时候”比单说“收割”更自然地表示收获期来临；“就到了”与前面的时间间隔相衔接。
- source_word: ἰδοὺ
  choice: 看
  rationale: 作为引人注意的话语标记，简洁、现代，同时保留原文的提示力度。
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: 抬起眼来
  rationale: 保留原文具体而鲜明的身体动作意象，而不简化成一般性的“看”。
- source_word: θεάσασθε
  choice: 看看
  rationale: 表达有意识地观察；与“抬起眼来”连用符合自然汉语。
- source_word: τὰς χώρας
  choice: 田野
  rationale: 收割语境中指可供观看的农田；“田野”既保留广阔的视觉画面，也适合复数所表达的整体景象。
- source_word: λευκαί εἰσιν
  choice: 田野已经发白
  rationale: 保留希腊语“白”的视觉意象；“发白”在汉语中比“是白的”更自然，也能暗示庄稼已进入可收割状态，但不直接以解释取代原文。
- source_word: πρὸς θερισμόν
  choice: 可以收割了
  rationale: 自然表达田野已达到收割条件；既传达 πρὸς 的趋向或适合关系，也保留收割意象。
- source_word: ἤδη
  choice: 已经
  rationale: 突出此刻田野已具备收割条件，与前半句所说仍需等待四个月形成鲜明对比。
theological_decisions:
- issue: 收割之言在正文中应按字面农业景象表达，还是直接点明属灵所指
  choice: 保留田野与收割的农业意象，不在译文中直接改写为人已预备好被召聚
  alternative: 解释性译作“人们已经预备好，可以被召聚了”等
  rationale: 上下文容许读者理解其宣教性的比喻所指，但本节的希腊文本仍明确使用田野和收割的意象。译文应保存这一比喻及其张力，而不把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看”保留提示语气而避免过度古雅；“抬起眼来看看田野”保留原文画面感。“发白”保存希腊文真实的颜色意象，脚注则交代其成熟可收割的含义。
