source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: zh_hans
  text: 然而，时候将到，如今就是了；那时，真正的敬拜者要在灵和真理中[a]敬拜父，因为父正寻找这样敬拜他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在灵……中”也可理解为“在圣灵里”；希腊文既可指靠圣灵而敬拜，也可指在人的灵里敬拜，或指具有属灵实际的敬拜。
    reason: 保留ἐν πνεύματι在语法和神学上的多重可能，不在正文中作排他性判断。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文关于敬拜地点的讨论并形成转折；“然而”自然、庄重。
- source_word: ἔρχεται ὥρα
  choice: 时候将到
  rationale: “时候”符合现代汉语习惯，也保留约翰著作中“时刻/时候”的末世性意味；汉语无需借不定冠词体现希腊文无冠词。
- source_word: καὶ νῦν ἐστιν
  choice: 如今就是了
  rationale: 表达所预告的时期已经临到的现今实现性，并与“将到”形成张力。
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: 真正敬拜的人
  rationale: 保留ἀληθινοί所含真实、名副其实的意思，又避免生硬的名词化表达。
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: 要……敬拜父
  rationale: 以“要”表达将来时；“父”按约翰语境作为对上帝的称谓。
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: 在灵和真理中
  rationale: 保留两个名词及同一介词所表达的并列关系，不将“灵”明确限定为人的灵或圣灵，也不把“真理”弱化为副词“真诚地”。
- source_word: καὶ γὰρ
  choice: 因为
  rationale: γάρ引出理由；καί的强调意味由整句语势和“正”共同自然体现，避免不自然地逐词对应。
- source_word: ζητεῖ
  choice: 正寻找
  rationale: 现在时结合“如今就是了”的语境，用进行体自然表达父现今的寻找。
- source_word: τοιούτους τοὺς προσκυνοῦντας αὐτόν
  choice: 这样敬拜他的人
  rationale: 把指示词与限定性分词合并为自然汉语，清楚指向具有上述特征的敬拜者。
theological_decisions:
- issue: ἐν πνεύματι中πνεῦμα的所指
  choice: 正文译作“在灵……中”，不明确加上“圣”或“人的”。
  alternative: “在圣灵里”；“从心灵里”；“以属灵的方式”
  rationale: 希腊文此处无冠词，语境容许圣灵、人的灵以及属灵领域或性质等相互关联的理解；正文保留这种神学张力，脚注说明。
- issue: ἀληθινοὶ προσκυνηταί的范围
  choice: 译作“真正敬拜的人”，表达真实、名副其实的性质。
  alternative: “真实的敬拜者”；“真正的敬拜者”
  rationale: 保留约翰著作中ἀληθινός指向真实或终极实在的意味，同时不引入宗派性的群体划分。
- issue: “时候将到”与“如今就是了”的时间张力
  choice: 并列保留将来与已经临到两方面。
  alternative: 将两者整合为“时候已经来到”
  rationale: 原文刻意并置未来性和现今实现性；不应在译文中消解这种已然与未然的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬拜父”延续汉语圣经语体但不过度文言化；分号呈现前后解释关系。脚注标记[a]紧随其所解释的“在灵和真理中敬拜父”之后。
