  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: zh_hans
  text: 那女人对他说：“先生[a]，我看出你是个先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主”。希腊语κύριε既可作表示尊敬的称呼，也可意为“主”。
    reason: 保留κύριε在礼貌尊称与可能具有较强宗教含义的称呼之间的语义歧义。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事中用“说”即可自然表达，不必刻意标示时态。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与言说动词搭配，清楚表达话语所指向的对象。
- source_word: ἡ γυνή
  choice: 那女人
  rationale: 指上下文中的撒玛利亚妇人；“那女人”既承接具体所指，也不误解为“妻子”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριε 的传统核心译法“主”，并以语气词“啊”自然表达呼语；此处也可能只是尊称，另见脚注。
- source_word: θεωρῶ
  choice: 我看出
  rationale: 此处表示根据耶稣刚才所显明之事而作出的辨认或判断；“看出”比单纯“看见”更准确，也符合现代汉语。
- source_word: ὅτι
  choice: （引出宾语从句，不另译）
  rationale: 现代汉语在“看出”之后可直接接判断内容，无须机械译出“that”。
- source_word: προφήτης
  choice: 先知
  rationale: 无冠词的表语在汉语中自然译为“是个先知”，表达她认出耶稣具有先知身份，而不特指“那位先知”。
- source_word: σύ
  choice: 你
  rationale: 明确保留第二人称；希腊文显式代词带有一定强调，但汉语无需另加“正是”等词，以免过度强化。
theological_decisions:
- issue: 对耶稣的称呼 κύριε
  choice: 主啊
  alternative: 先生
  rationale: 上下文容许将其理解为礼貌尊称，未必已经是完整的基督论认信；正文保留“主”的传统译法，同时用脚注呈现“先生”的可能，以保留原文的语义张力。
- issue: προφήτης 是否指特定的“那位先知”
  choice: 是个先知
  alternative: 是那位先知
  rationale: 原文为无冠词表语，语境表明妇人认出耶稣是先知，却没有明确说他就是申命记传统中的特定“那位先知”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我看出”表达由事实而来的识别；“是个先知”避免误导为特指“那位先知”。脚注标记紧随有歧义的称呼之后。
