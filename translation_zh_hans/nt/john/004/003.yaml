  language: zh_hans
  text: 他离开犹太地，又往加利利去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回到加利利去。”希腊语πάλιν可译为“又、再次”，在这里也可能指返回。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: 离开
  rationale: 此处ἀφίημι以“犹太”为直接宾语，表示离开一个地方；“离开”自然、准确。
- source_word: τὴν Ἰουδαίαν
  choice: 犹太
  rationale: 指福音书时代的地理区域；“犹太”是现代中文圣经语境中通行而简洁的地名。
- source_word: ἀπῆλθεν
  choice: 去
  rationale: ἀπέρχομαι表示离去、前往；与“回到……去”组合，符合现代汉语行程叙述。
- source_word: πάλιν
  choice: 回到
  rationale: πάλιν本可表示“又、再次”，但在此行程语境中自然表达返回先前所在之地，因此译为“回到”，同时以脚注保留较形式对应的译法。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 到加利利去
  rationale: εἰς表示向目的地移动；“到加利利去”自然传达前往该地区的意思。
