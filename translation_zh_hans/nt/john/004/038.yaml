  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: zh_hans
  text: 我差你们去收割[a]那些你们未曾为之劳苦的；别人已经劳苦了，而你们已经进入他们的劳苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收割”也可译作“收获”。
    reason: lexical_alternative
  - marker: b
    text: 也可较解释性地译作“你们分享了他们劳苦的成果”或“你们参与了他们的工作”。希腊原文较直译为“你们进入了他们的劳苦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: 差……去
  rationale: 以简明自然的汉语表达不定过去时所指的差遣行动，并保留其使命意味，不扩译为“委派”。
- source_word: θερίζειν
  choice: 收割
  rationale: 保留上下文中的农耕比喻，也与前人的劳苦形成鲜明联系。
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: 你们不曾为之劳苦的
  rationale: 用“为之”明确劳苦与所收割之物的关系；“不曾……劳苦”传达完成时所强调的先前劳动及其当前关联，同时不擅自补出“庄稼”或“成果”。
- source_word: ἄλλοι κεκοπιάκασιν
  choice: 别人劳苦了
  rationale: “别人”自然对应复数实词用法；“劳苦了”既承接前句同一词根，也表达先前劳动已经发生。
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: 你们已经进入他们的劳苦之中
  rationale: 尽量保留原文不寻常但有意义的“进入……劳苦”说法；“已经”体现完成时的现今结果，不在正文中将其解释成劳动成果或共同参与。
- source_word: ἐγὼ ... ὑμεῖς
  choice: 我……你们
  rationale: 保留明示的人称代词，让原文中“我”与“你们”的对照自然呈现，不另加强调。
theological_decisions:
- issue: “别人”的具体所指
  choice: 保持泛指，不在正文中说明他们是谁
  alternative: 特指众先知、施洗约翰、耶稣本人，或先前的见证人
  rationale: 本节没有明确界定“别人”，因此保留其开放性，避免把某一种解释写进译文。
- issue: “进入他们的劳苦”所表达的关系
  choice: 保留“进入……劳苦”的原文意象
  alternative: 解释为享受他们劳苦的成果，或参与他们的工作
  rationale: 原文明确说进入他们的“劳苦”，既可能着眼于承接其工作，也可能包含分享其成果；直译式正文配以脚注可保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“进入他们的劳苦之中”在汉语中略显不寻常，但这是有意保留原文表达；脚注提供较顺畅、也较具解释性的译法。
