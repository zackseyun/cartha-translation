base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: zh_hans
  text: 耶稣却对他们说[a]：“我有食物可吃，是你们不知道的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我有可吃的东西，是你们不知道的。”耶稣在这里使用比喻，正如下文所表明的。
    reason: 词汇替代译法，并提示上下文中的比喻用法而不在正文提前解释。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示叙事中的轻微转折，承接门徒先前的劝说，也引出耶稣出人意料的回答。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 自然、直接地表达 λέγω 加间接宾语的结构；为使独立经节中的指代清楚，补明主语“耶稣”。
- source_word: Ἐγὼ
  choice: 我
  rationale: 希腊文显式代词带有一定强调和对比；现代汉语用“我”并结合语序即可自然体现，无须译成“我自己”。
- source_word: βρῶσιν
  choice: 食物
  rationale: 此处指可吃的食物，同时承载下文所揭示的比喻意义；保留具体词语，不提前解释。
- source_word: ἔχω φαγεῖν
  choice: 有食物吃
  rationale: 贴近“有……可吃”的结构，也是自然的现代汉语表达。
- source_word: ἣν
  choice: 是……的
  rationale: 以汉语关系分句“是你们不知道的”回指“食物”，既自然又保留原文的限定关系。
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: 你们不知道
  rationale: 保留显式的“你们”所形成的对比，并直接对应 οὐκ οἴδατε，不额外加入“关于”。
theological_decisions:
- issue: 耶稣所说“食物”的比喻意义
  choice: 正文保留“食物”这一字面词语，不在本节中明说其所指。
  alternative: 将其解释为“遵行父旨意所得的滋养”或“要做的工作”。
  rationale: 下文才说明这一比喻；本节有意保留门徒尚未理解的张力，译文不应提前消解。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“食物吃”保留原文 βρῶσιν ἔχω φαγεῖν 的表达重点；“是你们不知道的”虽略带书面色彩，但清楚自然，并能保持关系代词对“食物”的回指。
