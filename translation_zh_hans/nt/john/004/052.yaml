base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: zh_hans
  text: 于是，他问他们，他的儿子是在什么时辰开始好转的。他们对他说：“昨天第七时[a]，他的烧就退了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第七时”。若按从日出起算的计时法，约为下午一点；也有人认为约翰福音此处采用不同的计时法。
    reason: 保留原文未说明计时制度所造成的歧义，并仅在脚注中提供常见的换算说明。
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: 于是，他向他们问清楚
  rationale: πυνθάνομαι表示询问、打听；“问清楚”自然体现父亲查问具体时刻的语境，οὖν译作“于是”以承接上文。
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: 向他们问清楚……的时辰
  rationale: παρά加属格表信息来源；汉语用“向他们问”自然表达。ὥρα在此指特定时刻，译作较庄重且适合经文语体的“时辰”。
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: 孩子开始好转的
  rationale: κομψότερον ἔχειν是健康状况改善的表达；结合所问的具体起始时刻，“开始好转”准确而自然。希腊文未明说主语身份，汉语补出上文所指的“孩子”以避免代词混淆。
- source_word: εἶπαν οὖν αὐτῷ
  choice: 他们对他说
  rationale: 自然对应仆人向父亲作答；此处第二个οὖν主要推动叙事，汉语无需重复显性连接词。
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: 昨天下午一点钟[a]
  rationale: Ἐχθὲς是“昨天”；ὥραν ἑβδόμην按从日出起算的常见犹太白昼计时约为下午一点。正文采用现代读者易懂的钟点，并用脚注保留计时制度的不确定性。
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: 烧就退了
  rationale: 希腊文直译为“热病离开了他”；现代汉语通常说“烧退了”，既自然又准确。“就”突出所报告的时间点。
theological_decisions:
- issue: “第七时”的计时方式
  choice: 正文译作“下午一点钟”，并加脚注说明
  alternative: 保留“第七时”；或按另一种计时理解为晚上七点左右
  rationale: 若按从日出起算的常见白昼计时，“第七时”约为下午一点；但本节本身没有明定计时制度，约翰福音中的计时方式也存在不同理解，因此以脚注保存真实歧义，不让时间换算承载超出原文的神学结论。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“问清楚”“开始好转”“烧就退了”符合当代普通话习惯；脚注承载古代计时背景，正文保持流畅。
