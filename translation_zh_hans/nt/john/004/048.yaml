id: JHN.4.48
reference: John 4:48
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: zh_hans
  text: 于是，耶稣对他说：“你们若不看见神迹奇事，就绝不会信。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”和“信”在希腊文中都是复数，因此耶稣的话很可能不只针对这位官员，也涉及更广泛的一群人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事，既可表达由前情引出的回应，也符合现代汉语叙事习惯。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: 自然呈现耶稣向那位官员说话的单数叙事框架。
- source_word: Ἐὰν μὴ
  choice: 若不
  rationale: 简洁、庄重地表达否定条件，保留原文“除非……否则……”的条件关系。
- source_word: σημεῖα
  choice: 神迹
  rationale: 约翰福音中的 σημεῖον 指具有指向意义的超常作为；“神迹”是现代中文圣经语境中自然且为普通读者熟悉的对应词。
- source_word: τέρατα
  choice: 奇事
  rationale: 与“神迹”构成传统且易懂的搭配，表达令人惊异的超常现象，同时不过度解释。
- source_word: ἴδητε
  choice: 你们……看见
  rationale: 明确保留希腊文第二人称复数，显示话语范围可能超出眼前这位官员。条件句中以“看见”自然表达不定过去时虚拟语气。
- source_word: οὐ μὴ πιστεύσητε
  choice: 你们……就绝不会信
  rationale: “绝不会”体现 οὐ μή 的强烈否定语气；“信”保持约翰福音中 πιστεύω 的常用表达及其开放的神学内涵。
theological_decisions:
- issue: 受话者的数与范围
  choice: 叙事引语使用单数“对他说”，耶稣的话则明确使用复数“你们”。
  alternative: 把整句话仅理解为针对官员个人，或在正文中扩写为“你们这些人”。
  rationale: πρὸς αὐτόν 是单数，表明耶稣正在对官员说话；但 ἴδητε 和 πιστεύσητε 均为复数，说明这句话可能同时指向更广泛的人群或共同心态。中文可直接借“你们”保留这一张力，无须增添解释性措辞。
- issue: 强烈否定的力度
  choice: 译作“绝不会信”。
  alternative: 译作“不会信”或“总不肯信”。
  rationale: οὐ μή 加虚拟语气表达强调否定；“绝不会”忠实传达其力度，而“总不肯”会额外引入意志层面的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神迹奇事”保留约翰语境中的传统术语组合；正文明确区分单数叙事对象与复数话语对象。
