base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: zh_hans
  text: 耶稣对她说[a]：“去叫你的丈夫，然后到这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按希腊文现在时译作“耶稣对她说”。这里的现在时是叙事性现在时；现代汉语的“说”通常不标明时态。
    reason: 说明希腊文叙事性现在时及汉语不标示时态的自然表达。
lexical_decisions:
- source_word: Λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时推进故事。现代汉语叙事中的“说”本身通常不标明时态，既自然，也无需在正文中强行改成过去时。
- source_word: αὐτῇ
  choice: 对她
  rationale: 与言说动词搭配，自然表达与格代词所标明的说话对象。
- source_word: Ὕπαγε
  choice: 去
  rationale: 命令式要求她离开此处去执行下一项行动；“去”简洁自然，未额外加入“走开”的语气。
- source_word: φώνησον
  choice: 叫……来
  rationale: 此处指叫某人前来；汉语“叫……来”比单独的“叫”更清楚，也比“召来”更符合日常对话。
- source_word: τὸν ἄνδρα σου
  choice: 你丈夫
  rationale: ἀνήρ可指“男人”或“丈夫”；结合所有格“你的”和随后经文对婚姻关系的讨论，此处以“丈夫”为合乎语境的意义。
- source_word: καὶ
  choice: 再
  rationale: 连接两个依次执行的命令。现代汉语用“再”自然表达先叫丈夫、然后前来的动作次序。
- source_word: ἐλθὲ ἐνθάδε
  choice: 到这里来
  rationale: 准确表达“来”与地点副词“这里”；不译作“回来”，以免加入原文没有明说的返回意味。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。“叫你丈夫来”保持对话语气；“再到这里来”清楚呈现两个命令的顺序。为明确说话者并与上下文衔接，补出主语“耶稣”，其所指由语境确定。
