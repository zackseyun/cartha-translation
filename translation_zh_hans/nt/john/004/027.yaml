  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: zh_hans
  text: 就在这时，他的门徒回来了。他们见他正和一个女人说话，就很惊讶。然而，没有人问：“你在寻找什么？[a]”或“你为什么和她说话？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你想要什么？”
    reason: lexical_alternative
  - marker: b
    text: 直译：“你和她谈什么？”按上下文也可理解为询问说话的原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: 就在这时
  rationale: 这里是时间用法，表示谈话正在进行之际；“就在这时”自然地传达叙事中的即时衔接。
- source_word: ἦλθαν
  choice: 回来了
  rationale: 动词本义是“来了”；从门徒先前离开、如今返回耶稣所在之处的叙事视角看，“回来了”是自然的汉语表达。
- source_word: ἐθαύμαζον
  choice: 就很惊讶
  rationale: 未完成时描写门徒当时持续的惊讶反应；“很惊讶”现代、清楚，又不额外说明惊讶的社会原因。
- source_word: μετὰ γυναικὸς
  choice: 和一个女人
  rationale: γυνή在此没有冠词，按语境指一名女人；译作“一个女人”保留其不定指性质，不误译为“妻子”。
- source_word: ἐλάλει
  choice: 正……说话
  rationale: 未完成时表示当时正在进行的谈话；“正……说话”在现代汉语中清楚体现持续状态。
- source_word: μέντοι
  choice: 然而
  rationale: 表达让步转折：门徒虽然惊讶，却没有人把疑问说出口。
- source_word: Τί ζητεῖς;
  choice: 你想要什么？
  rationale: ζητέω可指“寻找、寻求”，但在此省略宾语，问题可能是向耶稣询问他想从这女人那里得到什么；“你想要什么？”自然且保留对象未明的含混。
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: 你为什么和她说话？
  rationale: 字面形式近于“你和她说什么？”，但τί在这里的语用意义自然可理解为询问原因；正文采用通顺汉语，脚注保留字面可能。
theological_decisions:
- issue: 门徒因耶稣与女人说话而惊讶的社会含义
  choice: 只陈述他们因他与一个女人说话而惊讶，不在正文补充具体原因。
  alternative: 在正文中明说性别习俗、犹太人与撒玛利亚人的隔阂，或相关禁忌。
  rationale: 希腊文没有说明他们惊讶的具体社会或宗教原因。译文应保留经文的克制和张力，不把合理的背景解释写入正文。
- issue: 门徒没有说出口的第一个问题所指对象
  choice: 译作“你想要什么？”，不补出“从她那里”。
  alternative: 译作“你想从她那里得到什么？”或“你在找什么？”
  rationale: 原文没有明说ζητεῖς的宾语。正文不补足对象，以保留原句的歧义；脚注提示较贴近字面的另一种译法。
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。“就在这时”推进叙事，“正……说话”体现未完成时的进行状态。正文没有加入原文未明说的社会背景；两个脚注分别保留ζητέω的字面词义和τί λαλεῖς的形式歧义。
