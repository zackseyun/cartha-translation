  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: zh_hans
  text: 于是，那女人留下自己的水罐，进城去，对城里的人说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: 放下
  rationale: 在此语境中表示她把水罐留在原处；“放下”自然简洁，也能体现她暂时撇下取水用具。
- source_word: ὑδρίαν
  choice: 水罐
  rationale: 指用来盛水、取水的罐子；“水罐”是现代普通读者易懂且准确的表达。
- source_word: πόλιν
  choice: 城
  rationale: 与上下文中的撒玛利亚城镇相称；“进城去”符合现代汉语叙事习惯。
- source_word: τοῖς ἀνθρώποις
  choice: 众人
  rationale: 原文是泛指复数“人们”；“众人”不额外限定性别，且适合引出后文的话。
- source_word: λέγει
  choice: 说
  rationale: 原文使用历史现在时，使叙事更鲜活。汉语以“说”呈现，不强行标出过去时，也保留叙事的直接感。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文连续动作的叙事节奏，并以冒号引出下一节女人所说的话；不添加原文没有的解释。
