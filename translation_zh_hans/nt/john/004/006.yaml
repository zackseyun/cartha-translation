  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: zh_hans
  text: 那里有雅各的井[a]。耶稣因旅途劳累，就这样坐在井旁[b]。那时约是第六时[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “井”也可译作“泉”；希腊文πηγή可指泉水或水井。
    reason: lexical_alternative
  - marker: b
    text: “就这样”也可理解为“就那么坐着”或“照当时的样子坐下”；原文所指的具体方式并不明确。
    reason: lexical_alternative
  - marker: c
    text: 若按犹太人的白昼计时法，“第六时”约为正午；原文保留古代时刻名称，没有注明现代钟点。
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: 井
  rationale: 此词可指泉或井；本段描写一个可供人打水、并与雅各相连的固定地点，因此正文译作“井”最自然，同时以脚注保留“泉”的可能。
- source_word: κεκοπιακὼς
  choice: 劳累
  rationale: 完成时分词表示旅途辛劳所造成并持续着的疲惫状态；“劳累”自然、庄重，也能体现体力耗损。
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: 因旅途
  rationale: ἐκ在这里表达劳累的来源或原因；“因旅途”简洁地保留了这一因果关系。
- source_word: ἐκαθέζετο
  choice: 坐在
  rationale: 未完成时在叙事中描写当时持续的状态；汉语“坐在井旁”自然呈现这一场景，无须机械添加进行体标记。
- source_word: οὕτως
  choice: 就这样
  rationale: 较直接地保留原文含义不完全明确的方式副词，可能指耶稣就那么坐下、照当时疲惫的样子坐着，或只是承接前述情形；脚注说明其语义余地。
- source_word: ἐπὶ τῇ πηγῇ
  choice: 在井旁
  rationale: ἐπί加与格在此表示位置；“井旁”符合现代汉语习惯，也避免误解为坐在井口或井体之上。
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: 那时约是第六时
  rationale: 保留原文的计时表达，并用“约”对应ὡς，不在正文中预先裁定其现代钟点换算。
- source_word: δὲ / οὖν
  choice: 省略 / 就
  rationale: δὲ在此为轻微叙事衔接，汉语无需明确译出；οὖν承接井所在之处和耶稣的疲惫，以“就”自然表达事件推进。
theological_decisions:
- issue: “第六时”的现代钟点换算
  choice: 正文保留“约是第六时”
  alternative: 按犹太白昼计时法通常理解为约正午；按另一种计时假说则可能有不同换算
  rationale: 希腊原文本身没有注明采用哪一种现代钟点换算。直译计时表达可保留《约翰福音》年代与计时问题中的真实张力，不以译文替读者裁定争议。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“因旅途劳累”清楚表达原因，“就这样”保留原文οὕτως的含混性；时间表达不直接改写为“中午”，以免消除原文计时方式上的讨论空间。
