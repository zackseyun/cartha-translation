source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: zh_hans
  text: 所以，耶稣到了加利利，加利利人就接待了他[a]；他们见过他在耶路撒冷节期中所做的一切，因为他们也曾去参加那节期[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢迎了他”或“接纳了他”。希腊语动词可表示接待、接纳或欢迎；这里的语境表明是正面的接待。
    reason: lexical_alternative
  - marker: b
    text: “节期”也可译作“节”或“节庆”。这里指宗教节期；结合上下文，看来是人们前往耶路撒冷参加的节期。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: 于是……时
  rationale: οὖν承接上文并推进叙事；“于是”保留连接作用，“……时”表达ὅτε的时间关系。
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: 来到加利利
  rationale: 表达进入该地区的方向，同时符合现代汉语习惯。
- source_word: ἐδέξαντο αὐτὸν
  choice: 接待了他
  rationale: δέχομαι可指接纳或欢迎；“接待”既保留词义范围，也能体现此处较正面的社会性接纳。
- source_word: οἱ Γαλιλαῖοι
  choice: 加利利人
  rationale: 简明、自然地表达地域居民身份。
- source_word: πάντα ἑωρακότες ὅσα ἐποίησεν
  choice: 因为他们看见了……所做的一切
  rationale: 完成时分词表示他们先前亲眼见过，且构成接待耶稣的背景或原因；汉语用因果分句自然呈现其语篇功能。
- source_word: ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ
  choice: 在耶路撒冷过节期间
  rationale: 保留地点和节期背景；“过节期间”自然表达ἐν的时间范围。
- source_word: καὶ αὐτοὶ γὰρ
  choice: 他们自己也
  rationale: “也”保留包含意义，“自己”传达αὐτοί的强调；前句“因为”体现γάρ的解释作用。
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: 去过那里过节
  rationale: 原文指他们此前前往参加节期；“去过”清楚呈现先于当前叙事的经历，“那里”依上下文指耶路撒冷，避免汉语中“去到节期”的生硬表达。
