source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his slaves met him, saying that his child was alive.
translation:
  language: zh_hans
  text: 他已在下行途中，他的奴仆来迎接他，说他的孩子[a]活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希腊语 παῖς 可指“孩子”或“男孩”，在某些语境中也可指“仆人”。
    reason: 保留 παῖς 的词义宽度，并说明本节在上下文中常被译作“儿子”的可能性。
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 表示他与奴仆相遇以前，下行的行动已经开始。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 这里是轻微的叙事连接词；汉语承接上文时无需另加“但是”或“于是”，以免强化转折。
- source_word: καταβαίνοντος
  choice: 在下行途中
  rationale: 现在分词与属格独立结构表示相遇时仍在进行的行动；“下行”保留从迦拿往迦百农方向而去的地势表达，又不额外添加“山”等原文没有的信息。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 此处指隶属于官员家中的人。“奴仆”既保留其受支配的社会身份，也比现代汉语单用“奴隶”更适合自然、庄重的叙事语体。
- source_word: ὑπήντησαν
  choice: 迎面遇见
  rationale: 该动词可指前去迎接并相遇；“迎面遇见”在语境中自然，也保留他们出来与主人相遇的意味。
- source_word: λέγοντες
  choice: 说
  rationale: 用汉语顺承动词自然表达伴随相遇发生的报告行为。
- source_word: παῖς
  choice: 孩子
  rationale: παῖς 可指孩子、男孩或仆人；上下文支持家庭关系，但本节本身没有使用更明确的 υἱός。“孩子”保留其较宽的词义范围，不限定年龄。
- source_word: ζῇ
  choice: 活了
  rationale: 直译其现在时“活着／有生命”；在孩子先前病危的语境中，“活了”简洁自然，并与耶稣先前的宣告相呼应，而不增译为“痊愈了”。
theological_decisions:
- issue: 医治叙事中 παῖς 所指的身份
  choice: 孩子
  alternative: 儿子；仆人
  rationale: 约翰福音4章的较广语境表明此人是官员的儿子，但本节使用语义范围较宽的 παῖς。正文采用“孩子”，既符合语境，又不把本词本身的含义收窄为“儿子”；脚注列出可能译法。
- issue: ζῇ 表达的是存活还是痊愈
  choice: 活了
  alternative: 还活着；痊愈了
  rationale: 原文明确陈述“活着”，却没有直接使用“痊愈”的词。译文保留生命与医治之间的张力，不将结果解释性地改写为“痊愈了”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。将内容转换为直接引语“你的孩子活了”，符合汉语叙事习惯，也准确传达奴仆对官员所说的话；原文的间接引语在汉语中不必机械保留。脚注标记紧随存在词义歧义的“孩子”。
