  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: zh_hans
  text: 尽管耶稣本人并不施洗，施洗的却是他的门徒——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣本人并不施洗，施洗的是他的门徒。”希腊文动词为未完成时，可表示当时持续或惯常进行的动作。
    reason: 说明体貌含义及可行的汉语替代译法。
lexical_decisions:
- source_word: καίτοιγε
  choice: 其实
  rationale: 本词在这里引出对上一节叙述的让步性修正或澄清。汉语“其实”自然地提示读者：上一节所说耶稣施洗，需要按本节进一步说明。
- source_word: Ἰησοῦς αὐτὸς
  choice: 耶稣亲自
  rationale: αὐτός带强调意味；“亲自”准确保留耶稣本人并未执行施洗这一重点。
- source_word: οὐκ ἐβάπτιζεν
  choice: 不是……施洗
  rationale: ἐβάπτιζεν是未完成时，语境中可表示当时持续或惯常进行的动作。正文采用自然的现代汉语表达，脚注说明其体貌含义。
- source_word: ἀλλ’
  choice: 而是
  rationale: 与前面的否定构成汉语自然的“不是……而是……”对照，清楚区分耶稣本人和门徒。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒在施洗
  rationale: 希腊文后半句省略了由上文承接的动词；汉语补出“在施洗”，使句意完整，同时保持原文所指动作不变。
theological_decisions:
- issue: 耶稣事工中实际执行施洗者的身份
  choice: 耶稣本人没有亲自施洗，实际施洗的是他的门徒。
  alternative: 可简化为“耶稣没有施洗，而是他的门徒施洗”，但会削弱αὐτός所表达的强调。
  rationale: 原文是在叙事层面澄清施洗者，并未否认这些施洗活动与耶稣的事工有关。译文只保留这种区分，不加入额外的教义解释。
- issue: 未完成时的表达
  choice: 正文用“在施洗”呈现后半句动作的进行性，并以脚注说明该动词也可能表示惯常行动。
  alternative: 译作“施了洗”或“施洗过”，会更偏向一次性、完成性的理解。
  rationale: 保留ἐβάπτιζεν可能具有的持续或惯常体貌，同时避免把语法意义绝对化。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“不是……而是……”准确呈现原文对照；以破折号保留本节作为插入性说明、并与下文衔接的结构。脚注标记置于破折号前，以明确对应整句。
