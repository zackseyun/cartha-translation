  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: zh_hans
  text: 于是，他来到撒马利亚的一座城[a]，名叫叙加，靠近雅各给他儿子约瑟的那块地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城镇”。希腊语πόλις可按语境指城市或城镇。
    reason: lexical_alternative
  - marker: b
    text: 或译“田地”。希腊语χωρίον可指田地、地产或一块土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 这是叙事中的历史现在时；汉语用“来到”自然地表达已经发生的叙事事件，也保留抵达某地的动态。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，比“所以”更适合此处的叙事语流，同时未过度强化逻辑结论。
- source_word: πόλιν
  choice: 一座城
  rationale: πόλις可指城或较小的城镇；正文采用简洁、庄重的“一座城”，并以脚注保留“城镇”的可能。
- source_word: τῆς Σαμαρείας
  choice: 撒马利亚的
  rationale: 按属格结构直接修饰πόλιν，表示这座城属于或位于撒马利亚地区；汉语整句自然表达为“撒马利亚的一座城”。
- source_word: λεγομένην Συχὰρ
  choice: 名叫叙加
  rationale: 自然表达分词结构所作的名称说明，并采用通行的专名译法“叙加”。
- source_word: πλησίον
  choice: 靠近
  rationale: 准确表达空间上的邻近关系，符合现代汉语叙事用语。
- source_word: χωρίου
  choice: 那块地
  rationale: χωρίον可指一块土地、田地或地产；“那块地”自然且不把含义限于耕田，脚注保留“田地”的译法。
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: 雅各给……的
  rationale: 以汉语定语从句表达该地先前由雅各给予的背景信息，无须另用时态标记。
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: 他儿子约瑟
  rationale: 清楚保留约瑟是接受者、也是雅各之子的同位关系；“给他儿子约瑟”是自然的现代汉语语序。
theological_decisions: []
