id: JHN.4.46
reference: John 4:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: zh_hans
  text: 于是，他又来到加利利的迦拿，就是他曾使水成了酒的地方[a]。有一个王室官员[b]，他的儿子在迦百农病了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把水变成酒。”原文较直译为“使水成了酒”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“贵族”或“王的臣仆”。原文 βασιλικός 指与君王、王室或宫廷职务有关的人，但没有说明其确切官阶。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事；“于是”在现代汉语中自然，也保留了原文的连接作用。
- source_word: πάλιν
  choice: 又
  rationale: 表示再次来到同一地方；“又”简洁自然。
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: 加利利的迦拿
  rationale: 既保留地名与所属地区的关系，也符合现代汉语地名表达。
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: 使水成了酒
  rationale: 贴近原文“使水成为酒”的措辞，同时比解释性的“把水变成酒”更少增添变化过程的表述。
- source_word: τις βασιλικός
  choice: 一个王室官员
  rationale: “有一个”自然表达不定代词 τις；“王室官员”保留此人与王室或君王职务相关的含义，却不武断确定其具体官阶或贵族身份。
- source_word: υἱὸς
  choice: 儿子
  rationale: 原文明指男性后代，应准确译为“儿子”。
- source_word: ἠσθένει
  choice: 病了
  rationale: 此处指身体患病；“病了”是自然、简洁的现代汉语。
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用该地名通行的现代中文圣经译名。
theological_decisions:
- issue: 如何翻译 βασιλικός，同时避免对其所属宫廷和具体身份作过度历史推断
  choice: 王室官员
  alternative: 贵族；王的臣仆；宫廷官员
  rationale: 原词表明此人与君王或王室有关，却没有说明其确切职位、等级或是否具有贵族身份；“王室官员”保留这种关联和原文的不确定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他”保留希腊文未明说姓名的主语，并承接上文语境；“就是……的地方”清楚表达 ὅπου 引出的地点说明。脚注标记按其实际说明对象分别置于“地方”和“王室官员”之后。
