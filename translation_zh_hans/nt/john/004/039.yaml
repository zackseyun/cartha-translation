  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: zh_hans
  text: 那城里的许多撒玛利亚人因那女人的话[a]而信了耶稣；她作见证说：“他把我所做的一切都告诉了我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“陈述”。希腊语λόγος可指话语、信息或陈述；“作见证”对应下一分词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: 那城里
  rationale: ἐκ表示来源；πόλις在此指前文的撒玛利亚城。汉语用“那城里”自然承接上下文；δέ是轻微的叙事连接，无须机械译出。
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: 有许多撒玛利亚人
  rationale: 属格结构具有部分含义，即撒玛利亚人中有许多人；此译法在现代汉语中自然保留这一含义。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 信了耶稣
  rationale: πιστεύω与εἰς连用，表示指向某人的相信或信靠。“信了耶稣”简洁自然，也避免把经文扩展为更具体的教义表述。为使中文指代清楚，以“耶稣”明示αὐτόν。
- source_word: διὰ τὸν λόγον
  choice: 因为……所说的话
  rationale: διά加宾格表示原因；λόγος可指话、信息或见证内容。结合中文句法译为“所说的话”，既通顺又保留其言语信息的含义。
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: 那女人作见证所说的
  rationale: 现在分词μαρτυρούσης描写她正在作见证。此译法保留“作见证”的约翰用语，同时与λόγος自然衔接。
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: 他把我做过的一切都说出来了
  rationale: πάντα ἃ表示“我所做的一切”；ἐποίησα为不定过去时，本身不必限定为汉语的单纯过去。“做过”符合她回顾以往行为的语境；“说出来了”自然表达耶稣把这些事告诉她。
theological_decisions:
- issue: 约翰著作中πιστεύω εἰς的表达
  choice: 信了耶稣
  alternative: 信靠耶稣
  rationale: 原文报告他们的相信指向耶稣，但本节没有进一步界定这种信的教义类别。“信了耶稣”保留关系指向，又不作解释性扩充。
- issue: 女人话语的概括程度
  choice: 我做过的一切
  alternative: 我所做的一切事
  rationale: 保留πάντα ἃ的概括性和原话中的修辞力度，不因上下文而擅自弱化为“许多事”或“我的过去”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那城里……就……”符合自然汉语语序；“作见证”保留约翰福音的重要词汇，同时不使整句显得古奥。
