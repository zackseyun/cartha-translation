  rationale: 修订以“那城里的许多撒玛利亚人”自然表达该城与信者的关系；以“因那女人的话……；她作见证说”分别呈现λόγος和μαρτυρούσης，并保留原文引语的内容与见证语气。将“说出来了”改为“告诉了我”，避免加入原文未明示的揭露意味。
