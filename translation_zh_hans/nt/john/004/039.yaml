    issue: “那城里有许多撒玛利亚人”未清楚表达ἐκ τῆς πόλεως ἐκείνης的来源关系。
    rationale: 原文的ἐκ表明这些信的人是“从／出自那城”的撒玛利亚人。中文“那城里的许多……”既自然，也较明确地保留其与该城的关联。
  - severity: medium
    issue: “那女人作见证所说的话”使λόγος与现在分词μαρτυρούσης的关系不够清晰。
    rationale: 原文先说他们因那女人的“话”而信，又以“她作见证说”引出该话的内容。分句表达可同时保留“话”和“作见证”的功能。
  - severity: low
