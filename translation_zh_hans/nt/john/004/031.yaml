  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: zh_hans
  text: 这期间，门徒一直劝他：“拉比，请吃点东西吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉比”是犹太人对老师的称呼，也可译为“老师”。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: 这期间
  rationale: 这一惯用语指前后事件之间的时段；“这期间”自然承接撒玛利亚妇人离开后的叙事，也保留“与此同时”的时间意义。
- source_word: ἠρώτων
  choice: 一直劝
  rationale: ἐρωτάω可指询问或请求；未完成时显示持续或反复的动作。结合随后要耶稣吃东西的内容，“一直劝”比单纯的“问”更符合语境，同时不把语气强化为命令。
- source_word: αὐτὸν
  choice: 他
  rationale: 宾格代词指耶稣；汉语在“劝他说”中自然表达其受事身份。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词标明上下文已知的门徒群体；汉语无需另加“这些”或“他的”即可明确所指。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出门徒劝说的具体内容；“劝他说”符合现代汉语表达。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留约翰福音中的犹太称谓及其文化色彩，不直接化约为“老师”；其含义以脚注说明。
- source_word: φάγε
  choice: 请吃点东西吧
  rationale: 原文为单数不定过去时命令式，基本义为“吃”。在劝请语境中，加“请”和句末“吧”自然表达请求语气；“点东西”是现代汉语中对“吃”的惯常补足，并未限定食物种类。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“一直劝”体现未完成时的持续或反复意味；引语以“请……吧”呈现劝请而非强硬命令。脚注标记置于含“拉比”的整句引语之后，避免打断称呼与请求。
