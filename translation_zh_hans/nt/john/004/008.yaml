base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: zh_hans
  text: 因为他的门徒已经进城买食物去了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进城”也可译作“到城里”；πόλις可指“城”，按语境也可理解为“镇”。
    reason: lexical_alternative
  - marker: b
    text: “买食物”也可译作“购买给养”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明耶稣当时为何独自与妇人交谈；“因为”自然保留其解释作用。
- source_word: μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 准确、自然地表达所属关系，并采用现代汉语中通行的“门徒”。
- source_word: ἀπεληλύθεισαν
  choice: 已经……去了
  rationale: 该词为过去完成时，表示门徒离开并进城一事发生在当前叙事场景之前；“已经……去了”也自然体现他们当时不在场。
- source_word: εἰς τὴν πόλιν
  choice: 进城
  rationale: εἰς表示朝向或进入某地，πόλις可指城或镇；结合汉语叙事习惯，“进城”简洁自然，且不必强行界定聚落规模。
- source_word: ἵνα
  choice: 买
  rationale: 以连动结构“进城买……”自然表达ἵνα所引出的目的。
- source_word: τροφὰς
  choice: 食物
  rationale: τροφάς在此指供食用的东西或给养；“食物”是清楚、普通且贴近原义的表达。
- source_word: ἀγοράσωσιν
  choice: 买
  rationale: 准确表达购买之意，符合现代汉语日常用法。
theological_decisions: []
