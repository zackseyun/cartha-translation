  naturalness: 草稿“父亲便知道，正是在……的那个时刻；”的逗号后直接接“正是”略显悬置。改为先引出耶稣的话语发生时间，再用“正是那个时刻”作判断，句法更自然清楚。
  terminology: “信了”可保留 πιστεύω 未明说的宾语和信心范围；“他自己和全家都信了”对应 αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη，既保留 αὐτὸς 的强调，也不把“也”所暗示的额外逻辑关系加入正文。
