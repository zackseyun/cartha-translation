revisions:
- from: 父亲便知道，正是在耶稣对他说“你的儿子活了[a]”的那个时刻；于是他自己信了[b]，他全家也都信了。
  to: 父亲就知道，耶稣对他说“你的儿子活着[a]”时，正是那个时刻；他自己和全家都信了[b]。
  rationale: 修订将 ζῇ 译为“活着”，保留其现在状态的宣告；调整时间从句的语序，使父亲确认耶稣说话时间与仆人所报时间相合的意思在现代汉语中完整自然。末句按原文并列结构译为“他自己和全家都信了”，并保留信心对象与范围的含蓄。
