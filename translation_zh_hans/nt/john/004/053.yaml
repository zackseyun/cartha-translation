  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: zh_hans
  text: 父亲就知道，耶稣对他说“你的儿子活着[a]”时，正是那个时刻；他自己和全家都信了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的儿子还活着。”
    reason: lexical_alternative
  - marker: b
    text: “信了”既可能指相信耶稣所说的这句话，也可能指更充分地信靠耶稣；希腊文没有明说其范围。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: 知道
  rationale: 这里的简单过去时表示父亲根据仆人的报告确认了时间与耶稣所说的话相符；“知道”保留认知含义，也不额外强调渐进过程。
- source_word: οὖν
  choice: 便
  rationale: 承接上一节仆人所报的时间，表达由此得出的确认；“便”在现代叙事中自然地体现逻辑推进。
- source_word: ὁ πατὴρ
  choice: 父亲
  rationale: 依照希腊文由官员身份转向家庭角色，突出他与获医治之人的父子关系。
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: 正是在……的那个时刻
  rationale: 清楚表达特定时间与耶稣发言时间完全对应；“正是”在汉语中用于识别同一时点，并未加入“立刻”等原文没有的含义。
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 自然且贴近原文的说话结构。
- source_word: Ὁ υἱός σου ζῇ
  choice: 你的儿子活了
  rationale: ζῇ是现在时，表示儿子处于活着的状态；在此医治语境中，“活了”是自然汉语，并以脚注保留“还活着”这一状态性译法。
- source_word: ἐπίστευσεν
  choice: 信了
  rationale: 保留πιστεύω未明说宾语的特点，不在正文中限定为只相信这句话或完整地信靠耶稣。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 显出原文显式代词的强调作用，并与随后全家的相信相区分。
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: 他全家也都信了
  rationale: οἰκία在这里指家中成员而非房屋；“全家”准确表达整个家庭群体，补出共享谓语以符合汉语表达。
theological_decisions:
- issue: 父亲“信了”的范围
  choice: 正文只说“他自己信了”，不明说所信是耶稣这次的话，还是更充分地信靠耶稣。
  alternative: 可理解为他确认并相信耶稣关于医治的话，或在此时更充分地信靠耶稣。
  rationale: 约翰福音中的πιστεύω常有深厚的神学含义，但本句没有明示宾语或界定信心的程度；保留这种含蓄可避免替原文作过度裁定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“那个时刻”比“那个钟点”自然；分号划分父亲确认时间与全家相信这两个相连的叙事动作。正文中的[a]、[b]均与脚注对应。
