  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: zh_hans
  text: 于是，门徒彼此说[a]：“难道有人给他带了吃的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“莫非有人给他带了吃的？”希腊语以 μή 引导这个问句，表明说话者预期答案是否定的。
    reason: 说明原文问句预期否定回答的语气，并保留一种较贴近该语气的译法。
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时描写当时门徒彼此交谈的持续场景；现代汉语在叙事中用“说”即可自然承载这一语篇功能，无须生硬补出“不断”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，也体现门徒听见耶稣所言后作出的反应。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: “门徒”是约翰福音中 μαθηταί 的通行且准确译法。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 准确表达群体成员之间相互交谈，简洁自然。
- source_word: Μή τις
  choice: 难道有人……吗
  rationale: μή 引导的问题通常预期否定回答；“难道有人……吗”在现代汉语中自然传达说话者倾向于认为没有人的语气，同时仍保留问句形式。
- source_word: ἤνεγκεν αὐτῷ
  choice: 给他带了
  rationale: 按语境，φέρω 表示把东西带给耶稣；“给他带了”自然表达间接宾语关系。
- source_word: φαγεῖν
  choice: 吃的
  rationale: 字面为“去吃”，在该结构中指可供食用之物；“吃的”是自然、清楚的现代汉语表达。
theological_decisions: []
