  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: zh_hans
  text: “你们来看看！有一个人把我所做过的一切都告诉了我。莫非这个人就是弥赛亚吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道这个人会是弥赛亚吗？”
    reason: 原文μήτι可使问句带有预期否定答案的意味，也可在本语境中表达迟疑而试探的询问。
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: 你们来看看
  rationale: 两个复数命令式合起来构成直接邀请；“你们来看看”自然、清楚，也保留了呼召众人前来的语气。
- source_word: ἄνθρωπον
  choice: 有一个人
  rationale: 原文为单数阳性，具体指一名男子；中文用“一个人”既准确又自然。
- source_word: ὃς εἶπέ μοι
  choice: 把……都说了出来
  rationale: 按中文习惯将“对我说”与后面的内容合译，表达他把她所做的事揭示出来。
- source_word: πάντα ὅσα ἐποίησα
  choice: 我所做过的一切
  rationale: “一切”体现 πάντα ὅσα 的全面性；“做过”自然指向她以往的行为。
- source_word: μήτι
  choice: 莫非……吗
  rationale: μήτι使问句带有迟疑和试探色彩，通常暗示说话者并非直截了当地断言；“莫非”在现代中文中能保留这种开放而有所保留的语气。
- source_word: οὗτός
  choice: 这个人
  rationale: 保留近指代词的指示作用，并明确回指前文所说的那个人。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处χριστός是犹太背景中的称号，译为“弥赛亚”能清楚呈现其称号功能，而不把它处理成名字。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里指众人所期待的受膏者，称号意义鲜明；“弥赛亚”更直接呈现当时的犹太语境。
- issue: μήτι问句的确定程度
  choice: 莫非这个人就是弥赛亚吗？
  alternative: 难道这个人会是弥赛亚吗？
  rationale: 原文既含通常预期否定答案的问句形式，又在上下文中发出邀请，促使听者自行判断；正文保留试探性，脚注呈现更偏向否定预期的译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你们来看看”口吻直接而不随便；“莫非”保留原文问句的犹疑和张力。脚注标记置于相关问句之后。
