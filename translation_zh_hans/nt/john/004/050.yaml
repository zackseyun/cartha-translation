  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: zh_hans
  text: 耶稣对他说：“走吧，你儿子活着。”那人相信了耶稣对他说的话[a]，就上路了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信赖了耶稣对他说的话”。
    reason: 词义备选；πιστεύω 在本语境中既可强调相信话语为真，也可强调信赖这话。
lexical_decisions:
- source_word: Πορεύου
  choice: 走吧
  rationale: 这是 πορεύομαι 的现在时中动命令式，在此是简洁的离开、前行命令。“走吧”自然地保留了命令语气，又不额外限定为“回去”。
- source_word: ὁ υἱός σου
  choice: 你儿子
  rationale: υἱός 明确指“儿子”，不宜泛化为“孩子”。
- source_word: ζῇ
  choice: 活着
  rationale: 现在时直陈语气表示儿子仍然活着；“活着”保留现在时意义，也避免把话明确改成将来应许。“活了”虽是传统表达，却可能被现代读者误解为死而复生。
- source_word: ἐπίστευσεν
  choice: 相信了
  rationale: πιστεύω 后接与格 τῷ λόγῳ，表示相信或信赖所说的话。“相信了”自然准确，并保留约翰叙事中“信”的含义张力。
- source_word: ὁ ἄνθρωπος
  choice: 那人
  rationale: 本节原文用一般性的 ἄνθρωπος，而没有重复上文的王室官员身份；“那人”忠实保留这种称呼变化。
- source_word: τῷ λόγῳ
  choice: 话
  rationale: λόγος 在这里指耶稣说出的具体话语；现代汉语用“话”比“言语”更自然，后面的关系从句也明确了所指。
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说的
  rationale: 作为修饰“话”的关系从句，这一表达既完整保留说话者和听者，也符合现代汉语语序。
- source_word: ἐπορεύετο
  choice: 就上路了
  rationale: 未完成时描写他随即开始并继续行程。“上路了”比单纯“走了”更清楚地呈现叙事中的启程，同时不过度强调动作持续时间。
theological_decisions:
- issue: πιστεύω 在此处表示人对耶稣所说之话的回应
  choice: 相信了
  alternative: 信赖了
  rationale: 经文说明那人接受耶稣的话并据此行动，但没有要求译文判定这是否已是完整意义上的救恩之信。“相信了”既贴合词义，也保留约翰叙事对信心性质的张力。
- issue: ζῇ 所表达的是当前事实还是将来应许
  choice: 活着
  alternative: 会活下去
  rationale: 原文是现在时直陈语气，因此主文按当前事实翻译，不将其明确改写成将来时；儿子是否同时已得医治由后续叙事说明。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“走吧”与“就上路了”形成自然呼应；引号内保留耶稣宣告的紧凑力度。脚注标记置于“话”之后，涵盖“相信了……的话”这一整体表达。
