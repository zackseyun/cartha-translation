  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我的食物就是遵行那位差我来的的旨意，并完成他的工作。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完成”也可译作“做完”。
    reason: lexical_alternative
  - marker: b
    text: “那位差我来的”按上下文指父神，但本节希腊原文没有明确使用“父”这一称呼。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 希腊文用历史现在时；现代汉语叙事中用“说”即可自然表达，不必刻意标示时态。
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: 我的食物就是
  rationale: 保留“食物”的具体比喻，与上文门徒谈论吃东西直接呼应；“就是”自然引出后面的内容。
- source_word: ἵνα ποιήσω τὸ θέλημα
  choice: 遵行……的旨意
  rationale: ποιέω与“旨意”搭配时，汉语惯用“遵行”，既表达实行，也体现顺服的语境；没有把句意改写成较弱的“做……想要的事”。
- source_word: τοῦ πέμψαντός με
  choice: 那差我来者
  rationale: 保留原文以分词结构指称某一位的含蓄表达，不在正文中补出“父”或“上帝”；“差我来”符合约翰福音中的使命语境。
- source_word: τελειώσω
  choice: 完成
  rationale: 表达把受托之事做到底、达到终点的含义，也保留可译作“做完”的词义空间。
- source_word: αὐτοῦ τὸ ἔργον
  choice: 他的工作
  rationale: “工作”直接对应ἔργον，并保留其可涵盖使命与行动的宽度，不缩窄为单一“任务”。
theological_decisions:
- issue: “那差我来者”的身份
  choice: 正文保留“那差我来者”，脚注说明语境所指
  alternative: 译为“差我来的父”或“差我来的上帝”
  rationale: 约翰福音的上下文表明所指是父，但本节希腊文没有明说该称号，因此不在正文中补明。
- issue: τελειόω所表达的完成含义
  choice: 译为“完成”
  alternative: 译为“做完”
  rationale: “完成”既包含结束工作，也可保留使之达到既定目标的意味，不额外引入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的食物就是”保留上下文中的鲜明比喻；“那差我来者”略带书面色彩，但简洁地保留了原文的含蓄指称。脚注标记均置于相关句末。
