  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: zh_hans
  text: 因为你曾有过五个丈夫[a]，你现在有的那个人并不是你的丈夫。你这话说得是真的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“因为你曾有过五个男人，而你现在有的那个人并不是你的男人／丈夫。”希腊语ἀνήρ既可指“男人”，也可指“丈夫”；这里的上下文更支持“丈夫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: 因为你已经有过五个丈夫
  rationale: γάρ说明耶稣为何肯定她所说的是真话，译作“因为”自然保留解释关系。ἔσχες是不定过去时，指她以往的关系经历；“已经有过”在现代汉语中表达其过去经历及当前关联。ἀνήρ可指“男人”或“丈夫”，此处上下文以婚姻关系为主，故正文译作“丈夫”。
- source_word: καὶ νῦν ὃν ἔχεις
  choice: 现在和你在一起的那个人
  rationale: 若直译为“现在你所有的那个人”，现代汉语容易产生物化或所有权意味；“和你在一起”自然表达此处ἔχω所指的伴侣关系，同时不额外界定关系细节。
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: 并不是你的丈夫
  rationale: σου与ἀνήρ表达婚姻关系；译作“你的丈夫”清楚承接前面的“丈夫”，并保留当前关系与婚姻关系之间的对照。
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: 你这话说得是真的
  rationale: τοῦτο回指妇人刚才所说的话，ἀληθὲς可作补语理解；该译法既保留“说”的动作，也自然表达耶稣对其话语真实性的肯定。
theological_decisions:
- issue: ἀνήρ在本节两处的含义
  choice: 正文两处均按婚姻语境译作“丈夫”
  alternative: 按较宽泛的词义译作“男人”
  rationale: ἀνήρ本可兼指“男人”和“丈夫”，但本节前后以“你的丈夫”为明确对照，婚姻义最符合语境。脚注保留其词汇层面的真实歧义，避免把宽泛义完全隐藏。
- issue: ὃν ἔχεις所描述的当前关系
  choice: 译为“现在和你在一起的那个人”
  alternative: 较直译为“现在你有的那个人”
  rationale: 原文只说明该男子不是她的丈夫，并未进一步说明关系的法律或道德细节；正文采用自然汉语，同时不补入原文未明说的具体身份。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“和你在一起的那个人”避免生硬直译ἔχεις，又不对当前关系作超出原文的说明；末句用“你这话说得是真的”保留原文回指与肯定语气。
