  text: He had to pass through Samaria[a].
translation:
  language: zh_hans
  text: 他必须经过撒玛利亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有必要经过撒玛利亚。”希腊文表达了必要性，却没有说明这种必要性的确切根据。
    reason: 词义替代译法，并保留必要性根据未明的歧义。
lexical_decisions:
- source_word: ἔδει
  choice: 必须
  rationale: 未完成时在过去叙事中表达必要性。“必须”自然、简洁，并保留必要性的力度，却不自行说明其根据。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要轻微推进叙事，并非强烈转折；汉语无需机械添加“现在”或“但”，句际衔接仍然自然。
- source_word: αὐτὸν
  choice: 他
  rationale: 原文在不定式结构中使用宾格作逻辑主语；汉语宜改用有限句，以“他”作主语。
- source_word: διέρχεσθαι
  choice: 经过
  rationale: 该动词与 διά 连用，表示穿行某地；“经过”简明自然，保留经由该地区而行的意思。
- source_word: διὰ τῆς Σαμαρείας
  choice: 经过撒玛利亚
  rationale: διά 加属格表示从一地穿过。“撒玛利亚”在此可指该地区，正文不必增添“地区”二字。
theological_decisions:
- issue: ἔδει 所表达的必要性
  choice: 译为真实的必要性“必须”，但不说明其具体根据
  alternative: 明确解释为地理上的必经之路，或上帝使命所定的必要性
  rationale: 本节希腊文只陈述必要性，没有明确指出这是地理、处境还是神圣旨意所造成；译文应保留这一含义张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“必须经过”简洁有力；不把 δὲ 生硬译作“现在”或“但”，也不在正文中加入原文未明说的神学解释。
