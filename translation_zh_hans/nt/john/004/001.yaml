  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: zh_hans
  text: 所以，当耶稣知道法利赛人听说耶稣使人成为门徒并给他们施洗，他所使成为门徒的人数比约翰更多[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣使人成为门徒和施洗，都比约翰更多。”希腊文也可理解为，这里的比较涵盖“使人成为门徒”和“施洗”两项活动，而不只是门徒人数。
    reason: 保留希腊文比较范围的句法歧义。
lexical_decisions:
- source_word: Ὡς οὖν
  choice: 所以，当
  rationale: Ὡς引出时间从句，οὖν表示承接或推论；“所以，当”兼顾两者，并保留本句尚未结束的结构。
- source_word: ἔγνω
  choice: 知道
  rationale: 在此表示耶稣已经得知或意识到有关消息；“知道”简洁自然，又不额外说明消息来源。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文《圣经》中通行且易懂的群体名称。
- source_word: ἤκουσαν
  choice: 听说
  rationale: 这里不是单指听见声音，而是听到有关耶稣的消息；“听说”符合现代汉语叙事习惯。
- source_word: πλείονας μαθητὰς
  choice: 门徒……人数更多
  rationale: 用“人数更多”自然表达比较级πλείονας所指的门徒数量。
- source_word: ποιεῖ
  choice: 使人成为门徒
  rationale: ποιεῖ与μαθητάς连用，意为使人成为门徒；此译法比直译“制造门徒”自然准确。
- source_word: βαπτίζει
  choice: 给他们施洗
  rationale: “施洗”是βαπτίζει在新约叙事中的标准译法；补出“给他们”使中文关系清楚，但不改变所指。
- source_word: ἢ Ἰωάννης
  choice: 比约翰更多
  rationale: 直接保留与约翰之间的比较，中文简洁且含义明确。
theological_decisions:
- issue: 本节表面上可能暗示耶稣亲自施洗
  choice: 保留本节表面的说法“耶稣……给他们施洗”
  alternative: 依据下一节预先改写为“耶稣的门徒给他们施洗”
  rationale: 原文在本节直接把“使人成为门徒”和“施洗”述说为耶稣的活动，下一节才说明实际施洗者是他的门徒。译文应让下文自行作出限定，不提前调和。
- issue: 比较范围存在句法歧义
  choice: 正文将“更多”主要表达为门徒人数更多
  alternative: 理解为“使人成为门徒”和“施洗”两项活动都比约翰更多
  rationale: πλείονας在语法上直接修饰μαθητάς，但并列谓语使比较范围也可能涵盖两项活动；正文采用较自然的数量表达，并以脚注保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“所以，当”保留原文的逻辑承接和时间从句；句末破折号表明句意延续到下一节。正文保留“耶稣”重复出现，以贴近所给希腊文本，并避免用代词造成指代含混。
