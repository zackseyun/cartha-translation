id: JHN.4.11
reference: John 4:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: zh_hans
  text: 妇人对他说：“先生[a]，你没有打水的桶，井又深；那么，你从哪里得到这活水[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主啊”。希腊语 κύριε 既可用作尊称“先生”，也可意为“主”，须按语境理解。
    reason: alternative_reading
  - marker: b
    text: “活水”也可指流动的新鲜水，而不是停滞的水；这一译法同时保留耶稣话语中的深层含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: 妇人对他说
  rationale: 希腊文用叙事性现在时，现代汉语叙事无需机械标出时态；“妇人”承接上文所指的撒玛利亚妇人。
- source_word: Κύριε
  choice: 先生
  rationale: 此处谈话尚在初期，κύριε自然可作礼貌称呼；译作“先生”避免过早断定妇人已承认耶稣为主，同时以脚注保留“主啊”的可能。
- source_word: ἄντλημα
  choice: 打水的桶
  rationale: 该词指汲水用的器具；“打水的桶”在现代汉语中具体、自然，也符合井边场景。
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: 井又深
  rationale: 准确表达井的深度；“又”把没有汲水器具与井深这两个困难自然连接起来。
- source_word: πόθεν οὖν ἔχεις
  choice: 那么，你从哪里得到
  rationale: πόθεν询问来源，οὖν表示由前述情况推出的问题；“那么”保留其推论关系。
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: 这活水
  rationale: “活水”既能保留希腊文的字面表达和约翰叙事中的深层含义，也可在语境中理解为流动、新鲜的水；指示性的“这”使妇人承接耶稣刚才所说的话更自然。
theological_decisions:
- issue: 妇人以 κύριε 称呼耶稣时是否表达信仰认信
  choice: 先生
  alternative: 主啊
  rationale: κύριε既可作礼貌称呼，也可表示“主”。当前语境不足以断定妇人的神学认识，因此正文采用合乎对话阶段的“先生”，脚注保留另一可能，避免消除原文歧义。
- issue: ὕδωρ τὸ ζῶν 的日常含义与约翰福音中的深层含义
  choice: 活水
  alternative: 流动的水
  rationale: 原短语日常可指流动而新鲜的水，同时在耶稣的话中具有更深含义。“活水”能保留双关张力，不把妇人的字面理解或耶稣的深意单方面固定下来。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“井又深”避免照搬英语修订稿中不合原意的否定关联结构；希腊文表达的是“你没有汲水器具，而且井很深”。标点以分号清楚区分陈述与由此引出的问句。
