  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: zh_hans
  text: 耶稣对她说：“我就是[a]正在对你说话的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是，正在对你说话的那一位。”希腊文直译为“我是，正在对你说话的那一位”；根据上一节所说的弥赛亚，语境所表达的是“我就是那一位”。
    reason: 保留 Ἐγώ εἰμι 的字面形式，并说明正文“我就是”所反映的上下文身份辨认。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语叙事无须以形态标明过去时，译作“说”自然且忠实。
- source_word: αὐτῇ
  choice: 对她
  rationale: 与汉语动词“说”搭配时，间接受词自然译为“对她”。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 原文直译为“我是”；但在承接上一节“弥赛亚”的身份辨认语境中，汉语“我就是”既自然表达“我就是那一位”，又不直接增添原文没有的“弥赛亚”或“他”。脚注保留更贴近字面的形式。
- source_word: ὁ λαλῶν σοι
  choice: 正在跟你说话的
  rationale: 带冠词的现在分词构成指人短语，表示“正在对你说话的那一位”；译文用口吻自然的“正在跟你说话的”，与前面的身份表述构成同位说明。
theological_decisions:
- issue: 是否在正文中明确补出弥赛亚身份
  choice: 译作“我就是”，不补出“弥赛亚”或“他”
  alternative: “我就是他”或“我就是弥赛亚”
  rationale: 上一节已清楚提供弥赛亚这一语境，但本节希腊文没有明说宾语或表语。正文不补出具体称谓，以保留原文的简洁和潜在神学张力。
- issue: 如何处理 Ἐγώ εἰμι 的字面形式与汉语惯用表达
  choice: 正文采用“我就是”，脚注注明字面也可译作“我是”
  alternative: 正文直译“我是”
  rationale: “我是，正在跟你说话的”在现代汉语中突兀；“我就是”可自然承担语境中省略表语的身份确认，同时脚注让读者看到原文简洁的“我是”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正在跟你说话”符合直接对话语境；正文保持原文同位结构，不把“弥赛亚”明确补入本节。
