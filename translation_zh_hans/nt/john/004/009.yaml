  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: zh_hans
  text: 于是，那个撒玛利亚妇人对他说：“你是犹太人，怎么向我一个撒玛利亚妇人要水喝呢？”（原来犹太人和撒玛利亚人没有来往。[a]）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太人不和撒玛利亚人共用东西。”这里也可能特指不共用饮水器皿等物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: 于是……说
  rationale: οὖν在这里承接上文并推动叙事；“于是”自然保留其连接作用，又不把逻辑关系说得过强。
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: 那个撒玛利亚妇人
  rationale: 重复冠词指向前文已经出现的特定妇人；“那个撒玛利亚妇人”符合现代汉语表达，并保留其性别和群体身份。
- source_word: Πῶς
  choice: 怎么
  rationale: 这里表达妇人对越过社会界限之请求的惊讶；现代汉语疑问句中的“怎么”既自然，也能传达不可思议的语气。
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 此处与“撒玛利亚人”形成族群及宗教共同体层面的对照，并非主要强调犹太地区的居民身份。
- source_word: ὢν
  choice: 你是
  rationale: 希腊文分词交代背景；汉语用“你是犹太人”自然呈现这一身份事实，不额外限定为原因或让步。
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: 向我……要水喝
  rationale: αἰτεῖς加πεῖν表示请求饮用；结合上文所说的水，用“要水喝”简洁自然，并保留请求对象“我”。
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: 我一个撒玛利亚妇人
  rationale: 属格独立结构说明妇人的身份及其惊讶背景；汉语采用同位式表达，保留第一人称、性别和群体身份，同时不硬性判定其逻辑关系。
- source_word: συγχρῶνται
  choice: 有来往
  rationale: 该词可泛指交往，也可能较具体地指共用物品。正文用“有来往”表达两群体间的一般社会隔阂，脚注保留共用器物这一较窄可能。
- source_word: οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις
  choice: 原来犹太人和撒玛利亚人没有来往
  rationale: “原来”自然引出叙述者的解释；括号保留原文插入性说明的功能。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖος在本节的含义
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 本节把犹太人和撒玛利亚人作为社会—宗教群体相对照，重点不只是地域归属，因此译作“犹太人”更贴合语境。
- issue: συγχρῶνται的范围
  choice: 一般性的社会来往
  alternative: 特指共用器物，例如饮水器皿
  rationale: 解释语句可概括两群体之间的社会隔阂；但眼前情境涉及饮水及器皿，较具体的“共用物品”含义仍有可能，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怎么向我……要水喝呢”保留妇人的惊讶语气；括号呈现叙述者的解释性插语。
