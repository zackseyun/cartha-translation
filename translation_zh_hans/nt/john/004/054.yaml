  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: zh_hans
  text: 这是耶稣从犹太地来到加利利后所行的第二个记号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”也可译作“神迹”。约翰常用这个词，强调这类作为不仅显出能力，也指向其意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: 这
  rationale: 指向上文刚叙述的医治事件；现代汉语用“这”简洁自然。
- source_word: δὲ πάλιν δεύτερον
  choice: 第二个
  rationale: πάλιν与第二序数共同承接2:11所记的第一个神迹；汉语直接说“第二个”已自然表达再次发生并位列第二，避免生硬重复“又是第二个”。
- source_word: σημεῖον
  choice: 神迹
  rationale: 约翰福音中的σημεῖον既是超常作为，也是具有指示意义的记号；正文采用现代中文圣经语境中自然且易懂的“神迹”，脚注说明“记号”这一更贴近字面的译法及其含义。
- source_word: ἐποίησεν
  choice: 所行的
  rationale: ποιέω与σημεῖον搭配时，中文惯用“行神迹”，既自然又准确。
- source_word: ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: 从犹太来到加利利后
  rationale: 将不定过去时分词理解为时间关系，以“……后”表达先来到、后行神迹的顺序，同时保留从犹太到加利利的方向。
theological_decisions:
- issue: 约翰福音中σημεῖον的术语意义
  choice: 正文译作“神迹”，并以脚注注明“记号”
  alternative: 正文译作“记号”
  rationale: “神迹”对普通现代中文读者更自然，也明确这是超常作为；脚注保留约翰所强调的指示和启示功能，避免把该词仅理解为能力展示。
- issue: πάλιν δεύτερον的计数范围
  choice: “第二个神迹”
  alternative: “又一次行的第二个神迹”
  rationale: 本句自然回指约翰福音2:11，表示耶稣由犹太来到加利利后所行的第二个神迹；不额外补明计数范围，以免加入原文没有明说的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从犹太来到加利利后”清楚呈现分词的时间关系；“所行的第二个神迹”符合中文圣经叙事习惯。脚注标记[a]已置于正文对应词后。
