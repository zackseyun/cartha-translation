  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: zh_hans
  text: 又有多得多[a]的人因他的话[b]而信了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“更多的人”。希腊文采用加强的比较表达，意思是人数“多得多”。
    reason: lexical_alternative
  - marker: b
    text: “话”也可译作“信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: 多得多的人
  rationale: πολλῷ加强比较级πλείους，表示人数较前文显著增加。“多得多的人”既保留比较意味和强调程度，也符合现代汉语表达。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 该词为πιστεύω的不定过去时主动直陈语气；“信了”直接表达叙事中发生的相信，不额外加入原文未明说的宾语或教义性说明。
- source_word: διὰ
  choice: 因
  rationale: διά后接宾格，在这里表示原因；“因”简洁地传达“因为、由于”的意义。
- source_word: λόγον
  choice: 话
  rationale: λόγος在此指耶稣所说的话或所传达的信息。“话”自然、贴近上下文，也保留《约翰福音》中λόγος用语的呼应空间。
- source_word: αὐτοῦ
  choice: 他
  rationale: 代词在上下文中指耶稣；“他的话”是直接、自然的对应表达。
theological_decisions:
- issue: 在救恩叙事语境中如何翻译πιστεύω
  choice: 信了
  alternative: 信了他；归信了；有了信心
  rationale: 希腊文本在本节只说这些人“信了”，没有明列宾语。“信了”让上下文表明他们所信的是耶稣，避免在本节中补入原文没有明说的神学表述。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“又有”承接上一节；“多得多的人”保留希腊文加强比较级的力度。所有脚注标记均置于正文对应词语之后。
