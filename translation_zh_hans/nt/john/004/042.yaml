  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: zh_hans
  text: 他们对那妇人说：“我们相信，已不再是因为你所说的话[a]；因为我们亲自听见了，也知道这位[b]真是世界的救主。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“因为你的言谈”；这里指妇人口头所说的话。
    reason: lexical_alternative
  - marker: b
    text: 原文的指示代词带有强调意味；也可译作“这个人”或“他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: 他们又对那妇人说
  rationale: 以“又”自然表达 τε 的轻微承接作用；ἔλεγον 的未完成体在此可由上下文中的持续对话体现，汉语用“说”比“正在说”更自然。
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: 现在我们信，不再是因为你所说的话
  rationale: 调整汉语语序以清楚表达：他们仍然相信，但信心的根据已不再只是妇人的口头见证。λαλιά 指她说出的话或言谈。
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: 我们亲自听见了
  rationale: “亲自”传达 αὐτοί 的强调，与先前从妇人处间接听闻形成对比；“听见了”自然表达完成并带来现今结果的语气。
- source_word: καὶ οἴδαμεν
  choice: 也知道
  rationale: οἴδαμεν 在此为现在状态，直译为“知道”准确自然。
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: 这位真是
  rationale: “这位”保留 οὗτος 的指示和强调，同时在现代汉语中比“这一位”更自然；“真是”表达 ἀληθῶς 的确认语气。
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: 世界的救主
  rationale: 保留约翰语境中 σωτήρ 的救赎含义及 κόσμος 的广泛范围，不擅自增添“全”或限定其对象。
theological_decisions:
- issue: 撒马利亚人宣认中“世界”的范围
  choice: 世界的救主
  alternative: 全人类的救主；世上蒙拣选之人的救主
  rationale: 原文只说 τοῦ κόσμου，具有广阔范围；译文既不将其改写为更具体的教义命题，也不缩小其范围。
- issue: “不再因为”是否表示他们不再相信
  choice: 现在我们信，不再是因为你所说的话
  alternative: 我们不再因为你所说的话而信
  rationale: 原文否定的是信的依据，而不是信本身。调整语序可避免现代汉语把“不再”误解为“不再相信”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这位”既保留指示代词的强调，也避免“这个人”可能带来的疏离或轻慢语感。所有脚注标记均置于正文相应位置。
