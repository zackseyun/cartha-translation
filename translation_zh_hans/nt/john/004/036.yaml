revisions:
- from: 收割的人正在领工钱[a]，把果实收聚，归入永生[b]，好让撒种的和收割的一同欢喜。
  to: 收割的人正在领工钱[a]，收聚归于永生[b]的果实，好让撒种的和收割的人一同欢喜。
  rationale: 将不自然且句法关系含混的“把果实收聚，归入永生”改为“收聚归于永生的果实”。这既对应“收聚果实，归于永生”的希腊语结构，也在现代汉语中清晰自然；脚注同步更新锚定的正文措辞。其余译文忠实保留原文的现在时、农业比喻、共同喜乐及目的/结果关系，未加入“已经”或身份释义。
