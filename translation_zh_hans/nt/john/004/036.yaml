  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: zh_hans
  text: 收割的人正在领工钱[a]，收聚归于永生[b]的果实，好让撒种的和收割的人一同欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “工钱”也可译作“报偿”；希腊语此词既可指劳动所得，也可指所得的报偿。
    reason: lexical_alternative
  - marker: b
    text: “归于永生”也可译作“以永生为目标”或“带来永生”；原文可表示目标或结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: 收割的人
  rationale: 带冠词的现在分词作名词用；译作“收割的人”自然，并保留动作意味。
- source_word: μισθὸν λαμβάνει
  choice: 正在领工钱
  rationale: μισθός可指劳动所得的工钱，也可指报偿；“工钱”延续收割劳动的具体意象。现在时译作“正在领”，突出行动此刻正在发生。
- source_word: συνάγει καρπὸν
  choice: 把果实收聚
  rationale: “果实”保留καρπός的比喻空间，不与“收割”混同；“收聚”体现συνάγει所表达的聚集动作。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 归入永生
  rationale: εἰς可表达方向、目标或结果；“归入永生”保留其趋向性，同时避免把具体关系限定得过死。
- source_word: ἵνα
  choice: 好让
  rationale: 自然表达目的或结果关系，不强行排除其中任何一种语气。
- source_word: ὁ σπείρων
  choice: 撒种的
  rationale: 与“收割的人”形成清楚对应，并保留原文分词的动作意味。
- source_word: ὁμοῦ χαίρῃ
  choice: 一同欢喜
  rationale: 准确表达共同喜乐；“欢喜”庄重而又为现代读者所熟悉。
theological_decisions:
- issue: 是否在句首明加“已经”
  choice: 不添加“已经”
  alternative: 已经，收割的人正在领工钱……
  rationale: 本节希腊文本没有独立对应“已经”的词。上下文虽强调收割正在进行，但正文无需借增词明说，以免超出本节措辞。
- issue: εἰς ζωὴν αἰώνιον所表达的关系
  choice: 译作“归入永生”，并加注说明其可指目标或结果
  alternative: 为了永生；直到永生；进入永生
  rationale: 原介词短语容许方向、目标或结果等相近理解；正文保留趋向性，脚注呈现真实歧义，不将其教义化地单一定义。
- issue: 撒种者与收割者的身份
  choice: 不在译文中指明其具体所指
  alternative: 将二者明确解释为耶稣、门徒、先知或其他群体
  rationale: 本句本身只陈述二者共同欢喜，并未明确界定各自身份；翻译不应代替释经作出限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“收割—工钱—果实—撒种”保留原文农业意象；句式流畅，但不消除εἰς短语的语义张力。所有脚注标记均置于相应正文词语之后。
