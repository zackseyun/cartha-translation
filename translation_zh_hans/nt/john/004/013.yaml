base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: zh_hans
  text: 耶稣回答她说：“凡喝这水的，还会再渴。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: 耶稣回答她说
  rationale: “回答……说”自然对应希腊文“回答并对她说”的双动词叙事结构；既保留原文表达，又符合现代汉语习惯。
- source_word: Πᾶς ὁ πίνων
  choice: 凡喝……的
  rationale: 带冠词的现在分词表示普遍、通常适用的一类人。“凡……的”准确传达其概括性和不分性别的普遍范围。
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: 喝这水
  rationale: 汉语通常直接说“喝这水”，无需生硬译出介词“从”；“这”保留了τούτου对眼前之水的明确指称。
- source_word: διψήσει πάλιν
  choice: 还会再渴
  rationale: “会”表达将来结果，“再”表达πάλιν的重复含义；“渴”比“感到口渴”更简洁自然。
theological_decisions:
- issue: 是否保留ἀπεκρίθη…καὶ εἶπεν的双重言说公式
  choice: 译作“回答她说”
  alternative: 只译作“回答”或“说”
  rationale: 原文明确含有两个动词；汉语“回答……说”能自然保留这一约翰叙事公式，而不增加额外含义。
- issue: Πᾶς ὁ πίνων的通称范围
  choice: 译作“凡喝……的”
  alternative: 译作“每一个喝的人”或带男性限定的表达
  rationale: 原文虽采用语法上的阳性形式，语义却是泛指所有符合条件的人；“凡……的”保留普遍范围，不引入性别限制。
- issue: “这水”与后文属灵之水的对照
  choice: 本节直译为眼前的“这水”
  alternative: 在正文中解释为“井里的水”或预先赋予象征意义
  rationale: τοῦ ὕδατος τούτου直接指谈话现场所说的水；不在本节添加解释，可保留上下文逐步展开的比喻张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的”简洁、口语可懂，同时适合经文宣读；“还会再渴”清楚表达持续饮用此水仍将重复口渴的结果。
