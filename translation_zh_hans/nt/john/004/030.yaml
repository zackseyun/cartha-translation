  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: zh_hans
  text: 众人出了城，正往他那里去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人出了城，正往他那里来。”
    reason: 原文的未完成时可突出他们当时正在前来的过程；从耶稣所在位置叙述时，也可译作“来”。
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出城
  rationale: 不定过去时在叙事中表示他们离开城内；与“城”合译为“出城”，符合现代汉语习惯，并保留向外移动的意思。
- source_word: ἐκ τῆς πόλεως
  choice: 出城
  rationale: ἐκ表示从内部出来，τῆς πόλεως指前文所说的城；现代汉语用“出城”即可自然、准确地表达。
- source_word: ἤρχοντο
  choice: 往……去
  rationale: 未完成时描写当时正在进行的行程。汉语“往他那里去”自然表达朝目标移动；进行意义可由上下文及脚注说明，避免生硬地译作“正在来”。
- source_word: πρὸς αὐτόν
  choice: 往他那里
  rationale: πρός加宾格表示朝向某人移动。“往他那里”既保留方向，也清楚表明目标是耶稣。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“众人”承接上下文中的城里人，避免汉语中单独使用“他们”可能造成的指代含混；“就”自然连接上一节妇人的见证及众人的响应。
