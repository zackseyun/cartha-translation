source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: zh_hans
  text: 你们敬拜你们所不知道的；我们敬拜我们所知道的，因为救恩是从犹太人而来的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太民族”。在《约翰福音》其他一些语境中，这个词可指“犹太地区的人”；但这里谈到的是撒玛利亚人与犹太人在敬拜和救赎历史方面的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: 敬拜
  rationale: 上下文谈的是对上帝的宗教性敬拜，不只是俯伏或向人致敬；“敬拜”在现代汉语中自然、准确。
- source_word: ὃ
  choice: ……的（所……的）
  rationale: 希腊文使用中性关系代词，概括指向敬拜的对象。译作“所不知道的／所知道的”既符合现代汉语，也不擅自明确为“那一位”。
- source_word: οἴδατε / οἴδαμεν
  choice: 知道
  rationale: 保留原文鲜明的“知道／不知道”对比；“认识”可能更突出关系性的认识，超出此处词形本身所必须表达的范围。
- source_word: σωτηρία
  choice: 救恩
  rationale: 此处指上帝施行拯救的工作，而不只是暂时性的获救；“救恩”是清楚而庄重的通行译法。
- source_word: ἐκ
  choice: 从……而来
  rationale: ἐκ表示来源。“从……而来”是自然的现代汉语表达，保留救恩在救赎历史上的来源含义。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 此处是在撒玛利亚人与犹太人的敬拜及救赎历史背景下作对比，所指最自然的是犹太民族，而非仅限于犹太地区居民。
theological_decisions:
- issue: “救恩是从犹太人而来的”的含义
  choice: 保留为救恩在历史上从犹太民族而来的陈述
  alternative: 仅指弥赛亚具有犹太血统，或泛指犹太启示与敬拜的优先地位
  rationale: 原句说明救恩的历史来源，却没有把含义明确限制为其中某一个层面。译文不添加民族优越论，也不削弱上帝的救赎工作经由犹太民族而来的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“你们／我们”和“知道／不知道”的平行结构重现原文的对照；句末脚注说明“犹太人”的语义范围。
