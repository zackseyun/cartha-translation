  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: zh_hans
  text: 我们的祖先[a]在这座山上敬拜；而你们说，耶路撒冷是人必须在那里敬拜[b]的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我们的父亲”；这里按语境指“我们的祖先”。
    reason: 说明πατέρες的字面义及其在本节中的历史、共同体用法。
  - marker: b
    text: 或译：“人应当在那里敬拜。”
    reason: δεῖ表示一般性的必要或义务；“应当”较突出规范性。
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: πατέρες在这里指共同体历代的先人。现代汉语用“祖先”自然清楚，也保留了撒玛利亚妇人所强调的群体传承；脚注说明原文较直译可作“父辈”。
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: 在这座山上
  rationale: ἐν表达地点；汉语谈到山作为敬拜地点时，惯用“在……山上”，既准确又自然。
- source_word: προσεκύνησαν / προσκυνεῖν
  choice: 敬拜
  rationale: προσκυνέω可指俯伏致敬，也可指宗教性的敬拜；本节讨论敬拜地点，译作“敬拜”最符合语境。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 保留希腊文明确出现并与“我们的祖先”形成对照的复数代词，不额外补出“犹太人”。
- source_word: ἐν Ἱεροσολύμοις
  choice: 耶路撒冷
  rationale: 在“是……的地方”结构中，现代汉语直接说“耶路撒冷是……的地方”最自然；希腊文地名的复数形态不在汉语中体现。
- source_word: ὁ τόπος
  choice: 地方
  rationale: 保留定指性的地点概念，不增译“唯一”或“正确”，以免把语境中的含义过度明说。
- source_word: προσκυνεῖν δεῖ
  choice: 人必须敬拜
  rationale: δεῖ表示一般性的必要或义务；“人必须敬拜”自然表达其非特指、规范性的语气。
- source_word: καὶ
  choice: 而
  rationale: καί形式上是连接词，但上下文有“我们的祖先”与“你们”的明显对照；汉语用“而”既保留连接关系，也自然呈现原文已有的对比，不强化为“但是”。
theological_decisions:
- issue: 是否明确补出撒玛利亚人与犹太人的身份
  choice: 仅保留“我们的祖先……而你们说……”的对照
  alternative: 译作“我们撒玛利亚人的祖先……但你们犹太人说……”
  rationale: 本节借代词和上下文形成群体对照，并未明说两个群体的名称；不补出身份可避免把语境信息加入正文。
- issue: 如何表达 προσκυνεῖν δεῖ 的非人称必要性
  choice: 译作“人必须敬拜”
  alternative: 译作“人应当敬拜”或“敬拜是必要的”
  rationale: 该结构表达关于敬拜地点的一般性、规范性主张，而非只对某个特定的人发命令。“必须”保留δεῖ较明确的必要性，同时以泛指的“人”体现其非人称性质。
- issue: 是否把耶路撒冷表述为“唯一”或“正确”的敬拜地点
  choice: 译作“耶路撒冷是……的地方”
  alternative: 译作“耶路撒冷才是唯一正确的敬拜地方”
  rationale: 定冠词和语境确有特定地点的意味，但原文没有“唯一”或“正确”等词；保持简洁可保留妇人陈述中的张力而不作解释性扩展。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“祖先”“敬拜”“必须”均为普通读者熟悉的表达；分号呈现两个群体主张之间的平行与对照。
