source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: zh_hans
  text: 这人听说耶稣从犹太来到加利利，就去见他，请他下去医治自己的儿子，因为他的儿子快要死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 承接上一节的王室官员，并保留指示代词的作用；现代汉语叙事中自然清楚。
- source_word: ἀκούσας
  choice: 听说
  rationale: 以时间关系顺畅表达不定过去时分词；此处所听见的是关于耶稣行程的消息，因此“听说”比单纯“听见”自然。
- source_word: ἥκει
  choice: 来到
  rationale: 表达耶稣已经抵达、现已在加利利的结果状态；汉语无需另加“已经”也能由上下文体现先时关系。
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: 从犹太来到加利利
  rationale: 保留出发地和目的地两个方向关系，同时符合现代汉语习惯。
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: 就去见他
  rationale: 准确表达前往耶稣那里的动作；“去见他”比直译“去到他那里”更自然。
- source_word: ἠρώτα
  choice: 请
  rationale: ἐρωτάω在此指提出请求。未将未完成时强制译为反复的“不断请求”，以保留其可表示持续或背景动作的开放性。
- source_word: ἵνα καταβῇ
  choice: 请他下去
  rationale: 按请求动词后的目的/内容从句译为汉语兼语结构；“下去”保留καταβαίνω所含的地势下降和离开当前地点前往别处的方向感。
- source_word: ἰάσηται
  choice: 医治
  rationale: 准确表达身体疾病得医治，也保留本段神迹语境中庄重而常用的措辞。
- source_word: αὐτοῦ τὸν υἱόν
  choice: 自己的儿子
  rationale: 反身领属形式明确儿子属于前来求助的官员，避免连续两个“他”可能造成的指代含混。
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: 因为他的儿子快要死了
  rationale: “快要”表达μέλλω加不定式所指的迫近情形；重述“他的儿子”使汉语指代清楚。
theological_decisions:
- issue: “快要死了”的主语所指
  choice: 明确指官员的儿子
  alternative: 仅用“他快要死了”，保留形式上的代词
  rationale: 就近的语法先行词和叙事语境都表明将死的是儿子。汉语重述名词可消除不必要的指代歧义，并未加入教义性解释。
- issue: 未完成时ἠρώτα的体貌力度
  choice: 译作“请”，不明确加入反复意味
  alternative: 译作“不断请求”或“再三恳求”
  rationale: 未完成时容许持续或反复理解，却不单独要求迭代或强烈恳求。正文采用不额外强化的自然表达，以免消除原文的体貌弹性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“犹太”“加利利”“医治”沿用通行圣经地名和用语；句式简洁，保留“下去”的地理方向信息。
