id: JHN.4.21
reference: John 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: zh_hans
  text: 耶稣对她说：“妇人[a]，请信我[b]：时候[c]将到，那时你们敬拜父，既不在这座山上，也不在耶路撒冷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妇人”在当时是对成年女性的尊重称呼，并非粗鲁或轻蔑的说法。
    reason: cultural_note
  - marker: b
    text: 或译“请相信我所说的”。原文动词既可侧重相信某人的话，也可含有信赖那人的意味。
    reason: lexical_alternative
  - marker: c
    text: 也可译“时刻”。原文没有冠词，但约翰福音常以“时候”指上帝计划中将要来到的决定性时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: 请信我
  rationale: 这里是现在时主动命令式加与格代词，直接要求对方相信耶稣接下来所说的话。“请信我”在现代汉语中自然，也保留了“信”与约翰福音中 πιστεύω 用语的联系；“请相信我所说的”虽更明确，却增加了原文未明说的宾语。
- source_word: γύναι
  choice: 妇人
  rationale: 这是对成年女性的直接称呼，在当时语境中并非无礼。“妇人”比“女人”更庄重，也比“女士”更接近原词，不额外加入亲昵意味。
- source_word: ἔρχεται ὥρα
  choice: 时候将到
  rationale: ὥρα 在约翰福音中常指上帝计划中具有决定意义的时刻。“时候”既保留这一主题词，又比生硬的“一个时辰”更符合现代汉语；汉语不以冠词区分“一时候”和“那时候”，因此不强行补入定指。
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: 在这座山上
  rationale: ἐν 与山岳地点连用时，现代汉语自然表达为“在……山上”；“这座山”保留了对话现场所指的撒玛利亚圣山。
- source_word: ἐν Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: 按现代汉语地名用法自然译出；原文复数形式是该城名的常见希腊语形式，不需在译文中体现。
- source_word: προσκυνήσετε
  choice: 你们敬拜
  rationale: 这是第二人称复数将来时；“你们”准确体现复数，而“敬拜”符合约翰福音第4章讨论宗教崇拜的语境，比仅表示身体动作的“下拜”更全面。将来意义由前面的“时候将到，那时”清楚表达。
- source_word: τῷ πατρί
  choice: 父
  rationale: 上下文明确指上帝为父。“父”保留约翰福音的称谓，并避免添加原文没有的解释性名称。
- source_word: οὔτε ... οὔτε
  choice: 既不……也不……
  rationale: 这一汉语关联结构自然地保留了两个敬拜地点都被否定的并列关系。
theological_decisions:
- issue: 耶稣以 γύναι 称呼对方的语气
  choice: 正文译作“妇人”，并以脚注说明这是尊重而非粗鲁的称呼
  alternative: 女士；女人；亲爱的妇人
  rationale: “妇人”较贴近原文字面和庄重语体；“女士”带入现代社交称谓，“亲爱的妇人”则增加了原文没有的亲昵成分。语气问题由脚注澄清，不在正文中扩写。
- issue: 约翰福音中的 ὥρα 主题
  choice: 保留“时候”，不泛化为“日子”或解释为某一特定救赎事件
  alternative: 时刻；日子；那决定性的时刻
  rationale: 原文让这个将到的“时候”保持一定开放性，同时它又承载约翰福音的主题意义。“时候”可保留这种张力，不把具体所指提前解释进正文。
- issue: 敬拜地点转变的范围
  choice: 按原文只陈述将不再局限于这座山或耶路撒冷
  alternative: 扩写为“任何地方都可以敬拜”或“圣殿敬拜将被废除”
  rationale: 本节否定两个地点，却没有在本句中完整说明新敬拜方式；不加入后文内容或特定教义推论，可保留经文自身的推进和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妇人”略带庄重和经文语体色彩，但仍为现代读者所理解，并能避免“女人”在直接称呼中可能产生的冒犯感。句式以“时候将到，那时……”自然承接希腊文结构；“既不……也不……”清楚呈现两个地点的并列否定。
