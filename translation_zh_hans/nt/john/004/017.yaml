base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: zh_hans
  text: 那女人回答他，说：“我没有丈夫。”耶稣对她说：“你说‘我没有丈夫’，说得不错。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: 那女人回答他说
  rationale: 希腊语采用“回答并说”的叙事表达；现代汉语用“回答他说”即可自然传达回应和说话对象，避免生硬重复。
- source_word: Οὐκ ἔχω ἄνδρα
  choice: 我没有丈夫
  rationale: ἀνήρ可指“男人”或“丈夫”；下文明确谈到她的婚姻经历，因此此处译作“丈夫”最符合语境。
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: 耶稣对她说
  rationale: λέγει是叙事性历史现在时；现代汉语叙事用“说”自然，不必刻意标示时态转换。
- source_word: Καλῶς εἶπας
  choice: 说得不错
  rationale: καλῶς在这里肯定她所说属实。“说得不错”是自然、庄重且易懂的现代汉语，也保留了话语中可能带有的进一步意味。
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: 你说‘我没有丈夫’
  rationale: ὅτι引出所说内容；采用嵌入引语，清楚保留耶稣对她原话的复述，并保留重复所产生的强调。
theological_decisions:
- issue: ἀνήρ在妇人陈述中的含义
  choice: 丈夫
  alternative: 男人
  rationale: 该词本身可有两义，但紧接的第18节明确涉及她先前和现有的婚姻或伴侣关系；译作“丈夫”传达本语境中的具体含义，而不增添额外神学判断。
- issue: Καλῶς εἶπας的语气
  choice: 说得不错
  alternative: 说得对
  rationale: “说得不错”既表达耶稣肯定这句话属实，又不像“完全正确”那样过度强化评价，因而保留上下文中肯定与揭示并存的张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“那女人”承接叙事中的既知人物；直接引语简洁清楚。未设置脚注，因为“丈夫”在本节及紧邻语境中已足够明确，正文无需以脚注重复说明。
