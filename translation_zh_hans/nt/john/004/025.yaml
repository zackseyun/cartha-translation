  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: zh_hans
  text: 那女人对他说：“我知道弥赛亚（就是那被称为基督的[a]）要来。他来的时候，会把一切都告诉我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”源自闪语；“基督”源自希腊语。两个称号都意为“受膏者”。约翰在这里用“基督”解释“弥赛亚”。
    reason: 说明原文中两个不同语言称号的对应关系；中文若只按通常称号理解，可能看不出这层解释结构。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中用“说”自然，无须另加过去时标记。
- source_word: γυνή
  choice: 那女人
  rationale: 上下文明确指撒玛利亚妇人；“那女人”既承接前文，又符合现代汉语表达。
- source_word: Οἶδα
  choice: 我知道
  rationale: 直接、自然地表达说话者明确知晓的意思。
- source_word: Μεσσίας
  choice: 弥赛亚
  rationale: 保留源自闪语的称号音译，也符合现代中文读者熟悉的圣经用语。
- source_word: ἔρχεται
  choice: 要来
  rationale: 这里的现在时具有将来含义；“要来”清楚表达即将或必将来到。
- source_word: ὁ λεγόμενος χριστός
  choice: 就是那称为基督的
  rationale: 保留原文用希腊语称号χριστός解释闪语称号Μεσσίας的结构，不把两个不同词形完全合并。
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: 他来的时候
  rationale: 表达将来的时间条件；汉语代词已足以回指弥赛亚，不必生硬译作“那一位”。
- source_word: ἀναγγελεῖ
  choice: 会……告诉
  rationale: 在此指把事情充分说明、使人知道；“告诉”搭配间接宾语“我们”最自然。
- source_word: ἡμῖν
  choice: 我们
  rationale: 作“告诉”的接受者，按现代汉语语序置于动词之后。
- source_word: ἅπαντα
  choice: 一切
  rationale: 保留该词全面、无遗漏的语气，同时比“一切事情”更简洁自然。
theological_decisions:
- issue: 如何处理Μεσσίας与χριστός并列的解释关系
  choice: 正文分别译作“弥赛亚”和“基督”，并保留括注式解释结构
  alternative: 两处都译作“弥赛亚”，仅在脚注说明希腊文用词不同
  rationale: 原文有意以χριστός解释Μεσσίας。分别采用中文惯用音译“弥赛亚”和“基督”，可保留这种跨语言解释关系，而不引入额外的教义判断。
- issue: ἅπαντα所指范围
  choice: 译作“一切”，不具体限定为敬拜、教义或当前争议
  alternative: 按上下文解释为“一切有关敬拜的事”
  rationale: 原文使用范围宽泛的ἅπαντα；保留其概括性，可避免替说话者缩窄含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那女人”承接上下文；“要来”“他来的时候”“会把一切都告诉我们”符合自然口语，同时保持经文的郑重感。
