base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: zh_hans
  text: 耶稣回答她说：“你若知道上帝的恩赐，也知道对你说‘给我水喝’的是谁，你早就会向他求，他也早就会把活水[a]赐给你了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”也可译作“流动的水”或“新鲜的水”。这个说法在日常用语中可以指流动的水；译作“活水”，则保留了耶稣在这里话语中的双重含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: 耶稣回答她说
  rationale: “回答……说”自然保留希腊文回应动词与说话动词的叠用，也符合现代汉语叙事表达。
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: 上帝的恩赐
  rationale: “恩赐”既表达 δωρεά 是白白赐下的礼物，又比“礼物”更适合此处庄重语境；属格仍保留为“上帝的”，不预先限定为来源或所有关系。
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: 对你说……的是谁
  rationale: 以自然汉语保留对说话者身份的强调；上下文已明确这句话正对妇人说，无须用生硬的进行式。
- source_word: Δός μοι πεῖν
  choice: 请给我水喝
  rationale: 这是现代汉语对“给我喝”的自然表达；补出“水”由井旁语境明确，并能避免“给我喝”可能产生的歧义。“请”符合请求语气，不表示希腊文另有礼貌词。
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: 你早就会求他
  rationale: “早就会”配合后文“了”，自然表达希腊文未实现条件句所指向的反事实结果，同时不采用过度欧化的时态结构。
- source_word: ἔδωκεν ἄν σοι
  choice: 他也早就会把……赐给你了
  rationale: 与条件句前半相呼应，传达 ἄν 所标明的反事实结果；“赐给”适合由耶稣给予属灵恩赐的语境，但没有增添对象性质。
- source_word: ὕδωρ ζῶν
  choice: 活水
  rationale: “活水”是简洁而通行的汉语表达，既可指流动、新鲜的水，又保留约翰叙事中进一步的象征含义。
theological_decisions:
- issue: ὕδωρ ζῶν 的日常意义与象征意义
  choice: 活水
  alternative: 流动的水；新鲜的水
  rationale: 原语可按日常用法指流动或新鲜的水，但上下文又引向更深的属灵意义。“活水”不把这两层张力提前消解。
- issue: “上帝的恩赐”具体所指
  choice: 保留“上帝的恩赐”，不在正文中具体说明
  alternative: 上帝所赐的活水；耶稣这份恩赐
  rationale: 本节没有明确界定“恩赐”究竟专指活水、耶稣本人，还是上帝借耶稣所赐的一切；译文保留其开放性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“上帝”用于 θεός；引语层级以中文双引号和单引号区分。脚注标记置于整节末尾，明确对应“活水”。
