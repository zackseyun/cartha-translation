base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: zh_hans
  text: 有一个从撒马利亚来的妇人前来打水。耶稣对她说[a]：“请给我水喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“来”和“说”均使用叙事性的历史现在时；汉语动词不标示时态，正文按汉语叙事习惯译出。
    reason: 说明原文叙事时态及汉语译法。
lexical_decisions:
- source_word: Ἔρχεται
  choice: 来
  rationale: 这里是叙事中的历史现在时。中文叙事通常不必用形态变化标示过去；“来”自然地表达事件进展，同时保留希腊文的生动感。
- source_word: γυνὴ
  choice: 有一个……妇人
  rationale: 此处指一名尚未具名的成年女性，并非特指妻子。“有一个……妇人”自然引入新人物。
- source_word: ἐκ τῆς Σαμαρείας
  choice: 从撒马利亚来的
  rationale: 直译其来源地，不在本节正文中提前改写为带明确族群身份的“撒马利亚妇人”。
- source_word: ἀντλῆσαι ὕδωρ
  choice: 来打水
  rationale: 不定式表示目的；“打水”是现代汉语中从井等水源汲水的自然说法。
- source_word: λέγει αὐτῇ
  choice: 对她说
  rationale: 希腊文使用历史现在时；汉语“说”本身不标时态，在叙事中自然顺畅。
- source_word: Δός μοι πεῖν
  choice: 请给我水喝
  rationale: 准确传达“给我喝”的请求含义；补出宾语“水”由紧邻语境明确，加入“请”使现代汉语中的请求语气自然，但不削弱命令式的直接性。
theological_decisions:
- issue: “撒马利亚”的所指及妇人的身份表达
  choice: 从撒马利亚来的妇人
  alternative: 撒马利亚妇人；从撒马利亚城来的妇人
  rationale: 希腊文明确说妇人“从撒马利亚来”，本节并未直接使用族群形容词。正文保留来源表达，不额外限定为撒马利亚城，也不提前将其改写为族群称谓。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“妇人”比“女人”更符合经文语体，又不显陈旧；“请给我水喝”自然传达直接请求。脚注标记已置于“说”之后。
