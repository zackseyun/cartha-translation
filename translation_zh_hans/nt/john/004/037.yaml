  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: zh_hans
  text: 因为在这事上，这话是真的：“一个人撒种，另一个人收割。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒种的是一个人，收割的是另一个人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: 因为在这件事上
  rationale: γάρ承接上文，说明前一句的根据；ἐν τούτῳ指向耶稣正在谈论的情形。译为“因为在这件事上”既保留指示关系，也符合现代汉语表达。
- source_word: ὁ λόγος
  choice: 这句话
  rationale: 这里的λόγος指随后引出的格言或说法，并非约翰著作中作为称号的“道”。“这句话”自然、清楚，又不把它过度限定为固定谚语。
- source_word: ἐστὶν ἀληθινός
  choice: 是真的
  rationale: 表示这句话在当前情形中得到证实、确实成立；“是真的”直接保留其判断语气。
- source_word: ὅτι
  choice: 冒号和引号
  rationale: ὅτι引出这句话的具体内容；现代汉语用冒号和引号比直译为“即”更自然。
- source_word: ἄλλος ... καὶ ἄλλος
  choice: 一个人……另一个人
  rationale: 明确表达两个不同的行动主体，同时保持希腊文简洁而对称的对比。
- source_word: ὁ σπείρων
  choice: 撒种
  rationale: 实词化的现在分词表示从事撒种的人。置于“一个人”之后译作“撒种”，在汉语中自然，并保留动作性。
- source_word: ὁ θερίζων
  choice: 收割
  rationale: 与“撒种”平行，保留实词化现在分词的动作含义，也形成简洁的格言式对偶。
theological_decisions:
- issue: 撒种者和收割者的具体所指
  choice: 正文只保留一般性的格言，不指明双方是谁
  alternative: 在正文中将撒种者解释为先知、施洗约翰或耶稣，将收割者解释为门徒
  rationale: 本节希腊文本只陈述两类不同的行动者，并未在句内明确他们的身份。具体应用要由上下文判断，因此译文不把某种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一个人撒种，另一个人收割”保留原文的对称结构和格言感；引号标明随后内容是所说的那句话。
