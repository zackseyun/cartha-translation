  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: zh_hans
  text: 难道你比我们的祖先雅各还大吗？[a]他把这口井给了我们；他自己也喝过这井里的水，他的儿子们和牲畜也喝过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不会比我们的祖先雅各还大吧？”希腊文以μή引导的问句预期否定的回答。
    reason: 说明μή引导的反问所预期的否定回答，并提供较明确的汉语替代译法。
lexical_decisions:
- source_word: μὴ σὺ
  choice: 难道你……吗
  rationale: μή引导的问题预期否定回答；“难道……吗”自然传达反问语气，且“你”保留了σὺ的强调。
- source_word: μείζων
  choice: 还大
  rationale: 这里指身份、地位或重要性上的伟大，而非体形大小；“比……还大”是现代汉语中自然的比较表达。
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: 我们的祖先雅各
  rationale: πατήρ在此指民族共同祖先；“祖先”比字面上的“父亲”更符合现代汉语，又保留撒玛利亚妇人对共同祖源的诉求。
- source_word: ἔδωκεν ἡμῖν
  choice: 把……留给了我们
  rationale: 直译“给了我们”容易让现代读者误解为直接给予当代人；“留给了我们”自然表达井作为祖传产业传下来的含义。
- source_word: τὸ φρέαρ
  choice: 这口井
  rationale: φρέαρ在此是井；量词“口”符合现代汉语习惯，“这”依据当前谈论的井自然指称。
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: 他自己……也都喝过这井里的水
  rationale: “他自己”保留αὐτός的强调；“喝过这井里的水”以自然汉语表达“从井中喝”。
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: 他的儿子们
  rationale: υἱοί明确指男性后代，故不泛化为“儿女”或“孩子”。
- source_word: τὰ θρέμματα αὐτοῦ
  choice: 牲畜
  rationale: θρέμματα泛指饲养的家畜；“牲畜”准确且不局限于牛群。
theological_decisions:
- issue: μή所引反问句的语力
  choice: 用“难道……吗”表达预期否定回答的反问
  alternative: 你不比我们的祖先雅各更大，对吧？
  rationale: 原文预期回答是“不”，但仍以疑问形式提出挑战；“难道……吗”既保留疑问与语气，也不把隐含答案改成明说。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“祖先”避免现代读者将雅各误认作妇人的亲生父亲；后半句适度调整语序，使并列主语和共同谓语符合汉语表达习惯。
