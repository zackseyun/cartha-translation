source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: zh_hans
  text: 妇人对他说：“主啊[a]，请把这水给我，使我不再渴，也不用再到这里来打水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主啊”或译“先生”。
    reason: κύριε既可指“主”，也可在此用作尊称；脚注保留原文在直接语境中的歧义。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事中用“说”即可自然表达，不必另行标示时态。
- source_word: γυνή
  choice: 妇人
  rationale: 这里指前文的撒玛利亚妇人；“妇人”在现代中文圣经叙事中庄重自然，也不会误解为“妻子”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε既可作“主啊”，也可作礼貌称呼“先生”。正文保留“主啊”，以维持约翰福音中可能具有的双层意味，另一译法列入脚注。
- source_word: δός μοι
  choice: 请把……给我
  rationale: 准确表达命令式“给我”；加入“请”符合此处请求语气和自然汉语表达，并未削弱其直接性。
- source_word: τοῦτο τὸ ὕδωρ
  choice: 这水
  rationale: 原文只说“这水”，本节不补入“活”字，以免把上下文中的修饰语带进本句。
- source_word: ἵνα μὴ διψῶ
  choice: 使我不再渴
  rationale: 表达目的从句及持续、反复意义；“不再”符合妇人希望以后免受口渴之苦的语境。
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: 也不用再到这里来
  rationale: μηδέ连接第二个否定目的；διέρχωμαι与“这里”连用，在本语境中自然译为“到这里来”，“再”体现反复取水的实际情形。
- source_word: ἀντλεῖν
  choice: 打水
  rationale: 在井边语境中，ἀντλεῖν指汲取水；现代汉语“打水”简洁、明确且自然。
theological_decisions:
- issue: 撒玛利亚妇人以κύριε称呼耶稣的含义
  choice: 正文译“主啊”
  alternative: “先生”
  rationale: 该词在当下对话层面可能只是礼貌称呼，也可能在约翰福音的叙事中产生更深回响。正文与脚注并列保存这种张力，不把妇人此时的话明确解释为信仰告白。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请把这水给我”符合自然口语；“不再……也不用再……”清楚表达妇人对持续免渴和免于反复前来打水的理解。
