  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: zh_hans
  text: 但把这些事记载下来，是要使你们相信[a]耶稣是弥赛亚[b]，是上帝的儿子；并且使你们因信在他的名中得生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本采用不定过去时形式，可理解为“开始相信”；本译文所据的希腊语正文采用现在时形式，且有抄本支持这一读法，可理解为“持续相信”。正文用较宽泛的“相信”，不限定是哪一种侧重。
    reason: textual_variant
  - marker: b
    text: 或译“基督”。希腊语Χριστός在这里是称号，意为“受膏者”，相当于“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα δὲ γέγραπται
  choice: 但这些事记载下来
  rationale: “这些事”承接上文所述的神迹及其书面记载；“但”表达温和的转折或话语推进；“记载下来”兼顾完成时被动态所表达的既已写成、其结果仍然存留。
- source_word: ἵνα πιστεύητε
  choice: 是要使你们相信
  rationale: ἵνα引出目的。“相信”在现代汉语中不强行限定开始相信或持续相信，可保留本句动词形态及抄本异文所涉及的含义张力。
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: 耶稣是弥赛亚
  rationale: ὅτι引出相信的内容；Χριστός在这里是称号，译作“弥赛亚”可表达受膏君王的身份和犹太背景，而非把称号当作名字。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留这一基督论称号，不作弱化或扩充。
- source_word: καὶ ἵνα πιστεύοντες ζωὴν ἔχητε
  choice: 并且使你们因信而……得生命
  rationale: 保留第二个并列目的分句；“因信而”将分词πιστεύοντες表达为与“得生命”相关的方式或伴随情形。原文只说“生命”，没有明说“永生”，因此不作增译。
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: 在他的名里
  rationale: 尽量保留ἐν与“他的名”的表达及其约翰语境中的神学内涵，避免将“他的名”悄然改作“相信”的直接宾语。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处的Χριστός用于确认耶稣的弥赛亚身份。正文翻译称号的意义；传统译法“基督”列入脚注。
- issue: πιστεύητε的文本及体貌问题
  choice: 相信
  alternative: 开始相信；持续相信
  rationale: SBLGNT正文采用现在时虚拟式πιστεύητε，部分抄本则采用不定过去时虚拟式πιστεύσητε。现代汉语“相信”本身不强行规定起始或持续，适合在正文中保留开放性，并在脚注说明异文。
- issue: ἐν τῷ ὀνόματι αὐτοῦ与生命的关系
  choice: 在他的名里得生命
  alternative: 藉着他的名得生命；因信他的名而得生命
  rationale: 按希腊语结构，ἐν τῷ ὀνόματι αὐτοῦ最自然地与“有生命”相连。所选译文保留这一连接，避免把“他的名”改作πιστεύοντες的宾语；同时不把ἐν只解释为工具意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但这些事记载下来”自然承接上文；两个“使你们”保留原文并列的目的结构。“在他的名里”略带经文语体，但可较准确地保存原文介词结构及其神学开放性。标点用分号区分两个目的分句，以提高可读性。
