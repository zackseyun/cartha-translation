  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: zh_hans
  text: 于是，那先到坟墓的另一个门徒也进了坟墓[a]；他看见了，也信了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也进入了坟墓”。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“信了”，没有明确说明他信了什么。有人理解为他相信耶稣已经复活，有人理解为他相信眼前证据所表明的事，也有人理解为他相信先前的报告。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: 于是
  rationale: 既表达叙事上的先后推进，也保留 οὖν 所带的轻微承接、推论意味；比单用“然后”更贴近原文组合。
- source_word: εἰσῆλθεν
  choice: 进去了
  rationale: 准确表达进入坟墓这一具体动作，符合现代汉语叙事习惯。
- source_word: ὁ ἄλλος μαθητής
  choice: 另一个门徒
  rationale: “门徒”是约翰福音语境中 μαθητής 的准确、通行译法。
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: 那先到坟墓的
  rationale: 自然地把分词短语处理为定语，并清楚表明这门徒比彼得先到坟墓。
- source_word: μνημεῖον
  choice: 坟墓
  rationale: 此处指耶稣安葬之处；“坟墓”准确、自然，也适合庄重的叙事语体。
- source_word: καὶ εἶδεν
  choice: 他看见了
  rationale: 直接对应 εἶδεν；补出汉语主语“他”，使句意清楚。“了”标明已经发生的动作。
- source_word: καὶ ἐπίστευσεν
  choice: 就信了
  rationale: “就”自然呈现看见之后随即相信的叙事衔接；不补出相信的具体内容，保留原文绝对用法的含混性。
theological_decisions:
- issue: 这门徒所相信的具体内容
  choice: 只译作“信了”，不说明宾语
  alternative: 译作“相信耶稣已经复活了”、“相信了马利亚的话”或“开始有了信心”
  rationale: 希腊文 ἐπίστευσεν 没有明说相信什么；尤其结合下一节，不宜由译文替读者裁定。保留不明说的表达，可维持原文的叙事与神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”兼顾时间推进和轻微推论；分号呈现进入、看见、相信三个动作之间的层次。脚注标记按其实际说明对象分别置于“进去了”和“信了”之后。
