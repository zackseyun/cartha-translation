  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: zh_hans
  text: 然后他对多马说：“把你的指头伸到这里来，看看我的手；把你的手伸过来，探入我的肋旁。不要成为不信的，而要成为相信的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要成为没有信心的，而要成为有信心的”；这两个希腊文形容词也可带有“不忠信／忠信”的含义，但本段上下文的重点是多马是否相信复活了的耶稣。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: 然后
  rationale: 表示叙事中的先后次序；“然后”自然清楚。
- source_word: λέγει
  choice: 他说
  rationale: 希腊文采用历史现在时；现代汉语叙事用“说”即可自然承接上下文，无须机械标示时态。
- source_word: Φέρε
  choice: 伸到这里来／伸过来
  rationale: φέρω本义为“带来、拿来”，在此指把指头或手移向耶稣身体；按汉语习惯译作“伸……来”，并保留两次命令的呼应。
- source_word: ἴδε τὰς χεῖράς μου
  choice: 看看我的手
  rationale: ἴδε在此是观看的命令；“看看”符合当面指示的自然口吻，并保留“手”的复数整体意义。
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: 探入我的肋旁
  rationale: βάλε与εἰς表达把手放入的动作；“探入”自然传达方向性，πλευρά译为“肋旁”，指耶稣被刺的身体侧面。
- source_word: μὴ γίνου
  choice: 不要成为
  rationale: 保留γίνομαι所含的变化或趋向意味，避免仅译作静态的“不要是”。
- source_word: ἄπιστος … πιστός
  choice: 不信的……相信的
  rationale: 上下文聚焦多马是否相信耶稣已经复活；此译优先呈现信与不信，同时以脚注保留“无信／有信、失信／忠信”的词义空间。
theological_decisions:
- issue: ἄπιστος / πιστός在对多马劝告中的对比
  choice: 不信的／相信的
  alternative: 无信的／有信的；失信的／忠信的
  rationale: 紧邻语境是多马先前拒绝相信复活见证，因此信与不信是主要含义；但两个形容词也可表达无信与有信、失信与忠信，故不把其他词义可能性从读者面前抹去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸到这里来／伸过来”符合当面指示动作的汉语表达；“肋旁”比“侧面”更具经文语体，又不显古奥。脚注标记置于整句引语之后。
