id: JHN.20.16
reference: John 20:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: zh_hans
  text: 耶稣对她说：“马利亚！”她转过身来，用希伯来话[a]对他说：“拉波尼！”（意思是“老师！”）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用亚兰话”。约翰所说的“希伯来话”也可能泛指犹太地区通行的闪语。
    reason: 保留Ἑβραϊστί在约翰用法中可能指亚兰语的解释，而不在主文中消除歧义。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用历史现在时，使叙事更生动；现代汉语以“说”自然表达，不必强行标示时态。
- source_word: αὐτῇ
  choice: 对她
  rationale: 与λέγει搭配，按现代汉语自然译为“对她说”。
- source_word: Μαριάμ
  choice: 马利亚
  rationale: 采用中文圣经语境中通行且易识别的人名译法。
- source_word: στραφεῖσα
  choice: 转过身来
  rationale: 简洁表达不定过去时分词所指的动作，并保留与随后说话动作的先后关系。
- source_word: ἐκείνη
  choice: 她
  rationale: 此处指回马利亚，现代汉语用人称代词最自然，无须生硬译作“那一个”。
- source_word: Ἑβραϊστί
  choice: 用希伯来话
  rationale: 主文按希腊词的直接含义翻译；该词在约翰的用法中也可能广义指犹太地区的闪语，即亚兰语，故另加脚注说明。
- source_word: Ραββουνι
  choice: 拉波尼
  rationale: 保留原称呼的音译，因为作者随即给出释义；这样也保存马利亚呼喊时的语言与情感色彩。
- source_word: ὃ λέγεται Διδάσκαλε
  choice: 意思是“老师！”
  rationale: λέγεται在此引出释义；Διδάσκαλε是呼格，译作“老师”准确自然，并用感叹号呼应直接称呼的语气。
theological_decisions:
- issue: 约翰叙事中Ἑβραϊστί的所指
  choice: 用希伯来话
  alternative: 用亚兰话
  rationale: 主文遵循希腊文表层措辞，不把可能的历史语言判断直接代入正文；同时以脚注保留该词可能泛指犹太地区亚兰语的解释。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事表达。“马利亚”“拉波尼”沿用中文读者容易识别的传统译名；正文与脚注共同保留原文在语言名称上的张力。
