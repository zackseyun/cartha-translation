  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: zh_hans
  text: 说了这话，他就向他们吹气[a]，对他们说：“你们领受圣灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他们里面吹气。”这个动词也使人联想到《创世记》2:7和《以西结书》37章中创造和新创造的意象。
    reason: 说明该动词可能具有“吹入”的方向性译法，以及其与旧约创造／新创造意象的互文联系；这些含义不在正文中确定化。
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: 说了这话
  rationale: 不定过去时分词表示先于主句动作发生；“说了这话”在现代汉语叙事中简洁自然，并保留动作次序。
- source_word: ἐνεφύσησεν
  choice: 向他们吹了一口气
  rationale: 该动词可指向某人吹气或把气吹入；结合后面的“对他们说”，汉语译作“向他们吹了一口气”最自然，同时不在正文中过度限定方向或所含的创造意象。
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 原文使用叙事性现在时；现代汉语不需借助时态变化来凸显这一点，按连续叙事译作“对他们说”自然准确。
- source_word: Λάβετε
  choice: 你们领受
  rationale: 这里的 λαμβάνω 是不定过去时命令式；“领受”比“拿取”更符合圣灵作为所赐恩惠的语境，也保留直接命令的语气。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 尽管希腊文没有冠词，约翰福音的语境清楚指向神的圣灵；汉语专名“圣灵”无需冠词，也不应译成泛指的“圣洁的灵”。
theological_decisions:
- issue: πνεῦμα ἅγιον 是指神的圣灵，还是泛指“圣洁的灵”
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 约翰福音及新约整体语境最自然地指向神的圣灵。译作“圣灵”忠实表达所指，但不额外说明此处赐予与五旬节之间的关系。
- issue: ἐνεφύσησεν 是否明确表示把气吹进门徒里面
  choice: 向他们吹了一口气
  alternative: 把气吹进他们里面
  rationale: 该动词能唤起创造与新创造的经文意象，但本节的句法并未明确使用表示“进入”的介词短语；正文保留较宽的表达，将可能的方向性和互文联系放在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说了这话”保持简洁叙事节奏；“向他们吹了一口气”符合自然汉语；引语用感叹号体现命令式的直接力度，但不增加强硬或威吓色彩。
