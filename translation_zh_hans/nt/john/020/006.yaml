  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: zh_hans
  text: 于是，西门·彼得也跟着他来到，进了坟墓，看见细麻布放在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文使用历史现在时推动叙事；现代汉语叙事不必用形态时态标明过去，“来到”自然地承接上一节，并保留现场感。
- source_word: οὖν
  choice: 于是
  rationale: 在这里主要标示由前文情形引出的叙事进展；“于是”比表示严格论证的“所以”更贴合语境。
- source_word: καὶ Σίμων Πέτρος
  choice: 西门·彼得也
  rationale: 结合上一节另一位门徒先到坟墓的语境，καί具有附加意味，“也”清楚表达彼得随后同样来到。
- source_word: ἀκολουθῶν αὐτῷ
  choice: 跟着他
  rationale: 以自然简洁的汉语表达与主动作同时发生的分词结构，并保留代词所指。
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: 进了坟墓
  rationale: εἰσῆλθεν与εἰς明确表示进入；“进了坟墓”在现代汉语中自然，并准确指向安葬耶稣的墓穴。
- source_word: θεωρεῖ
  choice: 看见
  rationale: 该词在此指彼得进入后目睹墓中景象。“看见”通顺直接；希腊文的历史现在时所带来的鲜活感可由连续动作和场景描写体现。
- source_word: τὰ ὀθόνια
  choice: 细麻布
  rationale: ὀθόνια指用于安葬的麻布条或麻布，不必把“裹尸”这一用途直接写入正文；“细麻布”兼顾传统可识别性与词义透明度。
- source_word: κείμενα
  choice: 还放在那里
  rationale: κείμενα描写细麻布处于放置、躺置的状态。“放在那里”符合汉语场景描写；“还”承接上一节已见到麻布的叙事，但不额外断言其摆放方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。汉语没有必须对应希腊文历史现在时的形态变化，因此不设置时态脚注；以“于是”和一连串动作保持叙事推进及现场感。人名采用“西门·彼得”，既清楚又符合现代简体中文标点习惯。
