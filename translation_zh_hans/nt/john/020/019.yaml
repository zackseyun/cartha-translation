source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: zh_hans
  text: 那一天，就是一周的第一天，到了晚上，门徒所在的地方门都锁着，因为他们害怕犹太人[a]。耶稣来了，站在他们中间，对他们说：“愿你们平安[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在这里也可能特指“犹太领袖”，或译作“犹太地人”；这取决于如何理解本段语境中的希腊词Ἰουδαῖοι。
    reason: alternative_reading
  - marker: b
    text: 也可译作：“平安归给你们。”希腊文直译为“平安给你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: 到了晚上
  rationale: 属格独立结构交代时间背景；“到了晚上”自然表达入夜时分。οὖν在此承接上文，汉语叙事无需机械译出，借整体语序体现衔接。
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: 那一天，就是一周的第一天
  rationale: 保留“那一天”与前文的指涉，并用同位说明清楚表达惯用语“一周的第一天”。
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: 门都锁着
  rationale: 完成时被动分词强调门已关闭并保持在受控状态；在门徒惧怕的语境中，“锁着”比单纯“关着”更贴切。复数含义由“都”自然体现。
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: 门徒
  rationale: 原文关系结构说明门徒所在之处；汉语以“门都锁着，因为门徒……”可自然承接同一地点，而不增添“聚集”等原文未明说的信息。
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: 因为门徒害怕犹太人
  rationale: διά加宾格表示原因。将名词性“惧怕”转为现代汉语动词句，明确惧怕者而不改变含义；Ἰουδαίων正文按词面译为“犹太人”，脚注保留语境上的其他可能。
- source_word: ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον
  choice: 耶稣来站在他们中间
  rationale: 保留两个连续动作以及“中间”的空间意象；“他们”由门徒这一明确语境补出。
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 历史现在时按现代汉语叙事习惯处理，不必刻意改变时态层次。
- source_word: Εἰρήνη ὑμῖν
  choice: 愿你们平安
  rationale: 这是自然、庄重的汉语问安表达，既传达祝愿语气，又保留εἰρήνη的“平安”含义；脚注注明更贴近字面的表达。
theological_decisions:
- issue: τῶν Ἰουδαίων在《约翰福音》此处的所指
  choice: 正文译作“犹太人”，脚注说明可能指“犹太领袖”或“犹太地区的人”。
  alternative: 正文直接译作“犹太领袖”或“犹太地区的人”。
  rationale: 希腊词本身没有明说“领袖”，语境虽很可能侧重耶路撒冷敌对势力，译文仍不宜替原文缩窄所指。脚注既保存词义歧义，也避免现代读者将其误解为对所有犹太人的笼统指控。
- issue: Εἰρήνη ὑμῖν的语用力度
  choice: 译作“愿你们平安”。
  alternative: “平安归给你们”或“你们平安”。
  rationale: 原文是省略动词的问安或祝福式表达。“愿你们平安”符合现代汉语，同时不把它限定为普通寒暄或特定教义宣告。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。时间成分前置，使场景清楚；避免增译门徒“聚集”或耶稣如何进入锁门之处。正文所有脚注标记均已对应列出。
