  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: zh_hans
  text: 还有原来在他头上的头巾，没有和细麻布放在一起，而是另在一处卷着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卷着”也可译作“包着”或“折叠着”。
    reason: 原文ἐντετυλιγμένον可描述卷起、包起或折起后的状态，具体形态并不确定。
lexical_decisions:
- source_word: σουδάριον
  choice: 头巾
  rationale: 在安葬语境中，指放在死者头部或脸部的布。“头巾”简明自然，并由后面的“原来在他头上”限定其用途，避免误解为普通手帕。
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: 在他头上
  rationale: 贴近原文的空间表达，不进一步限定为包住、围住或盖住，从而保留放置方式上的含混。
- source_word: ὀθονίων
  choice: 细麻布
  rationale: 指墓中的麻布殓布；中文以集合性名词“细麻布”自然表达，不额外加入“裹尸”等解释。
- source_word: κείμενον
  choice: 放在一起
  rationale: 结合否定结构 οὐ μετὰ τῶν ὀθονίων κείμενον，译为“没有和细麻布放在一起”，自然表达其并非与其他布料同处的状态。
- source_word: χωρὶς
  choice: 另外
  rationale: 表达与细麻布分开的空间状态，并与“而是”共同呈现原文的对比。
- source_word: ἐντετυλιγμένον
  choice: 卷着
  rationale: 该完成时被动分词表示布巾处于卷起、包起或折起的状态。“卷着”在中文中自然，也不暗示原文未明说的整齐折叠；其他可能译法列入脚注。
- source_word: εἰς ἕνα τόπον
  choice: 放在一处
  rationale: 保留“在一个地方”的具体空间描述，同时用自然中文表达为独自置于某处。
- source_word: καὶ
  choice: 还有
  rationale: 承接上一节列举墓中所见之物；“还有”比句首机械使用“和”更符合现代汉语叙事。
theological_decisions:
- issue: 布巾分开放置是否暗含复活过程或象征意义
  choice: 只译为对布巾位置和状态的观察性描述
  alternative: 把它解释为刻意整理、象征秩序，或作为某种复活情景的明确证据
  rationale: 原文只陈述头巾没有与细麻布放在一起，而在另一处呈卷起状态，并未明说其象征意义或事件重构。译文不加入这些后来的推论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“头巾”由上下文限定为安葬时置于头部的布；句式保留“没有……而是……”的鲜明对比，并避免用“叠得整整齐齐”等带解释性的措辞。
