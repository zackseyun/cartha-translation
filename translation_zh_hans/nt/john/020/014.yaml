  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: zh_hans
  text: 她说完这些话，就转过身来，看见耶稣站在那里，却不知道那是耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有认出那是耶稣。”希腊原文直译为“却不知道他是耶稣”，所表达的是她不知道眼前之人的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: 她说完这些话
  rationale: 以自然的现代汉语表达先于主句发生的动作，同时保留ταῦτα的复数含义。
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: 就转过身来
  rationale: 该短语指转向身后；“转过身来”准确而自然地表达这一动作。
- source_word: θεωρεῖ
  choice: 看见
  rationale: 叙事中的历史现在时按现代汉语习惯处理；“看见”保留实际视觉感知之意，不额外强调凝视或辨认。
- source_word: ἑστῶτα
  choice: 站在那里
  rationale: 表达完成时分词所呈现的站立状态；“在那里”使汉语场景叙述自然，但不具体限定距离。
- source_word: οὐκ ᾔδει
  choice: 却不知道
  rationale: 贴近οἶδα“知道”的基本义，并由后面的身份判断从句说明她所不知道的内容；“却”自然呈现看见与不知道之间的反差。
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: 那是耶稣
  rationale: 以现代汉语自然的身份判断句表达原文，同时不解释她未能认出耶稣的原因。
theological_decisions:
- issue: 复活后的耶稣之身份辨认
  choice: 却不知道那是耶稣
  alternative: 却没有认出那是耶稣
  rationale: 原文陈述马利亚不知道眼前之人的身份，却没有说明原因。正文保留“知道”的基本义，避免把原因或辨认机制带入经文；脚注提供符合语境的译法。
translation_notes:
  register: 采用庄重、清楚而自然的现代标准汉语。“她说完这些话”承接上文，“就……却……”使叙事推进和反差清晰。脚注标记置于相关身份判断句之后。
