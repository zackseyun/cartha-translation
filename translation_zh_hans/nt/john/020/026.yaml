source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: zh_hans
  text: 八天后，门徒又在屋里，多马也和他们在一起。门户都关着，耶稣却来到，站在他们中间，说：“愿你们平安！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: 八天后
  rationale: 按原文保留第一世纪包容式计日的表达，不直接换算为“一个星期后”。
- source_word: ἔσω
  choice: 在屋里
  rationale: 原义为“在里面”；结合门户关闭的场景，译为自然且不过度具体的“在屋里”。
- source_word: ἔρχεται
  choice: 来到
  rationale: 原文使用历史现在时；现代汉语叙事通常以“来到”自然表达，同时保留动作的现场感。
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: 门户都关着
  rationale: 属格绝对结构表伴随情形；译文保留门已关闭的状态，不额外说明耶稣如何进入。
- source_word: εἰς τὸ μέσον
  choice: 在他们中间
  rationale: 按上下文补出“他们”，清楚表达耶稣站在门徒当中。
- source_word: Εἰρήνη ὑμῖν
  choice: 愿你们平安
  rationale: 既是常见问安，也在复活显现语境中含有更深的平安意涵；此译法不把它缩减为普通的“你们好”。
theological_decisions:
- issue: 耶稣在门户关闭时来到的方式
  choice: 只陈述“门户都关着，耶稣却来到”
  alternative: 译成“耶稣穿过关着的门进来”或“耶稣突然显现”
  rationale: 原文只并列门户关闭的状态与耶稣来到，并未说明其具体方式；不应加入超出文本的机制。
- issue: “平安”是问候还是宣告
  choice: 译作“愿你们平安”
  alternative: “你们平安”或“愿平安归给你们”
  rationale: 保留该语句既可作问安、又可承载赐下平安之意味的张力，不将其限定为单一功能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又聚在屋里”自然表达门徒再次同处室内；“却”凸显门户关闭与耶稣来到之间的语义反差，但不解释进入方式。
