  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: zh_hans
  text: 因为他们还不明白圣经所说的是：他必须从死人中复活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必须从死人中起来。”希腊原文使用主动形式，直译为“起来”。
    reason: 说明原文复活动词的字面表达和主动形式，避免读者把正文理解为原文明说“被复活”。
lexical_decisions:
- source_word: οὐδέπω
  choice: 还不
  rationale: 准确表达截至当时仍未达到明白状态的时间含义，符合现代汉语叙事习惯。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明原因；汉语用“因为”比直译为“原来”更清楚自然。
- source_word: ᾔδεισαν
  choice: 明白
  rationale: 此处不是说他们不知道圣经的存在，而是尚未领会圣经所表达的意思。
- source_word: τὴν γραφὴν
  choice: 圣经所说的
  rationale: 保留单数“圣经”的权威性指称，同时以“所说的”自然引出后面的内容说明，不限定为某一明确经节。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出他们尚未明白的内容；汉语使用冒号简洁清楚，又不改变其内容从句功能。
- source_word: δεῖ
  choice: 必须
  rationale: 保留原文所表达的必然性，且不额外解释这种必然性的具体来源。
- source_word: αὐτὸν
  choice: 他
  rationale: 按汉语内容从句的自然句法，将其译为不定式逻辑主语“他”。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 保留原文复数“死人”的群体意象，比单译“从死里”更贴近希腊文。
- source_word: ἀναστῆναι
  choice: 复活
  rationale: 这是现代汉语中准确、自然的复活用语；表达主体起来而活，不把原文主动不定式改成明确的被动结构。
theological_decisions:
- issue: 复活表述中的语态与施事者
  choice: 他必须从死人中复活
  alternative: 他必须从死人中被使复活
  rationale: 希腊文ἀναστῆναι为主动不定式，因此正文采用自然的主动式“复活”，不把句子明确改写为被动，也不借翻译进一步界定复活的施事者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣经所说的”自然连接内容说明；“从死人中复活”保留原文的群体意象和主动表达。脚注标记置于其所说明的复活表述之后。
