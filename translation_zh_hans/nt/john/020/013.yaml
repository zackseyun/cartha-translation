  naturalness: 修订后句子在现代标准汉语中自然、庄重且清楚。“那两个天使”使说话者的复数及其上下文指向明确；“搬走了／放在哪里”均流畅并符合空墓叙事语境。
  terminology: “妇人”虽带较庄重、经文式色彩，但在此作为尊重而直接的呼语可接受，并维持约翰福音相关用语的一致性。“主”适切对应κύριος；不宜改窄为“主人”。
