  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: zh_hans
  text: 那两个天使对她说：“妇人，你为什么哭？”她回答说：“他们把我的主搬走了，我不知道他们把他放在哪里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: 天使
  rationale: 该指示代词回指上文的两个天使；中文若只译“他们”略显生硬，依清楚的上下文补明所指，使叙事自然。
- source_word: Γύναι
  choice: 妇人
  rationale: 这是尊重而直接的呼语，并非无礼；“妇人”保留约翰福音中的措辞一致性，也避免加入原文没有的亲昵意味。
- source_word: τί κλαίεις
  choice: 你为什么哭
  rationale: τί字面为“什么”，但在这一问句中表达原因；现代汉语自然说“为什么哭”。现在时所表示的持续动作由语境自然体现。
- source_word: Ἦραν
  choice: 搬走了
  rationale: 表示已经把人从原处移走；在空坟墓语境中，“搬走”比泛泛的“带走”更具体，也保留动作已完成而结果仍然存在的意味。
- source_word: τὸν κύριόν μου
  choice: 我的主
  rationale: κύριος既可作尊称，也具有基督论意味；“我的主”保留这两层可能性，不将其窄化为纯社会称谓。
- source_word: οὐκ οἶδα
  choice: 我不知道
  rationale: οἶδα虽为完成时形式，却表达当前的认知状态，现代汉语自然译作“我不知道”。
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: 他们把他放在哪里
  rationale: τίθημι在此意为放置；“放在哪里”是自然、准确的现代汉语，并保留地点未知这一重点。
theological_decisions:
- issue: 马利亚所说κύριος的译法
  choice: 我的主
  alternative: 我的主人
  rationale: “主”既能表达马利亚的尊敬与归属，也保留约翰叙事可能蕴含的基督论张力；译作“主人”会较明显地限缩为社会身份称谓。
- issue: Γύναι的语气
  choice: 妇人
  alternative: 女士／这位妇人
  rationale: 原词在此是尊重的称呼，但没有额外的亲昵成分；“妇人”较贴近原文，也与本书其他同类呼语保持一致。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语自然简洁；不为κύριος添加解释性限定，以保留其尊称与神学称号之间的开放性。
