  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: zh_hans
  text: 多马回答，对他说：“我的主，我的上帝！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种较不可能的理解是：多马只是发出“我的主，我的上帝！”这样的感叹，并非直接这样称呼耶稣。不过，希腊原文明确说他是“对他”说的，因此更支持这是对耶稣的直接称呼。
    reason: 说明可能但较弱的替代理解，并交代原文为何支持正文译法。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是ἀποκρίνομαι在叙事中的常见用法；“回答”自然保留了对前文情境作出回应的含义。
- source_word: Θωμᾶς
  choice: 多马
  rationale: 采用现代中文圣经读者熟悉的传统音译。
- source_word: εἶπεν αὐτῷ
  choice: 回答他
  rationale: ἀπεκρίθη与εἶπεν构成闪语式叙事表达，若机械译为“回答并对他说”会显得累赘；“回答他”既自然，也保留了αὐτῷ所表明的直接对象。
- source_word: Ὁ κύριός μου
  choice: 我的主
  rationale: κύριος在这里是对耶稣的直接称呼；“主”保留其尊崇意味及神学分量。
- source_word: καὶ
  choice: （用两个感叹分句表达并列）
  rationale: 希腊文以καὶ连接两个并列称谓。中文用连续的“我的主！我的上帝！”自然呈现同一个并列宣认，并增强直接呼语的力度。
- source_word: ὁ θεός μου
  choice: 我的上帝
  rationale: θεός直译为“上帝”，μου译作“我的”，保留多马个人性的宣认；“上帝”是现代标准汉语中清楚而庄重的称谓。
theological_decisions:
- issue: 多马的话是直接对耶稣所作的宣认，还是并非指向耶稣的感叹
  choice: 译作直接对耶稣说：“我的主！我的上帝！”
  alternative: 将其理解为并非直接称耶稣为主和上帝的一句感叹
  rationale: 原文明确有αὐτῷ（“对他”），而带冠词的主格形式ὁ κύριός、ὁ θεός在这里可作呼语。因此正文保留其直接称呼耶稣的自然含义，不削弱其基督论张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“回答他”避免照搬希腊语惯用结构所造成的中文累赘；两个短促感叹句保留多马宣认时的力度。
