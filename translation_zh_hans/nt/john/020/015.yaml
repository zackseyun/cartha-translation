  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: zh_hans
  text: 耶稣对她说：“妇人，你为什么哭？你在找谁？”她以为他是园丁，就对他说：“先生[a]，如果是你把他搬走了，请告诉我你把他放在哪里，我就把他带走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为“主”（κύριε）；这里马利亚以为自己是在和园丁说话，所以很可能是作为尊称使用，相当于“先生”。
    reason: 保留κύριε的字面译法及其在本语境中的另一种理解。
lexical_decisions:
- source_word: Γύναι
  choice: 妇人
  rationale: 这是对成年女性的直接称呼，在此并无贬义；“妇人”保留了约翰叙事中的称呼方式和原文的简洁，也不添加“亲爱的”等原文没有的感情色彩。
- source_word: τί κλαίεις
  choice: 你为什么哭
  rationale: κλαίω指哭泣；现代汉语中“哭”自然清楚，τί在这里询问原因，译作“为什么”。
- source_word: τίνα ζητεῖς
  choice: 你在找谁
  rationale: ζητέω在此指寻找某人；“你在找谁”比“你寻求谁”更符合现代汉语叙事，同时明确保留人的宾语。
- source_word: δοκοῦσα
  choice: 她以为
  rationale: 该分词表达马利亚当时错误的判断；“以为”简洁自然，又不额外强化其确定程度。
- source_word: ὁ κηπουρός
  choice: 园丁
  rationale: κηπουρός直接指照管园子的人，“园丁”准确且通行。
- source_word: Κύριε
  choice: 先生
  rationale: κύριε字面可译“主”，也可作尊敬称呼；马利亚此时以为对方是园丁，因此正文用“先生”更符合语境，并以脚注保留字面对应。
- source_word: ἐβάστασας αὐτόν
  choice: 你把他搬走了
  rationale: βαστάζω可指拿起、搬运；此处对象是遗体，“搬走”保留了实际移动的意味，也符合现代汉语。
- source_word: ποῦ ἔθηκας αὐτόν
  choice: 你把他放在哪里
  rationale: τίθημι意为放置；“放在哪里”自然、直接，不强行指定是安放还是埋葬。
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: 我就去把他带走
  rationale: αἴρω在此指拿走或移走；“带走”自然表达马利亚要领回遗体的意图，“就去”体现前句条件成立后的行动。
theological_decisions:
- issue: 马利亚尚未认出复活的耶稣时对κύριε的称呼
  choice: 先生
  alternative: 主
  rationale: κύριε既可作“主”，也可用于礼貌称呼。叙事明确说马利亚以为他是园丁，因此这里较可能是尊称“先生”，而非基督论意义上的认信；脚注保留“主”这一原文字面对应。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“妇人”保留约翰福音称呼的直接性，以“你在找谁”“放在哪里”“带走”等表达避免过度书面化。脚注标记紧接其实际说明的“先生”，而非置于无关位置。
