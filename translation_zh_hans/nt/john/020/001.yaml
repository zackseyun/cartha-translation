  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: zh_hans
  text: 一周的第一天[a]，天还黑的时候，抹大拉的马利亚一早来到坟墓，看见石头已经被从坟墓那里挪开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面为“安息日中的一天”；这是指“一周的第一天”的习惯说法。
    reason: 说明源语习语的字面形式及实际含义。
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: 一周的第一天
  rationale: 这是通行的犹太—希腊语计日习语；字面形式与“安息日”有关，但实际指一周的第一天。δέ在此仅作轻微叙事衔接，汉语无需另译。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经语境中清楚而通行的人名与地域称谓形式。
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊语使用历史现在时以增强叙事现场感；现代汉语动词本身不强制标示时态，“来到”既自然又不必人为改成显式过去时。
- source_word: πρωῒ
  choice: 一早
  rationale: 表示清晨很早；与随后“天还黑”配合，避免译成“黎明”而造成天色已亮的印象。
- source_word: σκοτίας ἔτι οὔσης
  choice: 天还黑的时候
  rationale: 自然表达属格独立结构所说明的持续时间背景。
- source_word: εἰς τὸ μνημεῖον
  choice: 来到坟墓
  rationale: μνημεῖον在本语境中指安葬死者的墓穴；“坟墓”准确且为普通读者熟悉。
- source_word: βλέπει
  choice: 看见
  rationale: 直接保留视觉感知含义；汉语无须通过时态变化消除希腊语历史现在时的叙事效果。
- source_word: τὸν λίθον ἠρμένον
  choice: 石头已经……挪开了
  rationale: 完成时被动分词表示动作已完成并留下当前结果；“已经……了”清楚呈现马利亚看见时石头已不在原位。
- source_word: ἐκ τοῦ μνημείου
  choice: 从坟墓
  rationale: 保留ἐκ所表达的移离关系，不补入原文未明说的“入口”。
theological_decisions:
- issue: 复活叙事中的历史现在时
  choice: 以不显式标示过去时的自然汉语“来到、看见”表达
  alternative: 用“来到了、看见了”把叙事统一处理为完成的过去事件
  rationale: 现代汉语不依靠动词屈折表达时态，因此可自然保留希腊语历史现在时的现场感，而不需添加解释性神学含义。
- issue: 石头被挪开的施事者
  choice: 采用“已经……挪开了”的结果状态表达，不说明是谁挪开的
  alternative: 译作“有人已经把石头挪开了”或明确归因于上帝/天使
  rationale: 原文使用被动形式，没有点明施事者；译文应保留这一开放性，不作神学补充。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“一早”与“天还黑的时候”并用，保留原文两个相互补充的时间信息；语序稍作汉语化处理，使背景时间自然先于主要动作。
