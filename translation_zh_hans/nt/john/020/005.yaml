  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: zh_hans
  text: 他俯身往里看[a]，看见细麻布放在那里，却没有进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他俯身往里看，看见放着的细麻布。”原文“放着”可紧连“细麻布”，不必明确补出“在那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: 俯身往里看
  rationale: 该不定过去时分词描写门徒在墓口俯下身察看的动作；此译兼顾身体姿态和朝墓内观看的方向，符合现代汉语表达。
- source_word: βλέπει
  choice: 看见
  rationale: 原文用现在时作历史现在时，使叙事更鲜活。汉语无需借助时态形态也能自然呈现这一动作，因此译作“看见”，不另加表示过去的成分。
- source_word: κείμενα
  choice: 还放在那里
  rationale: κεῖμαι表示处于放置、躺放的状态。“放在那里”自然传达细麻布当时可见的位置；“还”结合上下文表达其仍留原处的状态，但不暗示是谁摆放的。
- source_word: τὰ ὀθόνια
  choice: 细麻布
  rationale: ὀθόνια指麻布制成的布片，在本段用于安葬。译作“细麻布”直接保留材质含义，不在正文中额外解释为裹尸布。
- source_word: οὐ μέντοι
  choice: 却没有
  rationale: μέντοι带有温和的转折意味；“却没有”简洁地保留了看见与未进入之间的对比。
- source_word: εἰσῆλθεν
  choice: 进去
  rationale: 该不定过去时动词意为进入；墓穴场景中“进去”是自然、清楚而庄重得体的现代汉语。
theological_decisions: []
translation_notes:
