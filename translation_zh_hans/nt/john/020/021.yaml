  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: zh_hans
  text: 于是，耶稣又对他们说：“愿你们平安[a]！父怎样差遣了我，我也照样差遣你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较传统的译法：“愿平安与你们同在。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文叙事，并自然引出耶稣因门徒欢喜而再次说话；既保留连接作用，也符合现代汉语表达。
- source_word: πάλιν
  choice: 又
  rationale: 表明耶稣重复上一节的问安；“又”简洁自然。
- source_word: Εἰρήνη ὑμῖν
  choice: 愿你们平安
  rationale: 希腊文是无动词的闪语式问安。汉语补出“愿”，能自然传达祝愿和问候的功能，同时保留“平安”的核心含义。
- source_word: καθὼς
  choice: 怎样
  rationale: 与下文“也照样”构成自然的汉语对应结构，清楚表达两次差遣之间的类比。
- source_word: ἀπέσταλκέν
  choice: 差遣了
  rationale: “差遣”准确表达奉命执行使命的语义；“了”呈现已经发生且构成当前使命基础的行动，但不在汉语中生硬复制希腊语完成时。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文有定冠词而无显式领属词。约翰福音的语境已明确所指，汉语用“父”自然且避免增添“我的”。
- source_word: κἀγὼ
  choice: 我也照样
  rationale: 结合 καί 与强调的 ἐγώ，在“父怎样……我也照样……”结构中呈现对应和强调，同时不暗示两种差遣在所有方面完全等同。
- source_word: πέμπω
  choice: 差遣
  rationale: 现在时处于当下委任门徒的场景中。汉语“我也照样差遣你们”既可表达此刻的行动，也保持庄重简洁。
theological_decisions:
- issue: 父差遣耶稣与耶稣差遣门徒之间的关系
  choice: 父怎样差遣了我，我也照样差遣你们
  alternative: 父怎样差遣了我，我也差遣你们
  rationale: “怎样……也照样……”保留原文 καθὼς 与 κἀγώ 所表达的使命类比，但不扩展为关于权柄、方式或职分完全等同的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“愿你们平安”是自然的祝愿式问安；整句保留约翰文本简洁而郑重的差遣语气。
