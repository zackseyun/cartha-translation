  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: zh_hans
  text: 于是，彼得和那另一个门徒就出去了，正往坟墓去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“往坟墓去。”希腊语的未完成过去时可作较简洁的表达；“正往坟墓去”则更明确地保留了动作正在进行的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出来
  rationale: 该词表示从一处离开；“出来”自然保留了向外离开的方向含义。希腊语虽用单数动词与首先提到的彼得呼应，中文按并列主语自然表达。
- source_word: οὖν
  choice: 于是
  rationale: 这里承接上一节，表示随前述消息而发生的行动；“于是”符合现代汉语叙事语体。
- source_word: ὁ Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ ἄλλος μαθητής
  choice: 另一个门徒
  rationale: “门徒”准确表达福音书语境中的 μαθητής；“另一个”保留与彼得相区别、且上下文已知的指称。
- source_word: ἤρχοντο
  choice: 正往……去
  rationale: 该未完成过去时描写当时正在进行的移动；“正往……去”在中文中明确体现持续过程，同时依叙述视角自然译为“去”而非“来”。
- source_word: εἰς τὸ μνημεῖον
  choice: 往坟墓那里
  rationale: μνημεῖον 在此指安放耶稣遗体的坟墓；εἰς 表示朝目的地移动，并不必然表示已经进入，所以不用“进坟墓”。
