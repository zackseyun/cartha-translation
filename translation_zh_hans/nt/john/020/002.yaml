  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: zh_hans
  text: 于是，她跑去找西门·彼得和耶稣所爱的另一位门徒[a]，对他们说：“他们把主从坟墓里移走了；我们[b]不知道他们把他放在哪里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱”原文用φιλέω，常可强调亲爱之情；也可理解为“耶稣所钟爱的”。
    reason: lexical_alternative
  - marker: b
    text: 马利亚说的是“我们不知道”，原文明确使用第一人称复数。有些读者认为这包括与她同行的其他妇女，但本节没有说明这个复数具体指谁。
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: 于是，她跑去见
  rationale: οὖν承接上一节所见之事，译为“于是”自然表达结果与叙事推进；两个历史现在时共同描写她急忙前去，汉语用“跑去见”既保持生动感，也避免生硬直译为“跑并来到”。
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: 去见西门·彼得和……另一个门徒
  rationale: πρός加宾格表示朝向并到某人那里；“去见”符合现代汉语。μαθητής在福音书语境中译为“门徒”。
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: 耶稣所爱的
  rationale: φιλέω在此表示爱与亲爱；“所爱的”自然、庄重，并保留关系从句结构。未特意弱化为“喜欢”或“疼爱”。
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 自然表达向多人说话；虽为历史现在时，汉语叙事不必机械标示时态，直接用“说”即可保持现场感。
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: 有人把主从坟墓里搬走了
  rationale: ἦραν是未明说主语的第三人称复数，在汉语中用泛指“有人”比突兀的“他们”更自然，同时不指认行动者。αἴρω在此指移走，译为“搬走”；μνημεῖον在埋葬语境中是“坟墓”。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是马利亚对耶稣的尊称，采用基督教语境中通行且庄重的“主”。
- source_word: οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: 严格保留希腊文第一人称复数，不改成“我不知道”，也不替经文解释复数包括哪些人。
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: 他们把他放在哪里
  rationale: τίθημι的基本意思是放置；“放在哪里”是现代汉语中自然的表达，并保留行动者未被识别的第三人称复数。
theological_decisions:
- issue: κύριος用于耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: 复活叙事语境中的κύριος是对耶稣的尊称；“主”既符合约翰福音用语，也不把称谓缩减为普通人际关系中的“主人”。
- issue: οἴδαμεν的第一人称复数
  choice: 我们不知道
  alternative: 我不知道
  rationale: 保留原文复数及其未解释之处，不以约翰福音本节只明说马利亚一人为由将其单数化，也不暗中与其他福音书协调。
- issue: ἦραν隐含主语的表达
  choice: 有人把主……搬走了
  alternative: 他们把主……搬走了
  rationale: 原文第三人称复数没有明确先行词，可具有不定主体的作用；“有人”自然保留马利亚不知道行动者身份这一点，而后半句仍用“他们”承接这些未知的人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“西门·彼得”使用间隔号连接双重名字；引语保留马利亚急切的口吻。脚注分别说明φιλέω的情感色彩及“我们”这一未被解释的复数。
