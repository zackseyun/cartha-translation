source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: zh_hans
  text: 说完这话，他就把自己的手和肋旁给他们看。门徒看见主，就欢喜了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: 说完这话
  rationale: 不定过去时分词表示先于主句动作发生；“说完这话”自然、简洁地保留了动作次序。
- source_word: ἔδειξεν
  choice: 给他们看
  rationale: δείκνυμι 在此指将某物呈现出来让人看见；结合与格 αὐτοῖς，译作“给他们看”最符合现代汉语。
- source_word: τὰς χεῖρας
  choice: 自己的手
  rationale: 希腊文使用定冠词而非物主代词，但所指显然是耶稣自己的手；汉语补出“自己的”可避免歧义。
- source_word: τὴν πλευράν
  choice: 肋旁
  rationale: πλευρά 指身体侧面；“肋旁”既符合约翰福音19:34的受伤语境，也不明说本节未明说的伤口。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 与格表示观看对象；在汉语中自然并入“给他们看”的结构。
- source_word: ἐχάρησαν
  choice: 欢喜了
  rationale: χαίρω 表示喜乐、欢喜；“欢喜了”自然且保留因看见主而产生喜乐的较强语气。
- source_word: οὖν
  choice: 就
  rationale: οὖν 在此表达叙事中的结果或推进；“就”自然呈现他们看见主之后随即欢喜的关系。
- source_word: οἱ μαθηταί
  choice: 门徒
  rationale: μαθητής 在福音书中惯指跟随耶稣的门徒，“门徒”是准确而通行的译法。
- source_word: ἰδόντες
  choice: 看见
  rationale: 不定过去时分词说明门徒欢喜的契机；汉语“看见主，就……”清楚表达时间与结果关系。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在复活显现的语境中既指门徒所认出的耶稣，也带有基督论称号的分量；“主”保留这种含义。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 主人／老师
  rationale: 在复活显现的语境中，κύριος 不只是一般敬称，而是约翰福音对耶稣的重要称号；译作“主”既符合上下文，也保留其神学分量。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“肋旁”比“侧面”更具体地指身体部位，并与本章受难叙事相呼应，却不额外补入“伤口”。句式简洁，保留原文先说话、再展示、门徒看见后欢喜的推进。
