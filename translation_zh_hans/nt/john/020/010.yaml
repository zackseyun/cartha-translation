  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: zh_hans
  text: 于是，两个门徒又回到自己住的地方去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回到他们自己那里去了。”这句话可能指他们回到当时居住或落脚的地方。
    reason: 保留 πρὸς αὑτούς 的字面表达及其所指地点的不确定性，避免把它限定为各自的家。
lexical_decisions:
- source_word: ἀπῆλθον
  choice: 去了
  rationale: 该词表示从现场离去；与“回到自己住的地方”连用，现代汉语以“去了”自然表达离开墓地的动作。
- source_word: οὖν
  choice: 于是
  rationale: 在叙事中承接前文并引出随后发生的行动；“于是”既保留连接作用，也符合现代汉语叙事习惯。
- source_word: πάλιν
  choice: 又
  rationale: 表示再次或返回；在“又回到”中简洁自然地体现其重复、返回之意。
- source_word: πρὸς αὑτούς
  choice: 回到自己住的地方
  rationale: 字面近于“到他们自己那里”，具体所指可能是住处或落脚处。正文采用自然但不过度限定的表达，避免明确说成各自的家。
- source_word: οἱ μαθηταί
  choice: 两个门徒
  rationale: 希腊文直译为“门徒们”；按紧接的上下文，所指是彼得和那另一位门徒。中文用“两个门徒”使指代清楚，不增添姓名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“自己住的地方”比“自己的家”少一层未经原文明确表达的限定；脚注保留希腊语结构的歧义。
