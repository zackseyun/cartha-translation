source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你因为看见了我才信吗？[a]那些没有看见却信了的人有福了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你因为看见了我才信。”希腊文既可理解为问句，也可理解为陈述句。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: λέγει是叙事现在时，现代汉语叙事通常不必标明时态，译作“说”自然；αὐτῷ译作“对他”，在上下文中指多马。
- source_word: Ὅτι
  choice: 因为
  rationale: 这里最自然地引出多马相信的原因，即他看见了耶稣；结合问句语气译为“因为……才……吗”，清楚表达所见与相信之间的关系。
- source_word: ἑώρακάς με
  choice: 看见了我
  rationale: ἑώρακάς是完成时，表示已经发生且与当前有关的看见；汉语用“看见了”自然表达这一完成意义。
- source_word: πεπίστευκας
  choice: 信
  rationale: πεπίστευκας是完成时，指由先前经历而形成的当前相信状态；汉语在“才信吗”的语境中无需机械添加“已经”，仍可自然传达该意义。
- source_word: μακάριοι
  choice: 有福了
  rationale: “有福”是汉语中对μακάριοι庄重而通行的表达，既不缩减为主观快乐，也保留蒙福的含义。
- source_word: οἱ μὴ ἰδόντες
  choice: 那些没有看见……的人
  rationale: 将带冠词的分词结构自然处理为指人的定语结构；“没有看见”保留其否定和先于相信的关系。
- source_word: καὶ πιστεύσαντες
  choice: 却信了
  rationale: καί字面为“并且”，但在“没有看见”与“信了”之间构成明显反差；现代汉语用“却”自然显明这一语义关系，同时不改变命题内容。
theological_decisions:
- issue: 耶稣第一句话的语气
  choice: 译作问句：“你因为看见了我才信吗？”
  alternative: 译作陈述句：“你因为看见了我才信。”
  rationale: 希腊文古抄本本身没有现代标点，这句话可理解为问句或陈述句。问句读法符合上下文中对“看见而信”与“未见而信”的对照，但不应排除陈述句读法，故在脚注中保留。
- issue: “未见”与“相信”之间的关系
  choice: 译作“没有看见却信了”
  alternative: 译作“没有看见并且信了”
  rationale: 原文καί通常表示连接，但此处两项之间具有自然的让步性反差。“却”使现代汉语顺畅，并保留耶稣对未见而信之人的宣告，而不将其解释为某一宗派特有的信仰理论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“才信吗”自然呈现原因关系和可能的反问语气；脚注明确保留原文标点未定所造成的真实歧义。
