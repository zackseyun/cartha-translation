  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: zh_hans
  text: 她看见两个天使身穿白衣[a]坐着，一个在耶稣的身体原先躺卧之处的头端，一个在脚端[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“在白色之中”，也可译作“穿着白色衣服”。
    reason: lexical_alternative
  - marker: b
    text: “原先躺卧”也可译作“躺着”。希腊文的未完成时可以较简单地表达过去的状态；正文明确表示这是此前的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: 她看见
  rationale: 采用叙事现在时的生动表达；根据上文补出汉语所需的主语“她”，指抹大拉的马利亚。“看见”自然清楚，不采用较书面的“观看”或“注视”。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 虽然该词也可泛指“使者”，但空墓、白衣等语境清楚指向天上的使者；“天使”是现代汉语中准确而自然的表达。
- source_word: ἐν λευκοῖς
  choice: 身穿白衣
  rationale: 希腊文直译为“在白色之中”，实际指穿着白色衣服。“身穿白衣”在现代汉语中简洁自然，同时不增加衣服式样等原文没有的信息。
- source_word: καθεζομένους
  choice: 坐着
  rationale: 分词说明两个天使的姿势。“坐着”自然对应原文，未添加希腊文没有明说的“那里”。
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: 一个在……头端，一个在脚端
  rationale: πρός加与格在此表示靠近某一位置。结合下文，这是耶稣身体先前躺卧之处的两端；译作“头端、脚端”既符合汉语习惯，也避免误解为当时仍有头和脚在那里。
- source_word: ὅπου
  choice: ……之处
  rationale: 以关系结构表达“所在的地方”，使汉语句法自然紧凑。
- source_word: ἔκειτο
  choice: 原先躺卧
  rationale: 未完成时描写身体此前处于躺卧状态。译作“原先躺卧”清楚交代相对于马利亚看见天使时的先前状态，同时脚注保留较简单的时态表达。
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: 耶稣身体
  rationale: “身体”准确、庄重，对应σῶμα；不采用语气较为冷硬的“尸体”。属格关系按自然汉语表达为“耶稣身体”。
theological_decisions:
- issue: 复活叙事中ἀγγέλους所指的性质
  choice: 天使
  alternative: 使者
  rationale: ἀγγέλους本可指一般使者，但空墓场景及白衣描写表明此处是天上的使者。这一选择来自词义和上下文，不额外引入宗派性解释。
- issue: ἔκειτο的时间关系
  choice: 以“原先躺卧”表达先前持续的状态
  alternative: 译作“躺着”，不明确标出先后关系
  rationale: 原文未完成时本身可较简单地译为过去状态，但当前叙事发生于身体已不在墓中之时。“原先”自然呈现上下文中的时间关系，同时以脚注保留较贴近形式的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“身穿白衣坐着”保持原文描写次序；“头端、脚端”清楚呈现两个天使相对于原先安放身体位置的方位。所有脚注标记均已在正文中出现。
