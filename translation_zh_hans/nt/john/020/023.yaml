base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: zh_hans
  text: 你们赦免谁的罪，谁的罪就已蒙赦免[a]；你们保留谁的罪，谁的罪就已被保留[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们若赦免任何人的罪，那些罪就已蒙赦免。”原文“已蒙赦免”是完成时被动态，可强调已经完成并持续有效的结果。
    reason: lexical_alternative
  - marker: b
    text: “已被保留”也可译作“仍被保留”。原文同样是完成时被动态；这里没有明说施行这一行动的是谁。
    reason: aspect_and_theological_ambiguity
lexical_decisions:
- source_word: ἄν τινων
  choice: 谁的
  rationale: ἄν与虚拟语气构成不定条件表达；汉语用“谁的”配合前后分句，既保留对象的不确定性，也比生硬的“任何人的罪”更自然。
- source_word: ἀφῆτε
  choice: 赦免
  rationale: ἀφίημι以“罪”为宾语时通常指赦罪；“赦免”是现代汉语中准确、庄重且通行的表达。
- source_word: τὰς ἁμαρτίας
  choice: 罪
  rationale: 汉语通常以“谁的罪”自然表达该名词短语，无须机械呈现希腊语冠词。
- source_word: ἀφέωνται
  choice: 已经得了赦免
  rationale: 完成时被动态表达已经成就并持续有效的结果；“已经得了赦免”保留被动意味和结果状态，又不明说施事者。
- source_word: αὐτοῖς
  choice: 谁的罪（以领属结构显明所指之人）
  rationale: 希腊语与格代词指罪所属的人；汉语重复“谁的罪”比直译为“给他们”更清楚自然。
- source_word: κρατῆτε
  choice: 留下
  rationale: κρατέω在此与“赦免”相对，表示不予释放、仍予保留；“留下”较“扣留”少添司法或教会程序色彩。
- source_word: κεκράτηνται
  choice: 已经被留下
  rationale: 以“已经”与被动式呈现完成时被动态的结果性，并与前句保持平行，不把原文未明说的施事者补出。
theological_decisions:
- issue: 门徒的行动是独立造成赦罪结果，还是与先在或神圣的判定相对应
  choice: 保留完成时被动态：“已经得了赦免／已经被留下”
  alternative: 译作“就得赦免／就不得赦免”，或明确补出“神已经赦免／留下”
  rationale: 原文没有明说被动态的施事者，也没有解释门徒行动与神圣行动之间的具体关系。译文因此不补出“神”，也不把后半句改成解释性的“不得赦免”，从而保存原文的神学张力。
- issue: κρατέω所保留的是人还是罪
  choice: 按上下文补明为“留下谁的罪”
  alternative: 译作“留下谁”或“扣留谁”
  rationale: 前句明确以“罪”为宾语，后句省略宾语而与之平行；汉语补出“罪”可避免误解为拘留某人，同时不改变原文关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过重复“谁的罪”消除汉语代词歧义；两处“已经”呈现希腊语完成时的结果性。后句保留略显突出的“被留下”，以免将 κρατέω 解释性改写成“不得赦免”。
