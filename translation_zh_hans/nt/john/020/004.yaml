  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: zh_hans
  text: 两人一同跑着，另一个门徒比彼得跑得快，跑在了前面[a]，先到了坟墓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跑过了彼得。”希腊语动词直译为“跑在前面”，而“比彼得跑得快”明确表达了其中的比较。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: 跑着
  rationale: 未完成时描写过去正在进行的动作；“跑着”自然保留持续意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的连接语；中文连续叙事无需另加“但是”，以免引入原文没有明确表达的转折。
- source_word: οἱ δύο ὁμοῦ
  choice: 两人一同
  rationale: 既保留“两人”的明确指称，也自然表达共同进行的动作。
- source_word: ὁ ἄλλος μαθητής
  choice: 另一个门徒
  rationale: “门徒”是福音书语境中μαθητής的通行译法；“另一个”使其与彼得相区别。
- source_word: προέδραμεν
  choice: 跑在了前面
  rationale: 保留复合动词“向前跑、跑到前面”的空间意象，不把它压缩成单纯的“超过”。
- source_word: τάχιον τοῦ Πέτρου
  choice: 比彼得跑得快
  rationale: 明确保留希腊文的比较结构，符合现代汉语习惯。
- source_word: ἦλθεν πρῶτος
  choice: 先到了
  rationale: 自然表达抵达次序，同时紧贴“首先来到”的原意。
- source_word: εἰς τὸ μνημεῖον
  choice: 到了坟墓
  rationale: 上下文表明他此时抵达耶稣安葬之处，却尚未进去，因此译“到了”而非“进入”；“坟墓”是清楚而通行的对应词。
