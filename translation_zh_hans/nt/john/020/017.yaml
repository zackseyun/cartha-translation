id: JHN.20.17
reference: John 20:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: zh_hans
  text: 耶稣对她说：“不要抓住我不放[a]，因为我还没有升到父那里去。你要到我的弟兄们[b]那里去，告诉他们：‘我要升到我的父和你们的父、我的上帝和你们的上帝那里去。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要碰我”或“不要抓住我”。这里的希腊语在这语境中很可能是指不要继续抓住或拉住他不放，而不只是不要有任何接触。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”译自希腊语阳性复数词；这里指耶稣的门徒，也可能包括范围更广、具有代表性的群体。
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: 不要拉着我不放
  rationale: ἅπτου可指触碰、抓住或持续拉住。结合μή与现在时命令式，此处很可能侧重停止持续中的动作；“拉着我不放”以自然汉语表达持续抓住的意味，同时用脚注保留“不要碰我”等可能译法。
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: 因为我还没有升到
  rationale: 保留οὔπω“还没有”和完成时所表达的尚未完成状态；“升到”也呼应约翰福音中耶稣到父那里去的语境。
- source_word: πρὸς τὸν πατέρα
  choice: 到父那里去
  rationale: 此处原文有定冠词而没有“我的”；因此不提前补入所属关系，把明确的“我的父”留在后面的引语中。
- source_word: πορεύου
  choice: 你要到……那里去
  rationale: 以现代汉语自然地表达移动命令，并明确承接目的地“我的弟兄们那里”。
- source_word: ἀδελφούς
  choice: 弟兄们
  rationale: 保留原文阳性复数亲属称谓及耶稣对门徒的亲近称呼；其具体所指范围在脚注中说明，不在正文中扩写。
- source_word: εἰπὲ αὐτοῖς
  choice: 告诉他们
  rationale: 符合现代汉语中命令某人传话的自然表达，并准确传达原文命令语气。
- source_word: Ἀναβαίνω
  choice: 我要升到
  rationale: 现在时在这里可指即将发生的行动；“我要升到”自然表达临近的上升行动，同时不把它改写成已经完成。
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: 我的父和你们的父
  rationale: 保留原文刻意并列的两种关系称谓，不将耶稣与门徒同父的关系表述压缩成一个含混的共同称谓。
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: 我的上帝和你们的上帝
  rationale: 直接保留原文平行结构及“我的上帝”这一具有神学张力的表述，不作教义性弱化或解释性改写。
theological_decisions:
- issue: Μή μου ἅπτου的动作含义
  choice: 理解为不要继续拉住或抓住不放
  alternative: 不要碰我
  rationale: 现在时命令式配合μή很可能涉及正在持续的动作，但“触碰”仍是词汇上可成立的理解，因此正文采用较合语境的持续动作表达，并以脚注保留歧义。
- issue: 第一处πατέρα的所属关系
  choice: 译作“父”
  alternative: 译作“我的父”
  rationale: 原文第一处没有μου。按原文保留“父”，让后文自己明确展开“我的父和你们的父”的关系。
- issue: “我的上帝和你们的上帝”的基督论张力
  choice: 按原文直接翻译
  alternative: 采用淡化“我的上帝”含义的解释性意译
  rationale: 不以预设教义修饰经文，而让这一约翰文本中的表述及其神学张力完整呈现。
- issue: “我的父和你们的父”的关系表达
  choice: 保留两个并列的所属短语
  alternative: 合并为“我们的父”
  rationale: 原文没有说“我们的父”，而是有意区分“我的”与“你们的”；译文因此保留这种既相联又有区别的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文用“上帝”清楚表达θεός；用“父”而非较口语的“父亲”，以保持约翰福音关系称谓的简洁与庄重。重复“升到”使末句的双重平行结构在汉语中清晰可读，同时保留“我的／你们的”的区别。
