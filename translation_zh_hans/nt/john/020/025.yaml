  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: zh_hans
  text: 于是，其他门徒不断地对他说：“我们已经看见主了。”但他对他们说：“除非我看见他手上的钉痕，用我的手指伸进钉痕，又把我的手伸进他的肋旁，否则我绝不相信。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝不相信”也可译作“决不会相信”。原文使用了强调否定。
    reason: 说明οὐ μὴ πιστεύσω的强烈否定语气及可行译法。
lexical_decisions:
- source_word: ἔλεγον
  choice: 一直对他说
  rationale: 未完成时在此自然表达过去持续或反复发生的动作，显示其他门徒不只说了一次。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推动叙事，符合现代汉语叙事习惯。
- source_word: Ἑωράκαμεν
  choice: 我们已经看见
  rationale: 完成时表示已经发生、且对当下仍有意义的经历；“已经看见”在汉语中保留这一关联。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在复活叙事中是对耶稣的称号；汉语通常不需加定冠词。
- source_word: τύπον τῶν ἥλων
  choice: 钉痕
  rationale: 简洁表达钉子留下的痕迹，不额外断定其具体外观。
- source_word: βάλω ... εἰς
  choice: 探入
  rationale: 表达朝伤痕或肋旁内部伸入的动作，比泛泛的“放进”更符合身体语境，同时保留原文的鲜明力度。
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: 他的肋旁
  rationale: πλευρά可指身体的侧面或肋旁；“肋旁”承接19:34的用语，又不具体限定为某一根肋骨。
- source_word: οὐ μὴ πιστεύσω
  choice: 我绝不相信
  rationale: οὐ μή加虚拟语气构成强烈否定；“绝不”保留强调语气，而条件句限定了这项拒绝的语境。
theological_decisions:
- issue: 多马拒绝相信的强度
  choice: 否则我绝不相信
  alternative: 否则我决不会相信／我绝不会信
  rationale: 保留οὐ μὴ的强调否定，但不把它扩展为脱离前述条件、永无改变的心理定论。
- issue: 多马所要求动作的具体程度
  choice: 用指头探入钉痕，并把手探入肋旁
  alternative: 用指头摸钉痕，并用手摸肋旁
  rationale: εἰς表达朝里面的方向；译作“探入”保留原文较强而具体的要求，不弱化为仅仅触摸。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一直对他说”体现未完成时的持续或反复意味；“肋旁”保留约翰叙事中的身体部位用语。脚注标记置于整句引语之后。
