  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: zh_hans
  text: 至于多马，他是十二人中的一个，又称低土马[a]；耶稣来的时候，他没有和他们在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“Δίδυμος”（低土马）的意思是“双生子”。
    reason: 说明音译称名Δίδυμος的原文含义。
lexical_decisions:
- source_word: δὲ
  choice: 至于
  rationale: 这里的δέ轻微转换叙事焦点，并引出多马；“至于”自然表达这一话题转移，不把它误解为表示时间的“这时”。
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: 十二人中的一个
  rationale: 保留原文对特定群体“十二人”的称呼，不额外补入原文没有明说的“门徒”或“使徒”。
- source_word: ὁ λεγόμενος Δίδυμος
  choice: 又称低土马
  rationale: Δίδυμος在句中作为称名使用，因此正文采用汉语传统音译“低土马”，并以脚注说明其词义，兼顾称名形式和读者理解。
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: 他没有和他们在一起
  rationale: 直接表达多马当时不在该群体中的状态；“和他们在一起”符合现代汉语习惯。
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: 耶稣来的时候
  rationale: 贴近原文常用动词ἔρχομαι及时间从句，避免用“显现”之类更具解释性的表达。
theological_decisions:
- issue: Δίδυμος的译法
  choice: 正文音译为“低土马”，脚注说明意思是“双生子”
  alternative: 正文直接译作“双生子”
  rationale: 该词既有明确词义，也在此作为多马的另一称名。音译可保留称名功能，脚注则让读者了解原文含义，不牵涉教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至于”承接上下文并转换焦点；分号使人物身份说明与其缺席的叙述关系清楚。
