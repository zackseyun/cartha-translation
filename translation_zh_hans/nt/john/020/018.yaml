  naturalness: “向他们宣告”并非错误，但在此叙事中“向门徒报告说”更自然，也更贴合ἀγγέλλουσα的传讯语境。修订后的句子更紧凑，书面语庄重而不生硬。
  terminology: “抹大拉的马利亚”“门徒”“主”均合乎现代中文圣经惯例，并准确保留原文的人名、群体称谓及κύριος在复活语境中的称号分量。
