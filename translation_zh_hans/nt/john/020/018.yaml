  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: zh_hans
  text: 抹大拉的马利亚来到门徒那里，向他们报告说：“我已经看见主了。”并且主曾对她说过这些话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抹大拉的马利亚来到门徒那里，说：‘我已经看见主了。’主也对她说了这些话。”末句既可理解为马利亚报告内容的一部分，也可理解为叙述者的说明。
    reason: 原文末句καὶ ταῦτα εἶπεν αὐτῇ与前面报告内容的句法关系存在真实歧义。
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 这是叙事中的历史现在时，现代汉语自然用完成性叙述。“来到”表达她到门徒那里去的动作，又不机械保留希腊语现在时。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经语境中通行且易懂的人名与地域称谓。
- source_word: ἀγγέλλουσα
  choice: 向他们宣告
  rationale: 该分词表示她来到时所进行的传讯行动；“宣告”保留正式传达消息的意味，同时承接后面的报告内容。
- source_word: τοῖς μαθηταῖς
  choice: 门徒
  rationale: “门徒”是 μαθητής 在新约语境中的标准中文译法；原文没有明说“他的”，因此不增补。
- source_word: Ἑώρακα
  choice: 我已经看见
  rationale: 以“已经……了”表达希腊语完成时：看见的行动已经发生，其结果与当前宣告仍有关联。
- source_word: τὸν κύριον
  choice: 主
  rationale: 保留 κύριος 在复活叙事中的称号分量，不弱化为一般性的“主人”或“老师”。
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: 她还告诉他们，主对她说了这些话
  rationale: 正文将此句理解为马利亚所传达内容的延续，并用自然汉语明确先前说话者是主；“这些话”对应 ταῦτα，并与 εἶπεν 的言说含义相配。
theological_decisions:
- issue: 复活叙事中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处指耶稣，并具有称号意义；“主”既符合新约通常用法，也不削弱其基督论分量。
- issue: καὶ ταῦτα εἶπεν αὐτῇ 与马利亚报告之间的关系
  choice: 作为马利亚所报告内容的延续
  alternative: 作为叙述者另加的说明：“主对她说了这些话”
  rationale: 原文没有重复 ὅτι，因此句法上存在两种理解。正文采用其自然延续 ἀγγέλλουσα 内容的读法，但以脚注保留叙述者说明这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文避免生硬复制希腊语分词结构，以“来到……向他们宣告”呈现同时发生的传讯行动；用“已经……了”保留完成时的当前关联。脚注明确保留末句归属的句法歧义。
