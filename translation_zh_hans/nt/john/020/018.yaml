- from: 抹大拉的马利亚来到门徒那里，向他们宣告：“我已经看见主了！”她还告诉他们，主对她说了这些话。[a]
  to: 抹大拉的马利亚来到门徒那里，向他们报告说：“我已经看见主了。”并且主曾对她说过这些话。[a]
  rationale: 修订以“向他们报告说”对应ἀγγέλλουσα，并以“并且主曾对她说过这些话”在正文中表达末句继续作为马利亚报告内容的读法。“曾……过”自然表达耶稣说话在马利亚报告之前发生；脚注保留末句可作叙述者插入说明的另一种句法分析。
