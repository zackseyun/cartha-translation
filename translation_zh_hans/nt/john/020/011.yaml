id: JHN.20.11
reference: John 20:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: zh_hans
  text: 可是，马利亚站在坟墓外面哭。她正哭的时候，就弯下身往坟墓里看[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯身往坟墓里看。”原文动词含有为了察看而弯身探看的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 可是
  rationale: 表示轻微的叙事转折，将焦点从已经离去的门徒转到仍留在墓外的马利亚；“可是”自然地保留这一对比。
- source_word: εἱστήκει
  choice: 站在
  rationale: 此处表达持续的站立状态；结合上下文，“站在……哭”在现代汉语中自然，并保留她仍在那里这一状态。
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: 在坟墓外面
  rationale: 清楚表达马利亚相对于墓穴的位置，也与下文往墓里看形成空间对照。
- source_word: μνημεῖον
  choice: 坟墓
  rationale: 指安放遗体的墓穴；“坟墓”是现代汉语中准确、通行且庄重的表达。
- source_word: κλαίουσα / ἔκλαιεν
  choice: 哭 / 正哭
  rationale: 两处都表示持续哭泣；用“哭”和“正哭”保留原文重复及动作延续，同时比反复使用“哭泣”更自然。
- source_word: ὡς οὖν
  choice: ……的时候，就
  rationale: 连接她持续哭泣与随后俯身察看的动作，推进叙事而不过度强调逻辑因果。
- source_word: παρέκυψεν
  choice: 弯下身……看
  rationale: 该动词兼有俯身与察看的含义；这一译法明确呈现为往墓穴内看而弯身的动作。
- source_word: εἰς τὸ μνημεῖον
  choice: 往坟墓里
  rationale: 保留εἰς所表达的朝向墓穴内部之意，与“看”搭配符合自然汉语。
