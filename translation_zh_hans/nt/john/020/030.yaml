  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: zh_hans
  text: 耶稣在门徒面前还行了许多别的神迹[a]，这些都没有记在这卷书里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文意为“记号”，指这些神迹不只显出能力，也指向耶稣是谁。
    reason: 说明σημεῖα的字面意义及其在约翰福音中的语义重点。
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: 还……许多别的
  rationale: “还”和“别的”自然表达补充与延续关系，“许多”保留数量强调；不机械逐译μέν、οὖν、καί，以免中文累赘。μέν在这里也为下一节的对照铺垫。
- source_word: σημεῖα
  choice: 神迹[a]
  rationale: 在现代中文基督教语境中，“神迹”能自然指耶稣所行的超常作为；脚注补明原文为“记号”，保留约翰福音中这些作为指向耶稣身份的含义。
- source_word: ἐποίησεν
  choice: 行了
  rationale: 中文惯用“行神迹”，既自然庄重，也准确表达此处ποιέω的行动含义。
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: 在门徒面前
  rationale: 直接表达这些神迹是在门徒亲眼见证之下施行的；不添加原文没有的“他的”。
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: 这些都没有记在
  rationale: 以中文指示语承接复数先行词“神迹”；“没有记在”保留被动结果状态，“都”明确这些所说的其他神迹未收入本书。
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: 这卷书里
  rationale: “这卷书”自然指当前这部书面著作，也比限定为具体物质形态的“书卷”更稳妥。
theological_decisions:
- issue: 约翰福音中σημεῖα的神学含义
  choice: 正文译作“神迹”，并以脚注说明原文有“记号”之意。
  alternative: 正文译作“记号”或“奇迹”。
  rationale: 单译“奇迹”容易只突出超自然能力；单译“记号”在现代中文中又可能被误解为普通标志。“神迹”较自然，脚注则保留这些作为超越自身、指明耶稣身份的约翰式含义。
translation_notes:
  register: 采用现代、清楚而庄重的书面普通话。“在门徒面前”简洁保留见证场景；后半句以“这些”自然承接前文，避免生硬的关系从句。
