  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: zh_hans
  text: 你们也作见证，因为你们从起初就与我同在[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为现在时直陈式；“从起初就与我同在”表达从过去延续至今的状态。
    reason: 说明原文现在时与时间短语所表达的持续状态，避免把直陈式误作明确的命令式。
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: 你们也
  rationale: 显明主语“你们”的强调，并承接上节圣灵所作的见证；现代汉语中“也”自然表达门徒同样作见证。句首连接词不另译，以免形成累赘的“而你们也”。
- source_word: μαρτυρεῖτε
  choice: 要作见证
  rationale: μαρτυρέω具有作证、见证的含义。“作见证”保留其证人语感，也符合现代中文圣经语域。希腊语形式可理解为直陈式“你们作见证”，也可能在语境中带命令意味，故以脚注保留歧义。
- source_word: ὅτι
  choice: 因为
  rationale: 在此最自然地引出门徒能够作见证的理由，即他们从起初便与耶稣同在；若译作“即/就是”，则会把后句理解为见证内容，语境上较不自然。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 贴近原文且保留约翰文献中的庄重表达；经文自身不进一步限定这个“起初”的确切时间点。
- source_word: μετ’ ἐμοῦ
  choice: 与我同在
  rationale: 准确表达 μετά 加属格所表示的陪伴和关联，比单纯“跟我在一起”更庄重，同时仍是普通读者容易理解的现代汉语。
- source_word: ἐστε
  choice: 就与我同在
  rationale: 原文为现在时“你们是/在”，与“从起初”连用表示从过去延续至今的状态；汉语用“从起初就……”可自然表达这种持续性，无须改用完成体。
theological_decisions:
- issue: “从起初”的范围
  choice: 正文保留“从起初”，不明说具体指耶稣公开事工或门徒生涯的起点
  alternative: 明确译为“从我开始传道时”或理解为绝对、宇宙性的起初
  rationale: 上下文很可能指门徒自耶稣事工早期便与他同行，因此具备历史见证资格；但原文本身只说“从起初”，不宜在正文加入更具体或形而上的解释。
- issue: μαρτυρεῖτε 的语气
  choice: 正文译作“要作见证”，并用脚注说明也可译为陈述句
  alternative: “你们也作见证”
  rationale: 该形式在形态上是现在时直陈式，但在此语境中可能承担带命令意味的宣告。译文采用自然且符合语境的“要”，同时不隐去语法上的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作见证”保留司法与信仰宣告的双重语感；“从起初就与我同在”在汉语中自然表达持续至今。脚注标记均已置于正文相关位置。
