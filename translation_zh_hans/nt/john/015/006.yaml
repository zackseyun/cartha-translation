  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: zh_hans
  text: 人若不常在我里面[a]，他就像枝子一样被扔在外面而枯干；人把它们收集起来，扔进火里[b]，它们就被烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“住在我里面”。希腊语动词也可译作“住”“停留”，在《约翰福音》中常表示持续保持一种关系。
    reason: lexical_alternative
  - marker: b
    text: 这个图像警告人会被排除并遭焚烧；但本节本身没有说明，这指的是真正的门徒失去救恩，还是虚假的依附被显露出来。
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: 常在
  rationale: μένω是《约翰福音》的关键词，表示持续停留、保持关系。“常在”既保留持续意味，也符合现代中文圣经语体；脚注注明“住在”这一传统译法。
- source_word: ἐν ἐμοί
  choice: 在我里面
  rationale: 保留原文介词结构及其关系性和神学张力，不解释为较弱的“与我同在”或较具解释性的“与我相连”。
- source_word: ἐβλήθη ἔξω
  choice: 被扔到外面
  rationale: 保留被动语态和具体动作。虽然原文用不定过去时，中文条件句以这一结果性表达自然呈现其警告力度，无须机械标示过去时间。
- source_word: ὡς τὸ κλῆμα
  choice: 像枝子一样
  rationale: κλῆμα在上下文中特指葡萄树的枝子；因前文已建立葡萄树意象，正文简洁译作“枝子”。
- source_word: ἐξηράνθη
  choice: 枯干了
  rationale: 兼顾“变干”和植物“枯萎”的含义，贴合枝子的图像，也保留动作已经达到结果的语气。
- source_word: συνάγουσιν
  choice: 人……收集起来
  rationale: 希腊文第三人称复数在此泛指未说明身份的行动者。现代中文用泛称的“人”比直译“他们”更自然，也不擅自确定行动者。
- source_word: αὐτὰ
  choice: 这些枝子
  rationale: 原文代词为中性复数，指这类被丢弃、枯干的枝子。中文明确补出“枝子”，既呈现复数所指，也避免代词指向含混。
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: 扔进火里
  rationale: 直接保留动作和方向，采用自然、具体的现代中文。
- source_word: καίεται
  choice: 就烧起来了
  rationale: 原文为单数现在时的被动形式，但可表达燃烧状态；中文不强标数，以省略主语的“就烧起来了”保留从复数枝子回到代表性枝子图像的语法张力，也避免误译成主动施事明确的表达。
- source_word: τις
  choice: 人若
  rationale: τις在条件句中泛指任何人；中文“人若”简洁庄重，并完整表达不限定对象的警告。
theological_decisions:
- issue: 是否把枝子被丢弃和焚烧明确解释为真信徒失落、假门徒显露，或某一特定末世审判机制
  choice: 直接保留枝子被丢弃、枯干并焚烧的警告图像
  alternative: 在正文中明确解释为真信徒离弃后灭亡，或从未真正属于耶稣的人被显明
  rationale: 本节的图像具有排除和焚烧的审判意味，却没有在本句内界定所描写者先前属灵身份的精确性质。译文因此不替原文解决后来的教义争论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“常在我里面”延续《约翰福音》的关键词和空间性比喻；“人若”“枯干了”等表达略具经文庄重感，但不显古奥。分号保留原文从单数枝子到泛指收集、焚烧场景的推进。
