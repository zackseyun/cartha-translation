  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you slaves[a], because the slave does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: zh_hans
  text: 我不再称你们为奴隶[a]，因为奴隶不知道主人[b]在做什么；我已经称你们为朋友了，因为我已经把从我父那里听见的一切都告诉你们了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”所译的希腊语也可译作“奴仆”或“仆人”。这里与“朋友”对比，重点在于受主人支配、不能得知主人所做之事的从属身份。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译作“主”；这里指奴隶的主人，并非作为神圣或弥赛亚称号的“主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: 我不再称你们为
  rationale: “不再”保留οὐκέτι所表达的状态转变；“称……为”自然传达λέγω在此给人身份称谓的用法，并保留现在时。
- source_word: δούλους / δοῦλος
  choice: 奴仆 / 奴仆
  rationale: “奴仆”既保留受主人支配的身份意味，也比单纯的“仆人”更能体现本节与“朋友”形成的地位对比；脚注注明“奴隶”等可能译法。
- source_word: οἶδεν τί ποιεῖ
  choice: 不知道……在做什么
  rationale: 直译知识状态和进行中的行动，符合现代汉语表达。
- source_word: αὐτοῦ ὁ κύριος
  choice: 主人
  rationale: κύριος在这里指奴仆关系中的主人，并非神圣或弥赛亚称号；“主人”最切合此处的社会关系比喻。汉语中所属关系可由语境自然表达，无须生硬加上“他的”。
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: 我却已经称你们为朋友
  rationale: “却”保留δὲ的对比；“已经称……为”表达εἴρηκα完成时所含的既成称谓及其持续效力。
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: 我从我父那里听见的一切
  rationale: “从……那里”明确表达παρά加属格所指的来源；“听见”保留ἀκούω的基本语义，不改译为较宽泛的“领受”。
- source_word: ἐγνώρισα ὑμῖν
  choice: 都已经让你们知道了
  rationale: 自然表达γνωρίζω“使人知道”的使动意义；“已经……了”体现已完成且现今仍有效的启示。
theological_decisions:
- issue: 门徒身份对比中的δοῦλος
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: 上下文强调从属者不知道主人所做的事，与朋友获知内情形成对照。“奴仆”保留从属与受支配意味，同时让脚注承认该词在古代语境中可指奴隶或仆役，避免把其社会身份过度窄化。
- issue: 家庭与身份比喻中的κύριος
  choice: 主人
  alternative: 主
  rationale: 此处是主人与奴仆的关系用语，不是直接使用神圣称号。“主人”准确传达关系，又避免无根据地把称号含义带入比喻。
- issue: εἴρηκα的完成时效力
  choice: 已经称你们为朋友
  alternative: 称你们为朋友；曾称你们为朋友
  rationale: “已经”体现这一称谓先前已经作出并仍然成立，不把完成时仅化为过去发生的动作。
- issue: 耶稣从父所得并向门徒公开的知识范围
  choice: 我从我父那里听见的一切，都已经让你们知道了
  alternative: 凡从我父所听见的，我都告诉你们了
  rationale: 保留πάντα ἃ的全面性和“听见—使知道”的词义对应，不进一步界定“一切”的神学范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我父”保留《约翰福音》中耶稣谈及父的凝练称呼；分号呈现奴仆与朋友之间的鲜明对比。脚注标记均放在其实际解释的词语之后。
