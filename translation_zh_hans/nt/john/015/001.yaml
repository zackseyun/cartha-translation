  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: zh_hans
  text: “我是真葡萄树，我父亲是栽培者[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “栽培者”也可译作“园丁”或“葡萄栽培者”。希腊文γεωργός指耕作、栽培土地的人；在本节葡萄树的比喻中，可具体指照料葡萄树的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 以现代汉语自然表达第一人称判断句；主语“我”明确保留了希腊文显式代词的强调，不另加“我自己”以免语气过重。
- source_word: ἄμπελος
  choice: 葡萄树
  rationale: 该词指葡萄藤或葡萄树；“葡萄树”在现代汉语中清楚自然，也能完整承载本节的比喻意象。
- source_word: ἀληθινή
  choice: 真
  rationale: 保留约翰著作中“真实、真正、终极实在”的语义张力，不局限为仅仅“不是假的”。
- source_word: πατήρ μου
  choice: 我的父
  rationale: 直译其所属关系，并保留耶稣称上帝为父的个人及神学关系；在简体中文正文中不依赖英文式大写来标示神圣称谓。
- source_word: γεωργός
  choice: 栽培的人
  rationale: 该词基本义为耕作、栽培土地的人；在葡萄树的语境中，此译法既自然易懂，又凸显父对葡萄树的照料和栽培，而不把词义过度限定为某一现代职业名称。
theological_decisions:
- issue: 耶稣“我是”宣告中的比喻性认同
  choice: 直译为“我是真葡萄树”
  alternative: “我是真正的葡萄树”或“我就是那真实的葡萄树”
  rationale: 原文直接以葡萄树比喻耶稣，译文不展开象征含义，也不额外指定其所对应的旧约背景；“真”保留约翰用语中“真实、终极实在”的神学深度。
- issue: 父作为 γεωργός 的身份
  choice: 译为“栽培的人”
  alternative: “园丁”“种葡萄的人”或“葡萄园农夫”
  rationale: 译文保留父主动栽培和照料的形象，同时避免将其窄化为葡萄园所有者或一般园艺职业；脚注列出符合上下文的替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真葡萄树”保留约翰福音凝练的比喻表达；“我的父”清楚传达关系而不引入英文大小写习惯。脚注标记置于其所说明的“栽培的人”之后。
