source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: zh_hans
  text: 如果我没有在他们中间行过别人从未行过的作为，他们就不会有罪[a]；但如今，他们既看见了我和我的父，又恨恶我和我的父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就不会负有罪责。”希腊文直译为“他们就不会有罪”。
    reason: 说明“有罪”这一原文惯用语可指罪责，同时不加入原文未限定的“这罪”，并保留正文的字面表达。
lexical_decisions:
- source_word: τὰ ἔργα
  choice: 事
  rationale: 这里指耶稣所行、显明其身份和使命的作为；“事”在句中自然简洁，并保留约翰福音中这些行为作为启示性证据的含义。
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: 我在他们中间做过
  rationale: ἐν αὐτοῖς在此表示耶稣当着他们、在他们中间施行这些事，而不是在他们里面产生某种内在行动；“做过”也符合反事实条件句的时态关系。
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: 别人从未做过的
  rationale: 直接表达这些作为的独特性；“别人从未做过”是现代汉语中自然有力的说法。
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: 他们就不会有罪
  rationale: 保留约翰式“有罪”的表达，不把它缩窄为单纯的主观内疚或某一套责任理论。
- source_word: νῦν δὲ
  choice: 但如今
  rationale: 清楚标明假设情形与当前事实之间的转折。
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: 既看见了……又恨恶……
  rationale: 以“既……又……”体现两个καί所连接的并列动作，并使完成而仍具现实意义的行动在汉语中自然呈现。
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: 我和我的父
  rationale: 保留耶稣与父并列作为两个动作对象的结构，不添加原文没有的解释。
theological_decisions:
- issue: “他们就不会有罪”所表达的罪责范围
  choice: 保留“有罪”这一约翰式措辞
  alternative: 他们就不会因这罪而负罪责
  rationale: 上下文指向人在见到耶稣独特作为之后仍恨恶他和父，因而罪责加重；但原文没有在此明确界定为一般无罪、某一特定罪或某种法理责任，译文因此保留其张力。
- issue: “看见”与“恨恶”的对象
  choice: 两个动词都明确以“我和我的父”为对象
  alternative: 他们已经看见了，却又恨恶我和我的父
  rationale: 原文的并列结构可使“我和我的父”同时受“看见”和“恨恶”支配；重复对象虽略显强调，却避免汉语中把“看见”的宾语误解为仅指此前的作为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既……又……”保存并列强调；为清楚表明两个动词共同指向“我和我的父”，有意重复宾语。
