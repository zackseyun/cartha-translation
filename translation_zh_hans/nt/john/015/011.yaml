id: JHN.15.11
reference: John 15:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: zh_hans
  text: 我已经把这些事告诉你们，为要使我的喜乐在你们里面[b]，也使你们的喜乐得以圆满[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得以完全。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你们中间。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示代词所指向的前述一系列教导，也符合现代汉语表达。
- source_word: λελάληκα ὑμῖν
  choice: 我把……告诉了你们
  rationale: λελάληκα是完成时，表达已经说出且其话语仍具效力；“告诉了你们”自然呈现向门徒说话的意义，而“了”承载完成意味。
- source_word: ἵνα
  choice: 是要让
  rationale: 清楚表达目的，同时比生硬的“为要使”更符合现代标准汉语。
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: 我的喜乐
  rationale: 直接保留属主结构及其神学开放性，不擅自解释为“我赐的喜乐”。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 保留ἐν的首要空间隐喻，可表达喜乐内在于门徒；其“在你们中间”的可能意义以脚注保留。
- source_word: ᾖ
  choice: 存在
  rationale: 在“在你们里面”之后用“存在”明确表达εἰμί，避免单说“在”造成口语上的省略感。
- source_word: καὶ
  choice: 也
  rationale: 在两个并列目的之间，“也”比机械使用“并且”更自然，并保留递进并列关系。
- source_word: ἡ χαρὰ ὑμῶν
  choice: 你们的喜乐
  rationale: 自然保留与“我的喜乐”的对应和对比。
- source_word: πληρωθῇ
  choice: 得以圆满
  rationale: 兼顾被动意味与达到充分、完全状态的语义；“得以”自然表达目的句中的被动可能性。
theological_decisions:
- issue: “我的喜乐”的性质
  choice: 保持“我的喜乐”，不作解释性扩充
  alternative: 我赐给你们的喜乐；因我而有的喜乐
  rationale: 原文只表达属于耶稣的喜乐，既可理解为他自己的喜乐与门徒共享，也可联系门徒与他联合所得的喜乐；译文不缩窄这种神学张力。
- issue: ἐν ὑμῖν所表达的关系
  choice: 正文译作“在你们里面”
  alternative: 在你们中间
  rationale: 内在意义与下句门徒的喜乐达到圆满衔接自然，但希腊文也允许群体性的“在你们中间”，故以脚注保留。
- issue: 喜乐达到πληρόω所指的状态
  choice: 译作“得以圆满”
  alternative: 得以完全；被充满
  rationale: “圆满”保留充分与完成两方面的含义，且不规定喜乐究竟是被充满还是完成。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喜乐”保留圣经语体的尊严感；句法避免过度文言化。脚注标记均置于相应正文词组之后。
