  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: zh_hans
  text: 恨我的人，也恨我的父。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: 恨……的人
  rationale: 定冠词加现在分词在此作名词用，泛指以恨这一行为为特征的人；“恨……的人”符合现代汉语表达，并保留泛指意味。
- source_word: ἐμὲ
  choice: 我
  rationale: 作μισῶν的直接宾语；译为“我”直接自然。其显式代词形式在本句简洁的对举结构中已得到充分体现。
- source_word: μισῶν / μισεῖ
  choice: 恨
  rationale: μισέω意为“恨、憎恨”。两处均译为“恨”，保留原文的词汇重复，并以汉语一般时态表达普遍性陈述。
- source_word: καὶ
  choice: 也
  rationale: καί在此表明，恨耶稣的人同样恨父；“也”自然传达原文的并列兼递进关联，而不增加额外含义。
- source_word: τὸν πατέρα μου
  choice: 我的父
  rationale: πατέρα与属格代词μου自然译作“我的父”。“父”在约翰福音中指上帝，并表达耶稣与他的关系；现代中文圣经语体通常以“父”表明这一称谓，无须依赖英文式大小写。
theological_decisions:
- issue: “父”作为对上帝的关系称谓
  choice: 我的父
  alternative: 我父亲
  rationale: 原文明确是耶稣称上帝为“我的父”。“我的父”既保留关系称谓及其基督论分量，又避免“我父亲”在现代汉语中过强的日常生物学联想；不额外加入“天父”等原文未有的限定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文两次“恨”的重复及单数泛指结构；不添加解释性词语。
