id: JHN.15.9
reference: John 15:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: zh_hans
  text: 父怎样爱我，我也照样爱你们；你们要常在我的爱中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: 怎样……照样
  rationale: 保留比较和对应关系，并采用自然的现代汉语句式。
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: 父怎样爱我
  rationale: 按原文表达父对耶稣的爱；汉语动词“爱”本身不强制标明过去或持续时态，因此可保留希腊语不定过去时在语境中的开放性。
- source_word: κἀγὼ ὑμᾶς ἠγάπησα
  choice: 我也照样爱你们
  rationale: “也照样”体现 κἀγώ 与前句的连接、强调和对应；“你们”明确 ὑμᾶς 为复数。
- source_word: μείνατε
  choice: 要常在
  rationale: 表达命令语气，并延续约翰著作中 μένω 所强调的持续关系；比“居留”自然，也比单纯“停留”更符合本段语境。
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: 在我的爱中
  rationale: 直接保留介词结构和所有关系，不把“我的爱”进一步解释为单一方向的情感或行为。
theological_decisions:
- issue: ἀγάπη 的译法
  choice: 爱
  alternative: 仁爱；慈爱
  rationale: “爱”是现代汉语中最直接、宽广而自然的对应词；不额外加入某一特定神学类别。
- issue: 两个不定过去时 ἠγάπησέν／ἠγάπησα 的表达
  choice: 均译为不带显式时态标记的“爱”
  alternative: 曾爱；一直爱着
  rationale: 现代汉语通常无需按希腊语不定过去时添加“曾”或完成体标记。这样既不把爱限制为过去事件，也不把原文明确改写成持续体，保留其在当前劝勉中的延续意义。
- issue: “我的爱”的关系含义
  choice: 保留“我的爱”
  alternative: 我对你们的爱；你们对我的爱
  rationale: 原文所有格表达本身可承载基督所给予的爱、属基督的爱以及门徒所处的爱之关系；译文不将其缩窄为单一方向。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“常在”既容易理解，也保留约翰福音中 μένω 的主题性用语；句子以分号呈现前面的爱的事实与后面的命令之间的紧密联系。
