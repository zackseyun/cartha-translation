  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: zh_hans
  text: 在这事上，我父得荣耀：就是你们结出许多果子，并且成为我的门徒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 因这事
  rationale: 保留指示语的概括性，并自然引出后面的内容从句；其所指由下文“结出许多果子，并且成为我的门徒”说明。
- source_word: ἐδοξάσθη
  choice: 得荣耀
  rationale: 用汉语圣经语体中自然且准确的表达传达不定过去时被动形式，不额外限定其时态或实现方式。
- source_word: καρπὸν πολὺν φέρητε
  choice: 结出许多果子
  rationale: 保留葡萄树比喻中的“果子”意象，并以现代汉语常用搭配“结出”表达 φέρω。
- source_word: γένησθε
  choice: 成为
  rationale: 直接反映该动词的文本形式和“成为”的语义，不按部分异文或解释改作“显明是”。
- source_word: μαθηταί
  choice: 门徒
  rationale: 准确表达 μαθητής，指跟随并受教于耶稣的人。
theological_decisions:
- issue: ἵνα 所引从句与父得荣耀的关系
  choice: 以冒号和“就是”说明“这事”的内容
  alternative: 译为目的句：“好使你们结出许多果子……”
  rationale: 此处 ἵνα 可有内容说明或目的意味；结合 ἐν τούτῳ，以内容说明更符合句法与上下文，同时不排除结果或目的色彩。
- issue: γένησθε 是否暗示先结果子才成为门徒
  choice: 保留“并且成为我的门徒”的并列表述
  alternative: 解释性译为“这样就显明是我的门徒”
  rationale: SBLGNT 正文为 γένησθε，宜忠实保留其“成为”措辞，不把门徒身份与结果子的神学关系提前解释清楚。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语；保留原文“果子”的比喻和“成为”的张力，不加入解释性脚注。
