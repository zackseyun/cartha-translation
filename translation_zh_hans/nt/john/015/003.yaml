  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: zh_hans
  text: 你们已经因我对你们所讲的话而洁净了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着我对你们所讲的话。”
    reason: διά加宾格在此主要可表原因，但也可按途径或媒介理解。
lexical_decisions:
- source_word: ἤδη
  choice: 现在……已经
  rationale: 表达门徒此刻已处于洁净状态，也自然承接上下文的修剪与洁净意象。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确保留复数代词；汉语以主语位置和语境承载原文的强调，不另加“你们自己”。
- source_word: καθαροί
  choice: 洁净
  rationale: 比“纯洁”更具体，并保留与上文修剪、清理意象之间的词义联系。
- source_word: διὰ τὸν λόγον
  choice: 因……话
  rationale: διά加宾格在此自然表达原因；“因”简洁而庄重。介词也可理解为途径或媒介，故列入脚注。
- source_word: λόγον
  choice: 话
  rationale: 直接对应λόγος，并符合“讲……话”的现代汉语搭配；不将其解释性缩窄为“信息”或“教导”。
- source_word: ὃν λελάληκα ὑμῖν
  choice: 我对你们所讲的
  rationale: 准确表达关系从句和间接宾语；“所讲的”与中心词“话”搭配自然。希腊语完成时所含的持续结果，结合“已经洁净”已能在汉语中体现。
theological_decisions:
- issue: 门徒“洁净”的性质
  choice: 译为当下已经成立的“洁净”状态，不增添技术性教义术语。
  alternative: 将其明确解释为圣礼性的洁净，或法庭性称义的宣告。
  rationale: 经文本身处于葡萄树修剪与洁净的比喻语境中，并把这一状态与耶稣所讲的话相联；译文应保留其神学开放性。
- issue: διά所表达的关系
  choice: 正文采用原因义“因”。
  alternative: 译作媒介义“借着”。
  rationale: διά加宾格通常表达原因，但本句也可能让读者感受到耶稣之话作为洁净途径的意味，因此不应完全抹去另一理解。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“现在……已经”略显强调，用以对应ἤδη及显式主语ὑμεῖς；“洁净”保留约翰福音上下文中的核心意象。
