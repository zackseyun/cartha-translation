review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了强转折、将来时、“这一切事”、行动指向门徒、因果性的“因我的名”，以及对差遣者不认识这一原因。惟“那差我来的”在现代普通话中欠完整，宜明确为“那位差遣我的”。
  naturalness: “把这一切事都做在你们身上”虽可理解，但搭配生硬，不是现代汉语对“向某人做这些事”的自然表达。“向你们做这一切事”更自然，同时不把广义的ποιέω具体化。
  terminology: “因我的名”“不认识”均恰当，分别保留“名”的代表性含义及约翰语境中关系性的“认识”。“差遣”是庄重且通行的经文用语，适合πέμψαντά。
  issues:
  - severity: medium
    issue: “把这一切事都做在你们身上”搭配不自然。
    rationale: 汉语通常说“向你们做这一切事”或“在你们身上行这一切事”。前者既自然，又保留ποιήσουσιν的宽泛“做”义和εἰς ὑμᾶς的行动指向。
  - severity: low
    issue: “那差我来的”不够符合现代标准普通话的名词化表达。
    rationale: 原文为“那位差遣我的人”这一带冠词的实词化分词结构；补出量词“位”并采用“差遣”可使指称清楚，而不添加“父”等原文未明说的称谓。
  - severity: low
    issue: 脚注的“这样敌对你们”将词组替代为较具体的行为描述。
    rationale: 脚注应更直接呈现εἰς ὑμᾶς可译为“向/针对你们”，并说明在本语境中可含敌对意味，避免把替代译文表述成“敌对”这一特定动作。
