revisions:
- from: 但他们会因我的名，把这一切事都做在你们身上[a]，因为他们不认识那差我来的。
  to: 但他们会因我的名，向你们做这一切事[a]，因为他们不认识那位差遣我的。
  rationale: 修订仅改善现代汉语的搭配与实词化分词的指称清晰度。“向你们做这一切事”保留原文动词的宽泛性和介词短语的方向性；“那位差遣我的”忠实对应“那位差我来的”，不将隐含所指显明增译为“父”。脚注改为直接反映“针对你们”这一词汇替代，并保留敌对含义仅为语境说明。
