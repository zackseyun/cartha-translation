source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: zh_hans
  text: 但他们会因我的名，向你们做这一切事[a]，因为他们不认识那位差遣我的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“针对你们。”希腊语短语表示行动指向门徒，在这里可带敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成明显转折；“但”简洁自然，力度恰当。
- source_word: ταῦτα πάντα
  choice: 这一切事
  rationale: 同时保留指示词“这些”和πᾶς所表达的整体性，并符合现代汉语习惯。
- source_word: ποιήσουσιν
  choice: 会……做
  rationale: 保留将来时和ποιέω较宽泛的“做”义，不把它提前具体化为“迫害”或“对待”。
- source_word: εἰς ὑμᾶς
  choice: 在你们身上
  rationale: 表达行动指向门徒，中文自然，也能在上下文中容纳敌对含义而不将其绝对化。
- source_word: διὰ τὸ ὄνομά μου
  choice: 因我的名
  rationale: 准确表达διά加宾格的原因义，并保留“名”所承载的身份、人格与权柄意涵。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚引出他们如此行的深层原因。
- source_word: οὐκ οἴδασιν
  choice: 不认识
  rationale: 约翰语境中的οἶδα不只是缺乏知识，也可涉及关系上的不认识；中文“认识”保留这层深度。
- source_word: τὸν πέμψαντά με
  choice: 那差我来的
  rationale: 按实词化分词结构翻译，保留其个人指称，却不把原文未明说的“父”直接加入正文。
theological_decisions:
- issue: “那差我来的”所指是谁
  choice: 保留含蓄表达“那差我来的”
  alternative: “差我来的父”
  rationale: 约翰福音上下文表明所指为父，但希腊文本本句只用带冠词的分词短语；不显明补入“父”，可忠实保存原文表达。
- issue: “因我的名”的含义
  choice: 直译为“因我的名”
  alternative: “因为你们属于我”或“因我的缘故”
  rationale: “名”在约翰著作中具有代表耶稣身份与权柄的神学分量；意译虽易懂，却会缩窄原文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“把这一切事都做在你们身上”略保留原文结构，以维持ποιέω与εἰς ὑμᾶς的宽泛性；脚注说明上下文中的敌对含义。
