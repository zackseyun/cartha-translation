  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: zh_hans
  text: “这就是我的命令：你们要彼此相爱，正如我爱你们一样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: 这就是我的命令
  rationale: 以自然的现代汉语表达指示代词、系词、名词及强调性物主结构，既指出这条具体命令，也保留耶稣所赋予的权威。
- source_word: ἵνα
  choice: 你们要
  rationale: 此处引出命令的具体内容。汉语用“要”能自然、清楚地表达命令语气，无须机械译出连接词。
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: 彼此相爱
  rationale: “彼此相爱”是简洁自然的对应表达；不额外译出希腊语现在时态可能蕴含的持续性，以免过度诠释。
- source_word: καθὼς
  choice: 正如
  rationale: 明确表达比较和榜样关系，表明耶稣的爱是门徒彼此相爱的准则。
- source_word: ἠγάπησα ὑμᾶς
  choice: 我爱了你们
  rationale: 以完成性表达贴近不定过去时，同时保留其可指耶稣已经显明之爱的开放性，不提前限定为某一单独事件。
theological_decisions:
- issue: ἀγαπάω的译法
  choice: 爱／相爱
  alternative: 仁爱；关爱
  rationale: “爱”是现代汉语中最直接、涵盖面最合适的对应词，也能保持本段同源词之间的连贯，不加入特定宗派含义。
- issue: καθὼς所表达的关系
  choice: 正如
  alternative: 照着；像……一样
  rationale: 保留耶稣之爱既是榜样又是衡量标准的文本张力，不把比较关系扩展为经文未明说的教义解释。
- issue: ἠγάπησα的时态表达
  choice: 我爱了你们
  alternative: 我曾爱你们；我一直爱你们
  rationale: “爱了”较贴近希腊语不定过去时的整体性视角；不译成“一直爱”，避免把持续体意义强加给原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此相爱”符合汉语圣经语体且仍属日常可懂表达。将命令内容前置，使句子自然有力；分号后的总结句对应原文的识别结构。脚注标记已在正文中出现。
