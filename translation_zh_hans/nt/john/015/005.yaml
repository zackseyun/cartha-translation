  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: zh_hans
  text: 我是葡萄树，你们是枝子。那住在我里面[a]、我也住在他[b]里面的人，就结出许多果子；因为离了我，你们什么也不能做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在”也可译作“常在”或“持续留在”。原文动词在约翰福音中常强调关系上的持续与不离。
    reason: lexical_alternative
  - marker: b
    text: 原文“他”是阳性单数，在这里具有代表性，泛指任何住在耶稣里面的门徒。
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἄμπελος
  choice: 葡萄树
  rationale: ἄμπελος在此指结葡萄的藤本植物。现代汉语以“葡萄树”最自然，也能清楚承接枝子与果子的比喻。
- source_word: κλήματα
  choice: 枝子
  rationale: κλῆμα在葡萄栽培语境中指葡萄树的枝条。“枝子”通俗而庄重，并与“葡萄树”的比喻自然搭配。
- source_word: ὁ μένων
  choice: 住在……的
  rationale: 现在分词μένων含持续之意；“住在”保留约翰福音中关系持续、居留不离的意味，又符合现代汉语表达。
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: 在我里面……在他里面
  rationale: 直译介词ἐν为“在……里面”，保留彼此内住的强烈关系性语言，不弱化为仅仅“与……同在”。
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ由καί与ἐγώ合成，在这里表达相互对应的关系；“我也”清楚呈现门徒住在耶稣里面、耶稣也住在那人里面的结构。
- source_word: φέρει καρπὸν πολύν
  choice: 结出许多果子
  rationale: “结果子”是汉语中与葡萄树意象最自然的搭配；加入“出”使动态表达流畅，“许多”准确对应πολύν。
- source_word: χωρὶς ἐμοῦ
  choice: 离了我
  rationale: χωρίς表示与耶稣分离。“离了我”简洁自然，比单说“没有我”更能突出脱离关系的含义。
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: 你们什么也不能做
  rationale: 该否定结构明确表达能力上的不能；“什么也不能做”准确而自然，不把它误解为禁令。
theological_decisions:
- issue: 约翰著作中彼此内住的语言
  choice: 保留“住在我里面，我也住在他里面”
  alternative: 与我同在，我也与他同在
  rationale: 原文以ἐν表达相互的“在……里面”。译文保留这一神学张力，不把它解释或弱化为一般性的陪伴。
- issue: αὐτῷ的阳性单数及代表性用法
  choice: 正文译为“他”，并用脚注说明其普遍适用范围
  alternative: 那人；他们
  rationale: 原文是阳性单数，与ὁ μένων和οὗτος呼应，同时具有代表性，泛指任何住在耶稣里面的门徒。保留单数“他”可准确反映语法形式，脚注则避免读者误以为只适用于男性。
- issue: “离了我……不能做”的能力陈述
  choice: 按原文保留绝对表述“什么也不能做”
  alternative: 不能结出属灵的果子；不能成就任何善事
  rationale: 原文没有明说“什么”的范围。译文不增补限定，以保留其概括性及解释上的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“葡萄树—枝子—结果子”的意象保持连贯；句式尽量贴近原文的相互结构，同时以“这人就”自然呈现οὗτος的强调作用。
