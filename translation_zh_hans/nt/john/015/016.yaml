source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: zh_hans
  text: 不是你们选择了我，而是我选择了你们[a]；我派定你们，叫你们去结果子，使你们的果子常存[b]，好让你们无论奉我的名向父[c]求什么，他都赐给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选择”也可译作“拣选”或“挑选”。这里强调耶稣主动选择门徒；正文不用带有较强后期神学术语色彩的表达。
    reason: lexical_alternative
  - marker: b
    text: “常存”也可译作“长存”或“留下”。这个动词在约翰福音中也常用于表达持续、住在或保持关系；这里指门徒所结的果子持续存在。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“父”，不是“我的父”。
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: 拣选了／拣选了
  rationale: ἐκλέγομαι表示选择、挑选；“拣选”自然保留耶稣主动选择门徒的关系性对比，但正文不使用更容易被理解为系统神学术语的“选召”或“预选”。
- source_word: ἔθηκα
  choice: 委派
  rationale: τίθημι本义为放置、设立；此处后接去结果子的使命目的，“委派”能表达有目的的安排，又不把含义局限为按立某种教会职分。
- source_word: ἵνα
  choice: 使／好让
  rationale: 两处ἵνα引出目的或预期结果。分别译为“使”和“好让”，既显明语法联系，也使现代汉语行文自然。
- source_word: ὑπάγητε
  choice: 去
  rationale: ὑπάγω可指去、离去；此处“去”保留其宽泛含义，并与门徒受委派后的行动相连，不额外限定具体宣教方式。
- source_word: καρπὸν φέρητε
  choice: 结果子
  rationale: 直译并保留约翰福音上下文中的果子隐喻；“结果子”也是自然、易懂的现代汉语表达。
- source_word: μένῃ
  choice: 长存
  rationale: μένω可表示留下、持续、常在。这里主语是“果子”，“长存”清楚表达果效持续存在；脚注保留“常存”等译法，并提示其与约翰惯用词的联系。
- source_word: ὅ τι ἂν αἰτήσητε
  choice: 无论……求什么
  rationale: 关系表达式与ἄν表示不确定而宽泛的范围；“无论……什么”准确、自然。“求”也适合向父祈求的语境。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: “奉我的名”是ἐν τῷ ὀνόματί μου在祷告语境中的自然对应，保留其关系性和代表性含义，不在正文中将其缩减为公式或扩展为特定解释。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 希腊文是带冠词的“父”，不是“我的父”。汉语在“向父求”中通常无需译出冠词，脚注明确原文措辞。
- source_word: δῷ
  choice: 他都赐给你们
  rationale: δῷ为ἵνα从句中的不定过去时虚拟式，受目的／结果结构支配。汉语不以“可能”机械对应虚拟式；“好让……他都赐给你们”保留从属关系，并避免将末句割裂成独立的无条件公式。
theological_decisions:
- issue: ἐξελεξάμην是否应译为带有系统神学色彩的“选召”或“拣选”
  choice: 按直接门徒与使命语境译为“我拣选了你们”
  alternative: 译为“我选召了你们”，突出教义性的拣选或呼召
  rationale: 本句明确强调耶稣的主动性，但动词本身是“选择、挑选”，上下文对象是门徒，并紧接受委派去结果子。译文保留神圣主动性，同时不预先规定其在后世系统神学中的范围。
- issue: ἔθηκα ὑμᾶς所指为何
  choice: 理解为为去结果子而作的委派
  alternative: 直译为“安置你们”，或限定为按立某种教会职分
  rationale: 后续ἵνα从句直接说明其目的在于去和结果子。“委派”表达使命安排，却不把经文收窄为特定圣职制度。
- issue: 末尾ἵνα从句的效力
  choice: 保留为与委派、结果子相连的目的／预期结果：“好让……他都赐给你们”
  alternative: 译成脱离前文的直接未来保证：“他必赐给你们”
  rationale: 希腊语用第二个ἵνα将祈求与前文连结。汉语以“好让”保留这种从属关系；“都赐给”传达应许力度，但不把它改写为与上下文无关的独立祷告公式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拣选—委派—去—结果子—长存—祈求”保留原句的推进。“奉我的名”沿用现代汉语基督教语境中通行且自然的表达，同时不作额外教义解释。三个脚注标记均置于相关正文词组之后。
