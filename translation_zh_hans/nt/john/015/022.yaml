  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: zh_hans
  text: “如果我没有来，也没有对他们说话，他们就不会有罪[a]；但如今，他们对自己的罪却无可推诿[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不会有罪”也可理解为“就不算有罪”或“就不负罪责”。希腊文直译是“就不会有罪”。
    reason: 说明原文措辞及其语境中可能涉及的罪责含义，避免正文替读者消解歧义。
  - marker: b
    text: “无可推诿”也可译作“没有借口”或“没有托词”。
    reason: 注明πρόφασις可表示借口、托词或用来开脱的理由。
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: 如果我没有来对他们说话
  rationale: 以现代汉语的反事实条件句表达希腊文过去时态所构成的未实现条件；“来”和“说话”均予保留。
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: 他们就不会有罪
  rationale: 保留“有罪”这一约翰式表达及条件句的结果关系，不在正文中将其解释性改写为“不必为这罪负责”。
- source_word: νῦν δὲ
  choice: 但如今……却
  rationale: 清楚呈现假设情况与当前现实之间的强烈转折。
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: 无可推诿
  rationale: 在现代汉语中自然表达“没有可用作辩解或开脱的理由”，同时避免生硬直译为“没有借口”。
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: 对自己的罪
  rationale: περί加属格在此表示“关于、对于”；结合汉语“无可推诿”的搭配译作“对自己的罪”，不将其过度限定为纯粹因果关系。
theological_decisions:
- issue: “不会有罪”是否宣称绝对无罪，还是特指拒绝耶稣启示所产生的罪责
  choice: 正文保留“不会有罪”，让上下文限定其所指。
  alternative: 他们就不算有罪／就不必为这罪负责
  rationale: 原文直说“不会有罪”，而语境确实聚焦于人在耶稣来临并发言之后拒绝他的责任。直译能够保留这种神学张力，不把较窄的解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对他们说话”紧贴原文动作；“无可推诿”比“关于自己的罪没有借口”更符合汉语习惯。脚注标记均置于正文相应位置。
