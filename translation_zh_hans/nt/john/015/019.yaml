  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: zh_hans
  text: 你们若属世界[a]，世界就会爱属它自己的。然而，你们不属世界，而是我从世界中拣选了你们；正因如此，世界恨你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属世界”也可译作“出于世界”。希腊语ἐκ τοῦ κόσμου可表示来源，也可表示归属；本节后文同一短语在“从世界中拣选了你们”一句里显出“从……中”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: 属世界／从世界中
  rationale: 前两处按汉语习惯译为“属世界”，自然表达来源兼归属；与“拣选”连用的第三处译为“从世界中”，显出被选出的意味，同时保留同一希腊短语的联系。脚注注明其较直译的表达。
- source_word: κόσμος
  choice: 世界
  rationale: 保留约翰用语的广度，既可指人类社会，也可指与耶稣对立的道德—属灵领域；不在正文中收窄为“世界体系”。
- source_word: ἂν ... ἐφίλει
  choice: 就会爱
  rationale: 以“若……就会……”自然表达与事实相反的条件及其结果。
- source_word: τὸ ἴδιον
  choice: 属于自己的人
  rationale: 上下文所指是门徒这类人；此译在现代汉语中自然，也比“自己人”更少附加亲疏或团体色彩。
- source_word: φιλέω
  choice: 爱
  rationale: 保留其与“恨”的鲜明对照，不刻意细分为“喜爱”或“有好感”。
- source_word: ἐξελεξάμην
  choice: 我……拣选了
  rationale: 准确表达耶稣主动选择门徒，且不把中间语态扩写成“为自己拣选”，避免加入原文未明说的神学限定。
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 明确保留因果关系，并使上下文衔接自然。
- source_word: μισεῖ
  choice: 恨
  rationale: 直接保留原文强烈的对立措辞和现在时的一般、持续状态。
theological_decisions:
- issue: 约翰语境中“世界”的含义
  choice: 正文保留“世界”，不作解释性扩写
  alternative: 与上帝为敌的人类社会／世界体系
  rationale: 原文的“世界”具有神学张力和语义广度；正文不应将其限定为某一种系统化解释。
- issue: ἐξελεξάμην所涉及的拣选含义
  choice: 直译为“我从世界中拣选了你们”
  alternative: 使用带有特定预定论体系色彩的措辞
  rationale: 经文明说耶稣的拣选，却没有在本节解决后世关于拣选的教派争论，因此保持陈述本身而不增添体系化结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“然而……而是……”清楚呈现反事实条件与现实之间的转折；分号保留最后因果结论的力度。
