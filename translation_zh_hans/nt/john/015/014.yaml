  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: zh_hans
  text: 你们若遵行我所吩咐你们的，就是我的朋友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们若做我命令你们的那些事，就是我的朋友。”
    reason: 提供较为形式对应的译法，明示ἃ的复数内容，并以“命令”直接表达ἐντέλλομαι的权威力度。
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 第二人称复数代词在原文句首，带有一定强调；现代汉语用“你们”自然表达，语境与句序也可承载其强调作用，无须增译“你们自己”。
- source_word: φίλοι μού
  choice: 我的朋友
  rationale: φίλοι表示关系亲近的人，μού表示所属或关系；“我的朋友”既自然，也准确保留耶稣与门徒之间的关系表述。
- source_word: ἐστε
  choice: 就是
  rationale: 这是“是”的现在时形式。条件分句前置后，汉语以“就是”连接条件与身份判断，表达自然，并未额外加强排他意味。
- source_word: ἐὰν
  choice: 若
  rationale: ἐὰν与虚拟式构成条件句；“若”清楚保留条件关系，语体庄重而仍为现代读者所熟悉。
- source_word: ποιῆτε
  choice: 去做
  rationale: ποιέω在此指实行、遵行所吩咐的事。“去做”是自然的现代汉语表达，不把现在时词干过度解释为持续不断的行动。
- source_word: ἃ
  choice: 所……的
  rationale: 中性复数关系代词指耶稣吩咐的内容；汉语“所”字结构可自然统摄这些事，不必生硬译作“那些事情”。
- source_word: ἐγὼ
  choice: 我
  rationale: 原文明确使用第一人称代词并略带强调；译作“我”保留说话者身份，而“我亲自”会造成过度强调。
- source_word: ἐντέλλομαι ὑμῖν
  choice: 我所吩咐的
  rationale: ἐντέλλομαι表示权威性的命令或嘱咐。“吩咐”在此兼具权威和关系语境，比“指示”更有力度，又比现代汉语中的“命令”稍自然；ὑμῖν的对象由整句的“你们”及语境清楚表达。
theological_decisions:
- issue: 朋友身份与顺服之间的条件关系
  choice: 译为“你们若……就是我的朋友”，明确保留条件关系。
  alternative: “你们照我所吩咐的去做时，就是我的朋友”
  rationale: ἐὰν加虚拟式最自然地表达条件，而非单纯时间关系。译文保留友谊与顺服之间的张力，但不进一步断定这种顺服是获得、证明还是维系朋友身份的方式。
- issue: “吩咐”与“命令”的力度
  choice: 正文采用“吩咐”。
  alternative: “命令”
  rationale: 原词确有权威命令之意；但在耶稣对门徒说话的关系语境中，“吩咐”能自然传达权威而不显得像现代制度性的发号施令。脚注提供“命令”这一更直接的对应。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“若”与“所……的”略具书面色彩，但日常读者容易理解；条件分句前置符合汉语习惯。
