source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: zh_hans
  text: “那位辩护者[a]，就是我要从父那里差给你们、从父而出的真理之灵[b]，来到时，他必为我作见证[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辩护者”所译的希腊词也可译作“帮助者”“劝慰者”或“保惠师”，也有人音译为“帕拉克利特”。
    reason: lexical_alternative
  - marker: b
    text: 原文直陈这位灵“从父而出”；这一措辞后来在三一论的讨论中具有重要意义。
    reason: theological_context
  - marker: c
    text: “为我作见证”也可译作“为我作证”或“见证我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: 来到时
  rationale: ὅταν与虚拟语气在此指向预期将发生的事；“来到时”自然表达将来的时间关系，而不误解为反复发生。
- source_word: ὁ παράκλητος
  choice: 那位辩护者
  rationale: παράκλητος可指受召在旁帮助、代表或申辩的一位。“辩护者”保留其人格性和代表、作证的语境色彩；加“那位”使称谓自然，并与后文的人称指代呼应。
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: 就是我要从父那里差给你们的
  rationale: 保留ἐγώ所带的主语强调，并把ὑμῖν译为“给你们”；παρά加属格表达来源，可自然译为“从父那里”。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理之灵
  rationale: 保留约翰文献中这一凝练的属格称谓，不擅自限定为“真实的灵”或“使人明白真理的灵”。
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: 他从父而出
  rationale: “而出”比笼统的“来自”更贴近ἐκπορεύεται的动作和来源含义，同时避免把后世神学争论的进一步结论写入正文。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 希腊文以阳性强调代词ἐκεῖνος承接“辩护者／灵”；现代汉语用人格代词“他”，传达经文对圣灵的人格性表述。
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: 必为我作见证
  rationale: μαρτυρέω具有作证、见证的语义；“为我作见证”自然保留其见证性质。“必”在此表达将来陈述的确定性，并非另加命令意味。
theological_decisions:
- issue: παράκλητος在圣灵语境中的译法
  choice: 辩护者
  alternative: 帮助者、劝慰者、保惠师，或音译“帕拉克利特”
  rationale: 该词语义丰富，单一汉语词无法涵盖全部含义。“辩护者”在紧邻的“作见证”语境中较能体现代表和申辩作用；脚注保留其他正当理解，不将某一宗派解释绝对化。
- issue: 圣灵的人格指称
  choice: 他从父而出……他必为我作见证
  alternative: 它从父而出……它必为我作见证
  rationale: πνεῦμα虽为中性名词，关系代词也为中性，但后文用阳性ἐκεῖνος，并把作见证的行动归给圣灵；用“他”更准确传达此处的人格性呈现。
- issue: ἐκπορεύεται的神学敏感性
  choice: 从父而出
  alternative: 从父那里来、从父发出
  rationale: 译文保留原文明确陈述的来源和“出来”这一动词色彩，但不借此加入有关圣灵永恒关系或后来信经争论中超出本句的说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真理之灵”“作见证”保留经文称谓和见证意象；破折号标明同位说明及插入的关系从句，使较长的希腊句法在汉语中层次清楚。所有脚注标记均已置于正文相应位置。
