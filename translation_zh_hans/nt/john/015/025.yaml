  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: zh_hans
  text: 但这事发生，是要使写在他们的律法上的话得以应验：“他们无故恨我。”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为形式对应地可译：“但为要使写在他们的律法上的话得以应验。”希腊文在这里省略了主句；正文按上下文补出“这事发生”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“律法”广指犹太圣经；所引的话见《诗篇》35:19；69:4。
    reason: cross_reference
  - marker: c
    text: “无故”也可译作“毫无理由”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 但这是
  rationale: ἀλλά承接上文表示转折；希腊文在此省略主句，中文补出“这是”，使句子自然完整，同时由注释说明原文的省略结构。
- source_word: ἵνα πληρωθῇ
  choice: 要使……得以应验
  rationale: ἵνα加不定过去时被动虚拟语气可表达目的或结果；此译保留两者之间的张力，并延续约翰福音的“应验”主题。
- source_word: ὁ λόγος
  choice: 话
  rationale: 此处指一则具体的经文话语，并非约翰福音序言中作为称号的“道”；“话”符合现代汉语的引文表达。
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: 他们律法上所写的
  rationale: γεγραμμένος为完成时被动分词，表示已经写下而仍见于经文中的内容；“律法上所写”是自然、庄重的中文表达，并保留αὐτῶν“他们的”这一修辞距离。
- source_word: νόμῳ
  choice: 律法
  rationale: 保留希腊文νόμος的字面称谓；本处引自诗篇，因此其范围显然可广指犹太圣经，而不只指摩西五经。
- source_word: ὅτι
  choice: 冒号
  rationale: ὅτι在此引出经文内容；中文用冒号直接引出引语，清楚自然。
- source_word: Ἐμίσησάν με
  choice: 他们……恨我
  rationale: 不定过去时直陈语气在引文中用中文一般过去事件表达即可；汉语动词不需另加时态标记。
- source_word: δωρεάν
  choice: 无故
  rationale: 此处意为没有缘由、无正当理由；“无故”简洁自然，也保留这种仇恨毫无正当根据的含义。
theological_decisions:
- issue: 引自诗篇却称为“他们的律法”
  choice: 正文译作“他们律法”，并在脚注说明“律法”可广指犹太圣经。
  alternative: 直接译作“他们的圣经”或把“律法”仅理解为摩西五经。
  rationale: 原文明确使用νόμος，宜保留“律法”；但引文来自诗篇，表明这里的用法范围较广。这样既不改写原词，也避免把其含义限制得过窄。
- issue: ἀλλ’之后省略的主句
  choice: 为现代汉语的完整和清晰补出“这是”。
  alternative: 按原文省略结构译作“但为要使……得以应验”。
  rationale: 希腊文依赖上文而省略主句；补出“这是”没有增加新的事件或教义判断，只把语境中隐含的指代明说出来。脚注保留较形式对应的译法。
- issue: ἵνα所表达的目的与结果
  choice: 译作“要使……得以应验”。
  alternative: 明确译成纯目的性的“目的是要……”或纯结果性的“结果就……”。
  rationale: 该结构可承载目的与结果色彩；正文不进一步限定，以免在经文应验与人的敌意之间作超出句法的神学裁断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“得以应验”保留经文引用公式的庄重感；“无故恨我”简洁有力。正文补出省略成分以符合汉语习惯，同时用脚注展示希腊文较形式对应的结构。
