  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: zh_hans
  text: 凡是在我里面却不结果子的枝子，他就除去[a]；凡结果子的枝子，他就修剪[b]，使它结更多的果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿走”；有人认为这里的αἴρει意为“举起”。
    reason: alternative_reading
  - marker: b
    text: 译作“修剪”的动词也可意为“洁净”；这里的措辞既符合葡萄树的意象，也与下一节“洁净”的用语相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: 凡……枝子
  rationale: πᾶν与单数名词连用，具有逐一涵盖的分配意义；“凡……枝子”在现代汉语中自然地表达“每一个”的含义。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 直译以保留约翰著作中关系与联合的神学表达，不扩写为“与我相连”或预先引入下文“常在”的措辞。
- source_word: μὴ φέρον καρπὸν
  choice: 不结果子的
  rationale: 用定语结构自然表达希腊语现在分词所描述的状态，同时保留葡萄树的比喻。
- source_word: αἴρει
  choice: 除去
  rationale: 该词可指拿走、除去，也可在某些语境中指举起；此处与对结果子枝子的修剪形成对照，“除去”最符合直接语境，同时以脚注保留“举起”的解释可能。
- source_word: καρπός
  choice: 果子
  rationale: 这是葡萄栽培比喻中自然、通行的对应词，也适合约翰福音的用法。
- source_word: καθαίρει
  choice: 修剪
  rationale: 在葡萄树与枝子的栽培语境中，“修剪”清楚传达园艺动作；该动词也有“洁净”之义，并与下一节“干净”形成词语呼应，故在脚注中说明。
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: 使它结更多的果子
  rationale: “使”自然表达ἵνα的目的意味，“更多的果子”准确体现πλείονα的比较意义。
- source_word: αὐτό / αὐτὸ
  choice: 它
  rationale: 代词回指中性名词κλῆμα“枝子”；汉语在目的分句中用“它”可使所指清楚。
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: 凡结果子的枝子
  rationale: 希腊语冠词加分词回指前面的κλῆμα；汉语补出“枝子”以保持清楚且形成平行结构。
theological_decisions:
- issue: 首个分句中αἴρει的含义
  choice: 他就除去
  alternative: 他就拿走；他就举起
  rationale: 上下文将园丁对不结果子枝子的处理，与对结果子枝子的修剪并列对照。“除去”最直接地保留这种对照，却不进一步断定有关背道、得救或坚忍的教义含义；“举起”作为确有其说的词义解释在脚注中保留。
- issue: καθαίρει的栽培动作与洁净含义
  choice: 修剪
  alternative: 洁净；清理
  rationale: 主文本优先呈现葡萄园意象中的园艺动作，同时以脚注保留其“洁净”语义及与下一节καθαροί的文字联系，避免丢失约翰有意形成的呼应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我里面”保留约翰式表达；“除去”与“修剪”保持两个分句的鲜明对照。所有脚注标记均已置于正文相应词语之后。
