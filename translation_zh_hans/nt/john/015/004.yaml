  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: zh_hans
  text: 你们要常在我里面[a]，我也在你们里面。枝子若不常在葡萄树上，凭自己就不能结果子；同样，你们若不常在我里面，也不能结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常在”也可译作“住在”或“留在”。原词含有持续停留、住下或保持关系的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: 常在
  rationale: μένω在本段反复出现，表达持续存留、住在并维持关系。“常在”简洁自然，也保留约翰福音中持续联合的意象；三处采用同一译词以显明重复。
- source_word: ἐν ἐμοί
  choice: 在我里面
  rationale: 保留ἐν的空间隐喻和联合意味，不弱化为仅仅“与我同在”。
- source_word: κἀγὼ ἐν ὑμῖν
  choice: 我也在你们里面
  rationale: 原文省略动词，译文也不补入“就常在”或“将住在”，从而保留简练表达及其语法上的开放性。
- source_word: τὸ κλῆμα
  choice: 枝子
  rationale: 在葡萄树比喻中指从树干长出的枝条；“枝子”清楚、通俗，并与传统中文圣经用语相通。
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: 不能结果子
  rationale: 自然表达能力上的不可能，并保留农业比喻。
- source_word: ἀφ’ ἑαυτοῦ
  choice: 凭自己
  rationale: 表达枝子不能以自身为来源、独立结果；比直译“从自己”更符合现代汉语。
- source_word: ἐν τῇ ἀμπέλῳ
  choice: 在葡萄树上
  rationale: 汉语描述枝子与树的连接通常说“在树上”；仍保留葡萄树与枝子的比喻，不另加“连于”等解释性措辞。
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: 同样……也不能结果子
  rationale: 承接前句的οὐ δύναται与καρπὸν φέρειν，把希腊文省略的谓语在汉语中补出，使比较完整自然。
theological_decisions:
- issue: μένω在门徒与耶稣联合语境中的译法
  choice: 常在
  alternative: 住在；留在
  rationale: “常在”兼顾持续性、关系性与内住意象，不把经文缩减为地理上的停留，也不额外界定这种联合的教义机制。
- issue: κἀγὼ ἐν ὑμῖν的省略结构
  choice: 我也在你们里面
  alternative: 我也常在你们里面；我就常在你们里面
  rationale: 希腊文没有明说动词的时态或语气。保留省略，可避免把它明确化为命令的补语、条件结果或将来的应许。
- issue: 末句省略谓语的处理
  choice: 补出“也不能结果子”
  alternative: 同样，你们若不常在我里面，也不能
  rationale: 末句从前文承接“不能结果子”。汉语若只说“也不能”会显得悬空，因此补出已明确出现的谓语，不增加新的神学内容。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。首句保留原文简洁的相互内住表达；后半句适度调整语序并补出末句省略的“结果子”，以符合现代汉语，同时维持葡萄树与枝子的核心比喻。
