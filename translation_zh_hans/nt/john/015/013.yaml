  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: zh_hans
  text: 没有人有比这更大的爱：就是人[a]为[c]自己的朋友舍弃自己的生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”对应希腊语的不定单数主语，也可译作“有人”或“一个人”。
    reason: lexical_alternative
  - marker: b
    text: “生命”所译的希腊语psychē也可指“灵魂”或“自己”；这里指人在死亡中舍弃自己的生命。
    reason: lexical_alternative
  - marker: c
    text: “为”所译的希腊语hyper也可译作“为了”“为了……的缘故”或“替”。正文未把它进一步限定为“代替”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: 比这更大的爱
  rationale: 保留比较结构；“这”向后指向冒号后的具体说明，在现代汉语中自然清楚。
- source_word: οὐδεὶς ἔχει
  choice: 没有人有
  rationale: 直接表达否定的拥有结构，同时与原文语序和普遍性相符。
- source_word: ἵνα
  choice: 就是
  rationale: 此处引出并说明“这”所指的爱，而非主要表达目的；“就是”能自然体现解释性关系。
- source_word: τις
  choice: 一个人
  rationale: 原文为不定单数主语；“一个人”保留单数和泛指意义，不限定性别。
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: 舍弃生命
  rationale: ψυχή在此指人在死亡中交出的生命；“舍弃生命”表达τίθημι与ψυχή搭配时主动牺牲生命的含义。汉语无需重复所有格，也不会产生归属歧义。
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: 为自己的朋友
  rationale: “为”保留ὑπέρ的受益、代表之意而不把它限定为严格的替代关系；“自己的”明确保留原文所有格。
theological_decisions:
- issue: ψυχή在自我牺牲语境中的含义
  choice: 译为“生命”
  alternative: “灵魂”或“自己”
  rationale: 本节所说的是为他人而死的具体行动；“生命”符合上下文，又不引入原文并未着重表达的身灵二分。
- issue: ὑπέρ与牺牲之爱的关系
  choice: 译为“为”
  alternative: “为了”“替”或“代表”
  rationale: ὑπέρ可包含受益或代表的意味，也可能产生替代性的神学回响；正文采用范围较宽的“为”，避免把本节单独能够确定的意义说得过窄。
- issue: ἵνα从句的功能
  choice: 以“就是”引出对“这爱”的说明
  alternative: 译作目的关系“为了”或结果关系“以致”
  rationale: 这里的从句主要界定前面的“这”是什么；解释性译法保留句子的逻辑重点。
translation_notes:
  register: 采用庄重而通行的现代书面汉语。“舍弃生命”比口语化表达更适合耶稣教导的语体，同时普通读者容易理解；冒号清楚呈现后半句对“这”所作的解释。
