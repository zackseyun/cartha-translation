  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: zh_hans
  text: 我把这些事吩咐你们，是要你们彼此相爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我把这些事吩咐你们：你们要彼此相爱。”希腊语中以ἵνα引出的从句，既可表示目的，也可近似说明所吩咐的内容。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示代词的形式，也自然地回指上文耶稣所说的各项教导。
- source_word: ἐντέλλομαι
  choice: 吩咐
  rationale: 该动词表示命令、嘱咐；“吩咐”在现代汉语中自然、庄重，并保留耶稣话语的权威性。希腊语现在时在此不必机械译成“正在吩咐”。
- source_word: ὑμῖν
  choice: 你们
  rationale: 明确反映第二人称复数；“把这些事吩咐你们”符合现代汉语表达。
- source_word: ἵνα
  choice: 是要
  rationale: 自然表达目的或预期结果，同时不把句法直接改写成一个独立命令。
- source_word: ἀγαπᾶτε
  choice: 相爱
  rationale: 在ἵνα引导的从句中表达彼此施行爱；汉语无需另加情态词来标示虚拟语气。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达群体成员之间相互的行动，并与“相爱”构成自然、庄重的固定搭配。
theological_decisions:
- issue: 命令与ἵνα从句之间的关系
  choice: 译作目的或预期结果：“是要你们彼此相爱”
  alternative: 可近似理解为命令的内容：“我把这些事吩咐你们：你们要彼此相爱。”
  rationale: ἵνα通常引出目的或结果，但在约翰文体中有时接近说明命令内容。正文保留目的色彩，脚注说明另一种可能，避免消除原文的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把……吩咐你们”兼顾原文中“这些事”的前置强调与汉语自然语序；不以进行体硬译希腊语现在时。
