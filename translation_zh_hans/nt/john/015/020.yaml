id: JHN.15.20
reference: John 15:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A slave is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: zh_hans
  text: 你们要记住我对你们说过的话：“奴仆[a]不能大过主人。”他们若迫害了我，也会迫害你们；他们若遵守了我的话[b]，也会遵守你们的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”所译的希腊词也可译作“奴隶”或“仆人”；这里与“主人”相对，着重表达从属地位。
    reason: lexical_alternative
  - marker: b
    text: “遵守了我的话”也可译作“持守了我的话”或“听从了我的话”；在约翰福音中，这一说法可包括接受耶稣的信息并照着实行。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: 要记住
  rationale: 现在时主动命令语气，要求门徒持续把耶稣的话牢记在心；“要记住”自然地保留了命令语气。
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: 我对你们说过的话
  rationale: 此处 λόγος 指耶稣先前所说的那句话；“说过的话”在现代汉语中自然，也清楚回指下文引语。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 与 κύριος 构成身份和权柄不对等的对应关系。“奴仆”既保留受主人支配的从属地位，也比单用“仆人”更能传达原词力度；脚注注明可译选择。
- source_word: μείζων
  choice: 大过
  rationale: 保留比较级的宽泛含义，既可涉及身份，也可涉及地位和权柄，不把意义收窄为“更重要”。
- source_word: κυρίου
  choice: 主人
  rationale: 在奴仆与 κύριος 的社会关系中指掌权的主人，而非作为神圣称号的“主”。
- source_word: ἐδίωξαν / διώξουσιν
  choice: 迫害了／会迫害
  rationale: 上下文涉及世人敌视耶稣及其门徒，διώκω 在此表达迫害，而非中性的追赶。
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: 遵守了／会遵守
  rationale: 同一动词在两个平行分句中采用同一译词，以保留修辞对应；“遵守……的话”可涵盖接受教导并依之而行，脚注提示其语义幅度。
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: 我的话……你们的话
  rationale: 保留 λόγος 的词汇联系，以及耶稣的话与门徒所传之话之间的平行关系。
theological_decisions:
- issue: δοῦλος 所表达的社会身份
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 格言的论证依赖奴仆低于主人的从属关系。“奴仆”保留这一关系，同时避免把经文只理解为现代雇佣服务关系；脚注保存“奴隶／仆人”的词义范围。
- issue: κύριος 在本句中的含义
  choice: 主人
  alternative: 主
  rationale: 此处是与奴仆配对的普通社会称谓。译作“主人”可准确表达关系，避免误当作基督论称号。
- issue: τηρέω 与“话”的关系
  choice: 遵守
  alternative: 持守；听从
  rationale: 约翰著作中该搭配可兼有接受、守住和顺服教导之意。“遵守”保留顺服层面，但不在正文中进一步限定；脚注说明其语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“要记住”直接有力；格言用“大过”保留简洁的口传色彩。两个条件句保持紧密平行，以呈现原文的修辞结构；标点按现代中文引语规范处理。
