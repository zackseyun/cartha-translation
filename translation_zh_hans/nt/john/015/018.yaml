  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: zh_hans
  text: 如果这个世界恨你们，你们要知道，它在恨你们以前，已经恨我了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它已经先恨我了，在恨你们以前。”希腊文以“首先”与“你们”连用，表达我先于你们被世界恨的时间关系。
    reason: 词义与句法表达的另一种译法
lexical_decisions:
- source_word: κόσμος
  choice: 这世界
  rationale: 保留约翰著作中“世界”的宽广含义及其敌对上帝的语境色彩，不在正文中缩窄为“敌对上帝的人”或扩写为“世界体系”；加“这”使现代汉语表达更自然。
- source_word: μισεῖ
  choice: 恨
  rationale: 用一般现在时意义的“恨”表达条件从句中的普遍或现实情形，不刻意译成进行体。
- source_word: γινώσκετε
  choice: 你们要知道
  rationale: 该形式在形态上可理解为陈述式或命令式；本句语境更自然地支持劝告或命令语气，因此译为“要知道”，同时保留第二人称复数。
- source_word: πρῶτον
  choice: 在……以前
  rationale: πρῶτον 与属格 ὑμῶν 连用，在这里表达时间上的优先；“在恨你们以前”是自然、清楚的现代汉语。
- source_word: μεμίσηκεν
  choice: 已经恨……了
  rationale: 以“已经……了”传达希腊文完成时所表示的先前发生且对当前仍有意义的状态。
- source_word: ἐμὲ ... ὑμῶν
  choice: 在恨你们以前，已经恨我了
  rationale: 清楚表达“我”遭恨先于门徒遭恨；汉语语序自然，并以“我”作动词宾语保留对比重点。
theological_decisions:
- issue: 约翰神学中 κόσμος 的含义
  choice: 正文保留“这世界”，不作解释性扩写
  alternative: 敌对上帝的世人／世界体系
  rationale: 本节语境中的“世界”带有敌对耶稣及其门徒的负面色彩，但原文本身仍使用含义宽广的 κόσμος。保留“这世界”可维持其神学张力，避免把所指范围过早限定。
- issue: γινώσκετε 的语气
  choice: 按命令式或劝告语气译为“你们要知道”
  alternative: 按陈述式译为“你们知道”
  rationale: 希腊文形式本身可有两种分析；条件句之后的论述推进更适合劝告语气。此选择不改变核心神学含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这世界”保留约翰用语的广度；代词“它”承接“这世界”，避免重复，同时没有把 κόσμος 直接人格化解释为某一特定群体。
