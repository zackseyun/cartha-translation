  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: zh_hans
  text: 你们若常在我里面，我的话也常在你们里面[a]，无论你们想要什么[b]，就求吧，必为你们成就。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们若住在我里面……我的话也住在你们里面。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“凡你们所愿的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: 常在 / 常在
  rationale: μένω在约翰著作中是重要的反复用词，表示持续停留、持守关系。译作“常在”既保留持续性，也符合现代汉语的庄重表达；两处采用同一译词，以保留原文的重复。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 直译介词ἐν，以保留约翰福音中联合与关系的空间性表达，不弱化为“与我同在”。
- source_word: τὰ ῥήματά μου
  choice: 我的话
  rationale: ῥήματα指所说的话或言语；“我的话”简洁自然，并保留复数整体所表达的耶稣言语。
- source_word: ὃ ἐὰν θέλητε
  choice: 无论你们想要什么
  rationale: 该结构表示意愿对象不受限定。“无论你们想要什么”是自然的现代汉语，也不在原文之外增添条件。
- source_word: αἰτήσασθε
  choice: 只管求
  rationale: 这是表示请求的命令式；“求”适合祈求语境，“只管”使汉语命令句自然有力，但不改变请求的内容。
- source_word: γενήσεται ὑμῖν
  choice: 就会为你们成就
  rationale: γίνομαι在这里表示事情得以发生或实现。结合祈求得到回应的语境，“为你们成就”比生硬的“为你们发生”更自然，同时保留结果含义。
theological_decisions:
- issue: 耶稣关于祈求之应许的条件结构
  choice: 明确保留“若……就……”的条件关系，把祈求蒙应允置于门徒常在耶稣里面、耶稣的话也常在他们里面这一前提之下。
  alternative: 采用较自由的表达，使这项应许听起来不附带条件。
  rationale: 希腊文以ἐὰν引出清楚的条件从句；译文不把应许扩大为无条件的保证，也不额外解释这些条件如何限制所求之事。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“常在”保留约翰福音的关键词及两次重复；句式清晰呈现条件、命令和应许。所有脚注标记均置于正文对应位置。
