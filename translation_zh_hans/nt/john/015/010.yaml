id: JHN.15.10
reference: John 15:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: zh_hans
  text: 你们若遵守我的命令，就会常在我的爱里，正如我遵守了我父的命令，并且常在他的爱里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: 若
  rationale: 引出带虚拟语气的条件从句；“若”自然、庄重，并保留真实的条件关系。
- source_word: ἐντολάς
  choice: 命令
  rationale: 表达具有权威的吩咐；现代汉语中“命令”比“诫命”更直接，也不把所指限缩为某套特定律法条文。
- source_word: τηρήσητε / τετήρηκα
  choice: 遵守 / 遵守了
  rationale: 在命令这一搭配中，τηρέω指忠实持守、践行；统一译作“遵守”以保留原文的词语呼应。后者用“了”表达完成时所指向的既成且持续相关的行动。
- source_word: μενεῖτε / μένω
  choice: 常在
  rationale: 保留约翰福音中μένω反复出现的关系性持续意象；“常在”比单纯“留在”更自然，也使两处用词一致。
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: 在我的爱里 / 在他的爱里
  rationale: 保留介词短语所呈现的关系领域意象及两句之间的平行结构，不改写为“继续蒙爱”等解释性表达。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚标明门徒与耶稣之间的对应和榜样关系。
- source_word: τοῦ πατρός μου
  choice: 我父的
  rationale: 自然表达所属关系；“我父”在上下文中明确指耶稣的父，并保持现代、庄重的称谓。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 自然回指紧邻的“我父”，同时保留原文代词和两部分的平行。
theological_decisions:
- issue: 遵守命令与常在耶稣之爱里的关系
  choice: 按原文直译为真实的条件关系
  alternative: 将其解释为靠顺服赚取爱，或弱化为顺服仅是毫无条件效力的外在证据
  rationale: 经文确实以条件句连接遵守与常在，并以耶稣自己的遵守作为对应；但本节没有说明功德、救恩是否丧失或确据等系统神学问题，因此不在译文中替它作出裁决。
- issue: ἀγάπη的译法
  choice: 爱
  alternative: 慈爱；仁爱
  rationale: “爱”是现代汉语中自然且范围适当的对应词，也能在两处保持明确的词汇联系。
- issue: “我的爱／他的爱”的语义方向
  choice: 保留所有格本身的开放性
  alternative: 明确解释为“我对你们的爱”或“你们对我的爱”
  rationale: 希腊语所有格可让读者注意关系性的爱之领域，本节未用更明确结构限定其主客观方向；译文不擅自消除这一含义张力。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。以“常在”承接约翰福音μένω的主题性重复；避免古奥的“住在……里面”，也避免解释性过强的意译。全节保持条件、比较和两组平行结构。
