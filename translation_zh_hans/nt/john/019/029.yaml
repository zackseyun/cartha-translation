source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: zh_hans
  text: 那里放着一个盛满酸酒[a]的器皿。于是，他们把一块吸满酸酒的海绵放在牛膝草[b]上，送到他嘴边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“醋”。希腊语可指酸酒或醋；这里很可能是当时士兵饮用的酸酒。
    reason: lexical_alternative
  - marker: b
    text: 或译“牛膝草枝上”，也可理解为“用牛膝草”。希腊语只说“在／用牛膝草”，具体情形有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: 器皿
  rationale: 这是表示器具或容器的通用词；“器皿”自然、庄重，同时不擅自限定为罐或坛。
- source_word: ἔκειτο
  choice: 放着
  rationale: 保留未完成时所呈现的静态场景，现代汉语中“那里放着”比“躺着”更适合描述器皿。
- source_word: ὄξους
  choice: 酸酒
  rationale: ὄξος可指酸酒或醋；本处很可能是士兵饮用的廉价酸酒。“酸酒”既符合历史语境，也保留其作为饮料的意思。
- source_word: μεστόν / μεστὸν
  choice: 盛满／吸满
  rationale: 同一词在不同受饰对象上按汉语搭配分别译作“盛满”和“吸满”，准确表达器皿与海绵都充满酸酒。
- source_word: σπόγγον
  choice: 一块……海绵
  rationale: “海绵”是直接对应词；量词“一块”符合现代汉语习惯。
- source_word: οὖν
  choice: 于是
  rationale: 在叙事中表示后续或相承结果，“于是”自然且不过度强化逻辑推论。
- source_word: ὑσσώπῳ
  choice: 在牛膝草上
  rationale: 与格可表示所附着之物或手段；正文采取贴近原文的“在……上”，不把原文未明说的“枝”加入正文。
- source_word: περιθέντες
  choice: 放在
  rationale: 该不定过去时分词表示先于主要动作发生的放置或附着动作；汉语按动作顺序自然表达。
- source_word: προσήνεγκαν
  choice: 送到
  rationale: 该动词表示拿近、带到或呈上；“送到他嘴边”清楚表现朝向嘴部的动作，又不加入“喂”等解释。
- source_word: αὐτοῦ τῷ στόματι
  choice: 他嘴边
  rationale: 与格表示动作所趋向的部位；“嘴边”符合汉语对物体被送近嘴部的自然表达。
theological_decisions:
- issue: ὑσσώπῳ可能具有的历史及礼仪象征
  choice: 正文保留“牛膝草”，不解释其象征意义
  alternative: 译作“牛膝草枝”，或弱化为普通的“草茎／苇秆”
  rationale: 约翰的措辞可能令人联想到逾越节或洁净礼，但本节没有明说这种象征。保留“牛膝草”既忠于词义，也保留可能的神学回响，而不把解释写入正文。
- issue: ὑσσώπῳ的句法图景
  choice: 译作“放在牛膝草上”并以脚注保留“用牛膝草”的可能
  alternative: 明确译作“放在牛膝草枝上”或“用牛膝草托着”
  rationale: 希腊语与格本身可表达附着处或工具，具体操作方式有争议，故不在正文中消除这种歧义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“器皿”避免过度限定容器种类；“酸酒”比“醋”更能让普通读者理解这是可饮用的廉价酸酒。正文保留牛膝草相关句法的含混，并用脚注说明其他可能。
