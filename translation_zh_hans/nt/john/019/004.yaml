  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: zh_hans
  text: 彼拉多又走到外面，对他们说：“看，我把他带出来给你们，好让你们知道，我找不到任何控告他的理由[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在他身上找不到任何过错。”原文可指过错，也可指司法上的控告、控告理由或案件根据；本节处于审讯语境，因此正文采用司法性的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: 走到外面
  rationale: 动词与方位副词合用，明确表示从里面到外面的移动；“走到外面”符合现代汉语叙事习惯。
- source_word: πάλιν
  choice: 又
  rationale: 表示动作重复；“又”在汉语叙事中简洁自然。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时，现代汉语叙事用“说”即可自然表达，不必刻意标明时态。
- source_word: Ἴδε
  choice: 看
  rationale: 这是引起听者注意的命令语；“看”简明、自然，也保留直接讲话的力度。
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: 我把他带出来交给你们
  rationale: ἄγω可表示“带领、带来”；此处是彼拉多将耶稣带到众人面前。“交给你们”体现间接受词ὑμῖν所表达的面向或交付关系，但不表示正式移交处置权。
- source_word: ἵνα γνῶτε
  choice: 好让你们知道
  rationale: 保留ἵνα所表达的目的意味，并以自然现代汉语呈现。
- source_word: οὐδεμίαν αἰτίαν
  choice: 没有什么罪状
  rationale: αἰτία在审讯语境中指控罪的理由、罪名或案件根据；“罪状”既保留司法含义，也适合彼拉多宣告查无可控之罪的语境。
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: 我查不出他有什么
  rationale: “查不出”符合审讯者作出司法判断的场景，并自然表达“在他身上找不到”的希腊文结构。
theological_decisions:
- issue: 彼拉多对耶稣所作判断的司法性质
  choice: 我查不出他有什么罪状
  alternative: 我在他身上找不到什么过错
  rationale: 上下文是罗马长官审讯案件，αἰτία在此主要具有司法意义。译文表达彼拉多找不到可成立的控罪依据，但不将这句话扩展为超出本节范围的系统神学宣告。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。直接引语中的“看”保留现场感；司法措辞明确但不过度法律术语化。
