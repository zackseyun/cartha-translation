source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: zh_hans
  text: 于是，他们彼此说：“我们不要把它撕开，不如为它抽签[a]，看它归谁。”为要应验经上所说的话：“他们彼此分了我的衣服，又为我的衣裳抽签。”[b]于是士兵们就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抽签”或译“拈阄”。
    reason: lexical_alternative
  - marker: b
    text: 引自《诗篇》22:18。
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: 撕开
  rationale: 该动词表示撕裂或分开；用于衣物时，“撕开”自然清楚，也符合上下文。
- source_word: αὐτόν
  choice: 它
  rationale: 该代词在希腊语中虽为阳性，但上下文所指是前文的里衣，因此汉语用“它”。
- source_word: λάχωμεν
  choice: 抽签
  rationale: 这里指用阄签决定衣物归谁；“抽签”是现代汉语中最易懂的表达。
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: 为它抽签，看它归谁
  rationale: 既保留“为它”的对象关系，也以自然汉语表达抽签是为了决定所有权。
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: 这是为要使经上所说的话得以应验
  rationale: 保留约翰的应验公式及ἵνα所含的目的意味，同时不进一步解释神的旨意与人的行动之间的机制。
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: 经上所说的话
  rationale: 在此指神圣经文，并引出后面的引文；合并表达比逐词直译更符合现代汉语。
- source_word: Διεμερίσαντο
  choice: 他们……分了
  rationale: 准确表达把衣物分配给多人，且适合诗篇引文的简洁语气。
- source_word: τὰ ἱμάτιά μου
  choice: 我的衣服
  rationale: 泛指多件衣物；“衣服”自然、通俗。
- source_word: ἑαυτοῖς
  choice: 彼此
  rationale: 表达士兵在自己人中间分配衣物的反身、分配含义。
- source_word: τὸν ἱματισμόν μου
  choice: 我的衣裳
  rationale: 以“衣裳”与前面的“衣服”作轻微词汇区分，同时保持引文庄重而可懂。
- source_word: ἔβαλον κλῆρον
  choice: 抽签
  rationale: 表达投阄、以签决定归属的动作；现代汉语不必刻意标出希腊语κλῆρον的单数。
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: 士兵们就这样做了
  rationale: 简洁保留叙述的总结与承接功能，不额外加入“果然”等解释性语气。
theological_decisions:
- issue: 士兵的行动与经文应验在ἵνα ἡ γραφὴ πληρωθῇ中的关系
  choice: 译作“这是为要使经上所说的话得以应验”，保留目的式应验表述。
  alternative: 可译作“这样，经上的话就应验了”，把ἵνα偏向结果来表达。
  rationale: 原文采用约翰常见的ἵνα应验公式。所选译法保留经文所陈述的应验关系，却不进一步规定神圣旨意与士兵自主行动之间的哲学机制。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“抽签”比“拈阄”更适合普通现代读者；诗篇引文用“衣服／衣裳”保留原文两个衣物词之间的轻微区别。
