  source_fidelity: “这事”并非希腊文的明示内容；虽可由上下文推知所见为十字架现场的事件，但在此节主文中补入会略微扩展原文。另，“真话”在现代汉语中偏口语，且较适合单句陈述；ἀληθῆ λέγει在此更稳妥地译为“他所说的是真实的”。其余句法关系、完成时见证的既成效力、目的从句及对见证人身份的保留均基本忠实。
  naturalness: 原译整体通顺、庄重。“那看见的人”比“那看见这事的人”更凝练，且不减少原文信息。“那一位”能在自然现代汉语中保留ἐκεῖνος的指示性和强调，避免“那人”可能带有较强距离感或略显生硬的问题。
  terminology: “作了见证／见证”准确对应μεμαρτύρηκεν／μαρτυρία，并保留词汇呼应；“真实的”适切表达ἀληθινή。将“自己所说的是真话”改为“他所说的是真实的”，使语体更适合经文，也不额外强化反身关系。脚注对πιστεύητε可能的持续意味说明准确。
