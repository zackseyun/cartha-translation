  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: zh_hans
  text: 那看见的人已经作了见证，他的见证是真实的；那一位知道他所说的是真实的，为要使你们也相信。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要使你们也继续相信。”这里的现在时虚拟式可能带有持续的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: 那看见这事的人
  rationale: 保留实词化分词和指示意味；完成时强调已经发生且仍具意义的亲眼所见。“这事”依上下文自然补出，但不把此人直接定名为“目击者”。
- source_word: μεμαρτύρηκεν
  choice: 已经作了见证
  rationale: 以“已经……了”表达完成时所指的既成见证及其持续效力，并与名词“见证”保持词汇呼应。
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: 他的见证是真实的
  rationale: 直接表达见证的真实性和可靠性，不收窄为仅仅“真诚”。
- source_word: ἐκεῖνος
  choice: 那人
  rationale: 保留指示代词的强调色彩，并避免只译作“他”而削弱原文措辞；同时不判定其具体身份。
- source_word: οἶδεν
  choice: 知道
  rationale: οἶδα虽具完成形式，却按现在时状态意义理解，普通话以“知道”最自然。
- source_word: ἀληθῆ λέγει
  choice: 自己所说的是真话
  rationale: 自然传达中性复数形容词与λέγει构成的“说真实的话”之义，并借“自己”明确主语回指而不增加身份判断。
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: 为要使你们也相信
  rationale: “为要使”清楚表达ἵνα的目的意义，“也”保留καί对读者的包含或强调；主文不强加持续体含义。
theological_decisions:
- issue: 本节强调代词所指的人是谁
  choice: 保留第三人称“那看见这事的人”和“那人”，不指明其身份
  alternative: 明确解释为叙述者／蒙爱的门徒自指，或解释为另一位目击者
  rationale: 希腊文没有明说见证人的身份；译文保留原有指称方式和可能的自指庄重语气，不替文本消除歧义。
- issue: πιστεύητε的体貌意味
  choice: 相信
  alternative: 继续相信
  rationale: 现在虚拟式可能含持续意味，但在约翰文献语境中也可作不标明起始或持续的目的表达；主文采用中性译法，持续相信的可能性置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作了见证／见证”保留原文动词与名词的呼应；分号呈现各分句之间紧密而递进的关系。脚注标记置于所注释的“相信”所在句末。
