    rationale: ὁ ἑωρακὼς仅说“那看见的人／那位看见者”，没有宾语。“这事”虽由上下文可理解，却是主文未明说的补足；删除可更严格保留原文的表达与指称开放性。
  - severity: low
    issue: “自己所说的是真话”语体略口语且稍强化反身表达
    rationale: ἀληθῆ λέγει意为“说真实的事／所说的是真实的”。“真话”较口语；“自己”不是原文反身代词所要求。改为“他所说的是真实的”更自然、庄重且贴近原文。
