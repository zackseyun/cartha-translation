- from: 那看见这事的人已经作了见证，他的见证是真实的；那人也知道自己所说的是真话，为要使你们也相信。[a]
  to: 那看见的人已经作了见证，他的见证是真实的；那一位知道他所说的是真实的，为要使你们也相信。[a]
  rationale: 修订仅删除原文未明示的“这事”，并调整“真话／自己”的措辞，使中文语体更庄重、指称更开放，同时保留完成时见证的表达、ἐκεῖνος的强调、ἵνα目的关系以及πιστεύητε可能具有持续意味的脚注。
