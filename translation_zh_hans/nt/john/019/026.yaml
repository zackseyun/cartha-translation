  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: zh_hans
  text: 耶稣看见他的母亲和他所爱的那位门徒站在旁边，就对母亲说：“妇人[a]，看，你的儿子！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“女人”或“妇人”；这是尊重的称呼，并非粗鲁或不敬。
    reason: 说明Γύναι的字面形式及其尊重的语用语气，避免现代中文读者误解。
lexical_decisions:
- source_word: οὖν
  choice: 就
  rationale: 承接前文并推动叙事；现代汉语用“就”自然表达由所见而引出的行动，不必生硬译作“所以”。
- source_word: ἰδὼν
  choice: 看见
  rationale: 将不定过去时分词按语境译为时间性动作，与后面的“就……说”形成自然顺序。
- source_word: τὴν μητέρα
  choice: 母亲
  rationale: 希腊文用定冠词而无物主代词；中文在主语为耶稣且所指清楚时，可自然省略“他的”。
- source_word: τὸν μαθητὴν
  choice: 那门徒
  rationale: “那”体现定冠词所指的特定门徒，并符合约翰叙事中已可识别的人物。
- source_word: παρεστῶτα
  choice: 站在旁边
  rationale: 表达该门徒当时站在近旁、在场的状态，保留场景的空间感。
- source_word: ὃν ἠγάπα
  choice: 他所爱的
  rationale: 忠实保留关系从句及其含蓄指代，不擅自将主语明说为“耶稣”。
- source_word: λέγει
  choice: 说
  rationale: 希腊文为历史现在时；现代汉语叙事通常不以动词形态区分时态，直接译“说”既自然又保持叙事鲜明。
- source_word: Γύναι
  choice: 母亲
  rationale: γύναι字面为“女人／妇人”的呼格，但在此是郑重而非粗鲁的称呼。中文当面称母亲为“妇人”容易产生不合原意的疏冷或冒犯感，因此正文按关系和语用译为“母亲”，脚注保留形式对应。
- source_word: ἴδε
  choice: 看
  rationale: 保留指示性命令和郑重引介的作用；现代中文“看”比“看哪”更自然，同时仍能引人注意下文。
- source_word: ὁ υἱός σου
  choice: 你的儿子
  rationale: 直接保留身份关系的宣告，不增译其关系如何成立或其神学含义。
theological_decisions:
- issue: 耶稣以Γύναι称呼马利亚的语气
  choice: 正文译“母亲”，并以脚注说明原文直译及尊重语气
  alternative: 正文译“妇人”或“女人”
  rationale: 原称呼不含不敬；现代汉语“妇人”作为儿子对母亲的直接称呼可能错误传达冷漠或冒犯。“母亲”传达场景中的关系与得体语气，而脚注使读者知道原文并非通常的亲属称谓。
- issue: “你的儿子”所表达关系的性质
  choice: 仅保留耶稣的直接宣告，不加解释
  alternative: 增译为收养、托付或象征性母子关系
  rationale: 本节本身没有明确说明这一关系的全部性质；避免把后续语境或特定神学解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那门徒”保留特指，“站在旁边”呈现场景；引语简洁郑重。脚注标记[a]紧随对应称呼。
