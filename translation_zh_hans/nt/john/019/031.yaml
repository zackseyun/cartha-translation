id: JHN.19.31
reference: John 19:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: zh_hans
  text: 所以，犹太人[a]因为那天是预备日[b]，为了不让尸体在安息日留在十字架上——原来那个安息日是个大日子[c]——就请求彼拉多打断他们的腿，把尸体移走[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在约翰福音的一些语境中可特指犹太当局或领袖。
    reason: 保留Ἰουδαῖοι语境所指的可能范围，避免读者误以为必然指全体犹太人。
  - marker: b
    text: “预备日”指安息日前作预备的那一天。
    reason: 说明παρασκευή作为当时日名的含义。
  - marker: c
    text: “大日子”意思是这个安息日格外重要；也可译作“那个安息日是个大安息日”。
    reason: 解释μεγάλη在此表示特殊重要性，同时保留另一种自然译法。
  - marker: d
    text: “移走”也可译作“取下来”或“带走”。
    reason: 呈现αἴρω在本语境中的词义范围；此处所指的是前文的“尸体”。
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: 所以，犹太人
  rationale: οὖν承接并推进上文，译作“所以”自然。Ἰουδαῖοι本身可指犹太人、犹太地区的人，或在约翰福音特定语境中指犹太当局；正文保留较少解释性的“犹太人”，并用脚注提示语境上的可能范围。
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: 因为那天是预备日
  rationale: παρασκευή在此指安息日前的预备日。“预备日”简洁地保留该术语，脚注补明其含义。
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: 不愿尸体在安息日留在十字架上
  rationale: ἵνα在此表达请求背后的目的；中文用“不愿……留在”自然呈现其意图。τὰ σώματα为复数，直译“尸体”；ἐπὶ τοῦ σταυροῦ译作“在十字架上”。
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: 原来那个安息日是个大日子
  rationale: γάρ说明其急迫原因，译作“原来”。μεγάλη字面为“大”，这里表示该安息日具有特殊重要性；正文保留“大日子”的表达，不把具体原因写入经文。
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: 就请求彼拉多
  rationale: ἐρωτάω在此不是单纯询问信息，而是向掌权者提出请求，故译“请求”比“问”更符合语境。
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: 打断他们的腿
  rationale: κατάγνυμι意为“打断、折断”；希腊文为被动虚拟式，但中文在“请求彼拉多……”结构中采用无明确施事者的主动表达更自然，也不改变谁实际执行这一动作的开放性。
- source_word: καὶ ἀρθῶσιν
  choice: 把他们移走
  rationale: αἴρω可表示拿起、移去或带走。这里的对象由前文尸体及代词承接；“移走”保留其较宽泛的含义，不强行限定为仅仅“从十字架上取下来”。
theological_decisions:
- issue: Ἰουδαῖοι在约翰福音此处的所指
  choice: 正文译“犹太人”
  alternative: 犹太当局／犹太人的领袖
  rationale: 原词的语境所指可能比全体犹太民族更窄，但本节没有明说“领袖”或“当局”。正文避免把解释直接写入经文，脚注提示可能的特指。
- issue: μεγάλη所描述的安息日
  choice: 译为“那个安息日是个大日子”
  alternative: 那个安息日格外重要／那是一个大安息日
  rationale: 保留μεγάλη的字面力度及原文的简洁性，同时以脚注说明它指特别重要的安息日，不进一步裁定其历法或节期关系。
- issue: αἴρω在此处的具体动作
  choice: 译为“移走”
  alternative: 取下来／带走
  rationale: 上下文显然涉及移除被钉者，但动词本身并不只表示“取下”。采用较宽的“移走”，避免把动作范围缩窄。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“预备日”“安息日”“十字架”保留常见圣经术语；破折号对应原文插入的解释句。脚注标记均紧随相关措辞，避免英文咨询层脚注标记错配造成的内容混乱。
