source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: zh_hans
  text: 于是，彼拉多听见这些话，就把耶稣带到外面，在一个叫“石铺地”的地方坐上审判席[a]；这地方用希伯来话[b]叫“加巴大”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让他坐在审判席上。”希腊语动词也可作及物理解，指彼拉多让耶稣坐下；不过在这里，更可能是彼拉多自己坐上审判席。
    reason: alternative_reading
  - marker: b
    text: 这里的“希伯来话”很可能是指当地通行的闪语，或许是亚兰语；约翰福音其他地方也有类似用法。
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事，既表达因前述言论而采取行动，也符合现代汉语叙事习惯。
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: 听见这些话
  rationale: 将不定过去时分词按时间和情境关系自然表达；λόγοι指刚才说出的言语。
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: 把耶稣带到外面
  rationale: 准确表达ἄγω与ἔξω所表示的向外移动，同时不额外限定是牵引还是押送。
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: 坐上审判席
  rationale: 按较自然的句法理解，以彼拉多为主语；βῆμα在此是官员审理案件时所坐的司法席位。希腊语也容许及物理解，故以脚注保留。
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: 那地方叫“石铺地”
  rationale: Λιθόστρωτον字面指以石铺成的地面，用可理解的中文意译；结合前面的移动和就座，中文以地点说明表达更自然。
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: 希伯来话叫“加巴大”
  rationale: 正文保留Ἑβραϊστί的表层称谓，不直接改写为亚兰语；Γαββαθα作为地名音译。δέ在此连接轻微，中文无需另译。
theological_decisions:
- issue: ἐκάθισεν的主语和及物性
  choice: 彼拉多坐上审判席
  alternative: 彼拉多让耶稣坐在审判席上
  rationale: 司法场景和通常的句法理解更支持彼拉多亲自就座审判，但该动词形式也可作及物解释。此歧义可能影响对叙事讽刺意味的理解，因此不在译文体系中抹去，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“审判席”清楚呈现司法语境；“石铺地”保留地名的希腊文含义；“加巴大”按中文圣经地名惯例音译。
