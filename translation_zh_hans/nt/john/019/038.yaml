  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: zh_hans
  text: 这些事以后，来自亚利马太的约瑟向彼拉多请求准许他把耶稣的身体领去。约瑟是耶稣的门徒，却因惧怕犹太人[a]，一直暗中作门徒。彼拉多准许了。于是约瑟就来把耶稣的身体领去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本处语境，也可更具体地理解为“犹太当权者”。约翰常用“犹太人”指反对耶稣的人，并非不加区别地指所有犹太人。
    reason: 说明Ἰουδαίων的语境所指，避免将经文误解为对整个犹太民族的概括。
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 这些事以后
  rationale: 保留复数“这些事”和约翰叙事中的时间推进，同时符合现代汉语表达。
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: 来自亚利马太的约瑟
  rationale: 直接体现ἀπό所表达的来源地点，比传统的“亚利马太人约瑟”更贴近原文结构。
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ
  choice: 他是耶稣的门徒，却……一直隐瞒着这件事
  rationale: 将分词结构拆为自然的汉语句子；“这件事”指其门徒身份。“一直隐瞒”传达完成时分词所表示的持续结果状态。
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: 因惧怕犹太人
  rationale: 紧贴介词短语，并保留Ἰουδαίων本身具有的语境张力；以脚注说明其在本处可能的具体所指。
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: 准许他取走耶稣的身体
  rationale: 汉语中将请求的内容自然表达为“请求……准许”；“取走”准确表达αἴρω在安葬语境中的移走之意。
- source_word: καὶ ἐπέτρεψεν ὁ Πιλᾶτος
  choice: 彼拉多准许了
  rationale: 清楚表达ἐπιτρέπω的许可含义，并保留原文简洁的独立陈述。
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: 于是他来取走了耶稣的身体
  rationale: “于是”兼顾οὖν的承接和结果意味；重复“取走”保持与前文αἴρω的词汇呼应。为避免汉语中“他的身体”出现指代歧义，明确为“耶稣的身体”。
theological_decisions:
- issue: 约翰福音中τῶν Ἰουδαίων在本节的所指
  choice: 正文译为“犹太人”，脚注说明在本语境中更具体地可能指反对耶稣的犹太宗教当权者。
  alternative: 正文直接译作“犹太当权者”或“犹太领袖”。
  rationale: 原文使用较宽泛且在约翰福音中富有语境性的Ἰουδαῖοι。正文保留其字面范围和解释张力，不将具体所指无声地限定；脚注则防止读者误以为这是对所有犹太人的笼统指责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将较长的希腊语主句拆分，以避免汉语句法拖沓，但保留叙事顺序、隐瞒门徒身份的持续状态，以及“犹太人”一词的原文张力。所有脚注标记均已置于正文对应位置。
