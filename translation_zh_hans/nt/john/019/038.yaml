  naturalness: “一直隐瞒着这件事”在现代汉语中指代不够明确，且不如“暗中作耶稣的门徒”自然凝练。“于是他来取走了……”也稍显生硬；改为明确主语并用“把……领去了”，叙事更顺畅。
  terminology: 人名、地名及“门徒”“彼拉多”均恰当。“犹太人”保留原文Ἰουδαίων的表层表达，配合脚注限定本处语境，处理审慎。用“领去”表达遗体的移取，在此安葬语境中合适。
