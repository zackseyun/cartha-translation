  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: zh_hans
  text: 可是，他们来到耶稣那里[a]，见他已经死了[b]，就没有打断他的腿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰随后把这件事与圣经的话联系起来：“他的骨头一根也不可折断。”（约19:36；另参出12:46；民9:12；诗34:20）
    reason: cross_reference
  - marker: b
    text: 或译：“见他早已死去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: 可是，他们来到耶稣那里
  rationale: 将分词结构自然地译为时间背景；“可是”体现δέ与上文士兵打断另外两人腿骨之举的轻微转折，“来到耶稣那里”保留朝向耶稣的动作。
- source_word: ὡς εἶδον
  choice: 见
  rationale: 在此引出士兵随后不打断其腿所依据的观察；简洁的“见”兼顾时间情境和因由关系，不作过度解释。
- source_word: ἤδη
  choice: 已经
  rationale: 表明士兵来到时，耶稣的死亡已经发生。
- source_word: τεθνηκότα
  choice: 死了
  rationale: 该完成时分词既指死亡已经发生，也呈现死亡后的状态；“已经死了”在现代汉语中自然地保留这两方面。
- source_word: οὐ κατέαξαν
  choice: 没有打断
  rationale: κατάγνυμι在这里指把腿或腿骨打断；“打断”准确、自然，并符合上下文中的处刑行为。
- source_word: αὐτοῦ τὰ σκέλη
  choice: 他的腿
  rationale: σκέλη直接指双腿；汉语自然说“打断他的腿”，无需在正文中增添“骨头”。
theological_decisions:
- issue: 耶稣的腿没有被打断与经文应验之间的潜在联系
  choice: 正文只陈述士兵没有打断耶稣的腿，不提前加入“应验”或改译成“骨头”。
  alternative: 将“腿”译作“腿骨”，以凸显与19:36“不折断他一根骨头”的联系。
  rationale: 约翰福音19:36才明确指出经文应验。本节应保持叙事本身的表达，而相关的正典联系可在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接上文形成轻微对比；“打断他的腿”是自然汉语，也忠实保留σκέλη的通常含义。
