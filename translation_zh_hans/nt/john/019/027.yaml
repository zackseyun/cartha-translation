  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: zh_hans
  text: 接着，他对那门徒说：“看，你的母亲！”从那时起，那门徒就把她接到自己家里去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: 看
  rationale: 保留指示和引人注意的语气；现代汉语中自然直接，也不额外加入“这就是”等解释。
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: 从那时起
  rationale: ὥρα在此可指当时、时刻；译作“从那时起”符合上下文，也比机械的“从那一小时起”自然。
- source_word: ἔλαβεν ... αὐτὴν
  choice: 接她
  rationale: 表达门徒接纳并照料她的行动，同时避免把原文未明说的具体安排过度展开。
- source_word: εἰς τὰ ἴδια
  choice: 到自己家里
  rationale: 该短语字面可指“到属于自己的地方/事物中”，在此语境指门徒自己的住处或家庭范围；“到自己家里”清楚自然，并与叙事含义相符。
theological_decisions:
- issue: 耶稣的话是否明确建立属灵母子关系
  choice: 直译为“看，你的母亲”
  alternative: “从今以后，她就是你的母亲”
  rationale: 原文只以简洁的名词句作出指示，没有“从今以后”或“就是”等明示成分；保留其简洁和解释空间，不额外规定其神学含义。
- issue: 门徒接纳马利亚的范围
  choice: “接她到自己家里去了”
  alternative: “把她当作自己的家人接纳了”
  rationale: 后者把关系性质解释得更明确；本译文保留原文εἰς τὰ ἴδια所容许的家庭、住处或个人所属范围，不扩展为特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“接着”承接上一句；“那门徒”保持约翰叙事中的指称方式。引语简短有力，尽量再现原文语气。
