  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: zh_hans
  text: 他自己背着十字架出去，到了那叫作“骷髅地”的地方；这个地方用希伯来语[a]叫作“各各他”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能指“亚兰语”。约翰所说的“希伯来语”，有时可以指犹太地区当地通行的闪语。
    reason: 保留Ἑβραϊστί在一世纪语言环境中的词义可能性。
lexical_decisions:
- source_word: βαστάζων
  choice: 背着
  rationale: 该分词表示实际承载、携带；“背着”符合受难叙事中的具体动作，也比泛泛的“拿着”更自然。
- source_word: αὑτῷ τὸν σταυρόν
  choice: 他自己背着十字架
  rationale: 反身代词强调由他本人承担这一动作；译作“他自己”保留强调，又不把定冠词过度解释为所有格“他自己的”。
- source_word: σταυρός
  choice: 十字架
  rationale: 在受难语境中，这是该词清楚、通行的对应词；原文并未明确限定为“横梁”。
- source_word: ἐξῆλθεν
  choice: 走出去
  rationale: 直接表达“出去”的动作，不补入原文未明说的“城”。
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: 一个叫“骷髅地”的地方
  rationale: 保留κρανίον“骷髅”和τόπος“地方”的意义，并用自然的现代汉语地名结构表达。
- source_word: ὃ λέγεται
  choice: 这地方……叫作
  rationale: 这是标准的命名公式；补出“这地方”使汉语指代清楚。
- source_word: Ἑβραϊστί
  choice: 用希伯来语
  rationale: 主文本按希腊词的通常字面意义翻译；其也可能泛指犹太地区当地闪语的语用可能性留在脚注中。
- source_word: Γολγοθα
  choice: 各各他
  rationale: 专名采用现代中文圣经传统中稳定、易识别的音译。
theological_decisions:
- issue: Ἑβραϊστί所指的语言
  choice: 希伯来语
  alternative: 亚兰语
  rationale: 希腊原文明确使用通常译为“希伯来语”的副词，因此正文保留这一表达；约翰的用法也可能指当时犹太地区通行的亚兰语，这一真实歧义以脚注说明，不在正文中擅自消解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“骷髅地”比“髑髅地”更便于普通现代读者理解，同时准确传达原文；分号用于清楚连接该地点的闪语名称。
