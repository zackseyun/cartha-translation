id: JHN.19.30
reference: John 19:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: zh_hans
  text: 耶稣受了那酸酒[a]，就说：“成了！[b]”接着低下头，交出了自己的灵[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“醋”或“酒醋”。希腊文ὄξος指发酸的酒。
    reason: lexical_alternative
  - marker: b
    text: 或译“已经完成了”或“已经成就了”。
    reason: lexical_alternative
  - marker: c
    text: 或译“咽了气”。希腊文直译为“交出了灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: 就
  rationale: 原文同时表达时间推进和叙事承接。汉语借“受了……就……”自然呈现“当……之后，于是……”的关系，避免生硬直译为“所以当”。
- source_word: ἔλαβεν
  choice: 受了
  rationale: λαμβάνω在此指接受递给他的酸酒；“受了”简洁自然，也保留动作先于说话发生的顺序。
- source_word: τὸ ὄξος
  choice: 那酸酒
  rationale: ὄξος指发酸的酒或酒醋。“酸酒”比现代汉语中的“醋”更准确地呈现当时饮品的性质；“那”承接上文所提之物。
- source_word: Τετέλεσται
  choice: 成了
  rationale: τελέω的完成时形式表达事情已经完成并具有持续结果。“成了”简洁有力，保留未明说究竟何事完成的含蓄性，也不额外限定为某一项神学解释。
- source_word: κλίνας τὴν κεφαλήν
  choice: 低下头
  rationale: 准确表达κλίνω在此“俯下、低下”的动作，并以自然现代汉语呈现先于交出灵的分词动作。
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: 交出了自己的灵
  rationale: παραδίδωμι本义为“交出、交付”，πνεῦμα为“灵”。此译法比单说“死了”更贴近原文，并保留约翰叙事中这一表达可能具有的主动意味，同时不说明交给谁。
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα是仅按死亡习语处理，还是保留“交出灵”的具体措辞
  choice: 交出了自己的灵
  alternative: 咽了气
  rationale: 原文不只是一般性地说耶稣死了，而是使用“交出灵”的表达。正文保留这一措辞及其可能具有的主动性和属灵分量；脚注提供自然的死亡习语，但不以该习语取代原文的特殊表达。
- issue: Τετέλεσται所指完成之事是否应在译文中明确
  choice: 成了
  alternative: 已经完成了／已经成就了
  rationale: 希腊文没有明说主语或所完成之事。“成了”保留这种开放性和完成状态，不把某一种关于使命、经文应验或救赎工作的解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。“成了”保留原句的短促和力度；“交出了自己的灵”虽略具经文语体色彩，却清楚可懂，并比一般死亡委婉语更忠实于希腊文。所有脚注标记均紧随相应词句。
