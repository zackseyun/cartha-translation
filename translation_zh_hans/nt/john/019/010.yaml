base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: zh_hans
  text: 于是彼拉多对他说：“你不跟我说话吗？你难道不知道，我有权释放你，也有权把你钉在十字架上吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权”所译的希腊词也可指“权柄”或“能力”；这里因彼拉多是在司法和治理的语境中说话，译作“有权”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: 于是彼拉多对他说
  rationale: οὖν在这里承接并推进叙事；“于是”自然保留顺承意味。αὐτῷ明确译作“对他”。
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: 你不跟我说话吗
  rationale: Ἐμοὶ前置，带有强调和受冒犯的语气；“跟我”保留这一重点，疑问句也自然传达彼拉多的责问。
- source_word: οὐκ οἶδας ὅτι
  choice: 你难道不知道
  rationale: “难道……不知道”符合汉语反问语气，并忠实表达彼拉多认为耶稣理应知道的口吻。
- source_word: ἐξουσίαν ἔχω
  choice: 我有权
  rationale: ἐξουσία可指权柄、权限或能力；在彼拉多司法与治理的语境中，“有权”比单纯的“有能力”更贴切，也较符合现代汉语。
- source_word: ἀπολῦσαί σε
  choice: 释放你
  rationale: ἀπολύω在司法语境中指释放；此译法准确而不额外解释为宣告无罪。
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: 也有权把你钉十字架
  rationale: 保留第二次ἐξουσίαν ἔχω所形成的修辞重复，并清楚对照释放与钉十字架两种结果。“把你钉十字架”是自然且直接的汉语表达。
theological_decisions:
- issue: 彼拉多所声称的ἐξουσία之性质
  choice: 译为“有权”，只报告彼拉多对自身司法权限的声称
  alternative: 译为“有能力”或“有权柄”
  rationale: “有权”符合司法治理语境，却不暗示叙述者认可彼拉多的权力是自主、绝对或正当的，从而保留下一节耶稣回应所揭示的神学张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“你不跟我说话吗”保留彼拉多因被沉默对待而显出的冒犯与责问；重复“有权”以反映原文的强调结构。
