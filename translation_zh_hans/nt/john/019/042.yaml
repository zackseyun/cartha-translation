source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: zh_hans
  text: 于是，因为正值犹太人的预备日[a]，而那座坟墓又在附近，他们就把耶稣安放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人的预备日”也可译作“犹太预备日”，或“犹太人的预备”。
    reason: 希腊文παρασκευή可作一般名词“预备”，也可作安息日前“预备日”的固定称谓；τῶν Ἰουδαίων的属格关系在汉语中也可用“犹太”表达。
lexical_decisions:
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 地点副词，指前文所说的坟墓；放在句末符合现代汉语习惯，也清楚交代安放耶稣的地点。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并引出相应行动，既保留推论和叙事推进的作用，也比“所以”更适合庄重叙事。
- source_word: διὰ τὴν παρασκευὴν τῶν Ἰουδαίων
  choice: 因为正值犹太人的预备日
  rationale: διά加宾格表示原因；παρασκευή在受难叙事中是安息日前预备日的历法用语。“正值”自然表达当时处于该日，同时不进一步限定具体节期。
- source_word: ὅτι ἐγγὺς ἦν τὸ μνημεῖον
  choice: 而那座坟墓又在附近
  rationale: ὅτι引出选择该墓的另一项解释；“又”体现原因的叠加，“那座”承接前文已经提到的坟墓。
- source_word: ἔθηκαν
  choice: 安放
  rationale: τίθημι在此指将耶稣的身体放入坟墓。“安放”符合埋葬语境，较“放置”庄重，又不额外加入经文未明说的动作。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 按现代汉语圣经人名的通行形式音译，作动词的直接宾语。
theological_decisions:
- issue: 受难叙事中παρασκευή的表达
  choice: 预备日
  alternative: 预备；预备的日子
  rationale: 该词可作为固定历法称谓，也可按普通名词理解。“预备日”既便于现代读者理解，又保留其历史称谓性质，不擅自断定超出上下文的具体历法安排。
- issue: τῶν Ἰουδαίων与παρασκευή的关系
  choice: 犹太人的预备日
  alternative: 犹太预备日；犹太人的预备
  rationale: 保留希腊文属格关系，不将其强化为对犹太群体的评价；这里说明的是该预备日与犹太习俗及历法的关联。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“于是……他们就……”保留原文的叙事承接，以两个原因分句呈现埋葬地点选择的逻辑；避免古雅的“安葬于彼”及过度口语化的“放在那里”。
