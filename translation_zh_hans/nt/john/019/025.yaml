  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: zh_hans
  text: 耶稣十字架旁站着他的母亲、他母亲的姐妹、革罗罢的马利亚[a][b]，以及抹大拉的马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“革罗罢的马利亚”，没有明确说明她与革罗罢是什么关系；通常理解为“革罗罢的妻子马利亚”。
    reason: lexical_alternative
  - marker: b
    text: 本节也可能是在列举三位妇女；若如此，“他母亲的姐妹”与“革罗罢的马利亚”指的是同一人。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: 站着
  rationale: 该形式在这里描写持续的站立状态；“站着”自然体现其延续意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接并推进叙事，而非表达强烈转折；现代汉语无需另加连接词也能自然呈现这一功能。
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: 耶稣的十字架旁
  rationale: 保留 παρά 与与格所表达的临近位置，也保留“十字架”与“耶稣”之间简洁的属格关系。
- source_word: ἡ μήτηρ αὐτοῦ
  choice: 他的母亲
  rationale: 直接、自然地表达原文名词短语。
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: 他母亲的姐妹
  rationale: 按原文属格结构翻译；“姐妹”在现代汉语中不强行判定姐姐或妹妹。
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: 革罗罢的马利亚
  rationale: 原文只用属格把马利亚与革罗罢联系起来，并未明说她是革罗罢的妻子；正文保留这种关系上的含混。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: 抹大拉的马利亚
  rationale: 以现代中文圣经读者熟悉的地名式称谓表达来自抹大拉的马利亚。
theological_decisions:
- issue: 十字架旁妇女的身份与人数
  choice: 正文按四位妇女列举：耶稣的母亲、他母亲的姐妹、革罗罢的马利亚、抹大拉的马利亚。
  alternative: 也可按三位妇女理解，把“他母亲的姐妹”看作对“革罗罢的马利亚”的同位说明。
  rationale: 原文并无现代标点，紧凑的并列结构容许两种分析。正文采用较直观的四人读法，同时以脚注保留三人读法，不作教义性定论。
- issue: 马利亚与革罗罢的关系
  choice: 译作“革罗罢的马利亚”，不在正文指定关系。
  alternative: 可理解并译作“革罗罢的妻子马利亚”。
  rationale: 希腊文属格指出二者有关联，却没有明确使用“妻子”一词；因此不把常见解释写成原文明说的事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“站着”体现持续状态；不用生硬的篇章连接词。人名采用简体中文圣经中通行的“革罗罢”“抹大拉”。正文保留原文对革罗罢与马利亚关系的含混，并通过脚注交代常见解释及人数上的另一种句法分析。
