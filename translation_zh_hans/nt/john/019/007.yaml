  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: zh_hans
  text: 犹太人回答他说：“我们有一条律法，按照这条律法[a]，他理当死，因为他把自己说成上帝的儿子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按照律法。”希腊原文重复“律法”一词，第二次是回指第一次所说的律法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“上帝之子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: 回答他说
  rationale: 按叙事语境自然表达“他们回答他”；保留间接宾语所指的彼拉多。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接保留约翰在此使用的群体称谓；本节本身没有用词将范围明确限定为“犹太领袖”，因此不在正文中缩窄所指。
- source_word: νόμον ἔχομεν
  choice: 我们有一条律法
  rationale: 首个 νόμον 无冠词；“一条律法”自然表达他们所诉诸的法律依据，同时不擅自将其改成专名式的“律法”。
- source_word: κατὰ τὸν νόμον
  choice: 按照这律法
  rationale: 第二个 νόμον 带冠词，并回指前面所说的律法；中文用“这”清楚表达这种回指关系。
- source_word: ὀφείλει ἀποθανεῖν
  choice: 他理当死
  rationale: “理当”保留 ὀφείλει 所表达的义务或法理上的应然，也符合此处司法控告的语气，不将其强化为绝对必然。
- source_word: υἱὸν θεοῦ
  choice: 上帝的儿子
  rationale: 该短语在此具有身份称号和性质描述的力量；中文不使用不定冠词，既可表达独特的儿子身份，也不额外加入原文没有明说的限定语。
- source_word: ἑαυτὸν ἐποίησεν
  choice: 把自己说成
  rationale: 这是现代中文中自然的指控性表达，保留“使自己成为／把自己当作某种身份”的希腊语结构，而不在译文中判定该宣称是真是假。
theological_decisions:
- issue: 敌对者控告中 υἱὸν θεοῦ 的表达
  choice: 上帝的儿子
  alternative: 上帝之子；上帝的一个儿子
  rationale: “上帝的儿子”自然传达约翰语境中独特的神圣儿子身份，同时仍是对控告者言论的转述。“上帝的一个儿子”会把此称谓弱化为同类中的一个，超出原文在本语境中的含义；“上帝之子”也可行，但书面色彩更强。
- issue: ἑαυτὸν ἐποίησεν 是否译成明确的“自称”
  choice: 把自己说成
  alternative: 自称是；使自己成为
  rationale: 所选译法保留控告者的措辞和敌对语气，却不把他们的评价当作叙述者的神学判断；也避免中文“使自己成为”被误解为实际改变了本体身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“理当死”保留司法语气；“把自己说成”比生硬直译“使自己成为”更自然，并保留控告中的张力。脚注标记均紧跟所说明的词语。
