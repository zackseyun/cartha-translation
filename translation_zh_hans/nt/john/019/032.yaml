id: JHN.19.32
reference: John 19:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: zh_hans
  text: 于是，士兵们过来，打断了第一个人的腿，也打断了另一个与他[a]同钉十字架的人的腿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”按上下文指耶稣；单从句法看，也可理解为前面所说的第一个人。
    reason: referent_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节所述命令，既表达事件随之发生，也保持自然的叙事推进。
- source_word: οἱ στρατιῶται
  choice: 士兵们
  rationale: 在罗马处刑的语境中，这是清楚、通行的现代汉语表达。
- source_word: τοῦ μὲν πρώτου
  choice: 第一个人
  rationale: 原文直译为“第一个”，所指是与耶稣同钉的两人中的第一人；汉语补出“人”可避免生硬和歧义。
- source_word: κατέαξαν τὰ σκέλη
  choice: 打断了……的腿
  rationale: κατάγνυμι在此指折断肢体；“打断腿”准确、自然，也符合处刑场景。
- source_word: τοῦ ἄλλου
  choice: 另一个……的人
  rationale: 指两名同钉者中的另一人，保留原文“第一个……另一个”的对应结构。
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: 与他同钉十字架的人
  rationale: 以关系从句自然表达同钉的分词结构，并保留原文代词“他”。
theological_decisions:
- issue: αὐτῷ（“他”）的所指
  choice: 正文保留“他”，按上下文自然理解为耶稣
  alternative: 理解为前述第一个人
  rationale: 整段叙事以耶稣为中心，两人也由他们与耶稣同钉的关系来界定；不过，单看句法，代词也可能被理解为较近的“第一个人”，因此用脚注说明而不在正文中直接改成“耶稣”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“打断了第一个人的腿，也打断了另一个……人的腿”略作重复，以符合汉语表达并明确两人的腿都被打断；正文保留原文代词的张力。
