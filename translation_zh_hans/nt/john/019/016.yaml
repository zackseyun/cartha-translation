source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: zh_hans
  text: 于是，他把耶稣交给他们，好让他被钉十字架。[a] 他们就把耶稣带走了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把耶稣交给他们去钉十字架”。原文使用目的从句，并以被动语态表达“被钉十字架”。
    reason: lexical_alternative
  - marker: b
    text: 本节没有明说“他们”是谁；上下文可帮助判断，但原文在这里并未点明这个群体。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: 于是
  rationale: 两个词共同承接前文，并标明叙事随之推进；合译为“于是”既自然，也保留因前事而发生后事的意味，避免生硬叠用“那时，所以”。
- source_word: παρέδωκεν
  choice: 交给
  rationale: 表达将人移交到他人控制之下的意思，符合审判与处置的语境，又不额外说明接收者身份。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文用代词指耶稣；汉语若连续使用“他把他交给他们”会含混不清，因此按下句明说的名字译为“耶稣”，不改变所指。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 保留复数代词，不把原文未明说的人群具体化为祭司长、差役或罗马士兵。
- source_word: ἵνα σταυρωθῇ
  choice: 好让他被钉十字架
  rationale: 保留ἵνα从句的目的意味和σταυρωθῇ的被动语态，同时采用现代汉语自然表达。
- source_word: Παρέλαβον
  choice: 把……带走了
  rationale: 此处表示接手并带走耶稣；“带走”比单说“接了”更符合现代汉语叙事，也不加入“拘押”等原文未明说的细节。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用该人名在现代简体中文圣经语境中的通行译名。
theological_decisions:
- issue: αὐτοῖς以及Παρέλαβον隐含主语所指的人群
  choice: 正文只译作“他们”，不明确其身份
  alternative: 将其解释为祭司长和差役，或按受难叙事的整体语境解释为罗马士兵
  rationale: 本节希腊文仅使用代词或隐含主语，没有直接点明该群体。具体化会替正文消除其保留的指称张力。
- issue: 耶稣被钉十字架的目的与执行关系
  choice: 译作“好让他被钉十字架”，保留目的从句和被动语态
  alternative: 译作“交给他们钉十字架”，使接收者更像明确的执行者
  rationale: 原文说明移交的目的，却以被动语态表达受钉；正文不进一步断定“他们”与实际行刑者之间的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”简洁承接前文；“好让”清楚表达目的而不过分书面化。为避免汉语中“他把他交给他们”的指称混乱，首次宾语明译为“耶稣”，但对复数“他们”仍保持原文的未指明状态。
