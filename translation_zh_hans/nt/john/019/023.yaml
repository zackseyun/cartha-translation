id: JHN.19.23
reference: John 19:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: zh_hans
  text: 士兵把耶稣钉在十字架上以后，就拿了他的外衣，分成四份，每个士兵一份；又拿了那件里衣。那件里衣是无缝的，从上到下整件织成的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上到下整件织成的”也可译作“从上面整件织成的”。
    reason: ἄνωθεν可表示“从上面”或“从上部”；在这里很可能是指衣服从顶部向下织成，而δι’ ὅλου强调整件衣服连续织成。
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: 士兵……就
  rationale: οὖν在这里承接并推进叙事；用“就”自然表达上下文衔接，不强化为逻辑推论。
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: 把耶稣钉在十字架上以后
  rationale: ὅτε与不定过去时表明钉十字架先于随后分衣的动作；“以后”清楚而自然。
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: 拿了他的外衣
  rationale: ἱμάτια可泛指衣物，但本节随即另提χίτων；“外衣”保留两者在语境中的区别。
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: 分成四份，每个士兵一份
  rationale: 以自然汉语准确表达“做成四份”和分给每名士兵一份的含义。
- source_word: καὶ τὸν χιτῶνα
  choice: 又拿了那件内衣
  rationale: χίτων指贴身穿的衣服；“内衣”在现代汉语中简明地与前面的“外衣”形成区别，“又”体现附加关系。
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: 那件内衣没有缝
  rationale: δέ在此作叙事转接，无须译成强转折；ἄραφος直指没有缝合接缝。
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: 从上到下整件织成的
  rationale: 在衣物制作语境中，ἄνωθεν最自然指从上部开始；δι’ ὅλου说明贯穿整体。此译法同时传达连续织成整件衣服的构造。
theological_decisions:
- issue: 无缝内衣是否具有象征意义
  choice: 只按衣物构造作描述性翻译
  alternative: 在译文中暗示祭司衣袍、教会合一或圣礼象征
  rationale: 本节明说的是衣服的构造和士兵的行动；译文不加入经文本身未明言的神学象征。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“外衣／内衣”保留ἱμάτια与χίτων的语境区别；避免使用容易显得生硬的“无缝长衣”，也不在正文中加入象征性解释。
