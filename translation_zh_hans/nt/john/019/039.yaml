  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: zh_hans
  text: 尼哥底母也来了——就是先前夜里去见耶稣的那一位——带着没药和沉香的混合香料，约有一百利特拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一利特拉是古罗马的一磅，约合327克；一百利特拉约为32至33千克。
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: 也来了
  rationale: δέ在此作轻微承接，καί表明尼哥底母也加入前述安葬行动；“也来了”自然保留其附加意味。
- source_word: Νικόδημος
  choice: 尼哥底母
  rationale: 采用现代中文圣经读者熟悉且稳定的人名音译。
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: 就是先前夜里去见耶稣的那一位
  rationale: 冠词加分词结构同位说明尼哥底母的身份。τὸ πρῶτον在此自然指“先前”，回指约翰福音3:1–2；将代词明示为“耶稣”，符合清楚的叙事所指，并使现代中文流畅。
- source_word: φέρων
  choice: 带着
  rationale: 现在分词表达伴随情形；“带着”简洁自然，说明他来时携有安葬用香料。
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: 没药和沉香的混合香料
  rationale: μίγμα意为混合物；σμύρνη为没药。此处ἀλόη是用于安葬的芳香木料，中文以“沉香”可避免误解为现代芦荟植物；补出“香料”使所指清楚。
- source_word: ὡς
  choice: 约有
  rationale: ὡς用于数量时表示约数；“约有”是自然的现代中文表达。
- source_word: λίτρας ἑκατόν
  choice: 一百利特拉
  rationale: 保留古罗马重量单位的音译，避免以现代“磅”造成单位等值的误解；具体换算置于脚注。
theological_decisions:
- issue: 身份说明中αὐτόν的所指
  choice: 明译为“耶稣”
  alternative: 译作“他”
  rationale: 上下文明确回指尼哥底母在约翰福音3:1–2夜访耶稣。明示所指符合自然中文，不引入额外神学解释。
- issue: τὸ πρῶτον的时间含义
  choice: “先前”
  alternative: “第一次”
  rationale: 这里既可带有“起初、第一次”的色彩，也常用于指“从前、先前”。“先前”较自然地回扣第三章，同时避免断言这是严格计数意义上的第一次。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。破折号保留原文同位身份说明的插入效果；古代重量单位音译并以脚注解释。未另设交叉引用脚注，因为“先前夜里”本身已清楚回指约翰福音3:1–2。
