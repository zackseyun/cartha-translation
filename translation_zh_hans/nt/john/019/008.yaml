  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: zh_hans
  text: 彼拉多听见这话，就更加害怕了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: ……就……
  rationale: Ὅτε引出时间情境，οὖν承接上文。汉语用“……就……”自然表达事件的先后与承接关系，不必生硬译出“因此”。
- source_word: ἤκουσεν
  choice: 听见
  rationale: 此处指彼拉多听到并获知刚才所说的话；“听见”符合叙事语境，也比强调主动聆听的“听取”更准确。
- source_word: ὁ Πιλᾶτος
  choice: 彼拉多
  rationale: 采用该人名通行的现代汉语圣经译名；希腊语专名前的冠词在汉语中无需另译。
- source_word: τοῦτον τὸν λόγον
  choice: 这话
  rationale: λόγος在此指上一节所说的内容，即“他自称为上帝的儿子”。“这话”简洁自然，并保持对上文具体言论的指代。
- source_word: μᾶλλον ἐφοβήθη
  choice: 更加害怕了
  rationale: μᾶλλον表示程度进一步加深；ἐφοβήθη在这里描述恐惧加剧。“更加害怕了”自然传达彼拉多原有的恐惧进一步增强。
theological_decisions:
- issue: 彼拉多恐惧的性质
  choice: 只说明他的恐惧加深，不点明恐惧的具体原因或性质。
  alternative: 明确译成政治上的忧惧，或因耶稣可能具有神圣身份而产生的惧怕。
  rationale: 原文仅说彼拉多听见这话后更加害怕，没有判定这种恐惧究竟出于政治压力、宗教敬畏还是迷信心理；译文保留这一叙事张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“这话”承接上节，“就”体现时间与叙事推进，“更加害怕了”清楚表达恐惧程度的上升。
