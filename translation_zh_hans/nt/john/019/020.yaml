source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: zh_hans
  text: 因此，犹太人中有许多人读了这告示牌，因为耶稣被钉十字架的地方离城很近；这告示牌是用希伯来文[a]、拉丁文和希腊文写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能指“亚兰文”；约翰在此所说的“希伯来文”可能是指当地的闪族语言。
    reason: 保留Ἑβραϊστί在约翰语境中可能指亚兰语的词义选择。
lexical_decisions:
- source_word: τίτλον
  choice: 牌子
  rationale: 这里指钉在耶稣十字架上、写明其身份或罪名的告示牌。“牌子”在现代汉语中自然明白，也比“标题”更符合具体场景。
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: 犹太人中有许多人
  rationale: 保留属格结构的部分含义，表明是犹太人中的许多人，而非泛指全体犹太人。
- source_word: ἀνέγνωσαν
  choice: 读了
  rationale: 按简单过去动作处理；原文没有明确要求译为“朗读”。
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: 地方离城很近
  rationale: 自然表达地点与城的距离，不增添“城门”等原文未载细节。
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: 耶稣被钉十字架的地方
  rationale: 保留原文被动语态，不补出施事者。
- source_word: ἦν γεγραμμένον
  choice: 是……写的
  rationale: 以自然汉语表达完成分词所强调的已写成状态。
- source_word: Ἑβραϊστί
  choice: 希伯来文
  rationale: 正文依照希腊原文的语言名称直译；其在约翰用语中也可能指当地的亚兰语，故列入脚注。
- source_word: Ῥωμαϊστί
  choice: 拉丁文
  rationale: 该词字面为“用罗马人的语言”，实际所指为拉丁语。
- source_word: Ἑλληνιστί
  choice: 希腊文
  rationale: 直接、标准地表达该语言副词。
- source_word: οὖν
  choice: 所以
  rationale: 体现本节与前文的叙事及因果承接，同时符合现代汉语表达。
theological_decisions:
- issue: 约翰用语中Ἑβραϊστί所指的语言
  choice: 正文译作“希伯来文”
  alternative: 亚兰文
  rationale: 原文明确使用“希伯来”这一称谓，应在正文保留；但第一世纪相关称谓可能指当地通行的闪族语言，即亚兰语，因此以脚注保存这一可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“牌子”具体易懂；用分号清楚区分地点原因与三种书写语言。
