  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: zh_hans
  text: 他又进了总督府[a]，对耶稣说：“你是从哪里来的？”耶稣却没有回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“总督官邸”；原文指罗马总督的官邸或行政总部。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进了
  rationale: 表示进入某处的动作；“进了”简洁自然，也符合现代汉语叙事表达。
- source_word: πραιτώριον
  choice: 总督府
  rationale: 指罗马总督的官邸或行政总部；“总督府”在现代汉语中简明而庄重，并兼顾其居所和官署功能。
- source_word: πάλιν
  choice: 又
  rationale: 表示动作再次发生；在“进了”之前用“又”最符合汉语语序。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时；汉语叙事用“说”不标明时态，既自然又不损失其叙事功能。
- source_word: Πόθεν εἶ σύ
  choice: 你是从哪里来的？
  rationale: Πόθεν询问来源或出身；此译自然，并保留问题可能涉及地理来历或更深层身份来源的开放性。
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: 没有回答他
  rationale: 原文直译为“没有给他回答”；汉语以“没有回答他”表达更自然，意义完整。
- source_word: καὶ ... καὶ ... δὲ
  choice: 又……，……却……
  rationale: 用“又”承接重复动作，以“却”突出彼拉多发问与耶稣沉默之间的转折。
theological_decisions:
- issue: 省略主语的指代
  choice: 译作“他”，由上下文指向彼拉多
  alternative: 在正文中明确补出“彼拉多”
  rationale: 希腊文未明说主语；上下文足以确认是彼拉多，因此保留代词更贴近原文。
- issue: “你是从哪里来的？”所问来源的层次
  choice: 保持问题开放，不补充地理或神学限定
  alternative: 明确译成询问籍贯，或明确解释为询问天上来源
  rationale: Πόθεν本身只询问来源；约翰叙事可能赋予该问题更深含义，但本节没有明说，译文不应替读者消除这种张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“总督府”便于普通读者理解；句式简洁，保留原文中主语的隐含性、问题的开放性以及“却”所表达的对比。
