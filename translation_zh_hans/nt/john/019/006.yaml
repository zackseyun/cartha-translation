source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: zh_hans
  text: 所以，当祭司长和差役看见他时，就喊着说：“把他钉十字架！把他钉十字架！”彼拉多对他们说：“你们自己把他带去钉十字架吧[a]！因为我找不出他有什么罪名[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文明确使用“你们”，带有强调意味；也可译作“你们把他带去钉十字架”。
    reason: lexical_alternative
  - marker: b
    text: “罪名”也可译作“过错”或“控告的根据”；这里以司法含义为主。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: 所以……一……就……
  rationale: ὅτε表达时间关系，οὖν承接上文并带有推进意味；这样的表达既保留叙事衔接，也符合现代汉语习惯。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指耶路撒冷祭司体系中的领袖群体；“祭司长”是准确、通行的译法。
- source_word: ὑπηρέται
  choice: 差役
  rationale: 在《约翰福音》的语境中，指隶属于犹太权力机构、奉命办事的人员；“差役”保留其从属和公务身份，又不擅自限定为圣殿卫兵。
- source_word: ἐκραύγασαν λέγοντες
  choice: 喊叫说
  rationale: 保留大声呼喊及随后引出话语内容的结构，语气强烈而不夸张。
- source_word: Σταύρωσον σταύρωσον
  choice: 把他钉十字架！把他钉十字架！
  rationale: 希腊文未明说宾语，但由上下文可知是耶稣；汉语补出“他”更自然，并保留重复所表达的强烈要求。
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: 你们自己把他带去
  rationale: 明确译出独立人称代词ὑμεῖς的强调作用，使彼拉多与对方之间的对照清楚可见。
- source_word: σταυρώσατε
  choice: 钉十字架
  rationale: 直接、明确地表达处以十字架刑罚的命令。
- source_word: αἰτίαν
  choice: 罪名
  rationale: 本段是审讯语境，αἰτία主要指可据以定罪或控告的法律理由；“罪名”在现代汉语中简洁地保留这一司法含义。
theological_decisions:
- issue: 彼拉多对耶稣无罪的宣告
  choice: 我查不出他有什么罪名
  alternative: 我查不出他有什么过错
  rationale: 这里首先是审判官所作的司法判断，而不是抽象或全面的神学论断。“罪名”突出控告和定罪依据，同时仍呈现彼拉多认定耶稣没有可成立的指控。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“差役”体现相关人员的公务与从属身份；两次“把他钉十字架”完整保留原文的重复和紧迫语气。脚注标记按实际所释词语分别置于“钉十字架吧”和“罪名”之后。
