  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: zh_hans
  text: 于是，他们取了耶稣的遗体，用细麻布连同香料包裹好，正如犹太人[a]安葬的习俗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。若按地域而非族群或宗教文化理解，可作此译；但这里的语境较支持泛指犹太人的安葬习俗。
    reason: 保留Ἰουδαῖοι可能具有的地域性含义，同时说明本处正文采用文化族群意义的语境依据。
lexical_decisions:
- source_word: ἔλαβον
  choice: 取来
  rationale: 这里指为安葬而接取并处置耶稣的遗体；“取来”自然地表达实际接手遗体的动作。
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节所述的行动及许可，既有推进行文的作用，也保留由前文引出的结果意味。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: 耶稣的遗体
  rationale: σῶμα本义为“身体”；在明确的死亡和安葬语境中，“遗体”是现代汉语中庄重、自然且不过度粗直的表达。
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: 用细麻布裹好
  rationale: δέω含捆扎、缠裹之意，ὀθόνια指安葬所用的细麻布。汉语“用细麻布裹好”既符合实际安葬动作，也比生硬的“捆绑”自然。
- source_word: μετὰ τῶν ἀρωμάτων
  choice: 连同香料一起
  rationale: ἄρωμα指用于安葬的芳香物质；“香料”清楚易懂。“连同……一起”保留μετά所表达的伴随关系。
- source_word: καθὼς ἔθος ἐστὶν
  choice: 照着……的习俗
  rationale: καθώς表示符合某种惯例，ἔθος表示习俗；合译为“照着……的习俗”简洁自然，并说明他们的做法遵循既有惯例。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: Ἰουδαῖοι可按族群、宗教文化或地域理解；此处谈的是一般安葬习俗，正文采用文化族群意义的“犹太人”，同时以脚注保留地域性译法。
- source_word: ἐνταφιάζειν
  choice: 安葬
  rationale: 该词可涵盖为下葬所作的处理，不只指放入坟墓的一刻；“安葬”在此庄重自然，并能概括上下文所述的预备过程。
theological_decisions:
- issue: τοῖς Ἰουδαίοις的范围
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 约翰福音中的Ἰουδαῖοι可因语境指犹太人、犹太地区的人或某些犹太权势群体。这里没有论战意味，而是在说明安葬惯例，因此正文以广义文化习俗理解为“犹太人”，但不抹去地域性理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“遗体”“安葬”符合殡葬语境的尊重语体；“裹好”避免机械直译δέω为“捆绑”，同时保留用布缠裹固定的动作。脚注标记放在其实际解释的“犹太人”之后，而非“香料”之后。
