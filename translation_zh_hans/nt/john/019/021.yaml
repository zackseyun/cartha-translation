  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: zh_hans
  text: 于是，犹太人的祭司长们对彼拉多说：“不要写‘犹太人的王’，而要写‘那个人说：“我是犹太人的王。”’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时可表示持续或反复提出要求；现代汉语在这一叙事场景中用“说”即可自然承载该语境，不必生硬增添“不断”。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事，也体现由所写名号引发反应的联系。
- source_word: οἱ ἀρχιερεῖς τῶν Ἰουδαίων
  choice: 犹太人的祭司长们
  rationale: ἀρχιερεῖς复数指祭司阶层中的领袖；“祭司长们”避免让人误以为同时有多位单一职分的“大祭司”。属格“犹太人的”按原文保留。
- source_word: Μὴ γράφε
  choice: 不要写
  rationale: 直接、自然地表达带μή的现在时命令式禁令。
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 保留受争议牌文的政治与民族称号；汉语无需用大小写标示头衔。
- source_word: ἀλλ’ ὅτι
  choice: 而要写
  rationale: 原文以“而是说……”更正牌文内容；汉语补出与前句对应的“写”，使要求清楚自然，不改变命题内容。
- source_word: ἐκεῖνος εἶπεν
  choice: 他说过
  rationale: ἐκεῖνος在此可作第三人称指称。译作“他”自然且不强行加入“那个人”可能带出的贬抑语气；“说过”适合转述其先前所说的话。
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: 我是犹太人的王
  rationale: 表语中的βασιλεύς虽无冠词，希腊语仍可表达确定的王者身份；现代汉语没有对应冠词差异，因此自然译为“我是犹太人的王”。
theological_decisions:
- issue: 约翰受难叙事中Ἰουδαίων的范围
  choice: 犹太人
  alternative: 犹太地人
  rationale: 此处用于牌文称号“犹太人的王”，传统且语境清楚的译法是“犹太人”。“犹太地人”在某些语境中虽可能成立，但在本节会使固定的政治称号显得不自然；原词可能具有的地域含义不应在正文中强行确定。
- issue: ἐκεῖνος是否带贬抑或疏离意味
  choice: 他
  alternative: 那个人
  rationale: 指示代词可能表现疏离，但这种语用色彩并非必须；正文采用自然且较少解释性的“他”，避免把轻蔑语气确定化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“犹太人的祭司长们”这一较贴近原文的归属结构；引语层次以中文引号清楚呈现。
