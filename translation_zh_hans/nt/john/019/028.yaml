  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: zh_hans
  text: 这事以后，耶稣知道一切都已经完成了，为要使经上的话应验，就说：“我渴了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“我渴。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: 这事以后
  rationale: 保留单数指示词 τοῦτο，并以自然的现代汉语承接前文事件。
- source_word: εἰδὼς
  choice: 知道
  rationale: 将伴随情形的分词自然地译出，表明耶稣说话时所知道的事。
- source_word: ἤδη πάντα τετέλεσται
  choice: 一切都已经完成了
  rationale: “已经……了”体现完成时所表达的已完成状态；“一切”明确对应 πάντα。
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: 为要使经上的话应验
  rationale: “为要”保留 ἵνα 的目的意味；以“应验”表达经文得到实现，同时与前句的“完成”保持词义上的联系与区别。
- source_word: λέγει
  choice: 就说
  rationale: 希腊文用历史现在时叙事，现代汉语用“说”更自然；“就”清楚连接前面的认知与随后的发言。
- source_word: Διψῶ
  choice: 我渴了
  rationale: 自然、简洁地表达现在的口渴状态，符合现代普通话；较为直译和传统的说法另列脚注。
theological_decisions:
- issue: 耶稣的知情、一切已经完成与经文应验三者之间的关系
  choice: 译为耶稣知道一切已经完成，随后为要使经上的话应验而说话。
  alternative: 也可把 ἵνα 理解为侧重结果，即耶稣这样说，结果使经文得到应验。
  rationale: 依照希腊文的语序与句法保留目的／结果的张力，不额外引入关于预知或预定的神学体系；同时区分 τετέλεσται 的“已经完成”与 τελειωθῇ 的“应验”。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“经上的话”是普通读者容易理解的圣经语体，也避免将 γραφή 生硬地译作“书写”。脚注标记紧随其所说明的“我渴了”。
