  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: zh_hans
  text: 士兵们用荆棘编成一顶冠冕，把它放在他头上，又给他披上一件紫色外衣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“士兵们编了荆棘冠冕，放在他头上，又把一件紫色衣服披在他身上。”
    reason: 提供较贴近原文分词结构及ἱμάτιον较宽泛词义的译法。
lexical_decisions:
- source_word: στρατιῶται
  choice: 士兵们
  rationale: 指执行行动的罗马军人；“士兵”是现代汉语中自然、准确的对应词。
- source_word: πλέξαντες
  choice: 编成
  rationale: 不定过去时分词表示先于主要动作发生的行动；汉语按动作顺序表达即可，无须生硬加入“在……之后”。
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: 用荆棘编成一顶冠冕
  rationale: “用荆棘”清楚表达材料，“冠冕”保留此处王权象征及讥讽意味，而不在正文中增添解释。
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: 戴在他头上
  rationale: 符合现代汉语搭配，准确表达把冠冕放到其头上的动作。
- source_word: ἱμάτιον πορφυροῦν
  choice: 一件紫色外衣
  rationale: ἱμάτιον泛指衣服，语境中是披在身上的衣物；“外衣”比“袍子”少作具体式样上的限定，同时保留紫色的王室联想。
- source_word: περιέβαλον αὐτόν
  choice: 给他披上
  rationale: περιβάλλω用于衣物时可指披上或裹上；“给他披上”自然传达士兵将外衣置于他身上的动作。
theological_decisions:
- issue: 士兵行动中的戏仿王权意象
  choice: 直接译出荆棘冠冕和紫色外衣，不明说“戏弄”或“假扮君王”。
  alternative: 译作“给他戴上讥讽性的王冠，并披上王袍”。
  rationale: 原文只叙述行动；讥讽意味可由上下文和物件本身显出，不应把解释加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“冠冕”保留王权意象；“紫色外衣”避免把衣物样式过度具体化。正文中的[a]与脚注相对应。
