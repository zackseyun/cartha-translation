  text: ἀπεκρίθη ὁ Πιλᾶτος· Ὃ γέγραφα γέγραφα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/022.yaml
  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: zh_hans
  text: 彼拉多回答：“我所写的，我已经写了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“我写了，就写了。”希腊文两次使用完成时，可强调所写的已经成为既定事实，不再更改。
    reason: 说明完成时的语气及一种较口语化的译法。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是ἀποκρίνομαι的不定过去时形式，在叙事对话中自然译为“回答”；此处是对祭司长请求的回应。
- source_word: ὁ Πιλᾶτος
  choice: 彼拉多
  rationale: 希腊文专名带冠词是常见叙事用法；现代汉语按惯例省略冠词，采用通行译名“彼拉多”。
- source_word: Ὃ
  choice: 我所写的
  rationale: 中性单数关系代词在此实体化，意为“所写的事/内容”；与后面的第一人称动词合译为“我所写的”，自然且准确。
- source_word: γέγραφα
  choice: 我已经写了
  rationale: γράϕω的完成时主动直说语气，表达已经完成并具有持续结果的行动。“已经写了”在现代汉语中较自然地传达既成事实与不可更改的语气；前一处因关系结构译作“我所写的”，后一处明示“我已经写了”。
theological_decisions:
- issue: 重复使用完成时γέγραφα γέγραφα的力度
  choice: 译为“我所写的，我已经写了”，保留重复并体现既成定局的语气。
  alternative: “我写了就写了”或“我写的已经写上了”
  rationale: 原文的重复表达彼拉多拒绝更改题字的坚定态度。所选译法保留修辞重复和完成时的持续结果，同时不额外说明其动机。“我写了就写了”虽口语有力，却可能显得随便或带入较强情绪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我所写的，我已经写了”略带正式色彩，与彼拉多断然作答的语境相称；脚注补充更口语化的表达，并说明希腊文完成时的力度。
