source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: zh_hans
  text: 从那时起[a]，彼拉多不断设法释放他。但犹太人[b]喊叫说：“你若释放这个人，就不是凯撒的朋友。凡自立为王的，都反对凯撒。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，彼拉多不断设法释放他。”希腊语“ἐκ τούτου”既可表示时间上的“从那时起”，也可表示原因上的“因此”。
    reason: lexical_alternative
  - marker: b
    text: 约翰福音中的“犹太人”常按具体语境指犹太当局或叙事中的某些犹太反对者，并不一定指全体犹太人。
    reason: cultural_note
  - marker: c
    text: “反对凯撒”也可译作“与凯撒作对”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: 从那时起
  rationale: 此处在叙事中最自然地表示时间推进，即从此前的交谈之后开始；同时以脚注保留“因此”这一因果性理解。
- source_word: ἐζήτει
  choice: 一直想
  rationale: 未完成时表示持续或反复的意图与尝试；“一直想”自然体现其持续性，又不把动作过度具体化为已经多次实施。
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: 释放
  rationale: 在审判和拘押语境中，“释放”准确表达正式解除拘押。
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: 但犹太人
  rationale: 正文保留希腊文未加限定的群体称谓，不直接窄化为“犹太领袖”；脚注说明本叙事语境中的可能指向，以免被误解为全体犹太人。
- source_word: ἐκραύγασαν λέγοντες
  choice: 喊着说
  rationale: 体现大声呼喊及引出直接引语的分词结构，符合现代汉语表达。
- source_word: τοῦτον
  choice: 这个人
  rationale: 保留指示词的语气，比单用“他”更能传达说话者带有距离感的指称。
- source_word: φίλος τοῦ Καίσαρος
  choice: 凯撒的朋友
  rationale: 直译并保留其政治忠诚意味，而不擅自断定它是否为正式称号。
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: 凡自立为王的
  rationale: “自立为王”简洁自然，并保留“使自己成为王”的主动与僭称意味，避免弱化为单纯声称。
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: 反对凯撒
  rationale: ἀντιλέγω可指反驳、抗拒或反对；在政治控诉的语境中，“反对”比字面化的“说话反对”更自然，并保留广义对抗含义。
theological_decisions:
- issue: 约翰福音中“犹太人”的所指
  choice: 正文译作“犹太人”，脚注提示此处可能特指犹太当局或叙事中的反对者
  alternative: 正文译作“犹太领袖”或“犹太地区的人”
  rationale: Ἰουδαῖοι本身未明说“领袖”，因此正文不作解释性窄化；但上下文中的实际所指不能自动扩大到全体犹太民族，故以脚注说明。
- issue: ἀντιλέγει τῷ Καίσαρι的政治含义
  choice: 反对凯撒
  alternative: 说话反对凯撒；与凯撒作对
  rationale: 此处的控告涉及对皇帝权威的抗拒，不仅是言语上的异议；“反对”既符合语境，也不额外加入叛乱等更强定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼拉多”“凯撒”沿用通行圣经专名；保留法庭与政治控诉的语气。脚注标记均置于相关正文之后。
