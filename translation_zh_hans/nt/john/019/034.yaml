  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: zh_hans
  text: 但有一个士兵用矛[a]刺了他的肋旁，立刻就有血和水流出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “矛”也可译作“长枪”。
    reason: lexical_alternative
  - marker: b
    text: 有些解释者认为“血和水”具有象征或圣礼含义，另一些解释者则视之为对生理现象的描述；希腊文本在这里并未说明其意义。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文耶稣的腿没有被打断，清楚表达转折。
- source_word: εἷς τῶν στρατιωτῶν
  choice: 有一个士兵
  rationale: 保留希腊文部分属格结构“士兵中的一个”，同时符合现代汉语叙事习惯。
- source_word: λόγχῃ
  choice: 用矛
  rationale: 指士兵使用的长柄刺击兵器；“矛”是现代汉语中清楚、自然的对应词。
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: 他的肋旁
  rationale: 保留代词指称，不额外明说“耶稣”；“肋旁”比宽泛的“旁边”更准确地表示身体侧面，又不具体限定伤口位置。
- source_word: ἔνυξεν
  choice: 刺了
  rationale: 准确表达以尖锐兵器刺入的动作，简洁自然，且不过度渲染。
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: 立刻有……流出来
  rationale: 保留εὐθύς的即时性；“流出来”与“血和水”搭配自然，并忠实传达ἐξέρχομαι的出来之意。
- source_word: αἷμα καὶ ὕδωρ
  choice: 血和水
  rationale: 按原文直译，不在正文中加入医学、象征或圣礼方面的解释。
theological_decisions:
- issue: 正文是否把“血和水”解释为圣礼象征或生理现象
  choice: 仅译作“血和水”，不作解释
  alternative: 将其明确解释为圣餐与洗礼的象征，或解释为伤口造成的生理现象
  rationale: 希腊文本在本节只陈述血和水流出，并未说明其意义；译文应保留这种诠释开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“肋旁”准确而不过度医学化；两个脚注标记均置于正文相应内容之后，词汇异译脚注紧随“肋旁”所在分句，解释性脚注紧随“血和水”的完整陈述。
