  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: zh_hans
  text: 他被钉十字架的地方有一个园子；园子里有一座新坟墓，其中还从未葬过人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事衔接词，并非表示时间的“现在”，也不构成明显转折；现代汉语可借句序自然承接上文。
- source_word: ἐν τῷ τόπῳ ὅπου ἐσταυρώθη
  choice: 他被钉十字架的地方
  rationale: 保留ἐσταυρώθη的被动语态；“他”由上下文明确指向耶稣，不另加施事者。
- source_word: κῆπος
  choice: 园子
  rationale: 准确表达一般性的园地，不将其过度具体化为果园。
- source_word: μνημεῖον καινόν
  choice: 一座新坟墓
  rationale: “坟墓”符合安葬场景；“新”直接对应καινόν，而后句进一步说明尚未使用。
- source_word: ἐν ᾧ
  choice: 其中
  rationale: 清楚回指前面的新坟墓，简洁自然。
- source_word: οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: 还从未安放过任何人
  rationale: “还从未”保留οὐδέπω的时间意味和οὐδείς的全称否定；“安放”贴近τίθημι的基本意义，同时由坟墓语境自然表达安葬。
theological_decisions:
- issue: 十字架事件中ἐσταυρώθη的语态
  choice: 他被钉十字架
  alternative: 他们把他钉在十字架上
  rationale: 保留原文被动形式，不补入本分句未明说的施事者。
- issue: 安葬语境中μνημεῖον与τεθειμένος的表达
  choice: 坟墓……安放过任何人
  alternative: 墓穴……葬过任何人
  rationale: 所选措辞既呈现具体的埋葬场景，又不把τεθειμένος直接强化为原文未明说的礼仪性“安葬”，从而避免增加解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“园子”与“坟墓”是普通读者熟悉的表达；分号呈现原文两个紧密相连、结构平行的地点说明。
