  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: zh_hans
  text: 耶稣回答他说：“若不是从上面[a]赐给你的，你对我就根本没有任何权柄。因此，那把我交给你的人[b]罪更重。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从天上”。希腊文为“从上面”；在《约翰福音》中，这个说法常指向神圣的来源。
    reason: lexical_alternative
  - marker: b
    text: 这里没有明说“那把我交给你的人”是谁；可能指犹大、该亚法，或更广义的犹太领袖。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 这里指彼拉多受授予的管辖和处置权限；“权柄”既包含权力，也包含获准行使权力的意味，比单纯的“能力”更符合司法语境。
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: 对我就根本没有任何
  rationale: κατά与属格在此表示权柄所针对的对象；“根本没有任何”自然传达οὐδεμίαν的强调语气，同时不把它窄化为敌对行动。
- source_word: δεδομένον σοι
  choice: 赐给你的
  rationale: 完成时被动分词表示彼拉多现有的权柄先前已由更高来源授予；中文以“赐给”自然表达被动授予，并呼应下文“从上面”的神圣来源。
- source_word: ἄνωθεν
  choice: 从上面
  rationale: 保留约翰著作中该词“从上面”的典型表达及其含蓄的神圣来源意味，不在正文中直接强化为“从天上”或“从神而来”。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁表达前后两句之间的因果或推论关系，同时不额外界定这一推论的全部逻辑细节。
- source_word: ὁ παραδούς μέ σοι
  choice: 那把我交给你的人
  rationale: 忠实保留分词结构及其未明说的主语，不以“出卖我的人”等译法预先认定此人就是犹大。
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: 罪更重
  rationale: 自然表达比较级的罪责轻重，表明交付耶稣者的罪责大于彼拉多，却不暗示彼拉多无罪。
theological_decisions:
- issue: ἄνωθεν所暗示的彼拉多权柄来源
  choice: 正文译作“从上面”，保留其指向神圣来源的含义
  alternative: 直译为“从天上”或明确译为“由神赐下”
  rationale: 经文将彼拉多的权柄置于更高的授予来源之下，但并未在此展开完整的政治权柄教义；含蓄译法可避免过度阐释。
- issue: ὁ παραδούς μέ σοι所指的人
  choice: 不在正文中确定其身份
  alternative: 明确认定为犹大、该亚法或犹太领袖群体
  rationale: 希腊文只说“那把我交给你的人”，并未点名；保留所指对象的开放性，符合原文的真实含混。
- issue: “罪更重”对彼拉多罪责的含义
  choice: 保留罪责程度的比较，不把彼拉多判为无罪
  alternative: 将句意解释为只有交付耶稣者有罪
  rationale: 比较级μείζονα表明一方罪责更大，通常也含示比较中的另一方负有罪责；译文保持这种张力而不作教义扩展。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“权柄”适合经文的司法和神学语境；“根本没有任何”传达原文的强调；两个脚注标记均紧随其所解释的词组，避免英文咨询层中标记位置与脚注内容错配的问题。
