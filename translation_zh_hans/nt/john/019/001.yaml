  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: zh_hans
  text: 于是，彼拉多把耶稣带去，鞭打了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作：“于是，彼拉多把耶稣带去，叫人鞭打他。”
    reason: 原文以彼拉多为语法主语；此译法将可能由他下令执行的含义明确表达出来。
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 表示叙事按时间向下一事件推进；“于是”在现代汉语中简洁自然，也能与οὖν共同体现承接关系。
- source_word: οὖν
  choice: 融入“于是”
  rationale: οὖν表示逻辑或叙事推进。汉语用一个“于是”即可自然承载Τότε οὖν的整体语篇功能，避免机械重复。
- source_word: ἔλαβεν
  choice: 带走
  rationale: λαμβάνω在这里指彼拉多处置并带走耶稣。“带走”比“抓住”少一层强力拘捕的附加意味，也比单说“带”更符合现代汉语叙事。
- source_word: ὁ Πιλᾶτος
  choice: 彼拉多
  rationale: 采用该人名通行的现代中文译法；上下文已明确其身份，无须补出全名。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 采用该人名通行的现代中文译法，并在后句以“他”自然复指。
- source_word: ἐμαστίγωσεν
  choice: 鞭打了他
  rationale: μαστιγόω指用鞭子抽打。“鞭打”清楚、现代且保留刑罚的严厉程度；“他”在汉语中明确承接前面的耶稣。
theological_decisions:
- issue: 彼拉多在鞭打行为中是亲自执行还是授权他人执行
  choice: 正文依照希腊文语法，以彼拉多为两个动词共同的主语，不在正文中判定他是否亲自动手。
  alternative: 译作“彼拉多带走耶稣，叫人鞭打他”或“彼拉多把耶稣带去，让人鞭打他”。
  rationale: 原文将彼拉多置于ἔλαβεν和ἐμαστίγωσεν之前，作为两者的语法主语，但这种表达在统治者语境中可以涵盖授权执行。正文保留表层结构，脚注说明委托执行的可能性，避免把历史推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”顺畅衔接上下文；“鞭打”比古雅的“鞭笞”更便于普通读者理解，同时保持刑罚语气。脚注标记已在正文相应位置标出。
