  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: zh_hans
  text: 于是，耶稣出来了，戴着荆棘冠冕，穿着紫色外袍。彼拉多对他们说：“看哪[a]，这个人！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看，这个人！”希腊语Ἰδοὺ是引人注意的表达，也可译作“看”或“瞧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: 于是，耶稣出来了
  rationale: ἐξῆλθεν与ἔξω共同强调向外而出；“出来了”符合汉语叙事视角。οὖν在这里承接上文并引出结果，译作“于是”自然明晰。
- source_word: φορῶν
  choice: 戴着……穿着……
  rationale: φορέω表示穿戴；因宾语包括冠冕和外袍，按现代汉语搭配分别译作“戴着”和“穿着”。
- source_word: τὸν ἀκάνθινον στέφανον
  choice: 荆棘冠冕
  rationale: ἀκάνθινος表明冠冕由荆棘制成；“荆棘冠冕”简洁、庄重，也准确保留受辱场景中的王权意象。
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: 紫色外袍
  rationale: ἱμάτιον泛指外层衣物；“外袍”既自然，又不把具体款式规定得超过原文。“紫色”保留戏仿王权的色彩。
- source_word: λέγει αὐτοῖς
  choice: 彼拉多对他们说
  rationale: 希腊文以历史现在时增强现场感。汉语用“说”即可自然叙述；将原文省略的主语按紧接的上文明确为彼拉多，可避免汉语读者误以为是耶稣发言。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意的指示语。“看哪”比单独的“看”更庄重，也保留公开展示耶稣时的强烈语气。
- source_word: ὁ ἄνθρωπος
  choice: 这个人
  rationale: 定冠词加单数名词在此具体指眼前被展示的耶稣。“这个人”符合现代汉语的指示场景，同时不把可能存在的代表性人类意涵写入主文。
theological_decisions:
- issue: 彼拉多宣告中ὁ ἄνθρωπος的含义
  choice: 这个人
  alternative: 这人；这个男人；人
  rationale: 原文首先指向站在众人面前的耶稣这一具体男性。“这个人”保留直接所指，又不把“代表全人类”等可能的神学回响变成明说，从而保留文本张力。
- issue: λέγει的发言者是否明确写出
  choice: 彼拉多对他们说
  alternative: 他对他们说
  rationale: 希腊文可凭上文和叙事结构辨明发言者是彼拉多；若汉语只写“他”，最邻近的“耶稣”容易被误当作发言者。明确姓名是在目标语中恢复原读者可获得的信息，并非增添新的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“荆棘冠冕”和“紫色外袍”保留受辱与戏仿王权的画面；引语使用感叹号呈现公开展示时的强烈呼告，但不额外解释彼拉多话语可能含有的讽刺或神学意味。
