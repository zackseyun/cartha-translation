base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: zh_hans
  text: 他们一次次走到他跟前，对他说[a]：“犹太人的王，万岁[b]！”还不断地打他耳光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不断走到他跟前，不断地说。”希腊文的两个未完成时动词可表示反复或持续的动作。
    reason: lexical_alternative
  - marker: b
    text: “万岁”所译的希腊语也可作“你好”或“愿你欢喜”；这里是讥讽性的君王礼敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: 他们一次次走到他跟前，说
  rationale: 两个未完成时动词可表达反复进行的动作；“一次次”自然地呈现士兵轮番上前嘲弄的场景，同时避免逐字译成生硬的“不断地来并不断地说”。
- source_word: Χαῖρε
  choice: 万岁
  rationale: 该词本可作问候语，字面与“欢喜”有关；在这里却是仿照向君王致敬的讥讽性呼喊。现代汉语“万岁”能自然传达王室欢呼形式及其反讽意味。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 直接保留受难叙事中的政治及弥赛亚称号，不作弱化或释义性扩展。
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: 又不断地打他耳光
  rationale: ῥάπισμα指用手掌打的一击或耳光；δίδωμι与其连用意为“施以击打”。“打耳光”准确而自然，“不断地”体现未完成时所表达的持续或反复动作。
theological_decisions:
- issue: 士兵对耶稣的称呼应呈现何种语气
  choice: 用“万岁”呈现讥讽性的君王礼敬
  alternative: 中性地译作“你好，犹太人的王”或较直译地译作“欢喜吧”
  rationale: 上下文中的荆棘冠冕、紫袍和殴打表明这不是诚恳问候，而是模拟向君王致敬的嘲弄；译文保留这种叙事已显明的反讽，不额外加入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“走到他跟前”比“来到他那里”更清楚地呈现趋近动作；“打他耳光”直白但不粗俗，符合受难场景。
