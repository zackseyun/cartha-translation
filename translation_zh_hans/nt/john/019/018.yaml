  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: zh_hans
  text: 他们在那里把他钉在十字架上，又把另外两个人同他一起钉在十字架上：一个在这边，一个在那边，耶稣在中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“两边各一个，耶稣在他们中间。”
    reason: 提供更紧凑的合法表达，同时说明原文所描绘的空间关系。
lexical_decisions:
- source_word: ὅπου
  choice: 在那里
  rationale: 作地点关系副词，承接上一节所说的地方；现代汉语用“在那里”自然明确。
- source_word: ἐσταύρωσαν
  choice: 把他钉在十字架上
  rationale: 在约翰受难叙事中指施行十字架刑；此译为现代汉语的标准表达，又不额外限定钉子的具体用法。
- source_word: μετ’ αὐτοῦ
  choice: 和他一同
  rationale: μετά加属格表示伴同；这里指另外两人与耶稣同时同处受刑。
- source_word: ἄλλους δύο
  choice: 另外两个人
  rationale: 原文直译为“另外两个”；汉语需补出量词所依附的名词，“人”由语境自然确定，而不增添其身份。
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: 一个在这边，一个在那边
  rationale: 保留原文成对地点副词的分列和画面感，表明二人处在相对的两边。
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: 耶稣在中间
  rationale: μέσον表示居中的位置；译文保留原文简洁的空间陈述，不进一步解释为“在他们中间”。
theological_decisions:
- issue: 是否明说耶稣位于另外两人之间
  choice: 译作“一个在这边，一个在那边，耶稣在中间”
  alternative: 译作“耶稣在他们中间”或“两边各一个，耶稣在中间”
  rationale: 原文先以两个对应副词描述两边的位置，再陈述耶稣居中。所选译法保留这种次序和空间图景，避免把隐含的指代关系过度明说。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“钉在十字架上”符合普通读者熟悉的经文语域；分号划分钉十字架与位置安排，使长句清晰。脚注标记置于整节末尾，对应整段空间表述的替代译法。
