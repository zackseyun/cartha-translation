  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: zh_hans
  text: 这些事发生，是要使经上的话得以应验：“他的骨头一根也不会折断。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为：“他的一根骨头不会被折断。”原文“骨头”是单数；正文按现代汉语习惯译为“他的骨头一根也不会折断”。
    reason: 说明原文单数形式及正文的习语化处理。
lexical_decisions:
- source_word: ἐγένετο
  choice: 发生
  rationale: 这里概括刚才所叙述的事件；“发生”是现代汉语中自然、准确的事件性表达。
- source_word: γὰρ
  choice: （由句意体现，不另译）
  rationale: γάρ说明前一句所述之事的缘由。汉语接续上下文时可通过“这些事发生，是要……”自然体现解释关系，若硬译“因为”反而显得突兀。
- source_word: ταῦτα
  choice: 这些事
  rationale: 中性复数指向前文发生的多件事情；“这些事”既贴近原文，又清楚自然。
- source_word: ἵνα
  choice: 是要使
  rationale: 保留目的兼结果的意味，同时避免把二者之间的张力单方面确定为纯目的或纯结果。
- source_word: ἡ γραφὴ
  choice: 经上的话
  rationale: 这里指神圣经文中的具体话语；“经上的话”符合现代中文圣经语体，也比单说“经文”更自然地接“得以应验”。
- source_word: πληρωθῇ
  choice: 得以应验
  rationale: 保留被动意义和ἵνα结构中的目的／结果色彩；“应验”是经文预告或话语实现的惯用表达。
- source_word: Ὀστοῦν
  choice: 骨头一根
  rationale: 原文为单数并带有个体化、集合性的用法；汉语以“一根”配合否定，能自然表达“没有任何一根”。
- source_word: οὐ συντριβήσεται
  choice: 也不会折断
  rationale: 将未来被动译为“不会折断”；在骨头的语境中，“折断”比“压碎”或“粉碎”更准确自然。“也”与前置的“一根”构成汉语全称否定。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 属格代词自然译作领属结构“他的”。
theological_decisions:
- issue: 如何翻译经文引语中的单数“骨头”，并保留其与逾越节条例及诗篇的互文联系
  choice: 他的骨头一根也不会折断
  alternative: 他的骨头不会折断／他的一根骨头也不会折断
  rationale: “骨头一根也不会折断”在现代汉语中自然地表达原文单数名词所具有的集合意义，并未增加原文之外的内容。它也保留了经文应验的措辞和旧约典故的开放性，不具体断定作者只引用出埃及记、民数记或诗篇中的哪一处。
- issue: ἵνα在经文应验公式中是目的还是结果
  choice: 是要使……得以应验
  alternative: 结果使……应验／为要应验……
  rationale: “是要使……得以”保留目的导向，同时容纳事件导致经文实现的结果意味，不把原文的神学张力静默化解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经上的话得以应验”保持约翰福音常见的经文应验语体；引语不使用文言式“不可折断”，以免造成命令句的误读。
