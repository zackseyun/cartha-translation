source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: zh_hans
  text: 于是，那些人高声喊道：“除掉他！除掉他！把他钉在十字架上！”彼拉多对他们说：“难道我要把你们的王钉在十字架上吗？”祭司长回答：“除了凯撒，我们没有王。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们没有王，只有凯撒。”
    reason: 词汇与句式的等值表达选择。
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: 于是，那些人高声喊道
  rationale: κραυγάζω表示大声呼喊；οὖν承接前文、推动叙事；ἐκεῖνοι带有指示和强调意味，译作“那些人”予以保留。
- source_word: Ἆρον ἆρον
  choice: 除掉他！除掉他！
  rationale: 重复的命令式构成强烈的处决呼声；“他”虽未在这两个命令中明说，却由紧接着的αὐτόν及语境清楚补出，现代汉语这样表达自然有力。
- source_word: σταύρωσον αὐτόν
  choice: 把他钉十字架
  rationale: σταυρόω在罗马处刑语境中指钉十字架；“把”字句符合现代汉语的命令表达。
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: 难道我要把你们的王钉十字架吗
  rationale: 疑问式虚拟语气表达彼拉多带有挑战意味的反问；“难道……吗”自然传达其修辞力度，又不增添明确答案。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数ἀρχιερεῖς指居领导地位的祭司群体；“祭司长”是准确而通行的汉语称谓。
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: 除了凯撒，我们没有王
  rationale: εἰ μὴ表示排除其他对象、仅留一个例外；此译法直接保留祭司长所宣称的排他性政治效忠。
theological_decisions:
- issue: 祭司长对凯撒的排他性效忠声明
  choice: 除了凯撒，我们没有王
  alternative: 我们没有王，只有凯撒
  rationale: 正文紧贴εἰ μὴ的例外结构，保留其对其他王权的鲜明否认，同时不替读者化解这句话在叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。群众的重复呼喊保留急迫和暴烈感；彼拉多的话译成自然反问；末句保持简洁、绝对，不额外解释其政治或神学含义。
