  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: zh_hans
  text: 又有另一处经文说[a]：“他们要观看他们所刺穿的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们要望向他们所刺穿的那一位。”希腊文表示朝向那一位观看；这里呼应撒迦利亚书12:10。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示在前一处引文之外再引一处经文；“又”在现代汉语引文衔接中自然简洁。
- source_word: ἑτέρα γραφή
  choice: 另一处经文
  rationale: γραφή在此指圣经经文，ἑτέρα引出另一项经文见证；“另一处经文”比“另一经”更自然，也清楚表明是另一段经文。
- source_word: λέγει
  choice: 说
  rationale: 保留希腊文以现在时引述经文的表达方式；汉语“经文说”自然庄重。
- source_word: Ὄψονται
  choice: 要仰望
  rationale: 这里不是单纯看见，而是朝向特定对象观看；“仰望”能表达定向注视，同时符合庄重的经文语体。
- source_word: εἰς ὃν
  choice: 自己所……的那一位
  rationale: εἰς标明观看所朝向的对象，ὃν是人的关系代词；汉语以“所……的那一位”明确保留其人格对象。主语相同，补出“自己”可自然表达“他们所刺”的关系。
- source_word: ἐξεκέντησαν
  choice: 刺
  rationale: 不定过去时主动语态指刺穿的行动；“刺”简洁清楚，并与当前钉十字架的上下文相合。
theological_decisions:
- issue: 如何呈现撒迦利亚书12:10的呼应，同时不把其希伯来文或七十士译本的额外措辞带入约翰的引文
  choice: 他们要仰望自己所刺的那一位
  alternative: 他们要望向自己所刺的那一位
  rationale: 以约翰此处的希腊文为准，保留“被刺的那一位”与上下文中耶稣的对应，却不擅自加入撒迦利亚书原文中的第一人称神圣指称。“仰望”与“望向”都可表达方向性，正文采用更庄重且符合汉语经文语感的“仰望”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“另一处经文说”是自然的引经格式；“那一位”保留所指对象的人格性。脚注保留观看方向表达上的细微差异。
