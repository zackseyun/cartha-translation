  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: zh_hans
  text: 那天是逾越节的预备日；当时约在第六时辰[a]。他对犹太人[b]说：“看哪，你们的王！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第六时辰”若按通常从日出起算的计时法，约为现代的中午；若按另一种计时方式起算，所对应的现代时间会不同。
    reason: 文化背景与计时歧义
  - marker: b
    text: 这里的“犹太人”按上下文可能更具体地指犹太地的当权者或犹太领袖，并非泛指所有犹太人。
    reason: 语境中的可能所指
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: 逾越节的预备日
  rationale: “预备日”清楚表达为节期或安息日作预备的日子；保留属格“逾越节的”，不进一步断定它与逾越节各日程之间的具体关系。
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: 约在第六时辰
  rationale: 保留古代计时表达及ὡς所表示的约数，不在正文中把有争议的计时方式直接换算成现代钟点。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时以增强叙事现场感；现代汉语叙事中的“说”本身不标明时态，既自然，也无需强加过去时形式。
- source_word: τοῖς Ἰουδαίοις
  choice: 对犹太人
  rationale: 直译该词，不在正文中擅自缩窄为“犹太领袖”或改作“犹太地人”；上下文中较窄的指称可能性以脚注说明。
- source_word: Ἴδε
  choice: 看哪
  rationale: 作为引人注意的郑重呼语，“看哪”比口语化的“你们看”更能保留公开宣示的语气。
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: 你们的王
  rationale: 自然地保留第二人称复数领属关系，以及这句话在政治和叙事层面的尖锐意味。
theological_decisions:
- issue: “犹太人”的具体所指
  choice: 正文保留“犹太人”
  alternative: 犹太地人；犹太领袖
  rationale: 原文τοῖς Ἰουδαίοις本身没有在本节明确限定为领袖群体。保留较宽的原词表达，并在脚注提示上下文可能指更具体的一群人，可避免把解释直接写入正文，也避免将其泛化为所有犹太人。
- issue: “第六时辰”的现代时间换算
  choice: 正文保留古代时辰表达
  alternative: 约在中午
  rationale: 原文既使用古代计时名称，又有“约”的限定。保留“第六时辰”可避免预先裁定计时体系及相关年代问题；通常的现代换算放入脚注。
- issue: 逾越节“预备日”的关系
  choice: 译作“逾越节的预备日”
  alternative: 为逾越节作预备的日子；逾越节期间的预备日
  rationale: 属格结构可以表达与逾越节相关的预备日，但仅凭本句不宜把具体节期日程解释得过细，因此采用既贴近原文又保持开放性的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“预备日”“第六时辰”“看哪”保留经文的历史文化色彩，但避免生硬仿古。脚注标记紧跟各自实际说明的词语：时间脚注置于“第六时辰”后，群体指称脚注置于“犹太人”后。
