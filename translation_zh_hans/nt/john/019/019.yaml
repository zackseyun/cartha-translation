base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: zh_hans
  text: 彼拉多又写了一则题字，并把它放在十字架上。上面写着：“拿撒勒人耶稣，犹太人的王[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的王。”希腊语这个词按语境既可泛指犹太人，也可特指犹太地人。
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: 告示牌
  rationale: 在钉十字架的语境中，指写明被处刑者身份或罪状、固定在刑具上的牌子。“告示牌”比“标题”更符合现代汉语，也自然承接下文“上面写着”。
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: 安放在十字架上
  rationale: 直接保留希腊文“在十字架上”的空间表达，不按语境推断为“十字架上方”；“安放”符合庄重叙事语体。
- source_word: ἦν ... γεγραμμένον
  choice: 上面写着
  rationale: 自然表达完成时分词所呈现的结果状态，即文字已经写成并留在牌上；同时避免生硬的“被写着”。
- source_word: Ναζωραῖος
  choice: 拿撒勒人
  rationale: 该词是表示地域身份的形容词或名词形式。“拿撒勒人”在现代汉语中简洁自然，并保留其身份称谓功能，而非改写为较长的“来自拿撒勒的”。
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 在受难叙事的公开罪状中，这是政治性王号；“犹太人的王”是自然且通行的译法。Ἰουδαίων也可能按地域理解为“犹太地区的人”，故以脚注保留该可能性。
- source_word: δὲ καὶ
  choice: 又
  rationale: “又”自然传达叙事承接和附加意义，无须逐一机械翻出两个连接词。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: σταυροῦ
  choice: 十字架
  rationale: 在福音书受难叙事中，σταυρός通常且合宜地译为“十字架”。
theological_decisions:
- issue: 告示中Ἰουδαίων的所指
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 此处是公开的王号与罪状，“犹太人的王”最符合受难叙事中的惯常和语境意义；但该希腊词也可侧重地域，指犹太地区的人，因此以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“告示牌”具体呈现τίτλον在处刑场景中的功能；引文保持简洁醒目，符合牌上文字的性质。
