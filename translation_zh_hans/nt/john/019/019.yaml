  naturalness: “安放在十字架上”缺少宾语，且“安放”略显书面而不必要。改作“把它放在十字架上”完整、自然，并严格保留ἐπὶ τοῦ σταυροῦ的“在……上”，不推定为“上方”。“上面写着”自然表达牌上现存的文字。
  terminology: “彼拉多”“十字架”“拿撒勒人耶稣”“犹太人的王”均合乎现代中文圣经语境。脚注中的“犹太地区的人”不够自然，也未能以通常的地域名称准确对应“Judeans”；改为“犹太地人”，同时说明该词可按语境泛指犹太人或特指犹太地人。
  issues:
