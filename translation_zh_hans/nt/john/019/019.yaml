    issue: “写了一块告示牌”将τίτλον所指的题字/铭文与牌子本身混同。
    rationale: 希腊文说彼拉多“写了一个题字（τίτλον）”，随后将其放在十字架上。译为“写了一则题字，并把它放在十字架上”更直接保留原文的表达和指代关系。
  - severity: low
    issue: 脚注的“犹太地区的人”表达不自然且地域词不够准确。
    rationale: Ἰουδαῖοι的地域性理解通常对应“犹太地人（Judeans）”，不是泛称“犹太地区的人”。
