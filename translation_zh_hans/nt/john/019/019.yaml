  rationale: 修订将“题字”与其被放置在十字架上的事实分别表达，贴近τίτλον和ἔθηκεν ἐπὶ τοῦ σταυροῦ；保留“上面写着”对ἦν γεγραμμένον的自然结果状态表达。脚注保留Ἰουδαίων的词义歧义，但以“犹太地人”替换不够地道的“犹太地区的人”。
