  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: zh_hans
  text: 他们拿了棕榈树枝，出去迎接他，不断高喊：“和散那！[a]奉主名而来的，是应当称颂的！[b]以色列的王也当受称颂！[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和散那”源自希伯来语，原意可译作“现在拯救吧”或“求你拯救”；到当时也已用作赞颂的欢呼。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《诗篇》118:26。
    reason: cross_reference
  - marker: c
    text: 或译：“并且是以色列的王！”
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: 棕榈树枝
  rationale: βάϊον指树枝，τῶν φοινίκων说明是棕榈树的；“棕榈树枝”在现代汉语中自然简洁，同时保留两项语义。
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: 出去迎接他
  rationale: 该短语表示出去与来者相会；本段群众带着树枝欢呼，“迎接”符合语境，又不额外加入礼仪性解释。
- source_word: ἐκραύγαζον
  choice: 不断高喊
  rationale: 未完成时体现持续或反复发生的呼喊；“不断高喊”在汉语中清楚传达这一体貌。
- source_word: Ὡσαννά
  choice: 和散那
  rationale: 这是源自希伯来语的礼仪性欢呼，音译可保留其在当时既是求救呼声、又已成为赞颂欢呼的双重背景；具体含义收入脚注。
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: 奉主名来的是当受称颂的
  rationale: 用“……的是……”自然表达带冠词的实体化分词，并保留诗篇引文的祝颂形式。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名
  rationale: “奉……名”是自然且庄重的汉语圣经表达，保留代表、权柄和名义等可能内涵，不将其缩减为单一解释。
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: 以色列的王也是如此
  rationale: καί可以把“以色列的王”作为追加、同位的称号接在前一句祝颂之后；“也是如此”使汉语句法完整，同时保留它也可能直译为“以及以色列的王”的空间。
theological_decisions:
- issue: 诗篇引语中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 现有希腊文本写作κυρίου，正文据此译为“主”；虽其所呼应的诗篇118:26希伯来文本背后有神名，正文不越过希腊文本直接改译为“耶和华”。
- issue: 群众欢呼中的君王与弥赛亚色彩
  choice: 保留“以色列的王”这一明确称号
  alternative: 以色列王
  rationale: 原文明确使用带冠词的王者称号；译文不淡化其王权含义，也不加入原文未明说的教义说明。
- issue: καί连接末尾王者称号的关系
  choice: 以色列的王也是如此
  alternative: 以及以色列的王
  rationale: καί既可作普通并列，也可在此引出同位且递进的王者称号。正文采用自然汉语表达追加祝颂的理解，并以脚注保存较形式对应的并列译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“和散那”保留传统且通行的音译，以脚注解释其原义和语用发展；“不断高喊”体现未完成时的持续性。所有脚注标记均置于正文相应位置。
