  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: zh_hans
  text: 于是，耶稣对他们说：“光还在你们中间[a]，但只有一小段时间。你们要趁着有光的时候行走，免得黑暗追上你们。那在黑暗中行走的人，不知道自己往哪里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你们里面”或“与你们同在”。希腊语短语可有不止一种理解；按当前语境，“在你们中间”最符合耶稣仍公开地临在众人当中的意思。
    reason: 保留ἐν ὑμῖν在关系和空间意义上的真实歧义。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 作为自然的叙事连接词，承接上文的问答，又不把逻辑推论表达得过强。
- source_word: Ἔτι μικρὸν χρόνον
  choice: 时候不多了
  rationale: 用现代汉语自然表达“仍只有短暂时间”的紧迫感，同时保留时间有限之意。
- source_word: τὸ φῶς
  choice: 光
  rationale: 直译这一核心意象，保留《约翰福音》中光的隐喻和基督论含义，不在正文中加以解释。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 就当前公开讲话的场景而言，最自然地指光仍在听众当中；希腊语也可能理解为“在你们里面”或“与你们同在”，故用脚注保留歧义。
- source_word: περιπατεῖτε
  choice: 行走
  rationale: 保留希腊文“行走”的具体意象及其生活方式层面的隐喻，不将其扁平化为“生活”或“行事”。
- source_word: ὡς τὸ φῶς ἔχετε
  choice: 趁着有光的时候
  rationale: 按时间意义理解ὡς，表达在仍拥有光时就应行动的紧迫性。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 以简洁、自然的现代汉语表达否定目的或所要避免的结果。
- source_word: σκοτία
  choice: 黑暗
  rationale: 采用标准对应词，保留约翰著作中光与黑暗的鲜明对照。
- source_word: καταλάβῃ
  choice: 追上
  rationale: 保留动词所含追及、攫住的动态画面，也与“行走”意象自然呼应；“胜过”或“笼罩”虽可取，却会改变侧重点。
- source_word: ὁ περιπατῶν ἐν τῇ σκοτίᾳ
  choice: 那在黑暗中行走的人
  rationale: 以自然的汉语泛指结构再现带冠词的分词短语，并保留“在黑暗中行走”的意象。
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: 不知道自己往哪里去
  rationale: 符合现代汉语表达，准确保留不知道去向的方向性含义。
theological_decisions:
- issue: “光在你们中间”（ἐν ὑμῖν）所表达的关系
  choice: 在你们中间
  alternative: 在你们里面；与你们同在
  rationale: 上下文首先指向耶稣作为光在众人当中的有限公开临在，因此正文采用“在你们中间”；但介词短语本身可有内在或伴随关系的理解，脚注保留这些可能，避免把神学张力静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“光—黑暗”“行走—追上”的连贯意象；正文措辞简洁，并以脚注交代无法在单一译法中完整呈现的歧义。
