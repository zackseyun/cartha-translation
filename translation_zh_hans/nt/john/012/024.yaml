  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：一粒麦子若不落在地里死去，就仍旧只是一粒[a]；但若死去，就结出许多果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就仍旧独自存在。”
    reason: lexical_alternative
  - marker: b
    text: 这里的比喻是麦粒必须在地里死去，才能结出果实；按上下文，耶稣以此指向自己的死，也指向跟从他的人。
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地
  rationale: 约翰福音中重复的ἀμήν构成庄严而强调的引言公式。“实实在在”既保留重复和强调，也符合现代汉语中庄重、易懂的表达。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 保留复数受词和直接宣告的语气；相较“对你们说”，此处“告诉你们”更自然，同时不增添解释。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 准确表达否定条件，简洁而庄重；“除非”也可行，但与后文“若”搭配时，“若不……但若……”更清楚地呈现原文对照。
- source_word: ὁ κόκκος τοῦ σίτου
  choice: 一粒麦子
  rationale: κόκκος指谷粒或种粒。现代汉语“一粒麦子”自然地保留农业意象，又不把它过度限定为植物学意义上的“种子”。
- source_word: πεσὼν εἰς τὴν γῆν
  choice: 落在地里
  rationale: 将分词按汉语条件句自然处理，并以“地里”表达农业语境中的γῆ；这比“落到地面”更能体现种粒进入土中的画面。
- source_word: ἀποθάνῃ
  choice: 死去
  rationale: 保留原文直接的死亡用语及其隐喻张力，不弱化为“腐烂”或解释为“埋下”。
- source_word: αὐτὸς μόνος μένει
  choice: 就仍旧只是一粒
  rationale: 表达种粒继续单独存在、不能产生更多果实的意思。“只是一粒”在汉语中自然，并保留αὐτός μόνος的强调；脚注列出更形式对应的译法。
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: 但若死去
  rationale: “但”清楚呈现δέ与前句的转折对照，同时保持简练。
- source_word: πολὺν καρπὸν φέρει
  choice: 就结出许多果实
  rationale: “结果实”是φέρω καρπόν在农业比喻中的自然汉语对应；“许多”保留πολύς的数量含义，不扩译为“丰收”。
theological_decisions:
- issue: 农业比喻中隐含的基督论及门徒道路
  choice: 正文保留麦粒死亡并结果的农业图像，不明说其所指。
  alternative: 在正文中解释为耶稣借自己的死使许多人得生命，并将此模式应用于跟随者。
  rationale: 上下文使耶稣之死及门徒道路成为重要指向，但本节本身只陈述比喻。保留图像可避免把上下文解释写入正文，同时脚注适度提示其语境功能。
- issue: ἀποθάνῃ“死去”的隐喻力度
  choice: 两处均直译为“死去”。
  alternative: 译为“腐烂”“消亡”或“埋在土里”。
  rationale: 原文明确使用“死”这一动词；保留它维持耶稣话语中从死亡到丰盛结果的神学张力，不以农业解释削弱措辞。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“我实实在在地告诉你们”保留约翰福音引言公式的郑重与重复；全句以“若不……但若……”呈现原文鲜明对照。正文不展开比喻的神学解释，脚注则提供必要的语境提示。
