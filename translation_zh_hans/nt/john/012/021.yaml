  to: 于是，这些人来到加利利伯赛大的腓力那里，向他请求说：“先生[a]，我们想见耶稣。”
  rationale: 修订使腓力的籍贯限定关系更清楚，改善“请求他说”的现代汉语搭配，并以“这些人”保留 οὗτοι 的指示作用。正文仍将 κύριε 译为符合语境的“先生”，脚注保留“主”这一可行的词汇对应及其多义性。
