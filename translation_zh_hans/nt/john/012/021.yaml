  source_fidelity: 原文 οὗτοι 指回上节的希腊人，宜在中文中保留“这些人”以维持指示与衔接。τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας 是对腓力的限定说明，译为“加利利伯赛大的腓力”准确自然。ἠρώτων 为未完成时，中文无需强加“不断”，但应以自然的“向他请求”表达。κύριε 是对腓力的礼貌称呼，正文译“先生”符合语境；脚注保留“主”的可能译法。
  naturalness: 原译“腓力是加利利的伯赛大人”虽可理解，但“伯赛大人”在现代汉语中可能被读作伯赛大居民的泛称，且以分号插入解释稍显生硬。“加利利伯赛大的腓力”更紧凑、清晰。原译“他们请求他说”搭配不够自然，改为“向他请求说”较顺畅。
  terminology: “腓力”“加利利”“伯赛大”“耶稣”均为通行圣经译名。“先生”恰当地反映此处 κύριε 对人的尊称，不将其预设为对腓力的神圣称号；脚注说明其亦可译“主”。
