id: JHN.12.21
reference: John 12:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: zh_hans
  text: 于是，这些人来到加利利伯赛大的腓力那里，向他请求说：“先生[a]，我们想见耶稣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主”。希腊语 κύριε 可意为“主”，也可用作对人的礼貌称呼；此处用于称呼腓力。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: 他们
  rationale: 指上一节所说的那些希腊人。现代汉语用“他们”承接自然；“于是”同时保留与上文的叙事联系，无须生硬译作“这些人”。
- source_word: οὖν
  choice: 于是
  rationale: 在此推动叙事并连接前文；“于是”比“所以”更符合现代汉语叙事语体。
- source_word: προσῆλθον
  choice: 来到……那里
  rationale: 表达 προσέρχομαι 的趋近含义，语气自然，也不额外推定他们原先所在的位置。
- source_word: Φιλίππῳ
  choice: 腓力
  rationale: 采用该人名在现代中文圣经传统中的通行译名。
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: 腓力是加利利的伯赛大人
  rationale: 将希腊文限定性的介词短语转成自然的补充说明；“加利利的伯赛大”保留原文的地理归属关系。
- source_word: ἠρώτων
  choice: 请求
  rationale: ἐρωτάω 在此语境表示有所求地询问或请求；未完成时态的持续意味可由上下文体会，若硬译“不断请求”会过度强调。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出直接引语，同时保留原文发言动作。
- source_word: Κύριε
  choice: 先生
  rationale: 这里是对腓力的直接称呼，κύριε 最自然地表示礼貌尊称“先生”，不宜在正文中译为可能让读者误以为腓力具有神圣身份的“主”。脚注保留字面的另一种译法。
- source_word: θέλομεν
  choice: 我们想
  rationale: 准确表达 θέλω 的愿望含义，符合当代汉语请求语气。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 采用该名字的通行中文译法；汉语不需表达希腊文专名前的冠词。
- source_word: ἰδεῖν
  choice: 见
  rationale: 保留 ὁράω 的基本含义；语境或暗示会面，但不擅自扩译为“求见”或“交谈”。
theological_decisions:
- issue: 对腓力的称呼 κύριε 如何翻译
  choice: 先生
  alternative: 主
  rationale: 该呼格直接用于腓力，在此很可能是普通的礼貌称呼，而非神学性的“主”。正文采用符合语境且不引起神学误解的“先生”，并以脚注保存“主”这一词汇对应及原文的多义性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上一节；以分号划分来访动作与腓力籍贯说明，避免关系从句过长。直接引语保持简洁、礼貌。
