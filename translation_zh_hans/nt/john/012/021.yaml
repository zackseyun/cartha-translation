    rationale: 原文是“来自加利利伯赛大的腓力”，不是泛指“加利利的伯赛大人”；中文将地名直接置于“人”前可能造成短暂歧义。
  - severity: low
    issue: “他们请求他说”搭配不够自然。
    rationale: 现代汉语通常说“向他请求说”“向他提出请求，说”或“求他说”；需调整而不改变请求的内容。
  - severity: low
    issue: οὗτοι 的指示性未在正文中体现。
    rationale: “他们”可以承接上文，但“这些人”更能对应原文 demonstrative，并明确指回上节的希腊人。
