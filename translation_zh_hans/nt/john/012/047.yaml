  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: zh_hans
  text: 若有人听见我的话，却不遵守[a]，我不审判[b]他[c]；因为我来不是要审判世界，而是要拯救世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遵守”也可译作“持守”或“保守”；原词兼有守护、持守和遵行的含义。
    reason: lexical_alternative
  - marker: b
    text: “审判”在此语境中也可含“定罪”的意思；本节两处使用同一个希腊动词。
    reason: lexical_alternative
  - marker: c
    text: 原文作阳性单数“他”，在这里具有泛指作用，适用于任何听见却不遵守耶稣话语的人。
    reason: generic_pronoun
lexical_decisions:
- source_word: ἐάν τίς
  choice: 若有人
  rationale: 保留不定条件句所表达的开放、泛指意义，中文自然简洁。
- source_word: ἀκούσῃ
  choice: 听见
  rationale: 按基本义翻译，不用“听从”，以免提前加入顺从回应的含义。
- source_word: μου…τῶν ῥημάτων
  choice: 我的话
  rationale: 指耶稣说出的话语；此译法自然庄重，也不过度风格化。
- source_word: μὴ φυλάξῃ
  choice: 却不遵守
  rationale: φυλάσσω可指保守、持守或遵行；在约翰语境中常包含忠实遵行的意思。“遵守”符合现代汉语，同时以脚注保留较宽的译法。
- source_word: οὐ κρίνω αὐτόν
  choice: 我不审判他
  rationale: κρίνω在本句目的从句中再次出现，统一译作“审判”可保留词语呼应及约翰福音中有关审判的神学张力；αὐτόν按单数代词译作“他”。
- source_word: οὐ γὰρ ἦλθον ἵνα κρίνω
  choice: 因为我来不是要审判
  rationale: ἦλθον概括耶稣来到世上的使命，ἵνα从句表达目的；此译法符合现代汉语。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: κόσμος在约翰福音中通常指处于堕落秩序中的人类世界；不宜无根据地缩窄为某一群体。
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: 而是要拯救世界
  rationale: σῴζω是核心救恩用语，“拯救”既准确又庄重，并与前面的使命目的形成对照。
theological_decisions:
- issue: “我不审判他”与约翰福音其他审判经文之间的关系
  choice: 保留“审判”，不增添时间限定
  alternative: 译作“定他的罪”，或释义为“我现在不审判他”
  rationale: 本节强调耶稣此次来到世上的使命以拯救为目的；原文没有明说“现在”，而κρίνω本身也不必限于定罪。直译可保留与其他约翰审判经文之间的张力。
- issue: αὐτόν的泛指单数形式
  choice: 译作“他”，并以脚注说明泛指
  alternative: 译作“那人”或重复“这个人”
  rationale: 原文以阳性单数代词承接泛指的τίς；中文“他”可照应单数形式，但需说明此处并非仅指男性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“若有人……却……”清楚表达一般性条件；两个“审判”和两个“世界”均照原文重复，以保留修辞对照和神学张力。
