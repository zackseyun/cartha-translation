revisions:
- from: 于是，那群在耶稣呼唤拉撒路走出坟墓、使他从死人中复活时和他在一起的人，一直在作见证[a]。
  to: 所以，当耶稣呼唤拉撒路从坟墓里出来、使他从死里复活时，跟耶稣在一起的那群人不断地作见证[a]。
  rationale: 修订避免将“走”作为原文未指明的动作方式，消除“他”的潜在指代含混，并以自然的“从死里复活”表达复活。保留“所以”对οὖν的承接作用、“那群人”对特定人群的限定，以及“不断地作见证”对未完成体持续性的表达。
