  - severity: low
    issue: “和他在一起”中的代词指向不够即时明确。
    rationale: 在较长的时间从句之后，“他”可能需要读者回指到先前的“耶稣”；直接说“跟耶稣在一起”更清楚。
  - severity: low
    issue: “从死人中复活”不够符合现代标准汉语中的惯用圣经表达。
    rationale: “从死里复活”自然地表达ἐκ νεκρῶν，同时不损失其复活含义。
