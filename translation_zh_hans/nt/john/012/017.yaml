  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: zh_hans
  text: 所以，当耶稣呼唤拉撒路从坟墓里出来、使他从死里复活时，跟耶稣在一起的那群人不断地作见证[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不断作证”；希腊语动词可指作证或作见证，是《约翰福音》中反复出现的主题。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: 一直在作见证
  rationale: 未完成时在此描写持续进行的见证行动；“作见证”也保留《约翰福音》中 μαρτυρέω 的主题性用语。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推动叙事，现代汉语中自然，同时不把逻辑关系表达得过强。
- source_word: ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ
  choice: 那群……和他在一起的人
  rationale: 带冠词的分词结构限定了特定的一群人；汉语采用前后呼应的关系结构，以免修饰语过度堆叠。
- source_word: ἐφώνησεν
  choice: 呼唤
  rationale: 准确表达耶稣向拉撒路发声召唤，不额外强化为“高声喊叫”。
- source_word: ἐκ τοῦ μνημείου
  choice: 走出坟墓
  rationale: μνημεῖον 指埋葬之处；结合 ἐκ，以“走出坟墓”自然表达拉撒路被呼唤出来的动作。
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: 使他从死人中复活
  rationale: 表达耶稣使拉撒路脱离死亡而活过来的事实，并保留 ἐκ νεκρῶν“从死人中”的群体性意象。
theological_decisions:
- issue: 如何表述拉撒路从死人中被兴起
  choice: 使他从死人中复活
  alternative: 使他从死里复活
  rationale: 原文明确把行动归于耶稣，并说拉撒路从死人中被兴起；所选译法保留神迹陈述，不加以淡化或作额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直在作见证”体现未完成时的持续性；较长的限定成分按汉语习惯展开，同时保留“那群人”所指的特定群体。
