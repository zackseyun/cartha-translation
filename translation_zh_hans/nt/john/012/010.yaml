  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: zh_hans
  text: 于是，祭司长们决定也要杀掉拉撒路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，祭司长们计划也要杀掉拉撒路。”
    reason: “ἐβουλεύσαντο”既可侧重商议后作出“决定”，也可按语境译为“计划”；正文采用更能体现其明确意向的“决定”。
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: 决定
  rationale: 此处表示经过商议而形成明确意图；“决定”自然清楚，也保留了蓄意采取行动的含义。
- source_word: δὲ
  choice: 于是
  rationale: δέ在这里承接上文，推进叙事并体现因果脉络；“于是”比“但是”更符合语境，又比单用“而”更清楚。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长们
  rationale: 复数形式指当时祭司阶层中的领袖群体；“祭司长们”准确体现复数，也符合现代汉语圣经语域。
- source_word: ἵνα
  choice: 要
  rationale: 在表示决定的动词之后，ἵνα加虚拟式表达决定的内容或目的；汉语用“决定也要……”自然传达这一关系。
- source_word: καὶ
  choice: 也
  rationale: 表示拉撒路也被列为杀害对象；“也”准确保留其附加意义，不额外强化。
- source_word: τὸν Λάζαρον
  choice: 拉撒路
  rationale: 按现代中文通行译名音译该人名；希腊语冠词无需在汉语中另行表达。
- source_word: ἀποκτείνωσιν
  choice: 杀掉
  rationale: 该词意为杀死、置于死地；“杀掉”直接自然，不暗示正式司法处决，也不加入“谋杀”所带的额外道德定性。
theological_decisions:
- issue: 祭司长们对拉撒路的意图如何表述
  choice: 直述他们决定杀掉拉撒路，不补充动机，也不使用“密谋”等更强措辞
  alternative: 译作“密谋杀害”或“图谋杀死”
  rationale: 原文清楚表达经过商议形成的杀人意图，却没有使用专指阴谋或密谋的词；译文保留其蓄意性和严重性，同时不增加经文本身未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祭司长们”明确呈现原文复数；“杀掉”较口语化但仍适合现代标准汉语，并避免“处死”可能暗示的司法程序。脚注标记[a]已在正文中对应出现。
