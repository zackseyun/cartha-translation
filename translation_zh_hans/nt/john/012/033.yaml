  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: zh_hans
  text: 他说这话，是要表明自己将要怎样死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将要以怎样的方式死。”希腊语表达可着重指死亡的方式。
    reason: 保留ποίῳ θανάτῳ在“何种死亡”与“以何种方式死亡”之间的表达幅度。
lexical_decisions:
- source_word: τοῦτο
  choice: 这话
  rationale: 中性单数指示代词回指耶稣前面所说的话；汉语用“这话”比孤立的“这”更自然清楚。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ仅有轻微承接或转折作用；现代汉语句间关系已足够清楚，硬译为“但”会夸大对比。
- source_word: ἔλεγεν
  choice: 他说
  rationale: 未完成时在此交代前一句话的含义；汉语通常用简单过去叙述最自然，不必机械体现持续体。
- source_word: σημαίνων
  choice: 是要表明
  rationale: 分词说明他说这话所起的指示作用；“表明”保留了借言语指示某事的含义，也符合约翰文体。
- source_word: ποίῳ θανάτῳ
  choice: 怎样死
  rationale: 疑问词与“死亡”的与格共同表达死亡的方式或种类；“怎样死”是自然现代汉语，并保留方式层面的含义。
- source_word: ἤμελλεν
  choice: 将要
  rationale: 表达预期将发生的事，不额外加入“命定”等较强神学含义。
- source_word: ἀποθνῄσκειν
  choice: 死
  rationale: 作为μέλλω的补足不定式，直译为“死”准确自然。
theological_decisions:
- issue: 是否在正文中明说十字架刑
  choice: 保留间接说法“自己将要怎样死”
  alternative: “自己将要被钉十字架而死”或“自己将要怎样被处死”
  rationale: 本节只说明耶稣的话指示其死亡方式，并未直接点明钉十字架。上下文虽可使读者理解为十字架刑，正文仍应保留原文的间接性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“他说这话”自然回指上文；“是要表明”清楚表达解释功能；脚注标记[a]已置于正文对应位置。
