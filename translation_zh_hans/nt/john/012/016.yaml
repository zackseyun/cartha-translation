  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: zh_hans
  text: 他的门徒起初不明白这些事[a]；但耶稣得了荣耀[b]以后，他们才想起：这些事早已写下，是关于他的[c]；人们也对他做了这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“起初不知道这些事。”
    reason: lexical_alternative
  - marker: b
    text: 约翰福音所说耶稣“得荣耀”，通常与他的受死、复活和升高有关。
    reason: cross_reference
  - marker: c
    text: 也可译为：“这些事早已写着，论到他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: 不明白
  rationale: 这里不只是门徒不知道事实，而是尚未领会这些事的意义；“不明白”符合上下文，同时保留“认识、知道”的语义范围，并以脚注注明另一译法。
- source_word: αὐτοῦ οἱ μαθηταί
  choice: 他的门徒
  rationale: 属格代词表达归属或关联；“他的门徒”是自然、准确的现代汉语。
- source_word: τὸ πρῶτον
  choice: 起初
  rationale: 这是表示时间的习语，意为“起先、最初”；“起初”简洁而庄重。
- source_word: ἐδοξάσθη
  choice: 得了荣耀
  rationale: 保留约翰福音中 δοξάζω 的神学分量和被动含义，不将其窄化为单纯的“受尊崇”或“被高举”。
- source_word: ἐμνήσθησαν
  choice: 他们才想起
  rationale: “想起”自然表达该动词在叙事中的意义；“才”呈现 τότε 所标示的时间转折。
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: 早已在经上指着他写了
  rationale: “指着他”表达 ἐπί 加与格在此处“论到、关于”的意思；“早已……写了”体现经文在门徒想起以前已经写成的状态。
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: 人们也这样待了他
  rationale: 原文未明说主语，动词第三人称复数可泛指先前参与这些行动的人；“人们”使现代汉语句子清楚。“这样待了他”保留 αὐτῷ 的对象关系，不擅自解释为“为他做”。
- source_word: ταῦτα
  choice: 这些事／这样
  rationale: 前两处译为“这些事”，指前文所述行动和细节的整体；末处按汉语习惯译为“这样”，仍清楚回指同一组事情。
theological_decisions:
- issue: 耶稣“得荣耀”的范围
  choice: 保留“得了荣耀”，不在正文中限定所指事件
  alternative: 被高举；受了尊荣；明确释为复活升天
  rationale: 约翰福音的“得荣耀”具有层叠含义，可涉及耶稣的受死、复活与升高。正文保留这一神学张力，脚注提供语境说明而不把含义限于其中某一事件。
- issue: 门徒后来想起的两重内容
  choice: 保留“经上……写了”与“人们也这样待了他”两个并列事实
  alternative: 将后半句释为人们应验了经文
  rationale: 原文仅用 καί 连接两项内容，并未明说“应验”；译文不额外加入因果或应验措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用分号和冒号清楚呈现“起初不明白—得荣耀以后想起”的时间推进；避免教会内部术语，并保留原文后半句未明说主语及“得荣耀”的解释空间。
