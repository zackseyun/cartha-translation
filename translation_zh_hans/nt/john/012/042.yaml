id: JHN.12.42
reference: John 12:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: zh_hans
  text: 然而，连官长中也有许多人信了他；但因为法利赛人的缘故，他们没有公开承认，免得被排除在会堂群体之外。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得被赶出会堂”或“免得被逐出会堂”。希腊文所指的是被排除在会堂共同体之外。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: 然而
  rationale: 这一组语气词强化让步和转折；“然而”在现代汉语中简洁自然，也准确承接上文。
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: 连官长中也有许多人
  rationale: ἐκ加属格表示群体归属；“官长”指当时犹太群体中的领袖或权威人士，“连……也”体现καί在此处的强调意味。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 信了他
  rationale: 约翰常用πιστεύω εἰς表示信靠的对象是耶稣；“信了他”自然简明，同时不预先判定这种信是否达到某种神学定义。
- source_word: διὰ τοὺς Φαρισαίους
  choice: 因为法利赛人的缘故
  rationale: διά加宾格在此表示原因。译文不加入原文未明说的“害怕”，以保持措辞克制。
- source_word: οὐχ ὡμολόγουν
  choice: 没有公开承认
  rationale: ὁμολογέω在此表示公开承认或表明立场；未完成时态呈现持续或一贯不这样做的状态。希腊文未明说宾语，因此中文也不补成“承认他”或“承认这信仰”。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁表达为避免某种结果而采取行动的目的意味。
- source_word: ἀποσυνάγωγοι γένωνται
  choice: 被排除在会堂群体之外
  rationale: ἀποσυνάγωγος表示遭到会堂共同体的排斥；此译法体现社会与宗教群体层面的隔绝，而不把它限定为某种正式司法程序。
theological_decisions:
- issue: 这些官长对耶稣之信的性质
  choice: 按字面译作“信了他”，同时保留他们没有公开承认的张力
  alternative: 弱化为“自称相信”，或强化为“真正得救了”
  rationale: 经文一方面明说他们信了耶稣，另一方面又指出他们没有公开承认。译文不应替经文裁定其信心最终的属灵性质。
- issue: 未明说的承认对象
  choice: 不补出宾语，译作“没有公开承认”
  alternative: “没有公开承认他”或“没有公开承认这事”
  rationale: 希腊文此处没有明示宾语；保留省略可避免把承认的内容过度限定为耶稣本人或一项事实。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“官长”保留约翰福音语境中的权威群体称谓；“会堂群体”用于明确这里不仅是离开一座建筑，更涉及共同体资格。
