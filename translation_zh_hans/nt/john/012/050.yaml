  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: zh_hans
  text: 我知道，他的命令就是永生[a]。所以，我所说的，正如父对我所说的那样，我就照样说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的命令带来永生”，或“他的命令关乎永生”。希腊文直译为“他的命令就是永生”。
    reason: 保留希腊文等同式表达，同时提示它在语境中可能表示结果或内容关系。
lexical_decisions:
- source_word: ἐντολή
  choice: 命令
  rationale: “命令”自然、准确地表达具有权威的吩咐；相比“诫命”，较少让现代读者误以为这里专指某一条成文律法。
- source_word: ζωὴ αἰώνιος
  choice: 永生
  rationale: “永生”是约翰著作中这一固定表达在现代汉语里的标准译法，兼具无尽生命与属于将来世代之生命的神学含义。
- source_word: οἶδα
  choice: 我知道
  rationale: 直接表达说话者确定无疑的认知，语气自然且庄重。
- source_word: ἃ
  choice: 我所说的
  rationale: 以汉语名词化结构自然表达中性复数关系代词所指的内容，不必生硬译成“那些事”。
- source_word: λαλῶ
  choice: 说
  rationale: 两个 λαλέω 均译为“说”，保留原文刻意的动词重复，同时符合现代汉语习惯。
- source_word: καθώς ... οὕτως
  choice: 正是照着……那样
  rationale: 保留原文“怎样……就怎样”的对应关系；“正是”加强这种一致性，却不额外加入“完全”等原文未明说的程度。
- source_word: εἴρηκέν μοι
  choice: 对我说的
  rationale: 自然表达父已经向耶稣说话且其话持续有效；汉语通常无须用额外体标记硬译希腊语完成时。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 保留原文的关系性称谓，不增添原文没有的“我的”；在本语境中“父”可明确指神。
- source_word: οὖν
  choice: 所以
  rationale: 自然标明后一分句由前述事实引出的逻辑关系。
theological_decisions:
- issue: “他的命令就是永生”的确切关系
  choice: 正文保留等同式“就是永生”
  alternative: 可理解为“他的命令带来永生”或“他的命令关乎永生”
  rationale: 希腊文以系词 ἐστιν 直接连接“命令”与“永生”。正文不把这一具有神学张力的表达缩窄为结果或内容关系，可能的理解另置脚注。
- issue: 耶稣的话与父所说之话的对应
  choice: 译作“正是照着父对我说的那样说”
  alternative: 可较强地译作“父怎样吩咐我，我就完全怎样说”
  rationale: 原文强调对应一致，但没有在后半句再次使用“命令”一词，也没有明说“完全”，因此避免把这种关系解释得过窄或过强。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“命令就是永生”保留原文不寻常的凝练表达；后句保留两个“说”以反映原文重复，句式则按自然汉语调整。
