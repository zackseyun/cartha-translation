  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: zh_hans
  text: 他使他们的眼睛瞎了，又使他们的心刚硬，免得他们用眼睛看见、心里明白、回转[a]，我便医治他们。[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“转回”；这里可指归回或归向神，但原词本身没有限定为专门的教会术语。
    reason: lexical_alternative
  - marker: b
    text: 本句引自《以赛亚书》6:10。
    reason: cross_reference
  - marker: c
    text: “我便医治他们”：希腊文动词是将来时；在本句的目的／结果结构中，也可译作“我必医治他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: 使……眼睛瞎了
  rationale: 完成时表示先前行动所造成的持续状态；汉语“使……瞎了”自然地表达致使含义及其现存结果。
- source_word: ἐπώρωσεν
  choice: 使……心刚硬
  rationale: 保留πωρόω所表达的刚硬、麻木之意，也保留引文中审判性刚硬的张力。
- source_word: καρδίαν / καρδίᾳ
  choice: 心 / 心里
  rationale: 保留圣经中“心”的意象；νοήσωσιν所表达的认知意义由“明白”体现。原文单数具有集合意义，中文“他们的心”可自然承载这一点。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达否定性的目的或结果，同时不强行判定二者中的哪一种。
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: 眼睛看见
  rationale: 保留原文具体意象及其与“心里明白”的平行结构。
- source_word: νοήσωσιν
  choice: 明白
  rationale: 准确表达心智上的领会，在现代汉语中自然清楚。
- source_word: στραφῶσιν
  choice: 回转
  rationale: 既保留转回、归回的先知性语汇，也避免直接采用带有较窄教会术语色彩的“归信”。
- source_word: ἰάσομαι
  choice: 我就会医治他们
  rationale: “医治”准确对应ἰάομαι；“就会”既照顾希腊语将来时，也在整句结构中自然呈现与“回转”相关的后续结果。
theological_decisions:
- issue: 使人眼瞎和心刚硬的施事者
  choice: 保留明确的单数主语“他”及主动致使表达
  alternative: 改用无施事者的被动句，弱化神圣施事
  rationale: 希腊文以单数主语明确实施“使瞎”和“使刚硬”的行动；译文不应消解这项审判性陈述所带来的神学张力。
- issue: στραφῶσιν的归回含义
  choice: 正文译作“回转”
  alternative: 归信；悔改；被改变
  rationale: “回转”保留动词本身较宽的语义和以赛亚引文的先知性表达，不把特定教义解释写入正文。
- issue: ἰάσομαι在否定目的／结果结构中的关系
  choice: 译作“我就会医治他们”
  alternative: 我必医治他们；我便医治他们
  rationale: 希腊语形式是将来时，但它在引文中接续“看见、明白、回转”这一系列内容；“就会”在中文中保留将来／后续意味及隐含条件关系，而不把语法关系解释得过死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“眼睛看见—心里明白”保留原文平行结构；“他们的心”保留原文集合性单数。正文避免以“归信”等较专门的宗派或教会术语替代“回转”。
