  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: zh_hans
  text: 而我若从地上被举起来[a]，就要把所有人都吸引到我这里来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若”也可按这里的语境译作“当……时”。“被举起来”既指耶稣在十字架上被举起，也含有他被高举、得荣耀的意思。
    reason: alternative_reading_and_lexical_double_meaning
lexical_decisions:
- source_word: κἀγὼ
  choice: 至于我，我
  rationale: κἀγώ由καί与ἐγώ缩合而成，兼有承接与轻微强调作用；译为“至于我，我”在现代汉语中自然地凸显主语，并衔接上文。
- source_word: ἐὰν
  choice: 若
  rationale: ἐάν接虚拟语气，形式上是条件表达。虽然上下文表明耶稣受死是将要发生的事，正文仍保留“若”，不把原文的条件形式无声改成时间从句。
- source_word: ὑψωθῶ
  choice: 被举起来
  rationale: ὑψόω在约翰福音中同时可指身体在十字架上被举起和受高举、得荣耀；“被举起来”保留这一双关，不将意义限于其中一面。
- source_word: ἐκ τῆς γῆς
  choice: 从地上
  rationale: γῆ在此指地面或大地；“从地上”符合十字架场景，也比“从土地”更自然。
- source_word: πάντας
  choice: 众人
  rationale: 阳性复数宾格在此自然指人。“众人”保留广泛范围，同时不额外裁定是每一个人还是各类人。
- source_word: ἑλκύσω
  choice: 吸引
  rationale: ἕλκω可表示拉、牵引。此处“吸引”是自然且庄重的汉语，并保留人被引向耶稣的方向性；不进一步规定这种吸引的作用方式。
- source_word: πρὸς ἐμαυτόν
  choice: 到我这里来
  rationale: πρός表示朝向，ἐμαυτόν是反身代词。“到我这里来”在现代汉语中自然地表达以耶稣自己为归向。
theological_decisions:
- issue: πάντας的范围与救恩论的关系
  choice: 众人
  alternative: 所有人；所有种类的人；万有
  rationale: 原文使用阳性复数，最自然是指人而非万有。译文保留其普遍广度，但不借翻译裁定后来关于“每一个人”或“各类人”的神学争论。
- issue: ὑψωθῶ在约翰福音中的双重含义
  choice: 被举起来
  alternative: 被高举；被钉上十字架
  rationale: “被举起来”能同时容纳十字架上的实际举起与受高举、得荣耀的含义；只译为“被高举”或“被钉上十字架”都会缩窄原文的张力。
- issue: ἐὰν的条件形式与事件的确定性
  choice: 若
  alternative: 当……时
  rationale: 上下文把耶稣之死呈现为迫近的确定事件，但希腊文仍采用条件形式。正文保留“若”，脚注说明语境中的确定性，以兼顾形式与语用。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“至于我，我”保留κἀγώ的承接和强调；“众人”避免生硬补出“所有的人”，也不缩窄原文范围。
