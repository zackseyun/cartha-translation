  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: zh_hans
  text: 正因如此，人群也去迎接他[a]，因为他们听说他行了这个记号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人群也与他相遇”，或“人群也出来迎接他”。原文动词含有前去与某人相会的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“神迹”。“记号”是约翰常用来指超常作为的词；这些作为指向耶稣的身份和使命。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 明确保留介词短语所表达的因果联系，并自然承接上文。
- source_word: καὶ
  choice: 也
  rationale: 保留连接词在此处的附加意义，不作过度强调。
- source_word: ὑπήντησεν αὐτῷ
  choice: 去迎接他
  rationale: ὑπαντάω含有前去与某人相会、迎接的方向意味；“去迎接他”在现代汉语中自然且较为准确。
- source_word: ὁ ὄχλος
  choice: 人群
  rationale: 准确表达聚集的群众，语言现代而庄重。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出人群采取行动的原因，采用因果连词最为清楚。
- source_word: ἤκουσαν
  choice: 他们听说
  rationale: 在此语境中，“听说”自然表达他们获悉有关耶稣所行之事的消息。
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: 他行了这个神迹
  rationale: 保留τοῦτο对刚提及之特定事件的指示作用；“行”符合汉语圣经语体，同时简洁自然。
- source_word: τὸ σημεῖον
  choice: 神迹
  rationale: “神迹”是现代汉语圣经语境中对σημεῖον的通行表达；脚注补明其核心为指向耶稣身份和使命的“记号”，避免只理解为奇异事件。
theological_decisions:
- issue: 约翰福音中σημεῖον的译法
  choice: 神迹
  alternative: 记号；奇迹
  rationale: 正文采用普通读者熟悉且自然的“神迹”，同时以脚注保留σημεῖον作为具有启示和指向作用之“记号”的约翰用法，避免抹去其神学内涵。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“正因如此”清楚衔接上文；“去迎接”保留动作的方向感。正文不补入“出来”等原文未明说的细节。脚注标记均置于相关词语之后。
