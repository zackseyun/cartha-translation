  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: zh_hans
  text: 于是，一大群犹太人[a]得知耶稣在那里，就来了。他们来不只是因为耶稣，也是为了见拉撒路；耶稣曾使他从死人中复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地区的人。”希腊语这个词既可泛指犹太人，也可在约翰福音的某些语境中特指犹太地区的人。
    reason: 保留Ἰουδαίων在民族宗教身份与地域身份之间的语义可能性。
lexical_decisions:
- source_word: Ἔγνω
  choice: 得知
  rationale: 此处不定过去时表示获知消息，而非单纯处于“知道”的状态；“得知”符合现代汉语叙事习惯。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，表达由前文情形引出的后续发展。
- source_word: ὄχλος πολὺς ἐκ τῶν Ἰουδαίων
  choice: 犹太人中有一大群人
  rationale: 既保留ὄχλος的群体性和πολύς所强调的规模，也用“中”体现ἐκ所表达的来源或所属范围。
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: 耶稣在那里
  rationale: 希腊文动词为现在时，汉语间接叙述无须时态回移；根据上下文明确补出省略的主语“耶稣”。
- source_word: ἦλθον
  choice: 就来了
  rationale: 保留叙事中的移动视角；“就”自然连接得知消息与前来这一行动。
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: 不只是因为耶稣
  rationale: διά加宾格在此表示原因或动机；该译法清楚自然。
- source_word: ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν
  choice: 也是为了看看拉撒路
  rationale: “为了”表达ἵνα引导的目的，“也”保留与“不只是”相配的递进对照；“看看”符合群众前来亲眼见证的自然汉语表达。
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: 就是耶稣使他从死人中复活的那个人
  rationale: 明确关系代词的先行词是拉撒路，并按上下文补明施事者耶稣；“从死人中复活”保留ἐκ νεκρῶν的表达，不将其弱化为一般的恢复生命。
theological_decisions:
- issue: 约翰福音中Ἰουδαίων的指称范围
  choice: 犹太人中
  alternative: 犹太地区的人中
  rationale: 该词可指犹太民族群体，也可在某些语境中特指犹太地区的人。此处逾越节公众场景较适合广义“犹太人”，但正文不赋予贬义，脚注保留地域性解释的可能。
- issue: 使拉撒路复活之人的身份
  choice: 明确译为“耶稣使他……复活”
  alternative: 保留代词“他使……复活”
  rationale: 希腊文主语由上下文承接耶稣；汉语若只用“他”容易与紧邻的拉撒路混淆，因此补出耶稣，不改变原文所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“一大群人”保留原文群体规模，“为了看看”自然表达目的；避免把“犹太人”处理成带有敌意或贬义的标签。
