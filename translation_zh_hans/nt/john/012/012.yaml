lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 第二天
  rationale: 自然表达叙事中的时间推进，准确对应这一时间状语。
- source_word: ὁ ὄχλος πολὺς
  choice: 一大群人
  rationale: 既表达ὄχλος所指的人群，也保留πολύς强调人数众多的含义，符合现代汉语习惯。
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: 来过节的
  rationale: 以定语结构自然修饰“人”；“过节”在此指参加该节期，简洁而不额外明确节期名称。
- source_word: ἀκούσαντες
  choice: 听说
  rationale: 该分词在意义上以群体中的众人为主语；“听说”自然表达他们得知后续消息的语义。
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: 耶稣正……来
  rationale: 用“正”保留希腊文历史现在时所呈现的进行中、临近发生的动态感。
- source_word: εἰς Ἱεροσόλυμα
  choice: 往耶路撒冷
  rationale: “往”准确表达εἰς与移动动词结合时朝向目的地的含义，也与耶稣尚在进城途中的语境相符。
