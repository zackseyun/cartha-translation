  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: zh_hans
  text: 于是，他们在那里为耶稣预备了晚餐。马大在服侍，拉撒路则是与耶稣一同坐席的人之一。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“与他一同斜倚而坐的人之一”。当时正式用餐通常斜倚而坐。
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν οὖν αὐτῷ δεῖπνον
  choice: 于是，他们为耶稣预备了晚宴
  rationale: “于是”保留οὖν承接上文的叙事作用；“预备了晚宴”自然表达ποιέω与δεῖπνον的搭配；“为耶稣”明确与格αὐτῷ所表示的受益对象，同时不擅自指明设宴者是谁。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留地点副词，按上下文回指伯大尼。
- source_word: ἡ Μάρθα διηκόνει
  choice: 马大在服侍
  rationale: “在服侍”体现未完成过去时所呈现的持续动作；不译成带教会职分色彩的用语，也不把原文未明说的具体服务内容加入正文。
- source_word: ὁ δὲ Λάζαρος
  choice: 拉撒路则
  rationale: “则”自然呈现δέ所标示的轻微对照，将马大的服侍与拉撒路坐席并列。
- source_word: εἷς ἦν ἐκ τῶν ἀνακειμένων σὺν αὐτῷ
  choice: 是与耶稣一同坐席的人之一
  rationale: “……之一”保留εἷς ἦν ἐκ的成员关系；“坐席”在现代汉语圣经语体中简洁表达古代用餐时斜倚的姿势，“与耶稣一同”清楚交代陪同关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“晚宴”比“筵席”更贴近δεῖπνον的一般含义，避免夸大规模；正文用“坐席”保持流畅，脚注说明原文所指的斜倚姿势。代词在中文中改为“耶稣”，以避免连续出现“他”造成指代不清。
