  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: zh_hans
  text: 于是，站在那里、听见这声音的群众说是打雷了；另一些人说：“一位天使已经对他说话了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节从天上发出的声音，并自然推进叙事；“于是”保留连接和结果意味。
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: 站在那里的众人
  rationale: 将完成时分词作定语处理，表达群众当时已站在那里并仍处于现场的状态；“众人”是现代汉语中自然的集合称呼。
- source_word: ἀκούσας
  choice: 听见了这声音
  rationale: 不定过去时分词表示听见先于议论；宾语在希腊文中省略，依上文补出“这声音”，使汉语表意清楚而不限定他们听懂了话语内容。
- source_word: ἔλεγεν
  choice: 都说
  rationale: 未完成时表现当时持续或纷纷作出的议论；集合主语在汉语中用“都说”自然表达，不强行译出机械的进行体。
- source_word: βροντὴν γεγονέναι
  choice: 是打雷了
  rationale: 准确传达间接引语“发生了雷声”，同时采用现代汉语最自然的说法“打雷了”，不把群众的判断改写成叙述者的断言。
- source_word: ἄλλοι
  choice: 另有人
  rationale: 指群众中持另一种解释的人；希腊文复数在汉语中可自然用不定数量的“另有人”表达。
- source_word: Ἄγγελος
  choice: 有天使
  rationale: 语境所指是从天而来的超自然使者，因此译为“天使”比泛称“使者”更符合此处用法；“有”自然引出不定指。
- source_word: αὐτῷ λελάληκεν
  choice: 对他说话了
  rationale: 与格译作“对他”，其所指依语境是耶稣；完成时表达已经发生且其结果仍与当前解释有关，汉语以句末“了”自然呈现。
theological_decisions:
- issue: ἄγγελος所指对象的性质
  choice: 天使
  alternative: 使者
  rationale: 群众是在解释来自天上的声音，语境支持超自然的“天使”；此译法只呈现群众的理解，并未断言实际发声者是天使。
- issue: 群众对声音的两种解释
  choice: 保留“打雷”与“天使说话”并列
  alternative: 将其中一种解释说明为真实情况
  rationale: 经文本身记录群众中不同的理解；译文不替叙述者裁定，也不消除这种张力。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事汉语。“这声音”依据上一节明示的天上声音补出；分号清楚区分群众中的两种说法。
