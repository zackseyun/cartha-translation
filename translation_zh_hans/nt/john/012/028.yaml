  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: zh_hans
  text: 父啊，愿你荣耀你的名。于是有声音从天上传来，说：“我已经荣耀了我的名，还要再荣耀它。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: 父啊
  rationale: 这是直接称呼上帝的呼格；“父啊”自然、庄重，也不添加原文没有的“我的”。
- source_word: δόξασόν
  choice: 愿你荣耀
  rationale: 以“愿你……”表达第三人称祈使语气，比生硬的命令式更符合现代汉语祷告用语；“荣耀”保留约翰福音中贯通的神学词汇。
- source_word: σου τὸ ὄνομα
  choice: 你的名
  rationale: 保留圣经中“名”所承载的身份、品格与启示意义，不将其窄化为“名声”。
- source_word: ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: 于是有声音从天上来
  rationale: “于是”自然呈现 οὖν 在此处的叙事推进作用；“声音”符合后续直接引语，并保留“来”与 ἦλθεν 的对应。
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: 我已经荣耀了我的名，还要再荣耀它
  rationale: “已经荣耀了”呈现过去行动的完成性及其当前关联；后半句的“再”对应 πάλιν。汉语需要补明宾语，首次补作“我的名”，继而以“它”避免重复过重。
theological_decisions:
- issue: 神圣回应中省略宾语的所指
  choice: 补明为“我的名”，随后用“它”回指
  alternative: 保持省略：“我已经荣耀了，还要再荣耀”
  rationale: 希腊文可由上文恢复宾语，但汉语若完全省略容易显得语义悬空；补明所指不引入新的对象。
- issue: 约翰福音中 δοξάζω 的译法
  choice: 荣耀
  alternative: 使……得荣耀；尊荣
  rationale: “荣耀”能够保留父与子之荣耀主题的词汇关联；“尊荣”语义偏弱，“使……得荣耀”在此处表达较为迂回。
- issue: 过去时 ἐδόξασα 的汉语体貌
  choice: 我已经荣耀了
  alternative: 我荣耀了
  rationale: 希腊文是不定过去时，本身不等同于完成时；但此处“已经……了”以自然汉语表达先前已完成的行动，同时不具体限定发生时间。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“父啊”保留祷告中的直接称呼；全节不使用过度古雅的“求你”“从天降下”等措辞。英文咨询稿中的脚注内容与其标记明显不对应：脚注讨论的是 ἐδόξασα，而标记却置于 Father 之后，因此未沿用该错误标记。
