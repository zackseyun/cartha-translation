  - severity: low
    issue: ἀπεκαλύφθη的被动表达
    rationale: “显露了”虽可通，但可能读作自行显现；“启示了”在“向谁”结构中更清楚保留被动揭示的意义。
  - severity: low
    issue: 脚注替代译法的措辞
    rationale: “我们听见的”在现代汉语中省略宾语后略不完整；“我们所听见的”更自然。ἀκοή在此较稳妥的替代为“我们的信息”，不宜把“传讲”作为与内容义完全等同的主要替代。
