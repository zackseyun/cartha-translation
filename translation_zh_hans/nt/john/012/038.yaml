  to: '为要应验先知以赛亚所说的话，正如他说：


    “主啊，我们所传的信息[a]，有谁信了呢？


    主的膀臂向谁启示了呢？”'
  rationale: 修订仅改善应验公式的中文表达、明确“被启示”的被动意义，并调整脚注措辞；不改变原文在目的与结果之间的解释张力，也不解释“膀臂”的比喻。
