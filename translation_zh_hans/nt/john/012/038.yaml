  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: zh_hans
  text: '为要应验先知以赛亚所说的话，正如他说：


    “主啊，我们所传的信息[a]，有谁信了呢？


    主的膀臂向谁启示了呢？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们所听见的”或“我们的信息”。
    reason: ἀκοή可指听见的内容或所传的信息；正文采用“我们所传的信息”，脚注保留可行的词义替代。
lexical_decisions:
- source_word: ἵνα
  choice: 这是要使……得以
  rationale: 承接上文的不信，并自然引出应验句式；中文表达不进一步限定这里究竟侧重目的还是结果。
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: 先知以赛亚所说的话
  rationale: λόγος 在应验引文的固定语境中指先知说出的话；这样译既贴近原文，也比生硬的“以赛亚的话语”更自然。
- source_word: πληρωθῇ
  choice: 得以应验
  rationale: 保留被动意味和约翰福音中的经文应验主题，同时与 ἵνα 后的虚拟式相称。
- source_word: Κύριε
  choice: 主啊
  rationale: 准确表达呼格，并保留经文中对主的直接呼求。
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: 我们所传的信息
  rationale: ἀκοή 在这里可指被人听见、传出的内容。“所传的信息”在现代汉语中清楚表达宣告内容，同时脚注保留其他可能理解。
- source_word: ὁ βραχίων κυρίου
  choice: 主的膀臂
  rationale: 保留圣经中以“膀臂”表示上帝能力与作为的原有比喻，不将其解释性改写。
- source_word: ἀπεκαλύφθη
  choice: 显露了
  rationale: 保留被动含义；现代汉语无需以额外助词强行对应希腊语时态，在反问句中表达自然。
theological_decisions:
- issue: 应验句中的目的与结果
  choice: 这是要使……得以应验
  alternative: 结果就应验了；为要应验
  rationale: ἵνα 在约翰的应验表述中可能兼有目的和结果意味。译文维持这种张力，不把不信单独解释为纯粹结果，也不强化为单一目的。
- issue: ἀκοή 所指的内容
  choice: 我们所传的信息
  alternative: 我们听见的；我们的传讲
  rationale: 该词既可涉及听见的行为，也可指所听见或传出的信息。正文采用最符合本处先知宣告语境的表达，脚注保留真实的词义可能。
- issue: “主的膀臂”的比喻
  choice: 保留“膀臂”
  alternative: 主的大能；主的作为
  rationale: 原文没有直接把比喻解释为能力或作为，因此保留形象，以免缩窄其神学内涵。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“膀臂”略带经文语体，但仍易懂，并有助于保存原文比喻。引文按诗行排布，以呈现其修辞平行结构。
