id: JHN.12.6
reference: John 12:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: zh_hans
  text: 他说这话，并不是因为他关心穷人，而是因为他是个贼；他保管着钱匣[a]，常把放进去的东西拿走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“钱袋”。希腊语这个词可指盛放钱财的匣子或袋子。
    reason: lexical_alternative
  - marker: b
    text: 也可译“常偷走放进去的东西”。这个动词通常有“拿、携带”的意思，但这里“他是个贼”的语境表明，这是指他把其中的财物据为己有。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: 他说这话
  rationale: δέ在此仅作轻微连接，汉语无需另加“但”或“这时”；“他说这话”直接、自然地表达原文。
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: 并不是因为他关心穷人
  rationale: οὐχ ὅτι引出被否定的动机；μέλει与间接受格表达对某人有所挂念，用“关心”符合现代汉语习惯。
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: 而是因为他是个贼
  rationale: “不是……而是因为……”保留原文对真实动机的鲜明对照；κλέπτης指暗中偷窃的人，译作“贼”比“强盗”准确。
- source_word: τὸ γλωσσόκομον ἔχων
  choice: 他保管着钱匣
  rationale: γλωσσόκομον在此是存放钱财的容器；ἔχων结合上下文表示犹大持有并经管它。“保管着”比字面的“拿着”更自然地表达这种持续职责。
- source_word: τὰ βαλλόμενα
  choice: 放进去的东西
  rationale: 保留原文较宽泛的中性复数表达，不把所放入的内容全部明定为“钱”，同时由“钱匣”交代语境。
- source_word: ἐβάσταζεν
  choice: 常……拿走
  rationale: 未完成时表示反复或持续发生；βαστάζω通常可指携带，但紧接“他是个贼”，在此有据为己有、拿走之意。“常……拿走”保留时态特征，也不把动词本身过度释义为“偷”。
theological_decisions:
- issue: ἐβάσταζεν是否直接译明犹大的偷窃行为
  choice: 常把放进去的东西拿走
  alternative: 保管着放进去的东西／常偷走放进去的东西
  rationale: “他是个贼”的直接语境强烈支持不只是中性地“携带”或“保管”。采用“拿走”既传达侵占含义，又让“贼”这一上下文说明行为性质，避免在动词本身上作过强释义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“钱匣”清楚呈现公用钱财容器，“保管着”说明犹大对其负有经管职责；用分号连接身份指控与具体行为，使汉语逻辑清晰。
