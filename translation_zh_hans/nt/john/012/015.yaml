base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: zh_hans
  text: “锡安的女儿啊[b]，不要惧怕[a]！看哪[c]，你的王正来到[d]，坐在一头驴驹上[e]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要害怕。”
    reason: lexical_alternative
  - marker: b
    text: “锡安的女儿”是先知书中把锡安或耶路撒冷人格化的称呼。
    reason: cultural_note
  - marker: c
    text: 或译：“看！”
    reason: lexical_alternative
  - marker: d
    text: 这里呼应撒迦利亚书9:9，呈现耶稣为应许给锡安的王。
    reason: cross_reference
  - marker: e
    text: 直译：“坐在驴的幼驹上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: 不要惧怕
  rationale: μή加φοβέομαι的现在时命令式构成禁止语，意为不要陷于惧怕；“不要惧怕”庄重、自然，也保留了先知话语的语气。
- source_word: θυγάτηρ Σιών
  choice: 锡安的女儿
  rationale: θυγάτηρ为呼格，Σιών为属格；该短语沿用先知书将锡安或耶路撒冷人格化为女子的表达。直译能保留其经文互文特征。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 该指示性语气词用于唤起注意。“看哪”在现代中文圣经语体中清楚而庄重，并能表现突出的宣告语气。
- source_word: ὁ βασιλεύς σου
  choice: 你的王
  rationale: 准确呈现带定冠词的名词和第二人称单数属格代词。中文无需借助字母大小写表达其王权及弥赛亚语境。
- source_word: ἔρχεται
  choice: 来了
  rationale: 现在时在引文中具有鲜明、临近的动态感；“来了”是自然中文宣告某人正在来到的常用说法。
- source_word: καθήμενος
  choice: 坐在
  rationale: 现在分词说明王来到时的姿态或方式。“坐在”直接对应原文，不额外加入“骑着”等虽合语境却未由该词明说的含义。
- source_word: ἐπὶ πῶλον ὄνου
  choice: 在一头驴驹上
  rationale: πῶλος指幼畜，ὄνου说明是驴；“一头驴驹”在中文中自然，并保留动物种类和幼小之意。
theological_decisions:
- issue: 与撒迦利亚书9:9的弥赛亚君王意象
  choice: 正文保留“锡安的女儿”和“你的王”等先知性称呼，不在正文中明说其应验意义
  alternative: 在正文中将“锡安的女儿”解释为耶路撒冷，或直接补明耶稣是所应许的弥赛亚君王
  rationale: 约翰以引文的措辞呈现耶稣的王权身份；翻译应保留互文线索和原文张力，而将其来源及意义放在脚注说明。
- issue: “王”的称号形式
  choice: 译作“你的王”，不另加尊称或神学限定语
  alternative: 译作“你的君王”或“你的弥赛亚君王”
  rationale: βασιλεύς的基本意义是“王”。“君王”也可成立，但“王”更直接；补入“弥赛亚”会把语境中的推论加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“看哪”略带经文宣告色彩，用来传达ἰδοὺ的强调功能；其余句法尽量自然简洁。标点按中文直接引语处理。
