  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: zh_hans
  text: 现在我心里很不安，我该说什么呢？“父啊，救我脱离这个时刻。”但我正是因此才来到这个时刻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νῦν
  choice: 现在
  rationale: 直接表达当前时刻，保留耶稣眼下面对受难时的紧迫感。
- source_word: ἡ ψυχή μου
  choice: 我心里
  rationale: ψυχή在此指耶稣内在的生命与自我；现代汉语用“心里”自然表达内心状态，避免“我的灵魂”可能造成身心二分的误解。
- source_word: τετάρακται
  choice: 忧乱
  rationale: 完成时形式强调受扰动后持续至今的状态；“忧乱”兼顾忧愁与震荡，比单纯“忧愁”更接近ταράσσω的力度。
- source_word: τί εἴπω
  choice: 我该说什么呢？
  rationale: 表达商议式虚拟语气所含的自问与斟酌，符合现代汉语表达。
- source_word: πάτερ
  choice: 父啊
  rationale: 保留对上帝直接而庄重的呼唤；“啊”自然标示呼格。
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: 救我脱离这时刻
  rationale: “救我脱离”保留命令式祈求及ἐκ所表达的脱离；“这时刻”在汉语中比“这小时”自然，同时仍可承载约翰福音中指定关键时刻的含义。
- source_word: ἀλλὰ διὰ τοῦτο
  choice: 然而，我正是为此
  rationale: ἀλλά表示鲜明转折，διὰ τοῦτο指出原因或目的；“正是”突出耶稣并非回避，而是确认使命。
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: 来面对这时刻
  rationale: 直译“来到这时刻”在现代汉语中略显生硬；“来面对”自然表达进入并承受这一指定时刻，同时不将εἰς直接改译为目的性的“为了”。
theological_decisions:
- issue: “父啊，救我脱离这时刻”是直接祈求，还是从“我该说什么呢”延伸出的反问内容？
  choice: 正文按直接祈求处理，并以引号标示耶稣向父所说的话。
  alternative: 可读作反问：“我该说什么呢？难道说：‘父啊，救我脱离这时刻’吗？”
  rationale: 最早的抄本没有原始标点，两种句法均有可能。SBLGNT正文标点支持直接祈求；如此既保留耶稣真实的忧乱，也保留随后接受使命的张力。脚注注明反问读法，避免武断消除歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“忧乱”保留原文强烈的内在震荡；“这时刻”在两处重复，以维持约翰福音的关键词呼应。正文中的[a]与脚注对应。
