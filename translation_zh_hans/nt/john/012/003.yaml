id: JHN.12.3
reference: John 12:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: zh_hans
  text: 于是，马利亚拿了一利特拉极贵的纯哪哒香膏[a][b][c]，抹在耶稣脚上，又用自己的头发擦他的脚。屋里就满了香膏的香气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利特拉”是罗马的重量单位，约合三百二十七克，大约三分之一千克。
    reason: cultural_note
  - marker: b
    text: “纯”所译的希腊词（πιστικῆς）词义有争议；也可理解为“纯正的”或“货真价实的”。
    reason: lexical_alternative
  - marker: c
    text: “哪哒”又称“甘松”，是一种可制成贵重香膏的芳香植物。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事；“于是”在现代汉语中自然，也保留了连接词的承接意味。
- source_word: λαβοῦσα
  choice: 拿了
  rationale: 希腊语为先于主要动作的简单过去时分词；译成汉语连动结构“拿了……抹在……”比直译为“拿着”更自然。
- source_word: λίτραν
  choice: 一利特拉
  rationale: 音译古罗马重量单位，以免用现代“磅”造成数值误解；具体重量在脚注说明。
- source_word: μύρου
  choice: 香膏
  rationale: μύρον指用于涂抹的芳香油膏；“香膏”既符合实际用途，又能自然衔接后文的“香气”。
- source_word: νάρδου
  choice: 哪哒
  rationale: 保留这种贵重芳香植物制品的具体名称；“甘松”作为较易辨认的别称收入脚注。
- source_word: πιστικῆς
  choice: 纯
  rationale: 该词词义存在争议；“纯”符合一种常见理解，同时以脚注保留“纯正、货真价实”等可能性，不把争议隐藏起来。
- source_word: πολυτίμου
  choice: 极贵的
  rationale: 准确表达其价值很高，并用现代汉语自然强调昂贵程度。
- source_word: ἤλειψεν
  choice: 抹在
  rationale: 表达把香膏涂在耶稣脚上的实际动作；相较“膏了”，“抹在”对现代普通读者更直接，也不预先规定仪式或君王膏立的神学含义。
- source_word: ἐξέμαξεν
  choice: 擦
  rationale: 直接表达用头发擦拭的动作，且不擅自断定是在擦干还是擦去香膏。
- source_word: ταῖς θριξὶν αὐτῆς
  choice: 用自己的头发
  rationale: 自然地表达工具格含义，并清楚说明头发属于马利亚。
- source_word: ἐπληρώθη
  choice: 满了
  rationale: “屋里就满了……”自然表达被动结果，也呈现香气遍及整所房屋的效果。
theological_decisions:
- issue: 涂抹动作是否应明确译作具有仪式意味的“膏抹”
  choice: 译作“抹在耶稣脚上”
  alternative: “膏抹了耶稣的脚”或“用香膏膏了耶稣的脚”
  rationale: ἀλείφω在此确实指涂抹香膏，且可能具有象征意味；但本节没有明说这是圣礼、君王膏立或其他特定仪式。正文先准确呈现动作，不排除其潜在象征意义，也不把某种神学解释写进译文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一利特拉”保留古代计量单位并由脚注解释；“哪哒香膏”延续读者可能熟悉的圣经用语，同时补充现代可理解的植物别称。句式简洁，保留原文动作顺序及末句香气充满房屋的感官效果。
