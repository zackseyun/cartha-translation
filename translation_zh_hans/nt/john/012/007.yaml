  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: zh_hans
  text: 于是耶稣说：“别难为她[a]，好让她把这留到我安葬的日子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“别难为她；她已把这留着，是为我安葬的日子。”有些人认为这句话是在描述她已经做成的事，而不是她以后还要做的事。
    reason: alternative_reading
  - marker: b
    text: 或译：“别难为她，好让她为我安葬的日子保留这。”希腊文也可理解为“为那个日子”保留，而不明确表示一直留到那一天。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接犹大的反对，引出耶稣的回应；“于是”在现代汉语叙事中自然，也保留上下文的推进关系。
- source_word: Ἄφες αὐτήν
  choice: 由她吧
  rationale: 此处是制止他人干涉女子的命令。“由她吧”简洁而庄重，表达“不要干涉她”，又不像“离她远点”那样加入空间含义。
- source_word: ἵνα
  choice: 让
  rationale: 引出目的或预期结果；“让她……”既与前面的命令自然衔接，也保留目的从句的关系。
- source_word: εἰς τὴν ἡμέραν
  choice: 留到……的日子
  rationale: 结合 τηρέω 表达保存至所指时日；正文采用明确自然的时间表达，同时以脚注保留“为……的日子”的可能理解。
- source_word: ἐνταφιασμοῦ
  choice: 安葬
  rationale: 指埋葬或入殓安葬。“安葬”是普通现代读者熟悉且庄重的表达。
- source_word: τηρήσῃ
  choice: 留
  rationale: 在此语境中指保留、存留某物。“留”自然表达为特定时日保留香膏之意；其完成性解释则在脚注中保留。
- source_word: αὐτό
  choice: 这
  rationale: 中性代词回指前文的香膏。汉语以“这”自然回指该物，同时避免在正文补入原文未重复出现的名词。
theological_decisions:
- issue: 耶稣的话如何把女子的行为与他的安葬联系起来
  choice: 正文按前瞻性的目的或时间关系译为“让她把这留到我安葬的日子”
  alternative: 也可理解为“由她吧；她把这留着，是为了我安葬的日子”，即描述她已经保存或已经如此使用香膏
  rationale: 希腊文 ἄφες…ἵνα…τηρήσῃ 的句法关系存在真实难点。正文保留其面向耶稣将要安葬之日的表达，不进一步说明香膏届时如何使用；另一种完成性理解列入脚注，以免消除经文的张力。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。“由她吧”较凝练，符合耶稣制止干涉的语气；正文不补出“香膏”，以保留原文代词。两个脚注标记均置于正文相关位置，并分别说明完成性解读及 εἰς 的语义范围。
