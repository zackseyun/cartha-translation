  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: zh_hans
  text: 因为我所讲的不是出于自己[a]；那位差我来的父亲自给了我命令，要我该说什么、该讲什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出于自己”也可译作“凭自己”或“凭自己的权柄”。
    reason: lexical_alternative
  - marker: b
    text: 原文在“我所讲的”“说”和“讲”中用了两个不同但意义相近的动词；译文以“说”和“讲”保留这一区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: 凭自己
  rationale: 自然地保留“并非出于自己或独立行动”的含义；不直接增译为“凭自己的权柄”，以免把隐含意义固定为单一解释。
- source_word: οὐκ ἐλάλησα
  choice: 不是……讲的
  rationale: 结合上下文表达耶稣一贯言说的来源；汉语不必机械标示希腊语不定过去时。
- source_word: ὁ πέμψας με πατὴρ
  choice: 差我来的父
  rationale: 准确表达分词结构及差遣关系；“父”在约翰福音语境中明确指上帝。
- source_word: αὐτός
  choice: 亲自
  rationale: 保留强调代词的力度，突出是父本人赐下命令。
- source_word: ἐντολήν
  choice: 命令
  rationale: 体现该词的权威与约束力，比“指示”更强，也比“诫命”更少让人联想到成文律法条文。
- source_word: δέδωκεν
  choice: 给了
  rationale: 现代汉语以“给了”自然表达已经赐下且仍然有效的命令；其持续效力由语境显明。
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: 该说什么、该讲什么
  rationale: 用“说”和“讲”分别对应 εἴπω 与 λαλήσω，保留原文两个近义动词的并列，同时使汉语保持自然。
theological_decisions:
- issue: 子的言说与父命令之间的关系
  choice: 译文明确耶稣不是凭自己独立发言，而是按差他来的父所赐的命令说话。
  alternative: 可解释为“不是凭自己的权柄”，或弱化为双方仅仅意见一致。
  rationale: 原文明说“不是出于自己”以及父“给了我命令”。译文保留使命和言说上的差遣关系，却不进一步推断本性上的高低。
- issue: πατήρ 的称谓
  choice: 父
  alternative: 父亲
  rationale: “父”是中文圣经语体中自然、庄重且明确的神圣称谓；正文中的“差我来的父”不会被误解为普通家族关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“因为”承接上文；分号呈现“不是……而是……”的对照。“吩咐”是为使“给了我命令，什么……”这一希腊语结构在中文中清楚自然，并未另加新的命令内容。所有脚注标记均置于正文相关位置。
