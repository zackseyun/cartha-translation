source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: zh_hans
  text: 我作为光来到世上，使凡信我的人都不再留在黑暗中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 保留约翰福音中具有核心意义的“光”这一隐喻；汉语名词没有冠词，因此“光”自然保留了希腊语无冠词表达的定性意味，无须强行区分“光”与“一道光”。
- source_word: εἰς τὸν κόσμον
  choice: 来到世上
  rationale: εἰς加宾格表示进入某一领域；“来到世上”既自然，也保留耶稣进入世界的使命与降临意味。
- source_word: ἐλήλυθα
  choice: 来到
  rationale: 希腊语完成时强调已经来临而其结果持续至今；现代汉语在此用“来到”结合上下文即可自然表达，若加“已经”则会使语气偏重时间陈述。
- source_word: ἵνα
  choice: 使
  rationale: 表达目的或预期结果；“使”在本句中简洁自然，并保留目的性。
- source_word: πᾶς ὁ πιστεύων
  choice: 凡信我的人
  rationale: 表达所有属于“信者”这一类的人；“凡……的人”是现代汉语中自然且范围明确的概括说法。
- source_word: πιστεύων εἰς ἐμέ
  choice: 信我的
  rationale: “信我”是约翰著作中πιστεύω εἰς加人称对象的自然汉译，表达以耶稣为指向的信靠，不额外加入解释。
- source_word: ἐν τῇ σκοτίᾳ
  choice: 在黑暗中
  rationale: 保留约翰福音中“黑暗”作为属灵和道德领域的主题意象；汉语无需借冠词来标明其特指性。
- source_word: μὴ μείνῃ
  choice: 不再留在
  rationale: μένω表示停留、继续处于某种状态；“不再留在”清楚传达信者不继续处于黑暗中的目的，同时符合自然汉语。
theological_decisions:
- issue: 约翰福音光的意象中的基督自我启示
  choice: 译作“我作为光来到世上”，直接呈现耶稣以“光”自我表明的隐喻。
  alternative: 译作“我来到世上作光”或解释为“我来给世界带来光”。
  rationale: “作为光”保留原文中耶稣本身与光的紧密认同，而不把隐喻弱化为仅仅带来某种东西；同时不添加超出本节的教义说明。
- issue: πᾶς ὁ πιστεύων所表达的范围
  choice: 译作“凡信我的人”，涵盖所有信耶稣的人。
  alternative: 译作“每一个信我的人”或“无论谁信我”。
  rationale: 原文概括信者的普遍类别，并未在此解释人如何产生信心；此译法保留其开放范围，不引入有关拣选或自由意志的特定宗派立场。
- issue: “不留在黑暗中”的目的与结果关系
  choice: 用“使”连接耶稣的来临与信者不再留在黑暗中的状态。
  alternative: 译作“为要叫”以更明确突出目的，或“以致”以偏重结果。
  rationale: ἵνα主要表达目的，也可带预期结果色彩；“使”在汉语中能自然保留两者之间的张力，不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式简洁，保留“光—黑暗”的对照及约翰式神学意象；不因汉语缺少冠词而增设无实际帮助的“一道光”脚注。
