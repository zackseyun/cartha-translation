  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: zh_hans
  text: 于是，众人回答他：“我们从律法中听说，弥赛亚[a]永远长存；你怎么说人子必须被举起来[b]呢？这位人子是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“基督”；这里译作“弥赛亚”，因为该词在此用作称号。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被高举”。在约翰福音中，“被举起来”既可指实际被举起，也可含有受高举的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: 于是，众人回答他说
  rationale: “于是”自然承接上文并保留 οὖν 的推进作用；“众人”准确表达聚集的人群，符合现代汉语叙事语体。
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: 我们从律法中听说
  rationale: 保留“从律法而来”的来源含义，也表达他们所领受并沿袭的教导。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是带定冠词的称号，置于犹太经文期待的语境中；“弥赛亚”比姓名化的“基督”更直接传达其称号功能。
- source_word: μένει εἰς τὸν αἰῶνα
  choice: 永远长存
  rationale: “长存”体现 μένει 的持续性，“永远”自然表达 εἰς τὸν αἰῶνα。
- source_word: πῶς λέγεις σὺ
  choice: 你怎么说
  rationale: 既保留对“你”的强调，也自然传达众人不解并带质疑的语气，未额外加入原文没有的情态词。
- source_word: δεῖ ὑψωθῆναι
  choice: 必须被举起来
  rationale: “必须”表达 δεῖ 的必要性；“被举起来”保留受动形式，并容纳约翰语境中身体被举起与受高举的双重意味。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号在现代中文圣经语境中的通行译法，并保留其经文背景与称号性质。
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 这位人子是谁？
  rationale: “这位”自然体现 οὗτος，且避免把问题误读为询问普通人的身份。
theological_decisions:
- issue: Χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文谈论律法所应许、永远长存的那一位，称号功能鲜明；采用“弥赛亚”保留犹太救世盼望的语境，不将其处理为姓名。
- issue: ὑψωθῆναι 在约翰福音中的复义
  choice: 被举起来
  alternative: 被高举／被抬起来
  rationale: “被举起来”既可指实际被举起，也能在上下文中承载受尊崇、得荣耀的意味；不把十字架与高升之间的张力单向解释掉。
- issue: “人子必须……”中的必要性
  choice: 必须
  alternative: 有必要
  rationale: 直接保留 δεῖ 所表达的必要性，但不在正文中进一步界定这是经文、神意或事件逻辑上的哪一种必要，以免超出本节原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文；分号使律法中的传统认知与众人随后的质问形成清晰对照。正文保留“律法”“弥赛亚”“人子”等关键经文术语，同时借脚注说明可影响理解的词义层次。
