  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: zh_hans
  text: 于是，逾越节前六天，耶稣来到伯大尼。拉撒路在那里；耶稣曾使他从死里复活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从死人中间。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 保留承接上文的叙事连接作用；“所以”自然明白，又不把此词弱化成单纯的时间推进。
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: 逾越节前六天
  rationale: 按现代汉语自然语序准确表达时间关系；πάσχα在这里指犹太人的逾越节。
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: 来到伯大尼
  rationale: “来到”符合ἔρχομαι的基本叙事用法；地名采用通行译名“伯大尼”。
- source_word: ὅπου ἦν Λάζαρος
  choice: 拉撒路就在那里
  rationale: 保留原文单纯的处所陈述，不增添“住着”或“停留”等原文没有明说的信息。
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν Ἰησοῦς
  choice: 耶稣曾使他从死里复活
  rationale: 用“曾”清楚表明这件事发生在本节所述到达之前；重复“耶稣”以反映希腊文在关系从句末再次明确主语，而不简化为“他”。“从死里复活”是自然且通行的汉语表达。
theological_decisions:
- issue: 拉撒路复活叙述中施行者的明确身份
  choice: 耶稣曾使他从死里复活
  alternative: 他曾使拉撒路从死里复活
  rationale: 原文在从句末明确重复Ἰησοῦς；译文也保留“耶稣”，使施行者的身份清楚，并避免抹去原文的强调。
- issue: ἐκ νεκρῶν所表达的复活范围意象
  choice: 从死里复活
  alternative: 从死人中间复活
  rationale: 正文采用现代汉语中自然、庄重的惯用表达，同时以脚注保留原文“从死人中间出来”的具体意象，不将其解释为其他神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将较长的希腊文句子分为两句，并用分号维持“拉撒路就在那里”与后面说明从句之间的紧密联系；未补入拉撒路是居住、作客或停留在伯大尼等原文未明说的信息。
