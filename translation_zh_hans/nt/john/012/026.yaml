  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: zh_hans
  text: 人若服事我[a]，就当跟从我；我在哪里，服事我的人也必在那里。人若服事我，父必尊重他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文采用泛指的阳性单数结构，直译为：“若有人服事我……父必尊重他。”
    reason: 说明原文泛指代词及后续阳性单数照应的形式。
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: 服事
  rationale: 这里指为耶稣效劳、事奉他。“服事”既保留关系性的服务含义，又不把范围缩窄为教会职分。
- source_word: ἀκολουθείτω
  choice: 就应当跟从我
  rationale: 现在时命令语气要求服事耶稣的人跟从他；“应当跟从”自然地表达命令要求，同时不把希腊语体貌过度解释为“不断跟从”。
- source_word: διάκονος
  choice: 服事我的人
  rationale: 此处泛指服事耶稣的人，并非后来教会中的“执事”职分。“服事我的人”也保留了它与前后动词“服事”的词根呼应，且避免“仆人”可能带来的家仆或奴仆联想。
- source_word: ὅπου εἰμὶ ἐγώ
  choice: 我在哪里
  rationale: 希腊语显式使用ἐγώ带有强调，但现代汉语以“我在哪里”即可自然表达，若译成“我本人在哪里”则显得生硬。
- source_word: ἐκεῖ καί
  choice: 也要在哪里
  rationale: “也”保留καί的附加意义；后半句沿用“在哪里”，自然传达ἐκεῖ的地点指向。
- source_word: τιμήσει
  choice: 必尊重
  rationale: τιμάω表示给予尊重、尊荣。“必尊重”简洁自然，也保留将来应许的确定语气，不擅自说明这种尊荣的具体形式。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文是“父”，没有“我的”这一所有格；不增译“我的”，以保留约翰福音在此处的原有表达。
- source_word: τις
  choice: 人若
  rationale: τις是不定代词，泛指任何人。“人若”是现代汉语条件句中自然、庄重的表达，并不限定性别。
- source_word: αὐτόν
  choice: 他
  rationale: 该阳性单数代词回指泛指的τις。汉语用单数“他”保留原文的单数照应；脚注说明原文的泛指阳性结构。
theological_decisions:
- issue: 条件句中的泛指阳性指称
  choice: 将τις译作不限定性别的“人若”，后续单数代词αὐτόν译作“他”，并加脚注说明希腊语形式。
  alternative: 全句改用复数或重复“那人”，以避免书面语“他”可能产生的男性联想。
  rationale: 原文以泛指不定代词配合阳性单数照应。此译法既表达适用于任何人的含义，也保留原文单数结构，不将其改写为复数。
- issue: 服事所得尊荣的性质
  choice: 直译为“父必尊重他”，不解释尊荣的具体形式。
  alternative: 在正文中明确解释为天上的赏赐或末后的荣耀。
  rationale: 本节应许父要尊重服事耶稣的人，却没有在这里界定这种尊荣的具体方式；译文保留这一神学上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“服事”符合宗教语境但仍为普通读者可理解；“跟从”保留门徒关系的含义。“父”不增添原文没有的所有格。所有脚注标记均已在正文中对应出现。
