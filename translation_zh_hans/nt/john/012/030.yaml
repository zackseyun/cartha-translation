  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: zh_hans
  text: 耶稣回答说：“这声音不是为我而来的，而是为你们。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这声音不是因我而发生的，而是因你们而发生的。”这里的“为”也可理解为表示原因；但按上下文，正文采用“为了／为着”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: 耶稣回答说
  rationale: “回答说”自然保留约翰叙事中“回答并说”的双动词表达，同时符合现代汉语习惯。
- source_word: ἡ φωνὴ αὕτη
  choice: 这声音
  rationale: 上下文所指是从天上发出的言语；“声音”既准确，又不额外说明发声者。
- source_word: γέγονεν
  choice: 而来的
  rationale: 此处完成时表示声音已经发生并临到；汉语与“声音”搭配时，“而来”比“发生”更自然，也保留事件的结果意味。
- source_word: δι’ ἐμὲ
  choice: 为我
  rationale: 结合上下文，将διά加宾格理解为目的或受益关系，表示声音并非为了耶稣本人。
- source_word: δι’ ὑμᾶς
  choice: 为你们
  rationale: 与“为我”形成严格平行，指出这声音是为在场听众而来；不额外解释其具体功用。
- source_word: Οὐ ... ἀλλὰ
  choice: 不是……而是……
  rationale: 直接保留原文鲜明的否定—转折对照。
theological_decisions:
- issue: 天上声音的目的
  choice: 这声音不是为耶稣而来，而是为听众而来。
  alternative: 这声音不是因为耶稣而发生，而是因为听众而发生。
  rationale: διά加宾格在两处应作平行理解；语境较支持目的或受益义，但因果义在词法上并非绝对不可能。正文采用自然且合乎语境的“为”，不进一步推断耶稣是否需要确认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣回答说”符合经文叙事语体；“为我／为你们”简洁地保留原文平行与对比。未加脚注，因为汉语“为”本身可承载目的、受益以及较宽泛的缘由关联，足以保留原文的一定开放性。
