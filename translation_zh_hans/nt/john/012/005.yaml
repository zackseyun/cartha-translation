base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: zh_hans
  text: “为什么不把这香膏以三百第纳尔卖掉，把所得的给穷人呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一个第纳尔通常相当于普通工人一天的工资；扣除不工作的日子，三百第纳尔约为一年的收入。
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: 为什么不
  rationale: 结合后面的否定式被动动词，译为自然的反问句“为什么不……”，准确传达责问语气。
- source_word: μύρον
  choice: 香膏
  rationale: 指带香气、可用于膏抹的贵重膏油；“香膏”既符合约翰福音的语境，也比现代日用语中的“香水”更能体现其形态和用途。
- source_word: ἐπράθη
  choice: 卖
  rationale: 这是πιπράσκω的不定过去时被动形式。汉语用“把”字句自然表达原文被动含义，无须生硬译作“被卖掉”。
- source_word: τριακοσίων δηναρίων
  choice: 卖三百个第纳尔
  rationale: 属格表示售价；保留历史货币单位“第纳尔”，避免把其价值直接等同于现代币值或精确折算成工钱，背景意义置于脚注说明。
- source_word: καὶ ἐδόθη
  choice: 拿去给
  rationale: 原文为“并且被给”，在汉语中承接卖得的钱译作“拿去给”更自然，也保留用途指向；不额外加入原文未明说的“所得的钱”。
- source_word: πτωχοῖς
  choice: 穷人
  rationale: 与实词化的复数形容词相符，简洁自然，保留其所指的社会群体，不窄化为某一特定救济类别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的反问表达。“香膏”延续圣经语境中的常用称谓；“第纳尔”保留一世纪罗马货币名称，并用脚注交代其大致购买力。脚注标记已置于正文句末。
