id: JHN.12.43
reference: John 12:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: zh_hans
  text: 因为他们爱人的荣耀，胜过爱上帝的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的荣耀”也可理解为“从人而来的荣耀”，即“人的赞许”；“上帝的荣耀”也可相应理解为“从上帝而来的荣耀”。
    reason: 说明δόξα及属格结构的词义和句法歧义。
lexical_decisions:
- source_word: ἠγάπησαν
  choice: 爱
  rationale: 以“爱”保留ἀγαπάω的直接而强烈的意愿与倾向，也保留约翰著作中“爱”这一词族的联系；比较结构则表达了偏爱的意味。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明上文所述情况的原因；现代汉语用“因为”能自然、明确地保留因果衔接。
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα可指荣耀、尊荣、称赞或赞许。此处两次采用同一译词，既保留原文的平行对照，也保留约翰福音中“荣耀”的神学呼应，避免把含义收窄为“赞许”。
- source_word: τῶν ἀνθρώπων
  choice: 人的
  rationale: ἄνθρωποι在此泛指人类，并非专指男性。“人的”简洁自然，同时保留属格既可表示关联、也可暗示来源的开放性。
- source_word: μᾶλλον ἤπερ
  choice: 胜过
  rationale: 该比较结构表示在两个对象之间更偏爱前者；“胜过”既符合汉语表达，也没有把比较绝对化为完全排斥后者。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 采用“上帝”作为θεός在现代标准汉语中的庄重通行译法；“的”与前面的“人的”形成平行，并保留属格在归属与来源之间的语义余地。
theological_decisions:
- issue: 人和上帝对照中δόξα的含义
  choice: 荣耀
  alternative: 称赞、尊荣、赞许
  rationale: “荣耀”保留该词在约翰福音中的词汇与神学连续性，也保留其较宽的语义范围；“赞许”等译法虽符合语境，却会更具体地解释原文。
- issue: 两个属格是归属还是来源
  choice: 人的荣耀／上帝的荣耀
  alternative: 从人而来的荣耀／从上帝而来的荣耀
  rationale: 原文属格可以理解为与人或上帝相关、属于他们，或由他们而来。正文采用结构平行的“……的荣耀”，不将这种歧义只限定为来源；脚注提示语境中的可能含义。
- issue: 比较结构是否表示完全排斥
  choice: 胜过
  alternative: 而不要、而不是
  rationale: μᾶλλον ἤπερ明确表达偏爱或相对比较，但本身未必断言对后一对象毫无爱慕；“胜过”保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人的”按语境泛指人类，不限于男性。重复“荣耀”以保留原文的平行结构和约翰式用语；第二个“爱”在汉语中补出，使比较关系清楚自然。
