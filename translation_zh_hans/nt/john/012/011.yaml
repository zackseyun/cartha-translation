  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: zh_hans
  text: 因为许多犹太人[a]因他的缘故[b]不断离去[c]，并且信耶稣[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地区的人”。约翰福音中的这个词会随语境指犹太人、犹太地区的人，或某些犹太领袖；这里说的是其中的许多人，并非全体犹太人。
    reason: alternative_reading
  - marker: b
    text: “他”按上下文最自然地指拉撒路。
    reason: referent_clarification
  - marker: c
    text: “不断离去”也可译作“离去”或“不断离开”。原文没有明说他们离开谁；语境可能指他们正脱离反对耶稣者的立场或影响。
    reason: lexical_alternative
  - marker: d
    text: “信耶稣”也可译作“信靠耶稣”或“把信心寄托在耶稣身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出上一节祭司长企图杀害拉撒路的原因，保留明确的因果关系。
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: 许多犹太人
  rationale: 将属格结构理解为部分属格，即犹太人中的许多人；不把所指扩大为全体犹太人。
- source_word: δι’ αὐτὸν
  choice: 因他的缘故
  rationale: διά加宾格在此表示原因；代词按原文保留为“他”，上下文最自然地指拉撒路。
- source_word: ὑπῆγον
  choice: 纷纷离去
  rationale: 未完成过去时表示持续或反复发生的行动；“纷纷”自然体现多人不断离去的情形，又不擅自补出他们离开谁。
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: 信了耶稣
  rationale: 自然表达信心指向耶稣，并借上下文和“纷纷”呈现多人陆续作出回应；不扩写为“成为门徒”或“得救”。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，理解为其中许多人，而非对全体犹太人的概括
  alternative: 犹太地区的人；犹太人的领袖
  rationale: 本句的部分属格明确指较大群体中的一部分。原词在约翰福音中所指随语境变化，因此正文保留较宽的称谓，并以注释提示地域性译法。
- issue: ὑπῆγον所表示的离开对象
  choice: 仅译作“离去”，不明说离开宗教领袖或其立场
  alternative: 离开他们；脱离他们的影响
  rationale: 语境可能暗示这些人离开反对耶稣者的阵营或影响，但原句未明说宾语，译文不替经文消除这一含混。
- issue: πιστεύω εἰς的神学力度
  choice: 译作“信了耶稣”
  alternative: 信靠耶稣；把信心寄托在耶稣身上
  rationale: 原文说明信的对象是耶稣，却没有在本节进一步界定这种信的全部神学含义，故不增译为“得救”或“成为门徒”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“因他的缘故”避免相邻两次使用“因为”；“纷纷离去”兼顾未完成过去时的持续、反复意味和汉语自然表达。正文保留“他”与“离去”对象的含混，不作超出原文的解释。
