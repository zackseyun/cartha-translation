  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: zh_hans
  text: 因为你们总是有穷人[a]在身边，但你们并不总是有我在身边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫穷的人”。希腊文形容词作名词用，泛指贫穷者。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: 穷人
  rationale: 该形容词在希腊文中作名词使用，泛指贫穷的人；“穷人”是现代汉语中自然、简洁的表达。
- source_word: γάρ
  choice: 因为
  rationale: 此处说明前一句话的理由；“因为”清楚保留了解释性的连接作用。
- source_word: πάντοτε
  choice: 常常
  rationale: 在此语境中表示始终、随时都有；两处采用同一基本表达，以保留原文的平行对比。
- source_word: ἔχετε
  choice: 有
  rationale: 这里不是指所有权，而是指某人在场、相伴或可接近；“有”配合“在一起／在身边”能自然表达这一含义。
- source_word: μεθ’ ἑαυτῶν
  choice: 和你们在一起
  rationale: 该短语表示在你们中间、与你们相伴；此译法符合现代汉语习惯。
- source_word: ἐμέ
  choice: 我
  rationale: 第一人称宾格代词，指耶稣本人。
- source_word: δέ
  choice: 但
  rationale: 标明穷人持续在场与耶稣并非持续在场之间的鲜明对比。
- source_word: οὐ πάντοτε
  choice: 不常
  rationale: 在此对比结构中表示“并非总有”；“不常有我在身边”自然地传达耶稣与门徒同在的时间有限。
theological_decisions:
- issue: 这句话可能被误用为贬低对穷人的关怀
  choice: 直译为关于在场时间的对比，不增添穷人不重要的含义
  alternative: 意译成穷人不如耶稣重要，或弱化原文的对比
  rationale: 原文陈述的是穷人会持续与门徒同在，而耶稣此时肉身与他们同在的时间有限。译文既不削弱当下时机的特殊性，也不加入原文未说的、贬低穷人的判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在一起／在身边”避免把ἔχετε误解为占有；前后分句保持平行和对比。
