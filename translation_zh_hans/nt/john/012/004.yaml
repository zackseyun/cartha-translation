  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: zh_hans
  text: 可是，他的一个门徒加略人犹大——就是那将要出卖[a]他的人——说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“交出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用叙事性现在时；现代汉语的“说”本身不强制标明时态，既自然地承接叙事，也无需额外添加过去时标记。
- source_word: δὲ
  choice: 可是
  rationale: δὲ在这里引出与马利亚之举形成轻微对照的反应；“可是”能自然标示这一转折，又不过分强化。
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: 加略人犹大
  rationale: 采用现代中文圣经语境中通行且易懂的人名形式；“加略人”保留希腊文称号的结构。
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: 他的一个门徒
  rationale: “门徒”准确保留μαθητής所表达的师徒关系；依照现代汉语语序，将这一说明置于姓名之前。
- source_word: ὁ μέλλων
  choice: 就是那将要……的人
  rationale: “将要”保留μέλλω所表达的预期将来行动；“就是……的人”自然呈现希腊文同位说明。
- source_word: παραδιδόναι
  choice: 出卖
  rationale: παραδίδωμι本义可指“交出、交给”，但在犹大与耶稣的叙事情境中指背叛性的交付；“出卖”在现代汉语中清楚传达这一语境含义，同时以脚注保留较直译的可能。
- source_word: αὐτόν
  choice: 他
  rationale: 保留原文代词表达；上下文清楚表明所指为耶稣，无须在正文中改写为专名。
theological_decisions:
- issue: 如何翻译犹大对耶稣所做之事的παραδιδόναι
  choice: 出卖
  alternative: 交出；交给
  rationale: “出卖”凸显该行为在本段叙事中的背叛性质；“交出”更贴近该动词的基本意义，并有助于维持其跨语境的词汇联系。正文采用符合本处语境的“出卖”，脚注则保留较直译的表达，避免掩盖原词的语义范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“可是”承接上文并引出反对意见；破折号标示对犹大的插入性说明。正文不补入原文没有的动机判断，并保留“他”这一代词指称。
