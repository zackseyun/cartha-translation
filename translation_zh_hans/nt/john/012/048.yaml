  rationale: 修正“自有审判他的”的中文句法，使其成为完整、自然的现代汉语，同时保留原文先以“审判他的那一位”提出、后以耶稣所说之话说明的修辞张力。以“我所说的话”对应单数 λόγος，既维持与前文“我话语”的数和语义层次，也避免不必要地将本节的普通语境术语化。
