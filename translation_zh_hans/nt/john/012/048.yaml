  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: zh_hans
  text: 拒绝我、不接受我话语的人，有审判他的那一位；我所说的话[a]要在末日审判他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”。原文 logos 在这里可指所说的话，也可指所传达的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: 拒绝
  rationale: 这里指对耶稣的弃绝或否认；“拒绝”自然、明确，也保留了动作所针对的个人性。
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: 不接受我所说的话
  rationale: λαμβάνω 在这里有领受、接纳之意；中文“不接受”自然地表达拒不领受启示，并避免“不领受”可能带来的宗教行话感。τὰ ῥήματα 指耶稣说出的言语，译作“我所说的话”清楚自然。
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: 自有审判他的
  rationale: 保留原文“有一位/一个审判他的”这一略带省略的结构，同时用“自有”使现代中文通顺，并为下文指出审判者作铺垫。
- source_word: ὁ λόγος ὃν ἐλάλησα
  choice: 我所讲的道
  rationale: λόγος 此处可指“话”或“信息”。译作“道”保留其单数、郑重而近乎拟人化的力量，并与前面的复数“话”有所区别；“所讲的”对应 ἐλάλησα 的言说性质。
- source_word: κρινεῖ
  choice: 要审判
  rationale: κρίνω 表示施行判断；“审判”保留其广义，不提前限定为定罪。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: 这是约翰福音惯用的末世表达；“在末日”简洁庄重，不引入额外的末世论细节。
theological_decisions:
- issue: 本节中施行审判者的性质
  choice: 按原文把耶稣所讲的“道”表述为末日审判人的那一位或审判依据，不消解其拟人化表达。
  alternative: 将“道”明确解释为耶稣本人，或仅解释为由耶稣使用的客观审判标准。
  rationale: 原文先说拒绝者“有审判他的”，继而以“我所讲的道”加以说明。译文保留这层张力，不用其他经文中耶稣作为审判者的表述来改写本节。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“拒绝我、不接受……”保留两个并列分词的结构；“自有审判他的”刻意保留原文的省略感和后文揭示审判者的修辞推进。脚注标记已在正文“道”后标出。
