  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: zh_hans
  text: 腓力来，告诉安得烈[a]；安得烈和腓力来，告诉耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在本节连续使用历史现在时（“来……告诉……来……告诉”），这是常见的叙事手法，使场景更有临场感；其他译法常按叙事惯例译作过去发生的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 来
  rationale: 保留希腊文的历史现在时和朝向叙事中下一位交谈者的动态，使叙述具有现场感。
- source_word: λέγει
  choice: 告诉
  rationale: 这里表示把前述请求转告给某人；“告诉”比逐字的“对……说”更符合现代汉语，同时不补出原文未明说的内容。
- source_word: τῷ Ἀνδρέᾳ
  choice: 安得烈
  rationale: 与现代中文圣经中常见的人名译法一致；与“告诉”搭配时，希腊文与格自然译作受事对象。
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: 安得烈和腓力来
  rationale: 保留第二个历史现在时，并按照汉语自然语序表达联合主语。
- source_word: λέγουσιν
  choice: 告诉
  rationale: 与前句形成简洁平行，也准确表达两人向耶稣传达消息的动作。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: 采用通行中文译名；与格按“告诉某人”的现代汉语句式表达。
- source_word: καί
  choice: 和／；
  rationale: 联合人物时译为“和”；分句间用分号呈现原文连续并列的推进，避免额外加入“于是”等时间或因果解释。
- source_word: ὁ Φίλιππος
  choice: 腓力
  rationale: 采用通行中文译名；专名前的希腊文冠词在此没有需要单独译出的标记意义。
