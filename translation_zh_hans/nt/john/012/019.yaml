  to: 于是，法利赛人彼此说：“你们看，你们毫无进展。看哪，全世界[a]都跟随他去了。”
  rationale: 修订仅优化两处汉语表达：“毫无进展”直接传达法利赛人感叹其行动无效的意思；“全世界都跟随他去了”以更自然、清楚的现代汉语保留原文“世界”的夸张性表达及“去跟随他”的动态。脚注保留，继续避免在正文中把“世界”诠释性改窄。
