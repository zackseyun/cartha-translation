  terminology: “法利赛人”“世界”“跟随”均为现代汉语圣经语境中稳定、庄重而易懂的用语。“看哪”保留ἴδε的突显语气，可继续使用。脚注正确说明“世界”的原文措辞及其可能的夸张用法。
