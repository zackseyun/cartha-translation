  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: zh_hans
  text: 于是，法利赛人彼此说：“你们看，你们毫无进展。看哪，全世界[a]都跟随他去了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人人”。原文作“世界”，这里很可能是夸张说法。
    reason: 说明原文措辞及符合语境的词义替代。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文群众迎接耶稣的场景，表达由此而来的反应；“于是”在现代汉语叙事中自然清楚。
- source_word: πρὸς ἑαυτούς
  choice: 彼此说
  rationale: 这里具有群体内部相互交谈的含义；“彼此说”比直译为“对自己说”更符合汉语习惯。
- source_word: Θεωρεῖτε
  choice: 你们看
  rationale: 保留复数直陈语气及带有懊恼意味的反问式陈述，不处理成单纯命令。
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: 你们所做的一点用也没有
  rationale: 表达法利赛人认为其行动毫无成效；补出“所做的”使汉语自然，同时不具体限定他们采取了什么行动。
- source_word: ἴδε
  choice: 看哪
  rationale: 保留引人注意的突兀语气；“看哪”庄重而易懂。
- source_word: κόσμος
  choice: 世界
  rationale: 保留原词及其约翰著作中的表达色彩，不在正文中直接化解为“人人”或“群众”。
- source_word: ὀπίσω αὐτοῦ
  choice: 跟着他
  rationale: 自然表达跟从某人而去的含义，也保留了原文“在他后面”的基本意象。
- source_word: ἀπῆλθεν
  choice: 去了
  rationale: 以完成性表达呈现法利赛人眼中已经形成的结果，符合现代汉语习惯。
theological_decisions:
- issue: 法利赛人口中 κόσμος 的范围
  choice: 正文保留“世界”，将其视为带夸张色彩的话语
  alternative: 译作“人人”或“所有群众”
  rationale: 这句话出于法利赛人的挫败和夸张，并非关于所有人都成为门徒的教义陈述。保留“世界”既忠于措辞，也保留约翰文本的语义回响。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“看哪”保留原文突出的感叹力量；“世界都跟着他去了”有意保留修辞性拟人与夸张，不将其静默改写为解释性措辞。
