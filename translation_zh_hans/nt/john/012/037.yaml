  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: zh_hans
  text: 他虽然在他们面前行了这么多神迹[a]，他们还是不信他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”所译的希腊语也可译作“记号”，强调这些作为指向并显明耶稣的身份。
    reason: lexical_alternative
  - marker: b
    text: “不信”所用的希腊语动词为未完成时，可表示持续的不信。
    reason: verbal_aspect
lexical_decisions:
- source_word: τοσαῦτα
  choice: 这么多
  rationale: 表达数量之多及其强调语气，现代汉语自然明白。
- source_word: δὲ
  choice: 虽然……还是……
  rationale: δέ在上下文中带出转折；汉语让步复句已自然承载“尽管如此”的对比，无须另加“但是”。
- source_word: σημεῖα
  choice: 神迹
  rationale: 在约翰福音中指彰显耶稣身份和荣耀、具有指向意义的超常作为。“神迹”是现代中文圣经语境中最自然的表达；脚注保留其“记号”这一基本意象。
- source_word: πεποιηκότος
  choice: 行了
  rationale: 完成时分词表示这些事已经发生，并对当前情形仍具关联；“行了”符合中文谈论神迹的惯用表达。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 在他们面前
  rationale: 准确表达神迹是在他们亲眼可见的范围内公开施行的。
- source_word: οὐκ ἐπίστευον
  choice: 还是不信
  rationale: 未完成时可表现持续的不信；“还是”既自然呈现这种持续状态，也突出众多神迹与不信之间的反差，而不额外加入“拒绝”的意志含义。
- source_word: εἰς αὐτόν
  choice: 信他
  rationale: πιστεύω εἰς在约翰福音中表达以耶稣为信靠对象；现代汉语“信他”自然保留关系性的信靠含义。
theological_decisions:
- issue: 如何表达面对众多神迹仍持续不信
  choice: 他们还是不信他
  alternative: 他们仍然没有信他；他们一直不信他
  rationale: “还是不信”兼顾未完成时可能具有的持续性和经文鲜明的让步反差，同时避免把不信明确解释成有意识的持续拒绝。
- issue: σημεῖα的约翰式含义
  choice: 神迹，并以脚注说明也可译作“记号”
  alternative: 记号；奇迹
  rationale: “神迹”对普通中文读者清楚自然，也不把这些作为仅仅说成令人惊奇的事件；脚注提醒读者原词还强调这些作为具有指向和启示作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他虽然……他们还是……”既符合中文习惯，也保留原文在众多公开神迹与持续不信之间的张力。
