base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: zh_hans
  text: 现在正是这世界受审判的时候；现在这世界的统治者[a][b]要被赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这世界的王”。
    reason: lexical_alternative
  - marker: b
    text: “这世界的统治者”通常被理解为指撒但。
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 两次均译作“现在”，保留原文突出的时间意味和平行结构。
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: 正是这世界受审判的时候
  rationale: 将名词结构自然地转为现代汉语表达，同时保留“审判”及其临到“这世界”的含义；“正是……的时候”体现 νῦν 的强调。
- source_word: κόσμου τούτου
  choice: 这世界
  rationale: 保留指示词 τούτου，并维持约翰文本中“这世界”所具有的语境张力，不擅自改译为“这个时代”或“世界体系”。
- source_word: ἄρχων
  choice: 统治者
  rationale: 表达掌权者之意，现代、清楚而庄重；脚注保留传统译法“王”。
- source_word: ἐκβληθήσεται ἔξω
  choice: 要被赶出去
  rationale: 保留将来被动意义，并用自然汉语表现 ἐκβάλλω 与 ἔξω 所加强的驱逐、排除意味。
theological_decisions:
- issue: “这世界的统治者”的身份
  choice: 正文保留原文称号，不直接点明身份
  alternative: 明确译为“撒但”或“魔鬼”
  rationale: 约翰语境通常使人将此称号理解为撒但，但希腊文本在此使用称号而非名字；正文不消除这一措辞所保留的含蓄性，注释仅说明通常理解。
- issue: 审判的承受者
  choice: 译为“这世界受审判”
  alternative: 译为“对这世界的审判”
  rationale: τοῦ κόσμου τούτου 在形式上可理解为与 κρίσις 相连的属格；汉语正文采用较自然且符合语境的受事表达，但不增添“定罪”等更强的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受审判的时候”避免生硬的名词堆叠；“被赶出去”比“被抛在外面”更符合现代汉语，同时保留原文强烈的排除意味。所有脚注标记均置于正文相关位置。
