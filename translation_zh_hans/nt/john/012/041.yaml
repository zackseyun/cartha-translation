source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: zh_hans
  text: 以赛亚说这些话，是因为他看见了他的荣耀，并且谈到他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里两个“他”在约翰福音的上下文中很可能指耶稣；不过，以赛亚书的背景是先知看见主的荣耀（赛6:1）。因此，也可理解为：“以赛亚说这些话，是因为他看见了上帝的荣耀，并且谈到上帝。”
    reason: 说明代词可能的所指，并保留约翰福音的基督论语境与以赛亚书异象背景之间的张力。
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指回前面引述的先知话语；“这些话”在现代汉语中自然，也保留复数所指。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω 的简单过去叙事用法；译作“说”简洁准确，并与后面的 ἐλάλησεν 略作区分。
- source_word: Ἠσαΐας
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的先知名译法。
- source_word: ὅτι
  choice: 因为
  rationale: 此处最自然地说明以赛亚说这些话的原因；虽可理解为引出内容的“即/就是”，但上下文中的因果解释更合适。
- source_word: εἶδεν
  choice: 看见了
  rationale: 直接表达 ὁράω 的不定过去时意义，指先知曾看见异象。
- source_word: τὴν δόξαν
  choice: 荣耀
  rationale: “荣耀”是 δόξα 在约翰福音及以赛亚异象背景中的常规而有分量的译法。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 按原文保留第三人称单数代词，不在正文中明说其指耶稣还是上帝，以保存原文与上下文形成的指代张力。
- source_word: ἐλάλησεν
  choice: 谈到
  rationale: 在 περὶ αὐτοῦ 的搭配中，“谈到他”比“说到他”更自然，并与前面的“说这些话”有所区别。
- source_word: περὶ αὐτοῦ
  choice: 谈到他
  rationale: περί 加属格表示“关于、论到”；“谈到他”符合现代汉语表达。
theological_decisions:
- issue: 两个 αὐτοῦ 所指的是谁
  choice: 正文均译为含有指代空间的“他”，不直接替换为“耶稣”或“上帝”
  alternative: 明确译成“耶稣的荣耀……谈到耶稣”，或按以赛亚书背景译成“上帝的荣耀……谈到上帝”
  rationale: 约翰福音12章的直接论述把以赛亚的话应用于耶稣，因此两个代词很可能指耶稣；但以赛亚书6章的原始异象是看见主的荣耀。中文代词“他”可以忠实保留希腊文代词形式及这一神学张力，脚注再说明两层语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这些话”清楚承接前文引语；“谈到他”自然表达 περί 加属格。正文不补出代词所指，以免过度释义；脚注交代最可能的约翰语境及更广的以赛亚背景。
