  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: zh_hans
  text: 爱惜自己生命[a]的，就失去生命；在这世上恨恶自己生命[b]的，必会保全生命，得享永生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”也可译作“灵魂”或“自我”；希腊文 ψυχή 可按语境指生命、自我或灵魂。
    reason: lexical_alternative
  - marker: b
    text: “在这世上恨恶自己生命”是刻意的悖论，指不再执着于保全今世的生命，并非提倡自我憎恨。参路加福音14:26的类似表达。
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: 爱惜……的
  rationale: 带冠词的现在分词作名词用，表达泛指且持续的态度；“爱惜”在现代汉语中自然地传达对今世生命的眷恋。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的生命
  rationale: 此处 ψυχή 指人的生命或自我，是会失去或被保全的对象；“生命”比“灵魂”更符合上下文，也避免加入原文未必要求的身灵二分观。
- source_word: ἀπολλύει αὐτήν
  choice: 反而会失去生命
  rationale: ἀπόλλυμι 在此与后文“保全”形成对照，译作“失去”最自然；“反而”显明格言中的悖论性结果，但不改变命题内容。
- source_word: ὁ μισῶν
  choice: 恨恶……的
  rationale: 保留 μισέω 的强烈措辞和刻意的悖论，不在正文中弱化为“少爱”或“不看重”。
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: 在这世上
  rationale: κόσμος 在约翰福音中常指与永恒实在相对的现今世界秩序；“在这世上”自然，并限定“恨恶生命”的语境。
- source_word: φυλάξει αὐτήν
  choice: 却要保全生命
  rationale: φυλάσσω 有守护、保存之意；“保全”与“失去”形成清楚对照，未来语气由“要”表达。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 直到永生
  rationale: εἰς 表示趋向、终点或结果；“直到永生”在汉语中自然地表达生命被保全而进入永生，同时保留介词关系的一定开放性。
theological_decisions:
- issue: “恨恶自己生命”的含义
  choice: 保留“恨恶”的强烈悖论措辞，理解为拒绝把今世生命置于最高地位，而不是倡导自我厌弃。
  alternative: 译作“少爱自己的生命”或“不顾惜自己的生命”。
  rationale: 原文明确使用 μισέω，且“在这世上”限定了这种恨恶的范围。正文应保留其修辞张力，以脚注防止误读。
- issue: ψυχή 的译法
  choice: 两处均译为“生命”。
  alternative: “灵魂”或“自我”。
  rationale: 本节谈生命的失去与保全，“生命”最贴合语境，也不把特定的人论预设带入正文。
- issue: εἰς ζωὴν αἰώνιον 的关系
  choice: 译为“直到永生”，表达趋向永生并进入永生的终向。
  alternative: “为得永生而保全”或“保全到永生”。
  rationale: εἰς 可表达目标或结果；选择较自然且不过度解释因果机制的汉语表述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“爱惜—失去”与“恨恶—保全”形成鲜明对偶；保留原文的强烈悖论，并以脚注说明词义范围和防止误读。
