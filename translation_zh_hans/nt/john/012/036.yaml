  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: zh_hans
  text: 你们趁着还有光，要信靠光，使你们成为光明之子。[a]耶稣说了这些话，就离去，向他们隐藏起来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光明之子”是一个习语，指属于光、以光为特征的人；也可译作“光明的儿女”。
    reason: 说明源文阳性形式及其包含众人的习语意义。
  - marker: b
    text: “离去”对应原文分词，表明随后“向他们隐藏起来”的动作；原文形式上为被动式，按上下文可作近中动态理解。
    reason: 说明动作次序及ἐκρύβη的语态形式，避免暗示另有人将耶稣藏起来。
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: 你们趁着还有这光
  rationale: ὡς与现在时ἔχετε在这里表达时间关系，即“当……仍在的时候”。“趁着还有”既符合现代汉语，也保留机会有限、应及时回应的紧迫感；“这光”承接本段语境，并体现定冠词。
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: 要信靠这光
  rationale: πιστεύω εἰς在约翰福音中表示把信任投向某一对象。“信靠”比单说“相信”更自然地表达这种指向和委身，同时不作额外的神学扩展。
- source_word: ἵνα
  choice: 好使
  rationale: 保留目的或结果意味，并以自然、庄重的现代汉语连接下句。
- source_word: υἱοὶ φωτός
  choice: 光明之子
  rationale: 直译阳性复数υἱοί，同时保留闪族式表达，即属于光、以光为特征的人。“光明之子”在中文中庄重而易懂，其代表性含义在脚注说明。
- source_word: γένησθε
  choice: 成为
  rationale: γίνομαι的虚拟式在此表示进入一种新的身份或状态，不宜弱化为单纯的“是”。
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: 耶稣说了这些话
  rationale: 自然表达λαλέω及其宾语Ταῦτα，保持叙事语体，避免生硬的“讲了这些事”。
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: 便离去，躲起来不让他们看见
  rationale: 以连续动词自然表达先离去、后隐藏的动作次序；“不让他们看见”明确ἀπ’ αὐτῶν所表达的“避开他们”，而不暗示是别人把耶稣藏起来。
theological_decisions:
- issue: υἱοὶ φωτός的性别形式与习语范围
  choice: 光明之子
  alternative: 光明的儿女
  rationale: 正文保留源文明确的“子”及其约翰式、闪族式习语形式；脚注说明该称呼指所有以光为特征、归属于光的人，并不把适用范围限于男性。
- issue: πιστεύω εἰς的信仰指向
  choice: 信靠这光
  alternative: 相信这光
  rationale: “信靠”较完整地呈现πιστεύω εἰς所含的对象指向与信赖意味，同时维持“光”在约翰福音中有意保留的形象和基督论张力，不直接改写为“信靠我”。
- issue: ἐκρύβη的语态理解
  choice: 躲起来不让他们看见
  alternative: 向他们隐藏起来
  rationale: 该被动形式在语境中具有不及物或近似中动态的意义，叙述耶稣自行隐去；译文不暗示另有行动者把他藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“趁着还有”传达时间紧迫感；“信靠”自然呈现约翰常用的πιστεύω εἰς结构；“光明之子”保留源文意象和习语，借脚注说明其代表性范围。
