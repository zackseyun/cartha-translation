base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: zh_hans
  text: 在那些上去过节敬拜的人中，有些希腊人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“几个希腊人”或“某些希腊人”。他们可能是来过节敬拜的非犹太人，但原文没有进一步说明他们的身份。
    reason: 保留τινες的替代译法，并说明Ἕλληνες在本段中的身份仍有歧义。
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: 有……也
  rationale: ἦσαν在这里构成存在句，用“有”自然表达；δέ是轻微的承接或转折，结合语境以“也”体现，不把它误译成时间副词“当时”。
- source_word: Ἕλληνές τινες
  choice: 几个希腊人
  rationale: Ἕλληνες通常指“希腊人”，τινες表示不确指；“几个希腊人”符合现代汉语表达，也不将其概括为“外邦人”。
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: 在上耶路撒冷……的人当中
  rationale: ἐκ表示这些希腊人属于该群体；ἀναβαίνω直译为“上去”，在节期朝圣语境中指上耶路撒冷。补明目的地有助于普通读者理解这一固定用法。
- source_word: ἵνα προσκυνήσωσιν
  choice: 敬拜
  rationale: ἵνα加虚拟语气表达目的；προσκυνέω在此指宗教敬拜，不只是身体俯伏。汉语将目的自然整合进“过节敬拜的人”。
- source_word: ἐν τῇ ἑορτῇ
  choice: 过节
  rationale: ἑορτή指犹太节期，此处即上下文中的逾越节。“过节”比“在节期中”更自然，同时未在正文中重复补出节期名称。
theological_decisions:
- issue: Ἕλληνες的身份
  choice: 保留“希腊人”这一族群或文化称呼
  alternative: 外邦人；说希腊话的犹太人；归信犹太教的人；敬畏上帝的人
  rationale: 原文只称他们为Ἕλληνες，并说他们来过节敬拜，没有进一步界定其宗教或族群身份。译文不把这一真实的不确定性替读者消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上耶路撒冷”保留圣经朝圣语境中的“上去”概念，同时补明目的地；句序按自然汉语调整。
