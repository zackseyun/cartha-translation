  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: zh_hans
  text: 他们之所以不能信，是因为以赛亚又说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 之所以
  rationale: 该短语明确表达原因，并与后面的“是因为”构成自然的现代汉语因果结构，连接上文所述情形。
- source_word: οὐκ ἠδύναντο
  choice: 不能
  rationale: 忠实表达 δύναμαι 否定式所指的能力缺失，不弱化为“不肯”或“不愿”。
- source_word: πιστεύειν
  choice: 信
  rationale: 在约翰福音语境中，简洁的“信”自然对应 πιστεύειν，也保持其未明说宾语的形式。
- source_word: ὅτι
  choice: 是因为
  rationale: 在此按因果意义处理，引出他们不能信的原因；与前面的“之所以”搭配，汉语流畅且关系明确。
- source_word: πάλιν
  choice: 又
  rationale: 表示继前一处引文之后，以赛亚另有一言；“又”比“再次”更适合引述公式。
- source_word: εἶπεν
  choice: 说
  rationale: 以自然、常规的汉语引述公式对应 λέγω。
- source_word: Ἠσαΐας
  choice: 以赛亚
  rationale: 采用简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 所述“不能信”的性质
  choice: 直译为“不能信”，保留能力上的否定，不进一步解释其机制。
  alternative: 译为“不肯信”，或在经文中明确套入特定的神学体系。
  rationale: 希腊文 οὐκ ἠδύναντο 表达不能，而非仅仅不愿；但本节并未单独阐明这种不能与神的作为、人所负责任之间的完整关系，因此译文应保留张力，不替经文作教义性裁断。
- issue: ὅτι 与不能相信之间的逻辑关系
  choice: 译作“是因为”，使其引出下文以赛亚的话作为所述原因或经文依据。
  alternative: 译作较弱的“因为经上又记着”，或把它处理成单纯引述内容的“说……”。
  rationale: ὅτι 在语境中最自然地具有因果作用；译文保留这一较强联系，同时不在本节内预先解释下一节引文如何构成原因。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们之所以不能信，是因为……”既清楚呈现原文连续的因果结构，也避免生硬欧化；冒号保留本节作为下一节引文导语的功能。
