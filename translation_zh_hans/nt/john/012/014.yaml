  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: zh_hans
  text: 耶稣找到一头小驴，就坐在它上面，正如经上所记：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρὼν
  choice: 找到
  rationale: 不定过去时主动分词修饰“耶稣”，表示先于主句动作发生；汉语用“找到……就……”自然表达这一先后关系。
- source_word: δὲ
  choice: 就
  rationale: δέ在此是推进叙事的轻微连接词，并非明显转折；结合分词结构译作“就”，使行文自然。
- source_word: ὀνάριον
  choice: 一头小驴
  rationale: ὀνάριον是“驴”的指小形式，可指幼小的驴；“小驴”既简明自然，也保留其年龄或体形未完全确定的语义范围。
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: 骑坐在上面
  rationale: 原文直译为“坐在它上面”；在骑乘牲畜的语境中，“骑坐”既保留“坐”的词义，又避免汉语读者误解为普通坐姿。
- source_word: καθώς ἐστιν γεγραμμένον
  choice: 正如经上所记
  rationale: 这是引介经文的固定表达；“正如”体现καθώς的对应意味，“经上所记”则以自然庄重的现代汉语表达完成时被动分词所含的既成效力。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 希腊语叙事中人名前常带冠词，现代汉语人名无需另行表达冠词。
theological_decisions:
- issue: 耶稣的行动与随后所引经文之间的关系
  choice: 表明耶稣找到小驴并骑坐其上与经上所记相对应，但不明说他这样做的动机。
  alternative: 动态译成“为要应验经上的话”，明确表达耶稣有意成就预言。
  rationale: 本节先叙述行动，再以“正如经上所记”引出经文，确立了二者的对应关系，却没有在此明确说明行动的目的或动机；译文保留这种克制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“找到……就……”清楚呈现动作次序；“骑坐”适合骑驴语境，同时避免过度解释。原文ὀνάριον的“小、幼”含义已由“小驴”体现，故无需脚注。
