  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: zh_hans
  text: 耶稣却回答他们说：“人子[a]得荣耀的时刻[b]已经到了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是耶稣常用的自称，并使人联想到《但以理书》7章；这里保留这一称号。
    reason: alternative_reading
  - marker: b
    text: 希腊文为“小时／时刻”；这里指所定的决定性时刻。“时刻”是《约翰福音》中反复出现的用语，与耶稣的受难和得荣耀相关。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: 回答他们说
  rationale: 用现代汉语自然的引语格式表达历史现在时、间接宾语和引语分词；不生硬地逐词译成“正在回答他们，说”。
- source_word: Ἐλήλυθεν
  choice: 已经到了
  rationale: “已经”体现完成时所表达的结果状态：所定的时刻如今已经来临。
- source_word: ἡ ὥρα
  choice: 时刻
  rationale: 既保留“特定、决定性时点”的含义，也比字面译作“小时”更符合现代汉语；同时可承载《约翰福音》中反复出现的“时刻”主题。
- source_word: ἵνα δοξασθῇ
  choice: 得荣耀
  rationale: 在“……的时刻已经到了”这一汉语结构中自然表达ἵνα从句的内容或指向，并保留被动形式可能涵盖的神圣行动意味，而不具体说明施动者。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其与《但以理书》7章的互文联系，避免将其简化为泛指“人”或解释性过强的称谓。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου这一称号的译法
  choice: 人子
  alternative: 那位真正的人／属人的那一位
  rationale: “人子”是简洁、通行且具有经文互文辨识度的译法；它保留称号本身的张力，不预先限定其仅为人性描述或仅为某一种弥赛亚解释。
- issue: “得荣耀”与受难之间的约翰式张力
  choice: 保留“得荣耀”，不加解释性限定
  alternative: 被高举得荣耀／借着受死得荣耀
  rationale: δοξασθῇ本身只说“得荣耀”；上下文会展开其与死亡、复活和高举的关系。正文不应把这些层面提前合并为单一解释。
- issue: Ἐλήλυθεν ἡ ὥρα的时态与主题性
  choice: 时刻已经到了
  alternative: 时候到了／时刻来到了
  rationale: “已经到了”体现完成时的当前结果，并保留《约翰福音》中耶稣所定“时刻”现已来临的主题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“却”对应叙事转折δὲ；“回答他们说”保留原文引入直接引语的结构，但符合汉语习惯。语序调整为“人子得荣耀的时刻已经到了”，使句子流畅，同时没有消除ἵνα从句可表达内容或目的的语义空间。
