  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: zh_hans
  text: 耶稣却大声呼喊说：“信我的人[a]，不是信我，而是信差我来的那一位[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡信我的人”。
    reason: lexical_alternative
  - marker: b
    text: 这不是否认耶稣是人所信的对象，而是表明：信他与信差遣他来的父不可分割。
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν καὶ εἶπεν
  choice: 高声说
  rationale: κράζω表示响亮、公开地发声；与“说”连用时，译作“高声说”既保留声音强度和郑重语气，也符合现代汉语表达。
- source_word: Ὁ πιστεύων
  choice: 信我的人
  rationale: 带冠词的现在时分词在此泛指任何相信的人。“信我的人”自然简洁，并保留其概括性；脚注列出更显泛指意味的译法。
- source_word: πιστεύων / πιστεύει
  choice: 信
  rationale: πιστεύω与εἰς连用，在约翰著作中通常表示以某人为信仰与信赖的对象。汉语“信”能自然保留本节反复出现的同一动词。
- source_word: εἰς ἐμέ
  choice: 我
  rationale: πιστεύω εἰς在现代汉语中自然译为“信我”；若机械译出介词，则会形成不自然的“信入我”。
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: 而是信差我来的那一位
  rationale: 保留ἀλλά的强对照，也按原文以间接称谓表达差遣者，不在正文中提前明确为“父”。“差我来的”是现代汉语中自然且能体现差遣关系的表达。
- source_word: δὲ
  choice: 却
  rationale: δὲ在此承接上文并带有轻微转折；“却”比句首“但是”更紧凑，也适合叙事转折。
theological_decisions:
- issue: “不是信我，而是信差我来的那一位”可能被误解为否认耶稣是信仰的对象。
  choice: 正文保留原文鲜明而有张力的否定—转折结构，并用脚注说明信耶稣与信差他来的那一位不可分割。
  alternative: 在正文中增添“不是只信我”，或直接把差遣者译为“父”。
  rationale: 希腊原文没有“只”或“单单”，加入会替原文消解其修辞和神学张力；原文也只说“差我来的那一位”，因此正文保留这种间接指称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声说”体现公开宣告的力度；“那一位”保持对差遣者的尊称和原文的间接指称。所有解释性补充均置于脚注，正文不增添原文没有的“只”。
