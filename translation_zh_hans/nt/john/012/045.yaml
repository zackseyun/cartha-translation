  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: zh_hans
  text: 并且，看见我的人，也看见差我来的那一位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”也可译作“注视”或“观看”；希腊语动词可含有专注观察、有所领会的意味，并不只指肉眼看见。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本句承接上文；汉语经文独立呈现时省去句首“并且”更自然，语义关系仍由上下文体现。
- source_word: ὁ θεωρῶν
  choice: 看见……的
  rationale: 带冠词的现在分词泛指具有这一行为的人；采用“……的，就是……”结构，既自然又保留代表性的泛称。
- source_word: ἐμὲ
  choice: 我
  rationale: 第一人称单数宾格；在“看见我的”中直接、自然地表达其宾语功能。
- source_word: θεωρεῖ
  choice: 看见了
  rationale: θεωρέω可指观看、注视或带着认知的看见。译作“看见”符合现代汉语，并与前一处重复；“了”使主句表达自然，不限定为一次性的过去事件。
- source_word: τὸν πέμψαντά με
  choice: 差我来的那一位
  rationale: 保留带冠词的不定过去时分词所表达的关系性称谓，不直接补入原文未明说的“父”；“差我来的”是现代汉语中自然、庄重的表达。
theological_decisions:
- issue: 看见耶稣与看见差他来者之间的关系
  choice: 按原文直接表达为“看见我的，就是看见了差我来的那一位”
  alternative: 弱化为“借着我认识差我来的那一位”，或强化改写为关于本体同一的说明
  rationale: 原文以重复的 θεωρέω 陈述直接的启示性关联。译文保留其力度与张力，既不弱化为间接获知，也不加入本节未明说的教义解释。
- issue: 是否将差遣者明确译为“父”
  choice: 保留“差我来的那一位”
  alternative: 译作“差我来的父”
  rationale: 上下文可辨明所指，但本节希腊文本使用关系性描述而非 πατήρ；保留原有措辞可避免解释性增补。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“……的，就是……”简洁保留希腊语泛指结构；“那一位”尊重所指对象，同时不把原文没有出现的称谓加入正文。
