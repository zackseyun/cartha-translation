  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: zh_hans
  text: 于是，他们对他说：“他对你做了什么？他怎样开了你的眼睛？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: 他们……说
  rationale: 不定过去时的 λέγω 在此引出众人的直接问话；译为“说”比按语境具体化为“问”更贴近原词，同时中文引号内的疑问句已清楚表达询问功能。
- source_word: οὖν
  choice: 于是
  rationale: οὖν 承接上文并推动论述；“于是”在现代汉语中自然保留其承接意味，也不过度强化逻辑推论。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与 λέγω 的与格结构相应，所指为先前失明而得医治的人。
- source_word: Τί
  choice: 什么
  rationale: 直接对应疑问代词，询问耶稣所做的事。
- source_word: ἐποίησέν σοι
  choice: 他对你做了什么
  rationale: ποιέω 加与格可表示“对某人做”；此译保留中性措辞，不预先解释为有益的“为你做”。
- source_word: πῶς
  choice: 怎么
  rationale: 询问方式或手段；“怎么”自然、口语清楚，同时适合直接盘问的语境。
- source_word: ἤνοιξέν
  choice: 使……睁开
  rationale: ἀνοίγω 在“眼睛”这一搭配中直译为“打开”不够自然；“使眼睛睁开”既保留主动施事，也符合现代汉语表达。
- source_word: σου τοὺς ὀφθαλμούς
  choice: 你的眼睛
  rationale: 希腊语以冠词和属格代词表达身体部位的所属；现代汉语自然译作“你的眼睛”。
theological_decisions: []
