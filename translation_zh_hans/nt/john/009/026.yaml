  source_fidelity: 首问“他对你做了什么？”准确保留了τί ἐποίησέν σοι的中性、带盘问色彩的问法。第二问的主动施事也已体现；但“使你的眼睛睁开”较容易指向使人睁开眼睑，未能最直接表达ἀνοίγω与“眼睛”搭配所指的“开眼／使之能看见”。
  naturalness: “于是，他们对他说”以及连续的直接问句都符合现代标准汉语。将第二问改作“他怎样开了你的眼睛？”更简洁自然，也更贴合本段围绕“眼睛得开”的重复用语。
