  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: zh_hans
  text: 于是，邻居和那些从前见过他、知道他是乞丐的人纷纷说：“这不是那个常坐着讨饭的人吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化可译作：“这不是那个坐着讨饭的人吗？”希腊原文用“坐着”和“讨饭”两个分词，以他从前惯常的行为来指认他。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文事情的发展，兼有叙事推进的作用；“于是”自然清楚，不把推论意味说得过重。
- source_word: γείτονες
  choice: 邻居
  rationale: 直接表达住在他附近的人，符合该词在本语境中的具体含义。
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: 那些从前见过他……的人
  rationale: θεωροῦντες 表示看见或观察，τὸ πρότερον 指先前；合译后既自然，也保留他们过去见过并认得他的意思。
- source_word: ὅτι προσαίτης ἦν
  choice: 见过他是个乞丐
  rationale: 这里的 ὅτι 可引出他们从前所见、所知的身份。采用较贴近原文且在现代汉语中可理解的表达，避免明确译成因果关系。
- source_word: προσαίτης
  choice: 乞丐
  rationale: 是指靠向人乞求施舍为生的人；“乞丐”准确、通行。
- source_word: ἔλεγον
  choice: 都说
  rationale: 未完成时描写当时众人的持续或相互议论；汉语以“都说”自然呈现群体发言，时态层面不作生硬复制。
- source_word: Οὐχ οὗτός ἐστιν
  choice: 这不是……吗？
  rationale: 保留原文预期肯定回答的反问形式，也是现代汉语自然表达。
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: 那个常坐着讨饭的人
  rationale: 两个名词化分词按其语境描述他以往惯常且为人熟知的行为；“常”使这种习惯性明确，而“坐着讨饭”保留两个动作。
