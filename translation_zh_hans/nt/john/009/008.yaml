translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“讨饭”比“行乞”更贴近日常对话，也能自然再现旁人的问话；正文中的“常”传达分词在语境里的惯常活动意味。脚注标记置于所说明的整句之后。
