  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: zh_hans
  text: 那人回答他们说：“这真是件令人惊奇的事[a]：你们不知道他是从哪里来的[b]，他竟开了我的眼睛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是令人惊奇之处”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他来自哪里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: 那人回答他们说
  rationale: 保留希腊文常见的叙事性答话结构，同时以自然的现代汉语表达；“那人”明确承接上下文中生来失明而得医治的人。
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: 这才是件稀奇的事
  rationale: “这才是”自然传达指示和解释语气，也体现此处带反讽意味的强调；“稀奇”涵盖 θαυμαστόν 所表达的惊异、非同寻常之意。
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: 你们竟然不知道
  rationale: 保留显式代词 ὑμεῖς 的强调；“竟然”体现说话人对这些宗教领袖声称不知耶稣来历的惊异和反讽，但不改变“知道”的基本含义。
- source_word: πόθεν ἐστίν
  choice: 他是从哪里来的
  rationale: 自然表达 πόθεν 所指的来源或来历，并保留对耶稣个人来历的指涉，不把它抽象化为“他的起源”。
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: 可是他却开了我的眼睛
  rationale: καί 字面为“并且”，但语境中有鲜明的转折和反差；“可是……却……”自然传达这种语篇作用。“开了我的眼睛”直接指身体得医治，同时保留约翰叙事中可能存在的属灵视力共鸣。
theological_decisions:
- issue: “开了我的眼睛”在约翰福音中可能具有身体医治与属灵看见的双重共鸣
  choice: 保留“开了我的眼睛”这一具体医治表达，不明说属灵启迪
  alternative: 译成突出“使我属灵上看见”或“使我明白”的措辞
  rationale: 本节直接所指是那人的眼睛得到医治；属灵看见的主题应由上下文自然显现，不宜在译文中预先解释。
- issue: 宗教领袖“不知道他从哪里来”所涉及的耶稣来历问题
  choice: 保留为“他是从哪里来的”，不限定为地理出身或神圣来源
  alternative: 明确译为“不知道他的家乡”或“不知道他由神而来”
  rationale: πόθεν 可指来源或来历，而约翰福音常借此形成多层含义；译文应保留这种张力，不替读者选定单一解释。
translation_notes:
  register: 采用庄重而通俗的现代标准普通话。“这才是件稀奇的事”和“竟然”保留说话人的惊异及反讽语气；“可是他却”清楚呈现前后反差。所有脚注标记均置于相应正文词组之后。
