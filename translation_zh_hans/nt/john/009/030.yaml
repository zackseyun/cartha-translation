  source_fidelity: 译文总体准确传达了答话、对对方无知的讶异，以及医治眼睛这一事实。不过“这才是”较原文的指示性“这正是／这就是”增加了排他性强调；“可是他却”双重转折稍强于 καί 在此所承担的反讽性并列。
  naturalness: “那人回答他们说”略有欧化，现代标准汉语以“那人回答他们说”仍可接受，但“那人回答说”更自然；整句改为“这真是件令人惊奇的事”自然且保留反讽语气。
  terminology: “开了我的眼睛”忠实保留实际医治及叙事中的潜在共鸣。“他是从哪里来的”妥当地保留 πόθεν 的来源／来历歧义，不应限定为籍贯或神圣来源。
