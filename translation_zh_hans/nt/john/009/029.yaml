  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: zh_hans
  text: 我们知道，上帝曾向摩西说过话；至于这个人，我们却不知道他是从哪里来的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他从何而来。”在约翰福音中，关于耶稣来源的问题，既可能有一般意义，也可能有更深的神学含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 显明主语，并在上下文中与“这个人”形成对照；现代汉语无需另加“我们自己”来强化。
- source_word: οἴδαμεν
  choice: 知道
  rationale: 直接表达说话者所声称的知识与确定性；两处均用“知道”，保留原文的重复。
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: 上帝曾对摩西说过话
  rationale: 按希腊语与格表达“对摩西”，而非将摩西表达为信息的间接接受者；“曾……说过话”自然传达完成时所指向的既成事实及其持续有效性。
- source_word: τοῦτον δὲ
  choice: 至于这个人……却
  rationale: “至于”体现话题转换，“却”体现与前句的鲜明对照；“这个人”保留指称耶稣时的疏离语气，而不过度增加贬义。
- source_word: πόθεν ἐστίν
  choice: 他是从哪里来的
  rationale: 自然表达来源或出处，同时保留普通籍贯与更深层来源两种可能含义。
theological_decisions:
- issue: πόθεν ἐστίν 所指耶稣来源的含义
  choice: 译作“他是从哪里来的”，不明确限定为地理籍贯或属天来源
  alternative: “他的来历是什么”或“他从何而来”
  rationale: 约翰福音中有关耶稣来源的问题常具有叙事与神学双重意味；宽泛译法保留原文的反讽和张力，不替说话者或读者预先作出解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”作为 θεός 的标准译法；分号和“至于……却……”使原文的对照关系清楚自然。脚注标记置于相关分句之后。
