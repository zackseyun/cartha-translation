  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: zh_hans
  text: 耶稣和了泥[a]、开了那人的眼睛[b]的那一天，正是安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泥”或译“泥膏”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“开了他的眼睛”，在这里是医治他、使他看见的具体说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: 安息日
  rationale: 用现代汉语中通行的圣经用语表达犹太历法中的安息日；汉语无需用冠词区分“一”或“这”安息日。
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: ……的那一天
  rationale: 把介词关系结构自然地译为汉语定语结构，同时保留明确的时间指向。
- source_word: πηλός
  choice: 泥
  rationale: 结合上文唾沫与地上尘土混合的情景，“泥”最自然；“泥膏”也可表达其可敷抹的形态。
- source_word: ἐποίησεν
  choice: 和了
  rationale: 在“泥”的搭配中，“和泥”比直译“制造泥”更符合现代汉语，也准确表达把材料调和成泥的动作。
- source_word: ἀνέῳξεν
  choice: 开了
  rationale: 保留原文“打开”的具体形象，不直接改写成较具解释性的“使他复明”。
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: 他的眼睛
  rationale: 照原文保留代词和具体的身体部位，不抽象化为“他的视力”。
- source_word: δὲ
  choice: 以句式转折推进表达，不另译连接词
  rationale: δέ在此是轻微的叙事承接；现代汉语凭上下文和“正是”的句式即可自然体现，不必机械加上“而”或“这时”。
theological_decisions:
- issue: 安息日与耶稣医治行动的关系
  choice: 只陈述这件事发生在安息日，不添加对安息日律法或随后争议的解释
  alternative: 扩译为强调耶稣在安息日做了被视为工作的事
  rationale: 本节以时间说明为后文冲突铺垫，但自身没有判定耶稣是否违反安息日规定；译文应保留这一叙事张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正是”突出原文所交代的关键时间背景；“和了泥”符合汉语习惯，同时保留耶稣实际动作的具体性。
