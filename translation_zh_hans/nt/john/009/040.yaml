  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: zh_hans
  text: 有些和耶稣在一起的法利赛人听见这些话，就对他说：“难道我们也瞎吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们也不是瞎的，对吗？”希腊文的问句用μή引导，预期的回答是否定的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: 听见
  rationale: 此处表示听到耶稣刚才所说的话；“听见”符合现代汉语叙事表达。
- source_word: ἐκ τῶν Φαρισαίων
  choice: 有几个……法利赛人
  rationale: ἐκ加属格具有部分义，指法利赛人中的一些人，而不是全部；“有几个”自然地保留这一含义。
- source_word: ταῦτα
  choice: 这些话
  rationale: 复数指向耶稣前面所说的内容；汉语用“这些话”比“这些事”更自然，同时没有改变所指。
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: 和耶稣在一起的
  rationale: 保留这些法利赛人当时与他同在的限定关系；明确写“耶稣”可避免汉语中代词所指含混。
- source_word: εἶπον αὐτῷ
  choice: 就对他说
  rationale: 直译其言说含义，并由后面的引语问号表明这是提问。
- source_word: Μὴ
  choice: 难道……吗
  rationale: μή引导的问题预期否定回答；汉语反问格式“难道……吗”自然传达说话者认为答案应为“不是”。
- source_word: καὶ
  choice: 也
  rationale: 把“我们”与前文所说的瞎眼者联系起来，表达“我们也”的附加意义。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留明示代词及其强调意味。
- source_word: τυφλοί
  choice: 瞎
  rationale: 保留原文未加限定的“盲、瞎”意象，让上下文显明其比喻意义，不在正文中增添“属灵上”。
- source_word: ἐσμεν
  choice: 是……吗
  rationale: 以汉语判断句和疑问语气自然表达现在时系词。
theological_decisions:
- issue: 是否明说τυφλοί的属灵或比喻含义
  choice: 正文只译“瞎”，不加“属灵上”
  alternative: 译作“属灵上也是瞎的”
  rationale: 原文只用“瞎”而未加限定；上下文足以显出比喻意义。保留这一措辞可维持约翰叙事中的双关和反讽，也避免把解释写进正文。
- issue: μή所表达的否定答案预期
  choice: 用“难道我们也瞎了吗？”传达预期答案为“没有”
  alternative: 用较中性的“我们也瞎了吗？”
  rationale: μή通常引导预期否定回答的问题；“难道”能够体现法利赛人的不以为然，同时不把语气扩展成原文没有明说的强烈讥讽。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“有几个”保留部分义；为避免两个“他”造成所指不清，在限定语中明说“耶稣”。正文保留“瞎”的简洁意象，脚注说明问句的否定倾向。
