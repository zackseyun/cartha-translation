  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: zh_hans
  text: 于是，法利赛人也再次问他是怎么看见的。他对他们说：“他把泥[a]抹在我的眼睛上，我洗了，现在看得见了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“黏土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: 于是……再次
  rationale: οὖν承接上文的叙事发展，译作“于是”；πάλιν表明再次询问，译作“再次”。
- source_word: ἠρώτων
  choice: 问
  rationale: 未完成时可表示持续或反复询问；汉语结合“再次”已能自然传达这里的语境。
- source_word: καὶ οἱ Φαρισαῖοι
  choice: 法利赛人也
  rationale: καί把法利赛人列入先前询问者的行列，“也”保留这一衔接作用。
- source_word: πῶς ἀνέβλεψεν
  choice: 是怎么看见的
  rationale: ἀναβλέπω在医治失明的语境中指获得或恢复视力；此人自出生便失明，因此“怎么看见的”比预设曾经有视力的“重见光明”更稳妥。
- source_word: Πηλὸν
  choice: 泥
  rationale: πηλός可指泥或黏土；“泥”符合本段用唾沫和泥的语境，也最通俗自然，并以脚注保留“泥土”的可能表达。
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: 他把泥抹在我的眼睛上
  rationale: 原文基本义为把泥放在眼睛上；按汉语搭配译作“抹在”，自然呈现这一动作而不增添解释。
- source_word: ἐνιψάμην
  choice: 我洗了
  rationale: 中态形式在此指他自己洗净；汉语“我洗了”已自然包含主语亲自施行动作，无须生硬译成“我洗了自己”。
- source_word: βλέπω
  choice: 现在就看得见
  rationale: 现在时强调他目前看得见的状态；“现在”使希腊文从过去动作转到当前结果的时态对比在汉语中清楚可感。
theological_decisions:
- issue: ἀναβλέπω是否应译为“恢复视力”
  choice: 译作“看见”，不预设他从前曾有视力
  alternative: 重见光明／恢复视力
  rationale: 约翰福音9章说明此人生来失明；较中性的译法既符合该动词在医治语境中的含义，也避免制造他曾经看得见的暗示。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“是怎么看见的”符合口语化询问，同时不失经文语体；引语保留简短、直接的见证风格。
