  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: zh_hans
  text: 他回答说：“主啊，他是谁，好让我信他呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主啊”也可译作“先生”。希腊语 κύριε 既可用作尊敬的称呼，也可意为“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: 他回答说
  rationale: 希腊文直译近于“那人回答并说”。现代汉语通常用“回答说”自然表达这一叙事复合语式；“他”承接上文所指的那人。
- source_word: Καὶ τίς ἐστιν
  choice: 他是谁
  rationale: 句首 καί 在这里可带有承接、推进语气；汉语问句无需机械译出“并且”，以“他是谁”更自然，同时保留询问身份的直接性。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε 既可称“主”，也可作礼貌称呼“先生”。正文采用传统而透明的“主啊”，脚注保留语境中确实存在的另一可能。
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: 好让我信他
  rationale: ἵνα 加虚拟式表达目的；“好让我”自然呈现目的关系。πιστεύω εἰς 译作“信他”，简洁保留对某人相信、信靠的指向。
theological_decisions:
- issue: 蒙医治者在明确认信之前如何称呼耶稣（κύριε）
  choice: 主啊
  alternative: 先生
  rationale: 该称呼在希腊文中可兼具尊称与信仰称号的含义；上下文尚不能完全确定说话者此刻的认识程度，因此正文译“主啊”，并用脚注保留“先生”，不消除原文的张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“回答说”避免生硬照译“回答并说”；“好让我信他呢”表现请求说明身份的目的和问句语气。脚注标记置于整句引语之后。
