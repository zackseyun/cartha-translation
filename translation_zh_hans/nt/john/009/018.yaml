  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: zh_hans
  text: 于是，犹太人[a]不相信他曾经失明并且后来能看见，直到他们叫来那个后来能看见的人的父母为止。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰在不同语境中使用“犹太人”时，这一称呼也可能特指“犹太领袖”或“犹太地人”；这里未必泛指所有犹太人。
    reason: 保留 οἱ Ἰουδαῖοι 在本段中的指称歧义，并避免现代读者误以为这里必然泛指所有犹太人。
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: 不相信
  rationale: 此处 πιστεύω 后接 ὅτι 内容从句，表示不接受有关事实的陈述；“不相信”比“不信任”更准确，也不额外加入“拒绝”的意志色彩。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 原文直译为“犹太人”。约翰福音中此称呼可按语境指犹太地区的人、犹太当权者，或特定场景中的犹太群体；正文不擅自缩窄所指，另以脚注说明。
- source_word: περὶ αὐτοῦ
  choice: 他
  rationale: 该短语表示“不相信关于他的这件事”；汉语将“关于他”自然地融入后面的内容从句，译作“不相信他曾……后来……”，避免生硬直译。
- source_word: ἦν τυφλὸς
  choice: 曾是瞎眼的
  rationale: “曾是”表达失明发生在恢复视力之前，符合叙事时序；“瞎眼的”保持原文对身体状况的直接描述。
- source_word: ἀνέβλεψεν
  choice: 后来得以看见
  rationale: ἀναβλέπω 在医治语境中指获得或恢复视力。“得以看见”不预设此人以前曾有视力，加入“后来”清楚呈现与先前失明的时序关系。
- source_word: ἕως ὅτου
  choice: 直到
  rationale: 准确表达该复合连接语所标示的时间界限。
- source_word: ἐφώνησαν
  choice: 叫来
  rationale: φωνέω 在此语境中有叫来、传唤之意；“叫来”自然且不过度强化正式审讯色彩。
- source_word: γονεῖς
  choice: 父母
  rationale: γoνεῖς 的标准对应词，简洁准确。
- source_word: τοῦ ἀναβλέψαντος
  choice: 那得以看见之人
  rationale: 保留定冠词化分词以恢复视力事件指认此人的方式，不增添原文未明说的名词。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事发展；“于是”在现代汉语中自然体现其推论兼叙事衔接功能。
theological_decisions:
- issue: 约翰福音中 οἱ Ἰουδαῖοι 的所指与语气
  choice: 正文译作“犹太人”
  alternative: “犹太人的领袖”或“犹太地区的人”
  rationale: 希腊文没有明说“领袖”，虽上下文是调查并盘问得医治者的一群人，正文仍保留原称呼及其歧义，不把特定语境中的反对者泛化解释，也不在正文中擅自限定其社会身份；脚注提示可能的语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“曾是……后来……”清楚表达失明与得见的先后关系；保留末句以“那得以看见之人”指认当事人的原文结构，虽略有重复，却维持原文强调。
