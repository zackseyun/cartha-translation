  to: 于是，犹太人[a]不相信他曾经失明并且后来能看见，直到他们叫来那个后来能看见的人的父母为止。
  rationale: 修订仅改善现代汉语的自然度和脚注术语。“失明”准确表达τυφλός；“后来能看见”表达ἀνέβλεψεν所指的获得视力，且不把“恢复/重获”解释为先前必有视力。保留“犹太人”于正文，并以脚注提示其可能的语境化指称。
