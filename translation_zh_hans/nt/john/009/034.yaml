  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: zh_hans
  text: 他们回答他说：“你生来就全然在罪中[a]，还要教导我们吗？”他们就把他赶了出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“罪”为复数，直译是“在诸罪中”；这里保留的是他们带有侮辱意味的指控，并未说明这些罪的来源。
    reason: lexical_alternative
  - marker: b
    text: “赶了出去”可指把他赶离他们所在之处；结合上下文，也可能暗含把他排除在会堂群体之外。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 他们回答他说
  rationale: 保留约翰叙事中“回答并说”的双动词表达，同时采用自然、庄重的现代汉语句式。
- source_word: Ἐν ἁμαρτίαις
  choice: 在罪中
  rationale: 原文“罪”为复数，中文若直译为“在诸罪中”较生硬；正文用集合性的“罪”表达，脚注说明复数形式及其指控意味。
- source_word: ἐγεννήθης ὅλος
  choice: 生来就全然
  rationale: ὅλος 强调此人从出生起整个生命状况都被对方说成在罪中；“全然”既保留强调语气，也避免把它误解为修饰出生动作本身。
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: 还要教导我们吗？
  rationale: 显明代词 σὺ 带有轻蔑、愤怒的强调；“还要……吗”自然传达反诘语气，而不另加原文没有的称谓。
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: 把他赶了出去
  rationale: ἐκβάλλω 与 ἔξω 共同表达强硬逐出；“赶了出去”符合现代汉语，也保留究竟只是赶离现场还是包含会堂群体排斥的语境张力。
theological_decisions:
- issue: “生来就在罪中”与先天失明之间的关系
  choice: 按说话者的敌意指控译出，但不说明所指是此人自己的罪、父母的罪、遗传之罪或一般有罪状态。
  alternative: 译作“你生来就是个十足的罪人”或“你生来就背负父母的罪”。
  rationale: 希腊文记录了对方的侮辱，却没有在本句界定罪的来源或苦难与罪的神学关系；译文应保留这种未决张力。
- issue: “赶出去”是否指正式逐出会堂
  choice: 正文仅译“把他赶了出去”，脚注提示语境中可能包含会堂群体的排斥。
  alternative: 直接译作“把他逐出会堂”。
  rationale: 本句没有明说“会堂”，直接补入会过度确定其制度性含义；但上下文使这种可能性值得在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全然在罪中”略带正式色彩，以保留原文 ὅλος 的强烈强调；“还要教导我们吗”表现对方轻蔑的反诘；“赶了出去”自然传达敌意和强制性。
