  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们若是瞎眼的，就没有罪了；但如今你们说：‘我们看得见。’你们的罪仍然存留。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪”也可理解为“罪责”；希腊原文作“罪”，此处可能包含应负罪责的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: 瞎眼的
  rationale: 保留原文直译及本章由肉眼失明引向属灵认知的隐喻，不在正文中添加“属灵”以免提前解释。
- source_word: οὐκ ἂν εἴχετε
  choice: 就没有
  rationale: 未完成时配合ἄν表达与事实相反的假设结果；“就没有”符合现代汉语条件句表达。
- source_word: ἁμαρτίαν / ἡ ἁμαρτία ὑμῶν
  choice: 罪 / 你们的罪
  rationale: ἁμαρτία的直接对应是“罪”；语境中虽含罪责意味，正文仍保留约翰惯用词及其语义张力。
- source_word: νῦν δὲ
  choice: 但如今
  rationale: 清楚标示假设情形与当前现实之间的转折。
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 你们说：‘我们看得见’
  rationale: 保留第二人称复数转为第一人称复数直接引语的修辞和反讽；“看得见”在汉语中比孤立的“看见”更自然地与“瞎眼”形成对照。
- source_word: μένει
  choice: 仍然存在
  rationale: 表达现在时所指的持续状态；既保留μένει的延续意味，也符合此处现代汉语习惯。
theological_decisions:
- issue: 是否明说“瞎眼”是属灵的失明，并将“罪”解释为罪责
  choice: 正文保留“瞎眼”和“罪”，不作解释性扩写
  alternative: “你们若在属灵上瞎眼，就不至于有罪责”或“你们若是瞎眼的，就没有罪责了”
  rationale: 本章刻意借肉眼失明谈属灵认知；原文也使用通常指“罪”的ἁμαρτία。直译能保留隐喻、约翰用语及罪与罪责之间的语义张力。
- issue: 末句与前句的逻辑关系
  choice: 用“所以”明示语境中蕴含的结果关系
  alternative: 仅作并列：“你们的罪仍然存在”
  rationale: 希腊文末句没有显式因果连词，但其论证关系明显；加入“所以”可使现代汉语顺畅，同时不改变命题内容。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“瞎眼”延续全章核心意象；“我们看得见”既合乎口语，也保留反讽。脚注标记置于相关整句之后。
