lexical_decisions:
- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: 我在世上的时候
  rationale: ὅταν与虚拟语气ὦ构成不定时间从句；在本段语境中自然译作“……的时候”，既表达时间范围，也不额外强化为“每当”。
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: 是世上的光
  rationale: 保留“光”这一核心隐喻，并以自然汉语表达属格τοῦ κόσμου所指的范围与关系。
theological_decisions:
- issue: ὅταν是否应译成“每当”
  choice: ……的时候
  alternative: 每当我在世上
  rationale: “每当”可能突出反复发生的意味；结合上下文，此处主要指耶稣在世上的时间，因此采用较自然且不过度界定的表达。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留原文两个“世上”的呼应和“光”的隐喻。
