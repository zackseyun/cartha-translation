  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: zh_hans
  text: 他们把那从前瞎眼的人带到法利赛人那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: 带到
  rationale: 这是叙事中的历史现在时；现代汉语叙事无须标明时态。“带到”自然表达把人领往某处，并与目的语“法利赛人那里”搭配。
- source_word: αὐτὸν
  choice: 那……的人
  rationale: 原文代词“他”随后由同位短语“那从前瞎眼的”加以说明；汉语将两者合并为“那从前瞎眼的人”，指代清楚且语序自然。
- source_word: πρὸς τοὺς Φαρισαίους
  choice: 到法利赛人那里
  rationale: πρός加宾格在此表示朝向某些人移动；“到……那里”保留方向含义，不增添“受审”等上下文推断。
- source_word: Φαρισαίους
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般中文语境中通行的群体名称音译。
- source_word: τόν ποτε τυφλόν
  choice: 那从前瞎眼的人
  rationale: 该短语名词化，直指“那个从前是瞎眼的”；补出“人”符合现代汉语，且“从前”清楚表现他过去失明、如今已不再失明的对比。
- source_word: ποτε
  choice: 从前
  rationale: 此处表示先前的状态；“从前”比“曾经”略具叙事庄重感，同时自然易懂。
- source_word: τυφλόν
  choice: 瞎眼
  rationale: 在本段叙事中，“瞎眼”是自然、明确且为普通读者熟悉的说法。
