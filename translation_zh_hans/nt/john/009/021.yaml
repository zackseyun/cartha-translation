id: JHN.9.21
reference: John 9:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: zh_hans
  text: 但至于他现在是怎样看见的，我们不知道；又是谁开了他的眼睛，我们也不知道。你们问他吧，他已经成年了；他会亲自说明自己的情况[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他能亲自作答。”希腊文的将来时在这里也可能实际表示他有能力或有责任亲自回答。
    reason: 保留λαλήσει的将来时，同时说明它在此问讯语境中可能具有实际能力或责任的语气。
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: 但他现在怎么会看见
  rationale: πῶς表示“怎么”，δέ在这里轻微转折，νῦν表示“现在”，βλέπει是“看见”。“怎么会看见”自然表达父母声称不知道他如今得见的缘由或方式，同时不把原文过度解释为单纯的能力问题。
- source_word: οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: 直接对应“我们不知道”；原文两次重复这一短语，译文也保留重复，以体现父母回答时的强调。
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: 是谁开了他的眼睛
  rationale: τίς是“谁”，ἤνοιξεν是“开了”。保留“开眼睛”的叙事性表达，使本节与上下文关于医治的措辞相连。
- source_word: αὐτὸν ἐρωτήσατε
  choice: 你们问他吧
  rationale: 这是复数第二人称不定过去时命令式。“你们”明确受话者为在场的盘问者；句末“吧”使现代汉语命令语气自然，但不削弱其直接性。
- source_word: ἡλικίαν ἔχει
  choice: 他已经成年了
  rationale: ἡλικία在此按年龄和独立作答资格理解，而非身高。“已经成年”是现代汉语中清楚、自然的表达。
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: 他自己会说明自己的事
  rationale: αὐτός带强调，περὶ ἑαυτοῦ意为“关于他自己”，λαλήσει是将来时“会说”。译文保留“自己”的强调及将来时形式，也符合受询问场景。
theological_decisions:
- issue: ἡλικίαν ἔχει在上下文中的含义
  choice: 指年龄已足以独立回答，即已经成年
  alternative: 泛指成熟；或指身体高大（在此不大可能）
  rationale: 上下文涉及父母不愿代儿子回答，并让盘问者直接问他；第23节也重复此话。因此，这里主要指社会或法律意义上可自行作答的年龄。
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσει的语力
  choice: 保留为他本人将说明自己的事
  alternative: 译作“他能为自己作答”，把将来时理解为实际能力或责任的表达
  rationale: 原文处于近似审问、取证的场景。“他自己会说明自己的事”既保留将来时及反身强调，也不排除这句话实际上是在表示他有能力或有责任亲自回答。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“我们不知道”的两次重复，并用“开了他的眼睛”延续本段叙事中的关键意象。
