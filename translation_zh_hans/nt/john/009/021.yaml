  naturalness: 修订后采用自然、庄重的现代普通话；“至于……，我们不知道”清楚表达话题转换，“亲自说明自己的情况”也适合本段问讯语境。
  terminology: “已经成年”可恰当表达ἡλικίαν ἔχει在本处所指可独立作答的年龄。“开了他的眼睛”保留原文及上下文的叙事措辞，毋须将其释义性地改作“治好了”。
