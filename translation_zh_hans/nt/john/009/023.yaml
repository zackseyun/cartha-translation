base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: zh_hans
  text: 因此，他父母说[a]：“他年纪已经够大了，问他本人吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他已经成年了，你们问他吧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接第22节所述原因，简洁保留原文的因果关系，并符合现代汉语叙事表达。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 他父母
  rationale: 准确表达复数名词所指的父母双方；汉语中无需另加“亲”。
- source_word: εἶπαν
  choice: 说
  rationale: 采用普通言说动词，不额外引入“回答”或“告诉他们”等原文未明确表达的语义。
- source_word: Ἡλικίαν ἔχει
  choice: 他已经成年了
  rationale: 该习语在上下文中表示此人年纪已足以自行作答。“已经成年了”自然、明确，也保留其能够为自己负责的社会含义，但不刻意赋予严格的现代法律定义。
- source_word: αὐτὸν
  choice: 他本人
  rationale: 原文代词置于动词之前而带有强调意味；“本人”体现父母将询问对象明确转回儿子本人。
- source_word: ἐπερωτήσατε
  choice: 你们问……吧
  rationale: 以自然汉语表达复数第二人称命令；“吧”使直接命令在此处成为合乎语境的敦促，同时不削弱其命令语气。
