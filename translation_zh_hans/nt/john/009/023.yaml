review_pass:
  verdict: revise
  source_fidelity: “因此，他父母说”准确传达 διὰ τοῦτο、οἱ γονεῖς αὐτοῦ 与 εἶπαν；“问他本人吧”也恰当体现 αὐτὸν 的强调及复数命令。唯“已经成年了”在现代汉语中较容易指向法定成年，较原文“年纪已够、可自行受问”的社会成熟含义更为确定。
  naturalness: 修订后的“他年纪已经够大了，问他本人吧”是自然、清楚的现代汉语，并保留父母将询问责任转向儿子本人的语气。
  terminology: 以“年纪已经够大了”避免把 ἡλικίαν ἔχει 限定为现代法律上的成年年龄；脚注以“已经成年了”作为可行但较具体的译法。避免“盘问”，因其常带审讯、刁难意味，超过 ἐπερωτήσατε 的基本“问/询问”含义。
  issues:
  - severity: medium
    issue: “已经成年了”可能将“年纪已够”具体化为现代法定成年。
    rationale: Ἡλικίαν ἔχει 是“有年龄／年纪已足”的习语；本段语境表明他足以自己回答，但原文没有界定特定法律年龄。
  - severity: low
    issue: 脚注中的“盘问”语气偏重。
    rationale: ἐπερωτάω 可指询问或提问；虽然本段有调查场景，“盘问”仍可能额外暗示敌意或审讯性质。
  revised_text: 因此，他父母说[a]：“他年纪已经够大了，问他本人吧。”
