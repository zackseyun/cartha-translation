  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: zh_hans
  text: 他说：“主[a]啊，我信。”并且敬拜[b]他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希腊语κύριε可以是表示尊敬的称呼；这里因上下文以相信和敬拜达到高潮，正文译作“主”。
    reason: alternative_reading
  - marker: b
    text: 或译“向他下拜”或“俯伏在他面前”。希腊语动词可表示俯伏或致敬；这里按上下文译作“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他就
  rationale: 定冠词在这里作代词，指先前得医治的人；δέ在叙事中是轻微承接，用“就”自然推进情节，不强化为明显转折。
- source_word: ἔφη
  choice: 说
  rationale: φημί的不定过去时在此引出直接引语，现代汉语自然译为“说”。
- source_word: Πιστεύω
  choice: 我信
  rationale: 保留πιστεύω在《约翰福音》中“信”的核心用语，并直接回应耶稣此前的启示；“我信”比“我相信”更凝练庄重。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε既可作尊称，也可带有“主”的较高含义。鉴于此处紧接耶稣的自我启示，并伴随相信和敬拜，正文采用“主啊”，同时以脚注保留“先生”的可能。
- source_word: προσεκύνησεν
  choice: 敬拜
  rationale: προσκυνέω可指俯伏、下拜或表达尊崇；在此处，以耶稣为对象且紧随信仰宣认，“敬拜”最能表达语境中的力度，同时脚注保留动作性较强、神学指向较弱的译法。
- source_word: αὐτῷ
  choice: 他
  rationale: 与προσκυνέω连用的与格表示动作所指向的对象，汉语自然译作“敬拜他”。
theological_decisions:
- issue: κύριε应译为一般尊称“先生”，还是较具基督论分量的“主”
  choice: 主
  alternative: 先生
  rationale: 该人的称呼出现在耶稣显明身份之后，并与“我信”和随后的προσκυνέω相连，语境趋向较高的称呼；但希腊词本身仍可作礼貌尊称，因此不在脚注中消除这一歧义。
- issue: προσεκύνησεν应明确译作“敬拜”，还是译作“向他下拜”等较少解释性的动作
  choice: 敬拜
  alternative: 向他下拜／俯伏在他面前
  rationale: 此动作以耶稣为对象，并紧接相信的宣认，“敬拜”符合叙事高潮；然而该动词在词汇层面也能表示俯伏致敬，所以用脚注保存这一真实的语义范围。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语言。“主啊，我信”保留直接宣认的力度；脚注标记紧随各自所说明的词语，避免英文咨询层中标记位置与注释内容不对应的问题。
