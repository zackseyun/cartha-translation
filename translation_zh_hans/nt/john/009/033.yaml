  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: zh_hans
  text: 这人若不是从上帝那里来的[a]，就什么也不能做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除非这人是从上帝那里来的。”
    reason: 词汇及条件结构的另一种译法
lexical_decisions:
- source_word: εἰ μὴ
  choice: 若不是
  rationale: 以自然的现代汉语保留否定条件结构；在本句与未完成时动词及主句的语境中，表达与事实相反的假设。
- source_word: ἦν
  choice: 是……来的
  rationale: 希腊语为未完成时直陈语气；汉语主要借“若……就……”的结构传达非现实条件，无需另行标示时态或虚拟语气。
- source_word: οὗτος
  choice: 这人
  rationale: 上下文所指的是已经在谈论的男性，即耶稣；“这人”简洁自然，又不额外加入身份说明。
- source_word: παρὰ θεοῦ
  choice: 从上帝那里来的
  rationale: παρά加属格表示来源。“从上帝那里来的”保留其宽泛含义，不把它收窄为“上帝差来的”或“蒙上帝授权的”。
- source_word: οὐκ ἠδύνατο
  choice: 不能
  rationale: 直接表达能力上的不可能，并与汉语条件句“若……就……”自然衔接。
- source_word: ποιεῖν
  choice: 做
  rationale: ποιέω含义宽泛；“做”忠实保留这种宽度，不擅自补出“行神迹”等语境性解释。
- source_word: οὐδέν
  choice: 什么也
  rationale: 与“不能”组合成“什么也不能做”，自然表达希腊文否定结构所强调的完全无能。
theological_decisions:
- issue: “从上帝那里来”对耶稣身份与使命的含义
  choice: 保留“从上帝那里来的”这一来源性表述
  alternative: 上帝差来的；蒙上帝授权的
  rationale: 原文主张这人的作为以上帝为来源或根据，但没有在此明确限定为差遣、授权或本体论命题；译文不增加原文未明说的神学精度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若……就……”较凝练，适合经文语体；“从上帝那里来的”清楚传达来源，同时保留原文的神学张力。
