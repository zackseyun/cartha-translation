  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: zh_hans
  text: 耶稣说完这些话，就向地上吐唾沫，用唾沫和成泥，把泥抹在那人的眼睛上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他用泥膏那人的眼睛。”希腊语动词可指“膏”或“涂抹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: 说完这些话
  rationale: 不定过去时分词表示这一动作先于后续动作；“说完这些话”自然地保留了时间先后关系。
- source_word: ἔπτυσεν χαμαί
  choice: 吐唾沫在地上
  rationale: χαμαί意为“在地上、到地上”；此译具体、自然，并准确呈现动作。
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: 用唾沫和成泥
  rationale: πηλός可指泥或黏土；结合唾沫与地上的土形成湿泥这一语境，“和成泥”是简洁自然的现代汉语表达。
- source_word: ἐπέχρισεν
  choice: 抹
  rationale: 该动词可指涂抹或膏抹；这里的直接对象是泥，“抹”清楚表达实际动作，同时不额外引入礼仪含义。
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: 把泥抹在他的眼睛上
  rationale: αὐτοῦ在上下文中指先前的盲人；“他的眼睛”保留代词表达，ἐπί与宾格所表达的施加方向用“在……上”呈现。
theological_decisions:
- issue: ἐπέχρισεν是否带有礼仪性的“膏抹”含义
  choice: 正文译为“抹”
  alternative: “用泥膏他的眼睛”
  rationale: 原词容许“膏”或“涂抹”的译法，但本节明确描述把泥施于眼睛的具体动作，并未明说礼仪或弥赛亚象征。正文采用不带预设的“抹”，脚注保留“膏”的可能性。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“唾沫”比“唾液”更符合叙事语体；“和成泥”简洁呈现以唾沫混合地上尘土制成泥的过程。脚注标记紧随存在词义选择的“眼睛上”之后。
