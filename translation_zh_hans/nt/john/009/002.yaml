  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: zh_hans
  text: 他的门徒问他：“拉比，谁犯了罪，是这个人，还是他的父母，以致他生来就瞎眼呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他生来瞎眼呢？”希腊文ἵνα从句在门徒的问题中可以表达他们所设想的目的或结果关系。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 问
  rationale: 此处是直述门徒向耶稣提出问题；“问”自然准确，不额外增添质询或正式意味。
- source_word: μαθηταὶ
  choice: 门徒
  rationale: “门徒”在福音书语境中准确表达跟随老师、接受教导的人，也符合现代中文圣经叙事的通行用语。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留犹太历史语境中的称谓；“拉比”在现代中文中已较为人熟悉，也能体现门徒对耶稣的教师称呼。
- source_word: ἥμαρτεν
  choice: 犯了罪
  rationale: 准确表达ἁμαρτάνω的过去时动作；中文说“犯了罪”比单说“犯罪”更切合此处问句。
- source_word: οὗτος
  choice: 这个人
  rationale: 指上下文中的盲人；译作“这个人”比“这个”清楚自然，又不加入原文没有的身份说明。
- source_word: γονεῖς
  choice: 父母
  rationale: 这是γονεῖς在此处简洁而标准的中文对应。
- source_word: ἵνα
  choice: 以致
  rationale: 在门徒的问题中连接所设想的罪与生来瞎眼之间的目的或结果关系；“以致”保留这种关联，同时不把它说成叙述者认可的因果定论。
- source_word: τυφλὸς γεννηθῇ
  choice: 生来就瞎眼
  rationale: 自然表达“出生时即为盲人”的意思，并保留γεννηθῇ所指向的出生状态。
theological_decisions:
- issue: 门徒的问题中ἵνα所表达的罪与先天失明之间的关系
  choice: 译作“以致他生来就瞎眼呢”，将这一关系明确保留在门徒的设问中
  alternative: “所以他生来就瞎眼呢”或“使他生下来就是瞎眼的呢”
  rationale: 原文报告的是门徒所假定的关联，并不在本节由叙述者确认这种因果神学。译文既不消除他们问题中的张力，也不强化为神学定论。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“拉比”保留第一世纪犹太背景；“以致”略带书面色彩，但普通读者易懂，并适合经文问句。脚注标记置于整句问话末尾。
