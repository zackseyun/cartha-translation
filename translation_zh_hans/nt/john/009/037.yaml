base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你已经见过他了，现在和你说话的就是他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 自然表达叙事中的说话动作及其对象，不额外加强为“告诉”。
- source_word: Καὶ ἑώρακας αὐτόν
  choice: 你已经见过他了
  rationale: 完成时表示已经发生且与当前认出身份有关的看见；“已经……了”在现代汉语中自然传达这一现时关联。句首 καί 在此可由汉语语势体现，不必机械译作“并且”。
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: 现在和你说话的
  rationale: 保留 μετά σοῦ 的“和你”以及现在分词所表达的正在进行之意；“说话”庄重而自然。
- source_word: ἐκεῖνός ἐστιν
  choice: 就是他
  rationale: 简洁保留指认和强调的语气，不把上文的称号补入本节。
theological_decisions:
- issue: 耶稣回应那人关于先前所指对象的问题时作自我指认
  choice: 译作“现在和你说话的就是他”
  alternative: 译作“他就是现在对你说话的这一位”或补作“就是人子”
  rationale: 原文直接把正在说话者与上文所问的对象等同，却没有在本节重复其称号；译文保留直接启示的力度，同时避免解释性增补。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“已经见过他了”传达希腊语完成时的当前关联；“和你说话”贴近原文 μετὰ σοῦ，并在汉语中保持自然。
