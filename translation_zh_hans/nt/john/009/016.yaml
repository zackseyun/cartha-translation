  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: zh_hans
  text: 于是，法利赛人中有些人说：“这个人不是从上帝来的，因为他不守安息日。”另一些人却说：“一个罪人怎能行这样的神迹[a]呢？”他们中间就起了分裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“记号”；约翰常用这个词指称耶稣所行、既奇妙又指向其身份和意义的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές
  choice: 于是，法利赛人中有些人说
  rationale: “于是”自然保留οὖν承接上文的作用；“法利赛人中有些人”准确表达从该群体中划出的部分人。希腊语未完成时在此可表示当时持续进行的发言，但现代汉语用“说”已能自然呈现场景，不必生硬添加“不断地”。
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: 这个人
  rationale: 既保留指示语气，也符合现代汉语；不额外加入贬义称呼。
- source_word: παρὰ θεοῦ
  choice: 从上帝来的
  rationale: 保留来源或出处的含义，不扩译为原文未明说的“上帝差来的”。
- source_word: τὸ σάββατον οὐ τηρεῖ
  choice: 不守安息日
  rationale: “守安息日”是清楚自然的固定表达，准确传达遵守安息日规条之意。
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: 一个罪人
  rationale: 希腊语直译近于“有罪的人”；汉语“一个罪人”更自然，同时保留对其道德或宗教身份的判断。
- source_word: τοιαῦτα σημεῖα
  choice: 这样的神迹
  rationale: “神迹”在现代中文圣经语境中可表达超常作为及其指示意义；脚注说明约翰用词所含的“记号”意味，避免在正文中使用可能让普通读者误解的“标记”。
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: 他们中间就起了分裂
  rationale: 自然表达群体内部出现意见分裂，并保留σχίσμα所指的裂分状态。
theological_decisions:
- issue: 耶稣是否“从上帝来”
  choice: 从上帝来的
  alternative: 上帝差来的
  rationale: 原文παρὰ θεοῦ强调来源，也可能涉及神圣授权；不加入“差”字，以免把含义限定为更明确的差遣表述。
- issue: 约翰福音中σημεῖα的译法
  choice: 神迹
  alternative: 记号／神奇的记号
  rationale: “神迹”对普通现代读者清楚自然，也不把事件仅仅说成抽象标志；同时用脚注保留该词在约翰福音中指向启示意义的张力。
- issue: ἁμαρτωλός对耶稣的指称
  choice: 罪人
  alternative: 有罪的人
  rationale: 这是说话者提出的判断，并非叙述者确认；问句和引号保留了其争议性质。“罪人”比“有罪的人”更符合自然汉语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“却”突出两方意见的对立；不将未完成时机械译成“不断说”。正文保留法利赛人内部的争论，不替叙述者判定任何一方的论证。
