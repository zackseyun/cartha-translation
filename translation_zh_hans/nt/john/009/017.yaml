  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: zh_hans
  text: 于是，他们又问那瞎眼的人：“既然他开了你的眼睛，你自己[a]认为他是怎样的人？”他回答：“他是一位先知。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文特别写出“你”，有强调语气；也可译作：“你自己怎么看他？”
    reason: lexical_alternative
  - marker: b
    text: “一位先知”也可能带有较强的称号意味，译作：“他是先知。”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文的查问，并保留叙事推进和一定的推论意味；现代汉语中自然顺畅。
- source_word: τῷ τυφλῷ
  choice: 那瞎眼的人
  rationale: 原文以形容词作名词使用，按当时问话者对他的称呼直译；不改写为“从前瞎眼的人”，以免加入本分句未明说的视角。
- source_word: πάλιν
  choice: 又
  rationale: 表明这是查问过程中的再次发问。
- source_word: Τί σὺ λέγεις περὶ αὐτοῦ
  choice: 你自己说他是谁
  rationale: 明确表达独立主语σὺ的强调作用；“说他是谁”是现代汉语询问对某人身份或性质判断的自然说法，同时不把问题扩展成更宽泛的“意见”。
- source_word: ὅτι
  choice: 既然
  rationale: 在此引出发问所依据的事实，即他开了这人的眼睛；“既然”比单纯的“因为”更符合汉语问句结构。
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: 他开了你的眼睛
  rationale: 保留原文的身体性表达及简单过去事件意义，也与本章语境一致。
- source_word: Προφήτης ἐστίν
  choice: 他是一位先知
  rationale: 无冠词的谓语名词在此自然表达类别或性质判断；“一位先知”既尊重人物身份，也避免预先把“先知”定为专称。
theological_decisions:
- issue: Προφήτης应理解为普通类别称谓还是专门称号
  choice: 一位先知
  alternative: 那位先知／先知（作为专称）
  rationale: 上下文呈现这人对耶稣认识逐步发展的过程；此处译作“一位先知”保留其当下判断，不额外加入明确的弥赛亚性专称。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“瞎眼的人”贴近原文在本句中的称呼；“你自己”显出σὺ的强调。主句不另设ὅτι的因果脚注，因为“既然”已清楚保留该语义；仅对真实存在的强调表达与“先知”的称号可能性作注。
