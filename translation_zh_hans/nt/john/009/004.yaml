id: JHN.9.4
reference: John 9:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: zh_hans
  text: 我们[a]必须趁着天还亮，做那差遣我来的那一位的工作；黑夜将到，那时没有人能工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“我必须趁着天还亮，做那差遣我来的那一位的工作。”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: 我们
  rationale: 按SBLGNT所采用的第一人称复数宾格，与δεῖ连用表示“我们必须”。这也保留了耶稣把门徒包括在使命中的复数表达；异文“我”另见脚注。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达必要性和责任，符合现代汉语习惯，也保留原文的强度。
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: 做……的工作
  rationale: 原文动词与名词同源，若逐字译成“作……的作为”会显得生硬。“做……的工作”自然清楚，并保留约翰福音中奉差者完成所托之事的含义。
- source_word: τοῦ πέμψαντός με
  choice: 差我来的那位
  rationale: 以名词性短语表达带冠词的分词，保留其人称指向，却不在正文中把所指对象明说为“父”或“上帝”。
- source_word: ἕως ἡμέρα ἐστίν
  choice: 趁着还是白昼
  rationale: 结合后文将到的黑夜，这一表达自然地传达可供行动的时段仍然存在；“趁着”也体现时间有限的紧迫感。
- source_word: ἔρχεται νὺξ
  choice: 黑夜将到
  rationale: 用“将到”表达现在时在此所具有的临近、将来意味，并保持白昼与黑夜的鲜明对照。
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: 那时没有人能工作
  rationale: 直截而自然地表达时间关系、普遍否定和能力上的不可能；第二处ἐργάζεσθαι没有宾语，因此译作一般性的“工作”。
theological_decisions:
- issue: 经文开头ἡμᾶς（“我们”）与ἐμέ（“我”）的文本异文
  choice: 我们必须……
  alternative: 我必须……
  rationale: 正文忠实采用指定的SBLGNT文本ἡμᾶς，不把复数悄然改成更常见的单数读法。由于“我”的读法见于部分抄本并广为人知，脚注予以说明，以保留文本证据及其可能带来的诠释张力。
- issue: “差我来的那位”的身份
  choice: 不在正文中补明身份
  alternative: 差我来的父／上帝
  rationale: 上下文可使读者理解其所指，但本节希腊文只用名词化分词短语。译文不添加原文没有明说的称谓，以免在翻译中提前解释。
- issue: 白昼和黑夜的比喻所指
  choice: 保留白昼与黑夜的意象，不加解释
  alternative: 直接释为事奉时机与死亡或受难
  rationale: 原文的意象具有神学张力，可能关联使命时限、耶稣受难及行动机会的终止。正文不把这一多层意象缩减为单一解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“趁着还是白昼”兼顾口语可懂度与经文节奏；分号保留原文两幅对照意象之间的紧密关系。脚注标记紧接“我们”，明确指出异文所在。
