  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: zh_hans
  text: 他们辱骂他，说：“你是那个人[a]的门徒，我们却是摩西的门徒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那个人”也可译作“他的”。希腊文直译为“那一位的”，在这里可能带有疏远或轻蔑的语气。
    reason: 说明指示代词ἐκείνου的译法及其可能的语用色彩，同时保留较中性的理解。
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: 辱骂
  rationale: 该动词指以恶言侮辱、斥骂。“辱骂”既保留言语攻击的强烈程度，也符合现代汉语叙事表达。
- source_word: αὐτὸν
  choice: 他
  rationale: 作直接宾语，指前文那位得医治的人。
- source_word: καὶ εἶπον
  choice: 说
  rationale: 希腊文以“并且说”承接前句；现代汉语在“辱骂他”之后直接用“说”，衔接自然，语义不减。
- source_word: Σὺ
  choice: 你
  rationale: 希腊文显式并前置第二人称代词，带有强调作用；汉语将“你”置于引语句首，并借后半句的“我们却”显出对比。
- source_word: μαθητὴς / μαθηταί
  choice: 门徒
  rationale: 在约翰福音中，该词不只表示学生，也包含跟随与归属的意味；两处统一译作“门徒”，保留原句的鲜明对照。
- source_word: ἐκείνου
  choice: 那个人
  rationale: 指示代词具有拉开距离的作用，在当前敌对语境中可能含轻蔑意味。“那个人”较“他的”更能保留这种疏离语气，同时不把轻蔑程度表达得过重。
- source_word: ἡμεῖς δὲ
  choice: 我们却
  rationale: 显式代词ἡμεῖς与δέ共同构成强调性的对比；“我们却”在现代汉语中自然保留这一反差。
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: 是摩西的门徒
  rationale: 属格表示门徒与摩西之间的归属或师承关系；该译法清楚、自然，并与前半句保持平行。
theological_decisions:
- issue: ἐκείνου指耶稣时的语气
  choice: 译作“那个人”，保留说话者敌对而疏离的指称方式。
  alternative: 可较中性地译作“他的”或“那一位的”。
  rationale: 原文指示代词本身可以较中性，但“他们辱骂他”的语境支持其中带有疏远甚至轻蔑意味。正文不过度强化，脚注说明其可能语气。
- issue: μαθητής的统一译法
  choice: 两处都译作“门徒”。
  alternative: 译作“跟随者”或“学生”。
  rationale: “门徒”兼具学习、跟随和归属的含义，且统一措辞能完整呈现耶稣与摩西之间的修辞对照，而不替文本判定双方宣称的神学正当性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“辱骂”准确传达强烈的言语攻击；引语用平行结构“你是……门徒，我们却是……门徒”，清楚呈现原文的强调与对比。
