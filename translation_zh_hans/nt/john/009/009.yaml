  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: zh_hans
  text: 有人说：“就是他。”另有人说：“不，他只是和他相像。”那人一再说：“我就是那个人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译作“我是”。这里是通常的自我指认：这人说明自己正是众人所议论的那个人。
    reason: 保留Ἐγώ εἰμι的较直译形式，并说明此处语境所要求的普通自我指认，避免脱离上下文赋予不必要的神学含义。
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: 有人……另有人
  rationale: 这两个词把在场者分为持不同看法的两群；“有人……另有人”在现代汉语中自然地表达这种对照。
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时描绘众人正在议论的场景；汉语通常无需用额外的进行标记，前后相对的发言已能体现持续讨论。
- source_word: Οὗτός ἐστιν
  choice: 就是他
  rationale: 保留原文简短、直接的指认语气，又符合现代汉语对话习惯。
- source_word: Οὐχί, ἀλλὰ
  choice: 不是，只是
  rationale: “不是”表达明确否定；此处 ἀλλά 转而说明另一种判断，用“只是”比生硬的“但是”更符合汉语口语逻辑。
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: 只是跟他很像
  rationale: 表达相似而非同一，不把相似范围擅自限定为容貌。
- source_word: ἐκεῖνος
  choice: 那人
  rationale: 清楚指向正在被议论、随后亲自作答的那个人；比单用“他”更能避免指代含混。
- source_word: ἔλεγεν
  choice: 一再说
  rationale: 未完成时在这里很可能表现他面对争论反复坚持自己的身份；“一再说”自然传达这种反复性。
- source_word: Ἐγώ εἰμι
  choice: 我就是那个人
  rationale: 在本段语境中是普通的自我指认。补出汉语所需的隐含表语“那个人”，使意思清楚，同时以脚注保留较直译的形式。
theological_decisions:
- issue: 约翰福音语境中 Ἐγώ εἰμι 的译法
  choice: 我就是那个人
  alternative: 我是
  rationale: 这里说话的是先前失明而得医治的人，他是在回应众人对其身份的争论。上下文要求普通的自我指认，并不支持在正文中赋予该短语基督论含义；脚注同时保留原文较直译的表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。众人的两种说法保持简短鲜明；末句用“一再说”体现未完成时可能具有的反复坚持意味。
