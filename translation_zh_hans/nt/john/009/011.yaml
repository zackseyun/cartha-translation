base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: zh_hans
  text: 他回答：“那个叫耶稣的人和了泥[a]，抹在我的眼睛上[b]，对我说：‘到西罗亚去洗一洗。’于是我去了，洗过以后，就看见了[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泥”也可译作“黏土”。原文πηλός可指泥或黏土。
    reason: lexical_alternative
  - marker: b
    text: “抹在我的眼睛上”也可译作“膏抹我的眼睛”；原文动词指涂抹或抹上。
    reason: lexical_alternative
  - marker: c
    text: “就看见了”也可译作“便得了视力”。这里的原文动词在医治语境中指获得或恢复视力。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: 他回答
  rationale: 这是自然的叙事表达；ἐκεῖνος所指的人物在上下文中明确，无须生硬地译成“那人回答”。
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: 那个叫耶稣的人
  rationale: 既自然地表达名称识别，也保留说话者此时只称耶稣为“人”的有限认识，不提前加入更高的基督论称号。
- source_word: πηλὸν ἐποίησεν
  choice: 和了泥
  rationale: 结合上文用唾沫的动作，“和了泥”准确而自然；πηλός也可指黏土，故以脚注保留词义范围。
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: 抹在我的眼睛上
  rationale: 清楚表达把泥涂抹上去的具体动作；避免“膏抹”在现代汉语中可能带来的仪式性联想。
- source_word: εἶπέν μοι ὅτι
  choice: 对我说
  rationale: 自然引出后面的直接引语，并贴近希腊文的说话结构。
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: 到西罗亚去洗一洗
  rationale: 保留地点名称和两个命令动作；本节原文只说“西罗亚”，未重复“池子”，上下文已说明该地点。
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: 于是我就去洗了
  rationale: “于是”体现οὖν所表达的结果或承接关系；简洁呈现前去并洗的连续动作。
- source_word: ἀνέβλεψα
  choice: 便能看见了
  rationale: 在医治失明的语境中，该动词表示获得或恢复视力；“能看见了”也适合这位生来失明者，避免暗示他以前曾有视力。
theological_decisions:
- issue: 说话者如何称呼耶稣
  choice: 那个叫耶稣的人
  alternative: 那位名叫耶稣的人／耶稣
  rationale: 保留叙事中这名得医治者当时的认识阶段：他称耶稣为“人”，尚未作出后文更进一步的认信。译文不把后来的神学认识提前带入此处。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“和了泥”“洗一洗”“能看见了”便于普通读者理解；同时通过脚注保留πηλός、ἐπιχρίω和ἀναβλέπω的词义幅度。
