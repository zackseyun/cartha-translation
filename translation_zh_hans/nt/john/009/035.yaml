  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: zh_hans
  text: 耶稣听说他们把他赶了出去；找到他后，就问：“你信人子[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“上帝的儿子”，而不是“人子”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: 把他赶了出去
  rationale: ἐκβάλλω与ἔξω连用，加强驱逐之意；“赶了出去”在现代汉语中自然有力，也保留了上下文中被群体排斥的含义。
- source_word: εὑρὼν αὐτὸν
  choice: 后来耶稣找到他
  rationale: 不定过去时分词在这里具有时间和顺序意味；加入“后来”清楚自然地表达耶稣听闻后找到他的行动次序。
- source_word: Σὺ πιστεύεις εἰς
  choice: 你信……吗
  rationale: πιστεύω εἰς在这里指向对某一位的信靠；汉语“信”配合宾语简洁自然，疑问句中的“你”也承载了原文显明主语Σὺ的强调。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是该称号在中文圣经传统中准确、通行的译法，并保留其与《但以理书》及《约翰福音》其他经文的互文联系。
theological_decisions:
- issue: 问句中基督论称号的异文
  choice: 人子
  alternative: 上帝的儿子
  rationale: SBLGNT正文采用ἀνθρώπου（“人”），故正文译作“人子”；部分抄本作θεοῦ（“上帝”），这一重要且影响深远的异文在脚注中保留，不在正文中加以调和。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“赶了出去”传达原文的强调语气；“你信人子吗”简洁直接，保留原文问句及称号的神学张力。
