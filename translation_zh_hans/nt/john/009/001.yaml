  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: zh_hans
  text: 耶稣经过的时候，看见一个生来就失明的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 不单独译出
  rationale: καί承接上文；现代汉语在此无需用“并且”或“然后”也能自然保持叙事连贯，硬译反而显得生硬。
- source_word: παράγων
  choice: 往前走的时候
  rationale: 现在时主动分词表示与“看见”同时发生、作为背景的持续动作；“往前走的时候”自然保留这一时间关系，也不把动作过度限定为从某人身旁经过。
- source_word: εἶδεν
  choice: 看见
  rationale: 直译ὁράω的简单过去叙事用法，不添加“注意到”等原文未明说的主观意味。
- source_word: ἄνθρωπον
  choice: 一个……的人
  rationale: ἄνθρωπος在此指一个具体的人；汉语用“人”最自然，也不必仅凭语法形式在本句中额外强化为“男人”。
- source_word: τυφλὸν
  choice: 失明
  rationale: 准确表达视觉缺失，且比“瞎眼”更符合现代、庄重并尊重当事人的汉语表达。
- source_word: ἐκ γενετῆς
  choice: 生来就
  rationale: 表达从出生起便处于失明状态；“就”自然突出这种状态自出生已经存在。
theological_decisions:
- issue: ἄνθρωπον的性别表达
  choice: 一个……的人
  alternative: 一个生来就失明的男人
  rationale: ἄνθρωπος本身可指“人”；虽然后文以男性形式指称此人，但现代汉语在本句用“人”既准确自然，也没有否认其性别，避免加入本词本身不必承载的强调。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语体。“耶稣”作为分词与主句动词的共同主语，依据紧接的上文明确补出，避免汉语孤立成句时“他”指代不清。
