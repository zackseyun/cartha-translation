  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: zh_hans
  text: 他的父母说这些话，是因为他们害怕犹太人[a]；原来犹太人早已商定，若有人承认他是弥赛亚[b]，那人就要被赶出会堂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“犹太人”。在本处语境中，很可能特指有权把人赶出会堂的犹太当权者，而不是泛指所有犹太人。
    reason: 文化与语境说明
  - marker: b
    text: 也可译作“承认他是基督”或“承认他为基督”。“弥赛亚”和“基督”都表示“受膏者”。
    reason: 另一译法与称号说明
lexical_decisions:
- source_word: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ
  choice: 他父母说这些话
  rationale: 保留ταῦτα的复数指向，并以现代汉语自然表达γονεῖς αὐτοῦ。
- source_word: ἐφοβοῦντο
  choice: 怕
  rationale: 未完成时表示当时持续存在的惧怕；简洁的“怕”符合叙事语体。
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 正文保留希腊文较宽泛且有语境弹性的称呼，不直接把所指限定为领袖；脚注说明本处很可能特指掌握会堂处分权的犹太权势人士。
- source_word: ἤδη γὰρ συνετέθειντο
  choice: 原来犹太人早已商定
  rationale: “原来”表达γὰρ的解释作用，“早已商定”体现ἤδη及过去完成意义，并避免将其过度译成“密谋”。
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: 若有人承认他是弥赛亚
  rationale: ὁμολογέω在此指公开承认或宣认；“承认他是”是自然汉语，并保留χριστός作为称号的功能。
- source_word: ἀποσυνάγωγος γένηται
  choice: 就把那人赶出会堂
  rationale: 表达被排除于会堂群体之外的处分含义；补出“那人”使汉语指代清楚。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督／承认他为基督
  rationale: 此处χριστός明显作为称号，涉及对耶稣弥赛亚身份的公开承认；“弥赛亚”保留其犹太语境。
- issue: οἱ Ἰουδαῖοι在本节的所指
  choice: 正文译“犹太人”，以脚注交代语境
  alternative: 犹太领袖／犹太当权者／犹太地人
  rationale: 希腊词本身可随语境指犹太人、犹太地人或犹太权势群体。本节因涉及赶出会堂，很可能指有关当权者，但正文不消除原文的指称张力。
- issue: ἀποσυνάγωγος的处分性质
  choice: 赶出会堂
  alternative: 逐出会堂／开除会籍
  rationale: “赶出会堂”既传达排斥处分，又不把具体制度和期限解释得超过原文证据。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“说这些话”承接上文；分号和“原来”清楚呈现后半句对父母惧怕原因的进一步解释。正文保留“犹太人”的原文措辞，以脚注防止脱离语境的泛化理解。
