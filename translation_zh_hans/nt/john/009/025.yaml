  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: zh_hans
  text: 于是，那人回答说：“他是不是罪人，我不知道。有一件事我知道：我从前是瞎眼的，现在看见了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: 于是，那人回答说
  rationale: “于是”自然承接上文的盘问；“那人”保留ἐκεῖνος的指示意味，明确指向先前瞎眼的人；“回答说”符合现代汉语叙事习惯。
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: 他是不是罪人
  rationale: 在οὐκ οἶδα所引出的间接疑问中，εἰ表达“是否”；“是不是”既自然又保留说话人不作判断的态度。
- source_word: οὐκ οἶδα
  choice: 我不知道
  rationale: 直接表达οἶδα在此处的现在意义，并保持庄重、清楚的口吻。
- source_word: ἓν οἶδα
  choice: 只有一件事我知道
  rationale: 用“只有一件事”突出与前一句“不知道”的强烈对比，同时不增添原文没有的内容。
- source_word: τυφλὸς ὢν
  choice: 我本来是瞎眼的
  rationale: 该分词短语指向先前持续存在的状态；“本来”自然呈现从过去失明到如今看见的转变。
- source_word: ἄρτι βλέπω
  choice: 如今却能看见了
  rationale: “如今”与“本来”形成时间对照；“却”体现反差；汉语用“能看见了”自然表达视力已经恢复的现状。
theological_decisions:
- issue: 是否让这人的回答暗含他对耶稣有罪与否作出了判断
  choice: 他是不是罪人，我不知道
  alternative: 如果他是罪人，我不知道
  rationale: 此处是这人陈述自己所不知道的事，并非叙述者对耶稣作神学判断。“是不是”保留他的认知限度及原文的间接疑问，不把εἰ误读为现实条件句。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“瞎眼的”比单用“盲人”更能与“如今能看见”形成状态上的鲜明对照，也符合上下文对这人先前状况的描述。
