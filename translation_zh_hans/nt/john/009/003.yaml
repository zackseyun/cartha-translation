id: JHN.9.3
reference: John 9:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: zh_hans
  text: 耶稣回答说：“不是这个人犯了罪，也不是他的父母犯了罪，而是要使上帝的作为在他身上显明出来。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他身上”也可能理解为“借着他”；希腊文直译为“在他里面（或身上）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: 耶稣回答说
  rationale: 符合现代汉语叙事对话习惯，准确表达ἀποκρίνομαι的回应功能。
- source_word: Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ
  choice: 不是这个人犯了罪，也不是他的父母犯了罪
  rationale: 用“不是……也不是……”自然保留οὔτε…οὔτε的并列否定；后半句补出“犯了罪”，避免汉语误解为否定其父母本身。
- source_word: ἀλλ’ ἵνα
  choice: 而是要使
  rationale: 原文由ἀλλά转折并以ἵνα引出目的；汉语可自然接续而不增添“这事发生”等原文没有明说的成分。
- source_word: φανερωθῇ
  choice: 显明出来
  rationale: 保留“使原本未显露的事成为可见”的含义，并以“使……显明出来”体现被动语义。
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: 上帝的作为
  rationale: “作为”比“工作”更适合此处神所行之事，也保留约翰著作中的神学用语。
- source_word: ἐν αὐτῷ
  choice: 在他身上
  rationale: 直接对应ἐν αὐτῷ，在现代汉语中自然，并保留其可指发生领域或彰显媒介的含混性。
theological_decisions:
- issue: 耶稣的否定是否是在宣告一切苦难都与罪无关
  choice: 只按本节所指，否定这个人或其父母犯罪是其失明的具体解释
  alternative: 概括为一切苦难都绝不与个人或父母的罪有关
  rationale: 原文回应门徒针对这个人的问题，并未在此明说普遍适用于所有苦难的原则。
- issue: ἵνα表达目的还是结果
  choice: 用“要使”保留目的取向
  alternative: 译作“结果就使”或重新断句，以避免目的含义
  rationale: ἵνα加虚拟式最直接地表达目的；译文不额外解释上帝如何与失明发生因果关系，以保留原文的神学张力。
- issue: ἐν αὐτῷ表示“在他身上”还是“借着他”
  choice: 正文译作“在他身上”
  alternative: 借着他
  rationale: “在他身上”最直接对应希腊文，同时不排除上帝的作为借此人得到彰显的语境含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“这个人”明确οὗτος的所指；“显明出来”通俗清楚，又保留约翰福音中启示、彰显的语感。脚注标记置于相关句末。
