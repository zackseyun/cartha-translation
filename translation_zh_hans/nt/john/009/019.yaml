  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: zh_hans
  text: 他们问他的父母：“这是你们的儿子吗？你们说他生来就是瞎眼的，那么他现在怎么能看见了呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: 他们问他的父母
  rationale: 主句表示询问；αὐτούς依上文指那人的父母。汉语直接引出问话，无须机械译出λέγοντες“说”。
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: 这是你们的儿子吗
  rationale: 原文形式近似陈述句，但在连续盘问的语境中具有疑问功能；用“吗”符合现代汉语。
- source_word: ὃν ὑμεῖς λέγετε
  choice: 你们说
  rationale: 保留λέγετε的中性语气，不译为带有怀疑色彩的“声称”；明确译出ὑμεῖς所带的强调。
- source_word: τυφλὸς ἐγεννήθη
  choice: 生来就是瞎眼的
  rationale: 自然表达先天失明，并保留出生时即处于此状态的含义。
- source_word: πῶς οὖν
  choice: 那么……怎么
  rationale: “那么”体现οὖν根据前述说法作出的推论，“怎么”引出方式疑问。
- source_word: βλέπει ἄρτι
  choice: 现在怎么能看见了
  rationale: “现在”表达ἄρτι与先前失明的对比；“看见了”自然呈现其当前已经能看见的状态。此处“能”用于汉语惯常表达，不意在把实际看见改成单纯能力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事用语。“瞎眼”在本段语境中清楚直接；整体保留盘问的语气和从先天失明到如今看见之间的张力。
