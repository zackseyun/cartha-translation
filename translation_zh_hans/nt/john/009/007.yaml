  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: zh_hans
  text: 耶稣对他说：“你去西罗亚池洗（‘西罗亚’翻译出来就是‘受差遣的’[a]）。”于是他去了，洗了，回来时能看见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“‘西罗亚’意思是‘受差遣的’。”
    reason: 说明ἑρμηνεύεται可按较形式化的“翻译出来”表达，也可自然译为“意思是”。
lexical_decisions:
- source_word: Ὕπαγε
  choice: 你去
  rationale: 直接表达移动命令，符合现代汉语叙事，也不增加原文没有的语气。
- source_word: νίψαι / ἐνίψατο
  choice: 洗一洗 / 洗了
  rationale: νίπτω通常指清洗身体或身体的一部分，而非全身沐浴；“洗一洗”自然地表达命令，“洗了”与后文叙事相应。
- source_word: εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ
  choice: 去西罗亚池洗一洗
  rationale: 介词εἰς与移动命令连用；汉语将目的地置于“洗”之前最自然。“池”准确表达κολυμβήθρα所指的水池或蓄水池。
- source_word: Σιλωάμ
  choice: 西罗亚
  rationale: 采用现代中文圣经传统中通行且易识别的地名音译。
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: “西罗亚”翻译出来就是“奉差遣”
  rationale: 保留原文明确的释名说明；“奉差遣”表达Ἀπεσταλμένος的被动含义，又保持简洁庄重，不把约翰可能暗示的象征意义进一步解释出来。
- source_word: οὖν
  choice: 于是
  rationale: 自然表达命令之后随即发生的叙事结果，比“所以”更适合连续动作的叙述。
- source_word: ἀπῆλθεν
  choice: 他去了
  rationale: 简洁表达离去并照命令而行，不增加距离或方式等原文未说明的信息。
- source_word: ἦλθεν βλέπων
  choice: 回来时已经能看见了
  rationale: 用结果状态表达伴随分词βλέπων，清楚呈现医治结果；结合此前“去”的动作，将ἦλθεν自然译作“回来”，同时不详定他回到何处。
theological_decisions:
- issue: 如何呈现“西罗亚”的释名而不过度阐释约翰的象征意义
  choice: 在正文括号内保留“翻译出来就是‘奉差遣’”
  alternative: 将其扩展为与耶稣受父差遣有关的明确神学解释
  rationale: 释名本身属于希腊正文，必须保留；但原句没有明说其神学对应关系，译文不应替作者消解或展开这一含蓄意味。
- issue: ἦλθεν βλέπων所表达的医治结果
  choice: 译作“回来时已经能看见了”
  alternative: 直译为“他看着回来了”或解释为“他恢复了视力”
  rationale: 所选译法自然呈现原先失明之人如今能看见的结果，又避免加入“恢复”所暗含的先前曾有视力这一未经本节说明的信息。
translation_notes:
  register: 采用庄重而通俗的现代标准普通话。“洗一洗”符合口语习惯而不过分随意；括号保留作者的释名插语。“奉差遣”比“被派去”更凝练庄重，同时仍为现代读者所能理解。
