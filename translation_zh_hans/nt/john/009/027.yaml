source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: zh_hans
  text: 他回答他们：“我已经告诉你们了，你们却不听。为什么还想再听一遍？难道你们也想成为他的门徒吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是叙事中常见的回应动词；译作“回答”准确、自然，也保持原文的正式对应。
- source_word: ἤδη
  choice: 已经
  rationale: 表示此前已经发生，并带有强调意味；“已经”是现代汉语最直接自然的表达。
- source_word: οὐκ ἠκούσατε
  choice: 你们却不听
  rationale: ἀκούω可指“听见”或“听从、理会”；上下文重点不是没有听到声音，而是不肯听取所说的话。“不听”保留了这种责备意味，“却”使转折在汉语中更清楚。
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: 为什么还想再听一遍？
  rationale: τί在此结合语境宜按原因问句理解，表现说话人的不耐与反问语气；“还”和“再听一遍”自然表达πάλιν及省略的已述内容。
- source_word: μὴ καὶ ὑμεῖς
  choice: 难道你们也……吗？
  rationale: μή引导预期否定回答的问句；汉语“难道……吗”能自然传达这种反问和讥讽语气，“也”对应καί。
- source_word: αὐτοῦ μαθηταὶ
  choice: 他的门徒
  rationale: 符合现代汉语领属结构；“门徒”保留约翰福音中μαθητής的宗教与师徒关系含义。
- source_word: γενέσθαι
  choice: 成为
  rationale: γίνομαι强调进入某种身份或状态，因此“成为”比单纯的“是”更准确。
theological_decisions:
- issue: 末句反问的语气
  choice: 译作“难道你们也想成为他的门徒吗？”，表达带讥讽意味且预期否定回答的反问。
  alternative: “你们不会也想成为他的门徒吧？”
  rationale: μή通常表明提问者预期否定回答。主译文保留这一语法力量及被医治者回应中的讥讽感，但不把其话语提升为额外的神学判断。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“你们却不听”简洁呈现责备语气；末句用“难道……吗”保留原文反问力量。全节无需脚注，因为“听见/听从”的词义张力可由“不听”自然涵盖，而μή的语用功能已在正文中清楚表达。
