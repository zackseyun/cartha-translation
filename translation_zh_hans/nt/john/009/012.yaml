  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: zh_hans
  text: 他们对他说[a]：“那个人在哪里？”他说：“我不知道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本省略“他们对他说”。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上文并推进叙事；现代汉语用“就”比直译为“和”自然，也不额外强化因果关系。
- source_word: εἶπαν αὐτῷ
  choice: 他们对他说
  rationale: 保留 λέγω 的一般言说义和 αὐτῷ 的间接宾语结构；虽然后接问句，但不必将动词解释性地译成“问”。
- source_word: Ποῦ
  choice: 在哪里
  rationale: 直接表达地点疑问，符合现代汉语问句语序。
- source_word: ἐκεῖνος
  choice: 那个人
  rationale: 该指示代词在此独立使用，指向先前提到的耶稣；“那个人”既保留指示意味，也比“那一位”或“那一个”更自然。
- source_word: λέγει
  choice: 他说
  rationale: 约翰叙事中的历史现在时在汉语中自然译作过去叙事常用的无时态标记形式“说”；不机械加入“现在”，以免产生时间误解。
- source_word: Οὐκ οἶδα
  choice: 我不知道
  rationale: 简明、自然地保留否定和第一人称认知表达。
