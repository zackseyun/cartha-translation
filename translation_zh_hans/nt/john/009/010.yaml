  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: zh_hans
  text: 于是，他们问他：“你的眼睛是怎么开的[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你的眼睛是怎么被打开的？”希腊文采用被动形式。
    reason: 保留原文被动语态，同时使正文符合自然汉语。
lexical_decisions:
- source_word: ἔλεγον
  choice: 问
  rationale: 这是未完成过去时，语境中的直接引语是问句；现代汉语用“问”比直译“说”自然。未完成时可表示持续或反复，但本节无需强行译成“不断问”，以免过度明确。
- source_word: οὖν
  choice: 于是
  rationale: 既承接上文，也表示由前述情形引出的反应；“于是”符合现代汉语叙事习惯。
- source_word: αὐτῷ
  choice: 他
  rationale: 在“问他”中自然表达与格所标明的言语对象。
- source_word: Πῶς
  choice: 怎么
  rationale: 直接、自然地表达对方式或经过的询问。
- source_word: ἠνεῴχθησάν
  choice: 开了
  rationale: 希腊文是简单过去时被动语态。正文采用汉语自然的状态变化表达“开了”，不指定施事者，并用注脚交代原文明确的被动形式。
- source_word: σου οἱ ὀφθαλμοί
  choice: 你的眼睛
  rationale: 按现代汉语领属结构自然表达“你的眼睛”，无需另译希腊文冠词。
theological_decisions:
- issue: “眼睛被打开”的被动形式是否暗示特定施事者
  choice: 正文不点明是谁使他的眼睛打开，并在注脚说明希腊文为被动语态
  alternative: 明确译作“谁打开了你的眼睛”或“神怎样使你看见”
  rationale: 原文询问方式，没有明说施事者；保留这种含混可避免把神学解释写入正文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“你的眼睛是怎么开了的”在汉语中可理解为从失明到看见的变化，也不擅自说明施事者。
