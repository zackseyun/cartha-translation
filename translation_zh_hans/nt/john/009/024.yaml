  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: zh_hans
  text: 于是，他们第二次叫来那曾经失明的人，对他说[a]：“要把荣耀归给上帝！我们知道这个人是个罪人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可能是一种郑重要求对方如实作证的惯用语，意思是：“要在上帝面前说实话”，或“要在上帝面前坦白承认。”
    reason: 说明“要把荣耀归给上帝”在此处可能具有要求如实作证或坦白承认的习语作用。
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: 叫来
  rationale: 这里指他们把得医治的人再次叫到面前；“叫来”自然准确，也不额外加入正式传唤的强制意味。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事，符合现代汉语叙事习惯。
- source_word: ἐκ δευτέρου
  choice: 第二次
  rationale: 直接表达“再一次、第二次”的含义，并保留次数信息。
- source_word: ὃς ἦν τυφλός
  choice: 那曾经失明的人
  rationale: 结合他已经得医治的语境，用“曾经失明”表明这是过去的状况，避免暗示他仍然失明。
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: 要把荣耀归给上帝
  rationale: 保留希腊文表层的荣耀用语；该短语在语境中可能是要求人在上帝面前说实话或公开承认，相关含义放入脚注。
- source_word: ἡμεῖς οἴδαμεν
  choice: 我们知道
  rationale: 保留强调主语所表达的断然口吻。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: 这个人
  rationale: 准确传达指示词与名词，不额外加入贬义色彩。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 直接保留对该人的定性指控，不弱化为抽象的“有罪”或“有罪性”。
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ 的习语作用
  choice: 正文保留“要把荣耀归给上帝”
  alternative: 译作“要在上帝面前说实话”或“要在上帝面前坦白承认”
  rationale: 这句话很可能是要求对方如实作证或坦白承认的郑重措辞，但其字面形式确实提到把荣耀归给上帝。正文保留原有神学措辞，脚注说明可能的语用含义，以免过度消解文本张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“上帝”用于 θεός；“曾经失明”准确体现此人如今已经复明。正文保留原文表达的开放性，脚注解释其可能的习语含义。
