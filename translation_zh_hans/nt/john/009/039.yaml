  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: zh_hans
  text: 耶稣说：“我为审判来到这世界，为要使那些看不见的可以看见，使那些看得见的反而成为瞎眼的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为审判”也可理解为“为了一场审判”。希腊语 εἰς κρίμα 可着重表示耶稣来到这世界所产生的审判性结果，而不只是定罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: 审判
  rationale: 保留该词在此处所表达的司法性判别及其结果；它既涵盖使人得见，也涵盖使人失明，因此不宜缩窄为“定罪”。
- source_word: κόσμον
  choice: 世界
  rationale: “世界”是约翰著作中 κόσμος 的自然对应，也保留其对人类世界及其与上帝疏离状态的语境含义。
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: 那些看不见的／那些看得见的
  rationale: 按名词化分词处理，保留两句的平行结构，也保留肉眼视力与属灵洞察之间的双重含义。
- source_word: βλέπωσιν
  choice: 可以看见
  rationale: 自然表达 ἵνα 后虚拟语气所指向的目的或结果，同时不把含义限定为肉眼复明。
- source_word: τυφλοὶ γένωνται
  choice: 反而成了瞎眼的人
  rationale: “成了”保留 γίνομαι 的变化、结果意味；“反而”自然凸显上下两句的逆转，但不额外解释其机制。
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: 来到这世界
  rationale: 符合现代汉语表达，并保留约翰福音中耶稣进入世界的差遣与降临语言。
theological_decisions:
- issue: 本节与约翰福音3:17“不是要审判世界”的张力
  choice: 直译为“我为审判来到这世界”
  alternative: 将 κρίμα 弱化为“分辨”或解释性地译作“带来分化”
  rationale: 原文明确使用 κρίμα；译文保留耶稣到来所产生的审判性区分，不在翻译中消解与约翰福音其他陈述之间的神学张力。
- issue: “看见”与“瞎眼”的所指
  choice: 保留可兼指肉眼与属灵状态的表达
  alternative: 明确译成“认识真理”与“属灵瞎眼”
  rationale: 上下文包含生来瞎眼者实际复明，也包含属灵洞察的反讽；显式属灵化会消除原文刻意保留的双关。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看不见／看得见”维持鲜明平行；用“反而”呈现原句强烈的逆转关系。脚注标记置于整句引语之后。
