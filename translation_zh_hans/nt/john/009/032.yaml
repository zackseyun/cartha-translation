base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: zh_hans
  text: 自古以来，从未听说有人使生来瞎眼之人的眼睛得开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从创世以来，从未听说……”。
    reason: ἐκ τοῦ αἰῶνος可按较宽的时间范围理解并译为“从创世以来”；正文采用较少解释性的历史习语“自古以来”。
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: 自古以来
  rationale: 这是表示漫长历史时段的习语，指从古至今、在人所知的历史中；“自古以来”自然保留其历史范围，又不把它强化为形而上的“从永恒以来”。
- source_word: οὐκ ἠκούσθη
  choice: 从未听说
  rationale: 该被动表达用于说明从未有过人所听闻的先例；汉语“从未听说”自然传达这种报道与先例的含义。
- source_word: ὅτι
  choice: （由后接分句直接表达）
  rationale: ὅτι引出所听闻的内容。现代汉语在“听说”之后无需另译连接词，直接接分句最为自然。
- source_word: ἠνέῳξέν
  choice: 开了……的眼睛
  rationale: 保留ἀνοίγω与“眼睛”搭配的具体意象，不改译为较具解释性的“医好”或“使复明”。
- source_word: τις
  choice: 有人
  rationale: 在否定范围内表示不定主体；“从未听说有人……”符合现代汉语的一般性陈述方式。
- source_word: ὀφθαλμοὺς
  choice: 眼睛
  rationale: 直接译出复数名词；汉语以“眼睛”自然表达双眼，无需机械标示复数。
- source_word: τυφλοῦ γεγεννημένου
  choice: 生来瞎眼之人
  rationale: 该短语描述一个从出生起就失明的人。“生来瞎眼之人”准确表达状态与时间起点，同时不额外加入原文没有明说的“男人”。
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος的时间范围
  choice: 理解为“自古以来”，即在人所知的历史中从未有此先例
  alternative: “从创世以来”或“从永恒以来”
  rationale: 说话者是在强调这一事件在人类经验中前所未闻，而非作关于永恒的形而上陈述；正文保留其强烈的历史性修辞，同时以脚注呈现较宽的传统译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“自古以来，从未听说”保留原文的强调；“开了……的眼睛”保留原文具体意象，而“生来瞎眼之人”避免增添性别称谓。
