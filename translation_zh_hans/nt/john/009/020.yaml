  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: zh_hans
  text: 于是，他的父母回答说：“我们知道这是我们的儿子，也知道他出生时就是瞎眼的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他生来就是瞎眼的。”
    reason: 词语表达的另一种自然译法；同样表达 τυφλὸς ἐγεννήθη 的含义。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文对他父母的查问，既可表达叙事推进，也保留由前情引出的意味；现代汉语中自然明晰。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 他的父母
  rationale: 准确表达复数名词 γονεῖς 对父亲和母亲的合称。
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: 回答说
  rationale: 希腊语以两个动词构成常见的叙事表达；汉语用“回答说”既保留回答与发言两层信息，又避免生硬的“回答并说”。
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: 直接表达其确定知晓的事实，符合父母作证时的语气。
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: 这是我们的儿子
  rationale: 自然、准确地保留指认和亲子关系。
- source_word: τυφλὸς ἐγεννήθη
  choice: 他出生时就是瞎眼的
  rationale: 紧贴“瞎眼”与“出生”这一谓语结构，清楚表明失明状况自出生之时即已存在；另一个自然译法列入脚注。
theological_decisions: []
