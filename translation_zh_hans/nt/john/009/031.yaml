id: JHN.9.31
reference: John 9:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: zh_hans
  text: 我们知道，神不垂听罪人；但若有人敬畏神[a]，并且遵行他的旨意，神就垂听他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜神的人”。
    reason: 词义上θεοσεβής既可强调对神的敬畏虔敬，也可表达敬拜神的人；正文采用较宽广的形容词意义，脚注保留可能的替代译法。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，在通用希腊语中通常表达现在的认知状态；“我们知道”自然准确。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 该词为复数属格，作ἀκούει所涉及的对象，指一类人；“罪人”简洁保留其道德与宗教含义。
- source_word: ἀκούει
  choice: 垂听
  rationale: 这里不是单指听见声音，而是指神以认可、回应的方式听取。“垂听”符合现代中文的祷告语境，又没有进一步明确为“应允”。前后两处采用同一译法。
- source_word: θεοσεβὴς
  choice: 敬畏神
  rationale: 该形容词指对神存敬畏、虔敬态度的人。“敬畏神”保留了对神的明确指向，也不把含义局限于礼仪性的敬拜。
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: 遵行他的旨意
  rationale: ποιεῖν τὸ θέλημα是“实行、遵行某人的旨意”的惯用表达；“遵行他的旨意”在中文中自然、庄重。
- source_word: τούτου ἀκούει
  choice: 神就垂听他
  rationale: τούτου回指前述敬畏神并遵行其旨意的人，具有明确指示作用；中文补出主语“神”，使条件句后的关系清楚，并与前半句形成对应。
- source_word: ἀλλ’ ἐάν τις
  choice: 但若有人
  rationale: 准确表达转折和不定条件；“但若有人”简洁而庄重。
theological_decisions:
- issue: “神不垂听罪人”这一断言的范围
  choice: 按说话者的断言直接译出，不加弱化或系统化说明。
  alternative: 译为“神不听罪人的祷告”或“神不认可罪人”。
  rationale: 希腊文只说神不ἀκούει罪人，并与他垂听敬畏神、遵行其旨意的人形成对照。译文保留原话的力度和张力，不把它扩展为关于神在一切意义上是否听见罪人的普遍教义，也不添加原文没有的“祷告”。
- issue: θεοσεβής的含义
  choice: 敬畏神
  alternative: 敬拜神的人
  rationale: “敬畏神”较完整地体现该形容词所含的虔敬与尊崇，不限于礼仪行为；另一种可能译法以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“垂听”适合神回应人的语境，并避免把ἀκούει过度解释成必然“应允”。正文中的脚注标记[a]紧接“敬畏神”，对应θεοσεβής的词义异译。
