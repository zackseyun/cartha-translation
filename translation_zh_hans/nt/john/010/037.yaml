  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: zh_hans
  text: 我若不做我父的事，就不要信我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就不要信我所说的话。”
    reason: πιστεύω加与格μοι既可理解为“相信我”，也可在语境中表达“相信我所说的话”。
lexical_decisions:
- source_word: εἰ
  choice: 若
  rationale: 引出真实条件句；“若”简洁、庄重，也符合本节论证语气。
- source_word: οὐ ποιῶ
  choice: 不做
  rationale: οὐ否定现在时主动直陈语气ποιῶ。汉语通常无需强行标出进行体；“不做”自然表达当前及持续行为。
- source_word: τὰ ἔργα
  choice: 事
  rationale: ἔργα指所做的工作、行为或事迹。约翰福音中它也涵盖见证耶稣身份的作为；“事”在“做我父的事”这一搭配中自然，并保留较宽语义。
- source_word: τοῦ πατρός μου
  choice: 我父的
  rationale: 直译属格关系。此处明确指耶稣与父神的关系；现代中文经文中用“我父”自然且庄重。
- source_word: μὴ πιστεύετέ
  choice: 就不要信
  rationale: μή加现在时命令语气构成禁止；条件句后加“就”使现代汉语逻辑清楚。“信”延续约翰福音πιστεύω词群的核心表达。
- source_word: μοι
  choice: 我
  rationale: πιστεύω加与格可表示相信某人，也可含相信其话语之意。主文采用直接的人称表达，不将含义扩写得过窄。
theological_decisions:
- issue: πιστεύω与与格μοι的语力
  choice: “不要信我”，保留信从对象直接指向耶稣的表达
  alternative: “不要信我所说的话”
  rationale: 希腊语可表示相信某人，而上下文也涉及接受耶稣的宣称。主文不把个人性的信与对其话语的相信人为分开；脚注提示可能的命题性理解。
- issue: “我父的事”的所指
  choice: 保留宽泛的“事”，不直接译成“神迹”
  alternative: “我父的神迹”或“我父的工作”
  rationale: ἔργα在语境中包括耶稣所行、为他作见证的作为，但原词并不限于神迹。宽译可保存约翰文本的神学张力。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“若……就……”清楚呈现条件关系；“做我父的事”避免过度解释ἔργα，同时普通读者容易理解。脚注标记已在主文中对应出现。
