  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: zh_hans
  text: 耶稣回答他们：“我向你们显明了许多从父[a]而来的美好作为；你们是为了其中哪一件作为，拿石头打我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“父”，没有“我的”一词。
    reason: 说明原文措辞，避免按部分译本或习惯表达增译为“我父”。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是叙事中表示回应的常用动词；“回答”自然、准确，也不额外强调语气。
- source_word: Πολλὰ ἔργα καλὰ
  choice: 许多美好作为
  rationale: “作为”保留约翰福音中 ἔργα 所指耶稣所行之事及其神学分量；“美好”表达 καλὰ 所含良善、可称许的性质，又避免把短语局限为日常慈善意义上的“善事”。
- source_word: ἔδειξα
  choice: 显给你们看
  rationale: 保留“使人看见、展示”的基本意义，同时在现代汉语中仍具庄重感，并与可见的作为相称。
- source_word: ἐκ τοῦ πατρός
  choice: 出于父
  rationale: ἐκ 表示来源；“出于”准确保留这些作为源自父的意思。原文只有“父”，没有“我的”，因此不增译“我父”。
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: 因其中哪一件
  rationale: διά 加宾格在这里表示原因或根据；“其中”回指前述许多作为，“哪一件”保留 ἔργον 的单数形式。
- source_word: λιθάζετε
  choice: 拿石头打我
  rationale: 直译以石头攻击的动作。汉语动词本身不强制标明时态，既可贴合眼前的行动，也不必增添原文未明说的“企图”或“打死”。
theological_decisions:
- issue: 耶稣话语中“父”的表达
  choice: 保留“父”，不扩充为“我父”
  alternative: 我父
  rationale: 希腊文本是 τοῦ πατρός，没有 μου（“我的”）。上下文虽清楚呈现耶稣与父的关系，译文仍不应在本节中把这种关系说得比原文更明确。
- issue: 作为与父之间的关系
  choice: 译为“出于父”，表达来源
  alternative: 奉父之命／代表父
  rationale: ἐκ 首先标明来源；若译成“奉命”或“代表”，会把可能涉及来源、能力或授权的关系收窄为一种解释。
translation_notes:
  register: 采用自然而庄重的现代标准汉语。“美好作为”保留约翰福音中“作为”的主题性用语；问句保持直接、有力，不另加解释性措辞。
