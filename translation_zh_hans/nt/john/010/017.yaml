  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: zh_hans
  text: 为此，父爱我，因为我舍下自己的生命[a]，为要再取回它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵魂”。这里的“生命”（ψυχή）最自然地指耶稣在死亡中舍下、又重新取回的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 为此
  rationale: 简洁自然地表达前指性的因果关联，与下文“因为”引出的具体理由相配。
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: 父爱我
  rationale: 保留希腊文定冠词所指的“父”，不增添原文没有的领属词“我的”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出父爱耶稣的理由，因果义最符合上下文。
- source_word: τίθημι τὴν ψυχήν μου
  choice: 我舍下自己的生命
  rationale: “舍下生命”自然表达主动、自愿交出生命的含义；“自己的”清楚传达 μου，同时符合现代汉语习惯。
- source_word: ἵνα
  choice: 为要
  rationale: 保留目的意味，又不把目的与结果之间的关系解释得过死。
- source_word: πάλιν λάβω αὐτήν
  choice: 再取回它
  rationale: “再”表达 πάλιν；“取回”在此语境中自然指重新取得所舍下的生命，也保留主体主动行动的意味。
theological_decisions:
- issue: ψυχή 在耶稣自我牺牲语境中的含义
  choice: 译作“生命”
  alternative: 译作“灵魂”
  rationale: 上下文所说的是耶稣在死亡中舍下生命、随后再取回生命；“灵魂”容易引入本节并未着重表达的身心二分观念。
- issue: ἵνα 加虚拟式所表达的目的与结果关系
  choice: 译作“为要再取回它”
  alternative: 译作“以便再取回它”或“好再取回它”
  rationale: “为要”明确保留目的色彩，却不额外断定有关死亡与复活之关系的哲学性解释。
- issue: 父爱子与子舍命之间的因果表述
  choice: 保留“父爱我，因为……”的直接因果结构
  alternative: 改写为较弱的关联表达
  rationale: 原文以 ὅτι 明示理由；译文不应为了回避潜在的神学张力而削弱这一结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“舍下生命”延续本段牧人自愿舍命的核心意象；句法尽量贴近原文的因果与目的结构，同时避免生硬直译。
