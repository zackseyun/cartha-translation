  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: zh_hans
  text: 耶稣正在圣殿区[a]的所罗门廊[b]里行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词指整个圣殿建筑群或圣殿范围，并非专指内殿。
    reason: cultural_note
  - marker: b
    text: “廊”也可译作“柱廊”，指有柱子的有顶走廊。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιεπάτει
  choice: 正在……行走
  rationale: 未完成时直陈语气表示过去正在持续的动作；中文用“正在……行走”自然地保留进行意味。
- source_word: ἱερῷ
  choice: 圣殿区
  rationale: ἱερόν指整个圣殿建筑群或范围，并非专指内殿（ναός）；“圣殿区”准确而简明。
- source_word: στοᾷ
  choice: 廊
  rationale: στοά指有柱子的有顶走廊；在“所罗门廊”这一地名中用“廊”自然、庄重，脚注补充其建筑含义。
- source_word: τοῦ Σολομῶνος
  choice: 所罗门廊
  rationale: 属格构成地点名称，现代汉语自然译作“所罗门廊”。
- source_word: καὶ
  choice: 未单独译出
  rationale: καί承接上文；本节独立呈现时，汉语无需以“而且”或“于是”起句，以免增加原文没有明确表达的逻辑或时间色彩。
theological_decisions: []
