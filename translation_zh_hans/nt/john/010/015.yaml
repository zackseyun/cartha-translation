source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: zh_hans
  text: 正如父认识我，我也认识父；我为羊舍命[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我放下我的生命”。原文ψυχή也可译作“性命”或“魂”，但本处指为羊牺牲生命。
    reason: lexical_alternative
  - marker: b
    text: “为羊”也可理解为“代表羊”或“为了羊的益处”；原文介词在这里带有代表性和牺牲性的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 承接上文并引出对应关系；“正如”在现代汉语中自然、清楚，也保留原文比较的力度。
- source_word: γινώσκει / γινώσκω
  choice: 认识
  rationale: 这里不只是知道某项事实，也表达父与子之间关系性的认识；“认识”既保留词汇对应，又不把含义过度解释为某一种具体层面。
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: 父
  rationale: 希腊文使用带冠词的“父”，没有物主代词；译作“父”符合约翰福音的称谓习惯，也保留两句的平行结构。
- source_word: κἀγὼ
  choice: 我也
  rationale: 该词由καί与ἐγώ缩合而成；“我也”自然呈现双方彼此认识的对应关系。
- source_word: ψυχήν μου
  choice: 我的命（在“舍命”中）
  rationale: 在好牧人为羊牺牲自己的语境中，ψυχή指生命，而不是专指非物质的灵魂；汉语惯用语“舍命”准确而凝练。
- source_word: τίθημι
  choice: 舍
  rationale: τίθημι与ψυχή构成“舍去生命”的表达；“舍命”是现代汉语中自然、庄重的自我牺牲用语。
- source_word: ὑπὲρ
  choice: 为
  rationale: “为”能表达使羊得益处以及代表、牺牲的广度，而不把原文限定为单一的技术性教义表述。
- source_word: τῶν προβάτων
  choice: 羊
  rationale: 保留原文具体的羊群意象和好牧人的比喻；汉语在泛指群体时无需另加量词或复数标记。
theological_decisions:
- issue: 耶稣自我舍弃中ὑπὲρ的含义
  choice: 译作“为”，保留受益、代表和牺牲层面的开放性
  alternative: “代表羊”或“代替羊”
  rationale: 本节明确说耶稣的死亡是有意为了羊，并处于牺牲性的语境中；“为”不排除代表性或代替性，却避免把介词本身收窄为单一教义公式。
- issue: 本节ψυχή的含义
  choice: 按“生命”理解，译入惯用语“舍命”
  alternative: “灵魂”
  rationale: 上下文谈好牧人为羊而死，因此这里指耶稣所舍弃的生命；若译作“灵魂”，容易引入原文在此并未强调的人论含义。
- issue: 父与子彼此“认识”的性质
  choice: 保留“认识”，不增译为“完全了解”或“亲密认识”
  alternative: “了解”或“深知”
  rationale: 关系性和亲密性可由约翰福音的上下文显明；直译为“认识”既保留神学深度，也避免添加原文没有明说的程度副词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正如……也……”保留平行关系；“舍命”符合汉语惯用表达，并维持好牧人自我牺牲的力度。脚注标记置于相关短语之后。
