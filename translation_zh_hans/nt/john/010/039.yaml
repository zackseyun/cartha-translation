base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: zh_hans
  text: 于是，他们又试图抓住他，他却从他们手中脱身了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从他们的手中出去”；“手”在这里是表示权势或控制的惯用说法，也可译作“摆脱了他们的掌控”。
    reason: 说明原文的字面表达及其惯用意义，并保留较直译的选择。
lexical_decisions:
- source_word: ἐζήτουν
  choice: 想
  rationale: 未完成时在这里表示持续的企图；结合不定式“抓住”，译作“想抓住”自然地表达他们正在设法行动，而不是单纯的愿望。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文争论及其结果，既保留推展关系，也符合现代汉语叙事。
- source_word: πάλιν
  choice: 又
  rationale: 直接表达重复发生，呼应此前试图捉拿耶稣的行动。
- source_word: πιάσαι
  choice: 抓住
  rationale: 保留“抓取、擒住”的身体性和敌对意味，同时不额外加入正式司法程序所含的“逮捕”概念。
- source_word: ἐξῆλθεν
  choice: 脱身了
  rationale: 该动词本义为“出去”，但与“从他们手中”连用时表示脱离其控制；“脱身了”在现代汉语中自然，并保留叙事结果而不过度描写逃脱方式。
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: 从他们手中
  rationale: 保留希腊文“手”所表达的掌握、控制这一惯用意义；汉语“从他们手中”同样可以自然承载这一比喻。
theological_decisions:
- issue: 是否把耶稣的脱离明确译成“逃走”
  choice: 译作“从他们手中脱身了”
  alternative: 他从他们手中出去了；他逃脱了他们的掌控
  rationale: 原文使用“出去”而非明确的“逃跑”动词，并以“从他们的手”表达脱离控制。“脱身”能使现代读者明白结果，又不暗示慌乱逃跑或补充原文未说明的方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……又……”顺畅承接上文；“抓住”保留敌对行动的力度，“脱身”则避免使用可能过度司法化的“逮捕”或过度描写动作的“溜走”。
