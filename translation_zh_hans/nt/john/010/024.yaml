base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: zh_hans
  text: 于是，犹太人[a]围住他，对他说：“你要让我们犹疑不定到几时呢？[b]你若是弥赛亚，就明明白白告诉我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《约翰福音》中的“犹太人”有时按上下文更具体地指犹太地区的权势人物或反对耶稣的人，并不一定泛指整个犹太民族。
    reason: cultural_note
  - marker: b
    text: 较直译为：“你使我们的心悬着，要到什么时候呢？”这是一个习语，意思是使人一直处于不确定、悬而未决的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: 围住
  rationale: κυκλόω表示从四周包围；“围住”自然、简洁，也保留了现场带有逼问意味的动作感。
- source_word: οὖν
  choice: 于是
  rationale: οὖν在这里承接上文并推进叙事；“于是”符合现代汉语叙事习惯，又保留连接作用。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 原文直称“犹太人”，本节没有明说是领袖或犹太地区的人，因此正文不擅自缩小所指范围；上下文中可能较具体的所指另以脚注说明。
- source_word: ἔλεγον
  choice: 对他说
  rationale: 未完成时可表示持续或当时正在发生的言说。汉语用“对他说”比机械地译成“不断对他说”自然；逼问的持续意味可由场景与问句体现。
- source_word: Ἕως πότε
  choice: 到什么时候
  rationale: 与“还要”搭配，自然表达希腊语“要到何时”的诘问语气。
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: 让我们悬疑不定
  rationale: 该短语字面近于“把我们的魂悬起来”，在此是使人一直处于不确定、悬而未决状态的习语。“悬疑不定”传达其语用意义，同时脚注保留字面意象。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: χριστός在此作为受膏君王与拯救者的称号出现；译作“弥赛亚”可清楚保留当时犹太语境中的称号性质。
- source_word: εἰπὲ ἡμῖν
  choice: 告诉我们
  rationale: 准确表达直接命令，符合现代汉语口吻。
- source_word: παρρησίᾳ
  choice: 明明白白地
  rationale: παρρησία在此强调公开、直率、不含糊地说。“明明白白地”自然体现对明确答复的要求，同时不排除“公开直说”的语义色彩。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里是询问耶稣是否具有某一犹太盼望中的身份称号，而非把Χριστός当作近似姓名的称呼；“弥赛亚”更直接显出称号及其历史语境。
- issue: 《约翰福音》中οἱ Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，脚注说明语境中可能指更具体的群体
  alternative: 犹太领袖／犹太地区的人
  rationale: 原文本节未明确加上“领袖”等限定。正文保留表达的范围与歧义，脚注则防止读者误以为必然泛指全体犹太民族。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“围住”保留现场张力；问句使用“还要……到什么时候呢”呈现逼问语气。“悬疑不定”虽略具书面色彩，但普通读者易懂，并与脚注中的原文意象相配。所有脚注标记均置于其所解释内容之后。
