  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: zh_hans
  text: 我赐给他们永生；他们永远绝不会灭亡；谁也不会从我手中把他们夺走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是约翰著作中固定而自然的表达，既包含永恒的生命，也保留其神学内涵。
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: 他们永远绝不会灭亡
  rationale: “οὐ μή”是强烈否定，“εἰς τὸν αἰῶνα”表示永远；译文同时保留否定的强调和时间范围，避免将后者省略。
- source_word: ἁρπάσει
  choice: 夺走
  rationale: 表达强行攫取、抢夺之意，在“从我手里”这一语境中自然准确。
- source_word: ἐκ τῆς χειρός μου
  choice: 从我手里
  rationale: 保留原文手的意象，并以现代汉语自然表达。
theological_decisions:
- issue: 强烈否定与“永远”的关系
  choice: 他们永远绝不会灭亡
  alternative: 他们绝不会灭亡
  rationale: 原文同时有强调否定“οὐ μή”和时间短语“εἰς τὸν αἰῶνα”；明确译出“永远”可完整呈现原文，而不进一步推演特定教义体系。
- issue: οὐχ ἁρπάσει τις 的主语范围
  choice: 谁也不能……夺走
  alternative: 没有人会……夺走
  rationale: 不定代词 τις 在否定结构中泛指任何人；“谁也不能”自然体现断然否定，并保留保护性的语气。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“永远绝不会”有意保留希腊文双重强调：“绝不会”对应 οὐ μή，“永远”对应 εἰς τὸν αἰῶνα。全节无需脚注。
