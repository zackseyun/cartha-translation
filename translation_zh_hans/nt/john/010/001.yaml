id: JHN.10.1
reference: John 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：那不从门进入羊圈[a]，反而从别处爬进去的人，就是贼，就是强盗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊圈”也可译作“羊栏”或“羊群所在的围院”。原词指有围护的院落或圈栏。
    reason: lexical_alternative
  - marker: b
    text: 原文区分“贼”和“强盗”：前者侧重偷窃，后者常带有公开抢夺、暴力或匪徒的意味。
    reason: lexical_distinction
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 约翰福音中双重“阿们”是郑重强调的引言公式；“实实在在”既保留重复加强的力度，又符合现代汉语中庄重而易懂的表达。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 自然表达“我对你们说”的直接言说公式，并与前面的郑重强调语连贯结合。
- source_word: ὁ μὴ εἰσερχόμενος
  choice: 那不……进入……的人
  rationale: 保留希腊文名词化分词的泛指单数结构，也为后面的强调指示词ἐκεῖνος提供自然照应。
- source_word: διὰ τῆς θύρας
  choice: 从门
  rationale: θύρα可指门或入口；在羊圈场景中“门”自然，并保留后文比喻所需的核心意象。
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: 进入羊圈
  rationale: αὐλή本指有围护的院落或圈栏；结合τῶν προβάτων，“羊圈”是简洁、具体且符合汉语习惯的表达。
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: 反而从别处爬进去
  rationale: ἀναβαίνων在此描绘越过圈墙而入的动作，“爬进去”在汉语中比直译“上去”更清楚；“从别处”保留ἀλλαχόθεν所指的另一地点或方向，而不改写成抽象的“另一种方式”。
- source_word: ἐκεῖνος
  choice: 就是……
  rationale: 通过判断句中的“就是”体现指示代词的强调和确认作用，避免生硬的“那一个”，并与前面的“那……的人”形成照应。
- source_word: κλέπτης
  choice: 贼
  rationale: 指以偷窃为特征的人；“贼”简洁自然，并可与后面的“强盗”形成区别。
- source_word: λῃστής
  choice: 强盗
  rationale: 该词常含公开抢夺、暴力或匪徒意味；“强盗”比“盗贼”更能与κλέπτης的“贼”区分。
theological_decisions:
- issue: θύρα与αὐλή构成的比喻场景
  choice: 具体译作“门”和“羊圈”，不在本节中扩展其寓意
  alternative: 译作“圈门”和“羊栏”，或直接加入对门、羊圈及闯入者所代表对象的解释
  rationale: 本节先陈述具体的牧羊图景，其寓意在后文展开。译文应保留图像及其张力，不预先把“门”或“羊圈”等同于某个教义概念。
- issue: κλέπτης与λῃστής的语义区别
  choice: 分别译作“贼”和“强盗”
  alternative: 合并译为“盗贼”，或译作“窃贼和匪徒”
  rationale: 原文并列两个不同名词；分别翻译保留秘密偷窃与较具暴力或公开抢夺意味之间的区别，而不把两者化为同义重复。
- issue: 泛指单数阳性结构
  choice: 译作“那……的人”，并以“就是”承接
  alternative: 译作“凡不……的人”或显式译作“那个人”
  rationale: 这里描述一类人的代表性单数，并非强调生理性别；此译法保留单数和指认语气，同时符合现代汉语自然用法。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“我实实在在地告诉你们”保留约翰福音双重郑重公式；全句用冒号和两个“就是”呈现原文的宣告力度。脚注标记均置于相关正文词语之后。
