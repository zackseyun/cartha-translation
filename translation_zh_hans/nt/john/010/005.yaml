source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: zh_hans
  text: 但它们绝不会跟从陌生人[a]，反而会逃离他，因为它们不认得陌生人的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文使用强调性的否定结构，也可译作“永远不会跟从陌生人”。
    reason: 说明οὐ μή与将来时直陈语气所表达的强调否定，以及可行译法。
  - marker: b
    text: “认得……声音”也可译作“熟悉……声音”或“辨认出……声音”。
    reason: 说明οἶδα在此处可兼有知道、熟悉和辨认的含义。
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: 陌生人
  rationale: 在牧羊的比喻中，指不属于羊群、羊不熟悉的人；“陌生人”自然保留这种关系含义，不引入族群意义。
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: 绝不会跟从
  rationale: οὐ μή与将来时直陈语气构成强烈否定；“绝不会”准确传达强调语气，“跟从”也适合羊与牧人的语境。
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: 会逃离他
  rationale: 表达羊主动躲开并远离陌生人；“逃离”保留了φεύγω较强的回避意味。
- source_word: οἴδασι
  choice: 认得
  rationale: 以“声音”为宾语时，οἶδα可表示辨认或熟悉；“认得声音”符合现代汉语，也保留羊因不熟悉而不跟从的语境。
- source_word: τῶν ἀλλοτρίων τὴν φωνήν
  choice: 陌生人的声音
  rationale: 希腊文以复数属格泛指陌生人这一类；汉语可用无标记的“陌生人”作类称，表达自然且不必生硬地说“陌生人们”。
- source_word: δὲ ... ἀλλὰ
  choice: 但……反而
  rationale: 保留前后鲜明对比：羊不仅不跟从，反而逃离。
theological_decisions:
- issue: 羊与牧人的比喻所指
  choice: 按经文本身保留“陌生人”的比喻说法，不在正文中明确解释其身份。
  alternative: 将“陌生人”直接译解为假教师或不合法的领袖。
  rationale: 本节仍在比喻层面陈述，未在此处明确指出“陌生人”具体代表谁；直译可避免把解释写入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“它们”承接上下文中的羊；“跟从”较“跟着”更具经文语体而不显古奥。“绝不会……反而……”清楚呈现原文的强调否定与转折结构。
