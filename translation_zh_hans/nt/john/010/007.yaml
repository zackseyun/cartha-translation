  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: zh_hans
  text: 于是，耶稣又对他们说：“我实实在在地告诉你们，我就是羊的门[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译为“栅门”；在牧羊和羊圈的意象中，可指羊圈的出入口。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并带出耶稣因众人不明白而再次解释的叙事推进；“于是”在现代汉语中自然，也保留了推论和承接意味。
- source_word: πάλιν
  choice: 又
  rationale: 简明表达动作的重复，与“于是”连用符合现代汉语习惯。
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 以汉语中庄重而通行的表达传达双重“阿们”的郑重和强调，同时避免不透明的音译。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 与前面的郑重公式组成自然汉语，完整表达“我对你们说”。
- source_word: ὅτι
  choice: 不单独译出
  rationale: 汉语直接引语无需另加内容从句标记，其功能已由后面的宣告自然体现。
- source_word: ἐγώ εἰμι
  choice: 我就是
  rationale: “就是”体现希腊文显式主语所带的强调，同时保持自然、有力的自我宣告。
- source_word: θύρα
  choice: 门
  rationale: “门”直接对应可指门、门口或入口的 θύρα，也适合羊圈的牧羊意象；相关语义范围在脚注说明。
- source_word: τῶν προβάτων
  choice: 羊的
  rationale: 贴近希腊文属格，保留“门”与“羊”之间关系的含混性，不预先限定为“给羊用的”或“通往羊圈的”。
theological_decisions:
- issue: “我是”宣告中的比喻性自我认同
  choice: 我就是羊的门
  alternative: 我就是羊群进出的门
  rationale: 正文保留原文简洁而张力鲜明的比喻，不把其通达、保护或救恩含义扩写进译文；也不把属格关系解释得过于具体。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“我实实在在地告诉你们”保留约翰福音双重“阿们”公式的郑重语气；“羊的门”虽略带陌生感，却有意保存原文比喻及属格关系的开放性。
