  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: zh_hans
  text: 但你们不信[a]，因为你们不属于我的羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但你们不相信自己不属于我的羊。”希腊文连接词也可以理解为引出不信的内容，而不是说明原因。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文并形成鲜明转折；现代汉语中“但”简洁自然。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明示复数主语，保留希腊文显式代词所带的对比意味；汉语无需另加“你们自己”，以免强调过度。
- source_word: οὐ πιστεύετε
  choice: 不信
  rationale: 以一般现在时表达持续的事实或态度；“信”符合约翰福音的常用神学词汇，也保留其隐含宾语。
- source_word: ὅτι
  choice: 因为
  rationale: 按因果连词理解，最符合上下文中耶稣的羊听他声音、跟从他的论述；其也可能引出所信内容，故用脚注保留。
- source_word: οὐκ ἐστὲ
  choice: 不属于
  rationale: 结合ἐκ表示群体归属，用“不属于”比逐字译作“不是”更自然，并清楚传达成员身份。
- source_word: ἐκ τῶν προβάτων τῶν ἐμῶν
  choice: 属于我的羊
  rationale: ἐκ在此表达群体归属；“属于我的羊”在现代汉语中自然地表示不在耶稣的羊群之列，同时不额外引入“羊群”一词。
theological_decisions:
- issue: ὅτι说明不信的原因，还是引出不信的内容
  choice: 因果读法：“因为你们不属于我的羊”
  alternative: 内容读法：“但你们不信自己不属于我的羊”
  rationale: 上下文将听从并跟随耶稣的羊与不信的听众作对比，因果读法较为顺畅；但ὅτι本身也可引出内容，而且这一差异涉及不信与归属之间的神学关系，因此正文采用较可能的读法，脚注保留另一读法，不将张力消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不属于我的羊”清楚表达群体归属；脚注以普通读者易懂的方式交代希腊文句法歧义。
