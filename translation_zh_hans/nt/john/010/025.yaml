    rationale: 希腊文先提出‘我所做的事’，再以 ταῦτα（这些）加以强调；汉语可将‘这些事’纳入定语结构，并以‘正’保留强调，避免‘就是这些事’造成不必要的重复。
  - severity: medium
    issue: 脚注 b 的‘这些事为有关我的事作证’不准确且不自然。
    rationale: περὶ ἐμοῦ意为‘关于我／为我’，不是‘有关我的事’。脚注应提供不改变所指对象的自然替代译法。
