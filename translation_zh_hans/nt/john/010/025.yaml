  source_fidelity: 基本忠实于希腊文：保留了先前已说、听者不信、奉父的名而行，以及作为见证的行动。μως，‘就是这些事为我作见证’在汉语中指代结构略显滞重，且脚注 b 的替代表达‘为有关我的事作证’误将 περὶ ἐμοῦ 处理为‘有关我的事’，不够准确自然。
  naturalness: “耶稣回答他们”“我已经告诉过你们，你们却不信”“奉我父的名”均自然且适合庄重的现代经文语体。将末句调整为‘我奉我父的名所做的这些事，正为我作见证’可更流畅地表达原文以 ταῦτα 强调这些作为的结构。
  terminology: “信”“奉……的名”“作见证”均适当保留《约翰福音》的关键语汇和见证语境。‘我父’符合汉语圣经语体，无须改作较口语化的‘我父亲’。
