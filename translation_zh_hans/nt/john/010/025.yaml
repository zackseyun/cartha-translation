  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: zh_hans
  text: 耶稣回答他们：“我已经告诉过你们，你们却不信。我奉我父的名[a]所做的这些事，正为我作见证[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭我父的权柄”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这些事见证我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是对话叙事中自然、准确的常用表达。
- source_word: Εἶπον ὑμῖν
  choice: 我已经告诉过你们
  rationale: 不定过去时指向先前对他们说过的话；“已经……过”在现代汉语中自然地传达此前言说的意味，同时不补明原文未说明的内容。
- source_word: οὐ πιστεύετε
  choice: 你们却不信
  rationale: “信”保持《约翰福音》中 πιστεύω 的关键词一致性；“却”自然表达前后分句间的反差。
- source_word: τὰ ἔργα
  choice: 所做的事
  rationale: “所做的事”比生硬的“工作”更符合现代汉语，同时保留耶稣行动与神迹这一较宽的语义范围。
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: 奉我父的名
  rationale: 保留希腊文“在……的名里”所包含的代表、授权及关联等丰富含义，不将其缩减为单一的“凭权柄”。
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: 就是这些事为我作见证
  rationale: “就是这些事”体现复指代词 ταῦτα 的强调；“作见证”保留约翰著作中 μαρτυρέω 的法律与见证语汇色彩。
theological_decisions:
- issue: 耶稣所做之事与父的名及权柄之间的关系
  choice: 奉我父的名
  alternative: 凭我父的权柄
  rationale: 正文保留原文惯用语的开放幅度，既可表达父的授权，也可包含代表父而行的关系意义，避免把本节扩展为原文未明确陈述的完整教义命题。
- issue: 耶稣所做之事的见证作用
  choice: 这些事为我作见证
  alternative: 这些事为有关我的事作证
  rationale: 采用自然汉语表达，同时保留这些行动指向并证实耶稣身份与主张的含义，不进一步限定见证的具体内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“告诉过”表达先前已说，“却不信”凸显反差；“奉……的名”和“作见证”保留《约翰福音》的核心表达。脚注标记均置于其实际对应的短语之后。
