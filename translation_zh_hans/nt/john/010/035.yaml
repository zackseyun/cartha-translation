id: JHN.10.35
reference: John 10:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: zh_hans
  text: 如果他称那些上帝的话临到的人为“神”[a]——而且圣经是不能废掉的[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数“神”，呼应诗篇82:6；也可理解为“神明”。有些解释认为这里所指的是人间的审判官。
    reason: 保留θεοὺς的字面措辞，同时说明汉语无法直接显示复数，并呈现主要解释可能而不在正文中定论。
  - marker: b
    text: 也可译作“不能被取消效力”或“不能搁置不用”。
    reason: 说明λυθῆναι在此可表达废除、使之失效或搁置不用的含义。
lexical_decisions:
- source_word: εἰ
  choice: 如果
  rationale: 保留耶稣论证中的条件句结构；这里的条件是为推进论证而提出，并不暗示说话者怀疑其真实性。
- source_word: ἐκείνους
  choice: 那些人
  rationale: 指向经文中被称为“神”的对象；补出汉语所需的“人”，但不进一步判定他们是审判官还是其他身份。
- source_word: εἶπεν
  choice: 他……称为
  rationale: 原词本义为“说”，但在此处带有把某对象称作某名称的表语用法；“称为”符合现代汉语表达，并保留希腊文未明说主语名称的特点。
- source_word: θεοὺς
  choice: “神”
  rationale: 直译其复数意义所指的称号，并呼应诗篇82:6；汉语名词通常不标复数，因此以引号表明这是原文所用的称呼，不改译为带解释性的“审判官”。
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: 上帝的话所临到的那些人
  rationale: “临到”自然表达话语朝向并及于某些人的事件性含义，也避免把这里的“话”误解为约翰福音1章中作为位格称号的“道”。
- source_word: οὐ δύναται λυθῆναι
  choice: 不能废掉
  rationale: 表达经文不能被解除、取消效力或置于一旁；“废掉”简洁自然，并保留原语可能具有的权威与效力层面。
- source_word: ἡ γραφή
  choice: 圣经
  rationale: 这里指具有权威的经上文字；“圣经”是现代汉语中清楚而通行的表达。
theological_decisions:
- issue: “神”（θεοὺς）所指对象的身份
  choice: 正文保留“神”这一称呼，不解释其具体身份。
  alternative: 审判官；神明；属神者
  rationale: 耶稣的论证依赖诗篇82:6的实际措辞。若在正文中改成“审判官”或其他解释，会提前消解原文有意保留的张力。
- issue: “圣经不能废掉”的含义
  choice: 译作“圣经是不能废掉的”。
  alternative: 圣经不能被取消效力；圣经不能被置于一旁
  rationale: 该插入语强调圣经在论证中不可被解除或否定的权威。“废掉”保留原文意象与传统力度，脚注列出更明确的效力性释义。
- issue: εἶπεν的隐含主语
  choice: 译作“他”，不在正文中明定为“上帝”或“圣经”。
  alternative: 上帝；圣经
  rationale: 希腊文动词只标示第三人称单数，未在本节明说主语。保留代词可避免替原文解决其语法指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝的话所临到”略带经文语体，但在现代汉语中仍清楚自然；破折号保留该句作为插入说明、并继续通向下一节的未完结构。
