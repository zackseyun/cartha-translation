    rationale: “神明”在现代汉语中常指神灵、神祇或受崇敬的超自然存在者，可能比原文“θεοί”的直接、开放措辞更具特定含义。译作“神”能更贴近引文的措辞，并保留诗篇82篇相关解释争议。
  - severity: low
