  naturalness: 整体自然、庄重。“你们的律法上不是写着……吗？”符合现代汉语的经文引述习惯。将“神明”改为“神”更简洁，也更符合中文圣经语体；中文名词本身不强制标示单复数，语境中的“你们是”已足以承载复数谓语名词。
  terminology: “律法”大写与否在汉语中不构成同等的术语区分；“你们的律法”可保留其广义经文指称。θεοί宜译为“神”，以对应希腊文的直接用语，避免以“神明”预先界定其所指。脚注可提供“神圣的存在者”作为解释性替代，并说明该引文出自诗篇82:6、所指存在争议。
