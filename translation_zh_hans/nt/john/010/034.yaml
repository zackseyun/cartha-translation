base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: zh_hans
  text: 耶稣回答他们：“你们的律法上不是写着：‘我曾说，你们是神[a]’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的存在者”。耶稣引用的是诗篇82:6；该处所用词的具体所指历来有不同理解，正文保留引文的直接说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣回答他们
  rationale: 按希腊语叙事语序自然转为现代汉语；“回答他们”准确表达动词及与格对象。
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: 不是写着……吗
  rationale: 保留希腊语反问形式以及完成时被动分词所表达的经文现今仍载明此话的效力。
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: 你们的律法上
  rationale: 此处“律法”广义指向犹太人的圣经，因为所引内容出自诗篇82:6；“律法上写着”也是自然、庄重的汉语经文引述表达。
- source_word: Ἐγὼ εἶπα
  choice: 我曾说
  rationale: “曾”自然体现不定过去时所指的既往言说，同时保留明确主语“我”。
- source_word: Θεοί ἐστε
  choice: 你们是神明
  rationale: 直接保留复数 θεοί 的基本词义和系词结构，不增添“被称为”等解释性成分；“神明”在现代汉语中较能表达复数神性存在者，并避免“神”在书面形式上无法显出单复数的问题。
theological_decisions:
- issue: 耶稣引用诗篇82:6时 θεοί 的译法
  choice: 神明
  alternative: 属神的存在者；诸神
  rationale: 采用直接的名词表达，以保存引文的修辞冲击力及其解释争议，不在正文中判定所指是审判官、人还是天上存在者。脚注提供较解释性的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们的律法”保留原文第二人称措辞；引文标点清楚呈现经文中的直接话语。
