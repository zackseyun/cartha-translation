  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: zh_hans
  text: 许多人来到他那里，说：“约翰没有行过神迹[a]，但约翰所说关于这个人[b]的一切都是真的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“记号”，指带有指向意义的奇事。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“约翰所说关于他的一切都是真的”。原文用“这个人／这位”，指耶稣。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该复数形容词在此作名词用；译为“许多人”自然明确。
- source_word: ἦλθον πρὸς αὐτόν
  choice: 来到他那里
  rationale: 保留向某人移动的含义，也符合此处叙事视角。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示持续或反复说话；现代汉语在此用“说”最自然，不必机械添加“不断”。
- source_word: σημεῖον
  choice: 神迹
  rationale: 约翰福音中的该词指具有指向意义的超常作为；现代中文圣经语境中“神迹”既自然，也保留其作为记号的宗教内涵，脚注补充直译。
- source_word: ἐποίησεν οὐδέν
  choice: 没有行过一个神迹
  rationale: 体现οὐδέν的全然否定，并以现代汉语自然表达“未曾施行任何神迹”。
- source_word: πάντα ὅσα
  choice: 所说……的一切
  rationale: 保留原文概括全部内容的强调。
- source_word: περὶ τούτου
  choice: 关于这个人
  rationale: τούτου是指示代词，指向耶稣；“这个人”既保留指示意味，也避免直接改写成单纯代词。
- source_word: ἀληθῆ ἦν
  choice: 都是真的
  rationale: 直接表达复数内容全都真实，不加入“后来证实”等原文没有的时间或验证意味。
theological_decisions:
- issue: 约翰福音中σημεῖον的主题性用语
  choice: 神迹（脚注说明直译“记号”）
  alternative: 记号
  rationale: “记号”更形式对应，却容易被普通现代读者理解为标志或符号；正文采用约定俗成且可懂的“神迹”，并用脚注保存该词“指向某种意义的记号”这一层面。
- issue: περὶ τούτου的指称力度
  choice: 关于这个人
  alternative: 关于他
  rationale: 保留希腊语指示代词的形式与现场言说感，不把它弱化为普通第三人称代词，也不额外写明“耶稣”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。引语保持口语可读性，同时以“这个人”保存原文指示代词的力度。所有脚注标记均已置于正文。
