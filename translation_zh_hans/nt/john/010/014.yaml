  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: zh_hans
  text: 我是好牧人；我认识属我的[a]，属我的也认识我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我的羊”。原文两处的说法直译均为“属我的”。
    reason: 说明上下文所支持的词义替代，并交代原文两处相同的所有表达。
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: 我是
  rationale: 采用自然、直接的现代汉语自我表明句式，同时保留《约翰福音》中“我是”表达的呼应。
- source_word: ποιμὴν ὁ καλός
  choice: 好牧人
  rationale: “牧人”保留本段实际的牧羊意象，避免“牧师”所带来的后期教会职分含义；“好”自然承载 καλός 在此处兼有的美善、称职与典范意味。
- source_word: γινώσκω / γινώσκουσί
  choice: 认识
  rationale: “认识”既可表达真实了解，也适合双方彼此相知的关系性语境；较“知道”更能传达这里的个人关系意味。
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: 属我的
  rationale: 原文两处都是中性复数所有表达，字面为“我的（那些）”。“属我的”在汉语中自然地指归属于耶稣的人，并保留两处用词的对应，且不把上下文中的“羊”直接补入正文。
- source_word: καί
  choice: ；／也
  rationale: 首个 καί 连接前后陈述，汉语用分号更自然；第二个关系在“也认识我”中体现，使互相认识的平行结构清楚而不生硬重复“并且”。
theological_decisions:
- issue: 如何表达耶稣与属他之人之间相互认识的关系，同时不加入后来的教义表述
  choice: 属我的
  alternative: 我的羊／属于我的人
  rationale: “属我的”忠实保留原文简洁而略含开放性的所有表达，又在现代汉语中明确指向属耶稣者；没有把语境所暗示的“羊”或原文未明说的“人”直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我是好牧人”沿用清楚易懂的核心意象；后半句以“属我的”对称复现原文，并用“也”表达互相认识。脚注标记置于整句之后。
