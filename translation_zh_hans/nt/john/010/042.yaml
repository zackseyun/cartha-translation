  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: zh_hans
  text: 许多人在那里信了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上文的叙事结果；现代汉语在此用“就”比机械译作“并且”更自然，同时不过度强化因果关系。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该形容词在此作名词使用，指人数众多的人；“许多人”准确、自然。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 不定过去时直陈语气表示实际发生的相信；“信了”简洁传达这一事件，而不额外加入“开始”或“归信”等解释。
- source_word: εἰς αὐτόν
  choice: 信了他
  rationale: πιστεύω εἰς表示以某人为信靠对象。现代汉语“信他”自然地保留对耶稣的信赖指向，又避免比原文更具解释性的“把信心寄托在他身上”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留原文的地点副词及其叙事强调；“在那里”比单用“那里”更符合汉语句法。
theological_decisions:
- issue: 在关乎救恩的语境中如何表达 πιστεύω εἰς αὐτόν
  choice: 信了他
  alternative: 信靠了他；信入他
  rationale: “信了他”既可表达相信耶稣，也可在约翰福音语境中承载对他的信靠，且不把原文进一步释义。“信靠了他”较明确地解释信赖意味；“信入他”虽形式上贴近介词 εἰς，却不是普通现代汉语的自然表达，并可能引入特定神学措辞。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。语序将地点成分置于谓语前，以符合汉语习惯；用“就”自然衔接上文。
