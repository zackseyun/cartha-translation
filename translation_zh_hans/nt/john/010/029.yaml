  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: zh_hans
  text: 我父[a]把他们赐给了我；他比一切都大，谁也不能把他们从我父的手中夺走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“我父所赐给我的，比一切都大。”这里的希腊文措辞较难，也有人认为作比较主体的是父所赐给我的，而不是父本人。
    reason: 保留ὃ δέδωκέν μοι在句法与文本理解上的真实歧义。
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: 我的父
  rationale: 采用现代汉语中自然、庄重的称谓，保留耶稣与父的关系，不作额外阐释。
- source_word: ὃ δέδωκέν μοι
  choice: 把他们赐给了我
  rationale: 希腊文中性单数关系代词的句法和文本传承较为复杂；结合前文“羊”的复数指称，以“他们”明确上下文所指。δέδωκεν为完成时，译文以“赐给了”表达已经成就、现仍有效的赐予关系。
- source_word: πάντων μεῖζων
  choice: 比一切都大
  rationale: “一切”保留πάντων范围上的开放性，不限定为所有人或所有事物；“都大”自然表达比较级。
- source_word: οὐδεὶς δύναται
  choice: 谁也不能
  rationale: 简洁而完整地表达没有任何人具备这种能力。
- source_word: ἁρπάζειν
  choice: 夺走
  rationale: 表达强行夺取并使之离开原有保护的含义，也与上一节的语境相衔接。
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: 从父手中
  rationale: 保留“手”的保护、掌管和能力意象，并自然表达ἐκ所指的由内向外夺离。
theological_decisions:
- issue: ὃ δέδωκέν μοι的文本与句法难点
  choice: 正文依上下文将父作为比较主体，并把所赐的人明示为“他们”
  alternative: “我的父所赐给我的，比一切都大”
  rationale: 当前希腊文本的中性单数ὃ可指“所赐之物”，但上下文谈论父赐给子的羊，以及无人能把他们夺走。正文采用较自然、连贯的语义表达，同时用脚注保留较贴近字面的另一种理解，不消除原文真实存在的张力。
- issue: πάντων的比较范围
  choice: 比一切都大
  alternative: 比所有人都大；比万物都大
  rationale: πάντων本身没有在此明确限定为人或事物，因此译文保持宽泛，不将比较范围窄化。
translation_notes:
  register: 采用现代标准汉语，句式清楚而庄重。“赐给”符合上下文中的神圣给予语境；“一切”避免过度限定；“从父手中夺走”保留原文的保护性隐喻。脚注标记[a]已置于相关难点之后。
