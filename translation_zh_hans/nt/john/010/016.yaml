  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: zh_hans
  text: 我还有别的羊，不属于这个羊圈；我也必须把它们领来。它们会听我的声音[a]。于是要成为一群羊，一位牧人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听我的声音”也可译作“听从我的声音”。原文动词既可表示听见，也可表示聆听；在这里的语境中，可能包含听见后作出回应的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文特意区分“羊圈”（αὐλή，围羊的圈舍）和“一群羊”（ποίμνη，羊所组成的群体）。有些译法将末句译作“一个圈”，但“一群羊”更符合这里的原文用词。
    reason: source_distinction
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: 别的羊
  rationale: πρόβατα是“羊”的常用词，并非特指羊羔；ἄλλα表示除当前所指之外另有一些羊。
- source_word: αὐλή
  choice: 羊圈
  rationale: 在牧羊语境中指围住羊的圈舍；译为“羊圈”自然明确，也与后文表示羊群本身的ποίμνη有别。
- source_word: κἀκεῖνα δεῖ με ἀγαγεῖν
  choice: 我也必须把它们领来
  rationale: δεῖ保留“必须”的必要性语气；ἀγαγεῖν既可表达带来，也承接牧人的意象，因此译作“领来”。
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: 它们会听从我的声音
  rationale: ἀκούω可指听见或听从；本段牧人与羊的关系语境包含回应性的聆听。“听从”传达该语用含义，但不把回应方式进一步具体化。
- source_word: γενήσονται μία ποίμνη
  choice: 就会成为一群羊
  rationale: γενήσονται直陈“将成为”，μία ποίμνη指一个统一的羊群，而不是一个圈舍。中文“一群羊”比“一个羊群”更自然。
- source_word: εἷς ποιμήν
  choice: 归一个牧人
  rationale: ποιμήν直译为“牧人”。补出“归”使省略谓语的并列短语在现代汉语中自然，同时表达一群羊由一个牧人带领的关系。
theological_decisions:
- issue: 区分αὐλή与ποίμνη
  choice: 这个羊圈……一群羊
  alternative: 这个圈……一个圈
  rationale: 原文先说羊所在的围圈，后说羊所组成的群体，使用两个不同名词。分别译作“羊圈”和“一群羊”，避免把合一误解成同属一个围圈或制度结构。
- issue: δεῖ所表达的必要性
  choice: 我也必须把它们领来
  alternative: 我也需要把它们领来
  rationale: “必须”保留原文较强的必要性，同时不替原文界定这种必要性的具体神学机制。
- issue: ἀκούω的回应性含义
  choice: 听从我的声音
  alternative: 听见我的声音
  rationale: 约翰福音的牧羊语境不只涉及听觉感知，也涉及羊对牧人声音的识别和回应；“听从”较贴近语境，但“听见”仍是词义上可行的译法，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“羊圈”与“一群羊”清楚保留原文的词汇区别；分句处理使耶稣话语的推进自然。脚注标记置于相关整节末尾，兼注听觉动词的歧义和两个牧羊名词的区别。
