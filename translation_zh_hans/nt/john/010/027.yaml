  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: zh_hans
  text: 我的羊听我的声音；我认识它们，它们也跟随我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: 我的羊
  rationale: 既保留“羊”的牧人隐喻，也自然表达带冠词的所有关系；不额外加上“属于我的”或“我自己的”，以免语气过重。
- source_word: τῆς φωνῆς μου
  choice: 我的声音
  rationale: 在牧人与羊彼此辨认的语境中，“声音”准确而自然，比宽泛的“声响”更合适。
- source_word: ἀκούουσιν
  choice: 听
  rationale: 保留动词的直接意义；现在时在此表达持续、惯常的特征，不必扩译为更强调主观专注的“听从”。
- source_word: κἀγὼ γινώσκω αὐτά
  choice: 我认识它们
  rationale: “认识”既可自然用于辨认对象，也能保留约翰语境中关系性的深度；“它们”照应语法上为中性复数的“羊”。
- source_word: ἀκολουθοῦσίν μοι
  choice: 它们也跟随我
  rationale: “跟随”准确表达门徒式跟从，同时保留牧羊图景；一般现在式体现其持续而典型的行动。
theological_decisions:
- issue: γινώσκω在牧人与羊隐喻中的关系含义
  choice: 译为“认识”，不作扩充
  alternative: “深深认识”“亲自认识”或“认得”
  rationale: “认识”可承载关系性的丰富含义，又不把原文限定为某种特定教义解释；“认得”可能偏弱，而扩译则会增加原文未明说的程度。
- issue: ἀκούουσιν是否包含“听从”的顺服含义
  choice: 译为“听”
  alternative: “听从”或“听见”
  rationale: 上下文可能蕴含回应与顺服，但该动词本身在此不必明确译成“听从”；后面的“跟随我”已经表达回应，因此保留“听”的开放性。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。分号呈现原文三个并列分句之间的层次；第二个“也”使中文衔接顺畅，并表达καί的连接作用。
