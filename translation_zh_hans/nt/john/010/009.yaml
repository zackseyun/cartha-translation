  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: zh_hans
  text: 我就是门[a]。若有人借着我进入，他必得救，也必进出，并且必找到草场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译为“大门”或“门口”。希腊语此词可指门或大门；在本段的牧羊语境中，也可理解为羊圈的入口。
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: 门
  rationale: θύρα可指供人出入的门，也可在牧羊语境中指羊圈的门。“门”既是直接对应，也能自然承载本段的牧羊比喻。
- source_word: δι’ ἐμοῦ
  choice: 从我这里
  rationale: διά加属格表示途径或媒介。“从我这里进去”在现代汉语中自然表达“通过我而进入”，同时保留耶稣是进入途径的含义。
- source_word: ἐάν τις εἰσέλθῃ
  choice: 无论谁……进去
  rationale: ἐάν加虚拟式与不定代词τις构成开放性的条件表达；“无论谁”清楚保留对象不受限定的范围。
- source_word: σωθήσεται
  choice: 必得救
  rationale: σῴζω既可指获救、脱险，也具有救恩含义。“得救”保留《约翰福音》的神学广度，不把它局限为身体安全。
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: 必进出
  rationale: 简洁保留原文“进入和出去”的成对动作意象，不额外解释为自由、安全或日常活动。
- source_word: νομὴν
  choice: 草场
  rationale: νομή指牲畜吃草之处或牧草；“草场”贴合羊群比喻，也符合现代汉语表达。
- source_word: εὑρήσει
  choice: 找到
  rationale: 直接对应εὑρίσκω，保持原句朴素明确的表达。
theological_decisions:
- issue: 牧羊语境中θύρα的比喻译法
  choice: 门
  alternative: 羊圈的门；门口
  rationale: “门”最直接地保留“我就是门”的比喻，也不把原文明确限定为某一种具体建筑结构；注释说明其在本段中可理解为羊圈的门。
- issue: σωθήσεται所指的拯救范围
  choice: 必得救
  alternative: 必获救；必蒙拯救
  rationale: “得救”既允许本段牧羊图像中的保护意味，也保留《约翰福音》较广的救恩意涵，不把经文缩减为仅仅脱离肉身危险，也不加入原文未明说的系统神学限定。
- issue: “进出”的含义
  choice: 保留动作意象，不作解释性扩展
  alternative: 安然进出；自由进出
  rationale: 原文只陈述“进入和出去”。译文不补入“安然”或“自由”，以免消除这一表达可能包含的安全、自由和生活供应等多重联想。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我就是门”保留约翰福音鲜明的“我是”比喻句式；“无论谁”表达开放范围；分号维持“得救”与随后“进出、找到草场”之间既相连又有层次的关系。
