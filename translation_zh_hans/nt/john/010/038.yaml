  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: zh_hans
  text: 但如果我做这些事，即使你们不信我，也要相信这些作为，好让你们得以知道并认识到：父在我里面，我也在父里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιῶ
  choice: 我做了这些事
  rationale: 现在时动词承接上文所说耶稣的作为；中文补出“这些事”使隐含宾语清楚。“做了”在条件句中自然表达这些作为确实发生，并不意在把希腊语现在时改为单纯过去时。
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: 即使你们不信我
  rationale: πιστεύω 加与格 ἐμοί 可指相信某人的话，也可能含相信、信靠某人的意思；“不信我”在中文中保留一定幅度，并与下句“相信这些作为”形成直接对照。
- source_word: τοῖς ἔργοις πιστεύετε
  choice: 要相信这些作为
  rationale: 直译其紧凑结构，表示应接受这些作为所作的见证；不用“信靠这些作为”，以免暗示把信仰对象转向作为本身。
- source_word: ἔργοις
  choice: 作为
  rationale: 约翰常用 ἔργα 指耶稣具有启示意义的所行之事。“作为”比“神迹”少作解释，也比“工作”更符合现代中文语境。
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: 好让你们知道，并且不断认识到
  rationale: 分别体现不定过去时虚拟式 γνῶτε 与现在时虚拟式 γινώσκητε 的体貌差别，表达获得认知及持续认识，同时避免生硬重复“知道”。
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: 父在我里面，我也在父里面
  rationale: 保留重复的 ἐν 和相互内在的关系语言，不以“联合”或后期教义术语代替。
- source_word: πατήρ
  choice: 父
  rationale: 原文是带冠词的“父”，并非“我的父”；中文约翰文献语境中“父”自然且准确。
theological_decisions:
- issue: 父与子的相互内在
  choice: 父在我里面，我也在父里面
  alternative: 父与我联合，我也与父联合
  rationale: 直译保留约翰文本强烈而含蓄的关系性陈述及其神学张力，不用后来的教义表述来消解或限定其意义。
- issue: 两个“认识”动词的体貌关系
  choice: 知道，并且不断认识到
  alternative: 开始知道并明白
  rationale: 原文并列同一词根的两种动词形式；译文尽量呈现从认知到持续认识的进展，但不把第二个动词另释为“理解”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“作为”保留约翰福音的关键词特色；“在……里面”有意保持原文的关系性意象。脚注仅说明此处抄本与动词形式所带来的翻译差异。
