  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: zh_hans
  text: 另一些人却说：“这不是被鬼附的人所说的话。鬼难道能使瞎子的眼睛睁开吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: 另一些人
  rationale: 与上一节持相反意见的人形成对照；“另一些人”在现代汉语中自然清楚。
- source_word: ἔλεγον
  choice: 却说
  rationale: 未完成时可表示当时持续或反复的言说；汉语不宜机械添加“不断”，结合群体争论的语境，以“说”自然表达，并用“却”凸显对比。
- source_word: Ταῦτα τὰ ῥήματα
  choice: 这话
  rationale: 指耶稣所说的一番话；现代汉语中“这话”比“这些言语”更自然，同时保留言语内容的指向。
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: 不像是被鬼附的人说的
  rationale: 希腊文以属格分词说明这些话不属于或不出自被鬼附的人；译文明确隐含的言说来源，又以“不像是”自然传达对话语特征的判断。
- source_word: μὴ
  choice: 难道……吗
  rationale: μή引出预期否定回答的反问；“难道……吗”准确表达这种修辞力量。
- source_word: δαιμόνιον
  choice: 鬼
  rationale: 在本段语境中直接指邪灵；“鬼”与“被鬼附”搭配自然，也是普通现代读者熟悉的圣经用语。
- source_word: δύναται
  choice: 能
  rationale: 与反问结构“难道……能……吗”结合，表达说话者认为答案是否定的，而不把问句改成直陈句。
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: 瞎子的眼睛
  rationale: 保留希腊文具体的“眼睛”意象，并呼应第九章生来瞎眼之人的医治；“瞎子”简洁自然。
- source_word: ἀνοῖξαι
  choice: 使……睁开
  rationale: 原义为“打开”；汉语说眼睛时用“使……睁开”自然，也保留具体意象，避免解释性地改为“使人重见光明”。
theological_decisions:
- issue: δαιμονίζομαι与δαιμόνιον的表达
  choice: 被鬼附的人／鬼
  alternative: 受邪灵控制的人／邪灵
  rationale: 保留经文关于鬼魔作用的直接表述，同时不进一步界定“附”所涉及的机制或程度，避免加入系统神学上的技术性区分。
- issue: μή所引反问的语气
  choice: 鬼难道能使瞎子的眼睛睁开吗？
  alternative: 鬼不能使瞎子的眼睛睁开，不是吗？
  rationale: “难道……吗”自然表达预期否定答案，同时保留原文的问句形式和群众推理中的张力。
- issue: οὐκ ἔστιν δαιμονιζομένου的归属含义
  choice: 这话不像是被鬼附的人说的
  alternative: 这话不是出于被鬼附的人
  rationale: 属格结构可理解为这些话不属于、也不像出自这样的人。正文采用自然汉语表达其话语特征判断，不将其扩展为对耶稣身份的明确神学结论。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对话体。“另一些人却说”清楚承接上一节的分歧；反问保持群众基于耶稣言语和医治行为所作判断的力度。无需脚注，因为主要词义与句法可在正文中自然呈现，且没有必须标出的实质性文本异文。
