  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: zh_hans
  text: 父所分别为圣[a]、又差到世上来的那一位，难道你们因为我说‘我是上帝的儿子’，就对他说：‘你是在亵渎！’吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”也可译作“奉献为圣”或“分别出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: 分别为圣
  rationale: ἁγιάζω可指使之归圣、奉献或分别出来归于神。这里“分别为圣”既保留“圣”的词义联系，也符合父差遣子进入世界的使命语境，并避免暗示道德上的改进。
- source_word: ἀπέστειλεν
  choice: 差到
  rationale: ἀποστέλλω的基本义是“差遣”。在“进入世界”的方向结构中译作“差到世上来”，自然地保留约翰福音常见的差遣主题，不扩译为“委任”。
- source_word: κόσμον
  choice: 世界
  rationale: κόσμος在约翰福音中通常译作“世界”，既可指人类所处的世界，也常带有约翰著作中的神学意涵；此处无需进一步限定。
- source_word: Βλασφημεῖς
  choice: 你说了亵渎的话
  rationale: 该表达直陈对方正在亵渎。现代汉语用“说了亵渎的话”较自然，同时不擅自补明亵渎的对象。
- source_word: Υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 该谓语性名词短语表达耶稣与上帝的儿子关系。在汉语中“上帝的儿子”自然、庄重，也保留其在亵渎指控语境中的基督论分量，不额外加入原文没有的定冠词形式。
- source_word: ὃν ὁ πατὴρ
  choice: 父所……的那一位
  rationale: 用“父所……的那一位”保留关系从句结构，并清楚表明两个动词“分别为圣”和“差遣”的共同受事。
- source_word: ὅτι ... ὅτι
  choice: 说……因为
  rationale: 第一个ὅτι引出“你们说”的直接引语，第二个ὅτι说明指控的缘由。汉语调整为“因为我说……，你们就……说”，使逻辑清楚而不改变论证关系。
theological_decisions:
- issue: 父对子的ἡγίασεν应如何表达
  choice: 分别为圣
  alternative: 使他成圣；将他分别出来
  rationale: “分别为圣”保留圣洁与奉献归属的词义，并与随后的差遣相连；它不把经文解释为子原先不圣洁，也不消除该词可译为“成圣”或“奉献”的张力。脚注列出主要词义可能。
- issue: Υἱὸς τοῦ θεοῦ的基督论分量
  choice: 上帝的儿子
  alternative: 上帝之子
  rationale: “上帝的儿子”是普通现代读者易懂而庄重的表达，保留其在本段亵渎指控中的重要身份宣称，同时不把后期教义术语额外写入经文。
- issue: 亵渎指控的对象
  choice: 你说了亵渎的话
  alternative: 你亵渎了上帝
  rationale: 原文Βλασφημεῖς本身没有明说宾语；虽然语境明显涉及对上帝的亵渎，正文仍不补出“上帝”，以保留原文表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“父”作为本段对上帝的称谓；用“那一位”承接关系从句，以避免生硬。外层用“我”、引语内用“你”，保留原文从耶稣自称转入对手指控原话的人称变化。
