  naturalness: 原译通顺；修订后的“他又离去，渡过约旦河，来到……，并停留在那里”在现代标准汉语中自然、庄重，且较少把停留解释为居住。
  terminology: “约旦河”“约翰”“施洗”均符合通行圣经汉语用语。“起初施洗”恰当地表达τὸ πρῶτον与持续性分词βαπτίζων所指的约翰早期施洗活动。
