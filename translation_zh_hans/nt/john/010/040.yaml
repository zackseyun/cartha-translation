  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: zh_hans
  text: 他又离去，渡过约旦河，来到约翰起初施洗的地方，并停留在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 离开那里
  rationale: 该动词表示从当时所在之处离去；补出语境所含的“那里”，使现代汉语自然，同时保留离开的含义。
- source_word: πάλιν
  choice: 又
  rationale: 直接表达动作再次发生，在本句中比“再次”更自然。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 渡过约旦河
  rationale: πέραν加属格指约旦河另一边；结合表示前往目的地的句法，用“渡过”自然呈现跨河而往的移动，不把方向具体化为东岸或西岸。
- source_word: εἰς τὸν τόπον
  choice: 来到……地方
  rationale: εἰς表示朝向目的地的移动；“来到……地方”符合现代汉语叙事习惯。
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: 约翰起初施洗的地方
  rationale: 以紧凑的定语结构表达约翰先前在那里持续施洗；“起初”对应τὸ πρῶτον，并不额外断定这是约翰第一次给任何人施洗。
- source_word: βαπτίζων
  choice: 施洗
  rationale: 约翰福音语境中的惯用宗教表达，准确传达βαπτίζω的动作。
- source_word: ἔμεινεν ἐκεῖ
  choice: 住在那里
  rationale: μένω在此表示停留、居住一段时间；“住在那里”自然简明，未规定停留时长。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句首用“他”承接上文所指的耶稣，不在本节额外补出姓名。“渡过约旦河”保留到河对岸的地理含义，也避免采用现代汉语中稍显含混的“约旦河外”。
