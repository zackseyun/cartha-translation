id: JHN.10.10
reference: John 10:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: zh_hans
  text: 贼来，无非是要偷窃、宰杀、毁灭[a]；我来，是要使他们有生命，而且有丰盛的生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宰杀”也可译作“杀死”。希腊语动词 θύσῃ 常指宰杀牲畜，与本段羊群的图景相合。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“而且充充足足地得着生命”或“而且得着满盈的生命”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: 贼
  rationale: 定冠词配合单数名词，指耶稣牧羊比喻中作为代表性形象的“贼”；汉语用“贼”即可自然表达这种泛指而明确的角色。
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: 来，无非是要
  rationale: 这一排他性结构表明其来意仅限于后列目的。“无非是要”既自然，也保留“不是为别的缘故”的强调。
- source_word: ἵνα κλέψῃ
  choice: 要偷窃
  rationale: 用“要”引出目的，与前面的排他结构衔接，并准确表达偷取之意。
- source_word: θύσῃ
  choice: 宰杀
  rationale: θύω常用于宰杀动物；上下文是羊与牧人的图景，因此“宰杀”比泛称的“杀死”更贴切，同时在脚注保留另一译法。
- source_word: ἀπολέσῃ
  choice: 毁灭
  rationale: 与“偷窃、宰杀”并列，表达彻底破坏或使之灭亡，而不擅自限定毁灭的方式或对象。
- source_word: ἐγὼ ἦλθον
  choice: 我来
  rationale: 汉语以“我来”自然表达耶稣来到世上的使命，并与“贼来”形成鲜明对照；无需机械标示希腊语不定过去时。
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: 是要使他们有生命
  rationale: 保留目的关系，并将约翰著作中的关键用语 ζωή直译为“生命”，不擅自加上“永恒”等限定。
- source_word: περισσὸν ἔχωσιν
  choice: 而且有丰盛的生命
  rationale: περισσόν在这里表达拥有生命的丰盛程度。汉语将其自然地落实为“丰盛的生命”，既清楚承接前句，也不引入物质富足的含义。
theological_decisions:
- issue: 约翰语境中 ζωή 的范围
  choice: 生命
  alternative: 永生；真正的生命
  rationale: 本节只有 ζωή，并无“永恒的”这一修饰语。译作“生命”可保留约翰用语的神学深度与开放性，不把经文未明说的限定写入正文。
- issue: περισσόν 所表达的丰盛
  choice: 丰盛的生命
  alternative: 充充足足地得着生命；得着满盈的生命
  rationale: 该词强调耶稣所赐生命的充盈与丰足，不应扩写成物质兴旺或今世成功。正文采用自然汉语表达其程度，脚注提示其他可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“偷窃、宰杀、毁灭”保留原文三个并列动词的力度；以“生命”维持约翰用语的简洁和神学张力。“丰盛的生命”表达程度上的充盈，避免使读者误解为物质繁荣。
