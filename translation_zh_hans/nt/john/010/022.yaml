  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: zh_hans
  text: 那时，耶路撒冷举行修殿节[a]；正是冬天，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 又称“哈努卡节”，是犹太人纪念圣殿重新奉献的节期。
    reason: 文化背景说明
lexical_decisions:
- source_word: Ἐγένετο
  choice: 正值
  rationale: 这里的 γίνομαι 表示节期在当时来到或举行；结合时间和地点表达为“正值”，既自然，又保留事件发生的意味。
- source_word: τότε
  choice: 那时
  rationale: τότε 标示叙事中的时间转换；“那时”简洁、自然，符合现代汉语叙事习惯。
- source_word: τὰ ἐγκαίνια
  choice: 修殿节
  rationale: ἐγκαίνια 指纪念圣殿重新奉献的节期。“修殿节”是简明且为汉语读者较熟悉的名称，也体现重新奉献圣殿的历史背景。
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: 耶路撒冷
  rationale: 原文为地点短语。汉语用“耶路撒冷正值……”即可自然表达“在耶路撒冷”，无需机械添加介词。
- source_word: χειμὼν ἦν
  choice: 当时是冬天
  rationale: 直截了当地保留原文独立的季节说明；补出“当时”使汉语衔接自然，而不增加解释。
theological_decisions:
- issue: τὰ ἐγκαίνια 所指节期的名称
  choice: 正文译作“修殿节”
  alternative: 哈努卡节；献殿节
  rationale: 正文翻译希腊词所表达的圣殿重新奉献之节，避免只采用音译名称而使普通读者不明其义；通行名称“哈努卡节”及其历史意义放入脚注说明。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“正值”避免把耶路撒冷拟作主动举办者；末尾保留逗号，以衔接下一节的叙事。
