  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: zh_hans
  text: 耶稣对他们讲了这个比喻[a]，但他们不明白他对他们所讲的话是什么意思。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“譬喻”、“比方”或“格言”。希腊语这个词可泛指比喻性的说法；这里指耶稣前面所讲的关于牧羊人的一段非字面的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: 比喻
  rationale: 该词可泛指含有比喻意味、需要领会的说法，在此指前面的牧羊人话语。“比喻”自然庄重，又不将其严格限定为符类福音中的技术性“寓言”。脚注保留“譬喻、格言”等可能。
- source_word: εἶπεν
  choice: 讲了
  rationale: 与宾语“这个比喻”搭配自然，表达耶稣向他们讲说这番话。
- source_word: ἐκεῖνοι δὲ
  choice: 但他们
  rationale: 以“但”体现δέ在此处的转折，并用“他们”自然指回听众。
- source_word: οὐκ ἔγνωσαν
  choice: 不明白
  rationale: 语境所指不是缺乏事实知识，而是未能领会耶稣比喻性话语的含义。
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: 他对他们所讲的是什么意思
  rationale: 希腊文直译较生硬，近于“他对他们所讲的那些是什么”；此译明确传达听众未领会话语含义，同时保留末尾“对他们”的结构要素。
theological_decisions: []
translation_notes:
