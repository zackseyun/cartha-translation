  text: because he is a hired hand and does not care about the sheep.
translation:
  language: zh_hans
  text: 因为他是雇工，并不关心羊群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 这里说明上一句中雇工逃跑的原因；“因为”自然、明确地表达因果关系。
- source_word: μισθωτός
  choice: 雇工
  rationale: 指受雇取酬、并非羊群主人的劳动者；“雇工”是现代汉语中简洁自然的表达，也符合牧羊语境。
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: 并不在意
  rationale: 该非人称结构表达对某人或某事缺乏关心；“并不在意”保留了原文的道德力度，同时符合现代汉语习惯。
- source_word: τῶν προβάτων
  choice: 羊群
  rationale: πρόβατα为复数，指众羊；汉语在牧养语境中用“羊群”更自然，并保留核心的牧羊意象。
theological_decisions:
- issue: 雇工与好牧人的对比
  choice: 按经文直接陈述雇工不关心羊群，不进一步指明他象征哪一类人。
  alternative: 把雇工明确解释为某一特定类别的假领袖，或把这种对比淡化为一般的职业疏离。
  rationale: 本节只说明他逃跑的原因在于他是雇工，并不在意羊群。译文应保留与好牧人的伦理对比，却不加入经文本身没有明说的身份或教义结论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“雇工”简明贴合语境；“并不在意羊群”直接表达其缺乏关切，句式顺畅。
