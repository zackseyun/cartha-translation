  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: zh_hans
  text: 因这些话[a]，犹太人中间又起了纷争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可按语境理解为“犹太地区的人”；在约翰福音的某些语境中，这个词特指“犹太人的领袖”。这里沿用希腊文较直接的表达，但不一定泛指全体犹太人。
    reason: 说明Ἰουδαῖοι的语义范围及语境差异，避免把经文误读为对整个族群的概括。
lexical_decisions:
- source_word: Σχίσμα
  choice: 纷争
  rationale: 该词本义为裂开、分裂；这里指众人因耶稣的话产生对立反应。“纷争”在现代汉语中自然，并保留群体分裂之意。
- source_word: πάλιν
  choice: 又
  rationale: 表示同类情形再次发生；“又”简洁自然，呼应约翰福音此前记载的分裂。
- source_word: ἐγένετο
  choice: 起了
  rationale: γίνομαι在此表示一种局面出现；“起了纷争”是自然的现代汉语搭配，并保留事件发生的动态含义。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: 犹太人中间
  rationale: 直接保留希腊文的群体称谓，同时以脚注说明Ἰουδαῖοι在约翰福音中须按语境理解，不一定泛指全体犹太人。
- source_word: διὰ
  choice: 因
  rationale: διά接宾格在此表达原因；“因”准确、简洁而庄重。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 指耶稣前面所说的话；这一译法清楚自然，不添加“教训”或“宣告”等解释。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，并加脚注说明其语境性
  alternative: 译作“犹太地区的人”或“犹太人的领袖”
  rationale: 希腊文在此没有明说是领袖，也未明确限定为犹太地区居民，因此正文保留较直接的译法；脚注则防止读者误以为这是对所有犹太人的笼统概括。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“因这些话”前置以突出纷争的原因；“又起了纷争”符合普通读者的自然表达。
