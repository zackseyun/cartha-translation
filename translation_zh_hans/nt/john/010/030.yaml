  text: I and the Father are one[a].
translation:
  language: zh_hans
  text: 我和父是一[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“一”是中性单数，所表达的是合一，并未把耶稣和父称为同一位格；“是”在原文中为复数形式。
    reason: 说明中性ἕν与复数ἐσμεν所保留的合一与区别。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 希腊文明确使用第一人称单数代词，并置于句首；译出“我”可保留其明确而略带强调的主语作用。
- source_word: καὶ
  choice: 与
  rationale: 连接“我”和“父”两个并列主语；“与”在此庄重自然，不增添原文没有的含义。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 约翰福音语境中指耶稣的父；现代汉语圣经语体用“父”可表达这一称谓，且无需添加原文没有的修饰。
- source_word: ἕν
  choice: 一
  rationale: 原词为中性单数，直接译作“一”，既保留真实的合一陈述，也不把耶稣与父说成同一个位格。
- source_word: ἐσμεν
  choice: 原为
  rationale: 这是第一人称复数现在时系词。汉语“原为一”自然、庄重，其中“为”表达系词关系；复数主语“我与父”仍保留二者的区别。“原”按现代汉语惯用结构加强断言，不表示过去时间。
theological_decisions:
- issue: 中性单数ἕν与复数ἐσμεν共同构成的基督论陈述
  choice: 译作“我与父原为一”，断言耶稣与父真实为一，同时借并列主语和原文复数动词所表达的关系保留二者的区别。
  alternative: “我与父合而为一”；“我与父是同一个”；“我与父同心合意”
  rationale: “合而为一”可能暗示原先分离后才结合；“是同一个”容易把二者等同为同一位格；“同心合意”则把原文较强的“一”削弱为意见或行动一致。简洁的“一”最能保留原文的含义张力，不以较后的神学术语替代经文本身。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“我与父原为一”保留传统经文语感；脚注明示希腊文在汉语中无法直接呈现的性与数信息。
