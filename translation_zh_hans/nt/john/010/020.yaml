  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: zh_hans
  text: 但他们中有许多人说：“他被鬼附身，又疯了，为什么听他呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示当时持续或反复的言说；现代汉语在此用“说”即可自然呈现叙事场景，无须生硬增译“不断地说”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并表达对比，译作“但”符合此处的转折作用。
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: 他们中有许多人
  rationale: 准确保留部分结构，表明说这话的是群体中的许多人，而不是所有人。
- source_word: Δαιμόνιον ἔχει
  choice: 他有鬼附身
  rationale: “有鬼附身”既保留“有鬼”的源语结构，也用现代汉语清楚表达其敌对指控，且不额外界定其具体状态。
- source_word: μαίνεται
  choice: 疯了
  rationale: 简明自然地表达精神失常、癫狂之意；这是叙事人物的诋毁性判断，并非经文作出的临床诊断。
- source_word: τί αὐτοῦ ἀκούετε;
  choice: 为什么还听他呢？
  rationale: τί在这里按语境表示“为什么”；ἀκούω接属格在此意为听从或听某人说话。“还”自然传达质问语气，但不改变命题内容。
theological_decisions:
- issue: 如何翻译敌对者对耶稣的指控
  choice: 他有鬼附身，并且疯了
  alternative: 他被鬼附了，发疯了
  rationale: 采用直接、清楚的措辞保留诋毁的尖锐性，不淡化指控，也不将其转化为经文认可的事实或加入额外的教义解释。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“疯了”用于直接引语，符合敌对者粗厉的语气；全句不使用脚注，因为中文正文已能兼顾源语形式与自然表达。
