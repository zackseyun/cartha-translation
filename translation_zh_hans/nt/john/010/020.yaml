  rationale: 修正不自然的“有鬼附身”，以自然且忠实的“被鬼附身”表达敌对者的指控，并以脚注保留字面替代译法。删除“还”，避免添加原文未明示的时间或持续含义。其余部分保留原稿对部分结构、转折和质问语气的准确处理。
