base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: zh_hans
  text: “我是好牧人[a]；好牧人为羊舍命[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好”也可译为“高尚的”或“典范的”；希腊语 καλός 可指美善、高尚、优秀或堪为典范。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“放下自己的生命”；这是指甘愿舍弃自己的性命。
    reason: lexical_alternative
  - marker: c
    text: “为羊”也可译为“为羊的缘故”或“为了羊的益处”；这里的希腊语介词可表达为羊而行及使羊受益的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 采用现代汉语自然的判断句；不额外强化为“我自己就是”，也不在译文中明定其是否暗指神名。
- source_word: ποιμήν
  choice: 牧人
  rationale: 直接保留牧羊的语境和比喻；“牧师”会引入本节并未明说的后世教会职分含义。
- source_word: καλός
  choice: 好
  rationale: “好牧人”自然、庄重且为读者熟悉，同时可涵盖美善、高尚、称职和典范等语义色彩；其他可能含义在脚注说明。
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: 舍命
  rationale: 这是自然、凝练的现代汉语表达，准确传达该希腊语组合中甘愿付出生命的意思，避免把 ψυχή 误解为与身体相对的“灵魂”。
- source_word: ὑπὲρ τῶν προβάτων
  choice: 是为了羊
  rationale: 表达 ὑπέρ 的受益、为其缘故之意，同时不把该介词限定为某一种特定的赎罪理论。
- source_word: τῶν προβάτων
  choice: 羊
  rationale: 原文有定冠词但没有物主代词；汉语类指名词自然不必加“这些”或“他的”，因此不增添原文未明说的所属关系。
theological_decisions:
- issue: Ἐγώ εἰμι 的强调及可能的神名回响
  choice: 译作“我是”，不作神学性扩译
  alternative: “我自己就是”或以特殊措辞明确暗指神名
  rationale: 本句在语法上是带表语的自我宣告。约翰福音整体可能使读者听出更深回响，但本节不足以要求在正文中明确化。
- issue: καλός 在牧人称号中的含义
  choice: “好牧人”
  alternative: “高尚的牧人”或“典范的牧人”
  rationale: “好”保留了 καλός 的宽广语义和经文形象，不把它缩窄为单一的道德品质或角色理想。
- issue: ὑπέρ 与耶稣之死的关系
  choice: “为了羊”
  alternative: “代表羊”或“为羊的缘故”
  rationale: 保留受益、代表和为其缘故等可能色彩，不借翻译本身确立本节没有详细阐明的特定赎罪机制。
- issue: τίθησιν 的现在时体
  choice: 以一般陈述“舍命”呈现
  alternative: “将要舍命”
  rationale: 原文使用现在时，在此描述好牧人的典型行动，并指向耶稣主动献出生命；不宜擅自改成只表将来的预言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好牧人”和“舍命”简洁有力，保留原文重复“好牧人”的修辞。正文将“舍命”与“为了羊”分别标注脚注，以清楚对应希腊语习语和介词的语义范围。
