  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: zh_hans
  text: 守门人给他开门，羊听他的声音；他逐一叫自己的羊的名字，并领它们出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领出去”也可译作“带出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: 给他
  rationale: 指向前文的牧人；与“开门”搭配时，“给他开门”是自然现代汉语，并保留人称指向。
- source_word: ὁ θυρωρός
  choice: 看门的
  rationale: 准确表达守门并开门之人，符合羊圈场景，也比“门卫”更贴近叙事语域。
- source_word: ἀνοίγει
  choice: 开门
  rationale: 希腊文直译为“打开”；汉语需要补出语境中明确的宾语“门”，表达自然。
- source_word: τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει
  choice: 羊也听他的声音
  rationale: ἀκούω 后接属格，表示听见或听从其声音；正文保留较宽泛的“听”，不把辨认、顺从等含义写死。中性复数主语配单数动词是希腊语常见现象，汉语无需体现数的一致变化。
- source_word: τὰ ἴδια πρόβατα
  choice: 自己的羊
  rationale: 保留 ἴδια 所强调的归属和特别关系，现代汉语简洁自然。
- source_word: φωνεῖ κατ’ ὄνομα
  choice: 按名字呼唤
  rationale: 表达逐一叫出名字的意思；“呼唤”符合牧人召羊的场景，又不额外解释其效果。
- source_word: ἐξάγει αὐτά
  choice: 把它们领出去
  rationale: ἐξάγω 可指带出或领出；牧羊语境中“领出去”自然体现引导，同时用脚注保留较中性的词义可能。
theological_decisions:
- issue: 牧人意象中的身份与行动主体
  choice: 按比喻本身译为看门者给“他”开门、羊听他的声音、他呼唤并领出自己的羊。
  alternative: 在本节正文中明确把“他”译作耶稣，或加入羊辨认、顺服牧人的解释。
  rationale: 原文在此延续牧人与羊的意象，并未在本句直接点明耶稣；译文不提前解开比喻，也不把“听”的神学效果具体化，从而保留篇章中的张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事汉语。“看门的”贴合羊圈场景；分成两句以避免中文长串并列显得拖沓。脚注标记置于相关短语之后。
