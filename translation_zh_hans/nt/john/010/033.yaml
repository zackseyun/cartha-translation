  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: zh_hans
  text: 犹太人回答他说：“我们不是因为你所做的善事用石头打你，而是因为你亵渎上帝，又因为你是人，却把自己当作上帝[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把自己当作上帝”或译“把自己当作一个神”。希腊文“神”没有冠词，但在本节亵渎的指控和语境中，最可能是指“上帝”。
    reason: 保留θεόν无冠词所容许的另一种译法，同时说明正文选择的语境依据。
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 直译该词并保留《约翰福音》的用语。此处具体指在圣殿中敌对耶稣的那群犹太人；译作“犹太领袖”会把原文未明确限定的范围收窄。
- source_word: Περὶ καλοῦ ἔργου
  choice: 因为你做了善事
  rationale: περί加属格在这里表示原因或所针对的事；此译自然表达其因果含义，并保留ἔργου的单数概念。
- source_word: λιθάζομέν
  choice: 要用石头打
  rationale: 结合上一节他们拿起石头的即时语境，表达正在采取或意图采取的行动；现代汉语中比“正在用石头打”更符合尚在对话中的场景。
- source_word: βλασφημίας
  choice: 说了亵渎的话
  rationale: βλασφημία在这里指对上帝的亵渎；加入“说了……的话”使抽象名词在现代汉语中自然清楚，同时不改变指控性质。
- source_word: ἄνθρωπος ὢν
  choice: 明明是人
  rationale: 以自然汉语传达分词结构的让步意味，以及控告者所强调的人与上帝之间的反差。
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: 把自己当作上帝
  rationale: ποιέω加反身宾语和表语宾格表示使自己成为、把自己说成或视为某种身份。这里的亵渎指控支持“上帝”，而“当作”不替控告者判定耶稣实际身份。
theological_decisions:
- issue: 指控中θεόν的译法
  choice: 上帝
  alternative: 一个神
  rationale: θεόν虽无冠词，孤立看可有定性或非定指理解，但在犹太一神信仰背景及本节“亵渎”的指控中，最可能是指以色列的上帝。正文采用“上帝”，同时用脚注保留语法上可能的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“用石头打”比书面化的“用石头击打”自然；“明明是人，却……”清楚传达控告者话中的让步和反差。脚注标记置于整句引语之后。
