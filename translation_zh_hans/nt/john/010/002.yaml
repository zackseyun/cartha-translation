  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: zh_hans
  text: 但从门进去的，是羊的牧人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是羊的一位牧人。”希腊文“牧人”前没有冠词，但上下文倾向于确定的含义，即与非法闯入者相对的正当牧人。
    reason: 词义与确定性存在可保留的另一种理解。
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: 但……进去的
  rationale: 带冠词的现在分词在此作名词用，指“进去的人”；δέ承接上一节，表示与盗贼、强盗相对的转折，因此译作“但”。中文用“……的”结构自然保留其概括性。
- source_word: διὰ τῆς θύρας
  choice: 从门进去
  rationale: διά接属格表示穿过、经由；现代汉语描述进入路径时，“从门进去”比“通过门”更自然，同时保留空间意象。
- source_word: ποιμήν
  choice: 才是……牧人
  rationale: ποιμήν虽无冠词，但在表语位置不定性仍有歧义。上下文强调按正当途径进入者与非法闯入者的对比；“才是”体现这种识别和对比，却不在汉语中生硬添加量词。
- source_word: τῶν προβάτων
  choice: 羊的
  rationale: 保留πρόβατα“羊”的具体意象，不改译为较具集合解释的“羊群”。
theological_decisions:
- issue: 表语ποιμήν是否确定
  choice: 译为“才是羊的牧人”
  alternative: “是羊的一个牧人”或“是牧羊人”
  rationale: 希腊文表语名词没有冠词，形式上可作不定理解；但上一节与本节的对比更倾向于识别合法、真正的牧人。正文用“才是”传达语篇上的确定和正当性，脚注保留不定理解，且不把此处的比喻提前限定为某种后来的基督论解释。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“从门进去”符合自然汉语；“才是”明确承接上一节的对比。脚注标记已在正文中以[a]出现。
