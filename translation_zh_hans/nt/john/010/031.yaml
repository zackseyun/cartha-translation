base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: zh_hans
  text: 于是，犹太人又拿起石头来，要用石头打他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可按语境理解为“犹太地区的人”，或特指反对耶稣的某些犹太人、犹太领袖。在约翰福音中，这个称呼有时指特定的反对者，并非泛指全体犹太人。
    reason: 说明οἱ Ἰουδαῖοι在约翰福音中的语境性范围，并保留“犹太地区的人”和“犹太领袖”的可能理解，避免将本处误解为泛指整个犹太民族。
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: 拿起
  rationale: βαστάζω可指“拿起、搬起、携带”；与“石头”及随后的敌对意图连用时，“拿起”自然地表达把石头拿在手中准备使用。
- source_word: οὖν
  choice: 于是
  rationale: οὖν承接上文并引出由耶稣的话触发的反应；“于是”符合现代汉语叙事，也保留前后逻辑联系。
- source_word: πάλιν
  choice: 又
  rationale: πάλιν表示动作再次发生；“又”简洁自然，并与约翰福音前文类似的敌对行动相呼应。
- source_word: λίθους
  choice: 石头
  rationale: λίθος直指石头；不在名词本身加入未明说的解释。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 这是希腊文最直接的对应。约翰福音中该称呼在具体语境里常指反对耶稣的某些犹太人，而非全体犹太民族，因此正文保持原文措辞，脚注说明其可能范围。
- source_word: ἵνα
  choice: 要
  rationale: ἵνα加虚拟式在这里表达目的；汉语用“要……”自然地表明他们拿石头的意图。
- source_word: λιθάσωσιν
  choice: 用石头打死
  rationale: λιθάζω指以投石方式攻击，语境中带有致死意图。现代汉语“用石头打死”比单说“用石头打”更清楚，也比生硬的“石刑处死”少加制度性含义。
- source_word: αὐτόν
  choice: 他
  rationale: 宾格代词指耶稣，译作“他”准确自然。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι的所指范围
  choice: 正文译作“犹太人”，并用脚注说明在本语境中可能特指反对耶稣的犹太人或犹太领袖。
  alternative: 正文直接译作“犹太领袖”或“犹太地区的人”。
  rationale: 原文没有明说“领袖”，因此正文不宜擅自缩小范围；但约翰的用法常受具体叙事情境限定，脚注可避免读者误以为此处指所有犹太人，同时保留原文的概括表达及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……又……”清楚承接上文；“拿起石头来，要用石头打死他”符合自然汉语，同时保留原文的动作、重复和目的关系。
