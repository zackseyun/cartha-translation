  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: zh_hans
  text: 那雇工不是牧人，羊也不属于他；他看见狼来了，就撇下羊[a]逃走——狼便夺走羊，把它们驱散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开羊。”这里的“撇下”也可含有在危险中弃羊不顾的意味。
    reason: 词义兼具较中性的“离开”和语境中较强的“弃置不顾”之意。
lexical_decisions:
- source_word: μισθωτός
  choice: 受雇的人
  rationale: 指为工资而工作的人；“受雇的人”是自然、现代的中文，也保留了他与真正牧人的对比。
- source_word: οὐκ ὢν ποιμήν
  choice: 不是牧人
  rationale: 把希腊文分词结构自然地译成谓语，清楚保留其断言：此人并非牧人。
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: 羊也不是他自己的
  rationale: 保留ἴδια所表达的归属关系，并与前句顺畅衔接。
- source_word: θεωρεῖ
  choice: 看见
  rationale: 在本语境中表示察觉逼近的危险；“看见”准确而不过度诠释。
- source_word: τὸν λύκον ἐρχόμενον
  choice: 狼来了
  rationale: 自然呈现宾语加分词结构所描写的动态场景。
- source_word: ἀφίησιν
  choice: 撇下
  rationale: 此处不仅指离开，也因危险临近而带有弃置不顾的意味；“撇下”兼顾词义和语境。
- source_word: φεύγει
  choice: 逃走
  rationale: 简洁、自然地表达因危险而逃离。
- source_word: ἁρπάζει
  choice: 抓住
  rationale: 表达狼猛烈地夺取、捕捉羊；“抓住”在现代中文中清楚自然，且不额外指定叼走或杀死。
- source_word: σκορπίζει
  choice: 把它们驱散
  rationale: 补出由上下文明确的宾语，并以“驱散”表达羊因狼袭击而四散。
- source_word: πρόβατα
  choice: 羊
  rationale: 保留具体的复数羊群意象，不用抽象或解释性的称谓取代。
theological_decisions:
- issue: 牧人与受雇者意象的隐喻作用
  choice: 保留“牧人”“受雇的人”等牧羊场景中的实际称谓，不在正文中解释其所指。
  alternative: 改用“领袖”“看护者”等解释性称谓。
  rationale: 约翰福音第10章采用持续的牧羊隐喻；保留原有意象，可避免把特定解释加入译文。
- issue: ἀφίησιν所含责任意味的强弱
  choice: 正文译为“撇下”，并用脚注提示较中性的“离开”。
  alternative: 正文译为“离开”，脚注说明也可理解为“撇下、弃置不顾”。
  rationale: 危险临近以及随后的逃走使本词在此处带有弃羊不顾的语境意味；“撇下”自然传达这一点，同时脚注保留其较宽的词义范围。
translation_notes:
  register: 采用现代、庄重而通俗的叙述语体。分号呈现人物身份与行动之间的推进关系，破折号保留原文后半句突转到狼之行动的戏剧性。脚注标记紧接“羊”，指向整个“撇下羊”这一表达。
