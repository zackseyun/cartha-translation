  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: zh_hans
  text: 当他把自己所有的羊都带出来[a]，就走在羊前面；羊跟随他，因为认得他的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都赶出来”或“都领出来”；希腊文这个动词可指从圈里赶出或带出。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……以后
  rationale: ὅταν与不定过去时虚拟语气构成时间从句，表达在动作完成之时；用“……以后”自然体现先带出、后走在前面的次序，同时保留泛指场景。
- source_word: τὰ ἴδια πάντα
  choice: 所有属自己的
  rationale: 保留希腊文中性复数“属于他自己的（所有）”的表达，不在此处提前补出“羊”；上下文已清楚说明所指。
- source_word: ἐκβάλῃ
  choice: 带出来
  rationale: ἐκβάλλω含有使之从里面出去的意思，也可带“赶出”的力度；牧羊语境中“带出来”自然且不显得敌意，但以脚注保留“赶出来”的词义可能。
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: 走在它们前面
  rationale: 准确呈现牧人位于羊群前方行走、引领的空间画面；“走在……前面”是现代汉语自然表达。
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: 羊也跟着他
  rationale: ἀκολουθέω加与格宾语表示跟随某人；“跟着他”简洁自然。“也”衔接牧人先行与羊群随后的动作。
- source_word: οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: 认得他的声音
  rationale: οἶδα基本义为“知道、认识”；在辨识牧人声音的语境中，“认得”比单纯“知道”更符合现代汉语，同时保留熟悉和识别的含义。
theological_decisions:
- issue: 牧羊意象中ἐκβάλῃ的力度
  choice: 译作“带出来”，并用脚注注明“赶出来”的可能
  alternative: 赶出来；领出来
  rationale: 本节描写牧人带自己的羊出羊圈，并非敌意驱逐。“带出来”保留向外移动的核心意义，避免擅自引入强迫性的神学含义；脚注则保存原词可能具有的较强力度。
- issue: τὰ ἴδια πάντα所指对象
  choice: 译作“所有属自己的”，不直接补成“自己所有的羊”
  alternative: 自己所有的羊；凡属于他的
  rationale: 希腊文此处使用中性复数名词化表达，随后才明确出现“羊”。保留这种措辞既符合上下文，又避免消除原文的表达层次。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“属自己的”保留原文略带省略的表达；以“它们”承接羊群，避免人格化补义。句式按时间从句、牧人先行、羊群跟随及原因依次展开。
