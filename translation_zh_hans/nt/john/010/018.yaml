source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: zh_hans
  text: 没有人从我这里把它拿走；是我自己舍下它。[a]我有权柄[b]舍下它，也有权柄再取回它。[c]这命令是我从我的父亲那里领受的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我自己”也可译作“我主动地”或“出于我自己”；这里强调耶稣是自愿舍命，并不表示他与父无关。
    reason: lexical_alternative
  - marker: b
    text: “权柄”也可译作“权利”或“权能”；希腊词可兼指正当的授权和实行这事的能力。
    reason: lexical_alternative
  - marker: c
    text: “它”指耶稣的生命，见约翰福音10:17。“再取回”也可译作“再领受”。
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: αἴρει
  choice: 夺去
  rationale: 在“从我这里”（ἀπ’ ἐμοῦ）的搭配中，表示把生命强行取走；“夺去”自然呈现其与耶稣主动舍命之间的对比。
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: 舍下它
  rationale: 保留约翰福音本段反复使用的“舍下生命”意象，并在两处采用一致译法。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 我自己
  rationale: 突出耶稣亲自且自愿采取行动，同时避免译成“独自决定”而误示他与父无关。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 该词兼有合法授权和实际支配能力的含义；“权柄”也与本节末尾父所赐的命令相协调。
- source_word: πάλιν λαβεῖν αὐτήν
  choice: 再取回它
  rationale: “再”对应 πάλιν，“取回”保留 λαμβάνω 可表达的主动行动；脚注同时说明“再领受”的可能译法。
- source_word: ἐντολήν
  choice: 命令
  rationale: 直接体现 ἐντολή 的规范性和权威性，不将其弱化为一般的托付。
- source_word: παρὰ τοῦ πατρός μου
  choice: 从我父领受的
  rationale: παρά 加属格表示来源；“我父”保留原文亲密而直接的父子关系表达。
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ 所表达的自主性
  choice: 我自己舍下它
  alternative: 我主动舍下它／我出于自己舍下它
  rationale: 译文明确耶稣的舍命不是被迫的，却不把这种自愿行动解释为脱离父的独立行动；本节末句仍保留父的命令所形成的张力。
- issue: ἐξουσία 与耶稣舍命及再取回生命的关系
  choice: 权柄
  alternative: 权力／权利／能力
  rationale: “权柄”能够兼顾正当授权与行动能力，不把原文缩减为单纯的力量或抽象权利。
- issue: πάλιν λαβεῖν αὐτήν 的语态意味
  choice: 再取回它
  alternative: 再领受它
  rationale: 主译保留耶稣主动行动的语气，但脚注承认 λαμβάνω 也可译作“领受”，不以译文排除这一词义空间。
- issue: αὐτήν 的所指
  choice: 它
  alternative: 我的生命
  rationale: 代词承接上文约翰福音10:17的“我的生命”；正文保留原文代词，脚注交代所指，以免在单节阅读时含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“夺去／舍下”形成鲜明对照；“权柄”虽略带圣经语体，但在此比“权力”更能表达授权与能力兼具的含义。标点用分号突出被动遭夺与主动舍命之间的转折。
