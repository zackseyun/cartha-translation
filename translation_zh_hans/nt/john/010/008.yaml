  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: zh_hans
  text: 凡在我以前来的[a]，都是贼和强盗；羊却没有听从他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我前头来的”。这个短语可以指时间上“在我以前”，也可以指“抢先在我前头来”的意思；上下文似乎指向假牧人，而非此前所有受上帝差遣的人。
    reason: 保留πρὸ ἐμοῦ的时间性及“在前头”的可能含义，并以审慎措辞说明其在上下文中的可能指向。
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: 凡……的
  rationale: 这是现代汉语中自然的周遍表达，保留原文对所指群体的概括范围，同时与后面的关系分句顺畅衔接。
- source_word: ἦλθον
  choice: 来的
  rationale: 以完成了的来行动作表达希腊文不定过去时，不额外加入持续至今的含义。
- source_word: πρὸ ἐμοῦ
  choice: 在我以前
  rationale: 直接保留最自然的时间性理解；原短语也可能表示“在我前头”，因此在脚注中保留这一语义可能。
- source_word: κλέπται
  choice: 贼
  rationale: 准确表达暗中偷窃者，并与下文较具暴力意味的“强盗”形成区别；措辞通俗而庄重。
- source_word: λῃσταί
  choice: 强盗
  rationale: 该词常指以暴力掠夺的人。“强盗”既保留其掠夺性，也与“贼”构成自然的并列。
- source_word: ἀλλ’
  choice: 却
  rationale: 表达前后鲜明的转折关系，在此句中比单用“但”更符合现代汉语语流。
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: 没有听从他们
  rationale: ἀκούω带属格宾语在这里不只是听见声音，也包含响应、听从之意；这一译法符合牧人和羊的语境。
- source_word: τὰ πρόβατα
  choice: 羊
  rationale: 按约翰福音牧羊比喻作集合性表达；汉语无需重复定冠词，也不必另加“那些”。
theological_decisions:
- issue: “凡在我以前来的”的范围与含义
  choice: 正文直译为“凡在我以前来的”，不在正文中限定其所指。
  alternative: 译为“凡在我前头来的”，或在正文中明确解释为那些离开耶稣而自称有权柄的假牧人。
  rationale: 希腊文形式宽泛，可能具有时间先后的含义，也可能指抢先而来、自称有权柄的人。上下文所针对的是假牧人，不宜据此理解为耶稣谴责此前所有受上帝差遣的人；但这一限制并未明说，因此正文保留张力，以脚注说明。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“贼和强盗”保留两个希腊词之间从偷窃到暴力掠夺的差别；“听从”体现羊辨认并响应牧人声音的语境。脚注标记紧接其实际解释的短语。
