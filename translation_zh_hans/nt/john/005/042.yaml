  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: zh_hans
  text: 但我了解你们：你们里面没有上帝的爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作“你们里面没有爱上帝的心”。原文也可较宽泛地理解为“来自上帝的爱”或“上帝所具有的爱”。
    reason: 原文属格“上帝的”可表示爱的对象、来源或归属，正文保留其歧义。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成鲜明转折；“但”简洁自然，符合现代汉语表达。
- source_word: ἔγνωκα
  choice: 我了解
  rationale: 完成时在此表达由认识而形成的确定判断；“了解”既适用于对人的认识，也能自然传达其持续有效的状态。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数直接宾语；汉语明确保留复数。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出耶稣所了解的具体内容；用冒号在现代汉语中自然清楚，也避免生硬的“我了解你们，知道……”。
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: 上帝的爱
  rationale: 保留希腊语属格结构的简洁性及其一定程度的歧义，不在正文中武断限定为“爱上帝的心”或“上帝所赐的爱”。
- source_word: οὐκ ἔχετε
  choice: 没有
  rationale: 自然表达当前持续存在的否定状态。
- source_word: ἐν ἑαυτοῖς
  choice: 你们里面
  rationale: 表达这种爱并不存在于他们内在生命之中；比“在你们自己里面”更符合现代汉语，同时保留内在含义。
theological_decisions:
- issue: “上帝的爱”（τὴν ἀγάπην τοῦ θεοῦ）中属格的含义
  choice: 正文保留“上帝的爱”，不明确限定爱的方向或来源。
  alternative: “爱上帝的心”；“来自上帝的爱”或“上帝的爱”。
  rationale: τοῦ θεοῦ可理解为指向上帝的爱，也可理解为来自上帝或以上帝为特征的爱。上下文较支持“对上帝的爱”，但原文措辞并未排除更宽泛的理解，因此正文保留张力，并以脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但”保持上下文的转折，“了解你们”体现对人的深刻认识；冒号清楚引出判断内容。
