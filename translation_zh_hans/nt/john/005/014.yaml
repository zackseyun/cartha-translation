id: JHN.5.14
reference: John 5:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: zh_hans
  text: 这些事以后，耶稣在圣殿里找到他，对他说：“你看，你已经康复了。不要再犯罪，免得有更糟的事临到你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节没有明确说明他先前的疾病是否由某项具体的罪造成，也没有说明“更糟的事”是指今世的苦难、最终的审判，还是两者兼有。
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语及约翰叙事推进的表达，比单数化的“这事以后”更贴近原文，同时符合现代汉语。
- source_word: εὑρίσκει
  choice: 找到
  rationale: 希腊文采用历史现在时；汉语叙事无需借助形态时态，译作“找到”自然地表达已经发生的事件。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指整个圣殿范围，而非专指内殿；“圣殿里”简洁且不过度限定为院落。
- source_word: Ἴδε
  choice: 你看
  rationale: 保留引起对方注意的语用功能，语言现代自然，又不像“看哪”那样带有较强传统或古雅色彩。
- source_word: ὑγιὴς γέγονας
  choice: 你已经康复了
  rationale: “已经……了”体现完成后的现存状态，也保留从患病到恢复健康的转变。
- source_word: μηκέτι ἁμάρτανε
  choice: 不要再犯罪
  rationale: 准确表达停止并从今以后不再犯罪的命令，同时不把现在时命令式过度解释为必然持续犯罪。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 自然简洁地表达原文所含的负面目的或预期结果，适合警告语境。
- source_word: χεῖρόν σοί τι γένηται
  choice: 有更糟的事临到你
  rationale: “更糟的事”体现χεῖρόν与不定代词τι，“临到你”自然表达σοι与γένηται，并保留所指灾祸性质的不确定性。
theological_decisions:
- issue: 耶稣警告中罪与苦难的关系
  choice: 直接译出不可再犯罪以及可能有更糟之事临到的警告，但不明说先前的疾病由某项具体罪直接造成。
  alternative: 明确断定先前疾病是某项具体罪的惩罚，或把“更糟的事”仅限定为今世苦难或最终审判。
  rationale: 原文把今后的犯罪与可能发生的更糟后果联系起来，却没有明确解释先前疾病的确切成因，也没有界定“更糟的事”究竟是今世灾祸、最终审判，还是兼而有之；译文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣殿”沿用通行的圣经宗教用语；“康复”清楚表达身体恢复及其现存结果。脚注仅用于保留原文真实存在的神学未决性。
