  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: zh_hans
  text: 并且他赐给他施行审判的权柄，因为他是人子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他是人”，即因为他具有人类身份。正文采用“人子”，因为这在《约翰福音》中很可能是一个称号。
    reason: 保留 υἱὸς ἀνθρώπου 在无冠词形式下可能按泛指人类身份理解的读法，同时以自然汉语说明正文采用的称号性理解。
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 指受授予的合法权限或管辖权；上下文是父将审判职权赐给子，并非仅指能力或力量。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 忠实表达 δίδωμι 的“给予”；“赐给”在父与子的语境中自然、庄重，又不额外规定授予的性质。
- source_word: αὐτῷ
  choice: 他
  rationale: 与格代词在上下文中指向子；汉语在“赐给他”中自然表达间接宾语。
- source_word: κρίσιν ποιεῖν
  choice: 施行审判
  rationale: 保留该短语“实行、执行审判”的司法含义，比单说“审判”更能体现实际执行判决的职权。
- source_word: ὅτι
  choice: 因为
  rationale: 此处自然引出赐予审判权柄的原因，采用因果义。
- source_word: υἱὸς ἀνθρώπου
  choice: 人子
  rationale: 约翰福音中通常作为耶稣既定的称号，并可能呼应《但以理书》7章；现代中文圣经语体以“人子”最能保留这一称号。
- source_word: ἐστίν
  choice: 是
  rationale: 按简单现在时系词直译，无需扩展。
theological_decisions:
- issue: υἱὸς ἀνθρώπου 应理解为基督论称号，还是泛指具有人的身份或人性
  choice: 正文译作称号“人子”
  alternative: “一个人的儿子”，或意译为“他是人”
  rationale: 尽管希腊文此处 υἱός 前无冠词，但在约翰福音的用法及审判权柄的语境中，很可能是耶稣既定的“人子”称号，并带有《但以理书》7章的背景。与此同时，无冠词形式也容许读者听见其与人类身份的联系，因此在脚注中保留这种可能，不在正文中消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“施行审判”保留司法语感；两个“他”严格对应原文，所指需由上下文辨明，以免擅自在本节中补入“父”或“子”。脚注标记已在正文中以 [a] 出现。
