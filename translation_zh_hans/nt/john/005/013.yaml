base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: zh_hans
  text: 可是，那得了医治的人不知道那人是谁；原来当时那里人多，耶稣已经悄然离开了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悄然离开”或译“退开了”或“离开了”。原文动词暗示耶稣没有引人注意地离去。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: 那得了医治的人
  rationale: 带冠词的简式被动分词在此作名词使用；“得了医治的人”保留被动含义，也表明医治发生在“不知道”之前。
- source_word: οὐκ ᾔδει
  choice: 不知道
  rationale: 按上下文采用自然、通行的现代汉语表达。
- source_word: τίς ἐστιν
  choice: 他是谁
  rationale: 指向耶稣本人；“他是谁”自然地表达希腊文间接问句，同时不额外说明那人对耶稣身份了解到了何种程度。
- source_word: ἐξένευσεν
  choice: 悄然离开了
  rationale: 该动词在此表示避开众人、不引人注意地离去；“悄然离开”兼顾离开和不显眼的语义色彩。
- source_word: ὄχλου ὄντος
  choice: 当时那里人多
  rationale: 将属格独立结构译为自然汉语，既可作为耶稣离开的背景，也可带有原因意味，不把二者严格限定为单一关系。
- source_word: ἐν τῷ τόπῳ
  choice: 那里
  rationale: 明确表达地点含义；现代汉语用“那里”比直译“在那地方”更自然。
