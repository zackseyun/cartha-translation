  rationale: 仅修订条件分句，以补足汉语所需的主语并消除“除非是看见父在做的事”的不自然句法。其余措辞及两处脚注均可保留：它们忠实呈现原文的条件、泛指和父子行动对应，且未越出文本作教义性定论。
