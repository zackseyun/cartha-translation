source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: zh_hans
  text: 于是，耶稣回答他们说：“我实实在在地告诉你们，子凭自己什么也不能做，除非他看见父所做的事[a]；因为父无论做什么，子也照样做[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“子不能凭自己做什么，只能做他看见父所做的。”
    reason: 说明ἐὰν μή结构既可按“除非”表达，也可在汉语中用“只能”来呈现其例外意义。
  - marker: b
    text: 这里一方面说子不离开父而行动，另一方面又说父无论做什么，子也照样做；译文保留这两方面并置的表达。
    reason: 帮助读者看见本句自身的神学张力，而不把“不能”孤立理解，也不超出经文作教义性改写。
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: 于是，耶稣回答他们说
  rationale: “于是”自然承接上文；“回答他们说”保留“回答”与引出话语的双重表达。希腊语未完成时在此具有叙事、话语引介功能，现代汉语不宜生硬译成“不断对他们说”。
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: 我实实在在地告诉你们
  rationale: 用现代汉语中庄重而通行的表达传达双重 Ἀμὴν 的郑重强调，同时保留第一人称宣告。
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: 子凭自己什么也不能做
  rationale: “不能”保留 δύναται 所表达的能力或可能性；“凭自己”体现 ἀφ’ ἑαυτοῦ 的来源与独立行动之意，不把它扩写成仅仅“凭自己的主意”。
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: 除非是看见父在做的事
  rationale: 保留条件兼例外结构，并以自然汉语表达“看见父做某事”；“在做”体现分词 ποιοῦντα 所描绘的进行性动作。
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: 因为父无论做什么
  rationale: “无论……什么”传达关系代词、ἄν 与虚拟语气形成的泛指意义；直接重复“父”比照搬 ἐκεῖνος 为“那一位”更符合现代汉语。
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: 子也照样做
  rationale: “也照样做”简洁保留 ταῦτα、καί 和 ὁμοίως 所强调的行动对应关系，宾语可由前句自然承接。
theological_decisions:
- issue: 如何表达子“不能凭自己做”的话而不替经文消除张力
  choice: 子凭自己什么也不能做
  alternative: 子绝不会自行做任何事
  rationale: 原文明确使用“不能”，并把这种不能与子看见父所做及照样行联系起来。译文保留能力措辞和父子行动不可分割的张力，不将其改写成单纯的意愿，也不额外作本体论判断。
- issue: 如何处理父与子的行动关系
  choice: 父无论做什么，子也照样做
  alternative: 父所做的一切，子也同样能做
  rationale: 原文重点是子实际“做”同样的事，而不只是具有能力；因此保留动词 ποιεῖ 的陈述语气，并避免增添原文此处没有的“能”。
- issue: “子”和“父”是否作为特指称谓处理
  choice: 子／父
  alternative: 儿子／父亲
  rationale: 在本段语境中，两词是耶稣与神之间关系的特指称谓。简洁的“子”“父”既符合约翰福音的语体，也不增添希腊文没有的所有格。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“我实实在在地告诉你们”保留约翰福音中双重“阿们”的郑重语气；整体句法尽量贴近原文的因果和对应结构，同时避免“从自己”“那一位”等不自然的直译腔。
