source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: zh_hans
  text: 为要使所有人都尊敬子，正如他们尊敬父一样。不尊敬子的人，也不尊敬差遣子来的父。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 引出目的或预期结果；“为要使”保留目的意味，也能自然承接上文。
- source_word: πάντες
  choice: 所有人
  rationale: 明确表达泛指全体的人，比单用“都”更完整，同时不扩大原文范围。
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: 尊敬
  rationale: τιμάω表示给予应有的尊重与尊荣；“尊敬”在现代汉语中自然庄重，并可在全节重复使用，以保留原文平行结构。
- source_word: τὸν υἱὸν
  choice: 子
  rationale: 在本段中是指耶稣的称号；“子”符合现代中文圣经语体，且与“父”形成原文中的关系性对应。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 保留强烈的对应比较，不弱化为仅仅相似，也不加入原文没有明说的后期神学术语。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 在语境中指差遣子的父；用“父”保持称号性质，并与“子”平行。
- source_word: ὁ μὴ τιμῶν
  choice: 不尊敬子的
  rationale: 将冠词化分词译为中文自然的泛指“……的”，表达任何不尊敬子的人，保留格言式陈述。
- source_word: τὸν πέμψαντα αὐτόν
  choice: 差他来的父
  rationale: 分词短语修饰“父”；“差他来”准确表达父差遣子的行动，其中“他”指子。
- source_word: πέμψαντα
  choice: 差……来
  rationale: πέμπω的基本义是“差遣、派出”；“差……来”简洁自然，并保留约翰福音常见的差遣主题。
theological_decisions:
- issue: 子与父所受尊敬之间的比较力度
  choice: 译作“正如他们尊敬父一样”，保留καθὼς所表达的强对应关系。
  alternative: 译作“像尊敬父那样”或仅用“如同”，可能在中文中显得较弱。
  rationale: 原文把尊敬子与尊敬父直接对应；译文既不应削弱此关系，也不应添入原文未使用的教义术语。
- issue: “子”和“父”的称号表达
  choice: 译作“子”和“父”，不加“圣”或“上帝”等说明。
  alternative: 译作“圣子”和“圣父”，或“儿子”和“父亲”。
  rationale: 语境清楚表明二者是关系性称号；“子／父”最贴近原文并保持庄重。“圣子／圣父”会加入原文没有的修饰，“儿子／父亲”则较偏日常亲属称谓。
- issue: “不尊敬子”与“不尊敬父”的逻辑关系
  choice: 保留绝对陈述：“不尊敬子的，也不尊敬……父。”
  alternative: 解释性译为“不尊敬子的，就不能真正尊敬父”。
  rationale: 原文直接否定其尊敬父，并未加入“真正”或“不能”等解释成分；直译可保存经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊敬”三次对应同一希腊动词，以保留修辞重复；“正如……一样”凸显比较力度。全节无需脚注。
