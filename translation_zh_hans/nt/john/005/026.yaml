  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: zh_hans
  text: 因为父怎样在自己里面有生命[a]，他也照样赐给子，使子在自己里面有生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己里面有生命”也可理解为生命内在于其自身；这里保留希腊原文的表达，没有改用“自存的生命”等神学术语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……怎样
  rationale: “因为”表达γάρ与上文的解释关系，“怎样”开启与οὕτως对应的比较结构，符合现代汉语表达。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 在本段语境中是指上帝之父；用“父”保留约翰福音的称谓方式。
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: 在自己里面有生命
  rationale: 直接保留ἔχει、ζωή和ἐν ἑαυτῷ的结构与含义，不以“自有永有”或“自存的生命”等神学术语替代。
- source_word: οὕτως καὶ
  choice: 也照样
  rationale: 与前面的“怎样”构成自然的汉语关联结构，并保留καί的“也”。
- source_word: τῷ υἱῷ
  choice: 给子
  rationale: 将与格按ἔδωκεν的间接宾语处理；“子”保留本段的基督论称谓。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 表达“给予”的基本含义，同时“赐给”适合父与子的庄重语境；不把其改写成仅指授权的词。
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: 在自己里面有生命
  rationale: 以自然汉语表达不定式内容，并与前半句保持措辞上的平行。
theological_decisions:
- issue: 是否把“在自己里面有生命”明确译成“自存的生命”或“自有生命”
  choice: 保留“在自己里面有生命”
  alternative: 拥有自存的生命
  rationale: 原文是ἐν ἑαυτῷ，并未采用后世神学术语。直译既保留其深厚含义，也不超出经文本身。
- issue: 如何处理父“赐给”子有生命这一表述
  choice: 如实译为“赐给子在自己里面有生命”
  alternative: 使子拥有本有的生命
  rationale: 原文明说ἔδωκεν，译文不淡化“给予”，也不在正文中加入对父子关系的体系化解释，从而保留经文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为……怎样……也照样……”呈现本节与上文的解释联系及父子之间的平行关系；重复“在自己里面有生命”以保留原文的强调。
