  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: zh_hans
  text: 我不从人那里领受荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“尊荣”或“称赞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα在这里指人所给予的尊荣、称赞或推崇。“荣耀”保留了《约翰福音》中这一词与全书荣耀主题的词汇联系；脚注说明此处也可理解为“尊荣”或“称赞”。
- source_word: παρὰ ἀνθρώπων
  choice: 从人而来的
  rationale: παρά加属格表示来源。ἀνθρώπων在这里泛指人类或世人，译作“人”既准确又符合现代汉语，不把原文泛称用法不必要地限定为男性。
- source_word: οὐ λαμβάνω
  choice: 我不接受
  rationale: λαμβάνω可指“领受”或“接受”。在本语境中，“接受”自然表达耶稣不以人的荣耀作为认可，同时没有把“寻求”等解释性概念加入正文；现在时用汉语一般陈述表达。
theological_decisions:
- issue: 耶稣关于人的认可之陈述的性质
  choice: 正文直译为他不接受从人而来的荣耀，表达他的使命和身份不依赖人的推崇
  alternative: 将此理解为耶稣在任何意义上都从不曾受到任何人的尊荣
  rationale: 上下文侧重耶稣不从人取得使自己获得认可的荣耀，并非必然作出“从来无人尊荣他”的绝对断言。正文贴近希腊文，不擅自加入“寻求”或“依赖”等解释性措辞。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“从人而来的”清楚保留来源关系；“人”在现代汉语中可自然泛指人类，无须另加性别脚注。
