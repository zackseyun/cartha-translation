id: JHN.5.32
reference: John 5:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: zh_hans
  text: 另有一位为我作见证[a]，我知道他为我所作的见证是真的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证”也可译作“作证”。
    reason: 词义与语体上的可选译法；“作证”更简洁，也更突出司法色彩。
lexical_decisions:
- source_word: ἄλλος
  choice: 另有一位
  rationale: 既表达在耶稣自己以外还有另一位，也不在本节中指明其身份；“一位”适合指称人物，语气自然而庄重。
- source_word: ὁ μαρτυρῶν
  choice: 为我作见证
  rationale: 该带冠词的现在分词指“作见证的那一位”；译作“为我作见证”保留持续性的动作含义，也符合现代汉语表达。
- source_word: περὶ ἐμοῦ
  choice: 为我
  rationale: περί加属格表示见证所涉及的对象；汉语“为我作见证”比机械直译为“关于我作见证”更自然，并未改变其指涉。
- source_word: οἶδα
  choice: 我知道
  rationale: 直接、准确地表达认知上的确定。
- source_word: ἀληθής
  choice: 真的
  rationale: 表达该见证真实、可靠；“是真的”自然明晰，同时避免额外解释为法律上的“有效”。
- source_word: ἡ μαρτυρία
  choice: 见证
  rationale: 保留本段的见证语汇及其近似司法语境，也与动词“作见证”形成词根呼应。
- source_word: ἣν μαρτυρεῖ
  choice: 他为我所作的
  rationale: 用“所”字结构自然呈现希腊文关系从句，并保留“见证／作见证”的约翰式重复，而不使汉语生硬。
theological_decisions:
- issue: “另一位”（ἄλλος）的身份
  choice: 仅译作“另有一位”，不在正文中指明是谁。
  alternative: 可按上下文解释为施洗约翰、父，或法律意义上的另一位见证者。
  rationale: 本节本身没有明说这位见证者的身份；译文保留原文的开放性，不把上下文解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“另有一位”避免提前确定见证者身份；“见证／作见证”的重复有意保留原文措辞联系。
