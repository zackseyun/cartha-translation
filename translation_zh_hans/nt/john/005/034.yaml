  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: zh_hans
  text: 不过，我并不接受出于人的见证；而我说这些事，是要使你们得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: 来自人的
  rationale: παρά接属格表示来源。ἀνθρώπου虽为单数，在此属泛指，译作“人的”既保留单数形式，也自然表达“出于人”的类别含义。
- source_word: μαρτυρίαν
  choice: 见证
  rationale: μαρτυρία指见证或证言；约翰福音上下文反复使用“见证”，此译法既保留证据语境，也维持术语一致。
- source_word: λαμβάνω
  choice: 接受
  rationale: λαμβάνω本可译“领受”，但与“见证”搭配时，“接受”在现代汉语中更自然，并能表达耶稣不以人的见证作为所需凭据；不额外译成“认可”。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词的复数意味，并自然指向耶稣正在讲述的内容。
- source_word: λέγω
  choice: 我说
  rationale: 以一般现在时直译，简洁自然，不增添进行体意味。
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: 是要使你们得救
  rationale: ἵνα明确表达目的，σωθῆτε为被动虚拟式；“使你们得救”自然保留目的与被动的救恩含义，而不说明施救方式。
- source_word: δὲ ... ἀλλὰ
  choice: 不过……；……是要……
  rationale: δὲ引出与前文相关的转折，译作“不过”。ἀλλὰ在此不是简单并列，而是把重点转到说这些话的目的；汉语用分号及“是要”自然呈现纠正式对照。
theological_decisions:
- issue: “你们得救”的范围与含义
  choice: 保留宽广的救恩措辞“得救”
  alternative: 获救；得到拯救；获得救恩
  rationale: σωθῆτε在约翰语境中具有深厚的救恩意义，但本句没有进一步界定救恩的机制或教义模式。“得救”保留其神学分量和被动意味，不将其缩窄为肉身脱险，也不加入宗派性解释。
- issue: 耶稣“不接受人的见证”的含义
  choice: 直译为“不接受来自人的见证”
  alternative: 我并不需要人的见证；我不靠人的见证
  rationale: 原文使用λαμβάνω而非“需要”或“依靠”。直译避免替文本判定这是拒绝、无需，还是不以其为权威依据，并保留与上下文之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不过”承接上文转折；“来自人的见证”兼顾希腊语来源结构与汉语可读性；全句不采用古雅的“岂”“乃”“叫”等表达。
