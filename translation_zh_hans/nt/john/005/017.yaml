  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: zh_hans
  text: 但耶稣回答他们：“我父亲直到现在仍在工作，我也在工作。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文对耶稣的指责，表达轻微的转折；“但”简洁自然。
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: 耶稣回答他们
  rationale: ἀποκρίνομαι在此是“回答、回应”；根据上下文将希腊文代词所指明说为“耶稣”，便于单节阅读。
- source_word: Ὁ πατήρ μου
  choice: 我父
  rationale: 直接保留耶稣与父之间的关系称谓，不增添解释；“我父”庄重而简洁。
- source_word: ἕως ἄρτι
  choice: 到现在
  rationale: 表示行动延续至说话时刻；与“一直作工”搭配，准确而符合现代汉语。
- source_word: ἐργάζεται
  choice: 一直作工
  rationale: 现在时结合ἕως ἄρτι呈现持续至今的行动；“作工”既保留原词宽泛的行动含义，也符合本段较庄重的语体。
- source_word: κἀγὼ
  choice: 我也
  rationale: 保留κἀγώ中“而我也”的并列与附加强调。
- source_word: ἐργάζομαι
  choice: 在作工
  rationale: 用进行体表达耶稣当前持续的行动，并与父持续作工的陈述形成清楚平行。
theological_decisions:
- issue: 耶稣的作工与父的作工之间的关系
  choice: “我父一直作工到现在，我也在作工”
  alternative: “我父作工直到如今，我也作工”
  rationale: 译文保留原文刻意形成的平行关系，不额外说明安息日、神的特权或耶稣与父同等的问题，使经文本身的神学张力不被弱化或过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直作工到现在”自然表达持续性；后半句“我也在作工”保留耶稣将自己的行动与父的行动并列这一重点。
