  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: zh_hans
  text: 因为父不审判任何人，却把一切审判都交给了子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: 因为……不
  rationale: γάρ承接上文，说明原因；οὐδέ在此与否定代词共同表达否定。译作“因为……不”符合现代汉语表达，也保留解释关系。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 约翰福音在父与子的关系中以此称呼上帝；“父”自然保留其称号性质。
- source_word: κρίνει
  choice: 审判
  rationale: 现在时陈述一般事实。“审判”既保留与后文名词κρίσις的词汇呼应，也不把含义缩窄为“定罪”。
- source_word: οὐδένα
  choice: 任何人
  rationale: 与否定词“不”搭配，准确表达无一例外的否定，且符合现代汉语习惯。
- source_word: ἀλλὰ
  choice: 却
  rationale: 突出父不审判人与把审判交给子之间的强烈转折，比单用“但”更顺畅。
- source_word: τὴν κρίσιν πᾶσαν
  choice: 全部审判
  rationale: 保留κρίσις的名词形式及πᾶσαν的全面性，不增译为“审判的权柄”，以免将原文所含的审判职能过度解释为单一的权柄概念。
- source_word: δέδωκεν
  choice: 交给了
  rationale: 完成时表示已完成且结果持续的行动；“交给了”在汉语中自然表达将审判交由子承担，并由句境体现其现今有效的结果。
- source_word: τῷ υἱῷ
  choice: 子
  rationale: 希腊文有定冠词而没有物主代词；“子”保留约翰语境中的基督论称号，不擅自增添“他的”。
theological_decisions:
- issue: 父不审判人与子施行审判的关系
  choice: 直接译为父不审判任何人，却把全部审判都交给了子。
  alternative: 增译为父“不离开子而独自审判”，或把“全部审判”限定为末日审判。
  rationale: 原文作出直接而全面的陈述，没有这些限定；译文保留其神学张力，不作调和性补充。
- issue: “子”这一基督论称号
  choice: 保留为“子”。
  alternative: 译为“他的儿子”。
  rationale: 原文没有物主代词；“子”既反映定冠词所标示的称号用法，也保留约翰福音中父与子的关系。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“审判”前后重复，以再现κρίνει与κρίσις的词根呼应；全句简洁，不添加原文没有的神学限定。
