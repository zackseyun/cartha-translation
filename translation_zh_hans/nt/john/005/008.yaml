  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: zh_hans
  text: 耶稣对他说：“起来，拿起你的褥子[a]，走路吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铺盖”。希腊语这个词指简陋的睡垫或卧具，不一定是有床架的床。
    reason: 词义存在可行替代译法；注释可防止现代读者把它理解为笨重的床。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事通常用不标明时态的“说”，既自然，也不必强行译成带时间色彩的形式。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 按与格间接宾语自然译为“对他说”，不作额外扩展。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 准确表达从躺卧状态起身的命令，简洁、自然，并保留命令的直接力度。
- source_word: ἆρον
  choice: 拿起
  rationale: 表达将物件提起、带走的动作；“拿起”符合现代汉语，又不把后文才可能显明的携带动作过度加入本节。
- source_word: κράβαττόν
  choice: 褥子
  rationale: 该词指可携带的简陋卧具或睡垫。“褥子”比现代汉语中的“床”更能避免让人联想到笨重的床架，也比泛泛的“垫子”更清楚地表明这是卧具。
- source_word: περιπάτει
  choice: 走吧
  rationale: 此处指实际行走。“走吧”是自然、直接的汉语命令；不增译“继续走”，以免过度限定希腊文动词的体貌。
theological_decisions:
- issue: 医治语境中耶稣命令的性质
  choice: 将三个命令直接译为起身、拿起褥子和行走，不加入“得医治”等解释性措辞。
  alternative: “起来，得医治吧”等明确加入医治含义的译法。
  rationale: 本节的希腊文本只明确给出三个身体动作的命令；医治的含义由上下文显明，不应在本节词句中额外补入。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语言。“起来，拿起……，走吧”保留原文三个并列命令的节奏；感叹号传达命令的直接性，但不额外强化为愤怒或高声斥令。
