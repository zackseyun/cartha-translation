  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: zh_hans
  text: 不要以为我要在父面前控告你们[a]；有一位控告你们的，就是你们所寄望的摩西[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要以为我要向父控告你们。”
    reason: lexical_alternative
  - marker: b
    text: 本节直接称摩西为控告者；紧接的上下文将此与摩西所写的话联系起来（5:46—47）。
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: 不要以为
  rationale: μή与现在时命令式δοκεῖτε构成禁止语气；“不要以为”自然、直接，也符合现代汉语表达。
- source_word: κατηγορήσω
  choice: 我要……控告
  rationale: κατηγορέω具有法律语境中的“控告、提出指控”之义；“控告”保留司法色彩，又不越译为“定罪”。
- source_word: πρὸς τὸν πατέρα
  choice: 在父面前
  rationale: 在控告的语境中，πρός加宾格可表示向着某人提出指控；“在父面前”自然呈现近似法庭的场景，并保留约翰福音中“父”的称谓。
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: 控告你们的，是……
  rationale: 分词ὁ κατηγορῶν指明实际控告他们的那一位；汉语判断句既自然，也保留与前句“我”的对比。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代简体中文圣经及公共语境通行的人名译法。
- source_word: εἰς ὃν
  choice: 那一位
  rationale: 关系代词所指的是前面的摩西；结合“寄予希望”表达为“就是你们一直寄予希望的那一位”，明确关系而不增译为摩西的律法或著作。
- source_word: ἠλπίκατε
  choice: 一直寄予希望
  rationale: 完成时表示过去形成并持续至今的信赖状态；“一直寄予希望”传达其延续性，同时保持自然庄重。
theological_decisions:
- issue: 耶稣所说“控告”的司法含义
  choice: 译作“控告”，不译作“定罪”
  alternative: 我要在父面前定你们的罪
  rationale: κατηγορέω表示控告或提出指控，并非最终宣判有罪；这样保留法律意象，而不加入原文没有明说的更强判断。
- issue: 他们把希望寄托于谁
  choice: 保留原文直接指向“摩西”
  alternative: 摩西的律法；摩西的著作
  rationale: 上下文虽涉及摩西所写的话，本节希腊文却直接以摩西为关系代词的先行词；正文不把其含义缩限为律法或著作。
- issue: 摩西作为控告者的表述
  choice: 保留现在分词的陈述，不具体说明控告发生的时间或方式
  alternative: 摩西将在末日控告你们；摩西的律法正在控告你们
  rationale: 原文只称摩西为“控告你们的”那一位，并未在本句明确限定末日场景，也没有把主语改成律法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在父面前控告”保留司法语境；“一直寄予希望”体现完成时所表达的持续状态。正文中的[a]、[b]与脚注一一对应。
