id: JHN.5.20
reference: John 5:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: zh_hans
  text: 因为父爱子，把自己所做的一切都指给他看；还要把比这些更大的事指给他看[a]，使你们惊奇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还要把比这些更大的事指给他看，以致你们必惊奇。”希腊文ἵνα与虚拟式可表达目的，在本句语境中也可能兼含听众因而惊奇的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: 爱
  rationale: 自然表达父与子的亲密关系；在约翰著作中，φιλέω与ἀγαπάω的含义可以重叠，不宜译成较弱的爱。
- source_word: δείκνυσιν / δείξει
  choice: 指给……看 / 要指给……看
  rationale: 保留同一动词现在时与将来时的呼应，也比“启示”少一层解释性。
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: 自己所做的一切
  rationale: “一切”传达πάντα的完整范围，“自己”体现αὐτός的强调；中文无需强行把现在时译为进行体。
- source_word: μείζονα τούτων ... ἔργα
  choice: 比这些更大的事
  rationale: “事”在现代汉语中自然庄重，并能涵盖耶稣所行的作为；“这些”保留比较对象。
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: 使你们惊奇
  rationale: 保留ἵνα可能表达目的、也可能兼含结果的张力；“你们”明确是复数听众。
theological_decisions:
- issue: φιλέω所表达的父对子之爱
  choice: 直译为“爱”，不暗示这是较低或仅属人的感情
  alternative: “喜爱”或“疼爱”
  rationale: 上下文强调父子之间亲密而独特的关系；将φιλέω刻意弱化，会加入原文未要求的神学区分。
- issue: ἵνα ὑμεῖς θαυμάζητε的目的与结果含义
  choice: 正文译作“使你们惊奇”
  alternative: “以致你们必惊奇”
  rationale: ἵνα加虚拟式首先可表达目的，但在此也可能含有由此产生惊奇的结果；正文不把它强化为确定预言，脚注保留另一种理解。
- issue: 父把自己的作为指给子看
  choice: 按经文关系直接陈述，不进一步解释父子行动方式
  alternative: 以“启示”或其他神学术语说明其机制
  rationale: 译文应保留经文本身的父子关系表述，不导入经文没有明说的体系化解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“指给他看”保留δείκνυμι的具体意味及前后重复；“惊奇”比口语化的“吃惊”更适合经文语体。
