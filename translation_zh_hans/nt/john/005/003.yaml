  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: zh_hans
  text: 这些廊子里躺着一大群病人，有盲人、瘸腿的人和肢体萎缩的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταύταις
  choice: 这些廊子里
  rationale: 阴性复数指示代词承接上一节的廊子。中文补出“廊子”可清楚表达所指，避免单说“这些里面”的生硬与含混。
- source_word: κατέκειτο
  choice: 躺着
  rationale: 未完成时形式描写当时持续的状态；“躺着”自然准确，适合病人聚集的场景。
- source_word: πλῆθος τῶν ἀσθενούντων
  choice: 许多病人
  rationale: πλῆθος表达人数众多，分词指患病或身体虚弱的人；“许多病人”符合现代汉语习惯，同时保留集体数量意义。
- source_word: τυφλῶν
  choice: 盲人
  rationale: 直接表达失明者这一类别，用语清楚而中性。
- source_word: χωλῶν
  choice: 瘸腿的
  rationale: χωλός指行走有障碍的人；“瘸腿的”较准确地保留具体身体状况，也与本句列举形式协调。
- source_word: ξηρῶν
  choice: 肢体萎缩的
  rationale: ξηρός字面为“干枯的、萎缩的”，用于身体时很可能指肢体枯萎或萎缩者。“肢体萎缩的”比“瘫痪的”更贴近词面证据，也不把其具体功能状况过度确定为瘫痪。
