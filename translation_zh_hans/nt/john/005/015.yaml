  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: zh_hans
  text: 那人离开后，向犹太人报告说，使他恢复健康的就是耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”按约翰福音在本处的语境，也可理解为“犹太领袖”或“犹太地人（犹大地区的人）”。
    reason: 保留τοῖς Ἰουδαίοις在约翰福音语境中可能具有的不同所指。
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 离开后
  rationale: 表示那人从现场离去；结合后续动作译为“离开后”，符合现代汉语叙事习惯。
- source_word: ὁ ἄνθρωπος
  choice: 那人
  rationale: 指上下文中得到医治的男子；“那人”自然承接前文，并保留特指。
- source_word: ἀνήγγειλεν
  choice: 报告
  rationale: ἀναγγέλλω在此指把所得知的消息告知他人；“报告”比“宣布”更贴合向有关人士传达信息的语境。
- source_word: τοῖς Ἰουδαίοις
  choice: 向犹太人
  rationale: 正文保留Ἰουδαῖοι的直接族群称谓，不在正文中把所指限缩为领袖；其语境含义另以脚注说明。
- source_word: ὅτι
  choice: 说
  rationale: 引出报告的内容；现代汉语用“报告说”自然表达希腊文的内容从句。
- source_word: Ἰησοῦς ἐστιν
  choice: 就是耶稣
  rationale: 希腊文用现在时和强调性的表语结构确认耶稣的身份；汉语“就是”自然保留辨认和确认的语气，无须作时态回移。
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: 使他恢复健康的
  rationale: 直译ποιέω加表语形容词ὑγιής的使役结构，并以“恢复健康”表达由患病到康复的结果，避免把ποιέω直接改译为“医治”而失去原句形式。
theological_decisions:
- issue: 约翰福音中“犹太人”的具体所指
  choice: 正文译作“犹太人”，脚注说明也可能按语境理解为“犹太领袖”或“犹太地区的人”。
  alternative: 正文直接译作“犹太领袖”或“犹太地区的人”。
  rationale: τοῖς Ἰουδαίοις本身是“犹太人”，但在约翰福音的具体语境中有时侧重犹太权势群体或犹太地区的人。正文保留原词的范围，脚注呈现语境上的可能性，避免未经文本明确要求便缩窄所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“离开后”使动作衔接自然；“恢复健康”准确表达ὑγιής的身体康复含义。正文不将“犹太人”解释性限缩，相关歧义由脚注保留。
