id: JHN.5.21
reference: John 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: zh_hans
  text: 因为父怎样叫死人复活，赐给他们生命[a]，子也照样赐生命给他所愿意的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使……活过来”；原文两处使用同一个动词。
    reason: lexical_alternative
  - marker: b
    text: 或译“他愿意赐生命给谁，就赐给谁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……怎样……也照样
  rationale: “因为”保留γάρ的解释作用，“怎样……也照样”自然呈现ὥσπερ与οὕτως καί前后呼应的比较结构。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 上下文特指上帝之父，与后文“子”形成明确对应；现代中文圣经语体中无需另加“那位”。
- source_word: ἐγείρει τοὺς νεκρούς
  choice: 使死人复活
  rationale: ἐγείρω在死人语境中指使之起来、复活；此译比“唤醒死人”更准确自然。
- source_word: ζῳοποιεῖ
  choice: 使……得生命
  rationale: 保留两次ζῳοποιεῖ的对应，表达赋予生命，不把含义局限为肉身苏醒。第一处补出“他们”，仅为中文句法清楚，其所指直接承接“死人”。
- source_word: οὕτως καὶ
  choice: 也照样
  rationale: 准确承接前面的比较，突出父与子施行生命之工的平行关系。
- source_word: ὁ υἱὸς
  choice: 子
  rationale: 作为与“父”对应的称谓，简洁保留约翰福音中的基督论表达。
- source_word: οὓς θέλει
  choice: 自己愿意的人
  rationale: 直接保留关系代词的复数人称对象及θέλω的意愿含义；“自己”明确意愿的主体是子，而不额外解释其性质。
theological_decisions:
- issue: 父与子使人得生命的平行关系
  choice: 以“怎样……也照样”保留二者明确的平行行动
  alternative: 采用较松散的表达，弱化父与子之间的对应
  rationale: 原文有意将父使死人复活、赐予生命，与子使其所愿意的人得生命并列；译文保留这一基督论力度，但不进一步说明其本体论含义。
- issue: θέλει所表达的子的意愿
  choice: 译作“自己愿意的人”
  alternative: 译作“按自己的旨意使人得生命”
  rationale: 主译紧贴οὓς θέλει的关系从句结构，同时保留子主动拣定对象的语义；不将“愿意”弱化为随意的愿望，也不扩展为系统神学术语。
- issue: ζῳοποιεῖ的生命含义
  choice: 译作“使……得生命”
  alternative: 译作“使……活过来”
  rationale: “得生命”既可涵盖使死人活过来，也保留约翰语境中较宽的赐生命含义，避免擅自限定为某一种生命层面。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“使死人复活”是现代读者熟悉且准确的表达；“使……得生命”保留原文两处动词的重复和平行。“自己愿意的人”略具书面庄重感，但仍自然易懂，并忠实呈现原文关系从句。
