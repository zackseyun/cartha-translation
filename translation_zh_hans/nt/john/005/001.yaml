  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: zh_hans
  text: 这些事以后，正逢犹太人的一个节期，耶稣就上耶路撒冷去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留ταῦτα的复数指代和约翰常用的叙事过渡方式；比单说“此后”更贴近原文，同时现代读者也容易理解。
- source_word: ἦν ἑορτὴ
  choice: 正逢……一个节期
  rationale: ἑορτή指宗教性的节庆或节期。“正逢”以自然汉语表达未完成时ἦν所交代的背景，不把节期误解为单指宴席。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 这里的属格说明该节期属于犹太人的宗教节庆传统；本处重点并非犹太地区居民这一地域身份，因此译作“犹太人的”最合语境。
- source_word: ἀνέβη
  choice: 上……去
  rationale: ἀναβαίνω在前往耶路撒冷的语境中有“上去”之意，既符合当地地势，也保留传统朝圣行程的表达。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用该地名在现代简体中文中的通行译法。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖοι的所指
  choice: 本节译作“犹太人”
  alternative: 犹太地区的人
  rationale: Ἰουδαῖοι在约翰福音不同语境中可能指犹太人，也可能侧重犹太地区的人；但本节以其修饰“节期”，所指是犹太人的宗教节庆，不宜在正文中引入地域含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“正逢”使汉语句子自然连贯；“一个节期”保留原文不定指，因为本节并未说明具体是哪一个节期。
