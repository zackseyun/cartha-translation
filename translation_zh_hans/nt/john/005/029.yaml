source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: zh_hans
  text: 并且都要出来：行善的，复活得生命；作恶的，复活受审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受审判”或译“被定罪”。希腊原文是“审判”，含义较广；“定罪”是一些译本采用的较窄解释。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: 都要出来
  rationale: 承接上节死人从坟墓中出来的语境；“出来”自然准确。“都”体现复数主语所包括的两类人，并使中文承接顺畅。
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: 行善的
  rationale: 冠词加形容词作 ποιήσαντες 的宾语，指所行的善；“行善”简洁自然，也保留行为层面的概括。
- source_word: ἀνάστασιν ζωῆς
  choice: 复活得生命
  rationale: 属格 ζωῆς 可表达复活与生命的归向或结果；中文“复活得生命”自然，并与下句形成清晰平行。
- source_word: τὰ φαῦλα πράξαντες
  choice: 作恶的
  rationale: φαῦλα 在审判语境中指道德上的恶；“作恶”比“做坏事”庄重。虽未强行以不同汉语动词标示 ποιέω 与 πράσσω 的细微差别，但避免把 πράσσω 过度解释为持续习惯。
- source_word: ἀνάστασιν κρίσεως
  choice: 复活受审判
  rationale: κρίσις 的基本意义是“审判”，不缩窄为“定罪”；“受审判”在现代汉语中清楚表达这种复活所面对的审判。
- source_word: δὲ
  choice: ；……的，
  rationale: 希腊文 δέ 标示两类人的对照；中文以分号和平行结构自然呈现，无须机械加入“但是”。
theological_decisions:
- issue: κρίσεως 应译为较广的“审判”还是较窄的“定罪”
  choice: 审判
  alternative: 定罪
  rationale: κρίσις 本身语义较广。上下文使第二种结局具有严肃的负面含义，但本节用词并未直接限定为“定罪”，因此保留经文本身的神学张力。
- issue: 善行和恶行与两种复活之间的关系
  choice: 保留经文的并列描述，不增添因果连接词
  alternative: 因行善而复活得生命／因作恶而复活被定罪
  rationale: 希腊文描述两类人及其复活结局，却未在本句明说功德因果机制；译文不加入“因而”等解释性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，以两个平行分句保留原文鲜明对照。“复活得生命／复活受审判”兼顾自然表达和结构对应；脚注标记置于相关句末。
