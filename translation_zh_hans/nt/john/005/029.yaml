  source_fidelity: 译文准确呈现了καὶ ἐκπορεύσονται的未来结果，以及两类人从坟墓中出来后的对照。“行善的／作恶的”对应τὰ ἀγαθὰ ποιήσαντες／τὰ φαῦλα πράξαντες，未把行为描述扩展为功德因果机制。“复活得生命／复活受审判”以简洁、平行的汉语表达两个εἰς短语；后者保留κρίσις较宽的“审判”含义。
  naturalness: 整体为自然、庄重的现代汉语。冒号后以“行善的，……；作恶的，……”构成平行排比，清楚且适合经文语体。“复活得生命”虽较凝练，但与“复活受审判”平行，在此语境中可理解为复活而得生命，并不生硬。
  terminology: “行善”“作恶”“生命”“审判”“复活”均为稳定、易懂且不过度宗派化的经文用语。“受审判”没有将κρίσις预先限定为“定罪”。脚注准确说明“被定罪”是较窄的替代性解释；标记置于相关对照句末，指向明确。
