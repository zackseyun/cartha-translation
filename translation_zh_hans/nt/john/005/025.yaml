  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：时候将到，现在就是了；死人[a]要听见上帝的儿子的声音，听见的人[b]就要活了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死人”在这里可能包括当下灵性上的意义（“现在就是了”），同时也预示上下文所说的身体复活。
    reason: cross_reference
  - marker: b
    text: “听见的人”也可译作“已经听见的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地
  rationale: 用现代汉语中庄重而自然的约翰式惯用表达传达双重“阿们”的郑重强调；直译“阿们，阿们”虽更形式对应，却不如正文译法易懂。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 保留对复数听众的直接讲话，同时比“对你们说”更符合自然现代汉语。
- source_word: ἔρχεται ὥρα
  choice: 时候将到
  rationale: ὥρα字面为“时刻/钟点”，在此具有约翰福音中特有的末世性分量；“时候”既自然，也避免把它缩窄为六十分钟。
- source_word: καὶ νῦν ἐστιν
  choice: 现在就是了
  rationale: 保留未来将到与当下已经临到并置的张力，并以简洁汉语表达希腊文压缩的措辞。
- source_word: οἱ νεκροὶ
  choice: 死人
  rationale: 不加“灵性上”或“肉身上”等解释，保留当前得生命与随后身体复活语境之间的开放性。
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: 要听见……的声音
  rationale: φωνή在位格性语境中宜译“声音”；“听见”不预先加入“听从”的回应含义。
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: 上帝儿子
  rationale: 直接呈现完整的基督论称号，中文清楚自然，不增加原文以外的说明。
- source_word: οἱ ἀκούσαντες
  choice: 听见的人
  rationale: 希腊文为不定过去主动分词，中文可自然概括为“听见的人”；脚注保留“已经听见”的体貌可能性。
- source_word: ζήσουσιν
  choice: 就要活了
  rationale: 直译ζάω的“活”，不强化为“复活过来”，以保留属灵得生命与身体复活的共鸣。
theological_decisions:
- issue: “死人”的所指
  choice: 正文仅译“死人”，不作限定
  alternative: “灵性已死的人”或“肉身已死的人”
  rationale: “现在就是了”提示当下层面，而约翰福音5章的后续经文又明确展望身体复活；译文不应消解这种有意的张力。
- issue: “上帝儿子”的基督论称号
  choice: 按原文完整保留
  alternative: “上帝的儿子”
  rationale: 二者在中文中均可表达属格关系；“上帝儿子”凝练庄重，并未添加原文以外的教义阐释。
- issue: ἀκούσαντες的时间与体貌
  choice: 正文译为一般性的“听见的人”
  alternative: “已经听见的人”
  rationale: 不定过去分词可突出听见这一完整事件，但在面向未来的陈述中，中文一般式更自然；以脚注保存另一种形式上更明确的理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留约翰式宣告的节奏以及“将到—现在就是”的末世张力。标点用于帮助普通读者把握语义层次；不加入宗派性解释。
