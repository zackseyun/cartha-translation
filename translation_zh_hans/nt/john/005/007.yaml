  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: zh_hans
  text: 那病人回答他说：“主啊，水被搅动的时候，没有人把我放进池子里；我正往那里去，别人就先下去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: 那病人
  rationale: 以自然简洁的现代汉语表达“患病的人”，并承接上下文中的特定人物。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριε在约翰福音中可兼具尊称与更深基督论含义的表达，不将其收窄为单纯的“先生”。
- source_word: κολυμβήθραν
  choice: 池子
  rationale: 准确表达供人进入的水池，并与本段场景相符。
- source_word: βάλῃ με
  choice: 把我放进
  rationale: 既体现此人需要他人帮助进入池中的意思，也避免“扔”在现代汉语中的不当语感。
- source_word: πρὸ ἐμοῦ καταβαίνει
  choice: 抢先下去了
  rationale: 自然表达“在我之前下去”，突出别人先于病人进入池中的结果。
theological_decisions:
- issue: 病人对耶稣的称呼κύριε
  choice: 主啊
  alternative: 先生
  rationale: 原词本身可作礼貌尊称，也可称“主”；译作“主啊”保留约翰叙事可能形成的神学张力，而不在译文中判定病人当时认识的深浅。
- issue: 水被搅动的原因
  choice: 只译“水被搅动的时候”
  alternative: 补明天使搅动池水
  rationale: SBLGNT本节没有说明水为何被搅动，因此不将部分抄本在5:3b–4中的解释加入正文。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言；引语流畅易懂，并尽量保留希腊文的语义次序与未明说之处。
