- from: 于是，他们问他：“对你说‘拿起来走吧’的那个人是谁？”
  to: 于是，他们问他：“对你说‘拿起来[a]，走吧’的那个人是谁？”
  rationale: 以逗号区分“拿起来”和“走吧”，避免汉语将其误读为单一的“拿着离开”命令。脚注说明原文所省略、而由上文可知的宾语；正文不补入“褥子”，从而保留希腊文表达的省略。
