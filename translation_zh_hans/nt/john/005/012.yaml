base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: zh_hans
  text: 于是，他们问他：“对你说‘拿起来[a]，走吧’的那个人是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文未明说“拿起来”的宾语；按上文语境，指那人所躺的褥子。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 问
  rationale: 不定过去时主动直说语气第三人称复数；此处是叙事中的询问，“问”自然准确，也不额外强化敌意。
- source_word: οὖν
  choice: 于是
  rationale: 承接上一节并显示由此而来的反应；“于是”符合现代汉语叙事语流。
- source_word: αὐτόν
  choice: 他
  rationale: 宾格阳性单数代词，指刚得医治的人，在汉语中作“问”的宾语。
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: 那个人是谁
  rationale: 指一个特定的人；汉语将疑问词置于句末更自然，同时保留原文所问的是其身份。
- source_word: ὁ εἰπών σοι
  choice: 对你说……的
  rationale: 带冠词的不定过去时分词作限定语，用那人先前所说的话来指认他。
- source_word: Ἆρον
  choice: 拿起来
  rationale: αἴρω的不定过去时主动命令式。原文未明说宾语，宾语由上文的褥子补足；中文可自然保留这种省略。
- source_word: καὶ περιπάτει
  choice: 走吧
  rationale: περιπατέω的现在时主动命令式。此处译作自然的命令语；句末“吧”使引语符合现代汉语表达，但不把时体扩展为“继续走”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。保留希腊文命令中宾语未明说的特点，因此不在正文补入“褥子”或“它”；上下文足以说明所指。
