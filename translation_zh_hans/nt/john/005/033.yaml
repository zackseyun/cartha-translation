  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: zh_hans
  text: 你们曾派人到约翰那里，他已经为真理作了见证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 保留第二人称复数；汉语无需加“你们自己”，以免把原文的强调表达得过重。
- source_word: ἀπεστάλκατε
  choice: 曾派人到
  rationale: 该动词为完成时，指先前发生且与当前论述有关的差派。汉语补出动词语义中自然隐含的受差者“人”，并用“曾”交代既往事件。
- source_word: πρὸς Ἰωάννην
  choice: 到约翰那里
  rationale: πρός加人名表示差派所朝向的对象；此处直称“约翰”，不擅自增补“施洗者”。
- source_word: μεμαρτύρηκε
  choice: 已经……作了见证
  rationale: 用“已经”和“作了见证”表达完成时所指的既成见证及其当前效力，同时保留证人、作证的语义场。
- source_word: τῇ ἀληθείᾳ
  choice: 为真理
  rationale: 此处与μαρτυρέω连用，表示为真理作见证；保留定冠词所指向的特定“真理”概念及其在约翰著作中的潜在神学分量。
theological_decisions:
- issue: 约翰著作中“真理”的含义
  choice: 真理
  alternative: 真实的事
  rationale: 原文带定冠词，可能不仅表示一般真实性，也具有约翰著作中的神学意蕴；译作“真理”可保留这种张力，而不进一步限定其教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“派人到约翰那里”比生硬的“差遣到约翰那里”更自然；“作了见证”保留原文的见证语汇。
