  naturalness: 整体为现代普通话，但“使我痊愈的那一位——就是他对我说”语法和语流略显生硬。改为“使我痊愈的那一位，他对我说”既自然，也以重复主语保留 ἐκεῖνος 的强调。
  terminology: “痊愈”“睡垫”用语准确、易懂，且未加入原文未明说的神学含义。脚注对睡卧用具的说明适切；“铺垫”可保留为词汇替代。
