source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: zh_hans
  text: 他却回答他们：“使我痊愈的那一位，他对我说：‘拿起你的睡垫[a]，走吧。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铺垫”；希腊语所指的是简便的睡卧用垫或铺具，并非带床架的床。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是叙事对话中常见的回应动词；“回答”直接、自然，也符合此处针对质问作答的语境。
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: 使我痊愈的那一位
  rationale: 用“那一位”表达带冠词的分词结构，并以“使我痊愈”自然呈现医治语境中的结果，不额外引入属灵层面的含义。
- source_word: ὑγιῆ
  choice: 痊愈
  rationale: 上下文所指的是身体得医治；“痊愈”在现代汉语中明确而自然，比可能带有更广泛神学意味的“完全”更贴近本处。
- source_word: ἐκεῖνός
  choice: 就是他
  rationale: 希腊文代词带有强调作用；用破折号和“就是他”保留这种回指与强调，而不简化为普通的“他”。
- source_word: Ἆρον
  choice: 拿起
  rationale: 准确表达具体动作的命令，在现代汉语中清楚自然。
- source_word: κράβαττόν
  choice: 睡垫
  rationale: 该词指简便的睡卧用垫或铺具，并非现代意义上的床架；“睡垫”既易懂，也避免“床”可能造成的误解。
- source_word: περιπάτει
  choice: 走吧
  rationale: 在医治命令中，“走吧”自然传达开始行走的吩咐；不必生硬地把现在时命令式展开为“继续走”。
- source_word: δὲ
  choice: 却
  rationale: 表达对前文质问或指责的轻微转折，比单纯的“于是”更能体现此处语气。
theological_decisions:
- issue: 医治描述是否包含更广泛的属灵含义
  choice: 使我痊愈
  alternative: 使我完全
  rationale: 本节直接陈述身体得医治。“痊愈”保留具体含义，不把原文没有明说的属灵完整或救恩意义加入译文。
- issue: ἐκεῖνός的强调是否保留
  choice: 那一位——就是他
  alternative: 那个人对我说
  rationale: 原文先以“使我痊愈的那一位”指明对象，再用强调代词回指。译文保留这一略显郑重的强调，避免把句法张力完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“睡垫”准确呈现简陋卧具；破折号保留原文ἐκεῖνός的强调。脚注标记紧接相关词语，避免咨询层英文脚注标记错位的问题。
