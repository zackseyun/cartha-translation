  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: zh_hans
  text: 你们从彼此领受荣耀，却不寻求从独一的上帝而来的荣耀，怎么能信呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”两处或译“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: 怎么能信呢
  rationale: 以现代汉语自然的反问表达能力或可能性，同时保留原文的修辞力度；不把“信”具体化为某一教义性含义。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确译出复数代词；汉语语境和反问句已足以承载其强调，无须增译“你们自己”。
- source_word: δόξαν ... τὴν δόξαν
  choice: 荣耀……荣耀
  rationale: 两处采用同一译词，以保留原文刻意形成的人际来源与神圣来源之间的对应和反差；“尊荣”也是合适的语境义，收入脚注。
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: 彼此接受荣耀
  rationale: 保留相互性和领受、接受之意；“接受”较符合这里主动看重人所给荣耀的语境，同时不额外加入“追求”等原文未明说的动作。
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: 从独一的上帝而来的荣耀
  rationale: 用关系结构自然表达重复冠词限定的来源短语，并清楚保留荣耀来自上帝的意思。
- source_word: μόνου θεοῦ
  choice: 独一的上帝
  rationale: 直接表达 μόνος 的排他性，符合自然、庄重的现代汉语，也不作超出经文的神学扩展。
theological_decisions:
- issue: 约翰语境中 πιστεῦσαι 的译法
  choice: 信
  alternative: 信靠
  rationale: “信”简洁且范围较广，保留 πιστεύω 在本节中的开放性，不预先限定其对象或教义内涵。
- issue: 两处 δόξα 的一致译法
  choice: 两处均译“荣耀”
  alternative: 两处均译“尊荣”
  rationale: 一致译法保留人所给予的 δόξα 与来自上帝的 δόξα 之间的词汇重复和神学张力；脚注说明更具社会性语感的备选译法。
- issue: τοῦ μόνου θεοῦ 的表达
  choice: 独一的上帝
  alternative: 唯一的上帝
  rationale: “独一的上帝”准确表达神的唯一性，且在现代中文宗教语体中自然庄重；不由此引申经文本身没有明说的基督论结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句序先呈现造成反问的两项处境，再以“怎么能信呢”收束，符合自然汉语信息结构，并保留原文反问、平行和对比。
