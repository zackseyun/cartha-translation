source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: zh_hans
  text: 因为有天使不时下到池中，搅动池水。水被搅动以后，第一个进入池里的人，无论患的是什么病，就会痊愈。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节（连同第3节后半部分）不见于现存最早的一些希腊纸草抄本，例如公元3世纪的纸草抄本66和75，也不见于两部重要的公元4世纪抄本《西奈抄本》和《梵蒂冈抄本》；但拜占庭多数文本传统以及早期拉丁文、叙利亚文译本均收录了这段话。许多学者认为，这是早期抄写者为解释残疾人为何聚集在池边而加上的文字。
    reason: textual_critical
  - marker: b
    text: “就会痊愈”或译“就痊愈了”。
    reason: previous_rendering
lexical_decisions:
- source_word: κατὰ καιρόν
  choice: 不时
  rationale: 该短语表示间或、周期性发生，并不明确指固定节期；“不时”自然保留这种不确定的反复性。
- source_word: κατέβαινεν
  choice: 下到
  rationale: 未完成时在本语境中表示过去惯常发生的动作；结合“不时”即可自然表达反复性。“下到”也保留了池子低于周围地面的空间意象。
- source_word: ἐτάρασσεν / ταραχή
  choice: 搅动／被搅动
  rationale: 词语表示使水受到扰动；译作“搅动”符合现代汉语，并以主动、被动形式再现原文的词根呼应。
- source_word: ἐμβὰς
  choice: 下到池里
  rationale: 该分词指进入池中；在上下文中用“下到池里”既自然，也与池子的空间场景吻合。
- source_word: ὑγιὴς ἐγίνετο
  choice: 就会痊愈
  rationale: 表示成为健康、恢复健康；“痊愈”简洁准确，而“会”配合语境表达过去反复出现的结果。
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: 无论患的是什么病
  rationale: κατέχω用于疾病时指被疾病缠住或侵袭；中文以惯用的“患病”表达，同时由“无论……什么”保留δήποτε的概括范围。
theological_decisions:
- issue: 天使搅动池水这一叙述的文本地位
  choice: 按所指定的拜占庭希腊文本将本节译入正文，并用脚注说明重要异文证据
  alternative: 依据较早的希腊抄本将本节仅置于脚注或括号中
  rationale: 本任务指定Robinson-Pierpont 2005拜占庭文本为原文来源，因此正文忠实翻译该节；同时，因其在早期重要见证中缺失，必须透明呈现文本批判信息，不把其抄本地位默认为毫无争议。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“不时……就会……”自然表达希腊文未完成时所呈现的惯常反复动作；句式避免古奥，也不额外断定天使行动的具体周期或疾病种类。
