base_translation:
  language: en
  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: zh_hans
  text: 那里有一个人，患病已有三十八年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“身体软弱已有三十八年”。希腊语ἀσθένεια可泛指身体软弱或疾病。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: 有
  rationale: δέ在这里是轻微的叙事连接词，并不表示强烈转折；现代汉语可借助句式自然推进叙事，不必另加“但”或“这时”。
- source_word: τις ἄνθρωπος
  choice: 一个人
  rationale: τις与ἄνθρωπος合用，引入一位身份未明的人；“一个人”自然、准确，也不带“某一个人”可能产生的刻意强调。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 指向上文所述地点，直接译为“那里”。
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: 三十八年
  rationale: 按现代汉语通常的数词表达翻译。
- source_word: ἔχων
  choice: 已有
  rationale: 该现在分词与表示时段的宾格及后面的介词短语共同描述一种延续至当时的状态；“已有”清楚体现持续时间。
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: 患病
  rationale: ἀσθένεια可泛指身体软弱或疾病；在本段医治语境中，“患病”自然贴切，同时不具体限定病症，词义幅度以脚注保留。
