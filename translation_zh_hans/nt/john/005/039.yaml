id: JHN.5.39
reference: John 5:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: zh_hans
  text: 你们查考圣经，因为你们以为其中有永生[a]；正是这些经文为我作见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要查考圣经，因为你们以为其中有永生。”希腊文“查考”也可理解为命令语气。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: 你们查考
  rationale: 该形式既可作陈述语气，也可作命令语气。上下文更自然地描述听众一贯的行为，因此正文采用陈述式“你们查考”；命令式的可能性保留在脚注中。
- source_word: τὰς γραφάς
  choice: 圣经
  rationale: 在约翰福音的语境中，γραφή指以色列的神圣经卷；现代汉语通常以“圣经”表达。
- source_word: ὅτι
  choice: 因为
  rationale: 此处最自然地表原因，说明他们为何查考圣经。
- source_word: δοκεῖτε
  choice: 以为
  rationale: 表达他们所持的看法或判断，并保留语境中含蓄的批评意味。
- source_word: ἐν αὐταῖς
  choice: 其中
  rationale: 直译其所在含义，并明确回指圣经。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是约翰著作中的固定重要用语；“永生”是准确而通行的现代汉语表达。
- source_word: ἐκεῖναί
  choice: 正是这些经文
  rationale: 阴性复数指回前面的“圣经”；“正是”体现指示词的强调，“经文”避免汉语中重复说“圣经”为我作见证的不自然。
- source_word: αἱ μαρτυροῦσαι
  choice: 为……作见证
  rationale: 保留约翰福音中重要的见证与司法语义，同时符合现代汉语习惯。
- source_word: περὶ ἐμοῦ
  choice: 为我
  rationale: 结合“作见证”译为“为我作见证”最自然，准确表达这些经文见证有关耶稣之事。
theological_decisions:
- issue: Ἐραυνᾶτε的语气
  choice: 陈述式：“你们查考圣经”
  alternative: 命令式：“你们要查考圣经”
  rationale: 希腊文形式容许两种理解。紧接的原因从句及后文的责备更支持陈述式，即耶稣描述他们正在做的事，却指出他们没有来到经文所见证的那一位面前。脚注保留命令式，以免消除原文真实的歧义。
- issue: 圣经与永生的关系
  choice: “你们以为其中有永生”
  alternative: “你们以为借着圣经有永生”
  rationale: 采用“其中”对应ἐν αὐταῖς，不把原文明确改释为工具关系；同时保留耶稣话语中对听众理解的批评张力。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“查考圣经”“永生”“作见证”兼顾教会语汇的熟悉度与一般读者的可理解性；用“正是这些经文”清楚回指前句并体现强调。
