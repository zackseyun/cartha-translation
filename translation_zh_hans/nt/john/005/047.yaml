source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: zh_hans
  text: 但你们若不信他所写的，怎会信我的话呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若
  rationale: 以“但”承接上文并保留 δέ 的转折作用，以“若”表达 εἰ 的条件关系；符合现代汉语庄重而自然的语序。
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: 他所写的
  rationale: γράμματα 在此依上下文指摩西写下的内容，而非私人书信；“他所写的”既自然，又不额外限定为某一类文献。
- source_word: οὐ πιστεύετε
  choice: 你们不信
  rationale: πιστεύω 在此指相信、接受所写内容为真；“信”能简洁地保留本节两处动词的呼应。
- source_word: πῶς
  choice: 怎会
  rationale: 与将来时 πιστεύσετε 配合，表达由前一条件引出的反问及未来指向，同时保持自然汉语。
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: 我的话
  rationale: ῥήματα 指耶稣所说的话；“我的话”自然、准确，并保留与“他所写的”之间的对照。
- source_word: πιστεύσετε
  choice: 会信
  rationale: 以“会”体现将来直陈式，并与前句的“信”保持词汇一致。
theological_decisions:
- issue: ἐκείνου（“他”）所指何人
  choice: 按紧接的上下文理解为摩西，但正文仍译作“他”
  alternative: 在正文中明确译作“摩西”或理解为泛指他人
  rationale: 约翰福音5:45–46已明确提到摩西及他所写的内容；保留代词可忠实呈现原文衔接，也不必把上下文信息重复加入本节。
- issue: πιστεύω 的语义
  choice: 两处均译为“信”
  alternative: 译为“信靠”或分别采用不同译词
  rationale: 本节重点是是否相信摩西所写的和耶稣所说的；统一译作“信”保留修辞平行，也避免将其过度限定为某种神学化的“信靠”。
- issue: γράμματα 的文献性质
  choice: 译作“他所写的”，不明确加上“圣经”或“书信”
  alternative: 译作“他的经卷”“他的著作”或“他的书信”
  rationale: 原词可指字母、书面内容或著述；本语境确指摩西所写的内容，但原文本身没有使用专指“圣经”的词，故采用较开放而语境清楚的表达。
translation_notes:
  register: 采用现代标准普通话的简洁、庄重表达。“但你们若……”保留论证中的转折和条件关系；“怎会……呢”呈现原文反问语气。由于中文“他所写的”已能自然涵盖此处 γράμματα 的语境意义，且“书信”并非本处合适所指，因此不设置词义备选脚注。
