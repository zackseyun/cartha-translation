id: JHN.5.30
reference: John 5:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: zh_hans
  text: 我凭自己什么也不能做；我怎样听见，就怎样审判。我的审判是公正的，因为我不寻求自己的旨意，而是寻求那位差遣我的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: 我……不能
  rationale: 直接保留否定的能力表达；汉语以“我”作主语已足以自然呈现原文显明的第一人称，避免生硬强化。
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: 凭自己什么也不能做
  rationale: “凭自己”兼顾ἀπ’ ἐμαυτοῦ所含的来源和独立行动之意；“什么也不能做”自然对应否定语境中的οὐδέν。
- source_word: καθὼς ἀκούω κρίνω
  choice: 我怎样听见，就怎样审判
  rationale: 采用“怎样……就怎样……”清楚保留καθὼς所表达的对应关系，同时维持ἀκούω与κρίνω的一般现在意义。
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: 审判 / 我的审判
  rationale: 保留约翰语境中的司法用语及同根词呼应，不弱化为“决定”。
- source_word: δικαία
  choice: 公正的
  rationale: 与“审判”搭配自然，准确表达司法判断的正当与公平。
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: 我不寻求自己的旨意
  rationale: “寻求”保留ζητῶ的追求、以之为目标的含义；“自己的”体现原文所有格的强调。
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: 而是寻求那差我来者的旨意
  rationale: 在对比结构中补出汉语所需的“寻求”，并以“那差我来者”准确呈现分词短语，不擅自改称“父”。
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ所表达的子与差他者之间的关系
  choice: 译作“凭自己”，表达不以自己为独立来源而行动
  alternative: “靠自己”或“独自”
  rationale: 原文强调耶稣不脱离差他者而行动，并非明说能力上的绝对缺失。“凭自己”保存这种来源与非独立性的张力，而不在正文中加入教义解释。
- issue: δικαία修饰κρίσις
  choice: 译作“公正的”
  alternative: “正义的”或“公义的”
  rationale: 此处是审判语境，“公正”在现代汉语中最自然地表达判断的正当、公平；这一词汇选择并不排除其道德正直内涵。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“旨意”“审判”保留经文的重要神学与司法词汇；句式清晰，并以“怎样……就怎样……”呈现原文逻辑。无需脚注，因为“凭自己”已能自然兼顾来源与非独立行动两层含义。
