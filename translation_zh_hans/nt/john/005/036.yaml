id: JHN.5.36
reference: John 5:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: zh_hans
  text: 然而，我有一项见证，比约翰的见证更大[a]；因为父交给我、要我完成的那些工作——就是我正在做的这些工作——为我作见证，表明父差我来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我有比约翰更大的见证。”
    reason: 希腊语的比较结构在“约翰”之后省略了所比较的“见证”。正文补出该省略成分以使现代汉语清楚自然；脚注保留较简约、较贴近原文形式的表达。
lexical_decisions:
- source_word: μαρτυρίαν
  choice: 见证
  rationale: “见证”既可指证明性的话，也可指具有证据作用的事物，符合本段近似法庭论证的语境，并能与下文动词“作见证”形成词语呼应。
- source_word: μείζω
  choice: 更大的
  rationale: 直译其比较级含义，保留见证在分量、权威或效力上更大的开放性，不具体收窄为“更重要”或“更有力”。
- source_word: τοῦ Ἰωάννου
  choice: 比约翰的见证
  rationale: 按上下文补出省略的比较对象“见证”，使现代汉语清楚自然；脚注保留较贴近希腊语省略形式的译法。
- source_word: ἔργα
  choice: 工作
  rationale: “工作”可涵盖耶稣受父委派而做的一切事，不把所指仅限于神迹，同时保留《约翰福音》中该词的使命色彩。
- source_word: δέδωκέν μοι
  choice: 交给我
  rationale: 表达父把这些工作托付给耶稣去完成的关系；汉语语境已能体现这项托付的持续效力，无须机械添加完成体标记。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 保留原文特指称谓及其关系性意义，不擅自增添“我的”或改成“上帝”。
- source_word: ἵνα τελειώσω αὐτά
  choice: 要我完成的
  rationale: 自然表达ἵνα从句的目的含义，并保留τελειόω所指把受托工作做成、完成的意义。
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: 就是我正在做的这些工作
  rationale: 用“就是”与“这些”体现原文αὐτά的强调，以“正在做”呈现现在时所指的持续活动。
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: 为我作见证
  rationale: 保留约翰著作中反复出现的见证用语，也准确表达这些工作提供有关耶稣之证据的功能。
- source_word: ἀπέσταλκεν
  choice: 差了我来
  rationale: “差……来”是自然、庄重的现代汉语使命表达；句末“来”体现差遣的方向及其现今结果。
theological_decisions:
- issue: 为耶稣作证之事物的范围
  choice: 把ἔργα译为“工作”，指父交托耶稣完成的活动整体
  alternative: 译为“神迹”，仅指超自然行动
  rationale: 原文使用范围较广的ἔργα，并未在本节把它限定为神迹；保留较宽范围可避免将耶稣使命的见证作用不当地缩窄。
- issue: 父与耶稣的关系称谓
  choice: 译为“父”
  alternative: 译为“上帝”或“我的父”
  rationale: 原文是ὁ πατήρ，没有明确的物主成分；“父”既保留基督论关系，也不增添原文没有的措辞。
- issue: 工作的见证内容
  choice: 译为“表明父差了我来”
  alternative: 解释为工作只证明耶稣拥有行神迹的权柄
  rationale: ὅτι从句明确给出见证内容是父差遣耶稣；译文照录这一主张，不把见证的意义局限为能力证明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接前文并形成转折；破折号保留原句对“这些工作”的强调性复说。正文中的脚注标记[a]与脚注对应。
