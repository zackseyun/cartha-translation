  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: zh_hans
  text: 那人立刻痊愈了，拿起他的睡垫[a]，走了起来[b]。那一天是安息日[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“褥子”或“简易床铺”。希腊语κράβαττον指可携带的简易卧具，不一定是大型床具。
    reason: lexical_alternative
  - marker: b
    text: 或译“走动着”。希腊语未完成过去时可以强调持续的动作；在这里也可理解为那人痊愈后开始行走。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“那天正逢安息日”。希腊文直译为“在那一天是安息日”。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达医治即时发生，简洁自然，也符合叙事语体。
- source_word: ἐγένετο ὑγιὴς
  choice: 痊愈了
  rationale: 原文直指那人由患病转为健康的状态；“痊愈了”在现代汉语中自然，并不额外明说被动施事者。
- source_word: ὁ ἄνθρωπος
  choice: 那人
  rationale: 指向上下文中已知的男子；汉语用“那人”简明自然。
- source_word: ἦρε
  choice: 拿起
  rationale: 此处指把可携带的睡垫拿起来，与下文行动相连；“拿起”是现代汉语的直接表达。
- source_word: κράβαττον
  choice: 睡垫
  rationale: 该词指简易、可携带的卧具，并非通常意义上的大型床具；“睡垫”既清楚又符合场景。
- source_word: περιεπάτει
  choice: 走了起来
  rationale: 未完成过去时可突出持续走动，也可在此语境中呈现恢复行走后的起始动作；“走了起来”自然地保留后一可能，脚注注明前者。
- source_word: Ἦν δὲ
  choice: 那一天是
  rationale: δέ在此主要引出叙事背景说明，不必译成强烈转折；汉语另起一句即可自然体现话题转换。
- source_word: σάββατον
  choice: 安息日
  rationale: 这是犹太人的安息日。汉语没有冠词，译作“安息日”既可表达类别，也不会强行判定希腊语无冠词形式在汉语中无法体现的定指程度。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 那一天
  rationale: 准确、自然地表达原文的时间指示。
theological_decisions:
- issue: 叙事中σάββατον的定指程度
  choice: 安息日
  alternative: 那天正逢一个安息日／那天正是安息日
  rationale: 希腊文此处无冠词；现代汉语没有与希腊语冠词直接对应的形式，因此正文采用自然且不额外限定的“安息日”，不借译文引入有关该日身份的额外神学判断。
- issue: 医治结果中施事者是否明说
  choice: 痊愈了
  alternative: 被治好了
  rationale: ἐγένετο ὑγιὴς字面为“成为健康”，并非被动式。上下文清楚表明医治与耶稣的话有关，但本节不明说施事者，译文也不额外补出。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“睡垫”避免现代读者误以为那人搬动大型床具；“走了起来”与医治场景衔接自然，同时用脚注保留未完成过去时可能表达的持续意味。
