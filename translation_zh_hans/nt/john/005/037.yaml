  rationale: The revision retains the perfect-result sense with “作了见证” and the emphatic force of ἐκεῖνος with “正是他,” while using natural modern Mandarin. Replacing “形体” with “形貌” avoids constraining εἶδος to a physical body and leaves the referent appropriately open. The final comma is retained because the source verse continues syntactically into the following verse.
