id: JHN.5.37
reference: John 5:37
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: zh_hans
  text: 差我来的父，正是他为我作了见证[a]。你们从未听见过他的声音，也从未看见过他的形貌[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他亲自为我作了见证。”希腊语指示代词 ἐκεῖνος 在“差我来的父”之后带有强调作用。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的外貌。”希腊语 εἶδος 可指可见的形貌或外在形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: 那差我来的父
  rationale: 定冠词化的不定过去时分词 πέμψας 修饰 πατήρ，译为现代汉语关系结构“差我来的父”，保留其识别作用；“那”也使后文 ἐκεῖνος 的回指更自然。
- source_word: ἐκεῖνος
  choice: 就是他
  rationale: 该指示代词回指并强调“父”。“就是他”在现代汉语中既自然，又保留其明确而强调的指示意味。
- source_word: μεμαρτύρηκεν
  choice: 为我作了见证
  rationale: 保留 μαρτυρέω 的见证语义；“作了见证”能够表达已经发生且仍具效力的完成时意义。
- source_word: περὶ ἐμοῦ
  choice: 为我
  rationale: 在“作见证”这一汉语搭配中，“为我作见证”自然表达关于、涉及耶稣的见证；并未增添受益含义。
- source_word: οὔτε ... οὔτε
  choice: 从未……也未……
  rationale: 用成对否定表达两个并列事实；首项的“从未”同时传达 πώποτε 在否定句中的“从来没有”之意。
- source_word: φωνὴν αὐτοῦ
  choice: 他的声音
  rationale: φωνή 在听觉语境中自然指“声音”，此译直接清楚。
- source_word: πώποτε ἀκηκόατε
  choice: 从未听见过
  rationale: “从未”表达否定范围内的“任何时候都没有”，“过”体现经验性，与希腊语完成时相称。
- source_word: εἶδος αὐτοῦ
  choice: 他的形体
  rationale: εἶδος 可指可见的形态或外貌。“形体”保留其可见形式的语义宽度，不把经文限定为单纯的面貌。
- source_word: ἑωράκατε
  choice: 未看见过
  rationale: “看见过”自然表达截至当前并无此经验，与 ἀκηκόατε 构成平行。
theological_decisions:
- issue: 如何表达指父的强调性指示代词 ἐκεῖνος
  choice: 正文译作“——就是他为我作了见证”
  alternative: “他亲自为我作了见证”或仅译“他为我作了见证”
  rationale: “就是他”保留指示代词本身的回指和强调，不将其无声地改释成反身强调；破折号帮助现代汉语自然呈现这一突出作用。
- issue: 如何翻译 εἶδος αὐτοῦ
  choice: 他的形体
  alternative: 他的外貌／他的形貌
  rationale: “形体”既贴近可见形式，也不预先裁定这里所指的是具体显现、外在样貌，还是更广义的可感知形态，从而保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父”“作见证”保留约翰福音的核心用语；用“就是他”呈现原文强调，避免生硬的逐词对应。依照所给经节边界保留句末逗号，表明语意在下一节延续。
