source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：凡听我的话并信差遣我的那一位的人，就有永生；他不进入审判[a]，反而已经从死进入生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可译作“定罪”。希腊词 κρίσις 可泛指审判，也可在本语境中指不利的审判结果。
    reason: lexical_alternative
  - marker: b
    text: 希腊语在这里使用完成时，表示这一转变已经完成，其结果仍然持续：这个人已经从死进入生命。
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 采用现代汉语中庄重而自然的强调表达，传达重复的“阿们”作为郑重宣告引语的作用；不机械音译，却保留其 solemn、确定的语气。
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: 听我的话、又信……的人
  rationale: 两个带冠词的现在分词描述具有这种特征的一般对象。“……的人”自然传达泛指，不增加原文没有的性别限定；“又”清楚连接听与信。
- source_word: τὸν λόγον μου
  choice: 我的话
  rationale: 既可指耶稣所说的话和信息，也保留约翰著作中 λόγος 的用词呼应；比“我的信息”更贴近原文。
- source_word: πιστεύων τῷ πέμψαντί με
  choice: 信那差我来者
  rationale: πιστεύω 后接与格，在此表示相信、信靠某人。“信那……者”简洁地保留这一人际指向，同时不擅自扩写为某种宗派性的信仰公式。
- source_word: ἔχει ζωὴν αἰώνιον
  choice: 有永生
  rationale: 现在时 ἔχει 表明永生是当前拥有的现实；“永生”是 ζωὴ αἰώνιος 在约翰语境中准确、清楚且通行的译法。
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: 不进入审判
  rationale: 保留 εἰς 的进入方向感，并用较宽泛的“审判”对应 κρίσις，避免直接限定为“定罪”；上下文本身显示这里所指的不利结局。
- source_word: μεταβέβηκεν
  choice: 已经……进入……了
  rationale: 以“已经”和句末“了”表达希腊语完成时所指的已完成转变及其持续结果；在汉语中比直译为“已经越过”更自然。
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: 从死进入生命
  rationale: 保留“从……进入……”的方向结构，以及死亡与生命之间鲜明的约翰式对比。
theological_decisions:
- issue: 救恩语境中 κρίσις 的含义
  choice: 审判
  alternative: 定罪
  rationale: 在本节语境中，这审判显然带有不利后果，但 κρίσις 本身的词义范围比明确的“定罪”更广。正文采用“审判”，脚注说明语境中的另一种理解，以保留原文张力。
- issue: 现在时与完成时对救恩现实的表达
  choice: 现在有永生，并且已经从死进入生命
  alternative: 永生和称义完全只是将来的事
  rationale: ἔχει 是现在时，μεταβέβηκεν 是完成时；译文据此呈现当前的拥有和已经完成且结果持续的转变，不把这种时态证据纳入任何特定宗派体系。
- issue: πιστεύω 加与格的关系性含义
  choice: 信那差我来者
  alternative: 信入那差我来者／只认同有关他的陈述
  rationale: 该结构可包含相信与信靠的关系性含义。简洁译作“信……者”既符合现代汉语圣经语域，也不把词义缩减为纯理智认同或扩展为原文未明说的神学术语。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我实实在在地告诉你们”保留耶稣郑重宣告的语气；分号呈现两个并列的救恩陈述。避免文言化的“诚然诚然”“差我者”，也避免口语化过度。
