source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: zh_hans
  text: 因此，犹太人[a]越发想要杀害他，因为他不但破坏安息日的规定，而且称上帝为他自己的父亲，使自己与上帝同等。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰福音中的“犹太人”常按语境较具体地指反对耶稣的犹太地区人士或某些犹太权威，并非不加区别地指每一个犹太人。
    reason: cultural_note
  - marker: b
    text: 或译作“使自己等同于上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: 因此
  rationale: 两个承接、推论成分在现代汉语中合译为“因此”最自然，并清楚连接上文；若机械叠加为“为此，所以”则显得累赘。
- source_word: μᾶλλον
  choice: 越发
  rationale: 准确表达比较性的加强，说明他们杀害耶稣的意图进一步加剧。
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: 想要杀
  rationale: 未完成时表示持续的意图或企图；“越发想要杀他”在汉语中自然，并保留其持续、加剧的意味。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按希腊文本保留这一群体称谓，不在正文中直接缩窄为“犹太领袖”；其具体语境范围以脚注说明。
- source_word: ἔλυε τὸ σάββατον
  choice: 破坏安息日的规定
  rationale: λύω在此指破坏或解除安息日规范；补出“规定”符合现代汉语表达，也表明这是有关守安息日的指控，而不是字面破坏某个日子。
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: 称上帝为自己的父
  rationale: 保留ἴδιον所强调的“自己的”，呈现这一独特父子关系宣称的力度。
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: 使自己与上帝同等
  rationale: 直接对应分词结构及ἴσος的含义，保留经文对该宣称所作的强烈推论，不弱化为仅仅“自称”或“仿佛”。
theological_decisions:
- issue: “与上帝同等”是叙述者的断言，还是反对者对耶稣言行的理解
  choice: 正文保留“使自己与上帝同等”，不额外添加“他们认为”
  alternative: 声称自己与上帝同等／他们认为他使自己与上帝同等
  rationale: 希腊文用结果或伴随情形的分词短语直接表述，未明说“他们认为”。译文应保留其高基督论力度，也不把后来的教义术语加入正文；脚注指出另一种可行的汉语表达。
- issue: “犹太人”的具体所指
  choice: 正文译作“犹太人”，脚注按约翰福音语境加以限定说明
  alternative: 犹太领袖／犹太地区的人
  rationale: 原文οἱ Ἰουδαῖοι本身具有一定语境弹性。正文保留词面范围，脚注防止读者误解为毫无分别地泛指所有犹太人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越发想要杀他”避免过度书面化；“破坏安息日的规定”清楚传达习语意义；“自己的父”和“与上帝同等”保留原文的强调及神学张力。所有脚注标记均已置于正文。
