id: JHN.5.6
reference: John 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: zh_hans
  text: 耶稣看见这人躺着，又知道他已经这样很久了[a]，就问他：“你想康复吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他已经在那里躺了很久。”也可理解为：“他患这种病已经很久了。”
    reason: 原文直译近于“他已经有很长时间”，没有明说持续的是在那里的时间，还是患病的时间。
lexical_decisions:
- source_word: τοῦτον
  choice: 这人
  rationale: 指上文那位患病的人；“这人”在现代汉语中明确、自然。
- source_word: ἰδὼν
  choice: 看见
  rationale: 以顺承叙事表达先于主句发生的分词动作，避免生硬直译。
- source_word: κατακείμενον
  choice: 躺着
  rationale: 准确描述此人当时卧倒的姿态；地点已由上下文交代，无须在词内增添“那里”。
- source_word: γνοὺς
  choice: 知道
  rationale: 保留经文只陈述耶稣知情、却未说明他如何得知的克制表达。
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: 他已经这样很久了
  rationale: 原文直译近于“他已经有很长时间”，所省略的具体状态须由语境补足。“这样”自然指他躺卧、患病的处境，同时不把含义过度限定为患病年限或在场时长。
- source_word: λέγει αὐτῷ
  choice: 就问他
  rationale: 历史现在时按汉语叙事习惯处理；因后接直接问句，“问”比泛称“说”更自然，“就”体现前述观察与发问的衔接。
- source_word: Θέλεις
  choice: 你想
  rationale: 简明表达意愿或愿望，不额外强化为正式的“你愿意”。
- source_word: ὑγιὴς γενέσθαι
  choice: 康复
  rationale: 整体表达进入健康状态的意思；“康复”自然凝练，并保留从病弱状态转变为健康状态的动态含义。
theological_decisions:
- issue: 耶稣得知此人情况的方式
  choice: 只译作“知道”，不说明知识来源
  alternative: 明确译成耶稣以超自然方式知道，或从观察、询问中得知
  rationale: 原文没有说明耶稣如何知道，因此译文不替经文作神学判定。
- issue: πολὺν ἤδη χρόνον ἔχει所指的持续状态
  choice: 正文用“已经这样很久了”，保留其由语境补足的开放性
  alternative: 限定为患病已久，或限定为在那里躺了很久
  rationale: 希腊文没有明说宾语或状态；“这样”既承接躺卧处境，也可涵盖长期病况，避免无依据地排除其中一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“你想康复吗？”直接自然，符合耶稣问话的简洁语气；不用较文言的“痊愈乎”或偏书面的“成为健康”。
