  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: zh_hans
  text: 你们里面没有常存着他的话[a]，因为你们却不信他所差来的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在你们里面”。
    reason: μένω 可译为“常存”或“住”；后者较具形象性，并保留《约翰福音》中这一动词的特色用法。
lexical_decisions:
- source_word: λόγον
  choice: 话
  rationale: 这里指上帝所说、所启示的话。“话”符合现代汉语，也保留《约翰福音》中 λόγος 的用词呼应；译作“信息”虽可行，却较为解释性。
- source_word: ἔχετε
  choice: 有
  rationale: 用“有”直接表达现在时的 ἔχετε，并与后面的分词结构结合为“没有他的话常存在你们里面”，不额外加入“持守”或“接受”等含义。
- source_word: ἐν ὑμῖν μένοντα
  choice: 常存在你们里面
  rationale: μένω 表示持续停留或存在；“常存在”保留其持续意味，“在你们里面”忠实保留 ἐν ὑμῖν，未将其限定为“心里”。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι 在这里引出前述判断的原因，“因为”清楚表达其因果关系。
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: 他所差来的这一位
  rationale: 关系从句指父所差来的耶稣，但原文没有在本节直呼其名；译文保留代词指称，并以“这一位”承接后面前置、带强调的 τούτῳ。
- source_word: τούτῳ ὑμεῖς οὐ πιστεύετε
  choice: 这一位，你们并不信
  rationale: τούτῳ 在原文中前置以示强调。汉语用话题结构“这一位，你们并不信”既自然，也保留该强调；“信”则不额外限定为只相信其言论或采用特定神学意义的“信靠”。
theological_decisions:
- issue: 上帝的话常存在人里面与不信受差者之间的关系
  choice: 按原文的因果表达，指出他们不信父所差来的这一位，因此没有父的话常存在他们里面。
  alternative: 可将“话常存在里面”具体解释为在内心持守圣经，或进一步解释为重生、内住等系统神学概念。
  rationale: 译文保留经文本身的因果逻辑和约翰式张力，不把“常存在”收窄为单指记住或遵守经文，也不引入特定宗派对重生、内住或坚忍的界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“常存在你们里面”略带经文语体，但含义清楚，并忠实保留原文“在你们里面”的空间性表达；后半句使用汉语话题结构以再现原文对“这一位”的强调。
