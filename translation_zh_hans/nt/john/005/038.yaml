  rationale: 修订仅改善现代汉语的句法和措辞：将“常存在”调整为“常存着”，并将后句重组为自然的宾语结构。译文仍保留父以“他”指称、耶稣为“他所差来的那一位”、以及不信与上帝的话不存留于人里面之间的因果关系；未引入系统神学解释。
