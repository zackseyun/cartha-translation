  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: zh_hans
  text: 如果我为自己作见证，我的见证就不是真的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的见证就不算有效。”这里可能是从见证在法律上能否成立的角度说的。
    reason: 说明 ἀληθής 在见证语境中可能具有“有效、能成立”的含义，同时保留正文较直接的译法。
lexical_decisions:
- source_word: Ἐὰν
  choice: 如果
  rationale: 引出条件从句；“如果”自然直接，不额外加入反复发生的意味。
- source_word: ἐγὼ
  choice: 我
  rationale: 希腊文使用显式主语，略带强调；汉语保留“我”既自然，也体现这一重点。
- source_word: μαρτυρῶ
  choice: 作见证
  rationale: 保留 μαρτυρέω 的见证及司法语境色彩；“作见证”在现代汉语中庄重而易懂。
- source_word: περὶ ἐμαυτοῦ
  choice: 为自己
  rationale: 在汉语见证语境中，“为自己作见证”自然表达就自身而作证；既可指关于自己，也可带有替自己作证的语感，而不把法律含义限定得过窄。
- source_word: ἡ μαρτυρία μου
  choice: 我的见证
  rationale: 与前面的“作见证”保留同源词呼应，并符合约翰福音相关段落的用语。
- source_word: οὐκ ἔστιν ἀληθής
  choice: 就不是真的
  rationale: 直接保留 ἀληθής 的“真实”语义和原文张力，不在正文中将其窄化为仅仅“不具法律效力”。“就”自然标明条件与结果的关系。
theological_decisions:
- issue: 耶稣说自己的见证“不是真的”应如何理解
  choice: 正文直译为“我的见证就不是真的”
  alternative: “我的见证就不算有效”或“我的见证就不能成立”
  rationale: ἀληθής 的直接含义是“真实的”，正文应保留它与约翰福音8:14之间的表面张力。上下文确有见证规则的司法背景，因此“有效”是合理解释，但不应在正文中先行消解原文张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“作见证／见证”保留原文动词与名词的呼应；正文不以司法解释取代原文的“真实”措辞。
