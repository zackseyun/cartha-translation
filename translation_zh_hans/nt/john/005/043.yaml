  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: zh_hans
  text: 我奉我父的名[a]而来，你们却不接纳我；若另有一人奉自己的名[b]而来，你们倒会接纳他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭我父的权柄。”希腊语“奉……的名”也可表示代表某人或凭某人的权柄行事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“凭自己的权柄。”这里与耶稣“奉我父的名”而来形成鲜明对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: 而来
  rationale: 希腊语完成时表示已经来到且其结果延续至今；汉语在本节语境中用“而来”自然表达现时临在，避免生硬地补出“已经”。
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: 奉我父的名
  rationale: “奉……的名”是现代汉语中自然且庄重的表达，既保留“名”的字面和神学意蕴，也可涵盖代表与权柄之义。
- source_word: οὐ λαμβάνετέ με
  choice: 你们却不接纳我
  rationale: 此处 λαμβάνω 指接受、认可耶稣，而非实际拿取；“接纳”能兼顾接受其本人及其使命的含义。“却”呈现原文 καί 在语境中的转折效果。
- source_word: ἄλλος
  choice: 别人
  rationale: 简洁保留另一人同耶稣之间的对照，不额外限定此人的身份。
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: 奉自己的名
  rationale: 与“奉我父的名”形成清楚的平行和反差，并保留自行代表、自具权柄等含义空间。
- source_word: ἐκεῖνον λήμψεσθε
  choice: 你们倒会接纳他
  rationale: 重复“接纳”维持原文的修辞对照；“倒”自然凸显听众拒绝耶稣却接受另一人的反常反差，未来式译为“会”。
- source_word: πατρός μου
  choice: 我父
  rationale: 现代中文圣经语体中“我父”可清楚指向耶稣的父，并保持庄重简洁；中文没有以首字母大写标示神圣称谓的手段。
theological_decisions:
- issue: 是否在正文中明说“我父”就是父神
  choice: 保留“我父”，不增译“神”
  alternative: 译作“父神”或“我的父神”
  rationale: 约翰福音语境清楚表明所指，但原文只说“我的父”；不增译可避免加入原文未明说的称谓，同时保留父子关系的直接表达。
- issue: 是否把“奉……的名”直接解释为权柄用语
  choice: 两处都保留“奉……的名”
  alternative: 译作“带着我父的权柄”及“凭自己的权柄”
  rationale: 原文措辞可包含代表、授权和名本身的意蕴。正文保留同构表达，既维持文学反差，也不把多义习语缩窄为单一的权柄解释。
- issue: 是否把“别人”具体解释为假基督或敌基督
  choice: 只译“别人”
  alternative: 增译为“另一个冒名而来的人”“假基督”或“敌基督”
  rationale: ἄλλος 本身没有明确指定该人的身份；保留泛指可避免导入经文没有明说的末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉……的名”保留两分句的平行结构；“接纳”比“接待”更适合此处对耶稣本人及其宣称的接受。“却”与“倒”使原文的强烈反差在汉语中自然显明。
