  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: zh_hans
  text: 不要对此感到惊奇，因为时候将到，那时，所有在坟墓里的人都要听见他的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: 不要对此感到惊奇
  rationale: μή加现在时命令语气构成禁止；“感到惊奇”自然、庄重，也保留θαυμάζω在此处的语义力度。
- source_word: τοῦτο
  choice: 此
  rationale: 直接保留指示代词，回指上文所说之事；与“对此”组合符合现代汉语习惯。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出不要惊奇的理由，译作“因为”清楚呈现因果关系。
- source_word: ἔρχεται ὥρα
  choice: 时候将到
  rationale: 既表达将来的时刻，也保留约翰著作中ὥρα可能具有的特殊分量；汉语不必机械补出不定冠词。
- source_word: ἐν ᾗ
  choice: 那时
  rationale: 以自然的现代汉语表达关系结构“在那时候”，而不损失时间关联。
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: 所有在坟墓里的人
  rationale: πάντες οἱ substantivally表示“所有……的人”；μνημεῖον在本语境指安放死者的墓穴或坟墓，“坟墓”准确且具体。
- source_word: ἀκούσουσιν
  choice: 都要听见
  rationale: 准确表达将来时主动直陈语气；“都”与前面的“所有”呼应，符合汉语表达。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: 他的声音
  rationale: φωνή在个人发声的语境中通常指“声音”；ἀκούω所带的属格无需在汉语中扩译。
theological_decisions:
- issue: 坟墓里的人听见声音所隐含的复活图景
  choice: 保留“坟墓”的具体埋葬意象，不在经文中明说“复活”
  alternative: 译作“死人都要复活并听见他的声音”
  rationale: 本节指向复活，但译文应保留原文自身的表达方式，不把隐含的神学内容扩写成明说。
- issue: “他的声音”中代词所指
  choice: 保留“他的”
  alternative: 明确译作“人子的声音”或“耶稣的声音”
  rationale: 原文使用代词αὐτοῦ，其所指由上下文确定；保留代词可避免在本节中添加原文未重复的称谓。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“不要对此感到惊奇”避免过于古雅的“不要希奇”；“时候将到，那时”保留约翰式的时间表述，同时读来顺畅。本节没有需要设置的实质性中文词义异文脚注；英语脚注关于“tombs/graves”的区别在中文“坟墓”中无需复制。
