  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: zh_hans
  text: 因此，犹太人[a]不断逼迫耶稣，因为他在安息日做这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”；按本段语境，也可理解为“犹太领袖”。在约翰福音中，这个称呼常指反对耶稣的某一群人，并非不加区别地泛指所有犹太人。
    reason: 说明可能的译法和语境所指，避免将经文理解为对所有犹太人的概括。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 承接上文所述事件并表达原因；“正因如此”在现代汉语中自然、明确地保留其因果作用。
- source_word: ἐδίωκον
  choice: 不断迫害
  rationale: 该未完成时描写持续或反复的敌对行动；“不断迫害”既体现体貌，又不提前引入第18节明确出现的杀意。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 保留该词直接的族群—宗教称谓，不在正文中把所指解释性地缩窄为“犹太领袖”；脚注说明其在本语境中可能特指反对耶稣的一群人。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示，回指此前叙述的行为。
- source_word: ἐποίει
  choice: 做
  rationale: 与“不断迫害”及语境配合，表达耶稣所做之事；希腊文未完成时的持续或反复意味由整句语境体现，避免生硬译为“正在做”。
- source_word: ἐν σαββάτῳ
  choice: 在安息日
  rationale: 符合现代汉语表达，并准确标示行动发生于安息日。
theological_decisions:
- issue: 约翰福音中 οἱ Ἰουδαῖοι 的所指与译法
  choice: 犹太人
  alternative: 犹太地区的人；按语境也可理解为犹太领袖
  rationale: 正文采用直接词义，以免无明文依据地缩窄所指；同时用脚注保留约翰语境中的指称弹性，并防止把敌对行动笼统归于所有犹太人。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“正因如此……因为……”保留原文两重因果结构；“不断迫害”明确呈现未完成时所表达的持续或反复敌对行动。
