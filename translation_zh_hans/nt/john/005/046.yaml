  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: zh_hans
  text: 其实，你们若信摩西，也会信我，因为他写的是关于我的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 如果……因为
  rationale: γάρ把本句与上文的论证相连；汉语中将理由自然置于后半句，用“因为”明确保留其因果衔接。εἰ引出与事实相反的条件。
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: 你们如果信摩西
  rationale: πιστεύω后接与格，表示相信摩西及其所写的话。“信”既自然简洁，也便于保留两处同一希腊动词的呼应。
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: 也会信我
  rationale: 未完成时与ἄν构成与事实相反的条件句结果项，译作“会”。ἐμοί为与格，因此译作“信我”，不增添原文没有的εἰς所常表达的“信入／信靠”意味。
- source_word: περὶ γὰρ ἐμοῦ
  choice: 因为……关于我的事
  rationale: περί加属格表示“关于、论及”。“关于我的事”符合现代汉语，并保留摩西著作涉及耶稣这一主张而不加以扩展。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 该强调性指示代词回指摩西；汉语用“他”最自然，所指在语境中清楚。
- source_word: ἔγραψεν
  choice: 写过
  rationale: 不定过去时指摩西已经完成的写作；“写过”自然表达既往事实，同时避免把时态解释得过细。
theological_decisions:
- issue: 摩西如何为耶稣作见证
  choice: 他写过关于我的事
  alternative: 那一位曾写到我
  rationale: 译文保留原文关于摩西著作论及耶稣的断言，但不指定某一段经文，也不在翻译中扩展为特定的基督论诠释体系。
- issue: “信摩西”与“信我”的关系
  choice: 两处均译为“信”
  alternative: 前者译“相信”，后者译“信靠”
  rationale: 原文两处使用同一个动词πιστεύω并同样接与格；统一译法保留其修辞和论证联系，避免为后一句加入原文未明确标出的不同信仰层次。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。通过“如果……也会……”表达与事实相反的条件关系；不另加脚注，因为主要词义和句法关系可在正文中清楚保留。
