  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: zh_hans
  text: 于是，犹太人[a]对那已经痊愈的人说：“今天是安息日，你搬运[b]褥子[c]是不合律法的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“犹太人的领袖”，也可能指“犹太地区的人”，取决于约翰在这里怎样使用这一称谓。
    reason: alternative_reading
  - marker: b
    text: 或作“拿起”或“带走”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“褥子”指可以随身搬动的睡垫或简陋卧具，不一定是完整的床。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示过去持续或反复的言说；现代汉语在单次叙事场景中通常用“说”自然表达，不强加“一直”或“反复”的含义。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文的医治事件，并推动叙事发展；“于是”自然保留其连接和结果意味。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按原文保留这一群体称谓；本节本身没有明确限定为领袖或犹太地区的人，因此不在正文中缩窄所指。
- source_word: τῷ τεθεραπευμένῳ
  choice: 对那已经痊愈的人
  rationale: 完成时被动分词表示医治已经完成且结果仍然存在；“已经痊愈的人”在现代汉语中自然地传达这一点。
- source_word: Σάββατόν ἐστιν
  choice: 今天是安息日
  rationale: 原文直陈“是安息日”；汉语补出语境隐含的“今天”，使时间判断清楚自然，并未改变命题内容。
- source_word: οὐκ ἔξεστίν σοι
  choice: 你……是不合律法的
  rationale: ἔξεστιν表示获准或合乎律法；此处涉及安息日规范，“不合律法”保留法律—宗教语气。
- source_word: ἆραι
  choice: 拿着
  rationale: αἴρω可表示拿起、拿走或携带；“拿着”保持动作表达自然，同时不把意义过度限定为某一种搬运方式。
- source_word: κράβαττον
  choice: 褥子
  rationale: 该词指可携带的简陋卧具或铺垫；“褥子”避免让读者误以为是带床架的完整床铺。
theological_decisions:
- issue: 《约翰福音》中οἱ Ἰουδαῖοι的所指
  choice: 犹太人
  alternative: 犹太人的领袖；犹太地区的人
  rationale: 本节没有明说这些人是领袖，也没有突出地域身份。正文保留原文较宽的称谓，并以脚注说明约翰语境中可能存在的较窄所指，避免把有争议的解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不合律法”保留安息日争议中的规范性语气；正文不擅自把“犹太人”限定为宗教领袖。脚注标记均紧随其所解释的词语。
