source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: zh_hans
  text: 他是那盏燃烧发光的灯；你们却曾愿意在他的光中欢喜一时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一时”也可译作“一段时间”。原文指有限的时间，并不一定是字面上的一个小时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: 他
  rationale: 在上下文中明确指施洗约翰；现代汉语用“他”自然承接，同时不额外增添解释。
- source_word: λύχνος
  choice: 灯
  rationale: 该词指可点燃照明的灯，并非抽象的“光”；这样保留约翰作为发光之灯、却不是终极之光的意象区别。
- source_word: καιόμενος καὶ φαίνων
  choice: 燃烧发光
  rationale: 两个现在分词共同描写灯持续燃烧并照出光亮的状态；合译为“燃烧发光”简洁自然，也保留两重动作。
- source_word: ἠθελήσατε
  choice: 曾情愿
  rationale: 表达过去一度出于意愿而接受或乐于如此；“曾”体现不定过去时语境，“情愿”保留意愿色彩，但不强化为坚定选择。
- source_word: ἀγαλλιαθῆναι
  choice: 欢喜
  rationale: 该词表示强烈的喜悦；“欢喜”在现代汉语中自然、庄重，也适合圣经语体。
- source_word: πρὸς ὥραν
  choice: 片刻
  rationale: 此短语表示有限的一段时间，不必理解为字面上的一个小时；“片刻”清楚传达其短暂性。
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: 在他的光中
  rationale: 保留介词短语的空间性比喻，表达众人在约翰所发之光中欢喜，而不把约翰直接等同于“光”。
theological_decisions:
- issue: 约翰与耶稣在《约翰福音》光之意象中的区别
  choice: 把约翰译为“灯”，并把他所发出的称为“他的光”。
  alternative: 把约翰译为“光”。
  rationale: 原文以 λύχνος 称约翰，而非以 φῶς 直接称他。译作“灯”保留约翰作为见证者和次级照明者的角色，也不在正文中加入超出原文的神学说明。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“那盏”体现原文定冠词所指的特定之灯；分号保留前后关于约翰身份与听众短暂回应之间的转折。“燃烧发光”避免生硬直译，同时保持灯的具体意象。
