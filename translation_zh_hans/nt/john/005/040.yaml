id: JHN.5.40
reference: John 5:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: zh_hans
  text: 然而，你们不肯到我这里来，好使你们得生命[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而你们不愿到我这里来，好使你们得生命。”希腊语连词καί也可直译为“而、并且”；θέλετε也可译为“愿意、想要”。
    reason: lexical_alternative
  - marker: b
    text: 在约翰福音中，“生命”常有更深的含义，指从神而来的生命，也就是永生；但本节原文没有出现“永恒的”一词。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: 然而
  rationale: καί通常意为“和、并且”，但此处承接上文并形成转折：“你们查考圣经……然而不肯到我这里来。”“然而”自然表达语境中的逆接关系；脚注保留直译“而”的可能。
- source_word: οὐ θέλετε
  choice: 你们不肯
  rationale: θέλω表示意愿、想要或愿意。“不肯”突出意志层面的不愿，又不像“拒绝”那样强化为明确的拒绝行动。
- source_word: ἐλθεῖν πρός με
  choice: 到我这里来
  rationale: ἐλθεῖν与πρός加宾格表示来到某人这里。保留约翰福音中“到耶稣这里来”的具体意象，不在正文中释义为“信我”。
- source_word: ἵνα
  choice: 好使
  rationale: ἵνα在此引出目的。“好使”以自然、庄重的现代汉语保留目的关系。
- source_word: ζωὴν
  choice: 生命
  rationale: ζωή意为“生命”。在约翰福音中常具有从神而来的生命、永生的深层含义，但本节没有明说αἰώνιος“永恒的”，因此正文不增译“永生”。
- source_word: ἔχητε
  choice: 你们得
  rationale: ἔχω在此指拥有或获得生命。汉语“得生命”简洁自然；目的从句中的虚拟语气由“好使”充分体现，无须另加表示不确定性的词。
theological_decisions:
- issue: 是否把ζωὴν译为“生命”或“永生”
  choice: 生命
  alternative: 永生
  rationale: 约翰常以ζωή表达具有救恩意义、从神而来的生命，但本节没有αἰώνιος“永恒的”。正文保留原词的表达范围，不把合乎上下文的神学内涵增入字面。
- issue: 是否在正文中把“到我这里来”解释为相信耶稣
  choice: 到我这里来
  alternative: 信我；凭信心到我这里来
  rationale: 在约翰福音中，“来”与“信”关系密切，但原文使用具体的“来”。保留这一意象，可避免把隐喻直接改写为解释。
- issue: οὐ θέλετε所表达的人之意愿应译到何种强度
  choice: 不肯
  alternative: 不想；拒绝
  rationale: “不肯”准确呈现意志上的不愿，同时避免“拒绝”可能带来的更强行动色彩，也比“不想”更能体现责备语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不肯”保留责备中的意志重点；“到我这里来”保持约翰式具体意象；“得生命”简洁自然。正文两个脚注标记均置于相关句末。
