id: JHN.5.2
reference: John 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: zh_hans
  text: 在耶路撒冷，羊门[a]附近有一个池子，希伯来话[b]叫作毕士大[c]，有五道柱廊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“羊的”或“羊之处”，很可能指羊门一带；“门”字是根据耶路撒冷的地理背景补出的。参尼希米记3:1；12:39。
    reason: cross_reference
  - marker: b
    text: 也可理解为“亚兰话”。约翰所说的“希伯来话”常指犹太地区当地的闪米特语言，不一定专指古典希伯来语。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“伯特匝他”或“伯赛大”，而不是“毕士大”。
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: 有
  rationale: 保留现在时存在表达；δέ仅作轻微衔接，不另加含时间意义的“如今”。
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: 按现代汉语地名惯用形式译出，不反映希腊词形上的复数。
- source_word: ἐπὶ τῇ προβατικῇ
  choice: 羊门附近
  rationale: 原文为省略结构，προβατικῇ很可能指耶路撒冷的羊门或其一带；正文补出“门”，并以脚注说明。
- source_word: κολυμβήθρα
  choice: 一个池子
  rationale: 用普通读者容易理解的现代汉语表达蓄水池或水池之意，不擅自限定其具体用途。
- source_word: ἡ ἐπιλεγομένη
  choice: 叫作
  rationale: 自然简洁地表达该池的名称。
- source_word: Ἑβραϊστὶ
  choice: 希伯来话
  rationale: 忠实保留原文“希伯来语”的表述，同时用脚注交代约翰的用语也可能泛指当地的闪米特语言，即亚兰语。
- source_word: Βηθεσδά
  choice: 毕士大
  rationale: 依所给SBLGNT正文音译；其他抄本中的名称异文置于脚注。
- source_word: πέντε στοὰς ἔχουσα
  choice: 有五道柱廊
  rationale: στοά指有柱的遮蔽式廊道；“柱廊”准确而且适合现代汉语，保留分词所表达的附属特征。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“羊门附近”避免把省略结构误解为另一个池子；三处脚注依正文出现顺序编号，以清楚区分地理补足、语言含义和抄本异文。
