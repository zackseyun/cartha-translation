  rationale: 修订“正要去”为“正前往”，以反映持续行进的未完成时；将不自然的“就在……陆地了”改为“到了……陆地”，使现代汉语通顺，同时仍以“立刻”保留原文所呈现的突然性和叙事张力。脚注保留“岸边／抵达”的语境化替代，未对事件作机制性解释。
