  naturalness: “于是，他们愿意接他上船”自然且适合叙事语体。将目的地改作“他们正前往的陆地”，并以“到了”表达船忽然处于目的地，既通顺，也保留εὐθέως的强烈即时性。
  terminology: “接他上船”“船”“陆地”均合乎语境和现代标准汉语。“陆地”保留γῆ的较宽泛含义；脚注可列“岸边”为语境化替代，而不在正文限定其义。
