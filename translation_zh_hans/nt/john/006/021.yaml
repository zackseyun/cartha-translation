source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: zh_hans
  text: 于是，他们愿意接他上船；船立刻就到了他们正前往的陆地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“船立刻就抵达了他们正前往的岸边。”
    reason: γίνομαι 配合处所短语可表达“来到、抵达”；γῆ 在此语境中可具体指“岸边”。此译法更明确地点出岸边，正文则保留“陆地”的较宽泛表述。
lexical_decisions:
- source_word: ἤθελον
  choice: 愿意
  rationale: 未完成时在此结合上下文表达一种意愿或准备接受的态度；“愿意”既自然，也不把它强化为热切的渴望。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文门徒听见耶稣的话后作出的反应，既表达叙事上的结果，也符合现代汉语行文。
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: 接他上船
  rationale: λαμβάνω 在具体场景中可指接纳或带入；“接他上船”简洁自然，准确呈现让耶稣进入船中的动作。
- source_word: πλοῖον
  choice: 船
  rationale: 加利利海上的这类船只用现代汉语“船”最自然，无须使用带有大型船舶意味的词。
- source_word: εὐθέως
  choice: 立刻
  rationale: 保留事件发生的突然性与紧迫感，不将其弱化为“很快”或“随后”。
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: 船立刻就在……那片陆地了
  rationale: 以状态变化式表达船忽然处在目的地，尽量贴近 γίνομαι 加处所短语的结构，同时避免说成船搁在陆地上。
- source_word: γῆς
  choice: 陆地
  rationale: γῆ 在此指航程所达的陆地；“陆地”比“岸边”更形式对应，后者作为语境化译法列入脚注。
- source_word: εἰς ἣν ὑπῆγον
  choice: 他们正要去的那片
  rationale: “正要去”保留未完成时所呈现的持续行进方向，关系结构也清楚修饰目的地。
theological_decisions:
- issue: 是否将船立刻处于目的地的叙述解释为普通抵达，从而淡化可能的神迹意味
  choice: 保留“立刻就在……了”的突变式表述
  alternative: 船立刻抵达了他们正前往的岸边
  rationale: 希腊文简短直接，并用 εὐθέως 突出即时性。正文不解释事件机制，也不将“立刻”弱化，以保留叙事本身的张力；较常规的“抵达岸边”译法放在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“接他上船”口吻自然；分号清楚区分门徒的意愿与船随即处于目的地这两个紧密相连的动作。正文刻意保留略显突兀的“立刻就在……了”，以体现原文的突然性。
