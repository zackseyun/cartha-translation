  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: zh_hans
  text: 我是从天上降下来的、活着的粮。任何人若吃这粮，就必活到永远。[a]而我将要赐下、为使世界得生命的粮，就是我的肉。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活到永远”也可较直译为“活到那世代”；这里的表达指永远长存。
    reason: lexical_alternative
  - marker: b
    text: 原文是“我的肉”，不是“我的身体”；措辞有意具体而鲜明。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: 活粮
  rationale: ζῶν是修饰ἄρτος的分词，直译为“活的粮”；“活粮”在现代汉语中简洁庄重，也避免误作本节并未使用的“生命之粮”这一邻近表述。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: 从天上降下来的
  rationale: 以关系性修饰语自然表达已完成的“降下”，保留其真实下降的陈述，不另作解释。
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: 任何人若吃这粮
  rationale: ἐάν加虚拟语气构成一般条件；τις译为不限定性别的“任何人”。汉语“吃这粮”自然表达ἐκ所表示的取食关系，无须生硬译作“从这粮中吃”。
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: 就必活到永远
  rationale: 在约翰语境中，εἰς τὸν αἰῶνα是持续至永远的惯用表达；“活到永远”清楚保留其末世性力度。
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: 并且，我将要赐下的粮
  rationale: δὲ在此推进论述而非强烈转折，译为“并且”；将来时“将要赐下”保留即将发生的自我给予。
- source_word: ἡ σάρξ μού ἐστιν
  choice: 就是我的肉
  rationale: σάρξ在这里具体指“肉”，措辞有意鲜明；译作“身体”会缓和原文并加入解释。
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: 是为世人的生命而赐的
  rationale: ὑπέρ表达为了、使之得益的关系；“世人”在此自然传达κόσμος所涵盖的人类范围，而不将其缩窄为某一群体。“而赐的”补明汉语中与前句δώσω的关系。
theological_decisions:
- issue: 耶稣自称中的σάρξ含义
  choice: 正文译为具体的“肉”
  alternative: 译为“身体”
  rationale: 原词具体且在上下文中有意形成冲击力；保留“肉”可避免预先解决圣餐性或其他神学诠释。
- issue: κόσμος的范围
  choice: 译为“世人”，不限定其内部范围
  alternative: “世界”或特定的得救群体
  rationale: 此处谈的是生命所惠及的对象，现代汉语用“世人”较自然地表达κόσμος的人类指向，同时不将范围收窄为某个预设群体。
- issue: “从天上降下”所具有的基督论力度
  choice: 按真实的下降直接翻译
  alternative: 解释为纯粹象征性的差遣
  rationale: 译文如实保留约翰文本的陈述及其道成肉身意味，不在正文中将其削弱为隐喻。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“粮”延续约翰福音中ἄρτος作为可食之粮的意象；使用“任何人”避免汉语中不必要的性别限定。所有脚注标记均置于相关正文之后。
