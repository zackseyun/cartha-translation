  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: zh_hans
  text: 但你们中间有些人并不信。原来，耶稣从起初就知道哪些人不信，也知道谁将要出卖他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖”或译“交出去”。
    reason: 保留παραδίδωμι较字面的词义，同时说明正文依据叙事语境采用的译法。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成转折，现代汉语中简洁自然。
- source_word: ἐξ ὑμῶν τινες
  choice: 你们中间有些人
  rationale: 表达这些人属于耶稣当时所面对的群体，比直译为“从你们中有些人”自然。
- source_word: οἳ οὐ πιστεύουσιν
  choice: 并不信
  rationale: πιστεύω在约翰福音中兼有相信与信靠的内涵；“信”简洁地保留其宽广含义，且汉语无需另加进行体来表达希腊语现在时。
- source_word: ᾔδει
  choice: 知道
  rationale: οἶδα的过去形态在此表示耶稣当时持续具有的认识；结合“从起初”已清楚呈现过去时间关系。
- source_word: ἐξ ἀρχῆς
  choice: 从起初
  rationale: 保留原文对起点的开放性，不擅自限定为创造之初、事工之初或门徒跟从之初。
- source_word: οἱ μὴ πιστεύοντες
  choice: 哪些人不信
  rationale: 自然表达带冠词的实体化分词所指的一类人，同时与前句保持词语呼应。
- source_word: παραδώσων
  choice: 将要出卖
  rationale: 未来分词表示后来将发生的行为；在犹大把耶稣交给敌对者的叙事语境中，“出卖”自然传达其背叛性质。较字面的译法列入脚注。
- source_word: αὐτόν
  choice: 他
  rationale: 指耶稣；现代汉语可自然使用第三人称代词。
theological_decisions:
- issue: 门徒回应耶稣的语境中πιστεύω的译法
  choice: 信
  alternative: 信靠
  rationale: “信”是约翰著作中πιστεύω自然且范围较宽的译法，既不排除认知上的相信，也不把关系性的信靠单独强化为唯一含义。
- issue: 指犹大行为的παραδίδωμι如何翻译
  choice: 出卖
  alternative: 交出去
  rationale: 该词本义可以是“交出”，但本段叙事指向犹大以背叛方式把耶稣交给敌对者；正文用“出卖”传达语境中的背信性质，脚注保留较字面的表达。
- issue: ἐξ ἀρχῆς所指的时间起点
  choice: 从起初
  alternative: 从一开始
  rationale: 原文没有明确界定“起初”是哪一个起点，因此不在译文中替读者作具体判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“原来”自然表达γάρ在此解释前句的作用；两个“不信”保持原文重复，不刻意换词。脚注标记紧接其所说明的“出卖他”。
