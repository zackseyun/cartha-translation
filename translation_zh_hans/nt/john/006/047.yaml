  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：信的人[a]有永生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凡信的人”。希腊语原文是带冠词的现在时分词，直译为“那相信的人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“永恒的生命”。该希腊语短语较按字面可译为“属于时代（世代）的生命”；其具体含义须按上下文理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 实实在在地
  rationale: 这是约翰福音中引出郑重宣告的重复语。译作“实实在在地”既保留双重强调，又符合现代汉语庄重、自然的表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 直接表达现在时动词和复数间接受词；“告诉你们”在现代汉语中比“对你们说”更自然，同时保留郑重宣告的语气。
- source_word: ὁ πιστεύων
  choice: 信的人
  rationale: 原文是带冠词的现在时主动分词，指以相信为特征的人。“信的人”简洁自然，并未把对象或信的方式补入原文。
- source_word: ἔχει
  choice: 有
  rationale: 保留希腊语现在时的明确断言：永生是信的人现在就有的，而不是仅在将来才会有。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是现代汉语中自然、凝练且广为理解的表达，既涵盖生命的恒久性，也不排除约翰语境中的生命性质。
theological_decisions:
- issue: 永生是否为现在已经拥有
  choice: 有永生
  alternative: 将会有永生
  rationale: 原文ἔχει是现在时。“有永生”忠实保留当下拥有的陈述；改成将来时会超出原文，并消解经文本身的末世张力。
- issue: ὁ πιστεύων所指范围
  choice: 信的人
  alternative: 凡信的人
  rationale: “信的人”较贴近带冠词的实体化分词，同时在汉语中可以作概括性称谓；脚注列出“凡信的人”，以保留其可能具有的泛指意味，而不在正文中强化原文未明说的范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实实在在地”保留约翰式双重ἀμήν的强调；冒号使郑重引语的节奏在汉语中更清楚。正文简洁，不补出相信的对象，也不把现在时改为将来时。
