  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: zh_hans
  text: 这并不是说有人见过父；唯独那位从上帝那里来的[a]见过父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上帝那里来”也可理解为“从上帝面前来”或“在上帝身边”。希腊语短语除了表示来源，也可能带有亲近、同在的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: 这并不是说
  rationale: 引出对上文的澄清或限定，而非表示原因；这样译能自然保留纠正语气。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 约翰福音中对上帝的典型称谓；汉语用“父”简洁庄重，不额外增添原文没有的限定。
- source_word: ἑώρακέν τις
  choice: 有人见过
  rationale: 在否定语境中，τις泛指任何人；“见过”自然表达完成且至今相关的经历。
- source_word: εἰ μὴ
  choice: 唯独
  rationale: 此处标明唯一例外，不是提出条件；“唯独”同时体现排他和强调。
- source_word: ὁ ὢν
  choice: 那位……来的
  rationale: 将实体化的现在分词按现代汉语关系结构表达，指明一位以其持续身份或关系为特征的人。
- source_word: παρὰ τοῦ θεοῦ
  choice: 从上帝那里来
  rationale: παρά加属格通常可表示来源；“从上帝那里来”既符合约翰用语，也略保留关系与临在的空间色彩。
- source_word: οὗτος
  choice: （承前省略主语）
  rationale: 原文指示代词强调回指前述那一位；现代汉语在后半句自然省略重复主语，而“唯独那位”的结构已承载焦点。
- source_word: ἑώρακεν
  choice: 见过
  rationale: 用汉语经验体“过”表达完成行为及其持续相关性。
theological_decisions:
- issue: παρὰ τοῦ θεοῦ所表达的那一位与上帝的关系
  choice: 从上帝那里来
  alternative: 在上帝身边／从上帝面前来
  rationale: 正文保留来源这一最自然的语义，同时借“那里”避免把短语压缩为纯粹的差遣或起源概念；脚注说明它也可能含有亲近、同在的意味，不进一步规定其形而上含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这并不是说”明确承接上文作限定；“唯独”凸显唯一例外。脚注标记置于整句末尾，说明与“从上帝那里来”相关的词义可能性。
