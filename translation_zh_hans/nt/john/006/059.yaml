  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: zh_hans
  text: 这些话是耶稣在迦百农的会堂里教导时说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指回前面整段言论；“这些话”既保留复数所指，也比“这些事”更符合说话语境。
- source_word: εἶπεν
  choice: 是耶稣……说的
  rationale: 直译为“说了”。希腊文动词本身未明说主语，但上下文清楚指耶稣；汉语若仅用“他”容易在独立经节中指代不明，因此补明“耶稣”。
- source_word: ἐν συναγωγῇ
  choice: 在……的会堂里
  rationale: 虽无冠词，但介词ἐν加单数名词在此可指当地特定的会堂；用“会堂”准确表达犹太人聚会和教导的场所。
- source_word: διδάσκων
  choice: 教导时
  rationale: 现在分词表示与主句“说”同时进行的动作；“教导时”自然表达这一时间关系。
- source_word: ἐν Καφαρναούμ
  choice: 在迦百农
  rationale: 按通行中文圣经地名音译Καφαρναούμ，并保留其地点含义。
