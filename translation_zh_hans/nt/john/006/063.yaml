  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: zh_hans
  text: 赐生命的是圣灵[a]；肉体毫无益处[b]。我对你们所说的话是灵[c]，是生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赐生命的是灵”。希腊语 πνεῦμα 既可指“圣灵”，也可指“灵”；这里的上下文较支持指圣灵。
    reason: alternative_reading
  - marker: b
    text: “肉体”也可泛指纯属人的层面；这里若译成“罪性”，会比希腊原文作出更多解释。
    reason: lexical_alternative
  - marker: c
    text: 或理解为“是圣灵和生命”，或意译为“是属灵的，并且赐生命”。希腊原文的说法凝练，偏重性质。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 定冠词结构以及《约翰福音》的上下文较支持指赐生命的圣灵；同时以脚注保留“灵”的可能译法。
- source_word: ζῳοποιοῦν
  choice: 赐生命
  rationale: 现在时分词表达使之活、不断赋予生命的作用；“赐生命”在现代汉语中自然，并适合有位格的主语。
- source_word: ἡ σὰρξ
  choice: 肉体
  rationale: 保留原文宽泛而有张力的“肉体”，不将其窄化为“罪性”、单纯身体或人的努力。
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: 毫无益处
  rationale: 准确传达绝对否定，语言简洁自然。
- source_word: τὰ ῥήματα
  choice: 话
  rationale: 这里指耶稣所说的言语；“话”比“词语”更符合现代汉语语境。
- source_word: λελάληκα
  choice: 所说的
  rationale: 汉语关系结构自然表达已经说出且仍具效力的话，无须生硬标示希腊语完成时。
- source_word: πνεῦμά ἐστιν
  choice: 是灵
  rationale: 保留无冠词谓语的凝练、性质性表达，不直接解释成“是圣灵”或“是属灵的”。
- source_word: ζωή
  choice: 生命
  rationale: 这是约翰著作中重要且常见的生命用语，直译清楚恰当。
theological_decisions:
- issue: 首句 πνεῦμα 的所指
  choice: 正文译作“圣灵”
  alternative: 译作“灵”，可理解为一般的属灵原则或人的灵
  rationale: 上下文中的赐生命职能及定冠词结构较支持圣灵这一确定所指，但原词本身仍容许“灵”，故在脚注保留歧义。
- issue: σὰρξ 与圣灵的对照
  choice: 保留“肉体”这一宽泛用语
  alternative: 译作“罪性”、“人的力量”或“身体”
  rationale: 原文没有明确限定为其中任何一种；保留“肉体”可避免输入特定的人论体系，并保存耶稣话语中的张力。
- issue: 末句 πνεῦμά ἐστιν 的谓语性质
  choice: 译作“是灵”
  alternative: “是圣灵”、“是属灵的”或“能赐生命”
  rationale: 无冠词谓语较适合按性质理解。直译式的“是灵”保留原文的凝练和开放性，避免把耶稣的话与圣灵直接等同，或将其解释性改写。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“赐生命的是圣灵”以焦点结构再现希腊文主语与分词的强调；末句保留“是灵，是生命”的简洁并列。所有脚注标记均置于相关正文之后。
