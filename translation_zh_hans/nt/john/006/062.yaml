id: JHN.6.62
reference: John 6:62
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: zh_hans
  text: 那么，如果你们看见人子升到他先前所在的地方，又会怎样呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，如果你们看见人子升到他先前所在的地方呢？”希腊文是省略了结果部分的条件反问句。
    reason: 保留原文条件反问结构及较贴近形式的译法。
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 那么，如果……又会怎样呢
  rationale: 既表达οὖν承接上文的推论语气，也保留ἐὰν的条件意味；补出“又会怎样呢”使希腊文省略结果句的反问在现代汉语中自然显明。
- source_word: θεωρῆτε
  choice: 你们看见
  rationale: θεωρέω在此指亲眼看见、目睹；“看见”简明自然，语境已足以传达所见之事的显著性。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留福音书中耶稣惯用的称号及其可能包含的但以理书背景，不作解释性改写。
- source_word: ἀναβαίνοντα
  choice: 升到
  rationale: 表达向上移动，并与后面的地点从句自然衔接；不擅自补明“天上”或“父那里”。
- source_word: ὅπου ἦν τὸ πρότερον
  choice: 他先前所在的地方
  rationale: 忠实保留先前所在之处的含义及经文对先存的暗示，却不把地点进一步明确化。
theological_decisions:
- issue: 是否明确把人子的上升解释为回到天上或父那里
  choice: 保留“升到他先前所在的地方”，不增添具体地点
  alternative: 升回天上／升到父那里
  rationale: 原文有先前存在及上升的强烈含意，但没有在本节明说“天”或“父”；译文让其基督论张力按原貌呈现。
- issue: 如何呈现省略结果句的条件反问
  choice: 在正文补出汉语惯用的“又会怎样呢”
  alternative: 直译为“那么，如果你们看见人子升到他先前所在的地方呢？”
  rationale: 希腊文形式是带反问作用的条件句，结果部分需由语境领会；正文采用自然汉语显出反问功能，同时用脚注保留较贴近形式的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子”沿用通行的圣经称号；“先前所在的地方”避免文言化，也不超出原文明确所说的范围。
