base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: zh_hans
  text: 于是，他们对他说：“主啊[a]，请一直把这饼赐给我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生。”希腊语这个称呼既可用作表示尊敬的称谓，也可指“主”。
    reason: 说明Κύριε在此可作礼貌敬称，也保留“主”的含义。
lexical_decisions:
- source_word: εἶπον
  choice: 他们……说
  rationale: 不定过去时在叙事对话中自然表达为“说”；主语由动词的第三人称复数形式和上下文补出为“他们”。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并表示由前述谈论引出的回应；“于是”在现代汉语叙事中自然，也不过度强化逻辑推论。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: πρός加宾格与说话动词连用时表示说话对象，汉语惯用“对他说”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος作为尊称及可能具有更深基督论含义的语义空间；呼格用“啊”自然呈现直接称呼。另以脚注注明也可理解为礼貌称呼“先生”。
- source_word: πάντοτε
  choice: 常常
  rationale: 表达持续、反复供应的请求，符合此处πάντοτε“总是、一直”的含义；现代汉语中与“赐给”搭配自然。
- source_word: δὸς
  choice: 请……赐给
  rationale: δίδωμι的不定过去时命令式提出直接请求；加入“请”符合汉语请求语气，“赐给”适合向“主”请求供应的庄重语域，但不额外增添技术性神学含义。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 作为δίδωμι的间接宾语，直接译为“给我们”。
- source_word: τὸν ἄρτον τοῦτον
  choice: 这饼
  rationale: “饼”准确承接约翰福音本段反复出现的ἄρτος；“这”保留指示词τοῦτον，指向刚才谈及的饼。
theological_decisions:
- issue: 对耶稣的直接称呼Κύριε
  choice: 主啊
  alternative: 先生
  rationale: 听众此时对耶稣的认识未必已经充分，但原词既可作礼貌尊称，也可能带有更深的“主”之含义。正文采用“主啊”以保留这种开放性，并用脚注交代较弱的尊称义，避免替读者消解张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“于是，他们对他说”保持叙事衔接；“请常常把这饼赐给我们”清楚表达持续供应的请求。脚注标记紧随“主啊”，对应其词义歧义。
