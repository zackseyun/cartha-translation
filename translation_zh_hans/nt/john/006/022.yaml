  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: zh_hans
  text: 第二天，仍在海那边的群众看见，那里除了一只小船[a]以外，没有别的小船；又看见耶稣没有同他的门徒一起上那只船[b]，而是门徒自己离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小船”也可译作“船”；希腊语此处使用了指小形式πλοιάριον。
    reason: lexical_alternative
  - marker: b
    text: 本节一些抄本和版本在“小船”（πλοιάριον）与“船”（πλοῖον）之间存在异文；正文各处按所采用的希腊文本措辞翻译。
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 第二天
  rationale: 这是表示时间的惯用语，承接前一天发生的事；“第二天”简洁自然。
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: 仍在……的群众
  rationale: 完成时分词表示站立后持续处于当地的状态；“仍在”自然传达群众留在那里的意味，又避免生硬直译为“站着”。
- source_word: πέραν τῆς θαλάσσης
  choice: 在海那边
  rationale: 表示位于海的另一边；该表达符合约翰福音的地理叙述，也适合现代汉语。
- source_word: εἶδον
  choice: 发现
  rationale: 此动词本义为“看见”，但后接两个ὅτι从句，内容包括群众根据现场情况所得的认识；“发现”在汉语中兼顾观察和察知，衔接更自然。
- source_word: πλοιάριον
  choice: 小船
  rationale: 该词带指小形式，译作“小船”保留这一词形所表达的细微语义。
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: 那里除了一只小船以外，没有别的船
  rationale: 清楚表达排他关系：现场只有那一只船，没有别的船。
- source_word: οὐ συνεισῆλθεν … εἰς τὸ πλοῖον
  choice: 并没有同……上船
  rationale: 复合动词表示“与……一同进入”；在乘船语境中，“同……上船”自然且准确。
- source_word: μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον
  choice: 只有门徒自己离开了
  rationale: “只有……自己”突出门徒离开时没有耶稣同行，同时保留μόνοι的排他意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“群众”比“人群”更适合指同一批持续行动的人；两个“发现”保留原文一个感知动词统领两个ὅτι从句的结构联系。脚注[a]置于“小船”之后，以对应其实际说明对象。
