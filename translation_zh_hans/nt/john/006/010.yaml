  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: zh_hans
  text: 耶稣说：“让众人坐下。”[a][b] 那地方有很多草。于是男人们坐下，人数约有五千。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“众人”（ἀνθρώπους），后面则说“男人”（ἄνδρες）；约五千这一数字特指这些男性。
    reason: lexical_alternative
  - marker: b
    text: “坐下”也可译作“斜倚而坐”。原文动词可指按当时进餐姿势斜倚，但这里用“坐下”更符合现代汉语习惯。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε
  choice: 让
  rationale: ποιέω与补足不定式连用，在这里表达使役命令；“让……坐下”符合现代汉语，也保留指令语气。
- source_word: τοὺς ἀνθρώπους
  choice: 众人
  rationale: ἄνθρωποι在此泛指在场人群，并不专指男性；“众人”自然地涵盖整个人群，同时可与后文特指男性的ἄνδρες形成区别。
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: 坐下
  rationale: ἀναπίπτω可指为进餐而斜倚或躺卧；在户外分饼的叙事中，“坐下”是现代汉语最自然的表达，具体姿势则以脚注说明。
- source_word: χόρτος πολὺς
  choice: 草很多
  rationale: χόρτος在此指草，πολύς表示数量多；“草很多”简明自然，并忠实传达场地草木丰盛这一细节。
- source_word: ἐν τῷ τόπῳ
  choice: 那地方
  rationale: 用“那地方”自然表达带定冠词的地点短语，不额外增加原文没有的强调。
- source_word: οἱ ἄνδρες
  choice: 男人
  rationale: ἀνήρ在此明确指男性，须与前文泛指众人的ἄνθρωποι区别；“男人”比“男子”更贴近日常现代汉语。
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: 约有五千
  rationale: ὡς表示约数，τὸν ἀριθμόν明确涉及人数；汉语“约有五千”已自然表达约数和计数含义。
theological_decisions:
- issue: 喂饱众人叙事中计数对象的性别范围
  choice: 前文以“众人”指整个人群，后文以“男人”明确约五千这一数字所指的群体。
  alternative: 两处都译作“众人”或“人”。
  rationale: 原文先用泛指人的ἀνθρώπους，后改用特指男性的ἄνδρες。保留这一词义差异，既不把前者不当地限于男性，也不把后者的性别信息抹去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人”与“男人”保留原文由泛指人群转为特指男性的词汇对比；“其中男人约有五千”避免让汉语读者误以为坐下的只有男性，同时清楚限定计数对象。脚注标记均置于正文相关句后。
