source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: zh_hans
  text: 他们说：“这不是约瑟的儿子耶稣吗？他的父母我们都认识。他现在怎么说：‘我是从天上降下来的’呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 他们说
  rationale: 希腊语未完成时描写当时持续发生的言说；现代汉语在叙事中通常不必用生硬的‘一直说着’来显明体貌，简洁的‘说’结合上下文即可自然表达。
- source_word: Οὐχ οὗτός ἐστιν
  choice: 这不是……吗
  rationale: 用现代汉语的否定反问句，保留说话者预期众人认同的语气。
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: 约瑟的儿子
  rationale: 直接保留属格关系，突出众人所认定的耶稣人间家庭背景。
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: 他的父母我们都认识
  rationale: ‘父母’自然对应‘父亲和母亲’，前置‘他的父母’则保留原句对其家世的强调；‘都’自然体现主语‘我们’的群体语感，不改变基本命题。
- source_word: πῶς νῦν λέγει
  choice: 他现在怎么说
  rationale: 按 πῶς 的基本义译为‘怎么’，保留质疑方式，不增添‘怎么能’所含的显性可能性判断。
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 自然表达来源，与 ἐκ 加属格的意义相符。
- source_word: καταβέβηκα
  choice: 我是……降下来的
  rationale: ‘降下来’表达向下移动；‘是……降下来的’既自然地强调来源，也呈现已完成之行动与当前身份主张的关联，贴近希腊语完成时。
theological_decisions:
- issue: 众人对耶稣声称具有天上来源的质疑
  choice: 保留直接引语‘我是从天上降下来的’
  alternative: 意译为‘我是从天上来的’
  rationale: 原文明确使用‘降下’而不只是‘来’，译文不将其弱化为笼统的来源陈述，也不额外解释这一主张的神学含义，从而保留叙事中的张力。
- issue: 约瑟被称为耶稣的父亲所产生的叙事张力
  choice: 译作‘约瑟的儿子耶稣’，不加解释性限定
  alternative: 译作‘人们以为是约瑟儿子的耶稣’或添加说明
  rationale: 这是众人原话中的身份认定；译文照录其说法，不在本节内替叙述者纠正或调和，从而保存原文的视角与张力。
translation_notes:
  register: 采用现代、清楚而庄重的口语化叙事表达。两个反问句保留众人的质疑语气；直接引语层次清晰，不使用教派性术语，也不添加原文没有的神学解释。
