source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: zh_hans
  text: 所以，耶稣知道众人将要来强行带走他，拥立他为王，就又独自退到山上去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接前文众人见到神迹后的反应，并引出耶稣据此采取的行动；“所以”自然保留叙事中的推论关系。
- source_word: γνοὺς
  choice: 知道
  rationale: 该不定过去时分词说明耶稣退去的缘由；“知道”直接、自然，不额外限定他如何得知。
- source_word: μέλλουσιν ἔρχεσθαι
  choice: 将要来
  rationale: 保留 μέλλω 所表达的临近、即将发生之意。
- source_word: ἁρπάζειν αὐτόν
  choice: 强行带走他
  rationale: ἁρπάζω 在这里含强制夺取之意；“强行带走”既呈现暴力或违背本人意愿的色彩，也符合众人要把耶稣带去拥立的语境。
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: 拥立他为王
  rationale: ἵνα 加虚拟式表达目的。“拥立……为王”自然呈现众人意图使耶稣成为王，并与前面的强制行动相衔接。
- source_word: ἀνεχώρησεν
  choice: 退到
  rationale: ἀναχωρέω 表示离开或退避；结合方向短语 εἰς τὸ ὄρος，译作“退到山上”兼顾动作与避开众人的语境。
- source_word: πάλιν
  choice: 又
  rationale: 简洁保留重复发生或再次行动的意义。
- source_word: εἰς τὸ ὄρος
  choice: 到山上
  rationale: 按语境保留 τὸ ὄρος 的“山”义，不擅自具体化为某座山或丘陵地区。
- source_word: αὐτὸς μόνος
  choice: 独自
  rationale: 该组合带有强调意味；现代汉语“独自”已自然表达他一人而无他人同行，避免生硬重复。
theological_decisions:
- issue: 众人试图使耶稣为王的行动性质
  choice: 译为“强行带走他，拥立他为王”
  alternative: “带他去立为王”或“来立他为王”
  rationale: ἁρπάζειν 明确带有强取、强行控制的意味，不应淡化成普通邀请；同时“拥立”表达政治性的立王意图，而不将其解释为耶稣认可的登基。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“强行带走”明确呈现原文的强制意味；“拥立他为王”比逐字式“使他作王”更符合现代汉语，同时保留目的结构。“又独自退到山上去了”自然表达 πάλιν、αὐτὸς μόνος 及移动方向。原文此处无须以脚注保留会影响理解的实质性异读或歧义。
