  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: zh_hans
  text: 于是，他们把零碎收集起来，把那五个大麦饼中众人吃完后剩下的碎块[a]装满了十二个篮子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碎块”也可译作“零碎”或“碎饼”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“这些是为已经吃过的人所余下的。”意思是众人吃完后仍有剩余。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: 于是，他们把零碎收集起来
  rationale: οὖν承接上一节耶稣的吩咐，译为“于是”自然地表达结果与叙事推进；συνήγαγον译为“收集起来”，宾语依上下文补作“零碎”。
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: 装满了十二个篮子
  rationale: 保留“装满”的结果含义以及明确的数量；κοφίνους泛译为普通读者易懂的“篮子”，不作无充分必要的器物细分。
- source_word: κλασμάτων
  choice: 碎块
  rationale: 指掰开后剩下的饼块；“碎块”既保留破开之物的含义，也比单说“碎片”更适合食物语境。
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: 五个大麦饼中
  rationale: 保留来源关系和五个饼的数量；“大麦饼”是现代汉语中对大麦制成之饼自然、明确的表达。
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: 吃剩的
  rationale: 希腊文较直译为“为那些已经吃过的人所余剩的”；主文用“吃剩的”简洁表达饭后有余这一语义，同时以脚注保留原文的句法与可能的关系理解。
