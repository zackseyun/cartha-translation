base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: zh_hans
  text: 于是，耶稣对他们说：“我实实在在地告诉你们，不是摩西把那从天上来的饼赐给了你们[a]，而是我父把那从天上来的、真正的饼赐给你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“不是摩西把那从天上来的饼赐给你们。”原文的否定词置于“摩西”之前，突出施予者的对比。
    reason: lexical_alternative
  - marker: b
    text: “真正的”也可译为“真实的”或“真”。这个词可指真实、真正的事物，并与先前所提到的从天上来的饼形成对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文群众关于吗哪的说法，并自然引出耶稣的回应；既保留话语推进作用，也符合现代汉语表达。
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: 我实实在在地告诉你们
  rationale: “实实在在”保留双重Ἀμὴν的郑重与强调；“告诉你们”自然表达λέγω ὑμῖν，整体也符合《约翰福音》中这一固定宣告语的庄重语气。
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: 不是摩西把……赐给了你们
  rationale: 把否定置于“摩西”之前，突出施予者的对比；“赐给了”兼顾δέδωκεν所指的既往给予及其与当前讨论的关联。
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: 那从天上来的饼
  rationale: 自然保留“饼”和“从天上来”的意象；“那”对应定冠词，并指向对话中已提到的天上之饼。
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: 而是我父……赐给你们
  rationale: “而是”清楚呈现οὐ…ἀλλά的强烈对比；现在时“赐给”与前句“赐给了”形成时间和语篇上的对照。
- source_word: ὁ πατήρ μου
  choice: 我父
  rationale: 简洁、庄重地保留耶稣独特的父子关系表达，不作解释性扩写。
- source_word: τὸν ἀληθινόν
  choice: 真饼
  rationale: “真”保留ἀληθινός在约翰著作中“真实、真正、终极实在”的丰富含义，而不把它局限为单纯的真假判断。
theological_decisions:
- issue: 摩西与父作为施予者的对比，以及两个动词的时态差异
  choice: 译作“不是摩西……赐给了你们，而是我父……赐给你们”
  alternative: “摩西并没有……赐给你们；我父却……赐给你们”
  rationale: 原文将否定词放在“摩西”之前，首先凸显施予者的对比；同时以“赐给了／赐给”尽可能反映完成时δέδωκεν与现在时δίδωσιν之间的差别，而不额外断定其神学含义。
- issue: ἀληθινός所表达的“真”
  choice: 正文保留“真饼”
  alternative: “真正的饼”或“真实的饼”
  rationale: “真饼”既简洁庄重，又保留它可能表示真实、真正或终极实体的张力，使读者能够从上下文理解它与旷野吗哪的关系，而非由译文预先消解。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“我实实在在地告诉你们”保留约翰福音双重“阿们”公式的传统辨识度；“我父”比“我的父亲”更凝练，也适合经文语体。正文避免加入“正”等原文没有明说的时间副词，并以动词形式本身呈现过去给予与当前给予的对比。
