  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: zh_hans
  text: 海因大风吹着而翻腾不已[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海正在动荡不已”或“海水正在涌起”。
    reason: 原词可指海水持续受到搅动、动荡或涌起；不同译法分别突出这些语义侧面。
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: 海面也
  rationale: θάλασσα指“海”；此处描写风对水面的作用，译作“海面”符合现代汉语表达，又不把普通名词扩展为专名“加利利海”。τε是轻微的连接词，用“也”承接上文。
- source_word: ἀνέμου μεγάλου
  choice: 大风
  rationale: ἄνεμος意为“风”，μέγας在天气语境中表示强度大；“大风”自然、准确，不像“狂风”那样可能过度强化。
- source_word: πνέοντος
  choice: 吹刮
  rationale: 现在时主动分词表示风持续吹动的伴随或原因性情形；“因大风吹刮”以自然的汉语明确表达这一关系，并保留持续意味。
- source_word: διεγείρετο
  choice: 翻腾起来
  rationale: 未完成时被动形式描写海面持续受到外力搅动。“翻腾起来”生动而不过度增添具体浪涛意象，也体现动态过程；其他可能译法列入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言；以“海面”配合“翻腾”符合普通读者的汉语习惯，并保留原文未完成时所表达的持续变化。
