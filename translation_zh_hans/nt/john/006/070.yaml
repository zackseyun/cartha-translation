  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: zh_hans
  text: 耶稣回答他们：“不是我拣选了你们十二个人吗？然而，你们中有一人是个魔鬼[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毁谤者”。这里的希腊词可指诬告者或毁谤者，也常用来指魔鬼。此处原文没有冠词，侧重描述这个人的性质；这并不必然是说他就是撒但本身。
    reason: 说明διάβολος的词义范围及此处定性谓语的语法特点，保留原文的歧义与神学张力。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是叙事中引出回应的常用动词；“回答”自然、准确，也符合约翰福音对话的语体。
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: 不是我拣选了……吗？
  rationale: οὐκ引出的反问预期肯定回答；“不是我……吗”保留了ἐγώ的强调和原句的反问语气。
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: 你们十二个人
  rationale: 定冠词加“十二”指已知的十二人群体；中文无需生硬地名词化为“十二使徒”，也不提前加入原文未明说的身份称谓。
- source_word: καὶ
  choice: 然而
  rationale: 此处καί在语篇中形成对照：耶稣虽拣选了十二人，其中却有一人是魔鬼；“然而”自然表达这一转折。
- source_word: ἐξ ὑμῶν
  choice: 你们中
  rationale: 准确表达部分关系，即从这十二人当中有一个。
- source_word: διάβολός
  choice: 魔鬼
  rationale: 保留原词强烈的宗教与修辞色彩，不弱化为单纯的“毁谤者”；同时借助脚注说明此处无冠词、具有定性意味，不宜径直等同于撒但本身。
theological_decisions:
- issue: διάβολός是把该人直接认定为撒但，还是对其性质作强烈描述
  choice: 一个是魔鬼
  alternative: 一个是毁谤者；一个就是那魔鬼
  rationale: διάβολος在此没有冠词，谓语用法带有定性意味。译作“魔鬼”保留原文的尖锐力度；用“一个”并加脚注，避免把这人直接说成撒但本身，同时不把神学张力弱化为一般性的毁谤行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拣选”保留圣经语境中的郑重色彩；“你们十二个人”既自然，也避免加入“使徒”等原文未出现的称谓。脚注标记紧随“魔鬼”，明确对应所解释的词。
