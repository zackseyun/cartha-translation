  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: zh_hans
  text: 因为上帝的粮就是那位从天上降下来、把生命赐给世界的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝的粮就是那从天上降下来、把生命赐给世界的事物。”希腊文措辞也可作较非人格化的理解，但阳性分词较倾向于指一位具体的人。
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接并解释上文；现代汉语中“因为”比句首“原来”更直接自然。
- source_word: ὁ ἄρτος τοῦ θεοῦ
  choice: 上帝的粮
  rationale: 保留“粮”这一具体而具有比喻作用的核心意象；“上帝的”也保留属格在归属与来源之间的语义空间。
- source_word: ὁ καταβαίνων
  choice: 那……降下来的
  rationale: 希腊文带冠词的阳性单数分词倾向指向一位具体的人；以“那……的”表达实体化分词，同时不提前明说其身份。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 自然表达来源，并符合现代汉语的常用宗教语体。
- source_word: ζωὴν
  choice: 生命
  rationale: 保留约翰福音中分量重大的核心词，不扩写其性质。
- source_word: διδοὺς
  choice: 把……赐给
  rationale: “赐给”符合生命由上帝之粮给予的庄重语境；用“把”字结构使受事与对象关系清楚。
- source_word: τῷ κόσμῳ
  choice: 世人
  rationale: 此处κόσμος作为接受生命的对象，主要指世界中的人；“世人”在汉语中自然，且仍保留广泛范围，不限定为某一群体。
theological_decisions:
- issue: “上帝的粮”之后的分词结构是人格性还是非人格性所指
  choice: 正文采用人格性表达：“那从天上降下来……的”
  alternative: “从天上降下来、把生命赐给世人的”可被理解为非人格性的事物
  rationale: ὁ καταβαίνων与διδοὺς为阳性单数形式，自然指向一位具体的人，并为下文耶稣的自我启示铺垫；脚注保留较非人格化理解的可能。
- issue: κόσμος的范围
  choice: 译作“世人”，不进一步限定范围
  alternative: “世界”
  rationale: 生命被给予的对象在此自然理解为世上的人；译文不加入“所有”或其他范围限定，以免消解经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“粮”保留本段反复出现的核心意象；“那……的”略带书面色彩，但能自然呈现希腊文人格性实体分词的力量。
