  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: zh_hans
  text: 逾越节，就是犹太人的节期[a]，快到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的节期”。希腊语“犹太人”一词可依上下文泛指犹太人，也可特指犹太地人。
    reason: 保留Ἰουδαίων在族群意义与地域意义之间的词义可能。
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接词；现代汉语可借上下文自然承接，若硬译为“这时”或“而”反会增添原文没有明确表达的时间或转折意味。
- source_word: ἐγγὺς
  choice: 快到了
  rationale: ἐγγύς与ἦν连用，表示时间临近；“快到了”自然、清楚，符合现代汉语叙事表达。
- source_word: πάσχα
  choice: 逾越节
  rationale: πάσχα指犹太人的逾越节；“逾越节”是现代中文圣经及一般宗教语境中的标准名称。
- source_word: ἑορτὴ
  choice: 节期
  rationale: ἑορτή指宗教性的节庆或节期；“节期”既保留礼仪与宗教色彩，也比“筵席”更准确，因为此处所指不只是用餐。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: Ἰουδαῖοι可依语境指广义的犹太人，也可指犹太地区的人。这里逾越节是整个犹太民族的宗教节期，因此正文采用“犹太人的”，同时用脚注保留较窄的地域性理解。
theological_decisions:
- issue: 约翰叙事中Ἰουδαίων的所指
  choice: 犹太人的
  alternative: 犹太地区的人的
  rationale: 本节谈的是逾越节这一民族与宗教共同体的节期，而非仅限于犹太地区居民的地方性庆典，因此正文采用广义译法。不过，原词本身具有地域性用法的可能，故在脚注中保留这一词义选择，避免把上下文中的真实语义范围完全抹平。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“就是”清楚表达“逾越节”与“犹太人的节期”之间的同位关系；整体语序尽量贴近希腊文，同时避免生硬欧化。
