  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: zh_hans
  text: 正如永活的父差了我，我也因父而活[b]；照样，吃我的人[a]也必因我而活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“吃”的希腊语动词具体而鲜明，可指吃食、咀嚼；也可译作“以我为食的人”。
    reason: lexical_alternative
  - marker: b
    text: “因父”和“因我”也可理解为“借着父”和“借着我”。原文介词在这里可表达原因、根据，也可能带有凭借或媒介的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: 正如……照样
  rationale: καθὼς引出类比；补出汉语中自然的对应语“照样”，清楚呈现父—子与子—吃他之人的平行关系。
- source_word: ὁ ζῶν πατὴρ
  choice: 永活的父
  rationale: 保留ζῶν的属性用法及约翰福音中的生命主题；“永活”在现代汉语中自然、庄重，也不把该词过度解释为“赐生命的”。
- source_word: ἀπέστειλέν με
  choice: 差了我
  rationale: 以简洁过去时表达不定过去时，并保留约翰福音常见的差遣语言。
- source_word: κἀγὼ ζῶ
  choice: 我也……活
  rationale: 保留现在时及κἀγώ中“我也”的对应、强调意味。
- source_word: διὰ τὸν πατέρα
  choice: 因父
  rationale: διά加宾格在此可表达原因或根据；“因父”简洁地保留这一意义，并与后文“因我”形成严格平行。
- source_word: ὁ τρώγων με
  choice: 吃我的人
  rationale: τρώγω是具体而鲜明的吃食动词；直译为“吃”既自然又不预先限定为圣餐性或纯比喻性的理解。
- source_word: κἀκεῖνος ζήσει
  choice: 那人也必……活
  rationale: 在“吃我的人也必……”的自然汉语结构中表达κἀκεῖνος的回指和附加强调；“必活”保留将来时。
- source_word: δι’ ἐμέ
  choice: 因我
  rationale: 与“因父”一致处理，凸显整句类比，同时用脚注保留工具性理解的可能。
theological_decisions:
- issue: διὰ τὸν πατέρα与δι’ ἐμέ所表达的关系
  choice: 正文按原因或根据译为“因父……因我”
  alternative: “借着父……借着我”
  rationale: διά加宾格通常支持原因义，且一致翻译能保留父—子与子—信徒之间的平行。脚注同时保留语境中可能被理解出的媒介或凭借义，不从本节推导本体上的从属关系。
- issue: ὁ τρώγων με的圣餐性或广义比喻性含义
  choice: 译为具体的“吃我的人”
  alternative: “以我为食的人”或“领受我的人”
  rationale: 具体的吃食用语忠实保留原文的鲜明程度；不以解释性措辞把经文限定为圣餐教义，亦不把它淡化为纯粹抽象的信靠。
- issue: 子的生命与父的关系
  choice: 保留“我也因父而活”的张力
  alternative: 解释性改写为“我靠父赐生命而活”或“我为父而活”
  rationale: 原文说明一种关系，却未在本句完整界定其本体论或使命层面的范围；译文不额外加入“被赐生命”、本体次等或目的意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“永活的父”保留约翰著作的生命主题；“吃我的人”故意保持具体和神学上的开放性。分号划分差遣与生命类比的两部分。所有脚注标记均置于正文对应位置。
