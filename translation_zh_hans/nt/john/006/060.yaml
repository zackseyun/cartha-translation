id: JHN.6.60
reference: John 6:60
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: zh_hans
  text: 所以，他的门徒中有许多人听见这番话后，说：“这话太难了[a]，谁能听得进去呢？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “难”也可理解为“严厉”“刺耳”或“难以接受”。这里不一定只是指难以理解。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“谁能听下去呢？”或“谁能接受呢？”希腊文动词可表示听见、聆听，也可按语境表示听从或接受。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: 所以……有许多人
  rationale: Πολλοὶ表示门徒群体中的许多人；οὖν承接前文并引出由耶稣讲论所产生的反应，用“所以”保留其推论和推进作用。
- source_word: ἀκούσαντες
  choice: 听见这番话后
  rationale: 不定过去时分词在此具有时间作用。“听见……后”符合现代汉语表达；“这番话”由上下文补出，指耶稣刚才的讲论。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 他的门徒中
  rationale: ἐκ表示说话者属于较大的门徒群体。“他的门徒中”准确保留“从……当中”的范围含义。
- source_word: Σκληρός
  choice: 太难了
  rationale: σκληρός可指艰难、严厉、令人难以忍受或接受。“难”保留一定的语义开放性，不把异议限定为纯粹的理解困难或冒犯感；“太”自然传达说话者强烈的负面判断。
- source_word: ὁ λόγος οὗτος
  choice: 这话
  rationale: λόγος在此指刚刚听到的话语、说法或教导。“这话”既自然简洁，也不把所指过度限定为某一条教义。
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: 谁能听得进去呢？
  rationale: ἀκούω既可表示听见，也可按语境表示听从、理会或接受。“听得进去”在现代汉语中既延续听觉意象，又暗示难以容纳或接受，避免直接解释成“谁能接受”。
theological_decisions:
- issue: 门徒认为耶稣这番话“难”的具体性质
  choice: 保留为“太难了”，不明确限定是难懂、严厉、刺耳，还是难以接受
  alternative: 译作“太难懂了”“太刺耳了”或“太难接受了”
  rationale: σκληρός在本语境中可能涉及话语的严厉、艰难或令人难以接受。正文保留这种张力，脚注提示其语义范围。
- issue: “听”是否含有接受或听从之意
  choice: 译作“听得进去”
  alternative: 译作“听见”“听下去”“接受”或“听从”
  rationale: 此处显然不只是声音能否听见，却也不宜把含义完全收窄为信服或顺从。“听得进去”兼顾听闻与接纳的意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这番话”用于回指前文整段讲论，“这话”用于门徒的直接评价；“听得进去”是当前通行表达，既口语自然，又适合叙事中的直接引语。
