  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: zh_hans
  text: 他们在海的另一边找到耶稣，就对他说：“拉比，你是什么时候到这里来的？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρόντες
  choice: 找到
  rationale: 不定过去时分词表示先于主句发生的动作；汉语用“找到……就……”自然地呈现动作顺序。
- source_word: πέραν τῆς θαλάσσης
  choice: 在海的另一边
  rationale: πέραν加属格在此表示位于海的对岸；这一表达自然清楚，也保留上下文中的地理对照。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留犹太语境中的音译尊称，不以解释性的“老师”替代。
- source_word: πότε
  choice: 什么时候
  rationale: 准确、自然地表达时间疑问。
- source_word: ὧδε
  choice: 这里
  rationale: 简明表达地点副词“这里／到这里”。
- source_word: γέγονας
  choice: 到这里来的
  rationale: γίνομαι的完成时在本语境中惯用地指到达并已在场；现代汉语以“到这里来”最自然，同时由“什么时候”承载提问重点。
- source_word: Καὶ
  choice: 就
  rationale: 结合前置分词结构，用“就”衔接找到与说话两个动作，比句首机械译作“并且”更符合现代汉语叙事。
- source_word: εἶπον αὐτῷ
  choice: 对他说
  rationale: 贴近λέγω的基本义“说”；虽然后接问句，仍不改译为解释性较强的“问他”。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 希腊文用代词“他”，但汉语连续出现多个第三人称时可能短暂含混；依明确的篇章指称复现“耶稣”，不增加新的所指。
