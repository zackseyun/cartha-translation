  text: I am the bread of life.
translation:
  language: zh_hans
  text: 我就是生命的饼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: 我就是
  rationale: 希腊语以显式主语ἐγώ配合系词εἰμι，构成有力的自我指认。现代汉语用“我就是”自然保留这种明确、强调的认同关系；单说“我是”也可，但语气略弱。
- source_word: ὁ ἄρτος
  choice: 饼
  rationale: ἄρτος可指饼、面包或作为主食的食物。此处沿用简洁而庄重的“饼”，既适合经文意象，也避免“一个饼”或“面包”带来的过度具体化；希腊语冠词的限定、识别作用由“就是……的饼”这一结构自然表达。
- source_word: τῆς ζωῆς
  choice: 生命的
  rationale: 保留属格结构的紧凑与潜在多义性，不扩写成“赐生命的”或“使人得生命的”，以免把经文所蕴含的关系预先限定为单一解释。
theological_decisions:
- issue: 约翰福音“我是”宣告在此处的表达力度
  choice: 译为“我就是”，不作神学性扩写
  alternative: “我是”；“我自己就是”；“我就是那一位”
  rationale: 本句的ἐγώ εἰμι带有表语“生命的饼”，并非独立使用的绝对式“我是”。“我就是”保留耶稣强烈的自我认同，同时不添加原文没有的神名解释或其他基督论措辞。
- issue: “生命”与“饼”的属格关系
  choice: 保留为“生命的饼”
  alternative: “赐生命的饼”；“维持生命的饼”
  rationale: τῆς ζωῆς可以蕴含生命的来源、性质或功效。直译为“生命的”保留约翰式表达及其神学张力，不把关系缩减为仅仅“赐生命”。
translation_notes:
  register: 采用现代、简洁、庄重且易懂的普通话。“我就是生命的饼”具有自然的宣告语气，也与上下文中的核心意象保持一致。
