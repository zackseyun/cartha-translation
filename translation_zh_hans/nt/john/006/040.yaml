  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: zh_hans
  text: 因为我父的旨意是：凡看见子[a]并信靠他的人，都得永生；在末日，我必亲自使他复活。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”也可译作“注目于”或“观看”；原词可指带着关注的观看，不只是肉眼看见。
    reason: lexical_alternative
  - marker: b
    text: 原文明确出现“我”，带有强调，也可较简略地译作“我必使他复活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: 因为……是
  rationale: γάρ承接并解释上一节；现代汉语用“因为”自然保留其解释性连接。“这”在汉语中可省去，避免“因为这就是”略显生硬。
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: 我父的旨意
  rationale: “旨意”准确表达θέλημα所指的意愿或意图，也符合庄重而通俗的圣经语体；“我父”直接保留耶稣所表达的父子关系。
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: 凡注目于子的人
  rationale: “凡……的人”体现冠词化现在分词的泛指意义；“注目于”比单纯“看见”更能传达θεωρέω可含专注观看、察看的意味，同时保持自然。
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: 并信他
  rationale: “信他”在现代汉语中自然表达πιστεύω εἰς所指向某人的信靠，且不额外引入教派性阐释。
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: 都得永生
  rationale: ἵνα加虚拟式在此表明父旨意的内容及所指结果；汉语“得永生”自然传达获得并拥有永恒生命，不需用情态词勉强复制希腊语式。
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: 我必亲自使他复活
  rationale: “使他复活”清楚表达末世性的ἀναστήσω；“亲自”保留显明主语ἐγώ所带的强调，“必”体现将来陈述的确定性。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: 这是现代汉语中简洁、庄重且惯用的末世时间表达，准确对应时间与格短语。
theological_decisions:
- issue: πᾶς ὁ θεωρῶν……καὶ πιστεύων的范围与条件
  choice: 凡注目于子并信他的人，都得永生
  alternative: 凡看见子而信他的人，可以得永生
  rationale: 译文保留“凡……的人”这一普遍、持续的描述，也保留注目于子与信他之间的并列关系，不借此裁定预定、自由意志等神学争论。汉语“都得”自然表达父旨意中给予信者生命的结果，而不把应许弱化为仅有可能性。
- issue: ἐγώ在复活应许中的强调
  choice: 我必亲自使他复活
  alternative: 我必使他复活
  rationale: “亲自”明确体现希腊文独立人称代词的强调，突出耶稣在复活应许中的行动主体，同时不添加原文以外的教义说明。
- issue: “永生”与末日复活的关系
  choice: 并列保留当下得永生与末日复活
  alternative: 把永生仅解释为末日才获得的生命
  rationale: 原文先说得永生，继而说末日使其复活；译文维持二者的并列和张力，不替文本规定永生实现的完整时间模式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“注目于子”略带文学色彩，但能传达θεωρέω的专注意味；“我必亲自”保留ἐγώ的强调。所有脚注标记均置于与其说明直接相关的正文位置。
