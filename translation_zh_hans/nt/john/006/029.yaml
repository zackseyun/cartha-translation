source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: zh_hans
  text: 耶稣回答他们说：“神的工作[a]，就是你们信[b]他所差来的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“神所要求的工作”或“神所做的工作”。希腊文“神的工作”可有不止一种理解，正文保留了这种歧义。
    reason: alternative_reading
  - marker: b
    text: “信”也可译作“信靠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: 耶稣回答他们说
  rationale: 保留原文“回答”与“说”的双动词结构，同时符合现代汉语叙事习惯。
- source_word: Τοῦτό ἐστιν
  choice: 就是
  rationale: 承接上文的问题并突出后面的说明；汉语以“就是”自然表达指示代词加系词的强调作用。
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: 神的工作
  rationale: 形式上贴近希腊文，并保留属格可能表示“神所要求的工作”或“神所做的工作”的歧义。
- source_word: ἵνα πιστεύητε
  choice: 就是你们信
  rationale: 在此将ἵνα从句作为“神的工作”的内容来表达；“你们信”自然传达现在时虚拟语气，不额外加入目的或持续性的解释。
- source_word: εἰς ὃν
  choice: 他所差来的那一位
  rationale: 与“信”结合，表达约翰著作中πιστεύω εἰς指向具体对象的用法；“那一位”清楚保留其人格性。
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: 他所差来的
  rationale: “他”按语境指神；“差来”既表达差遣，也凸显受差者来到人间的使命。
theological_decisions:
- issue: τοῦ θεοῦ属格的含义
  choice: 正文保留“神的工作”
  alternative: “神所要求的工作”或“神所做的工作”
  rationale: 希腊文可作客观属格或主观属格理解。上下文既涉及人应当做什么，也把信指向神所差来的那一位，因此不在正文中以解释性译法消除这一神学张力。
- issue: πιστεύω εἰς的译法
  choice: 信……那一位
  alternative: 信靠……那一位
  rationale: “信”是简洁且常见的对应词，也能与本项目对πιστεύω词群的处理保持一致；“信靠”更突出委身和倚靠的意味，列入脚注供读者参考。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神的工作”有意保持简洁，不用“神要人做的事”等释义性表达；“那一位”比单用“他”更清楚地对应原文关系代词所指的人。
