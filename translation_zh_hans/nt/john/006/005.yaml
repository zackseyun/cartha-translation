source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: zh_hans
  text: 于是，耶稣举目，看见一大群人正向他而来，就对腓力说：“我们从哪里买饼给这些人吃呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάρας … τοὺς ὀφθαλμοὺς
  choice: 举目
  rationale: 这是现代汉语中自然、庄重的固定表达，准确传达“抬起眼睛”的动作，又避免逐字翻译的生硬。
- source_word: οὖν
  choice: 于是
  rationale: 在此承接上文并推动叙事；“于是”比“所以”更符合现代汉语叙事语流，同时保留连接作用。
- source_word: θεασάμενος
  choice: 看见
  rationale: 传达带有观察意味的视觉感知；此处译作“看见”简洁自然，不额外强化为“仔细察看”。
- source_word: πολὺς ὄχλος
  choice: 一大群人
  rationale: 清楚表达人数众多的群众，符合现代汉语习惯。
- source_word: ἔρχεται πρὸς αὐτόν
  choice: 正朝他走来
  rationale: 用“正……走来”表现进行中的动作，并以“朝”保留 πρός 的方向性。
- source_word: λέγει πρὸς Φίλιππον
  choice: 就对腓力说
  rationale: 将叙事中的历史现在时按自然汉语译为过去叙事语气；“对……说”准确表达受话对象。
- source_word: Πόθεν
  choice: 从哪里
  rationale: 直接保留表示来源的 πόθεν；汉语“从哪里买”自然明确，也保留原文问题的字面构造。
- source_word: ἀγοράσωμεν
  choice: 我们……买
  rationale: 第一人称复数虚拟式在疑问句中表达商议或设问；汉语用“我们……买”自然呈现，不强加能力或义务色彩。
- source_word: ἄρτους
  choice: 饼
  rationale: ἄρτος既可泛指食用的饼或面包，也可指一个个饼；在一世纪犹太背景中，“饼”比现代汉语“面包”更合适，并能与后文数饼相衔接。
- source_word: ἵνα φάγωσιν οὗτοι
  choice: 给这些人吃
  rationale: 以自然汉语目的结构表达 ἵνα 从句；将指人的 οὗτοι 明说为“这些人”，避免汉语中单说“这些”不自然。
theological_decisions:
- issue: 叙事历史现在时与分词结构的处理
  choice: 将 λέγει 译为自然汉语叙事中的“说”，并把两个分词组织为“举目，看见……，就……”
  alternative: 较形式化地译为“耶稣于是举起眼睛，看到……，便对腓力说”
  rationale: 这属于叙事体与句法调整，不涉及教义判断。现译文保留动作次序和逻辑关系，同时符合现代标准汉语。
- issue: ἀγοράσωμεν 的语气
  choice: 译为开放式商议问句“我们从哪里买……”
  alternative: “我们该从哪里买……”或“我们能从哪里买……”
  rationale: 原文虚拟式可有商议意味，但未明确表达义务或能力；不加入“该”或“能”，可保留问题本身的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“举目”简练且仍为当代读者熟悉；“一大群人正朝他走来”清楚呈现场景；问句避免文言式“何处”及过度口语化表达。所提供的英文脚注标记似有错位：其内容分别对应“众人”“从哪里”和“饼”，但英文正文中的标记位置不一致；本稿依据希腊原文直接翻译，且正文无需脚注，故未沿用这些标记。
