id: JHN.6.56
reference: John 6:56
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: zh_hans
  text: 吃[a]我的肉、喝我的血的人，住在我里面[b]，我也在他里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以我的肉为食”或“咀嚼我的肉”；希腊语动词比一般表示“吃”的词更形象。
    reason: lexical_alternative
  - marker: b
    text: 或译“常在我里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: 吃……的人
  rationale: 定冠词加现在分词在此作名词用，指以这一行动为特征的人。汉语用“吃……的人”自然地保留单数个体指向；不另加“不断”等词，以免过度强化希腊语现在时体。
- source_word: τρώγων
  choice: 吃
  rationale: τρώγω比一般的“吃”更形象，可有咀嚼或以某物为食的意味；正文采用现代汉语最自然的“吃”，并在脚注保留更生动的词义可能。
- source_word: μου τὴν σάρκα
  choice: 我的肉
  rationale: σάρξ在这里具体指耶稣的肉，与“血”并列，保留话语中强烈而具体的形象；不释义为“身体”或任何教派性的解释。
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: 喝我的血
  rationale: 直译两个并列的现在分词结构，保留原文令人震撼的血肉意象，不将其解释性改写为圣礼或信心。
- source_word: ἐν ἐμοὶ μένει
  choice: 住在我里面
  rationale: μένω是约翰著作中的关键词，可表示停留、住下或持续存留。“住在……里面”在现代汉语中自然，并保留关系性内住的空间意象。
- source_word: κἀγὼ ἐν αὐτῷ
  choice: 我也在他里面
  rationale: κἀγώ为“我也”，原文后半句省略了已出现的μένει。汉语保留这一省略仍然清楚自然，也避免无必要地增译动词。
- source_word: αὐτῷ
  choice: 他
  rationale: 阳性单数代词回指前面的名词化分词。汉语用“他”准确保留原文的语法数与回指关系，同时该表述在语义上适用于任何这样做的人。
theological_decisions:
- issue: 吃肉喝血是圣餐性的还是比喻性的
  choice: 正文保留“吃我的肉、喝我的血”的具体措辞，不加解释
  alternative: 明确释为领受圣餐，或明确改写为相信耶稣
  rationale: 本句本身使用具体而强烈的血肉语言，却没有在此直接裁定不同传统对其圣礼性或比喻性的理解。直译可保留原文的神学张力。
- issue: 约翰著作中的彼此内住
  choice: 译作“住在我里面，我也在他里面”
  alternative: 译作“常在我里面”，或解释为“与我联合”
  rationale: “住在……里面”保留μένω及ἐν的关系性和空间性意象，同时不把这种彼此内住限定为某一后期神学体系中的专门术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的肉”和“我的血”有意保留原文直接而强烈的表达；“住在……里面”兼顾现代可读性与约翰式内住意象。标点按现代汉语处理。
