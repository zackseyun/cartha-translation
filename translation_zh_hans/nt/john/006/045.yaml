  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: zh_hans
  text: 先知书上写着：“他们都要受上帝的教导。”[a] 凡从父那里听见并学到的人，都到我这里来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们都要成为上帝所教导的人。”
    reason: 保留διδακτοὶ θεοῦ较贴近原文构词的译法及其表达重点。
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: 写着
  rationale: 自然表达迂回完成时所指的既已写下、现仍有效的经文内容。
- source_word: ἐν τοῖς προφήταις
  choice: 先知书上
  rationale: 指公认的先知性经卷，而不只是作为个人的众先知；“先知书上”符合现代汉语引用经文的习惯。
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: 他们都要受上帝的教导
  rationale: 保留将来意义，并自然表达θεοῦ可指教导的施事者或来源。
- source_word: πᾶς ὁ
  choice: 凡……的人
  rationale: 准确传达单数实词化结构的普遍、逐人涵盖之意。
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: 听见父
  rationale: παρά加属格表示来源；汉语中“听见父”保留原文未明说所听内容的简洁表达。
- source_word: καὶ μαθὼν
  choice: 并领受了教导
  rationale: 与前面的“听见父”相连，表达从父学习、受教的意思，并避免“学会了”暗示掌握某项技能。
- source_word: ἔρχεται πρὸς ἐμέ
  choice: 都到我这里来
  rationale: 保留现在时的概括性陈述和朝向耶稣而来的个人行动；“都”使中文句法清楚承接“凡……的人”。
theological_decisions:
- issue: 上帝教导与到耶稣这里来之间的关系
  choice: 按原文次序陈述：凡听见父并领受教导的人，都到耶稣这里来。
  alternative: 加入较强的决定论解释，或强调人自主回应的协同论解释。
  rationale: 希腊文陈述二者的关系，却没有说明其形而上机制；译文保留这一神学张力，不偏向特定宗派体系。
- issue: “父”与“我”的关系及基督论含义
  choice: 保留“父”和“我”的直接对应，表明真正从父领受教导的人到耶稣这里来。
  alternative: 扩写耶稣与父的关系，或弱化这句话的基督论力度。
  rationale: 这样既忠实呈现约翰福音的表达，也不增添本节未明说的教义阐释。
- issue: διδακτοὶ θεοῦ中属格θεοῦ的理解
  choice: 正文译为“受上帝的教导”，脚注保留“上帝所教导的人”这一贴近构词的表达。
  alternative: 将其理解为单纯属于上帝的学习者，或译成不自然的“上帝所教的”。
  rationale: 该结构呼应以赛亚书54:13，通常表示上帝是教导者；正文采用自然汉语，脚注展示原文凝练表达。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“上帝”用于θεός，“父”保留约翰福音中的关系称谓。引文与后句保持简洁有力，不添加原文没有的宾语或因果连接词。
