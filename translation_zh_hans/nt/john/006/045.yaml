  rationale: 仅将“听见父并领受了教导”修订为“从父那里听见并学到”，以明确παρὰ τοῦ πατρός的来源义并改善汉语自然度。“学到”对应μαθών；原文没有说明听见或学习的具体内容，译文仍未补入宾语或神学解释。其余措辞及脚注均可保留。
