id: JHN.6.69
reference: John 6:69
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: zh_hans
  text: 我们已经信了，也知道你是上帝的圣者[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“基督、永生上帝的儿子。”
    reason: textual_variant
  - marker: b
    text: 或译：“从上帝而来的圣者。”希腊文属格既可表示关系，也可表示来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 希腊文显式使用第一人称复数代词，带有一定强调。汉语用句首“我们”即可自然体现，无须加“我们自己”而造成过重语气。
- source_word: πεπιστεύκαμεν
  choice: 已经信了
  rationale: 完成时表达先前发生并持续至今的确信状态。“已经信了”兼顾已然性和当前效力，并与后面的“知道”自然并列。
- source_word: ἐγνώκαμεν
  choice: 知道
  rationale: γινώσκω的完成时在此强调已经获得、如今持有的认识。现代汉语“知道”本身可表达当前确定的认知；与“已经信了”并列时，不必机械重复“已经”。
- source_word: ὅτι
  choice: （不另译）
  rationale: ὅτι引出信与知道的内容。汉语在“信了，也知道你是……”这一结构中通常省略相当于“that”的连接词，语义仍然明确。
- source_word: ὁ ἅγιος
  choice: 圣者
  rationale: 这里是带冠词的名词化形容词，作为基督论称号，指独特地圣洁并被分别出来的那一位。“圣者”简洁、庄重，也保留称号性质。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 属格可表达归属、关系或来源。“上帝的”保留宽广的关系意义，不将其单一解释为“从上帝而来的”。
theological_decisions:
- issue: 约翰福音6:69中的基督论称号
  choice: 上帝的圣者
  alternative: 从上帝而来的圣者；基督、永生上帝的儿子
  rationale: SBLGNT正文为ὁ ἅγιος τοῦ θεοῦ，应直接译出这一称号，不与马太福音16:16或后期扩展读法协调。“上帝的”也保留属格在关系、归属和来源之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“上帝的圣者”保留原文称号及属格的开放性；两个脚注标记均置于相关称号之后。
