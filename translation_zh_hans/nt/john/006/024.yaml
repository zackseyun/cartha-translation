  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: zh_hans
  text: 于是，众人看到耶稣不在那里，他的门徒也不在，就上了船[a]，来到迦百农寻找耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“小船”；希腊原文这里用的是“船”的指小词。
    reason: 保留πλοιάρια可能带有“小船”之意；在此语境中，指小意味也可能已弱化。
lexical_decisions:
- source_word: ὅτε οὖν
  choice: 于是，……见……就
  rationale: 用“于是”承接上文，并以“见……就……”自然表达时间关系，兼顾οὖν的叙事推进作用与ὅτε的时间含义。
- source_word: ὁ ὄχλος
  choice: 众人
  rationale: 在此指聚集并一同行动的人群；“众人”符合现代汉语叙事习惯，也避免“群众”可能带有的现代政治色彩。
- source_word: εἶδεν
  choice: 见
  rationale: 保留动词的基本视觉含义，不扩展为“意识到”或“发现”，从而避免过度解释其认知意味。
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: 耶稣不在那里，他的门徒也不在
  rationale: 以自然的汉语并列否定表达耶稣和门徒都不在场；不机械复制希腊语现在时，因为上下文处于过去叙事框架中。
- source_word: ἐνέβησαν αὐτοὶ
  choice: 就自己上了
  rationale: “上了”准确表达登船；“自己”保留αὐτοὶ的强调，表明众人亲自乘船前往。
- source_word: τὰ πλοιάρια
  choice: 那些船
  rationale: 正文采用自然、不过度强调尺寸的“船”；指小形式可能表示小船，也可能在语境中已弱化，因此把这一词形信息保留在脚注。
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: 来到迦百农
  rationale: “来到”贴近ἔρχομαι的基本表达，也符合叙事视角；地名采用现代中文圣经中通行的“迦百农”。
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: 寻找耶稣
  rationale: “寻找”清楚表达试图找到耶稣这一具体行动，又避免“寻求”在现代宗教语境中可能产生的额外属灵含义。
theological_decisions: []
translation_notes:
