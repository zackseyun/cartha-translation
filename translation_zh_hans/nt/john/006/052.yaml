  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: zh_hans
  text: 于是，犹太人彼此争论[a]，说：“这个人怎么能把他的肉[b]给我们吃呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”；按上下文，也可能指“犹太人的领袖”。希腊文直译为“犹太人”。
    reason: alternative_reading
  - marker: b
    text: 或译“身体”。希腊词 σάρξ 的本义是“肉”；正文保留这一具体措辞及其在本段中的张力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: 争论起来
  rationale: 未完成时描写持续进行的争执；“争论”明确表达言语冲突，不会误解为肢体打斗，“起来”则自然呈现事态的发展。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推动叙事，也保留由耶稣前述话语引发这一反应的意味。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 简洁自然地表达群体内部互相争论。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接对应希腊文，并不在正文中擅自把所指范围缩小为领袖或限定为犹太地区的人；可能的语境性理解列入脚注。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出他们争论时所说的话；现代汉语用“说”自然清楚。
- source_word: Πῶς δύναται
  choice: 怎么能
  rationale: 自然表达对可能性或能力的质疑，并保留原问句的语气。
- source_word: οὗτος
  choice: 这个人
  rationale: 保留指示代词带有的疏离、轻蔑或不认同色彩，比单用“他”更贴近原文语气。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 作为“给”的间接宾语，符合现代汉语语序。
- source_word: δοῦναι
  choice: 给
  rationale: 采用 δίδωμι 的基本义，不增强也不削弱原文。
- source_word: τὴν σάρκα αὐτοῦ
  choice: 他的肉
  rationale: σάρξ 在这里是具体、具冲击力的用语；译作“肉”比“身体”更直接地保留听者所感受到的字面张力。
- source_word: φαγεῖν
  choice: 吃
  rationale: 直接表达与“给我们”相连的目的或补足意义，汉语简洁自然。
theological_decisions:
- issue: 在具有圣餐相关争议和字面张力的语境中如何翻译 σάρξ
  choice: 肉
  alternative: 身体
  rationale: 原文使用 σάρξ，而非通常表示身体的词。译作“肉”保留具体而令人不安的措辞，以及听众对耶稣话语的反应，不在译文中预先决定其圣餐、象征或其他神学解释。
- issue: 约翰福音中 οἱ Ἰουδαῖοι 的所指范围
  choice: 犹太人
  alternative: 犹太地区的人；犹太人的领袖
  rationale: 本节的词形本身没有把对象明确限定为领袖或某一地理群体，因此正文依原文采用宽泛称呼，并以脚注说明可能的语境性理解，避免默默消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼此争论起来”呈现持续的言语冲突；“这个人”保留说话者的疏离语气；“他的肉”刻意保留原文的具体性和神学张力。所有脚注标记均置于正文相关词语之后。
