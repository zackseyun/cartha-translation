- from: 你们的祖先在旷野吃过吗哪[a]，还是死了。
  to: 你们的祖先在旷野吃了吗哪，也死了。
  rationale: 将“吃过”改为“吃了”，以更直接地呈现原文所述的历史事件；将“还是死了”改为“也死了”，避免把 καί 所表达的并列关系限定为让步关系，同时仍保留本段上下文中自然可感的对照。脚注内容准确，可保留。
