base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: zh_hans
  text: 你们的祖先在旷野吃了吗哪，也死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: 你们的祖先
  rationale: πατέρες 字面可指“父辈”，但在这里特指听众在旷野时期的以色列先祖；现代汉语用“祖先”自然、准确，也保留群体历史关系。
- source_word: ἔφαγον
  choice: 吃过
  rationale: 简单过去时表示已发生的历史事件；“吃过”在汉语中自然地表达这一既成经历。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是出埃及传统中 ἔρημος 的常见圣经用语，比“沙漠”更能保留相关经文的互文背景。
- source_word: τὸ μάννα
  choice: 吗哪
  rationale: 沿用现代中文圣经中对 μάννα 的通行音译；汉语无需用冠词对应希腊文定冠词。
- source_word: καὶ ἀπέθανον
  choice: 还是死了
  rationale: καί 基本义为“并且/而”，但此处在论述中形成让步性的结果对照：祖先虽吃了吗哪，仍然死了；“还是”自然传达这一语篇关系，而不改变死亡事实。
theological_decisions:
- issue: 以色列旷野世代的称谓
  choice: 你们的祖先
  alternative: 你们的父辈
  rationale: 上下文所指不只是直接父亲，而是旷野时期的以色列先祖。“祖先”在现代汉语中准确涵盖这一历史群体，不额外加入宗派性解释。
- issue: 吗哪与死亡之间的对照
  choice: 还是死了
  alternative: 并且死了
  rationale: 本节与后文永生之粮形成对照。“还是”显明原文语境中的反差，同时不把死亡原因说成吃吗哪，也不超出文本作神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旷野”“吗哪”保留圣经叙事的传统表达；句式简洁，并以“还是”呈现上下文中吗哪不能使人免死的反差。
