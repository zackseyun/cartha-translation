  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: zh_hans
  text: 他的一个门徒，就是西门·彼得的兄弟安得烈，对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事通常无需用形态标示过去时，译作“说”既自然，也保留叙事推进感。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与言说动词合译为“对他说”；上下文中“他”指耶稣，但原文此处使用代词，译文予以保留。
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 他的一个门徒
  rationale: 自然、准确地表达 εἷς ἐκ 加复数属格所构成的部分关系。
- source_word: μαθητῶν
  choice: 门徒
  rationale: “门徒”是福音书语境中 μαθητής 的通行译法，兼具跟随者与受教者的关系含义。
- source_word: Ἀνδρέας
  choice: 安得烈
  rationale: 采用现代中文圣经读者熟悉的传统人名音译。
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: 西门·彼得的兄弟
  rationale: 忠实表达属格所标明的亲属关系，并保留原文以同位语说明安得烈身份的结构。
- source_word: Σίμωνος Πέτρου
  choice: 西门·彼得
  rationale: 两个名字在此共同指称同一人；以间隔号连接，清楚表明这是并列使用的双名，而非“西门彼得”这一单一复合名。
