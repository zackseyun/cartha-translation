base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我就是生命的饼：到我这里来的，绝不会饿；信我的，永远不会渴。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“任何时候都绝不会渴”。希腊文在强烈否定之外又加上“任何时候”，并没有“再”的意思。
    reason: 说明οὐ μή与πώποτε叠加形成的强调，并避免把πώποτε误译为“再”。
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 按自然的现代汉语叙事语序表达；αὐτοῖς是间接宾语，不增添原文没有的内容。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 显明主语Ἐγώ带来的强调，同时保留庄重、直接的自我宣告；不额外解释其神学含义。
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: 生命的饼
  rationale: 贴近原文属格结构并保留约翰福音中的核心比喻；不改写为解释性的“赐生命的饼”。
- source_word: ὁ ἐρχόμενος πρὸς ἐμὲ
  choice: 到我这里来的
  rationale: 自然表达实体化的现在分词及πρός所表示的趋向，保留其概括性。
- source_word: οὐ μὴ πεινάσῃ
  choice: 绝不会饿
  rationale: 用“绝不会”传达οὐ μή的强烈否定，比单说“不会”更能体现原文语气。
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: 信我的
  rationale: 这是现代汉语中自然、简明的约翰式表达，保留πιστεύω εἰς所指向的对耶稣的信；不将其限定性改释为单一的心理状态。
- source_word: οὐ μὴ διψήσει πώποτε
  choice: 永远不会渴
  rationale: “永远”对应πώποτε在否定结构中的“任何时候都不”，而“不会”与整句共同表达οὐ μή的强烈否定；不加入原文没有的“再”。
theological_decisions:
- issue: Ἐγώ εἰμι的自我宣告
  choice: 我就是
  alternative: 我就是那
  rationale: “我就是”既能体现显式代词的强调，也让“生命的饼”这一谓语比喻自然成立；不借译文进一步认定其与其他“我是”经文之间的神学关系。
- issue: πιστεύων εἰς ἐμέ的关系性含义
  choice: 信我的
  alternative: 信靠我的
  rationale: “信我的”较为源文透明，也符合普通现代汉语中的圣经语体；“信靠”能突出倚赖含义，但会比πιστεύω本身更具体地解释其内涵。
- issue: 饥饿与口渴之应许的绝对语气
  choice: 绝不会饿；……永远不会渴
  alternative: 决不饥饿；……任何时候都决不口渴
  rationale: 保留οὐ μή及πώποτε的强烈、全面否定，同时不在正文中解释这是身体需要、属灵满足或末世应许，从而保留比喻张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文以“饿、渴”保持口语可懂性，以“生命的饼”保留原文比喻和传统辨识度；分号呈现两个平行分句。脚注标记[a]置于正文对应句末。
