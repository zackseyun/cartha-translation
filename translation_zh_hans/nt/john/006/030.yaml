  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: zh_hans
  text: 于是，他们对他说：“那么，你行什么神迹，好让我们看见并信你[a]呢？你在做什么事呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信你”也可理解为“相信你的话”或“信靠你”。原文直译是“信你”：这里的“你”用与格代词，不是约翰福音中更常见的 πιστεύω 后接 εἰς（“信入／信靠”）的结构。
    reason: 保留 πιστεύω 后接与格 σοι 的词汇和神学歧义，避免默认为另一种约翰常用结构。
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: 于是，他们对他说
  rationale: “于是”自然表达 οὖν 在上下文中的承接和推论作用，同时保留对话推进的关系。
- source_word: Τί οὖν
  choice: 那么
  rationale: 再次译出 οὖν，保留众人追问时的承接和质询语气。
- source_word: ποιεῖς σὺ σημεῖον
  choice: 你行什么神迹
  rationale: “行神迹”是现代汉语中自然、庄重的圣经表达；“神迹”承载约翰福音中 σημεῖον 指向更深意义的用法，而不只表示一般奇事。显出的“你”也保留原文 σὺ 的强调意味。
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: 好让我们看见并信你
  rationale: “好让”表达 ἵνα 所引出的目的；“看见并信你”保留两个并列动词，也尽量保留 πιστεύω 后接与格 σοι 的直接表达，不擅自改成约翰较常见的“信入他/信靠他”结构。
- source_word: τί ἐργάζῃ
  choice: 你做的是什么事呢
  rationale: 以自然汉语表达 ἐργάζῃ 的“做、作成”之意，并与前句形成追问；避免生硬的“做什么工作”，也不额外限定为某种神迹。
theological_decisions:
- issue: πιστεύω 与与格 σοι 的含义
  choice: 信你
  alternative: 相信你的话；信靠你
  rationale: 原文使用与格代词 σοι，而不是约翰福音中常见的 εἰς 加宾格结构。“信你”既贴近原文形式，也容许“相信你所说的”与“信靠你”之间的真实语义张力；脚注说明可能理解而不在正文中强行定论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是／那么”保留原文两次 οὖν 的话语衔接；问句保持众人向耶稣提出挑战的语气。
