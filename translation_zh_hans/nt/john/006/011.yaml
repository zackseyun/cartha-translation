  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: zh_hans
  text: 于是，耶稣拿起饼来，感谢之后，把饼分给那些坐席的人[a]；也照样把鱼[b]分给他们，任凭他们想要多少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“斜倚席间的人”；当时用餐通常斜倚在席上。也可译作“那些坐着的人”。
    reason: lexical_alternative
  - marker: b
    text: 原词可指佐餐的鱼，也可能特指小鱼。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事发展；“于是”自然保留其连接作用，不赋予过强的因果意味。
- source_word: τοὺς ἄρτους
  choice: 饼
  rationale: ἄρτος在此指可分发的饼；现代汉语用“饼”既自然，也符合上下文所说的五个饼。
- source_word: εὐχαριστήσας
  choice: 献上感谢后
  rationale: 明确表达先于主要动作发生的感谢行为，同时不增补原文未明说的受谢对象。
- source_word: διέδωκεν
  choice: 分给
  rationale: 体现διαδίδωμι逐一分发给众人的含义，并在汉语中保持简洁自然。
- source_word: τοῖς ἀνακειμένοις
  choice: 那些坐席的人
  rationale: ἀνάκειμαι字面涉及用餐时斜倚的姿势；“坐席”在现代汉语中自然表示入席用餐，又保留席间情境。
- source_word: ὁμοίως καὶ
  choice: 也同样
  rationale: 保留饼与鱼之间明确的平行动作。
- source_word: ἐκ τῶν ὀψαρίων
  choice: 鱼
  rationale: ὀψάριον可指佐餐的鱼或小鱼；正文采用自然且不过度限定大小的“鱼”。
- source_word: ὅσον ἤθελον
  choice: 任他们想要多少
  rationale: 表达数量由众人的意愿决定，突出供应不受限制，符合现代汉语表达。
theological_decisions:
- issue: εὐχαριστήσας在喂饱众人叙事中可能具有圣餐回响
  choice: 译作“献上感谢”，不作圣礼性扩展
  alternative: 译作“祝福”，或在正文中明确圣餐含义
  rationale: 该动词直接表达感谢。上下文或可产生圣餐联想，但译文不应把可能的神学回响变成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坐席”兼顾自然表达与古代用餐场景；句末用“任他们想要多少”清楚传达不限数量的意味。
