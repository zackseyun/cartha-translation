  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: zh_hans
  text: 但我已经告诉过你们：你们确实已经见过我[a]，却仍然不信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们虽已见过我，还是不信。”
    reason: 第一个καί既可按强调语气表达，也可结合上下文将两分句的关系自然译为让步。
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文并标明转折；“但”简洁、自然，符合此处的反意连接。
- source_word: εἶπον ὑμῖν
  choice: 我已经告诉过你们
  rationale: 动词为简单过去时，指先前对听众说过的话；现代汉语用“已经……过”自然表达既往陈述及其当前关联。
- source_word: ὅτι
  choice: 冒号引出后文
  rationale: 此词引出所说的内容；汉语直接引语式结构用冒号比机械译成“说……这一点”更自然。
- source_word: καὶ ἑωράκατέ με
  choice: 你们确实已经见过我
  rationale: 第一个καί在语境中带强调意味；“确实”保留这种强调，同时避免把其语义过度限定为让步。完成时以“已经见过”表达既成事实及其现实关联。
- source_word: καὶ οὐ πιστεύετε
  choice: 却仍然不信
  rationale: 第二个καί连接两个形成强烈反差的分句；汉语以“却”自然显出反差，“仍然”体现持续不信的现状。
- source_word: πιστεύετε
  choice: 信
  rationale: 在约翰福音语境中，“信”是πιστεύω直接且惯用的对应词，不把意义缩窄为理智认同，也不擅自扩展为其他神学表述。
theological_decisions:
- issue: καὶ ἑωράκατέ με中第一个καί的语气
  choice: 以“确实”表达强调
  alternative: 译作“虽已见过我”以明确表达让步，或较形式化地译作“也已经见过我”
  rationale: 原文καί可理解为强调或递进，而两个分句之间又有明显反差。正文用“确实……却”既保留强调，也不把其语法功能完全固定为让步；脚注列出合乎语境的让步译法。
- issue: πιστεύω的译法
  choice: 信
  alternative: 相信；信靠
  rationale: “信”是此处最直接、简明且符合约翰著作惯用表达的译法，可保留该动词在对象与内涵上的语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“告诉过你们”符合直接讲话语境；“确实……却仍然……”保留原文强调与反差，并以脚注呈现可成立的让步译法。
