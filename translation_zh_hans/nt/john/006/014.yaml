  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: zh_hans
  text: 众人看见他所行的神迹[a]，就纷纷说：“这真是那位要到世上来的先知[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记号”。约翰常用“记号”（σημεῖον）来强调耶稣所行之事的启示意义，而不只强调其超自然性质。
    reason: lexical_alternative
  - marker: b
    text: “那位先知”很可能指人们所期待的、像摩西一样的先知（申命记18:15–18）。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: 众人……就
  rationale: ἄνθρωποι在此泛指现场群众，并非特指男性；οὖν表示由所见之事引出的反应，用汉语“就”自然承接。
- source_word: ἰδόντες
  choice: 看见
  rationale: 以时间性分句表达不定过去时分词，既自然，也保留先看见、后发言的叙事次序。
- source_word: ὃ ἐποίησεν σημεῖον
  choice: 他所行的神迹
  rationale: σημεῖον在约翰福音中既指超自然作为，也强调其指示、启示意义；现代中文圣经语境中的“神迹”能兼顾两者，并以脚注说明“记号”这一更形式对应的译法。
- source_word: ἔλεγον
  choice: 不断地说
  rationale: 用“不断地”体现未完成过去时所可能表达的持续或反复言说，避免将其压平为一次性的“说”。
- source_word: ἀληθῶς
  choice: 真是
  rationale: 简洁自然地表达ἀληθῶς所强调的真实认定。
- source_word: ὁ προφήτης
  choice: 那位……先知
  rationale: 定冠词指向群众所期待的一位特定先知；中文不以大写标示称号，因此用“那位”显明其特指性，而不在正文中直接认定为“像摩西的先知”。
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: 要到世上来的
  rationale: 保留带冠词的现在分词所表达的描述性称谓和临到世间的期待，同时采用自然现代汉语语序。
theological_decisions:
- issue: “那位先知”的身份
  choice: 正文仅译作“那位要到世上来的先知”
  alternative: 直接译作“那位像摩西一样、将要来的先知”
  rationale: 上下文很可能呼应申命记18:15–18中所期待的先知，但希腊正文并未明说“像摩西一样”；正文保留这种指向与张力，脚注提供互文背景。
- issue: σημεῖον的神学意味
  choice: 正文译“神迹”，脚注补充“记号”
  alternative: 正文直接译“记号”
  rationale: “神迹”在现代中文中能清楚指称群众所见的超常作为，但约翰使用σημεῖον也强调其启示性，因此以脚注保留其字面和神学层面的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断地说”体现希腊语未完成过去时的持续或反复意味；“那位”在不添加身份解释的前提下体现定冠词的特指性。
