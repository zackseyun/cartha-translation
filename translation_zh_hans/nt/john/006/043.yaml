  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们不要在彼此之间抱怨。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抱怨”也可译作“低声发怨言”或“嘀咕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 回答……说
  rationale: 保留希腊文常见的叙事表达，同时采用自然、庄重的现代汉语句式。
- source_word: Μὴ γογγύζετε
  choice: 不要……抱怨
  rationale: 现在时命令式与 μή 既可泛指禁止，也可能针对正在发生的行为；“不要抱怨”不强行限定为“别再抱怨了”。“抱怨”准确表达低声发牢骚、不满议论的含义。
- source_word: μετ’ ἀλλήλων
  choice: 彼此
  rationale: 简洁表达群体成员相互之间的行为，也保留“互相”的关系含义。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
