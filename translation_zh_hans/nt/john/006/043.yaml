  source_fidelity: “抱怨”可恰当表达 γογγύζετε（发怨言、嘀咕不满）。但原译“彼此抱怨”在现代汉语中较容易理解为互相抱怨、即抱怨的对象是对方；μετ’ ἀλλήλων在此是群体内部发生该行为，宜明确为“在彼此之间”。“回答……说”忠实反映 ἀπεκρίθη … καὶ εἶπεν 的叙事公式。
