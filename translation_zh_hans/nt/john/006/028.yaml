base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: zh_hans
  text: 于是他们对他说：“我们该做什么，才可以做上帝的工作？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的工作”也可理解为“上帝所要求的工作”；原文也可能指属于上帝的工作或上帝所做的工作。
    reason: 说明希腊文“上帝的工作”的属格关系可有不同理解，保留正文的歧义。
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: 于是他们问他
  rationale: εἶπον是简单过去时的叙事用语；因后接直接疑问句，汉语用“问”比机械译作“说”自然，又不增添原文没有的内容。οὖν在此承接上文，用“于是”体现叙事推进；πρὸς αὐτόν表示向他发言。
- source_word: Τί ποιῶμεν
  choice: 我们该做什么
  rationale: ποιῶμεν在此构成商议性疑问，询问应采取什么行动；“该做什么”以现代汉语自然表达其要求或责任意味，同时不强化为绝对命令。
- source_word: ἵνα ἐργαζώμεθα
  choice: 才算是在做
  rationale: ἵνα引出目的或预期结果，ἐργαζώμεθα表示从事、做成。结合后面的ἔργα，译文保留“做”的呼应；“才算”自然呈现他们所问的达成条件。
- source_word: τὰ ἔργα
  choice: 工作
  rationale: ἔργα为复数，可指行为、事工或工作。现代汉语中“做上帝的工作”自然且可保留其宽泛含义；汉语集合名词“工作”无需形式上标出复数。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 保留属格结构，不在正文中断定是“上帝所要求的工作”、‘属于上帝的工作’还是‘上帝所做的工作’，让下文第29节继续回应这一张力。
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ中属格的含义
  choice: 正文保留“上帝的工作”这一开放表达
  alternative: 上帝所要求的工作；属于上帝的工作；上帝所做的工作
  rationale: 希腊文属格本身并未明确限定关系，而且第29节有意回应并转化他们的问题；正文不应预先消除这种神学与语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“于是”承接上文；“该做什么”适合实际求问的语气。正文保留“上帝的工作”的歧义，并以脚注说明。脚注标记置于相关句末。
