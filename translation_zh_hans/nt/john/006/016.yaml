  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: zh_hans
  text: 傍晚时，耶稣的门徒下到海边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到湖边”。这里指加利利海；严格说来，它是一个湖，但希腊原文用的是“海”（θάλασσα）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……时
  rationale: ὡς引出时间从句；δέ在此起轻微的叙事过渡作用，现代汉语无需另译为“于是”或“现在”。
- source_word: ὀψία ἐγένετο
  choice: 傍晚时
  rationale: 这一表达指傍晚来到；“傍晚时”自然简洁，也保留时间背景。
- source_word: κατέβησαν
  choice: 下到
  rationale: καταβαίνω表示向下移动；“下到”保留地势和运动方向。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 耶稣的门徒
  rationale: 原文直译为“他的门徒”。本节单独呈现时，“耶稣的门徒”能清楚指明所指，且符合上下文。
- source_word: ἐπὶ τὴν θάλασσαν
  choice: 到海边
  rationale: ἐπί加宾格与运动动词连用，表示朝向或抵达该水域；结合下一节上船的叙事，“到海边”是自然的汉语表达，同时以脚注说明θάλασσα的字面意义。
