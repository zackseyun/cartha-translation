  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: zh_hans
  text: 因此，犹太人[a]因为他说：“我是从天上降下来的粮。”就对他发怨言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“犹太地人”；在某些语境中，也可能指“犹太领袖”。约翰所说的“犹太人”有时是指反对耶稣的某一特定群体，并非泛指全体犹太人。
    reason: 说明οἱ Ἰουδαῖοι可能的所指范围，避免将语境中的冲突泛化为对整个犹太民族的陈述。
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: 纷纷抱怨
  rationale: 未完成时描写过去持续或反复发生的动作；“抱怨”保留γογγύζω含有不满、低声发怨言的意味，“纷纷”自然表现群体中持续出现的反应。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并表示由前述言论引出的反应；“于是”符合现代汉语叙事习惯，又不过分强化严格的逻辑推论。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接对应约翰惯用的希腊语称谓，本节本身没有明确限定为领袖，也不必强加地域性的“犹太地人”含义；脚注说明其在具体语境中可以指反对耶稣的特定犹太群体，而非全体犹太人。
- source_word: περὶ αὐτοῦ
  choice: 抱怨他
  rationale: περί加属格基本表示“关于他”；结合γογγύζω的负面语义，现代汉语用“抱怨他”自然表达因他及其言论而发怨言，但不额外译成更强烈的“反对”或“攻击”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出抱怨的原因，而非单纯引述抱怨的内容；“因为”清楚保留因果关系。
- source_word: εἶπεν
  choice: 他说
  rationale: 简洁对应简单过去事件；汉语无需用“曾经说过”额外突出时序。
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 直接保留带显明主语的自我宣告，不增添解释。
- source_word: ὁ ἄρτος
  choice: 粮
  rationale: “粮”在现代中文圣经语体中可自然指供人食用、维持生命的食粮，并适合本段的比喻性宣告；定指意义由“我是……的粮”这一结构表达。
- source_word: ὁ καταβὰς
  choice: 降下来的
  rationale: 用关系修饰结构表达带冠词的过去分词，既自然又保留从上而下、已经来到的动作含义。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 自然对应ἐκ所表达的来源，保留其从天而来的含义。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，并用脚注限定可能的语境所指
  alternative: “犹太地人”或“犹太人的领袖”
  rationale: 正文紧随希腊原文，不在本节没有明说时擅自缩小为领袖，也不强加地域解释；脚注则防止读者误以为这是对所有犹太人的笼统指称，避免反犹太化的泛读。
- issue: “从天上降下来的粮”的基督论表述
  choice: 按原文保留耶稣的直接自我宣告
  alternative: 解释性扩写为“赐生命的属天食粮”等
  rationale: 本节只重复耶稣先前所说的话；译文不提前加入本段其他经节中的神学说明，以保留叙事张力和原句范围。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“纷纷抱怨”比古雅的“发怨言”更易懂，同时保留群体持续不满的语气；引语简洁，维持原文的重复和叙事推进。
