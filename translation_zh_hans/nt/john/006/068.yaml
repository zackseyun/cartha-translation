  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: zh_hans
  text: 西门·彼得回答他：“主啊，我们还能到谁那里去呢？你有永生的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: 回答他说
  rationale: 既表达回应，又自然带出间接宾语所指的耶稣；符合现代汉语叙事习惯。
- source_word: Σίμων Πέτρος
  choice: 西门·彼得
  rationale: 采用现代中文圣经人名的通行音译，并用间隔号连接复名。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此为呼格；“主啊”既是自然的中文称呼，也保留约翰语境中的尊称及其基督论分量。
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: 我们还能到谁那里去呢
  rationale: “到谁那里去”保留πρός与人的指向；“还能”传达反问所隐含的别无可投之意，但不指定任何未明说的对象。
- source_word: ῥήματα
  choice: 话
  rationale: 此处指耶稣所说的话；中文集合名词“话”比“言语”更自然，同时不改变原文复数在语义上的内容。
- source_word: ζωῆς αἰωνίου
  choice: 永生的
  rationale: 保留约翰著作中重要的固定表达“永生”，并维持属格修饰关系。
- source_word: ἔχεις
  choice: 你有
  rationale: 直接对应现在时的拥有表达，简洁自然。
theological_decisions:
- issue: Κύριε用于称呼耶稣时的含义
  choice: 主啊
  alternative: 老师啊／先生啊
  rationale: “主”同时容纳尊敬称呼与约翰福音语境中的基督论回响，不把此处强行缩减为一般师生称谓，也不超出原文明确断言。
- issue: “永生的话”的属格关系
  choice: 保留“永生的话”
  alternative: 赐永生的话
  rationale: 原文ζωῆς αἰωνίου的属格可涉及内容、性质或结果；直译式表达保留这种张力，不擅自明确为单一的使役关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句用“还能……呢”呈现彼得所表达的别无可投；“永生的话”保留原文简洁且富有张力的属格结构。
