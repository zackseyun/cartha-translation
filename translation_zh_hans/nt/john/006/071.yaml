  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: zh_hans
  text: 他所说的是犹大，就是加略人西门的儿子；因为这个人将要出卖[a]他——他是十二人中的一个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他交出去”。
    reason: 保留παραδίδωμι较为字面的动作含义，与正文“出卖”的语境化译法并列。
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: 他所说的，是……犹大
  rationale: 这里是叙述者对前一句话所指对象的解释。“所说的，是”符合现代汉语表达，也不把未明说的含义强化为“意指”。δὲ仅作轻微承接，无须机械译出。
- source_word: Σίμωνος Ἰσκαριώτου
  choice: 加略人西门的儿子
  rationale: 两个属格最自然地表明父子关系，并使“加略人”依照现有希腊词序修饰西门。
- source_word: οὗτος γὰρ
  choice: 因为这个人
  rationale: “因为”保留γὰρ的解释作用；“这个人”保留οὗτος的指示和轻微强调。
- source_word: ἔμελλεν
  choice: 将要
  rationale: 表达从叙事时点看即将发生或未来在望的行动，不额外加入命定或主观意图。
- source_word: παραδιδόναι αὐτόν
  choice: 出卖他
  rationale: παραδίδωμι的基本动作是交出、交付，但在约翰受难叙事中指犹大以背叛方式把耶稣交给敌对者；“出卖”简洁地传达此处的关系和叙事含义。
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: 他是十二人中的一个
  rationale: 保留原文对犹大属于“十二人”这一群体的强调，不添加原文没有的“使徒”；破折号使补充说明在现代汉语中清楚自然。
theological_decisions:
- issue: 如何翻译犹大所要做的παραδιδόναι
  choice: 出卖他
  alternative: 把他交出去
  rationale: “出卖”体现本段语境中该行动的背叛性质；脚注同时保留动词较为字面的“交出去”，不将词义张力隐藏起来。
- issue: ἔμελλεν是否表达命定
  choice: 将要
  alternative: 注定要
  rationale: 原词可表示未来在望，此处不必加入更强的命定含义；“将要”保留叙事预告，同时避免替文本解决神学上的因果问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“加略人西门的儿子犹大”依从希腊语句法；“十二人”保留原文对固定群体的称呼，不扩写为“十二使徒”或“十二门徒”。脚注标记紧跟其所说明的“出卖”。
