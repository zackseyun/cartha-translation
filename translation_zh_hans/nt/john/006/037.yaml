  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: zh_hans
  text: 父所赐给我的一切，都会到我这里来；到我这里来的人，我绝不把他赶出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝不”也可译作“决不会”或“无论如何也不会”。希腊文使用了强调否定的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: 一切
  rationale: 希腊文采用中性单数的集合性表达。译作“一切”既保留其集合形式，也避免直接改写成逐个指人的“每一个人”。
- source_word: δίδωσίν μοι
  choice: 所赐给我的
  rationale: 以“赐给”表达父的给予，并保留现在时本身未明确限定为已经完成或持续进行的含义。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文有定冠词而无“我的”这一物主词；汉语约翰文体中用“父”自然且不增添原文没有的措辞。
- source_word: πρὸς ἐμὲ ἥξει
  choice: 都会到我这里来
  rationale: “到我这里来”自然表达朝向耶稣而来的意思；“会”对应将来时，结合集合性主语用“都”使汉语顺畅。
- source_word: τὸν ἐρχόμενον πρός με
  choice: 到我这里来的人
  rationale: 保留带冠词的现在分词所具有的泛指单数形式，不将其扩大解释为原文之外的教义命题。
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: 我绝不把他赶出去
  rationale: “绝不”传达 οὐ μή 的强烈否定；“赶出去”同时体现 ἐκβάλλω 与 ἔξω 的驱逐、向外之意，现代汉语清楚自然。
theological_decisions:
- issue: 中性单数集合表达 πᾶν ὃ 与父的赐予、人到耶稣这里来之间的关系
  choice: 译作集合性的“父所赐给我的一切”
  alternative: 父所赐给我的每一个人
  rationale: 保留希腊文中性单数的集合表达，不预先裁定这里应按群体整体还是按个体来理解，从而保留原文的神学张力。
- issue: οὐ μὴ ἐκβάλω ἔξω 中应许的强调程度
  choice: 译作“我绝不把他赶出去”
  alternative: 我决不会把他丢在外面
  rationale: 明确传达原文的强调否定，同时不把本节扩展成关于坚忍或离弃之可能性的后期宗派性公式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赐给”保留经文语域但仍为普通读者易懂；“到我这里来”和“赶出去”清楚直接。集合性“一切”可能让读者感到所指较宽，但这是有意保留原文中性单数形式，而不在正文中改释为“每一个人”。
