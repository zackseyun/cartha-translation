  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: zh_hans
  text: 差我来的那一位的旨意就是：凡他所赐给我的，我一个也不失落[a]，反而要在末日使他们复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更贴近希腊文的集合表达译作：“他所赐给我的一切，我一点也不失落……反而要在末日使这一切复活。”希腊文直译为中性单数：“一切……它”。按语境，这里所指的是人。
    reason: 说明原文使用中性单数的集合表达，并提供保留其语法形式的替代译法。
lexical_decisions:
- source_word: θέλημα
  choice: 旨意
  rationale: 表达神的意愿与目的，是现代中文圣经语体中自然、庄重而不过度限定其性质的译法。
- source_word: τοῦ πέμψαντός με
  choice: 差我来的那一位
  rationale: 保留实体化分词的关系性和πέμπω的动作含义，同时符合自然中文表达。
- source_word: ἵνα
  choice: 就是：
  rationale: 此处引出旨意的具体内容；以“就是”加冒号自然呈现内容关系，也不排除其中的目的意味。
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: 凡他所赐给我的
  rationale: 以“凡……的”保留希腊文中性单数集合表达的整体性；中文不必明示物或人，因此可保留指称上的含混。
- source_word: δέδωκέν
  choice: 所赐给
  rationale: “赐给”准确表达给予，且适合父与子这一语境；中文不以时态屈折标示完成体，但“所……的”结构自然指向已经成就并仍然有效的给予。
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: 我一个也不失落
  rationale: ἀπόλλυμι在此宜理解为失去；“一个也不”自然表达从所赐整体中不失去任何一个，并由上下文体现ἐξ αὐτοῦ的部分关系。
- source_word: ἀναστήσω αὐτὸ
  choice: 要使他复活
  rationale: 这里指末世的复活。“使……复活”比字面的“使……起来”更清楚；中文必须选择代词，正文按语境采用人格化的“他”，脚注说明希腊文为中性单数集合表达。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: 简洁、自然，并保留约翰福音中的末世性指向。
theological_decisions:
- issue: 所赐对象应译为人格化的众人，还是保留希腊文中性单数的集合表达
  choice: 正文用“凡他所赐给我的……一个……他”，脚注交代希腊文的中性单数集合形式
  alternative: “他所赐给我的一切……一点也不失落……使这一切复起”
  rationale: “凡他所赐给我的”在中文中不明说人或物，可保留原文开头的集合性与含混；后文因“复活”的语境自然指向人，采用“一个”“他”更符合现代汉语。脚注保留原文形式所带来的神学张力，避免把中性集合表达完全抹平。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“差我来的那一位”“旨意”“末日”“复活”延续约翰福音的正式语域；正文避免生硬复制希腊文中性代词，同时以脚注保存其集合单数形式及解释空间。
