id: JHN.6.19
reference: John 6:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: zh_hans
  text: 他们划了约二十五或三十斯他迪昂[a]，就看见耶稣在海面上行走[b]，正向船靠近，于是害怕起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯他迪昂”是古代长度单位；二十五或三十斯他迪昂约合五至六公里。
    reason: cultural_note
  - marker: b
    text: 也可译作“在水面上行走”。希腊原文直译是“在海上行走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: 划了
  rationale: ἐλαύνω在行船语境中指用桨推进船只；“划了”比泛泛的“走了”更准确，也自然表达该分词相对于主句动作的先行动作。
- source_word: οὖν
  choice: 就
  rationale: οὖν在此承接上文并推进叙事；现代汉语用“就”既自然，又保留事件承接关系。
- source_word: ὡς
  choice: 约
  rationale: ὡς用于度量时表示约数，“约”简洁准确。
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: 二十五或三十斯他迪昂
  rationale: 保留原文古代长度单位，并在脚注换算为现代单位，避免把换算值直接代替原文表述。
- source_word: θεωροῦσιν
  choice: 看见
  rationale: θεωρέω虽可含注视、观察之意，此处用普通而自然的“看见”足以表达视觉感知。
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: 在海面上行走
  rationale: θάλασσα是“海”，ἐπί在本语境中表示行走所处的表面；“在海面上行走”既保留“海”的措辞，也在汉语中清楚表达事件。
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: 正向船靠近
  rationale: γίνομαι与ἐγγύς连用表达进入邻近状态，含趋近过程；“正向船靠近”比静态的“在船附近”更贴切。
- source_word: πλοίου
  choice: 船
  rationale: πλοῖον在加利利湖的语境中指船只；汉语“船”自然中性，不会暗示大型海船。
- source_word: ἐφοβήθησαν
  choice: 害怕起来
  rationale: 表达门徒见到这一景象后产生恐惧的反应，也体现不定过去时所叙述的起始性事件。
theological_decisions:
- issue: 如何译出神迹描述而不削弱其字面力度
  choice: 在海面上行走
  alternative: 沿着海边行走；在水面上行走
  rationale: 门徒当时已在水上远离岸边，因此“沿着海边”不合上下文；原文用θάλασσα（海）而非“水”。“在海面上行走”保留原词和叙事所呈现的非凡事件，不另加教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。主句按汉语叙事习惯顺接各动作；保留古代长度单位，并用脚注提供现代换算。“海面上”使汉语表达自然，同时没有把原文θάλασσα改写成“水”。
