  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: zh_hans
  text: 这就是从天上降下来的饼[a]，好叫人吃这饼而不死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是正从天上降下来的饼。”
    reason: 原文用现在分词，可较显明地表达正在进行或具有持续特征的“降下”。
  - marker: b
    text: 这里的“不死”保留原文较宽泛的说法；按上下文，可理解为免于最终的死亡、属灵的死亡或末世的毁灭。
    reason: 避免在正文中把原文未明确限定的死亡性质解释得过窄。
lexical_decisions:
- source_word: οὗτός
  choice: 这就是
  rationale: 指向并认定耶稣正在说明的“饼”；“这就是”符合现代汉语的判断句表达，也保留原文的直接性。
- source_word: ἄρτος
  choice: 饼
  rationale: 保留“面饼、饼食”的基本词义及本段中的比喻力量，不泛化为“食物”。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: 从天上降下来的
  rationale: 用自然的汉语关系结构表达现在分词；既保留“从天上而来”的动态，也不把它限定为一次已经完成的下降。
- source_word: οὐρανός
  choice: 天上
  rationale: 本语境指属天的领域，而非物理意义的天空；“从天上”是自然且庄重的汉语表达。
- source_word: ἵνα
  choice: 为使
  rationale: 保留ἵνα所表达的目的或结果关系，同时使句子简洁通顺。
- source_word: τις
  choice: 人
  rationale: 在“使人……”结构中表达不定、泛指的个人，避免误限于某一特定对象。
- source_word: ἐξ αὐτοῦ
  choice: 吃了它
  rationale: 汉语通常直接说“吃它”，不必生硬地照搬ἐξ的“从其中吃”；所指仍明确是这饼。
- source_word: φάγῃ
  choice: 吃了
  rationale: 在目的从句中自然表达一次性的取食行动；与“便不死”搭配，保留原文概括性的陈述。
- source_word: μὴ ἀποθάνῃ
  choice: 便不死
  rationale: ἀποθνῄσκω的基本意思是“死”；不译成“灭亡”，以免加入原文本句未明说的解释。
theological_decisions:
- issue: “不死”所指的死亡性质
  choice: 保留宽泛的“不死”，不明确限定为肉身、属灵或末世意义的死亡。
  alternative: 译为“不在灵性上死亡”或“不至永远灭亡”。
  rationale: 生命之粮论述赋予“死”深厚的神学含义，但本节自身没有将其明确定义；直译可保留约翰文本中的张力和多层意涵。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“饼”保留核心意象；“为使人吃了它便不死”清楚呈现目的关系，并避免古雅的“吃这饼的就永远不死”等增译。
