  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: zh_hans
  text: 他又说：“所以我已经告诉你们，若不是父赐给他[a]，就没有人能到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阳性单数“他”，在这里是泛指，意思是任何人，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 他又说
  rationale: 未完成时在这里承接正在进行的讲论；现代汉语用“又说”自然地表达继续发言，不生硬仿译为“他一直在说”。
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 该短语回指前文并引出解释；“所以”简洁自然，同时保留因果承接关系。
- source_word: εἴρηκα
  choice: 我已经告诉你们
  rationale: 完成时表示先前所说的话仍与当前情境相关；“已经告诉”既保留这一时体意味，也符合对听众说话的汉语习惯。
- source_word: οὐδεὶς δύναται
  choice: 没有人能
  rationale: 明确表达能力上的不能，而非不获许可；“没有人能”是现代汉语中准确而自然的说法。
- source_word: ἐλθεῖν πρός με
  choice: 到我这里来
  rationale: 自然表达“来到我这里”，并保留约翰语境中的关系性含义，不在译文中额外解释为“相信我”。
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: 若不是……赐给
  rationale: 保留被动意义及必要条件。汉语以“父赐给他”表达更自然；“赐”既对应 δίδωμι 的给予意义，也适合神为来源的语境，但不进一步界定这种赐予如何运作。
- source_word: αὐτῷ
  choice: 他
  rationale: 原文为阳性单数，具有泛指作用；汉语“他”保留原文形式，脚注说明其泛指性质。
- source_word: ἐκ τοῦ πατρός
  choice: 父赐给
  rationale: ἐκ 表示来源。汉语若直译“从父赐给”不自然，故将来源关系融入“父赐给”的结构；不借此扩展为某一神学体系中的特定施行方式。
theological_decisions:
- issue: 人到耶稣这里来所需的神圣赐予与人的能力
  choice: 直译为若非父有所赐予，就没有人能到耶稣这里来
  alternative: 将其解释为必然生效的呼召，或解释为普遍临到所有人的先行恩典
  rationale: 原文清楚表明父的赐予是人来到耶稣这里的必要条件，却没有在本节界定这种赐予的范围、方式或是否必然产生回应，因此译文不替后来的神学争论作结论。
- issue: αὐτῷ 的泛指阳性单数
  choice: 正文译作“他”，并用脚注注明是泛指
  alternative: 译作“那人”或“任何人”
  rationale: “他”形式上贴近原文单数阳性；脚注则防止读者误以为只指某个特定男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父”依约翰福音语境指父神；不加“神”字，以保留原文简洁称谓。脚注标记紧随“他”，明确对应所注词语。
