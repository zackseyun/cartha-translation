  terminology: “父”与本段约翰语境及原文定冠词称谓相符，保留其简洁而具特指性的神学用语。“赐给”适合神圣来源的语境，同时没有把给予解释为特定教义体系中的“有效呼召”或“先行恩典”。脚注对阳性单数 αὐτῷ 的泛指功能说明准确，且标记紧随“他”。
