  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: zh_hans
  text: 所以，耶稣对他们说：“我实实在在地告诉你们：除非你们吃人子的肉[a]、喝他的血，否则你们里面就没有生命[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“身体”；希腊文是“肉”（σάρξ），后者保留了这句话具体而强烈的表达。
    reason: lexical_alternative
  - marker: b
    text: 本节原文只说“生命”，没有说“永生”；不过在约翰福音更广的语境中，这生命常与永生相联系。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并引出耶稣针对争议所作的回应；“于是”在现代汉语中自然地表达语篇上的承接与推进。
- source_word: Ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 保留约翰福音中双重“阿们”公式的郑重和强调语气，同时采用现代中文读者熟悉且庄重的表达。
- source_word: ἐὰν μὴ
  choice: 除非……否则……
  rationale: 清楚表达希腊文条件结构，并准确维持“吃”与“喝”共同构成条件的关系。
- source_word: φάγητε
  choice: 吃
  rationale: 采用普通、直接的字面义，保留原话具体而强烈的形象。
- source_word: σάρκα
  choice: 肉
  rationale: σάρξ在此意为具体的“肉”；不用“身体”，以免减弱原文刻意鲜明的措辞或预先导向特定礼仪解释。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子的
  rationale: 保留耶稣这一固定自称及其经文传统和弥赛亚意涵。
- source_word: πίητε
  choice: 喝
  rationale: 直译πίνω，与“吃”形成原文中的鲜明并列。
- source_word: αἷμα
  choice: 血
  rationale: 保留原文直接、震撼且具有神学分量的意象。
- source_word: ζωὴν
  choice: 生命
  rationale: 原文只有“生命”，没有“永恒”一词，因此不在正文中增译“永生”。
- source_word: ἐν ἑαυτοῖς
  choice: 你们里面
  rationale: 自然而贴近原文地表达生命不在听众自身里面这一陈述。
theological_decisions:
- issue: 吃肉、喝血的语言应按字面保留，还是按圣餐或比喻意义解释
  choice: 保留“吃人子的肉、喝他的血”的具体措辞，不作解释性扩写
  alternative: 译作“领受”“分享”，或采用明确指向圣餐的“吃身体”等措辞
  rationale: 原文措辞有意具体而具有冲击力。直译能够保留它在圣餐、比喻或两者兼有等理解之间的神学张力，不让译文预先裁定。
- issue: 是否依据约翰福音的整体语境将ζωή扩译为“永生”
  choice: 正文只译“生命”
  alternative: 译为“永生”
  rationale: 本节没有αἰώνιος（永恒的）；虽然上下文常把这种生命与永生相连，译文仍不应加入原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实实在在地告诉你们”保留约翰式郑重宣告的语气；“除非……否则……”使复合条件关系清晰。“肉”和“血”不作委婉处理，以保存原文的具体性、冲击力及未被化解的神学张力。
