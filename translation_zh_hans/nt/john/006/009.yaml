  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: zh_hans
  text: 这里有一个男孩，他有五个大麦饼和两条鱼；可是，这些给这么多人算得了什么呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: 孩子
  rationale: 指儿童或年幼的男孩；“孩子”自然、现代，也不额外强调年龄大小。上下文中的阳性关系代词表明这里是男孩，但汉语正文无需生硬重复性别信息。
- source_word: ὧδε
  choice: 这里
  rationale: 直接表达地点副词的含义，简洁自然。
- source_word: ὃς ἔχει
  choice: 带着
  rationale: 原文直译为“有”；在说明随身食物的语境中，“带着”更符合现代汉语，同时保留拥有、持有之意。
- source_word: ἄρτους κριθίνους
  choice: 大麦饼
  rationale: ἄρτους 指饼或面包，κριθίνους 表明以大麦制成；“大麦饼”符合古代近东食物语境，也比“大麦面包”更凝练。
- source_word: ὀψάρια
  choice: 鱼
  rationale: 本词在这里指配饼食用的鱼；不译作“小鱼”，以免加入原文未明确表达的大小。
- source_word: ἀλλὰ
  choice: 可是
  rationale: 清楚标示现有食物与庞大人数之间的反差，并保持话语的自然口吻。
- source_word: ταῦτα τί ἐστιν
  choice: 这些……算得了什么呢
  rationale: 该问句在语境中衡量这些食物是否足够；此译法自然呈现其反问和不足之意，同时保留“这些”的复数指向。
- source_word: εἰς τοσούτους
  choice: 给这么多人
  rationale: εἰς 在此表示相对于这么多人而言是否够用；“给这么多人”是自然且准确的现代汉语。
