  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: zh_hans
  text: 他说这话，是要考验腓力[a]；因为他自己知道将要做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“试验腓力”。原文这个词也可表示“试探”，但这里是考验、检验的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: 他说这话
  rationale: τοῦτο指前面耶稣所问的话；δὲ在此推进并解释叙事，汉语不必机械译出“但”；ἔλεγεν虽为未完成时，但现代汉语用“说”即可自然表达该叙事动作。
- source_word: πειράζων αὐτόν
  choice: 是要考验腓力
  rationale: 分词在语境中表达目的；πειράζω在此指检验、试验，而非引诱犯罪。代词αὐτόν所指为上文的腓力，明译其名有助于单节阅读而不改变所指。
- source_word: αὐτὸς γὰρ ᾔδει
  choice: 其实他自己知道
  rationale: γὰρ引出解释，译作“其实”自然呈现说明和轻微反差；αὐτός具有强调作用，故保留为“他自己”。
- source_word: τί ἔμελλεν ποιεῖν
  choice: 将要做什么
  rationale: μέλλω加不定式表示即将或预定采取的行动；“将要做什么”保留前瞻意义，不额外断定侧重于意图还是时间上的临近。
theological_decisions:
- issue: πειράζων所表达的耶稣对腓力的行动
  choice: 考验
  alternative: 试验；试探
  rationale: 上下文显示耶稣是在检验腓力的认识和反应，并非诱使他犯罪。“考验”既符合语境，也保留该词检验、验证的含义。
- issue: 耶稣预先知道自己行动的强调
  choice: 他自己知道
  alternative: 他知道
  rationale: 希腊文显式使用强调代词αὐτός，应在中文中保留“自己”，但不扩展为经文本身未明说的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“其实”自然承接γὰρ的解释作用；分号呈现前后两分句之间的理由关系。脚注标记已在正文中对应出现。
