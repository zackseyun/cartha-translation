  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: zh_hans
  text: 吃[a]我的肉、喝我的血的人有永生；在末日，我要使他复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃”的原文动词比一般表示“吃”的词更具体，也可译作“咀嚼”或“以……为食”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: 吃……的人
  rationale: 定冠词加现在分词构成名词性表达，指以这一行为为特征的人；中文用“……的人”保留单数指称和持续、特征性的意味。
- source_word: τρώγων
  choice: 吃
  rationale: τρώγω比一般表示“吃”的词更具体，可有咀嚼、以某物为食之意；正文采用自然清楚的“吃”，并以脚注保留其较鲜明的语感。
- source_word: μου τὴν σάρκα
  choice: 我肉
  rationale: σάρξ在此是具体的“肉”，不淡化为“身体”，也不作神学性释义。中文在领属结构中自然表达为“我肉”。
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: 喝我血
  rationale: 与前一现在分词保持平行，保留“喝”和“血”的具体直白表达。
- source_word: ἔχει
  choice: 有
  rationale: 直译现在时，表达永生是此人现今已有的生命。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是约翰著作中自然、稳定的中文表达，同时涵盖生命的恒久性与末世性质。
- source_word: κἀγώ
  choice: 并且……我
  rationale: κἀγώ由καί与ἐγώ合成；“并且”保留与前句的连接，“我”保留明确而略带强调的主语。
- source_word: ἀναστήσω αὐτόν
  choice: 我要使他复活
  rationale: 在末世语境中，ἀνίστημι指使人从死里起来；“使他复活”准确、自然，并以“他”对应阳性单数代词αὐτόν及前面的单数主体。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: 采用约翰福音末世论表达的常用中文译法，简洁自然。
theological_decisions:
- issue: 吃肉、喝血的语言应按字面保留，还是在正文中解释为圣餐或相信
  choice: 保留具体的“吃我肉、喝我血”
  alternative: 在正文中明确解释为领受圣餐，或解释为相信耶稣
  rationale: 原文有意采用具体而强烈的肉与血、吃与喝的语言；直译可保留其神学张力，不预先裁定圣餐性或隐喻性的解释。
- issue: 永生与末日复活之间的时间张力
  choice: “有永生”用现在时，同时保留“在末日……复活”的将来表达
  alternative: 把永生全部处理为将来所得，或把末日复活弱化为纯粹现今的属灵经验
  rationale: 原文同时断言现在拥有永生和将来在末日复活，译文保留二者，不加以调和。
- issue: αὐτόν的性别与单数指称
  choice: 他
  alternative: 那人；他们
  rationale: 原文是阳性单数，并回指单数的名词性分词结构；“他”忠实保留语法上的单数男性形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃我肉、喝我血”刻意保持原文的直白与冲击力；句法简洁，并用“并且”连接现今拥有永生与末日复活两个陈述。
