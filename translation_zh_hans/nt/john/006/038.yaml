  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: zh_hans
  text: 因为我从天上降下来，不是要行我自己的旨意，而是要行那差遣我者的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文并引出理由；“因为”自然保留因果和解释作用。
- source_word: καταβέβηκα
  choice: 我……降下来
  rationale: “降下来”准确表达由天而降的空间意象；汉语通常不以形态标示希腊语完成时，其已完成且与当前相关的意义由语境体现。
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 这是现代汉语自然、清楚的表达，同时保留约翰福音中的属天来源意象。
- source_word: οὐχ ἵνα ποιῶ
  choice: 不是要行
  rationale: “不是要”表达否定的目的；“行”与“旨意”搭配庄重自然，并保留下文平行结构。
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: 我自己的旨意
  rationale: “自己的”体现ἐμὸν的强调；“旨意”保留θέλημα在本段中的意愿、目的及神学分量。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与“不是”构成现代汉语清晰有力的对照结构。
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: 那差我来者的旨意
  rationale: 按带冠词的分词结构译为人物称谓，不在本节中提前补明为“父”；“差我来”是汉语圣经语体中自然且准确的使命表达。
theological_decisions:
- issue: 耶稣从天上降下所表达的基督论意义
  choice: 直译为“我从天上降下来”，保留其属天来源的明确陈述。
  alternative: 弱化为仅指从神领受使命的比喻说法。
  rationale: 原文明确使用从天而降的空间语言；译文不将其削弱为单纯的差遣隐喻，也不增添经文本身没有的教义说明。
- issue: 耶稣自己的旨意与差他来者的旨意之间的关系
  choice: 两处都译作“旨意”，保留真实的对照与平行。
  alternative: 动态译作“我想做的事”与“他想要的事”。
  rationale: 重复“旨意”既忠实于θέλημα的重复，也保留使命、顺服和位格关系中的神学张力，不用后来的技术性范畴加以化解。
- issue: 差遣者的身份表达
  choice: 译作“那差我来者”，不直接补作“父”。
  alternative: 根据上下文明确译作“差我来的父”。
  rationale: 上下文可使读者明白所指，但本节希腊文本只使用带冠词的分词称谓；保留这一表达可避免超出本节明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“不是……而是……”保存原文鲜明对照，以重复“旨意”保存形式平行；本节无须脚注。
