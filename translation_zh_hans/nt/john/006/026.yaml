id: JHN.6.26
reference: John 6:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: zh_hans
  text: 耶稣回答他们说：“我实实在在地告诉你们：你们找我，不是因为看见了神迹，而是因为吃了那些饼，吃饱了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“从那些饼中吃了，并且得了饱足”；“吃饱了”也可译为“得了满足”。
    reason: 说明ἐκ τῶν ἄρτων的部分语气及ἐχορτάσθητε的词义范围。
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: 耶稣回答他们说
  rationale: 既保留希腊文“回答……并说”的双重引语结构，也符合现代汉语叙事习惯。
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: 我实实在在地告诉你们
  rationale: 采用现代中文圣经读者熟悉而庄重的表达，保留约翰福音双重ἀμήν所具有的郑重强调。
- source_word: ζητεῖτέ με
  choice: 你们找我
  rationale: 自然表达当前持续寻找耶稣的行动；不增添“寻求”可能带有的属灵理解。
- source_word: σημεῖα
  choice: 神迹
  rationale: 在现代中文圣经语境中，“神迹”能自然指耶稣所行、具有指示意义的非凡作为；不译作单纯的“奇迹”，以免完全抹去其启示功能。
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: 吃了那些饼
  rationale: “那些饼”保留复数定冠词所指的先前饼食；汉语无需生硬直译部分语气“从那些饼中吃了”。
- source_word: ἐχορτάσθητε
  choice: 吃饱了
  rationale: 准确表达被喂至饱足的结果，并以自然现代汉语保留喂饱事件的具体含义。
theological_decisions:
- issue: σημεῖα在约翰福音中的含义
  choice: 神迹
  alternative: 记号；奇迹
  rationale: “记号”较贴近该词的基本指示意义，却可能使普通中文读者误解为一般标志；“奇迹”又容易只强调超自然性。“神迹”兼顾可懂性及约翰所述耶稣作为的启示性质，但不在正文中解释其全部神学含义。
- issue: 群众寻找耶稣的动机对比
  choice: 不是因为看见了神迹，而是因为吃了那些饼，吃饱了
  alternative: 不是因为领会了神迹，而是因为吃饼得了满足
  rationale: 原文只说“看见”，不明确说他们是否“领会”；因此不把耶稣的责备解释为缺乏属灵领悟，以保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我实实在在地告诉你们”保留约翰式郑重宣告；其余句式力求让普通读者一读即懂，同时避免把“看见神迹”解释成“领会神迹”。
