  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: zh_hans
  text: 他们吃饱[a]以后，他对门徒说：“把剩下的碎块[b]收集起来，免得有任何东西失掉[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得到饱足”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“碎片”。原文没有明说“饼”，但上下文所指的是饼。
    reason: lexical_alternative
  - marker: c
    text: 也可按这里的实际含义译作：“免得浪费任何一点。”原文较直译为“免得有任何东西失掉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: 以后
  rationale: 在叙事中自然表达时间关系；δέ仅承接上文，不必另译为较强的转折词。
- source_word: ἐνεπλήσθησαν
  choice: 他们吃饱
  rationale: 该动词在食物语境中表示被充满、得到饱足；“吃饱”既准确又符合现代汉语习惯。
- source_word: λέγει
  choice: 他说
  rationale: 希腊文使用历史现在时；现代汉语动词本身不强制标明时态，“说”可自然保留叙事的鲜活感，无须刻意改写时态。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对门徒
  rationale: “门徒”是福音书中 μαθηταί 的准确通行译法；依汉语习惯省去不必要的“他的”，所指仍然清楚。
- source_word: Συναγάγετε
  choice: 收集起来
  rationale: 准确传达直接命令以及把散落之物聚拢起来的动作。
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: 剩下的碎块
  rationale: “剩下的”表达 περισσεύω 所指的余剩；“碎块”保留 κλάσματα 作为掰开后小块的含义，同时不擅自补出“饼”。
- source_word: ἵνα μή τι ἀπόληται
  choice: 免得有一点失落
  rationale: 尽量保留 ἀπόλλυμι 的“失去、失落”措辞和 τι 的不定指意义，不在正文中收窄为单纯的“浪费”。
theological_decisions:
- issue: 神迹语境中 ἀπόληται 是否带有救恩论回响
  choice: 正文译为“失落”，首先按上下文指剩余食物，同时保留约翰用词可能产生的回响。
  alternative: 译为“浪费掉”，只突出实际层面的惜物意义。
  rationale: 本节直接谈论收集剩余碎块，但 ἀπόλλυμι 在约翰福音别处也可带有更强的神学意味。译文不把这种意味强加给本节，也不以解释性译法将其完全排除。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“吃饱”“收集起来”口吻清楚直接；“失落”略带原文色彩，用脚注说明其实际语境中的另一种自然表达。
