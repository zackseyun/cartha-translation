  rationale: 仅修正目的从句的汉语表达及相应脚注。“有任何东西失掉”自然地对应μή τι ἀπόληται，既维持其字面“失掉／失去”的措辞，也不将其神学化或限定为“浪费”。其余译文可保留：汉语不以动词形态标示历史现在时，故“他说”已可充分承载叙事；此处以代词“他”承接上下文亦清楚。
