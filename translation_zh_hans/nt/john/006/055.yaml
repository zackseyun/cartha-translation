  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: zh_hans
  text: 因为我的肉是真正的食物[a]，我的血是真正的饮品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真正的食物”和“真正的饮品”，或译“真实的食物”和“真实的饮品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，保留γάρ的解释性语篇功能；现代汉语中用“因为”自然清楚。
- source_word: σάρξ
  choice: 肉
  rationale: 按字面译出，并与“血”构成平行，避免以“身体”等解释性表达弱化原文措辞。
- source_word: ἀληθής
  choice: 真正的
  rationale: 既体现“真实、确实”的直接语义，也符合现代汉语修饰“食物、饮品”的自然表达；脚注保留“真实的”这一较形式对应的译法。
- source_word: βρῶσις
  choice: 食物
  rationale: 该词可指进食行为或所吃之物；此处作表语并与πόσις平行，宜理解为所吃的食物。
- source_word: αἷμα
  choice: 血
  rationale: 忠实直译，并保留“肉—血”的平行结构及原文的鲜明表达。
- source_word: πόσις
  choice: 饮品
  rationale: 该词可指饮用行为或所饮之物；此处与“食物”对应，译为“饮品”自然且准确。
theological_decisions:
- issue: 在圣餐相关语境中如何翻译ἀληθής
  choice: 真正的
  alternative: 真实的
  rationale: “真正的”保留原文关于真实、确实的力度，同时不把本节预先限定为某一种圣餐神学解释；以脚注列出“真实的”，保存词义与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“肉”和“血”保留原文具体、强烈的平行表达；“食物”和“饮品”形成自然对应。
