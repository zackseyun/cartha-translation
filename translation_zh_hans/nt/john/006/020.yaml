  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: zh_hans
  text: 他却对他们说：“是我[a]，不要怕！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“我是”。在《约翰福音》中，这个说法既可用于简单表明身份，也可能让人联想到更广的神学主题。
    reason: 保留原文较直译的形式及其可能具有的神学回响。
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他却
  rationale: 定冠词在这里作代词用，指上下文中的耶稣；δέ是较轻的转折或推进连接词，用“却”自然地表现叙事中的转折，不将语气译得过重。
- source_word: λέγει
  choice: 说
  rationale: 原文使用叙事性现在时；现代汉语叙事通常无需在动词形式上标明时态，“说”既自然又保留动作本身。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 原文是复数代词，并未在本节再次明说“门徒”；“对他们”直接保留原文的指代方式，由上下文确定所指。
- source_word: Ἐγώ εἰμι
  choice: 是我
  rationale: 在当前场景中，这句话首先用于向惊恐的门徒表明身份；“是我”是现代汉语中自然的自我辨认用语。原文也可较直译为“我是”，其在《约翰福音》中可能具有更广的神学回响，故在脚注中保留。
- source_word: μὴ φοβεῖσθε
  choice: 不要怕
  rationale: 这是带μή的现在时命令式否定表达。“不要怕”简洁、自然，符合耶稣在风浪中安慰门徒的语境，也准确传达禁止或劝止恐惧的意思。
theological_decisions:
- issue: Ἐγώ εἰμι应译作普通的自我辨认，还是保留较直译的“我是”及其可能的神学含义
  choice: 正文译作“是我”
  alternative: “我是”或“我就是”
  rationale: 直接语境表明，耶稣是在向门徒表明身份并消除他们的恐惧，因此“是我”最自然地传达该短语在本句中的功能。不过，《约翰福音》中ἐγώ εἰμι的用法可能带有超出普通自我辨认的回响；脚注列出较直译形式，以保留这种可能性，而不在正文中强行判定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“他却”承接上下文并表现轻微转折；“不要怕”比“不要惧怕”更贴近日常表达，同时仍适合经文体。
