  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: zh_hans
  text: 除非差我来的父吸引他[a][b]，否则没有人能到我这里来；我也要在末日使他复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吸引”也可译作“拉”或“拖”。希腊文动词可以带有较强的拉动意味；正文采用“吸引”，既保留使人趋近的意思，也不预先限定父使人到子这里来的具体方式。
    reason: lexical_alternative
  - marker: b
    text: 原文用阳性单数代词“他”，在这里具有代表性，泛指任何人，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: 没有人能
  rationale: 自然地表达普遍否定和能力上的不能，保留原文“无人有能力”的力度。
- source_word: ἐλθεῖν πρός με
  choice: 到我这里来
  rationale: 符合现代汉语习惯，同时保留约翰福音中“到耶稣这里来”的关系性和救恩语境，不作过度阐释。
- source_word: ἐὰν μὴ
  choice: 除非……否则
  rationale: 清楚、自然地再现原文的必要条件结构。
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: 差我来的父
  rationale: 以简洁的关系分句表达带冠词的分词结构，并保留耶稣对“父”的称呼。
- source_word: ἑλκύσῃ
  choice: 吸引
  rationale: “吸引”既能表达使人趋近的作用，也避免在正文中把该词限定为强制性的“拖”或“拉”；较强的词义可能性收入脚注。
- source_word: αὐτόν
  choice: 他
  rationale: 保留原文阳性单数代词的形式；此处具有代表性，适用于一般人，故以脚注说明。
- source_word: κἀγώ
  choice: 我也
  rationale: 体现καί与ἐγώ的结合，承接上文并保留明确的第一人称主语。
- source_word: ἀναστήσω
  choice: 使他复活
  rationale: 在此末世语境中明确表达使死人起来、复活之意，同时保持自然的现代汉语。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 在末日
  rationale: 采用简洁而通行的圣经汉语表达，保留其末世性时间指向。
theological_decisions:
- issue: ἑλκύσῃ在救恩论争议语境中的含义
  choice: 吸引
  alternative: 拉；拖
  rationale: 该动词在某些语境可指较有力度的拉动，但本节仅凭词本身不足以把恩典作用的方式限定为某一宗派解释。“吸引”保留其使人趋向子的核心意思，并在脚注交代较强的词义范围。
- issue: 阳性代词αὐτόν的代表性用法
  choice: 他
  alternative: 那人；这个人
  rationale: 正文保留原文阳性单数形式，但不把所指误解为仅限男性；脚注明确其一般代表性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“除非……否则……”清楚呈现条件关系；“到我这里来”比单说“来就我”更符合当代口语和书面语；“末日”保留经文传统用语且仍为现代读者所理解。
