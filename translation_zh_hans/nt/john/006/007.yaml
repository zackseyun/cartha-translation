  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: zh_hans
  text: 腓力回答他说：“就是值二百个第纳里的饼，也不够让他们每个人得到一点。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第纳里”：罗马银币；一个第纳里通常约为当时工人一天的工资。
    reason: 说明原文的古代货币单位及其大致劳资背景，不作不稳定的现代货币换算。
lexical_decisions:
- source_word: διακοσίων δηναρίων
  choice: 二百个银币
  rationale: δηνάριον指罗马银币，也常作为当时一日工钱的计量单位；正文采用普通读者容易理解的“银币”，并以脚注说明其大致劳资背景。
- source_word: ἄρτοι
  choice: 饼
  rationale: 在该语境中泛指供众人食用的饼食；“饼”简洁自然，也与本段叙事用语一致。
- source_word: οὐκ ἀρκοῦσιν
  choice: 也不够
  rationale: 保留“不足、不能满足所需”的核心意义；加入“也”与“就是……也……”构成自然汉语让步表达。
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: 让他们每人吃上一点
  rationale: ἵνα在此表达所需达到的最低结果；λαμβάνω直译为“得到”，但在分饼的语境中译作“吃上”更自然，“一点”保留βραχύ τι所强调的少量。
theological_decisions:
- issue: ἵνα从句的语义关系
  choice: 译为“让他们每人吃上一点”，表达即使只达到最低分配结果也不够
  alternative: “好使每个人得到一点”
  rationale: 此处重点是二百银币所买的饼仍不足以让每人分到少量食物；所选译法不额外赋予目的或神学含义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“就是花……也……”传达腓力所强调的巨大费用与仍然不足；未把“他们”或结果从句作超出上下文的神学解释。
