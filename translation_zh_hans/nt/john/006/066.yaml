  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: zh_hans
  text: 从那时起，他的门徒中有许多人退去了，不再与他同行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，他的许多门徒离开了”；希腊语开头也可表示原因，不过按上下文译作“从那时起”更能体现这里是一个转折点。
    reason: 保留Ἐκ τούτου可能具有的因果读法。
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: 从那时起
  rationale: 这个短语既可能表示时间，也可能表示原因；结合上下文，这里描述耶稣讲论之后出现的决定性转折，时间性的“从那时起”更为贴切，同时在脚注保留因果理解。
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 他的门徒中有许多人
  rationale: ἐκ带有部分含义，表示离去的是较大门徒群体中的许多人；此译法自然地保留这一层意思。
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: 退去了
  rationale: 动词与“向后”的惯用表达合在一起，表示退回、离开原先跟随的道路，不只是一般性的离去；“退去了”简洁保留这种后退和退出之意。
- source_word: οὐκέτι
  choice: 不再
  rationale: 表示从此停止先前持续的行动，“不再”是清楚自然的现代汉语表达。
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: 与他同行
  rationale: 原文直义为“与他一同行走”，在此也指持续相伴和跟随；“同行”既保留行走意象，又自然传达持续跟随的关系。
theological_decisions:
- issue: 这里的μαθηταί是否应译成暗示十二门徒或仅指真信徒的称谓
  choice: 门徒
  alternative: 跟随者
  rationale: 经文只说耶稣的门徒中有许多人退去，并未把他们等同于十二门徒，也未在此对他们的信仰真实性作教义判断；“门徒”保留叙事中的称谓和神学张力。
- issue: “退去”是否应解释为彻底离弃信仰
  choice: 保留为叙事性的“退去了”
  alternative: 背弃了他
  rationale: 原文明确表达他们后退离开并不再与耶稣同行，却没有在这个动词本身中直接作出更完整的教义裁断；译文不额外强化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“退去了”与“同行”保留原文的行走和后退意象，同时避免生硬直译；脚注标记已在正文中以[a]标出。
