source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: zh_hans
  text: 不要为那会朽坏的食物劳力，而要为那存到永生的食物劳力[a]；这食物是人子要赐给你们的，因为父神已经在他身上加盖了印记[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “存到永生”也可理解为“存留而带来永生”。
    reason: 保留 εἰς 在此可能表达目标或结果的语义幅度。
  - marker: b
    text: 原文直译为“盖印”；这个说法可表达认可、授权或认证。
    reason: 说明盖印比喻的语用含义，同时在正文中保留原有意象。
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: 劳力
  rationale: 保留复数命令语气；结合介词性宾语，自然表达“为……劳力、努力求取”的意思。
- source_word: βρῶσιν
  choice: 食物
  rationale: 上下文指可吃的食物，而非进食这一动作；“食物”准确自然。
- source_word: ἀπολλυμένην
  choice: 会朽坏的
  rationale: 表达现在分词所描写的易腐坏、终将消逝的性质，同时不把含义限缩为日常所说的“变质”。
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: 存到永生的
  rationale: “存”保留 μένω 的持续、存留之意；“到永生”保留 εἰς 所含的目标或结果色彩，不强行消除其修饰关系上的张力。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是该称号在现代汉语圣经语境中的通行译法，也保留其经文互涉和神学意蕴。
- source_word: ὑμῖν δώσει
  choice: 要赐给你们
  rationale: 将来时译作“要”；“赐给”符合人子作为施予者的语境，又没有增添原文未有的条件。
- source_word: ἐσφράγισεν
  choice: 已经在他身上盖了印
  rationale: 保留“印”的具体比喻及不定过去时所指的既成行动；中文表达清楚，也可承载认可、授权或认证等语用含义。
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: 父神
  rationale: 简洁自然地表达原文同位结构，即那位父就是神，同时不扩展为经文之外的教义说明。
theological_decisions:
- issue: μένουσαν εἰς ζωὴν αἰώνιον 中 εἰς 的关系
  choice: 存到永生的食物
  alternative: 存留而带来永生的食物
  rationale: 主译尽量贴近原文，将“存留”与“到永生”连在一起；脚注提示 εἰς 也可理解为目标或结果，避免擅自排除这一可能。
- issue: ἐσφράγισεν 用于人子的含义
  choice: 父神已经在他身上盖了印
  alternative: 父神已经认证了他
  rationale: 正文保留原文的盖印意象，不把它完全化约为某一种解释；脚注说明其可能传达的认可、授权或认证含义。
- issue: ὁ πατὴρ ... ὁ θεός 的同位结构
  choice: 父神
  alternative: 父，就是神
  rationale: “父神”是自然、简洁的现代汉语表达，明确父为神，却不引入原文没有的进一步神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“劳力”比“工作”更适合表达为某种食物付出努力、加以求取；平行结构重复“劳力”，使“不要……而要……”的对照清楚。“父神”简洁处理希腊文同位结构。
