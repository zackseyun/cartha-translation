  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: zh_hans
  text: 这就是从天上降下来的饼，不像先祖吃过、也死了；吃这饼的人必永远活着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必永远活着”原文直译为“将活到那时代（或：永世）”。这是表达永远持续生命的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: 这就是……的饼
  rationale: 用现代汉语自然的判断句表达指示代词、系词和带定冠词的名词，并保留上下文所指的特定之饼。
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: 从天上降下来的
  rationale: 以关系修饰结构表达名词化的过去时分词，保留“从天上”及“降下”的空间意象。
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: 不像先祖吃过仍然死了
  rationale: “不像”自然传达比较关系；“先祖”在现代汉语中明确指以色列在旷野吃吗哪的前人，又避免“父辈”可能造成的近世代误解。“仍然”显明两个并列过去时动词在比较中的反差，但不增添因果关系。
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: 吃这饼的人
  rationale: 以名词化结构传达现在时分词的普遍、持续性意义；“吃”保留基本词义，不把有争议的圣餐性或比喻性解释写入正文。
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: 必活到永远
  rationale: “必活”表达将来时的确定陈述；“到永远”自然传达该约翰用语的持久、无尽意义，同时脚注保留其字面形式。
theological_decisions:
- issue: οἱ πατέρες所指的群体
  choice: 先祖
  alternative: 祖先；列祖；父辈
  rationale: 语境很可能指在旷野吃吗哪的以色列先人。“先祖”既保持历史与男性复数在传统父系叙事中的指向，又比“父辈”更准确；不把所指扩大为泛指全人类祖先。
- issue: τρώγων在生命之饼论述中的神学含义
  choice: 吃
  alternative: 以……为食；领受
  rationale: 采用中性的词汇义，不预先裁定这是严格的圣餐陈述，还是关于信靠基督的比喻，也不削弱原文具体的进食意象。
- issue: ζήσει εἰς τὸν αἰῶνα的时间范围
  choice: 必活到永远
  alternative: 必活到那世代；必活入那时代
  rationale: 这是约翰文献中表达永恒持续的惯用语。正文采用自然汉语，脚注交代较字面的形式，以免将αἰών的表达方式完全隐藏。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“饼”延续本段核心意象；“先祖”比“列祖”更易为普通现代读者理解。分号保留原句前后比较与结论的结构。所有脚注标记均置于正文相应位置。
