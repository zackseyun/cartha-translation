  source_fidelity: 原文以两个未完成时描写群众持续跟随，以及他们持续／反复观看耶稣在患病者身上所行的事。译文的“一直跟随”“不断看见”基本传达体貌；“在病人身上”也可自然表达ἐπὶ τῶν ἀσθενούντων所指向的对象。惟σημεῖα直译为“神迹”未能在正文保留约翰福音中反复使用的“记号”术语；仅靠脚注不足以完全保留这一词汇关联。
