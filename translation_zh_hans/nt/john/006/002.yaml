  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: zh_hans
  text: 有一大群人一直跟随他，因为他们不断看见他在病人身上所行的记号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神迹”或“神奇的记号”。约翰使用的这个词强调，这些作为显明耶稣的身份。
    reason: 词义选择：保留σημεῖα在约翰福音中的启示性和指向性。
lexical_decisions:
- source_word: ἠκολούθει
  choice: 一直跟着
  rationale: 未完成时表示过去持续进行的动作；“一直跟着”在现代汉语中自然地保留持续意味。
- source_word: δὲ
  choice: 有
  rationale: δέ在这里是轻微的叙事连接词；汉语无需机械译出“而/于是”，以存现句自然承接上文。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: 准确表达人数众多的群众，现代汉语清楚自然。
- source_word: ἐθεώρουν
  choice: 不断看见
  rationale: 未完成时可表示持续或反复的观看；“不断看见”兼顾体貌，并避免生硬的“正在看见”。
- source_word: σημεῖα
  choice: 神迹
  rationale: 在约翰福音中，此词指具有启示和指向作用的超自然作为；“神迹”是现代中文圣经语域中自然且可理解的表达，脚注补明其“记号”含义。
- source_word: ἐποίει
  choice: 所行的
  rationale: 汉语关系分句不必逐字呈现未完成时；动作的反复性已由“不断看见”及上下文体现，“行神迹”符合庄重而自然的中文搭配。
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: 在病人身上
  rationale: 较直接保留ἐπί加属格所表达的作用对象关系，说明神迹施行在患病者身上。
- source_word: ἀσθενούντων
  choice: 病人
  rationale: 上下文指身体患病者；“病人”简洁自然。
theological_decisions:
- issue: 约翰著作中σημεῖα的术语意义
  choice: 正文译“神迹”，脚注说明也可译“记号”
  alternative: 正文译“记号”或“神奇的记号”
  rationale: “神迹”能让普通现代读者立即明白这些作为的超自然性质；脚注保留约翰用词所强调的指向性和启示意义，避免将其仅仅理解为奇事。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一直跟着”和“不断看见”呈现两个未完成时的持续或反复意味；“在病人身上所行的神迹”保持原文关系，同时符合现代汉语表达。
