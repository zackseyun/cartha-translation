  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: zh_hans
  text: 于是，耶稣对十二人说：“难道你们也想离去吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们也想离去吗？”希腊语问句用了μή，通常表示说话者预期否定的回答。
    reason: 说明问句语气及可行的较中性译法。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文许多门徒离开的叙事发展，也体现由此引出的反应；“于是”在现代汉语中自然、庄重。
- source_word: τοῖς δώδεκα
  choice: 对十二使徒
  rationale: 原文直译为“对那十二位”，是耶稣核心门徒群体的固定称谓。汉语补出“使徒”，便于普通读者识别该称谓，而不把范围泛化为所有门徒。
- source_word: Μὴ καὶ ὑμεῖς
  choice: 难道你们也……吗
  rationale: “难道……吗”表达 μή 所提示的否定预期，即说话者预期回答为“不”，同时保留提问本身；“也”对应 καί，并结合强调的 ὑμεῖς，呼应前文其他门徒已经离开。
- source_word: θέλετε
  choice: 想
  rationale: 在此表达意愿或愿望；“想”是自然、直接的现代汉语对应词。
- source_word: ὑπάγειν
  choice: 离去
  rationale: 保留从耶稣身边走开的动作含义，并与前文门徒退去的语境相合；比“离弃”少一层神学或道德判断。
theological_decisions:
- issue: 由 μή 引导之问句的语气
  choice: 用“难道……吗”表达预期否定回答的反问语气，但仍保留真实问句
  alternative: 较中性的“你们也想离去吗？”
  rationale: 希腊语 μή 引导的是非问句通常预期否定回答。译文呈现这一语用倾向，却不将门徒的回答预先断定，从而保留原文的张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“难道你们也想离去吗”自然传达原文问句所含的否定预期；“离去”避免“离弃”可能附加的定罪意味。
