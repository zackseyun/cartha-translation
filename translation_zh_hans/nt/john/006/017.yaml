  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: zh_hans
  text: 他们上了船，正渡海[a]往迦百农去。天已经黑了，耶稣还没有来到他们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “渡海”或译“到海的对岸去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: 他们上了船
  rationale: 将不定过去时分词自然转换为汉语并列谓语，表达先于主要动作发生的登船，同时避免生硬的“上船以后”。πλοῖον按场景译为“船”。
- source_word: ἤρχοντο
  choice: 正……去
  rationale: 以“正”体现未完成过去时所表达的进行中动作，而不把它弱化成单纯的“去了”或强化成仅仅“出发”。
- source_word: πέραν τῆς θαλάσσης
  choice: 渡海
  rationale: πέραν加属格在这里表示越过水域或前往对岸；“渡海”简洁自然，并保留约翰称该水域为“海”的用语。
- source_word: εἰς Καφαρναούμ
  choice: 往迦百农去
  rationale: 介词εἰς表达方向，地名采用现代中文圣经中通行的音译“迦百农”。
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: 天已经黑了
  rationale: 用自然现代汉语表达“黑暗已经形成”的结果状态；“已经……了”兼顾ἤδη与过去完成时所体现的先成状态。
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: 还没有来到他们那里
  rationale: “还没有”对应οὔπω，过去完成时表示截至当时耶稣尚未来到；“来到他们那里”直接保留πρὸς αὐτούς的空间关系，不擅自解释为“与他们会合”。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文通行译名。
theological_decisions:
- issue: 叙事体貌与时间次序
  choice: 译文保留“上船”在先、渡海正在进行、天色已经变黑、耶稣截至当时仍未来到的次序。
  alternative: 可将ἤρχοντο平译为“去了”，或将ἐγεγόνει仅译为“天黑着”。
  rationale: 这些动词体貌共同营造下文耶稣在海面上临近门徒之前的叙事张力；译文不在此基础上加入额外神学解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他们上了船，正……去”兼顾汉语流畅度与希腊文分词、未完成时的先后和进行体貌；正文中的脚注标记与脚注完全对应。
