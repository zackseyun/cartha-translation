  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: zh_hans
  text: 不过，有几只船从提比哩亚来到那地方附近；主祝谢后，众人曾在那里吃饼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “船”也可译作“小船”；希腊原文πλοιάρια使用小称形式。
    reason: 保留πλοιάρια的小称词形色彩，同时不在正文中过度强调船的大小。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 不过
  rationale: 承接上文并表示情势转折；“不过”自然、清楚。
- source_word: ἦλθεν
  choice: 来，到了
  rationale: 此处叙述船只从提比哩亚来到该地附近；用“来，到了”使来源与抵达位置在现代汉语中衔接自然。
- source_word: πλοιάρια
  choice: 几只船
  rationale: 该词为指小船的形式，但在此也可一般指船；正文采用自然的“船”，数量依希腊语复数补作“几只”，小船这一词形色彩收入脚注。
- source_word: ἐκ Τιβεριάδος
  choice: 从提比哩亚
  rationale: 准确表达船只的来源地。
- source_word: ἐγγὺς τοῦ τόπου
  choice: 到了……地方附近
  rationale: 自然表达船只来到靠近该地点之处。
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: 他们吃饼的地方
  rationale: 保留地点关系，并以汉语常用定语结构表达；“饼”指向前文特定的饼。
- source_word: εὐχαριστήσαντος
  choice: 祝谢以后
  rationale: 分词结构表明主的祝谢先于众人吃饼；“祝谢”兼顾感谢与为食物祝谢的语境。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 在本段指耶稣，保留κύριος的尊称及基督论意味，不弱化为“主人”。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这里的所指是耶稣；“主”既符合约翰福音的叙事称谓，也保留其神学张力，而不额外展开解释。
- issue: 祝谢与吃饼的时间关系
  choice: 那饼是主祝谢以后他们吃的
  alternative: 他们在那里吃了主祝谢过的饼
  rationale: 希腊文属格独立结构明确以“主”为祝谢者，并通常表示祝谢先于吃饼；所选表达保持这一关系，同时避免让“祝谢”看似直接修饰地点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“提比哩亚”沿用常见圣经地名译法。正文稍作重组，以避免汉语中“主祝谢以后”错误附着于“地方”的歧义；脚注标记[a]已置于正文。
