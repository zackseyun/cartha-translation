  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: zh_hans
  text: 我们的祖先[a]在旷野[b]吃过吗哪，正如经上所记：“他从天上赐下粮来给他们吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我们的父辈”。
    reason: lexical_alternative
  - marker: b
    text: “旷野”也可译作“荒漠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 原文直译为“我们的父辈”，但这里泛指以色列人的先辈；现代汉语用“祖先”更自然，也不会让人误以为仅指直接上一代。脚注保留较直译的表达。
- source_word: τὸ μάννα
  choice: 吗哪
  rationale: 采用中文圣经传统中对旷野食物 μάννα 的通行音译，所指明确。
- source_word: ἔφαγον
  choice: 吃过
  rationale: 用“吃过”自然表达不定过去时所述的既往历史事实，而不额外强化持续性。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: ἔρημος 可指荒野或沙漠；出埃及传统的语境中，“旷野”既自然又保留经文互文色彩。
- source_word: καθώς ἐστιν γεγραμμένον
  choice: 正如经上所记
  rationale: 这是引出经文引用的固定表达；“经上所记”以自然、庄重的现代汉语传达其作为现存书面见证的意思。
- source_word: Ἄρτον
  choice: 粮
  rationale: ἄρτος 基本义为“饼、食物”；此处引文语境中“粮”能自然指神从天所赐的食物，并避免误解为一块具体的饼。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 自然对应 ἐκ 的来源意义，并保留来自天上的神学意蕴。
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: 赐下……给他们吃
  rationale: 保留 δίδωμι 加与格和不定式的结构关系；“赐下”符合神赐予食物的语境，但不预先加入后文的基督论解释。
theological_decisions:
- issue: 如何翻译关于吗哪的引文而不把后文的约翰基督论预先带入群众的话
  choice: 按历史和经文陈述翻译为“他从天上赐下粮来给他们吃”，不使用特殊大写或解释性增译。
  alternative: 采用预示耶稣为真正生命之粮的解释性措辞。
  rationale: 此处说话者是在引用关于旷野吗哪的经文；应让后续对话自行展开其基督论意义，而不是在本节提前作出解释。
- issue: 引文中 ἔδωκεν 隐含主语的处理
  choice: 保留“他”，不在正文中明确增补“神”。
  alternative: 译作“神从天上赐下粮来给他们吃”。
  rationale: 希腊文只有第三人称单数动词，主语由经文和语境暗示；保留“他”更贴近原文，也不消除其隐含性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先”符合当代汉语指称民族先辈的习惯；“经上所记”保留圣经引文公式的正式感。脚注标记均置于相应词语之后，并按正文出现顺序排列。
