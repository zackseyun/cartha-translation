id: JHN.6.1
reference: John 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: zh_hans
  text: 这些事以后[a]，耶稣渡到加利利海的对岸；这海也叫提比哩亚海[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这事以后”。原文“这些事”为复数，是约翰常用的叙事衔接语。
    reason: lexical_alternative
  - marker: b
    text: “加利利海”和“提比哩亚海”是同一片水域的两个名称。
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示词ταῦτα及约翰常用的叙事过渡方式，同时符合现代汉语表达。
- source_word: ἀπῆλθεν
  choice: 渡到
  rationale: ἀπέρχομαι本义为“离去、前往”；在越过水域、到达对岸的语境中译作“渡到”，自然地表达行动及方向。
- source_word: πέραν
  choice: 对岸
  rationale: 此处指水域另一边；“对岸”简洁、明确，也与“渡到”自然搭配。
- source_word: τῆς θαλάσσης
  choice: 海
  rationale: 虽然该水域在地理上是湖，θάλασσα在福音书传统及此专名中宜译作“海”。
- source_word: τῆς Γαλιλαίας
  choice: 加利利海
  rationale: 该属格按现代汉语地名习惯处理为“加利利海”。
- source_word: τῆς Τιβεριάδος
  choice: 这海也叫提比哩亚海
  rationale: 原文以第二个属格名称同位指认同一水域；汉语用“也叫”清楚传达两个名称所指相同，而不造成两个海的误解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这些事以后”适度保留原文形式；“渡到……对岸”符合汉语水上行程的自然表达。专名采用“加利利”“提比哩亚”。
