  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: zh_hans
  text: 于是，耶稣上了山，在那里和他的门徒坐着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: 上了
  rationale: 该词在这里表示地理上的向上移动；“上了”简洁自然，也不带“升天”之类不合语境的含义。
- source_word: δὲ
  choice: 于是
  rationale: δέ在这里主要推动叙事，并非表示强烈转折；“于是”符合现代汉语叙事习惯。
- source_word: εἰς τὸ ὄρος
  choice: 那座山
  rationale: 与“上了”连用，自然表达登上特定山地或山坡；定冠词译作“那座”，但不暗示这是一座有专名的山。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 准确表达地点副词，并与前面的山上场景自然衔接。
- source_word: ἐκάθητο
  choice: 坐下
  rationale: κάθημαι的未完成过去时可表示坐着或就座；此处译作“坐下”最符合汉语叙事，但不额外强调动作方式。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 和他的门徒
  rationale: μετά加属格表示陪同；“门徒”保留福音书中师徒兼追随者的关系，比“学生”更贴切。
