- from: 耶稣心里知道门徒们在为这话抱怨，就对他们说：“这话使你们跌倒吗？[a]”
  to: 耶稣心里知道自己的门徒因这话发怨言，就对他们说：“这话使你们跌倒吗？”[a]
  rationale: The revision improves idiomatic Mandarin and explicitly retains the possessive in “his disciples.” It preserves the source’s internal-knowledge nuance, the broad designation of disciples, and the unresolved semantic range of σκανδαλίζει through the main-text metaphor plus footnote alternative.
