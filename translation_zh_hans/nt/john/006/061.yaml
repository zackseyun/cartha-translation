review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ inward knowledge, the disciples’ dissatisfied response, the referent of τοῦτο, and the metaphorical force of σκανδαλίζει. However, “门徒们” does not explicitly represent αὐτοῦ (“his”), and “在为这话抱怨” is less idiomatic than a direct causal construction.
  naturalness: “心里知道” and “这话使你们跌倒吗？” are natural, clear Modern Standard Mandarin. Revising “在为这话抱怨” to “因这话发怨言” produces more idiomatic narrative prose and better conveys the subdued, dissatisfied muttering denoted by γογγύζουσιν.
  terminology: “跌倒” appropriately preserves the NT metaphor of σκανδαλίζει without forcing a denominational interpretation; the footnote supplies the viable sense “反感.” “发怨言” is a suitably established and understandable rendering for γογγύζω in this register.
  issues:
  - severity: low
    issue: “在为这话抱怨” is somewhat awkward and does not best express γογγύζουσιν.
    rationale: The Greek indicates grumbling/muttering in dissatisfaction concerning the preceding saying. “因这话发怨言” is more idiomatic Chinese and retains the complaint-like nuance without adding interpretation.
  - severity: low
    issue: “门徒们” leaves αὐτοῦ (“his”) unexpressed.
    rationale: Although the antecedent is evident from context, “自己的门徒” naturally and explicitly represents the possessive while retaining the broader group of disciples.
  revised_text: 耶稣心里知道自己的门徒因这话发怨言，就对他们说：“这话使你们跌倒吗？”[a]
