id: JHN.6.61
reference: John 6:61
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: zh_hans
  text: 耶稣心里知道自己的门徒因这话发怨言，就对他们说：“这话使你们跌倒吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这话使你们反感吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 以自然的现代汉语表达与主句同时发生的认知状态，无须机械保留希腊语分词结构。
- source_word: ἐν ἑαυτῷ
  choice: 心里
  rationale: 表明耶稣不是靠外在报告才得知；“心里知道”符合现代汉语习惯，也保留内在知悉的含义。
- source_word: γογγύζουσιν
  choice: 在……抱怨
  rationale: 该词指因不满而低声议论、发怨言；“抱怨”通俗自然，并保留负面意味。
- source_word: περὶ τούτου
  choice: 为这话
  rationale: τούτου回指前文所说的内容；“这话”在汉语中比单说“这”更清楚，同时不过度解释为某项特定教义。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒们
  rationale: 指当时较广的一群门徒，并非仅限十二使徒；复数语气由“们”自然体现。
- source_word: Τοῦτο
  choice: 这话
  rationale: 保留对前文言论的简洁回指；补出“话”是汉语所需的轻度明示，并未限定其具体内容。
- source_word: σκανδαλίζει
  choice: 使……跌倒
  rationale: 保留该词“绊倒”并进而导致拒绝、离弃的隐喻，比仅译“冒犯”更能呈现此处潜在的信仰危机。
theological_decisions:
- issue: σκανδαλίζει既可表示引起反感，也可表示使人失足、陷入不信或离弃
  choice: 这话使你们跌倒吗？
  alternative: 这话使你们反感吗？
  rationale: 正文采用“跌倒”以保存希腊词的隐喻及其较强的神学张力，不把门徒的反应缩减为情绪上的不快；脚注说明更日常的语义可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“心里知道”自然表达内在知悉；“抱怨”避免较陈旧的“发怨言”；“跌倒”保留新约语境中由受阻而可能转离的开放含义，并以脚注呈现“反感”这一可行译法。
