  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: zh_hans
  text: 于是，耶稣对彼得说：“把刀收进鞘里[a]！父赐给我的杯[b]，我岂能不喝呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鞘”也可译为“刀鞘”。
    reason: lexical_alternative
  - marker: b
    text: “杯”是圣经中常见的隐喻；在这里指父所定的苦难或命运。参太26:39；可14:36；路22:42。
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接逮捕现场的叙事发展；“于是”自然地保留了希腊文连接词的推进作用。
- source_word: Βάλε
  choice: 收入
  rationale: βάλλω在这里不是强调投掷，而是命令彼得把武器放回鞘内；“收入”符合现代汉语习惯。
- source_word: μάχαιραν
  choice: 刀
  rationale: μάχαιρα泛指带刃的近身武器，可指剑、短剑或匕首；“刀”在本处简明自然，又不过度限定武器形制。
- source_word: θήκην
  choice: 鞘
  rationale: θήκη在此指容纳刀剑的鞘；“鞘”准确保留具体意象。
- source_word: ποτήριον
  choice: 杯
  rationale: 保留希腊文及圣经传统中的隐喻，不在正文中将其窄化为死亡、十字架或烈怒。
- source_word: δέδωκέν
  choice: 赐给
  rationale: 动词完成时表示已经成就且仍具现实效力；汉语“父赐给我的”自然表达既定的赐予，也保留尊敬语体。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文有定冠词而无“我的”；约翰文体中的“父”已具明确指称，不额外添加所有格。
- source_word: οὐ μὴ πίω αὐτό;
  choice: 我岂能不喝呢？
  rationale: 以反问表达强烈肯定，表明耶稣确实要喝这杯；“岂能不……呢”保留原句力度，并符合庄重而自然的现代汉语。
theological_decisions:
- issue: “杯”的含义
  choice: 正文保留“杯”的隐喻，并在脚注中说明它可表示上帝所定的苦难或命运。
  alternative: 直接译作“父为我安排的苦难”、死亡、十字架或上帝的烈怒。
  rationale: 上下文支持受苦的含义，但本节并未把这个隐喻限定为某一项教义解释；保留原有意象可避免消除其神学张力。
- issue: 耶稣与父的关系
  choice: 直译为“父赐给我的”，呈现耶稣甘愿顺服父所定之事。
  alternative: 扩译为“我的父为我安排的”或加入关于父子关系的教义说明。
  rationale: 原句强调耶稣对父旨意的主动接受；平实翻译即可保留其含义，无须在正文中增添原文没有的解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“把刀收入鞘中”是自然命令句；“我岂能不喝呢”保留强烈反问及耶稣甘愿接受父旨意的语气。所有脚注标记均置于相应词语之后。
