  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: zh_hans
  text: 于是，彼拉多又进了总督府[a]，叫耶稣来，对他说：“你是犹太人的王[b]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罗马总督的官邸”或“罗马总督的总部”；希腊文πραιτώριον指罗马总督正式的官邸或行政驻地。
    reason: lexical_alternative
  - marker: b
    text: “犹太人”也可译作“犹太地人”。希腊文这个词可泛指犹太人，在某些语境中也可指犹太地的人。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν οὖν πάλιν
  choice: 于是……又回到
  rationale: οὖν承接前文并推进叙事，译作“于是”；πάλιν与进入某处的动作连用，表示返回，现代汉语自然表达为“又回到”。
- source_word: πραιτώριον
  choice: 总督府
  rationale: 指罗马总督的官邸或办事总部。“总督府”简洁、自然，兼顾其官邸与行政驻地的含义；音译“衙门/议政厅”等均不够准确。
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: 把耶稣叫来
  rationale: φωνέω在此表示叫某人前来。“叫来”比单说“叫”更明确地传达召入问话的场景，又不过度强化为正式的“传召”。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 紧贴λέγω的基本义“说”；疑问性质由后面的直接引语呈现，不改译为更具体的“问”。
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: 你是……王吗
  rationale: 以现代汉语的是非问句自然呈现原文；显式代词σύ所含的强调可由语境与句首“你”体现，不额外添加解释性强调。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 在罗马审讯所涉及的政治称号中，“犹太人的王”最符合历史语境与约翰受难叙事的常用表达，同时以脚注保留“犹太地区之人”的可能地域含义。
theological_decisions:
- issue: 王号中Ἰουδαίων的指称范围
  choice: 犹太人
  alternative: 犹太地区的人（犹太地人）
  rationale: 这里呈现彼拉多所审查的政治指控，“犹太人的王”是上下文中更合适、也更易理解的表达；但Ἰουδαῖοι依语境也可能着重指犹太地区的人，故不在正文中排除这一词义，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“总督府”避免生硬音译；“把耶稣叫来，对他说”保留原文两个连续动作。脚注标记均置于正文相关词句之后。
