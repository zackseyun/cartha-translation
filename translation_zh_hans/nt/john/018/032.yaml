id: JHN.18.32
reference: John 18:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: zh_hans
  text: 这是要应验耶稣所说的话[a]；他借此表明自己将要怎样死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣所说的这句话”。
    reason: lexical_alternative
  - marker: b
    text: 即耶稣曾表明自己将以怎样的方式死，可能是指被钉十字架（参12:32—33）。
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: 这是要
  rationale: 引出目的或结果；结合上文，用“这是要……”自然承接叙事，同时保留事件使耶稣的话应验这一含义。
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: 耶稣所说的话
  rationale: 此处 λόγος 指耶稣先前说过的话，并非《约翰福音》1:1中作为称号的“道”；汉语用“所说的话”清楚自然。
- source_word: πληρωθῇ
  choice: 应验
  rationale: 保留约翰叙事中的应验用语及其神学分量，比“成为事实”更符合圣经语域。
- source_word: ὃν εἶπεν
  choice: 所说的
  rationale: 关系从句修饰“话”；汉语以“所说的话”合并表达，可避免重复而不损失意义。
- source_word: σημαίνων
  choice: 借此表明
  rationale: 现在分词说明耶稣先前的话具有指示作用；“借此”自然指回他说的话，同时不把分词过度限定为纯粹目的。
- source_word: ποίῳ θανάτῳ
  choice: 怎样死
  rationale: 表达死亡的种类或方式；现代汉语“怎样死”简洁自然，并在语境中指向死亡方式。
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: 将要……死
  rationale: 表达即将发生或未来将发生之事，不额外加入“命定”等更强的决定论含义。
theological_decisions:
- issue: 耶稣先前预言与“应验”措辞的关系
  choice: 保留“应验耶稣所说的话”
  alternative: 使耶稣说过的话成为事实
  rationale: πληρωθῇ 是明确的应验措辞，在约翰叙事中具有神学分量；译作“应验”既忠实又不额外解释其机制。
- issue: μέλλω 对耶稣之死的语气
  choice: 将要死
  alternative: 命定要死
  rationale: 原文可表达未来或临近之事，本节本身不要求译入更强的预定含义。
- issue: 死亡方式的具体所指
  choice: 正文保留概括性的“怎样死”
  alternative: 被钉十字架而死
  rationale: ποίῳ θανάτῳ 指死亡的种类或方式，但本节没有直接说出“十字架”；具体关联宜放在脚注及平行经文中。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这是要……；他借此……”既承接上文，也避免逐词硬译造成重复。正文保留原文对死亡方式的概括表达，具体指向仅在脚注说明。
