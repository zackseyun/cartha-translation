base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: zh_hans
  text: 该亚法就是那位曾劝告犹太人[a]说，一个人为百姓而死[b]是有益的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太人的领袖”或“犹太地人”；要视本处如何理解约翰所说的“犹太人”而定。
    reason: alternative_reading
  - marker: b
    text: 或译“为了百姓而死”或“代表百姓而死”；按上下文，这个说法也可能带有代表性或献祭性的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: 就是
  rationale: δέ在这里是轻微的叙事连接或承接，不宜强化为明显转折；中文不另加“现在”，用“就是”自然承接上下文并突出身份说明。
- source_word: Καϊάφας
  choice: 该亚法
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: ὁ συμβουλεύσας
  choice: 曾……建议
  rationale: 带冠词的不定过去时分词以先前的行动辨明该亚法的身份；“曾”表达该行动先于本句所述情形。
- source_word: τοῖς Ἰουδαίοις
  choice: 向犹太人
  rationale: 原文未明说“领袖”等限定语，因此正文保留较形式对应的译法；约翰福音中该称谓的具体所指随语境而异，另以脚注说明。
- source_word: ὅτι συμφέρει
  choice: 说……是有益的
  rationale: συμφέρει表示有利、有益；此译法自然且保留该亚法建议中的利益权衡意味。
- source_word: ἕνα ἄνθρωπον
  choice: 一个人
  rationale: 保留原文的单数数词及对一个男性个体的指称，同时符合自然中文。
- source_word: ἀποθανεῖν
  choice: 死
  rationale: 直接表达不定式的意义，不作不必要扩充。
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: 为百姓而死
  rationale: ὑπέρ可表达为了、为着或代表；“为……而死”既自然，也不把潜在的代表性或牺牲性含义限定为明确的替代关系。
- source_word: λαοῦ
  choice: 百姓
  rationale: λαός在此指一个群体的人民；本节并未使用ἔθνος“民族／国家”，故不译作“国民”或“民族”。
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦ是否明确表达代替性死亡
  choice: 为百姓而死
  alternative: 替百姓死／代表百姓而死
  rationale: ὑπέρ在此至少有受益、为着或代表的意义，在约翰叙事中也可能带有牺牲或替代意味。正文不把该亚法的政治性建议直接扩展成明确的教义表述，脚注则保留其语义张力。
- issue: 约翰福音中τοῖς Ἰουδαίοις的具体所指
  choice: 犹太人
  alternative: 犹太人的领袖／犹太地区的人
  rationale: 希腊文没有明加限定语。正文保留原文较宽的称谓，脚注提示在当前叙事语境中可能有更具体的理解，避免把一种解释写死在正文中。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“就是曾……的那个人”保留原文辨明该亚法身份的结构；不添加原文没有的时间副词“现在”，也不把δέ过度译成强转折。脚注标记均置于相关词语之后。
