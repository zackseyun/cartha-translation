  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: zh_hans
  text: 彼得又否认了；随即，公鸡叫了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示动作重复；“又”简洁自然，承接彼得先前的否认。
- source_word: οὖν
  choice: （由上下文承接体现）
  rationale: 此处兼有承接和叙事推进作用；汉语以语序和“又”自然衔接，无须机械译作“于是”或“所以”。
- source_word: ἠρνήσατο
  choice: 不承认
  rationale: 在此前问话的语境中表示否认对方所说之事。原文未明说宾语，因此正文不补出明确对象，以保留其句法上的含蓄。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: καὶ
  choice: 就在这时
  rationale: 在此连接紧随其后的事件；结合εὐθέως译为自然的汉语叙事衔接。
- source_word: εὐθέως
  choice: 就在这时
  rationale: 突出鸡叫紧接着彼得的否认发生；比“立即”更符合此处现代汉语叙事语感。
- source_word: ἀλέκτωρ
  choice: 鸡
  rationale: 指公鸡；汉语惯用“鸡叫了”表达公鸡啼叫，语义清楚自然。
- source_word: ἐφώνησεν
  choice: 叫了
  rationale: 该动词本义为发声；主语为公鸡时，汉语惯常说“鸡叫了”。
