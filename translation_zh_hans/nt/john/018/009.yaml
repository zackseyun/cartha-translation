  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: zh_hans
  text: 这是要应验他所说的话：“你所赐给我的人，我一个也没有失掉[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们中没有一个”或“他们中连一个也没有失掉”。
    reason: 原文ἐξ αὐτῶν οὐδένα带有部分关系和强调，可在汉语中用不同结构表达。
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: 这是要应验
  rationale: 既保留ἵνα所表达的目的或结果，也保留πληρωθῇ的“应验”用语；现代汉语自然，不把它限定为正式的预言应验公式。
- source_word: ὁ λόγος ὃν εἶπεν
  choice: 他所说的话
  rationale: 此处λόγος指耶稣先前说过的具体话语，并非作为称号的“道”；汉语无需显式使用过去完成时，也能由上下文表达先后关系。
- source_word: Οὓς δέδωκάς μοι
  choice: 你所赐给我的人
  rationale: “赐给”体现给予者与所赐之人的关系，并以“所……的”结构自然表达关系从句；汉语不强行标示希腊语完成时，但保留给予所形成的持续关系。
- source_word: ἀπώλεσα
  choice: 失掉
  rationale: 语境强调耶稣保全受托付的人，而非主动毁灭他们；“失掉”在现代汉语中清楚自然，也保留约翰叙事中“失去”的措辞。
- source_word: ἐξ αὐτῶν οὐδένα
  choice: 一个也没有
  rationale: 表达“在他们当中连一个都没有”的强调语气，并与前置的“你所赐给我的人”自然衔接。
theological_decisions:
- issue: “应验”所指的性质
  choice: 将πληρωθῇ译为耶稣先前所说的话得到“应验”
  alternative: 译作“成为事实”或“实现”
  rationale: 约翰在这里把应验语言用于耶稣自己的话；“应验”保留其神学分量与叙事中的实现关系，却不额外断定这是正式的经文预言公式。
- issue: ἀπώλεσα与门徒蒙保全的关系
  choice: 译为“我一个也没有失掉”
  alternative: “我没有毁灭他们中的任何一个”或“我没有让他们中的任何一个灭亡”
  rationale: 眼前语境是耶稣在被捕时保护门徒，并呼应约翰福音17:12。“失掉”保留原文张力，不把意思缩限为某一套特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是要应验”承接叙事因果；引语保持简洁有力。脚注标记置于其所说明的“一个也没有失掉”之后。
