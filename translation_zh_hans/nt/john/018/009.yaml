  source_fidelity: 译文准确传达了ἵνα πληρωθῇ的目的／结果导向及被动“应验”，并将ὁ λόγος ὃν εἶπεν恰当地处理为耶稣先前所说的具体话语。引语中“你所赐给我的人，我一个也没有失掉”忠实表达了完成时δέδωκας所指的既已赐予关系，以及ἀπώλεσα和ἐξ αὐτῶν οὐδένα的“一个也没有失掉”的保全含义。
