source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s slave and cut off his right ear. Now the slave’s name was Malchus.
translation:
  language: zh_hans
  text: 于是，西门彼得有一把刀，就拔出来，砍了大祭司的奴仆[a]，砍掉了他的右耳。那奴仆名叫马勒古。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“仆人”。希腊词δοῦλος可按语境指奴隶或仆役。
    reason: 保留δοῦλος在身份性从属与一般服侍角色之间的词义范围。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推动叙事发展；“于是”自然保留了连接和结果意味，而不过分强调逻辑推论。
- source_word: ἔχων μάχαιραν
  choice: 带着一把刀
  rationale: μάχαιρα可指刀、短剑一类的武器；“刀”在现代汉语中简洁自然，也不武断限定其具体形制。
- source_word: εἵλκυσεν αὐτὴν
  choice: 拔刀
  rationale: 在武器语境中，“拔刀”自然表达将所带的刀抽出；代词所指在汉语复合表达中已清楚，无须另译“它”。
- source_word: ἔπαισεν
  choice: 砍向
  rationale: 该动词基本义为击打；结合持刀及随后耳朵被削掉的结果，“砍向”自然呈现这次持械击打，同时不额外断定更具体的动作轨迹。
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: 大祭司的奴仆
  rationale: δοῦλος指处于从属身份的奴隶或仆役。“奴仆”既保留其受支配的身份色彩，又比现代汉语的“奴隶”更适合此处叙事语体；脚注保留“仆人”这一语境可能。
- source_word: ἀπέκοψεν
  choice: 削掉了
  rationale: 表达用利器切除身体部位的结果；与前面的“砍向”搭配自然，并清楚传达耳朵被切掉。
- source_word: ὠτάριον τὸ δεξιόν
  choice: 右耳
  rationale: ὠτάριον虽为指小形式，此处通常就是“耳朵”，不必译成“小耳朵”或过度具体化为“耳垂”；τὸ δεξιόν明确为右侧。
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: 那奴仆名叫马勒古
  rationale: δέ在此转入补充身份资料，汉语用“那”承接已提人物即可自然体现叙事转换；“名叫”是该与格姓名结构的地道表达，“马勒古”为Μάλχος的常用音译。
theological_decisions:
- issue: δοῦλος的身份含义
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 原词可涵盖奴隶与仆役，且“大祭司的”显示此人处于其权属或家属从属关系中。“奴仆”保留这种身份力度，却不强行套入近现代奴隶制度的全部联想；脚注提示较弱的“仆人”译法，以保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“拔刀砍向……，削掉了……”节奏紧凑，符合动作场面；“奴仆”兼顾古代身份背景与现代读者的可理解性。脚注标记紧随其所说明的词语。
