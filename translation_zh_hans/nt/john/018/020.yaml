source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: zh_hans
  text: 耶稣回答他说：“我公开地向世人说过话。我向来在会堂和圣殿[a]里教导人，所有犹太人[b]都在那里聚集；我暗中什么也没有说过。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”：希腊语ἱερόν指圣殿的整个建筑群和院区，不是专指内殿；也可译作“圣殿区”。
    reason: lexical_alternative
  - marker: b
    text: “犹太人”：希腊语Ἰουδαῖοι可随语境指犹太民族、犹太地人或某些犹太权势群体；这里也可译作“所有犹太民众”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: 公开地
  rationale: 本节将其与ἐν κρυπτῷ（“暗中”）对照，重点是言论公开、不隐蔽，而不特别强调“放胆”。
- source_word: λελάληκα
  choice: 一直……说话
  rationale: 用“一直”配合中文表达希腊语完成时所体现的既往言说及其当前关联，同时保持自然。
- source_word: τῷ κόσμῳ
  choice: 向世人
  rationale: 既保留约翰著作中κόσμος的宽广用语，又比直译“向世界”更符合现代汉语在“说话”后的搭配。
- source_word: πάντοτε
  choice: 向来
  rationale: 自然表达持续一贯的公开教导，与前句“一直”避免机械重复。
- source_word: ἐδίδαξα
  choice: 教导人
  rationale: 准确传达“教导”；补出泛指宾语“人”使现代汉语通顺，并未限定受教者。
- source_word: ἐν συναγωγῇ
  choice: 在会堂里
  rationale: 希腊语虽为单数，但可作场所类别的泛指；中文“在会堂里”同样可自然作泛指。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区里
  rationale: ἱερόν指整个圣殿建筑群或院区，并非专指内殿；“圣殿区”在正文中明确保留这一词义。
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: 所有犹太人
  rationale: 直译其广泛的民族—宗教群体指称；本处语境并不要求将其缩窄为犹太权贵，同时以脚注保留“犹太地人”的语义可能。
- source_word: συνέρχονται
  choice: 聚集
  rationale: 简洁自然地表达共同来到一处、会集的意思。
- source_word: ἐν κρυπτῷ
  choice: 暗中
  rationale: 与“公开地”形成清楚对照，也比“秘密地”更符合庄重的现代汉语。
- source_word: ἐλάλησα οὐδέν
  choice: 什么也没有说过
  rationale: 用自然汉语保留οὐδέν的全面否定和既往陈述。
- source_word: ἀπεκρίθη αὐτῷ
  choice: 回答他说
  rationale: 符合中文叙事惯用表达，并明确保留间接宾语。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖοι的所指
  choice: 正文译作“犹太人”，在本节按公开聚集敬拜的广泛群体理解
  alternative: “犹太地人”或按某些语境理解为“犹太人的领袖”
  rationale: Ἰουδαῖοι在约翰福音中随语境可指犹太民族、犹太地人或某些犹太权势群体。本节并列会堂与圣殿区，较自然地指广泛的犹太群体；脚注保留地域性译法，避免把其他语境的敌对含义强加于此。
- issue: “我暗中什么也没有说过”的绝对表述
  choice: 保留原文的绝对语气
  alternative: 解释为“我没有秘密地传授任何不同的教义”
  rationale: 上下文重点是耶稣教导的公开性质，但原文没有明说“不同的教义”；正文不替原文添加这一常见解释，以保留其修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“公开地／暗中”凸显原文对照；“向来”与“一直”传达持续性而避免重复。“圣殿区”提高词义准确度，并以脚注说明传统简译。“所有犹太人都在那里聚集”保留原文概括性的绝对措辞，不擅自弱化为“许多人”。
