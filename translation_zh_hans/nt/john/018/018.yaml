  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The slaves and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: zh_hans
  text: 奴隶[a]和差役[b]站在那里；因为天冷，他们生了炭火，正在取暖。彼得也同他们站在一起取暖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。这里译作“奴隶”，是为保留这些人员很可能具有的受奴役身份。
    reason: lexical_alternative
  - marker: b
    text: 或译“警卫”。这个词指执行公务的随从，此处很可能隶属圣殿或大祭司的机构。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 该词在此指大祭司宅院中具有隶属身份的人员；译作“奴隶”比笼统的“仆人”更能保留其可能受奴役的社会地位，同时以脚注注明语境中的另一种译法。
- source_word: ὑπηρέται
  choice: 差役
  rationale: 约翰福音中该词常指隶属宗教当局、执行公务的人员。“差役”既体现其官方职能，又不把职责过度限定为纯粹的警卫。
- source_word: ἀνθρακιὰν
  choice: 炭火
  rationale: 准确保留木炭火这一具体细节；这一意象在约翰叙事中也具有前后呼应的作用。
- source_word: πεποιηκότες
  choice: 生了
  rationale: 完成时分词表示他们已经把火生起，而火仍在燃烧；汉语“生了炭火”自然地表达完成动作及其当前结果。
- source_word: ὅτι ψῦχος ἦν
  choice: 因为天冷
  rationale: 清楚保留ὅτι在此所表达的原因关系。
- source_word: ἐθερμαίνοντο
  choice: 正在取暖
  rationale: “正在”体现未完成过去时的持续性，“取暖”自然表达中间态所含的为自己暖身之意。
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: 彼得也同他们
  rationale: “也”保留καί的附加意味，“同他们”明确彼得身处这一群人之中；δέ仅作轻微叙事衔接，汉语不另加“那时”或“现在”。
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: 站在一起取暖
  rationale: 保留彼得站立的姿态和持续取暖的动作，并用自然汉语避免生硬重复“正在”。
