source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: zh_hans
  text: 彼得却站在门口外面。于是，另一位门徒，就是大祭司所认识的那位，出来，同守门的女子说了话，就把彼得带了进去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: 站着
  rationale: 该形式在这里描述彼得持续处于站立和等候的状态；现代汉语用“站在门外”已可自然表达这一持续状态。
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: 在门外
  rationale: 兼顾靠近入口与位于外面的双重方位；中文“在门外”自然清楚，无须生硬地译成“在外面的门边”。
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: 那位……门徒
  rationale: 承接上文已提到的“另一个门徒”；本节为避免中文定语过长，将“另一位”的辨识功能结合上下文表达为“那位……门徒”。
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: 大祭司所认识的
  rationale: 保留γνωστός关系亲疏未定的含义，不擅自译为“朋友”或“熟人”。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: 这是该犹太宗教职分在现代中文圣经语境中的标准称谓。
- source_word: θυρωρῷ
  choice: 看门的女人
  rationale: 该词指守门人，阴性形式表明此人是女性；“看门的女人”既自然，也为下一节称她为婢女留下空间，而不提前加入原文此处未明说的身份。
- source_word: εἶπεν τῇ θυρωρῷ
  choice: 对看门的女人说了一声
  rationale: 原文未记录所说内容；“说了一声”自然表达简短交涉，同时不补写具体话语。
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: 把彼得带了进去
  rationale: 准确表达将彼得带入入口之内的动作，符合现代汉语叙事习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“大祭司所认识的”这一关系上的含混，不把该门徒与大祭司的关系强化为朋友或亲密熟人。原提供的英文脚注标记与脚注内容似有错位，因此未机械沿用，以免在中文正文中造成错误对应。
