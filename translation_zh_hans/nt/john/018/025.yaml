  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: zh_hans
  text: 西门彼得正站着取暖。于是，他们问他[a]：“你也不是他的门徒吧？”他否认了，说：“我不是。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道你也是他的门徒吗？”希腊文以μή引导这个问句，表示问话的人预期得到否定的回答。
    reason: 说明原文问句所预期的否定回答，并提供自然的另一种汉语表达。
lexical_decisions:
- source_word: Ἦν δὲ
  choice: 正
  rationale: δέ是轻微的叙事连接词，不必机械译出；ἦν与两个分词共同描写当时持续的情景，用“正”自然呈现其进行状态，又不添加原文没有的时间副词“现在”或强烈转折。
- source_word: ἑστὼς
  choice: 站着
  rationale: ἵστημι的完成时分词在此表示彼得保持站立的姿势；“站着”准确而自然。
- source_word: θερμαινόμενος
  choice: 取暖
  rationale: 该中间／被动形式表示使自己暖和；现代汉语以“取暖”表达最自然。本节没有明说“在火旁”，因此不增补。
- source_word: εἶπον οὖν αὐτῷ
  choice: 于是，他们问他
  rationale: οὖν承接前文并推动叙事，译作“于是”；εἶπον在这里引出问话，汉语用“问”比“说”自然。动词为复数，故用“他们”，但不擅自指明具体人物。
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: 你也不是……吧？
  rationale: μή引导的问句通常预期否定回答；“不是……吧”在现代汉语中自然保留这种预期，καὶ σὺ由“你也”表达。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 他的门徒
  rationale: ἐκ加属格表示属于某群体。汉语问“你是／不是他的门徒”已自然表达其中一员，无须生硬译作“从他的门徒中”。
- source_word: ἠρνήσατο ἐκεῖνος καὶ εἶπεν
  choice: 他否认说
  rationale: 将两个并列动作简洁合译，既保留否认及随后发言的关系，也符合现代汉语叙事习惯；ἐκεῖνος在此仅有轻微强调，不需译成突兀的“那人”。
- source_word: Οὐκ εἰμί
  choice: 我不是
  rationale: 保留原文简短、直接而有所省略的否认，不添加“他们中的一个”或更宽泛的神学解释。
theological_decisions:
- issue: 彼得否认的范围
  choice: 按上下文译为否认自己是耶稣的门徒，并保留回答“我不是”的简短省略形式。
  alternative: 扩译为“我不是他的门徒”或“我不是他们中的一个”。
  rationale: 原文回答Οὐκ εἰμί十分简洁，其补足内容可由问句明确得知；保留省略既忠于文本，也避免把这句话扩大为更广泛的 doctrinal 否认。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“取暖”“你也不是……吧”“我不是”均为普通读者易懂的自然表达；不补入本节未明说的“火旁”，也不指明“他们”的具体身份。脚注标记[a]已置于主文对应位置。
