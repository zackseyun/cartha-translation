id: JHN.18.15
reference: John 18:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: zh_hans
  text: 西门彼得跟着耶稣[a]，另一个门徒也跟着。那个门徒是大祭司认识的，就同耶稣一起进了大祭司的院子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为贴近原文结构可译作：“西门彼得跟着耶稣，另一个门徒也是。”希腊文把第二个门徒同样“跟着”耶稣这一动作含蓄地包含在并列结构中。
    reason: 说明原文省略而共享谓语的句法，并提供较形式对应的译法。
lexical_decisions:
- source_word: Ἠκολούθει
  choice: 跟着
  rationale: 未完成时描写当时持续进行的动作；现代汉语用“跟着”结合叙事语境，自然表达这一进行中的行动，不必机械添加“正在”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事衔接词，并无明显转折；汉语直接承接上文更自然，也避免加入原文没有的“这时”或“如今”。
- source_word: καὶ ἄλλος μαθητής
  choice: 另一个门徒也跟着
  rationale: 原文以并列结构让前面的“跟着”同时支配“另一个门徒”；汉语补出“也跟着”，清楚而自然地表达隐含的共同动作。
- source_word: μαθητής
  choice: 门徒
  rationale: “门徒”是约翰福音语境中对耶稣之学习者和跟随者的通行、准确译法。
- source_word: ἐκεῖνος
  choice: 那个
  rationale: 指回刚提到的“另一个门徒”，保留指示代词的回指作用。
- source_word: γνωστός
  choice: 所认识的
  rationale: 表达该门徒为大祭司所认识，但不擅自加强为“熟识”或“很有交情”。
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: 大祭司
  rationale: 符合此处单数 ἀρχιερεύς 的标准汉语译法，两处保持一致。
- source_word: συνεισῆλθεν
  choice: 同耶稣一起进了
  rationale: 既表达进入，也保留 σύν 所含的伴随、共同进入之意。
- source_word: αὐλήν
  choice: 院子
  rationale: 指大祭司住所内围合的院落；“院子”是清楚自然的现代汉语，不额外推定为宫殿。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“所认识的”刻意不说明两人熟悉到何种程度；“另一个门徒”也不替原文判定其具体身份。
