  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: zh_hans
  text: 出卖耶稣的犹大[a]也知道那个地方，因为耶稣常常和他的门徒在那里聚集。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他交出的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知道
  rationale: οἶδα在这里表示对地点的知晓和熟悉；“知道”自然准确。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ仅轻微推进叙事；现代汉语可借句序自然承接，若硬译“现在”会引入原文没有的时间意味。
- source_word: καὶ
  choice: 也
  rationale: 保留其附加意味，说明犹大同样知道该地点。
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: 那出卖耶稣的
  rationale: παραδίδωμι本义可指交出，但在犹大和受难叙事的语境中具有背叛、出卖的含义；定语结构也自然保留分词对犹大的身份说明。
- source_word: τὸν τόπον
  choice: 那地方
  rationale: 指上一节所述、语境中已经明确的园子；汉语“那地方”比孤立的“这地方”更自然。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出犹大知道该地的原因。
- source_word: πολλάκις
  choice: 常
  rationale: 简洁表达多次、经常发生。
- source_word: συνήχθη
  choice: 聚集
  rationale: 该被动形式在此可按不及物意义理解为聚集、相聚；“聚集”贴近词义，也符合现代汉语表达。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 同门徒
  rationale: μετά加属格表示伴随；上下文已清楚是耶稣的门徒，汉语省略“他的”更自然且不损失所指。
theological_decisions:
- issue: 如何翻译用于犹大的παραδιδοὺς
  choice: 出卖
  alternative: 交出
  rationale: “交出”较贴近基本词义并保留一定开放性，但在此受难叙事中，该词明确描写犹大对耶稣的背叛行为；“出卖”能自然传达其叙事和道德意味，而不额外加入宗派解释。
- issue: 如何理解συνήχθη的被动形式
  choice: 耶稣……聚集
  alternative: 耶稣……相会；耶稣……被聚集
  rationale: 此处被动形式可有不及物用法，描述耶稣常与门徒在该处聚集。“被聚集”在汉语中生硬且容易误导为有人使耶稣聚集；“相会”自然，但较弱化原词的聚集意味。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“那出卖耶稣的犹大”避免“他的”在中文中可能造成的指代迟滞；“常同门徒在那里聚集”保留原文的频率、伴随关系和地点信息。
