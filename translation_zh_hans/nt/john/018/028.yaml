  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: zh_hans
  text: 于是，他们把耶稣从该亚法那里押送到总督府[a]。那时是清早。他们自己没有进入总督府，以免沾染不洁[b]，好能吃逾越节[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衙门”。原词也可音译为“普拉托利安”（Praetorium），指罗马总督的官邸和办理审判等公务的场所。
    reason: lexical_alternative
  - marker: b
    text: “沾染不洁”指在礼仪上成为不洁净。
    reason: cultural_note
  - marker: c
    text: 原文直译为“吃逾越节”，可能专指逾越节的筵席，也可能较广泛地指逾越节期间的筵席、祭物或相关饮食。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: 押送
  rationale: 这是叙事中的历史现在时，汉语自然地按过去事件叙述。“押送”既表达带领移动，也符合耶稣此时受拘押的语境。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事，语气自然，同时保留原文的连接作用。
- source_word: ἀπὸ τοῦ Καϊάφα
  choice: 从该亚法那里
  rationale: 忠实保留以该亚法为起点的表达，不擅自补明是其住宅或官邸。
- source_word: πραιτώριον
  choice: 总督府
  rationale: 指罗马总督的官邸及处理公务、审判事务的场所；“总督府”简洁易懂，并以脚注补充其具体含义及音译选择。
- source_word: πρωΐ
  choice: 天还早
  rationale: 表达清早时分，符合现代汉语叙事习惯，又不把时间过度限定为黎明。
- source_word: αὐτοὶ
  choice: 他们自己
  rationale: 保留代词的强调意味，突出押送耶稣的人自己却不进入总督府。
- source_word: εἰσῆλθον
  choice: 没有进入
  rationale: 直接表达进入建筑或场所，与后文目的从句衔接清楚。
- source_word: μιανθῶσιν
  choice: 沾染不洁
  rationale: 该词在这里涉及礼仪上的不洁；此译法保留宗教礼仪含义，并由脚注说明。
- source_word: φάγωσιν τὸ πάσχα
  choice: 好吃逾越节的食物
  rationale: 保留“吃”与逾越节的直接联系，同时避免在正文中断定仅指逾越节正餐；脚注说明原文措辞及其可能范围。
- source_word: Καϊάφα
  choice: 该亚法
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文通行的人名音译。
theological_decisions:
- issue: “吃逾越节”与约翰福音受难周时间次序的关系
  choice: 正文译为“吃逾越节的食物”，不限定为某一顿特定筵席
  alternative: 吃逾越节的筵席；吃节期的祭物
  rationale: 原文 φάγωσιν τὸ πάσχα 本身没有在此处明确其范围。译文保留它可专指逾越节筵席、也可能泛指节期内相关饮食或礼仪活动的张力，不在正文中解决年代协调问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“总督府”避免生硬音译；“沾染不洁”保留礼仪语义；末句刻意不把“吃逾越节”收窄为特定一餐。
