source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: zh_hans
  text: 耶稣说完这些话，有一个站在旁边的差役[b]打了耶稣一巴掌[a]，说：“你竟这样回答大祭司吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打了……一巴掌”所译的希腊语指用手击打，也可能是掌掴或类似的一击。
    reason: lexical_alternative
  - marker: b
    text: “差役”也可译作“侍从”或“仆役”；在这里很可能指大祭司体系下执行职务的人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 保留复数指示语的所指，并在中文中自然地回指耶稣刚才所说的内容。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词；中文以句序自然承接，若硬译为“于是”或“但”会加强原文未必具有的时间或转折意味。
- source_word: αὐτοῦ εἰπόντος
  choice: 耶稣说完……
  rationale: 以时间结构表达属格独立结构；“说完”体现不定过去分词所表示的先行动作。
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: 有一个站在旁边的差役
  rationale: 既表达此人属于ὑπηρέται中的一个，也保留其站在现场旁边的状态；“差役”在本语境中自然表示执行职务的下属人员，同时不将其过度具体化为现代警察。
- source_word: ἔδωκεν ῥάπισμα
  choice: 打了……一巴掌
  rationale: 准确传达该希腊语表达所指的手击；正文采用自然清楚的中文，脚注保留“掌掴或类似手击”的语义范围。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: 随中文动词“打”的句法改作直接宾语，并保留原文明确使用的姓名，避免代词指向含混。
- source_word: εἰπών
  choice: 说
  rationale: 自然引出随后直接引语，忠实表达伴随分词的功能。
- source_word: Οὕτως
  choice: 这样
  rationale: 保留对回答方式的指称；与“竟”合用，形成自然的责问语气。
- source_word: ἀποκρίνῃ
  choice: 回答
  rationale: 直接、常用地表达该动词“回答、答复”的意义。
- source_word: τῷ ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是该犹太职衔在现代中文圣经语境中准确而通行的译法。
theological_decisions:
- issue: ὑπηρέτης所指人员的身份
  choice: 差役，即在场执行职务的下属人员
  alternative: 仆人；侍从；圣殿警卫
  rationale: 该词本身可泛指下属、侍从或公务人员；在审讯场景中很可能指大祭司体系下执行职务的人，但原文没有明确称其为“圣殿警卫”，因此正文采用较宽而符合语境的“差役”，不作过度限定。
- issue: 责问语气的表达
  choice: “你竟这样回答大祭司吗？”
  alternative: “你是这样回答大祭司的吗？”
  rationale: 原句的问法在语境中明显带有斥责；“竟”自然传达这种语用色彩，却不增添具体的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说完这些话”使时间关系清楚；“差役”保留古代职务语境而不套用现代警务称谓；“一巴掌”虽属日常词语，但在现代汉语中是对该动作最清楚自然的表达，并以脚注保留原词的范围。
