base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: zh_hans
  text: 于是，亚那把被捆绑着的耶稣送到大祭司该亚法那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，本句也可理解为插叙：“亚那先前已经把被捆绑着的耶稣送到大祭司该亚法那里。”这是对前面事情经过的补充说明。
    reason: 保留本节叙事时序的另一种合理理解。
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 送到……那里
  rationale: 不定过去时主动直陈语气，在叙事中表示亚那将耶稣送往该亚法那里；现代汉语用“送到……那里”自然地表达差遣和移动。
- source_word: οὖν
  choice: 于是
  rationale: 承接叙事进展，既保留连接作用，又比“所以”更适合此处事件次序的推进。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 希腊文直译为“他”；现代汉语在本句有两位男性人物时补出“耶稣”，可避免代词指向含混，不改变所指。
- source_word: δεδεμένον
  choice: 仍被捆绑着的
  rationale: 完成时被动分词说明耶稣被送走时处于已遭捆绑且持续被绑的状态；“仍被捆绑着”自然体现这一持续状态。
- source_word: πρὸς Καϊάφαν
  choice: 到……该亚法那里
  rationale: πρός与宾格连用，在移动动词之后表示朝向某人；“到……那里”符合现代汉语表达。
- source_word: ὁ Ἅννας
  choice: 亚那
  rationale: 采用该人名在简体中文圣经传统中的通行译名。
- source_word: τὸν ἀρχιερέα
  choice: 大祭司
  rationale: 指犹太教大祭司这一特定职分；“大祭司”是准确且通行的现代汉语译法。
theological_decisions:
- issue: 本节与上下文之间的叙事时序
  choice: 正文按通常叙事顺序译为亚那随后把耶稣送到该亚法那里。
  alternative: 将本节理解为插叙：亚那先前已经把耶稣送到该亚法那里，本节是在说明前文审讯发生的地点或过程。
  rationale: ἀπέστειλεν是不定过去时直陈语气，最自然的正文读法是一次过去的叙事事件；但该时态本身不绝对排除回顾性说明，因此以脚注保留上下文中的另一种理解，不在正文中强行协调叙事。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“于是”推进叙事；为避免多个男性人物造成代词歧义，将αὐτόν明确译作“耶稣”。脚注标记已在正文中对应出现。
