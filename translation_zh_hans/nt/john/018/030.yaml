  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: zh_hans
  text: 他们回答他说：“这人若不是作恶的人，我们就不会把他交给你了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 他们回答他说
  rationale: 保留原文“回答并说”的叙事公式，同时采用现代汉语中自然、庄重的表达；“他”按上下文指彼拉多。
- source_word: Εἰ μὴ ἦν
  choice: 若不是
  rationale: 表达与事实相反的条件，并贴近希腊文的条件句结构。
- source_word: οὗτος
  choice: 这人
  rationale: 自然地指称耶稣，也保留控告者话语中的疏离语气，而不额外加入轻蔑色彩。
- source_word: κακὸν ποιῶν
  choice: 作恶的
  rationale: 保留ποιῶν的动作含义和κακόν的道德力度，不将其收窄为技术性的法律罪名。
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: 我们就不会把他交给你了
  rationale: 准确表达与事实相反条件句的结果，并以“交给”呈现司法语境中παραδίδωμι的移交含义。
theological_decisions:
- issue: 控告者对耶稣指控的性质
  choice: 译作“作恶的”，保留概括性的道德指控
  alternative: 译作“恶人”或“罪犯”
  rationale: κακὸν ποιῶν字面上是“作恶”，并非明确的技术性法律罪名。此译法保留控告者含混而笼统的指控，不替原文补出具体罪名。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“他们回答他说”略带经文叙事色彩，但仍属自然可懂；全句保留原文条件句的反事实力度。
