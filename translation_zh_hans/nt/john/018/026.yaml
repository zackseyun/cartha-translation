  rationale: 修订仅改善中文句法和指代清晰度：以“一个奴隶”对应 εἷς ἐκ τῶν δούλων，以插入性身份说明对应 συγγενὴς ὢν，并保留直接引语的反问力度、园中共同在场及“他”指耶稣的上下文指代。
