  source_fidelity: 译文准确传达了说话者是大祭司的一个奴隶、且与彼得削掉耳朵之人有亲属关系，并保留了预期肯定回答的反问语气。“奴隶”恰当反映 δοῦλος 在此家户社会语境中的受奴役身份。
