  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s slaves[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: zh_hans
  text: 大祭司的一个奴隶[a]，是彼得削掉耳朵的那个人的亲属，说：“我不是在园子里看见你和他在一起吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语 δοῦλος 可按语境指“仆人”或“奴隶”；此处译作“奴隶”，以保留这个词所表明的受奴役身份。
    reason: 词义备选
lexical_decisions:
- source_word: δούλων
  choice: 奴隶
  rationale: 该词在此指大祭司家中受其支配的人员；译作“奴隶”比“仆人”更明确地保留其受奴役的社会身份。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: 这是约翰受难叙事中对犹太祭司最高职分的标准称谓。
- source_word: συγγενὴς ὢν
  choice: 是……的亲属
  rationale: 明确交代说话者与被削掉耳朵之人的亲属关系，同时自然地体现分词短语。
- source_word: οὗ
  choice: 那人
  rationale: 属格关系代词所指的是耳朵被削掉的人；中文需适当补明所指，使句意清楚。
- source_word: ἀπέκοψεν
  choice: 削掉
  rationale: 准确表达彼得用刀使耳朵与身体分离的动作，也符合本段叙事语境。
- source_word: ὠτίον
  choice: 耳朵
  rationale: 采用现代汉语的普通说法；此处无须刻意表达希腊语形式上的指小色彩。
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: 我不是……看见你……吗
  rationale: 保留由否定词引出的反问语气，表明说话者预期对方承认此事；句首“我”也自然体现 ἐγώ 的强调。
- source_word: ἐν τῷ κήπῳ
  choice: 在园子里
  rationale: κήπος 在此指耶稣被捕之处的园子；“园子”自然且不过度限定其具体形态。
- source_word: μετ’ αὐτοῦ
  choice: 跟他在一起
  rationale: 自然表达共同在场之意；“他”在上下文中指耶稣。
theological_decisions:
- issue: 非比喻性家户语境中 δοῦλος 的译法
  choice: 奴隶
  alternative: 仆人
  rationale: 此处说的是大祭司家中实际受支配的人员。译作“奴隶”保留原词所含的受奴役身份，不以较委婉的传统用语淡化其社会现实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大祭司的奴隶中有一个”贴合原文的部分结构；将较长的身份说明与直接引语分成两句，以提高可读性，同时不改变人物关系或反问力度。
