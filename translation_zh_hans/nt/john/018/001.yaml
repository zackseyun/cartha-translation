id: JHN.18.1
reference: John 18:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: zh_hans
  text: 耶稣说完这些话，就同门徒出去，过了汲沦溪谷[a]。那里有一个园子，他和门徒进了园子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “汲沦溪谷”也可译作“汲沦沟”或“汲沦溪”。希腊语所用的词指雨季有水的溪沟或谷地。
    reason: 说明 χείμαρρος 的词义范围，保留它可指季节性水道及沟谷的含义。
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: 说完这些话
  rationale: 不定过去时分词在此表达先于主句的动作；译作“说完这些话”自然清楚，也保留叙事先后。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 保留动词“出去”的具体移动含义，并符合约翰叙事简洁的风格。
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: 同门徒
  rationale: 准确表达 σύν 加与格所表示的陪同关系；“同”简洁、自然而庄重。
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: 过了汲沦溪谷
  rationale: πέραν 在移动语境中表示到达另一边；χείμαρρος 指季节性有水的沟谷或溪流河道。“溪谷”兼顾地貌与季节性水道的含义，避免单译“溪”暗示常年流水。
- source_word: ὅπου ἦν κῆπος
  choice: 那里有一个园子
  rationale: 自然表达地点关系和 ἦν 的存在含义；κῆπος 取通常意义“园子”，不限定为果园。
- source_word: εἰς ὃν εἰσῆλθεν
  choice: 进了园子
  rationale: 汉语重复“园子”比直译为“进入其中”更自然，同时明确保留 εἰς 所表达的进入方向。
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: 他和门徒
  rationale: 明示耶稣与门徒共同进入；不加“亲自”，以免赋予 αὐτός 不必要的强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希腊语较长的关系从句拆成两个汉语句子，以免生硬，同时保留全部动作、人物和地点信息。专名 Κεδρών 按现代中文圣经常见形式译作“汲沦”。
