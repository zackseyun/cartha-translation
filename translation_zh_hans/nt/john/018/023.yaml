  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: zh_hans
  text: 耶稣回答他：“如果我说得不当，就请指证我哪里说得不当[a]；如果我说得对，为什么打我[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请为那不当之处作证”，或“请证明我哪里说得不当”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为什么击打我？”希腊语动词可泛指击打，在某些语境中也可指殴打或鞭打。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: 耶稣回答他说
  rationale: 按希腊语叙事结构译出回答者和间接宾语；“回答他说”庄重自然，也明确回应的是刚才打耶稣的差役。
- source_word: Εἰ κακῶς ἐλάλησα
  choice: 如果我说错了
  rationale: κακῶς在此修饰“说”，既可指错误、不当，也可能带有恶意的色彩；“说错了”符合审讯语境，并与后面的“说得对”构成清楚对照。
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: 就请指证错在哪里
  rationale: μαρτύρησον具有作证、提供证言的司法意味；“指证”保留这一语气，而“错在哪里”自然表达περὶ τοῦ κακοῦ所指的被控过错，但不把它限定为犯罪。
- source_word: εἰ δὲ καλῶς
  choice: 如果我说得对
  rationale: καλῶς与κακῶς形成反义对照；“说得对”比“说得好”更能表达内容正确或言语正当。
- source_word: τί με δέρεις
  choice: 为什么打我
  rationale: τί在此为“为什么”；δέρω可泛指击打，也可在别处指殴打或鞭打。“打”简洁自然，且不把动作过度限定为掌掴或持续殴打。
theological_decisions:
- issue: 耶稣面对暴力时回应的性质
  choice: 保留其要求提出证据并质问无理击打的司法与道德逻辑
  alternative: 扩写为对审讯违法或不公的直接定罪，或弱化其中的质问语气
  rationale: 原文让耶稣以“若……就……；若……为何……”的对称条件句要求证言并揭示击打缺乏正当理由；译文不增加原文未明说的法律判断或教义说明。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“指证”保留审讯场景中的证言意味；两个条件句以“说错了／说得对”形成直接对照。脚注标记均置于其所说明的词语之后。
