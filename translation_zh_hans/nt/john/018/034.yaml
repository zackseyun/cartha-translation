  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: zh_hans
  text: 耶稣回答：“你说这话，是出于你自己[a]，还是别人把关于我的事告诉了你？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从你自己”。这里问的是这话是否源自彼拉多本人。
    reason: 说明ἀπὸ σεαυτοῦ的直译及其表示来源的含义。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 这是福音书对话中表示回应的常用叙事动词；“回答”自然、准确。
- source_word: Ἀπὸ σεαυτοῦ
  choice: 出于你自己
  rationale: ἀπό与反身代词表示来源，重点在于彼拉多这话是否源自他本人；“出于你自己”既保留来源之意，也符合现代汉语表达。
- source_word: σὺ
  choice: 你
  rationale: 原文显式使用第二人称代词，带有强调意味；汉语保留“你”，可自然体现这一重点。
- source_word: τοῦτο λέγεις
  choice: 你说这话
  rationale: τοῦτο回指彼拉多先前的问题；汉语用“这话”比单用“这”更清楚，λέγεις译为“说”符合当下对话语境。
- source_word: ἄλλοι εἶπόν σοι
  choice: 别人对你说了
  rationale: ἄλλοι指彼拉多以外的人，εἶπόν为不定过去时；“别人对你说了”简洁地保留动作及其受话对象。
- source_word: περὶ ἐμοῦ
  choice: 关于我的事
  rationale: περί加属格表示“关于、论及”；“关于我的事”在汉语中自然，并保留所说内容未被进一步限定的开放性。
theological_decisions:
- issue: 耶稣问题的着重点
  choice: 译为询问彼拉多这话的来源：是出于他自己，还是从别人那里听来
  alternative: 较解释性地译为“这是你主动要问的吗”
  rationale: 原文直接对比“出于你自己”与“别人对你说”，焦点是话语或看法的来源；不把彼拉多的动机或更完整的神学含义加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的对话体。“出于你自己”略带正式色彩，但能准确体现原文的来源含义；脚注补充其直译形式。
