  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: zh_hans
  text: “你为什么盘问我？去问那些听过我讲话的人，我对他们说了什么。你看[a]，这些人知道我说过什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，这些人知道我说过什么。”原文的“这些人”带有指示意味，可能是指当场可供询问的人。
    reason: 保留ἴδε和οὗτοι较直译的表达及其现场指示意味。
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: 你为什么盘问我？
  rationale: τί加现在时ἐρωτᾷς构成直接质问。结合大祭司审问的司法语境，“盘问”比中性的“问”更贴切，也保留了耶稣反问的力度。
- source_word: ἐρώτησον
  choice: 去问
  rationale: 不定过去时命令式要求采取直接行动。汉语若重复“盘问那些听过的人”容易暗示这些人也是受审对象，因此用自然的“去问”，既承接前句，又不增加原文没有的含义。
- source_word: τοὺς ἀκηκοότας
  choice: 那些听过我讲话的人
  rationale: 完成时主动分词指已经听过并因此能够作证的人。“听过我讲话”在汉语中自然表达其所听内容；“我讲话”虽由后文内容补足，但未超出句意。
- source_word: τί ἐλάλησα αὐτοῖς
  choice: 我对他们说了什么
  rationale: λαλέω在此为“说、讲”；此译自然地保留了内容问句和αὐτοῖς所表达的对象。
- source_word: ἴδε
  choice: 你看
  rationale: ἴδε是引起注意的用语。“你看”符合现代汉语口吻，同时比古雅的“看哪”更自然。
- source_word: οὗτοι οἴδασιν
  choice: 他们知道
  rationale: οὗτοι带指示意味，所指即刚提到的那些听众。汉语在近距离上下文中用“他们”更自然；指示关系仍然清楚。
- source_word: ἃ εἶπον ἐγώ
  choice: 我说过什么
  rationale: 译出关系代词所引出的内容，并以“说过”自然反映已发生的话语。显明的ἐγώ具有强调作用，但汉语若译作“我自己”会显得过重；上下文中重复“我”已能传达对比。
theological_decisions:
- issue: 大祭司面前答话的司法语气
  choice: 首句将ἐρωτάω译为“盘问”，命令句译为“去问”
  alternative: 两处都译为“问”或都译为“盘问”
  rationale: 首处“盘问”体现正式审讯语境；第二处若照样译为“盘问”，在汉语中可能误示听众也是被审讯者。因此采用语境相称而不过度推断的差异译法，保留耶稣要求向公开听众求证的重点。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“盘问”体现审讯背景；其余措辞避免古雅和法律术语堆叠。脚注标记[a]已置于正文对应位置。
