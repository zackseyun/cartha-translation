  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: zh_hans
  text: 彼拉多回答说：“难道我是犹太人[a]吗？是你自己的民族和祭司长们把你交给了我。你做了什么事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。希腊语这个词按语境既可指民族、宗教身份的“犹太人”，也可指地域身份的“犹太地人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: 约翰叙事对话中的常用回应动词；“回答说”在现代汉语中自然，并清楚引出直接引语。
- source_word: Μήτι
  choice: 难道我是……吗？
  rationale: μήτι引出预期否定回答的反问；“难道……吗”能自然表达彼拉多的否认和反问语气。
- source_word: Ἰουδαῖός
  choice: 犹太人
  rationale: 此处彼拉多将自己与耶稣所属的民族及其领袖对比，主要指民族—宗教身份；“犹太人”最通行易懂，同时以脚注保留“犹地人”的地域性可能。
- source_word: τὸ ἔθνος τὸ σὸν
  choice: 你自己的民族
  rationale: “民族”保留ἔθνος的群体和民族含义，“你自己的”体现τὸ σὸν的强调，并传达彼拉多的疏离语气。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指耶路撒冷圣殿祭司阶层中的领袖群体；复数“们”明确这是一个群体，而不是仅指一位大祭司。
- source_word: παρέδωκάν σε ἐμοί
  choice: 把你交给了我
  rationale: 准确表达将人移交给掌权者处置的司法语境，不额外加入“出卖”的道德判断。
- source_word: τί ἐποίησας
  choice: 你做了什么事？
  rationale: 自然表达对导致当前审讯之行为的询问，也保留原文宽泛而未具体说明罪名的问法。
theological_decisions:
- issue: 约翰福音中Ἰουδαῖος的译法
  choice: 犹太人
  alternative: 犹地人
  rationale: 该词可表示民族—宗教身份，也可表示地域身份。此处彼拉多的反问紧接“你自己的民族”，较支持较广的民族身份义；脚注保留地域义，避免掩盖原词的语义范围。
- issue: “交给”是否译为“出卖”
  choice: 交给
  alternative: 出卖
  rationale: 上下文强调耶稣被移交给罗马总督审理；“交给”保留司法移交含义，不在此处强加“背叛”的伦理色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”保留反问力度；“你自己的民族”体现原文强调和彼拉多的疏离感；脚注标记已在正文“犹太人”之后出现。
