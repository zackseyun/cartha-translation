base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: zh_hans
  text: 他们回答他：“拿撒勒人耶稣。”耶稣对他们说：“我就是。”那出卖他的犹大也同他们站在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: 拿撒勒人耶稣
  rationale: 保留定冠词短语所表达的身份指称；“拿撒勒人”自然、简洁，也与上下文寻找某人的场景相符。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 希腊文没有明说表语，中文“我就是”既可按语境理解为“我就是你们找的人”，又保留约翰叙事中这一措辞可能具有的更深回响，不增补“他”而过度限定。
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: 那出卖他的
  rationale: 现在分词带冠词，用来识别犹大；“出卖”准确传达交付耶稣给敌对者的背叛行为，同时符合现代汉语。
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: 也同他们站在一起
  rationale: 保留过去完成时所描写的既成站立状态及“与他们一起”的阵营意味；中文采用自然的场景叙述。
theological_decisions:
- issue: Ἐγώ εἰμι 是否明确补成“我就是他”
  choice: 我就是
  alternative: 我就是他／是我
  rationale: 原文为绝对式“我是”，未出现“他”。语境确实支持身份回答，但约翰福音反复使用该表达，可能兼具普通认领身份与神学回响。译作“我就是”在现代中文中可成立，并保留这种张力。
- issue: παραδίδωμι 在此译为中性“交出”还是带背叛意味的“出卖”
  choice: 出卖
  alternative: 交出／交付
  rationale: 就该叙事语境而言，犹大正在把耶稣交给前来拘捕的人，“出卖”准确体现其背叛角色；此选择来自上下文，而非引入宗派解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留简洁对话和原文的神学含混；不用生硬的直译腔，也不添加原文没有的解释性成分。
