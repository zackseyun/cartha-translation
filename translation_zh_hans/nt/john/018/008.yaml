  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: zh_hans
  text: 耶稣回答：“我已经告诉你们，我就是[a]。那么，如果你们找我，就让这些人走吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是。”希腊原文没有补出“他”；这里也可理解为耶稣在表明自己就是他们所找的人。
    reason: 保留ἐγώ εἰμι的字面形式及其在约翰福音中可能具有的神学回响，同时说明当前语境中的身份确认意义。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 对话叙事中的常规译法，自然、庄重，准确表达回应之意。
- source_word: Εἶπον ὑμῖν
  choice: 我已经告诉你们
  rationale: 结合与格ὑμῖν及对先前话语的回指，译为“告诉你们”比“对你们说”更自然；“已经”明示过去动作在当前语境中的回顾意味。
- source_word: ἐγώ εἰμι
  choice: 我就是
  rationale: 本句直接回应对方寻找拿撒勒人耶稣的身份确认；“我就是”在现代汉语中可自然独立使用，同时比补成“我就是他”更贴近希腊文未明说谓语的形式，并保留约翰叙事中可能存在的神学回响。
- source_word: εἰ οὖν ἐμὲ ζητεῖτε
  choice: 你们既然找的是我
  rationale: οὖν承接已确认的事实，此处条件句带有基于现实前提作推论的语气；“既然”比单纯“如果”更符合现场语境。“找的是我”也保留ἐμέ的强调。
- source_word: ἄφετε τούτους ὑπάγειν
  choice: 就让这些人走吧
  rationale: ἄφετε加不定式表示准许离开；“让……走”简洁自然，不额外引入“释放”所暗示的正式羁押含义。τούτους依上下文明确指耶稣身边的人，译作“这些人”。
theological_decisions:
- issue: 约翰语境中ἐγώ εἰμι的译法
  choice: 我就是
  alternative: 我是；我就是他
  rationale: “我就是”既清楚表达现场的身份确认，又不补入原文没有的“他”，从而保留绝对式ἐγώ εἰμι可能带有的神学张力。脚注列出更贴近字面的“我是”，使读者看见原文形式。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“我就是”符合普通话身份确认的自然表达；“走吧”使命令语气自然，但不削弱耶稣主动要求放行同伴的力度。
