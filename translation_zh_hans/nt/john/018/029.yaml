  naturalness: “彼拉多出来到他们那里”不符合自然现代汉语搭配；应以停顿或动词补足移动关系，如“出来，走到他们那里”。“你们对这个人提出什么指控？”是自然、庄重而明确的司法问话。
  terminology: “指控”适合对应κατηγορία，并在司法语境中自然表达φέρετε（提出）。人名“彼拉多”正确；“这个人”准确对应τοῦ ἀνθρώπου τούτου，未不当增添身份或罪名。
