  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: zh_hans
  text: 于是，彼拉多出来，走到他们那里，对他们说：“你们对这个人提出什么指控？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: 出来
  rationale: ἐξέρχομαι与ἔξω共同强调从里面到外面的移动；现代汉语用“出来”自然涵盖二者的空间意义，也符合彼拉多从总督府内到外面见众人的场景。
- source_word: οὖν
  choice: 于是
  rationale: 这里承接前文并推动叙事发展；“于是”比“所以”更适合现代汉语叙事，同时保留连接作用。
- source_word: πρὸς αὐτούς
  choice: 到他们那里
  rationale: πρός加宾格表示朝向某些人移动并与其接触；“到他们那里”明确保留移动的终点。
- source_word: φησίν
  choice: 说
  rationale: 希腊文使用历史现在时，但现代汉语叙事中的“说”本身不标时态，既自然，也无需刻意复制形式上的现在时。
- source_word: Τίνα κατηγορίαν
  choice: 控告……什么
  rationale: κατηγορία具有司法语境中的控告、罪名之意。汉语将名词结构转换为动宾问句“控告……什么”，比“带来什么控告”自然，同时保留司法质询的含义。
- source_word: φέρετε
  choice: 控告
  rationale: φέρω在法律语境中指提出或带来控告。汉语以“控告”表达整个法律行为，避免生硬直译“带来控告”。
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: 这个人
  rationale: κατά加属格表示控告所针对的对象；在汉语“控告这个人”中，“针对、反对”的关系已由动词支配结构自然表达。ἄνθρωπος在此指具体男性，但“这个人”是司法问话中自然且准确的称呼。
