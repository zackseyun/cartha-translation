  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: zh_hans
  text: 于是，大祭司就耶稣的门徒和他的教导询问耶稣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“问耶稣。”希腊语动词可译为“问”或“询问”；正文采用“询问”，以表达此处正式的问话场景，但不加强为“盘问”或“审讯”。
    reason: 词义有多种可能；保留较简洁的译法，并说明正文选择不强化原文语气。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文叙事并推进情节；“于是”在现代汉语中自然，也保留了连接和推展作用。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 按希腊文的单数定冠职衔直译，不在正文中以人名取代，也不为协调历史背景而改写。
- source_word: ἠρώτησεν
  choice: 盘问
  rationale: 该动词可表示“问、询问”；在正式审问的叙事情境中，“盘问”能体现较正式的问话，但不必理解为带有强迫意味的审讯。其较中性的译法列入脚注。
- source_word: περὶ
  choice: 就……
  rationale: 两次περὶ加属格都标明问话所涉及的事项；中文用“就……盘问”简洁自然，并统摄两个并列主题。
- source_word: μαθητῶν
  choice: 门徒
  rationale: 准确保留福音书中师徒关系的常用称谓，比泛称“跟随者”更贴近原词。
- source_word: διδαχῆς
  choice: 教导
  rationale: “教导”通俗而准确，既可指耶稣所教的内容，也不带“教义”可能引入的后期系统化色彩。
- source_word: αὐτοῦ
  choice: 耶稣的／省略重复领属语
  rationale: 原文两处领属代词都指耶稣。中文在并列结构中只明说一次“耶稣的”，自然统摄“门徒”和“教导”；末尾用“他”回指耶稣。
theological_decisions:
- issue: 叙事背景中的人物是亚那，而原文仍使用ἀρχιερεύς这一职衔
  choice: 按原文译作“大祭司”
  alternative: 译作“亚那大祭司”或“祭司长”
  rationale: 正文遵循原文的叙事表达，不擅自加入人名，也不以历史协调取代原有职衔，从而保留约翰叙事本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“就……盘问”体现正式问话场景；并列项共用一次领属语，避免机械重复，同时清楚表明门徒和教导都属于耶稣。
