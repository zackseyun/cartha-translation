  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: zh_hans
  text: 于是，他又问他们：“你们找谁？”他们说：“拿撒勒人耶稣[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿撒勒的耶稣”；希腊文作“耶稣，这位拿撒勒人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: 于是……又
  rationale: πάλιν表示动作重复，译作“又”；οὖν承接前文并推进叙事，译作“于是”，符合现代汉语叙事习惯。
- source_word: ἐπηρώτησεν αὐτούς
  choice: 他问他们
  rationale: ἐπερωτάω在这里指直接发问；“问”简洁自然，不额外赋予审问或盘问的意味。主语依上下文补为“他”。
- source_word: Τίνα ζητεῖτε
  choice: 你们找谁
  rationale: ζητέω在此指寻找特定的人；“找谁”是自然、准确的现代汉语表达，也保留正在进行的行动语境。
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ在此主要推进问答，不必机械译出；“他们说”准确而流畅。
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: 拿撒勒人耶稣
  rationale: Ναζωραῖος是用于辨认耶稣的称谓；“拿撒勒人耶稣”既贴近希腊文结构，也是在现代汉语中可理解的表达。
theological_decisions:
- issue: Ναζωραῖος作为耶稣的地域性称谓
  choice: 拿撒勒人耶稣
  alternative: 拿撒勒的耶稣
  rationale: 该词在此主要用于身份辨认，并非需要扩展解释的教义性头衔。“拿撒勒人”保留其名词性称谓形式，同时不引入超出原文的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问句译为口语中清楚自然的“你们找谁？”，叙事连接则用“于是……又”明确承接前文及重复发问。
