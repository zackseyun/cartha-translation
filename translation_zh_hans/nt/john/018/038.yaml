  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: zh_hans
  text: 彼拉多对他说：“真理是什么？”说完这话，他又出去见犹太人[a]，对他们说：“我查不出有什么理由可以控告他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太领袖”。在约翰福音中，“犹太人”有时可按语境较具体地指犹太地的当权者，或当时反对耶稣的代表群体。
    reason: 保留Ἰουδαίοι在本段中的语境性所指，避免将其不加区分地理解为全体犹太人。
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: 彼拉多对他说
  rationale: λέγει是叙事中的历史现在时；现代汉语通常以过去叙事语境自然表达，不必机械加入“现在”。
- source_word: Τί ἐστιν ἀλήθεια;
  choice: 真理是什么？
  rationale: ἀλήθεια没有冠词，这一译法保留其概括性和可能的哲理意味，不把它收窄为某项特定的“事实”。
- source_word: Καὶ τοῦτο εἰπὼν
  choice: 说完这话
  rationale: 以自然简洁的汉语表达不定过去时分词所显示的先后关系。
- source_word: πάλιν ἐξῆλθεν
  choice: 又出去
  rationale: “又”对应πάλιν，表明彼拉多再次从里面出去；“出去”直接表达ἐξῆλθεν。
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: 到犹太人那里
  rationale: 正文保留Ἰουδαίους的基本词义，同时用脚注说明在本段语境中可能特指犹太领袖或当场控告耶稣的代表群体。
- source_word: καὶ λέγει αὐτοῖς
  choice: 对他们说
  rationale: λέγει同样是历史现在时，按自然汉语叙事表达为“说”。
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: 我查不出控告他的任何理由
  rationale: αἰτία在审讯语境中指控告、定罪所依据的理由；“查不出”体现彼拉多作出司法判断的语气，也避免将其泛化为单纯的道德瑕疵。
theological_decisions:
- issue: 约翰受难叙事中Ἰουδαίοι的所指
  choice: 正文译作“犹太人”，并加脚注说明语境中的较窄所指
  alternative: 犹太领袖；犹太地人
  rationale: 正文透明保留原词的基本族群称谓，但该词在约翰福音中有时按语境特指犹太当局或反对耶稣的代表群体。脚注既保留原文的张力，也避免读者误以为这里毫无区分地指全体犹太人。
- issue: 彼拉多宣告中αἰτία的司法含义
  choice: 控告他的任何理由
  alternative: 他有什么罪；他有什么罪状；可以定他的罪名
  rationale: 这一表达保留司法场景，说明彼拉多没有找到支持控告的依据，同时不把原文进一步强化为正式宣判无罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说完这话”“又出去”保持行文流畅；彼拉多最后一句使用清楚的司法措辞，但不过度法律术语化。
