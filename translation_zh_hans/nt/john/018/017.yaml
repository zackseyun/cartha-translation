source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: zh_hans
  text: 于是，看门的女仆[a]对彼得说：“你不也是这个人的门徒吧？”他说：“我不是。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看门的女仆”或译“看门的女奴”。
    reason: παιδίσκη可指女仆或女奴；θυρωρός指负责守门的人。脚注保留其可能的奴役身份，同时正文采用较宽泛、自然的角色表达。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事；“于是”在现代汉语中自然，也保留了连接作用。
- source_word: παιδίσκη
  choice: 使女
  rationale: 指年轻的女性仆役，也可能带有奴婢身份。“使女”简洁庄重，既表达其服役身份，又不在正文中过度断定其法律地位；另一可能译法见脚注。
- source_word: θυρωρός
  choice: 看门的
  rationale: 说明她负责把守或照看入口；汉语用“看门的”自然清楚，并与“使女”顺畅组合。
- source_word: Μὴ καὶ σὺ
  choice: 你不也是……吧？
  rationale: μή引导的问句通常预期否定回答；句末“吧”自然传达说话者倾向于得到否定答复，同时保留问句语气。
- source_word: ἐκ τῶν μαθητῶν
  choice: ……的门徒
  rationale: 结合“也”和上下文，以自然汉语表达属于该门徒群体中的一员；无需直译为“从门徒中”。
- source_word: τοῦ ἀνθρώπου τούτου
  choice: 这个人
  rationale: ἄνθρωπος在此为普通称谓，并非头衔；“这个人”保留τοῦτο所带的指示和一定疏离感。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 上下文明指彼得，现代汉语用“他”最自然，避免生硬的“那人”。
- source_word: Οὐκ εἰμί
  choice: 我不是
  rationale: 保留希腊文简短、直接且省略补语的否认方式。
theological_decisions:
- issue: μή所引导否定问句的语用力度
  choice: 译为“你不也是……吧？”，表明问话者预期否定回答。
  alternative: 译为较中性的“你也是……吗？”或语气更强的“难道你也……？”
  rationale: 原文不只是询问信息，而倾向于预期“不是”的回答；“吧”能以自然汉语保留这一语用倾向，又不夸大为惊讶或责难。
- issue: παιδίσκη的社会身份含义
  choice: 正文译作“使女”。
  alternative: 译作“女奴”或“婢女”。
  rationale: 该词可指年轻女仆或女奴；本节首先突出她看门的角色，原文并未在此明确强调法律身份，因此正文采用较宽而合乎语境的“使女”，并在脚注保留更明确的身份译法。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“这个人”保留原文略带疏离的称呼；彼得的回答保持短促。“你不也是……吧？”符合现代普通话习惯，并体现原问句预期否定回答的语气。
