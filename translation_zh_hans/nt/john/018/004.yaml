source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: zh_hans
  text: 耶稣知道将要临到自己的一切事[a]，就走了出来，对他们说：“你们找谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“知道将要发生在自己身上的一切”。
    reason: 原文 τὰ ἐρχόμενα ἐπ’ αὐτόν 可自然理解为“临到他的事”，也可用“发生在他身上的事”来表达；两者都保留事件即将发生及其指向耶稣的含义。
lexical_decisions:
- source_word: οὖν
  choice: 就
  rationale: 在这里承接上文并推进叙事；“就”自然体现由耶稣明知将临之事而采取行动的联系，又不把推论意味表达得过重。
- source_word: εἰδὼς
  choice: 知道
  rationale: 该不定过去时分词表示耶稣采取行动时已经清楚将发生的事；现代汉语用“知道”简洁自然。
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: 将要临到自己的一切事
  rationale: 保留 πάντα 的全面性及 ἐρχόμενα ἐπ’ αὐτόν 所表达的临近、落到他身上的事件，不提前明说这些事件的具体内容。
- source_word: ἐξῆλθεν
  choice: 走了出来
  rationale: 直接表达从原处出来的动作，并符合现场叙事；不添加“勇敢地”“主动迎上去”等原文未明说的评价。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时；汉语叙事无需机械标示时态，以“说”自然呈现。
- source_word: Τίνα ζητεῖτε
  choice: 你们找谁
  rationale: “谁”是 ζητεῖτε 的宾语，而现代汉语不作宾格形态区分；“找”准确、自然地表达此处 ζητέω 的实际语境。
theological_decisions:
- issue: 耶稣对即将临到之事的预知
  choice: 明确保留耶稣知道将要临到自己的一切事
  alternative: 将其强化为关于耶稣全知属性的明示性教义陈述
  rationale: 经文本身强调耶稣在被捕前并非不知情，但没有在本节展开系统性的全知教义；译文保留叙事中的神学分量而不越出原文。
- issue: 耶稣走出的主动性
  choice: 译作“就走了出来”，保留他在知情之下采取行动的叙事次序
  alternative: 译作“主动迎上前去”
  rationale: 上下文可使读者感受到耶稣的主动，但“主动迎上前去”会加入 ἐξῆλθεν 本身未明确表达的方向和解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将要临到自己的一切事”略带经文语体但仍易懂；问句用日常而得体的“你们找谁？”，避免生硬的“你们寻找何人？”
