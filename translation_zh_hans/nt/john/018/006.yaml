  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: zh_hans
  text: 于是，他一对他们说：“我就是[a]”，他们就往后退去，倒在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“我是”。这个希腊语表达也可能与约翰福音中具有特色的“我是”说法相呼应。
    reason: 保留原文的字面形式及其可能的神学回响。
lexical_decisions:
- source_word: ὡς οὖν
  choice: 所以，当……时
  rationale: 兼顾οὖν承接上文的推论意味和ὡς的时间意味，以自然的现代汉语连接叙事。
- source_word: εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 直接对应动词与间接宾语，表达自然、清楚。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 在寻找拿撒勒人耶稣的直接语境中，这是自我确认；“我就是”既符合现代汉语回答方式，也比补出“那个人”更能保留原文简短而可能富有神学回响的措辞。
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: 向后退
  rationale: 明确表达向后移动，贴近εἰς τὰ ὀπίσω，同时符合汉语叙事习惯。
- source_word: ἔπεσαν χαμαί
  choice: 倒在地上
  rationale: 准确呈现跌倒并落在地面的动作；“倒在地上”在现代汉语中自然有力。
theological_decisions:
- issue: 约翰福音语境中Ἐγώ εἰμι的自我确认功能及潜在神学回响
  choice: 我就是
  alternative: 我是
  rationale: 直接语境支持将其理解为对身份的确认，但原文没有明说谓语；主文采用自然且简洁的“我就是”，脚注保留更直译的“我是”，不抹去它与本书其他“我是”言论之间可能存在的呼应。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“便”使动作承接紧凑；不增添原文未明说的施事动机或超自然解释。
