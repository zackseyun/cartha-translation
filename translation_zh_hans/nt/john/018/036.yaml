source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: zh_hans
  text: 耶稣回答说：“我的国不是源于这个世界。我的国若源于这个世界，我的臣仆就会争战，使我不至于被交给犹太人[a]。但事实上，我的国不是从这里来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”；这里可能更具体地指犹太当局。
    reason: 保留Ἰουδαῖοι在约翰福音中可能具有的地域性或权力群体指向，避免把所指范围过早固定。
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: “国”是现代汉语圣经语境中自然且庄重的对应词，在这里既可指王权统治，也可指其领域；不把原文单义化为“统治”或“王权”。
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: 源于这个世界
  rationale: ἐκ着重来源或出处。“源于这个世界”比单说“属于这个世界”更清楚地保留原文关于国度来源的表达，同时不暗示耶稣的国与世界毫无关联。
- source_word: κόσμος
  choice: 世界
  rationale: “世界”直接对应κόσμος，也保留约翰著作中它可能兼指现今敌对上帝之秩序的语义空间，不在正文中加以解释性扩写。
- source_word: ὑπηρέται
  choice: 臣仆
  rationale: 该词指在权柄之下服事的人。因上下文谈到“国”，“臣仆”既符合君王语境，也避免把他们过度具体化为差役或官员。
- source_word: ἠγωνίζοντο ἄν
  choice: 就会争战
  rationale: 未完成过去时配合ἄν表达与事实相反的假设，并带有持续行动的意味。“就会争战”在汉语中自然呈现假设结果，也比“抗争”更贴合防止耶稣被交出的武力语境。
- source_word: ἵνα μὴ παραδοθῶ
  choice: 使我不至于被交给
  rationale: 保留ἵνα从句的目的意味和παραδίδωμι的被动形式；“被交给”是自然的现代汉语，也保留司法移交及出卖所形成的语义张力。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: Ἰουδαῖοι可泛指犹太人，也可能按上下文较具体地指犹太地人或犹太当局。正文采用直接而通行的“犹太人”，脚注说明较窄的可能指向。
- source_word: νῦν δὲ
  choice: 但事实上
  rationale: 这里不是单纯表示时间上的“现在”，而是把实际情形与前面的反事实假设相对照；“但事实上”清楚传达这一转折。
- source_word: ἐντεῦθεν
  choice: 从这里来的
  rationale: ἐντεῦθεν是指示性副词，意为“从这里”。此译保留结尾与前文“源于这个世界”相呼应而措辞并不完全相同的特点。
theological_decisions:
- issue: 耶稣的国与世界的关系
  choice: 译作“不是源于这个世界”
  alternative: “不属于这个世界”或“不在这个世界之中”
  rationale: 原文主要否定这个国以世界为来源，而不是否定它在世界中的临在或影响。此译避免把经文解释成与现实世界彻底隔绝，同时保留其来源和性质上的张力。
- issue: Ἰουδαῖοι在本节中的所指
  choice: 正文译“犹太人”，脚注保留“犹太地人”及“犹太当局”的语境可能
  alternative: 正文直接译“犹太地人”或“犹太当局”
  rationale: 希腊词本身具有较宽的指称范围，而当前叙事背景可能指向较具体的犹太领袖。正文不作过度限定，脚注则帮助读者看见语境中的较窄解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“源于”突出来源，“臣仆”与“国”的王权语境协调；整体保留原文反事实条件句、目的从句和结尾指示语的结构。
