  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: zh_hans
  text: 于是，犹大带着一队士兵[a]，以及祭司长和法利赛人派来的差役[b]，来到那里；他们带着灯笼、火把和武器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一队士兵”所译的希腊词也可译作“一个营”或“一支分队”；这里不一定表示整营士兵全部出动。
    reason: lexical_alternative
  - marker: b
    text: “差役”也可译作“卫兵”或“圣殿警卫”，指为犹太宗教当局办事的官方属员。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推动叙事，既保留连接作用，又符合现代汉语叙事习惯。
- source_word: λαβὼν
  choice: 带着
  rationale: 表达犹大先召集或带上这些人，随后来到那里的动作关系；比生硬直译为“拿了”更自然。
- source_word: σπεῖραν
  choice: 一队兵
  rationale: 该词可指罗马军队的一个营，也可泛指其中一支分队；“一队兵”保留军事性质，同时不暗示整营全部出动。
- source_word: ὑπηρέτας
  choice: 差役
  rationale: 在此指听命于犹太宗教当局的官方随员或执勤人员；“差役”体现其公务身份，又不把具体职能限定为圣殿警卫。
- source_word: ἀρχιερέων
  choice: 祭司长
  rationale: 这是该复数形式在此历史语境中的标准译法，指祭司阶层的领袖人物。
- source_word: Φαρισαίων
  choice: 法利赛人
  rationale: 采用现代中文圣经与历史文献中通行的群体名称。
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文使用叙事现在时以增强现场感；现代汉语不必标明时态，“来到”能自然呈现其抵达动作。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 照应上文已经提及的地点。
- source_word: φανῶν
  choice: 灯笼
  rationale: 指可携带的照明器具，与后面的“火把”形成原文中的词义区别。
- source_word: λαμπάδων
  choice: 火把
  rationale: 该词常指燃烧的火炬；译作“火把”可与“灯笼”清楚区分。
- source_word: ὅπλων
  choice: 武器
  rationale: 概括用于武装行动的器械，现代汉语清楚自然。
theological_decisions:
- issue: 拘捕队伍的身份与构成
  choice: 译为“一队兵”与“祭司长和法利赛人派来的差役”，呈现军事人员和犹太宗教当局属员共同参与。
  alternative: 可译为“一个营”和“卫兵”或“圣殿警卫”。
  rationale: 原文分别提到 σπεῖρα 和来自祭司长、法利赛人的 ὑπηρέται，应保留两类人员的构成；但经文本身没有明确说明整营人数全部到场，也没有把差役的职能严格限定为圣殿警察。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”保持叙事衔接；“一队兵”避免因技术性军制称谓而误导人数；“差役”保留官方执行人员的宽泛含义。灯笼、火把、武器三个并列项均按原文呈现。
