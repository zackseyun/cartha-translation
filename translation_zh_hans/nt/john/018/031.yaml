  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: zh_hans
  text: 于是，彼拉多对他们说：“你们自己把他带走，按照你们的律法审判他吧。”犹太人[a]对他说：“我们不可以处死任何人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“犹太人”；此处按上下文是指在彼拉多面前控告耶稣的犹太当权者或控告者，并非泛指全体犹太人。
    reason: 说明语境所指，避免把原文误解为对整个犹太民族的概括。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事，也保留一定的逻辑承接意味；现代汉语中自然庄重。
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: 你们自己把他带去
  rationale: “你们自己”体现显明主语ὑμεῖς所带的强调；“把他带去”自然表达命令语气及彼拉多让对方自行处理的意思。
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: 按照你们的律法
  rationale: 准确表达κατά在此所指的准则或标准，并保留彼拉多与该律法之间的距离感。
- source_word: κρίνατε αὐτόν
  choice: 审判他
  rationale: 保留κρίνω宽泛而明确的司法含义，不把它过度限定为某一种具体审讯程序。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 正文依照希腊文的正式表达翻译，同时用脚注说明此处语境中特指在彼拉多面前控告耶稣的犹太当权者或控告者，并非全体犹太人。
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: 我们无权
  rationale: 在司法语境中自然表达“不被许可、没有合法权限”的含义；比单纯“不能”更清楚地体现法律权限，而不断言其背后的具体法制原因。
- source_word: ἀποκτεῖναι οὐδένα
  choice: 处死任何人
  rationale: “处死”符合本段司法处决的语境，又避免把ἀποκτεῖναι过度技术化为特定执行程序；“任何人”保留οὐδένα的普遍范围。
theological_decisions:
- issue: 约翰福音中οἱ Ἰουδαῖοι在本节的所指
  choice: 正文译作“犹太人”，并用脚注按上下文限定其所指
  alternative: 犹太当权者；犹太人的领袖；犹太地人
  rationale: 这样既保留原文的措辞和约翰叙事中的词汇张力，也防止读者误以为这里是在笼统指责全体犹太民族。当前场景明确指向在彼拉多面前控告并与他交涉的群体。
- issue: Ἡμῖν οὐκ ἔξεστιν所表达的限制性质
  choice: 译作“我们无权”
  alternative: 我们不可以；律法不准我们；我们没有获准
  rationale: 原文说明他们没有这样做的许可或合法权限，却没有在本句中明说限制究竟来自罗马政权、犹太律法，还是当时的具体司法安排。“无权”保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“律法”“审判”“处死”符合司法语境；“你们自己”体现原文强调。正文保留“犹太人”的原文形式，并以脚注澄清具体所指。
