  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: zh_hans
  text: 他们先把耶稣带到亚那那里，因为亚那是该亚法的岳父；该亚法正是那一年的大祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: 押到
  rationale: ἄγω可指“带领、带去”。此处耶稣在被捕后由武装人员看押转送，用“押到”自然表达受拘押的语境，同时保留移动含义；宾语“耶稣”由上文承接，在中文中明说更清楚。
- source_word: πρὸς Ἅνναν
  choice: 到亚那那里
  rationale: πρός加宾格表示朝向某人而去；“到亚那那里”准确而自然，不把它解释为正式受审。
- source_word: πρῶτον
  choice: 先
  rationale: πρῶτον在此作副词，表示行动次序；现代汉语用“先”最为顺畅。
- source_word: πενθερός
  choice: 岳父
  rationale: πενθερός特指妻子的父亲，因此译作“岳父”比泛称姻亲更精确。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: 这是犹太大祭司职分的惯常、准确中文名称。
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: 那一年的
  rationale: 该属格短语修饰“大祭司”；“那一年的大祭司”保留约翰的时间限定，也符合现代中文。
- source_word: Ἅνναν
  choice: 亚那
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: Καϊάφα
  choice: 该亚法
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: “那一年的大祭司”所指是谁
  choice: 明确指该亚法
  alternative: 若按中文线性表达不加处理，可能被误解为指亚那
  rationale: 希腊文关系代词ὃς最自然地指向紧邻的先行词Καϊάφα。采用两个分句，并在后一分句重提“该亚法”，避免中文产生原文没有的指代歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“押到”体现被捕后在看押中转送的情境；以分号连接亲属关系与职分说明，使信息层次清楚。
