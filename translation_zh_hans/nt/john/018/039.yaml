  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: zh_hans
  text: 你们有个惯例，就是我会在逾越节给你们释放一个人。因此，你们要我释放犹太人的王[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的王。”希腊语Ἰουδαῖοι可按语境指“犹太人”或“犹太地人”；这里是受难叙事中反复使用的固定称号。
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: 惯例
  rationale: 表示群体中已经确立的做法；“惯例”比偏重个人行为的“习惯”更适合节期与司法语境。
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: 我要给你们释放一个人
  rationale: 该从句说明惯例的具体内容；ἕνα本义为“一个”，现代汉语在此补出“人”更自然，也不额外限定获释者身份。
- source_word: ἀπολύω
  choice: 释放
  rationale: 准确表达官长解除囚犯拘禁的司法行为，并使本节两次出现的动词译法一致。
- source_word: ἐν τῷ πάσχα
  choice: 每逢逾越节
  rationale: 结合“惯例”这一反复实行的做法，以“每逢”自然表达在逾越节期间按例施行之意；没有把时间范围过度限定为某一日。
- source_word: βούλεσθε οὖν
  choice: 那么，你们要……吗
  rationale: “那么”体现οὖν承接前述惯例而作出的推论，“要……吗”以自然现代汉语表达意愿询问。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: “犹太人的王”
  rationale: 保留受难叙事中作为称号或指控用语的固定表达；引号显示这是彼拉多对耶稣所用的称谓，而非译者自行作出的认信。
theological_decisions:
- issue: 称号τὸν βασιλέα τῶν Ἰουδαίων中Ἰουδαίων的译法
  choice: “犹太人的王”
  alternative: “犹太地人的王”
  rationale: 在约翰受难叙事中，这一短语是加在耶稣身上的王权或弥赛亚性称号与指控。“犹太人”保留该固定称号的历史与叙事功能；同时以脚注说明Ἰουδαῖοι也可能按地域理解，以免抹去词义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不过”承接上文并表达轻微转折；冒号清楚引出惯例的内容。用“每逢逾越节”使节期惯例在汉语中顺畅明确；称号加引号，避免不必要的大写问题并保留说话场景。
