- from: 不过，你们有个惯例：每逢逾越节，我要给你们释放一个人。那么，你们要我给你们释放“犹太人的王”吗？[a]
  to: 你们有个惯例，就是我会在逾越节给你们释放一个人。因此，你们要我释放犹太人的王[a]吗？
  rationale: 修订以更自然的现代标准汉语表达彼拉多所说的既有惯例，并使οὖν的推论关系清晰。正文仍忠实保留“犹太人的王”这一叙事中的固定称号；脚注保留Ἰουδαῖοι的地域性替代理解。
