  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: zh_hans
  text: 于是，他们又高喊道：“不要这个人，要巴拉巴！”巴拉巴是个强盗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匪徒”。此希腊词可指强盗、匪徒或拦路抢劫者；在某些语境中也可指参与暴力反抗的人。
    reason: 保留λῃστής的词义范围，避免正文把巴拉巴的身份过度限定为普通盗贼或政治叛乱者。
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: 高喊
  rationale: 此动词表示大声呼喊；“高喊”既保留声音强烈的语气，也符合现代汉语表达。
- source_word: οὖν
  choice: 于是
  rationale: οὖν承接前文的交涉并引出众人的回应；“于是”自然呈现这一叙事推进关系。
- source_word: πάλιν
  choice: 又
  rationale: 直接表达动作再次发生，简洁自然。
- source_word: λέγοντες
  choice: 道
  rationale: 与“高喊”合译为“高喊道”，既体现其引出直接引语的功能，又避免汉语中生硬的“高喊说”。
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: 不要这个人，要巴拉巴
  rationale: “这个人”保留τοῦτον的指示意味；用“不要……要……”自然表达希腊文“不是这个，而是……”的省略式选择。
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: 巴拉巴
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: ἦν δὲ
  choice: 原是
  rationale: δέ在此引入关于巴拉巴的背景说明；“原是”简洁地标示补充解释。
- source_word: λῃστής
  choice: 强盗
  rationale: 该词的基本义为抢劫者或匪徒；“强盗”是普通读者易懂且不过度限定其政治身份的对应词。
theological_decisions:
- issue: λῃστής对巴拉巴身份的描述范围
  choice: 强盗
  alternative: 匪徒；暴力叛乱者
  rationale: 本节所用词首先可指强盗或匪徒，在某些一世纪犹太地区的语境中也可能带有暴力反抗者的含义。但本节本身不足以确定其政治身份，因此正文采用核心词义，并以脚注保留较宽的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“高喊道”自然整合动词与分词；“不要这个人，要巴拉巴”保持群众呼喊的直接和强烈。脚注标记紧随“强盗”，与所解释的词对应。
