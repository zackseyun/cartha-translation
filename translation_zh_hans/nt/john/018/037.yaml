source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: zh_hans
  text: 于是，彼拉多对他说：“这么说，你是王了？”耶稣回答：“你说我是王。[a]我为此而生，也为此来到世上，为要给真理作见证。凡是出于真理的人，都听我的声音。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你说得对，我是王”；也可理解为：“这是你说的：我是王。”希腊文表达简练，可视为有所保留的肯定。
    reason: 原文语气具有真实歧义；脚注保留主要可能解释，而正文不作过度判定。
lexical_decisions:
- source_word: Οὐκοῦν
  choice: 这么说
  rationale: 表达彼拉多根据上文作出推论的语气，比单纯的“那么”更清楚，同时保持自然口吻。
- source_word: βασιλεὺς
  choice: 王
  rationale: 这是本语境中对 βασιλεύς 最直接的译法，既保留罗马审讯中的政治含义，也保留潜在的弥赛亚含义。
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: 你说我是王
  rationale: 贴近希腊文简练而略带省略的表达，不将其强行解释为直截了当的承认或疏离式的否认。
- source_word: γεγέννημαι
  choice: 我为此而生
  rationale: 中文不宜机械复制希腊文完成时；“而生”自然表达出生及其持续相关的使命意义，且不引入本段未明说的神学术语。
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: 来到世上
  rationale: 保留“出生”与“来到世上”两个不同分句，也保留约翰文本中可能涉及使命与来源的意味。
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: 给真理作见证
  rationale: 保留约翰福音中的法庭与见证用语；“给……作见证”是清楚而庄重的现代汉语。
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: 凡是出于真理的人
  rationale: “出于”较直接地保留 ἐκ 所表达的来源或归属关系，而不将它完全解释成“属于”。
- source_word: ἀκούει μου τῆς φωνῆς
  choice: 都听我的声音
  rationale: 既可包含实际听见，也可暗示接受和响应，并保留“我的声音”与约翰福音牧人意象之间的呼应。
theological_decisions:
- issue: 耶稣回答彼拉多时“Σὺ λέγεις ὅτι βασιλεύς εἰμι”的语气
  choice: 正文译作“你说我是王”，保留有所限定的肯定及其含混性
  alternative: 可明确译成“你说得对，我是王”，也可理解为“这是你说的：我是王”
  rationale: 希腊文并未明说强烈肯定或否认。正文贴近原句结构，脚注说明可能语气，以免消解经文本身的张力。
- issue: “我为此而生”与“为此来到世上”的使命语言
  choice: 将两个分句分别保留
  alternative: 合并意译为一句总体使命宣言
  rationale: 原文有意并列出生与来到世上；分别翻译可保留其潜在的道成肉身与使命意味，又不额外加入教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这么说”体现审问中的推论语气；“为此而生”“作见证”“出于真理”保留原文的重复、法庭意象及约翰式来源语言。
