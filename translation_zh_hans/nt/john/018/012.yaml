  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: zh_hans
  text: 于是，那队士兵、指挥官和犹太人[a]的差役拘捕了耶稣，把他捆绑起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太领袖”或“犹太地人”，须按上下文理解；约翰所说的“犹太人”，往往比整个犹太民族的范围更特定。
    reason: 保留原文可能的指称范围，并防止读者把该称谓一概理解为所有犹太人。
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前一场景并推进叙事；“于是”自然地保留了连接和结果意味。
- source_word: σπεῖρα
  choice: 那队士兵
  rationale: 该词在此指一支有组织的军队单位；这样既表达军事性质，又避免让现代读者误以为经文明确交代了完整编制或人数。
- source_word: χιλίαρχος
  choice: 指挥官
  rationale: 指统率这支军队的高级军官。“指挥官”清楚易懂，也比音译或古制官衔更适合现代普通读者。
- source_word: ὑπηρέται
  choice: 差役
  rationale: 本处指隶属有关犹太权力机构、参与拘捕行动的公务人员，而非家仆；“差役”保留其受命执行公务的身份，又不把他们过度具体化为某一种警卫。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 按希腊文保留属格表达，不在正文中直接限定为“犹太领袖”或改作“犹地人”；脚注说明约翰语境中可能有较窄的指向。
- source_word: συνέλαβον
  choice: 拘捕了
  rationale: 该动词表示抓住并控制；在本段正式逮捕的语境中，“拘捕”兼顾动作及带走看管之意。
- source_word: ἔδησαν
  choice: 把他捆绑起来
  rationale: 直接表达将耶稣捆住的动作，语言自然，并保留原文动作的具体性。
theological_decisions:
- issue: 《约翰福音》中 τῶν Ἰουδαίων 的指称范围
  choice: 正文译作“犹太人的”
  alternative: “犹太领袖的”或“犹地人的”
  rationale: 原文在本节没有明说是全体犹太人、犹太领袖，还是犹地人。正文保留原词的广度，脚注提醒读者约翰常按语境用该称谓指较特定的群体，以避免把责任不当地扩大到整个犹太民族。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那队士兵”与“指挥官”清楚表达军事背景；“差役”体现受权执行公务的身份。脚注标记紧随“犹太人”，使注释对象明确。
