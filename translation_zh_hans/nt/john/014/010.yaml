id: JHN.14.10
reference: John 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: zh_hans
  text: 你不信我在父里面，父也在我里面吗？我对你们所说的话，并不是我凭自己说的[a]；而是住在[b]我里面的父成就他自己的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是出于我自己说的。”原文可表示并非出于自己的主动或权柄。
    reason: lexical_alternative
  - marker: b
    text: 或译：“常在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: 信
  rationale: 采用约翰福音中 πιστεύω 的常用译法“信”，既自然，也保留本书反复出现的关键词联系。
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: 在父里面……在我里面
  rationale: 直译介词 ἐν，保留父与子彼此内住的关系性表达，不改写为“与……合一”等解释性措辞。
- source_word: ῥήματα
  choice: 话
  rationale: “话”是现代汉语中自然、直接的表达，适合此处所说的话语内容。
- source_word: λέγω ... λαλῶ
  choice: 所说的话……说的
  rationale: 汉语若强行分别译为“说”和“讲”会显得生硬；在同一句中自然地用“说”表达二者，同时借句法呈现内容与说话行动。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 凭自己
  rationale: “凭自己”在现代汉语中自然，可涵盖不凭自己的主动、来源或权柄之意；脚注保留较贴近形式的另一译法。
- source_word: μένων
  choice: 住在
  rationale: “住在”清楚表达 μένω 的持续内住含义；脚注列出约翰文献中常见的“常在”译法。
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: 行他的作为
  rationale: “行……作为”比“做他的工作”更符合现代汉语搭配，并保留 ἔργον 在约翰福音中兼具行动与神学意味的用法；“他的”明确反映 αὐτοῦ。
theological_decisions:
- issue: 父与子的彼此内住
  choice: 保留“我在父里面，父也在我里面”的原文结构。
  alternative: 我与父合一，父也与我合一。
  rationale: 原文使用彼此“在……里面”的关系语言；直译可保留其基督论分量和表达上的张力，而不以其他经文或后期教义术语替换。
- issue: 耶稣话语与作为中的主体关系
  choice: 译为“并不是我凭自己说的；而是住在我里面的父在行他的作为”。
  alternative: 我不是靠自己的权柄说话；住在我里面的父借着我行事。
  rationale: 所选译文既保留子不“凭自己”说话的经文表述，也明确以父为后半句的行动主体；不添加“借着我”，以免超出本句明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你”对应单数 πιστεύεις，“你们”对应复数 ὑμῖν；通过问句与分号保留原句的论证推进。
