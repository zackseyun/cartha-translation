id: JHN.14.21
reference: John 14:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: zh_hans
  text: 凡有我的命令并遵守的人，就是爱我的人；爱我的人必蒙我父所爱，我也要爱他，并向他显明我自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文使用阳性单数形式，但在这里具有代表性，泛指任何有并遵守耶稣命令的人；末句也可译作“向他显示我自己”。
    reason: 说明原文的代表性阳性单数，并保留ἐμφανίζω可表示“显示”的词义选择。
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: 有我的命令的
  rationale: 定冠词加现在分词构成实体性表达，指具有代表性的个体；“有我的命令”贴近原文结构，也保留领受并持守这些命令的含义。
- source_word: τηρῶν αὐτά
  choice: 遵守这些命令
  rationale: τηρέω在约翰福音中可指遵守、持守或谨守；“遵守”在现代汉语中自然，并准确表达对命令的忠实实行。正文因上下文清楚而省去重复宾语，译作“又遵守”。
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: 那人就是爱我的
  rationale: ἐκεῖνος带有强调作用；“那人就是”自然地保留了这种明确指认，而不额外加入因果或功德含义。
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: 爱／必蒙……所爱／要爱
  rationale: 连续使用“爱”保留ἀγαπάω词族在本节中的刻意重复及其神学分量。
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: 必蒙我父所爱
  rationale: 保留将来被动语态以及“我父”的父子关系用语；“蒙……所爱”庄重且符合现代中文圣经语体。
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ由καί与ἐγώ缩合而成；“我也”清楚表达耶稣的行动与父的行动相应。
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: 向他显明我自己
  rationale: ἐμφανίζω可指使人看见、使人认识或揭示；“显明我自己”保留个人自我启示的广度，也不把意思限定为肉眼可见的显现。
- source_word: αὐτόν / αὐτῷ
  choice: 他／向他
  rationale: 原文使用与阳性单数实体性分词呼应的代词，并具有代表性泛指作用；中文正文保留单数“他”，脚注说明其范围不限于男性。
theological_decisions:
- issue: 爱与遵守命令之间的关系
  choice: 译成身份上的明确指认：“那人就是爱我的”
  alternative: “遵守命令证明他爱我”或“遵守命令使他配得上帝的爱”
  rationale: 希腊文将拥有并遵守命令的人等同于爱耶稣的人，却没有明确说明功德、赚取或逻辑因果；译文保留这种紧密联系而不替经文解决其神学张力。
- issue: 父与子的爱
  choice: 保留“必蒙我父所爱，我也要爱他”的并列陈述
  alternative: 将其解释为顺服所赚得的回报
  rationale: 原文陈述父与子对爱耶稣之人的爱，却没有使用“赚取”或“配得”等语言，因此不作教派性补充。
- issue: 耶稣自我显明的性质
  choice: “向他显明我自己”
  alternative: “让他看见我”
  rationale: 上下文可以涉及个人性的自我启示，不必限于可见的身体显现；“显明”保留语义范围和可能的张力。
- issue: 阳性单数的代表性用法
  choice: 正文用“他”，脚注说明代表性泛指
  alternative: 正文改用复数“他们”或中性化的“那个人”
  rationale: 这样既对应原文阳性单数形式，也明确该形式泛指任何符合条件的人，而非仅限男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“命令”比“诫命”更直接对应ἐντολή在此处耶稣所吩咐之事；“蒙我父所爱”和“显明我自己”维持经文语体的庄重感。
