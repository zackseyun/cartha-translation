  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: zh_hans
  text: 我实实在在地告诉你们：信我的人，我所做的事，他[b]也要做；并且他还要做比这些更大的事[a]，因为我要到父那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更大的事”也可译作“比这些更大的作为”。希腊原文从上一分句承接“事／作为”，却没有在这里再次明说。
    reason: lexical_alternative
  - marker: b
    text: 原文“信我的人……他”采用语法上的阳性单数作泛指，指任何信徒，并非只指男性。
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: 我实实在在地告诉你们
  rationale: 以现代汉语中庄重而自然的固定表达传达双重“阿们”的郑重强调；“实实在在”保留重复所形成的语气。
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: 信我的人
  rationale: 自然表达带冠词的现在分词所指的代表性个体，并符合约翰福音中 πιστεύω εἰς 的常用含义。
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: 我所做的事
  rationale: “事”在中文中比“工作”更自然，也可涵盖耶稣的行动、神迹与作为；不将其意义限定为某一种类别。
- source_word: κἀκεῖνος ποιήσει
  choice: 他也要做
  rationale: “也”体现 κἀκεῖνος 中附加的强调，“要做”保留将来时意义，并与前面的“做”保持词汇呼应。
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: 并且他还要做比这些更大的事
  rationale: 从前句补出希腊文省略的中性复数所指，使现代汉语完整自然；“更大的”保持开放，不说明究竟在哪一方面更大。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达该连接词在这里的因果作用。
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: 我要到父那里去
  rationale: 以近将来表达语境中的现在时 πορεύομαι，并保留原文“父”而不增添“我的”。
theological_decisions:
- issue: “比这些更大的事”的具体含义
  choice: 保持宽泛，只陈述信徒将做比耶稣所做的这些事更大的事，而其原因与耶稣到父那里去有关。
  alternative: 解释为福音传播范围更广、救赎历史意义更大，或教会借圣灵所行的事。
  rationale: 本节没有说明“大”是指能力、范围、数量还是救赎历史意义，因此正文不加入限定性的解释。
- issue: “信我的人……他”的指称范围
  choice: 采用汉语代表性单数“信我的人……他”。
  alternative: 译作“凡信我的人……他们”，以复数形式突出泛指。
  rationale: 原文以阳性单数分词和代词表达泛指的任何信徒；保留单数结构，同时以脚注说明这里并不限于男性。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我实实在在地告诉你们”保留约翰福音郑重宣告的语气；分号呈现两个相关应许之间的推进关系。所有解释性补充均限于必要的汉语表达和脚注，不预先界定“更大的事”的神学含义。
