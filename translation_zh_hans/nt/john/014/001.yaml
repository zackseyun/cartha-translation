  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: zh_hans
  text: 你们心里不要忧愁。要信[b]上帝，也要信我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们信上帝，也要信我。”希腊语πιστεύετε既可作陈述语气（“你们信”），也可作命令语气（“要信”）。
    reason: alternative_reading
  - marker: b
    text: “信”也可译作“信靠”；这里的动词既可表示相信，也可含有信赖、倚靠的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: 不要忧愁
  rationale: μή加现在时被动命令语气构成禁止或劝止；中文用“不要忧愁”自然表达其劝勉语气。ταράσσω在这里指内心受搅扰、不安，“忧愁”既庄重又不把含义限缩为恐惧或焦虑。
- source_word: ὑμῶν ἡ καρδία
  choice: 你们心里
  rationale: 原文以复数“你们的”修饰单数“心”，具有集体意味。现代中文“你们心里”既可自然地向一群人说话，也保留内在心志的含义，无须生硬地逐字译成“你们的心”。
- source_word: πιστεύετε
  choice: 要信
  rationale: πιστεύω可表示相信、信靠。主文选“信”，直接而简洁，并以“要”表明所采用的命令语气；其信靠意味及形态上的陈述语气可能性均在脚注保留。
- source_word: εἰς τὸν θεόν
  choice: 信上帝
  rationale: πιστεύω与εἰς连用，表示将信心或信靠指向某对象。中文“信上帝”自然传达这种关系性用法，不机械翻出介词。
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: 也要信我
  rationale: “也”体现καί的附加和并列作用；重复“要信”保留原文两个分句的平行结构，并突出上帝与耶稣同为信靠所指向的对象。
theological_decisions:
- issue: 两处πιστεύετε是陈述语气还是命令语气
  choice: 两处均按命令语气译为“要信上帝，也要信我”
  alternative: “你们信上帝，也要信我”
  rationale: πιστεύετε的直陈语气与命令语气第二人称复数形式相同，原文确有歧义。上下文是安慰并劝勉门徒，开头的禁止命令也自然接续两个劝勉，因此主文采用命令语气；同时以脚注保留第一处按陈述语气理解的可能，不消除原文的张力。
- issue: πιστεύω的认知性与信靠性
  choice: 主文用“信”
  alternative: “信靠”
  rationale: “信”可涵盖相信与倚赖，且能简洁保留原文；“信靠”更明确强调关系性的倚赖，作为词义替代在脚注说明。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“你们心里不要忧愁”比逐字式的“不要让你们的心受搅扰”更符合中文表达；分号式长句改为两个短句，以清楚呈现安慰与劝勉。脚注标记均置于所说明的相应语句之后。
