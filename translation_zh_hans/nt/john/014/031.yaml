source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: zh_hans
  text: 但为了让世人知道我爱父亲，我就照父亲所命令我的去做。[a]起来，我们离开这里吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种断句译：“但我照父亲所命令我的去做，为了让世人知道我爱父亲。”
    reason: 原文在目的从句与“正如……我也如此行”的对应结构之间可作不同断句；此译法将顺服父亲的行动明确理解为使世人知道耶稣爱父亲的途径。
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 保留与上文相接的转折意味，同时符合现代汉语表达。
- source_word: ἵνα γνῷ
  choice: 为要让……知道
  rationale: ἵνα加虚拟语气在这里表达目的；“为要让”既清楚又保留目的意味。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 此处κόσμος主要指世上的人类群体；“世人”比“世界”更自然地作“知道”的主体，同时保留约翰语境中的整体意味。
- source_word: ἀγαπῶ τὸν πατέρα
  choice: 我爱父
  rationale: 直译现在时的ἀγαπῶ，并保留原文没有物主代词的称号“父”。
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: 父怎样命令我，我就怎样做
  rationale: 以“怎样……就怎样……”对应καθὼς…οὕτως的呼应结构，并保留ἐντέλλομαι较强的“命令”语力。
- source_word: Ἐγείρεσθε
  choice: 起来
  rationale: 这是对多人发出的命令；“起来”自然、简洁，也适合庄重叙事。
- source_word: ἄγωμεν ἐντεῦθεν
  choice: 我们离开这里吧
  rationale: “……吧”自然表达第一人称复数劝勉式，ἐντεῦθεν则译为“这里”。
theological_decisions:
- issue: 约翰福音中πατήρ所表达的关系称号
  choice: 父
  alternative: 我的父
  rationale: 原文有定冠词，却没有明确的第一人称物主代词；译作“父”不作扩充，并保留父与子关系的原文表述。
- issue: ἐντέλλομαι描述父与子的关系时的语力
  choice: 命令
  alternative: 吩咐
  rationale: 该动词表示下令或郑重嘱咐。译作“命令”不因神学顾虑削弱原文所强调的耶稣顺服，同时不对父子的本质关系作额外解释。
- issue: ἵνα目的从句与随后καθὼς…οὕτως结构的句法关系
  choice: 把爱父和照父命令而行一并置于世人所要知道的内容中
  alternative: 把“照父的命令去做”理解为达到“让世人知道我爱父”这一目的的行动
  rationale: 希腊文的连接与省略容许不同的标点和句法划分；正文贴近词序，脚注保留另一种自然理解，避免把真正的歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父怎样命令我，我就怎样做”保留原文对应结构；末句用“吧”自然表达共同离开的劝勉。
