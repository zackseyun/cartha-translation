revisions:
- from: 但为要让世人知道我爱父，并且父怎样命令我，我就怎样做。[a]起来，我们离开这里吧！
  to: 但为了让世人知道我爱父亲，我就照父亲所命令我的去做。[a]起来，我们离开这里吧！
  rationale: 修订以“我就照父亲所命令我的去做”明确表达καθὼς…οὕτως的对应，并把该行动与ἵνα目的从句的关系在现代汉语中清晰化。将“父”调整为“父亲”只改善自然度，不添加“我的”或改变其称号功能。保留脚注以呈现原文可有的另一种句法／标点理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:12Z'
review_pass:
  verdict: revise
  source_fidelity: 正文对希腊文的主要成分译得准确：ἀλλά的转折、ἵνα的目的、κόσμος所指的人类整体、καθὼς…οὕτως的对应、复数命令和劝勉均有体现。惟“父怎样命令我，我就怎样做”若置于“让世人知道”的宾语内容中，在汉语中易成为世人所知的第二项陈述；原文更自然的句法是：耶稣照父所命令的而行，其目的在于让世界知道他爱父。应以语序清楚呈现此目的—行动关系。
  naturalness: “我爱父”在现代标准汉语的圣经庄重语体中可理解，但“我爱父亲”更自然且不增加物主代词；“但为要让”略显叠加。以“但为了让世人知道我爱父亲”更流畅。“起来，我们离开这里吧！”自然。
  terminology: πατήρ在此为称号，中文“父亲”可保留称号性且比孤立的“父”自然。ἐνετείλατο应保留较强的“命令”；“照父亲所命令我的去做”忠实且通顺。κόσμος译“世人”在本节作“知道”的主体恰当。
