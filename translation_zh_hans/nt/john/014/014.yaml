id: JHN.14.14
reference: John 14:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: zh_hans
  text: 你们若奉我的名向我求什么[a]，我就会成就。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“你们若奉我的名求什么，我就会成就。”没有“向我”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: 若
  rationale: 引出条件从句；“若”简洁、庄重，也符合现代汉语经文语体。
- source_word: τι
  choice: 什么
  rationale: 在“若……求什么”的条件结构中，自然表达不定且开放的范围；无需机械译成“任何东西”。
- source_word: αἰτήσητέ
  choice: 求
  rationale: 这是由ἐάν支配的第二人称复数不定过去时主动虚拟式。“你们若……求”自然表达条件意义，也保留祈求、请求的语义。
- source_word: με
  choice: 向我
  rationale: SBLGNT正文含直接宾语代词με。汉语用“向我求”比“求我”更自然，并明确保留请求所指向的对象。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: “奉……的名”是现代汉语中自然且庄重的表达，保留与耶稣的名、权柄和身份相关的含义，而不在正文中作过度阐释。
- source_word: ἐγὼ
  choice: 我
  rationale: 保留希腊文明确出现的第一人称主语；汉语无需另加“亲自”等强化词，以免过译。
- source_word: ποιήσω
  choice: 就会成就
  rationale: 表达第一人称单数将来陈述。“成就”自然承接所求之事，并比单说“做”更符合此处语境；“会”表达将来的应许而非能力。
theological_decisions:
- issue: 约翰福音14:14中με（“我”）是否属于正文，以及请求是否明确向耶稣提出
  choice: 正文译作“向我求”，明确翻出με
  alternative: “你们若奉我的名求什么，我就会成就。”
  rationale: 所给SBLGNT正文含με，应按原文证据在正文中译出。由于部分抄本省略该词，而这会影响经文是否明确说请求是向耶稣提出，因此在脚注中透明保留异文，不进一步替文本作教义推论。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“若”保持经文语体但不晦涩；“奉我的名”沿用已被广泛理解的汉语表达；“向我求什么”避免生硬的“求我任何事”，同时准确保留με。
