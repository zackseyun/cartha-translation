  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: zh_hans
  text: 你们奉我的名无论求什么，我必成就这事，好让父在子身上[a]得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着子。”希腊文直译为“在子里”，可表示父得荣耀的范围或途径。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: 无论……什么
  rationale: 关系代词与ἄν构成不定表达，表示开放而广泛的范围；“无论……什么”自然地保留这一语气。
- source_word: αἰτήσητε
  choice: 你们……求
  rationale: 该动词在此指祈求；“求”符合祷告语境，也借“你们”明确表达第二人称复数。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: “奉我的名”是现代汉语中自然且庄重的圣经表达，可涵盖代表、权柄及与耶稣相合等意义，而不把短语限缩为单一解释。
- source_word: τοῦτο
  choice: 这事
  rationale: 明确译出希腊文指示代词，并回指前面的祈求内容。
- source_word: ποιήσω
  choice: 我必成就
  rationale: 在回应祈求的语境中，“成就”比直译为“做”更自然；“必”传达直陈将来时的确定语气。
- source_word: ἵνα
  choice: 好让
  rationale: 自然清楚地表达ἵνα所引出的目的。
- source_word: δοξασθῇ
  choice: 得荣耀
  rationale: 保留δοξάζω的“荣耀”用语，并以自然的汉语被动意义表达“被荣耀”。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文是特指的“父”，没有“我的”；汉语中的“父”在此可自然用作独特的神圣称谓。
- source_word: ἐν τῷ υἱῷ
  choice: 在子里面
  rationale: 尽量保留介词ἐν的空间或范围意象，不在正文中将其单一解释为“借着”；“子”也对应原文带冠词的独特称谓。
theological_decisions:
- issue: “奉我的名”的含义
  choice: 正文保留为“奉我的名”，不作解释性扩写。
  alternative: 凭我的权柄；与我联合；按照我的品格和旨意
  rationale: 约翰福音中的这一表达具有代表、关系、权柄和一致性等多重内涵；保留惯用表达可避免把经文限定为某一种教义解释。
- issue: ἐν τῷ υἱῷ的语义作用
  choice: 译为“在子里面”。
  alternative: 借着子
  rationale: ἐν在这里可表达父得荣耀的范围，也可能带有途径或媒介意味。正文保留较贴近原文且具有张力的表达，另一可能译法收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉我的名”符合当代汉语圣经语体；“我必成就这事”既明确保留τοῦτο，也避免“我必做这事”在祈求语境中的生硬感。脚注标记置于其实际说明的“在子里面”之后。
