id: JHN.14.22
reference: John 14:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: zh_hans
  text: 犹大（不是加略人犹大）对他说：“主啊，发生了什么事，以致你打算向我们显明自己[a]，却不向世界显明呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明自己”也可译作“使我们认识你”或“向我们显现”。
    reason: ἐμφανίζειν σεαυτόν既可侧重使人认识，也可侧重使人看见或显现；脚注保留其词义幅度。
lexical_decisions:
- source_word: λέγει
  choice: 对他说
  rationale: 希腊文使用叙事性现在时；现代汉语叙事不必标明时态，用“对他说”自然表达当时的发言。
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: 犹大（不是加略人犹大）
  rationale: 保留原文的同名辨别，明确这位犹大不是后来出卖耶稣的加略人犹大。
- source_word: Κύριε
  choice: 主啊
  rationale: “主”保留κύριος作为对耶稣的尊称及其神学分量；“啊”符合现代汉语直接称呼的语气。
- source_word: τί γέγονεν
  choice: 发生了什么事
  rationale: γίνομαι的完成时指向已经发生并造成当前局面的事情；此译自然保留“为何出现这种变化”的疑问。
- source_word: ὅτι
  choice: 以致
  rationale: 这里引出前面疑问所涉及的结果或情势：“发生了什么事，以致……”。“以致”在汉语中清楚连接这两层意思，而不强行把ὅτι定为单纯原因。
- source_word: μέλλεις
  choice: 打算
  rationale: μέλλω与不定式连用，可表达将来的意向或即将发生之事；“打算”贴合门徒追问耶稣为何选择这样自我启示的语境，同时不夸大紧迫性。
- source_word: ἐμφανίζειν σεαυτόν
  choice: 显明自己
  rationale: 兼顾“使可见”和“使人认识”的语义范围，也保留反身代词的力量；比生硬的“彰显你自己”更符合现代汉语。
- source_word: κόσμῳ
  choice: 世界
  rationale: 保留约翰著作中κόσμος反复出现的核心用语，不在正文中把它限定为“世人”或“不信的世人”。
theological_decisions:
- issue: 约翰著作中κόσμος的含义
  choice: 世界
  alternative: 世人；不信的世界体系
  rationale: 本节中的κόσμος可能侧重世界上的人，也带有约翰所述与耶稣相对的世界秩序之意味。译作“世界”保留其广度和神学张力，由上下文进一步界定。
- issue: 耶稣“显明自己”的方式
  choice: 不具体说明是可见的显现还是使人认识他的启示
  alternative: 显现给我们看；让我们认识你
  rationale: ἐμφανίζω容许可见与认知两方面的含义；正文“显明自己”保留这种开放性，避免预先判定耶稣所说启示的具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问句保留原文“发生了什么事，以致……”的结构与门徒的不解；“世界”沿用约翰著作的关键神学词汇，不作解释性扩写。
