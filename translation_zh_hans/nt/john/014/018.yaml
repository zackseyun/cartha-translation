  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: zh_hans
  text: 我不会撇下你们，让你们像孤儿一样[a]；我正要到你们这里来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不会使你们成为孤儿。”希腊文使用的是孩子失去父母照顾的形象。
    reason: lexical_alternative
  - marker: b
    text: “我正要到你们这里来”可能指耶稣复活后向门徒显现、借着圣灵来到，或将来的再来；希腊文本身没有限定为其中一种。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: 撇下
  rationale: 这里的将来时动词表示把人留下、使其处于无照顾的境地。“撇下”自然传达离开而不顾的语气，又不采用语义更强的“遗弃”。
- source_word: ὀρφανούς
  choice: 像孤儿一样
  rationale: 保留希腊文“孤儿”的具体家庭意象，表达失去父母照顾、孤单无助的处境，而不把它弱化为一般性的孤独感。
- source_word: ἔρχομαι
  choice: 我正到……来
  rationale: 希腊文为现在时形式，在语境中可有临近将来或生动表达之意。“正到你们这里来”兼顾其现在时的临近感与现代汉语的自然表达。
- source_word: πρὸς ὑμᾶς
  choice: 到你们这里
  rationale: πρός加宾格表示朝向某人移动；“到你们这里”符合汉语中以来者视角表达趋近听者的习惯。
- source_word: Οὐκ
  choice: 不会
  rationale: 与将来时动词连用构成否定；“不会”准确、自然地表达“我将不”。
theological_decisions:
- issue: “我正到你们这里来”所指的事件与时间
  choice: 正文不限定所指，保留耶稣“来”的开放性
  alternative: 明确解释为复活后显现、借着圣灵来到，或末日再来
  rationale: 上下文既谈到圣灵，也可使人联想到耶稣复活后亲自向门徒显现及将来的再来；希腊文本身没有强制限定单一所指，因此不在正文中消除这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撇下”保留关系性的弃置意味；“像孤儿一样”清楚保存原文意象。两个脚注标记均置于正文相应内容之后，并按正文出现顺序排列。
