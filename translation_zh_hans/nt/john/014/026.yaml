  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: zh_hans
  text: 但那位辩护者[a]，就是父要奉我的名差来的圣灵；他要教导你们一切，并使你们想起我对你们所说的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辩护者”也可译作“帮助者”“劝慰者”或“保惠师”。希腊文为 paraklētos（παράκλητος）。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: 护慰者
  rationale: 该词兼有援助、代言、劝勉与安慰等含义；“护慰者”以庄重而凝练的称谓保留其主动扶助和安慰的幅度，并用脚注列出较常见的译法，避免将词义限于单一功能。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 现代汉语基督教语境中通行且准确的称谓；此处与“护慰者”同位。
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: 父将要……差来的那一位
  rationale: 保留未来时和父作为差遣者，并以“那一位”自然表达所指对象的位格性。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 这是自然且成熟的汉语表达，保留代表、授权及与耶稣相联的语义范围，不将其窄化为某一种解释。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 希腊文以强调性的阳性指示代词回指阳性称谓 παράκλητος；“他”保留其强调和人格化的行动主体。
- source_word: διδάξει ὑμᾶς πάντα
  choice: 会教导你们一切
  rationale: 直接保留“教导”及 πάντα 的广泛范围；不额外限定“一切”的内容。
- source_word: ὑπομνήσει ὑμᾶς
  choice: 使你们想起
  rationale: 准确表达 ὑπομιμνῄσκω 的使役意味，比单说“提醒”更贴近原文结构。
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: 我对你们所说的一切
  rationale: 保留关系从句、重复的“一切”以及复数受词“你们”，行文仍符合现代汉语。
theological_decisions:
- issue: 圣灵的位格性表达
  choice: 采用“那一位”“他”等指人的表达
  alternative: 按 πνεῦμα 的中性语法采用非人格化表达
  rationale: 原文先以中性名词 πνεῦμα 指圣灵，却以阳性称谓 παράκλητος 和强调性的阳性 ἐκεῖνος 指回同一对象，并赋予其教导和使人想起的主动行为；汉语采用指人的表达最能反映此处句法和语义。
- issue: παράκλητος 的译法
  choice: 护慰者
  alternative: 帮助者、辩护者、劝慰者、保惠师
  rationale: 原词语义丰富，可能包括援助、代言、劝勉和安慰。“护慰者”在正文中兼顾保护扶助与安慰，其他重要可能译法置于脚注，以避免虚假地消除原词的张力。
- issue: “奉我的名”的意义范围
  choice: 保留成语式表达“奉我的名”
  alternative: 替我、带着我的权柄
  rationale: 原文可含代理、代表、权柄和与耶稣相联等意味；直译式的自然汉语可保留这些可能性，而不在正文中只选其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“但”承接上文的转折，以“就是”清楚呈现“护慰者”与“圣灵”的同位关系；保留原文两次“一切”的修辞和语义范围。
