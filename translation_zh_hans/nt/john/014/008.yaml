id: JHN.14.8
reference: John 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: zh_hans
  text: 腓力对他说：“主啊[a]，请把父显给我们看，这对我们就够了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主啊”也可译作“先生”。
    reason: κύριος在直接称呼中既可表示“主”，也可用作尊称；上下文支持正文译法，但较弱的礼貌称呼仍有词义可能。
lexical_decisions:
- source_word: Λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时，现代汉语叙事中用“说”即可自然表达，不必另加时态标记。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 与言说动词搭配的与格代词，译作“对他说”符合现代汉语习惯。
- source_word: Φίλιππος
  choice: 腓力
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格；此处是腓力对耶稣的尊称。“主啊”既符合上下文，也保留约翰福音中的基督论分量；“先生”仍是词义上可能的较弱译法，列入脚注。
- source_word: δεῖξον
  choice: 请把……显给我们看
  rationale: 该不定过去时命令式要求使对象可见或可知。“显给我们看”保留“展示、使看见”的直接含义；加“请”使门徒向耶稣提出请求的语气符合自然汉语。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 作δεῖξον所支配的与格，中文用“给我们”自然表达接受者。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 在约翰福音语境中专指耶稣的父，即上帝。汉语以“父”表达这一称谓，不额外添加原文没有的限定语。
- source_word: καὶ
  choice: 这……就
  rationale: 这里连接请求及其预期结果；汉语用“这……就”自然呈现“若得以看见父，便足够”的关系，同时不把关系过度解释为明确条件句。
- source_word: ἀρκεῖ ἡμῖν
  choice: 对我们就够了
  rationale: ἀρκέω意为“足够、充足”，与格ἡμῖν指出对谁而言足够；该译法清楚、自然，并保留原句的简洁。
theological_decisions:
- issue: 腓力以κύριος称呼耶稣
  choice: 主啊
  alternative: 先生
  rationale: “主啊”保留该称呼在约翰福音叙事中的尊崇意味和可能的基督论分量，但不借译文进一步界定腓力此刻理解到何种程度。由于κύριος也可作为礼貌尊称，脚注保留“先生”这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显给我们看”比单纯“给我们看”更能兼顾可见与启示的语义，又避免直接译成解释性较强的“启示”。
