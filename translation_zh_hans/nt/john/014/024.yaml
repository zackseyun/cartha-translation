source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: zh_hans
  text: 不爱我的人，不遵守我的话；你们所听见的话，不是我的，而是差我来的父的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是出于我，而是出于差我来的父。”
    reason: “我的”与“父的话”在此也可按话语的来源来表达；正文保留原文较直接的所属结构。
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: 不爱我的人
  rationale: 带冠词的现在分词作名词用，泛指以不爱耶稣为特征的人；此译自然，并保留一般性陈述。
- source_word: τοὺς λόγους μου
  choice: 我的话
  rationale: λόγους为复数，但现代汉语“我的话”可自然地统摄耶稣所说的各项教导，也与后文单数“这话”形成可辨而不生硬的对应。
- source_word: τηρεῖ
  choice: 遵守
  rationale: 在约翰语境中，τηρέω指持守并实行耶稣的话；“遵守”比单纯“听从”更能保留持续忠实实践的意味。
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: 你们所听见的这话
  rationale: 单数λόγος在此可指作为整体的信息或教导；“这话”既保留“话”的约翰用语，也符合现代汉语表达。
- source_word: οὐκ ἔστιν ἐμὸς
  choice: 不是我的
  rationale: 直接保留ἐμός的所属表达，不提前把含义解释为“不是出于我”，从而保留原文有关归属与来源的张力。
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: 而是差我来的父的
  rationale: 希腊文以属格与“我的”相对，省略了重复的系词；汉语用“父的”保留这一简洁的所属结构，并让“差我来的”修饰“父”。
theological_decisions:
- issue: 耶稣的话与父的话之间的关系
  choice: 保留“不是我的，而是……父的”这一归属对比
  alternative: 译为“不是出于我，而是出于差我来的父”
  rationale: 原文既区分耶稣与差他的父，又表明所听见之话归于父。正文不把这种关系进一步解释为仅指来源，也不使耶稣显得否认自己所传的话，而是保留原文自身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不爱我的人”避免文言化；“遵守我的话”保持约翰福音中爱与持守教导之间的联系。正文中的脚注标记置于整句之后。
