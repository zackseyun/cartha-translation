  naturalness: “不爱我的人，不遵守我的话”庄重自然。“而是差我来的父的话”比“而是差我来的父的”符合现代标准汉语，并清楚表明“差我来的”修饰“父”。删去“这”也避免在原文无明确指示语时增添指示性。
  terminology: “爱”“遵守”“话”“父”均适合约翰福音语域，并保持“话”在本节前后复数与单数的对应。
