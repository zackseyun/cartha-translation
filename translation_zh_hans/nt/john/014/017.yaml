id: JHN.14.17
reference: John 14:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: zh_hans
  text: 就是真理的灵[a]，世人不能接受他，因为世人既看不见他，也不认识他。你们却认识他，因为他与你们同在，并且将要在你们里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“灵”（πνεῦμα）在语法上是中性名词，所以相关代词也用中性形式；这里按上下文以人格代词“他”来表达。
    reason: lexical_alternative
  - marker: b
    text: “在你们里面”也可理解为“在你们中间”；希腊文的“你们”是复数。此处直译为“在你们里面”，以保留它与前面“与你们同在”的区别。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理的灵
  rationale: 保留希腊文属格结构和约翰著作中的固定表达；“灵”在此指上下文中的圣灵。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: κόσμος在约翰语境中具有广度；此处作为不能接受、看见和认识圣灵的主体，译作“世人”比抽象的“世界”更符合现代汉语，同时不限定为每一个个体。
- source_word: οὐ δύναται λαβεῖν
  choice: 不能接受
  rationale: 保留δύναται所表达的不能以及λαμβάνω在此处“接受、领受”的意义；“接受”在现代汉语中自然清楚。
- source_word: θεωρεῖ
  choice: 看不见
  rationale: 采用基本视觉义，不以“觉察”或“领悟”提前解释其认知含义。
- source_word: γινώσκει / γινώσκετε
  choice: 认识／认识
  rationale: 在世人与门徒之间保留同一动词的对应和对比。
- source_word: παρ’ ὑμῖν μένει
  choice: 与你们同在
  rationale: παρά加与格表示在某人身边、与其同在；“同在”自然庄重。μένει有持续停留之意，但此处汉语无需另加“常”。
- source_word: ἐν ὑμῖν ἔσται
  choice: 将要在你们里面
  rationale: 直接保留ἐν的“在……里面”和ἔσται的将来时，同时不排除复数“你们”可能具有群体层面的含义。
theological_decisions:
- issue: 中性语法形式所指的圣灵是否使用人格化代词
  choice: 使用人格代词“他”
  alternative: 依照πνεῦμα的中性语法译作“它”
  rationale: 希腊文关系代词和代词的中性形式与πνεῦμα的语法性一致，本身不能单独判定所指是否具人格；但近距离上下文将圣灵描写为另一位保惠者及教导者，因此现代汉语用“他”更准确地表达所指，同时以脚注保留原文语法信息。
- issue: παρ’ ὑμῖν与ἐν ὑμῖν的关系
  choice: 分别译作“与你们同在”和“在你们里面”
  alternative: 将后者译作“在你们中间”
  rationale: 保留两个不同介词表达的对照和进展，不把二者合并为一般性的临在，也不排除复数表达的群体维度。
- issue: 显式主语ὑμεῖς的对比语气
  choice: 译为“你们却认识他”
  alternative: 仅译“你们认识他”
  rationale: ὑμεῖς在动词已有主语信息时显式出现，具有强调和对比作用；汉语以“却”自然呈现世人与门徒之间的对照。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世人”避免不自然地说“世界看不见他”；“与你们同在／在你们里面”保留原文介词对照。所有脚注标记均已置于正文相应位置。
