id: JHN.14.6
reference: John 14:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: zh_hans
  text: 耶稣对他说：“我就是道路、真理、生命；若不借着我，没有人能到父那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 希腊文用历史现在时λέγει叙述当时的言说；现代汉语动词本身不标时态，“对他说”自然地表达了叙事语境，并保留αὐτῷ所指的间接宾语。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 显式主语Ἐγώ带有强调作用。“我就是”以自然汉语传达这种强调，并引出后面的三个并列谓语。
- source_word: ἡ ὁδὸς
  choice: 道路
  rationale: ὁδός既可指实际道路，也可作比喻表示途径；“道路”保留这两层可能性，且庄重自然。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: ἀλήθεια的核心意义是真实、真理；此处用“真理”最符合谓语名词结构及约翰福音的语境，又不额外限定其神学内涵。
- source_word: ἡ ζωή
  choice: 生命
  rationale: ζωή在约翰著作中含义丰富，可涉及今世与永恒的生命；“生命”保留其语义广度，不作解释性扩写。
- source_word: οὐδεὶς ἔρχεται πρὸς τὸν πατέρα
  choice: 没有人能到父那里去
  rationale: οὐδεὶς明确表示全称否定；ἔρχεται πρὸς表示朝向并到达。“到父那里去”是自然汉语，“能”在否定条件结构中表达实际通达的可能，并非削弱原文断言。
- source_word: εἰ μὴ δι’ ἐμοῦ
  choice: 若不借着我
  rationale: εἰ μή在此构成排除性条件，διά加属格表示途径或中介。“若不借着我”既贴近原文结构，也自然表达唯有经由耶稣才能到父那里去。
theological_decisions:
- issue: 唯有借着耶稣才能到父那里去的排他性
  choice: 若不借着我，没有人能到父那里去
  alternative: 没有人能到父那里去，除非借着我
  rationale: 原文明确排除其他通达父的途径。正文保留这一直接断言，不予淡化，也不扩展到本节未明说的其他命题。
- issue: 三个并列谓语的表达
  choice: 道路、真理、生命
  alternative: 那道路、那真理、那生命
  rationale: 希腊文在三个名词前各有定冠词，并以καί连接，赋予每项独立的修辞分量。现代汉语没有对应的定冠词；反复加“那”会显得生硬，并可能带入额外的指示意味，因此以三个并列名词简洁呈现，同时用“就是”体现断言的强调。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留前后两项宣告之间的紧密逻辑关系；不机械复制希腊文冠词或连接词，以免形成不自然的汉语。
