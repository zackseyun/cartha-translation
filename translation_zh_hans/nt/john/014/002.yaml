  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: zh_hans
  text: 在我父的家里，有许多住处[a]。如果不是这样，我岂会告诉你们说，我去是要为你们预备地方吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多房间。”希腊语可指停留或居住的地方；“住处”含义较宽，也保留了本章“住、常在”这一主题上的联系。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译：“如果不是这样，我会告诉你们；因为我去是要为你们预备地方。”希腊原文也容许把这部分理解为陈述，而不是反问。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῇ οἰκίᾳ τοῦ πατρός μου
  choice: 在我父的家里
  rationale: οἰκία在此最自然地指“家”或“房屋”；“我父的家”既保留具体意象，也符合现代汉语表达，不将其解释性地改作“家族”或“家庭”。
- source_word: μοναὶ πολλαί
  choice: 许多住处
  rationale: μονή指停留、居住之处。“住处”比“房间”宽泛，也与本章μένω（住、常在）的主题保持词义联系；“许多”准确对应πολλαί。
- source_word: εἰ δὲ μή
  choice: 如果不是这样
  rationale: 将省略的条件内容按汉语习惯补明，表达“若事实并非如此”，而不增添新的命题。
- source_word: εἶπον ἂν ὑμῖν
  choice: 我岂会告诉你们
  rationale: ἄν与过去时动词构成非现实条件结果；“岂会”自然表达反问语气，而“你们”明确保留复数。
- source_word: ὅτι
  choice: （引出所告诉的内容）
  rationale: 主译文将ὅτι理解为内容连接词；汉语在“告诉你们”之后可自然省略“说/这件事”，无需机械译出“即”。
- source_word: πορεύομαι ἑτοιμάσαι
  choice: 我去是要……预备
  rationale: πορεύομαι在语境中表示正在离去或将要去，ἑτοιμάσαι是不定式，表目的；“去是要……预备”清楚呈现这一目的关系。
- source_word: τόπον ὑμῖν
  choice: 为你们预备地方
  rationale: τόπος是宽泛的“地方”，不宜缩窄为“房间”；ὑμῖν在此作受益者，译作“为你们”。
theological_decisions:
- issue: μονή所表达的末世居所意象
  choice: 许多住处
  alternative: 许多房间；许多华厦
  rationale: “住处”不把经文限定为建筑内部的房间，也避免现代“华厦/豪宅”所带来的奢华含义，并保留“居住、常在”的约翰主题。
- issue: 后半句的标点与句法作用
  choice: 译作反问：“如果不是这样，我岂会告诉你们，我去是要为你们预备地方吗？”
  alternative: 译作陈述：“如果不是这样，我早就会告诉你们了；因为我去是要为你们预备地方。”
  rationale: 原文没有可视为作者原始标点的问号，ὅτι也可理解为“因为”；主译采用上下文通顺的反问读法，同时用脚注保留真实存在的陈述句读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父”指耶稣所说的父神，但中文不以大小写作额外标示。“岂会”保留反问力度而不过分文言；“住处”和“地方”则避免“豪宅”或特定天堂建筑结构等后期联想。
