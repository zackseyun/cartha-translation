  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: zh_hans
  text: 你们听见我对你们说过：‘我要离开，也要到你们这里来。’你们若爱我，本会因我到父那里去而欢喜[a]，因为父比我大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就会欢喜。”希腊文形式也可作较一般的表达；但结合本句与事实相反的条件，正文以“本会……欢喜”表达本应发生却未发生的反应。
    reason: lexical_alternative
  - marker: b
    text: “父比我大”依原文直译；原文没有加上“在职分上”或“在地位上”等解释性限定。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: 你们听见……说过
  rationale: 不定过去时指门徒已经听到耶稣先前所说的话；“听见……说过”在现代汉语中自然地表达这一完成事件。
- source_word: Ὑπάγω
  choice: 我要离开
  rationale: 现在时在语境中指即将发生的行动；“要离开”既自然，又保留从门徒那里离去的方向意味。
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: 也要到你们这里来
  rationale: 保留原文面向门徒而来的动作和将来指向，不擅自加入“回来”所可能带出的额外解释。
- source_word: εἰ ἠγαπᾶτέ με
  choice: 你们若爱我
  rationale: 未完成时用于与事实相反的条件句；汉语以“若……就会……了”的整体结构表达其反事实意味。
- source_word: ἐχάρητε ἄν
  choice: 就会……欢喜了
  rationale: 不定过去时与ἄν构成非现实条件的结果；“就会……欢喜了”在汉语中可表达本会发生、实际上却没有发生的反应。
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: 我要到父那里去
  rationale: 清楚表达前往的动作及其关系性目的地；“父”保留约翰福音中带定冠词的称号用法，不增译为“我的父”。
- source_word: μείζων μού
  choice: 比我大
  rationale: 直接保留比较关系，不加入“地位上”“职分上”等解释性限定。
theological_decisions:
- issue: “父比我大”与基督论的关系
  choice: 正文直译为“父比我大”，不加解释性限定。
  alternative: 父在职分或地位上比我大；父相对于处于道成肉身状态的耶稣更大。
  rationale: 原文直接陈述比较，却没有说明比较所涉及的层面。译文应保留这一神学张力，不在正文中预先裁定其含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“若”略具经文语体色彩，但普通读者易懂；整句避免古奥措辞，也不以神学释义取代原文的简洁陈述。
