  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: zh_hans
  text: 我还和你们在一起的时候，已经把这些事告诉你们了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我还留在你们中间的时候。”原文用的是“留、住、常在”（μένω）这一动词；约翰著作多次使用这个词。
    reason: 说明可行的词汇译法，并保留约翰反复使用μένω所形成的主题联系。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词的复数意义，指向前文耶稣所讲的多项教导；现代汉语自然通顺。
- source_word: λελάληκα
  choice: 已经……告诉……了
  rationale: 完成时表示话已经说出，并在当前语境中仍然有效。汉语用“已经……了”表达其完成性；“告诉”在带间接宾语“你们”时比“说了这些事给你们”更自然。
- source_word: ὑμῖν
  choice: 你们
  rationale: 明确保留第二人称复数，所指为在场的门徒。
- source_word: παρ’ ὑμῖν
  choice: 和你们在一起
  rationale: παρά加与格在此表达同在、身处其间；这一译法符合现代汉语，也不额外限定这种同在的性质。
- source_word: μένων
  choice: 还……在一起
  rationale: 现在分词与παρ’ ὑμῖν合译为时间状语“还和你们在一起的时候”。正文优先采用自然汉语；脚注说明原文使用约翰反复采用的μένω。
theological_decisions:
- issue: 如何保留约翰著作中μένω的主题性用语，同时避免生硬中文
  choice: 正文译作“还和你们在一起的时候”，并以脚注提示原词
  alternative: “住留在你们中间的时候”或“仍与​​你们同住时”
  rationale: μένω可译为“停留、住、常在”；本句首先描述耶稣当时与门徒同在。若在正文机械统一为“常在”或“住留”，会使现代汉语生硬，并可能过度神学化。脚注既保留词汇联系，也不替原文消除其语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“我还和你们在一起的时候”自然表达分词结构；“已经……了”传达完成时。脚注标记已在正文中对应出现。
