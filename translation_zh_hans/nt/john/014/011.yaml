  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: zh_hans
  text: 你们要信我：我在父里面，父也在我里面；若不然[a]，也要因这些作为本身而信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若不然”可理解为“如果你们不信我所说的这件事”。末尾的“信”在希腊文中没有明说对象；这些作为本身构成信的依据。
    reason: 说明εἰ δὲ μή所省略的条件内容，并保留末尾πιστεύετε没有明确宾语的句法特点。
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: 你们要信我
  rationale: πιστεύω与与格μοι连用，直接表示“相信我（所说的）”。保留“我”作对象，既自然，也避免扩写为“相信我所说的话”。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出所信的内容。中文用冒号比生硬的“相信我，我……”更自然，并清楚标明后文是耶稣要求门徒相信的内容。
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: 我在父里面，父也在我里面
  rationale: 逐项保留重复的ἐν（“在……里面”），呈现约翰所表达的彼此内住，不将其改写成“与父合一”等解释性措辞。
- source_word: εἰ δὲ μή
  choice: 即使不然
  rationale: 该短语转向另一项信的依据，意为即使听者不能凭前述话语相信。此译保持省略与条件意味，不擅自补出明确对象。
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: 因这些工作本身
  rationale: διά加宾格表示原因或依据；ἔργα译为约翰福音中宽泛而重要的“工作”，αὐτά用“本身”传达强调。
- source_word: πιστεύετε
  choice: 要……信
  rationale: 末尾命令式没有明说宾语，因此中文也不补成“信我”或“信入我”，保留原文的简洁和开放性。
theological_decisions:
- issue: 子与父的彼此内住
  choice: 我在父里面，父也在我里面
  alternative: 我与父合一，父也与我合一
  rationale: 原文以两个对称的ἐν短语表达关系。直译既保留其深厚的神学含义，也不以系统神学术语替换约翰本人的措辞。
- issue: 末句“信”的对象
  choice: 不补明对象，只译“也要……信”
  alternative: 也要因这些工作本身而信我
  rationale: 第二个πιστεύετε在希腊文中没有显明宾语。保留绝对用法，避免将可能隐含的对象明确化，同时让“工作本身”清楚成为信的依据。
- issue: εἰ δὲ μή所否定的内容
  choice: 正文保留省略，并以脚注说明
  alternative: 如果你们不信我所说的
  rationale: 原文采用简略条件表达，没有重述究竟否定前句中的哪一部分。正文保留这种简略，脚注提供语境所支持的理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“父”依约翰福音的称谓保留，不加“上帝”以免扩写；“工作”保持ἔργα的宽泛含义。句首加入“你们”显明复数命令式，句中“也”体现对称关系与转折后的第二项劝告。
