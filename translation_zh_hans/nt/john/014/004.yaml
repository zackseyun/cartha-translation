  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: zh_hans
  text: 我往哪里去，你们知道那条路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“你们知道我往哪里去，也知道那条路。”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 承接上文，不单独译出
  rationale: καί在这里是普通连接词。现代汉语承接上一句时可由语序自然表达；若硬译为“并且”会显得生硬，“也”则可能增添不必要的强调。
- source_word: ὅπου
  choice: 哪里
  rationale: 表示地点“哪里”。置于“我往哪里去”中，符合现代汉语表达，并保留目的地与“路”之间关系的句法张力。
- source_word: ἐγὼ
  choice: 我
  rationale: 保留明确主语，指耶稣本人。
- source_word: ὑπάγω
  choice: 往……去
  rationale: 表达正在或即将前往某处；比“离开”少作一层语境解释，也比单用“去”更适合与“哪里”搭配。
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα虽具完成时形式，在此具有现在意义；第二人称复数译作“你们”。
- source_word: τὴν ὁδόν
  choice: 那条路
  rationale: ὁδός可指道路、路径或途径。此处用“那条路”既保留具体道路意象，也不提前把约翰福音14:6的含义完全解释进本节；定冠词以“那条”自然体现。
theological_decisions:
- issue: “我往哪里去”与“那条路”的句法关系
  choice: 我往哪里去，你们知道那条路。
  alternative: 你们知道通往我要去之处的路。
  rationale: 原文把地点从句置于前面，随后说门徒“知道那条路”，两者关系明确但没有显式介词。所选译法保留这种结构和可能的张力，不添加“通往”，也没有把经文改成门徒知道目的地本身。
- issue: 是否将ὁδός直接作神学性解释
  choice: 保留为“那条路”
  alternative: 译为“道路”或解释为特定的救恩途径
  rationale: 本节尚未明确说明“路”的身份或神学含义；应让下一节多马的问题及14:6的回答自行展开，不在此处预先消解张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“我往哪里去，你们知道那条路”保留希腊文的分句次序，读来简洁自然；脚注标记已置于正文相应位置。
