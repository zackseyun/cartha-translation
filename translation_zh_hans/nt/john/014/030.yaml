  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: zh_hans
  text: 我不再跟你们多说了，因为世界的统治者[a]就要来了；他在我里面没有任何东西[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界的统治者”也常译作“这世界的统治者”。约翰福音其他相近表达使用“这世界的”，但这里的希腊原文只说“世界的”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“他对我毫无权利”“他在我身上毫无把柄”或“他控制不了我”。希腊原文直译为“他在我里面没有任何东西”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: 我不会再和你们多说了
  rationale: οὐκέτι 表示从此不再，πολλὰ 在此作副词性用法，修饰“说”；“和你们多说”自然表达与门徒交谈的意思，并保留未来指向。
- source_word: ἔρχεται
  choice: 就要来了
  rationale: 现在时在语境中表达迫近的将来；“就要来了”比直译“正在来”更符合现代汉语，也传达临近之意。
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: 世界的统治者
  rationale: ἄρχων 指掌权者或统治者；译作“统治者”清楚而不过度传统化。原文仅说“世界的”，没有明说“这世界的”，故正文不增添“这”。
- source_word: καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: 他在我里面一无所有
  rationale: 尽量保留原文紧凑而带有多重含义的表达，不在正文中限定为“对我没有权柄”“抓不住我”或“对我没有主张权”。
theological_decisions:
- issue: “世界的统治者”的身份
  choice: 正文保留称号“世界的统治者”，不直接改译为“撒但”
  alternative: 直接译明为“撒但”或泛指世上的邪恶势力
  rationale: 约翰语境通常使人联想到撒但，但希腊文此处使用的是称号。保留称号既忠于明文，也不把语境推断写入正文。
- issue: “他在我里面一无所有”的含义
  choice: 保留接近字面的开放表达
  alternative: “他对我毫无权利”“他控制不了我”“他在我身上毫无把柄”
  rationale: 原文可能包含没有权利、立足点、把柄或控制力等意涵。正文不应只选定其中一种；脚注可帮助读者理解这些可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就要来了”表达迫近感；末句刻意保留原文的简洁和神学张力，并借脚注说明其习语性含义。脚注标记按实际所注释的短语重新对应：关于“世界的统治者”的说明标为[a]，关于末句的说明标为[b]。
