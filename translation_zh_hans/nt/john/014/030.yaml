  rationale: 修订消除了“一无所有”在现代汉语中强烈的财物义，同时仍以接近字面的“在我里面没有任何东西”保留希腊语习语的开放性，并在脚注中列出不互相排斥的解释性理解。另将[a]移至其实际注释的名词短语之后。
