  source_fidelity: 正文准确传达了不再多说、世界的统治者将至，以及其与耶稣无可据之处的基本含义。末句原译“他在我里面一无所有”在汉语中通常表示“身无分文”，容易误解为财物意义，未能恰当地保留原文习语的开放性。
  naturalness: “我不会再和你们多说了”可以理解，但“我不再跟你们多说了”更符合现代汉语在告别语境中的自然表达。末句改为“他在我里面没有任何东西”虽刻意保留原文简洁的陌生感，但不带“一无所有”的财物联想；脚注说明其习语性含义。
  terminology: “世界的统治者”忠实对应ὁ τοῦ κόσμου ἄρχων，且不擅自加入“这”或将称号直接释作“撒但”。脚注应紧邻所说明的称号，而非置于“来了”之后，以使锚点清楚。
  issues:
  - severity: medium
    issue: 末句“他在我里面一无所有”含有不必要的财物义联想。
    rationale: 现代汉语“一无所有”通常指一个人没有任何财产、地位等；用于“他在我里面”既不自然，也可能将ἐν ἐμοὶ οὐκ ἔχει οὐδέν误读为所有权或财物陈述。原文的“没有任何东西在我里面”是习语性表达，可涵盖无权利、无把柄、无立足点等含义，不宜在正文中缩窄或造成另一种误解。
