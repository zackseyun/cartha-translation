  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: zh_hans
  text: 耶稣回答他说：“人若爱我，就会遵守我的话[a]；我父也会爱他；我们要到他那里去，并在他那里安家[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的话”也可译作“我的教导”或“我所说的话”。
    reason: lexical_alternative
  - marker: b
    text: “在他那里安家”也可译作“与他同住”或“在他那里设立住处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: 耶稣回答他，说
  rationale: 保留原文“回答”与“说”两个动词的叙事结构，同时符合现代汉语表达。
- source_word: Ἐάν τις
  choice: 人若
  rationale: 表达不定条件的普遍范围，不限于特定的人；在庄重而自然的现代汉语中简洁清楚。
- source_word: ἀγαπᾷ με
  choice: 爱我
  rationale: 直接呈现ἀγαπάω的基本含义，并与后文父“爱他”保持用词一致。
- source_word: τὸν λόγον μου
  choice: 我的话
  rationale: 保留λόγος在约翰福音中的“话、言语、信息”语感，也可自然涵盖耶稣的教导而不将含义缩窄。
- source_word: τηρήσει
  choice: 会遵守
  rationale: τηρέω在此不仅指听见或记住，也包含持守并照着实行；“遵守”在现代汉语中清楚自然。
- source_word: ὁ πατήρ μου
  choice: 我的父
  rationale: 忠实呈现耶稣对父的称呼；“父”在上下文中明确指神，无须另加解释性称号。
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: 我们要到他那里去
  rationale: 保留第一人称复数和朝向此人的行动；汉语补出趋向成分“去”，使叙述自然，但不改变‘到他那里’的核心意思。
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: 并在他那里安家
  rationale: μονή指居所、住处，ποιεῖν μονήν构成建立住处的表达；“安家”自然传达持续居住和亲密同在，且“在他那里”保留παρά加与格的关系性方位。
theological_decisions:
- issue: “我们要到他那里去”中的复数主体
  choice: 明确保留“我们”，指本句中的耶稣与父共同来到并安家。
  alternative: 将复数弱化为单数或笼统的神圣临在。
  rationale: 原文ἐλευσόμεθα和ποιησόμεθα均为第一人称复数，必须保留共同施行的动作；译文不在经文之外进一步界定其教义关系。
- issue: 爱与遵守之间的条件关系
  choice: 译作“人若爱我，就会遵守我的话”。
  alternative: 译成命令式“就应当遵守”，或解释为靠遵守换取爱。
  rationale: 原文是条件句加将来时陈述，呈现爱耶稣者将持守他的话；不宜改成命令，也不应额外说明因果或功德关系。
- issue: 泛指单数τις与后续αὐτόν
  choice: 用“人若”表达开放的泛指范围，后文以单数“他”承接。
  alternative: 改用复数“人们／他们”或重复“这个人”。
  rationale: 这样既自然表达任何人的普遍范围，也保留原文单数指代的结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人若……就会……”保持格言式语气；“在他那里安家”比直译“制造住处”自然，同时保留持续居住的意象。所有脚注标记均置于对应词语之后。
