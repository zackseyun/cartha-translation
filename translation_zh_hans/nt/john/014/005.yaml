  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: zh_hans
  text: 多马对他说：“主啊，我们不知道[b]你要到哪里去，怎么能知道那条路呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们怎么能够知道那条路呢？”
    reason: 词义表达选择：δυνάμεθα明确表示能力，“怎么能”与“怎么能够”都可表达。
  - marker: b
    text: 本节希腊原文两次使用同一个表示“知道”的动词，一次是“我们不知道”，另一次是“知道那条路”。
    reason: 说明原文中的词语重复及多马问题的逻辑联系。
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: 多马对他说
  rationale: λέγει是叙事中的历史现在时，现代汉语叙事自然译作“说”；αὐτῷ以“对他说”表达，Θωμᾶς按通行译名译作“多马”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格称呼及其尊敬意味；“主”也不排除《约翰福音》语境中更深的基督论含义。
- source_word: οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: οἶδα在此表示知晓，直译为“不知道”，并与后面的εἰδέναι保持词语呼应。
- source_word: ποῦ ὑπάγεις
  choice: 你要到哪里去
  rationale: ὑπάγω可指离去或前往；此处采用自然、中性的表达，不提前说明耶稣所去之处的神学含义。
- source_word: πῶς δυνάμεθα
  choice: 怎么能
  rationale: πῶς提出方式或可能性问题，δυνάμεθα表达能力；“怎么能”是自然现代汉语，同时保留反问中的困惑。
- source_word: τὴν ὁδὸν
  choice: 那条路
  rationale: ὁδός可指道路、路径或途径；“那条路”既自然承接上文，也保留与下一节“道路”主题的联系，而不在本节中加以解释。
- source_word: εἰδέναι
  choice: 知道
  rationale: 该不定式补足δυνάμεθα；重复译作“知道”，保留其与οἴδαμεν使用同一希腊语动词词根的呼应。
theological_decisions:
- issue: 《约翰福音》语境中ὑπάγεις可能含有耶稣离世并归向父的神学意味
  choice: 中性译作“你要到哪里去”
  alternative: “你要离去到哪里”或“你要往哪里去”
  rationale: 多马在本句中强调自己不知道目的地；不在译文中明说升天或归父，可保留叙事悬念与神学张力。
- issue: ὁδός与下一节耶稣宣告“我就是道路”的联系
  choice: 译作“那条路”，不在正文中解释其所指
  alternative: “那途径”或将其解释为通往父的道路
  rationale: 采用能与下一节形成词汇呼应的译法，同时避免把下一节的解释提前带入多马的问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎么能”适合人物直接发问，不显古奥；“那条路”承接语境并保留下一节的主题联系。脚注标记[a]置于相关问句之后，[b]置于首次出现的“知道”所在分句之后。
