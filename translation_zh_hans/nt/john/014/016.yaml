  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: zh_hans
  text: 我会求父，父就会赐给你们另一位帮助者[a]，让他永远与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帮助者”所译的希腊词也可译为“辩护者”“辅导者”或“安慰者”；传统上常译作“保惠师”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: 我
  rationale: κἀγώ由καί与ἐγώ缩合而成，承接上文并略带主语强调。中文语境中用“我”即可自然延续话语；另加“也”容易产生并列祈求的歧义。
- source_word: ἐρωτήσω
  choice: 要求
  rationale: ἐρωτάω在此指向父提出请求。“要求”在现代中文中简洁自然，表达请求而非命令；不译作“祈求”，以免加入原文未必要求的宗教语体。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 原文有定冠词而无“我的”等物主词。约翰福音语境中“父”自然明确，且避免增译原文没有的所属关系。
- source_word: ἄλλον
  choice: 另一位
  rationale: ἄλλος表示在已有的一位之外的“另一位”。量词“位”与后面的具人格称谓相配，也保留其与耶稣之间由语境显出的关联，不额外解释为“同类的”。
- source_word: παράκλητον
  choice: 护慰者
  rationale: παράκλητος兼有代言、援助、劝勉与安慰等语义。“护慰者”以简洁的人格性称谓同时提示维护与安慰，避免单译“帮助者”而把内涵缩窄为一般辅助，也避免“保惠师”这一较不透明的传统用语。因单一译词无法穷尽其含义，脚注列出主要译法。
- source_word: δώσει ὑμῖν
  choice: 他就会赐给你们
  rationale: 保留将来意义和间接宾语。“赐给”符合父所给予之应许的庄重语境；“就”自然呈现前后动作的承接，不改变逻辑关系。
- source_word: ἵνα ᾖ
  choice: 使他……同在
  rationale: ἵνα加虚拟式可表达目的或结果。“使”保留这种目的—结果关系；中文无需用情态词机械对应虚拟式。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: μετά加属格的基本意义是“与……一起”。“同在”在此庄重而自然，并准确表达持续相伴，而非较宽泛的“在你们中间”。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是约翰著作中表示持续到永远的惯用语。“永远”准确传达其惯用意义，避免生硬直译为“直到那世代”。
theological_decisions:
- issue: 在圣父、圣子、圣灵语境中如何翻译 παράκλητος
  choice: 护慰者
  alternative: 帮助者、辩护者、劝慰者，传统译法“保惠师”
  rationale: “另一位”及阳性代词所呈现的是具人格者，不宜把该词处理成非人格的能力或作用。“护慰者”保留维护、援助和安慰的多重意味，却不把圣灵在本节中的工作限定为法庭辩护或情感安慰。脚注保留其他合理译法，以呈现原词真实的语义张力。
- issue: ἵνα ᾖ所表达的是目的还是结果
  choice: 译为“使他……同在”，容纳目的与预期结果
  alternative: “好让他……同在”或“为要他……同在”
  rationale: ἵνα结构在此可从目的或结果角度理解；“使”不强行排除任何一面，也符合自然现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式简洁，保留约翰福音话语的郑重感；避免以古雅但语义不透明的传统术语作为唯一正文译法。
