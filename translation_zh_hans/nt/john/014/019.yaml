id: JHN.14.19
reference: John 14:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: zh_hans
  text: 再过不久，世人就不再看见我，你们却会看见我[a]。因为我活着，你们也将活着[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里两次译作“看见”的希腊词也可表达“观看、注视”，可能不只是匆匆一瞥。
    reason: lexical_alternative
  - marker: b
    text: “你们也将活着”可能指门徒分享耶稣复活的生命、在与他联合中所得的属灵生命，或兼指两者。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: 再过不久
  rationale: 这是自然的现代汉语时间表达，传达所剩时间很短以及即将发生变化的意思。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 约翰语境中的 κόσμος 在此指与门徒形成对照、不能再看见耶稣的人类世界；译作“世人”比“世界”作主语更符合现代汉语，同时避免扩写为带有特定教义色彩的“世界体系”。
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: 不再看见／会看见
  rationale: θεωρέω 可带有观看、注视甚至有所领会的意味，但“看见”最自然，也能保留这里究竟指复活后的亲眼相见、属灵认识还是兼有二者的开放性。希腊文虽用现在时，ἔτι μικρὸν 与 οὐκέτι 所设定的临近转变使汉语用“就不再……／会……”更清楚。
- source_word: οὐκέτι
  choice: 不再
  rationale: 简洁准确地表达从即将到来的某一时点起停止看见。
- source_word: δὲ
  choice: 却
  rationale: 鲜明而自然地表现世人与门徒之间的对比。
- source_word: ὅτι
  choice: 因为
  rationale: 在此最自然地引出门徒将活着的根据，即耶稣自己活着；“因为”清楚保留因果关系。
- source_word: ἐγὼ ζῶ
  choice: 我活着
  rationale: 保留希腊文现在时和简洁有力的表述，不将其限定为某一种生命状态。
- source_word: καὶ ὑμεῖς ζήσετε
  choice: 你们也将活着
  rationale: “将”明确表达未来时，“也”对应 καί，并凸显门徒的生命与耶稣的生命之间的关联。
theological_decisions:
- issue: 门徒“看见”耶稣的含义
  choice: 正文只译作“看见”，不具体限定所指。
  alternative: 可理解为复活后亲眼看见耶稣、凭信心属灵地认识复活的耶稣，或兼含这两层意义。
  rationale: 原文没有明说是哪一种看见；约翰的语境可能具有多重回响，因此应保留其张力。
- issue: “你们也将活着”的生命范围
  choice: 宽泛地译作“你们也将活着”。
  alternative: 可特指分享耶稣复活的生命、与他联合所得的属灵生命，或兼有现在与末后的层面。
  rationale: ζήσετε 的含义具有神学厚度；正文不应把它缩窄为肉身存活、现今属灵生命或末日复活中的单一一种。
- issue: “因为我活着”与门徒生命的关系
  choice: 保留直接的因果陈述，不补充其实现方式。
  alternative: 可释为门徒因复活的基督、与基督联合或末后的复活而得生命。
  rationale: ὅτι 明示耶稣的生命是门徒生命的根据，但本句并未进一步说明这种关联如何实现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“再过不久”自然表达临近的时间转折；“世人”使主语符合汉语习惯；“却”突出对比。正文简洁，不把“看见”和“活着”的多层含义提前解释进译文。
