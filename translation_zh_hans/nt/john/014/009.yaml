id: JHN.14.9
reference: John 14:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: zh_hans
  text: 耶稣对他说：“我和你们在一起这么久了[a]，腓力，你还不认识我吗？看见了我的人，就是看见了父。你怎么能说‘把父显给我们看’呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我同你们相处了这么长时间。”
    reason: 原文Τοσούτῳ χρόνῳ可用这一较完整的方式表达持续时间；正文采用更自然简洁的“这么久了”。
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: 这么久了
  rationale: 该与格短语表示持续的时间；“这么久了”符合现代汉语习惯，也保留了耶稣问话中的感叹和责备语气。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: 我和你们在一起
  rationale: ὑμῶν为复数，表明耶稣所说的不只是腓力一人；汉语结合“这么久了”即可自然表达从过去持续到当下的状态。
- source_word: οὐκ ἔγνωκάς με
  choice: 你还不认识我吗
  rationale: ἔγνωκας为完成时，指经过长久相处仍未达到认识耶稣的状态；“还不认识”既自然，又传达上下文中的责问意味。
- source_word: Φίλιππε
  choice: 腓力
  rationale: 采用该人名在现代中文圣经中的通行译名，并保留呼格在问句中的直接称呼。
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: 看见了我的人
  rationale: 带冠词的完成时分词作名词使用；译为“……的人”清楚自然，“看见了”保留其已经看见而结果仍然有效的意味。
- source_word: ἑώρακεν τὸν πατέρα
  choice: 就是看见了父
  rationale: 直译“看见了父”，不弱化为仅仅看见父的样式，也不加入原文没有明说的本体论解释；“就是”使前后两句在汉语中衔接清楚。
- source_word: πῶς σὺ λέγεις
  choice: 你怎么能说
  rationale: πῶς在此构成表达惊讶和责问的反问；“怎么能说”自然传达这种修辞力度，σὺ所强调的第二人称由明确的“你”体现。
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: 把父显给我们看
  rationale: δείκνυμι意为使人看见、展示；“显给我们看”保留直接祈使的表达，ἡμῖν的复数则译作“我们”。
theological_decisions:
- issue: 看见耶稣与看见父之间的关系
  choice: 直译为“看见了我的人，就是看见了父”
  alternative: 弱化为“就看见父是怎样的”，或扩写成后期信经的本体论表述
  rationale: 原文作出强烈而直接的基督论宣告。译文既不把它减弱为相似或代表关系，也不添加本节未明说的教义术语，从而保留原句的力度与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“你们”保留μεθ’ ὑμῶν的复数，以“你”保留对腓力的单数责问；“父”沿用约翰福音中作为称谓的简洁表达，不擅自增译“我的父”。
