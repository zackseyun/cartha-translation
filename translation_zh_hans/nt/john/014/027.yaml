base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: zh_hans
  text: 我把平安留给你们；我把我的平安赐给你们。我赐给你们，不像世界所赐的。你们心里不要忧愁，也不要胆怯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胆怯”也可译作“害怕”或“丧胆”。希腊语动词含有因惧怕而变得胆怯、失去勇气的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: 平安
  rationale: “平安”是现代汉语圣经语境中自然且宽广的对应词，既可涵盖安宁，也不把约翰语境中的整全、福祉等意蕴缩窄为单纯的内心平静。
- source_word: ἀφίημι
  choice: 留给
  rationale: 在以“平安”为宾语时，“留给”自然表达离别之际留下某物；不采用“遗赠”，以免把可能的遗嘱色彩强化为明说。
- source_word: εἰρήνην τὴν ἐμὴν
  choice: 我的平安
  rationale: 保留所有格所强调的归属，清楚区别耶稣所赐的平安与世人所能给予的。
- source_word: δίδωμι
  choice: 赐给
  rationale: “赐给”符合耶稣向门徒给予平安的庄重语境，并保留两次 δίδωμι 与世人“所赐”的重复和对比。
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: 我赐给你们，不像世人所赐的
  rationale: 保持耶稣之给予和 κόσμος 之给予的明确对比，同时采用自然的现代汉语语序。
- source_word: κόσμος
  choice: 世人
  rationale: 此处比较的是给予的主体和方式；“世人”在汉语中比“世界”作施予者更自然，同时仍保留与耶稣相对的人世秩序之意。
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: 你们心里不要忧愁
  rationale: “心里不要忧愁”是自然、庄重的现代汉语，并与约翰福音14:1的表达相呼应；“心里”也自然传达复数所有者配单数“心”的集合性表达。
- source_word: μηδὲ δειλιάτω
  choice: 也不要胆怯
  rationale: “胆怯”直接表达 δειλιάω 所含因惧怕而失去勇气的意思，并与前面的“忧愁”保持词义区别。
theological_decisions:
- issue: 耶稣所赐之平安的性质
  choice: 正文仅译作“平安／我的平安”，不进一步限定其性质。
  alternative: 可解释为内心安宁、末世性的整全福祉，或与神和好。
  rationale: 本节没有把“平安”限定为其中某一方面；采用宽广的词语可保留其神学内涵与张力，避免把解释写入正文。
- issue: κόσμος 在约翰语境中的所指
  choice: 译作“世人”，突出作为给予者的人世一方，但不附加“堕落”等限定。
  alternative: 可译作“世界”或“世俗”。
  rationale: “世人”适合汉语中“给予”的搭配；不译为“世俗”，避免提前加入价值判断并缩窄约翰用语的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两句保留“平安”和“赐给”的重复，以呈现原文的修辞重点；末句用“忧愁／胆怯”区分两个希腊动词。脚注标记置于其所说明的“胆怯”之后。
