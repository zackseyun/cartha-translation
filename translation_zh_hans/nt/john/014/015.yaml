  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: zh_hans
  text: 如果你们爱我，就会持守我的诫命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就会遵守我的命令”。译作“持守”的词也可表示守护、谨守或遵行。
    reason: 说明τηρέω和ἐντολή的词义选择，并提供更通俗的表达。
lexical_decisions:
- source_word: Ἐὰν
  choice: 如果
  rationale: 引出条件从句；“如果”自然保留其条件性，不把它强化为反复发生的“每当”。
- source_word: ἀγαπᾶτέ
  choice: 你们爱
  rationale: 现在时主动语态虚拟式第二人称复数；在ἐάν之后构成条件句，现代汉语自然译为“你们爱”。
- source_word: με
  choice: 我
  rationale: 宾格单数代词，指耶稣，是“爱”的直接宾语。
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: 我的诫命
  rationale: “诫命”保留ἐντολή在约翰著作中的分量和可辨识用语；希腊语冠词加物主词的结构在汉语中自然表达为“我的”。
- source_word: τηρήσετε
  choice: 就会持守
  rationale: 将来时主动语态直陈式第二人称复数。“就会”保留将来陈述而不改写成命令；“持守”兼顾守护、谨守、遵行等语义，比单纯强调服从更宽广。
theological_decisions:
- issue: τηρήσετε应译作命令，还是保留为将来陈述
  choice: 保留为将来陈述：“就会持守”
  alternative: 命令式理解：“要持守我的诫命”
  rationale: 现有希腊文本是将来时直陈式，不是命令式。译文因此保留“爱耶稣”与“持守其诫命”之间的陈述关系，不把其中的神学张力化约为直接劝令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们”明确原文第二人称复数；“诫命”保留约翰语境中的用词分量；“持守”虽略带经文语体，但现代读者仍可理解，并较完整地传达原词的宽广含义。
