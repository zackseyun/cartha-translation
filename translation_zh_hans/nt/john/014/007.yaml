  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: zh_hans
  text: 你们若已经认识我，也就会认识我的父。从现在起，你们就认识他，并且已经看见他了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: 认识
  rationale: 两处动词虽分别来自 γινώσκω 的过去完成时与现在时，但都表达对位格的认识；统一译为“认识”，并借助句式和时间语体现时态差异。
- source_word: ἂν ᾔδειτε
  choice: 也就会认识
  rationale: 表达与前句未实现条件相应的结果，现代汉语用“也就会”自然呈现反事实意味。
- source_word: ἀπ’ ἄρτι
  choice: 从今以后
  rationale: 准确表达由当前时刻开始的时间转折，也符合庄重自然的现代汉语。
- source_word: ἑωράκατε
  choice: 已经看见
  rationale: 用“已经”体现完成时所强调的既成经验及其当前效力。
theological_decisions:
- issue: 门徒是否已经认识并看见父
  choice: 保留“从今以后，你们认识他，并且已经看见他”的肯定陈述
  alternative: 译成命令或仅指将来的认识与看见
  rationale: 希腊文 γινώσκετε 可有直陈式或命令式的形式歧义，但与 καὶ ἑωράκατε（“并且已经看见”）并列时，直陈式理解更自然；不额外解释这种认识如何借着耶稣发生。
- issue: 反事实条件所暗示的责备程度
  choice: 译作“你们若认识我，也就会认识我的父”
  alternative: “你们若早已认识我，也早就会认识我的父”
  rationale: 过去完成时配合 ἄν 表达未实现条件，但不在正文中加入“早已／早就”，以免强化原文未明确说明的时间或责备色彩。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“我的父”保留耶稣与父之间的关系表达；不增加解释性称谓。
