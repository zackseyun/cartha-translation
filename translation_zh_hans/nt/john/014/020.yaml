  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: zh_hans
  text: 到那日，你们将知道：我在我父里面，你们在我里面，我也在你们里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文三次重复使用“在……里面”这一表达；也可译为“与……联合”，但后一译法解释性较强。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到那日
  rationale: 这是表时间的介词短语；“到那日”符合现代汉语习惯，并保留ἐκείνῃ所指向的特定时日及将来临到的意味。
- source_word: γνώσεσθε ὑμεῖς
  choice: 你们就会知道
  rationale: γνώσεσθε指将来的认识或领会；“会知道”自然且不额外强调认识的过程。显式的ὑμεῖς由“你们”表达，“就”也使句子的预期和强调在汉语中更清楚。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出“知道”的内容，而非原因；汉语用冒号自然地引出其后的三重陈述。
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: 我在我的父里面
  rationale: 保留ἐν的空间性隐喻，不将其释义为“与父联合”或直接改写为本体论表述；“我的父”明确保留亲属领属关系。
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: 你们在我里面
  rationale: 原文是省略系词的分句，汉语无需补入“是”；继续使用“在……里面”，保留约翰文本中彼此内住的对应结构。
- source_word: κἀγὼ ἐν ὑμῖν
  choice: 我也在你们里面
  rationale: κἀγώ在此为“我也／而我”；“也”自然承接前一分句，同时保留相互内住的表达。
theological_decisions:
- issue: 约翰著作中重复的内住语言（ἐν……ἐν……ἐν）
  choice: 三处均译作“在……里面”
  alternative: 译作“与……联合”或“同……合一”
  rationale: 原文重复同一介词，形成耶稣与父、门徒与耶稣、耶稣与门徒之间层层对应的关系。直译其隐喻可保留关系、联合与内住等多重含义，而不把经文限定为某一种神学解释。
- issue: 耶稣与父的关系
  choice: 我在我的父里面
  alternative: 我与父本质相同；我和父在一起
  rationale: 该译法既不削弱原句的基督论分量，也不把后来的教义术语直接写入正文，忠实保留原文自身的表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到那日”比“在那日”更符合本句面向未来的语境；三次保留“在……里面”，虽略带经文语体色彩，却能准确呈现原文刻意重复的结构和未被限定的神学张力。
