  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: zh_hans
  text: 现在，我在事情发生以前就已经告诉你们了[a]，好让事情发生的时候，你们可以相信[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事情发生”也可译作“这事成就”。
    reason: lexical_alternative
  - marker: b
    text: “相信”也含“信赖”的意思；原文没有明确说明是开始相信，还是信心得到坚固。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: νῦν表示当前时点；καί在这里承接上文。汉语直接用“现在”即可自然保持话语连续性，不必机械译出“并且”。
- source_word: εἴρηκα ὑμῖν
  choice: 我……已经告诉你们了
  rationale: εἴρηκα是完成时，表示先前说出而其结果延续到现在；“已经告诉你们了”自然体现这种完成并存留的意味，也明确表达ὑμῖν的间接宾语。
- source_word: πρὶν γενέσθαι
  choice: 在事情发生以前
  rationale: πρίν加不定式表示“在……以前”；γίνομαι在此指隐含事件的发生。补出“事情”符合汉语表达，并与下文同一动词的重复相呼应。
- source_word: ἵνα
  choice: 好让
  rationale: ἵνα引出目的。“好让”是自然、清楚的现代汉语目的表达。
- source_word: ὅταν γένηται
  choice: 事情发生的时候
  rationale: ὅταν加虚拟式指将来情形发生之时；沿用“发生”保留上下两处γίνομαι的词语呼应。
- source_word: πιστεύσητε
  choice: 你们可以相信
  rationale: πιστεύω在约翰福音中通常译作“相信”，同时可含信赖之意；ἵνα后的虚拟式在此以“可以”表达目的所指向的结果，而不限定为初信或继续相信。
theological_decisions:
- issue: πιστεύσητε在本节中是初次相信还是信心得到坚固
  choice: 你们可以相信
  alternative: 你们可以继续相信／更加相信
  rationale: 希腊文本本身没有明确限定是开始相信还是信心得到坚固；采用较宽泛的“相信”，保留上下文中的神学张力，不替读者预先裁定。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“事情发生”清楚易懂，并在前后两处保持对γίνομαι的重复翻译；“好让”自然表达目的。所有脚注标记均置于正文相应位置。
