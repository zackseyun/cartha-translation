  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: zh_hans
  text: 我若去为你们预备地方，就再来，把你们接到我这里[a][b]，使你们也在我所在的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“来”采用现在时形式，但在这里具有将来意义；也可译作“我还要再来”。
    reason: 说明希腊文时态形式及可行译法。
  - marker: b
    text: 对于“再来”具体指什么，解释不一：可能特指耶稣复活后的显现、圣灵的来到、耶稣末后的再临，也可能是一项包含不止一种应验的应许。
    reason: 保留经文所容许的不同理解，不在译文中限定其所指。
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: 我若去
  rationale: ἐάν加不定过去时虚拟语气表达面向将来的条件；“我若去”简洁、自然，也保留条件意味，不把“去”扩释为“离世”。
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: 为你们预备地方
  rationale: ἑτοιμάζω意为“预备、准备好”，τόπος意为“地方”；译文不进一步限定这个地方的性质。
- source_word: πάλιν ἔρχομαι
  choice: 就会再来
  rationale: πάλιν表示“再、又”，ἔρχομαι虽采用现在时形式，在本语境中却指向将来。“会再来”是自然的现代汉语表达；原文的时态形式另以脚注说明。
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: 接你们到我身边
  rationale: παραλαμβάνω在这里表示把人接来、带入自己的同在中；πρὸς ἐμαυτόν具有鲜明的关系意味，因此用“到我身边”，比单说“接走”更完整。
- source_word: ἵνα
  choice: 使
  rationale: ἵνα引出目的；“使”以简洁而庄重的现代汉语保留目的关系。
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: 我在哪里
  rationale: 译出地点从句，并以正常汉语语序自然呈现显式主语ἐγώ，不额外加入可能过度强调的“我本人”。
- source_word: καὶ ὑμεῖς ἦτε
  choice: 你们也在哪里
  rationale: καί译作“也”，保持门徒与耶稣所在之处的对应。ἦτε是ἵνα目的从句中的虚拟语气；汉语由“使”表达这一结构，无须另加情态词。
theological_decisions:
- issue: πάλιν ἔρχομαι所指的耶稣再来
  choice: 译作面向将来的应许“会再来”，不在正文中限定其具体方式或时间。
  alternative: 可专指耶稣复活后的显现、圣灵的来到、末后的再临，或是兼含多重应验的应许。
  rationale: 经文清楚应许耶稣将再次临到，并把门徒接到自己身边，却没有在本句中明确界定这一“再来”的全部所指。译文与脚注保留这种诠释张力，不引入较窄的教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“预备地方”保留原文的简洁；“接你们到我身边”自然表达关系性的同在；整句沿用条件—结果—目的的逻辑结构。两个脚注都置于“再来”之后，以准确对应所说明的词语。
