revisions:
- from: 我若去为你们预备地方，就会再来[a][b]，接你们到我身边，使我在哪里，你们也在哪里。
  to: 我若去为你们预备地方，就再来，把你们接到我这里[a][b]，使你们也在我所在的地方。
  rationale: 修订仅澄清末句的目的结构和地点对应，并将“接到我身边”调整为更自然、贴近πρὸς ἐμαυτόν的“接到我这里”。“再来”的语义及两项脚注的解释范围保持不变；脚注锚点移至“我这里”之后会错误地暗示脚注说明“我这里”，因此应保留在“再来”之后。为此，正文的锚点应排作“就再来[a][b]，把你们接到我这里”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了将来的条件（“若去”）、预备地方、再次来到，以及把门徒带到耶稣自己那里。可是末句“使我在哪里，你们也在哪里”在现代汉语中不够自然，且“你们也在哪里”容易被理解为与“我在哪里”并列提问或单纯陈述，未清楚表达ἵνα引出的目的：门徒也要在耶稣所在之处。
  naturalness: “我若去为你们预备地方，就会再来”自然、庄重。“接你们到我身边”可以理解，但“接你们到我这里”更符合现代汉语，也更贴近“接到我自己这里”的关系性表达。末句宜明确为“使你们也在我所在的地方”。
  terminology: “预备地方”“再来”均恰当，并未预先界定“再来”的具体方式。“我所在的地方”保留τόπος及“我在哪里”的空间对应，不对其性质作教义性扩充。
  issues:
  - severity: medium
    issue: 末句“使我在哪里，你们也在哪里”句法不自然，目的关系和“你们也在耶稣所在之处”的意思不够明确。
    rationale: ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε的重点是“使你们也在那里”。改为“使你们也在我所在的地方”既自然，又保留目的从句和地点对应。
  - severity: low
    issue: “接你们到我身边”可作更自然的关系性表达。
