  text: How sweet every kind of death is for our ancestral godliness! And he spoke to the tyrant,[a]
translation:
  language: zh_hans
  text: “因着我们祖先传下来的敬虔[a]，无论以何种方式死去，都是何等甘甜！”他又对暴君说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔敬”，指从祖先承受、向上帝所存的敬畏与忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς ἡδὺς
  choice: 都是多么甘甜
  rationale: 保留感叹语气以及“甘甜”这一鲜明的修辞悖论；此处说死亡因忠于敬虔而变得可欣然接受，并非称死亡本身舒适。
- source_word: πᾶς τρόπος θανάτου
  choice: 无论怎样死
  rationale: 自然表达其周遍、分举含义，即任何形式或方式的死亡；比“每一种死亡方式”更符合现代汉语。
- source_word: διὰ τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: 为了我们祖传的敬虔
  rationale: διὰ加宾格可表达缘由或动因；“为了”在殉道语境中自然传达因持守此敬虔而赴死。πάτριος强调祖先传承，εὐσέβεια则指对上帝的虔敬与由此而来的忠贞。
- source_word: ἔφη τε πρὸς τὸν τύραννον
  choice: 接着，他对暴君说
  rationale: ἔφη是引出直接言语的常用动词；τε承接叙述，译作“接着”。τύραννος带有贬义评价，故译“暴君”，不弱化为中性的“君王”。
theological_decisions:
- issue: 殉道语境中 εὐσέβεια 的译法
  choice: 敬虔
  alternative: 虔敬；祖传的信仰
  rationale: “敬虔”既保留对上帝的敬畏和忠诚，也不把该词缩减为单纯的文化传统；“祖传的信仰”虽较通俗，却会扩大原词的语义范围。
- issue: διὰ 所表达的关系
  choice: 为了
  alternative: 因为；由于
  rationale: 原文可指原因或动因。“为了”贴合人物因忠守祖传敬虔而接受死亡的语境，同时不把敬虔误解为机械造成死亡的原因。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事语言。“无论怎样死”避免生硬名词化，“甘甜”保留原文强烈的殉道修辞。句末用冒号，表明“他对暴君说”引向下文。
