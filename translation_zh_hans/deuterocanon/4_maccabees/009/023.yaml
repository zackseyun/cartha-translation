base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: zh_hans
  text: 他在刑架上[a]说：“兄弟们，要效法我。我既没有离开这场争战，你们也不可作逃兵[b]；也不要因我而背弃这勇毅的弟兄情谊。你们要为敬虔[c]投身这场神圣而高尚的战役，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受刑时”。希腊文表达较为困难，但似乎具体使人想到施刑用的刑架。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“离队”或“弃守阵列”。原词带有军事意味。
    reason: lexical_alternative
  - marker: c
    text: 或译“虔诚”。这里的“敬虔”指对上帝忠贞的敬畏与委身，并包括由此而来的生活实践。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: 在刑架上
  rationale: 此处形式和句法较为困难，但语境指向刑架一类的刑具；采用具体形象，同时在脚注保留较宽泛的译法。
- source_word: Μιμήσασθέ με
  choice: 要效法我
  rationale: 保留不定过去时命令语气的直接劝勉；“效法”比“模仿”更适合以坚忍榜样为语境的庄重表达。
- source_word: ἀδελφοί
  choice: 兄弟们
  rationale: 叙事中说话者面对的是自己的亲兄弟，因此按具体语境保留阳性复数称呼。
- source_word: μὴ λειπὼν τὸν ἀγῶνα
  choice: 我既没有退出这场争战
  rationale: ἀγών可指竞赛、抗争或争战；这里与后续军事意象相连。“既”自然表达分词结构可能具有的原因意味，但没有把关系解释得过满。
- source_word: λειποτακτήσητε
  choice: 作逃兵
  rationale: 该动词带有离队、弃守的军事色彩；“作逃兵”简洁保留这一隐喻，而不添加原文没有明说的“岗位”。
- source_word: ἐξομόσησθέ
  choice: 背弃
  rationale: 该词可指发誓否认或断然弃绝；“背弃”在现代汉语中庄重自然，又不强行加入原文未必强调的起誓行为。
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: 这勇毅的弟兄情谊
  rationale: εὐψυχία指逆境中的勇气和高昂心志；“勇毅”兼有勇敢与坚忍意味，“弟兄情谊”保留共同体和亲属纽带。
- source_word: στρατείαν στρατεύσασθε
  choice: 投身……战役
  rationale: 希腊文以同根名词和动词强化军事意象。汉语不宜机械重复，故用“投身……战役”保留积极参战的力度。
- source_word: ἱερὰν καὶ εὐγενῆ
  choice: 神圣而高尚
  rationale: 分别传达宗教上的神圣性和品格、荣誉上的高贵性，符合现代庄重汉语。
- source_word: περὶ τῆς εὐσεβείας
  choice: 为敬虔
  rationale: εὐσέβεια在本书中是核心德目，指向对上帝忠贞的敬畏与生活实践；“敬虔”比单纯“虔诚”更能承载这一伦理和信仰内涵。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔诚；对上帝的虔敬
  rationale: “敬虔”既涵盖内在敬畏，也可包括受迫害时对上帝的忠贞行动；不把它缩减为情感或礼仪表现。
- issue: ἀδελφοί所指的性别与关系
  choice: 兄弟们
  alternative: 弟兄姊妹；手足们
  rationale: 本叙事所指为实际的男性兄弟，并非泛指男女混合的信仰群体，故保留具体称谓。
- issue: μου与“勇毅的弟兄情谊”的关系
  choice: 因我而背弃这勇毅的弟兄情谊
  alternative: 背弃我这勇毅的弟兄情谊；否认与我共有的勇毅弟兄情谊
  rationale: 原句中μου的句法关联并不完全透明；正文采用较少限定的因由表达，不将其武断解释为所有格或排除说话者，同时以备选译法提示可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“争战—逃兵—战役”维持原文连续的竞赛与军事意象；引语结尾保留逗号，因为所给经节在句法上尚未结束。所有脚注标记均置于正文相应词语之后。
