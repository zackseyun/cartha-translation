base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: zh_hans
  text: “他们为德行而不可战胜[a]。”他还在说这些话时，他们就在他身下铺设火，并加大轮子[b]所施的力，把他拉得更紧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为德行而”也可译作“为了德行”或“为德行的缘故”。希腊语可指为德行而行动，也可指为德行而受苦。
    reason: lexical_alternative
  - marker: b
    text: 这里的“轮子”指用于施行酷刑的刑轮。
    reason: cultural_note
  - marker: c
    text: 末尾的希腊语动词较难确定，表达的是进一步增加拉力，或把受刑者在轮上拉得更紧。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: 为德行的缘故
  rationale: ὑπέρ加属格表示“为了、因着……的缘故”。这里既可指为德行而行动，也可指为德行而受苦；正文采用自然而不过度限定的表达，并以脚注保留其范围。
- source_word: ἀνίκητοι
  choice: 不可征服的
  rationale: 该词指不能被击败或征服。此处重在殉道者虽受酷刑仍不屈服，“不可征服”既保留原文力度，也避免增添军事行动的意象。
- source_word: ταῦτα λέγων ἔτι
  choice: 他还在说这些话时
  rationale: ἔτι与现在分词λέγων共同表现话尚未说完，随后的施刑动作已经发生；“这些话”对应复数ταῦτα。
- source_word: πῦρ ἐπέστρωσαν
  choice: 又在他身下铺上火
  rationale: ἐπιστρώννυμι有铺设、铺开的意思；结合受刑场景，火被铺设在受刑者下方。“他”和方位由上下文补明，使汉语可理解而不改变动作性质。
- source_word: διερεθίζοντες τὸν τροχόν
  choice: 并加剧轮子的作用
  rationale: διερεθίζω表示激起、增强或加剧。原文未明确说“转动”，因此不用会增添具体机械动作的译法；“加剧……的作用”保留其语义，同时承认表达在此处较难确定。
- source_word: προσεπικατέτεινον
  choice: 把他绷得更紧
  rationale: 这个多重前缀的动词带有进一步加强拉紧或伸展的意味。在刑轮语境中，译为把受刑者绷得更紧，体现酷刑的升级，但不武断说明具体装置结构。
theological_decisions:
- issue: 如何翻译具有希腊伦理哲学色彩的ἀρετή
  choice: 德行
  alternative: 美德；卓越品格
  rationale: 《马加比四书》以希腊伦理哲学词汇描述敬虔、理性与坚忍。“德行”能保留这一概念背景，又不引入后期宗派术语。
- issue: 是否在正文中明确τροχός是刑具
  choice: 正文保留“轮子”，脚注说明是刑轮
  alternative: 直接译作“刑轮”
  rationale: 希腊文只说“轮子”；正文保持词面透明度，脚注则提供理解受刑场景所需的文化信息。
- issue: ὑπὲρ ἀρετῆς是否限定为受苦或争战
  choice: 为德行的缘故
  alternative: 为德行受苦；为德行而战
  rationale: 原短语可概括为某一缘故而行动或受苦，未明说“受苦”或“争战”；采用较开放的表达，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。第一句保留格言式语气；酷刑描写尽量具体，但不把希腊文未明说的“转动”等机械动作加入正文。所有脚注标记均置于相应词句之后。
