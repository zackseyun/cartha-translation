base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/026.yaml
  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: zh_hans
  text: 众人都惊叹他坚忍不屈的心志。随后，卫兵把年龄排在前一人之后、居第二位的那人带来[a]，给他装上带有尖利爪的铁手[b]，又把他绑在刑具和投石机上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“按年龄在前一人之后居第二的”，即按年龄次序指认此人。
    reason: lexical_alternative
  - marker: b
    text: “铁手”是直译；下文说明其带有尖利的指甲或爪，可能指一种装在受刑者身上的金属刑具。
    reason: cultural_note
  - marker: c
    text: “投石机”也可理解为“机械刑具”或“刑架”。希腊词通常指投射武器，但在这里可能指用于拉扯或固定受刑者的机械装置。
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμασάντων
  choice: 众人都惊叹……随后
  rationale: 这是属格独立结构中的不定过去分词，表示众人的惊叹发生在卫兵随后行动之前；汉语用分句加“随后”自然表达这一先后关系。
- source_word: καρτεροψυχίαν
  choice: 坚忍不屈的心志
  rationale: 该词指人在苦难中内心坚定、持续忍耐；此译兼顾“坚忍”和内在意志，避免只译为一般的勇敢。
- source_word: δορυφόροι
  choice: 卫兵
  rationale: 字面可指“持矛者”，也常指护卫；在此叙事中指押送并施刑的人，“卫兵”符合其职能而不过度拘泥于武器形象。
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: 年龄仅次于先前那人的一位
  rationale: 原文按年龄次序指认此人。译文保留“仅次于先前那人”的关系，不擅自补入原句未明说的具体亲属称谓。
- source_word: σιδηρᾶς χεῖρας
  choice: 铁手刑具
  rationale: 字面为“铁手”，结合下文的尖利爪钩，显然是手形或抓握式的金属施刑器具；加“刑具”帮助现代读者理解，同时保留“铁手”意象。
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: 带有尖利爪钩的
  rationale: ὄνυξ可指指甲、爪或钩状尖端；在刑具语境中，“爪钩”能表达其尖锐、钩抓的形状。
- source_word: ὀργάνοις
  choice: 刑具
  rationale: 该词一般指工具或器械；上下文明确是施刑场景，因此译作“刑具”既自然又符合语境。
- source_word: καταπέλτῃ
  choice: 投石机
  rationale: 该词通常指古代的投射武器或投石机。主文保留其通常词义，不把此处可能的特殊刑具用法直接确定为“刑架”。
- source_word: προσεδήσαν
  choice: 把他绑在……上
  rationale: 该动词表示将人捆绑、固定在某物上；此译直接清楚地呈现动作及其对象。
