base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: zh_hans
  text: “世上最残暴的暴君啊，你难道不觉得，你如今所受的折磨比我更大，因为你看见你暴政中那狂妄的盘算[a]，正被我们因自己的敬虔而有的坚忍[b]所征服吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盘算”也可译作“心思”“思量”或“心态”。希腊词 λογισμός 可指推理、思想或支配性的思维取向；这里指暴政背后狂妄的统治心态或谋算。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“因我们的敬虔而有的坚忍”或“因我们的虔诚而有的坚忍”。原文的短语可指这坚忍是由他们的敬虔所促成。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: 你难道不觉得吗
  rationale: 保留反问和当面对质的语气；“觉得”自然表达 δοκεῖς 在此处的判断义。
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: 世上最残暴的暴君
  rationale: 用“最残暴”表达 ὠμότατε 的最高级，并以“世上”自然传达 πάντων 所加强的极端程度。
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: 你现在所受的折磨比我更甚
  rationale: 保留 βασανίζεσθαι 的折磨意象和受难者反讽式的角色倒置，同时符合现代汉语表达。
- source_word: ὁρῶν
  choice: 因为你眼看着
  rationale: 将分词理解为带原因意味的伴随情状；“眼看着”突出暴君亲见失败，且不掩盖其与主句的因果联系。
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: 你那暴政的狂妄心思
  rationale: λογισμός 可指思量、思想或支配性的心态；此处“心思”既保留认知层面，也适合暴政人格化的语境。“狂妄”准确传达 ὑπερήφανον。
- source_word: ὑπὸ τῆς ... ὑπομονῆς
  choice: 被……坚忍所胜
  rationale: “坚忍”表达 ὑπομονή 在苦难中持守不屈的含义；被动结构保留 νικώμενον 与 ὑπό 短语的征服意象。
- source_word: διὰ τὴν εὐσέβειαν ἡμῶν
  choice: 我们为虔敬上帝而有的
  rationale: εὐσέβεια 在本书语境中指向对上帝的敬虔忠贞；此译明确其对象，并让 διά 的动机或缘由含义修饰“坚忍”。
theological_decisions:
- issue: 殉道语境中 εὐσέβεια 的表达
  choice: 虔敬上帝
  alternative: 敬虔；因我们的虔敬
  rationale: 明确这是向着上帝的虔敬，而非泛指礼貌或宗教仪式；同时避免加入特定宗派含义。
- issue: λογισμός 在《马加比四书》理性主题中的含义
  choice: 心思
  alternative: 思量；思想；理性谋算
  rationale: 原词在本书常带理性、思考或主导原则的色彩；本节又指暴君狂妄的统治心态。“心思”保留语义宽度，不把它过度限定为纯逻辑推理或单纯意志。
- issue: ὁρῶν 与主句的逻辑关系
  choice: 因为你眼看着
  alternative: 当你看见；眼看着
  rationale: 该分词既可作伴随情状，也自然带出暴君更受折磨的原因。正文采用因果表达以使汉语清楚，但不把“看见”弱化为仅仅抽象知道。
translation_notes:
  register: 采用庄重而直接的现代标准汉语，保留殉道者向暴君发出的强烈反问、折磨意象和“暴政反被坚忍征服”的反讽。正文中的所有脚注标记均有对应脚注。
