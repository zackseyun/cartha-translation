base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/007.yaml
  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: zh_hans
  text: 所以，暴君啊，尽管试试看吧！即使你因我们的虔敬而杀害我们，也不要以为用酷刑折磨我们就能伤害我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“即使你因我们的虔敬而杀死我们的生命，也不要以为你折磨我们是在伤害我们。”这里“生命”所译的希腊词也可指“人”或“性命”。
    reason: 说明ψυχή在本句中的宽广语义，并交代正文为何采用自然的“杀害我们”，同时保存原文关于死亡与真正伤害的张力。
lexical_decisions:
- source_word: πεῖραζε
  choice: 尽管试试看吧
  rationale: 此处是对暴君的挑战性命令，既可表示“试一试”，也含“考验、试探”之意；结合酷刑语境，用“尽管试试看吧”自然传达蔑视和勇毅。
- source_word: ψυχὰς
  choice: 我们
  rationale: ψυχή在此与θανατόω连用，指可被杀害的生命或人本身，而非专指与身体相对的“灵魂”；汉语正文用“杀害我们”最自然，也避免暗示暴君能毁灭灵魂。
- source_word: εὐσέβειαν
  choice: 虔敬
  rationale: 保留该词对上帝的敬畏、忠诚与敬虔实践的宗教内涵。
- source_word: βλάπτειν
  choice: 伤害
  rationale: 直译其损害、加害之意，并保留肉体受刑却不构成真正伤害的张力。
- source_word: βασανίζων
  choice: 用酷刑折磨
  rationale: 明确表达审讯或刑罚语境中的严酷折磨，强于一般的“使受苦”。
theological_decisions:
- issue: 暴君杀害ψυχαί与殉道者不受真正伤害之间的张力
  choice: 正文译作“杀害我们”，并保留“不要以为……就能伤害我们”
  alternative: “杀死我们的灵魂”或“夺去我们的生命”
  rationale: “杀死灵魂”在现代汉语中容易造成不必要的灵魂毁灭论含义；“夺去我们的生命”虽清楚，却稍弱化原文ψυχή的语义张力。所选译法忠实表达肉身死亡与终极损害之间的对照，而不替作者解释其完整的人论。
translation_notes:
  register: 采用现代、庄重而有挑战力度的口吻。“暴君啊”保留直接呼语；“尽管试试看吧”表现殉道者面对酷刑时的无畏。句子结构清晰，适合普通现代读者。
