lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: 全身的肢体一处一处
  rationale: 该分配性短语直指身体的各个肢体；“一处一处”自然表达逐一受刑的意味，同时不把次序说得过于确定。
- source_word: κλώμενος
  choice: 被折断
  rationale: 这个现在分词描写受刑时身体遭折断的持续过程；采用被动表达，直接保留原文的肉体性意象。
- source_word: κατηγόρει
  choice: 仍不断斥责他们
  rationale: 未完成时表示持续或反复的行动；在受刑语境中，κατηγορέω更自然地指向对施刑者的谴责，而非正式的司法控告。“仍”体现他虽遭折磨却继续说话的语境关系。
- source_word: λέγων
  choice: 说
  rationale: 分词用于引出下一节的直接引语；以“说：”自然衔接后文，并保留句子的开放结构。
