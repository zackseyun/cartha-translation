base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: zh_hans
  text: 但如果希伯来人的老者因敬虔而忍受酷刑并死去，那么我们这些年轻人不顾你为强迫我们所施的酷刑而死，岂不更为正当吗？那位年迈的教师也曾战胜这些酷刑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 指对上帝的虔敬与忠诚；“敬虔”既保留宗教含义，也符合本书的伦理语境。
- source_word: δικαιότερον
  choice: 更应当
  rationale: 原词为比较级，字面可作“更合乎正义地／更理所当然地”；在“去死”的语境中译作“更应当”较自然，并保留说话者由老者推及青年人的道德论证。
- source_word: ὑπεριδόντες
  choice: 蔑视
  rationale: 该词在此表示不把酷刑放在眼里、毅然无视其威吓；“蔑视”比单纯的“忽视”更能传达主动抗拒。
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  choice: 你为强迫我们而施加的酷刑
  rationale: 属格结构表达以酷刑实施强迫；此译明确汉语关系，又不把复数 ἀναγκῶν 过度具体化为某种特定制度。
- source_word: παιδευτὴς γέρων
  choice: 年迈的老师
  rationale: παιδευτής 指教导、训育他人的人；“老师”自然易懂，并保留其教导者身份，γέρων 则译为“年迈的”。
- source_word: ἐνίκησεν
  choice: 战胜
  rationale: 保留胜利隐喻，表达老者虽受刑而死，却在忠贞与意志上胜过了酷刑。
theological_decisions:
- issue: 因敬虔受死是否表达功德或得救机制
  choice: 按原文直译为“因敬虔而忍受酷刑，直至死去”
  alternative: 解释为“靠敬虔赢得救恩”或“为了宗教信仰而死”
  rationale: 原文说明忍受酷刑与敬虔之间的缘由关系，但未在此界定功德、称义或救恩机制，因此不作教派化扩充。
- issue: 受刑而死却被称为“战胜”酷刑的张力
  choice: 保留“战胜”这一悖论性表述
  alternative: 弱化为“忍受住了”
  rationale: 原文使用胜利动词，强调道德与属灵层面的胜利；不应因其肉身死亡而消解这一张力。
translation_notes:
  register: 采用庄重而现代的叙事语言。“岂不更应当去死吗”把希腊文条件句所引出的比较性劝勉自然呈现为汉语反问；分号使末尾关系从句的指向清楚，避免误读为老师战胜了施刑者本人。
