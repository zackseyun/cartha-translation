  text: And after saying this[a], the devout young man breathed his last.
translation:
  language: zh_hans
  text: 他说完这些话，那位虔敬的青年便断了气[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“交出了他的魂（或生命）”；这里的希腊语表达是指他死了。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 便
  rationale: 承接前一动作并表示随即发生的结果；汉语中用“便”比句首机械译作“并且”更自然。
- source_word: ταῦτα εἰπών
  choice: 他说完这些话
  rationale: 不定过去时分词在这里表示先于主句动作发生；“这些话”保留复数指示词 ταῦτα 的形式。
- source_word: ὁ ἱεροπρεπὴς νεανίας
  choice: 那位虔敬的青年
  rationale: ἱεροπρεπής 指与神圣之事相称、举止虔敬，并不必然表示担任祭司职分；“虔敬”准确而自然。νεανίας 译为“青年”。
- source_word: ἀπέρρηξεν τὴν ψυχήν
  choice: 断了气
  rationale: 该表达在语境中是死亡的习语。“断了气”清楚表达死亡，同时避免把 ψυχή 强行处理成一项明确的灵魂论陈述；脚注保留其字面意象。
theological_decisions:
- issue: 死亡习语中 ψυχή 的处理
  choice: 正文译作“断了气”，脚注说明字面表达
  alternative: 交出了灵魂／舍了性命
  rationale: 此处主要叙述青年死亡，不必据此断定作者正在作关于灵魂与身体分离的技术性论述。正文采用现代汉语死亡习语，脚注保留原文“魂／生命”的表达张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那位”承接上下文中的特指青年；“断了气”虽是常用语，但在此并不轻佻，并能贴近原文死亡习语。
