  text: And when they asked whether he wished to eat before being tortured[a], they heard his noble resolve,
translation:
  language: zh_hans
  text: 他们问他是否愿意在遭受酷刑之前进食，于是听见了他那高尚的决心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “决心”或译“心志”、“意向”或“思想态度”；希腊语γνώμη可指意向、决心或思想态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ εἰ
  choice: 他们……便
  rationale: 这一组合在此引出后续叙事情境；汉语以顺承结构自然表达，不硬译为假设语气。
- source_word: φαγεῖν
  choice: 吃点东西
  rationale: φαγεῖν意为“吃”；加“点东西”符合现代汉语提问习惯，没有增添具体食物。
- source_word: βούλοιτο
  choice: 是否愿意
  rationale: 间接问句中的愿望语气表达当事人的意愿，“是否愿意”准确且自然。
- source_word: πρὶν βασανίζεσθαι
  choice: 在受刑之前
  rationale: βασανίζεσθαι在殉道叙事中指遭受酷刑；“受刑”简洁庄重，并保留刑罚与折磨的严重含义。
- source_word: πυνθανόμενοι
  choice: 问
  rationale: 该分词表示询问；按汉语叙事转换为谓语，并依上下文保留复数主语“他们”。
- source_word: τὴν εὐγενῆ γνώμην
  choice: 他那高尚的决意
  rationale: γνώμη在此兼有意向、主张和坚定心志之义；“决意”突出面对酷刑时坚定的意志，同时以脚注保留词义宽度。
- source_word: ἤκουσαν
  choice: 听见了
  rationale: 直接对应简单过去时的“听见”，并与后续将引出的言语相衔接。
theological_decisions:
- issue: 殉道语境中γνώμη的译法
  choice: 决意
  alternative: 心志；主张；心意
  rationale: 上下文强调受迫害者坚定的道德意志；“决意”保留意志性而不引入后期教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句末保留逗号所暗示的未完话语不适合中文独立经节，故用句号收束；“听见了”仍提示下一节将给出所听见的内容。
