revisions:
- from: 但你因亵渎神圣、杀害我们[a]，必在上帝公义的裁决下，受尽烈火所施的永恒折磨[b]。
  to: 但你因对我们所犯的亵圣杀害[a]，必在上帝公义的审判下，充分地承受由火施加的永恒折磨[b]。
  rationale: 修订删除原文未明示的“烈”，将μიერοφονία处理为整体名词性指称，并以“充分地承受”明示αὐτάρκη的加强作用。脚注a保存该罕见词的两种主要理解，脚注b继续标注διὰ πυρός的介词歧义；未额外规定刑罚的系统神学含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:06:06Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的基本句法与审判／刑罚意象均已传达：受话者因与“我们”有关的μიერοφονία而将承受神圣公义所施的永恒火刑。惟“烈火”在原文πυρός仅为“火”，额外加入“烈”的强化；而“亵渎神圣、杀害我们”虽可理解，却将罕见复合名词拆为并列动作，较难体现其作为“对我们所犯的亵圣杀害”这一整体指称。
  naturalness: 修订后采用“因你对我们所犯的亵圣杀害”“在上帝公义的审判下”“由火施加的”，均为庄重、清晰的现代书面普通话。保留“充分的”虽略带正式色彩，却能明确表达αὐτάρκη的加强语气，避免“受尽”可能暗示刑罚已经穷尽、结束。
  terminology: “亵圣”准确而简洁地保留μიერοφονία的圣俗侵犯维度；脚注说明该词也可能着重被害者为归于神／神圣之人。“上帝公义的审判”对应θείας δίκης的神圣司法含义，未把δίκη单一化为纯抽象公义或特定教义性术语。“永恒折磨”对应αἰώνιον βάσανον；“由火施加的”对应διὰ πυρός的媒介义。
