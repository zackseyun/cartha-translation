  yaml_path: translation/deuterocanon/4_maccabees/009/009.yaml
  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: zh_hans
  text: 但你因对我们所犯的亵圣杀害[a]，必在上帝公义的审判下，充分地承受由火施加的永恒折磨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“杀害我们这些归于神的人”或“以亵圣的方式杀害我们”。
    reason: 原文μიერοφονία是罕见复合词，兼有杀害与亵渎神圣的含义；其重点究竟在杀害行为的亵圣性质，还是在被害者的神圣身份，并不完全确定。
  - marker: b
    text: “由火施加的”也可译作“借着火”或“在火中”。
    reason: 原文διὰ πυρός可表示火是折磨的媒介或手段；汉语可有数种贴近原文的表达。
lexical_decisions:
- source_word: μιεροφονίαν
  choice: 亵渎神圣、杀害我们
  rationale: 这个罕见复合词兼有杀人和亵圣的意味；结合ἡμῶν，译文既表达“杀害我们”，也保留其侵犯神圣的性质，不将所指过早限定为某一种解释。
- source_word: αὐτάρκη καρτερήσεις
  choice: 受尽
  rationale: καρτερήσεις表示坚忍承受，αὐτάρκη在此加强所承受刑罚的充分、足量之意；“受尽”以自然汉语简洁表达“承受足量、承受到完全”的语气。
- source_word: θείας δίκης
  choice: 上帝公义的裁决
  rationale: δίκη可指公义、裁决或报应；此译同时保留道德公义与司法裁断的意味，且θείας在语境中指来自上帝。
- source_word: αἰώνιον βάσανον
  choice: 永恒折磨
  rationale: αἰώνιον表达长存、永恒，βάσανον指严酷的折磨；此译保留原文强烈而持续的刑罚语言，不改写为后世教义术语。
- source_word: διὰ πυρός
  choice: 烈火所施
  rationale: διά加属格可表示媒介或手段；“烈火所施”明确表达火是折磨的施行手段，同时保持庄重而自然。
theological_decisions:
- issue: 刑罚的性质与持续时间
  choice: 烈火所施的永恒折磨
  alternative: 在火中的长久刑罚
  rationale: 原文以αἰώνιον和βάσανον表达持续而严厉的神圣报应；正文直接保留这种张力，不将其弱化，也不借译文扩展为特定宗派的系统教义。
- issue: μιεροφονία所涉及的神圣性
  choice: 亵渎神圣、杀害我们
  alternative: 杀害我们这些神圣之人
  rationale: 复合词可能强调杀人行为本身亵圣，也可能强调被杀者是归于神的人；正文采取较少限定的表达，并在脚注保存另一可能。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“必”传达将来陈述的确定语气；“受尽”自然体现αὐτάρκη的充分程度。避免生硬的“神圣谋杀”，同时用正文与脚注共同保留罕见希腊词的语义张力。
