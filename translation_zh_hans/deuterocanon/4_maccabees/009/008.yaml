  yaml_path: translation/deuterocanon/4_maccabees/009/008.yaml
  text: For through this suffering and endurance[a], we will indeed carry off the prizes of virtue,
translation:
  language: zh_hans
  text: 因为我们要借着这样的受苦和忍耐，赢得德行的奖赏，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“获得美德的奖品。”希腊原文采用竞赛用语，直译为“带走德行的奖品”。
    reason: 说明ἆθλα与οἴσομεν共同构成的竞赛意象，并提供ἀρετή的可行替代译法。
lexical_decisions:
- source_word: ἡμεῖς μὲν γὰρ
  choice: 因为我们要
  rationale: 以“因为”表达γάρ的解释作用；主语“我们”保留ἡμεῖς的强调。μέν预示下文的对照，但本节片段单独成句时不宜硬译为“固然”，以免中文悬空。
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  choice: 借着这样的受苦
  rationale: “借着”保留διά在此表示途径或手段的意味；“这样的”对应近指τῆσδε，“受苦”自然表达κακοπάθεια所指的苦难经历。
- source_word: ὑπομονῆς
  choice: 忍耐
  rationale: “忍耐”既简洁又能表达在苦难中坚守、承受的含义，符合本段殉道语境。
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: 德行的奖赏
  rationale: “德行”对应ἀρετή的伦理含义；“奖赏”表达ἆθλα的竞赛奖品意象，同时符合现代汉语习惯。
- source_word: οἴσομεν
  choice: 要……赢得
  rationale: φέρω与ἆθλα连用时有夺得、带走奖品之意；“赢得”自然保留竞赛性的结果，比直译“带走”更清楚。
theological_decisions:
- issue: 希腊化犹太殉道语境中ἀρετή的译法
  choice: 德行
  alternative: 美德；道德卓越
  rationale: “德行”保留本书关于理性、操守与忍耐的伦理用语，不把它改写为后期宗派性的教义术语。
- issue: 苦难与奖赏之间关系的表达
  choice: 借着……赢得
  alternative: 因为……获得
  rationale: “借着”保留διά可能具有的工具或途径意味，不将经文过度解释为单纯因果，也不暗示脱离上下文的功德论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受苦和忍耐”保持原文两个并列名词；句末逗号反映该节在上下文中尚未完结。脚注标记置于对应分句末。
