  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: zh_hans
  text: 那些豹一般的猛兽用铁手[a]，从筋腱处拉扯他，把他的肉全都剥了下来，甚至剥到胡须处[b]，又剥下他头上的皮[c]；但他坚定地忍受着这剧痛，说道：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“铁手”。这可能指铁制刑具，也可能强化这些猛兽般施虐者的凶狠力量；原文没有进一步说明。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“下巴”或“有胡须的下颌部位”。
    reason: lexical_alternative
  - marker: c
    text: “头上的皮”也可译作“头皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων
  choice: 从筋腱处
  rationale: τένων指筋腱或筋；ἀπό标明拉扯、剥离开始或着力之处。译作“从筋腱处”既保留解剖细节，也不把语法关系过度限定为“抓住筋腱拖行”。
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: 用铁手
  rationale: χείρ本义为“手”，σιδηροῦς意为“铁的”。保留原文突兀有力的意象，不擅自改成“铁爪”或明确解释为刑具。
- source_word: ἐπισπασάμενοι
  choice: 拉扯
  rationale: 该分词表示拉、牵引；“拉扯”能自然连接“从筋腱处”，并为下文剥去肉皮的动作作铺垫。
- source_word: μέχρι γε τῶν γενείων
  choice: 直剥到下巴
  rationale: γενεῖον可指下巴或有胡须的下颌部位；“下巴”是自然且较直接的现代汉语表达，“直……到”体现μέχρι与强调语气γε。
- source_word: τὴν σάρκα πᾶσαν
  choice: 他的肉全都
  rationale: σάρξ在此为字面意义的肉体组织；“肉全都”保留πᾶσαν的完整范围及场景的残酷性。
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: 他头上的皮
  rationale: δορά指皮或兽皮。译作“头上的皮”紧贴原文，避免用“头皮”把含义过度术语化或缩窄。
- source_word: οἱ παρδάλιοι θῆρες
  choice: 那些豹一般的猛兽
  rationale: παρδάλιος是修饰θῆρες的形容词，意为像豹的；此译保留形容性表达，不直接把施虐者等同于豹子。
- source_word: ἀπέσυραν
  choice: 剥了下来
  rationale: 动词表示拉下、扯下或剥除；用于肉和皮时，“剥了下来”自然传达动作及结果。
- source_word: βαρέως τὴν ἀλγηδόνα
  choice: 这剧痛
  rationale: ἀλγηδών指疼痛、苦楚；βαρέως在此凸显疼痛的沉重、剧烈程度。“剧痛”比把它译作人物“勇敢地”更直接地反映原文。
- source_word: καρτερῶν
  choice: 坚定地忍受着
  rationale: καρτερέω表示坚忍、持守地承受；此译同时保留持续承受和坚毅不屈的意味。
