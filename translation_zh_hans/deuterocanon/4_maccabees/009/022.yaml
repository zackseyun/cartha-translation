lexical_decisions:
- source_word: ἀλλʼ
  choice: 然而
  rationale: 表示与上文相对照的转折；“然而”庄重而自然。
- source_word: ὥσπερ
  choice: 仿佛
  rationale: 引出比拟，不把随后所说的改变断定为对过程的字面描述。
- source_word: ἐν πυρί
  choice: 在火中
  rationale: 保留介词短语首要的处所意象，同时不排除火作为改变媒介的意味。
- source_word: μετασχηματιζόμενος
  choice: 被改变
  rationale: 体现现在时中间／被动分词所表达的状态或形态变化；中文避免使用含特定宗教联想较强的“变像”。
- source_word: εἰς ἀφθαρσίαν
  choice: 进入不朽坏的境地
  rationale: ἀφθαρσία指不败坏、不朽灭的状态；此译保留其末世性意味，又不把词义限缩为单纯的永生。
- source_word: ὑπέμεινεν
  choice: 忍受了
  rationale: 表达在苦难之下坚持承受，简洁自然。
- source_word: εὐγενῶς
  choice: 以高尚的气概
  rationale: 传达行为高贵、可敬且刚毅的性质，而不只强调胆量。
- source_word: τὰς
  choice: 这些……
  rationale: 现有希腊文本止于阴性复数定冠词，所修饰的名词缺失；用“这些……”提示有复数受词，却以省略号明确保留残缺状态。
theological_decisions:
- issue: 殉道语境中 εἰς ἀφθαρσίαν 的含义
  choice: 进入不朽坏的境地
  alternative: 进入不死的境地／进入不灭的境地
  rationale: 原词范围比“不死”更广，可涵盖不败坏、不朽灭的状态。正文不进一步界定这种转变的确切教义机制，以保留原文的修辞张力。
- issue: ὥσπερ 对“改变”的修辞力度
  choice: 仿佛在火中被改变
  alternative: 正如在火中被改变
  rationale: “仿佛”保留比较性，不把殉道者在火中转入不朽坏断言为可观察的字面过程。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不朽坏”保留经文语体但加上“的境地”使表达自然；“以高尚的气概”兼顾 εὐγενῶς 的道德尊贵与刚毅意味。省略号用于如实标明源文本残缺，并非补写原文。
