  yaml_path: translation/deuterocanon/4_maccabees/009/004.yaml
  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: zh_hans
  text: 因为我们认为，你为我们以违背律法而保全性命所施的怜悯，比死亡本身更难以忍受[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你对我们以违法的方式得以存活所施的怜悯”，或“你那意在使我们违法获救的同情”。希腊语ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν与ἔλεον的关系可理解为这种保全所关涉的对象、条件或目的；σωτηρία在此也可译作“获救”或“存活”。
    reason: 保留ἐπί短语与ἔλεον之间关系的句法弹性，并说明σωτηρία在本处指免死存活而非专门的教义性救恩。
lexical_decisions:
- source_word: χαλεπώτερον
  choice: 更难以忍受
  rationale: 该比较级可表示更严酷、更痛苦或更难承受；此处强调这种怜悯在道德与情感上甚至胜过死亡的苦楚，译为“更难以忍受”自然且不过度限定为肉体痛苦。
- source_word: αὐτοῦ τοῦ θανάτου
  choice: 死亡本身
  rationale: αὐτοῦ加强语气，保留“死亡本身”的强调；属格用于比较结构。
- source_word: νομίζομεν
  choice: 我们认为
  rationale: 表达判断或认定，现代汉语中“认为”简洁自然。
- source_word: ἔλεον
  choice: 怜悯
  rationale: 指对方意图饶他们性命的怜惜或同情；“怜悯”既保留其施恩姿态，也不额外引入专门的神学含义。
- source_word: παρανόμῳ
  choice: 违背律法
  rationale: παράνομος意为违反、背离律法；语境特指以触犯律法为代价，展开译出比单说“不合法”更清楚。
- source_word: σωτηρίᾳ
  choice: 保全性命
  rationale: 此处所指是免于死亡、保存生命，并非教义意义上的救恩；结合上下文译为“保全性命”可准确限定其现实含义。
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: 为使我们违背律法而保全性命所发的
  rationale: 该介词短语修饰ἔλεον，表示怜悯所指向的结果或目的。此译明确表达：对方要以他们违法为代价使其活命，同时保留希腊语关系可能略有弹性的特点于脚注中。
theological_decisions:
- issue: σωτηρία是否采用带有明确救恩色彩的译语
  choice: 保全性命
  alternative: 拯救／救恩
  rationale: 本节谈的是通过违背律法而免死，不是在陈述教义意义上的救恩；因此避免使用容易引发专门神学联想的“救恩”。
- issue: παράνομος所指的“律法”是否明确译出
  choice: 违背律法
  alternative: 不法地／非法地
  rationale: 上下文中的冲突涉及违反所守的律法。“违背律法”忠实呈现词义，又不擅自添加“摩西律法”“祖传律法”等原句未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“保全性命”明确此处是免死；“所发的怜悯”保持对暴君施怜悯姿态的反讽张力。主句依汉语习惯调整语序，但保留“比死亡本身”的强调。
