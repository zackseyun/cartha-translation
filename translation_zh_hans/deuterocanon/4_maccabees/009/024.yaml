revisions:
- from: 借着它，我们那公义、传自祖先的眷顾，在恩待[a]本民族之后，或许会惩罚那可咒诅的[b]暴君。
  to: 借着它，愿我们那公义、祖传的眷顾，既向本民族施恩[a]，就惩罚那受咒诅的[b]暴君。
  rationale: 修订使ἀλάστωρ的贬抑性定语在汉语中更准确，并以脚注保留其较强的报应／复仇关联。将“在……之后”改为“既……就……”更自然地表达ἵλεως γενηθεῖσα的先行状态及随后惩罚的愿望。保留“借着它”的跨节回指、“眷顾”的神学语域和未明说的神名；脚注标记均紧邻所注词语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:05:56Z'
