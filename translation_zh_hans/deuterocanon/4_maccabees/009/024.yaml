  terminology: 保留“眷顾”对应πρόνοια的神学性照管语域，且不擅加“上帝”。以“祖传的”简洁保留πάτριος的祖先传统／祖传含义。愿望式以“愿”表达，比“或许会”更能传达此处祈愿性的句法可能，同时不作确定断言。
