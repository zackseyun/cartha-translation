  yaml_path: translation/deuterocanon/4_maccabees/009/024.yaml
  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
translation:
  language: zh_hans
  text: 借着它，愿我们那公义、祖传的眷顾，既向本民族施恩[a]，就惩罚那受咒诅的[b]暴君。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩”也可译作“有利于”或“眷顾”；希腊词表示怀有善意、悦纳而有利地相待。
    reason: lexical_alternative
  - marker: b
    text: “受咒诅的”所译的希腊词也可理解为“带来报应的”，或指与复仇、灾祸相联的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἧς
  choice: 借着它
  rationale: διά与关系代词构成工具用法，回指上文的阴性先行词；用“借着它”保留回指和手段含义，不在本节内擅自补明所指。
- source_word: ἵλεως
  choice: 恩待
  rationale: 该词表示怀有善意、施恩或有利地相待；与间接受词“本民族”搭配时，“恩待”比音译式或技术性的表达更自然。
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: 我们那公义、传自祖先的眷顾
  rationale: “眷顾”保留πρόνοια在此处兼具照管与神学意味的语域，同时不明说希腊文未明说的“上帝”；“传自祖先”表达πάτριος的祖传、先辈所属之意，而非“父亲般的”。
- source_word: τῷ ἔθνει
  choice: 本民族
  rationale: ἔθνος在这里指说话者所属的民族共同体；“本民族”自然表达“我们的民族”，又避免现代国家概念过重。
- source_word: γενηθεῖσα
  choice: 在……之后
  rationale: 以时间—结果结构承载不定过去时分词的先行关系，使中文顺畅；其“成为/显为有利”的语义已由“恩待”体现。
- source_word: τιμωρήσειεν
  choice: 或许会惩罚
  rationale: 保留希腊语愿望式所含的可能或祈愿色彩，不把行动说成确定事实；“惩罚”也避免额外强化为私人报复。
- source_word: τὸν ἀλάστορα τύραννον
  choice: 那可咒诅的暴君
  rationale: ἀλάστωρ语义强烈，可指受咒诅者，也可带复仇或招致灾祸的色彩；正文采用符合谴责语气且自然的“可咒诅的”，并以脚注保留另一可能。
theological_decisions:
- issue: “我们那公义、传自祖先的眷顾”所指为何
  choice: 保留为带有神学色彩但未明确人格化的“眷顾”
  alternative: 直译为“上帝对我们的公义眷顾”或处理成纯粹抽象的“天意”
  rationale: 上下文很可能指向上帝对以色列的护佑，但本句并未出现“上帝”；译文既保留敬虔语域，也不把隐含所指明文化。
- issue: 愿望式τιμωρήσειεν的语气
  choice: 译作“或许会惩罚”
  alternative: “愿……惩罚”或确定性的“必会惩罚”
  rationale: 愿望式可表达愿望或潜在可能；缺少更广上下文时，以“或许会”保留开放性，避免把语气定死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“借着它”刻意保留跨节回指；“本民族”表达犹太民族共同体；不显加“上帝”，以保存原文在神圣眷顾与较抽象“天意”之间的张力。
