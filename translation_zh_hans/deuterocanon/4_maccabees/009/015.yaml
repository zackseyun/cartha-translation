base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: zh_hans
  text: “最污秽的暴君，天上的公义[a]的仇敌，心性残暴的人啊！你这样折磨我，并不是因为我犯了杀人罪，也不是因为我行了不敬虔的事，而是因为我在捍卫神圣的律法。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“审判”或“惩罚”。希腊词在这里既可泛指天上的公义，也可指由天而来的审判或报应。
    reason: 保留δίκη在公义、审判和惩罚之间的词义幅度。
lexical_decisions:
- source_word: μιερώτατε
  choice: 卑污至极
  rationale: 该词是表示污秽、玷污的最高级呼格；“卑污至极”在现代汉语中自然有力，也保留其道德与宗教层面的斥责意味。
- source_word: τῆς οὐρανίου δίκης
  choice: 天上公义
  rationale: δίκη可指公义、审判或惩罚；正文采用范围较宽的“公义”，并以脚注保留“审判”的可能。
- source_word: ὠμόφρον
  choice: 心性残暴
  rationale: 该复合词强调内在性情的凶狠残酷；“心性残暴”既准确又符合庄重的现代汉语表达。
- source_word: καταικίζεις
  choice: 折磨
  rationale: 该词在殉道者遭受暴力虐待的语境中表示严酷凌虐；“折磨”清楚传达具体处境与控诉力度。
- source_word: ἀνδροφονήσαντά
  choice: 杀了人
  rationale: 该分词表示杀人或犯杀人罪；“杀了人”在汉语中直接自然，并保留说话者否认血罪的含义。
- source_word: ἀσεβήσαντα
  choice: 行了不敬虔的事
  rationale: ἀσεβέω指违背对神或圣事应有敬畏的行为；此译保留宗教层面的不敬，而不泛化为普通的“做错事”。
- source_word: θείου νόμου
  choice: 上帝的律法
  rationale: θείου表示属于神或出于神；“上帝的律法”比“神圣律法”更清楚地表达其来源，也符合本段宗教语境。
- source_word: προασπίζοντα
  choice: 在捍卫
  rationale: 该词有站在前面保护、为之辩护的意思；“捍卫”保留主动抵抗和维护律法的力度。
theological_decisions:
- issue: δίκη在“天上公义的仇敌”中的含义
  choice: 采用较宽泛的道德—司法含义“公义”
  alternative: 天上的审判；上天的惩罚
  rationale: 上下文可指暴君敌对来自天上的正义秩序，也可能暗含审判或报应；正文不把含义限缩为某一次特定审判，脚注则保留司法性读法。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。开头保留连续呼语的强烈谴责语气；后半句以“并不是……也不是……而是……”再现希腊文的鲜明对比。
