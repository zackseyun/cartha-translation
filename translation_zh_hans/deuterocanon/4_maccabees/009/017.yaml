  yaml_path: translation/deuterocanon/4_maccabees/009/017.yaml
  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: zh_hans
  text: 但他说：“恶魔的肢体啊，你们的手段并没有强大到能把我的理性引开。砍断我的肢体，灼烧我的肉体，扭折我的关节吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρόπος
  choice: 手段
  rationale: 此处指施刑者所采用的办法或手段；比“方式”更切合酷刑语境，同时不把词义过度具体化为某一种刑具或计谋。
- source_word: ὦ μεροὶ δαῖμον
  choice: 你们这些恶魔的肢体
  rationale: 保留原文以身体部位称呼施刑者的强烈隐喻和斥责语气；δαῖμον在此语境中带有负面超自然含义，译作“恶魔”。
- source_word: τὸν λογισμόν
  choice: 我的理性
  rationale: λογισμός在《马加比四书》中是核心概念，指人的理性判断与支配能力；译作“理性”可保持全书思想术语的一致性。
- source_word: ἆξαι
  choice: 动摇
  rationale: 字面含“带走、引离”；此处意为使理性偏离其坚定立场。“动摇”符合现代汉语表达，也保留精神操控的含义。
- source_word: τέμνετέ μου μέλη
  choice: 砍断我的四肢
  rationale: μέλη可指肢体或身体各部分；结合施刑语境，以“四肢”自然表达，同时与后文“关节”区分。
- source_word: πυροῦτε τὰς σάρκας
  choice: 灼烧我的肉体
  rationale: πυρόω指用火烧灼；σάρκες为复数，但汉语以集合名词“肉体”表达更自然。
- source_word: στρεβλοῦτε τὰ ἄρθρα
  choice: 扭折我的关节
  rationale: στρεβλόω含扭曲、使脱位或折磨之意；“扭折”保留动作的暴烈性，而不武断限定具体伤害结果。
theological_decisions:
- issue: 理性是否会被酷刑引离
  choice: 译为“动摇我的理性”
  alternative: “把我的理性引离正道”
  rationale: 原文没有明说从何处引离；采用“动摇”保留其抗拒酷刑、坚持理性的意义，又避免补入原文未明确表达的“正道”。
- issue: δαῖμον的身份与语气
  choice: 译为“恶魔”
  alternative: “鬼神”或“邪灵”
  rationale: 上下文是带有谴责意味的直接称呼；“恶魔”准确传达负面色彩，但不进一步建立特定的邪灵学解释。
translation_notes:
  register: 采用现代、庄重而有力度的普通话。直呼语置于句首以符合汉语节奏；三个命令句保持排比和挑战性的语气。原文开头“τῶν βασάνων”似承接上文，按本节完整句法不另译，以免形成残缺短语。
