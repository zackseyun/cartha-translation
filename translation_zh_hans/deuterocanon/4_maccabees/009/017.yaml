revisions:
- from: 但他说：“你们这些恶魔的肢体，你们的手段还没有强大到足以动摇我的理性。砍断我的四肢吧，灼烧我的肉体，扭折我的关节吧！”
  to: 但他说：“恶魔的肢体啊，你们的手段并没有强大到能把我的理性引开。砍断我的肢体，灼烧我的肉体，扭折我的关节吧！”
  rationale: 修订仅恢复原文比较结构与“引离”这一动作含义，并以更准确的单数所属呼语呈现侮辱性隐喻。“肢体”对应 μέλη，避免把该词限定为“四肢”；其后“关节”仍对应 ἄρθρα。未增添原文未明说的引离目标或神学解释。
