  yaml_path: translation/deuterocanon/4_maccabees/009/031.yaml
  text: For I, by the pleasures that come through virtue, lighten the pain.
translation:
  language: zh_hans
  text: 因为我凭着美德所带来的甘甜喜乐，减轻这痛苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι ταῖς ... ἡδοναῖς
  choice: 喜乐
  rationale: 形容词与名词构成强调性的同源表达，指令人愉悦的享受；此处用“喜乐”既保留正面的内在体验，也避免中文“快乐”显得轻浮。与格在句中表凭借的手段，译作“凭着”。
- source_word: διὰ τὴν ἀρετήν
  choice: 由美德而来的
  rationale: διά加宾格可表达原因；这里说明喜乐与美德之间的因果或来源关系。“由美德而来的”自然地保留这一关系，不把它限定为“为了美德”。
- source_word: ἀρετήν
  choice: 美德
  rationale: ἀρετή在《马加比四书》的伦理哲学语境中指道德上的德性或卓越；“美德”是现代汉语中最直接、易懂且不带宗派色彩的对应词。
- source_word: τὸν πόνον
  choice: 痛苦
  rationale: πόνος可指劳苦、艰难或疼痛；在受刑殉道的近距语境中，“痛苦”能够兼顾肉体疼痛与受难经验。
- source_word: ἐπικουφίζομαι
  choice: 减轻
  rationale: 该动词意为使之变轻、缓解；中动语态在这里由说话者以某种手段减轻自身所受痛苦。“减轻”保留重量减弱的隐喻，同时符合现代汉语表达。
theological_decisions:
- issue: ἀρετή的道德哲学含义
  choice: 美德
  alternative: 卓越
  rationale: 本书将理性、敬虔和受苦中的坚忍置于德性框架内；“美德”比“卓越”更清楚地传达其伦理内涵，又不额外引入特定宗派解释。
- issue: 美德与喜乐之间的关系
  choice: 由美德而来的喜乐
  alternative: 为了美德而有的喜乐；因为美德而有的喜乐
  rationale: 原文διά加宾格容许原因关系，但具体可理解为美德带来或促成喜乐。译文采用较宽的来源表达，保留因果联系，不把意义缩窄为目的。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简洁，保留原文中“喜乐”与“痛苦”并置的张力；不解释这种喜乐的具体心理或神学机制。
