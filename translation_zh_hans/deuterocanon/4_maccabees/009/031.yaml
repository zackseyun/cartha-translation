    issue: 动词时体被译为完成时“减轻了”。
    rationale: ἐπικουφίζομαι为直陈式现在时，表达说话者当下/持续地减轻痛苦；中文应作“减轻”，不应无根据地加上完成体“了”。
  - severity: low
    issue: 未反映ἡδέσι对ἡδοναῖς的修饰性强调。
    rationale: 原文不仅说“欢愉/喜乐”，还以ἡδύς的与格复数修饰ἡδοναῖς。中文可用“甘甜喜乐”自然呈现这一强化，而不重复同源词。
