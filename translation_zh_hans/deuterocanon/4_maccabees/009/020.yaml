  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
translation:
  language: zh_hans
  text: 那轮子四周都被血沾污了[a]；炭火堆正被伤口流出的液滴渐渐浇熄[b]；碎肉则在刑具的轴杆周围流淌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四周都染满了血。”原词也可表示沾染、染污；正文用“被血沾污了”保留其污染、污秽的语气。
    reason: lexical_alternative
  - marker: b
    text: 直译：“伤口流液的液滴。”这里的希腊词指从伤口流出的液体；“液滴”对应其滴落的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνετο
  choice: 被血污了
  rationale: μολύνω兼有沾污、污染的意味；“被血污了”在现代汉语中自然，并保留强于单纯“染红”的污秽感。
- source_word: πάντοθεν
  choice: 四面都
  rationale: 表达轮子各面、周遭尽被血污的空间范围，简洁自然。
- source_word: ὁ τροχός
  choice: 那轮子
  rationale: 直译为“轮子”；指上下文中的刑轮，用“那”承接既述刑具。
- source_word: ὁ σωρὸς τῆς ἀνθρακιᾶς
  choice: 炭火堆
  rationale: ἀνθρακιά可指炭火或一堆燃炭；“炭火堆”既保留成堆之意，也说明其正在燃烧。
- source_word: τοῖς τῶν ἰχώρων ... σταλαγμοῖς
  choice: 被伤口渗液的滴流
  rationale: ἰχώρ在此指伤口流出的液体；“伤口渗液”比泛称“体液”准确，也避免现代汉语中陌生且带神话色彩的“灵液”。σταλαγμοί以“滴流”体现液体不断滴落。
- source_word: ἐσβέννυτο
  choice: 渐渐浇灭
  rationale: 未完成时态描写持续过程；“渐渐浇灭”自然呈现炭火正在熄灭，而非瞬间熄灭。
- source_word: περὶ τοὺς ἄξονας
  choice: 在……轴杆周围
  rationale: 保留具体的环绕空间关系；ἄξονες为装置的轴或轴杆。
- source_word: τοῦ ὀργάνου
  choice: 刑具
  rationale: ὄργανον本义为器具、装置；上下文明确是施刑器械，“刑具”比泛称“器具”清楚，又不额外指定机械结构。
- source_word: περιέρεον
  choice: 流淌
  rationale: 未完成时态表示持续流动；“流淌”保留原文令人不适的动态画面。
- source_word: αἱ σάρκες
  choice: 碎肉
  rationale: 复数σάρκες在酷刑场景中指从身体撕裂的肉；“碎肉”比集合名词“肉”更符合复数及具体画面。
