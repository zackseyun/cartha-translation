  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: zh_hans
  text: “不法的谋士啊，暴君！不要恨我们；倒要怜悯我们，胜过怜悯他们。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文措辞十分压缩，直译近于：“谋士啊，不法的暴君，不要恨我们；胜过他们，怜悯我们。”这里“胜过他们”（ὑπὲρ αὐτούς）正文按比较“怜悯”理解；也可理解为修饰“恨”，即“不要恨我们过于恨他们”，或较少见地理解为“因为他们”。
    reason: 说明压缩句法及 ὑπὲρ αὐτούς 的替代归属，同时保留正文所采用的比较性主读法。
lexical_decisions:
- source_word: σύμβουλε
  choice: 谋士
  rationale: 这是阳性单数呼格，意为“谋士、策士、顾问”。此处与“不法之事”相连，带有强烈谴责意味；“谋士”既保留献策者的含义，也适合直接斥责的语境。
- source_word: τύραννε
  choice: 暴君
  rationale: 这是直接称呼迫害者的呼格；“暴君”准确保留了原词的负面政治和道德色彩。
- source_word: παρανομίας
  choice: 不法之事
  rationale: 属格名词表示违背律法、违法乱纪；译作“不法之事”保留名词形式及其与“谋士”或“暴君”之间略显压缩的修饰关系。
- source_word: μισῶν
  choice: 恨
  rationale: 现在分词与否定词 μή 连用，在命令语境中自然表达“不要恨”。
- source_word: ὑπὲρ αὐτούς
  choice: 过于恨他们
  rationale: ὑπέρ 加宾格常可表示比较，即“超过他们”。按现存希腊语的词序，最自然地与紧邻的“恨”相连，但句法压缩，仍有别的理解可能。
- source_word: ἐλέα
  choice: 要怜悯
  rationale: ἐλεέω 的命令形式，要求对方施以怜悯；“怜悯”保留其伦理和情感力度。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 原文两次出现，以加强恳求；中文在两个并列分句中各译一次，自然地保留重复和强调。
theological_decisions:
- issue: ὑπὲρ αὐτούς 所修饰的内容及两次 ἡμᾶς 的作用
  choice: 将比较语理解为修饰“恨”：不要恨我们过于恨他们；随后另发出“要怜悯我们”的请求。
  alternative: 将比较语与“怜悯”相连，理解为“怜悯我们胜过怜悯他们”；或把 ὑπὲρ αὐτούς 理解为“因为他们”。
  rationale: 按希腊语词序，ὑπὲρ αὐτούς 紧接 μισῶν，修饰“恨”较为直接；但传本措辞高度压缩，不能排除比较语跨接后面命令或表示缘由的可能，因此在脚注中保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不法之事的谋士啊，暴君”保留两个呼格和原文尖锐的斥责；分号呈现禁止与恳求之间的转折，而不额外加入原文没有明说的“反而”。
