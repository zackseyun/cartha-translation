    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  choice: 于是
  rationale: 承接上文并引出随之发生的行动，现代汉语中自然简洁。
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: 他们中最年长的
  rationale: 保留最高级和部分属格的含义，指他们当中年龄最大的一位。
- source_word: κελευσθέντες
  choice: 奉命
  rationale: 准确表达不定过去时被动分词的受命含义，并以简洁的汉语状语呈现。
- source_word: οἱ μιστισταί
  choice: 行刑的人
  rationale: 传世词形在文本和词汇上较为异常；上下文明确指奉王命施加酷刑的人员。“行刑的人”既符合场景，也不限定他们只是最终执行死刑者。
- source_word: παρήγαγον
  choice: 带上前来
  rationale: 表达把人带到众人面前或行刑地点前方的动作。
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: 撕开他的内衣
  rationale: χίτων 指贴身穿着的衣服；“撕开”保留暴力且为捆绑作准备的动作。
- source_word: διέδησαν
  choice: 捆住
  rationale: 清楚表达牢固束缚的动作，符合现代汉语叙事。
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: 他的双手和双臂
  rationale: 分别保留 χεῖρας 与 βραχίονας 的身体部位信息，并以“双”呼应两侧束缚。
- source_word: ἱμᾶσιν
  choice: 用皮带
  rationale: ἱμάς 常指皮制的带子或条带；“皮带”在此指用于捆绑的皮革带，具体且易懂。
- source_word: ἑκατέρωθεν
  choice: 从两边
  rationale: 保留双侧施绑或固定的空间关系，同时不额外判定具体刑具结构。
