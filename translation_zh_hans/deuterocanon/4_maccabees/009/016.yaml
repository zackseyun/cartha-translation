lexical_decisions:
- source_word: δορυφόρων
  choice: 卫兵
  rationale: 此处指君王身边执行看守或护卫职责的人；“卫兵”比字面的“持矛者”更符合现代汉语语境。
- source_word: Ὁμολόγησον
  choice: 答应
  rationale: 在此命令语境中表示公开同意或承诺按要求行事，不采用容易引出宗教性含义的“承认”或“宣认”。
- source_word: φαγεῖν
  choice: 吃
  rationale: 保留原文未明说所吃何物的简洁表达，由上下文补足对象。
- source_word: ἀπαλλαγῇς
  choice: 获释
  rationale: 在受拘押和受刑语境中表示被放走、脱离羁押；“获释”自然且准确。
theological_decisions:
- issue: ὁμολογέω是否译为带宗教色彩的“承认/宣认”
  choice: 答应
  alternative: 承认要吃／宣称愿意吃
  rationale: 本句是卫兵劝受刑者同意进食的直接话语，并非信仰告白；选用中性的“答应”避免引入原文没有的神学色彩。
translation_notes:
