base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: zh_hans
  text: 因为，若我们不让对律法的顺服作我们的谋士和明辨，就理当使祖先蒙羞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为，若我们不以对律法的顺服为劝告和认识，就理当在祖先面前感到羞愧。”
    reason: 原文动词可理解为“使祖先蒙羞”，也可理解为“在祖先面前感到羞愧”；“谋士和明辨”也可较非人格化地表达为“劝告和认识”。
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: 使……蒙羞
  rationale: 该中间／被动形式与宾格“祖先”连用，可表达使祖先受羞辱、玷辱祖先的意思；正文采用这一较符合句法关系和殉道语境的理解。
- source_word: τοὺς προγόνους
  choice: 祖先
  rationale: 自然、庄重的现代汉语，准确表达先辈和历代祖宗。
- source_word: εἰκότως
  choice: 理当
  rationale: 保留“合乎情理、理所当然”的道德判断语气。
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: 对律法的顺服
  rationale: εὐπείθεια 指乐意听从或服从；此译保留全句以律法为中心的伦理重点。
- source_word: συμβούλῳ
  choice: 作我们的谋士
  rationale: 保留原文将“顺服”人格化为提供劝导者的表达；“我们的”是汉语为明确关系而作的自然补足。
- source_word: γνώσει
  choice: 判断力
  rationale: γνῶσις 基本义为知识、认识，在与“谋士”并列的实践伦理语境中可指辨识和判断；“判断力”使现代读者易于理解，同时不把它限定为纯粹资料性知识。
- source_word: χρησαίμεθα
  choice: 让……作
  rationale: χράομαι 与双重与格结构表示使用某物并使其担当某种作用；此处用自然汉语重构为“让……作……”。
theological_decisions:
- issue: αἰσχυνόμεθα……τοὺς προγόνους所表达的与祖先之间的羞耻关系
  choice: 不顺服律法会使祖先蒙羞
  alternative: 不顺服律法会使人在祖先面前感到羞愧
  rationale: 宾格“祖先”较自然地指蒙受羞辱的一方，也符合忠于祖传律法、不可辱没先人的论证；但该动词的中间／被动形态允许“感到羞愧”的理解，因此在脚注中保留。
- issue: 律法顺服在συμβούλῳ καὶ γνώσει中的作用
  choice: 将其人格化为“谋士”，并视为判断力
  alternative: 将其理解为提供谋略和识见的手段
  rationale: 正文尽量保留原文中“顺服”担当劝导、认知功能的紧凑张力，不把它扩展成特定宗派关于律法功用的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“谋士”保留原文的拟人表达，“判断力”呈现γνῶσις在此处的实践性含义；脚注保留句法和词义上的真实歧义。
