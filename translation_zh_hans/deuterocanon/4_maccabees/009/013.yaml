  text: As he was stretched over it[a], the noble young man was being disjointed.
translation:
  language: zh_hans
  text: 这位高贵的青年在那刑具上被拉伸时，身体的关节正渐渐脱臼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“正变得关节脱位”。希腊文强调酷刑持续造成身体关节错位。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ὃν
  choice: 在那刑具上
  rationale: 关系代词指向上文提到的刑具；与“被绷紧”连用时，περὶ 表示受刑者被拉伸于器具之上。译文补出“刑具”，使所指在中文中清楚自然。
- source_word: κατατεινόμενος
  choice: 被绷紧
  rationale: 该被动分词表示身体被拉开、拉紧；“被绷紧”既保留被动含义，也符合刑讯场景。
- source_word: εὐγενὴς
  choice: 高贵的
  rationale: 此词既可指高贵出身，也可指高尚品格；“高贵”保留这两层可能，不限定为门第。
- source_word: νεανίας
  choice: 青年
  rationale: 直接表达年龄与性别，现代中文简洁自然。
- source_word: ἔξαρθρος ἐγίνετο
  choice: 身体渐渐被拉得关节脱臼
  rationale: ἔξαρθρος 指关节脱位，ἐγίνετο 的未完成时态突出持续发生的过程；“渐渐”呈现过程性，“被拉得”交代其由拉伸酷刑造成，而不夸大为肢解。
