base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/010.yaml
  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: zh_hans
  text: 他们说这些话时，暴君不但因把他们视为不肯服从的人而恼怒，也因把他们视为忘恩负义的人而发怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“不但像对待不服从的人，也像对待忘恩负义的人”。这里的“不肯服从”和“忘恩负义”都是暴君对他们的看法。
    reason: 说明两处ὡς κατὰ结构所保留的暴君视角，避免将其指控误作叙述者的判断。
lexical_decisions:
- source_word: Ταῦτα αὐτῶν εἰπόντων
  choice: 他们说了这些话以后
  rationale: 这是属格独立结构；用“以后”自然表达不定过去分词的时间关系。“这些话”承接前文兄弟们所说的内容。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 保留τύραννος所带的贬义和压迫性色彩，不弱化为中性的“君王”或“统治者”。
- source_word: οὐ μόνον ... ἀλλʼ ... καὶ
  choice: 不但……还……
  rationale: 以现代汉语常用的关联结构再现希腊文的递进并列。
- source_word: ὡς κατὰ ἀπειθούντων
  choice: 把他们当作不肯服从的人
  rationale: ὡς体现暴君对他们的认定或看法，κατά加属格表达敌对指向；ἀπειθέω在此指拒不服从。“不肯服从”比单纯“不顺从”更能体现意志性的拒绝。
- source_word: ἐχαλέπαινεν
  choice: 恼怒
  rationale: 未完成过去时呈现持续或发展中的怒气；“恼怒”既保留情绪强度，也与后面的“震怒”形成措辞区别。
- source_word: ὡς καὶ κατὰ ἀχαρίστων
  choice: 还把他们当作忘恩负义的人
  rationale: 再次保留ὡς所表达的主观认定；ἀχάριστος在此是“忘恩负义、不知感恩”。
- source_word: ὠργίσθη
  choice: 震怒
  rationale: 该动词表示发怒；“震怒”传达较强烈的怒气，并与前面的ἐχαλέπαινεν有所区分，避免机械重复。
theological_decisions:
- issue: “不肯服从”和“忘恩负义”是叙述者的裁定，还是暴君的看法
  choice: 正文用“把他们当作”明确归于暴君的认定
  alternative: 译作“因他们不服从……因他们忘恩负义……”
  rationale: 两处ὡς κατὰ更自然地表示暴君以这种身份看待并敌视他们；若直接用因果结构，容易把他的指控写成叙述者认可的事实。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“暴君”保留原文鲜明的评价色彩；两个“把他们当作……”形成平行结构，清楚呈现暴君的敌对视角。
