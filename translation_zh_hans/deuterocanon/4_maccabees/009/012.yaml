  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
translation:
  language: zh_hans
  text: 他们用鞭子抽打他，直到疲惫不堪，却仍一无所获，于是把他抬上刑轮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑轮”指一种施刑器具，并非普通的车轮。
    reason: cultural_note
lexical_decisions:
- source_word: τύπτοντες ταῖς μάστιξιν
  choice: 用鞭子抽打他
  rationale: τύπτοντες表示反复击打，ταῖς μάστιξιν指出所用的是鞭子；“用鞭子抽打”在现代汉语中自然、明确。
- source_word: ἐκοπίασαν
  choice: 直到疲惫不堪
  rationale: 该动词表示因劳作而疲倦；结合持续抽打的分词结构，用“直到”自然呈现动作持续至施刑者疲惫的语意。
- source_word: μηδὲν ἀνύοντες
  choice: 却仍一无所获
  rationale: 短语表示没有达到预期结果；“一无所获”保留其未明说具体目标的含混性。
- source_word: ἀνέβαλον αὐτὸν
  choice: 把他抬上
  rationale: ἀναβάλλω在此语境指将人放置或抬到刑具上；“抬上”既体现移动，也不额外描写固定方式。
- source_word: ἐπὶ τὸν τροχόν
  choice: 刑轮
  rationale: τροχός字面为“轮”，本段语境中是施刑器具；译作“刑轮”可避免读者误解为普通车轮。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一无所获”不具体说明施刑者企图达到何种结果，以保留希腊文的含混性。英文咨询层的脚注标记与其正文位置似有错配；本稿依据希腊文内容，仅为“刑轮”提供文化说明。
