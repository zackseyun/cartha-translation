lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: 以这一切酷刑
  rationale: διά接属格在此表示手段，也带有经历全部酷刑的意味；“以这一切酷刑”贴近复数结构，并在现代汉语中自然地表达凭借酷刑来证实所言。
- source_word: πείσω ὑμᾶς
  choice: 使你们确信
  rationale: πείσω是πείθω的将来时主动语态，可表示“说服、使确信”；结合以受刑表现来作证明的语境，“使你们确信”比单纯“劝服你们”更合适。ὑμᾶς为第二人称复数，译作“你们”。
- source_word: μόνοι
  choice: 唯有
  rationale: μόνοι强调排他性；“唯有”庄重自然，并保留“只有……才……”中尚待下文补足的张力。
- source_word: οἱ παῖδες Ἑβραίων
  choice: 希伯来人的儿子
  rationale: παῖδες可指孩子、男孩、青年或仆人；此处语境指殉道的兄弟，阳性含义明确。“希伯来人的儿子”保留原文属格关系及男性所指，虽略显突兀，却不擅自将其改写为较宽泛的族群称谓。
theological_decisions:
- issue: παῖδες的性别与身份表达
  choice: 儿子
  alternative: 孩子；青年
  rationale: 上下文所指为一群男性兄弟，因此采用有性别指向的“儿子”；同时不把该词扩展为不分性别的“儿女”，也不将属格结构直接释义为“希伯来青年”。
- issue: 残存分句的未完成性
  choice: 保留“唯有希伯来人的儿子”这一未完成结构，不补出谓语或结论
  alternative: 按上下文补成完整判断句
  rationale: 现存希腊文单独看句法未完，很可能接续下一节。补入“能忍受”或类似内容会消除原文真实存在的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以这一切酷刑使你们确信”保持施行酷刑者借酷刑作证明的语气；句末刻意不补全，以忠实反映希腊文本的未完成状态。
