  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
translation:
  language: zh_hans
  text: 那位心志高尚、像亚伯拉罕一样的青年，虽然骨架已经被烈火从四周烧灼，却没有呻吟。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτετηγμένον
  choice: 被烈火烧遍
  rationale: 该完成时分词描写身体已在四周受强烈热力侵袭；结合火刑语境，“被烈火烧遍”自然传达结果状态，同时以脚注保留“熔化”的具体意象。
- source_word: τὸ τῶν ὀστέων πῆγμα
  choice: 骨骼的架构
  rationale: πῆγμα指固定、接合而成的结构；与“骨头”连用时，具体指由骨头构成的身体框架。“骨骼的架构”在现代汉语中清楚且保留原文意象。
- source_word: μεγαλόφρων
  choice: 心志高尚
  rationale: 该词赞扬人物崇高、勇毅的心性；“心志高尚”兼顾道德尊严与精神坚毅，且适合庄重叙事。
- source_word: Ἀβραμιαῖος
  choice: 像亚伯拉罕一样
  rationale: 此形容词表示具有亚伯拉罕的品格或与他相似；译为明示的比较，避免现代“亚伯拉罕式”可能产生的技术性或宗教分类含义。
- source_word: νεανίας
  choice: 青年
  rationale: 该词通常指年轻男子；“青年”简洁自然，并与本段庄重语体相称。
- source_word: οὐκ ἐστέναξεν
  choice: 却没有呻吟
  rationale: στενάζω指人在痛苦中发出呻吟或叹息；火刑语境中“呻吟”最准确地表达他没有发出痛苦之声。
theological_decisions:
- issue: Ἀβραμιαῖος是品格类比还是血统称谓
  choice: 像亚伯拉罕一样
  alternative: 亚伯拉罕的后裔
  rationale: 原文采用形容词，在赞扬青年坚忍高尚的上下文中，更自然地表示他在品格与忠贞上像亚伯拉罕，而非仅陈述其血统；译文不进一步规定具体相似点，以保留原文的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。将让步短语置于主语之后，使长句自然顺畅；用“却”清楚呈现原文的反差。保留“骨骼的架构”这一具体意象，不将身体受刑的描写泛化。
