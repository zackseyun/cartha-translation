base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/032.yaml
  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: zh_hans
  text: 但你却在不敬神的威吓中正受折磨[a]；极其污秽的暴君啊，你绝逃不过神圣震怒所降的刑罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语结构紧缩，直译可作“在不敬神的威吓中”。也可理解为“在由不敬神而来的威吓之下”；在上下文中，这不敬神可被理解为与被呼告的暴君有关。
    reason: 保留ἐν的基本处境意义及ἀσεβείας属格关系的歧义，不把“威吓”直接改释为“苦刑”或将人称归属断言化。
lexical_decisions:
- source_word: βασανίζῃ
  choice: 受着折磨
  rationale: 该动词在此为第二人称单数现在时形式，可表达正在承受折磨；保留原文现在时，不将其明确改为将来时。语态在形式上可有被动或中间意味，但上下文较支持被动理解。
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: 因不敬神的威吓
  rationale: ἀπειλαί的基本义是“威吓、威胁”，不直接改译为“苦刑”。介词短语结构紧缩，“因”在汉语中自然表达这些威吓与所受折磨之间的关联，同时以脚注保留其他可能理解。
- source_word: ἀσεβείας
  choice: 不敬神
  rationale: 此词指对神缺乏敬畏、虔敬，译为“不敬神”比“不虔”更通俗明确，也保留其宗教与道德意味。
- source_word: μιερώτατε
  choice: 极其污秽的
  rationale: 最高级形容词兼有礼仪与道德上的玷污意味；“极其污秽”保留强烈的斥责语气。
- source_word: τύραννε
  choice: 暴君
  rationale: 准确传达对残暴统治者的直接称呼及谴责意味。
- source_word: τὰς ... δίκας
  choice: 所降的刑罚
  rationale: δίκαι在审判语境中指公正施加的惩罚；“刑罚”清楚而庄重，“所降的”使汉语搭配自然。
- source_word: θείας ὀργῆς
  choice: 神圣震怒
  rationale: 原文以形容词θείας修饰“震怒”，没有直接使用“神的”；译文保留这一表达层次，避免把隐含指涉改成明说。
theological_decisions:
- issue: θείας ὀργῆς所指
  choice: 神圣震怒
  alternative: 神的震怒
  rationale: 希腊文使用“神圣的、属神的”这一形容词，而非直接写“神的”。正文保留原文形式，同时让读者从语境理解其指向。
- issue: 暴君所受折磨的时间与方式
  choice: 受着折磨
  alternative: 将受折磨／使自己受折磨
  rationale: βασανίζῃ是现在时形式，语法上亦可能涉及中间语态意味。正文采用语境较合适的现在时被动表达，不把它改成明确的未来预言，也不武断认定为自我折磨。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受着折磨”保留希腊文现在时的持续感；分号与呼语再现原句强烈、直接的谴责语气。
