base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: zh_hans
  text: “你还等什么[a]，暴君？我们已准备好：宁可死，也不违背我们祖传的诫命[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为何迟疑？”这里的希腊语可以表示等待、拖延或犹豫。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我们祖先的诫命”，指他们从先辈承继的诫命。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: 你还等什么
  rationale: μέλλω在这一问句中表示迟延或犹豫；“你还等什么”保留了直面暴君的反问语气，同时以脚注注明另一种可能表达。
- source_word: ὦ τύραννε
  choice: 暴君
  rationale: τύραννος在此带明显贬义，指施行压迫的统治者；“暴君”准确保留其道德评判和直接称呼。
- source_word: ἑτοῖμοι γάρ ἐσμεν
  choice: 我们已经准备好
  rationale: ἑτοῖμοι表示处于预备妥当、随时可以行动的状态；“已经准备好”自然地传达这种坚决态度。γάρ承接前面的挑战说明理由，中文不必机械译作“因为”。
- source_word: ἀποθνήσκειν
  choice: 死
  rationale: 原词是不及物的“死”，并未明说“被处死”；译文不把语境中的执行方式加入正文。
- source_word: ἢ παραβαίνειν
  choice: 宁可……也不违背
  rationale: ἢ在两个选择之间形成强烈对比；汉语“宁可……也不……”自然表达选择死亡而拒绝违犯诫命的意思。
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: 我们祖传的诫命
  rationale: πατρίους指从先辈承继而来的事物；“祖传的诫命”既保留传承含义，也避免误解为诫命由祖先创立。
theological_decisions:
- issue: πατρίους ἡμῶν所表达的祖辈传承
  choice: 我们祖传的诫命
  alternative: 我们祖先的诫命
  rationale: 这里强调犹太群体所承继的诫命传统。“祖传”体现从祖辈承接而来，却不暗示祖先是诫命的最终来源；脚注保留较贴近词面结构的译法。
- issue: 死亡与违命之间的选择关系
  choice: 宁可死，也不违背
  alternative: 准备好去死，而不是违背
  rationale: 此结构表达宁愿选择死亡而不选择违命；译文保留这项严峻选择，不将其扩展为关于殉道功德或得救方式的教义陈述。
translation_notes:
  register: 采用现代、庄重而有力度的直接引语。“暴君”保留原文的斥责意味；整句避免文言化。“已经准备好宁可死”略带郑重的宣告语气，与殉道叙事场景相称。
