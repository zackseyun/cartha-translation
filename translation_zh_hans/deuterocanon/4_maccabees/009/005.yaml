base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: zh_hans
  text: 可是，你竟想用酷刑处死我们来威胁我们，仿佛你不久前没有从以利亚撒那里学到教训似的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话带有反讽意味：以利亚撒刚才的榜样本应使对方明白，酷刑和死亡无法吓倒他们。也可译作“仿佛你不久前没有从以利亚撒那里学到什么似的”。
    reason: 说明ὥσπερ οὐχί的反讽语气，并保留μαθών“学习”的较直译表达。
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: 你竟想吓住我们
  rationale: 该动词表示使人害怕；结合责问语气，以“想吓住”自然表达对方企图恐吓他们，而“竟”传达原句的反诘锋芒。
- source_word: ἀπειλῶν
  choice: 拿……来威胁我们
  rationale: 分词说明恐吓的手段；这一结构在现代汉语中自然，也保留其工具性关系。
- source_word: διὰ τῶν βασάνων
  choice: 酷刑致死
  rationale: διά加属格表示手段，βασάνων在殉道叙事中指具体的酷刑；“酷刑致死”清楚表达死亡是借酷刑造成的。
- source_word: θάνατον
  choice: 致死
  rationale: 在汉语句式“拿酷刑致死来威胁”中以动宾化表达“死亡”，避免生硬的“以经过酷刑的死亡”。
- source_word: πρὸ βραχέως
  choice: 不久前
  rationale: 准确、简洁地表达在此前很短的一段时间。
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: 从以利亚撒那里学到教训
  rationale: παρά加属格表示学习的来源；“学到教训”既保留“从……学习”的关系，也自然指向以利亚撒刚才所立的榜样。
theological_decisions:
- issue: ὥσπερ οὐχί所引比较句的反讽力度
  choice: 仿佛不久前没有从以利亚撒那里学到教训似的
  alternative: 尽管你不久前已经从以利亚撒那里受了教训
  rationale: 原文用“仿佛没有……”形成反讽，责备暴君无视以利亚撒的榜样；正文保留这一比较结构，不把它解释性改写为让步句。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“竟想吓住”保留责问语气；“拿酷刑致死来威胁”避免过度书面化，同时准确呈现酷刑作为致死手段。
