base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/021.yaml
  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
translation:
  language: zh_hans
  text: 因为他正在埃及同托勒密交战，又听说有消息[a]传开，说他已经死了；耶路撒冷人因此欢喜到了极点。于是他迅速向他们进军。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传言”。希腊语φήμη可指消息、传闻或公众流传的说法；正文采用较中性的“消息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: 因为
  rationale: 在上下文中引出解释性的叙事背景；“因为”自然体现γάρ的说明作用，而持续动作由后面的“正在”表达。
- source_word: πολεμῶν ἦν κατʼ Αἴγυπτον Πτολεμαίῳ
  choice: 正在埃及与托勒密交战
  rationale: 迂回结构πολεμῶν ἦν表示持续进行的战争行动；κατʼ Αἴγυπτον按地理范围译为“在埃及”，Πτολεμαίῳ则译出交战对象。
- source_word: ἠκούσέν τε
  choice: 又听说
  rationale: “又”自然传达τε的连接、附加意味，同时“听说”适合引出后面的间接陈述。
- source_word: φήμης διαδοθείσης περὶ τοῦ τεθνάναι αὐτόν
  choice: 他已经死了的消息传开后
  rationale: 属格独立结构表示先于主句反应发生的背景情形；“消息”保持中性，不预先断定其为不实谣言。
- source_word: ὡς ἔνι μάλιστα χαίροιεν
  choice: 欣喜若狂
  rationale: 以现代汉语中自然有力的表达传达ὡς ἔνι μάλιστα对“欢喜”的最高程度强化，而不增添具体庆祝行为。
- source_word: οἱ Ἱεροσολυμεῖται
  choice: 耶路撒冷人
  rationale: 简洁、自然地指耶路撒冷的居民。
- source_word: ταχέως ἐπʼ αὐτοὺς ἀνέζευξεν
  choice: 便迅速向他们进军
  rationale: ἀναζεύγνυμι在军事语境中表示拔营出发或进军；ἐπʼ αὐτούς表明以他们为敌对目标，“向他们进军”保留这种军事推进含义。
