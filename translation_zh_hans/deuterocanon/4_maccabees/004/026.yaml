  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: zh_hans
  text: 因此，由于民众蔑视他的法令，他亲自以酷刑强迫这个民族中的每一个人，在尝过会使人污秽的食物[a]之后，发誓弃绝犹太教[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不洁的食物”或“受玷污的食物”。希腊词着重表示礼仪上的污秽。
    reason: lexical_alternative
  - marker: b
    text: “发誓弃绝”也可译作“郑重弃绝”。希腊动词可含以誓言否认、正式放弃的意思。“犹太教”在这里可包括犹太人的信仰、实践和群体身份。
    reason: lexical_and_scope_clarification
lexical_decisions:
- source_word: δόγματα
  choice: 法令
  rationale: 指统治者颁布的权威性命令；“法令”在现代汉语中自然，并保留其官方约束力。
- source_word: κατεφρονεῖτο
  choice: 受到……蔑视
  rationale: 未完成时被动语态表示民众持续以轻蔑态度拒斥这些法令；“蔑视”保留了强于单纯“不理会”的语气。
- source_word: διὰ βασάνων
  choice: 用酷刑
  rationale: 表达διά的工具意义和βάσανοι所指的刑讯、折磨，简洁而有力度。
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: 这个民族中的每一个人
  rationale: 保留双重分配表达的强调，也自然呈现ἔθνος的民族群体含义。
- source_word: μιερῶν ... τροφῶν
  choice: 会使人污秽的食物
  rationale: 体现μιερός在此处所含的礼仪性玷污意味，同时避免把它窄化为现代卫生意义上的不洁。
- source_word: ἀπογευομένους
  choice: 在尝过……之后
  rationale: 分词表示相对于弃绝行为在先的动作；此译法清楚保留先后关系。
- source_word: ἐξόμνυσθαι
  choice: 发誓弃绝
  rationale: 同时传达该动词的宣誓意味和正式否认、放弃之义，比单译“弃绝”更完整。
- source_word: τὸν Ἰουδαϊσμόν
  choice: 犹太信仰与生活方式
  rationale: 此词在语境中涵盖宗教实践、群体身份和生活方式；展开翻译可避免现代汉语“犹太教”可能造成的单纯宗教制度化窄化。
theological_decisions:
- issue: τὸν Ἰουδαϊσμόν的范围
  choice: 犹太信仰与生活方式
  alternative: 犹太教；犹太人的生活方式
  rationale: 原词兼含信仰、实践和共同体身份；并列译法保存其宽度，不把它仅限于宗教或族裔。
- issue: μιερῶν τροφῶν的性质
  choice: 会使人污秽的食物
  alternative: 不洁的食物；受污染的食物
  rationale: 原词强调礼仪和信仰层面的玷污，不宜让读者只理解为卫生污染；脚注保留较简洁的其他译法。
- issue: ἐξόμνυσθαι的宣誓色彩
  choice: 发誓弃绝
  alternative: 弃绝；正式否认
  rationale: 复合动词可含起誓否认或郑重摒弃之意；正文呈现宣誓色彩，同时以脚注说明也可较宽泛地理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他就亲自”突出αὐτός的强调；句法保留因果关系、持续受蔑视的背景、酷刑手段以及先尝食物后被迫弃绝的次序。
