  register: 采用现代、庄重而易懂的叙事文体。为避免希腊语长句在中文中结构不清，将奥尼亚的身份和品格说明独立成分句，同时以“原来”承接 γάρ 的解释性语气；未消除“曾任”与“终身制”之间由原文产生的历史张力。
