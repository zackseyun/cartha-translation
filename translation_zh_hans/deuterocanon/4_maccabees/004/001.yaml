  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: zh_hans
  text: 原来，有一个名叫西门的人与奥尼亚作对；奥尼亚曾任终身制大祭司，为人高尚善良。西门千方百计毁谤他，想在有关本民族的事务上[a]加害他，却不能得逞，于是便以流亡者[b]的身份离去，打算出卖自己的祖国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在有关本民族的事务上”：希腊语 ὑπὲρ τοῦ ἔθνους 也可理解为“就本民族而言”，或较直译为“为了本民族”。
    reason: 保留介词短语在关系和方向上的语义歧义。
  - marker: b
    text: “流亡者”也可译作“逃亡者”；希腊语 φυγάς 可指被放逐或流亡的人，也可指正在逃亡的人。
    reason: 保留该名词在流亡与逃亡之间的词义范围。
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: 与……作对
  rationale: 该词表示积极敌对，可能含政治斗争意味；“作对”自然易懂，同时不把政治层面的含义说得过死。
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: 曾任终身制大祭司
  rationale: 保留 ποτε 的过去时间意味和 διὰ βίου 所表达的终身任期性质；“终身制”也避免让中文误以为奥尼亚实际任职直到去世。
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: 为人高尚善良
  rationale: 以现代中文自然表达这组带赞誉意味的道德评价，并保持庄重语气。
- source_word: διαβάλων
  choice: 诬陷
  rationale: διαβάλλω 在这里指恶意诋毁或提出不实指控；“诬陷”同时体现言语毁谤及加害意图。
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: 在有关本民族的事务上
  rationale: ὑπέρ 在此处的具体关系并不完全明确；此译法保留民族或公共事务的范围，而不武断译成“为了本民族”。
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: 想……加害他，却不能得逞
  rationale: 自然表达其企图造成伤害但没有能力或未能成功的含义。
- source_word: φυγὰς ᾤχετο
  choice: 以流亡者的身份离去
  rationale: φυγάς 可指流亡者或逃亡者；正文采用较符合叙事语境的“流亡者”，并以脚注保留另一可能。
- source_word: τὴν πατρίδα προδώσων
  choice: 打算出卖自己的祖国
  rationale: 未来分词表示离去的目的或意图；“祖国”保留 πατρίς 所含的故土和民族归属意味。
