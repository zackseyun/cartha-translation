  text: And the one who had been saved unexpectedly went away, to report to the king the things that had happened to him.
translation:
  language: zh_hans
  text: 那人出乎意料地得以脱险，便离开了，要把自己所遭遇的事禀报国王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  choice: 出乎意料地
  rationale: 表达事情以超出预期、令人惊异的方式发生；既自然，又不额外强化为明确的神迹。
- source_word: διασωθεὶς
  choice: 得以脱险
  rationale: 该被动分词指从危险中安全获救；结合上下文，译为“得以脱险”比单独使用可能带有较强神学色彩的“得救”更明确。
- source_word: ᾤχετο
  choice: 便离开了
  rationale: 此处表示离去；“便离开了”符合现代汉语叙事习惯，并承接前面的获救事件。
- source_word: δηλώσων
  choice: 要……禀报
  rationale: 将来分词在此表示目的；向国王报告事情用“禀报”自然、庄重，也体现对象是君王。
- source_word: τὰ συμβάντα αὐτῷ
  choice: 自己所遭遇的事
  rationale: 保留事件临到其本人、由其亲身经历的含义；“所遭遇的事”简洁而符合上下文。
