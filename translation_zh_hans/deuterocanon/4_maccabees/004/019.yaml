  yaml_path: translation/deuterocanon/4_maccabees/004/019.yaml
  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
translation:
  language: zh_hans
  text: 以致他不仅就在我们故土的卫城上建造了一所希腊式体育馆[a]，还废除了对圣殿的照管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫城”也可按专名译作“阿克拉堡”，即耶路撒冷的一处堡垒。“希腊式体育馆”指希腊化时代兼具体育训练、教育和文化活动功能的机构，并非仅指现代运动场馆。
    reason: alternative_reading
  - marker: b
    text: “照管”也可译作“监护”或“管理”。原文指废除有关圣殿的照管或管理安排，并不是拆毁圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 承接上文并引出结果，保留结果意味，不把它弱化为单纯的逻辑推论。
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: 不但……还……
  rationale: 自然保留希腊文的递进对偶结构。
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: 在……堡垒高地上
  rationale: ἄκρα可指高处、堡垒或特定的阿克拉堡；正文用兼顾地势与防御设施的表达，并以脚注保留专名理解。αὐτῇ的强调由语境与该短语整体体现。
- source_word: τῆς πατρίδος ἡμῶν
  choice: 我们故土的
  rationale: πατρίς指祖居之地或本土；“故土”自然、凝练，并保留群体归属感。
- source_word: γυμνάσιον
  choice: 希腊式体育学馆
  rationale: 此词指希腊化时代兼具体育训练、教育和文化功能的机构；仅译“体育馆”容易被理解为现代场馆。
- source_word: κατασκευάσαι
  choice: 建造
  rationale: 准确表达建成或设置该设施的含义，在具体建筑语境中自然。
- source_word: καταλῦσαι
  choice: 废除
  rationale: 宾语是监管、照管这一制度性安排，因此采用行政意义的“废除”，避免误译为拆毁圣殿。
- source_word: κηδεμονίαν
  choice: 监管
  rationale: κηδεμονία可指监护、照管、保护或管理；“监管”简洁传达受托监督的制度含义，同时脚注保留其他可能。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: 此处ἱερόν指耶路撒冷圣殿或其整体范围；“圣殿”是现代中文圣经语境中清楚而庄重的表达。
theological_decisions:
- issue: ἄκρα在耶路撒冷历史背景中的普通名词与专名歧义
  choice: 正文译为“堡垒高地”
  alternative: 译为专名“阿克拉堡”
  rationale: 希腊词本身可作“高处、堡垒”解，也可能特指耶路撒冷的阿克拉堡。正文采用描述性翻译以便普通读者理解，脚注保留历史专名的可能。
- issue: κηδεμονία τοῦ ἱεροῦ所指的性质
  choice: 译为“对圣殿的监管”，理解为照管或管理安排
  alternative: “对圣殿的照管”或“圣殿的监护权”
  rationale: 原文说被废除的是κηδεμονία，并非圣殿建筑本身；译文避免暗示圣殿遭拆毁，也不把该安排具体化为原文未明说的某一种职制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“希腊式体育学馆”避免现代“健身房”或单纯“体育馆”的误解；“堡垒高地”保留ἄκρα的描述性意义，并以脚注说明专名可能。所有脚注标记均置于正文相关词语之后。
