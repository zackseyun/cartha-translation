  text: They were preventing him as much as they could[b][a]. But with threats Apollonius was going to the temple.
translation:
  language: zh_hans
  text: 他们尽其所能地阻拦[a]。可是，亚波罗尼威胁着向圣殿[b]走去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽其所能”也可译作“在能力所及的范围内”。希腊语习语οἷόν τε ἦν表示可能或能力的限度；ἐκώλυον为未完成时，表示持续的阻拦行动。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣殿”译自ἱερόν，可泛指圣殿的整个区域，不一定只指内部的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷόν τε ἦν
  choice: 尽其所能
  rationale: 这个希腊语习语表示可能或能力的限度；译作“尽其所能”自然地表达他们竭力阻拦，同时不暗示阻拦已经成功。
- source_word: ἐκώλυον
  choice: 阻拦
  rationale: 未完成时主动语态复数表示持续进行的拦阻行动。“阻拦”既可表示试图制止，也不必然表示最终成功，符合上下文中的未决意味。
- source_word: μετὰ ἀπειλῆς
  choice: 出言威胁
  rationale: 介词短语表示伴随方式。希腊语虽用单数名词，汉语译作“出言威胁”比直译“带着威胁”自然，并保留其恫吓意味。
- source_word: ἀπῄει
  choice: 走去
  rationale: 未完成时描写正在进行的移动；结合εἰς所指的目的地，译作“向……走去”自然保留过程性，而不将动作处理成已经完成。
- source_word: εἰς τὸ ἱερόν
  choice: 向圣殿
  rationale: ἱερόν通常可指整个圣殿区域，而不限于内部圣所。“圣殿”是现代汉语中庄重而通行的表达，具体范围留由脚注说明。
- source_word: ὁ Ἀπολλώνιος
  choice: 亚波罗尼
  rationale: 按现代汉语中对该希腊人名的音译方式处理。
