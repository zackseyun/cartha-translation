    reason: 词义备选
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 引出前述情势所造成的结果，保留结果意味，不弱化为单纯推论。
- source_word: γυναῖκας
  choice: 妇女
  rationale: 直译所指的女性；上下文表明她们是孩子的母亲，但原文并未使用“母亲”一词。
- source_word: ὅτι
  choice: 因
  rationale: 在此说明她们受刑的原因，即她们给孩子行了割礼。
- source_word: περιέτεμον τὰ παιδία
  choice: 给孩子行了割礼
  rationale: 自然表达此前发生并成为受刑缘由的行动；“孩子”不擅自缩窄为“男孩”。
- source_word: μετὰ τῶν βρεφῶν
  choice: 和婴儿一起
  rationale: βρέφη指年幼的婴孩；中文不补入所有格，以免超出原文字面。
- source_word: κατακρημνίζεσθαι
  choice: 被从高处扔下
  rationale: 表达该动词所含从高处猛烈抛下的意思，同时不擅自指定为悬崖等具体地形。
- source_word: προειδυίας
  choice: 早已知道
  rationale: 分词修饰妇女，表示她们事先知道将临到自己的后果。
- source_word: τοῦτο πείσονται
  choice: 自己会遭受这样的事
  rationale: πάσχω在此表示经历或遭受；保留τοῦτο指向前述刑罚的概括性。
theological_decisions:
- issue: 迫害处境中的割礼
  choice: 直接译作“给孩子行了割礼”
  alternative: 按圣约的规矩给孩子作记号／为孩子施行礼仪
  rationale: 原文把犹太人的割礼实践直接列为受迫害的缘由；直译既保留历史与神学张力，也不加入后来的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以致……便……”清楚呈现结果与因果关系；分号将刑罚事实与妇女预先知情的陈述相连。脚注标记紧随其所解释的动词短语。
