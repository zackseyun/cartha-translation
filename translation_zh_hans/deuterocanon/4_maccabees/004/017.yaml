  text: And he permitted him to serve as high priest and to lead the nation[a].
translation:
  language: zh_hans
  text: 他准许那人担任大祭司，并领导这个民族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“治理这个民族。”希腊语动词可指以首领身份带领或治理。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: 准许
  rationale: 表示给予许可或允准；“准许”既体现授权意味，也不把它强化为正式任命。
- source_word: ἀρχιερασθαι
  choice: 担任大祭司
  rationale: 该不定式指履行或持有大祭司职分；“担任大祭司”符合现代汉语习惯，并兼顾身份与职能。
- source_word: τοῦ ἔθνους
  choice: 这个民族
  rationale: 在犹太民族共同体的语境中，ἔθνος 指作为民族—政治整体的人民；“这个民族”比单纯的“人民”更能保留其共同体含义。
- source_word: ἀφηγεῖσθαι
  choice: 领导
  rationale: 该词可指作为首领带领、治理；“领导”保留较宽泛的意义，不将其过度收窄为政治统治。
theological_decisions:
- issue: 获准权柄的范围
  choice: 同一项准许同时涵盖担任大祭司和领导民族。
  alternative: 第二个不定式也可更偏政治性地理解为“治理这个民族”。
  rationale: 希腊文以两个并列不定式共同受“准许”支配，兼具宗教职分与民族领导层面；正文不进一步强化其政治含义。
translation_notes:
  register: 采用现代、庄重而自然的简体中文。“那人”承接上下文中的 αὐτῷ；“这个民族”使定冠词所指的特定共同体在中文中更清楚。
