base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/015.yaml
  text: When Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
translation:
  language: zh_hans
  text: 塞琉古王去世后，他的儿子安条克·伊皮法内斯继承了王权；他为人傲慢，令人畏惧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人畏惧”或译“可怕”或“强悍”。希腊语 δεινός 可表示可畏、可怕或强悍。
    reason: 保留该词在威势、危险性和可怕程度之间的词义幅度，避免正文作过窄的解释。
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: 去世后
  rationale: 这是 τελευτάω 的不定过去时属格独立结构，表示先于主句发生的事件；“去世后”自然、准确地表达其时间关系。
- source_word: διάδεχεται
  choice: 继承了
  rationale: 此动词在这里指接续统治权；“继承了”符合王朝承继的语境，又不带“夺取”的含义。
- source_word: τὴν ἀρχήν
  choice: 王权
  rationale: ἀρχή 在此指统治权柄。结合父子相承的君王语境，“王权”比泛指的“政权”更准确，同时没有把它具体化为领土意义上的“王国”。
- source_word: Ἀντίοχος Ἐπιφανής
  choice: 安条克·伊皮法尼
  rationale: 按历史人物的通行处理，将姓名和称号音译，不把 Ἐπιφανής 解释性翻成“显赫者”或“显现者”。
- source_word: ὑπερήφανος
  choice: 傲慢
  rationale: 该词在此带明显贬义；“傲慢”比可能产生正面含义的“骄傲”更清楚地传达狂妄自大的意思。
- source_word: δεινός
  choice: 令人畏惧
  rationale: δεινός 的语义范围包括可怕、可畏、厉害、强悍等。此处是对安条克的负面刻画，“令人畏惧”保留了威胁性，又不过度限定为纯粹残暴。
- source_word: ἀνὴρ
  choice: 他为人
  rationale: 希腊文以“一个……的人”同位描述安条克；现代汉语用“他为人……”更自然，并仍明确指向男性人物。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“塞琉古王”简洁表达 τοῦ βασιλέως；分号使继位叙事与人物评语的关系清楚。脚注标记紧随其所说明的“令人畏惧”。
