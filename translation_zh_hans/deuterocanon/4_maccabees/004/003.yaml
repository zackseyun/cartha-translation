base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: zh_hans
  text: 西门对王的事务怀有敌意[a]，便告发说，耶路撒冷的库房里积存着数以万计的私人钱财[b]；这些钱财并非圣殿所共有[c]，而应当归西流基王所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文句法异常，表达也很压缩。ἥκω通常意为“我已来到”或“我在这里”；整句也可能按“王的事务”或“王的利益”来理解。正文依上下文译作“对王的事务怀有敌意”。
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: 直译为“许多个万的私人钱财”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“与圣殿无关”“不与圣殿共享”，或“不供圣殿使用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: 西门对王的事务怀有敌意
  rationale: 原文此处句法异常且表达压缩：ἥκω通常是第一人称“我已来到／我在这里”，与主语Σίμων及分词ὢν难以顺畅衔接。结合下文西门向王方告发的叙事作用，正文采用“怀有敌意”表达其对王室事务的对立关系，但以脚注保留原文的不确定性。
- source_word: μηνύων
  choice: 告发说
  rationale: 该词指把消息报告出来，语境中带有检举、揭发意味；“告发说”既体现行为性质，也自然引出后面的间接陈述。
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: 数以万计的私人钱财
  rationale: μυριάς以“一万”为基本数值，复数在此表示许多个万；ἰδιωτικῶν χρημάτων明确说明这些是私人所有的钱财。
- source_word: ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις
  choice: 耶路撒冷的库房里
  rationale: γαζοφυλάκιον指存放财物的库房或宝库；此处用“库房”清楚自然，也避免把地点本身预先解释为圣殿资产。
- source_word: τεθησαυρίσθαι
  choice: 积存着
  rationale: 完成时不定式表示钱财已经被存放并仍在那里；“积存着”在现代汉语中保留这一结果状态。
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: 并非圣殿所共有
  rationale: ἐπικοινωνέω表达参与、共有或相联；此处与“私人钱财”呼应，说明这些存款不属于圣殿共有，但脚注保留“与圣殿无关／不供圣殿使用”等可能理解。
- source_word: προσήκειν ταῦτα Σελεύκῳ τῷ βασιλεῖ
  choice: 而应当归西流基王所有
  rationale: προσήκειν可表示归属、应归某人或某人有权主张。这里是在陈述王对这些钱财的权利主张，译作“应当归……所有”比单纯“属于”更能体现其宣称性质。
theological_decisions:
- issue: 耶路撒冷库房内钱财的性质
  choice: 正文将其表述为私人钱财，并说明不属于圣殿共有。
  alternative: 这些钱财只是与圣殿无关，或不供圣殿使用。
  rationale: ἰδιωτικῶν χρημάτων明确标示私人所有；μὴ ἐπικοινωνούσας τῷ ἱερῷ则否定其与圣殿共有的关系。这样的译法保留西门指控的逻辑：既然不是圣殿财产，他便宣称王有权取得；但原文并未认可这项主张确实合法。
- issue: 西门与王室事务的关系
  choice: 正文采用“怀有敌意”，同时脚注明示希腊文句法异常。
  alternative: 可按词面理解为“来到王的事务中／为王的事务而来”，或笼统译为“涉及王的事务”。
  rationale: 原文所给ἥκω在形态与句法上难以和Σίμων ὢν协调，不能把单一解释伪装成毫无疑问的原意。正文参考叙事语境给出可读译文，脚注则保存真实的文本与释义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“告发说”体现μηνύων在叙事中的检举色彩；“数以万计”保留μυριάδες的数量表达；“应当归……所有”呈现西门所宣称的王权主张，而不替叙事者判定该主张正当。所有实质性歧义均以脚注保留。
