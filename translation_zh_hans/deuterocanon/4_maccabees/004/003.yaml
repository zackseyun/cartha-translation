review_pass:
  verdict: revise
  source_fidelity: 正文对资金性质、存放地点及归属主张的处理基本忠实。μως，Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω在所给希腊文本中确有显著的句法/文本困难：ἥκω通常为第一人称。将其无保留地译为“对王的事务怀有敌意”既不够自然，也把“事务”误作可被敌视的对象。依叙事语境采用“敌视王的利益”可以保留英文审校所作的暂定理解，但必须以脚注明确其不确定性。
  naturalness: “对王的事务怀有敌意”搭配生硬；“敌视王的利益”更符合现代标准汉语。人名“塞琉古”是现代汉语史学与圣经语境中更通行的Seleucus译名，宜替换“西流基”。“财库”较“库房”更准确传达γαζοφυλάκια的财物储藏设施含义。
  terminology: “私人钱财”“不与圣殿共有”恰当保留ἰδιωτικῶν χρημάτων及μὴ ἐπικοινωνούσας τῷ ἱερῷ所表达的非圣殿共有关系，而不把西门的归属主张表述为叙事事实。“应归塞琉古王所有”妥当反映προσήκειν的权利宣称。
  issues:
  - severity: medium
    issue: 开头对难解希腊文的正文措辞不自然且过于确定
    rationale: 所给文本的ἥκω为第一人称，和Σίμων及ὢν的关系难以按通常句法成立。应在脚注中明确保留文本困难；正文的语境性译法宜用自然的“敌视王的利益”，不宜说“对王的事务怀有敌意”。
  - severity: low
    issue: Seleucus译名不够通行
    rationale: “塞琉古”是现代简体中文中更标准、普遍的塞琉古王朝及人名译法。
  - severity: low
    issue: γαζοφυλάκια可译得更准确
    rationale: “财库”比一般性的“库房”更明确表达存放钱财的库藏/宝库。
  revised_text: 西门敌视王的利益[a]，便告发说，耶路撒冷的财库中存放着数以万计的私人钱财[b]；这些钱财不与圣殿共有[c]，并且应归塞琉古王所有。
  revised_footnotes:
  - marker: a
    text: 此处希腊文为“Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω”，句法难解；其中ἥκω通常是第一人称，意为“我已来到”或“我在这里”。“王的利益”也可译为“王的事务”或“王的事由”。正文依叙事语境暂译为“敌视王的利益”，但现存措辞与西门之间的确切句法关系不能确定。
    reason: textual_and_lexical_ambiguity
  - marker: b
