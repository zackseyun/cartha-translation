  text: He also sought out the nation and led it into every kind of lawlessness[a].
translation:
  language: zh_hans
  text: 他还搜寻这个民族，使他们陷入各种不法之中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使这个民族过上处处违背律法的生活。”原文动词可能含有塑造一个群体的生活方式或公共行为之意，并非只指迫使人做出一些孤立的不法行为。
    reason: 说明罕见动词ἐξεπολίτευσεν可能包含生活方式或公共行为的塑造意义，并保留较展开的替代译法。
lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: 搜寻
  rationale: 该复合动词表示主动、彻底地寻找；“搜寻”保留其目的性，又不在正文中额外断定是调查、搜捕还是迫害。
- source_word: τὸ ἔθνος
  choice: 这个民族
  rationale: ἔθνος在这里是单数集合名词，兼有族群与民族含义；“这个民族”按上下文指前文所说的犹太民族，但不补入原文未明说的名称。
- source_word: ἐξεπολίτευσεν
  choice: 使他们过上……的生活
  rationale: 该动词源于πολιτεύω，可指塑造公共行为、生活方式或群体秩序；此处采用使动表达，传达使整个民族进入某种违法生活状态的意思，而不把它缩减为若干孤立行为。
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: 处处违背律法
  rationale: παρανομία指违反律法、无视律法；πᾶσαν表示范围全面。“处处违背律法”在现代汉语中自然，并保留其与律法的直接联系。
theological_decisions:
- issue: παρανομία在犹太律法语境中的道德与法律含义
  choice: 违背律法
  alternative: 不法；邪恶；过犯
  rationale: “违背律法”直接反映παρανομία的构词和语境，可能使人联想到祖传律法，但正文不把所指限定为某一套明确法典。
- issue: ἐξεπολίτευσεν所表达的是个别违法行为还是整体生活方式
  choice: 使他们过上……的生活
  alternative: 引他们行各样不法之事
  rationale: 动词可能涉及公民生活、公共行为或生活方式的塑造；采用整体生活方式的表达，同时以脚注保留较简约的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这个民族”保持原文的集体指称；后半句按汉语习惯改用“他们”承接。“处处违背律法的生活”兼顾παρανομία的律法含义与πᾶσαν所表达的全面性。
