  text: 他取得了对他们的权柄后，便迅速来到我们的故土。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的希腊文本在“迅速来到我们的故土”这一处似乎不完整，在“迅速进入我们的故土”之后没有明确的限定动词。“来到”是根据上下文补出的，使句子在中文中完整通顺。
