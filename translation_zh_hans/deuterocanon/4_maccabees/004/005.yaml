lexical_decisions:
- source_word: λαβὼν
  choice: 取得了……后
  rationale: 不定过去时分词表示先于随后行动发生的动作；译为“取得了……后”自然地保留这一先后关系。
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: 管理他们的权柄
  rationale: ἐξουσία可指权柄、权限或支配权；结合περὶ αὐτῶν，这里指对前述之人的实际管辖权。“管理他们的权柄”既清楚，也不把含义缩窄为纯粹武力控制。
- source_word: ταχὺ
  choice: 迅速
  rationale: 该副词表示行动快速；“迅速”简洁庄重，同时不额外强化为“立刻”。
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: 进入我们的故土
  rationale: πατρίς指自己的祖国、家乡或故土；“我们的故土”保留共同体归属和乡土意味，εἰς则以“进入”表达趋向内部的动作。
