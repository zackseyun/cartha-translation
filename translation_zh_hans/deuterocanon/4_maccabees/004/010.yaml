base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/010.yaml
  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: zh_hans
  text: 阿波罗尼乌斯率领一支全副武装的军队前来抢夺钱财时，骑马的天使从天上显现，在他们面前手持兵器、闪耀四方，使那些人陷入极大的恐惧和惊慌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“预先显现”。希腊语动词的前缀既可表示在前方，也可表示事先。
    reason: 保留προυφάνησαν中空间与时间指向的词义歧义。
lexical_decisions:
- source_word: ἀνιόντος
  choice: 前来
  rationale: 该词在此与阿波罗尼乌斯构成属格独立结构，表示他带军队向目标进发；“前来”自然保留趋近之意，不额外指定地势上的上行。
- source_word: καθωπλισμένης στρατιᾶς
  choice: 全副武装的军队
  rationale: καθοπλίζω表示装备武器、武装起来；此译保留完成分词所强调的整备状态及στρατιά的军队含义。
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: 抢夺钱财
  rationale: ἁρπαγή带有强行攫取、掠夺之意，“抢夺”保留行动的暴力和非法色彩；χρήματα宽泛指钱财。
- source_word: οὐρανόθεν
  choice: 从天上
  rationale: 在天使显现的超自然叙事中，“从天上”既符合词义，也保留原文的神学语境，而不将其弱化为单纯的天空方位。
- source_word: προυφάνησαν
  choice: 在他们面前显现
  rationale: προφαίνω的前缀可表达在前方显现，也可能带有预先显现之意；正文采用更贴合现场空间关系的译法，并以脚注保留另一可能。
- source_word: ἔφιπποι ἄγγελοι
  choice: 骑马的天使
  rationale: ἔφιππος明确表示骑在马上的，ἄγγελοι明确称这些形象为天使；直译清楚自然，也不将其改称为普通骑兵。
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: 他们的兵器四周闪耀
  rationale: περιαστράπτω描写环绕闪耀如电光，τοῖς ὅπλοις指出兵器是闪光所关联或凭借之物；此译保留鲜明的视觉形象而不补入原文未明说的动作。
- source_word: πολὺν αὐτοῖς φόβον τε καὶ τρόμον ἐνιόντες
  choice: 使那些人陷入极大的恐惧和惊慌
  rationale: ἐνίημι在此意为把某种感受置入或灌输给人；“使……陷入”符合现代汉语。φόβος与τρόμος构成加强性的并列，译作“恐惧和惊慌”保留双重表达。
theological_decisions:
- issue: οὐρανόθεν在天使干预场景中的含义
  choice: 从天上
  alternative: 从天空中
  rationale: 原文将来者明确称为天使，场景具有超自然含义；“天上”忠实保留这一层面，却不进一步说明干预的机制或教义意义。
- issue: ἔφιπποι ἄγγελοι所描绘者的身份与形态
  choice: 骑马的天使
  alternative: 骑士般的天使
  rationale: 原文同时明确其骑乘形态和天使身份；正文直接保留两者，避免把他们解释为普通骑兵，也避免将“骑马”弱化为比喻。
- issue: προυφάνησαν中προ-的指向
  choice: 在他们面前显现
  alternative: 预先显现
  rationale: 前缀既可涉及空间上的“在前”，也可能涉及时间上的“预先”。上下文未迫使二选一，故正文采用现场叙事中较自然的空间理解，并在脚注保留时间理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“全副武装”“抢夺钱财”“骑马的天使”保持叙事力度和具体画面；分号承接天使显现后的两个分词动作，使长句易读。所有代词均按上下文区分：天使为“他们”，受惊的军队为“那些人”，以免指代混淆。
