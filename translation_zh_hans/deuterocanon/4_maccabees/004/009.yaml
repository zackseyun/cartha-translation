  text: while the priests[a], with women and children, were in the temple imploring God to defend the place that was being treated with contempt,
translation:
  language: zh_hans
  text: 当祭司们同妇女和孩子在圣殿里恳求上帝护卫那正遭人蔑视的地方[a]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那被轻慢之地”或“那受人鄙弃的地方”。希腊文表示这处神圣场所正遭人轻蔑、藐视。
    reason: 说明καταφρονουμένου的词义范围，并交代“地方”在语境中的神圣性质。
lexical_decisions:
- source_word: ἱερέων
  choice: 祭司们
  rationale: 在犹太圣殿礼仪的语境中，ἱερεύς通常指祭司；此译法准确、自然。
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: 同妇女和孩子
  rationale: 原文只说“同妇女和孩子”，并未明确说这些妇女是祭司们的妻子，因此不增添所属关系。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν通常可指整个圣殿区域，不限于内部圣所；“圣殿”符合本段犹太敬拜场景，也便于现代读者理解。
- source_word: ἱκετευόντων
  choice: 恳求
  rationale: 该分词表达迫切、谦卑的祈求；“恳求”既保留语气强度，也符合现代汉语。
- source_word: ὑπερασπίσαι
  choice: 护卫
  rationale: 此词表示为某人或某物挺身保护、抵御威胁；“护卫”适合圣殿受到侵犯的场景。
- source_word: τοῦ καταφρονουμένου τόπου
  choice: 那正遭人蔑视的地方
  rationale: 被动分词καταφρονουμένου表示该地方正在遭受轻蔑或鄙弃。“正遭人蔑视”明确保留其被动和持续意味，同时不把τόπος直接改译为解释性的“圣地”。
- source_word: δὲ
  choice: 当……时
  rationale: δέ在这里配合独立属格结构引入背景中的持续动作，并非强烈转折；汉语用“当……时”自然衔接上下文。
theological_decisions:
- issue: “地方”（τόπος）具体所指
  choice: 正文保留“地方”，语境上最可能指受到亵渎威胁的圣殿所在地
  alternative: 泛指耶路撒冷城，或狭义地专指圣所内部
  rationale: 祭司正在“圣殿里”祈求，因此τόπος最自然地回指这处神圣场所；但原文仍使用一般性的“地方”，故正文不把可能的指向绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文独立属格结构的时间背景功能，以“当……时”构成未完句，和上下文衔接；不擅自把“妇女”解释为祭司们的妻子，也不在正文中把“地方”过度具体化。
