base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/007.yaml
  text: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
translation:
  language: zh_hans
  text: 民众因这项提议而愤慨，并提出反对；他们认为，若那些把寄存的财物托付给圣殿库房[a]的人会被剥夺这些财物，那实在极其可怕，因为[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿库房”直译可作“神圣的库房”；此处指与圣殿有关的库房。
    reason: cultural_note
  - marker: b
    text: 本节的句子尚未结束；“因为”所引出的理由接续在下一节。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: 全国民众
  rationale: 这里指犹太民族的民众整体；“全国民众”兼顾集体性，也比单用“国家”更自然。
- source_word: πρὸς τὸν λόγον
  choice: 因这项提议
  rationale: λόγος 在上下文中指有关圣库资金的提议或方案；译作“提议”比“话”更符合语境，同时保留一定概括性。
- source_word: σχετλιάζοντος
  choice: 愤慨
  rationale: 该词表达强烈的恼怒与义愤；“愤慨”庄重自然，也适合民众对不义措施的反应。
- source_word: ἀντιλέγοντός τε
  choice: 纷纷表示反对
  rationale: ἀντιλέγω 有出言反驳、反对之意；“表示反对”保留言语行为，“纷纷”体现集体反应，但不额外规定具体言辞。
- source_word: πάνδεινον
  choice: 实在太可怕了
  rationale: πάνδεινον 强化 δεινός，表示极其可怕、骇人；此译能以现代汉语自然传达强烈程度。
- source_word: νομίσαντες
  choice: 他们认为
  rationale: 表示作出判断或认定；“认为”简洁而准确。
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: 那些把寄存之物托付……的人
  rationale: παρακαταθήκη 指交由保管之物，πιστεύω 在此表示信任并托付；译文同时保留寄存财物和信托关系。
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: 给圣库
  rationale: ἱερός 表示神圣、属圣所的，θησαυρός 在此为库房或府库；“圣库”简练地保留原文措辞，脚注说明其语境所指。
- source_word: στερηθήσονται
  choice: 竟要失去这些财物
  rationale: 被动式意为被剥夺、丧失；汉语用“失去”更自然，“竟”传达他们对此结果的震惊，而不明确行为主体。
- source_word: ὡς
  choice: 因为
  rationale: ὡς 在句末引出下一节所述理由；保留“因为”及未完句式，使跨节延续清楚可见。
theological_decisions:
- issue: 圣殿相关用语是否直接明说“圣殿库”
  choice: 正文译“圣库”，脚注说明指圣殿的库房
  alternative: 正文直接译“圣殿库”或“圣殿宝库”
  rationale: 原文 ἱερῷ 是“神圣的／属圣所的”，并未直接出现“殿”字；正文保留原文表达，脚注补明历史语境，避免过度明释。
- issue: 寄存财物遭受损失的方式
  choice: 译作“失去这些财物”
  alternative: 译作“被剥夺这些财物”或“财物被抢走”
  rationale: 原文被动词 στερηθήσονται 未明说实施剥夺者；“失去”保留这种开放性，不把行为定性得比原文更具体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。将希腊语属格独立结构拆分为两个汉语句子，以提高可读性；句末特意保留“因为”，呈现原文跨节未完的句法。所有脚注标记均置于正文相应位置。
