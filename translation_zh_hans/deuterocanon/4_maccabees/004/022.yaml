  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: zh_hans
  text: 他蹂躏了他们以后，便颁布诏令：他们中若有人被发现按祖传的律法生活，就要被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπόρθησεν
  choice: 蹂躏了
  rationale: 该动词可指攻陷、劫掠或摧残；“蹂躏”保留军事征服所含的毁坏意味，避免像“制服”那样只表达统治结果。
- source_word: δόγμα ἔθετο
  choice: 颁布诏令
  rationale: 这一表达指正式制定并公布权力机关的命令；“颁布诏令”符合君王政令的语境，也自然庄重。
- source_word: φαίνοιεν
  choice: 被发现
  rationale: 该词本义为“显现、看来”；在禁令和刑罚的语境中，“被发现”自然表达有人被查明如此行事，同时不把它强化为正式定罪。
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: 祖传的律法
  rationale: πάτριος 指从先祖承袭而来；“祖传的律法”既保留其族群与宗教传承意味，也不引入后来的教派术语。
- source_word: πολιτευόμενοι
  choice: 按……生活
  rationale: 该分词表示依某种规范行事或安排生活；“按……生活”传达持续遵行律法的生活方式，而非仅指个别礼仪行为。
- source_word: θάνοιεν
  choice: 被处死
  rationale: 字面为“死”，但在诏令规定刑罚的上下文中，所指是由权力机关执行死刑；“被处死”准确体现这一司法性含义。
theological_decisions:
- issue: πατρίῳ νόμῳ 所标示的犹太身份与传承
  choice: 祖传的律法
  alternative: 祖先的律法
  rationale: “祖传的律法”自然表达从先祖承袭的民族—宗教规范，并保持原文强调的传承连续性，不将其替换为后来的专门神学称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“蹂躏”较强地保留 ἐπόρθησεν 的破坏性军事色彩；句式依照原文的先后关系，先述征服，继而引出诏令及死刑规定。
