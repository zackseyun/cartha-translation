  to: 亚波罗尼乌斯逐一得知这些事后，称赞西门对王的关切；但他上去见塞琉古，向他禀报钱库的事[a]。
  rationale: 修正亚波罗尼乌斯的人名音译，并以更自然、明确的汉语表达旅行方向、对王的关切及报告钱库这一行动；不把κηδεμονία定为政治忠诚，也不将κατήμηνυε强解为恶意告发。
