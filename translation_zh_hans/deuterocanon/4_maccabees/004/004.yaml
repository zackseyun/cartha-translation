  source_fidelity: 基本忠实呈现了逐项得知、称赞西门、上去见塞琉古并报告钱库的叙事次序。惟“亚波罗尼乌”遗漏希腊人名词尾，且“向他禀报了那座钱库”在汉语中易理解为报告一座建筑物本身；改为“禀报钱库的事”更准确表达κατήμηνυε的宾语关系。
  naturalness: “上到塞琉古那里”略显生硬；“上去见塞琉古”是自然的现代汉语，也保留ἀναβὰς的“上去”及πρὸς所指的对象。“对王的关切”比“对王的尽心”更直接对应κηδεμονία的关照、关切，不预设其为忠诚。
  terminology: 人名宜作“亚波罗尼乌斯”，与希腊Ἀπολλώνιος及中文相关文献的常用译法相符。西门、塞琉古可保留。“钱库”可保留为具体库藏，但正文须清楚其为被报告的事项。
