  yaml_path: translation/deuterocanon/4_maccabees/004/004.yaml
  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
translation:
  language: zh_hans
  text: 亚波罗尼乌斯逐一得知这些事后，称赞西门对王的关切；但他上去见塞琉古，向他禀报钱库的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禀报”也可译作“告发”；原文动词可表示报告、告知，也可能带有揭露的意味。“钱库”直译为“钱财的宝库”。
    reason: 保留κατήμηνυε可能具有的中性报告与负面揭发两层语气，并说明τὸν τῶν χρημάτων θησαυρόν的结构。
lexical_decisions:
- source_word: τούτων ἕκαστα
  choice: 逐一得知这些事
  rationale: 保留ἕκαστα的逐项、分别之意，同时使中文叙事自然。
- source_word: γνούς
  choice: 得知……后
  rationale: 将不定过去时分词所表达的先行动作译为现代汉语的时间从句。
- source_word: κηδεμονίας
  choice: 尽心
  rationale: 此词表示关切、照料或维护；“对王的尽心”既符合西门所声称的态度，也不把它过度限定为政治上的忠诚。
- source_word: ἐπαινεί
  choice: 称赞
  rationale: 准确表达公开认可、赞许之意；希腊文的历史现在时按汉语叙事习惯处理。
- source_word: ἀναβὰς
  choice: 上到
  rationale: 保留动词“上去”的方向含义，不擅自补充未明说的地理原因。
- source_word: κατήμηνυε
  choice: 禀报
  rationale: 该词可指报告、告知，也可能含揭发色彩；在向君王报告钱库的语境中，“禀报”自然且不过度强化敌意。
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: 那座钱库
  rationale: θησαυρός在此指存放财物的库藏或宝库，τῶν χρημάτων说明其中所存的是钱财；“钱库”简洁保留具体库藏意象。
- source_word: ὁ Ἀπολλώνιος
  choice: 亚波罗尼乌
  rationale: 按希腊语人名音译。
- source_word: Σίμωνι
  choice: 西门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Σέλευκον
  choice: 塞琉古
  rationale: 采用现代中文历史与圣经相关文献中通行的音译。
