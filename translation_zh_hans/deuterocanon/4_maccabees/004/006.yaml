  yaml_path: translation/deuterocanon/4_maccabees/004/006.yaml
  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
translation:
  language: zh_hans
  text: 同那被咒诅的西门和一支极其强悍的军队一起。[a]他上前，声称自己奉王命而来，为要取走库房中属于私人的款项。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极其强悍的军队”直译为“极其沉重的军队”；这里的“沉重”是比喻说法，可指规模庞大、压迫性强或令人畏惧的军事力量。
    reason: lexical_alternative
  - marker: b
    text: “属于私人的款项”可能指存放在库房中、被视为私人财产或由私人寄存的钱财，并非一定指整个库房的全部财物。
    reason: cultural_note
lexical_decisions:
- source_word: καταράτου
  choice: 可诅咒的
  rationale: 保留该词强烈的谴责意味，表达此人应受咒诅，而不弱化为一般的“可恶”。
- source_word: βαρυτάτου στρατοῦ
  choice: 一支极其强悍的军队
  rationale: βαρύς本义为“沉重”，在军事语境中可指具有压迫感、令人畏惧或强大的力量；“极其强悍”在现代汉语中自然地保留这种威慑意味，同时不把它狭义限定为人数众多。
- source_word: προσελθών
  choice: 他上前
  rationale: 分词表示先于主要言说动作发生的接近或走上前；“上前”简洁自然。
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: 奉王命
  rationale: 简明表达与格在此所含的凭借或授权意义，即他的到来出于王的命令。
- source_word: ἥκειν
  choice: 而来
  rationale: ἥκω表示已经来到并在场；在间接引语中译作“而来”符合自然汉语。
- source_word: ὅπως
  choice: 为要
  rationale: 明确保留目的关系，同时采用庄重而易懂的经文语体。
- source_word: τὰ ἰδιωτικὰ ... χρήματα
  choice: 属于私人的款项
  rationale: ἰδιωτικός在此与公共或神圣财物相对，χρήματα指钱财；此译避免把它过度具体化为某一种存款制度。
- source_word: τοῦ γαζοφυλακίου
  choice: 库房中
  rationale: γαζοφυλάκιον指存放财物的库房或财库；不在正文中擅自补入原词未明说的“圣殿”。
- source_word: λάβοι
  choice: 取走
  rationale: 保留λαμβάνω宽泛的“拿取”意义，并以“取走”体现从库房带走款项的动作，而不强化为词义未必要求的“抢夺”。
theological_decisions:
- issue: 是否在正文中将γαζοφυλάκιον明确译为“圣殿库房”
  choice: 库房
  alternative: 圣殿库房
  rationale: 上下文可能指耶路撒冷圣殿的库房，但本句名词本身没有明说“圣殿”；正文采用较直接的译法，以免把语境推论写进词义。
- issue: 如何理解“属于私人的款项”
  choice: 保留为私人所有款项的宽泛表述
  alternative: 私人存款
  rationale: 原文表明这些钱财具有私人而非公共或神圣的性质，但没有明确说明具体保管或存款制度，因此不作进一步限定。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。开头保留希腊文本作为上文延续的句法形态，不擅自补出本节未出现的主语或谓语；“奉王命而来”“为要”维持叙事的正式语气。脚注标记均置于所解释的词组之后。
