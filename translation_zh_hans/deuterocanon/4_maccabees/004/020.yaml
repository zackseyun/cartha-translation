  yaml_path: translation/deuterocanon/4_maccabees/004/020.yaml
  text: Because of these things[a], divine justice, having become indignant, made war against Antiochus himself.
translation:
  language: zh_hans
  text: 因这些事，神圣的公义[a]大为愤慨，便向安提阿古本人开战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的审判”“神圣的惩罚”或“神圣的报应”。希腊文δίκη可指公义，也可指施行出来的审判、刑罚或报应；此处被拟人化。
    reason: 词义替代：说明δίκη的语义范围，并保留原文的拟人化和神学含蓄。
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: 因这些事
  rationale: 介词短语在此表示原因，并回指前文所述安提阿古的行为；译文简洁自然，同时保留回指关系。
- source_word: ἀγανακτήσασα
  choice: 义愤填膺
  rationale: 该分词表示强烈不满或愤慨；此处修饰被拟人化的“神圣的公义”，用“义愤填膺”既体现愤怒，也与公义的语境相称，并通过后接“便”表达其与主句动作的关系。
- source_word: ἡ θεία δίκη
  choice: 神圣的公义
  rationale: δίκη可指公义、审判、刑罚或报应；这里被拟人化，能愤慨并开战。“神圣的公义”保留其抽象而主动的审判性，也不直接将其改写为“上帝”。
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: 安提阿古本人
  rationale: αὐτόν与语气词τοι共同突出安提阿古本人；“本人”自然传达强调意味。
- source_word: ἐπολέμησεν
  choice: 开战
  rationale: 该动词具有鲜明的军事色彩；在拟人化语境中，“向……开战”保留原文主动敌对和争战的力度。
theological_decisions:
- issue: δίκη的拟人化
  choice: 将其译为会义愤并开战的“神圣的公义”
  alternative: 译作“神圣的惩罚”“神圣的审判”或明确改写为“上帝的公义”
  rationale: 原文让δίκη像行动者一样愤慨并争战。保留这种拟人表达，既不把它缩减为单纯的刑罚，也不将它直接等同于上帝，从而保存原文的文学张力和神学含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义愤填膺”略带书面色彩，与本句拟人化和论述性文体相称；句法保持紧凑，未增添原文没有的行为主体或因果解释。
