  yaml_path: translation/deuterocanon/4_maccabees/004/023.yaml
  text: And since he was in no way able to break the goodwill of the nation by means of decrees[a], but saw all his threats and punishments being nullified[b],
translation:
  language: zh_hans
  text: 既然他无论如何也不能借着法令[a]瓦解这个民族的忠诚，却眼看自己的一切威吓和刑罚都被化解了[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着谕令”。希腊语δόγματα指正式颁布的法令或规章。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文前后两次使用καταλύω这一词族：他未能“瓦解”这个民族的忠诚，自己的威吓和刑罚反而被“化解”了。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: 既然
  rationale: 在这个承接下文的未完句中，兼具情境与因果意味；“既然”自然地引出随后发生的事。
- source_word: κατὰ μηδένα τρόπον
  choice: 无论如何也不能
  rationale: 表达原文强烈而全面的否定，符合现代汉语习惯。
- source_word: ἴσχυεν καταλῦσαι
  choice: 不能……瓦解
  rationale: ἰσχύω与不定式连用表示能力；καταλύω用于抽象对象时，译作“瓦解”能体现使之崩解、消除的意思。
- source_word: διὰ τῶν δογμάτων
  choice: 借着法令
  rationale: δόγματα在此指当权者正式颁布的命令或规章；“法令”庄重、清楚，也符合历史语境。
- source_word: τὴν τοῦ ἔθνους εὔνοιαν
  choice: 这个民族的忠诚
  rationale: εὔνοια可指善意、好感或忠诚倾向；在政治压迫的语境中，“忠诚”自然地表达这个民族坚定不移的倾向，同时不补明其忠诚的具体对象。
- source_word: πάσας τὰς ἑαυτοῦ ἀπειλὰς καὶ τιμωρίας
  choice: 自己的一切威吓和刑罚
  rationale: 分别对应以恐吓和惩处施压的两种手段；“威吓”和“刑罚”简洁而正式。
- source_word: ἑώρα καταλυομένας
  choice: 却眼看……都被化解了
  rationale: 保留ἑώρα的亲眼看见意味；“化解”表示这些手段逐一失去效力，并与前面的“瓦解”呼应同一希腊词族。
theological_decisions: []
