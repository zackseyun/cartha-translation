base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: zh_hans
  text: 大祭司奥尼亚因这些话而忧心；尽管他一向谨慎，惟恐塞琉古王有一天以为亚波罗尼是因人的阴谋而被除掉，而不是因神圣的公正[a]，他还是就有关他的事祷告了些什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚波罗尼是被人的阴谋杀死，而不是出于神圣的审判。”希腊文的“神圣的公正”也可指神圣的裁断。
    reason: 说明ἐπιβουλή、δίκη及ἀνηρῆσθαι的可行译法，并保留δίκη的语义幅度。
  - marker: b
    text: 希腊文直译近似“就他祷告了些什么”。这既可能指为亚波罗尼祷告，也可能指就与他有关的事祷告；祷告的具体内容也未说明。
    reason: 保留ηὔξατό τι περὶ αὐτοῦ在祷告内容及介词短语范围上的歧义。
lexical_decisions:
- source_word: ἐπαχθεὶς τοῖς λόγοις
  choice: 因这些话而忧心
  rationale: ἐπάγω的被动分词在此表示受到话语压迫、心中不安；“忧心”自然地传达其情绪负担，τοῖς λόγοις则译为原因性的“因这些话”。
- source_word: καίπερ ἄλλως εὐλαβηθεὶς
  choice: 另一方面，他又担心
  rationale: εὐλαβέομαι在此指谨慎戒惧，所担心的是王可能作出的判断，并非主要表达宗教敬畏。ἄλλως含义略有弹性；结合上下文，以“另一方面”呈现奥尼亚除因那些话忧心之外的另一层顾虑。
- source_word: μὴ ποτε νομίσειεν
  choice: 担心……有一天会以为
  rationale: 保留μήποτε所表达的忧惧与未来可能性；“有一天”也体现ποτε的时间色彩。
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: 死于人的谋害
  rationale: ἐπιβουλή是针对他人的图谋或阴谋；“人的谋害”简洁地保留其敌意和人为策划的意味。
- source_word: θείας δίκης
  choice: 出于神圣的公正审判
  rationale: δίκη可指公正、惩罚或司法裁断；此处与人的谋害形成对照。“神圣的”紧贴θείας而不擅自补出“上帝的”，“公正审判”则兼顾公义与裁断。
- source_word: ἀνηρῆσθαι
  choice: 死于
  rationale: ἀναιρέω在此语境指除掉、杀死；中文用“死于”可自然地同时连接后面的两种原因说明，且不削弱其死亡含义。
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: 为这事作了祷告
  rationale: 原文直译为“就他/此事祷告了些什么”，τι保留不确定性，περὶ αὐτοῦ的指向也有歧义。正文以自然中文指向整件事情，并用脚注说明也可能指为亚波罗尼祷告。
theological_decisions:
- issue: θείας δίκης所指的神圣施行者及δίκη的力度
  choice: 神圣的公正审判
  alternative: 上帝的公义；神的惩罚
  rationale: 原文使用形容词θείας而未直接使用“上帝”一词；译文不补明施行者，并保留δίκη兼具公正与审判的含义，避免把它单一定为惩罚。
- issue: περὶ αὐτοῦ在祷告短语中的指向
  choice: 正文译作“为这事作了祷告”，脚注保留“为亚波罗尼祷告”的可能
  alternative: 为他祷告
  rationale: αὐτοῦ在语法上可回指亚波罗尼，但περί也可表示关乎其人或相关事件；τι又使祷告内容不明确，因此不应把代祷含义写死。
- issue: 奥尼亚的祷告与亚波罗尼之死的因果关系
  choice: 只陈述奥尼亚因顾虑而祷告
  alternative: 奥尼亚祷告使亚波罗尼获救或复原
  rationale: 本节本身未明说祷告产生何种结果，故不导入上下文传统或特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“奥尼亚”“塞琉古”“亚波罗尼”使用常见汉语音译。句法拆为两句，以免希腊文长句在中文中显得滞重；同时借“另一方面”呈现两层心理动因。所有脚注标记均已置于正文。
