revisions:
- from: 大祭司奥尼亚因这些话而忧心。另一方面，他又担心塞琉古王有一天会以为，亚波罗尼是死于人的谋害，而不是出于神圣的公正审判[a]，于是为这事作了祷告[b]。
  to: 大祭司奥尼亚因这些话而忧心；尽管他一向谨慎，惟恐塞琉古王有一天以为亚波罗尼是因人的阴谋而被除掉，而不是因神圣的公正[a]，他还是就有关他的事祷告了些什么[b]。
  rationale: 修订恢复καίπερ ἄλλως εὐλαβηθεὶς的让步关系，避免将其误作“另一方面”。同时以“因人的阴谋而被除掉／因神圣的公正”较贴近原文的因果对照和正式措辞；结尾保留“祷告了些什么”的不定性，并在脚注中说明“有关他”的两种可行理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:05:03Z'
