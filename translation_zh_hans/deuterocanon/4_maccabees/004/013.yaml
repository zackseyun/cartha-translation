  naturalness: 修订后保留庄重、现代的叙事文体。以分号处理原文长句，避免“另一方面”造成中文逻辑误导；“就有关他的事祷告了些什么”虽带有原文的刻意不定性，仍可理解，并由脚注加以澄清。
  terminology: 人名“奥尼亚、塞琉古、亚波罗尼”可保留。θείας δίκης宜译为“神圣的公正”，不将抽象的δίκη过度定为具体“审判”，也不把θείας明确窄化为“上帝的”。ἀνηρῆσθαι译作“被除掉”保留原文较正式而非直白的死亡措辞。
