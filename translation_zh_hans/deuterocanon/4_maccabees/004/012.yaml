  yaml_path: translation/deuterocanon/4_maccabees/004/012.yaml
  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
translation:
  language: zh_hans
  text: 因为他说自己犯了罪，因而甚至罪该处死；若获救，便会向众人歌颂圣地的福乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “歌颂”也可译作“颂扬”；希腊语动词可指以赞歌吟唱，也可泛指隆重赞美。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 他说
  rationale: 未完成时在叙事中可表示持续或反复言说，但此处用现代汉语简单过去式最自然，不额外强化体貌。
- source_word: ἡμαρτηκώς
  choice: 自己犯了罪
  rationale: 完成时分词表示已经发生且仍具关联的过犯；“犯了罪”清楚表达其自认有罪。
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: 甚至该死
  rationale: ἄξιος加不定式表示应得或配受某结果；“该死”简洁自然，并以“甚至”体现καί的加强作用。
- source_word: σωθεὶς
  choice: 如果得救
  rationale: 该不定过去时被动分词在语境中带条件意味，指若从死亡威胁中获救；保留“得救”的宽度而不强加后期教义含义。
- source_word: ὑμνήσειεν
  choice: 颂扬
  rationale: 该动词可指以赞歌歌颂，也可泛指隆重赞美；“颂扬”在现代汉语中自然庄重，并保留赞歌式色彩。
- source_word: πᾶσίν τε ἀνθρώποις
  choice: 向所有人
  rationale: 与颂扬动词相连的与格自然表示听众或对象。
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: 圣地的福乐
  rationale: “圣地”贴近ἱεροῦ τόπου；“福乐”表达μακαριότης的蒙福、幸福状态，避免将其具体化为建筑物“圣所”。
theological_decisions:
- issue: σωθεὶς所指的拯救
  choice: 保留“得救”，按上下文首先理解为免于死亡、获救
  alternative: 明确译作“如果获救”或理解为广义宗教救恩
  rationale: 叙事情境强调免死后公开颂扬圣地；原文虽可使用宗教性较强的“拯救”词汇，却没有要求读入特定的系统救恩论。
- issue: 圣地之“福乐”的表达
  choice: 圣地的福乐
  alternative: 圣所的蒙福状态；圣地的幸福
  rationale: 保留抽象名词及其可能包含的宗教张力，不把它改写为圣地使人得福等因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“甚至该死”比生硬的“配得死亡”更符合普通话；分号呈现认罪与获救后许愿之间的转折关系。脚注标记已置于正文对应句末。
