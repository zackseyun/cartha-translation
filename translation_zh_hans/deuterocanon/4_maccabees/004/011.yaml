  - severity: medium
    issue: “半死不活”语体偏口语且语义可能偏向萎靡。
    rationale: ἡμιθανής在此指濒死、奄奄一息；宜采用更明确、庄重的表达。
  - severity: low
    issue: “院地”搭配不够自然。
    rationale: περίβολος在此可译为圣殿的院落或圣所区域；“院落”更符合现代汉语。
