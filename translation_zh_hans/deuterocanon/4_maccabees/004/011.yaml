base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: zh_hans
  text: 于是，亚波罗尼乌斯奄奄一息地倒在圣殿那毫无生气的院落中，向天伸出双手，含泪恳求希伯来人为他祈祷[a]，好使他们能使天上的军队息怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他祈祷”直译为“关于他祈祷”。
    reason: 说明περὶ αὐτοῦ的字面表达，同时保留其在本句中代求的自然含义。
  - marker: b
    text: “天上的军队”也可译作“天军”或“天上的大军”；希腊原文没有进一步说明具体所指。
    reason: 保留στρατός的军事和集合含义，并维持其指涉上的开放性。
lexical_decisions:
- source_word: καταπεσὼν
  choice: 倒在
  rationale: 不定过去时分词表示先于主要动作发生的倒下；汉语用“倒在”自然呈现动作及落点。
- source_word: ἡμιθανὴς
  choice: 半死不活
  rationale: 贴近“半死”的字面意义，同时是现代汉语中生动自然的表达。
- source_word: ἄψυχον
  choice: 毫无生命的
  rationale: 保留“无生命、无气息”的字面意象，并与半死的亚波罗尼乌斯形成鲜明反差。
- source_word: τοῦ ἱεροῦ περίβολον
  choice: 圣殿的院地
  rationale: περίβολος可指围起来的区域、院落或界内之地；“院地”既适合圣殿场景，也不把它过度限定为墙垣本身。
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανόν
  choice: 向天伸出双手
  rationale: 准确传达向天举手恳求的姿态，汉语简洁自然。
- source_word: μετὰ δακρύων ... παρεκάλει
  choice: 含泪恳求
  rationale: 将眼泪与强烈请求自然结合，保留危急处境中的情感力度。
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: 人为他祈祷
  rationale: περὶ αὐτοῦ字面为“关于他”，在此语境中表达代求；“为他祈祷”是自然且准确的现代汉语。
- source_word: ἐξευμενίσωνται
  choice: 平息
  rationale: 该词表示使之转为有利、安抚或息怒；“平息”保留对象带有敌意或惩罚性的语境，又避免引入技术性神学术语。
- source_word: τὸν ἐπουράνιον ... στρατόν
  choice: 天上的军旅
  rationale: στρατός本义为军队或军旅；此译保留集体性和军事意象，也不擅自明确其究竟指天使还是对上帝能力的敬称。
theological_decisions:
- issue: “天上的军旅”的具体所指
  choice: 保留为“天上的军旅”，不明确解释为天使或上帝
  alternative: 天军；天上的大军；以敬称方式指上帝或其能力
  rationale: 希腊文本只说τὸν ἐπουράνιον στρατόν，所指仍有开放性；正文应保留这一神学张力。
- issue: 祈祷与“平息”之间的关系
  choice: 译作希伯来人为亚波罗尼乌斯祈祷，从而平息天上的军旅
  alternative: 求得天上军旅的恩待；使天上军旅息怒
  rationale: ὅπως与分词结构表达请求的目的或结果；不额外说明祈祷的机制，也不将其发展为特定赎罪教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“半死不活”较为口语化，却准确有力地对应ἡμιθανής；全句通过“毫无生命的院地”保留原文中无生命之地与垂死之人的修辞对照。所有脚注标记均已置于正文对应处。
