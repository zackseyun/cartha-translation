  source_fidelity: 正文基本准确反映了倒下、举手、含泪恳求和请希伯来人为他祈祷的叙事次序。惟“平息天上的军旅”在汉语中容易被理解为镇压或止息这支军队本身，未准确表达ἐξευμενίσωνται“使其转怒为喜、获得其恩待”的意思。
  naturalness: “半死不活”在现代汉语里常指萎靡、无精打采，语体偏口语，且不够明确地表达濒死。“院地”亦不够自然。“奄奄一息”“毫无生气的院落”以及“使……息怒”更符合庄重叙事语体和现代汉语搭配。
  terminology: 保留“希伯来人”及“天上的军队”，不将后者擅自释为天使或上帝。“天上的军队”比“天上的军旅”更自然，仍保留στρατός的军事与集合含义；脚注继续说明其指涉未定。
