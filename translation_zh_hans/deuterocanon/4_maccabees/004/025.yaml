  naturalness: “污秽人的食物”搭配不自然且产生歧义。改为“污秽的食物”自然，并在此处保留其礼仪性污秽的语境。调整语序后，中文句法更顺畅，且“在尝过……后”清楚限定弃绝行为。
  terminology: “法令”“酷刑”“弃绝犹太教”均合适。“犹太民族中的每一个人”明确 τοῦ ἔθνους 的所指，不把它含混地处理为施令者的“本民族”。关于 ἐξόμνυσθαι 可能含有誓言意味的脚注应保留。
