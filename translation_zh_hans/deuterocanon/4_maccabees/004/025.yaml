base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/025.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: zh_hans
  text: 因此，既然百姓藐视他的法令，他就亲自用酷刑强迫犹太民族中的每一个人，在尝过污秽的食物后弃绝犹太教[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“起誓否认犹太教。”这里的动词可能带有起誓的意味，也可泛指弃绝。
    reason: 保留 ἐξόμνυσθαι 在一般“弃绝”与带誓言色彩的“起誓否认”之间的词义可能。
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: 所以，既然
  rationale: 兼顾 οὖν 的承接推论和 ἐπεί 的原因意味，保留原文“因此／既然”的复合逻辑。
- source_word: τὰ δόγματα αὐτοῦ
  choice: 他的法令
  rationale: 此处指统治者颁布并要求执行的权威命令；“法令”在现代汉语中自然且符合政治语境。
- source_word: κατεφρονεῖτο ὑπὸ τοῦ λαοῦ
  choice: 遭到百姓蔑视
  rationale: 保留 καταφρονέω 所表达的轻蔑、藐视之强烈意味，也以“遭到”反映被动结构；未完成时态所含的持续背景由句境自然表达。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 体现强调代词，突出统治者本人实施或主导强迫。
- source_word: διὰ βασάνων
  choice: 用酷刑
  rationale: 表达以肉体折磨作为强迫手段；汉语“酷刑”本身可集合性地涵盖希腊文复数所指的多次或多种折磨。
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: 本民族的每一个人
  rationale: 保留 ἕνα ἕκαστον 的逐个、无一例外之分配强调；“本民族”按语境指犹太民族，但不在正文额外补明原文未重复说出的名称。
- source_word: μιερῶν ... τροφῶν
  choice: 污秽人的食物
  rationale: μιερός 指带来礼仪或宗教污秽的事物；译作“污秽人的”明确食物造成玷污的作用，避免把它仅理解为卫生意义上的肮脏。
- source_word: ἀπογευομένους
  choice: 要他们尝过……之后
  rationale: 分词与受强迫者一致，表示尝食是强迫过程的一环，并先于弃绝行为；“尝过”贴近原词，不扩大为吃饱或大量食用。
- source_word: ἐξόμνυσθαι
  choice: 弃绝
  rationale: 表达公开否认并放弃原有归属；该动词也可能带有起誓否认的意味，故在脚注保留这一可能。
- source_word: τὸν Ἰουδαϊσμόν
  choice: 犹太教
  rationale: 直接对应 Ἰουδαϊσμός 的名称，同时在现代汉语中清楚易懂；该词在语境中也可涵盖犹太人的信仰、身份及生活方式，不将其缩减为单一教义。
theological_decisions:
- issue: τὸν Ἰουδαϊσμόν 的范围
  choice: 犹太教
  alternative: 犹太人的生活方式／犹太信仰与身份
  rationale: 正文采用直接、通行的名称，不把所受逼迫仅限于抽象信念，也不将其改写为纯粹民族身份；语境容许该词兼含信仰、实践和群体归属。
- issue: ἐξόμνυσθαι 是否明确包含起誓
  choice: 正文译“弃绝”，脚注注明起誓意味
  alternative: 起誓否认
  rationale: 该动词可指郑重弃绝，并可能带起誓否认的词源及语用色彩；正文不把可能的细节绝对化，脚注则保存原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百姓”承接上下文中的群体，“本民族的每一个人”保留逐一施压的强调；句序略作汉语化处理，使酷刑、强迫尝食和弃绝之间的关系清楚，同时不淡化迫害的暴力性质。
