revisions:
- from: 所以，既然他的法令遭到百姓蔑视，他便亲自用酷刑逼迫本民族的每一个人，要他们尝过污秽人的食物之后，弃绝犹太教[a]。
  to: 因此，既然百姓藐视他的法令，他就亲自用酷刑强迫犹太民族中的每一个人，在尝过污秽的食物后弃绝犹太教[a]。
  rationale: 修订仅解决两处影响准确性的表达：“污秽人的食物”改为正确修饰食物的“污秽的食物”，“本民族”改为上下文明确所指的“犹太民族”。其余保留草稿的因果、强迫方式、逐一性、时间关系及誓言语义的脚注处理。
