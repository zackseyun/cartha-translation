  - severity: medium
    issue: “本民族的每一个人”未明确 τοῦ ἔθνους 的语境所指，并可能误指统治者自己的民族。
    rationale: 本节所说的是统治者对犹太人的强迫；明确为“犹太民族中的每一个人”既忠于上下文，也保留逐一强迫的分配意义。
