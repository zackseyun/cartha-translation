base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: zh_hans
  text: 他罢免了大祭司敖尼雅，立他的兄弟伊阿宋为大祭司；伊阿宋许诺，若准许他担任这职，他每年就给[a]三千六百六十他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“支付”。希腊原文直译为“给”，并未直接称这笔款项为贿赂。
    reason: 保留δώσειν的基本词义及其可译为“支付”的语境化含义，避免在正文加入原文未明说的道德定性。
lexical_decisions:
- source_word: καταλύσας τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: 罢免了敖尼雅的大祭司职分
  rationale: καταλύω在此指终止敖尼雅的任职，而非字面意义上的“毁坏”；“罢免……职分”准确表达正式撤职。
- source_word: Ἰάσονα τὸν ἀδελφὸν αὐτοῦ
  choice: 敖尼雅的弟弟伊阿宋
  rationale: 以明确而自然的汉语表达同位关系；αὐτοῦ在上下文中指敖尼雅。ἀδελφός本身不标明长幼，但按人物关系伊阿宋为敖尼雅之弟，因此译作“弟弟”。
- source_word: κατέστησεν ἀρχιερέα
  choice: 立……为大祭司
  rationale: 表达正式任命某人担任大祭司，简洁庄重，也符合历史叙事文体。
- source_word: ὑποσχόμενον δώσειν
  choice: 曾许诺……献上
  rationale: 分词修饰伊阿宋，表明任命与其承诺有关。“献上”保留δώσειν“给”的基本含义，同时不在正文中直接定性为贿赂。
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: 若准他取得这职位
  rationale: τὴν ἀρχήν在此指所求的大祭司职位或职权；采用汉语无主句，既自然，又保留希腊文由掌权者准许伊阿宋任职的关系。
- source_word: κατʼ ἐνιαυτόν
  choice: 每年
  rationale: 准确而自然地表达按年支付。
- source_word: τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: 三千六百六十他连得
  rationale: 完整保留原文数额，并用圣经汉语中常见的古代重量及货币单位音译“他连得”，避免擅自折算为现代币值。
theological_decisions:
- issue: 伊阿宋所承诺款项的道德定性
  choice: 正文只叙述他“许诺……献上”，不直接译作“行贿”
  alternative: 译作“许诺支付”或“以贿赂换取职位”
  rationale: 希腊文只说伊阿宋承诺在获准取得职位后每年给出特定数额，并未使用明确表示“贿赂”的词。交易的腐败性质可由语境判断，不宜在正文中加入原文未明说的道德标签。
translation_notes:
  register: 采用现代、庄重而清楚的历史叙事语体。将希腊文较长的复合句拆成两句，以免汉语代词链含混；仍保留任命、承诺、条件和年度数额之间的逻辑关系。
