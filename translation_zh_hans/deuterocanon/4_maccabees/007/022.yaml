base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: zh_hans
  text: 他既知道，因德行而忍受一切痛苦是有福的，难道不会因敬虔[a]而胜过各种欲望和情感冲动吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔敬”，指对上帝的虔诚敬畏和敬奉。
    reason: 说明εὐσέβεια的词义范围及其明确的宗教指向。
lexical_decisions:
- source_word: εἰδὼς
  choice: 既知道
  rationale: 该分词为反问提供理由；“既知道”自然地表达其因由意味，同时保持句式紧凑。
- source_word: διὰ τὴν ἀρετήν
  choice: 为了德行
  rationale: ἀρετή在这里指道德上的美德或卓越；“德行”符合本书的伦理语境，也适合现代汉语。
- source_word: πάντα πόνον
  choice: 一切痛苦
  rationale: πόνος可指痛苦、劳苦或艰难；“一切痛苦”贴近原文，并与殉难受苦的上下文相称。
- source_word: ὑπομένειν
  choice: 忍受
  rationale: 表达在痛苦之下坚定承受的意思，简洁而自然。
- source_word: μακάριόν ἐστιν
  choice: 是有福的
  rationale: μακάριος含有蒙福、可称为有福的价值判断，不仅是幸运或有利。
- source_word: περικρατήσειεν
  choice: 制伏
  rationale: 该动词表示取得支配、胜过或控制；“制伏”清楚表达理性在敬虔驱动下对情欲取得主导。
- source_word: τῶν παθῶν
  choice: 种种情欲
  rationale: πάθη在《马加比四书》中是伦理哲学用语，指需要受理性约束的情感、欲望和冲动。“种种情欲”保留其负面的伦理色彩，而“种种”自然体现希腊文复数。
- source_word: διὰ τὴν εὐσέβειαν
  choice: 为了敬虔
  rationale: εὐσέβεια在本书中指向上帝的虔诚敬奉；“敬虔”既保留宗教维度，也与前面的“为了德行”形成对应。
theological_decisions:
- issue: 如何保留德行、情欲与敬虔之间的伦理—宗教张力
  choice: 分别译作“德行”“种种情欲”和“敬虔”
  alternative: 可分别译作“美德”“种种激情”和“虔敬”
  rationale: 原句把希腊化伦理语言与对上帝的虔诚结合起来。所选译法既不把πάθη淡化成中性的“情感”，也不把εὐσέβεια泛化为普通道德，从而保留两套语汇在句中的关联与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文的反问结构，并以“为了……难道不会……”再现两个διὰ短语之间的呼应；避免使用容易被理解为单指性欲的孤立“情欲”，故加“种种”提示其涵盖多类欲望和情感冲动。
