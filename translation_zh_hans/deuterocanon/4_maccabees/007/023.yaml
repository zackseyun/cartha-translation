  yaml_path: translation/deuterocanon/4_maccabees/007/023.yaml
  text: For only the wise and self-controlled man is courageous[a], master of the passions.
translation:
  language: zh_hans
  text: 因为唯有智慧而自制的人才是勇敢的[a]，是各种情欲的主人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文采用阳性单数形式，但在这句伦理格言中可泛指“人”。
    reason: 说明原文的语法性别及其泛指功能，防止“人”被误解为掩盖明确的男性所指。
lexical_decisions:
- source_word: μόνος
  choice: 唯有……才
  rationale: 以现代汉语的排他句式表达强调性的“只有、唯独”，自然地保留原文的唯一性断言。
- source_word: σοφὸς
  choice: 智慧
  rationale: 此处指伦理与理性层面的智慧；与“人”搭配为“智慧的人”，庄重且易懂。
- source_word: σώφρων
  choice: 自制
  rationale: 在制服情欲的语境中，突出节制和约束自己的伦理含义，比“头脑健全”更贴合上下文。
- source_word: ἀνδρεῖός
  choice: 勇敢
  rationale: 表达勇气和刚毅，不把该词可能具有的男性色彩误译成“有男子气概”。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: 《马加比四书》中 πάθη 常指应受理性管辖的激情、欲望和冲动；“情欲”保留其伦理张力，“各种”体现复数而不限定具体类别。
- source_word: κύριος
  choice: 主人
  rationale: 这里不是神圣称号，而是指对情欲拥有支配权；“主人”保留名词性比“能控制”更接近原文。
- source_word: ἀνδρεῖός ἐστιν τῶν παθῶν κύριος
  choice: 才是勇敢的，是各种情欲的主人
  rationale: 将两个表语并列呈现，以重复“是”避免汉语逗号连接产生歧义，同时保留原文紧凑的修辞结构。
- source_word: ὁ σοφὸς καὶ σώφρων
  choice: 智慧而自制的人
  rationale: 希腊文以阳性单数形容词名词化，伦理格言中可作泛指；现代汉语“人”既自然，也不额外强化原文语法性别。
theological_decisions:
- issue: 伦理格言中阳性单数名词化形式的性别表达
  choice: 人
  alternative: 男人
  rationale: 原文没有明示 ἀνήρ，而是阳性单数形容词名词化；其在格言中可泛指具备这些品格者。译作“人”保留泛指功能，脚注说明语法形式，避免把语法性别扩大为仅限男性的主张。
- issue: 非神圣语境中的 κύριος
  choice: 主人
  alternative: 主；掌控者
  rationale: 上下文讨论人对情欲的支配，并非以 κύριος 称呼上帝；“主人”清楚表达管辖和制服之意，同时保留名词表语。
- issue: πάθη 的伦理含义
  choice: 情欲
  alternative: 激情；情感；苦难
  rationale: 本书的哲学伦理语境强调理性对内在冲动的治理，“情欲”比中性的“情感”更能表达需要约束的力量，也比“苦难”符合此处搭配。
translation_notes:
  register: 采用现代、庄重而清楚的格言体。“唯有……才……”呈现排他强调；“智慧而自制的人”流畅凝练；用两个“是”明确两个表语之间的关系。
