  yaml_path: translation/deuterocanon/4_maccabees/007/021.yaml
  text: For who, while devoutly pursuing philosophy according to the whole rule of philosophy, and having put his trust in God,
translation:
  language: zh_hans
  text: 因为，有谁依照哲学的全部准则，虔敬地践行哲学[a]，并且已经信靠上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以虔敬的方式，依照哲学的全部准则过哲学的生活。”希腊语以分词短语紧密结合了虔敬的方式与哲学生活的实践。
    reason: 保留φιλοσοφῶν既可指从事哲学思考，也可指按哲学方式生活的语义幅度。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 因为
  rationale: 承接上文，引出理由或说明；保留原文的论证联系。
- source_word: τίς
  choice: 有谁
  rationale: 用现代汉语自然地引出反问，同时保留疑问代词的语气。
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  choice: 依照哲学的全部准则
  rationale: πρός与κανών在此表示符合某种规范；“全部准则”保留ὅλον所强调的完整性及κανών的规范意义。
- source_word: εὐσεβῶς
  choice: 虔敬地
  rationale: 表达敬神、敬虔的方式，语体庄重而不古奥。
- source_word: φιλοσοφῶν
  choice: 践行哲学
  rationale: 这里不只指抽象思辨，也指按照哲学原则生活；“践行哲学”兼顾动作性与生活实践含义。
- source_word: πεπιστευκὼς θεῷ
  choice: 已经信靠上帝
  rationale: 完成时分词表示已经形成并持续有效的信赖；“信靠”比单纯“相信”更能表达对上帝的依赖。
theological_decisions:
- issue: 在哲学殉道语境中如何表达πιστεύω所指的信
  choice: 已经信靠上帝
  alternative: 已经相信上帝；信赖上帝
  rationale: 此处可包含相信与倚赖，但上下文更适合关系性的信靠；同时不把该词扩展为特定宗派的教义术语。
translation_notes:
  register: 采用现代、庄重而清晰的书面汉语。经文在本节末仍是未完成的反问结构，因此保留末尾逗号，与后文衔接。
