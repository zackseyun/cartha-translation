base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/018.yaml
  text: But all who care for godliness with their whole heart[b][a], these alone are able to master the passions of the flesh.
translation:
  language: zh_hans
  text: 然而，凡全心全意关切敬虔的人，唯有他们能制伏肉体的情欲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体的情欲”也可译作“肉体的欲望”或“肉体的冲动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: 然而
  rationale: 承接上文形成转折；“然而”庄重自然，保留逆接语气。
- source_word: ὅσοι
  choice: 凡……的人
  rationale: 表示具有这一特征的所有人，保留复数关系表达的概括和包举范围。
- source_word: τῆς εὐσεβείας
  choice: 敬虔
  rationale: εὐσέβεια在本书中指向对上帝及其律法的虔敬忠诚；“敬虔”保留其宗教指向，又符合现代中文宗教伦理语境。
- source_word: προνοοῦσιν
  choice: 关注
  rationale: 该词表达有意识的关切与看重；“关注”自然且不额外加入“追求”或“持守”等原文未明说的行动。
- source_word: ἐξ ὅλης καρδίας
  choice: 全心
  rationale: 表达发自整个内心、毫无保留的投入；“全心”简洁自然，并保留修饰“关注”的方式含义。
- source_word: οὗτοι μόνοι
  choice: 唯有他们
  rationale: 保留原文的强调和排他性，明确只有前述一类人具有随后所说的能力。
- source_word: δύνανται κρατεῖν
  choice: 能制伏
  rationale: κρατεῖν表示掌控、胜过；“制伏”比一般的“控制”更能体现支配和克胜的力度。
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: 肉体的情欲
  rationale: πάθη在此伦理哲学语境指强烈的欲望、冲动或激情，而非苦难；“肉体的情欲”保留σάρξ的字面意象，并以脚注提示较中性的译法。
theological_decisions:
- issue: 伦理—人论语境中σάρξ的译法
  choice: 肉体
  alternative: 身体；罪性
  rationale: 原文谈与肉身欲求相关的πάθη，却未明确把σάρξ等同于某种系统神学意义上的“罪性”。译作“肉体”既保留源词，又避免把身体本身直接判定为邪恶。
- issue: πάθη在本节中的伦理含义
  choice: 情欲
  alternative: 欲望；激情；苦楚
  rationale: 上下文强调理性与敬虔对肉身冲动的支配，故不取“苦楚”。“情欲”能表达需要制伏的强烈欲求，但其范围可能被读得较窄，因此以脚注保留“欲望／冲动”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……唯有他们……”保留原文的概括与排他强调；不将“肉体”扩释为带有特定教义色彩的“罪性”。
