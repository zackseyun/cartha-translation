base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/008.yaml
  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: zh_hans
  text: 这样的人，必须是那些用自己的血使律法得以确立[a]，并以勇毅的汗水，在直至死亡的苦难中捍卫律法的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“维护律法”。这里的希腊语动词可指制造、产生或促成某事；按本节语境，并不是说他们制定律法，而是说他们以忠贞的行动使律法得以确立。
    reason: 保留δημιουργέω在此处的词义张力，并防止读者误解为立法。
lexical_decisions:
- source_word: τοιούτους
  choice: 这样的人
  rationale: 指前文所说的这一类人；现代汉语自然，同时保留具体的人物指称。
- source_word: δεῖ εἶναι
  choice: 必须……
  rationale: 表达必要性；汉语无需逐字译出系词，也能完整保留原文语气。
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: 使律法得以确立
  rationale: δημιουργέω本可指制造、产生或促成；此处谈殉道者以忠贞行动证实律法，并非制定律法，因此译为“使律法得以确立”，同时以脚注保留“维护律法”的可能。
- source_word: ἰδίῳ αἵματι
  choice: 用自己的血
  rationale: 保留工具格的意义及原文鲜明的身体与牺牲意象。
- source_word: γενναίῳ ἱδρῶτι
  choice: 流下勇毅的汗水
  rationale: γενναῖος兼有勇敢、高尚之意；“勇毅”适合受苦至死的语境，“汗水”保留具体意象，增补“流下”使汉语自然。
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: 经历直到死亡的苦难
  rationale: πάθη指所承受的苦难；μέχρι θανάτου表示以死亡为极限，译文不额外判定死亡是否已经发生。
- source_word: ὑπερασπίζοντας
  choice: 捍卫律法
  rationale: 表达为某物辩护、奋力保卫之意；补出承接前句的宾语“律法”，避免汉语代词指向含混。
theological_decisions:
- issue: δημιουργοῦντας τὸν νόμον的含义
  choice: 使律法得以确立
  alternative: 维护律法；造出律法
  rationale: 上下文强调人以流血和受苦至死的忠贞来证实、落实律法，而不是充当立法者；正文保留“促成确立”的能动意义，脚注说明另一种合乎语境的译法。
- issue: μέχρι θανάτου所指的界限
  choice: 直到死亡
  alternative: 以至于死；冒死
  rationale: 直译其界限含义，不把它弱化为仅仅冒死，也不擅自说明这些人当时是否已经死亡。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“勇毅的汗水”刻意保留原文具体而不寻常的身体意象；句末重复“律法”，以确保指代清楚。
