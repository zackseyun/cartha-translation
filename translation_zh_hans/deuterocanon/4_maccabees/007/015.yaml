base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/015.yaml
  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: zh_hans
  text: 有福的晚年啊，可敬的白发啊，遵守律法的一生啊！死亡的可靠印记，使这一生臻于圆满。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死亡那真实可信的印记，使这一生得到成全。”希腊原文的比喻十分凝练；也可理解为，死亡成为可靠的印证，确认了这样的一生。
    reason: 说明πιστή、σφραγίς和ἐτελείωσεν组合所保留的词义与隐喻歧义。
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: 有福的晚年
  rationale: μακάριος在这里表达值得称颂、令人羡慕的福分，不只是主观快乐；γήρας指老年、晚年。合译为“有福的晚年”，既自然又保留赞叹语气。
- source_word: σεμνῆς πολιᾶς
  choice: 可敬的白发
  rationale: σεμνός含庄重、尊贵、值得敬重之意；πολιά字面指灰白的头发，也可借指高龄。“可敬的白发”保留原文意象和庄严色彩。
- source_word: βίου νομίμου
  choice: 遵守律法的一生
  rationale: νόμιμος可指合法、合乎律法或习俗；本书语境着重忠于犹太律法。“遵守律法的一生”明确而不过度扩展，也比现代汉语中容易仅指守国家法律的“守法人生”更贴合语境。
- source_word: πιστὴ θανάτου σφραγίς
  choice: 死亡那可靠的印记
  rationale: σφραγίς保留为“印记”，维持死亡确认并完成一生的压缩隐喻；πιστή译为“可靠的”，表达可信、确实之意，避免生硬的“忠信的印记”。
- source_word: ἐτελείωσεν
  choice: 使这一生臻于圆满
  rationale: τελειόω可指完成、成全、使达到圆满。“臻于圆满”保留殉道语境中的完成意味，同时不把它限定为后来的技术性神学概念。
theological_decisions:
- issue: βίου νομίμου在犹太殉道叙事中的含义
  choice: 遵守律法的一生
  alternative: 合法的一生；合乎律法的一生
  rationale: 上下文核心是对祖传律法的忠贞，因此明确译出“律法”较能传达原意；但不加“摩西”或“上帝的”等原文没有的限定。
- issue: 死亡之“印记”与一生“圆满”的关系
  choice: 死亡那可靠的印记，使这一生臻于圆满
  alternative: 这一生由死亡确实的印记成全了；死亡可靠地印证了这一生
  rationale: 原文以“死亡的印记”为主语，并用τελειόω表达完成或成全。正文保留印记隐喻及完成意义，不将其单纯解释为“证明”，脚注则说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以三个并列名词短语重现原文的赞叹和递进；第二句补出“这一生”，明确关系代词ὃν所指的βίος，同时避免中文指代含混。
