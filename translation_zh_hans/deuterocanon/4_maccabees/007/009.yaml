base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: zh_hans
  text: 父亲啊，正是你借着坚忍，坚立了我们守法的生活，使之得荣耀[a]；你庄严地称颂圣洁，并没有将它废弃；你又以自己的行为证实了哲学的教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为着荣耀。”希腊语εἰς δόξαν既可表示结果，也可表示目标。
    reason: lexical_alternative
  - marker: b
    text: 或译：“哲学的言论”或“哲学的论证”。希腊语λόγοι可指言语、论证或教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: 父亲啊
  rationale: 原文为单数呼格，未带物主词；用“父亲啊”保留直接称呼及敬重语气，不擅自增添“我们的”。
- source_word: εὐνομίαν ἡμῶν
  choice: 我们守法的生活
  rationale: εὐνομία既涉及良好法秩序，也指按律法而活；此处用具体、自然的表达传达群体忠于律法的生活方式。
- source_word: διὰ τῶν ὑπομονῶν
  choice: 借着种种坚忍
  rationale: διά加属格表示途径或手段；ὑπομονῶν为复数，指在苦难中多次表现出的持守与忍耐。希腊文未明说这些坚忍属于谁，因此中文不加物主语。
- source_word: ἐκύρωσας
  choice: 坚立了
  rationale: 该词有使之有效、确立、证实之意；“坚立”既保留确立的力度，也适合以受苦中的行动使守法生活得到确认的语境。
- source_word: εἰς δόξαν
  choice: 使之得荣耀
  rationale: εἰς可表达目标或结果；正文采用结果性表达，同时以脚注保留“为着荣耀”的可能。
- source_word: ἁγιαστίαν
  choice: 圣洁
  rationale: 指宗教和道德意义上的圣洁或神圣性；“圣洁”简明、庄重，并符合本段语境。
- source_word: σεμνολογήσας
  choice: 庄严地称颂
  rationale: 该分词包含以庄重、尊崇的言辞谈论之意；“庄严地称颂”保留言语行为，避免只译成较宽泛的“尊崇”。
- source_word: οὐ κατέλυσας
  choice: 并没有将它废弃
  rationale: καταλύω可指拆毁、废除或使失效；此处意为没有用相反行为破坏所称颂的圣洁。“它”明确回指“圣洁”。
- source_word: ἐπιστοποίησας
  choice: 证实了
  rationale: 该词表示以凭据确认、使人确信；“证实”自然地表达行为所具有的验证作用。
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: 哲学的教导
  rationale: λόγοι可指话语、论说或教导；在本书以实践印证哲学论述的语境中，“教导”较自然，脚注保留“言论、论证”等词义范围。
theological_decisions:
- issue: 《马加比四书》中φιλοσοφία的含义
  choice: 哲学
  alternative: 智慧；理性的教导
  rationale: 本书有意识地采用希腊化哲学词汇；译作“哲学”可保留其思想语境，不将它泛化为普通的“智慧”。
- issue: διὰ τῶν ὑπομονῶν所指坚忍的主体
  choice: 不在译文中补出物主语
  alternative: 借着我们的坚忍；借着你的坚忍
  rationale: 希腊文该短语本身没有物主词。上下文可能使读者理解为父亲或共同体在苦难中的坚忍，但正文不应替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“父亲啊，正是你”体现原文前置代词σὺ的强调；三个并列分句保留原文赞颂式节奏。正文避免给“种种坚忍”擅加主体，并以脚注保存εἰς δόξαν与λόγοι的真实语义幅度。
