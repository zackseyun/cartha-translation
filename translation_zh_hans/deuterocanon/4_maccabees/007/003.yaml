- from: 他丝毫没有转动敬虔的舵[a]，直到驶入胜过死亡的凯旋港。
  to: 他绝没有偏转敬虔之舵，直到驶入战胜死亡的港湾[a]。
  rationale: 修订以“偏转”准确呈现μετέτρεψεν在航海比喻中的改变航向之意；以“敬虔之舵”保留原文的具体隐喻和庄重语体。句末改为“战胜死亡的港湾”，表达上下文中较可能的“对死亡的胜利”，并删除“凯旋”这一非必要的强化。脚注标记移至句末短语，且保留属格链的替代性形式理解。
