  text: In no way did he turn aside the rudders of godliness[a], until he sailed into the harbor of victory over death.
translation:
  language: zh_hans
  text: 他绝没有偏转敬虔之舵，直到驶入战胜死亡的港湾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为“死亡得胜的港湾”。希腊文的连续属格结构十分紧缩。
    reason: alternative_reading
lexical_decisions:
- source_word: κατʼ οὐδένα τρόπον
  choice: 丝毫没有
  rationale: 表达强烈否定，符合现代汉语习惯，也保留“绝无任何方式”的语气。
- source_word: μετέτρεψεν
  choice: 转动
  rationale: 本义为转变、扭转或使转向；与后文航海意象相连，译作“转动”可自然搭配“舵”，暗示没有改变航向。
- source_word: τοὺς ... οἴακας
  choice: 舵
  rationale: οἴαξ 指船舵或操舵桨。现代汉语通常以集合意义的“舵”表达，即使希腊文为复数，也比生硬的“众舵”自然，并保留具体航海意象。
- source_word: τῆς εὐσεβείας
  choice: 敬虔的
  rationale: εὐσέβεια 在本书语境中指对上帝及其律法的虔敬忠诚；“敬虔”兼具宗教与伦理意味，庄重而通俗。
- source_word: ἕως οὗ
  choice: 直到
  rationale: 准确表达时间界限，并自然引出最终抵达之处。
- source_word: ἔπλευσεν
  choice: 驶入
  rationale: 动词本义为航行；结合港口目的地，译作“驶入”既保留航海意象，也明确表达抵达。
- source_word: τὸν τῆς θανάτου νίκης λιμένα
  choice: 胜过死亡的凯旋港
  rationale: 希腊文连续属格结构紧缩。依殉道者坚忍得胜的上下文，理解为“对死亡的胜利”最为连贯；“凯旋港”保留胜利与安全抵达的复合比喻。
theological_decisions:
- issue: τὸν τῆς θανάτου νίκης λιμένα 中属格关系的解释
  choice: 胜过死亡的凯旋港
  alternative: 死亡得胜的港口；在死亡中得胜的港口
  rationale: 语法形式容许把 θανάτου 理解为“死亡的”，但上下文正在赞扬殉道者至死不移的坚忍，因此以死亡为被胜过的对象最符合修辞走向。由于希腊文结构确有压缩和歧义，正文采用语境上较可能的读法，并以脚注保存另一种形式上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。全句保留“舵—航行—港口”的连贯航海比喻；“丝毫没有”强化坚定不移，“凯旋港”体现胜利抵达。脚注标记置于“舵”后，是为对应整句最终港口意象的解释；其内容实际说明句末属格短语的歧义。
