base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/006.yaml
  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: zh_hans
  text: 你这配得祭司职分的祭司啊！你没有玷污你圣洁的牙齿，也没有让那容纳着敬畏上帝的虔诚和洁净的肚腹参与污秽的进食。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也没有使那容纳着敬畏上帝的虔诚和洁净的肚腹与污秽的饮食有分。”希腊文此处的罕见复合词可指吃下带来礼仪或道德污秽之物，也可着重指这种污秽的进食行为。
    reason: 保留μιεροφαγίᾳ在“污秽食物”与“污秽进食”之间的词义余地，并说明ἐκοινώνησας的“有分／参与”意味。
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: 啊，配得祭司职分的祭司
  rationale: 保留呼格的赞叹语气，并同时译出“祭司”和“祭司职分”，维持原文刻意的重复与修辞力度。
- source_word: ἐμίανας
  choice: 玷污
  rationale: 该词在此指礼仪与道德层面的沾污；“玷污”既保留洁净范畴，也适合修饰具体的身体部位。
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: 你神圣的牙齿
  rationale: 直译原文鲜明而反常规的身体意象，不将其弱化为泛指拒吃不洁食物。
- source_word: θεοσέβειαν
  choice: 敬神之心
  rationale: 表达对上帝虔敬、敬畏的态度；比“敬虔”更便于普通现代读者理解，同时避免把它仅处理为抽象品质。
- source_word: καθαρισμόν
  choice: 洁净
  rationale: 保留本节贯穿的礼仪及道德洁净语域；该名词也可能带有“洁净礼”的过程意味，但语境更侧重其中所容纳的洁净状态。
- source_word: χωρήσασαν γαστέρα
  choice: 那容纳了……的腹中
  rationale: χωρέω表示容纳或有空间承载；“腹中”保留γαστήρ的身体意象，也使中文句法较自然。
- source_word: ἐκοινώνησας
  choice: 让……沾染
  rationale: 原动词有使之参与、相交或有分的关联意味；结合污秽语境译作“让……沾染”，以自然中文表达腹部没有参与污秽进食。
- source_word: μιεροφαγίᾳ
  choice: 污秽之食
  rationale: 这一罕见复合词涉及吃下造成礼仪或道德污秽之物；“污秽之食”简洁保留食物与玷污两层含义，其语法歧义另以脚注说明。
theological_decisions:
- issue: 洁净语言用于牙齿、腹部和进食的具体身体意象
  choice: 保留“神圣的牙齿”以及腹中容纳敬神之心与洁净的意象
  alternative: 概括译为“你拒绝吃不洁净的食物”
  rationale: 原文有意将祭司身份、身体器官和饮食洁净紧密相连；保留具体意象可呈现其修辞张力，而不把经文简化成一般性的饮食禁令。
- issue: μιεροφαγίᾳ所指的是污秽食物还是污秽的进食行为
  choice: 正文译作“污秽之食”
  alternative: “吃污秽之物”或“污秽的进食”
  rationale: 该复合名词可着重于造成污秽的食物，也可着重于吃这种食物的行为。正文采用简洁的食物指向，脚注保留行为性理解。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。以“啊”传达颂赞式呼语；保留“祭司／祭司职分”的修辞重复和“神圣的牙齿”这一突出的原文意象。正文不加未见于希腊文的宗派性解释。
