  yaml_path: translation/deuterocanon/4_maccabees/007/012.yaml
  text: Thus Eleazar[a], the descendant of Aaron, though being burned through the fire[b], did not change his resolve.
translation:
  language: zh_hans
  text: 如此，亚伦的后裔[a]以利亚撒虽经烈火烧灼，却没有改变自己的理性意志[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“亚伦族的”。即属于亚伦的世系。
    reason: lexical_alternative
  - marker: b
    text: 或译“自己的理性”“自己的理性判断”或“自己的决心”。这里的希腊词可指理性的判断或思虑，也可指由此而来的坚定决断；它是《马加比四书》的重要主题词。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: 就这样
  rationale: 承接上文，既可表示事情发生的方式，也带有总结意味；现代汉语自然且保留原文的修辞联系。
- source_word: ὁ Ἀαρωνίδης
  choice: 亚伦的后裔
  rationale: 该称谓指属于亚伦世系的人；译出其含义，比音译为专门称号更便于普通读者理解。
- source_word: Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: διὰ τοῦ πυρὸς ὑπερτηκόμενος
  choice: 在烈火中身体消熔
  rationale: ὑπερτήκομαι 描绘受强烈热力而熔化、耗损的状态；“身体消熔”保留其强烈形象，又避免让人误以为他已被完全烧尽。διά 加属格在此可表达经受火焰的处境或媒介，故译作“在烈火中”。
- source_word: οὐ μετετράπη
  choice: 没有改变
  rationale: 表示在酷刑压力下并未转变或动摇，与其后的 λογισμός 搭配自然。
- source_word: τὸν λογισμόν
  choice: 自己的理性意志
  rationale: λογισμός 在《马加比四书》中兼有理性思考、理性判断及由此形成的坚定意志等含义；“理性意志”尽量保留其哲学分量和本句中的坚忍意味。
theological_decisions:
- issue: 如何翻译全书主题词 λογισμός
  choice: 自己的理性意志
  alternative: 自己的理性；自己的决心；自己的理性抉择
  rationale: 单译“决心”容易淡化本书关于理性统御激情的主题，单译“理性”又可能削弱本句所强调的坚定不移。“理性意志”保留两方面的张力，脚注同时说明原词的语义范围，不把它限定为某一教派式解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“身体消熔”刻意保留原文关于烈火使人熔化、耗损的强烈形象；“却”明确呈现分词结构与主句之间的让步关系。两个脚注标记均置于所解释的词语之后。
