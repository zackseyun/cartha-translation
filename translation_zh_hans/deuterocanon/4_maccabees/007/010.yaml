base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/010.yaml
  text: O Eleazar[a], elder stronger than torments, old man more intense than fire[b], and king greater than sufferings.
translation:
  language: zh_hans
  text: 以利亚撒啊，你这比酷刑[a]更强有力的长者、比烈火更强劲的老人、胜过苦难的至大之王[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酷刑”也可译作“折磨”；这里的希腊词在本段语境中可特指刑讯和酷刑。
    reason: lexical_alternative
  - marker: b
    text: “长者”“老人”和“王”都是直接称呼以利亚撒的高昂比喻；“王”并非指他拥有政治王位。
    reason: cultural_note
lexical_decisions:
- source_word: βασάνων
  choice: 酷刑
  rationale: 在殉道叙事中指施加于人的刑罚与折磨；“酷刑”比泛称“痛苦”更切合具体语境，同时保留复数所概括的种种刑罚。
- source_word: βιαιότερε
  choice: 更强有力
  rationale: βίαιος的比较级可指更猛烈、更有力。这里赞颂以利亚撒在道德力量上胜过酷刑的暴力，直译为“更猛烈”容易误成他更残暴，故译“更强有力”。
- source_word: γέρων
  choice: 长者
  rationale: 指年老之人；“长者”带有敬意，并与后面的πρεσβῦτα“老人”有所区分。
- source_word: πυρός
  choice: 烈火
  rationale: 原文为“火”；加“烈”自然体现比较语境中的炽烈力量，并不改变所指。
- source_word: εὐτονώτερε
  choice: 更刚毅
  rationale: εὔτονος可表示强健、强劲、坚韧或有张力。用于受刑者而与火相比时，“刚毅”自然表达其坚韧不屈，同时保留该词并非单指热度的特点。
- source_word: πρεσβῦτα
  choice: 老人
  rationale: 这是对年长者的直接称呼；采用“老人”保留与γέρων“长者”的近义排比，而不把二者完全合并。
- source_word: παθῶν
  choice: 苦难
  rationale: 在酷刑和烈火的上下文中指所承受的痛苦、患难，而非内在情欲。
- source_word: μέγιστε
  choice: 更伟大
  rationale: 字面为“至大、最伟大”；与属格παθῶν结合，并顺应前两项比较结构，译作“比苦难更伟大”。
- source_word: βασιλεῦ
  choice: 王
  rationale: 保留原文直呼“王”的高昂隐喻，表示他凌驾于苦难之上，并非说明政治身份。
- source_word: Ἐλεαζάρ
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 对以利亚撒的隐喻性尊称
  choice: 保留“长者、老人、王”这一连串呼格称颂
  alternative: 意译为“你胜过酷刑、烈火和苦难”
  rationale: 希腊文并非普通陈述，而是以三个呼格构成的高昂赞词。保留这些称谓可呈现其修辞张力，也不把“王”解释成实际政治职位。
- issue: μέγιστε与παθῶν的关系
  choice: 按比较关系译为“比苦难更伟大的王”
  alternative: 译为“统治苦难的至大之王”
  rationale: 属格可以引发“胜过”或“凌驾于”苦难的理解；顺承前两个明确的比较级，正文采用比较表达，但不额外加入“统治”这一解释。
translation_notes:
  register: 采用庄重而可朗读的现代标准汉语，以“你这……”承接连续呼格，使中文自然，同时保留原文三重排比及逐步升高的赞颂语气。
