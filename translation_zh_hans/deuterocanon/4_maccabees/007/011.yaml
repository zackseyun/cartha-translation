  yaml_path: translation/deuterocanon/4_maccabees/007/011.yaml
  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
translation:
  language: zh_hans
  text: 因为，正如先祖亚伦手持香炉，如同披挂武装，在众民中奔跑，战胜了那施火的天使[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施火的天使”也可译作“带火的天使”或“点火的天使”。这里可能暗指亚伦在灾疫中为百姓献香、使灾疫止住的事件（民数记16章）。
    reason: 说明ἐμπυριστής与施火、燃火相关的词义范围及其可能的经文典故，同时不在正文中锁定天使的身份。
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: 因为，正如
  rationale: 同时保留γάρ的解释作用和ὥσπερ引出的比较，并以自然的现代汉语表达。
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: 先祖亚伦
  rationale: πατήρ在此是尊称，突出亚伦作为民族先祖的身份；“先祖”比直译“父亲”更符合现代汉语语境。
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: 以香炉为武装
  rationale: 既表达工具格“用香炉”，也保留καθωπλισμένος鲜明的军事性比喻，避免仅译作“拿着”而削弱原文意象。
- source_word: διὰ τοῦ ἔθνοπλήθους ἐπιτρέχων
  choice: 跑过密集的民众
  rationale: 表达迅速穿行于大群百姓之中的动作；“密集的民众”传达复合词ἔθνοπλήθους所含人数众多、聚集成群之意。
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: 那带来烈火的天使
  rationale: ἐμπυριστής表示与点火、施火有关的行动者；此译保留火的意象，又不在正文中直接把它解释为“灭命的天使”。
- source_word: ἐνίκησεν
  choice: 战胜了
  rationale: 保留νικάω的胜利和交战色彩，与前文“以香炉为武装”的比喻彼此呼应。
theological_decisions:
- issue: 天使的身份及其与亚伦止住瘟疫叙事的关系
  choice: 正文译作“带来烈火的天使”
  alternative: 灭命的天使；施火的天使；点燃烈火的天使
  rationale: 希腊文强调天使与火或施火行动的关联，却没有直接使用“灭命者”一词。这里很可能暗指《民数记》16章亚伦止住灾疫的事件，但正文不把这一暗示扩展为确定的身份判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节作为比较句前半部分的句末逗号，以反映原文句法尚未完结；“以香炉为武装”刻意保留原文的战斗意象。
