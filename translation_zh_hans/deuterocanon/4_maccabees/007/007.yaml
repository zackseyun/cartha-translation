  yaml_path: translation/deuterocanon/4_maccabees/007/007.yaml
  text: O you who are in harmony with the law and a philosopher of the divine way of life[a][b].
translation:
  language: zh_hans
  text: 啊，你这与律法相合[a]、又是神圣生活之道的哲学家[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与律法相合”也可译作“与律法和谐一致”或“与律法一致”。希腊词带有声音协调、和谐共鸣的意象。
    reason: lexical_alternative
  - marker: b
    text: 直译作“神圣生活之道的哲学家”。“神圣的生活之道”也可理解为“敬虔的生活方式”或“属神的生活方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: 啊
  rationale: 呼格语气词，引出直接称呼；“啊”在现代汉语中既保留庄重的感叹语气，又比音译式表达自然。
- source_word: σύμφωνε
  choice: 与……和谐一致
  rationale: σύμφωνος含有声音协调、彼此和谐并由此引申为相符一致的意象；此译兼顾其比喻色彩与实际含义。
- source_word: νόμου
  choice: 律法
  rationale: 属格受σύμφωνε支配；在本书的犹太语境中指向祖传的神圣律法。“律法”是现代中文圣经语域中清楚而自然的表达。
- source_word: φιλόσοφε
  choice: 深究……之道的人
  rationale: φιλόσοφος在本书的哲学语境中不可弱化为一般的“智慧人”；但中文直称“哲学家”容易令人误解为现代职业或学科身份，故以“深究……之道的人”表达其探求并践行智慧生活的含义。
- source_word: θείου
  choice: 属神
  rationale: θεῖος可指神圣、属神或与神有关；“属神”避免把受称呼者本身说成具有神性，同时保留该生活方式与神的关联。
- source_word: βίου
  choice: 生活之道
  rationale: βίος在此不仅指生命本身，也可指生活方式；“生活之道”自然呈现其行为与实践层面的含义。
theological_decisions:
- issue: 如何翻译θείου βίου
  choice: 属神生活之道
  alternative: 神圣的生活／敬虔的生活方式
  rationale: 原文简洁而有意涵张力，既可理解为具有神圣性质的生活，也可理解为面向神、敬虔度日的方式。“属神生活之道”保留与神的关联而不把含义收窄为单一教义解释。
- issue: νόμου是否明确为摩西律法
  choice: 律法
  alternative: 摩西律法／法律
  rationale: 语境很可能指犹太祖传律法，但本句只写νόμου。译作“律法”足以传达语境所指，又不在正文中增添“摩西”这一未明说的限定。
- issue: φιλόσοφε是否直译为“哲学家”
  choice: 深究……之道的人
  alternative: 哲学家／爱智慧的人
  rationale: 本书确实采用哲学术语，但此处称呼的重点是对属神生活之道的智慧探求与践行。正文采用功能明确的表达，脚注保留较形式对应的译法。
translation_notes:
  register: 采用庄重而可懂的直接称呼，以“啊”承接ὦ的修辞力度。句式保留两个并列呼格描述。用“和谐一致”保存σύμφωνος的音乐性隐喻；对φιλόσοφε θείου βίου则避免过度现代学科化，同时以脚注保留直译可能。
