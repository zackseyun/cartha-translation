  yaml_path: translation/deuterocanon/4_maccabees/007/017.yaml
  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: zh_hans
  text: 不过，也许有人会说：“并非所有人都制伏了情欲[a]，因为并非所有人都有明智的理性判断[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情欲”也可译作“激情”“情感与欲望”或“冲动”；这里指需要由理性约束的内在欲望、情感和冲动，而非外在的苦难。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“并非所有人都具有明智的理性判断”。原文“理性判断”是本书论证中的关键词；这里强调理性判断的品质，并非断言有人完全没有理性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: 不过，也许有人会说
  rationale: ἴσως与带ἄν的潜能式εἴποιεν引入一个假设性的反驳；“也许有人会说”自然保留其试探和设想语气，δʼ则按论证转折译为“不过”。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在《马加比四书》的论证中主要指需要由理性约束的欲望、情感和冲动，而非外在苦难；“情欲”简洁庄重，但脚注保留较宽的语义范围。
- source_word: οὐ πάντες περικρατοῦσιν
  choice: 不是所有人都能制伏
  rationale: περικρατέω表示取得支配、控制或胜过；“制伏”传达理性对情欲取得控制的哲学语境。“能”在汉语中自然表达实际达到这种支配，但不将其强化为绝对能力论。
- source_word: φρόνιμον
  choice: 明智的
  rationale: φρόνιμος在此表示具有实践智慧、审慎而健全；“明智”符合现代普通话，也保留其伦理判断色彩。
- source_word: τὸν λογισμόν
  choice: 理性判断
  rationale: λογισμός是本书核心术语，指进行推理和判断的理性；“理性判断”比单译“理性”更具体，同时避免误解为人是否具有理性官能。
- source_word: φρόνιμον ἔχουσιν τὸν λογισμόν
  choice: 人的理性判断都是明智的
  rationale: 原文以φρόνιμον作宾语τὸν λογισμόν的表语，描述理性判断的性质，而不是否认某些人具有任何理性；汉语这样表达可保留该重点。
theological_decisions:
- issue: 未能制伏情欲与理性判断之关系
  choice: 译为并非所有人的理性判断都处于明智状态，因而并非人人都制伏情欲。
  alternative: 可理解为并非所有人都在实际运用明智的理性，而非他们在某种意义上缺少明智的理性。
  rationale: 希腊语ἔχουσιν与表语形容词φρόνιμον最自然地描写其λογισμός所具有的品质。译文不把这句话扩大为某些人完全没有理性，也不替原文判定这是固有缺失还是实际运用上的失败。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引语保留原文提出假想反驳的结构；“制伏”与“理性判断”维持全书理性治理情欲的哲学张力，不加入宗派性解释。
