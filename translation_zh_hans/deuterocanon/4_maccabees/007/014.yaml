  text: by the spirit of reason[a], and by Isaac-like reason he nullified the many-headed wheel.
translation:
  language: zh_hans
  text: 他凭着理性的精神，又凭着以撒般的理性，使那多头的刑轮[a]失去了效力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑轮”也可译作“刑架”或“酷刑器具”；希腊词 στρέβλα 指一种使人身体扭曲受苦的刑具，其确切形制不详。
    reason: 说明罕见刑具词的语义范围，并保留原文具体但不确定的器具形象。
lexical_decisions:
- source_word: πνεύματι
  choice: 精神
  rationale: 这里指由理性产生或支配的内在精神力量、心志，而非特指圣灵；译作“精神”既保留原文比喻，也避免过度解释。
- source_word: λογισμοῦ / λογισμῷ
  choice: 理性
  rationale: λογισμός是《马加比四书》的核心词，指约束激情、支配行为的理性判断；两处统一译作“理性”，保留原文重复。
- source_word: Ἰσακείῳ
  choice: 以撒般的
  rationale: 该形容词表达与以撒相似，而不只是所属关系；“以撒般的”保留其类比及典故意味。
- source_word: πολυκέφαλον
  choice: 多头的
  rationale: 直译该复合形容词，保留原文鲜明而奇特的形象。
- source_word: στρέβλαν
  choice: 刑轮
  rationale: 该词指施行扭拉等酷刑的器具；“刑轮”兼顾刑具性质与具体形象，但器具的确切构造并不完全确定，故以脚注说明。
- source_word: ἠκύρωσεν
  choice: 使……失去了效力
  rationale: 该动词意为使无效、使不能达到目的；此译自然表达刑具未能摧毁受刑者意志的强烈含义，而不增添“毁坏器具”等原文没有的意思。
theological_decisions:
- issue: “理性的精神”（τῷ πνεύματι τοῦ λογισμοῦ）中“精神”的性质
  choice: 理解为理性所体现的内在精神或心志，不特指圣灵
  alternative: 理性的心思；理性的力量；圣灵所赐的理性
  rationale: 上下文强调理性胜过痛苦与激情；原句没有明确的神圣称谓，因此不将其神学化为圣灵。
- issue: “以撒般的理性”（τῷ Ἰσακείῳ λογισμῷ）的典故作用
  choice: 保留为与以撒相似的类比
  alternative: 以撒的理性；效法以撒的理性
  rationale: Ἰσακείῳ是形容词，重点在“像以撒”；直保留类比可让读者感受典故，同时不在正文中限定具体所指是顺服、献身还是忍耐。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凭着……又凭着……”对应两个并列的与格短语；“使……失去了效力”清楚传达ἠκύρωσεν的结果。“多头的刑轮”刻意保留原文不寻常的形象，不擅自消解为抽象的“多种酷刑”。
