  yaml_path: translation/deuterocanon/4_maccabees/007/020.yaml
  text: Therefore[a], nothing is opposed by the fact that some appear to be ruled by passions because of weak reason.
translation:
  language: zh_hans
  text: 所以，有些人似乎因理性软弱而受情欲支配，这并不能构成反证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν οὖν ἐναντιοῦται
  choice: 所以……这并不能构成反证
  rationale: οὖν承接上文作推论；ἐναντιοῦται在论证语境中表示与先前命题相抵触。中文采用“不能构成反证”，自然表达表面反例并未推翻前述主张。
- source_word: τὸ φαίνεσθαί τινας
  choice: 有些人似乎
  rationale: 保留φαίνεσθαι所含的表象与实情之别，同时把希腊语名词化不定式转换为自然的现代汉语分句。
- source_word: παθοκρατεῖσθαι
  choice: 受情欲支配
  rationale: 该复合词表示受πάθη控制；“受……支配”保留统治意象，并与本书理性治理情欲的哲学论述相呼应。
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: 因理性软弱
  rationale: διά加宾格表示原因；λογισμός在本书中指理性判断或推理能力，“理性软弱”简洁保留其与情欲之间的对照。
theological_decisions:
- issue: 理性与情欲之间的人论及哲学张力
  choice: 将λογισμός译为“理性”，将παθοκρατεῖσθαι译为“受情欲支配”
  alternative: 将λογισμός译为“心思”或“思考”，将παθοκρατεῖσθαι译为“被情绪压倒”
  rationale: 本节延续《马加比四书》关于理性治理诸情欲的论证。所选译法保留这一哲学框架，而不引入后世宗派性的人论。
- issue: ἐναντιοῦται所指的逻辑关系
  choice: 译为“不能构成反证”
  alternative: 译为“并不与此相抵触”
  rationale: 希腊文没有明说被反驳或抵触的命题，须由上文补足；“构成反证”明确其论证功能，却不替经文界定该命题的具体内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句序略作调整，使原因短语紧接“受情欲支配”，并以“这并不能构成反证”收束推论；不添加原文没有的明确宾语。
