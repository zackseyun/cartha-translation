    issue: “临海的峭壁”增添了原文未直说的“临海”限定。
    rationale: πρόκρημνον ἄκραν指陡峭、突出的高地或岬角；后文的波涛使海岸画面十分可能，但译文宜不把推知的地理背景写成明示信息。
  - severity: medium
    issue: “狂乱”在汉语语序中易被理解为修饰“情欲”。
    rationale: μαινομένους在希腊文中与κλύδωνας（波涛）一致，描述的是狂暴翻腾的浪涛。将其置于“情欲的波涛”之前可较清楚保留这一修饰关系。
  - severity: low
