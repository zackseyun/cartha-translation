  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: zh_hans
  text: 因为父老以利亚撒将自己的心志伸展，如同一道陡峭的岬角[a]，击碎了环绕着他的狂暴情欲[b]的波涛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陡峭的岬角”也可译作“峭壁”或“突出的危崖”。希腊文描绘一处陡峭、突出的岩石高地。
    reason: lexical_alternative
  - marker: b
    text: 这里的“情欲”泛指失序的欲望、冲动和激情，并非仅指性欲；这是《马加比四书》论述内在心志与这类冲动关系时的关键词。
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: 临海的峭壁
  rationale: 该短语描绘向前突出的陡峭岩壁；结合后文波涛的意象，“临海的峭壁”既自然鲜明，也保留岩壁迎击海浪的画面。
- source_word: διάνοιαν
  choice: 心志
  rationale: 此处既涉及思想、理性能力，也涉及坚决的内在意志。“心志”比单纯的“思想”更能承载两者，同时不把它直接改写为哲学术语“理性”。
- source_word: ἐκτείνας
  choice: 伸展开来
  rationale: 保留动词的具体空间感，使以利亚撒的心志仿佛延展成峭壁，与全句的比喻相连。
- source_word: περιέκλασεν
  choice: 击碎了四周
  rationale: “击碎”表达海浪撞上岩壁而破散的结果，“四周”保留前缀 περι- 的环绕、周围之意。
- source_word: μαινομένους
  choice: 狂乱
  rationale: 表现失控、猛烈的状态，同时可修饰“情欲”，并与波涛意象相互加强。
- source_word: παθῶν
  choice: 情欲
  rationale: 本书中该词是重要的道德心理用语，指需要由心智约束的欲望、冲动和激情；“情欲”保留其负面失序色彩，但脚注说明其范围不限于狭义性欲。
- source_word: κλύδωνας
  choice: 汹涌波涛
  rationale: 该词指翻腾猛烈的浪涛；“汹涌波涛”在现代汉语中自然，并保留原文的强烈海象。
theological_decisions:
- issue: 《马加比四书》中人的心志与情欲之间的张力
  choice: 用“心志”与“情欲”保留道德心理层面的对照
  alternative: 将二者解释性地译为“理性”与“情绪”
  rationale: 原文在本节以比喻呈现这种张力，并未直接采用“理性统治情绪”的完整命题。当前译法既显出内在心志抵御失序冲动的关系，也避免把一切情绪本身说成邪恶。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父老”传达 πατήρ 对年长、受敬重者的称谓；整句尽量维持原文持续展开的海岸比喻，同时避免生硬的逐词对应。
