revisions:
- from: 因为父老以利亚撒把自己的心志伸展开来，像一道临海的峭壁[a]，击碎了四周狂乱情欲[b]的汹涌波涛。
  to: 因为父老以利亚撒将自己的心志伸展，如同一道陡峭的岬角[a]，击碎了环绕着他的狂暴情欲[b]的波涛。
  rationale: 修订取消原文未直接表达的“临海”，并调整汉语语序，使“狂暴”明确修饰“波涛”，同时保留心志如峭岩般伸展、波涛环绕其身而破碎的完整海岸比喻。
