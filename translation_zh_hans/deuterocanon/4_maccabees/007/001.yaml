  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: zh_hans
  text: 因为我们先祖以利亚撒的理性，正像一位出色的舵手，在情欲[b]的汪洋中掌着敬虔之舟[a]的舵，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔诚”，指对上帝的敬畏与忠诚，以及由此表现出的生活行为。
    reason: lexical_alternative
  - marker: b
    text: 这里的“情欲”泛指需要理性节制的欲望、冲动和强烈情绪，不仅指性欲；希腊词在本书中通常不是指外在的“苦难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: 因为……正像
  rationale: 既保留γὰρ承接上文的解释意味，也保留ὥσπερ引出的明喻；本句在希腊文中尚未完结，因此中文也保留延续感。
- source_word: ἄριστος κυβερνήτης
  choice: 一位出色的舵手
  rationale: κυβερνήτης指操舟掌舵者；“舵手”与后面的πηδαλιουχῶν相呼应。“出色”表达技能卓越，避免把ἄριστος不必要地绝对化为“最好的”。
- source_word: ὁ ... λογισμός
  choice: 理性
  rationale: λογισμός在《马加比四书》中是统御情欲的核心道德心理概念。“理性”在现代汉语中自然、简洁，也保留其哲学分量；语境显示它并非单指一次推理过程。
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: 我们先祖以利亚撒的
  rationale: πατήρ在这里是尊称性的亲属语言。“先祖”能表达群体对以利亚撒的敬称，又避免现代读者误解为叙述者的生身父亲。
- source_word: πηδαλιουχῶν
  choice: 在……掌舵，驾驭着
  rationale: 该现在分词描绘持续的掌舵行动。中文以“掌舵，驾驭着”展开意象，使舵手、海洋和船三者的关系清楚自然。
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: 敬虔之舟
  rationale: εὐσέβεια指向对上帝的敬畏与忠诚，并落实于行为。“敬虔”比单纯的“虔诚”更能兼顾宗教与伦理内涵；“之舟”保留原文隐喻。
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: 在情欲的汪洋上
  rationale: πέλαγος是辽阔或深广的海；“汪洋”保留其宏阔而危险的意象。πάθη在本书的论述中主要指需要由理性节制的欲望、冲动和情绪，故译“情欲”，不译作外在的“苦难”。
theological_decisions:
- issue: λογισμός的道德心理含义
  choice: 理性
  alternative: 理智；理性判断；推理
  rationale: 本书强调受律法与敬虔引导的理性对情欲的治理。“理性”保留这一核心张力，同时不把它限定为某一次判断，也不引入后世宗派性的教义解释。
- issue: εὐσέβεια的宗教伦理含义
  choice: 敬虔
  alternative: 虔诚；敬神
  rationale: “敬虔”既包含对上帝的敬畏与忠诚，也可涵盖由此产生的生活实践，较好对应原词的广度。
- issue: πάθη所指的是情欲还是苦难
  choice: 情欲
  alternative: 激情；情感；苦难
  rationale: 本书以理性治理πάθη为中心主题，此处海上掌舵的比喻也指内在冲动的威胁；但“情欲”并非仅指性欲，故以脚注说明其范围。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。以“舵手—掌舵—汪洋—舟”维持原文完整的航海隐喻；以句末逗号保留希腊文本身尚未完结、继续引向下文的句法性质。两个脚注标记均置于正文中，并分别说明εὐσέβεια与πάθη的语义范围。
