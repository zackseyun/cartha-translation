  to: 从没有一座遭围困的城，能抵挡如此众多而各式各样的攻城器械，如同那位至圣的人一样：他的神圣心灵虽在酷刑和拷问[a]中如遭焚烧，却凭着那捍卫敬虔的理性[b]，撼动了围攻他的人。
