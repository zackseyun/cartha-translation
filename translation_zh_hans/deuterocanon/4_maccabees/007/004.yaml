base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: zh_hans
  text: 从没有一座遭围困的城，能抵挡如此众多而各式各样的攻城器械，如同那位至圣的人一样：他的神圣心灵虽在酷刑和拷问[a]中如遭焚烧，却凭着那捍卫敬虔的理性[b]，撼动了围攻他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拷问”所译的希腊词也可能特指拷架、扭绞或拉伸一类的刑罚；其确切所指难以确定。
    reason: lexical_alternative
  - marker: b
    text: “凭着”也可译作“因为”。原文强调，那捍卫敬虔的“理性”是他抵抗酷刑并使围攻者震动的力量或原因。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: πόλις
  choice: 城
  rationale: 配合“被围困”和“攻城器械”的军事比喻；“城”在现代汉语中自然且简洁。
- source_word: μηχανήμασιν
  choice: 攻城器械
  rationale: 上下文两次使用围城语汇，故明确译出其军事用途，而非泛称“器械”。
- source_word: ἀντέσχεν
  choice: 抵挡
  rationale: 表达城池在围攻中坚持抗御的意思，并与后文人物承受酷刑相呼应。
- source_word: πανάγιος
  choice: 至圣者
  rationale: 保留该词强烈的崇高、极圣意味，同时以庄重而简练的现代汉语表达。
- source_word: ἱερὰν ψυχὴν
  choice: 神圣心灵
  rationale: ψυχή在此属于作者的道德—心理论述；“心灵”比“生命”更贴合语境，又保留ἱεράν的神圣色彩。
- source_word: αἰκισμοῖς
  choice: 虐待
  rationale: 指残酷的凌辱和折磨；“虐待”不将其局限为某一种刑罚。
- source_word: στρέβλαις
  choice: 拷刑器具
  rationale: 该词可能指拷架或扭绞类刑具，确切器械难定；正文采用概括译法，避免无根据地锁定为某一种装置。
- source_word: πυρπολούμενος
  choice: 被……焚烧
  rationale: 保留原文强烈的火烧意象；这里可为比喻性地描写酷刑对其神圣心灵的猛烈摧残。
- source_word: ἐκίνησεν
  choice: 撼动
  rationale: 原词可指使之震动、扰乱或激动；“撼动”保留其力度，同时不具体断定围攻者的心理反应。
- source_word: τοὺς πολιορκοῦντας
  choice: 围攻他的人
  rationale: 延续全句的围城比喻，将施刑者描写为围攻这位殉道者的人。
- source_word: λογισμόν
  choice: 理性
  rationale: 这是《马加比四书》的核心词，指统御情欲并指导行动的理性能力；“理性”可保持主题用语的一致。
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: 捍卫敬虔的
  rationale: ὑπερασπίζω带有积极保护、捍卫之意；“敬虔”兼顾对神的敬畏和由此表现出的忠诚行为。
theological_decisions:
- issue: εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔敬；虔诚
  rationale: 该词既涉及对神的敬畏，也涉及忠于神的生活实践。“敬虔”保留其宗教和伦理分量，而不限定于某一宗派用语。
- issue: λογισμός在《马加比四书》中的译法
  choice: 理性
  alternative: 理智；理性的决意
  rationale: 本书围绕理性对情欲的统治展开论证。“理性”能保持这一主题词的哲学与伦理张力，不把它缩减为单纯的意志或决心。
- issue: διὰ τὸν ὑπερασπίζοντα τῆς εὐσεβείας λογισμόν的关系
  choice: 凭着捍卫敬虔的理性
  alternative: 因为那捍卫敬虔的理性
  rationale: διά加宾格在此可表达手段或原因。正文用“凭着”突出理性是其抵抗酷刑的力量，同时脚注保留原因性理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留贯穿全句的围城比喻，以及“心灵被焚烧”的强烈修辞；用分号和转折使希腊文较长、结构紧密的比较句在中文中清楚可读。所有脚注标记均置于相关词语之后。
