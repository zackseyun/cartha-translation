  yaml_path: translation/deuterocanon/4_maccabees/007/013.yaml
  text: And yet[a], most astonishingly, though he was an old man, with the pains of his body already loosened, and his flesh relaxed, and even his sinews worn out, he renewed his youth.
translation:
  language: zh_hans
  text: 然而，最令人惊叹的是：他虽已年老，体力已经衰退，肌肉也已松弛，筋腱也已疲惫，却恢复了青春的活力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“重新年轻起来”。希腊语动词强调青春活力的恢复。
    reason: 保留 ἀνενέασεν 可理解为“重新年轻”的较直译表达。
lexical_decisions:
- source_word: καίτοι
  choice: 然而
  rationale: 承接上文并形成强调性的转折，简洁保留希腊语的让步语气。
- source_word: τὸ θαυμασιώτατον
  choice: 最令人惊叹的是
  rationale: 将带冠词的最高级表达译为引出全句高潮的独立结构，既自然又保留修辞力度。
- source_word: γέρων ὤν
  choice: 他虽已年老
  rationale: 分词在语境中具有让步意味；“虽已年老”明确而不过度解释。
- source_word: λελυμένων ἤδη τῶν τοῦ σώματος πόνων
  choice: 身体的力量已经衰退
  rationale: πόνοι 在此与松弛的肌肉和疲惫的筋腱并列，更可能指身体的劳作能力、劲力，而非所受的疼痛；λύω 的完成时态描写年老造成的衰解。
- source_word: περικεχαλασμένων δὲ τῶν σαρκῶν
  choice: 肌肉也已松弛
  rationale: 复数 σάρκες 在衰老的身体描写中可具体指肌肉或肉体组织；现代汉语“肌肉松弛”比“肉体松弛”清楚自然。
- source_word: κεκμηκότων δὲ καὶ τῶν νεύρων
  choice: 筋腱也已疲惫
  rationale: 古代身体语境中的 νεῦρα 指筋、腱，而非现代意义的神经；κάμνω 的完成形表示已经疲乏、衰弱。
- source_word: ἀνενέασεν
  choice: 却又焕发出青春的活力
  rationale: 该动词意为重新年轻、恢复青春；此译突出在酷刑面前重新显出的年轻力量，并符合汉语修辞。
theological_decisions:
- issue: σάρκες 在非保罗书信、身体受刑与衰老语境中的含义
  choice: 肌肉
  alternative: 肉体
  rationale: 此处纯属生理描写，不涉及“肉体”作为罪性或神学范畴；复数形式与“松弛”搭配，译作“肌肉”更符合现代汉语。
- issue: ἀνενέασεν 是否表示身体实际返老还童
  choice: 焕发出青春的活力
  alternative: 重新年轻起来
  rationale: 上下文强调殉道者在衰老和受刑中显出的勇力；译文避免断言发生了生理上的返老还童，同时脚注保留更贴近字面的可能表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句首用冒号引出层层铺陈的身体衰老状态，末尾以“却又”突出反差和高潮；避免把古代身体词汇误译为现代医学意义上的“神经”。
