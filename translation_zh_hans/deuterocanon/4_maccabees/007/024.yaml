  text: For this reason indeed[a], even young men, by philosophizing according to the reasoning of piety[b], overcame more severe tortures.
translation:
  language: zh_hans
  text: 正因如此，连少年人也凭着敬虔的理性[a]实践哲学[b]，战胜了更严酷的酷刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔的理性”也可译作“敬虔所产生的理性”或“以敬虔为准则的理性”。这一希腊语短语是本书的核心用语，把理性思量与对上帝的敬畏相联系。
    reason: lexical_alternative
  - marker: b
    text: “实践哲学”也可译作“作哲学思考”或“按哲学原则生活”。原文可兼指哲学思考和依照哲学原则而活。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό γε τοι
  choice: 正因如此
  rationale: διὰ τοῦτό表因果或推论；γε τοι加强语气。“正因如此”以自然汉语同时表达因果关系和强调语气。
- source_word: μειρακίσκοι
  choice: 少年人
  rationale: 指年少的男性，通常处于少年或青年早期；“少年人”既保留年龄与男性所指，也符合本段殉道者语境。
- source_word: τῷ τῆς εὐσεβείας λογισμῷ
  choice: 凭着敬虔的理性
  rationale: λόγισμός在本书中是核心词，表示理性思量或判断；εὐσέβεια指向对上帝的敬畏与虔诚。“敬虔的理性”保留两者的紧密关系，而不把该结构限定为唯一的语法解释。
- source_word: φιλοσοφοῦντες
  choice: 践行哲学
  rationale: 该分词不只可指进行哲学思考，也可指按哲学原则生活。“践行哲学”保留作者明确的哲学用语，并涵盖思想与实践两面。
- source_word: χαλεπωτέρων βασανιστηρίων
  choice: 更严酷的刑罚
  rationale: χαλεπωτέρων为比较级，表示比前述刑罚更加严酷；βασανιστήρια在语境中指折磨人的刑罚，也可能侧重酷刑或刑具。正文采用自然且范围较宽的“刑罚”。
- source_word: ἐπεκράτησαν
  choice: 战胜了
  rationale: 该动词与属格搭配，表达胜过、压倒或制伏；“战胜了”准确传达少年人没有被严刑压倒的道德胜利。
theological_decisions:
- issue: 如何表达本书将理性与敬虔相连的纲领性措辞
  choice: 敬虔的理性
  alternative: 敬虔所产生的理性；以敬虔为准则的理性
  rationale: 原文属格结构可表示性质、来源或支配关系。“敬虔的理性”保留其简洁性与张力，不擅自断定理性与敬虔之间唯一的逻辑关系。
- issue: φιλοσοφοῦντες是偏重思想活动还是生活实践
  choice: 践行哲学
  alternative: 作哲学思考；按哲理生活
  rationale: 本书所说的“哲学”既涉及理性思考，也落实为在苦难中的行为。“践行哲学”避免只取其中一面，并保留原文的哲学词汇。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“正因如此”承载原文加强语气；“连……也”体现καί在此处的递进意义。正文保留“理性”和“哲学”这两个贯穿《马加比四书》的关键词，同时以脚注说明其语义幅度。
