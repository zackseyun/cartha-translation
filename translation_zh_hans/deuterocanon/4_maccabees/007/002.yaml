lexical_decisions:
- source_word: κατακλυζόμενος
  choice: 如洪水般淹没
  rationale: 该分词本有洪水漫淹、淹没之意；明示洪水意象，可与后半句的海上风浪意象连贯，同时符合现代汉语表达。
- source_word: ἀπειλαῖς
  choice: 威吓
  rationale: 指暴君以言语和权势发出的威胁；“威吓”既自然，也凸显其胁迫作用。
- source_word: καταντλούμενος
  choice: 冲击
  rationale: 此罕见分词在这里延续水灾与风暴意象，描写人遭浪涛猛烈侵袭；结合“惊涛骇浪”译作“冲击”，避免按汲水、舀水的字面意义造成晦涩。
- source_word: βασάνων
  choice: 酷刑
  rationale: 殉道受难语境表明这是人为施加的剧烈折磨；“酷刑”准确传达强度和刑罚性质。
- source_word: τρικυμίαις
  choice: 惊涛骇浪
  rationale: 该词指海上的狂澜或猛烈风浪；这一成语在现代汉语中清楚有力，并保留原文持续的风暴意象。
- source_word: τοῦ τυράννου
  choice: 暴君的
  rationale: 属格自然译为领属结构；“暴君”保留原文对统治者的明确道德定性。
