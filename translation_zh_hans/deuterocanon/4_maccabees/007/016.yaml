base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/016.yaml
  text: If[a], then, an old man despised tortures even to the point of death because of piety, then surely pious reason is ruler over the passions.
translation:
  language: zh_hans
  text: 那么，如果一位老人因着敬虔[a]，连至死的酷刑也不屑一顾，就无可否认，敬虔的理性是各种情欲的主宰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了敬虔”。这里的希腊语既可表示原因，也可带有目的意味。
    reason: 保留 διʼ εὐσέβειαν 的因果义与目的义之间的真实歧义。
lexical_decisions:
- source_word: γέρων
  choice: 一位老人
  rationale: 指年老的男性；“一位老人”自然、明确，并保留单数指称。
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: 直至死亡的酷刑
  rationale: βάσανοι 指严酷的肉体折磨，μέχρι θανάτου 表明其程度延伸至死亡；此译保留原文简洁而强烈的表达。
- source_word: περιεφρόνησεν
  choice: 不屑一顾
  rationale: 该动词表示轻视、蔑视或视为不足介意；“不屑一顾”传达老人并未被酷刑支配的修辞力度。
- source_word: διʼ εὐσέβειαν
  choice: 因着敬虔
  rationale: εὐσέβεια 在本书中主要指对上帝虔敬、敬畏的态度；διά 加宾格在此可表原因，“因着”保留庄重而自然的因果表达。目的义作为真实可能性收入脚注。
- source_word: ὁμολογουμένως
  choice: 无可否认
  rationale: 该副词表示公认、无可争辩地；这里引出由前件所得的明确结论。
- source_word: ἡγεμὼν
  choice: 主宰
  rationale: 在哲学论证中表示拥有统治和支配权；“主宰”能自然表达理性对内在冲动的管辖，而不引入政治官职含义。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη 在本书论证中指受欲望、恐惧、痛苦等驱动的激情或情感冲动。“情欲”保留其哲学上的受动性和需受治理之意；加“各种”表明复数及其涵盖范围，并非仅指性欲。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬虔的理性
  rationale: 本书的核心术语，指由对上帝的敬虔所塑造和引导的理性判断；此译保留形容词与名词的结构，也避免加入后期教义术语。
theological_decisions:
- issue: 核心哲学—神学短语 ὁ εὐσεβὴς λογισμός 的译法
  choice: 敬虔的理性
  alternative: 由敬虔塑造的理性；属神的理性
  rationale: 原文同时强调理性能力与敬虔取向。“敬虔的理性”保留两者之间简洁而未被过度解释的关系，不把它化约为一般理智，也不引入特定宗派范畴。
- issue: διʼ εὐσέβειαν 的语义功能
  choice: 因着敬虔
  alternative: 为了敬虔
  rationale: 上下文首先支持原因义：老人之所以轻看酷刑，是出于对上帝的敬虔；但希腊语也可带目的意味，因此将另一可能译法保留在脚注中。
- issue: 条件句 εἰ 的论证力度
  choice: 如果……就……
  alternative: 既然……那么……
  rationale: 原文使用 εἰ，形式上是条件句，虽在修辞中近于以事实为前提的推论。正文保留“如果”，避免把这种论证形式直接改写成确定原因句。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不屑一顾”保留原文的强烈修辞色彩；“主宰”适合哲学语境中的支配关系。正文保留条件句结构，并使推论关系清晰。
