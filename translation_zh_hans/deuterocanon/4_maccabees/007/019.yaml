  yaml_path: translation/deuterocanon/4_maccabees/007/019.yaml
  text: those who believe that they do not die to God[a], but live to God, just as our patriarchs Abraham, Isaac, and Jacob.
translation:
  language: zh_hans
  text: 那些相信自己在上帝面前并不死去、而是活着的人，正如我们的族长亚伯拉罕、以撒和雅各一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“不死去”和“活着”后都用“上帝”的与格；“在上帝面前”也可译作“对上帝而言”或“在上帝看来”。此与格可表示与上帝的关系或以他为参照。
    reason: 说明θεῷ／τῷ θεῷ在两个谓语后的重复，并保留其关系性与格的可能译法。
lexical_decisions:
- source_word: οἱ πιστεύοντες
  choice: 那些相信的人
  rationale: 现在时分词作名词用，表示持续相信的人；采用动词性表达，比标签式的“信徒”更贴近原文。
- source_word: ὅτι
  choice: 知道：
  rationale: 在“相信”之后引出其所信的内容。汉语以冒号自然连接内容从句；“知道”在此表达确信，不另行增添命题内容。
- source_word: θεῷ / τῷ θεῷ
  choice: 对上帝而言
  rationale: 两个与格表达与上帝的关系或在上帝那里的实况；同一表达涵盖“不死去”与“活着”，并避免把与格单纯理解为方向或目的。
- source_word: οὐκ ἀποθνήσκουσιν
  choice: 并不死去
  rationale: 保留ἀποθνῄσκω的直接意义及现在时陈述，不弱化为“不会灭亡”。
- source_word: ὥσπερ γὰρ
  choice: 正如……一样
  rationale: 明确引出与先祖的比较；γάρ在这一片段中的衔接作用受上下文及句法影响，汉语不机械加入“因为”，以免形成不完整因果句。
- source_word: οἱ πατριάρχαι ἡμῶν
  choice: 我们的先祖
  rationale: 在现代汉语中“先祖”自然、庄重，并能指向亚伯拉罕、以撒、雅各这些族长；比生硬的“诸族长”更易懂。
- source_word: ἀλλὰ ζῶσιν
  choice: 而是活着
  rationale: 保留ἀλλά所标示的“不死—活着”鲜明对照。
theological_decisions:
- issue: θεῷ / τῷ θεῷ与死亡、生命的关系
  choice: 译作“对上帝而言”，表示这些人在与上帝的关系中并非死者，而是活着。
  alternative: 可译作“在上帝面前”或“在上帝看来”；也可较字面地译作“向着上帝”。
  rationale: 希腊语与格可以表达关系或参照范围。“对上帝而言”保留这种关系性的张力，不把经文进一步解释为灵魂不死、复活时间或其他特定教义。
- issue: 比较语所指
  choice: 把亚伯拉罕、以撒和雅各作为“不死去而活着”的类比对象。
  alternative: 按希腊语表面次序，可让后半句直接陈述先祖“活于上帝”；但会使本节作为独立汉语句子较为突兀。
  rationale: 此处理与句中ὥσπερ的比较功能及“不死—活着”的对照相符，同时承认原文词序和标点存在句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先祖”符合亚伯拉罕、以撒、雅各的历史身份；“并不死去，而是活着”保留原文简洁有力的对照。脚注标记已置于正文相关短语之后。
