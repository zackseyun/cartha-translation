  text: if[a], then, reason is evidently able to prevail over the passions that hinder self-control, both gluttony and desire,
translation:
  language: zh_hans
  text: 那么，如果[a]理性显然胜过妨碍自制的情欲，即贪食和欲望，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，如果理性显得胜过妨碍自制之人的情欲。”希腊语中与“自制”有关的短语结构凝缩，其与“妨碍性的情欲”的关系可作较形式化的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ ἄρα
  choice: 那么，如果
  rationale: εἰ引出条件，ἄρα带有承接、推论语气；“那么，如果”在现代汉语中兼顾两者，也保留本句尚未完结的条件结构。
- source_word: τῶν σωφρονούντων
  choice: 妨碍人自制的
  rationale: 原文属格短语高度凝缩，与κωλυτικῶν παθῶν的关系不够明确。正文按上下文作功能性表达，使之指向受到情欲妨碍的自制，同时以脚注保留较形式化的另一种理解。
- source_word: κωλυτικῶν παθῶν
  choice: 那些妨碍……的情欲
  rationale: κωλυτικός意为阻碍、妨碍；πάθη在本论证中指驱使人的情感或冲动。“情欲”既有情感冲动之义，也能自然引出下文的贪食与欲望。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: λογισμός是本书重要的哲学用语，指进行判断和约束冲动的理性；“理性”简洁、自然，又不额外引入后世的技术体系。
- source_word: φαίνεται ἐπικρατεῖν
  choice: 显明能够胜过
  rationale: φαίνεται可指“显得”或“显明”，ἐπικρατεῖν指占上风、制胜。此处处在论证语境中，“显明能够胜过”比单纯的“似乎胜过”更能体现作者要加以证明的主张，同时没有把它说成未经论证的绝对断言。
- source_word: γαστριμαργίας
  choice: 贪食
  rationale: 该词指对食物的过度欲求。“贪食”准确、简明，也适合庄重而通俗的汉语。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: ἐπιθυμία含义宽泛，可指欲求、渴望或贪欲；此处尚未限定为性欲，因此采用中性的“欲望”。
theological_decisions:
- issue: λογισμός在《马加比四书》中的哲学—人论含义
  choice: 理性
  alternative: 理性判断；理性官能
  rationale: 本节讨论理性对于情欲的支配能力。“理性”保留其哲学分量，又避免套入后来的宗派性人论术语。
- issue: τῶν σωφρονούντων在凝缩结构中的含义
  choice: 按功能理解为情欲妨碍人的自制
  alternative: 较形式化地理解为“妨碍自制之人的情欲”或“属于自制之人的阻碍性情欲”
  rationale: 原文语法关系确有张力。正文采用上下文中较清楚的理解，但脚注明示另一种贴近字面的读法，不把真实歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“那么，如果”承接前文并保留条件句性质；末尾保留逗号，因为原文在此仍属未完的论证结构。“情欲”在这里泛指影响行为的冲动，并非专指性欲。
