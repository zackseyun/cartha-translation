  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: zh_hans
  text: 因为理性是诸种美德的引导者，也是各种情欲的主宰。因此，我要先借着节制所作的克制之举，证明理性能够自主地驾驭各种情欲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμός
  choice: 理性
  rationale: 此处指具有判断、引导和辖制能力的理性思考；“理性”在现代汉语中自然，并能贯穿本节论证。
- source_word: ἀρετῶν
  choice: 诸种美德
  rationale: 保留希腊文复数，所指是不同类别的德行。
- source_word: ἡγεμών
  choice: 引导者
  rationale: 表达带领、指导之义，同时避免过度强化为政治或军事意义上的“统治者”。
- source_word: παθῶν
  choice: 各种情欲
  rationale: πάθη 指作用于人的欲望、冲动和情感力量；“情欲”符合本书伦理语境，复数意味以“各种”体现。
- source_word: αὐτοκράτωρ
  choice: 主宰
  rationale: 强调理性对情欲拥有支配权，与后文较具反身意味的 αὐτοδέσποτος 区分。
- source_word: κωλυτικῶν τῆς σωφροσύνης ἔργων
  choice: 那些妨碍节制的行为
  rationale: 按属格关系直译为妨碍节制的行为，即与节制相冲突、构成阻碍的行为；不依英语 consultation layer 的“节制所施行的抑制行为”，因为该读法弱化了希腊语 τῆς σωφροσύνης 作为 κωλυτικῶν 补语的自然理解。
- source_word: αὐτοδέσποτος
  choice: 能够自主辖制
  rationale: 兼顾 αὐτο- 的自主、自为色彩和 δεσπότης 的掌管、支配含义；在现代汉语中比生硬的“自为主宰”更清楚。
theological_decisions:
- issue: 理性对情欲之权能的表述
  choice: 能够自主辖制各种情欲
  alternative: 在各种情欲之上拥有绝对主权
  rationale: 原文强调理性的自主持守和支配能力，但不必引入神学语境中常与上帝绝对主权相连的措辞；“能够”也自然表达本书将要以事例证明的能力主张。
- issue: κωλυτικῶν τῆς σωφροσύνης 的句法方向
  choice: 妨碍节制的
  alternative: 节制所施行的抑制性
  rationale: 保留希腊文的真实句法张力，并采用较自然的补语理解；此选择使作者将从违背或阻碍节制的行为入手，论证理性仍能辖制情欲。
translation_notes:
  register: 采用现代、庄重而清楚的论说文体。“因为……因此……”保留原文 γάρ 与 τοίνυν 的推论结构；两次“理性”和“各种情欲”有意重复，以维持原文论证的严密性。
