base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: zh_hans
  text: 那么，也许有人会问：“理性既能管束情欲，为什么不能支配遗忘和无知呢？”他们企图这样说，实在可笑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“企图这样说是可笑的。”希腊文既可理解为在说提出异议的人可笑，也可作非人称表达。
    reason: 保留γελοῖον ἐπιχειροῦντες λέγειν的句法歧义。
lexical_decisions:
- source_word: πῶς οὖν
  choice: 那么……为什么……呢
  rationale: 承接上文并引出反问；按现代汉语语序将疑问成分放入引语中，保留论证推进的语气。
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: 也许有人会问
  rationale: ἴσως与带ἄν的祈愿式表示可能提出的异议；上下文是反问，以“会问”自然呈现其功能。
- source_word: τῶν παθῶν
  choice: 情欲
  rationale: 本书以πάθη指理性所管束的情感、欲望与冲动；“情欲”保留其哲学伦理色彩，但不将其缩限为外在苦难。
- source_word: ὁ λογισμὸς
  choice: 理性
  rationale: 这里指进行判断和思量、并能管束情欲的理性能力，是全书论证的核心术语。
- source_word: κρατεῖ
  choice: 管束
  rationale: 表达理性对情欲具有控制力，同时与后面的δεσπόζει“支配”有所区别。
- source_word: λήθης καὶ ἀγνοίας
  choice: 遗忘和无知
  rationale: 直接保留两个抽象名词，指人的认知缺陷，不扩译为疾病或道德罪责。
- source_word: οὐ δεσπόζει
  choice: 不能支配
  rationale: δεσπόζω含有作主、掌控之意；在汉语反问中用“为什么不能支配”自然表达希腊文的否定疑问。
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: 他们企图这样说，实在可笑
  rationale: 将分词与前面的无名异议者相连，保留原文的讽刺语气；句法也可作非人称理解，故以脚注注明。
theological_decisions:
- issue: 《马加比四书》的人论与哲学术语
  choice: 将λογισμός译作“理性”，πάθη译作“情欲”
  alternative: 将λογισμός译作“理智”或“理性判断”，将πάθη译作“情感”或“冲动”
  rationale: 这组译词保留全书关于理性管束情欲的哲学伦理框架，又不引入后世宗派性的人论体系。
- issue: γελοῖον与分词结构所指向的对象
  choice: 将“可笑”用于提出异议的人：“他们企图这样说，实在可笑”
  alternative: 作非人称表达：“企图这样说是可笑的”
  rationale: 希腊文容许两种句法理解；正文采用与隐含说话者相连的自然读法，脚注保留非人称读法。
translation_notes:
  register: 采用现代、庄重而清楚的议论语体；以引号呈现假想异议，使长句在普通话中易于理解。正文保留“理性—情欲”的哲学对举，并用“管束—支配”体现两个希腊动词的力度差异。
