base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: zh_hans
  text: 所以，我们虽然想吃水中生物[a]、飞鸟和四足动物，却因理性的统御[b]而不吃律法禁止我们吃的各样食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水中生物”也可译作“水生动物”。
    reason: lexical_alternative
  - marker: b
    text: “理性的统御”也可译作“理性的支配力”。这里的“理性”指受律法塑造、能够管束身体欲望的理性判断。
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: τοιγαροῦν
  choice: 所以
  rationale: 表示由上文论证得出的结论；“所以”自然、清楚地保留了推论语气。
- source_word: ἐνύδρων
  choice: 水中生物
  rationale: 泛指生活在水中的动物，不限于鱼类，也不过度具体化。
- source_word: ἐπιθυμοῦντες
  choice: 虽然想吃
  rationale: 分词在此与主句“禁戒不吃”构成让步关系；饮食语境中“想吃”比泛泛的“渴望”更自然。
- source_word: ὀρνέων
  choice: 飞鸟
  rationale: 准确表达鸟类，也与水中生物、四足动物的分类并列相称。
- source_word: τετραπόδων
  choice: 四足动物
  rationale: 保留希腊词“四足”的具体意象，同时符合现代汉语表达。
- source_word: παντοίων βρωμάτων
  choice: 各样食物
  rationale: 保留范围广泛、种类繁多之意；结合前列动物类别理解为可食之物。
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: 律法禁止我们吃的
  rationale: 明确表达这些食物依照律法对“我们”属于禁食之物；补出“吃”使汉语完整自然。
- source_word: ἀπέχομεθα
  choice: 禁戒不吃
  rationale: 表达主动克制并远离这些食物，符合伦理与饮食语境。
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: 因理性的统御
  rationale: “统御”保留ἐπικράτεια所指的支配、占上风之力，并呼应全书关于理性管束欲望的核心论旨。
theological_decisions:
- issue: λόγισμος在《马加比四书》哲学—神学论证中的含义
  choice: 理性
  alternative: 理性判断
  rationale: “理性”简洁地保留全书的关键词一致性；此处所指并非抽象智力，而是受律法塑造、能够管束欲望的理性判断，因此以脚注说明其语境内涵。
- issue: 理性与欲望的关系
  choice: 保留“理性的统御”这一支配关系
  alternative: 因自制而不吃
  rationale: 原文将ἐπικράτεια明确归于λόγισμος；译成一般的“自制”会淡化作者关于理性统御欲望的主张。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“虽然……却……”显明分词与主句之间的让步关系；“就是”承接前列类别与“各样食物”的同位说明。脚注标记均置于所注词语之后。
