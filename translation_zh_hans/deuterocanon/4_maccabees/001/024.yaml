  text: Anger is a passion shared by pleasure and pain, if one reflects on the occasion when it came upon him.
translation:
  language: zh_hans
  text: 愤怒是快乐和痛苦所共有的一种情感；人若想一想愤怒何时临到自己，就会明白这一点。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: 愤怒
  rationale: 在本节对各种情感的论述中，该词指怒气或愤怒；“愤怒”准确而符合现代书面汉语。
- source_word: κοινὸν πάθος
  choice: 共有的情感
  rationale: 保留“为……所共有”的结构；πάθος在这里指人所经历、受其影响的情感状态，译作“情感”比“激情”自然，也避免现代汉语中“激情”的偏义。
- source_word: ἡδονῆς καὶ πόνου
  choice: 快乐与痛苦
  rationale: 对应两种相反的感受领域，不把它们具体化为某种伦理或神学范畴。
- source_word: ἐὰν ἐννοηθῇ τις
  choice: 人若想一想……就会明白这一点
  rationale: 希腊语表达略为压缩，意为经由反思而认识上述判断；汉语补出结果，使逻辑自然，但不增加实质内容。
- source_word: ὅτε αὐτῷ περιέπεσεν
  choice: 它是在什么时候临到自己的
  rationale: περιπίπτω表示遭遇、落入或被某事临到；保留事件发生的“时候/情境”含义及第三人称泛指。
theological_decisions:
- issue: 愤怒与快乐、痛苦之间关系的表述
  choice: 译作“快乐与痛苦共有的情感”
  alternative: “快乐和痛苦都会伴有愤怒”或“愤怒兼有快乐和痛苦”
  rationale: 原文κοινόν表示“共同的、共有的”，但具体关系略显概括；所选译法保留这种张力，不将其解释为伴随关系或组成关系。
translation_notes:
  register: 采用现代、庄重而易懂的论述体。分号呈现原文先下判断、再提出反思条件的结构；为使汉语完整自然，在后半句补出“就会明白这一点”，其指向仅限于前述判断。
