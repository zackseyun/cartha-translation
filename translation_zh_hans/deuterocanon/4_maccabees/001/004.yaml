  yaml_path: translation/deuterocanon/4_maccabees/001/004.yaml
  text: but it also is shown to rule over the passions that hinder righteousness[a], such as malice, and over the passions that hinder courage—anger, pain, and fear.
translation:
  language: zh_hans
  text: 而且，理性也显示出能支配那些妨碍正义[a]的情欲，例如恶意；又能支配那些妨碍勇气的情欲，就是愤怒、痛苦和恐惧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”或译“公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύειν
  choice: 支配
  rationale: 表达对情欲施行控制和统御，既保留原文力度，也符合现代汉语哲学论述。
- source_word: ἀναφαίνεται
  choice: 显明能够
  rationale: 该词表示某事显现出来或得到证明；结合不定式 κυριεύειν，译为“显明能够支配”，使汉语句法自然，并保留论证语气。
- source_word: ἐμποδιστικῶν
  choice: 妨碍……的
  rationale: 用关系结构表达“造成阻碍的”，比直译为“阻碍性的”更自然。
- source_word: παθῶν
  choice: 情欲
  rationale: 此处是希腊伦理学语境中的 πάθη，指会影响德性的情感冲动；“情欲”保留其道德心理学含义，不限于肉欲。
- source_word: δικαιοσύνης
  choice: 正义
  rationale: 在四枢德式的哲学德目语境中，δικαιοσύνη主要指正义这一德性；“公义”作为圣经传统中的可能译法以脚注保留。
- source_word: κακοηθείας
  choice: 恶意
  rationale: 该词可指恶劣品性或害人之意；在列举妨碍正义的情欲时，“恶意”简洁贴切。
- source_word: ἀνδρείας
  choice: 勇气
  rationale: 在希腊化伦理学中指勇敢这一德性；“勇气”是现代汉语中清楚且无不必要性别色彩的表达。
- source_word: θυμοῦ
  choice: 愤怒
  rationale: 此处列为妨碍勇气的情欲，采用负面意义“愤怒”，而非中性的“血气”或“意气”。
- source_word: πόνου
  choice: 痛苦
  rationale: 在与愤怒、恐惧并列且妨碍勇气的语境中，主要指人所感受的痛苦；不取“劳苦”。
- source_word: φόβου
  choice: 恐惧
  rationale: 直接表达 φόβος 的基本意义，且与勇气形成清楚对照。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 正义
  alternative: 公义
  rationale: 本节处于希腊伦理学的德性分类中，并与勇气并列，因此“正义”最贴合语境；但该词也可表达较广的“公义”，故以脚注保留，不把两者的张力悄然消解。
- issue: 句中未明说的主语
  choice: 补出“理性”
  alternative: 采用承接上文的零主语：“而且，也显明能够……”
  rationale: 原句主语由上文承接，孤立成节时汉语若完全省略会显得残缺；补出本段论证的核心主语“理性”，以便本节独立可读，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两组“妨碍某德性的情欲”的平行结构；用分号区分两组，再以“就是”引出后三项列举。
