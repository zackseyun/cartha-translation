  rationale: 修订使首分句的被动关系和现代汉语表达更清晰，并以“心智”准确对应νοῦς。第二分句保留通顺的正文译法，同时在脚注中如实保存φιλοτιμοῦνται所含的追求荣誉之义，避免把该词解释性地改写为“高尚目标”。
