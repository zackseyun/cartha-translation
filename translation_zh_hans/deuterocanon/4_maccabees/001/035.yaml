base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: zh_hans
  text: 因为各种欲望所生的情欲，受到有节制的心智抵制，被折回；身体的一切冲动也都由理性引导[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“身体的一切冲动也都在理性的激励下热切追求荣誉。”这里的希腊语动词较为少见，通常含有热切追求或看重荣誉的意思。
    reason: 保留φιλοτιμοῦνται在此以身体冲动为主语时的特殊搭配及其“荣誉／热切追求”的词义色彩。
lexical_decisions:
- source_word: ἀντέχεται
  choice: 受到……抵制
  rationale: 该动词有抵抗、挡住之意；这里表达情欲被约束，而不是被消灭。
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: 欲望所引发的情欲
  rationale: πάθη在本书的伦理语境中指支配人的情欲或激情；属格结构译为“所引发的”，比生硬的“欲望的情欲”更符合现代汉语，同时保留两层心理概念。
- source_word: τοῦ σώφρονος νοὸς
  choice: 节制之心
  rationale: σώφρων兼有自制、审慎、心智健全之意；“节制之心”简洁地保留其道德与心智内涵。
- source_word: ἀνακαμπτόμενα
  choice: 被扭转回去
  rationale: 保留该分词“转回、折返”的形象，表明情欲的趋向受到逆转。
- source_word: φιλοτιμοῦνται
  choice: 受……引导
  rationale: 该动词通常表示爱荣誉、热切追求，在此以身体的冲动为主语并由理性施动，用法异乎寻常；正文采用合乎上下文且不过度具体化的“引导”，另以脚注保留其荣誉与热切追求的词义可能。
- source_word: κινήματα
  choice: 冲动
  rationale: 这里不是单指外在肢体动作，而是身体内在的发动或趋向；“冲动”符合本段道德心理学语境。
- source_word: λογισμοῦ
  choice: 理性
  rationale: λογισμός是本书的核心概念，指理性思考或判断能力；“理性”简明而准确。
theological_decisions:
- issue: 理性与情欲的关系
  choice: 描述节制之心抵制情欲、理性引导身体冲动
  alternative: 把情欲明确称为罪性，或说理性将其完全消灭
  rationale: 原文属于希腊化犹太伦理思想的道德心理学表述，强调约束和转向，并未引入后世“罪性”等教义范畴。
- issue: φιλοτιμοῦνται的罕见表达
  choice: 正文译为“受理性引导”，脚注说明“趋向高尚目标”的可能
  alternative: 直译为“被理性激发去追求荣誉”
  rationale: 直译在现代汉语中容易暗示身体冲动本身追逐社会名誉；正文保持语境中的理性导向，同时借脚注保存原词真实的荣誉、热切追求色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“节制之心”“理性”保持全书哲学论述的语体；分号对应原文两个并列论断。脚注标记紧随其所说明的第二分句。
