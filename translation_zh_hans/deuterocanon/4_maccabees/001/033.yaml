base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: zh_hans
  text: 那么，我们受到驱使而趋向那些被禁止的食物时，为什么会转而避开从那些食物而来的享受呢？不正是因为理性能够胜过欲望[a]吗？我认为是的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲望”也可译作“食欲”；这里的希腊词在谈论食物的语境中，可以着重指身体的渴求。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: 那么……为什么
  rationale: 在承接上文的同时引出解释性的反问；现代汉语用“那么……为什么”可自然保留连接和疑问两层作用。
- source_word: κινούμενοι πρὸς
  choice: 受到驱使，想去吃
  rationale: 表达内在冲动把人推向某物；结合食物语境补出“吃”，使汉语自然，同时不把冲动具体化为外在强迫。
- source_word: τὰς ἀπειρημένας τροφάς
  choice: 那些被禁止的食物
  rationale: 准确表达已经受到禁令约束的食物，并保留定冠词所指的特定类别。
- source_word: ἀποτρεπόμεθα
  choice: 转离
  rationale: 保留动词“转身离开、避开”的形象，而不弱化为单纯的“不做”。
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: 由此而来的享受
  rationale: 明确享受源于那些食物；“享受”在饮食语境中自然，也保留ἡδονή的愉悦含义。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 本书语境中指能够支配情欲的推理或理性机能；“理性”简明而不引入后期教义范畴。
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: 制伏欲望
  rationale: “制伏”表达占上风、掌控的力度；“欲望”保留该词的一般范围，脚注说明本节饮食语境下也可理解为食欲。
- source_word: ἐγὼ μὲν οἶμαι
  choice: 我认为是的
  rationale: 保留说话者以第一人称作出的肯定判断及其较为克制的语气。
theological_decisions:
- issue: λογισμός所表达的哲学—人论含义
  choice: 理性
  alternative: 理性判断；理智
  rationale: 经文主张理性机能能够胜过欲望。“理性”既能呈现本书的核心论点，又不把它解释成某一特定神学体系中的术语。
- issue: ὀρέξεις在饮食语境中的范围
  choice: 正文作“欲望”，脚注提示“食欲”
  alternative: 正文直接作“食欲”
  rationale: 原词可泛指欲望，在此又明显涉及身体对食物的渴求；正文保留较宽含义，脚注呈现语境化的另一译法，避免过早缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。反问结构与末句第一人称判断均予保留；“受到驱使，想去吃”传达内在冲动，不暗示外在强迫。
