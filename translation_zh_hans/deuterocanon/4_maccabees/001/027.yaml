  text: and[a], in relation to the body, omnivorousness and gluttony and eating alone.
translation:
  language: zh_hans
  text: 至于身体方面，则有饮食不加选择、贪食和独自进食。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只吃一种食物”或“单一饮食”。希腊语μονοφαγία按构词可有此义；但在这份恶习清单中，“独自进食”也很贴合语境。
    reason: 词义存在真实歧义，需保留另一种可能解释。
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: 至于身体方面
  rationale: κατά加宾格在此标明所谈恶习所属的身体层面；此译自然地保留分类语气，δὲ则以“至于”体现话题转换。
- source_word: παντοφαγία
  choice: 饮食不加选择
  rationale: 该复合词指什么都吃、吃各种东西；“饮食不加选择”比生硬的“杂食性”更适合伦理恶习清单，也不与表示食量过度的下一词混同。
- source_word: λαμαργία
  choice: 贪食
  rationale: 该词表示对食物贪婪或过度进食；“贪食”简洁、明确，并保留恶习名称的形式。
- source_word: μονοφαγία
  choice: 独自进食
  rationale: 在这组身体欲望及行为恶习中，可理解为不与人同席而独自吃；但词的构成也可能指只吃一种食物，因此另加脚注保存歧义。
theological_decisions:
- issue: μονοφαγία的含义
  choice: 独自进食
  alternative: 只吃一种食物／单一饮食
  rationale: 这主要是词义与语境问题，而非教义判断。“独自进食”较符合伦理恶习清单中的社交失当含义；不过希腊词的构词容许“只吃一种食物”，故不在正文中强行排除，而以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以并列的名词性短语呈现原文简洁的恶习清单；避免使用容易被理解为生物学食性的“杂食”。
