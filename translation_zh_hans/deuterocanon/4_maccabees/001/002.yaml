base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: zh_hans
  text: 因为这篇论述对于获得知识[a]确有必要，并且包含对最高美德——我指的是审慎[b]——的赞颂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获得知识”也可译作“获得理解”或“为了知识”。希腊语 εἰς ἐπιστήμην 可指知识或理解。
    reason: lexical_alternative
  - marker: b
    text: “审慎”也可译作“实践智慧”。希腊语 φρόνησις 指审慎地作出道德判断的实践性智慧。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: 确有必要
  rationale: 表达论述的必要性，而不弱化为仅仅“有用”；“确”也传达 γάρ 所在句中的强调语气。
- source_word: εἰς ἐπιστήμην
  choice: 对于获得知识
  rationale: ἐπιστήμη 可指知识或理解；此处采用“获得知识”，既保留目标意义，也符合本段哲学论述的语境。
- source_word: λόγος
  choice: 这番论述
  rationale: 此处不是单个“话语”，而是作者正在展开的理性论说；“这番论述”自然且能体现篇章指向。
- source_word: ἄξιος
  choice: 配得上
  rationale: 保留希腊文“相称、堪当”的意义，不将其完全并入较宽泛的“赞颂……”。
- source_word: τῆς μεγίστης ἀρετῆς
  choice: 那最大的美德
  rationale: ἀρετή 在这里属于伦理哲学语汇，“美德”比泛称“优秀”更准确；最高级译作“最大的”。
- source_word: φρονήσεως
  choice: 明智
  rationale: φρόνησις 指能够作出审慎道德判断的实践性智慧；“明智”在现代汉语中简洁自然，同时保留其理智与伦理内涵。
- source_word: περιέχει ἔπαινον
  choice: 其中的赞颂
  rationale: 以名词结构自然表达论述中包含赞颂之意，并与 ἄξιος 构成“赞颂配得上美德”的关系。
theological_decisions:
- issue: 如何翻译伦理哲学中的 ἀρετή 与 φρόνησις，而不引入后期宗派性概念
  choice: 采用“美德”和“明智”，按道德哲学语境理解
  alternative: 采用“卓越”和“实践智慧”
  rationale: 本节以希腊化伦理哲学的语域开篇；“美德”和“明智”可让普通读者理解，又不附加特定宗派的教义含义。
- issue: ἄξιος 与 τῆς μεγίστης ἀρετῆς、ἔπαινον 的句法关系
  choice: 译为“其中的赞颂也配得上那最大的美德”
  alternative: 译为“其中包含对最大美德的赞颂”
  rationale: 所选译法明确保留 ἄξιος“配得上”的语义，并将属格理解为赞颂与该美德相称；另一译法更流畅，却会略去这一词的明确意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这番论述”保留哲学论说的语域；破折号自然呈现 λέγω δή 的解释性插语。所有脚注标记均置于正文相应词语之后。
