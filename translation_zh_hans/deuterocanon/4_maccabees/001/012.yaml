  yaml_path: translation/deuterocanon/4_maccabees/001/012.yaml
  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
translation:
  language: zh_hans
  text: 不过，关于这一点，如今也可以马上谈论[a]；先从论题入手——这是我惯常的做法——然后我会转而论述他们[b]，将荣耀归给至为智慧的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今也获准马上谈论这一点。”希腊语ἐξέσται既可表示“可以”，也可带有“获准”的意味。
    reason: lexical_alternative
  - marker: b
    text: “他们”可能指下文将要论述的人物；按紧邻的措辞，也可能理解为“这些事”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 不过……也
  rationale: 保留转折连接和附加性的强调，同时符合现代汉语表达。
- source_word: περὶ τούτου
  choice: 关于这一点
  rationale: 保持所指范围宽泛，不预先限定具体内容。
- source_word: νῦν αὐτίκα δὴ
  choice: 现在……立即
  rationale: 体现多个副词共同加强的即时意味。
- source_word: λέγειν ἐξέσται
  choice: 可以……说明
  rationale: ἐξέσται可表示可能或获准；正文采用较符合论述进程的可能义，并在脚注保留许可义。
- source_word: ἀρξαμένων τῆς ὑποθέσεως
  choice: 先从论题入手
  rationale: 原文结构凝练；此译法自然传达从论题开始展开的意思，又不增加具体解释。
- source_word: ὅπερ εἴωθα ποιεῖν
  choice: 这是我惯常的做法
  rationale: 清楚保留作者对自己惯用论述方式的插语。
- source_word: εἰς τὸν περὶ αὐτῶν τρέψομαι λόγον
  choice: 然后我会转而论述他们
  rationale: 保留‘转向论述’的修辞动作，并以代词维持原文所指的歧义。
- source_word: αὐτῶν
  choice: 他们
  rationale: 语法上可指后文所谈的人物，也可能宽泛指相关事项；正文采用人称指向，脚注说明另一可能。
- source_word: δόξαν διδοὺς
  choice: 将荣耀归给
  rationale: 采用现代中文中自然且庄重的颂赞表达。
- source_word: τῷ πανσόφῳ θεῷ
  choice: 全智的上帝
  rationale: 简洁保留πανσόφῳ所表达的完全智慧及颂赞语气。
theological_decisions:
- issue: πανσόφῳ θεῷ在颂赞语中的表达
  choice: 全智的上帝
  alternative: 至为智慧的上帝
  rationale: ‘全智’直接对应πανσόφῳ，庄重简明，不引入额外教义限定。
- issue: αὐτῶν的指向
  choice: 他们
  alternative: 这些事
  rationale: 上下文可能指即将论述的人物，也可能指相关事项；正文不消除这种张力，并以脚注交代另一读法。
