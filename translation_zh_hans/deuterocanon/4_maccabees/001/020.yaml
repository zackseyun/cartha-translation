base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/020.yaml
  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: zh_hans
  text: 情欲中最具概括性的两类，是快乐和痛苦[a]；这两者各自也都与心灵有着天然的关联。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“情欲中最具包容性的两种性质（或本性）。”希腊原文表达凝练；φύσεις可译为“性质”或“本性”，也可按这里的分类含义译为“类”。
    reason: 保留φύσεις在“性质／本性”与分类意义之间的词义张力。
lexical_decisions:
- source_word: παθῶν
  choice: 情欲
  rationale: 此处是伦理哲学语境，指影响人的情感与欲求冲动；“情欲”保留其道德心理层面的含义，不局限于“苦难”，也不单指现代意义上的情绪。
- source_word: φύσεις
  choice: 类
  rationale: 字面可作“性质”或“本性”，但本句是在把情欲归纳为两大范畴；译作“类”更符合现代汉语的分类表达，同时以脚注保留原文的压缩说法。
- source_word: περιεκτικώταται
  choice: 最具概括性的
  rationale: 最高级形式表示涵盖范围最广、足以统摄其他情欲的类别；“最具概括性的”自然表达这种统摄意义。
- source_word: ἡδονή
  choice: 快乐
  rationale: 在伦理哲学论述中表示与痛苦相对的愉悦体验；“快乐”清楚、通行。
- source_word: πόνος
  choice: 痛苦
  rationale: 与ἡδονή形成对举时，主要指痛苦而非劳作；“痛苦”也能兼顾身心感受。
- source_word: ἑκάτερον
  choice: 这两者也都
  rationale: 以分指方式回指快乐和痛苦，说明二者各自都具有下述关系。
- source_word: περὶ τὴν ψυχὴν
  choice: 与心灵相关
  rationale: περί加宾格在此表示关联范围；“与心灵相关”避免生硬直译为“围绕心灵”，也不把关系解释得过强。
- source_word: πέφυκεν
  choice: 天然
  rationale: φύω的完成时在此表达固有、自然形成的状态；“天然”简洁保留“按其本性”的意味。
theological_decisions:
- issue: ψυχή的人论含义
  choice: 心灵
  alternative: 灵魂；生命；自我
  rationale: 本节属于伦理哲学论述，ψυχή指人的内在心理或心灵层面。“心灵”在现代汉语中较自然，并避免把此处过度限定为后世精密的灵魂本体论；同时不宜译作单纯的生物性“生命”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留原句前后两项判断的紧密联系；不增添原文没有的时间或篇章标记。
