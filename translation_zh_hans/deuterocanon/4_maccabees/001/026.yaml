  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
translation:
  language: zh_hans
  text: 侵害灵魂的，有狂傲、贪爱钱财、贪慕名望、好争竞和嫉妒；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”或译“恶眼”；希腊词可指嫉妒，也可含有因嫉妒而怀恶意、以恶眼相看的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μὲν ψυχῆς
  choice: 侵害灵魂的
  rationale: κατά加属格在此恶行清单中带有不利于、与……相对的意味。“侵害灵魂的”以自然汉语保留其对抗性；μὲν也表明本句属于上下文中的分类对举，不宜孤立地强化译出。
- source_word: ἀλαζονία
  choice: 狂傲
  rationale: 指夸耀、自高和傲慢的态度。“狂傲”简洁庄重，并保留明显的贬义。
- source_word: φιλαργυρία
  choice: 贪爱钱财
  rationale: 该复合词字面意为“爱银钱”。“贪爱钱财”既保留“爱”的构词意味，也明确表达其作为恶习的性质。
- source_word: φιλοδοξία
  choice: 贪慕名望
  rationale: 指对荣誉、声望或名声的热衷。“贪慕名望”避免把它弱化为中性的“抱负”，并体现本处恶行清单的语境。
- source_word: φιλονεικία
  choice: 好争竞
  rationale: 表示爱争执、好斗或惯于挑起纷争的倾向。“好争竞”自然地表达一种持续性的品格恶习。
- source_word: βασκανία
  choice: 嫉妒
  rationale: 在恶行清单中，该词通常可指嫉妒，也可能带有因嫉妒而怀恶意、以“恶眼”相看的文化含义。正文用现代读者最易理解的“嫉妒”，另一含义收入脚注。
