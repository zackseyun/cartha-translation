base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: zh_hans
  text: 因为，理性并不制伏它自身的激情，而是制伏那些与正义[a]、勇气、节制和明智相对立的激情；对这些激情，理性并非要消灭它们，而是要不向它们屈服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”也可译作“公义”。
    reason: δικαιοσύνη兼有正义与公义的语义；此处正文按希腊德性列表的语境取“正义”。
lexical_decisions:
- source_word: λογισμός
  choice: 理性
  rationale: 此词在《马加比四书》的哲学论述中指进行理性判断和思考的能力；“理性”简洁自然，也能维持全书有关理性驾驭激情的核心论题。
- source_word: κρατεῖ
  choice: 支配
  rationale: κρατέω在此表示掌权、制伏或占据主导地位；“支配”保留统御性的比喻，又适合现代汉语哲学语境。
- source_word: παθῶν
  choice: 激情
  rationale: πάθη在这里不是“苦难”，而是伦理哲学意义上的激情、情感冲动；“激情”能保留其较宽的哲学含义，避免将其限缩为某一类欲望。
- source_word: τῶν τῆς δικαιοσύνης καὶ ἀνδρείας καὶ σωφροσύνης καὶ φρονήσεως ἐναντίων
  choice: 那些与正义、勇气、节制和明智相对立的激情
  rationale: 希腊文以名词化形容词“相对立的事物”承接前面的πάθη；汉语明确补出“激情”，使所指清楚，同时保留四种德性的并列结构。
- source_word: δικαιοσύνης
  choice: 正义
  rationale: 此处位于希腊伦理学的德性列表中，“正义”比“公义”更贴合该哲学框架；另一可行译法以脚注保留。
- source_word: ἀνδρείας
  choice: 勇气
  rationale: 指勇敢、刚毅这一德性；“勇气”自然易懂，也避免“男子气概”所带来的性别色彩。
- source_word: σωφροσύνης
  choice: 节制
  rationale: 此词指克制、持守分寸的德性；“节制”是现代汉语中成熟而简明的伦理术语。
- source_word: φρονήσεως
  choice: 明智
  rationale: φρόνησις指实践判断上的智慧或审慎；“明智”通俗而庄重，并与更宽泛的“智慧”有所区别。
- source_word: καταλῦσαι
  choice: 消灭
  rationale: 此处表示彻底废除、解除或摧毁这些激情；“消灭”与下文仅仅“不屈服”形成清楚的强弱对照。
- source_word: μὴ εἴξαι
  choice: 不向它们屈服
  rationale: εἴκω意为退让、让步；“不向它们屈服”自然地表达拒绝受激情控制。
theological_decisions:
- issue: 德性列表中δικαιοσύνη的译法
  choice: 正义
  alternative: 公义
  rationale: 上下文是希腊化伦理哲学中的四德结构，而非明确的盟约或称义语境，因此正文采用“正义”；“公义”仍属真实的词义可能，故列入脚注。
- issue: 理性支配激情的范围
  choice: 保留“并非……一切……而只……”的限定，表明所支配的是与德性相反的激情
  alternative: 笼统译成“理性支配激情”
  rationale: 原文明确区分πάθη与那些同四种德性相对立者，并进一步说明目的不是消灭激情；译文不应把论点简化为理性压制所有情感。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“理性—激情—德性”的哲学论证结构得到保留；重复“理性支配这些激情”以消除汉语中分号后主语不明的问题。正文中的[a]与脚注完全对应。
