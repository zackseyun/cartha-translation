base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/028.yaml
  text: Therefore[a], just as pleasure and pain are two growths of the body and the soul, many passions are offshoots of these[b];
translation:
  language: zh_hans
  text: 所以，正如快乐和痛苦是身体和灵魂的两株植物，许多情感冲动都是从这两者生出的旁生枝。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“植株”或“幼苗”。希腊文在整句话中持续使用植物生长的比喻。
    reason: lexical_alternative
  - marker: b
    text: 或译“情欲”“激情”或“情感”；这里指本书所说应由理性治理的各种情感与冲动。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οὖν
  choice: 所以，正如
  rationale: “所以”承接上文的推论，“正如”引出比拟，兼顾 οὖν 的逻辑衔接与 καθάπερ 的比较作用。
- source_word: δυοῖν
  choice: 两株
  rationale: 希腊文双数明确表示两个；量词“株”同时配合贯穿全句的植物意象。
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: 生长在身体和灵魂中的
  rationale: 将两个属格理解为这两株“根苗”所属或生长的领域；“身体和灵魂”保留原文的人论配对，不将 ψυχή 解释性改写为“内心”或“生命”。
- source_word: φυτῶν
  choice: 根苗
  rationale: φυτά 字面可指植物或所栽种之物。此处后接 παραφυάδες 的旁生枝条意象，“根苗”在现代汉语中既自然，又能表达作为后续情感之源的植物意象。
- source_word: ἡδονῆς τε καὶ πόνου
  choice: 快乐和痛苦
  rationale: 直译这对基本感受，清楚保留作者哲学论述中的对举。
- source_word: τῶν παθῶν
  choice: 情感冲动
  rationale: πάθη 在本书语境中指理性需要节制或驾驭的情感、情欲或激情；“情感冲动”避免“情欲”在现代汉语中常被窄化为性欲。
- source_word: εἰσι παραφυάδες
  choice: 都是从它们生出的旁枝
  rationale: παραφυάδες 指从主株旁生的嫩枝或支枝；此译延续 φυτῶν 的植物比喻，并显明这些情感对快乐和痛苦的派生关系。
theological_decisions:
- issue: σώματος καὶ ψυχῆς 的人论表达
  choice: 身体和灵魂
  alternative: 身体和生命；肉体和内心
  rationale: 在这一哲学性配对中，ψυχή 较自然地指“灵魂”。保留“身体和灵魂”可忠实呈现作者的概念框架，同时不进一步规定二者关系或引入后来的教义体系。
- issue: πάθη 的伦理含义
  choice: 情感冲动
  alternative: 情欲；激情；情感
  rationale: 原词涵盖可受理性治理的情感和欲望，并不只指邪恶或性方面的欲望；采用较宽泛的表达，避免预先给它加上道德定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“根苗—旁枝”贯通希腊文的植物意象；“身体和灵魂”保留原文的人论张力，“情感冲动”则避免现代汉语中“情欲”可能造成的过窄理解。
