  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: zh_hans
  text: 智慧的诸种形式是审慎、正义[a]、勇气和自制。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”也可译作“义”。希腊文为 δικαιοσύνη；这里处于德目列表中，所以译作“正义”。
    reason: 词义备选
lexical_decisions:
- source_word: εἴδεα
  choice: 表现形式
  rationale: 此处指智慧借以呈现的若干构成形式或类别。“表现形式”既保留“形式”的含义，也比单说“形式”更符合现代汉语。
- source_word: καθεστᾶσιν
  choice: 是
  rationale: 该动词在此具有系词作用，表示这些德性被确立为智慧的诸种形式；译作“是”简洁自然。
- source_word: φρόνησις
  choice: 审慎
  rationale: 在古希腊德性表中，该词指能作出恰当判断并指导行动的实践理性；“审慎”保留其哲学德目色彩。
- source_word: δικαιοσύνη
  choice: 公正
  rationale: 本节列举古典德目，所指主要是公平正直的伦理德性；“公正”比神学语境常用的“义”更贴合此处，同时以脚注保留另一译法。
- source_word: ἀνδρία
  choice: 勇气
  rationale: 这是表示勇敢、刚毅的标准德目用语；“勇气”现代、清楚，也避免按词源误译为带性别色彩的词。
- source_word: σωφροσύνη
  choice: 自制
  rationale: 该词在德性论述中指克制欲望、节制自身；“自制”准确且易于普通读者理解。
theological_decisions:
- issue: 如何翻译哲学德目表中的 δικαιοσύνη
  choice: 公正
  alternative: 义
  rationale: 上下文是审慎、公正、勇气和自制这一组古典德目，并非特别强调盟约身份或称义等神学议题，因此正文采用“公正”；但该词在圣经其他语境中常译作“义”，故在脚注注明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式保留希腊文的定义性结构，并用顿号呈现四项并列德目。
