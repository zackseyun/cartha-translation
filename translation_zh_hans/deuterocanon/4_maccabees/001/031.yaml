  text: 因此，自制就是对欲望的驾驭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: 节制
  rationale: 这里是在界定一种基本德性，重点是约束和治理欲望。“节制”是现代汉语伦理语境中自然、庄重的对应词，也比“自制”更能保留其作为德性名称的意味。
- source_word: δὴ τοίνυν
  choice: 所以
  rationale: 这一粒子组合带有承接前文并作推论的作用；“所以”简洁自然地表达这种过渡，不生硬地逐一对应两个粒子。
- source_word: ἐστὶν
  choice: 就是
  rationale: 在定义句中用“就是”比单用“是”更自然，并适度体现原句的断定语气。
- source_word: ἐπικράτεια
  choice: 驾驭
  rationale: 该词表示掌控、占上风或支配。“驾驭”能体现主动治理欲望的含义，又避免“统治”在现代汉语中可能产生的政治色彩。
- source_word: τῶν ἐπιθυμιῶν
  choice: 对各种欲望
  rationale: ἐπιθυμίαι在这里泛指人的欲望，而非专指情欲或邪欲。复数用“各种”自然体现；介词“对”则清楚表达ἐπικράτεια所指向的对象。
