base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: zh_hans
  text: 不过，让我们辨明：理性[a]究竟是什么，情欲[b]是什么，情欲有多少种，以及理性能否支配这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理性”也可译作“理性思考”或“理性判断”。
    reason: lexical_alternative
  - marker: b
    text: “情欲”在这里泛指影响并驱动人的情感、欲望和冲动，并非专指性欲；也可译作“情感冲动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: 让我们辨明
  rationale: 劝勉虚拟式表达共同探究；“辨明”兼顾区分概念与查明定义两层含义。
- source_word: λογισμός
  choice: 理性
  rationale: 本书中指作出理性判断、与情欲相抗衡的能力；“理性”简洁自然，并保留哲学语域。
- source_word: πάθος
  choice: 情欲
  rationale: 此处不是“苦难”，而是哲学意义上影响并驱动人的情感与欲求；“情欲”保留其驱力色彩，但不把范围限于性欲。
- source_word: πόσα παθῶν εἰδέα
  choice: 情欲有多少种
  rationale: εἰδέα在此表示类别或形态；译作“多少种”符合现代汉语，也保留分类意味。
- source_word: ἐπικρατεῖ
  choice: 支配
  rationale: 表达占优势、掌权或制胜的含义；“支配”保留理性驾驭情欲的哲学张力，又避免绝对消除情欲之意。
- source_word: τούτων
  choice: 这一切
  rationale: 回指前述各种情欲，并保留概括性的指示作用。
theological_decisions:
- issue: λογισμός与πάθος之间的哲学对照
  choice: 理性……情欲
  alternative: 理性判断……情感冲动
  rationale: 所选译法保持本节关于理性能否统御各种情欲的纲领性问题，不将古代伦理哲学概念完全改写为现代心理学术语。
- issue: εἰ πάντων ἐπικρατεῖ的疑问性质
  choice: 理性能否支配这一切
  alternative: 理性是否支配这一切
  rationale: “能否”自然表达作者将要考察的能力问题，同时仍保留希腊文εἰ引出的开放疑问，不预先断定答案。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“辨明”保留论辩开篇的分类与界定意味；句末集中设置脚注标记，使正文流畅，同时确保每个标记均在正文出现。
