  text: But prudence is the most sovereign of all, and from it reason indeed gains mastery over the passions.
translation:
  language: zh_hans
  text: 但明智在一切之中最具支配力；理性确实借着明智制伏各种情欲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυριωτάτη
  choice: 居于主导地位
  rationale: 该最高级形容词表示最具支配性或权威性；译作动词性短语，更符合现代汉语，也与后文“胜过”相呼应。
- source_word: φρόνησις
  choice: 明智
  rationale: 在此指实践性的智慧、审慎判断；“明智”自然易懂，并避免把它缩窄为单纯谨慎。
- source_word: λογισμός
  choice: 理性
  rationale: 本书语境中的核心概念，指能够推理、判断并治理情感冲动的理性能力。
- source_word: πάθη
  choice: 各种情欲
  rationale: πάθη 泛指情感、冲动或欲望；结合本书论述理性治理诸激情的语境，用“各种情欲”保留其复数及负面冲动力度，但不限定为性欲。
- source_word: ἐπικρατεῖ
  choice: 胜过
  rationale: 表示取得优势、掌控或制伏；“胜过”保留理性取得支配优势的意思，同时不把过程过度绝对化。
theological_decisions:
- issue: ἐξ ἧς 的所指及因果关系
  choice: 由此
  alternative: 从明智而来／凭着明智
  rationale: 关系代词阴性单数明确回指 φρόνησις。“由此”保留来源或依据关系，不额外断定明智与理性的本体关系。
- issue: κυριωτάτη πάντων 的比较范围
  choice: 在这一切之中，明智居于主导地位
  alternative: 明智是万物中最有主权的
  rationale: πάντων 在上下文中较可能回指所讨论的诸德性或能力，而非宇宙万物；采用“这一切”保留语境指向，避免神学化“主权”一词。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希腊文前后两分句的论证推进，并以“正是”对应 δή 的强调语气。
