base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/007.yaml
  text: So then[b][a], from many angles and in many ways I could show you that devout reason is master of the passions.
translation:
  language: zh_hans
  text: 因此，我可以从许多方面、以不同方式向你们表明：敬神的理性[a]是各种情欲[b]的主宰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬神的理性”也可译作“敬虔的理性”。这是本书的核心用语，指受对神的敬畏所引导的理性。
    reason: lexical_alternative
  - marker: b
    text: “情欲”译自希腊语παθῶν，泛指情感、欲望和冲动，并不只指性欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν μὲν οὖν καὶ ἀλλαχόθεν
  choice: 所以……从许多方面、从不同角度
  rationale: οὖν承接上文，译作“所以”；两个成对的副词强调论证途径和切入点的多样性，采用近义而不完全重复的中文表达，以保留累加强调。
- source_word: ἔχοιμʼ ἂν
  choice: 我本可以
  rationale: 愿望式与ἄν表达潜在可能；“本可以”自然传达说话者有能力如此论证，但此处并未展开全部论据。
- source_word: ὑμῖν ἐπιδεῖξαι
  choice: 向你们说明
  rationale: ἐπιδείκνυμι在论辩语境中指展示、论证；“说明”比“证明”略为克制，避免强化为严格的形式证明，并保留ὑμῖν的复数对象。
- source_word: αὐτοκράτωρ
  choice: 能够支配
  rationale: 该词表示拥有自主权或统治权。译作“能够支配”以自然中文表达理性对于情欲的主导地位，同时避免将其人格化为“主人”。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: 在本书伦理哲学语境中，πάθη指需要受理性治理的情感冲动、欲望与激情；“各种情欲”借助“各种”体现复数范围，但不把它缩减为单纯的性欲。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  rationale: λογισμός在本书核心论题中是理性判断或推理能力，εὐσεβής则指向对神的敬虔；“敬神的理性”同时保留理性与宗教敬畏两个层面，且符合现代汉语。
theological_decisions:
- issue: 如何翻译核心短语ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  alternative: 敬虔的理性；虔敬的理性
  rationale: “敬神的理性”明确表达这种理性受对神的敬畏所塑造，却不引入后世宗派性的神学术语，也不把λόγισμός改写成泛指的“敬虔思想”。
- issue: αὐτοκράτωρ是否表达绝对统治
  choice: 能够支配
  alternative: 是……的主宰；全权统治
  rationale: 原词具有强烈的治理和掌权意味，但上下文讨论理性治理情欲。译文保留其主导作用，同时以“能够”呼应论题中的能力判断，避免额外推导为情欲已被彻底消灭。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留原文的论辩语气和“许多方面／不同角度”的成对强调；以“你们”体现ὑμῖν为复数。脚注标记置于所解释的整项主张之后。
