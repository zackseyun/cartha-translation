  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
translation:
  language: zh_hans
  text: 所以，理性乃是一种心智：它与正直的生活相伴，优先看重智慧的道理[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧的道理”也可译作“智慧的话语”、“智慧的论说”或“智慧的原则”。希腊语λόγος可指“话语”、“论说”、“道理”或“原则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  choice: 理性
  rationale: 这里是在哲学性地界定人的理性判断能力；“理性”简洁自然，也比“推理”更能指称这种心智能力。
- source_word: νοῦς
  choice: 心智
  rationale: 该词指人的思想或理解能力本身；“心智”既保留其作为精神官能的含义，又适合现代汉语的定义句。
- source_word: μετὰ ὀρθοῦ βίου
  choice: 以正直的生活为伴
  rationale: μετά表达伴随关系，ὀρθός与βίος合起来指合乎正道的生活方式；此译兼顾伦理意味和持续的生活形态。
- source_word: προτιμῶν
  choice: 更看重
  rationale: 该分词表示优先选择、较为重视；“更看重”自然地体现其比较和取舍意味。
- source_word: τὸν σοφίας λόγον
  choice: 智慧之道
  rationale: λόγος在这里可指言辞、论说、道理或原则。“智慧之道”在现代汉语中较为自然，同时保留其可能兼有教导与准则的开放性；脚注列出主要替代理解。
theological_decisions:
- issue: 如何翻译σοφίας λόγον而不把λόγος过度限定为单一哲学术语
  choice: 智慧之道
  alternative: 智慧的话；智慧的论说；智慧的原则
  rationale: 上下文把理性界定为对智慧所表达的道理或准则有所取舍。λόγος语义宽广，正文采用较开放且自然的“道”，并以脚注说明其他可能，以免将其固定为后来的技术性或宗派性概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文定义句的哲学色彩，并用冒号化解汉语中“理性就是一种心智”之后连续修饰可能造成的生硬感。
