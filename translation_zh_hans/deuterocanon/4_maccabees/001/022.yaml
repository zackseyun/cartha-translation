lexical_decisions:
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 在本节对情感的分类中指对享乐的欲求；“欲望”既贴近原义，也保留其本身可中性、可负面的语义空间。
- source_word: ἡδονή
  choice: 享乐
  rationale: 表达感官或情欲得到满足时的快感，比单纯的“快乐”更能与下文 χαρά 区分。
- source_word: χαρά
  choice: 喜乐
  rationale: 指享乐之后产生的欣喜状态，并与 ἡδονή 的“享乐”形成明确区别。
- source_word: πρὸ … μετὰ
  choice: 先于……之后
  rationale: 准确保留原文的时间次序与对称结构。
- source_word: μὲν οὖν … δὲ
  choice: 所以……则……
  rationale: “所以”承接上文论述，“则”呈现两个分句之间的对应与转折。
