  text: Wisdom[a], then, is knowledge of divine and human matters, and of their causes.
translation:
  language: zh_hans
  text: 所以，智慧就是对神圣之事和人间之事，以及这些事之成因的认识。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 直接对应抽象名词，并保留本节为“智慧”下定义的哲学语气。
- source_word: δὴ τοίνυν
  choice: 所以
  rationale: 这一粒子组合承接上文并引出推论；“所以”在现代汉语中自然、简洁。
- source_word: γνῶσις
  choice: 认识
  rationale: 在定义性、哲学性的语境中，“认识”既可指知识，也可指对对象的认知，比单纯的“知识”更适合与后面的“之事”搭配。
- source_word: θείων καὶ ἀνθρωπίνων πραγμάτων
  choice: 神圣之事和人间之事
  rationale: 保留神圣领域与人类领域之间的对举；“事”传达 πραγμάτων 的宽泛含义，“人间”则自然地表达 ἀνθρωπίνων，而不局限于男性。
- source_word: τῶν τούτων αἰτίων
  choice: 这些事之成因
  rationale: τούτων 明确回指刚提到的神圣之事和人间之事；“成因”保留 αἰτίων 的因果、哲学含义，也避免“原因”可能只被理解为具体事件缘由。
