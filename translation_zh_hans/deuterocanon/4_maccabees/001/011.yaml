base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: zh_hans
  text: 因为那些人不仅因自己的勇气和忍耐而在众人看来更加令人赞叹，甚至连折磨他们的人也赞叹他们；他们凭着忍耐战胜了暴君，成为那压迫本民族的暴政被推翻的原因，以致故土[a]借着他们得以洁净[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “故土”也可译作“祖国”或“本土”。希腊文指自己的本土或祖国，带有庄重的归属意味。
    reason: lexical_alternative
  - marker: b
    text: “得以洁净”也可译作“得以净化”。该词可带有道德、礼仪或民族恢复的意味；本句没有限定为其中一种。
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: 更令人赞叹／受到……赞叹
  rationale: 该词是比较级，表示他们在所述事迹中越发令人惊叹、敬佩。中文用“甚至”与递进句式体现比较和加强的语气，避免生硬直译为“更加奇妙”。
- source_word: ἀνδρίᾳ
  choice: 勇气
  rationale: 此处指在苦难中表现的勇敢、英勇；“勇气”是自然、庄重且不带不必要性别色彩的现代汉语表达。
- source_word: ὑπομονῇ
  choice: 忍耐
  rationale: 该词在本节出现两次，指受苦时坚持不屈的恒忍；两处统一译为“忍耐”，保留重复及其修辞作用。
- source_word: αἰκισαμένων
  choice: 折磨他们的人
  rationale: 分词指施加残酷虐待的人。“折磨”清楚表达暴力程度，同时保留动词性。
- source_word: αἴτιοι κατέστησαν τοῦ καταλυθῆναι
  choice: 促成了……被推翻
  rationale: 希腊文表示他们成为暴政覆灭的原因。中文“促成了”准确表达因果作用，又比“成为……的原因”更流畅。
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: 那压迫本民族的暴政
  rationale: κατά 表示暴政针对该民族；“压迫”自然显明其敌对方向，“本民族”依语境表达作者所属民族而不额外添加专名。
- source_word: νικήσαντες τὸν τύραννον
  choice: 战胜了暴君
  rationale: 保留胜利意象；以“凭着忍耐”表达工具或方式关系。
- source_word: ὥστε καθαρσθῆναι
  choice: 使……得以洁净
  rationale: ὥστε 加不定式表达结果。“洁净”保留 καθαρίζω 所可能具有的政治恢复、道德及礼仪多重意涵，不将其缩减为单纯“解放”。
- source_word: πατρίδα
  choice: 故土
  rationale: πατρίς 指自己的本土、祖国或家园。“故土”在现代汉语中庄重自然，也保留对本土的归属感；可替译为“祖国”。
theological_decisions:
- issue: 殉难者使故土得洁净的含义
  choice: 保留“故土借着他们得以洁净”的因果和洁净语言
  alternative: 将其明确解释为政治解放、礼仪洁净、道德净化，或具有特定赎罪机制
  rationale: καθαρσθῆναι 本身容许政治恢复、道德或礼仪洁净等相互交叠的理解；本节确实把结果归于这些受难者，却没有在此详述其机制，因此译文保留神学张力而不作体系化限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。将较长的希腊文周期句分为两句，以增强中文可读性；保留“忍耐”的重复、战胜暴君的胜利意象，以及“借着他们得以洁净”的未决神学含义。
