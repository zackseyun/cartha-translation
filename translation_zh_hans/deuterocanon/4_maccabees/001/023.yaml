lexical_decisions:
- source_word: πρὸ
  choice: ……以前
  rationale: 表示时间上的先后；在汉语中用“来到以前”自然表达痛苦发生之前。
- source_word: πόνου / τὸν πόνον
  choice: 痛苦
  rationale: πόνος可指劳苦、疼痛或苦难；此处与事前的恐惧和事后的悲伤相连，“痛苦”能保留身体及心理受苦的宽泛含义。
- source_word: φόβος
  choice: 恐惧
  rationale: φόβος的常用中性对应词，既不削弱也不过分强化原文。
- source_word: μετὰ
  choice: ……过后
  rationale: 与宾格连用，表示经历痛苦之后的时间次序。
- source_word: λύπη
  choice: 悲伤
  rationale: λύπη可表示悲伤、忧愁或痛楚；“悲伤”简明自然，并适合作为痛苦之后的情绪反应。
