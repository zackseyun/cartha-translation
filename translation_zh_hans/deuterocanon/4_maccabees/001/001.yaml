  naturalness: 整体庄重通顺，但“敬虔的理性能否自主支配各种情欲”略显抽象且“情欲”在现代汉语中容易偏向性欲。“情感冲动”较能自然涵盖此处πάθη的哲学意义。
  terminology: “敬虔的理性”恰当保留εὐσεβὴς λογισμός的宗教与理性双重面向。αὐτόδεσποτος宜在正文中明确其强势的主宰含义；“完全主宰”比“自主支配”更清楚地表达其对τῶν παθῶν的支配关系，同时以脚注保留“自主支配”的构词层面。
