base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: zh_hans
  text: 我将要阐明一个极富哲理的论证：敬虔的理性是否完全主宰情感冲动[a]；我理当劝你们热切地专心留意哲学。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全主宰”也可译为“自主支配”或“完全作主”；“敬虔的理性”也可译作“虔敬的推理”。
    reason: 说明αὐτόδεσποτος所含自主性与完全主权的语义，并保留εὐσεβὴς λογισμός兼具宗教与理性层面的可译空间。
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: 一个极富哲理的论题
  rationale: λόγος在此指作者将要展开并论证的论题，而非单个“话语”；“极富哲理”保留φιλοσοφώτατον的最高级修辞色彩，同时符合现代汉语表达。
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: 我将要阐明
  rationale: μέλλων表示即将或有意从事，ἐπιδείκνυσθαι表示展示、阐明或论证；“将要阐明”兼顾二者而不过度预断论证必然成功。
- source_word: εἰ
  choice: 能否
  rationale: 此处引出间接疑问，即作者要考察的论题，而非提出条件，因此译作“能否”。
- source_word: αὐτόδεσποτός
  choice: 自主支配
  rationale: 该复合词带有凭自身掌权、拥有完全主权的意味；“自主支配”既保留独立掌控的语义，也避免仅译“控制”而削弱其力度。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在希腊化哲学语境中指影响人的激情、情绪与欲念；“情欲”可概括这种非理性冲动，“各种”体现希腊文复数，但不把它窄化为性欲。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬虔的理性
  rationale: λογισμός在本书中是理性判断或推理能力的核心术语；εὐσεβής赋予其敬神、虔敬的维度。“敬虔的理性”同时保留宗教性和哲学性。
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν
  choice: 我理当劝你们
  rationale: 带ἄν的希求式表达委婉而正式的劝告；结合ὀρθῶς译作“理当劝你们”，自然传达有充分理由提出劝勉之意。
- source_word: ὅπως προθύμως προσέχητε
  choice: 热切地留心
  rationale: προθύμως表示热心、欣然或积极，προσέχητε表示专心留意；“热切地留心”兼顾态度与注意力。
- source_word: τῇ φιλοσοφίᾳ
  choice: 这番哲学论述
  rationale: 在此语境中，作者邀请听众关注眼前展开的哲学探讨。“这番哲学论述”在汉语中比单说“哲学”更明确自然，但不把内容限定为某一后世哲学体系。
theological_decisions:
- issue: 如何兼顾εὐσεβὴς λογισμός的宗教与哲学内涵
  choice: 敬虔的理性
  alternative: 虔敬的推理／属神的理性
  rationale: “敬虔”保留对神的敬畏与虔诚，“理性”则保留本书关于理性能力的哲学论题；不将其改写成纯世俗理性，也不加入特定宗派意义。
- issue: αὐτόδεσπότος所表达的支配程度
  choice: 正文译作“自主支配”，脚注说明“完全作主”这一可能表达
  alternative: 完全作主／全权控制
  rationale: 原词既包含自主性，也可能强调绝对主权。正文用“自主支配”保存复合词的核心构词意义，脚注呈现较强译法，避免无声消除强度上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原句作为卷首论题陈述的修辞力度；分号帮助读者辨明作者将要阐明的论题与随后的劝勉。
