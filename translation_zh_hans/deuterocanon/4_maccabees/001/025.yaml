  yaml_path: translation/deuterocanon/4_maccabees/001/025.yaml
  text: And within pleasure there is also a malicious disposition[a], being the most versatile of all the passions.
translation:
  language: zh_hans
  text: 而在享乐之中，也有一种邪恶的倾向；在一切激情中，它的表现形式最为多样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “表现形式最为多样”也可译作“最为多变的”或“最为多面的”。
    reason: 说明πολυτροπωτάτη所包含的多形态、多变化或多面向之义。
lexical_decisions:
- source_word: ἐν ... τῇ ἡδονῇ
  choice: 在享乐中
  rationale: ἐν加与格表示处于某一范畴之内；“享乐”既保留ἡδονή的愉悦含义，也契合本段伦理哲学语境。
- source_word: κακοήθης διάθεσις
  choice: 一种邪恶倾向
  rationale: διάθεσις可指性情、状态或内在倾向，κακοήθης赋予其恶劣、邪恶的道德性质。“邪恶倾向”自然明白，同时不把它过度限定为蓄意害人的“恶意”。
- source_word: πολυτροπωτάτη
  choice: 表现形式最多样的
  rationale: 该词是πολύτροπος的最高级，含有多种转折、方式或形态之意；此译传达其多面、多样性，同时避免把它译成现代汉语中通常带褒义的“最灵活”。
- source_word: πάντων τῶν παθῶν
  choice: 所有激情中
  rationale: πάθη在本书的伦理哲学论述中指需要由理性治理的激情或情感冲动；“激情”比宽泛的“情感”更能保留这一语境，也不局限于性欲。
- source_word: οὖσα
  choice: 它是
  rationale: 用独立分句自然表达希腊语分词与“邪恶倾向”的描述性联系，不额外赋予因果含义。
theological_decisions:
- issue: 希腊化犹太哲学语境中πάθη的译法
  choice: 激情
  alternative: 情感；情欲；情感冲动
  rationale: 本书讨论理性如何统御πάθη。“激情”保留其伦理—心理学色彩，又避免“情欲”在现代汉语中容易被狭义理解为性欲；译文不暗示一切普通情感本身都是邪恶的。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“而……也……”保留δέ与καί的衔接和递进作用；将希腊语分词拆为第二个分句，以避免生硬欧化，同时保留其所指为“邪恶倾向”的语法关系。
