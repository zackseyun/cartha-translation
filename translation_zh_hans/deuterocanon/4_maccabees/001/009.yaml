  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: zh_hans
  text: 因为这些人全都轻看那直至死亡的痛苦[a]，由此表明，理性驾驭各种情欲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不把那直至死亡的痛苦放在眼里”。
    reason: lexical_alternative
  - marker: b
    text: “理性”也可译作“理性的判断”；“驾驭”也可译作“胜过”或“掌控”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαντες οὗτοι
  choice: 这些人全都
  rationale: 既保留全称范围，也体现指示词所指向的前文人物；现代汉语表达自然。
- source_word: ἕως θανάτου πόνον
  choice: 那直至死亡的痛苦
  rationale: 将ἕως θανάτου理解为痛苦所达到的极限，不把上下文中的殉难含义直接增译进正文。
- source_word: ὑπεριδόντες
  choice: 不把……放在眼里
  rationale: 保留原词含有的轻看、蔑视意味，同时比生硬的直译更符合现代汉语习惯。
- source_word: ἐπεδείξαντο
  choice: 由此表明
  rationale: 体现他们的行为构成论证证据；“由此”明确分词行为与主句结论的关系。
- source_word: περικρατεῖ
  choice: 能够驾驭
  rationale: 表达占优势并施行控制的意思，同时避免“统治”在汉语中可能产生的政治色彩。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: 在本书伦理哲学语境中指需要受理性节制的欲望、情感和冲动；“各种”自然体现复数，但不把它缩减为单一的性欲含义。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 简洁保留本书核心哲学概念，指有判断和约束作用的理性思考，不增入后期神学范畴。
theological_decisions:
- issue: 如何翻译ὁ λογισμός而不引入后来的神学范畴
  choice: 理性
  alternative: 理性的判断
  rationale: “理性”准确承接本书关于理性驾驭情欲的中心论旨；脚注说明较完整的语义可能。
- issue: 是否在ἕως θανάτου πόνον中明说殉道
  choice: 那直至死亡的痛苦
  alternative: 致死的痛苦
  rationale: 原文只陈述痛苦达到死亡的极限，没有在本分句中直接使用“殉道”；正文让上下文提供这一背景。
- issue: 如何处理理性与情欲之间的关系强度
  choice: 能够驾驭各种情欲
  alternative: 胜过各种情欲
  rationale: περικρατεῖ表示掌控或居于优势；“驾驭”保留主动控制的力度，又不把命题绝对化为情欲已被消灭。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不把……放在眼里”略带成语色彩，但清楚传达ὑπεριδόντες的轻看意味；正文保留全句的论证语气，并以脚注呈现核心哲学术语和支配动词的可选译法。
