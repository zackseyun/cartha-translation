  yaml_path: translation/deuterocanon/4_maccabees/001/008.yaml
  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: zh_hans
  text: 但我能从以利亚撒、七兄弟和他们的母亲为美德而死所显出的勇敢，更有力地证明这一点。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: 但……更能充分
  rationale: 保留与上文论证的转折和程度递进；用自然汉语表达“远为有力地证明”，避免生硬直译。
- source_word: ἀποδείξαιμι
  choice: 我……能证明
  rationale: 希腊语为潜在式，表示说话者能够借实例加以证明；译文保留其论证语气。
- source_word: ἀνδραγαθείας
  choice: 英勇事迹
  rationale: 该词在此指面对死亡所显出的勇毅高尚表现；“英勇事迹”既涵盖品格，也适合由这些殉难者的行动来作证明。
- source_word: ὑπὲρ ἀρετῆς ἀποθανόντων
  choice: 为美德而死之人
  rationale: 直接保留ὑπέρ所表达的“为了、捍卫”关系，以及ἀρετή的伦理含义，不将其窄化为某一宗派概念。
- source_word: Ἐλεαζάρου τε καὶ ἑπτὰ ἀδελφῶν καὶ τῆς τούτων μητρός
  choice: 以利亚撒、七兄弟和他们的母亲
  rationale: 按原文列举三方，并明确“他们的母亲”所指为七兄弟之母。
theological_decisions:
- issue: ἀρετή的伦理与宗教含义
  choice: 美德
  alternative: 信仰／虔诚
  rationale: 原词ἀρετή本身较宽，指德性或卓越；译作“美德”保留原文张力，不把殉难动机解释成更狭窄的教义术语。
translation_notes:
  register: 采用庄重而现代的书面汉语；以破折号标明同位列举，使“那些为美德而死之人”与三组人物之间的关系清楚，同时保持句子流畅。
