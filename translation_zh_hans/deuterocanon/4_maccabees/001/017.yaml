  yaml_path: translation/deuterocanon/4_maccabees/001/017.yaml
  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
translation:
  language: zh_hans
  text: 那么，这就是律法的教导[a]；借此，我们以庄重的态度学习神圣之事，并以有益的方式学习人间之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“训练”或“管教”。希腊语παιδεία包含借教育和操练塑造品格的意思。
    reason: lexical_alternative
  - marker: b
    text: “神圣之事……人间之事”直译为“神圣的事物……人的事物”，泛指两个彼此对照的范畴。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη δὴ τοίνυν
  choice: 所以，这就是
  rationale: 保留原文兼具总结、承接和强调的语气，同时符合现代汉语表达。
- source_word: ἡ τοῦ νόμου παιδεία
  choice: 律法的教导
  rationale: παιδεία兼有教导、教育、训练和塑造之意；“教导”在此自然明白，脚注补充其养成性内涵。属格结构按原文保留为“律法的教导”。
- source_word: διʼ ἧς
  choice: 借着这教导
  rationale: 表达原文的工具或途径意义；明确回指“教导”，避免汉语代词指向含混。
- source_word: τὰ θεῖα
  choice: 神圣之事
  rationale: 保留中性复数所涵盖的宽泛范畴，不将其收窄为特定教义表述。
- source_word: σεμνῶς
  choice: 以敬虔的态度
  rationale: 体现σεμνῶς所含的庄重、敬畏和尊崇意味，并与“神圣之事”自然搭配。
- source_word: τὰ ἀνθρώπινα
  choice: 人间之事
  rationale: 与“神圣之事”形成宽泛而清楚的对照，不局限于某一种人类事务。
- source_word: συμφερόντως
  choice: 以有益的方式
  rationale: 表达合宜、有利和使人受益的实践意义，而不误解为经济获利。
- source_word: μανθάνομεν
  choice: 我们……学习
  rationale: 直接保留陈述一般事实的现在时语义。
theological_decisions:
- issue: νόμος在本节中的所指
  choice: 律法
  alternative: 《律法》或妥拉
  rationale: 上下文可能指犹太律法，但希腊文仅作普通名词表达；译作“律法”既符合语境，也不额外加入书名化或更具体的界定。
- issue: τὰ θεῖα的范围
  choice: 神圣之事
  alternative: 上帝的事
  rationale: 原文是宽泛的中性复数“属神圣范畴的事”，没有直接使用θεός；译文保留其宽度，避免把表达无根据地具体化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以，这就是”承接上文并作总结；后半句适度显化“态度”和“方式”，使两个副词在汉语中修饰清楚。所有脚注标记均已置于正文。
