  text: There are also ancient sequences of passions concerning pleasure and pain[a].
translation:
  language: zh_hans
  text: 此外，也有关于快乐与痛苦、由来已久的一连串的情欲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此外，也有关于快乐与痛苦、由来已久的一系列情欲。”
    reason: “一连串”强调 ἀκολουθίαι 所含的相随、接续之意；“一系列”是较平直的译法。
lexical_decisions:
- source_word: παλαιαὶ
  choice: 由来已久的
  rationale: 既表达这些模式久远、长期存在，也比直译为“古老的”更符合现代汉语对抽象事物的表达。
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: 围绕快乐与痛苦
  rationale: 保留 περὶ 加宾格所表示的涉及范围，不把二者之间的关系解释得过于具体。
- source_word: παθῶν
  choice: 情欲
  rationale: 本书的哲学语境所指并非一般情绪，而是需要受理性节制的感受、欲念和冲动；“情欲”保留这一较强且带哲学色彩的含义，但不局限于性欲。
- source_word: ἀκολουθίαι
  choice: 一连串
  rationale: 表达彼此相随、接续成列的意思，同时避免“后果”所暗含的明确因果关系。
theological_decisions:
- issue: πάθη 在《马加比四书》中的哲学—人论含义
  choice: 情欲
  alternative: 情感／激情
  rationale: “情感”在现代汉语中范围过宽且常为中性；“激情”又容易被理解为强烈热情。“情欲”较能表示受理性管束的非理性欲念与冲动，同时仍保留原词的张力。
- issue: ἀκολουθίαι 是否表达因果关系
  choice: 一连串
  alternative: 后果／系列
  rationale: 原词首先表示相随或接续；译文不擅自断定这些情欲是快乐与痛苦所造成的结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“快乐与痛苦”清楚对应 ἡδονή 与 πόνος；句首“此外”传达 δὲ καί 的承接和补充作用。
