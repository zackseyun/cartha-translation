  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: zh_hans
  text: 因此，论到美德，我理当赞扬那些在当时为了高尚与善德[a]而与母亲一同死去的男子；论到尊荣，我则要称他们为有福[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高尚与善德”所译的希腊词兼有高尚、良善和道德卓越之意，也可译作“美德”。
    reason: lexical_alternative
  - marker: b
    text: 原文末句十分凝缩，句法也不完整清晰；大意是：除了因他们的美德而赞扬他们，也以称他们为有福来尊荣他们。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: τῶν μὲν οὖν ἀρετῶν
  choice: 因此，论到美德
  rationale: 保留 οὖν 的承接语气，也用“论到”呈现属格主题结构；ἀρεταί 在此指值得称颂的美德或德行。
- source_word: ἐπεστί μοι ἐπαινεῖν
  choice: 我理当赞扬
  rationale: ἐπεστί μοι 表达落在说话者身上的责任或本分；“理当”比“可以”更准确，又比“我有义务”更符合庄重修辞。
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: 那些……死去的男子
  rationale: 将希腊语分词结构自然转换为汉语定语结构，并保留 ἄνδρας 明确的男性所指。
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: 在当时
  rationale: 指作者正在论述的那段时期；现代汉语用“当时”比直译“这个时候”更自然。
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: 为了高尚与善德
  rationale: καλοκἀγαθία 融合高尚、良善和道德卓越等观念；并列译法尽量保留其复合内涵，避免仅译“美德”而压平语义。
- source_word: μετὰ τῆς μητρός
  choice: 同母亲一起
  rationale: 忠实表达共同经历死亡的伴随关系；“他们的”虽可由上下文推知，却不是此短语明说的内容，故正文不补入。
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: 论到尊荣，我则要称他们为有福
  rationale: 原文结句高度凝缩且句法不整齐；译文保留“美德／尊荣”的对举，并以“称……为有福”表达 μακαρισμός 的宣称有福之意。
theological_decisions:
- issue: 殉道语境中的 καλοκἀγαθία
  choice: 高尚与善德
  alternative: 美德；德性；道德卓越
  rationale: 该词带有希腊伦理话语中高贵与良善相结合的含义；此译不把它收窄为某一后期神学术语。
- issue: ἄνδρας 的性别所指
  choice: 男子
  alternative: 人；众人
  rationale: 原文明确使用阳性复数名词，语境所指为与母亲一同受死的儿子们，因此保留男性所指。
- issue: 末句所表达的尊荣
  choice: 称他们为有福
  alternative: 以祝福尊荣他们；颂他们有福
  rationale: μακαρισμός 主要是宣称或颂说某人为有福，并不必然表示向其施行祝福；译文避免引入额外的礼仪或代祷含义。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“理当赞扬”保留序言式修辞语气；以“论到……论到……”再现原文对举。脚注标记均置于相关正文之后。
