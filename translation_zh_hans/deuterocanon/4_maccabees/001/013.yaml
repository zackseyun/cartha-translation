  text: 那么，让我们来考察：理性是否支配各种激情？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζητοῦμεν
  choice: 我们来考察一下
  rationale: 该词是第一人称复数现在时，字面可译为“我们探究”；在此论证语境中带有邀请读者共同审视问题的意味，译为“我们来考察一下”自然且保留商议语气。
- source_word: δὴ τοίνυν
  choice: 那么
  rationale: 这组语气词兼有承接和推论作用；现代汉语以“那么”自然引出下文的核心问题。
- source_word: αὐτοκράτωρ
  choice: 支配
  rationale: 原词指拥有自主权或完全权柄；与“理性”和“情欲”搭配时，“支配”准确表达掌控、作主之意，又避免过强的政治色彩。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在希腊化伦理论述中指影响或驱动人的激情、欲念等，并非仅指中性的情绪。“情欲”保留其伦理张力；加“各种”体现复数，但不限定具体类别。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 这里指理性思考或判断的能力，是全书论题的核心。“理性”简洁自然，也不把它缩减为单纯的心智或某一次推理。
theological_decisions:
- issue: λογισμός与πάθη之间的哲学人论关系
  choice: 理性能否支配各种情欲
  alternative: 理性判断是否对各种激情拥有主权
  rationale: 译文保留本节提出的开放性问题，即理性对激情和欲念是否具有统辖能力；不预先替后文作答，也不引入后期神学体系中的专门范畴。
