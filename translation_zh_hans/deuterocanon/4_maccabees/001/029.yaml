base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/029.yaml
  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
translation:
  language: zh_hans
  text: 对于其中每一项，无所不施的理性[a]都借着彻底清理、削除、编结、浇灌，并以各种方式改变，来驯服性情和情欲的原料[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无所不施的”所译的希腊语形容词十分罕见，也可译作“以各种方式发挥功效的”。它强调理性具有全面而积极的作用，并非指神性意义上的“全能”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文连续使用一组分词，带有清理、削除、编结、浇灌和改变等工艺或培育的意象。“原料”对应希腊文“质料、材料”的比喻，指性情和情欲这些可被理性整理、驯化的内在材料。
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: 其中每一样
  rationale: 保留关系代词的回指和ἕκαστος的逐一分配意味；不在本节内擅自补明其先行对象。
- source_word: ὁ πανεγώργος λογισμός
  choice: 全能劳作的理性
  rationale: λογισμός是本书论证中的核心词，指治理情欲的理性能力。罕见形容词πανεγώργος强调其无所不施的能动功效；译文保留这一不寻常的表达，并在脚注列出另一种可能理解。
- source_word: περικαθαίρων τε καὶ ἀποκνίζων
  choice: 彻底清理、削剪
  rationale: 两个分词分别表达周遍清理和削去多余部分；结合后续浇灌、移栽等动作，以栽培语境中的“削剪”自然呈现后者。
- source_word: περιπλέκων
  choice: 缠绕
  rationale: 保留围绕、编缠的具体形象，不把它抽象化为一般的“塑造”。
- source_word: ἐπάρδων
  choice: 浇灌
  rationale: 此词来自动词ἐπάρδω，意为浇水、灌溉；这里不是ἐπαίρω的“举起”。这也与整串栽培动作相吻合。
- source_word: πάντα τρόπον μεταχέων
  choice: 用各种方法移栽
  rationale: μεταχέω可指移植、移栽；在清理、削剪、缠绕、浇灌构成的园艺意象中，这一义项最贴切，同时πάντα τρόπον译为“用各种方法”。
- source_word: ἐξημεροῖ
  choice: 驯服
  rationale: 该动词表示使野性之物温顺、驯化；“驯服”保留理性控制性情与情欲的力度。
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: 性情和情欲的原材
  rationale: ὕλη本指木材、草木或构成事物的材料，此处是关于内在性情与情欲的物质性比喻。“原材”既保留材料意象，也不额外断定它们本质粗野；ἤθη与πάθη分别译作“性情”和“情欲”。
theological_decisions:
- issue: λογισμός在《马加比四书》哲学—神学论证中的译法
  choice: 理性
  alternative: 理性判断；理智
  rationale: “理性”简明保留本书所说依照敬虔治理情欲的内在能力，又不引入后世特定哲学体系的技术含义。
- issue: πάθη的伦理含义
  choice: 情欲
  alternative: 情感；激情；苦难
  rationale: 此处指受理性治理的内在冲动和感受，不是外在苦难。“情欲”能体现其驱动力，但不把它缩窄为性欲。
- issue: 整串分词的意象范围
  choice: 按园艺、栽培动作连贯翻译
  alternative: 按一般工艺动作译作洁净、削除、交织、提升、改造
  rationale: ἐπάρδων明确有“浇灌”之义，μεταχέων在此可指移栽；它们与清理、削剪、缠绕共同形成连贯的栽培图景。采用这一图景比将ἐπάρδων误作“举起”更符合希腊文证据，同时脚注说明其修辞功能。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。句中保留原文连续动作所形成的节奏，并以“浇灌、移栽”凸显希腊文的园艺意象；“其中每一样”有意保留本节对上文的回指，不擅自补出具体所指。
