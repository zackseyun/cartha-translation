revisions:
- from: 其中每一样，全能劳作的理性[a]都予以彻底清理、削剪、缠绕、浇灌，又用各种方法移栽，从而驯服性情和情欲的原材[b]。
  to: 对于其中每一项，无所不施的理性[a]都借着彻底清理、削除、编结、浇灌，并以各种方式改变，来驯服性情和情欲的原料[b]。
  rationale: 修订撤除了“移栽”这一未经原文确定的具体园艺解释，改以“以各种方式改变”保留μεταχέων及πάντα τρόπον的广度；同时以“无所不施”替换带有过强神学含义且不自然的“全能劳作的”，并将“原材”调整为自然的“原料”。分词串仍保留其具体、累积的修整与培育意象，但不把其统一化为单一园艺场景。
  reviewer_model: gpt-5.6-terra
