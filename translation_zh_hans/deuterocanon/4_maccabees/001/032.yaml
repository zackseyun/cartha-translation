  yaml_path: translation/deuterocanon/4_maccabees/001/032.yaml
  text: Among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
translation:
  language: zh_hans
  text: 在欲望中，有些属于心灵，有些属于身体；理性显然胜过这两类欲望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“理性看来胜过这两类欲望。”
    reason: φαίνεται既可表示结论显明，也可较审慎地译为“看来”；此译法保留原文可能带有的表象或推断语气。
lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: 欲望
  rationale: “欲望”涵盖面较广，既可指内在愿求，也可指身体欲求；在这里适合随后对欲望所作的分类，且不预先赋予全然负面的含义。
- source_word: ψυχικαί
  choice: 属于心灵
  rationale: 与“属于身体”形成明确对照，并保留 ψυχή 所指的非身体层面；“心灵”比“心理的”或“灵魂的”更自然，也避免把这里的哲学分类过度教义化。
- source_word: σωματικαί
  choice: 属于身体
  rationale: 直接表达 σῶμα 的身体层面，与“属于心灵”保持平行。
- source_word: λογισμός
  choice: 理性
  rationale: 本书以 λογισμός 表示作出判断并约束欲望的理性能力；“理性”简洁自然，也符合本段的哲学论述。
- source_word: ἐπικρατεῖ
  choice: 能胜过
  rationale: 该动词表示占优势、胜过或支配。“能胜过”自然表达理性对两类欲望的优势，同时不把动态意义僵化为身份性的“作主”。
- source_word: φαίνεται
  choice: 显然
  rationale: φαίνεται 可表示“看来”或“显明可见”。这里用“显然”体现作者基于论述所得的明显结论；较保守的译法见脚注。
theological_decisions:
- issue: ψυχικαί 与 σωματικαί 的人论区分
  choice: 有些欲望“属于心灵”，有些“属于身体”
  alternative: 有些是心理上的，有些是身体上的；或有些属于灵魂，有些属于肉体
  rationale: 原文是在区分欲望的两种归属，并未在本节建立完整的人论二元体系。“心灵／身体”既保留源文类别，也避免加入后来的教义框架。
- issue: λογισμός ἐπικρατεῖ φαίνεται 的语气与支配含义
  choice: 理性显然能胜过这两类欲望
  alternative: 理性看来胜过这两类欲望；或理性显然支配二者
  rationale: “胜过”保留 ἐπικρατεῖ 的占优势含义；正文以“显然”表达 φαίνεται 在论证中的显明性，同时用脚注保留其可能较为审慎的“看来”语气。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“各种欲望”自然引出分类；“这两类欲望”明确回指心灵与身体两类，避免中文中“二者”可能指心灵和身体本身的歧义。
