base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/022.yaml
  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: zh_hans
  text: 仿佛他们成了为本民族的罪所付的赎价[a]；神圣的眷顾借着那些虔诚之人的血和他们赎罪的死[b]，保全了先前遭受苦害的以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎价”所译的希腊词也可理解为“替命之物”或“以生命交换的代价”。
    reason: lexical_alternative
  - marker: b
    text: “赎罪的”所译的希腊词可指带来赎罪或平息的事物；在其他语境中，同一词族也可指“施恩座”。这里该词修饰“死”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίψυχον
  choice: 所付的赎价
  rationale: 该词指为生命而交换或补偿之物。“赎价”保留其交换、代偿的力量；加上“所付的”使现代汉语表达自然，但不进一步界定代偿机制。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 此处具有明确的道德和宗教含义；“罪”比“过错”更贴近原词的分量。
- source_word: εὐσεβῶν
  choice: 虔诚之人
  rationale: 表达这些人对上帝的敬畏与忠诚，语体庄重而不古奥。
- source_word: ἱλαστηρίου
  choice: 赎罪的
  rationale: 该形容词修饰“死”，表明他们的死具有处理罪、带来和解的祭献性效力；译作“赎罪的”既自然，也避免把原词在其他语境中的祭仪器物义硬套于此。
- source_word: θεία πρόνοια
  choice: 神圣的天意
  rationale: 保留原文以名词短语表达的神圣护理和安排，不把它直接改写成“上帝”，也不削弱其位格化作用。
- source_word: προκακωθέντα
  choice: 先前饱受苦难的
  rationale: “先前”体现前缀 προ- 的时间意义，“饱受苦难”传达被动遭害、受苦的状态。
- source_word: διέσωσεν
  choice: 保全了
  rationale: 表达使以色列安然度过危难并得以存留；较“拯救”更集中于本段所说的民族性保全。
theological_decisions:
- issue: ἀντίψυχον γεγονότας 的代偿含义
  choice: 仿佛他们成了为本民族的罪所付的赎价
  alternative: 仿佛他们成了替本民族的罪抵命之物；仿佛他们以生命偿付本民族的罪
  rationale: 原文确有交换生命、代为补偿的意味，但以“仿佛”保留作者本身的类比语气，并不说明赎价付给谁，也不规定赎罪机制。
- issue: 殉道语境中 ἱλαστηρίου θανάτου 的含义
  choice: 他们赎罪的死
  alternative: 他们使神息怒的死；他们带来和解的死
  rationale: 原文把祭献性、赎罪性的效力归于他们的死。“赎罪的死”保留这一神学张力，同时不把“平息神怒”或“洁除罪污”单独确立为唯一解释。
- issue: θεία πρόνοια 的施事表达
  choice: 神圣的天意……保全了
  alternative: 上帝的护理……保全了；上帝借此保全了
  rationale: 沿用原文抽象名词作主语的表达，避免把“天意”解释成非位格命运，也避免在正文中增添原文未明说的主语转换。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文保留“仿佛”的类比限定，并将两个主要希腊分句分为两句，以免中文句式拖沓。“本民族”对应 τὸ ἔθνος，随后保留专名“以色列”。源文开头的“ρισθῆναι”显然是上一语段残留的不完整词尾，未据此臆补正文。
