base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/017.yaml
  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: zh_hans
  text: 的确，暴君本人和他所属的全体议会，都对他们所表现的坚忍惊叹不已；正因这坚忍，他们如今侍立在神圣的宝座旁[a]，活在蒙福的永世中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“侍立在神圣的宝座前”。希腊语动词和与格结构既可表示在宝座面前侍立，也可表示站在宝座近旁。
    reason: lexical_alternative
  - marker: b
    text: 直译“活那蒙福的世代”；这里很可能指蒙福的永恒境况。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  choice: 的确，连……本人
  rationale: 用“的确”表达语气词组合的强调作用，并以“本人”保留对暴君亲自惊叹这一点的突出。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 本书对安条克的刻画带有鲜明贬义；“暴君”比中性的“君王”或“统治者”更符合语境。
- source_word: συνέδριον
  choice: 议会
  rationale: 指暴君身边集会审议或裁断事务的团体；“议会”庄重清楚，又不把其制度性质规定得过细。
- source_word: ἐξεθαύμασαν
  choice: 惊叹不已
  rationale: 该动词表示强烈的惊异；这一译法既传达程度，也符合现代汉语表达。
- source_word: ὑπομονήν
  choice: 坚忍
  rationale: 在殉道受苦的语境中，指承受苦难而不动摇的持守；“坚忍”比单纯“忍耐”更能体现其坚定性。
- source_word: διʼ ἣν
  choice: 正因这坚忍
  rationale: 关系代词回指前面的“坚忍”，并表达后文蒙福景况与之相关的因果关系。
- source_word: τῷ θείῳ ... θρόνῳ
  choice: 神圣的宝座
  rationale: θείῳ是形容词，直指宝座的神圣属性；不直接改译为“神的宝座”，以免比希腊文说得更明确。
- source_word: παρεστήκασιν
  choice: 侍立在……旁
  rationale: 完成时表达已经站定并持续在场的状态；“侍立”体现临近宝座、在其尊前服侍或等候的场景，“旁”保留与格结构可表达的近旁含义。
- source_word: τὸν μακάριον ... αἰῶνα
  choice: 那蒙福的世代
  rationale: 尽量保留αἰών的“世代、时代”意象，不在正文中直接将其教义化为“永恒”；脚注说明其在此很可能指蒙福的永恒境况。
- source_word: βιοῦσιν
  choice: 活在……中
  rationale: 直接表达“生活、活着”的基本词义，并以现代汉语可理解的结构与“世代”搭配。
theological_decisions:
- issue: 殉道者死后所得赏赐的性质
  choice: 译为他们“如今”侍立在神圣宝座旁，并活在蒙福的世代中
  alternative: 明确译作他们在神的宝座前享受永恒福乐
  rationale: 希腊文以“如今”和现在状态性的动词描绘他们已得伸冤与尊荣，但没有进一步系统说明死后状态；译文保留这种即时而又未完全界定的末世图景。
- issue: 殉道者相对于宝座的位置
  choice: 宝座旁
  alternative: 宝座前
  rationale: παρίστημι配与格可表示站在近旁，也可表示来到某者面前侍立；正文采用“旁”，脚注保留“前”的真实可能性，不把空间或礼仪关系定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“惊叹不已”使强烈语气自然可感；“坚忍”“侍立”保留殉道叙事的肃穆感。正文不把宝座位置和αἰών的含义解释得过死，而以脚注呈现原文的词义幅度。
