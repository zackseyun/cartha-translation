  text: 'For it would indeed have been fitting to inscribe even these words on his very tombstone, spoken as a memorial for those of the nation:'
translation:
  language: zh_hans
  text: 因为，连把这些为本族人留作纪念而说的话铭刻在墓碑本身[a]上，也实在是合宜的：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “墓碑”或译“墓志铭”。希腊语ἐπιτάφιον既可指墓上的题铭，也可指承载题铭的墓碑或纪念物。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……实在
  rationale: γάρ承接上文，表示解释或论证；καί在此加强语气。汉语以“因为”并配合“实在”自然传达这种承接和强调。
- source_word: ἄξιον ἦν
  choice: 是合宜的
  rationale: 这是无人称表达，指某事适当、相称；“合宜”既准确又符合庄重语体，不必译成较生硬的“是配得的”。
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  choice: 在墓碑本身上
  rationale: ἐπιτάφιον可指墓上题铭，也可指承载题铭的墓碑或纪念物；因与ἀναγράψαι“铭刻”连用，正文采用具体而自然的“墓碑”，并以“本身”体现αὐτοῦ τοῦ的强调结构。
- source_word: ἀναγράψαι
  choice: 铭刻
  rationale: 该动词有公开记载、题写之意；在墓葬语境中，“铭刻”最贴切。
- source_word: καὶ ταῦτα
  choice: 也……这些……话
  rationale: καί表示“也”，ταῦτα前指或后指所引内容；结合λεγόμενα，汉语补出“话”以使所指清楚。
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: 为本族人
  rationale: 字面为“那些出自/属于这民族的人”。此处指该民族的成员；“本族人”简洁保留民族共同体含义，又不直接增添原文没有明说的族名。
- source_word: εἰς μνείαν
  choice: 留作纪念
  rationale: 该介词短语表达目的，“留作纪念”自然体现纪念、存念的作用。
- source_word: λεγόμενα
  choice: 而说的话
  rationale: 保留现在时被动分词的言说含义，并使其在汉语中自然修饰“这些……话”。
