  text: For Moses says[b][a], “And all the holy ones are under your hands.”
translation:
  language: zh_hans
  text: 因为摩西也说：“所有蒙分别为圣的人，都在你的双手之下。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙分别为圣的人”也可译作“成圣的人”或“圣者”；“在你的双手之下”这一意象可表示处于上帝的权能、看顾或管辖之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: 说
  rationale: 希腊文用现在时引介经文；现代汉语引用既有权威文本时自然译作“说”。
- source_word: ἡγιασμένοι
  choice: 被分别为圣的人
  rationale: 这是ἁγιάζω的完成时被动分词，表示已经被使之成为圣洁、被分别出来的人；此译保留被动与结果意味。
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: 在你双手之下
  rationale: 保留原文复数“手”和“在……之下”的具体意象，不把其中可能包含的权能、看顾或管辖之意直接释义进正文。
- source_word: καὶ γάρ
  choice: 因为……也
  rationale: γάρ承接上文给出根据，καί带有附加意味；“因为……也”自然保留两者的语篇功能。
theological_decisions:
- issue: 摩西引文中“在你双手之下”的含义
  choice: 按直接引文保留具体意象
  alternative: 释作“都在你的权能／看顾之下”
  rationale: 该短语可能涉及权能、保护或管辖，正文不应擅自限定其中一种解释。
- issue: οἱ ἡγιασμένοι所指之人的状态
  choice: 译作“被分别为圣的人”
  alternative: 译作“圣者”或“圣洁的人”
  rationale: 原文为完成时被动分词，重点不仅是其圣洁身份，也包括他们已经被使之成圣、分别出来的状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“双手”明确反映希腊文复数；引号内保留引文开头的“所有”。
