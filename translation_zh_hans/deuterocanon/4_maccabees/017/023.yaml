review_pass:
  verdict: revise
  source_fidelity: 译文前半准确传达了πρὸς γὰρ、ἀφιδών、ἀνδρία、ἀρετή、ἐν ταῖς βασάνοις及ὑπομονή。末句原文现存句法中，τοὺς στρατιώτας αὐτοῦ为宾格，直接译成“向自己的士兵宣告”将其处理成间接受事，主要随从了英文审校文本，未充分保留希腊文的句法关系。将其译为“公开宣示自己的士兵当……”可较好保留该宾格与“榜样”结构之间在现存文本中的不甚寻常关系，而不擅自解决其解释困难。
  naturalness: “刚勇、美德、在酷刑中的坚忍”庄重且通顺；修订后“公开宣示自己的士兵当以……为榜样”在现代书面汉语中自然，也比“向……宣告，要以……”更贴近原文结构。
  terminology: “暴君安条克”“美德”“酷刑”“坚忍”“士兵”均恰当。两次ὑπομονή均保留为“坚忍”。“刚勇”可作为庄重的主文译法；脚注适当地说明ἀνδρία的男性化语义色彩，而不将该色彩错误地等同于现代性别角色观念。
  issues:
  - severity: medium
    issue: 末句把“自己的士兵”（τοὺς στρατιώτας αὐτοῦ，宾格）译作“向自己的士兵”，即间接受事。
    rationale: 现存希腊文的构句本身不寻常，英文审校轨迹将其流畅化为“向士兵宣告”。中文不宜在无标注的情况下完全改写这一句法关系；应以较贴近原文的表达保留其解释张力。
  revised_text: 因为暴君安条克看到他们的刚勇[a]、美德，以及他们在酷刑中的坚忍，就公开宣示自己的士兵当以他们的坚忍为榜样。
  revised_footnotes:
  - marker: a
    text: “刚勇”所译的希腊词带有“男子般的勇气、勇武”之意；也可译作“勇气”或“英勇”。
    reason: 保留ἀνδρία在希腊文中的性别色彩，并列出自然的译法。
  revision_rationale: 仅修订末句，以避免将原文宾格“自己的士兵”直接改作“向自己的士兵”。现存希腊文在此的关系并不完全平顺；修订采用“宣示……当以……”来尽量保留其结构与含义，不依照英文审校文本过度消解歧义。其余措辞和脚注均可保留。
