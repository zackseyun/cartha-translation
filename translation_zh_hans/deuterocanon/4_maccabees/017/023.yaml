  yaml_path: translation/deuterocanon/4_maccabees/017/023.yaml
  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
translation:
  language: zh_hans
  text: 因为暴君安条克看到他们的刚勇[a]、美德和在酷刑中的坚忍，就向自己的士兵宣告，要以他们的坚忍为榜样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刚勇”所译的希腊词带有“男子般的勇气、勇武”之意；也可译作“勇气”或“英勇”。
    reason: 保留ἀνδρία在希腊文中的性别色彩，并列出自然的译法。
lexical_decisions:
- source_word: ἀνδρίαν
  choice: 刚勇
  rationale: 该词指勇敢、刚毅，且在希腊文中带有“男子般勇武”的性别色彩。“刚勇”在现代汉语中自然庄重，并比单纯的“勇气”更能保留其刚健意味；具体性别内涵在脚注说明。
- source_word: ἀρετὴν
  choice: 美德
  rationale: 此处指道德上的卓越与高尚品格；“美德”简明自然，符合本段伦理赞誉的语境。
- source_word: βασάνοις
  choice: 酷刑
  rationale: 在殉道受难的上下文中，该词指人为施加的严酷折磨，而非一般的考验。
- source_word: ὑπομονὴν
  choice: 坚忍
  rationale: 该词表示在苦难之下坚定持守、忍耐到底；“坚忍”兼具忍受与不屈的含义，并在两处保持同一译法。
- source_word: ἀφιδὼν
  choice: 看到
  rationale: 该分词表示看见或注意到；译作“看到”符合现代汉语叙述习惯，又不增添原文没有的解释。
- source_word: ἀνεκήρυξεν
  choice: 宣告
  rationale: 该动词具有公开宣布、郑重宣示的意味；“宣告”保留其正式语气。
- source_word: ὑπόδειγμα
  choice: 榜样
  rationale: 该词指供人仿效的范例或典范；在对士兵讲话的语境中，“榜样”自然准确。
- source_word: στρατιώτας
  choice: 士兵
  rationale: 直接指安条克统属的军人；“士兵”是清楚而常用的现代汉语表达。
theological_decisions:
- issue: ἀνδρία所含的性别色彩
  choice: 正文译作“刚勇”，并以脚注说明其“男子般的勇气”含义
  alternative: 男子气概；勇气；英勇
  rationale: 原词在希腊伦理话语中带有男子勇武的色彩，但直译“男子气概”在本句中容易使现代读者误解为外表或性别角色。“刚勇”保留刚健勇毅的意味，脚注则明确原词真实存在的性别内涵，不将其静默中性化，也不引入额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“暴君安条克”保留原文称谓；两处ὑπομονή均译作“坚忍”，使安条克所观察到的品格与他树为榜样的品格彼此照应。句末用“要以……为榜样”自然表达εἰς ὑπόδειγμα的目的或结果关系。
