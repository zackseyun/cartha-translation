  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: zh_hans
  text: 暴君仍在抗争[a]；但世界和人类的生活都在观看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“暴君在抗争”。抗争的对象没有明说；从上下文看，是指那些殉道者。
    reason: 说明原文省略的对抗对象，并保留未完成时态所表达的持续动作。
lexical_decisions:
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 保留 τύραννος 在此处对残暴统治者的明确贬义，且符合现代汉语常用表达。
- source_word: ἀντηγωνίζετο
  choice: 仍在抗争
  rationale: 未完成时态表达持续进行的争斗；ἀντί 所含的对抗意味由“抗争”体现。希腊文未明说抗争对象，因此正文不补出“他们”，以免消除原文的省略；脚注交代语境。
- source_word: ὁ δὲ κόσμος
  choice: 但全世界
  rationale: δέ 在两幅场景之间形成对照，用“但”自然体现转折；κόσμος 在这里指作为见证者的世界整体，用“全世界”保留拟人化形象。
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: 全人类的生活
  rationale: 较为贴近该属格结构，并保留 βίος 所指的人类生活、生存境况这一宽泛而近乎拟人化的意义；不将其抽象化为“人类社会”。
- source_word: ἐθεώρει
  choice: 都在注视着
  rationale: 未完成时态表示持续观看；“注视着”既保留公开观望的意味，也与句中拟人化主语相配。“都”使两个并列主语在现代汉语中衔接自然。
theological_decisions:
- issue: “全世界”和“全人类的生活”被写成观看者的拟人化意象
  choice: 在正文中保留二者作为主语，共同“注视着”
  alternative: 解释性地译为“整个人类世界都在观看”
  rationale: 原文有意把这场殉难描绘为世界与人类生活共同目睹的公开场景；保留张力和修辞，不进一步发展为特定的宇宙论主张。
- issue: ἀντηγωνίζετο 的对抗对象未明说
  choice: 正文不补“他们”，以脚注说明上下文所暗示的对象
  alternative: 译作“仍在与他们抗争”
  rationale: 上下文虽指向殉道者，但原句保持对象省略。正文保留这一真实的语法含混，脚注则帮助普通读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“暴君”保留道德贬义；分号对应两个并置而对照的画面。正文中的脚注标记[a]与脚注完全对应。
