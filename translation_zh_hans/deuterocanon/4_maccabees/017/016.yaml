  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
translation:
  language: zh_hans
  text: 有谁不赞叹真理之律法的竞技者[a]？有谁不惊叹呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真实的律法的竞技者。”希腊语“真理之律法”也可理解为以“真实”描述这律法。
    reason: 保留 τῆς ἀληθείας νομοθεσίας 可能具有的属格或形容性质两种理解。
lexical_decisions:
- source_word: τίνες οὐκ
  choice: 有谁不
  rationale: 重复的反问句具有普遍涵盖的语气；“有谁不……”既符合现代汉语习惯，也保留原文的修辞力量。
- source_word: ἐθαύμασαν
  choice: 赞叹
  rationale: 该词兼有惊奇与钦佩之意；“赞叹”适合此处对殉道者的褒扬，并与下句更强烈的“惊叹”有所区别。
- source_word: ἀθλητάς
  choice: 奋力竞赛的人
  rationale: 原词指竞技者。译文保留竞技意象，同时避免将其解释成军事性的“战士”或仅表荣誉的“英雄”。
- source_word: νομοθεσίας
  choice: 律法
  rationale: 该词可指立法、律法的颁布或由此形成的律法秩序；本句所指是这些人忠守的神圣律法，用“律法”最自然，也不使表达带上现代行政色彩。
- source_word: ἀληθείας
  choice: 真理
  rationale: 保留其抽象名词形式及道德—神学分量，不直接将其消解为形容词“真实的”。
- source_word: τῆς ἀληθείας νομοθεσίας
  choice: 真理之律法
  rationale: 这一表达尽量保留希腊语属格结构及其庄重语气，同时以脚注说明也可理解为对律法性质的描述。
- source_word: ἐξεπλάγησαν
  choice: 惊叹
  rationale: 该动词表示受到强烈震动、十分惊异；“惊叹”既传达强化的惊异，也与上句形成整齐的修辞平行。
theological_decisions:
- issue: 殉道者被称为 ἀθλητάς 的竞技比喻
  choice: 译作“奋力竞赛的人”，明确保留竞技意象。
  alternative: 译作“勇士”“英雄”或“斗士”。
  rationale: 作者借竞技来描写他们为忠于律法而忍耐争战；保留这一比喻，可避免加入军事色彩或仅作荣誉性概括。
- issue: τῆς ἀληθείας νομοθεσίας 中属格关系的理解
  choice: 正文译作“真理之律法”。
  alternative: 译作“真实的律法”。
  rationale: 希腊语既可按属格表达理解为“真理之律法”，也可能是在说明律法具有真实的性质。正文保留较形式对应的结构，脚注呈现另一种合理理解，不把歧义强行定解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“有谁不……”保留原文连续反问的节奏；“奋力竞赛的人”使竞技隐喻清楚，又避免生硬的“运动员”造成现代体育语境的误导。
