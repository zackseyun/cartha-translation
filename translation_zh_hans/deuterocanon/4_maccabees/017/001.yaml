  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: zh_hans
  text: 有几个卫兵也说，当她自己也快要被抓去处死时，为了不让他们碰到她身体的任何部位，她就纵身投到柴火堆上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫兵”原文直译为“持矛者”，常指君王的护卫。整件事是几个卫兵所作的报告，并非叙述者未加限定的直接陈述。
    reason: lexical_alternative
lexical_decisions:
- source_word: δορυφόρων
  choice: 卫兵
  rationale: 该词本义为“持矛者”，常指君王身边的护卫；“卫兵”在现代汉语中自然，也不必把上下文隐含的“王的”补入正文。
- source_word: συλλαμβάνεσθαι πρὸς θάνατον
  choice: 被抓去处死
  rationale: 兼顾被动的“抓住、拘拿”和 πρὸς θάνατον 所指向的死亡结局；比“逮捕”少现代司法色彩，也比直译“为死亡”自然。
- source_word: ψαύσειέν τι τοῦ σώματος αὐτῆς
  choice: 碰到她身体的任何部位
  rationale: 保留 ψαύω 的身体接触含义，并自然表达希腊文部分属格结构所强调的“任何一处”。
- source_word: ἑαυτὴν ἔρριψεν
  choice: 她便纵身扑向
  rationale: 表达动作由她主动实施且迅猛；“纵身扑向”比机械直译“把自己扔向”更符合现代汉语。
- source_word: κατὰ τῆς πυρᾶς
  choice: 扑向柴堆
  rationale: πυρά 指供焚烧用的柴堆或火葬堆；此处不径译为泛指的“火”，而“扑向”也保留 κατά 加属格可能带有的冲向、落在其上的动态感。
theological_decisions:
- issue: 母亲最后行动的叙事身份
  choice: 明确译成几个卫兵所作的报告，而非叙述者无保留的直接断言
  alternative: 把她扑向柴堆直接写成客观叙事事实
  rationale: ἔλεγον……τινὲς 明确限定信息来源为“有几个人说”；译文保留这种叙事距离，不裁定报告的历史性质。
- issue: 主动扑向柴堆的暴力与伦理张力
  choice: 按原文直陈她为避免身体被触碰而主动纵身扑向柴堆
  alternative: 以委婉措辞淡化其主动性或暴力程度
  rationale: 原文用反身代词和 ἔρριψεν 鲜明表达主动动作；译文不因潜在伦理或神学顾虑而弱化它。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被抓去处死”清楚呈现暴力处境；“纵身扑向柴堆”保留动作力度。“柴堆”较“火刑堆”少作解释性限定，也比单说“火”更贴近 πυρά。脚注标记置于整句末，涵盖词义及报道框架。
