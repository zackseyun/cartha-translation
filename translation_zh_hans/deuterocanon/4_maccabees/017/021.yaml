  text: and that the tyrant should be punished and the homeland purified.
translation:
  language: zh_hans
  text: 也使那暴君受到惩罚，并使祖国得以洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: 那暴君
  rationale: 此词在上下文中指迫害忠信者的残暴统治者；“暴君”自然、直接，并保留原文的政治与道德力度。定冠词结合语境译为“那”。
- source_word: τιμωρηθῆναι
  choice: 受到惩罚
  rationale: 不定过去时被动不定式表达与下一个不定式并列的结果或内容；“受到惩罚”保留被动意义，也不擅自强化为“遭到报复”。
- source_word: πατρίδα
  choice: 祖国
  rationale: πατρίς指祖先之地、故国或本国；“祖国”在现代汉语中庄重自然，并保留其家国关联。
- source_word: καθαρισθῆναι
  choice: 得到洁净
  rationale: 被动不定式表示被清除污秽、成为洁净；“得到洁净”既可涵盖礼仪、道德和群体层面的意义，又避免只解释为政治上的肃清。
- source_word: καὶ ... καὶ
  choice: 并使……，使……
  rationale: 两个καὶ连接平行结果。汉语用前一“并使”和后一“使”构成紧凑、自然的并列结构，同时显示本句承接上文。
theological_decisions:
- issue: 祖国“洁净”的具体含义
  choice: 采用“祖国得到洁净”，保留礼仪、道德、群体及土地层面的宽广含义
  alternative: 译作“祖国被清除污秽”或“国民得到洁净”，分别偏重除污或人民群体
  rationale: 原文只说πατρίδα καθαρισθῆναι，并未限定洁净的对象仅为土地、人民或宗教礼仪；宽泛译法可保留其神学与象征张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“并”保留本节作为前文延续成分的句法特征；两处“使”清楚呈现两个并列的被动结果。
