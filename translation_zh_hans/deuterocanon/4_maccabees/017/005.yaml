base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: zh_hans
  text: 月亮与众星在天上显得庄严，也不及你；你引导[a]七个堪比星辰的儿子走向敬虔，在上帝面前得享尊荣，并与他们一同被安置在天上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “引导”所译的希腊词也可译作“照亮”或“引向光明”。
    reason: lexical_alternative
  - marker: b
    text: “天上”也可理解为“天空中”；这里既承接月亮和众星的意象，也可能指她与儿子们所得的属天尊荣。
    reason: alternative_reading
lexical_decisions:
- source_word: σεμνὴ καθεστήκεν
  choice: 显得庄严
  rationale: 保留月亮庄严、尊贵的形象，并以现代汉语自然表达其处于这种状态的完成时意义。
- source_word: ἰσαστέρους
  choice: 如星辰般
  rationale: 该复合形容词意为“与星辰相等、堪比星辰”；此译简明地保留比较意象，而不误解为数量相等。
- source_word: παῖδας
  choice: 儿子
  rationale: 上下文明确指这位母亲的七个男性后代。
- source_word: φωταγωγήσασα
  choice: 引导
  rationale: 该词可指“以光引导、领向光明”或“照亮”。正文采用自然的“引导”，同时由“如星辰般”的语境保留光明意象，并在脚注列出较直译的可能。
- source_word: πρὸς τὴν εὐσέβειαν
  choice: 走向敬虔
  rationale: εὐσέβεια在本书中指向上帝的虔敬及由此表现出的忠贞顺服；“敬虔”保留其宗教含义。
- source_word: ἔντιμος καθεστήκας θεῷ
  choice: 在上帝面前得了尊荣
  rationale: 表达她在上帝看来处于受尊崇的地位，同时避免把καθίστημι具体化为未经文本明说的任命。
- source_word: ἐστήρισαι
  choice: 被安置
  rationale: 中间/被动形式表示她被确立、安置于稳固的位置；“被安置”比“站立”更能传达动作的受动性。
- source_word: ἐν οὐρανῷ
  choice: 在天上
  rationale: 中文“天上”既能承接月亮众星所在的天空，也可在末句表达属天领域，从而保留希腊词在修辞中的双重可能。
theological_decisions:
- issue: 末句ἐν οὐρανῷ指可见的天空还是属天领域
  choice: 在天上
  alternative: 在天空中
  rationale: “天上”在现代汉语中可兼指天空与属天领域，既契合星月比喻，也不把殉道者得尊荣的末世含义解释得过死。
- issue: 末句是否明确宣称母亲已经进入天堂
  choice: 与他们一同被安置在天上
  alternative: 与他们一同在天空中被坚立
  rationale: 按原文保留受动的“安置/坚立”及地点表达，不额外加入“死后”“升天”等原文没有的说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“也不及你”的比较句重现οὐχ οὕτω…ὡς的修辞结构；避免生硬照搬希腊语词序，同时保留星月、光明、敬虔和属天尊荣之间的联系。
