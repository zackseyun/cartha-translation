  text: For your childbearing was from Abraham the child[a].
translation:
  language: zh_hans
  text: 因为你生儿育女，是出于亚伯拉罕这位仆人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译“孩子”。希腊词παῖς可指“孩子”或“仆人”；此处译作“仆人”较可能是尊称性的用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦ γὰρ
  choice: 因为……确实
  rationale: γάρ表明解释或理由，译作“因为”；ἦ在此宜视为强调语气词，译作“确实”，而非英语审校层所假定的系词过去时。
- source_word: ἡ παιδοποιία σου
  choice: 你所生的子女
  rationale: παιδοποιία指生育、繁衍子女。按字面可译“你的生育”，但现代汉语在这里用“你所生的子女”更自然，也更契合上下文对母亲及其儿女的称述。
- source_word: ἀπὸ
  choice: 源自
  rationale: 此处表示来源或世系，“源自”比单用“从”更清楚地传达血统可追溯至亚伯拉罕。
- source_word: Ἀβραὰμ τοῦ παιδός
  choice: 亚伯拉罕这位仆人
  rationale: παῖς可指孩子，也可指仆人；用于亚伯拉罕时，“仆人”较符合犹太敬虔语言中尊称上帝之仆的用法，但以脚注保留词义上的另一可能。
theological_decisions:
- issue: παῖς用于亚伯拉罕时的含义
  choice: 仆人
  alternative: 孩子；奴仆
  rationale: “仆人”最能体现这里可能具有的尊称意味，又不把重点放在受奴役的社会身份上。由于原词确有“孩子”之义，正文不应掩盖这一歧义，故在脚注中注明。
- issue: 仆人的所属关系
  choice: 不在正文补出“上帝的”
  alternative: 上帝的仆人亚伯拉罕
  rationale: 敬虔语境很可能意指上帝的仆人，但希腊文本没有明说所属关系；正文保留其含蓄性，避免把解释直接写入经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你所生的子女”避免“你的生育”在汉语中的抽象和生硬；“源自”清楚表达世系来源。正文保留παῖς的主要语境义，并以脚注呈现真实的词义歧义。
