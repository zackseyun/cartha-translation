base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/012.yaml
  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: zh_hans
  text: 因为那时，美德为那些在忍耐中经受考验的人主持竞赛；胜利在于不朽[a]，在于长久的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不败坏”。“长久的生命”按上下文也可理解为“永恒的生命”；希腊文直译为“历时长久的生命”，并未使用通常表示“永恒”的词，但它与“不朽”并列，可能带有永恒的含义。
    reason: 说明ἀφθαρσία可译为“不败坏”，并保留ζωῇ πολυχρονίῳ在其上下文中可能具有的永恒性理解，同时避免将其作为直接词义。
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: 主持竞赛
  rationale: 该动词源于竞技语境，指担任竞赛主持者或裁定者；“主持竞赛”既保留拟人化和竞技意象，也避免误解为单纯颁奖。
- source_word: ἀρετή
  choice: 美德
  rationale: 本书以此词表示道德上的卓越，并在本句中将其拟人化；“美德”是现代汉语中自然且稳定的对应词。
- source_word: διʼ ὑπομονῆς
  choice: 借着忍耐
  rationale: 保留 διά 的途径或方式含义，也表达在苦难考验中坚忍承受之意。
- source_word: δοκιμάζουσι
  choice: 经受考验的人
  rationale: 该形式在这里指正处于试炼中的人；结合殉道受刑的语境，用“经受考验”自然地表达被试验的含义，而不强调自我证明。
- source_word: τὸ νῖκος
  choice: 胜利
  rationale: 直接延续前半句的竞技意象，简洁对应希腊文。
- source_word: ἐν ἀφθαρσίᾳ
  choice: 在于不朽
  rationale: ἀφθαρσία可指不朽、不败坏；“不朽”在现代汉语中自然，并能表达胜利所体现的生命状态，同时不把词义限缩为肉体不死。
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: 在于长久的生命
  rationale: πολυχρόνιος字面指历时长久，并非通常表示“永恒”的专门词；“长久的生命”保留原文措辞及其可能开放的时间幅度。
theological_decisions:
- issue: ζωῇ πολυχρονίῳ是否应直接译成带有更明确末世论含义的“永生”
  choice: 长久的生命
  alternative: 永恒的生命（永生）
  rationale: 原文直指持续长久的生命，并未使用通常表示“永恒”的词。主文不强化为明确的教义术语，但相邻的“不朽”使永恒含义成为合理理解，故列入脚注。
- issue: ἀφθαρσία应译为“不朽”还是“不败坏”
  choice: 不朽
  alternative: 不败坏
  rationale: 在殉道者得胜及长久生命的语境中，“不朽”更自然地传达生命不受朽坏辖制的状态；同时保留该词并不必然等同于后世某一套具体教义表述。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“美德”保持原文拟人化；“主持竞赛—胜利”保留贯穿全句的竞技比喻。分号对应两个紧密关联而结构独立的分句。
