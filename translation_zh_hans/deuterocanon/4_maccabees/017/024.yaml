  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: zh_hans
  text: 它使他们在步战[a]和围城战中高尚而勇敢；攻破之后[b][c]，他战胜了所有敌人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “步战”直译为“徒步作战”；这里也可理解为步兵作战。
    reason: lexical_alternative
  - marker: b
    text: “攻破”也可译作“洗劫”或“摧毁”，这个希腊词常以城邑或堡垒为对象。
    reason: lexical_alternative
  - marker: c
    text: 原文在这里没有明说所攻破的对象，并且主语表达十分紧缩；译文没有从上下文补明。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: 使……显得
  rationale: 这里ἔχω带双宾语及表语形容词，具有使役或结果意味；译作“使……显得”既自然，也避免过度断定这种品格是新近产生的。
- source_word: γενναίους
  choice: 高尚
  rationale: γενναῖος可指品格高贵，也可指英勇；因后面的ἀνδρείους已表达勇气，此处保留品格层面的区别。
- source_word: ἀνδρείους
  choice: 勇敢
  rationale: 表达军事语境中的胆量和英勇，同时避免直译成带明显性别色彩的“有男子气概”。
- source_word: εἰς πεζομαχίαν
  choice: 在步战中
  rationale: πεζομαχία字面指徒步作战；“步战”简洁、准确，不将其限缩为近身肉搏。
- source_word: πολιορκίαν
  choice: 围城战
  rationale: 该词指围攻或围城作战，与“步战”构成自然的军事并列。
- source_word: ἐκπορθήσας
  choice: 攻破之后
  rationale: ἐκπορθέω指攻陷、洗劫或毁坏城邑、堡垒等；原文未明说宾语，中文采用可省略宾语的“攻破”，不擅自补出“城邑”或“他们”。
- source_word: ἐνίκησεν
  choice: 战胜了
  rationale: νικάω意为战胜、击败；“战胜”符合庄重的军事语域。
- source_word: πάντας τοὺς πολεμίους
  choice: 所有敌人
  rationale: 忠实保留“所有”和定冠词所指的敌对群体，不补入原文没有的领属词“他的”。
theological_decisions:
- issue: ἔσχεν的隐含主语及随后阳性单数分词、动词的主语转换
  choice: 前半句用中性代词“它”，后半句保留“他”，不明确二者所指
  alternative: 根据上下文统一补作“理性”“母亲”或其他明确主语
  rationale: 希腊文在此高度压缩，ἔσχεν的主语未在本句明说，随后又出现阳性单数的ἐκπορθήσας和ἐνίκησεν。译文保留这种突转和张力，不把上下文推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“步战”和“围城战”保持军事语域；分号呈现原文后半句突转。所有脚注标记均置于相关正文之后。
