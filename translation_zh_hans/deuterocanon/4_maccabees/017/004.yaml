base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/004.yaml
  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: zh_hans
  text: 所以，心灵圣洁的母亲啊[a]，要鼓起勇气，以刚毅之心向着上帝怀有忍耐的盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵圣洁的”也可译作“有圣洁心灵的”。希腊语ἱερόψυχε是一个紧凑的复合形容词，形容人的内在生命具有神圣、圣洁的品格。
    reason: 说明罕见复合词的构词含义及可行译法。
lexical_decisions:
- source_word: θάρρει
  choice: 要鼓起勇气
  rationale: 保留命令语气及劝勉人勇敢振作的含义；现代汉语自然清楚。
- source_word: τοιγαροῦν
  choice: 所以
  rationale: 表达根据上文所得出的结论，比“因此”稍口语化而仍庄重。
- source_word: μῆτηρ
  choice: 母亲啊
  rationale: 以呼语助词“啊”自然呈现希腊语直接称呼。
- source_word: ἱερόψυχε
  choice: 心灵圣洁的
  rationale: 这个复合形容词由表示神圣的成分与“灵魂、心灵”构成；译文保留其宗教色彩和对内在品格的称赞。
- source_word: ἐλπίδα
  choice: 盼望
  rationale: 符合此处积极期待的通常含义，也适合庄重的宗教语境。
- source_word: ὑπομονῆς
  choice: 忍耐的
  rationale: 在殉道语境中指承受苦难、坚忍不屈；保留属格关系，不把它明确解释成盼望的来源或结果。
- source_word: γενναίως
  choice: 以刚毅之心
  rationale: 兼顾该副词所含的勇敢与高尚、刚强之意，又避免与前面的“鼓起勇气”机械重复。
- source_word: ἔχουσα
  choice: 怀有
  rationale: 贴近ἔχω“有、持有”的基本义；不额外加入原文没有明说的“紧紧持守”。
- source_word: πρὸς θεόν
  choice: 向着上帝
  rationale: 保留πρός加宾格所表达的方向和取向，不擅自改成更具解释性的“信靠上帝”或“在上帝里面”。
theological_decisions:
- issue: ἱερόψυχε对母亲内在品格的描述
  choice: 心灵圣洁的母亲
  alternative: 圣心的母亲；灵魂高尚的母亲
  rationale: “心灵圣洁”既保留ἱερο-的神圣、圣洁色彩，也清楚表明该复合词是在描述母亲本人；“高尚”会淡化宗教意味。
- issue: πρὸς θεόν的关系与取向
  choice: 向着上帝怀有忍耐的盼望
  alternative: 在上帝里面怀有盼望；在上帝面前忍耐
  rationale: 原文表达朝向上帝的取向，但没有明确采用“在上帝里面”的信仰公式，也未必只修饰“忍耐”；译文保留其开放性。
- issue: ἐλπίδα τῆς ὑπομονῆς的属格关系
  choice: 忍耐的盼望
  alternative: 因忍耐而生的盼望；对忍耐到底的盼望
  rationale: 希腊语属格可表达关联、性质或来源；直译式的自然短语避免把关系限定为来源或目标，保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以刚毅之心”保持殉道劝勉的崇高语气；句子不使用古奥文言。脚注标记紧随其实际说明的“心灵圣洁的母亲”之后。
