base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: zh_hans
  text: 母亲啊，你和七个孩子一起，摧毁了暴君的强暴，挫败了他的邪恶图谋，并显明了信仰的崇高[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“信仰的勇毅”；这里的希腊语也可能强调忠贞所显出的高贵或勇毅。
    reason: γενναιότης可表示高贵、崇高或勇毅，而πίστις在本语境中也可侧重忠贞。
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: 母亲啊
  rationale: 保留呼格与颂赞式感叹语气，同时采用现代汉语中自然、庄重的表达。
- source_word: σὺν ἑπτὰ παισίν
  choice: 同七个孩子一道
  rationale: παῖς本义可指孩子，也可按语境指儿子；正文采用较宽泛的“孩子”，不超出该短语本身，并以“一道”表达共同参与。
- source_word: καταλύσασα
  choice: 摧毁了
  rationale: 该词表示拆毁、瓦解或推翻；“摧毁”能体现使暴君的强暴失去效力的强烈语势。
- source_word: τὴν τοῦ τυράννου βίαν
  choice: 暴君的强暴
  rationale: βία兼有强力、暴力之意；“强暴”在此指暴君施加的残酷强力，并与上下文的压迫情境相合。
- source_word: ἀκυρώσασα
  choice: 挫败了
  rationale: 原词意为使之无效、作废；用于图谋时，“挫败”是自然的现代汉语表达。
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: 他的邪恶图谋
  rationale: ἐπινοία可指构想、计谋或设计；“图谋”传达敌意筹划的含义，“邪恶”直接对应κακάς。
- source_word: ἐπιδείξασα
  choice: 彰显了
  rationale: 该词表示公开显明或展示；“彰显”符合本节颂赞性的庄重语域。
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: 信仰的高贵品格
  rationale: γενναιότης可指高贵、高尚或勇毅；正文以“高贵品格”表达其道德卓越，同时保留属格结构所容许的张力，其他理解列入脚注。
theological_decisions:
- issue: πίστις的译法
  choice: 信仰
  alternative: 忠贞；信实
  rationale: 此处所说的是受迫害时坚定不移的宗教委身。“信仰”最适合作为正文译法，但πίστις也可能侧重忠贞或信实，因此不在正文中排除该层含义。
- issue: τῆς πίστεως γενναιότητα的关系
  choice: 信仰的高贵品格
  alternative: 信仰的勇毅；忠贞所显出的高贵或勇毅
  rationale: 希腊语属格可以强调由信仰显出的高贵，也可侧重忠贞委身本身的勇毅。正文保留较凝练的结构，脚注说明语义范围，避免把这一张力单一定义。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。保留原文以呼格起首、随后用并列动作称颂母亲的修辞结构；“母亲啊”体现感叹而不过分古雅。
