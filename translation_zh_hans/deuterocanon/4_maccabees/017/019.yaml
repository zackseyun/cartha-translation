  yaml_path: translation/deuterocanon/4_maccabees/017/019.yaml
  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: zh_hans
  text: 因此，他们也借着上帝得以成圣，并得了尊荣；他们所得的不只是这份尊荣，还在于借着他们，仇敌未能胜过我们的民族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγιασθέντες
  choice: 成为圣洁
  rationale: 该词是ἁγιάζω的不定过去时被动分词，表示他们被赋予圣洁的身份。“成为圣洁”既保留被动含义，也避免把语义收窄为礼仪性的“奉献”。
- source_word: διὰ θεοῦ
  choice: 借着上帝
  rationale: διά加属格可表示媒介或施事。“借着上帝”贴近原有介词结构，并保留其表达上的细微开放性；按施事关系也可理解为“被上帝”。
- source_word: τετίμηνται
  choice: 得了尊荣
  rationale: 该词是τιμάω的完成时被动形式，强调尊荣已经赐下，并形成持续至今的状态。
- source_word: ταύτῃ τῇ τιμῇ
  choice: 这份尊荣
  rationale: 保留τιμάω与τιμή之间“尊荣”的词根呼应；中文以“得了……尊荣”自然表达其与格关系。
- source_word: τῷ διʼ αὐτοὺς
  choice: 还在于借着他们
  rationale: 带冠词的从句说明他们所得尊荣的另一层依据；“还在于”自然承接“不只是”。
- source_word: τὸ ἔθνος ἡμῶν
  choice: 我们的民族
  rationale: ἔθνος在此指犹太民族共同体；“民族”比泛称的“人民”更能保留其群体与民族含义。
- source_word: τοὺς πολεμίους
  choice: 仇敌
  rationale: 指上下文中已经明确可知的敌对群体；“仇敌”简洁而庄重。
- source_word: μὴ ἐπικρατῆσαι
  choice: 未能胜过
  rationale: ἐπικρατέω表示占上风、制伏或胜过。这里将τοὺς πολεμίους理解为不定式的逻辑主语、τὸ ἔθνος ἡμῶν为受其支配的对象，故译为“仇敌未能胜过我们的民族”，既符合语境，也不把民族误写为主动阻止仇敌的一方。
theological_decisions:
- issue: 殉道者语境中ἁγιασθέντες的含义
  choice: 他们借着上帝成为圣洁
  alternative: 他们被上帝分别为圣，具有较强的礼仪或献祭意味
  rationale: 经文确实赋予他们圣洁的身份，却没有要求把这种圣洁限定为礼仪性职分或祭物身份；译文保留圣洁语言而不作过度界定。
- issue: διὰ θεοῦ所表达的神圣施事关系
  choice: 借着上帝
  alternative: 被上帝
  rationale: διά加属格可以表达施事。“借着”保留希腊文的介词形式及其可能带有的媒介色彩，同时仍清楚表明他们的圣洁源于上帝。
- issue: 民族、仇敌与ἐπικρατῆσαι之间的句法关系
  choice: 仇敌未能胜过我们的民族
  alternative: 我们的民族没有让仇敌得胜
  rationale: 希腊文两个宾格名词短语造成一定句法压缩；结合ἐπικρατέω的语义和上下文，仇敌是未能占上风的一方。译文保留结果陈述，不进一步说明上帝如何借殉道者带来民族得救。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“因此”承接上文，“不只是……还在于……”再现原句递进结构；以分号控制长句层次。正文中的[a]紧接相关人物称谓，但脚注实际解释随后出现的“借着上帝”，与所给标记体系保持一致。
