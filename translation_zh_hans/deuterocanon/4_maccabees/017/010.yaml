  yaml_path: translation/deuterocanon/4_maccabees/017/010.yaml
  text: These also vindicated the nation[a], looking to God and enduring torments even to death.
translation:
  language: zh_hans
  text: 他们也仰望上帝，忍受酷刑直到死，为本民族伸了冤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸了冤”也可译作“报了仇”或“讨得了公道”。希腊文动词可带司法裁断或报偿的意味；这里的语境是殉道者仰望上帝、忍受酷刑至死，因此正文避免让人误解为他们亲自以暴力复仇。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ καὶ
  choice: 他们也
  rationale: 承接上文所指的人，并保留καί的附加语气；现代汉语用“他们也”自然清楚。
- source_word: ἐξεδίκησαν
  choice: 伸了冤
  rationale: 该动词可指报仇、惩治或使正义得以伸张；在殉道而非暴力报复的语境中，“伸了冤”较好地表达为本民族讨得公道、使其冤屈得到昭雪，同时不把施动者写成亲自报复的人。
- source_word: τὸ ἔθνος
  choice: 本民族
  rationale: 这里指犹太民族这一整体；“本民族”既保留群体和民族含义，也符合说话者站在该群体内部的语境。
- source_word: εἰς θεὸν ἀφορῶντες
  choice: 仰望上帝
  rationale: 表达把目光和盼望转向上帝；“仰望”是自然、庄重的汉语，也未额外说明上帝如何回应。
- source_word: μέχρι θανάτου
  choice: 直到死
  rationale: 保留达到死亡这一极限的含义，简洁而有力度。
- source_word: τὰς βασάνους
  choice: 酷刑
  rationale: 在殉道叙事中指人为施加的严酷刑罚，不只是一般痛苦；“酷刑”准确体现其具体性和严重性。
- source_word: ὑπομείναντες
  choice: 忍受
  rationale: 体现坚忍承受之意，并与“仰望”共同呈现两个分词所描述的行动。
theological_decisions:
- issue: 殉道语境中ἐξεδίκησαν的含义
  choice: 译作“为本民族伸了冤”
  alternative: “替本民族报了仇”或“为本民族讨得了公道”
  rationale: 原词确有报仇和执行公义的范围，但上下文所写的是仰望上帝并忍受酷刑至死，不是殉道者实施暴力报复。“伸了冤”保留司法或昭雪意味，又避免把潜在的报复性含义完全排除，脚注列出其他可能。
- issue: εἰς θεὸν与伸冤行动的关系
  choice: 将“仰望上帝”保留为殉道者的取向，不明说是“在上帝面前”获得昭雪
  alternative: “在上帝面前为本民族昭雪”
  rationale: 希腊文直接说的是他们仰望上帝；若译成“在上帝面前昭雪”，会把句法关系及神学结果解释得过实。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“仰望上帝”置于句首，使两个分词的逻辑顺序清楚；“酷刑”准确呈现殉道场景。“为本民族伸了冤”保留原文的结果性和司法张力，并以脚注说明“报仇／讨得公道”的词义可能。
