  text: and that the tyrant should be punished and the homeland should be purified[a].
translation:
  language: zh_hans
  text: 并使那暴君受到惩罚，使祖国得以洁净[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得到净化”。希腊文可指从污秽中得洁净，可能含有礼仪、道德或民族层面的意义。
    reason: 词义存在合理的表达选择，且原词涵盖多重层面。
lexical_decisions:
- source_word: τύραννον
  choice: 暴君
  rationale: 该词在本书语境中带有鲜明的贬义，指施行压迫、专横统治的人；“暴君”自然保留了这种评价色彩。
- source_word: τιμωρηθῆναι
  choice: 受到惩罚
  rationale: 不定过去时被动不定式表示暴君承受惩罚；此译保留司法与报应意味，同时不将其过度限定为私人复仇。
- source_word: πατρίδα
  choice: 祖国
  rationale: πατρίς指祖先之地、故土或本国；“祖国”在现代汉语中兼具国家和祖辈家园的情感意味，且适合庄重语体。
- source_word: καθαρισθῆναι
  choice: 得到洁净
  rationale: 该被动不定式可指从污秽中被洁净，含礼仪、道德或民族共同体层面的可能意义；“得到洁净”保留这些开放含义。
theological_decisions:
- issue: 祖国被洁净的含义
  choice: “祖国得到洁净”保留礼仪性、道德性及民族共同体复兴等多重可能。
  alternative: 祖国得到净化；祖国从污秽中被洁净
  rationale: καθαρισθῆναι在殉道及赎罪主题的上下文中可能不只表示政治解放。正文不补明污秽的性质，以免消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“并使……使……”承接上文的不定式并列结构；因本节为句子片段，保留开头的连接词“并”。
