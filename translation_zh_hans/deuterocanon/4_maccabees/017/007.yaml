base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: zh_hans
  text: 但若我们能像画家那样，描绘出你事迹所彰显的虔敬[a]，那么，看见一位有七个孩子的母亲因着虔敬而一直忍受各种酷刑直到死亡的人，岂不战栗吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬”也可译作“敬虔”或“虔诚”；本节两处原文用的是同一个词。
    reason: 说明εὐσέβεια的词义范围及原文有意重复的关键词。
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: 但如果我们能够
  rationale: ἔξον与ἦν构成非现实假设，可表示“获准”或“可能”；此处译作“能够”，自然地保留假设语气，而不排除许可意味。
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: 像某位画家那样，用画笔描绘
  rationale: ζωγραφέω表示绘画、描绘；τινός所指在句法上有所省略，结合绘画动词理解为某位作画者。译文保留视觉比喻，“某位”也反映原文的不定性。
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: 你事迹中所显出的虔敬
  rationale: ἱστορία在这里指所叙述的经历或事迹，并非现代学科意义上的“历史”；属格结构自然理解为这段事迹彰显的εὐσέβεια。
- source_word: οὐκ ἂν ἔφριττον
  choice: 岂不会战栗吗
  rationale: 保留原文反问形式；φρίσσω表示因震撼或恐惧而颤栗，“战栗”传达其强烈的身体反应。
- source_word: οἱ θεωροῦντες
  choice: 观看的人
  rationale: θεωρέω在此指亲眼观看、注视，译法保留现场观者的意味。
- source_word: μητέρα ἑπτὰ τέκνων
  choice: 一位有七个孩子的母亲
  rationale: τέκνα本身是“孩子”，并不特指儿子；即使上下文所指为七兄弟，此处仍按原词的一般性翻译。
- source_word: διʼ εὐσέβειαν
  choice: 为了虔敬
  rationale: διά加宾格表示原因或缘故；“为了”凸显她因持守虔敬而承受酷刑，并与前一处εὐσέβεια保持一致。
- source_word: ποικίλας βασάνους
  choice: 各种酷刑
  rationale: ποικίλος强调种类繁多，βάσανος在殉难语境中明确指施加于人的酷刑。
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: 忍受……直至死亡
  rationale: ὑπομένω表达在苦难中坚持忍受；μέχρι θανάτου说明忍受达到死亡这一终点，同时不额外判定具体死亡方式。
theological_decisions:
- issue: εὐσέβεια在殉道语境中的译法
  choice: 虔敬
  alternative: 敬虔；虔诚
  rationale: εὐσέβεια在本书中指向对上帝的敬畏与忠贞实践。“虔敬”既有明确的宗教指向，又能作为伦理德性反复使用；两次出现均同译，以保留主题性重复。
- issue: 母亲受苦的动机与范围
  choice: 为了虔敬，忍受各种酷刑，直至死亡
  alternative: 因虔敬而忍受各种酷刑，直到死去
  rationale: 译文让διʼ εὐσέβειαν修饰她忍受酷刑的行为，并保留μέχρι θανάτου所表达的极限；不将其扩展为某一特定殉道神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“用画笔描绘”保留原文绘画意象，以“岂不会……吗”保留修辞反问；避免把τέκνα按上下文擅自具体化为“儿子”。
