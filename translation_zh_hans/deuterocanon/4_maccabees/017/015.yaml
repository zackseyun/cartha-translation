  text: But godliness won[a], crowning its own athletes.
translation:
  language: zh_hans
  text: 然而，敬虔得胜了，为自己的健儿加冕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“对上帝的虔敬”。希腊文在这里把“敬虔”拟人化，描写它得胜并为自己的健儿加冕。
    reason: 说明词义范围及原文的拟人化修辞。
lexical_decisions:
- source_word: θεοσέβεια
  choice: 敬虔
  rationale: 指向对上帝的敬畏与虔诚；“敬虔”简洁、庄重，并能在上下文中承载拟人化表达。
- source_word: ἐνίκα
  choice: 得胜了
  rationale: 直接表达竞赛中的胜利，并与后面的健儿、加冕意象自然呼应。
- source_word: τοὺς ἑαυτῆς
  choice: 自己的
  rationale: 保留反身领属关系；汉语无需因希腊语名词的阴性语法形式而增添女性代词。
- source_word: ἀθλητάς
  choice: 健儿
  rationale: 保留竞技场意象，又比现代语境中偏职业化的“运动员”更适合庄重的文学表达。
- source_word: στεφανοῦσα
  choice: 为……加冕
  rationale: 保留给竞赛胜者戴上冠冕的形象，并体现分词与主句动作之间的伴随关系。
theological_decisions:
- issue: θεοσέβεια的拟人化
  choice: 译作“敬虔”，并通过“得胜”“为自己的健儿加冕”保留拟人化。
  alternative: 译作“敬神”或“虔敬”，并明确使用女性代词“她”。
  rationale: 希腊文把敬虔描写成竞赛的胜者；汉语可由动作自然体现拟人，无须把语法阴性误解为实际性别。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“健儿—加冕”共同保留原文的竞技比喻；“然而”承接希腊文δέ所表达的转折。
