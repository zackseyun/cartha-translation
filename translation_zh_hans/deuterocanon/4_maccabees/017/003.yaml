base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/003.yaml
  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: zh_hans
  text: 因为正如你如同一座屋顶，勇敢而稳固地立在孩子们[a]的柱子上，毫不动摇地承受了经由酷刑而来的地震，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子们”。希腊语 παῖδες 可按语境指“孩子们”“儿子们”或“男孩们”；这里指这位母亲的众子。
    reason: 说明原词的词义范围及本段叙事中的具体所指。
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 因为……就像
  rationale: 兼顾 γὰρ 的解释、承接作用和 καθάπερ 的比拟意义，使汉语句子自然，同时保留本节未完的比较结构。
- source_word: στέγη
  choice: 屋顶
  rationale: 采用本义，保留与“柱子”“地震”相互呼应的建筑意象，不将其抽象化为“庇护”。
- source_word: ἐπὶ τοῦ στύλου τῶν παίδων
  choice: 在孩子们的柱子上
  rationale: 直译核心结构，保留属格关系可能具有的意象张力；不擅自改写为母亲支撑或保护孩子。
- source_word: γενναίως ἱδρυμένη
  choice: 勇毅地稳立
  rationale: γενναίως 在此兼有勇敢与高尚坚强之意；ἱδρυμένη 表示牢固安置、稳立。该短语按希腊语位置修饰屋顶的稳立状态。
- source_word: ἀκλινῶς
  choice: 毫不动摇地
  rationale: 既表达坚定不移，也与建筑物在地震中不倾斜的形象相呼应。
- source_word: ὑπήνεγκας
  choice: 承受了
  rationale: 表达在重压之下承担、忍受，适合其宾语“地震”，也保留受苦语境。
- source_word: διὰ τῶν βασάνων
  choice: 酷刑所引发的
  rationale: 在殉道叙事中 βάσανοι 明指酷刑；διά 加属格可表达经由、借着，此处译为引发比单纯“经过酷刑”更清楚地呈现地震意象与酷刑之间的关系。
- source_word: σεισμόν
  choice: 地震
  rationale: 保留字面意义及整句建筑隐喻，不弱化为一般的“震动”或“冲击”。
theological_decisions:
- issue: 母亲、屋顶、柱子和地震构成的建筑隐喻
  choice: 完整保留“屋顶—柱子—地震”的意象
  alternative: 意译为母亲保护孩子，并在酷刑中坚定忍耐
  rationale: 原文刻意使用密集而略具张力的建筑语言；直保意象可避免把母亲与孩子的关系解释得超过原文。
- issue: τῶν παίδων 所指的人
  choice: 正文译“孩子们”，脚注说明也可译“儿子们”
  alternative: 正文直接译“儿子们”
  rationale: 上下文所指确为这位母亲的众子，但 παῖδες 本身范围较宽；正文保留较广词义，脚注交代具体语境中的可选译法。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。保留原文作为后续比较句前半部的未完句势，并维持建筑隐喻的陌生感；“勇毅”兼顾勇敢与高尚坚强的语气。
