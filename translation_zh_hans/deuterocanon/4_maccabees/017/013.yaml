  yaml_path: translation/deuterocanon/4_maccabees/017/013.yaml
  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
translation:
  language: zh_hans
  text: 以利亚撒率先投入这场较量[a]；七个儿子的母亲如运动员般参赛；弟兄们则奋力抗争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文连续使用三个与竞赛、争斗有关的动词：以利亚撒“率先参加竞赛”，母亲“像运动员一样参赛”，弟兄们则“奋斗、抗争”。译文以略有变化的措辞保留贯穿全句的竞斗意象；末一动词并不专指实际战争。
    reason: 词汇选择
lexical_decisions:
- source_word: προηγωνίζετο
  choice: 在竞斗中走在前头
  rationale: 该未完成时动词表示在别人之前投入竞斗，兼有先行与带头示范之意；译文保留竞赛、搏斗的意象，又不把它限定为字面的前线作战。
- source_word: ἐνήθλει
  choice: 如健儿般竞技
  rationale: 此词源自表示竞技的词，带有鲜明的运动员意象。“如健儿般竞技”既保留这一修辞色彩，也符合现代汉语表达。
- source_word: ἠγωνίζοντο
  choice: 奋力争战
  rationale: 此词可指竞技、搏斗或奋争；“奋力争战”保留宽泛的较力意味，不武断地限定为实际武装战斗。
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: 七个儿子的母亲
  rationale: παῖδες 本可泛指孩子，但本叙事明确指七名男性兄弟，因此译作“儿子”更准确。
- source_word: ἀδελφοὶ
  choice: 弟兄们
  rationale: 希腊文为阳性复数，在上下文中指那七名男性手足；“弟兄们”准确保留其性别与亲属关系。
theological_decisions:
- issue: 是否贯穿保留竞斗意象
  choice: 在三个分句中分别采用“竞斗”“竞技”“争战”
  alternative: 统统意译为“忍受苦难”或“勇敢坚持”
  rationale: 原文刻意连续使用三个相近而有变化的竞赛、搏斗动词，把殉难描绘为高尚的较力。译文保留这一共同意象及词语变化，不将其弱化为一般性的忍耐。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个分句结构平衡，并以略有变化的动词重现原文的排比；未把竞斗意象解释成某一特定教义或限定为字面战斗。
