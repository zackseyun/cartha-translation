  text: For truly the contest that came about through them was divine[a].
translation:
  language: zh_hans
  text: 因为那场借着他们而成就的较量，实在是神圣的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那场由他们完成的神圣较量。”希腊语可着重表示，这场较量借着他们得以实现，或由他们施行、完成。
    reason: 说明διʼ αὐτῶν γεγενημένος可带有媒介或较强施事色彩，同时避免把该短语误释为“发生在他们身上”。
lexical_decisions:
- source_word: Ἀληθῶς
  choice: 实在
  rationale: 表达郑重而明确的肯定语气，符合本句的修辞力度，也比“诚然”更贴近现代普通读者的语言。
- source_word: ἀγών
  choice: 较量
  rationale: 保留该词所带有的竞技、公开抗争意味；在殉道者忍受苦难的语境中，也能自然涵盖严峻斗争，而不将其缩窄为武力战斗。
- source_word: θεῖος
  choice: 神圣的
  rationale: 直接表达这场较量具有神圣、属神的性质，同时避免增译为明确的来源判断，如“从上帝而来”。
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: 借着他们而成就的
  rationale: “借着他们”保留 διά 加属格所表达的媒介或施事关系；“而成就的”体现 γεγενημένος 的完成状态，但不把他们说成这场较量之神圣性质的最终来源。
theological_decisions:
- issue: 如何理解殉道者在 διʼ αὐτῶν 中的作用
  choice: 译作“借着他们而成就的”，突出他们作为这场较量得以实现的媒介或参与者。
  alternative: 也可理解为“由他们完成的”，或较宽泛地理解为“发生在他们身上的”。
  rationale: διά 加属格通常表示媒介或施事。正文保留“借着”这一关系，使“较量是神圣的”与“它借着殉道者成就”并存，不进一步断定神圣性质的来源，也不夸大殉道者的独立作用。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“较量”保留竞技性意象，“神圣的”避免过度解释 θεῖος；句式略带修辞庄重感，但普通读者仍易理解。
