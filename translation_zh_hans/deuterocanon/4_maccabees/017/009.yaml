  rationale: 修订恢复原文明确的因果关系，删除带评价色彩的“遭此下场”，并以“这里葬着”保留墓志铭式的庄重现场感。根据4马加比书的叙事上下文，将παῖδες具体译为“她的七个儿子”。同时将πολιτεία译为“共同体秩序”，并以脚注保留其“生活方式／政体／共同体”等相互关联的语义侧面。
