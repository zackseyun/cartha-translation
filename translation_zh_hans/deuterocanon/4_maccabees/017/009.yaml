  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: zh_hans
  text: 这里葬着一位年迈的祭司、一位年迈的妇人和她的七个儿子；他们因一个暴君的暴行而被葬在这里。那暴君企图废除希伯来人的共同体秩序[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“希伯来人的生活方式”、“希伯来人的政体”或“希伯来人的共同体”。希腊语这个词可指一个民族有组织、有秩序的共同生活及其制度安排，并不只是个人的信仰。
    reason: 说明πολιτεία可涵盖共同体生活、制度和政体，并保留可行的译法。
lexical_decisions:
- source_word: Ἐντάφθα
  choice: 这里
  rationale: 保留指向安葬地点的语气，也符合墓志铭式的庄重开头。
- source_word: γέρων ἱερεύς
  choice: 一位年迈的祭司
  rationale: γέρων表示年事已高；“年迈”比“老”更符合纪念性语境，ἱερεύς直译为“祭司”。
- source_word: γυνὴ γεραιά
  choice: 一位年迈的妇人
  rationale: 与前面的“年迈的祭司”形成原文中的平行结构，并保持庄重语体。
- source_word: ἑπτὰ παῖδες
  choice: 七个孩子
  rationale: παῖδες本身可指孩子、少年，也可按上下文指儿子；正文采用不限定性别的“孩子”，以保留词义范围，且不额外加入原句未明说的亲属关系。
- source_word: ἐγκεκήδευνται
  choice: 安葬着
  rationale: 希腊语完成时被动态强调安葬之后持续至今的状态；“安葬着”自然地呈现这一结果状态。
- source_word: διὰ τυράννου βίαν
  choice: 因一个暴君施暴
  rationale: διά加宾格表示原因；将名词βία转为“施暴”，在现代汉语中简洁自然，同时保留暴力强制之意。
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: 希伯来人的社会制度
  rationale: πολιτεία涵盖一个民族有秩序的公共生活、制度和政体，不只指私人信仰；“社会制度”在正文中较为自然，并借脚注保留其更宽的语义范围。
- source_word: καταλῦσαι
  choice: 废除
  rationale: 该动词以制度性事物为宾语时，“废除”准确表达使其解体、终止之意。
- source_word: θέλοντος
  choice: 企图
  rationale: 该属格分词修饰“暴君”，表达其意愿或目的；“企图”既自然，又清楚表明这是暴君的意图。
theological_decisions:
- issue: 犹太殉道语境中πολιτεία的含义
  choice: 希伯来人的社会制度
  alternative: 希伯来人的生活方式；希伯来人的政体；希伯来人的共同体秩序
  rationale: 此词在这里不仅指宗教信念，也涉及希伯来民族受律法规范的共同生活与公共秩序。正文选用较易懂且具制度含义的说法，脚注则保留其他可能译法，避免把它窄化为私人宗教或单纯政治体制。
translation_notes:
  register: 采用现代、庄重而易懂的纪念性语体。首句保留墓志铭式的现场指向；第二句将希腊语较长的结构拆开，以免汉语关系层次含混。“遭此下场”承接安葬事实，但不具体添加原文未明说的死亡方式。
