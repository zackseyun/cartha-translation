base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
translation:
  language: zh_hans
  text: 啊，神圣的天性[a]，父母的慈爱，子女对父母的亲情，养育，以及母亲们不可征服的强烈情感[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天性”也可理解为“天然的亲情纽带”；希腊语 φύσις 既可指天性或自然本身，也可指在家庭亲情中体现的天然秩序。
    reason: lexical_alternative
  - marker: b
    text: 这里的“强烈情感”指强烈的感情或情绪，并不必然含有失控或不正当欲望的意思。
    reason: lexical_clarification
lexical_decisions:
- source_word: φύσις ἱερά
  choice: 神圣的天性
  rationale: φύσις首先指自然、本性或天然秩序；ἱερά赋予庄严而受尊崇的意味。“神圣的天性”保留原文的拟人化呼告，也不把它限定为某一教义概念。
- source_word: φίλτρα γονέων
  choice: 父母的慈爱
  rationale: φίλτρα在此处指亲爱、眷恋等感情，而非字面上的爱情魔药；结合家庭语境，以“慈爱”自然表达父母对子女的深厚亲情。
- source_word: γονεύσιν φιλοστόργε
  choice: 儿女对父母的亲爱
  rationale: φιλοστόργος表示家人之间自然、温柔的亲情，γονεύσιν为其所指向的对象。译文将隐含的关系明确为儿女对父母的亲爱，同时避免使用带特定伦理传统色彩过强的术语。
- source_word: τροφεῖα
  choice: 养育之恩
  rationale: 该词与抚育、供养及由养育所形成的关系或应有回报有关。“养育之恩”既能表达养育本身，也能传达其在人伦关系中的分量。
- source_word: μητέρων ἀδάμαστα πάθη
  choice: 母亲们不可压服的深情
  rationale: ἀδάμαστα意为不可驯服、不可征服；πάθη在这里是强烈的情感，并不必然指失序的欲望。“不可压服的深情”保留其强度，又符合现代汉语的家庭语境。
theological_decisions:
- issue: 本节是在提出关于家庭秩序的教义，还是以修辞呼告赞叹天然亲情
  choice: 译作对神圣而强韧的天然家庭亲情的修辞性呼告
  alternative: 译作关于家庭秩序已经被分别为圣的明确教义陈述
  rationale: Ὦ引出的连续呼告和并列名词短语具有强烈的感叹、赞叹色彩。保留“神圣”所表达的价值判断，但不将修辞性赞叹扩展成原文未明说的系统教义。
translation_notes:
  register: 采用庄严而可诵读的现代标准汉语。以“啊”与分句感叹号再现原文的高昂呼告；并列项目用现代标点梳理，但保留原文逐层累加的修辞力量。“不可压服”较“不可战胜”更贴近 ἀδάμαστα 所含的不受驯服、不被制伏之意。
