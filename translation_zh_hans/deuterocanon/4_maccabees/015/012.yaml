  yaml_path: translation/deuterocanon/4_maccabees/015/012.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: zh_hans
  text: 然而，这位母亲逐一劝勉每个儿子，又一同劝勉众儿子，为敬虔而死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劝勉他们走向敬虔之死”。原文把母亲对每个儿子的逐一劝勉，与她对全体儿子的集体劝勉相对照。“敬虔之死”中“敬虔”与“死”的具体关系未由原文属格明确限定；可理解为因持守敬虔、尊崇上帝而承受的死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 然而……又
  rationale: 承接上文并带有轻微转折和递进意味；按汉语句法以“然而”引出，并用“又”连接两种劝勉方式。
- source_word: καθʼ ἕνα παῖδα
  choice: 逐一劝勉每个儿子
  rationale: καθʼ ἕνα 表示逐个、一个一个地；παῖδα 在本段明确指母亲的男性子女，因此译作“儿子”。
- source_word: ὁμοῦ πάντας
  choice: 他们全体一同
  rationale: 同时保留 ὁμοῦ 的共同性和 πάντας 的全体性，与前面的逐一劝勉形成清楚对照。
- source_word: ἡ μήτηρ
  choice: 这位母亲
  rationale: 按上下文指前文已经出现的母亲；“这位”比机械译作“那母亲”更符合现代汉语叙述。
- source_word: ἐπὶ ... προέτρεπεν
  choice: 劝勉……走向
  rationale: προτρέπω 表示劝勉、激励，ἐπί 加宾格指向目标；“走向”保留朝向死亡这一方向性。
- source_word: τὸν ... θάνατον
  choice: 死
  rationale: 原文直言死亡，并未使用专门表示殉道的词，因此不译作“殉道”。
- source_word: τῆς εὐσεβείας
  choice: 为敬虔而
  rationale: εὐσέβεια 在本书中指对上帝及其律法的虔敬忠诚；“敬虔”简洁保留其宗教和伦理内涵，“为……而”则以自然汉语表达该属格与死亡之间的关联。
theological_decisions:
- issue: 殉难语境中 εὐσέβεια 的译法
  choice: 敬虔
  alternative: 虔敬；对上帝的敬畏
  rationale: “敬虔”能涵盖对上帝的尊崇和忠诚，又不把原词缩窄为单纯情感上的敬畏；同时避免加入原文没有明说的宗派性含义。
- issue: τῆς εὐσεβείας 与 θάνατον 的关系
  choice: 为敬虔而死
  alternative: 敬虔之死；与敬虔相称的死
  rationale: 属格的具体关系并未由形式本身完全限定。正文采用在殉难语境中最自然的目的或缘由表达，脚注保留较贴近形式、关系更开放的另一种理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“逐一”与“全体一同”形成整齐对照；保留“死”而不改译为“殉道”，避免超出希腊文本。
