base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: zh_hans
  text: 啊[a]，父母疼爱儿女的深情，我该怎样描绘呢？这种深情把心灵和形貌的相似，印在小小而奇妙的孩子身上[b]；尤其因为母亲对所生的儿女，比父亲更能感同身受[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “描绘”也可译作“刻画”或“铺陈”；原文用词带有较高的修辞色彩。
    reason: lexical_alternative
  - marker: b
    text: 原文采用盖印的比喻：父母的深情仿佛把心灵与形貌的相似印在孩子这小小而奇妙的“印记”或“形象”上。
    reason: metaphor_clarification
  - marker: c
    text: “更能感同身受”也可译作“更有同感”或“感情更深”。原文的比较对象是父亲，即母亲比父亲对所生的儿女有更深的共情。
    reason: syntactic_clarification
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: 描绘
  rationale: 该动词带有修辞性的刻画、铺陈意味；“描绘”比单纯的“描述”更能保留其文采，同时仍是现代汉语常用表达。
- source_word: φιλότεκνα πάθη
  choice: 疼爱儿女的深情
  rationale: φιλότεκνα特指对自己儿女的爱，πάθη在此指强烈的亲情感受，而非负面的“情欲”或失控激情。
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: 心灵和形貌上的相似
  rationale: 保留内在与外在两方面的对应：ψυχή在此侧重内在生命或性情，μορφή指外在形貌。
- source_word: παιδοχαρακτῆρα
  choice: 儿女形象
  rationale: χαρακτήρ可指刻印出来的印记或形象，与ἐναποσφραγίζοντα的“印上”构成刻印隐喻；“儿女形象”在中文中自然，并避免译成“性格”而误导。
- source_word: ἐναποσφραγίζοντα
  choice: 印在……上
  rationale: 保留盖印、留下印记的形象，同时使中文句法清楚自然。
- source_word: συμπαθεστέρας
  choice: 更有同感
  rationale: 比较级表达更深的共同感受、体恤和情感共鸣；“更有同感”保留词义，不将其窄化为怜悯。
- source_word: τοῖς γεννηθεῖσιν
  choice: 对所生的儿女
  rationale: 字面为“对那些生下来的”，语境明确指父母所生的儿女；补出“儿女”使现代中文易懂。
theological_decisions:
- issue: “心灵和形貌上的相似”所含的人论意味
  choice: 在正文中同时保留内在的“心灵”和外在的“形貌”
  alternative: 意译为“儿女的性情和长相都像父母”
  rationale: 原文明确并列ψυχή与μορφή，但并非在此系统阐述灵魂来源；直保两者既不抹平修辞，也不额外引入灵魂遗传等教义判断。
- issue: 末句比较关系的句法
  choice: 译为母亲对儿女比父亲更有同感
  alternative: 译为母亲使父亲更同情所生的儿女
  rationale: τὰς μητέρας是宾格加不定式结构中的主语，τῶν πατέρων最自然地作比较级συμπαθεστέρας的比较对象，因此原文是在比较母亲与父亲对儿女的情感，并非说母亲促使父亲产生同情。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以反问保留原文的感叹和修辞力度；“小小的儿女形象”及“印在……上”共同保存刻印隐喻。末句依希腊语宾格加不定式和比较级结构翻译，未沿用英语咨询层中“母亲使父亲……”的句法理解。
