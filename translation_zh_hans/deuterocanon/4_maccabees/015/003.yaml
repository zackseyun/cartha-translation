  text: she loved piety more[a], which saves unto eternal life according to God.
translation:
  language: zh_hans
  text: 她更爱敬虔，就是那照着上帝使人得着永生的敬虔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着上帝”也可理解为“按上帝的旨意”或“以上帝为准则”；原文表达凝练，也可能表示这种使人得着永生的敬虔与上帝相合。
    reason: 说明 κατὰ θεόν 的语义与修饰范围存在真实的含混。
lexical_decisions:
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 指向对上帝的虔敬，并包含由此表现出来的忠贞行为；“敬虔”既保留本书中的主题性用语，也比单纯的“敬畏”更完整。
- source_word: μᾶλλον
  choice: 更
  rationale: 表达比较和取舍：在上下文所涉及的自然亲情与敬虔之间，她更爱后者。
- source_word: ἠγάπησεν
  choice: 爱
  rationale: 直接对应动词“爱”；比较和优先之意已由 μᾶλλον 表达，不必把动词意译为“选择”。
- source_word: τὴν σώζουσαν
  choice: 就是那……使人得着……的敬虔
  rationale: 现在分词作定语，回指“敬虔”；补出“使人”符合现代汉语表达，同时不另行指定原文未明说的宾语。
- source_word: εἰς αἰώνιον ζωὴν
  choice: 得着永生
  rationale: εἰς 表示趋向、目标或结果；“得着永生”在现代汉语中自然，并保留通向永恒生命的含义。
- source_word: κατὰ θεόν
  choice: 照着上帝
  rationale: 原短语高度凝练；采用较直译的说法，避免擅自限定为“遵行上帝的旨意”“按上帝的标准”或“在上帝看来”。
theological_decisions:
- issue: κατὰ θεόν 与敬虔、拯救及永生之间的关系
  choice: 译作“照着上帝”，保留其修饰关系和具体含义上的开放性。
  alternative: 按上帝的旨意；以上帝为准则；在上帝看来；与上帝相合
  rationale: 原文并未明确解释该短语究竟侧重上帝的旨意、标准、认可，还是一种以上帝为导向的方式。正文不把这种张力化约为单一教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敬虔”作为主题性宗教伦理词保留；“照着上帝”略带原文的凝练感，并由脚注说明其可能含义。
