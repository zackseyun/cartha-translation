lexical_decisions:
- source_word: ὠδῖνας
  choice: 分娩之痛
  rationale: 本义是产痛、分娩的阵痛；上下文聚焦母亲与众子，保留这一具体的母性意象，比泛译为“痛苦”更贴近希腊文。
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: 他们每个人所受的
  rationale: 表达痛楚逐一关联每个儿子；补出“所受的”使现代汉语自然，同时不改变所属关系。
- source_word: ἠναγκασμένην
  choice: 不得不
  rationale: 保留“受迫、被强使”的力度，又符合汉语对内在情感牵引的自然表达。
- source_word: συμπάθειαν
  choice: 怜惜
  rationale: 表示与人同感、同受其苦的恻隐之情；“怜惜”兼顾母亲的疼爱与同情，避免过于抽象。
theological_decisions:
- issue: 母爱与理性之间的张力
  choice: 保留“不​​得不”所体现的强烈自然情感
  alternative: 弱化为“便对他们感到同情”
  rationale: 原文ἠναγκασμένην明确呈现一种迫切、近乎不可抗拒的情感牵引；不应为协调上下文中母亲的理性坚忍而将其淡化。
translation_notes:
  register: 采用庄重而自然的现代汉语。“分娩之痛”保留原文的母性身体意象；句末逗号反映本节在原句中仍承接后文。
