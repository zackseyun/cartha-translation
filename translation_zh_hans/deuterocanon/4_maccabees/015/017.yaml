  text: O mother[a], now tested by pains more bitter than the birth pangs for them.
translation:
  language: zh_hans
  text: 母亲啊，你如今所经受的痛苦，比生他们时的产痛[a]更加苦涩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他们而有的产痛。”希腊语指与生下这些儿子有关的分娩阵痛。
    reason: 保留ἐπʼ αὐτοῖς在表达“与他们有关／因他们而有”时的措辞差异。
lexical_decisions:
- source_word: πικροτέρων
  choice: 更加苦涩
  rationale: 保留比较级和“苦涩”的比喻力量；在现代汉语中也可自然形容难以承受的痛苦。
- source_word: μήτηρ
  choice: 母亲啊
  rationale: 原文为直接呼语；加“啊”体现庄重而强烈的感叹语气。
- source_word: πόνων
  choice: 痛苦
  rationale: 此处指她当前经历的惨痛折磨；译作“痛苦”既自然，也能与下文具体的“产痛”形成比较。
- source_word: πειρασθεῖσα
  choice: 所经受的
  rationale: 该分词可指经历磨难或受到考验。正文采用自然的“经受”，不额外强化道德考验的含义。
- source_word: ἤπερ
  choice: 比
  rationale: 承接比较级，清楚表达当前痛苦与昔日产痛之间的比较。
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: 生他们时的产痛
  rationale: ὠδίνων指分娩阵痛，ἐπʼ αὐτοῖς指与这些儿子有关的生产经历；此译明确而自然地表达“生他们时”的意思。
