  text: 一位母亲为儿女握着两张票[a]：一张致死，一张救命，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “票”也可译为“表决票”；按字面可译作“两颗小石子”，因为ψῆφος原指投票时所用的小石子。
    reason: 说明ψῆφος由投票用小石子的具体本义引申为票或表决票，并保留原文的投票比喻。
lexical_decisions:
- source_word: δύο
  choice: 两
  rationale: 直译基数词，与“票”搭配自然。
- source_word: ψήφους
  choice: 票
  rationale: ψῆφος本指投票所用的小石子，进而指选票或表决票；“票”既保留具体意象，也符合现代汉语表达。
- source_word: κρατοῦσα
  choice: 手握
  rationale: 现在分词表示母亲正拿着或掌握这两票；“手握”保留原文具体而有张力的画面。
- source_word: μήτηρ
  choice: 这位母亲
  rationale: 结合上下文所指的母亲，用“这位”在现代汉语中自然，并保留叙述焦点。
- source_word: θανατηφόρον
  choice: 带来死亡
  rationale: 表达“致死、带来死亡”的含义，并与后面的“带来拯救”形成平行结构。
- source_word: σωτήριον
  choice: 带来拯救
  rationale: 保留“救助、保全、拯救”的语义范围，不把本句单独限定为某一技术性的救恩教义。
- source_word: ὑπὲρ τέκνων
  choice: 为儿女
  rationale: 表达这些票关乎儿女并为他们而作的代表性或利害关系；“儿女”也自然涵盖τέκνα。
theological_decisions:
- issue: 殉道语境中σωτήριον的译法
  choice: 带来拯救
  alternative: 救命；带来救恩；使人得保全
  rationale: “拯救”能与“死亡”构成鲜明对照，同时保留可能涉及保全、解救或终极拯救的张力，不在本句中预先裁定其具体神学范围。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“手握两票”保留原文的具体比喻；冒号清楚呈现两票一死一救的对举。句末逗号保留原句作为上下文片段的未完结构。
