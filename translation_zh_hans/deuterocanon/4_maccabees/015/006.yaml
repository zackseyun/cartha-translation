  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who through seven pregnancies had her affection for them deeply planted within her;
translation:
  language: zh_hans
  text: 但在所有母亲中，那七人的母亲[a]最疼爱自己的孩子；她经过七次怀胎，对他们的爱意也逐渐深植在她心中；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那七人的母亲”；上下文表明这七人是她的七个儿子。
    reason: 保留原文省略名词的表达，同时为普通读者说明上下文所指。
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: 最疼爱自己的孩子
  rationale: 该比较级与“在所有母亲中”连用，在汉语中自然形成最高程度的表达；“疼爱”准确传达对子女深厚而亲切的爱。
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: 那七人的母亲
  rationale: 保留希腊文只说“七人”而未明说“儿子”的措辞，并以脚注交代上下文。
- source_word: ἑπτὰ κυοφορίαις
  choice: 经历七次怀孕
  rationale: κυοφορία具体指怀孕、妊娠；此译保留母亲七次孕育孩子的身体经历。
- source_word: ἐπιφυτευομένην
  choice: 由此栽植在她心中
  rationale: 保留“栽种、植入”的比喻，并用“在她心中”使汉语表达完整自然；“由此”体现七次怀孕与亲情形成之间的联系。
- source_word: φιλοστοργίαν
  choice: 亲情
  rationale: 该词表示家庭成员之间自然、温柔的爱；“亲情”在现代汉语中简洁自然，也没有额外加入原文未明说的修饰。
- source_word: πρὸς αὐτούς
  choice: 对他们的
  rationale: 保留感情所指向的对象，不将“他们”直接解释为“儿子们”。
