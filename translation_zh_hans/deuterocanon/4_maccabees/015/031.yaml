  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: zh_hans
  text: 因为正如挪亚的方舟[a]在漫遍全世界的洪水中被洪水载着前行，坚忍地承受了巨浪，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在充满全世界的洪水中被带着前行。”
    reason: 保留英文审校轨迹中对相关短语的词汇替代译法；该译法同样表达方舟在遍及世界的洪水中受带动前行。
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 因为，正如
  rationale: γὰρ承接上文说明理由，καθάπερ引出比喻；译文同时保留因果衔接和比较关系。
- source_word: ἡ Νῶε κιβωτός
  choice: 挪亚的方舟
  rationale: 采用现代汉语圣经传统中通行的人名和洪水叙事用语，准确指向挪亚方舟。
- source_word: ἐν τῷ κοσμοπληθεῖ κατακλυσμῷ
  choice: 在充满全世界的洪水中
  rationale: κοσμοπληθεῖ是修饰κατακλυσμῷ的复合形容词，表达洪水遍及、充满世界的规模；此译法较贴近希腊文结构，也避免擅自加强为毁灭性的解释。
- source_word: κοσμοφορουμένη
  choice: 随波漂行
  rationale: 保留分词所表达的被动承载和移动状态，并以自然汉语呈现方舟被洪水托载前行的画面；不按复合词字面机械译作“载着世界”。
- source_word: καρτερῶς
  choice: 坚忍地
  rationale: 既表达坚定承受，也呼应《马加比四书》中坚忍不屈的主题。
- source_word: ὑπήνεγκεν
  choice: 承受了
  rationale: 该动词表示在压力之下担负、忍受；“承受”兼顾方舟承受风浪的具体意象和全段坚忍的修辞重点。
- source_word: τοὺς κλύδωνας
  choice: 巨浪
  rationale: κλύδων指汹涌翻腾的波浪；“巨浪”简洁自然，并呈现其强烈冲击力。
theological_decisions:
- issue: 挪亚洪水意象的类比意义
  choice: 直接保留方舟坚忍承受巨浪的明喻，不展开其象征意义
  alternative: 将方舟明确解释为殉道者、母亲或信仰群体的预表
  rationale: 本分句只建立类比，具体对应关系须由上下文显明；译文不加入原文未明说的后期神学或宗派性解释。
- issue: κοσμοφορουμένη是否含有“承载世界”的宇宙性意涵
  choice: 按方舟在洪水中被托载漂行来译
  alternative: 译作“承载着世界”或“载着一个世界”
  rationale: 在此句法和洪水场景中，被洪水托载前行最为顺畅；同时不把复合词可能引发的修辞联想提升为确定的神学命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原句作为未完比较句的逗号收束，以衔接下一节；不用文言化的“洪涛”“波澜”，也不使用过度口语化表达。
