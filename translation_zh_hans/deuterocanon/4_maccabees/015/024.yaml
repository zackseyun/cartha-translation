revisions:
- from: 尽管亲眼看见自己的七个孩子遭毁灭，又见种种错综复杂的酷刑，她这位勇毅的母亲仍一一拥抱他们[a]，并因着对上帝的信心[b]放他们离去。
  to: 尽管亲眼目睹自己的七个孩子的丧亡，以及种种错综复杂的酷刑，这位勇毅的母亲在逐一拥抱他们[a]之后，因着对上帝的信心[b]，任他们离去。
  rationale: 修订主要解决汉语搭配、语序和希腊文分词时序。“丧亡”在本段语境中自然表达ἀπώλειαν所指向的毁灭性死亡；“在……之后”呈现ἀπάσασα相对主要动词ἐξέλυσεν的先行性。脚注继续保留两个存在合理争议的词语的替代译法，不在正文中强行消除歧义。
