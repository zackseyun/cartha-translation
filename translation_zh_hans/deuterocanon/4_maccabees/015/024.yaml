base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: zh_hans
  text: 尽管亲眼目睹自己的七个孩子的丧亡，以及种种错综复杂的酷刑，这位勇毅的母亲在逐一拥抱他们[a]之后，因着对上帝的信心[b]，任他们离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逐一拥抱他们”也可译作“逐一问候他们”或“逐一向他们告别”。
    reason: 原词ἀπάσασα具有问候、拥抱及告别等可能含义，语境不能完全排除其中任何一种。
  - marker: b
    text: “对上帝的信心”也可译作“对上帝的信靠”或“对上帝的忠信”。
    reason: πίστις在此既可侧重信心或信靠，也可能包含忠贞、忠信的意味。
lexical_decisions:
- source_word: καίπερ
  choice: 尽管
  rationale: 引出让步关系，突出母亲虽目睹惨状，仍采取随后所述的行动。
- source_word: ἑπτὰ τέκνων
  choice: 自己的七个孩子
  rationale: τέκνα本身不限定性别；上下文虽指儿子，本节仍保留较宽泛的“孩子”。“自己的”使现代汉语关系明确自然。
- source_word: ὁρῶσα
  choice: 亲眼看见
  rationale: 保留现在分词所表达的亲历、目睹之意；“亲眼”强化现场性，但未超出语境。
- source_word: ἀπώλειαν
  choice: 遭毁灭
  rationale: 保留该词“毁灭、丧亡”的强烈语义，不将其仅窄化为一般的“死亡”或“失去”。
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: 种种错综复杂的酷刑
  rationale: στρεβλά在此指酷刑或刑具；πολύπλοκος与ποικιλία共同突出酷刑繁多而复杂，译文以自然汉语呈现两层含义。
- source_word: ἀπάσασα
  choice: 一一拥抱他们
  rationale: 该动词可指问候、拥抱或告别；此处采用符合母子场景的“拥抱”，同时以脚注保留歧义。
- source_word: ἡ γενναία μήτηρ
  choice: 她这位勇毅的母亲
  rationale: γενναία兼有高尚、勇敢之意；“勇毅”突出勇气和坚忍，又保持庄重。
- source_word: ἐξελυσεν
  choice: 放他们离去
  rationale: 保留ἐκλύω“释放、松开、任其离去”的形象；在语境中指母亲不拦阻孩子走向殉难，而非表示她亲自造成其死亡。
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: 因着对上帝的信心
  rationale: διά加宾格表达原因；πρός保留朝向、关系性的意味，以“对上帝的”自然表达；πίστις主文译为“信心”。
theological_decisions:
- issue: πίστις的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 此处可强调母亲对上帝的信靠，也可能包含她向上帝所持的忠贞。主文用涵盖面较广且自然的“信心”，脚注保留其他可能。
- issue: 母亲“放他们离去”的能动性
  choice: 放他们离去
  alternative: 释放他们；任他们离去
  rationale: 译文保留原文释放或松开的隐喻，不把母亲描写为直接使孩子死亡，也不削弱她自愿不加拦阻的意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“勇毅”凝练呈现母亲的勇敢与坚忍；“错综复杂”与“种种”共同再现原文对酷刑繁复多样的强调。脚注标记均置于相关词语之后。
