  yaml_path: translation/deuterocanon/4_maccabees/015/021.yaml
  text: Not in this way do siren songs or swanlike voices with feminine sound draw those who hear[a], as the voices of children calling to their mother amid tortures.
translation:
  language: zh_hans
  text: 塞壬的歌声，或带有女性柔美特质的天鹅般声音[a]，都不能像孩子们在受酷刑时呼唤母亲的声音那样吸引听者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“塞壬的乐曲，或天鹅的声音，带有女性柔美的特质”。原文采用塞壬和天鹅的古典诗歌意象，描写具有强烈吸引力的声音；“带有女性柔美特质”对应希腊文πρὸς θηλυκίαν。
    reason: 说明塞壬与天鹅的古典意象，并交代πρὸς θηλυκίαν可作较直译的“带有女性柔美的特质”。
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: 塞壬的歌声
  rationale: 保留希腊神话中塞壬以歌声迷惑人的古典意象；“歌声”比“旋律”更自然，也与下文“声音”形成呼应。
- source_word: κύκνιοι πρὸς θηλυκίαν φωναί
  choice: 天鹅般柔美的声音
  rationale: κύκνιοι 表示“天鹅的、天鹅般的”；πρὸς θηλυκίαν 指向女性化、柔美的声音特质。译作“柔美”可表达其吸引力，又避免“女性化的声音”在现代汉语中的生硬或歧义。
- source_word: ἐφέλκονται
  choice: 吸引
  rationale: 该动词表示把人引向自己、吸引或诱引；“吸引听者”准确自然，并保留原文比较的核心。
- source_word: τέκνων φωναί
  choice: 孩子们……的声音
  rationale: 直译所属关系，同时保持这一感情强烈的复数主体。
- source_word: μετὰ βασάνων
  choice: 在酷刑中
  rationale: 表示孩子们呼喊时所处的受刑情境；“酷刑”保留 βασάνων 的严酷程度及复数所概括的多重折磨。
- source_word: μητέρα φωνούντων
  choice: 呼唤母亲
  rationale: φωνέω 在此指发声呼叫；“呼唤母亲”简洁地传达孩子们在受刑时向母亲喊叫。
theological_decisions:
- issue: 是否保留塞壬与天鹅的古典诗歌意象
  choice: 在正文中保留“塞壬”和“天鹅”
  alternative: 概括为“迷人的歌声”和“悦耳的声音”
  rationale: 原文以古典文化中极具吸引力的声音，与受刑孩子呼唤母亲的声音形成强烈对照；保留意象更忠于原文，也不引入教派性解释。
- issue: 比较结构中情感对象的范围
  choice: 保留泛指的“听者”
  alternative: 将听者具体化为“母亲”
  rationale: 原文明确使用 τοὺς ἀκούοντας（听见的人、听者），虽上下文聚焦母亲，译文不应把语法上的泛指对象缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“都不能像……那样”自然重现 οὐχ οὕτως…ὡς 的否定比较结构；“柔美”兼顾声音的女性特质与现代汉语可读性。
