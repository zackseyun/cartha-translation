  text: a mother[a], with two things set before her—piety[b], and the temporary safety of her seven sons according to the tyrant’s promise—
translation:
  language: zh_hans
  text: 一位母亲，面前摆着两样选择——敬虔[a]，以及照着暴君的承诺，使她七个儿子暂时保全性命[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔敬”或“对上帝的敬畏”。
    reason: lexical_alternative
  - marker: b
    text: “暂时保全性命”也可译作“暂时获救”或“暂时安全”。原文所用的词也可表示“拯救”或“救恩”，但这里指暴君承诺暂且饶过他们的性命。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: 一位母亲
  rationale: 原文名词无冠词，在此承接上下文并以同位或述谓方式出现；译作“一位母亲”符合现代汉语表达。
- source_word: δυεῖν προκειμένων
  choice: 面前摆着两样选择
  rationale: 保留“摆在面前”的意象，同时用“选择”自然表达两者构成抉择的语境。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: εὐσέβεια 在《马加比四书》中指向对上帝虔敬而忠贞的态度；“敬虔”简洁庄重，并保留其宗教含义。
- source_word: σωτηρίας προσκαίρου
  choice: 暂时保全性命
  rationale: σωτηρία 此处指暴君所许诺的生命获救或保存，πρόσκαιρος 则强调短暂；如此翻译可避免让人误解为终极或属灵的救恩。
- source_word: τῆς ἑπτὰ υἱῶν
  choice: 使她七个儿子
  rationale: 该属格短语从属于 σωτηρίας；根据“母亲”的语境补出“她”，使亲属关系在汉语中清楚自然。
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: 照着暴君的承诺
  rationale: κατά 加宾格表示依照或符合所承诺的条件；ὑπόσχεσις 直译为“承诺”。
theological_decisions:
- issue: 殉道语境中 εὐσέβεια 的译法
  choice: 敬虔
  alternative: 对上帝的敬畏；虔敬
  rationale: “敬虔”保留原词简洁而明确的宗教分量，也不把其含义限制为单纯情感上的敬畏；脚注说明其对象为上帝。
- issue: 非终末救恩语境中 σωτηρία 的译法
  choice: 保全性命
  alternative: 获救；安全；救恩
  rationale: 暴君提出的是让众子免于眼前死亡，并非属灵或终极救恩；“保全性命”准确呈现此处的现实指向，而“暂时”保留原文所强调的短暂性。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。经文在原文中是未完句，因此保留末尾破折号，以体现其继续连接下文的句法。
