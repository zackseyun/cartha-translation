  yaml_path: translation/deuterocanon/4_maccabees/015/025.yaml
  text: For just as[a], in her own soul as in a council chamber, she saw fearsome counselors—nature and birth and love for her children and the torture of her children—
translation:
  language: zh_hans
  text: 因为正如在议事厅中一样，她在自己的心灵里看见了几位可怕的谋士——天性、生育、对子女的疼爱，以及子女所受的酷刑[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“子女的刑架”；“刑架”在这里可借指他们所受的酷刑。
    reason: 保留στρέβλα所指刑具的字面意义及其转喻用法。
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 因为，正如……一样
  rationale: 兼顾γὰρ的解释性连接作用与καθάπερ所引出的比较；保留本节尚未完结的句法张力。
- source_word: ἐν βουλευτηρίῳ τῇ ἑαυτῆς ψυχῇ
  choice: 正如在议事厅中一样，她在自己的心灵里
  rationale: 将心灵比作议事厅，既保留βουλευτήριον的议事场所意象，也以自然汉语表达ψυχή作为内在思量之所。
- source_word: δεινοὺς ... συμβούλους
  choice: 几位可怕的谋士
  rationale: δεινός在此可指可怕、强大而难以抗拒；“谋士”延续议事厅的拟人化意象，并用“几位”配合后列的多项因素。
- source_word: ὁρῶσα
  choice: 她……看见了
  rationale: 将希腊语分词转为汉语限定义动词，使句子流畅而不改变主语与动作。
- source_word: φύσιν
  choice: 天性
  rationale: 保留φύσις所涵盖的自然本性或本能，不将其窄化为单一的母性本能。
- source_word: γένεσιν
  choice: 生育
  rationale: 在母亲与子女的语境中指向生育及由此产生的联系；采用简洁名词，保留原文抽象并列结构。
- source_word: φιλοτεκνίαν
  choice: 对子女的疼爱
  rationale: 准确表达对子女的深厚爱怜；不额外限定为某种教义化或理想化的母爱概念。
- source_word: τέκνων στρέβλαν
  choice: 子女所受的酷刑
  rationale: στρέβλα本指刑架等扭绞身体的刑具，此处可借刑具代指酷刑；正文采用现代读者易懂的转喻含义，字面可能性收入脚注。
