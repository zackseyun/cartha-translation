base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: zh_hans
  text: 同样，你这律法的守护者，虽从四面受情感冲动的洪流围困[a]，又受儿子们所受酷刑的强劲狂风冲击，却勇敢地经受住了因敬虔而起的风暴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情感冲动”也可译作“情感”或“情欲”。希腊语 πάθη 是《马加比四书》的关键词，常指理性必须驾驭的情感、欲望和冲动；在此也可能让人联想到苦楚。
    reason: lexical_alternative
  - marker: b
    text: 直译作“敬虔的风暴”；也可译作“为持守敬虔而遭受的风暴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοφύλαξ
  choice: 律法的守护者
  rationale: 该复合词指守护、持守律法的人；“守护者”既保留主动护卫之意，也适合此处对母亲的称呼，且不把原文未明说的“母亲”加进正文。
- source_word: πανταχόθεν
  choice: 四面
  rationale: 与“包围”连用，准确表达从各个方向被环绕的空间意象。
- source_word: πάθη
  choice: 情感冲动
  rationale: 本书常以 πάθη 指理性应当驾驭的情感、欲望和冲动。“情感冲动”比单说“情欲”范围更广，也比“激情”更能呈现其需要节制的一面；脚注保留其他可能译法。
- source_word: κατακλυσμός
  choice: 洪流
  rationale: 保留淹没性的水灾比喻，同时在现代汉语中自然有力。
- source_word: καρτεροῖς ἀνέμοις
  choice: 猛烈狂风
  rationale: καρτερός 在这里表示强劲、严酷；“猛烈狂风”延续全句的风暴意象。
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: 儿子们所受酷刑
  rationale: βάσανοι 指折磨或酷刑；属格在语境中指施加在她儿子们身上的酷刑。“所受”消除汉语中“儿子们的酷刑”可能被误解为儿子施刑的歧义。
- source_word: συνεχομένη
  choice: 逼迫
  rationale: 该分词有被压迫、困住或紧逼之意；“逼迫”与狂风意象配合自然。
- source_word: γενναίως
  choice: 勇敢地
  rationale: 清楚传达其勇气和高尚坚忍，适合现代叙述语体。
- source_word: ὑπέμεινας
  choice: 经受住了
  rationale: 既表达承受苦难，也突出坚持到底、没有屈服。
- source_word: τοὺς τῆς εὐσεβείας χειμῶνας
  choice: 敬虔的风暴
  rationale: χειμών 在此是恶劣风暴的比喻；εὐσέβεια 指对上帝的敬畏和忠贞。“敬虔”较准确地保留宗教内涵，同时不预先判定属格究竟表示风暴的性质还是缘由。
theological_decisions:
- issue: πάθη 在本书哲学及殉道语境中的含义
  choice: 情感冲动
  alternative: 情感；情欲；苦楚
  rationale: 《马加比四书》的核心论述是敬虔的理性驾驭 πάθη，因此此处更可能延续“情感与欲望冲动”的主题用语，而不只是外在苦难。正文采用较宽泛的“情感冲动”，脚注说明语义张力。
- issue: εὐσέβεια 的表达
  choice: 敬虔
  alternative: 虔敬；敬神
  rationale: 该词表示对上帝的敬畏与忠贞实践。“敬虔”简洁保留这一宗教维度，而不加入特定宗派解释。
- issue: τῆς εὐσεβείας 属格与“风暴”的关系
  choice: 敬虔的风暴
  alternative: 为敬虔而遭受的风暴
  rationale: 希腊语属格关系较为凝练，可能指因持守敬虔而来的风暴，也可能把这些考验描述为与敬虔相关的风暴。正文保留原文张力，脚注给出解释性译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留洪流、狂风和风暴连续展开的航海灾难意象；使用“虽……又……却仍……”清楚呈现原句的让步与坚忍。未在“律法的守护者”后增补原文此节未明说的身份称谓。
