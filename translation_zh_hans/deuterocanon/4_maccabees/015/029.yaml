base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: zh_hans
  text: 啊，民族之母[a]，律法的申冤者、敬虔的捍卫者、在因母爱而起的争战中夺魁者[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民族”也可译为“百姓”或“族群”；希腊文ἔθνος可指民族、人民或族群。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“经由内心深情之争战的夺魁者”。“内心深情”所译的σπλάγχνα字面指内脏，常比喻深切的情感或怜爱；在此母亲的处境中可指母爱。原文以竞技获奖的意象描写她所经历的考验。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ ἔθνους
  choice: 民族之母
  rationale: 保留呼格称颂的庄重语气；ἔθνος在此具有群体和公共层面的含义，“民族”简洁地传达其代表整个群体的角色，同时以脚注保留“百姓、族群”等可能。
- source_word: ἔκδικε τοῦ νόμου
  choice: 为律法伸冤的人
  rationale: ἔκδικος指替某一方伸张正义、申冤或报偿的人；译作“为律法伸冤”既保留其强烈的司法色彩，也比单用“报仇者”更符合现代汉语语境。
- source_word: ὑπερασπίστεια τῆς εὐσεβείας
  choice: 敬虔的捍卫者
  rationale: ὑπερασπίστεια表示积极保护或维护；εὐσέβεια在本书语境中兼有对上帝的敬畏和忠贞行为之意，“敬虔”能较完整地表达这种宗教与伦理内涵。
- source_word: διὰ σπλάγχνων ἀγῶνος
  choice: 母亲深情的争战
  rationale: σπλάγχνα本指内脏，转指由内而发的深情或怜爱；在这位母亲的处境中指天然的母爱。ἀγών兼有竞赛、搏斗和艰苦考验的意味，“争战”保留其张力。
- source_word: ἀθλοφόρε
  choice: 夺得奖赏的人
  rationale: ἀθλοφόρος指在竞技中取得并带走奖赏的人；此译明确保留竞技得胜的比喻，又符合现代汉语表达。
theological_decisions:
- issue: 如何翻译殉道语境中的εὐσέβεια
  choice: 敬虔
  alternative: 虔诚；敬畏
  rationale: “敬虔”兼顾对上帝的尊崇及由此表现出的忠贞行为，不把词义缩减为内在情感，也不引入后期宗派性的技术含义。
- issue: 如何理解διὰ σπλάγχνων ἀγῶνος的压缩表达
  choice: 母亲深情的争战
  alternative: 肺腑之情的争战；经过母爱而有的争战
  rationale: 原文描绘一场涉及天然母爱、内心怜惜的激烈考验，但διὰ与属格结构较为凝练。正文以自然汉语点明上下文中的母爱，脚注则保留“内在深情”的字面意象和结构上的开放性。
translation_notes:
  register: 采用庄重而可朗读的现代标准汉语，以连续的称号保留原文排比和呼格语气。“啊”与句末感叹号传达颂赞色彩；避免生硬音译及宗派性术语。
