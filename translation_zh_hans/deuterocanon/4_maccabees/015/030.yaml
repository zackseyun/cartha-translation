  yaml_path: translation/deuterocanon/4_maccabees/015/030.yaml
  text: O more noble than males in courage[a], and more manly than men in endurance.
translation:
  language: zh_hans
  text: 啊，你在刚毅上比男性更为高尚，在忍耐上比男人更有男子气概[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在忍耐上比男人更勇敢。”希腊文直译为“比男人更有男子气概”，刻意保留了以男性气概表达勇德的文字呼应。
    reason: 说明ἀνδρειοτέρα既可按语义译为“更勇敢”，也可按词源和修辞译为“更有男子气概”。
lexical_decisions:
- source_word: ἀρρένων
  choice: 男性
  rationale: 该词首先指生理性别上的男性；译作“男性”，可与后面的ἀνδρῶν“男人”形成原文刻意保留的区别。
- source_word: πρὸς καρτερίαν
  choice: 在刚毅上
  rationale: καρτερία兼有坚定、坚忍和勇毅之意；“刚毅”在简洁表达中保留了坚定与勇气两方面。
- source_word: γενναιοτέρα
  choice: 更为高尚
  rationale: γενναῖος可表示高贵、高尚，也可含英勇之意；此译保留道德上的崇高感，并让相邻的“刚毅”承载勇毅色彩。
- source_word: ἀνδρῶν
  choice: 男人
  rationale: ἀνήρ通常指成年男人；译作“男人”既自然，也与前面的“男性”保持修辞上的差别。
- source_word: πρὸς ὑπομονὴν
  choice: 在忍耐上
  rationale: ὑπομονή指在苦难或考验下坚持、忍耐；“忍耐”清楚自然，并符合本段受难语境。
- source_word: ἀνδρειοτέρα
  choice: 更有男子气概
  rationale: 该词与ἀνήρ“男人”同源，既可指勇敢，也明确带有当时文化中男性化勇德的色彩；此译保留“男人—男子气概”的文字呼应和反转效果。
theological_decisions:
- issue: 对母亲的性别化比较修辞
  choice: 明确保留“比男性……比男人更有男子气概”的阳性比较。
  alternative: 将其弱化为“比任何人都勇敢”或“比男人更勇敢”。
  rationale: 原文刻意以被视为男性特质的德性来称赞这位母亲胜过男性；保留性别用语，才能呈现其修辞张力，而不把它中性化。
translation_notes:
  register: 采用庄重而现代的感叹句。“啊，你……”补出希腊语呼语所指的第二人称，使中文完整自然；以“男性／男人”和“男人／男子气概”的差别与呼应，尽量再现原文的性别化修辞。
