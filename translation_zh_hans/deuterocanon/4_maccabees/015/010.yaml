  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: zh_hans
  text: 因为他们为人正直，克己自制，勇敢而心志高尚，又兄弟相爱；他们如此敬爱母亲，以至于甚至在遵守律法的规条至死时，仍听从母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: 为人正直
  rationale: 在这组德目中指道德上的正直端方；这样既保留伦理意味，也避免把此处过度术语化。
- source_word: σώφρονες
  choice: 克己自制
  rationale: 表达心思健全、能约束欲望的德性；现代汉语清楚自然。
- source_word: ἀνδρεῖοι
  choice: 勇敢
  rationale: 准确表达勇气，不引入希腊词形可能带出的男性化措辞。
- source_word: μεγαλόψυχοι
  choice: 心志高尚
  rationale: 保留“灵魂/心志宏大”的品格意味；比“宽宏大量”更少局限于待人慷慨。
- source_word: φιλάδελφοι
  choice: 兄弟相爱
  rationale: 上下文所指是七位亲兄弟，因此保留具体的兄弟关系。
- source_word: φιλόμητρος
  choice: 敬爱母亲
  rationale: 兼顾亲爱与忠诚顺服，比生硬直译“爱母的”自然。
- source_word: μέχρι θανάτου
  choice: 直到死
  rationale: 直接保留忠守律法所达到的极限。
- source_word: τὰ νόμιμα
  choice: 律法的规条
  rationale: 在马加比殉道语境中指祖传律法所规定的要求；译文不把范围缩限为礼仪或民事条例。
- source_word: φυλάσσοντας
  choice: 守着
  rationale: 与“规条”搭配，表示持续遵守、持守。
- source_word: πείθεσθαι αὐτῇ
  choice: 听从她的话
  rationale: πείθομαι在此可指顺从或听命；此译自然表达儿子们回应母亲的劝勉，同时不强化为不加分辨的服从。
theological_decisions:
- issue: δίκαιοι的道德与宗教意味
  choice: 为人正直
  alternative: 是义人
  rationale: 此处是德目并列，重点在他们的正直品格；“为人正直”保留伦理宗教背景，又不额外引入称义等教义术语。
- issue: 亲属德目中的性别与具体关系
  choice: 兄弟相爱
  alternative: 手足相爱
  rationale: φιλάδελφοι在当前叙事中指实际的七兄弟，故不将明确的兄弟关系泛化。
- issue: 守律法与听从母亲之间的句法张力
  choice: 即使守着律法的规条直到死，仍听从她的话
  alternative: 他们听从她的话，守律法直到死
  rationale: 保留希腊文分词结构与“即使/仍”的张力，不擅自把母亲的命令和律法要求合并成同一动作；上下文则表明二者并不冲突。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。德目列表以四字短语和自然并列呈现；后半句保留原文中守法至死与听从母亲同时出现的张力。
