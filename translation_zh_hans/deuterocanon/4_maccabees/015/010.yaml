  terminology: “正直、克己自制、勇敢、心志高尚、兄弟相爱、敬爱母亲、律法的规条”均与希腊文及语境相称。“听从她的话”可简化为“听从母亲”，既对应πείθεσθαι αὐτῇ，也更自然。
