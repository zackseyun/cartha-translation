  text: 他们的血肉像面具一样摆在他们面前[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆在他们面前”也可译作“陈列在他们面前”。
    reason: lexical_alternative
  - marker: b
