    reason: cultural_note
lexical_decisions:
- source_word: σάρκας
  choice: 块块血肉
  rationale: σάρξ的复数在殉道受刑的语境中具体指遭毁伤的肉体；“块块血肉”既体现复数，也保留原文强烈而直观的画面。
- source_word: ὥσπερ
  choice: 如同……一般
  rationale: 自然表达原文所引出的明喻，同时保持庄重的叙述语气。
- source_word: προσωπεῖα
  choice: 面具
  rationale: 该词通常指面具，尤其可指戏剧表演所用的面具；译作“面具”比“脸面”更准确地保留原文惊人的比喻。
- source_word: προκειμένας
  choice: 摆在眼前
  rationale: πρόκειμαι可指某物摆着、陈列在前；此处译法保留可见地置于面前的画面，又符合现代汉语表达。
