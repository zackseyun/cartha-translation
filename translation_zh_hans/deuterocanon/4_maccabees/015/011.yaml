base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/011.yaml
  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
translation:
  language: zh_hans
  text: 然而，尽管有如此多关乎爱子之情的因素拉扯这位母亲，使她生出同情，各式各样的酷刑也未能借着其中任何一种扭转她的理性判断[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“理性”；希腊语λογισμός强调人的理性机能和理性判断，是《马加比四书》的重要主题。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: 然而
  rationale: 表达强烈的让步转折，承接上文，同时符合现代汉语的庄重叙述风格。
- source_word: καίπερ
  choice: 尽管
  rationale: 自然引出让步分句，准确传达希腊语的让步关系。
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: 有那么多出于爱子之情的力量
  rationale: φιλοτεκνία指对子女的深厚亲爱；补出“力量”承接后面的“牵引”，既保留抽象表达，也使汉语通顺。
- source_word: εἰς συμπάθειαν ἑλκόντων τὴν μητέρα
  choice: 牵引这位母亲，使她心生同情
  rationale: 保留ἕλκω的拉扯、牵引意象，并将εἰς συμπάθειαν自然表达为趋向怜悯和共感。
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: 无一能
  rationale: 将其理解为前述诸般母爱牵引无一成为酷刑扭转她判断的凭借；简洁保留否定的逐一性。
- source_word: τὸν λογισμὸν αὐτῆς
  choice: 她自己的理性判断
  rationale: λογισμός是本书核心词，兼有理性机能与理性判断之意；“理性判断”比单说“理性”更自然，也不弱化其哲学意味。
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: 各样的酷刑
  rationale: παντοίκιλος强调种类繁多，βάσανοι在殉道语境中指酷刑；此译自然、准确而有力度。
- source_word: ἴσχυσαν μετατρέψαι
  choice: 能使……改变
  rationale: 表达“有能力扭转、使转向”的含义；因句中有否定，译成“却……无一能使……改变”符合现代汉语习惯。
theological_decisions:
- issue: 如何翻译本书具有哲学主题意义的λογισμός
  choice: 理性判断
  alternative: 理性；心志；决意
  rationale: “理性判断”保留本书关于理性驾驭情感的主题，又避免把该词缩减为纯粹意志性的“决意”或“心志”。脚注提示也可译作“理性”，以保留词义范围。
- issue: 母爱情感与理性坚定之间的张力
  choice: 保留“牵引……心生同情”与“不能改变理性判断”的对照
  alternative: 将母爱情感弱化为一般悲伤，或将理性判断强化为信仰决心
  rationale: 原文同时肯定母亲真实的亲子之爱与其判断未被扭转，不应消解这种情感和哲学上的张力，也不加入原文没有明说的宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“爱子之情”不限于儿子一词的狭义称谓，而按本节语境指母亲对子女的亲爱；“牵引”保留原文形象，“心生同情”传达母亲与受苦儿子一同感受痛苦的意味。
