base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
translation:
  language: zh_hans
  text: 但敬虔的理性[a]就在那些苦难之中，使她内心深处的情感刚强起来，并竭力撇开她暂时的爱子之情[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔敬的理性”。这个希腊语短语是《马加比四书》的关键用语，指受对上帝的敬畏所引导的理性。
    reason: 说明关键词的可选译法及其在本书中的特殊含义。
  - marker: b
    text: 直译“暂时的爱子之情”，也可译“短暂的母爱”。原文将母亲对子女的自然依恋，与她在苦难中坚定持守忠信并置。
    reason: 说明πρόσκαιρον φιλοτεκνίαν的字面意义，并避免误解为对母爱本身的否定。
lexical_decisions:
- source_word: σπλάγχνα
  choice: 内心
  rationale: 本义为人体内部的脏腑，在这里比喻人内在深切的情感。“内心”在现代汉语中自然明白，也保留其内在情感所指。
- source_word: εὐσεβὴς λογισμός
  choice: 敬虔的理性
  rationale: 这是《马加比四书》的关键用语，兼具理性思量与对上帝虔敬的维度；此译法不将其缩减为单纯的理智或宗教情感。
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: 即使在那些苦难之中
  rationale: πάθη在语境中指所受的苦难或折磨，而非内在激情；“即使……之中”体现αὐτοῖς τοῖς的强调意味。
- source_word: ἀνδρειώσας
  choice: 使……刚强起来
  rationale: 该分词表示使之勇敢、坚强；此译法保留主动施力的含义，同时避免采用带有不必要性别色彩的表达。
- source_word: ἐτέτεινεν
  choice: 竭力
  rationale: 该动词传达伸展、绷紧而奋力为之的意味；“竭力”能自然表达意志与情感上的强烈用力。
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: 一时的爱子之情
  rationale: φιλοτεκνία指父母对子女的疼爱，语境中特指母爱；πρόσκαιρον强调其属暂时、眼前层面，与持守敬虔形成张力，并非断言母爱本身邪恶。
- source_word: παροδεῖν
  choice: 撇开
  rationale: 本义为从旁经过、越过，进而表示不予顾念；“撇开”既自然，也表达在忠信抉择中暂不受这种情感牵制。
theological_decisions:
- issue: 如何翻译全书纲领性短语εὐσεβὴς λογισμός
  choice: 敬虔的理性
  alternative: 虔敬的理性；敬神的理性
  rationale: “敬虔的理性”同时保留λογισμός的理性维度和εὐσεβής的宗教敬畏维度，不套入后来的哲学体系或宗派教义。
- issue: 如何表达πρόσκαιρον φιλοτεκνίαν而不把母爱本身说成罪恶
  choice: 一时的爱子之情
  alternative: 短暂的母爱；眼前的爱子之情
  rationale: 原文把自然的亲子依恋置于殉道苦难与持守敬虔的张力中；“一时的”保留时间性的对比，却不额外贬抑母爱本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“即使……也……”呈现苦难中的反差与强调；“使她的内心刚强起来，竭力撇开”保留原文中敬虔理性作为主语，以及母亲内在情感与忠信抉择之间的张力。
