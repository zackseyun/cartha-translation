  text: As she watched each one being tortured and burned[a], the mother did not change because of her piety.
translation:
  language: zh_hans
  text: 母亲眼看着他们一个个受酷刑、被火焚烧[a]；因着敬虔，她仍没有改变心志。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个个在刑架上受扭绞或拉伸之刑、被火焚烧。”译作“受酷刑”的希腊词也可特指在刑架上遭受扭绞或拉伸之刑。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἓν
  choice: 一个个
  rationale: 该短语具有逐一、分别的分配意义；“一个个”自然地表达众子依次受难。
- source_word: στρεβλούμενον
  choice: 受刑
  rationale: 此词表示遭受扭绞或拉伸等酷刑；正文采用较宽泛而自然的“受刑”，具体的刑架含义留在脚注中。
- source_word: φλεγόμενον
  choice: 被火焚烧
  rationale: 该分词表示正在燃烧或遭火烧；“被火焚烧”保留受害者被动承受的暴烈意象。
- source_word: ὁρῶσα
  choice: 眼看着
  rationale: 现在分词描写母亲亲眼目睹持续发生之事；“眼看着”兼具时间背景和亲历意味。
- source_word: μήτηρ
  choice: 母亲
  rationale: 希腊文仅作带冠词的“母亲”；上下文已明确其身份，无须增添原文没有的所有格。
- source_word: οὐ μετεβάλετο
  choice: 却没有……改变心志
  rationale: 动词本义为改变、转变；结合语境补出“心志”，使中文清楚表达她并未动摇，同时避免把意义限定为某一种具体行动。
- source_word: διὰ τὴν εὐσέβειαν
  choice: 因她的敬虔
  rationale: εὐσέβεια是本书的重要德性用语，指向对上帝的虔敬及由此表现的忠贞；“敬虔”比泛称“虔诚”更能保留其道德—宗教分量。
theological_decisions:
- issue: 希腊文 διὰ τὴν εὐσέβειαν 与 οὐ μετεβάλετο 的关系
  choice: 没有因她的敬虔而改变心志
  alternative: 她因着敬虔而没有动摇
  rationale: 保留希腊文较直接的因果表达与“改变”这一动词，不把语义完全解释成“坚定不移”；同时以“心志”使现代中文可理解。
- issue: εὐσέβεια在希腊化犹太殉道语境中的译法
  choice: 敬虔
  alternative: 虔诚；对上帝的敬畏
  rationale: “敬虔”能作为全书反复出现的德性术语，涵盖对上帝的尊崇、忠诚与顺服，而不把它缩减为情感或笼统宗教态度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“眼看着”突出母亲亲历其事，“改变心志”既贴近原文“改变”的措辞，也使中文语义完整。脚注保留στρεβλόω可能专指刑架酷刑的词义。
