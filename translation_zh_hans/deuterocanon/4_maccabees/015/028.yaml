  text: But the daughter remembered the steadfastness of Abraham, who feared God.
translation:
  language: zh_hans
  text: 但那女儿想起了敬畏上帝的亚伯拉罕的坚忍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏上帝的”也可译作“敬虔的”或“敬畏神的”。
    reason: 说明θεοσεβοῦς可采用的近似译法。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 表示与上文相反或转折的关系；“但”简洁自然。
- source_word: θεοσεβοῦς
  choice: 敬畏上帝的
  rationale: 该形容词指对上帝心存敬畏、虔诚，并在原文中直接修饰亚伯拉罕；此译法保留明确的“上帝”所指。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: καρτερίας
  choice: 坚忍
  rationale: 该词表示在压力或苦难中坚定忍耐、毫不退缩；“坚忍”兼顾忍耐与坚定的意味。
- source_word: ἡ θυγάτηρ
  choice: 这位女儿
  rationale: 原文是带定冠词的“女儿”，却没有明说所属关系；“这位”表达语境中的特指，同时避免擅自添加“他的”或“她的”。
- source_word: ἐμνήσθη
  choice: 想起了
  rationale: 该不定过去时动词表示记起、忆及；“想起了”符合现代汉语叙事表达。
theological_decisions:
- issue: θεοσεβοῦς是否保留明确的上帝指向
  choice: 敬畏上帝的
  alternative: 虔敬的；敬神的
  rationale: 原词含有明确的θεο-（上帝、神）成分，并将亚伯拉罕描绘为敬畏上帝的榜样；译文保留这一指向，同时不把它扩展为特定宗派意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“亚伯拉罕那份坚忍”避免连续使用两个“的”，又保留θεοσεβοῦς修饰亚伯拉罕、καρτερίας作为“想起”的对象这一原文结构。
