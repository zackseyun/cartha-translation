base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: zh_hans
  text: 第三个儿子临终时，你也没有哭泣；当你看见他们每一个人都以公牛般的目光看着酷刑和同样的凌虐，又看见他们的鼻孔预示着死亡时，你没有哭泣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: 第三个儿子临终时，你也没有哭泣
  rationale: 原文省略了“儿子”，承接上下文中母亲的众子；ἀποψύχων表示生命消逝、临终。用“临终时”保留含义并使中文自然。
- source_word: θεωροῦσα
  choice: 你看着
  rationale: 该分词描述母亲亲眼观看众子受难；“看着”既自然，也能表现持续目睹的意味。
- source_word: ταυρηδόν
  choice: 像公牛一般，无畏地
  rationale: 该副词直译为“如公牛般”，在句法上紧连众子的目光。正文保留公牛意象，并以“无畏地”点明这种目光所呈现的刚强气势，而不把比喻改写成抽象品质。
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας
  choice: 直视酷刑
  rationale: βάσανοι可指酷刑、折磨，也可能包含刑具场景；“直视酷刑”简洁地表达他们面对眼前折磨而不退缩。
- source_word: τὸν αὐτὸν αἰκισμόν
  choice: 同样的凌虐
  rationale: αἰκισμός指残酷虐待、凌辱或折磨；“凌虐”与前面的“酷刑”有所区分，也保留“同样”所指向的共同遭遇。
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: 他们的鼻息已预示死亡
  rationale: μυκτῆρες本指鼻孔，结合临死情景可自然表达为“鼻息”；προσημειουμένους有预先显示、预示之意。此译保留原文鲜明而略显奇特的身体意象。
- source_word: οὐκ ἔκλαυσας
  choice: 你也没有哭泣
  rationale: κλαίω意为哭泣；否定陈述承接前文反复出现的“也没有”，表现对母亲坚忍的直接称述。
theological_decisions:
- issue: 省略主语的补足
  choice: 补出“儿子”
  alternative: 译作“第三个临终时”而不补名词
  rationale: 本节所在语境明确谈论母亲的儿子；补出“儿子”只澄清原文依上下文省略的所指，不增添新的神学主张。
- issue: 公牛意象所修饰的对象
  choice: 将“像公牛一般”连接于众子的眼睛和直视酷刑的姿态
  alternative: 泛指他们受刑时整体如公牛般刚强
  rationale: ταυρηδόν在句法上最贴近“眼睛”及“看着”，因此保留其与目光的直接关系，同时不排除它也映照众子的整体刚毅。
- issue: 鼻孔预示死亡这一意象
  choice: 译为“鼻息已预示死亡”
  alternative: 较字面地译为“鼻孔预示死亡”
  rationale: “鼻息”符合临终呼吸的可见征象，也保留死亡迫近的身体图景；脚注注明希腊文直说“鼻孔”，避免把可能含混的意象完全解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“像公牛一般”和“预示死亡”的强烈原文意象；为避免中文把“眼睛像公牛”误解为形状相似，加入“无畏地直视”，使比喻自然落在目光的气势上。
