  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
translation:
  language: zh_hans
  text: 她因敬畏上帝，就不顾儿女暂时的保全[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“儿女一时的获救。”这里的“保全”指短期内身体或性命得以保存，并非永恒的救恩。
    reason: 说明 σωτηρία 在 πρόσκαιρον 限定下的语境意义，并保留“获救”这一词义选择。
lexical_decisions:
- source_word: διὰ τὸν πρὸς τὸν θεὸν φόβον
  choice: 因敬畏上帝
  rationale: διά接宾格表示原因；φόβος在此以上帝为指向，兼有畏惧与虔敬的分量。现代汉语“敬畏上帝”自然凝练，也保留了较强的圣经用语。
- source_word: ὑπερεῖδεν
  choice: 不顾
  rationale: 该动词表示越过不看、置之不理；这里不是没有察觉儿女可能获救，而是因更高的忠诚而不把这种可能放在首位。“不顾”准确传达这种取舍。
- source_word: τὴν τῶν τέκνων πρόσκαιρον σωτηρίαν
  choice: 儿女们暂时的保全
  rationale: σωτηρία在本句受πρόσκαιρον限定，指现世、短期的获救或性命得以保存，而非末世或属灵意义上的救恩。“保全”保留获救与保存之间的语义空间。
- source_word: τῶν τέκνων
  choice: 儿女们
  rationale: τέκνα指孩子；上下文说明是这位母亲的儿女，汉语无需另加“她的”也能清楚表达所属关系。
- source_word: πρόσκαιρον
  choice: 暂时的
  rationale: 表示只持续一时、非长久的；“暂时的”直接保留其时间限制。
theological_decisions:
- issue: φόβος用于人与上帝的关系时如何表达
  choice: 敬畏上帝
  alternative: 对上帝的惧怕；在上帝面前的敬畏
  rationale: “敬畏”既不把φόβος弱化成一般尊敬，也不将其解释成单纯恐慌，保留虔敬与畏惧并存的张力。
- issue: σωτηρία在本句中的含义
  choice: 暂时的保全
  alternative: 暂时的解救；一时的获救
  rationale: πρόσκαιρον将σωτηρία限定为短期、肉身层面的解救或保存。译作“保全”可避免读者误以为这里说的是永恒救恩，同时不完全排除“获救”的动态意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她”承接上下文中的母亲；“就”使因果关系自然清楚。“不顾”保留原文行为判断的力度，而不进一步解释其伦理或教义含义。
