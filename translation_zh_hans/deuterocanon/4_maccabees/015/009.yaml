base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/009.yaml
  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: zh_hans
  text: 不仅如此，她还因为儿子们品德高尚、顺从律法，而更加疼爱他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καί
  choice: 不仅如此……也
  rationale: 该组合在此承接上文并递进补充，不只是表达转折；用“不仅如此……也”自然传达累加语气。
- source_word: καλοκἀγαθίαν
  choice: 品德高尚
  rationale: 此词指良善、德行与高贵品格；“品德高尚”在现代汉语中清楚而庄重，也避免被误解为社会身份上的高贵。
- source_word: εὐπείθειαν
  choice: 顺从
  rationale: 该词表示乐意听从、服从；与“律法”搭配时，“顺从”既自然，又保留主动响应的意味。
- source_word: νόμον
  choice: 律法
  rationale: 上下文所指是犹太祖传律法；中文宗教与历史语境中用“律法”比一般性的“法律”更准确。
- source_word: μείζω
  choice: 越发
  rationale: 比较级表明她对儿子们的亲爱因此更为强烈；“越发”以自然汉语呈现这种增强。
- source_word: φιλοστοργίαν
  choice: 疼爱
  rationale: 此词指亲属之间自然、深厚的亲爱。主语是母亲、对象是儿子，因此“疼爱”自然体现母爱，同时不把词义扩展成抽象的神学概念。
theological_decisions:
- issue: 是否把 φιλοστοργία 的母爱色彩明确表达出来
  choice: 译作“疼爱他们”，借主语和汉语用词自然体现母亲对儿子的亲爱
  alternative: 译作“对他们有更深的亲情”或“更加爱他们”
  rationale: 希腊词本身泛指亲属间的自然亲爱，但本句主体明确是母亲。译作“疼爱”符合语境，又不需要额外加入“母亲般的”等解释性成分。
- issue: νόμος 是否专指犹太律法
  choice: 译作“律法”
  alternative: 译作“法律”或加专名号写作“律法”
  rationale: 语境明显涉及祖传的犹太律法；“律法”能准确提示这一背景，同时不额外加入希腊文本未明说的限定语。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。句式保留原文的递进与因果关系，以“品德高尚”表达伦理意义上的 καλοκἀγαθία，避免“高贵”可能带来的门第联想；以“疼爱”呈现母子语境中的 φιλοστοργία。
