base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: zh_hans
  text: 啊，理性[a]，你这辖制儿女情感冲动的暴君！敬虔比儿女更为母亲所渴慕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头高度压缩，直译可作：“啊，理性，儿女情感冲动的暴君！”这里“暴君”是强烈而反常的比喻，指理性对情感冲动的强势辖制。
    reason: alternative_reading
  - marker: b
    text: 或译：“对母亲来说，敬虔比儿女更可爱慕。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμέ
  choice: 理性
  rationale: 此处是呼格，拟人化地称呼本书反复颂扬的理性判断能力；“理性”比“推理”更适合庄重的直接呼告。
- source_word: τέκνων παθῶν
  choice: 儿女之情
  rationale: 两个属格构成高度压缩的表达，可能指儿女的情感冲动，也可能使人联想到对儿女的亲情；正文用含义较宽的“儿女之情”保留这种张力。
- source_word: τύραννε
  choice: 暴君
  rationale: 保留 τύραννος 强烈而反常的比喻，表现理性对情感的强势辖制，不弱化为一般的“主人”或“统治者”。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 在本书的犹太殉道语境中，指向对上帝及其律法的虔敬忠诚；“敬虔”兼具宗教指向和现代可懂性。
- source_word: μητρί
  choice: 对母亲来说
  rationale: 以自然汉语表达与格所标明的评价主体，即母亲所作的价值取舍。
- source_word: ποθεινοτέρα
  choice: 更值得渴慕
  rationale: 保留比较级以及 ποθέω 词族所含的强烈向往之意，同时避免生硬的“更被渴望”。
theological_decisions:
- issue: 敬虔与母爱之间的比较
  choice: 敬虔对母亲来说，比儿女更值得渴慕
  alternative: 母亲爱敬虔胜过爱儿女
  rationale: 原文比较的是何者更令人渴慕，并未直接使用“爱”这一动词；正文保留其尖锐的价值比较，不将其改写成较平缓的解释。
- issue: 首句压缩结构中 τέκνων 的归属
  choice: 儿女之情
  alternative: 儿女的情欲／对儿女的感情
  rationale: τέκνων 与 παθῶν 的属格关系简短而可能产生不同理解；正文不武断限定为儿女自身的欲望或母亲对儿女的感情，脚注说明歧义。
translation_notes:
  register: 采用庄重而现代的感叹语气；以“啊……你这……”再现呼格和拟人化修辞。“暴君”刻意保留原文的强烈悖论，“敬虔”则维持犹太信仰与守律法语境，不引入后世宗派术语。
