  text: I did not recognize the salvation that was saving seven sons for a little while[a].
translation:
  language: zh_hans
  text: 我没有认出那使七个儿子暂时得以保全的拯救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我没有认出那暂时救下七个儿子的救助。”
    reason: 原文ἐπέγνων可指“认出、察觉或明白”；σωτηρία可译“拯救、解救或救助”。“暂时”对应“为时不久”，表明所说的是短期的保全。
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: 我没有认可
  rationale: ἐπιγινώσκω可表示认出、认识或承认；这里不是说母亲不知道有暂时免死的可能，而是说她没有把这种选择视为真正可取的拯救。“没有认可”保留认知与接纳之间的张力，且不过度缩减为单纯“没有理解”。
- source_word: τὴν σώζουσαν … σωτηρίαν
  choice: 那只能使……保全性命的拯救
  rationale: 同一词根的分词 σώζουσαν 与名词 σωτηρίαν形成刻意重复。中文若直译为“使……得救的救恩”容易被限定为属灵意义，因此以“保全性命”点明眼前的暂时存活，同时保留“拯救”所具有的较宽含义。“只能”使后面的时间限制自然地修饰这种拯救，并未改变其限制性语义。
- source_word: ἑπτὰ υἱοὺς
  choice: 七个儿子
  rationale: υἱούς明确指男性后代，且上下文所述正是母亲的七个儿子，不泛化为“孩子”。
- source_word: πρὸς ὀλίγον χρόνον
  choice: 暂时
  rationale: 该短语表示持续时间很短；“暂时”在现代汉语中简洁自然，并清楚限定这种保全性命只是短期的。
theological_decisions:
- issue: 殉道语境中 σωτηρία 的含义
  choice: 以“拯救”为主词，并用“保全性命”和“暂时”表明眼前所指是短期免死
  alternative: 译作“救恩”，侧重属灵拯救；或译作“解救／保全”，完全限于现世意义
  rationale: 本句的时间限定表明，前景是七个儿子短暂保住性命，而非明确论述终极或属灵救恩；但 σωτηρία 本身含义较宽，译作“拯救”可避免把神学张力完全消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“认可”表达说话者拒绝把短暂免死当作真正可取的拯救；“保全性命”避免“救恩”在中文中可能造成的过度属灵化。脚注标记已置于正文。
