  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: zh_hans
  text: 那么，当她的儿子们正受轮刑和烙具[a]折磨时，这位母亲自己承受了何等深重、何其反复的折磨[b]啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烙具”指用来灼烧或烙灼人的刑具，也可译作“烧灼器具”或“烙铁”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文用同根的动词和名词，近似于“以折磨受折磨”，借重复加强语气。这里所说母亲的折磨，并未明确表示她也亲身遭受了轮刑和烙灼。
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: πηλίκοις καὶ πόσαις
  choice: 何等深重、何其反复
  rationale: 两个并列的疑问形容词在此构成带感叹意味的修辞问句，分别强调痛苦的程度和反复性；这样译成现代汉语，既保留双重强调，也避免生硬的“多大、多少次”。
- source_word: τότε
  choice: 那么
  rationale: 承接上文并引出对当时情景的修辞性总结，比单纯的“那时”更贴合此处论述语气。
- source_word: ἡ μήτηρ
  choice: 这位母亲
  rationale: 原文有定冠词而无所有格；“这位母亲”自然指向上下文中的母亲，又不增添原文未明说的“他们的”。
- source_word: βασανιζομένων
  choice: 正受……折磨
  rationale: 现在时分词表达儿子们当时正在遭受的严酷苦刑；“折磨”可同时涵盖具体刑罚及其痛苦。
- source_word: τροχοῖς
  choice: 轮刑
  rationale: 原文为复数“轮子”，在刑罚语境中指以轮具施刑；译作“轮刑”能让现代读者明白其刑具用途，又不具体断定其构造。
- source_word: καυτηρίοις
  choice: 烙具
  rationale: 指用于灼烧、烙灼的器具；“烙具”比音译式专业词自然，也比“烙铁”稍宽，保留器具种类上的不确定性。
- source_word: ἐβασανίζετο βασάνοις
  choice: 自己承受了……折磨
  rationale: 原文以同根动词和名词叠用，加强修辞力度。汉语若直译为“被折磨所折磨”会十分拗口，因此以“承受……折磨”表达同一强烈含义，并用“自己”凸显母亲也在受苦，而不暗示她亲身遭受同样刑具。
theological_decisions:
- issue: 母亲所受痛苦的性质
  choice: 明确她承受真实而深重的折磨，但不说明她本人也遭到轮刑和烙灼。
  alternative: 将母亲理解为也亲身遭受类似肉体刑罚；或将其痛苦弱化为一般性的悲伤。
  rationale: 语法上，“轮刑和烙具”直接修饰儿子们所受的折磨；与此同时，ἐβασανίζετο βασάνοις以强烈的同根表达描述母亲。因此译文既保留她所受痛苦的严酷性，也不越过原文断定其具体机制。
- issue: 句子的修辞形式
  choice: 采用感叹式反问语气，以“啊”收束。
  alternative: 译成平直的信息问句：“母亲受了多大、多少次折磨呢？”
  rationale: πηλίκοις καὶ πόσαις置于句首，重点不是索取答案，而是感叹母亲痛苦之深且反复；汉语感叹式表达更能传达原文修辞力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“何等深重、何其反复”重现句首双重修辞强调；“轮刑”“烙具”兼顾可懂性与原文的刑具意象。主句用感叹式反问呈现原文强烈语势，同时避免把母亲所受的痛苦具体化为与儿子相同的肉体刑罚。
