  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
translation:
  language: zh_hans
  text: 因为母亲越是心灵软弱[a]、儿女越多，就越疼爱儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵软弱”也可译作“胆怯”。希腊文直指心灵或性情上的软弱，确切含义可涵盖情感脆弱或缺少勇气。
    reason: lexical_alternative
  - marker: b
    text: “越疼爱儿女”直译为“越爱儿女”。原词是比较级，表示对儿女更为疼爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: 越是……越是……就越……
  rationale: 用现代汉语的关联比较句保留希腊文所表达的程度递进和比例关系。
- source_word: ἀσθενόψυχοι
  choice: 心性柔弱
  rationale: 保留“魂/心灵软弱”的构词意象，同时避免把含义局限为胆怯；其语义也可能涉及情感脆弱或缺少勇气。
- source_word: πολυγονώτεραι
  choice: 越是儿女众多
  rationale: 该词为比较级，指生育或拥有较多儿女；这一表达既保留比较意味，也符合现代汉语习惯。
- source_word: ὑπάρχουσιν
  choice: 是
  rationale: 此处用作系词，汉语不必单独明译，由“越是”结构自然承载。
- source_word: αἱ μητέρες
  choice: 母亲
  rationale: 直接对应原文主语，并采用汉语泛指单数形式。
- source_word: φιλοτεκνώτεραι
  choice: 越疼爱自己的儿女
  rationale: 表达对儿女深厚的爱与眷恋，并用“越”明确保留比较级。
