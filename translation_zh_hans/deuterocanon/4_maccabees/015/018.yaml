  text: O only woman who gave birth to godliness in its fullness[a][b].
translation:
  language: zh_hans
  text: 啊，独一无二的妇人，你生出了完整无缺的敬虔！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独一无二的妇人”也可译作“唯一的妇人”或“唯独你这妇人”。希腊文强调她在妇人中具有无可比拟的独特性。
    reason: lexical_alternative
  - marker: b
    text: “敬虔”也可译作“虔诚”。希腊文 εὐσέβεια 是《马加比四书》的关键词，表示对上帝虔敬而忠贞。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: 啊
  rationale: 表示呼语中的感叹，并保留原文高昂、赞叹的修辞语气。
- source_word: μόνη γύναι
  choice: 唯一的妇人
  rationale: μόνη强调她独一无二、唯独她如此；γύναι是对女性的直接称呼，此处不宜限定为“妻子”。
- source_word: τὴν εὐσέβειαν
  choice: 敬虔
  rationale: εὐσέβεια在《马加比四书》中指向对上帝虔敬而忠贞的态度与实践；“敬虔”简洁地保留其宗教指向。
- source_word: ὁλόκληρον
  choice: 完整的
  rationale: 表达整体无缺、完备的意思，修饰“敬虔”，不额外引入道德上绝对无罪的含义。
- source_word: ἀποκυήσασα
  choice: 孕育出了
  rationale: 保留ἀποκυέω的生育意象，同时以自然汉语表达她如同使完整的敬虔诞生；措辞也容纳生育与成果之间的修辞张力。
theological_decisions:
- issue: 把生育用语用于抽象的“敬虔”
  choice: 保留生育隐喻，译作“孕育出了完整的敬虔”
  alternative: 成就了完全的敬虔
  rationale: 原文明确采用分娩、生育用语，并与上下文对母亲的描写相呼应；若改成“成就”，会削弱母性意象。
- issue: εὐσέβεια的宗教指向
  choice: 敬虔
  alternative: 虔诚
  rationale: “敬虔”既能表达对上帝的敬畏与忠贞，也避免把该词缩减为一般性的虔诚情感。
translation_notes:
  register: 采用庄重而可懂的现代书面汉语。“啊”体现赞叹性的呼语；“妇人”略带庄严色彩，符合篇章的颂赞语体。主句保留原文大胆的生育隐喻，并用两个感叹号位置中的一个句末感叹号自然呈现汉语修辞。
