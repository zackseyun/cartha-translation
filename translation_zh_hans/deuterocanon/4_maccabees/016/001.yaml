    reason: 说明紧缩句法，并保留 ὁλολυγμένων“哀号／呼号”的较直译含义；“在酷刑中”是由上下文说明场景，不置入正文。
  revision_rationale: 修订将原文明确的“孩子们哀号”置于正文，而不把上下文推知的“受苦”扩写为该分句的明说内容；同时调整同位语和时间结构，使现代汉语更自然。脚注锚点应置于“哀号”之后。
