review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确保留了条件—结论的论证结构、老妇兼为母亲的递进描述、忍受至死的酷刑，以及“敬神的理性”对“情欲”的主宰关系。不过，“受苦”并非该紧缩分句中明说的词；原文可明确译出的核心是母亲看见孩子们哀号。宜将上下文所推知的受刑场景留在脚注，避免正文把推断当作原文的明说内容。
  naturalness: “眼看自己的孩子受苦哀号”通顺，但“眼看”与“仍忍受了”之间的时间关系可用“看着……时”表达得更清楚。将同位语改为“一位年迈、又是孩子们母亲的妇人”，既自然，也更直接呈现原文的三层强调。
  terminology: “敬神的理性”“情欲的主宰”可保留：前者兼顾 εὐσεβής 与 λογισμός，后者保留 αὐτοκράτωρ 的支配力度及 πάθη 在本书中的术语色彩。
  issues:
  - severity: medium
    issue: 正文将“受苦”写入紧缩的“ὁρῶσα τῶν τέκνων ὁλολυγμένων”分句。
    rationale: ὁλολυγμένων 明确指大声哀号／呼号；受苦和受刑虽由上下文强烈支持，却不是该分句逐字表达的内容。应在正文保留“看着孩子们哀号”，并在脚注说明其所处的酷刑场景及句法困难。
  - severity: low
    issue: “一个年迈而又身为人母的女人”略显重复且不如原文的递进同位语自然。
    rationale: “一位年迈、又是孩子们母亲的妇人”更符合现代庄重汉语，并保留 γυναῖκα、γεραιά、ἐπὶ παίδων μήτηρ 三项强调。
  revised_text: 这样说来，如果连一个妇人——一位年迈、又是孩子们母亲的妇人——在看着自己的孩子们哀号时，仍忍受了直至死亡的酷刑，那么，敬神的理性就是情欲的主宰。
  revised_footnotes:
