  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: zh_hans
  text: 这样说来，如果连一个妇人——一位年迈、又是孩子们母亲的妇人——在看着自己的孩子们哀号时，仍忍受了直至死亡的酷刑，那么，敬神的理性就是情欲的主宰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: 这样说来，如果……那么
  rationale: 保留条件句及其推论语气，同时以现代汉语自然地承接上文。
- source_word: γυνὴ καὶ γεραιὰ καὶ ἐπὶ παιδῶν μήτηρ
  choice: 一个女人——一个年迈而又身为人母的女人
  rationale: 逐层保留“女人、年迈、母亲”三重强调；“身为人母”比直译“孩子的母亲”更自然，也不把孩子限定为儿子。
- source_word: ὑπέμεινεν
  choice: 仍忍受了
  rationale: 表达在极端痛苦下坚持承受的含义；“仍”显出原句 καὶ 所加强的反常与让步意味。
- source_word: τὰς μέχρι θανάτου βασάνους
  choice: 直至死亡的酷刑
  rationale: βασάνοι 指外加的酷刑，不是泛指苦难；μέχρι θανάτου 表明酷刑延续或达到死亡。
- source_word: ὁρῶσα τῶν τέκνων· ὁλολυγμένων
  choice: 眼看自己的孩子受苦哀号
  rationale: 希腊文句法压缩且传本文字难解；译文保留“看见孩子”与 ὁλολυγμένων 所含的大声哀号意象，并以“受苦”交代上下文场景。
- source_word: αὐτοκράτωρ
  choice: 主宰
  rationale: 表示拥有支配权、能够辖制；“主宰”适合本书哲学论证，又比“专制者”自然准确。
- source_word: τῶν παθῶν
  choice: 情欲
  rationale: πάθη 在本书中是受理性辖制的激情、冲动和欲望，不只是中性的“情感”；“情欲”保留其哲学和道德色彩。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  rationale: εὐσεβής 表示对神的虔敬，λογισμός 指理性判断或思考能力；“敬神的理性”同时保留宗教与理性两方面。
theological_decisions:
- issue: 敬神的理性与情欲之间的关系
  choice: 敬神的理性就是情欲的主宰
  alternative: 敬虔的理智能够完全控制各种激情
  rationale: 采用“主宰”保留 αὐτοκράτωρ 的强烈支配含义，却不扩写成一套关于情感本身有罪或理性绝对无误的教义。
- issue: 条件句的论证力度
  choice: 如果……那么
  alternative: 既然……可见
  rationale: 原文以 Εἰ 引出条件论证；虽在语境中近于事实性推论，正文仍保留条件形式，避免把其修辞逻辑直接改写为无条件断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这样说来”承接论证，“身为人母”避免生硬直译；保留本书核心术语“敬神的理性”和“情欲的主宰”。脚注标记 [a] 已置于正文相应位置。
