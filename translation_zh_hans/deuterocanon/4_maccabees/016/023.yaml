  yaml_path: translation/deuterocanon/4_maccabees/016/023.yaml
  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
translation:
  language: zh_hans
  text: 因为他们知道敬虔并非不合乎理性，便没有在这些痛苦面前退缩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句法十分凝练。较直译可作：“因为他们知道敬虔并非无理，便不抗拒这些痛苦。”其中“抗拒这些痛苦”在汉语中可理解为不肯承受；正文用“在这些痛苦面前退缩”表达其在受难语境中的意思。
    reason: 说明压缩句法，并交代μὴ ἀνθίστασθαι τοῖς πόνοις的较直译与自然汉语表达之间的关系。
lexical_decisions:
- source_word: ἀλόγιστον
  choice: 不合情理
  rationale: 该词指“不合理、缺乏理性”。译作“不合情理”既保留理性判断的意味，也符合现代汉语表达；按希腊语的自然句法，它可作整个不定式结构的表语。
- source_word: εἰδότας εὐσεβεῖν
  choice: 明知应当敬虔度日
  rationale: εἰδότας是“知道”的分词，εὐσεβεῖν指敬虔地生活、履行对上帝的虔敬。这里译作“明知应当敬虔度日”，表达“知道如何/应当行敬虔”的压缩结构，又不额外加入宗派性含义。
- source_word: μὴ ἀνθίστασθαι
  choice: 却不抵抗
  rationale: ἀνθίστασθαι的基本义是“抵抗、抗拒、站立抵挡”。“却不抵抗”直接保留否定形式，并以“却”自然呈现“明知……而不……”的反差。
- source_word: τοῖς πόνοις
  choice: 这些痛苦
  rationale: πόνος可指劳苦、疼痛或苦难；殉道受刑的语境支持“痛苦”。加“这些”对应定冠词所指的眼前苦刑，但不强化为词义更窄的“酷刑”。
theological_decisions:
- issue: 敬虔、理性与忍受痛苦之间的句法关系
  choice: 把“不合情理”理解为对“明知应当敬虔度日，却不抵抗这些痛苦”这一整体的判断。
  alternative: 把“不合情理”与“敬虔”直接相连，译为“他们知道敬虔并非不合理，因此没有在痛苦前退缩”。
  rationale: 希腊语次序和不定式结构更自然地支持ἀλόγιστον作整个命题的表语，即“不抵抗痛苦是不合情理的”。不过原文高度压缩，另一种理解与本书关于敬虔理性的主题相合，故在脚注中保留，而不在正文中无声消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“敬虔度日”保留宗教语域而不显古奥；“不抵抗这些痛苦”贴近原文措辞。正文保留原句的劝勉力度，脚注交代其压缩句法及另一种主要理解。
