  source_fidelity: 正文将ἀλόγιστον误解为“明知应当敬虔度日，却不抵抗这些痛苦”这一整体的判断，因而说“不抵抗……是不合情理的”。这与所给英文审校轨迹所采用、且最符合本书敬虔与理性主题的理解相反：ἀλόγιστον应在此表达敬虔并非无理；μὴ ἀνθίστασθαι τοῖς πόνοις则表达他们不在痛苦面前退却／抗拒。原文句法高度压缩，译文不应以正文反转该关系。
