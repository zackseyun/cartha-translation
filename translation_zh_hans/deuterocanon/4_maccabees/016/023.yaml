  terminology: “敬虔”适合εὐσεβεῖν，并保留其宗教语域；无需将原文未明说的对象扩充为“敬畏上帝”。“不合乎理性”准确传达ἀλόγιστον的理性维度；“痛苦”可对应πόνοις。
