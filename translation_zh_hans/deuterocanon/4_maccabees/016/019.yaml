  text: And because of this, you ought to endure every pain for the sake of God.
translation:
  language: zh_hans
  text: 正因如此，你们应当为上帝的缘故忍受一切痛苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 承接上文并表达由前述理由推出的劝勉；“正因如此”在现代汉语中自然，也保留了原文的因果和推论意味。
- source_word: ὀφίλετε
  choice: 你们应当
  rationale: 表达道德责任和劝勉义务，同时不把语气强化为绝对命令式的“必须”。
- source_word: πάντα πόνον
  choice: 一切痛苦
  rationale: πόνος可指痛苦、劳苦或苦难；本章殉道受刑的语境使“痛苦”较具体地保留身体受苦的意味，而πάντα译作“一切”体现完整范围。
- source_word: ὑπομένειν
  choice: 忍受
  rationale: 准确表达在痛苦之下坚持承受的意思；“忍受”简洁自然，符合本句劝勉语气。
- source_word: διὰ τὸν θεόν
  choice: 为了上帝
  rationale: διά加宾格在此表达缘由或目的，指因忠于上帝而承受痛苦；“为了上帝”简明保留这种献身取向，同时避免译成“由于上帝”可能产生的致因歧义。
theological_decisions:
- issue: ὀφίλετε所表达的道德义务强度
  choice: 劝勉性的义务（“应当”）
  alternative: 强制性的必要（“必须”）
  rationale: 原文确实表达责任和义务，但在此处的劝勉语境中，“应当”既保留规范力量，又不将其过度强化为不可区分的强制命令。
- issue: διὰ τὸν θεόν中受苦与上帝的关系
  choice: 为了上帝，即出于对上帝的忠诚而忍受
  alternative: 由于上帝，即把上帝表述为痛苦的直接成因
  rationale: διά加宾格允许目的、缘由或动机层面的理解；结合殉道劝勉语境，译文保留忠于上帝的动机，而不暗中断定上帝是痛苦的直接施加者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正因如此”自然承接上文；“应当”保持劝勉性的道德义务；“一切痛苦”贴近πάντα πόνον，并契合本章身体受难的具体语境。
