  text: So you also[a], having the same faith toward God[b], do not be distressed.
translation:
  language: zh_hans
  text: 所以，你们既然也对上帝怀有同样的信心[a]，就不要苦恼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同样信靠上帝”。希腊语πίστις也可含“信靠”或“忠信”的意思，须按语境判断。
    reason: lexical_alternative
  - marker: b
    text: 或译“不要恼怒”“不要心生怨愤”或“不要烦恼”。这个动词可表示痛苦、烦扰或发怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: 所以，你们也
  rationale: 兼顾καί的承接作用、ὑμεῖς的强调和οὖν的推论语气，以自然的现代汉语引出劝勉。
- source_word: τὴν αὐτὴν πίστιν πρὸς τὸν θεόν
  choice: 对上帝怀有同样的信心
  rationale: πρός加宾格表示朝向或关系；“对上帝”保留这种关系取向。“信心”涵盖此处共同的信仰与信靠姿态，又不把意思限定为单纯的理性认同。
- source_word: ἔχοντες
  choice: 怀有
  rationale: 该现在分词表示与主要劝勉同时存在的处境。“怀有”在汉语中与“信心”搭配自然，也保留“具有、持守”的基本含义。
- source_word: μὴ χαλεπαίνητε
  choice: 不要苦恼
  rationale: χαλεπαίνω可指痛苦、烦恼、恼怒或心生怨愤；“不要苦恼”适合安慰与劝勉的语境，同时以脚注保留较强烈的情绪含义。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 这里指听众与殉道者共有的、面向上帝的坚定态度。“信心”能保留其信仰意涵及词义宽度；“信靠”是合适的语境性理解，而“忠信”虽属可能词义，在本句中较不自然。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所以，你们也要……”清楚传达承接和劝勉语气；脚注标记紧随各自所说明的词语，以免歧义。
