  yaml_path: translation/deuterocanon/4_maccabees/016/012.yaml
  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: zh_hans
  text: 她也没有劝阻他们中的任何一个，好让他们不至于死；他们正在死去时，她也没有悲伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: 劝阻
  rationale: 此词表示使人转离某种行动、加以劝止；结合母亲与众子受难的语境，“劝阻”自然表达她没有试图使任何一个儿子退却。未完成时态呈现当时持续或反复的情形。
- source_word: αὐτῶν τινα
  choice: 他们中的任何一个
  rationale: 保留部分结构和否定语境中的逐一分配意味，即“他们当中的任何一人”。
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: 好让他们不至于死
  rationale: 明确保留ἵνα从句的目的意味，同时用现代汉语自然表达避免死亡这一目的。
- source_word: ἐλυπήθη
  choice: 悲伤
  rationale: 该词表示忧伤、痛苦；“悲伤”庄重而通俗，又不把含义限定为死后的哀悼。
- source_word: ὡς ἀποθνῃσκόντων
  choice: 他们临死时
  rationale: 属格独立结构表示与主句同时发生的情形；“临死时”体现死亡过程中的时间背景，又符合简洁自然的现代汉语。
theological_decisions:
- issue: 省略主语的指代
  choice: 明确译为“她”，指上下文中的母亲
  alternative: 汉语中继续省略主语
  rationale: 希腊文主语虽未明说，但上下文清楚指向母亲；首句补出“她”可使经文独立阅读时清晰，第二分句则自然承接。
- issue: 母亲没有悲伤的表述张力
  choice: 直译为“她也没有悲伤”
  alternative: 解释为“她没有因软弱而悲伤”或“她克制住悲伤”
  rationale: 原文直接否定ἐλυπήθη，没有说明她只是未表现悲伤，也没有限定某种悲伤方式；因此保留原文较强且可能令人不安的陈述，不作神学或心理上的缓和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“劝阻”准确传达使人退却之意；分号对应两个并列的οὐδέ分句。译文不额外解释母亲的内心状态，以保留原文的修辞力度和神学张力。
