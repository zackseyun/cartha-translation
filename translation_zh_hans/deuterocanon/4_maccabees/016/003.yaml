base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: zh_hans
  text: 围着但以理的狮子没有那么凶猛，米沙利所面对的、燃着最猛烈火焰的火炉也没有那么炽烈；那位母亲看见自己的七个儿子正受酷刑时，她的天性因爱子之情燃烧得更加炽烈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的比较结构和罕见动词都带有火焰意象；也可译作：“她的天性因爱子之情而被点燃。”
    reason: 说明罕见动词及比较结构的译法，并保存另一种较贴近被动语态的理解。
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: 围着但以理的狮子
  rationale: οἱ περὶ加人名在此指但以理事件中围绕他的狮子；译文保留空间图景，又避免含混的“与但以理有关的狮子”。
- source_word: ἄγριοι
  choice: 凶猛
  rationale: 在狮子的语境中表达野性和攻击性，现代汉语自然，也与下文火焰的“猛烈”有所区分。
- source_word: Μισαὴλ
  choice: 米沙利
  rationale: 按希腊文音译，并采用现代汉语中可辨识的圣经人名形式。
- source_word: ἐκφλεγομένη κάμινος λαβροτάτῳ πυρί
  choice: 向米沙利喷出最猛烈火焰的熊熊火炉
  rationale: 兼顾ἐκφλεγομένη的炽燃动态与λαβροτάτῳ的最高级力度；“向米沙利”在汉语中清楚表达比较所涉及的受难者。
- source_word: φιλοτεκνίας
  choice: 爱子之情
  rationale: 指母亲对自己儿女的深切亲爱；结合后文七个儿子，译为“爱子之情”凝练而明确。
- source_word: πειράλειεν
  choice: 燃烧得更为炽烈
  rationale: 此罕见动词延续本节的火焰意象，并在比较结构中呈现母亲内心所受煎熬胜过火炉的修辞力度。
- source_word: ἐκείνη φύσις
  choice: 那位母亲……她的天性
  rationale: φύσις本义为“本性、天性”；根据上下文补明母亲这一指称，但不把它窄化为单纯的情绪。
- source_word: ὁρῶσα
  choice: 看见……时
  rationale: 将分词处理为时间情境，从句关系清楚自然，同时保留亲眼目睹所带来的修辞冲击。
- source_word: βασανιζομένους
  choice: 正受酷刑
  rationale: 殉道叙事中指身体遭受刑讯；“酷刑”准确体现其强度，进行体“正受”对应希腊文现在分词。
theological_decisions:
- issue: 母亲内在痛苦的火焰隐喻
  choice: 保留“燃烧得更为炽烈”的火焰意象
  alternative: 译为“更加痛苦”或“备受煎熬”
  rationale: 全句将狮子的凶猛、火炉的烈焰与母亲的内在经历比较；保留燃烧隐喻才能维持原文的修辞统一，也不把富有张力的表达化约为一般情绪说明。
- issue: φύσις所指的范围
  choice: 译为“她的天性”
  alternative: 译为“她的母性”
  rationale: “母性”虽合语境，却比φύσις更具解释性；“天性”保留原词较宽的含义，再由“那位母亲”和“爱子之情”说明语境。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。以分号理清较长的比较句，并通过“凶猛—猛烈—炽烈—燃烧”的词汇链保留原文由猛兽与火炉转入母亲内心痛苦的修辞推进。
