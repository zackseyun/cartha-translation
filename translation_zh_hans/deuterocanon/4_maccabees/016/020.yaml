base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/020.yaml
  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: zh_hans
  text: 正是为了他，我们的祖先亚伯拉罕甚至急着要宰杀儿子以撒——这位民族的始祖[a]；以撒看见父亲那只持刀的手正向自己落下，也没有畏缩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“儿子以撒，就是那将成为民族始祖的人。”希腊语ἐθνοπάτωρ指一个民族的祖先或始祖。
    reason: lexical_alternative
  - marker: b
    text: “畏缩”也可译作“退缩”或“因惧怕而瑟缩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: 正是为了他
  rationale: 保留关系代词对上文所指对象的依赖，不在本节擅自补明其身份；“正是”传达原句承接论证时的强调语气。
- source_word: ἔσπευδεν
  choice: 急切地要
  rationale: 该动词兼有赶快行动和热切投入之意；此处译法避免只表达速度，也保留亚伯拉罕决意行动的力度。
- source_word: σφαγιάσαι
  choice: 宰杀
  rationale: 原词比一般的“杀死”更具体、强烈，并可带祭牲被宰杀的色彩；不用“献祭”，以免把原句没有明说的仪式性表达直接置入正文。
- source_word: τὸν ἐθνοπάτορα υἱόν
  choice: 自己的儿子以撒——那位民族的先祖
  rationale: 将ἐθνοπάτωρ理解为修饰“儿子”的同位称谓，说明以撒是该民族的祖先，避免误解为亚伯拉罕在此语法结构中被称作民族先祖。
- source_word: πατρῴαν χεῖρα
  choice: 先祖的手
  rationale: πατρῷος可指父辈或祖先所属；叙述视角把亚伯拉罕视作共同先祖，因此“先祖的手”既保留修辞色彩，也比生硬的“祖传之手”自然。
- source_word: ξιφηφόρον
  choice: 持刀
  rationale: 直译为“带剑的”，但创世记场景及汉语叙述中“持刀”更自然；仍保留手中带有利刃的画面。
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: 向自己落下
  rationale: 保留动作朝以撒向下而来的动态画面，不额外断定刀已经砍到何种程度。
- source_word: οὐκ ἔπτηξεν
  choice: 没有畏缩
  rationale: 该词可表达因恐惧而退缩、畏缩；此译兼顾内心惧怕与外在退避，符合本书强调坚忍的语境。
theological_decisions:
- issue: 如何表达亚伯拉罕对以撒采取的行动，而不把《创世记》的惯用译语带入本句
  choice: 译作“急切地要宰杀自己的儿子以撒”
  alternative: 译作“急忙要献祭以撒”或“准备献上以撒”
  rationale: 希腊文采用强烈而具象的σφαγιάσαι，不是较温和的“献上”；保留“宰杀”可呈现本句刻意强化的殉道与坚忍修辞。
- issue: διʼ ὃν所指为何
  choice: 译作“正是为了他”，不在正文补出先行词
  alternative: 译作“为此”或明确补出上文的某一原则、人物或对象
  rationale: 阳性关系代词的具体所指须由上文确定。本节自身没有重述先行词，故译文保留这种语篇依赖，避免过度释义。
- issue: 谁“没有畏缩”
  choice: 在后半句明确以撒为主语
  alternative: 沿用希腊文省略主语，只写“也没有畏缩”
  rationale: 从分词ὁρῶν（看见）及“向他落下”的代词关系可知，后半句所描写的是以撒。汉语若完全省略主语，容易误读为亚伯拉罕没有畏缩，因此补出“以撒”属于必要的句法明晰化，而非神学扩写。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“宰杀”刻意保留原文的强烈画面；破折号用于清楚呈现“民族的先祖”与“儿子以撒”的同位关系。后半句补出“以撒”，消除汉语主语歧义。所有脚注标记均已置入正文。
