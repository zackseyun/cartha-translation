  naturalness: “急切地要宰杀”略显搭配生硬，改为“急着要宰杀”更合现代庄重书面汉语。“以撒看见父亲那只持刀的手正向自己落下”清楚、自然，也保持原文的紧迫画面。
  terminology: “宰杀”适当保留σφαγιάσαι的强烈具体语气，未不当增添“献祭”。“民族的始祖”可保留为ἐθνοπάτωρ的简明对应；脚注说明其“一个民族的祖先或始祖”即可。
