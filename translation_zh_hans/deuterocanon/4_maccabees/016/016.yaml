  yaml_path: translation/deuterocanon/4_maccabees/016/016.yaml
  text: you were saying to the children in the Hebrew language[a], “O children, noble is the contest to which, having been called for the testimony of the nation[b], you must struggle earnestly.”
translation:
  language: zh_hans
  text: 你当时用希伯来语对儿子们说[a]：“儿子们，你们既为民族的见证[b]蒙召参加这场崇高的竞赛，就要奋力拼搏！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你不断对儿子们说”。希腊语未完成时可表示当时持续或反复进行的言说。
    reason: lexical_alternative
  - marker: b
    text: 或译“民族的证言”。希腊语 διαμαρτυρία 可指“见证”或“证言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγες
  choice: 你当时……说
  rationale: 未完成时表示所回忆场景中正在进行或持续的言说；“当时……说”在现代汉语中自然地保留这一背景性语气，又不武断地断定她反复说了多次。
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: 对儿子们 / 儿子们
  rationale: παῖς 可指孩子或儿子；本段明确是母亲向她的男性后代说话，因此“儿子们”既准确表达亲属关系，也保留阳性所指。
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: 用希伯来语
  rationale: 该短语指她说话所用的语言；这一简洁译法符合现代汉语习惯。
- source_word: γενναῖος ὁ ἀγών
  choice: 这场崇高的竞赛
  rationale: γενναῖος 在此含高尚、英勇之意；ἀγών 带有竞技和奋争的意象。“崇高的竞赛”保留其道德分量及比喻色彩。
- source_word: ἐφʼ ὃν κληθέντες
  choice: 既……蒙召参加这场……竞赛
  rationale: 保留“受召进入某场竞赛”的目标关系，并以“既”自然表达分词所提供的背景。
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: 为民族的见证
  rationale: ὑπέρ 表示“为了、为着”；διαμαρτυρία 可指见证或郑重作证。“民族的见证”保留属格关系，不擅自添加原文没有的“我们”。
- source_word: ἐναγωνίσασθε
  choice: 就要奋力拼搏
  rationale: 该命令式动词要求积极、竭力投入争竞；“奋力拼搏”既传达劝勉力度，也呼应前面的“竞赛”。
theological_decisions:
- issue: 殉道劝勉中 παῖδες 的称谓
  choice: 儿子们
  alternative: 孩子们
  rationale: 上下文中的说话者是母亲，对象是她的男性子女；“儿子们”不改变经文所指，并强化原有的亲情语境。
- issue: διαμαρτυρία 在犹太殉道语境中的含义
  choice: 见证
  alternative: 证言
  rationale: 原词可有公开作证或证言之意。“见证”保留其公共、群体性的含义，同时不把它限定为后来的特定宗派术语。
- issue: τοῦ ἔθνους 的属格关系
  choice: 民族的
  alternative: 本民族的；我们民族的
  rationale: 直译保留“民族”与“见证”之间关系的开放性，不添加原文没有的第一人称归属，也不进一步判定是民族所作的见证还是为民族所作的见证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“蒙召”“见证”在宗教语境中易懂，也贴近原文；以“竞赛—拼搏”保留 ἀγών 与 ἐναγωνίσασθε 的词根呼应。感叹号体现母亲劝勉的力度，但不额外增加内容。
