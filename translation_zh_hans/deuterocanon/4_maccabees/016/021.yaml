  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: zh_hans
  text: 义人但以理被扔给狮子；哈拿尼雅、亚撒利雅和米沙利[b]被猛掷进火炉[a]，他们因上帝的缘故而忍耐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法常作“烈火的窑”。希腊文较直译为“火的炉”。
    reason: lexical_alternative
  - marker: b
    text: 哈拿尼雅、亚撒利雅和米沙利是这三位青年的希伯来名字；他们也常以巴比伦名字沙得拉、米煞和亚伯尼歌为人所知。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 带冠词的形容词在此作名词性称谓，描述但以理为公义的人；“义人”简洁、庄重，也保留其道德与宗教意味。
- source_word: εἰς λέοντας
  choice: 给狮子
  rationale: 与被动式 ἐβλήθη 连用，表达被投入狮子中任其吞噬；译作“被扔给狮子”符合现代汉语习惯，同时不增添希腊文未明说的“坑”。
- source_word: ἐβλήθη
  choice: 被扔
  rationale: 准确表达 βάλλω 的不定过去时被动态，语言自然，并保留动作的强制性。
- source_word: ἀπεσφενδονήθησαν
  choice: 被猛掷
  rationale: 该动词带有像用投石器甩出去般猛烈抛掷的形象；“猛掷”比一般的“扔”更有力度，也与前句用词形成区别。
- source_word: εἰς κάμινον πυρὸς
  choice: 进火窑
  rationale: κάμινος 指窑炉，πυρός 表明其中有火；“火窑”在现代汉语中简明自然，完整传达所指而不生硬直译为“火的窑炉”。
- source_word: ὑπέμειναν
  choice: 忍受到底
  rationale: ὑπομένω 在受苦语境中不只是承受，也含坚持不退的意味；“忍受到底”兼顾苦难与坚忍。
- source_word: διὰ τὸν θεόν
  choice: 为了上帝
  rationale: διά 加宾格可表示缘故、动机或所为对象；“为了上帝”自然地保留这种动机关系，同时避免把含义限定为单纯因果。
theological_decisions:
- issue: 三位青年的姓名形式
  choice: 哈拿尼雅、亚撒利雅和米沙利
  alternative: 沙得拉、米煞、亚伯尼歌
  rationale: 希腊文本采用三人的希伯来名字，因此正文依原文保留这些姓名，不以更常见的巴比伦名字替换。
- issue: δίκαιος 对但以理的称谓
  choice: 义人
  alternative: 公正的人
  rationale: 此处是叙事中的道德—宗教评价；“义人”保留该词的完整语义场，也符合庄重而通俗的现代中文。
- issue: διὰ τὸν θεόν 所表达的关系
  choice: 为了上帝
  alternative: 因为上帝
  rationale: 原短语可表达缘故或动机。“为了上帝”在本句中较自然地呈现他们因忠于上帝而坚忍的意味，但不进一步说明上帝是直接施行忍耐的主体。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“被猛掷”保留原文第二个投掷动词的强烈色彩；“忍受到底”体现受难中的持守。正文只设置一条脚注，且标记 [a] 已在正文相应位置出现。
