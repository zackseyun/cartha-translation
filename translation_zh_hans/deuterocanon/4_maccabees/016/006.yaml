base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: zh_hans
  text: 我真可怜啊[a]，屡次三番地遭受极大的不幸[b]！我虽生了七个孩子[c]，如今竟成了没有任何孩子的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我这可怜的人啊”或“我这苦命的女人啊”。原文是说话者对自己的哀叹。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“多次三重不幸”；这是把悲苦层层强化的说法。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“七个儿子”。希腊词既可指“孩子”，也可指“儿子”；上下文表明这里所说的是男性后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: 我真是苦命啊
  rationale: Ὦ引出哀叹，μελέα是阴性自指，表达“可怜、苦命”，ἔγωγε加强“我本人”的语气。译文用现代汉语自然地传达强烈的自我哀悼。
- source_word: πολλάκις τρισαθλία
  choice: 一次又一次地苦上加苦
  rationale: πολλάκις表示“多次、反复”，τρισαθλία字面有“三重不幸”之意，也可作最高程度的强化语。汉语“苦上加苦”保留层层加剧的悲痛，而不把“三”误解为精确次数。
- source_word: ἥτις
  choice: 我虽
  rationale: 此关系代词回指说话者，并引出她哀叹的缘由；上下文具有强烈的让步反差，因此译作“我虽”自然呈现“生了七个，却一个也没有”的张力。
- source_word: ἑπτὰ παῖδας
  choice: 七个孩子
  rationale: παῖδας可泛指孩子，也可指儿子；本段语境表明他们是男性后裔，但正文保留该词较宽的词义，并以脚注说明。
- source_word: τεκοῦσα
  choice: 生了
  rationale: τίκτω的简单过去分词明确指生育。汉语“生了”简洁自然，保留母亲亲自生下他们的含义。
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: 如今却一个也没有，成了无儿无女的母亲
  rationale: γεγένημαι是完成时，强调已形成并持续至今的状态。译文用“如今”和“成了”呈现结果状态，同时保留“生了七个却成为一个也没有的母亲”这一尖锐悖论。
theological_decisions:
- issue: 母亲在七个孩子死后的自我描述
  choice: 将本句保留为丧子之母的悖论式哀叹：她曾生育七人，如今却因全部失去而说自己成了无儿无女的母亲。
  alternative: 可较平直地译作“如今我已不是任何人的母亲”。
  rationale: 原文完成时γεγένημαι带有结果状态，且整句修辞力量来自“生了七个”与“一个也没有”之间的冲突。译文不将其解释为否认既往的母子关系，也不加入原文未明说的教义结论。
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌语体。“我真是苦命啊”保留开头的自哀感叹；“一次又一次地苦上加苦”避免生硬照搬“三重不幸”，同时保留原文异常强烈的反复强化；末句稍作汉语展开，以清楚表达完成时所含的当前丧失状态和原文的悖论。
