  yaml_path: translation/deuterocanon/4_maccabees/016/007.yaml
  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: zh_hans
  text: 唉，七次怀胎，尽归徒然；七次十月怀胎[a]，毫无益处；哺乳，未结成果；以乳养育，满是苦楚。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十月”反映古人计算正常孕期的方式，并非按现代通常的月份算法计算。
    reason: cultural_note
  - marker: b
    text: 希腊原文是一连串没有完整谓语的感叹短语；译文保留了这种短促、层叠的哀歌语气。
    reason: literary_note
lexical_decisions:
- source_word: μάταιοι
  choice: 徒然
  rationale: 表达这些怀胎从哀母当下的眼光看来归于落空；“徒然”庄重而自然，也不暗示怀孕本身虚假。
- source_word: κυοφορίαι
  choice: 怀胎
  rationale: 指在腹中孕育胎儿；“怀胎”比“妊娠”更适合强烈的母亲哀歌。
- source_word: ἀνόνητοι
  choice: 无益处
  rationale: 准确传达“没有带来益处、无所裨益”，并与随后表示无成果的 ἄκαρποι 保持词义区别。
- source_word: δεκάμηνοι
  choice: 十月的孕期
  rationale: 保留古代以“十月”计算足月妊娠的具体说法，同时用“孕期”使现代读者容易理解。
- source_word: ἄκαρποι
  choice: 无成果
  rationale: 保留“没有结出果实”的比喻含义，又避免用“不能生育”之类措辞造成事实误解。
- source_word: τιθηνίαι
  choice: 哺育
  rationale: 概括照料、喂养婴儿的行为；在本句中与较具体的乳养形成可辨而不过度僵硬的对应。
- source_word: ταλαίπωροι
  choice: 满是苦楚
  rationale: 体现艰苦、可悲的感情色彩，用于母亲回顾乳养儿女的痛苦哀叹自然有力。
- source_word: γαλακτοτροφίαι
  choice: 乳养
  rationale: 直指以乳汁养育，既保留复合词的具体意象，又比现代临床色彩较强的“母乳喂养”更适合哀歌语体。
theological_decisions:
- issue: 一连串无谓语的感叹短语
  choice: 保留压缩的感叹结构，以“唉”引出，并用“竟”表达哀叹中的落空感
  alternative: 补成“我的七次怀胎都是徒然的”等完整陈述句
  rationale: 希腊文由一系列感叹性名词短语组成，没有限定动词；中文若完全照搬会显得生硬，因此作最低限度补足，同时不把其展开为解释性的完整叙述。
- issue: δεκάμηνοι 的古代孕期表达
  choice: 正文直译为“十月的孕期”，脚注解释古代算法
  alternative: 译作“足月的孕期”
  rationale: 保留原文的文化特征，不将其默默现代化；脚注可防止读者按现代月份算法误解。
- issue: 母亲的哀叹是否构成对儿子殉难价值的最终判断
  choice: 按话语层面译出她所引用或设想的哀语，不增添神学解释
  alternative: 在正文中改写为“在人看来徒然”以调和上下文
  rationale: 原文保留了哀痛与信仰劝勉之间的张力；译文不应擅自消解。
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌语体。“唉”承接希腊文感叹词 ὦ；分号呈现四组平行短语。避免过于临床化的“妊娠、母乳喂养”，也避免古奥难懂的文言表达。所有脚注标记均已置于正文。
