  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: zh_hans
  text: 这位七个孩子的母亲用这些话劝勉她的每一个儿子，说服他们宁可死，也不违背上帝的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: 用这些话
  rationale: διά加属格在此表示方式或手段；“用这些话”自然地保留了工具性含义。
- source_word: ἡ ἑπτάμητωρ
  choice: 她……自己的……儿子
  rationale: 该复合词意为“七个孩子的母亲”。本句下文已明说“儿子”，汉语若直译为“七子之母……每一个儿子”略显重复，因此以代词衔接；七子的身份由上下文及“每一个儿子”承接。
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: 自己的每一个儿子
  rationale: 保留ἕνα ἕκαστον的逐一、分配性强调；“自己的”清楚交代母子关系。
- source_word: παρακαλοῦσα
  choice: 劝勉
  rationale: 在受难中既有劝说、敦促，也有鼓励坚守之意；“劝勉”兼顾这两层语气。
- source_word: ἔπεισε
  choice: 使他们
  rationale: πείθω本义为“说服”。现代汉语在“劝勉……使……”结构中可自然表达劝说所产生的结果，避免“劝勉……说服……”的累赘。
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: 宁可死，也不违背
  rationale: 准确表达μᾶλλον…ἢ的取舍比较：选择死亡而非越过、违反诫命。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 上帝的诫命
  rationale: “诫命”保留ἐντολή在宗教和道德语境中的庄重法律意味。
theological_decisions:
- issue: 是否在正文中把ἑπτάμητωρ明确译作“七个儿子的母亲”
  choice: 以“她”承接上下文，并在后文译出“自己的每一个儿子”
  alternative: “这位七个儿子的母亲”或“七子之母”
  rationale: 希腊复合词明确表示她是七个孩子的母亲，但紧接着又出现“儿子”。当前译法在单节中减少生硬重复，却依赖上下文确认“七”这一信息；若经文需完全脱离上下文独立呈现，则宜采用“这位七个儿子的母亲”。
- issue: παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ的语体
  choice: 违背上帝的诫命
  alternative: 违反上帝的命令
  rationale: “违背……诫命”保留忠于神圣律令的道德与法律张力，不额外引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劝勉”比“鼓励”更能体现母亲既扶持又敦促的行动；“宁可……也不……”清楚呈现死亡与违命之间的强烈取舍。
