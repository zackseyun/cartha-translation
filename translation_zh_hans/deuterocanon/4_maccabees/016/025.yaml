revisions:
- from: 此外，他们也看见了这一点：那些为了上帝而死的人，仍向上帝活着[a]，正如亚伯拉罕、以撒、雅各和所有的先祖一样——
  to: 此外，他们也看见这些事：他们为了上帝而死后，仍向上帝活着[a]，正如亚伯拉罕、以撒、雅各和所有的先祖一样——
  rationale: 修订将ἀποθανόντες明确为“死后”，保持其相对于“活着”的先行关系；将ταῦτα译为“这些事”，并让分词与主句继续以“他们”为共同主语。保留“向上帝活着”及脚注，避免将τῷ θεῷ单方面解释为与上帝同住、在上帝那里，或仅指为上帝服务。句末破折号继续反映原文在本节处未完结的句法衔接。
