  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: zh_hans
  text: 此外，他们也看见这些事：他们为了上帝而死后，仍向上帝活着[a]，正如亚伯拉罕、以撒、雅各和所有的先祖一样——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍为上帝而活。”希腊文直译为“向上帝活着”。
    reason: 保留τῷ θεῷ这一与格结构可能表示关系指向或目的归属的歧义。
lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: 此外……也
  rationale: 表达递进兼添加的语气，符合现代汉语习惯，也不过度强化为原文没有明说的程度比较。
- source_word: ταῦτα ἰδόντες
  choice: 他们也看见了这一点
  rationale: 将复数指示词按上下文整体化为“这一点”，并以汉语分句自然表达分词结构；主语承接上下文。
- source_word: διὰ τὸν θεόν
  choice: 为了上帝
  rationale: 在殉道语境中，διά加宾格表示缘故或动机；“为了上帝”简明保留其献身意味。
- source_word: ἀποθανόντες
  choice: 死的人
  rationale: 与定冠词所隐含的群体指称相协调，并在“仍……活着”的结构中体现死亡先于活着这一悖论性陈述。
- source_word: ζῶσιν τῷ θεῷ
  choice: 仍向上帝活着
  rationale: “向上帝活着”尽量保留与格所表达的关系方向，避免擅自解释成“与上帝同住”；加入“仍”使死后继续活着的反差在现代汉语中清楚可懂。
- source_word: ὥσπερ
  choice: 正如……一样
  rationale: 自然、明确地引出比较。
- source_word: οἱ πατριάρχαι
  choice: 先祖
  rationale: 在亚伯拉罕、以撒、雅各的圣经历史语境中，“先祖”比音译化或制度化的称谓更易懂，同时保留祖先领袖的含义。
theological_decisions:
- issue: 义人殉道者死后与上帝相关的生命
  choice: 仍向上帝活着
  alternative: 仍为上帝而活；仍与上帝同活
  rationale: 原文明确说他们死后“活着”，并用与格说明其生命与上帝的关系。“向上帝活着”保留这种不寻常而有意的表达，不把它收窄为生前事奉，也不扩展为原文未明说的共居状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为了上帝而死”与“向上帝活着”刻意形成神学张力；句末破折号保留原段落中句法尚未结束的衔接感。
