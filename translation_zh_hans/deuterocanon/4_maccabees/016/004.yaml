base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/004.yaml
  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: zh_hans
  text: 然而，这位母亲凭着敬虔的理性，熄灭了如此众多、如此强烈的情感[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如此众多、如此强烈”直译希腊文的双重强调，分别突出这些情感的数量与强度。
    reason: lexical_alternative
  - marker: b
    text: “敬虔”也可译作“虔敬”，指对上帝虔诚而敬畏的态度；“敬虔的理性”不是单指抽象的理性能力，而是受这种虔敬引导的理性判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文形成鲜明转折；“然而”庄重自然，适合本段论述语气。
- source_word: τῷ λογισμῷ
  choice: 凭着……理性
  rationale: 工具与格表示母亲借此克制情感；λόγισμος是《马加比四书》的关键词，指能作判断并支配情感的理性思考，而非泛指某个念头。
- source_word: τῆς εὐσεβείας
  choice: 敬虔的
  rationale: εὐσέβεια指向上帝的虔敬与敬畏；译为“敬虔的理性”，保留理性与信仰实践结合的关系，同时符合现代汉语表达。
- source_word: κατέσβεσε
  choice: 熄灭了
  rationale: 保留动词原有的灭火意象，表现母亲使强烈情感失去作用，而不弱化为一般性的“抑制”。
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: 如此众多、如此强烈的
  rationale: 分别表达数量多和程度大；πάθη在汉语中不宜说“巨大”，故依搭配译作“强烈”，同时保留希腊文的双重强调。
- source_word: πάθη
  choice: 情感
  rationale: 在本书哲学语境中指受理性约束的情感或激情；此处也包含母亲面对儿子受难时的强烈母爱与痛苦。“情感”比“激情”或“欲望”覆盖面更恰当。
- source_word: ἡ μήτηρ
  choice: 这位母亲
  rationale: 定冠词指向上下文已经明确的母亲；汉语用“这位”自然地体现特指，不额外加入原文没有的亲属代词。
theological_decisions:
- issue: λογισμῷ τῆς εὐσεβείας中理性与敬虔的关系
  choice: 敬虔的理性
  alternative: 凭着敬虔所产生的理性思考
  rationale: 属格可表达理性受敬虔塑造或具有敬虔性质。正文采用凝练且符合全书主题的“敬虔的理性”，不把两者之间的关系过度限定为来源、所有或单纯修饰。
- issue: πάθη在此处指情感还是苦难
  choice: 情感
  alternative: 痛苦
  rationale: κατέσβεσε与本书关于理性制伏πάθη的核心论述支持“情感”；但语境中的苦难会激发这些情感，因此脚注说明其范围，避免把它窄化为一般欲望。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“熄灭”保留原文鲜明比喻；“如此众多、如此强烈”保留平行强调。“敬虔的理性”作为核心哲学—宗教术语，兼顾准确性与可读性。
