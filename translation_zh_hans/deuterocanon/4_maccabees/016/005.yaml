  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: zh_hans
  text: 还要想想这一点：这位妇人若是胆怯，尽管身为母亲，就会为他们哀号；她或许会这样说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: 想一想
  rationale: 该不定式引出一个还需听众思量的要点；“想一想”自然明白，也保留劝人思考的语气。
- source_word: δειλόψυχος
  choice: 胆怯
  rationale: 该复合词指内心缺乏勇气；“胆怯”准确而不过分严厉，比“懦弱”更适合这里对母亲反应所作的假设。
- source_word: γυνή
  choice: 这女人
  rationale: γυνή本身是“女人”，下文另以μήτηρ οὖσα强调她身为母亲，因此不直接译作“母亲”，以免抹去原文的递进重点。
- source_word: καίπερ μήτηρ οὖσα
  choice: 尽管身为母亲
  rationale: καίπερ赋予明确的让步意味；此译保留原文在母亲的自然情感与她实际表现出的坚忍之间所形成的张力。
- source_word: ὠλοφύρετο
  choice: 会……哀号
  rationale: 该动词表示出声哀哭、悲叹；“哀号”既传达声音和强烈悲痛，又符合庄重叙事语体。
- source_word: ἐπʼ αὐτοῖς
  choice: 为他们
  rationale: 介词短语表示哀哭所针对的对象，即她的儿子们；汉语中“为他们哀号”最自然。
- source_word: ἴσως
  choice: 或许
  rationale: 保留原文为下文假想言辞设置的推测性语气，不将可能性强化为确定。
- source_word: ταῦτα οὕτως εἶπεν
  choice: 会这样说
  rationale: 该短语引出随后假设的直接言辞；“这样说”简洁自然，并保留向后指示的功能。
theological_decisions:
- issue: 母性本能与坚忍之间的让步性对照
  choice: 按假设性对照直译：她若胆怯，尽管身为母亲，也会为儿子们哀号。
  alternative: 解释性地补明母亲的自然情感通常必然导致哀哭。
  rationale: 原文提出的是修辞性假设，并未要求译文进一步评断母爱或坚忍；当前译法保留两者之间的张力，而不加入额外的道德或教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这女人”承接上下文中的特定人物；“哀号”保留原文可听见的悲叹力度。句末冒号表明下节将引出她假想中会说的话。
