base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/013.yaml
  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: zh_hans
  text: 但她的心志坚如金刚，又使她儿子们的数目向着不朽回响[a]；她反倒更加恳切地劝勉他们，为敬虔而走向死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使她儿子们的数目向着不朽回响”所译的希腊语动词十分罕见且带隐喻性；也可理解为“把她儿子们的数目反响到不朽中”或“使她儿子们的数目与不朽相应”。原文的确切图像难以确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: 坚如金刚
  rationale: 保留极其坚硬、不可摧折的具体比喻；“金刚”在现代汉语中可表达坚不可摧，又比单纯译作“坚定不移”更贴近原文意象。
- source_word: νοῦν
  choice: 心志
  rationale: 此处既涉及内在思想，也突出面对儿子受难时的坚定意志；“心志”比“理智”自然，同时不把它完全化约为“决心”。
- source_word: ἀντικτυποῦσα
  choice: 回应
  rationale: 该词在这里用法罕见而富于隐喻，可含撞击、回响或反向回应之意。“回应”保留对应动作，但确切图像仍以脚注说明，避免武断释义。
- source_word: εἰς ἀθανασίαν
  choice: 到不朽之中
  rationale: 保留 εἰς 所表达的趋向与进入目标，不进一步解释不朽如何实现。
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: 儿子们的数目
  rationale: 按原文保留不寻常的“数目”说法，不改写成“众子”或“所有儿子”，以免抹平修辞张力。
- source_word: μᾶλλον
  choice: 反而越发
  rationale: 既承接前文转折，又表达比较加强的语气。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 表达对上帝的虔敬与忠诚，在本书殉道语境中也可涵盖由此产生的忠贞实践；不加入特定宗派含义。
- source_word: προετρέπετο
  choice: 勇赴
  rationale: 结合方向短语“走向死亡”，用“勇赴”自然表达她催促、勉励他们向前；其恳切语气由 ἱκετεύουσα 另行体现。
- source_word: ἱκετεύουσα
  choice: 恳求他们
  rationale: 保留分词所增加的强烈恳切与情感张力，并明确恳求的对象。
theological_decisions:
- issue: 殉道语境中的 εὐσέβεια
  choice: 敬虔
  alternative: 虔诚；对上帝的忠贞
  rationale: “敬虔”明确保留朝向上帝的意义，又没有把该词扩写成完整的盟约或律法解释。
- issue: καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν 的隐喻
  choice: 又仿佛把儿子们的数目回应到不朽之中
  alternative: 又把儿子们的数目回响到不朽之中；又使儿子们的数目与不朽相应
  rationale: 原句意象浓缩且词义罕见，可能涉及撞击后的回响、回应或对应。“仿佛”提示其隐喻性质，正文保留陌生感，脚注交代其他可能，不将其直接解释为确定的殉道赏赐机制。
- issue: 母亲催促儿子走向死亡的表达
  choice: 恳求他们，为了敬虔勇赴死亡
  alternative: 催促他们为了敬虔走向死亡
  rationale: 原文同时有强烈劝勉与恳求。此译保留死亡作为他们面对的方向，也借“勇赴”呈现主动承受，而不美化死亡本身。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“心志坚如金刚”“敬虔”“勇赴死亡”保持经文语体，但避免古奥句法。以“仿佛”及脚注保存核心隐喻的不确定性。
