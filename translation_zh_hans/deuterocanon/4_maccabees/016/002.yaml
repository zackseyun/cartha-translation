base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/002.yaml
  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: zh_hans
  text: 所以，我已经表明：不但男人制伏了情欲，甚至连一个女人也不把最严酷的酷刑放在眼里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不把……放在眼里”也可译作“藐视”或“轻看”。
    reason: ὑπερεφρόνησεν含有蔑视、认为不值一顾的语义，几种译法侧重点略有不同。
lexical_decisions:
- source_word: ἀπέδειξα
  choice: 我已经表明
  rationale: 该动词可表示“表明、证明、论证”。这里是对前文论述的总结，用“已经表明”既符合语篇功能，也不过度强调形式证明。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前文得出的推论或总结；“所以”自然清楚地保留了这一衔接。
- source_word: τῶν παθῶν
  choice: 情欲
  rationale: 本书的核心论题是理性对内在激情和冲动的统治；此处不是指外在的“苦难”。“情欲”在现代中文中可概括需要节制的欲望和激情。
- source_word: ἄνδρες
  choice: 男人
  rationale: 原文明确指男性，并与下文“一个女人”形成有意的性别对照，不宜中性化为“人”。
- source_word: ἐπεκράτησαν
  choice: 制伏了
  rationale: 该词表示占上风、控制或支配；“制伏”保留了对情欲取得主导和控制的含义。
- source_word: γυνή
  choice: 一个女人
  rationale: 无冠词单数在此指前文那位母亲作为一个典范；“一个女人”也保留了与“男人”的修辞对照。
- source_word: τῶν μεγίστων βασάνων
  choice: 最严酷的酷刑
  rationale: βάσανοι在殉道语境中指折磨、酷刑；μεγίστων在此表达程度极高，用“最严酷的”比生硬的“最大的”更符合现代汉语。
- source_word: ὑπερεφρόνησεν
  choice: 不把……放在眼里
  rationale: 该词表示轻视、蔑视，视之为不足挂齿；这一说法自然传达她在酷刑面前的轻蔑与无畏。
theological_decisions:
- issue: πάθη所指的人性层面
  choice: 情欲
  alternative: 激情；情感；苦难
  rationale: 《马加比四书》的论证主线是理性制伏内在激情和冲动，因此不能把此词解释成外在苦难；同时“情欲”保留其伦理哲学色彩。
- issue: ἄνδρες与γυνή的性别对照
  choice: 男人……一个女人
  alternative: 人们……一个女人
  rationale: 原文以男性殉道者与那位母亲相对照；保留性别措辞才能呈现其修辞张力，而不是将其无声中性化。
- issue: 女人面对酷刑的态度
  choice: 不把……放在眼里
  alternative: 藐视；轻看
  rationale: 原文强调她将最严酷的酷刑视为不足介意，并非否认痛苦的真实性。正文采用自然表达，脚注保留较凝练的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“所以，我已经表明”呈现作者总结论证的口吻；“制伏了情欲”呼应全书理性统御激情的主题；“不把……放在眼里”虽属常用表达，但不口语轻佻，能清楚传达面对酷刑而轻看它的含义。
