  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: zh_hans
  text: 母亲啊，你这敬奉上帝[a]的战士！你虽年迈，又是妇人，却凭着坚忍，连暴君也胜过了；在行动和言语上，你都显得比男子更有力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对上帝的敬虔”或“敬畏上帝”。希腊文εὐσέβεια可指敬虔、敬畏或虔诚。
    reason: 说明原词的词义范围，并保留其他合理译法。
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: 敬奉上帝
  rationale: εὐσέβεια表示对神明的敬虔、敬畏和虔诚；与θεοῦ连用时，译作“敬奉上帝”既表达其指向上帝的宗教忠诚，也符合现代汉语习惯。
- source_word: στρατιῶτι
  choice: 战士
  rationale: 原文以军事形象称呼这位母亲；“战士”保留比喻，又不把含义扩展为实际参战者。
- source_word: πρεσβῦτι καὶ γυνή
  choice: 虽年迈，又是妇人
  rationale: 保留年龄与性别两方面的修辞对照，并以“虽”传达上下文中的让步意味。
- source_word: διὰ καρτερίαν
  choice: 凭着坚忍
  rationale: καρτερία指在苦难中坚定承受、坚持不屈；“凭着”保留διά的凭借或原因意味。
- source_word: τύραννον ἐνίκησας
  choice: 连暴君也胜过了
  rationale: ἐνίκησας表示战胜、胜过；“连……也”自然传达此处以弱胜强的强调语气。
- source_word: ἔργοις δυνατωτέρα καὶ λόγοις
  choice: 无论在行动上还是言语上……更有力量
  rationale: 保留ἔργοις与λόγοις的并列对照，以及δυνατωτέρα的比较级含义。
- source_word: εὑρέθης ἂν ἀνδρός
  choice: 你都显明比男子更有力量
  rationale: “显明”自然表达εὑρέθης在此“被发现为、证明是”的结果意味；“男子”保留与前文“妇人”的明确性别对照。
theological_decisions:
- issue: εὐσέβεια的宗教含义
  choice: 译作“敬奉上帝”
  alternative: 译作“对上帝的敬虔”或“敬畏上帝”
  rationale: 原词兼有敬虔、敬畏和虔诚履行宗教责任等含义；正文采用自然且指向明确的表达，脚注保留其词义范围。
- issue: 末句的性别比较
  choice: 保留“妇人”与“男子”的对照
  alternative: 中性化为“比任何人更有力量”
  rationale: 原文有意以她年迈且为女性与男子作修辞比较；中性化会抹去原文张力。
- issue: 军事比喻
  choice: 称母亲为“战士”
  alternative: 弱化为“坚守敬虔的人”
  rationale: 原文明确使用στρατιώτης相关形式，军事意象是本句赞辞的重要组成部分，应予保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“母亲啊”与感叹号保留原文颂赞式呼语；“凭着坚忍”“行动上还是言语上”清楚呈现原句的修辞结构。
