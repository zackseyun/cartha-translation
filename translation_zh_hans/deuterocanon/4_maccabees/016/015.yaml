  text: For even when you were arrested with your children, you stood watching Eleazar being tortured, and—
translation:
  language: zh_hans
  text: 因为就连你和孩子们一同被捕时，你也站在那里，看着以利亚撒正受酷刑，并且——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为就在……的时候
  rationale: γάρ承接上文，表示理由；καί在此有加强意味，以“就在”自然体现。
- source_word: συνελήμφθης
  choice: 你……被捕
  rationale: 准确表达该动词第二人称单数、不定过去时、被动语态的意义。
- source_word: μετὰ τῶν παίδων
  choice: 和孩子们一同
  rationale: παῖδες在本段语境中指这位母亲的儿子们；“孩子们”自然并保留亲属称谓的宽度。
- source_word: εἱστήκεις
  choice: 你站在那里
  rationale: 体现过去完成时形式所描绘的持续站立状态，中文无需机械表达完成体。
- source_word: ὁρῶσα
  choice: 眼看着
  rationale: 该现在分词与主语一致，表示她站立时持续目睹；“眼看着”兼具动作同步与现场感。
- source_word: βασανιζόμενον
  choice: 受酷刑
  rationale: 现在被动分词表示以利亚撒正在遭受折磨；“受酷刑”符合处境且庄重明确。
