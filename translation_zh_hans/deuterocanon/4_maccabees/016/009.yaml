  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: zh_hans
  text: 我的孩子们啊！有的未婚，有的虽已成婚，却没有子女[a]。我将看不到你们的孩子；在被称为祖母时，我也不会被人称为有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有子女”所译的希腊词 ἄνοιντοι 较为罕见，可能意为“没有子嗣”。这里的意思是，即使已经成婚的孩子，也不会给她留下孙辈。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: 我的孩子们啊
  rationale: 保留呼格的哀叹语气；παῖδες 在此泛指说话者的儿女，不必限定为儿子。
- source_word: ἄγαμοι
  choice: 尚未成婚
  rationale: 准确表达“未婚”，并以“尚未”契合母亲哀叹他们未及成婚的语境。
- source_word: γαμήσαντες
  choice: 虽已成婚
  rationale: 分词指已经结婚的人；加入“虽”自然呈现与后文没有子女之间的转折。
- source_word: ἄνοιντοι
  choice: 没有子女
  rationale: 此罕见词按上下文最可能指无子嗣；避免译作“不育”，因为原文未明确归因于生理状态。
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: 我将看不到你们的孩子
  rationale: 直译下一代的家庭关系，并保留母亲无法见到孙辈的哀痛。
- source_word: μάμμη
  choice: 祖母
  rationale: 对应表示祖母的亲属称谓；现代汉语中自然庄重。
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: 不会因被称为祖母而让人说我有福
  rationale: 兼顾 κληθεῖσα 的“被称为”和 μακαρισθήσομαι 的“被宣称或视为有福”，避免将后者误解为直接蒙福。
