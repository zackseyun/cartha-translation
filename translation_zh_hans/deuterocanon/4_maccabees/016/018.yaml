  verdict: revise
  source_fidelity: 需要修订。τοῦ κόσμου 最自然且语法上紧密地限定 τὸν θεόν，即“世界的上帝／掌管世界的上帝”；将其作为 μετελάβετε 的属格宾语会使“因着上帝而有分于这个世界”成为正文，未能反映该短语的主要句法关系。μετελάβετε 的宾语在本节中未明说，应保留其未明示性。开头不定式承接上文，译作否定性的劝勉可接受。
  naturalness: “年幼的人”容易指儿童，未能表达比较级 νεωτέρους 的“较年轻者”。“较年轻的人”更自然准确。“为了那位掌管世界的上帝”是现代汉语中既庄重又通顺的表达。
  terminology: “酷刑”“有分”“享受生命”均合宜。“掌管世界的上帝”将 θεὸς τοῦ κόσμου 的属格关系自然地表达为上帝对世界的主权，不引入特定宗派术语。
  issues:
