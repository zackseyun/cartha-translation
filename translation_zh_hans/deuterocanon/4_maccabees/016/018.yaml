base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/018.yaml
  text: Do not let the younger men be terrified by the tortures. Remember that for the sake of the God of the world you have partaken of this[a], and have enjoyed life;
translation:
  language: zh_hans
  text: 不要让较年轻的人被酷刑吓倒。要记住：为了那位掌管世界的上帝，你们已经有分于此[a]，并享受了生命；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“有分”的受词在本节未明说；也可译为“分享了某事”或“有分”。“掌管世界的上帝”对应原文“世界的上帝”。
    reason: 保留 μετελάβετε 受词未明示的特点，并说明 θεὸς τοῦ κόσμου 的自然句法关系。
lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: 年幼的人
  rationale: 比较级形容词作名词用，指群体中较年轻者；上下文很可能是较年幼的弟兄，但本节本身没有明说“弟兄”，故不补入。
- source_word: καταπλαγῆναι τὰς βασάνους
  choice: 被酷刑吓倒
  rationale: καταπλήσσω 的不定过去时被动不定式表达因震骇而陷入恐惧；βάσανος 在殉道语境中指酷刑。“吓倒”既传达强烈恐惧，也符合劝勉语气。
- source_word: ἀναμνήσθητε
  choice: 要记住
  rationale: 不定过去时命令语气要求听者郑重回想；现代汉语用“要记住”自然而有力度。
- source_word: διὰ τὸν θεὸν
  choice: 因着上帝
  rationale: διά 加宾格通常表示缘故或动因；此处译作“因着”，保留“由于上帝”的含义，不把它误译成 διά 加属格所常表达的直接施事。
- source_word: τοῦ κόσμου μετελάβετε
  choice: 得以有分于这个世界
  rationale: μεταλαμβάνω 可支配属格，τοῦ κόσμου 因而可自然地作其宾语；这也与下句 τοῦ βίου ἀπελαύσατε 的属格宾语结构形成平行。“这个世界”使中文指称清楚。
- source_word: τοῦ βίου ἀπελαύσατε
  choice: 享受生命
  rationale: ἀπολαύω 加属格意为享用、享有某物；“享受生命”简洁地保留已经领受生命益处的意思。
theological_decisions:
- issue: τοῦ κόσμου 应修饰 θεόν，还是作 μετελάβετε 的宾语
  choice: 将 τοῦ κόσμου 连接 μετελάβετε：“有分于这个世界”
  alternative: 将其连接 θεόν：“为了世界的上帝，你们有分于此”
  rationale: 希腊语词序容许两种分析，但 μεταλαμβάνω 常支配属格，而且 τοῦ κόσμου μετελάβετε 与紧接着的 τοῦ βίου ἀπελαύσατε 构成鲜明平行，因此正文采用前一种分析。脚注保留另一种语法可能，不借译文预先消除歧义。
- issue: 本节开头不定式的独立呈现
  choice: 按劝勉语境译为“不要让……被……吓倒”
  alternative: 作为承接上文的片段译为“让年幼的人被酷刑吓倒”
  rationale: 现存分节以不定式开头，句法显然承接上文；上下文和劝勉方向要求否定意义。中文正文补出最少量的使令结构，使独立经节可读，但不增添“弟兄”等未明说的身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“年幼的人”避免把上下文推定的“弟兄”写进正文；“酷刑”“有分于”“享受生命”兼顾原文力度与普通读者可懂性。分号保留原文尚未完结、继续下接的语气。
