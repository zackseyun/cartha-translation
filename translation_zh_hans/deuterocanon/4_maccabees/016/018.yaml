    rationale: 在 διὰ τὸν θεὸν τοῦ κόσμου 中，带冠词的属格短语紧随 θεόν，最自然地是“世界的上帝”。虽 μεταλαμβάνω 可接属格，但本处把该词从 θεόν 分离会显著削弱并改变短语的通常句法和含义。
  - severity: medium
    issue: 脚注把“世界”作 μετελάβετε 宾语的读法描述为正文所采且“更符合平行结构”。
    rationale: 这会以不可靠的句法分析引导读者，并遮蔽正文中 μετελάβετε 宾语实际未明说的事实。应改注说明该动词的受词在本节省略。
  - severity: low
    issue: “年幼的人”未体现比较级。
    rationale: νεωτέρους 是群体中的较年轻者；“较年轻的人”避免将他们误解为儿童。
