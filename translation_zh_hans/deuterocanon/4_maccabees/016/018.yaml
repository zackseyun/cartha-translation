revisions:
- from: 不要让年幼的人被酷刑吓倒。要记住：你们因着上帝才得以有分于这个世界[a]，享受生命；
  to: 不要让较年轻的人被酷刑吓倒。要记住：为了那位掌管世界的上帝，你们已经有分于此[a]，并享受了生命；
  rationale: 修订将“世界的”恢复为限定“上帝”，并以“掌管世界的上帝”作自然的现代汉语表达。对 μετελάβετε 不补出原文没有明说的具体受词，改用“有分于此”并加注说明。开头改为“较年轻的人”，以保留比较级含义。
