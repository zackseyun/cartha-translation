  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
translation:
  language: zh_hans
  text: 唉[a]，我这个儿女众多、儿女出众[b]的妇人，是寡妇，孤身一人，哀恸不已[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “唉”所译的希腊语感叹词也可译作“啊”；这里的语境表明它带有哀叹意味。
    reason: lexical_alternative
  - marker: b
    text: “出众”所译的希腊词也可理解为“美丽”，即“儿女美丽”。这个词既可能指容貌美好，也可能泛指优秀、美好。
    reason: lexical_ambiguity
  - marker: c
    text: “哀恸不已”所译的希腊词也可能含有“深受哀悼”或“可悲可叹”的意味。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὦ
  choice: 唉
  rationale: 此感叹词在这里引出母亲的哀叹；“唉”既自然，也能表达悲痛语气。
- source_word: πολύπαις
  choice: 儿女众多
  rationale: 该复合形容词指有许多孩子；译作“儿女众多”简洁自然，并保留其描述性质。
- source_word: καλλίπαις
  choice: 儿女出众
  rationale: 该词可指儿女容貌美好，也可泛指儿女美好、优秀；上下文着重他们的品格与勇气，因此“出众”较贴合语境，同时以脚注保留“美丽”的可能。
- source_word: γυνή
  choice: 妇人
  rationale: 保留该词“女人、妇人”的基本意义，不以“母亲”取代；母亲身份已由前两个复合形容词清楚表明。
- source_word: χήρα
  choice: 成了寡妇
  rationale: 明确表达她丧偶后的身份；“成了”在汉语中自然体现当前悲惨处境，虽属语义上的顺译。
- source_word: μόνη
  choice: 孤身一人
  rationale: 突出她失去丈夫和儿女后的孤独，比单说“独自”更符合哀歌语境。
- source_word: πολύθρηνος
  choice: 哀恸不已
  rationale: 把复合词理解为充满哀哭、深深悲恸，表达持续而强烈的哀伤；其可能带有被动或可悲叹意味，另见脚注。
