base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/008.yaml
  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: zh_hans
  text: 孩子们啊，我为你们白白[a]忍受了许多分娩之痛，以及养育你们时更为沉重的忧虑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白”也可译作“徒然地”或“枉然地”。
    reason: 词汇替代：μάτην表示徒劳、没有结果；此处保留原文的直陈语气。
lexical_decisions:
- source_word: μάτην
  choice: 难道都白费了吗
  rationale: 该副词表示徒劳、没有结果。结合全句作为母亲对孩子们的激切劝说，译成反问既自然地传达希腊文前置词的强调，也保留她所设想的痛苦可能归于徒然这一语气。
- source_word: ἐφʼ ὑμῖν
  choice: 为你们
  rationale: 在承受痛苦的语境中，此短语指这些苦楚是因孩子、为孩子而受；“为你们”简洁自然，并保留受益与缘由之间一定的语义弹性。
- source_word: ὦ παῖδες
  choice: 孩子们啊
  rationale: παῖδες可指孩子或儿子；此处是母亲称呼自己的后代。“孩子们”不作超出词义所必需的性别限定，“啊”保留呼语的庄重情感。
- source_word: πολλὰς ... ὠδῖνας
  choice: 许多分娩的痛苦
  rationale: ὠδῖνες具体指生产、临盆时的阵痛。“分娩的痛苦”是清楚而庄重的现代汉语，并保留母亲生产的具体意象；“许多”对应πολλάς。
- source_word: ὑπέμεινα
  choice: 忍受了
  rationale: 该不定过去时动词表示承受、坚持忍耐。“忍受了”准确表达过去所经历并承担的痛苦。
- source_word: χαλεπωτέρας
  choice: 更为沉重的
  rationale: 比较级表明抚养儿女的忧虑比生产之苦更难承受。“更为沉重的”能自然修饰“忧虑”，并明确保留比较意味。
- source_word: φροντίδας
  choice: 忧虑
  rationale: 该词指挂虑、操心或忧患；在母亲抚养孩子的语境中，“忧虑”兼顾内心焦灼与持续负担。
- source_word: ἀνατροφῆς
  choice: 抚养你们时
  rationale: 该属格说明忧虑所属的领域，即养育、教养孩子。译为“抚养你们时”符合现代汉语表达，并使与受话者的关系清楚。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将句首μάτην的强调在汉语中处理为句末反问，契合母亲劝勉孩子时的修辞语境，而不把“徒劳”陈述为已经确定的事实。保留分娩之苦与养育忧虑之间的比较关系。
