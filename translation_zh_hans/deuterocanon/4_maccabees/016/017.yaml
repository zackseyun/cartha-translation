  text: willingly for the ancestral law[a]. For it is shameful that this old man should endure the pains that come because of godliness[b], but you—
translation:
  language: zh_hans
  text: 甘愿为祖传的律法。因为，可耻的是，这位老人忍受因敬虔[a]而来的痛苦，而你们却——[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔诚”。这里指对上帝的敬畏和忠诚。
    reason: lexical_alternative
  - marker: b
    text: 本节的句子尚未结束，意思接续到下一节。
    reason: cross_reference
lexical_decisions:
- source_word: προθύμως
  choice: 甘愿
  rationale: 表达主动、乐意承担的态度，既保留自愿之意，也不把情感强度夸大为“热切”。
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: 为祖传的律法
  rationale: ὑπέρ加属格在此表示“为了、为……的缘故”；πατρίος指从先祖承袭而来的事物。“祖传的律法”简洁保留其传统及群体归属意味。
- source_word: αἰσχρόν
  choice: 可耻
  rationale: 表示在道德和荣誉层面令人羞耻，符合劝诫语气。
- source_word: γέροντα
  choice: 老人
  rationale: 直接指年老的男子，并保留与受劝者之间的修辞对照。
- source_word: ὑπομεῖναι
  choice: 忍受
  rationale: 表示在苦难之下坚持承受；“忍受”自然且不过度强化。
- source_word: ἀλγηδόνας
  choice: 痛苦
  rationale: 可指疼痛或苦楚；此处用“痛苦”兼顾肉体疼痛与受难语境，而不擅自加强为“酷刑”。
- source_word: διὰ τὴν εὐσέβειαν
  choice: 因敬虔而来
  rationale: διά加宾格在此表示原因；εὐσέβεια指向对上帝的敬畏与忠诚，“敬虔”保留其属神方向。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔诚；因忠于上帝
  rationale: “敬虔”能同时表达对上帝的敬畏及由此体现的忠诚，又不把词义缩减为单纯守法。脚注保留可行的现代说法。
- issue: 未完对比句的处理
  choice: 保留“而你们却——”的悬置结构
  alternative: 根据下一节补足谓语
  rationale: 希腊文本在ὑμᾶς δὲ处中断，本节没有给出与“你们”相配的谓语；不从下一节预先补足，以保存原文的悬念和跨节结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这实在可耻”后置，使汉语对比自然；破折号明确保留原文在“而你们却”处尚未完成的句法。开头依源文本保留承接上文的简短片段，不擅自补入原文未见的动词。
