  text: who[a], even if I were not to die, would bury some one of my sons. But with this lament the holy and God-fearing mother bewailed none of them,
translation:
  language: zh_hans
  text: 她[a]——“即使我死了，我也不会有我的儿子中任何一个来安葬我。”然而，这位圣洁、敬畏上帝的母亲并没有用这样的哀叹为他们中的任何一个哀哭，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文以阴性关系代词“她／这位……”承接上文，随即突转第一人称：“即使我死了，我也不会有……”。这似乎压缩地呈现母亲可能发出的哀叹。原文未明说“安葬”的宾语，中文按语境补作“我”。
    reason: 说明原文突兀的人称转换、让步否定结构，以及按语境补足的宾语。
lexical_decisions:
- source_word: ἣ
  choice: 她[a]
  rationale: 阴性关系代词承接上文所说的母亲；因原句随即突转第一人称，正文用破折号引出其心声，并以脚注保留这一句法突兀感。
- source_word: οὐδʼ ἂν ἀποθάνω
  choice: 即使我死了，也不会
  rationale: ἀποθάνω是第一人称单数虚拟式，配合ἄν构成假设条件；οὐδέ否定主句所说的结果，故不是“即使我不死”。
- source_word: θάπτοντα τῶν υἱῶν ἕξω τινά
  choice: 有一个儿子来安葬我
  rationale: ἕξω是ἔχω的将来时第一人称单数“我将有”，不是数字“六”；τινά是其宾语，θάπτοντα为宾语补足性分词，表示有某个儿子执行安葬她的动作。中文以“有一个儿子来……”自然表达。
- source_word: τούτῳ τῷ θρήνῳ
  choice: 用这样的哀歌
  rationale: θρῆνος指哀悼的话或哀歌；指回前面的设想之言，译作“这样的哀歌”既自然又保持指示关系。
- source_word: οὐδένα ὀλοφύρετο
  choice: 没有……为他们中的任何一个哀哭
  rationale: ὀλοφύρομαι表示悲恸哀哭；οὐδένα结合儿子们的语境，译出“任何一个”。
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: 这位圣洁、敬畏上帝的母亲
  rationale: ἱερά在此是宗教和道德上的尊称；θεοσεβής明确指向对上帝的敬畏，不泛化为一般的“虔诚”。
theological_decisions:
- issue: θεοσεβής的神学指向
  choice: 敬畏上帝
  alternative: 虔诚
  rationale: 原词明确表达对上帝的敬畏，保留其以神为中心的含义，同时不加入宗派性解释。
- issue: 开头第一人称的保留
  choice: 保留“我死了……安葬我”
  alternative: 顺成第三人称“她死了……安葬她”
  rationale: ἀποθάνω和ἕξω均为第一人称单数；即使句法突兀，也不应无文本依据地统一为第三人称。
- issue: 否定范围
  choice: 即使我死了，也不会有……
  alternative: 即使我不死，也会……
  rationale: οὐδέ否定的是“将有儿子安葬我”这一结果；ἀποθάνω本身不是被否定的不定式或分词。这样也保留母亲所面对的丧子张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安葬”“哀歌”“哀哭”符合殉道叙事的肃穆语域；不把ἕξω误作“六”，也不把第一人称改平为第三人称。句末逗号保留原文仍向下文延续的性质。
