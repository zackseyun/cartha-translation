  yaml_path: translation/deuterocanon/4_maccabees/006/025.yaml
  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
translation:
  language: zh_hans
  text: 在那里，他们用恶意巧制的刑具[a]焚烧他，又猛扑到他身上[b]，把恶臭的液体[c]灌进他的鼻孔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用恶意制成的器具”。原文强调这些器具制作巧妙，却用于害人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向他猛冲过去”。原词可表示跃起扑上或猛烈冲袭。
    reason: lexical_alternative
  - marker: c
    text: 或译：“恶臭的汤汁”。原词可泛指汁液、汤汁或其他液态混合物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνθα
  choice: 在那里
  rationale: 保留原文指向现场的空间性叙事衔接，比单纯译作“那时”更贴近其生动语气。
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: 用恶意巧制的刑具
  rationale: κακότεχνος兼有巧制与恶意害人的意味，ὄργανα指器具；结合受刑语境译作“刑具”，同时保留其蓄意设计之意。
- source_word: καταφλέγοντες
  choice: 焚烧
  rationale: 该词表示猛烈烧灼；“焚烧”简洁而有力度，符合此处酷刑场景。
- source_word: ὑπερίπτοσαν
  choice: 猛扑到他身上
  rationale: 该动词可表示跃起扑上或冲袭；此译保留动作的猛烈性，也不将其弱化为一般的靠近。
- source_word: δυσώδεις χυλούς
  choice: 恶臭的液体
  rationale: δυσώδης指气味难闻，χυλός可指汁液、汤汁或液态混合物；“液体”适合灌入鼻孔的语境，并保留词义范围。
- source_word: μυκτῆρας
  choice: 鼻孔
  rationale: 原文为复数，特指鼻孔，而非笼统的鼻子。
- source_word: κατέχεον
  choice: 灌进
  rationale: 原文表示向下倾倒；在把液体注入鼻孔的语境中，“灌进”自然、具体，并体现施暴动作。
