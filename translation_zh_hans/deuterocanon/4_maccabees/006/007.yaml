  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: zh_hans
  text: 他因身体承受不住剧痛而倒在地上，却仍使自己的理性[a]保持正直、毫不动摇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理性”也可译作“理性判断”；该希腊词在本书中带有哲学意味，指经过思考的道德判断能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων εἰς τὸ ἔδαφος
  choice: 倒在地上
  rationale: 以自然汉语表达分词所描写的身体倒下；其动作与主句的心志坚定形成鲜明对照。
- source_word: ἀπὸ τοῦ μὴ φέρειν τὸ σῶμα τὰς ἀλγηδόνας
  choice: 因身体承受不住那些剧痛
  rationale: 该结构说明倒地的原因；“剧痛”体现复数名词所指的强烈肉体痛楚，“身体”依语境自然指他的身体。
- source_word: ὀρθὸν εἶχεν
  choice: 仍保持正直
  rationale: 保留“使之直立”的隐喻；“仍”明确呈现身体倒下与理性不倒的对照，而不改变命题内容。
- source_word: ἀκλινῆ
  choice: 毫不动摇
  rationale: 表达“不倾斜、不屈服”的比喻意义，符合现代汉语对意志或判断坚定不移的说法。
- source_word: τὸν λογισμόν
  choice: 理性
  rationale: λογισμός在《马加比四书》中指支配激情的理性思考或判断能力；“理性”简洁地保留其哲学色彩。
theological_decisions:
- issue: 如何翻译具有哲学主题意义的 λογισμός
  choice: 理性
  alternative: 理性判断；心志
  rationale: “理性”最能保留本书关于敬虔理性胜过肉体痛苦和激情的主题；“心志”范围过宽，“理性判断”虽更具体，却在正文中略显解释性。
- issue: 身体倒下与理性坚定之间的张力
  choice: 以“倒在地上……却仍保持正直”保留对照
  alternative: 译作“虽然倒在地上”以显明让步关系
  rationale: 希腊文以并列分词和主句构成鲜明对照，但未明用让步连词；正文用“却仍”自然呈现语境张力，同时不过度改写句法关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句子通过“身体……倒在地上”与“理性……保持正直”保留原文贯穿肉体和理性的空间隐喻，并避免加入特定宗派解释。
