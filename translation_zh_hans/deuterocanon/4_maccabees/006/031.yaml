  text: Therefore, it is agreed that godly reason is master of the passions.
translation:
  language: zh_hans
  text: 因此，众所公认，敬虔的理性是各种强烈的情感和欲望的主宰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: 公认
  rationale: 该副词表示某事为人共同承认；“公认”简洁自然，并保留公开承认、无可否认的语气。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文论证并引出结论；“所以”在现代汉语中清楚表达推论关系。
- source_word: δεσπότης
  choice: 主宰
  rationale: 表示拥有支配权者；“主宰”适合本段理性统御情欲的哲学语境，也避免将其误读为对上帝的专称。
- source_word: τῶν παθῶν
  choice: 情欲
  rationale: πάθη在《马加比四书》中指需要受理性节制和统御的情感、欲望与冲动；“情欲”能概括这一道德哲学含义，但不限于性欲。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬虔的理性
  rationale: λογισμός指理性思考或理性能力，εὐσεβής说明这种理性以敬畏、尊崇上帝为取向；“敬虔的理性”同时保留宗教与理性两个层面。
theological_decisions:
- issue: 如何表达εὐσεβής所限定的理性
  choice: 敬虔的理性
  alternative: 敬神的理性；虔敬的理性
  rationale: 原文不是宣扬脱离信仰的自主理性，而是指受敬神生活塑造的理性。“敬虔”在现代中文宗教语境中庄重而可懂，同时不额外引入特定宗派教义。
- issue: 理性与πάθη之间的关系
  choice: 是情欲的主宰
  alternative: 支配情欲；是各种激情的主人
  rationale: 保留原文δεσπότης的名词性比喻和鲜明的统御关系，不把命题弱化为理性仅仅影响或调节情感。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“公认”置于主语之前，忠实传达ὁμολογουμένως的结论语气；“情欲”在此按较广义理解，包括欲望、冲动和强烈情感，并非专指性欲。
