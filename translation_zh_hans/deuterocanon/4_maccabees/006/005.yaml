  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: zh_hans
  text: 但那心志高尚、真正出身尊贵的以利亚撒，受刑时仿佛身在梦中，丝毫没有动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿佛身在梦中”是比喻，并不是说以利亚撒真的在做梦。
    reason: 澄清希腊文 ὥσπερ ἐν ὀνείρῳ 的明喻性质，避免按字面误读。
lexical_decisions:
- source_word: μεγαλόφρων
  choice: 心志高尚
  rationale: 表示精神和心志上的崇高；用“心志高尚”既自然，又与下文表示出身的 εὐγενής 保持区别。
- source_word: εὐγενής
  choice: 出身尊贵
  rationale: 该词本义涉及良好或高贵的出身；译作“出身尊贵”保留其社会、家世层面的含义，避免与 μεγαλόφρων 一并泛化为“高尚”。
- source_word: ὡς ἀληθῶς
  choice: 真正
  rationale: 用来加强对以利亚撒的描述；“真正”简洁地保留其强调语气。
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: 仿佛身在梦中
  rationale: 保留希腊文的明喻性质，表明这是对受刑体验的形象描述，并非断言他真的在做梦。
- source_word: βασανιζόμενος
  choice: 受刑时
  rationale: 在殉道叙事中指遭受肉体酷刑；“受刑时”以自然汉语表达分词所交代的同时情境。
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: 丝毫没有
  rationale: 表达全然否定；与“动摇”搭配自然，并保留“在任何方面都不”的强度。
- source_word: μετετρέπετο
  choice: 动摇
  rationale: 此处指在压力下偏离原有立场或决心；“没有动摇”清楚传达其坚定不移，虽未机械保留希腊文中动形式，却符合现代汉语习惯。
theological_decisions:
- issue: 以利亚撒受刑时“仿佛身在梦中”的含义
  choice: 作为明喻，描写他在酷刑中的超然与坚定，而不是说他真的处于梦境。
  alternative: 也可侧重酷刑对他而言仿佛不真实，如同梦中发生的事。
  rationale: ὥσπερ 明确引出比较；译文保留形象及其一定的开放性，不额外引入有关灵魂、痛觉或神迹的哲学和教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“心志高尚”与“出身尊贵”分别呈现内在品格和家世背景；“丝毫没有动摇”自然表达其在酷刑中的坚定。脚注标记置于主文句末，所注内容对应句中的梦境比喻。
