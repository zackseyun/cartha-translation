  text: Some of the king’s men[a], being moved by sympathy because of their long acquaintance with him, and others approaching him in admiration of his endurance, were saying[b],
translation:
  language: zh_hans
  text: 王手下有些人因与他素来相熟[a]而心生同情；另一些人则钦佩他的坚忍[b]，走上前来，对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他素来相熟”或译“因与他熟识”。希腊语 συνήθεια 可指长期来往或熟悉的关系。
    reason: lexical_alternative
  - marker: b
    text: “坚忍”或译“坚定不屈”。希腊语 καρτερία 指在考验中忍耐、坚持。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμπαθείᾳ τῆς συνηθείας
  choice: 因与他素来相熟，心生同情
  rationale: συμπάθεια 表示同情、怜悯之感，συνήθεια 可指因长期交往而形成的熟悉。译文将二者的因由关系自然表达出来，又不把这种关系强化为亲密友谊。
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: 钦佩他的坚忍
  rationale: θαυμαστόν 在此表示惊叹、赞赏，καρτερία 指在苦难或考验中坚忍不屈；“钦佩他的坚忍”简洁地保留了赞叹意味。
- source_word: προσίοντες αὐτῷ
  choice: 便走上前来
  rationale: 保留趋近他的实际动作，并以“便”使分词结构在现代汉语叙事中衔接自然。
- source_word: τινες τῶν τοῦ βασιλέως
  choice: 王手下有些人
  rationale: 该属格结构指隶属或随从王的人，但未明确具体官职；“王手下”自然且避免过度具体化。
- source_word: ἔλεγον
  choice: 对他说
  rationale: 希腊文未完成时可表示正在或持续说话；本节引出下一节的直接引语，汉语以“对他说：”最自然，冒号也表明话语尚未结束。
