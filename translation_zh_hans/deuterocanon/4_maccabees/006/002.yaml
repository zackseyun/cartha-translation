  text: And first they stripped the old man[a], adorned with the dignity of godliness.
translation:
  language: zh_hans
  text: 他们首先剥去了这位老人[a]的衣服；他以敬虔的端庄为装饰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “老人”也可译作“年迈者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: 他们首先
  rationale: 保留καί的承接作用和πρῶτον μέν所标示的顺序，同时符合现代汉语叙事习惯。
- source_word: περιέδυσαν
  choice: 剥去了……的衣服
  rationale: 该动词指剥去某人身上的衣服；明说“衣服”可自然传达动作对象及其羞辱性，而不误解为抽象地剥夺品格。
- source_word: τὸν γεραιὸν
  choice: 这位老人
  rationale: 直接表达年迈之意；“这位”在现代汉语中较自然，也保留对人物的尊重。
- source_word: ἐκκεκοσμημένον
  choice: 以……为装饰
  rationale: 保留κοσμέω的装饰意象，并与后面的抽象品质形成原文所具有的修辞张力。
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: 敬虔的端庄
  rationale: εὐσχημοσύνη可指端庄、得体或高雅风范；περὶ τὴν εὐσέβειαν表示这种端庄与敬虔相关。简洁译法既保留压缩结构，也保持庄重语体。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 在《马加比四书》中该词是关乎敬奉上帝并忠于律法的重要德性；“敬虔”兼具宗教和伦理内涵。
theological_decisions:
- issue: 《马加比四书》中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔敬
  rationale: “敬虔”能表达对上帝的敬奉以及由此产生的生活德性；“虔敬”同样可行，但前者在此处与“端庄”搭配更凝练。
- issue: 衣服被剥去与敬虔尊严之间的关系
  choice: 用分号并列身体所受羞辱与其内在端庄，不说敬虔本身被剥夺
  alternative: 译作“剥去了老人敬虔的尊严”
  rationale: περιέδυσαν直接描述脱去衣服，而分词短语刻画老人仍以敬虔的端庄为装饰。这样避免把施暴者的动作解释为能够夺去他的德性。
translation_notes:
  register: 采用现代、庄重而清晰的书面汉语。“剥去了……的衣服”明确实际动作；分号保留原句中外在受辱与内在尊荣的对照。主文中的[a]与脚注对应。
