base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
translation:
  language: zh_hans
  text: 以利亚撒这样反驳了暴君的劝诱[a]之后，侍卫[b]便上前，残酷地[c]把他拖向刑具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝诱”或译“劝说”“规劝”；原词也可指鼓励，但这里是指暴君企图使以利亚撒顺从的话。
    reason: lexical_alternative
  - marker: b
    text: “侍卫”原文直译为“持矛者”，在这里指统治者身边的武装侍从。
    reason: lexical_alternative
  - marker: c
    text: “残酷地”也可译“严厉地”或“粗暴地”；原文副词强调他们对待他的严酷程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: 这样
  rationale: 以自然的现代汉语表达方式状语，同时保留原文的指示意味。
- source_word: ἀντιρρητορεύσαντα
  choice: 反驳了
  rationale: 该分词指以言辞作出反对性的回应；“反驳”简洁保留其对抗意味，又不必将场景限定为正式辩论。
- source_word: παρηγορίαις
  choice: 劝诱
  rationale: 该词可指劝说、规劝或鼓励；此处暴君企图诱使以利亚撒顺从，“劝诱”既表达劝说，也显出语境中的不正当意图。
- source_word: δορυφόροι
  choice: 侍卫
  rationale: 字面为“持矛者”，在王室或统治者的语境中指武装随从、近身卫士；“侍卫”自然传达其职能。
- source_word: παραστάντες
  choice: 上前
  rationale: 在叙事中表示侍卫来到近前并采取行动；“上前”符合动作顺序和现代汉语习惯。
- source_word: πικρῶς
  choice: 残酷地
  rationale: 该副词字面可含“苦涩地”之意，在此修饰施暴行为，强调严酷和残忍；“残酷地”比直译“苦涩地”准确自然。
- source_word: ἔσυραν
  choice: 拖
  rationale: 原词表示用力拉拽；“拖”直接呈现强迫和暴力。
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: 向刑具
  rationale: 复数名词可指施刑的器具、刑罚或施刑处；“向刑具”保留其具体复数意象，又避免擅自断定为刑房。
- source_word: τὸν Ἐλεάζαρον
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
