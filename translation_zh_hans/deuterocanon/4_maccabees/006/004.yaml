  text: “Obey the king’s commands,” another herald cried out[a].
translation:
  language: zh_hans
  text: “听从王的命令！”一名传令官从另一边高声喊道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一名传令官从另一处高声喊道。”希腊文的“从另一边／另一处”强调喊声来自不同方向；按上下文，也可能暗示是另一名传令官。
    reason: 保留ἑτέρωθεν的空间意义，并将其可能指向不同传令官的解释明确保留为非确定性说明。
lexical_decisions:
- source_word: Πείσθητι
  choice: 听从
  rationale: 该词虽在形式上可译为“被说服”，但在王命的语境中表示接受权威并照办；“听从”既自然，也保留劝服与服从之间的语义联系。
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: 王的命令
  rationale: ἐντολαί指具有权威的指令；“命令”准确传达王权所要求的服从。
- source_word: ἑτέρωθεν
  choice: 从另一边
  rationale: 该副词表示“从另一处／另一方向”；正文保留其空间含义，不将其完全化约为“另一名”。
- source_word: κῆρυκος
  choice: 传令官
  rationale: κῆρυξ是公开宣告命令的正式人员；“传令官”比泛称“使者”更准确，也比“报信人”庄重。
- source_word: ἐπιβοῶντος
  choice: 高声喊道
  rationale: 该分词表示大声呼喊或公开宣告；“高声喊道”自然体现声音和紧迫感。
