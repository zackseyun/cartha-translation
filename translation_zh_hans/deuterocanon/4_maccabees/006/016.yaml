  text: And Eleazar[a], as though he had been tortured more bitterly by this counsel, cried out,
translation:
  language: zh_hans
  text: 以利亚撒仿佛因这番劝说而受了更痛苦的折磨，就高声喊道：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿佛因这番劝说而受了更痛苦的折磨”也可译作“好像这番劝说使他受到了更加残酷的折磨”。希腊文的比较结构及介词短语既可侧重劝说是折磨的手段，也可侧重它是痛苦加深的缘由。
    reason: 保留ὥσπερ及διὰ τῆς συμβουλίας在自然中文表达中的多种可能。
lexical_decisions:
- source_word: ὁ Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 按现代中文圣经人名的通行译法音译此专名。
- source_word: ὥσπερ
  choice: 仿佛
  rationale: 引出对其感受或反应的比较，保留希腊文并未直接断言实际再次受刑的修辞意味。
- source_word: πικρότερον
  choice: 更痛苦
  rationale: 比较级在此形容受折磨的程度；中文用“更痛苦”自然传达强烈程度，虽不直译“苦涩”的隐喻。
- source_word: διὰ τῆς συμβουλίας
  choice: 因这番劝说
  rationale: διά加属格可表达手段或缘由；“因这番劝说”在中文中自然，并保留劝说本身加深其痛苦的含义。定冠词结合近距语境译作“这番”。
- source_word: αἰκισθείς
  choice: 受了……折磨
  rationale: 被动分词表示遭受凌辱、虐待或酷刑；殉道语境中“受折磨”既传达严重性，也避免过度限定具体刑罚。
- source_word: ἀνεβόησεν
  choice: 高声喊道
  rationale: 准确表现动词所含的大声呼喊之意，并以“道”自然衔接下文引语。
