  yaml_path: translation/deuterocanon/4_maccabees/006/021.yaml
  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: zh_hans
  text: 难道我们要被暴君当作没有男子气概的人[a]而蔑视，却不至死捍卫我们神圣的律法吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“懦夫”。希腊语原词直译为“没有男子气概的人”，以性别化的说法指缺乏勇气。
    reason: 保留原文性别化措辞，同时说明其实际语义。
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: 被……蔑视
  rationale: 保留被动语态及羞辱、轻蔑的语气；“蔑视”在现代汉语中自然凝练。
- source_word: τοῦ τυράννου
  choice: 暴君
  rationale: τύραννος 带有对残酷专制统治者的贬义评价，不宜中性化为“君王”或“统治者”。
- source_word: ἄνανδροι
  choice: 没有男子气概的人
  rationale: 该词字面带有性别色彩，指缺乏被视为男性应有的勇气；正文保留原文的性别化羞辱，脚注说明其语义可译为“懦夫”。
- source_word: τὸν θεῖον ἡμῶν νόμον
  choice: 我们神圣的律法
  rationale: θεῖον 表明律法具有神圣性质或属于上帝；“神圣的律法”简洁庄重，同时不作超出原文的解释。
- source_word: μέχρι θανάτου
  choice: 至死
  rationale: 表达捍卫律法一直到死亡的极限，汉语“至死”简洁有力。
- source_word: προασπίσαιμεν
  choice: 捍卫
  rationale: 该动词本有持盾护卫、为之辩护保护之意；“捍卫”适合受迫害处境，也保留坚决护卫的力度。
theological_decisions:
- issue: 如何处理 ἄνανδροι 的性别化羞辱
  choice: 没有男子气概的人
  alternative: 懦夫
  rationale: 原文并非仅一般性地说“胆怯”，而是借“缺乏男子气概”施加羞辱。正文保留这一修辞张力，脚注提供现代汉语中更直接的语义对应。
- issue: θεῖον 与律法的关系
  choice: 神圣的律法
  alternative: 属上帝的律法
  rationale: 形容词 θεῖον 可强调神圣性质，也可暗示属于或出于上帝；采用“神圣的”避免把关系明确化到超过原文的程度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“难道……吗”呈现希腊语的反问语气，并用“却”表达 μὲν…δὲ 的对照关系。
