  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: zh_hans
  text: 那位老人如同一位英勇的竞技者[a]；他虽不断遭受击打，却一直胜过那些折磨他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如一位勇敢的竞技者，在受击打时不断胜过折磨他的人。”
    reason: ‘如同’也可译为‘正如’；γενναῖος可译为‘勇敢的’，并且分词短语可按汉语语序前置表达。
lexical_decisions:
- source_word: καθάπερ
  choice: 如同
  rationale: 引出明喻，现代汉语自然庄重，并保留原文的比较关系。
- source_word: γενναῖος
  choice: 英勇的
  rationale: 在此竞技和受难语境中主要表现勇毅；“英勇”既传达勇敢，也符合原文较高的修辞格调。
- source_word: ἀθλητής
  choice: 竞技者
  rationale: 保留古希腊竞技比赛的形象；比现代常使人想到体育职业的“运动员”更贴近古代语境，又不扩展为“英雄”或“冠军”。
- source_word: τυπτόμενος
  choice: 虽不断挨打
  rationale: 表达现在被动分词所描写的持续受击，并以“虽……却……”自然呈现它与得胜之间的让步性对照。
- source_word: ἐνίκα
  choice: 一直胜过
  rationale: 未完成时表示受刑过程中持续的得胜；“胜过”也保留竞技比喻，同时避免把它具体化为身体上的击败。
- source_word: τοὺς βασανίζοντας
  choice: 那些折磨他的人
  rationale: 有冠词的现在分词指正在施加酷刑的人；按汉语表达补出语境中明确的受事“他”。
- source_word: ὁ γέρων
  choice: 那老人
  rationale: 直指这位年老者，并保留其高龄与竞技形象之间的鲜明反差；避免“长老”可能暗示的职分含义。
theological_decisions:
- issue: 以竞技得胜比喻殉道者承受酷刑
  choice: 直接保留“竞技者”与“胜过”的比喻
  alternative: 意译为“老人英勇忍受酷刑，使折磨他的人不能得逞”
  rationale: 原文明说老人如竞技者，并以 νικάω 描绘其得胜。保留这组形象可呈现作者的伦理与修辞张力，而不把“得胜”的具体意义单一解释为忍耐、道德优越或使刑讯失败。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“虽不断挨打，却一直胜过”保留两个持续动作之间的反差；语序以“那老人”开头，使汉语流畅，同时不改变原文焦点。
