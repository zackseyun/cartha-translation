  yaml_path: translation/deuterocanon/4_maccabees/006/029.yaml
  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: zh_hans
  text: 求你使我的血洁净他们[a]，收取我的性命，来替代他们的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你使我的血成为他们的洁净。”希腊词 καθαρσόν 可指礼仪意义上的洁净或净化。
    reason: lexical_alternative
  - marker: b
    text: 原文表达以说话者的性命代替他们的性命；也可译作“以我的性命换取他们的性命”。译成“作他们的赎价”亦有可能，但解释意味更强。
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσόν
  choice: 洁净
  rationale: 此词在 ποίησον 的结构中表示使血成为给他们带来洁净之物，并可含礼仪性的洁净意味。“洁净”自然且保留祭献语境，又不将其过度限定为后来的专门教义术语。
- source_word: αἷμα
  choice: 血
  rationale: 按原文直译；这里明确以说话者的血和死亡表达祭献性的意义。
- source_word: ἀντίψυχον
  choice: 作为他们性命的替代
  rationale: 该复合词表达以一命替一命的交换或代替。“替代”保留代替性，同时避免“赎价”可能带入的较强商业或后期教义色彩。
- source_word: ψυχήν
  choice: 性命
  rationale: 殉道语境中指所舍弃的生命，而非主要指与身体相对的非物质灵魂；“性命”也能清楚呈现前后两处生命的对应。
- source_word: λάβε
  choice: 收取
  rationale: 这是向上帝发出的祈求；“收取”既保留命令式的直接性，也比口语性的“拿走”更符合庄重的祭献语境。
theological_decisions:
- issue: 殉道者祷告中的祭献与替代性语言
  choice: 明确保留“洁净”和“作为……性命的替代”
  alternative: 求你使我的血为他们赎罪，并以我的性命作他们的赎价
  rationale: 希腊文确有礼仪洁净及以命代命的张力，但没有要求译文将其系统化为后来的特定赎罪理论；因此保留原文力度而不作过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补明希腊语命令式在祈祷中的语用色彩；两次使用“性命”以显明以命代命的对应关系。脚注标记按正文出现顺序排列。
