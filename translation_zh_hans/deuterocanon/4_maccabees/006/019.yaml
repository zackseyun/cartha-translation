  yaml_path: translation/deuterocanon/4_maccabees/006/019.yaml
  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: zh_hans
  text: 而我们自己会给年轻人作不敬神的典型，以致成为吃污秽之物[a]的例子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃污秽之物”也可译作“污秽的进食”或“吃不洁净的食物”。
    reason: 词义与表达方式的备选译法
lexical_decisions:
- source_word: τύπος
  choice: 样式
  rationale: 可指样式、模型或典型。此处与后面的 παράδειγμα 并用，译作“样式”可保留两个近义词之间的修辞差别。
- source_word: ἀσεβείας
  choice: 不敬神
  rationale: 表达对神缺乏敬畏的宗教与道德含义，比单纯的“不虔诚”更直白易懂。
- source_word: τοῖς νέοις
  choice: 年轻人
  rationale: νέοι 可泛指年轻人，也可能指年轻男子；译文不在希腊文未明确之处限定性别。
- source_word: παράδειγμα
  choice: 范例
  rationale: 通常指例子或典范；用“范例”与前面的“样式”相区分，同时保留示范作用。
- source_word: μιαροφαγίας
  choice: 吃污秽之物
  rationale: 该词结合“污秽”与“进食”的概念；此译法自然地表达食用被视为污秽之物，同时不把它缩限为某一技术性礼仪术语。
- source_word: γενοίμεθα / γενώμεθα
  choice: 就会成为／好成为
  rationale: 前者在语境中表达假设性的结果，后者由 ἵνα 引出目的或结果；分别译为“就会成为”和“好成为”，保留两者关系。
theological_decisions:
- issue: ἀσεβείας 的宗教含义
  choice: 不敬神
  alternative: 不虔诚
  rationale: 这里所说的不只是失当行为，而是违背对神应有的敬畏；“不敬神”清楚保留这一神学力度。
- issue: μιαροφαγίας 的具体范围
  choice: 吃污秽之物
  alternative: 吃不洁净的食物
  rationale: 上下文涉及违背律法而食用禁物，但该希腊词本身不必被固定为技术性的洁净条例用语，因此正文保留较宽泛的表达。
- issue: ἵνα 所表达的目的与结果张力
  choice: 好成为
  alternative: 以致成为
  rationale: ἵνα 可表达目的或预期结果；“好成为”保留目的意味，而不额外判定行为者确实想成为恶例。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“样式／范例”保留 τύπος 与 παράδειγμα 的近义并列；脚注标记置于整句末，所注释的是“吃污秽之物”。
