    issue: 将ὑποκρίνασθαι释作“装作去做”，且脚注断言“并非真正实行”。
    rationale: 该词在δρᾶμα的戏剧语境中主要是“扮演／演出”；原文的修辞可含表演性，却不足以确证行为只是佯装、并未实行。此断言不必要地消除了原文的语义开放性。
  - severity: low
    issue: “不配我们的可耻之事”未充分体现δρᾶμα。
    rationale: δρᾶμα明确带有戏剧、场面的比喻；译文宜保留“演出”“丑剧”等形象。
