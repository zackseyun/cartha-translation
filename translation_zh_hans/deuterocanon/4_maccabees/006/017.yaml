  rationale: 修订保留原文的集体劝诫、亚伯拉罕后裔的身份诉求和因胆怯而行动的关系；以“演出一出……丑剧”重现ὑποκρίνασθαι／δρᾶμα的修辞，并删除原脚注中无法由原文确证的“仅是佯装”解释。
