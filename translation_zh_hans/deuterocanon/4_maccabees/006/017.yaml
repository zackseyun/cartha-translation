base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/017.yaml
  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: zh_hans
  text: 我们这些亚伯拉罕的子孙，千万不要怀有如此恶劣的心思，以致因胆怯而演出一出有失我们身份的可耻丑剧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “演出……丑剧”直译原文的戏剧性表达，意为扮演或演出一出不合我们身份的戏；不必限定为只是佯装、而没有实际行为。
    reason: 说明ὑποκρίνασθαι与δρᾶμα的戏剧比喻，同时避免对该行为是否实际实行作出原文未明说的判断。
lexical_decisions:
- source_word: Μὴ οὕτως κακῶς φρονήσαιμεν
  choice: 绝不可有这样卑劣的念头
  rationale: 该祈愿式否定表达强烈劝阻；κακῶς φρονεῖν指思想、意念上的错误或卑劣，而非单纯“把事情想得很糟”。
- source_word: οἱ Ἀβραὰμ παῖδες
  choice: 我们这些亚伯拉罕的子孙
  rationale: παῖδες在谱系身份语境中指后裔、子孙；补出“我们这些”保留同位结构及群体认同。
- source_word: μαλακοψυχήσαντας
  choice: 因胆怯
  rationale: 该词指心志软弱、失去勇气；“胆怯”自然传达此处面对逼迫时的退缩。
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα
  choice: 不配我们的可耻之事
  rationale: ἀπρεπές兼有不得体、不相称之意；与ἡμῖν结合，强调这种行为有失其亚伯拉罕子孙的身份。
- source_word: ὑποκρίνασθαι
  choice: 装作去做
  rationale: 中动词在此可指佯装、扮演某种行为；保留其“并非真正实行，而是作出实行的样子”的语义张力。
theological_decisions:
- issue: “亚伯拉罕的子孙”的身份含义
  choice: 按原文保留谱系与圣约群体身份用语，不扩展解释
  alternative: 译作“亚伯拉罕的儿女”或增译为“信仰亚伯拉罕的人”
  rationale: 原文只明说Ἀβραὰμ παῖδες；不应在正文中把血缘、群体或信仰身份之间的关系单向定论。
- issue: 受逼迫时佯装违背律法是否等同实际违背
  choice: 保留“装作去做”的明确措辞
  alternative: 简化为“做出可耻之事”
  rationale: ὑποκρίνασθαι突出了佯装行为；经文仍判定这种妥协可耻，但不应抹去佯装与实际行为之间的区别。
translation_notes:
  register: 采用庄重而自然的现代汉语。“绝不可”体现希腊文祈愿式否定的强烈劝戒语气；句式保留演说中自我劝勉和群体身份诉求。
