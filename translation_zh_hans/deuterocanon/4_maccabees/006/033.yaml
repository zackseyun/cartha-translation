  source_fidelity: 译文准确呈现原文的转折（νυνὶ δέ）、理性战胜情欲的既成事实（τοῦ λογισμοῦ τὰ πάθη νικήσαντος），以及因此合宜地把领导／统治的权柄归于理性（προσηκόντως…προσνέμομεν）。「它」明确回指抽象名词「理性」，没有无根据地加强人格化。
  naturalness: 「但如今，……既已……，我们就理当……」是自然、庄重的现代书面汉语，且清楚表达原句的论证推进。「统治的权柄」虽带正式语体，但适合本书的哲学—修辞语境。
  terminology: 「理性」与「情欲」恰当地保留《马加比四书》中 λογισμός 与 πάθη 的核心伦理哲学对照。「种种情欲」可表达复数及多类非理性冲动；脚注也适当排除了此处并不合适的「苦难」义。脚注标记分别紧随「理性」和「情欲」，与其所说明的词语一致。
