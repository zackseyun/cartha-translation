base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/033.yaml
  text: But now[a], since reason has conquered the passions[b], we rightly assign to it the authority of leadership.
translation:
  language: zh_hans
  text: 但如今，理性[a]既已战胜种种情欲[b]，我们就理当把统治的权柄归给它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理性”也可译作“理性判断”。
    reason: lexical_alternative
  - marker: b
    text: “情欲”在这里指欲念、情感和冲动，并非“苦难”。
    reason: contextual_clarification
lexical_decisions:
- source_word: νυνὶ δέ
  choice: 但如今
  rationale: 既标明论述推进，也保留 δέ 所带的轻微转折。
- source_word: λογισμοῦ
  choice: 理性
  rationale: 本书以此词指能够作出道德判断并统御情欲的理性；“理性”简洁自然，也保留其哲学含义。
- source_word: τὰ πάθη
  choice: 种种情欲
  rationale: 在本书的伦理论述中，此词主要指受理性约束的欲念、情感与冲动，而非外在的苦难；“种种情欲”体现复数并与“理性”形成对照。
- source_word: νικήσαντος
  choice: 既已战胜
  rationale: 以原因性分句表达属格结构，并用“已”保留不定过去时所呈现的胜利已然实现。
- source_word: αὐτῷ
  choice: 归给它
  rationale: 代词回指“理性”；用“它”保留原文的修辞表达，而不额外强化人格化。
- source_word: προσηκόντως
  choice: 理当
  rationale: 表达合宜、正当之意，也自然衔接作者由胜利推导统治权的论证。
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: 统治的权柄
  rationale: “统治”对应 ἡγεμονία，“权柄”对应 ἐξουσία，同时保留两个名词所表达的治理与合法权能。
- source_word: προσνέμομεν
  choice: 把……归给
  rationale: 准确表达分配、归属之意，在现代汉语中比生硬的“授予”更能呈现作者承认理性应有地位的语气。
theological_decisions:
- issue: λογισμός 与 πάθη 的人论及哲学框架
  choice: 译作“理性”与“种种情欲”
  alternative: 可译作“理性判断”与“种种冲动”或“各种情感”
  rationale: 此处延续《马加比四书》的核心论旨，即受训练的理性能够统御非理性的欲念和冲动。译文保留这一张力，却不把一切情感本身判定为邪恶，也不引入后来的宗派性人论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“既已……就理当……”清楚呈现原文从理性得胜到理性应获统治权的推论；“统治的权柄”保留原文两个治理性名词的力度。
