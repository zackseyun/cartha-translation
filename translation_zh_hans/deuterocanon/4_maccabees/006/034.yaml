  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: zh_hans
  text: 而且，我们理当承认，理性具有支配力[a]，因为它甚至能胜过外来的痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“支配之权属于理性”或“理性掌权”。希腊语强调理性的力量和统御能力。
    reason: lexical_alternative
  - marker: b
    text: 或译：“外在的痛苦”。原文指从外而来的痛苦，很可能包括身体所受的苦楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν ἐστιν
  choice: 理当
  rationale: 表达“这是正确、合宜的”这一道德与论证性判断，在现代汉语中简洁庄重。
- source_word: ὁμολογεῖν
  choice: 承认
  rationale: 此处是公开认可论证所得的结论，并非认罪意义上的“承认”或宗教性的“宣认”。
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: 支配之权属于理性
  rationale: 保留原文以 κράτος 为中心的名词结构及其“力量、统治权、优势”的含义，避免把句法关系仅化约为形容词“理性至高无上”。
- source_word: λογισμός
  choice: 理性
  rationale: 在《马加比四书》的论述中，指人的理性能力或理性判断；“理性”简洁自然，并保留其哲学分量。
- source_word: ὅπου γε καὶ
  choice: 因为……甚至
  rationale: 在本句中引出支持前一结论的根据，同时传达 γε 与 καί 所带的强调意味。
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: 外来的痛苦
  rationale: ἔξωθεν 表示从外而来或外在的，ἀλγηδόνες 指痛苦；此译保留空间与来源意味，不径直限定为“肉体痛苦”。
- source_word: ἐπικρατεῖ
  choice: 胜过
  rationale: 表达占上风、制胜或取得支配地位，汉语自然，并与前面的“支配之权”相呼应。
theological_decisions:
- issue: λογισμός 的哲学—人论含义及其支配力
  choice: 支配之权属于理性
  alternative: 理性居于主宰地位；理性掌权
  rationale: 原文论证理性能够胜过痛苦，因而具有统御力量。此译保留其强势主张，却不引入后期神学范畴，也不把它扩张为理性在一切领域的绝对主权。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“所以”承接本段论证；“理当承认”体现结论性语气。脚注标记均置于相应词语之后，并按正文出现次序排列。
