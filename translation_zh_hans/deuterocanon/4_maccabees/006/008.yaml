  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: zh_hans
  text: 那时，一个凶狠的持矛卫兵[a]扑向他的腰肋，连连踢打他，好叫他一倒下就再站起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “持矛卫兵”也可译作“护卫”；希腊语字面指持矛的侍从或卫兵。
    reason: 说明δορυφόρων既有字面器械意象，也可作为护卫身份的称呼。
lexical_decisions:
- source_word: λάξ
  choice: 猛踢
  rationale: λάξ是副词，意为“用脚、用脚跟”，与ἔτυπτεν合起来表示踢打。这里按希腊文本的具体动作翻译，不把它仅处理为叙事语气词。
- source_word: γέ τοι
  choice: 那时
  rationale: 该组合在此带有强调和承接叙事的作用；“那时”自然连接上下文，而不生硬逐词对应。
- source_word: τῶν πικρῶν
  choice: 凶狠的
  rationale: πικρός本义为“苦的”，用于人时可指严酷、狠毒；暴力场景中“凶狠”准确而自然。
- source_word: δορυφόρων
  choice: 持矛卫兵
  rationale: 该词字面指“持矛者”，也常指君王身边的护卫；译文兼顾器械意象和实际身份。
- source_word: εἰς τοὺς κενεῶνας
  choice: 他的腰肋
  rationale: κενεών指身体两侧的凹陷部位，即腰腹侧面或胁部；“腰肋”比单说“两侧”更清楚地标明受击部位。
- source_word: ἐναλλόμενος
  choice: 跳起来
  rationale: 分词描写猛然跃起或扑向目标的动作；与“猛踢”连用，保留原文鲜明而暴烈的动态。
- source_word: ἔτυπτεν
  choice: 猛踢
  rationale: 未完成时表示持续或反复击打；结合λάξ，应理解为不断用脚踢，汉语以“猛踢”凝练表达其动作和力度。
- source_word: ὅπως ἐξανίσταιτο πίπτων
  choice: 使他倒下时还得重新站起来
  rationale: ὅπως加愿望式表达施暴者的目的；πίπτων与“重新站起”构成倒下后又被迫起身的画面。“还得”明确表现强迫，却不把该短语误作复活用语。
theological_decisions:
- issue: ἐξανίσταιτο是否含有复活含义
  choice: 指受刑者倒下后被迫重新站起来
  alternative: 理解为带有复活意味的“再次起来”
  rationale: 本节直接描写刑讯过程，动作的目的在于迫使倒下的人继续起身受刑；此处没有必要引入复活教义。汉语“重新站起来”自然限定为身体动作。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“腰肋”准确呈现身体侧面的受击部位；“还得”传达受刑者被强迫重新起身。译文依据希腊语λάξ保留了“用脚踢”的具体动作，并以脚注解释δορυφόρων的词义范围。
