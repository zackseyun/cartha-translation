  text: But he endured the pains, and he scorned the compulsion, and he persevered through the tortures,
translation:
  language: zh_hans
  text: 然而，他忍受着痛苦，蔑视强迫，并在酷刑中坚持不屈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέμενεν
  choice: 忍受着
  rationale: 体现未完成时所描写的持续承受，也自然衔接宾语“痛苦”。
- source_word: τοὺς πόνους
  choice: 痛苦
  rationale: 此处复数指受刑所带来的种种痛楚；汉语用集合意义的“痛苦”更自然。
- source_word: περιεφρόνει
  choice: 蔑视
  rationale: 保留该词轻看、不把某事放在眼里的强烈语气，与英语审校层的“scorned”一致。
- source_word: τῆς ἀνάγκης
  choice: 强迫
  rationale: 在受刑逼迫的语境中指外加的强制压力；译作“强迫”既简洁，也不额外限定具体手段。
- source_word: διεκαρτέρει
  choice: 坚持不屈
  rationale: 表达面对持续折磨仍坚忍到底；“不屈”补足汉语语义，使其不被误解为只是让酷刑继续。
- source_word: τοὺς αἰκισμούς
  choice: 酷刑
  rationale: 该词指残酷虐待、折磨；本段语境中“酷刑”准确而有力度。
