lexical_decisions:
- source_word: ἔπειτα
  choice: 接着
  rationale: 表示酷刑过程进入下一阶段；“接着”自然、清楚地保留了叙事的先后推进。
- source_word: περιαγκωνίσαντες
  choice: 把他的双臂反扭到背后
  rationale: 这是由“肘、臂”（ἀγκών）构成的罕见动词，其确切动作不完全确定，可能指制住、捆住或扭转双臂。“反扭到背后”传达施力控制双臂的动作，同时以脚注保留其他可能。
- source_word: ἑκατέρωθεν
  choice: 从两边
  rationale: 该副词表示从两侧或每一边实施动作；“从两边”简洁地保留其双侧含义。
- source_word: μάστιξιν
  choice: 用鞭子
  rationale: μάστιξ 的工具格复数，指抽打所用的鞭具；“鞭子”是现代汉语中清楚而不古奥的表达。
- source_word: κατήκιζον
  choice: 不断折磨他
  rationale: 未完成过去时描写持续进行的虐待；结合“用鞭子”，“不断折磨”既体现严重程度，也体现动作的延续性。
