  text: Why are you irrationally destroying yourself with these evils[a], Eleazar?
translation:
  language: zh_hans
  text: “以利亚撒，你为什么在这些苦难[a]中不理智地毁掉自己呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着这些苦难”或“因这些苦难”。希腊语与格可表示手段、所处情境，也可在语境中带有原因意味；此处指施加在以利亚撒身上的痛苦。
    reason: 保留τοῖς κακοῖς τούτοις的与格在手段、处境和可能的原因含义之间的语法弹性，避免将其扩展为原文未明说的被动动作。
lexical_decisions:
- source_word: Τί
  choice: 为什么
  rationale: 这里的疑问词用于责问原因或动机，现代汉语自然译为“为什么”。
- source_word: τοῖς κακοῖς τούτοις
  choice: 因这些苦难
  rationale: 与格可表示手段或处境；κακά语义较宽，在上下文中指施加于以利亚撒的痛苦遭遇。“苦难”比直译“恶事”更自然，同时不限定为特定刑罚。
- source_word: σεαυτόν
  choice: 自己
  rationale: 作ἀπόλλυες的反身宾语。
- source_word: ἀλογίστως
  choice: 不合理地
  rationale: 保留“缺乏理性、理智判断”的含义，也呼应本书关于理性与激情的主题；不译成较强烈而可能过度解释的“愚蠢地”。
- source_word: ἀπόλλυες
  choice: 毁掉
  rationale: 未完成过去时在直接话语中描写正在进行的行动；结合反身宾语，译为“毁掉自己”可传达说话者对其走向死亡的指控。
- source_word: Ἐλεάζαρ
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: κακοῖς在以利亚撒殉道语境中的解释
  choice: 正文译为“苦难”
  alternative: 恶事；刑罚；酷刑
  rationale: 该词本身范围较广，而上下文明确涉及他正遭受的痛苦。“苦难”既符合语境，又避免把原文具体化为并未明说的“酷刑”。
- issue: ἀλογίστως所表达的价值判断
  choice: 译为“不合理地”
  alternative: 不理智地；毫无思量地；愚蠢地
  rationale: 原文是施刑者对以利亚撒选择的责问，并不代表叙述者认可此判断。译文保留引语中的指控，不替读者解决其与全书理性主题之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以直接称呼开头，符合汉语责问语序；“这样不合理地毁掉自己”保留原话尖锐的指责口吻。
