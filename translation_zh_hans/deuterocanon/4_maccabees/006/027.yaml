base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/027.yaml
  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
translation:
  language: zh_hans
  text: 你知道，神啊，我虽仍有机会获救[a]，正因律法[b]在灼烧的酷刑中死去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逃生”“得解救”或“保全性命”；这里主要指他仍有可能免受酷刑和死亡。
    reason: lexical_alternative
  - marker: b
    text: 或译“为了律法”。这里指他因忠守摩西律法而在迫害中受死。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
  choice: 你知道
  rationale: 保留强调性的第二人称主语和直接祷告语气；现代汉语简洁自然。
- source_word: θεέ
  choice: 神啊
  rationale: 以“啊”表达希腊语呼格，庄重而符合现代汉语祷告用语。
- source_word: παρὸν μοι
  choice: 我本来可以
  rationale: 表达某种求生途径仍向说话者敞开，同时以“却”呈现上下文中的让步关系。
- source_word: σῴζεσθαι
  choice: 获救
  rationale: 这里首先指从酷刑和死亡中得到身体上的解救；“获救”保留原词较宽的语义，不把它限定为后期教义意义上的属灵救恩。
- source_word: βασάνοις καυστικαῖς
  choice: 灼人的酷刑之中
  rationale: βασάνοις 指酷刑，καυστικαῖς 指灼烧、炙烤的性质；此译既明确又自然。
- source_word: ἀποθνῄσκω
  choice: 死在
  rationale: 结合酷刑场景表达正在面对并经历死亡的现实；汉语用“死在……之中”比机械直译进行体更自然。
- source_word: διὰ τὸν νόμον
  choice: 因这律法
  rationale: 保留 διά 加宾格的因果关系；“这律法”在语境中指他所忠守的摩西律法。
theological_decisions:
- issue: σῴζεσθαι 在殉道语境中的含义
  choice: 以身体获救、免于酷刑和死亡为主要含义，译作“获救”
  alternative: 逃生；得解救；保全性命
  rationale: 句中对比的是原本可采取求生之道与实际在酷刑中死亡，不应强行赋予后期教义化的属灵救恩含义；“获救”也保留了希腊词本身的语义张力。
- issue: διὰ τὸν νόμον 的语力
  choice: 译作“因这律法”，保留因果表达
  alternative: 为了律法；因忠于律法
  rationale: 原文直接说“因律法”；殉道源于对律法的忠诚虽是明确语境，却不宜未经标示直接扩写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“神啊”保留呼格；“我本来可以……却……”清楚呈现可逃生与甘愿殉道之间的张力。所有脚注标记均已置于正文相应位置。
