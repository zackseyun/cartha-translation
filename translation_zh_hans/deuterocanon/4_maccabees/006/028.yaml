  text: Be merciful to your nation[b][a], being satisfied with our punishment on their behalf.
translation:
  language: zh_hans
  text: 求你怜悯你的民族[a]，以我们为他们所受的刑罚为足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民族”也可译作“人民”。
    reason: lexical_alternative
  - marker: b
    text: “我们为他们所受的刑罚”也可译作“我们替他们受的惩罚”；这里保留希腊文的代表性意味，但不限定为某一种后世的赎罪理论。
    reason: cultural_note
lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: 求你怜悯
  rationale: 这是带有祈求意味的惯用表达；译为“求你怜悯”自然传达命令式祷告的语气，也避免用过于技术化的措辞。
- source_word: τῷ ἔθνει σου
  choice: 你的民族
  rationale: ἔθνος在这里指作为整体的群体。“民族”保留其共同体和集体意味；也可按语境理解为“你的人民”。
- source_word: ἀρκεσθεὶς
  choice: 以……为足
  rationale: 该被动分词在此表示把某事视为足够；“以……为足”简洁地保留了恳求上帝让他们的受刑足以成事的含义。
- source_word: τῇ ἡμετέρᾳ ... δίκῃ
  choice: 我们……所受的刑罚
  rationale: δίκη可指公正、刑罚或惩处；殉道语境表明这里是说落在说话者身上的刑罚。“所受的刑罚”使现代读者清楚刑罚的承受者是谁。
- source_word: περὶ αὐτῶν
  choice: 为他们
  rationale: περί加属格既可表示“关于”，在代求和代表性语境中也可表示“为了、代表”。“为他们”保留代表性意味，同时不规定一种后世的赎罪理论。
theological_decisions:
- issue: 殉道者受刑在περὶ αὐτῶν中的代表性作用
  choice: 译作“我们为他们所受的刑罚”，表达受刑是为了该民族、对该民族有代表性作用。
  alternative: 译作“我们因他们而受的刑罚”或“与他们有关的刑罚”，仅表达较宽泛的关联。
  rationale: 上下文是为整个民族代求；“为他们”能保留希腊文可能具有的代表性力量，却不进一步断定其运作方式或套入后世完整的赎罪教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你”体现祷告式恳求；“以……为足”略带书面色彩，但清楚、凝练，并与经文的肃穆处境相称。
