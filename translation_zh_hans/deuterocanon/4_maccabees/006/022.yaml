  text: In response to this[a], you, O children of Abraham, die nobly for the sake of godliness.
translation:
  language: zh_hans
  text: 对此，亚伯拉罕的子孙啊，你们要为敬虔[a]慨然赴死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔敬”。希腊语εὐσέβεια指对上帝心存敬畏，并以忠实的行为表现出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: 对此
  rationale: 该短语承接前文，表示对刚才所说之事的回应；“对此”简洁自然，并保留其篇章衔接作用。
- source_word: ὑμεῖς μέν
  choice: 你们
  rationale: ὑμεῖς带有强调，μέν则标示话题或轻微对比。汉语借直接称呼和句中位置即可体现重点，不必生硬增译“你们确实”或“至于你们”。
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: 你们这些亚伯拉罕的子孙
  rationale: παῖδες在这里指亚伯拉罕的后裔；“子孙”既保留家族及盟约关联，也不把所指不必要地限定为亲生儿子。汉语以直接呼语传达ὦ的庄重语气，无须另加古雅叹词。
- source_word: εὐγενῶς
  choice: 慨然
  rationale: 该副词称许其赴死方式高尚、无愧而坚定。“慨然赴死”是自然且庄重的现代汉语搭配，能传达道德上的高贵，不把含义仅缩减为勇敢。
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: 为了敬虔
  rationale: ὑπέρ在殉道语境中表示“为了、因维护……之故”；εὐσέβεια指向对上帝的敬畏与由此表现出的忠诚信仰生活。“敬虔”简明保留其宗教和伦理层面。
- source_word: τελευτᾶτε
  choice: 赴死
  rationale: 该动词是“死亡、走到生命终点”的庄重表达；与“慨然”搭配译作“赴死”，符合此处面对死亡的语境，又不额外加入殉道等解释性术语。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔敬；对上帝的敬畏
  rationale: “敬虔”兼顾对上帝的尊崇和忠实行事的伦理面向，又不把此词处理成后世某一宗派的专门术语。“虔敬”也可成立，但“敬虔”在本句中更凝练；脚注说明其完整语义。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“慨然赴死”略带书面色彩，以对应原文的修辞高度；其余措辞保持简洁自然。
