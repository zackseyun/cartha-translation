lexical_decisions:
- source_word: μέχρι ὀστέων ἤδη κατακεκαυμένος
  choice: 已经被烧得深及骨头
  rationale: μέχρι ὀστέων 表示烧伤已达到骨头；“深及骨头”在现代汉语中自然而庄重，也保留原文所强调的伤势深度。
- source_word: μέλλων λιποθυμεῖν
  choice: 快要昏厥了
  rationale: μέλλων 表示即将发生，λιποθυμεῖν 指失去知觉、昏厥；如此译法简明准确。
- source_word: ἀνέτεινεν τὰ ὄμματα πρὸς τὸν θεόν
  choice: 举目望着上帝
  rationale: ἀνατείνω 在此表示向上抬起，πρὸς τὸν θεόν 表明目光所向；“举目望着上帝”保留动作与对象。
- source_word: καὶ εἶπεν
  choice: 说：
  rationale: 原句引出下文直接引语，中文以冒号自然承接。
