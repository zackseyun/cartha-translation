  text: We will set out some roasted foods[a], but you, by pretending to taste pork, save yourself.
translation:
  language: zh_hans
  text: 我们会把煮熟的食物摆在你面前；你却假装尝一口猪肉，好保全性命吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡψημένων
  choice: 煮好的
  rationale: 该词指经过烹煮、已经做熟；译作“煮好的”比特指“烤好的”更稳妥，也保留具体的烹调含义。
- source_word: βρωμάτων
  choice: 食物
  rationale: βρῶμα泛指可吃的东西，并不必然专指肉；“食物”准确保留其较宽的词义。
- source_word: παραθήσομεν
  choice: 会把……摆在你面前
  rationale: παρατίθημι在用餐语境中指把食物放到某人面前；这一译法自然且保留具体动作。
- source_word: ὑποκρινόμενος
  choice: 装作
  rationale: 分词表示假装或佯作；“装作”清楚表达对方被劝采取的伪装行为。
- source_word: τῶν ὑείων
  choice: 猪肉
  rationale: 该中性复数形容词名词化，指猪所出的食物，即猪肉；“猪肉”是现代汉语中直接自然的表达。
- source_word: ἀπογεύσασθαι
  choice: 尝了
  rationale: 该不定式表示尝一尝或稍作品尝；“尝了”与“装作”结合，准确表达假装已经吃过一点。
- source_word: σώθητι
  choice: 保住性命吧
  rationale: 此处命令式涉及眼前的肉身存活；“保住性命”避免引入本节并不要求的宗教性“得救”含义。
theological_decisions:
- issue: 犹太殉道语境中禁食猪肉的表达
  choice: 猪肉
  alternative: 猪的食物／猪肉之类
  rationale: 本节的道德压力来自禁食猪肉的律法背景；直译为“猪肉”能让现代读者立即明白所指，又不加入额外宗派解释。
- issue: σώθητι所指的拯救
  choice: 保住性命吧
  alternative: 得救吧／救救自己吧
  rationale: 上下文所指是逃过处死、保存肉身性命，而非专门的神学性救恩；所选译法明确呈现这一语境。
- issue: 假装食用与实际食用之间的张力
  choice: 装作尝了猪肉
  alternative: 假装要尝猪肉
  rationale: 希腊文将“假装”与尝食的不定式相连，劝他佯装自己尝过；译文不替叙事判断这种伪装在道德上是否可接受，保留原文张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“你只要……就……”呈现劝诱者所提出的手段与结果；句末“吧”保留命令中带劝说的语气。未沿用英文咨询层的“烤好的”，因为希腊词本身更广泛地指烹煮做熟。
