lexical_decisions:
- source_word: οἱ δὲ
  choice: 但你们这些
  rationale: δὲ表示转折；结合随后直接质问的语气，将形式上的第三人称自然处理为对卫士的直接称呼。
- source_word: τοῦ τυράννου
  choice: 暴君的
  rationale: 以领属结构自然对应希腊语属格，并保留τύραννος所含的负面政治与道德色彩。
- source_word: δορυφόροι
  choice: 持矛卫士
  rationale: 该词本义为“持矛者”，语境中指暴君的武装侍卫；正文兼顾字面形象与实际职能。
- source_word: τί μέλλετε;
  choice: 还在等什么？
  rationale: μέλλω在此独立用于责问，表达迟延或踌躇，而非单纯指将来的行动；这一译法自然传达催促和挑战的口吻。
