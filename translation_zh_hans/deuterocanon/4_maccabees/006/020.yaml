  yaml_path: translation/deuterocanon/4_maccabees/006/020.yaml
  text: For it would be shameful if we should live on for a little while, and that while being mocked by everyone for cowardice.
translation:
  language: zh_hans
  text: 因为，若我们只再活一小段时间，却在那段时间里因怯懦而一直受众人耻笑，这就太可耻了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρὸν
  choice: 可耻
  rationale: 表达道德与名誉上的羞耻，现代汉语自然有力，也符合殉道语境中的荣辱关切。
- source_word: ἐπιβιώσομεν
  choice: 苟活
  rationale: 原词指在当前威胁之后继续活下去；语境将这种求生与怯懦、受人耻笑相联，因此“苟活”凝练地传达带有贬义的存活，但不额外说明具体手段。
- source_word: ὀλίγον χρόνον
  choice: 片刻
  rationale: 表达延续时间短暂，简洁保留原文对短暂性的强调。
- source_word: καταγελώμενοι
  choice: 被……耻笑
  rationale: 保留现在被动分词所呈现的持续、公开嘲笑，也与本句的荣辱语义相呼应。
- source_word: πρὸς ἀπάντων
  choice: 被众人
  rationale: 自然表达施事者的普遍范围，不将“所有人”限制为某一特定群体。
- source_word: ἐπὶ δειλίᾳ
  choice: 因怯懦
  rationale: 清楚表达耻笑的原因；“怯懦”保留 δειλία 的负面道德意味，同时较“胆小”庄重。
- source_word: καὶ τοῦτον
  choice: 却在这期间
  rationale: τοῦτον 回指前述短暂的存活时间；译文明确其时间关系，并以“却”自然呈现继续活着与受辱之间的张力。
