  yaml_path: translation/deuterocanon/4_maccabees/006/018.yaml
  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: zh_hans
  text: 因为，若我们一生直到年老都按真理而活，并且按律法守护建立在这些事上的美名，如今却改变立场，实在是不合理的；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  choice: 不合理的
  rationale: 保留“违背理性、不可理喻”的核心含义，同时采用自然的现代汉语表达。
- source_word: πρὸς ἀλήθειαν
  choice: 按真理
  rationale: πρός在此表示与真理相合或以真理为准；“按真理”既简洁，也不把含义过度限定为抽象的“诚实”。
- source_word: τὸν μέχρι γήρως βίον
  choice: 活到年老
  rationale: 表达一生历程延续至老年；汉语无需机械重复“整个人生”，语义仍然完整。
- source_word: νομίμως
  choice: 遵照律法
  rationale: 在本书犹太殉道语境中，该词不仅泛指“合法地”，也带有依律法而行之意；译文保留这一关联。
- source_word: τὴν ἐπ’ αὐτῶν δόξαν
  choice: 由此而有的声誉
  rationale: ἐπ’ αὐτῶν的所指在语法上可关联前述按真理生活及守法的行为；用“由此”保留概括性，不强行限定为单一先行项。
- source_word: μεταβαλοίμεθα
  choice: 改变立场
  rationale: 该词表示转变、改弦更张；此处指在信念与行为上改变态度，“改变立场”符合上下文。
theological_decisions:
- issue: νομίμως是否明确译作与摩西律法有关
  choice: 遵照律法
  alternative: 合乎规矩地／合法地
  rationale: 《马加比四书》的论述背景强调忠于律法；但译文不添加“摩西”二字，以免超出本句明说的范围。
- issue: ἐπ’ αὐτῶν的指代范围
  choice: 用“由此”概括前述生活方式
  alternative: 基于真理的／因守法而有的
  rationale: 希腊语复数代词可能笼统回指前述事项；概括翻译可保留其一定的指代开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本句在原文中承接后文，故以分号收束，保留未完的论证语势。
