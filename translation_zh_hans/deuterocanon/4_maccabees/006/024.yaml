  yaml_path: translation/deuterocanon/4_maccabees/006/024.yaml
  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: zh_hans
  text: 他们见他在这些逼迫之下，仍如此心志高尚[a]，甚至也没有转而怜悯他们，就把他带到火前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心志高尚”译自一个表示高贵、宽宏心志的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: 面对这些强迫
  rationale: πρός在这里表示他对所受外在压力的应对；ἀνάγκαι结合殉道语境，指施加在他身上的强制压力，而非一般的“需要”或“必然”。
- source_word: οὕτως μεγαλοφρονοῦντα
  choice: 仍如此意志高昂
  rationale: μεγαλοφρονέω表示心志崇高、气度恢宏；“意志高昂”在现代汉语中自然地传达其精神上的高贵与坚定，同时不把含义缩减为单纯的勇敢。
- source_word: μηδὲ πρὸς τὸν οἰκτιρμὸν αὐτῶν μεταβαλλόμενον
  choice: 又不因他们的怜悯而改变
  rationale: 按上下文，将αὐτῶν理解为主观属格，即他们向他表现的怜悯；πρὸς与μεταβαλλόμενον合起来表示这种怜悯也未使他的态度改变。脚注保留另一种语法可能。
- source_word: ἐπὶ τὸ πῦρ
  choice: 到火堆那里
  rationale: ἐπί加宾格表示朝向火所在之处；译文保留移动至火边的含义，不额外断定他此刻已被投入火中。
- source_word: ἦγον
  choice: 把他带到
  rationale: ἄγω表示带领或押送；这里的使役式汉语表达符合受刑者被押往刑具之处的语境。
theological_decisions:
- issue: “αὐτῶν”与“怜悯”的关系
  choice: 他们对他的怜悯
  alternative: 他转而怜悯他们
  rationale: 前文语境涉及旁人对他的同情，而“他们的怜悯”也是该属格最直接的理解；不过希腊语结构容许把αὐτῶν理解为怜悯的对象，因此以脚注保留此歧义，不赋予额外的神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“意志高昂”保留μεγαλοφρονεῖν所含的高贵心志；“火堆那里”避免把ἐπὶ过度明确为已经进入火中。所有脚注标记均已置于正文相应位置。
