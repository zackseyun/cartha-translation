  terminology: “逼迫”在此指外在施加的强制压力，并非普通的需要；“心志高尚”恰当地表达μεγαλοφρονοῦντα。删除原脚注b，因为它所保留的替代解释不应与本句最合语法和语境的指向并列为同等可能。
