  source_fidelity: 原文的“πρὸς τὸν οἰκτιρμὸν αὐτῶν μεταβαλλόμενον”最自然的意思是“转而怜悯他们”；草稿将αὐτῶν处理为“他们所表现的怜悯”，使施事与怜悯对象倒置。ἐπὶ τὸ πῦρ只说带往火处，不宜具体化为“火堆”。
