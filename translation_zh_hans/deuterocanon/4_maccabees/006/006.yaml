base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/006.yaml
  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: zh_hans
  text: 可是——不，不，不！老者高高地举目望向天上，把自己的皮肉暴露在鞭打之下[a]；他浑身鲜血直流[b]，身体两侧不断被刺伤[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让自己的皮肉在鞭打中显露出来。”希腊语动词可侧重皮肉因鞭打而变得显而可见。
    reason: lexical_alternative
  - marker: b
    text: 或译：“鲜血从他身上不断淌下。”原文着重描写血持续流淌或浸染全身的状态。
    reason: lexical_alternative
  - marker: c
    text: “身体两侧”也可译作“肋部”；希腊语可泛指侧身，也可较具体地指肋部。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: 可是——不，不，不！
  rationale: 三个重复的 ἀλλά 构成突兀而强烈的转折或否定。译文保留“可是”的转折作用，并以三次“不”自然传达反复强调的语势。
- source_word: ὑψηλοὺς ἀντείνας ... τοὺς ὀφθαλμούς
  choice: 高高举目
  rationale: ἀντείνας 表示向上伸展；与“眼睛”连用时，现代汉语“举目”既自然又保留鲜明的身体动作，ὑψηλούς 的高度意味由“高高”表达。
- source_word: εἰς τὸν οὐρανόν
  choice: 望天
  rationale: 介词短语表示目光朝向天上。“望天”简洁自然；上下文具有宗教意味，但不额外说明他所祈求或注视的对象。
- source_word: ἀπέφαινετο
  choice: 暴露
  rationale: 该动词在此描写皮肉在受鞭打时显露出来；“暴露”保留使之显明、任其呈露的意味，同时不把动作过度解释为主动献身。
- source_word: ταῖς μάστιξιν
  choice: 在鞭打之下
  rationale: 与其生硬直译为“向鞭子”，这里按工具或伴随受刑情境处理，译为“在鞭打之下”，清楚表达持续受刑。
- source_word: τὰς σάρκας
  choice: 自己的皮肉
  rationale: 此处 σάρξ 明确指受刑的身体组织。“皮肉”是现代汉语中自然、具体的字面表达，比“肉体”更适合鞭打场景，也不引入神学性的抽象含义。
- source_word: ὁ γέρων
  choice: 老者
  rationale: 该词强调年迈；“老者”比“老人”略显庄重，适合殉道叙事，同时仍为普通读者所熟悉。
- source_word: κατερρεῖτο τῷ αἵματι
  choice: 浑身鲜血直流
  rationale: 未完成时态描写鲜血持续流淌的状态。“浑身鲜血直流”兼顾血不断流下及身体被血浸染的画面，而不硬性限定为单一伤口出血。
- source_word: τὰ πλευρά
  choice: 两肋
  rationale: πλευρά 可指身体两侧，也可较具体地指肋部。“两肋”在此受刑场景中自然，并保留部位上的一定宽泛性。
- source_word: κατετιτρώσκετο
  choice: 不断被刺伤
  rationale: 未完成被动形式表示持续或反复遭受创伤。“不断被刺伤”保留被动和进行性，也不把伤势过度具体化为完全刺穿。
theological_decisions:
- issue: σάρκας 应按字面身体意义还是神学隐喻理解
  choice: 按字面译为“皮肉”
  alternative: 译为“肉体”或“身体”
  rationale: 上下文直接描写鞭打、流血和肋部受伤，因此这里是具体的身体用语，不应赋予罪性、属世本性等神学含义。
- issue: 举目向天是否明说为向上帝祷告
  choice: 仅译作“高高举目望天”
  alternative: 译作“仰望上帝”或“向天祷告”
  rationale: 动作具有明显宗教语境，但本节本身只陈述目光朝天，并未明说祷告或目光的具体对象；译文保留这种张力，不作教义性补足。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。开头以破折号和三次“不”再现原文三重 ἀλλά 的突兀强调；正文使用分号串联同时持续发生的受刑画面。避免古奥词汇和额外神学解释，同时保留未完成时态所表达的持续、反复动作。
