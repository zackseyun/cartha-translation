base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/032.yaml
  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: zh_hans
  text: 因为，情欲若曾胜过理性，我就会证明它们占了上风。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就会把它们占优势的见证归给它们。”“占优势”也可译作“得胜”或“掌权”。
    reason: 原文 τὴν τῆς ἐπικρατίας μαρτυρίαν 的名词结构凝练，可指对情欲取得优势所作的见证；原文没有明确说“我的自制”。
lexical_decisions:
- source_word: πάθη
  choice: 情欲
  rationale: 此处指与理性相抗衡的情感冲动或欲望，并非外在的“苦难”；“情欲”保留了伦理哲学语境中的概括性。
- source_word: λογισμοῦ
  choice: 理性
  rationale: 这里指作出理性判断的能力，与“情欲”构成全书核心对照；“理性”简洁而自然。
- source_word: κεκράτηκει
  choice: 胜过了
  rationale: κρατέω 表示制胜、压倒或取得支配地位；“胜过了”既体现完成状态，也与后面的“占了上风”呼应。
- source_word: ἀπεδόμην
  choice: 我就会……作证
  rationale: ἀποδίδωμι 在这里有交付、归给之意；结合宾语 μαρτυρίαν，译作“为……作证”符合汉语表达，并保留反事实条件的语气。
- source_word: ἐπικρατίας
  choice: 占了上风
  rationale: ἐπικράτεια 表示占优势、获胜或支配。此处最自然的所指是：若情欲胜过理性，讲者便会承认情欲取得优势；避免擅自增添“我的自制”这一原文未明说的所属关系。
- source_word: μαρτυρίαν
  choice: 作证
  rationale: μαρτυρία 可指见证、证言或证明；动词化为“作证”保留司法色彩，同时使现代汉语流畅。
theological_decisions:
- issue: 理性与情欲的伦理哲学对照
  choice: 保留“情欲”与“理性”的直接对立
  alternative: 译作“我的欲望若压倒了更明智的判断”
  rationale: 较动态的译法会把原文的哲学术语个人化，并削弱其概括性；本译不引入“罪性”等后期教义范畴。
- issue: τῆς ἐπικρατίας 所表达的优势归属
  choice: 理解为情欲若获胜，讲者便为它们占优势作证
  alternative: 理解为讲者把自己“自制的见证”给予情欲
  rationale: 与格 τούτοις 最自然地回指 πάθη，而“占上风”也承接前半句“胜过理性”的反事实设定。希腊语名词结构较凝练，因此以脚注保留较贴近字面的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“因为”承接上文论证；反事实条件以“若……就会……”表达。主文避免生硬的名词堆叠，脚注则保留希腊语较字面的结构与词义幅度。
