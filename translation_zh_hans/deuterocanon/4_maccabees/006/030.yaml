  yaml_path: translation/deuterocanon/4_maccabees/006/030.yaml
  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: zh_hans
  text: 说完这些话[a]，这位圣洁的男子便高尚地迎向酷刑；他为了律法，凭着理性抵抗，直到致死的酷刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎向酷刑”所译的希腊语动词十分罕见，确切含义不易确定；它也可能表示他直面或对抗酷刑，甚至迎面对死亡。
    reason: 保留罕见动词ἐναντεθάνει的词义不确定性，以及其可能涉及直面死亡的含义。
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: 说完这些话
  rationale: 自然表达分词所表示的先行动作，并保持叙事次序。
- source_word: ὁ ἱερὸς ἀνὴρ
  choice: 这位圣洁的人
  rationale: ἱερός在此描述此人的圣洁品格；“人”也保留ἀνήρ所指的男性个体，而不附加祭司等身份。
- source_word: εὐγενῶς
  choice: 英勇地
  rationale: 在殉道语境中自然传达高尚、勇毅的举止；比直译“高贵地”更符合现代汉语。
- source_word: ταῖς βασάνοις
  choice: 酷刑
  rationale: βάσανοι在此指实际施加的折磨或酷刑。
- source_word: ἐναντεθάνει
  choice: 迎向
  rationale: 该罕见动词可能兼有直面、对抗并赴死之意；“迎向”保留主动面对苦难的意味，又不把词义限定为已经死亡。
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: 直到遭受致死的酷刑
  rationale: 表达忍耐和抗争所达到的极限；“致死的酷刑”自然传达θανάτου的死亡指向。
- source_word: ἀντέστη
  choice: 坚持抗争
  rationale: 兼顾“站立抵挡”和坚忍不屈的语义。
- source_word: τῷ λογισμῷ
  choice: 凭理性
  rationale: λογισμός是本书的重要概念，指理性判断或理性力量；“凭理性”保持工具性与哲学意味。
- source_word: διὰ τὸν νόμον
  choice: 为了律法
  rationale: 既可表达动机，也可表达忠于、维护律法的目的；避免把νόμος泛化为一般法律。
theological_decisions:
- issue: 哲学语境中λογισμός的译法
  choice: 理性
  alternative: 理智判断；理性意志
  rationale: 本书强调理性对情欲的统御。“理性”简明保留其核心概念，同时不引入后世特定哲学体系。
- issue: διὰ τὸν νόμον所表达的关系
  choice: 为了律法
  alternative: 因为律法；由于律法
  rationale: 介词短语可表原因或缘故；“为了律法”在上下文中突出他忠于律法而抗争，但不具体化为某一宗派的律法观。
- issue: 罕见动词ἐναντεθάνει的解释
  choice: 迎向酷刑
  alternative: 直面酷刑而死；投身于酷刑
  rationale: 词形和语境暗示迎面面对死亡或苦难，但确切语义不稳；正文采用较开放的表达，并以脚注保存另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“圣洁的人”“律法”“理性”保留本书的宗教与哲学语域；分号呈现原句由赴刑转入坚持抗争的推进关系。
