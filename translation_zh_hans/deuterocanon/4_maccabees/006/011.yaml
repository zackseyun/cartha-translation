lexical_decisions:
- source_word: ἱδρῶν γέ τοι τὸ πρόσωπον
  choice: 他的脸确实冒着汗
  rationale: 以自然汉语表达脸部持续出汗的状态，并用“确实”保留 γέ τοι 的强调语气。
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: 喘得很厉害
  rationale: ἐπασθμαίνω 指呼吸急促、吃力，σφοδρῶς 加强程度；“喘得很厉害”准确且符合现代汉语习惯。
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: 就连那些正在折磨他的人
  rationale: “就连”与“那些……的人”共同传达 αὐτῶν τῶν 的强调意味，突出施刑者本人也受到震动。
- source_word: ἐθαυμάζετο
  choice: 惊叹
  rationale: 被动式表示他成为众人惊异、赞叹的对象；汉语以主动结构“那些人……惊叹”表达更自然。
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: 因他的勇气
  rationale: εὐψυχία 在受苦情境中指坚毅、勇敢；“勇气”简明忠实，不额外加入特定神学含义。
