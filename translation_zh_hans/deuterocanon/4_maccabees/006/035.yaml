  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: zh_hans
  text: 即使这很可笑，我仍表明：理性不仅已经胜过痛苦，也制伏享乐，并不向享乐屈服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: 即使这显得可笑
  rationale: 原文是省略式让步短语；“显得可笑”保留“可笑、荒唐”的语义，也避免断言说话者本人认定此事荒谬。
- source_word: ἀλγηδόνων
  choice: 痛苦
  rationale: 该词直接指疼痛或痛苦；虽处于受刑语境，仍不擅自强化为“酷刑”或“折磨”。
- source_word: ἐπιδείκνυμι
  choice: 我要表明
  rationale: 该动词有展示、证实之意；“表明”符合此处以行动证明论点的修辞语境。“要”使汉语承接让步结构更自然，并未改变动词时态。
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: 理性已经胜过
  rationale: κρατέω的完成时不定式强调已经实现并持续有效的胜势；“已经胜过”兼顾完成体意义和支配、制胜的语义。
- source_word: τὸν λογισμόν
  choice: 理性
  rationale: λογισμός是本书核心概念，指能够判断并约束情欲的理性；“理性”简明自然，也保留其哲学色彩。
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: 能制伏享乐
  rationale: κρατέω表示掌控、制胜；“制伏”传达理性对享乐的支配，而“能”对应不定式所述能力，不把享乐本身解释为罪恶。
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: 绝不向它们屈服
  rationale: ὑπείκω意为退让、屈服；“绝不”自然体现μηδέ的否定递进语气，“它们”明确回指复数的“享乐”。
theological_decisions:
- issue: 在殉道与情欲论述中如何译λογισμός
  choice: 理性
  alternative: 理性判断；理智
  rationale: “理性”保留本书关于理性驾驭情感与欲望的核心命题，同时不引入后世特定哲学体系或宗派解释。
- issue: 是否按受刑语境强化ἀλγηδόνων
  choice: 痛苦
  alternative: 苦难；折磨
  rationale: 上下文虽涉及严酷受难，但该词本身泛指疼痛与痛苦；采用较直接的词义，避免把语境中的强度增添到词汇本身。
- issue: 如何表达理性对ἡδοναί的关系
  choice: 制伏享乐，却不把享乐本身定性为罪恶
  alternative: 控制欲望；战胜诱惑
  rationale: 原文强调理性不被享乐支配，并未在本句中把所有享乐等同于罪或诱惑；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“即使这显得可笑”保留原文省略感；冒号清楚引出“表明”的内容。前半用“已经胜过”体现完成状态，后半用“能制伏……绝不……屈服”呈现持续掌控，避免机械重复。
