  yaml_path: translation/deuterocanon/4_maccabees/002/017.yaml
  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: zh_hans
  text: 摩西虽然向大坦和亚比伦[a]发怒，却没有出于怒气对他们采取任何行动，反而以理性克制了怒气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“亚比伦”；传统常译“亚比兰”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“凭理性判断驾驭了自己的怒气。”希腊文强调理性对激情的治理，这是《马加比四书》的中心主题之一。
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος
  choice: 发怒
  rationale: 保留摩西确实有怒气这一点；结合κατά所指的对象，译为“向……发怒”自然明确。
- source_word: γέ τοι
  choice: 虽然
  rationale: 此处粒子组合在上下文中带有强调兼让步意味，引出“有怒气”与“不凭怒气行事”的对比。
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: 向大坦和亚比伦
  rationale: κατά在此表示敌对情绪所指向的对象；人名依希腊文本音译。
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: 却没有因怒气而对他们做什么
  rationale: 将θυμῷ理解为原因或方式，表达摩西并未受怒气驱使而采取针对他们的行动。
- source_word: λογισμῷ
  choice: 以理性
  rationale: λογισμός是本书的重要哲学用语，指能够治理情欲的理性判断；“以理性”兼顾术语一致性与现代可读性。
- source_word: τὸν θυμὸν διήτησεν
  choice: 克制了怒气
  rationale: διαιτάω在这里表示调控、治理；“克制”清楚传达理性对怒气的约束，同时不暗示怒气从未存在。
theological_decisions:
- issue: 如何表达λογισμός对激情的治理
  choice: 以理性克制了怒气
  alternative: 凭理性判断驾驭了自己的怒气
  rationale: 正文保留本书“理性治理激情”的核心张力，又避免过度技术化；脚注列出更突出“治理”意象的译法。
- issue: Ἀβειρών的人名形式
  choice: 亚比伦
  alternative: 亚比兰
  rationale: 正文优先按希腊形式Ἀβειρών音译，不直接归一为较熟悉的希伯来传统形式；脚注说明传统译名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发怒—因怒气—克制怒气”的重复有意保留原文θυμός词群的修辞联系；“理性”则保留本书哲学论述的关键词。
