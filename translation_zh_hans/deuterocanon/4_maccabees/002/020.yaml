  text: For if reason were not able to master the passions, he would not have spoken in this way.
translation:
  language: zh_hans
  text: 因为，理性若不能制伏各种激情，他就不会这样说了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: 因为……若不能
  rationale: 保留γάρ的解释作用和εἰ μή所引出的反事实条件，同时符合现代汉语表达习惯。
- source_word: ἐδύνατο
  choice: 能
  rationale: 此处表示能力；与后句“就不会”配合，清楚呈现反事实关系。
- source_word: τῶν θυμῶν
  choice: 各种激情
  rationale: θυμός虽可特指愤怒，也可指强烈的情感冲动；在本书理性驾驭情欲的哲学论述中，译作“各种激情”比仅译“怒气”范围更合适。复数用“各种”自然体现。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: λογισμός在《马加比四书》中是核心哲学术语，指作出判断并治理情感冲动的理性能力；“理性”简洁、自然且保留其概念分量。
- source_word: κρατεῖν
  choice: 制伏
  rationale: κρατέω表示占据优势、掌控或支配；“制伏”体现理性对激情的强力约束，又不额外引入特定教义。
- source_word: οὐκ ἂν εἶπεν
  choice: 就不会……说了
  rationale: ἄν与不定过去时构成反事实结果；这一汉语结构准确表达“若非如此，便不会说”的意思。
- source_word: οὕτως
  choice: 这样
  rationale: 回指上文所说的话或说话方式；“这样说”是现代汉语中自然清楚的表达。
theological_decisions:
- issue: λογισμός是哲学意义上的理性，还是泛指心智能力
  choice: 理性
  alternative: 理智、思考能力
  rationale: 本节延续全书关于理性能够治理激情的论证。“理性”保留其哲学—人论含义，同时避免采用过度专业化的术语。
- issue: θυμοί的语义范围
  choice: 各种激情
  alternative: 怒气、冲动
  rationale: 该词常与愤怒有关，但复数形式在此哲学语境中可泛指强烈的情感驱力。译文保留这一较宽范围，不把论点缩窄为仅仅控制愤怒。
- issue: 未明说的主语
  choice: 他
  alternative: 那人、具体点明上文人物
  rationale: 希腊文动词仅以第三人称单数指向上文人物。译作“他”保留原文的回指关系，不擅自补出姓名或身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式简洁，保留原文的解释性连接、反事实条件及理性与激情之间的张力。
