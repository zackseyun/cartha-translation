base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: zh_hans
  text: 既然如此，我们极有智慧的先祖雅各为什么责备西缅和利未及其同伙——他们不凭理性地屠杀了示剑人全族[a]——并说[b]：“他们的怒气该受咒诅”呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无理地屠杀了示剑人全族”。希腊文“不凭理性”句法压缩；也可理解为雅各的责备并非无理。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《创世记》49:7。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: 既然如此，为什么
  rationale: 既保留与上文相承的推论意味，也自然引出反问。
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακὼβ
  choice: 我们那位极有智慧的先祖雅各
  rationale: πάνσοφος采用庄重但不过度绝对化的“极有智慧”；πατήρ在族长语境中译作“先祖”更符合现代汉语。
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: 西缅、利未一伙
  rationale: οἱ περὶ可指两人及其随从或所属群体；“一伙”简洁表达群体关系，但不精确限定成员。
- source_word: αἰτιᾶται
  choice: 责备
  rationale: 表达雅各的谴责与归咎，语气符合上下文。
- source_word: μὴ λογισμῷ
  choice: 没有依从理性
  rationale: 将否定语自然连接到屠杀行为，保留该行为不受理性支配的语境含义，避免产生“雅各无理责备他们”的误读。
- source_word: τοὺς Σικιμίτας
  choice: 示剑人
  rationale: 指创世记叙事中示剑城的居民，是现代中文简明自然的族群称法。
- source_word: ἐθνηδόν
  choice: 当作一个民族集体
  rationale: 兼顾“按整个族群看待”和“集体、全体”两层意味，不仅笼统译作“大批”。
- source_word: ἀποσφάξαντας
  choice: 屠杀
  rationale: 保留复合动词所表达的强烈、暴力意味。
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: 他们的怒气该受咒诅
  rationale: 保留ἐπικατάρατος的咒诅语气，并以自然庄重的现代汉语表达。
theological_decisions:
- issue: μὴ λογισμῷ与雅各责备行为之间的句法及神学关系
  choice: 将其理解为西缅、利未一伙的屠杀并非依从理性，雅各因此责备他们。
  alternative: 将其与αἰτιᾶται结合，理解为雅各并非无理地责备他们。
  rationale: 希腊语句法压缩，形式上存在歧义；但本书上下文以理性约束激情为核心，且μὴ λογισμῷ紧邻屠杀分词短语，因此正文采用“没有依从理性”修饰屠杀行为。该选择与“雅各的责备有理”在语境效果上相通，却不把后者直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。反问句保留论证语气；“先祖”“理性”“受咒诅”等词体现作品的犹太传统与哲理性文风。
