  terminology: “先祖雅各”“示剑人”“怒气”“咒诅”均可保留。“极有智慧”足以表达 πάνσοφος 的褒扬性强调；“及其同伙”表达 τοὺς περὶ 的群体范围，而不把成员限定为两人本人或贬称为“一伙”。
