revisions:
- from: 既然如此，为什么我们那位极有智慧的先祖雅各，要责备西缅、利未一伙，说他们没有依从理性，竟把示剑人当作一个民族集体屠杀了，并说[a]：“他们的怒气该受咒诅”呢？
  to: 既然如此，我们极有智慧的先祖雅各为什么责备西缅和利未及其同伙——他们不凭理性地屠杀了示剑人全族[a]——并说[b]：“他们的怒气该受咒诅”呢？
  rationale: 修订去除“一伙”的贬义，改善对 ἐθνηδόν 的现代汉语表达，并以破折号使“不凭理性地屠杀”的修饰对象清楚。由于 μὴ λογισμῷ 的确存在句法与语境上的争议，正文采取与本书理性—激情论证相合、且最贴近分词短语的理解，同时以脚注保留“雅各的责备并非无理”的替代理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:04:39Z'
