base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: zh_hans
  text: 因为，一个素来只吃某一种食物[a]、又贪食又嗜酒的人，若非理性显然是各种情欲的主宰，他又怎能重新受教而改变呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “只吃某一种食物”所译的希腊词很罕见，也可能指“挑食”或“嗜食佳肴的人”。
    reason: 原词 μονοφάγος 的确切含义存在词汇歧义，正文无法同时呈现各可能解释。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 因为
  rationale: 引出支持上文论证的解释性反问，保留原文的因果衔接。
- source_word: τίνα τρόπον
  choice: 怎能
  rationale: 按汉语反问句自然表达“以什么方式、怎么”。
- source_word: μονοφάγος
  choice: 只吃某一种食物[a]
  rationale: 该词罕见，字面构词指向“只吃一种/单一地吃”，但具体所指有争议；正文采用较贴近形式的译法，并以脚注保留“挑食、专吃佳肴”等可能。
- source_word: τὸ ἦθος
  choice: 习性上
  rationale: 表示已经形成的性情或惯常生活方式，而非一时行为。
- source_word: γαστρίμαργος
  choice: 贪食
  rationale: 准确表达对食物欲望过度的品性，且与后面的“嗜酒”结构协调。
- source_word: μέθυσος
  choice: 嗜酒
  rationale: 指惯常沉溺于酒的人，并非仅指当时醉酒。
- source_word: μεταπαιδεύεται
  choice: 重新受教而改变
  rationale: 兼顾该动词“再次教育、重新训练”及由此发生改变的含义。
- source_word: δῆλον
  choice: 显然
  rationale: 直接传达“清楚、显明”的判断意味。
- source_word: κύριός
  choice: 主宰
  rationale: 此处表示支配和控制，并非神圣称号；“主宰”能自然表达理性对情欲的统辖。
- source_word: παθῶν
  choice: 各种情欲
  rationale: 在本书哲学伦理语境中指驱使人的欲望和激情；加“各种”体现复数，同时避免泛指所有普通情绪。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 本书核心哲学术语，指具有判断和治理作用的理性能力。
theological_decisions:
- issue: 非神圣语境中 κύριος 的译法
  choice: 主宰
  alternative: 主、统治者
  rationale: 句中谈论理性对情欲的控制权，并非以 κύριος 作为上帝或尊称的称号。
- issue: τις 的泛指表达
  choice: 一个……的人
  alternative: 一个男人
  rationale: 希腊文的 τις 在此是不定代词，阳性形式受语法结构支配；汉语“一个……的人”自然保留泛指例证，不额外限定性别。
- issue: 理性与情欲的关系
  choice: 理性显然是各种情欲的主宰
  alternative: 理性能够控制各种情欲
  rationale: 保留原文 κύριος 的强烈统辖隐喻，而不将其弱化为仅有控制能力，也不扩展为情欲已被完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。反问句调整为符合汉语习惯的“若不是由于……又怎能……”，同时保留原文以受教改变来证明理性统辖情欲的论证关系。
