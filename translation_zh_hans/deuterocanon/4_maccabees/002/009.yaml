base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: zh_hans
  text: 即使有人吝啬，律法也借着理性约束他，使他既不收取未收割的庄稼，也不再到葡萄园搜集余下的葡萄[a]。从其他事上也可以看出这一点：理性掌管情欲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文前一短语指收取未收割的作物；后一罕见动词指在初次采摘后再搜集葡萄园中余下的葡萄。这些措辞呼应律法关于收获时为他人留下余物的规定。
    reason: 说明两个农业用语及其律法背景；标记置于并列短语末尾，涵盖前后两项动作。
lexical_decisions:
- source_word: φειδωλός
  choice: 吝啬
  rationale: 该词在这里指舍不得放弃收益、倾向于把出产尽数据为己有的人；“吝啬”保留负面的伦理意味，又不像“贪婪”那样过度强化。
- source_word: κρατεῖται
  choice: 受……约束
  rationale: 被动形式表示受到控制或辖制；“受律法约束”符合律法与伦理的语境，也适合现代汉语。
- source_word: διὰ τὸν λογισμόν
  choice: 借着理性
  rationale: λογισμός是本书的核心用语，指能够判断并支配冲动的理性；“借着理性”既保留其哲学含义，也不显得过分术语化。
- source_word: ἐπικαρπούμενος τοὺς ἀμήτους
  choice: 把田里的庄稼收尽
  rationale: 结合紧接着的葡萄园例子及五经关于收割不可收尽的律例，这里所指不是普通收割，而是把收成尽取、不留下余穗；译文将原文农业表达的语境含义明说出来。
- source_word: ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: 把葡萄园里剩下的葡萄摘尽
  rationale: 罕见动词由“葡萄粒”相关词根构成，指在初次采摘后再搜集余下的葡萄；此译清楚表达再次搜摘、不留余果的动作。
- source_word: ἐπὶ τῶν ἑτέρων
  choice: 从其他事上
  rationale: 表示这一例证也可推广到其他事项；译法简洁自然。
- source_word: ἐπιγνῶναι
  choice: 可以看出
  rationale: 此处指从实例辨认、确认一个原则；“可以看出”符合汉语论证语气。
- source_word: παθῶν
  choice: 情欲
  rationale: 在本书的伦理哲学语境中，πάθη指需要理性治理的欲望、感受和冲动，而非中性的“情感”；“情欲”保留其道德张力，但不将其缩窄为单一欲望。
- source_word: ὁ λογισμὸς κρατῶν
  choice: 理性掌管
  rationale: κρατῶν强调占优势并施行支配；“掌管”保留理性对情欲的统御意味，同时与前面的“受……约束”呼应。
theological_decisions:
- issue: λογισμός在《马加比四书》中的哲学—人论含义
  choice: 理性
  alternative: 理性判断；理智
  rationale: 本书论证敬虔的理性能够治理情欲。“理性”能贯穿这一主题，又不额外引入后世哲学体系的专门界定。
- issue: πάθη的伦理含义
  choice: 情欲
  alternative: 激情；情感；欲望
  rationale: 原文并非泛指所有中性情感，而是指需要受治理的内在冲动。“情欲”在现代汉语中能表达这种伦理张力；同时不在正文中擅自把它限定为某一种具体欲望。
- issue: 律法、理性与行为约束之间的关系
  choice: 借着理性受律法约束
  alternative: 因理性而受律法辖制；由律法借理性控制
  rationale: 保留原文“律法—借着理性—约束人”的表达关系，不进一步断定理性与律法在神学上的精确机制。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。正文以冒号呈现律法约束的具体表现，并保留结句的哲学论断。避免照搬英语稿中误置于“吝啬”之后的脚注标记，改将[a]置于两项农业行为之后。
