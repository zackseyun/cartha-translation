  text: And at that time he also enthroned the holy ruling mind over all things through the senses;[a]
translation:
  language: zh_hans
  text: 那时，他又借着感官，将神圣、掌权的心智[a]安置在统管万有的宝座上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣、掌权的理性”。希腊语νοῦς可指人的理性判断和治理能力，并不只是现代意义上狭义的智力。
    reason: 说明核心人论术语的可行译法及其语义范围。
lexical_decisions:
- source_word: τηνικαῦτα
  choice: 那时
  rationale: 这是表示论述时序的副词；“那时”简洁自然，也保留了原文的时间指向。
- source_word: περὶ πάντων
  choice: 统管一切
  rationale: 结合“使……登上王位”的统治意象，此处较可能表达心智对一切的管辖，而不只是“关乎一切”；将其译为“统管一切”可在中文中清楚呈现这一关系。
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  choice: 神圣而居统治地位的心智
  rationale: νοῦς在本书中指具有道德判断与理性治理作用的心智能力；“心智”比单纯的“思想”更准确，也比“理性”稍能保留其人格化意象。ἡγεμόνα表达领导、治理地位，ἱερόν保留为“神圣”。
- source_word: διὰ τῶν αἰσθητηρίων
  choice: 借着各种感官
  rationale: αἰσθητήρια可指感知器官或感知能力；“各种感官”是自然易懂的概括，“借着”则保留διά的工具性。
- source_word: ἐνεθρόνισεν
  choice: 使……登上王位
  rationale: 原动词带有鲜明的登基、安置于宝座之上的形象；此译保留王权隐喻，同时符合现代汉语表达。
theological_decisions:
- issue: 《马加比四书》中νοῦς所指的道德—理性治理能力
  choice: 心智
  alternative: 理性
  rationale: “心智”可涵盖认知、判断和意志治理，不把该词缩窄为抽象推理；脚注同时说明“理性”这一可行译法，以保留原词的哲学张力。
- issue: περὶ πάντων与登基意象的关系
  choice: 译作“统管一切”
  alternative: 译作“关乎一切”或“在一切事上”
  rationale: ἐνεθρόνισεν及ἡγεμόνα共同形成统治语境，因此采用管辖义；但不进一步界定“一切”究竟专指情欲、感官活动还是更广的对象，以免超出本节原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“登上王位”的王权隐喻，并以“心智”承载本书中νοῦς兼具理性判断和道德治理的含义；“他”沿用希腊语动词所隐含的第三人称主语，不在本节内擅自补明其身份。
