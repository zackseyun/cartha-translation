base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/003.yaml
  text: For while he was still young and in the prime of life for sexual union[a], he nullified by reason the sting of the passions.
translation:
  language: zh_hans
  text: 因为他还年轻，正值性事精力旺盛的年华，却以理性使情欲的催逼[a]失去效力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “催逼”或译“叮刺”“刺驱”或“狂乱的冲动”。希腊词οἶστρον可指牛虻及其叮刺，也可比喻尖锐的刺激或驱使人行动的强烈冲动。
    reason: 说明οἶστρον的牛虻隐喻及其“催逼”之义，并提供不把该词简化为普通“冲动”的译法选择。
lexical_decisions:
- source_word: νέος
  choice: 还年轻
  rationale: 表达其处于青年时期；“还”自然体现当时的年龄状态，又不额外限定具体岁数。
- source_word: ἀκμάζων πρὸς συνουσιασμόν
  choice: 正值精力旺盛、适于交合的年华
  rationale: ἀκμάζων表示处于旺盛或巅峰状态，πρὸς συνουσιασμόν在此明确涉及性交能力或适宜性；此译法既保留原意，也维持庄重而清楚的现代汉语表达。
- source_word: ἠκύρωσεν
  choice: 使……失去效力
  rationale: 该动词表示使某物无效、失去作用；此处译为“使……失去效力”，准确呈现理性对情欲冲动的制伏，而不暗示情欲本身已不存在。
- source_word: τῷ λογισμῷ
  choice: 以理性
  rationale: λογισμός是《马加比四书》的核心伦理术语，指支配情欲的理性思考或判断能力；“理性”简洁并保留全书的主题关联。
- source_word: οἶστρον
  choice: 驱迫
  rationale: οἶστρον本可指牛虻叮刺，并可比喻强烈催逼、刺激或狂乱冲动；“驱迫”突出使人受催逼而行动的力量，同时保留比普通“冲动”更强的动态感。
- source_word: τῶν παθῶν
  choice: 情欲
  rationale: πάθη在本书伦理语境中指受理性约束的激情、欲求或感受；结合本句性交语境，“情欲”自然贴切，但仍保留其作为伦理性欲求的含义。
theological_decisions:
- issue: 如何翻译λόγισμος，以保留本书“理性支配情欲”的伦理主题
  choice: 理性
  alternative: 理性判断；思考能力
  rationale: “理性”是现代汉语中最简明、稳定的对应语，能体现本书的核心论题，又不引入后世某一特定哲学或教派体系。
- issue: ἠκύρωσεν是否表示彻底消灭情欲
  choice: 使情欲的驱迫失去效力
  alternative: 消除了情欲的驱迫
  rationale: 原词强调使其无效，而非证明情欲本身不复存在；本译法保留理性制伏其作用这一张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“交合”比“性交”略显典雅，但仍为普通读者所能理解；“使……失去效力”保留原文伦理哲学语气。脚注标记置于其实际解释的οἶστρον对应词“驱迫”之后。
