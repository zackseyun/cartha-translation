base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/015.yaml
  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
translation:
  language: zh_hans
  text: 而且，可见理性甚至能制伏那些更为强烈的情欲：贪恋权位、虚荣[a]、自夸、狂傲和嫉妒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚荣”原文直译为“空洞的荣耀”。
    reason: lexical_alternative
  - marker: b
    text: “嫉妒”也可包含恶意、仇视之意，并可能带有“恶眼”的文化含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: 那些更为强烈的情欲
  rationale: 结合 κρατεῖν，διά加属格在此表示理性所支配的范围；πάθη指情欲或激情，而非苦难。βιαιοτέρων强调其力量更强、冲击更猛烈。
- source_word: κρατεῖν
  choice: 制伏
  rationale: 该词表达占上风并取得支配；“制伏”既保留理性胜过情欲的力度，也符合现代汉语表达。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 这是《马加比四书》的哲学关键词，指能够判断并约束情欲的理性官能；“理性”简洁且不引入后世宗派术语。
- source_word: φαίνεται
  choice: 可见
  rationale: 表示某事显而易见或由论证得以看出；“可见”自然保留其论证语气。
- source_word: φιλαρχίας
  choice: 贪恋权位
  rationale: 该复合词指喜爱掌权、追求统治或居首位；“贪恋权位”清楚表达其作为恶欲的性质。
- source_word: κενοδοξίας
  choice: 虚荣
  rationale: 字面为“空洞的荣耀”；“虚荣”是现代汉语中最自然的对应词，脚注补明其字面意象。
- source_word: ἀλαζονίας
  choice: 自夸
  rationale: 指夸耀、虚张声势和自我标榜；“自夸”与后面的狂傲有所区分。
- source_word: μεγαλαυχίας
  choice: 狂傲
  rationale: 指自高自大、傲慢夸胜；“狂傲”保留强烈语气，并避免与 ἀλαζονία 合并为同一概念。
- source_word: βασκανίας
  choice: 嫉妒
  rationale: 核心意义是嫉妒，也可包含恶意和以“恶眼”加害的文化意涵；正文采用通顺的“嫉妒”，脚注保留较宽含义。
theological_decisions:
- issue: 如何翻译本书的哲学关键词 ὁ λογισμός
  choice: 理性
  alternative: 理性判断；理智；推理
  rationale: 本书论述受操练的理性胜过情欲。“理性”准确、简洁，也不把该词限定为一次具体的判断行为。
- issue: 如何区分恶德清单中三个相近的骄傲概念
  choice: κενοδοξίας＝“虚荣”；ἀλαζονίας＝“自夸”；μεγαλαυχίας＝“狂傲”
  alternative: 浮名／夸口／傲慢；虚荣／自负／高傲
  rationale: 原文连续列出彼此相关却不完全相同的恶欲；分别译出可保留其修辞累积和词义张力，而不笼统合并为“骄傲”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可见”保留论证语气；恶德清单使用简洁的双音节或四音节表达，并通过脚注保存希腊词的字面意象和文化含义。
