lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: 胜过
  rationale: 该动词表示占上风、取得支配地位；“胜过”既保留其较强的力度，也符合本段理性驾驭情感与欲念的论述。
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: 对妻子的情爱
  rationale: γαμετή明确指“妻子”，φιλία在这里指婚姻关系中的亲爱与眷恋，而非专指情欲；“情爱”自然地涵盖这种深厚感情。
- source_word: διὰ παρανομίαν
  choice: 因她违背律法
  rationale: παρανομία指违反律法或规范的行为。结合随后以αὐτήν为责备对象，中文补出“她”以交代关系，但不把过犯具体化。
- source_word: ἀπελέγχων
  choice: 责备
  rationale: 该分词表示指出过错并加以斥责；“责备”保留道德判断的语气，同时不额外暗示公开揭露。
- source_word: αὐτήν
  choice: 她
  rationale: 阴性代词回指γαμετήν（妻子）；中文用“她”表达清楚自然。
theological_decisions:
- issue: 理性对婚姻亲情的支配
  choice: 译为“胜过对妻子的情爱”，表明即使面对深厚的婚姻感情，仍可在律法要求下责备过犯。
  alternative: 译为“克制对妻子的情爱”，将语气理解为较温和的约束。
  rationale: ἐπικρατεῖ本身有占上风、制胜之意，而《马加比四书》的上下文强调理性对情感的统辖；因此保留这一较强说法，同时不引入后来的教义范畴。
translation_notes:
