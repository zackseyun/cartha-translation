base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: zh_hans
  text: 他也赐给这人一条律法，使他照着这律法履行公民的本分[a]，从而治理一个节制、公正、良善而勇毅的国度[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照着这律法过公民生活。”希腊词含有参与城邦或履行公民生活的政治意味。
    reason: lexical_alternative
  - marker: b
    text: “国度”也可译作“王权”或“统治”；希腊词既可指所统治的领域，也可指君王的统治本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: 给这人
  rationale: 与ἔδωκεν（“赐给”）构成自然的与格关系，并承接上文所指的人。
- source_word: νόμον
  choice: 一条律法
  rationale: 保留νόμος作为规范、律法的含义；“一条”自然表达希腊文无冠词名词在此所指的一项治理准则。
- source_word: καθʼ ὃν
  choice: 照着这律法
  rationale: 明确关系代词所回指的是律法，并保留“依照”的规范性关系。
- source_word: πολιτευόμενος
  choice: 履行公民的本分
  rationale: 保留πολιτεύομαι与城邦、公民生活有关的政治含义，同时以现代汉语表达人在共同体中依律行事；不将其简化为“治理”或纯粹的个人修身。
- source_word: βασιλεύσειε
  choice: 从而治理
  rationale: 以“从而”表达过去叙事中希求式所带的预期或潜在结果；“治理”适合其宾语“国度”。
- source_word: βασιλείαν
  choice: 一个……国度
  rationale: βασιλεία既可指王权、统治，也可指所统治的国度；正文采用较直观的“国度”，并以脚注保留另一种可能。
- source_word: σώφρονά
  choice: 节制
  rationale: 表现σώφρων所含的克制、适度和心智健全之意，也契合本书关于驾驭激情的伦理语境。
- source_word: δικαίαν
  choice: 公正
  rationale: 此处描述国度及其治理的公共伦理性质，“公正”比“公义”更直接体现政治和司法语境。
- source_word: ἀγαθὴν
  choice: 良善
  rationale: 保留该词宽泛的正面伦理意义，不将其过度具体化为“仁惠”或“高尚”。
- source_word: ἀνδρείαν
  choice: 勇毅
  rationale: 传达古典德目中的勇气和坚毅，同时避免把词源中的男性色彩不必要地带入现代译文。
theological_decisions:
- issue: πολιτευόμενος与王权之间的关系
  choice: 译作“履行公民的本分”，保留君王也在律法之下过公共生活的城邦意味。
  alternative: 依律行事；治理自己；管理国家
  rationale: 原词具有公民生活和城邦参与的语义。译文不把它消解为一般的守法或王室行政，也不额外引入特定政治神学。
- issue: βασιλείαν所指的是国度还是王权
  choice: 正文译作“国度”，脚注注明也可理解为“王权”或“统治”。
  alternative: 王权；统治
  rationale: 该词在希腊文中可指统治行为、王权本身或被统治的领域；上下文不足以完全排除其中任何一面，因此保留歧义。
- issue: δικαίαν在政治德目列举中的译法
  choice: 公正
  alternative: 公义；正直
  rationale: 这里修饰国度或王权的性质，公共治理语境中的“公正”最自然，同时没有否定该词的广泛伦理意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“履行公民的本分”刻意保留原文的城邦政治色彩；“节制、公正、良善而勇毅”按原文并列呈现四项伦理品质，不将其改写为解释性句子。
