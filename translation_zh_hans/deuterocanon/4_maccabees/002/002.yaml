  yaml_path: translation/deuterocanon/4_maccabees/002/002.yaml
  text: Accordingly[a], the self-controlled Joseph is praised[b], because by reason he mastered love of pleasure.
translation:
  language: zh_hans
  text: 因此，约瑟因自制而受到称赞，因为他凭着理性思考，制伏了对享乐的贪恋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所依据的希腊文本在此处的措辞略显生硬，直译近似“凭着理性，心思”；这里合并译为“凭着理性思考”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτῃ γοῦν
  choice: 因此
  rationale: 承接上文并引出推论；“因此”自然表达其总结和推论作用。
- source_word: ὁ σώφρων
  choice: 自制的
  rationale: 上下文着重理性对情欲的管束；“自制”比宽泛的“明智”更贴合此处的伦理含义。
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐπαινεῖται
  choice: 受到称赞
  rationale: 直接保留希腊文现在时被动语态的意义，同时符合现代汉语表达。
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: 凭着理性的思考
  rationale: 原文组合在此见证中略显生硬；将 λογισμός 与 διάνοια 合并表达为理性思考，既保留理性管束情欲的主题，也避免不自然的同义堆叠。
- source_word: περιεκράτησεν
  choice: 制伏了
  rationale: 该动词表示取得支配或控制；“制伏”清楚呈现约瑟战胜欲望的意思。
- source_word: τῆς ἡδυπαθείας
  choice: 贪恋享乐的欲望
  rationale: ἡδυπάθεια 可指对享乐的贪恋或耽溺；此译兼顾其欲望与享乐取向，且不把含义局限为单一类别的诱惑。
theological_decisions:
- issue: 《马加比四书》中理性管束情欲的伦理哲学术语
  choice: 以“自制”和“凭着理性的思考”凸显理性对欲望的管束
  alternative: 可译为“明智／凭理智”或“节制／借着推理”
  rationale: 本节服务于全书关于理性支配情欲的论证；所选措辞保留这一思想框架，同时不引入后期宗派性教义。
- issue: ἡδυπάθεια 所指欲望的范围
  choice: 译作“贪恋享乐的欲望”
  alternative: “享乐欲”或“对享乐的贪爱”
  rationale: 保留词语对享乐或愉悦的总体倾向，不因约瑟叙事的背景而擅自限定为性欲。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“自制”“理性的思考”“制伏”形成清楚的伦理论证链条；脚注保留原文措辞的异常，而不把生硬结构强加于正文。
