    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  choice: 不要认为
  rationale: νομίζω在这里表示作出判断；“不要认为”自然、准确地保留了否定命令的语气。
- source_word: παράδοξον
  choice: 出人意料的
  rationale: παράδοξος指有悖于通常预期、令人惊讶；“出人意料”比现代汉语中偏技术性的“悖论”更贴合此处。
- source_word: ὅπου
  choice: （以冒号引出后文）
  rationale: ὅπου本义为“哪里”，此处结构紧缩，用来引出不应觉得意外的情形；汉语以冒号承接，既自然又不额外限定其逻辑关系。
- source_word: ἔχθραν
  choice: 敌意
  rationale: ἔχθρα可指敌对、仇视或敌意；“敌意”范围较宽，并保留其作为受理性制约之倾向的含义。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: λογισμός是《马加比四书》的主题词，指理性判断或理性能力；“理性”简洁地保留其哲学语境。
- source_word: ἐπικρατεῖν δύναται
  choice: 甚至能够胜过
  rationale: δύναται表达能力，ἐπικρατεῖν表达占上风、制胜；“能够胜过”准确自然，“甚至”体现καὶ在此处的强调作用。
- source_word: διὰ τὸν νόμον
  choice: 为了律法
  rationale: διά加宾格可表达缘由或动机；“为了律法”保留因忠于律法而产生克制的动机含义，同时脚注说明也可按因由理解。
- source_word: νόμον
  choice: 律法
  rationale: 此处指犹太律法；“律法”是现代中文圣经语域中清楚且庄重的对应词，无须在正文进一步解释。
theological_decisions:
- issue: λογισμός在本书哲学—神学论述中的含义
  choice: 理性
  alternative: 理性判断；理智
  rationale: 本书论证敬虔的理性能够支配各种情欲；采用“理性”可保留这一主题，又不引入后世特定哲学体系。
- issue: διὰ τὸν νόμον所表达的关系
  choice: 为了律法
  alternative: 因为律法
  rationale: 希腊文可表达缘由或动机。正文采用“为了律法”凸显对律法的委身，但不把律法描述为机械性的工具；脚注保留“因为律法”的可能性。
- issue: 理性对敌意的作用强度
  choice: 胜过
  alternative: 制伏；占上风
  rationale: ἐπικρατέω表示取得优势或制胜；“胜过”保留理性居于支配地位的主张，同时不额外断言敌意已被彻底消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“理性”“敌意”“律法”分别保留本节的哲学、伦理和犹太信仰语境；以冒号处理ὅπου引出的紧缩结构，避免生硬直译。所有脚注标记均置于正文相关句末。
