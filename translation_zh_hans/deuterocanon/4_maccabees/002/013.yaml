  text: 并且，不要认为这是出人意料的：理性甚至能够为了律法胜过敌意。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要认为这是奇怪的”或“不要认为这是反常的”。希腊词可指有悖于预期、令人惊讶。
    reason: lexical_alternative
  - marker: b
