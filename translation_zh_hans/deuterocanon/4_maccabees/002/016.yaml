    rationale: ἀπωθεῖται为直陈现在时，陈述自制的理性实际排斥这些情欲；译为“排斥”更直接。
  - severity: low
    issue: “愤怒也同样如此”在汉语中未明确说明其同样受何种动作影响。
    rationale: 原文ὥσπερ καὶ τὸν θυμόν省略的动词承接ἀπωθεῖται；明确为“也排斥愤怒”可保留句法关系，随后“也支配愤怒”体现γάρ及强调。
  - severity: low
    issue: “邪恶的情欲”略显生硬，且“邪恶”在现代汉语中容易带来不必要的绝对化宗教联想。
    rationale: κακόηθη指恶劣、败坏、有害的性质；“恶劣的情欲”既保留伦理贬义，也更符合现代书面语。
