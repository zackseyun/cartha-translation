base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/016.yaml
  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: zh_hans
  text: 因为自制的理性排斥所有这些恶劣的情欲，正如它也排斥愤怒；因为它也支配愤怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情欲”在这里泛指扰乱人的情感冲动和欲望，并非专指性欲。
    reason: 防止现代汉语读者把πάθη在本书哲学伦理语境中的含义误解为狭义性欲。
lexical_decisions:
- source_word: κακόηθη πάθη
  choice: 邪恶的情欲
  rationale: κακόηθη 表明这些 πάθη 具有恶劣、有害的道德性质；“情欲”在本书的哲学伦理语境中指扰乱人的情感冲动与欲望，不限于现代汉语中狭义的性欲。
- source_word: ὁ σώφρων νοῦς
  choice: 自制的理性
  rationale: νοῦς 在本书论证中侧重人的理性官能；σώφρων 同时含有节制、审慎和自我约束之意。“自制的理性”自然地保留理性受节制约束这一核心含义。
- source_word: ἀπωθεῖται
  choice: 排斥
  rationale: 该中间语态动词表示主动推开、拒斥；“排斥”既保留动作力度，也适合描述理性对情欲的抗拒。
- source_word: θυμόν
  choice: 愤怒
  rationale: 此处 θυμός 是受到理性管束的一种情感冲动，因此译作普通读者易懂的“愤怒”，而不取较宽泛的“血气”或较强烈的“暴怒”。
- source_word: δεσπόζει
  choice: 支配
  rationale: 该词表示作主、统辖。译作“支配”保留理性对愤怒具有主导权的强烈措辞，同时符合现代汉语表达。
theological_decisions:
- issue: ὁ σώφρων νοῦς 所表达的人论与哲学概念
  choice: 自制的理性
  alternative: 审慎的心智；节制的理性
  rationale: 本节论述的是带有 σωφροσύνη 品质的 νοῦς 对各种情欲的治理。“自制的理性”既不把 νοῦς 弱化为一般心理活动，也不将 σώφρων 仅限于知识上的审慎，因而保留原文中理性与道德自制相结合的张力。
- issue: καὶ γὰρ τούτου 的强调范围
  choice: 因为理性连愤怒也能支配
  alternative: 因为它也支配愤怒
  rationale: καί 在此具有递进强调意味，τούτου 回指 θυμός。“连……也……”清楚表达原文强调：愤怒同样不例外，仍受自制理性的支配。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。句式保留原文“排斥—支配”的两层论证，并通过重复“理性”和“愤怒”避免代词指涉含混。
