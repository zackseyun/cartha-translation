  yaml_path: translation/deuterocanon/4_maccabees/002/018.yaml
  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: zh_hans
  text: 因为，正如我说过的，审慎的理性能够胜过情欲，将其中一些改变方向，甚至使另一些失去作用。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων
  choice: 审慎的
  rationale: 此处修饰“理性”，强调判断健全、克己而有节制；“审慎的”在现代汉语中自然庄重，也不把含义缩减为单纯的情绪自制。
- source_word: νοῦς
  choice: 理性
  rationale: 本书以此词指治理情欲的理性能力；译作“理性”比泛指整个内在意识的“心思”或“心智”更符合论证语境。
- source_word: κατὰ τῶν παθῶν
  choice: 胜过各种情欲
  rationale: πάθη在本书中主要指驱使人的欲望、冲动和激情；结合ἀριστεῦσαι，译文表达理性对它们占据优势，而非泛指承受苦难。
- source_word: ἀριστεῦσαι
  choice: 胜过
  rationale: 该动词表示表现卓越、取得优势；“胜过”简洁地传达理性在与情欲的对抗中居于上风。
- source_word: μεταθεῖναι
  choice: 使……转向
  rationale: 原词可指改变、移转；此处表示改变某些情欲的方向或作用，与下一分句中更强的“使……失去作用”形成区别。
- source_word: ἀκυρῶσαι
  choice: 使……失去作用
  rationale: 原词意为使之无效、取消其效力；这一表达比“消灭”克制，避免声称相关情欲本身不复存在。
- source_word: τὰ μὲν αὐτῶν ... τὰ δὲ καί
  choice: 其中一些……甚至……另一些
  rationale: 保留两类不同结果之间的对应与递进：某些情欲被改变方向，另一些则进一步被解除效力。
theological_decisions:
- issue: νοῦς与πάθη所体现的人论和哲学框架
  choice: 以“理性”治理并胜过“情欲”来表达原文
  alternative: 将νοῦς译作“心智”，将πάθη宽泛地译作“情感”
  rationale: 本节论述的是希腊化犹太思想中理性对激情和冲动的治理。译文保留这一张力，但不引入后期神学体系，也不暗示一切正常情感都应被取消。
- issue: 理性对不同情欲产生的两种结果
  choice: 区分“使一些转向”与“使另一些失去作用”
  alternative: 笼统译为理性能够控制或消除情欲
  rationale: 原文刻意区分μεταθεῖναι和ἀκυρῶσαι；保留这一区别，可避免把经文简化为对全部情欲采取同一种方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“审慎的理性”保留哲学色彩；句式紧凑，并呈现原文“改变方向—解除效力”的递进对比。
