  text: For the law says[a], then, “You shall not desire your neighbor’s wife, nor anything that belongs to your neighbor.”
translation:
  language: zh_hans
  text: 律法确实说：“不可贪恋你邻舍的妻子，也不可贪恋属于你邻舍的任何东西。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 以现代汉语现在时自然引出经文引语。
- source_word: γοῦν
  choice: 所以
  rationale: 此词在这里承接上文，带有推论和确认意味；“所以”能清楚保留其连接作用。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 指摩西律法中的诫命；“律法”是简体中文圣经语境中自然且明确的表达。
- source_word: Οὐκ ἐπιθυμήσεις
  choice: 不可贪恋
  rationale: ἐπιθυμέω表示把欲望投向某人或某物；在禁止觊觎他人所有之物的诫命语境中，“贪恋”既保留欲望含义，也自然表达其不当指向。
- source_word: τὴν γυναῖκα τοῦ πλησίον σου
  choice: 你邻舍的妻子
  rationale: γυνή在所属关系中明确指妻子；πλησίον按传统且易懂的圣经用语译为“邻舍”。
- source_word: οὐδὲ ὅσα
  choice: 也不可贪恋……任何东西
  rationale: 中性复数关系表达涵盖一切事物；汉语用“任何东西”简洁自然，并补出前面的谓语以避免歧义。
- source_word: τῷ πλησίον σού ἐστιν
  choice: 属于你邻舍的
  rationale: 此结构表达所有关系，“属于”在现代汉语中直接清楚。
theological_decisions:
- issue: 十诫引文中ἐπιθυμέω的译法
  choice: 不可贪恋
  alternative: 不可欲求／不可觊觎
  rationale: “贪恋”能同时体现强烈欲望及其指向他人所有之物的伦理问题，又保留本书上下文关于欲望受理性约束的词义联系；“觊觎”更强调非法占有，而“欲求”在汉语中可能过于中性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“邻舍”和“律法”保留广为人知的圣经用语；句式简洁，并通过重复“不可贪恋”使禁令范围清楚。
