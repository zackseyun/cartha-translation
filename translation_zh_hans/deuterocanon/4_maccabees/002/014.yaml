  to: 也不可砍伐敌人栽培的植物；反要保全敌人的那些植物，留给那些失去了它们的人[a]，并扶起倒下之物。
  rationale: 修订保留原文关于敌方栽培物的具体形象、主动分词的未决指向，以及“倒下之物”的宽泛所指。以“植物”避免将 φυτά 限定为树木；重述“敌人的那些植物”对应 τὰ δὲ τῶν ἐχθρῶν；脚注以不偏向单一解释的方式交代 τοῖς ἀπολέσασιν 的语义歧义。
