  yaml_path: translation/deuterocanon/4_maccabees/002/014.yaml
  text: nor cutting down the cultivated plants of enemies[a], but preserving those of foes who have been destroyed, and raising up what has fallen.
translation:
  language: zh_hans
  text: 也不可砍伐敌人栽培的植物；反要保全敌人的那些植物，留给那些失去了它们的人[a]，并扶起倒下之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些失去了它们的人”直译为“那些失去（了某物）的人”。希腊文使用主动分词，宾语未明；也可按“那些毁掉了（某物）的人”理解。
    reason: 说明 τοῖς ἀπολέσασιν 的主动语态及省略宾语所造成的歧义，同时避免误译为“已被毁灭的人”。
lexical_decisions:
- source_word: μηδὲ
  choice: 也不可
  rationale: 承接上文的否定性描述；“也不可”在汉语中自然地表达协调否定。
- source_word: δενδροτομῶν
  choice: 砍伐
  rationale: 该词指砍树、伐木；结合后面的栽培植物，用“砍伐”既准确又不额外限定为取材伐木。
- source_word: τὰ ἥμερα ... φυτά
  choice: 栽培的树木
  rationale: ἥμερα 指经过培育、非野生的植物；在 δενδροτομῶν 的搭配下，φυτά 此处自然理解为可砍伐的树木，但仍保留农业栽培之意。
- source_word: τῶν πολεμίων
  choice: 敌人
  rationale: 按所有关系理解为敌人所有的栽培树木；简洁直译。
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: 反要……把它们
  rationale: δέ 表达与砍伐相反的行动；代词“它们”回指前面的栽培树木，避免生硬重复“敌人的东西”。
- source_word: τοῖς ἀπολέσασιν
  choice: 为失去这些树木的人
  rationale: ἀπολέσασιν 是主动形式，较直接地表示“失去（它们）的人”；与格用“为”表达受益关系。原文关系高度压缩，因此不擅自加入“主人”或改作被毁灭的人。
- source_word: διασώζων
  choice: 保全
  rationale: 表达使某物安然保存、不被毁坏；符合战争中保护敌方栽培物的语境。
- source_word: τὰ πεπτωκότα
  choice: 倒下的
  rationale: 保留原文实词化分词的宽泛指称，不明确补出究竟是树木、人或其他事物。
- source_word: συνεγείρων
  choice: 扶起
  rationale: 保留“使之重新起来”的具体形象；比抽象的“恢复”更贴近原词。
theological_decisions:
- issue: 对敌方财物的人道约束
  choice: 译为不可砍伐敌人栽培的树木，反而要予以保全并扶起倒下的。
  alternative: 把全句泛化为善待或恢复敌人的财产。
  rationale: 原文以具体行动刻画受理性约束的战争行为；保留树木、保全和扶起的形象，不将伦理内容扩大为原文未明说的普遍财产权原则。
- issue: τοῖς ἀπολέσασιν 所指及语态
  choice: “为失去这些树木的人”
  alternative: “为已经灭亡的人”或“其主人已被毁灭”
  rationale: 该分词为主动形式，可表示失去某物；译作被毁灭或灭亡会弱化语态差别，并可能把敌人死亡这一层意思强加给原文。脚注保留句法上的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“栽培的树木”结合砍伐语境表达农业植物；末句刻意保留“倒下的”这一宽泛说法，以免补入原文没有明确指出的对象。
