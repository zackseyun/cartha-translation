base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: zh_hans
  text: 所以，即使有人贪爱钱财，他若按律法生活，也会强行约束自己的性情：借给有需要的人，不收利息；到了第七年[a]，就免除债务[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“七期来到时”，是指律法规定在第七年豁免债务的周期。
    reason: cross_reference
  - marker: b
    text: 也可理解为“在这笔贷款上承担损失”，着重债权人因免除债务而蒙受的损失。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  choice: 所以
  rationale: 该短语承接上文并引出直接结论；“所以”自然表达其推论作用。
- source_word: τῷ νόμῳ πολιτευόμενος
  choice: 按律法生活
  rationale: πολιτεύομαι在此指人的生活方式和行为规范；与格τῷ νόμῳ表示以律法为准则，译文既保留这种关系，也符合现代汉语。
- source_word: φιλάργυρός
  choice: 贪爱钱财
  rationale: 保留“爱钱”的词义形象，同时比生硬的“爱钱者”更自然，并体现语境中的负面倾向。
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: 迫使他约束自己的性情
  rationale: βιάζεται具有强迫、施加压力之意，τρόπος可指性情或惯常行事方式；此译表达人在律法约束下强制克服自身倾向，而不把原文简化为一般的自律。
- source_word: τοῖς δεομένοις
  choice: 有需要的人
  rationale: 在借贷与济助的语境中，指有缺乏、需要帮助的人。
- source_word: δανείζων χωρὶς τόκων
  choice: 借给……不收利息
  rationale: 直明无息借贷的实际行为，采用普通现代汉语。
- source_word: τὸ δάνειον
  choice: 债务
  rationale: 该词本可指贷款或所借之物；在第七年豁免的法律语境中，“债务”最清楚地表达被免除的对象。
- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: 到了第七年
  rationale: 字面涉及“七数/七期来到”，语境指债务豁免的七年周期；正文明确其法律所指，并用脚注保留原文措辞。
- source_word: χρεοκοπούμενος
  choice: 免除债务
  rationale: 该分词在此可表达因放弃追偿而承担损失；正文采用法律行为的结果“免除债务”，脚注保留强调出借人蒙受损失的可能读法。
theological_decisions:
- issue: τῶν ἑβδομάδων ἐνστασῶν χρεοκοπούμενος所指的安息年债务豁免
  choice: 正文译为到了第七年便免除债务
  alternative: 七期来到时，在贷款上蒙受损失
  rationale: 希腊文表达压缩且可着重法律上的免债，也可着重债权人因此承担的损失。上下文谈按律法克服爱财之心，无息借贷并放弃追偿，因此正文采用清楚的法律含义，脚注注明另一重语义，不将两者对立起来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“贪爱钱财”保留原词形象；“迫使他约束自己的性情”保留βιάζεται的强烈力度及τρόπος所指的内在倾向。脚注标记均置于相关正文之后。
