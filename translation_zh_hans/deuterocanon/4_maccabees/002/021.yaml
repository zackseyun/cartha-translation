  text: For when God constructed man, he implanted both his passions and his dispositions.
translation:
  language: zh_hans
  text: 因为上帝塑造人时，把情感冲动和性情都植入人里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁπηνίκα
  choice: ……的时候
  rationale: 这是时间连词；结合不定过去时，表示上帝塑造人之时，并非反复发生的“每当”。
- source_word: κατεσκεύασεν
  choice: 塑造
  rationale: 该动词强调有目的地制成、构造。“塑造”在现代汉语中自然庄重，保留精心造作之意，又不把它直接等同于特定的“创造”术语。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 带冠词的单数在此泛指人类或作为代表的人；汉语“人”自然涵盖这一泛指意义。
- source_word: τὰ πάθη
  choice: 情感冲动
  rationale: 在本书的哲学论述中，该词指需要受理性节制的感受、欲念与冲动，而非外在的苦难。“情感冲动”既保留其心理动力，也避免把它狭化为现代汉语中常偏指性欲的“情欲”。
- source_word: τὰ ἤθη
  choice: 性情
  rationale: 该词指人的品性、习性或较稳定的性格倾向。“性情”简明自然，并保留其广泛的人格含义。
- source_word: περιεφύτευσεν
  choice: 植入其中
  rationale: 保留动词的栽植隐喻，同时用“其中”明确这些因素被置于人里面。
theological_decisions:
- issue: 情感冲动和性情是否被说成上帝塑造人时所植入
  choice: 直译为上帝把二者一并植入人里面
  alternative: 弱化为上帝只赋予中性的能力，或省略情感冲动源于上帝的表述
  rationale: 希腊文明确把 τὰ πάθη 和 τὰ ἤθη 都作为上帝所植入的对象。译文保留这一带有神学张力的人论陈述，不以体系化解释加以缓和。
- issue: κατεσκεύασεν 是否译作特定神学术语“创造”
  choice: 塑造
  alternative: 创造
  rationale: 原词主要表示制作、构造或装备，并非专门的“从无创造”术语；“塑造”更贴近词义，也不否认上下文所述行动由上帝施行。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“一并”对应两个并列宾语的整体性；“其中”避免连续使用男性代词，也清楚指向作为泛称的“人”。
