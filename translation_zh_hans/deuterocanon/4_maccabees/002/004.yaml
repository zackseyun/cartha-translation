  yaml_path: translation/deuterocanon/4_maccabees/002/004.yaml
  text: And reason is seen to prevail not only over the frenzy that drives pleasure[a], but also over every desire.
translation:
  language: zh_hans
  text: 理性可见不仅能制伏贪图享乐的狂乱冲动[a]，也能制伏一切欲望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贪图享乐的催逼”，又或：“纵情享乐的发狂冲动”。希腊原文的说法非常凝练，带有受叮刺、催逼而发狂的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 这是《马加比四书》的核心哲学用语，指能够作出道德判断并约束情欲的理性能力；“理性”简洁、自然，也保留其哲学分量。
- source_word: φαίνεται
  choice: 显然
  rationale: 此词表达某事显而易见或呈现出来；“显然”符合本段论证语气，同时不把它强化为形式上的证明。
- source_word: ἐπικρατεῖν
  choice: 能制伏
  rationale: 该动词表示占优势、掌控或胜过；“制伏”清楚传达理性对欲望的有效支配，并适合现代中文。
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: 贪图享乐所激起的狂乱
  rationale: 这一罕见而浓缩的表达结合了纵情享乐与如受叮刺、驱赶而陷入躁狂的意象；此译法展开其隐喻，同时避免误成“驱使享乐”。
- source_word: ἡδυπαθεία
  choice: 贪图享乐
  rationale: 该词不只是中性的快乐，也含爱好享乐、纵情自娱之意；“贪图享乐”保留其负面道德色彩而不过度限定为性欲。
- source_word: οἰστρηλασία
  choice: 所激起的狂乱
  rationale: 该罕见名词含有被刺痛、催逼而进入狂乱状态的复合意象；中文以短语表达，比生硬直译更清楚。
- source_word: πάσης ἐπιθυμίας
  choice: 一切欲望
  rationale: πάσης 表示无一例外的范围，ἐπιθυμία泛指欲求或渴望；“一切欲望”保留原文概括性的断言。
theological_decisions:
- issue: 理性对情欲的支配这一人论与哲学主张
  choice: 理性显然能够制伏享乐所激起的冲动，并制伏一切欲望
  alternative: 理性似乎只能制约某些欲望
  rationale: 原文把理性对情欲的优势作为全书中心论点之一，并以 πάσης 扩展到“一切”欲望。译文保留这一强断言，同时以“显然”对应 φαίνεται，不引入后来的宗派性人论框架。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“理性”“欲望”保留哲学论述的清晰度；对罕见复合表达作适度展开，并以脚注保存其多重隐喻可能。
