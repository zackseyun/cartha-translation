  text: For the law also prevails over affection toward parents[a], not betraying virtue on account of them[b];
translation:
  language: zh_hans
  text: 因为律法也胜过对父母的亲爱之情[a]，不因他们而背弃美德[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对父母的善意”或“对父母的敬爱”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为了他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: 律法
  rationale: 保留定冠词所指的特定律法；在《马加比四书》的语境中，指作为道德权威的犹太律法。
- source_word: τῆς πρὸς γονεῖς εὐνοίας
  choice: 对父母的亲爱
  rationale: εὔνοια可指善意、好感或亲爱；此处采用自然的亲情表达，同时不将其强化为“顺从”。
- source_word: κρατεῖ
  choice: 胜过
  rationale: κρατέω在此表示居于优势、具有支配力；“胜过”简明地表达律法在伦理次序上高于亲情，也保留其可理解为辖制亲情的张力。
- source_word: μὴ καταπροδιδοὺς
  choice: 不……背弃
  rationale: καταπροδίδω带有出卖、彻底放弃之意；“背弃”与“美德”搭配自然，并保留其较强语气。
- source_word: τὴν ἀρετήν
  choice: 美德
  rationale: ἀρετή是本书重要的哲学伦理词，指德性或道德卓越；“美德”庄重且通俗。
- source_word: δι᾽ αὐτούς
  choice: 因他们
  rationale: διά加宾格可表示原因或缘故；这里的代词回指父母，译文保留“因他们／为了他们”的细微歧义，并以脚注注明另一译法。
theological_decisions:
- issue: 律法与孝亲之情的伦理次序
  choice: 译为律法“胜过”对父母的亲爱，表明发生冲突时律法居于优先地位。
  alternative: 律法“辖制”或“约束”对父母的亲爱，不一定暗示每种情况下都存在直接冲突。
  rationale: κρατεῖ与“不背弃美德”的分词结构共同表明道德上的优先次序；译文不把这种表述扩展成经文未明说的普遍教义。
- issue: 分词 μὴ καταπροδιδοὺς 的逻辑主语
  choice: 按语法使其承接“律法”：律法不因父母而背弃美德。
  alternative: 按伦理含义理解为受律法支配的人不为父母之故背弃美德。
  rationale: 希腊文阳性单数分词在句法上与ὁ νόμος一致；中文保持原句结构，不暗中改换主语，同时承认其拟人化表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“律法”“美德”保留本书的犹太与希腊哲学伦理语域；句末分号依从上下文未完的论证结构。
