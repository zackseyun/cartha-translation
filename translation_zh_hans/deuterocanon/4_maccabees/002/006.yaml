base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: zh_hans
  text: 然而，律法已吩咐我们不可贪欲[a]，我就更能使你们信服：理性能驾驭欲望，正如它也能驾驭那些妨碍公义的激情。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪欲”所译的希腊词也可泛指“渴望”或“欲求”；这里因律法禁令的语境而这样翻译。
    reason: 说明同一希腊词根在禁令语境与一般伦理论述中采用不同中文表达，避免把其意义错误限定为某一种欲望。
lexical_decisions:
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  choice: 贪欲 / 各种欲望
  rationale: 同一词根在前半句涉及律法禁令时译作“贪欲”，符合诫命语境；后半句用范围较广的“各种欲望”，保留作者关于理性驾驭欲求的普遍论述。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 在《马加比四书》的伦理论证中指进行判断、约束激情的理性能力；“理性”比“思想”或“推理”更准确自然。
- source_word: κρατεῖν
  choice: 制伏
  rationale: 表达掌控、驾驭之意，同时保留欲望和激情仍然存在、但可受理性约束的张力。
- source_word: πάθη
  choice: 情感冲动
  rationale: 此处泛指阻碍行义的各种激情或情感作用，并不限于性欲；“情感冲动”在现代汉语中清楚且不过度技术化。
- source_word: δικαιοσύνης
  choice: 行义
  rationale: 上下文关注实践性的正直行为；译作“行义”自然地呈现激情对正义实践的妨碍。
theological_decisions:
- issue: 律法禁令与理性制欲之间的关系
  choice: 保留“律法既然吩咐……我就更能使你们信服”的论证措辞
  alternative: 把本句解释为律法本身赋予人制伏欲望的能力
  rationale: 希腊文只说律法发出禁令，并以此支持理性能够制欲的论点；没有明确说明能力的来源，因此不补入特定的恩典论、自由意志论或功德观。
- issue: 理性对欲望的作用程度
  choice: 译作“制伏”
  alternative: 译作“消除”或“根除”
  rationale: κρατεῖν表示掌控或胜过，不表示欲望本身被彻底消灭；本译保留原文的伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“然而”承接让步语气；“使你们信服”保留论辩场景；句末以“情感冲动”区别于前面的“欲望”，同时避免把 πάθη 狭义化为性欲。
