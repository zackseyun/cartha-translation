  yaml_path: translation/deuterocanon/4_maccabees/002/024.yaml
  text: How then, someone might say, if reason rules over the passions, does it not also rule over forgetfulness and ignorance?
translation:
  language: zh_hans
  text: 那么，也许有人会说：既然理性能够支配各种情欲，为什么不能支配遗忘和无知呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: 那么……为什么……呢
  rationale: 引出论证中的反问或异议；用现代汉语的“那么……为什么……呢”自然保留其修辞力度。
- source_word: εἴποι τις ἄν
  choice: 也许有人会说
  rationale: 带ἄν的潜能语气表示假设中的发言者；此译法既准确又符合汉语论辩表达。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在本书中指理性所要驾驭的情感、欲望与冲动；“情欲”保留其伦理—哲学含义，“各种”体现希腊语复数而不把它缩限为单一欲望。
- source_word: ὁ λογισμὸς
  choice: 理性
  rationale: 此处指作出理性判断并实施节制的能力；“理性”简洁地保留本书核心哲学术语的含义。
- source_word: κρατεῖ
  choice: 能够支配
  rationale: κρατέω表示掌控、制伏；“支配”适合抽象宾语，补出“能够”则清楚传达这里关于能力范围的论证，且与后半句形成对应。
- source_word: λήθης
  choice: 遗忘
  rationale: λήθη指忘却或记忆的丧失；“遗忘”是现代汉语中清楚自然的抽象表达。
- source_word: ἀγνοίας
  choice: 无知
  rationale: ἀγνοία指不知道或缺乏知识；“无知”与“遗忘”并列，保留原文的哲学语体。
theological_decisions:
- issue: πάθη与λογισμός在《马加比四书》中的人论及哲学含义
  choice: 将πάθη译为“各种情欲”，将λογισμός译为“理性”
  alternative: 可将πάθη译为“各种激情”或“各种情感”，将λογισμός译为“理性判断”
  rationale: 经文延续本书关于敬虔理性驾驭πάθη的论证。“理性”准确而通俗；“各种情欲”体现这些内在冲动需要受约束的语境，但不把它限定为性欲，也不主张所有情感本身皆为恶。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留假想异议者与反问结构，并让前后两次κρατεῖ以“支配”对应呈现。
