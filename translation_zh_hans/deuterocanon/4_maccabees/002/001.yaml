  terminology: 保留“心灵”“欲望”“美”，不将 ψυχή 窄化为理智，也不将 κάλλος解释为道德高尚。“分有”比“分享”更适合表达 μετουσία 的哲学性参与、享有之义，且不增加共同分配的含义。
