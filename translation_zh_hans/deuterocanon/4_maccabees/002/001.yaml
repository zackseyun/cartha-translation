  yaml_path: translation/deuterocanon/4_maccabees/002/001.yaml
  text: And what is surprising if the desires of the soul are nullified in relation to participation in beauty?[a]
translation:
  language: zh_hans
  text: 那么，心灵的欲望对于分有美而言失去效力，又有什么可惊奇的呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对于参与美而言。”原文措辞较为抽象；“分有”也可译为“参与”或“享有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: 有什么可惊奇的呢
  rationale: 以现代汉语自然的反问句式保留希腊文的修辞力量。
- source_word: ἐπιθυμίαι
  choice: 欲望
  rationale: 该词泛指欲求或冲动；“欲望”保持宽泛含义，不预先将其贬义化，也不缩窄为肉体欲求。
- source_word: ψυχῆς
  choice: 心灵
  rationale: 此处指人的内在生命与欲求主体；“心灵”在现代汉语中比“灵魂”更自然，同时未缩窄为单纯的理智或思想。
- source_word: ἀκυροῦνται
  choice: 失去效力
  rationale: 保留被动意义所表达的‘被使为无效、不能发挥作用’，比生硬的“被废除”更符合此处关于欲望受制的论述。
- source_word: πρὸς
  choice: 在……事上
  rationale: 表达欲望失效所涉及的对象或范围，同时保留介词关系的一定开放性。
- source_word: τοῦ κάλλους
  choice: 美
  rationale: 直接对应 κάλλος，不擅自限定为道德之美、高尚或外在美。
- source_word: μετουσίαν
  choice: 分享
  rationale: 表达参与、分有某物之意；相较抽象的“参与”，与“美”搭配更自然，同时脚注保留形式更强的译法。
theological_decisions:
- issue: ψυχή 在希腊化犹太哲学语境中的人论含义
  choice: 心灵
  alternative: 灵魂
  rationale: “心灵”能涵盖欲望所在的内在主体，又避免现代读者把“灵魂”仅理解为与身体分离的实体；但原词的哲学人论张力仍予保留。
- issue: κάλλος 的审美与伦理含义
  choice: 美
  alternative: 美好的事物；高尚
  rationale: 原文直接使用抽象名词“美”；上下文或可包含道德之美，但正文不替作者消解这一含混。
- issue: μετουσία 与 κάλλος 的抽象关系
  choice: 分享美
  alternative: 分有美；参与美好的事物
  rationale: 正文采用自然而仍具哲学意味的表达，不把“美”具体化；脚注提示较形式化和较显明的可能译法。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。反问句保留原文语气；“失去效力”清楚传达被动动词的功能性含义；正文维持“美”的抽象性，并以脚注呈现 πρὸς τὴν τοῦ κάλλους μετουσίαν 的其他可能理解。
