  text: and it masters love for children[a], punishing them for their wickedness; and it rules over attachment to friends, reproving them for their evil.
translation:
  language: zh_hans
  text: 它也支配对子女的疼爱[a]，因他们的恶行而惩罚他们；也驾驭与朋友的亲密情谊，因他们的邪恶而责备他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“子女的爱”和“朋友的熟稔交往”；这里按语境理解为对子女的疼爱，以及与朋友因熟悉交往而形成的情谊。
    reason: 说明两个属格结构及 συνήθεια 的词义范围，并避免将原文未明确表达的“自己”作为确定信息加入注释。
lexical_decisions:
- source_word: κυριεύει
  choice: 支配
  rationale: 表示行使主权、取得控制；“支配”保留其强烈的驾驭意味，并与下半句的 δεσπόζει 构成平行。
- source_word: τῆς τέκνων φιλίας
  choice: 对子女的疼爱
  rationale: φιλία 指爱与情感联结；属格 τέκνων 在语境中最自然地表示爱所指向的对象，即对子女的亲情。
- source_word: διὰ κακίαν αὐτῶν
  choice: 因他们的恶行
  rationale: διὰ 加宾格表示原因；κακία 可指恶劣品性或恶行，此处以“恶行”自然说明施罚的缘由。
- source_word: κολάζων
  choice: 惩罚
  rationale: 该分词表示因过错而施加惩处；“惩罚”保留其明确的管教、惩治力度，避免弱化为一般纠正。
- source_word: τῆς φίλων συνηθείας
  choice: 与朋友的亲密情谊
  rationale: συνήθεια 可表示因经常交往而形成的熟悉、亲近或依恋；“亲密情谊”兼顾交往与情感纽带，符合现代汉语表达。
- source_word: δεσπόζει
  choice: 驾驭
  rationale: 表示作主、掌控；“驾驭”既与前句“支配”呼应，又避免机械重复。
- source_word: διὰ πονηρίας
  choice: 因他们的邪恶
  rationale: πονηρία 指道德上的邪恶、败坏；“邪恶”保留原词较重的道德色彩。
- source_word: ἐξελέγχων
  choice: 责备
  rationale: 该词可指揭露、驳斥、使人知罪或斥责；因宾语是人，“责备”在此自然表达针对其邪恶而予以指斥，同时不限定为法庭意义上的定罪。
theological_decisions:
- issue: 动词所省略的主语
  choice: 以“它”承接上下文，不在本节明说主语为何
  alternative: 直接补作“理性”或“理性的自制力”
  rationale: 希腊文本本节只有谓语和宾语，未重述主语。上下文所论虽指向受理性引导的自制，但正文使用“它”可保留原文的承接方式，避免在本节额外明释。
- issue: 天然亲情与道德判断之间的张力
  choice: 保留“支配／驾驭”亲情，并明确因恶而惩罚、责备
  alternative: 弱化为在亲情中作出适度调整或劝导
  rationale: 原文刻意强调对亲子之爱和朋友情谊的强力控制；不应为缓和语气而削弱其伦理张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“疼爱”体现亲子关系中的自然亲情，“亲密情谊”表达长期交往形成的朋友纽带；“支配／驾驭”保留原文两个近义支配动词的平行与力度。
