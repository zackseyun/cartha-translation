  register: 采用现代、庄重而易懂的书面汉语。保留原文两次ἐπαμύνονται的重复意义，但按各自句法分别译作“抵御”和“保护”。“像用铁器一样”保留略显强烈的原文明喻；脚注说明蜂房建造及“幼子”意象，避免正文过度解释。
