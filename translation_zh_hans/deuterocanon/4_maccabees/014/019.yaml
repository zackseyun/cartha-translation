  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: zh_hans
  text: 因为就连蜜蜂在筑造蜂房的时候[a]，也抵挡那些靠近它们的；它们用螫针[b]，如同用铁器一般，击打那些靠近它们巢中幼子的[c]，并且至死护卫它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在产蜡的时节”或“在造蜂房的时候”。希腊文特指产蜡、造蜂房，不只是泛指酿蜜。
    reason: lexical_alternative
  - marker: b
    text: 直译为“用κέντρον”；在蜜蜂的语境中，这个词自然是指“螫针”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文意为“它们的一窝幼子”，借用了保护后代的意象；这里是修辞性的类比，并非严谨的动物学表述。
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: 就连
  rationale: 以强调语气引出例证；“就连”符合现代汉语论述语流，又不显陈旧。
- source_word: μέλισσαι
  choice: 蜜蜂
  rationale: 直接对应所指动物。
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: 到了筑造蜂房的时候
  rationale: κηρογονία具体指产蜡、造蜂房，而非泛指酿蜜；此译自然地保留筑造巢房的意象。
- source_word: ἐπαμύνονται
  choice: 抵御；保护
  rationale: 该动词表示为防卫而抗拒。第一次没有明示宾语，译作“抵御”；末次结合上下文中的幼子，译作“保护它们”。
- source_word: τοὺς προσιόντας
  choice: 那些靠近的／那些走近……的
  rationale: 忠实保留现在分词所表达的走近动作，不额外把来者定性为敌人或袭击者。
- source_word: καθάπερ σιδήρῳ
  choice: 像用铁器一样
  rationale: 保留原文以铁为喻的工具性表达，同时使汉语句法顺畅。
- source_word: τῷ κέντρῳ
  choice: 螫针
  rationale: κέντρον在蜜蜂语境中指用于螫刺的器官；“螫针”准确、简洁。
- source_word: πλήσσουσι
  choice: 刺击
  rationale: 既体现“击打”的力度，又配合蜜蜂以螫针攻击的具体动作。
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: 蜂群幼子
  rationale: νοσσιά可指一窝幼小后代。此处保留护卫后代的修辞意象，同时以“蜂群”避免汉语将其误解为鸟类雏鸟。
- source_word: ἐπαμύνονται ἕως θανάτου
  choice: 至死保护它们
  rationale: “至死”保留ἕως θανάτου的极端程度；宾语依据紧邻的“蜂群幼子”补明，以呈现母性护幼的上下文意象。
