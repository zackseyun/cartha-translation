base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/026.yaml
  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
translation:
  language: zh_hans
  text: 然而，在所有母亲中，这七个孩子的母亲成为最疼爱孩子的母亲[a]；她经由七次怀胎，使她对他们的深情深深植根于心中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比别的母亲更疼爱孩子。”希腊语φιλοτεκνοτέρα为比较级；但因前有“在所有母亲中”，此处在语境中具有最高级的含义。
    reason: 保留希腊语比较级形式与语境中最高级含义之间的张力。
lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: 然而，在所有母亲中
  rationale: πασῶν与τῶν μητέρων构成部分属格，意为“在所有母亲中”；δέ承接上文并略带转折，用“然而”自然表达。
- source_word: ἐγένετο
  choice: 最……
  rationale: 该动词本有“成为、显为”之意，但在现代汉语比较句中若直译“成为最疼爱”略显生硬，结合上下文融入“最疼爱”的述语结构。
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: 那七个孩子的母亲
  rationale: 原文直译为“那七个的母亲”；汉语需补出被省略的中心语，“孩子”既符合上下文，也不限定性别。
- source_word: φιλοτεκνοτέρα
  choice: 最疼爱自己的孩子
  rationale: 这是比较级，但与“在所有母亲中”连用时具有最高级语义；“疼爱”自然表达对儿女深厚的爱护与眷恋。
- source_word: ἥτις
  choice: 她
  rationale: 此关系代词带解释性质，引出她格外疼爱孩子的缘由；分号后用“她”符合现代汉语行文。
- source_word: ἑπτὰ κυοφορίας
  choice: 经历了七次怀胎
  rationale: κυοφορία指妊娠、怀胎；此译保留七次孕育的身体经验，并较“七次妊娠”更自然庄重。
- source_word: τὴν πρὸς αὐτοὺς ... φιλοστοργίαν
  choice: 对他们的亲情
  rationale: φιλοστοργία指家人之间自然、亲密的 affection；“亲情”保留家庭之爱的含义，又不额外加入原文未明说的“母爱”。
- source_word: ἐπιφυτευομένην
  choice: 深深栽种在她心里
  rationale: 保留“栽种、植入”的比喻；补出“在她心里”使汉语表达完整，并呈现这种亲情内在扎根的意象。
