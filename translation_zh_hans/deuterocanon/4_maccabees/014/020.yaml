  text: But motherly affection for her children did not move the mother of the young men, who was of one spirit with Abraham.
translation:
  language: zh_hans
  text: 然而，对儿女的亲情并没有动摇这些青年人的母亲；她与亚伯拉罕同心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然而，对儿女的亲情并没有动摇这些青年人的母亲；她像亚伯拉罕一样。”希腊文直译为“这些青年人的母亲，与亚伯拉罕同心”。
    reason: 说明ὁμόψυχον可较概括地译为“像亚伯拉罕一样”，同时明确该描述修饰母亲，并保留正文较贴近原文结构的译法。
lexical_decisions:
- source_word: μετεκίνησεν
  choice: 动摇
  rationale: 该动词本指使某人离开原有位置或状态；这里指母亲坚定的意志未因亲情而改变。“动摇”既保留位移隐喻，也符合现代汉语表达。
- source_word: συμπάθεια τέκνων
  choice: 对儿女的亲情
  rationale: συμπάθεια 表示感同身受、怜爱或深厚情感；与 τέκνων 连用时，语境所指是母亲对儿女自然深切的亲情。译文不把它缩窄为单纯的“同情”。
- source_word: τέκνων
  choice: 儿女
  rationale: τέκνα 泛指子女。原文虽无显式物主代词，但母子关系由上下文明确；“对儿女的亲情”在汉语中自然传达这一关系。
- source_word: ὁμόψυχον
  choice: 同心
  rationale: 该词表示同有一种心志或内在倾向。“同心”简洁地保留母亲与亚伯拉罕在心志上的一致，不把它解释为血统关系。
- source_word: τῶν νεανιῶν μητέρα
  choice: 这些青年人的母亲
  rationale: νεανίαι 指青年男子；定冠词结合上下文指前述众子，因此用“这些青年人”清楚自然。
theological_decisions:
- issue: 母亲与亚伯拉罕之间比较的性质
  choice: 她与亚伯拉罕同有坚定的心志
  alternative: 她像亚伯拉罕；或她属于亚伯拉罕的后裔
  rationale: ὁμόψυχον 表达心志相同，重点是属灵和道德上的一致，而非族谱关系。译作“同心”保留这种强烈关联，却不进一步规定二者相似的全部内容。
- issue: 亲情是否被负面评价
  choice: 亲情本身真实存在，但没有使母亲偏离坚定立场
  alternative: 母亲缺乏对儿女的感情
  rationale: 否定词 οὐχί 修饰 μετεκίνησεν，即亲情“没有动摇”她，并非否认她有亲情。译文保留亲情与坚忍之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“亲情”比“同情”更贴合母子语境，“动摇”保留原文的位移隐喻。用分号拆开希腊文较紧密的修饰结构，使中文关系清晰，同时以脚注保存原文结构及可能的替代表达。
