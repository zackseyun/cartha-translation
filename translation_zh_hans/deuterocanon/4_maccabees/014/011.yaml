  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: zh_hans
  text: 你们不要以为，理性在那些男子遭受酷刑时占了上风[a]，有什么稀奇；因为就连一位妇人的心智，也藐视了更多样的痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “占了上风”，或译“胜过了那些男子”。
    reason: lexical_alternative
  - marker: b
    text: “更多样的痛苦”，或译“更多重的痛苦”或“形式更繁多的苦楚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμαστόν
  choice: 稀奇
  rationale: 表示令人惊异、值得诧异之事；“是件稀奇的事”自然对应 μὴ ... ἡγεῖσθε 的判断结构。
- source_word: ἡγεῖσθε
  choice: 以为
  rationale: 在以 θαυμαστόν 为表语的结构中，意为“认为、看作”。
- source_word: λογισμός
  choice: 理性
  rationale: 这是《马加比四书》的核心哲学用语，指能够支配情欲与苦痛的理性；译作“理性”既简洁，也保留全书术语的一致性。
- source_word: περιεκράτησεν
  choice: 完全制伏了
  rationale: 该复合动词表达彻底占上风或取得支配权；“完全制伏”保留其加强语气。
- source_word: βασάνοις
  choice: 酷刑
  rationale: 此处指殉道者遭受的外加折磨；“酷刑”比一般的“磨难”更切合上下文。
- source_word: ὅπου γε καί
  choice: 因为就连
  rationale: 该短语引出加强论证，含“既然连……都”的意味；此译在汉语中衔接自然。
- source_word: νοῦς
  choice: 心智
  rationale: 指思想、判断和意志的官能；“心智”与前句“理性”相关而不将二者完全等同。
- source_word: πολυτροπωτέρων
  choice: 更多样的
  rationale: 比较级主要表示种类或形式更繁多、更复杂，不宜无据地收窄为单纯程度上的“更剧烈”。
- source_word: ὑπερεφρόνησεν
  choice: 藐视了
  rationale: 该动词有视为低下、不屑一顾并凌驾其上的含义；“藐视”保留其强烈语气。
- source_word: ἀλγηδόνων
  choice: 痛苦
  rationale: 该名词指疼痛或苦楚；“痛苦”既可涵盖身体疼痛，也适合此处概括多种折磨。
theological_decisions:
- issue: 殉道语境中 λογισμός 的哲学含义
  choice: 理性
  alternative: 理性判断；敬虔的理性
  rationale: 本节明说的是 λογισμός；译作“理性”保留全书关于理性支配苦痛的主张，同时不把上下文中的“敬虔”限定直接加进本节。
- issue: γυναικός 与前文男性的性别对照
  choice: 一个妇人的心智
  alternative: 一个女人的心；妇人的心智
  rationale: 希腊文明确使用单数“妇人”，并与前文“那些男子”形成修辞对照；译文保留这一有意标出的对比。
- issue: πολυτροπωτέρων 表示多样性还是强烈程度
  choice: 更多样的
  alternative: 更剧烈的；更多重的
  rationale: πολύτροπος 的核心是多种方式、多样或多面；比较级虽可在语境中暗含更难承受，但原文并未直接使用表示强度的形容词，因此正文保留真实的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那些男子／一个妇人”保留原文修辞对照；“理性、心智”体现哲学论述的语域。“妇人”较“女人”略显庄重，但仍为现代读者熟悉。脚注标记均置于相关正文之后。
