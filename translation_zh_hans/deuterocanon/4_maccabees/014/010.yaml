  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
translation:
  language: zh_hans
  text: 还有什么能比这些更令人痛苦呢？因为火的威力猛烈而短暂，很快就毁坏了他们的身体。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏”也可译作“瓦解”或“分解”。希腊语动词可表示使某物解体或遭到毁坏。
    reason: 保留διέλυσε的词义范围，避免将其作用过度限定为“烧尽”。
lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: 还有什么能比这些更令人痛苦呢？
  rationale: 保留关系代词所回指的“这些”以及反问语气；ἐπαλγέστερον指更令人疼痛、痛苦，译文自然且不过度具体化。
- source_word: ὀξεῖα
  choice: 猛烈
  rationale: 原词本义为“尖锐、强烈”；形容火的作用时，“猛烈”比字面的“尖锐”更符合现代汉语，同时保留其强烈、凌厉之感。
- source_word: σύντομος
  choice: 短暂
  rationale: 原词表示时间短促；虽在语境中暗含迅速见效，但后文ταχέως已明确表达“很快”，故译作“短暂”以避免合并两者。
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: 火的威力
  rationale: 直接表达火所具有的作用力，措辞简洁庄重。
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: 很快就毁坏了他们的身体
  rationale: διέλυσε可指拆散、瓦解或毁坏；“毁坏”保留较宽泛的语义，不把火的具体作用限定为“烧尽”。上下文所指的人在汉语中自然以“他们的身体”表达。
