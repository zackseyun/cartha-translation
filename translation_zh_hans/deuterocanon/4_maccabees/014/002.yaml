lexical_decisions:
- source_word: βασιλέως
  choice: 王的
  rationale: 属格单数，修饰λογισμοί，按上下文取特指、领属义。
- source_word: λογισμοὶ
  choice: 思量
  rationale: 可指思想、推理或盘算；“思量”既保留内在思考和权衡之意，也适合本句较凝练庄重的语体。
- source_word: βασιλικώτεροι
  choice: 更有王者气度
  rationale: 保留比较级，并以“王—王者”重现βασιλέως与βασιλικώτεροι之间的修辞呼应；比生硬的“更王者”更符合现代汉语。
- source_word: ἐλευθερώτεροι
  choice: 更加自由
  rationale: 直接保留比较级及“自由、不受辖制”的开放语义，不擅自限定为政治自由、人格高贵或独立自主。
