  yaml_path: translation/deuterocanon/4_maccabees/014/031.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: zh_hans
  text: 然而，这位母亲逐一劝勉每个儿子[a]，也一并劝勉他们全体，要为敬虔而死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个一个地……也把他们全体一并……”
    reason: 保留καθʼ ἕνα与ὁμοῦ πάντας之间“逐个／整体”的对照及其可能语序。
  - marker: b
    text: 或译：“为虔敬而死。”这里的“敬虔”指对上帝的敬畏和忠诚；原文表明这死亡是为持守这种敬虔而承受的。
    reason: 说明εὐσέβεια的宗教内涵，并以自然汉语呈现其与“死亡”的关系，而不将属格关系定得过死。
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 然而……既……也……
  rationale: ἀλλά承接上文并带有轻微转折或推进语气，καί则加强补充意味；用“然而”配合“既……也……”自然呈现这一话语关系。
- source_word: καθʼ ἕνα παῖδα
  choice: 逐一劝勉每个儿子
  rationale: καθʼ ἕνα具有“逐个、一个一个地”的分配意义；παῖδα在本段明确指母亲的男性子女，因此译作“儿子”，而非泛称“孩子”。
- source_word: ὁμοῦ πάντας
  choice: 同时劝勉他们众人
  rationale: 保留与καθʼ ἕνα相对的整体性：母亲不但逐一劝勉，也把他们作为一个整体一同劝勉。“同时”在此表达共同、合在一起，不必限定为严格同一瞬间。
- source_word: ἡ μήτηρ
  choice: 这位母亲
  rationale: 希腊文为带冠词的“母亲”；现代汉语用“这位母亲”可自然指回叙事中已知的人物，又不额外强调所有关系。
- source_word: ἐπὶ ... προέτρεπεν
  choice: 劝勉……赴
  rationale: προτρέπω表示劝勉、催促，ἐπί加宾格表示所趋向的目标；“劝勉……赴死”兼顾动词力度和方向性。
- source_word: τὸν ... θάνατον
  choice: 赴死
  rationale: 希腊文直指“死亡”；中文“赴死”自然表达被劝勉走向死亡，且保留原文的庄严与严峻。
- source_word: τῆς εὐσεβείας
  choice: 为了敬虔
  rationale: εὐσέβεια在本书中指向对上帝的虔敬与忠诚；“敬虔”较“虔诚”更能涵盖敬畏、忠贞和宗教实践，但不引入后世教义术语。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的表达
  choice: 为了敬虔而赴死
  alternative: 赴敬虔之死；为了对上帝的虔敬而死
  rationale: τῆς εὐσεβείας可理解为限定“死”，也可表达死亡的缘由或所维护的价值。正文采用自然的目的或缘由表达“为了敬虔”，但以脚注保留较贴近形式的另一种理解，避免把属格关系解释得过死。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“逐一……也同时……”凸显原文分配与整体的对照；“赴死”比“走向死亡”更凝练有力，又不增添自杀或求死意味。所有脚注标记均置于正文相关处。
