  rationale: 修订明确了“为敬虔而死”是母亲劝勉儿子们接受的行动，避免中文中误读为母亲本人赴死；同时以“一并劝勉他们全体”准确、自然地对应原文由个别到整体的表达。脚注保留必要的词义说明，删除不自然的“赴敬虔之死”。
