base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/001.yaml
  text: Moreover[a], by urging them on to torture, they sought that they should not only despise the pains, but also master the emotions of brotherly affection for their brothers.
translation:
  language: zh_hans
  text: 此外，他们还催逼这些人接受酷刑，为要使他们不但藐视痛苦，也能克制因弟兄之爱而起的情感冲动[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情感冲动”也可译作“激情”或“情感”。希腊语 πάθη 可指情感、激情或内在冲动；这里指与弟兄之爱相关、需要加以克制的强烈情感反应，并非否定弟兄之爱本身。
    reason: 保留πάθη的词义幅度及其在《马加比四书》中受理性驾驭的哲学语境，同时避免将克制的对象误解为亲情本身。
lexical_decisions:
- source_word: προσέτι
  choice: 此外……还
  rationale: 承接上文并推进论述，保留“进一步、另外”的递进语气。
- source_word: ἐπὶ τὸν αἰκισμόν
  choice: 走向酷刑
  rationale: αἰκισμός指残酷虐待；殉道语境中译作“酷刑”较准确，“走向”保留介词短语所带的趋向意味。
- source_word: ἐποτρύνοντες
  choice: 催逼
  rationale: 表达强力促使、驱迫之意，也符合施刑者把受刑者推向酷刑的语境。
- source_word: ὡς μὴ μόνον ... ἀλλὰ καί
  choice: 为要使……不但……也……
  rationale: 将ὡς理解为目的或预期结果，中文自然地保留原文结构。
- source_word: τῶν ἀλγηδόνων
  choice: 痛苦
  rationale: 指酷刑造成的疼痛与苦楚；“痛苦”简洁而有分量。
- source_word: περιφρονῆσαι
  choice: 藐视
  rationale: 保留把某事看作不足介意、轻视它的强烈含义。
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: 对弟兄的手足之情
  rationale: “手足之情”自然表达φιλαδελφία，并以“对弟兄的”保留属格结构对实际兄弟的明确指向。
- source_word: παθῶν
  choice: 所激起的情感
  rationale: πάθη可指情感或激情；此处与手足亲情相连，用“情感”便于现代读者理解，同时脚注保留“激情”的可能。
- source_word: κρατῆσαι
  choice: 克制
  rationale: 在本书理性驾驭πάθη的框架中，表示控制、制伏；“克制”比“战胜”更自然，也不暗示亲情本身已被消灭。
theological_decisions:
- issue: πάθη在《马加比四书》哲学伦理框架中的译法
  choice: 情感
  alternative: 激情
  rationale: “情感”是现代汉语中较自然且宽泛的表达；“激情”更能显出受理性驾驭的强烈冲动，但可能使读者误解为热烈冲劲，因此置于脚注。
- issue: 克制对象与亲情本身的关系
  choice: 克制手足之情所激起的情感
  alternative: 克制对弟兄的手足之情
  rationale: 原文语法上κρατῆσαι支配παθῶν，而φιλαδελφίας限定这些πάθη；译文保留“情感”为直接受词，避免把经文说成否定或消灭弟兄之爱本身。
- issue: ὡς从句的语义关系
  choice: 目的：为要使
  alternative: 结果：以致
  rationale: ὡς在此可表达意图或设想的结果；上下文中的催逼行为较自然地指向目的，但不扩充施刑者未明说的动机。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“此外……还”保留论述递进；“手足之情”避免生硬重复“弟兄之爱”，同时“对弟兄的”明确实际亲属关系。句法尽量贴近希腊文，又将多层属格转换为自然汉语。
