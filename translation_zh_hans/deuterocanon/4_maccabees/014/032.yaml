base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: zh_hans
  text: 神圣的天性啊！父母的疼爱啊！儿女对父母的爱啊！养育啊[a]！母亲那不可征服的强烈情感啊[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抚育”或“养育之事”。希腊词指养育、哺育或抚育，不必限于受养者对养育的感恩或报答。
    reason: lexical_alternative
  - marker: b
    text: “强烈情感”也可译作“激情”。此希腊词在某些语境可指“苦楚”或“遭遇”，但此处更可能指母亲强烈而不可征服的情感。
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: 神圣的天性
  rationale: φύσις 可指天性或自然秩序；本节以呼语感叹亲属之爱，“天性”既保留宽泛含义，也不擅自把它限定为某一种亲情纽带。ἱερά 译作“神圣的”，保持庄重语气。
- source_word: φίλτρα γονέων
  choice: 父母的疼爱
  rationale: φίλτρα 字面可指爱情魔药或魅力，文学语境中也可指爱意、亲爱纽带。此处谈家庭亲情，译作“疼爱”自然地表达父母深切的爱，避免“魔药”造成误解。
- source_word: γονεύσιν φιλοστόργε
  choice: 对父母的眷爱
  rationale: γονεύσιν 是“父母”的与格，表示感情所指向的对象；φιλοστόργε 表达亲属间温柔深厚的爱。希腊文在形式上仍可与前面的“天性”呼应，中文则名词化为“对父母的眷爱”，使这组呼语自然清楚，同时保留由儿女指向父母的亲情。
- source_word: τροφεῖα
  choice: 养育之恩
  rationale: τροφεῖα 可涉及养育、养育所带来的恩惠，或对养育的回报。“养育之恩”在中文中兼顾养育事实与受养者对其所负的感念，也符合本节亲子关系的语境；其词义范围在脚注中说明。
- source_word: μητέρων ἀδάμαστα πάθη
  choice: 母亲那不可压服的情感
  rationale: πάθη 可指强烈情感，也可指苦楚；在此处列举亲情力量的语境中，“情感”较为贴切。ἀδάμαστα 本义为不可驯服、不可征服，“不可压服”保留其强烈修辞而较符合现代汉语。
theological_decisions:
- issue: 如何表达强烈的家庭情感而不引入后期教义判断
  choice: 把本节译为对天性、亲子之爱、养育之恩及母爱情感的修辞性呼唤
  alternative: 把 πάθη 专门解释为母亲的“苦难”，或把 φύσις 限定为某种神学化的“自然法”
  rationale: 本节主要强调自然亲情的神圣与强大，并非建立一项后期教义。正文采用语境较自然的“情感”，同时以脚注保留“苦楚”的可能，避免消除原词张力。
translation_notes:
  register: 采用现代、庄重而可朗读的呼语排比，以连续的“啊”再现原文强烈的感叹。将希腊文较紧密的形容词结构适度名词化，使普通中文读者易懂；不把亲情术语道德化或教义化。
