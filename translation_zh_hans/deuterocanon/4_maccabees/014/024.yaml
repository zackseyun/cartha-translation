base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: zh_hans
  text: 我该怎样描绘父母疼爱儿女的炽热之情呢？这份热情把心灵与形貌的奇妙相似，铭印在孩子小小的形体上[a]；这尤其是因为，父亲使母亲对所生的儿女更能体恤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子小小的形体”所译的希腊语复合词十分罕见，也可理解为“孩子小小的特征”或“孩子的小小印记”。本句使用了盖印、压印的意象。
    reason: 保留罕见复合词的歧义，以及与“铭印”相连的印章意象。
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: 我该怎样描绘
  rationale: 以自然的汉语反问保留说话者难以充分表达的语气；罕见动词ἠθολογέω在此取“描绘、刻画”之意。
- source_word: φιλοτέκνα γονέων αἴθη
  choice: 父母疼爱儿女的炽热之情
  rationale: φιλοτέκνα明确指向爱儿女，αἴθη带有热度、炽烈感；译文同时保留亲情和热烈的意象。
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: 心灵与外貌的奇妙相似之处
  rationale: ψυχή保留内在生命或性情的宽泛含义，μορφή表达外在形貌，不把二者简化为单一的遗传特征。
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: 在孩子幼小的形象上
  rationale: 罕见复合词παιδοχαρακτήρ兼有孩童的形象、刻痕或印记之感；正文采用可读的“幼小的形象”，并由动词“铭印”承载印章意象。
- source_word: ἐναποσφραγίζοντα
  choice: 铭印
  rationale: 保留封印、压印的鲜明比喻，也符合庄重的修辞语体。
- source_word: τὰς μητέρας καθιστᾶναι συμπαθεστέρας
  choice: 使母亲……更富怜爱之情
  rationale: συμπαθής可表示感同身受、富有同情或深切关爱；“更富怜爱之情”贴合亲子语境，同时不将其限定为现代心理学意义的“共情”。
- source_word: τοῖς γεννηθεῖσιν
  choice: 对所生的儿女
  rationale: 直译完成时被动分词“所生的”，并依上下文明确其所指为儿女。
