  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
translation:
  language: zh_hans
  text: 因为母亲越是心灵软弱、所生养的儿女越多，就越疼爱自己的儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: 越是……越……就越……
  rationale: 用现代汉语的关联比较结构表达希腊语的程度对应关系，同时让两个前项共同引出结果。
- source_word: ἀσθενέψυχοι
  choice: 心灵柔弱
  rationale: 保留“心灵／魂软弱”的构词意象；“柔弱”比“怯懦”更少引入胆怯之意，也符合此处母亲内在易受触动的语境。
- source_word: πολυγονώτεραι
  choice: 生养的儿女越多
  rationale: 该比较级指较多生育；如此表达比“更多产”更自然、庄重，也明确其与儿女的关系。
- source_word: ὑπάρχουσιν
  choice: 是
  rationale: 此处作系词使用，含义已自然融入“越是”结构，无须另译为“存在”或“恰好是”。
- source_word: μητέρες
  choice: 母亲
  rationale: 直接对应复数名词；汉语类称名词无需显式复数标记。
- source_word: μᾶλλον
  choice: 更／越
  rationale: 在关联比较结构中以“越……越……”自然体现程度递增。
- source_word: φιλοτεκνότεραι
  choice: 越疼爱自己的儿女
  rationale: 该比较级字面为“更爱儿女的”。“疼爱”自然传达母亲对儿女深厚而亲切的爱，并保留比较程度；“自己的”明确该词所指的是她们所生养的儿女。
