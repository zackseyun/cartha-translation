  text: For even among birds[a], some, making their nests on houses, protect their young.
translation:
  language: zh_hans
  text: 因为即使在鸟类中，有些[a]在房屋上筑巢，也会保护自己的雏鸟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些驯养的鸟在房顶筑巢，也保护自己的雏鸟。”
    reason: 原文ἥμερα可明确指“驯养的”；结合与房屋相关的筑巢表达，也可较具体地理解为“在房顶筑巢”。
lexical_decisions:
- source_word: πετεινῶν
  choice: 鸟类
  rationale: 该词泛指鸟或有翼的生物；“鸟类”在现代汉语中自然准确，也适合此处概括性的比较。
- source_word: ἥμερα
  choice: 有些
  rationale: 原词本义为“驯服的、家养的”，在句中指鸟类中的一部分。正文用“有些”保持汉语流畅，并以脚注保留“驯养的”这一较为直译的可能。
- source_word: κατὰ τὰς οἰκίας
  choice: 在房屋上
  rationale: κατά在此表示与房屋相关的位置；结合ὀροφοποιοῦντα，译作“在房屋上”既避免无根据地限定为屋檐下，也保留原文位置表达的一定宽泛性。
- source_word: ὀροφοποιοῦντα
  choice: 筑巢
  rationale: 该复合词与屋顶或搭建遮盖物有关；用于鸟类时，语境所指是筑巢。汉语译作“筑巢”简洁自然，具体地点由“在房屋上”表达。
- source_word: προασπίζει
  choice: 保护
  rationale: 该动词有在前遮护、捍卫之意；“保护”准确表达亲鸟护雏的行为，同时不把一般性的防护过度强化为战斗。
- source_word: νεοττῶν
  choice: 自己的雏鸟
  rationale: 该词指幼鸟或巢中的雏鸟。“雏鸟”比泛称“幼崽”更准确；补出“自己的”符合汉语领属表达，所指由上下文明确。
