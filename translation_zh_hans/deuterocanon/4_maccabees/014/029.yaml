base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: zh_hans
  text: 因为他们为人正直、自制、勇敢、心志高尚，爱护弟兄；他们又如此敬爱母亲，以至于即使至死，也仍听从她，谨守律例。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例”也可译作“祖传的律法”或“规条”。希腊原文为复数，指他们决意遵守的各项合法要求。
    reason: 说明τὰ νόμιμα的复数形式及其在犹太殉道语境中的可能含义。
lexical_decisions:
- source_word: δίκαιοί
  choice: 为人正直
  rationale: 在德行列举中表示品行端正、公义；“为人正直”符合现代汉语表达，也保留其伦理意味。
- source_word: σώφρονες
  choice: 能够自制
  rationale: 此词在德行语境中强调节制与自我约束；译为“能够自制”清楚自然，并契合本书以理性约束情欲的主题。
- source_word: ἀνδρεῖοι
  choice: 勇敢
  rationale: 表示面对危险与苦难时的勇气；“勇敢”准确而不额外引入性别意味。
- source_word: μεγαλόψυχοι
  choice: 心志高尚
  rationale: 字面含“心灵伟大”之意，在此指高尚、宽宏而刚毅的品格；“心志高尚”既庄重又易懂。
- source_word: φιλάδελφοι
  choice: 彼此友爱
  rationale: 原词指爱弟兄；本节所说的是同为兄弟的众人，因此“彼此友爱”自然表达他们弟兄之间的亲爱，且未将范围泛化。
- source_word: φιλόμητρος
  choice: 敬爱母亲
  rationale: 兼具爱母亲与忠于母亲的意味；“敬爱”适合子女对母亲的关系，并为下文听从她作铺垫。
- source_word: οὕτως, ὥστε
  choice: 如此……以至于
  rationale: 保留原文表示程度及其结果的关联结构。
- source_word: μέχρι θανάτου
  choice: 至死
  rationale: 简洁地表达坚持到死亡这一极限，保留殉道语境中的强烈程度。
- source_word: τὰ νόμιμα
  choice: 律例
  rationale: 原文为复数，指他们在逼迫中坚持遵行的合法或祖传宗教规条；“律例”保留复数集合意义，又不把它压缩成抽象的单数“律法”。
- source_word: φυλάσσοντας
  choice: 遵守
  rationale: 在法律与宗教语境中表示谨守、实行规条；“遵守律例”是自然的现代汉语搭配。
- source_word: πείθεσθαι αὐτῇ
  choice: 听从她
  rationale: πείθομαι加与格可表示服从某人；“听从她”既保留顺服之意，也比强硬的“服从”更符合母子关系。
theological_decisions:
- issue: 犹太殉道语境中τὰ νόμιμα的表达
  choice: 律例
  alternative: 律法；祖传的律例；规条
  rationale: 复数中性名词指应当遵守的宗教法律要求或祖传法度。“律例”保留其复数和具体规条的意味，同时不在正文中擅自加入“祖传的”；该可能含义在脚注交代。
- issue: φιλάδελφοι所指的亲属关系
  choice: 彼此友爱
  alternative: 爱弟兄；友爱手足
  rationale: 上下文中的主体是一群亲兄弟，“彼此友爱”准确呈现他们相互之间的弟兄之爱，避免将其误解为一般社群称谓，也保持汉语流畅。
- issue: 母亲的吩咐与遵守律例之间的句法关系
  choice: 听从她，至死遵守律例
  alternative: 借着遵守律例来听从她；虽然至死遵守律例，仍听从她
  rationale: 原文分词φυλάσσοντας修饰πείθεσθαι隐含的主语，说明他们在听从母亲时持续遵守律例，但未用明确的工具性介词。正文并列呈现两者，避免过度判定“遵守律例”究竟是方式还是伴随情形。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。前半句用简洁的德行排比，后半句保留“如此……以至于”的程度—结果结构。脚注标记置于“律例”之后，与其所解释的词语准确对应。
