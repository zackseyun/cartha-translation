  yaml_path: translation/deuterocanon/4_maccabees/014/018.yaml
  text: And why is it necessary to point out[a], by means of the irrational animals[b], the affection for their children?
translation:
  language: zh_hans
  text: 又何必借无理性的动物[a]来说明对子女的爱护之情[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“通过无理性动物”“借禽兽”。希腊语强调这些动物不具理性，与人的理性形成对照。
    reason: lexical_alternative
  - marker: b
    text: 或译：“对后代的天然亲情”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δεῖ
  choice: 何必
  rationale: 这是反问必要性的惯用表达；“何必”自然传达“有什么必要”的语气，也暗示无需再作此举。
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: 借无理性的动物
  rationale: διά加属格在此表示借助或通过某种例证；“无理性的动物”保留ἀλόγων与人类理性之间的哲学性对照。
- source_word: ἐπιδεικνύναι
  choice: 说明
  rationale: 该动词在此指借实例显示、证明某一点；“说明”符合本句反问语境，现代汉语也较自然。
- source_word: συμπάθειαν
  choice: 怜爱
  rationale: 此处不是现代意义上对不幸者的“同情”，而是父母对子女的亲爱、疼惜之情；“怜爱”兼具感情与关怀意味。
- source_word: πρὸς τὰ τέκνα
  choice: 对子女的
  rationale: πρός表示感情所指向的对象；τέκνα可指孩子或后代。“对子女的”既贴近原文，也适用于人和动物的后代。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又何必……呢”保留原文承接上文的καί及反问语气；避免使用过于学术化的“非理性动物”，同时以“无理性的动物”保留原文的思想对照。
