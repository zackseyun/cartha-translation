  yaml_path: translation/deuterocanon/4_maccabees/014/009.yaml
  text: Now we[a], hearing of the affliction of those young men, shudder; but they, not only seeing it, and not only hearing the immediate word of threat, but also suffering it,
translation:
  language: zh_hans
  text: 如今，我们听到那些青年男子所受的苦难，尚且不寒而栗；他们却不但亲眼目睹这一切，又不但听到当场发出的威吓之言[a]，而且还亲身承受，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听到立即发出的威吓之言。”希腊语强调这威吓是在当时、当场发出的。
    reason: 说明 παραχρῆμα 可译为“当场”或“立即”，并明确其修饰威吓之言的即时发出。
lexical_decisions:
- source_word: θλῖψιν
  choice: 苦难
  rationale: 指那些青年经受的严酷磨难；“苦难”自然庄重，并涵盖身体与精神上的痛苦。
- source_word: νεανιῶν
  choice: 青年
  rationale: 保留原文所指男性年轻人的年龄特征；汉语“青年”在上下文中简洁自然。
- source_word: φρίττομεν
  choice: 不寒而栗
  rationale: 传达因恐惧和骇然而产生的强烈身体反应，比单说“害怕”更贴近原词力度。
- source_word: ὁρῶντες
  choice: 亲眼看见
  rationale: 与后面的“听见”形成感官上的对照；“亲眼”也凸显他们身临其境。
- source_word: παραχρῆμα
  choice: 当场
  rationale: 表达威吓就在现场、即时发出，保留该词的时间临近性。
- source_word: ἀπειλῆς λόγον
  choice: 威吓的话
  rationale: 保留 λόγον 的言语含义及 ἀπειλῆς 的威胁意味，同时符合现代汉语表达。
- source_word: πάσχοντες
  choice: 亲身承受
  rationale: 构成递进高潮：他们不仅看见、听见，也实际遭受这一切；“亲身”强调直接经历。
