  source_fidelity: 译文总体准确保留了“我们只是听说便战栗”与青年人亲见、亲闻、亲受的递进对照，也保留了原文在分词处未完结的句法。惟“当场听见”在汉语中主要限定听见的地点或方式，未能清楚表达 παραχρῆμα 所强调的威吓之言即时、当下发出。另“青年”本身不明确男性，原文 νεανιῶν 在此指青年男子，宜在不失自然的前提下明示。
  naturalness: “不但……不但……而且……”可对应原文重复的“不仅”，但第二个分句略显突兀；改为“不但……，又不但……，而且……”较顺畅，同时保持原文刻意递进。以“亲眼目睹这一切”补足汉语所需的宾语，且不增加实质内容。
