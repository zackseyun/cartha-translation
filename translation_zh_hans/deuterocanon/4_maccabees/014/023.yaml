  yaml_path: translation/deuterocanon/4_maccabees/014/023.yaml
  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: zh_hans
  text: 他更爱虔敬[a]，就是那使人得永生、合乎上帝旨意的虔敬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬”也可译作“敬虔”或“虔诚”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“照着上帝”。这可指这种虔敬合乎上帝的旨意或标准；也可能是说，它使人得永生是照着上帝的旨意，或按上帝的判断。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: 虔敬
  rationale: 在希腊化犹太语境中，该词指向上帝的敬畏与敬虔，并体现于忠信行为；“虔敬”兼顾宗教与伦理含义，也比“虔诚”更保留抽象德性的色彩。
- source_word: μᾶλλον
  choice: 更
  rationale: 表达比较性的偏爱或更强的爱；“更爱”自然保留了比较意味，而不另行补出希腊文未明说的比较对象。
- source_word: ἠγάπησεν
  choice: 他更爱
  rationale: ἀγαπάω的基本义为“爱”；比较意味由μᾶλλον承载。依照所提供的审校层保留阳性代词“他”，不过希腊语动词本身并不标示主语性别。
- source_word: τὴν σώζουσαν
  choice: 就是那使人……的虔敬
  rationale: 带冠词的现在分词修饰εὐσέβειαν；重复“虔敬”可在中文中清楚呈现其同位、限定关系。“使人”是中文表达所需的泛指宾语。
- source_word: εἰς αἰώνιον ζωὴν
  choice: 使人进入永生
  rationale: εἰς表示趋向、目标或结果；“进入永生”既保留方向性，也比“直到永生”更符合现代汉语。
- source_word: κατὰ θεόν
  choice: 合乎上帝
  rationale: κατά加宾格可指依照上帝的标准、旨意或判断。“合乎上帝”保持短语的压缩性，避免在正文中限定为某一种解释。
theological_decisions:
- issue: κατὰ θεόν与“虔敬”或“使人进入永生”的关系及具体含义
  choice: 正文译作“合乎上帝”，并置于整个限定语末端，使其确切修饰范围保持一定开放性。
  alternative: “合乎上帝的旨意”、“在上帝看来”或“按照上帝的判断”
  rationale: 希腊语短语较为凝练，既可能说明这种虔敬合乎上帝，也可能说明其救至永生的功效是按上帝的旨意或判断。直译式表达并以脚注说明，可避免加入原文未明确指定的教义解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留“更爱”而不补出比较对象；用同位结构重现希腊文冠词分词对“虔敬”的限定。所有脚注标记均置于正文对应词句之后。
