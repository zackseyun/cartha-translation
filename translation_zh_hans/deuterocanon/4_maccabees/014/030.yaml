base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: zh_hans
  text: 但即使如此，尽管有如此多与爱子之情有关的因素牵引这位母亲，使她心生同情[a]，各式各样的酷刑仍不能因这些因素中的任何一种而改变她的理性[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与爱子之情有关的因素”指母亲对子女的疼爱所带来的种种内在牵引；原文描写这些牵引正把她引向同情或共感。
    reason: lexical_alternative
  - marker: b
    text: “理性”也可译作“理性判断”或按语境译作“决心”。本书常用这个词论述理性对情感的统御。原文“这些中的任何一个”的代词指代未完全明定；可理解为前述与爱子之情有关的种种因素，语境中也有人理解为她的儿子。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: 但即使如此
  rationale: 保留转折与强烈让步语气，也符合现代汉语的自然表达。
- source_word: καίπερ
  choice: 尽管
  rationale: 准确表达让步关系，并与主句“都不能”清楚衔接。
- source_word: τῶν περὶ φιλοτεκνίαν
  choice: 爱子之情的种种牵引
  rationale: φιλοτεκνία指父母对子女的疼爱；结合ἑλκόντων的牵引意象，将相关因素自然地表达为内心的多重牵引。
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: 使这位母亲心生同情
  rationale: 保留被牵引至同情、共感的动态含义；“心生同情”在此比抽象的“趋向同感”自然。
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: 在他们任何一人受刑时
  rationale: 按上下文将αὐτῶν理解为她的众子，ἐπί加属格表示“就任何一人的情况而言”；译文补出“受刑”以说明与主语“酷刑”的关系。此处语法上也可能回指前述种种牵引，故以脚注意义说明。
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: 各式各样的酷刑
  rationale: παντοίκιλοι强调种类繁多，βάσανοι在上下文中指实际施加的酷刑。
- source_word: τὸν λογισμὸν αὐτῆς
  choice: 她的理性
  rationale: λογισμός是本书贯穿始终的核心词，指理性的判断和支配作用；“理性”最能保持其哲学主题。
- source_word: ἴσχυσαν μετατρέψαι
  choice: 都不能使……转变
  rationale: 表达酷刑未能产生改变或扭转的结果，同时不把改变的具体方向解释得过窄。
theological_decisions:
- issue: 哲学语境中的λογισμός
  choice: 她的理性
  alternative: 她的决心；她的理性判断
  rationale: 本书反复论述理性对情感的统御；译作“理性”可维持全书的概念连贯性，而不把它收窄为单纯的意志或决心。
- issue: ἐπʼ οὐδενὸς αὐτῶν的指代
  choice: 在他们任何一人受刑时
  alternative: 这些牵引没有一种能借着酷刑使她的理性转变
  rationale: 上下文围绕母亲目睹众子受刑，阳性复数αὐτῶν可自然指向众子；但句法上的回指并非毫无歧义，因此不把另一理解静默排除，而在脚注中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“爱子之情”“心生同情”兼顾叙事温度与哲学论述；“理性”则维持《马加比四书》的核心术语一致性。所有脚注标记均置于所解释的词语之后。
