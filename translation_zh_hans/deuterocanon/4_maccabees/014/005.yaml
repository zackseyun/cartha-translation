base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/005.yaml
  text: But all of them[a], as though running on a road to immortality, were hurrying toward death through tortures[b],
translation:
  language: zh_hans
  text: 然而，他们都仿佛正奔跑在通往不朽的道路上，急忙奔向那经由酷刑而至的死亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经由酷刑而至的死亡”也可译作“借着酷刑而死”或“经受酷刑而死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文形成强烈转折；“然而”庄重自然，保留逆接语气。
- source_word: πάντες
  choice: 他们所有人都
  rationale: 明确表达全体性，并按上下文补出所指群体。
- source_word: ὥσπερ
  choice: 仿佛
  rationale: 引出比喻而非断言，现代汉语简洁自然。
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: 在通往不朽的道路上
  rationale: 保留“道路”的旅程意象；此处介词短语与“奔跑”结合，理解为沿着一条以不朽为终点的道路。
- source_word: τρέχοντες
  choice: 奔跑
  rationale: 直接保留动作及道路意象，也传达积极迅速前进的意味。
- source_word: ἐπὶ τὸν ... θάνατον
  choice: 奔向……死亡
  rationale: ἐπί加宾格表示趋向；“奔向”延续本句的运动意象。
- source_word: διὰ τῶν βασάνων
  choice: 经过酷刑而来的
  rationale: διά加属格可表示经过、借由；该表达既保留酷刑是通往死亡的过程，也避免生硬的“经过酷刑的死亡”。
- source_word: ἔσπευδον
  choice: 急切奔向
  rationale: 表达未完成时所描绘的持续趋赴，并保留动词所含的急切与迅速。
theological_decisions:
- issue: 殉道语境中ἀθανασία的含义
  choice: 不朽
  alternative: 永生
  rationale: ἀθανασία直接指不死、不朽；译作“不朽”可保留原词的哲学与神学张力，不将其解释性地等同于“永生”。
- issue: διὰ τῶν βασάνων与θάνατον的关系
  choice: 那经过酷刑而来的死亡
  alternative: 在酷刑中死亡／借着酷刑而死
  rationale: 希腊语容许把酷刑理解为通往死亡的路径或造成死亡的手段；正文保留两者之间的张力，不把关系限定为单纯的处境或工具。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文“道路—奔跑—奔向”的连续意象，并以“不朽”直译关键神学词。
