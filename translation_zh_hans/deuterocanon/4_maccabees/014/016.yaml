  yaml_path: translation/deuterocanon/4_maccabees/014/016.yaml
  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: zh_hans
  text: 但它在山峰上、峡谷的裂隙中、树洞里，以及这些地方的高处[a]筑巢、产仔，并阻挡靠近的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及它们的顶端（或边缘）。”原文所指可能是前述地点的高处、外缘或末端。
    reason: 保留τὰς τούτων ἄκρας的词义及指涉歧义。
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: 但它在山峰上
  rationale: κατά加宾格在此表示所在范围；“在山峰上”自然保留高处筑巢的图景。补出“它”以符合现代汉语句法，其所指承接上下文。
- source_word: φαράγγων ἀπορρῶγας
  choice: 峡谷的裂隙中
  rationale: ἀπορρώξ指裂口、断裂处或岩隙；“裂隙”既贴近词义，也保留崎岖地貌。
- source_word: δένδρων ὀπὰς
  choice: 树洞里
  rationale: ὀπή指孔洞或开口；在筑巢语境中，“树洞”最自然明确。
- source_word: τὰς τούτων ἄκρας
  choice: 这些地方的高处
  rationale: ἄκρα可指顶端、末端或极处；τούτων的具体指涉略有含混，因此不限定为单指树梢，而以“这些地方的高处”保留概括性。
- source_word: νοσσοποιούμενα
  choice: 筑巢
  rationale: 该分词表示营巢、做窝；“筑巢”简洁而准确，不把随后ἀποτίκτει所表达的生产意义重复加入。
- source_word: ἀποτίκτει
  choice: 生产
  rationale: 该动词意为产下幼子；“生产”适合动物语境，也保留原文动作的直接性。
- source_word: τὸν προσιόντα
  choice: 靠近的人
  rationale: 单数分词带通称意义；“靠近的人”既保留单数形式，也可自然泛指任何接近者。
- source_word: κωλύει
  choice: 阻挡
  rationale: κωλύω表示阻止、妨碍；原文未明说“赶走”或“使远离”，故采用较形式对应的“阻挡”。
