  yaml_path: translation/deuterocanon/4_maccabees/014/017.yaml
  text: But even if they could not prevent it[a], flying around them on every side, grieving in their affection, and calling to them in their own voice, they would help their children in whatever way they could.
translation:
  language: zh_hans
  text: 但即使它们无法阻止，也会在幼雏四周飞绕[a]，因亲情而痛苦，用自己的叫声呼唤幼雏，并尽自己所能帮助幼雏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里带有鸟类的形象：鸟儿在幼雏四周飞绕，并以自己的叫声呼唤它们。
    reason: cultural_note
lexical_decisions:
- source_word: κωλύειν
  choice: 阻止
  rationale: 表达制止或防止将临之事，保留希腊文未明说宾语的特点。
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: 从四面飞绕着孩子
  rationale: 直承鸟类在幼雏周围飞翔的意象；“从四面”体现 κυκλόθεν 的环绕和包围意味。
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: 因亲情而痛苦
  rationale: στοργή 指自然的亲属之爱，在本段语境中特别是母亲对子女的疼爱；译作“亲情”避免把名词本身过度限定为“母爱”。
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: 用自己的声音呼唤他们
  rationale: 保留呼喊、召唤的意思以及鸟类以自身鸣声呼唤幼雏的形象，不强行判定是否含“叫回来”之意。
- source_word: καθʼ ὃν δύναται τρόπον
  choice: 尽自己所能
  rationale: 自然表达按其能力、以任何可行方式施助的意思。
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: 帮助孩子
  rationale: 简明呈现“援助子女/幼雏”；结合上下文，中文“孩子”可承接人类母亲与鸟母护雏的类比。
theological_decisions:
- issue: 用于人类母亲的母鸟护雏意象
  choice: 明确保留“飞绕”和“用自己的声音呼唤”的鸟类形象
  alternative: 弱化为“围绕着孩子”或抽象表述母亲的关切
  rationale: 希腊文 περιιπτάμενα 明确表示飞绕；保留这一具象修辞能呈现母亲保护子女的强烈本能，不加入宗派性解释。
- issue: στοργή 是否直接译为“母爱”
  choice: 译为“亲情”
  alternative: 译为“母爱”或“慈爱”
  rationale: 母性含义来自上下文，而 στοργή 本身较广，指自然的家庭亲爱；“亲情”既贴近词义，也保留语境所赋予的母爱色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但即使无法阻止”保留原文宾语省略所形成的语境依赖；后半句用连贯的动作链呈现焦急护子的场景。
