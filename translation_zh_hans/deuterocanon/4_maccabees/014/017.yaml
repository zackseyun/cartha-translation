revisions:
- from: 但即使无法阻止，她们也会从四面飞绕着孩子[a]，因亲情而痛苦，用自己的声音呼唤他们，尽自己所能帮助孩子。
  to: 但即使它们无法阻止，也会在幼雏四周飞绕[a]，因亲情而痛苦，用自己的叫声呼唤幼雏，并尽自己所能帮助幼雏。
  rationale: The revision preserves the Greek sequence and ambiguity while making the active avian image and its referents clear in idiomatic Modern Standard Mandarin. It retains 「亲情」 for the broad natural-affection sense of στοργή and does not overstate the image as explicitly maternal in the translation itself.
