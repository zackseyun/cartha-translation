base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: zh_hans
  text: 正如手和脚协调地遵从心灵的指引而动，那些圣洁的青年也照样，仿佛受那不朽的灵魂——敬虔——所推动，认同那为敬虔而受的死亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “协调地”和“认同”所译的希腊词来自同一词根；原文借此把肢体协调地遵从心灵而动，与青年认同为敬虔而受的死亡相呼应。
    reason: wordplay
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  choice: 怎样……也照样
  rationale: 保留希腊文前后呼应的明喻结构，现代汉语表达自然。
- source_word: συμφώνως ... συνεφώνησαν
  choice: 协调一致……同心一致
  rationale: 用重复的“一致”再现同源词形成的呼应，同时分别贴合肢体动作和青年共同赴死的语境。
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: 心灵的指引
  rationale: ἀφήγημα在此指主导、指引；“指引”既表达心灵对肢体的支配，又不把语气强化为严厉命令。
- source_word: οἱ ἱεροὶ μειρᾶκες ἐκεῖνοι
  choice: 那些圣洁的青年
  rationale: 准确表达ἱεροί的神圣、分别为圣色彩及μειρᾶκες所指的青年男子。
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: 仿佛受敬虔这不朽的灵魂所推动
  rationale: 保留ὡς的比拟性质和“敬虔之不朽灵魂”的拟人意象；补出“所推动”使它与前半句心灵推动肢体的比喻关系在汉语中清楚。
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  choice: 为了敬虔而与死亡同心一致
  rationale: 明确αὐτῆς回指敬虔，并保留πρός与συμφωνέω构成的“与死亡相合”这一大胆表达，而不弱化为单纯接受死亡。
theological_decisions:
- issue: εὐσέβεια的拟人化及“不朽的灵魂”意象
  choice: 保留“敬虔这不朽的灵魂”的拟人比喻，并以“仿佛”标明修辞性质
  alternative: 将其解释为青年实际拥有一个由敬虔构成的不朽灵魂，或改写成“敬虔的不朽精神”
  rationale: 希腊文把敬虔比作驱动肢体的灵魂，重点在青年行动的一致与敬虔的支配作用，不宜将其系统化为灵魂论，也不应以“精神”消解原文的ψυχή意象。
- issue: 青年与死亡“同心一致”的表述
  choice: 保留他们为了敬虔而“与死亡同心一致”
  alternative: 译为“甘愿赴死”或“接受死亡”
  rationale: 较直白的替代说法虽自然，却会抹去συμφώνως与συνεφώνησαν的同源呼应以及原文刻意形成的张力。
translation_notes:
  register: 采用庄重而可读的现代标准普通话。“心灵”承接ψυχή在身体比喻中的主导者意象；“敬虔”适合本书εὐσέβεια这一核心德目。脚注标记置于全句末，说明正文中刻意保留的同源词呼应。
