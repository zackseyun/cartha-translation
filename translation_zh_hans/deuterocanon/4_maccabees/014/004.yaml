  text: None of the seven young men became cowardly[a], nor did they shrink back from death;
translation:
  language: zh_hans
  text: 七个青年中，没有一个胆怯，也没有一个面对死亡而退缩；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  choice: 七个青年中，没有一个
  rationale: οὐδεὶς 与 ἐκ 构成从七人中逐一排除的表达；“没有一个”保留其强调和分配意义。μειράκια 指年轻男子，译作“青年”自然庄重，也不带“男孩”的稚幼意味。
- source_word: ἐδειλίασεν
  choice: 胆怯
  rationale: δειλιάω 不仅表示害怕，也含丧胆、表现怯懦之意；“胆怯”简洁保留其道德色彩，同时避免译得过重。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 承接前一否定分句，并在汉语中自然表达并列加强的否定。
- source_word: πρὸς τὸν θάνατον
  choice: 面对死亡
  rationale: 此处表示人在死亡当前的反应；“面对死亡”比机械直译“向着死亡”更符合现代汉语，又保留与死亡相对而立的语境。
- source_word: ὤκνησεν
  choice: 退缩
  rationale: ὀκνέω 可指迟疑、畏缩或退却；殉道语境中“退缩”准确表达因死亡而踌躇后退的意思。
theological_decisions:
- issue: οὐδεὶς 后两个单数动词的分配意义
  choice: 两分句都用“没有一个”理解，并在第二分句中再次明示
  alternative: 第二分句按群体复数意译为“他们也没有面对死亡而退缩”
  rationale: 希腊文的 οὐδεὶς 是单数主语，ἐδειλίασεν 和 ὤκνησεν 也均为单数；重复“没有一个”既合乎汉语，也清楚呈现七人中人人如此的分配意义，不把重点改成笼统的群体陈述。
translation_notes:
  register: 采用现代、庄重而明白的叙事语言。“青年”明确人物为年轻男子；以“胆怯／退缩”构成紧凑平行，保留原文的两重否定和殉道语境中的力度。句末分号依照该节与后文相连的形态保留。
