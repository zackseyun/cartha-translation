  yaml_path: translation/deuterocanon/4_maccabees/014/022.yaml
  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
translation:
  language: zh_hans
  text: 一位母亲，面前摆着两件事——敬虔[a]，以及按暴君的承诺她七个儿子可得的暂时保命[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔敬”；这里主要指对上帝的敬畏与忠诚。
    reason: lexical_alternative
  - marker: b
    text: 或译“暂时获救”。原文指按照暴君的承诺，眼前得以免死，并不必然指更完整意义上的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: 一位母亲
  rationale: 原文为无冠词名词，在此承接上下文；现代汉语用“一位母亲”自然表达其身份，不凭希腊文强加特指。
- source_word: δυεῖν προκειμένων
  choice: 面对两样选择
  rationale: 原意是有两件事摆在她面前。“面对两样选择”保留抉择情境，同时比逐字译作“有两件事摆在面前”更符合现代汉语。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 该词在《马加比四书》中指向对上帝的虔敬与忠诚；“敬虔”简洁庄重，也保留其伦理和神学分量。
- source_word: σωτηρίας προσκαίρου
  choice: 暂时保全性命
  rationale: σωτηρία 在这里指免于眼前的死亡，πρόσκαιρος 则强调这种保全只是暂时的；此译避免误解为更完整意义上的神学性“救恩”。
- source_word: τῆς ἑπτὰ υἱῶν
  choice: 她七个儿子
  rationale: 上下文清楚表明这七个儿子属于这位母亲；汉语补出“她”使关系自然明确。
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: 照暴君的承诺
  rationale: κατά 加宾格在此表示“按照、依据”；ὑπόσχεσις 是暴君所作的承诺或提议。
theological_decisions:
- issue: 殉道语境中 εὐσέβεια 的表达
  choice: 敬虔
  alternative: 对上帝的虔敬
  rationale: “敬虔”保留原词的凝练与神学张力；脚注说明其在本书语境中主要指向对上帝的虔敬和忠诚，而不把解释性成分全部写入正文。
- issue: σωτηρία 在本节中的含义
  choice: 暂时保全性命
  alternative: 暂时得救
  rationale: 上下文所说的是暴君承诺给予的短期肉身存活，并非必然涉及终极救恩；译文据语境明确其现实含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以破折号呈现两项抉择的对照，以分号保留原文作为较长句子片段的未完结构；不擅自化解“敬虔”与短暂保命之间的张力。
