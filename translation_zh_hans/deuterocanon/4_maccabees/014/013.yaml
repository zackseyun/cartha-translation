  yaml_path: translation/deuterocanon/4_maccabees/014/013.yaml
  text: But see how intricate the affection of love for children is[a], drawing everything toward the sympathy of the inward parts.
translation:
  language: zh_hans
  text: 你们且看，对子女的亲爱之情是何等错综复杂[a]，它牵引着一切归向肺腑深处的共感。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“母爱”。上下文说的是七兄弟的母亲，但这里的希腊词含义较宽，指父母疼爱自己的子女。
    reason: 说明语境所容许的具体译法，同时保留原词较广的词义范围。
lexical_decisions:
- source_word: θεωρεῖτε
  choice: 请看
  rationale: 保留复数命令语气，邀请听众留意并思量眼前的例证；“请看”在现代汉语中自然且庄重。
- source_word: πολυπλόκος
  choice: 千丝万缕
  rationale: 原词有“多重交织、盘绕复杂”之意。“千丝万缕”既保留交织的形象，也表达这种亲情复杂而多层的牵连。
- source_word: φιλοτεκνίας στοργή
  choice: 疼爱子女的亲情
  rationale: φιλοτεκνία指对自己子女的爱，στοργή指自然的家庭亲爱。“疼爱子女的亲情”在汉语中兼顾两词，且不把词义限缩为母爱。
- source_word: ἕλκουσα
  choice: 牵向
  rationale: 保留“拉、牵引”的动态比喻，同时避免“拖拽”所带来的强烈暴力色彩。
- source_word: πάντα
  choice: 一切
  rationale: 按中性复数的概括性用法直译，保留所牵动对象范围宽泛的表达，不擅自具体化。
- source_word: τῶν σπλάγχνων συμπάθειαν
  choice: 肺腑相通之情
  rationale: σπλάγχνα字面指内脏、肺腑，并可指深处的感情；συμπάθεια指共同感受、同情相应。“肺腑相通之情”保留身体意象及彼此共感的含义。
theological_decisions:
- issue: 殉道七兄弟之母的语境中，φιλοτεκνία是否应专指母爱
  choice: 译为较宽泛的“疼爱子女的亲情”
  alternative: 母爱；母亲对子女的疼爱
  rationale: 上下文确实聚焦一位母亲，但希腊词本身泛指父母对子女的爱。正文保留词义广度，脚注说明语境中也可理解为母爱。
- issue: σπλάγχνων的身体意象是否应完全意译
  choice: 保留为“肺腑”
  alternative: 内心深处；发自内心
  rationale: “肺腑”既能让现代读者理解为深切感情，也保存原文以身体内部器官表达情感的具体意象，避免把张力消解为一般性的“内心”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“千丝万缕”传达原文交织复杂的形象；“肺腑相通之情”略带文学色彩，以保存希腊文的身体隐喻和共同感受的张力。
