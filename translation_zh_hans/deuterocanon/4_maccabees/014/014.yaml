  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
translation:
  language: zh_hans
  text: 因为就连没有理性的动物，对自己所生的后代也怀有与人类相似的同感和亲爱之情[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有推理能力的动物。”希腊语强调这些动物缺乏理性能力，与人类形成对照。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从自己而生的那些。”意思是它们自己的后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: 因为就连
  rationale: 此处不是严格的地点表达，而是承接上文、提出支持理由，并带强调意味；“因为就连”自然传达这种论证功能。
- source_word: τὰ ἄλογα ζῷα
  choice: 没有理性的动物
  rationale: 保留ἄλογα与人类理性能力之间的对比，同时比“非理性动物”更符合现代汉语的自然表达。
- source_word: ὁμοίαν
  choice: 与人类相似的
  rationale: 明确表示动物的同感和亲爱之情与人类所有的相似，而不将“相似”强化为完全相同。
- source_word: συνπίθειαν
  choice: 同感
  rationale: 表达共同感受、感同身受的联系；与στοργή并列时，可保留两个名词之间的细微区别。
- source_word: στοργὴν
  choice: 亲爱之情
  rationale: στοργή特指天然的亲属之爱，尤其适用于亲子关系；“亲爱之情”既温暖又不额外限定为某种神学意义的爱。
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: 对自己所生的后代
  rationale: 贴近“对从它们而生之物”的字面结构，同时以“后代”清楚表达所指是动物自己的幼崽。
- source_word: τοῖς ἀνθρώποις
  choice: 人类
  rationale: 该与格构成比较对象，泛指人，不含男性专指意味；“人类”简洁而准确。
theological_decisions: []
