base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: zh_hans
  text: 但不止于此；更因为她儿子们的高尚品德[a]和他们对律法[b]的顺从，她对他们的母爱就更加深厚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高尚品德”也可译作“美德”；希腊词兼有道德良善与品格高贵之意。
    reason: lexical_alternative
  - marker: b
    text: 即他们祖传的犹太律法。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: 但不只如此；……又……因此
  rationale: 这一组合承接上文并补充另一个理由。译文以现代汉语的转折和递进结构保留其修辞推进，避免生硬直译。
- source_word: καλοκἀγαθίαν
  choice: 品格高尚
  rationale: 该词兼含善德与高贵品格；“品格高尚”自然易懂，也尽量保留两方面的含义。
- source_word: τῶν υἱῶν
  choice: 她的儿子们
  rationale: 希腊文明确指男性后代；根据上下文补出“她的”，使汉语指代清楚。
- source_word: εὐπείθειαν
  choice: 顺从
  rationale: 此词表示乐意听从、服从；与“律法”搭配时，“顺从”自然且保留主动遵行的意味。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 上下文所指是犹太祖传的律法，而非泛指一般法律；“律法”是现代中文宗教与历史语境中清楚而不过度解释的表达。
- source_word: μείζω
  choice: 越发深厚
  rationale: 比较级表示她的亲情因上述缘故更强；结合中文对感情的自然表达，译作“越发深厚”。
- source_word: φιλοστοργίαν
  choice: 母爱
  rationale: 该词指亲属间自然深厚的爱；本节主体是母亲，译作“母爱”简洁地表达了语境中的具体亲情。
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: 她对他们的……
  rationale: 该短语表达她对儿子们怀有这种亲情；按现代汉语习惯调整为“对他们的母爱”。
theological_decisions:
- issue: “律法”的所指
  choice: 指犹太人的祖传律法，即妥拉
  alternative: 泛指一般道德法则或法律
  rationale: 《马加比四书》的上下文持续以忠于祖传律法描述殉道者的坚守，因此这里不是泛指守法；正文保留“律法”，脚注说明其文化所指。
- issue: 亲属称谓的性别
  choice: 儿子们
  alternative: 孩子们
  rationale: 希腊文 υἱῶν 明确为男性复数，且上下文涉及母亲和她的七个儿子，因此保留性别信息。
- issue: φιλοστοργίαν 的语境化表达
  choice: 母爱
  alternative: 亲情；骨肉之情；慈爱
  rationale: 原词本身可泛指家人间的自然亲爱，但本节主体明确是母亲；“母爱”使语境关系自然显明，同时未加入额外教义含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但不只如此”承接上文，“又……因此”清楚呈现新增理由与结果；“母爱越发深厚”保留比较级及亲情力度。所有脚注标记均已置于正文相应位置。
