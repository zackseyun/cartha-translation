  text: For the mother of the seven young men endured the tortures of each one of her children[a].
translation:
  language: zh_hans
  text: 因为那七个青年人的母亲忍受了她每一个孩子所遭受的酷刑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可更具体地译为：“她每一个孩子在刑架上所受的折磨。”希腊语 στρέβλα 可指用刑架施加的酷刑。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: 母亲
  rationale: 采用庄重、自然的亲属称谓，保留本节以母子关系形成的感染力。
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: 那七个青年人
  rationale: νεανίσκων 指年轻男性；译作“青年人”既表达年龄和性别，也避免提前用“儿子”替代后文 τέκνων 所强调的亲子关系。
- source_word: ὑπήνεγκεν
  choice: 忍受了
  rationale: 表达承受痛苦并坚持下来的含义，是现代汉语中自然且准确的说法。
- source_word: στρέβλας
  choice: 酷刑
  rationale: 该词可泛指酷刑，也可特指用刑架施加的折磨；正文采用较宽泛且自然的“酷刑”，具体可能性置于脚注。
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: 她每一个孩子所遭的酷刑
  rationale: 保留 ἑνὶ ἑκάστῳ 的逐一、分别之意，并以“所遭”自然表达酷刑落在每个孩子身上；“孩子”凸显从母亲视角所见的亲子关系。
