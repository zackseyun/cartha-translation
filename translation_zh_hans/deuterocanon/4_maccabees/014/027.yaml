base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: zh_hans
  text: 她虽因他们每一个人所受的许多痛苦，不由得对他们心生同情，却因敬畏上帝，不顾儿女一时得以保全性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿女暂时的安全”“儿女一时获救”。这里指眼前脱离酷刑、得以存活，并不一定指神学意义上的救恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠδῖνας
  choice: 痛苦
  rationale: 该词可指剧痛、苦楚；在殉道语境中，泛指每个儿子所承受的强烈折磨。“痛苦”自然且不额外引入产痛意象。
- source_word: συμπάθειαν
  choice: 心生同情
  rationale: 该词表达与受苦者感同身受的情感；“心生同情”符合母亲面对儿女受难时不可抑制的情感反应。
- source_word: ἠναγκασμένην ... ἔχειν
  choice: 不由得……心生
  rationale: 此结构表示儿女所受的痛苦迫使她产生同情，并非外在强制；“不由得”在现代汉语中准确自然。
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: 他们每个人
  rationale: 保留原文逐一指向各人的分配意义。
- source_word: φόβον
  choice: 敬畏
  rationale: φόβος用于人与上帝的关系时兼有惧怕与崇敬之意；“敬畏”是自然的现代汉语表达，同时保留其道德和神学分量。
- source_word: ὑπερείδειν
  choice: 不顾
  rationale: 这里指因更高的忠诚而越过、不以某事为优先，并非没有母爱；“不顾”简洁地表达这种取舍。
- source_word: πρόσκαιρον σωτηρίαν
  choice: 暂时得救
  rationale: πρόσκαιρος表示短暂、仅限现世；σωτηρία在此指从酷刑与死亡中获救、保全性命。“暂时得救”保留原词“救”的语义，也由脚注澄清并非特指属灵救恩。
theological_decisions:
- issue: 殉道语境中σωτηρία的含义
  choice: 理解为眼前获救、保全性命
  alternative: 属灵或终极意义上的救恩
  rationale: 上下文关注母亲是否寻求儿女脱离酷刑并存活；“暂时”也指向现世性的解救，而非对终极救恩作出断言。
- issue: φόβος θεοῦ的表达
  choice: 敬畏上帝
  alternative: 惧怕上帝
  rationale: 原词确有“惧怕”义，但在对上帝的关系中也包含尊崇与畏惧。“敬畏”避免把两者割裂，同时保留母爱与对上帝忠诚之间的张力。
- issue: 母亲“不顾”儿女暂时得救的伦理张力
  choice: 直译其取舍，不弱化为单纯接受现实
  alternative: 她放弃营救儿女／她看见更大的救恩
  rationale: 原文说她因敬畏上帝而越过儿女短暂的σωτηρία；译文不补入她采取何种行动，也不把现世与永恒救恩的对比明说出来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不由得……心生同情”呈现母亲本能的共苦之情；分号和“然而”清楚表达这种同情与敬畏上帝之间的张力。
