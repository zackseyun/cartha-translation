lexical_decisions:
- source_word: πανάγιε
  choice: 至圣
  rationale: 这是呼格单数，用作崇高的称呼；“至圣”自然保留其加强语气，又不引入额外的教义含义。
- source_word: συμφώνων
  choice: 同心的
  rationale: 表达兄弟之间协调一致、同心合意；比音译式的“和谐”更符合现代汉语叙事语体。
- source_word: ἀδελφῶν ἑβδομάς
  choice: 七兄弟
  rationale: ἑβδομάς指由七个组成的一组，ἀδελφῶν明确指男性兄弟；汉语“七兄弟”简洁保留两者。
- source_word: κοσμοποιίας
  choice: 创世
  rationale: 该复合词指世界的创造；“创世”在现代汉语中简洁、清楚，并保留宇宙受造的含义。
- source_word: ἡμέραι
  choice: 那些日子
  rationale: 直译为“日子”；加入指示词使汉语自然，并指回创世时的日子，但不擅自补出原文未明说的“七”。
- source_word: περὶ τὴν εὐσέβειαν
  choice: 关乎敬虔
  rationale: 该短语较为凝缩。“关乎”保留关系表达而不过度解释；“敬虔”兼有对上帝的敬畏与由此表现出的忠信生活。
theological_decisions:
- issue: εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔敬
  rationale: 本书以εὐσέβεια为核心宗教伦理概念。“敬虔”能表达对上帝的敬畏及相应行为；“虔敬”也可成立，但较不常用。
- issue: 未完成比较句的处理
  choice: 以省略号保留悬而未决的比较结构
  alternative: 根据下一节补足“同样……”的结论
  rationale: 本节由καθάπερ γάρ引出比较，却未在本节内完成。译文不提前引入下一节内容，以保存原文的句法张力和分节状态。
translation_notes:
  register: 采用庄重而现代的呼语“至圣而同心的七兄弟啊”，避免生硬的“七人组”。正文保留希腊文凝缩且未完成的句式，并用省略号提示句意延续至下一节。
