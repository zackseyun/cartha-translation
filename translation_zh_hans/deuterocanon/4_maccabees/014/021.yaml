  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: zh_hans
  text: 啊，理性，儿女情欲的统御者[a]！对母亲来说，敬虔[b]比儿女更为可慕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情欲”译自希腊语“πάθη”，在本书中指理性所应统御的激情、欲望和情感冲动；“儿女”直接修饰“情欲”，即儿女自身的情欲。
    reason: 词义与句法说明
  - marker: b
    text: “敬虔”也可译作“虔敬”或“敬神之心”，这里指对上帝的虔诚忠贞。
    reason: 词义说明
lexical_decisions:
- source_word: λογισμέ
  choice: 理性
  rationale: 本书以 λογισμός 表示能够管束情欲和情感冲动的理性判断；呼格译作“理性”，简洁地保留全书的哲学主题。
- source_word: τέκνων παθῶν
  choice: 儿女之情
  rationale: 该属格组合可指与儿女有关的深切情感，也可按形式理解为“儿女的情感”。结合下句母亲宁取敬虔胜过儿女的语境，正文采用自然且贴合论旨的“儿女之情”，并以脚注保留另一种句法理解。
- source_word: τύραννε
  choice: 霸主
  rationale: τύραννος 在此为强烈的统治隐喻，强调理性对情感的支配。“霸主”保留力度，又比现代汉语中纯贬义的“暴君”更适合这里的赞叹语气。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 在《马加比四书》中，此词主要指对上帝虔诚忠贞，而非泛指礼貌或一般宗教情操；“敬虔”能简练传达其指向上帝的含义。
- source_word: μητρὶ
  choice: 对母亲来说
  rationale: 以现代汉语自然表达关系与比较所涉及的对象，同时忠实反映希腊语与格。
- source_word: ποθεινοτέρα
  choice: 更值得渴慕
  rationale: 该比较级含有热切向往、渴望之意；“更值得渴慕”既保留情感力度，也使汉语比较句顺畅。
theological_decisions:
- issue: 敬虔与母爱之间的比较
  choice: 对母亲来说，敬虔比儿女更值得渴慕
  alternative: 母亲渴慕敬虔，胜过渴慕儿女
  rationale: 正文保留原文直接而尖锐的比较：对上帝的忠贞超越母亲对儿女的依恋；不将其弱化为一般伦理选择，也不扩展为某一宗派的殉道教义。
- issue: τέκνων 与 παθῶν 的属格关系
  choice: 儿女之情
  alternative: 儿女的情感
  rationale: 上下文着重母亲对儿女的依恋，故正文采用“儿女之情”；但希腊语形式允许 τέκνων 修饰 παθῶν 而解作儿女自身的情感，因此以脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。首句用破折号呈现两个呼格之间的同位关系，并保留原文赞叹的力度；第二句调整为自然的现代汉语比较结构。
