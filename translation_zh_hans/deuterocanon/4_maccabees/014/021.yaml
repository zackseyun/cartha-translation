    rationale: 该表达在汉语中主要表示对儿女的情感；希腊文更自然的意思是“儿女的情欲／激情”，即理性统御儿女的 πάθη。原脚注所称两种理解并非同等地由此短语产生，且正文的语境性改写不应取代原文的直接句法。
