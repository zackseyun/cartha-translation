translation:
  language: zh_hans
  text: 七兄弟就敬虔所表现出的神圣而和谐的同心一致[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七兄弟对于虔敬所持守的神圣而协调的一致意见。” 原文συμφωνίας为复数，可指一致、同心或和谐的呼应；περὶ τῆς εὐσεβείας也可直译为“对于虔敬”。
    reason: 说明συμφωνίας的语义范围及复数形式所含的集合性，同时保留περὶ τῆς εὐσεβείας的较直译表达。
lexical_decisions:
- source_word: ἱερὰς
  choice: 神圣
  rationale: 表示与神及圣事相关的神圣性质；“神圣”在现代汉语中庄重自然，也保留原文的崇高语体。
- source_word: ἐναρμόστους
  choice: 和谐
  rationale: 原词有彼此配合、协调一致之意；“和谐”既保留其协调意象，也适合修饰众兄弟共同表现出的一致。
- source_word: περὶ τῆς εὐσεβείας
  choice: 在敬虔之道上
  rationale: εὐσέβεια在《马加比四书》中指向对神的虔敬，以及由此体现的忠贞生活；“敬虔之道”保留其宗教和伦理内涵，而“在……上”自然表达περί所标示的相关领域。
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: 七兄弟
  rationale: 上下文所指是七名男性手足；省去汉语中不必要的“的”可使整个属格结构更紧凑自然。
- source_word: συμφωνίας
  choice: 一致
  rationale: 此词可指一致、同心或和声。由于ἐναρμόστους已译作“和谐”，“一致”可避免语义重复，并突出七兄弟共同的信念与行动。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的译法
  choice: 敬虔之道
  alternative: 虔敬；对神的虔敬
  rationale: 这里不只是内在宗教感情，也包含忠于神及其律法的生活取向。“敬虔之道”保留这一较宽广的宗教伦理含义，同时不把原文限定为某一宗派所特有的术语。
translation_notes:
  register: 采用庄重而易懂的现代书面汉语。原文是一个受前文支配的宾格名词短语，现存引文自身并非完整句子；译文保留短语性质，仅按中文出版习惯加句号，不擅自补出谓语。
