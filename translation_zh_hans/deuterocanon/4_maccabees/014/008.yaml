  yaml_path: translation/deuterocanon/4_maccabees/014/008.yaml
  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
translation:
  language: zh_hans
  text: 就这样，这些年轻人围着那七人[a]起舞，环绕着他们，消除了对酷刑的恐惧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语ἑβδομάδα字面意为“七个组成的一组”或“七人组”；这里指七兄弟，不是“一周”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 就这样
  rationale: 承接上文，说明这些年轻人以何种方式行动；现代汉语自然且保留总结意味。
- source_word: περὶ τὴν ἑβδομάδα
  choice: 围着那七人
  rationale: ἑβδομάς在此指由七人组成的群体，而非历法上的一周；译作“那七人”既简洁，又符合殉道叙事的语境。
- source_word: χορεύοντες
  choice: 起舞
  rationale: 保留该词所呈现的合舞、环舞意象；其环绕方向由“围着”表达。
- source_word: οἱ μεῖρακες
  choice: 这些年轻人
  rationale: 指年轻男性；“年轻人”比“少年”更庄重，也不把年龄说得过于幼小。
- source_word: ἐκύκλουν
  choice: 将他们环绕
  rationale: 保留未完成时所描绘的持续环绕动作，并与前面的起舞意象形成原文所有的双重表达。
- source_word: τὸν βασάνων φόβον
  choice: 对酷刑的恐惧
  rationale: βάσανοι在此指施加于人的酷刑；该译法直接保留属格结构所表达的恐惧对象。
- source_word: καταλύοντες
  choice: 消除了
  rationale: 表达将恐惧拆毁、废除而使之失去效力的结果；“消除”在现代汉语中自然有力。
theological_decisions:
- issue: ἑβδομάδα的所指
  choice: 指由七人组成的群体，即七兄弟
  alternative: 指一周
  rationale: 殉道叙事的语境要求把该词理解为七人一组，而非历法单位；脚注说明其字面和语境意义，避免把隐含的集体称谓误读为时间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“起舞—环绕”保留原文χορεύοντες与ἐκύκλουν相互叠映的环舞意象；不把这一意象进一步解释为某种特定仪式或神学象征。
