  rationale: 修订使汉语更自然，并更明确对应原文两个关键结构：以“怀着”处理“采取相称理智”后的状态，以“关于何为有益的真理”处理“有益／有利之事”的属格限定。保留“思辨”及其脚注，维持本节刻意的哲学语言。
