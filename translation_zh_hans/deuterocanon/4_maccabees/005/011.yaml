base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/011.yaml
  text: and you will scatter the nonsense of your reasonings[a], and, taking up a mind worthy of your age, you will philosophize about the truth of what is beneficial[b],
translation:
  language: zh_hans
  text: 你就会驱散你那些推理中的荒谬[a]；怀着与你年龄相称的理智，你会思辨关于何为有益的真理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使你思想中的愚妄消散”，或“赶走你种种论辩中的胡言”。
    reason: lexical_alternative
  - marker: b
    text: “思辨”所译的希腊文动词本义是“从事哲学”或“作哲学思考”；这里有意采用哲学用语，并非仅指一般的“想一想”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: 驱散
  rationale: 该将来时动词表示使之散开、消散；“驱散”保留原文清除混乱思想的动态意象，也符合现代汉语表达。
- source_word: λῆρον
  choice: 荒谬
  rationale: λῆρος可指胡言、废话或愚妄；在此与“推理”相连，“荒谬”既保留贬斥语气，又不把所指局限为口头言语。
- source_word: λογισμῶν
  choice: 种种推理
  rationale: λογισμός可指思想、推论或论证；本书重视理性论述，“推理”较能保留其智性意味。复数以“种种”体现。
- source_word: ἄξιον τῆς ἡλικίας
  choice: 与你年龄相称的
  rationale: 贴近原文“配得上／符合你的年龄”，避免用“成熟”预先解释其含义。
- source_word: ἀναλαβὼν νοῦν
  choice: 秉持……心智
  rationale: ἀναλαμβάνω有拿起、承担之意，νοῦς指心智、理智或悟性；“秉持……心智”在现代汉语中较自然，同时保留主动采取某种心态的意味。
- source_word: φιλοσοφήσεις
  choice: 思辨
  rationale: 该动词明确带有从事哲学思考的意味。“思辨”在正文中自然且保留哲学色彩，并以脚注说明其明确的哲学用语性质。
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: 有益之事的真谛
  rationale: συμφέρον指有益、有利之事；“真谛”承接ἀλήθεια，并使希腊文属格结构在汉语中清楚自然，同时不把“有益”解释成特定道德或功利结论。
theological_decisions:
- issue: 《马加比四书》的哲学术语
  choice: 保留“推理”“心智”“思辨”等明确的理性与哲学词汇
  alternative: 改用较一般的道德劝诫用语，如“想法”“好好想想”
  rationale: 本书有意以哲学范畴表述犹太信仰与敬虔；保留这套措辞，可避免把作者的思想语境淡化成泛泛的道德劝告。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“秉持……心智”略带书面色彩，以保存原文“拿起／采取一种心智”的形象；“思辨”兼顾普通读者的可懂度与本书鲜明的哲学语域。
