base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: zh_hans
  text: 因为不享用那些无可非议的乐事，是愚昧的；背离自然的恩赐也是不义的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητον
  choice: 愚昧的
  rationale: 表示缺乏理智或见识；“愚昧”保留其智性与道德评判的力度，也符合庄重的现代汉语。
- source_word: ἀπολαύειν
  choice: 享用
  rationale: 此处指从令人愉悦之物得到享受；“享用”既自然，又比单纯“享受”更适合支配具体的“乐事”。
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: 那些无可指责的乐事
  rationale: ἡδέων可指令人愉悦之物或乐事，χωρὶς ὀνείδους明确限定其不招致责难；译文同时保留愉悦性和道德限定。
- source_word: ἄδικον
  choice: 不义的
  rationale: 该词是明确的伦理判断；“不义”比“不妥”或“不对”更能保留原文力度。
- source_word: ἀποστρέφεσθαι
  choice: 背弃
  rationale: 中间语态不定式描绘人主动转身离开；“背弃”在此自然表达拒绝或避开，同时保留较强的道德语气。
- source_word: τὰς τῆς φύσεως χάριτας
  choice: 大自然的恩赐
  rationale: χάριτας在此指自然所给予的益处或美好馈赠；“大自然的恩赐”是自然的现代汉语，也不必将其专门化为神学术语“恩典”。
theological_decisions:
- issue: 对自然乐趣的道德评价
  choice: 译为“那些无可指责的乐事”，表明原文肯定的是受道德条件限制的乐趣，而非一概肯定所有享乐。
  alternative: 可译为“那些不招致责难的悦人之物”。
  rationale: 希腊文用χωρὶς ὀνείδους直接限制ἡδέων；保留这层限定，可避免把句子理解成对快乐毫无限制的认可。
- issue: “自然”与“恩赐”的关系
  choice: 译为“大自然的恩赐”，维持 φύσεως 属格所表达的来源或归属关系。
  alternative: 可译为“自然所赐的美好事物”或“自然的惠赐”。
  rationale: 原文没有明说赐予者是上帝，也没有把“自然”人格化为神祇；译文不额外解决这种可能的思想张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为……实在是……；而……也……”重现原句并列论证。“乐事”简洁地涵盖ἡδέων所指的愉悦之物；脚注保留较展开的词义表达。
