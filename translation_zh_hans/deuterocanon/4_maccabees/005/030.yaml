  text: You will not even gouge out my eyes and melt my inward parts[a].
translation:
  language: zh_hans
  text: 你也休想剜出我的双眼，熔化我的内脏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的脏腑”。希腊语所用的词指身体内部的器官。
