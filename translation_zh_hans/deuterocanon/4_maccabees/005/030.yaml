lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: 也休想
  rationale: 该组合在语境中加强否定，表达强烈的拒绝或不可能；“也休想”既保留承接意味，也自然传达坚决语气。
- source_word: ἐκκόψεις
  choice: 剜出
  rationale: 该动词本义为“切出、割除”；以眼睛为宾语时，“剜出”准确而自然地保留了原文的暴力意象。
- source_word: τὰ ὄμματα
  choice: 我的双眼
  rationale: 该复数名词在此按通常意义指双眼，并无证据支持引申为视力或眼眶。
- source_word: τὰ σπλάγχνα
  choice: 我的内脏
  rationale: 该词指身体内部的器官或脏腑；“内脏”是现代汉语中准确、清楚且不过分古雅的表达。
- source_word: τήξεις
  choice: 熔化
  rationale: 该动词意为使之融化或消融；“熔化”保留原文具体而骇人的身体意象，没有弱化为较抽象的“毁坏”。
