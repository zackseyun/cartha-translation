  text: 但你不会这样嘲笑我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“你不会对我笑这种笑声。”希腊文把“笑”（动词）与同源名词“笑声”连用；此处很可能指带轻蔑意味的嘲笑。
