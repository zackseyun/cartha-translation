lexical_decisions:
- source_word: ἀλλʼ
  choice: 但
  rationale: 承接上文形成强烈转折；“但”在现代汉语中自然、明确。
- source_word: οὐ
  choice: 休想
  rationale: 希腊文为普通否定，但与第二人称将来时合用，在此抗拒、挑战的语境中表达断然否定；“休想”自然传达其语用力度，同时不增添“绝不”等额外程度副词。
- source_word: γελάσεις
  choice: 嘲笑
  rationale: 字面义为“笑”，但 κατά 加属格表明笑是敌对地指向说话者；现代汉语若译作“对我笑这种笑”生硬难解，因此正文采用语境义“嘲笑”。
- source_word: κατʼ ἐμοῦ
  choice: 我
  rationale: κατά 加属格表示敌意行为所针对的对象；并入汉语动词结构“嘲笑我”最自然。
- source_word: τοῦτον τὸν γέλωτα
  choice: 这样
  rationale: 原文直译为“这种笑”，与 γελάσεις 构成同源词复沓并带强调意味；汉语正文以“这样嘲笑”保留指示与强调，脚注说明原文形式。
