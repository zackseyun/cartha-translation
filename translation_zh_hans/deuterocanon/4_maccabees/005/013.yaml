  rationale: 修订去除了“真有”所额外加强的语气，以“某种”直接对应τις；重组后半句以改善汉语修饰关系；并更正脚注b中将“违法行为”误写为“所犯的律法”的语义错误。未将未具名的监察力量解释为上帝或任何特定神灵。
