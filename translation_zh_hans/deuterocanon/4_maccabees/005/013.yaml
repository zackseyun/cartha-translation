base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: zh_hans
  text: 你也当想一想：即使这宗教有某种监察的力量[a]，它也会宽恕你在这一切事上因受强迫而犯下的违法行为。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监察的力量”也可译作“察看之力”或“监督之力”。希腊文没有说明这力量究竟是谁或是什么。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“它也会宽恕你在这一切事上迫不得已所犯的违法行为。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: 想一想
  rationale: 这是要求对方思量的命令式；“想一想”自然易懂，也保留劝说语气。
- source_word: θρησκείας
  choice: 宗教
  rationale: 说话者从外部泛指犹太人的宗教信仰与实践；“宗教”符合其措辞角度。
- source_word: ἐποπτικὴ δύναμις
  choice: 监察之力
  rationale: 兼顾“察看、监督”与“能力、权能”的含义，并不把其身份明确解释为上帝。
- source_word: συγγνωμονήσειέν
  choice: 会宽恕
  rationale: 条件句中的潜在愿望式表示可能结果；“会宽恕”保留对违法行为予以谅宥的道德分量。
- source_word: παρανομίᾳ
  choice: 违法之事
  rationale: 表示违反律法的行为；此译法既清楚，又保留法律与道德层面的含义。
- source_word: διʼ ἀνάγκην
  choice: 因强迫而犯的
  rationale: 这里的ἀνάγκη着重外在强制；该表达明确表明行为并非自愿。
- source_word: ἐπὶ πᾶσιν
  choice: 对于这一切
  rationale: 概括当前被迫违犯律法的各项事情，同时避免添加原文没有明说的具体内容。
theological_decisions:
- issue: “监察之力”的身份
  choice: 保留为未指明身份、与这宗教相关的监察之力
  alternative: 直接译作上帝、神意或宗教的守护者
  rationale: 希腊文以假设口吻说某种ἐποπτικὴ δύναμις，并未直接称为上帝；译文保留这种含混和说话者的疏离语气。
- issue: 宽恕的对象与理由
  choice: 译作因受强迫而发生的违法之事会获宽恕
  alternative: 译作仅因必要而可被原谅的过失
  rationale: 原文仍将行为称为παρανομία，并没有否认其违法性质，只声称强迫可成为获得宽恕的理由。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“即便……真有什么”体现说话者的假设乃至疏离口吻；不将未具名的力量直接神学化为上帝。脚注标记均置于正文中。
