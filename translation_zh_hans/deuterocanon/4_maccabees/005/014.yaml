  text: When the tyrant was urging him in this way toward the lawless eating of flesh, Eleazar asked to speak.
translation:
  language: zh_hans
  text: 暴君这样催逼他吃违背律法的肉时，以利亚撒请求发言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: 这样
  rationale: 自然表达方式状语，承接上文所述的催逼手段。
- source_word: ἔκθεσμον
  choice: 违背律法的
  rationale: 该词意为越出法度、违法；本处涉及被禁止食用的肉，译为“违背律法的”既保留法律色彩，也避免把重点泛化为一般道德上的“邪恶”。
- source_word: σαρκοφαγίαν
  choice: 吃……肉
  rationale: 按其组成和语境直译为食肉行为；中文用动词结构比“食肉”更自然。
- source_word: ἐποτρύνοντος
  choice: 催逼
  rationale: 兼顾强烈催促和暴君施压的语境，比中性的“劝”更准确。
- source_word: λόγον ᾔτησεν
  choice: 请求发言
  rationale: 这是请求获得说话机会，而非请求某种“话语”；现代汉语以“请求发言”简洁准确。
- source_word: Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 采用中文圣经传统中 Eleazar 的通行译名。
theological_decisions:
- issue: ἔκθεσμον所指的违法性质
  choice: 违背律法的
  alternative: 不法的／违法的
  rationale: 明确其行为与律法禁令相冲突，同时不额外指定肉类本身的性质，也不引入宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留希腊文属格绝对结构的时间关系，以“……时”表达；句式简洁，适合叙事经文。
