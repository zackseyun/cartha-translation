lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 连接前后叙事，并与前置分词共同呈现自然的先后承接；不另译“和”，以免中文生硬。
- source_word: αὐτὸν
  choice: 他
  rationale: 阳性单数宾格代词，指向上文刚提到的人物。
- source_word: ἰδὼν
  choice: 看见
  rationale: ὁράω的不定过去时主动分词，在此作状语；与“就说”搭配，自然表达看见之后随即发言的叙事关系。
- source_word: ὁ Ἀντίοχος
  choice: 安提阿古
  rationale: 采用该人物在现代中文圣经及次经语境中常见的译名；希腊语冠词不需在中文专名之前另译。
- source_word: ἔφη
  choice: 说
  rationale: 常见的叙事引语动词；中文借“安提阿古”作明确主语，无需重复添加“他”。
