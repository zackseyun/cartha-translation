  text: For through either one, the law takes equal pride.
translation:
  language: zh_hans
  text: 因为律法借着二者中的每一个[a]，都同样为之自豪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着二者中的任何一个。”希腊语ἑκατέρου专指所论的两个对象，并有逐一分配的意味。
    reason: lexical_alternative
  - marker: b
