    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: 无论借着二者中的哪一个
  rationale: ἑκάτερος专指所论的两个对象，并带有逐一分配的意味；此译既保留“二者”这一范围，也以自然汉语表达“无论哪一个都如此”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前述判断的理由；“因为”清楚保留其解释性连接作用。
- source_word: ὡς ὁμοίως
  choice: 同样
  rationale: 这一表达强调两者在此事上相同、无差别；“同样”简洁而符合现代汉语习惯。
- source_word: ὁ νόμος
  choice: 律法
  rationale: νόμος在本书语境中指犹太律法；“律法”是准确且通行的圣经用语。
- source_word: ὑπερηφανεῖται
  choice: 以此为荣
  rationale: 该动词可表示自豪、夸耀或得意；主语是“律法”，构成拟人表达。“以此为荣”在现代汉语中自然，也保留了原文的修辞。
theological_decisions:
- issue: 律法的拟人化
  choice: 保留“律法……以此为荣”的拟人说法
  alternative: 律法借着二者同样得到尊崇
  rationale: 希腊文让“律法”作ὑπερηφανεῖται的主语，明确采用拟人手法。保留这一表达可忠实呈现原文修辞，避免将其解释性地改写成律法受到尊崇。
- issue: ἑκατέρου所指两者的关系
  choice: 译作“无论借着二者中的哪一个”
  alternative: 借着二者各自
  rationale: 原文明确把范围限定为两个，但本节自身没有重述其所指；译文不补明具体对象，以保留对上下文的依赖与原有含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“二者中的哪一个”保留希腊文对两个对象的限定，却不擅自补出其具体所指；“律法……以此为荣”保留原文拟人修辞。
