  text: and by bowing down to my humane persuasion[a], you will have pity on your own old age.
translation:
  language: zh_hans
  text: 你若俯首听从我这仁慈的劝告[a]，便会怜惜自己的晚年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯首听从”也可译作“俯伏致敬”；鉴于上下文涉及强迫背弃信仰，也可能含有“敬拜”的意思。
    reason: 保留 προσκυνέω 可表示俯伏、致敬或敬拜的词义幅度。
lexical_decisions:
- source_word: προσκυνήσας
  choice: 你若俯首听从
  rationale: 这是 προσκυνέω 的不定过去时分词，在此可表达达成结果的方式或条件。结合王劝人屈从其要求的语境，译作“若俯首听从”既保留俯伏、臣服的形象，也不在正文中过早限定为宗教性的“敬拜”。
- source_word: μου
  choice: 我这
  rationale: 表示说话者所属；与后面的“劝告”自然连用，译作“我这”符合现代汉语表达。
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: 这仁慈的劝告
  rationale: φιλάνθρωπος 表示仁厚、慈善或体恤人的；παρηγορία 可指劝慰、鼓励或劝说。此处是王对自己的强迫性要求所作的美化，因此“仁慈的劝告”保留其自我表述，而不替叙述者认可其确实仁慈。
- source_word: οἰκτειρήσεις
  choice: 就是怜惜
  rationale: οἰκτείρω 意为怜悯、怜惜；在此以“自己的晚年”为宾语，意指顺从便是在顾惜自己。未来时在汉语中结合条件句自然表达为“就是怜惜”。
- source_word: τὸ σεαυτοῦ γῆρας
  choice: 自己的晚年
  rationale: γῆρας 指老年、年老；σεαυτοῦ 加强反身所属。“自己的晚年”自然保留了对年老之人自保心理的诉求。
theological_decisions:
- issue: προσκυνέω 在王命与被迫背教语境中的力度
  choice: 俯首听从
  alternative: 俯伏致敬；敬拜
  rationale: 该动词既可指身体俯伏、表示臣服或尊敬，也可指敬拜。这里语法上所关联的是王所谓“仁慈的劝告”，正文采用“俯首听从”较自然地表达向其要求屈服，同时以脚注保留更强的礼敬乃至宗教性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仁慈”是说话者对自身劝告的描述，并不表示译文认可其强迫行为确实仁慈；“晚年”比直译“老年”更符合此处顾惜余生的汉语语感。
