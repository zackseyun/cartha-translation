base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/023.yaml
  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: zh_hans
  text: 因为它教导我们节制，使我们能够制伏一切享乐和欲望；又教导我们操练勇气，使我们能够自愿忍受一切痛苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: 节制
  rationale: 此处指一种约束自身、驾驭欲望的伦理德性；“节制”是现代汉语中自然而庄重的德性用语，并由后文“制伏一切享乐和欲望”具体说明。
- source_word: ἐκδιδάσκει
  choice: 教导
  rationale: 该复合动词可含充分教习之意；“教导”既保留教育、塑造的含义，又不夸大其前缀色彩。
- source_word: κρατεῖν
  choice: 制伏
  rationale: 原词含居于其上、掌控或胜过之意；“制伏”比一般的“控制”更能体现对享乐和欲望取得支配的主动意味。
- source_word: ἡδονῶν
  choice: 享乐
  rationale: 原词泛指愉悦或快乐；在此伦理语境中译为“享乐”自然，但不擅自限定为肉体或感官之乐。
- source_word: ἐπιθυμιῶν
  choice: 欲望
  rationale: 该词可依语境带负面色彩，但本句范围宽泛；“欲望”避免将其缩窄为性欲或强烈贪欲。
- source_word: ἀνδρείαν
  choice: 勇气
  rationale: 在希腊伦理语境中表示勇敢、坚毅这一德性；“勇气”准确自然，也避免按词源直译为带性别色彩的“男子气概”。
- source_word: ἐξασκεῖν
  choice: 操练
  rationale: 该动词表示通过实践培养、锻炼某种德性；“操练勇气”保留持续塑造德性的意味。
- source_word: πόνον
  choice: 痛苦
  rationale: 该词可指劳苦、艰难或痛楚；在殉道与忍受的语境中，“痛苦”最直接，同时保留其较宽的受苦含义。
- source_word: ἑκουσίως
  choice: 甘心
  rationale: 原词强调出于自愿；“甘心”在现代汉语中简洁自然，表达主动接受而非被迫承受。
- source_word: ὑπομένειν
  choice: 忍受
  rationale: 原词意为留在重压之下、坚持承受；与“痛苦”搭配时，“忍受”准确通顺。
- source_word: ὥστε
  choice: 使我们能
  rationale: 两处ὥστε加不定式说明教导与操练所产生的结果或所指向的目的；译作“使我们能”保留这种结果—目的之间的语义张力，不将其严格限定为单一类别。
theological_decisions:
- issue: 希腊伦理德性术语在哲学—殉道语境中的表达
  choice: 采用“节制”和“勇气”等现代汉语通行的伦理德性词
  alternative: 将σωφροσύνη译作“健全心智”或“克己”，将ἀνδρεία译作“刚毅”或“男子气概”
  rationale: 本节论述德性教育及其实际表现。通行的德性词既保留哲学语境，又避免生硬、古雅或带性别限定的表达；后续分句则具体界定这些德性的内涵。
- issue: ὥστε加不定式的结果与目的关系
  choice: 译为“使我们能”，保留目的与结果均可感知的表达
  alternative: 明确译为纯目的性的“为要使我们”，或纯结果性的“以致我们”
  rationale: 此结构在本句可描述教导所导向的能力及其效果。中文采用中性表达，避免替原文消除这层语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。句式保留原文两组平行结构：“教导……使……”与“操练……使……”。分号呈现两项德性及其作用的对称关系；不添加原文没有的感官、性欲或宗派性解释。
