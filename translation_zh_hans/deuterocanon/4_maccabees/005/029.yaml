  text: nor will I disregard the sacred oaths of the fathers to keep the law[b][a],
translation:
  language: zh_hans
  text: 也绝不把先祖为遵守律法所起的神圣誓言置之不顾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先祖”也可译作“祖先”或“先辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε
  choice: 也绝不
  rationale: 承接上文的否定并列；现代汉语用“也绝不”自然表达“也不／也决不”的递进语气。
- source_word: ἱεροὺς
  choice: 神圣
  rationale: 修饰“誓言”，保留其宗教上的庄严与不可侵犯性。
- source_word: τῶν προγόνων
  choice: 先祖
  rationale: πρόγονοι指前代祖先；“先祖”既保留祖辈传承的色彩，也符合庄重而自然的现代汉语。希腊语定冠词结构并不要求补入“我们的”。
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: 为遵守律法所起的
  rationale: 该结构说明誓言所关乎的事项；译为“为遵守律法所起的”能清楚连接“誓言”，并保留φυλάσσω在此处遵行、谨守的含义。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 语境指犹太祖传律法；“律法”在中文圣经语体中自然明确，又不额外加入原文没有的限定词。
- source_word: ὅρκους
  choice: 誓言
  rationale: ὅρκος特指郑重起下的誓言，而非一般心愿或承诺。
- source_word: οὐ παρήσω
  choice: 绝不……置之不顾
  rationale: παρίημι在这里有放任不理、忽视之意；“置之不顾”与“誓言”搭配自然，也避免把含义强化成彻底背弃。
theological_decisions:
- issue: τῶν προγόνων的祖先称谓
  choice: 先祖
  alternative: 祖先；先辈
  rationale: “先祖”传达祖辈及其传统承继的庄重意味；不补入希腊文未明说的“我们的”，也不将其限定为某一性别。
- issue: τὸν νόμον的所指
  choice: 律法
  alternative: 法律；祖传律法
  rationale: 上下文所指是犹太人所遵守的律法。正文采用简洁、贴近原文的“律法”，不擅自扩写为“祖传律法”。
- issue: 誓言与遵守律法之间的关系
  choice: 为遵守律法所起的神圣誓言
  alternative: 关乎遵守律法的神圣誓言
  rationale: περὶ τοῦ加不定式可表达誓言所涉及的事项；“为……所起”符合汉语表达，同时不把誓言的具体历史背景解释得超过原文。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“置之不顾”保留拒绝漠视誓言的力度；“律法”沿用普通读者熟悉的圣经用语。
