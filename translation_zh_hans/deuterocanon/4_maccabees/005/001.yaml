base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/001.yaml
  text: So then[a], when the tyrant Antiochus had taken his seat with his council on a certain high place, and their fully armed troops were standing around on every side,
translation:
  language: zh_hans
  text: 于是，暴君安条克与议员们一同坐在某处高地上[a]；他们的军队全副武装，环立在四周，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在某个较高的地方”。希腊语指位置较高之处，不一定是用于祭祀的“丘坛”。
    reason: 说明空间短语的词义范围，防止“高地”被误解为专门的宗教场所。
lexical_decisions:
- source_word: Προκαθίσας
  choice: 就座
  rationale: 该分词为后续叙事铺设场景，描写安条克以权威身份坐下；“就座”自然庄重，又不必把 προ- 机械译成“先坐下”。
- source_word: γέ τοι
  choice: 于是
  rationale: 这一组合主要起承接并加强语气的篇章作用；“于是”能自然引入当前场景，不添加具体信息。
- source_word: μετὰ τῶν συνέδρων
  choice: 和他的议员们
  rationale: σύνεδροι 指与统治者同席议事的人；“议员们”保留人物复数，比笼统的“议会”更贴近原文。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 原文明确使用带贬义的称谓评价安条克；“暴君”准确保留其修辞力度，不弱化为中性的“统治者”或“君王”。
- source_word: Ἀντίοχος
  choice: 安条克
  rationale: 采用现代简体中文中常见的圣经及希腊化历史人物译名。
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: 在一处高地
  rationale: τινος 表示不确指，ὑψηλοῦ τόπου 指较高的位置；“一处高地”简洁保留两者，同时不擅自确定为讲台或宗教性的邱坛。
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: 他们……的军队
  rationale: στρατεύματα 是集体性的军事力量；“军队”符合语境。αὐτῶν 按现有希腊文本保留复数“他们的”，不擅自改作单数。
- source_word: παρεστηκότων
  choice: 站在
  rationale: 该分词描写军队在旁站立的状态；“站在”保留画面感，避免过度解释为被部署。
- source_word: κυκλόθεν
  choice: 四周
  rationale: 该副词强调从各面环绕；“四周”是自然、凝练的现代汉语表达。
- source_word: εὐόπλων
  choice: 全副武装
  rationale: 该词表示武器装备齐全；“全副武装”清楚传达现场的军事威势。
theological_decisions:
- issue: τύραννος 对安条克的作者性评价
  choice: 正文译作“暴君”
  alternative: 统治者；君王
  rationale: 这是原文自身带有道德评价的称谓，并非中性头衔。保留“暴君”可避免削弱《马加比四书》的论辩语气，也没有加入原文以外的宗派解释。
- issue: “高地”是否具有祭祀含义
  choice: 按普通空间意义译为“高地”，并加注说明
  alternative: 高台；邱坛
  rationale: 上下文只要求一个较高的位置，未明确指向礼仪场所或某种特定建筑；不应把宗教含义或具体设施强加给含义较宽的希腊短语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留本节作为后续句子前置背景的未完结构，以逗号收束；用分号理清安条克就座与军队环立这两个伴随场景。
