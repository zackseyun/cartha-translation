  yaml_path: translation/deuterocanon/4_maccabees/005/031.yaml
  text: I am not so old and manly that[a], for the sake of godliness, my reason should not be youthful.
translation:
  language: zh_hans
  text: 我并非年老且有男子气概到如此地步，以致我的理性因着敬虔而不能保持年轻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔敬”。希腊词指对上帝怀有敬畏而虔诚的委身。
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: 年老
  rationale: 该词表示年事已高；译作“年老”既保留年龄含义，也自然配合“到这种地步”的程度结构。
- source_word: ἀνδρῶδης
  choice: 有男子气概
  rationale: 原词明确带有“像男子、具有男子气概”的性别色彩和修辞力量；此处不将其淡化为泛指的“成熟”或“强健”。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 在《马加比四书》的犹太殉道语境中，该词指向对上帝及其律法的敬畏与忠诚；“敬虔”兼顾神学指向和现代可懂性。
- source_word: νεάζειν
  choice: 保持年轻
  rationale: 该不定式表达年轻或焕发青春的状态；“保持年轻”保留与“年老”的修辞对照，又适用于作为主语的“理性”。
- source_word: λογισμόν
  choice: 理性
  rationale: λογισμός是本书的重要哲学用语，指作出判断并驾驭情欲的理性能力；“理性”比宽泛的“思想”或“心智”更准确。
- source_word: ὥστε μοι διὰ τὴν εὐσέβειαν μὴ νεάζειν τὸν λογισμόν
  choice: 以致我的理性不能因着敬虔而保持年轻
  rationale: 用“以致”体现ὥστε加不定式的结果结构，保留原文否定和“理性—年轻”的拟人化表达；μοι自然落实为“我的”。
theological_decisions:
- issue: 犹太殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔敬；敬畏
  rationale: “敬虔”清楚表达对上帝的虔诚和对其律法的忠贞，同时不把本词缩减为一般礼仪行为；脚注保留“虔敬”这一可行译法。
- issue: ἀνδρῶδης的性别修辞
  choice: 有男子气概
  alternative: 刚强；成熟
  rationale: 原文措辞明确带有男性化色彩，应予保留；“刚强”虽较流畅，却会消除这一修辞特征。
- issue: διὰ τὴν εὐσέβειαν的关系
  choice: 因着敬虔
  alternative: 为了敬虔
  rationale: 介词短语可表达原因或缘故；正文采用较自然的原因表达，但不进一步解释敬虔如何使理性年轻，以免消解原句张力。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话。保留“年老—年轻”的对照、“理性保持年轻”的拟人表达，以及“有男子气概”的原文性别修辞；句法尽量贴近希腊文的程度—结果结构，不替原文消除其略显悖论的张力。
