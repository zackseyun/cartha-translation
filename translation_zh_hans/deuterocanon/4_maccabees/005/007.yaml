  yaml_path: translation/deuterocanon/4_maccabees/005/007.yaml
  text: For why do you loathe the eating of the flesh of this animal[a], though nature has graciously made it most excellent?
translation:
  language: zh_hans
  text: 大自然既已使吃这种动物的肉成为最美好的事，你为什么厌恶它呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“这种动物的食肉（吃肉）。”
    reason: 说明 σαρκοφαγία 是表示“食肉、吃肉”这一行为的名词；主文按现代汉语展开为“吃这种动物的肉”。
lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: 既然……你为什么
  rationale: 以现代汉语的因由反问结构表达 γάρ 的承接、论证作用和 διὰ τί 的直接疑问语气，避免生硬直译为“因为为什么”。
- source_word: τῆς φύσεως
  choice: 大自然
  rationale: 此处指自然界或自然秩序作为赋予者；“大自然”在现代汉语中自然清楚，也不引入神学人格化解释。
- source_word: κεχαρισμένης
  choice: 使……成为
  rationale: 该完成时分词表达自然所赋予并形成的结果状态；译为“使……成为”既符合句法关系，也避免把 χαρίζομαι 的词源意味过度神学化为“施恩”。
- source_word: καλλίστην
  choice: 极美好的事
  rationale: καλός 的最高级在此强调食物方面的卓越、可取；“极美好”保留高昂的修辞色彩，而“事”使抽象名词短语在汉语中顺畅。
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: 食用这种动物的肉
  rationale: σαρκοφαγία 字面为“食肉”，这里指吃这种动物的肉；采用自然的现代汉语表达，同时用脚注说明较贴近形式的译法。
- source_word: βδελύττεις
  choice: 厌恶
  rationale: 该动词表示强烈的嫌恶和排斥；“厌恶”庄重、通俗，并适合反问语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“既然……为什么还……”重现原句的论辩性反问；“还”体现说话者认为对方的厌恶与所谓自然赋予的美好相悖，但不替原文解决其伦理张力。
