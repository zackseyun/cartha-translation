  yaml_path: translation/deuterocanon/4_maccabees/005/034.yaml
  text: I will not deny you[a], O law-trained discipline, nor will I spare you[b], beloved self-control.
translation:
  language: zh_hans
  text: 我绝不对你失信[a]，作为教导者的律法啊；也绝不顾惜你[b]，我所珍爱的自制啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我绝不辜负你”或“我绝不背弃你”。希腊文动词既可指说谎，也可指对某人失信或不忠。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“我也绝不顾惜你”或“绝不宽免你”。原文把“律法”和“自制”人格化并直接呼告；对“自制”使用“顾惜”的说法刻意而不寻常，译文保留这一张力，不将其确定解释为“舍弃自制”。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: ψεύσομαί
  choice: 辜负
  rationale: ψεύδομαι以人为宾语时，可指对某人失信、辜负或背弃。这里是拟人化的直接呼语，“辜负”自然表达说话者绝不失信于律法的誓言，同时保留其语义张力。
- source_word: παιδευτὰ
  choice: 教导人的
  rationale: παιδευτής指训练者、教育者或管教者。与呼格νόμε同位，构成“作为教导者的律法”；译作“教导人的”既保留教育、训导作用，也符合现代汉语表达。
- source_word: νόμε
  choice: 律法啊
  rationale: νόμε是νόμος的呼格，正文直接把律法人格化并向它呼告。在本书犹太信仰语境中译为“律法”，不泛化为“习俗”。
- source_word: φείσομαί
  choice: 舍弃
  rationale: φείδομαι通常有“顾惜、宽免、保留、不忍伤害”之意；否定式在此殉道语境中表达说话者不会因保全自身而放弃自制。“舍弃”能使汉语关系清楚，但其不寻常的直译含义另以脚注说明。
- source_word: φίλη
  choice: 我所珍爱的
  rationale: φίλη作为呼格修饰ἐγκράτεια，表达亲爱、珍视之意。“我所珍爱的”自然保留亲昵而庄重的拟人口吻。
- source_word: ἐγκράτεια
  choice: 自制
  rationale: ἐγκράτεια指克制欲望、掌管自身的德性。“自制”是清楚、简洁的现代伦理用语。
theological_decisions:
- issue: 律法与自制这两种德性的拟人化
  choice: 保留直接呼语：“教导人的律法啊”与“我所珍爱的自制”
  alternative: 改写成不带呼语的抽象陈述，如“我绝不违背律法，也绝不放弃自制”
  rationale: 希腊文使用两个呼格，以修辞性呼告把律法和自制人格化。保留这一结构忠实呈现本节的文学风格和伦理张力，而不额外引入教派解释。
- issue: οὐδὲ φείσομαί σε与自制的关系
  choice: 译为“也绝不舍弃你”，按语境表达绝不放弃自制
  alternative: 形式直译为“也绝不顾惜你／宽免你”
  rationale: φείδομαι配人称宾语通常意为“顾惜、宽免”，但对拟人化的“自制”这样说在语义上较突兀。正文采用符合上下文的关系性表达，脚注保留希腊措辞的特殊性，避免假装原文毫无困难。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语。以“啊”明确呼格并保留修辞性拟人；分号呈现两个平行誓句。避免古奥的“节制之德”等术语，同时借脚注保存ψεύδομαι与φείδομαι的词义歧义和原文张力。
