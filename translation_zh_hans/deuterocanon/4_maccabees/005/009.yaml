lexical_decisions:
- source_word: σὺ δέ
  choice: 可是……你
  rationale: δέ在这里带有转折意味；“可是”自然地承接对比，同时保留第二人称的直接指向。
- source_word: μοι
  choice: 依我看
  rationale: 与δοκεῖς连用的与格表示说话者的主观判断；“依我看”在现代汉语中自然、明确。
- source_word: ἀνοητότερον
  choice: 更加愚蠢
  rationale: 这是比较意义的副词形式，表示做事更缺乏理智或见识；“更加愚蠢”既保留力度，也符合现代汉语表达。
- source_word: ποιήσειν
  choice: 这样做会
  rationale: 这是ποιέω的将来不定式，指向将要采取的做法；“这样做会”在汉语中自然地保留未来取向，而不拘泥于希腊语句法。
- source_word: δοκεῖς
  choice: 依我看
  rationale: 此处表示“你在我看来似乎会……”，不是“你认为”；汉语将其与μοι合译为“依我看”，可避免生硬重复。
