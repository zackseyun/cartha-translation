  yaml_path: translation/deuterocanon/4_maccabees/005/004.yaml
  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: zh_hans
  text: 许多人被强行抓走以后，这群人中首先有一位名叫以利亚撒的希伯来人[a]。他出身祭司家族，通晓律法[b]，年事已高；又因年长，暴君身边有许多人认识他。他便开口说话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这群人”原文直译为“畜群”或“羊群”，这里比喻一群人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在律法知识上学识渊博”或“律法方面的专家”；这里不是指现代意义上的法律职业。
    reason: lexical_alternative
  - marker: c
    text: 直译为“他的口被打开”。这是开始说话的庄重表达；原文的被动形式本身并不说明有人强行撬开他的嘴。
    reason: textual_ambiguity
lexical_decisions:
- source_word: συναρπασθέντων
  choice: 被抓来
  rationale: 该词表示以强力抓住或拘捕；译作“被抓来”既保留强制意味，也不额外限定为拖走或掳走。
- source_word: εἷς πρῶτος ἐκ τῆς ἀγέλης
  choice: 从这群人中，第一个被带出来的是一位
  rationale: ἀγέλη本义为“畜群、群”，此处比喻被捕的希伯来人群体。中文正文采用自然的“这群人”，并由脚注说明原文意象；“被带出来”依上下文补足，但不把πρῶτος解释成身份上的首领。
- source_word: Ἑβραῖος
  choice: 希伯来人
  rationale: 直接对应原文称谓，不改译为“犹太人”或“以色列人”。
- source_word: τὸ γένος ἱερεύς
  choice: 出身祭司家族
  rationale: τὸ γένος指出血统或家世；此译避免误解为仅凭出生便已履行祭司职务。
- source_word: τὴν ἐπιστήμην νομικός
  choice: 精通律法
  rationale: νομικός在此指与律法有关，ἐπιστήμη指知识或学识；“精通律法”自然表达其学识专长，又避免现代职业“律师”的含义。
- source_word: τὴν ἡλικίαν προήκων
  choice: 年事已高
  rationale: 准确表达年岁已长，语体庄重自然。
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: 暴君身边有许多人
  rationale: 指暴君周围的随从或圈内人；“身边”保留空间与随从圈子的双重可能。
- source_word: γνώριμος
  choice: 认识他
  rationale: 表达他为那些人所熟悉或知晓，不强化为“很有名”。
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: 他的口被撬开了
  rationale: 动词为被动形式，στόμιον可指口部或开口。结合下一节强迫其吃猪肉的场景，此处较可能是实际撬开他的嘴，而非惯用语“开口说话”；译文保留被动和强制动作。
theological_decisions:
- issue: ἠνῴχετο τὸ στόμιον αὐτοῦ是发言惯用语还是强行张口
  choice: 他的口被撬开了
  alternative: 他开口说话
  rationale: 原文使用被动式，且后文语境是强迫以利亚撒吃猪肉，因此实际撬嘴更符合句法和叙事衔接。脚注保留另一种理解，避免消除文本可能存在的歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。长串同位描述按汉语习惯拆分为数句，同时保留人物的希伯来身份、祭司血统、律法学识、年高及为暴君近臣所认识等全部信息。末句依据希腊语被动形式和后文情境处理为实际的强迫动作，并以脚注保留惯用语式理解。
