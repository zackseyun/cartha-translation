  yaml_path: translation/deuterocanon/4_maccabees/005/026.yaml
  text: He permitted us to eat the things suited to our souls[a], but he forbade us to eat flesh that is opposed to them.
translation:
  language: zh_hans
  text: 他准许我们吃那些与我们的灵魂相合的东西[a]，却禁止我们吃那些与灵魂相悖的肉食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些与我们的灵魂相近的东西”……“与灵魂相反的肉食”。希腊文强调这些食物与灵魂在伦理上相合或相悖。
    reason: 词义存在合理替代译法，需保留οἰκειωθησόμενα与ἐναντιωθησόμενα所表达的相近、相宜及对立含义。
lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: 与……相合
  rationale: 该分词表示与某人相宜、相称或相契合；译作“相合”既保留这种对应关系，也避免把其哲学含义解释得过满。
- source_word: ψυχαῖς
  choice: 灵魂
  rationale: 此处具有伦理和心理层面的分量，并非仅指生物性的生命；“灵魂”保留原文关于人内在生命的表达。
- source_word: ἐπέτρεψεν
  choice: 准许
  rationale: 与律法所作的许可相符，并和下半句的“禁止”形成清楚对照。
- source_word: ἐναντιωθησόμενα
  choice: 与……相悖
  rationale: 保留原文所表达的对立、不相容之意，又符合现代汉语习惯。
- source_word: ἐκώλυσεν
  choice: 禁止
  rationale: 在神圣饮食规定的语境中，此动词表达明确的禁令。
- source_word: σαρκοφαγεῖν
  choice: 吃……肉食
  rationale: 原义为“吃肉”；译文以“吃……肉食”承接前面的“吃”，并清楚表达所禁的是与灵魂相悖的肉类食物。
theological_decisions:
- issue: ψυχαῖς在饮食律法论述中的人论含义
  choice: 译作“灵魂”，并保留“相合／相悖”的伦理对应关系
  alternative: 译作“生命”或“我们自身”，并将两分词泛化为“有益／有害”
  rationale: 原文将食物与人的内在生命置于相合或相悖的关系中；保留“灵魂”及其对应语言，既呈现伦理—人论张力，也不把经文扩展为后来的特定教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“准许……却禁止……”呈现原文平行对照；“相合／相悖”保留伦理性的对应张力。后半句补出“灵魂”而不使用代词，以免汉语中误指“东西”，但不增加新的神学判断。
