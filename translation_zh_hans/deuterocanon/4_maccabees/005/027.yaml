base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: zh_hans
  text: 然而，你这样做实在暴虐：不但强迫我们违背律法，还强迫我们吃，好借着这种最令我们憎恶、使人污秽的进食[a]，进一步嘲笑我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这种最令我们憎恶的污秽进食”，或“这种最令我们憎恶、因进食而受的玷污”。希腊文是一个罕见的复合词，同时含有进食和沾染污秽的意思。
    reason: 说明罕见复合词μιεροφαγίᾳ的词义范围及可行译法。
lexical_decisions:
- source_word: τυραννικὸν
  choice: 你这样做实在暴虐
  rationale: 该形容词在句中用来评断对方强迫人的行为；译作完整的汉语判断句，既保留“暴虐、专横”的谴责，也避免生硬地译成副词。
- source_word: ἀναγκάζεις
  choice: 强迫
  rationale: 准确表达以压力迫使人行事的含义，并以第二个“强迫”补出希腊文中承前省略的动词，使中文清楚自然。
- source_word: παρανομεῖν
  choice: 违背律法
  rationale: 原词表示违反律法；本段语境涉及犹太律法，但原文没有明说“上帝的”或“祖先的”，因此不在正文增添限定。
- source_word: ἐσθίειν
  choice: 吃
  rationale: 保留原文简单而直接的用词；原句未在此处明说所吃之物。
- source_word: ὅπως
  choice: 好
  rationale: 自然地引出目的，表明强迫进食是为了进一步嘲笑他们。
- source_word: ἐχθίστῃ
  choice: 最令我们憎恶
  rationale: 保留最高级和说话者强烈厌恶的语气；“令我们憎恶”也自然承接原文的ἡμῶν。
- source_word: μιεροφαγίᾳ
  choice: 使人污秽的进食
  rationale: 这个罕见复合词兼有“进食”和“沾染污秽”两层意义；此译不把它缩减为食物本身不洁，也不排除礼仪与道德层面的污秽。
- source_word: ἔτι
  choice: 进一步
  rationale: 表达在强迫违法和进食之外又加上一层羞辱。
- source_word: ἐγγελάσῃς
  choice: 嘲笑我们
  rationale: 准确传达“嘲弄、讥笑某人”的含义，符合现代汉语表达。
theological_decisions:
- issue: παρανομεῖν中的“律法”所指
  choice: 违背律法
  alternative: 违背上帝的律法；违背祖先的律法
  rationale: 殉道叙事的上下文清楚指向犹太律法，但希腊文没有附加“上帝的”或“祖先的”；正文保留原文简洁性，不作超出文本的神学限定。
- issue: μιεροφαγίᾳ所表达的污秽性质
  choice: 使人污秽的进食
  alternative: 吃污秽之物；亵渎性的进食；因食物而受玷污
  rationale: 罕见复合词同时涉及吃与污秽，可能涵盖礼仪或道德意味。译文保留这种张力，不把污秽单独归因于食物本身，也不特定化为某一种神学类别。
translation_notes:
  register: 采用庄重而现代的标准普通话。“你这样做实在暴虐”强化当面对暴君的谴责；“不但……还……”对应原文递进结构。全句保留指控、强迫、违法、进食和嘲弄之间的逻辑关系，同时避免在正文中擅自补出所吃食物的具体类别。
