base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: zh_hans
  text: “老人家，在我开始对你用刑以前，我想劝你这件事：尝尝猪肉，好让你得以保全性命。[a]我敬重你的年岁和白发；可是，你有这白发这么久了，在我看来，奉行犹太人的宗教并不像是在践行哲学。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保全性命”也可译作“使自己免遭杀害”；这里所说的是躲过眼前的刑罚，并非属灵意义上的“得救”。
    reason: lexical_alternative
  - marker: b
    text: “践行哲学”保留希腊文的哲学用语；本书反复以哲学和理性的语言讨论敬虔与德性。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: 在开始对你用刑以前
  rationale: πρίν加不定式表达“在……以前”；βάσανοι在此指即将施加的刑讯或酷刑。译作“用刑”简洁自然，也保留κατὰ σοῦ所表达的针对性。
- source_word: ὦ πρεσβῦτα
  choice: 老人家
  rationale: 这里是对年长男子的直接称呼，并非指担任“长老”职分的人。“老人家”在现代汉语中既自然，又能配合说话者表面上的礼貌。
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: 我愿劝你一件事
  rationale: 带ἄν的愿望式使劝告显得委婉、试探；“我愿劝你”保留这种表面客气的语气。ταῦτα在下文落实为一项具体劝告，汉语用“一件事”较自然。
- source_word: ὅπως ἀπογευσάμενος τῶν ὑείων σώζοιο
  choice: 只要尝一点猪肉，你就可以保全性命
  rationale: ἀπογεύομαι表示尝一点；τὰ ὕεια指猪肉或猪的肉。σώζοιο在刑罚语境中是免于受刑或死亡、保住性命，不取属灵救恩之义。汉语的条件式表达自然传达所提手段和预期结果。
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: 我敬重你的年岁和白发
  rationale: αἰδέομαι在此表示因年高而尊重、顾惜；πολιά指因年老而有的灰白头发，译作“白发”符合汉语习惯。
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: 你有这白发已经这么久了
  rationale: 阴性单数关系代词ἣν最自然地回指πολιάν“白发”。译文保留了χρόνον的时间含义，并按现代汉语调整语序。
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: 在我看来，并不像是在求索哲理
  rationale: φιλοσοφεῖν是本书反复使用的哲学词汇，不宜弱化为单纯“聪明”或“明智”。“求索哲理”保留哲学意涵，同时比生硬的“从事哲学”更适合对行为方式的评价。
- source_word: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ
  choice: 却仍奉行犹太人的宗教
  rationale: 依语境，该短语把犹太人的宗教实践与说话者所谓“求索哲理”相对照。译文采用通顺的语境义；所给希腊文本中χρωμένῃ的形态所造成的语法问题另以脚注说明。
theological_decisions:
- issue: σώζοιο所指的“拯救”
  choice: 保全性命，即免受眼前的酷刑和死亡
  alternative: 不加限定地译为“得救”
  rationale: 暴君正劝老人吃禁戒的肉，以逃避即将施加的刑罚；上下文指身体和生命获保全，并非属灵救恩。
- issue: φιλοσοφεῖν的哲学意涵
  choice: 求索哲理
  alternative: 明智行事／通达事理
  rationale: 《马加比四书》有意以理性和哲学的语言论述敬虔与德性。保留明确的“哲理”用语，避免抹去全书的主题张力。
- issue: 犹太宗教与哲学之间的评价
  choice: 保留为说话者的主观判断“在我看来”
  alternative: 把叙述改写成客观断言，认为犹太信仰不合哲理
  rationale: μoi δοκεῖς明确标示这是说话者的看法。译文不把迫害者的讥讽提升为叙述者或经文自身的神学结论。
translation_notes:
  register: 采用现代、庄重而清楚的叙事对白。“老人家”体现暴君表面尊重、实则威逼的语气；“用刑”“保全性命”适合普通读者。“求索哲理”有意保留本书核心的哲学词汇。
