  yaml_path: translation/deuterocanon/4_maccabees/005/037.yaml
  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: zh_hans
  text: 我的先祖会接纳我这个奋战的人[a]，因为我没有惧怕你那些至死的逼迫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词带有竞技、争战或搏斗的意味。这个词与“接纳我”的搭配在希腊语中不寻常；也可较字面地理解为先祖因我的争战而接纳我，或把我当作参与争战的人接纳。译文采用“奋战的人”，但不把它确定为“冠军”或“得胜者”。
    reason: 保留ἀγών᾽的竞技／争战意象及其不寻常句法，并避免将有歧义的表达确定化。
lexical_decisions:
- source_word: ἀγών᾽
  choice: 奋战的人
  rationale: 按所提供的希腊文本，此词带有竞技、争战或搏斗的意象；若机械译作“竞赛”则与“接纳我”的句法搭配生硬。“奋战的人”在现代汉语中较自然，也保留了身处生死考验而坚持抗争的形象。因原文形式及句法较不寻常，另以脚注保留较直译的可能。
- source_word: οἱ πατέρες
  choice: 我的先祖
  rationale: 这里指说话者所归属的祖辈，而非仅指父亲。“我的先祖”符合现代汉语习惯，并保留阳性祖辈称谓所表达的祖先群体含义。
- source_word: προσδέξονται
  choice: 会接纳
  rationale: 该动词在此表示正面地接受、迎接。“接纳”既有认可之意，也不过度扩展为更具体的来世图景。
- source_word: μὴ φοβηθέντα
  choice: 因为我不惧怕
  rationale: 该否定过去时分词修饰“我”，可表达伴随状态，也可带原因意味；译作“因为我不惧怕”使句间关系在汉语中清楚自然。
- source_word: σου
  choice: 你那些
  rationale: 属格指向正在施压的暴君；汉语用“你那些……手段”自然表达其所属及施行者身份。
- source_word: τὰς μέχρι θανάτου ἀνάγκας
  choice: 逼人至死的强迫手段
  rationale: ἀνάγκας 在此不是一般的“必要”，而是强制、胁迫；μέχρι θανάτου 表明这种胁迫可一直达到死亡的程度。“逼人至死的强迫手段”保留强制性和致命程度。
theological_decisions:
- issue: “先祖”的身份及死后接纳的含义
  choice: 保留说话者将被先祖接纳的陈述，不进一步界定接纳发生的方式或来世状态。
  alternative: 将其泛化为受到祖先传统认可，而不含死后相迎之意。
  rationale: 殉难语境使死后由先祖接纳的理解很自然，但原句没有展开完整的来世教义；译文按原文陈述其盼望，同时不作额外教义说明。
- issue: ἀγών᾽ 的争战意象
  choice: 译为“奋战的人”，将其理解为对说话者经历生死争战的描述。
  alternative: 更字面地译为“竞赛”或“争战”，或荣誉性地译为“得胜者”。
  rationale: “奋战的人”保留竞技或战斗意象，却不预先断定他已被授予“冠军”或“得胜者”的荣衔，从而避免超出词形本身所明确表达的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奋战的人”比“冠军”少一层解释性荣衔；“强迫手段”清楚表达暴君施加的胁迫。“我的先祖”比直译“我的父辈”更符合此处祖辈群体的语境。
