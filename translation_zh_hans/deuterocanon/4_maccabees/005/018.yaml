base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: zh_hans
  text: 然而，即使我们的律法实际上并非神圣的，正如你所认为的那样——而我们却认定它是神圣的——即便如此，你也无权废除我们因敬虔而有的荣誉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们敬虔的声誉。”希腊语这一短语可指因敬畏上帝而有的尊荣地位或名声。
    reason: 词义存在“荣誉”与“声誉”之间的真实幅度。
lexical_decisions:
- source_word: καίτοι
  choice: 然而
  rationale: 引出带有反驳意味的让步，保留原文的转折和修辞力度。
- source_word: κατὰ ἀλήθειαν
  choice: 实际上
  rationale: 表达“就真实情况而言、事实上”，在现代汉语中自然清楚。
- source_word: ὁ νόμος ἡμῶν
  choice: 我们的律法
  rationale: 特指犹太人的律法；“律法”能准确传达此处的宗教与规范含义。
- source_word: θεῖος
  choice: 神圣的
  rationale: 直接保留形容词“神圣、属神”的语义层级，不扩展为“上帝所赐的”。
- source_word: ὡς σὺ ὑπολαμβάνεις
  choice: 正如你所认为的那样
  rationale: 明确这是对方的判断，并保留原文略带反驳意味的语气。
- source_word: ἄλλως δὲ νομίζομεν αὐτὸν εἶναι θεῖον
  choice: 尽管我们认定它是神圣的
  rationale: 按上下文将ἄλλως理解为与假设相对的“另一方面/不过”；用“尽管”自然嵌入整个让步句，并以“认定”表现较坚定的立场。
- source_word: οὐδὲ οὕτως ἔχων
  choice: 即便如此
  rationale: 自然概括前述反事实让步条件。
- source_word: ἦν ... ἀκυρῶσαι
  choice: 你也无权废除
  rationale: 该结构表示此举不属于对方可正当实施之事；“无权”保留伦理—法理色彩，“废除”传达ἀκυρόω使之失效的力度。
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: 我们因敬虔而有的荣誉
  rationale: δόξα在此指因敬虔而有的荣誉或声望；此译兼顾宗教德性及社会评价两个层面。
theological_decisions:
- issue: 律法被称为θεῖος的含义
  choice: 译作“神圣的”
  alternative: 来自上帝的／上帝所赐的
  rationale: 原文只用形容词θεῖος，并在反事实让步中讨论其地位；不把它扩展为更完整的神学命题。
- issue: εὐσέβεια这一德性术语
  choice: 译作“敬虔”
  alternative: 虔诚／敬神／宗教信仰
  rationale: “敬虔”既指对上帝的敬畏与虔敬，也能涵盖由此产生的忠诚信守，适合《四马加比书》的德性语境。
- issue: δόξα在本节中的指向
  choice: 正文采用“荣誉”，脚注保留“声誉”的可能
  alternative: 声誉／荣耀
  rationale: 该短语可指因敬虔而有的尊荣，也可偏重社会上的良好名声；正文不把它弱化为单纯舆论，脚注保存词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。破折号标明插入的立场对照，使较复杂的希腊语让步结构清晰，同时不消除其修辞张力。
