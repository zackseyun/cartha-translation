  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: zh_hans
  text: 我绝不至于因怜惜自己的年老，而亲自废弃祖传的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως ... ὥστε
  choice: 绝不会……以致
  rationale: 这一结构表达程度及其结果，即“不怜惜到……的地步”。中文用“绝不会……以致”自然地保留否定、程度与结果之间的联系。
- source_word: οἰκτειρήσω
  choice: 怜惜
  rationale: 该词本义是怜悯、同情；“怜惜自己的年老”保留说话者因年迈而顾惜自己的情感色彩，不先行解释为实际的“保全性命”。
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: 自己的年老
  rationale: γῆρας指年老、老年状态，ἐμαυτοῦ加强自指。“自己的年老”既保留强调，也符合现代汉语表达。
- source_word: με διʼ ἐμαυτοῦ
  choice: 亲手
  rationale: 原语强调说话者本人是行动的施行者。“亲手”简洁自然地传达“由我自己造成”的主体责任，并非指字面上的手部动作。
- source_word: τὸν πάτριον νόμον
  choice: 祖传的律法
  rationale: πάτριος表示从先祖承受而来；在此犹太殉道语境中，νόμος指承袭的律法。“祖传的律法”兼顾其律法性质和祖先传承色彩。
- source_word: καταλῦσαι
  choice: 废掉
  rationale: 该词可指拆毁、废除或使失效。这里不是说个人能正式取消整套律法，而是说自己的行为等同于破坏、置废其权威；“废掉”保留这种有力度而略带张力的表达。
theological_decisions:
- issue: 个人行为如何“废掉”祖传律法
  choice: 保留“废掉”的强烈措辞
  alternative: 违背祖传的律法
  rationale: 希腊文使用καταλῦσαι，而非一般表示“违犯”的词。译作“违背”虽较易理解，却会削弱原文将个人背弃描述为拆毁或置废律法的修辞力度，因此不替作者消解这一张力。
- issue: πάτριον νόμον在犹太殉道语境中的所指
  choice: 祖传的律法
  alternative: 先祖的律法
  rationale: “祖传”明确体现继承关系，“律法”则保留νόμος在本语境中的宗教与规范含义，同时不额外加入后世宗派性术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“绝不会……以致”使论证清晰；“亲手废掉”保持原文的主体强调和修辞力度。全句适合年长律法教师在受逼迫时坚定陈词的语域。
