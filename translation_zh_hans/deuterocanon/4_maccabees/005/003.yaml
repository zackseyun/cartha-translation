  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
translation:
  language: zh_hans
  text: 但若有人不肯吃使人污秽的食物[a]，就要把他们用轮刑折磨[b]，处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“吃污秽的食物”或“吃被玷污的肉”。希腊语动词本身含有吃下会造成礼仪性污秽之物的意思，本句没有另行说明所吃的对象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在轮上施以酷刑”或“用轮刑碾折”。希腊语分词指一种与轮子有关的酷刑，具体施刑方式并未完全明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: 但若有人
  rationale: 在命令或威胁语境中引出另一种情况；“有人”自然表达不定复数 τινες，后文再用复数“他们”回指。
- source_word: μὴ θέλοιεν
  choice: 不肯
  rationale: 保留 θέλω 所表达的意愿层面，同时比直译为“不愿意”更符合此处拒绝服从命令的语境。
- source_word: μιεροφαγῆσαι
  choice: 吃使人污秽的食物
  rationale: 该复合动词本身表示吃下会造成礼仪性污秽之物，宾语并未另行明说；补出“食物”使中文完整，又不把它过度限定为肉类。
- source_word: τούτους
  choice: 他们
  rationale: 自然回指前面的不定复数 τινες。
- source_word: τροχισθέντας
  choice: 用轮刑折磨
  rationale: 该词指与轮子有关的刑罚或酷刑；译文明确其刑罚性质，但不武断指定具体的致残方式。
- source_word: ἀναιρεθῆναι
  choice: 处死
  rationale: 准确体现司法命令语气，比“杀死”更庄重，也符合上下文中的官方刑罚。
