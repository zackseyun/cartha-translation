lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: 于是
  rationale: 该短语承接前文并引出随即下达的命令；“于是”自然表达回应和推进，不拘泥于中性复数的字面形式。
- source_word: τροχοὺς
  choice: 那些轮子
  rationale: 保留希腊文“轮子”的具体称呼，不将刑具解释性地译成“刑架”；“那些”使有定、复数的所指在中文中清楚。
- source_word: εὐτρέπιζε
  choice: 预备好
  rationale: 准确表达命令将器具准备妥当，符合现代汉语习惯。
- source_word: τὸ πῦρ
  choice: 火
  rationale: 直接保留原文所指的火；中文无需机械表达希腊语冠词。
- source_word: ἔκφυσα
  choice: 吹得更旺
  rationale: 该动词描写向火吹气以增强火势；此译既保留“吹”的形象，也自然表达其结果。
- source_word: σφοδρότερον
  choice: 更旺
  rationale: 比较级表示火势需进一步加强；结合“吹火”的中文搭配译为“更旺”，简洁而明确。
