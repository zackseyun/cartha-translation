  text: 'And having taken the right to speak, he began to address the assembly as follows:'
translation:
  language: zh_hans
  text: 他获准发言后，就开始向众人这样演说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: 获准……后
  rationale: 不定过去时分词表示先于主句动作发生的情形；与ἐξουσίαν合译为“获准”，比直译“拿到”更符合现代汉语，也切合获准发言的语境。
- source_word: τοῦ λέγειν
  choice: 发言
  rationale: 带冠词不定式限定ἐξουσίαν的内容，即说话或发言的许可；“发言”简洁自然，适合公开陈述的场景。
- source_word: ἐξουσίαν
  choice: 获准
  rationale: 此处可表示权利、权限或许可。结合λαβὼν译作“获准”，保留取得发言许可之意，又不夸大为正式权柄。
- source_word: ἤρξατο
  choice: 开始
  rationale: 准确表达ἄρχομαι的起始义，并保持自然、庄重的现代汉语。
- source_word: δημηγορεῖν
  choice: 向众人……演说
  rationale: 该词指面向公众或会众发表讲话。“向众人演说”保留公开讲话的含义；原文并未明说正式“大会”，故避免过度具体化。
- source_word: οὕτως
  choice: 这样
  rationale: 用于引出随后演说的内容；“这样”在中文叙事中自然，并与句末冒号配合。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。将分词结构处理为“……后”，清楚呈现动作次序；以“获准发言”表达λαβὼν…ἐξουσίαν，避免生硬的“取得权利”。“向众人演说”传达δημηγορεῖν的公开讲话色彩，同时不加入原文未明确指明的制度性场合。
