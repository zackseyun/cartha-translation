base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: zh_hans
  text: 因为你固然会暴虐地统治不敬虔的人；但对于我关乎敬虔的理性判断[a]，你无论借言语还是借行动，都不能加以支配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我关乎敬虔的理性思量。”希腊语 λογισμός 是《马加比四书》的关键词，指经过理性思考而作出的道德判断。
    reason: 说明核心术语的可译范围及其在全书中的主题意义。
lexical_decisions:
- source_word: ἀσεβῶν
  choice: 不敬虔的人
  rationale: 这是属格复数，受 τυραννήσεις 支配，指暴君施暴统治的对象；译法与下文“敬虔”形成清楚的宗教伦理对照。
- source_word: τυραννήσεις
  choice: 可以……施行暴政
  rationale: 保留动词所含的暴君式压迫意味，并以“固然……但……”体现 μέν…δέ 的让步对照。
- source_word: τῶν ἐμῶν … λογισμῶν
  choice: 我那些……理性判断
  rationale: λογισμός 是《马加比四书》的关键词，所指不只是一般想法，而是经过理性思量而形成的道德判断。
- source_word: περὶ τῆς εὐσεβείας
  choice: 关乎敬虔的
  rationale: εὐσέβεια 在本书中指向对上帝及其律法的虔敬忠诚；“敬虔”自然地保留其宗教伦理内涵。
- source_word: δεσπόσεις
  choice: 支配
  rationale: 表达成为主人、取得控制权之意，并与前面的暴政统治相呼应，同时适用于言语和行动两种手段。
- source_word: οὔτε λόγοις … οὔτε δι᾽ ἔργων
  choice: 既不能用言语……也不能用行动
  rationale: 保留希腊文成对否定及言语与实际行为之间的平衡；不擅自限定为劝说、威胁或酷刑。
theological_decisions:
- issue: 如何保留 ἀσεβῶν 与 εὐσεβείας 的宗教伦理对照
  choice: 不敬虔的人／敬虔
  alternative: 不虔的人／虔敬；亵渎者／虔诚
  rationale: “不敬虔／敬虔”在现代汉语中清楚、庄重，并保留原文围绕对上帝忠诚与否所建立的对照。
- issue: λογισμῶν 所指是一般思想还是理性道德判断
  choice: 理性判断
  alternative: 思量；信念；理性的思考
  rationale: 本书以 λογισμός 表达支配激情的理性思量。“理性判断”既保存这一主题，也避免将其化约为纯粹情感性的信念。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“固然……但……”再现原文让步对照；两个“支配”有意保留修辞重复和外在暴政无法控制内在理性判断的张力。
