  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: zh_hans
  text: 并且，它教导人实行公义[a]，使人在一切行为上都公平行事；又教导人敬虔，使人唯独敬拜那位真实存在的上帝[b]，以与他的伟大相称的方式。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希腊词δικαιοσύνη可指道德上的正直，也可指正义、公正；本节下文强调公平行事。
    reason: lexical_alternative
  - marker: b
    text: 也可译“唯独敬拜真神”。希腊文直译强调“那位存在的上帝”，与虚假的神明形成对比。
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνην
  choice: 正义
  rationale: 在这里，δικαιοσύνη与随后表示平等、公正行事的ἰσονομεῖν紧密相连，因此译作“正义”较能体现本节的伦理和公平意涵；“公义”仍是可取的传统译法，列入脚注。
- source_word: παιδεύει
  choice: 教人
  rationale: 此词指伦理上的教导和塑造；“教人”自然简明，并能与下文“又教人敬虔”形成对应。
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: 在一切品行上
  rationale: ἤθη涉及习惯、性情和行为方式；此译概括其全部伦理生活范围，同时保持现代汉语的自然表达。
- source_word: ἰσονομεῖν
  choice: 秉公而行
  rationale: 该词含平等对待、依公平原则行事之意；“秉公而行”既保留公平无偏的含义，也与“品行”语境自然衔接。
- source_word: εὐσεβείαν
  choice: 敬虔
  rationale: 此词表示对神的虔敬与敬畏；“敬虔”是简洁而庄重的宗教伦理用语。
- source_word: σέβειν
  choice: 敬拜
  rationale: 以神为直接宾语时，此词表达宗教性的尊崇与礼敬；“敬拜”能清楚传达这一层面。
- source_word: μόνον τὸν ὄντα θεὸν
  choice: 唯独……那位真实存在的上帝
  rationale: ὄντα强调这位神确实存在，与虚假之神形成对比；此译保留存在性的强调，没有简化成仅表示属性的“真神”。
- source_word: μεγαλοπρεπῶς
  choice: 以配得其尊荣的方式
  rationale: 该副词表示以符合伟大、尊贵身份的庄严方式行事；此译在汉语中比直译“宏伟地”自然，并保留敬拜须与神的尊荣相称之意。
theological_decisions:
- issue: δικαιοσύνην在伦理教化语境中的译法
  choice: 正义
  alternative: 公义
  rationale: 本节以ἰσονομεῖν进一步说明公平、平等的行为，因此正文采用“正义”；同时保留“公义”这一涵盖道德正直的可能译法，避免排除原词较宽的语义。
- issue: μόνον τὸν ὄντα θεὸν的存在性强调
  choice: 唯独……那位真实存在的上帝
  alternative: 唯独真神
  rationale: 希腊文使用ὄντα，字面强调“存在着”的神，隐含与不存在的假神对照。正文保留这一强调；较简洁的“唯独真神”列入脚注。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以分号呈现原句中“教人行正义”与“教人敬虔”的平行结构；用“它”承接上文所指的律法或理性等语法主语，不在本节擅自补明。所有脚注标记均置于相关正文处。
