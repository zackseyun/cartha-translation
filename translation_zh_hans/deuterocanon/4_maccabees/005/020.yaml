  text: For to break the law in small matters and in great matters is equivalent[a].
translation:
  language: zh_hans
  text: 因为在小事上和大事上违背律法是同等的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论在小事上还是在大事上触犯律法，都是一样的。”
    reason: 提供παρανομεῖν与ἰσοδύναμόν较口语而同样可行的译法，并保留大小事项对举。
lexical_decisions:
- source_word: παρανομεῖν
  choice: 违背律法
  rationale: 该动词指违反法律或律法而行；“违背律法”在现代汉语中清楚自然，并保留原文的法律与伦理意味。
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: 在小事上和大事上
  rationale: 两个中性复数形容词作名词用，形成大小事项的对举；此译简洁且符合现代汉语表达。
- source_word: ἰσοδύναμόν
  choice: 同等
  rationale: 该词本义为力量、效力或价值相等。“同等”保留强烈的等同性陈述，同时不擅自断定一切后果或惩罚都完全相同。
- source_word: γὰρ
  choice: 因为
  rationale: γὰρ承接上文，表达解释或理由；“因为”明确呈现这一逻辑关系。
theological_decisions:
- issue: 较小与较大违法行为之间的道德等同性
  choice: 译作“都是同等的”，表明无论事情大小，违背律法这一行为具有同等性质。
  alternative: 可理解为二者都构成违法，但未必在严重程度、后果或惩罚方面完全相同。
  rationale: ἰσοδύναμόν ἐστιν提出强烈的等同性，但经文本身没有具体界定这种等同性涉及哪些层面，因此译文保留其张力，不扩展为完整的刑罚或后果理论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“小事上和大事上”保留原文简洁对举；“违背律法”适合本书犹太律法语境。
