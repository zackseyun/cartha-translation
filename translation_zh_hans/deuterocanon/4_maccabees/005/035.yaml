  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: zh_hans
  text: 我也绝不使你蒙羞[a]，哲学理性啊；我也绝不背弃你[b]，尊贵的祭司职分和对律法的认识啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哲学理性”所译的希腊语呼语也可译作“哲理”或“哲学性的理性”；原文表达紧凑，带有风格化色彩。
    reason: lexical_alternative
  - marker: b
    text: “尊贵的祭司职分和对律法的认识”也可译作“受尊崇的祭司身份和律法学识”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταισχυνῶ
  choice: 使……蒙羞
  rationale: 该词为将来主动语态，带有明显的荣辱意味；“使你蒙羞”既贴近原义，也自然体现说话者不愿辱没所称呼之对象的誓言。
- source_word: φιλόσοφε λόγε
  choice: 哲理啊
  rationale: λόγος在此指理性、道理，φιλόσοφος则赋予其哲学性质；“哲理”在现代汉语中凝练自然，并保留拟人化的直接呼语。其紧凑而风格化的希腊语构造另以脚注说明。
- source_word: ἑξαρνήσομαί
  choice: 背弃
  rationale: ἐξαρνέομαι所表达的不只是口头否认，更有否认关系、拒绝效忠之意；“背弃”适合此处对信念与神圣职分的忠诚语境。
- source_word: ἱεροσύνη τιμία
  choice: 尊贵的祭司职分
  rationale: ἱεροσύνη可指祭司身份、职分或祭司制度；此处与τιμία连用，“尊贵的祭司职分”清楚保留其价值与荣誉色彩。
- source_word: νομοθεσίας ἐπιστήμη
  choice: 对律法的认识
  rationale: ἐπιστήμη指知识、认识或专门学识；νομοθεσία可指立法、律法的颁布或所颁之律法。在本书犹太语境中，“对律法的认识”通顺而不过度限定其技术性。
theological_decisions:
- issue: 经文中拟人化呼语的结构
  choice: 把“哲理”视为第一个直接呼语，并把“尊贵的祭司职分和对律法的认识”作为后续并列、拟人化的神圣承诺对象。
  alternative: 把后两个名词短语理解为对“哲理”的同位说明，或将全句宽泛译成不放弃哲学和犹太传统。
  rationale: 希腊文连续使用第二人称单数代词σε，并以呼格和名词性表达形成修辞性的直接称呼。译文保留这种拟人化及其结构张力，不把哲理、祭司职分和律法知识合并为单一教义概念。
- issue: νομοθεσία的范围
  choice: 译作“律法”，使其在犹太语境中自然指向所领受的律法，同时不过度明指摩西。
  alternative: 译作“立法”“律法的颁布”或“摩西律法”。
  rationale: 原词本身可涵盖立法行为与既定律法；“律法”保留语境所指，也避免把原文没有明说的专名加入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“绝不”传达两个将来式誓言般的坚定语气；以破折号和感叹号呈现连续呼语及拟人化修辞。正文中的[a]、[b]均与脚注对应。
