  text: Therefore[a], indeed, we consider it right in no way to break the law.
translation:
  language: zh_hans
  text: 所以，我们确实认为，无论如何都不应违背律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 表示由上文推出结论；“所以”在现代汉语中自然清楚，并保留推论关系。
- source_word: δὴ
  choice: 确实
  rationale: 加强断言的语气；“确实”保留强调作用，又不过度增译。
- source_word: κατʼ οὐδένα τρόπον
  choice: 无论如何都不
  rationale: 表达绝对否定，现代汉语自然有力，保留原文不容例外的语气。
- source_word: παρανομεῖν
  choice: 违背律法
  rationale: 该动词指行事违反法律；结合本段犹太祖传律法的语境，“违背律法”兼顾法律与伦理意味。
- source_word: ἀξιοῦμεν
  choice: 我们认为……不应
  rationale: 这里表示对何为合宜、正当之事所作的判断；用“认为……不应”可自然承接不定式，并传达规范性的判断。
theological_decisions:
- issue: νόμος所指律法的性质
  choice: 译作“律法”，但不在正文中明确加上“摩西”或“祖传”等限定语。
  alternative: 译作“法律”或明确译作“摩西律法”。
  rationale: 本节希腊文并无修饰语；上下文虽指向犹太人的祖传律法，正文仍宜保留原文在本句中的概括表达，避免添加未明说的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”承接上文，“确实”体现δὴ的强调；句式简洁，适合普通读者诵读。
