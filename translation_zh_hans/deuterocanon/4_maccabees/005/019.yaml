  text: So do not suppose this to be a small sin[a], if we were to eat polluted food.
translation:
  language: zh_hans
  text: 因此，若我们吃了不洁的食物，不要以为这是一桩小罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若我们吃了被玷污的食物。”希腊语的这个动词把“吃”与食用礼仪上不洁或遭亵渎之物的意思合在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  choice: 不要以为
  rationale: νομίζω在这里表示作出判断；“不要以为”自然地传达了不可低估此事的劝诫。
- source_word: μικρὰν ... ἁμαρτίαν
  choice: 一桩小罪
  rationale: 直译形容词与名词的关系，保留说话者强调不可把这种罪看轻的意思。
- source_word: ταύτην
  choice: 这
  rationale: 指向眼下所谈的行为，后面的条件从句说明其具体内容，无须增译为“这件事”。
- source_word: εἰ
  choice: 如果
  rationale: 保留条件性；上下文中的假设意味可由整句自然表达。
- source_word: μιεροφαγήσαμεν
  choice: 我们吃了被玷污的食物
  rationale: 这一复合动词浓缩了食用不洁或遭亵渎之物的意思；补出“食物”使中文清楚，“被玷污”保留其礼仪与宗教层面的含义，而不误解为普通污染。
theological_decisions:
- issue: μιεροφαγήσαμεν所含不洁观念应表达得多明确
  choice: 吃了被玷污的食物
  alternative: 吃了不洁之物
  rationale: 上下文涉及因食用禁物而违背圣洁要求，并非单指物理污染；正文采用“被玷污”保留宗教意味，脚注列出较简洁的可能译法。
- issue: 是否把罪的轻重作神学解释
  choice: 保留“小罪”的直陈表达
  alternative: 轻微的过犯
  rationale: 原文明确以μικράν修饰ἁμαρτίαν，重点是警告不可低估，译文不进一步界定罪的等级或性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一桩小罪”比“一项小罪”自然，并保留原文的直接力度；冒号清楚显示后面的条件从句是在说明“这”所指的行为。
