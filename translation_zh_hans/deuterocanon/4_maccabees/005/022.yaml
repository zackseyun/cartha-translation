  yaml_path: translation/deuterocanon/4_maccabees/005/022.yaml
  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: zh_hans
  text: 可是，你却嘲笑我们的哲学，仿佛我们并没有在其中过着蒙福的生活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛我们并没有在其中幸福地生活”，又或：“仿佛我们并没有在其中过着有美名的生活。”这里的希腊词十分罕见，可能表示蒙福、幸福或享有美名。
    reason: 保留εὐλογιστίας罕见且不确定的语义范围。
lexical_decisions:
- source_word: χλευάζεις
  choice: 嘲笑
  rationale: 该动词表示讥嘲、蔑视；“嘲笑”自然直接，保留了当面对质的语气。
- source_word: φιλοσοφίαν
  choice: 哲学
  rationale: 本书有意识地以“哲学”描述犹太人的理性、敬虔与生活实践；保留作者的论述范畴，避免提前释为“教义”或“生活方式”。
- source_word: ὥσπερ
  choice: 仿佛
  rationale: 引出对方所持的不实假定；“仿佛”在现代汉语中简洁而庄重。
- source_word: εὐλογιστίας
  choice: 蒙福的生活
  rationale: 此罕见名词的意义可能涉及福乐、幸福或美名。“蒙福”保留其正面且带有道德—宗教意味的色彩，同时以脚注注明其他可能。
- source_word: ἐν αὐτῇ βιούντων
  choice: 在其中过……生活
  rationale: 贴近希腊文“在其中生活”，并让“其中”明确回指前面的“哲学”，不将其过度解释为单纯遵守一套规则。
theological_decisions:
- issue: φιλοσοφία在《马加比四书》中的含义
  choice: 正文保留“哲学”
  alternative: 我们的生活方式；我们的教导
  rationale: 作者以哲学语言呈现犹太人的理性与敬虔生活。保留该词可避免套入较窄的宗派或教义标签。
- issue: εὐλογιστίας的语义范围
  choice: 译为“蒙福的生活”，并以脚注保留歧义
  alternative: 幸福地生活；生活得有美名
  rationale: 该罕见词既可能指福乐，也可能含受称许、享有美名之意；正文采用较能保留道德和宗教色彩的译法，但不把其他可能排除。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“可是，你却”保留直接反驳的力度；“在其中过……生活”尽量贴近原文结构，同时避免生硬直译。
