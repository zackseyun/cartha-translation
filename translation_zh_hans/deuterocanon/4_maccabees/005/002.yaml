  yaml_path: translation/deuterocanon/4_maccabees/005/002.yaml
  text: He ordered the guards to drag away each one of the Hebrews and force them to taste pork and meat sacrificed to idols[b][a];
translation:
  language: zh_hans
  text: 他命令卫兵[a]把希伯来人一个一个拖走，并强迫他们尝猪肉和祭过偶像的食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“护卫”；直译“持矛者”。
    reason: 保留δορυφόροι在职能称谓与字面意义之间的词义范围。
  - marker: b
    text: 或译“祭过偶像的肉”。
    reason: εἰδωλοθύτων既可泛指献给偶像的食物，也可在本句中理解为祭过偶像的肉。
lexical_decisions:
- source_word: παρεκέλευεν
  choice: 他命令
  rationale: 该动词表示带权威的吩咐；未完成时在叙事中可呈现当时正在进行或反复发出的命令，但汉语用“命令”即可自然承载，不必强加“不断”。
- source_word: τοῖς δορυφόροις
  choice: 卫兵[a]
  rationale: 本义为“持矛者”，也可指君王身边的护卫；此处译“卫兵”最符合执行强制命令的语境，同时以脚注保留字面和身份上的其他可能。
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: 把希伯来人一个一个
  rationale: “一个一个”保留ἕνα ἕκαστον强烈的逐一、个别处理之意；“希伯来人”直接对应Ἐβραίων，不改译为“犹太人”。
- source_word: περισπᾶσθαι
  choice: 拖开
  rationale: 该词在此表示把人强行拉开或拖走；“拖开”既传达暴力强制，也避免凭空指定被带往何处。
- source_word: κρεῶν ὑείων
  choice: 猪肉
  rationale: 直指猪的肉；“猪肉”是现代汉语自然、清楚的表达，并保留违反饮食禁令的关键内容。
- source_word: εἰδωλοθύτων
  choice: 祭过偶像的食物[b]
  rationale: 该词可泛指献给偶像之物，也可能在本句与“肉”并列而特指祭偶像的肉；正文用“食物”保留较宽词义，脚注说明较窄译法。
- source_word: ἀναγκάζειν
  choice: 强迫
  rationale: 准确表达外在强制和胁迫，语气直接而符合场景。
- source_word: ἀπογεύεσθαι
  choice: 尝
  rationale: 保留原词“尝、尝一点”的具体含义，不扩大为完整地吃下或参与宴食，也凸显即使尝一点也构成被迫违犯的张力。
theological_decisions:
- issue: Ἐβραίων的族群称谓
  choice: 希伯来人
  alternative: 犹太人
  rationale: 原文明确使用“希伯来人”；按原词翻译可保留其民族与历史色彩，不以较常见称谓将其同化。
- issue: ἀπογεύεσθαι所表示的参与程度
  choice: 尝
  alternative: 吃；食用
  rationale: 原文强调被迫“尝”，未明确说完整食用；如此保留哪怕最低程度接触禁食也形成道德与礼仪冲突的张力。
- issue: εἰδωλοθύτων所指范围
  choice: 祭过偶像的食物
  alternative: 祭过偶像的肉
  rationale: 该词可作实体词泛指献祭给偶像的食物，也可能因与κρεῶν并列而专指肉；正文采用较宽而自然的表达，并以脚注保留较窄理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一个一个拖开”呈现逐个强行带离的动作；脚注标记按[a]、[b]依次置于相关词语之后。
