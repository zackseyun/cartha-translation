  yaml_path: translation/deuterocanon/4_maccabees/005/036.yaml
  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: zh_hans
  text: 你也绝不能玷污我这因年老而可敬的口，也不能玷污我遵行律法的一生年岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέ ... οὐδὲ
  choice: 也绝不能……也不能
  rationale: 保留两个并列否定句式；结合语境表达说话者坚决断言对方无法使其受玷污。
- source_word: μιανεῖς
  choice: 玷污
  rationale: 准确传达宗教与道德层面的污损意味，并保留原文的强烈措辞。
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: 我这因年老而庄重的口
  rationale: 将γήρως理解为使这张口显得庄重可敬的原因，既贴近希腊语结构，也与审定英语咨询层的理解一致。
- source_word: νομίμου βίου
  choice: 一生守法的
  rationale: νόμιμος在本书语境中主要指遵守律法；用“守法”保留其简洁性，而“一生”自然表达βίος所指的整段生活。
- source_word: ἡλικίαν
  choice: 年岁
  rationale: 此处可指年龄、年纪或人生年岁；“年岁”与老年语境相称，并避免将其抽象化为人格或身份。
theological_decisions:
- issue: νόμιμος是否明确译作遵守摩西律法
  choice: 守法
  alternative: 遵守律法
  rationale: “守法”忠实而自然，也不额外补出原文未明说的律法名称；同时在上下文中仍可理解为忠于犹太律法。
- issue: 两个宾语与“玷污”的关系
  choice: 两处都明说“玷污”
  alternative: 第二处省略谓语
  rationale: 汉语中复现谓语可清楚保留希腊文并列结构，并呈现“口”与“年岁”这两个有意形成张力的受词，不擅自消解其修辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文以“口”和“年岁”作为被玷污对象的修辞张力；不添加解释性脚注。
