base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: zh_hans
  text: 所以，我们不吃污秽的食物[a]；因为我们相信律法是上帝所设立的，也知道世界的创造者在制定律法时，按本性体恤我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，我们不吃被玷污之物。”
    reason: 保留复合动词 μιεροφαγοῦμεν 较为直译的表达，并避免预断污秽如何作用于食者。
  - marker: b
    text: 希腊语也可理解为：“世界的创造者在制定律法时，体恤我们的本性。”
    reason: 保留 κατὰ φύσιν（“按本性”）与 συμπαθεῖ、ἡμῖν 的修饰关系所带来的表达差异。
lexical_decisions:
- source_word: διʼ οὐ
  choice: 所以
  rationale: 该短语承接上文，表达由前述理由所得的结论；现代汉语用“所以”自然清楚。
- source_word: μιεροφαγοῦμεν
  choice: 不吃玷污人的食物
  rationale: 这个复合动词表示吃被污染、能使人受玷污之物。译文补出希腊语动词中隐含的“食物”，符合饮食律法的语境，同时不把含义限定为某一套后来的礼仪术语。
- source_word: πιστεύοντες
  choice: 因为我们相信
  rationale: 分词在此说明拒绝食用这类食物的原因；“因为我们相信”明确表达其因果作用。
- source_word: θεοῦ καθέστασθαι τὸν νόμον
  choice: 律法是上帝所设立的
  rationale: 完成时不定式表明律法已经由上帝设立，并持续有效；“所设立的”兼顾设立的行动与现存效力。
- source_word: νόμον
  choice: 律法
  rationale: 冠词表明这里指特定的上帝律法，而非抽象意义上的法律。
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: 世界的创造者
  rationale: 直接保留称号的宇宙范围及其神学分量。
- source_word: νομοθετῶν
  choice: 在制定律法时
  rationale: 分词描写创造者施行立法的行动；此译法自然，并保持它与前文“律法”的联系。
- source_word: συμπαθεῖ
  choice: 体恤
  rationale: 该词可表示同感、同情或顾念；“体恤”既保留关怀和共感，也适合庄重的现代汉语。
- source_word: κατὰ φύσιν ἡμῖν
  choice: 我们的本性
  rationale: 与“体恤”合译为“体恤我们的本性”，表达创造者立法时顾念人天然的处境和构造，同时以脚注保留另一种句法理解。
theological_decisions:
- issue: 拒绝食用之物的性质
  choice: 拒绝吃会使人受玷污的食物
  alternative: 不吃被玷污之物；不以吃的行为玷污自己
  rationale: 复合动词本身包含“吃”与“玷污”的观念，语境又涉及受律法禁止的食物。正文作自然的显化处理，但不进一步规定其礼仪类别。
- issue: 创造者立法与“本性”的关系
  choice: 创造者在制定律法时体恤人的本性
  alternative: 创造者立法时按本性体恤我们
  rationale: ἡμῖν 与 συμπαθεῖ 自然构成“体恤我们”，而 κατὰ φύσιν 可修饰这种体恤，表示其合乎本性；然而该短语的确切依附关系并非毫无歧义，因此正文采用较自然的汉语表达，并在脚注中保留较贴近词序的另一读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“律法”“上帝”“创造者”等用语符合经文语域；句式避免古奥化。正文以最优对等为原则，同时用脚注保存希腊语复合动词及 κατὰ φύσιν 的真实歧义。
