  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: zh_hans
  text: 如果你就真理而妄自夸耀，又以自己受罚为代价[a]，竟连我也藐视，难道你还不从你们那空谈的哲学[b]中醒悟过来吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以自己受罚为代价”也可译作“给自己招来惩罚”或“以你自己的惩罚为凭”。原文介词短语与“藐视”的关系可表示结果、代价或相关情形；这里表达的是这种藐视终将使他本人受罚。
    reason: lexical_alternative
  - marker: b
    text: “空谈的哲学”也可译作“愚妄的哲学”“饶舌的哲学”或“喋喋不休的哲学”。该形容词可指空洞、愚妄或多言，以贬抑语气形容这种哲学。
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: 妄自夸耀
  rationale: 该分词指空洞、无根据的自我夸耀；“妄自夸耀”既保留动作意味，也传达贬义。
- source_word: περὶ τὸ ἀληθές
  choice: 对真理
  rationale: 表示夸耀所围绕或涉及的对象；“对真理妄自夸耀”在中文中凝练自然，又不把关系解释得过死。
- source_word: κἀμοῦ
  choice: 连我也
  rationale: κἀμοῦ由καί与ἐμοῦ缩合而成，含“也／甚至”的强调意味；“连我也”符合说话者受蔑视时的修辞语气。
- source_word: καταφρονήσεις
  choice: 藐视
  rationale: 该动词表示轻看、蔑视或以轻蔑态度不予理会；“藐视”简洁而庄重。
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: 不惜自取惩罚
  rationale: 介词短语的确切关系略有弹性，可指以自身受罚为代价或导致自身受罚；正文用自然中文表达这种反噬性的后果。
- source_word: οὐκ ἐξυπνώσεις
  choice: 难道你还不……醒悟过来吗
  rationale: 保留从睡眠中醒来的隐喻，同时“醒悟过来”自然表达从迷误中清醒；否定疑问句保留期待肯定回答的强烈反问。
- source_word: φλυάρου φιλοσοφίας
  choice: 空谈的哲学
  rationale: φλύαρος可指空洞、无聊、喋喋不休；“空谈的”比单纯“愚蠢的”更贴近其言语空泛的词源色彩，也适合中文搭配。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 原文为复数，可能把责备从眼前个人扩展到其所属群体或思想传统；译文保留数的区别，不改成单数。
theological_decisions:
- issue: 责问的修辞力度与“哲学”的含义
  choice: 译为尖锐的道德反问，并保留一般性的“哲学”一词
  alternative: 可意译为“难道你还不摆脱你们那荒谬的思想，清醒过来吗”
  rationale: 原文在犹太道德论证中使用哲学词汇，但这里没有给出后世意义上的技术性教义分类；保留其论战语气，同时不导入原文未明说的宗派或哲学体系。
- issue: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ所表达的因果关系
  choice: 正文译作“不惜自取惩罚”，表达藐视将使听者本人受罚
  alternative: 较直译可作“以你自己受罚为代价”或“给自己招来惩罚”
  rationale: 希腊介词短语允许结果、代价或所临情形等相近理解；正文采用通顺表达，脚注保留替代译法，避免将细微关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“妄自夸耀”“藐视”保持严厉的论战语气，以“醒悟过来”兼顾原文的苏醒隐喻和中文习惯。保留ὑμῶν的复数为“你们的”，使个人称呼与群体归属之间原有的张力不被抹平。
