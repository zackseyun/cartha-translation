  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: zh_hans
  text: “安提阿古啊，我们既已深信神圣的律法，便按着它而生活；我们认为，没有任何强制比顺服我们的律法更有力量。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θείῳ νόμῳ
  choice: 神圣的律法
  rationale: θείῳ 修饰 νόμῳ，表明律法具有神圣性质或来源；译作“神圣的律法”既自然，又不把含义进一步限定为“从上帝而来的律法”。
- source_word: πεπεισμένοι
  choice: 既被……所折服
  rationale: 这是 πείθω 的完成时被动分词，表示经劝服而处于坚定信服的状态。“被……所折服”保留被动意味和持续结果，也适合说话者宣示忠于律法的语境。
- source_word: πολιτευόμεθα
  choice: 照着它生活
  rationale: 该动词可指作为共同体成员行事、生活或为人；此处重点是以律法规范生活。“照着它生活”简明自然，并保留律法作为生活准则的含义。
- source_word: οὐδεμίαν ἀνάγκην
  choice: 没有任何外在强制
  rationale: ἀνάγκη 在安提阿古施压的语境中指强迫、胁迫，而非抽象的必然性；加“外在”显明与内在忠诚的对照，但不限定具体手段。
- source_word: βιαιοτέραν
  choice: 更有力量
  rationale: βιαιοτέραν 是比较级，含更强烈、更有强制力之意。与“强制”搭配时译作“更有力量”较自然，也保留两种力量之间的比较。
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: 比我们对自己律法的顺服
  rationale: εὐπείθεια 指乐意听从、顺服；πρὸς τὸν νόμον ἡμῶν 表示顺服所指向的是“我们的律法”。“对自己律法的顺服”在中文中避免连续重复“我们”，同时保留群体归属。
theological_decisions:
- issue: 如何表述摩西律法的神圣性质
  choice: 神圣的律法
  alternative: 上帝所赐的律法
  rationale: 希腊文 θείῳ νόμῳ 没有冠词，既可强调性质，也可暗示来源。“神圣的律法”保留这种开放性，不把原文明确化为只强调来源的措辞。
- issue: 顺服与强制之间的张力
  choice: 没有任何外在强制比我们对自己律法的顺服更有力量
  alternative: 没有任何强迫比服从我们的律法更强烈
  rationale: 原文有意把暴力强制与对律法的自愿顺服作比较。译文保留这种看似悖论的力量对照，不将其解释成特定的心理、政治或神学理论。
translation_notes:
  register: 采用庄重而清晰的现代书面汉语。保留对安提阿古的直接称呼，以及“外在强制”与“顺服”之间的修辞对比；不采用生硬的“履行公民生活”等直译。
