base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: zh_hans
  text: 因为我一直是贞洁的处女，也没有越过父家的界限；并且我一直守护着那被建造的肋骨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肋骨”也可译作“肋旁”或“身体的一侧”。“被建造”很可能呼应《创世记》中上帝把从亚当取出的肋骨（或肋旁）建造成女人的叙述；这里含蓄地表达她守住了贞洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: 一直是
  rationale: 该动词字面可译“成为”，但这里是回顾婚前持续保持的状态；“一直是”自然表达其延续性，同时不过度强调状态变化。
- source_word: παρθένος ἁγνή
  choice: 贞洁的处女
  rationale: παρθένος指处女，ἁγνή在此主要表达道德及性方面的纯洁；“贞洁的处女”保留两个词的含义。
- source_word: οὐχ ὑπερέβην πατρικὸν οἶκον
  choice: 没有越过父家的界限
  rationale: ὑπερέβην有“越过、逾越”之意；译文既可指没有越出父亲家室的范围，也可暗含没有违越其规范，保留原文的双重可能。
- source_word: ἐφύλασσον
  choice: 一直守护着
  rationale: 未完成时表示持续的行动；“一直守护着”体现持续保存、看守之意。
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: 那被建造的肋骨
  rationale: πλευρά可指“肋骨”或“身体的一侧”；与“建造”搭配明显呼应《创世记》中女人由亚当的肋骨或身体一侧被造成的叙述，因此正文采用“肋骨”，同时以脚注保留另一译法。
theological_decisions:
- issue: “被建造的肋骨”所含的《创世记》典故
  choice: 在正文保留隐喻，不直接释作“我保守了贞洁”
  alternative: 将其意译为“我保守了自己的贞洁”，或把 πλευρά 译作“身体的一侧”
  rationale: 希腊文刻意采用不寻常且带典故色彩的表达。保留这一意象可维持原文的文学张力，并避免把含蓄说法解释得过于明确。
- issue: “没有越过父家”的含义
  choice: 译作“没有越过父家的界限”
  alternative: 译作“没有离开父家”或“没有违背父家的规矩”
  rationale: 原文可能兼指实际没有离开父亲的家室，以及在道德上没有逾越其界限；所选译法不把含义限定为其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“父家”比“我父亲的房子”更能表达 πατρικὸν οἶκον 所指的父系家庭或家室；“越过……界限”保留空间与道德两层含义。
