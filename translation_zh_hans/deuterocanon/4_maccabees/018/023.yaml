base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: zh_hans
  text: 但亚伯拉罕的众子[a]，连同那位赢得奖赏的母亲，都聚集到列祖之地[b]；他们从上帝领受了纯洁不朽的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚伯拉罕的众子”指这些殉道的兄弟是亚伯拉罕的后裔。
    reason: referent_clarification
  - marker: b
    text: 原文动词也可译作“与列祖相聚”，着重表达加入他们的群体、与他们作伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: 亚伯拉罕的众子
  rationale: Ἀβραμιαῖοι 表示属于亚伯拉罕或出自亚伯拉罕，παῖδες 在本段具体指殉道的男性兄弟；“众子”既保留其男性所指，也表达他们是亚伯拉罕的后裔。
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: 和那位赢得奖赏的母亲一同
  rationale: ἀθλοφόρος 带有竞技、得奖的意象；“赢得奖赏”在现代汉语中自然，并比单说“得胜”更明确地保留原文的竞赛奖赏意象。
- source_word: εἰς πατέρων χῶρον
  choice: 进入列祖所在之地
  rationale: εἰς 表方向，χῶρος 指地方或区域，πατέρων 在此指先祖；译文保留目的地和祖先含义，却不把它具体解释为天堂、乐园等。
- source_word: συναγελιᾶζονται
  choice: 一同进入
  rationale: 该动词表示加入群体、与人相聚相伴；结合 εἰς 所引出的方向短语，“一同进入”自然呈现他们加入列祖群体的意思，脚注保留“相聚”的词义侧重。
- source_word: ψυχὰς
  choice: 灵魂
  rationale: ψυχή 可指生命或灵魂，但与“纯洁、不朽”连用，并处于殉道后奖赏的语境中，“灵魂”最贴合此处含义。
- source_word: ἁγνὰς καὶ ἀθανάτους
  choice: 纯洁不朽
  rationale: ἁγνός 表示纯洁、洁净，ἀθάνατος 表示不死或不朽；此译保留原文并列的两种性质。
- source_word: ἀπειληφότες ... παρὰ τοῦ θεοῦ
  choice: 从上帝领受了
  rationale: ἀπολαμβάνω 的分词表示已经领受或获得，παρά 加属格标明来源；“从上帝领受了”清楚保留完成性和来源。
theological_decisions:
- issue: εἰς πατέρων χῶρον 的来世图景
  choice: 列祖所在之地
  alternative: 列祖的境域；列祖的群体
  rationale: 原文指向与列祖相关的目的地或归宿，却没有明确称其为天堂、乐园或亚伯拉罕的怀抱；译文避免加入后来的具体教义术语。
- issue: ψυχὰς ἁγνὰς καὶ ἀθανάτους 的人观含义
  choice: 纯洁不朽的灵魂
  alternative: 纯洁不朽的生命
  rationale: 殉道与死后奖赏的语境支持“灵魂”，但译文仅保留原文所断言的纯洁与不朽，不进一步界定灵魂与身体的关系。
- issue: 不朽灵魂的来源
  choice: 从上帝领受
  alternative: 从上帝获得
  rationale: 原文明确以上帝为领受的来源；“领受”保留恩赐意味，但不额外说明这种领受发生的具体方式或时间机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列祖”符合经书语域且普通读者易懂；“赢得奖赏”保留希腊文的竞技意象，避免生硬直译为“负奖者”或泛化为“得胜的”。所有脚注标记均已置于正文相应位置。
