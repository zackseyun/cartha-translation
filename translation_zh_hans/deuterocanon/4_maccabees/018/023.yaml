  naturalness: “一同进入列祖所在之地”基本通顺，但“聚集到列祖之地”更能同时表达συναγελιᾶζονται所含的相聚、加入群体之意，并与εἰς的趋向相协调。将后置分词另成分句，也使汉语句法更清楚自然。
  terminology: “亚伯拉罕的众子”“赢得奖赏的母亲”“列祖之地”“纯洁不朽的灵魂”均适合庄重的现代汉语经书语域。“上帝”一致且忠实于ὁ θεός。
