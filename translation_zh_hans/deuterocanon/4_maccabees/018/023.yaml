revisions:
- from: 但亚伯拉罕的众子[a]和那位赢得奖赏的母亲一同进入列祖所在之地[b]，从上帝领受了纯洁不朽的灵魂。
  to: 但亚伯拉罕的众子[a]，连同那位赢得奖赏的母亲，都聚集到列祖之地[b]；他们从上帝领受了纯洁不朽的灵魂。
  rationale: 修订将“从上帝领受”的主语明确限定为“众子”，以反映希腊文阳性复数分词的语法指向，避免无依据地断言母亲也领受灵魂。同时以“聚集到”较完整保留原动词的结伴、相聚意味及介词短语的趋向性；并未把“列祖之地”具体化为任何后世的来世术语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:11Z'
