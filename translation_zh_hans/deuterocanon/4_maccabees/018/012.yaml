  yaml_path: translation/deuterocanon/4_maccabees/018/012.yaml
  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: zh_hans
  text: 那位热心的[a]非尼哈向我们说话；在火中的[b]哈拿尼雅、亚撒利雅和米沙利教导你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热心的”也可译作“满有热忱的”或“那热心者”；希腊词强调非尼哈堪为榜样的热忱。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在火中的哈拿尼雅、亚撒利雅和米沙利。”这个短语以他们在火中所受的考验来指称这三人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 曾向我们说话
  rationale: 未完成时描绘持续或反复的言说；“曾……说话”在现代汉语中自然，也避免将其压缩为一次性的“说了”。
- source_word: ζηλωτὴν
  choice: 热心者
  rationale: 该名词指以热忱著称的人；“热心者”保留其典范性的热忱，同时避免“奋锐党人”等后世党派含义。
- source_word: Φινεές
  choice: 非尼哈
  rationale: 采用现代中文圣经传统中常见的人名形式。
- source_word: ἐδίδασκεν
  choice: 也曾教导
  rationale: 未完成时可呈现持续、反复或修辞上鲜活的教导作用；“曾教导”保持自然，并不强行断定这种作用延续到何种程度。
- source_word: τοὺς ἐν πυρὶ
  choice: 在火中的
  rationale: 保留希腊文对三人的限定语，指出他们是在火中受考验的那些人，不增补“火窑”等原文未明说的词。
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: 哈拿尼雅、亚撒利雅和米沙利
  rationale: 采用这些希伯来名字在现代中文圣经语境中的通行形式，并以自然汉语列举。
theological_decisions:
- issue: 典范人物如何“说话”和“教导”
  choice: 按修辞性的未完成时表达：非尼哈和火中的三人借其被记述的榜样向听众说话、施教。
  alternative: 也可将动词理解为鲜活的历史叙述，较少强调其持续的典范作用。
  rationale: 希腊文两个未完成时容许持续、反复或鲜活叙述的理解。译文保留“曾……说话／曾教导”的开放性，不把这种修辞提升为额外的教义断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留两组未完成时的延续性暗示，并用分号呈现平行结构；人名采用常见中文圣经形式。
