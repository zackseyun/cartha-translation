  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: zh_hans
  text: 啊，亚伯拉罕后裔的子孙、以色列的儿女啊[a]，你们要听从这律法，并要凡事敬虔度日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以“亚伯拉罕的后裔、后代、儿女”等称谓层层呼告，着重强调听众承袭自祖先的身份。
    reason: lexical_alternative
  - marker: b
    text: “敬虔度日”也可译作“凡事行事敬虔”或“以敬畏神的态度生活行事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: 啊……哪
  rationale: 以现代汉语感叹词与呼格语气词共同保留原文庄重而强烈的呼告语气。
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι παῖδες
  choice: 亚伯拉罕后裔的子孙
  rationale: 原文以“种裔、后代、儿女”等亲属词层叠强调祖先身份；此译保留层叠感，同时避免生硬直译为“种子的后代儿女”。
- source_word: Ἰσραηλεῖται
  choice: 以色列人
  rationale: 采用现代汉语通行的民族称谓，并以“哪”标明呼格。
- source_word: πείθεσθε
  choice: 听从
  rationale: 与“律法”搭配时表示接受其权威并遵行；“听从”兼顾服从和回应，不限于内心被说服。
- source_word: τῷ νόμῳ τούτῳ
  choice: 这律法
  rationale: 指语境中以色列祖传的律法；保留指示词“这”，不额外加入“摩西”等原文没有的限定。
- source_word: πάντα τρόπον
  choice: 在一切事上
  rationale: 自然表达行为范围的全面性，对应“以每一种方式”。
- source_word: εὐσεβεῖτε
  choice: 敬虔度日
  rationale: 该动词指敬畏神并以相应方式生活；“敬虔度日”体现持续、可见的宗教伦理实践，较单说“虔诚”更具行动性。
theological_decisions:
- issue: “这律法”的所指
  choice: 保留为“这律法”，由上下文指向以色列的祖传律法
  alternative: 明译为“这摩西律法”或泛指一般道德法则
  rationale: 对以色列人的呼告及全书语境支持祖传律法这一所指，但原文本节没有“摩西”一词，因此不将解释写入正文。
- issue: εὐσεβεῖτε 的宗教伦理含义
  choice: 译为“敬虔度日”
  alternative: “要虔诚”“要敬畏神”“要行敬虔的事”
  rationale: 保留敬神与生活实践相连的张力，不把词义缩减为内在态度，也不添加原文未明说的神学对象。
translation_notes:
  register: 采用庄重、可诵读的现代标准汉语。“啊……哪”保留修辞性呼告；正文依次呈现祖先身份、民族身份和两项命令，并避免文言化或宗派化措辞。
