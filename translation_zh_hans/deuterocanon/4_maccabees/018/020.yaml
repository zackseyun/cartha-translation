base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: zh_hans
  text: 那一天何等苦涩，却又并非苦涩[a]！当那苦涩的希腊人的暴君在残酷的大锅中点起火来，又怀着沸腾的怒气，把七个少年带到弩炮[b]上，再带去受他的酷刑时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文将这一天既称为“苦涩”，又称为“并不苦涩”，保留了一个本句没有进一步解释的悖论。
    reason: 说明原文修辞张力，而不添加本句未明说的神学解释。
  - marker: b
    text: “弩炮”或译“刑架”或“刑具”。这个希腊词通常指弩炮一类的投射器械；但在这里的酷刑语境中，很可能指用来折磨人的装置。
    reason: 保留καταπέλτης的通常词义，并交代其在上下文中的可能含义。
lexical_decisions:
- source_word: πικρᾶς / πικρὸς
  choice: 苦涩 / 苦毒
  rationale: 用同一“苦”字呼应原文反复出现的词根，同时分别自然地形容日子和暴君；既保留修辞关联，也避免生硬地完全同词复现。
- source_word: Ἑλλήνων τύραννος
  choice: 希腊人之暴君
  rationale: 保留Ἑλλήνων的复数属格关系及原文略显庄重的表达，不武断地将其限定为单纯的族裔形容词“希腊暴君”。
- source_word: πῦρ φλέξας λέβησι ὠμοῖς
  choice: 在残酷的大锅中点燃了火
  rationale: λέβης译作“大锅”，ὠμός依语境取“残酷”义；按原文介词关系保留火与锅的紧密联系，不额外指定火是在锅内还是锅下。
- source_word: ζέουσιν θυμοῖς
  choice: 怀着沸腾的怒气
  rationale: 保留“沸腾”的热力意象，使之与前文烈火和大锅形成呼应；复数θυμοῖς在汉语中自然地概括为“怒气”。
- source_word: καταπέλτην
  choice: 弩炮
  rationale: 采用该词通常所指的投射武器，同时以脚注说明在本段刑罚语境中也可能指某种刑具。
- source_word: βασάνους αὐτοῦ
  choice: 他的酷刑
  rationale: “酷刑”准确表达βάσανοι在此处的折磨、刑罚意义，“他的”保留αὐτοῦ并显明暴君的施刑关系。
- source_word: τοὺς ἑπτὰ παῖδας
  choice: 七个少年
  rationale: παῖδες可指孩子、男孩、儿子或少年；“少年”保留年龄和男性语感，又不把原词未明说的亲子称谓直接写入正文。
theological_decisions:
- issue: καὶ οὐ πικρᾶς的修辞悖论
  choice: 却又并不苦涩
  alternative: 并不苦涩 / 虽不苦涩
  rationale: 原文同时肯定和否定那一天的“苦涩”；正文保留这份张力，不直接替作者解释为苦难中的荣耀或殉道所得。
- issue: 殉难语境中καταπέλτης的含义
  choice: 正文作“弩炮”，脚注说明也可能是刑具
  alternative: 刑架 / 刑具
  rationale: 正文以该词通常的词典义为锚，同时承认在施刑场景中它很可能指用于折磨人的器械，避免过度确定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文未完句式，以逗号收束本节，因为希腊文本在“七个少年”之后仍承接下文；“苦涩—苦毒”维持原文的重复修辞。
