  yaml_path: translation/deuterocanon/4_maccabees/018/002.yaml
  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
translation:
  language: zh_hans
  text: 知道敬神的理性是情欲的主宰[a]；它所主宰的不仅是内在的情欲，也包括外在的痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬神的理性”也可译作“敬虔的理性”。这是《马加比四书》的核心用语，指由对神的敬畏和虔敬所塑造的理性。
    reason: lexical_alternative
  - marker: b
    text: 希腊文区分内在的πάθη（激情、欲望或冲动）与外在的πόνοι（痛苦或苦难）。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: 因为他们知道
  rationale: 分词承接上下文，并说明他们能够忍受的认知根据；译出因果色彩，但不把它处理成独立命题。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在本书中是受理性管束的内在激情、欲望和冲动；“情欲”保留哲学伦理色彩，又与后文表示痛苦的πόνοι有别。
- source_word: δεσπότης
  choice: 主宰
  rationale: 表达支配和统御权，适合伦理哲学语境，也避免使用可能被误解为神圣称号的“主”。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  rationale: εὐσεβής强调对神的敬虔，λογισμός指理性判断或推理能力；此译保留本书核心概念的宗教与理性两方面。
- source_word: τῶν ἔνδοθεν
  choice: 内在的情欲
  rationale: 希腊文为名词化表达，具体所指由前面的πάθη补足；显译为“内在的情欲”，使中文清楚自然。
- source_word: τῶν ἔξωθεν πόνων
  choice: 外来的痛苦
  rationale: πόνοι指痛楚、苦难，与内在πάθη形成对照；“外来的”自然表达由外部施加或临到的痛苦。
theological_decisions:
- issue: 如何翻译本书纲领性用语ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  alternative: 敬虔的理性；虔敬的理性
  rationale: “敬神的理性”明确表明这里不是脱离信仰的世俗理性，而是由对神的敬畏和虔敬塑造的理性，同时不引入特定宗派解释。
- issue: 理性对外在痛苦的“主宰”应如何表达
  choice: 能胜过外来的痛苦
  alternative: 能作外在痛苦的主宰
  rationale: 希腊文将δεσπότης同时支配πάθη与πόνοι。中文若直说“作痛苦的主宰”较生硬；“胜过”保留能够不受痛苦支配之意，同时不暗示痛苦本身不存在。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主宰、克制、胜过”呈现伦理论述的力度；补出“他们”和两处动词，是为使希腊分词及并列结构在中文中通顺，未改变内在情欲与外在痛苦的对照。
