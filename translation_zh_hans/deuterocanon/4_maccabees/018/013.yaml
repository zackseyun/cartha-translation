  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: zh_hans
  text: 他也颂扬了在狮子坑[a]里的但以理，也称他为有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“狮子洞”。希腊文直译为“狮子的坑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: 颂扬
  rationale: δοξάζω可表示使之得荣耀、尊崇或赞美。此处宾语是但以理；“颂扬”既保留原文高昂的赞誉语气，也避免现代汉语中“荣耀某人”可能造成的不自然或敬拜意味。未将其弱化为较平的“尊敬”。
- source_word: ἐν λάκκῳ λεόντων
  choice: 在狮子坑里
  rationale: λάκκος本义为坑、穴或蓄水坑。“狮子坑”直接反映希腊语表达，同时在现代汉语中自然；传统说法“狮子洞”列入脚注。
- source_word: ἐμακάριζεν
  choice: 称他为有福
  rationale: μακαρίζω指称某人为有福或认为某人有福。“称他为有福”保留判断、宣称的动词力量，不把它处理成赐福行为。
- source_word: καὶ ... καί
  choice: 也……并
  rationale: 两个καί具有累加和连接作用。汉语若机械重复两个“也”略显生硬，因此用“也……并”自然呈现连续赞述，同时保留第二动作的并列关系。
- source_word: ὃν
  choice: 他
  rationale: 关系代词回指但以理。现代汉语用“并称他为有福”比照搬关系从句更清楚自然，所指不变。
theological_decisions:
- issue: 对但以理使用高强度赞誉语言
  choice: 译为“颂扬”，表达对但以理的高度赞誉，但不暗示敬拜。
  alternative: 可译为“尊崇”或“赞美”；“荣耀”更贴近部分传统神学措辞，却在现代汉语中容易被理解为专用于神的表达。
  rationale: 原文确实以δοξάζω赞誉但以理，不宜将力度消解为一般的“尊敬”。“颂扬”保留修辞高度，也符合人作为受赞誉对象的汉语习惯。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“颂扬”保持原文赞辞式语气；“称他为有福”清楚保留μακαρίζω的宣称含义。脚注标记[a]已置于正文对应位置。
