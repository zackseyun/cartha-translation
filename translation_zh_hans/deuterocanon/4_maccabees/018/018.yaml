  yaml_path: translation/deuterocanon/4_maccabees/018/018.yaml
  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
translation:
  language: zh_hans
  text: 因为她没有忘记摩西所教的那首歌[a]，那首歌教导说：“我要使人死，也要使人活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句呼应《申命记》32:39的《摩西之歌》。该处有些译本译作“我使人死，也使人活”；本节希腊文用将来时：“我要使人死，也要使人活。”
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδὴν
  choice: 歌
  rationale: 普通而自然地表达“歌曲、诗歌”，在此结合摩西之歌的语境；不额外限定为赞美诗。
- source_word: ἐδίδαξεν
  choice: 所教的
  rationale: 直接表达过去时的“教导”，并自然修饰“那首歌”。
- source_word: οὐκ ἐπελάθετο
  choice: 没有忘记
  rationale: 准确保留“忘记、未记念”的记忆主题，现代汉语也自然清楚。
- source_word: τὴν διδάσκουσαν
  choice: 歌中教导说
  rationale: 保留该分词所表达的歌本身施行教导的意味，同时避免生硬的“那教导人的歌”。
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: 我要使人死，也要使人活
  rationale: 两个希腊动词均为将来时；“使人死／使人活”保留神使之死亡与存活的使动含义，并符合庄重自然的现代汉语。
- source_word: γάρ
  choice: 因为
  rationale: 明确表达本句为前文提供理由或解释的连接作用。
theological_decisions:
- issue: 如何翻译《摩西之歌》中神的自我宣告
  choice: 我要使人死，也要使人活
  alternative: 我使人死，也使人活
  rationale: 本节希腊文本明确使用将来时，因此正文依从本节即时措辞，不为配合申命记32:39的其他文本形式而改成现在时；同时保留神掌管死亡和生命的强烈宣告。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“歌中教导说”既保持原文对“歌”的轻微拟人化，也比逐字译作“那教导人的”更自然。引语依希腊文将来时处理。
