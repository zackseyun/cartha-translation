  yaml_path: translation/deuterocanon/4_maccabees/018/006.yaml
  text: 'Then indeed, having set out from Jerusalem, he encamped against the Persians. And the mother of the seven boys was saying these things also to each one of her children:'
translation:
  language: zh_hans
  text: 就在那时，他从耶路撒冷出发，扎营对抗波斯人。那七个儿子的母亲也逐一对自己的孩子这样说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: 那时
  rationale: τότε标明叙事时序，δὴ带有确认或推进语气；现代汉语以“那时”自然承接上下文，不另加生硬的“确实”。
- source_word: ὑπάρας
  choice: 离开
  rationale: 不定过去时主动分词表示先于主句动作发生的启程或离去；“离开耶路撒冷”简洁自然，并避免加入原文未明确表达的方向。
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  choice: 出兵在波斯人面前安营
  rationale: ἐστρατοπέδευσεν是军事语境中的安营，ἐπί加宾格表示朝向并带敌对意味。“出兵……安营”保留军事行动，“在波斯人面前”则不把ἐπί的空间与敌对含义过度收窄为单一解释。
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: 那七个儿子的母亲
  rationale: παῖδες本可指孩子、男孩或儿子；此处所指七人均为她的男性后代，汉语亲属语境中“七个儿子”最自然准确。
- source_word: Ἔλεγεν
  choice: 曾……说
  rationale: 未完成过去时呈现过去持续或反复的言说；“曾……说”在汉语中保留叙事背景感，又不武断限定为仅一次或多次。
- source_word: καὶ ταῦτα
  choice: 也……这样
  rationale: “也”保留καί的附加意味，“这样”自然指向随后引出的言语内容。
- source_word: ἑνὶ ἑκάστῳ
  choice: 每一个
  rationale: 保留该分配性表达的逐一强调。
- source_word: τοῖς τέκνοις
  choice: 自己的……孩子
  rationale: τέκνα是关系性较强而范围较宽的“孩子”；使用“孩子”保留原文与παῖδες之间的词汇变化。
theological_decisions:
- issue: 同一节中两个家庭称谓的性别与词汇差异
  choice: 将παῖδες译为“儿子”，将τέκνοις译为“孩子”
  alternative: 两处都译作“儿子”或两处都译作“孩子”
  rationale: 原文有意使用不同词语。上下文确认七人为男性后代，因此“儿子”准确；τέκνα本身较宽，译作“孩子”既保留母子关系，也不抹平原文的词汇变化。
- issue: ἐπὶ Πέρσας的军事敌对关系
  choice: 译作“在波斯人面前安营”，并以“出兵”显明军事语境
  alternative: 译作“向波斯人进军”或“安营对抗波斯人”
  rationale: ἐπί加宾格在此可兼有朝向和敌对色彩。正文保留空间图景与军事含义，不把它完全解释成已经交战。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。分词结构按汉语时序展开；未完成过去时以“曾……说”轻度体现背景性。句末冒号承接下一节母亲的话。
