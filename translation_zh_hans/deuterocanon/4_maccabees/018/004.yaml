base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: zh_hans
  text: 因着他们，民族得享太平[a]；在祖国恢复良好秩序后，又彻底围困了仇敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着他们”。希腊语在这里主要表示原因，也可理解为他们发挥了媒介作用。
    reason: lexical_alternative
  - marker: b
    text: 或译“又把仇敌围攻到底”。这里的希腊语动词由“围攻／围困”构成并带有强化意味；它可强调彻底的围困，不宜在正文中断定为已将敌人赶出。
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ αὐτοὺς
  choice: 因为他们
  rationale: διά接宾格在这里首先表达原因；“因为他们”自然地保留这些殉道者与民族得享太平之间的因果关系，同时不把本节扩展为更完整的赎罪论述。
- source_word: εἰρήνευσεν
  choice: 得享太平
  rationale: 该动词可指处于和平之中；“得享太平”适合以民族为主语，也不暗示正式缔结和约。
- source_word: τὸ ἔθνος
  choice: 整个民族
  rationale: 此处指犹太民族共同体；“整个民族”既保留集体和政治层面的含义，又符合现代汉语。
- source_word: εὐνομίαν
  choice: 良好法治秩序
  rationale: εὐνομία兼有良好秩序与依法治理的内涵；“良好法治秩序”避免只译成抽象的守法或狭义的行政管理。
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: 祖国的
  rationale: 该短语说明所恢复的秩序存在于祖先之地；“祖国的”简洁保留πατρίς的故土和共同体色彩。
- source_word: ἀνανεωσάμενος
  choice: 恢复了……之后
  rationale: 以先行或伴随行动来处理该分词，表明恢复秩序与随后战胜仇敌之间的联系。
- source_word: ἐκπεπολιόρκηκε
  choice: 通过围攻把……彻底赶了出去
  rationale: 该完成时复合动词建立在“围攻”之上，并带有强化及结果意味；译文同时呈现围攻手段和彻底驱逐的结果。
- source_word: τοὺς πολεμίους
  choice: 仇敌
  rationale: 准确保留军事语境中的敌对力量，措辞庄重且通俗。
theological_decisions:
- issue: 殉道者对民族得救与太平的因果意义
  choice: 译为“因为他们”，明确本节所陈述的因果关系
  alternative: “借着他们”，较突出工具或媒介意义
  rationale: 希腊文确实把民族的太平与他们联系为因果关系，但本节本身没有说明完整的献祭或赎罪机制，因此既不削弱这层关系，也不从邻近经文引入额外教义。
- issue: 后半句主语的表达
  choice: 汉语承接“整个民族”而省略重复主语
  alternative: 明确重复“整个民族”或译成无人称结构
  rationale: 希腊文以阳性分词承接中性集合名词τὸ ἔθνος，存在按意义一致的表达张力；汉语零主语可自然保留上下文联系，而不人为制造新的行动者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“得享太平”保持历史叙事的尊严感；“良好法治秩序”传达εὐνομία兼具法律与社会秩序的含义。分号用来清楚区分民族得享太平与恢复秩序、驱逐仇敌这两组紧密相连的结果。
