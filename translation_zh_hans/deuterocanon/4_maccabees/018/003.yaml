review_pass:
  verdict: revise
  source_fidelity: 需修订。希腊文ἐκείνοι为与格阳性复数，和τοῖς πόνοις一致，意为“那些苦难”，并非主格、也不指“那些人”。此外，ἀνθʼ ὧν在此引出前述行为所带来的结果/理由；“作为对此的回报”比原文更明确地加入交换性报偿色彩。
  naturalness: 原译整体庄重通顺，但“把自己的身体交给痛苦”略显生硬；“将自己的身体置于那些苦难之下”较自然，且保留主动承受的意思。
  terminology: “敬虔”“世人的赞叹”“被算为配得”均合适。“神圣之份”可保留θείας μερίδος的开放含义；脚注宜说明该短语可指来自上帝的份，也可指分享神圣之事。
  issues:
  - severity: high
    issue: 将ἐκείνοι误析为主格并译作“那些人”
    rationale: 所给希腊文本为τοῖς πόνοις ἐκείνοι，与格阳性复数的ἐκείνοι修饰πόνοι，意为“那些苦难”。现有词汇说明声称其为主格，与原文形态不符。
  - severity: medium
    issue: “作为对此的回报”过度明确ἀνθʼ ὧν的语义
    rationale: 该连接语可自然表达“因此／正因如此”的因果结果；“回报”容易将原文未明说的交换性或报偿性关系写实。
  - severity: low
    issue: “交给痛苦”搭配略不自然
    rationale: 以“置于那些苦难之下”表达将身体交付以承受苦难，较符合现代庄重书面语，也不额外引入献祭意义。
  revised_text: 正因如此，他们因着敬虔将自己的身体置于那些苦难之下，不但受到世人的赞叹，也被算为配得神圣之份[a]。
  revised_footnotes:
  - marker: a
    text: 或译“上帝所赐的一份”，或“在神圣之中有分”。希腊语表达简练，既可指上帝所分配的份，也可指分享神圣之份。
    reason: 保留θείας μερίδος在赏赐来源和参与神圣之事两方面的语义可能。
  revision_rationale: 修正ἐκείνοι的格位及其所修饰的名词，并以“正因如此”保留ἀνθʼ ὧν的因果—结果功能而不强化为“回报”。“置于那些苦难之下”自然表达主动使身体承受苦难；其余关键术语及θείας μερίδος的歧义通过正文和脚注保留。
