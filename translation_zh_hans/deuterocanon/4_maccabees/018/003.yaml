base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: zh_hans
  text: 正因如此，他们因着敬虔将自己的身体置于那些苦难之下，不但受到世人的赞叹，也被算为配得神圣之份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝所赐的一份”，或“在神圣之中有分”。希腊语表达简练，既可指上帝所分配的份，也可指分享神圣之份。
    reason: 保留θείας μερίδος在赏赐来源和参与神圣之事两方面的语义可能。
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: 作为对此的回报
  rationale: 该短语通常表达对应或回报关系，承接那些人舍身受苦之举；这样译比单纯的“因此”更充分地保留希腊语的语义力度。
- source_word: διὰ τὴν εὐσέβειαν
  choice: 因着敬虔
  rationale: εὐσέβεια在本书中指向对上帝及其律法的虔敬忠诚。“敬虔”简洁、庄重，并保留明确的宗教含义。
- source_word: προεμενοι τὰ σώματα τοῖς πόνοις
  choice: 把自己的身体交给痛苦
  rationale: προΐημι在此表示交出、任凭承受；译作“交给”保留主动舍身之意，又不额外加入献祭色彩。πόνοις可指痛苦、苦难或折磨，此处采用较宽泛的“痛苦”。
- source_word: ἐκείνοι
  choice: 那些人
  rationale: 按现存引文的主格复数形式，ἐκείνοι最自然地作分词结构的主语，指前文所述的殉道者；若修饰τοῖς πόνοις，希腊语通常应为与格ἐκείνοις。
- source_word: ὑπὸ τῶν ἀνθρώπων ἐθαυμάσθησαν
  choice: 受到世人的赞叹
  rationale: “世人”自然表达泛指的人类，并与后文的神圣认可形成对照；“赞叹”兼具钦佩和惊叹之意。
- source_word: θείας μερίδος
  choice: 神圣之份
  rationale: 这一凝练短语既可能表示由上帝分给的份，也可能表示对神圣之份的有分。“神圣之份”刻意不限定为奖赏、产业或神化。
- source_word: κατηξιώθησαν
  choice: 被算为配得
  rationale: 保留该动词所含的判断、认可其为配得的意思，同时维持庄重语体。
theological_decisions:
- issue: θείας μερίδος的含义
  choice: 神圣之份
  alternative: 上帝所赐的份；在神圣之中有分
  rationale: 希腊语可能指上帝所分配的份，也可能指参与神圣领域或状态。正文保留这种开放性，不将其明确化为“天上的奖赏”或“神化”。
- issue: 受称许的来源与性质
  choice: 世人的赞叹与配得神圣之份并列而有递进
  alternative: 明确说成由上帝宣告或赏赐
  rationale: 原文第二个被动式没有明说施事者，因此不在正文中补入“上帝使他们”之类的主语，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现舍身受苦与所得称许之间的推进关系；保留“不但……也……”的希腊语对应结构。根据所给希腊文本的形态，将ἐκείνοι译为“那些人”，而非修饰“痛苦”。
