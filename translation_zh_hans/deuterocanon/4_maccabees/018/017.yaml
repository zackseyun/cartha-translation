  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: zh_hans
  text: 他援引以西结[a]作证[b]，以西结说：“这些枯骨会活过来吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里暗指《以西结书》37:3；希腊文呼应先知在枯骨遍布的山谷中所听见的问题。
    reason: cross_reference
  - marker: b
    text: “援引以西结作证”也可理解为“证实以西结”或“以以西结为证”。原文动词含有证言、作证的意味，难以用一个汉语表达完全涵盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: 援引……作证
  rationale: 该中间态动词在此带有诉诸证言、以某人为证的意味。“援引……作证”既保留见证性质，也符合现代汉语表达，并不武断地限定为单纯“证实”。
- source_word: τὸν Ἰεζεκιὴλ
  choice: 以西结
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: τὸν λέγοντα
  choice: 以西结说
  rationale: 分词结构引出先知的话。汉语用独立分句重提主语，比直译为“那说……的以西结”更自然清楚。
- source_word: Εἰ ζήσεται
  choice: 还能活过来吗
  rationale: εἰ 在这段引文中引出疑问；ζήσεται 的基本意义是“将要活着”。“活过来”适合已成枯骨的语境，同时没有把原文直接扩写成完整的复活教义。“还”传达面对枯骨时疑问所含的语气。
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: 这些枯骨
  rationale: 按现代汉语自然语序表达名词、形容词和指示词；“枯骨”简洁庄重，也清楚呼应《以西结书》的异象。
theological_decisions:
- issue: 如何处理对《以西结书》枯骨异象的引用及其复活意涵
  choice: 译作援引以西结作证，并保留疑问句“这些枯骨还能活过来吗？”
  alternative: 译作“他证实了以西结的话：‘这些枯骨若能复活……’”
  rationale: 原文诉诸先知的见证，唤起死后得生的盼望，但本句本身仍是疑问。译文保留这一张力，不把暗示直接改写成确定的教义陈述。
- issue: ἐπιστοποιεῖτο 的关系方向
  choice: “援引以西结作证”
  alternative: “为以西结作证”或“证实以西结”
  rationale: 该动词在此不易用一个汉语词完全对应。结合上下文中引用经文作为依据的作用，“援引……作证”最能表达诉诸先知证言的功能，同时脚注保留其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“援引……作证”略带正式色彩，适合经文论证语境；引文用“枯骨”和“活过来”，兼顾传统意象与当代可读性。
