translation:
  language: zh_hans
  text: 他还与我们同在时，向你们讲授[a]律法和先知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讲授”所译的希腊文动词为未完成过去时，可表示当时持续进行的讲授，也可表示过去惯常的讲授。
    reason: lexical_alternative
  - marker: b
    text: “律法和先知”是对以色列神圣经典的概括说法，主要指妥拉和先知著作。正文保留“先知”这一原文用语，而未直接译作“先知书”。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文所指的人。汉语若直译为“那一位”会显得生硬，因此用“他”自然衔接，同时不另行补出源文未明说的身份。
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 未完成过去时可表示过去持续或惯常的行动；汉语不强加“不断”或“常常”，以保留这种语义弹性，并在脚注中说明。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 准确体现第二人称复数宾语。
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: 还与我们同在时
  rationale: 自然表达该分词结构的时间背景，并保留ἔτι“还”及σὺν ἡμῖν“与我们同在”的含义。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 在此指以色列的律法，尤其是妥拉；采用现代中文圣经语域中通行且易懂的“律法”。
- source_word: καὶ τοὺς προφήτας
  choice: 和先知
  rationale: 直译复数名词“先知”，保留它既可指先知本人及其权威见证，也可转指先知著作的可能性；不在正文中提前限定为“先知书”。
theological_decisions:
- issue: “律法和先知”是否应明确译成圣经书卷的两大部分
  choice: 正文保留“律法和先知”，脚注说明其经书含义
  alternative: 律法和先知书
  rationale: 这一固定搭配很可能指以色列的神圣经典，特别是妥拉和先知著作；但希腊文实际写的是“先知”而非“先知书”，故正文保留其转喻张力，不把一种解释绝对化。
- issue: 未完成过去时应译为持续还是惯常动作
  choice: 正文用未标明体貌的“教导”，脚注交代两种可能
  alternative: 一直教导；常常教导
  rationale: 希腊文未完成过去时容许持续性或惯常性理解。汉语正文不强行选定其中一种，以保存原文的真实含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与我们同在”保留经文语体的肃穆感；句式简洁，适合承接上文。正文不以“常常”或“一直”限定未完成过去时，也不把“先知”直接收窄为“先知书”。
