base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: zh_hans
  text: 旷野的残害者——田野中的败坏者——没有毁坏我；那以诡诈残害人的蛇，也没有玷污我童贞的纯洁[a]；我却在年华鼎盛之时，一直与丈夫在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里把“残害者”“败坏者”“蛇”和“诡诈”等毁坏性语汇密集叠加，形成压缩的形象。“以诡诈残害人的蛇”也可按词序理解为“那蛇——诡诈的残害者”。
    reason: 说明原文围绕“蛇”堆叠近义毁坏语汇的压缩句法，并保留“诡诈”与“残害者／蛇”之间可行的修饰理解。
lexical_decisions:
- source_word: διέφθειρέν
  choice: 毁坏
  rationale: 该动词可指毁灭、败坏或使人堕落；“毁坏”既保留广泛含义，也与本句受侵害的语境相称，不把伤害方式限定得过窄。
- source_word: λυμεὼν
  choice: 残害者／残害人的
  rationale: 此词在两处重复，指造成伤害或毁坏者；译文以同一词根重现这种反复，并让第二处自然修饰“蛇”。
- source_word: τῆς ἐρημίας
  choice: 旷野中的
  rationale: 保留荒凉、无人之地的场景意味，同时不强行确定为某一特定地理地点。
- source_word: φθορεὺς ἐν πεδίῳ
  choice: 平原上的败坏者
  rationale: φθορεύς与λυμεών构成近义叠加，ἐν πεδίῳ直指平地、田野或平原；译作“平原上的败坏者”以保留压缩而重复的希腊语形象。
- source_word: ἐλυμήνατό
  choice: 玷污
  rationale: 动词本义可指伤害、蹂躏或毁坏；与“童贞的纯洁”连用时带有性与贞洁受侵犯的意味。“玷污”保留这一指向，却不额外断定具体侵害方式。
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: 我童贞的纯洁
  rationale: 较贴近“童贞中纯洁之事”的表达，以现代汉语自然呈现贞洁与纯净的重点。
- source_word: ἀπάτης
  choice: 以诡诈
  rationale: 属格可描述蛇的性质或施害手段；“以诡诈”保留手段意味，并维持对欺骗之蛇的文学呼应。
- source_word: ὄφις
  choice: 蛇
  rationale: 现代汉语“蛇”既自然庄重，也足以承载可能指向欺骗之蛇的典故意味，无须另加解释性称号。
- source_word: ἔμεινα
  choice: 一直……相守
  rationale: 该动词表示持续停留或保持某种状态；在婚姻语境中，“一直与丈夫相守”自然表达其延续性。
- source_word: χρόνον ἀκμῆς
  choice: 在年华鼎盛的岁月里
  rationale: ἀκμή指人生的盛期或成熟高峰；此译保留其时间跨度和生命鼎盛之意。
- source_word: σὺν ἀνδρί
  choice: 与丈夫
  rationale: ἀνήρ既可指男人，也可指丈夫；结合说话者将童贞与其后共同生活相对照的语境，译作“丈夫”最为连贯。
theological_decisions:
- issue: “蛇”是否暗指以诡诈诱惑人的原初之蛇
  choice: 正文保留“蛇”和“以诡诈”，不明说所指。
  alternative: 直接解释为伊甸园中的蛇，或弱化为普通的蛇。
  rationale: 希腊文本的ὄφις与ἀπάτης自然产生典故联想，但没有直接点明其身份；保留含蓄表达可维持文学和神学张力。
- issue: 童贞受到的威胁究竟是诱骗、道德败坏还是暴力侵犯
  choice: 采用“玷污”，使性贞洁受损的意味清楚，同时不限定具体方式。
  alternative: 译作“强暴”“诱奸”或较宽泛的“伤害”。
  rationale: 上下文确实涉及童贞的纯洁，但希腊动词本身没有把侵害机制说死，因此不宜过度具体化。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。首句保留希腊文近义称谓的并列叠加；末句用“相守”表达持续与丈夫同在，但不额外加入婚姻伦理解释。
