base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: zh_hans
  text: 这些儿子成年后[a]，父亲去世了。那人真有福，因为他曾享有儿女之福[b]，不曾为无儿女的时期而痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成年”也可译作“长大成人”或“到了足龄”。
    reason: lexical_alternative
  - marker: b
    text: 原文指有好儿女、享儿女之福的生活，带有正面褒义。按上下文，这与后来因众子死亡而无子女的痛苦形成对照；原句本身未明说这一过程。
    reason: cross_reference
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: 都已成年时
  rationale: 该属格独立结构表示这些人已经达到成年阶段；“都已成年时”在现代汉语中自然，也保留了先于父亲去世的时间关系。
- source_word: ἐτελεύτησεν
  choice: 去世了
  rationale: 该动词常委婉表示死亡；“去世”清楚、庄重，符合本段叙述语体。
- source_word: μακάριος
  choice: 有福的
  rationale: 该词表示一种值得称羡、蒙福的境况；“有福”比单纯的“幸运”或“快乐”更能保留原文庄重的伦理与宗教色彩。
- source_word: εὐτεκνίας
  choice: 享有贤良儿女
  rationale: 该名词指有儿女之福，并带正面评价；上下文尤其突出这些儿子的德行，因此译为“享有贤良儿女”，兼顾亲子状态和褒义。
- source_word: τὸν … βίον ἐπιστήσας
  choice: 在人生中走到了终点
  rationale: ἐπιστήσας与βίον连用，表达使一生止息、走到人生终点。这样处理比“看见人生”更符合动词形态和句法，同时以自然汉语呈现父亲在拥有儿女时寿终的意思。
- source_word: ἀτεκνίας
  choice: 无儿无女
  rationale: 该名词本义是没有儿女的状态；上下文暗示的不是不育，而是儿子们死后父亲将陷入的丧子境况，此层含义留在脚注说明。
- source_word: οὐκ ὠδυνήθη
  choice: 不曾……痛苦
  rationale: 动词表示感受疼痛、悲伤或苦楚；“不曾……痛苦”简明地保留其情感强度。
- source_word: καιρόν
  choice: 时期
  rationale: καιρός在此指具有特定性质的一段时期，而非抽象的钟表时间；“时期”正式自然，也保留这种阶段性。
theological_decisions:
- issue: 父亲被称为有福与众子后来殉难之间的关系
  choice: 正文直译为父亲未经历无儿无女的时期，并在脚注指出这可能是指他先于众子去世，因而没有承受丧子之痛。
  alternative: 仅把ἀτεκνία理解为一般意义上从未生育或没有子女，与后文众子的死亡无关。
  rationale: 本章紧接着叙述众子的死亡，因此“无儿无女”在叙事中自然指向因他们去世而留下的境况；但原句本身没有明说死因和先后细节，故不在正文中将暗示扩写成确定陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这些儿子”承接上下文，补出希腊文阳性复数指代的对象；“在人生中走到了终点”保留原句较为含蓄的死亡表达，并避免把ἐπιστήσας误解为“看见”或“体验”。
