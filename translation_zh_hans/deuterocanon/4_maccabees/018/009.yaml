revisions:
- from: 这些儿子都已成年时[a]，父亲去世了。那人是有福的，因为他在享有贤良儿女的人生中走到了终点[b]，不曾因无儿无女的时期而痛苦。
  to: 这些儿子成年后[a]，父亲去世了。那人真有福，因为他曾享有儿女之福[b]，不曾为无儿女的时期而痛苦。
  rationale: 修订恢复原文的句法关系：父亲先前享有儿女之福，因此未经历无子女时期的痛苦。删去把 ἐπιστήσας 解释为“走到人生终点”的说法，避免与已明确表达死亡的 ἐτελεύτησεν 重复，也避免在正文中加入原文该分句没有的寿终含义。脚注 b 移至“儿女之福”之后，并以审慎措辞说明叙事暗示。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:23:04Z'
