  yaml_path: translation/deuterocanon/4_maccabees/018/015.yaml
  text: David sang to us[a], the hymn-writer, saying[b], “Many are the afflictions of the righteous.”
translation:
  language: zh_hans
  text: 大卫，这位圣歌作者，向我们吟唱道[a]：“义人的苦难很多。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“圣歌作者大卫向我们吟唱道。”
    reason: 保留τὸν ὑμνογράφον作为大卫的同位称谓，并提供较紧凑的汉语语序。
  - marker: b
    text: 这句话呼应七十士译本《诗篇》33:20；按许多现代诗篇编次为34:19。
    reason: 标明引文所呼应的经文及不同诗篇编次。
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: 圣歌作者
  rationale: 本词指创作圣歌的人；这里是戴维的同位称谓。“圣歌作者”保留了希腊文的字面意象，也比直接译作“诗篇作者”少一层解释。
- source_word: ἐμελῴδει
  choice: 吟唱
  rationale: 该动词表示按曲调歌唱或吟咏；“吟唱”既体现旋律性，也符合此处庄重的经文语体。
- source_word: ἡμῖν
  choice: 向我们
  rationale: 与吟唱动作搭配，表示歌唱所面向的听众；“向我们”在现代汉语中自然清楚。
- source_word: Δαυεὶδ
  choice: 戴维
  rationale: 采用现代普通话中清楚、稳定的人名音译。
- source_word: Πολλαὶ αἱ θλίψεις
  choice: 遭遇许多苦难
  rationale: 希腊文直陈义人的苦难为多；汉语用“遭遇许多苦难”表达自然，同时保留数量与受苦之意。
- source_word: τῶν δικαίων
  choice: 义人
  rationale: 指公义的人这一群体；“义人”简洁，并保留经文传统中的庄重语域。
theological_decisions:
- issue: ὑμνογράφος与戴维的关系
  choice: 将“圣歌作者”作为戴维的同位称谓
  alternative: 译作“诗篇作者戴维”
  rationale: 上下文表明戴维就是吟唱并说出引文的圣歌作者。保留“圣歌作者”可避免把希腊文较宽的ὑμνογράφος直接限定为“诗篇作者”。
- issue: 义人受苦的陈述方式
  choice: “义人遭遇许多苦难”
  alternative: “义人的苦难很多”
  rationale: 两者都符合原文；所选译法在现代汉语中更顺畅，又不解释苦难的原因或结局，从而保留原句的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吟唱”保留原文的音乐意象；引文译得自然简洁，不增添关于义人为何受苦或如何获救的解释。
