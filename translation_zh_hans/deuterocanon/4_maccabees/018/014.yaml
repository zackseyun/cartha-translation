  yaml_path: translation/deuterocanon/4_maccabees/018/014.yaml
  text: And he kept reminding you of the Scripture of Isaiah that says[a], “Even if you pass through fire, a flame will not burn you.”
translation:
  language: zh_hans
  text: 他不断提醒你们以赛亚书中的经文，其中说[a]：“即使你从火中经过，火焰也不会烧着你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话呼应《以赛亚书》43:2。本节的引文采用其本身的希腊文措辞：“火焰也不会烧着你。”
    reason: 交叉引用，并说明本节引文措辞与《以赛亚书》的通行译法可能略有不同。
lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: 还一再提醒
  rationale: 未完成时可表达过去持续或反复发生的动作；“一再提醒”自然地传达这种反复性，“还”承接上下文。
- source_word: τὴν Ἡσαΐου γραφὴν
  choice: 以赛亚书上有这样的话
  rationale: γραφή在此指神圣经文；此译符合现代汉语引述经文的自然表达，同时保留其属于以赛亚经书的含义。
- source_word: τὴν λέγουσαν
  choice: 有这样的话
  rationale: 将修饰γραφή的分词按汉语引文格式处理，清楚引出后面的引用而不增加解释。
- source_word: Κἂν
  choice: 即使
  rationale: καὶ ἐάν在此具有让步条件意味，“即使”准确而自然。
- source_word: διὰ πυρὸς διέλθῃς
  choice: 你从火中经过
  rationale: 贴近介词διὰ与动词διέρχομαι的空间意象，并保持条件句形式。
- source_word: φλὸξ
  choice: 火焰
  rationale: 保留其与前文“火”的词汇区别；汉语中无需另加不定冠词。
- source_word: οὐ κατακαύσει σε
  choice: 也不会烧着你
  rationale: κατακαίω可指烧毁或烧尽；“烧着你”在此清楚表达火焰不能伤及人的意思，又未强化为“吞灭”。“也”与前面的让步条件自然呼应。
theological_decisions:
- issue: 以赛亚引文是否与通行的《以赛亚书》译文协调一致
  choice: 依《马加比四书》本节的希腊文本译作“火焰也不会烧着你”
  alternative: 套用某一通行《以赛亚书》译本的措辞，如“火焰也不着在你身上”
  rationale: 本节虽呼应《以赛亚书》43:2，却有自身的希腊措辞；依当前原文翻译可避免人为协调，并保留文本形式上的差异。
- issue: ὑπεμίμνησκεν的动词体意义
  choice: 用“一再提醒”表达反复或持续动作
  alternative: 仅译为“提醒了”
  rationale: 希腊语未完成时在语境中凸显过去反复或持续的提醒；译出这一点不构成额外的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一再提醒”传达未完成时的反复意味；引文保持简洁有力。脚注标记[a]已置于引文提示语之后。
