  yaml_path: translation/deuterocanon/4_maccabees/018/016.yaml
  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: zh_hans
  text: 他在我们面前援引所罗门的箴言，说：“对于所有遵行他旨意[a]的人，这是生命树[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对于所有遵行它的旨意的人，这是生命树。”希腊语代词也可作非人称理解，但上下文更支持它指上帝。
    reason: alternative_reading
  - marker: b
    text: 这句话以改写的形式呼应《箴言》3:18。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: 引用……的箴言
  rationale: 该动词表示以箴言方式说话或援引箴言；结合直接宾语“所罗门”，这里自然表达为引用所罗门的箴言，既保留援引权威的动作，也符合现代汉语。未采用“把所罗门当作箴言”，以免产生所罗门本人就是一句箴言的误解。
- source_word: τὸν Σαλομῶντα
  choice: 所罗门
  rationale: 按现代汉语通行圣经人名译法处理；宾格表明所罗门是被援引的权威。
- source_word: ἡμῖν
  choice: 在我们面前
  rationale: 与格指出话语面对的听众；“在我们面前”保留叙述中的现场感，也比单纯译作“向我们”更贴合这里的教导场景。
- source_word: τὸν λέγοντα
  choice: 所罗门说
  rationale: 带冠词的现在分词进一步说明所罗门是引文的说话者。汉语重复人名比直译为“那位说……的”更清楚自然。
- source_word: Ξύλον ζωῆς
  choice: 生命树
  rationale: 保留智慧文学中的固定意象，并呼应《箴言》3:18；汉语无需添加不定冠词。
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: 对于所有遵行……的人
  rationale: πᾶσιν涵盖所有相关的人，ποιοῦσιν在“旨意”这一搭配中自然译为“遵行”，既表达实际实行，也符合庄重而通俗的现代汉语。
- source_word: αὐτοῦ τὸ θέλημα
  choice: 他旨意
  rationale: 上下文最可能指上帝的旨意，因此正文采用人称“他”；希腊语代词本身仍有歧义，可能机械地回指前述事物，故在脚注保留另一读法。
theological_decisions:
- issue: 引文中αὐτοῦ的所指
  choice: 他旨意（指上帝）
  alternative: 它的意愿
  rationale: 本段殉道语境强调忠于上帝，因此将代词理解为指上帝最为连贯；但希腊语形式并未明说所指，故不在脚注中消除其真实歧义。
- issue: 与《箴言》3:18的关系
  choice: 视为经过改写的呼应
  alternative: 视为逐字引文
  rationale: 本句明显沿用“生命树”的智慧文学措辞，却并非现存《箴言》3:18希腊文本的逐字引用，因此脚注称其为呼应而非精确引文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“引用所罗门的箴言”避免生硬照搬希腊语宾语结构；“遵行……旨意”保留宗教语境中的自然搭配。两处脚注标记均置于相关引文之后。
