  text: 愿荣耀归给他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: 归给他
  rationale: 这是与格关系代词，在颂赞语中表示荣耀所归属的对象。结合中文承接上文的自然表达，译作“归给他”；代词所指仍由上下文决定，不在本节中另行明确。
- source_word: ἡ δόξα
  choice: 荣耀
  rationale: δόξα在颂赞语境中通常指应归于受颂赞者的尊荣与荣光；“荣耀”是现代中文宗教与庄重语体中自然且准确的对应词。希腊语冠词无需在中文中机械体现。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这一加强式惯用语表示无尽的持续。“直到永永远远”既保留其强调力度，也符合现代中文颂赞语的庄重表达。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用通行的礼仪音译，保留庄严的确认和结束公式；不释作“诚然”或“愿如此”，以免削弱其固定礼仪色彩。
theological_decisions:
- issue: 无显式动词的颂赞句
  choice: 愿荣耀归给他
  alternative: 荣耀归给他；荣耀是他的
  rationale: 原文没有明写动词。中文用“愿……归给……”自然传达颂赞性的祈愿或宣告语气，同时不把原句收窄为单纯所有关系。
- issue: 关系代词ᾧ的所指
  choice: 他
  alternative: 那一位；明确补出上文所指的称谓
  rationale: 本节自身只用关系代词承接上文。译文保留代词，不擅自补入身份称谓，以避免添加原文未在本句重述的神学信息。
translation_notes:
  register: 采用现代、庄重、易懂的中文颂赞语体。“永永远远”和“阿们”保留传统礼仪表达，但整体句法自然，不使用文言式“归于”。
