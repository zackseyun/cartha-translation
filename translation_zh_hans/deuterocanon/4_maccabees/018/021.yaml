lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: 他们的瞳孔
  rationale: κόρας在此为眼睛的解剖部位，指瞳孔；译作“瞳孔”准确、自然，也不引入“眼珠”或惯用比喻的含义。
- source_word: ἐπήρωσεν
  choice: 毁坏了
  rationale: 该动词表示使残废、损毁或致盲。与“瞳孔”搭配时，“毁坏了”保留对眼部施加暴力损伤的动作，也不把原文进一步具体化为“挖出”。
- source_word: γλώσσας ἐξέτεμεν
  choice: 割掉了他们的舌头
  rationale: ἐκτέμνω意为割除、切除；“割掉舌头”是现代汉语中直接而自然的表达，并保留原文的残酷性。
- source_word: βασάνοις ποικίλαις
  choice: 用各种酷刑
  rationale: 工具格表达施行杀害的手段；“各种酷刑”准确传达ποικίλαις与βασάνοις，并符合现代汉语习惯。
- source_word: ἀπέκτεινεν
  choice: 将他们杀死
  rationale: 该词是普通的“杀死”。原文宾语可由上下文承接，汉语补出“他们”使指代清楚、句子顺畅。
