  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: zh_hans
  text: 暴君安条克在地上也已经受了惩罚，并且正受永恒的惩罚[a]；因为他丝毫不能强迫耶路撒冷人改从异族的生活方式，背弃祖先所属民族的生活习俗，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“永恒的”之后省略了所修饰的名词，也可译作“永远受惩罚”。
    reason: 保留希腊文 ἀϊδίων 的省略结构及其译法差异。
lexical_decisions:
- source_word: τύραννος
  choice: 暴君
  rationale: 保留希腊词对安条克统治的强烈贬义，而不采用中性的“君王”或“统治者”。
- source_word: τετιμώρηται
  choice: 已经受了惩罚
  rationale: 以“已经……了”表达完成时所指的既成惩罚及其现今关联。
- source_word: ἀϊδίων κολάζεται
  choice: 正受永恒的惩罚
  rationale: 中文若直译为“受永恒之事”极不自然；正文补出语境隐含的“惩罚”，并以脚注注明原文只明说“永恒的”，保留其省略现象及可译空间。
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: 无论如何都不能
  rationale: 传达双重否定所加强的完全无能之意，同时符合现代汉语表达。
- source_word: τοὺς Ἱεροσολυμείτας
  choice: 耶路撒冷人
  rationale: 简洁自然地指耶路撒冷的居民或群体。
- source_word: ἀλλοφυλῆσαι
  choice: 改从异族的生活方式
  rationale: 该动词在本语境中涉及被迫同化于异族，而不只是迁居或一般意义上的“成为外国人”。
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: 离弃祖先民族的生活习俗
  rationale: 兼顾 πατρίων 的祖传意味、ἐθνῶν 的民族含义，以及 ἐκδιαιτηθῆναι 所涉及的生活方式或习俗，避免漏译传世文本中的“民族”。
theological_decisions:
- issue: ἀϊδίων κολάζεται 所表达的死后惩罚性质
  choice: 译作“正受永恒的惩罚”，肯定其在尘世惩罚之外仍持续受罚，但不界定惩罚的方式。
  alternative: 可译作“永远受惩罚”；若严格仿照原文省略，也可生硬地译作“正受永恒之事”。
  rationale: 希腊文将地上的既成惩罚与持续的永恒性惩罚并列，但 ἀϊδίων 是无显明中心名词的形容词。正文采用自然中文，脚注则明确这一省略，避免把隐含名词当作原文明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“改从异族的生活方式”体现文化与宗教层面的同化；句末保留逗号，因为本节在希腊文中尚未完句。
