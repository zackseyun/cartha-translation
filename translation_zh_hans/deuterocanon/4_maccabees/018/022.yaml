translation:
  language: zh_hans
  text: 因这些事，神圣的公义已经追讨，也必追讨那受咒诅的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受咒诅的人”也可译作“可憎的人”或“受玷污的人”；原希腊语此词十分罕见，含有强烈的道德和宗教谴责意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: 正因这些事
  rationale: ὑπέρ与关系代词连用，在此表示审判所针对的缘由；译为“正因这些事”明确保留因果关系，并承接上文。
- source_word: ἡ θεία δίκη
  choice: 神圣的公义
  rationale: δίκη兼有公义、审判和惩罚之意；“神圣的公义”既保留其拟人化主体，也不把含义过早限定为惩罚或报复。
- source_word: μετῆλθεν καὶ μετελεύσεται
  choice: 已经追讨、也必追讨
  rationale: 两个同源动词分别为过去时和将来时，带有追赶并施行惩治的意味；重复“追讨”保留原文的修辞呼应及追究罪责的力度。
- source_word: τὸν ἀλιόστορα
  choice: 那可憎的人
  rationale: ἀλιόστωρ是罕见而强烈的贬义词，可能兼有受咒诅、受玷污或令人憎恶之意；正文采用自然且带道德—宗教谴责色彩的“可憎”，并以脚注保留其他可能。
theological_decisions:
- issue: 如何表达δίκη所含的神圣报应意味
  choice: 神圣的公义
  alternative: 神的惩罚；神圣的报应
  rationale: 此处的公义采取追讨行动，具有报应和惩治的力度；但原词不只指具体刑罚，因此正文保留公义原则与实际惩治之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“追讨”比单纯的“追赶”更能表达司法性惩治，同时借重复保留希腊文过去与将来动作的对称。脚注标记置于完整指称之后。
