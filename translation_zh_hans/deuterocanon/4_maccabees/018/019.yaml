translation:
  language: zh_hans
  text: 这就是你们的生命，也是你们一生的福分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη
  choice: 这
  rationale: 阴性单数指示代词与后面的“生命”在语法上呼应，也可回指上文所述内容；译作“这”保留其简洁与指代上的开放性，不擅自明确为“这位女子”。
- source_word: ζωὴ
  choice: 生命
  rationale: 直接表达“生命”，保留原文庄重而凝练的措辞；“生活方式”会加入原文未明说的解释。
- source_word: μακαριότης
  choice: 福分
  rationale: 表达蒙福、幸福的状态，兼顾宗教伦理语境和现代汉语的自然度；“幸福”略显平常，“福乐”则更偏文学化。
- source_word: τῶν ἡμερῶν
  choice: 一生的
  rationale: 原义为“日子的”，在此表示人生岁月；直译“你们日子的福分”在现代汉语中生硬，译作“一生的福分”自然传达其时间跨度。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 按第二人称复数属格翻译；它同时统摄“生命”，并在汉语译文中自然地用于“一生”。
theological_decisions:
- issue: μακαριότης所表达的是主观幸福还是蒙福状态
  choice: 福分
  alternative: 幸福；福乐
  rationale: “福分”既不把意义缩减为主观感受，也不过度规定福的神学来源，保留原文的宗教伦理色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“这就是……也是……”再现两个带定冠词名词短语的并列强调；将“日子”按汉语习惯表达为“一生”，避免僵硬直译。
