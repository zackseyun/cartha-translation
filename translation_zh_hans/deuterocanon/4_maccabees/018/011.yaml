  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: zh_hans
  text: 他给我们诵读被该隐杀害的亚伯、正被献作全燔祭的以撒[a]，以及在监牢中的约瑟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文使用“全燔祭”的献祭用语，直译可作“正被作为全燔祭献上的以撒”，借此唤起创世记22章的场景；这并不是说以撒最终真的被焚烧了。
    reason: 说明希腊文的献祭措辞，并避免读者误以为以撒实际被焚献。
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: 常给我们读到
  rationale: 该动词通常指朗读或宣读，未完成时态在此可表达过去反复进行的动作。“常给我们读到”既保留读经场景，也使后接三位人物的中文自然。
- source_word: τὸν ἀναιρεθέντα Ἄβελ ὑπὸ Κάϊν
  choice: 被该隐杀害的亚伯
  rationale: ἀναιρέω在此指夺去生命；“杀害”准确传达暴力致死及语境中的沉重意味。被动结构也对应希腊文。
- source_word: τὸν ὁλοκαυτούμενον Ἰσαάκ
  choice: 被献作全燔祭的以撒
  rationale: ὁλοκαυτούμενον采用献祭术语，指整只焚献的祭牲。“全燔祭”保留创世记22章的祭祀意象，同时用“被献作”避免直称以撒已被焚烧。
- source_word: τὸν ἐν φυλακῇ Ἰωσήφ
  choice: 身陷监牢的约瑟
  rationale: ἐν φυλακῇ表示被囚禁的处境；“身陷监牢”是现代中文中清楚、庄重而自然的表达。
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: 亚伯／该隐／以撒／约瑟
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 以撒献祭的献祭措辞
  choice: 被献作全燔祭的以撒
  alternative: 正被全部焚烧的以撒／被献上的以撒
  rationale: 希腊文刻意使用全燔祭术语，应保留其神学与叙事张力；但创世记记载以撒并未实际被焚烧，因此正文采用“被献作”而不说“被焚烧”，并以脚注说明原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“常给我们读到”体现未完成时态可能带有的反复意味；并列结构紧凑，保留三位经上人物作为受苦典范的排列。
