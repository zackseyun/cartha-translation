  yaml_path: translation/deuterocanon/4_maccabees/011/013.yaml
  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: zh_hans
  text: 这个人也死后，第六个年轻人被带上前来。暴君问他是否愿意吃了就获释，他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: 死了以后
  rationale: 不定过去时分词表示前一个人死亡后发生下一件事；译为“死了以后”自然清楚，也不增添“殉道”等解释性内容。
- source_word: τούτου
  choice: 这一个
  rationale: 指紧接前文的那个人。保留指示代词，不擅自补出原文未明说的“兄弟”。
- source_word: ὁ ἕκτος
  choice: 第六个
  rationale: 序数词作名词用；由后面的“年轻人”明确其所指，无须补译“兄弟”。
- source_word: ἤγετο
  choice: 被带上前来
  rationale: 未完成时被动形式描述他被人带到暴君面前；“带上前来”兼顾移动和公开带到面前的语境。
- source_word: μειρακίσκος
  choice: 年轻人
  rationale: 指年轻男性；“年轻人”是现代汉语中自然且不过度限定具体年龄的表达。
- source_word: πυνθανομένου
  choice: 问
  rationale: 分词结构以暴君为询问者；汉语用“问”简洁自然。
- source_word: τοῦ τυράννου
  choice: 暴君
  rationale: τύραννος带有明确贬义；“暴君”保留作者对统治者的道德评价，不弱化为“君王”或“统治者”。
- source_word: εἰ βούλοιτο
  choice: 是否愿意
  rationale: βούλομαι表达意愿；“是否愿意”比“是否想要”更适合此处正式而带胁迫的提问语境。
- source_word: φαγὼν
  choice: 吃了
  rationale: 不定过去时分词在此与获释条件相连；“吃了就获释”自然传达以吃为释放条件，同时不补出本节未明说的食物。
- source_word: ἀπολύεσθαι
  choice: 获释
  rationale: 被动不定式表示被释放；“获释”符合拘押和审讯场景，简洁庄重。
- source_word: ὁ δὲ ἔφη
  choice: 他说
  rationale: 叙事中的回应公式；以“他说：”承接下一节，保留原句尚未完结的结构。
theological_decisions:
- issue: 如何保留作者借 τύραννος 对统治者所作的道德定性
  choice: 暴君
  alternative: 君王；统治者
  rationale: 原文有意使用带贬义的政治称谓。译作“暴君”忠实保留叙事评价，而不额外加入神学判断。
- issue: 是否明确说明所吃的是禁食或祭肉
  choice: 只译“吃了”
  alternative: 吃了禁食；吃了祭肉
  rationale: 本节没有明说所吃之物。上下文虽可说明，但在此补出会消除原文本节的省略，因此保留其含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“这一个也死了以后”保留 καὶ 的递进意味和 τούτου 的指示性；“第六个年轻人”忠实结合实词 μειρακίσκος，避免擅加“兄弟”。末尾用冒号表明话语将在下一节继续。
