  yaml_path: translation/deuterocanon/4_maccabees/011/026.yaml
  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
translation:
  language: zh_hans
  text: 你的火对我们是冷的；你的投石机[a]不使我们感到痛苦；你的暴力也无能为力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投石机”也可理解为“刑具”。希腊语καταπέλται通常指投石机或发射器械，但在这里也可能泛指施加折磨的器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  choice: 你的火
  rationale: 直译具体意象，并与末句“你的暴力”形成对应。
- source_word: ψυχρὸν ἡμῖν
  choice: 对我们来说是冷的
  rationale: 保留“冷”的悖论性修辞，也明确ἡμῖν所表示的相关对象。
- source_word: ἄπονοι
  choice: 不能使我们疼痛
  rationale: 该词在此作表语，意为不造成痛苦；汉语用动词结构比“是无痛的”更自然。
- source_word: οἱ καταπέλται
  choice: 你的投石机
  rationale: καταπέλται通常指投石机等发射器械；原文此处虽无物主词，但上下文直接对暴君说话，且前后均有“你的”，汉语补出“你的”可保持排比。其在刑讯语境中也可能泛指刑具，故加脚注保留另一可能。
- source_word: ἀδύνατος
  choice: 毫无力量
  rationale: 表达“无力、不能奏效”，并保留与βία“暴力／强力”之间的反讽张力。
- source_word: ἡ βία σου
  choice: 你的暴力
  rationale: βία可指强力或暴力；殉道受迫害的语境使“暴力”最贴切，同时保留道德分量。
theological_decisions:
- issue: 殉道者话语中的修辞悖论
  choice: 直接保留“火……是冷的”以及刑具不能致痛、暴力无力的宣告
  alternative: 解释性译为“你的火对我们不起作用”或“你的火仿佛是凉的”
  rationale: 原文以鲜明悖论表达坚定忍耐，并未说明火的物理温度真的改变；直译可保存其神学与修辞张力，而不替读者作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三分句保持排比和递进：“火”是冷的，“投石机”不能致痛，“暴力”毫无力量。脚注标记置于相关词句之后。
