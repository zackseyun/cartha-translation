    rationale: διὰ τὴν εὐσέβειαν应表达这场受难与敬虔的关联；中文现有语序尤其容易读作“他们因敬虔而被召”，并使“进入苦难的操练”成为附带成分。改为“为了敬虔……被召来接受苦难的操练”能更清楚保留受难训练的目的性，而不指定召唤者。
  - severity: low
