  rationale: 修订使“敬虔”与苦难操练之间的关系更清楚，保留被动的“被召来”而不增添施事者，并使叙述在现代标准汉语中更流畅。脚注继续保留罕见希腊短语的歧义，未将其解释为特定教义。
