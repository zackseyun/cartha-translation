  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: zh_hans
  text: 那人正在受着酷刑；作为一个过着圣洁生活的人[a]，他说：“为了敬虔，我们弟兄这么多人被召来接受苦难的操练，却没有被击败。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语此短语很不寻常。也可理解为“属于神圣时代（或世代）的人”，或指一种合乎神圣的生活方式；其中“时代／世代”一词也可指人的一生或生活状态。
    reason: 保留ἱεροπρεποῦς αἰῶνος可能指神圣时代、人生阶段或合乎神圣的生活方式这一词义歧义。
lexical_decisions:
- source_word: βασανιζόμενος
  choice: 正受着酷刑
  rationale: 在殉道叙事中指具体的肉体酷刑；“正受着”保留现在分词所表达的持续过程。
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: 过着圣洁生活的人
  rationale: ἱεροπρεπής表示合乎神圣、庄严或圣洁，αἰών在此可指一生或生活方式。希腊短语罕见且压缩；正文采用现代汉语可理解的表达，脚注保留“神圣时代／世代”等可能性。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 本书中该词指向神的虔敬，并体现为忠于律法；“敬虔”保留其宗教指向。
- source_word: γυμνασίαν πόνων
  choice: 苦难的操练
  rationale: γυμνασία带有训练、锻炼的竞技意象，πόνων指痛苦、劳苦或苦难；此译保留本书重要的竞技修辞。
- source_word: ἀδελφοὶ
  choice: 兄弟
  rationale: 上下文所指是同胞兄弟，并非泛指男女混合的群体。
- source_word: κληθέντες
  choice: 蒙召
  rationale: 保留被动语态以及“被召唤进入这场考验”的意味，同时不明确指定施事者。
- source_word: οὐκ ἐνικήθημεν
  choice: 没有被击败
  rationale: 保留νικάω的胜负意象及被动重点，即施刑者未能胜过他们；现代汉语中也比“没有被征服”更自然。
theological_decisions:
- issue: ἱεροπρεποῦς αἰῶνος的解释
  choice: 正文译作“过着圣洁生活的人”
  alternative: “属于神圣时代（或世代）的人”；“具有神圣一生的人”
  rationale: αἰών既可具有时间性的“时代／世代”含义，也可指一生或生活方式。此处与ἱεροπρεποῦς构成的短语很不寻常；正文采用较可能且可读的“圣洁生活”，脚注明确保留时间性解释，避免把歧义悄然消除。
- issue: 蒙召的施事者
  choice: 使用“蒙召”，不说明是谁召唤
  alternative: “被召来”或“被传来”
  rationale: 希腊文为被动分词，未明说施事者；译文不把它明确解释为神的呼召，也不限定为君王的传唤。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正受着酷刑”呈现行动持续进行；“苦难的操练”刻意保留竞技训练隐喻；“却没有被击败”保持原文的胜负修辞。正文中的脚注标记[a]与脚注完全对应。
