  yaml_path: translation/deuterocanon/4_maccabees/011/015.yaml
  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
translation:
  language: zh_hans
  text: 因为我们既为同样的事而生，也为同样的事被养育成人；同样地，我们也应当为同样的事而死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: 为同样的事
  rationale: εἰς在这里表示趋向或目的；保留“同样的事”这一宽泛说法，不把所指擅自限定为律法、原则或事业。
- source_word: γενηθέντες
  choice: 而生
  rationale: 在兄弟共同身世的语境中，译作“生”准确、自然，表达“出生”。
- source_word: τραφέντες
  choice: 被养育成人
  rationale: 该词在此不只是得到食物，而是指从小受到抚养和培育；“被养育成人”保留其被动意味。
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: 为这些事
  rationale: ὑπέρ表示为了、因着或捍卫某事而付出生命；“为这些事”既承接前文，又不把宽泛的所指解释得过窄。
- source_word: ἀποθνήσκειν
  choice: 而死
  rationale: 原词只陈述死亡，并未在动词本身明说施害者，因此不译成“被处死”。
- source_word: ὀφείλομεν
  choice: 应当
  rationale: 表达道德上的责任和义务，现代汉语中庄重而自然。
- source_word: ὁμοίως
  choice: 同样
  rationale: 强调共同出生、受养育与共同赴死之间的对应关系。
theological_decisions:
- issue: 是否把τὰ αὐτά／τῶν αὐτῶν明确译成“同样的原则”“同样的事业”或“同样的律法”
  choice: 正文保留宽泛的“同样的事／这些事”
  alternative: 同样的原则；同样的事业；同样的律法
  rationale: 希腊文两次使用宽泛的中性复数表达，却未明确指出具体对象。上下文虽与共同忠于律法有关，本节本身仍保留概括性；译文不应消除这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“既……也……”呈现两个并列分词，“就应当……”传达γάρ所引出的理由与道德结论。
