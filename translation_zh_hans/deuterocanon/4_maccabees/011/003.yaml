base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: zh_hans
  text: 但我自己主动上前来[a]，好让你杀了我之后，因更多的不义之事而招致天上公义的惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我亲自自愿上前来。”
    reason: lexical_alternative
  - marker: b
    text: “天上公义的惩罚”也可译为“来自天上公义的惩罚”或“天上审判所施的惩罚”。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: 但我是自愿
  rationale: αὐτός与ἀπ’ ἐμαυτοῦ共同强调说话者亲自作出的主动、自愿行为；现代汉语用“我是自愿”自然传达这一强调。
- source_word: παρῆλθον
  choice: 上前来了
  rationale: 上下文是说话者主动到暴君面前受难；“上前来”既保留移动含义，也表达主动现身。
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的；“好让”在现代汉语中清楚自然，同时保留原文带有讽刺意味的目的表达。
- source_word: κἀμέ
  choice: 连我也
  rationale: κἀμέ由καί与ἐμέ缩合而成，含附加意味；“连我也”保留说话者将自己加入先前被杀者之列的语气。
- source_word: κατακτείνας
  choice: 杀了以后
  rationale: 不定过去主动分词表示其动作先于主句的ὀφλήσῃς；译为“杀了以后”明确呈现时序。
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: 因更多的不义之事
  rationale: 表示因更多违法、不义的行为而承担责任；“不义之事”保留ἀδίκημα的道德与司法色彩，且不把比较级强化成“更严重”。
- source_word: ὀφλήσῃς
  choice: 招致
  rationale: 该动词本义涉及欠债或负有责任，与τιμωρίαν连用时表示招致、承担惩罚；“招致”自然保留司法责任的意味。
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: 天上公义的
  rationale: δίκη可指公义、审判或惩治性的正义；属格式汉语表达自然，并保留其来自天上的超越性来源，而不明确等同于某一命名主体。
- source_word: τιμωρίαν
  choice: 惩罚
  rationale: 指报应性惩处；“惩罚”清楚、庄重，又不过度强化为“报仇”。
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ的表达
  choice: 天上公义的惩罚
  alternative: 天上审判所施的惩罚／来自天上公义的惩罚
  rationale: “天上公义”保留公义可能带有拟人意味、也可能指属天审判秩序的张力；不直接增译“上帝”，以免消除原文的表达空间。
- issue: ὅπως所表达的目的关系
  choice: 好让你……招致
  alternative: 以致你……招致
  rationale: 原文ὅπως通常引出目的。保留“好让”可呈现殉道者主动前来的目的及其尖锐反讽，而不弱化成纯结果。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“自愿上前来”突出主动性；“不义之事”兼顾道德和司法语感。句末脚注标记紧随其所说明的“天上公义的惩罚”。
