  text: But these things from you are not worthy of tortures,[a]
translation:
  language: zh_hans
  text: 但出自你们的这些事，还不值得用酷刑来对付。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“但你们的这些事，不配受酷刑。”原文“你们的”（ὑμῶν）可按语境理解为“出自你们的”；也可与“酷刑”（βασάνων）并列理解，即“这些事配得上你们，却不配受酷刑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 表示与上文的转折；“但”简洁自然。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示语的宽泛所指。
- source_word: ὑμῶν
  choice: 你们做的
  rationale: 将属格按语境理解为来源或关联，指这些出自受话者的行为，同时避免生硬的“你们的这些事”。
- source_word: βασάνων
  choice: 酷刑
  rationale: 在殉道受刑的语境中指身体上的严刑折磨；现代汉语中“酷刑”可自然涵盖具体施加的各种刑罚。
- source_word: ἄξια
  choice: 配不上称为
  rationale: 表达“不足以当作、算作”的价值判断，也保留原文 ἄξια 与属格搭配所含的“相称、配得”意味。
