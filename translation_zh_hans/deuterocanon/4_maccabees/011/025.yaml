base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: zh_hans
  text: 因为你既不能说服我们改变理性判断，也不能强迫我们吃肉[a]，这不正是你的失败吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“吃肉”。在这里，指吃犹太律法所禁止的肉食；也可译作“吃禁戒的肉”或“吃不洁的食物”。
    reason: 说明罕见词μεμοφαγία的字面意义及其具体叙事语境。
lexical_decisions:
- source_word: μὴ δυνηθῆναί
  choice: 无法
  rationale: 表达不能做到某事，保留原文强调“无能为力”而不只是尝试未果的语气。
- source_word: μεταπεῖσαι
  choice: 说服
  rationale: 直接表达劝服并使对方改变判断，与后面的武力强迫形成对照。
- source_word: τὸν λογισμὸν ἡμῶν
  choice: 我们的理性判断
  rationale: λογισμός是本书的重要概念，指能够作出道德判断的理性；“理性判断”既保留哲学意味，也比单说“理性”更符合现代汉语习惯。
- source_word: βιάσασθαι
  choice: 强迫
  rationale: 准确传达以强力逼迫之意，并与“说服”构成鲜明对比。
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: 吃肉
  rationale: μεμοφαγία字面指吃肉；此处所指是律法禁止的肉食，正文保留词语本身的范围，以脚注交代具体语境。
- source_word: κατάλυσίς
  choice: 失败
  rationale: 该词可指瓦解、倾覆或败亡；在这里的诘问中，“失败”自然清楚地表达暴君未能使他们屈服。
theological_decisions:
- issue: 如何译出本书中具有哲学和神学分量的λογισμός
  choice: 我们的理性判断
  alternative: 我们的理性；我们的意志
  rationale: “理性判断”保留本书以敬虔理性抗衡情欲和强权的核心概念，又不把它窄化为单纯的意志或决心。
- issue: 是否在正文中明确解释μεμοφαγία所指的是违禁肉食
  choice: 正文译作“吃肉”，脚注说明语境
  alternative: 吃禁戒的肉；吃不洁的食物
  rationale: 希腊词本身直指吃肉，至于肉食为何不可吃，则由叙事语境决定；正文与脚注的分工避免把语境解释直接写进词义。
- issue: κατάλυσις在诘问中的力度
  choice: 你的失败
  alternative: 你的败亡；你的覆灭
  rationale: “失败”贴合当下争斗的修辞语境，同时避免把此词过度解释为暴君最终的死亡或政权覆灭。
translation_notes:
  register: 采用现代、庄重而清楚的汉语。以“说服……理性判断”与“强迫……吃肉”保留劝诱和暴力之间的对照；末句用反问重现原文挑战、嘲讽的语气。脚注标记置于其实际所解释的“吃肉”之后。
