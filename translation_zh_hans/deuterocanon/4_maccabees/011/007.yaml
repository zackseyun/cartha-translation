lexical_decisions:
- source_word: εἴπερ
  choice: 你若真
  rationale: 既保留条件意味，也表达此处带质问色彩的强调语气。
- source_word: ἠσθάνου
  choice: 还有……知觉
  rationale: 该未完成过去时中间形式在此指感知、觉察；结合对受话者的反事实式责问，以“还有……知觉”自然传达。
- source_word: ἀνθρώπους πόθων
  choice: 人的欲望
  rationale: 底本此处的搭配在语法和语义上较为生硬，且可能存在文本问题；按现存读法尽量直译，不擅自限定欲望的具体对象或性质。
- source_word: ἐλπίδα εἶχες
  choice: 还指望
  rationale: 表达“怀有希望、期待”，中文以“指望”契合此处针对受话者的直接责问。
- source_word: παρὰ θεῷ σωτηρίου
  choice: 从上帝那里得到拯救
  rationale: 将 παρά 与 θεῷ 理解为希望之来源，并将 σωτηρίου 按救援、解救之义表达；避免增加末世论或宗派性的限定。
theological_decisions:
- issue: σωτηρίου 的范围
  choice: 拯救
  alternative: 救援／解救
  rationale: “拯救”能涵盖从当前苦难中获救及较宽的宗教意味；原文未明确限定，故不进一步解释。
- issue: παρὰ θεῷ 的关系
  choice: 从上帝那里
  alternative: 在上帝面前／在上帝那里
  rationale: 在“怀有……希望”的结构中，来源义最通顺，但不扩写上帝施行拯救的具体方式。
