  yaml_path: translation/deuterocanon/4_maccabees/011/004.yaml
  text: O hateful and misanthropic man[b][a], what have we done that you are ravaging us in this way?
translation:
  language: zh_hans
  text: “你这憎恨美德[a]、仇视世人的人啊！我们究竟做了什么，你竟这样摧残[b]我们？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “憎恨美德”所译的希腊语是一个强烈的斥责词；也有人较笼统地理解为“可憎的”。
    reason: lexical_alternative
  - marker: b
    text: “摧残”也可译作“毁灭”或“蹂躏”；原词常用于暴力毁坏或使某处荒废。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: 啊
  rationale: 用句末感叹语气词体现呼格感叹和当面斥责的强烈语气，符合现代汉语习惯。
- source_word: μισάρετε
  choice: 憎恨美德
  rationale: 按复合词的构成保留其对美德或德性的敌视，比笼统译作“可憎”更具体，也与下一个复合词形成排比。
- source_word: μισάνθρωπε
  choice: 仇视世人的人
  rationale: 该复合词直指憎恨人类或世人的人；此译法自然清楚，并保留斥责意味。
- source_word: τί δράσαντες
  choice: 我们究竟做了什么
  rationale: 将分词结构按现代汉语习惯译成追问；“究竟”传达质问的力度，但不增加行为内容。
- source_word: πορθεῖς
  choice: 摧残
  rationale: 原词常指毁坏、蹂躏或使之荒废；用于受刑者时，“摧残”既保留暴力毁灭的力度，也适合以人为宾语。
- source_word: τοῦτον ... τὸν τρόπον
  choice: 这样
  rationale: 以自然简洁的现代汉语表达“以这种方式”，保留对施虐方式的指示。
