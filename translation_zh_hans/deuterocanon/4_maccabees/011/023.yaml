  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: zh_hans
  text: 你也给自己招来了一个强大的复仇者[a]——你这酷刑的创制者，真正敬畏上帝之人的仇敌！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“强大的报复之灵”；希腊语ἀλάστωρ既可指个人复仇者，也可带有报应力量的意味。
    reason: 保留ἀλάστωρ在个人复仇者、报复之灵与报应力量之间的词义张力。
lexical_decisions:
- source_word: μέγαν
  choice: 强大的
  rationale: 修饰ἀλάστορα，强调其力量；“强大的”比直译“大”更符合现代汉语搭配。
- source_word: σοι
  choice: 给自己
  rationale: 与προσβαλλὼν连用，在此表达对受话者不利的反身结果，即暴君使报应临到自己。
- source_word: προσβαλλὼν
  choice: 招来了
  rationale: 保留“使某物临到”的动作与因果意味，同时符合自然汉语；其敌对方向由“报应者”及语境体现。
- source_word: καὶ αὐτὸς
  choice: 也
  rationale: 表达附加意味；在汉语中置于“给自己”之前简洁自然。
- source_word: ἀλάστορα
  choice: 报应者
  rationale: 该词可指复仇者，也可带来报应力量或复仇之灵的意味。“报应者”既保留位格性，又体现惩罚性；其他可能义置于脚注。
- source_word: καινοτόμε
  choice: 创制者
  rationale: 呼格，指创出新式酷刑的人；“创制者”比“创新者”更适合严厉谴责的语境，也避免正面色彩。
- source_word: βασάνων
  choice: 酷刑
  rationale: 殉道叙事中指折磨人的刑罚或手段，“酷刑”清楚而准确。
- source_word: πολέμιε
  choice: 仇敌
  rationale: 呼格，直接指称敌对者；“仇敌”保持庄重且有强烈谴责意味。
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: 真正敬畏上帝之人
  rationale: εὐσεβέω在此指向对上帝真实的虔敬；“敬畏上帝”在现代中文中自然明确，并保留宗教指向，ἀληθῶς译为“真正”。
theological_decisions:
- issue: εὐσεβούντων的宗教含义
  choice: 真正敬畏上帝之人
  alternative: 真正虔敬的人；真正实行敬虔的人
  rationale: 原词表达对神明的敬重与虔诚。在本书犹太信仰语境中，“敬畏上帝”明确呈现其对象，同时不加入特定宗派教义。
- issue: ἀλάστωρ的位格性与报应意味
  choice: 报应者
  alternative: 复仇者；报复之灵；报应之力
  rationale: 希腊词可指执行复仇的存在，也可带有近似报应力量的意味。正文采用既具位格性又体现惩罚结果的“报应者”，并以脚注保留歧义。
translation_notes:
  register: 采用庄重而有力度的现代标准普通话。以破折号引出两个呼格称谓，使残句式的希腊原文在中文中仍保持直接斥责的修辞力量；不擅自补出主句或明确报应者的具体身份。
