base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: zh_hans
  text: 因为监管我们的卫士，不是暴君的卫士，而是神圣律法的卫士；因此，我们拥有不可战胜的理性。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们的理性是不可战胜的”或“我们拥有不可征服的理性判断”。“理性”所译的希腊词 λογισμός，是《马加比四书》的重要用语，指人的理性能力。
    reason: 说明ἀνίκητον λογισμόν的两种自然汉语句法处理，并保留λoγισμός在本书中的核心哲学含义。
lexical_decisions:
- source_word: τυράννου
  choice: 暴君
  rationale: 保留 τύραννος 所含的专横、压迫意味；“君王”或“统治者”过于中性。
- source_word: θείου νόμου
  choice: 神圣的律法
  rationale: 贴近形容词加名词的希腊语结构，既表明律法具有神圣属性，也不把原文未明说的所有格关系改写为更明确的“上帝的律法”。
- source_word: προεστήκασιν ἡμῶν
  choice: 站在我们前面
  rationale: 保留 προΐστημι 的站立、居前和护卫意象，同时避免过度判定其关系究竟是监管、带领还是保护。
- source_word: οἱ δορυφόροι
  choice: 卫士
  rationale: 该词字面指持矛者，也可指武装侍从或护卫；“卫士”在现代汉语中自然，并保留其职能而不过度限定兵器。
- source_word: ἀνίκητον
  choice: 不可战胜的
  rationale: 准确表达未被征服、不能被胜过之意，并与本节抗拒暴君的语境相称。
- source_word: λογισμόν
  choice: 理性
  rationale: λογισμός 是《马加比四书》的核心术语，指能够判断并约束激情的理性能力；“理性”比“思想”或“心思”更能保留其哲学含义。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 清楚表达后句是由前句推出的结论，符合现代汉语行文。
theological_decisions:
- issue: 卫士与暴君、神圣律法之间的对照关系
  choice: 不属于暴君，而属于神圣的律法
  alternative: 不是奉暴君之命，而是奉神圣律法之命
  rationale: 原文以两个属格形成鲜明对照，但其具体关系可理解为归属、效忠或所代表的权威。“属于”保留这种张力，避免把它完全解释成受谁差遣。
- issue: λογισμός 所指的内在能力
  choice: 理性
  alternative: 理性判断／推理能力
  rationale: 本书以该词指治理激情的理性官能；采用简洁术语，不把经文扩写成特定哲学或宗派教义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“站在我们前面”保留原文具体意象；“不属于……而属于……”刻意保存希腊语关系上的凝练与一定歧义。脚注标记置于其实际说明的“理性”之后。
