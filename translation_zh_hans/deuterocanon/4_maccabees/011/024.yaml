  text: Six young men have overthrown your tyranny.
translation:
  language: zh_hans
  text: 我们六个年轻人已经推翻了你的暴政。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ
  choice: 六个
  rationale: 直接表达基数词；与“年轻人”搭配时使用现代汉语量词“个”，自然清楚。
- source_word: μειράκια
  choice: 年轻人
  rationale: 该词指年少的男性，并带有指小形式的色彩。译作“年轻人”既保留年龄特征，也不以“孩子”削弱他们在此处表现出的道德主体性。
- source_word: κατελύσαμέν
  choice: 已经推翻了
  rationale: καταλύω在此表示摧毁、瓦解或使权势倾覆。不定过去时将行动作为整体陈述；“已经推翻了”在汉语中突出其已然和决定性的修辞效果。
- source_word: σου
  choice: 你的
  rationale: 第二人称单数属格，在此修饰“暴政”，直译为“你的”。
- source_word: τὴν τυραννίδα
  choice: 暴政
  rationale: τυραννίς指暴虐、专横的统治或权势。“暴政”简洁自然，并保留对压迫性统治的直接谴责。
theological_decisions:
- issue: 受迫害者对暴君说话时，不定过去时所表达的胜利意味
  choice: 译作“已经推翻了”，保留完成性及当前结果的修辞力量
  alternative: 译作“推翻了”或较弱的“挫败了”
  rationale: 原文把行动作为已经成就的事实宣告；在上下文中，这首先是对暴政在道德与意志层面失败的胜利宣言，不必将其收窄为字面的政权更替，也不应削弱为暂时受挫。
translation_notes:
  register: 采用简洁、有力而庄重的现代标准汉语。保留原句直面暴君的宣告口吻；“我们”明确包含在希腊语第一人称复数动词中，而“六个年轻人”作为同位性主语自然呈现说话者与其兄弟。
