  yaml_path: translation/deuterocanon/4_maccabees/011/016.yaml
  text: So if it seems good to you to torture those who do not eat defiling food[a], torture us.
translation:
  language: zh_hans
  text: 所以，你若认为该拷打那些没有吃过污秽食物的人，就拷打我们吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστʼ
  choice: 所以
  rationale: 承接上文并引出推论，保留原文的推论语气，同时符合现代汉语表达。
- source_word: εἰ σοὶ δοκεῖ
  choice: 你若认为该
  rationale: δοκεῖ与间接宾语连用，可表达“某人认为合宜、应该”；此译既自然，也保留说话者向对方发出的正式挑战。
- source_word: βασανίζειν / βασάνιζε
  choice: 拷打 / 就拷打
  rationale: 在殉道叙事中，该动词指以肉体酷刑折磨人；“拷打”清楚传达其司法迫害与身体折磨的语境，并保留原文动词重复形成的修辞力量。
- source_word: μὴ μεμοφαγοῦντας
  choice: 不吃污秽之物的人
  rationale: 该表达指拒绝吃会使人受玷污之物的人。“污秽之物”保留污染、玷污的词义；补出“之物”使汉语通顺，又不把所指过度限定为某一种食物。
- source_word: βασάνιζε
  choice: 就拷打我们吧
  rationale: 原文命令式未明说宾语，但上下文明确指说话者及其同伴；汉语补出“我们”可避免句意悬空。“吧”在此表达决然的挑战，而非软化命令。
theological_decisions:
- issue: 是否明说μὴ μεμοφαγοῦντας所涉及的食用对象
  choice: 译作“不吃污秽之物的人”
  alternative: “没有吃的人”或“不沾染污秽的人”
  rationale: 原文表达紧缩，但上下文所争议的是拒吃会造成玷污的东西。补出“之物”是汉语所需的最低限度明示，同时保留“污秽”究竟侧重礼仪、道德还是被禁食物的语义张力。
- issue: 末尾命令式是否补出宾语
  choice: 译作“就拷打我们吧”
  alternative: “就拷打吧”
  rationale: “我们”由说话情境清楚隐含；补出后更符合现代汉语，也准确呈现说话者把自己和同伴置于对方酷刑之下的挑战。
- issue: 如何处理εἰ σοὶ δοκεῖ的价值判断色彩
  choice: 译作“你若认为该”
  alternative: “你若觉得好”或“你若想要”
  rationale: “认为该”保留对方把拷打视为合宜之举的判断，却不暗示译者认可这种判断；这也维持原文的讽刺和道德张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以……就……”清楚呈现推论与挑战；“拷打”直接有力，适合殉道语境。全句避免古奥措辞，也不额外引入特定宗派对食物律例的解释。
