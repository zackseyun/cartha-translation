  source_fidelity: 原文 μὴ μεμοφαγοῦντας 是完成时分词，按其形式应表达“没有吃过／未曾吃过”，而不是泛指习惯性的“不吃”。原文未明说食物，但本段语境确实涉及被视为污秽的食物；在汉语中补出“污秽的食物”可准确而自然地传达其省略的宾语。
  naturalness: 原译整体通顺、语体庄重。“你若认为该拷打……”自然地呈现 εἰ σοὶ δοκεῖ 的挑战性判断。不过“不吃污秽之物的人”既弱化完成体，又使“之物”可能被理解为不限于食物的物品。
  terminology: “拷打”恰当对应 βασανίζειν／βασάνιζε，也保留重复的修辞力量。“污秽”可保留原文的污染／玷污语义；译为“污秽的食物”是语境性补足，不必将其神学化或限定为特定律法类别。
  issues:
