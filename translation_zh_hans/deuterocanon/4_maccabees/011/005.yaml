base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: zh_hans
  text: 还是说，我们敬拜万物的创造者，并按照他美善的律法生活，这难道显得是恶事吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可译作“不对的事”或“坏事”。希腊词 κακόν 可指道德上邪恶、应受责备或不正当的事。
    reason: lexical_alternative
  - marker: b
    text: “美善的律法”也可译作“高尚的律法”或“卓越的律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: 恶事
  rationale: κακόν在这里指道德上恶劣、应受责备或不正当的事。“恶事”保留了原文较强的道德意味，也适合修辞问句。
- source_word: οὐ δοκεῖ
  choice: 难道不显得
  rationale: δοκέω表示“看来、显得”。译作“难道不显得”保留否定疑问形式和判断尚由语境承载的特点，不擅自补出“在你看来”。
- source_word: τὸν πάντων κτίστην
  choice: 万物的创造者
  rationale: κτίστης指创造者或建立者，πάντων赋予其普遍范围；“万物的创造者”准确且具有庄重的神学语体。
- source_word: εὐσεβοῦμεν
  choice: 我们敬拜
  rationale: 该动词表示向神明表达虔敬和尊崇；对象既是“万物的创造者”，“敬拜”在现代汉语中清楚自然。
- source_word: κατὰ
  choice: 按照
  rationale: κατά加宾格在此表示以某事为准则；“按照”简明地表达依循律法而生活。
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: 他美善的律法
  rationale: ἔναρετος兼有德性、美好、卓越和高尚之意。修饰“律法”时，“美善”比生硬的“有德性的”更符合现代汉语，同时保留其伦理评价。
- source_word: ζῶμεν
  choice: 生活
  rationale: ζάω在此指人的生活方式；“按照……律法生活”自然地表达持续依循该准则而活。
- source_word: ἢ
  choice: 还是说
  rationale: ἤ承接前文并引出另一修辞性问句；“还是说”保留其论辩衔接作用。
theological_decisions:
- issue: εὐσεβοῦμεν用于对“万物的创造者”的态度
  choice: 敬拜
  alternative: 敬奉；虔敬地尊崇
  rationale: “敬拜”明确表达对神的宗教性虔敬，但没有加入祭祀形式或特定宗派含义。
- issue: ἢ引出的否定修辞问句的力度
  choice: 还是说……难道不显得……吗？
  alternative: 或是……不算……吗？
  rationale: 保留原文的论辩推进、否定形式以及“显得/看来”的判断色彩，不将其改写成直陈句，也不补出希腊文没有明说的判断主体。
- issue: ἔναρετος对律法的伦理评价
  choice: 美善的律法
  alternative: 高尚的律法；卓越的律法
  rationale: “美善”既能表达道德上的良善，也可涵盖值得称许、优越的意味，避免把律法人格化为“有德性”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“还是说”承接上文论辩；后半句以“难道不……吗”保留希腊文否定修辞问句。未补入“在你看来”等原文未明说的成分。
