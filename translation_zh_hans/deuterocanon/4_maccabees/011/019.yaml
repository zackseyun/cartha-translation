  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
translation:
  language: zh_hans
  text: 他们把尖锐的烤签烧红后，贴在他的背上；又刺穿他的两肋，从他那里灼烧他的内脏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“从他那里”或“从他身上”。这短语的具体空间意义不明确，可能指从他被刺穿的身体一侧向内灼烧。
    reason: 原文ἀπʼ αὐτοῦ的指代及空间关系存在歧义；保留字面表达，并仅在脚注中说明可能的上下文理解。
lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: 尖锐的铁签
  rationale: ὀβελίσκος指小型烤签或尖头金属签；结合烧热后施刑的语境，“铁签”自然明确，也保留器具的形态。ὀξύς译作“尖锐的”，突出其可刺穿的尖端。
- source_word: πυρώσαντες
  choice: 烧热
  rationale: 该过去分词表示先行的动作，即先使铁签炽热，再贴到受刑者背上。
- source_word: τοῖς νώτοις προσέφερον
  choice: 贴到他的背上
  rationale: προσφέρω在此表示把器具移近并施用于身体；“贴到”比单纯“拿到”更能表达酷刑动作，同时不额外强化为“用力按压”。
- source_word: τὰ πλευρὰ διαπείραντες
  choice: 刺穿他的两肋
  rationale: πλευρά可指身体两侧、肋部；中文“他的两肋”简洁自然。διαπείρω含穿透之意，因此译作“刺穿”。
- source_word: τὰ σπλάγχνα
  choice: 他的内脏
  rationale: 在这一具体身体语境中，σπλάγχνα指腹腔内的脏器；“内脏”准确、现代，并保留原文的惨烈感。
- source_word: διέκαιον
  choice: 灼烧
  rationale: 该未完成过去时描写持续进行的烧灼；“灼烧”比一般的“烧”更贴合炽热金属造成的伤害。
- source_word: ἀπʼ αὐτοῦ
  choice: 从那里
  rationale: 希腊文直译近于“从它／他那里”，所指并不完全明确。“从那里”保留空间关系及指代上的含混，避免直接解释成“从体内”。
