base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: zh_hans
  text: “好！”他说，“暴君虽非出于本意，却给我们恩惠[a]。好啊！他借着更高贵的苦难[b]，给我们机会显明我们为遵守自己的律法所表现的坚忍。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给我们恩惠”带有反讽意味：暴君所施加的苦难反而成了他们显明坚忍的机会。
    reason: 说明希腊语同根表达χάριτας…χαρίζῃ所加强的反讽。
  - marker: b
    text: “更高贵的苦难”也可译作“更英勇的磨难”。γενναιοτέρων可指高贵，也可带有英勇、勇敢的意味。
    reason: 保留γενναιοτέρων在“高贵”和“英勇”之间的语义幅度。
lexical_decisions:
- source_word: Καλῶς … καλῶς
  choice: “好！”……“好啊！”
  rationale: 保留原文重复所形成的强调和带有反讽意味的赞叹，同时采用自然的现代汉语表达。
- source_word: ἔλεγεν
  choice: 他说
  rationale: 未完成时在叙事中可自然译为“他说”；本节重点在所说的内容，不必生硬体现持续体。
- source_word: ἄκων, ὁ τύραννος
  choice: 暴君虽非出于本意
  rationale: 按希腊语句法，ἄκων与主格ὁ τύραννος一致，修饰暴君施予“恩惠”这一行为；不把“暴君”误作ἔλεγεν的主语。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 保留τύραννος在本书中的贬义和道德评价色彩。
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: 是在给我们恩惠
  rationale: 用“给……恩惠”体现χάριτας与χαρίζῃ的同根呼应，并保留受难者把迫害反说为恩惠的讽刺。
- source_word: διὰ γενναιοτέρων πόνων
  choice: 借着更高贵的苦难
  rationale: πόνοι在此指痛苦的磨难；比较级γενναιοτέρων表示更高贵、更具崇高品格，而非仅仅更剧烈。
- source_word: ἐπιδείξασθαι παρέχων
  choice: 他让我们……显明
  rationale: παρέχων表达提供条件或机会，ἐπιδείξασθαι表达使某事公开显出；合译为自然的现代汉语。
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: 我们对自己律法的坚忍
  rationale: καρτερία指在苦难中的坚忍不屈；εἰς τὸν νόμον表达坚忍所指向的律法，即对律法的忠贞。
theological_decisions:
- issue: 犹太殉道语境中νόμος的译法
  choice: 律法
  alternative: 法律
  rationale: 这里指殉道者所遵守的祖传、神圣律法；“律法”能准确传达其盟约和宗教语境，又不额外引入宗派性解释。
- issue: ὁ τύραννος在句中的身份
  choice: 作为χαρίζῃ的主语，即无意间施恩的暴君
  alternative: 作为ἔλεγεν的主语，即说话者是暴君
  rationale: ἄκων与ὁ τύραννος均为阳性主格单数，紧密构成“暴君虽非出于本意”的结构；后接第三人称单数χαρίζῃ。语义上，受难者把暴君施加的痛苦视为显明忠贞的机会，也与下文一致。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留两次Καλῶς的重复、暴君无意施恩的反讽，以及“高贵／英勇”之间的真实语义张力；主句划分以希腊语的一致关系和上下文为据。
