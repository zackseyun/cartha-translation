lexical_decisions:
- source_word: ἐφ' οὗ
  choice: 在上面
  rationale: 这是回指前文刑具或刑台的关系表达；中文用“在上面”自然保留其指代，不擅自明确刑具种类。
- source_word: κατατεινόμενος
  choice: 被……拉紧
  rationale: 该被动分词表示身体被牵拉、绷紧；“拉紧”较“伸展开”更能体现刑罚中的张力。
- source_word: εὐμελῶς
  choice: 有条不紊地
  rationale: 该副词含动作有秩序、受控制而审慎施行之意；此译体现施刑过程刻意而有步骤，同时避免将其误解为仁慈的“细心”。
- source_word: ἐκσφονδυλιζόμενος
  choice: 关节也被扭脱
  rationale: 该词描述脊椎或关节遭强力错脱；此译以自然现代汉语表达身体所受的脱臼伤害，又不扩大为“肢解”。
- source_word: ὑπεκαίετο
  choice: 下面有火不断烧着他
  rationale: 未完成时被动态表示持续受烧，ὑπο-又有从下方施加之意；该译同时保留持续性和空间方向。
