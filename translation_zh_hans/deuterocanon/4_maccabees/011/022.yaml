  text: I too[a], armed with noble virtue, will be laid to rest with my brothers[b],
translation:
  language: zh_hans
  text: 我也既已以高尚的德行武装起来[a]，将与我的弟兄们一同被安放[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高尚的德行”也可译作“高贵与善良”或“道德上的卓越”；希腊词指高尚而优良的道德品格。
    reason: lexical_alternative
  - marker: b
    text: “被安放”也可理解为“与我的弟兄们一同安息”。希腊语的被动表达本可泛指“被放置”，但在这里很可能是指在死亡中与他们相聚。
    reason: alternative_reading
lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: 以高尚的德行
  rationale: 该与格表示说话者以何种品质或凭借什么受到装备；καλοκαγαθία兼有高贵品格与道德卓越之意。“高尚的德行”在现代汉语中自然庄重，也不把它缩减为社会身份或体面。
- source_word: καθωπλισμένος
  choice: 武装自己
  rationale: 该完成时被动分词源于καθοπλίζω，意为充分武装或装备。结合“德行”，采用“武装自己”保留鲜明的军事隐喻；汉语用主动形式更自然，但语义上仍指已经以德行为装备。
- source_word: τεθήσομαι
  choice: 要……被安放
  rationale: 这是τίθημι的将来时被动形式，基本义为“将被放置/安放”。殉道语境使其很可能含有死后与弟兄们同在之意，但正文采用“被安放”，以保留希腊语较宽泛的被动表达。
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ是καὶ ἐγώ的缩合，强调说话者也要加入弟兄们；“我也”简洁自然地传达这种共同承担。
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: 与我的弟兄们一同
  rationale: μετά加属格表示伴随；上下文所指是说话者的兄弟们。“与……一同”明确保留陪伴和归属感。
theological_decisions:
- issue: 殉道语境中τεθήσομαι的含义
  choice: 正文译作“被安放”，由语境暗示与弟兄们同死或死后同在
  alternative: “与我的弟兄们一同安息”或“被葬在我的弟兄们那里”
  rationale: 上下文强烈指向死亡，但希腊语本身只是τίθημι的将来被动，并未明说“安息”或“埋葬”。采用较宽的正文译法并以脚注说明，可保留原文的语义张力，避免把语境推论写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“以……武装自己”保留原文军事隐喻；“被安放”保留被动和原文未完全限定的含义。所有脚注标记均已置于正文相应位置。
