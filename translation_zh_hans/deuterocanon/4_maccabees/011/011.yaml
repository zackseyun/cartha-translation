lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον
  choice: 就这样
  rationale: 这是承接前文、说明方式的惯用表达；“就这样”自然简洁，并保留上下文的延续作用。
- source_word: πνεῦμα
  choice: 灵
  rationale: πνεῦμα在此可指人的内在生命，也可能指气息。“灵”与下文“身体”形成鲜明对应，同时用脚注保留“气息”的可能。
- source_word: στενοχωρούμενος
  choice: 受困
  rationale: 该词本义含受挤压、陷入狭窄之意，也可表示困迫或痛苦。“受困”既保留压迫意象，又不把含义限定为单纯的心理苦恼。
- source_word: σῶμα
  choice: 身体
  rationale: 直接表达身体层面的受苦，与“灵”相对而不作额外的神学发挥。
- source_word: ἀγχόμενος
  choice: 被扼得窒息
  rationale: 该动词表示咽喉受压、被勒或窒息。“被扼得窒息”既呈现具体动作，也保留分词所表达的持续过程。
theological_decisions:
- issue: πνεῦμα与σῶμα所呈现的人之内外层面
  choice: 分别译作“灵”和“身体”
  alternative: 将πνεῦμα译作“气息”或“心思”
  rationale: 原文并置πνεῦμα与σῶμα，描述内在与身体同时承受痛苦。“灵”和“身体”保留这种张力，但不据此建立更完整的二元人论；“气息”的词义可能则留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。译文保留原句未完的承接语气，并用两个并列短语呈现灵与身体同时受苦；避免以术语化表述过度解释其人论含义。
