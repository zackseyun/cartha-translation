  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: zh_hans
  text: 我虽然比我的兄弟们年幼，心智却与他们相当。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: 年幼
  rationale: ἡλικία在此指年龄；与兄弟比较时，采用“年幼”自然地表达实际年龄较小。
- source_word: νεώτερος
  choice: 比……年幼
  rationale: 比较级表示说话者的年龄小于其兄弟们；汉语用“比……年幼”清楚传达比较关系。
- source_word: διανοίᾳ
  choice: 心智
  rationale: διανοία在此指理解、判断等心智能力；“心智”既简洁自然，也能与前句的年龄形成鲜明对照。
- source_word: ἡλικιώτης
  choice: 与他们相当
  rationale: 该词本可指同龄者或同辈者，但在此受“心智”限定，表示在心智层面与兄弟们处于同等水平，不能按字面译为同龄。
- source_word: ἀδελφῶν
  choice: 兄弟们
  rationale: 阳性复数结合叙事语境特指说话者的兄长们；“兄弟们”忠实保留其性别和亲属关系。
theological_decisions:
- issue: ἡλικιώτης与νεώτερος对照时的含义
  choice: 在心智上与兄弟们相当
  alternative: 在成熟程度上是他们的同辈；在判断力上与他们地位相同
  rationale: 句子刻意对照实际年龄较小与διανοία方面的平等。将ἡλικιώτης理解为心智上的相当，既避免与前半句矛盾，也保留原文的修辞张力，而不进一步限定为智力或道德成熟。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我虽然……却……”再现希腊文μέν…δέ的对照结构；“心智”保留理解力、判断力及成熟度之间的适度开放性。
