  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: zh_hans
  text: 他正说这些话时，卫兵把他捆住，拖到刑轮[a]前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施刑器具”。这个希腊词通常可指“弩炮”，但在这里指用于施刑的器械，传统上理解为刑轮。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  choice: 这些话
  rationale: 中性复数指向他刚才所说的内容；汉语用“这些话”比直译“这样的事”更自然，也符合言说语境。
- source_word: λέγοντα
  choice: 正说……时
  rationale: 现在分词表示与卫兵捆绑、拖走他的行动同时发生，并带有持续意味。
- source_word: δορυφόροι
  choice: 卫兵
  rationale: 该词本义为“持矛者”，在希腊化时期常指护卫或卫兵；“卫兵”自然表达其执行拘押的身份，又不无根据地限定为私人贴身侍卫。
- source_word: δήσαντες
  choice: 捆起来
  rationale: 不定过去时分词表示他们先将他捆绑，然后拖走；此译简洁地保留动作次序。
- source_word: εἵλκον
  choice: 拖到
  rationale: 未完成过去时描写强行拖拽的动作；“拖”保留原文的暴力感。
- source_word: καταπέλτην
  choice: 刑轮
  rationale: 该词通常可指“弩炮”，但在本段殉道受刑的语境中指施刑器具，传统上理解为轮刑架；正文用“刑轮”避免让现代读者误以为是战场兵器，同时以脚注保留词义上的不确定性。
theological_decisions:
- issue: 受刑语境中καταπέλτης所指的器具
  choice: 刑轮
  alternative: 施刑器具；弩炮
  rationale: 这不是教义性争议，但具体器具无法仅凭该词完全确定。正文采用最符合上下文且便于理解的“刑轮”，脚注说明也可宽泛理解为施刑器具，并保留其通常词义“弩炮”，避免把推断冒充确定事实。
translation_notes:
  register: 采用现代、庄重而清晰的叙事体。“他正说这些话时”体现同时发生的动作；“捆起来，拖到”保持原文紧凑、强烈的动作顺序。脚注标记紧随存在词义不确定性的“刑轮”。
