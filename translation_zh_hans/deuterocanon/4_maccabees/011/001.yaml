  text: And when this one also had died under torture[a], the fifth came forward, saying,
translation:
  language: zh_hans
  text: 这个人也遭受酷刑折磨而死后，第五个作了个手势[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示意”；希腊文没有说明这动作的对象或具体内容。
    reason: 保留παρεσήμαινεν可指作手势或示意的词义范围，以及其对象和内容未明的含混性。
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……后，……便……
  rationale: ὡς在这里引出时间从句，δέ承接叙事；汉语用“……后，……便……”自然表达事件的先后推进。
- source_word: καὶ οὗτος
  choice: 这一个也
  rationale: 保留οὗτος回指前一个受刑者的指示意味，也用“也”体现καί所强调的接连遭遇。
- source_word: ταῖς βασάνοις καταικισθεὶς
  choice: 受尽酷刑
  rationale: βάσανοι指严酷的刑罚或折磨，καταικισθείς强调遭受残酷虐待；“受尽酷刑”简洁而有力地合并表达两者，避免汉语重复。
- source_word: ἐναπέθανεν
  choice: 而死
  rationale: 表达他在遭受酷刑之后或其过程中死亡；与前面的分词结合，译成“受尽酷刑而死”符合汉语叙事习惯。
- source_word: ὁ πέμπτος
  choice: 第五个
  rationale: 原文以序数词实词化，语境表明是第五个兄弟；正文不补出“兄弟”，以保持原文的简洁。
- source_word: παρεσήμαινεν
  choice: 示意
  rationale: 该动词表示作出信号或表示某意；原文没有明说示意的对象和具体内容，因此不在正文中补作“准备上前”等解释。
- source_word: λέγων
  choice: 说
  rationale: 以简洁自然的汉语引出下一节的直接引语。
