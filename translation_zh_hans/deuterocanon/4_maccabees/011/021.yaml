  text: For godly understanding is unconquerable[a], O tyrant.
translation:
  language: zh_hans
  text: 暴君啊，要知道，敬虔的理智是不可战胜的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔的理智”也可译作“虔敬的理性”或“敬虔的知识”。希腊语这一短语兼有对神的敬畏与理性认知两层含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνίκητος
  choice: 不可征服的
  rationale: 该词表示不能被战胜或压服。译作“不可征服的”既保留与“征服、得胜”相关的词根意象，也适合在本句中作谓语。
- source_word: γὰρ
  choice: 因为
  rationale: 该连词承接上下文，说明前述论断的理由；现代汉语中“因为”能清楚表达其解释性关系。
- source_word: ὦ τύραννε
  choice: 暴君啊
  rationale: ὦ标示直接呼语，τύραννε是τύραννος的呼格；“暴君啊”自然保留直斥统治者的强烈语气。
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: 敬神的理智
  rationale: εὐσεβής强调对神的敬畏与虔敬，ἐπιστήμη指知识、理解或理性认识。结合《马加比四书》关于受敬神之心引导的理智之主题，“敬神的理智”同时保留宗教伦理与理性认知两面。
theological_decisions:
- issue: 如何翻译《马加比四书》中具有纲领意义的εὐσεβὴς ἐπιστήμη
  choice: 敬神的理智
  alternative: 虔敬的知识；敬神的认识
  rationale: “敬神的理智”凸显全书所论受敬神信仰塑造、能够支配情欲的理性，同时没有把ἐπιστήμη局限为抽象知识。由于原短语也可侧重知识或认识，脚注保留这些可能。
translation_notes:
  register: 采用现代、庄重而有力度的中文。呼语“暴君啊”前置，符合自然汉语并保留原文当面斥责的语势；“不可征服的”保持原文简洁有力的断言。
