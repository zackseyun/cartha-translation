  text: After he said these things[a], they led him to the wheel.
translation:
  language: zh_hans
  text: 他说完这些话[a]，他们就把他带到刑轮那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑轮”是这段殉道记述中用来施刑的轮形刑具。
    reason: cultural_note
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指代前文所说的内容；汉语用“这些话”自然地保留复数性的回指。
- source_word: εἰπόντα
  choice: 说完
  rationale: 不定过去时分词修饰αὐτόν，表示动作先于主句发生；“说完”简洁自然地表达这一先后关系。
- source_word: παρῆγον
  choice: 带到
  rationale: 未完成过去时在此表示把人押送或带往某处；“带到”符合强制移送至刑具前的语境，又不额外强化原文未明说的方式。
- source_word: ἐπὶ
  choice: 到……那里
  rationale: 与移动动词连用时表示朝向或抵达；此译法避免武断地说已经被放到刑轮上。
- source_word: τὸν τροχόν
  choice: 刑轮
  rationale: τροχός字面为“轮”，在殉道受刑的上下文中指轮形刑具；“刑轮”在正文中既简洁，又能让现代读者明白所指，同时脚注补充说明。
