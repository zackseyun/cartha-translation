  text: Now look[a], being alien to God[b], you are making war against those who are devout toward God.
translation:
  language: zh_hans
  text: 现在你看：你与上帝疏远[a]，竟向那些虔诚敬奉上帝的人开战[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对上帝如同外人”，或“不属于上帝”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与……争战”，或“攻击……”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 既保留时间和话语推进作用，也自然引出当面的责斥。
- source_word: ἰδὲ
  choice: 你看
  rationale: 这是唤起注意的命令语；“你看”符合现代汉语的直接语气，又不像“看哪”那样古雅。
- source_word: ἀλλότριος ὢν θεοῦ
  choice: 你既与上帝疏远
  rationale: ἀλλότριος与属格θεοῦ表示相对于上帝处于外人、隔绝或疏离的状态；“与上帝疏远”保留关系断裂的尖锐含义，同时避免将其限定为族群上的外邦身份。用“既”承接分词ὢν，并自然说明后句行动所基于的状态。
- source_word: πολεμεῖς
  choice: 竟向……开战
  rationale: 保留动词的战争性和主动敌对力度；“竟”传达责斥中的反常与震惊，但不改变命题内容。
- source_word: τοὺς εὐσεβοῦντας
  choice: 那些虔诚敬奉……的人
  rationale: 现在分词指持续对上帝表现敬虔的人；“虔诚敬奉”在现代汉语中清楚表达敬虔实践。
- source_word: εἰς τὸν θεόν
  choice: 上帝
  rationale: 在εὐσεβέω之后，εἰς标明敬虔所指向的对象。汉语以“敬奉上帝”自然表达这一关系，无须生硬直译为“向着上帝”。
theological_decisions:
- issue: ἀλλότριος θεοῦ所表达的关系
  choice: 译作“与上帝疏远”，理解为与上帝隔绝、对上帝而言如同外人
  alternative: “对上帝是外人”或“不属于上帝”
  rationale: 上下文责斥暴君不敬虔并敌对敬虔者，因此此语主要刻画他与上帝之间的关系和道德立场。译文不把它缩减为民族或社会身份，也不引入后期系统神学术语。
translation_notes:
  register: 采用现代、庄重而直接的责斥语气。“现在你看”对应话语标记和注意命令；感叹号体现当面斥责的力度。“开战”保留πολεμεῖς的军事意象；“虔诚敬奉上帝的人”避免名词化、教派化的“敬虔者”，便于普通读者理解。脚注标记紧随其所解释的词组。
