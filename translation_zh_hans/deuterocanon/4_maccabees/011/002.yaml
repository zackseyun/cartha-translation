  text: I am not about to shrink back[a], tyrant, from the torture for the sake of virtue.
translation:
  language: zh_hans
  text: “暴君啊，我绝不会拒绝为了美德而受酷刑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暴君啊，我绝不会在为了美德而受的酷刑面前退缩。”希腊语动词可指推辞或拒绝；在此语境中也可带有面对苦难不退避的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: 我绝不会
  rationale: μέλλω加不定式在这里表达临近行动中的明确意志；结合否定词，译作“绝不会”自然地传达说话者当下坚定的决心。
- source_word: τύραννε
  choice: 暴君啊
  rationale: 呼格直接而带谴责意味地称呼统治者；“暴君啊”保留了正面斥责的力量。
- source_word: πρὸς τὸν ... βασανισμόν
  choice: 因这……酷刑退缩
  rationale: πρός短语与παραιτεῖσθαι相连，指面对酷刑而推辞或退避；汉语用“因这……酷刑退缩”表达其关系较为自然。
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: 为了美德
  rationale: ὑπέρ在此表示缘故或目的；ἀρετή指道德上的卓越与坚贞，“为了美德”保留全书的伦理哲学用语。
- source_word: παραιτεῖσθαι
  choice: 退缩
  rationale: 该词可指推辞、拒绝；在殉道受刑的语境中，也包含面对苦难不退避的意味。“退缩”准确传达语境中的意志张力。
theological_decisions:
- issue: ἀρετή在带有哲学色彩的殉道语境中的含义
  choice: 美德
  alternative: 卓越
  rationale: 本书强调敬虔理性及人在苦难中持守道德品格；“美德”既保留伦理哲学色彩，也不把词义扩展为某种特定教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“暴君啊”保留呼格的对抗性，用“绝不会……退缩”表现说话者即时而坚定的决心；不添加原文未明说的承受方式或神学解释。
