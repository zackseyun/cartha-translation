base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/017.yaml
  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
translation:
  language: zh_hans
  text: 因为，有自制力的心智[a]能够战胜激情的强制力，也能够熄灭狂热冲动[b]的灼热。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“理性”；希腊词 νοῦς 可指心智、理解力或理性机能。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊词可指如受刺螫驱迫般的狂乱冲动或强烈欲念，并非只指性欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς
  choice: 能够
  rationale: 此处作表语，表达能力或可能性；“能够”自然准确，不把它抽象化为“强大”。
- source_word: σώφρων
  choice: 有节制的
  rationale: 在理性驾驭情欲的伦理语境中，指清醒、克制而有自制力；“有节制的”既保留伦理含义，也不把词义缩窄为一般的“谨慎”。
- source_word: νοῦς
  choice: 心智
  rationale: 该词可指心思、理解力或理性机能。“心智”在现代汉语中较自然，并能涵盖此处负责支配情欲的理性能力；另以脚注保留“理性”这一译法。
- source_word: νικῆσαι
  choice: 战胜
  rationale: 保留原文得胜、制服的强烈争战意象。
- source_word: ἀνάγκας
  choice: 强逼
  rationale: 这里不是一般意义上的“必然性”，而是情欲施加的迫使和约束力量；“强逼”能传达这种内在压力。
- source_word: παθῶν
  choice: 情欲
  rationale: 在希腊化伦理语境中，该词指扰动并支配人的情感、欲念或激情。“情欲”适合本节语境，但并非专指性欲。
- source_word: σβέσαι
  choice: 熄灭
  rationale: 原词常用于灭火，与后面的灼热意象相应。
- source_word: οἴστρων
  choice: 狂烈冲动
  rationale: 该词可由牛虻的刺螫引申为驱迫、狂乱或强烈欲念；“狂烈冲动”保留其急迫失控的力量，又避免将其限定为性欲。
- source_word: φλεγμονάς
  choice: 灼热
  rationale: 该词指发炎、燃烧般的热度；“灼热”简洁保留火热意象，也与“熄灭”自然搭配。
theological_decisions:
- issue: νοῦς所指的人之内在机能
  choice: 译为“心智”，由上下文表现其理性和治理作用
  alternative: 译为“理性”或“悟性”
  rationale: 原文强调能制服情欲的理性心智，但词本身并不必然要求一种特定的人论体系；“心智”保留语义宽度，脚注同时说明“理性”的可能译法。
- issue: 本节对情欲范围的描述
  choice: 将πάθη译为“情欲”，将οἴστρων译为“狂烈冲动”
  alternative: 分别译为“激情”和“欲望”
  rationale: 这样既呈现两组词的区别，也不把它们都收窄为性欲，从而保留原文较广的伦理心理含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“战胜—熄灭”保留原文连续的强烈意象；句式简洁，适合普通读者诵读。
