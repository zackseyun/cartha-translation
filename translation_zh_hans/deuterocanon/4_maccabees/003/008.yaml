    text: “王帐”也可译作“王室帐幕”；希腊语形容词意为“王室的、君王的”，在此可能特指营中君王的帐幕。
    reason: lexical_alternative
  - marker: b
    text: “他先祖的全军”在希腊语中结构紧凑，也可译作“他列祖所有的军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  choice: 那时，天色已晚
  rationale: γενομένης ἑσπέρας是表示时间背景的属格独立结构；“天色已晚”自然表达夜幕已经降临。τότε δὴ承接叙事，用“那时”呈现，不额外强化δὴ。
- source_word: ἱδρῶν
  choice: 汗流浃背
  rationale: 现在分词描述他抵达时正在出汗的状态；此译生动自然，符合长途奔波后的语境。
- source_word: σφόδρα κεκμηκώς
  choice: 疲惫不堪
  rationale: σφόδρα强化κεκμηκώς所表示的疲惫结果状态；“疲惫不堪”兼顾强度和现代汉语的自然表达。
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: 来到王帐
  rationale: βασίλειος意为“王室的、君王的”，σκηνή为军营中的帐幕；“王帐”简洁而符合营地场景，同时保留其可能指君王帐幕的含义。
- source_word: περὶ ἣν
  choice: 在王帐周围
  rationale: περί在此表达空间上的环绕关系；为避免汉语关系从句过长，重述“王帐”。
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: 他先祖的全军
  rationale: 希腊语结构较为压缩；“先祖”保留πρόγονοι的谱系意味，“全军”对应ὁ πᾶς…στρατός，不具体指认历史人物。
- source_word: ἐστρατοπέδευκεν
  choice: 都驻扎
  rationale: 该形式表达驻营形成后的持续状态；汉语“驻扎”自然呈现军队围绕王帐安营的情景，不强行加入原文未明确标出的过去完成时。
theological_decisions:
- issue: “先祖”所指的历史对象
  choice: 保留“他先祖”的概括表达，不补出具体姓名、民族或历史事件。
  alternative: 将其具体解释为以色列历史中某些先祖及其军队。
  rationale: 原文τῶν προγόνων未明说所指；译文保留其历史与谱系含义，也保留指代上的开放性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“汗流浃背，疲惫不堪”保持场景的鲜明感；“王帐”“全军”“驻扎”契合军事营地语境。脚注标记均置于对应正文处。
