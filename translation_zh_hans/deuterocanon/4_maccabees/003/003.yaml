  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
translation:
  language: zh_hans
  text: 没有人能从你们的心灵中割除愤怒；但帮助愤怒却是可能的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“帮助（或援助）愤怒”。按语境，也可作较具解释性的理解，如“善用愤怒”或“引导愤怒趋向良善”。
    reason: 说明末句不寻常的搭配，并列出可能的解释而不在正文中消除歧义。
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: 愤怒
  rationale: θύμος可指愤怒、怒气或激烈的情感冲动；本节前后重复使用该词，译文也重复译作“愤怒”，以保留原文的词语呼应。
- source_word: ἐκκόψαι
  choice: 割除
  rationale: 该动词本义为“砍掉、割去”。“割除”既保留从心灵中切除某物的鲜明比喻，也符合现代汉语的庄重语体。
- source_word: ψυχῆς
  choice: 心灵
  rationale: ψυχή在此指人的内在生命或情感意志所在。“心灵”比“生命”更符合本段的伦理心理语境，也比“灵魂”较少引入后世的实体二分观念。
- source_word: δυνατὸν βοηθῆσαι
  choice: 可以……给……以助力
  rationale: βοηθέω通常指帮助、援助；与愤怒搭配颇为出人意料。译文保留这一张力，不径自改成“控制”“缓和”或“善用”。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 保留原文第二人称复数领属形式，明确所说的是听众各人的心灵。
theological_decisions:
- issue: 末句τῷ θυμῷ δυνατὸν βοηθῆσαι的理解
  choice: 保留“给愤怒以助力”的字面悖论式表达
  alternative: 善用愤怒；引导愤怒趋向良善；调节愤怒
  rationale: 原文只说“帮助/援助愤怒”，没有明说这种帮助是利用、引导还是节制。正文不根据上下文替作者补足结论，以保存原句的含混和伦理张力；较具解释性的可能性放入脚注。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“割除”保留原文的切割意象；“给愤怒以助力”刻意保留希腊语末句的反常张力。脚注标记已在正文中以[a]出现。
