  text: Therefore[a], this is possible to perceive more clearly through the thirst of David the king.
translation:
  language: zh_hans
  text: 因此，这一点可以从大卫王口渴的事上看得更清楚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看得更清楚”也可译作“更清楚地思量”或“更清楚地推知”。希腊语ἐπιλογίσασθαι含有思量、推断或通过推理认识的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν γοῦν
  choice: 因此……可以
  rationale: γοῦν带有承接上文并作推论的语气，译作“因此”；ἔστιν与不定式连用，汉语自然表达为“可以……”。
- source_word: τοῦτο
  choice: 这一点
  rationale: 指向上文所论之事；“这一点”既保留指示性，又比单说“这”更自然。
- source_word: διὰ τῆς Δαυεὶδ τοῦ βασιλέως δίψης
  choice: 从大卫王口渴的事上
  rationale: διά加属格在此引出作为说明依据的事例。译作“从……事上”符合现代汉语，也不把它误解为单纯原因。
- source_word: Δαυεὶδ τοῦ βασιλέως
  choice: 大卫王
  rationale: 希腊文直译为“大卫，那位王”；“大卫王”是现代汉语自然、庄重的称法。
- source_word: δίψης
  choice: 口渴
  rationale: δίψα意为“渴、口渴”，原文没有明示程度，故不添加“极其”等强化语。
- source_word: σαφέστερον
  choice: 更清楚
  rationale: 保留比较级含义，表示借此事例能更清楚地认识前述论点。
- source_word: ἐπιλογίσασθαι
  choice: 看得……清楚
  rationale: 该中动不定式可表示思量、推知或经反思而认识；正文采用自然汉语“看得更清楚”，脚注保留“思量、推知”的词义幅度。
