base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/001.yaml
  text: But this line of reasoning is utterly ridiculous[a], for reason evidently does not prevail over its own passions[b], but over bodily ones.
translation:
  language: zh_hans
  text: 然而，这种论证[a]实在荒唐；因为理性显然不能支配理性自身的情感冲动，而只能支配身体的情感冲动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论证”所译的希腊词也可指“推理”或作为机能的“理性”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“身体的那些”；这里依照上文补出“情感冲动”，也可理解为身体的欲望或冲动。
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιδῇ γελοῖος
  choice: 实在荒唐
  rationale: κομιδῇ加强语气，γελοῖος指可笑、荒谬；“实在荒唐”既保留强烈批评，也符合现代汉语的庄重论辩语体。
- source_word: λογισμός
  choice: 论证（首次）；理性（再次）
  rationale: 首次指正在受批评的论点或推理，后一次指能够控制情感冲动的理性机能。采用不同译词，以呈现本句在具体论证与理性机能之间的语用转换。
- source_word: τῶν ἑαυτοῦ παθῶν
  choice: 它自身的情感冲动
  rationale: 保留反身代词ἑαυτοῦ造成的哲学张力，不把“自身”解释性改写掉；πάθη在本书语境中主要指情感、欲望等驱动力，而非单纯的“苦难”。
- source_word: ἐπικρατεῖν
  choice: 控制
  rationale: 此词表示占上风、取得支配权；“控制”在现代汉语中自然，并适合描述理性对冲动的支配。
- source_word: φαίνεται
  choice: 显然
  rationale: 表达由观察或论证显出的判断，保留原文的推断色彩。
- source_word: τῶν σωματικῶν
  choice: 身体方面的情感冲动
  rationale: 原文以形容词复数实体化使用，并省略由上文补出的πάθη；译文补出“情感冲动”，使汉语指向清楚。
theological_decisions:
- issue: 理性与情感冲动之间的哲学区分
  choice: 首次将λογισμός译为“论证”，再次译为“理性”，并保留“它自身的情感冲动”这一不寻常表述。
  alternative: 各处统一译为“理性”或“推理”，并将“自身的”解释为“人的”。
  rationale: 原句先批评一种论证，随后陈述理性机能所能控制的对象。保留词义转换与反身表达，可避免替作者消解其修辞和哲学张力。
translation_notes:
  register: 采用现代、庄重而易懂的论辩语体。“情感冲动”比现代汉语中容易被狭义理解为性欲的“情欲”更宽泛，也更贴近πάθη在本书中的哲学含义。分号保留原句先判断、后说明理由的结构。
