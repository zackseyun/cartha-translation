  yaml_path: translation/deuterocanon/4_maccabees/003/018.yaml
  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: zh_hans
  text: 并且能够制服极其剧烈的肉体疼痛，又凭理性的高尚与美善，唾弃情欲[a]的一切支配力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情欲”在这里泛指试图支配人的各种激情和欲念，并非仅指性欲。译作“唾弃”的希腊语动词字面带有“吐唾沫弃绝”的鲜明意象，用以表示轻蔑地拒绝。
    reason: 说明 πάθη 的广泛含义，并说明 ἀποπτύσαι 的形象性轻蔑拒绝意味；标记移至“情欲”后，以消除锚点歧义。
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: 疼痛
  rationale: 指身体上的痛楚；“疼痛”自然明确，又不把程度夸大为原文未必要求的“剧痛”。
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: 极其剧烈的
  rationale: 此短语强化肉体疼痛的程度；译作定语使现代汉语流畅，同时保留“超乎寻常、过度”的语气。
- source_word: καταπαλαῖσαι
  choice: 制服
  rationale: 该动词带有角力并战胜对手的形象。“制服”保留克胜、压服之意，也比直译“摔倒”更适合疼痛这一宾语。
- source_word: καλοκἀγαθίας
  choice: 高尚与美善
  rationale: 这个复合理念兼含高贵与道德上的良善；并列译出可避免用单一的“美德”抹平其双重色彩。
- source_word: λογισμοῦ
  choice: 理性
  rationale: 本书以此词指支配情欲的理性能力或理性判断；“理性”简洁，并能维持全书核心术语的一致性。
- source_word: ἀποπτύσαι
  choice: 唾弃
  rationale: 原词字面有“吐唾沫弃绝”之意，转义表示鄙弃；“唾弃”在中文中既保留鲜明意象，又庄重自然。
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: 各种情欲的支配
  rationale: ἐπικρατεία表示掌权、控制或支配；复数 πάσας 可自然译作“各种”。“情欲”在此泛指扰动并试图控制人的激情与欲念，并非仅指性欲。
theological_decisions:
- issue: 在哲学和伦理意味浓厚的语境中翻译 λογισμός
  choice: 理性
  alternative: 理性判断；心智
  rationale: 本书论述敬虔的理性如何治理情欲。“理性”既保留概念分量，又不额外引入某一哲学体系或宗派解释。
- issue: πάθη 的涵盖范围
  choice: 情欲
  alternative: 激情；情感冲动
  rationale: “情欲”符合经书体裁并可涵盖驱使人的欲念与激情，但现代读者可能把它误解为单指性欲，因此以脚注加以澄清，不把原词的范围缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的经书语体。以“制服”传达角力克胜的隐喻，以“唾弃”保存原文强烈的鄙弃色彩；句首保留“并且”，反映本节与上文在句法和论证上的延续关系。
