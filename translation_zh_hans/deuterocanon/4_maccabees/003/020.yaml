base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: zh_hans
  text: 因为我们的祖先由于守法有序[a]，享有深厚的太平，境况良好，以致连亚细亚的王塞琉古·尼卡诺也拨出款项，供他们举行神圣礼仪，并认可他们的政体[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“由于秩序良好”或“由于遵守律法”。希腊语可指在法律之下有秩序地生活，也可能含有忠于犹太律法之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的宪制”或“他们的社会秩序”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: 深厚的太平
  rationale: 保留 βαθεῖαν“深”的修辞色彩；“太平”自然表达群体所享有的安定和平。
- source_word: διὰ τὴν εὐνομίαν
  choice: 由于守法有序
  rationale: εὐνομία兼有守法与良好秩序之意；此译避免将其单独限定为遵守摩西律法。
- source_word: ἔπραττον καλῶς
  choice: 凡事顺遂
  rationale: 该习语表示境况良好、行事顺利；译法兼顾自然中文和上下文中的兴盛含义。
- source_word: ἀφορίσαι
  choice: 拨出
  rationale: 在款项语境中表示划拨、指定专用资金。
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: 款项，供他们举行神圣礼仪
  rationale: ἱερουργία指神圣或圣殿相关的礼仪事奉；保持宽泛，不将其过度限定为祭司职务。
- source_word: τὴν πολιτίαν αὐτῶν
  choice: 他们的政体
  rationale: πολιτεία在此具有公共政治秩序或制度之义；“政体”准确而简洁。
- source_word: ἀποδέχεσθαι
  choice: 认可
  rationale: 表达君王对其政体的赞同和接纳，比单纯“接受”更符合语境。
- source_word: βασιλέα Σέλευκον τὸν Νικάνορα
  choice: 亚细亚王塞琉古·尼卡诺
  rationale: 按希腊文保留王号、地域称号和专名，同时采用自然的中文次序。
theological_decisions:
- issue: εὐνομία是否专指遵守犹太律法
  choice: 译作“守法有序”，保留一般法律秩序与守法生活两层含义。
  alternative: 译作“遵守律法”，明确指向犹太律法。
  rationale: 上下文可能隐含对犹太律法的忠诚，但 εὐνομία本身语义较宽，不宜在正文中将其收窄。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以“守法有序”保留 εὐνομία的复合含义；句末分号反映本节在希腊文中仍承接后文。
