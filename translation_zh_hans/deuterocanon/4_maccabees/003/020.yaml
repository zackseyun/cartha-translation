revisions:
- from: 因为我们的祖先由于守法有序[a]，享有深厚的太平，凡事顺遂，甚至连亚细亚王塞琉古·尼卡诺也拨出款项，供他们举行神圣礼仪，并认可他们的政体[b]；
  to: 因为我们的祖先由于守法有序[a]，享有深厚的太平，境况良好，以致连亚细亚的王塞琉古·尼卡诺也拨出款项，供他们举行神圣礼仪，并认可他们的政体[b]；
  rationale: 仅将“凡事顺遂”改为“境况良好”，以避免把概括性的 ἔπραττον καλῶς 扩展成无保留的‘凡事’皆顺利；并微调王号语序，使现代书面汉语更自然。其余译文和脚注保留原有的语义宽度与锚点。
