  text: And now the time also calls us to the demonstration of the history of rational self-control.
translation:
  language: zh_hans
  text: 现在，时机也催促我们转而借着历史叙事，展示节制的理性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤδη δὲ καὶ
  choice: 现在……也
  rationale: 保留承接并推进论述的语气；汉语不机械译出每个连接词。
- source_word: ὁ καιρὸς ἡμᾶς καλεῖ
  choice: 时机也催促我们
  rationale: καιρός 指适当的时机或时候；καλεῖ 在此有论述进程要求作者转入下一部分之意，“催促”较自然地传达这种修辞拟人。
- source_word: ἐπὶ τὴν ἀπόδειξιν
  choice: 转而……证明
  rationale: ἐπί 加宾格表示朝向某项目；ἀπόδειξις 是论证、证明或展示。加入“转而”使汉语清楚表达论述阶段的转换。
- source_word: τῆς ἱστορίας
  choice: 以史事
  rationale: ἱστορία 在此结合后续殉道叙事，指历史叙述或史事；译作“以史事”让其自然充当证明的材料，同时避免生硬的“历史的证明”。
- source_word: τοῦ σώφρονος λογισμοῦ
  choice: 节制的理性
  rationale: σώφρων 可指审慎、自制、节制；λογισμός 指理性、理性思考。此书主题是理性对情欲的掌控，因此采用“节制的理性”，并保留属格短语可能兼有性质描述的张力。
theological_decisions:
- issue: σώφρων λογισμός 所表达的伦理主体
  choice: 节制的理性
  alternative: 理性的自制／审慎的理性
  rationale: 原文把 σώφρων 直接修饰 λογισμός，并未明确将“自制”实体化；“节制的理性”较贴近语法，也不预先限定理性与德性之间的关系。
- issue: ἱστορία 与 ἀπόδειξις 的关系
  choice: 以史事证明
  alternative: 证明节制理性的历史／展示其历史叙述
  rationale: 属格结构存在修饰关系上的压缩表达。按全书推进，此处最自然是说将借接下来的史事作证明；译文明确基本逻辑，但不加入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“时机催促我们”保留原文拟人修辞；语序略作调整，以避免“历史的证明”在现代汉语中的歧义和生硬感。
