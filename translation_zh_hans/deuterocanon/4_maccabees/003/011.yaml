base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/011.yaml
  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
translation:
  language: zh_hans
  text: 然而，有一种对敌人那里的水所怀的非理性渴望[a]，紧紧压迫着他，使他枯槁；又在使他松弛时，将他烧灼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对敌营中之水所怀的非理性渴望。”希腊文直指“在敌人那里”的水。
    reason: lexical_alternative
  - marker: b
    text: 这里的意象高度浓缩：渴望被拟人化，既紧紧压迫他，又使他松弛，继而烧灼他，描绘极度干渴对身体造成的相反作用。
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文形成转折；“然而”庄重自然，适合本书的论述语体。
- source_word: τις
  choice: 一种
  rationale: 保留不定代词的意味，同时与中文的抽象名词“渴望”自然搭配。
- source_word: ἀλόγιστος
  choice: 非理性
  rationale: 本书以理性与激情的对立为核心；“非理性”比“无知觉”或“荒唐”更准确地保留其哲学含义。
- source_word: ἐπιθυμία
  choice: 渴望
  rationale: 表示强烈欲求；在饮水语境中，“渴望”自然贴切，又不像“情欲”那样带入性含义。
- source_word: τοῦ παρὰ τοῖς πολεμίοις ὕδατος
  choice: 对敌人那里之水
  rationale: 保留介词短语“在敌人那里”的空间或所属含义，不直接将其解释限定为“敌营中的水”。
- source_word: ἐπιτείνουσα
  choice: 紧勒着
  rationale: 保留伸紧、绷紧并施压于他的鲜明拟人意象，同时使中文可读。
- source_word: συνέφρυγε
  choice: 使他枯槁
  rationale: 表达干缩、枯萎的身体效果，符合剧烈干渴的语境。
- source_word: λύουσα
  choice: 使他松弛
  rationale: 紧贴“松开、解开”的基本含义，并保留它与前文“紧勒”之间有意而压缩的张力。
- source_word: κατέφλεγεν
  choice: 将他灼烧
  rationale: 保留加强式动词所表达的持续而强烈的焚灼意象。
theological_decisions:
- issue: 《马加比四书》中理性与激情的术语对照
  choice: 将 ἀλόγιστος 译为“非理性”
  alternative: 不理智、荒唐
  rationale: “非理性”明确保留本书关于理性统御激情的思想框架，却不额外引入任何宗派解释。
- issue: 渴望造成“紧勒”与“松弛”的矛盾意象
  choice: 两种动作均按原文保留
  alternative: 将 λύουσα 解释性译为“使他虚弱”
  rationale: 原文有意并置相反的身体意象；直译其张力，避免替作者消解难点。
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。“非理性渴望”保留本书的哲学术语；“紧勒—松弛—灼烧”则尽量保存希腊文压缩、悖论式的身体意象。
