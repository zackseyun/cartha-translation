  text: For reason is not the uprooter of the passions[b][a], but their adversary.
translation:
  language: zh_hans
  text: 因为理性并不把各种情欲连根拔除[a]，而是与它们抗争[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“根除各种情欲”。希腊语保留了“连根拔起”的意象。
    reason: lexical_alternative
  - marker: b
    text: 意思是：理性并不使情欲彻底消失，而是与它们争战。
    reason: explanatory
lexical_decisions:
- source_word: λογισμός
  choice: 理性
  rationale: 本书以此词指进行审慎判断、约束行为的理性能力；“理性”简洁自然，也保留其哲学分量。
- source_word: ἐκριζωτής
  choice: 把……连根拔除
  rationale: 采用动词化表达，使现代汉语自然流畅，同时保留原词“从根拔起”的具体意象。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: 此处 πάθη 指驱动人的强烈欲望和情感冲动，而非单指苦难。“情欲”在伦理语境中较贴切；加“各种”表明其范围不限于某一种欲望。
- source_word: ἀνταγωνιστής
  choice: 与……抗争
  rationale: 原词指与对方较量、争斗的人；动词化译为“与它们抗争”，既自然，又保留与前半句的鲜明对照。
theological_decisions:
- issue: 理性与情欲的关系
  choice: 理性不会彻底根除情欲，而是持续与之抗争。
  alternative: 理性不是情欲的毁灭者，而是它们的对手。
  rationale: 原文否定理性是 ἐκριζωτής，却肯定它是 ἀνταγωνιστής；译文保留“不能消灭、却能抗争”的张力，不把它解释成毫无情感的理想，也不引入后来的神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。将两个施事名词动词化，以免“根除者／对抗者”显得生硬，同时保留原句的否定—转折结构和争战意象。
