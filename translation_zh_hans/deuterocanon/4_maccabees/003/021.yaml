  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
translation:
  language: zh_hans
  text: 那时，确有些人背离共同的和睦而作乱[a]，并以各种方式利用灾祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作乱”也可译作“发动叛乱”或“采取革命行动”。希腊词 νεωτερίσαντες 可带有政治动乱或革命行动的较强含义。
    reason: lexical_alternative
  - marker: b
    text: “利用灾祸”直译为“使用灾祸”；也可译作“以多种方式借助这些不幸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: 那时，确实
  rationale: 兼顾 τότε 的时间推进和 δή 的强调语气；现代汉语中自然且庄重。
- source_word: τινες
  choice: 有些人
  rationale: 保留不定复数所指，不具体说明这些人的身份。
- source_word: πρὸς τὴν κοινὴν ... ὁμόνοιαν
  choice: 背离共同的和睦
  rationale: 结合 νεωτερίσαντες，πρός 表示其变乱行为所针对的对象；“共同的和睦”保留群体和谐、同心的含义，不加入过强的后世政治术语。
- source_word: νεωτερίσαντες
  choice: 图谋变乱
  rationale: 该词在此不只是“创新”，而有制造动乱或政治性变革的意味；“图谋变乱”既保留其较强语气，也符合分词所表达的伴随或先行情形。
- source_word: πολυτρόπως
  choice: 以种种方式
  rationale: 清楚表达行动方式的多样性。
- source_word: ἐχρήσαντο συμφοραῖς
  choice: 利用灾祸
  rationale: χράομαι 加与格意为使用、利用；“灾祸”涵盖 συμφοραί 的灾难、不幸之义，同时保留原文中利用这些灾祸的意味。
