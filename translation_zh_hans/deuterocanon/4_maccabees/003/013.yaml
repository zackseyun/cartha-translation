  text: And after escaping the notice of the gate guards[a], they kept going through, having made their way through the whole camp of the enemy.
translation:
  language: zh_hans
  text: 他们瞒过守门的哨兵，继续穿行，找到了穿过整个敌营的路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文末尾表达较为压缩：“找到”一词没有明说宾语，“遍及／穿过整个敌营”的短语与之的具体关系也不够明确。这里按上下文理解为他们找到了穿过敌营的路。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαθόντες
  choice: 瞒过
  rationale: 该不定过去时分词带宾格对象，表示行动没有被对方察觉；“瞒过”简洁自然，也保留了避开监视的意味。
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: 守门的哨兵
  rationale: ἀκροφύλακες 指担任警戒的守卫，属格短语说明其岗位在门口；“守门的哨兵”符合军事场景，也比生硬的“门的守卫”自然。
- source_word: διεξῄεσαν
  choice: 继续穿行
  rationale: 未完成过去时突显持续进行的动作，复合动词表示穿过某处；“继续穿行”兼顾进行体与空间方向。
- source_word: εὑράμενοι
  choice: 找到了……的路
  rationale: 分词本义为“找到”；原文省略了显明的宾语，结合穿越营地的语境，以“找到路”补足汉语表达所需成分，同时用脚注说明原文的压缩性。
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: 穿过整个敌营
  rationale: στρατόπεδον 是“营地”，τῶν πολεμίων 表示属于敌方；κατά 加宾格在此按空间范围理解，指贯穿营地全境。
