  text: For when David, attacking the foreigners throughout the whole day, killed many of them along with the soldiers of the nation,
translation:
  language: zh_hans
  text: 因为大卫整整一天攻打外族人[a]，并与本民族[b]的士兵一同杀了他们许多人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非利士人”。希腊文作“外族人”（ἀλλόφυλοι）；这个词在圣经希腊文中常用来指非利士人，但这里本身并不是专有族名。
    reason: lexical_alternative
  - marker: b
    text: 或译“与那民族的士兵一同”。希腊文字面作“与那民族的士兵一同”，没有明说“本”或“他的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ γὰρ
  choice: 因为
  rationale: ἐπεί与γάρ共同引出下文所说明的缘由；中文以“因为”自然承接前文，同时保留本节未完的从句结构。
- source_word: διʼ ὅλης ἡμέρας
  choice: 整整一天
  rationale: 表达行动持续贯穿全天，既准确又符合现代汉语习惯。
- source_word: προσβάλλων
  choice: 攻打
  rationale: 该分词在军事语境中表示攻击、进攻；“攻打”简洁清楚。
- source_word: τοῖς ἀλλοφύλοις
  choice: 外族人
  rationale: ἀλλόφυλοι字面指异族之人；圣经希腊文中常指非利士人，但此处并未使用专有族名，故正文保留较宽泛的称呼。
- source_word: ὁ Δαυεὶδ
  choice: 大卫
  rationale: 采用现代中文圣经传统通行人名。
- source_word: πολλοὺς αὐτῶν ἀπέκτεινεν
  choice: 杀了他们许多人
  rationale: 直接表达ἀποκτείνω的“杀死”义，并保留“他们中许多人”的数量关系。
- source_word: μετὰ τῶν τοῦ ἔθνους στρατιωτῶν
  choice: 与本民族的士兵一起
  rationale: μετά加属格表示伴随；结合叙事，士兵是与大卫共同作战者。“本民族”使中文所指清楚，同时用脚注说明希腊文较为字面的表达。
