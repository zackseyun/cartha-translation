revisions:
- from: 因此，护卫们正为王的渴望而愤慨时，有两个刚毅的年轻士兵，因王的渴望而深感羞愧[a]，便穿戴起全副军装，又拿了一个水罐[b]，越过敌人的栅垒。
  to: 因此，守卫者们正因王的渴望而愤慨时，两个年轻而刚毅的士兵见王有此渴望而感到羞愧[a]，便披上全副铠甲，又拿了一个水罐[b]，越过敌人的栅垒。
  rationale: 修订收窄处的角色限定，并以“全副铠甲”准确表达完整武装；同时改善καταιδεσθέντες相关语句的汉语可读性，保留其心理动机的文本歧义。脚注标记均保留并置于相应词句之后。
