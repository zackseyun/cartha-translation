    issue: “护卫们”可能将ὑπερασπισταί过窄地译为王的贴身护卫。
    rationale: 该词可泛指守卫、保卫的人；本节军事语境虽不排除护卫含义，但原文未明确指定其为王的贴身侍卫。
  - severity: medium
    issue: “全副军装”对πανοπλίαι不够精确。
    rationale: “军装”在现代汉语通常指军服；原文指完整的武装/甲胄，宜译为“全副铠甲”或“全套装备”。
  - severity: low
    issue: “因王的渴望而深感羞愧”的汉语指向略显生硬。
    rationale: 可用“见王有此渴望而感到羞愧”明确羞愧者是两名士兵，同时仍不界定羞愧究竟是出于敬畏、未能及时满足，还是其他具体心理缘由。
