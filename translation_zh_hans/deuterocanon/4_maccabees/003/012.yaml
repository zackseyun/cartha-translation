  yaml_path: translation/deuterocanon/4_maccabees/003/012.yaml
  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
translation:
  language: zh_hans
  text: 因此，守卫者们正因王的渴望而愤慨时，两个年轻而刚毅的士兵见王有此渴望而感到羞愧[a]，便披上全副铠甲，又拿了一个水罐[b]，越过敌人的栅垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处可表示他们“因王的渴望而感到羞愧”，也可能带有因王的愿望而感到难堪、受触动或出于敬畏的意味。简练的原文没有完全说明这种羞愧的确切缘由。
    reason: alternative_reading
  - marker: b
    text: “水罐”原文指罐或壶，可能是用来盛水的。
    reason: cultural_note
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 表示承接上文的结果或推论，用“因此”自然保留逻辑联系。
- source_word: ὑπερασπιστῶν
  choice: 护卫们
  rationale: 指为人防守、护卫的人；本节是军事语境，“护卫”既明确又不强定为某种专门官职。
- source_word: ἐπὶ τῇ τοῦ βασιλέως ἐπιθυμίᾳ
  choice: 为王的渴望
  rationale: ἐπιθυμία可指愿望、欲望或渴求；上下文所指的是王想喝水的强烈愿望，“渴望”保留强度而不过度贬义化。
- source_word: σχετλιάζόντων
  choice: 愤慨
  rationale: 表达强烈的不满或激愤；“愤慨”保留其情感及道德色彩。
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: 两个刚毅的年轻士兵
  rationale: 将彼此紧密相连的名词和修饰语合译；καρτεροί兼有坚忍、坚定和勇毅之意，“刚毅”适合这里的英勇行动。
- source_word: καταιδεσθέντες
  choice: 深感羞愧
  rationale: 该分词表示因羞耻感而有所反应；“深感羞愧”贴近原文，同时不进一步断定这种羞愧的具体心理机制。
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: 穿戴起全副军装
  rationale: πανοπλία指全套武装，动词中间态表示他们装备自己；“穿戴起全副军装”符合现代汉语军事叙述。
- source_word: κάλπιν
  choice: 一个水罐
  rationale: κάλπις指罐或壶，常用于盛水；结合叙事目的译作“水罐”。
- source_word: ὑπερέβησαν
  choice: 越过
  rationale: 表示跨过或越过某种界限、障碍。
- source_word: χάρακας
  choice: 栅垒
  rationale: χάραξ复数可指尖桩、栅栏或营地防御工事；“栅垒”兼顾木栅障碍和军事防御设施。
