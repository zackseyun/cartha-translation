  text: Therefore[a], setting reason against desire, he poured out the drink as a libation to God.
translation:
  language: zh_hans
  text: 因此，他以理性对抗欲望，将那饮物倾倒出来，献给上帝作奠祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“把那饮物倾倒给上帝。”希腊语动词含有以饮物行奠祭的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 承接上文并引出推论；“因此”在现代汉语中清楚自然。
- source_word: ἀντιθεὶς
  choice: 用……来对抗
  rationale: 表达把一方置于另一方对面、加以抗衡的主动行为，同时符合汉语习惯。
- source_word: τῇ ἐπιθυμίᾳ
  choice: 欲望
  rationale: 保留ἐπιθυμία较宽泛的欲求含义，不将其限缩为食欲或特定激情。
- source_word: τὸν λογισμόν
  choice: 理性
  rationale: λογισμός在本书中指能够约束欲望的理性思考或判断能力；“理性”简洁地保留其哲学意味。
- source_word: ἔσπεισεν
  choice: 倾倒出来，作为……奠祭
  rationale: σπένδω具有以液体行奠祭的礼仪含义；译文明确这一动作，避免仅译“倒出”而遗漏祭献意味。
- source_word: τὸ πόμα
  choice: 那饮料
  rationale: 按名词本义翻译；奠祭含义由动词表达，不把祭献意义重复加在名词上。
- source_word: τῷ θεῷ
  choice: 献给上帝
  rationale: 将与祭献动作相连的与格自然地表达为接受者。
theological_decisions:
- issue: σπένδω与τὸ πόμα所表达的祭祀含义
  choice: 译为把饮料倾倒出来，作为献给上帝的奠祭
  alternative: 较直译为“把那饮料倒给上帝”
  rationale: 希腊语动词本身特指奠酒或奠祭；明示“奠祭”能使现代读者准确理解宗教礼仪意味，又不增添原文以外的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“理性”与“欲望”保留本书的哲学对照；“奠祭”虽属礼仪用语，但由上下文和脚注加以说明。
