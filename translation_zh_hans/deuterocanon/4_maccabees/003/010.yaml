  text: But the king[a], though very thirsty, even though he had abundant springs, was not able through them to relieve his thirst.
translation:
  language: zh_hans
  text: 可是，王渴得厉害；尽管拥有充足的泉水，却无法靠这些泉水治好自己的干渴。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “治好”也可译作“解除”或“止住”。希腊文所用的动词通常指“医治、治愈”，这里可能有意采用医疗比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: 可是，王
  rationale: δὲ在这里表示轻微转折或承接；译作“可是”保留与上文的对比，同时符合现代汉语表达。
- source_word: ὡς μάλιστα διψῶν
  choice: 渴得厉害
  rationale: ὡς μάλιστα加强διψῶν的程度；“渴得厉害”自然地表达强烈口渴，不把分词误解为让步关系。
- source_word: καίπερ ἀφθόνους ἔχων πηγάς
  choice: 尽管拥有充足的泉水
  rationale: καίπερ明确引出让步；ἀφθόνους表示充裕、不缺乏，πηγάς保留具体的“泉水”意象。
- source_word: οὐκ ἠδύνατο διʼ αὐτῶν
  choice: 却无法靠这些泉水
  rationale: “却无法”承接让步结构；“靠这些泉水”清楚表达διʼ αὐτῶν的工具意义及其回指对象。
- source_word: ἰάσασθαι τὴν δίψαν
  choice: 治好自己的干渴
  rationale: ἰάομαι通常意为“医治、治愈”；“治好……干渴”虽带有刻意的修辞张力，却能保留原文的医疗比喻。中文补出“自己的”，使所指自然明确。
