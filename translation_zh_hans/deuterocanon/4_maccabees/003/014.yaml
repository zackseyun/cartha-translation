  text: And after courageously finding the spring[a], they filled the king’s drink from it.
translation:
  language: zh_hans
  text: 他们勇敢地找到那处泉源后，就从那里为王盛满了饮品。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为王盛满了饮品”也可译为“盛满了王的饮品”。希腊语与格τῷ βασιλεῖ较直接可表示“给王”或“为王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευράμενοι
  choice: 找到……后
  rationale: 不定过去时分词表示先于主句动作发生；译为“找到……后”既清楚呈现时序，也保留分词的附属关系。
- source_word: θαρραλέως
  choice: 勇敢地
  rationale: 该副词表示勇气与无畏；“勇敢地”自然、庄重，也符合上下文对克服恐惧的强调。
- source_word: τὴν πηγὴν
  choice: 那泉源
  rationale: πηγή在此指天然涌水处；“泉源”准确且适合叙事语体，定冠词依上下文译作“那”。
- source_word: ἐξ αὐτῆς
  choice: 从泉里取水
  rationale: αὐτῆς回指泉源。汉语若直译“从它”较生硬，明确重复“泉”并补出语境蕴含的“取水”，使动作关系自然清楚。
- source_word: ἐγέμισαν
  choice: 盛满
  rationale: 动词意为使某物充满；“盛满”比单说“装满”更适合液体和饮用器皿，同时保留完成意味。
- source_word: τῷ βασιλεῖ
  choice: 给王
  rationale: 与格最直接表示受益者或接受者，即“给王／为王”；正文保留此句法关系，不将其强制解释为所有格。
- source_word: τὸ ποτόν
  choice: 喝的饮品
  rationale: ποτόν指所喝之物。译为“饮品”保留其名词意义；加入“喝的”与“给王”自然衔接，并避免把原文直接限定为“水”。
