  yaml_path: translation/deuterocanon/4_maccabees/003/002.yaml
  text: For example[a], reason cannot cut off any one of your desires, but reason can make it possible not to be enslaved to desire.
translation:
  language: zh_hans
  text: 例如，你们中没有一个人能斩断欲望；但理性能够使人不受欲望奴役。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷον
  choice: 例如
  rationale: 引出一个说明前述论点的例子；“例如”自然保留其举例作用。
- source_word: ἐπιθυμίαν / τῇ ἐπιθυμίᾳ
  choice: 欲望
  rationale: 原文两次使用同一名词，均作泛指；统一译作“欲望”，既保留词语呼应，也不把它过度强化为“情欲”或“激情”。
- source_word: τις ὑμῶν
  choice: 你们没有人
  rationale: 与否定词 οὐ 连用，直指“你们中任何人都不能”；原句前半的主语是人，而不是“理性”。
- source_word: ἐκκόψαι
  choice: 斩断
  rationale: 保留动词“砍下、割断”的鲜明比喻，比“消除”更贴近原文，同时在“斩断欲望”的现代汉语搭配中清楚可懂。
- source_word: δουλωθῆναι
  choice: 受……奴役
  rationale: 保留被动形式及明确的奴役意象，不弱化为“被控制”或“被支配”。
- source_word: ὁ λογισμός
  choice: 理性
  rationale: 这是《马加比四书》论证中的关键哲学用语，指人的理性判断能力；“理性”简洁、庄重且符合现代汉语。
- source_word: παρασχέσθαι
  choice: 能够使人
  rationale: 该词在此表示提供或促成某种可能；“能够使人不……”自然表达理性可以促成不受奴役这一结果，而不暗示理性能消灭欲望。
theological_decisions:
- issue: 理性与欲望之间的关系
  choice: 人不能斩断欲望，但理性能使人不受欲望奴役。
  alternative: 理性不能斩断人的欲望，却能使人不受欲望奴役。
  rationale: 希腊文前半句的主语是 τις ὑμῶν（“你们中的任何人”），后半句才以 ὁ λογισμός（“理性”）为主语。译文保留这一主语转换，也维持“不能消灭欲望”与“可以不被欲望奴役”之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“斩断”保留原文比喻，“受……奴役”保留道德哲学语境中的强烈意象；分号凸显前后两项能力判断的对照。
