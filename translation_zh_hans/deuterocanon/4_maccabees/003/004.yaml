base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/004.yaml
  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: zh_hans
  text: 你们中任何一个人都不能把恶劣的性情[a]彻底除掉[b]；但理性能助人不向这种恶劣的性情屈服[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“恶意”“邪恶品性”或“恶劣倾向”。希腊词主要指不良的道德性情，而不只是某一次恶行。
    reason: lexical_alternative
  - marker: b
    text: 直译“砍掉”或“剪除”。这里指彻底除去。
    reason: lexical_alternative
  - marker: c
    text: 原文用盟友并肩作战、前来相助的说法。
    reason: lexical_alternative
  - marker: d
    text: 直译“使人不被这种恶劣的性情压弯”，即不向它让步或屈服。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειαν / κακοηθείᾳ
  choice: 恶劣的性情
  rationale: 该词指品格上的恶劣、恶意或邪恶倾向，并非仅指某一次恶行。“恶劣的性情”保留其内在品性或倾向的含义；两处采用同一译法，以呈现原文的词语照应。
- source_word: τις ὑμῶν
  choice: 你们中没有人
  rationale: τις为主格，是δύναται的主语；ὑμῶν为部分属格，意为“你们中的任何人”。它并不修饰宾格κακοήθειαν。与οὐ连用，在此自然表达“你们中没有人能……”。
- source_word: οὐ δύναται ἐκκόψαι
  choice: 不能……连根除掉
  rationale: ἐκκόπτω本义为“砍掉、剪除”。“连根除掉”在现代汉语中既自然，又保留彻底铲除的形象。
- source_word: τὸ μὴ καμφθῆναι
  choice: 不……屈服
  rationale: κάμπτω字面意为“使弯曲”，被动式在道德语境中表示被压弯、让步或屈服。“屈服”清楚传达此处含义，同时脚注保留原有意象。
- source_word: δυνατὸν ὁ λογισμὸς συμμαχῆσαι
  choice: 理性能够助你们一臂之力
  rationale: λογισμός在本书中是具有主题意义的理性判断能力；συμμαχέω本指作为盟友并肩作战、前来相助。“助……一臂之力”保留协同援助之意，也表明理性提供真实帮助，却不是独自根除恶劣性情。
theological_decisions:
- issue: 理性、恶劣性情与道德抵抗之间的关系
  choice: 人不能根除恶劣的性情，但理性能够帮助人不向它屈服。
  alternative: 把前半句理解为“理性不能除掉人的任何一种邪恶倾向”。
  rationale: 原文τις为主格，ὑμῶν为部分属格，因此前半句的主语是“你们中的任何人”，不是后半句的ὁ λογισμός。译文据此保留原文的对比：人不能彻底铲除这种品性，理性却能作为助力，使人不屈服于它；不将其扩展为关于人性或理性能力的后期教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“理性”保留本书论证中的核心术语；“连根除掉”与“助你们一臂之力”兼顾原文形象和汉语自然度。原文第二分句没有明说受助者，译文依语境补出“你们”，以免汉语表达生硬。
