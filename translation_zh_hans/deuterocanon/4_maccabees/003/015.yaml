base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/015.yaml
  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: zh_hans
  text: 他即使被干渴烧灼，仍认定：这饮品若被视为与血等同，对灵魂便是极其可怕的危险。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文末句结构紧凑：直译可作“他认定，这饮品被视为与血等同，是对灵魂极其可怕的危险。”这也可理解为，饮用这饮品会被认作等同于饮血。
    reason: 说明末句中“饮品”与“饮用行为”之间可能的语义关联，同时保留原文以饮品为句法焦点的表达。
lexical_decisions:
- source_word: διαπυρούμενος περὶ τὴν δίψαν
  choice: 渴得如火焚烧
  rationale: 保留分词所表达的炽热、焚烧意象，同时以现代汉语自然表达极度干渴。
- source_word: ἐλογίσατο
  choice: 推断
  rationale: 体现 λογίζομαι 所强调的理性权衡与判断，而不弱化为一般的“觉得”。
- source_word: πάνδεινον κίνδυνον
  choice: 极其可怕的危险
  rationale: πάνδεινον 强烈加重“可怕”的程度；此译法兼顾修辞力度和现代汉语的自然性。
- source_word: τῇ ψυχῇ
  choice: 给灵魂
  rationale: 在本书的伦理哲学语境中，ψυχή 指向人的内在生命与道德自我；“灵魂”保留其幅度，不缩减为肉身性“生命”。
- source_word: λογισθὲν ἰσοδύναμον
  choice: 看作与……同等
  rationale: 保留被动判断的含义及“同等、等效”的比较关系，也与前面的理性推断形成呼应。
- source_word: τὸ ποτὸν
  choice: 这饮品
  rationale: 定冠词指上下文中的特定饮品；“这饮品”比孤立的“饮品”更清楚，也不采用古雅的“饮料/一饮”。
- source_word: αἵματι
  choice: 血
  rationale: 直接保留原文的血之意象，不在正文中加入律法背景解释。
theological_decisions:
- issue: ψυχή 在伦理劝诫语境中的含义
  choice: 灵魂
  alternative: 生命
  rationale: 句子关注的是理性判断所要避免的内在、道德性危险，不只是肉体生命的危险；“灵魂”较能保留原文的神学与哲学张力，但不对其作后期教义化界定。
- issue: 末句“饮品与血同等”的句法和含义
  choice: 若把这饮品看作与血同等，就会给灵魂带来极其可怕的危险
  alternative: 把喝下这饮品算作饮血，会给灵魂带来极其可怕的危险
  rationale: 希腊文的压缩结构允许把重点放在饮品被判为与血同等。正文保留这一比较方式，不把潜在的行为含义或犹太禁血背景直接写入译文。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。“渴得如火焚烧”保留原文鲜明意象；冒号呈现其内在推断。仅设置一个确有必要的句法说明脚注，标记已在正文出现。
