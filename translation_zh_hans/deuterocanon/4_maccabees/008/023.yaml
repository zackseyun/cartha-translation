lexical_decisions:
- source_word: τί
  choice: 为什么
  rationale: 在这个反问句中表示原因，译作“为什么”最符合商议、反诘的语气。
- source_word: ἐξάγομεν ἑαυτοὺς
  choice: 使自己离开
  rationale: ἐξάγω本义为“领出、带出”；与反身代词连用时，“使自己离开”既保留从某种生活境况中出来的意象，也符合现代汉语表达。
- source_word: τοῦ ἡδίστου βίου
  choice: 这最为惬意的生活
  rationale: ἥδιστος是“愉快、甘美”的最高级，βίος在此指生活或生活境况。“最为惬意的生活”自然地传达其最高级含义；加“这”使汉语所指流畅，但不增添实质内容。
- source_word: καὶ
  choice: 又
  rationale: 连接两个并列的反问动作；“又”在汉语中自然承接前句。
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: 剥夺自己
  rationale: ἀποστερέω意为“剥夺、夺去”；原文以反身代词作宾语，却没有保存下来的受剥夺之物，因此保持未完成结构，不擅自补足。
