  text: of the sweet world[a]. Let us not force necessity[b], nor let us boast in our own torture-rack.
translation:
  language: zh_hans
  text: 甜美的尘世；我们不要强逼那不可避免的事[a]，也不要以自己的刑架妄自夸耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要催迫那不可避免的事”或“不要对必然之事施以强力”。希腊语表达十分紧缩，可能是说不要主动催促那无法避免的磨难。
    reason: lexical_alternative
  - marker: b
    text: “刑架”所译的希腊词指一种扭绞、折磨身体的刑具。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: 甜美的尘世
  rationale: γλυκύς保留“甜美”的感官隐喻，κόσμος在此指今世及其生活；译作“尘世”比抽象的“秩序”更符合殉道语境。原文以属格短语承接上文，本节开头在现有分节中略显残缺。
- source_word: μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: 我们不要强逼那不可避免的事
  rationale: βιάζομαι带有强迫、施力之意，ἀνάγκη可指必然、不得已或强制。此译保留原文紧缩而不寻常的表达，并用“那不可避免的事”使现代读者能够理解其所指。
- source_word: μηδὲ κενοδοξήσωμεν
  choice: 也不要……妄自夸耀
  rationale: κενοδοξέω不只是一般的夸口，还含空虚、虚荣的意味；“妄自夸耀”自然地传达这一贬义。
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: 以自己的刑架
  rationale: στρέβλη指扭绞身体的刑具，尤其是刑架；“刑架”简洁而明确。ἐπί加与格在此可表示夸耀所凭借或所涉及的事物，译作“以”。
theological_decisions:
- issue: μὴ βιαζώμεθα τὴν ἀνάγκην的劝诫含义
  choice: 不要强逼那不可避免的事
  alternative: 不要催促不可避免的磨难；不要抗拒必然之事；不要违逆情势所迫的要求
  rationale: 希腊语表达紧缩，可能是劝人不要主动催迫或加剧即将临到的磨难，也可能涉及不要以暴力对待“必然”之事。正文保留其张力，脚注列出主要语义可能，不把某一种解释定为唯一含义。
- issue: 因刑架而“妄自夸耀”所指
  choice: 保留对虚荣式自我彰显的警告
  alternative: 将其解释为不要因受苦本身而骄傲，或不要主动寻求殉道
  rationale: 原文确实把虚荣与“自己的刑架”相连，却没有完整阐明其动机；因此不在正文中加入“主动寻求殉道”等解释性内容。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“甜美的尘世”保留原文对现世吸引力的形象说法；“强逼那不可避免的事”有意保留希腊语的不寻常搭配，并借脚注说明歧义。
