  yaml_path: translation/deuterocanon/4_maccabees/008/010.yaml
  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: zh_hans
  text: 所以，你们要怜惜自己；连我这个与你们为敌的人，也因你们的年纪[a]而怜惜你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因你们年纪尚轻。”希腊词也可更具体地指一个人所处的人生阶段。
    reason: 保留 ἡλικία 在“年纪”与较具体的“年纪尚轻”之间的词义可能。
lexical_decisions:
- source_word: κατελεήσατε
  choice: 要怜惜
  rationale: 这是表示命令的过去时祈使语气，要求听者对自己生出怜悯并采取相应行动；“要怜惜”自然、庄重，也保留了劝告的力度。
- source_word: ἑαυτούς
  choice: 自己
  rationale: 反身代词，指听者应当怜惜自身，现代汉语用“自己”最为自然。
- source_word: οὓς
  choice: 你们
  rationale: 关系代词回指前面的“你们自己”。汉语若直译为关系结构会显得生硬，因此在后半句中复现为“你们”。
- source_word: ὁ πολέμιος
  choice: 与你们为敌的人
  rationale: 原文直译为“敌人”。结合说话者以第一人称自称的语境，译作“我这个与你们为敌的人”既明确敌对关系，又避免加入原文没有的具体身份。
- source_word: ἔγωγε
  choice: 连我……也
  rationale: ἔγωγε 是强调的第一人称形式；“连我……也”准确表现其修辞反差：甚至敌对的说话者本人也怜惜他们。
- source_word: τῆς ἡλικίας
  choice: 因你们的年纪
  rationale: ἡλικία 可泛指年龄或人生阶段，语境中也可能特指年轻；正文采用较宽泛的“年纪”，并以脚注保留“年轻”的可能。
theological_decisions:
- issue: ἡλικία 的具体含义
  choice: 因你们的年纪
  alternative: 因你们年轻
  rationale: 该词本身可指年龄或人生阶段，虽上下文可能强调年轻，却不足以在正文中排除较宽泛的含义；因此正文保留词义张力，脚注注明较具体的理解。
- issue: 后半句怜悯动词的省略
  choice: 补出“怜惜你们”
  alternative: 按希腊语表面形式保留省略
  rationale: 所给希腊文本在关系从句中未重述怜悯动词，语义须从 κατελεήσατε 承接。现代汉语若完全省略会造成残句，故补出已由上下文明确蕴含的“怜惜”，不增添新的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”承接 οὖν；分号清楚呈现命令与说话者自我对照的两层结构。“连我……也”传达 ἔγωγε 的强调语气。脚注标记紧随其所解释的“年纪”。
