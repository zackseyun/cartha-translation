base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: zh_hans
  text: 你们改变生活方式以后，就享受自己的青春吧。但如果你们因不服从而激怒我[a]，就会迫使我用可怕的刑罚和酷刑，把你们逐一处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “激怒我”一句也可较直译为：“如果你们因不服从而愤怒地对待我。”希腊原文的表达较难确定，正文采用较符合上下文的意思。
    reason: 保留ὀργίλως με διαθῆσθε的词汇与句法歧义。
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: 改变生活方式以后
  rationale: 该分词表示改换生活方式或日常准则；这里指要求青年人放弃现有立场，改用另一种生活方式，不额外引入“悔改”等宗教含义。
- source_word: ἐντρυφήσατε
  choice: 享受
  rationale: 该命令式在此表示享乐、尽情享受；“享受”自然贴合对青春年华的诱劝，又避免“放纵”所带的额外道德判断。
- source_word: ταῖς νεότησιν ὑμῶν
  choice: 自己的青春
  rationale: 希腊文以复数表达青春时期，现代汉语用单数“青春”更自然。
- source_word: ὀργίλως … διαθῆσθε
  choice: 激怒我
  rationale: 这一搭配较难直译；结合下文的威胁，最可能表示他们的不服从使说话者动怒。
- source_word: ἀπειθείας
  choice: 不服从
  rationale: 直接表达拒绝听从或不顺从，不强化为“叛逆”。
- source_word: δειναῖς κολάσεσιν
  choice: 可怕的刑罚
  rationale: κολάσεις指惩罚或刑罚，δειναῖς强调其可怕和严厉。
- source_word: βασάνων
  choice: 酷刑
  rationale: 在司法迫害语境中指折磨或酷刑；“酷刑”准确体现具体施刑手段。
- source_word: ἀπολέσαι
  choice: 除掉
  rationale: ἀπόλλυμι可指毁灭或杀死；在酷刑语境中实际指置于死地。“除掉”保留说话者威胁性的表达，同时避免生硬的“毁灭你们”。
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: 把你们一个个
  rationale: 保留原文双重分配表达所强调的逐一处置。
theological_decisions:
- issue: ἐὰν ὀργίλως με διαθῆσθε这一困难短语的理解
  choice: 如果你们因不服从而激怒我
  alternative: 如果你们以不服从的方式愤怒地对待我
  rationale: 原文结构可较直译地理解为“愤怒地对待我”，但与随后“迫使我”惩罚他们的威胁相连时，使说话者动怒更符合语境。脚注保留较直译的可能性，不将歧义完全抹平。
- issue: ἐπεὶ的语篇关系
  choice: 但如果
  alternative: 因为如果／既然如果
  rationale: ἐπεὶ通常有因果意味，但这里从享受青春的诱劝转入不服从便受刑的威胁，汉语以“但如果”更自然地呈现语篇转折；不把它处理成神学因果判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“改变生活方式”保留诱迫他们改弦更张的含义；“享受自己的青春吧”呈现说话者诱劝的口吻；后半句保持直接、残酷的威胁。脚注标记置于正文相关句意之后。
