  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: zh_hans
  text: 当侍卫把轮子、关节刑具、扭拉器械、钩爪、投石机[b]、大锅、煎锅、夹指器、铁手、楔子和火中的炽炭陈列在面前时，暴君随即开口说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希腊文本作“投石机”。这种器械出现在刑具清单中颇为异常；译文仍保留现存文本的通常词义，没有按推测改成另一种刑具。
    reason: alternative_reading
lexical_decisions:
- source_word: τροχούς
  choice: 轮刑具
  rationale: 基本义为“轮子”；在刑具清单中显然指用于施刑的轮具，译文用“轮刑具”既保留具体形象，也交代语境功能。
- source_word: ἀρθρενβόλους
  choice: 关节刑具
  rationale: 这是罕见的复合词，似指作用于关节或肢体的器械；不武断限定为脱臼或折肢，采用较宽泛的译法。
- source_word: στρεβλωτήριά
  choice: 扭拉刑具
  rationale: 源于表示扭曲、拷打的词根，指扭转或拉扯身体的刑具；“扭拉刑具”自然且保留动作范围。
- source_word: τροχαντῆρας
  choice: 钩爪
  rationale: 罕见技术名词，大概指钩状抓扯器械；译作“钩爪”传达其形状和用途，但以脚注说明近似性。
- source_word: καταπέλτας
  choice: 投石机
  rationale: 该词通常明确指投射器或投石机，虽在刑具清单中显得异常，仍按现存希腊文本保留，不以推测改写。
- source_word: λέβητας
  choice: 大锅
  rationale: 指大型金属锅或鼎；“大锅”是现代汉语中清楚自然的对应词。
- source_word: τήγανά
  choice: 煎锅
  rationale: 指用于加热或煎烤的平锅，“煎锅”准确而易懂。
- source_word: δακτυλήθρας
  choice: 夹指器
  rationale: 词形与手指有关，在语境中当指压夹手指的刑具；“夹指器”比特指拇指的名称更贴近希腊词的范围。
- source_word: χεῖρας σιδηρᾶς
  choice: 铁手
  rationale: 直译为“铁手”；虽可能指铁爪或抓具，保留原文鲜明而未完全确定的形象。
- source_word: σφῆνας
  choice: 楔子
  rationale: 这是该词的通常含义；原文没有进一步说明其施刑方式，因此不增译。
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: 火中通红的炭
  rationale: 指仍燃烧或通红的炭火；此译保留“火中”的略显重叠表达和鲜明视觉感。
- source_word: οἱ δορυφόροι
  choice: 侍卫
  rationale: 字面为持矛者，在王权场景中指君王身边的卫士；“侍卫”符合现代汉语叙事语体。
- source_word: ὑπολαβὼν
  choice: 接着
  rationale: 在言说公式中表示接过话头、作出回应；此处前文未给出直接引语，译作“接着说道”较自然，并保留叙事衔接。
theological_decisions:
- issue: 作者以 τύραννος 对统治者作出的贬义评价
  choice: 暴君
  alternative: 君王／统治者
  rationale: τύραννος 在此带有明确的压迫性和道德评判；译作“暴君”保留作者的修辞立场，不将其淡化为中性称谓。
translation_notes:
  register: 采用庄重而清楚的现代标准书面汉语。刑具清单以并列短语呈现，用“一一摆出来”传达 προέθεσαν 的陈列动作。冒号保留该节通向下一节直接引语的未完结构。
