base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: zh_hans
  text: 弟兄们，我们难道不该惧怕酷刑，权衡酷刑的威胁，并远避这种虚荣和带来毁灭的狂妄吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这种虚荣和带来毁灭的狂妄”也可译作“这种空洞的荣耀和毁灭性的自夸”。
    reason: 说明 κενοδοξία 与 ἀλαζονία 的词义范围，并保留“空洞的荣耀／虚荣”及“狂妄／自夸”之间的可能表达。
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: 我们难道不该惧怕
  rationale: 希腊语为带 οὐ 的将来时疑问表达，具有商议和劝说意味；“难道不该”在现代汉语中自然地保留了期待肯定回答的反问语气，而不把它改成平直陈述。
- source_word: ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是对男性兄弟的郑重呼告；“弟兄们”既保留性别和亲属关系，也符合庄重的现代汉语表达。
- source_word: τὰ βασανιστήρια
  choice: 酷刑
  rationale: 该词在此指施加于人的酷刑或酷刑惩罚；“酷刑”直接、清楚，又不擅自限定为刑具。
- source_word: λογιούμεθα
  choice: 权衡
  rationale: 此动词表示计算、考虑或认真估量；“权衡”体现把威胁纳入考量的意味，也适合本句的劝说语境。
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: 严刑的威胁
  rationale: 属格结构表示与折磨或酷刑有关的威胁。“严刑的威胁”自然凝练，并与前面的“酷刑”略作措辞区分。
- source_word: φεύξομεν
  choice: 远避
  rationale: 该动词本义为逃离、躲避；“远避”保留鲜明的主动拒绝意味，又比单说“避免”更有力度。
- source_word: τὴν κενοδοξίαν ταύτην
  choice: 这种虚荣
  rationale: κενοδοξία 指空洞的荣耀、虚荣或自负；“虚荣”是现代读者容易理解且切合语境的表达。
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: 招致灭亡的狂妄
  rationale: ὀλεθροφόρος 直指带来毁灭，ἀλαζονία 指狂妄、自夸或傲慢；此译保留因果力度，避免把“致命”误解为仅指身体死亡。
theological_decisions:
- issue: 三个并列动词构成的反问句
  choice: 保留贯穿全句、期待肯定回答的反问：“难道不该……吗？”
  alternative: 改为陈述或劝告：“我们应当惧怕……并远避……”
  rationale: 希腊语的否定疑问形式及全句结构支持反问读法。保留反问可呈现说话者的劝说力度，也不预先替读者消解这番话在叙事中的道德张力。
- issue: ἄνδρες ἀδελφοί 的性别所指
  choice: 译作“弟兄们”
  alternative: 译作不标明性别的“手足们”或一般性的“各位”
  rationale: 原文明确以男性形式称呼叙事中的兄弟；保留“弟兄”忠实反映对象，不引入泛化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“难道不该……吗”保留原文商议式反问，以“权衡”“远避”维持修辞力度；没有把疑问句改写为断言，也没有加入宗派性解释。脚注标记置于其所说明的末尾词组之后。
