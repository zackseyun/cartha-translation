  yaml_path: translation/deuterocanon/4_maccabees/008/028.yaml
  text: For they were contemptuous of sufferings[b][a], and masters of pains.
translation:
  language: zh_hans
  text: 因为他们蔑视苦难[a]，并且能驾驭疼痛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“轻看苦难”或“鄙视苦难”。希腊语措辞较强，表示俯视、蔑视苦难，而不只是忍受苦难。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作疼痛的主宰”“自主掌控疼痛”或“控制疼痛”。希腊语强调对疼痛的自主支配和掌控。
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  choice: 藐视
  rationale: 该词表达居高临下地看待、轻蔑某物的强烈意味；“藐视”比“漠不关心”更准确，也符合本节面对酷刑的语境。
- source_word: τῶν παθῶν
  choice: 所受的苦楚
  rationale: 在殉道受刑的上下文中，πάθη指临到并承受的苦难，而非内在情欲；“所受的苦楚”清楚呈现这一受苦含义。
- source_word: αὐτοκράτορες
  choice: 驾驭了
  rationale: 该词表示对某物拥有自主权或支配力；“驾驭了”自然地传达对疼痛实行控制，而不把它弱化为仅仅忍受。
- source_word: τῶν ἀλγηδόνων
  choice: 疼痛
  rationale: ἀλγηδών主要指身体上的痛感；“疼痛”直接准确，且不额外强化为“酷刑”或“剧痛”。
theological_decisions:
- issue: 殉道语境中人对身体痛苦的支配
  choice: 译文陈述他们藐视苦楚并驾驭疼痛，不进一步解释这种能力的哲学或神学机制。
  alternative: 可解释为理性战胜情欲，或近似斯多葛式的不动情。
  rationale: 希腊文在此简洁描述他们面对苦难的态度及对疼痛的掌控，并未明确展开一套哲学体系；保留这种简洁可避免导入经文未明说的思想。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“藐视”保留原文的强烈语气；“驾驭了疼痛”既自然，又呈现 αὐτοκράτορες 的支配意味。脚注标记依照所解释词语的正文顺序排列。
