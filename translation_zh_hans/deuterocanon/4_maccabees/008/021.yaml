lexical_decisions:
- source_word: γῆρας
  choice: 年老
  rationale: 该名词指“老年、年迈”。原文以这个孤立词开头，译文不擅自补足省略内容，以保留其突兀和残句性质。
- source_word: ἐνθυμηθῶμεν
  choice: 让我们想一想
  rationale: 第一人称复数劝勉虚拟式，表达共同思量或考虑；此译自然、清楚，也保留劝勉语气。
- source_word: ἀπειθοῦντες
  choice: 我们若不服从
  rationale: 形式上是现在分词“悖逆、不服从”，在此与将来结果相连，可自然理解为条件；用“若”在现代汉语中清楚表达这种关系，而不增加对象。
- source_word: τεθνηξόμεθα
  choice: 就必死
  rationale: θνῄσκω的将来时，直指死亡的后果；“必死”简洁地传达将来陈述在警告语境中的确定性。
