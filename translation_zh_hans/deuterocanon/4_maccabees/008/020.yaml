  text: Let us have mercy on our own youth[a], and let us pity our mother’s old age,
translation:
  language: zh_hans
  text: 让我们怜惜自己的青春年华，也怜悯母亲的晚年[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“母亲的那一件／那种情形”，其中中心名词在这一文本见证中没有明说。根据上下文，译文补作“晚年”；但原文也可能泛指母亲的处境或遭遇。
    reason: textual_variant
lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: 让我们怜惜
  rationale: 这是第一人称复数劝勉虚拟式，表达因怜悯而珍惜；“怜惜”既保留同情之意，也能自然地与“自己的青春年华”搭配，而不把动词强化为明确的“保全性命”。
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: 自己的青春年华
  rationale: ἡλικία可指年龄、人生阶段或青春时期。语境中的说话者是年轻弟兄，因此译作“青春年华”能传达他们各自年轻生命的可惜之处；“自己的”也对应反身代词及希腊文复数所强调的各人处境。
- source_word: κατοικτειρήσωμεν
  choice: 也怜悯
  rationale: 这是另一处第一人称复数劝勉虚拟式，表示对受苦者心生悲悯。“怜悯”简洁、庄重，并保留原文强烈的同情诉求。
- source_word: τὸ τῆς μητρὸς
  choice: 母亲的晚年
  rationale: 现存希腊文本在定冠词和“母亲的”之后省略了中心名词。结合上下文，母亲因将失去众子而面临的晚年最可能是所指；正文补出“晚年”以使汉语完整，同时用脚注保留原文的不确定性。
