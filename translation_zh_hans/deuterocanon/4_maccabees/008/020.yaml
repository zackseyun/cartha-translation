translation_notes:
  register: 采用现代、庄重而易懂的劝勉语气。“青春年华”自然传达年轻生命的意味；两个“让我们”式劝勉在汉语中合并为一个领起结构，以避免生硬重复。句末逗号依照本节作为后续话语一部分的形式保留。
