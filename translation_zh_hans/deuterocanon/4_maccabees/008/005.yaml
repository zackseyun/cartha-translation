base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: zh_hans
  text: 年轻人哪，我怀着善意，赞叹你们每一个人的俊美，也极其看重你们这许多兄弟的数目。我不但劝你们不要像那位已经受过酷刑的老人一样发同样的疯，而且还——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本本节以“而且还”结束，句子在下一节继续。
    reason: 说明原文节末保留的未完句式。
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: 年轻人哪
  rationale: 直接称呼一群男性青年；“哪”自然传达希腊语呼格的语气，同时保持庄重。
- source_word: φιλοφρόνως
  choice: 怀着善意
  rationale: 该副词表示友善、亲切或好意；此译保留说话者刻意表现出的笼络语气，不预先判定其真诚与否。
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν
  choice: 你们每一个人
  rationale: 保留原文加强的逐一、个别指向。
- source_word: θαυμάζω τὸ κάλλος
  choice: 赞叹……的俊美
  rationale: θαυμάζω兼有惊叹与欣赏之意；κάλλος在这里指外表之美。“俊美”适合男性青年，也不排除仪表之美。
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν ὑπερτιμῶν
  choice: 极其看重你们这么多兄弟齐聚在一起
  rationale: ὑπερτιμῶν表示高度看重；πλῆθος与τοσούτων突出兄弟人数众多。中文补出“齐聚在一起”，自然表达这一群体数量给说话者留下的印象，并未改变其兄弟关系。
- source_word: οὐ μόνον συμβουλεύω
  choice: 我不但劝你们
  rationale: συμβουλεύω可指劝告或进言；在此直接劝诱的语境中，“劝”简洁自然。
- source_word: μὴ μανῆναι ... μανίαν
  choice: 不要……发同样的疯
  rationale: 原文以同源的动词和名词形成讥讽性的重复；“发……疯”在现代中文中保留“疯狂”的鲜明措辞。
- source_word: τῷ προβασανισθέντι γέροντι
  choice: 那位已经受过酷刑的老人
  rationale: 被动分词表明老人先前已经遭受刑讯；“受过酷刑”清楚传达时间先后和被动意义。
- source_word: ἀλλὰ καὶ
  choice: 而且还——
  rationale: 原文在递进关联词之后于本节中断；破折号保留未完句式，并提示下节续接。
theological_decisions:
- issue: ἀδελφῶν在此处的性别与亲属含义
  choice: 兄弟
  alternative: 手足
  rationale: 上下文所指是同一母亲的男性儿子们，因此“兄弟”比性别中性的“手足”更准确。
- issue: 对老人行为的贬斥性措辞
  choice: 发同样的疯
  alternative: 陷入同样的狂乱
  rationale: 这是说话者对老人忠贞行为的讥讽评价，并非叙述者的神学判断；保留直接引语中的尖刻措辞，避免替说话者缓和立场。
- issue: 节末未完成的句子
  choice: 以破折号保留中断
  alternative: 补足为完整句
  rationale: 所给希腊文本止于ἀλλὰ καὶ，意思延续至下一节；不补入原文未说出的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。直引保留安条克王劝诱兼讥讽的语气；“年轻人哪”“俊美”“酷刑”等措辞清楚而不过度古雅。
