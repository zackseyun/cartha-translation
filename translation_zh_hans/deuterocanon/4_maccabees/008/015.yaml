  yaml_path: translation/deuterocanon/4_maccabees/008/015.yaml
  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
translation:
  language: zh_hans
  text: 他们听见这些劝诱[a]，又看见那些可怕的酷刑[b]，不但毫不畏惧，反而以哲学之理同那暴君抗辩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝诱”也可译作“劝说”“引诱”或“笼络”；原词指试图使人就范的劝说或诱使。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“可怕的事物”；按上下文，这里指摆在他们面前或施加于人的酷刑、恐怖景象。
    reason: lexical_alternative
  - marker: c
    text: 原文含有“哲学”一词，字面上是“反向地／对抗性地哲学论辩”。此译法保留本书强调以理性和哲学进行抗辩的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: 劝诱
  rationale: 该词表示试图引导、笼络或争取对方；“劝诱”兼具劝说与诱使之意，适合此处恩诱与威逼并用的语境。
- source_word: δεινά
  choice: 可怕的刑罚
  rationale: 字面义为“可怕的事物”；殉道叙事的上下文指摆在他们眼前的酷刑。译作“可怕的刑罚”既交代语境，也保留原词较宽的形容意味。
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: 不但毫不畏惧
  rationale: 保留 οὐ μόνον οὐκ 的强调结构，并以自然、庄重的现代汉语表达。
- source_word: ἀντεφιλοσόφησαν
  choice: 以哲理驳斥
  rationale: 该罕见复合动词包含“以哲学思辨作出反驳”的意思。“以哲理驳斥”保留本书反复强调的哲学与理性语言，也体现 ἀντι- 的对抗性。
- source_word: τῷ τυράννῳ
  choice: 那暴君
  rationale: 原文是“暴君”而非中性的“王”；保留作者对统治者的道德评价。
theological_decisions:
- issue: 如何翻译《马加比四书》中的 φιλοσοφ- 词族
  choice: 在正文中用“以哲理驳斥”明确保留哲学思辨色彩
  alternative: 译作“与暴君辩论”或“反驳暴君”
  rationale: 本书有意以理性和哲学的语言诠释殉道者的坚忍；若只译为一般性的辩论，会削弱原文的思想框架。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“劝诱”与“可怕的刑罚”形成恩威并施的对照；“以哲理驳斥”刻意保留原文较鲜明的哲学术语及对抗意味。
