  yaml_path: translation/deuterocanon/4_maccabees/008/003.yaml
  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: zh_hans
  text: 暴君下达这些命令后，七兄弟和他们年迈的母亲一同被带来[a]；他们相貌英俊、端庄自重、品格高尚[b]，在各方面都令人喜爱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“他们被带领着来到”；原文同时表达他们到场和被人押送的情形。
    reason: lexical_alternative
  - marker: b
    text: “品格高尚”也可译作“勇毅”或“勇敢”；原词兼有高贵、高尚和英勇之意。
    reason: lexical_alternative
  - marker: c
    text: “令人喜爱”也可译作“温文可亲”或“处处显得优雅可爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: 下达这些命令后
  rationale: 属格独立结构表示暴君的命令先于七兄弟被押到场；“下达命令”自然保留διατάσσω的权威和命令意味。
- source_word: τοῦ τυράννου
  choice: 暴君
  rationale: τύραννος在本书语境中带有明确的贬义和道德评价，不宜淡化为中性的“君王”或“统治者”。
- source_word: παρῆσαν ἀγόμενοι
  choice: 被押到面前
  rationale: παρῆσαν表示来到或到场，ἀγόμενοι表示正被人带领；结合上下文，“被押到面前”既自然，又传达非自愿、受控制地到场。
- source_word: μετὰ γεραιᾶς μητρός
  choice: 和他们年迈的母亲一同
  rationale: γεραιᾶς指年事已高；“年迈”庄重自然。亲属领属关系虽在希腊文中由语境得出，汉语需补出“他们的”以避免歧义。
- source_word: ἑπτὰ ἀδελφοί
  choice: 七兄弟
  rationale: ἀδελφοί在这里特指七名男性手足，“七兄弟”准确且符合现代汉语习惯。
- source_word: καλοί
  choice: 相貌俊美
  rationale: 在人物优点的并列描写中，καλοί最自然地指外貌美好；补出“相貌”可避免与笼统的道德评价混淆。
- source_word: αἰδήμονες
  choice: 端庄自重
  rationale: αἰδήμων兼有知羞耻、守礼和举止端正之意；“端庄自重”比单用“谦虚”更完整地表达其伦理和社会层面。
- source_word: γενναῖοι
  choice: 品格高尚
  rationale: γενναῖος可表示高贵、高尚，也可引申为勇敢；此处处于德行清单中，“品格高尚”保留较宽的道德含义，并以脚注交代“勇毅”的可能。
- source_word: ἐν παντὶ χαρίεντες
  choice: 在各方面都令人喜爱
  rationale: χαρίεις描述有风度、可亲而讨人喜欢；ἐν παντί强调各个方面。此译文避免把它仅限于礼貌或恩慈。
theological_decisions:
- issue: 作者以τύραννος评价安条克
  choice: 暴君
  alternative: 君王；统治者
  rationale: 保留原文自身带有的道德谴责，不将其改成中性的官职称谓。
- issue: γενναῖοι所表达的是高尚还是勇敢
  choice: 正文译作“品格高尚”
  alternative: 勇敢；勇毅
  rationale: 该词本身可涵盖出身高贵、品格高尚和英勇；正文依并列的品格描写采用较宽的“品格高尚”，脚注保留勇敢这一可能，不预先用后文的殉道表现限定词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以分号维持希腊文单句结构，并清楚区分到场事件与随后的人物品格清单；并列项节奏匀称，不使用古奥或宗派化措辞。
