base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/001.yaml
  text: For since in the first trial the notorious tyrant was defeated[a], being unable to compel the old man to eat defiling food,
translation:
  language: zh_hans
  text: 因为那位显赫的暴君在第一次尝试中被击败，没能强迫那位老人吃使人沾染污秽的食物，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃使人沾染污秽的食物”也可译作“吃被视为污秽的肉”或“吃禁戒的食物”。希腊文这个动词十分罕见，指吃按犹太律法被视为会使人污秽的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδὴ γὰρ
  choice: 因为
  rationale: 本句承接上文并说明缘由；现代汉语用“因为”自然表达ἐπειδή与γάρ合成的解释、因果作用，避免生硬叠译。
- source_word: κατὰ τὴν πρώτην πεῖραν
  choice: 在第一次较量中
  rationale: πεῖρα可指尝试、考验；此处描述暴君逼迫老人而未能得逞的首次交锋，“较量”兼顾尝试与双方意志对抗的语境。
- source_word: ἐνικήθη
  choice: 败下阵来
  rationale: 准确表达νικάω被动式“被击败”，同时在汉语中自然呈现暴君强迫失败的情形。
- source_word: περιφανὴς
  choice: 显然
  rationale: 该词基本含义涉及显明、众所周知；在此按谓语性用法理解为暴君的失败是明显的，避免仅凭“暴君”一词就强行赋予“臭名昭著”的贬义。
- source_word: ὁ τύραννος
  choice: 那暴君
  rationale: 保留τύραννος的负面政治与道德色彩；“那”指向上下文中已知的人物。
- source_word: μὴ δυνηθεὶς
  choice: 没能
  rationale: 以自然汉语表达否定的能力/结果，并保留其对“败下阵来”的解释作用。
- source_word: ἀναγκάσαι
  choice: 强迫
  rationale: 直接传达施压逼迫之意，符合现代汉语常用表达。
- source_word: γέροντα
  choice: 那位老人
  rationale: 虽然原文无冠词，但上下文所指是此前已出现的年老人；“那位”既明确回指，也保持庄重。
- source_word: μαιροφαγῆσαι
  choice: 吃使人污秽的食物
  rationale: 这是罕见动词，指食用被视为会带来污秽的食物；译文保留“污秽”这一重点，不把对象过度限定为肉类或只说明为禁食之物。
theological_decisions:
- issue: μαιροφαγῆσαι所指食物的性质
  choice: 吃使人污秽的食物
  alternative: 吃污秽的肉；吃禁戒的食物
  rationale: 原词强调食用所导致或涉及的污秽，背景与犹太律法下的食物规条有关；正文保留这一宗教性含义，却不超出希腊文而明确限定为肉类。
- issue: περιφανὴς与ἐνικήθη的句法关系
  choice: 将περιφανής理解为修饰失败之明显程度：“显然败下阵来”
  alternative: 将περιφανής理解为修饰暴君：“臭名昭著的暴君败下阵来”
  rationale: περιφανής在此位置可作谓语性形容词，表示其败局显明；该理解保留希腊语的句法张力，也避免把词义仅依语境固定为负面的“臭名昭著”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句末逗号保留原文未完句式，因为本节在语法与叙事上继续到下一节。
