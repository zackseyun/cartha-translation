revisions:
- from: 他说这些话时，就下令把刑具摆在他们面前，好叫自己甚至能借着恐惧，劝服他们吃玷污人的食物。[a]
  to: 他说着这些话，便下令把刑具摆在前面，好甚至借着恐惧劝服他们吃不洁净的食物。[a]
  rationale: 修订消除了“自己”带来的不自然指向，调整目的从句语序以清楚表达“甚至借着恐惧”的递进手段，并采用现代标准汉语中更惯用的“不洁净的食物”。刑具的公开陈列、劝服而非直接强迫的措辞，以及原文的目的关系均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:05:20Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了叙事分词、下令展示刑具、目的从句、借恐惧施压及劝服进食的意思。惟“好叫自己甚至能借着恐惧”中的“自己”在汉语中指向生硬，且非原文强调所在；“玷污人的食物”也容易被理解为食物主动玷污人，未能以最自然的方式表达该动词所指的食用不洁之物。
  naturalness: “他说这些话时，就下令”自然；但“好叫自己甚至能借着恐惧”不够流畅。改为“好甚至借着恐惧劝服他们”可保留καὶ的递进/加强意味，并使目的关系清楚。
  terminology: “刑具”“劝服”均恰当。将“吃玷污人的食物”改为“吃不洁净的食物”是现代汉语中对犹太律法语境下不洁食物更自然、明确的表达；脚注说明该希腊动词的玷污含义，并保留替代译法，以免过度限定。
  issues:
  - severity: medium
    issue: “好叫自己甚至能借着恐惧”语义指向和语序不自然。
    rationale: ὅπως引出的是他下令展示刑具的目的，πείσειεν的主语虽为“他”，汉语不必补出“自己”。“自己”造成不必要的反身色彩；“甚至”应直接修饰“借着恐惧”的手段。
  - severity: low
    issue: “玷污人的食物”不如“不洁净的食物”自然、明确。
    rationale: μιεροφαγῆσαι指食用不洁、受玷污之物。在现代汉语的本段犹太律法语境中，“不洁净的食物”更惯用；有关玷污及礼仪不洁的语义可在脚注保留。
