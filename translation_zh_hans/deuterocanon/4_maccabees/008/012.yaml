base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/012.yaml
  text: And as he said these things[a], he ordered the instruments of torture to be brought forward, so that even through fear he might persuade them to eat defiled food.
translation:
  language: zh_hans
  text: 他说着这些话，便下令把刑具摆在前面，好甚至借着恐惧劝服他们吃不洁净的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吃污秽的食物”。希腊语动词指吃会使人受到玷污、或在礼仪上成为不洁净的食物。
    reason: 说明μιεροφαγῆσαι所含的玷污与礼仪不洁语义，并保留自然的替代译法。
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: 他说这些话时
  rationale: 以自然的现代汉语表达分词结构与主句动作之间的同时关系；δὲ在此承接叙事，不必机械译出。
- source_word: ἐκέλευσεν
  choice: 就下令
  rationale: 准确表达发布命令的强制语气，并用“就”自然衔接同时发生的动作。
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: 摆在他们面前
  rationale: 表达使某物被放到前方、公开展示的意思；“他们”由上下文补明观看刑具的人。
- source_word: τὰ βασανιστήρια
  choice: 刑具
  rationale: 该复数名词在这里指施行酷刑的器具；“刑具”简洁、准确而符合现代汉语。
- source_word: ὅπως
  choice: 好叫
  rationale: 清楚引出目的从句。
- source_word: καὶ διὰ τοῦ φόβου
  choice: 甚至能借着恐惧
  rationale: 将καὶ理解为递进，表明在其他劝诱方式之外，统治者甚至企图利用恐惧；“借着恐惧”保留手段意义。
- source_word: πείσειεν
  choice: 劝服
  rationale: 保留πείθω的劝说、说服含义；虽有胁迫背景，仍不将其直接强化为“强迫”。
- source_word: μιεροφαγῆσαι
  choice: 吃玷污人的食物
  rationale: 该复合动词指吃会带来玷污、尤其违背犹太律法洁净要求的食物；此译法在现代汉语中清楚表达食物造成玷污的含义。
theological_decisions:
- issue: 犹太殉道背景中μιεροφαγῆσαι的译法
  choice: 吃玷污人的食物
  alternative: 吃不洁净的食物；吃污秽的食物
  rationale: “玷污人的食物”保留宗教与道德层面的污染含义，也避免把原文限定为某一套后来的专门礼仪术语；脚注同时保留“不洁净”的可能译法。
- issue: 恐吓情境中πείσειεν的力度
  choice: 劝服
  alternative: 迫使
  rationale: 上下文显然包含威吓和胁迫，但希腊语动词本身通常是“说服、劝服”；不以“迫使”消除原文在劝说与强制情境之间的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“刑具”简明有力；“劝服”刻意保留原文措辞与胁迫语境之间的张力。脚注标记置于其所解释的短语之后。
