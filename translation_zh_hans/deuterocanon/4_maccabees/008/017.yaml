  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: zh_hans
  text: 我们真是可怜，愚昧至极！王劝我们，又以恩惠相许来呼唤我们，我们岂不该接受他的劝说[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们岂不该顺从他吗？”希腊语πεισθείημεν主要指“被说服”或“接受劝说”，也可进一步含有“听从、顺从”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: 我们真可怜
  rationale: Ὦ引出感叹，τάλανες表达可怜、悲惨的自叹；译为“我们真可怜”保留强烈的感叹语气，又符合现代汉语表达。
- source_word: καὶ λίαν ἀνόητοι
  choice: 实在愚昧至极
  rationale: λίαν是强烈程度副词，ἀνόητοι指不明智、愚昧；“实在……至极”传达原文加强的自责语气。
- source_word: βασιλέως
  choice: 王
  rationale: 上下文所指为特定的王；现代汉语叙事中直接用“王”自然且明确。
- source_word: παρακαλοῦντος
  choice: 劝我们
  rationale: παρακαλέω在此指劝说、敦促；“劝”既自然，也与后文πεισθείημεν形成词义呼应。
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: 召我们去领受恩惠
  rationale: φωνέω表示召唤，ἐπὶ εὐεργεσίᾳ说明召唤与施惠有关；此译自然表达王以给予好处为条件或目的召唤他们，同时不把恩惠的具体内容说死。
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: 我们岂不该听从他的劝说吗？
  rationale: πεισθῆναι可表示被说服，并可延伸为听从、顺从。此处用“听从他的劝说”兼顾说服过程与实际服从，保留两层含义。
