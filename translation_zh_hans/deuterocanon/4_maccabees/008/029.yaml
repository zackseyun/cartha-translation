base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/029.yaml
  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
translation:
  language: zh_hans
  text: 于是，暴君一停止劝他们吃使人沾染污秽的食物[a]，他们就一同异口同声，仿佛出于同一个灵魂，说道[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吃不洁的食物”或“吃受污染的食物”。原文所用的词指食用会使人在宗教或礼仪上沾染污秽的东西。
    reason: lexical_alternative
  - marker: b
    text: 直译“仿佛出于同一个灵魂”，形容他们内心的决意完全一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 于是
  rationale: 承接上文并引出随即发生的结果，符合现代汉语叙事表达。
- source_word: ἅμα τῷ παύσασθαι
  choice: 一停止……就
  rationale: 表达该结构所强调的同时性和紧接发生的动作，比直译为“在停止的同时”更自然。
- source_word: τὸν τύραννον
  choice: 暴君
  rationale: 保留本书中该称谓鲜明的贬义和道德政治色彩，不弱化为中性的“君王”或“统治者”。
- source_word: συμβουλεύοντα αὐτοῖς
  choice: 劝他们
  rationale: 既保留“劝说、进言”的词义，也适合暴君施压的上下文；不额外把强迫含义写入动词本身。
- source_word: μιεροφαγῆσαι
  choice: 吃使人沾染污秽的食物
  rationale: 该罕见复合词指食用会造成宗教或礼仪污秽之物；此译明确表达结果，同时不把食物种类具体化。
- source_word: πάντες διὰ μιᾶς φωνῆς ὁμοῦ
  choice: 他们就一同异口同声
  rationale: 综合表达“所有人、一起、借着一个声音”的群体一致性，汉语自然且保留原文的强调。
- source_word: ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  choice: 仿佛出于同一个灵魂
  rationale: 保留原文鲜明的灵魂意象及其所表现的内在意志完全一致，不简化为仅属认知层面的“同一个心思”。
- source_word: εἶπον
  choice: 说道
  rationale: 自然引出下一节的直接引语，句末用冒号提示下文。
theological_decisions:
- issue: μιεροφαγῆσαι 的礼仪污秽含义
  choice: 吃使人沾染污秽的食物
  alternative: 吃不洁的食物；吃受污染的食物
  rationale: 译文保留食用该物会导致宗教或礼仪污秽的含义，又避免将其等同于某一后来的技术性分类。
- issue: ψυχή 的人论意象
  choice: 灵魂
  alternative: 心；心思
  rationale: “灵魂”保留原文 ψυχή 的修辞和人论分量，突出他们内在生命与意志的一致，而不把含义缩减为思想相同。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一停止……就”清楚呈现动作紧接发生；“一同异口同声”保留原文多重强调而不显生硬。“灵魂”刻意保留原文意象。
