  yaml_path: translation/deuterocanon/4_maccabees/008/022.yaml
  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
translation:
  language: zh_hans
  text: 而且，神的公义也会宽恕我们，因为我们是在不得已的情况下惧怕国王的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“审判”或“刑罚”。希腊语δίκη可有这些含义。
    reason: 保留δίκη在公义、审判与刑罚之间的词义幅度。
lexical_decisions:
- source_word: συγγνώσεται
  choice: 会宽恕
  rationale: 该词在这里表示考虑具体情势而予以饶恕或宽宥；“宽恕”既符合其伦理、司法语境，也比“原谅”更庄重。
- source_word: ἡ θεία δίκη
  choice: 神的公义
  rationale: δίκη可指公义、审判或刑罚；本句将其拟人化为能够宽恕人的主体。“神的公义”在现代汉语中自然，并保留公义在强迫情势下施行宽宥的张力。
- source_word: διʼ ἀνάγκην
  choice: 因迫不得已
  rationale: 该短语说明惧怕国王是在强迫或不得已的情况下发生；“因迫不得已”自然地表达原因和外在压力。
- source_word: τὸν βασιλέα
  choice: 国王
  rationale: βασιλεύς在此直接指国王，无须泛化为统治者。
- source_word: φοβηθεῖσιν
  choice: 惧怕
  rationale: 该不定过去时被动形式的分词在此描述“我们”因压力而对国王产生惧怕；汉语用“惧怕”可简洁表达这一情形，不强行增添原文没有明示的条件词。
theological_decisions:
- issue: δίκη应译为较广义的“公义”，还是较具惩罚意味的“审判／刑罚”
  choice: 神的公义
  alternative: 神的审判；神所施的刑罚
  rationale: 本句谈到人在被迫之下行事而可获宽恕，采用“公义”能保留神圣司法秩序也会衡量情势的张力，同时不把δίκη限缩为惩罚。
- issue: 是否把分词结构明确译成条件句
  choice: 以“我们因迫不得已而惧怕国王”保留原因、情势关系
  alternative: 如果我们在强迫之下惧怕国王
  rationale: 希腊文没有明示条件连词；与格分词可表达伴随情势或宽恕所针对的行为，因此正文避免擅自锁定为条件句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“况且”承接δὲ与καὶ的推进语气；语序按汉语习惯调整，但保留原文关于被迫、惧怕国王以及神圣公义宽恕之间的关系。
