  yaml_path: translation/deuterocanon/4_maccabees/008/027.yaml
  text: But the young men[a], who were about to be tortured, said none of these things, nor did they even think them.
translation:
  language: zh_hans
  text: 但那些即将遭受酷刑的青年，一句这样的话也没有说；他们甚至连在心里想过都没有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们也没有在心里考虑过这些事。”希腊语动词可指在心里思想或考虑。
    reason: 说明ἐνθυμέομαι可表示内心思量或考虑，并保留其较具体的词义可能。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成鲜明转折，保留原文的强烈反义连接作用。
- source_word: τούτων οὐδὲν
  choice: 这些话一句也没有
  rationale: τούτων回指上文所说的言辞或念头；结合εἶπον译作“这些话一句也没有说”，既明确回指，也符合现代汉语习惯。
- source_word: οἱ νεανίαι
  choice: 那些青年
  rationale: 指这些年轻男子；“青年”简洁、庄重，也不额外添加亲属关系等原文此处未明说的信息。
- source_word: βασανίζεσθαι μέλλοντες
  choice: 即将受刑
  rationale: μέλλοντες表示动作迫近；在本段司法性肉体折磨的语境中，“受刑”自然地表达即将遭受酷刑，且避免过度扩写。
- source_word: εἶπον
  choice: 说
  rationale: 采用直接、自然的叙事用语，对应简单过去时的言说动作。
- source_word: οὐδὲ ἐνεθυμήθησαν
  choice: 甚至连想都没有想过
  rationale: 保留οὐδὲ的递进强调；ἐνθυμέομαι可指在心里思想、考虑，此译文自然表达他们不仅没有说出口，心里也未曾起过这些念头。
theological_decisions:
- issue: βασανίζεσθαι在殉道叙事中的强度
  choice: 受刑
  alternative: 遭受酷刑；受折磨；受考验
  rationale: 上下文涉及对青年施加的司法性肉体虐待。“受刑”足以传达刑罚和折磨的现实，又不把原文扩展成更具体的行刑方式；脚注无需为此增加神学解释。
- issue: ἐνθυμέομαι所表达的内心活动
  choice: 甚至连想都没有想过
  alternative: 也没有在心里考虑过这些事
  rationale: 原文可指思想或在内心考虑。正文保留简洁而有力的递进关系，脚注说明较偏向“内心考虑”的可能译法，不将其限定为某种特定心理或神学状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这些话一句也没有说”与“甚至连想都没有想过”构成清楚的递进和平行关系。脚注标记置于其实际说明的动词短语之后。
