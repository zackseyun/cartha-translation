base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/014.yaml
  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: zh_hans
  text: 他们把那些东西摆在面前。暴君接过话说：“年轻人，你们要害怕；你们所敬重的公义[a]，在你们因受强迫而违犯律法时，会宽待你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“审判”或“惩罚”。希腊语 δίκη 可有这些含义。
    reason: 保留 δίκη 的词义歧义，不将暴君话语中所诉诸的道德、审判或惩罚概念限定为单一含义。
lexical_decisions:
- source_word: προέθεσαν
  choice: 他们把那些东西摆在面前
  rationale: 保留原文中承接上文的复数主语和省略的宾语；“那些东西”指上文所述之物，不擅自补明具体对象。
- source_word: ὑπολαβών
  choice: 接过话
  rationale: 该词在叙事对话中可表示接着或插入前人的话；“接过话”自然，并且不像“打断”那样过度限定说话方式。
- source_word: τύραννος
  choice: 暴君
  rationale: 保留该称谓所含的负面道德评价，不弱化为中性的“君王”或“统治者”。
- source_word: Μειράκια
  choice: 年轻人
  rationale: 符合对这些年轻弟兄的称呼，既自然，也避免“孩子们”显得过于年幼。
- source_word: φοβήθητε
  choice: 你们要害怕
  rationale: 直接表达命令语气，并保留暴君恐吓、劝诱的口吻。
- source_word: δίκην
  choice: 公义
  rationale: 与“敬重”搭配时，较可能指他们所尊崇的正义或公正秩序；但原词也可指审判或惩罚，故加注保留歧义。
- source_word: σέβεσθε
  choice: 敬重
  rationale: 表达宗教和道德层面的尊崇，又不把原词强化为正式的“敬拜”。
- source_word: ἵλεως
  choice: 宽待
  rationale: 表示 favorable/propitious，即不会严加追究；在此语境中比抽象的“有恩慈”更自然。
- source_word: διʼ ἀνάγκην
  choice: 迫于强制
  rationale: 清楚表达外在强迫构成暴君所谓的减责理由。
- source_word: παρανομήσασιν
  choice: 违犯律法
  rationale: 保留 παρανομέω 的法律与道德含义，也符合本书围绕律法忠诚的语境。
theological_decisions:
- issue: δίκη在暴君道德劝诱中的含义
  choice: 正文译作“公义”
  alternative: 审判；惩罚
  rationale: ἣν σέβεσθε 表明这是青年人所尊崇的对象，因此“公义”最能呈现暴君的论点：他们所承认的公正秩序会因其受迫而宽待他们。不过，δίκη本身可指审判或惩罚，正文不应彻底消除这种张力，故在脚注中说明。
- issue: 受迫违法与宽待之间的逻辑关系
  choice: 译作“即使你们迫于强制而违犯律法……也会宽待你们”
  alternative: 如果你们在强迫之下违犯律法……就会宽待你们
  rationale: 希腊文使用分词描述这些人因强迫而违法，并未明用条件连词；“即使……也……”自然传达暴君所声称的减责关系，同时不把这句话提升为经文作者认可的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接过话”保持叙事流畅；“暴君”保留原文评价色彩。正文补入原文开头 προέθεσαν 所表达、而英语咨询文本遗漏的动作，但不擅自明确其省略宾语。
