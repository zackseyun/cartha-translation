  yaml_path: translation/deuterocanon/4_maccabees/008/007.yaml
  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: zh_hans
  text: 所以，听从吧[a]；你们若弃绝祖传的生活制度，就会在我的政务中获得掌权的官职。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”原文也可译作“相信”或“信任”。
    reason: πιστεύσατε本身含“相信、信任”之义；在此语境中则带有接受君王要求、听从其提议的语用色彩。
lexical_decisions:
- source_word: πιστεύσατε
  choice: 依从吧
  rationale: 该词本义为“相信、信任”，此处是君王劝诱受刑者接受其要求；结合语境译为“依从”较自然，同时以脚注保留原词“相信、信任”的含义。
- source_word: ἀρχὰς ... ἡγεμονικὰς
  choice: 掌权的职位
  rationale: ἀρχή可指官职或统治权，ἡγεμονικός强调领导、管辖性质；译文兼顾职位及其掌权属性。
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: 在我的政务中
  rationale: πράγματα在君王许诺官职的语境中指其事务，尤其是国政事务；“政务”比宽泛的“事情”更符合上下文。
- source_word: τὸν πάτριον ὑμῶν τῆς πολιτείας θεσμόν
  choice: 你们祖传的生活制度
  rationale: θεσμός指既定的法规、制度或规条，πολιτεία可涵盖生活方式、群体秩序与公民生活；“生活制度”保留其制度性，也不把含义缩窄为单一宗教律例。
theological_decisions:
- issue: 是否把祖传制度明确译成“犹太律法”
  choice: 保留为“祖传的生活制度”
  alternative: 祖传的律法／犹太律法
  rationale: 希腊文本没有直接使用“律法”或“犹太”一词；较宽的译法保留其对传统生活秩序、宗教规条和群体身份的综合指涉，避免加入文本未明说的限定。
translation_notes:
  register: 采用庄重而自然的现代普通话。“弃绝”体现ἀρνησάμενοι的强烈否认、背弃意味；“只要……就……”自然表达分词所承载的条件关系。
