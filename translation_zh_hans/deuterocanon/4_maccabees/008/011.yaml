base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/011.yaml
  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: zh_hans
  text: 我也怜惜你们俊美的容貌。难道你们不想想吗？你们若不服从，除了在酷刑中死去，便没有别的结局[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为：“除了伴着酷刑死去，什么也没有为你们存留。”
    reason: 说明原文 ἀπόκειται 与 μετὰ στρεβλῶν 的较直译表达，并保留“伴着酷刑”的结构。
lexical_decisions:
- source_word: εὐμορφίας
  choice: 俊美的容貌
  rationale: 该词指外表俊美、相貌出众；结合说话者对众弟兄外貌的劝诱，用“俊美的容貌”自然明确，也保留身体外貌这一重点。
- source_word: οἰκτείρομαι
  choice: 我也怜惜
  rationale: 表达因对方将遭苦难而生的怜悯；“怜惜”既简洁，又能保留说话者貌似同情、实则威吓的语气。
- source_word: διαλογιεῖσθε
  choice: 难道你们不想想吗
  rationale: 此处是反问，要求听者权衡后果；“想想”符合现代汉语口吻，同时传达思量、考虑之意。
- source_word: ἀπειθήσασιν
  choice: 你们若不服从
  rationale: 分词在句中可按条件关系理解。希腊文没有明说不服从谁，因此不补入“我”。
- source_word: ἀπόκειται
  choice: 便没有别的结局
  rationale: 该动词有“存留、摆在前面、等待”之意；结合 οὐδὲν…πλὴν 的结构，以“没有别的结局”自然表达唯一等待他们的结果。
- source_word: στρεβλῶν
  choice: 酷刑
  rationale: 复数名词指带有扭绞性质的刑罚或折磨；“酷刑”在现代汉语中清楚自然，不把含义过度限定为某一种刑具。
- source_word: ἀποθανεῖν
  choice: 死去
  rationale: 直接对应“死”，不额外解释为被处死；施刑致死的背景已由“酷刑”表明。
