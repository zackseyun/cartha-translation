  naturalness: 修订后的“于是，他情绪极为激动，就下令再带一些与他们同龄的希伯来人来”自然、庄重，并保留原文对具体情绪未作限定的特点。“若他们提出异议”比孤立的“反对”更清楚地表达言语上的抗拒。
  terminology: “希伯来人”“释放”“折磨”均恰当。“猪肉”准确表达此处 μηροφαγοῖεν 的语境义；脚注可交代其构词所涉“腿/大腿”，但不应将正文限定为“猪腿肉”。
