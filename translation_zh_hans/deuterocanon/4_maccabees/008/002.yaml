  yaml_path: translation/deuterocanon/4_maccabees/008/002.yaml
  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: zh_hans
  text: 于是，他情绪极为激动，就下令再带一些与他们同龄的希伯来人来[a]；如果他们肯吃猪肉[b]，就释放这些被带来的人[d]；若他们提出异议，就更严厉地[c]折磨他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从同一年龄层的希伯来人中另带一些人来”。希腊文明确提到年龄。
    reason: lexical_alternative
  - marker: b
    text: 该词在本段语境中指“吃猪肉”。其构词与“腿（大腿）”有关，但并不把所吃的部位限定为猪腿肉。
    reason: lexical_clarification
  - marker: c
    text: 原文直译为“更加苦涩地”；在施加酷刑的语境中，意为“更严厉地”或“更残酷地”。
    reason: lexical_alternative
  - marker: d
    text: 传世希腊文本此处为主动分词，字面可指“带领（他们）的人”，句法上与上下文不甚协调。译文依前面的“带来”及后文的条件结果，按“被带来的人”理解。
    reason: textual_clarification
lexical_decisions:
- source_word: σφόδρα περιπαθὼς
  choice: 情绪极为激动
  rationale: σφόδρα加强分词περιπαθών，表示情感受到强烈激荡；译文保留强度，却不把具体情绪限定为愤怒或悲痛。
- source_word: ἐκέλευσεν
  choice: 下令
  rationale: 符合君王发出强制性命令的语境，现代汉语自然而有力度。
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: 从同龄的希伯来人中另带一些人来
  rationale: 保留ἄλλους的“另一些”和ἡλικία所含的年龄层意思；结合上下文，理解为与先前受审者同一年龄群体的人。
- source_word: ἀγαγεῖν
  choice: 带……来
  rationale: 这是依附于“下令”的不定式，在审讯场景中指把人带到统治者面前。
- source_word: μηροφαγοῖεν
  choice: 吃猪腿肉
  rationale: 复合词字面涉及“吃腿肉”；本段饮食强迫的语境明确指猪肉，故正文以“猪腿肉”兼顾词形和语境，并以脚注说明。
- source_word: ἀπολύειν
  choice: 释放
  rationale: 在被拘押并受胁迫的情境中，表示放走、使其自由。
- source_word: ἀγώντας
  choice: 带来的人
  rationale: 传世希腊文形式在句法上颇为棘手；依照前面的ἀγαγεῖν及两个条件所描述的受审者结局，正文按被带来的人理解，同时在脚注保留问题。
- source_word: ἀντιλέγοιεν
  choice: 反对
  rationale: 该动词本义是出言反驳、提出异议；“反对”保留言语抵抗的色彩，而不只笼统译为“拒绝”。
- source_word: πικρότερον
  choice: 更加严酷
  rationale: 比较级副词字面为“更加苦涩地”，用于折磨时表达程度加重、手段更严酷。
- source_word: βασανίζειν
  choice: 折磨
  rationale: 殉道叙事中指施加肉体酷刑；“折磨”准确、自然，也与程度副词搭配顺畅。
theological_decisions:
- issue: περιπαθὼς所指的具体情绪
  choice: 译作“情绪极为激动”，不限定为某一种情绪
  alternative: 大为愤怒；极其悲恼
  rationale: 希腊文强调强烈的情感波动，却未明确只指愤怒或悲痛；正文避免替原文确定动机。
- issue: μηροφαγοῖεν中的肉类所指
  choice: 依据饮食强迫的叙事语境译作“吃猪腿肉”
  alternative: 吃腿肉；吃猪肉
  rationale: 词形本身突出“腿肉”，而上下文所争议的是猪肉；译文兼顾两者，不把它泛化为普通肉食。
translation_notes:
  register: 采用庄重而现代的叙事语体。“情绪极为激动”保留原文情绪类别的开放性；“更加严酷地折磨”在现代汉语中清楚有力。正文中的脚注标记按出现顺序设置；关于ἀγώντας的句法说明未置入正文，以免引入无对应标记的脚注，因此出版时应删除脚注d，或在“带来的人”后补[d]。
