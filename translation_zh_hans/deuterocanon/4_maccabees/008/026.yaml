base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: zh_hans
  text: 我们里面怎会深植着如此强烈的争竞之心[a]？既然若因惧怕那些与死亡相关的酷刑而听从王命，就能安宁地生活，这种致命的坚忍为什么竟会令我们喜悦呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的现存希腊文本句法艰涩，尤其“死亡／杀死”一词与“惧怕酷刑”之间的关系不够明确。正文按上下文整体理解为：若他们因惧怕与死亡相关的酷刑而顺从王命，本可安宁度日。
    reason: textual_variant
lexical_decisions:
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: 惧怕那些致人于死的酷刑
  rationale: 原文开头句法艰涩；译文保留“因惧怕酷刑而退让”的基本意思，并用“致人于死”表达其中指向死亡的力量，不强行确定更具体的句法重构。
- source_word: πόθεν
  choice: 究竟从何而来
  rationale: 既保留“从哪里来”的来源意象，也在反问中自然表达对原因的追问。
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: 我们里面如此强烈的争竞之心
  rationale: φιλονεικία带有好争、争竞的贬义；“争竞之心”保留说话者敌意的刻画。ἐντέτηκεν所含的内在渗入或根植之意，以“我们里面”体现，同时避免生硬直译。
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: 这种致命的坚忍
  rationale: καρτερία是忍耐、坚忍；θανατηφόρος可指致死或带来死亡。“致命的坚忍”保留其双重张力，不把它径直美化为殉道勇气。
- source_word: ἀρέσκει
  choice: 令我们喜悦
  rationale: 表达该坚忍对说话者一方具有吸引力或使其满意，并保留反问中的讥讽意味。
- source_word: παρὸν
  choice: 既然……就可以
  rationale: 表达摆在面前的现实可能性，并使汉语中的反事实劝降逻辑清楚自然。
- source_word: μετὰ ἀταραξίας ζῆν
  choice: 安安稳稳地活着
  rationale: ἀταραξία指不受搅扰、平静安稳；此译自然易懂，也保留王所许诺的免受纷扰之生活。
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: 听从王命
  rationale: πεισθέντας既可指被说服，也可指顺从；与王搭配时，实际含义是服从其命令。“听从王命”简洁而不额外引入政治或神学判断。
theological_decisions:
- issue: 王对弟兄们坚守信仰的负面描述
  choice: 采用“争竞之心”“致命的坚忍”等带有敌意的措辞
  alternative: 译作“热心”“勇气”或“至死忠贞”
  rationale: 此处是王试图劝降并贬低他们的坚持。译文应保留人物话语与全书对殉道者总体评价之间的张力，不把叙述者的肯定预先放进王的口中。
- issue: “致命”所指的精确关系
  choice: 保留可指带来死亡或走向死亡的开放性
  alternative: 明确译成“使别人死亡”或“忍耐直到死亡”
  rationale: θανατηφόρος本身具有“带来死亡”的宽泛意义，而上下文指向殉道者因坚忍而面临死亡；不宜用过度明确的译法消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两个相连的反问呈现王的劝降语气；“安安稳稳”略具口语自然感，但仍适合人物直接引语。脚注说明源文本句法困难，不在正文中强行解决所有歧义。
