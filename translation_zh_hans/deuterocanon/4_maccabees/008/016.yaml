base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: zh_hans
  text: 他们凭着可称颂的品格[a]，推翻了他的暴政。然而，让我们想一想：假如他们中间有人胆怯懦弱、没有男子气概[b]，他们会说出怎样的话呢？不就是下面这些话吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可称颂的品格”所译的希腊词十分罕见，也可理解为“高尚”“可称颂的特质”或“蒙福的状态”；这里似乎指一种值得赞许的品质，而不是口头上的祝福。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译为“没有男子气概”，是本书德性论述中的性别化说法；也可译作“没有勇气”或“怯懦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: 凭着可称颂的品格
  rationale: εὐλογιστία罕见，语义可能涉及可称颂、优美或高尚的特质。译作“可称颂的品格”保留其褒义和抽象性质，不擅自加入原文没有的“勇气”，也避免误解为口头祝福。
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: 推翻了他的暴政
  rationale: καταλύω在此指使压迫性的统治垮台；“推翻”简洁有力，符合现代汉语表达。
- source_word: καίτοι λογισώμεθα
  choice: 然而，让我们想一想
  rationale: 保留καίτοι的转折和λογισώμεθα劝勉式虚拟语气，并自然引出反事实设想。
- source_word: δειλόψυχοί
  choice: 胆怯懦弱
  rationale: 该复合词表示内心怯弱、缺乏勇气；“胆怯懦弱”在现代汉语中自然，并保留其心理和道德色彩。
- source_word: ἄνανδροι
  choice: 没有男子气概
  rationale: ἄνανδρος带有明确的男性化德性修辞，字面指不像男子或缺乏男子气概。正文保留其性别色彩，而脚注说明可作较中性的理解。
- source_word: ποίοις ἂν ἐχρήσαντο λόγοις
  choice: 他们会说些什么呢
  rationale: χράομαι与λόγοις合用表示会采用怎样的话语；汉语用“会说些什么”自然表达反事实语气。
- source_word: οὐχὶ τούτοις;
  choice: 不就是下面这些话吗？
  rationale: τούτοις前指性地引出后文即将列出的言辞；“下面这些话”明确保留这一承接作用。
theological_decisions:
- issue: ἄνανδροι中的性别化德性语言
  choice: 没有男子气概
  alternative: 没有勇气；怯懦
  rationale: 作者的论述以当时男性化的勇敢观念制造荣辱对比。正文不将这种历史性的性别修辞悄然中性化，同时以脚注提供不带性别色彩的语义选择。
- issue: εὐλογιστία所指的褒扬性品质
  choice: 可称颂的品格
  alternative: 福分；高尚；可称颂的勇气
  rationale: 该罕见词的确切侧重点不确定。译文保留其抽象、褒扬性的性质，不把它限定为“勇气”，也不把它处理为言语上的祝福。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“可称颂的品格”保存罕见词εὐλογιστία的歧义，以“没有男子气概”保留原文的性别化修辞；两个脚注标记均已置于正文相应位置。
