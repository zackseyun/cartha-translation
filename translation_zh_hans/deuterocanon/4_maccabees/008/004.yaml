  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
translation:
  language: zh_hans
  text: 暴君看见他们仿佛在歌舞圆阵中那样，环绕着居于中央的母亲，便为他们所震动；他因他们端庄的仪表和高贵的出身而惊异，就向他们微微一笑，叫他们到近前，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ἰδὼν
  choice: 看见他们
  rationale: 以时间关系自然衔接叙事，准确表达不定过去时分词。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: 保留作者对这位迫害者的贬义评价，而不弱化为中性的“君王”或“统治者”。
- source_word: καθάπερ ἐν χορῷ
  choice: 仿佛组成歌舞队列
  rationale: χoρός可指合唱或集体歌舞的队列；此译保留协调排列的形象，又适合现代汉语。
- source_word: περιέχοντας μέσην τὴν μητέρα
  choice: 围着母亲，把她置于中央
  rationale: 清楚呈现众子环绕、母亲位居中央的空间图景。
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  choice: 心里便受到触动
  rationale: 表达他们给暴君造成了内在感受或强烈印象，同时不把原文含混的反应限定为赞赏、怜悯或单纯注意。
- source_word: τῆς εὐπρεπείας
  choice: 端庄的仪表
  rationale: 兼顾外貌、仪态与得体庄重之意，比单译为“美貌”更全面。
- source_word: τῆς εὐγενίας
  choice: 高贵的出身
  rationale: 在此按常见的门第、血统意义理解，同时避免误译为纯粹的高尚品格。
- source_word: ἐκπλαγεὶς
  choice: 惊叹
  rationale: 体现强烈的惊异，也与其仪表和出身所引起的反应自然搭配。
- source_word: προσεμειδίασεν αὐτοῖς
  choice: 向他们微微一笑
  rationale: 准确表达朝向他们发笑的动作，并保留原动词所带的轻微微笑语感。
- source_word: πλησίον καλέσας
  choice: 把他们叫到近前
  rationale: 自然表达召他们靠近自己，为接下来的话作准备。
- source_word: ἔφη
  choice: 说
  rationale: 采用简洁、常规的叙事引语动词；句末冒号提示下文接续其话语。
