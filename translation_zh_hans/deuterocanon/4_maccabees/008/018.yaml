  text: Why do we delight ourselves in empty schemes and dare a death-bringing disobedience?[a][b]
translation:
  language: zh_hans
  text: 我们为什么因空洞的打算而自得其乐，又竟敢作出招致死亡的不顺从之举呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空洞的打算”也可译作“徒劳的谋划”或“虚妄的意图”。
    reason: lexical_alternative
  - marker: b
    text: “招致死亡的不顺从之举”直译为“带来死亡的不顺从”；也可译作“致命的不顺从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: 为什么
  rationale: 在这一反问句中引出带责问意味的“为什么”，符合上下文的劝诫语气。
- source_word: βουλήμασιν κενοῖς
  choice: 空洞的打算
  rationale: βουλήμασιν 指打算、谋划或意图；κενοῖς 表明其空无实质、徒劳无益。“空洞的打算”既保留意象，也符合现代汉语。
- source_word: ἑαυτοὺς εὐφραινόμεν
  choice: 自娱
  rationale: 保留“使自己欢喜”的反身含义，并传达因徒劳打算而自得其乐的反讽。
- source_word: θανατηφόρον
  choice: 招致死亡的
  rationale: 直译其“带来死亡”的构词意义，比单说“致命的”更清楚地保留结果指向。
- source_word: ἀπειθίαν
  choice: 悖逆
  rationale: 表达拒不顺从的意思及本句庄重的道德语气，但不把词义强化为更具体的公开叛乱。
- source_word: τολμῶμεν
  choice: 竟敢作出
  rationale: “竟敢”体现鲁莽冒犯的语气；补入“作出”使其与汉语名词“悖逆”自然搭配。
theological_decisions:
- issue: ἀπειθία 的道德性质
  choice: 悖逆
  alternative: 不顺从；抗命
  rationale: 原词强调拒绝服从，并未明确要求译成政治性的“反叛”或信仰术语“不信”。“悖逆”保留严肃警告，同时不额外限定所违逆的具体对象。
- issue: θανατηφόρον 与死亡的关系
  choice: 招致死亡的
  alternative: 致命的
  rationale: 保留原文复合词所表达的“带来死亡”这一结果关系，不判断死亡是自然后果、刑罚还是其他机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。反问结构保留原文责问和劝诫的力度；“自娱”简洁呈现反身动作及其中的反讽。所有脚注标记均置于正文。
