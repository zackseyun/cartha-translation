  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: zh_hans
  text: 我劝你们顺从我，便可得享我的友谊[a]；因为我既有能力惩罚那些不服从我命令的人，也有能力厚待那些乐于听从我的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顺从我”也可译作“赞同我”或“向我让步”。这里的希腊语分词含义略有疑难，但显然是在要求听者依从说话者。这里的“友谊”在君王与臣属的语境中，也可含有“恩宠”或“眷顾”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: 我劝
  rationale: 在君王施压劝服的语境中，此词表达郑重而有力度的劝告；“劝”在现代汉语中自然，也不把语气强化为直接命令。
- source_word: συνείξαντάς μοι
  choice: 你们顺从我
  rationale: 该分词结构略有疑难，可含赞同、让步或顺从之意；上下文要求听者依从说话者，因此正文采用自然且涵盖面较广的“顺从我”，并以脚注保留其他可能。
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: 享有我的友谊
  rationale: ἀπολαύω表示享有或从中受益，φιλία本义为友谊，在君王语境中兼有恩宠、眷顾的政治意味；“享有我的友谊”保留个人关系色彩，脚注说明其君王恩宠的含义。
- source_word: δύναμιν
  choice: 有能力
  rationale: 这里指说话者凭其地位所拥有的实际力量；“有能力”可同时涵盖施罚与施惠的能力，不额外限定为纯法律权柄。
- source_word: κολάζειν
  choice: 惩罚
  rationale: 语境是君王对抗命者采取惩处，“惩罚”准确、明确，符合现代汉语。
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: 那些不服从我命令的人
  rationale: ἀπειθέω在此表示拒绝服从，ἐπιτάγματα指命令或谕令；此译直白地保留二者关系。
- source_word: εὐεργετεῖν
  choice: 厚待
  rationale: 该动词表示施予好处或恩惠；在君王与臣民的关系中，“厚待”自然体现给予利益，又不具体限定赏赐形式。
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: 那些甘心服从我的人
  rationale: εὐπειθέω表示乐于、欣然或顺从地听从；“甘心服从”保留εὐ-所带的积极、主动顺服意味，避免仅译成一般的“服从”。
theological_decisions:
- issue: 君王所应许的φιλία具有什么性质
  choice: 正文译作“友谊”，并在脚注指出君王恩宠的含义
  alternative: 恩宠；眷顾
  rationale: φιλία保有真实的人际“友谊”意义，但在希腊化君王话语中也可指统治者给予的恩宠或优待。正文不将其抽象化，脚注则保留政治—庇护关系的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“我劝你们”保留君王劝诱中带压力的语气；“既……也……”自然呈现希腊文ὥσπερ……οὕτως καί的平衡对照；“厚待”与“惩罚”形成符合君王话语的鲜明对应。
