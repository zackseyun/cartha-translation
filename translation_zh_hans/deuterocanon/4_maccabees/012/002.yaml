base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/002.yaml
  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
translation:
  language: zh_hans
  text: 暴君尽管曾遭他弟兄们严厉辱骂，但看见他身上已经套着锁链[a]，还是怜悯他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经被锁链缠住”或“锁链已经环绕在他身上”。希腊文直译为锁链环绕在他身上。
    reason: 保留τὰ δεσμὰ περικείμενον所呈现锁链环绕在其身上的字面形象，并说明可行译法。
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: 怜悯
  rationale: 表示因他人的处境而生怜悯；“怜悯”简洁、庄重，并保留原文的情感力度。
- source_word: ὁ τύραννος
  choice: 暴君
  rationale: τύραννος在本书语境中带有明确贬义；“暴君”保留了叙述者的道德评价，而没有弱化为中性的“君王”或“统治者”。
- source_word: καίπερ
  choice: 尽管……但……还是
  rationale: 清楚表达强烈的让步关系，也符合现代汉语的自然句法。
- source_word: δεινῶς
  choice: 严厉
  rationale: 修饰所受的斥责，表达其强烈程度；避免将其过度具体化为身体虐待。
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: 遭到他哥哥们的
  rationale: ἀδελφῶν在本叙事中指男性兄长；αὐτοῦ自然回指被缚的弟弟，因此译作“他哥哥们”。
- source_word: κακισθείς
  choice: 斥责
  rationale: κακίζω可指辱骂、责骂或恶待；结合前文兄长们以言语抗拒暴君的场景，“斥责”比笼统的“虐待”更切合，同时不引入身体折磨。
- source_word: ὁρῶν
  choice: 看见
  rationale: 将分词自然译为与暴君产生怜悯直接相关的观察动作。
- source_word: ἤδη
  choice: 已经
  rationale: 准确表示锁链已加在他身上的既成状态。
- source_word: τὰ δεσμὰ περικείμενον
  choice: 已经戴上锁链
  rationale: 保留περίκειμαι所表达的锁链环绕、加在身上的视觉形象；汉语“戴上锁链”自然且不过度解释捆绑方式。
theological_decisions:
- issue: ἀδελφῶν的性别与亲属关系
  choice: 哥哥们
  alternative: 弟兄们／兄弟姐妹
  rationale: 上下文所指为这名幼弟先前受难的男性兄长；译作“哥哥们”既保留性别，也明确长幼关系。
- issue: τύραννος的评价色彩
  choice: 暴君
  alternative: 君王／统治者
  rationale: 原词在此具有贬义和修辞判断；翻译应保留这一评价，不将其处理成中性官衔。
- issue: κακισθείς的受事
  choice: 暴君曾遭到哥哥们的斥责
  alternative: 被缚者曾受到哥哥们的恶待
  rationale: κακισθείς为主格阳性单数，与主语“暴君”一致，而非与宾格关系代词ὃν所指的人一致；因此受斥责者是暴君。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文是承接上文的关系从句片段，中文为求通顺调整了语序，并以逗号保留其未完待续的性质。脚注标记置于其实际说明的“锁链”短语之后。
