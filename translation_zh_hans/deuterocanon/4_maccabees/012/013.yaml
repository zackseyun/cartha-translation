base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: zh_hans
  text: 你这兽性至极的人，自己也是人，竟不以割掉那些与你同受苦难[a]、由同样元素构成之人的舌头，并这样[b]凌辱了这人，又折磨他为耻吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与你同受苦难”也可译作“和你有同样感受”或“与你处境相同”。原文可指具有共同感受、经历或处境的人。
    reason: lexical_alternative
  - marker: b
    text: 原文“这样”中的“这人／他”为阳性单数，指被凌辱和折磨的一个人；“以这种方式”说明凌辱的方式。原文在“割掉……舌头”的复数对象后转为单数。
    reason: textual_clarity
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: 竟不……为耻吗
  rationale: 将不定式所指的残酷行为纳入反诘句，保留 αἰδέομαι 所含的道德羞耻和强烈斥责语气。
- source_word: ἄνθρωπος ὢν, θηριωδέστατε
  choice: 你这个人面兽心之徒，自己也是人
  rationale: θηριωδέστατε 是带最高级意味的呼格，指极端兽性；“人面兽心”自然地保留了人与野兽之间的尖锐反差，“自己也是人”则译出让步意味。
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: 那些与你有同样感受的人
  rationale: ὁμοιοπαθεῖς 可指有同样感受、经历或处境者。正文采用较宽泛的“有同样感受”，避免把它限定为已经共同受刑；脚注交代其他可能含义。
- source_word: ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: 由同样元素构成
  rationale: 保留 στοιχεῖα 的古代哲学色彩，表达人与人具有共同的物质构成，而不将其解释成某一特定人论。
- source_word: γλωττοτομῆσαι
  choice: 割掉……的舌头
  rationale: 该复合动词专指割舌；此译直白呈现行为的残酷程度。
- source_word: καταικίσας
  choice: 残害
  rationale: καταικίζω 可指凌辱、虐待或毁伤。上下文是割舌和酷刑，“残害”兼顾身体毁伤与暴虐对待。
- source_word: βασανίσαι
  choice: 折磨
  rationale: 在殉道受刑语境中指严酷的刑讯或酷刑；“折磨”与前面的“残害”形成自然并列。
- source_word: τοῦτον ... τὸν τρόπον
  choice: 这样
  rationale: 将 τοῦτον τὸν τρόπον 视为表示方式的宾格短语“以这种方式”，而非把 τοῦτον 解释为男性单数受事“这个人”。
theological_decisions:
- issue: ἄνθρωπος ὢν 与 θηριωδέστατε 的人兽对照
  choice: 明确保留“自己也是人”与“人面兽心”的反差
  alternative: “你虽是人，却极其残暴”
  rationale: 原句的谴责建立在人类共同身份与兽性行为的反讽对照上；此译保留修辞张力，不附加教派性人论。
- issue: στοιχεῖα 所表达的人类共同构成
  choice: 正文译为“元素”
  alternative: “基本成分”或“同样的物质构成”
  rationale: “元素”保留原文的古代哲学用语及其开放性，既指出人类共有的构成，又不替作者界定具体的宇宙论。
- issue: καταικίσας 与 βασανίσαι 的隐含受事
  choice: 依前文复数对象译作“他们”
  alternative: 依英语咨询层译作“他”
  rationale: 希腊文 τοῦτον 与 τὸν τρόπον 共同构成“这种方式”，并非清楚指向一个男性单数受事；相关动词的对象未明说，按前面的复数群体补出“他们”最合句法脉络，同时以脚注说明。
translation_notes:
  register: 采用现代、庄重而有力度的反诘语气。“人面兽心”是普通读者熟悉的成语，既传达最高级呼格的猛烈斥责，也保留“人”与“兽”的原文意象。句法上避免照搬英语咨询层对 τοῦτον 的单数人物解释，按希腊文 τοῦτον τὸν τρόπον 的方式宾格处理。所有脚注标记均在正文出现。
