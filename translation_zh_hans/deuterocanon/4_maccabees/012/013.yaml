  source_fidelity: 原译将“人面兽心”与“自己也是人”并置，虽有修辞力度，却略添“面”与“心”的成语意象；更关键的是，把 τοῦτον καταικίσας τὸν τρόπον 误析为整体的方式宾格，因而将后段受事改为复数“他们”。原文 τοῦτον 是“这人／他”的单数受事，τὸν τρόπον 是“以这种方式”，应保留由复数割舌转向单数受刑者的变化。
  naturalness: 修订稿使用现代汉语中庄重、有力的反诘句式。“兽性至极的人”保留原文的兽类意象和最高级谴责，避免成语额外联想；“割掉……的舌头”“凌辱了这人，又折磨他”表达清楚且符合叙事中的暴力语境。
  terminology: “同受苦难”可传达 ὁμοιοπαθεῖς 在此处共同受苦、共同人性处境的含义，并以脚注保留其可指共同感受或处境的开放性。“元素”保留 στοιχεῖα 的哲学性用语。καταικίσας 译为“凌辱”，基本义为残酷羞辱／虐待；与“折磨”分别对应，避免不必要地把二者合并。
