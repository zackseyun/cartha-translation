  text: And after praying these things[a], he threw himself onto the frying pans; and so he died.
translation:
  language: zh_hans
  text: 他祷告完这些话，就纵身投到那些煎锅上；这样便死了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样，他便交出了（生命）”或“这样，他便舍弃了（生命）”。原文没有明说所交出的是什么；此处指死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: 他说完这番祷告
  rationale: 不定过去时中间语态分词表示祷告先于主要动作完成；ταῦτα回指前文祷告的内容。译作“说完这番祷告”符合现代汉语叙事习惯，并保留先后次序。
- source_word: ἑαυτὸν ἔρριψεν
  choice: 就纵身扑向
  rationale: 反身代词与ἔρριψεν共同表达主动而猛烈地将自己投过去。“纵身扑向”自然、明确，也保留其有意行动的力度。
- source_word: κατὰ τῶν τηγάνων
  choice: 那些煎锅
  rationale: κατά加属格在这里表示向下落在或撞向刑具；τηγάνων指煎锅或受热的锅。结合“扑向”，译文清楚表达朝这些刑具投身而去。
- source_word: καὶ οὕτως ἀπέδωκεν
  choice: 这样，他便断了气
  rationale: ἀπέδωκεν字面有“交出、归还”之意，此处省略其宾语，在殉道叙事中指交出生命而死。“断了气”既清楚表达死亡，又略微保留原文不同于普通“死去”的委婉语气。
theological_decisions:
- issue: ἀπέδωκεν在殉道叙事中的省略和含义
  choice: 断了气
  alternative: 死了；交出了生命；献出了灵魂
  rationale: 原文没有明说所交出的是“生命”还是“灵魂”。“断了气”表达死亡结果，却不补入原文未明示的神学对象；脚注保留较直译的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“纵身扑向”体现动作的主动性和力度；“断了气”避免生硬的“交还了”，也不擅自补出“生命”或“灵魂”。主文中的脚注标记[a]与脚注对应。
