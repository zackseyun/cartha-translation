base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: zh_hans
  text: “你看见你哥哥们疯狂之举的下场了[a]；他们因不肯服从，受了酷刑[b]，已经死了。至于你，如果不肯听从[c]，也会悲惨地受刑而过早死去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下场”也可译作“结局”或“结果”。
    reason: lexical_alternative
  - marker: b
    text: “受了酷刑”所译的希腊语动词也可较具体地指人在刑架上被拉扯、扭曲。
    reason: cultural_note
  - marker: c
    text: “听从”直译可作“被说服”；这里指接受命令并照办。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονοίας
  choice: 疯狂之举
  rationale: 该词指失去理性的愚妄或疯狂；这里是暴君对众兄弟行为的敌意评价。“疯狂之举”既保留斥责语气，又自然指向他们所采取的行动。
- source_word: τὸ τέλος
  choice: 下场
  rationale: 此处既可指“结局”，也带有行为后果之意。“下场”符合威吓性的直接引语，同时保留负面语气。
- source_word: ἀπείθειαν
  choice: 不肯服从
  rationale: 在强迫遵命的语境中，该词表示拒绝服从；用动词短语比抽象名词“不顺从”更符合现代汉语。
- source_word: στρεβλωθέντες
  choice: 受尽酷刑
  rationale: 该动词可特指在刑架上被拉扯、扭曲，也可泛指遭受酷刑。正文采用自然且不过度限定刑具的表达，具体含义列入脚注。
- source_word: τεθήκασιν
  choice: 已经死了
  rationale: 该完成时形式在这里惯用地表示死亡及其现存结果，译为“已经死了”清楚自然。
- source_word: πεισθείης
  choice: 听从
  rationale: 字面可作“被说服”，但在暴君要求实际顺服的语境中指接受命令、照办。“听从”既保留劝服与服从之间的语义联系，也与前文“不肯服从”呼应。
- source_word: ταλαί
  choice: 受尽苦刑
  rationale: 该形式带有“可怜、悲惨”的情感色彩，并加强受刑的惨烈程度；汉语以“受尽”传达这种强化语气。
- source_word: βασανισθεὶς
  choice: 受尽苦刑
  rationale: 分词表示在死亡之前遭受严酷折磨；依汉语顺序置于“死去”之前，清楚表达先受刑、后死亡。
- source_word: πρὸ ὥρας
  choice: 未到寿数
  rationale: 该短语意为未到应有的时候、过早。“未到寿数便死去”是自然庄重的汉语，不必将其神学化为某个明确预定的时刻。
theological_decisions:
- issue: 说话者对众兄弟行为的贬斥
  choice: 译作“疯狂之举”，保留暴君的敌意评价
  alternative: 译作“愚妄”或“失去理智”
  rationale: 这是人物的威吓言辞，不是叙述者对殉道者的判断。译文应忠实呈现其贬斥口吻，却不把这一评价当作叙事立场。
- issue: πεισθείης所表达的劝服与顺服
  choice: 正文译作“听从”
  alternative: “被说服”或“服从”
  rationale: 原词本身可表示被说服，但在此处其实际后果是服从命令。“听从”不把这一语义张力完全消除，脚注同时保留较字面的可能。
- issue: πρὸ ὥρας是否暗示神所预定的死期
  choice: 译作“未到寿数”，只表达早死
  alternative: “在预定的时候以前”
  rationale: 原文没有明说是谁设定此时刻，也未明确提出预定论；译文避免加入原文未说明的神学主体。
translation_notes:
  register: 采用现代、庄重而易懂的直接引语。以“哥哥们”表达复数ἀδελφῶν在对最年幼弟弟说话时的亲属关系；“至于你”对应希腊文强调性的σύ，并凸显威胁转向当前受话者。标点和语序按现代汉语调整，同时保留前因后果及先受刑、后早死的逻辑。
