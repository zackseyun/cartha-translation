  yaml_path: translation/deuterocanon/4_maccabees/012/018.yaml
  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: zh_hans
  text: 但我求告列祖的上帝[a]，愿他怜悯我的族人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祖先的上帝”。
    reason: πατρῷον 可表示属于祖先或与祖先相承的；“列祖的上帝”与“祖先的上帝”都能表达此义。
  - marker: b
    text: 或译：“我的民族”“我的同胞”或“我的宗族”；原词也可指血统或族类。
    reason: γένος 语义范围较宽，可涵盖宗族、同胞、族群或民族，具体范围需由上下文判断。
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: 我求告
  rationale: 该中间语态形式在这里表示向上帝恳切呼求。“求告”既自然，又保留祷告与恳求的语气；比“祈求”更贴近“呼求”的词义，也不带“召唤”可能产生的误解。
- source_word: δὲ
  choice: 但
  rationale: 保留上下文中的转折或承接意味；汉语“但”简洁自然。
- source_word: τὸν πατρῷον θεόν
  choice: 列祖的上帝
  rationale: πατρῷος 指属于先辈、由祖先传承下来的。“列祖的上帝”是庄重而易懂的圣经式汉语，能传达祖先与信仰历史的关联，同时不增添原文没有的教义说明。
- source_word: ὅπως
  choice: 愿
  rationale: ὅπως 引出呼求的目的或内容。结合虚拟语气，译作“愿”符合汉语祷告表达，也保留祈愿性质。
- source_word: ἐλέως γένηται
  choice: 他怜悯
  rationale: ἐλέως 作表语，γένηται 可表示“成为、显为、是”。汉语直接译作“怜悯”最自然，不暗示上帝的性情发生变化。
- source_word: τῷ γένει μου
  choice: 我的族人
  rationale: γένος 可指血统、宗族、族类、民族或同胞。“族人”既保留血缘与族群色彩，也适合此处为受迫害的共同体代求的语境，避免现代汉语“种族”可能引起的误解。
theological_decisions:
- issue: πατρῷον θεόν 所表达的祖先关系
  choice: 列祖的上帝
  alternative: 祖先的上帝；祖传的上帝
  rationale: 原文强调这位上帝与先辈及其信仰历史的关系。“列祖的上帝”保留这一历史与群体意涵，却不把未明说的盟约神学扩写进正文。
- issue: τῷ γένει μου 的范围
  choice: 我的族人
  alternative: 我的民族；我的同胞；我的宗族
  rationale: γένος 本身范围有弹性。上下文较可能指整个犹太族群，但原词也含血缘、宗族意味；“族人”能保留这种张力，不把范围缩窄为直系亲属，也不完全固定为现代民族国家概念。
- issue: ἐλέως γένηται 是否暗示上帝变得有怜悯
  choice: 愿他怜悯
  alternative: 愿他成为仁慈的；愿他显出怜悯
  rationale: 此处是祈求上帝向族人施怜悯，并非断言上帝本性改变。动词性汉语译法自然表达所求的行动，同时不超出原文。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语体。“求告”“列祖”“怜悯”具有适度的经文语感，但仍为普通现代读者所理解。脚注保留 πατρῷος 与 γένος 的真实词义弹性。
