  yaml_path: translation/deuterocanon/4_maccabees/012/006.yaml
  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: zh_hans
  text: 他这样劝说着，便派人叫那少年的母亲来；他怜悯她已经失去了这么多儿子，想劝她使那仅存的儿子顺从，以保全性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得救”。希腊文此词含义较广；在这里最自然是指免于被处死、保全性命。
    reason: 说明σωτηρίαν可译为较宽泛的“得救”，但本句语境所指最可能是免于处死。
lexical_decisions:
- source_word: παρακαλῶν
  choice: 劝说
  rationale: 此处指暴君持续以言语敦促、劝诱；“劝说”自然地表达恳切施压的语气，又不预先判定其态度是安慰或鼓励。
- source_word: μετεπέμψατο
  choice: 派人叫……来
  rationale: 该中间语态动词常指派人召来某人；此译既符合现代汉语习惯，也不额外强化强制意味。
- source_word: ἐλεήσας
  choice: 想要怜悯
  rationale: 分词表达其所声称或叙述中的动机。“怜悯”保留同情、可怜之意，但不必赋予专门的神学含义。
- source_word: στερηθεῖσαν
  choice: 已经失去了
  rationale: 希腊文为被动，意为被剥夺、丧失；汉语“失去了”在丧子语境中更自然，同时准确交代她已痛失众子。
- source_word: παρορμήσειεν
  choice: 劝
  rationale: 这里指推动母亲采取行动，进而影响儿子；“劝”简洁自然，并避免“煽动”等过强的贬义。
- source_word: εὐπειθῆ ποιῆσαι
  choice: 使……顺从
  rationale: 原短语指使人变得听劝、服从。在强制性的宫廷语境中，“顺从”不暗示这种服从在道德上必然正确。
- source_word: τὸν περιλειπόμενον
  choice: 那仅存的儿子
  rationale: 指此前众子被杀后唯一剩下的儿子；结合前文补出“儿子”，汉语指代清楚且不增加实质信息。
- source_word: σωτηρίαν
  choice: 得救
  rationale: 该词可泛指拯救、保全；本段直接语境是免于处死。“得救”保留原词较宽的语义，并由脚注说明此处最可能指肉身获救。
theological_decisions:
- issue: 殉道语境中 σωτηρίαν 的含义
  choice: 正文译作“得救”，脚注指出此处主要指免于被处死
  alternative: 译作“保命”或“获救”以明确限定为身体得救
  rationale: 上下文显然关乎让仅存的儿子因顺从而逃过处决，但希腊词本身可有较宽的“拯救”含义。正文保留一定张力，脚注交代语境中的主要所指，避免把词义过度收窄或引入系统神学结论。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“派人叫……来”较“召来”更贴近日常现代汉语；“仅存的儿子”“顺从”“得救”则保持经文语体的凝练。句法按汉语重组，但保留暴君先劝说、再召母亲，并企图借她影响儿子的逻辑关系。
