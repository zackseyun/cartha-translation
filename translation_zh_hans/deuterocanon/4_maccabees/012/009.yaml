  text: And, rejoicing especially over the young man's promise, they quickly untied him.
translation:
  language: zh_hans
  text: 他们尤其因那年轻人的承诺而高兴，便迅速给他松了绑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: 高兴
  rationale: 该过去分词表示因某事而欢喜；用“因……而高兴”自然呈现它与主句动作的伴随及原因关系。
- source_word: μάλιστα
  choice: 尤其
  rationale: 突出使他们欢喜的首要缘由，同时符合现代汉语表达。
- source_word: ἐπαγγελίᾳ
  choice: 承诺
  rationale: 此处指年轻人所作的允诺或保证；“承诺”既保留语义，也不额外说明其具体内容。
- source_word: τοῦ παιδός
  choice: 那年轻人的
  rationale: παῖς 可指孩子、少年或年轻人；按叙事语境，此处指马加比兄弟之一，译作“年轻人”可避免让人误以为是年幼儿童。
- source_word: ταχέως
  choice: 迅速
  rationale: 表达行动很快、毫不拖延，与原文副词的动作方式相符。
- source_word: ἔλυσαν
  choice: 给他松了绑
  rationale: λύω 基本义为解开、松开；在受刑和捆绑的语境中，“松了绑”比宽泛的“释放”更具体。
theological_decisions: []
translation_notes:
