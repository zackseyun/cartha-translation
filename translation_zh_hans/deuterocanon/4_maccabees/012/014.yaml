  text: But those who died nobly fulfilled their godliness toward God;[a]
translation:
  language: zh_hans
  text: 但那些高尚地死去的人，圆满地践行了他们对上帝的虔敬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“完全践行了他们对上帝的敬虔。”
    reason: 保留ἐπλήρωσαν“充分完成、实现”及εὐσέβεια“敬虔”的可行词义替代。
lexical_decisions:
- source_word: ἀλλ᾽
  choice: 但
  rationale: 承接上文形成转折，简洁自然。
- source_word: οἱ μὲν
  choice: 那些……的人
  rationale: 保留所指群体；μέν所提示的对照由语境体现，不另作生硬直译。
- source_word: εὐγενῶς ἀποθανόντες
  choice: 英勇赴死的人
  rationale: εὐγενῶς表示高尚、可敬的方式；在殉道语境中，“英勇赴死”自然传达其道德勇气，但不增加死亡原因。
- source_word: ἐπλήρωσαν
  choice: 成全了
  rationale: 表达“使之达到完全、圆满完成”的含义，也保留其行为使虔敬得到充分实现的意味。
- source_word: τὴν εἰς τὸν θεὸν εὐσέβειαν
  choice: 他们对上帝的虔敬
  rationale: εὐσέβεια在此指向上帝的敬虔与忠贞实践；“对上帝的虔敬”准确保留εἰς所表达的对象和趋向。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的表达
  choice: 虔敬
  alternative: 敬虔；虔诚
  rationale: “虔敬”兼顾内在敬畏与外在忠贞，不把该词限定为某一后期神学术语；脚注保留自然的近义译法。
- issue: ἐπλήρωσαν是否表示单纯完成或达到圆满
  choice: 成全了
  alternative: 完全实践了；使……达到圆满
  rationale: “成全”保留动词“充满、完成”的语义张力，未进一步断言其死亡具有何种特定教义性功效。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“英勇赴死”比逐字的“高尚地死去”更自然；“成全了……虔敬”略带庄重色彩，以保留原文的完成意味。
