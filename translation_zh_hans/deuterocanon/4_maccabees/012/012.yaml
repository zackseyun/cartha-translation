base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/012.yaml
  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: zh_hans
  text: 因此，神圣的公义正为你积存更炽烈[a]而永恒的火和种种刑罚；这些刑罚在整个时代中[b]都不会放过你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更炽烈”所译的词直译可作“更密”或“更稠密”；原文用一个较少见的形容词来描写火。
    reason: 说明πυκνότερος的字面意象，并说明为使现代汉语自然所作的表达调整。
  - marker: b
    text: “时代”所译的希腊词也可按语境译作“世代”或“永世”。
    reason: 提示αἰών的语义范围，避免把此处的时间表达无说明地固定为单一神学解释。
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: 作为这些恶行的报应
  rationale: 该短语表示“因这些事／作为这些事的回报”。结合审判语境译作“报应”，并以“恶行”点明所指的是受话者先前的行为。
- source_word: ταμιεύεταί σε
  choice: 正为你积存
  rationale: 保留动词“储存、积存”的审判意象；“为你”自然表达原文中受话者被留待承受火与刑罚的含义。
- source_word: ἡ θεία δίκη
  choice: 神圣的公义
  rationale: δίκη在这里可指公义、审判或惩罚；译作“公义”保留其人格化地施行报应的表达，也避免直接把它缩减为某一种刑罚。
- source_word: πυκνοτέρῳ
  choice: 更浓烈
  rationale: 比较级本义为“更密、更稠密”；修饰“火”时，“更浓烈”在现代汉语中较自然，同时保留火势凝聚、加强的罕见意象。
- source_word: βασάνοις
  choice: 种种刑罚
  rationale: 该词可指折磨、酷刑或痛苦；此处与审判之火并列，“种种刑罚”既庄重又不把含义限定为人为施加的酷刑。
- source_word: οὐκ ἀνήσουσί σε
  choice: 都不会放过你
  rationale: ἀνίημι在这里有松开、释放之意；“不会放过你”表达刑罚持续不止，不释放受罚者。
theological_decisions:
- issue: αἰωνίῳ与εἰς ὅλον τὸν αἰῶνα的时间表达
  choice: 分别译为“永恒的”和“在整个世代中”
  alternative: 将两处都统一译为“永远／永世”
  rationale: 原文先用形容词αἰώνιος形容火，后用名词αἰών构成“整个时代／世代”的表达。分别翻译可保留措辞变化及其可能存在的语义张力，不替文本预先判定二者完全同义。
- issue: 关系代词αἱ的指代
  choice: 明确指回“种种刑罚”
  alternative: 笼统指向“火和刑罚”
  rationale: αἱ为阴性复数，与阴性复数βάσανοι一致，而不与中性单数πῦρ一致，因此后半句在语法上直接说明刑罚不会释放受话者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“神圣的公义”保留原文的人格化表达；分号使“这些刑罚”的关系从句指代清晰。避免古奥的“永劫”等词，也不弱化审判语言。
