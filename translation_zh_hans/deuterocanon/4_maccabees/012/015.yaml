  yaml_path: translation/deuterocanon/4_maccabees/012/015.yaml
  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
translation:
  language: zh_hans
  text: 但你无缘无故地[b]杀害了美德的斗士[a]，必将悲惨地哀号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美德的斗士”也可译作“为美德奋战的人”或“美德的竞技者”；希腊语原词让人想到在竞赛或争战中奋力角逐的人，此处含有尊崇意味。
    reason: lexical_alternative
  - marker: b
    text: “无缘无故地”也可译作“不公正地”或“毫无正当理由地”。希腊语原词强调没有缘由、罪责或正当依据。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你
  rationale: 保留转折和对暴君的直接指斥，符合现代汉语自然语序。
- source_word: κακῶς οἰμώξεις
  choice: 必将悲惨地哀号
  rationale: οἰμώξεις指将来发出悲痛的哀号；κακῶς加强其悲惨、凄苦的意味。
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστάς
  choice: 这些为美德奋战的人
  rationale: ἀγωνιστής带有投身竞赛或争战者的意象；此处兼具斗争与褒扬意味，用描述性表达避免“运动员”在现代汉语中的误导。
- source_word: τῆς ἀρετῆς
  choice: 为美德
  rationale: ἀρετή在本书的希腊化犹太伦理语境中主要指道德上的美德；“为美德”也自然表达其所投身的事业。
- source_word: ἀναίτιως
  choice: 无缘无故
  rationale: 表达没有正当缘由或依据，保留原词的语义开放性，而不直接收窄为法律或道德判断上的“不公正”。
- source_word: ἀποκτεῖναι
  choice: 杀害了
  rationale: 不定式在这里说明其哀号所缘由的行为；汉语用已然体呈现他因实施杀害而将哀号的关系。
theological_decisions:
- issue: 殉道语境中ἀρετή的道德哲学含义
  choice: 美德
  alternative: 卓越；道德上的卓越
  rationale: “美德”准确保留本书希腊化犹太道德论述的核心概念，又不引入后期宗派性神学含义。
- issue: ἀγωνιστής的斗争意象与荣誉色彩
  choice: 为美德奋战的人
  alternative: 美德的斗士；美德的竞技者
  rationale: 描述性译法兼顾争战意象和褒扬语气，同时避免把殉道者误解为现代体育运动员。
- issue: ἀναίτιως是否明确译作道德判断
  choice: 无缘无故
  alternative: 不公正地；毫无正当理由地
  rationale: 原词可表示无罪责、无缘由或无正当依据；正文保留较宽泛的表达，不替原文消除其张力。
translation_notes:
  register: 采用现代、庄重而有斥责力度的汉语。“必将”体现将来陈述的确定语气；调整分句次序，使杀害行为自然成为随后哀号的缘由。所有脚注标记均置于正文相应内容之后。
