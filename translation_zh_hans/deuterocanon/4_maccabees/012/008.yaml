  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: zh_hans
  text: “放开我，”他说，“好让我向王和所有在他身边的朋友说话。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”也可理解为“随从”或王身边的“亲信、朝臣”。希腊文 φίλοι 既可指私人朋友，也可指王室伙伴或宫廷官员；正文保留最直接的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  choice: 放开我
  rationale: ἀπολύω 的不定过去时命令式在此是要求解除拘束；“放开我”自然、直接，又不额外引入法律上的释放含义。
- source_word: φησίν
  choice: 他说
  rationale: 保留希腊文叙事中的历史现在时，使叙述具有现场感。
- source_word: εἴπω
  choice: 好让我……说话
  rationale: 不定过去时虚拟式承接命令句，表达目的；与间接受词连用时，“对……说话”比补出未明说的信息内容更贴近原文。
- source_word: τῷ βασιλεῖ
  choice: 对王
  rationale: 与 εἴπω 搭配的与格对象；译作“对王”。
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: 所有与他同在的朋友
  rationale: 明确表达 πᾶσιν（所有）与 σὺν αὐτῷ（与他同在），并以“朋友”保留 φίλοι 最直接的词义及其可能指宫廷亲信的含义空间。
