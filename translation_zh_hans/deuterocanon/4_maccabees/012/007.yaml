  rationale: 该分词表示主动劝勉、鼓励；“勉励”既保留其力度，也符合庄重自然的现代汉语。
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: 用希伯来语
  rationale: φωνή在此指所使用的言语或语言，而非单纯的声音；“用希伯来语”清楚表达母亲以何种语言对他说话。
- source_word: ὡς ἐροῦμεν
  choice: 正如我们……要讲述的那样
  rationale: 保留作者插叙式的预告，说明此事将在后文叙述。
- source_word: μετὰ μικρὸν ὕστερον
  choice: 稍后
  rationale: 该短语指叙事中不久之后；“稍后”简洁自然。
