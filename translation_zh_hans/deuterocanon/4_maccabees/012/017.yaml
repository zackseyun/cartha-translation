  text: I will not renounce the testimony of my brothers[a].
translation:
  language: zh_hans
  text: 我绝不背弃我弟兄们的见证[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我弟兄们的证言”；在本段语境中，“见证”一词也含有为信仰受死的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ
  choice: 绝不
  rationale: 否定动词；结合受逼迫时坚决拒绝的语境，用“绝不”自然表达强烈而明确的否定。
- source_word: ἀπαντυμολοῶ
  choice: 背弃
  rationale: 该动词表示在压力下拒绝、否认或弃绝。与宾语“见证”搭配时，“背弃”既符合现代汉语，也表达不肯否定或抛弃弟兄们所作见证之意，而不将含义过度限定为口头“否认”。
- source_word: μαρτυρίας
  choice: 见证
  rationale: 此词可指见证、证言，并在本书语境中带有殉道意味。“见证”保留其直接意义及相关含义，不直接译成“殉道”而提前消解张力。
- source_word: τῆς τῶν ἀδελφῶν μου μαρτυρίας
  choice: 我弟兄们的见证
  rationale: 这里指叙事中说话者的男性手足；“弟兄们”准确保留复数和亲属关系，属格结构自然译为领属短语。
theological_decisions:
- issue: 是否把 μαρτυρίας 明译为“殉道”
  choice: 见证
  alternative: 殉道；证言
  rationale: 本节处于殉道叙事中，因此“见证”确有舍命作证的回响；但希腊词本身仍保留较宽的见证、证言义。正文不明译为“殉道”，以保存原文的语义张力，并在脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“绝不背弃”体现说话者在威逼之下的坚定态度；避免使用较古旧的“弟兄之见证”，也不以“殉道”取代原文较含蓄的表达。
