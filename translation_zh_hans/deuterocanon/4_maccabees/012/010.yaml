    reason: cultural_note
lexical_decisions:
- source_word: δραμὼν
  choice: 跑到
  rationale: 该词是τρέχω的不定过去时分词，表示在主句“说”之前迅速移动；译作“跑到”既保留动作的迅疾和先后关系，也符合现代汉语叙事习惯。
- source_word: ἐπὶ πλησίον
  choice: 近旁
  rationale: 这一组合同时包含趋近和靠近之意；与“跑到”合译为“跑到……近旁”，自然地表达向目标移动并抵达其附近，同时不把距离说得过于确定。
- source_word: τῶν τηγάνων
  choice: 煎锅
  rationale: τήγανον指用于煎烤的平底锅具；此处在殉道叙事中是被加热的刑具。“煎锅”保留其日常器具名称，而不在正文中直接解释为刑具。
- source_word: ἔφη
  choice: 说
  rationale: 这是常见的叙事性引语引介词，译作“说”简洁自然；句末用冒号表明下文为直接引语。
