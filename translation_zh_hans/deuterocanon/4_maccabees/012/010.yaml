  text: 他跑到那些煎锅[b]旁边[a]，说道：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“靠近那些煎锅”或“到了煎锅旁边”。希腊语ἐπὶ πλησίον把趋近的动作与近旁的位置合在一起表达。
    reason: lexical_alternative
  - marker: b
