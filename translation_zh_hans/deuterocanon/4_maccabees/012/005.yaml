  yaml_path: translation/deuterocanon/4_maccabees/012/005.yaml
  text: But if you are persuaded[a], you will be a friend, and you will have charge of the affairs of the kingdom.
translation:
  language: zh_hans
  text: 但你若被说服，就会成为朋友，并负责[a]王国的政务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责”也可译为“管理”“主持”或“掌管”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθεὶς
  choice: 若肯听从
  rationale: 这是 πείθω 的不定过去时被动分词，在此具有条件意味。结合劝诱、施压的语境，“若肯听从”比生硬的“若被说服”更符合现代汉语，同时保留顺从劝告之意。
- source_word: φίλος
  choice: 我的朋友
  rationale: 基本义为“朋友”；此处由君王直接许诺，隐含受宠或宫廷身份。汉语补出关系所属“我的”，使直接引语自然，但不把它解释性强化为“宠臣”或“盟友”。
- source_word: ἔσῃ
  choice: 就会成为
  rationale: 准确表达 εἰμί 的将来时，并与前面的条件结构自然衔接。
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: 王国的政务
  rationale: πράγματα 在此指事务、公务；ἐπὶ τῆς βασιλείας 指王权或王国范围内的事务。“王国的政务”简洁自然，并体现行政语境。
- source_word: ἀφήγησιν
  choice: 负责
  rationale: 该词在这里表示领导、管理或主管，与属格短语连用，意为承担王国政务的管理职责。“负责”能自然表达受托掌管之意，又不夸大为最高统治权。
