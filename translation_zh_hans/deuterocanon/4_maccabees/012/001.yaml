  yaml_path: translation/deuterocanon/4_maccabees/012/001.yaml
  text: And as he too died blessedly, after being thrown into the cauldron, the seventh came forward, the youngest of all.
translation:
  language: zh_hans
  text: 他也被扔进大锅，蒙福而死；随后，第七个，就是他们当中最年幼的，走上前来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίως
  choice: 蒙福而
  rationale: 该副词修饰“死”，表达这种死亡受到肯定、被视为有福，而非指临死时情绪愉快；“蒙福而死”在现代汉语中自然庄重，并保留其评价意味。
- source_word: ἐναπέθανεν
  choice: 死
  rationale: 复合动词在此表示他在被投入大锅这一处境中死亡；汉语以“死”作核心谓语，并由前句交代致死处境，最为自然。
- source_word: καταβληθείς
  choice: 被扔进
  rationale: 过去时被动分词表示遭人强行投入；“被扔进”同时保留被动性和动作力度，并与容器“大锅”自然搭配。
- source_word: λέβητα
  choice: 大锅
  rationale: λέβης指大型金属锅或釜；“大锅”通俗清楚，适合此处刑罚场景，又不额外加入原文未明说的“沸腾”。
- source_word: παρεγίνετο
  choice: 走上前来
  rationale: 该词在叙事中表示下一人来到现场、出面承受考验；“走上前来”体现人物依次出场的推进。
- source_word: ὁ πάντων νεώτερος
  choice: 他们当中最年幼的
  rationale: 明确第七个人在这一群人中年龄最小；补出语境中的“他们”，使现代汉语指向清晰。
theological_decisions:
- issue: 殉难语境中μακαρίως的表达
  choice: 蒙福而死
  alternative: 幸福地死去；死得有福
  rationale: “蒙福而死”保留原文对其死亡的正面、属灵评价，又避免“幸福地”可能暗示的主观愉悦，也不进一步规定福分的具体神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号区分前一位兄弟之死与第七位出场两个事件；“就是他们当中最年幼的”保留希腊语同位说明的结构与强调。
