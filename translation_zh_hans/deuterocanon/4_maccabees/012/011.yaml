base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: zh_hans
  text: 她说：“你这不圣洁的人，恶人中最不敬神的暴君！你从上帝那里领受了种种好处和王权，竟还杀害他的仆人，向那些操练敬虔的人[a]施以酷刑，难道不觉得羞耻吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “操练敬虔的人”也可译作“致力于虔诚生活的人”；ἀσκητής指操练或实践某种德行的人，这里不必按后期的专门意义理解为“禁欲者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: 你这不圣洁的人
  rationale: 保留呼格中的宗教和道德谴责；“不圣洁”比单纯的“恶人”更贴近ἀνόσιος，并适合庄重的直接斥责。
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: 恶人中最不敬神的暴君
  rationale: 将πάντων τῶν πονηρῶν理解为所属类别，把ἀσεβέστατε的最高级译为“最不敬神的”，并保留τύραννε的贬义“暴君”及原文层层加重的修辞。
- source_word: οὐκ ᾐδέσθης
  choice: 难道不觉得羞耻吗
  rationale: 以现代汉语反问句自然表达原文的道德责问，也保留αἰδέομαι所含的羞耻与敬畏约束之意。
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ καὶ τὴν βασιλείαν
  choice: 从上帝那里领受了种种好处和王权
  rationale: “领受”表达所得源自上帝；“种种好处”保留τὰ ἀγαθὰ的宽泛性；“王权”指获赐的君王权位，而非疆域意义的王国。
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: 他的仆人
  rationale: 既表达归属于上帝并服事他的关系，又不擅自指定宗教职分。
- source_word: κατακτείνειν
  choice: 杀害
  rationale: 比中性的“杀死”更符合暴君迫害上帝仆人的语境，同时没有具体化为原文未明说的处决方式。
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: 那些操练敬虔的人
  rationale: ἀσκητής在此指实践、训练某种德行的人；“操练敬虔”兼顾其纪律性和εὐσέβεια面向上帝的含义，避免引入后期技术性的禁欲主义概念。
- source_word: στρεβλοῦν
  choice: 折磨
  rationale: 清楚表达施加酷刑的含义，又不将刑具过度具体化为原文此处未明说的拉肢架。
theological_decisions:
- issue: 犹太殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔诚
  rationale: “敬虔”清楚保留对上帝的敬畏与忠诚，也适合本书把εὐσέβεια视为需要实践和操练之德行的语境；“虔诚”虽可行，但较弱化其伦理实践面。
- issue: θεράποντας用于属上帝之人的译法
  choice: 仆人
  alternative: 侍从；服事他的人
  rationale: “仆人”保留归属与服事关系，不把他们限定为祭司、教职人员或其他特定职分。
- issue: 王权来自上帝的陈述
  choice: 从上帝那里领受……王权
  alternative: 从上帝那里领受……国度
  rationale: 原文将君王享有的好处和统治权表述为来自上帝，但并未进一步解释这种赐予的性质；译文保留该张力，不推导出额外的政治神学结论。
translation_notes:
  register: 采用现代、庄重而有力度的直接引语。“你这……”“竟还……难道……”使斥责在汉语中自然连贯，同时保留原文连续堆叠的强烈谴责。唯一脚注标记[a]已置于正文对应句末。
