lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 承接上文并引出由前文所得的结果或推论；“因此”在现代汉语中自然、庄重。
- source_word: καὶ
  choice: 连……也
  rationale: 与强调代词 αὐτός 结合，突出此人本人同样如此；译作“连……也”比孤立译成“也”更符合汉语表达。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 保留强调代词的力度，指出正是他本人在面对死亡时说了以下的话。
- source_word: ἀποθνήσκειν
  choice: 死
  rationale: 与 μέλλων 连用表示死亡临近；“临死时”简洁自然地传达这一含义。
- source_word: μέλλων
  choice: 临……时
  rationale: 结合不定式 ἀποθνήσκειν 译为“临死时”，表达即将死亡，不引入宿命或注定之意。
- source_word: ἔφη
  choice: 说
  rationale: 采用中性、常见的叙事引语动词，不额外加入“宣告”等语气。
