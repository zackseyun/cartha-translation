  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: zh_hans
  text: 但他在今生和你死后都必惩罚你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὲ
  choice: 你
  rationale: 第二人称单数宾格，是“惩罚”的直接受词；按原文译为单数“你”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并带有转折意味；“但”自然保留其对比作用。
- source_word: καὶ … καὶ
  choice: 不仅……也……
  rationale: 两个 καὶ 将“今生”和“死后”两个时间范围并列起来；现代汉语用“不仅……也……”可清楚自然地表达两者皆包括在内。第一个 καὶ 也可能带强调意味，因此以脚注保留“甚至”的译法。
- source_word: ἐν τῷ νῦν βίῳ
  choice: 在今生
  rationale: 直译为“在现今的生命中”；“在今生”简洁自然，并与死后的情形形成明确对照。
- source_word: θανόντα
  choice: 在你死后
  rationale: θανόντα 是与宾格“你”一致的简单过去主动分词，在此作时间性理解；“在你死后”明确表达死亡之后的时间关系。
- source_word: τιμωρήσεται
  choice: 他会惩罚
  rationale: 第三人称单数将来时中间语态，语境中主语未在本句明说；保留主动施事者“他”，不改写成被动句，也不擅自指明其身份。
theological_decisions:
- issue: 将来时动词的隐含主语
  choice: 他会惩罚你
  alternative: 你会受惩罚
  rationale: 原文是第三人称单数中间语态，而非被动语态；译文以“他”承接语境中的隐含主语，同时不在本句中进一步指认其身份。
- issue: 惩罚的时间范围
  choice: 不仅会在今生惩罚你，在你死后也会惩罚你
  alternative: 甚至在今生，并在你死后，他都会惩罚你
  rationale: 原文明言惩罚涵盖现世与死后两个范围；正文保留二者，又不对死后惩罚的性质、方式或期限作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“今生”自然体现与“死后”的对照；重复“惩罚你”使两个时间范围都明确落在同一动作上。
