  text: 他把他叫到更近处[a]，试图劝慰他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把他叫到近前，试着安慰他，说：”
    reason: 原文πλησιέστερον为比较级，可译“更近处”；παρηγορεῖν也可侧重“安慰”。
lexical_decisions:
- source_word: πλησιέστερον
  choice: 到近前
  rationale: 比较级副词表示距离更近；结合μετεπέμψατο，译为“叫到近前”自然地表达召来并靠近的意思，同时保留比较性的趋近含义。
- source_word: αὐτὸν
  choice: 他
  rationale: 阳性单数宾格代词，在上下文中指被叫来的儿子。
- source_word: μετεπέμψατο
  choice: 把……叫
  rationale: 该动词中态常指派人召来、叫来；“把他叫到近前”符合现代汉语叙事表达，又不额外赋予正式传召的色彩。
- source_word: παρηγορεῖν
  choice: 劝慰
  rationale: 该词可表示劝勉、鼓励或安慰；此处说话者试图以言语影响受难者，“劝慰”兼顾劝说与安慰，避免只限定为情绪上的抚慰。
- source_word: ἐπειρᾶτο
  choice: 试图
  rationale: 未完成时中态表示正在作出尝试；“试图”简洁体现尝试性质，而后接“说”仍能表现其方式。
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出随后直接引语；汉语用“说：”自然表达其与前句的附属关系。
