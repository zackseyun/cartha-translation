  text: Let us not be cowardly in demonstrating our piety[a].
translation:
  language: zh_hans
  text: 在表明我们对上帝的虔敬时，我们不要胆怯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在证实我们的虔敬时，我们不要丧胆。”
    reason: 保留δειλανδρέω可译为“丧胆”，以及ἀπόδειξις可译为“证实”的词义选择。
lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  choice: 我们不要胆怯
  rationale: 第一人称复数劝勉虚拟式，表达共同的劝诫；“不要胆怯”自然保留了该动词所含的道德力度，而不弱化为一般的灰心。
- source_word: πρὸς
  choice: 在……时
  rationale: 此处与宾格名词短语连用，标明胆怯所涉及的情境或方面；汉语用“在……时”表达自然。
- source_word: τὴν ... ἀπόδειξιν
  choice: 表明
  rationale: ἀπόδειξις可指展示、证实或证明；在殉道劝勉的语境中，“表明”既适合忠贞行为的公开显明，也避免把它限缩为逻辑论证。
- source_word: τῆς εὐσεβίας
  choice: 我们对上帝的虔敬
  rationale: εὐσέβεια指向对上帝的敬畏与忠诚，并落实于行为。“对上帝的虔敬”使对象明确；“我们”依说话者共同表明其虔敬的语境补出。
theological_decisions:
- issue: 殉道劝勉语境中εὐσέβεια的译法
  choice: 对上帝的虔敬
  alternative: 敬虔；虔诚
  rationale: 这一译法兼顾对上帝的敬畏、忠诚及相应行为，不把该词处理为后世的专门神学术语，也不将其仅理解为外在宗教表现。
- issue: ἀπόδειξις所指的行动性质
  choice: 表明
  alternative: 证明；彰显
  rationale: 原词可涵盖展示与证明。这里保留公开显明信仰忠贞的含义，同时不预先断定它仅指理性论证或单纯的行为展示。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。句首情境成分使汉语流畅；“胆怯”保留原文尖锐的道德劝诫，“虔敬”则传达对上帝的敬畏和忠诚。
