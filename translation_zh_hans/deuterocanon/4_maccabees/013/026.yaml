- from: 因为她在培养他们敬虔的同时，也使弟兄之爱在他们心中更加可爱。
  to: 因为她连同敬虔一起，使弟兄之情更为他们所珍爱。
  rationale: 修订避免将“敬虔”明确改述为被母亲培养的对象，同时以“连同……一起”对应σὺν。将“更加可爱”改为“更为他们所珍爱”，较准确自然地表达比较级ποθεινοτέραν及αὐτοῖς的“在他们看来／为他们所”的关系。
