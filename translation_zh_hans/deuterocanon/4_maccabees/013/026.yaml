  text: For along with godliness she made brotherly love even more desirable to them.
translation:
  language: zh_hans
  text: 因为她连同敬虔一起，使弟兄之情更为他们所珍爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν γὰρ τῇ εὐσεβείᾳ
  choice: 因为她在培养他们敬虔的同时
  rationale: σύν表示伴随关系；γάρ承接上文说明缘由。中文补出“培养他们”，使与后面的未完成时动词κατεσκεύαζεν所表达的持续塑造作用自然衔接。“敬虔”保留εὐσέβεια对上帝忠诚、虔敬的方向。
- source_word: ποθεινοτέραν
  choice: 更加可爱
  rationale: 这是ποθεινός的比较级，指更令人爱慕、更值得珍爱。“更加可爱”既保留比较意义，也比“更令人渴望”更适合亲兄弟之间的情爱语境；不另加希腊文没有明确表达的“甚至”。
- source_word: αὐτοῖς
  choice: 在他们心中
  rationale: 与格表示在他们看来或对他们而言。译作“在他们心中”自然表达这种主观评价，并避免误解为她只是替他们带来某种外在益处。
- source_word: κατεσκεύαζεν
  choice: 培养……也使
  rationale: 未完成时表示过去持续进行的塑造。中文分配到“培养”和“使”中，传达母亲长期塑造众子品格的过程，而非一次完成的动作。
- source_word: τὴν φιλαδελφίαν
  choice: 弟兄之爱
  rationale: 此处语境是亲生兄弟之间的爱，不只是泛指信仰群体中的友爱。“弟兄之爱”简洁、庄重，并保留亲属关系的具体含义。
theological_decisions:
- issue: εὐσέβεια在《马加比四书》核心德性语境中的译法
  choice: 敬虔
  alternative: 虔诚；敬神
  rationale: “敬虔”在现代中文宗教语境中可理解，并能体现对上帝的敬畏与忠诚；“虔诚”可能偏重态度，“敬神”则较直接但略显解释性。
- issue: ποθεινοτέραν的比较级是否加入“甚至”
  choice: 更加可爱
  alternative: 甚至更加可爱
  rationale: 希腊文有明确比较级，但没有独立词语直接对应“甚至”。因此保留“更加”，不强化为“甚至更加”，避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“因为”保留γάρ与上文的解释关系；句中以“在……的同时，也……”自然呈现伴随结构。主语“她”依上下文指母亲。
