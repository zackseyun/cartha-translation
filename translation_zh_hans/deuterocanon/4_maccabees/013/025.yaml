  text: For their shared commitment to noble goodness intensified their harmony with one another.
translation:
  language: zh_hans
  text: 因为他们在高尚善德上的同心，使他们彼此之间更加和睦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们在美德上心志一致，使他们彼此更加同心合一。”
    reason: 保留ὁμόγνοια、καλοκἀγαθία和ὁμόνοια的其他合理译法，以及原文两个近义词之间的呼应。
lexical_decisions:
- source_word: ὁμόγνοια
  choice: 同心
  rationale: 表示思想、志向一致；译作“同心”既自然凝练，也与后面的“和睦”有所区分。
- source_word: καλοκἀγαθίας
  choice: 高尚善德
  rationale: 兼顾该词所包含的高尚与良善、德性之意，避免仅译作较抽象的“美德”而损失其复合色彩。
- source_word: ἐπέτεινεν
  choice: 使……更加
  rationale: 该动词本有伸展、增强之意；在此表示他们彼此的和睦得到加强。
- source_word: ὁμόνοιαν
  choice: 和睦
  rationale: 指人与人之间的同心、协调与和谐；“和睦”符合此处关系语境，并避免与ὁμόγνοια重复。
- source_word: πρὸς ἀλλήλους
  choice: 彼此之间
  rationale: 准确表达相互关系，符合现代汉语习惯。
