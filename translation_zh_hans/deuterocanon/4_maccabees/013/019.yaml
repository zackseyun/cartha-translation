base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: zh_hans
  text: 你们也不是不知道人性所具有的深厚情爱[a]；神圣而全智的天意借着父亲，把这些情爱赐给那些出生的人，又借着母腹把它们栽植在他们里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“人类本有的天然情感”或“人所具有的深厚依恋”。希腊词 φίλτρα 在这里指强烈的情爱和依恋；虽然该词在别处可指爱情魔符或媚药，但此处并非此义。
    reason: 说明 φίλτρα 的语义幅度，并保留本节语境中“强烈情感／依恋”的含义，而不将其限缩为某一类人际关系。
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε δὲ
  choice: 你们也不是不知道
  rationale: 保留否定式表达及对听众的直接称呼，也传达 δέ 在上下文中的承接语气；现代汉语自然且仍具修辞力度。
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: 人性中的深厚情爱
  rationale: φίλτρα 在此指强烈的爱与依恋纽带，并非字面的爱情魔药；“人性中的”保留 ἀνθρωπότητος 所指向的、属于人之本性的含义。
- source_word: ἡ θεία καὶ πάνσοφος πρόνοια
  choice: 神圣而全智的天意
  rationale: “天意”在现代汉语中可表达神圣智慧对生命的安排，保留 πρόνοια 的哲学—神学分量，同时不擅自补入希腊文未明说的“上帝的”。
- source_word: ἔμερισεν
  choice: 分给
  rationale: 表达按份分配、赋予之意；较“分派”更适合情感这一宾语，也更易为普通读者理解。
- source_word: τοῖς γεννωμένοις
  choice: 出生的人
  rationale: 保留被动分词所指的“那些被生下来的人”，并采用简洁自然的现代汉语。
- source_word: διὰ τῶν πατέρων
  choice: 借着父亲
  rationale: 保留原文对父系生育途径的明确提及，不将其泛化为“父母”。
- source_word: φυτεύσασα
  choice: 将它栽植在人里面
  rationale: 保留原文的种植比喻；补出“在人里面”使汉语句意完整，但不改变情爱被植入的基本意象。
- source_word: διὰ τῆς μητρῴας γαστρός
  choice: 借着母腹
  rationale: 简洁保留母亲腹中的生育意象，并与前面的“借着父亲”形成原文所有的父系、母系对应。
theological_decisions:
- issue: 如何翻译希腊化犹太语境中的 πρόνοια
  choice: 天意
  alternative: 护理；眷顾；安排
  rationale: “天意”既可承载神圣智慧的主导与安排，又不必引入后世有关“护理”的特定教义体系；同时避免“护理”在普通现代汉语中容易被理解为照护工作的歧义。
- issue: 是否将父亲与母腹的生育语言概括为父母
  choice: 分别保留“借着父亲”与“借着母腹”
  alternative: 借着父母；借着父母并在母腹中
  rationale: 原文明确区分 διὰ τῶν πατέρων 与 διὰ τῆς μητρῴας γαστρός。译文保留这种张力与古代生育表述，不作概括性改写。
- issue: φυτεύσασα 与 πρόνοια 的关系
  choice: 把“栽植”作为“神圣而全智的天意”的连续行动
  alternative: 将其改写为母亲或母腹的行动
  rationale: 希腊文阴性主格分词 φυτεύσασα 与阴性主语 πρόνοια 呼应，因此译文让“天意”既“分给”又“栽植”，不改变语法施事者。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“你们也不是不知道”保留原文的修辞性否定；“深厚情爱”适合本节的人性与母子情感语境。“天意”略带哲理色彩，与《马加比四书》的论辩文体相称。分号承接原文未完的长句，并提示本节思想仍向下文延续。
