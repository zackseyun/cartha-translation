base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: zh_hans
  text: 可是，如今并不是这样；他们反而凭着上帝所称许的理性判断[a]，战胜了种种情感冲动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理性判断”也可译作“理性”或“推理”。希腊语 λόγισμος 可指理性思考、推理过程或由此形成的判断。
    reason: 保留本书主题词 λόγισμος 的词义范围，避免中文正文中的单一措辞掩盖其多重侧重。
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 可是，如今
  rationale: 保留与上文的转折，并以自然的现代汉语表达时间和对比意味。
- source_word: οὐχ οὕτως
  choice: 并不是这样
  rationale: 保留希腊文简略而指向上文的比较，不擅自补明所否定的具体情形。
- source_word: ἀλλὰ
  choice: 反而
  rationale: 清楚表达否定之后的纠正性转折。
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: 凭着……所称许的理性判断
  rationale: 与格在此表示手段；“理性判断”既体现 λόγισμος 的理性活动，也突出其道德辨别和自制功能，避免仅译作抽象的理性能力。
- source_word: παρὰ θεῷ
  choice: 上帝所
  rationale: 在与 ἐπαινουμένῳ 连用时，最自然地表明称许来自上帝；这一表达同时保持简洁。
- source_word: περιεγένοντο
  choice: 战胜了
  rationale: 直接表达胜过敌对力量、占据优势的含义，符合此处理性制服情感冲动的语境。
- source_word: τῶν παθῶν
  choice: 种种情感冲动
  rationale: πάθη 在本书中主要指需要由理性节制的感受、欲望和情绪力量。“情感冲动”比容易局限于性欲的“情欲”更宽，也比现代汉语中常带正面色彩的“激情”更准确。
theological_decisions:
- issue: 如何翻译《马加比四书》的主题词 λόγισμος
  choice: 理性判断
  alternative: 理性；推理；理智判断
  rationale: “理性判断”保留了这个词所指的主动思量、道德辨别和自制作用，又不把它简化成静态的心智能力。脚注保留其他可能译法。
- issue: παρὰ θεῷ 与 ἐπαινουμένῳ 的关系
  choice: 上帝所称许
  alternative: 在上帝面前受称许；在上帝看来值得称许
  rationale: 此结构最自然地把上帝理解为称许者，但不进一步说明这种称许的神学性质。
- issue: πάθη 的语境意义
  choice: 种种情感冲动
  alternative: 各种激情；各种苦楚
  rationale: 本书的核心论述是敬虔的理性判断胜过情绪、欲望和痛苦反应，因此采用范围较宽的表达，不把它限缩为外在苦难或某一种欲望。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是，如今并不是这样”保留原文的省略和转折；“种种情感冲动”力求涵盖本书语境中的情绪、欲望及痛苦反应，同时避免“情欲”在现代汉语中过窄的联想。
