base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: zh_hans
  text: 雅各会迎接你们[a]，众先祖都会称赞你们。每当他们中有一个兄弟被强行带走时，其余的兄弟就说：“兄弟，不要使我们蒙羞，也不要对那些先我们而死的人失信[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎接”也可译作“接纳”或“接待”。
    reason: lexical_alternative
  - marker: b
    text: “对……失信”也可译作“辜负那些先我们而死的人”；这里可能指不要使已经死去的兄弟所作的见证落空。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: 会迎接
  rationale: ὑποδέχομαι可指接待、接纳或欢迎；“迎接”自然表达先祖给予殉道者的尊荣接待，同时不过度渲染情感。这里的复数动词承接上文并列的先祖，单独截取本节时仍按汉语自然表达处理。
- source_word: οἱ πατέρες
  choice: 众位先祖
  rationale: 字面为“众父辈”，在此指受尊崇的族长和祖先；“众位先祖”比“众父亲”更符合现代汉语，也保留其祖辈身份与尊荣意味。
- source_word: ἐπαινέσουσιν
  choice: 都会称赞
  rationale: 直接表达赞扬、嘉许之意；“称赞”庄重而通俗。
- source_word: ἐνὶ ἑκάστῳ τῶν ἀποσπωμένων αὐτῶν ἀδελφῶν
  choice: 每当他们的一个兄弟被强行带走时
  rationale: 保留逐一发生的分配意味；ἀποσπάω含从群体中拉开、扯走之意，“被强行带走”既体现强制性，又避免加入原文未明说的具体动作。
- source_word: οἱ περιλειπόμενοι
  choice: 留下的人
  rationale: 指当时尚未被带走的兄弟；“留下的人”不暗示他们最终存活。
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: 不要使我们蒙羞
  rationale: καταισχύνω具有使人受辱、蒙羞之意；此译保留群体荣誉层面的劝勉。
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: 也不要对那些先我们而死的人失信
  rationale: ψεύσῃ在此可指以自己的退缩使先死者的见证落空，或对他们不忠。“对……失信”保留关系性和见证层面的张力，不直接解释为“背叛”。
theological_decisions:
- issue: 末后接待场景中“雅各”的身份
  choice: 保留为个人名“雅各”，即族长雅各
  alternative: 将“雅各”理解为以色列民族的集合称谓
  rationale: “雅各”与“众位先祖”并列，并承接上下文中的祖先人物，较自然地指族长雅各；译文不另加解释，以免超出原文。
- issue: “不要对先死的人失信”的含义
  choice: 保留对已死兄弟忠诚与使其见证不落空的双重可能
  alternative: 明确译作“不要背叛先死者的见证”
  rationale: 原文ψεύσῃ语义较宽，可涉及说假话、使之成为虚假或辜负；采用“失信”避免把隐含的见证观念写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众位先祖”体现敬意；直接引语保留兄弟间急切而克制的劝勉语气。所有脚注标记均置于其所说明的词句之后。
