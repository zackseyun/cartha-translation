lexical_decisions:
- source_word: ἀσκήσεως
  choice: 操练
  rationale: 指有纪律的实践或训练；“操练”既保留道德训练的意味，也避免过早引入后世技术性的禁欲主义概念。
- source_word: ἐν νόμῳ θεοῦ
  choice: 遵行上帝律法的
  rationale: 介词短语表明这种操练处于上帝律法的范围和规范之中；结合汉语表达译作“遵行上帝律法的”，自然地传达实践与顺服之意。
- source_word: φιλαδελφίας
  choice: 弟兄之爱
  rationale: 特指兄弟手足之间的亲爱，保留叙事中男性兄弟的具体关系。
- source_word: καθεστηκυίας
  choice: 已这样确立
  rationale: 完成时分词强调已经形成并持续存在的稳固状态；“已……确立”保留其结果性。
- source_word: συμπαθούσης
  choice: 并且同感共情
  rationale: 表达共同感受、彼此体恤；将其作为与“弟兄之爱”相关的补充描述，避免把它不自然地附着于“确立”。
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: 七兄弟
  rationale: 原文明确为阳性复数，并指叙事中的七位男性手足。
- source_word: συνπα-
  choice: 一同——
  rationale: 所给希腊文本在复合词中间截断，只能确定 συν- 所表达的“共同、一同”意义；不擅自补足具体动作，以破折号标示残缺。
theological_decisions:
- issue: 手足称谓的性别信息
  choice: 七兄弟
  alternative: 七位手足
  rationale: 希腊文明确使用阳性“兄弟”，且叙事对象是七位男性，因此保留原文性别信息。
- issue: 残缺词尾的处理
  choice: 仅译出可确定的“一同”，并以破折号标示中断
  alternative: 依据其他版本重构完整动词，或推测为“一同受苦／联合起来”
  rationale: 所提供的见证止于 συνπα-，不能仅凭现有文本确定完整词形及动作；如此处理可避免把推测写入正文，并诚实呈现文本状态。
translation_notes:
