  yaml_path: translation/deuterocanon/4_maccabees/013/002.yaml
  text: For just as those enslaved to their passions ate delicacies—for we said that they had been conquered by these things—[a]
translation:
  language: zh_hans
  text: 因为正如那些被欲望奴役的人享用精美食物——我们说过，他们已经被这些所征服——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享用精美食物”所译的希腊语动词十分罕见，也可译作“吃奢华精美的食物”或“过着讲究饮食的生活”，带有精致或奢华饮食的意味。原文“这些”在语法上指向较宽泛；在上下文中可能回指前述的欲望。
    reason: 说明罕见动词的语义范围，并保留原文代词指向的语法歧义。
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为，正如
  rationale: 同时保留γάρ的解释作用和ὥσπερ所引出的比较关系；本节句法延续到下文，故保留未完的比较结构。
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: 沦为欲望奴隶的人
  rationale: πάθη在《马加比四书》的伦理哲学语境中指与理性相抗的欲望或情欲；“沦为……奴隶”保留δουλόω鲜明的奴役意象，并自然表达分词的被动意义。
- source_word: ἡμεροφάγησαν
  choice: 贪食珍馐美味
  rationale: 这一罕见动词表示精细、奢华而放纵的饮食；此译既保留进食含义，也传达享用精美食物的纵欲色彩。
- source_word: ἐλέγομεν γὰρ
  choice: 我们曾说
  rationale: 以“曾说”自然呈现未完成过去时在此对先前论述的回指；插入语的解释作用由破折号和语序体现。
- source_word: τούτοις νενικῆσθαι
  choice: 已经被这些欲望制伏了
  rationale: “已经……制伏”体现νικάω完成时不定式所表达的既成败局及持续状态；将τούτοις明确回指前述欲望，避免汉语中“这些”指向珍馐而造成歧义。
theological_decisions:
- issue: πάθη的伦理心理含义
  choice: 欲望
  alternative: 情欲；激情；苦楚
  rationale: 本书持续讨论理性对πάθη的治理，因此这里不是外在苦难。“欲望”是现代汉语中自然且不过度技术化的表达，同时不引入后世特定神学体系。
- issue: δουλωθέντες的奴役意象
  choice: 沦为欲望奴隶
  alternative: 受欲望支配；屈从于欲望
  rationale: 上下文以支配、征服为核心意象，直译奴役关系可保留原文力度；“沦为”也准确呈现被动状态。
- issue: τούτοις的指代
  choice: 这些欲望
  alternative: 这些事物；它们
  rationale: 希腊语形式本身可回指复数概念，但汉语若直译“这些”，可能误指紧邻的珍馐美味。依论证逻辑明确为欲望，同时以脚注说明原文形式，避免把解释伪装成无歧义直译。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。破折号标明解释性的插入语；句末保留未闭合的比较结构，以反映本节与下文相连，而不擅自补足主句。
