  text: For[a], having formed a sacred chorus of piety, they kept encouraging one another, saying,
translation:
  language: zh_hans
  text: 因为他们结成一个神圣的敬虔歌队[a]，不断彼此鼓励，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬虔的神圣舞队”。希腊语“歌队”也可指载歌载舞的队伍；这里把礼仪性的群体意象与本书的核心德目“敬虔”结合起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: 神圣
  rationale: 保留该词与敬拜、圣所相关的礼仪色彩；在现代汉语中比“奉献为圣的”更自然。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 本书以此词指向神忠贞敬奉的核心德行；“敬虔”既明确其宗教意义，也保留德性内涵。
- source_word: στήσαντες
  choice: 组成了
  rationale: 与χορὸν连用时表示组织、构成一个歌队，而非字面“竖立”。
- source_word: χορὸν
  choice: 歌队
  rationale: 保留希腊语中合声群体及礼仪性的意象，同时避免现代“合唱团”可能带来的制度化联想；该词也可包含舞队意味，故加注说明。
- source_word: παρεθάρσυνον
  choice: 不断……鼓励
  rationale: 用“不斷”体现未完成过去时所表达的持续或反复动作。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 自然、庄重地表达相互作用。
- source_word: λέγοντες
  choice: 说
  rationale: 简洁承接下文直接引语，符合汉语叙事习惯。
theological_decisions:
- issue: 殉道语境中εὐσέβεια的译法
  choice: 敬虔
  alternative: 虔诚；敬神
  rationale: “敬虔”保留对神忠贞敬奉与道德实践相结合的含义，又不把该词缩减为主观情感或预先限定为某一宗派的技术概念。
- issue: ἱερὸν χορὸν的礼仪性比喻
  choice: 神圣歌队
  alternative: 圣洁的歌队；神圣的舞队
  rationale: 原文把众弟兄描绘成一个具有礼仪色彩的χορός；正文保留意象，不将其解释性改写为普通的“群体”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”承接前文论证；以“不断彼此鼓励”体现持续动作。保留“神圣歌队”这一较不寻常的比喻，并用脚注说明希腊词的语义范围。
