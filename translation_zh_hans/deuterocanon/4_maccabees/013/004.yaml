  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
translation:
  language: zh_hans
  text: 理性的支配作用[a]不容忽视，因为他们胜过了激情和痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理性”或译“心智”。希腊词可指心思、心智或理解力；本节着重于理性判断对激情的支配。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: 是不容忽视的
  rationale: 将非人称结构与不定式合并为自然、庄重的现代汉语，表达“不能视而不见”，而非单纯的不存在。
- source_word: ἡγεμονίαν
  choice: 统治力
  rationale: 既保留“领导、支配、统治”的含义，又明确这里所指的是理性支配激情的能力。
- source_word: τῆς διανοίας
  choice: 理性的
  rationale: 本书语境强调理性判断对激情的支配；“理性”比宽泛的“心思”更切合此处，但以脚注保留词义范围。
- source_word: ἐπεκράτησαν
  choice: 他们胜过了
  rationale: 准确表达“占上风、胜过”的意思，并自然支配后面的两类对象。
- source_word: πάθους
  choice: 激情
  rationale: 此处指会扰动、支配人的情感冲动，而非一般的“受苦”；单数可作集合意义理解。
- source_word: πόνων
  choice: 痛苦
  rationale: 指他们在酷刑中承受的身体疼痛；“痛苦”在现代汉语中自然，同时不过度具体化为“酷刑”。
- source_word: καὶ πάθους καὶ πόνων
  choice: 激情和痛苦
  rationale: 保留两个并列领域：内在的激情与外在的痛苦；汉语无需机械重复“既……又……”，仍能清楚呈现并列。
theological_decisions:
- issue: διάνοια在本书关于理性支配激情的论证中应如何表达
  choice: 理性
  alternative: 心思；心智；悟性
  rationale: “理性”凸显伦理哲学语境中的判断与治理功能，同时不引入后世宗派性的人论体系；脚注说明“心智”也是可能译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“理性的统治力”比“理性的统治”更清楚地表达抽象名词ἡγεμονία所指的支配能力；句式保持原文先下判断、后说明依据的论证结构。
