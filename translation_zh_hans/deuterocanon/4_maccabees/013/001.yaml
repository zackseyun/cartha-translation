base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: zh_hans
  text: 所以，七兄弟既然连至死的痛苦也不放在眼里[a]，各方面都一致承认：敬神的理性[b]完全支配各种情欲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“藐视那至死的苦难”或“把至死的痛苦看得很轻”。
    reason: lexical_alternative
  - marker: b
    text: “敬神的理性”也可译作“敬虔的理性”或“虔敬的理性”。这是《马加比四书》的核心用语，指受敬畏上帝之心塑造的理性判断。
    reason: lexical_alternative
  - marker: c
    text: 这里的“情欲”指本书伦理哲学论述中需要受治理的欲念、冲动或激情，并非泛指一切感情。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: 所以
  rationale: 这一组合承接上文并引出推论；“所以”自然、简洁地表达其推论语气。
- source_word: τῶν μέχρι θανάτου πόνων
  choice: 直至死亡的痛苦
  rationale: πόνοι指痛苦或苦难，μέχρι θανάτου表示其程度一直达到死亡；此译保留原文的简练与极端程度。
- source_word: ὑπερεφρόνησαν
  choice: 不放在眼里
  rationale: 该动词表示认为某事不足介意、轻看或蔑视；此译保留轻蔑之意，同时符合现代汉语表达。
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: 七兄弟
  rationale: ἀδελφοί在叙事中明确指同一家庭的七名男性兄弟；“七兄弟”准确而自然。
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: 各方面都一致承认
  rationale: 被动动词表达共同承认，ἀπανταχόθεν则有“从各方”的广泛意味；此译同时保留共识与范围。
- source_word: αὐτόδεσπότος
  choice: 本身就是……的主宰
  rationale: 这一罕见形容词含有凭自身掌权、拥有完全支配权之意；“本身就是……的主宰”兼顾αὐτο-的强调和δεσπότης的统辖含义。
- source_word: τῶν παθῶν
  choice: 各种情欲
  rationale: πάθη在本书的伦理哲学论述中指需要受治理的欲念、冲动或激情，而非泛指一切情感；“情欲”能体现其失序驱力的语境。
- source_word: ὁ εὐσεβὴς λογισμός
  choice: 敬神的理性
  rationale: λογισμός指理性的判断或思考，εὐσεβής表明这种理性受对上帝的敬虔所塑造；“敬神的理性”同时保留理性与宗教敬虔两个层面。
theological_decisions:
- issue: 如何翻译全书纲领性用语εὐσεβὴς λογισμός
  choice: 敬神的理性
  alternative: 敬虔的理性；虔敬的理性
  rationale: 本书所说的并非脱离信仰的纯粹理性，而是受敬神之心塑造的理性。“敬神的理性”清楚表达其指向上帝的敬虔性质，又不引入特定宗派解释。
- issue: 如何处理πάθη的伦理哲学含义
  choice: 各种情欲
  alternative: 激情；冲动；情感
  rationale: 此处讨论的是理性所治理的欲念和驱力，不是把所有情感一概视为负面；采用“情欲”并以脚注限定其语境，以保留原文的思想张力。
- issue: 如何表达αὐτόδεσπότος所含的自主统辖意味
  choice: 本身就是各种情欲的主宰
  alternative: 自主支配各种情欲；完全掌管各种情欲
  rationale: “本身就是……的主宰”保留该词所强调的内在、自主权威，同时不把原文扩展成关于人性或自由意志的系统教义断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不放在眼里”具有现代可读性，并准确传达轻看痛苦的意味；后半句以“本身就是……的主宰”保留哲学论断的力度及αὐτόδεσπότος的自主统辖色彩。
