  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: zh_hans
  text: 因为，灵魂的争战重大；为违背上帝诫命的人存留着在永恒刑罚中的危险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχῆς ἀγών
  choice: 灵魂的争战
  rationale: 保留属格结构及ἀγών所表达的激烈争斗、较量之意，不把它弱化为一般的“挣扎”。
- source_word: κίνδυνος
  choice: 危险
  rationale: 直译其风险、危难之义，并保留原文把“争战”与“危险”并列的修辞。
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: 那在永恒刑罚中的
  rationale: κείμενος修饰“危险”，基本义为“处于、在于”；此译保留危险与永恒刑罚之间略显凝练的原文关系，不进一步解释为“必定落入”或“预备着”。
- source_word: παραβαίνουσι τὴν ἐντολὴν τοῦ θεοῦ
  choice: 违背上帝诫命的人
  rationale: παραβαίνω译为“违背”，准确表达越过或违反规范；单数ἐντολή保留为“诫命”。
theological_decisions:
- issue: αἰωνίῳ βασάνῳ的持续性与性质
  choice: 永恒刑罚
  alternative: 永远的痛苦／永恒的折磨
  rationale: βασάνος在此为惩罚性苦刑或刑罚；“永恒刑罚”既保留αἰώνιος的时间力度，也避免额外界定受罚方式。
- issue: κείμενος与审判结果的关系
  choice: 在永恒刑罚中的危险
  alternative: 为违命者存留在永恒刑罚中的危险
  rationale: 原文说明危险与永恒刑罚相关并临到违命者，但没有在本句中展开其实现方式；因此不增添“必然”“死后”等解释。
translation_notes:
  register: 采用庄重而现代的书面普通话。“因为”承接上文论证；分号呈现两个并列且紧密相连的判断。保留原文较凝练的“危险在永恒刑罚中”表达，以免过度释义。
