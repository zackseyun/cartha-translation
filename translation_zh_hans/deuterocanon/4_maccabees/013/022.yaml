base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/022.yaml
  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: zh_hans
  text: 彼此相爱的兄弟心灵喜爱拥抱[a]；它们又因共同生活[b]、日常相处和其他的教养[c]而越发强烈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“爱弟兄的心灵，喜爱拥抱。”希腊语表达十分紧凑，“爱弟兄的”与“心灵”之间的关系可有略微不同的理解。
    reason: lexical_alternative
  - marker: b
    text: “共同生活”也可译作“彼此相伴”或“一同被抚养长大”。
    reason: lexical_alternative
  - marker: c
    text: “其他的教养”也可译作“其余的教育”或“其他训练”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: 在彼此拥抱中
  rationale: 该词指用双臂环抱；希腊语表达紧凑，译文保留拥抱这一具体形象，并以“彼此”点明兄弟间的相互动作。
- source_word: φιλάδελφοι ψυχαί
  choice: 兄弟的心灵……充满亲爱
  rationale: φιλάδελφοι 可指爱兄弟的、具有手足之爱的；ψυχαί 在此侧重内在生命与情感。此译既保留“心灵”的庄重语体，也符合上下文中七兄弟的男性身份。
- source_word: αὔξονται σφοδρότερον
  choice: 彼此的情谊越发深厚
  rationale: 原文直指增强、增长且程度更为强烈。汉语若直说“心灵更强烈地增长”不自然，因此明示语境中的兄弟情谊，同时保留递增的力度。
- source_word: διὰ συντροφίας
  choice: 因一同成长
  rationale: συντροφία 可指共同生活、相伴，也可含一同被抚养长大的意味；家庭语境中“一同成长”兼顾共同生活与共同养育。
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: 每日亲密相处
  rationale: 该短语表示日复一日、习以为常的密切交往；此译自然地表达持续的日常亲近。
- source_word: τῆς ἄλλης παιδίας
  choice: 其他方面的教养
  rationale: παιδία 可涵盖教养、教育或训练；“教养”在家庭语境中保留其广泛的塑造含义，而不局限于学校教育。
theological_decisions:
- issue: 七兄弟叙事中的性别化亲属称谓
  choice: 兄弟
  alternative: 手足
  rationale: 本节具体谈论七位男性兄弟，故采用“兄弟”准确保留叙事所指，不将其抽象化为性别中性的称谓。
- issue: ψυχαί 的人论色彩
  choice: 心灵
  alternative: 人；生命；内心
  rationale: “心灵”既保留 ψυχαί 的内在生命与情感分量，也避免在本处把它限定为某一套后期神学意义上的“灵魂”观。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心灵”“亲爱”“情谊”维持原文较高的修辞格调；主句适度补出汉语所需的述语，后半句以“彼此的情谊”承接原文隐含的兄弟之爱，使句意自然，同时不消除原文在修饰关系和 παιδία 词义上的开放性。
