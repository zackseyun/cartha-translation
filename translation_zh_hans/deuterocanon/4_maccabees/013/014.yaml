  text: Let us not fear the one who seems to kill[a].
translation:
  language: zh_hans
  text: 我们不要惧怕那看似能杀人的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那看来会杀人的人”，或“那被认为能杀人的人”。希腊文着重表达其杀人能力只是表面看来如此。
    reason: 说明δοκοῦντα的词义范围，并保留“看来”与“被认为”之间的歧义。
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: 我们不要惧怕
  rationale: μή加第一人称复数虚拟式构成劝勉，译为“我们不要惧怕”，既保留共同劝勉的语气，也符合现代汉语表达。
- source_word: τὸν δοκοῦντα
  choice: 那看似能……的人
  rationale: δοκέω在此主要表示“看来、似乎”。“看似能”保留其表象与实情之间的张力，同时避免把经文明确解释成意图或名声。
- source_word: ἀποκτενεῖν
  choice: 杀人
  rationale: 该不定式说明此人看似具有的行为能力。“杀人”直接自然；其中宾语可由泛指表达承载，不必增添原文没有的特定对象。
theological_decisions:
- issue: τὸν δοκοῦντα ἀποκτενεῖν中表面权力与实际权力的张力
  choice: 译作“那看似能杀人的人”
  alternative: 那看来要杀人的人；那被认为能杀人的人
  rationale: δοκοῦντα的通常含义是“看来、似乎”，上下文可暗示迫害者的权力有限，但正文不进一步说明其只能杀害身体，以免加入原文未明说的神学解释。脚注保留其他合乎语法的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惧怕”比“害怕”略显庄重，适合殉道劝勉语境；句式简洁，保留原文的共同劝勉语气及其神学张力。
