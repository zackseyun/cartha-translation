revisions:
- from: 然而，尽管天性、习惯和美德所形成的品格，使他们的兄弟亲情紧紧相连[a]，那些还留下的人也同样因着敬虔忍受住了；他们眼看自己那些令人怜悯的兄弟受折磨，直到死去[b]。
  to: 然而，尽管天性、习惯和合乎美德的品格使他们的兄弟之情紧密相连[a]，那些留下来的人仍因着敬虔而坚忍，眼看自己那些受人怜悯的兄弟遭受酷刑，直到死去[b]。
  rationale: 修订以“合乎美德的品格”准确表达 ἠθῶν 与 ἀρετῆς 的关系，以“遭受酷刑”保留 βασανίζω 的刑罚强度，并以“坚忍”自然表达 ἀνέσχοντο。保留让步结构、兄弟关系、敬虔主题词，以及 κατοικτιζομένους 的被动“受人怜悯”意义；脚注说明原文压缩的分词结构而不消除其修饰上的紧凑性。
