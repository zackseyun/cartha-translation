base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: zh_hans
  text: 然而，尽管天性、习惯和合乎美德的品格使他们的兄弟之情紧密相连[a]，那些留下来的人仍因着敬虔而坚忍，眼看自己那些受人怜悯的兄弟遭受酷刑，直到死去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟之情”也可译作“兄弟之爱的纽带”。原词在这里指使兄弟彼此依恋、联结的感情。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“那些留下来的人因着敬虔而坚忍，看见自己的兄弟——他们正受人怜悯，并遭受酷刑直到死亡。”希腊文在这里连续使用几个分词，句式十分紧缩。
    reason: compressed_syntax
lexical_decisions:
- source_word: φίλτρα
  choice: 亲情
  rationale: 此处不是字面的“魅力”或“魔力”，而是兄弟之间出于血缘和共同生活的深厚感情；“兄弟亲情”在现代汉语中自然，并保留情感力度。
- source_word: συναξόντων
  choice: 使……紧紧相连
  rationale: 该分词表示天性、习惯和美德品格共同产生凝聚作用；此译传达持续而强烈的联结，同时不把它具体化为某种制度性的纽带。
- source_word: συνηθείας
  choice: 习惯
  rationale: 该词可指习惯、熟悉相处或惯常关系；“习惯”简洁地保留其与长期共同生活有关的含义。
- source_word: τῶν τῆς ἀρετῆς ἠθῶν
  choice: 美德所形成的品格
  rationale: ἤθη在这里指与美德相称的性情或品格。“所形成的”使汉语关系清楚，但不把美德解释为特定宗教德目。
- source_word: ἀνέσχοντο
  choice: 忍受住了
  rationale: 动词表示在巨大情感压力下承受、坚持；“忍受住了”既保留坚忍意味，也避免补出原文没有明说的宾语。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 在《马加比四书》中，该词是关键伦理—神学用语，指对上帝及其律法的虔敬忠诚；“敬虔”比一般的“虔诚”更能保持这一主题用词。
- source_word: οἱ ὑπολελειμμένοι
  choice: 那些还留下的人
  rationale: 指当时尚未被处死的兄弟；避免译作“幸存者”，因为后者容易暗示他们最终逃过死亡。
- source_word: κατοικτιζομένους
  choice: 令人怜悯的
  rationale: 保留被动分词所表达的“受到怜悯、引人哀怜”之意，并让它在汉语中自然地修饰受刑的兄弟。
- source_word: μέχρι θανάτου βασανιζομένους
  choice: 受折磨，直到死去
  rationale: 直陈折磨一直持续到死亡，较“被折磨致死”更贴近 μέχρι θανάτου 的时限表达。
- source_word: ἀδελφούς / ἀδελφότητος
  choice: 兄弟 / 兄弟亲情
  rationale: 上下文明确说的是兄弟群体，保留原文的性别与亲属称谓，不泛化为“手足”或“亲人”。
theological_decisions:
- issue: 殉道语境中 εὐσέβεια 的译法
  choice: 敬虔
  alternative: 虔诚；对上帝的敬畏
  rationale: “敬虔”能稳定呈现本书把忍耐归因于对上帝及律法之虔敬的主题，又不额外引入后期宗派教义。
- issue: 兄弟亲情与敬虔之间的张力
  choice: 保留“尽管……也同样……”的让步结构
  alternative: 解释为他们压制了亲情；解释为亲情帮助他们忍耐
  rationale: 希腊文一方面强调天性、习惯和德性凝聚兄弟之爱，另一方面说留下的人因敬虔而忍耐。译文不擅自判定亲情究竟只是加重痛苦，还是也支持了坚忍。
- issue: κατοικτιζομένους 的承受者与语气
  choice: 自己那些令人怜悯的兄弟
  alternative: 自己那些被人怜悯的兄弟；可怜地受折磨的兄弟
  rationale: 该被动分词语义和句法都较压缩；正文保留其引发怜悯的意味，脚注说明原文结构，避免把它改解为兄弟自己在哀叹。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“敬虔”作为全书重要主题词，并以“那些还留下的人”避免“幸存者”的误导。正文适度理顺希腊文密集分词结构，脚注则保存其字面次序和 κατοικτιζομένους 的歧义。
