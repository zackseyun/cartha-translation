base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: zh_hans
  text: 以撒因敬虔而坚忍[a]。他们每一个人都彼此相望；众人神色明朗，极其勇敢，一同说道：“让我们全心把自己献给上帝，就是那位赐给我们生命的[b]；也让我们用自己的身体守护律法[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”也可译作“虔敬”。希腊语εὐσέβεια指对上帝的尊崇以及由此而来的忠贞行为。
    reason: lexical_alternative
  - marker: b
    text: “生命”也可译作“灵魂”。希腊语ψυχή可指“生命”或“灵魂”；这里较可能指上帝所赐的生命。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“用自己的身体来守卫律法”。原文保留了警醒看守的意象，不只是一般意义上的“遵守”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  choice: 因敬虔
  rationale: εὐσέβεια指向对上帝的尊崇与由此而来的忠贞行为；“敬虔”在现代汉语中庄重而清楚，并保留本书的核心德性用语。
- source_word: ὑπέμεινεν
  choice: 忍受了苦难
  rationale: ὑπομένω表示在考验中坚忍承受；汉语补出语境隐含的“苦难”，使句意完整，同时不具体限定受苦方式。
- source_word: ἐφορῶντες ... ἀλλήλους
  choice: 彼此注视
  rationale: 保留相互观看的动作，也自然传达兄弟们互相激励的场景。
- source_word: φαιδροὶ
  choice: 神色明朗
  rationale: φαιδρός可指面容光明、精神振奋；“神色明朗”比“欢快”更适合殉道场景，也保留其外在神态。
- source_word: μάλα θαρραλέοι
  choice: 极其勇敢
  rationale: “极其”体现μάλα的加强作用，“勇敢”准确表达θαрραλέοι在危难中的胆量。
- source_word: ἀφιερώσωμεν ... ἑαυτούς
  choice: 让我们……把自己献给
  rationale: “献给”自然表达分别归属、奉献之意，语体庄重但不过分教会化。
- source_word: τῷ δόντι τὰς ψυχάς
  choice: 那位赐给我们生命的
  rationale: ψυχή既可指“灵魂”，也可指“生命”；在甘愿殉道的语境中，“生命”较自然，并避免加入原文未明确要求的灵魂论含义。
- source_word: χρήσωμεν ... τὰ σώματα
  choice: 让我们用自己的身体
  rationale: χράομαι在这里是“使用、运用”；“自己的”明确身体属于发言者，符合反身劝勉。
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: 守护律法
  rationale: φυλακή含守卫、看守的意象；“守护”保留该比喻，不将其简化为一般的“遵守”。
theological_decisions:
- issue: εὐσέβεια作为《马加比四书》的核心德性术语
  choice: 敬虔
  alternative: 虔敬、虔诚
  rationale: “敬虔”既指对上帝的尊崇，也能涵盖由此产生的忠贞实践，不把该词缩减为礼仪虔诚。
- issue: ψυχάς在“赐予ψυχάς者”中的意义
  choice: 生命
  alternative: 灵魂
  rationale: 上下文强调上帝所赐、殉道者愿意交出的生命；译作“生命”符合语境，同时以脚注保留“灵魂”的词义可能。
- issue: φυλακή与律法的关系
  choice: 守护律法
  alternative: 遵守律法
  rationale: 原文使用警醒守卫的意象；译文保留这一张力，不以较抽象的“遵守”取代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神色明朗”避免把殉道者的状态轻率地说成日常的快乐；分号梳理希腊语较密集的分词结构。“上帝”遵循现代标准称谓；引语采用共同劝勉的语气。
