base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: zh_hans
  text: 既然连烈火所带来的痛苦也未能使他们动摇，我们怎能不承认，在这些人身上有健全理性制伏情欲的力量[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “健全理性制伏情欲的力量”所译的希腊语短语罕见，意思不易确定；也可理解为“良善思虑胜过痛苦的力量”。这里译作“情欲”的词在伦理语境中可指人的情感或冲动；在本节的酷刑语境中，也可能兼有“痛苦”的意思。
    reason: 保留εὐλογιστία与παθοκρατία的词义不确定性，以及πάθος在伦理意义与当前受苦语境之间的张力。
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: 我们怎能不承认……呢
  rationale: 按希腊语修辞问句的实际语力翻译，表达这一事实不能不被承认，而非生硬地译作“怎么不可能承认”。
- source_word: τούτοις
  choice: 在这些人身上
  rationale: 与ὁμολογεῖν连用时，指承认某种品质彰显于这些人；此译自然保留与格的关系。
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: 健全理性制伏情欲的力量
  rationale: εὐλογιστία是罕见词，在本书崇尚理性驾驭情感的论述中，宜理解为健全、良善的思虑或理性；παθοκρατία指对πάθη的统制，而πάθη既可指情欲、情感，也可在此处因酷刑语境而涉及痛苦。正文采用符合全书思想脉络的“制伏情欲”，并以脚注保留词义张力。
- source_word: οἱ ... οὐκ ἐπεστράφησαν
  choice: 未能使他们偏离初衷
  rationale: ἐπεστράφησαν在这里表示受压力而被扭转方向或动摇立场；结合中文表达，将被动结构自然译出，同时保留坚守初衷之意。
- source_word: τῶν μὲν διὰ πυρὸς ἀλγηδόνων
  choice: 烈火带来的痛苦都
  rationale: ἀλγηδόνες指痛苦、剧痛，διὰ πυρός表示火是造成痛苦的途径或手段；“烈火带来的痛苦”准确且自然。“都”传达μέν在上下文中加强论证的语气。
theological_decisions:
- issue: τῆς εὐλογιστίας παθοκρατία中理性、虔敬与蒙福含义的关系
  choice: 健全理性制伏情欲的力量
  alternative: 虔敬所赋予的制胜痛苦之力／福善所具有的情欲统制力
  rationale: εὐλογιστία从构词和《马加比四书》以理性统御情感的核心论证看，首先指良好、健全的思虑；不宜仅据英语咨询层将其确定为“蒙福”或“虔敬”。不过该词罕见，且全书中的理性具有敬神伦理取向，因此脚注保留其他可能色彩，不将其收窄为某一教派性的教义概念。
- issue: παθοκρατία所统制的是“情欲”还是“痛苦”
  choice: 正文译“制伏情欲”，脚注说明也可理解为“胜过痛苦”
  alternative: 制胜痛苦的力量
  rationale: πάθος及其复数在希腊伦理语境中常指情感、欲念或激情，而本节紧接烈火之痛，也使“痛苦”义格外突出。正文依全书反复出现的理性统御情感主题，脚注则保留当前语境造成的双重含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。修辞问句保留原文论证力度；“偏离初衷”比“回转”更清楚地表达受酷刑逼迫而改变立场。脚注标记[a]已在正文相应短语后出现。
