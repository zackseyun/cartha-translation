lexical_decisions:
- source_word: ἐν ᾗ
  choice: 在其中
  rationale: 保留阴性单数关系代词与上文先行词的关联；因所给片段没有先行词，不进一步具体化。
- source_word: ἀδελφοὶ
  choice: 弟兄们
  rationale: 希腊文为阳性复数，语境指有血缘关系的男性兄弟；“弟兄们”既准确又符合庄重叙事语体。
- source_word: τὸν ἴσον ... χρόνον κατοικήσαντες
  choice: 生活了同样长的时间
  rationale: 表达居住、生活的持续时间相等，既保留原文含义，也符合现代汉语习惯。
- source_word: ἐν τῷ αὐτῷ χρόνῳ πλασθέντες
  choice: 在同一段时间内成形
  rationale: πλάσσω表示塑造、使成形；采用“成形”保留可能涉及胎中形成的具体意味。“同一段时间内”避免武断地断定为同一时刻，同时保留原文时间关系。
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος αὐξηθέντες
  choice: 由同一血脉成长
  rationale: 保留共同血缘的具体意象，并以“成长”表达αὐξάνω所指的发展、长大。
- source_word: καὶ διὰ τῆς αὐτῆς
  choice: 又借着同一……
  rationale: 原文见证在阴性属格形容词之后中断，译文保留未完成结构，不补入所缺名词。
