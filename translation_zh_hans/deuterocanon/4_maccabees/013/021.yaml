  text: having been brought to full maturity in soul[a], and having been brought forth through equal periods of time, and drinking milk from the same springs, from which they are nourished[b],
translation:
  language: zh_hans
  text: 他们在心灵上成熟[a]，又经过同样长的时日被生下来，并从同样的乳泉喝奶；他们由此一同被养育[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵”也可译作“生命”；希腊文指他们在这一方面达到成熟。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们由此一同得到滋养”或“由此一同长大”。
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  choice: 在生命上被养育成熟
  rationale: ψυχῆς可表示生命或心灵，作为所涉及的方面修饰τελεσφορηθέντες；后者意为被带到成熟、完成。结合全句由孕育、出生、哺乳到成长的语境，“在生命上被养育成熟”保留被动发展过程，也不把它神学化为“得以完全”。
- source_word: διὰ τῶν ἴσων ... χρόνων
  choice: 经过同样长的时日
  rationale: 表达这些兄弟各自经历相等长度的孕育时日；现代汉语用“同样长”比直译“相等的时期”自然。
- source_word: ἀποτεχθέντες
  choice: 被生下来
  rationale: 该被动分词指从母腹被产下；此译保留被动语态以及上下文鲜明的母体意象。
- source_word: γαλακτοποτοῦντες
  choice: 饮奶
  rationale: 复合动词本义为喝奶；与随后的πηγῶν结合译出“从……乳泉饮奶”。
- source_word: πηγῶν
  choice: 乳泉
  rationale: πηγή直指泉、泉源；“乳泉”保留希腊文以泉源暗喻母体供乳之处的生动意象，而不擅自明说乳房。
- source_word: ἀφʼ οὗ
  choice: 从那里
  rationale: 照就近语境回指同一乳源；以处所表达在中文中自然，并避免硬性判定其语法数与先行词形式间的细微不协调。
- source_word: συντρέφονται
  choice: 一同长大
  rationale: συντρέφω兼有共同受滋养与一同被养育之意；“一同长大”保留συν-的共同含义，并适合兄弟共同成长的上下文。
