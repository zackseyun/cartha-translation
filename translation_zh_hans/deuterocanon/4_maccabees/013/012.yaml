  yaml_path: translation/deuterocanon/4_maccabees/013/012.yaml
  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
translation:
  language: zh_hans
  text: 他却一再说：“你们要记得自己从何而来[a]，或记得自己将由哪一位父亲之手被宰杀[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从何而来”也可译作“来自哪里”。πόθεν通常指来源地，但在这里也可能侧重家世或血统。
    reason: 保留πόθεν在地理来源与家族出身之间的词义空间。
  - marker: b
    text: 原文直译近于“或（记得）由哪一位／谁的父亲之手被宰杀”。ἢ通常意为“或”；τίνος πατρὸς的具体指向及简略句法并不完全明确。
    reason: 保留ἢ的选择式连接，并说明τίνος πατρὸς及省略结构所留下的歧义。
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: 他却一再说
  rationale: 未完成时ἔλεγεν表示持续或反复说话；δέ在此标示话语转折，译作“却”。
- source_word: Μνήσθητε
  choice: 你们要记得
  rationale: 复数不定过去时命令式发出直接劝告；“要记得”自然且保留命令语气。
- source_word: πόθεν ἐστέ
  choice: 自己从何而来
  rationale: πόθεν本可指地理上的“从哪里”，但在父系身份的上下文中也可指家世或出身；正文采用能兼顾二者的汉语表达。
- source_word: ἢ
  choice: 又
  rationale: 希腊文通常意为“或”，但此处连接两个要求记住的内容；汉语用“又”较自然。原文连接词的形式在脚注中说明，以免掩盖其歧义。
- source_word: τίνος πατρὸς χειρὶ
  choice: 被怎样的一位父亲亲手
  rationale: τίνος可询问身份或性质；译作“怎样的一位”保留修辞意味。χειρί既表示施事，也保留“手”的鲜明意象，故译作“亲手”。
- source_word: σφαγιασθῆναι
  choice: 宰杀
  rationale: 该动词指暴力宰杀，并可带献祭色彩；“宰杀”保留其强烈程度而不额外断定献祭神学。
theological_decisions:
- issue: πόθεν ἐστέ所指的是地点还是家世
  choice: 正文译作“从何而来”，让地点来源与家世出身两层含义保持开放。
  alternative: 明确译作“出自谁的家系”。
  rationale: 上下文倾向家世身份，但πόθεν本身首先是“从哪里、从何处”；不宜在正文中完全排除地点含义。
- issue: τίνος πατρὸς的修辞指向
  choice: 译作“怎样的一位父亲”，保留对父亲身份或品格的追问。
  alternative: 译作“哪一位父亲”或“谁的父亲”。
  rationale: τίνος在此既可能询问所属或身份，也可能带有“何等”的性质意味；正文避免把它过度限定为单纯所有关系。
- issue: σφαγιασθῆναι是否明确含献祭意义
  choice: 译作“宰杀”，保留暴力及可能的祭牲联想。
  alternative: 译作“献为祭牲”或较弱的“杀死”。
  rationale: 原词可以用于献祭性的宰杀，但本短句没有充分明说祭礼；不应在正文中将可能含义提升为确定解释。
translation_notes:
  register: 采用庄重而现代的叙事语言。“一再说”体现未完成时体；“亲手宰杀”保留原文的手部意象和强烈暴力色彩。因所给希腊文本句法较为简略，正文作最低限度补足，并以脚注呈现可直译形式及歧义。
