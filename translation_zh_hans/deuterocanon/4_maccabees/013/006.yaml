  yaml_path: translation/deuterocanon/4_maccabees/013/006.yaml
  text: For just as towers on harbor breakwaters[a], beating back the threats of the waves, provide a calm harbor for those sailing in,
translation:
  language: zh_hans
  text: 因为正如港口防波堤上的塔楼挡住海浪的威胁，为驶入港口的人提供一处平静的港湾；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 正如
  rationale: 承接上文并引出解释性的比喻；现代汉语中“正如”自然保留比较关系，连接作用由上下文体现。
- source_word: προβλῆτες λιμένων πύργοι
  choice: 港口防波堤上的塔楼
  rationale: προβλῆτες指向外伸展、抵御海浪的港口构筑物，在此以“防波堤”表达；πύργοι直译为“塔楼”，保留具体意象。
- source_word: τὰς κυμάτων ἀπειλάς
  choice: 海浪的威胁
  rationale: 保留ἀπειλάς“威胁”的拟人化表达，不将其弱化为单纯的冲击。
- source_word: ἀνακόπτοντες
  choice: 挡住
  rationale: 该分词表示制止、击退；“挡住”简洁自然，也表现防波堤塔楼抵御海浪的作用。
- source_word: γαληνὸν παρέχουσιν
  choice: 提供一处平静的
  rationale: γαληνόν修饰τὸν ὅρμον，指海面安静、无风浪；汉语以“提供一处平静的港湾”自然表达。
- source_word: τοῖς εἰσπλέουσιν
  choice: 为驶入的人
  rationale: 保留乘船驶入港湾的动态含义，同时避免额外补入原文未明说的身份。
- source_word: τὸν ὅρμον
  choice: 港湾
  rationale: ὅρμος可指港口、锚地或避风港；“港湾”既保留航海场景，也强调受庇护、平静的水域。
