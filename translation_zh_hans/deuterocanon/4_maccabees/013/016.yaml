  yaml_path: translation/deuterocanon/4_maccabees/013/016.yaml
  text: Therefore, let us arm ourselves with the mastery over passions that comes from godly reason.
translation:
  language: zh_hans
  text: 所以，让我们用敬神的理性所带来的制伏情欲之力武装自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们以敬神理性制伏情欲的力量武装自己。”
    reason: 原文属格既可理解为制伏情欲之力来自敬神的理性，也可理解为这种力量属于或由敬神的理性施行。
lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: 让我们……武装自己
  rationale: 第一人称复数劝勉虚拟式，保留道德争战中的军事比喻；现代汉语自然可懂。
- source_word: τοιγαροῦν
  choice: 所以
  rationale: 表示由上文推出结论；“所以”简洁自然，同时保留劝勉语气。
- source_word: τῇ ... παθοκρατίᾳ
  choice: 用……制伏情欲之力
  rationale: 与格表示用来武装自己的手段；παθοκρατία指对情欲的管治、胜过或制伏，不只是压抑。“制伏情欲之力”既保留复合词的支配含义，也适合中文句法。
- source_word: τοῦ θείου λογισμοῦ
  choice: 敬神的理性所带来的
  rationale: 属格可表达这种制伏之力的来源，也可理解为所属关系。正文采用来源性表达以求自然，脚注保留较贴近形式的另一种理解。
- source_word: θείου
  choice: 敬神的
  rationale: 在本书犹太伦理劝勉语境中，指向与神相称、受敬虔塑造的性质；避免“神圣的”可能引出的抽象或本体论联想。
- source_word: λογισμοῦ
  choice: 理性
  rationale: 本书核心伦理概念，指能作道德判断并管治情欲的理性；“理性”简洁且在现代汉语中清楚。
theological_decisions:
- issue: 犹太道德哲学语境中的 θεῖος λογισμός
  choice: 敬神的理性
  alternative: 神圣的理性
  rationale: “敬神的理性”突出理性的宗教伦理取向，不把该词组解释成抽象的神性理体，也不引入后期基督论含义。
- issue: τοῦ θείου λογισμοῦ 与 παθοκρατίᾳ 的关系
  choice: 将属格理解为来源：敬神的理性所带来的制伏之力
  alternative: 理解为所属或施事：敬神理性的制伏情欲之力
  rationale: 希腊语属格本身容许来源、所属或施事色彩。正文选取自然汉语中的来源表达，脚注明确保留另一种可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而通顺的劝勉语体。“武装自己”保留军事隐喻；“情欲”在此广指会影响行为的欲望与情感冲动，并非仅指性欲。
