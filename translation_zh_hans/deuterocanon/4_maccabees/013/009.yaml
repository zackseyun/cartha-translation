base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: zh_hans
  text: 弟兄们，让我们以弟兄之情为律法而死；让我们效法叙利亚境内的那三个青年[a]，他们藐视了那同等严酷的火炉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指《但以理书》第3章中的三个犹太青年。希腊文本此处写“在叙利亚”，本译文照原文保留，没有改成较为人熟知的“巴比伦”。
    reason: cross_reference
  - marker: b
    text: 译作“同等严酷”的希腊词十分罕见，含义难以确定。它可能表示这火炉的严酷程度可与那三个青年所面对的考验相比；原文的比较关系并不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: 像弟兄一样
  rationale: 该副词修饰“死”，强调亲兄弟在受死之事上的团结；与随后作为呼语的“弟兄们”形成原文刻意的重复。
- source_word: ἀποθάνωμεν
  choice: 让我们……而死
  rationale: 不定过去时虚拟语气在此用于劝勉，以“让我们”传达共同立志的语气。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 叙事中的受话者是实际的男性亲兄弟，因此采用符合性别和亲属关系的称呼。
- source_word: περὶ τοῦ νόμου
  choice: 为律法
  rationale: περί加属格在此表示缘故或所维护的对象；简洁表达他们因忠于律法而甘愿受死。
- source_word: μιμησώμεθα
  choice: 让我们效法
  rationale: 保留劝勉虚拟语气及“模仿榜样”的直接含义。
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: 叙利亚境内的那三个青年
  rationale: 依照希腊文本保留“叙利亚”，不按《但以理书》的常见地理表述改成“巴比伦”；“青年”自然对应νεανίσκους。
- source_word: τῆς ἰσοπαίδος καμίνου
  choice: 那带来同等苦难的火炉
  rationale: ἰσοπαίδος罕见且语义不确定。正文以较自然的汉语保留“相等、相称”的概念，并把它理解为苦难程度的对应关系；脚注注明不确定性。
- source_word: κατεφρόνησαν
  choice: 藐视了
  rationale: 传达“轻看、不放在眼里”的强烈修辞力度，而非仅指不害怕。
theological_decisions:
- issue: 《但以理书》第3章典故与地理表述
  choice: 叙利亚境内的那三个青年
  alternative: 巴比伦的那三个青年
  rationale: 希腊原文明说ἐπὶ τῆς Συρίας，故不以较熟悉的《但以理书》地点协调或替换源文本；脚注交代其所指。
- issue: ἀδελφοί的性别与亲属含义
  choice: 弟兄们
  alternative: 手足们
  rationale: 说话者和受话者是实际的男性兄弟，译为“弟兄们”既准确又保留呼语语气。
- issue: ἰσοπαίδος所表达的比较关系
  choice: 带来同等苦难
  alternative: 与那三个青年所受的相称
  rationale: 该词极其罕见，比较对象并不完全明确；正文不明确指定同谁相比，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄们……像弟兄一样”保留希腊文的强调性重复；分号维持两项共同劝勉的紧密结构。“藐视”保留原文面对酷刑而轻看的强烈语气。
