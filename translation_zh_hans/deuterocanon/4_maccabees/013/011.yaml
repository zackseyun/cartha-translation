  text: And one said[a], “Take courage, brother,” while another said, “Endure nobly.”
translation:
  language: zh_hans
  text: 一个说[a]：“弟兄，鼓起勇气！”另一个说：“要高尚地坚忍！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这一个说……那一个则说……”，表明兄弟中不同的人相继发言。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρρει
  choice: 鼓起勇气
  rationale: 这是表示鼓励、壮胆的命令式；“鼓起勇气”符合现代汉语习惯，也保留了劝勉的语气。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 阳性单数呼格，且上下文明确是兄弟之间的直接称呼；“弟兄”庄重自然。
- source_word: Εὐγενῶς
  choice: 高尚地
  rationale: 该副词表示以高贵、可敬的方式行事；“高尚地”保留其道德与荣誉色彩，不把意义缩减为单纯的勇敢。
- source_word: καρτέρησον
  choice: 忍耐到底
  rationale: 不定过去时命令式要求人在苦难中坚忍；“忍耐到底”以自然汉语传达坚定承受的劝勉，不额外引入教义解释。
- source_word: ὁ μέν ... ὁ δέ
  choice: 一个……另一个
  rationale: 这一关联结构对举两位说话者；译文不补出原文未明说的名词，同时自然呈现兄弟们相继发言。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成过去时可能带有持续或反复意味，但此处叙事重点是相继说出的劝勉；汉语用“说”最自然，也不排除其语境中的持续性。
