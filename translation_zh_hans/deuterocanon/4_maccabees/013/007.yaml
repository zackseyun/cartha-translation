base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: zh_hans
  text: 这样，少年们那七塔般的明智[a]，巩固了敬虔的港湾，战胜了情欲的放纵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七塔般的明智”原文比喻性很强，也可译作“少年们那有七座塔楼的高尚心志”；较为解释性的译法是“七位少年高尚而坚定的心志”。
    reason: 保留 ἑπτάπυργος 的“七塔”意象及罕见名词 εὐλογιστία 的词义和修辞歧义；“七塔”可能暗指七位弟兄。
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: 七塔般的
  rationale: 保留复合形容词“有七座塔的”这一鲜明堡垒意象，同时用现代汉语较自然的比喻结构表达；“七”也暗指七位弟兄。
- source_word: εὐλογιστία
  choice: 明智
  rationale: 此罕见名词与良好的思量、判断或高尚心志有关；“明智”既简明可懂，也符合本书关于理性克制情欲的论述。因其确切色彩不易确定，脚注保留“高尚心志”等可能。
- source_word: νεανίσκων
  choice: 少年们
  rationale: 指上下文中的七位年轻弟兄；“少年们”保留阳性群体及年轻之意，并符合庄重叙事语体。
- source_word: ὀχυρώσασα
  choice: 巩固了
  rationale: 表达使之坚固、防守严密的含义，并与“七塔”和“港湾”的防御意象相呼应；比直译“筑垒”更符合现代汉语。
- source_word: λιμένα
  choice: 港湾
  rationale: 准确传达港口、避风港之义，也保留安全庇护的形象。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 在《马加比四书》中指向对上帝的敬畏与忠诚；“敬虔”保留其神学维度，且不局限于外在宗教礼仪。
- source_word: παθῶν
  choice: 情欲
  rationale: 在本书哲学伦理语境中，πάθη指需要受理性约束的欲望与情感冲动，而非“苦难”；“情欲”在此取广义，脚注说明其范围。
- source_word: ἀκολασίαν
  choice: 放纵
  rationale: 指缺乏节制、任由欲望支配，并不专指性方面的淫乱；“放纵”比“淫荡”更准确涵盖其广义伦理内涵。
- source_word: ἐνίκησεν
  choice: 战胜了
  rationale: 保留胜利与争战色彩，并构成全句修辞高潮。
theological_decisions:
- issue: 如何翻译高度比喻化的 ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία
  choice: 少年们那七塔般的明智
  alternative: 七位少年高尚而坚定的心志
  rationale: 原文把少年们所体现的明智人格化为一座有七塔的坚固建筑。正文保留这一不寻常的意象，不把“七塔”直接消解为“七位少年”；脚注给出解释性译法。
- issue: 如何翻译 εὐσεβεία
  choice: 敬虔
  alternative: 虔敬
  rationale: 该词兼有敬畏上帝及忠于其律法的含义。“敬虔”在现代基督教汉语中较为熟悉，又能保留原文的宗教伦理维度，而不额外加入宗派性解释。
- issue: πάθη 与 ἀκολασίαν 的关系
  choice: 情欲的放纵
  alternative: 激情的失控／欲望的无节制
  rationale: 属格短语可理解为由诸种情欲所表现或产生的无节制。译文保留这种紧密关系，同时避免把 ἀκολασίαν 狭义化为性放荡。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。全句保留原文连续的防御与争战意象：“七塔—巩固—港湾—战胜”。正文中的脚注标记与所列脚注一致；补入[b]以澄清“情欲的放纵”的广义伦理含义。
