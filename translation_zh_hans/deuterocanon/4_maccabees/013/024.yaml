base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: zh_hans
  text: 他们彼此之间的和睦更加牢固[a]；因为他们受同一律法的教导，操练同样的美德，又在公义的生活中一同长大[b]，这些便使他们彼此更加亲近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼此更加同心。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句十分简练；意思似乎是，他们共同受律法教导、操练美德并过公义的生活，因此彼此更加亲近。
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον
  choice: 更加牢固
  rationale: 保留比较意味，表示他们彼此的和睦更为稳固；与“和睦”搭配自然。
- source_word: ὁμόνοιαν
  choice: 和睦
  rationale: 该词指同心、意见一致与彼此协调；“和睦”适合这里的人际语境，也通俗庄重。
- source_word: νόμῳ
  choice: 律法
  rationale: 在《马加比四书》中通常指塑造犹太群体生活的祖传律法；“律法”既明确又不额外扩写。
- source_word: παιδευθέντες
  choice: 受……教导
  rationale: 涵盖教育、训练和管教所产生的塑造；中文以“受教导”表达自然。
- source_word: ἐξασκήσαντες
  choice: 操练
  rationale: 体现主动、持续地实践并培养德行的意味。
- source_word: ἀρετάς
  choice: 美德
  rationale: 符合希腊化伦理语境中“德性、卓越品格”的常见含义。
- source_word: τῷ δικαίῳ ... βίῳ
  choice: 在公义的生活中
  rationale: 表达其成长环境和生活方式兼具正直、公义的性质。
- source_word: συντραφέντες
  choice: 一同长大
  rationale: συν-可带有共同养育、一起成长的意味；此译符合兄弟关系及全句强调共同塑造的语境。
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: 这些便使他们彼此更加亲近
  rationale: 原文末句高度压缩，直译不易成句；用“这些”承接前面的共同教导、操练和成长，保留其促使彼此更亲近的整体意义。
theological_decisions:
- issue: “律法”在犹太殉道文本中的所指
  choice: 保留“同一律法”，理解为共同塑造这些弟兄的犹太祖传律法
  alternative: 泛指一般性的道德法则
  rationale: 本书中的 νόμος 通常特指祖传的犹太律法；正文不添加“犹太”或“祖传”，以免把解释写入译文，同时保留原文用语。
- issue: 共同生活塑造与彼此合一之间的关系
  choice: 把共同受教、操练美德和公义生活呈现为使他们更亲近的原因
  alternative: 将末句理解为他们主动更加归向自身或彼此
  rationale: 希腊文末句语法压缩，代词和施动关系并不完全展开；此译依上下文呈现最自然的相互亲近之意，同时用脚注说明压缩性，不赋予额外教义含义。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重而易懂。以分号保留原句的因果推进；“同一律法—同样的美德—公义的生活”维持三重平行结构。脚注标记均已置于正文相应位置。
