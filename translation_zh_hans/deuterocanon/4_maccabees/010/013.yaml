  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: zh_hans
  text: “你也不要像你哥哥们一样，陷入同样的疯狂；要接受王的劝告，救你自己。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ μανῇς ... τὴν αὐτὴν μανίαν
  choice: 不要……发狂，陷入同样的疯狂
  rationale: 保留原文同根词 μανῇς／μανίαν 的重复和强烈修辞，同时使现代汉语自然可懂。
- source_word: τοῖς ἀδελφοῖς σου
  choice: 像你哥哥们一样
  rationale: 上下文所指是受话者年长的兄弟，因此采用亲属称谓“哥哥们”，比泛称“弟兄们”更明确自然。
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: 听从王
  rationale: πεισθεὶς 加与格在此表示接受王的劝说并顺从他；“听从”兼顾劝服与服从之意。
- source_word: σῶζε σεαυτόν
  choice: 救你自己
  rationale: 保留命令语气和直白的自保诉求，不把 σῴζω 过度神学化。
