base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: zh_hans
  text: 但我自己是主动前来的，好叫你杀了我之后，因更多的恶行而招致天上公义[a]的惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上公义”也可译作“天上的公义”或“天上的审判”。希腊文在这里没有直接提到上帝，而是指与天上相关的超越性公义。
    reason: 说明οὐρανίᾳ δίκῃ的词义范围，并保留原文未直接点明上帝的表达。
lexical_decisions:
- source_word: παρῆλθον
  choice: 走上前来
  rationale: 结合处境，此词表示说话者走到暴君或行刑者面前；“走上前来”既自然，也体现有意呈上自己的动作。
- source_word: ἀπʼ ἐμαυτοῦ
  choice: 主动
  rationale: 该短语强调行动出于说话者本人、自愿而非被迫；现代汉语用“主动”简洁清楚。
- source_word: κατακτείνας
  choice: 杀了
  rationale: 不定过去时分词与主句构成伴随或手段关系；“连我也杀了，从而……”自然表达其逻辑联系，又不过度限定先后。
- source_word: ὀφλήσῃς
  choice: 欠下
  rationale: 保留动词“欠债、负有责任”的司法性隐喻；与“刑罚”搭配虽略具张力，却能传达因恶行而承担惩罚责任的含义。
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: 天上公义
  rationale: δίκη可指公义、裁断或司法惩处；“天上公义”保留其超越性来源，也不把原文未明说的“上帝”直接补入正文。
- source_word: τιμωρίαν
  choice: 所判的刑罚
  rationale: τιμωρίαν表示惩罚性后果；补入“所判的”使与与格“天上公义”的关系在汉语中清楚，同时维持司法语气。
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: 因更多的恶行
  rationale: ἀδίκημα指具体的不义行为或罪行，πλειόνων强调数量继续增加；“更多的恶行”准确而通俗。
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ所表达的超越性审判
  choice: 天上公义
  alternative: 上帝的公义；天上的审判
  rationale: 原文把公义与“天上”相联，却没有直接称上帝为行动者。“天上公义”保留这种含蓄表达以及公义、裁断之间的语义张力，避免将其明确化为某一神学表述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主动走上前来”表现自愿赴死；“欠下……刑罚”刻意保留希腊文ὀφείλω的债务兼司法隐喻。脚注标记置于整句之后，对“天上公义”作词义说明。
