  rationale: 修订以“好叫”表达ὅπως的目的性，以“杀了我之后”自然呈现κατακτείνας与主句的关系，并以“招致……的惩罚”清楚表达ὀφλήσῃς τιμωρίαν及其与“天上公义”的关联。脚注锚点移至“天上公义”后，直接对应所注释的希腊语短语。
