  text: I will not renounce the noble kinship of our brotherhood[a].
translation:
  language: zh_hans
  text: 我绝不背弃弟兄之间高贵的亲属纽带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我绝不弃绝手足之间高贵的亲属纽带。”
    reason: “手足”可作为ἀδελφότης较宽泛的亲属关系译法；“弃绝”反映ἐξόμνυμαι可含否认或断绝之意。
lexical_decisions:
- source_word: οὐκ ἐξόμνυμαι
  choice: 我绝不背弃
  rationale: ἐξόμνυμαι可指否认、断绝或发誓弃绝；这里是在压力下拒绝抛弃手足关系。“背弃”自然表达对关系与忠诚的 repudiation，而不把原文限定为明确的起誓公式；“绝不”体现将来式所表达的坚决意志。
- source_word: τὴν ... συγγένειαν
  choice: ……血缘亲情
  rationale: συγγένεια指亲属关系或血缘纽带。“血缘亲情”既保留家族、血亲含义，也符合现代汉语表达。
- source_word: εὐγενῆ
  choice: 高贵的
  rationale: εὐγενής兼有出身高贵和品质崇高的意味；“高贵”保留这两方面的张力，不窄化为社会阶层意义的“贵族”。
- source_word: τῆς ἀδελφότητος
  choice: 弟兄之间
  rationale: ἀδελφότης在本段具体指同胞弟兄之间的关系。“弟兄之间”比抽象的“弟兄情谊”更自然，并保留原文男性亲属称谓。
theological_decisions:
- issue: ἀδελφότης的性别与亲属范围
  choice: 弟兄之间
  alternative: 手足之间
  rationale: 本语境涉及殉道家庭中的弟兄，故保留男性亲属用语，避免无根据地中性化；脚注列出能够表达较宽泛手足纽带的译法。
- issue: ἐξόμνυμαι是否明确含有起誓行为
  choice: 背弃
  alternative: 发誓弃绝
  rationale: 该动词可带有发誓否认或弃绝的色彩，但本句未明确展开誓言形式；正文不把潜在含义过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“我绝不背弃”体现说话者坚定拒绝的语气；“血缘亲情”避免“亲属关系的亲属关系”式重复，同时保留ἀδελφότης与συγγένεια叠加所强调的手足血亲纽带。
