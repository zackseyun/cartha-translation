base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
translation:
  language: zh_hans
  text: 还是说，我们敬拜万物的创造者，又按照他美善的律法生活，难道不显得是恶事吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还是说，我们敬拜万物的创造者，又按照他美善的律法生活，这难道不显得是恶事吗？”希腊文的反问是在挑战对方的道德判断，但没有明说“在你看来”。
    reason: 说明反问句中δοκεῖ的译法，以及原文隐含而未明说的判断者。
lexical_decisions:
- source_word: κακὸν
  choice: 恶
  rationale: 该词指道德上的恶或应受责备之事；“恶”保留了原文强烈的道德意味。
- source_word: οὐ δοκεῖ
  choice: 难道不算
  rationale: δοκέω在此涉及看法或判断。用“难道不算”自然地表达反问，同时不把隐含的判断者写死。
- source_word: τὸν πάντων κτίστην
  choice: 万物的创造者
  rationale: κτίστης意为创造者，πάντων涵盖一切；此译法简洁、庄重，也符合现代汉语宗教语境。
- source_word: εὐσεβοῦμεν
  choice: 敬拜
  rationale: 该动词表示对神明虔敬、崇奉；其宾语为创造者，因此“敬拜”清楚传达这里的宗教行为。
- source_word: κατὰ
  choice: 按照
  rationale: κατά加宾格在此表示以某事为准则；“按照”准确而自然。
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: 他美善的律法
  rationale: ἔναρετος表示具有德性、道德上优良。“美善”既保留对律法的伦理评价，也比“有德性的律法”更符合现代汉语表达。
- source_word: ζῶμεν
  choice: 生活
  rationale: 现在时动词在此指依某种准则度日、行事；“生活”简明地涵盖这种生活方式。
theological_decisions:
- issue: 反问句的判断者及语气
  choice: 保留“难道不算恶吗”的反问，不在正文中明确加入“在你看来”
  alternative: 译作“在你看来，难道不是恶吗？”
  rationale: 希腊文没有明说第二人称，但语境显然是在挑战对方的道德判断。不补出“你”，可同时保留原文的省略和尖锐反问。
- issue: 对律法道德性质的表述
  choice: 美善的律法
  alternative: 有德性的律法；卓越的律法
  rationale: 原文明确称律法为ἔναρετος，即在德性上优良；“美善”保留这一正面伦理判断，又避免把律法拟人化得过重。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“还是说”承接前文论辩语气；“万物的创造者”“美善的律法”保持宗教与伦理表达的分量。
