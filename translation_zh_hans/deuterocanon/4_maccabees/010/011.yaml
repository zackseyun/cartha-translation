  text: But because of your ungodliness and blood-guilt[a], you will endure unending torments.
translation:
  language: zh_hans
  text: 但你必因自己的不敬虔和杀人流血的污秽[a]，忍受无休止的折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“血债”或“带来污秽的杀戮”。希腊语兼有杀人流血和由此造成玷污的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσέβειαν
  choice: 不敬虔
  rationale: 表达对上帝缺乏敬畏的宗教与道德含义；比单纯的“不虔诚”更明确，又不额外引入特定宗派解释。
- source_word: μιαιφονίαν
  choice: 杀人污血
  rationale: 该词兼有杀人流血与由此造成玷污的含义。“杀人污血”以凝练而较自然的汉语同时保留这两层意义。
- source_word: ἀκαταλύτους
  choice: 无休止的
  rationale: 体现“不能被终止、不中断”的含义；在修饰“折磨”时，重点落在持续而不结束，并不擅自界定其形而上的时间性质。
- source_word: καρτερήσεις
  choice: 必忍受
  rationale: 保留将来时和承受痛苦的意义；“必”在此表达确定的将来陈述。
- source_word: βασάνους
  choice: 折磨
  rationale: 自然传达严重的痛苦与刑罚，且不像“酷刑”那样把范围限定为具体的肉体刑讯。
theological_decisions:
- issue: 对暴君指控中的宗教和污秽含义
  choice: 译作“不敬虔和杀人污血”
  alternative: “不虔诚和杀人罪”或“不敬神和血债”
  rationale: 原文并列对上帝的不敬与杀人流血所带来的玷污。“杀人罪”会弱化污秽意味，“血债”则偏重罪责；所选译法尽量保留二者之间的张力。
- issue: ἀκαταλύτους所表达的持续性
  choice: 译作“无休止的”
  alternative: “不止息的”或“无法消除的”
  rationale: 原词可指不能解除、终止或中断。结合“折磨”，所选译法清楚表达持续性，同时避免加入原文没有明说的系统神学限定。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“但你因自己的……”保留原文对第二人称的强烈谴责；补出“自己的”使汉语关系清楚，不改变因果含义。脚注标记已置于相关词语之后。
