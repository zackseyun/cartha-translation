  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: zh_hans
  text: “对此，你们若有什么刑具，就把它拿来施在我身体上吧；因为至于我的灵魂，你们即使想要，也无法触及。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵魂”或译“生命”。希腊语ψυχή可指“生命”，也可指“灵魂”；这里因与“身体”相对，正文译作“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: 既然如此
  rationale: 作为承接前文并作出回应的话语标记，译为“既然如此”自然简洁，也保留针对上述言行回应的语气。
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: 你们若有什么刑具
  rationale: κολαστήριον具体指施罚或折磨人的器具、手段；“刑具”保留具体性，也符合殉道受刑语境。
- source_word: προσαγάγετε τῷ σώματί μου
  choice: 就拿来对付我的身体吧
  rationale: προσαγάγετε在此不是单纯“拿来”，而是命令对方把刑具施用于身体；“拿来对付”以自然汉语表达这种施加和敌对意味。
- source_word: τῆς γὰρ ψυχῆς μου
  choice: 至于我的灵魂
  rationale: ψυχή也可指“生命”，但此处与σῶμα“身体”形成鲜明对照；“灵魂”最能保留原文的人论张力。
- source_word: οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: 即使你们想碰，也碰不到
  rationale: 保留让步意味和不可实现性；重复“碰”符合现代汉语表达，并传达ἅπτομαι“触及、碰到”的力度。
theological_decisions:
- issue: ψυχή与σῶμα的对照
  choice: 灵魂
  alternative: 生命
  rationale: 原文明确对照迫害者能够伤害的“身体”和无法触及的ψυχή。译作“灵魂”保留这种神学—人论上的区分，同时以脚注说明“生命”这一真实词义可能。
translation_notes:
  register: 采用现代、庄重而有力度的口语化表达。“吧”体现说话者无畏地向施刑者发出挑战，不削弱命令语气。将γάρ在汉语中融入“至于……即使……也……”的逻辑推进，避免生硬直译。
