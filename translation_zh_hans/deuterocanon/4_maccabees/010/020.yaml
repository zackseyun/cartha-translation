  text: For the sake of God[a], we gladly have the limbs of our body mutilated.
translation:
  language: zh_hans
  text: 我们为了上帝，甘愿让自己的肢体被截去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέως
  choice: 甘愿
  rationale: 该副词既可表示欣然，也可表示乐意、自愿；在受刑语境中，“甘愿”自然地传达坚定而主动的承受意愿，同时避免“高兴地”可能产生的轻率语感。
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: 为了上帝
  rationale: ὑπέρ加属格在此表达缘故、忠诚所指向的对象；“为了上帝”保留其奉献与忠贞含义，却不引入代替上帝受苦的意思。
- source_word: τὰ τοῦ σώματος μέλη
  choice: 身体的肢体
  rationale: μέλη指身体各肢体；“身体的肢体”具体、清楚，并保留原文的身体部位表达，不将其泛化为抽象的“成员”。
- source_word: ἀκρωτηριαζόμεθα
  choice: 让……被截去
  rationale: 该动词为现在时被动态，指遭受截肢或肢体被割除。“让……被截去”既体现被动受刑，也与ἡδέως所表达的甘愿承受相协调；不采用较宽泛的“残害”，因为原词更明确涉及肢体截除。
theological_decisions:
- issue: 为上帝受苦的殉道语言
  choice: 为了上帝
  alternative: 为上帝；代表上帝
  rationale: 原短语表达因忠于上帝而承受苦难，并不清楚表示替代或代表关系；译文保留奉献意义，而不导入后来的代赎或代理性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“甘愿”表达坚定的自愿承受；“被截去”直接呈现原文残酷的身体刑罚，又不额外强化为完全肢解。原文无须以脚注才能保留的重要歧义，因此正文不设脚注。
