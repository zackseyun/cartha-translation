  yaml_path: translation/deuterocanon/4_maccabees/010/005.yaml
  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: zh_hans
  text: 但他们对这人的无畏直言[a]深怀愤恨，便用使关节脱位的刑具使他的双手双脚脱臼；又从关节处把它们撬松，将他肢解[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无畏直言”也可译作“坦然直言”或“放胆发言”；原词着重指公开、坦率而无所畏惧地说话。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里使用罕见而强烈的词语，描写刑具作用于关节，并把双手双脚从关节连接处强行撬松、拆离，突出酷刑的残暴。
    reason: cultural_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: 深感愤恨
  rationale: ἐνέγκαντες本义为“承受、忍受”，与πικρῶς连用，在此表示他们无法容忍并强烈怨恨他的言论；译文保留其敌意，又符合现代汉语表达。
- source_word: παρρησίαν
  choice: 无畏直言
  rationale: 该词兼有坦率公开发言和无所畏惧的意味；“无畏直言”比单译“胆量”更能呈现言语层面。
- source_word: τοῦ ἀνδρός
  choice: 这人的
  rationale: ἀνήρ在此指受刑的男子，并非“丈夫”；汉语用“这人”自然承接上下文。
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: 扭脱关节的刑具
  rationale: 罕见复合词指施力于关节、使之错脱的器械；“刑具”明确其酷刑用途，“扭脱关节”保留具体动作。
- source_word: ἐξήρθρουν
  choice: 弄脱臼
  rationale: 动词明确表示使关节脱位；“脱臼”是普通读者容易理解的现代汉语。
- source_word: ἐξ ἁρμῶν ἀναμοχλεύοντες
  choice: 撬开各处关节
  rationale: ἀναμοχλεύοντες带有用杠杆撬动、撬松之意，ἐξ ἁρμῶν指从关节连接处强行分开；此译保留机械性暴力，同时避免把ἁρμός过度限定为特定“关节窝”。
- source_word: ἐξέμελιζον
  choice: 将他肢解
  rationale: 该动词表示从根基处拆毁，引申为撕裂肢体、肢解；上下文对象是受刑者，译作“将他肢解”简洁而准确。
theological_decisions:
- issue: 酷刑描写的具体程度
  choice: 明确译出双手双脚脱臼、关节被撬开以及肢解
  alternative: 弱化为“折磨他”或“残害他”
  rationale: 希腊文刻意使用具体而强烈的身体与器械词汇；如用概括性措辞会削弱殉道叙事所呈现的残酷程度。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“深感愤恨”自然表达分词短语的原因或伴随状态；“弄脱臼”“撬开各处关节”“肢解”逐步呈现原文暴力动作，不作淡化。所有脚注标记均已置于正文。
