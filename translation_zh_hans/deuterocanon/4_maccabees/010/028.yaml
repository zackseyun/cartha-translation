  yaml_path: translation/deuterocanon/4_maccabees/010/028.yaml
  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
translation:
  language: zh_hans
  text: 你看[a]，如今你与上帝疏远[b]，却向那些对上帝虔敬的人[c]开战[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与上帝不相属”或“对上帝而言是外人”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“对上帝行虔敬之事的人”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“争战”或“作战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 既可标明当前时点，也可作为话语推进语，引出说话者当面的斥责。
- source_word: ἰδὲ
  choice: 你看
  rationale: 按注意命令语理解，采用现代汉语中自然且有直接责问力度的表达。
- source_word: ἀλλότριος ὢν θεοῦ
  choice: 你既与上帝疏远
  rationale: ἀλλότριος加属格表达不属于、外在于或与之隔绝的关系；“与上帝疏远”保留关系性的异离含义，又避免误解为族裔上的“外族人”。
- source_word: πολεμεῖς
  choice: 竟……开战
  rationale: 保留动词所含的战争与主动敌对意象；“竟”传达本句斥责语气，但不改变命题内容。
- source_word: τοὺς εὐσεβοῦντας
  choice: 那些虔敬……的人
  rationale: 用动词性结构呈现分词所指持续表现虔敬的人，而不将其压缩为固定身份称号。
- source_word: εἰς τὸν θεόν
  choice: 上帝
  rationale: 作为虔敬行为所指向的对象融入“虔敬上帝”，符合现代汉语表达，并保留其指向上帝的意义。
theological_decisions:
- issue: ἀλλότριος θεοῦ所表达的异离性质
  choice: 与上帝疏远
  alternative: 对上帝而言是外人／与上帝无分
  rationale: 原文说明此人与上帝之间的异离或不相属，却未进一步界定这种状态的形上或救恩论性质；译文保留关系张力而不作教义性扩展。
- issue: εὐσεβοῦντας εἰς τὸν θεόν的宗教行为范围
  choice: 虔敬上帝的人
  alternative: 敬拜上帝的人／对上帝心存敬虔的人
  rationale: εὐσεβέω涵盖向上帝表现敬虔，不必限缩为特定礼仪性的敬拜行为，因此采用较宽而贴近原文的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你看”保留当面责斥的语势；“开战”保留原文鲜明的战争隐喻；全句避免古奥术语，也不把“虔敬”窄化为某一特定宗派或礼仪概念。
