base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/007.yaml
  text: And since they were in no way able to strangle him[a], they dragged off the skin with the very tips of his fingers and flayed him, and immediately they led him to the wheel.
translation:
  language: zh_hans
  text: 他们无论怎样也不能勒死他，就把他的皮连着手指的最尖端一起扯下[a]，又剥他的皮，随即把他带到刑轮前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊文格外形象，直译近于“连同手指最末端一起”；也可能是说，他们把皮一直扯到指尖。
    reason: 说明罕见短语的句法与可能含义，保留原文对皮肤和指尖关系的歧义。
lexical_decisions:
- source_word: κατὰ μηδένὰ τρόπον
  choice: 无论怎样也不能
  rationale: 表达完全无法做到，符合现代汉语习惯，同时保留原文强烈的否定语气。
- source_word: ἰσχύοντες
  choice: 能
  rationale: 此处与不定式连用，表示能力，而非单指体力强壮。
- source_word: ἄγξαι
  choice: 勒死
  rationale: 该动词指扼住或勒紧喉咙；在此酷刑语境中，“勒死”最直接。
- source_word: περισύραντες
  choice: 扯下
  rationale: 保留用力拉扯、剥离皮肤的暴力动作，又不额外规定具体施刑方式。
- source_word: τὸ δέρμα
  choice: 皮
  rationale: 在人体受刑语境中是自然、直接的现代汉语表达。
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: 连着手指的最尖端一起
  rationale: 尽量保留 σύν“连同、一起”的结构及原文对手指极末端的强调，同时以脚注说明这一罕见而形象的短语也可能描述剥皮一直延伸到指尖。
- source_word: ἀπεσκύθισον
  choice: 将他剥了皮
  rationale: 该词可指剥皮或剥头皮；上下文已明确提到皮肤，采用较宽泛而准确的“剥了皮”，不擅自限定为只剥头皮。
- source_word: εὐθέως
  choice: 随即
  rationale: 自然地表达动作紧接发生。
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: 把他带到刑轮那里
  rationale: τροχός在此是施刑用的轮；译作“刑轮”明确语境而不过度解释其构造。
