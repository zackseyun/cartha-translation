  text: if indeed you had human feelings, and had hope from God for deliverance.
translation:
  language: zh_hans
  text: 你若真有人之常情[a]，又盼望从上帝那里得着拯救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“具有人的眷恋之情”或“有人的情感”。希腊语表达紧缩，诉诸人通常具有的牵挂和情感。
    reason: lexical_alternative
  - marker: b
    text: 或译“获救”或“救恩”。希腊语既可指从眼前危难中得解救，也可有更广的救恩含义。
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: 你若真
  rationale: 保留强调性的条件语气；不把可能的修辞条件擅自改成因果陈述。
- source_word: ἠσθάνου ἀνθρώπους πόθων
  choice: 有人之常情
  rationale: 原文表达紧缩，按语境指对人天然情感或牵挂有所感受；此译自然凝练，同时以脚注保留“眷恋”等词义可能。
- source_word: ἐλπίδα εἶχες
  choice: 寄望……盼望
  rationale: 以“寄望于上帝”表达盼望所倚靠的对象，并以“盼望得救”说明其内容，使汉语句法清楚。
- source_word: παρὰ θεῷ
  choice: 寄望于上帝
  rationale: παρά加与格可表达在上帝那里、与上帝相关或以上帝为盼望的根据；中文采用自然说法，但不将其窄化为上帝已经作出的保证。
- source_word: σωτηρίου
  choice: 得救
  rationale: 该词可指眼前获救，也可有较广的救恩含义；“得救”在中文中保留这两层可能，并由脚注说明。
theological_decisions:
- issue: σωτηρίου在殉道受难语境中的范围
  choice: 得救
  alternative: 获救；蒙拯救；得救恩
  rationale: 原词既可指从当前危难中获救，也可指更广义的拯救。“得救”较能保留这种开放性，不把经文限定为现世脱险或终极救恩。
- issue: παρὰ θεῷ所表达的盼望与上帝之关系
  choice: 寄望于上帝
  alternative: 在上帝那里有得救的盼望；从上帝得着获救的希望
  rationale: 此处介词结构存在关系、所在和来源方面的语义空间；正文采用自然中文，不断言一种排他的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人之常情”略带凝练书面色彩，适合责问式语境；整句保留原文条件句的修辞张力。
