lexical_decisions:
- source_word: μέλλων
  choice: 快要……的时候
  rationale: μέλλων与不定式连用表示即将发生；用时间从句自然表达临近之意，并保留其作为分词所带的情境功能。
- source_word: ἀποθνήσκειν
  choice: 死
  rationale: 该不定式本身意为“死”。虽然上下文涉及殉道和处决，本句没有明说施事者，因此不译作“被处死”。
- source_word: ἔφη
  choice: 说
  rationale: 这是常见的叙事引语引介词；“说”简洁自然，也符合现代汉语的庄重叙事语体。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要轻微推进叙事，并非强烈转折。汉语直接承接上文更自然，无须机械译作“而”或“但是”。
