  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: zh_hans
  text: “暴君，尽管施用酷刑吧！好让你也借着这些酷刑明白：我是那些先前受过酷刑的人的兄弟。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπιθι
  choice: 尽管……来吧
  rationale: 该命令式在这里带有直面迫害者的挑战意味；“尽管……来吧”在现代汉语中自然表达无畏、挑衅的语气，又不过度增添内容。
- source_word: τύραννε
  choice: 暴君
  rationale: 保留呼格的直接称呼，也兼顾政治身份和强烈的道德谴责。
- source_word: βασάνοις
  choice: 用酷刑
  rationale: 复数与格在此表示施加折磨的手段；“用酷刑”简洁、具体，并与命令式自然衔接。
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: 好让你也从这些酷刑中知道
  rationale: “好让”表达ἵνα的目的含义；“也”保留καί；“从这些酷刑中”将τούτων在语境中的指向明确为眼前将施加的酷刑，同时保留其作为认识途径的意味。
- source_word: ἀδελφός
  choice: 兄弟
  rationale: 原文为阳性单数，且上下文是男性受难者表明自己与先前受刑者的手足关系；“兄弟”准确保留性别和亲属连带。
- source_word: τῶν προβασανισθέντων
  choice: 那些先受酷刑之人
  rationale: 以“先”体现προ-所表达的时间先后，以“受酷刑”保留被动含义；不额外限定这些人的身份。
theological_decisions:
- issue: 家族殉难语境中ἀδελφός的性别与亲属含义
  choice: 兄弟
  alternative: 手足中的一员
  rationale: 希腊文明确为阳性单数，语境中的说话者也在表明自己是那些先受刑者的男性手足，因此不作中性化处理。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“尽管用酷刑来吧”传达说话者面对暴君时无畏的挑战；后半句保持原文目的结构及“借这些酷刑得知”的反讽张力。
