  yaml_path: translation/deuterocanon/4_maccabees/010/018.yaml
  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
translation:
  language: zh_hans
  text: 他却说：“即使你夺去发声的器官[a]，上帝也听得见沉默的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“声音的器具”，指用来发声的身体器官；原文没有具体说明是哪一个器官。
    reason: 说明原文保留的器具隐喻及其未明确的身体所指。
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: 即使你夺去
  rationale: Κἂν（καὶ ἐάν）引出让步条件，译为“即使”；ἀφέλῃς表示拿走、夺去，此处语境涉及强行剥夺说话能力，“夺去”较为贴切。
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: 发声的器官
  rationale: ὄργανον本义为工具、器具，也可指身体器官；与φωνῆς连用，指用于发声的身体器官。此译保留其身体所指，却不擅自限定为舌头。
- source_word: σιωπώντων
  choice: 沉默的人
  rationale: 这是σιωπάω的现在分词属格复数，在ἀκούει后作实质性用法，意为处于沉默状态的人；译文不增添原文未明说的“祷告”。
- source_word: ἀκούει
  choice: 听得见
  rationale: ἀκούει在此以属格标示所听的对象。“听得见”自然呈现即使没有声音，上帝仍能听见的悖论性表达。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代汉语基督教及经文语体中通行、庄重的对应词。
theological_decisions:
- issue: 本句是说上帝听见沉默的人，还是听见未出声的祷告
  choice: 上帝也听得见沉默的人
  alternative: 上帝也听得见无声的祷告
  rationale: 希腊文明确使用指人的分词σιωπώντων，并未出现“祷告”一词。正文保留原文对“听见沉默者”的张力，不把其潜在含义解释进译文。
- issue: καί在末句中的表达
  choice: 译为“也”
  alternative: 不显译，作“上帝听得见沉默的人”
  rationale: καί在此与前面的让步条件呼应，“也”能自然表现：即便发声器官被夺去，上帝仍听得见处于沉默中的人；同时避免额外加强为“甚至”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他却说”承接希腊文ὁ δὲ ἔφη；“沉默的人”保留原文简洁而富张力的表达。
