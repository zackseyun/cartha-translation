  yaml_path: translation/deuterocanon/4_maccabees/010/014.yaml
  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: zh_hans
  text: 他却对他们说：“你们用来对付我的火，并没有炽烈到足以使我胆怯[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我表现得像个懦夫”；较直译为：“使我不像男子汉。”
    reason: δειλανδρῆσαι兼有使人胆怯、使人表现怯懦的意思；其词源还带有“不像男子汉”的色彩。
lexical_decisions:
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: 他却对他们说
  rationale: δέ在这里承接上文并带有轻微转折；“却”自然表现他面对施刑者时的反回应。
- source_word: καυστικώτερον
  choice: 炽烈
  rationale: καυστικός表示灼烧、炙烈；在οὐχ οὕτω…ὥστε程度—结果结构中，“还没有炽烈到……”既保留火焰意象，也符合现代汉语表达。比较级形式在该结构中体现程度，并不需要机械译成“更加”。
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: 你们用来对付我的火
  rationale: 保留τὸ πῦρ所指的实际刑火，并以“用来对付我”表达κατʼ ἐμοῦ的敌对指向，不把意象抽象化。
- source_word: δειλανδρῆσαι
  choice: 使我胆怯
  rationale: 该动词表示使人失去勇气、表现怯懦；“使我胆怯”保留使役意义，也避免将词源中男性化色彩误作本句重点。
- source_word: οὐχ οὕτω ... ὥστε
  choice: 还没有……到能……
  rationale: 这是程度与结果结构；此译法在中文中自然地表达“没有达到足以产生该结果的程度”。
theological_decisions:
- issue: δειλανδρῆσαι既可按语义译为“使我胆怯”，也可按词源色彩理解为“使我不像男子汉”
  choice: 使我胆怯
  alternative: 使我显得怯懦；使我不像男子汉
  rationale: 经文焦点是受刑者在烈火面前仍不失勇气，而不是提出关于男性身份的教义。“胆怯”准确传达其伦理和叙事作用；脚注保留行为性及较字面的可能译法。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“炽烈”保留火刑的具体灼烧感；“胆怯”适合普通读者，并由脚注呈现原词的行为性和性别化词源色彩。
