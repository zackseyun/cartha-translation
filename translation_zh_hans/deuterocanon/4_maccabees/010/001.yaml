base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: zh_hans
  text: 前一人坚忍地承受了那值得传颂的死亡[a]之后，第三个人被带来；许多人再三劝他，说只要尝一口，便可保全性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “值得传颂”也可译作“受人传颂”或“著名”。希腊语这个形容词本义与“被歌唱、在歌中受颂扬”有关。
    reason: lexical_alternative
  - marker: b
    text: 指尝一口被禁止的食物，借此顺从命令而保住性命。
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: 堪为歌颂的
  rationale: 该词本义带有“被歌唱、受颂扬”的意味；此译保留原文崇高的修辞色彩，又不额外引入“荣耀”等神学判断。
- source_word: καρτερήσαντος
  choice: 坚忍地承受了
  rationale: 既表达在苦难中承受，也凸显坚定不屈的意味，比单用“忍受”更贴近原词。
- source_word: ὁ τρίτος ἤγετο
  choice: 第三个人被带了上来
  rationale: 保留被动结构，并按审讯、受刑场景自然表达其被带到众人面前；“上来”不具体限定带往何处。
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: 许多人再三劝他
  rationale: 同时传达ὑπὸ πολλῶν的多人施动者和πολλὰ所体现的反复、恳切劝说。
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: 只要尝一口，就可以保全性命
  rationale: ἀπογευσάμενος侧重稍作尝食，σώζοιτο在语境中指保住生命；中文不必补出明确宾语即可自然保留其语境隐含性。
theological_decisions:
- issue: ἀοίδιμον θάνατον对殉难之死的崇高描述
  choice: 译作“那堪为歌颂的死亡”
  alternative: “那著名的死亡”或“那光荣的死亡”
  rationale: “堪为歌颂”保留原词与歌唱、颂扬相关的意象及殉难叙事的高昂语调，同时避免以“光荣”替原文作更明确的神学评价。
- issue: ἀπογευσάμενος的隐含宾语
  choice: 正文译作“尝一口”，不明说所尝何物
  alternative: 补作“尝一口禁食”或“尝一口那肉”
  rationale: 希腊文没有明示宾语，所指食物由上下文得知；正文保持含蓄，脚注再交代文化语境，以免过度明确化。
- issue: σώζοιτο在本节中的意义
  choice: 译作“保全性命”
  alternative: “得救”
  rationale: 此处劝说者所指的是借顺从命令免于死亡，而非明确陈述属灵救恩；“保全性命”符合眼前的叙事语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这人”承接前文人物；分号呈现由第二人的死亡转入第三人受审的场景变化。“第三个人”避免中文中“第三个”可能显得突兀；“只要……就……”自然表达劝说者提出的保命条件。
