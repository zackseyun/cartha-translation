  naturalness: “这人也像他的兄弟们那样，死得无愧于弟兄之名”略显重叠，且“这人”在庄重叙事中不如“此人”或省略指称自然。改作“此人以配得上众兄弟的方式死去后”既连贯也较庄重。
  terminology: “众兄弟”准确保留ἀδελφός的复数及语境中的荣誉性比较；“第四个”保留原文省略的名词，不必擅自补作“第四个兄弟”。“拖到前面来”传达强迫拉扯及向前带出之意。
