lexical_decisions:
- source_word: τούτου
  choice: 这人
  rationale: 指回前一位受难的兄弟；“这人”保留指示代词的指回作用，同时符合现代汉语叙事习惯。
- source_word: θανόντος
  choice: 死得
  rationale: 这是属格独立结构中的不定过去时分词，表示其死亡在随后拖出第四人之前已经发生；汉语按事件先后自然表达。
- source_word: ἀδελφοπρεπῶς
  choice: 像他的兄弟们那样，死得无愧于弟兄之名
  rationale: 该副词由“兄弟”和“相称、合宜”构成，既可能强调其死法配得上众兄弟，也带有“以合乎兄弟身份的方式”之意。正文用自然汉语兼顾群体榜样与荣誉色彩，并以脚注保留字面张力。
- source_word: τὸν τέταρτον
  choice: 第四个
  rationale: 希腊文只用序数词，所省略的“兄弟”可由上下文补足；译文同样保留这种省略。
- source_word: ἐπεσπῶντο
  choice: 拖上前来
  rationale: 该动词表示拉扯、拖拽，语境中带有明显的强迫意味；“拖上前来”也交代了朝受刑或审问地点移动。
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词引出下一节的直接引语；用“说：”自然承接未完的话语，同时保留句子向下延续的结构。
