  yaml_path: translation/deuterocanon/4_maccabees/010/017.yaml
  text: When bloodthirsty and murderous and most savage Antiochus heard these things[a], he ordered his tongue to be cut out.
translation:
  language: zh_hans
  text: 嗜血、好杀、最为残暴[a]的安条克听见这些事后，就下令割掉那人的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最为残暴”所译的希腊语形容词很少见，是最高级形式，也可译作“最残忍”或“最凶暴”。
    reason: 说明罕见词的强化意义及合理的译法选择。
lexical_decisions:
- source_word: ταῦτα
  choice: 这些话
  rationale: 中性复数指示词回指前文所说的内容；结合“听见”及上下文，用“这些话”自然明确。
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词表示先于主句命令发生的动作；汉语用顺承结构即可自然表达。
- source_word: αἱμοβόρος
  choice: 嗜血
  rationale: 保留该复合形容词对喜爱流血杀戮之性情的强烈谴责，也符合现代汉语表达。
- source_word: φονώδης
  choice: 好杀
  rationale: 表达具有杀人、嗜杀倾向的性情，并与“嗜血”形成原文那样的并列强化。
- source_word: πανμμερώτατος
  choice: 极其残暴
  rationale: 以“极其”体现最高级的强化作用；“残暴”兼顾凶狠与残酷，适合此处对安条克的定性。
- source_word: ἐκέλευσεν
  choice: 下令
  rationale: 准确表达向他人发出命令，简洁而符合叙事语体。
- source_word: τὴν γλῶτταν αὐτοῦ
  choice: 他的舌头
  rationale: 保留希腊文第三人称代词所指的受刑者，不将其误解为安条克。
- source_word: ἐκτεμεῖν
  choice: 割掉
  rationale: 该不定式表示切除、割去；汉语“下令割掉”自然包含由执行者实施命令的含义。
