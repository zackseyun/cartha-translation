  text: I am not about to refuse[a], tyrant, the torture for the sake of virtue.
translation:
  language: zh_hans
  text: “暴君啊，我绝不推辞这为美德而受的酷刑。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: 我绝不
  rationale: μέλλω与不定式连用可表达意向或即将发生之事；在否定句中，此处强调面对酷刑时坚定的当前决意。“绝不”以自然汉语保留其面向未来的坚决语气。
- source_word: τύραννε
  choice: 暴君啊
  rationale: 呼格直接称呼施行迫害的统治者，并带有明确的贬义；“暴君”准确而通俗。
- source_word: πρὸς τὸν ... βασανισμόν
  choice: 这……酷刑
  rationale: βασανισμός指酷刑或严酷折磨，πρός在这里表示面对即将临到的酷刑；汉语用“逃避这……酷刑”自然表达该关系。
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: 为持守美德而受的
  rationale: ὑπέρ可表示缘由、目的或为某事的缘故，ἀρετή指美德、德行。结合受刑语境，“为持守美德而受”清楚表达因坚持美德而承受酷刑，同时不把含义限缩为单纯替代或代理。
- source_word: παραιτεῖσθαι
  choice: 逃避
  rationale: 该中动态不定式可指拒绝、推辞或设法避开。面对酷刑时，“逃避”比直译为“拒绝酷刑”更符合现代汉语，也传达说话者不会退缩躲避的意思。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“暴君啊”保留直接呼语的力度；“绝不逃避”体现说话者坚定、面向未来的决意。脚注保留παραιτεῖσθαι可译作“推辞”的词义空间。
