  yaml_path: translation/deuterocanon/4_maccabees/010/026.yaml
  text: But these things from you are not worthy even of tortures,[a]
translation:
  language: zh_hans
  text: 但你们所做的这些事，还不配称为酷刑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译作：“但你们的这些事不配称为酷刑。”ὑμῶν的表达较为含蓄，也可理解为“出自你们”或“你们这一方所做的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 表示与上文形成鲜明转折；“但”简洁自然，符合此处语气。
- source_word: ταῦτα
  choice: 这些手段
  rationale: 原文是中性复数“这些事”；结合受刑语境译作“这些手段”，既保留复数所指的宽泛性，也使现代汉语表达清楚。
- source_word: ὑμῶν
  choice: 你们施加的
  rationale: 该属格表达较为压缩，可指“你们的”“出自你们”或“你们这一方所做的”；正文用“你们施加的”呈现语境中最自然的含义，并在脚注说明其他可能。
- source_word: βασάνων
  choice: 酷刑
  rationale: 在殉道叙事中指刑讯、折磨或酷刑；“酷刑”直接而凝练，适合此处语境。
- source_word: ἄξια
  choice: 还称不上
  rationale: ἄξιος加属格本义为“配得、相称于”；此处修辞意为这些手段尚不足以称作真正的酷刑。“还称不上”在现代汉语中自然表达这种轻蔑意味，而不额外强化为“根本”。
theological_decisions: []
