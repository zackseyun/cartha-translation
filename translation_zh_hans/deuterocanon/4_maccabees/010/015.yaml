base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: zh_hans
  text: 我凭我兄弟们蒙福的死、凭暴君永远的毁灭、凭敬虔之人永恒的生命起誓：我绝不背弃这高贵的弟兄关系。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄关系”也可译作“高贵的弟兄共同体”或“高贵的弟兄情谊”。原文可指弟兄间的关系或弟兄共同体；按上下文，这里主要指说话者与其兄弟们之间的连带关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: 凭……起誓
  rationale: μὰ与宾格连用构成郑重的起誓语；汉语明说“起誓”比逐字译作“凭着”更清楚自然。
- source_word: μακάριον ... θάνατον
  choice: 蒙福的死
  rationale: μακάριος在此表达受祝福、值得尊崇的宗教评价，不只是主观的快乐或幸运。
- source_word: τῶν ἀδελφῶν μου
  choice: 我兄弟们
  rationale: 复数阳性名词在上下文中指说话者的亲生兄弟；“兄弟们”准确而自然。
- source_word: αἰώνιον ... ὄλεθρον
  choice: 永远的毁灭
  rationale: ὄλεθρος表示毁灭、败亡；αἰώνιος强调其长久而终极的性质。“永远”也与后文译作“永恒”的近义形容词略作区分。
- source_word: ἀΐδιον ... βίον
  choice: 永恒的生命
  rationale: ἀΐδιος表示持续不息、永久存在；βίος在这里指生命。“永恒的生命”保留其持久性，并与暴君的毁灭形成鲜明对照。
- source_word: τῶν εὐσεβῶν
  choice: 敬虔之人
  rationale: εὐσεβής指对神心存敬畏、以虔敬为特征的人；“敬虔之人”庄重且易懂。
- source_word: οὐκ ἀρνήσομαι
  choice: 我绝不背弃
  rationale: ἀρνέομαι可指否认、拒绝承认或断绝关系；此处说话者拒绝抛弃与兄弟之间的连带关系，“背弃”最合语境。“绝不”传达将来否定式在誓言中的坚定语气。
- source_word: τὴν εὐγενῆ ἀδελφότητα
  choice: 这高贵的手足之情
  rationale: ἀδελφότης可指兄弟关系或弟兄群体，εὐγενής表达高贵的出身或品格。上下文聚焦说话者与其兄弟的关系，故用自然的“手足之情”，同时以脚注保留较宽泛的可能。
theological_decisions:
- issue: 暴君的毁灭与敬虔之人的生命之间的末世性对照
  choice: 直接保留“永远的毁灭”与“永恒的生命”的对照，不进一步界定其具体方式。
  alternative: 将其仅理解为一般性的道德对比，或明确解释为某一完整的死后赏罚体系。
  rationale: 原文以αἰώνιος修饰毁灭，以ἀΐδιος修饰生命，明确并列两种持久结局，却没有在本节详述其机制；译文应保存这一神学张力，不增添体系化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“凭……起誓”清楚呈现希腊文誓言结构；“蒙福”“敬虔”“背弃”保留宗教与伦理分量，同时避免古奥措辞。以“永远／永恒”分别对应两个意义相近的持续性形容词，不夸大二者之间的语义差别。
