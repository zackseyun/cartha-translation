  yaml_path: translation/deuterocanon/4_maccabees/010/010.yaml
  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: zh_hans
  text: 至于我们，最污秽的暴君啊，因上帝的训导和美德而受这些苦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因上帝的训导和美德”也可译作“为了上帝的训导和美德的缘故”。原文“上帝的”可能同时限定“训导”和“美德”；其属格关系可理解为归属、来源，或由与上帝的关系所界定。
    reason: 保留διά加宾格的缘由／“为了……缘故”语义幅度，并保留θεοῦ与两个并列名词的关系开放性；避免加入原文未明说的“维护”。
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: 至于我们
  rationale: μέν在这里突出说话者一方，并预示与对方的对照；“至于我们”自然保留这种对举语气，不强行补出希腊文未明说的转折内容。
- source_word: ὦ μιαρώτατε τύραννε
  choice: 最污秽的暴君啊
  rationale: μιαρώτατε是表示污秽、玷污的最高级，兼有道德和宗教层面的谴责；“最污秽”比泛化为“最卑鄙”更能保留原词意象。呼格ὦ用句末“啊”自然表达。
- source_word: διὰ παιδείαν
  choice: 因……教养
  rationale: 带宾格的διά可表示缘由，也可有“为了、缘故”的意味；παιδεία在此不是普通学校教育，而是塑造品格的教导、训练或管教。“教养”较凝练地涵盖教导与品格培育。
- source_word: καὶ ἀρετὴν
  choice: 和美德
  rationale: ἀρετή指德性、卓越；在本书伦理论述中，“美德”准确而自然。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 保留显明的属格形式，并让“上帝的”在汉语中自然地统摄并列的“教养和美德”；不把它释义性地改写成“敬虔的”，以保留属格关系本身的开放性。
- source_word: ταῦτα πάσχομεν
  choice: 受这些苦
  rationale: πάσχομεν表示遭受、受苦；ταῦτα回指眼前的种种酷刑。“受这些苦”符合现代汉语，也保留复数性的具体回指。
theological_decisions:
- issue: θεοῦ与παιδείαν καὶ ἀρετήν的关系
  choice: 译作“上帝的教养和美德”，使θεοῦ修饰两个并列名词
  alternative: “因敬虔的教养和美德”或“因来自上帝的教养和美德”
  rationale: 后置属格最自然地关联整个并列结构，但其具体语义可以是归属、来源或由与上帝的关系所界定。正文保留形式上的属格，不明确限定为“来自上帝”或“敬虔的”。
- issue: διά加宾格的语义力度
  choice: 正文译作“因”，脚注说明也可理解为“为了维护”
  alternative: “为了上帝的教养和美德”
  rationale: 在受难语境中，διά可说明他们遭受酷刑的缘由，也可能表达他们为之受苦的价值。简洁正文采用较自然的因由表达，同时用脚注保存目的或缘故读法。
translation_notes:
  register: 采用现代、庄重且可朗读的汉语。“最污秽的暴君”保留原文强烈而带宗教污秽色彩的辱斥；“教养”避免仅指学校教育，也不把παιδεία窄化为惩戒。脚注标记[a]紧随整句受苦陈述，以覆盖该短语的两项翻译歧义。
