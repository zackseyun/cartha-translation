base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: zh_hans
  text: “你看，我的舌头已经被打烂了；割下它吧！因为即使这样，你也割不掉我们的理性判断[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“我们的”，不是“我的”；这复数可能表示说话者与他的弟兄们共同持守同一理性判断。末句的“割掉”沿用“割舌”的形象，意思是：即使割掉他的舌头，也不能除去他们坚定持守的理性判断。
    reason: 说明原文复数所形成的语境张力，并解释γλωσσοτομήσεις的割舌身体隐喻。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的指示语气；“看哪”庄重而清楚，也比单说“看”更能承载此处的强烈宣告。
- source_word: κέχλασται
  choice: 已经被打烂了
  rationale: 完成时被动形式表示舌头已遭重创并处于破损状态。“打烂”自然地传达酷刑造成的严重伤害，又不限定具体器具。
- source_word: ἡ γλῶσσα
  choice: 我的舌头
  rationale: 希腊文直译为“这舌头/舌头”，但上下文明指说话者自己的舌头；汉语用领属词更自然。
- source_word: τέμνε
  choice: 割下它吧
  rationale: 这是对施刑者的命令；宾语承接前句的舌头。译作“割下”明确表达切除之意，并保留挑衅性的命令语气。
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: 但即使这样……也不
  rationale: παρὰ τοῦτο 在此表示借这种手段；该表达自然地呈现施刑者即便如此也不能达到目的的强调意味。γάρ 在语境中引出反驳和理由，汉语以“但”衔接更顺畅。
- source_word: τὸν λογισμὸν
  choice: 理性意志
  rationale: λογισμός 是本书的重要概念，不仅指抽象推理，也指以理性形成并坚守的判断与决心。“理性意志”兼顾思辨和坚定持守两面。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 忠实保留所据希腊文本的第一人称复数，不因眼前说话者为单数而改作“我的”；复数可表达他与众弟兄共同的立场。
- source_word: γλωσσοτομήσεις
  choice: 割不掉
  rationale: 该复合动词本指割舌，此处把切割身体的动作转用于“理性意志”。“割不掉”既保留鲜明的肉身隐喻，也让现代汉语读者容易理解。
theological_decisions:
- issue: λογισμός 在《马加比四书》的哲学—神学语境中的译法
  choice: 理性意志
  alternative: 理性判断；理智；理性的决心
  rationale: 全书强调敬虔的理性驾驭情欲，并在苦难中坚定不移。“理性意志”避免把该词缩减为纯粹智力活动，同时不引入后世宗派化术语。
- issue: 单数说话语境中的复数 ἡμῶν
  choice: 我们的理性意志
  alternative: 我的理性意志
  rationale: 所据希腊文本明确为复数，应保留其真实张力。这里可表达殉道者与弟兄们共同的理性信念，但正文不把这一解释绝对化。
- issue: γλωσσοτομήσεις 的身体隐喻
  choice: 割不掉我们的理性意志
  alternative: 不能使我们的理性意志沉默
  rationale: 原文故意把“割舌”用于无形的 λογισμός，形成强烈反讽。保留“割”比解释性地译成“使……沉默”更忠实于其修辞张力。
translation_notes:
  register: 采用现代、庄重而有力度的汉语。短促命令“割下它吧”保留受刑者直面施刑者的气势；末句继续使用“割”形成原文舌头与理性意志之间的修辞呼应。
