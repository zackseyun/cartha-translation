  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
translation:
  language: zh_hans
  text: “憎恨美德、仇恨世人的人啊[a]，你这样把我们公开摆出来[b]，究竟是在做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “憎恨美德”直译希腊文复合词；也可译为“恨善者”。
    reason: 说明μισάρετε的构词义，并保留简洁的译法选择。
  - marker: b
    text: 或译：“把我们这样暴露出来”或“把我们这样摆在众人面前。”该动词可指摆出、公开呈现；在此语境中也可能暗示使人暴露于羞辱或惩罚。所给希腊文本在此另有句法张力：与单数“你”相连的分词形式为复数，因此其精确句法关系不完全确定。
    reason: 保留προθεῖς的词义范围和英文审校轨迹的语境说明，并如实交代δρῶντες与单数动词之间的不规则，而不改变正文问句的对象。
lexical_decisions:
- source_word: μισάρετε
  choice: 厌恶美德的人
  rationale: 该词是呼格，复合词的自然理解是“厌恶美德者”，与后面的“仇恨世人者”构成并列斥责；不按英语咨询层译作泛指的“可憎”。
- source_word: μισάνθρωπε
  choice: 仇恨世人的人
  rationale: 直译该复合词“恨人者”，用现代汉语表达为“仇恨世人的人”，既保留强烈斥责，也避免“厌世者”可能带来的消极避世含义。
- source_word: τί δρῶντες
  choice: 我们究竟做了什么
  rationale: δρῶντες是主格阳性复数分词，与说话者一方的“我们”在数上相合，较可能是在追问他们做了什么，而非将复数形式直接化为对单数迫害者的“你在做什么”。“究竟”体现质问语气。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 第一人称复数形式；在汉语中置于后半句，作为“推出来示众”的宾语。
- source_word: προθεῖς
  choice: 推出来示众
  rationale: προτίθημι的主动不定过去分词可指把人置于前面、公开摆出；殉道受刑语境中，“推出来示众”兼顾公开呈现和任人凌辱、惩治的意味，同时不把具体刑罚写入正文。
- source_word: τοῦτον τὸν τρόπον
  choice: 这样
  rationale: 按现代汉语习惯简洁表达方式或情状，避免生硬的“以这种方式”。
