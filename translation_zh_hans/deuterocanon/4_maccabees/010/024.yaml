translation_notes:
  register: 采用庄重而直接的质问语气。“推出来示众”是现代普通读者易懂的表达，又保留公开摆出受辱或受罚的语境含义。正文不强行修平希腊文略显不规则的分词结构，脚注交代其歧义。
