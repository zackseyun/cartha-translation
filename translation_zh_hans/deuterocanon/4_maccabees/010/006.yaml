  text: and they tore away the fingers and the arms and the legs and the elbows[a].
translation:
  language: zh_hans
  text: 他们把手指、手臂、腿和肘部都硬生生扯了下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剥了下来”或“拉扯下来”；希腊文动词在这段酷刑场景中表示强行除去肢体或肢体的一部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: περίειλκον
  choice: 硬生生扯了下来
  rationale: 该未完成时复数动词在酷刑语境中表示强行剥除或扯下；“硬生生扯了下来”既传达持续施暴与强制肢解的惨烈，也保留其可指“剥下、拉下”的词义范围。
- source_word: δακτύλους
  choice: 手指
  rationale: 采用该词通常的身体部位义；汉语中明确译作“手指”，自然且不致与脚趾混淆。
- source_word: βραχίονας
  choice: 手臂
  rationale: 该词可随语境指臂或前臂；“手臂”是现代汉语中最自然、不过度限定具体部位的译法。
- source_word: σκέλη
  choice: 腿
  rationale: 直接表达腿部，符合原文的普通解剖称谓，也比更细分的部位名称自然。
- source_word: ἀγκῶνας
  choice: 肘部
  rationale: 该词通常指肘或手臂弯曲的关节；“肘部”比单说“肘”更适合与其他被扯下的身体部位并列，同时不将原文处理成精密的解剖描述。
