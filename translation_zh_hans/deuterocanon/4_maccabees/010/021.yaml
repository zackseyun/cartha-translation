  yaml_path: translation/deuterocanon/4_maccabees/010/021.yaml
  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
translation:
  language: zh_hans
  text: 但上帝很快就会追讨你[a]，因为你正在割掉那条吟唱神圣颂歌的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝很快就会惩罚你”或“上帝很快就会来追赶你”。希腊文动词含有追赶、追究之意；在这里的语境中指上帝施行审判。
    reason: 保留μετελεύσεται在“追赶”和“惩治”之间的语义张力。
lexical_decisions:
- source_word: ταχέως
  choice: 很快
  rationale: 既可表达行动迅速，也保留审判即将临到的时间意味；不把语义限缩为单纯的“立刻”。
- source_word: μετελεύσεται
  choice: 会追讨
  rationale: μετέρχομαι在此有追赶、追究之意；“追讨”既保留上帝追及迫害者的动态意象，也自然传达语境中的惩治含义，而不直接改写为“惩罚”。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 直接对应定冠词加θεός，采用现代普通话中庄重且通行的称呼。
- source_word: τὴν ... γλῶτταν
  choice: 这条……舌头
  rationale: 保留受刑场景中具体的身体器官；“这条”体现希腊文定指宾语在现场语境中的指向。
- source_word: τῶν θείων ὕμνων
  choice: 神圣颂歌
  rationale: θείων可指神圣的或属神的；“神圣颂歌”保留修饰关系及庄重语域，不擅自明确为“唱给上帝的歌”。
- source_word: μελῳδόν
  choice: 吟唱
  rationale: 该词作γλῶτταν的修饰语，表示发出旋律、歌唱；用关系结构“吟唱……的舌头”符合现代汉语，并保留音乐性。
- source_word: ἐκτέμνεις
  choice: 正在割掉
  rationale: 保留现在时所呈现的即时酷刑场景；“割掉”准确而鲜明地表达切除舌头。
theological_decisions:
- issue: μετελεύσεται ὁ θεός所表达的神圣报应力度
  choice: 上帝很快就会追讨你
  alternative: 上帝很快就会惩罚你／上帝很快就会追上你
  rationale: 语境明确含有审判与报应，但动词本身保留“追在后面、追究”的动态意味。“追讨”在汉语中兼顾追及与问罪，不将原文简化为抽象的惩罚陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追讨”略带审判色彩，同时保留原文动态意象；后半句维持殉道场景的具体性和颂歌意象。
