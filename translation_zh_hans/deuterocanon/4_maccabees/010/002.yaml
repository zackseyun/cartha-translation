    issue: “把我和那些已经死去的人一同播下”句法含混且不自然。
    rationale: 原文的与格可表达与已死者共同的父系来源；中文应避免造成父亲将一群人实际播种的误读，同时仍保留“播下”的刻意生育比喻。
  - severity: low
    issue: “高声喊着说”及“我也在……长大”未充分体现现代汉语的简洁度和原文被动语态。
    rationale: “高声喊道”更自然；“被养育长大”更清楚表达 ἀνετράφην 所指的受养育、受塑造。
