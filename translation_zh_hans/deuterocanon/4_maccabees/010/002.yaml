  yaml_path: translation/deuterocanon/4_maccabees/010/002.yaml
  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: zh_hans
  text: 他高声喊道：“难道你们不知道，同一位父亲把我同那些已死去的人一同播下[a]，同一位母亲生下了我，而我也是在同样的教导中被养育长大的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “播下”直译希腊文的农业用语；这里以播种比喻父亲使儿女受生。“那些已死去的人”直译原文，未明确说明其具体身份。
    reason: 说明原文保留的生育比喻，并澄清该短语指已死者而不擅自限定为某一群体。
lexical_decisions:
- source_word: ἀναβοήσας ἔφη
  choice: 高声喊着说
  rationale: 兼顾分词所表达的高声呼喊和主要动词“说”，保留原文的强烈语气，同时符合现代汉语表达。
- source_word: ἀγνοεῖτε
  choice: 难道你们不知道
  rationale: 译作反问句，既自然，也保留对听者责问的力量。
- source_word: ἔσπειρεν
  choice: 播下
  rationale: 该词本义为“撒种、播种”，此处用于生育的比喻；正文保留农业意象，不将其直接化约为“生了”或“使……受孕”。
- source_word: τοῖς ἀποθανοῦσιν
  choice: 那些已经死去的人
  rationale: 这是不定过去时主动分词的与格复数，按其时态形态和上下文，指已经死去的人；与“一同”结合，表达说话人与先死者共有父系来源。
- source_word: ἐγέννησεν
  choice: 生下了
  rationale: 在母亲作主语时，这是自然、明确的现代汉语表达。
- source_word: ἀνετράφην
  choice: 长大
  rationale: 原词为被动，指受养育、培养而成长；与“在同样的教导下”搭配，清楚表达共同的成长塑造。
- source_word: δόγμασιν
  choice: 教导
  rationale: 此处指兄弟们共同接受、塑造其信念与行为的教诲；“教导”比“法令”宽广，也比“信条”少带后世制度化色彩。
theological_decisions:
- issue: 父亲行为的生育比喻（ἔσπειρεν）
  choice: 保留为“播下”并加脚注说明
  alternative: 译作“生了我”“使我受孕”
  rationale: 原文刻意使用播种意象，与随后母亲“生下”形成对应。保留比喻可避免抹平父母两种不同的生育表述，又不赋予其额外教义含义。
- issue: τοῖς ἀποθανοῦσιν所指对象的时间状态
  choice: 译作“那些已经死去的人”
  alternative: “必死的人”“将死的人”
  rationale: 希腊文形式是不定过去时分词，自然指已经死去者；在本段殉道叙事中，也适合指先前已经遇害的人。译文不进一步擅自将他们明确为“兄弟”，以保留原文较宽的指称。
- issue: δόγμασιν的宗教伦理内涵
  choice: 译作“教导”
  alternative: “信条”“规条”“原则”
  rationale: “教导”能涵盖共同接受的宗教与伦理塑造，同时避免把该词限定为正式信经、法律条文或抽象原则。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“高声喊着说”保留原文呼喊与说话两个成分；反问句维持殉道者坚定责问的语气。正文保留“播下”的陌生化比喻，并借脚注辅助理解。
