  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/061.yaml
  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: zh_hans
  text: 但云彩若受上帝命令，行经整个有人居住的世界，就完成所指定的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所命令的事”。希腊语τὸ ταχθέν可着重表示给云彩所指定或命令的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  choice: 云彩
  rationale: 与条件—时间结构连用，指受上帝命令的受造界元素；现代汉语以“云彩”作明确主语，自然且符合上下文。
- source_word: ἐπιταγῇ
  choice: 奉……之命
  rationale: 该词为ἐπιτάσσω的不定过去时被动虚拟式，表达云彩受到命令；“奉上帝之命”保留被动含义与上帝的施事角色，同时符合庄重自然的汉语。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 上帝
  rationale: ὑπό加属格标明被动结构中的施事者；置于“奉上帝之命”中直接呈现神圣施事者。
- source_word: ἐπιπορεύεσθαι
  choice: 行遍
  rationale: 该不定式描述云彩在世界各处运行；结合后面的全域范围，“行遍”比单纯“移动”更自然，也不额外解释其目的。
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: 整个有人居住的世界
  rationale: οἰκουμένη指有人居住的世界；此译保留“有人居住”这一语义成分及ὅλην所表达的整体范围。
- source_word: συντελοῦσι
  choice: 完成
  rationale: συντελέω在此表示切实完成或执行所规定之事；“完成”简洁地保留达成结果的意味。
- source_word: τὸ ταχθέν
  choice: 所指定的事
  rationale: 这是τάσσω的不定过去时被动分词中性单数名词化用法，可指被指定、安排或命令之事；“所指定的事”保留被动与语义开放性，避免过度强化决定论色彩。
theological_decisions:
- issue: τὸ ταχθέν所表达的上帝主权与命令性质
  choice: 所指定的事
  alternative: 所命令的事；所安排的事
  rationale: 语境强调云彩服从上帝所定的任务。“指定”既呈现神圣安排，又不把词义收窄为口头命令或引入超出本句的决定论含义；脚注保留“命令”的可能译法。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“一旦……就……”自然呈现ἐὰν与ὅταν构成的条件—时间关系；“奉上帝之命”明确神圣施事者；保留οἰκουμένη中“有人居住”的语义，并以脚注呈现τὸ ταχθέν的词义幅度。
