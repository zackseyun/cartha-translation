  text: But they howl, shouting before their gods, like some at a funeral meal for the dead.
translation:
  language: zh_hans
  text: 他们却在自己的神明面前号叫、高喊，像有些人在为死者举行的丧宴上那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为死者举行的丧宴”也可译作“为死者所设的宴席”“死者的宴席”或“丧葬宴席”。希腊文指与死者及哀悼礼俗有关的宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  choice: 号叫
  rationale: 该动词表示如野兽般或哀悼般的高声呼号；“号叫”保留了原文鲜明而带讥刺意味的声音形象。
- source_word: βοῶντες
  choice: 大声
  rationale: 分词表示高声呼喊；与“号叫”合译为“大声号叫”，既传达加强性的喧嚷，也避免现代汉语中生硬重复两个近义动词。
- source_word: ἐναντίον
  choice: 在……面前
  rationale: 保留此处主要的空间意义，即他们面对自己的神明发出呼声。
- source_word: τῶν θεῶν αὐτῶν
  choice: 自己的神明
  rationale: 原文直称“他们的神”；“神明”在现代汉语中自然地指受人崇奉的诸神，同时不在正文中先行解释为偶像。
- source_word: ὥσπερ τινὲς
  choice: 仿佛有人
  rationale: 自然表达比较和不定复数，不把所指群体具体化。
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: 在死者的丧宴上
  rationale: περίδειπνον指与死者及丧葬哀悼相关的宴席；“死者的丧宴”简明传达其文化场景，并保留“死者”这一属格成分。
theological_decisions:
- issue: 反偶像语境中 θεῶν 的译法
  choice: 神明
  alternative: 偶像
  rationale: 虽然上下文所指是偶像，希腊文仍明确称之为“他们的神”。正文保留这种措辞及其讽刺张力，不把解释直接代入翻译。
- issue: 末句声音动作是否由原文明确表达
  choice: 补出“哀号”以自然呈现比较所含的丧礼场景
  alternative: 仿佛有人在死者的丧宴上一样
  rationale: 希腊文比较短语省略了可由主句补足的动作。汉语若完全省略会显得悬空；“哀号”承接主句的号叫，并贴合丧宴语境，但作为语境性补足保留脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“大声号叫”保留原文喧嚷、近乎兽吼或哀鸣的形象；“神明”既自然又不将原文的 θεοί 直接释作“偶像”。脚注标记置于相关比较句之后。
