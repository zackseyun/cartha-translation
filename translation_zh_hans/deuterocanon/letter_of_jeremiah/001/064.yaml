  text: Therefore[a], knowing that they are not gods, do not fear them.
translation:
  language: zh_hans
  text: 所以，你们既然知道它们不是神，就不要怕它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνόντες
  choice: 你们既然知道
  rationale: 不定过去时分词在这里作伴随状语，并带有因由意味；“既然知道”自然地表明后面的命令以这一认识为依据。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中清楚、自然地保留其逻辑作用。
- source_word: οὐκ εἰσὶν θεοί
  choice: 它们不是神
  rationale: 直接保留否定判断和 θεοί 的基本词义，不把“神”扩展解释为“神明”或“神性存在”。汉语“神”可作类称，谓语中无需强行标示复数。
- source_word: μὴ φοβῆσθε
  choice: 不要怕
  rationale: 准确表达否定命令；“不要怕”简洁自然，也保留对所指对象的直接畏惧之意。
- source_word: αὐτούς
  choice: 它们
  rationale: 代词回指上文所论的偶像；使用非人的“它们”，既符合现代汉语习惯，也避免在正文中增添“偶像”这一解释性名词。
theological_decisions:
- issue: 反偶像语境中 θεοί 的译法
  choice: 神
  alternative: 神明；有神性的存在；算不得神
  rationale: 经文否认这些偶像是真神。“神”最直接对应 θεοί，并保留原文简明而有力的论断，不额外界定其本体性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式“所以……既然……就……”明确呈现推论、认识与命令之间的关系；不增加原文没有的解释。
