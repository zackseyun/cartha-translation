base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: zh_hans
  text: 因为它们是木制的，外面包金裹银，后来必显明它们是虚假的。万国和众王都必清楚看出，它们不是神，而是人手所造的；其中没有一样是神的作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντα ... ξύλινα
  choice: 本是木头的
  rationale: 保留偶像材质这一论证基础；“本是”自然表达其实际本质。
- source_word: περίχρυσα καὶ περιάργυρα
  choice: 外面包金裹银
  rationale: 分别体现两个并列复合形容词所指的金、银包覆，且符合现代汉语表达。
- source_word: ψευδῆ
  choice: 虚假的
  rationale: 保留该词可指虚假、骗人的性质，不窄化为单纯“假神”。
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: 人手所造的
  rationale: 以自然汉语传达“人手的作品”，并保留人为制造与神性相对的重点。
- source_word: οὐθὲν θεοῦ ἔργον ἐν αὐτοῖς
  choice: 其中没有一样是神的作为
  rationale: 贴近原文结构，避免擅自把“神的作为”具体化为能力、生命或神性。
theological_decisions:
- issue: θεοῦ 在末句可理解为“神”的属格，原文未带冠词
  choice: 神的作为
  alternative: 神明的作为／神所造的
  rationale: 上下文将偶像与真正的神相对；采用“神”最自然，同时不把属格强行解释成主语属格“神所造”。
- issue: ψευδῆ 的所指范围
  choice: 它们是虚假的
  alternative: 它们是假神
  rationale: 保留原文谓语形容词的宽度，使其既可指偶像虚假，也可涵盖其神性宣称不实，不提前消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“包金裹银”保持金银两项各自对应原文，同时避免生硬重复；全句维持宣告和揭露偶像本质的语气。
