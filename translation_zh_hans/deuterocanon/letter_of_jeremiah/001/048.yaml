  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/048.yaml
  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: zh_hans
  text: 因为当战争和灾祸临到它们[a]时，祭司们就彼此商议，在哪里能和它们一同藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指上下文一直提到的偶像或神像。
    reason: 交代代词的上下文所指，同时不在正文中明说原文仅以代词表达的内容。
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出一般性的未来情形；用“……时”既自然，也保留事件一旦发生时的条件意味。
- source_word: ἐπέλθῃ
  choice: 临到
  rationale: 保留ἐπί复合词所表达的“来到……身上、侵袭”之意，并与“战争和灾祸”自然搭配。
- source_word: πόλεμος
  choice: 战争
  rationale: 这是该词在此处最直接且范围合宜的译法，比“战斗”更符合整体危难语境。
- source_word: κακά
  choice: 灾祸
  rationale: 此处指战争伴随的有害事件，并非道德意义上的邪恶；“灾祸”庄重、清楚，也能保留较宽泛的含义。
- source_word: βουλεύονται
  choice: 商议
  rationale: 结合中间语态及πρὸς ἑαυτούς，表示祭司们共同筹议。
- source_word: πρὸς ἑαυτούς
  choice: 彼此
  rationale: 这里表达相互讨论，而非各自在心里思量；“彼此商议”符合现代汉语习惯。
- source_word: ποῦ
  choice: 哪里
  rationale: 直接保留地点疑问，并引出商议的内容。
- source_word: συγκαρυβῶσι
  choice: 一起藏起来
  rationale: 罕见动词表示隐藏， σύν-又含共同、同在之意；以“一起藏起来”保留祭司与偶像一同躲藏的讽刺意味。
- source_word: μετʼ αὐτῶν
  choice: 和它们
  rationale: 保留代词形式及其与无生命偶像相称的指称，不在正文中直接补成“偶像”。
theological_decisions:
- issue: αὐτά与αὐτῶν所指为何
  choice: 正文均译作“它们”，由脚注说明指上下文中的偶像或神像
  alternative: 在正文直接译作“偶像”或“神像”
  rationale: 希腊文使用代词，虽由上下文可明确其所指，正文仍应保留代词，以免把解释直接并入经文，同时保留祭司竟要与所侍奉之像一同躲藏的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为……时”承接上文论证；后半句稍作汉语语序调整，以“要躲到哪里去，好和它们一起藏起来”清楚表达商议内容及共同隐藏之意。
