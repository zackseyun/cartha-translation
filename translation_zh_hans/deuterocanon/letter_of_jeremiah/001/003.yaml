  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/003.yaml
  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: zh_hans
  text: 但如今，你们必在巴比伦看见银制、金制和木制的神，被扛在肩上，向列国显出可畏之状[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使列国惧怕”或“在列国中引起恐惧”。希腊文直译为“向列国显出恐惧”，既可能描述这些被抬着的神所呈现的可畏之状，也可能着重说明它们给观看者造成的效果。
    reason: 保留δεικνύντας φόβον τοῖς ἔθνεσιν在“呈现恐惧／可畏之状”与“使人惧怕”之间的词义歧义。
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: “如今”表达时间上的临近和转折，“但”保留δέ在上下文中的转折作用。
- source_word: ὄψεσθε
  choice: 你们必……看见
  rationale: 按ὁράω的将来时译为明确的预告；“必”自然表达将来必会发生之事。
- source_word: ἐν Βαβυλῶνι
  choice: 在巴比伦
  rationale: 保留明确的地点含义。
- source_word: θεοὺς
  choice: 神
  rationale: 原文直称“神”，而非“偶像”；保留这一称呼可维持原文的反讽，不预先代入译者的判断。
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: 银制、金制和木制的
  rationale: 三个形容词均说明材质；此译简洁自然，并完整保留三项并列。
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: 被扛在肩上
  rationale: 表达这些神由人负载搬运的被动图景；“扛在肩上”是现代汉语中自然、具体的说法。
- source_word: δεικνύντας φόβον
  choice: 显出可畏之状
  rationale: 保留“显出”这一表层动作及φόβος所含的畏惧、威慑意味，同时避免生硬且可能误解为这些神自己害怕的“显出恐惧”。
- source_word: τοῖς ἔθνεσιν
  choice: 向列国
  rationale: 保留与间接受词相关的方向性；“列国”符合犹太文献语境，也比“外邦人”较少加入解释。
theological_decisions:
- issue: θεοὺς应直译为“神”还是解释为“偶像”
  choice: 神
  alternative: 偶像／神像
  rationale: 原文使用θεοὺς。直译能保留作者对这些受崇拜之物的称谓及其反讽张力，不提前用解释性词语替作者下结论。
- issue: δεικνύντας φόβον所表达的是展示可畏之状，还是使列国惧怕
  choice: 向列国显出可畏之状
  alternative: 使列国惧怕／在列国中引起恐惧
  rationale: 希腊文直说“向列国显出恐惧／畏惧”，措辞压缩且存在语义张力。正文保留“显出”的结构，脚注说明也可能强调其对观看者造成的效果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“银制、金制和木制的神”保持材料并列；“被扛在肩上”形成清楚具体的图景。“可畏之状”略带书面色彩，但比“显出恐惧”更符合现代汉语，又可与脚注共同保存原文歧义。
