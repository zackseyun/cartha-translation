  text: And the women[a], with cords wrapped around themselves, sit in the streets[b], burning bran.
translation:
  language: zh_hans
  text: 妇女们把绳索缠在身上[a]，坐在街上，焚烧麦麸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把绳子围在自己身上”。原文没有说明这些绳索在此处的象征意义。
    reason: lexical_alternative
  - marker: b
    text: 原文的宾语是“麦麸”，而不是通常的香料；该动词可指焚香或使之冒烟。
    reason: cultural_note
lexical_decisions:
- source_word: περιθέμεναι
  choice: 缠在身上
  rationale: 该反身分词表示把某物围在自己身上；“缠在身上”自然地保留了环绕和反身含义，但不擅自说明其象征意义。
- source_word: σχοινία
  choice: 绳索
  rationale: 该词可指绳、索；“绳索”既保留其实体感，也不武断限定粗细。
- source_word: ἐν ταῖς ὁδοῖς
  choice: 在街道上
  rationale: 在公共或城市场景中，“街道”比“道路”更符合现代汉语习惯。
- source_word: ἐγκάθηνται
  choice: 坐
  rationale: 直接表达处于坐着的状态，符合本节描述性的行文。
- source_word: θυμιῶσα
  choice: 焚烧
  rationale: θυμιάω可指焚香或使之冒烟；因宾语是麦麸而非通常的香料，译作“焚烧”可避免增添原文未明说的祭香含义。
- source_word: τὰ πίτυρα
  choice: 麦麸
  rationale: πίτυρα通常指谷物的麸皮；“麦麸”是普通读者易懂的具体说法，不与“糠秕”或“谷壳”混同。
theological_decisions:
- issue: 妇女所行之事的仪式或象征意义
  choice: 只描述她们身缠绳索、坐在街上并焚烧麦麸
  alternative: 把绳索和焚烧麦麸明确解释为某种生育礼仪、宗教仪式或献香行为
  rationale: 希腊文只陈述可见动作，没有解释这些动作的象征意义；译文不引入文本之外的特定宗教解释。
- issue: θυμιῶσα与复数主语之间的数不一致
  choice: 按全句复数主语自然译为“妇女们……焚烧”
  alternative: 在中文中刻意呈现单数施事者，或另加“其中一个妇女”
  rationale: 现存希腊文本的分词为阴性单数，但上下文主语“妇女们”及并列动作均指向复数群体；中文无法自然复制这种形态不一致，且原文并未明确引入一名妇女，因此不增添单数人物。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“绳索”“街道”“焚烧麦麸”均为普通读者易懂的表达；不把动作解释成某一特定宗教礼仪。脚注分别说明反身环绕的译法和“麦麸”作为冒烟材料的特殊用语。
