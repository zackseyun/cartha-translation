  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/063.yaml
  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: zh_hans
  text: 因此，不应把它们看作神，也不应称它们为神，因为它们既不能对案件作出裁决，也不能造福于人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: 所以
  rationale: 承接上文并引出结论，保留推论语气，且符合现代汉语表达。
- source_word: νομιεῖσθαι
  choice: 把……当作
  rationale: 表示在判断或观念上视为、认作；“当作”自然清楚，并保留对其神明身份的否定。
- source_word: κλητέον ὑπάρχειν
  choice: 不可称……为
  rationale: 此结构表达不应如何称呼或名之；译文用“不可称它们为神”，与前句形成平行，并保留规范性语气。
- source_word: θεούς
  choice: 神
  rationale: 直接指所谓的神明；中文以“神”表达类属，既自然又准确。
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: 因为它们……不能
  rationale: 属格独立结构说明前述结论的理由；“因为”明确传达因果关系。
- source_word: κρίσιν κρῖναι
  choice: 审断案件
  rationale: 同根词组强调作出司法判断；“审断案件”保留法律语境，也符合现代汉语。
- source_word: εὖ ποιεῖν
  choice: 造福
  rationale: 表示行善于人或使人受益；“造福于人”简洁自然，准确体现受益含义。
- source_word: ἀνθρώποις
  choice: 于人
  rationale: 泛指人类或众人，不限定性别；“于人”与“造福”搭配庄重流畅。
theological_decisions:
- issue: 对偶像神性与神名称谓的双重否定
  choice: 不可把它们当作神，也不可称它们为神
  alternative: 不可认为它们是神，也不可叫它们作神
  rationale: 原文同时否定它们被认作神和被称为神，译文保留双重否定及反偶像崇拜的论辩力度，不额外加入本体论解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“审断案件”保留司法色彩；“造福于人”简练地表达使人受益。全句维持原文的平行结构和因果关系。
