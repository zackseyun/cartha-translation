  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: zh_hans
  text: 他手持权杖，像一个人，就是一地的审判官那样；他却不能除灭那向他犯罪的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除灭”也可译作“杀死”或“除掉”；原文动词涵盖这些意思，此处强调偶像无力惩罚向它犯罪的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: 权杖
  rationale: 指象征统治或权威的杖；“权杖”自然保留了这里君王与司法权威的意象。
- source_word: ὡς ἄνθρωπος κριτὴς χώρας
  choice: 好像一位治理一方的审判官
  rationale: 把ἄνθρωπος与κριτής连读为“一位……的审判官”，符合希腊语句法，也保留偶像外表具有人的司法权威这一讽刺性比较；“治理一方”自然表达χώρας所指的地域范围，而不把它限定为现代民族国家。
- source_word: ἀνελεῖ
  choice: 除灭
  rationale: ἀναιρέω可指杀死、除掉或消灭；“除灭”保留其语义宽度，并突出偶像无法实施惩罚。
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: 那得罪他的人
  rationale: ἁμαρτάνω与εἰς αὐτόν结合，在此可指对他犯错、冒犯他；“得罪他”在现代汉语中自然，也保留关系性与道德性的意味。
theological_decisions:
- issue: 偶像具有人的司法权威形象，却无力惩罚冒犯者
  choice: 直译其权杖和审判官形象，并以“却不能”明确语境所凸显的实际无能。
  alternative: 译作“统治一地的人”或仅说“不会杀死”，弱化司法意象或把动词限于杀人。
  rationale: 本句的讽刺张力在于权威象征与实际能力的反差；译文保留这一张力，不另行引入特定教派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“治理一方的审判官”避免生硬的“一个国家的审判官”，并保留χώρας的地域含义。主文中的“他”沿用希腊语阳性代词所呈现的拟人表达。
