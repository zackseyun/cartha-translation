base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/004.yaml
  text: Therefore be on your guard[a], lest you too, having become like the foreigners, become like them, and fear seize you because of them,
translation:
  language: zh_hans
  text: 所以，你们要谨慎，免得你们也变得像外族人，变得跟他们一样[a]，又因他们而被恐惧攫住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文连续两次使用同一个动词，也可译作：“被外族人同化……也被同化。”这里的重复带有强调作用。
    reason: 说明原文刻意重复同一动词，并提供较形式化的另一译法。
lexical_decisions:
- source_word: εὐλαβήθητε
  choice: 要谨慎
  rationale: 这里是不定过去时被动形式的命令语气，用于发出警告；“要谨慎”自然、庄重，并避免把它误解为敬虔意义上的“敬畏”。
- source_word: οὖν
  choice: 所以
  rationale: 表明本句是由上文的警告所得出的劝诫；“所以”清楚保留其推论关系。
- source_word: μὴ καὶ ὑμεῖς
  choice: 免得你们也
  rationale: 以自然的现代汉语表达否定性的警告结构，同时保留καί所强调的“你们也”。
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  choice: 变得像……变得跟……一样
  rationale: 原文以同一动词的分词和限定动词形式连续重复。译文保留这种看似冗复的强调，同时不用“同化”一类较技术化、容易引入现代社会学含义的词。
- source_word: τοῖς ἀλλοφύλοις
  choice: 外族人
  rationale: 该词指属于另一民族或族群的人。“外族人”比“外邦人”更少带后期宗教术语色彩，也比“外国人”更贴近其族群含义。
- source_word: φόβος ὑμᾶς λάβῃ
  choice: 被恐惧攫住
  rationale: 保留原文将恐惧描写为突然抓住人的生动力度；被动式汉语也能自然表达这一形象。
- source_word: ἐπʼ αὐτοῖς
  choice: 因他们
  rationale: 介词短语可表示与其对象相关或由其引起的恐惧。“因他们”简洁地保留这种关系，也不把代词所指过度限定为外族人或偶像。
theological_decisions:
- issue: 重复使用ἀφομοιόω的警告范围
  choice: 保留“变得像外族人，变得跟他们一样”的宽泛措辞
  alternative: 明确译成“仿效外族人的偶像崇拜行为”
  rationale: 上下文很可能是在警告读者不要仿效周围民族对偶像的态度和行为，但希腊文本本身没有在本句中明说“偶像崇拜行为”。译文因此保留原文的宽度，不把警告扩大为反对一切社会接触，也不把其对象解释得过窄。
- issue: αὐτοῖς的指代
  choice: 译作“他们”，保留代词指向的开放性
  alternative: 明确译作“那些偶像”或“外族人”
  rationale: 本句语法上最近出现的是“外族人”，而较大上下文涉及使人惧怕的偶像。直接指定其中一个所指会消除原文在当前句中的可能歧义，因此保留代词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“被恐惧攫住”稍具文学色彩，用来保存希腊语意象；重复的“变得像……变得跟……一样”是有意保留原文修辞，而非删改为更顺滑却失去强调的表达。
