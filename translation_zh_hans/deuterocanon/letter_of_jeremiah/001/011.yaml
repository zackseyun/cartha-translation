  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
translation:
  language: zh_hans
  text: 但这些偶像虽身披紫色衣袍，却不能免受锈蚀和虫蛀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虫蛀”或译“吞噬它们之物”。希腊语βρωμάτων的含义比衣蛾更宽；但这里提到衣袍，可能特指蛀虫一类。
    reason: 保留βρωμάτων可泛指啃食、侵损之物的词义范围，同时说明衣物语境支持以虫蛀理解。
lexical_decisions:
- source_word: οὗτοι
  choice: 这些偶像
  rationale: 指代上下文所论的偶像；汉语若只说“这些”容易指代不明，因此补出语境中明确的所指。
- source_word: οὐ διασώζονται
  choice: 不能免受
  rationale: 这里所说的是偶像无法保全自身、免遭物质损坏；此译自然表达其无力抵御侵蚀，又避免带入属灵“得救”的含义。
- source_word: ἀπὸ ἰοῦ
  choice: 锈蚀
  rationale: ἰός 在物质朽坏的语境中指锈或腐蚀；“锈蚀”兼顾具体锈坏与较宽的腐蚀含义。
- source_word: βρωμάτων
  choice: 蛀害
  rationale: βρώματα 字面可指啃食、吞噬之物；因下文提到衣服，“蛀害”自然让人联想到虫蛀，同时比明确译作“蛾子”更保留原词的宽泛性。
- source_word: περιβεβλημένων αὐτῶν
  choice: 虽披着
  rationale: 属格独立结构在此具有让步意味，突显偶像纵有华贵装饰仍会朽坏的反讽。
- source_word: ἱματισμὸν πορφυροῦν
  choice: 紫色衣服
  rationale: ἱματισμός 指衣着或衣服，πορφυροῦν 指紫色、紫染的；此译简洁自然，并保留华贵衣饰的意象。
theological_decisions:
- issue: 反偶像语境中 διασώζονται 的含义
  choice: 指偶像不能保全自身、免遭物质侵蚀
  alternative: 作较宽泛的“不能得救／不能获救”
  rationale: 紧邻语境谈的是锈蚀、啃食之物和衣服，重点在偶像会遭受物质朽坏且无力自保，不宜赋予该动词属灵救恩色彩。
- issue: περιβεβλημένων αὐτῶν 的逻辑关系
  choice: 译为让步关系“虽披着”
  alternative: 译为同时发生的“披着／当它们披着”
  rationale: 希腊语形式本身可表达伴随情形，但上下文的反讽更支持让步理解；华贵的紫衣并不能保护偶像免于朽坏。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这些偶像”补明汉语所需的指代对象；以“虽……却……”呈现原句的反讽和让步张力。脚注标记已在正文中以[a]出现。
