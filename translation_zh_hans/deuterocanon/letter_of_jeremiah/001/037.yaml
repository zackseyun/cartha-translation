  text: They will never show mercy to a widow[b][a], nor do good to an orphan.
translation:
  language: zh_hans
  text: 他们绝不会怜悯寡妇[a]，也不会善待孤儿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝不会”对应希腊文的强调否定οὐ μή，也可译作“决不怜惜寡妇”。
    reason: lexical_alternative
  - marker: b
    text: “善待孤儿”也可译作“使无父的孩子得益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήραν
  choice: 寡妇
  rationale: 该词为阴性单数宾格，泛指社会中失去丈夫、需要扶助的人；现代汉语用“寡妇”自然清楚，也保留原文的代表性单数。
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: 绝不会怜悯
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”体现强调语气，“怜悯”准确传达ἐλεέω所含的同情与施怜悯之意。
- source_word: οὔτε
  choice: 也不会
  rationale: 该连词承接前一否定分句，引出并列的第二项否定；汉语以“也不会”衔接最自然。
- source_word: ὀρφανῷ
  choice: 孤儿
  rationale: 该词为单数与格，指失去父母或父亲的孩子；“孤儿”是现代汉语中清楚、通行的表达，并保留弱势群体的伦理意涵。
- source_word: εὖ ποιήσουσιν
  choice: 善待
  rationale: εὖ ποιέω可指向某人行善、使其得益或好好对待他；“善待”简洁自然，同时保留实际施惠的含义。
theological_decisions:
- issue: χήρα与ὀρφανός这一弱势群体组合的表达
  choice: 寡妇／孤儿
  alternative: 寡妇／无父的孩子
  rationale: 这组词代表圣经伦理中尤其需要保护和照顾的人。采用现代通行的“寡妇／孤儿”，不引入额外的教派解释，也不削弱经文对偶像无力施助的批判。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“绝不会”保留希腊文强调否定的力度；“善待”使后半句自然凝练，同时脚注保留“使……得益”和“无父的孩子”等词义可能。
