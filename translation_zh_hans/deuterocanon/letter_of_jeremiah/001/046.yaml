- source_word: αὐτοί τε
  choice: 自己也
  rationale: αὐτοί强调造像者本人，τε承接上下文并增添一项论述；“自己也”在现代汉语中自然地保留这两层作用。
- source_word: οἱ κατασκευάσαντες
  choice: 制造……的人
  rationale: 该过去时分词指制作这些偶像的工匠。“制造”清楚表达加工、制成之意，又不过度限定具体工艺。
- source_word: αὐτά
  choice: 它们
  rationale: 代词回指上下文中的偶像；用“它们”保持原文的代词表达，不在本节重复补出名词。
- source_word: οὐ μὴ γένωνται
  choice: 绝不会
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”准确传达其强调语气。系词含义与后面的谓语形容词合并为自然汉语。
- source_word: πολυχρόνιοι
  choice: 长寿
  rationale: 该谓语形容词意为“长久存活的、长寿的”；用于人时译作“长寿”简洁自然。
