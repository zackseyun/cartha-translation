  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/047.yaml
  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: zh_hans
  text: 那么，他们所造的东西又怎能长存呢？因为他们留给后来的人的是谎言和耻辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在μέλλει后未明说后续动作；也可较直译为：“那么，他们所造的东西究竟会怎样呢？”
    reason: 保留μέλλει在未带明说不定式时的语义开放性；正文“长存”依据反问语境表达其可能的持续或存留。
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: 那么……又怎能
  rationale: πῶς引出反问，τε δὴ带有承接和强调意味；“那么……又怎能”既自然，也保留推论语气。
- source_word: μέλλει
  choice: 能长久
  rationale: μέλλει本身带有面向将来的意味，而此处希腊文表达简略，没有明说后续动作。结合反问语气，译作“能长久”表达这些人造之物能否持续存在，同时以脚注保留较直译的开放表达。
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: 他们所造的东西
  rationale: κατασκευασθέντα指制作、建造出来的事物；上下文所指为偶像或祭祀器物，但正文不直接补入“偶像”，以免缩窄原文措辞。
- source_word: κατέλιπον
  choice: 留给
  rationale: 此处强调制造者遗留给后人的结果；中文“留给”比“抛下”更准确地体现传给后世的意味。
- source_word: ψεύδη
  choice: 谎言
  rationale: 保留复数名词的论战性含义；中文以集合意义的“谎言”表达自然，无须机械添加复数标记。
- source_word: ὄνειδος
  choice: 耻辱
  rationale: ὄνειδος可指羞耻、辱骂或受人非议；“耻辱”在此兼顾羞耻与污名。
- source_word: τοῖς ἐπιγινομένοις
  choice: 后来的人
  rationale: 指随后出现的人或后世之人；“后来的人”简明自然，并保留其范围，不限定为某一代。
theological_decisions:
- issue: “他们所造的东西”的具体所指
  choice: 正文保留概括说法，不直接译作“偶像”
  alternative: 按上下文明确译作“他们所造的偶像”
  rationale: 全书上下文表明所指是人手所造的偶像或祭祀物件，但本句希腊文只说“所造的东西”。保留概括措辞可避免把上下文解释直接写入正文。
- issue: μέλλει所表达的反问内容
  choice: 译作“又怎能长久呢”
  alternative: 译作“究竟会怎样呢”
  rationale: 希腊文表达简略，μέλλει带有将来趋向，却未明说一个不定式。主译文依反问语境表达其持续、存留的前景；脚注保留更贴近形式且更开放的译法，不把含义绝对化。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“不过是”增强原文反偶像论述中的反问和贬斥力度，但不添加宗派性解释。脚注标记[a]已在正文中出现。
