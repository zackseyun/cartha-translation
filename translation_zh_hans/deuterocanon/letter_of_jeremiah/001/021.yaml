  text: Upon their bodies and upon their heads bats[a], swallows, and the birds alight, and likewise also the cats.
translation:
  language: zh_hans
  text: 蝙蝠、燕子和飞鸟落在它们的身躯和头上，猫也同样如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: 在它们的身躯和头上
  rationale: 保留介词ἐπί的空间意义及其重复所强调的两个部位；αὐτῶν表明所指为复数偶像，现代汉语以“它们的”统摄“身躯和头”最为自然。“身躯”比“身体”略庄重，也凸显偶像只有外在形体。
- source_word: ἐφίπτανται
  choice: 落在
  rationale: 该动词表示飞到某物之上并停落；“落在”既能涵盖飞行动作的结果，也适用于所列的鸟类和蝙蝠，简明自然。
- source_word: νυκτερίδες
  choice: 蝙蝠
  rationale: 该词的通常动物名称，按字面翻译。
- source_word: χελιδόνες
  choice: 燕子
  rationale: 该词通常指燕子，保留具体物种，不泛化为鸟。
- source_word: τὰ ὄρνεα
  choice: 飞鸟
  rationale: ὄρνεα泛指鸟类；“飞鸟”在现代中文中自然且略具书面庄重感，并与前面的具体种类形成由具体到概括的列举。
- source_word: ὡσαύτως δὲ καὶ οἱ αἴλουροι
  choice: 猫也同样如此
  rationale: “也同样如此”保留ὡσαύτως、δέ与καί的转接和附加强调；αἴλουροι按通常意义译为“猫”。由于猫并非飞禽，用“如此”承接前述停落于偶像身上的情景，避免不自然地说猫“飞落”。
theological_decisions:
- issue: 本节对偶像的讽刺性质
  choice: 按字面呈现各种动物停落在偶像身上的画面，以显出偶像的无能为力。
  alternative: 将动物或其行为解释为象征性的宗教意象。
  rationale: 希腊文本只陈述具体景象，并未赋予这些动物象征意义；直译能够保留其对偶像无力自保的朴素讽刺，而不增添教派性解释。
translation_notes:
  register: 采用现代、清楚而略庄重的普通话。“蝙蝠、燕子和飞鸟”前置为主语，使句子符合汉语信息结构；“猫也同样如此”保留原文末项的追加效果。无需脚注：ἐφίπτανται在此译作“落在”已自然涵盖飞来停落之义，英文咨询层脚注中的替代说法在中文里不会形成有意义的译法差异。
