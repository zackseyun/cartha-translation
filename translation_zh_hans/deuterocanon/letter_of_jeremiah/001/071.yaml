  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/071.yaml
  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
translation:
  language: zh_hans
  text: 从它们身上腐烂的紫色衣料和大理石，便会知道它们不是神；后来，它们自己也会被吃掉[a]，并要在这地上成为耻辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“后来，它们自己也会被耗尽／被吞噬。”希腊文直译为“会被吃掉”，可能指被虫兽啃食，或因腐朽而消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύρας
  choice: 紫色衣料
  rationale: πορφύρα在此指覆盖或装饰偶像的贵重紫色织物；译作“紫色衣料”比单说“紫色”更清楚，同时不限定为某种特定服饰。
- source_word: μαρμάρου
  choice: 大理石
  rationale: μάρμαρον通常指大理石或光亮的石材；“大理石”直接保留原文所指的贵重装饰材料。
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: 在它们身上腐烂的
  rationale: σηπομένης表达腐朽、败坏；“腐烂”保留原文鲜明而带讽刺性的形象，即偶像身上的贵重装饰也会败坏。虽然“大理石腐烂”在现代汉语中不寻常，这里仍保留希腊文的统摄表达，不擅自改为风化或碎裂。
- source_word: γνωσθήσεται
  choice: 就可以看出
  rationale: 该将来被动式在这里表示事实将变得明显、可被识别；“就可以看出”符合现代汉语，也保留由外在腐坏证明偶像虚假的逻辑。
- source_word: θεοί
  choice: 神
  rationale: θεοί是否定这些偶像具有神性；汉语在“并不是神”中无需用复数形态，也能准确表达。
- source_word: ἐξ ὑστέρου
  choice: 到最后
  rationale: 该短语表示后来、最终发生的事；“到最后”兼具时间推进和最终结局之意。
- source_word: βρωθήσονται
  choice: 会被吃掉
  rationale: βρωθήσονται字面义为“将被吃”；直译保留具体意象，并不擅自指定是虫兽啃食还是腐朽消耗。
- source_word: ὄνειδος
  choice: 羞耻
  rationale: ὄνειδος可指羞辱、耻辱或受人讥笑之物；“成为羞耻”简洁庄重，并保留公开蒙羞的含义。
- source_word: ἐν τῇ χώρᾳ
  choice: 在这地
  rationale: χώρα可指一片土地、地区或国家；“在这地”自然且保留地理范围的宽泛性。
theological_decisions:
- issue: 腐坏材料及末后蒙羞之对象
  choice: 将后半句的“它们自己”理解为偶像，贵重装饰的腐坏则成为偶像不是神的证据。
  alternative: 也可能把前述紫色衣料和大理石视为后续复数代词所承接的主要对象。
  rationale: 中性复数αὐτά可回指语境中的偶像，而全书论证的焦点是偶像的无能与败坏；但语法上的回指仍有一定含混，因此译文沿用“它们”，不另加“偶像”来完全消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“它们”延续无生命偶像的指称；“从……就可以看出”自然呈现证据关系。主文保留“被吃掉”的具体措辞，并以脚注说明其可能范围，避免过度解释。
