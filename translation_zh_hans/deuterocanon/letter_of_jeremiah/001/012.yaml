  source_fidelity: 译文准确传达了因屋中尘土覆盖偶像而擦拭其脸的基本意思，并适当保留了οἰκία的“屋／房屋”而未擅译为“庙宇”。不过，“人就”中的“就”带入原文没有的顺承意味；“积在它们身上很多”也不够自然，且未充分表达πλείω在此指尘土大量、厚重地覆在其上的语境意义。
