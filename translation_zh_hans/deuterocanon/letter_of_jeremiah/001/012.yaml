  text: They wipe off their faces because of the dust from the house[a], which is thick upon them.
translation:
  language: zh_hans
  text: 因为屋中的尘土厚厚地覆在偶像身上，有人擦拭偶像的脸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厚厚地覆在”较直译为“在它们身上的更多”。这里是说屋中的尘土大量覆在偶像身上。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκμάσσονται
  choice: 人就擦拭
  rationale: 该中间／被动形式在上下文中指偶像的脸被人擦拭。中文明确补出泛指施事“人”，既自然，也避免让读者误以为偶像能自行行动。
- source_word: τὸ πρόσωπον αὐτῶν
  choice: 它们的脸
  rationale: πρόσωπον虽为单数，但与复数属格代词连用，中文按所指的多个偶像自然译为“它们的脸”。
- source_word: διὰ τὸν ... κονιορτόν
  choice: 由于……尘土
  rationale: διά加宾格在此表原因；κονιορτός具体指尘土，而非泛指污垢。
- source_word: ἐκ τῆς οἰκίας
  choice: 屋里的
  rationale: οἰκία字面为“房屋、屋子”；此处虽可按语境理解为安放偶像的建筑，但不直接增译为“庙宇”或“神殿”。
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: 积在它们身上很多
  rationale: 保留πλείων的比较／数量表达“更多、很多”，并用“积在”自然呈现尘土覆盖偶像的情景，不将其过度具体化为“很厚”。
theological_decisions:
- issue: 复数代词及擦拭动作的施事
  choice: 代词指偶像，擦拭者以泛指的“人”补出
  alternative: 按表面句法译成“它们擦拭自己的脸”，或采用纯被动“它们的脸被擦拭”
  rationale: 上下文讽刺偶像无能，必须依赖人照料。补出泛指施事符合希腊语中间／被动形式的语境功能，同时不把某一特定群体（如祭司）擅自写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“屋里”贴近原文οἰκία；“人就擦拭”使隐含施事在中文中清楚，同时保留偶像依赖人照料的讽刺意味。脚注标记已置于正文。
