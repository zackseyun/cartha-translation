  terminology: “偶像”符合本段上下文，也使“它们”所指明确。“屋中”对应οἰκίας，避免将建筑性质特定化。“厚厚地覆在”是对πλείω ἐπʼ αὐτοῖς的合乎语境的表达；脚注保留其较字面的“更多”措辞及数量含义。
