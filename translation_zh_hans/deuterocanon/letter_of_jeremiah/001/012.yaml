  rationale: 修订使汉语更自然，并删去无对应的“就”。以“偶像”明确上下文所指，以“有人擦拭”在不指定任何特定施事者的前提下表达该句在偶像讽刺语境中的隐含照料者。脚注保留πλείω的较字面数量表达，避免将“厚厚地”误作唯一可能的词汇意义。
