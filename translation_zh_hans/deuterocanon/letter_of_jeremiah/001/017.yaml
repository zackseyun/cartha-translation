  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: zh_hans
  text: 正如一个得罪君王、被押去受死的人，庭院严密地围在他四周[a]；照样，祭司用门、锁和门闩严加防护偶像的房屋[b]，免得被强盗掠夺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊语的句法较难。也可译作：“正如庭院围在一个得罪君王的人四周。”大意是，一个被押去受死的犯人四周受到严密防卫。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们的房屋”；按上下文，指偶像的房屋，即祭司看守的庙宇建筑。
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: 庭院就在他四周严密围住
  rationale: αὐλαί通常指庭院；这一希腊语短语句法艰涩，完成时被动态表达已经围住、戒备森严的状态。译文保留空间意象，同时不把建筑形制说得过于具体。
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: 有人得罪了君王
  rationale: ἀδικέω表示行不义、冒犯或损害；在君王与受押者的司法语境中，“得罪了君王”自然且保留原文宽泛含义。
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: 仿佛他正被押去处死
  rationale: ἀπάγω有在看押下带走之意；“被押去”体现受拘押状态，“处死”自然传达ἐπὶ θάνατον，但由“仿佛”保留比较结构。
- source_word: ὀχυροῦσιν
  choice: 严加防护
  rationale: 该动词意为加固、防守。中文“严加防护”既自然，又与上下文中门、锁、门闩的累积描写相称。
- source_word: τοὺς οἴκους αὐτῶν
  choice: 它们的房屋
  rationale: οἴκους直译为“房屋”，αὐτῶν在语境中指偶像。保留字面表达，不在正文中直接释作庙宇。
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: 用门、锁和门闩
  rationale: 三项均为实体防护设施；“门、锁和门闩”在现代汉语中清楚，并保留原文逐项罗列的加强效果。
- source_word: συληθῶσι
  choice: 被……掠夺
  rationale: συλάω表示剥夺、洗劫或掠夺；此处描述强盗劫掠房屋财物，“掠夺”贴合语境。
- source_word: λῃστῶν
  choice: 强盗
  rationale: λῃστής通常指抢劫者或匪徒，可能带暴力意味；“强盗”比一般的“贼”更准确。
theological_decisions:
- issue: 反偶像语境中“它们的房屋”的所指
  choice: 正文译作“它们的房屋”，并以脚注说明是偶像的房屋或庙宇建筑。
  alternative: 直接译作“它们的庙宇”或“神龛”。
  rationale: 原文使用普通名词οἶκος，并以代词指向偶像。保留“房屋”既忠于措辞，也保留讽刺意味；脚注则帮助现代读者辨明所指，而不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“又好像……照样……”呈现原文类比；“门、锁和门闩”保留累积节奏。首句因原文句法艰涩，在正文中作最少量顺句处理，并用脚注保存另一种结构理解。
