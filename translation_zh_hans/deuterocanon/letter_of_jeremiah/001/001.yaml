  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/001.yaml
  text: Because of your sins[a], which you committed against God, you will be carried away captive to Babylon by Nebuchadnezzar king of the Babylonians.
translation:
  language: zh_hans
  text: 由于你们得罪了上帝[a]，你们必被巴比伦人的王尼布甲尼撒掳到巴比伦去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“由于你们的罪，就是你们向上帝所犯的罪。”希腊文用同源的名词和动词重复“罪／犯罪”这一概念。
    reason: 说明原文的同源重复及正文为符合现代汉语所作的调整。
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας ὑμῶν ἃς ἡμαρτήκατε
  choice: 由于你们得罪了
  rationale: διά加宾格表示原因；名词ἁμαρτίας与同源动词ἡμαρτήκατε构成重复。汉语以“得罪了”自然表达犯罪过错，同时将希腊语的同源重复保留在脚注中。
- source_word: ἐναντίον τοῦ θεοῦ
  choice: 上帝
  rationale: 与“得罪”连用时，“得罪上帝”自然地表达ἐναντίον在此处所含的敌对和道德冒犯之意，而非仅指在上帝面前。
- source_word: ἀχθήσεσθε ... αἰχμάλωτοι
  choice: 必被……掳……去
  rationale: 未来被动式与αἰχμάλωτοι共同描写被强行带走成为俘虏；“被掳去”是现代汉语中简洁、清楚的流放语境表达。
- source_word: εἰς Βαβυλῶνα
  choice: 到巴比伦去
  rationale: εἰς标明目的地；“到……去”符合现代汉语语序。
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: 被……尼布甲尼撒
  rationale: ὑπό在被动结构中标示施事者；采用现代中文圣经传统中通行的人名译法“尼布甲尼撒”。
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: 巴比伦人的王
  rationale: 依照希腊文保留族群属格“巴比伦人的”，不改写成“巴比伦王”。
theological_decisions:
- issue: ἁμαρτίας……ἡμαρτήκατε的同源重复
  choice: 正文译为“由于你们得罪了上帝”，脚注说明直译的重复
  alternative: “由于你们所犯的罪，就是你们得罪上帝的罪”
  rationale: 逐字保留会使现代汉语累赘而不自然；正文保留罪责与因果关系，脚注则让读者看见原文借重复所作的强调。
- issue: ἐναντίον τοῦ θεοῦ的关系与道德含义
  choice: 以“得罪上帝”表达
  alternative: “在上帝面前犯罪”
  rationale: 流放审判的语境支持“冒犯、敌对”的意义；“在上帝面前”可能仅被理解为空间或见证意义，削弱原文的道德力度。
- issue: 被掳至巴比伦的施事关系
  choice: 尼布甲尼撒为“被掳”动作的施事者
  alternative: “在尼布甲尼撒统治下被掳”
  rationale: ὑπό加属格在被动句中直接标示施事者，不宜弱化为一般统治背景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必被……掳……去”保留预告审判的确定语气；“巴比伦人的王”有意贴近希腊文，而非惯常简化为“巴比伦王”。
