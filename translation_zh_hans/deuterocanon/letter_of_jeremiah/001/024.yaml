  text: They are bought at every price[a], but there is no breath in them.
translation:
  language: zh_hans
  text: 它们是用各种价钱买来的，但其中没有气息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵”。希腊语πνεῦμα可指“气息”“灵”或“风”；这里强调偶像没有生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: 花各种价钱
  rationale: 保留原文涉及“各种价钱／价值”的宽泛表达，并以现代汉语自然呈现购买所付的代价，不将其限定为“高价”。
- source_word: ἠγορασμένα ἐστίν
  choice: 是……买来的
  rationale: 体现ἀγοράζω完成时被动分词的购买及被动含义；“买来的”在汉语中也自然暗示已经购得后所处的状态。
- source_word: ἐν οἷς
  choice: 里面
  rationale: 指向前述偶像，简洁保留“在它们之中”的处所含义。
- source_word: πνεῦμα
  choice: 气息
  rationale: 在讽刺偶像的语境中，“气息”具体表达它们没有生命；同时以脚注保留“灵”的词义可能性。
theological_decisions:
- issue: 偶像语境中πνεῦμα的含义
  choice: 气息
  alternative: 灵
  rationale: 本句的直接论点是偶像虽由人出价购得，却没有生命。“气息”传达生命迹象而不额外强化形而上的断言；因πνεῦμα确可指“灵”，故在脚注中保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但”直接呈现前后反差；“花各种价钱买来的”保留商业购买意象，避免把原文具体化为“高价”。
