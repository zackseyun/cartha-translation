  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/005.yaml
  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
translation:
  language: zh_hans
  text: 你们看见有一群人在它们前后向它们下拜[a]时，却要在心里说：“主宰啊，人必须敬拜的是你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可译作“敬拜”。希腊语 προσκυνέω 既可指俯伏、下拜的身体动作，也可指宗教性的敬拜。
    reason: 保留该希腊动词在身体动作与宗教行为之间的词义幅度。
lexical_decisions:
- source_word: ἰδόντας
  choice: 你们看见……时
  rationale: 原文是分词，结合后面的复数命令语气 εἴπατε，在此作时间状语理解；译成“你们看见……时”既明确又保留其时间关系。
- source_word: ὄχλον
  choice: 一群人
  rationale: ὄχλος 指聚集的人群；“一群人”是自然、清楚的现代汉语表达。
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: 在它们前后
  rationale: 保留人群位于这些偶像前面和后面的空间图景，同时避免汉语中不必要的重复。
- source_word: προσκυνοῦντας αὐτά
  choice: 向它们下拜
  rationale: προσκυνέω 既可指俯伏、下拜的身体动作，也可指敬拜。此处采用“下拜”，突出可见的动作，并以脚注保留“敬拜”的可能含义。
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: 却要在心里说
  rationale: διάνοια 指思想、心思等内在思维活动；“在心里说”自然表达不出声的内在回应。δὲ 译作“却”，显出与人群拜偶像之间的对比。
- source_word: Σοί
  choice: ……的是你
  rationale: 原文将第二人称代词置于句首以示强调；汉语用“人必须敬拜的是你”这一焦点结构自然地保留强调。
- source_word: δεῖ
  choice: 必须
  rationale: δεῖ 表示必要或应当如此；“必须”保留其义务和必然色彩，又不擅自补入“我们”等原文没有的主语。
- source_word: προσκυνεῖν
  choice: 敬拜
  rationale: 这里以神为直接对象，宗教意义明确，因此译作“敬拜”比只描述身体动作的“下拜”更合适。
- source_word: Δέσποτα
  choice: 主宰
  rationale: Δέσποτα 表示拥有权柄的主人或统治者，并非 κύριε；“主宰”既保留其权柄含义和庄重称呼，也避免与通常译作“主”的 κύριος 混同。
theological_decisions:
- issue: 对神的称呼 Δέσποτα
  choice: 主宰
  alternative: 主人；主；至高掌权者
  rationale: 本节以对偶像的假敬拜与唯独应向神献上的敬拜相对照。采用“主宰”可表达 Δέσποτα 所含的所有权和绝对权柄，同时保留它与 κύριος 的词汇区别，不将原文统一成另一神圣称号。
- issue: Σοί 的强调及敬拜义务的主体
  choice: 人必须敬拜的是你
  alternative: 必须敬拜你；我们必须敬拜你
  rationale: 原文强调“你”，而 δεῖ 未明说执行者。译文用“人”作泛指，并以“……的是你”保留焦点，避免擅自限定为“我们”，也不把唯独敬拜神的意味弱化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“它们”承接上下文中的偶像；“主宰啊”保持祷告式直接称呼的郑重语气。
