  terminology: “下拜”与“敬拜”的区分处理得当：前者描绘可见动作，后者用于对神当有的宗教性敬拜。脚注准确说明προσκυνέω的语义范围，且锚点位置正确。“主宰”是Δέσποτα在本句语境中安全、庄重的对应。
