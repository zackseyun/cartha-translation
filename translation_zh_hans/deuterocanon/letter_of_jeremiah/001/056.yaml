  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: zh_hans
  text: 那么，怎能接受或认为它们是神呢？这些木制的神，外面包着银和金，绝不能保护自己免遭小偷或强盗的侵害。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接受或认为”也可译作“认可或认定”。希腊文连用两个表示应当如何判断的动词性形容词，加强了反问的力度。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“木制的神，包银的、包金的”；这种措辞显出这些被称为神的对象只是经过制作和包覆的物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: 那么，怎么还能
  rationale: 承接上文并引出带推论意味的反问；“还能”自然体现论证推进，但不额外改变命题内容。
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: 接受或认为
  rationale: 两个以 -τέον 构成的动词性形容词都表达“应当/可以如此看待”的判断。“接受或认为”保留并列措辞及反问语气；前者也可理解为“认可”。
- source_word: ὅτι εἰσὶν θεοί
  choice: 它们是神
  rationale: 直译谓语从句，保留 θεοί 的“神”，不在正文中先行改写为“偶像”，从而维持原文的讽刺。
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: 免遭小偷或强盗的侵害
  rationale: 分别保留 κλέπται 与 λῃσταί 的近义差别；补出“侵害”使现代汉语句法完整，并表明其无法抵御二者。
- source_word: οὐ μὴ διασώσωνται
  choice: 绝不能保护自己
  rationale: οὐ μή 加虚拟式构成强烈否定；中间语态在此突出这些所谓神明连自身也无法保全的讽刺效果。
- source_word: θεοὶ ξύλινοι
  choice: 木头做的神
  rationale: 保留 ξύλινοι 的材质含义和 θεοί 的字面表达，以显出原文将“神”与木制物并置的讽刺。
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: 外包银、外包金
  rationale: 两个复合形容词表示周身覆以银或金；“外包”清楚呈现贵金属只是木胎外层，并保留两个词的平行结构。
theological_decisions:
- issue: 反偶像语境中 θεοί 的译法
  choice: 神
  alternative: 偶像／所谓的神
  rationale: 原文明确使用 θεοί，并以这些对象不能自保来否定其神性。正文保留“神”，让反问与后句自行形成讽刺，不把解释直接嵌入译文。
- issue: διασώσωνται 所表达的自保能力
  choice: 保护自己
  alternative: 逃脱／得救
  rationale: 上下文的主语是木制、包银包金的“神”；译作“保护自己”最直接呈现其无力自保的神学与修辞张力，同时不暗示另有外力营救。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么，怎么还能……”保持论辩性反问；“木头做的神，外包银、外包金”以并列短语保留希腊文的突兀讽刺。所有脚注标记均置于正文相关句末。
