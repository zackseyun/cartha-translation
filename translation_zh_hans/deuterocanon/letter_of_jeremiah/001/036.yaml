  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/036.yaml
  text: They certainly cannot set a blind man upright for seeing[a], nor can they rescue a man when he is in distress.
translation:
  language: zh_hans
  text: 他们绝不能使盲人看见[a]，也绝不能救出身陷困境的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词与“为看见”的搭配十分紧凑；也可较直译为“使一个盲人为看见而站立起来”。按上下文，通常理解为“使盲人看见”。
    reason: 保留περιστήσωσιν εἰς ὅρασιν在形式及语义上的解释余地，同时避免“重见”所预设的既往视力。
lexical_decisions:
- source_word: ἄνθρωπον τυφλὸν
  choice: 盲人
  rationale: ἄνθρωπον在这里泛指一个人，τυφλὸν说明其失明；现代汉语用“盲人”自然、简洁，也不必为希腊语的语法性别强加男性含义。
- source_word: εἰς ὅρασιν
  choice: 重见光明
  rationale: 该短语字面指“进入／达到看见的状态”，在此与动词合用，表达使盲人获得视力；“重见光明”是自然庄重的现代汉语，同时保留结果意义。
- source_word: οὐ μὴ
  choice: 绝不能
  rationale: οὐ μή构成强烈否定，强调这些偶像完全没有这种能力；“绝不能”准确传达其语气。
- source_word: περιστήσωσιν
  choice: 使……重见
  rationale: 该动词在此与εἰς ὅρασιν构成紧凑表达，可理解为使人进入某种状态。译文按整体语义处理为“使……重见光明”，脚注保留较贴近字面的理解。
- source_word: ἐν ἀνάγκῃ ἄνθρωπον ὄντα
  choice: 身陷困境的人
  rationale: ἀνάγκη在此表示危难、困苦或迫切处境，ὄντα说明人正处于其中；“身陷困境”清楚传达这种状态。
- source_word: ἐξέλωνται
  choice: 救出
  rationale: ἐξαιρέω的中间语态在此指从危难中解救；“救出”既保留脱离困境的方向感，也符合现代汉语。
theological_decisions:
- issue: 偶像无能的绝对程度
  choice: 绝不能
  alternative: 不能
  rationale: 原文两次使用强调否定οὐ μή，故译文两次保留“绝不能”，呈现论战中对偶像能力的彻底否定。
- issue: 盲人得见的表达是否明确为医治
  choice: 使盲人重见光明
  alternative: 使盲人为看见而站立起来
  rationale: 原文περιστήσωσιν εἰς ὅρασιν措辞紧凑，语义指向使盲人达到能看见的状态，但没有使用通常表示“医治”的明确动词。因此正文采用自然的结果性表达，不增添“医治”，并以脚注保留形式上的歧义。
- issue: ἄνθρωπον的性别表达
  choice: 人
  alternative: 男人
  rationale: ἄνθρωπος在本句中是代表性、泛指的人类称谓，并非特别指男性；汉语“人”准确保留其普遍范围，不把希腊语语法形式误解为生理性别限定。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“重见光明”自然表达恢复视力；平行的两个“绝不能”保留原文重复结构与强烈否定。
