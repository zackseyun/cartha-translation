  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/025.yaml
  text: Without feet they are carried on shoulders, showing their own disgrace to men; and even those who serve them are put to shame,
translation:
  language: zh_hans
  text: 它们没有脚，被人扛在肩上，向人显出自己的耻辱；连侍奉它们的人也蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  choice: 没有脚
  rationale: 直译其身体上的缺失，保留经文对偶像不能自行行动的讽刺。
- source_word: ἐπʼ ὤμοις φέρονται
  choice: 被人扛在肩上
  rationale: 准确表达被动语态和肩扛这一动作；补出“人”是汉语自然表达所需，施动者由语境明确。
- source_word: ἐνδεικνύμενοι
  choice: 显明
  rationale: 表达公开显露、展示之意，与分词所说明的结果相符。
- source_word: τὴν ἑαυτῶν ἀτιμίαν
  choice: 自己的可耻
  rationale: 保留反身意味；“可耻”兼顾ἀτιμία所含的羞辱、无尊荣和卑贱意味。
- source_word: τοῖς ἀνθρώποις
  choice: 向世人
  rationale: 泛指人们；“世人”在庄重现代汉语中自然，并不限定性别。
- source_word: οἱ θεραπεύοντες αὐτά
  choice: 侍奉它们的人
  rationale: θεραπεύω在偶像崇拜语境中指服事、侍奉，而非现代汉语通常所说的医疗“治疗”。
- source_word: αἰσχύνονται
  choice: 蒙羞
  rationale: 保留其可作状态或被置于羞耻中的语义，不额外指定羞耻的心理或外在来源。
theological_decisions:
- issue: 偶像的无能与羞辱
  choice: 以“没有脚”“被人扛”保留原文讽刺，让偶像自身的可耻显露出来
  alternative: 意译为“它们不能自己行走，证明它们毫无能力”
  rationale: 原文借具体形象表达判断，未直接使用“毫无能力”，故不将隐含神学判断改写为明说。
- issue: 侍奉者所受之羞
  choice: 译作“也蒙羞”
  alternative: 译作“也感到羞愧”
  rationale: 希腊语可涵盖羞愧或受辱；“蒙羞”保留一定歧义，避免只解释为主观情绪。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式保持原文两层递进：偶像被扛而显出可耻，继而连侍奉者也蒙羞。无必要脚注。
