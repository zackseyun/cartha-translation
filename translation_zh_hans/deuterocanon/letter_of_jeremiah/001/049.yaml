base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: zh_hans
  text: 这样，谁还能看不出它们不是神呢？因为它们既不能救自己脱离战争，也不能救自己脱离灾祸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”所译的希腊词也可译作“祸患”“患难”或“恶事”；这里侧重能伤害它们的灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: 这样，谁还能
  rationale: οὖν承接上文并引出结论；“这样”自然表达推论关系，与后面的反问相配。
- source_word: οὐκ ἔστιν αἰσθέσθαι
  choice: 看不出
  rationale: αἰσθέσθαι意为察觉、看出；结合希腊文否定式反问，译作“谁还能看不出”既自然，也强调结论显而易见。
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: 它们不是神
  rationale: 直译θεοί为“神”，保留原文直接否定这些偶像具有神性的论断，不以“偶像”代替而消解其论辩张力。
- source_word: οἳ
  choice: 因为它们
  rationale: 关系代词引入支持前述判断的理由；汉语用“因为”明确表达此处的解释、因果作用。
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: 它们既不能救自己
  rationale: σώζω在这里是拯救、救出的意思；“救自己”保留所谓神明连自身也无法解救的讽刺意味。
- source_word: ἐκ πολέμου
  choice: 脱离战争
  rationale: πόλεμος通常指战争；介词ἐκ表达从某种危险中获救，“脱离战争”准确而自然。
- source_word: οὔτε ἐκ κακῶν
  choice: 也不能救自己脱离灾祸
  rationale: κακά在此语境中指造成伤害的灾难、祸患，而非专指道德上的邪恶；补出并列结构中的谓语和宾语，使现代汉语清楚顺畅。
theological_decisions:
- issue: 反偶像语境中θεοί的所指
  choice: 译作“神”，由“不是神”直接否定其神性
  alternative: 直接译作“偶像”或“神明”
  rationale: 原文用θεοί提出并否定这些对象为神的资格。保留“神”可忠实呈现原文的神学论断，而不把结论预先写进名词。
- issue: οὐκ ἔστιν αἰσθέσθαι的否定式反问
  choice: 译作“谁还能看不出……呢？”
  alternative: 较形式地译作“怎么会不能看出……呢？”
  rationale: 两者都指向结论显而易见；所选表达在现代汉语中更自然，同时保留反问力度，并未把它改成普通陈述句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。反问句保留原文的论辩力度；后半句重复“救自己”，以避免汉语并列结构产生歧义。脚注标记置于相关句末。
