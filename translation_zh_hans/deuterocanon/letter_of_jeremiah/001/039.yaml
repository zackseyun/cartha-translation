  text: How then should they be regarded or called gods?[a]
translation:
  language: zh_hans
  text: 那么，怎能把他们看作或称作神呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“那么，应当怎样把他们认作或称为神呢？”
    reason: 保留两个希腊语动词性形容词所含的非人称、应当性表达。
lexical_decisions:
- source_word: πῶς οὖν
  choice: 那么，怎能
  rationale: πῶς引出反问，οὖν承接上文推论；“那么，怎能”在现代汉语中自然地表达由前文论证所得的质疑。
- source_word: νομιστέον
  choice: 把他们看作
  rationale: 该动词性形容词带有非人称和应当性的意味，指应如何认定这些偶像；“看作”准确而通俗，并与后面的“称作”形成对应。
- source_word: ἢ
  choice: 或
  rationale: 保留两个近义判断行为之间的选择关系，不将其合并。
- source_word: κλητέον
  choice: 称作
  rationale: 表达应当如何称呼或命名；“称作”既自然，又能与“把他们看作”并列。
- source_word: αὐτούς
  choice: 他们
  rationale: 按上下文指前述偶像；沿用有生命代词可保留原文拟人化指称及讽刺效果。
- source_word: ὑπάρχειν θεούς
  choice: 是神
  rationale: ὑπάρχειν在此连接认定或称谓的内容；汉语以“是神”简洁表达，不强化为原文未明说的本体论断言。
theological_decisions:
- issue: νομιστέον与κλητέον的反问及应当意味
  choice: 译为“怎能把他们看作或称作神呢？”
  alternative: 那么，怎么应当认为或称他们是神呢？
  rationale: 正文保留对偶像是否配被认作、称作神的反问，同时用自然汉语呈现。译文不把问题改写为对一切所谓神明的普遍定义，也不额外加入宗派性解释。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“看作／称作”保留原文两个近义动作；句末“呢”明确反问语气。正文脚注标记与脚注相对应。
