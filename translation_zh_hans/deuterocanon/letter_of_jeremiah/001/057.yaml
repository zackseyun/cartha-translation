  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/057.yaml
  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: zh_hans
  text: 强者[a]会从它们身上剥下金银，又带着披在它们身上的衣服离去；它们却绝不能救自己。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强者”也可译作“有权势的人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句使用加强否定，强调它们绝不能救自己。
    reason: linguistic_clarification
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: 强者
  rationale: 这个实体化分词指有力量或有权势、能够劫掠偶像的人；“强者”简洁自然，并保留原文在力量与权势之间的语义空间。
- source_word: περιελοῦνται
  choice: 剥下
  rationale: 该动词表示从某物周围或表面取下；在劫掠偶像饰物的语境中，“剥下”具体而有力度。
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: 金银
  rationale: 原文直接以金和银为宾语，没有明说所属关系；“金银”在现代汉语中自然简洁，也不额外添加所有格。
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: 披在它们身上的衣服
  rationale: ἱματισμός指衣服，περικείμενον描写衣物围在或披在偶像身上；此译保留具体形象，同时符合现代汉语表达。
- source_word: ἀπελεύσονται ἔχοντες
  choice: 带着……离去
  rationale: 分词ἔχοντες伴随主要动词，表示劫掠者离开时持有这些衣物；“带着……离去”准确且庄重自然。
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: 它们却绝不能救自己
  rationale: οὐ μή构成强烈否定，ἑαυτοῖς是反身表达；“绝不能救自己”既传达强调语气，也清楚呈现偶像的无能。
theological_decisions:
- issue: 末句的指称对象
  choice: 将“它们”理解为前文所说的偶像，意为偶像连自己也不能救。
  alternative: 也可较宽泛地理解为对这些偶像全然无能的概括。
  rationale: 反身代词ἑαυτοῖς自然回指被剥去金银和衣服的偶像；译文保留原文对偶像无力自救的讽刺，而不扩展为原文未明说的教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剥下”保留劫掠动作的具体力度；“披在它们身上的衣服”呈现偶像穿戴衣物的形象；以“却”表达末句与华美装饰之间的反差。
