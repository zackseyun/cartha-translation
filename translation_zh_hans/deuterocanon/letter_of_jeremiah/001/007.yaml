  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: zh_hans
  text: 因为它们的舌头经工匠刮削过[a]；它们虽外面包着金银，却是虚假的[b]，不能说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经工匠雕刻（或打磨）过。”原文动词着重描写工匠刮削、修整偶像的动作。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却是谎言。”原文可把这些偶像说成虚假之物，也可说成谎言。
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: 舌头
  rationale: 取具体的身体器官义，与末句“不能说话”直接呼应，也保留偶像被造成人形的讽刺意味。
- source_word: κατεξυσμένη
  choice: 刮削出来的
  rationale: 该完成时分词描写工匠刮削、修整的加工结果；“刮削出来”既保留具体动作，也比单说“雕刻”更贴近词义。
- source_word: ὑπὸ τέκτονος
  choice: 工匠
  rationale: τέκτων可泛指从事木作或其他制作工作的匠人；上下文未明确限定为木匠。
- source_word: περίχρυσα καὶ περιάργυρα
  choice: 包着金银
  rationale: 两个形容词表示外面覆有金和银；中文合并表达可自然保留平行的材料描写，并暗示只是外层包覆。
- source_word: ψευδῆ
  choice: 虚假的
  rationale: 中性复数谓语可指这些偶像是虚假之物，也可说它们是谎言；“虚假的”保持其指称与神学批判的开放性。
- source_word: οὐ δύνανται λαλεῖν
  choice: 不能说话
  rationale: 直接表达能力上的否定，并与“舌头”形成鲜明反讽。
theological_decisions:
- issue: ψευδῆ对偶像性质的判定
  choice: 却是虚假的
  alternative: 却是谎言
  rationale: 希腊语既可把偶像定性为虚假之物，也可将其表述为谎言。“虚假的”不额外界定其虚假究竟属于存在、代表还是宗教宣称，保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“舌头—不能说话”保留原文首尾呼应；以“虽……却……”自然呈现金银外饰与偶像虚假、无言之间的反差。
