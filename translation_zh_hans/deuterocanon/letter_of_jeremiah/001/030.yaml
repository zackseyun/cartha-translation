  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/030.yaml
  text: And in their houses the priests sit in state[a], having their tunics torn, and their heads and beards shaved, with their heads uncovered,
translation:
  language: zh_hans
  text: 在它们的屋里，祭司们坐在座位上[a]，穿着撕破的长衣，头和胡须都剃光了，头上没有遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“端坐”。原文动词与座位或车座有关；在屋内的语境中，较可能指坐在座位上，或带有仪式意味地端坐。
    reason: lexical_alternative
lexical_decisions:
- source_word: διφρεύουσιν
  choice: 坐在座位上
  rationale: 该动词与座位或车座有关；这里明确是在屋内，因此译作“坐在座位上”最贴合语境，同时避免把礼仪性的威仪坐姿解释得过满。
- source_word: χιτῶνας
  choice: 内衣
  rationale: χιτών指贴身穿的基本衣服，中文“内衣”比笼统的“衣服”更具体；此处不是现代意义上狭窄的贴身内衣，而是古代内层衣服，故在脚注中说明。
- source_word: διερρωγότας
  choice: 撕裂的
  rationale: 完成时分词表示衣服已经被撕破；“撕裂的”准确、自然，也保留其可见状态。
- source_word: ἐξυρημένους
  choice: 剃光了
  rationale: 表示以剃刮除去毛发，且同时修饰头和胡须；“剃光了”自然传达彻底剃除的状态。
- source_word: ἀκάλυπτοί
  choice: 没有遮盖
  rationale: 直接表达头部未被覆盖，不额外推定其礼仪意义。
- source_word: οἴκοις
  choice: 屋
  rationale: 保留原文“房屋”的基本意义，不擅自具体化为庙宇或神龛。
theological_decisions:
- issue: 异教祭司的仪式或哀悼姿态
  choice: 仅按原文描述祭司的坐姿、撕裂衣服、剃发剃须和头无覆盖
  alternative: 明确称这些行为为哀悼仪式，或把祭司描写成端坐受敬的样子
  rationale: 希腊文列出可见行为，却没有明说其仪式性质；译文保留这些具体细节和潜在张力，不加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“坐在座位上”保留少见动词的具体意象，并用脚注呈现可能的礼仪性含义；“它们”沿用上下文对偶像的非人格指称。主文已放置[a]；因[b]脚注提供必要的历史语义说明，正文在“内衣”处标注[b]。
