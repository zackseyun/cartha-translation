  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/043.yaml
  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: zh_hans
  text: 但她们中若有一个被某个路人拉走[a]，与他同寝[b]，她就讥讽身旁的那一个，因为对方没有像她一样被认为配得，对方的绳索也没有被扯断[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉走”也可译作“牵走”或“引走”；希腊语表示被人带离，此处语境可能侧重实际的拉扯动作。
    reason: lexical_alternative
  - marker: b
    text: “同寝”是指性关系的委婉说法。
    reason: cultural_note
  - marker: c
    text: 这里的“绳索”可能是固定偶像形象的绳带。原文中“她的”具体指谁略有含混；按本句的并列结构，正文理解为身旁那一个的绳索。整句话以把偶像拟作争夺性关注的女人来加以讽刺。
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: 被……拉走
  rationale: 该被动分词表示被人牵引、拉开或带走；“拉走”保留了动作的具体性和可能含有的强制意味，同时不把语义限定得过死。
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: 被某个路人
  rationale: 准确表达“从经过的人中某一个”的不定意味；“路人”是自然、简洁的现代汉语。
- source_word: κοιμηθῇ
  choice: 与他同寝
  rationale: 原词本义为睡卧，此处在讽刺性语境中委婉指性关系；“同寝”既保留委婉语气，也足以让现代读者理解。
- source_word: τὴν πλησίον
  choice: 身旁的那一个
  rationale: 这里首先表达空间上的邻近，所指很可能是相邻的女性化偶像形象；避免译作“邻舍”而产生人际关系上的误解。
- source_word: ὀνειδίζει
  choice: 讥讽
  rationale: 该词可表示责骂、羞辱或嘲弄；本段是尖锐的偶像讽刺，“讥讽”自然地传达其贬抑意味。
- source_word: οὐκ ἠξίωται
  choice: 没有……被认为配得
  rationale: 保留完成时被动式中“未被判定为配得”的评价意味，不将其改写成单纯的“没有得到”。
- source_word: ὥσπερ καὶ αὐτή
  choice: 像她一样
  rationale: 简洁保留相邻形象与说话者自身之间的比较。
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: 对方的绳索也没有被扯断
  rationale: “绳索”直接对应 σχοινίον，“被扯断”体现 διεράγη 的破裂动作；按句法与并列关系，将所有格理解为身旁的那一个，但以脚注说明其具体用途与指代仍有不确定性。
theological_decisions:
- issue: “她们中一个”及连续阴性形式的所指
  choice: 正文按被拟人化为女性的偶像形象处理
  alternative: 也可能指与偶像庙宇有关的妇女
  rationale: 上下文旨在嘲讽偶像，并把它们描写成争夺性关注的女人；阴性形式和“绳索”的提及更符合偶像形象，但不把另一种理解当作绝无可能。
- issue: 绳索所属者及其象征意义
  choice: 正文将绳索理解为身旁那一个的绳索
  alternative: 阴性代词也可能被读作前述被拉走者的绳索；绳索的具体功能亦不明确
  rationale: “没有被认为配得”与“绳索也没有被扯断”构成并列，最自然地共同描述身旁的那一个；但希腊语阴性代词本身可能产生指代歧义，因此不在正文外进一步教义化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“同寝”维持原文委婉表达；“被认为配得”略带正式色彩，以保留希腊语的评价性被动含义。正文使用“对方”澄清主要句法理解，脚注则保留代词指向和绳索用途上的真实不确定性。
