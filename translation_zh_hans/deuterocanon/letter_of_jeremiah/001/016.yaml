  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/016.yaml
  text: Such are their gods[a], set up in houses. Their eyes are full of dust from the feet of those who enter.
translation:
  language: zh_hans
  text: 他们的神[a]就是如此：被安置在房屋里；它们的眼睛满是进入之人脚上带来的尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的偶像”。希腊文作“他们的神”，保留了作者以“神”称呼列国所敬拜的这些神像的论战性表达。
    reason: 词义备选及论战性修辞说明
lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: 就是这样
  rationale: 以自然的现代汉语表达总结性的判断，并保留原文简洁、有讽刺意味的语气。
- source_word: οἱ θεοὶ αὐτῶν
  choice: 他们的神
  rationale: 直译原文的 θεοί，不在正文中先行解释为“偶像”，以保留作者将受敬拜的神像称为“神”的论战性表达。
- source_word: καθιδρυμένων αὐτῶν
  choice: 被安置
  rationale: 表达神像被置于固定位置的被动含义；“安置”自然庄重，又不额外引入登基或供奉等较具体的观念。
- source_word: ἐν τοῖς οἴκοις
  choice: 在房屋里
  rationale: 原文说的是“房屋”，不具体化为“庙宇”；定冠词在此可作泛指。
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 它们的眼睛
  rationale: 保留身体部位的具体形象，以显出对无生命神像的讽刺；汉语用“它们”与作为物件的神像相称。
- source_word: πλήρεις εἰσὶν κονιορτοῦ
  choice: 满是……尘土
  rationale: 直接保留积尘的画面，表现这些神像不能自理的无能状态。
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: 进出之人脚上带来的
  rationale: ἀπό表示尘土的来源；“进出之人”自然概括进入屋内的人，“脚上带来的”清楚表达尘土由其脚步带入。
theological_decisions:
- issue: “他们的神”的所指
  choice: 正文保留“他们的神”
  alternative: 他们的偶像
  rationale: 上下文所指显然是受敬拜的神像，但希腊文明确使用“神”。正文保留这一称呼，维持原文的论战修辞；脚注说明其实际所指。
- issue: 神像的代词
  choice: 后句用“它们”
  alternative: 他们
  rationale: 汉语中“它们”凸显这些所谓的神其实是物质神像，也符合本节描写其眼睛积尘的语境，但不把正文中的“神”改译为“偶像”。
translation_notes:
  register: 采用现代、清楚而庄重的书面汉语。“就是这样”保留总结判断的力度；“房屋”避免将场所过度具体化为庙宇。
