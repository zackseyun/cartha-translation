base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: zh_hans
  text: 所以，能显出自己勇气的君王，胜过那些假神；家中一件有用、可供主人使用的器具，也胜过那些假神；家中一扇能保护屋内物品的门，也胜过那些假神；宫殿里的一根木柱，也胜过那些假神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在各项比较后都重复“胜过那些假神”，以加强语气；译文保留了这种反复。
    reason: 说明原文重复结构及其修辞作用。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文并引出结论，符合现代汉语的自然推论语气。
- source_word: κρεῖσσον
  choice: 胜过
  rationale: 在连续比较中比“更好”更自然，也清楚表达优越于假神之意。
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: 能显出自己勇气的君王
  rationale: 保留分词对君王的修饰、ἑαυτοῦ的反身强调，以及ἀνδρεία的勇气、英勇之义。
- source_word: σκεῖος ἐν οἰκίᾳ χρήσιμον
  choice: 家中一件有用的器具
  rationale: σκεῖος含义较宽泛，“器具”既保留其概括性，也适合家庭用品的语境。
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: 可供主人使用
  rationale: 表达器具由拥有者实际使用的功能；“主人”在家庭语境中自然，且不将其限缩为现代法律意义的所有权人。
- source_word: οἱ ψευδεῖς θεοί
  choice: 那些假神
  rationale: ψευδεῖς在此表明这些神并非真神；“假神”简明自然。“那些”使反复出现的比较对象在汉语中更清楚。
- source_word: θύρα ἐν οἰκίᾳ διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: 家中一扇能保护屋内物品的门
  rationale: 将διασώζουσα译为“保护”，体现门保存、护卫屋内之物的实际功能。
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: 宫殿里的一根木柱
  rationale: 准确保留材质、建筑构件及王宫环境；复数βασιλείοις在泛指语境中自然译作“宫殿里”。
theological_decisions:
- issue: 反复出现的ἢ οἱ ψευδεῖς θεοί所形成的修辞比较
  choice: 在每一项比较后明确重述“也胜过那些假神”
  alternative: 把所有对象并列后，只用一次“都胜过假神”作总结
  rationale: 原文反复重申对假神的否定，形成强烈的论战节奏。逐项保留比较既忠于结构，也不替原文削弱其神学张力。
- issue: ψευδεῖς θεοί的指称
  choice: 假神
  alternative: 虚假的神／说谎的神
  rationale: 上下文针对偶像所谓的神性；“假神”保留其并非真神的判断，又不额外断定该形容词专指其言语欺骗。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。按汉语习惯重整松散的希腊语比较句法，同时逐项保留“胜过那些假神”的反复。脚注标记置于整节末尾，对全句结构作说明。
