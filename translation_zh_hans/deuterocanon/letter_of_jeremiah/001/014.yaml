base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: zh_hans
  text: 他右手拿着匕首[a]和斧头，却不能救自己脱离战争和强盗[b]。由此可见，它们不是神；所以不要怕它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “匕首”或译“短剑”。希腊语ἐγχειρίδιον指手持的短兵器。
    reason: lexical_alternative
  - marker: b
    text: “强盗”或译“匪徒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: 匕首
  rationale: 该词指可持于手中的短小兵器，通常为匕首或短剑；“匕首”在现代汉语中自然明确，并与后面的“斧头”共同构成偶像持有武器却不能自救的反讽形象。
- source_word: δεξιᾷ
  choice: 右手
  rationale: 此处与ἔχει连用，表达所持位置；译为“右手拿着”符合现代汉语习惯。
- source_word: πέλεκυν
  choice: 斧头
  rationale: 这是该词普通而稳妥的含义；“斧头”比限定大小的“手斧”更忠实于原文未加限定的表达。
- source_word: ἐξελεῖται
  choice: 救自己脱离
  rationale: 中间语态与ἑαυτόν共同强调自我解救；“救自己脱离”既保留脱离危险的含义，也符合现代汉语表达。
- source_word: λῃστῶν
  choice: 强盗
  rationale: 该词可指强盗或结伙劫掠者；“强盗”是宽泛而通行的译法，同时以脚注保留“匪徒”的语义可能。
- source_word: ὅθεν
  choice: 由此可见
  rationale: 该词从偶像不能自救这一事实引出结论；“由此可见”清楚表达推论关系。
- source_word: γνῶριμοί εἰσιν οὐκ ὄντες θεοί
  choice: 它们不是神
  rationale: 整个结构表明这些偶像显然并非神；结合ὅθεν译作“由此可见，它们不是神”，自然且不过度解释。
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: 所以不要怕它们
  rationale: 保留οὖν的推论作用以及否定命令的劝诫语气，措辞简洁、庄重而易懂。
theological_decisions:
- issue: 偶像描述由单数转为复数
  choice: 前半句保留单数“他／自己”，结论改用复数“它们”。
  alternative: 全文统一改为复数，以消除数的转换。
  rationale: 希腊文本先以一个有代表性的偶像为单数对象加以描述，随后把结论推广到这一类偶像。保留这种转换能忠实呈现原文的修辞推进，也不把文本不必要地磨平。
- issue: “不是神”的断言力度
  choice: 直译为“它们不是神”。
  alternative: 译为“它们不是真神”。
  rationale: 原文仅说οὐκ ὄντες θεοί，并没有出现“真”这一限定词；不补入“真”可避免引入原文未明说的神学措辞，同时保留直接否定其神性的力度。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“他”承接原文对单个偶像的拟人化描述，“它们”则指这类偶像整体。句式保留武器在手却不能自救的反讽，并清楚呈现事实、推论和劝诫三层推进。
