  text: Therefore you will know that they are not gods[a]; therefore do not fear them.
translation:
  language: zh_hans
  text: 由此你们就会知道，它们并不是神[a]；所以不要惧怕它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“它们不是神。”这里的代词指上下文所谈的偶像，也可连带指这些偶像所代表的所谓诸神。
    reason: 说明代词的指向及原文对偶像神性的直接否定，避免汉语读者误解。
lexical_decisions:
- source_word: ὅθεν
  choice: 由此
  rationale: 该词承接上文对偶像无能的揭露，引出据此所得的结论；“由此”既保留推论关系，也自然简洁。
- source_word: γινώσεσθε
  choice: 你们就会知道
  rationale: 这是 γινώσκω 的将来时形式，表示听众由前述事实将得出的认识；“就会知道”在现代汉语中清楚表达这一结果。
- source_word: οὐκ εἰσὶν θεοί
  choice: 它们并不是神
  rationale: θεοί 直译为“神”，保留原文否认这些偶像具有真实神性的论战力度；“并”加强与人们所宣称身份之间的反差，却未增添新的命题。
- source_word: μὴ οὖν φοβεῖσθε
  choice: 所以不要惧怕
  rationale: μὴ 加命令语气表达禁止，οὖν 承接前句结论；“所以不要惧怕”准确保留逻辑关联，语气庄重自然。
- source_word: αὐτά
  choice: 它们
  rationale: 希腊文为中性复数代词，就近指向上下文中的偶像；汉语用“它们”既符合无生命物像的指称习惯，也不把原文代词扩写成名词。
theological_decisions:
- issue: “它们”所指以及对其神性的否定
  choice: 保留代词“它们”，使其直接指向上下文所谈的偶像，并否认这些偶像是真神。
  alternative: 明确译作“这些偶像”或把所指扩展为偶像所代表的异教诸神。
  rationale: 原文以中性复数代词指称所谈论的物像，同时以 θεοί 否定其所谓神性。保留代词可兼顾直接对象与其所代表的所谓诸神，不替原文消除这一指称层次。
translation_notes:
  register: 采用现代、清楚而庄重的书面汉语。“由此……所以……”保留原文两处推论关系；“它们”维持原文代词表达，不擅自具体化。
