  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/033.yaml
  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: zh_hans
  text: 无论它们受到任何人的伤害，还是得到某种好处，它们都不能作出相应的回应[a]；它们既不能立王，也不能废王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作出相应的回应”所译的希腊词可指对好处加以报答，也可指对伤害加以报复。
    reason: lexical_alternative
  - marker: b
    text: 直译为“设立一个王，也不能把他除去”；后一个动词的宾语“王”由上文承接。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: 无论……还是……都不能
  rationale: 这一成对结构提出两种相对的条件；采用现代汉语的“无论……还是……”可自然地保留两者并列的关系，并与后面的否定结果衔接。
- source_word: κακόν τι πάθωσιν ὑπό τινος
  choice: 受到谁的伤害
  rationale: κακόν τι 在此指遭受不利对待或损害，而非抽象的道德之恶；ὑπό τινος 表示不特定的施事者。
- source_word: ἀγαθόν
  choice: 从谁得到好处
  rationale: 此处与“受到伤害”相对，指得到善待或益处；按前一条件补出省略的施事关系，使中文完整自然，但不限定好处的具体性质。
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: 都不能作出相应的回报
  rationale: ἀνταποδίδωμι 指针对所受之事给予相应回应，既可涉及善，也可涉及恶。“相应的回报”保留这种双向范围，脚注说明其可指报答或报复。
- source_word: καταστῆσαι βασιλέα
  choice: 立王
  rationale: καθίστημι 在此有设立、任命之意；“立王”简洁庄重，准确表达使某人成为君王。
- source_word: ἀφελέσθαι
  choice: 废王
  rationale: 该词意为取走、除去；此处承接“王”，政治语境中“废王”自然表达撤去王位之意，同时避免增加具体手段。
theological_decisions:
- issue: 偶像无能的范围
  choice: 经文同时陈明偶像不能对所受的伤害或好处作出相应回应，也不能立王或废王。
  alternative: 可把“回报”缩窄为只对伤害施行报复，或把政治用语直译为“设立一个王或把他除去”。
  rationale: 希腊文以善与恶两个条件共同支配 ἀνταποδοῦναι，强调偶像在回应善恶两方面都无能；后半句则陈明它们在王权兴废上同样无能。译文保留这一广度，不另加经文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“它们”承接上下文中的偶像；“立王／废王”形成简洁对称的政治表达。“相应的回报”保留原文可兼指报答与报复的语义张力，并以脚注澄清。
