translation:
  language: zh_hans
  text: 他们绝不会救人脱离死亡，也绝不会把弱者从强者手中救出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ θανάτου
  choice: 脱离死亡
  rationale: ἐκ与θανάτου表示从死亡或死亡威胁中被救出；“脱离死亡”自然简洁，也不武断限定为临死危险或已经死亡。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ἄνθρωπον虽为阳性单数，此处泛指任何人；现代汉语用“人”即可准确保留其概括性，无须增添性别限定。
- source_word: οὐ μὴ ῥύσωνται
  choice: 绝不能救
  rationale: οὐ μή加将来时构成强烈否定；“绝不能”既体现强调，也符合上下文对偶像无能的陈述。ῥύομαι在此表示救援、解救。
- source_word: ἥττονα
  choice: 弱者
  rationale: ἥττονα是比较级实体化用法，指相对较弱的一方；“弱者”与后面的“强者”形成简洁鲜明的对照。
- source_word: ἀπὸ ἰσχυροῦ
  choice: 脱离强者
  rationale: ἀπό标明需要从其手中获救的强势一方；“强者”保留了原文与“弱者”的比较性对照，也不额外限定其身份。
- source_word: μὴ ἐξέλωνται
  choice: 也不能救
  rationale: ἐξαιρέω中间语态在此有从危险或他人控制下解救之意；平行使用“救”使中文流畅，同时“也不能”承接前句的强烈否定范围。
