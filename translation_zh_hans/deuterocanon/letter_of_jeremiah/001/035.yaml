review_pass:
  verdict: revise
  source_fidelity: 原译准确传达了偶像不能施救的两项并列陈述，也保留了“弱者／强者”的对照。不过，οὐ μή与将来式所表达的是强烈的将来否定，译作“绝不会”比“绝不能”更直接地对应原文的语气与时态；第二分句宜相应保留同等的强否定。
  naturalness: “他们绝不会救人脱离死亡，也绝不会把弱者从强者手中救出来”是自然、庄重的现代书面汉语。“从强者手中救出来”明确呈现ἀπὸ ἰσχυροῦ所指的强势压迫者或控制者，避免“脱离强者”在汉语中可能被理解为单纯离开某人的轻微歧义。
  terminology: “救人”“死亡”“弱者”“强者”均恰当，无需引入特定神学术语或性别限定。
  issues:
