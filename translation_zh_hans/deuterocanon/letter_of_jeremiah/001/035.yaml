  register: 采用现代、庄重而易懂的书面普通话。保留原文两项并列的无能陈述，并以“弱者／强者”重现比较级与强势者之间的对照。原文第二分句的否定承接前面的οὐ μή，译文用“也不能”自然表达该范围。
