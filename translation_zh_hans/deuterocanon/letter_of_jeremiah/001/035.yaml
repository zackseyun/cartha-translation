    issue: “绝不能／也不能”较偏向能力上的不能，且未完全重现原文未来时的强烈否定。
    rationale: οὐ μὴ ῥύσωνται是强烈的未来否定；在中文中“绝不会”能更贴近“必定不会／断不会”，同时不否认上下文所含的无能意味。
  - severity: low
    issue: “救弱者脱离强者”对施压关系的表达略显简略。
    rationale: ἀπὸ ἰσχυροῦ表示从强者一方、尤其其控制或压迫下获救；加“手中”是自然的中文表达，并未增添原文没有的具体情节。
  revised_text: 他们绝不会救人脱离死亡，也绝不会把弱者从强者手中救出来。
