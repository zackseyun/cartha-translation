  text: For the sun and the moon and the stars, being bright and sent out for needs, are obedient.
translation:
  language: zh_hans
  text: 因为太阳、月亮和星辰都明亮，又被差遣来满足需要[a]，也都听命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“供使用”或“为服役”；希腊语短语可指满足需要、供人使用，或履行所分派的职分。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος, σελήνη, ἄστρα
  choice: 太阳、月亮和星辰
  rationale: 按希腊语的常见义直译这一组天体名称；“星辰”比“星星”更符合本书庄重的书面语体。
- source_word: ὄντα λαμπρά
  choice: 都是明亮的
  rationale: 保留分词与表语形容词所表达的状态，不将其扩展成具体的照耀动作。
- source_word: ἀποστελλόμενα
  choice: 受差遣
  rationale: 保留被动分词的差遣意象，同时不明说差遣者，因为本节希腊文本没有直接指出。
- source_word: ἐπὶ χρείας
  choice: 为满足需要
  rationale: χρεία可表示需要、用途或职用；此译法贴近原文，同时在现代汉语中自然通顺，并以脚注保留其他可能含义。
- source_word: εὐήκοά
  choice: 顺从的
  rationale: 表达该形容词“听从、服从”的基本含义，又不额外补出原文未明说的命令或权威主体。
theological_decisions:
- issue: 天体的能动性及其受命用途
  choice: 译作天体“受差遣”并且“顺从”，保留它们响应某种安排或权威的拟人化表达。
  alternative: 将其理解为天体只是按照自然规律有序运行。
  rationale: ἀποστελλόμενα与εὐήκοα并用，具有受差遣和服从的意味；译文不把这种意味淡化为单纯的自然规律，也不添加原文未直接提到的“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受差遣”和“顺从”保留原文的神学张力；句式略带并列节奏，以对应太阳、月亮和星辰的列举。
