  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/019.yaml
  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: zh_hans
  text: 它们确实像房屋的一根横梁；人们说，它们的心被舔食掉了[a]。地上的爬行生物吞吃它们和它们的衣服，它们却毫无知觉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们的内部被舔食掉了。”希腊文直译为“它们的心”，保留了把偶像拟人化的讽刺形象。
    reason: 说明καρδίας在此既可按字面译为“心”，也可能具体指木偶像的内部或中心。
lexical_decisions:
- source_word: δοκός
  choice: 横梁
  rationale: 指房屋中的结构木料；“横梁”既保留木质构件的具体形象，也比泛称“木头”更准确。
- source_word: καρδίας
  choice: 心
  rationale: 原文以拟人化的身体用语嘲讽偶像；保留“心”可维持这一反讽，同时用脚注说明其具体所指可能是内部。
- source_word: ἐκλείχεσθαι
  choice: 被舔蚀了
  rationale: 保留源自动词“舔”的鲜明意象，又以“蚀”自然表达偶像内部逐渐被虫类吃空的语境，不额外加入“干净”等强化含义。
- source_word: ἑρπετῶν
  choice: 爬行的生物
  rationale: 范围比现代分类意义的“爬行动物”更广，可包括各种贴地爬行并侵蚀偶像的生物。
- source_word: κατεσθιόντων
  choice: 吞吃
  rationale: 传达持续而强烈的啃食、吃尽之意，同时保持现代汉语的自然度。
- source_word: ἱματισμόν
  choice: 衣服
  rationale: 用现代通俗词准确表示覆盖偶像的衣物。
- source_word: οὐκ αἰσθάνονται
  choice: 毫无知觉
  rationale: 突出偶像既不能感觉也不能察觉自身被吞吃，符合本段对无知觉偶像的讽刺。
- source_word: φασὶν
  choice: 据说
  rationale: 希腊文是不定主语“他们说”；译作“据说”自然保留传闻性质，又避免误使偶像成为说话者。
theological_decisions:
- issue: 末句主语及代词的指向
  choice: 将“它们”和“毫无知觉”的主语理解为偶像。
  alternative: 把部分复数主语理解为敬拜偶像的人，尤其与“据说”相连。
  rationale: αὐτούς、αὐτῶν及οὐκ αἰσθάνονται最近且贯穿上下文的所指是偶像；全段论旨也在讽刺偶像没有感觉。
- issue: 偶像的“心”应按字面还是解释性翻译
  choice: 正文保留“心”，脚注说明也可理解为“内部”。
  alternative: 正文直接译作“内部”或“里面”。
  rationale: “心”保存希腊文的拟人化讽刺和神学张力，不把形象悄然解释掉；脚注则帮助读者理解木偶像内部被侵蚀的具体画面。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“横梁”“爬行的生物”“毫无知觉”兼顾准确与自然；正文保留“心”和“舔”的陌生而鲜明的原文意象，并以脚注辅助理解。
