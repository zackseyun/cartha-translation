  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/010.yaml
  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
translation:
  language: zh_hans
  text: 他们甚至把从它们那里取来的一些东西[a]给屋顶上的娼妓[b]。他们又用衣服把这些银制的神、金制的神和木制的神装扮得像人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译为“从它们那里”或“从它们当中”。这里的代词所指并不完全明确；按上下文，可能是指与偶像有关的物品。
    reason: lexical_alternative
  - marker: b
    text: 有些解释者认为“屋顶上的娼妓”是与祭祀有关的娼妓，但希腊文并没有明确说她们是“庙妓”。
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: 给
  rationale: 这是δίδωμι的将来时形式；本段是在概述偶像崇拜者的惯常行为，现代汉语用一般陈述的“给”比机械译作“将给”更自然，同时不改变动作含义。
- source_word: ἀπʼ αὐτῶν
  choice: 取自它们的东西
  rationale: ἀπό加属格表示来源，但复数代词所指在本句内并不完全明确。译文保留“它们”，并补出汉语句法所需的“东西”，避免擅自确定为祭物、饰品或偶像的财物。
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: 屋顶上的娼妓
  rationale: πόρναι直指娼妓，ἐπὶ τοῦ στέγους表示在屋顶上。原文没有明确称她们为神庙或祭祀娼妓，因此正文不加入这一限定。
- source_word: κοσμοῦσί
  choice: 装扮
  rationale: κοσμέω在此指用衣物装饰偶像；“装扮”既能表达外在修饰，也自然衔接“像人一样”。
- source_word: ὡς ἀνθρώπους
  choice: 像人一样
  rationale: ἄνθρωπος泛指人类，并非特指男性；此译法准确保留偶像被拟人化装饰的比较意味。
- source_word: τοῖς ἐνδύμασιν
  choice: 穿上衣服
  rationale: 工具与格说明装饰所用的是衣物。汉语以“给……穿上衣服”表达最自然，也清楚呈现施事者给偶像着衣的动作。
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: 银神、金神和木神
  rationale: 原文在“银神”和“金神”处重复θεούς，在“木制的”处省略而承前。汉语并列为“银神、金神和木神”，保留材质分类及略带讽刺的罗列效果。
theological_decisions:
- issue: πόρναι是否应译出祭祀或神庙背景
  choice: 娼妓
  alternative: 庙妓／祭祀娼妓
  rationale: 希腊文只称她们为πόρναι，并说明其位于屋顶上，没有明确赋予她们祭祀身份。正文因此采用不增添宗教身份的译法，脚注仅说明存在的解释可能。
- issue: ἀπʼ αὐτῶν的代词所指
  choice: 取自它们的东西
  alternative: 从这些祭物中取一些／取偶像的财物
  rationale: 上下文可能使代词指与偶像有关的物品，但本句没有明说具体是哪一类。译文保留指代张力，不把可能的所指提升为确定解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。第一句保留代词指向的不确定性，并用脚注交代；第二句调整为自然汉语语序，但仍明确呈现人给银、金、木制偶像穿衣、把它们装扮成人样的讽刺性画面。
