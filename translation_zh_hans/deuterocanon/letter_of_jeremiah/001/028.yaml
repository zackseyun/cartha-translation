  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/028.yaml
  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: zh_hans
  text: 经期隔离中的妇女和产后卧床的妇女触摸献给它们的祭物。[a] 所以，你们从这些事就知道它们不是神；不要惧怕它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文表述简缩。“经期隔离中的妇女”也可较字面地理解为“隔离而坐的妇女”；“产后卧床的妇女”指处于产褥期的妇女。两者很可能都涉及古代的礼仪不洁观念。
    reason: 说明压缩的希腊句法及有关礼仪状态的词义范围，同时避免把第二个词扩大为“临产”。
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: 经期独处的妇女
  rationale: 该阴性分词字面有“独自坐着、隔离而坐”之意；在这里与“产妇”并列，很可能特指因经期而处于礼仪隔离状态的妇女。译文表达这一语境含义，同时以脚注保留较宽泛的可能。
- source_word: λεχὼς
  choice: 产妇
  rationale: λεχώ通常指临产或产后卧床的妇女，即产妇；此处与ἀποκαθημένη并列，涉及古代所理解的礼仪不洁状态。
- source_word: τῶν θυσιῶν αὐτῶν
  choice: 献给它们的祭物
  rationale: 属格短语在ἅπτονται之后作其宾语；αὐτῶν按上下文指偶像。“献给它们的祭物”比“它们的祭物”更清楚自然。
- source_word: ἅπτονται
  choice: 触摸
  rationale: 保留动词“接触、触摸”的直接含义；论证重点是这些偶像及其祭物会受到被视为礼仪不洁者的接触。
- source_word: γνόντες
  choice: 知道
  rationale: 该分词表示根据上述事实所得的认识或判断；用“知道”简明地保留其推论作用。
- source_word: θεοί
  choice: 神
  rationale: 直译为“神”，符合全段反偶像崇拜的论证；现代汉语中“不是神”自然明确。
- source_word: μὴ φοβηθῆτε αὐτούς
  choice: 不要惧怕它们
  rationale: 保留否定命令的力度；代词指前文无生命的偶像，故用“它们”。
theological_decisions:
- issue: 妇女的状态与礼仪不洁
  choice: 正文译作“经期独处的妇女和产妇”，使古代礼仪隔离的语境可见。
  alternative: 也可较字面地译作“独坐的妇女和卧床的妇女”，不明确指出经期或产后状态。
  rationale: ἀποκαθημένη与λεχώ的并列强烈暗示经期隔离及产褥状态；但希腊文表述简缩，因此脚注保留较宽泛的理解，不把这种背景说成经文本身明确作出的道德评价。
- issue: 偶像“不是神”的论证
  choice: 保留由可受触摸、可被礼仪不洁所及而推知偶像不是神的原有论证。
  alternative: 将本句泛化为偶像无能或不洁的概括性陈述。
  rationale: 原文明确用“从这些事知道”连接具体证据和结论，译文不另行扩展其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“经期独处”和“产妇”避免生硬的礼仪术语；分号保留由证据转向命令的紧凑论证。脚注标记[a]已在正文出现。
