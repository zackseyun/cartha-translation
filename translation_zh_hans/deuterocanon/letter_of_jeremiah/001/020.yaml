  language: zh_hans
  text: 它们的脸被屋里冒出的烟熏黑了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屋”也可译作“神龛”或“庙宇”；希腊文使用的是普通词“屋”。
    reason: 说明οἰκία的普通词义及其在偶像崇拜语境中可能具有的专门所指。
lexical_decisions:
- source_word: μεμελανωμένον
  choice: 熏黑了
  rationale: 该完成时被动分词表示被弄黑后形成的持续状态；结合致黑原因是烟，现代汉语用“熏黑了”既具体自然，也准确传达结果。
- source_word: τὸ πρόσωπον αὐτῶν
  choice: 它们的脸
  rationale: πρόσωπον虽为单数形式，但与复数领属代词搭配，具有逐一分配的意义；汉语用“它们的脸”自然地保留这一表达。
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: 被……烟熏
  rationale: ἀπό在此表示造成变黑的来源或原因；汉语被动结构“被……烟熏黑”清楚呈现因果关系。
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: 屋里冒出的
  rationale: ἐκ说明烟从οἰκία内部出来；“屋里冒出的”比机械的“从屋里来的”更符合汉语对烟的自然表达，同时保留普通名词“屋”的含义。
theological_decisions:
- issue: 在偶像语境中，οἰκία应译作普通的“屋”，还是解释为“神龛”或“庙宇”
  choice: 屋
  alternative: 神龛；庙宇
  rationale: 希腊文使用普通词οἰκία，并未采用专指宗教建筑的词。正文保留较普通的“屋”，不把上下文可能暗示的宗教用途直接写入译文；脚注列出语境上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“熏黑了”形象且自然；“它们”与上下文中的偶像相称。脚注保留“屋”在宗教语境中的真实词义张力。
