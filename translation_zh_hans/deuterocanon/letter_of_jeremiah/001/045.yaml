  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/045.yaml
  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: zh_hans
  text: 它们是木匠和金匠制造的；工匠想把它们做成什么，它们就只能成为什么，不能成为别的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων καὶ χρυσοχόων
  choice: 由木匠和金匠
  rationale: ὑπό加属格表示施事；τέκτον在此指木作工匠，χρυσοχόος则明确指制作金器的人。译作“木匠和金匠”具体、自然，也符合偶像制造的语境。
- source_word: κατεσκευασμένα εἰσίν
  choice: 制造的
  rationale: 完成时被动分词与εἰσίν构成迂回式，强调它们是人手制成的成品。“制造”保留人为制作及被动含义，现代汉语也简洁顺畅。
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: 除了……，什么也成不了
  rationale: 此处排除偶像成为工匠意愿之外任何事物的可能。“什么也成不了”自然表达其完全受制于制造者，同时保留γίνομαι“成为”的语义。
- source_word: βούλονται
  choice: 想要
  rationale: 表达工匠的意愿；“想要”比“决定”或“意图”更直接，也不额外强化计划性。
- source_word: οἱ τεχνῖται
  choice: 工匠
  rationale: 泛指有技艺的制作者，与前句较具体的“木匠和金匠”形成自然呼应。
- source_word: αὐτὰ γενέσθαι
  choice: 把它们做成的样子
  rationale: 希腊文直义为“要它们成为”，在汉语中按制造语境译为“把它们做成的样子”，既保留结果状态，也避免生硬重复。
theological_decisions:
- issue: 本节对偶像性质的陈述
  choice: 强调偶像完全由人制造，其形态和所成之物不能超出工匠的意愿。
  alternative: 仅直陈偶像出自工匠之手，不突出其受制性。
  rationale: 前后两分句从人为制造推进到不能成为工匠意愿之外的任何东西；译文保留这一反偶像崇拜的论辩力度，却不增添原文没有明说的能力或神性判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“木匠和金匠”保留具体行业名称，“工匠”概括二者；后半句以自然汉语重组希腊文双重γίνομαι结构，但保留“成为/做成”的核心意象。
