  language: zh_hans
  text: 但它们绝不能抵挡君王或仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεῖ
  choice: 君王
  rationale: 与格单数，作ἀντιστῶσιν的对象；用“君王”自然表达此处泛指的一位统治者，并保留单数形式。
- source_word: πολεμίοις
  choice: 仇敌
  rationale: 与格复数，同作动词的对象；指敌对者，译为“仇敌”符合庄重而通俗的经文语体。
- source_word: οὐ μὴ ἀντιστῶσιν
  choice: 绝不能抵挡
  rationale: οὐ μή加虚拟式构成强烈否定，表达断然不可能或绝不会发生；“绝不能”准确保留其强调力度。
theological_decisions:
- issue: 偶像无力抗衡世俗权势与敌对势力
  choice: 不增加解释，仅直译其绝无抵抗能力
  alternative: 译作“绝不会起来反抗”，突出主动行动
  rationale: ἀνθίστημι可表示抵抗、抗拒；上下文主语为偶像，“抵挡”既自然，又不额外引入意志或行动能力的推断。
translation_notes:
  register: 采用现代、简洁而庄重的书面语。“但”承接前文对偶像无能的论述；“它们”按上下文指诸偶像。
