  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/023.yaml
  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: zh_hans
  text: 为作装饰而披在偶像上的金子，若没有人擦去锈迹，偶像就绝不会发亮；因为它们连在被铸造时也毫无知觉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτίθενται εἰς κάλλος
  choice: 为美观而给偶像包上的
  rationale: περιτίθημι 表示把某物置于或包覆在对象外面；补出上下文隐含的“偶像”，使中文指向清楚，同时保留装饰目的。
- source_word: ἐκμάξῃ τὸν ἰόν
  choice: 擦去上面的锈迹
  rationale: ἐκμάσσω 指擦净、抹去；ἰός 在金属语境中可指锈蚀或锈斑。虽黄金本身通常不生锈，原文仍使用该词，因此采用“锈迹”以忠实呈现其表述。
- source_word: οὐ μὴ στίλψωσιν
  choice: 就绝不会发亮
  rationale: οὐ μή 加虚拟式构成强烈否定；στίλβω 表示闪亮、发光，译文保留强调语气。
- source_word: ᾐσθάνοντο
  choice: 毫无知觉
  rationale: αἰσθάνομαι 表示感觉、察觉；此处以偶像在铸造时没有感知来揭示其无生命，译作“毫无知觉”自然且准确。
theological_decisions:
- issue: “它们”所指及偶像无知觉的论证
  choice: 前半句补出“偶像”，末句以“它们”指偶像
  alternative: 将末句理解为金子没有知觉
  rationale: 本段持续谈论偶像，复数动词 στίλψωσιν、ἐχωνεύοντο、ᾐσθάνοντο 的语法主语自然回指复数偶像，而 τὸ χρυσίον 为单数；译文据此明确指代，但不增添额外神学解释。
- issue: ἐχωνεύοντο 的工艺含义
  choice: 被铸造时
  alternative: 被熔炼时
  rationale: χωνεύω 可涵盖熔化、熔铸过程；在偶像制作语境中“被铸造”更自然，也与复数偶像作为主语相符。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号保留希腊文两分句间的因果推进；不加脚注，因为关键语义可在正文中自然表达。
