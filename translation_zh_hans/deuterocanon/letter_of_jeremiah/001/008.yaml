  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/008.yaml
  text: And as for a woman who loves adornment[a], taking gold they make crowns for the heads of their gods;
translation:
  language: zh_hans
  text: 又如同为爱妆饰的少女制作冠冕一样，他们取金子，为他们的神明制作冠冕，戴在神明的头上；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ
  choice: 好像……一样
  rationale: 明确保留比较结构；比“至于”更直接体现希腊语的比喻含义。
- source_word: παρθένῳ
  choice: 少女
  rationale: 该词通常指处女或未婚少女；“少女”在现代汉语中自然，也较少让经文不必要地突出性经历。字面上的另一译法见脚注。
- source_word: φιλοκόσμῳ
  choice: 爱打扮的
  rationale: 表达喜爱装饰、妆扮之意；“爱打扮”通俗自然，适合修饰这里的少女形象。
- source_word: λαμβάνοντες
  choice: 拿来
  rationale: 保留分词所表达的先行动作，并使汉语动作顺序清楚。
- source_word: χρυσίον
  choice: 金子
  rationale: 直接对应金这一材料，不增添原文没有明说的具体物件。
- source_word: κατασκευάζουσιν
  choice: 制作
  rationale: 在以冠冕为宾语时，既准确表达制造、打造之意，又符合庄重的现代汉语。
- source_word: στεφάνους
  choice: 冠冕
  rationale: 该词可指花冠、冠冕；此处以金制成并置于神像头上，译作“冠冕”最符合语境。
- source_word: ἐπὶ τὰς κεφαλάς
  choice: 戴在……头上
  rationale: 表达冠冕被制作后置于头上的目的和位置；汉语比直译为“在头上”更完整自然。
- source_word: τῶν θεῶν αὐτῶν
  choice: 他们的神明
  rationale: 保留原文“他们的神”的措辞，不在正文中解释性地改作“偶像”；重复“神明”以避免代词所指含混。
theological_decisions:
- issue: θεῶν应译作“神明”还是解释为“偶像”
  choice: 他们的神明
  alternative: 他们的偶像
  rationale: 上下文虽在讽刺偶像，希腊文本此处仍称其为“他们的神”。正文保留原词所造成的论战张力，不以解释取代翻译。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“又”承接上下文，“好像……一样”保留明示的比较关系。句末分号依照该句在较长论述中的延续性质；若独立排版，可按编辑体例改为句号。
