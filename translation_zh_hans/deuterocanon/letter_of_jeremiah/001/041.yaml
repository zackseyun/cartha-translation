  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: zh_hans
  text: 这些偶像自己即使有所领悟，也不能离开它们[a]；因为它们没有知觉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “即使有所领悟”也可较直译为“明白以后”或“明白了，仍不能离开它们”；希腊语分词νοήσαντες可带让步意义，也可按时间或伴随意义理解。
    reason: 保留νοήσαντες在让步与时间／伴随用法之间的语法歧义。
lexical_decisions:
- source_word: οὐ δύνανται
  choice: 不能
  rationale: 直接表达能力上的欠缺，简洁自然。
- source_word: αὐτοὶ
  choice: 他们自己
  rationale: 保留强调代词的语气；结合上文，所指是仍旧敬奉偶像的人，而不是偶像本身。
- source_word: νοήσαντες
  choice: 即使明白了
  rationale: 将不定过去时分词理解为让步用法，呈现经文的讽刺张力；“明白”兼顾认知与领悟之意，又不把程度说得过满。
- source_word: καταλιπεῖν
  choice: 离弃
  rationale: 既可表达离开，也可表达放弃，适合人对偶像的关系，并保留原词的空间与弃绝意味。
- source_word: αὐτά
  choice: 它们
  rationale: 保留中性复数代词的简洁表达；从上下文可知其所指为偶像。
- source_word: αἴσθησιν
  choice: 辨识力
  rationale: 这里不是单指感官知觉，而是指察觉、判断的能力；“辨识力”符合针对偶像崇拜者无知的论辩语境。
- source_word: οὐκ ἔχουσιν
  choice: 没有
  rationale: 自然、直接地表达否定拥有。
theological_decisions:
- issue: αὐτοὶ的所指与偶像论辩的修辞对象
  choice: 理解为上文所说敬奉偶像的人，并以“他们自己”保留强调
  alternative: 理解为偶像自己
  rationale: καταλιπεῖν αὐτά中的αὐτά自然指偶像，因此主语αὐτοὶ更合理地指不能离弃偶像的人；这也与末句“没有辨识力”对人的讽刺相合。
- issue: νοήσαντες与主句的逻辑关系
  choice: 按让步意义译为“即使明白了”
  alternative: 按时间或伴随意义译为“明白以后”或“有所领悟，却不能……”
  rationale: 让步译法保留“似乎明白却仍不能离弃”的讽刺张力，但希腊语分词本身没有明示逻辑关系，因此以脚注保留另一种较直译的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“离弃”比“丢下”更适合敬奉者与偶像的关系；“辨识力”避免把αἴσθησις局限为生理感觉。脚注标记已在正文中出现。
