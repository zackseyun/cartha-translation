  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/072.yaml
  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: zh_hans
  text: 因此，没有偶像的义人[a]更好，因为他必远离羞辱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正直的人”。希腊文采用阳性单数，在这里可具有代表性。
    reason: lexical_alternative
  - marker: b
    text: “羞辱”也可译作“耻辱”或“责难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  choice: 更好
  rationale: 保留比较级的评价含义；现代汉语中简洁自然，也不把比较对象在原文未明说之处擅自补出。
- source_word: οὖν
  choice: 因此
  rationale: 明确表达本句是从前文论证所得出的结论。
- source_word: ἄνθρωπος δίκαιος
  choice: 义人
  rationale: “义人”准确传达 δίκαιος 的圣经伦理含义，又是现代中文读者熟悉而庄重的说法；后文用“他”照应希腊文阳性单数。
- source_word: οὐκ ἔχων εἴδωλα
  choice: 没有偶像的
  rationale: 自然地表达分词短语对“义人”的修饰，并保留原文所否定的拥有或持有偶像之意。
- source_word: ἔσται
  choice: 他必
  rationale: 表达 εἰμί 的将来时；“必”在此简洁庄重，指向将来的结果，不额外引入命令或应许色彩。
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: 远离羞辱
  rationale: 保留空间性隐喻“远离”；“羞辱”兼具受责难与蒙羞的含义，适合本段偶像受辱的语境。
theological_decisions:
- issue: 阳性单数 ἄνθρωπος 的表达
  choice: 义人……他
  alternative: 正直的人……这个人
  rationale: 汉语名词“义人”本身不标语法性别，但以“他”照应，可保留原文阳性单数形式，同时不否定该陈述可能具有代表性或普遍适用的意义。
- issue: 比较对象未在本句明说
  choice: 更好
  alternative: 胜过偶像
  rationale: κρείσσον 是比较级，但本句没有明示比较对象；译文保留这种依赖上文的含蓄性，不把“胜过偶像”等解释直接写进正文。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“因此”承接前文论证；句式尽量贴近希腊文的结论与理由结构，同时避免生硬直译。“义人”保留圣经语域，但普通读者仍易理解。
