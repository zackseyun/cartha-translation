  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/038.yaml
  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: zh_hans
  text: 木制的、镀金的和镀银的东西，像从山上来的石头一样；服事它们的人必蒙羞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜它们的人。”希腊语动词既可指服事，也可指宗教性的敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: 山上的石头
  rationale: 该短语是与格复数，作ὡμοιωμένοι所引出的比较对象。译为“山上的石头”自然简洁，并保留普通、无生命之石的意象；“从山里来的石头”虽更逐字，却不够自然。
- source_word: ὡμοιωμένοι εἰσὶν
  choice: 就像……一样
  rationale: 形式上是完成时被动分词与εἰμί构成的状态表达，此处表示相似或可比；现代汉语用“就像……一样”最自然。
- source_word: τὰ ξύλινα
  choice: 木制的……这些东西
  rationale: ξύλινα是中性复数形容词的名词化用法，直指“木制之物”。上下文虽表明是偶像，本句却未明说，故保留较宽泛的措辞。
- source_word: τὰ περίχρυσα
  choice: 包金的
  rationale: περίχρυσα指外面覆有金子的物件。“包金的”清楚表达表层覆金，而不暗示通体由金制成。
- source_word: τὰ περιάργυρα
  choice: 包银的
  rationale: 与περίχρυσα平行，表示外面覆银的物件；“包银的”既简洁又保留材质意象和句式平行。
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: 服事它们的人
  rationale: θεραπεύω可指服侍、照料，也可在宗教语境中指敬拜。“服事”保留其语义幅度，同时符合事奉偶像的宗教语境。
- source_word: κατασχυνθήσονται
  choice: 必蒙羞
  rationale: 该词是将来时被动语态。“必蒙羞”在现代庄重汉语中保留其被动色彩，也传达预告性的审判意味。
theological_decisions:
- issue: 偶像语境中θεραπεύοντες的译法
  choice: 服事它们的人
  alternative: 敬拜它们的人
  rationale: 语境显然涉及宗教行为，因此“敬拜”在意义上成立；但“服事”更能保留希腊词兼有侍奉、照管和宗教崇拜的语义范围，不把原文的宽度收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“木制的、包金的和包银的这些东西”保留原文三个名词化形容词的并列结构，又避免在正文中直接补出原文未明说的“偶像”。脚注标记置于与其所释“服事”相关的整句末尾。
