  text: To whom[a], then, is it known that they are not gods?
translation:
  language: zh_hans
  text: 那么，谁[a]知道它们不是神呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：那么，对谁来说，它们不是神这件事是已知的呢？
    reason: 保留 Τίνι 与非人称结构 γνωστὸν ἐστὶν 的句法形式；正文采用较自然的现代汉语。
lexical_decisions:
- source_word: Τίνι
  choice: 谁
  rationale: 这是疑问代词的与格，在非人称结构 γνωστὸν ἐστὶν 中表示“对谁而言是已知的”。正文用现代汉语自然表达“谁知道”，并以脚注保留希腊语句法。
- source_word: οὖν
  choice: 那么
  rationale: 承接上文并引出推论或追问；“那么”既自然，又不把逻辑关系强化为严格的“因此”。
- source_word: γνωστὸν ἐστὶν
  choice: 知道
  rationale: 希腊语为非人称表达“是已知的”。汉语以“谁知道”传达同一意义，避免生硬的欧化句式。
- source_word: ὅτι
  choice: （引出宾语从句）
  rationale: 连接所知的内容；现代汉语中无需另译，可由“知道它们……”自然体现。
- source_word: οὐκ εἰσὶν
  choice: 不是
  rationale: 直接保留否定系词的含义，不扩展为“根本算不上”或其他更强措辞。
- source_word: θεοί
  choice: 神
  rationale: θεοί 是 θεός 的复数。现代汉语名词通常不以形态标示复数，而主语“它们”已清楚表明复数所指。
theological_decisions:
- issue: 对偶像并非神的表述
  choice: 它们不是神
  alternative: 它们根本算不上神
  rationale: 原文是直接的否定系词“不是神”。正文保留这一朴素而明确的判断，不用更强烈的汉语措辞替原文加重论断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“它们”承接上下文中的偶像；疑问句末用“呢”体现反问或追问语气，但不额外断定其修辞力度。
