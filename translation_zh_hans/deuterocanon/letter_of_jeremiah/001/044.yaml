  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/044.yaml
  text: Everything that happens to them is false[a]; how then should one suppose or call them gods?
translation:
  language: zh_hans
  text: 凡发生在它们身上的事都是虚假的；那么，怎能认为或称它们为确实存在的神呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，怎能认为它们是神，或称它们为神呢？”希腊文句末明确有“存在”的动词；此处可理解为“它们作为神而存在”的意思。
    reason: 原文末尾 αὐτοὺς ὑπάρχειν 明示存在性；脚注说明较简洁译法未逐字表达的成分，同时不强定有争议的句法细节。
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  choice: 凡发生在它们身上的事
  rationale: γενόμενα可指发生、出现或成就的事；αὐτοῖς表示这些事与偶像相关。此译保留短语的广泛含义，不擅自限定施事者。
- source_word: ψευδῆ
  choice: 都是虚假的
  rationale: ψευδῆ是与中性复数主语呼应的表语形容词，意为虚假、不真实；译作“虚假的”既简洁，也不额外强化为主动欺骗。
- source_word: πῶς οὖν
  choice: 那么，怎能
  rationale: 既表达οὖν承接上文的推论关系，也以反问语气自然呈现πῶς在本句中的修辞作用。
- source_word: νομιστέον
  choice: 怎能认为
  rationale: 该动词性形容词构成无人称的应然或可然表达；在反问中译为“怎能认为”，兼顾语义和现代汉语表达。
- source_word: κλητέον
  choice: 或称……为
  rationale: 与νομιστέον并列，表示给某对象命名或称呼；“称……为”是自然、准确的汉语说法。
- source_word: ὡς θεοὺς
  choice: 为神
  rationale: θεούς明确指“神”；在κλητέον之后用“称……为神”自然表达ὡς的身份或类别含义。
- source_word: αὐτοὺς ὑπάρχειν
  choice: 它们确实是
  rationale: ὑπάρχειν带有实际存在或确实为某物的意味。译文在“认为它们确实是神”中明示这一层意思，同时避免生硬地另加“存在”一词。
- source_word: αὐτούς
  choice: 它们
  rationale: 所指对象是偶像或神像，现代汉语通常使用非人称代词“它们”，以免赋予其人格或生命。
theological_decisions:
- issue: 本节对偶像所谓神性的否定
  choice: 译作“认为它们确实是神，或称它们为神”，保留ὑπάρχειν所带的实际为神之意。
  alternative: 可简译为“认为或称它们是神”，把存在性含义含蓄地并入“是”。
  rationale: 原文末尾明确使用ὑπάρχειν，不能完全忽略；但其句法与νομιστέον、κλητέον及ὡς θεούς的关系较紧密，不宜扩展成超出本节反偶像语境的形而上论断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……都是……”保留原文的概括力度；反问句简洁有力。以“它们”指偶像，符合现代汉语习惯。
