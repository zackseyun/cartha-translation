  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: zh_hans
  text: 所以，你们进入巴比伦以后，会在那里停留许多年，而且日子很长，直到七代[a]；但此后，我必带你们平安地离开那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“共七代之久。”希腊文直译为“直到七代”，可能是以概数或程式化的方式描述流亡延续的时期。
    reason: 说明ἕως γενεῶν ἑπτά的句法译法及其可能保留的时间表达歧义。
lexical_decisions:
- source_word: εἰσελθόντες οὖν εἰς Βαβυλῶνα
  choice: 所以，你们进入巴比伦以后
  rationale: 将不定过去时分词按其与将来时主句的时间关系译为“进入……以后”，并以“所以”保留οὖν承接上文、引出结果的作用。
- source_word: ἔσεσθε ἐκεῖ
  choice: 会在那里住
  rationale: 原文直译为“会在那里”；汉语补出合乎处境的“住”，自然表达在巴比伦停留的意思，不增添归返地点等信息。
- source_word: ἔτη πλείω καὶ χρόνον μακρόν
  choice: 许多年，时间漫长
  rationale: πλείω在此没有明示的比较对象，故译作“许多”；分开保留“许多年”和“时间漫长”两个表达，以呈现原文对长期滞留的强调。
- source_word: ἕως γενεῶν ἑπτά
  choice: 直到七代
  rationale: 按ἕως的通常含义译为“直到”，并保留γενεῶν的复数和数字“七”，不擅自改成“直到第七代”或确定为精确年数。
- source_word: μετὰ τοῦτο δὲ
  choice: 但此后
  rationale: “但”体现δὲ从长期居留转向获准离开的轻微对比，“此后”对应μετὰ τοῦτο。
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: 我必带你们离开那里
  rationale: ἐξάξω表示带出、领出；译文保留主动施行者“我”和离开巴比伦的动作，不添加原文未明说的“归回”或“拯救”。
- source_word: μετʼ εἰρήνης
  choice: 平安地
  rationale: 以现代汉语常用副词表达动作发生时的平安状态或方式，不把εἰρήνη扩展解释为特定政治或神学概念。
theological_decisions:
- issue: 是否把离开巴比伦的应许强化为“拯救”或“领回”
  choice: 我必带你们平安地离开那里
  alternative: 我必拯救你们，使你们平安归回
  rationale: 原文ἐξάξω只明确说“带出”，没有明说“归回”或使用更强的“拯救”用语；因此保留应许本身而不增添目的地或救赎术语。
- issue: “七代”是精确期限还是修辞性期限
  choice: 正文保留“直到七代”
  alternative: 共七代之久／直到第七代
  rationale: 原文ἕως γενεῶν ἑπτά在表达上可以被理解为持续七代，也可能是概括或程式化地描述流亡期；正文不替读者消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“会在那里住许多年，时间漫长”有意保留原文两个并列的时长表达；“直到七代”略带源文色彩，以免把含义过早限定为“第七代”或精确的七个世代。
