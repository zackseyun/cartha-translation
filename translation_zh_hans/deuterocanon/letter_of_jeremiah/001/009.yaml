  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/009.yaml
  text: And there are times when the priests[a], taking gold and silver from their gods, spend it on themselves,
translation:
  language: zh_hans
  text: 有时，祭司暗中从他们的神那里取走金银[a]，供自己花用，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暗中取走”也可译作“偷走”或“私自拿走”。
    reason: 保留ὑφαιρούμενοι在暗中取用与明确偷窃之间的词义幅度。
lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: 有时
  rationale: 这是表示反复出现之情形的惯用语；译作“有时”简洁自然，也保留其一般性。
- source_word: ὑφαιρούμενοι
  choice: 暗中取走
  rationale: 该分词有从下面或暗中拿走、私自侵取之意。“暗中取走”保留隐秘和不当取用的意味，又不直接把法律意义上的“偷窃”定死。
- source_word: οἱ ἱερεῖς
  choice: 祭司们
  rationale: 直接对应带冠词的复数名词，现代汉语用“们”明确其复数主体。
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: 从他们的神像那里
  rationale: ἀπό表示取走之来源；在本书讽刺人手所造偶像的语境中，“神像”比单称“神”更清楚地指向祭司所侍奉的偶像，同时保留“他们的”所形成的反讽。
- source_word: χρυσὸν καὶ ἀργύριον
  choice: 金银
  rationale: 原文只说明贵重材料，未限定为器物或装饰；“金银”准确且符合汉语习惯。
- source_word: εἰς ἑαυτοὺς
  choice: 在自己身上
  rationale: 与καταναλοῦσιν连用，表明消耗的对象或利益归向祭司自己；此译自然呈现自利意味。
- source_word: καταναλοῦσιν
  choice: 花
  rationale: 该动词可指耗尽、花费。以金银为宾语时，“花”符合经济语境，也自然衔接“在自己身上”。
theological_decisions:
- issue: 祭司侵取偶像财物的讽刺力度
  choice: 译文明确祭司暗中从自己所侍奉的神像那里取走金银供自己花用，显出偶像无力保护自身及祭司的腐败。
  alternative: 可将ὑφαιρούμενοι直译为“偷走”，进一步强化罪行性质。
  rationale: “暗中取走”既保留该词常含的隐秘、不当侵取意味，也避免把其有一定弹性的词义收窄为唯一的法律定性；经文的反偶像讽刺并未因此削弱。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“神像”按全书偶像论述的具体语境处理；句末保留逗号，以对应此节在原文中尚未完结的句法。
