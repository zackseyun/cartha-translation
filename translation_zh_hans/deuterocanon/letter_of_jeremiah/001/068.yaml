  text: Therefore, it is in no way evident to us that they are gods; so do not fear them.
translation:
  language: zh_hans
  text: 所以，我们丝毫看不出它们是神；因此，不要惧怕它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: 无论如何……都不
  rationale: 该习语表达彻底否定；这一汉语结构自然地保留了其强调力度。
- source_word: φανερὸν
  choice: 看得出
  rationale: 此处指某事显明、可辨认；“看得出”符合“对我们而言”的认知视角，也适合现代汉语。
- source_word: θεοί
  choice: 神
  rationale: 直译复数 θεοί。现代汉语中“神”本身通常不作形态上的单复数区分；由“它们”清楚显示此处为复数所指。
- source_word: μὴ φοβῆσθε
  choice: 不要惧怕
  rationale: 直接保留否定命令的语气；“惧怕”庄重而仍为现代读者易懂。
- source_word: διό
  choice: 因此
  rationale: 明确表达由前句结论引出的推论关系。
theological_decisions:
- issue: 末句 αὐτούς 的所指
  choice: 译作“它们”，指上下文中被误认为神的偶像
  alternative: 将所指明说为“这些偶像”
  rationale: 保留希腊文代词形式及其上下文所指，不在正文中增添原文未明说的名词。
- issue: “它们是神”作为间接陈述的处理
  choice: 保留“是神”的表述，同时由“看不出”加以否定
  alternative: 直译为“它们不是神”
  rationale: 原文否定的是其神性有任何显明证据，而非直接采用简单系词否定；这样可保存原句的论证形式和语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“所以”承接前文，“因此”对应本句内部的 διό；两层推论虽有重复感，却反映原文 οὖν 与 διό 的双重逻辑连接。无脚注需要。
