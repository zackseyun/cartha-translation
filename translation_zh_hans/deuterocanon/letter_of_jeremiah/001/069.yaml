  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: zh_hans
  text: 因为正如黄瓜园无人看守[a]，他们的神也是木头做的，外面包着金和银。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无人看守”所对应的希腊语在文本和词义上都较难确定；大意是黄瓜园处于无人守望、没有保护的状态。
    reason: textual_variant
lexical_decisions:
- source_word: σικυηράτῳ
  choice: 黄瓜园
  rationale: 该词指种植黄瓜或葫芦类作物的园地；“黄瓜园”具体自然，并保留原文的农业意象。
- source_word: προβάσκάινόν οὐδὲν φυλάσσον
  choice: 无人看守
  rationale: 传世希腊文本在词形和句法上均有困难；结合上下文，表达园地没有得到看守或保护。“无人看守”保持这一基本意思，同时不采纳过于具体的文本重构。
- source_word: θεοὶ
  choice: 神
  rationale: 原文用的是“神”，而非“偶像”；保留此称呼，能呈现作者随后以其木质材料揭露其虚妄的讽刺论述。
- source_word: ξύλινοι
  choice: 木头做的
  rationale: 直接说明这些所谓的神以木材制成，现代汉语清楚自然，也保留原文的贬抑语气。
- source_word: περίχρυσοι καὶ περιάργυροι
  choice: 外面包着金银
  rationale: 两个复合形容词表示表面分别覆有金和银，并非由纯金纯银制成；合译为“外面包着金银”简洁而准确。
theological_decisions:
- issue: 在反偶像崇拜语境中，θεοὶ应译为“神”还是解释性地译为“偶像”
  choice: 神
  alternative: 偶像
  rationale: 原文有意称之为“他们的神”，随即指出它们不过是包着金银的木制品。译作“神”保留原文的论战修辞及其张力，不以解释性词语替代原词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为，正如……也……”保留原文的因果连接和明喻结构；“木头做的，外面包着金银”以日常可懂的措辞准确区分木质本体与贵金属外层。
