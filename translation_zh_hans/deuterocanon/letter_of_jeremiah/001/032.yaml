  text: After taking garments from them[a], the priests clothe their wives and children.
translation:
  language: zh_hans
  text: 祭司从它们身上取下衣服[a]，然后给自己的妻子和孩子穿上这些衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”指上下文所说的偶像。
    reason: 说明代词的上下文所指。
lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν
  choice: 从它们身上取下衣服
  rationale: ἀπό与属格表示从某处移走；ἱματισμός在此集合性地指衣服。这样表达既自然，也保留了αὐτῶν的代词形式及其上下文指向。
- source_word: ἀφελόμενοι
  choice: 取下
  rationale: ἀφαιρέω的简过去时中间语态分词表示先于主句发生的移除动作；汉语按动作顺序表达即可，无须机械译出分词结构。
- source_word: οἱ ἱερεῖς
  choice: 祭司
  rationale: 直译有定冠词的ἱερεῖς；上下文已表明他们是侍奉偶像的祭司，不另加原文没有的所属语。
- source_word: ἐνδύουσιν
  choice: 给……穿上
  rationale: 此处ἐνδύω为使某人穿上衣物；“给……穿上”是现代汉语自然且准确的表达。
- source_word: τὰς γυναῖκας αὐτῶν
  choice: 自己的妻子
  rationale: αὐτῶν指祭司；“自己的”在汉语中自然标明主语与所属者相同，并避免误解为偶像的妻子。
- source_word: τὰ παιδία
  choice: 孩子
  rationale: παιδία可泛指儿童；“孩子”简明自然，不额外限定年龄或性别。
theological_decisions:
- issue: “它们”（αὐτῶν）的所指
  choice: 正文保留代词“它们”，脚注说明指偶像。
  alternative: 在正文直接译作“偶像”。
  rationale: 上下文表明祭司取下的是偶像身上的衣服，但希腊文本本节使用代词而非名词。正文保留其指代形式，脚注帮助独立阅读时辨明所指，既忠于原文，也不消除上下文关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“从它们身上取下衣服”具体呈现从偶像身上脱取衣物的动作；按汉语习惯将分词与主句顺接。
