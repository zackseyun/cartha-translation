  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: zh_hans
  text: 同样，它们绝不可能赐下财富或青铜[a]；若有人向它们许了愿却不还愿，它们也绝不会追索所许的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铜”；这里也可能指铜币或由这种金属制成的贵重物。
    reason: lexical_alternative
  - marker: b
    text: “追索”也可译作“寻找”或“要求交付”；希腊文直译为“寻求它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: 同样
  rationale: 承接上下文中对偶像无能的并列论证，简洁自然。
- source_word: πλοῦτον
  choice: 财富
  rationale: 表示广义的财富或富足，不限于钱币。
- source_word: χαλκὸν
  choice: 青铜
  rationale: 保留希腊文所指的金属；该词也可指铜，语境中还可能联想到金属货币或贵重物。
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: 绝不可能赐下
  rationale: 用“绝不可能”体现οὐ μή加虚拟式的强烈否定；“赐下”符合向神明求取福惠的语境。
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος μὴ ἀποδῷ
  choice: 若有人向它们许了愿却不还愿
  rationale: εὐχὴν εὐξάμενος是“许愿”的同源宾语结构；ἀποδῷ在誓愿语境中指履行、偿付，汉语“还愿”自然地保留了偿还之意。
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: 也绝不会追索所许的
  rationale: 再次保留强烈否定；“追索”兼具寻找和要求偿付的意味，避免只译成“要求”而完全消除原词“寻求”的词义张力。
theological_decisions:
- issue: 偶像对物质福惠与誓愿的无能
  choice: 经文说偶像既不能赐下财富或金属财物，也不会追索人未履行的誓愿。
  alternative: 可把“青铜”理解为铜钱或金属财物，并把末句直译为“它们也绝不会寻找”。
  rationale: 上下文旨在揭示偶像毫无能力；译文保留这一点，同时不把“青铜”径直限定为钱币，也不把ἐπιζητέω单义化为司法性的“追讨”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“绝不可能”和“绝不会”传达原文两处强烈否定；“许愿—还愿”是普通读者熟悉的自然搭配。脚注标在实际存在词义差异的“青铜”和“追索所许的”之后。
