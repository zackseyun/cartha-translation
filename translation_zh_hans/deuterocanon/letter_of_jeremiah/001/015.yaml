- source_word: συντριβὲν
  choice: 破碎后
  rationale: 表达不定过去时被动分词所呈现的受损完成状态，并显明它先于成为无用的结果。
- source_word: ἄχρειον
  choice: 无用
  rationale: 清楚表达器皿失去实际用途，语言简洁而庄重。
- source_word: γίνεται
  choice: 变得
  rationale: 保留由完好到无用的状态变化。
