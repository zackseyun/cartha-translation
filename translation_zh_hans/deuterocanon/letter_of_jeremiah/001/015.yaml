lexical_decisions:
- source_word: Ὥσπερ
  choice: 正如
  rationale: 自然地引出比喻，并保留鲜明的比较作用。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句承接上文的解释性连接；置于句首符合现代汉语表达。
- source_word: σκεῦος
  choice: 器皿
  rationale: 保留原词所指有实际用途之物的宽泛形象，又不擅自限定为陶器。
- source_word: ἀνθρώπου
  choice: 人的
