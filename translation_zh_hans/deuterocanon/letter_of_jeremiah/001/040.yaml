base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: zh_hans
  text: 再者，连迦勒底人自己也羞辱这些偶像：他们每逢看见一个不能说话的失语者，就把彼勒带来，要求彼勒发声[a]，好像他真能有所察觉似的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“把彼勒带来，要求他发声”。也有人按求医的场景理解为：把失语者带到彼勒面前，求彼勒使他开口说话；但现存希腊文在“带来”之后直接以“彼勒”为宾语。
    reason: 句法歧义及译法差异
  - marker: b
    text: 彼勒是巴比伦神祇的称号或神名，与马尔杜克有关。
    reason: 文化背景
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: 再者，连……也
  rationale: 既表达递进补充，也保留 καὶ 在此处的强调作用；现代汉语自然且适合论辩语境。
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: 迦勒底人自己
  rationale: αὐτῶν 与定冠词名词连用具有强调意味，重点是连敬奉这些偶像的本族人也以实际行动羞辱它们，并非明确指“部分迦勒底人”。
- source_word: ἀτιμαζόντων αὐτά
  choice: 羞辱这些偶像
  rationale: ἀτιμάζω 表示使之受辱、不给尊荣；将代词所指的偶像明确译出，以免汉语中的“他们”与迦勒底人混淆。
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: 不能说话的哑人
  rationale: 忠实保留原文近乎解释性的重复，同时采用现代、非贬损性的普通表达。
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: 把彼勒抬来
  rationale: 希腊文明确以 τὸν Βῆλον 为 προσενεγκάμενοι 的宾语，即被带来的是彼勒（实际语境中指其神像）；“抬来”比泛泛的“带来”更能自然暗示偶像被搬动，却不在正文中过度解释。
- source_word: Βῆλον
  choice: 彼勒
  rationale: 采用清楚的音译，并避免“贝勒”在现代汉语中容易令人联想到清代爵位。
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: 要求他发声
  rationale: φωνῆσαι 本身是不定式“发声、说出声音”，没有明示使役意义；按紧邻的“彼勒”理解其主语，保留原文对偶像不能发声的讽刺。
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: 好像他真能有所察觉似的
  rationale: αἰσθάνομαι 可指感知、觉察；“有所察觉”保留对象未明的概括性，也传达 ὡς 所带的反事实讽刺。
theological_decisions:
- issue: 迦勒底人的行为如何构成对偶像的羞辱
  choice: 他们把彼勒抬来并要求彼勒发声，从而反讽地暴露偶像既不能感知也不能说话。
  alternative: 他们把哑人带到彼勒面前，求彼勒使哑人开口说话。
  rationale: 替代读法符合某种治病仪式的语境，也见于解释性译法；然而现存希腊文以宾格 τὸν Βῆλον 明确把“彼勒”置为“带来”的宾语，φωνῆσαι 也不是明示使役动词。因此正文优先依从希腊文表层句法，并用脚注保存另一种理解。
- issue: 彼勒指神还是神像
  choice: 正文沿用人格化神名“彼勒”，动作“抬来”暗示实际被搬动的是神像。
  alternative: 直译为“把彼勒神像抬来”。
  rationale: 原文只写 Βῆλον，没有“神像”一词；保留人格化表达可维持全段把偶像当作行动者来讽刺的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哑人”在此仅指不能说话的人；“抬来”凸显彼勒偶像必须由人搬动的讽刺，却未在正文擅加“神像”。脚注标记均置于相关正文之后。
