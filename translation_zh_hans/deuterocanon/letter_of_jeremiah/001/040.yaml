- from: 再者，连迦勒底人自己也羞辱这些偶像：他们每逢看见不能说话的哑人，就把彼勒抬来，要求他发声[a]，好像他真能有所察觉似的。[b]
  to: 再者，连迦勒底人自己也羞辱这些偶像：他们每逢看见一个不能说话的失语者，就把彼勒带来，要求彼勒发声[a]，好像他真能有所察觉似的。[b]
  rationale: 修订只作安全的措辞调整：以“带来”避免把原文未说明的搬运方式具体化；以“失语者”取代旧式的“哑人”；并明确“要求彼勒发声”。保留现有正文的关键句法判断及脚注对英文审计文本所反映的解释性替代读法的说明，不将该替代读法当作正文。
