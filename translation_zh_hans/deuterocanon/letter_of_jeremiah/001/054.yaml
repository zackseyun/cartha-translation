base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: zh_hans
  text: 因为，正如一只乌鸦在天地之间[a]，同样，当火落入供奉木制、包金或包银神像的殿宇时，他们的祭司会逃走，得以保全；神像本身却会像殿宇中间的梁木一样被烧尽。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头的比较十分简略，未明说乌鸦与下文神像相似的具体方面；可能是描绘它暴露无助、灾祸临到时不能自保。
    reason: 保留原文省略形成的歧义，同时帮助读者理解可能的比喻方向。
  - marker: b
    text: “殿宇”直译为“房屋”，即供奉这些神像的房屋或庙宇。
    reason: 说明οἰκία的字面意义及语境性译法。
lexical_decisions:
- source_word: ὥσπερ ... καὶ γὰρ
  choice: 正如……同样
  rationale: 保留希腊文的比较关系，并以现代汉语可理解的对应结构连接前后；原文起句突兀，正文不补明未明说的喻意。
- source_word: κορώνη
  choice: 乌鸦
  rationale: 采用该词通常而具体的鸟名，不泛化为“鸟”。
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 悬在天地之间
  rationale: “在天地之间”对应空间表达；“悬”使省略谓语的希腊语片段在汉语中成句，同时保留其暴露、无所凭依的画面，但不在正文解释比喻。
- source_word: ἐμπέσῃ ... πῦρ
  choice: 火落入
  rationale: 贴近“落入、闯入”的字面和突然而至的动态，避免直接释作“失火”。
- source_word: οἰκίαν θεῶν
  choice: 供奉……神像的殿宇
  rationale: οἰκία字面为“房屋”，语境指放置偶像的宗教建筑；“殿宇”在汉语中自然且不把“众神的房屋”误解为诸神所有的住宅。
- source_word: θεῶν ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: 木制、包金或包银神像
  rationale: 这些形容词修饰“神”；在反偶像语境中用“神像”清楚表明所指是实体偶像，并保留三种材质或包覆方式。
- source_word: φεύξονται καὶ διασωθήσονται
  choice: 会逃走，得以保全
  rationale: 分别保留逃跑的行动和幸免的结果；“得以保全”避免在此处引入可能过强的救恩术语。
- source_word: δοκοὶ μέσοι
  choice: 殿宇中间的梁木
  rationale: δοκοί是建筑梁木，μέσοι表示处于中间或内部；补出“殿宇”明确比较场景，而不武断限定为主梁。
- source_word: κατακαυθήσονται
  choice: 被烧尽
  rationale: 体现复合动词所含彻底焚毁之意。
theological_decisions:
- issue: 开头比喻的省略与含义
  choice: 保留“正如一只乌鸦悬在天地之间”这一突兀比喻，并用脚注说明其希腊文表达简略。
  alternative: 在正文中扩写为偶像像暴露无助的乌鸦，灾祸来临时不能自救。
  rationale: 原文没有明说乌鸦与偶像相似的具体方面；保留张力，避免把一种合理解释写成正文。
- issue: θεῶν应译为“神”还是“神像”
  choice: 按上下文译为“神像”。
  alternative: 直译为“神”。
  rationale: 木制、包金、包银且会像梁木被烧毁的对象显然是实体偶像；译为“神像”表达语境所指，不认可其神性，也不增加宗派性判断。
- issue: οἰκίαν θεῶν的建筑含义
  choice: 正文译作“供奉……神像的殿宇”。
  alternative: 译作“……神的房屋”或“庙宇”。
  rationale: “殿宇”兼顾οἰκία的建筑意义及祭司所在的敬拜场所语境；脚注保留较字面的“房屋”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留反偶像段落鲜明的讽刺对比：祭司能逃生，偶像却与建筑梁木一同烧尽。为避免汉语误读，将材质形容词明确归于“神像”；分号突出人物与偶像命运的对照。
