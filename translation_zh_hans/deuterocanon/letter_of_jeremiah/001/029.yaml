  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/029.yaml
  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: zh_hans
  text: 他们怎么能被称为神呢？[a]因为妇女在银制、金制和木制的神明面前摆上供物。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怎么”直译可作“从哪里”；这里是反问，意为他们没有根据或不可能被称为神。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“摆在……面前”或“呈给……”，没有明说所摆的是“供物”。
    reason: implicit_object
lexical_decisions:
- source_word: Πόθεν
  choice: 怎么
  rationale: 这里与“被称为”连用，构成反问，重点在质疑其可能性或根据；译作“怎么”符合现代汉语表达，同时以脚注保留字面的空间意味。
- source_word: κληθείησαν
  choice: 能被称为
  rationale: 这是καλέω的被动祈愿式，反问中带有潜在或不可能的意味；“能被称为”兼顾被动态和反问语气。
- source_word: θεοί
  choice: 神
  rationale: 原文明确使用“神”，在反偶像语境中具有反讽和论辩作用，不以“偶像”代换。
- source_word: ὅτι
  choice: 因为
  rationale: 引出支持前述反问的理由，保留明确的因果关系。
- source_word: γυναῖκες
  choice: 妇女
  rationale: 忠实保留原文所指的女性群体，措辞庄重自然。
- source_word: παρατιθέασιν
  choice: 在……面前摆上供物
  rationale: 动词本义是“摆在……面前、呈上”；祭祀语境暗含所摆之物为供物。正文补出“供物”以使汉语完整，并在脚注说明原文未明说宾语。
- source_word: θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: 银制、金制和木制的神明
  rationale: 保留三种材质及原文的“神”这一称谓，从而维持其反讽；“神明”在此作具体受祭对象，避免“银、金和木头的神”这种生硬表达。
theological_decisions:
- issue: 在反偶像论述中将θεοί译作“神”还是“偶像”
  choice: 神／神明
  alternative: 偶像
  rationale: 原文刻意称这些物件为“神”，随即质疑这一称呼。保留“神”才能呈现原文的反讽和论证张力，而不是预先替作者作出解释。
- issue: 是否明说παρατιθέασιν所省略的祭祀对象
  choice: 正文补作“供物”，并以脚注说明
  alternative: 只译作“摆在……面前”
  rationale: 原文没有明写宾语，但汉语若完全不补宾语便不完整；“供物”符合祭祀语境，同时脚注使读者知道这是语境性补足，而非希腊文中明载的名词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“又怎么能……呢”传达原文反问力度；保留“神／神明”而不用“偶像”，以维持原文的反讽。两个脚注标记均置于相关正文之后。
