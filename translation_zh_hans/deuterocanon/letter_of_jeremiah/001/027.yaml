base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/027.yaml
  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: zh_hans
  text: 他们的祭司把他们的祭物出售[a]，并从中获利；同样，他们的妇女从这些祭物中取一些腌制起来[b]，却不分给穷人或无助的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“卖掉他们的祭物，并加以利用。”此处希腊文分词在祭物交易的语境中指“出售”；后面的动词指祭司从中使用或获益。
    reason: lexical_alternative
  - marker: b
    text: “腌制”所译的动词指保存食物，很可能是用盐腌制。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: 取回来
  rationale: 该中间语态分词在此可指取回或收回祭物；“取回来”保留动作方向，也传达祭物最终归祭司使用。
- source_word: καταχρῶνται
  choice: 供自己享用
  rationale: 该动词可表示使用、充分使用，语境中指祭司将祭物据为己用；此译法自然地呈现负面语境，但不把词义强化为“滥用”。
- source_word: ταριχεύουσαι
  choice: 腌制起来
  rationale: 该分词指用盐腌等方式保存食物；“腌制”比泛称“保存”更具体地反映古代食物处理方式，同时由脚注说明其范围。
- source_word: μεταδῶσιν
  choice: 分给
  rationale: 该动词表示从自己所有之物中分一份给别人；“分给”准确表达分享的含义。
- source_word: πτωχῷ
  choice: 穷人
  rationale: 单数与格在此具有类别代表意义；汉语以“穷人”自然表达。
- source_word: ἀδυνάτῳ
  choice: 无助的人
  rationale: 该词指缺乏能力、力量或依靠的人；在施舍食物的语境中，“无助的人”比单纯的“软弱者”更贴切，同时保留广义。
theological_decisions:
- issue: 祭司及妇女占用祭物的道德色彩
  choice: 以描述性措辞呈现其据为己用和不肯施舍的行为，让上下文体现批判
  alternative: 将 καταχρῶνται 明译为“滥用”或“侵吞”
  rationale: 希腊文在本句中带有明显的语境性批判，但动词本身不必强制译成明确的法律或道德定罪用语；描述性翻译更能避免过度释义。
- issue: 祭物的对象是否在正文中明说
  choice: 译为“献给偶像的祭物”
  alternative: 仅译为“他们的祭物”
  rationale: αὐτῶν 在本书论述中所指是偶像；补出“献给偶像的”能消除现代汉语中“他们”指祭司的歧义，并未改变本段的指称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“供自己享用”比“加以使用”更符合本句食物祭物的语境；“却一点也不分给”清楚呈现 οὔτε…οὔτε 的双重否定分配关系。正文脚注标记[a]、[b]均已对应列出。
