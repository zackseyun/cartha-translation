  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/053.yaml
  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: zh_hans
  text: 他们连自己的案件也不能审断[a]，也不能解救受冤屈的人，因为他们无能为力；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不能为自己作出判决，也不能救人脱离不义。”希腊文十分紧凑；ἀδίκημα既可指“不义、冤屈”，也可按上下文理解为受冤屈的人或相关案件。
    reason: 保留κρίσις、ἑαυτῶν与ἀδίκημα在紧凑句法中的词义和结构歧义。
lexical_decisions:
- source_word: κρίσίν
  choice: 案件
  rationale: κρίσις在这里具有司法语义，可指审判或案件；与διακρίνωσιν连用时，译作“案件”符合现代汉语表达，也保留法律语境。
- source_word: διακρίνωσιν
  choice: 审断
  rationale: 该词与κρίσιν搭配，表示判定、裁断；“审断”既体现司法意味，又比单说“判断”更清楚。
- source_word: ἑαυτῶν
  choice: 自己的
  rationale: 反身代词表明案件关乎这些偶像本身；“自己的案件”是自然且简洁的汉语。
- source_word: ῥύσωνται
  choice: 解救
  rationale: ῥύομαι指从危险、压迫或困境中救出；“解救”通俗庄重，也不额外引入救恩论含义。
- source_word: ἀδίκημα
  choice: 受冤屈的人
  rationale: 该词通常指不义、恶行或冤屈；在ῥύσωνται之后按语境具体化为遭受不义的人，可使汉语句意完整。由于原词也可抽象理解为“不义”，以脚注保留这种歧义。
- source_word: ἀδύνατοι ὄντες
  choice: 因为他们无能为力
  rationale: 分词短语说明前述不能审断和解救的原因；此译自然呈现其因果作用，并突出偶像实际行动上的无能。
theological_decisions:
- issue: 偶像无能的性质
  choice: 表述为偶像在审断和解救方面无能为力
  alternative: 将其扩展为关于偶像本体或存在性质的全面论断
  rationale: 原文直接强调的是实际与司法层面的无能，并未在本节中提出更广泛的形而上论断，因此不作神学扩展。
- issue: ἀδίκημα所指
  choice: 正文按语境译为“受冤屈的人”，脚注保留“不义／冤屈”的抽象读法
  alternative: 正文直译为“解救不义”或“救人脱离不义”
  rationale: 希腊文表达紧凑，宾语既可能指不义之事，也可能在语境中具体指受害者；正文选择自然可懂的具体表达，同时借脚注保存原文张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“审断”保留司法色彩，“受冤屈的人”使后半句自然明确；分号承接上下文的列举语气。
