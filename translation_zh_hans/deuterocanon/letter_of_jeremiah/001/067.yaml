  text: Wild animals are better than they are[a], because they can escape into shelter and help themselves.
translation:
  language: zh_hans
  text: 野兽比那些偶像强，因为它们能逃到藏身之处，保全自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ θηρία
  choice: 野兽
  rationale: 指野生动物；“野兽”简洁自然，也保留它们与偶像之间的鲜明对比。
- source_word: κρείττω
  choice: 强
  rationale: 该比较级表示优越。这里不是说野兽在道德上更好，而是说它们至少有逃生自保的能力，因此“强”能自然表达实际能力上的胜过。
- source_word: αὐτῶν
  choice: 那些偶像
  rationale: 代词按上下文指前文受讥讽的偶像。中文若只译“它们”容易与野兽混淆，因此明示所指，但不增添新的含义。
- source_word: ἃ δύνανται
  choice: 因为它们能
  rationale: 关系从句说明野兽胜过偶像的理由；译成“因为”符合现代汉语逻辑关系。
- source_word: ἐκφυγόντα
  choice: 逃
  rationale: ἐκφεύγω表示逃脱、逃走。传世希腊文的分词形式略显不协调，译文依句意保留其逃生含义。
- source_word: εἰς σκέπην
  choice: 到藏身之处
  rationale: σκέπη指遮蔽或庇护之处，εἰς表示朝向或进入；“到藏身之处”自然表达这一动作。
- source_word: αὐτὰ ὠφελῆσαι
  choice: 保全自己
  rationale: 字面为使自身受益。上下文强调野兽能采取行动保存自己，而偶像不能；“保全自己”准确传达这种实际自救能力。
theological_decisions:
- issue: 比较对象αὐτῶν的所指
  choice: 明译为“那些偶像”
  alternative: 较形式对应地译作“它们”
  rationale: 整段是在讥讽偶像。中文句中野兽和偶像都可用“它们”，明示“那些偶像”可避免指代混乱，同时不消解经文的神学张力。
- issue: κρείττω所表达的优越性质
  choice: 译作“强”以表示实际能力上胜过
  alternative: 译作“好”或“胜过”
  rationale: 本句并非赋予野兽道德上的善，而是以其能逃生自保来反衬偶像无能。“强”较能限定为能力层面的比较。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式简洁，保留原文对偶像的讽刺；因中文代词可能混淆，按上下文明示“那些偶像”。本节无需脚注。
