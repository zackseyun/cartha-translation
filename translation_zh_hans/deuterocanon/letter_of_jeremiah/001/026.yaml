base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: zh_hans
  text: 所以[a]，它们中若有一个倒在地上，就不能自己起来；即使有人把它扶正，它也不会自行移动；若是歪斜了，也绝不会被扶正。相反，礼物[b]被摆在它们面前，如同摆在死人面前一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译可作：“免得它倒在地上，要靠它们自己起来。”原文措辞较为压缩；上下文的意思是：偶像若倒下，不能自行起来。
    reason: lexical_alternative
  - marker: b
    text: “礼物”也可译作“供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  choice: 所以
  rationale: 此处承接上文并引出由偶像无能而得出的说明；“所以”自然简洁，同时保留推论关系。
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ
  choice: 它们中若有一个倒在地上
  rationale: 希腊文表达较为压缩；结合下文，指某个偶像若倒地。“它们中若有一个”明确其所指，又保留代表性单数。
- source_word: δι' αὐτῶν ἀνίστασθαι
  choice: 就不能自己起来
  rationale: 介词短语表达凭自身、靠自己的意思；上下文着重讥讽偶像没有自行起身的能力。
- source_word: μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ
  choice: 即使有人把它扶正
  rationale: ὀρθὸν στήσῃ 指由外人使偶像直立；“扶正”在现代汉语中自然，也适合已经倒地的具体场景。
- source_word: δι' ἑαυτοῦ κινηθήσεται
  choice: 它也不会自行移动
  rationale: 保留“移动”的宽泛含义和“靠自己”的反身意味，不将其窄化为某一种动作。
- source_word: μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ
  choice: 若是歪斜了，也绝不会自己直立起来
  rationale: κλιθῇ 表示倾斜、歪倒；οὐ μὴ 加虚拟式为强烈否定。“绝不会”体现其强调语气；依上下文补出“自己”，表明偶像不能自行恢复直立。
- source_word: ἀλλ' ὥσπερ νεκροῖς
  choice: 相反，……就像摆在死人面前一样
  rationale: ἀλλά 构成鲜明转折；“死人”直接保留与无生命者的比较，语体自然而庄重。
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: 人把礼物摆在它们面前
  rationale: δῶρα 可泛指礼物，也可在祭祀语境中指供物；正文采用较宽的“礼物”，并以脚注说明另一译法。παρατίθεται 用主动式泛指“人把……摆在”，符合自然汉语且不改变施事未明的事实。
theological_decisions:
- issue: 偶像所用代词的单复数转换
  choice: 条件句以“它们中若有一个”引出代表性的单数“它”，结尾则以复数“它们”指整个偶像类别
  alternative: 全文都用复数，或全文都用代表性单数
  rationale: 原文在概括偶像时形式有不规则转换。此译法既明确倒地的是偶像之一，又自然保留结尾对所有偶像的集体描述。
- issue: οὐ μὴ ὀρθωθῇ 是否表示外力使其直立或自行直立
  choice: 译作“绝不会自己直立起来”
  alternative: 译作“绝不会被扶正”或“绝不会变直”
  rationale: 动词形式本身可容被动理解，但上下文连续强调偶像不能自行起身、移动；正文据此表达自行恢复直立的无能，同时不引入额外神学解释。
- issue: δῶρα 的礼仪色彩
  choice: 正文作“礼物”，脚注列“供物”
  alternative: 正文直接作“供物”
  rationale: “礼物”保留希腊词的宽泛词义，“供物”则更凸显敬拜偶像的礼仪语境；以脚注呈现可保留这一词义张力。
translation_notes:
  register: 采用现代、庄重且通顺的书面汉语。“倒在地上—扶正—自行移动—歪斜—直立”保留原文连续的具体动作意象；“相反”突出偶像与死人同样无能的讽刺对比。所有脚注标记均已置于正文对应位置。
