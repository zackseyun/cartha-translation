  text: For my angel is with you, and he himself is seeking your lives.
translation:
  language: zh_hans
  text: 因为我的天使与你们同在，他也亲自看顾你们的性命[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵魂”。希腊语ψυχή可指“性命”“生命”“灵魂”，也可指人本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελός
  choice: 天使
  rationale: ἄγγελος既可指人的使者，也可指天上的使者；这里是上帝以第一人称所说“我的……”，并涉及对众人的照看，因此“天使”最符合语境，同时不进一步界定其身份。
- source_word: μεθʼ ὑμῶν
  choice: 与你们同在
  rationale: μετά加属格通常表示“与……同在”；此译法直接、自然，也保留陪伴和临在的意味。
- source_word: αὐτὸς
  choice: 亲自
  rationale: αὐτός在此带强调意味，指前面的天使亲自采取行动；“亲自”在现代汉语中自然地保留了这一强调。
- source_word: ἐκζητῶν
  choice: 看顾
  rationale: 该分词本义是“寻求、寻访”。但以“你们的性命”为宾语时，直译成“寻找”在现代汉语中容易被误解为不知道其所在；“看顾”传达语境中的主动关切与照料。
- source_word: τὰς ψυχὰς ὑμῶν
  choice: 你们的性命
  rationale: ψυχή可指生命、性命、灵魂或人本身。这里论到天使与众人同在并加以看顾，“性命”既符合具体的保护语境，也避免把后期的灵魂—身体二分观念带入经文；“灵魂”作为真实的词义可能性保留在脚注中。
theological_decisions:
- issue: 保护语境中ψυχή的含义
  choice: 你们的性命
  alternative: 你们的灵魂
  rationale: “性命”更贴合整个人及其生命受到照看的语境，不把关切范围默认为脱离身体的“灵魂”；但原词确实可以表示“灵魂”，故以脚注保留该张力。
- issue: ἐκζητῶν所表达的行动
  choice: 看顾
  alternative: 寻找
  rationale: “寻找”更贴近字面，却在现代汉语中容易暗示对象失踪；“看顾”呈现此处主动寻访、关切的语用意义，而不把它扩展成特定的救护方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“与你们同在”保留经文语体；“亲自看顾”既体现αὐτός的强调，也避免把ἐκζητέω机械译成容易误解的“寻找”。脚注标记[a]已置于相关词语之后。
