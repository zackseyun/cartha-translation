  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: zh_hans
  text: 它们绝不能在列国中显出天上的征兆[a]，也不能像太阳一样照耀，也不能像月亮一样发光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的”也可译作“天空中的”。希腊词οὐρανός既可指天，也可指天空；这里的语境是天象。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖά
  choice: 征兆
  rationale: σημεῖον可指记号、征兆或异象；此处涉及天象，“征兆”自然地保留了超常迹象的意味，又不限定为凶兆。
- source_word: ἐν ἔθνεσιν
  choice: 在列国中
  rationale: ἔθνη指各国、各族人民；“列国”符合圣经语域，也避免套用新约语境下的“外邦人”。
- source_word: ἐν οὐρανῷ
  choice: 天上的
  rationale: οὐρανός既可指天，也可指天空；结合征兆、太阳和月亮，译作“天上的”可自然修饰“征兆”，同时保留其指涉空间。
- source_word: οὐ μὴ δείξωσιν
  choice: 绝不能……显出
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不能”既表达强调，也符合本节对偶像无能的论述。δείκνυμι在此译为“显出”，适合征兆出现或被展现的语境。
- source_word: λάμψουσιν
  choice: 照耀
  rationale: λάμπω表示发亮、照耀；与太阳相比时，“照耀”庄重自然。
- source_word: φωτιοῦσιν
  choice: 发光
  rationale: φωτίζω可表示照亮或发出光明；“发光”与前面的“照耀”有所区分，并与月亮的比较自然衔接。
- source_word: σελήνη
  choice: 月亮
  rationale: σελήνη通常指月亮；采用现代汉语最通行的名称。
theological_decisions:
- issue: 复数动词所指及省略的主语
  choice: 以“它们”承接上下文中的偶像
  alternative: 明确补作“这些偶像”或泛指“假神”
  rationale: 希腊文仅有复数动词，主语由上下文承接。“它们”作最低限度的补足，不在本节中加入原文未明说的称谓。
- issue: 偶像不能显出天上征兆的陈述力度
  choice: 译作“绝不能”，保留强烈否定
  alternative: 译作“不会”
  rationale: οὐ μή的语气强于普通否定；“绝不能”准确传达其强调，同时不额外推导关于神迹性质的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”保留经文语域；三句以“不能……也不能……也不能……”形成清晰排比。脚注保留οὐρανός在“天”与“天空”之间的真实词义空间。
