  text: Likewise[a], when lightning appears, it is clearly seen; and in the same way the wind blows in every land.
translation:
  language: zh_hans
  text: 同样，闪电一出现，就清晰可见；风[a]也照样吹遍各地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语πνεῦμα也可译为“灵”或“气息”；但这里的自然现象语境以及“吹”这个动词，更支持译作“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: 同样
  rationale: 承接上下文中的类比，简洁保留“照样、同样”的比较作用。
- source_word: ἀστραπὴ
  choice: 闪电
  rationale: 指闪电或一道闪光；“闪电”是现代汉语中自然、准确的表达。
- source_word: ὅταν ἐπιφάνῃ
  choice: 一出现
  rationale: 忠实表达“显现、变得可见”；与“闪电”搭配自然，也保留不定时条件的概括意味。
- source_word: εὔοπτός ἐστιν
  choice: 就清晰可见
  rationale: 表达“容易看见、显而易见”，并保留原文关于可见性的陈述。
- source_word: τὸ δʼ αὐτό
  choice: 也照样
  rationale: 自然呈现“同一情形也适用”的类比延续。
- source_word: πνεῦμα
  choice: 风
  rationale: 此处与自然现象并列，又以πνεῖ（吹）作谓语，因此语境明确偏向气象意义“风”。
- source_word: ἐν πάσῃ χώρᾳ
  choice: 遍各地
  rationale: χώρα可指地方、地域或土地；“遍各地”自然传达其广泛、普遍的范围。
- source_word: πνεῖ
  choice: 吹遍
  rationale: 现在时陈述一般事实；结合范围短语译为“吹遍”，符合现代汉语表达。
theological_decisions:
- issue: πνεῦμα是否应理解为带有神学意味的“灵”
  choice: 风
  alternative: 灵；气息
  rationale: 虽然πνεῦμα也可指“灵”或“气息”，但本节列举可观察的自然现象，且与“吹”及地域范围连用，气象意义最合语境；脚注保留该词的词义可能性，避免把神学含义强加给经文。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“闪电一出现，就清晰可见”贴近希腊文结构；“风也照样吹遍各地”则以自然汉语表达普遍范围，同时保留两句之间的类比关系。
