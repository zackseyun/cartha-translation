  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/070.yaml
  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: zh_hans
  text: 同样，他们那些木制、外包金银的神像，被比作园中用来吓鸟的立物[a]，所有鸟都停在上面；也被比作丢在黑暗中的一具尸体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“园中的柱子”或“园中的守望人像”。这个希腊词很罕见，所描绘的是立在园中的一种物件，鸟儿可以随意停在上面。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: 同样
  rationale: 自然简洁地保留引出类比的作用。
- source_word: βάμψῳ
  choice: 吓鸟架
  rationale: 该词罕见；结合“在园中”及鸟儿停在其上的语境，指园中用于吓鸟的架子或立物。“吓鸟架”既传达主要意象，又避免把形状限定为现代稻草人。
- source_word: ἐν κήπῳ
  choice: 园中
  rationale: κήπος通常指园子；此处无需进一步限定为果园。
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: 任凭各种鸟儿停在上面
  rationale: πᾶν τὸ ὄρνεον在此自然理解为各样鸟类；“任凭”传达鸟儿毫无顾忌地落在这无能之物上的讽刺效果，但未增加新的命题。
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: 被丢在黑暗中的死人
  rationale: 具体保留νεκρός所指的死者，并以“被丢”表达完成时被动态分词ἐρριμμένῳ的弃置意味；“黑暗中”不作形而上解释。
- source_word: ἀφωμοίωνται
  choice: 就像
  rationale: 以现代汉语自然表达相似、相比的意义；希腊语的完成时被动态在汉语中若直译为“被比作”会显生硬，且此处重点是呈现两重比喻。
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: 他们那些木制、包金包银的神像
  rationale: 保留木质本体以及金银包覆；在反偶像语境中译作“神像”明确所指是受崇拜的偶像，而非承认其真实神性。
theological_decisions:
- issue: 反偶像语境中比较的性质
  choice: 将神像比作任鸟停栖的园中吓鸟架和被弃置于黑暗中的死人，突出其无生命、无能力。
  alternative: 将βάμψῳ更字面地译作“园中的柱子”或“园中的守望人像”。
  rationale: 译文保留原文对偶像无能和死寂的讽刺，同时以脚注承认罕见词βάμψῳ的词义不确定性，不把具体形态断定为现代稻草人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“包金包银”简明呈现木质神像外覆金银；分号清楚划分两重类比。脚注标记[a]已置于对应词语之后。
