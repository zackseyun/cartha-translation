  text: For they can neither curse kings nor bless them[a].
translation:
  language: zh_hans
  text: 因为这些偶像既不能咒诅君王，也不能祝福他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“它们绝不会咒诅君王，也不会祝福他们。”原文使用强调否定；结合上下文，意思是这些偶像两样都做不到。
    reason: 说明οὐ μή的强调否定，并保留其较直译的表述；“他们”补出第二分句从前文承接的对象“君王”。
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: 因为……既不……也不
  rationale: γάρ承接上下文，表示解释原因；οὔτε与后一个οὔτε构成并列否定。现代汉语用“因为……既不……也不”自然表达。
- source_word: βασιλεῦσιν
  choice: 君王
  rationale: 这是βασιλεύς的与格复数；与“咒诅、祝福”搭配时，汉语自然以宾语表达，不必机械保留与格形式。
- source_word: οὐ μὴ καταράσωνται
  choice: 不能咒诅
  rationale: οὐ μή加虚拟式构成强烈否定；结合上下文对偶像无能的论述，以“不能”传达其无力施行此事，同时在脚注保留直译可能。
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: 也不能为他们祝福
  rationale: 与前一分句平行；希腊文第二分句省略的对象可由“君王”补足。汉语用“为他们祝福”清楚而自然。
- source_word: implicit subject
  choice: 这些偶像
  rationale: 希腊文动词只显明复数主语，具体所指由上下文确定为偶像；汉语为避免孤立经节中代词指向不明，明确译出“这些偶像”。
theological_decisions:
- issue: 强调否定究竟表达将来绝不会发生，还是表达偶像无能
  choice: 正文译为能力否定：“既不能……也不能……”
  alternative: 译为强烈的将来否定：“绝不会咒诅君王，也不会为他们祝福”
  rationale: οὐ μή可表达强烈否定，但本段语境着重揭示偶像毫无能力。“不能”自然传达论证要点；脚注同时说明希腊文的字面形式，以保留语法上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“君王”符合经文体裁；“咒诅”与“祝福”保持鲜明对举。为使独立经节中的主语清楚，依上下文将复数主语明确译作“这些偶像”。
