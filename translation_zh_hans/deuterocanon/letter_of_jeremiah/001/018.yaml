  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: zh_hans
  text: 人们为偶像点的灯，比为自己点的还多；可是偶像连其中一盏也看不见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”补明上下文所指。希腊原文第二分句没有重复说出“看不见”的主语；“其中”回指前面所点的灯。
    reason: 说明译文为清楚起见补出的上下文指向，并交代“其中”对应希腊文回指“灯”的关系代词。
lexical_decisions:
- source_word: λύχνους
  choice: 灯
  rationale: 该词通常指具体的灯具，尤其是油灯；译作“灯”保留了人在偶像前点灯的具体画面。
- source_word: καίουσιν
  choice: 点
  rationale: 本义为点燃或使燃烧；与“灯”搭配时，现代汉语自然表达为“点灯”。
- source_word: πλείους ἢ ἑαυτοῖς
  choice: 比为自己点的还多
  rationale: 比较的是给偶像和给自己所点之灯的数量；此译补出汉语所需的“点的”，但不增加原文没有的信息。
- source_word: ὧν οὐδένα
  choice: 这些灯……连一盏也
  rationale: 关系代词回指前面的灯，οὐδένα 强调一盏都看不见；“连一盏也”准确传达这种完全否定。
- source_word: δύνανται ἰδεῖν
  choice: 看不见
  rationale: 直接表达没有视觉能力，措辞简明，也切合上下文对偶像无知觉的讽刺。
theological_decisions:
- issue: δύνανται ἰδεῖν 的隐含主语
  choice: 以“它们”指偶像，即偶像看不见为它们点的灯
  alternative: 理解为敬拜者看不见偶像带来的任何益处
  rationale: 希腊文在此没有重述主语，但上下文持续揭露偶像没有知觉；因此将隐含主语理解为偶像最为连贯。脚注说明这一语法现象，避免把解释伪装成原文的明说。
translation_notes:
  register: 采用现代、清楚而庄重的书面语。“人们”与“它们”区分敬拜者和偶像；“可是”凸显人为偶像大量点灯、偶像却毫无视觉能力的讽刺对比。
