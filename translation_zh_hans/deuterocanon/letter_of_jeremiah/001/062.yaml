  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/062.yaml
  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: zh_hans
  text: 从上面发出的火，为焚尽山岭和森林，成就所安排的事；这些偶像无论在外形上还是在力量上，都不能与这火相比[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从上面”也可理解为“从天上”；原文没有明确说“上帝”。“所安排的事”也可译为“所指定的事”或“所吩咐的事”。较直译末句：“这些在外形或力量上都没有被做得像它。”
    reason: theological_ambiguity; lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: 火
  rationale: 取通常字义；本节以自然界中具有毁灭力量的火与无能的偶像作对比。
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: 从上面降下的
  rationale: 保留ἄνωθεν“从上面”的空间性及其可能的神圣来源暗示，但不擅自明确为“从天上”或“从上帝那里”；“降下”也自然表达火从上而来的图景。
- source_word: ἐξαναλῶσαι
  choice: 焚尽
  rationale: 既符合火的动作，也传达ἐξαναλίσκω彻底耗尽、毁灭的加强语气。
- source_word: ὄρη καὶ δρυμούς
  choice: 山岭和森林
  rationale: ὄρη指山地或群山，δρυμούς指林地；此译自然并保留鲜明景象。
- source_word: ποιεῖ τὸ συνταχθέν
  choice: 照所吩咐的去做
  rationale: τὸ συνταχθέν可指所安排、指定或命令之事；“所吩咐的”保留受命执行之意，脚注说明其他可能。
- source_word: ταῦτα
  choice: 这些偶像
  rationale: 代词在上下文中指正在论述的偶像；汉语若只说“这些”指向较弱，因此明示所指，以求清楚。
- source_word: ταῖς ἰδέαις
  choice: 在形态上
  rationale: ἰδέα在此指可见的形状、样貌；“形态”较准确地保留形式层面的比较。
- source_word: ταῖς δυνάμεσιν
  choice: 在能力上
  rationale: δύναμις在此表示实际效能或力量；“能力”与偶像无能的论旨贴合。
- source_word: ἀφωμοιωμένα
  choice: 不能与火相比
  rationale: 该完成时被动分词表达未被做成相似、未可比拟；汉语用“不能与……相比”自然传达判断，脚注保留较字面的表达。
theological_decisions:
- issue: 火“从上面”而来的来源
  choice: 译作“从上面降下”，不明说“从天上”或“从上帝那里”
  alternative: 从天上降下／上帝降下的
  rationale: ἄνωθεν暗示来自上方，在语境中或含天上、神圣来源，但本句没有明确说“天”或“上帝”，故不把暗示强化为明说。
- issue: 火执行“所吩咐的”所体现的受命性质
  choice: 保留火按所吩咐行事的拟人化表达
  alternative: 完成预定的作用／照所安排的发生
  rationale: ποιεῖ τὸ συνταχθέν可含命令、指定或安排之意；保留拟人化张力，却不明确补出发令者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“焚尽”凝练呈现火的彻底毁灭作用；“这些偶像”按上下文补明指代。两个脚注标记均置于正文对应位置。
