  text: For they will certainly not raise up a king for a land, nor will they certainly give rain to men,
translation:
  language: zh_hans
  text: 因为它们绝不能为一地[a]立王，也绝不能给人降雨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一地”也可译作“一个地区”或“一个国家”。希腊文χώρα可指土地、地方、地区或国家。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλέα
  choice: 王
  rationale: 作ἀναστήσωσιν的宾语；“王”准确、简洁，也符合本段古代政治语境。
- source_word: χώρας
  choice: 为一地
  rationale: χώρα可指土地、地方、地区或国家；结合“立王”，“为一地”保留其政治地域含义，又不把它限定为现代民族国家。
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: 绝不能……立
  rationale: οὐ μή加虚拟式表达强烈否定；“绝不能”自然体现强调语气，“立王”则传达设立、拥立统治者之意。
- source_word: ὑετόν
  choice: 雨
  rationale: ὑετός通常指雨；汉语“降雨”在本句中最自然。
- source_word: ἀνθρώποις
  choice: 给人
  rationale: ἄνθρωποι在此泛指人类；现代汉语“人”自然包含所有人，无须添加性别含义。
- source_word: οὐ μὴ δῶσιν
  choice: 绝不能给……降
  rationale: 再次出现的οὐ μή构成强调性将来否定；以“绝不能”保留重复的强调，“给人降雨”自然表达δῶσιν ὑετόν ἀνθρώποις。
- source_word: γάρ
  choice: 因为
  rationale: γάρ在此承接上文并说明理由；“因为”清楚呈现解释关系。
theological_decisions:
- issue: 是否把偶像的无能具体解释为无权任命君王或无力赐下自然福分
  choice: 按原文并列保留“立王”和“降雨”两项具体无能
  alternative: 概括为“既不能治理国家，也不能赐福人类”
  rationale: 原文刻意并列政治权柄与降雨能力；不将其抽象化，可保留偶像与真正掌权、赐雨者之间的隐含神学张力。
- issue: ἀνθρώποις的泛指范围
  choice: 译作“给人”
  alternative: 译作“给世人”或“给人类”
  rationale: 此处泛指人类，并非专指男性；现代汉语“人”既忠实又自然，不额外强化原文没有明说的普世措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“绝不能”两次出现，以对应希腊文两处οὐ μή的强烈否定；“为一地立王”保留古代政治语境，同时避免误导为现代国家制度。
