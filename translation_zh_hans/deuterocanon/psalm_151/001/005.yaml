  text: My brothers were handsome and tall, but the Lord did not take pleasure in them[a].
translation:
  language: zh_hans
  text: 我的兄弟们英俊高大，主却不喜悦他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主却不满意他们”，或“主却不中意他们”。
    reason: 列出εὐδοκέω在本句中“喜悦、满意、中意”等合理表达，保留其认可或悦纳的语义幅度。
lexical_decisions:
- source_word: ἀδελφοί
  choice: 兄长们
  rationale: 希腊语为阳性复数，语境指大卫的男性手足；结合大卫是幼弟的背景，译作“兄长们”比泛称“兄弟们”更自然明确。
- source_word: καλοί
  choice: 英俊
  rationale: 该词与表示体格高大的 μεγάλοι 并列，在此最自然地描述外貌俊美，而非道德上的良善。
- source_word: μεγάλοι
  choice: 高大
  rationale: 字面义可为“大”或“伟大”，但与外貌描写并列时，指身材或体格出众；“高大”既自然，也避免只限定为身高。
- source_word: οὐκ εὐδόκησεν ἐν αὐτοῖς
  choice: 却不喜悦他们
  rationale: εὐδοκέω 表示喜悦、满意或中意；此译保留神的评价意味，却不把它强化为原文未明说的“不拣选”。“却”自然表达前后反差。
- source_word: Κύριος
  choice: 主
  rationale: Κύριος 在此指以色列的神，按现代中文圣经语体译作“主”。
theological_decisions:
- issue: 主对大卫兄长们的评价性质
  choice: 主不喜悦他们
  alternative: 主没有拣选他们；主不看中他们
  rationale: 原文 εὐδόκησεν 表达喜悦或认可，并未直接使用“拣选”的动词。译文不借相关叙事补足原因或结果，以保留原文的神学克制。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“英俊高大”形成流畅的并列外貌描写；“主却不喜悦他们”保留原文的反差和评价含义。脚注标记紧随其所说明的句末短语。
