  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: zh_hans
  text: 他亲自差遣了他的使者[a]，把我从我父亲的羊群中领出来，又用他膏立所用的油膏了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。希腊语ἄγγελος既可指受差遣的人，也可指天使。
    reason: 保留原词在“使者”与“天使”之间的词义歧义。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 独立主格代词带有强调意味；“他亲自”既传达强调，也符合现代汉语表达。
- source_word: ἐξαπέστειλεν
  choice: 差遣了
  rationale: 该复合动词有派出、差出的意味；“差遣”适合奉差执行使命的语境，也比普通的“派”更庄重。
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: 他的使者
  rationale: ἄγγελος既可指受差遣的人，也可指天使。大卫受膏的叙事背景支持“使者”，同时脚注保留“天使”这一真实的词义可能。
- source_word: ἦρέν με ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: 把我从我父亲的羊群中领出来
  rationale: αἴρω在此表示从原有处境中带出、选取；“领出来”自然呈现大卫从父亲羊群那里被带走的场景，“羊群”也避免误解为从羊本身内部出来。
- source_word: ἔχρισέν με
  choice: 膏了我
  rationale: “膏”是χρίω在受膏、立王或分别任职语境中的标准对应词，保留其礼仪和王权内涵。
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: 用他膏立之油
  rationale: ἐν在工具意义上译作“用”；“膏立之油”保留ἐλαίῳ与χρίσεως之间的属格联系，并以较为凝练庄重的汉语表达该油用于膏立。
theological_decisions:
- issue: 神所差遣的ἄγγελος是人间使者还是天使
  choice: 正文译作“使者”
  alternative: “天使”
  rationale: 词语本身容许两种理解，但大卫从羊群中被召出并受膏的叙事背景更自然地指向奉神差遣来膏立他的使者。正文不引入原文未明确规定的超自然身份，脚注则保留“天使”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他亲自”保留原文强调；“膏立之油”略带经文语体色彩，但含义清楚，并避免把属格关系解释得过死。
