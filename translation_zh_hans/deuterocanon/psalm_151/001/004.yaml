  source_fidelity: 正文准确保留了αὐτός的强调、ἐξαπέστειλεν的差派、ἄγγελος的未定身份、从父亲羊群中被取出，以及受膏的行动。将ἄγγελος译为“使者”并以脚注保留“天使”，符合希腊文词义范围，也避免把原文未明说的身份写死。唯一需调整的是“他膏立之油”：现代汉语中此结构容易被理解为“他所膏立的油”，从而误置“膏立”的对象。
