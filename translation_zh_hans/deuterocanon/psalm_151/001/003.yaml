  text: And who will report[a] to my Lord? The Lord himself[b], he himself hears.
translation:
  language: zh_hans
  text: 谁会向我的主禀报[a]呢？主自己亲自听见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传告”或“宣告”。原词可指把事情报告、传告或宣告出来。
    reason: lexical_alternative
  - marker: b
    text: 希腊文两次使用强调代词，直译近于：“主自己，他自己听见。”
    reason: source_emphasis
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 疑问代词引出反问；“谁”是现代汉语中最自然、准确的对应表达。
- source_word: ἀναγγελεῖ
  choice: 会……禀报
  rationale: 该动词为将来时，可指把事情报告、传告或宣告出来；因受事者是“我的主”，“禀报”自然体现向尊者报告，同时保留将来和反问语气。
- source_word: τῷ κυρίῳ μου
  choice: 向我的主
  rationale: 保留与后一句 Κύριος 的词语呼应；“主”既符合称号用法，也不排除“主人”的词义可能。
- source_word: αὐτός（两次）
  choice: 自己——是他亲自
  rationale: 原文两次使用强调代词。译文以“主自己——是他亲自”保留重复强调，又使现代汉语通顺。
- source_word: Κύριος
  choice: 主
  rationale: 原文此处无冠词，但作为称号或主语使用；汉语以“主”自然表达，无须增添冠词信息。
- source_word: εἰσακούει
  choice: 垂听
  rationale: 该词不只表示听到，也常带有留心听取、应允地听的意味；对“主”而言，“垂听”庄重自然，但不明确添加原文没有明说的行动或回应。
theological_decisions:
- issue: 两处 κύριος 的译法
  choice: 均译作“主”
  alternative: 第一处译作“主人”，第二处译作“主”
  rationale: 原文有意重复同一个词。统一译作“主”保留其呼应和称号意味，同时“我的主”在汉语中仍可涵盖主人或尊长的语义，不必强行判定所指。
- issue: εἰσακούει 是否明示回应或应允
  choice: 译作“垂听”，不增译“应允”
  alternative: 听见；听从；应允
  rationale: “垂听”可表达带关注的听取，但没有把结果解释为必然应允，从而保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体语言。“禀报”适合向“我的主”报告的语境；破折号呈现原文后半句的强调和停顿。所有脚注标记均紧随相关译词或分句。
