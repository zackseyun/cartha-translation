  text: But I drew his own sword and cut off his head[b][a], and I removed disgrace from the sons of Israel.
translation:
  language: zh_hans
  text: 但我拔出他自己的刀，砍下他的头[a]，除去了以色列众子所受的羞辱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他斩首。”
    reason: lexical_alternative
  - marker: b
    text: “以色列众子”是指以色列整体的传统集体称谓。
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: 拔出
  rationale: 该词在武器语境中指将刀拔出；“拔出”是现代汉语中自然、准确的表达。
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: 他身边的刀
  rationale: μάχαιρα指刀或短剑，παρ’ αὐτοῦ表示刀在他那里、属于他或在他身边。“他身边的刀”保留这一空间与归属上的含混，不把它过度限定为某一种理解。
- source_word: ἀπεκεφάλισα
  choice: 砍下他的头
  rationale: 该动词意为使人身首分离。“砍下他的头”清楚、具体，也符合叙事的力度。
- source_word: ἦρα
  choice: 除去
  rationale: αἴρω与“羞辱”连用时表示拿走、消除；“除去”既贴近原文，也符合庄重的现代汉语。
- source_word: ὄνειδος
  choice: 羞辱
  rationale: 该词可指责辱、耻辱或蒙羞的处境；“羞辱”体现以色列所承受的公开凌辱。
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: 从以色列众子身上
  rationale: 原文直译为“从以色列众子那里”。此译保留υἱῶν的男性复数集体称谓，并用“身上”使“除去羞辱”的汉语表达自然。
theological_decisions:
- issue: 带性别标记的集体称谓
  choice: 以色列众子
  alternative: 以色列人／以色列百姓
  rationale: 希腊文使用阳性复数υἱῶν（众子）。正文保留原文形式，不将其无声地中性化；脚注说明这是指以色列整体的传统集体称谓。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“但我”突出ἐγὼ δέ的转折与主语强调；“他身边的刀”有意保留παρ’ αὐτοῦ可能兼指所在之处或归属关系的含混。
