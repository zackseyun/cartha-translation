  text: I was small among my brothers, and younger in my father's house; I was shepherding my father's sheep.
translation:
  language: zh_hans
  text: 我在弟兄中本是幼小的，在父亲家中年纪较轻；我牧放父亲的羊群。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μικρός
  choice: 幼小的
  rationale: 保留“小、年幼或地位较低”的语义空间；结合弟兄与父家的家庭语境，用“幼小”比单纯“矮小”或“弱小”更自然，同时不把它强化为最高级“最小”。
- source_word: νεώτερος
  choice: 年纪较轻
  rationale: 原文是比较级，意为“较年轻”，不是明确的最高级“最年幼”；译文保留这一比较级形式及其未明说的比较对象。
- source_word: ἔποιμαινον
  choice: 牧放
  rationale: 未完成过去时描写当时持续或惯常从事的牧羊活动；“牧放”自然简洁，并保留动作性。
- source_word: τὰ πρόβατα
  choice: 羊群
  rationale: 希腊语复数指所牧养的羊；汉语用集合名词“羊群”更符合自然表达。
theological_decisions:
- issue: 大卫在父家中的排行是否明确为最小
  choice: 年纪较轻
  alternative: 最年幼
  rationale: νεώτερος为比较级，原句没有使用明确的最高级；因此不把传统叙事背景所暗示的排行直接写入本节，以保留原文措辞的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“弟兄”保留经文语域；分号对应原文两部分之间的停顿，并使三个并列陈述清楚流畅。
