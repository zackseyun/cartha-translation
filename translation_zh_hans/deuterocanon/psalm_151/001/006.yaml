lexical_decisions:
- source_word: ἐξῆλθον
  choice: 我出去
  rationale: 这是ἐξέρχομαι的第一人称单数不定过去时，表示叙述者出去；中文用“我出去”自然且不额外限定移动方向。
- source_word: εἰς συνάντησιν
  choice: 迎战
  rationale: 该短语本义是“出去相遇”。在大卫面对敌手的语境中，“迎战”自然表达有敌意的会面，但仍未增添战斗结果。
- source_word: τῷ ἀλλοφύλῳ
  choice: 那个外族人
  rationale: ἀλλόφυλος字面指属于另一族群的人；七十士译本常以此词称非利士人。正文保留较宽泛的希腊措辞，具体族属列入脚注。
- source_word: ἐπικατηράσατό με
  choice: 咒骂我
  rationale: 该动词表示对某人发出或祈求降下咒诅。“咒骂我”简洁自然，也符合此处敌手借神明发咒的语境。
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: 指着自己的偶像
  rationale: 介词ἐν在此可表达凭借、诉诸或关联的意味，即敌手借其偶像发咒。“指着”是自然汉语表达，同时用脚注保留“奉……的名”的可能解释。
theological_decisions:
- issue: 大卫与歌利亚语境中ἀλλόφυλος的译法
  choice: 那个外族人
  alternative: 那个非利士人
  rationale: 叙事背景指向非利士人歌利亚，但本节希腊文本使用较宽泛的ἀλλόφυλος，而非直接的族名。正文保留源文本的概括性，脚注说明其惯常所指。
- issue: ἐν τοῖς εἰδώλοις αὐτοῦ所表达的咒诅方式
  choice: 指着自己的偶像
  alternative: 奉自己偶像的名
  rationale: 该短语表明敌手诉诸其偶像来咒诅大卫。正文采用自然而相对克制的表达，脚注提供更明确但解释性稍强的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“外族人”保留希腊文本的概括性；“迎战”贴合上下文。“却”体现两个分句间自然的转折，但不改变事件内容。
