  language: zh_hans
  text: 我出去会见那个外族人[a]，他凭着自己的偶像咒诅我[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那个非利士人。”希腊文直译为“那个外族人”；七十士译本常用这个词指非利士人。
