  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: zh_hans
  text: 她越发显赫[a]，在她丈夫家中渐渐老去，享年一百零五岁；她使自己的婢女获得自由[b]。后来，她死在伯突利亚，众人把她安葬在她丈夫玛拿西的洞穴里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“她不断进展，变得极其伟大”，也可理解为“她越发兴盛”。原文没有说明这种增长特指财富、声望还是地位。
    reason: 保留προβαίνουσα μεγάλη σφόδρα的词义幅度及强烈语气。
  - marker: b
    text: “婢女”原指女性侍从；这里说犹滴使她获得自由，表明她原先处于受役和依附的身份。
    reason: 说明ἅβρα在本句“获得自由”的语境中的社会身份含义。
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: 越发显赫
  rationale: προβαίνω的分词表示向前发展、不断增长，μεγάλη σφόδρα则强烈表达“极其伟大／显赫”。“越发显赫”以自然中文传达持续增长与显著地位，同时用脚注保留“兴盛”等可能理解。
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: 年老，活到一百零五岁
  rationale: ἐγήρασεν意为“年老”，随后的一百零五年在语境中说明她达到的年龄。译作“活到一百零五岁”可避免误解为她在丈夫家中居住了一百零五年。
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: 在丈夫的家中
  rationale: 贴近原文的处所表达，也可包含家庭或家业环境的含义。
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: 释放了自己的婢女
  rationale: ἀφῆκεν与ἐλευθέραν合起来明确表示使其获得自由；ἅβρα指女性侍从或婢女。中文“释放”保留了解除受役身份的含义。
- source_word: εἰς Βαιτυλουὰ
  choice: 死在伯突利亚
  rationale: 后期希腊语中，εἰς与死亡动词连用可表达死亡发生的地点；“死在”符合现代中文。地名依中文圣经传统音译为“伯突利亚”。
- source_word: ἐν τῷ σπηλαίῳ
  choice: 在……墓穴里
  rationale: σπήλαιον本义为洞穴；在明确的安葬语境中，“墓穴”自然表达用作坟墓的洞穴，未另加超出语境的细节。
- source_word: Μανασσῆ
  choice: 玛拿西
  rationale: 采用现代简体中文圣经中常见的人名音译。
theological_decisions:
- issue: 犹滴晚年“变得极其伟大”的含义
  choice: 越发显赫
  alternative: 越发兴盛；变得极其伟大
  rationale: 原文没有明确限定为财富、声望、德行或政治地位，因此正文采用范围较宽的“显赫”，并在脚注中保留字面表达与另一种可能译法，不把含义固定为某一种神学或社会解释。
- issue: 婢女的社会身份与获释
  choice: 婢女；释放
  alternative: 女奴；使她获得自由
  rationale: ἅβρα不是通常表示奴隶的δοῦλος，但“使其自由”的措辞显示她处于受役、可被解放的身份。“婢女”符合叙事语体，“释放”则明确保留解放含义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“她越发显赫”保留原文持续增长的意味；“活到一百零五岁”消除中文中“在丈夫家住了一百零五年”的歧义。脚注[b]紧随“婢女”，纠正咨询层中脚注标记误置于地名后的问题。
