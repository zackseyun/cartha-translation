  yaml_path: translation/deuterocanon/judith/016/019.yaml
  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: zh_hans
  text: 友弟德把敖罗斐乃的一切用具，就是百姓交给她的，都献给了上帝。她又把自己为自己从他的卧房里取来的床帐[a]，作为奉献之物[b]献给上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床帐”也可译作“蚊帐”或“床幔”；希腊词κωνώπιον可指防蚊的床网或床上的帐幔。
    reason: lexical_alternative
  - marker: b
    text: “奉献之物”也可译作“还愿所献之物”或“献给上帝之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέθηκεν
  choice: 献上了
  rationale: 此动词在这里表示把物品献给神明、归作神圣用途。“献上”保留敬拜语境，又不擅自说明具体礼仪程序。
- source_word: σκεύη
  choice: 用具
  rationale: 该词可泛指器具、装备或物件；“用具”范围较宽，适合指敖罗斐乃所得的各样物品，而不局限于器皿。
- source_word: κωνώπιον
  choice: 床帐
  rationale: 该词可指防蚊的床网或床周围的帐幔。“床帐”在卧房语境中自然，也保留具体形制上的不确定性。
- source_word: κοιτῶνος
  choice: 卧房
  rationale: κοιτών指睡卧的房间；“卧房”庄重而易懂，并与床帐的语境相合。
- source_word: εἰς ἀνάθημα
  choice: 作为奉献之物
  rationale: ἀνάθημα指献给神、归神所有的物件。“奉献之物”比泛称“祭物”更准确，避免误导为牲祭或特定祭礼。
- source_word: τῷ θεῷ
  choice: 献给上帝
  rationale: 与格表明奉献的承受者；汉语用“献给上帝”清楚表达这一关系。
- source_word: ἑαυτῇ
  choice: 自己……取来的
  rationale: 反身代词与ἔλαβεν连用，直译可作“为自己取来的”；现代汉语以“自己取来的”表达友弟德本人取得该物，避免生硬，同时不强调永久占有。
theological_decisions:
- issue: 奉献用语是否暗示献祭
  choice: 译作“献上”及“作为奉献之物献给上帝”
  alternative: 译作“祭献”或“还愿祭物”
  rationale: 原文ἀνέθηκεν与ἀνάθημα都具有献给神、归神所有的宗教含义，但没有说明这是牲祭或哪一种圣殿礼仪，因此保留奉献含义而不加入特定祭祀类别。
- issue: 第一分句奉献对象是否明说为上帝
  choice: 第一分句只译“献上了”，第二分句按原文明说“献给上帝”
  alternative: 在第一分句补作“献给上帝”
  rationale: 第一分句的ἀνέθηκεν本身含有宗教奉献意味，但原文直到第二分句才出现τῷ θεῷ。此译法既让读者理解其行为，又尽量保存原句信息展开的次序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“友弟德”和“敖罗斐乃”使用中文次经传统中常见的音译；句法拆为两句，以清楚呈现两项奉献行为，同时保留原文先泛说“献上”、后明说“献给上帝”的结构。
