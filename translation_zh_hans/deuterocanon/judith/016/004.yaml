  yaml_path: translation/deuterocanon/judith/016/004.yaml
  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: zh_hans
  text: 他说要焚烧我的群山，用刀剑杀害我的年轻人，把我还在吃奶的孩子扔到地上，将我的婴孩当作战利品交出，并掳掠我的处女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为：“凌辱我的处女。”希腊语动词的基本意思是“掳掠”“剥夺”或“剥去（战利品）”；但在这里战争暴行的语境中，也可能暗含性侵害。
    reason: 保留σκυλεῦσαι较宽的词义范围，同时说明其在此语境中可能有的性暴力含义，而不将该含义确定为正文的唯一意思。
lexical_decisions:
- source_word: εἶπεν
  choice: 他说，他要
  rationale: 该不定式结构表达敌人所宣称的意图；用“他说，他要”既自然，也保留这是他的扬言，而非叙述者认可的事实。
- source_word: ἐμπρήσειν τὰ ὅρη μου
  choice: 焚烧我的群山
  rationale: ἐμπρήσειν 指放火焚烧，ὅρη 直指山岳；“焚烧我的群山”保留诗歌的鲜明意象。
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  choice: 用刀杀死我的青年
  rationale: ἀνελεῖν 在此意为杀死；ῥομφαία 是用于战争的刀剑。“用刀”简洁表达工具格，而“青年”不额外加入军人身份。
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  choice: 把我吃奶的孩子扔到地上
  rationale: τὰ θηλάζοντα 指仍在吃奶的孩子。θήσει 字面为“放置”，但在连续战争暴行的语境中，“扔到地上”自然传达敌意，同时不采用“摔死”等更强、原文未明说的表述。
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  choice: 把我的婴孩交作战利品
  rationale: νήπια 指年幼的孩子或婴孩；προνομή 指掠物、战利品。“交作战利品”保留把婴孩物化为战争掠物的残酷含义。
- source_word: τὰς παρθένους σκυλεῦσαι
  choice: 掳掠我的处女
  rationale: παρθένους 明指处女；σκυλεῦσαι 的基本含义是剥夺、掳掠或洗劫。“掳掠”保留其较宽泛的词义，不在正文中把可能含有的性暴力意味确定化。
theological_decisions:
- issue: 是否把对处女的暴行明确译为性侵害
  choice: 掳掠我的处女
  alternative: 凌辱我的处女
  rationale: σκυλεῦσαι 主要表示剥夺、洗劫或掳掠，并非专指强暴的动词；然而战争暴行的上下文可能包含性侵害意味。因此正文保留较宽泛的表达，脚注说明较强的可能译法，以保存原文的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“群山”“战利品”维持诗歌与战争语境；“吃奶的孩子”比古雅的“乳儿”更直白自然。各分句沿用重复的“我的”，呈现原文哀歌式的排比。
