  text: 波斯人因她的大胆而战栗，玛代人因她的胆量而震动。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文以两个意义相近的词形容友弟德的胆魄：τόλμα（“大胆、胆量”）和θράσος（“胆量、大胆”；有时可带“冒失、狂妄”的意味）。正文分别译出，以保留平行句式中的细微变化。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφριξαν
  choice: 战栗
  rationale: φρίσσω描写因恐惧而浑身发颤或毛发直竖的强烈反应；“战栗”简洁而保留其身体感。
- source_word: Πέρσαι
  choice: 波斯人
  rationale: 族群名称的复数名词，按现代汉语习惯译为“波斯人”。
- source_word: τὴν τόλμαν αὐτῆς
  choice: 她的勇毅
  rationale: τόλμα可指胆量、勇敢或大胆之举；“勇毅”既表达坚决无畏，也不额外赋予贬义。
- source_word: Μῆδοι
  choice: 玛代人
  rationale: 采用中文圣经传统中通行且易辨识的族名“玛代人”。
- source_word: τὸ θράσος αὐτῆς
  choice: 她的果敢
  rationale: θράσος与τόλμα意义相近，可表示大胆、无畏，也可能带有冒失或狂妄色彩；“果敢”在本节赞歌语境中自然，并与“勇毅”形成修辞对应。
- source_word: ἐρράχθησαν
  choice: 震骇
  rationale: 该被动形式描写受到猛烈冲击、被震动的状态；“震骇”既衔接上句的恐惧反应，又比单纯“害怕”更有力度。
