  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: zh_hans
  text: 许多人爱慕她；但从她丈夫玛拿西死去、归到他的族人那里[b]那天起，直到她一生的尽头，没有男人再与她有亲密关系[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“没有男人认识她”；这是指没有男人与她发生性关系的委婉说法。
    reason: 说明原文γινώσκω在此的性关系委婉义，并保留其字面表达。
  - marker: b
    text: 或译：“被加到他的族人中。”这是指死亡的惯用表达。
    reason: 提供较贴近希腊文字面的译法，同时不对该死亡惯用语所暗示的死后状态作额外界定。
lexical_decisions:
- source_word: ἐπεθύμησαν
  choice: 爱慕
  rationale: 该动词表示强烈的愿望；语境涉及许多男子对友弟德的婚姻或男女之情。“爱慕”自然且庄重，又不把含义收窄为粗俗的情欲或明确的求婚。
- source_word: οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: 没有男人亲近她
  rationale: 希腊文直译为“没有男人认识她”，在这里是男女关系的委婉语。汉语“认识她”通常不具备这一含义，因此以“亲近她”保留委婉、含蓄的语体，并用脚注说明。
- source_word: ἀνήρ
  choice: 男人
  rationale: 此处是否定句中的泛指单数，指任何男子，而不是她已经去世的丈夫，所以不译作“丈夫”。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῆς
  choice: 终其一生
  rationale: 这是自然、庄重的现代汉语，完整表达“她一生所有的日子”。结合后面的起点短语，语境实际指她守寡后的余生。
- source_word: ἀφʼ ἧς ἡμέρας
  choice: 自从……以后
  rationale: 清楚标明丈夫去世是所述状态的起点，也符合现代汉语句法。
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: 归到他的族人那里
  rationale: 保留希腊文关于死者归到自己族人那里的丧葬惯用语，不擅自改成“列祖”或明确解释死后状态。
- source_word: Μανασσῆς
  choice: 玛拿西
  rationale: 采用现代简体中文圣经传统中常见的人名译法。
theological_decisions:
- issue: οὐκ ἔγνω ἀνὴρ αὐτήν 的性关系委婉语
  choice: 正文译作“没有男人亲近她”，脚注交代直译和具体含义。
  alternative: “没有男人认识她”或“没有男人与她同房”
  rationale: 直译“认识”在现代汉语中不能可靠传达原文含义；“同房”则比希腊原文更直露。“亲近”兼顾可懂性和原文的委婉语体。
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ 的丧葬表达
  choice: 归到他的族人那里
  alternative: 被加到他的族人中；归到他的列祖那里
  rationale: 所选译法保留原文的群体性和丧葬意象，同时避免以“列祖”替换原文较宽泛的“族人”，也不对死后状态作额外说明。
translation_notes:
  register: 采用自然、庄重、普通现代读者易懂的简体中文。为使时间关系清楚，将希腊文末尾的起点从句前置；仍保留“许多人爱慕她”与“没有男人亲近她”的对比。脚注标记均紧随其所解释的短语。
