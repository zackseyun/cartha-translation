base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
translation:
  language: zh_hans
  text: 你们要用手鼓为我的上帝起歌[a]；用钹向主歌唱；要为他编配诗篇和颂赞[b]；要尊崇他，呼求他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起歌”也可译作“领起歌唱”或“开始歌唱”。原词是音乐用语，表示开始或领起一首歌。
    reason: lexical_alternative
  - marker: b
    text: “编配”也可译作“和谐地唱”或“调和、安排”。原词含有使诗篇和颂赞彼此协调、按乐律配合的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: 起歌
  rationale: 这是复数命令式，在音乐语境中指开始或领起歌唱。“起歌”简洁自然，也保留其领唱、开唱的意味。
- source_word: τῷ θεῷ μου
  choice: 向我的上帝
  rationale: 与歌唱行动相连的与格可表达歌唱所面向的对象；保留第一人称所属语“我的”。
- source_word: ἐν τυμπάνοις
  choice: 击鼓
  rationale: τύμπανον指手鼓一类的打击乐器；现代汉语用“击鼓”自然易懂，且不把具体构造限定得过窄。
- source_word: ᾄσατε
  choice: 歌唱
  rationale: 直接表达该命令式的基本意义，不额外加入原文未明说的宾语。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: κύριος在敬拜语境中译为“主”；与格译作歌唱所面向的对象。
- source_word: ἐν κυμβάλοις
  choice: 敲钹
  rationale: κύμβαλον指钹；以动宾结构表达乐器伴奏，在现代汉语中比“用钹”更自然。
- source_word: ἐναρμόσασθε
  choice: 配成
  rationale: 该动词有使之协调、按乐律编配或组合之意；“配成”保留为诗歌与颂赞配乐、编排成和谐形式的意象，而不将其缩减为单纯歌唱。
- source_word: ψαλμὸν καὶ αἶνον
  choice: 诗歌和颂赞
  rationale: ψαλμός在此为敬拜诗歌；αἶνος为赞美、颂赞。此译文保留两个并列名词，不将二者合并。
- source_word: ὑψοῦτε
  choice: 尊崇
  rationale: 字面有高举之意，在对上帝的敬拜语境中“尊崇”自然地表达尊他为高。
- source_word: ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ
  choice: 呼求他的名
  rationale: 保留圣经中“呼求……的名”的敬拜和祷告用语，也忠实反映反身形式与宾语结构。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在向上帝歌唱的敬拜语境中，“主”是准确、庄重且通行的称呼，不额外引入其他神学限定。
- issue: ὑψοῦτε的宾语是否补出
  choice: 补作“他”
  alternative: 仅译“要尊崇”或理解为“高举他的名”
  rationale: 希腊文此处宾语省略；上下文自然指上帝。汉语补出“他”使句意完整，但不把它与随后明确出现的“他的名”强行合并，从而保留句法张力。
translation_notes:
  register: 采用现代、庄重而可诵读的敬拜语言。以“击鼓”“敲钹”形成平行节奏；“起歌”“配成”保留原文较鲜明的音乐动作。所有复数命令式统一译作“你们要……”，首句明示复数主语，后续以连续“要”承接。
