  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
translation:
  language: zh_hans
  text: 那时，我那些卑微的人高声呼喊[a]；我那些软弱的人惧怕，又惊慌。他们提高了声音，被倾覆了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高声呼喊”或译“发出战斗的呐喊”；这里的希腊语动词可指响亮的呼声，在本段语境中也可能带有战斗意味。
    reason: lexical_alternative
  - marker: b
    text: 末句“被倾覆了”在这段希腊语中所指不明：它可能仍指犹滴所说那些“卑微的人”和“软弱的人”，也可能暗指他们的敌手被倾覆。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: 高声呼喊
  rationale: 该动词表示发出响亮的呼声；译作“高声呼喊”保留声音强度，同时不在正文中限定为军事性的呐喊。
- source_word: οἱ ταπεινοί μου
  choice: 我那些卑微的人
  rationale: ταπεινοί可指卑微、地位低下或受压的人；此译保留宽泛含义及第一人称所属关系，不将其窄化为内在谦卑的品德。
- source_word: οἱ ἀσθενοῦντές μου
  choice: 我那些软弱的人
  rationale: 这里的分词作名词用，指软弱无力的人；“软弱的人”自然清楚，也避免误译成专指患病者。
- source_word: ἐφοβήθησαν καὶ ἐπτοήθησαν
  choice: 惧怕，又惊慌起来
  rationale: 前一动词表达惧怕，后一动词进一步表达受惊、慌乱；译文保留情绪递进。
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: 他们扬起声音
  rationale: 按希腊语“举起他们的声音”的习语表达译出；“扬起声音”较庄重，也保留原文单数集合名词“声音”的形式。
- source_word: ἀνετράπησαν
  choice: 竟被倾覆了
  rationale: 该被动式可表示被翻倒、倾覆或推翻；“被倾覆”贴近字面，并避免把结果明确限定为军事溃败。“竟”体现前后叙述形成的突转，但不另加施事者。
theological_decisions:
- issue: 末尾被动动词ἀνετράπησαν的主语所指
  choice: 正文沿用未明说主语的“他们”，不补出施事者或敌方对象，并以脚注说明歧义。
  alternative: 明确译成卑微、软弱的人被倾覆；或补译为他们的敌人被倾覆。
  rationale: 现存希腊语句法紧缩，表面上可让末句延续前述“我那些卑微的人／软弱的人”，但语境也可能使人理解为其敌手被倾覆。鉴于所供底本被标为重大不匹配，且没有另一个希腊语读文可供采用，译文不擅自消解这一张力。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“卑微的人”“软弱的人”保留原文平行结构；末句略显突兀是原文所具有的真实歧义，故不以顺畅为由补入“敌人”。
