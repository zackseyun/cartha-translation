  text: The Lord Almighty nullified them by the hand of a woman[a].
translation:
  language: zh_hans
  text: 全能的主借着一个女人的手[a]挫败了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着一个女人。”希腊文“借……的手”这一惯用语表示施事者或所用的工具。
    reason: 说明希腊文惯用语，并保留施事与工具两种相关理解。
lexical_decisions:
- source_word: Κύριος
  choice: 主
  rationale: 作为指称上帝的神圣称号，译作“主”既符合汉语圣经传统，也准确保留原文称谓。
- source_word: Παντοκράτωρ
  choice: 全能的
  rationale: 表达上帝拥有统御一切的能力；与“主”组合为自然、庄重的现代汉语“全能的主”。
- source_word: ἠθέτησεν
  choice: 挫败了
  rationale: ἀθετέω可表示废弃、使失效或使落空；本节处于战胜仇敌的语境，“挫败了”自然地表达上帝使他们的力量和谋算归于无效，同时避免过度具体化。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留阳性复数宾格代词，按上下文指前述敌人。
- source_word: ἐν χειρὶ
  choice: 借……的手
  rationale: 保留希腊文以“手”表达施事或工具的圣经惯用语，在现代汉语中仍清楚可懂。
- source_word: θηλείας
  choice: 一个女人
  rationale: θηλεία在此作名词使用，意为女性；叙事语境中译作“一个女人”比“一个雌性”自然，并保留原文刻意突出的性别反差。
theological_decisions:
- issue: 神圣称号 Κύριος Παντοκράτωρ 的组合
  choice: 全能的主
  alternative: 主，全能者；统管万有的主
  rationale: “全能的主”完整保留两个称号的内容，又符合现代汉语语序，不把 Παντοκράτωρ 弱化或扩写。
- issue: ἐν χειρὶ θηλείας 所表达的施事或工具关系
  choice: 借一个女人的手
  alternative: 借着一个女人
  rationale: 正文保留“手”的原文意象，呈现上帝亲自行事却以女人为其工具的张力；脚注说明较顺畅的替代译法。
- issue: ἀθετέω 在胜利语境中的力度
  choice: 挫败了
  alternative: 使他们归于无效；废掉了他们
  rationale: “挫败”传达使敌方力量或谋算落空的语境含义，但不进一步限定具体的毁灭方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“全能的主”沿用读者熟悉的神圣称号；“借一个女人的手”保留原文意象及其刻意形成的反差，脚注则帮助普通读者理解其功能。
