base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: zh_hans
  text: 祸哉，那些起来敌对我同族人[a]的列国！全能的主必在审判之日向他们施行报应，将火和虫置入他们的肉体；他们必在痛苦中[b]哭泣，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我同族人”也可译作“我的族人”或“我的民族”；希腊语指友弟德自己所属的族群。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“在感觉（或知觉）中”；这里按肉体受刑罚的语境译作“在痛苦中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ἔθνεσιν
  choice: 祸哉……列国
  rationale: οὐαί带有先知式谴责与灾祸宣告的力度；ἔθνη在此指敌对友弟德所属群体的外邦列国，而非泛指个人。
- source_word: ἐπανισταμένοις
  choice: 起来敌对
  rationale: 保留“起来”的动态意象及其敌对含义，不额外限定为军事进攻或政治叛乱。
- source_word: τῷ γένει μου
  choice: 我同胞
  rationale: γένος可指血缘、族属或民族共同体；“我同胞”自然表达友弟德与该群体的归属关系，同时以脚注保留“族人／民族”的可能范围。
- source_word: Κύριος Παντοκράτωρ
  choice: 全能的主
  rationale: 采用现代汉语中庄重而通行的神圣称号，既表达κύριος，也保存παντοκράτωρ的权能含义。
- source_word: ἐκδικήσει αὐτούς
  choice: 必向他们施行报应
  rationale: 该动词兼有伸冤、执行公义与报复性惩治的语义；此处以神为主语、敌人为对象，“施行报应”保留司法和报偿色彩。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 在审判之日
  rationale: 准确保留司法性与末世性的表达，同时符合现代中文圣经语体。
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: 把火和虫放进他们的肉体
  rationale: 以目的／结果结构承接神的报应，并保留火、虫及进入肉体的强烈具体意象；不将σάρκες弱化为抽象的“身体受苦”。
- source_word: κλαύσονται
  choice: 必……哭泣
  rationale: 直译其哀哭意义，并以“必”体现将来时的确定语气。
- source_word: ἐν αἰσθήσει
  choice: 在知觉痛苦中
  rationale: αἴσθησις本义是感觉、知觉；语境明显涉及肉体刑罚。正文既保留“知觉”这一原文成分，也用“痛苦”传达语境效果，避免只译“痛苦”而遮蔽词义上的罕见表达。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 按该短语在此处的强烈持续意义译为自然庄重的现代汉语，不另行缩限为某个时代。
theological_decisions:
- issue: 刑罚的性质与持续时间
  choice: 他们必在知觉痛苦中哭泣，直到永远
  alternative: 他们必在感觉中哭泣，直到永远／他们必在痛苦中哭泣，直到永远
  rationale: 不削弱火、虫、哭泣和持续至永远的严厉刑罚意象，也不借“永刑”“永恒有意识受苦”等系统神学术语进一步界定经文本身。正文以“知觉痛苦”保存αἴσθησις的感知含义及其惩罚语境。
- issue: γένος所指的共同体
  choice: 我同胞
  alternative: 我的族人／我的民族／我的百姓
  rationale: 这里是友弟德对自己所属族群的称呼。“同胞”表达共同族属，却不以现代种族概念或特定教会术语限定其边界。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文。句首“祸哉”保存先知式宣告的力度；“把火和虫放进他们的肉体”刻意保留原文骇人的具体意象。脚注标记[a]、[b]均已在正文对应位置出现。
