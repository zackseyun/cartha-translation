  yaml_path: translation/deuterocanon/judith/016/025.yaml
  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: zh_hans
  text: 在友弟德的日子里，再没有人使以色列子民惊恐；她死后许多日子，也是如此。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: 使……惊恐的人
  rationale: 保留定冠词加分词所表达的泛指施事者，并以自然汉语传达ἐκφοβέω的强烈恐吓、使人惧怕之意。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列子民
  rationale: 这是希腊语中常见的民族整体称谓；“子民”比逐字的“儿子们”更符合现代汉语，同时保留群体身份。
- source_word: ἐν ταῖς ἡμέραις Ἰουδεὶθ
  choice: 在友弟德的日子里
  rationale: 保留原文的时间表达及其叙事色彩，不将其具体化为“有生之年”。
- source_word: μετὰ τὸ ἀποθανεῖν αὐτὴν ἡμέρας πολλάς
  choice: 她死后许多日子
  rationale: 依照不定式结构直译时间关系，并保留“许多日子”而不扩大为未明说的年代。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代中文圣经传统中通行的音译，保留结语的礼仪性和确认意味。
theological_decisions:
- issue: 和平延续时间的范围
  choice: “她死后许多日子，也是如此”
  alternative: “直到她死后很久，都无人惊吓以色列人”
  rationale: 原文只说在她死后“许多日子”仍无人使以色列人惊恐，并未说明这种状态永久持续；译文不作超出原文的推断。
- issue: ἀμήν是否保留
  choice: 保留“阿们”
  alternative: 省略或译作“诚然”
  rationale: 所据Swete文本明确含有ἀμήν，应在正文中保留，不因某些文本传统可能缺省而删去。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在友弟德的日子里”保留经文叙事语感；后半句用“也是如此”承接“再没有人使……惊恐”，避免汉语中重复冗长，同时不改变时间范围。
