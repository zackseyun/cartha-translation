  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: zh_hans
  text: 过了这些日子，众人各自前往自己承受的产业[a]。友弟德前往伯突利亚，居住在自己的地产上[b]。她在有生之年，在全境都享有盛名[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承受的产业”也可译作“所分得的土地”或“继承的产业”；希腊文可指继承或分配所得的份地、产业。
    reason: lexical_alternative
  - marker: b
    text: “地产”也可译作“自己的产业”或“自己的产业地”；希腊文指她拥有的财产、产业或地产。
    reason: lexical_alternative
  - marker: c
    text: “享有盛名”也可译作“备受尊崇”；希腊文强调她在人们中间所得的尊荣和声望。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: 过了这些日子
  rationale: 按字面保留“日子”的时间过渡含义，同时用现代汉语自然表达叙事承接。
- source_word: ἀνέζευξεν ἕκαστος
  choice: 众人各自启程
  rationale: ἀναζεύγνυμι可指拔营、动身；“各自启程”既保留出发的动作，也体现ἕκαστος的逐一、分配性含义。
- source_word: εἰς τὴν κληρονομίαν αὐτοῦ
  choice: 返回自己承受的产业
  rationale: κληρονομία可指继承所得或分配所得的份地、产业；此译保留圣经土地承受的语感，又不限定取得方式。
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: 回到伯突利亚
  rationale: 上下文表明友弟德离开集会之处返回本城；“回到”自然传达ἀπέρχομαι的离去及目的地。Βαιτυλουὰ音译为“伯突利亚”。
- source_word: κατέμεινεν ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: 住在自己的家业中
  rationale: καταμένω表示继续居住；ὕπαρξις在此指她拥有的财产或地产。“家业”兼顾产业与住所语境。
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: 她在世时
  rationale: 该短语指属于她的时期，在语境中自然理解为她一生之内；译文避免生硬的“在她的时间”。
- source_word: ἔνδοξος
  choice: 享有盛名
  rationale: ἔνδοξος在此侧重受到公众尊崇、享有声望，而非神学意义上的“荣耀”。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 在全境
  rationale: γῆ在这里指当地全境或全国，并非全世界；“全境”简洁保留地域范围。
theological_decisions:
- issue: 叙事土地语境中κληρονομία的译法
  choice: 承受的产业
  alternative: 所分得的土地；继承的产业
  rationale: 原词兼有继承产业和获分份地之义。“承受的产业”保留圣经中的土地承受意涵，不把取得方式缩窄为家族继承或一次分配。
- issue: ἔνδοξος用于描述友弟德的身份声望
  choice: 享有盛名
  alternative: 备受尊崇；大有荣耀
  rationale: 这里说的是她在全境受到敬重、具有声望。“享有盛名”不将人的公众荣誉误读为专属神学意义上的荣耀，同时脚注保留“受尊崇”的语义。
- issue: κατὰ τὸν καιρὸν αὐτῆς的时间范围
  choice: 她在世时
  alternative: 在她的时代
  rationale: 语境最自然地指友弟德一生的时期；正文采用通顺表达，且不进一步推断声望形成的具体时间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众人各自启程”保留拔营离去的动态；“承受的产业”与“家业”分别处理两个相近但不相同的希腊词，避免中文机械重复。所有脚注标记均紧随对应词语。
