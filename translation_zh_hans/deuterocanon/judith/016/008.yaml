  text: And she bound up her hair with a headband[a], and took a linen garment to deceive him.
translation:
  language: zh_hans
  text: 她用头带束起头发，又拿了一件细麻衣服来欺骗他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδήσατο
  choice: 束起
  rationale: 该中间态动词在这里表示把头发系住、整理固定；“束起”既贴近原意，也符合现代汉语表达。
- source_word: τὰς τρίχας αὐτῆς
  choice: 她的头发
  rationale: 希腊文用复数“毛发”，现代汉语自然地用集合名词“头发”。
- source_word: ἐν μίτρᾳ
  choice: 用头带
  rationale: μίτρα可指缠头或束发之物；结合束发的语境，“头带”清楚自然，又避免具体化为头巾或礼冠。
- source_word: ἔλαβεν
  choice: 拿了
  rationale: 保留λαμβάνω的基本义“拿、取”；上下文可能暗示取来穿上，但原文没有明确使用“穿上”。
- source_word: στολὴν λινῆν
  choice: 一件细麻衣服
  rationale: στολή泛指衣服或袍服，λινῆν指亚麻材质；“细麻衣服”采用常见圣经用语，同时不把款式限定为袍子。
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: 来欺骗他
  rationale: εἰς加抽象名词可表达目的或结果；结合语境，译作目的结构最自然，αὐτοῦ则明确为受骗对象“他”。
theological_decisions:
- issue: 对友弟德行为的道德定性
  choice: 直译其行动旨在“欺骗他”，不加缓和或褒贬
  alternative: 使他受骗／作为给他的骗局
  rationale: ἀπάτη明确表达欺骗；译文保留叙事对策略性欺骗的直陈，不额外加入赞同或谴责。
- issue: εἰς ἀπάτην αὐτοῦ的语法歧义
  choice: 按目的理解为“来欺骗他”
  alternative: 较形式地译为“使他受骗”或“作为给他的骗局”
  rationale: 目的解读最符合上下文和现代汉语，但该短语在形式上也可偏向结果或名词性表达；正文无需用不自然措辞保留这种轻微歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又”对应并列的καί；保留“拿了”而不扩译为“穿上”，避免超出原文。
