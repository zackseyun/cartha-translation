  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: zh_hans
  text: 愿你所创造的一切都服侍你；因为你一发言，它们便有了；你发出你的灵[a]，便把它们建造起来；没有谁能抗拒你的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“气息”或“风”；这里的希腊词在创造语境中可以包含这几层意思。
    reason: 保留πνεῦμα在创造语境中的真实词义歧义。
lexical_decisions:
- source_word: δουλευσάτω
  choice: 愿……都服侍你
  rationale: 该词可指服役、臣服。这里以整个受造界为主语，“服侍”自然保留了对上帝普遍顺服的含义，而不引入“奴役”的过强色彩；第三人称命令式以“愿”表达。
- source_word: πᾶσα ἡ κτίσις σου
  choice: 你所创造的一切
  rationale: κτίσις在此最自然地统指全部受造之物；该译法符合现代汉语，也便于承接后文复数的“它们”。
- source_word: εἶπας, καὶ ἐγενήθησαν
  choice: 你一发言，它们便有了
  rationale: ἐγενήθησαν表示进入存在、成为；“便有了”简洁呈现创造结果，又不把原文明确化为被动式“被造”。“一……便……”自然传达两个不定过去时动作间紧密的结果关系。
- source_word: ἀπέστειλας τὸ πνεῦμά σου
  choice: 你发出你的灵
  rationale: ἀποστέλλω保留发出、差出的动态；πνεῦμα在创造语境中可指灵、气息或风，正文采用最突出的“灵”，并以脚注保留语义重叠。
- source_word: ᾠκοδόμησεν
  choice: 他就把它们建造起来
  rationale: οἰκοδομέω的基本意象是建造。此处用于创造，可表示构造、建立；译作“建造起来”保留原文鲜明而略带张力的建筑隐喻，不将其平化为单纯的“造”或“形成”。
- source_word: ἀντιστήσεται τῇ φωνῇ σου
  choice: 能抗拒你的声音
  rationale: ἀνθίστημι表示抵挡、抗拒；φωνή直译为“声音”。保留“声音”可维持本节从上帝发言到受造界无法抗拒其声音的诗歌呼应，而不直接解释成“命令”。
theological_decisions:
- issue: 创造语境中πνεῦμα的含义及其指代方式
  choice: 正文译“你的灵”，并用“他”回指
  alternative: “你的气息”或“你的风”；也可用“它”回指
  rationale: 希腊词πνεῦμα可涵盖灵、气息和风，创造语境容许这些意象彼此重叠。正文采用“灵”，但脚注保存其他可能，避免消除原文张力。现代汉语中指上帝的灵通常用“他”，这不否认原词的多义性。
- issue: ᾠκοδόμησεν的创造意象
  choice: 建造起来
  alternative: 形成了／建立了
  rationale: 保留“建造”的隐喻更贴近希腊动词本身，也不额外规定创造的具体方式；“形成了”较顺畅，却削弱了原文的建筑意象。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语。“愿……都……”呈现诗歌祈愿式命令；分号保持原句层层推进的赞颂节奏。“建造起来”有意保留原文不寻常的创造隐喻。
