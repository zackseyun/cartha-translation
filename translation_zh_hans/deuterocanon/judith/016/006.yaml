base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: zh_hans
  text: 因为他们的强者并非倒在青年人手下；泰坦之子没有击打他，高大的巨人也没有袭击他；而是米拉利的女儿友弟德以她面容之美使他瘫软无力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他瘫痪”。希腊语动词可指使人瘫痪、失去力量或丧失行动能力，既可按字面理解，也可作比喻理解。
    reason: 词义存在真实范围，正文采用兼顾具体形象与语境效果的译法，脚注保留较字面的可能译法。
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: 他们的强者
  rationale: δυνατός在这里作名词使用，指他们中那位有力量的人；“强者”保留诗歌性的崇高语气，也不擅自限定为某种军职。
- source_word: νεανίσκων
  choice: 青年人
  rationale: 该词指年轻男子；“青年人”在现代汉语中自然清楚，同时保留其与神话般强敌之间的对比。
- source_word: υἱοὶ Τιτάνων
  choice: 泰坦之子
  rationale: 直译神话性表达，保留原文借超凡强者烘托反差的修辞，不弱化为泛称的“勇士”。
- source_word: ἐπάταξαν
  choice: 击打
  rationale: 该动词基本义为击打、重击；不额外加入“击倒”所暗示的结果。
- source_word: ὑψηλοὶ γίγαντες
  choice: 高大的巨人
  rationale: ὑψηλοί明确带有高、大的空间或体貌意象；译文保留这一具体形象。
- source_word: ἐπέθεντο αὐτῷ
  choice: 袭击他
  rationale: 该表达表示扑向、攻击某人；“袭击”简洁地传达其敌对行动与突然扑上的意味。
- source_word: παρέλυσεν
  choice: 使他瘫软无力
  rationale: 该动词可表示使松弛、瘫痪或失去能力；此处既保留“瘫软”的形象，又以“无力”表明语境中的制伏效果，而不武断地解释为医学意义上的瘫痪。
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: 以自己的容貌之美
  rationale: 保留ἐν的凭借意味和πρόσωπον所指的具体容貌意象，避免笼统简化为“凭她的美貌”。
- source_word: Ἰουδεὶθ θυγάτηρ Μεραρεί
  choice: 米拉利的女儿友弟德
  rationale: 按汉语自然语序呈现明确的父女谱系称谓，并采用通行的人名音译。
theological_decisions:
- issue: υἱοὶ Τιτάνων与γίγαντες的神话性语言
  choice: 直接译作“泰坦之子”和“高大的巨人”
  alternative: 概括为“大能者”“英雄”或“勇士”
  rationale: 原文有意使用神话或超人尺度的形象，强化友弟德并非凭常规武力取胜的反差；泛化处理会削弱这一修辞张力。
- issue: παρέλυσεν所表达的制伏方式
  choice: 译作“使他瘫软无力”
  alternative: 译作“使他瘫痪”或“毁灭了他”
  rationale: 上下文表明友弟德以容貌使对方失去抵抗能力，但原文既可具象也可比喻；所选译法保留这种张力，不断定为医学瘫痪，也不提前加入最终毁灭的结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌性汉语。以分号组织三个否定分句与末尾转折，保留原文排比和高潮；神话性称谓不作去神话化处理。
