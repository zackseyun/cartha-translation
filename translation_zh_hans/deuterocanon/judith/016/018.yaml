  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: zh_hans
  text: 他们到了耶路撒冷，就敬拜上帝；民众经过洁净后，他们便献上自己的燔祭、自愿祭和礼物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: 他们来到……后
  rationale: ὡς在这里引出时间关系，δέ承接叙事；汉语用“来到……后”自然表达事件推进，无须生硬译出δέ。
- source_word: προσεκύνησαν τῷ θεῷ
  choice: 敬拜上帝
  rationale: προσκυνέω本可指俯伏、下拜，但以神为对象且处于耶路撒冷礼仪语境中，重点是敬拜；“敬拜上帝”准确而自然。
- source_word: ἡνίκα ἐκαθαρίσθη ὁ λαός
  choice: 民众洁净了以后
  rationale: 被动式ἐκαθαρίσθη表示民众经过洁净；紧接献祭，语境倾向礼仪性的洁净。“洁净了以后”既体现先后关系，也不补入原文未明说的施事者。
- source_word: ἀνήνεγκαν
  choice: 献上
  rationale: ἀναφέρω在祭祀语境中有献祭之义；“献上”兼顾礼仪含义与现代汉语表达。
- source_word: τὰ ὁλοκαυτώματα αὐτῶν
  choice: 自己的燔祭
  rationale: ὁλοκαύτωμα指全然焚烧的祭物，汉语圣经语汇通常作“燔祭”；αὐτῶν译作“自己的”。
- source_word: τὰ ἑκούσια αὐτῶν
  choice: 自愿祭
  rationale: ἑκούσια在献祭清单中指自愿献上的祭；“自愿祭”比泛称“自愿奉献”更能保留其与祭祀的联系。
- source_word: τὰ δόματα
  choice: 礼物
  rationale: δόματα是较宽泛的“赠礼、礼物”，与前面的燔祭和自愿祭有别；译作“礼物”保留原文三项并列的区分。
theological_decisions:
- issue: ἐκαθαρίσθη ὁ λαός所指的洁净性质
  choice: 在献祭前经过洁净，语境倾向礼仪性洁净，但正文不明加“礼仪上”
  alternative: 泛指道德或属灵上的洁净
  rationale: 耶路撒冷敬拜和随后献祭的直接语境强烈支持礼仪性洁净；然而原文本身仅说“洁净”，正文保留其措辞范围，避免把解释写进经文。
- issue: προσκυνέω是否应显明身体姿态
  choice: 译作“敬拜”
  alternative: 译作“俯伏敬拜”或“向……下拜”
  rationale: 该词可能包含俯伏动作，但本句强调以上帝为对象的敬拜行为；不额外加入原文未明确强调的身体姿态。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“燔祭”作为既有祭祀术语予以保留；“自愿祭”清楚区分于“礼物”。句式按汉语时间顺序调整，同时保留两阶段行动：到达后敬拜，洁净后献祭。
