  yaml_path: translation/deuterocanon/judith/016/003.yaml
  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: zh_hans
  text: 亚述从北方的群山中而来；他带着数以万计的军队而来；他们众多的兵力堵塞了季节性河道[a]，他们的马匹[b]遮盖了丘陵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冬季急流”或“山洪沟”；希腊词指雨季有急流、旱季可能干涸的水道。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们的马”；希腊文使用单数形式，可能是集合用法，统指军队的马匹。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσσούρ
  choice: 亚述
  rationale: 此名在这里指亚述这一国家或帝国势力。译作“亚述”符合现代中文圣经地名惯例，也保留诗歌中将其人格化的表达。
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: 从北方的群山而来
  rationale: 兼顾两个介词所表达的来源和方向；中文以“北方的群山”自然传达从北方山区出来的意思。
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: 带着千千万万的军队
  rationale: μυριάσι为复数，描绘数以万计、极其庞大的数量；“千千万万”保留诗歌的夸张气势，δυνάμεων则按军事语境译为“军队”。
- source_word: χειμάρρους
  choice: 山洪河道
  rationale: 该词指季节性急流及其河道，并非普通常流河川；“山洪河道”在正文中较易理解，脚注补充其季节性含义。
- source_word: ἐνέφραξεν
  choice: 堵塞了
  rationale: 保留原动词“封住、阻塞”的具体图像，描写军队人数之多，连河道也被堵住。
- source_word: ἡ ἵππος αὐτῶν
  choice: 他们的战马
  rationale: ἵππος虽为单数形式，此处可作集合名词，指整支军队的马匹；译为复数“战马”既自然，也比“骑兵”更直接贴近原词。
- source_word: βουνούς
  choice: 丘陵
  rationale: βουνοί通常指丘陵，区别于本节前半的ὄρη“群山”，从而保留原文地貌用词的层次。
theological_decisions:
- issue: 人格化的单数亚述与其军队的复数指称并存
  choice: 先以“他”指人格化的亚述，随后以“他们”指其军队
  alternative: 全节统一使用单数或复数代词，或将主语改为“亚述人”
  rationale: 原文一方面以阳性单数形式人格化亚述，另一方面又转向其众多军队和战马。保留这种数的转换，可维持诗歌修辞及帝国与其军旅之间的张力，避免擅自抹平。
translation_notes:
  register: 采用现代、庄重而有诗歌气势的普通话。“千千万万”“人多势众”“遮遍”使画面鲜明，同时不把数量机械化；保留“他／他们”的转换，以反映原文先人格化帝国、再指向其军队的结构。
