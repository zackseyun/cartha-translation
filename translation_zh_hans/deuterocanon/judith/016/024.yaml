  yaml_path: translation/deuterocanon/judith/016/024.yaml
  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
translation:
  language: zh_hans
  text: 以色列家为她哀悼了七天。她去世以前，把自己的财产分给了她丈夫玛拿西所有的至亲，以及她自己家族的至亲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文中表示“至亲”的短语结构较为紧凑，也可理解为：“分给了她丈夫玛拿西一方所有最亲近的亲属，以及她自己家族中最亲近的亲属。”
    reason: 保留原文在亲属分组和修饰关系上的句法歧义。
lexical_decisions:
- source_word: ἐπένθησεν
  choice: 为她哀悼
  rationale: 该动词在此指为死者举哀；“哀悼”符合丧葬语境，也自然庄重。
- source_word: οἶκος Ἰσραήλ
  choice: 以色列全家
  rationale: 保留“家”的集体性圣经表达，并用“全家”明确这里指以色列整体，而非房屋。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 这是哀悼持续的时间；汉语与动词搭配时自然表达为“哀悼了七天”。
- source_word: διεῖλεν
  choice: 分给了
  rationale: 该动词可指分开或分配；在遗产处置语境中，“分给”比机械的“分割”更自然，同时保留分配含义。
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: 自己的财产
  rationale: 该短语泛指她所有的财物或产业；“财产”简洁清楚，适合继承语境。
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: 她去世以前
  rationale: πρό加带冠词不定式表示先于某事发生；此译法准确而自然。
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: 所有的至亲
  rationale: ἔγγιστα在此实词化，指亲缘关系最近的人；“至亲”能体现继承语境中的近亲，但希腊文结构较压缩，具体分组仍有一定歧义。
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: 她丈夫玛拿西
  rationale: 属格同位结构表明玛拿西是她的丈夫；按现代汉语语序表达。
- source_word: τοῦ γένους αὐτῆς
  choice: 她自己家族
  rationale: γένος可指家族、亲族或血统；“家族”既通俗，也能与丈夫一方的亲属形成对照。
