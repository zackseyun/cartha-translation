base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: zh_hans
  text: 因为群山必从根基处连同众水震动，磐石必在你面前[a]如蜡熔化；然而，敬畏你的人，你仍恩待他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“从你的面前”；也可理解为“因你的临在”。
    reason: 保留 ἀπὸ προσώπου σου 的字面方向表达、拟人化意象及惯用语义之间的张力。
lexical_decisions:
- source_word: ὄρη
  choice: 群山
  rationale: 指具体的山岳；“群山”自然保留复数形式和宏大的宇宙性意象。
- source_word: ἐκ θεμελίων
  choice: 从根基
  rationale: 表达震动自最底部发生；“根基”保留 θεμέλιον 的基础、根基之义。
- source_word: σὺν ὕδασιν
  choice: 连同众水
  rationale: σύν 表示伴随；“连同”明确呈现山与水一同震动，“众水”符合诗歌中复数 ὕδασιν 的元素性意象。
- source_word: σαλευθήσεται
  choice: 必……震动
  rationale: 保留将来被动所表达的受震撼、被摇动之意；汉语不必机械标出被动。
- source_word: πέτραι
  choice: 磐石
  rationale: 与群山平行，所指是巨大的岩体；“磐石”比“石头”更能呈现规模和诗歌语体。
- source_word: ἀπὸ προσώπου σου
  choice: 在你面前
  rationale: 保留“面”这一具体的拟人化表达，同时以现代汉语自然的介词结构呈现；ἀπό 的字面方向感及“因你的临在”这一可能语感收入脚注。
- source_word: ὡς κηρός
  choice: 如蜡
  rationale: 简洁保留原文的明喻及庄重诗歌语感。
- source_word: τακήσονται
  choice: 必……熔化
  rationale: 准确表达固体受热消融的意象；“熔化”与磐石和蜡均搭配自然。
- source_word: ἔτι δὲ
  choice: 然而……仍
  rationale: 呈现由宇宙震撼转向上帝恩待敬畏者的鲜明对照，并保留 ἔτι 的持续意味。
- source_word: τοῖς φοβουμένοις σε
  choice: 敬畏你的人
  rationale: “敬畏”是自然且成熟的现代汉语圣经表达，同时涵盖畏惧、敬重和虔诚，不将原文窄化为一般尊敬。
- source_word: εὐιλατεύεις αὐτοῖς
  choice: 你……恩待他们
  rationale: 稀有动词表达有利、慈恩的态度；“恩待”通俗庄重，且以“他们”明确呈现 αὐτοῖς。
theological_decisions:
- issue: τοῖς φοβουμένοις σε 所表达的对上帝之“惧怕”
  choice: 敬畏你的人
  alternative: 尊崇你的人；怕你的人
  rationale: “敬畏”既不把 φόβος 淡化为单纯尊敬，也不把它收窄为惊恐，保留圣经语境中畏惧、敬重与虔诚并存的张力。
- issue: ἀπὸ προσώπου σου 的拟人化神学语言
  choice: 在你面前
  alternative: 因你的临在；从你面前
  rationale: 正文保留 πρόσωπον“面”的具体形象，不把神的“面”直接解释为抽象的“临在”；脚注说明较直译和较惯用的理解。
- issue: εὐιλατεύεις 的恩慈或赎罪性语义
  choice: 恩待
  alternative: 怜悯；施行赎罪
  rationale: 本句语境强调上帝对敬畏者的有利、恩慈态度。“恩待”避免把这个稀有动词过早限定为某种赎罪机制，同时保留其施恩倾向。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“群山—众水—磐石—蜡”保持原文意象的层层推进；分号突出宇宙震撼与上帝恩待敬畏者之间的转折。脚注标记置于其实际说明的“在你面前”之后，避免误挂在“众水”之后。
