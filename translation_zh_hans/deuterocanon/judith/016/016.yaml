base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: zh_hans
  text: 因为，一切献作馨香之气的祭物都是微小的，献给你作全燔祭的一切脂油也极其微小；但敬畏主的人始终[a]是伟大的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “始终”也可译作“永远”；这个希腊语短语可表示持续不断，也可表示恒久长存。
    reason: 保留 διὰ παντός 在持续性与恒久性之间的词义幅度。
lexical_decisions:
- source_word: μικρὸν
  choice: 微小
  rationale: 作表语，评估祭物相对于敬畏主之人的分量；“微小”保留大小对比，又不将祭祀贬为毫无价值。
- source_word: θυσία
  choice: 祭物
  rationale: 此处指献上的祭牲或祭品；“祭物”与后文“脂油”“全燔祭”的礼仪语境自然衔接。
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: 献为馨香之气
  rationale: 保留献祭蒙悦纳的嗅觉意象，并以现代汉语可理解的礼仪表达呈现目的或结果关系。
- source_word: ἐλάχιστον
  choice: 极其微少
  rationale: 保留最高级对前句“微小”的加强作用。
- source_word: στέαρ
  choice: 脂油
  rationale: 指献祭中焚烧的脂肪部分；“脂油”既具体，也符合礼仪语境。
- source_word: ὁλοκαύτωμά
  choice: 全燔祭
  rationale: 该词指全部经火焚烧的祭物；“全燔祭”比一般的“燔祭”更明确地保留“全部焚烧”的含义。
- source_word: σοι
  choice: 献给你作
  rationale: 将与格所表达的奉献对象明确译出，并保留对上帝的直接称呼。
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: 但敬畏主的人
  rationale: 以泛指单数表达普遍真理，并保留 δὲ 所标示的鲜明转折。
- source_word: μέγας
  choice: 是尊大的
  rationale: 与前面的“微小、微少”构成修辞对照；“尊大”在汉语中适合描述人在上帝面前的崇高分量，又不擅自解释为社会地位。
- source_word: διὰ παντός
  choice: 永远
  rationale: 在格言式语境中表达恒久不变的状态；原短语也可指持续不断或任何时候，故以脚注保留歧义。
theological_decisions:
- issue: 祭物的价值与敬畏主之人的价值之间的关系
  choice: 直译为祭物微小，而敬畏主的人尊大，保留经文的相对价值对照。
  alternative: 可理解为祭物若缺少敬畏便不足，而不是祭物本身微小。
  rationale: 希腊文直接以 μικρόν／ἐλάχιστον 与 μέγας 构成对比；译文不把这一对比扩展为反对献祭的教义判断。
- issue: κύριον 的译法
  choice: 主
  alternative: 主人
  rationale: 此处是对上帝的敬称；“主”是现代汉语圣经语体中准确、通行且庄重的表达。
- issue: διὰ παντός 的时态范围
  choice: 正文译作“永远”，脚注注明“始终”的可能。
  alternative: 始终；随时；在任何时候
  rationale: 该短语既可强调连续不断，也可强调恒久长存；正文与脚注共同保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“馨香之气”“全燔祭”保留献祭语境的专门意象；句式以“微小／微少”对“尊大”，呈现原文的平行与反差。脚注标记置于其实际所解释的“永远”之后。
