base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: zh_hans
  text: 我要向我的神唱一首新赞歌[a]。主啊，你伟大而荣耀，在能力上令人惊叹，无可超越[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新歌”。希腊文ὕμνον καινόν更具体地指一首新的颂赞之歌。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不可战胜”或“无与伦比”。希腊文ἀνυπέρβλητος指不能被胜过或超越。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: 我要……唱
  rationale: 这是ὑμνέω的将来时，表示以歌声颂赞；汉语用“唱”自然流畅，并由宾语“赞歌”明确其颂赞含义。
- source_word: τῷ θεῷ μου
  choice: 向我的神
  rationale: 与ὑμνήσω连用的与格指出歌唱颂赞的对象；“向我的神”清楚保留这一关系。
- source_word: ὕμνον καινόν
  choice: 一首新赞歌
  rationale: ὕμνος特指颂赞之歌；“赞歌”比笼统的“歌”更贴近原词，同时符合现代汉语表达。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格，是对神的直接称呼；“主啊”自然表达汉语中的呼语语气。
- source_word: μέγας
  choice: 伟大
  rationale: 直接表达神的广大与尊荣，在颂赞语境中自然庄重。
- source_word: ἔνδοξος
  choice: 荣耀
  rationale: 在颂赞神的语境中，ἔνδοξος表示满有荣光、尊荣；“荣耀”保留其神学与礼赞色彩。
- source_word: θαυμαστὸς ἐν ἰσχύι
  choice: 在能力上令人惊叹
  rationale: 保留ἐν ἰσχύι所限定的范围，并以“令人惊叹”表达θαυμαστός所指激发惊奇、赞叹的性质。
- source_word: ἀνυπέρβλητος
  choice: 无可超越
  rationale: 该词表示不能被胜过或超越；“无可超越”保留其宽泛意义，不将其限缩为军事上的“不可战胜”。
theological_decisions:
- issue: 对神的直接称呼κύριος
  choice: 主啊
  alternative: 主
  rationale: 原文为呼格Κύριε。“主啊”既保留“主”的称谓，也在现代汉语中清楚呈现直接呼告，而“啊”是呼语表达，不额外增加教义内容。
- issue: ἀνυπέρβλητος的含义范围
  choice: 无可超越
  alternative: 不可战胜
  rationale: 原词既可含“不被超过”，也可在能力语境中带有“不被战胜”的意味；正文采用范围较广的“无可超越”，脚注保留另一可能，避免把经文只解释为军事能力。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“新赞歌”保留原文ὕμνος的特定含义；后半句维持一连串对神的直接赞颂，不补入原文没有的因果或解释关系。
