  yaml_path: translation/deuterocanon/judith/016/020.yaml
  text: And the people were rejoicing in Jerusalem before the sanctuary for three months[a], and Judith remained with them.
translation:
  language: zh_hans
  text: 众百姓在耶路撒冷圣所前欢庆了三个月[a]，友弟德也和他们一同留在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在圣物前”，也可理解为“在圣者面前”；希腊原文直译为“在那些神圣的（事物或人）面前”。
    reason: 保留τῶν ἁγίων在性别与所指上的词义歧义。
lexical_decisions:
- source_word: εὐφραινόμενος
  choice: 欢庆
  rationale: 该分词表达持续的群体性喜乐；“欢庆”既符合庆典语境，也比单纯的“欢喜”更能体现共同庆祝的意味。
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  choice: 在圣所前
  rationale: κατὰ πρόσωπον具有“在……面前”的空间含义；在耶路撒冷的敬拜语境中，中性复数τῶν ἁγίων很可能指圣所或圣域，但原文形式仍容许“圣物”或“圣者”等理解，故在脚注保留歧义。
- source_word: ἐπὶ μῆνας τρεῖς
  choice: 三个月
  rationale: 按现代汉语自然表达译出持续时段；“欢庆了三个月”清楚传达该活动延续三个月。
- source_word: κατέμεινεν
  choice: 留在那里
  rationale: 该动词表示继续停留；补出“在那里”使汉语自然，并由上下文明确指耶路撒冷及与众人共处之地。
- source_word: λαός
  choice: 众百姓
  rationale: 自然表达集体意义，不额外限定其政治或族群身份。
- source_word: μετʼ αὐτῶν
  choice: 和他们一同
  rationale: 直接保留“与他们同在、同留”的关系；“一同”使现代汉语语气流畅。
theological_decisions:
- issue: τῶν ἁγίων在耶路撒冷敬拜语境中的所指
  choice: 圣所
  alternative: 圣物；圣者
  rationale: 与表示方位的κατὰ πρόσωπον连用，又处于耶路撒冷庆典语境，“圣所”最符合空间与敬拜背景；但τῶν ἁγίων本身可作中性“圣物”或阳性“圣者”理解，因此不在正文中消除这一真实歧义，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“欢庆”体现持续三个月的共同庆祝；“友弟德”沿用该书名与人物名在现代简体中文中的常见译法。
