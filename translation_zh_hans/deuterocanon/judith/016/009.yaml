  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: zh_hans
  text: 她的凉鞋攫住了他的目光，她的美貌俘获了他的心灵；短剑[a]穿过了他的颈项。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匕首”。希腊词指古代东方类型的短剑或匕首。
    reason: lexical_alternative
lexical_decisions:
- source_word: σανδάλιον
  choice: 凉鞋
  rationale: 该词特指以带系在脚上的鞋；“凉鞋”是现代汉语中具体、自然的对应词，也保留了原文对友弟德装扮细节的描写。
- source_word: ἥρπασε
  choice: 夺去了
  rationale: 该动词本义为强行夺取、攫取。与“眼目”搭配时，“夺去了他的眼目”既保留强烈的征服意象，也能表达他的目光被吸引。
- source_word: ὀφθαλμὸν
  choice: 眼目
  rationale: 原文为单数，直指“眼睛”，在此可兼指目光或视觉注意力。“眼目”保留原文形象，也符合庄重的诗歌语体。
- source_word: κάλλος
  choice: 美貌
  rationale: 这里指友弟德外在的美丽；“美貌”比泛指性质的“美”更贴合人物描写。
- source_word: ᾐχμαλώτισεν
  choice: 掳走了
  rationale: 该词带有战争中俘获、掳为俘虏的含义。“掳走”保留征服与俘虏的隐喻，并与全诗的军事语境相呼应。
- source_word: ψυχὴν
  choice: 心魂
  rationale: ψυχή可指生命、自我或魂。在此指人的内在生命与整个人；“心魂”既保持诗意，又不把含义缩窄为单纯的情感之“心”。
- source_word: ἀκινάκης
  choice: 短剑
  rationale: 该词指古代东方类型的短剑或匕首。“短剑”兼顾器物类别与现代可读性；“匕首”作为可能译法收入脚注。
- source_word: διῆλθεν
  choice: 穿过了
  rationale: 该动词直译为“经过、穿过”。“穿过了”保留原文的运动描写，避免改成解释性更强的“刺穿”。
- source_word: τράχηλον
  choice: 颈项
  rationale: 该词通常指颈部。“颈项”准确而庄重，适合凯歌的诗体语域。
theological_decisions:
- issue: 凯歌中两个夺取、俘获动词的征服隐喻
  choice: 分别译作“夺去了他的眼目”和“掳走了他的心魂”，保留双重征服意象
  alternative: 意译为“吸引了他的目光”和“赢得了他的心”
  rationale: 原文刻意以强力夺取和战争俘虏的语言描写何罗孚乃在被杀之前已经受制于友弟德。保留这种张力可维持诗歌反讽与军事修辞，避免把场景浪漫化。
- issue: ψυχή在此处的范围
  choice: 译作“心魂”，保留内在生命、整个人被制伏的宽广含义
  alternative: 译作“心”“灵魂”或“性命”
  rationale: 单译“心”容易将含义限定为感情，单译“性命”又会使本句过早转向死亡结果；“心魂”较能保留原词在诗境中的多义性。
translation_notes:
  register: 采用现代、庄重而具有诗歌力度的汉语。前两分句保留“夺去—掳走”的征服意象，末句以简洁直接的动作形成突转。脚注标记置于其实际说明的“短剑”之后；未沿用咨询层中误置于“眼”后的标记。
