  yaml_path: translation/deuterocanon/judith/016/012.yaml
  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: zh_hans
  text: 少女的儿子们刺透了他们；他们又如同逃兵的孩子一样伤了他们；他们从我主的战阵中灭亡了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同逃兵的孩子一样”这一比较语在原文中较难确定；也可理解为“像逃兵的孩子会做的那样”。“从我主的战阵中”直译原文；该介词短语的关系不甚明确，也可理解为“在我主的战阵前”或“因我主的战阵而”。
    reason: 保留希腊文比较结构及 ἐκ παρατάξεως 的真实歧义，同时避免不够可靠的改换受事断句。
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: 少女们的儿子
  rationale: 形式上保留原文突兀而带反差的母子关系意象；κοράσιον 指少女或年轻女子。
- source_word: κατεκέντησαν
  choice: 刺透了
  rationale: 体现复合动词所表达的有力穿刺，比泛称“刺伤”更能保留其强度。
- source_word: παῖδας
  choice: 孩子
  rationale: παῖς 可指孩子、男孩或仆人；此处以“孩子”保留年龄弱小的比喻，同时不擅自限定性别。
- source_word: αὐτομολούντων
  choice: 逃兵的
  rationale: 该词指出逃、叛逃或投奔敌方的人；“逃兵”适合战事语境，但其与 παῖδας 的确切句法关系仍有困难。
- source_word: ἐτίτρωσκον
  choice: 刺伤
  rationale: 准确表达造成创伤；未完成时态所含持续或反复意味在汉语叙事中不必强行显化。
- source_word: ἀπώλοντο
  choice: 灭亡了
  rationale: 保留死亡毁灭的结果，而不额外指定施事者。
- source_word: ἐκ παρατάξεως
  choice: 从……战阵中
  rationale: 按 ἐκ 的基本方向义作较形式对应的翻译；该短语也可能表达因、出于或面对战阵而灭亡，故加注说明。
- source_word: κυρίου μου
  choice: 我主
  rationale: 保留明确的第一人称领属及 κύριος 的尊称；本节没有理由扩写为“我的上帝”。
theological_decisions:
- issue: κύριος 的译法
  choice: 我主
  alternative: 我的主人
  rationale: 在赞歌语境中所指为上帝；“我主”既保留敬虔和神学分量，也不超出原文增译“上帝”。
- issue: ἐκ παρατάξεως κυρίου μου 的关系
  choice: 从我主的战阵中灭亡了
  alternative: 在我主的战阵前灭亡了
  rationale: 原文介词短语含义不够明确；正文保留 ἐκ 的表面方向义，并在脚注列出合乎语境的替代理解，避免消解张力。
translation_notes:
  register: 采用庄重而现代的书面普通话。“少女们的儿子”刻意保留希腊文不寻常的表达；“战阵”兼顾可懂度与诗歌体裁。脚注标记置于相关整句末，涵盖两处相互关联的句法歧义。
