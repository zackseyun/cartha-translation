  yaml_path: translation/deuterocanon/judith/016/002.yaml
  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: zh_hans
  text: 因为主是粉碎战争的上帝；因为他把我从追赶我的人手中救出，带入他在民众中间的营地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“带入他的营地（复数）”。“在民众中间”在句法上可与“营地”相连，也可较宽泛地描写拯救发生的场景。
    reason: 说明εἰς的方向性、παρεμβολὰς的复数形式，以及ἐν μέσῳ λαοῦ的句法归属歧义，避免译文将其完全定为单一解释。
lexical_decisions:
- source_word: συντρίβων πολέμους
  choice: 击溃战争
  rationale: συντρίβω有击碎、摧毁之意；与“战争”搭配时，“击溃战争”既保留原文强烈意象，也比抽象的“止息战争”更贴近原词。
- source_word: παρεμβολὰς
  choice: 营垒
  rationale: 该词为复数，可指军营、营地或营垒；“营垒”保留军事语境及复数所表达的整体营阵意味。
- source_word: ἐξείλατό με
  choice: 把我……救了出来
  rationale: ἐξαιρέω在此表示从危险或敌人掌控中救出；此译自然呈现其脱离性含义。
- source_word: ἐκ χειρὸς καταδιωκόντων με
  choice: 从追赶我的人手中
  rationale: 保留“从……手中”的希伯来式希腊语意象，并准确表达καταδιώκω所含紧追、追赶之意。
theological_decisions:
- issue: θεὸς συντρίβων πολέμους Κύριος的谓语关系
  choice: 主是击溃战争的上帝
  alternative: 击溃战争的上帝是主
  rationale: 希腊文无显式系词，两种分析在语义上接近；采用前者符合现代汉语赞歌体表达，并与上下文以“主”为核心的宣告相称，不额外引入特定教义解释。
- issue: 神对战争的行动如何表达
  choice: 击溃战争
  alternative: 止息战争
  rationale: 不将原文强烈而略带张力的“击碎战争”意象平滑化为单纯的和平宣言，以免消解文本对上帝摧毁战争及其力量的描写。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留原文的军事意象和赞歌式平行结构；分号对应两个ὅτι分句之间的推进关系。
