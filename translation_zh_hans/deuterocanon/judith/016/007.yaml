lexical_decisions:
- source_word: ἐξεδύσατο
  choice: 脱下了
  rationale: 该中间语态表示从自己身上脱去衣物；“脱下了”具体、自然，不额外强化语气。
- source_word: στολὴν χηρεύσεως αὐτῆς
  choice: 她守寡的衣服
  rationale: στολή在这里指服饰，χηρεύσεως说明守寡的状态；译文既保留所属关系，也符合现代汉语表达。
- source_word: εἰς ὕψος
  choice: 为要使……得以振作
  rationale: 原短语高度凝缩，字面涉及“高处、升高”。结合受苦者，译作“得以振作”表达使之重新挺立、振起的意象，同时避免把含义限定为地位上的尊崇。
- source_word: τῶν πονούντων
  choice: 受苦的人
  rationale: πονέω可指劳苦、疼痛或遭受困苦；本处叙事语境侧重以色列人所受的苦难，“受苦的人”简洁且保留范围。
- source_word: ἐν Ἰσραήλ
  choice: 以色列中
  rationale: 保留ἐν的群体或范围意义；“以色列中”可自然指以色列群体之内。
