  naturalness: 原句“请我主听你仆人亲口说一句话”中的“亲口”略有强调“本人而非他人”的附加意味，且搭配不够顺畅。改为“请我主听你仆人说一句话”更自然，仍保留恭敬、自谦的宫廷语气。
  terminology: “我主”和“你仆人”适合人间上级与自谦套语。“人民”在此比“民族”更贴近 λαός 的一般集体含义，且避免赋予现代民族国家概念。
