revisions:
- from: 亚扪众子[a]的首领亚基奥对他说：“请我主听你仆人亲口说一句话。我要把住在你附近这片山区的民族的实情告诉你；你仆人口中绝不会说出谎话。”
  to: 亚希约，所有亚扪人的首领[a]，对他说：“请我主听你仆人说一句话。我要把住在你附近这片山区的人民的实情告诉你；你仆人口中绝不会说出谎言。”
  rationale: 修订人名为较通行的“亚希约”，并将族名结构在正文中自然地译为“所有亚扪人”，以脚注保存“亚扪众子”的字面表达。另删去“亲口”，并将 λαός 译为“人民”，使汉语更自然，同时不改变原文的恭敬、郑重和事实陈述。
