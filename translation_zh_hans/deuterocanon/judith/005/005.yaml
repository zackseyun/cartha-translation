base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: zh_hans
  text: 亚希约，所有亚扪人的首领[a]，对他说：“请我主听你仆人说一句话。我要把住在你附近这片山区的人民的实情告诉你；你仆人口中绝不会说出谎言。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“所有亚扪众子的首领”；“亚扪众子”也可译作“亚扪人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: 亚基奥
  rationale: 按希腊语人名音译，并采用适合现代汉语的形式。
- source_word: ὁ ἡγούμενος
  choice: 首领
  rationale: 此词指带领或治理的人；“首领”自然贴合这里的政治、军事语境，又不强加具体官职。
- source_word: πάντων υἱῶν Ἀμμών
  choice: 亚扪众子
  rationale: 保留希腊文以亲属称谓构成族名的表达；脚注说明其惯用含义。
- source_word: Ἀκουσάτω δὴ λόγον
  choice: 请……听……说一句话
  rationale: 第三人称命令式与δή共同表达恭敬而略带恳切的请求；汉语用“请”最自然。
- source_word: ὁ κύριός μου
  choice: 我主
  rationale: 这是对人间上级的尊称；“我主”保留宫廷式、恭敬的语气，并不指神。
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: 你仆人亲口
  rationale: 这里是下属自谦的套语。“仆人”符合语用功能，“亲口”自然传达“从口中”的意象。
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: 我要把……实情告诉你
  rationale: ἀναγγέλλω有报告、告知之意；在谈论某民族的背景时，“实情”比抽象的“真理”更贴切。
- source_word: περὶ τοῦ λαοῦ
  choice: 关于……民族
  rationale: λαός在此指一个族群；译作“民族”比泛指的“百姓”更符合上下文。
- source_word: ὃς κατοικεῖ τὴν ὀρεινὴν ταύτην
  choice: 住在……这片山区的
  rationale: ἡ ὀρεινή指山地或山区；“这片山区”自然且保留地理含义。
- source_word: πλησίον σοῦ οἰκούντος
  choice: 你附近
  rationale: 该结构直译近于“在居住着的你附近”；汉语简化为“你附近”即可清楚传意。
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: 绝不会说出谎话
  rationale: 保留说话从口中出来的含义，以自然汉语表达郑重的真实性保证。
theological_decisions:
- issue: κύριος用于称呼人
  choice: 我主
  alternative: 我的主人
  rationale: 此处称呼的是人间上级，不是神的名号。“我主”保留恭敬的宫廷语体，也避免把语气处理得过于奴役化。
- issue: δοῦλος在宫廷自称中的译法
  choice: 你仆人
  alternative: 你的奴隶
  rationale: 此处主要是对上级自谦的固定表达，而非强调法律上的奴隶身份，因此译作“仆人”更准确地传达话语功能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直引话语保留亚基奥对上级的恭敬自谦，但避免不必要的古奥措辞。希腊文在“住在这片山区的民族”和“住在你附近”之间结构略显累赘，正文按自然汉语整合为“住在你附近这片山区的民族”。
