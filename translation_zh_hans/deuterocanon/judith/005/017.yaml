  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
translation:
  language: zh_hans
  text: 只要他们没有在自己的上帝面前犯罪，福祉就与他们同在，因为那位憎恨不义的上帝与他们同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἕως
  choice: ……的时候
  rationale: 这里表示一种持续的时限条件；用“……的时候”自然表达“只要仍未到改变之时”的含义，又不把它强化为纯粹假设。
- source_word: οὐχ ἥμαρτον
  choice: 没有犯罪
  rationale: 保留否定与“犯罪”的基本动词意义，不额外限定罪的种类或持续方式。
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: 在自己的上帝面前
  rationale: 直译ἐνώπιον的临在和受察验意味；“自己的上帝”自然表达αὐτῶν的所属关系。
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: 福祉就与他们同在
  rationale: τὰ ἀγαθά字面为“美善之事物”，此处指有利的境遇与福乐；“福祉”比“繁荣”涵盖更广，同时保留μετά的“同在”表达。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出他们享有福祉的原因。
- source_word: θεὸς μισῶν ἀδικίαν
  choice: 那位憎恨不义的上帝
  rationale: 希腊语无冠词的θεός在此着重描述上帝的性质，并非引入另一位神；汉语用“那位……的上帝”既自然，也避免“一位上帝”可能造成的误解。
- source_word: ἀδικίαν
  choice: 不义
  rationale: ἀδικία可指不公、不正或邪恶行为；“不义”保留其宽广的道德含义，不局限于社会司法层面。
- source_word: μετʼ αὐτῶν ἐστίν
  choice: 与他们同在
  rationale: 保留原文“同在”的关系性表达；汉语动词不标时态，因此既可承接叙事，也不抹平希腊语现在时所具有的概括性。
theological_decisions:
- issue: θεὸς无冠词是否译成“一位上帝”
  choice: 那位……的上帝
  alternative: 一位憎恨不义的上帝
  rationale: 原文重点在上帝憎恨不义这一性质，而非数量或身份不定。现代汉语的“一位上帝”容易暗示多神语境中未特定的一神，因此采用“那位”指回“他们的上帝”，同时保存性质描述。
- issue: 是否将末句ἐστίν平顺为过去时
  choice: 与他们同在
  alternative: 当时与他们同在
  rationale: 原文由ἦν转为现在时ἐστίν，可能具有概括或刻画性质的作用。汉语不强制标明时态，故不加入“当时”，以免消除原文的时态张力。
- issue: ἀδικία的语义范围
  choice: 不义
  alternative: 不公；恶行
  rationale: “不义”能同时容纳不公正与广义的道德错误，不把经文限定为司法不公，也不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“福祉就与他们同在”略带原文色彩，有意保留τὰ ἀγαθά与μετά的具体表达；全句不添加原文没有的因果条件或教义说明。
