base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/011.yaml
  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them servants.
translation:
  language: zh_hans
  text: 埃及王起来与他们为敌；埃及人以苦役和制砖狡猾地对付他们[a]，使他们受屈辱，又使他们成为奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“设巧计对付他们”或“算计他们”。希腊文动词强调狡猾而有盘算的对待方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανέστη
  choice: 起来敌对
  rationale: 该复合动词在这里表示怀着敌意起来反对，不是单指继位或出现；“起来敌对”保留其动作感和对抗意味。
- source_word: κατεσοφίσαντο
  choice: 狡猾地对付
  rationale: 该词表示以精明而诡诈、经过算计的方式对待人；“狡猾地对付”既表达其负面色彩，也不把具体手段解释得过满。
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  choice: 用苦工和制砖的事
  rationale: πόνος指辛苦劳作，πλίνθος本指砖，在出埃及背景中指制砖劳役；此译法使二者在现代汉语中自然地成为施压手段。
- source_word: ἐταπείνωσαν
  choice: 使他们受屈辱
  rationale: 该动词有使人降卑、受压低之意；“使他们受屈辱”保留降卑含义，又避免与后面的沦为奴隶完全重叠。
- source_word: δούλους
  choice: 奴隶
  rationale: 上下文说的是埃及强加的劳役和民族性奴役，受奴役的身份是核心含义，因此译作“奴隶”比“仆人”准确。
theological_decisions:
- issue: 以色列人在埃及受制时δούλους的身份含义
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: 这里描述强迫劳役及被置于受支配的身份，译作“奴隶”明确体现非自愿的奴役状态，不弱化经文所述的压迫。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“埃及人”承接前句的“埃及王”，补明希腊文复数动词隐含的施事者；分号显示由王的敌对转入埃及人的具体行动。
