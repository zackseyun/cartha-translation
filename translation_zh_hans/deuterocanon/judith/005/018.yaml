base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: zh_hans
  text: 可是，当他们偏离他为他们所定的道路时，就在许多战争中遭到极其惨重的毁灭[a]；他们被掳到不属于他们自己的土地，他们的上帝的圣殿被夷为平地，他们的城邑也被仇敌占领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极其惨重”译自一个强化性的希腊语短语，强调毁灭的程度或范围极大。
    reason: 说明ἐπὶ πολὺ σφόδρα的强化作用，并保留其可涉及程度或范围的语义余地，避免将其限定为持续时间。
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: 偏离……道路
  rationale: 表达离开规定路线的动作，也自然保留比喻性的道德、宗教含义；不采用“背叛”或“叛教”，以免把语义限定得过窄。
- source_word: ἧς διέθετο αὐτοῖς
  choice: 他为他们所定的
  rationale: διέθετο在此指为他们设定、规定一条当行的道路；保留“他”作主语，不额外展开其身份。
- source_word: ἐξωλεθρεύθησαν
  choice: 惨遭毁灭
  rationale: 保留复合动词强烈的毁灭意味；“惨遭”使现代汉语自然，并与随后被掳的叙述并存，而不擅自改写为具体的伤亡数字或行动。
- source_word: ἐν πολλοῖς πολέμοις
  choice: 在许多战争中
  rationale: 按πολέμοις译为“战争”，不缩窄为单次“战役”或“战斗”。
- source_word: ἐπὶ πολὺ σφόδρα
  choice: 程度极其严重
  rationale: 将强化短语理解为强调毁灭的程度和规模，同时用脚注交代可能偏向持续时间的读法。
- source_word: ᾐχμαλωτεύθησαν εἰς γῆν οὐκ ἰδίαν
  choice: 被掳到不属于自己的土地
  rationale: “被掳”明确保留强制成为俘虏的含义；直译所有格对比，不笼统处理为“流亡异乡”。
- source_word: ὁ ναὸς τοῦ θεοῦ αὐτῶν
  choice: 他们上帝的圣殿
  rationale: 犹太语境中ναός指圣殿；“他们上帝的”保留原文所属关系。
- source_word: ἐγενήθη εἰς ἔδαφος
  choice: 被夷为平地
  rationale: 以自然、庄重的汉语表达建筑物毁至地面的意象。
- source_word: ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων
  choice: 被仇敌占领
  rationale: 在城邑作主语时，“占领”自然表达落入敌对者控制之下；不额外说明占领方式或时长。
theological_decisions:
- issue: 审判灾祸中的施事者
  choice: 说明他们偏离所定道路之后遭毁灭、被掳、圣殿被毁、城邑被占，却不把上帝增补为各项灾祸的直接施事者。
  alternative: 可解释性地译成上帝亲自使这些灾祸临到他们。
  rationale: 原文以他们偏离所定道路为因果背景，但各灾祸均用被动表达，没有明说上帝是每个动作的直接语法施事者；正文保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“道路”保留圣经语境中人生行径的比喻；分号划分灾祸清单，避免长句失去层次。脚注标记[a]已在正文相应位置出现。
