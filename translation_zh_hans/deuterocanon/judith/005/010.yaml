revisions:
- from: 他们下到埃及，因为饥荒笼罩了迦南全地；他们寄居在那里，直到得以维持生活。他们在那里繁衍成极多的人，他们的族类[a]多得无法计数。
  to: 他们下到埃及，因为饥荒笼罩了迦南全地；他们寄居在那里，直到得到供养。他们在那里成为人数极多的群体，他们的族人[a]不计其数。
  rationale: 修订避免把“成为极大群体”限定为“繁衍”，并以“成为人数极多的群体”保留原文结果性和数量强调。将“得以维持生活”改为“得到供养”，更清楚反映被动的受供给含义。正文采用自然、可计数的“族人”，并以脚注保留γένος所含的谱系与群体语义范围。
  reviewer_model: gpt-5.6-terra
