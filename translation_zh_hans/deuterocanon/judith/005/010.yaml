  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: zh_hans
  text: 他们下到埃及，因为饥荒笼罩了迦南全地；他们寄居在那里，直到得到供养。他们在那里成为人数极多的群体，他们的族人[a]不计其数。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族人”或译“族系”或“人民”；希腊文γένος可指同一祖先所出的血缘群体、族系或人民。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβησαν
  choice: 下到
  rationale: 保留前往埃及惯用的方向表达，也符合圣经历史叙事的语言习惯。
- source_word: ἐκάλυψεν ... τὸ πρόσωπον τῆς γῆς Χανααν
  choice: 笼罩了迦南全地
  rationale: “笼罩”保留“覆盖”的意象；“全地”以自然现代汉语表达希腊文“地面／地的表面”这一闪语式说法。
- source_word: λιμός
  choice: 饥荒
  rationale: 在历史叙事中准确表达大范围缺粮，而非一般性的饥饿。
- source_word: παρῴκησαν
  choice: 寄居
  rationale: 简洁保留以外来者身份暂住、并非永久定居的含义。
- source_word: μέχρις οὗ διετράφησαν
  choice: 直到得以维持生活
  rationale: 体现被动语态所含“得到供养、维生”的意思，同时不把含义缩窄为单纯吃饱。
- source_word: ἐγένοντο ... εἰς πλῆθος πολύ
  choice: 繁衍成极多的人
  rationale: 既传达形成庞大群体的结果，也以自然汉语显示人口增长的语境。
- source_word: οὐκ ἦν ἀριθμός
  choice: 多得无法计数
  rationale: 将希腊文“没有数目”的不可胜数习语自然地译成现代汉语。
- source_word: τοῦ γένους αὐτῶν
  choice: 他们的族类
  rationale: 保留γένος在此可指共同祖先所出的血缘群体、族系或人民的语义范围，避免现代生物种族观念。
theological_decisions:
- issue: τοῦ γένους αὐτῶν所表达的血缘／群体概念
  choice: 他们的族类
  alternative: 他们的族系／他们的人民
  rationale: “族类”能兼顾共同血缘与由此形成的群体身份，不将其限定为后代，也不引入现代“种族”分类；脚注保留其他合理理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寄居”保留圣经历史语境中的外来暂住含义；整体避免生硬照搬希腊语序，同时保留饥荒“笼罩”全地及人数不可计数的修辞力度。
