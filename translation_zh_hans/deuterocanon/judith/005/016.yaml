  yaml_path: translation/deuterocanon/judith/005/016.yaml
  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: zh_hans
  text: 他们从他们面前赶走了迦南人、比利洗人、耶布斯人、示剑人[a]和所有革迦撒人，并在那地居住了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“示剑”；这里可能指示剑人，也可能保留地名“示剑”。
    reason: 保留Συχέμ在族群名单中究竟是地名还是居民称谓的词义歧义。
lexical_decisions:
- source_word: ἐξέβαλον
  choice: 赶走了
  rationale: 该动词表示强行驱逐；“赶走”既保留动作的力度，也符合现代汉语叙事表达。
- source_word: ἐκ προσώπου αὐτῶν
  choice: 从自己面前
  rationale: 保留受闪语影响的“从……面前”这一表达，同时用“自己”明确其回指主语。
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: 迦南人、比利洗人、耶布斯人
  rationale: 希腊文使用带冠词的单数族名，具有集合意义；汉语以相应族名加“人”自然表达群体。
- source_word: τὸν Συχέμ
  choice: 示剑人
  rationale: Συχέμ通常是地名“示剑”，但在本节族群名单中与其他族名并列；正文译作“示剑人”以传达其语境功能，并以脚注保留形式上的歧义。
- source_word: πάντας τοὺς Γεργεσαίους
  choice: 所有革迦撒人
  rationale: πάντας与复数族名直接表示该族全体，译作“所有革迦撒人”。
- source_word: κατῴκησαν
  choice: 居住了
  rationale: 该词可指居住或定居；“居住了”与后面的持续时间短语衔接自然，且不额外强调定居过程。
- source_word: ἐν αὐτῇ
  choice: 在那地
  rationale: 阴性代词在上下文中最自然地回指那片土地；汉语补出“地”可避免含混，而不改变指称。
- source_word: ἡμέρας πολλάς
  choice: 许多日子
  rationale: 按持续时间宾格直译为“许多日子”，保留原文措辞，不解释性地改成“很长时间”。
theological_decisions:
- issue: 是否弱化征服与驱逐的陈述
  choice: 赶走了……并在那地居住了
  alternative: 使……离开……并在那里安居
  rationale: 原文直接叙述先前居民遭到强行驱逐及以色列人随后居住的事实；译文不使用委婉语，也不添加为该事件辩护或定性的神学说明。
- issue: Συχέμ在族群名单中的身份
  choice: 正文译“示剑人”，脚注说明也可能指示剑或示剑居民
  alternative: 正文直接译“示剑”
  rationale: 该形式本身是“示剑”，但句法位置使其与族名并列。以“示剑人”表达语境中的群体所指，同时借脚注保留文本的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。族名使用简体中文圣经语境中通行的音译；“从自己面前”适度保留原文的闪语式表达，“许多日子”则保留原文的时间意象。脚注标记紧随存在歧义的“示剑人”，而非置于其他族名之后。
