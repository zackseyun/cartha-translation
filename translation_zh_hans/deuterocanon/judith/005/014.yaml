  text: 他带领他们踏上通往西奈和加低斯巴尼亚的路[a]；他们驱逐了所有住在旷野的人[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西奈和加低斯巴尼亚的路。”希腊文直译为“西奈和加低斯巴尼亚的路”；这可指通往这些地方的路线，也可指与这些地方相关的路线。
    reason: lexical_alternative
  - marker: b
    text: 或译：“旷野所有的居民。”希腊文采用分词结构，直译为“所有住在旷野的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: 领
  rationale: ἄγω的不定过去时在行程语境中表示带领、引领；“领”自然保留了主语主动引导众人的含义。
- source_word: εἰς ὁδὸν
  choice: 走上……的路
  rationale: 该短语表示使人进入或踏上一条路线；“走上……的路”既符合现代汉语，也保留具体的行路意象。
- source_word: τοῦ Σεινὰ καὶ Καδής Βαρνή
  choice: 通往西奈和加低斯巴尼亚
  rationale: 属格依附于“路”，可指与这些地点相关或通向这些地点的路线；正文采用自然的目的地表达，同时以脚注保留关系上的含混。地名按现代汉语圣经常见形式音译。
- source_word: ἐξέβαλον
  choice: 赶走
  rationale: ἐκβάλλω在领土和居民语境中指强行逐出；“赶走”清楚传达这种驱逐之意。
- source_word: πάντας
  choice: 所有
  rationale: 保留原文无例外的总括语气。
- source_word: τοὺς κατοικοῦντας
  choice: 住……的人
  rationale: 保留现在分词所表达的居住状态，比名词化为“居民”略更贴近原文结构。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: ἔρημος可指荒漠或旷野；“旷野”符合相关行程叙事的地理语域，也自然庄重。
