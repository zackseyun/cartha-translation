  yaml_path: translation/deuterocanon/judith/005/015.yaml
  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: zh_hans
  text: 他们住在亚摩利人的土地上，凭自己的力量[a]灭尽了所有希实本人；渡过约旦河以后，他们占领了整个山区[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“靠着他们的能力”或“凭着他们的威力”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“承受了整个山区为业。”希腊语动词可指承受或取得产业；这里描述他们渡过约旦河后取得这片土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤκησαν
  choice: 住在
  rationale: οἰκέω在此表示在某地居住或定居；“住在”自然简明，并符合叙事语境。
- source_word: γῇ Ἀμορραίων
  choice: 亚摩利人的土地
  rationale: 直译所属关系，清楚表明这是与亚摩利人相关的地域。
- source_word: ἐξωλόθρευσαν
  choice: 灭尽了
  rationale: 该动词表达彻底毁灭；“灭尽”既保留强度，也与πάντας“所有”相呼应。
- source_word: πάντας τοὺς Ἐσεβωνείτας
  choice: 所有希实本人
  rationale: Ἐσεβωνεῖται是指希实本一地的居民或族群；“希实本人”简洁保留其地域称谓。
- source_word: ἐν τῇ ἰσχύι αὐτῶν
  choice: 凭自己的力量
  rationale: 介词短语在此自然表达手段；“凭自己的力量”准确而符合现代汉语习惯。
- source_word: διαβάντες τὸν Ἰορδάνην
  choice: 渡过约旦河以后
  rationale: 分词所指行动先于主句行动；“以后”清楚呈现叙事次序。
- source_word: ἐκληρονόμησαν
  choice: 占领了
  rationale: κληρονομέω可指承受产业或取得为业；在渡河取得领土的语境中，“占领了”自然传达实际占有，同时以脚注保留“承受为业”的词义。
- source_word: πᾶσαν τὴν ὀρεινήν
  choice: 整个山区
  rationale: ἡ ὀρεινή指山地或丘陵地区；“整个山区”是清楚自然的现代地理表达。
theological_decisions:
- issue: κληρονομέω的产业承受含义与军事占有语境之间的张力
  choice: 正文译为“占领了”
  alternative: “承受了整个山区为业”
  rationale: 上下文叙述渡河后取得领土，正文采用自然的领土占有表达；脚注保留该动词可含“承受为业”的重要语义，不把两者强行合并。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名地名使用常见圣经译名“亚摩利人、希实本人、约旦河”。英文咨询稿的脚注[a]标记位置与内容不符；本稿依希腊语将[a]置于“自己的力量”之后。
