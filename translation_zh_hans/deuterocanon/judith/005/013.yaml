  text: And God dried up the Red Sea before them,[a]
translation:
  language: zh_hans
  text: 上帝使红海在他们面前干涸了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译法根据出埃及传统中的希伯来语，作“芦苇海”；这里的希腊语原文作“红海”。
    reason: 说明希腊语正文与出埃及传统中基于希伯来语的常见替代译法之间的差异。
lexical_decisions:
- source_word: κατεξήρανεν
  choice: 使……干涸了
  rationale: 该复合动词表示使某物彻底变干；“使……干涸”既准确表达使役含义，也自然契合海水退去、道路显出的出埃及背景。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 这是带冠词的主格主语；现代汉语在此以“上帝”自然表达，通常不另译希腊语冠词。
- source_word: τὴν ἐρυθρὰν θάλασσαν
  choice: 红海
  rationale: 希腊文本明确作“红海”，且这是七十士译本传统中的常见称呼；因此正文直接按希腊语见证翻译。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 在他们面前
  rationale: 保留原文的空间关系，表示上帝在百姓前方施行此事；此译法庄重自然，也不额外限定“为他们”或“在他们眼前”等可能含义。
theological_decisions:
- issue: 出埃及过海典故中ἐρυθρὰν θάλασσαν的译法
  choice: 红海
  alternative: 芦苇海
  rationale: 本译本以所给希腊语原文为首要依据，而希腊文明确写作“红海”。“芦苇海”来自相关希伯来语出埃及传统的另一种理解，不应取代正文的希腊语见证，但可在脚注中保留，以呈现文本传统之间的差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使红海在他们面前干涸了”紧贴希腊语语序与使役意义，同时避免生硬直译；脚注标记[a]已置于正文相应位置。
