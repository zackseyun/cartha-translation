  yaml_path: translation/deuterocanon/judith/005/012.yaml
  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: zh_hans
  text: 他们向自己的神高声呼求；他便用无法医治的灾祸击打埃及地。埃及人就把他们从自己面前赶了出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从他们面前”。这里的“他们”通常指埃及人，即埃及人把以色列人赶离自己的面前；单看代词形式，也可能有别的所指。
    reason: 说明闪语式表达及代词所指的歧义。
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: 高声呼求
  rationale: 该动词表示大声呼喊；这里呼求的对象是神，兼有高声呼喊和在困境中恳求之意。
- source_word: ἐπάταξεν
  choice: 击打
  rationale: 保留πατάσσω所表达的有力行动，也符合现代汉语的圣经叙事语体。
- source_word: γῆν Αἴγυπτον
  choice: 埃及地
  rationale: γῆ在此指埃及的地域；“埃及地”简洁保留了原文具体的地理含义。
- source_word: πληγαῖς
  choice: 灾祸
  rationale: 该词可指击打、创伤或神所降的灾害；出埃及背景支持灾祸之义，同时避免机械套用特定的灾数。
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: 无法医治的
  rationale: ἴασις本义为医治、治愈；此译保留原文以医治描述灾祸无可挽回的比喻，而不改写为较宽泛的“无法补救”。
- source_word: ἐξέβαλον
  choice: 赶了出去
  rationale: 该动词表示驱逐或赶出；此译自然清楚，并符合这里埃及人驱逐以色列人的叙事语境。
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: 从自己面前
  rationale: 原文直译近于“从他们面前”，是带有闪语色彩的表达；中文用“从自己面前”表明通常理解的指向，同时以脚注记录字面形式及代词歧义。
theological_decisions:
- issue: ἐπάταξεν的隐含主语
  choice: 以“他”承接前句的“神”
  alternative: 省略主语，或理解为未明确指出的施行者
  rationale: 希腊文动词为第三人称单数，最自然地回指前句“他们的神”；译文不添加原文以外的神学说明。
- issue: 末尾αὐτῶν的所指
  choice: 理解为埃及人把他们赶离埃及人自己面前
  alternative: 形式上也可能把“他们”理解为以色列人，但在此语境中不自然
  rationale: 主语“埃及人”及出埃及叙事使反身理解最为自然；脚注保留希腊文代词形式所具有的表面歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“高声呼求”保留求告神的语境；“无法医治的灾祸”有意保留原文较强且略带张力的医治比喻。脚注标记置于其实际说明的末句之后。
