  yaml_path: translation/deuterocanon/judith/005/024.yaml
  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: zh_hans
  text: 所以，我们确实要上去；他们必成为你全军的食物[a]，荷罗弗尼大人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“猎物”或“任凭吞吃之物”；希腊文直译为“供你全军吞吃”。
    reason: 说明κατάβρωμα的字面吞吃意象及可成立的语境性译法。
lexical_decisions:
- source_word: διὸ δὴ
  choice: 所以……确实
  rationale: διό表示由前文得出的结论，δή又加强语气；此译同时保留“所以”的推论关系和“确实”的强调意味。
- source_word: ἀναβησόμεθα
  choice: 我们……要上去
  rationale: 这是ἀναβαίνω的将来时形式，在军事语境中可指向高处进军；“上去”保留空间方向，也符合现代汉语表达。
- source_word: ἔσονται
  choice: 必成为
  rationale: ἔσονται与εἰς加宾格连用，表达结果或转变；“成为”比单纯的“是”更准确，“必”体现将来陈述在此处的肯定语气。
- source_word: εἰς κατάβρωμα
  choice: 成为……的食物
  rationale: κατάβρωμα指被吃或吞食之物；“食物”简洁保留原文的吞吃意象，脚注说明“猎物”等语境性译法。
- source_word: πάσης τῆς στρατειᾶς σου
  choice: 你全军
  rationale: πάσης修饰στρατειᾶς，指对方整支军队；“你全军”凝练自然，并保留所有关系。
- source_word: δέσποτα
  choice: 大人
  rationale: 此处是对掌权者的直接尊称。现代汉语中的“大人”能自然表达下对上的敬称，又不引入用于上帝的专门称号。
- source_word: Ὀλοφέρνη
  choice: 荷罗弗尼
  rationale: 按中文圣经人名的通行音译处理。
theological_decisions:
- issue: 直接称呼中的δέσποτα如何翻译
  choice: 荷罗弗尼大人
  alternative: 主人荷罗弗尼；我主荷罗弗尼
  rationale: δέσποτα强调权威和主从地位，但此处称呼的是军事统帅，并非神圣称号。“大人”在现代中文中庄重、自然，可避免“我主”可能带来的神学联想，也避免“主人荷罗弗尼”的生硬语序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“所以……确实”保留推论及强调；分号呈现行动与预期结果之间的紧密关系。称呼译作“荷罗弗尼大人”，符合现代汉语直接称呼的自然语序。
