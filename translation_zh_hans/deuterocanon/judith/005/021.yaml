base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: zh_hans
  text: 可是，如果他们这个民族中没有不法的事，就请大人绕过他们吧[a]，免得他们的主、他们的上帝护卫他们，使我们在全地面前蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“就让主过去吧”。按上下文，这里最可能是对荷罗孚尼的敬称，所以译作“大人”，并不是指上帝。
    reason: 说明第一处 κύριος 的词面歧义及其在上下文中的人间敬称用法。
lexical_decisions:
- source_word: ἀνομία
  choice: 不法的事
  rationale: 兼顾该词违反律法与道德邪恶的含义，也避免把它缩窄为某一种具体罪行。
- source_word: ἔθνος
  choice: 民族
  rationale: 此处把以色列视为一个具有共同身份的群体；“民族”比泛指的“人们”更贴近其族群含义。
- source_word: παρελθέτω
  choice: 请大人绕过他们吧
  rationale: 该命令式表示“经过、越过、绕过”。结合亚希约向荷罗孚尼进言的语境，以“大人”表达对人间上级的敬称，并补出语境中隐含的对象“他们”，使现代汉语自然清楚。
- source_word: μή ποτε
  choice: 免得
  rationale: 在汉语中自然引出一种可能发生而应当警惕的结果；其不确定性由整句警告语气保留。
- source_word: ὑπερασπίσῃ
  choice: 为他们辩护
  rationale: 该词可指站在某一方保护、捍卫或为其出战；“为他们辩护”保留维护其一方的核心意义，同时与后文公开蒙羞相衔接。
- source_word: ὀνειδισμός
  choice: 蒙羞
  rationale: 表达公开受到羞辱、成为责难对象的结果，符合现代汉语习惯和庄重语体。
- source_word: πάσης τῆς γῆς
  choice: 全地
  rationale: 保留希腊文“整个大地”的广阔修辞范围，不缩窄为某一片土地。
- source_word: κύριος
  choice: 大人／主
  rationale: 第一次依语境指受劝告的荷罗孚尼，译作人间敬称“大人”；第二次与“他们的上帝”并列，明确指神，译作“主”。
theological_decisions:
- issue: 同一句中两处 κύριος 的所指
  choice: 第一处译作“大人”，指荷罗孚尼；第二处译作“他们的主”，指上帝
  alternative: 两处都译作“主”，保留形式上的歧义
  rationale: 第一处单从词形看可以有歧义，但直接话语是在向荷罗孚尼提出建议，人间敬称最合语境；第二处又与“他们的上帝”并列，所指必为神。脚注说明第一处的字面形式，以免隐藏原文特点。
- issue: ὑπερασπίζω 的军事或司法色彩
  choice: 译作“为他们辩护”
  alternative: 译作“保护他们”或“为他们争战”
  rationale: 原词可涵盖保护、声援和出面捍卫；这里不把上帝行动限定为纯军事介入，也不排除其保护含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文的条件对比；“就请大人……吧”保留劝告口吻；避免使用过度古雅的“无法”“受辱于普天下”等表达。
