base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/022.yaml
  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
translation:
  language: zh_hans
  text: 亚基约说完这些话后，围在帐幕四周、站在那里的人都纷纷抱怨。敖罗斐乃的权贵，以及所有住在沿海地区和摩押的人，都说要击倒他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀死他”或“把他砍倒”。希腊语 συγκόψαι 表达暴力性的击打或击倒；具体方式以及是否必然致死，并未完全说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: ……后
  rationale: 这是常见的希腊语叙事衔接结构。汉语直接用“……后”推进叙事更自然，无须机械保留“事情发生了”。
- source_word: ἐπαύσατο ... λαλῶν τοὺς λόγους τούτους
  choice: 说完这些话
  rationale: ἐπαύσατο 表示停止，结合说话语境，现代汉语以“说完”清楚表达动作先后，同时保留“这些话”的指示意味。
- source_word: ἐγόγγυσεν
  choice: 发起怨言来
  rationale: 该词表示低声抱怨、发怨言；此处用“发起怨言来”既体现敌意，也能传达反应的开始。
- source_word: πᾶς ὁ λαὸς ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: 围在帐幕四周、站在那里的众人
  rationale: 保留两个描述人群位置的分词，并用自然汉语避免重复累赘；πᾶς 以“众人都”体现全体范围。
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: 敖罗斐乃的权贵
  rationale: μεγιστᾶνες 指有地位的首领或显贵；“权贵”在本语境中简明而庄重。
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: 所有住在沿海地区和摩押的人
  rationale: 按希腊语并列结构保留两个地域范围，不把 παραλία 过度具体化为某一片海岸。
- source_word: συγκόψαι αὐτόν
  choice: 把他杀掉
  rationale: 此处不定式表达众人主张如何处置亚基约。συγκόπτω 带有暴力击倒或砍倒的意味，在语境中指置其于死地；正文用自然明确的“杀掉”，脚注保留动作方式上的词义幅度。
