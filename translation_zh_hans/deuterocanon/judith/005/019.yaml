base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: zh_hans
  text: 现在，他们回转归向自己的上帝后，从流散之地[a]上来；他们曾被分散在那里。他们占据了耶路撒冷，就是他们圣所所在之处，又在山地定居，因为那里无人居住。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流散之地”也可译作“分散之地”。希腊文在表示他们被分散的地点时，连续使用关系地点词和“那里”，带有略显重复的地点强调；正文以“他们曾被分散在那里”保留这一点。
    reason: 说明ἐκ τῆς διασπορᾶς οὗ διεσπάρησαν ἐκεῖ的地点重复及可译方式。
  - marker: b
    text: “无人居住”也可译作“荒凉”或“荒废”。
    reason: 保留ἔρημος在此处的词义范围。
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: 回转归向自己的上帝
  rationale: 既保留ἐπιστρέφω的转回意象，也表达重新归向并效忠于上帝的含义；不把它限定为后世术语所说的正式“皈依”或“悔改”。
- source_word: ἀνέβησαν
  choice: 上来
  rationale: 保留ἀναβαίνω的上行含义，也符合圣经地理中前往犹大山地或耶路撒冷常用的表达。
- source_word: ἐκ τῆς διασπορᾶς οὗ διεσπάρησαν ἐκεῖ
  choice: 从四散之地上来，就是他们曾被分散到的那些地方
  rationale: “四散之地”传达διασπορά所指的分散状态及地域；后半句以自然中文保留希腊文οὗ与ἐκεῖ略显重复的地点强调。
- source_word: κατέσχον
  choice: 占据了
  rationale: 表达取得并持有耶路撒冷的实际控制；比“攻占”较少加入原文未明说的军事方式。
- source_word: τὸ ἁγίασμα
  choice: 圣所
  rationale: 准确表达分别为圣的地点，同时不把词义过度限定为整座圣殿或某一特定院区。
- source_word: κατῳκίσθησαν
  choice: 定居下来
  rationale: 自然表达建立居所、安顿居住的结果，也能涵盖被动形式可能具有的“被安置”色彩。
- source_word: ἐν τῇ ὀρεινῇ
  choice: 在山地
  rationale: 这是简洁自然的地理用语，指耶路撒冷周围的丘陵或高地地区。
- source_word: ὅτι ἦν ἔρημος
  choice: 因为那里原本无人居住
  rationale: ἔρημος可指荒凉、荒废或无人居住；在重新定居的语境中，“无人居住”最具体，同时以脚注保留其他可能。
theological_decisions:
- issue: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν所表达的盟约性回归
  choice: 回转归向自己的上帝
  alternative: 回到自己的上帝那里；重新归顺自己的上帝
  rationale: 这句话描述他们重新归向本民族所敬奉的上帝，而不是接受一位新的神明；所选译法保留悔改、忠诚和关系恢复之间的张力，不以特定教派术语加以限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“自己的上帝”“圣所”“山地”等保留经文语域；通过“就是……那些地方”尽量再现原文地点表达的重复强调，同时避免生硬直译。
