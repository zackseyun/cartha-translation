lexical_decisions:
- source_word: ὠργίσθη θυμῷ σφόδρα
  choice: 勃然大怒
  rationale: ὠργίσθη表示进入愤怒状态，θυμῷ σφόδρα加强其程度；“勃然大怒”自然、凝练地兼顾了突发性与强烈程度。
- source_word: ἐκάλεσεν
  choice: 召来
  rationale: 语境是掌权者召集官员，“召来”比一般的“叫”更能体现权威性的召唤。
- source_word: ἄρχοντας
  choice: 首领
  rationale: 该词泛指掌权或治理的人；“首领”在此清楚易懂，也避免将其过度限定为君王或特定官职。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 该词在此具有军事含义；“将领”是自然的现代汉语统称，不武断限定具体军阶。
- source_word: σατράπας
  choice: 总督
  rationale: σατράπης指辖区的高级行政长官；“总督”既保留历史政治色彩，又比音译名称更易为普通读者理解。
- source_word: τῆς παραλίας
  choice: 沿海地区
  rationale: παραλία指海岸地带或沿海区域；“沿海地区”自然准确，并保留其地域范围上的宽泛性。
- source_word: Μωὰβ
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: Ἀμμὼν
  choice: 亚扪
  rationale: 采用现代中文圣经传统中通行的专名译法。
