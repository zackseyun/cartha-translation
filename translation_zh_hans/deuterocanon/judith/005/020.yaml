base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/020.yaml
  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: zh_hans
  text: 现在，主公大人，若这百姓中确有过犯[a]，正在得罪他们的上帝，并且我们查明他们中间有这绊脚之物，我们就上去攻打他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过犯”也可译作“错误”或“无意犯的罪”；原词可能强调因无知而有的过错。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: 主公大人
  rationale: 两个呼格合用，是对荷olofernes的尊称而非对上帝的称号。“主公大人”保留叠加、郑重的称呼，也避免使人误解为神圣称号。
- source_word: ἀγνόημα
  choice: 过犯
  rationale: 指错误或不当行为，并可能含因无知而犯的意味。“过犯”表达其罪责性质，但不在正文中过度限定是否出于故意。
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: 正在得罪他们的上帝
  rationale: 用“正在”体现现在时的持续面貌；“得罪……上帝”自然表达行为所针对的对象及宗教含义。
- source_word: ἐπισκεψόμεθα
  choice: 我们也查明
  rationale: 此处表示考察并确定事实。“查明”符合军事决策语境，也保留尚待调查确认的条件性。
- source_word: σκάνδαλον
  choice: 绊脚之物
  rationale: 保留陷阱或绊倒物的具体隐喻；“之物”表明这里所指的是使他们陷于败亡的罪咎因素，而不直接替原文解释其性质。
- source_word: ἀναβησόμεθα
  choice: 就上去
  rationale: 保留“上去”的地势或军事推进含义；与后面的攻打自然衔接。
- source_word: ἐκπολεμήσομεν
  choice: 攻打他们
  rationale: 表达主动发起有组织的军事行动，在现代汉语中比直译为“与他们作战”更自然凝练。
theological_decisions:
- issue: δέσποτα κύριε的双重称呼
  choice: 主公大人
  alternative: 主啊；至尊的主
  rationale: 说话对象是荷olofernes，不是以色列的上帝；因此避免采用容易被理解为神圣称号的“主啊”，同时以叠加敬称反映希腊文修辞。
- issue: ἀγνόημα是否明确为无意之罪
  choice: 正文作“过犯”，脚注说明可能含无知或无意而犯的意味
  alternative: 无意犯的罪；错误
  rationale: 该词可带无知的语义色彩，但上下文没有明确断定其行为完全无意。把这一层放入脚注，可保留词义张力而不替原文作过度裁定。
- issue: σκάνδαλον的神学与因果意味
  choice: 保留“绊脚之物”的隐喻
  alternative: 罪；败亡的缘由
  rationale: 原文没有直接把该词等同于某一特定罪行，而是描绘百姓中使他们跌倒、暴露于败亡的因素；保留隐喻可避免把因果关系解释得过满。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。“主公大人”保持对军事统帅的郑重称呼；全句保留“如果……查明……就……”的条件推理。正文不增加原文未明说的神学解释。
