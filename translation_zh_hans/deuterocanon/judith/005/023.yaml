  yaml_path: translation/deuterocanon/judith/005/023.yaml
  text: For we will not be helped by the sons of Israel; for look, they are a people in whom there is neither strength nor might for strong battle formation.
translation:
  language: zh_hans
  text: 因为我们不会得到以色列人的援助；看哪，他们是一个没有力量、也没有能力列成强大战阵的民族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοηθησόμεθα ἀπὸ υἱῶν Ἰσραήλ
  choice: 我们不会得到以色列人的援助
  rationale: 被动式直译为“得到……的援助”符合现代汉语；υἱῶν Ἰσραήλ在此是民族称谓，译作“以色列人”比“以色列的众子”自然。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、带有宣告色彩的语气，同时使用现代读者熟悉的庄重圣经表达。
- source_word: δύναμις οὐδὲ κράτος
  choice: 没有力量、也没有能力
  rationale: 保留两个近义名词的并列，不把二者强行区分为特定军事术语；“力量/能力”兼顾语义差别与汉语自然度。
- source_word: εἰς παράταξιν ἰσχυράν
  choice: 摆出强大战阵
  rationale: παράταξις指列阵、战阵；介词短语在此说明其力量与能力所要达到的军事效果，译为“摆出强大战阵”清楚自然。
- source_word: λαός
  choice: 民族
  rationale: 此处指以色列作为一个整体族群；“民族”比“百姓”更贴合敌方对该群体的军事评价。
theological_decisions:
- issue: 说话者对以色列军事实力的判断
  choice: 按原文保留为断言，不补入讽刺、误判或神学评注
  alternative: 明确说明这是敌方错误低估以色列
  rationale: 本节原文本身只记录该判断；其叙事真实性与神学反讽应由上下文呈现，不宜在译文中预先解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”略带传统经文语体，以对应ἰδοὺ的强调功能；其余措辞避免古奥。
