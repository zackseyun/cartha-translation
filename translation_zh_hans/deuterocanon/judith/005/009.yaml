  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: zh_hans
  text: 他们的上帝吩咐他们离开寄居之地[a]，前往迦南地。他们就在那里定居下来，金银和牲畜都大大增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居之地”也可译作“他们作外乡人居住的地方”。希腊文含有以外来者身份居住的意思。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们拥有极多的金银和牲畜”，即这些财产大为增加。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... πορευθῆναι
  choice: 吩咐他们离开……前往
  rationale: εἶπεν 后接两个不定式，在此表达指示性的言语。“吩咐”自然传达上帝叫他们采取行动，但不像“命令”那样强化语气。
- source_word: παροικίας
  choice: 寄居之地
  rationale: παροικία 指以外来者身份居住或寄居；“寄居之地”既保留外乡人居住的意味，也符合现代中文表达。
- source_word: γῆν Χανάαν
  choice: 迦南地
  rationale: 直接体现 γῆν，并采用中文圣经地名的自然表达。
- source_word: κατῴκησαν
  choice: 定居下来
  rationale: 该词表示居住、安顿；“定居下来”体现他们在当地建立居所，而不只是短暂停留。
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ καὶ ἐν κτήνεσιν πολλοῖς σφόδρα
  choice: 金银和牲畜都大大增多
  rationale: ἐπληθύνθησαν 的核心意象是增多；结合金银和牲畜，指财产大量增加。此译法保留原文的增加表达，避免只概括为“富有”。
- source_word: κτήνεσιν πολλοῖς σφόδρα
  choice: 牲畜……大大增多
  rationale: κτήνη 泛指家畜，并非仅指牛；πολλοῖς σφόδρα 强调数量极多，以“大大增多”自然表达。
theological_decisions:
- issue: εἶπεν 后接不定式所表达的上帝言语行为
  choice: 上帝吩咐他们离开并前往迦南
  alternative: 上帝告诉他们要离开；上帝命令他们离开
  rationale: 原文具有明确的行动指向，却没有采用专门表示“命令”的动词；“吩咐”兼顾指示性和语气上的克制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“寄居之地”保留原文的外来者身份含义；末句以“都大大增多”重现希腊文的增多意象，并使金银与牲畜共同受其支配。
