base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: zh_hans
  text: 有人向亚述军队的统帅何罗斐乃报告说，以色列人[a]已经备战，封锁了山区的道路，在每一座高山的山顶设防，并在平原上设置了障碍物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“以色列的众子”，是对以色列民族的惯常称呼。
    reason: lexical_alternative
  - marker: b
    text: “障碍物”也可译作“陷阱”或“路障”；希腊词原指使人绊倒之物，此处指军事语境中的实体阻碍物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: 有人向……报告说
  rationale: 希腊语为不定过去时被动式，表示消息传到何罗斐乃那里，并未说明报信者；汉语用泛指主语“有人”自然表达这一不定施事。
- source_word: Ὀλοφέρνῃ
  choice: 何罗斐乃
  rationale: 采用现代中文圣经语境中可辨识的传统音译。
- source_word: ἀρχιστρατήγῳ δυνάμεως Ἀσσούρ
  choice: 亚述军队的统帅
  rationale: ἀρχιστράτηγος 指最高军事统帅，δύναμις 在此指军队；此译准确而简洁。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但作为固定族群称谓，现代汉语以“以色列人”最自然，且不误解为仅指男性。
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: 已经备战
  rationale: 表达为战争做好准备；“备战”简洁保留军事语境。
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς συνέκλεισαν
  choice: 封锁了山区的道路
  rationale: ὀρεινή 指山区或山地，συγκλείω 在军事语境中指封闭、阻断。
- source_word: ἐτείχισαν πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: 加固了每一座高山的山顶
  rationale: τειχίζω 可指筑墙设防或加固防御；该单数结构具有逐一分配的意义，译作“每一座高山的山顶”既自然又完整。
- source_word: ἐν τοῖς πεδίοις σκάνδαλα
  choice: 在平原上设置了障碍物
  rationale: σκάνδαλα 本可指使人绊倒之物、陷阱或障碍；在军事防御语境中用较宽泛的“障碍物”，避免擅自确定具体设施。
theological_decisions:
- issue: οἱ υἱοὶ Ἰσραήλ 的族群称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 这里是惯用族群名称，并非特别强调男性后裔；“以色列人”准确、自然，也避免制造原文没有的性别限制。
- issue: σκάνδαλα 的军事含义
  choice: 障碍物
  alternative: 陷阱／路障／绊脚物
  rationale: 上下文明确属于防御部署，但具体形态不明；采用宽泛措辞保留原词在此处的语义开放性，不引入其后期神学化的“绊脚石”含义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“统帅”“备战”“封锁”“加固”符合军事语境，同时避免古奥措辞。脚注标记均置于与其内容直接相关之处。
