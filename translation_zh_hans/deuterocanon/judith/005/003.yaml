  to: 他对他们说：“迦南之子啊[a]，请告诉我：这住在山区的是哪一族人[b]？他们住在哪些城中？他们的军力有多大[c]？他们的权势和力量在于什么？谁兴起作他们的王，率领他们的军队？”
  rationale: 作两处轻微修订：以“哪一族人”表达对该群体身份的询问，避免将λαός过度现代化为“民族”；以“作他们的王”对应“兴起……作王”，不将原文未明说的治理动作具体化。其余措辞与脚注均可保留，且脚注锚点完整对应相关词语。
