base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: zh_hans
  text: 他对他们说：“迦南之子啊[a]，请告诉我：这住在山区的是哪一族人[b]？他们住在哪些城中？他们的军力有多大[c]？他们的权势和力量在于什么？谁兴起作他们的王，率领他们的军队？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦南人”。希腊文直译为“迦南之子”。
    reason: lexical_alternative
  - marker: b
    text: “住在山区”直译为“坐在山地”，是表示居住在那里的惯用说法。
    reason: lexical_alternative
  - marker: c
    text: 或译“他们的军队有多少人”或“他们的兵力规模如何”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: 请告诉我
  rationale: ἀναγγέλλω的命令语气要求对方陈明情况；δή加强语气。译作“请告诉我”符合现代汉语表达，其中“请”在此用于提出直接要求，并非削弱军事询问的命令意味。
- source_word: υἱοὶ Χαναάν
  choice: 迦南之子
  rationale: 保留希腊文直译的亲属式族群称呼及呼格语气；实际所指可理解为“迦南人”，故加注说明。
- source_word: ὁ λαὸς οὗτος
  choice: 这是什么民族
  rationale: λαός是作为整体的群体；此处询问山地居民的族属，现代汉语用“民族”比“人民”更自然，同时保持集体单数概念。
- source_word: ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: 住在山区的
  rationale: καθήμενος字面为“坐着”，在这里惯用地表示居住；ὀρεινή指山地区域，译作“山区”简洁自然。
- source_word: τίνες αἱ κατοικοῦσιν πόλεις
  choice: 他们住在哪些城里
  rationale: 按汉语语序重组这一问句，保留对其居住城邑的询问以及κατοικέω所含的定居意义。
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: 他们的军力有多大
  rationale: 在军事侦察语境中，δύναμις指武装力量，πλῆθος询问其数量或规模；“军力有多大”自然且不把含义限制为单纯人数。
- source_word: κράτος καὶ ἰσχύς
  choice: 权势和力量
  rationale: 以两个相近而不完全相同的词保留原文的并列加强：κράτος偏向实际展现的权能或优势，ἰσχύς偏向力量。
- source_word: ἐν τίνι
  choice: 在于什么
  rationale: 该短语询问其权势和力量所依托的基础；“在于什么”既自然，又不擅自明确为军事、经济或其他具体来源。
- source_word: ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: 谁兴起作王治理他们
  rationale: “兴起”保留ἀνέστηκεν的形象；“作王治理他们”表达ἐπʼ αὐτῶν所表示的居上统治关系，而不另行推定其受任方式。
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: 率领他们的军队
  rationale: 准确表达分词ἡγούμενος的率领作用及στρατιά的军队含义。
