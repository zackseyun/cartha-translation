base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: zh_hans
  text: 他们离开了祖先的道路，敬拜天上的上帝，就是他们所认识的上帝[a]。后来，人们把他们从他们的诸神面前赶了出去[b]；他们便逃到美索不达米亚，在那里寄居了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所认识的”也可译作“所认出的”；希腊文既可指认识，也可着重于明确地辨认出来。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里表达得很紧凑，直译近于“他们把他们从他们的诸神面前赶了出去”。驱逐者以及“他们的诸神”具体指谁，原文都没有完全说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: 他们离开了祖先的道路
  rationale: 保留“离开道路”的原文比喻，同时让现代汉语读者能自然理解为离弃祖传的生活与宗教道路；“祖先”也比仅指男性先辈的“父辈”更贴合 γονεῖς 的范围。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 此处明确涉及对上帝的宗教崇拜；“敬拜”比单指身体动作的“俯伏”更准确。
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: 天上的上帝
  rationale: 直译这一圣经中常见的称号，并采用自然、庄重的现代汉语表达。
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: 就是他们所认识的上帝
  rationale: ἐπιγινώσκω 可表示认识或辨认、认出；正文用“认识”保留宽度，不额外加入渐进过程或神学术语，并以脚注说明另一可能侧重。
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: 人们把他们从他们的诸神面前赶了出去
  rationale: ἐξέβαλον 是主动式第三人称复数，但主语未明说；用泛指的“人们”避免误让前一分句中的同一群人成为既驱赶者又被驱赶者。“从……面前”保留 ἀπὸ προσώπου 的表达及原文所具有的压缩与歧义。
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: 他们便逃到美索不达米亚
  rationale: “逃到”准确表达 ἔφυγον 在遭驱逐后逃离的叙事意义。
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: 在那里寄居了许多日子
  rationale: “寄居”保留 παροικέω 所含作为外来者居住的意味；“许多日子”贴近原文时间表达。
theological_decisions:
- issue: 离开祖先的道路并转而敬拜天上的上帝
  choice: 沿用原文“离开祖先的道路”和“敬拜天上的上帝”的叙述范畴
  alternative: 译作“抛弃祖传宗教，归信真神”
  rationale: 替代译法会加入原文没有明说的“宗教”“归信”和“真神”等解释性、教义性措辞；正文保留原文的比喻和神学张力。
- issue: θεῷ ᾧ ἐπέγνωσαν 所表达的认识
  choice: 所认识的上帝
  alternative: 他们所认出的上帝／他们逐渐认识的上帝
  rationale: 原词可带有辨认或确切认识的意味，但经文本身没有明确界定认识的过程；正文采用较宽的“认识”，脚注保留“认出”的可能。
- issue: 驱逐者与“他们的诸神”的所指
  choice: 以泛指主语“人们”呈现驱逐，并保留“他们的诸神”的代词歧义
  alternative: 明确译作“他们的祖先因那些神明而把他们赶走”或采用被动式“他们被赶走”
  rationale: 希腊文是主动式复数动词，但主语在压缩的叙事中没有明说；代词 αὐτῶν 的具体所指也不完全清楚。译文不擅自指定驱逐者，也不把主动式改成明确被动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先的道路”保留原文意象；“寄居”保持历史叙事中的外来者身份意味。避免以教派化的“归信”“异教”等术语解释经文，并用脚注诚实呈现希腊文在认识、主语和代词所指上的含混。
