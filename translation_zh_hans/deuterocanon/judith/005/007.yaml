base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: zh_hans
  text: 他们从前寄居在美索不达米亚[a]，因为他们不愿跟随他们父辈的众神[b]；这些神曾在迦勒底人的土地上出现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们从前以外来者的身份住在美索不达米亚。”希腊语动词含有在异乡寄居或暂住的意思。
    reason: lexical_alternative
  - marker: b
    text: “这些神曾在迦勒底人的土地上出现”也可较平顺地理解为“那些在迦勒底人之地的神”或“这些神源自迦勒底人的土地”。
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: 寄居
  rationale: 既表达居住，也保留作为外来者或暂住者居留的含义；比单说“居住”更贴近原文。
- source_word: τὸ πρότερον
  choice: 从前
  rationale: 自然、简洁地标明相对于叙事当前时点的先前时期。
- source_word: ἐν τῇ Μεσοποταμίᾳ
  choice: 在美索不达米亚
  rationale: 采用该地名在现代简体中文中的通行译名。
- source_word: οὐκ ἐβουλήθησαν
  choice: 不愿
  rationale: 保留 βούλομαι 所强调的意愿和自主选择，同时不强化为原文没有明说的公然反抗。
- source_word: ἀκολουθῆσαι
  choice: 跟随
  rationale: 直接对应原文，也能自然表达宗教上的追随与效忠，不擅自改译为“敬拜”。
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: 他们父辈的众神
  rationale: “父辈”保留 πατέρων 的家族与男性先辈意象；“众神”清楚反映复数 θεοῖς。
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: 这些神是在迦勒底人的土地上出现的
  rationale: 将关系代词明确回指“众神”，并以“出现”保留 ἐγένοντο 不止于静态存在的意味；脚注说明也可能作较平顺的理解。
theological_decisions:
- issue: 如何表达离弃祖传宗教而不加入原文未有的崇拜或论战措辞
  choice: 不愿跟随他们父辈的众神
  alternative: 拒绝敬拜他们祖先的神明
  rationale: 原文使用“愿意”和“跟随”，并未在本节使用“敬拜”；所选译法保留其意志层面的宗教抉择及原有张力。
- issue: 关系从句所指及 ἐγένοντο 的含义
  choice: 这些神是在迦勒底人的土地上出现的
  alternative: 这些神是在迦勒底人的土地上的
  rationale: 希腊文关系代词为阳性复数，最自然地回指“众神”；ἐγένοντο 可按语境弱化为“在”，也可能含“出现、产生”的动态意味，正文保留后者，脚注呈现前者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“寄居”是常见圣经用语，但在现代中文中仍清楚可懂；分号用来避免末尾关系从句误被理解为修饰“父辈”，同时不消除原文对 ἐγένοντο 的语义张力。
