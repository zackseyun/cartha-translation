  text: And why did they refuse to come to meet me[a], unlike all who dwell in the west?
translation:
  language: zh_hans
  text: 他们为什么不肯前来迎接我[a]，不像所有住在西方的人那样？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“他们为什么充耳不闻，以致不来迎接我？”
    reason: 说明κατενωτίσαντο与“耳、听从”有关的字面意象，以及它同后面否定不定式的关系。
lexical_decisions:
- source_word: διὰ τί
  choice: 为什么
  rationale: 引出直接问句，询问他们采取这一行动的原因。
- source_word: κατενωτίσαντο
  choice: 不肯
  rationale: 该词与“耳、听从”有关，在此配合后面的否定不定式，表示不予理会、拒绝照办；“不肯”既自然，又保留其有意不从的意味。
- source_word: τοῦ μὴ ἐλθεῖν
  choice: 前来
  rationale: 表达他们没有来到说话者这里；希腊文没有明确表示“出来”，因此不另行增补。
- source_word: εἰς ἀπάντησίν μοι
  choice: 迎接我
  rationale: ἀπάντησις指前去与来者相会；在征服者要求各地居民出迎的语境中，“迎接我”比单纯“见我”更准确自然。
- source_word: παρὰ πάντας
  choice: 不像所有……的人那样
  rationale: παρά加宾格在这里构成对比，突出他们的做法有别于其余众人。
- source_word: τοὺς κατοικοῦντας ἐν δυσμαῖς
  choice: 所有住在西方的人
  rationale: 忠实保留分词短语及其地理指向，并采用现代汉语中自然庄重的表达。
