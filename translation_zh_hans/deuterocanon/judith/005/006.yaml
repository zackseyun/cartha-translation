lexical_decisions:
- source_word: ὁ λαὸς οὗτός
  choice: 这族人
  rationale: λαός在这里指一个具有共同族源的群体；“这族人”既保留οὗτός的指示意味，也比“这个人民”更符合现代汉语，并与下文的族源陈述自然衔接。
- source_word: εἰσιν
  choice: 是
  rationale: 现代汉语系词不区分单复数；“是”自然连接主语与表明身份、族源的表语。
- source_word: ἀπόγονοι
  choice: 后裔
  rationale: 该词指由先祖繁衍而来的人；“后裔”准确、庄重，也适合这里概括族群渊源的语境。
- source_word: Χαλδαίων
  choice: 迦勒底人的
  rationale: 采用现代中文圣经语境中通行的族名“迦勒底人”；属格用“的”表达其作为祖先群体的关系。
