  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: zh_hans
  text: 荷罗斐尼从他主人的面前出来，召集了亚述军队所有的权贵、将领和监督官，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 叙事性不定过去时，表示荷罗斐尼从主人所在之处出去；“离开”在现代汉语中自然简明。
- source_word: ἀπὸ προσώπου τοῦ κυρίου αὐτοῦ
  choice: 离开他主人面前
  rationale: 保留受闪语影响的“从某人面前”这一宫廷性表达；κύριος在此指人间的上级，因此译为“主人”，避免误解为对上帝的称呼。
- source_word: ἐκάλεσεν
  choice: 召集了
  rationale: 语境是命令一批军政人员前来；“召集”比单纯的“叫”更符合正式的军事叙事，同时不额外限定召集方式。
- source_word: δυνάστας
  choice: 权贵
  rationale: 该词指有权势、地位显要的人；“权贵”既保留权势含义，也适合王廷和军事语境。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 指军队中的领导者；“将领”是自然且不把具体军衔限定得过窄的现代汉语表达。
- source_word: ἐπιστάτας
  choice: 督官
  rationale: 该词指受命监督、管理他人的人员；“督官”保留其监督职能，也与前面的军政职衔相协调。
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: 亚述军队
  rationale: δύναμις在军事叙事中指武装力量或军队，Ἀσσούρ表示其属于亚述；译为“亚述军队”清楚自然。
- source_word: Ὁλοφέρνης
  choice: 荷罗斐尼
  rationale: 按希腊文人名音译，采用简洁、易读的现代汉语形式。
theological_decisions:
- issue: κύριος在此是否作为神圣称号处理
  choice: 主人
  alternative: 主
  rationale: 上下文明确指荷罗斐尼的人间上级；译作“主人”保留从属关系，并避免让读者误以为此处指上帝。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“离开他主人面前”的宫廷语感；职衔依次译为“权贵、将领和督官”，不强行细化原文未说明的具体等级。句末逗号依照所给原文，表示句意在下一节继续。
