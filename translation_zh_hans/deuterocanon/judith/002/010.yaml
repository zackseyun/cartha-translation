  yaml_path: translation/deuterocanon/judith/002/010.yaml
  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: zh_hans
  text: 但你要出征，抢先为我占领他们全部的疆土；他们必向你投降。你要为我把他们留到他们受责罚[a]的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“责备”，或“惩戒”。希腊词ἐλεγμός可指责备、斥责，也可指带有惩罚性质的管教。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出征
  rationale: 这是ἐξέρχομαι的不定过去主动分词，在军事语境中表示出去、启程；译作“出征”自然地表达行动背景，并与随后占领疆土的命令相合。
- source_word: προκαταλήμψῃ
  choice: 抢先……占领
  rationale: 该复合动词兼有“预先、赶在前面”和“夺取、占有”之意；“抢先占领”保留了前缀προ-及军事行动的力度。
- source_word: πᾶν ὅριον αὐτῶν
  choice: 他们全部的疆土
  rationale: ὅριον既可指边界，也可指边境或领土；此处谈军事占领，译作“疆土”比单指界线的“边界”更贴切。
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: 他们必向你投降
  rationale: 动词与反身代词ἑαυτούς合用，意为把自己交出；军事语境中的“投降”简明自然，也保留主动屈服的含义。
- source_word: διατηρήσεις
  choice: 你要为我把他们留到
  rationale: διατηρέω可指保留、保存或看守。译作“把他们留到”既符合后续等待某一日子的语境，也不把原文过度限定为监禁。
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: 到他们受责罚的日子
  rationale: εἰς在此表示延续至某一时点；ἐλεγμός可指责备、斥责或带惩戒性的处分。在征服与处置降民的语境中，“责罚”最能表达其惩处意味，同时脚注保留其他可能。
theological_decisions:
- issue: 军事—司法语境中ἐλεγμός的力度
  choice: 责罚
  alternative: 责备；惩戒
  rationale: 上下文涉及征服及日后处置被征服者，“责罚”能表达威胁中的惩处意味，却不引入特定的末世审判观念。由于该词也可指言语上的责备或纠正性的惩戒，脚注保留这些词义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号连接占领与投降的紧密结果关系，再另起一句表达将降民保留至受罚之日。
