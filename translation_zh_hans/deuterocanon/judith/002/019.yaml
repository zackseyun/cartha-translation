  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: zh_hans
  text: 他本人和他的全军出发上路，要走在尼布甲尼撒王前面，并带着战车、骑兵和他所挑选的步兵，向西方覆盖全地的表面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全大地”。希腊语γῆ既可指某一地域，也可指整个大地；这里的军事语境较适合译作“全地”，但不排除“大地”的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν αὐτὸς καὶ πᾶσα ἡ δύναμις αὐτοῦ εἰς πορείαν
  choice: 他亲自率领全部军队出发，开始行军
  rationale: ἐξῆλθεν与εἰς πορείαν合在军事语境中表示出发上路、开始行军；δύναμις在战车、骑兵和步兵的语境中指军队。中文以“率领”自然表达统帅与全军一同出发，但不把动作强化为已经交战。
- source_word: τοῦ προελθεῖν βασιλέως Ναβουχοδονοσόρ
  choice: 要走在尼布甲尼撒王前面
  rationale: 将目的属格结构译作“要”，并保留προέρχομαι在此可能表示先行或走在前面的空间关系，不进一步解释为替王开路或代表王出征。
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: 覆盖……全地的表面
  rationale: 保留“覆盖”和“地的表面”这一夸张而鲜明的空间图像，不改译为解释性较强的“占领”或“横扫”。γῆ在这里按地域性的军事推进译为“地”，另以脚注保留“全大地”的可能。
- source_word: πρὸς δυσμαῖς
  choice: 西方
  rationale: 该短语表示朝向日落之处，即西方。结合其在句中与“地”相关的位置，译作“西方全地”；也可能理解为单纯修饰行军方向。
- source_word: ἐν ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις αὐτοῦ
  choice: 用他的战车、骑兵和精选的步兵
  rationale: ἐν在这里表达随同或凭借这些兵种铺满地面的方式。“骑兵”是现代汉语对ἱππεῦσι的自然军事称呼；“精选的步兵”保留ἐπιλέκτοις所指经过挑选，而不额外引入现代“特种”或“精锐部队”的概念。
