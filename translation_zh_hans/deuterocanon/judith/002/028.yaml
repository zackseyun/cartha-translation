  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: zh_hans
  text: 于是，对他的恐惧和战栗[a]临到沿海地区的居民，就是住在西顿和推罗的人、住在阿苏尔和奥基纳的人，以及所有住在雅姆尼亚的人；住在阿佐托和阿斯卡隆[b]的人也极其惧怕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恐惧和战栗”也可译作“惧怕和震恐”。
    reason: lexical_alternative
  - marker: b
    text: “阿佐托”是“亚实突”的希腊名称；“阿斯卡隆”是“亚实基伦”的希腊名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: 临到
  rationale: 保留ἐπιπίπτω表示某种强烈感受突然落到人身上的生动表达，同时符合现代汉语叙事习惯。
- source_word: φόβος καὶ τρόμος
  choice: 恐惧和战栗
  rationale: 分别对应φόβος与τρόμος，既传达强烈惊惧，也保留原文并列的两个意象。
- source_word: αὐτοῦ
  choice: 对他的
  rationale: 将属格理解为恐惧所指向的对象；此译法不额外明说恐惧的具体成因。
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: 沿海地区的居民
  rationale: παραλία指海岸或沿海区域；用“沿海地区的居民”自然表达 κατοικέω 加地点宾语的居住含义。
- source_word: Σιδῶνι καὶ Τύρῳ
  choice: 西顿和推罗
  rationale: 采用这两个古代城市通行且易识别的现代中文圣经地名。
- source_word: Ἀσσούρ
  choice: 阿苏尔
  rationale: 按希腊文地名音译，不擅自扩大解释为“亚述”这一较大的地域或帝国。
- source_word: Ὀκεινὰ
  choice: 奥基纳
  rationale: 该地名的确切对应不确定，故按希腊文形式作稳妥音译。
- source_word: Ἰεμνάν
  choice: 雅姆尼亚
  rationale: 采用与通行形式 Jamnia/Yamnia 相应的中文音译，同时保留其专名性质。
- source_word: Ἀζώτῳ
  choice: 阿佐托
  rationale: 依希腊文地名形式音译，不直接以其闪语名称“亚实突”替换；两者关系在脚注交代。
- source_word: Ἀσκάλωνι
  choice: 阿斯卡隆
  rationale: 依希腊文地名形式音译，不直接以其闪语名称“亚实基伦”替换；两者关系在脚注交代。
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: 也极其惧怕他
  rationale: “惧怕他”对应带直接宾语的ἐφοβήθησαν，“极其”保留σφόδρα的强烈程度；“也”使后半句与前文自然衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。长串地点依原文层次排列，并用“就是”引出沿海居民的具体范围；分号保留末一组城市在句法上的转折。地名以通行中文名与贴近希腊文的音译并用，对存在希腊名与闪语名差异的地点以脚注说明。
