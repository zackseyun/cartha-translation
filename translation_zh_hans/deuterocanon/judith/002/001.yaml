  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: zh_hans
  text: 第十八年正月二十二日，在亚述人的王尼布甲尼撒宫中[a]，有话出现[b]，要向全地[c]报复，正如他所说的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫中”原文直译为“家中”或“房屋中”；用于君王时也可指王宫或宫廷。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“有话产生了”或“有话出现了”；按这里的宫廷语境，也可理解为“作出了决定”或“颁下了命令”。
    reason: alternative_reading
  - marker: c
    text: “全地”也可译作“全世界”。希腊词 γῆ 既可指某一地域，也可指大地或世界；这里的上下文较偏向地域意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ, δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: 第十八年正月二十二日
  rationale: 按现代汉语日期表达合并翻译，完整保留年份、月份和日期。
- source_word: ἐγένετο λόγος
  choice: 有话传出
  rationale: 保留“有话产生／出现”的宽泛含义，又符合王宫语境；不直接限定为正式诏令或已经作出的决定。
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒的宫中
  rationale: οἶκος本义为“房屋、家”，用于君王时可指王宫或宫廷；中文译作“宫中”自然且符合此处王室语境，脚注保留更直译的可能。
- source_word: βασιλέως Ἀσσυρίων
  choice: 亚述王
  rationale: 简洁自然地表达“亚述人的王”，不改变其头衔。
- source_word: ἐκδικῆσαι
  choice: 施行报复
  rationale: 表达追讨、报复之意，同时不擅自加入希腊文未明说的反身成分“为自己报仇”。
- source_word: πᾶσαν τὴν γῆν
  choice: 全地
  rationale: 保留γῆ可指土地、地域的表达；上下文偏向政治地域，但脚注注明也可理解为“全世界”。
- source_word: καθὼς ἐλάλησεν
  choice: 正如他所说的那样
  rationale: 贴近原文，并保留所指为尼布甲尼撒先前言语的自然理解。
theological_decisions:
- issue: ἐγένετο λόγος是否应具体译作王室诏令或决定
  choice: 有话传出
  alternative: 颁下了一道命令／作出了决定
  rationale: 原文并未明确使用“诏令”或“决定”等专门词，故正文保留其含义张力，脚注说明语境中的可能理解。
- issue: γῆ在此指地域还是全世界
  choice: 全地
  alternative: 全世界／全地上
  rationale: 叙事语境较支持地域或辖境之意，但原词本身也可泛指大地，因此采用兼具开放性的“全地”，不把范围解释得过窄或过宽。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第十八年正月二十二日”符合中文纪年习惯；“宫中有话传出”刻意避免僵硬直译，也不把含义收窄为正式诏令。所有歧义均在正文标记并由脚注交代。
