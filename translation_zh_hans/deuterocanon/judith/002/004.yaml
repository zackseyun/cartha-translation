  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: zh_hans
  text: 尼布甲尼撒完成自己的谋划[a]后，亚述王尼布甲尼撒就召来他的全军统帅荷罗孚尼；荷罗孚尼的地位仅次于他。王对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋划”也可译作“计划”“决意”；希腊文 βουλή 可涵盖这些意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς συνετέλεσεν
  choice: 他的谋划一完成
  rationale: 将叙事公式与时间从句自然合译，清楚表达前一行动完成后随即发生下一行动；避免生硬保留“事情发生了”。
- source_word: τὴν βουλὴν αὐτοῦ
  choice: 他的谋划
  rationale: βουλή在此可指筹划、计划或决意；“谋划”适合军事政治语境，也保留有意筹策的意味。
- source_word: ἐκάλεσεν
  choice: 召来
  rationale: 在君王命令下属的语境中，“召来”自然体现权威性的传唤，同时不作过度解释。
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: 亚述王尼布甲尼撒
  rationale: 按现代汉语习惯重组同位结构，并明确保留“亚述王”的称号。
- source_word: τὸν Ὀλοφέρνην
  choice: 荷罗孚尼
  rationale: 依中文圣经次经人名的通行音译形式处理该专名。
- source_word: ἀρχιστράτηγον τῆς δυνάμεως αὐτοῦ
  choice: 他的全军统帅
  rationale: ἀρχιστράτηγος指最高层级的军事统帅；δύναμις在此明确指军力。“全军统帅”简洁、自然，并表达其最高军事职衔。
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: 荷罗孚尼的地位仅次于王
  rationale: 将希腊文直译为自然现代汉语，明确这是等级次序，同时不扩大为某种具体行政职务。
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: 王对他说
  rationale: 补明汉语所需的主语“王”，以免连续代词造成歧义；句末冒号表明下文将接直接引语。
