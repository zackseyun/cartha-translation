  yaml_path: translation/deuterocanon/judith/002/023.yaml
  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
translation:
  language: zh_hans
  text: 他击溃了弗得和路德[a]，又掳掠了拉西人的所有众子和以实玛利的众子[b]，就是那些在旷野对面、位于迦勒底人以南的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弗得”也可译作“弗突”，后者采用较为人熟悉的圣经名称译法。
    reason: lexical_alternative
  - marker: b
    text: “以实玛利的众子”也可译作“以实玛利人”。正文保留希腊文的族谱式说法。
    reason: lexical_alternative
  - marker: c
    text: 这里的方位短语十分简略，也可理解为“在旷野前方、位于迦勒底人以南”。其修饰范围也可能仅指紧邻的“以实玛利的众子”。
    reason: alternative_reading
lexical_decisions:
- source_word: διέκοψεν
  choice: 击溃了
  rationale: 该动词本义为“砍开、截断”，用于军事语境时表示以武力摧毁或击败。“击溃”保留强烈的军事含义，同时不擅自断定是屠杀。
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: 弗得和路德
  rationale: 两者是族名或地名，按希腊文音译；“弗得”较贴近 Φούδ，“路德”较贴近 Λούδ。
- source_word: ἐπρονόμευσεν
  choice: 掳掠了
  rationale: 该词指战争中劫取战利品；“掳掠”既自然，又能表达军事劫掠的含义。
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: 拉西斯的众子
  rationale: 原文结构略显生硬，保留“众子”的族谱式族群表达；Ῥασσεῖς 身份不明，故采用音译而不作解释性改写。
- source_word: υἱοὺς Ἰσμαήλ
  choice: 以实玛利众子
  rationale: 直译原文“以实玛利的儿子们”，保留其族谱式民族称谓；也可意译为“以实玛利人”。
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: 住在旷野对面
  rationale: κατὰ πρόσωπον 可表示“在……对面”或“在……前方”；正文保留较宽泛的空间关系，并以脚注说明另一种理解。
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: 迦勒底人以南
  rationale: πρὸς νότον 表示朝南或位于南面；压缩的属格结构自然处理为“迦勒底人以南”，但不进一步推定具体地理范围。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“击溃”呈现军事行动的力度而不扩大为明确屠杀；族名和谱系式称谓尽量贴近希腊文。正文调整修饰语次序，使“所有”清楚修饰以实玛利众子，并保留地理短语本身的含混性。
