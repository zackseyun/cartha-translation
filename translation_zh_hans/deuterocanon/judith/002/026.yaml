  text: And he encircled all the sons of Midian[a], and burned their encampments[b], and plundered their sheepfolds.
translation:
  language: zh_hans
  text: 他包围了所有米甸人[a]，焚烧了他们的营地，又掠夺了他们的牲畜圈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“米甸的众子”，即米甸人。
    reason: lexical_alternative
  - marker: b
    text: 或译“畜栏”。原词指圈养牲畜的围栏或圈舍。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: 包围
  rationale: 该动词指环绕、围住；“包围”在现代汉语中自然地保留了军事行动的含义。
- source_word: πάντας τοὺς υἱοὺς Μαδιάμ
  choice: 所有米甸人
  rationale: 希腊文直译为“米甸的众子”，在这里是族群称谓；译作“所有米甸人”清楚自然，直译形式则收入脚注。
- source_word: ἐνέπρησεν
  choice: 焚烧
  rationale: 该词表示放火烧；“焚烧”简洁庄重，且不额外断言已完全烧毁。
- source_word: τὰ σκηνώματα
  choice: 营地
  rationale: 该复数名词可指帐棚式住处或扎营之处；上下文涉及游牧群体，以“营地”表达其集合含义而不过度限定为单个帐棚。
- source_word: ἐπρονόμευσεν
  choice: 掠夺
  rationale: 该动词表示把财物夺作战利品；“掠夺”符合军事语境。
- source_word: τὰς μάνδρας
  choice: 牲畜圈
  rationale: μάνδρα泛指圈养牲畜的围栏或圈舍，并不只限于羊；“牲畜圈”保留其语义范围。
