  yaml_path: translation/deuterocanon/judith/002/021.yaml
  text: And they advanced from Nineveh a journey of three days to the front of the plain of Baikteileth[a], and they encamped from Baikteileth near the mountain that is at the left hand of upper Cilicia.
translation:
  language: zh_hans
  text: 他们从尼尼微向前行进了三天的路程，来到拜克泰莱特平原前方；他们从拜克泰莱特出发，在上基利家左侧的山附近安营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的斯威特版希腊文抄录在“ἐπʼ ἀρι-”处中断；本句后半依据通常续读的“ἐπʼ ἀριστερὰς τῆς ἄνω Κιλικίας”翻译，意为“在上基利家的左侧”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπῆλθον
  choice: 向前行进
  rationale: 该动词可表示来到、前往或进军；此处描述军队有组织地移动，用“向前行进”既符合语境，也不把动词本身过度军事化。
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: 三天的路
  rationale: 这是以行程时间衡量距离的表达；“行进了三天的路”在现代汉语中自然，并保留原文的计程方式。
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: 来到……平原前面
  rationale: 原意带有“在……面前／正面”的空间图像；译为“平原前面”保留地理方位感，避免简化成仅仅“到平原”。
- source_word: πεδίου
  choice: 平原
  rationale: 在地形描述中，πεδίον最自然地指平原或开阔平地；此处采用明确的地理用语“平原”。
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: 拜克泰莱特
  rationale: 这是地名，按希腊文音译；原节两处存在轻微拼写差异，中文统一译名。
- source_word: ἐπεστρατοπέδευσαν
  choice: 安营
  rationale: 该复合动词明确表示扎营，常用于军队；“安营”简洁、庄重，也符合上下文。
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: 从拜克泰莱特起
  rationale: ἀπό通常表示“从”；原文地理关系略显突兀，译文用“从……起”保留这一方向或起点含义，不擅自改作“在”。
- source_word: πλησίον τοῦ ὄρους
  choice: 在……山附近
  rationale: πλησίον表示靠近，ὄρος为山；“在……山附近”是清楚自然的现代汉语表达。
- source_word: τοῦ ἐπʼ ἀριστερὰς
  choice: 左侧的
  rationale: 抄录文本在ἀρι-处中断，通常续读为ἐπ’ ἀριστεράς，意为“在左边”；译作“左侧”保留相对方位，不推定为“西边”。
- source_word: τῆς ἄνω Κιλικίας
  choice: 上基利家
  rationale: 这是地区名称，直译为“上基利家”，不另行解释其具体疆界。
