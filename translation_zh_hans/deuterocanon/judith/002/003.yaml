  text: And they too decided to destroy all flesh who had not followed the word of his mouth[a][b].
translation:
  language: zh_hans
  text: 他们也决定毁灭所有不听从他口中之言的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“一切血肉”，是圣经中的惯用说法；此处按语境指所有人或全人类。
    reason: lexical_alternative
  - marker: b
    text: “他口中之言”也可译为“他口中的命令”或“他亲口下达的命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: 他们也
  rationale: 既保留 καί 的连接、附加意义，也体现 αὐτοί 的强调作用；在现代汉语中简洁自然。
- source_word: ἔκριναν
  choice: 决定
  rationale: 此处指作出判断或决断；“决定”符合叙事语境，又不把它过度强化为正式的司法判决或诏令。
- source_word: ὀλεθρεῦσαι
  choice: 毁灭
  rationale: 表达使对方灭亡、遭到彻底破坏的意图；“毁灭”力度明确，但不额外强化为“斩尽杀绝”等解释性措辞。
- source_word: πᾶσαν σάρκα
  choice: 一切……血肉之躯
  rationale: 保留“所有肉体／一切血肉”这一圣经惯用语及其严厉色彩；限定成分置于“一切”之后，符合汉语语序。
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: 不听从
  rationale: ἀκολουθέω 本义为“跟从”，但与“话语”搭配时语境含义是遵从；汉语若说“跟从话语”不自然，因此译为“不听从”，同时不把语气加强为“悖逆”。
- source_word: τῷ λόγῳ
  choice: 之言
  rationale: λόγος 可指话、命令或谕令；“言”保留其话语性质，并让上下文传达命令意味，避免将歧义单一化。
- source_word: τοῦ στόματος αὐτοῦ
  choice: 他口中
  rationale: 保留希腊文带有闪语色彩的“他口中之言”意象，在现代中文里仍清楚而庄重。
theological_decisions:
- issue: 非保罗书信语境中 σάρξ 的译法
  choice: 血肉之躯
  alternative: 所有人／全人类
  rationale: 这里的 σάρξ 并非“罪性”等神学隐喻，而是“凡有血肉者”的圣经惯用表达。正文保留血肉意象，脚注说明其所指范围，既不导入保罗式用法，也不消除原文修辞。
- issue: λόγος 在此处是一般“话语”还是“命令”
  choice: 他口中之言
  alternative: 他口中的命令／他亲口下达的命令
  rationale: 上下文很可能带有命令、谕令之意，但 λόγος 本身范围较宽。正文保留“言”的开放性，脚注列出语境性较强的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他们也决定”自然传达原文的附加和强调语气；“他口中之言”略带圣经文体色彩，但含义清楚。正文中的脚注标记与脚注项目一一对应。
