  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: zh_hans
  text: 他召集了自己所有的侍从和权贵，把自己计划中的秘密告诉他们[a]，又亲口把关乎大地的一切恶事说了出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己计谋中的秘密向他们陈明。”这里的“机密”（μυστήριον）指需要保密的事情或秘密计划，并非专门的神学术语“奥秘”。
    reason: lexical_alternative
  - marker: b
    text: “关乎大地的一切恶事”这一句的希腊文较难确定，也可能指他把要加在大地上的一切祸害或恶谋说了出来，而不一定是说大地本身邪恶。
    reason: alternative_reading
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: 召集
  rationale: 这个复合动词指把众人召到一起；“召集”既自然，也保留君王下令聚集众人的意味。
- source_word: θεράποντας
  choice: 侍从
  rationale: θεράπων在宫廷语境中常指贴身服侍者，不必然指奴隶；“侍从”比“仆人”更符合这里的王廷场景。
- source_word: μεγιστᾶνας
  choice: 权贵
  rationale: 该词指地位显赫、权势较高的人；“权贵”简明易懂，也比“官员”更能体现其显贵身份。
- source_word: ἔθετο μετʼ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ
  choice: 把自己谋划的机密告诉他们
  rationale: ἔθετο μετʼ αὐτῶν在此表示与他们分享或向他们陈明此事；μυστήριον是保密事项，βούλη指谋划或计划。“谋划的机密”保留两词之间的关系，同时避免把μυστήριον误解为神学术语。
- source_word: συνετέλεσεν
  choice: 全都说了出来
  rationale: 该动词本义含有完成、彻底做成之意，与“从他口中”连用时，可理解为把事情完整说出；译文保留“全都”的完成意味，并形成自然汉语。
- source_word: πᾶσαν τὴν κακίαν τῆς γῆς
  choice: 有关这地的一切恶事
  rationale: κακία可指邪恶、恶行或祸害，属格τῆς γῆς的关系并不完全明确。“有关这地”避免武断断定是这地本身的邪恶，或是将要施加于这地的灾祸。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 亲口
  rationale: 这是现代汉语表达“从他自己的口中”最自然简洁的方式，也保留他本人直接说出的强调。
