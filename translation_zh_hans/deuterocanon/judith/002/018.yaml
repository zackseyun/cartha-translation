  text: and provisions for every man in abundance[a], and very much gold and silver from the king’s house.
translation:
  language: zh_hans
  text: 又为每个人预备了充足的给养，并有出自王家[a]的大量金银。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“从王的家”。此处也可指王室、王宫或王家的府库。
    reason: 保留 οἶκος 的字面意义及其在语境中可能指涉的范围，避免将正文限定为“王宫”或“府库”。
lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: 粮食
  rationale: 该词指供给、给养，尤其指食物供应；此处用“粮食”自然明确，又不额外限定为军用口粮。
- source_word: παντὶ ἀνδρὶ
  choice: 每个人
  rationale: 原文是单数分配式表达，意为逐一供应；在现代汉语中“每个人”自然地保留这一范围，不必把语境推断出的对象明说为“每个士兵”。
- source_word: εἰς πλῆθος
  choice: 充足
  rationale: 这一短语表示数量丰足；“充足”与“粮食”搭配自然，并保留供应充裕之意。
- source_word: χρυσίον καὶ ἀργύριον
  choice: 金银
  rationale: 原文直接指金与银两种贵金属；“金银”简洁准确，不擅自解释为钱币。
- source_word: ἐξ οἴκου βασιλέως
  choice: 从王宫取出的
  rationale: 原文直译为“从王的家而来”。“王宫”在此处是自然的汉语表达，同时以脚注保留“王室”或“王的库房”等可能理解。
- source_word: σφόδρα
  choice: 极多
  rationale: 该副词在这里加强金银的数量；“极多”清楚体现其强烈程度。
