  source_fidelity: 草稿将 ἐπισιτισμός 译为“粮食”基本可行，但“供应每个人的充足粮食”句法不自然，且使“给养／供应”的名词性结构不够清楚。将 ἐξ οἴκου βασιλέως 直接译作“从王宫取出的”过早限定 οἶκος 为建筑意义的“王宫”，并额外加入“取出”的动作；原文仅说明金银的来源。修订保留“王家”的较宽泛表达，并以脚注说明直译及可能含义。
  naturalness: “又有供应每个人的充足粮食”不符合现代汉语的常用搭配。改作“又为每个人预备了充足的给养”更自然、庄重，也适合承接上下文的省略动词结构。“出自王家”的表达避免不必要地补出“取出”的动作。
  terminology: 以“给养”对应 ἐπισιτισμός，涵盖食物供应而不限定为军事口粮；“每个人”保留 παντὶ ἀνδρὶ 的逐一分配表达，未擅自改为“士兵”；“大量金银”准确传达 σφόδρα 对数量的加强。“王家”对应“王的家”，脚注保留其可指王室、王宫或王家府库的语义范围。
