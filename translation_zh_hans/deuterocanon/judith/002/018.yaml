- from: 又有供应每个人的充足粮食，以及从王宫[a]取出的极多金银。
  to: 又为每个人预备了充足的给养，并有出自王家[a]的大量金银。
  rationale: 修订消除原译的生硬句法，并避免将“王的家”过度解释为“王宫”及补入“取出”的动作。正文以“给养”“每个人”“大量金银”分别传达原文的供应、分配范围和数量强调；脚注保留“王的家”的歧义范围。
  reviewer_model: gpt-5.6-terra
