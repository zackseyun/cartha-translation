  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: zh_hans
  text: 他们的伤者必填满他们的峡谷和山洪沟[a]；一条正在泛滥的河流必被他们的尸体填满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“季节性洪流”或“季节性河道”。希腊语这个词可指雨季形成的急流，也可指承载这种急流的沟道。
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: 受伤的人
  rationale: 该名词指受伤者。“受伤的人”准确自然，不把含义扩大为可能包括死者的“伤亡者”，也不额外强调原文未明说的身份。
- source_word: πληρώσουσιν
  choice: 必填满
  rationale: 保留 πληρόω 将来时的确定语气，并传达充塞峡谷的强烈战争图景。
- source_word: φάραγγας
  choice: 峡谷
  rationale: 该词指峡谷或山间深谷；“峡谷”在现代汉语中明确、自然，也比宽泛的“山谷”更贴近原义。
- source_word: χειμάρρους
  choice: 山洪沟
  rationale: χείμαρρος 可指季节性急流或其河道。“山洪沟”兼顾洪水急流及其沟道的含义，避免“溪流”所带来的平缓意味。
- source_word: ποταμὸς ἐπικλύζων
  choice: 泛滥的河流
  rationale: ἐπικλύζων 描写河流漫溢、泛滥；此译法在现代汉语中自然，并保留洪水般的图景。
- source_word: τοῖς νεκροῖς
  choice: 被他们的尸体填满
  rationale: νεκροί 在此可指死者或尸体；因其作为填满河流之物，“尸体”最符合具体而惨烈的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。句式保留原文两个并列的未来陈述，并以“受伤的人”与“尸体”呈现逐步加重的战争惨景；“山洪沟”辅以脚注，以保留 χείμαρρος 在急流与河道之间的词义张力。
