  text: And I will lead their captives to the ends of all the earth[a][b].
translation:
  language: zh_hans
  text: 我要把他们中被掳的人[a]带到全地[b]的尽头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的被掳状态。”希腊文此词也可按抽象意义理解，指被掳的处境，而非被掳的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文可指“土地”或“地域”，也可指“大地、世界”；此处因“尽头”所表达的广阔范围，译作“全地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: 我要……带到
  rationale: ἄξω是ἄγω的将来时，可表示“带领、带到”。这里以“带到”自然表达把俘虏押往远方的动作，同时不额外限定具体方式。
- source_word: αἰχμαλωσίαν
  choice: 他们被掳的人
  rationale: 该名词既可抽象指“被掳、俘虏状态”，也可集合性地指“被掳的人”。与表示带领的动词及物主代词连用时，具体指被掳者较为自然；译文仍以脚注保留抽象理解。
- source_word: ἐπὶ τὰ ἄκρα
  choice: 到……的尽头
  rationale: 此短语指遥远的边缘或极处。“尽头”是自然、庄重的现代汉语表达，也保留原文所强调的地理广度。
- source_word: πάσης τῆς γῆς
  choice: 全地
  rationale: γῆ既可指“土地、地域”，也可指“大地、世界”。结合“尽头”及上下文中的普世性夸言，正文采用“全地”，同时在脚注说明“全境”的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他们被掳的人”明确呈现集合性名词所指的人群；两个脚注分别保留αἰχμαλωσίαν的抽象义和γῆ的地域义。
