  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
translation:
  language: zh_hans
  text: 你要出发，去迎战西方全境[a]，因为他们不听从我口中的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西方”也可译作“向西”或“朝西”。希腊语ἐπὶ δυσμᾶς既可指西面的地域，也可表示朝西的方向。
    reason: lexical_alternative
  - marker: b
    text: “我口中的话”指亲口说出的命令或谕令。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: 你要出发
  rationale: 该词是ἐξέρχομαι的将来时中间语态形式，在直接命令中带有吩咐意味。“出发”自然表达启程行动，同时不额外强化为具体的军事行军术语。
- source_word: εἰς συνάντησιν
  choice: 迎击
  rationale: 该短语基本义是“出去相迎／相遇”；在本节军事语境中相遇具有敌对交锋之意。“迎击”既符合上下文，也保留主动前往面对对方的动作。
- source_word: πάσῃ τῇ γῇ
  choice: 全境
  rationale: 单数γῇ与πᾶς连用，较自然地指一个地域整体，而不是逐一列举“每一片土地”。“全境”简洁地表达这种集合意义。
- source_word: ἐπὶ δυσμᾶς
  choice: 西方
  rationale: 该短语可表示西面的地域，也可表示朝西的方向。正文用“西方”保持自然，并以脚注保留地域与方向两种理解。
- source_word: ἠπείθησαν
  choice: 他们不听从
  rationale: ἀπειθέω表示不服从、拒绝听从。“不听从”自然表达对命令的违抗，也与后面的“话”顺畅搭配。
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: 我口中的话
  rationale: 保留希腊文“我口中的话”这一强调亲口发言的表达；在语境中，这话具体具有命令或谕令的效力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“西方全境”将土地拟指其居民，保留原文以地域代指其中民众的表达；“迎击”根据军事语境呈现敌对相遇，但未进一步具体化为征服或毁灭。
