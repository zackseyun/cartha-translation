  yaml_path: translation/deuterocanon/judith/002/025.yaml
  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
translation:
  language: zh_hans
  text: 他占领了基利家的疆域，杀尽所有抵抗他的人，又一直来到雅弗[a]的边界，即在南方、与阿拉伯相对的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“雅弗”。这个地点不能确定；有些解释者认为它与另一个较为人们熟知的地名有关，但这里未加校改，而是保留原文。
    reason: alternative_reading
lexical_decisions:
- source_word: κατελάβετο
  choice: 占领了
  rationale: 此处中间语态表示取得并控制一片地域；“占领”符合军事语境，又不额外限定具体作战方式。
- source_word: τὰ ὅρια τῆς Κιλικίας
  choice: 基利家的疆域
  rationale: ὅρια 字面可指边界，和地名连用时也可转指边界以内的地域；此处译作“疆域”较自然，并保留地缘含义。
- source_word: κατέκοψε
  choice: 杀尽
  rationale: 该动词有砍倒、杀戮之意；在军事语境中“杀尽”传达其猛烈程度，也与 πάντας（所有）相应。
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: 所有抵抗他的人
  rationale: 准确表达主动抗拒、对抗他的所有人。
- source_word: ἦλθεν ἕως ὁρίων
  choice: 一直来到……的边界
  rationale: 保留行军所达界限的空间意义；此处将 ὅρια 直译为“边界”比“疆域”更贴切。
- source_word: Ἰάφεθ
  choice: 雅弗
  rationale: 按现存希腊文本音译，不擅自校改为其他较熟悉的地名；地点不确定性留在脚注说明。
- source_word: τὰ πρὸς νότον
  choice: 南面
  rationale: 该短语指向南方的方位或部分；“南面”简洁自然，同时避免过度确定其具体句法归属。
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: 与阿拉伯相对
  rationale: 该地理表达意为面对或位于……对面；“与阿拉伯相对”保留空间关系。
