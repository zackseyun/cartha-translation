  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
translation:
  language: zh_hans
  text: 又吩咐他们预备土和水[a]，因为我要在烈怒中出兵攻打他们；我要使我军队的脚遮满整个大地，并把他们交给我的军队，任其掳掠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “土和水”很可能是征服者要求对方献上的臣服信物。
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: 预备
  rationale: 不定式承接上文的命令序列；“预备”自然且保留原文宽泛含义。
- source_word: γῆν καὶ ὕδωρ
  choice: 土和水
  rationale: 直译这一具体词组，不在正文中把其可能象征的臣服含义直接释出；相关文化背景收入脚注。
- source_word: ἐξελεύσομαι
  choice: 出兵攻打
  rationale: ἐξέρχομαι本义为“出去”，在此军事威胁语境中带有出征攻击之意；译文使汉语明确自然，同时没有增加作战结果。
- source_word: ἐν θυμῷ μου
  choice: 在烈怒中
  rationale: θυμός表示强烈愤怒；“烈怒”符合君王威吓的庄重语域。
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: 踏遍整个大地
  rationale: 原文直为“遮盖大地的整个表面”，并以军队之脚为手段。汉语以“用脚踏遍”自然传达军队遍布大地的夸张意象。
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: 让我的军队用脚
  rationale: δύναμις在军事语境中指军力或军队；保留“脚”的具体意象，并以使役结构与“遮盖”意象自然结合。
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: 把他们交给军队掳掠
  rationale: 两个αὐτοῖς/αὐτούς分别指被征服者和实施掳掠的军队。汉语明确后一个指称，以避免连续代词造成歧义；“交给……掳掠”保留交付任其劫掠的结构。
theological_decisions:
- issue: “土和水”的习语含义
  choice: 正文保留具体词组“土和水”，脚注说明其可能是臣服的象征物。
  alternative: 正文直接译为“臣服的信物”。
  rationale: 希腊文本仅明说“土和水”；保留字面表达可让文化意象保持可见，也不把很可能但并非明说的解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留君王威吓的强烈语气和“军队之脚”所表达的压境意象；适度调整希腊语序，使中文流畅，并在末句澄清代词所指。
