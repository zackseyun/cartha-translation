  verdict: revise
  source_fidelity: 原文的命令结构、第二人称、以及“屠杀和劫掠”的严酷内容均已基本传达。不过，“把他们交出来”在现代汉语中不够明确，容易理解为要求对方自行交出人；而 δοῦναι αὐτοὺς εἰς 更直接是“把他们交付给／交给”某种结局。
  naturalness: “你的眼不可顾惜”虽保留原文意象，但缺少宾语，现代汉语略显突兀；补出“他们”即可既自然又不损失意象。“使他们……遭受”通顺，却比原文的“交付给屠杀和劫掠”多一层解释性改写。
  terminology: “不服从的人”“屠杀和劫掠”“全境”均合乎语境。将“交出来”改为“交给”能更准确表达交付至暴力结局的意思，且不预设具体执行者。
