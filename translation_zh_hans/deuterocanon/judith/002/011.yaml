  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: zh_hans
  text: 至于那些不服从的人，你的眼不可顾惜他们；要在你全境各处把他们交给屠杀和劫掠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντας
  choice: 不服从的人
  rationale: 该词在此指拒不听命、抗命者；译为“不服从”既保留其意志性的抗拒，也符合军事命令的语境。
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: 你的眼不可顾惜
  rationale: 保留原文以“眼”表达怜惜的身体意象；希腊语形式直陈命令般的将来行动，汉语用“不可”自然传达严厉训令。
- source_word: δοῦναι αὐτοὺς εἰς φόνον καὶ ἁρπαγήν
  choice: 要把他们交出来，使他们……遭受屠杀和劫掠
  rationale: δοῦναι εἰς 表示交付某种结局；“遭受”明确他们是屠杀与劫掠的承受者，而不额外指定执行者。
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: 在你全境各处
  rationale: γῆ 可指土地、国土或辖境；此处对统治者发令，译作“全境”自然，“各处”体现 πάσῃ 的遍及范围。
theological_decisions:
- issue: 严酷战争命令的表达
  choice: 直接保留“屠杀和劫掠”
  alternative: 弱化为“杀戮和掠夺”或笼统译作“毁灭”
  rationale: 原文 φόνος 与 ἁρπαγή 明确而强烈，译文不应为缓和伦理张力而淡化其暴力内容。
- issue: “眼不可顾惜”的主体与语气
  choice: 保留第二人称及眼的意象，并用禁令式表达
  alternative: 意译为“你绝不可怜悯他们”
  rationale: 保留原文修辞，同时不把“顾惜”扩展解释成更具神学色彩的“怜悯”。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语；保留“你的眼不可顾惜”这一原文意象，其余句法适度调整，使命令关系和受害者角色清晰。
