revisions:
- from: 大王、全地的主这样说：“看哪，你要从我面前出去，带上那些倚仗自己力量的人，就是十二万步兵，以及十二万匹有骑手的马。”
  to: 大王、全地的主如此说：“看哪，你要从我面前出去；你要带上十二万名倚仗自己力量的步兵，以及十二万匹马及其骑手。”
  rationale: 修订仅改善汉语句法与表达顺畅度：将原稿中可能含混的“那些……的人，就是十二万步兵”改为直接的定语结构，并将“有骑手的马”改为更自然地并列保留马与骑手的说法。人数、王命语气和原文的军事画面均未改变。
