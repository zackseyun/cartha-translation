base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: zh_hans
  text: 大王、全地的主如此说：“看哪，你要从我面前出去；你要带上十二万名倚仗自己力量的步兵，以及十二万匹马及其骑手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 采用现代汉语中庄重、自然的宣告句式，保留王命的正式语气。
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: 大王
  rationale: 简明保留君王的尊号；比“伟大的王”更符合自然汉语的宫廷语体。
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: 全地的主
  rationale: 保留κύριος的主权意味及πάσης τῆς γῆς的普世性宣称；此处是人间君王的自称，并非将他认定为神。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的指示作用和庄重语气，同时为现代读者所理解。
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: 你要从我面前出去
  rationale: 贴近原文的“从我面前出去”，也传达君王差遣臣属离开其御前的场景。
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: 带上
  rationale: 自然表达“与自己一同带去”的意思，避免生硬直译。
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: 那些倚仗自己力量的人
  rationale: πεποιθότας表示信赖、倚仗，不只是体格强壮；译文保留他们依靠自身武力的含义。
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: 十二万步兵
  rationale: 按汉语数词习惯准确表达总数，并明确πεζῶν的军事含义。
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: 有骑手的马
  rationale: 原文明确列出马和骑手，而非只用抽象的“骑兵”，故保留具体画面。
- source_word: μυριάδας δέκα δύο
  choice: 十二万匹
  rationale: μυριάς为一万，十二个一万即十二万；中文“十二万”既自然又直接反映原文计数方式。量词“匹”由所数的马补出。
theological_decisions:
- issue: 人间君王自称中的κύριος
  choice: 主
  alternative: 统治者；主人
  rationale: “主”保留原词的权柄与尊号色彩；上下文清楚表明这是君王的自我宣称，因而不会把该称号默认为神性认定。
- issue: πάσης τῆς γῆς的范围
  choice: 全地
  alternative: 全国；所有土地
  rationale: πάσης使宣称具有普遍范围，“全地”保留“全地/全世界”的张力，不将其缩限为一国疆土。
translation_notes:
  register: 采用现代、庄重而清晰的王命语体。保留“看哪”和“从我面前出去”的正式色彩，同时以“带上”“十二万”等自然现代汉语表达避免过度古雅。
