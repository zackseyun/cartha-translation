  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: zh_hans
  text: 又有一大群各色人等与他们一同出发[a]，多如蝗虫，又如地上的沙；他们人数众多，无法数算。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各色人等”指成分混杂的一群人，可能包括随军同行而不属于正规军队的人；原文没有进一步说明其身份。
    reason: lexical_clarification
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: 一大群各色人等
  rationale: πολύς修饰集合性的实体化形容词ἐπίμικτος，指人数庞大、成分混杂的一群人。“一大群各色人等”既保留群体规模和混合构成，也符合现代汉语表达。
- source_word: συνεξῆλθον αὐτοῖς
  choice: 与他们一同出发
  rationale: 复合动词表示与他人同行而出；“一同出发”忠实表达同行和离开的动作，又不额外加入原文未明说的军事“行军”含义。
- source_word: ὡς ἀκρὶς
  choice: 多如蝗虫
  rationale: 原文以单数集合名词“蝗虫”作数量比喻；汉语补出“多”能自然传达比喻所强调的铺天盖地、数量众多。
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: 又如地上的沙
  rationale: γῆ可指地、土地；“地上的沙”保留意象，并比“地之沙”更符合现代汉语。
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  choice: 他们人数众多，无法数算
  rationale: 这是希腊语以“因其众多而没有数目”表达不可胜数的习语。“人数众多，无法数算”保留因果关系，同时避免生硬直译。
