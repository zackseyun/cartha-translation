  yaml_path: translation/deuterocanon/judith/002/013.yaml
  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: zh_hans
  text: 你也不可违背你的主人的任何一句话；务要完全照我所吩咐你的去执行，不可拖延去做这些事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  choice: 不可违背
  rationale: παραβαίνω在这里指越过、违反上级的话。“违背”既保留命令语境中的严肃意味，也符合现代汉语表达。
- source_word: ἓν τι τῶν ῥημάτων
  choice: 任何一句话
  rationale: ἓν τι具有逐项强调的作用，意思是连一句也不得违反；“任何一句话”自然传达这一分配性语气。
- source_word: τοῦ κυρίου σου
  choice: 你主人
  rationale: κύριος在此指人间的上级，而非上帝。“主人”明确体现从属关系，并避免误解为神圣称号。
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: 切实执行
  rationale: 同根分词与限定动词连用形成强调，表示务必贯彻完成；“切实执行”以自然汉语体现这种加强语气。
- source_word: καθότι προστέταχά σοι
  choice: 完全照着我对你的吩咐
  rationale: καθότι表示严格依照，προστάσσω表示发出命令；此译文保留军事命令中准确遵行的含义。
- source_word: οὐ μακρυνεῖς
  choice: 不可拖延
  rationale: μακρύνω与不定式连用，在这里表示延宕或推迟行动；“不可拖延”准确传达命令的紧迫性。
- source_word: τοῦ ποιῆσαι αὐτά
  choice: 办理这些事
  rationale: 带冠词的不定式说明不得拖延的行动，αὐτά为复数，回指前述吩咐所涉及的各事；“办理这些事”比机械直译为“做它们”更自然。
theological_decisions:
- issue: κύριος在此是对人间上级的称呼，还是神圣称号
  choice: 你主人
  alternative: 你的主
  rationale: 上下文是军事统帅体系中的命令，所指为人，并非上帝；译作“主人”既保留权属关系，也避免赋予该词神圣含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留命令口吻。通过“任何一句话”“完全照着”“切实执行”“不可拖延”依次呈现原文的全面禁止、严格对应、加强执行和紧迫要求；不以生硬的同根重复复制希腊语强调结构。
