  yaml_path: translation/deuterocanon/judith/002/015.yaml
  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: zh_hans
  text: 他照主人所吩咐的，清点了为列阵而挑选的士兵：十二万人[a]；又清点了一万二千名骑马的弓箭手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“十二个一万”，以及“一万又二千”。
    reason: 说明原文两处数词的构成方式；正文按现代汉语习惯合计为“十二万”和“一万二千”。
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: 点数了
  rationale: 保留“计数、数点”的基本含义，同时符合清点军队人数的语境，不把它过度解释为正式征召。
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: 挑选出来的士兵
  rationale: ἐκλεκτούς表示经过挑选的人；ἄνδρας为阳性复数。在明确的军事语境中译作“士兵”自然清楚，又保留其为被选中人员的含义。
- source_word: εἰς παράταξιν
  choice: 列阵作战
  rationale: παράταξις指军队的排列、战阵或战斗队形；“列阵作战”以现代汉语清楚表达其军事用途。
- source_word: καθότι
  choice: 照……所……的
  rationale: 表达其行动与先前命令相一致，相当于“正如、按照”。
- source_word: ὁ κύριος αὐτοῦ
  choice: 他主人
  rationale: 此处κύριος指敖罗斐乃的人间上级，并非上帝；“主人”体现隶属与权威关系，且不引发神性指称。
- source_word: εἰς μυριάδας δέκα δύο
  choice: 共十二万人
  rationale: μυριάς为一万，十二个一万即十二万；按现代汉语通常的计数方式表达。
- source_word: ἱππεῖς τοξότας
  choice: 骑马的弓箭手
  rationale: 该短语兼具骑兵与弓箭手两层意思；此译法通俗明确，不把兵种含义缩减为普通骑兵。
- source_word: μυρίους δισχιλίους
  choice: 一万二千人
  rationale: 数词由一万与二千构成，总数为一万二千；采用现代汉语自然表达。
theological_decisions:
- issue: 非神性军事等级语境中κύριος的译法
  choice: 主人
  alternative: 主；长官
  rationale: 上下文明确指敖罗斐乃的人间上级。译作“主人”既保留权属关系，也避免把此处误读为对上帝的称呼；“长官”虽合军事语境，却比原词更具体。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“点数”“列阵作战”保留军事语境及原文动作；语序略作调整，使“照他主人所吩咐的”自然修饰整项行动。
