translation_notes:
  register: 采用庄重而自然的现代标准汉语。“驮运他们的行装”使第一组运输牲畜与第二组给养牲畜之间的功能区别清楚；分号保留原句两组清单的并列结构。原文疑有抄印形式ἔλαβενν，按通行词形ἔλαβεν理解。
