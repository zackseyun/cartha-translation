  text: And he took camels and donkeys and mules for their baggage[a], a very great multitude, and sheep and cattle and goats for their provisions, of which there was no number[c][b],
translation:
  language: zh_hans
  text: 他又带了极多的骆驼、驴和骡子，用来驮运他们的行装[a]；还带了多得数不清[c]的绵羊、牛和山羊，作为他们的给养[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行装”或译“装备”。原词可泛指整套配备或器具；这里与驮畜连用，可能特别指所运载的行李和装备。
    reason: lexical_alternative
  - marker: b
    text: “给养”或译“供应品”或“预备之物”。这里所列的是牲畜，可能主要指军队的食物供应。
    reason: lexical_alternative
  - marker: c
    text: 直译“它们没有数目”，是指数量多得无法计算。
    reason: idiom_explanation
lexical_decisions:
- source_word: ἔλαβεν
  choice: 带了
  rationale: 这里指为远征带上或调集牲畜；译作“带了”符合叙事语境，也不额外暗示强取。
- source_word: καμήλους καὶ ὄνους καὶ ἡμιόνους
  choice: 骆驼、驴和骡子
  rationale: 按原文逐项列出三类运输牲畜，采用现代汉语通行名称。
- source_word: εἰς τὴν ἀπαρτίαν αὐτῶν
  choice: 用来驮运他们的行装
  rationale: ἀπαρτία可指装备、行装或整套配备；结合骆驼、驴、骡子等驮畜，译文明确其运输用途，同时以脚注保留较宽泛的词义。
- source_word: πλῆθος πολὺ σφόδρα
  choice: 极多
  rationale: 简洁表达πολύ与σφόδρα叠加的强烈数量意味，避免汉语中生硬的“极大的众多”。
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: 绵羊、牛和山羊
  rationale: 准确区分πρόβατα与αἶγας，并以“牛”保留βόας可泛指牛类牲畜的范围。
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: 作为他们的给养
  rationale: παρασκευή本可指预备、供应或装备；在供食用的牲畜清单中，“给养”最符合军事后勤语境。
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: 多得数不清
  rationale: 自然传达原文“没有数目”的惯用含义，即数量不可胜数；脚注说明其直译形式。
