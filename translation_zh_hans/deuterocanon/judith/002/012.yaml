  yaml_path: translation/deuterocanon/judith/002/012.yaml
  text: For as I live[a], and by the power of my kingdom, I have spoken[b], and I will do these things by my hand.
translation:
  language: zh_hans
  text: 因为我指着我的生命，也指着我王国的权势[a]起誓：我已经说了，我必亲手[b]做这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权势”也可译作“威力”或“统治力量”。希腊文κράτος可表示力量、威势或掌权的实力。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“用我的手”或“在我手中”；这里表示由他本人直接施行。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出这句庄严宣告的依据；结合上下文，用“因为”自然承接前文，同时保留其解释性作用。
- source_word: ζῶν ἐγώ
  choice: 我凭着我的永生……起誓
  rationale: 这是誓言用语。汉语若直译为“我活着”不够自然，显明其起誓功能更能传达原文语用。
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: 我王国的权势
  rationale: κράτος表示力量、权能或统治实力；“权势”既适合君王语境，也避免把它缩限为疆域或抽象主权。
- source_word: λελάληκα
  choice: 我已经说了
  rationale: 保留完成时所表达的既成宣告及其当前效力，措辞自然直接。
- source_word: ποιήσω ταῦτα
  choice: 就必……成就这些事
  rationale: 未来时在誓言语境中带有坚定承诺；“成就”比“做”更自然地表达把先前所说之事付诸实现，同时保留复数指代。
- source_word: ἐν χειρί μου
  choice: 亲手
  rationale: 保留“手”的意象，并以现代汉语简洁表达直接、亲自施行的意思。
theological_decisions:
- issue: 王者自我见证式誓言的表达
  choice: 我凭着我的永生，也凭着我王国的权势起誓
  alternative: 我活着，我王国的权势也存在
  rationale: 希腊文是省略式、誓言式结构，不宜机械补成两个陈述句。译文明确其起誓功能，但不把“王国的权势”拟人化为“活着”。
- issue: 行动主体的强调程度
  choice: 就必亲手成就这些事
  alternative: 我必以我的手做这些事
  rationale: ἐν χειρί μου表达直接的个人施行。“亲手”符合现代汉语，并未引入超出原文的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的君王誓言语体。“起誓”为语用层面的必要明示，使省略式希腊文在汉语中清楚自然；两个脚注标记置于相关整句末尾，分别说明“权势”和“亲手”。
