  text: of the strongholds of upper Cilicia. And he took all his forces[a], the foot soldiers and the horsemen and his chariots, and went away into the hill country.
translation:
  language: zh_hans
  text: 上基利家的坚固堡垒[a]。他率领自己的全部军力，就是步兵、骑兵和战车，前往山区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在这里以“上基利家的坚固堡垒”这一残句开头，看来是在接续上一节的意思。
    reason: textual_variant
lexical_decisions:
- source_word: στερᾶς
  choice: 坚固堡垒
  rationale: 此处词形及上下文指设防的坚固据点；译作“坚固堡垒”保留军事含义。现存希腊文本开头是承接上一节的残句，因此不补入原文没有的谓语。
- source_word: ἄνω Κιλικίας
  choice: 上基利家
  rationale: ἄνω在此表示地理上的“上部”；“上基利家”简洁地保留这一地区名称。
- source_word: πᾶσαν τὴν δύναμιν αὐτοῦ
  choice: 自己的全部军力
  rationale: δύναμις在军事语境中指武装力量，且下文列出步兵、骑兵和战车；“全部军力”既涵盖这些兵种，也避免译成抽象的“能力”。
- source_word: πεζοὺς
  choice: 步兵
  rationale: 指徒步作战的士兵；“步兵”是现代汉语中清楚、自然的军事用语。
- source_word: ἱππεῖς
  choice: 骑兵
  rationale: 指骑马作战的人；“骑兵”准确表达其军事类别。
- source_word: ἅρματα
  choice: 战车
  rationale: 在军事语境中指用于作战的车辆；汉语“战车”比单说“车辆”更准确。
- source_word: ἔλαβεν
  choice: 率领
  rationale: 字面有“带上、带走”之意；与“全部军力”搭配时，译作“率领”更符合现代汉语，同时保留他带着全军行动的意义。
- source_word: ἀπῆλθεν
  choice: 前往
  rationale: 表示离开原处而去；结合目的地εἰς τὴν ὀρεινήν，译作“前往”自然明晰。
- source_word: ὀρεινήν
  choice: 山区
  rationale: 该形容词名词化，表示多山之地或山地地区；“山区”简明自然，不把具体地势解释得过细。
