  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: zh_hans
  text: 他渡过幼发拉底河，穿过美索不达米亚，并攻破亚伯罗拿急流[b]沿岸所有地势高的城邑[a]，直到抵达海边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻破”或可译作“挖穿”“掘通”。希腊文动词本义是“挖穿、掘通”；在这里的军事语境中，可能指突破或毁坏城防。
    reason: lexical_alternative
  - marker: b
    text: “亚伯罗拿急流”中的“亚伯罗拿”是按希腊文音译的地名；其确切地理位置尚不确定。
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: 渡过
  rationale: 以“幼发拉底河”为宾语，在行军叙事中表示横渡河流；“渡过”自然且准确。
- source_word: διῆλθεν
  choice: 穿过
  rationale: 该复合动词以“美索不达米亚”为宾语，表达从一个地区中经过。
- source_word: διέσκαψε
  choice: 攻破
  rationale: 本义是“挖穿、掘通”；以城邑为宾语并处于军事语境时，较可能指破坏或突破城防。“攻破”保留行动结果而不把它泛化为彻底摧毁。
- source_word: πόλεις τὰς ὑψηλάς
  choice: 高城
  rationale: ὑψηλάς直译为“高的”。“高城”保留这些城地势高峻或高耸的开放含义，不擅自增添“坚固”之意。
- source_word: χειμάρρου
  choice: 急流
  rationale: χείμαρρος通常指因雨水形成、流势湍急的季节性溪流；“急流”简洁地保留其水文特征。
- source_word: Ἀβρωνᾶ
  choice: 亚伯罗拿
  rationale: 按希腊文音译地名，不对其尚不确定的地理位置作推断。
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: 直到来到海边
  rationale: ἕως加冠词化不定式表示行程终点；“直到来到海边”贴近原文结构，也符合现代汉语。
