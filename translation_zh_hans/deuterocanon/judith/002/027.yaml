  yaml_path: translation/deuterocanon/judith/002/027.yaml
  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: zh_hans
  text: 他下到大马士革平原，正值收割小麦的时节。他放火烧了他们所有的田地，把他们的羊群和牛群尽行毁灭；又掠夺他们的城邑，把他们的平原扫荡一空，并使他们所有的青年男子都倒在刀剑之下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用刀剑之口击杀”；这是表示用刀剑杀死的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: 下到
  rationale: 保留动词由高处往低处行进的方向感，同时符合现代汉语叙事习惯。
- source_word: πεδίον Δαμασκοῦ
  choice: 大马士革平原
  rationale: πεδίον指平坦开阔之地，属格在这里自然理解为地理名称。
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: 正值收割小麦的时节
  rationale: 准确表达这是小麦收割季节；用“正值……时节”自然传达时间背景。
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς αὐτῶν
  choice: 放火烧了他们所有的田地
  rationale: 保留ἐνέπρησεν使某物着火的使役意味，并将ἀγρούς译作耕种的田地。
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: 他们的羊群和牛群
  rationale: 分别体现ποίμνια与βουκόλια所指的两类牲畜，比笼统译作“牲畜”更贴近原文。
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: 把……尽行毁灭
  rationale: 传达“交付于毁灭”的强烈结果；“尽行”体现ἀφανισμός所含彻底除灭的语气。
- source_word: ἐσκύλευσεν
  choice: 掠夺
  rationale: 直接表达夺取战利品、洗劫财物的含义，语体庄重而通俗。
- source_word: τὰ πεδία αὐτῶν ἐξελίκμησεν
  choice: 把他们的平原扫荡一空
  rationale: ἐξελίκμησεν带有如扬场或彻底清除般一扫而空的形象；此译保留其彻底性，也与前面的“田地”有所区分。
- source_word: νεανίσκους
  choice: 青年男子
  rationale: 明确表示年轻男性，不擅自把他们限定为战士。
- source_word: ἐπάταξεν ... ἐν στόματι ῥομφαίας
  choice: 使……倒在刀剑之下
  rationale: 以自然汉语传达以刀剑击杀的结果；原文“在刀剑之口”这一形象性惯用语在脚注中说明。
theological_decisions: []
