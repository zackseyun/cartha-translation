translation:
  language: zh_hans
  text: 他照着大批人众为作战列阵的样式部署他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他命令他们，像大批人众为作战而列阵那样。”希腊语动词“διέταξεν”既可侧重“部署、安排”，也可侧重“命令”；“συντάσσεται”是军事用语，指按队形列阵。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: 编排
  rationale: 此动词可指安排、部署，也可指下令；结合后文的军事列阵语境，“编排”主要表达组织队伍的动作，同时不完全排除命令的意味。
- source_word: αὐτούς
  choice: 他们
  rationale: 作直接宾语，回指上文提到的部队或人员；中文用普通代词即可。
- source_word: ὃν τρόπον
  choice: 正如……一样
  rationale: 该短语表示方式或比较；此译法自然地保留“按照……的方式”的比较关系。
- source_word: πολέμου
  choice: 作战
  rationale: 属格在这里限定列阵的军事用途；“作战”比“战争的”更符合现代汉语，也不把含义缩窄为某一场具体战斗。
- source_word: πλῆθος
  choice: 大队人马
  rationale: 原词泛指众多的人或群体，并未明确使用“军队”一词；“大队人马”既体现人数众多，也适合军事语境。
- source_word: συντάσσεται
  choice: 列阵迎战
  rationale: 该动词在军事语境中指按队形排列或部署；“列阵”对应其军事含义，“迎战”使 πολέμου 所表达的作战用途在中文中清楚自然。
