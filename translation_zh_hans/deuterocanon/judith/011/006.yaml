base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/006.yaml
  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: zh_hans
  text: 如果你听从你婢女的话[a]，上帝就会和你一起圆满完成这事[b]，我主也不会偏离他的谋划。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“依从你婢女所说的。”
    reason: κατακολουθέω既可着重“跟随”，也可表示依从、照着去做。
  - marker: b
    text: 直译：“上帝就会同你完全成就这事。”
    reason: μετὰ σοῦ的基本意思是“同你／和你一起”；正文按现代汉语语序表达，未把它进一步确定为“借着你”或“为你”。
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: 听从
  rationale: 该动词在这里表示跟随、依从。现代汉语用“听从……的话”自然地表达按犹滴所言行事，同时不把它强化为单纯的“服从命令”。
- source_word: λόγοις
  choice: 话
  rationale: 直译为“话”，既保留原文的一般性，也可由上下文理解为劝告或计策。
- source_word: παιδίσκης
  choice: 婢女
  rationale: 该词指年轻的女性仆役。犹滴以谦称自指；“婢女”简洁、庄重，并保留性别和从属身份。
- source_word: τελείως
  choice: 圆满
  rationale: 该副词修饰成就之事，表达完全、彻底达到结果；“圆满成就”在现代汉语中自然，也保留完成意味。
- source_word: πρᾶγμα
  choice: 这事
  rationale: πρᾶγμα泛指事情、事务或行动。“这事”保持原文宽泛，不提前限定为某一具体计划。
- source_word: ποιήσει μετὰ σοῦ
  choice: 与你一同把这事……成就
  rationale: 保留μετά的共同、关联含义，避免擅自确定为“借着你”或“为你”；中文调整语序以求自然。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代标准汉语中清楚而庄重的神称。
- source_word: οὐκ ἀποστεῖται
  choice: 不会偏离
  rationale: 该表达在与属格连用时表示离开、背离或放弃。“不会偏离”保留空间性隐喻及其引申义，不将意思弱化或改判为单纯的“不会失败”。
- source_word: ὁ κύριός μου
  choice: 我主
  rationale: 这里所指是人间上位者何罗孚尼，译作“我主”保留尊称；上下文可避免将其误认作上帝。
- source_word: ἐπιτηδευμάτων
  choice: 谋划
  rationale: 该复数名词可指所从事的行动、追求、企图或筹划。军事语境中“谋划”清楚而不过度具体，也保留可能带有行动意图的含义。
theological_decisions:
- issue: κύριος所指是上帝还是人间主人
  choice: 我主
  alternative: 我的主人
  rationale: 句法与叙事语境表明犹滴以敬称指何罗孚尼，而非称呼上帝；“我主”保留原文称谓的庄重和人物话语中的恭顺姿态。
- issue: 上帝与何罗孚尼谋划之成就的表述
  choice: 保留犹滴话语表层的肯定表达
  alternative: 将其解释为上帝认可何罗孚尼的全部计划
  rationale: 本节是叙事人物犹滴对何罗孚尼所说的话，具有语境中的策略性和潜在双关。译文不应把人物言语提升为神学裁断，也不应消除“这事”“与你一同”等原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对白。“婢女”“我主”保留人物自谦与敬称色彩；“听从……的话”“把这事圆满成就”则避免过分古雅。所有脚注标记均已置入正文。
