base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: zh_hans
  text: 因为我们听说了你的智慧和你内心的机巧[a]；全地[c]都在传说：在整个国度中，唯有你称得上卓越[b]，学识高强，在军旅战事上令人惊叹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心”也可译作“灵魂”或“内在自我”；“机巧”也可译作“谋略”或“巧计”，原文可能兼有聪明与狡黠的意味。
    reason: lexical_alternative
  - marker: b
    text: “在整个国度中”也可理解为“在一切王国中”；原文“国度”为单数，较可能指他的整个国度。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可译作“全境”；原文可指土地、地区或全地，在此类夸饰性的宫廷言辞中范围未必能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: 我们听说了
  rationale: 在当前陈述中自然表达已经听闻且仍与眼前劝说有关的信息。
- source_word: τὴν σοφίαν σου
  choice: 你的智慧
  rationale: 保留 σοφία 的常用含义，指智慧、明达与审慎。
- source_word: τὰ πανουργεύματα τῆς ψυχῆς σου
  choice: 你心中的谋略
  rationale: πανουργεύματα 可指机巧、谋略，也可能带有狡黠意味；ψυχή 在此指产生谋划与意向的内在自我。“心中的谋略”在现代汉语中自然，同时避免把它单纯定为褒义或贬义。
- source_word: ἀνηγγέλη πάσῃ τῇ γῇ
  choice: 全地都传扬说
  rationale: 保留被动传播和广泛传闻的意味；γῆ 可指土地、全地，正文采用符合颂扬语境的“全地”。
- source_word: σὺ μόνος ἀγαθὸς
  choice: 唯有你为人卓越
  rationale: μόνος 的排他强调译作“唯有”；ἀγαθός 此处处于宫廷式赞誉中，“为人卓越”比孤立的“是好的”更符合现代汉语，同时保留对整体品格或才能的称许。
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: 在整个国度中
  rationale: βασιλεία 为单数，较自然地指荷罗孚尼所属国度的全境，而非世上一切王国。
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: 知识渊博
  rationale: 将字面的“在知识上有能力”转为自然而庄重的汉语，表达知识或见识方面的强盛。
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  choice: 在作战的军队中令人惊叹
  rationale: 保留 θαυμαστός 的惊异、赞叹意味，也保留 στρατεύματα 与 πόλεμος 的军事表达，不将其完全化约为抽象的“善战”。
