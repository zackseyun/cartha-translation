base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: zh_hans
  text: 如今，亚基敖在你的议会中所说的那番话，我们已经听见了他所说的话；因为伯图利亚的男子救了他[a]，他便把在你面前说过的一切[b]都告诉了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“保全了他”或“保住了他”；希腊语动词可指保存、保全或使人安全。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你那里所说的一切”；这里可能指他在你面前或你所在之处说过的一切。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: 那番话
  rationale: 此处指亚基敖发言的内容，而非单独一个“字”或抽象的“事情”；“那番话”在现代汉语中自然，并与下文“他的话”相呼应。
- source_word: συνεδρείᾳ
  choice: 议会
  rationale: 指商议事务的正式集会；“议会”保留其议事性质和庄重语体。
- source_word: ἠκούσαμεν τὰ ῥήματα αὐτοῦ
  choice: 我们已经听到了
  rationale: 以“听到了”概括“听见了他的话”，避免汉语中不必要的重复，同时保留说话内容已传到说话者耳中的结果。
- source_word: περιεποίησαντο
  choice: 救了
  rationale: 该动词在此语境中表示保全亚基敖、使他免于死亡或危险；“救了”比直译为“保存”自然，也符合叙事情境。
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: 伯图利亚人
  rationale: 指伯图利亚的居民或守城者；汉语以地名加“人”自然表达该群体，不必机械加入“男人”。
- source_word: ἀπήγγειλεν
  choice: 告诉了
  rationale: 表示把先前所说的内容转告给他人；“告诉了”符合当下叙事语境，较“宣告”自然。
- source_word: παρὰ σοί
  choice: 在你面前
  rationale: παρά加与格在这里可表示处于某人身旁或面前；结合发言场景，“在你面前”自然表达亚基敖是在荷罗孚尼面前所说。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“如今”承接当前论述；以分号呈现先说明获悉消息、再交代原因的句法关系。人名译作“亚基敖”，地名译作“伯图利亚”，保持次经人物与地名的常见汉语音译风格。
