base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: zh_hans
  text: 如今，为免我主落得被逐、徒劳无功[a]，死亡必临到他们[b]；罪已经追上他们；他们每逢做出不当之事[c]，就借着这罪惹他们的上帝发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被逐、徒劳无功”也可译作“被赶出去、无所作为”。两个希腊词分别着重于被驱离和不能成事。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“死亡必落在他们脸上”。正文按汉语习惯译为“死亡必临到他们”。
    reason: lexical_alternative
  - marker: c
    text: “不当之事”也可译作“荒唐事”或“可耻之事”。希腊词可指不合宜、荒谬或道德上骇人的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: 被逐
  rationale: 这个词有“被扔出去、被驱逐”的含义；“被逐”简洁保留了遭排斥或驱离的意味，也符合军事语境。
- source_word: ἄπρακτος
  choice: 一事无成
  rationale: 此词可指不能有所作为或未能取得成果；“一事无成”在现代汉语中自然地表达行动落空，同时不夸大为完全无能。
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: 死亡必临到他们
  rationale: 希腊文直译近于“死亡必落在他们面前／脸上”；这里用汉语惯用表达传达死亡突然临到的力量，并以脚注保留字面形式。
- source_word: κατέλαβε
  choice: 已经追上
  rationale: 动词为不定过去时，描写罪已经临到并攫住他们；“已经追上”既保留动态意象，也表达其后果与当前论证相关。
- source_word: ἁμάρτημα
  choice: 罪
  rationale: 下文明确提到他们惹自己的上帝发怒，因此“罪”保留了原词的宗教和道德分量，没有弱化为一般过失。
- source_word: παροργιοῦσιν
  choice: 惹……发怒
  rationale: 该动词意为激怒或惹怒；明确译出“发怒”在现代汉语中比单说“触犯”更准确自然。
- source_word: ἀτοπίαν
  choice: 不当之事
  rationale: 该名词可指不合宜、荒谬或道德上令人震惊的行为；“不当之事”保留较宽的语义范围，避免擅自强化为特定重罪。
- source_word: ὁ κύριός μου
  choice: 我主
  rationale: 这里是友弟德对荷罗孚尼的敬称，而非对上帝的称号；“我主”保留郑重、古雅而可懂的人际称谓。
theological_decisions:
- issue: ἁμάρτημα应译为具有宗教道德分量的“罪”，还是较宽泛的“过错”
  choice: 罪
  alternative: 过错；冒犯
  rationale: 原句紧接着说这种行为惹“他们的上帝”发怒，因此译作“罪”最能保留其面向上帝的道德含义。
- issue: κύριος在本节是否作为神圣称号处理
  choice: 我主
  alternative: 我的主人；主
  rationale: 说话对象是人类统帅荷罗孚尼，故采用人际敬称，不把该词误解为上帝的称号。
- issue: 关系短语ἐν ᾧ所指的含混性
  choice: 译作“因这罪”，让它回指前面的“罪”
  alternative: 译作“借此”或将它直接并入“不当之事”
  rationale: 语法上最近的先行词是ἁμάρτημα（罪）；“因这罪”保留这一结构，同时不进一步界定罪与“不当之事”之间的精确逻辑关系。
translation_notes:
  register: 采用现代、庄重且通顺的书面汉语。“我主”保留宫廷和军事场景中的恭敬语气；句中分号划分死亡临到与罪追上他们两层陈述。所有原文中的时态张力均予保留：死亡用将来表达，罪则已追上他们。
