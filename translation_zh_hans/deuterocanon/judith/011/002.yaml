base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: zh_hans
  text: 现在，你那住在山区的百姓，若没有轻慢我[a]，我本不会举矛攻击他们；但这些事是他们自己招来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“藐视我”或“侮慢我”。希腊文动词含有把人看得微不足道的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  choice: 你那些……百姓
  rationale: λαός指作为整体的民众；直呼对方时译作“你的百姓”最自然。加入“那些”使后置修饰语在现代汉语中衔接顺畅。
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: 住在山区的
  rationale: ὀρεινή在此作名词，指山地或高地地区；“山区”简明自然，并保留地理含义。
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: 若不是轻慢我
  rationale: φαυλίζω表示把人看得微不足道、轻视或怠慢。“轻慢”兼有轻视与不敬之意，适合庄重而通俗的经文语体。
- source_word: οὐκ ἂν ἦρα τὸ δόρυ μου ἐπʼ αὐτούς
  choice: 我就不会举矛攻击他们
  rationale: οὐκ ἂν ἦρα表达与事实相反的结果；“举矛攻击”既保留举起兵器的画面，也明确ἐπί在敌对语境中的方向。
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: 但这些事是他们自己招来的
  rationale: αὐτοὶ与反身代词ἑαυτοῖς共同强调后果由他们自身造成。“自己招来的”是自然汉语，并保留其自招后果和责任归属。
theological_decisions:
- issue: 末句对责任与后果的明确程度
  choice: 这些事是他们自己招来的
  alternative: 他们自己对自己做了这些事
  rationale: 译文明确保留他们自负其责、自招后果的意思，却不额外解释为神的审判、命运或其他神学机制。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“轻慢”保留原词的轻视和不敬色彩；条件句按汉语反事实表达处理。所有代词关系均依希腊文保留，未补入原文没有明说的神学因果。
