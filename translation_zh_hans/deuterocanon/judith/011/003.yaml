  yaml_path: translation/deuterocanon/judith/011/003.yaml
  text: And now tell me why you fled from them and came to us[a]; for you have come for deliverance.
translation:
  language: zh_hans
  text: 现在告诉我，你为什么逃离他们，来到我们这里；因为你已来到这里，为的是得到拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为求救援”或“为了得救”；希腊文作“进入拯救／救援”（εἰς σωτηρίαν）。
    reason: 保留σωτηρία在具体救援、脱险与较广义拯救之间的词义幅度，并说明εἰς的趋向表达。
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 表示话语转入眼前的询问；“现在”自然、直接。
- source_word: λέγε μοι
  choice: 告诉我
  rationale: 命令式加间接宾语在现代汉语中自然表达为“告诉我”，避免生硬的“对我说”。
- source_word: τίνος ἕνεκεν
  choice: 为什么
  rationale: 该短语询问原因；“为什么”准确保留其因果含义，也符合现代汉语习惯。
- source_word: ἀπέδρας ἀπʼ αὐτῶν
  choice: 逃离他们
  rationale: ἀποδιδράσκω表示逃走、脱离；“逃离”同时保留逃走与离开“他们”两层意思，不额外断定是否成功脱险。
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: 来到我们这里
  rationale: 准确表达朝向说话者一方而来的动作，中文自然清楚。
- source_word: ἥκεις
  choice: 你来这里
  rationale: ἥκω可强调已经来到及当前身处此处的结果；结合汉语语境用“你来这里”表达，避免重复使用较重的完成标记。
- source_word: εἰς σωτηρίαν
  choice: 是来得拯救的
  rationale: σωτηρία既可指现实处境中的救援、脱险，也可有较广的“拯救／救恩”含义。“得拯救”保留这一区间；“是来……的”自然传达εἰς所带的趋向或结果意味。
theological_decisions:
- issue: 叙事语境中σωτηρία的表达
  choice: 得拯救
  alternative: 获得救援；进入救恩；到了安全之地
  rationale: 此处是敖罗斐乃对友弟德所说的话，眼前语境偏向保全性命或获救，但原词仍可承载更广的“拯救／救恩”意味。“得拯救”不把含义缩窄为单纯安全，也不把它专门化为后来的教义术语；脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事口吻。“现在告诉我”保持直接命令的语气；分号体现原文两分句间的解释关系。正文中的“得拯救”有意保留现实救援与较广救恩含义之间的张力。
