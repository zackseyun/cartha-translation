base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: zh_hans
  text: “放心吧！你今夜必能活着度过，此后也必存活。没有人会亏待你；相反，人人都会善待你，如同人一向善待我主尼布甲尼撒王的仆人[a]那样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”。希腊语原词可按语境指“仆人”或“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: 放心吧
  rationale: 这是用于安慰和鼓励的命令式；“放心吧”符合当前语境中对犹滴所作的安全保证，也比生硬的“要有勇气”更自然。
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: 今夜你会平安活下来，今后也会如此
  rationale: ζήσῃ在此不只是一般意义的“活着”，而是保证她安然度过当夜；εἰς τὸ λοιπόν指向此后的时间。译文保留当夜与今后的双重时间范围。
- source_word: ἀδικήσει
  choice: 欺负
  rationale: ἀδικέω可指亏待、侵害或行不义；在保证人身安全与良好待遇的语境中，“欺负”自然且不局限于身体伤害。
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: 反而会善待你
  rationale: εὖ ποιεῖν意为对人好、善待人；汉语无需复制希腊文单数动词的形式，可承接前面的泛指主语“没有人”。
- source_word: καθὰ γίνεται
  choice: 就像……一向受到的待遇一样
  rationale: 该短语表示通常发生或惯常施行的待遇；“一向受到的待遇”自然传达其一般性和惯常性。
- source_word: τοῖς δούλοις
  choice: 仆人
  rationale: δοῦλος可指仆人或奴隶；本节着重王室属员所受的待遇，并未突出其被奴役身份，因此正文采用“仆人”，以脚注保留另一可能。
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: 我主尼布甲尼撒王
  rationale: κύριος在此是对君王的尊称，并非神圣称号；“我主……王”保留了恭敬的宫廷语气。
theological_decisions:
- issue: 王室语境中δοῦλοι的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 原词兼有“仆人”和“奴隶”的语义范围。此处重点是尼布甲尼撒王属员惯常受到的待遇，而非其法律或被奴役身份，故正文用“仆人”，脚注说明“奴隶”这一可能，以免消除原文的社会身份含混性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“放心吧”传达安慰语气；“我主尼布甲尼撒王”保留宫廷式尊称。脚注标记已在正文“仆人”之后标出。
