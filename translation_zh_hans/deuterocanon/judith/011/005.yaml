base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your servant, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: zh_hans
  text: 友弟德对他说：“请听取你女奴的话[a]，容你的婢女在你面前陈说；今夜我绝不向我主[b]谎报[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”所译的希腊词δοῦλη也可译作“女仆”或“婢女”；这里采用较强的身份用语，以保留友弟德自谦时的从属语气。
    reason: lexical_alternative
  - marker: b
    text: “我主”在这里指人间的上位者，也可译作“我的主人”，并非对上帝的称呼。
    reason: referent_clarification
  - marker: c
    text: “谎报”也可译作“说谎”或“报告假话”；原文动词有报告、告知之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδεὶθ
  choice: 友弟德
  rationale: 采用《友弟德传》中通行且庄重的现代中文音译。
- source_word: Δέξαι τὰ ῥήματα
  choice: 请听取……的话
  rationale: δέχομαι在此有接纳、听取其言的意思；“听取”比单纯“听”更能保留接受陈词的语气，也符合中文请求表达。
- source_word: τῆς δούλης σου
  choice: 你女奴的话
  rationale: δοῦλη是δοῦλος的阴性形式，可指女奴或女仆；“女奴”保留较强的身份从属色彩以及友弟德刻意自谦的语气。
- source_word: ἡ παιδίσκη σου
  choice: 你的婢女
  rationale: παιδίσκη可指年轻的女仆或婢女。译作“婢女”既与前面的“女奴”有所区别，也保留女性仆役和谦卑自称的意味。
- source_word: λαλησάτω
  choice: 容……陈说
  rationale: 第三人称命令式在这里表达请求许可；“容……陈说”自然地保留了这一语气，并与正式陈词的场景相称。
- source_word: κατὰ πρόσωπόν σου
  choice: 在你面前
  rationale: 按其惯用义翻译，表示当着对方的面、在其面前说话。
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: 绝不……禀报虚言
  rationale: ἀναγγέλλω有报告、禀告之意，ψεῦδος指谎言或虚假之事；该译法保留报告行为与虚假内容的组合，同时适合对上位者陈词的语境。
- source_word: τῷ κυρίῳ μου
  choice: 向我主
  rationale: κύριος在此指人间的上位者敖罗斐乃，而非上帝；“我主”保留宫廷式敬称和从属语气。
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: 今夜
  rationale: 简洁自然地表达“在这一夜”，并保留明确的时间限定。
theological_decisions:
- issue: 如何翻译友弟德的两个女性自称δοῦλη与παιδίσκη
  choice: 分别译为“女奴”和“婢女”
  alternative: 两者均译为“婢女”或“使女”
  rationale: 原文刻意使用两个不同词语。分别翻译既保留其修辞变化，也不削弱δοῦλη较强的从属身份含义；这些称谓在本节是友弟德面对军事统帅时的自谦措辞，不应自动理解为对其实际法律身份的完整说明。
- issue: 人间对象κύριος的译法
  choice: 我主
  alternative: 我的主人
  rationale: 所指是人间上位者，不是上帝。“我主”可传达尊称和从属意味，又避免把这里的称呼神学化。
- issue: 友弟德关于不说虚言的陈述
  choice: 直译为“今夜我绝不向我主禀报虚言”
  alternative: 解释为她的一切陈述都毫无欺骗，或限定为某种特殊意义上的真实
  rationale: 原文将承诺限定于“今夜”，并使用“禀报虚言”的表述。译文保留这一措辞及其叙事张力，不预先裁定她随后话语的伦理或修辞性质。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。“请听取”“容……陈说”“禀报虚言”体现正式陈词场景；以“女奴／婢女”保留两个希腊女性自称的差异。所有脚注标记均置于其所解释的词语之后。
