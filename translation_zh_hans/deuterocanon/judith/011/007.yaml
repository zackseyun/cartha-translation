base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: zh_hans
  text: “全地之王尼布甲尼撒活着，他的权势也活着！他派你来，使每一个生灵都亨通。[a] 因为不但世人要因着你服侍他，就连田野的走兽、牲畜和天空的飞鸟[b]，也要靠你的力量，为尼布甲尼撒和他的全家而活。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使每一个生灵都亨通”也可译作“使每一个生命得以成就”或“使每一个人兴盛”。这里的“生灵”指生命或活物，不一定专指非物质的灵魂。
    reason: lexical_alternative
  - marker: b
    text: “田野的走兽……天空的飞鸟”是较贴近原文意象的说法；也可通俗地译作“野兽……天上的鸟”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文末句十分紧缩，也可能理解为：“尼布甲尼撒和他的全家要靠你的力量而活。”
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ ... καὶ ζῇ
  choice: 活着……也长存
  rationale: 保留原文重复的宫廷式欢呼或誓言语气；第二处按汉语习惯译作“长存”，以表达王权延续，而不把两处机械地译成同一措辞。
- source_word: βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: 全地之王尼布甲尼撒
  rationale: 属格短语修饰“王”，译作“全地之王”既贴近希腊文结构，也保留这段策略性陈辞中的夸张称颂。
- source_word: κράτος
  choice: 权势
  rationale: 此处指君王实际施行统治的力量；“权势”兼顾政治统治和强盛能力，比单纯的“力量”更符合语境。
- source_word: εἰς κατόρθωσιν πάσης ψυχῆς
  choice: 使每一个生灵都亨通
  rationale: κατόρθωσις含成就、顺遂、兴盛之意；ψυχή在这里更可能指生命或活物，而非专指非物质的灵魂。“生灵”保留范围上的开放性。
- source_word: διὰ σὲ
  choice: 借着你
  rationale: διά接宾格通常表示“因为、由于”；这里也含何乐弗尼作为促成因素的意思。“借着你”在汉语中自然，并保留因果与媒介之间的修辞张力。
- source_word: δουλεύσουσιν
  choice: 服侍
  rationale: 该词可指作奴仆或臣服；在帝王语境中，“服侍”能表达效忠和服役，而不额外限定为财产式奴役。
- source_word: θηρία τοῦ ἀγροῦ
  choice: 田野的走兽
  rationale: 保留原文“田野”的意象，同时用现代读者易懂的“走兽”指野生陆栖动物。
- source_word: κτήνη
  choice: 牲畜
  rationale: 该词泛指人所拥有或饲养的家畜；“牲畜”比仅指牛类的译法范围更合适。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: 这是圣经常见意象；“天空”在现代汉语中清楚自然，又不把οὐρανός在此处神学化。
- source_word: διὰ τῆς ἰσχύος σου
  choice: 靠你的力量
  rationale: διά接属格表示凭借或通过；“靠”准确表达这些活物的生存被归因于何乐弗尼的力量。
- source_word: ζήσονται
  choice: 要……而活
  rationale: 保留ζάω的基本义和原文夸张说法，不擅自扩展为“繁荣”或“存活下来”。
- source_word: πάντα τὸν οἶκον αὐτοῦ
  choice: 他的全家
  rationale: οἶκος可指家室、家族、王室或整个家门。“全家”简洁自然，同时不把范围严格限定为王朝或家仆。
theological_decisions:
- issue: 对尼布甲尼撒普世王权的称颂
  choice: 保留“全地之王”以及“活着……权势也长存”的高调称颂
  alternative: 把这句话弱化为一般性的宫廷恭维，或改写为叙述者认可的普世统治
  rationale: 这是友弟德在故事情境中的策略性言辞。译文应忠实保留其夸张和神学张力，既不替她淡化，也不暗示叙述者认可该宣称。
- issue: πάσης ψυχῆς中ψυχή的含义
  choice: 译作“每一个生灵”
  alternative: 译作“每一个灵魂”或“每一个人”
  rationale: 上下文随即并列人、野兽、牲畜和飞鸟，因此这里很可能广泛指生命或活物；译作“生灵”可避免把它限定为非物质灵魂，也不排除人的含义。
- issue: 末句的修辞压缩与句法关系
  choice: 译作“靠你的力量，为尼布甲尼撒和他的全家而活”
  alternative: 理解为“尼布甲尼撒和他的全家要靠你的力量而活”
  rationale: 希腊文末句结构压缩，词序和格的关系不够明朗。正文依照最直接的主语延续，把走兽、牲畜和飞鸟视为“要活”的主体；脚注保留另一种理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并以直接引语呈现友弟德的宫廷陈辞。保留誓言式重复和夸张语气，但避免古奥措辞；“全地之王”“权势长存”维持王室语域，“生灵”“牲畜”“飞鸟”则便于普通读者理解。
