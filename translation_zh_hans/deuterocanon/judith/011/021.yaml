  yaml_path: translation/deuterocanon/judith/011/021.yaml
  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
translation:
  language: zh_hans
  text: 从大地这端到那端[a]，没有一个女人能像她这样容貌美丽、言谈睿智[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从这片土地的一端到另一端。”希腊语 γῆ 既可指“大地”，也可指“土地、地域”；这里的夸赞似以广义为宜。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在美好的面容和言语的理解力方面。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔστιν τοιαύτη γυνὴ
  choice: 没有一个女人像她这样
  rationale: 以自然现代汉语表达否定存在句，并保留 τοιαύτη 所指的“像她这样、具有这般特质”的意味。
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: 从大地这端到那端
  rationale: 保留原文首尾两端的概括表达，表示遍及全地；γῆ 也可指一片地域，因此附注说明另一译法。
- source_word: ἐν καλῷ προσώπῳ
  choice: 容貌美丽
  rationale: καλῷ προσώπῳ 直指美好的面容；译为“容貌美丽”既准确又符合现代汉语赞语。
- source_word: καὶ συνέσει λόγων
  choice: 谈吐明智
  rationale: σύνεσις 表示理解力、明辨或聪慧，λόγων 指言语；“谈吐明智”兼顾她话语的内容与所显出的见识，且不把它过度解释为抽象的“智慧”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“从大地这端到那端”保留原文的夸张性首尾概括；“容貌美丽，谈吐明智”比生硬的介词结构更符合汉语，同时维持原文对容貌与言语理解力两方面的并列称赞。
