  terminology: “上帝”“律法”“牲畜”均恰当。“凡……不可吃的”准确保留πάντα及禁令的关系；“一概吃掉”清楚表达决定耗用／吃尽这些禁食之物。脚注应避免把该希腊习语断言为字面“扑向”，改以“向……下手”说明其形象性和语境义。
