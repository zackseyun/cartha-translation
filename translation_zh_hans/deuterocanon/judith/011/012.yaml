base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: zh_hans
  text: 因为他们的食物已经吃尽，所有水源也都稀缺了，他们便商议动用自己的牲畜[a]；凡上帝在他的律法中吩咐他们不可吃的，他们也决定一概吃掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要向自己的牲畜下手。”希腊语在这里使用一个形象的说法；在食物断绝的语境中，指转而动用牲畜作为食物。
    reason: 保留ἐπιβαλεῖν τοῖς κτήνεσιν的习语性及其未明说宰杀的表达幅度，同时交代语境所指。
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  choice: 他们的食物已经吃尽
  rationale: ἐκλείπω在此表示食物供应耗尽；用“已经吃尽”自然表达此前逐渐消耗而至匮乏的状态。
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: 所有水源也都稀缺了
  rationale: ἐσπανίσθη表示变得稀少、短缺，而非完全断绝；将πᾶν ὕδωρ译为“所有水源”，更合乎汉语对全面缺水的表达。
- source_word: ἐβουλεύσαντο
  choice: 便商议
  rationale: 该词含有经过考虑、筹划之意；“商议”保留其审议色彩，不仅表达最终决定。
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: 要宰食自己的牲畜
  rationale: ἐπιβάλλω与间接宾语连用，字面近于“下手于、扑向”；在食物耗尽的语境中，是转而把牲畜当作食物。“宰食”明确汉语所需的语境含义，脚注保留原文较形象而未明说宰杀的措辞。
- source_word: κτήνεσιν
  choice: 牲畜
  rationale: κτῆνος指家养、归人所有的动物；“牲畜”准确且为现代普通读者熟悉。
- source_word: διεστείλατο αὐτοῖς ὁ θεὸς τοῖς νόμοις αὐτοῦ μὴ φαγεῖν
  choice: 上帝在他的律法中吩咐他们不可吃的
  rationale: 保留神为命令主体和律法为禁令载体；“在……律法中”自然表达该与格在此的范围或媒介意义。
- source_word: διέγνωσαν δαπανῆσαι
  choice: 他们也决定一概吃掉
  rationale: διαγιγνώσκω表示经过判断而作出决定；δαπανάω本义为耗用、用尽，在禁食对象的语境中指将其吃掉。“一概”承接πάντα，表达全部对象。
theological_decisions:
- issue: 神所颁饮食禁令的表述
  choice: 凡上帝在他的律法中吩咐他们不可吃的
  alternative: 凡上帝在他的律法中禁止他们吃的
  rationale: 原文以“吩咐……不可吃”的结构陈述禁令，并未指明某一条具体律法。所选译法保留命令形式及“他的律法”这一法律—神学框架，不补入具体经文或后来的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“宰食”较凝练，适合经文语体；分号区分两个递进决定。主文中的[a]与脚注对应。
