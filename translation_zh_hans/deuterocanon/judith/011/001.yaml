base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: zh_hans
  text: 荷罗斐乃对她说：“妇人，鼓起勇气吧！心里不要害怕[a]，因为我从未伤害过任何选择[b]服事全地之王尼布甲尼撒[c]的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“你的心不要害怕”。
    reason: lexical_alternative
  - marker: b
    text: “选择”也可译作“宁愿”或“决意”。
    reason: lexical_alternative
  - marker: c
    text: “全地之王”反映说话者的帝国宣称；“地”在别的语境中也可指“土地”或“地域”。
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
  choice: 鼓起勇气吧
  rationale: 该命令式表示振作、勇敢或有信心；“鼓起勇气吧”自然地保留了劝勉的语气。
- source_word: γύναι
  choice: 妇人
  rationale: 希腊文是对成年女性的直接称呼。“妇人”保留其朴素而较庄重的呼格语气，不擅自柔化为尊称。
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: 心里不要害怕
  rationale: 保留原文将惧怕置于内心的表达，同时采用现代汉语自然语序。
- source_word: ἐκάκωσα
  choice: 伤害过
  rationale: κακόω可泛指伤害、亏待或恶待；“伤害”保持宽泛含义，不限定为身体暴力或法律上的侵害。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处为泛指任何一个人；现代汉语用“人”准确表达，不附加男性限定。
- source_word: ὅστις ἡρέτικεν
  choice: 任何选择……的人
  rationale: αἱρέω的完成时在此表示已经作出选择；“选择”清楚自然，“任何……的人”传达ὅστις在本句中的泛指作用。
- source_word: δουλεύειν
  choice: 服事
  rationale: 该词可涉及奴役或臣服，但在王权政治语境中表示为王效力、归顺其统治；“服事”保留从属意味而不过度强化为奴隶身份。
- source_word: βασιλεῖ Ναβουχοδονόσορ
  choice: 王尼布甲尼撒
  rationale: 按汉语王号结构译出，并采用现代中文圣经传统中通行的人名形式“尼布甲尼撒”。
- source_word: πάσης τῆς γῆς
  choice: 全地
  rationale: γῆ可指“地”或“土地”；在此帝王称号中具有普世性的夸张宣称，“全地”既保留这种修辞，也不由译者判定其真实性。
theological_decisions:
- issue: 尼布甲尼撒称号中的普世帝国宣称
  choice: 全地之王
  alternative: 全境之王／全地的王
  rationale: 原文πάσης τῆς γῆς在这里构成帝国式称号，叙述是在呈现说话者的政治宣称，并非认可其真实有效；“全地”保留了原文的普世性张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妇人”有意保留原文直接称呼的力度；“心里不要害怕”保留原文带有闪语色彩的内心表达。三个脚注标记均置于正文相应词组之后，并纠正咨询层脚注标记与内容错位的问题。
