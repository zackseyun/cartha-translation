  text: And her words pleased Holofernes and all his attendants, and they marveled at her wisdom and said,
translation:
  language: zh_hans
  text: 她的话使荷罗孚尼和他所有的侍从都满意。他们对她的智慧感到惊叹，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: 很满意
  rationale: ἀρέσκω在这里表示犹滴的话受到认可、使听者满意；译为“很满意”符合现代汉语，也不额外加入赞同其全部主张的含义。
- source_word: οἱ λόγοι αὐτῆς
  choice: 她的话
  rationale: 贴近λόγοι的字面表达，同时在现代汉语中自然清楚。
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: 使荷罗孚尼和他的所有侍从
  rationale: ἐναντίον本可表示“在……面前”，但与ἀρέσκω连用时表达这些人是感到满意者；汉语用“使……满意”最为自然。
- source_word: θεραπόντων
  choice: 侍从
  rationale: θεράπων在此军事权贵语境中指随侍人员；“侍从”比泛称“仆人”更贴切，也避免暗示奴隶身份。
- source_word: ἐθαύμασαν
  choice: 感到惊叹
  rationale: 表达因钦佩而惊异的正面意味，并保持庄重而自然的语体。
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: 对她的智慧
  rationale: ἐπί加与格在这里指出惊叹所针对或所依据的事物；“对她的智慧感到惊叹”是自然的汉语搭配。
- source_word: καὶ εἶπαν
  choice: 说：
  rationale: 原文引向下一节的直接引语；中文以冒号明确表示下文承接其话语。
