base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: zh_hans
  text: 因此，我这你的婢女既知道了这一切，就逃离了他们。上帝差我来，要同你一起做一些事[b]；全地[c]都要因这些事而震惊，凡听见这些事的人都会如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 也可译作“要与你共同成就一些事”。希腊文说法较宽泛，没有更明确地说明荷罗孚尼在其中扮演什么角色。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可理解为“全世界”，在较窄的语境中则可指“全境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 承接上文并引出推论，保留其因果和逻辑作用。
- source_word: ἡ δούλη σου
  choice: 你的婢女
  rationale: 这是友弟德对荷罗孚尼谦卑而有礼的女性自称；“婢女”既体现阴性形式，也符合宫廷式言语语域。
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: 既知道了这一切
  rationale: 分词表示她先得知上述一切，随后逃走；“既……就……”自然体现先后和因由关系。
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: 从他们面前逃了出来
  rationale: 保留“面前”这一带有闪语色彩的表达，同时以“逃了出来”清楚传达逃离之意。
- source_word: ἀπέστειλέν με ὁ θεός
  choice: 上帝差我来
  rationale: 直接呈现友弟德所宣称的神圣差遣，不替叙述者加以肯定或弱化。
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: 要同你一起做一些事
  rationale: 保留 πράγματα 的宽泛含义和 μετὰ σοῦ 的共同参与意味，不擅自说明荷罗孚尼究竟是伙伴、工具还是受益者。
- source_word: ἐκστήσεται
  choice: 都会震惊
  rationale: 表达强烈惊异，语气庄重而符合现代汉语。
- source_word: πᾶσα ἡ γῆ
  choice: 全地的人
  rationale: γῆ 可指大地、世界或一片土地；正文以“全地的人”使听见和震惊的主体在汉语中自然明确，同时保留原文的宏大范围。
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: 听见这些事
  rationale: 将 αὐτά 明确回指将要做的事；汉语无需机械复制希腊语结构，仍保留听闻这些事便震惊的关系。
theological_decisions:
- issue: 友弟德话语中的神圣差遣宣称
  choice: 直译为“上帝差我来”
  alternative: 译成“我认为上帝差我来”或“据称上帝差我来”
  rationale: 原文以直接引语陈述她的宣称；译文既不应淡化，也不应越过叙事层面替其真实性作判断。
- issue: 荷罗孚尼在“同你一起做一些事”中的角色
  choice: 保留共同参与但角色未定的宽泛说法
  alternative: 明确译为“借着你成就一些事”或“为你办一些事”
  rationale: μετὰ σοῦ 未精确说明其角色，译文应保留这一真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“婢女”保留女性谦称及古代社会语境；整体避免文言化堆叠。“一些事”刻意保留原文 πράγματα 的宽泛性；分号使差遣内容与其引发的普世震惊清楚衔接。
