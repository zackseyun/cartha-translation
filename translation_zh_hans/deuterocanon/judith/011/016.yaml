revisions:
- from: 因此，你的婢女既知道了这一切，就从他们面前[a]逃了出来。上帝差我来，要同你一起做一些事[b]；全地[c]的人听见这些事，都会震惊。
  to: 因此，我这你的婢女既知道了这一切，就逃离了他们。上帝差我来，要同你一起做一些事[b]；全地[c]都要因这些事而震惊，凡听见这些事的人都会如此。
  rationale: 修订恢复 πᾶσα ἡ γῆ 为“全地”，不将其预先解释为“全地的人”，并以“凡听见这些事的人都会如此”自然呈现末尾复数动词及其对“这些事”的回指。为避免无必要增加观察视角，将“逃了出来”改为“逃离了他们”。脚注 a 因正文已不保留“面前”，应锚定在“他们”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:18:12Z'
