base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/014.yaml
  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: zh_hans
  text: 他又派人到耶路撒冷去，说住在那里的人也做了这些事：他们把长老议会所准予的豁免给了那些迁来与他们同住的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豁免”也可译作“释放”、“免除”或“赦免”。希腊语ἄφεσις既可具有法律、社会方面的含义，也可具有道德、宗教方面的含义；这里提到长老议会，较支持行政意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  choice: 派人……去
  rationale: 该动词在此隐含派遣使者或传递消息；现代汉语用“派人……去”自然，也不额外说明所传内容。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷去
  rationale: 表达εἰς所指的前往方向，符合现代汉语地名用法。
- source_word: κατοικοῦντες
  choice: 住在那里的人
  rationale: 直接保留分词所指的当地居住者，语言通俗自然。
- source_word: ἐποίησαν ταῦτα
  choice: 做了这些事
  rationale: 保留“这些事”的回指，不擅自具体化其内容。
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: 那些迁来与他们同住的人
  rationale: μετοικίσαντας表示迁居或移居；“迁来与他们同住”既呈现迁移，也避免引入现代法律意义上的“移民”身份。
- source_word: τὴν ἄφεσιν
  choice: 豁免
  rationale: ἄφεσις可指释放、免除或赦免；在长老议会作出决定的行政语境中，“豁免”较自然，同时以脚注保留其他语义可能。
- source_word: παρὰ τῆς γερουσίας
  choice: 长老议会所准予的
  rationale: γερουσία指由长老组成的治理机构；将παρά表达为该豁免的权威来源，符合汉语句法。
theological_decisions:
- issue: 非祭祀性公共语境中ἄφεσις的含义
  choice: 豁免
  alternative: 释放、免除或赦免
  rationale: 上下文将该项决定与长老议会相连，较倾向行政或社群意义，而非明确指神所赐的罪得赦免；脚注保留其道德—宗教语义的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“派人到……去”保留派遣含义；“长老议会”避免使用可能引发现代政治联想的“元老院”。句中“因为”对应ὅτι，但原文后半句句法较为紧密，译文不进一步消解各动作之间可能存在的语义张力。
