base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: zh_hans
  text: 因此，我主，大人[a]，不要忽略他的话，反要把这话珍藏在心里，因为这话是真的；我们的民族不会受到惩罚，刀剑也不能胜过他们，除非他们得罪他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文连用两个尊称，直译近于“主人，主上”；译作“我主，大人”以保留双重称呼。这里称呼的是何罗斐尼，并非对上帝的称号。
    reason: 说明双重呼格，避免将其误作对上帝的称号。
lexical_decisions:
- source_word: διό
  choice: 因此
  rationale: 表示由上文推出结论，保留原文的逻辑承接。
- source_word: δέσποτα κύριε
  choice: 主人大人
  rationale: 原文叠用两个呼格尊称；译文分别以“主人”和“大人”表达其权威与敬称色彩，不把二者压缩为一个称号，也不把对赫olo弗尼的称呼误解为神圣称号。
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: 不要忽略他的话
  rationale: παρέρχομαι与λόγος连用时指略过、不予理会；此译自然地表达该语境义。
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: 把这话珍藏在心里
  rationale: 保留“放在心中”的意象，同时表达认真接受并牢记的含义。
- source_word: ἀληθής
  choice: 是真的
  rationale: 此形容词说明前述话语真实，直译清楚自然。
- source_word: οὐ ἐκδικάται τὸ γένος ἡμῶν
  choice: 我们的民族不会受到惩罚
  rationale: ἐκδικάται在此与军事失败并列，表示惩罚或报应临到；γένος指犹滴所属的族群，译作“民族”既准确又避免现代“种族”一词可能造成的误解。
- source_word: οὐ κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: 刀剑也不能胜过他们
  rationale: 保留单数集合性“刀剑”的军事意象，并以“胜过”表达κατισχύω的压倒、占上风之义。
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: 除非他们得罪自己的上帝
  rationale: ἐὰν μή在这里提出唯一例外条件；“得罪……上帝”自然表达向上帝犯罪的关系含义。
theological_decisions:
- issue: δέσποτα κύριε是否构成对神的称号
  choice: 译作对赫olo弗尼的双重尊称“主人大人”
  alternative: 压缩为“主上”或按神圣称号译作“主上帝”
  rationale: 叙事语境中受话者是赫olo弗尼。保留两个尊称，同时避免把人物抬升为神。
- issue: 民族受罚和战败与犯罪的条件关系
  choice: “除非他们得罪自己的上帝”统摄受罚与刀剑得胜两项陈述
  alternative: 按表面顺序译作“如果他们不……”，或将其弱化为一般政治判断
  rationale: 原文ἐὰν μή表达例外条件，提出民族遭惩罚和军事失败与得罪上帝之间的神学关联；译文保留这一强烈而有张力的论断，不加解释或缓和。
- issue: ἐκδικάται的惩罚／伸冤语义
  choice: 受到惩罚
  alternative: 被报复；得到伸冤
  rationale: 在“刀剑胜过他们”的平行语境中，指向临到该民族的惩处最为连贯；“得到伸冤”会使方向相反，而“被报复”在现代汉语中较不自然。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主人大人”略带古雅，以保留原文不寻常的双重敬称；其余措辞力求自然。
