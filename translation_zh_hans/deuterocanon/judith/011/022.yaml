  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: zh_hans
  text: 敖罗斐乃对她说：“上帝差遣你在百姓之前先行，实在做得好，为要使权势归在我们手中；但藐视我的主人的人必遭灭亡。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: 实在做得好
  rationale: 保留希腊文对上帝行动的肯定评价；现代汉语中自然、清楚。
- source_word: ἀποστεῖλας
  choice: 把你……差来
  rationale: 将修饰“上帝”的不定过去时分词自然处理为伴随“做得好”的具体行动。
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: 先于你的百姓
  rationale: 表达犹滴在其百姓之前、先行而来的时序和空间意味；“你的”由语境补明所指。
- source_word: τοῦ γενήθηναι
  choice: 使……落在
  rationale: 以目的兼结果的表达传达带冠词不定式，避免僵硬直译。
- source_word: ἐν χερσὶν ἡμῶν
  choice: 落在我们手中
  rationale: 采用自然汉语习语，表达权力归属和控制。
- source_word: κράτος
  choice: 大权
  rationale: 在军事征服语境中指权势、掌控；“大权”比单独的“力量”更符合汉语表达。
- source_word: φαυλίσασι
  choice: 藐视
  rationale: 概括贬低、轻看、视为无足轻重的主动轻蔑意味。
- source_word: τὸν κύριόν μου
  choice: 我主人
  rationale: 此处指敖罗斐乃所效忠的人间君主；译作“主人”避免被误解为对上帝的称呼，同时保留隶属关系。
- source_word: ἀπώλεια
  choice: 灭亡
  rationale: 清楚表达毁灭、败亡的结局，不附加后期神学含义。
theological_decisions:
- issue: κύριος在此处所指是人间统治者还是上帝
  choice: 我主人
  alternative: 我主
  rationale: 上下文中这是敖罗斐乃对其人间上级的称谓；“我主人”明确人身效忠关系，避免神性联想。
- issue: ἀπώλεια是否应作带末世论色彩的术语
  choice: 灭亡
  alternative: 沉沦
  rationale: 原文在此首先是对藐视其主者所受毁灭的威胁；“灭亡”保留力度而不额外导入末世论含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于……等待他们的必是……”自然呈现希腊文后半句将“灭亡”置于显著位置的强调；未添加脚注，因为主要歧义可在正文中兼顾。
