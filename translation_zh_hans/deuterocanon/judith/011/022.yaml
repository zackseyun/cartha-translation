  rationale: 修改仅限于消除不必要的“你的”并调整语序，使汉语更自然，同时保留“在百姓之前”的原文表达，不预断其偏重空间、时序或代表性的细微含义。“为要使”对应带冠词不定式所表达的目的／结果；“必遭灭亡”保留原文后置分句中“毁灭”所承载的威胁。
