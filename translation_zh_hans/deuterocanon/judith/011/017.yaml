base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: zh_hans
  text: 因为你的婢女敬畏上帝，昼夜事奉天上的上帝。现在，我要留在您身边，我主；你的婢女要在夜间出去，到峡谷[a]里向上帝祷告；他会告诉我，他们何时犯了罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “峡谷”也可译作“山谷”或“沟壑”。
    reason: 希腊词 φάραγξ 可指峡谷、山谷或沟壑，具体地形存在词义幅度。
lexical_decisions:
- source_word: δούλη
  choice: 婢女
  rationale: 这是阴性名词，可指女奴或女仆；本句中是友弟德对荷罗孚尼谦卑的自称。“婢女”既保留女性身份和从属语气，也比现代汉语的“女奴”更符合此处恭敬陈辞的功能。
- source_word: θεοσεβής
  choice: 敬畏上帝
  rationale: 直接保留 θεο- 所指的上帝以及敬虔、敬畏之义，表达自然，也不把含义缩减为一般性的“虔诚”。
- source_word: θεραπεύουσα
  choice: 事奉
  rationale: 在以“天上的上帝”为宾语的宗教语境中，θεραπεύω 表示服事、敬奉；“事奉”兼具持续服事和宗教敬拜的意味，而未限定为礼仪活动。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 昼夜
  rationale: 简洁保留希腊文“夜与日”的整体性时间表达，符合现代汉语圣经文体。
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: 天上的上帝
  rationale: 自然呈现属格结构所表达的传统称号，并保留其圣经语感。
- source_word: μενῶ παρὰ σοί
  choice: 我要留在我主这里
  rationale: 表达 μένω 与 παρά加与格所指的留在对方身边或所在之处；结合称呼“我主”，汉语用“这里”更自然。
- source_word: κύριε μου
  choice: 我主
  rationale: 这里是对荷罗孚尼的恭敬称呼，并非对上帝的称号；“我主”保留庄重和从属语气，又不明确强化为所有权意义的“主人”。
- source_word: κατὰ νύκτα
  choice: 每夜
  rationale: κατά加宾格在时间表达中可有逐次、每逢之意；上下文描述她留营期间夜间外出的惯例，“每夜”自然且贴合叙事。
- source_word: φάραγγα
  choice: 峡谷
  rationale: φάραγξ通常指山间狭长低地、沟壑或峡谷；“峡谷”较“山谷”更能保留地形狭深的可能性，同时以脚注注明其他译法。
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: 向上帝祷告
  rationale: 准确表达祷告的指向，符合现代汉语习惯。
- source_word: ἐρεῖ μοι
  choice: 他会告诉我
  rationale: 自然表达将来时和直接告知之意；代词所指依紧接的“上帝”可清楚识别。
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: 他们什么时候犯下自己的罪
  rationale: 保留 πότε 的时间疑问/间接疑问意义，以及“他们的罪”这一归属表达；不擅自解释该罪的具体内容。
theological_decisions:
- issue: 友弟德以 δούλη 自称时应译为女奴还是婢女
  choice: 婢女
  alternative: 女奴
  rationale: δούλη确可表示女性奴隶，但此处主要发挥宫廷式谦称的语用功能。译作“婢女”保留从属和女性身份，又不在原文未强调法律身份之处过度突出奴隶制含义。
- issue: θεραπεύουσα 是否应专译为敬拜
  choice: 事奉
  alternative: 敬拜
  rationale: 该词在这里具有宗教服事的含义，但范围可能包括持续敬奉而不只是礼仪性的敬拜。“事奉”保留较宽的语义和原句“昼夜”的持续性。
- issue: 上帝告知犯罪时刻的陈述
  choice: 他会告诉我，他们什么时候犯下自己的罪
  alternative: 他会告诉我，他们何时犯了罪
  rationale: 保留友弟德话语中上帝直接启示的宣称及其叙事张力，不对其真伪或实现方式添加解释；“自己的罪”也保留 αὐτῶν 的归属意味。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。以“婢女”“我主”呈现友弟德恭敬而策略性的陈辞；神名统一作“上帝”。正文只在确有地形歧义处加注，避免用脚注重复已由正文自然表达的 δούλη 语用判断。
