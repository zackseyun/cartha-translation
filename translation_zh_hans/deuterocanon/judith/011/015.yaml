  verdict: revise
  source_fidelity: 译文总体把握了将来情形、向他们报告、他们采取行动、被交付给“你”以及“那一天”的时间限定。可是“任你毁灭”带有“允许你如此做”的许可意味，未能恰当表达 εἰς ὄλεθρον 所标示的交付目的／结果；改为“交给你毁灭”更直接保留原文的被动交付与毁灭结果。
  naturalness: “事情将是这样”在现代汉语中自然可懂。“一旦……，……，……”比“等他……，他们……，那一天……”更清晰地表达未来未定条件，并使句子衔接更顺畅。
  terminology: “报告”“交给”“毁灭”均适合本节叙事语境。保留“毁灭”可对应 ὄλεθρον，避免将其缩窄为某一种具体结局。
