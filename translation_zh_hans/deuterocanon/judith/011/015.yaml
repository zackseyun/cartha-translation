  - severity: low
    issue: 脚注中的“他们一照着做”及“他们做了”不够准确自然。
    rationale: 前者缺少“去”而略显不完整；后者以完成式“做了”表达希腊语未来不定条件中的虚拟式，不如“他们做／他们照着去做”稳妥。
