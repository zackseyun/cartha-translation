- from: 事情将是这样：[a]等他向他们报告，他们照着去做，那一天，他们就必被交给你，任你毁灭。
  to: 事情将是这样：[a]一旦他向他们报告，而他们照着去做，他们就在那一天被交给你毁灭。
  rationale: 修订仅调整条件连接方式、将“任你毁灭”改为“交给你毁灭”，并校正脚注措辞。这样更准确反映希腊文的未来条件、将来被动和 εἰς ὄλεθρον 的目的／结果关系，同时保持现代标准汉语的庄重叙事语体。
