  yaml_path: translation/deuterocanon/judith/011/015.yaml
  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: zh_hans
  text: 事情将是这样：[a]一旦他向他们报告，而他们照着去做，他们就在那一天被交给你毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他向他们报告，而他们照着去做时……”。希腊语 ὡς ἂν 与虚拟式动词连用，可表示未来不定的条件或时间；“照着去做”更直译可作“他们做”。
    reason: 保留 ὡς ἂν 的未来条件／时间含义，并说明 ποιήσωσιν 的宽泛词义。
lexical_decisions:
- source_word: ἔσται
  choice: 事情将是这样
  rationale: 这是 εἰμί 的将来时，在此惯用地引出未来将发生的情形；译文保留其提示作用，同时符合现代汉语表达。
- source_word: ὡς ἂν
  choice: 等
  rationale: ὡς ἂν 与两个虚拟式动词连用，表示尚未确定但预期将实现的未来条件或时点；“等”自然传达“当……之后/一……就”的关系，同时不把时间先后说得过死。
- source_word: ἀναγγείλῃ
  choice: 他向他们报告
  rationale: 该动词可指报告、宣布或告知；“报告”符合传递消息的语境。原文宾语省略，译文也不另行补明具体内容。
- source_word: ποιήσωσιν
  choice: 他们照着去做
  rationale: ποιέω 本义宽泛，可译“做”；此处没有明说宾语。“照着去做”以自然汉语表达他们按所报告之事采取行动，但不具体增添行动内容。
- source_word: δοθήσονταί σοι
  choice: 他们就必被交给你
  rationale: 保留 δίδωμι 将来被动式及 σοι 的与格关系；“被交给你”也体现其敌对处境。
- source_word: εἰς ὄλεθρον
  choice: 任你毁灭
  rationale: ὄλεθρος 表示毁灭或败亡；结合“被交给你”，此译自然表达交付的结果或目的。脚注说明更贴近形式的译法。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 标准时间短语，采用简洁自然的现代汉语表达。
