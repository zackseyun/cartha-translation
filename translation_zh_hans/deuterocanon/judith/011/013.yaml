base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: zh_hans
  text: 粮食的初熟之物，以及酒和油的十分之一，他们原已存留下来，分别为圣，归给那些在耶路撒冷侍立在我们上帝面前[a]的祭司；他们却决定把这些耗用掉，尽管百姓中任何人甚至用手触碰这些东西都是不可以的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我们上帝的面容之前”，意指处在上帝的临在中。
    reason: lexical_alternative
  - marker: b
    text: “不可以”也可译作“不合宜”或“不应当”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  choice: 粮食的初熟之物
  rationale: ἀπαρχή指从收成中首先分别出来献上的部分；σῖτος在此可泛指粮食，不限定为小麦。“初熟之物”保留祭祀语境，也为普通读者所能理解。
- source_word: τὰς δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  choice: 酒和油的十分之一
  rationale: δεκάτη是献纳的“十分之一”。直译比“什一奉献”更自然，也避免加入后来的固定术语色彩。
- source_word: ἐφυλάξαν
  choice: 原已存留下来
  rationale: φυλάσσω在这里指为神圣用途留存、保守这些出产；“存留下来”既表达保留，又不把其含义过度限定为单纯储藏。
- source_word: ἁγιάσαντες τοῖς ἱερεῦσιν
  choice: 分别为圣，归给……祭司
  rationale: 分词表示这些东西已被分别作神圣用途，间接受词表明其归于祭司使用。“分别为圣”保留明确的礼仪性质。
- source_word: τοῖς παρεστηκόσιν
  choice: 侍立
  rationale: 原词字面为“站在旁边、站立”，在圣殿语境中也含供职之意。“侍立”兼顾具体姿态和祭司事奉的语境。
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: 在我们上帝面前
  rationale: 希腊文较直译为“在我们上帝的面容之前”，是强调处于上帝临在中的闪族式表达；正文用自然汉语表达，并以脚注保留原文形象。
- source_word: κεκρίκασιν ἐξαναλῶσαι
  choice: 如今他们却决定把这些全都耗用掉
  rationale: κεκρίκασιν表示已经作出决定；ἐξαναλίσκω含彻底耗尽、用尽之意。“全都耗用掉”适用于酒、油和粮食等物，也保留前缀所加强的完全性。
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι
  choice: 甚至用手触碰这些东西都是不可以的
  rationale: καθήκω可表示合宜、应当或获准；礼仪禁令的语境使“不可以”自然，但脚注保留“是不合宜的”这一较弱可能。原文强调“用手”，故予以保留。
- source_word: οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: 百姓中任何人
  rationale: 此语将一般百姓与祭司区分开来。“百姓中任何人”准确表达范围，又不增添阶级性的解释。
theological_decisions:
- issue: 留给祭司之出产的礼仪地位
  choice: 译作已经“分别为圣，归给”祭司，并说明普通百姓不可触碰。
  alternative: 可较宽泛地理解为仅仅为祭司留存，未必经过正式的奉献。
  rationale: ἐφυλάξαν、ἁγιάσαντες、祭司身份以及不可触碰的限制共同表明这些物品具有神圣用途；译文不进一步界定具体礼仪程序。
- issue: καθῆκεν所表达的规范力度
  choice: 正文译为“不可以”。
  alternative: 也可译为“不合宜”或“不应当”。
  rationale: 上下文涉及分别为圣之物，具有实际禁令的力度；但原词本身也可指合宜与否，因此在脚注中保留其语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“侍立”“分别为圣”保留圣殿礼仪语域；句子依照希腊文的长句关系组织，以分号划分献物的既定用途与后来作出的决定，并用“却”呈现语境中的反差。
