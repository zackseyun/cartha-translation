  yaml_path: translation/deuterocanon/judith/011/018.yaml
  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: zh_hans
  text: 我一来到[a]，就必先为你开路；你将带着你的全部军力出动；他们中没有一人能抵挡你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我会预先为你打开（道路）。”希腊文动词可指“预先打开”；其宾语在原文中没有明说，“道路”是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: 我到了以后
  rationale: 这是阴性单数不定过去时分词，所指为友弟德；译作时间从句，既符合现代汉语，也保留先到达、继而行动的顺序。
- source_word: προανοίσω
  choice: 就会在你前面开路
  rationale: 该复合动词含预先或在前面打开之意；希腊文未明说宾语，中文补出语境隐含的“路”，使军事推进的表达自然明白。
- source_word: ἐξελεύσῃ
  choice: 你将……出征
  rationale: 基本义为“出去”；在率领全部军力的军事语境中，“出征”自然地表达出动，但不额外限定具体战术。
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: 率领全部军力
  rationale: δύναμις在此可兼指力量和军队；“军力”既贴合军事语境，也比“全军”更能保留力量层面的含义。介词短语在中文中自然处理为“率领”。
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: 没有一人能抵挡你
  rationale: 保留ἀνθίστημι“站立抵抗、抵挡”的具体军事意味；“能”在汉语中自然表达无人足以抗拒的结果。
- source_word: ἐξ αὐτῶν
  choice: 他们中
  rationale: ἐκ在这里是部分用法，表示该群体之中没有任何一人。
