base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: zh_hans
  text: 现在，你容貌美丽，言谈也得体。你若照你所说的去做，你的神就会成为我的神[a]；你必在尼布甲尼撒王家中居住，并且闻名全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神”也可理解为专指“上帝”。希腊文的书写不以大小写断定此处所指；何乐弗尼的话可以泛指友弟德所敬奉的神明，也可理解为他声称接受以色列的上帝。
    reason: 保留θεός的指称歧义，以及异教说话者的背景与认信式措辞之间的张力。
lexical_decisions:
- source_word: ἀστεία
  choice: 美丽
  rationale: 该词可指雅致、讨人喜欢；在“容貌”这一限定下，重点是外表美好，译作“美丽”自然且符合称赞的语气。
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: 言谈也得体
  rationale: 直译为“在言语上是好的”。“言谈得体”以现代汉语表达对友弟德言辞的肯定，并与前面的容貌称赞保持平行。
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: 你若照自己所说的去做
  rationale: 保留条件句中言语与行动之间的明确对应，表达自然。
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: 你的神就会成为我的神
  rationale: θεός本身既可泛指神明，也可在语境中专指上帝；用“神”保留何乐弗尼的异教视角及其话语可能产生的圣约式回响，不替读者消除张力。
- source_word: καθιῇ ἐν οἴκῳ
  choice: 住在……宫中
  rationale: καθιῇ字面可指“坐”，与王的οἶκος连用时表示在王家或王宫中居住、占有地位；“住在……宫中”符合现代汉语。
- source_word: ὀνομαστὴ παρὰ πᾶσαν τὴν γῆν
  choice: 闻名全地
  rationale: 简洁保留“全地”的广阔范围和夸张修辞，也符合庄重叙事语体。
theological_decisions:
- issue: 何乐弗尼所说θεός是泛称“神”还是专指“上帝”
  choice: 你的神就会成为我的神
  alternative: 你的上帝就会成为我的上帝
  rationale: 希腊文的字形不能凭大小写决定此处含义；说话者是异教将领，而措辞又可能让读者联想到对以色列上帝的认信。正文采用“神”，脚注说明另一理解，以保留这层神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“容貌美丽，言谈也得体”保持原文的平行称赞；“宫中”和“闻名全地”兼顾王室语境与原文修辞。专名采用现代中文常见译名“尼布甲尼撒”，人物语境按《友弟德传》处理。
