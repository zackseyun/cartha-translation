base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: zh_hans
  text: 我必领你穿过犹太地的中央，直到你来到耶路撒冷对面[a]；我必把你的战车安置在耶路撒冷城的当中。你必赶着他们，如同没有牧人的羊；在你面前，连一条狗也不会向你龇牙低吼[b]。因为这些事，我早已知道[c]，也有人向我报告过；我奉差遣来告诉你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路撒冷对面”也可译作“耶路撒冷前面”或“面对耶路撒冷的地方”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“连一条狗也不会用舌头向你低吼”，是形容完全无人抵抗的说法。
    reason: cultural_note
  - marker: c
    text: 原文此处直译为“按着我的预先所知”；指事先知道或预先获得的信息，不一定是后世神学意义上的“预知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: 我必领你
  rationale: 采用“领”体现说话者亲自引导对方前行，比宽泛的“带”更贴近此处语境。
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: 穿过犹太地的中央
  rationale: 保留希腊文“从……中间穿过”的空间形象，同时使用自然的现代汉语。
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: 直到来到耶路撒冷对面
  rationale: ἀπέναντι表示“在对面、面对着”，此译法不擅自解释为进入耶路撒冷。
- source_word: θήσω τὸν δίφρον σου
  choice: 我必把你的战车安置
  rationale: δίφρος在军事语境中可指战车；“安置”保留有意设置其位置的含义。
- source_word: ἐν μέσῳ αὐτῆς
  choice: 在城中
  rationale: 代词所指为耶路撒冷；汉语用“城中”清楚自然，也避免含混。
- source_word: ἄξεις αὐτοὺς
  choice: 你必赶着他们
  rationale: 后接羊群比喻，“赶着”比单纯“领着”更能表现驱赶毫无抵抗者的图景。
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: 如同没有牧人的羊
  rationale: 直译并保留圣经中领袖缺失、群体脆弱的意象。
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ
  choice: 连一条狗也不会伸舌低吼
  rationale: γρύζω偏指低吼或咕哝而非普通犬吠；保留“舌头”这一显明但特殊的原文表达。
- source_word: κατὰ πρόγνωσίν μου
  choice: 按着我预先所知的
  rationale: 以非术语化汉语表达“预先知道、事先获知”，避免自动引入后世关于“预知”的教义含义。
- source_word: ἀπηγγέλη μοι
  choice: 又传报给了我
  rationale: 保留被动语态所表达的信息由他者传达给犹滴。
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: 我奉差遣来把这一切告诉你
  rationale: “奉差遣”体现被派遣的被动含义，“告诉你”自然表达ἀναγγέλλω的报告或宣告义。
theological_decisions:
- issue: πρόγνωσις在犹滴话语中的含义
  choice: 译作“我预先所知的”，理解为事先知道或预先获得的信息
  alternative: 特殊启示；预感；具有教义含义的“预知”
  rationale: 上下文是犹滴对荷罗孚尼的策略性陈述，声称自己事先知道并且得到传报。译文保留她的知识宣称及其张力，却不替读者判定信息来源或赋予后世神学术语义。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。保留原文的空间意象、无牧人之羊的比喻和狗低吼的特殊表达；在“预先所知”处避免术语化，同时借脚注保存词义范围。
