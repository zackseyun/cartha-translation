  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: zh_hans
  text: 全体会众当中响起了巨大的哭声；众人同心合意地高声向主上帝呼求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: 顿时一片
  rationale: 结合后面的名词性表达译成自然的叙事起始语，传达某种情形发生、出现，而不机械译作“事情发生了”。
- source_word: κλαυθμὸς μέγας
  choice: 大哭
  rationale: κλαυθμός指哭泣、哀哭；“大哭”既保留μέγας所表达的强烈程度，也符合现代汉语习惯。
- source_word: ἐν μέσῳ τῆς ἐκκλησίας
  choice: 会众中
  rationale: 保留“在……当中”的群体范围；ἐκκλησία在本叙事中指聚集的民众，并非后世制度意义上的“教会”。
- source_word: πάντων
  choice: 全体／众人
  rationale: 以“全体会众”和后句“众人”体现范围的周遍性，同时使汉语行文清楚自然。
- source_word: ὁμοθυμαδόν
  choice: 同心合意
  rationale: 表达众人一致、共同采取行动的意思，并保留原文强调的群体同心。
- source_word: ἐβόησαν
  choice: 呼求
  rationale: 该动词在以神为对象的语境中表示迫切地大声呼喊；“呼求”兼具发声与求告之意。
- source_word: πρὸς Κύριον τὸν θεὸν
  choice: 向主上帝
  rationale: 按语境将κύριος译为“主”，并将同位性的τὸν θεόν自然合译为“主上帝”。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 用现代汉语惯用表达准确传达声音洪亮、强烈。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主／主人
  rationale: 这里κύριος指向上帝；“主”既准确又符合现代汉语宗教文本的通行表达，不将其弱化为一般人际称谓“主人”。
- issue: ἐκκλησία的译法
  choice: 会众
  alternative: 集会／教会
  rationale: 本处指聚集在一起的全体民众。“会众”保留群体含义，又避免用“教会”引入较晚的基督教制度联想；“集会”也可能指聚集这一事件，故列为脚注替代译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“顿时一片大哭”呈现叙事现场感；分号保留哭泣与向上帝呼求这两个紧密相连的动作。
