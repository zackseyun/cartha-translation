base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/024.yaml
  text: May God judge between you and us[a], because you have done us great injustice by not speaking peaceably with the sons of Asshur.
translation:
  language: zh_hans
  text: 愿上帝在你们和我们之间判断[a]，因为你们没有同亚述的子孙和平地交谈，对我们行了大不义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚述的子孙”也可译作“亚述人”。希腊文直译为“亚述的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: 愿……施行判断
  rationale: 不定过去时祈愿式表达愿望或带有责令意味的呼求；“愿上帝……施行判断”自然保留其祈愿语气。
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: 在你们和我们之间
  rationale: 这是请求裁断双方是非的惯用表达；按原文顺序保留“你们和我们”。
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: 大大亏负了我们
  rationale: 既表达ἀδικία的严重不义，也以现代汉语自然呈现这种不义直接加在说话者群体身上的含义。
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: 没有……讲和
  rationale: 分词短语说明他们如何亏负众人；εἰρηνικά在此可指和平的话或议和，“讲和”简洁保留言说与求和的双重含义。
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: 同亚述的子孙
  rationale: 依希腊文直译“亚述的子孙”，不直接把它解释为族称“亚述人”，并在脚注交代自然的族称理解。
theological_decisions:
- issue: 以上帝为裁断者的呼求
  choice: 愿上帝在你们和我们之间施行判断
  alternative: 让上帝在你们和我们之间判断
  rationale: 该句是求上帝裁断双方是非的传统表达，并非展开论述神学教义；“愿”准确保留祈愿式语气，而不强化为直接命令。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“施行判断”保留司法裁断色彩；“讲和”比“说和平的话”更自然，同时没有明确增补正式缔约等原文未明说的内容。
