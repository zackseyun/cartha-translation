  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: zh_hans
  text: 亚述全军，包括步兵、战车和骑兵，在他们四周驻扎了三十四天；拜突里亚所有居民的一切盛水器皿都空了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα παρεμβολὴ Ἀσσούρ
  choice: 亚述全军
  rationale: παρεμβολή在此指驻扎围城的军营或军队；结合后列步兵、战车和骑兵，译作“全军”自然且涵盖完整。
- source_word: ἔμεινεν κύκλῳ αὐτῶν
  choice: 在他们四周驻扎
  rationale: 保留ἔμεινεν的持续停留之意，并以“驻扎”贴合军事语境；κύκλῳ表达环绕。
- source_word: οἱ πεζοὶ καὶ ἅρματα καὶ οἱ ἱππεῖς αὐτῶν
  choice: 包括步兵、战车和骑兵
  rationale: 按希腊文逐项列出军队组成；“包括”在汉语中清楚说明其与“亚述全军”的同位关系。
- source_word: ἐξέλιπεν
  choice: 都空了
  rationale: 该动词在此表示水源或存水耗尽；主语是器皿，译作“空了”比拟人化的“耗尽”更自然，也不额外断定器皿本身被倒空。
- source_word: πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων
  choice: 一切盛水器皿
  rationale: 将较生硬的属格结构自然表达为用于盛水的器皿，同时保留πάντα的全称范围。
- source_word: Βαιτυλουά
  choice: 拜突里亚
  rationale: 按常见中文音译处理该地名。
