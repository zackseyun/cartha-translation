base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/014.yaml
  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: zh_hans
  text: 我们要在那些水泉旁安营把守，使城里连一个男人也出不来。他们和他们的妻子儿女都将在饥荒中日渐消瘦；刀剑还没有临到他们，他们就会倒卧在自己居住地的街道上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街道”也可译作“广场”；“倒卧”也可译作“横陈”。希腊文既可描写人被击倒，也可描写人倒下后遍布地面的景象。
    reason: 保留πλατεῖαι与καταστρωθήσονται在此处的词义范围，不在正文中断定具体是街道还是广场，也不过度明确是否专指尸体横陈。
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς εἰς προφυλακήν
  choice: 我们要在那些水泉旁安营把守
  rationale: παρεμβάλλω具有军事上安营、扎营之意；εἰς προφυλακήν说明安营的目的是警戒、把守。阴性复数代词αὐταῖς按上文所指理解为水泉，因此译作“在那些水泉旁”，既交代空间位置，也符合围城断水的策略。
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  choice: 使城里连一个男人也出不来
  rationale: 保留ἄνδρα ἕνα的男性单数表达及其强调语气；“连……也”自然传达一个都不许出去的拦阻目的。
- source_word: τακήσονται
  choice: 日渐消瘦
  rationale: 动词本义可指融化、消耗，此处描写饥荒使人逐渐衰弱消瘦。“日渐消瘦”在现代汉语中自然，并保留过程感。
- source_word: ἐν τῷ λιμῷ
  choice: 在饥荒中
  rationale: 按λιμός的群体性灾荒含义译作“饥荒”，并保留ἐν所表达的处境。
- source_word: ῥομφαία
  choice: 刀剑
  rationale: 该词指大型刀剑，也可转指武力杀戮；“刀剑”是庄重而通行的圣经语体表达，且不过度限定兵器形制。
- source_word: καταστρωθήσονται
  choice: 倒卧
  rationale: 该动词可表示被击倒、铺倒或横陈。“倒卧”保留他们可能因饥荒倒下乃至死亡的语境，同时不把死亡状态说得比希腊文更明确。
- source_word: ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν
  choice: 在自己居住地的街道上
  rationale: πλατεῖαι可指宽阔街道或广场；正文采用较概括自然的“街道”，οἴκησις则译为“居住地”，避免误解为各家住宅内部。另一可能义以脚注保留。
