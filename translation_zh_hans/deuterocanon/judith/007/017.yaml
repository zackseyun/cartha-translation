  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: zh_hans
  text: 亚扪人的军队[a]开拔了；同他们一起的，还有五千亚述人。他们在谷地[b]安营，抢先占据了[c]以色列人的水和水泉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“亚扪子孙的军队”；这里按族名译作“亚扪人的军队”。
    reason: lexical_alternative
  - marker: b
    text: 译作“谷地”的希腊词也可指洼地、山谷或四周受围的平地，具体含义取决于当地地形。
    reason: lexical_alternative
  - marker: c
    text: 或译“预先控制了”或“先行夺取了”；这个动词带有抢先取得这些水和水泉的战略意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 开拔了
  rationale: 用于军队拔营出发的叙事语境，自然表达从原驻地启程，不额外断定只是离去还是主动进军。
- source_word: ἡ παρεμβολὴ υἱῶν Ἀμμών
  choice: 亚扪人的军队
  rationale: παρεμβολή既可指营地，也可指驻营的军队；此处作为移动的主语，译作“军队”更符合现代汉语。υἱῶν Ἀμμών按常用族名译作“亚扪人”，字面形式见脚注。
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: 五千亚述人
  rationale: 按汉语习惯表达人数和族属；“亚述人”传达υἱῶν Ἀσσούρ的族名意义，而不生硬照译为“亚述之子”。
- source_word: παρενέβαλον
  choice: 安营
  rationale: 准确表达军队驻扎设营的动作，并保持庄重简洁的叙事语体。
- source_word: ἐν τῷ αὐλῶνι
  choice: 在谷地
  rationale: αὐλών在地形语境中可指山谷、洼地或狭长谷地；“谷地”自然且保留一定范围的地貌含义。
- source_word: προκατελάβοντο
  choice: 抢先占据了
  rationale: 前缀所含的“预先、先行”意味与军事控制动作一并保留，比单译“占据”更充分。
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: 水域和水泉
  rationale: 保留原文“诸水”与“水的泉源”的并列表达，不将两项静默合并为笼统的“水源”。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列人的
  rationale: 以现代汉语常用族名表达属格关系；在此语境中表示这些水域和水泉与以色列人相关或供其使用。
