  yaml_path: translation/deuterocanon/judith/007/011.yaml
  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: zh_hans
  text: 现在，大人，不要像通常列阵交战那样攻打他们[a]；你的人民中连一个人也不会倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要照列阵会战的方式攻打他们。”希腊语这一短语指军队排成阵势进行的常规正面交战。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: 大人
  rationale: 这是对人间上级的直接称呼，表示主人或掌权者。“大人”符合本处臣属向统帅进言的语境，也避免与通常译作“主”的 κύριος 混同。
- source_word: μὴ πολέμει πρὸς αὐτούς
  choice: 不要……攻打他们
  rationale: μή 加现在时命令式构成禁止语气；“攻打他们”自然表达 πολεμέω πρὸς 的敌对军事行动。
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: 像通常列阵交战那样
  rationale: παράταξις 指军队排成阵势或战线；此译保留列阵作战的军事图景，同时以“通常”表达这种常规正面会战与随后所提策略之间的对照。
- source_word: οὐ πεσεῖται
  choice: 不会倒下
  rationale: πίπτω 在战争语境中可指阵亡，但原文仍使用“倒下”的形象；直译可保留其表达幅度，不把死亡含义说得比原文更明。
- source_word: ἀνὴρ εἷς
  choice: 连一个人也不会
  rationale: εἷς 强调一个也没有；“连一个人也不会”在现代汉语中自然保留这种强调。上下文虽指战士，但原文使用 ἀνήρ 而非专门的军人称谓。
- source_word: ἐκ τοῦ λαοῦ σου
  choice: 你的人民中
  rationale: λαός 的基本义是“人民、百姓”；尽管处于军事语境，仍不擅自窄化为“军队”或“士兵”。
theological_decisions:
- issue: 对人间上级的称号 δέσποτα 如何与 κύριος 区分
  choice: 大人
  alternative: 主人；主宰
  rationale: 本节称呼的是人间统帅，并非上帝。“大人”既体现尊称和权威，也不引入神圣称号的含义。
- issue: “倒下”是否明确译为“阵亡”
  choice: 倒下
  alternative: 阵亡；被杀
  rationale: 军事语境使“倒下”很可能暗示死亡，但原文没有明说“死”或“被杀”；保留原有隐喻可避免消除其语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“大人”体现下属对人间统帅的敬称；“列阵交战”保留古代军事语境而不显晦涩。分号后的“这样”显明前后行动与结果的关系，但不增加原文没有的神学解释。
