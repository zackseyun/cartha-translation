  text: And now call them, and hand over the whole city as plunder to the people of Holofernes and to all his force.
translation:
  language: zh_hans
  text: 现在，你们就召他们来，把整座城作为掠物交给何乐弗尼的部众和他的全军。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσασθε αὐτοὺς
  choice: 召他们来
  rationale: ἐπικαλέσασθε 在此依语境表示召来、叫来；保留宾语“他们”，不擅自明确其身份。
- source_word: ἔκδοθε τὴν πόλιν πᾶσαν
  choice: 把整座城交出去
  rationale: ἔκδοτε 表示交出、交付；πᾶσαν 修饰整座城，故译作“整座城”。
- source_word: εἰς προνομὴν
  choice: 任由……掳掠
  rationale: προνομή 指劫掠、战利品式的掳掠；用“任由……掳掠”自然表达把城交给敌军洗劫之意。
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: 何乐弗尼的部众
  rationale: λαός 此处指何乐弗尼所统领的人马或部众，而非现代民族意义上的“人民”。
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: 他的全军
  rationale: δύναμις 在军事语境中指军力、军队；单数集合名词自然译为“全军”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“现在，你就去……”体现 καὶ νῦν 的紧迫劝令语气；不补明“他们”的具体所指，以保存原文的指代方式。
