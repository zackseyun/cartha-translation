  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: zh_hans
  text: 蓄水池渐渐见底；他们连一天所需的饮用水也不够，因为水是按定量[a]供给他们饮用的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按量”或“限量”；希腊文直译为“按着量”，表示饮水受到配给限制。
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: 蓄水池
  rationale: 围城语境中指挖掘而成、用于储水的设施；“蓄水池”比泛指的“坑”更准确，也不误作地下水井。
- source_word: ἐξεκενοῦντο
  choice: 渐渐见底
  rationale: 未完成时表达持续耗尽的过程；“渐渐见底”是自然的现代汉语，并保留水量不断减少的动态。
- source_word: οὐκ εἶχον πεῖν εἰς πλησμονὴν ὕδωρ ἡμέραν μίαν
  choice: 他们连一天所需的饮用水也不够
  rationale: εἰς πλησμονήν 表示达到足量、满足需要；整句不是说完全无水，而是连一天的足量饮水都没有。“连……也”传达“一天”这一最低时限的语用强调。
- source_word: ἐν μέτρῳ
  choice: 按定量
  rationale: 保留“按量”的具体含义，同时在现代汉语中清楚表达配给、限量供应。
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: 分给他们喝
  rationale: 希腊文为未明确施事者的复数主动表达；汉语可用无主句自然呈现，不擅自指明分水的人。
