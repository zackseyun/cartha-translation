lexical_decisions:
- source_word: ἤρεσαν
  choice: 很中意
  rationale: ἀρέσκω在此表示提议得到赞同；“很中意”自然传达敖罗斐乃及其侍从对这些话的认可。
- source_word: οἱ λόγοι αὐτῶν
  choice: 他们的话
  rationale: 保留λόγοι的字面意象，同时在上下文中自然指他们所提出的计策。
- source_word: ἐνώπιον Ὀλοφέρνου καὶ ἐνώπιον πάντων τῶν θεραπόντων αὐτοῦ
  choice: 在敖罗斐乃和他所有的侍从面前
  rationale: 对应重复的ἐνώπιον结构，并以“侍从”表达θεράπων在军事首领身边随员、属员的语境含义。
- source_word: συνέταξε
  choice: 他下令
  rationale: 此处συντάσσω表示权威性的命令；“下令”简洁而符合军事场景。
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: 照他们所说的去做
  rationale: 忠实表达不定式所指的命令内容，以及καθά所表示的依照关系。
