base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: zh_hans
  text: 敖齐雅对他们说：“弟兄们，要鼓起勇气！让我们再坚持五天；在这期间，主我们的上帝必将他的怜悯转向我们，因为他不会永远抛弃我们。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远抛弃我们”或译“彻底抛弃我们”。希腊语直译为“抛弃我们到底”，既可指永久，也可强调完全、彻底。
    reason: 保留εἰς τέλος在时间性与程度性之间的真实语义空间。
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: 要鼓起勇气
  rationale: 复数命令式，表达在危难中振作、勇敢起来的劝勉；现代汉语自然有力。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数称呼，不在正文中扩展为原文未明说的包容性形式。
- source_word: διακαρτερήσωμεν
  choice: 让我们……坚持
  rationale: 劝勉虚拟式表示共同继续忍耐；结合围城处境，“坚持”准确而自然。
- source_word: ἔτι πέντε ἡμέρας
  choice: 再坚持五天
  rationale: “再”体现ἔτι所含继续、追加之意。
- source_word: ἐν αἷς
  choice: 在这期间
  rationale: 指前述五天这一时段；避免用生硬的关系从句，同时不把它过度限定为五天结束之前的某一刻。
- source_word: ἐπιστρέψει
  choice: 必将……转向
  rationale: 及物用法以“他的怜悯”为宾语，并由ἐφʼ ἡμᾶς指出方向；“转向”贴近希腊文，也不额外加入“重新”。
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: 主我们的上帝
  rationale: 保留κύριος与ὁ θεὸς ἡμῶν的结构和神圣称谓；采用本项目现代中文的称谓形式。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 他的怜悯
  rationale: ἔλεος在此指上帝对受困百姓的怜悯；不增添原文未明确表达的盟约限定。
- source_word: ἐφʼ ἡμᾶς
  choice: 向我们
  rationale: 与“转向”搭配，保留怜悯朝向众人的方向性。
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: 因为他不会永远抛弃我们
  rationale: ἐγκαταλείπω为抛弃、离弃；εἰς τέλος可惯用地表示永远或彻底。正文采用自然的时间性理解，并以脚注保留“彻底”的可能性。
theological_decisions:
- issue: 在次经希腊语语境中如何翻译指以色列之上帝的κύριος
  choice: 主
  alternative: 耶和华；主人
  rationale: 源文本身为κύριος而非希伯来文神名；“主”既忠于希腊文，又避免从潜在希伯来底本反向补入神名。
- issue: ἀδελφοί的性别指向
  choice: 弟兄们
  alternative: 弟兄姊妹们；同胞们
  rationale: 希腊文采用阳性复数直接称呼。正文保留这一形式，不在上下文未明确要求时扩大其性别范围。
- issue: εἰς τέλος的语义范围
  choice: 永远
  alternative: 彻底；到底
  rationale: 该短语可表达时间上的最终、永久，也可强调程度上的完全。正文采用符合现代汉语语境的“永远”，脚注保留真实的词义歧义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“敖齐雅”依照《友弟德传》常见天主教中文专名传统；“鼓起勇气”“再坚持五天”符合危城语境，避免文言化。脚注标记置于其所说明的整句末尾。
