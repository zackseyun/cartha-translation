base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: zh_hans
  text: 以色列人[a]看见他们人数众多，就十分惊惶；各人对身边的人说：“如今这些人要把全地的表面舔尽[b]；无论高山、峡谷还是丘陵，都承受不住他们的重量。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，即以色列人。
    reason: translation_note
  - marker: b
    text: “舔尽”保留原文的形象说法，指像吞吃一样席卷、耗尽全地。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 按现代汉语通常用法表达以色列群体；若直译为“以色列的儿子们”会显得生硬，并可能误导为仅指男性。脚注保留原文形式。
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: 看见他们人数众多
  rationale: πλῆθος在此指敌军庞大的人数；此译自然清楚，并传达数量造成的压迫感。
- source_word: ἐταράχθησαν σφόδρα
  choice: 就非常惊慌
  rationale: ταράσσω表示受到强烈扰乱、不安；“惊慌”符合面对庞大敌军的语境，又未强化为极端的“吓坏了”。
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: 彼此说
  rationale: 原文逐字为“各人对身边的人说”；“彼此说”在现代汉语中简洁自然地表达相互交谈。
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: 这些人现在就要……舔个精光
  rationale: ἐκλείχω本义为“舔净、舔光”，采用“舔个精光”保留吞噬殆尽的鲜明比喻，而不直接释为“消灭”或“耗尽”。
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: 全地的表面
  rationale: 保留πρόσωπον“面、表面”的空间意象；γῆ在此更可能指眼前整片土地，而非全球意义的“地球”。
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: 无论高山、峡谷还是丘陵
  rationale: 分别保留ὄρη、φάραγγες、βουνοί三类地形；φάραγγες指峡谷或沟壑，不宜泛化为宽阔的山谷。
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: 都承受不住他们的重量
  rationale: ὑποστήσονται在这里表示支撑或经受；“承受不住……重量”延续庞大军队压在地貌之上的夸张图像。
