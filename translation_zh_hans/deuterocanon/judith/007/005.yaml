  text: And each of them took up his weapons of war, and after kindling fires on their towers, they remained on guard through that whole night.
translation:
  language: zh_hans
  text: 他们各自拿起自己的作战装备，在自己的塔楼上生起火来，留守警戒了那一整夜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: 拿起
  rationale: 该不定过去时分词表示为行动作准备而拿起装备；“拿起”自然、简明，并保留先于主句动作的关系。
- source_word: ἕκαστος
  choice: 各自
  rationale: 保留希腊文明确的逐一、分配意义，同时不增添原文没有的性别信息。
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: 自己的兵器
  rationale: σκεύη本可泛指器具或装备，受πολεμικά限定后指作战用具；在本语境中“兵器”清楚自然，而“自己的”对应αὐτῶν。
- source_word: ἀνακαύσαντες πυράς
  choice: 点起火来
  rationale: 准确呈现生火、燃起火堆的具体动作；置于主句前，体现分词所表达的先行动作。
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: 在自己的城楼上
  rationale: ἐπί在此表达城楼上的位置；“城楼”比现代建筑语境中的“塔楼”更贴合守城场景。αὐτῶν可自然理解为他们所守的城楼。
- source_word: ἔμενον φυλάσσοντες
  choice: 留在那里警戒
  rationale: ἔμενον与φυλάσσοντες共同强调持续留守并执行警戒；此译兼顾停留和守望两层意义。
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: 整夜
  rationale: 表达那一整夜的完整时段；中文语境中“整夜”已自然指向叙事所说的当夜，无须机械重复指示词。
