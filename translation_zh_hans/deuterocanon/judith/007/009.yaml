  text: Let our lord hear a word[b][a], so that there may not be a breach in your force.
translation:
  language: zh_hans
  text: 请我主[a]听一言，免得你的军队受到损害[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我主”也可译作“我们的主人”或“我们的主上”；原文是对有权柄者的尊称。
    reason: lexical_alternative
  - marker: b
    text: “军队受到损害”也可译作“你的军力有所折损”；原文“军力”一词也可指“力量”或“军队”，“受到损害”对应原文所说的破损或破坏，未具体说明其性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουσάτω δὴ
  choice: 请……听
  rationale: Ἀκουσάτω是第三人称单数不定过去时命令式；结合对上级说话的语境，用“请……听”表达恭敬的请求。语气词δὴ所带的催促、恳请意味融入“请”，不另作生硬直译。
- source_word: λόγον
  choice: 一句话
  rationale: λόγον在这里指要说的一番简短意见；“一句话”既贴近单数形式，也符合现代汉语表达。
- source_word: ὁ δεσπότης ἡμῶν
  choice: 我主
  rationale: δεσπότης指有权柄的主人或主上；在对军事长官的敬称中，“我主”庄重自然，也保留ἡμῶν所表达的归属关系。
- source_word: ἵνα μὴ γένηται
  choice: 免得……有所……
  rationale: 该结构引出否定目的或所要避免的结果；“免得”简洁保留其前瞻性和劝告语气。
- source_word: θραῦσμα
  choice: 折损
  rationale: 该词本义涉及破裂、破坏或由此造成的损害；“折损”适合军事语境，又不把损害具体化为溃败或毁灭。
- source_word: ἐν τῇ δυνάμει σου
  choice: 你的军力
  rationale: δύναμις可指能力、力量，也可指军队或兵力；此处语境明显偏向军事意义。“军力”既自然，也保留“力量”与“军队”之间的一定语义宽度。
