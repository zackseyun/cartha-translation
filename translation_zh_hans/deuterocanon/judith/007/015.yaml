  yaml_path: translation/deuterocanon/judith/007/015.yaml
  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: zh_hans
  text: 你必以恶回报他们[a]，因为他们叛乱，没有和平地出来迎接你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“以恶的报偿回报他们”；动词和名词同源，加强了还报的语气。
    reason: lexical_alternative
  - marker: b
    text: “出来迎接你”也可译作“迎见你”；原文中的动词常含出去迎接之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις αὐτοῖς ἀνταπόδομα πονηρόν
  choice: 你必以恶报偿他们
  rationale: 动词与名词同源，构成加强报应意味的同源表达。中文用“以恶报偿”自然传达按其行为还报的意思，并保留“恶”的严厉色彩；脚注补明原文的同源修辞。
- source_word: ἀνθʼ ὧν
  choice: 因为
  rationale: 此处说明报偿的缘由；译作“因为”符合现代汉语，也准确表达因果关系。
- source_word: ἐστασίασαν
  choice: 他们叛乱
  rationale: 该动词表示采取反叛、作乱的立场；“叛乱”简洁保留其政治与敌对意味。
- source_word: οὐκ ἀπήντησαν
  choice: 没有……出来迎接
  rationale: ἀπαντάω常含前去或出来迎接某人的意思；译文将这一动态含义明说，避免仅译“见面”而削弱语气。
- source_word: τῷ προσώπῳ σου
  choice: 你
  rationale: 字面为“你的面”，在此指对方本人；现代汉语直译成“你的面”生硬，因此译作“你”。
- source_word: ἐν εἰρήνῃ
  choice: 带着和平之意
  rationale: 该短语可指和平地接近，也可指怀着和平意图。此译法适合外交性相迎的语境，同时不把含义限定为单纯的行为方式。
theological_decisions:
- issue: 说话者所求之审判的性质
  choice: 保留对上帝直接说出的未来式报偿：‘你必……报偿他们’
  alternative: 明确扩写为祈求句‘求你……报偿他们’，或泛化为关于神圣公义的陈述
  rationale: 希腊文未来式在语境中可兼具确信与诉求意味。直译为“你必”保留这种张力，不额外判定它纯属祈求还是预告。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以恶报偿”保留原文审判性的力度；“带着和平之意出来迎接”既呈现迎接动作，也保留ἐν εἰρήνῃ可能指和平态度或意图的宽度。
