base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: zh_hans
  text: 我们请天地、我们的上帝和我们列祖的主作证，指证你们[a]；他按着我们的罪和我们列祖的罪报应我们[b]，免得他今天照这些话行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们向你们作证”；这里的希腊文很可能是正式请天地和上帝作见证，见证对你们不利。
    reason: lexical_alternative
  - marker: b
    text: “报应我们”表示上帝按人的罪给予相应的惩罚；也可译作“因我们的罪惩罚我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: 我们请……为证，控告你们
  rationale: μαρτυρόμεθα在列举天地和上帝作见证者的语境中带有正式援引见证的意味；ὑμῖν形式上是与格，但此处见证针对听众所主张的做法，故用“控告你们”表达其对立性，同时以脚注保留较直译的可能。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: “天地”是现代汉语中自然而庄重的合称，也保留了原文以宇宙为见证的表达。
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: 我们的上帝和我们列祖的主
  rationale: 保留两个并列称谓，并将κύριος译作神圣称号“主”；“列祖”自然传达祖先和盟约历史的语感。
- source_word: ἐκδικεῖ ἡμᾶς
  choice: 向我们施行报应
  rationale: ἐκδικεῖ在“照着罪”的搭配中表示针对罪恶施行惩罚性公义；“施行报应”既保留报偿意味，也避免让“为我们报仇”误成上帝替说话者伸冤。
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: 照着我们的罪和我们列祖的罪
  rationale: κατά加宾格表达与罪相应的尺度或根据；“照着”保留这种对应关系，两个近义的罪词在汉语中均译作“罪”以求自然。
- source_word: ἵνα μὴ ποιήσῃ
  choice: 愿他……不要……行事
  rationale: 该否定目的或结果从句在此诉求语境中以“愿……不要”最为自然，同时不把ἵνα的语义过度限定为单一逻辑关系。
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: 照你们这些话
  rationale: ῥήματα指刚才所说的话；补出语境隐含的“你们”，使现代汉语所指明确，而“照……行事”保留原文κατά的关系。
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: 今天
  rationale: 以自然现代汉语表达原文强调当日的时间短语。
theological_decisions:
- issue: κύριος作为神圣称号的译法
  choice: 主
  alternative: 主人
  rationale: 此处与“我们的上帝”并列，并关联“列祖”，显然是神圣称号；“主”最能保存其宗教和盟约语感。
- issue: ἐκδικεῖ在罪与审判语境中的方向
  choice: 向我们施行报应
  alternative: 因我们的罪惩罚我们
  rationale: 原文强调上帝按罪施行相应的报偿性审判。“施行报应”保留ἐκδικεῖ的公义报偿色彩，脚注说明也可理解为惩罚，且避免误读为替“我们”复仇。
- issue: ἵνα μὴ ποιήσῃ所表达的诉求
  choice: 愿他今天不要照你们这些话行事
  alternative: 好使他今天不照这些话行事
  rationale: 原文可带目的或所求结果的意味；汉语“愿”符合正式呼告的上下文，又不把逻辑关系说得过死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“请……为证”保留正式申诉色彩；“列祖”符合经文历史语境；用分号厘清较长句的层次。
