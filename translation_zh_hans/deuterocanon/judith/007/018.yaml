base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: zh_hans
  text: 以扫的子孙和亚扪的子孙上到山地，在多泰因对面安营；他们从自己人中派出一些人，往南方和东方[a]，在埃格勒贝勒对面。埃格勒贝勒靠近库斯；库斯位于莫克穆尔季节性河谷[b]旁。其余的亚述军队在平原上安营，遮盖了整个大地；他们的帐篷和辎重也密集驻扎，数量极其众多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方”所译的希腊词与日出有关，直译可作“日出之方”。
    reason: lexical_alternative
  - marker: b
    text: 指雨季有急流、旱季可能干涸的河床或溪谷；也可译作“溪谷”或“急流河道”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: 上到
  rationale: 保留动词“上去、登上”的空间含义；下文随即说明他们进入山地，因此不必将其限定为军事术语“进军”。
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: 以扫的子孙和亚扪的子孙
  rationale: υἱοί在民族群体语境中指后裔、族人；“子孙”既保留谱系表达，也符合现代汉语。
- source_word: παρενέβαλον
  choice: 安营
  rationale: 该词在军事语境中表示扎营；“安营”简洁、自然，并保留军队行动色彩。
- source_word: ἐν τῷ ὄρει
  choice: 在山地
  rationale: 单数ὄρος在此可指山岳地区，不必限定为某一座山；“山地”符合地理语境。
- source_word: ἀπέναντι Δωθαείμ
  choice: 在多泰因对面
  rationale: ἀπέναντι表达相对、面对的位置关系；地名按希腊文形式音译。
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: 他们又从自己人中派出一队
  rationale: 希腊文直译为“从他们中间派出”；军事语境暗示一支分队，以“一队”自然表达而不指定人数。
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: 往南方和东方
  rationale: ἀπηλιώτης指东方，其词义与日出方向有关；正文采用清楚的方位词，并在脚注保留字面意象。
- source_word: Ἐγρεβήλ
  choice: 埃格勒贝勒
  rationale: 按希腊文地名音译，不尝试作未经证实的地理认定。
- source_word: Χοὺς
  choice: 库斯
  rationale: 按希腊文形式音译为中文地名。
- source_word: χειμάρρου
  choice: 季节性河谷
  rationale: 该词可指雨季奔流、旱季可能干涸的溪谷或河床；此译比“溪流”更能体现近东地貌。
- source_word: Μοχμούρ
  choice: 莫克穆尔
  rationale: 按希腊文形式音译为中文地名。
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: 其余的亚述军队
  rationale: στρατεία在此指军事力量，“军队”是自然准确的现代汉语；λοιπή译为“其余的”。
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  choice: 遍布大地
  rationale: 原文意为“遮盖了地的整个表面”；“遍布大地”自然呈现军势铺满地面的图景，避免误解为物理覆盖物。
- source_word: αἱ σκηναὶ καὶ αἱ ἀποσκευαὶ αὐτῶν κατεστρατοπέδευσαν ἐν ὄχλῳ πολλῷ
  choice: 他们的帐篷和辎重形成了浩大的营盘
  rationale: 原文将“帐篷和行装、辎重”拟作安营的主体，并强调规模庞大；中文以“形成了浩大的营盘”保留整体景象，同时避免生硬地说辎重自行安营。
- source_word: ἦσαν εἰς πλῆθος πολὺ σφόδρα
  choice: 数量极其众多
  rationale: 保留原文叠加强调数量庞大的语气。
