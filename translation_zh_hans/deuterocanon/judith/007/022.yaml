  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: zh_hans
  text: 他们的幼童灰心了[a]；妇女和青年人因干渴而衰竭，倒在城里的广场和城门的通道上[b]。他们再也没有力量了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的婴孩灰心了”，或“他们年幼的孩子衰弱了”。希腊文τὰ νήπια可指很小的孩子，包括婴孩；ἠθύμησεν可表示心志消沉，也可能含有精神衰弱之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“倒在城里的宽街和城门通道上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθύμησεν
  choice: 灰心了
  rationale: 该动词表示心志低落、丧失勇气；“灰心了”保留心理与精神上的衰颓，不把含义限定为纯粹的身体昏厥。
- source_word: τὰ νήπια
  choice: 幼童
  rationale: νήπια可指婴孩或年幼的孩子；“幼童”自然简洁，也保留年龄范围上的一定弹性。
- source_word: ἐξέλιπον
  choice: 渐渐虚弱
  rationale: 未完成时描写持续发展的衰竭；“渐渐虚弱”在中文中自然地传达因缺水而不断失去体力。
- source_word: ἀπὸ τῆς δίψης
  choice: 因口渴
  rationale: 直接表达原因，符合现代汉语习惯。
- source_word: ἔπιπτον
  choice: 倒在
  rationale: 未完成时可表示持续或接连发生的倒下；在本句中与“渐渐虚弱”共同呈现正在发生的危机。
- source_word: πλατείαις
  choice: 广场
  rationale: 该词指城内宽阔的公共空间，也可理解为宽街；正文采用自然明确的“广场”，并以脚注保留另一可能。
- source_word: διόδοις τῶν πυλῶν
  choice: 城门的通道
  rationale: 贴近原文所指与城门相连的通行空间，不擅自具体化为城门口或入口道路。
- source_word: κραταίωσις
  choice: 力气
  rationale: 在干渴、虚弱和倒下的语境中，“力气”比抽象的“力量”更自然，同时传达维持身体和支撑下去的能力。
- source_word: οὐκ ἦν ... ἔτι ἐν αὐτοῖς
  choice: 他们已经一点力气也没有了
  rationale: 自然地保留ἔτι所表达的“不再、已经没有”以及ἐν αὐτοῖς所强调的内在力量耗尽。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号和句号疏理希腊文长句，使灾情逐步加重的节奏清楚；正文保留幼童“灰心”与众人身体衰竭之间的差别，并用脚注保存νήπια、ἠθύμησεν和πλατείαις的词义弹性。
