  yaml_path: translation/deuterocanon/judith/007/023.yaml
  text: And all the people gathered against Oziah and the rulers of the city—the young men[a], the women, and the children—and they cried out with a loud voice and spoke against the elders,
translation:
  language: zh_hans
  text: 全体民众——青年男子、妇女和孩童——都聚集起来，反对乌西雅和城中的官长；他们大声呼喊，向长老们抗议[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “反对乌西雅和城中的官长……向长老们抗议”或译“聚集到乌西雅和城中的官长面前……在长老们面前说”。若将ἐπί和ἐναντίον理解为方位而非敌对含义，可作后一种翻译；紧接着公开申诉的语境支持正文译法。
    reason: 保留ἐπί与ἐναντίον在敌对含义和方位含义之间的真实歧义，并使替代译文完整对应正文。
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: 聚集起来
  rationale: 该不定过去时被动/中动形式在此作不及物用，表示民众集合成群；“聚集起来”自然地体现共同集结的动作。
- source_word: πᾶς ὁ λαός
  choice: 全体民众
  rationale: 表示整个群体；“全体民众”既保留 πᾶς 的整体含义，又符合现代汉语叙事表达。
- source_word: ἐπὶ Ὀζείαν
  choice: 反对乌西雅
  rationale: ἐπί 加宾格可有敌对含义；鉴于下文民众高声抗议，此处译作“反对”最切合直接语境，同时以脚注保留方位性理解。
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: 城中的官长
  rationale: ἄρχοντες 指城市中掌权的公共领袖；“官长”保留其正式权威，又不限定具体政制职位。
- source_word: οἱ νεανίσκοι
  choice: 青年男子
  rationale: 原文为阳性复数，特指年轻男性；此译明确保留性别信息。
- source_word: τὰ παιδία
  choice: 孩童
  rationale: 该词泛指儿童；“孩童”简明自然，并与“青年男子、妇女”构成顺畅列举。
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 以自然现代汉语同时表达动词“呼喊”和 φωνῇ μεγάλῃ 所强调的高声与强烈程度。
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: 向长老们抗议说
  rationale: ἐναντίον 在公开申诉的语境中带有对抗意味；“抗议说”比字面的“说反对长老的话”更自然，并保留敌对语气。
- source_word: Ὀζείαν
  choice: 乌西雅
  rationale: 采用现代中文读者较易识别的圣经人名译法，对应希腊文所指人物。
