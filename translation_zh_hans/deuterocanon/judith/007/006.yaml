lexical_decisions:
- source_word: τῇ ... ἡμέρᾳ τῇ δευτέρᾳ
  choice: 第二天
  rationale: 该带冠词的与格短语表示时间；“第二天”直接、自然，并保留希腊文所示的时间次序。
- source_word: ἐξήγαγεν
  choice: 带出来
  rationale: 该动词意为领出或带出；“带出来”不额外加入行军方式等原文未明说的细节。
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: 他的全部骑兵
  rationale: ἵππος 字面可指马，但在军事语境中可集合性地指骑兵；此译法准确传达整支骑兵部队，也自然表达 αὐτοῦ 的所属关系。
- source_word: κατὰ πρόσωπον
  choice: 列在……面前
  rationale: 该短语表示处在某些人面前或与其相对的位置；结合军事部署语境，以“列在……面前”自然呈现其位置关系，但不强化为交战。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 保留希腊文传统族群称谓“以色列的众子”的形式；“众子”既体现复数，也避免现代汉语把它误解为雅各某几个亲生儿子。脚注说明其实际所指。
- source_word: οἳ ἦσαν ἐν Βετυλουά
  choice: 住在伯突利亚的
  rationale: 关系从句限定这些以色列众子，ἐν 表示他们身处该城；汉语用前置定语较为流畅。“伯突利亚”采用现代中文圣经地名中可辨识的音译形式。
