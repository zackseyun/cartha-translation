  yaml_path: translation/deuterocanon/judith/007/025.yaml
  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
translation:
  language: zh_hans
  text: 现在，已经没有人帮助我们了；上帝反而把我们卖给他们，交到他们手中[a]，使我们在他们面前倒下[b]，在干渴和极大的毁灭中倒下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卖给他们，交到他们手中”也可译作“交在他们手中”。希腊文动词的字面意思是“卖”，以此强烈比喻被交在敌人权下。
    reason: lexical_alternative
  - marker: b
    text: “倒下”也可译作“被击倒”或“覆灭”。
    reason: lexical_alternative
  - marker: c
    text: “在干渴和极大的毁灭中”也可理解为“因干渴和极大的毁灭而倒下”，即把这句话看作说明他们倒下的原因或方式。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: βοηθός
  choice: 帮助我们的人
  rationale: 原文为带定冠词的单数名词，直译是“我们的帮助者”。译作“没有人帮助我们”符合现代汉语习惯，同时保留所指为人的含义。
- source_word: πέπρακεν
  choice: 把我们卖到
  rationale: 该词来自动词πράσκω，基本义是“卖”。这里以买卖为喻，强烈表达上帝把百姓交在敌人权下，故正文保留“卖”的力度。
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: 到他们手中
  rationale: 这是表示落入他人权势或控制之下的惯用语；“到他们手中”既保留原文意象，也符合中文圣经语体。
- source_word: τοῦ καταστρωθῆναι
  choice: 使我们……倒下
  rationale: 不定式表达目的或结果。καταστρώννυμι在此可指被打倒、倒毙或覆灭；“倒下”保留其范围，避免过度限定具体死法。
- source_word: ἐναντίον αὐτῶν
  choice: 在他们面前
  rationale: 结合“倒下”的语境，这一短语自然表示在敌人面前、当着敌人的面，而非与他们对抗。
- source_word: ἐν δίψει
  choice: 陷在干渴……之中
  rationale: ἐν既可表示所处境况，也可表示原因或手段。正文采用境况义，并以脚注保留原因义。
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: 大毁灭
  rationale: ἀπώλεια可指毁灭、灭亡或败亡。“大毁灭”直接保留形容词的强度，也避免赋予该词后期神学语境中的特殊含义。
theological_decisions:
- issue: 百姓败亡中的上帝主动性
  choice: 上帝把我们卖到他们手中
  alternative: 上帝把我们交在他们手中
  rationale: 希腊文明确以上帝为πέπρακεν的主语，并用“卖”这一强烈比喻描述其行动。正文不弱化说话者对上帝主动作用的归因，从而保留经文的神学张力。
- issue: 不定式所表达的是目的还是结果
  choice: 使我们……倒下
  alternative: 为要让我们……倒下／以致我们……倒下
  rationale: 带冠词属格不定式τοῦ καταστρωθῆναι在此可带目的或结果色彩。“使”不强行判定二者，保留一定程度的语义开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“没有人帮助我们”避免生硬的“没有我们的帮助者”；“卖到他们手中”保留原文强烈的商业比喻和传统经文意象。句末用“陷在……之中”呈现压迫性的处境，同时由脚注交代ἐν可能表示原因或手段。
