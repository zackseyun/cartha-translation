  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become servants, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: zh_hans
  text: 我们成为他们的掠物，倒还更好；那样，我们会沦为奴隶，却能保住性命[b]，不至于亲眼[c]看见我们幼小的孩子死去，也不至于看着我们的妻子和儿女生命消逝[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文直译为“我们的生命将存活”，意思是我们的性命得以保存。
    reason: literal_rendering
  - marker: c
    text: 原文也可译作“在我们眼前”。
    reason: lexical_alternative
  - marker: d
    text: 原文较直译为“我们的妻子和儿女生命衰竭”，指他们在我们眼前死去。
    reason: literal_rendering
lexical_decisions:
- source_word: κρεῖσσον
  choice: 总比这样好
  rationale: 比较级表达在绝境中较可取的选择；结合上文语境补出“这样”，使现代汉语自然，但不改变比较关系。
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: 成为他们的掳物
  rationale: 保留“成为……掳物”的强烈表达，指落入征服者手中并任其掠夺，而不弱化为一般的投降。
- source_word: δούλους
  choice: 沦为奴隶
  rationale: 此处是被征服后遭受强制奴役，不是自愿服侍；“沦为”也传达处境的恶化。
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: 能保住性命
  rationale: 原文直译为“我们的生命将存活”，在此语境中意为性命得以保存；采用自然的汉语习语。
- source_word: τὸν θάνατον τῶν νηπίων ἡμῶν
  choice: 我们幼小的孩子死去
  rationale: νήπια 指年幼的孩子，可包括婴幼儿；“幼小的孩子”保留年龄与悲怆色彩而不过度限定。
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: 亲眼
  rationale: 自然表达直接目睹之意，并保留原文的强调。
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: 生命渐渐消逝
  rationale: ἐκλείπω 描写生命衰竭、消失；此译保留死亡过程的画面感，避免过于临床化。
theological_decisions:
- issue: 征服语境中 δούλους 的身份含义
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文将被奴役与死亡相对照，强调强制性的隶属状态；译作“仆人”会弱化这一点。
- issue: ψυχή 在“ζήσεται ἡ ψυχὴ ἡμῶν”中的含义
  choice: 性命
  alternative: 灵魂
  rationale: 这里讨论投降后免于死亡，ψυχή 指人的生命或性命，并非专门论述灵魂的存续。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“虽然……却……”明确表达成为奴隶与保住性命之间的让步关系；末句保留原文对“幼小的孩子”以及“妻子和儿女”的并列，不擅自合并这两个表述。
