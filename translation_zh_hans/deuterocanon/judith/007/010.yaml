base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: zh_hans
  text: 因为这群以色列子孙[a]所倚靠的，不是自己的长矛，而是他们自己居住其中的群山高处；因为要接近[b]他们山岭的峰顶并不容易。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希腊原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “接近”也可译作“登上”或“进抵”。原文动词可指趋近，也可含有向高处行进的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς οὗτος τῶν υἱῶν Ἰσραήλ
  choice: 以色列的子孙这族人
  rationale: λαός指作为群体的“族人/人民”；υἱῶν Ἰσραήλ直译为“以色列的子孙”。正文保留原文的亲属称谓，并用“这族人”自然呈现同位关系。
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: 所倚靠的，不是自己的长矛
  rationale: πέποιθαν表达已经形成并持续的信赖；“倚靠”准确而自然。δόρασιν特指长矛，不泛化为武器。
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: 而是……山地高处
  rationale: ὕψεσι表示高处或高地；结合ὀρέων，以“山地高处”呈现地形优势，同时避免“丘坛”等宗教性联想。
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: 他们所居住的
  rationale: 原文带有强调且略显重复。汉语以“他们所居住的”保留居住关系和主语强调所需的信息，避免机械重复介词结构。
- source_word: οὐ γὰρ ἔστιν εὐχερές
  choice: 因为……并不容易
  rationale: εὐχερές意为容易、便当；否定式直译为“并不容易”，符合军事判断语境。
- source_word: προσβῆναι
  choice: 登上
  rationale: 该动词可表示走近、到达，也可在山地语境中表示向上进抵；与“山峰”搭配时，“登上”最自然，并在脚注保留“接近”的可能。
- source_word: ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: 他们的山峰
  rationale: κορυφαῖς指山顶或峰顶；“山峰”简洁地保留其地形和战略含义。
