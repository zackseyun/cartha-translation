revisions:
- from: 以色列的子孙[a]向主他们的上帝呼求，因为他们的心灵已经软弱无力[b]；他们所有的仇敌都包围了他们，使他们无法从仇敌中间逃脱。
  to: 以色列子孙[a]向主——他们的上帝——呼求，因为他们的心灵已失去勇气[b]；也因为他们所有的仇敌都包围了他们，他们无法从仇敌中间逃脱。
  rationale: 修订使中文称谓结构更自然，恢复原文两个“因为”所标示的并列原因，并以“心灵已失去勇气”更准确表达ὠλιγοψυχέω而不将πνεῦμα简单收窄为“勇气”。脚注锚点[a]、[b]均保留并与正文对应。
