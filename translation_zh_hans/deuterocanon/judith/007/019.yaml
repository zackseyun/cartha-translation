base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/019.yaml
  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: zh_hans
  text: 以色列子孙[a]向主——他们的上帝——呼求，因为他们的心灵已失去勇气[b]；也因为他们所有的仇敌都包围了他们，他们无法从仇敌中间逃脱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希腊文直译为“以色列的儿子们”，这里是对以色列全体民众的集体称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的心灵已变得怯懦”或“他们已经灰心丧志”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列的子孙
  rationale: 保留希腊文的亲属性集体称谓及其圣经语感；现代汉语通常可简洁地说“以色列人”，故列入脚注。
- source_word: ἀνεβόησαν
  choice: 呼求
  rationale: 此处是人在困境中向上帝发出的急切求告，不只是提高声音喊叫；“呼求”自然体现祷告语境。
- source_word: Κύριον θεὸν αὐτῶν
  choice: 主他们的上帝
  rationale: 按希腊语词序和关系保留“主”这一神圣称号以及“他们的上帝”这一归属表达。
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: 他们的心灵已经软弱无力
  rationale: 保留πνεῦμα的“心灵”意象，同时用“软弱无力”表达ὀλιγοψυχέω所指的气馁、失去勇气；不把它收窄为纯粹的情绪或身体状况。
- source_word: ἐκύκλωσαν
  choice: 包围了
  rationale: 准确表达敌人从四周围困他们的既成处境，现代汉语简洁自然。
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: 使他们无法从仇敌中间逃脱
  rationale: 自然表达希腊文无人能逃脱的非人称结构，并明确“他们”所指的是仇敌，避免现代汉语代词歧义。
theological_decisions:
- issue: κύριος作为神圣称号的译法
  choice: 主
  alternative: 主人
  rationale: 在向以色列之上帝呼求的语境中，κύριος是神圣称号；“主”既忠实又符合汉语圣经传统，“主人”会不当地弱化其功能。
- issue: οἱ υἱοὶ Ἰσραήλ的集体性别与亲属意象
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 原文采用阳性亲属集体表达，正文保留其家族和盟约群体的语感；脚注说明现代汉语的顺畅替代译法，不将其限定为只有男性。
- issue: πνεῦμα在气馁语境中的含义
  choice: 心灵
  alternative: 勇气
  rationale: 正文保留原文“灵”的意象和一定语义张力，而不直接将它解释为“勇气”；脚注给出语境上可能的理解。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“呼求”体现危难中的祷告语境；分号承接原文重复的因果结构，同时避免汉语句子因连续两个“因为”而显得生硬。正文中的[a]、[b]均与脚注对应。
