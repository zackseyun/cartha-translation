  text: And all the rulers of the sons of Esau[a], and all the leaders of the people of Moab, and the generals of the seacoast came to him and said[b],
translation:
  language: zh_hans
  text: 以扫子孙的众统治者[a]、摩押百姓的众领袖，以及沿海地区[b]的众将领，都来到他面前，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以扫子孙”也可译作“以东人”；希腊语采用前一种族群称谓。
    reason: lexical_alternative
  - marker: b
    text: “沿海地区”也可译作“海岸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: 走到他跟前
  rationale: 该词为不定过去时分词，与主句“说”构成先后动作；译文自然表达朝向此人走近的动作，同时避免生硬复制希腊语分词结构。
- source_word: ἄρχοντες
  choice: 统治者
  rationale: 表示掌握权柄的人；“统治者”保留政治权威色彩，并与后面的“领袖”区分。
- source_word: υἱῶν Ἠσαῦ
  choice: 以扫子孙
  rationale: 直译希腊语的族群称谓，不直接以解释性的“以东人”替代。
- source_word: ἡγούμενοι
  choice: 领袖
  rationale: 指带领群体的人；用“领袖”既符合现代汉语，也保留其与ἄρχοντες之间近义而不完全相同的区别。
- source_word: λαοῦ Μωὰβ
  choice: 摩押百姓
  rationale: 简洁而完整地表达“摩押的人民”，符合现代汉语圣经叙事语体。
- source_word: στρατηγοὶ
  choice: 将领
  rationale: 指军事官长；“将领”比特指现代军衔的“将军”更稳妥，也适合古代战争语境。
- source_word: παραλίας
  choice: 沿海地区
  rationale: παραλία可指海岸或沿海地带；“沿海地区”自然地保留其地域含义，不把范围限定为狭窄的海岸线。
- source_word: εἶπαν
  choice: 说
  rationale: 叙事中引出直接引语的常规表达。
theological_decisions: []
