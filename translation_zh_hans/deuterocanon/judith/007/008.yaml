revisions:
- from: 以扫子孙的所有统治者[a]、摩押百姓的所有领袖，以及沿海地区的将领，都走到他跟前，说[b]：
  to: 以扫子孙的众统治者[a]、摩押百姓的众领袖，以及沿海地区[b]的众将领，都来到他面前，说：
  rationale: 修订补出第三组人物所受的“全体”限定，将“走到他跟前”调整为更中性、庄重的“来到他面前”，并将 b 脚注移至“沿海地区”，使之对应 παραλίας 及英文审校轨迹的词汇替代。冒号忠实保留 εἶπαν 引出下一节直接引语的功能。
