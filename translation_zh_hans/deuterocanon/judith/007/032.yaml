  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
translation:
  language: zh_hans
  text: 他把民众遣散到自己的营地，又前往他们城中的城墙和塔楼[a]；他叫妇女和孩子回各自家里。他们在城中陷入极大的困苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的“前往”是单数，最自然是指前文那位遣散民众的人；也有人根据上下文理解为民众去了城墙和塔楼。
    reason: grammatical_ambiguity
  - marker: b
    text: 或译“极大的屈辱中”。希腊文可指人被压到极低的处境，含有困苦、受压或蒙羞的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: 遣散
  rationale: 这里指使聚集的民众分开离去；“遣散”比“驱散”更中性，也符合有人作出安排的语境。
- source_word: λαόν
  choice: 民众
  rationale: 所指包括妇女和孩子，并非仅指军队，因此采用范围较广的“民众”。
- source_word: εἰς τὴν ἑαυτοῦ παρεμβολήν
  choice: 到自己的营地
  rationale: 保留 παρεμβολή 的军事含义，并按 ἑαυτοῦ 的字面反身意义译出“自己的”；希腊文没有明确表达“各自”。
- source_word: ἀπῆλθεν
  choice: 又去了
  rationale: 现存希腊文本使用第三人称单数，最直接的语法理解是继续以先前行动者为主语；不因上下文可能暗示民众行动而擅自改成复数。
- source_word: τείχη καὶ τοὺς πύργους
  choice: 城墙和城楼
  rationale: “城墙”准确表达防御工事；“城楼”在现代中文中比单独的“塔”更贴合城防建筑语境。
- source_word: ἀπέστειλεν
  choice: 叫……回
  rationale: 目的地是各自家中，中文用“叫……回”自然地表达差遣，不额外加入强制意味。
- source_word: ἐν ταπεινώσει πολλῇ
  choice: 陷入极深的困苦之中
  rationale: 该短语表示被压到极低、处于苦难或屈辱状态；结合缺水围城的语境，“极深的困苦”自然且保留受压低沉之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以希腊文本的单数动词为正文依据，同时用脚注保留上下文可能支持的复数理解；末句用“困苦”贴合围城缺水的处境，并注明“屈辱”这一词义可能。
