base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: zh_hans
  text: 第二天，荷罗孚尼命令他的全军，以及所有前来加入他联盟的人[a]拔营，向伯图利亚进发，抢先占领山区的上行通道，并与以色列子孙[b]开战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有前来与他结盟的人。”希腊文直译为“那些来到他的联盟的人”。
    reason: 保留ἐπὶ τὴν συμμαχίαν αὐτοῦ在关系表达上的含混性。
  - marker: b
    text: 或译：“以色列人。”希腊文作“以色列的儿子们”，是传统的家族性称谓。
    reason: 说明原文惯用称谓及其较自然的现代汉语译法。
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 准确表达接续前文的时间关系，符合现代汉语叙事习惯。
- source_word: παρήγγειλεν
  choice: 命令
  rationale: 该动词表示发出具有权威性的指令；军事语境中译作“命令”简洁明确。
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: 他的全军
  rationale: στρατεία在此指军队整体，而不是军事行动或战役。
- source_word: παντὶ τῷ λαῷ αὐτοῦ οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: 所有前来加入他联盟的人
  rationale: 保留λαός较“军队”宽泛的范围，并以自然汉语表达这些人为支持荷罗孚尼的联盟而来；脚注保留原文关系表达的另一种理解。
- source_word: ἀναζευγνύειν
  choice: 拔营
  rationale: 该词在军事语境中指撤起营地并出发，“拔营”兼顾具体动作和行军含义。
- source_word: ἐπὶ Βαιτυλουὰ
  choice: 向伯图利亚进发
  rationale: ἐπί与移动动词连用表示朝向目的地；敌对含义已由后文“开战”明确，无须在此重复加入。
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: 山区的上行通道
  rationale: ἀναβάσεις本义为上升处或上山路线；此译保留地形和军事通路的含义，避免把它过度限定为狭窄的“山口”。
- source_word: προκαταλαμβάνεσθαι
  choice: 抢先占领
  rationale: 表达该复合动词所含的预先采取行动、先行占据之意，也符合军事语境。
- source_word: ποιεῖν πόλεμον πρὸς
  choice: 与……开战
  rationale: 自然表达“进行战争、向某方作战”的希腊语惯用结构。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留原文传统的家族性称谓，同时在现代汉语圣经语体中清楚可懂。
theological_decisions:
- issue: 如何翻译族群兼传统家族称谓τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文直译为“以色列的儿子们”，在此是对以色列群体的传统称呼。“以色列子孙”保留家族性表达，又不把所指误限于直接的男性后代；脚注列出更通顺的族群称谓。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保持军事叙事的紧凑节奏。“拔营”“抢先占领”“开战”符合上下文；“上行通道”保留原文地形意象。专名按现代汉语音译处理。
