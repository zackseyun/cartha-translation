  yaml_path: translation/deuterocanon/judith/007/003.yaml
  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: zh_hans
  text: 他们在伯图利亚附近的山谷[a]里、泉水旁安营；营地横向朝多泰延伸，直到贝尔拜，纵向则从伯图利亚一直延伸到基亚蒙；基亚蒙在以斯德伦对面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“αὐλών”在某些语境中可指“院子”或“庭院”，但这里的地理环境以及附近提到的泉水和各处地名表明，它指的是“山谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: 安营
  rationale: 该动词在军事语境中指军队扎营；“安营”自然、庄重，也准确体现其行动。
- source_word: ἐν τῷ αὐλῶνι
  choice: 在山谷里
  rationale: αὐλών虽可指院落，但本句列举城镇、泉水和地理方位，显然指谷地或山间谷地；“山谷”最符合上下文。
- source_word: πλησίον Βαιτυλουὰ
  choice: 伯图利亚附近
  rationale: πλησίον在此表达空间上的邻近；地名按希腊文音译。
- source_word: ἐπὶ τῆς πηγῆς
  choice: 泉水旁
  rationale: πηγή指泉或泉源；结合ἐπί的地点用法，“泉水旁”简明自然。
- source_word: παρέτειναν
  choice: 延伸
  rationale: 该动词描述营地所占范围向外伸展；“延伸”适合正式地理叙述，并与横向、纵向搭配自然。
- source_word: εἰς εὖρος
  choice: 横向
  rationale: 此短语表示营地宽度方向，与后文εἰς μῆκος形成两种维度的对照；“横向”在现代汉语中清楚自然。
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: 朝多泰延伸，直到贝尔拜
  rationale: ἐπί在此表示方向，ἕως标明界限；译文保留“朝……直到……”的次序，避免擅自把多泰解释为起点。
- source_word: εἰς μῆκος
  choice: 纵向
  rationale: 表示长度方向，与“横向”对应，清楚呈现营地的第二个维度。
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: 从伯图利亚一直延伸到基亚蒙
  rationale: 希腊文连续使用两个ἕως，表达营地长度所跨的范围。汉语以“从……到……”自然呈现，但首个“从”是依语义补出。
- source_word: ἀπέναντι Ἐσδρηλών
  choice: 在以斯德伦对面
  rationale: ἀπέναντι表示相对、面对的位置；“在……对面”既简洁又适合地理说明。
