  text: for from there all who live in Baithyloua draw water[a], and thirst will destroy them, and they will surrender their city; and we and our people will go up to the nearby summits of the mountains,
translation:
  language: zh_hans
  text: 因为所有住在拜图路亚的人都从那里取水[a]；干渴必置他们于死地，他们就会交出他们的城；而我们和我们的百姓要登上附近山岭的峰顶，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
