    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 承接上文，为先前提出的策略说明理由；现代汉语中“因为”自然保留解释关系。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 回指前文提到的水源，直接保留空间来源义。
- source_word: ὑδρεύονται
  choice: 取水
  rationale: 准确表达取得、汲取用水之意，也符合现代汉语习惯。
- source_word: πάντες οἱ κατοικοῦντες Βαιτυλουά
  choice: 所有住在拜图路亚的人
  rationale: 保留πάντες的全称范围，并以自然的定语结构表达居民群体。
- source_word: Βαιτυλουά
  choice: 拜图路亚
  rationale: 按希腊文Βαιτυλουά直接音译，不以传统英语名称Bethulia为底本。
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  choice: 干渴必置他们于死地
  rationale: ἀναιρέω在此表示杀死或除灭；以“置……于死地”保留其严重程度及“干渴”作为施事者的拟人表达。
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  choice: 他们就会交出自己的城
  rationale: 军事语境中指因困乏而将城交给敌方；“交出”比“投降”更贴近动词与直接宾语“城”的结构。
- source_word: ἀναβησόμεθα
  choice: 要登上
  rationale: 保留向上移动的空间意义；语境虽有军事行动意味，但不额外加入“进军”。
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  choice: 附近的山峰
  rationale: 自然简洁地表达邻近山岭的峰顶；中文“山峰”已同时涵盖κορυφάς与τῶν ὀρέων的地貌信息。
