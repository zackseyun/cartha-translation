  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: zh_hans
  text: 就在那一天，他们所有的勇士都拔营[a]了。他们的作战兵力共有步兵十七万、骑兵一万二千；此外还有辎重，以及在他们当中徒步而行的人[b]，人数极其众多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拔营”也可译作“启程”或“动身”。
    reason: lexical_alternative
  - marker: b
    text: “此外还有辎重，以及在他们当中徒步而行的人”所对应的希腊文句法较难确定；可能是指军队的辎重以及随行的大批徒步人员，不包括在前述作战兵员总数之内。
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: 拔营
  rationale: 该动词在军事语境中常指撤收营地并启程；“拔营”简洁自然，同时保留行动起点的营地背景。
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: 他们所有的勇士
  rationale: δυνατός 在此军事语境中指有能力、有战力的人；“勇士”保留阳性人物及武勇色彩，避免泛化为普通士兵。
- source_word: ἡ δύναμις αὐτῶν ἀνδρῶν πολεμιστῶν
  choice: 他们由战士组成的军力
  rationale: “军力”对应 δύναμις 在列举兵员时的具体军事含义；“由战士组成”保留 ἀνδρῶν πολεμιστῶν 的属格关系而不使中文过分生硬。
- source_word: πεζῶν
  choice: 步兵
  rationale: 与后文骑兵相对，明确指徒步作战的兵员；“步兵”是现代中文最自然准确的军事称谓。
- source_word: ἵππων
  choice: 骑兵
  rationale: 虽字面与“马”有关，但与步兵并列并按数目统计，语境所指是乘马作战的兵员。
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: 此外还有辎重
  rationale: ἀποσκευή 指军队随行的行李、装备或辎重；“辎重”符合军事语境，也不擅自限定为某一种运输编制。
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: 以及他们中间徒步的人
  rationale: 原文此处句法艰涩。译文保留这些徒步者与军队或辎重之间关系的不确定性，不把他们武断地归为已统计的步兵或专门的辎重人员。
- source_word: πλῆθος πολὺ σφόδρα
  choice: 人数极其众多
  rationale: 保留 πολὺ σφόδρα 的强烈程度，同时以自然现代汉语表达附随人群规模庞大。
