base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/012.yaml
  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: zh_hans
  text: 你要留在营中，确保你军中每个人的安全，并让你的部下[a]控制那从山脚[b]流出的水泉，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆从”。希腊词可指仆人、侍从或下属；这里处于军事语境中。
    reason: lexical_alternative
  - marker: b
    text: 直译“山根”，是指山的底部或山脚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: 留在
  rationale: 该命令式表示继续待在某处；“留在”自然表达驻守不动的军事指令，不额外强调等候。
- source_word: παρεμβολῆς
  choice: 营中
  rationale: 在军事语境中指营地；结合介词译为“在营中”，符合现代汉语习惯。
- source_word: ἀσφαλίζων
  choice: 确保……的安全
  rationale: 该分词表示使人稳妥、安全；此译保留主动保障的含义，同时避免擅自具体化为某一种警戒或部署行动。
- source_word: πάντα ἄνδρα ἐκ τῆς δυνάμεώς σου
  choice: 你军中每个人
  rationale: πάντα ἄνδρα具有逐一、周全的意味；δύναμις在此指军队而非抽象力量。“军中每个人”以自然汉语保留其范围。
- source_word: ἐπικρατησάτωσαν
  choice: 控制
  rationale: 该动词表示取得并掌握控制权；“控制”简明表达此处针对水源的战术目标。
- source_word: οἱ παῖδές σου
  choice: 你的部下
  rationale: παῖδες可指仆人、侍从或下属；军事语境下“部下”最自然，同时以脚注保留其词义弹性。
- source_word: πηγῆς τοῦ ὕδατος
  choice: 水泉
  rationale: 指具体涌水的泉源；“水泉”保留原文的具体地貌意象。
- source_word: ἡ ἐκπορεύεται
  choice: 流出的
  rationale: 原词基本义为出来、发出；用于泉水时“流出”是自然且不失准确的汉语表达。
- source_word: ῥίζης τοῦ ὄρους
  choice: 山脚
  rationale: 字面为“山的根”，在地形表述中指山的底部；“山脚”是现代汉语的对应习语。
theological_decisions: []
