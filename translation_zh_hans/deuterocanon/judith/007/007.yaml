  register: 采用现代、庄重而清楚的叙事语体。保留山城上行道路、水泉争夺及军事驻守等具体细节；对罕见动词 ἐφώδευεν 不沿用缺乏充分依据的“加固”，而保留其巡行察看的基本意义。
