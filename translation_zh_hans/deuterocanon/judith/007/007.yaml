  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: zh_hans
  text: 他察看了通往他们的城的上坡道路[a]，又巡查水泉[b]，抢先将其占据，并在那些水泉旁部署了战士的营队；他本人则拔营，回到自己的人那里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的城的上行通道”。原文强调通往该城的道路需要向上攀行。
    reason: lexical_alternative
  - marker: b
    text: “巡查”所译的希腊词较少见，也可理解为“巡行察看”或“巡视”。
    reason: lexical_ambiguity
  - marker: c
    text: “拔营”所译的希腊词也可泛指“启程”或“开拔”；这里的方向是回到他自己的人那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: 察看
  rationale: 在军事语境中指实地查看、勘察，不取通常可能含有的“探望”义。
- source_word: ἀναβάσεις
  choice: 上坡道路
  rationale: 原词直指“上行之处、上坡通道”；结合山城语境，译作“上坡道路”既保留地形信息，也符合现代汉语。
- source_word: πηγὰς τῶν ὑδάτων
  choice: 水泉
  rationale: 保留具体的泉源意象；此处所指是具有战略意义的供水地点。
- source_word: ἐφώδευεν
  choice: 巡查
  rationale: 这是较罕见的动词，可指巡行、巡察；按其与水泉及后续占据行动的搭配，译作“巡查”而不武断加入筑垒之意。
- source_word: προκατέλαβε
  choice: 抢先将其占据
  rationale: 前缀 προ- 表明先行或抢先采取行动，καταλαμβάνω 在此表示占据战略地点。
- source_word: ἐπέστησεν
  choice: 部署
  rationale: 在军事语境中表示将兵力设置、安置在指定地点，“部署”自然且准确。
- source_word: παρεμβολὰς ἀνδρῶν πολεμιστῶν
  choice: 战士的营队
  rationale: παρεμβολή 可指营寨、军营或驻营部队；“营队”同时传达成建制驻扎的军事力量，并保留原文复数意义。
- source_word: ἀνέζευξεν
  choice: 拔营，回到
  rationale: 该动词本义含收营启程、开拔之意；与目的地短语连用，译出“拔营”并明确其返回行动。
- source_word: λαὸν αὐτοῦ
  choice: 自己的人马
  rationale: λαός 本可指人民、众人；在军旅上下文中指其所属队伍。“人马”保留群体含义而不把原词过度限定为正规军。
