  yaml_path: translation/deuterocanon/judith/008/013.yaml
  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: zh_hans
  text: 如今，你们查究全能的主[a]，而你们永远也不会明白任何事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查究”也可译作“试探”或“审察”。
    reason: lexical_alternative
  - marker: b
    text: “永远”直译为“直到那世代／永世”；这里是表示持续到底的惯用说法，可指“永远”或“始终”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: 查究
  rationale: 此词表示仔细探查、审察；语境中带有责备意味。“查究”既保留试图探明上帝的含义，也不把它限定为“试探”这一较强的含义。
- source_word: κύριον Παντοκράτορα
  choice: 全能的主
  rationale: κύριος在这里是对上帝的称号，译作“主”；Παντοκράτωρ译作现代中文中庄重而通行的“全能的”。
- source_word: οὐθὲν
  choice: 什么也不
  rationale: 以自然的汉语否定结构表达“不明白任何事／一无所知”，不擅自补出具体宾语。
- source_word: ἐπιγνώσεσθε
  choice: 能明白
  rationale: 此处指经过查究仍不能获得真正的认识或理解；“明白”贴合上下文，“能”与全句的否定结构构成自然现代汉语。
- source_word: ἕως τοῦ αἰῶνος
  choice: 永远
  rationale: 该短语字面为“直到那世代／时代”，在此用作持续时间的惯用表达；“永远”自然传达其不限期的语力。
theological_decisions:
- issue: 次经希腊语语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 该词与“全能的”合用，明确构成对上帝的称号；“主”既准确又符合中文宗教语体。
- issue: ἐξετάζετε所表达的人对上帝的探究
  choice: 查究全能的主
  alternative: 试探全能的主；察验全能的主
  rationale: 经文责备人妄图探明上帝。“查究”保留审察、探究与可能的试验意味，却不把歧义收窄为诱惑或考验上帝。
- issue: οὐθὲν的指涉范围
  choice: 什么也不能明白
  alternative: 不能明白关于上帝的任何事
  rationale: 希腊文没有明说“关于上帝”，因此不在正文中补足，以保留原文简洁而宽泛的断言。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“竟要”传达责备和反诘语气；后半句使用“什么也不能明白”的自然否定结构，同时保持原文没有明说宾语范围的特点。
