  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: zh_hans
  text: 现在，弟兄们[a]，让我们向我们的弟兄表明：他们的性命[b]系于我们，圣物、殿宇和祭坛也都倚靠我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为包括“弟兄姊妹们”；希腊文在语法上是阳性复数。
    reason: 词义与所指范围的另一种理解
  - marker: b
    text: “性命”或译“灵魂”；这里最可能指他们的生命或存亡。
    reason: 词义的另一种译法
lexical_decisions:
- source_word: ἀδελφοί / τοῖς ἀδελφοῖς ἡμῶν
  choice: 弟兄们 / 我们的弟兄
  rationale: 保留希腊文阳性复数的亲族称谓及前后呼应；此处也可能泛指共同体中的弟兄姊妹，因此附注说明。
- source_word: ἐπιδειξώμεθα
  choice: 让我们……表明
  rationale: 表达劝勉虚拟语气，并保留以行动显明、证明的意味。
- source_word: ἐξ ἡμῶν κρέμαται
  choice: 系于我们
  rationale: 保留“悬系于”的鲜明比喻，同时符合现代汉语表达；未直接淡化为“取决于我们”。
- source_word: ἡ ψυχὴ αὐτῶν
  choice: 他们的性命
  rationale: 语境关乎群体在危难中的存亡；“性命”比“灵魂”更准确，又保留希腊文集合性的单数表达。
- source_word: τὰ ἅγια
  choice: 圣物
  rationale: 保留中性复数所指的神圣之物，不将其与随后单列的殿宇或祭坛合并。
- source_word: ὁ οἶκος
  choice: 殿宇
  rationale: 原文直译为“房屋”，在祭祀语境中指圣殿；“殿宇”自然且仍贴近“房屋”的意象。
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: 采用清楚、通行的礼仪用语。
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: 倚靠我们
  rationale: 传达完成时所表示的当前支撑、依赖状态，并与前句“系于我们”形成修辞呼应而不完全重复。
theological_decisions:
- issue: 直接称呼中的性别化亲族用语
  choice: 弟兄们
  alternative: 弟兄姊妹们；同胞们
  rationale: 希腊文形式为阳性复数，正文保留其形式与亲族意象；因其可能包含整个共同体，脚注保存包容性理解。
- issue: ψυχή指“性命”还是“灵魂”
  choice: 性命
  alternative: 灵魂
  rationale: 上下文强调众人的生存安危，并非对灵魂本体作神学陈述；译作“性命”可避免加入原文未明说的人论含义。
- issue: τὰ ἅγια的所指
  choice: 圣物
  alternative: 圣所；神圣之物
  rationale: 原文采用中性复数，且另列殿宇和祭坛；“圣物”保存各项之间的区别，不把含义限定为圣所。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“系于我们”保存原文悬系的比喻，“倚靠我们”则表达圣物、殿宇和祭坛处于受他们支撑的状态。
