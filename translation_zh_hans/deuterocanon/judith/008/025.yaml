  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: zh_hans
  text: 尽管有这一切，我们还是要感谢主我们的上帝；他正在考验我们，正如他也曾考验我们的先祖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “考验”也可译作“试炼”；这个希腊词在某些语境中也可表示“试探”，但此处指上帝检验他的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: 尽管有这一切
  rationale: 结合上下文取让步义，表达在当前种种困境之中仍当感谢上帝；比“除此以外”更符合本句劝勉的语势。
- source_word: εὐχαριστήσωμεν
  choice: 我们还是要感谢
  rationale: 第一人称复数劝勉虚拟式；“我们还是要”自然体现共同劝勉，并与前面的让步语形成呼应。
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: 主我们的上帝
  rationale: 完整保留神圣称号、所属关系及希腊语同位结构，语言庄重而清楚。
- source_word: πειράζει
  choice: 正在考验
  rationale: 本处以上帝为主语，语境指借困境检验其子民；用“考验”保留试炼之义，进行体则体现当下持续的处境。
- source_word: καθὰ καὶ
  choice: 正如……也
  rationale: 同时保留比较关系及καί的附加语气，把上帝现在的作为与从前对待先祖的方式相连。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 我们的先祖
  rationale: πατέρες在此指以色列从前世代的祖先；现代汉语“先祖”准确自然，并未消除其祖辈含义。
theological_decisions:
- issue: 上帝作主语时πειράζει的含义
  choice: 考验
  alternative: 试探
  rationale: 上下文鼓励人在患难中感恩，并类比上帝对先祖的作为，因此这里主要是检验、试炼之意；“试探”容易引入诱使人犯罪的含义。译文仍保留上帝使其子民经历考验的神学张力。
- issue: παρὰ ταῦτα πάντα的关系
  choice: 让步义：“尽管有这一切”
  alternative: 附加义：“除此以外”
  rationale: 介词短语本身可容许不同关系，但在本段劝人在危难中感谢上帝的论述中，让步理解更连贯。
- issue: τοὺς πατέρας ἡμῶν的指称
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 此处所指并非仅上一代父辈，而是以色列从前的祖先；“先祖”在现代汉语中更准确地传达这一历史群体。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“尽管有这一切”承接困境，“我们还是要”体现共同劝勉。“正在考验”保留希腊语现在时在当前处境中的持续感。脚注标记置于相关分句之后。
