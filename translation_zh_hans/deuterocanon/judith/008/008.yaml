  text: And there was no one who brought an evil word against her, because she feared God greatly.
translation:
  language: zh_hans
  text: 没有人说过她的坏话，因为她十分敬畏上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν
  choice: 说过她一句坏话
  rationale: 该短语直译为“把恶言加在她身上”，在此表示说对她不利或毁谤她的话；译作“说过她一句坏话”既保留针对她发言的含义，也符合现代汉语习惯。
- source_word: ἐφοβεῖτο τὸν θεὸν
  choice: 敬畏上帝
  rationale: “敬畏”准确表达 φοβέομαι 在人与上帝关系中的敬重、畏惧和虔诚，不弱化为单纯的“尊敬”，也不误解为仅仅“害怕”。
- source_word: σφόδρα
  choice: 十分
  rationale: 表达程度很高，语言自然庄重，与原文“极其、非常”的强调相称。
theological_decisions:
- issue: “惧怕上帝”的宗教含义
  choice: 敬畏上帝
  alternative: 非常害怕上帝
  rationale: 上下文是在说明友第德无可指摘的品格；“敬畏上帝”保留原词所含的畏惧，同时体现其虔敬含义，不加入宗派性解释。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“没有人说过她一句坏话”自然传达原文无人以恶言攻击她的意思；不增添原文没有明说的“控告”“毁谤”等法律性或动机性限定。
