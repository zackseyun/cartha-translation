  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: zh_hans
  text: 她的丈夫玛拿西，是她本支派、本宗族的人[a]；他在收割大麦的时节死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“是她本支派、本父家的人”。希腊文区分“支派”（φυλή）与范围较小的亲属群体“宗族”或“父家”（πατριά）。
    reason: 词义备选
lexical_decisions:
- source_word: ἀνήρ
  choice: 丈夫
  rationale: 与属格代词αὐτῆς连用时，语境中的自然关系义是“她的丈夫”，而非泛指“男人”。
- source_word: Μανασσης
  choice: 玛拿西
  rationale: 按现代中文圣经人名的通行译法音译该名字。
- source_word: φυλή
  choice: 支派
  rationale: 在犹太谱系语境中指以色列的支派；“支派”是现代中文圣经语体中准确而自然的对应词。
- source_word: πατριά
  choice: 宗族
  rationale: 指支派之下较小的父系亲属群体；“宗族”既表达共同祖系，也与“支派”清楚区分。
- source_word: ἐν ἡμέραις
  choice: 在……的日子
  rationale: 保留希腊文常见时间表达的形式和叙事语气，同时中文仍清楚可懂。
- source_word: θερισμοῦ κριθῶν
  choice: 收割大麦
  rationale: 属格κριθῶν说明所收割的作物；译作“收割大麦”自然地保留农业活动及其时节含义。
