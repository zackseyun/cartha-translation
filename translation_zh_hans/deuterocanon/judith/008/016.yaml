  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: zh_hans
  text: 但你们不要把主——我们的上帝的计划当作抵押品[a]，因为上帝不像人，可以受威吓；也不像人子[b]，可以被说服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要把主——我们的上帝的计划当作质押品或担保。”希腊文使用质押、担保的意象。
    reason: lexical_alternative
  - marker: b
    text: 这里“人子”是受希伯来语表达方式影响的说法，意思是“人”，并非弥赛亚称号。
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: 拿……作抵押
  rationale: 该动词带有以物作质押、担保的法律和交易意象。直译为“拿……作抵押”既保留原文图像，也让上下文中人试图用条件或期限约束上帝计划的意味自然显出，而不改写成“试探”。
- source_word: βουλάς
  choice: 计划
  rationale: βουλή可指谋划、旨意或计划；“计划”是清楚自然的现代汉语，并保留原文所指上帝拟定之行动安排的开放性。
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: 主我们上帝
  rationale: 依照希腊语结构保留κύριος“主”与“我们上帝”的关系；此表达庄重且可懂，避免将“主”省略。
- source_word: ἀπειληθῆναι
  choice: 受威吓
  rationale: 被动不定式表示受到威胁或恫吓；“受威吓”简洁地表达外在压力试图迫使对方行动的意思。
- source_word: διαπεισθῆναι
  choice: 被说服
  rationale: 该被动不定式表示被劝服、被促使改变决定；“被说服”直接对应原词，并与前面的“受威吓”形成平行。
- source_word: υἱὸς ἀνθρώπου
  choice: 人的儿子
  rationale: 保留原文受闪语影响的字面修辞及其与“人”的平行，同时用脚注说明这里泛指人类，防止误读为弥赛亚称号。
theological_decisions:
- issue: 上帝与人的拟人化对比
  choice: 保留原文的双重平行：上帝不像人可以受威吓，也不像人的儿子可以被说服。
  alternative: 意译为“上帝不是人，不能受威胁或被操纵”。
  rationale: 希腊文明确以“人／人的儿子”和两个被动不定式构成对仗。保留这一结构可呈现人无法借压力或劝说左右上帝的重点，同时不把经文扩展为更宽泛的教义论断。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。正文保留“抵押”意象及“人／人的儿子”的修辞平行；脚注解释其词汇和文化含义。
