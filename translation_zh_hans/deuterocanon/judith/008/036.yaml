  text: 他们从帐篷转身离开，前往各自的岗位[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各自的位置”或“各自的驻地”。这里的希腊词也可泛指有秩序的安排或指定的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: 转身离开
  rationale: 这是不定过去时分词，表示先于主要动词发生的动作；“转身离开”既保留转身离去的动作，也不把它过度解释为固定的告别用语。
- source_word: σκηνῆς
  choice: 帐棚
  rationale: σκηνή通常指帐棚；本节所指是叙事场景中的帐棚，并非敬拜用的会幕。
- source_word: ἐπορεύθησαν
  choice: 前往
  rationale: 这是常见的行进动词；“前往”符合现代汉语叙事语体，并清楚表达朝指定地点移动。
- source_word: διατάξεις
  choice: 指定的位置
  rationale: διάταξις可指安排、部署或指定的站位；与ἐπὶ加宾格连用时，此处最自然地表示他们各自受派所在的位置，同时以脚注保留较宽泛的词义。
- source_word: αὐτῶν
  choice: 各自
  rationale: 代词指向本句的复数主语；汉语用“各自”自然表达每个人所属或受派的位置。
