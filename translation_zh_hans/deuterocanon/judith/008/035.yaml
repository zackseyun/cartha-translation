  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: zh_hans
  text: 乌西雅和众首领对她说：“平安地去吧！愿主上帝走在你前面，向我们的仇敌施行报应。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 普通叙事动词；译作“说”自然准确，不额外加入“回答”的语义。
- source_word: Ὀζίας
  choice: 乌西雅
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: οἱ ἄρχοντες
  choice: 众首领
  rationale: 指掌权者；“首领”保留其权威身份，又不武断限定具体官职。
- source_word: Πορεύου εἰς εἰρήνην
  choice: 平安地去吧
  rationale: 保留临行祝福的惯用表达，并以现代汉语自然呈现命令语气。
- source_word: Κύριος ὁ θεὸς
  choice: 主上帝
  rationale: 原文没有物主代词；“主上帝”直接对应这一称谓，也不把希腊文未明说的四字神名译入正文。
- source_word: ἔμπροσθέν σου
  choice: 走在你前面
  rationale: 字面为“在你前面”；上下文含行动和引领之意，“走在你前面”自然保留这一意象。
- source_word: εἰς ἐκδίκησιν
  choice: 施行报应
  rationale: 在战争和敌对语境中，此词表示针对仇敌的惩罚性行动；“施行报应”既保留其严厉力度，也比现代汉语中的“复仇”较少暗示私人泄愤。
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: 为我们向仇敌
  rationale: 该属格与ἐκδίκησιν相连，可理解为报应所针对的对象；中文以“向仇敌”表达对象，并以“为我们”传达“我们的”所表明的群体关系。
theological_decisions:
- issue: 次经希腊文本中κύριος的译法
  choice: 主
  alternative: 耶和华；主人
  rationale: 按希腊原文译为“主”，不在原文未直接写出四字神名之处擅自补入“耶和华”。
- issue: ἐκδίκησις的语义力度
  choice: 报应
  alternative: 伸冤；复仇；惩罚
  rationale: 军事拯救语境支持惩罚敌人的含义。“报应”保留神施行公正惩治与报复性行动之间的张力，不将其弱化为抽象的“正义”，也不限定为人的私人复仇。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“平安地去吧”保留祝福公式；“走在你前面”保留原文空间意象及隐含的引领意味。正文不设脚注，因为“施行报应”已能较好承载ἐκδίκησις在本处的语义范围。
