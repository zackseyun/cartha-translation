  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: zh_hans
  text: 如今，你们是什么人，竟在今日试探上帝，并在人间[b]替上帝行事[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替上帝行事”所译的希腊语表达很简略，也可理解为“代表上帝行事”；结合上下文，也可能含有“取代上帝的位置”或“把自己置于上帝之上”的责备意味。
    reason: alternative_reading
  - marker: b
    text: “人间”原文直译为“人的众子”，是指世上必死之人的闪语式表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσατε
  choice: 试探
  rationale: πειράζω可指试验、考验或试探；这里责备人以僭妄的方式检验上帝，并非诱使上帝作恶。“试探上帝”既符合语境，也保留了原文的负面语气。
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: 在今天
  rationale: 原文用较完整的时间短语强调“今日”。汉语“在今天”比单说“今天”稍显郑重，又不至于生硬。
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: 取代上帝的位置
  rationale: 此处短语高度压缩，ὑπέρ通常可表示“为、代表”，语境却是在责备众首领为上帝规定期限，仿佛占据上帝的地位。正文采用合乎语境的表达，同时以脚注保留“代表上帝”及“凌驾于上帝之上”等可能理解。
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: 在人类中间
  rationale: 字面为“在人之子中间”，是闪语式表达，泛指必死的人类。现代汉语以“在人类中间”清楚传达其习语意义，字面形式收入脚注。
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: 你们究竟是什么人
  rationale: 这是尖锐的反问。“你们究竟是什么人”比单纯“你们是谁”更自然地传达责问语气，同时没有扩展成“你们以为自己是谁”。
theological_decisions:
- issue: 责备与上帝权柄之间的关系
  choice: 听者擅自占据只属于上帝的位置
  alternative: 听者代表上帝说话，或把自己置于上帝之上
  rationale: 上下文表明，他们给上帝规定行动期限，因而是在僭取上帝的权柄。然而原文ὑπέρ的结构压缩且可有多种理解，正文不采用更强的“凌驾于上帝之上”，脚注则保留这些真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“如今”和“究竟”保留原句尖锐、郑重的反问语气；不在正文中强行消除末句的神学与语法张力，而用脚注注明可成立的其他理解。
