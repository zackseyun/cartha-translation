  text: For this reason our fathers were handed over to the sword and to plundering, and they fell in a great slaughter before our enemies.
translation:
  language: zh_hans
  text: 因此，我们的祖先被交在刀剑和劫掠之下，并在我们的仇敌面前大批倒毙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“倒下，成了一大片尸体（或尸堆）”；这是形容许多人被杀的凝缩说法。
    reason: 说明πτῶμα μέγα不寻常的字面尸体意象，以及正文“大批倒毙”对其战场死亡规模的语境译法。
lexical_decisions:
- source_word: ὧν χάριν
  choice: 因此
  rationale: 这是表示原因和结果的惯用语；“因此”简洁自然，并保留与上文的因果联系。
- source_word: ἐδόθησαν
  choice: 被交在……之下
  rationale: 保留希腊文被动语态，表达被交付于敌对势力和灾祸，而非中性的“被给予”。
- source_word: εἰς ῥομφαίαν καὶ εἰς διαρπαγήν
  choice: 在刀剑和劫掠之下
  rationale: “刀剑”代指战争中的杀戮，“劫掠”指财物遭抢夺；此译法保留两个并列灾祸及介词结构的共同支配关系。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 此处指以色列历史上的先辈；现代汉语“祖先”准确表达群体的祖辈身份，也比字面译作“父亲们”自然，不改变希腊文的历史指向。
- source_word: ἔπεσον
  choice: 倒毙
  rationale: 兼顾“倒下”的形象与战场死亡的语境，比单用“倒下”更明确。
- source_word: πτῶμα μέγα
  choice: 大批
  rationale: 该短语字面近于“一个巨大的倒毙之体／尸体”，在语境中表达死者众多；“大批倒毙”以自然汉语传达其集体惨死之意，字面压缩形式则由脚注说明。
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: 在我们的仇敌面前
  rationale: 直接保留ἐνώπιον的空间性和公开受败含义，语体庄重自然。
theological_decisions:
- issue: 祖辈称谓的处理
  choice: 我们的祖先
  alternative: 我们的父辈
  rationale: 希腊文πατέρες在此为群体历史语言，所指是先祖而非说话者的直接父辈；“祖先”在现代汉语中准确、自然，也未引入额外神学限定。
- issue: πτῶμα μέγα的解释
  choice: 大批倒毙
  alternative: 倒下成为一大片尸体
  rationale: 原文表达高度凝缩，既有“倒下／尸体”的词象，也强调死亡规模。“大批倒毙”保留战场惨死和人数众多的核心意义；脚注同时保存原文字面张力，避免把它定解为单纯的“失败”或抽象“灾祸”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“刀剑和劫掠”保留经文意象；“大批倒毙”避免生硬照译，同时以脚注保存希腊文的异常表达。
