  text: And in those days Judith heard[a], the daughter of Merari son of Ox son of Joseph son of Oziel son of Elkiah son of Eliou son of Chelkias son of Eliab son of Nathanael son of Salamiel son of Sarasadai son of Israel.
translation:
  language: zh_hans
  text: 在那些日子，友弟德听见了；她是米拉里的女儿，米拉里是俄克斯的儿子，俄克斯是约瑟的儿子，约瑟是奥齐埃尔的儿子，奥齐埃尔是埃尔基亚的儿子，埃尔基亚是埃利乌的儿子，埃利乌是凯尔基亚的儿子，凯尔基亚是埃利亚布的儿子，埃利亚布是拿但业的儿子，拿但业是撒拉米埃尔的儿子，撒拉米埃尔是撒拉撒代的儿子，撒拉撒代是以色列的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段家谱中的若干名字采用希腊文形式；在希伯来传统中可能对应较熟悉的名字，例如“奥齐埃尔”可能对应“乌薛”，“撒拉撒代”可能对应“苏利沙代”。正文依从现存希腊文本，没有把这些名字一律还原为推测的希伯来文形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 直接保留“听见、得闻”的基本意义，也不在本节中擅自补出希腊文未明说的宾语。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 保留原文常见的叙事时间表达及其庄重节奏；比“当时”更贴近形式。
- source_word: θυγάτηρ
  choice: 女儿
  rationale: 按原文直译亲属称谓。
- source_word: υἱοῦ
  choice: 是……的儿子
  rationale: 希腊文反复使用明确的父子谱系格式；中文展开重复，可避免连续“某某之子”造成关系不清。
- source_word: Ἰουδεὶθ
  choice: 友弟德
  rationale: 采用中文圣经传统中对本书主人公较通行的名称。
- source_word: Μεραρὶ / Ὢξ / Ἰωσὴφ / Ὀζιὴλ / Ἐλκεία / Ἠλειοὺ / Χελκείου / Ἐλεὰβ / Ναθαναὴλ / Σαλαμιὴλ / Σαρασαδαὶ / Ἰσραήλ
  choice: 米拉里 / 俄克斯 / 约瑟 / 奥齐埃尔 / 埃尔基亚 / 埃利乌 / 凯尔基亚 / 埃利亚布 / 拿但业 / 撒拉米埃尔 / 撒拉撒代 / 以色列
  rationale: 以所据希腊文本的姓名形式为主进行现代汉语音译；对约瑟、拿但业、以色列等已有稳定中文形式的名字沿用通行译名，而不一概逆推为假定的希伯来文形式。
