base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/003.yaml
  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: zh_hans
  text: 因为他恰巧在田间捆扎一捆禾，灼热的风[a]临到他头上；他便倒在床上，死在自己的城伯图利亚。人们把他葬在多太音和巴拉孟之间的那块田里，与他的列祖同葬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灼热临到他头上。”希腊语καύσων既可指灼人的炎热，也可指灼热的风。
    reason: 保留καύσων可指“炎热”或“灼热的风”的词义歧义。
lexical_decisions:
- source_word: ἐτύγγανε
  choice: 原来他当时正在
  rationale: 保留该动词所表达的背景性、偶合性情状，同时以自然汉语引入对其死亡缘由的说明。
- source_word: δεσμεύοντος τὸ δράγμα
  choice: 捆扎禾捆
  rationale: δράγμα为收割后聚拢的一捆庄稼，原文是单数；“禾捆”具体而简明，“捆扎”准确表达δεσμεύω。
- source_word: ὁ καύσων
  choice: 灼热的风
  rationale: καύσων既可指灼热，也可指炎热干燥的风；正文采用具象的气象含义，并以脚注保留另一可能。
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: 倒在床上
  rationale: 保持动作顺序和κλίνη的普通含义，不额外断定医学原因；“倒在”比直译“落在”更符合现代汉语。
- source_word: ἐτελεύτησεν
  choice: 死
  rationale: 直接表达死亡，不使用委婉语。
- source_word: Βαιτυλουὰ
  choice: 伯图利亚
  rationale: 按《友弟德传》相关地名的通行汉语音译处理，并贴近希腊语形式。
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: 在他祖先旁边
  rationale: 在埋葬语境中，μετά表示与先人同葬；汉语用“祖先”自然涵盖家族先人，“旁边”明确空间关系而不过度扩充。
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: 多太音和巴拉孟之间的那块田里
  rationale: 准确呈现ἀνὰ μέσον“在……之间”和定冠词所指的特定田地；地名依希腊文音译。
