  yaml_path: translation/deuterocanon/judith/008/032.yaml
  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: zh_hans
  text: 犹滴对他们说：“听我说，我要做一件事，这事将传至我们本族子孙[b]的世世代代[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“到一代又一代。”希腊文以重复的“世代”表达跨越连续后世的意思。
    reason: 说明εἰς γενεὰς γενεῶν的重复结构及其跨世代语义，避免将εἰς误释为“直到”。
  - marker: b
    text: “子孙”：希腊文直译为“儿子们”，在这里也可集合性地指本族的儿女或后代。
    reason: 说明υἱοῖς的阳性词形及其可能具有的集合性含义。
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: 听我说
  rationale: 命令式短语直译为“听我说”，既自然地表达要求专心听取，也保留了“听我／听从我言”的语气。
- source_word: ποιήσω πρᾶγμα
  choice: 我要做一件事
  rationale: ποιέω与πρᾶγμα搭配，指实施一项具体行动；“做一件事”比“制造一件事”自然，也不把该行动预先定性为功业。
- source_word: ἀφίξεται
  choice: 将……流传
  rationale: 该动词本义为“到达、抵达”。在后接世代和后人时，“流传”自然表达这件事将抵达后世的意义，同时不明确限定其究竟以影响、记忆还是传述的方式延续。
- source_word: εἰς γενεὰς γενεῶν
  choice: 世世代代
  rationale: 原文为复数叠用，字面近于“直到一代又一代”；“世世代代”保留重复和绵延不绝的力量，又符合现代汉语习惯。
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  choice: 我们本族的子孙
  rationale: υἱοῖς字面为“儿子们”，在此可集合性地指本族后人；γένος指族属或族群。“本族的子孙”既保留亲缘与后裔意味，也比“我们种族的儿子们”自然准确。
theological_decisions:
- issue: υἱοῖς是否应严格译作男性的“儿子们”
  choice: 我们本族的子孙
  alternative: 我们本族的众子
  rationale: 原文使用阳性复数“儿子们”，但与跨越历代的表达相连时，很可能集合性地涵盖本族后人。汉语“子孙”仍保留原文的亲缘和男性词形痕迹，同时避免“众子”在现代汉语中造成仅指男性或带有特殊宗教术语色彩的误解。
- issue: ἀφίξεται所表达的延续方式
  choice: 流传
  alternative: 达到／延伸到
  rationale: 原文只说这件事将“抵达”后世，并未明确是名声、记忆还是实际影响。“流传”在汉语中可概括这种跨世代的到达，但不进一步说明其神学性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“犹滴”沿用该书人物名的常见简体中文形式；分号划分宣告与其内容。正文避免把πρᾶγμα拔高为“壮举”，也不把跨世代的延续具体解释成名声、纪念或救恩影响。
