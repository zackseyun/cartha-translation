  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: zh_hans
  text: 她容貌美丽，极其悦目。她丈夫玛拿西给她留下了金银、男仆女仆[a]、牲畜和田地，她仍掌管着这一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男仆女仆”也可译作“男女奴隶”。这里的希腊语词可指产业中的家仆或奴隶。
    reason: lexical_alternative
  - marker: b
    text: 原文也可理解为“她仍守着这一切”或“她继续拥有这一切”，可能侧重管理、占有，或兼有两者。
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: 容貌美丽
  rationale: καλή在此描述外在美貌，εἶδος指形貌或外观；“容貌美丽”自然明确，也保留了视觉层面的含义。
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: 极其悦目
  rationale: ὡραία与καλή平行，表示视觉上美好可爱；τῇ ὄψει强调观看所得的印象，σφόδρα加强程度。“极其悦目”简洁地保留了这三层意思。
- source_word: ὑπελείπετο αὐτῇ
  choice: 给她留下了
  rationale: 该表达指她已故的丈夫把财物留给她，但不必然表示正式遗赠，因此不用法律意味较强的“遗赠”。
- source_word: παῖδας καὶ παιδίσκας
  choice: 男仆女仆
  rationale: 在产业清单中，这两个词指男女家内役使者或依附者。“男仆女仆”保留性别对应，同时以脚注注明也可能译作“男女奴隶”。
- source_word: κτήνη
  choice: 牲畜
  rationale: 该词泛指作为产业饲养的家畜；“牲畜”是准确、通行的现代汉语表达。
- source_word: ἀγρούς
  choice: 田地
  rationale: ἀγρός在此指田地或耕作土地；“田地”符合产业清单的语境。
- source_word: ἔμενεν ἐπʼ αὐτῶν
  choice: 她仍掌管着这一切
  rationale: 该短语可能侧重继续占有、照管或支配上述产业。“仍掌管着这一切”在现代汉语中自然，并以脚注保留原文语义范围。
theological_decisions:
- issue: 产业清单中男女家内役使者的身份用语
  choice: 男仆女仆
  alternative: 男女奴隶
  rationale: παῖδας与παιδίσκας在此可指家仆，也可能明确涉及受奴役者。正文采用较宽泛而自然的“男仆女仆”，不替原文断定具体法律身份；脚注保留较强的社会身份译法。
- issue: ἔμενεν ἐπʼ αὐτῶν所表达的占有或管理关系
  choice: 她仍掌管着这一切
  alternative: 她仍守着这一切；她继续拥有这一切
  rationale: 介词结构可涉及对产业的持续管理、控制或占有。正文采用自然且合乎上下文的“掌管”，脚注说明原文没有完全限定究竟侧重哪一方面，避免把含义收窄为单纯所有权。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“极其悦目”保留原文对外貌的加强描述；财产清单使用简明并列结构。脚注标记分别紧跟存在词义分歧的“男仆女仆”和含义略有开放性的末句。
