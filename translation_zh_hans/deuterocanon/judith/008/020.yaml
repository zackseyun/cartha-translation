base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/020.yaml
  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
translation:
  language: zh_hans
  text: 但我们除他以外，从未承认别的神[a]；因此，我们盼望他不会漠视我们[b]，也不会漠视我们族中的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承认”也可译作“认识”或“认出”。
    reason: lexical_alternative
  - marker: b
    text: “漠视”也可译作“不顾”或“轻看”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直指“出自我们族类的人”；γένος可指世系、族类或人民群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: 承认
  rationale: ἐπιγινώσκω可表示认识、认出或承认；本句涉及只归向这一位神的宣认，“承认”既传达认定与归属的意味，也不擅自改译为原文没有明说的“敬拜”。
- source_word: ἕτερον θεὸν ... πλὴν αὐτοῦ
  choice: 除他以外，从未承认别的神
  rationale: 保留πλήν所表达的排他关系；中文用“除他以外……别的神”自然地呈现这一排他性。
- source_word: ὅθεν
  choice: 因此
  rationale: 此处引出由前一句所得的推论，“因此”清楚表达其逻辑关系。
- source_word: ἐλπίζομεν
  choice: 我们盼望
  rationale: 保留希望与期待的语气，不强化为确定断言。
- source_word: οὐχ ὑπερόψεται
  choice: 不会漠视
  rationale: ὑπεροράω可表示不顾、忽视或轻看；“漠视”兼顾不予理会和轻忽之意，又避免把它仅理解为视觉上的“没看见”。
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: 我们族中的人
  rationale: ἀπό加属格表示来自或属于该族群；γένος带有血缘、族类或人民群体的含义。“我们族中的人”保留出身群体的维度，也比现代汉语中的“种族”更少引起误解。
theological_decisions:
- issue: 对独一之神的排他性承认
  choice: 译为“除他以外，从未承认别的神”
  alternative: 除他以外，从未敬拜别的神
  rationale: 原文动词表示认识、认出或承认，并未直接使用“敬拜”；所选译法保留排他性的神学力量，同时不把含义收窄为某一种宗教行为。
- issue: γένος所指的共同体范围
  choice: 译为“我们族中的人”
  alternative: 我们的人民／我们的族类／我们的后裔
  rationale: 该词在此指由血缘和群体身份相连的人；“人民”较顺却淡化世系意味，“后裔”又可能把所指限于后代，因此采用兼顾群体和出身的表达。
- issue: 神是否“漠视”的语气
  choice: 保留为盼望中的否定：“我们盼望他不会漠视”
  alternative: 我们相信他必不撇弃
  rationale: ἐλπίζομεν表达盼望或期待；不将其强化为确定应许，也不把ὑπεροράω神学化为原文未明确使用的“撇弃”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“从未承认”呼应希腊文不定过去时在整体性否定中的表达；末句补出第二个“漠视”，使希腊文省略结构在中文中清楚，同时用“族中的人”保留ἀπό的来源或归属意味。
