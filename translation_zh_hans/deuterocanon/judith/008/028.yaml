  yaml_path: translation/deuterocanon/judith/008/028.yaml
  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
translation:
  language: zh_hans
  text: 乌西雅对她说：“你所说的这一切，都是出于善良的心[a]；没有人会反对你的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“以一颗善良的心”，强调正直、真诚的用意，而不只是话说得好。
    reason: 说明希腊文习语所包含的道德与意向含义，防止读者将其理解为仅仅称赞表达技巧。
lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: 出于善良的心
  rationale: 保留希腊文“心”的意象及其道德、意向层面的含义，同时采用自然的现代汉语表达，避免弱化为单纯的“说得好”。
- source_word: ἐλάλησας
  choice: （你）说
  rationale: 结合前面的“你所说的这一切”合并表达，避免在汉语中机械重复“说”；仍清楚传达她已经讲完这些话，而乌西雅正在回应。
- source_word: ἀντιστήσεται
  choice: 会反对
  rationale: 该动词基本义为抵抗、反对；这里以“你的话”为对象，“反对”既自然，也不把含义过度限定为言语上的驳斥。
- source_word: τοῖς λόγοις σου
  choice: 你的话
  rationale: 保留 λόγοι 的复数整体意义，以简洁自然的汉语指犹滴刚才所陈述的劝告。
- source_word: Πάντα ὅσα εἶπας
  choice: 你所说的这一切
  rationale: 准确表达原文的周全范围；“这一切”在当前对话语境中比孤立的“一切”更自然。
- source_word: Ὀζείας
  choice: 乌西雅
  rationale: 依希腊名字形式作通行的中文音译，并保持人物名称清楚、庄重。
