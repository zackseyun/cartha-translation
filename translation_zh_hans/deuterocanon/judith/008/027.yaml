  yaml_path: translation/deuterocanon/judith/008/027.yaml
  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: zh_hans
  text: 因为他没有像用火试炼他们、为察验他们的心那样，用火试炼我们[a]；他也没有向我们施行报复。相反，主鞭打[b]亲近他的人，为要劝诫他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有像焚烧他们、为察验他们的心那样焚烧我们。”希腊文保留火烧的具体意象，同时用它表达试炼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“管教”。希腊文直译为“鞭打”，强调这种纠正行动的严厉。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: 用火试炼
  rationale: 该动词本义涉及焚烧或火，但与εἰς ἔτασμόν连用时指经受察验性的烈火考验。“用火试炼”既保留火的意象，也表达此处的检验含义。
- source_word: εἰς ἔτασμόν
  choice: 察验
  rationale: 该短语表示行动的目的，即检验内在实情；“察验”庄重自然，并可直接搭配“心”。
- source_word: καρδίας
  choice: 心
  rationale: “心”保留圣经语境中内在人格、意念和品格核心的含义，不将其窄化为现代意义上的情感。
- source_word: ἐξεδίκησεν
  choice: 施行报复
  rationale: 该词有追讨、公正惩治或报复之意；此处与后文以劝诫为目的的鞭打相对。“施行报复”保留两者之间的张力。
- source_word: νουθέτησιν
  choice: 劝诫
  rationale: 该名词指带有纠正目的的告诫或训导。“劝诫”能体现其纠正性，又避免与μᾰστιγοῖ所表达的惩戒行为混同。
- source_word: μαστιγοῖ
  choice: 鞭打
  rationale: 该动词具体指用鞭抽打。译作“鞭打”保留原文严厉而具体的意象，不弱化为笼统的“管教”。
- source_word: Κύριος
  choice: 主
  rationale: 按圣经汉语惯例译作“主”，在此指上帝。
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: 亲近他的人
  rationale: 该分词短语指走近或亲近上帝的人；“亲近他的人”自然地保留宗教和关系层面的含义。
theological_decisions:
- issue: 末句应否弱化为一般性的管教
  choice: 保留“主鞭打亲近他的人”的具体严厉意象
  alternative: 主管教亲近他的人
  rationale: μᾰστιγοῖ强于一般的“管教”。原文将报复与带有劝诫目的、却仍然痛苦严厉的行动相对照，不应消除这种神学张力。
- issue: 如何表达上帝行动的目的与报复之间的区别
  choice: 译作“为要劝诫他们”
  alternative: 为要管教他们／作为对他们的警告
  rationale: εἰς νουθέτησιν明确指出纠正和告诫的目的，使前述行动有别于报复；“劝诫”既保留目的性，也不过度扩展经文的神学含义。
- issue: 前半句的比较结构如何在汉语中呈现
  choice: 将隐含的受事动作补明为“也用火试炼我们”
  alternative: 他没有像用火试炼他们那样对待我们
  rationale: 希腊文比较结构较为压缩；汉语补出重复动作，可清楚呈现“他们”与“我们”的对比，而不改变原文所述行动。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面汉语。“用火试炼”“察验他们的心”“亲近他的人”保留圣经语体，但避免生硬古奥；分号突出“不施报复”与“为劝诫而鞭打”之间的对照。
