  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: zh_hans
  text: 但你们不要探究我的行动，因为在我所做的事完成以前，我不会告诉你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: 探究
  rationale: 该动词表示深入查考、追究；“探究”既保留彻底查问的意味，也符合现代汉语表达。
- source_word: τὴν πρᾶξίν μου
  choice: 我的行动
  rationale: πρᾶξις在此指友弟德将要实行的行动或所采取的做法。“我的行动”保留原文名词形式，又不将其过度限定为内在的“计划”或单一“事迹”。
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: 因为……我不会告诉你们
  rationale: ἐρῶ在语境中指把有关行动的信息告知众人；译作“告诉”比直译为“说”更自然清楚。
- source_word: ἕως τοῦ τελεσθῆναι
  choice: 在……完成以前
  rationale: 该结构标明保持缄默的时间界限；“在……完成以前”自然体现“不告知”将持续到事情完成为止，并保留被动完成之意。
- source_word: ἃ ἐγὼ ποιῶ
  choice: 我所做的事
  rationale: 关系代词复数中性与现在时ποιῶ指向她正在进行或将付诸实行的事情；“我所做的事”在汉语中自然，并与前面的名词“行动”有所区分。
