  yaml_path: translation/deuterocanon/judith/008/006.yaml
  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: zh_hans
  text: 她守寡期间，天天禁食；只有安息日前的日子、安息日、朔日前的日子[a]，以及以色列家的节期和欢庆之日例外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安息日前的日子”和“朔日前的日子”所对应的希腊词都是复合词，指安息日和朔日之前的日子。
    reason: 说明原文复合词的构词意义，并避免将其误解为后期固定的礼仪专称或限定为必然仅指前一天。
lexical_decisions:
- source_word: ἐνήστευε
  choice: 天天禁食
  rationale: 未完成时表示过去持续或惯常的行为；结合“所有日子”，译作“天天禁食”自然地传达她一贯的做法。
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: 她守寡期间，天天
  rationale: 表达她整个守寡时期的时间范围，同时采用现代汉语自然语序。
- source_word: χωρὶς
  choice: 只有……例外
  rationale: 此处表示从通常的禁食惯例中排除下列日子；这一表达清楚而自然。
- source_word: προσαββάτων
  choice: 安息日前一天
  rationale: 该复合词指安息日之前的日子；按每周反复出现的具体场合译成“安息日前一天”，避免加入原文没有明说的后期专门称谓。
- source_word: σαββάτων
  choice: 安息日
  rationale: 希腊文复数表示反复临到的各个安息日；汉语以无形态变化的“安息日”即可自然表达。
- source_word: προνουμηνιῶν
  choice: 朔日前一天
  rationale: 与 προσαββάτων 平行，指朔日之前的日子；“朔日”是简洁而通行的圣经历法用语。
- source_word: ἑορτῶν
  choice: 节期
  rationale: 指宗教性的节庆日；“节期”既符合圣经语域，也为现代读者所能理解。
- source_word: χαρμοσυνῶν
  choice: 欢庆之日
  rationale: 该名词指喜乐、欢庆的场合；补出“之日”使它与前列日期项目平行。
- source_word: οἴκου Ἰσραήλ
  choice: 以色列家
  rationale: 保留原文的圣经惯用表达，不简化为“以色列”。
theological_decisions:
- issue: 友弟德禁食及其例外的性质
  choice: 她在守寡期间惯常禁食，但列出的神圣节日和欢庆日不在禁食之列。
  alternative: 把所列日子理解为她特别禁食的日期。
  rationale: χωρὶς 在此最自然地表示排除；所列项目又都是群体守节和欢乐的日子，因此应理解为禁食惯例的例外。
- issue: 以色列历法称谓的译法
  choice: 按词形所表达的时间关系，描述为“安息日前一天”和“朔日前一天”。
  alternative: 采用“预备日”等后期礼仪性专称。
  rationale: 描述性翻译忠实呈现希腊文复合词，又不加入原文未必要求的后期技术含义。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“她守寡期间，天天禁食”简洁呈现持续性的生活实践；分号和“只有……例外”使长串日期的逻辑关系清楚。保留“以色列家”的圣经语体，同时避免生硬仿照希腊语复数形式。
