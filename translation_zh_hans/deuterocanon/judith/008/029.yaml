base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: zh_hans
  text: 你的智慧并不是到今天才显明；从你年幼时起，全体百姓都知道你有见识，因为你内心的倾向是良善的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你内心的倾向”也可译作“你心的形成（或塑造）”。原文用词带有形成、塑造的意思，在这里指人内在的禀性或倾向。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον ἡ σοφία σου πρόδηλός ἐστιν
  choice: 你的智慧并不是到今天才显明
  rationale: 希腊语按字面可理解为“你的智慧不是在今天显明的”，上下文强调她的智慧并非如今才为人所知。“并不是到今天才显明”自然呈现这一时间对比，又不把 πρόδηλος 过度解释为某种具体行为。
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: 从你早年的时候起
  rationale: ἀπʼ ἀρχῆς ἡμερῶν σου 直译为“从你日子的开端起”，所指是人生早期。译作“从你早年的时候起”符合现代汉语，也保留长期以来的含义。
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: 全体百姓就知道
  rationale: πᾶς ὁ λαός 指作为整体的百姓。“全体百姓”比“所有人民”更符合本书叙事语域；“就知道”配合“从……起”，表达从早年已经形成的认识。
- source_word: τὴν σύνεσίν σου
  choice: 你有见识
  rationale: σύνεσις 表示理解力、洞察力或明辨能力。“有见识”在现代汉语中自然清楚，并与前面的“智慧”保持适度区别。
- source_word: καθότι
  choice: 因为
  rationale: 此处引出百姓认识她有见识的原因，“因为”直接而清楚。
- source_word: τὸ πλάσμα τῆς καρδίας σου
  choice: 你内心的倾向
  rationale: πλάσμα 本义涉及被塑造、形成之物，与“心”连用时指内在的构成、倾向或禀性。“内心的倾向”既传达内在取向，也避免生硬直译为“心的塑造物”。
- source_word: ἀγαθόν
  choice: 是良善的
  rationale: ἀγαθόν 是广义的正面道德评价。“良善”庄重且适合圣经语体，不额外限定为高尚、健全等特定含义。
theological_decisions:
- issue: “心”的圣经人论表达
  choice: 译为“内心”，并保留其内在道德倾向的含义
  alternative: 译为“心思”或概括为“品格”
  rationale: καρδία 在这里指人的内在中心，包括思想和道德倾向。译作“内心”既自然，又不把含义缩窄为理智活动或完全改写为抽象的“品格”。
- issue: πλάσμα 的隐喻与语义开放性
  choice: 正文采用“倾向”，脚注说明“塑造/构成”的字面色彩
  alternative: 正文直译为“你心的塑造”或译作“你的性情”
  rationale: 原文带有形成、塑造的意象，但具体指内在构成还是倾向并非完全确定。正文保证可读性，脚注保留这一真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“到今天才显明”“从你早年的时候起”自然呈现时间对比；“智慧”与“见识”分别对应 σοφία 和 σύνεσις。脚注标记置于相关分句末尾。
