base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/031.yaml
  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: zh_hans
  text: 现在，请为我们祈求，因为你是个敬虔的妇人；主必降雨，把我们的水窖灌满，我们就不会再匮乏了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们就不会再短缺了”或“我们就不会再衰竭了。”希腊文直译为：“我们将不再短缺。”
    reason: 说明ἐκλείπω可指短缺、耗尽或衰竭；本句在缺水语境中很可能指不再匮乏，但原文未将所缺之物明确限定。
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: 请为我们祈求
  rationale: δεήθητι是直接请求，περὶ ἡμῶν在祈祷语境中表示代求对象；“为我们祈求”自然地传达替众人向上帝恳求的意思。
- source_word: γυνὴ εὐσεβὴς
  choice: 敬虔的妇人
  rationale: εὐσεβής指对上帝怀有敬畏、虔诚；“敬虔”庄重而通俗，“妇人”符合叙事语体。
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: 主必降雨
  rationale: ἀποστελεῖ是将来时；汉语以“降雨”自然表达主使雨降下。“必”体现说话者对将来之事的肯定语气。
- source_word: εἰς πλήρωσιν τῶν λάκκων ἡμῶν
  choice: 把我们的水窖灌满
  rationale: λάκκος可指坑或蓄水池；旱灾及储水语境表明这里是收集雨水的水窖。εἰς πλήρωσιν表达使其充满的结果或目的。
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: 我们就不会再匮乏了
  rationale: ἐκλείπω可表示耗尽、缺乏、衰竭。此处“匮乏”既贴合缺水困境，也避免把原文范围限定为死亡或单纯缺水。
theological_decisions:
- issue: Κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文是希腊文Κύριος；译作“主”保留犹太经文语境中的神圣称谓，同时不把希腊文本直接改写为神名。
- issue: οὐκ ἐκλείψομεν ἔτι是否指死亡
  choice: 不会再匮乏了
  alternative: 不会再灭亡了
  rationale: ἐκλείπω本身可指耗尽、衰竭或缺乏，语境虽涉及生存危机，却未明确使用“灭亡”一词；正文保留其语义张力，不把结果限定为死亡。
translation_notes:
  register: 采用现代、庄重且易懂的叙事用语。“请”使命令式在请求语境中自然；分号呈现理由与结果之间的推进关系。
