base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/009.yaml
  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: zh_hans
  text: 犹滴听见百姓攻击首领的恶言，因为他们因缺水而灰心。她又听见乌西雅对他们所说的一切话：他曾向他们起誓，五天后要把城交给亚述人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把城交给”也可译作“把城交出”或“向亚述人投降”。希腊文直译为“把城交出去”。
    reason: 说明παραδώσειν的基本词义及其在军事语境中可能表达投降的含义。
lexical_decisions:
- source_word: ῥήματα τοῦ λαοῦ τὰ πονηρά
  choice: 百姓……的恶言
  rationale: 保留ῥήματα作为实际说出的话，也保留πονηρά对这些言语明确的负面道德评价。
- source_word: ἐπὶ τὸν ἄρχοντα
  choice: 攻击首领
  rationale: 介词短语表示言语针对这位统治者；“首领”不把ἄρχων限定为某一特定官职，“攻击”则自然表达敌对指向。
- source_word: ὠλιγοψύχησαν
  choice: 灰心
  rationale: 该动词表示失去勇气、变得胆怯或沮丧；“灰心”是简明自然的现代汉语表达。
- source_word: ἐπὶ τῇ σπάνει τῶν ὑδάτων
  choice: 因为缺水
  rationale: σπάνις指匮乏、短缺；此处所缺的是水。“因为”呈现该短缺与百姓灰心之间的原因关系。
- source_word: πάντας τοὺς λόγους
  choice: 所说的一切话
  rationale: 保留πάντας的全面性及λόγους所指的具体言语，不笼统译成“一切事情”。
- source_word: ὤμοσεν
  choice: 起誓
  rationale: 明确保留誓言的正式约束意味，而不弱化为普通的“答应”。
- source_word: παραδώσειν
  choice: 交给
  rationale: παραδίδωμι的基本义是交出、交付；“交给”保留原文较宽的措辞，语境中包含投降献城之意。
- source_word: μετὰ ἡμέρας πέντε
  choice: 五天后
  rationale: μετά加宾格在此最自然表示一段时间之后，不改译为“五天内”。
- source_word: Ἰουδεὶθ
  choice: 犹滴
  rationale: 采用简体中文中清晰、简洁的音译，并在汉语句首明示希腊文后置出现的叙事主语。
- source_word: Ὀζείας
  choice: 乌西雅
  rationale: 采用现代汉语圣经人名的常见音译形式。
theological_decisions:
- issue: 第二个ἤκουσεν与Ἰουδεὶθ的主语关系
  choice: 把后置的“犹滴”置于全句开头，作为两个并列“听见”的共同主语，第二处用“她”承接
  alternative: 先译“她听见”，第二分句再明确说“犹滴听见”
  rationale: 希腊文在第二个并列分句中明写Ἰουδεὶθ，但其位置可以自然理解为迟后出现、支配两个并列动词的主语。汉语在句首明示姓名既保留原文的人名信息，也避免生硬重复。
- issue: ὃς所引誓言与乌西雅言语的关系
  choice: 用冒号引出乌西雅起誓的内容
  alternative: 用关系从句译为“那些话，就是他曾起誓……”
  rationale: ὃς为阳性单数，回指乌西雅；冒号能清楚呈现后文是对他言语内容的说明，同时不增加原文没有的神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。为避免汉语中“因为他们因……”的累赘，把原因从句独立为解释句；未改变其与百姓灰心及恶言之间的逻辑关系。专名使用“犹滴、乌西雅、亚述人”。
