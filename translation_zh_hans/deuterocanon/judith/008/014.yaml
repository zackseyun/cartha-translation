base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: zh_hans
  text: 因为你们尚且无法探明人心的深处，也不能洞悉他心思中的言语，又怎能探究那创造这一切的上帝，知道他的心思，明白他的思量呢？弟兄们[a]，万万不可惹怒主——我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姐妹们”。希腊文使用阳性复数称呼，在当时可以用来称呼包括女性在内的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: 人心的深处
  rationale: βάθος是“深处、深度”，καρδία在此指人的内在；ἀνθρώπου为泛指的单数。中文“人心的深处”自然涵盖人类，并保留其难以测透的意象。
- source_word: οὐχ εὑρήσετε
  choice: 你们尚且无法探明
  rationale: 未来陈述在反问论证中表达人的无能；“无法探明”比字面“找不到”更符合现代汉语，并与“深处”搭配自然。“尚且”显明前后由人到上帝的递进关系。
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: 他心思中的言语
  rationale: 保留λόγους“言语”和διάνοια“心思”两个不同概念，不将整句简化为“思想”；此处指内心形成或表达的思量。
- source_word: οὐ διαλήμψεσθε
  choice: 也不能洞悉
  rationale: διαλαμβάνομαι在此有辨明、透彻领会之意；“洞悉”呼应无法深入人的内在。
- source_word: ἐρευνήσετε
  choice: 探究
  rationale: 表达彻底查考、搜寻的意味，适合本句对认识上帝的反问。
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: 那创造这一切的上帝
  rationale: ἐποίησεν直指“造了”；中文论及上帝创造万物时用“创造”自然庄重，“这一切”保留πάντα ταῦτα。
- source_word: τὸν νοῦν αὐτοῦ
  choice: 他的心意
  rationale: νοῦς可指心智、思想或意向；“心意”在中文中适用于上帝，也与后面的“意念”保持相关而不完全等同。
- source_word: τὸν λογισμὸν αὐτοῦ
  choice: 他的意念
  rationale: λογισμός可指思想、推想、盘算；“意念”保持宽泛，不擅自限定为“计划”或“旨意”。
- source_word: μηδαμῶς
  choice: 万万不可
  rationale: 传达强烈否定和劝止语气，比“绝不是”更自然地衔接后面的禁令。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；在此可能作为对群体的包容性称谓，故加脚注说明。
- source_word: μὴ παροργίζετε κύριον θεὸν ἡμῶν
  choice: 不可惹主我们的上帝发怒
  rationale: παροργίζω具有激怒、惹怒的使动含义；按原文保留“主”和“我们的上帝”两个称谓。
theological_decisions:
- issue: 人的内心不可测与上帝不可被穷尽之间的论证
  choice: 以“尚且……又怎能……”呈现从人心到上帝之心意的递进反问
  alternative: 将各分句平列为独立陈述
  rationale: 原文καὶ πῶς引出由较小到较大的反问：若人连同类的内心都不能彻知，更不能凭自己穷究创造万有的上帝。译文保留认识限制，不把它扩大解释为人绝不可能借上帝启示认识他。
- issue: νοῦς与λογισμός的关系
  choice: 分别译作“心意”和“意念”
  alternative: 分别译作“思想”和“计划”
  rationale: 原文使用两个相近但不同的词。译文维持差异，同时避免把λογισμός专门化为神的预定计划或旨意。
- issue: ἀδελφοί的群体范围
  choice: 正文保留“弟兄们”，脚注说明可能包括姐妹
  alternative: 正文译作“弟兄姐妹们”
  rationale: 保留原文的阳性形式及其历史语用，同时不武断排除该称呼对整个共同体的包容性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前半句以“尚且……又怎能……”恢复希腊文的递进反问；末句以“万万不可”传达μηδαμῶς的强烈劝止。神名统一译作“上帝”。
