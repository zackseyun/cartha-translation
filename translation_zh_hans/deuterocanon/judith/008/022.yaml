base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as servants there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: zh_hans
  text: 必将我们弟兄所遭的杀戮、国土的被掳和我们产业的荒凉，归到我们自己头上[a]，在我们为奴服事的列国中[b]；我们也必在那些把我们据为己有的人面前，成为绊脚石和耻辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必将这些事归到我们头上。”希腊文动词为单数，本分句没有明说主语。
    reason: alternative_reading
  - marker: b
    text: “为奴服事”也可译作“服事”。这里因上下文谈到被掳，可能含有受奴役、被迫服役的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: 杀戮
  rationale: 表达暴力杀害和流血之意，符合战争语境，又不把词义限定为法律意义上的“谋杀”。
- source_word: ἀδελφῶν
  choice: 弟兄
  rationale: 保留希腊文阳性复数形式；在此也可广指同族同胞。
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: 国土被掳
  rationale: 按原文保留“国土”与“被掳”这一凝缩而强烈的表达，指土地及其居民落入敌手，不窄化为单纯流亡。
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: 我们产业的荒凉
  rationale: “产业”保留 κληρονομία 的承受之业和土地意味，“荒凉”对应遭毁坏、成为荒芜之地。
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: 必归到我们自己头上
  rationale: 保留报应或后果回到人头上的原文意象，同时借助汉语无须明示主语的特点，不擅自确定未明说的施事者。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在……列国中
  rationale: “列国”适合被掳到外邦民族中的语境，并避免预先限定为带特定神学色彩的“外邦人”。
- source_word: δουλεύσωμεν
  choice: 为奴服事
  rationale: δουλεύω 可泛指服事，但被掳和受外国支配的上下文使奴役意味突出；此译同时保留“服事”的动词形态。
- source_word: πρόσκομμα
  choice: 绊脚石
  rationale: 保留原文“使人绊跌之物”的具体隐喻，不将其直接解释为抽象的冒犯或障碍。
- source_word: ὄνειδος
  choice: 羞辱
  rationale: 兼顾蒙羞以及成为他人讥诮对象的含义，符合本节庄重而沉痛的语气。
- source_word: τῶν κτωμένων ἡμᾶς
  choice: 那些把我们据为己有的人
  rationale: 自然表达 κτάομαι 的取得、占有之意，并保留被掳者受人支配乃至被视为财产的严酷图景。
theological_decisions:
- issue: ἐπιστρέψει 的隐含主语
  choice: 正文采用无明示主语的“必归到我们自己头上”
  alternative: “他必使这一切归到我们头上”或明确写作“上帝必使……”
  rationale: 希腊文动词为第三人称单数，但本分句没有明说主语。汉语无主句既可忠实传达后果临到，也不排除上下文所暗示的神圣施事者；脚注保留另一种语法理解。
- issue: δουλεύσωμεν 的奴役意味
  choice: 为奴服事
  alternative: 服事；被奴役
  rationale: 被掳列国的语境使强制服役的含义显著，但译作“为奴服事”仍保留该动词本身的“服事”语义，不将其完全改写为被动状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以并列结构保存原文连续列举灾祸的力度；“归到头上”“绊脚石”等意象尽量保留。“国土被掳”略带凝缩色彩，但刻意对应原文将土地本身说成被掳的修辞。
