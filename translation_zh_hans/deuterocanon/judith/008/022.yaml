  source_fidelity: 原文的三个灾祸名词均为宾格，配合单数主动动词ἐπιστρέψει，较自然的理解是未明说的施事者“将”这些事归到以色列人头上。原译把三个名词直接作“归到”的主语，虽可反映后果回转的意象，却弱化了原文主动句式。修订以汉语可省略的主语和“必将……归到”保留未明说的施事者，不擅自指定为上帝。ἐν τοῖς ἔθνεσιν οὗ ἐὰν δουλεύσωμεν ἐκεῖ 仍译为在为奴服事的列国中；脚注说明“服事”的较宽泛可能。
  naturalness: “国土被掳”虽有原文修辞的凝缩感，在现代汉语中略显生硬；“国土的被掳”更清楚地保持其名词性并与并列的“杀戮／荒凉”协调。“成为……羞辱”可懂，但“成为……耻辱”更自然地表达ὄνειδος作为受人讥诮、蒙羞的对象。
