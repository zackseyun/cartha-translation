  yaml_path: translation/deuterocanon/judith/008/023.yaml
  text: For our slavery will not be turned to favor[a], but the Lord our God will make it a dishonor.
translation:
  language: zh_hans
  text: 因为我们所受的奴役不会以恩惠告终；相反，主——我们的上帝——必使这奴役成为羞辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们所受的奴役不会被导向恩惠；相反，主——我们的上帝——必使它成为耻辱。”
    reason: κατευθυνθήσεται εἰς χάριν 可较字面译为“被导向恩惠”，也可按其结果趋向译为“以恩惠告终”；ἀτιμία 可译为“羞辱”或“耻辱”。
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: 会转为
  rationale: 该词为将来时被动形式，与 εἰς χάριν 连用，表示被导向某种结果。译作“会转为”既保留结果趋向，也比生硬的“被导向”更符合现代汉语。
- source_word: δουλεία
  choice: 所受的奴役
  rationale: δουλεία 指受奴役、被辖制的状态；“所受的奴役”保留其强烈含义，同时使本句中的抽象状态表达自然。
- source_word: εἰς χάριν
  choice: 转为恩待
  rationale: χάρις 在此与 ἀτιμία 对举，主要指获得好意、优待，而非救恩意义上的“恩典”；“恩待”能自然表达社会处境中的有利待遇。
- source_word: ἀτιμίαν
  choice: 羞辱
  rationale: ἀτιμία 表示失去尊荣、蒙受耻辱；“羞辱”兼顾地位受损与蒙羞的含义。
- source_word: θήσει αὐτήν
  choice: 会使它成为
  rationale: τίθημι 在此带结果意义，αὐτήν 回指阴性名词 δουλεία；“使它成为”明确保留代词和结果结构。
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: 主我们的上帝
  rationale: 依照希腊语词序保留“主”这一称号，并自然连接“我们的上帝”；此处不将“主”处理为人名的一部分。
theological_decisions:
- issue: δουλεία 在以色列人受外族辖制语境中的强度
  choice: 奴役
  alternative: 奴仆状态；辖制
  rationale: 原词指实质性的受奴役状态，不宜弱化为一般的服役或困境；同时不额外断定具体法律身份。
- issue: χάρις 在非救恩语境中的含义
  choice: 恩待
  alternative: 恩典；好意；优待
  rationale: 上下文以 χάρις 与 ἀτιμία 对举，关注受制后的社会待遇与荣辱结局，因此用“恩待”避免引入特定救恩教义。
- issue: 上帝使奴役成为羞辱这一神学张力
  choice: 保留主语为“主我们的上帝”
  alternative: 意译为“这终将成为我们的羞辱”
  rationale: 原文明确以上帝为 θήσει 的主语；译文不淡化其行动主体，也不进一步解释这是许可、审判还是直接造成。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“所受的奴役”避免将抽象名词误解为主动奴役他人；“反而”清晰呈现 ἀλλά 的强烈转折。脚注保留趋向义与结果义之间的真实歧义。
