  to: 因为我们所受的奴役不会以恩惠告终；相反，主——我们的上帝——必使这奴役成为羞辱。[a]
  rationale: 将“转为恩待”改为“以恩惠告终”，使 χάρις 表示奴役的结果或处境，而非施予动作，并保留原文的未来结果趋向。将第二分句中的代词改为“这奴役”，使中文指代明确；以破折号处理“主——我们的上帝——”，使称号结构自然清晰。脚注改为保留较字面的趋向性译法及 ἀτιμία 的同义替代。
