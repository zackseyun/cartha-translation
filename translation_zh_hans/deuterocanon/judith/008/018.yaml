    rationale: “不像从前的日子那样”缺少在中文中自然承接的谓语内容；希腊文的“正如从前的日子所发生的那样”修饰此前所否定的情形，随后另加“直到今天也没有”的强调。应明确译出这两个层次。
  - severity: low
    issue: “在我们这些世代中”略显直译。
    rationale: “在我们历代中”在现代标准汉语中更自然，同时保留复数世代及共同体历史的含义。
  - severity: low
    issue: 脚注的“手所造的神”未体现原文复数。
    rationale: θεοῖς为复数；改作“手所造的诸神”可使脚注的字面说明更准确。
