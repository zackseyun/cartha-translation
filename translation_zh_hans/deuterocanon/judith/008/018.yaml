base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: zh_hans
  text: 因为在我们历代中，从我们中间从未兴起过任何敬拜人手所造的神明[a]的支派、宗族、民众或城邑，正如从前的日子所发生的那样；直到今天也没有这样的群体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人手所造的偶像。”希腊文直译为“手所造的诸神”，是对偶像的讽刺性说法。
    reason: 提供较具解释性的词义替代，同时说明正文为何保留原文的反讽表达。
lexical_decisions:
- source_word: ἀνέστη
  choice: 兴起过
  rationale: 这里指某个群体在以色列人中出现或形成，并非字面上的站起或复活；“兴起过”保留原文比喻。
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: 在我们这些世代中
  rationale: 保留复数“世代”，指说话者所属群体所经历的 successive generations，并与从前的日子形成对照。
- source_word: φυλὴ
  choice: 支派
  rationale: 在以色列语境中通常指支派，是现代中文圣经语体中准确且易懂的称呼。
- source_word: πατριὰ
  choice: 宗族
  rationale: 指支派之下以血缘相连的群体；“宗族”比“家庭”更能体现其社会规模。
- source_word: δῆμος
  choice: 民众
  rationale: 在这一系列社会群体中可指一群人民或居民；“民众”保留宽泛含义，不强行限定为行政区。
- source_word: πόλις
  choice: 城邑
  rationale: 准确表达 πόλις，并与“支派、宗族、民众”的庄重列举相协调。
- source_word: ἐξ ἡμῶν
  choice: 从我们当中
  rationale: 明确表示这些群体若出现，其来源是在说话者自己的民族共同体内部。
- source_word: προσκυνοῦσι
  choice: 敬拜
  rationale: 与“神明”连用时宗教意义明确；“敬拜”自然表达俯伏崇拜的含义。
- source_word: θεοῖς χειροποιήτοις
  choice: 人手所造的神明
  rationale: 贴近原文“手所造的诸神”，保留其反偶像崇拜的讽刺张力，同时“人手所造”在现代中文中自然明确。
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: 直到今天也没有
  rationale: 保留原文对当前时刻的加强否定，并与前面的过去时陈述自然衔接。
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: 不像从前的日子那样
  rationale: 表达当前情形与以往曾发生的偶像崇拜之间的对照；置于句末可避免中文主干被过度割裂。
theological_decisions:
- issue: 如何翻译反偶像崇拜用语 θεοῖς χειροποιήτοις
  choice: 人手所造的神明
  alternative: 人手所造的偶像
  rationale: 原文直称“手所造的神”，带有刻意的神学讽刺。“神明”保留其表层措辞和张力；“偶像”虽符合所指，却在正文中提前解释了原文的论断。
- issue: 本节对当代群体无偶像崇拜的断言范围
  choice: 保留“从未兴起过任何……；直到今天也没有”的绝对措辞
  alternative: 弱化为“几乎没有”或“如今没有”
  rationale: 希腊文用连续否定概括各类共同体，并强调“今天”；翻译不应因历史或神学考量而自行缓和这项修辞性断言。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“支派、宗族、民众、城邑”保留原文连续列举的社会层级感；调整末句语序以符合中文表达，同时不削弱“直到今天”的强调。
