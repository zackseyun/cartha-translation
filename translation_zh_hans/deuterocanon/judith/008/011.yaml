- from: 他们来到她那里。她对他们说：“住在伯突利亚之人的首领们，请听我说！你们今天向民众所说的这番话是不对的。你们又在上帝和你们自己之间立下誓言，说若主在这段日子内[a]不转而帮助你们，你们就要把城交给我们的仇敌。”
  to: 他们来到她那里。她对他们说：“伯突利亚居民的首领们，请听我说！你们今天当着民众所说的这番话是不对的。你们又在上帝和你们自己之间立下誓言，并说，若主在这段日子内[a]不给你们回转来援助，你们就要把城交给我们的仇敌。”
  rationale: 修订以原文为先：将ἐναντίον τοῦ λαοῦ明确译为“当着民众”，避免仅按英语审计轨迹的“against the people”或草稿的“向民众”处理。措辞上将较生硬的“住在……之人的首领们”自然化为“伯突利亚居民的首领们”，并将“主不转而帮助”调整为“主不给你们回转来援助”，以保留回转意象而使汉语通顺。脚注继续标明αὐταῖς所指未在本句明说，未将其解释为确定无疑。
