base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: zh_hans
  text: 他们来到她那里。她对他们说：“伯突利亚居民的首领们，请听我说！你们今天当着民众所说的这番话是不对的。你们又在上帝和你们自己之间立下誓言，并说，若主在这段日子内[a]不给你们回转来援助，你们就要把城交给我们的仇敌。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在它们之内”；这个阴性复数代词在本句中未明说所指，很可能指先前誓言所规定的那些日子。
    reason: 说明原文代词没有在本句中明说所指对象，而正文依据上下文补出“这段日子”。
lexical_decisions:
- source_word: ἄρχοντες τῶν κατοικούντων ἐν Βαιτυλουά
  choice: 住在伯突利亚之人的首领们
  rationale: 保留 κατοικούντων 的动词意味，并以“首领”准确表达 ἄρχοντες 所指的治理者，避免“王公”等贵族色彩。
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: 你们……所说的这番话是不对的
  rationale: εὐθύς 字面为“直”，此处指言论或决定不正当；“不对”在现代汉语中自然，也保留道德与实际判断的宽度。
- source_word: ἐναντίον τοῦ λαοῦ
  choice: 向民众
  rationale: ἐναντίον 可表示“在……面前”，也可有“针对、反对”之意。“向民众所说”贴合公开宣告的场景，同时不完全排除这话对民众不利的语境意味。
- source_word: ἐστήσατε τὸν ὅρκον
  choice: 立下誓言
  rationale: “立下”保留 ἵστημι 的设立意味，又是自然、庄重的现代汉语誓言搭配。
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: 在上帝和你们自己之间
  rationale: 直接保留誓言处于上帝与他们双方之间的表述及反身强调，不将其解释成某一种具体誓约机制。
- source_word: ἐκδώσειν τὴν πόλιν
  choice: 把城交给我们的仇敌
  rationale: ἐκδίδωμι 在此指交出或弃守城市；“交给”清楚表达这一行动，不附加原文没有的军事细节。
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: 若……在这段日子内不
  rationale: 阴性复数代词 αὐταῖς 在本句中没有明示先行词，语境指先前规定的若干日子；正文作必要的自然化处理，并以脚注说明字面形式。
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: 主……不转而帮助你们
  rationale: “转而”保留 ἐπιστρέφω 的转向意象，也能自然表达主施予帮助这一压缩的希腊语结构。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 本处 κύριος 指上帝；“主”符合犹太经文语境中的宗教称谓，也不额外界定其所对应的神名。
- issue: 誓言与上帝的关系
  choice: 在上帝和你们自己之间立下誓言
  alternative: 用誓言约束上帝
  rationale: 原文只说誓言被立在上帝与他们之间。正文保持这一关系性表达，避免把友弟德的责备预先解释为人能够约束上帝这一更强的神学命题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“请听我说”传达 δή 的恳切语气；整体保留友弟德正式责备众首领的口吻，同时避免生硬照搬希腊语语序。
