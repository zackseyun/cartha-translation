  text: And she sent her maid[a], who was in charge of all that belonged to her, and summoned Chabris and Charmis, the elders of her city.
translation:
  language: zh_hans
  text: 她派遣那位负责管理她所有财物的使女[a]，召请她城中的长老哈布里斯和哈尔米斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”或“女侍从”。希腊语 ἅβρα 指女性侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  choice: 她派出
  rationale: 不定过去时分词表示先于主句动作发生的行动；译作“派出”自然地交代她差遣使女去传召二人。
- source_word: ἅβραν
  choice: 使女
  rationale: 该词指女性侍从或女仆。“使女”在现代中文中简洁庄重，也保留其受差遣服侍的身份；以脚注注明其他可行译法。
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: 那位管理她全部产业的
  rationale: ἐφεστῶσαν 表示负责、监管；ὑπάρχουσιν 在此指她所拥有的财物或产业。“管理她全部产业”清楚传达其管事职责。
- source_word: ἐκάλεσεν
  choice: 召来了
  rationale: 语境是派使女请城中长老前来。“召来”比泛泛的“叫”更能体现有明确目的的传唤，而“来”也符合差人请到面前的语境。
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: 哈布里和哈米
  rationale: 按希腊语人名音译，并采用适合普通话的简明形式；不将人名意译。
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: 她城里的长老
  rationale: πρεσβυτέρους 在此指具有公共身份的城中长老，而不只是年长者；“她城里的”保留原文属格和 αὐτῆς 所表达的所属关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句序保留“先差遣、后召来”的动作关系；“产业”兼顾财物与家产范围，“长老”保留其城邑公共职分。
