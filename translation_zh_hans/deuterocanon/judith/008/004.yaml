lexical_decisions:
- source_word: Ἰουδεὶθ
  choice: 友弟德
  rationale: 采用《友弟德传》中该人名的通行简体中文译名，便于中文读者识别。
- source_word: ἦν
  choice: 已有
  rationale: 希腊文直译为“是/处于”，与持续性分词和时间宾语合用，表达一种延续至所述时段的状态；中文用“已有”自然呈现这种持续意义，同时不另行强化为“始终留在”。
- source_word: ἐν τῷ οἴκῳ αὐτῆς
  choice: 在自己家里
  rationale: 忠实表达处所；因主语为友弟德，反身性的“自己”比“她的”更符合现代汉语习惯。
- source_word: χηρεύουσα
  choice: 守寡
  rationale: 该现在分词表示持续处于寡居状态；“守寡”简洁、自然，并保留持续生活状态的含义。
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: 三年零四个月
  rationale: 这是表示持续时间的宾格短语；“零”符合现代汉语连接年、月时的习惯。
