  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: zh_hans
  text: 所以，我们在等候从他而来的拯救时，让我们呼求他来帮助我们；若这是他所喜悦的，他必垂听我们的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: 所以
  rationale: 承接上文并引出结论，保留推论关系，同时符合现代汉语表达。
- source_word: ἀναμένοντες
  choice: 既然等候
  rationale: 分词与劝勉式主句相连，表示在等候中采取行动；“既然”在此自然呈现其伴随并兼具论证依据的语气。
- source_word: σωτηρίαν τὴν παρ' αὐτοῦ
  choice: 那从他而来的拯救
  rationale: σωτηρία在本叙事语境首先指上帝在危难中的解救；“拯救”既保留神学分量，也适合具体的民族危机。παρά加属格所表达的来源以“从他而来”明确呈现。
- source_word: ἐπικαλεσώμεθα αὐτὸν
  choice: 就当呼求他
  rationale: 第一人称复数劝勉虚拟式译为共同劝勉“就当”；“呼求”准确体现向上帝祈求援助的语境。
- source_word: εἰς βοήθειαν ἡμῶν
  choice: 来帮助我们
  rationale: 将字面“为作我们的帮助”自然地转为目的表达，不改变求助之意。
- source_word: εἰσακούσεται τῆς φωνῆς ἡμῶν
  choice: 他必垂听我们的声音
  rationale: εἰσακούομαι在祈祷语境中不只是听见，也含有听取、应允的意味；“垂听”保留这一语用色彩，“我们的声音”则保留φωνή的字面意象。
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: 只要这是他所喜悦的
  rationale: 保留条件从句对上帝旨意的尊重，不将其改写成无条件的应允；“这是”所指保持开放，可涵盖呼求或施行拯救之事。
theological_decisions:
- issue: σωτηρία在危难叙事中的译法
  choice: 拯救
  alternative: 救援；救恩
  rationale: 此处直接涉及上帝从现实危机中施行解救，但词语仍具有上帝施行拯救的神学内涵。“拯救”兼顾具体语境与神学分量；“救恩”可能过度偏向系统神学术语，“救援”则可能削弱原词的宗教意涵。
- issue: 应允与上帝喜悦之间的条件关系
  choice: 保留“只要这是他所喜悦的”
  alternative: 若他愿意；若这蒙他悦纳
  rationale: 原文明确设有条件，不宜把“他必垂听”处理成无条件保证。所指对象在语法上并未完全限定，因此不将其窄化为某一种解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“呼求”“垂听”保留经文语体，但不使用生僻古语。将条件从句前置，使汉语逻辑清楚，同时保留原文对上帝旨意的顺服及其潜在指代歧义。
