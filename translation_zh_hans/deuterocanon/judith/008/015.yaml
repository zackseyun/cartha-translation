base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: zh_hans
  text: 因为他若不愿意在这五天内帮助我们，他自己有权在自己所愿意的日子庇护我们[a]，甚至在我们的敌人面前毁灭我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保护我们。”原文动词本义是“遮盖”，这里指给予遮蔽和保护。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在我们敌人的面前毁灭我们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: 他若不愿意
  rationale: 保留 βούλομαι 所表达的意愿和选择意味，同时采用自然的现代汉语条件句。
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: 在这五天内
  rationale: 上下文所指的是此前限定的五日期限；“在这五天内”准确传达时间范围。
- source_word: βοηθῆσαι
  choice: 帮助我们
  rationale: βοηθέω 可指帮助或前来援助；“帮助”保持宽泛含义，不擅自加强为“拯救”。
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: 他自己有权
  rationale: “他自己”体现 αὐτός 的强调作用；“有权”表达 ἐξουσία 所含的权柄和自主决定权，且符合现代汉语。
- source_word: ἐν αἷς θέλει ... ἡμέραις
  choice: 在他所愿意的日子
  rationale: 贴近希腊语对“日子”的明确表达，并保留时间由神自由决定的含义。
- source_word: σκεπάσαι
  choice: 庇护我们
  rationale: σκεπάζω 本义为遮盖，此处具有保护、使人得遮蔽的意义；“庇护”兼顾语境和庄重语体。
- source_word: ὀλεθρεῦσαι
  choice: 毁灭我们
  rationale: 直接保留该动词强烈的毁灭含义，不弱化为仅仅容许灾祸发生。
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: 在我们的敌人面前
  rationale: 保留原文“在……面前”的公开、暴露意味，不擅自解释为“借敌人之手”。
theological_decisions:
- issue: 神对施救时间与最终结局的主权
  choice: 明确说神有权按自己所愿意的时间庇护，也有权毁灭
  alternative: 将后半句弱化为神只是容许敌人毁灭他们
  rationale: 两个不定式 σκεπάσαι 与 ὀλεθρεῦσαι 都受“有权”支配，原文直接把庇护和毁灭都置于神的权柄之下；译文保留这一神学张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“他自己有权”保留原文强调；句式尽量贴近希腊语逻辑，同时避免生硬的逐词对应。脚注标记依其实际所释词语放置。
