base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: zh_hans
  text: 因为我们若这样被擒[a]，整个犹太地都必衰败[b]，我们的圣物也必遭劫掠；至于这些圣物所受的亵渎，他必从我们的血中追讨[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头的句法不规则；也可译作“当我们这样被擒时”。这里的意思是：我们若在目前这种情形下被擒，灾祸便会随之临到。
    reason: alternative_reading
  - marker: b
    text: “衰败”所译的希腊词字面意思是“坐下”，在这里可能表示被压倒、陷于低落或无力自救。
    reason: lexical_alternative
  - marker: c
    text: 希腊文没有明说“追讨”的主语；上下文很可能指上帝要为圣物所受的亵渎追究责任，而代价落在我们的血上。“从我们的血中”也可理解为“要我们以血偿还”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: 因为我们若这样被擒
  rationale: 斯韦特文本的开头在句法上不规则，但 λημφθῆναι ἡμᾶς 明确指“我们被擒”。结合上下文，以“若”表达条件关系最自然；“因为”承接本节对后果的说明。
- source_word: καθήσεται
  choice: 必衰败
  rationale: 该动词字面为“坐下”，此处用于整个犹太地，语境含有低落、瘫痪或陷入衰败之意。中文直译“坐下”容易被误解为普通动作，因此正文采用“衰败”，并以脚注保留字面意象及其他可能含义。
- source_word: πᾶσα ἡ Ἰουδαία
  choice: 整个犹太地
  rationale: Ἰουδαία 指地域而非族群；“整个犹太地”清楚保留地理所指。
- source_word: προνομευθήσεται
  choice: 必遭劫掠
  rationale: 将来时被动语态表示圣物将被敌军掠夺；“遭劫掠”符合军事语境和现代汉语表达。
- source_word: τὰ ἅγια ἡμῶν
  choice: 我们的圣物
  rationale: 中性复数可泛指神圣物件或神圣之处，不宜缩窄成单数的“圣所”；“圣物”简洁并保留复数集合义。
- source_word: ζητήσει
  choice: 他必……追讨
  rationale: 动词为第三人称单数，但希腊文没有明说主语。“追讨”体现 ζητέω 在此处要求偿还、追究责任的司法意味，同时用“他”而不直接补入“上帝”。
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: 这些圣物所受的亵渎
  rationale: βεβήλωσις 指神圣事物遭到亵渎或玷污。补出“这些圣物”仅为明确 αὐτῶν 的指代，并未缩窄其含义。
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: 从我们的血中
  rationale: 保留希腊文介词短语的鲜明而艰涩的血之意象，不在正文中将其解释性改写为“以我们的血为代价”。
theological_decisions:
- issue: ζητήσει 的隐含主语
  choice: 保留为“他”，不在正文中点明身份
  alternative: 译为“上帝必追讨”，或采用无主句“必追讨”
  rationale: 上下文很可能指上帝追究亵渎圣物之责，但希腊文仅有第三人称单数动词，没有明说主语。保留“他”既反映语法数，也不把语境推断写成明文。
- issue: ἐκ τοῦ αἵματος ἡμῶν 所表达的责任与代价
  choice: 直译为“从我们的血中追讨”
  alternative: 解释为“要我们以血偿还”或“要以我们的血为代价追究”
  rationale: 原文关系凝缩且具有神学张力，可能同时涉及问责和血的代价；正文不将其单一化，脚注提示其可能含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“犹太地”明确地域意义；“圣物”“亵渎”“追讨”保持宗教与司法语域。正文保留末句主语及血之表达的含混性，必要说明置于脚注。
