  text: And she made for herself a tent on the roof of her house[a], and put sackcloth around her waist[b], and the garments of her widowhood were upon her.
translation:
  language: zh_hans
  text: 她在自己房屋的平顶上[a]搭了一座帐篷，又把麻布围在腰间[b]，身上穿着她寡居时的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指古代房屋可供活动和搭建遮蔽物的平坦屋顶。
    reason: cultural_note
  - marker: b
    text: 麻布是一种粗糙的布料，人常穿戴它来表示哀悼、悲伤或自我谦卑。
    reason: cultural_note
lexical_decisions:
- source_word: σκηνήν
  choice: 帐棚
  rationale: 该词通常指帐篷或临时搭建的遮蔽处；“帐棚”既贴近原义，也保留其作为独立临时居所的意味，不具体断定其构造。
- source_word: ἐπὶ τοῦ δώματος
  choice: 在……房子的平顶上
  rationale: δώμα在此指古代房屋可供使用的平坦屋顶；“平顶上”比单说“屋顶上”更准确地传达当时的建筑背景。
- source_word: σάκκον
  choice: 麻布
  rationale: σάκκος指粗糙的布料，常与哀悼、悲伤或自卑相连；“麻布”是现代中文圣经语境中自然且易懂的对应词。
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: 围在腰间
  rationale: ὀσφύς指腰或腰胯部；结合穿戴麻布的动作，“围在腰间”自然准确。
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: 守寡的衣服
  rationale: 直译保留这些衣服与她寡居身份及哀悼状态的关联，同时避免直接窄化为一般性的“丧服”。
- source_word: ἦν ἐπʼ αὐτῆς
  choice: 身上一直穿着
  rationale: 希腊文是表示持续状态的迂回结构；中文用“身上一直穿着”自然表达衣服在她身上的持续状态，同时承接上下文所述的寡居生活。
