  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: zh_hans
  text: 你们要记住他怎样对待亚伯拉罕，怎样试验[a]以撒，以及雅各在叙利亚的美索不达米亚[b]替他母亲的兄弟拉班牧羊时，发生在他身上的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试验”也可译作“考验”。希腊词可指试验、考验，在某些语境中也可指诱惑；这里是验证性的考验，并非引诱作恶。
    reason: lexical_alternative
  - marker: b
    text: “叙利亚的美索不达米亚”是希腊文的地理表达，也可译作“叙利亚美索不达米亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: 你们要记住
  rationale: 这是复数不定过去时命令式，表示劝勉众人回想上帝过去的作为；“你们要记住”自然、直接，并显明复数对象。
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: 他怎样对待亚伯拉罕
  rationale: μετά加属格在这里表示与亚伯拉罕之间的交往或处置；“对待”不预先限定为赐福或降祸，保留原文的宽泛性。
- source_word: ἐπείρασεν
  choice: 试验
  rationale: πειράζω可指试验、考验，也可在某些语境中指诱惑；这里回顾以撒的族长叙事，“试验”表达验证、考验之意，而不暗示引诱人作恶。
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: 雅各……所遭遇的一切
  rationale: 原文惯用结构指发生在雅各身上的种种事情；“所遭遇的一切”在中文中自然，并保留事件性质未被具体说明的宽度。
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: 在叙利亚的美索不达米亚
  rationale: 按原文保留属格地理表达，同时以现代中文可理解的形式呈现；脚注说明另一种自然译法。
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: 牧羊时
  rationale: 现在时分词表示当时持续进行的背景活动；“牧羊时”简洁自然，也保留具体的牧养图景。
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: 为他母亲的兄弟拉班
  rationale: 贴近原文亲属关系的表达，不用“舅舅”替代明说的“母亲的兄弟”；“为……牧羊”也清楚表明羊属于拉班。
theological_decisions:
- issue: 有关亚伯拉罕和以撒之动词的隐含主语
  choice: 以“他”表达，不在本节明确补作“上帝”
  alternative: 直接译作“上帝怎样……”；或完全省略主语
  rationale: 希腊文主语由上下文隐含。中文虽可省略，但首句用“他”更清楚；又不直接补入“上帝”，从而保留原文的含蓄。
- issue: ἐπείρασεν用于神圣行动时的含义
  choice: 试验
  alternative: 试探；考验
  rationale: “试验”能表达验证、磨炼的行动，又避免现代中文“试探”可能带有引诱作恶的含义；不对试验的具体神学目的作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要记住”保留对群体的劝勉语气；并列结构按中文稍作重组，避免生硬重复，同时保留三个族长事例的递进。脚注标记均放在其实际说明的词语之后。
