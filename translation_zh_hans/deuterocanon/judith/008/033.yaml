  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: zh_hans
  text: “你们今晚要留在城门口；我要和我的侍女一同出去。在你们所说这些日子一过，就要把城交给我们仇敌的这段日子里，主必借着我的手眷顾以色列。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε ἐπὶ τῆς πύλης
  choice: 要守在城门那里
  rationale: στήσεσθε字面为“站立”，在城门这一语境中表示留守、把守；译作“守在”既自然，也保留具体地点。
- source_word: ἅβρα
  choice: 侍女
  rationale: 指随身服侍的女仆或婢女；“侍女”符合古代叙事语境，且现代读者容易理解。
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: 在……期限以内
  rationale: 原文结构较生硬，意指在他们先前所定、届满后便交城的那些日子之内；如此表达清楚而不改变时间关系。
- source_word: παραδῶσειν τὴν πόλιν
  choice: 把城交给
  rationale: 保留παραδίδωμι“交出、交付”的基本意义，未强化为“投降”或“出卖”。
- source_word: ἐπισκέψεται
  choice: 眷顾
  rationale: 该词可指探望、关注并施行帮助；“眷顾”适合主对以色列采取拯救行动的语境，同时不具体限定行动方式。
- source_word: ἐν χειρί μου
  choice: 借我的手
  rationale: 按希伯来式希腊语习惯表示“藉着我/由我施行”；保留“手”的意象及其工具性。
theological_decisions:
- issue: 主眷顾以色列与友弟德作为行动媒介之间的关系
  choice: 主必借我的手眷顾以色列
  alternative: 主必藉着我拯救以色列
  rationale: 原文明确保留神为行动主体、友弟德为媒介；“眷顾”没有把结果提前解释为特定形式的“拯救”，因而更忠实地保留原文张力。
- issue: 友弟德话语的确定语气
  choice: 主必……眷顾
  alternative: 愿主……眷顾
  rationale: ἐπισκέψεται为陈述式将来时，不是祈愿式，故保留确定陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对白。“你们”保留复数对象；“今晚”自然对应τὴν νύκτα ταύτην。句法略作汉语化处理，以“期限以内”表达原文复杂的时间从句，同时不增添具体天数。
