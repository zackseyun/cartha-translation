  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: zh_hans
  text: 可是，百姓渴得厉害，迫使我们照我们先前对他们所说的去做，又迫使我们承担一个我们不会违背的誓言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又迫使我们以誓言约束自己。”希腊文直译为“把一个誓言带到我们身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: 渴得厉害
  rationale: σφόδρα加强ἐδίψησεν所表达的口渴程度；“渴得厉害”自然、清楚，又保留强烈语气。
- source_word: ἠνάγκασαν
  choice: 迫使
  rationale: 该动词表示强制或强烈施压；“迫使”符合上下文的严肃语气。
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: 使我们照先前对他们所说的去做
  rationale: 希腊文本的人称搭配较为生硬；结合ἡμᾶς及上下文，这里指众首领先前对百姓所作的承诺。译文不复制不自然的人称冲突，但以“先前”体现所说的话在先。
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: 使我们承担一个……誓言
  rationale: 原文直译为“把誓言带到我们身上”。“承担一个誓言”保留誓言临到自身并具有约束力的意象，同时符合现代汉语。
- source_word: ὃν οὐ παραβησόμεθα
  choice: 绝不会违背的
  rationale: παραβαίνω与ὅρκος连用表示违背誓言；“绝不会违背”清楚表达将来时的坚定陈述。
