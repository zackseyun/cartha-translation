  language: zh_hans
  text: 他不会死，直到你和他们一同被彻底消灭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不会被毁灭，直到你和他们一同被彻底消灭。”
    reason: 词义选择：ἀπολῇ也可理解为“被毁灭”，但正文采用更自然且能与后文强化动词相区别的“死”。
lexical_decisions:
- source_word: ἀπολῇ
  choice: 不会死
  rationale: ἀπόλλυμι在此为不及物用法，表示丧命、灭亡；译作“不会死”在现代汉语中自然，也避免与后文更强烈的“被彻底消灭”混同。
- source_word: ἕως οὗ
  choice: 直到
  rationale: 保留这一标准时间连词的基本意义及原文所形成的时间界限。
- source_word: ἐξολεθρευθῇς
  choice: 被彻底消灭
  rationale: ἐξολεθρεύω带有彻底毁灭、除灭的强化意味；“被彻底消灭”既体现被动语态，也保留其强度。
- source_word: μετʼ αὐτῶν
  choice: 和他们一同
  rationale: 准确表达伴随关系，并明确“你”将与“他们”遭遇同一结局。
- source_word: καὶ
  choice: （承接上文）
  rationale: 本节为承接前文的并列分句；汉语中可不机械译出“并且”，使独立呈现的句子自然流畅，而逻辑连接仍由语境承担。
