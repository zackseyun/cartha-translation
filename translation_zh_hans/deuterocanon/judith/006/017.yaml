  yaml_path: translation/deuterocanon/judith/006/017.yaml
  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: zh_hans
  text: 他回答说，把荷罗斐乃议会上的话、他在亚述子孙[a]的首领中间所说的一切话，以及荷罗斐乃针对以色列家所说的一切狂妄话[b]，全都告诉了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚述人”。希腊文直译为“亚述的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所夸的一切话”或“所说的一切狂傲话”。希腊文动词指骄傲、自夸地说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 他回答说
  rationale: 保留分词所表达的回应意味，同时采用自然的现代汉语叙事句式。
- source_word: ἀπήγγειλεν
  choice: 告诉了他们
  rationale: 此动词表示将事情报告、转告给人；这里用“告诉”自然清楚，并由后面的具体内容体现报告性质。
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: 荷罗斐乃议事会中的言论
  rationale: συνεδρεία在此指议事的集会或会议；译文不把它误作抽象的“计谋”，并以“言论”承接重复出现的ῥήματα。
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: 在……的首领中间
  rationale: 贴近原文空间性表达“在……中间”，同时在汉语中可自然理解为当着众首领说话。
- source_word: υἱῶν Ἀσσούρ
  choice: 亚述子孙
  rationale: 保留原文“亚述之子”的族群称谓形式，而不在正文中直接简化为“亚述人”。
- source_word: ἐμεγαλορρημόνησεν
  choice: 所发的一切狂言
  rationale: 该罕见动词指狂傲、自夸地说话；“发狂言”简洁地保留其负面语气及言说性质。
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: 针对以色列家
  rationale: εἰς本可表示方向或关涉对象；结合敌对语境，“针对”表达敌意，又比“攻击”更少增添原文未明说的行动含义。
theological_decisions:
- issue: 族群称谓 υἱῶν Ἀσσούρ
  choice: 亚述子孙
  alternative: 亚述人
  rationale: 保留希腊文带有古典色彩的字面构造，避免未经说明便将其规范化；脚注提供自然的族名理解。
- issue: εἰς τὸν οἶκον Ἰσραήλ 的关系含义
  choice: 针对以色列家
  alternative: 论到以色列家
  rationale: 上下文与狂傲言辞支持敌对方向，但“针对”仍保留言论对象的宽度，不把它强化为实际攻击。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“言论—话—狂言”的递进既反映原文对言说词汇的反复，也避免汉语机械重复。人名按希腊文 Ὀλοφέρνης 音译为“荷罗斐乃”。所有脚注标记均置于对应正文词语之后。
