  text: And they encouraged Achior[a], and praised him greatly.
translation:
  language: zh_hans
  text: 他们安慰亚希约尔[a]，又大大称赞他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安慰”也可译作“鼓励”、“劝勉”或“劝告”；原文动词的含义较广，须按上下文理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσαν（παρακαλέω）
  choice: 安慰
  rationale: 该动词可表示劝勉、鼓励、安慰或劝告。结合上下文中亚基约刚经历的遭遇，这里以支持、抚慰之意最为自然；“安慰”也保留了该词在此处可能具有的鼓励意味。
- source_word: Ἀχιὼρ
  choice: 亚基约
  rationale: 按通行的现代中文圣经人名译写习惯音译该人名。
- source_word: ἐπήνεσαν（ἐπαινέω）
  choice: 称赞
  rationale: 该动词意为赞扬、嘉许；“称赞”自然、直接，并能与其后的程度副词顺畅搭配。
- source_word: σφόδρα
  choice: 大大
  rationale: 该副词强烈修饰“称赞”；“大大称赞”是自然庄重的现代汉语表达，保留了原文的强调程度。
