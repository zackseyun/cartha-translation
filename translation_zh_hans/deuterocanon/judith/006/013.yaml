  yaml_path: translation/deuterocanon/judith/006/013.yaml
  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
translation:
  language: zh_hans
  text: 他们下到山下，把亚基约尔捆住，丢在山脚下[a]，就往他们的主人那里去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丢在”也可译作“弃置在那里”。希腊文强调亚基约尔已被扔下，并被留下处于那种状态。
    reason: 说明ἐρριμμένον作为完成时被动分词所表达的被扔下及结果状态，并将锚点置于相应译词。
lexical_decisions:
- source_word: ὑποδύσαντες ὑποκάτω τοῦ ὄρους
  choice: 下到山下
  rationale: 以自然汉语表达向下移动并到达山体下方的意思，也保留分词所表示的先后次序。
- source_word: ἔδησαν
  choice: 捆起来
  rationale: 准确表达捆绑、限制行动之意，比单说“绑”更符合现代叙事汉语。
- source_word: ἀφῆκαν ἐρριμμένον
  choice: 扔在
  rationale: ἐρριμμένον是ῥίπτω的完成时被动分词，强调他被扔下后仍处于那种状态；“扔在”在简洁自然的汉语中保留了动作的暴力意味及结果状态。
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: 在山脚下
  rationale: ῥίζα字面为“根”，用于地貌时指山的根部或基部；“山脚下”是现代汉语的自然对应。
- source_word: ἀπῴχοντο πρὸς τὸν κύριον αὐτῶν
  choice: 回他们的主人那里去了
  rationale: ἀπῴχοντο表示离去，πρός表明去向；上下文中的κύριος是人的上级，“主人”避免误解为神圣称号。
- source_word: Ἀχιὼρ
  choice: 亚基约尔
  rationale: 按希腊文Ἀχιώρ音译人名，并采用便于现代普通话读者辨识的形式。
theological_decisions:
- issue: κύριος在此指人的上级而非上帝
  choice: 他们的主人
  alternative: 他们的主；他们的长官
  rationale: 所有格和军事叙事表明所指是士兵的人间上级。“主人”保留κύριος的主从关系，同时不赋予神圣称号含义；“长官”虽符合语境，却会增加原文没有明说的军职信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“他们下到山下”顺畅呈现希腊文分词结构；用“然后”标明事件推进。脚注标记紧随存在词义张力的“山脚下”处整句动作之后。
