review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了行动顺序、营地—平原—山区的地形转换，以及泉源位于伯图利亚下方的方位关系。“奴仆”恰当地反映 δοῦλοι 的从属身份。“泉水边”却将原文单纯的“到泉源/泉水处”（ἐπὶ τὰς πηγάς）具体化为“边”，宜改为“泉源处”。
  naturalness: 原译基本通顺，但“他的奴仆抓住他”在现代汉语中两个“他”紧连，指代容易瞬时混淆；在不增添解释的情况下，以“他的奴仆抓住了他”并配合完整动作体更自然。结尾改为“泉源处”也比“泉水边”更贴合叙事地点表达。
  terminology: “奴仆”“营地”“平原”“山区”“伯图利亚”均适切。“泉源”对应 πηγαί（自然涌出的水源）较“泉水”精确；“下方”保留 ὑποκάτω 的地理相对位置。
  issues:
  - severity: low
    issue: “泉水边”加入了原文未明示的“边”这一空间关系。
    rationale: ἐπὶ τὰς πηγάς 表示到达泉源/泉水所在之处，不要求说他们在泉水边。改作“泉源处”既自然又不扩充。
  - severity: low
    issue: 首句动作体与代词衔接可更自然。
    rationale: “抓住了他，把他带出……”符合现代叙事汉语的完成动作表达，并稍减连续代词造成的阅读滞碍，不改变原文指代。
  revised_text: 他的奴仆抓住了他，把他带出营地，来到平原；他们又从平原中部上到山区，来到伯图利亚下方的泉源处。
