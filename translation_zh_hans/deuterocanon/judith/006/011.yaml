  text: And his servants seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: zh_hans
  text: 他的奴仆抓住了他，把他带出营地，来到平原；他们又从平原中部上到山区，来到伯图利亚下方的泉源处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 该词表示处于主人权下的人；此处指敖罗斐乃手下受其支配、奉命行事的人。“奴仆”既保留从属身份，也符合庄重的叙事语体。
- source_word: συνέλαβον
  choice: 抓住
  rationale: 动词表示实际动手擒住或控制某人；“抓住”保留动作的力度，又不引入“逮捕”所暗示的司法程序。
- source_word: παρεμβολῆς
  choice: 营地
  rationale: 在军事叙事中指军队驻扎之处；“营地”是现代汉语中自然明确的对应词。
- source_word: πεδίον / πεδινῆς
  choice: 平原
  rationale: 上下文将低平地带与山区相对照；统一译作“平原”，清楚呈现地势和行进路线。
- source_word: ἀπῆραν
  choice: 上到
  rationale: 该动词在此为不及物用法，表示离开原处、启程前往；结合从平原进入ὀρεινήν的地势变化，译作“上到”自然表达向高地行进，同时不擅自补出重复宾语。
- source_word: ὀρεινήν
  choice: 山区
  rationale: 该名词化形容词指多山或高地地区；“山区”与“平原”形成清晰而自然的地形对照。
- source_word: παρεγένοντο
  choice: 来到
  rationale: 表示抵达某处；“来到”适合连续叙事，并准确交代他们到达泉水所在地。
- source_word: πηγάς
  choice: 泉水
  rationale: 指自然涌出的水源；“泉水”比“喷泉”或泛称“水源”更贴合地理语境。
- source_word: ὑποκάτω
  choice: 下方
  rationale: 表示相对于伯图利亚较低的位置；“下方”简洁保留其地理方位。
- source_word: Βετυλουά
  choice: 伯图利亚
  rationale: 作为地名采用现代汉语中易读的音译，并与通行的Bethulia形式相呼应。
