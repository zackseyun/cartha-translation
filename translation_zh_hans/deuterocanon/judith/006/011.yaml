  to: 他的奴仆抓住了他，把他带出营地，来到平原；他们又从平原中部上到山区，来到伯图利亚下方的泉源处。
  rationale: 作两项轻微而安全的修订：以“抓住了”改善动作体和行文流畅度；以“泉源处”准确对应 πηγαί，避免“泉水边”额外限定位置。其余措辞保留原译对希腊文句法、地形对照和庄重叙事语体的忠实呈现。
