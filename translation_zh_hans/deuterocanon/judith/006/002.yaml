review_pass:
  verdict: revise
  source_fidelity: 草稿总体传达了质问、讥讽、以色列之神护卫以及尼布甲尼撒的僭妄宣称。但“住在”并非原文所说，且把语法艰涩的“摩押众子……以法莲的受雇者”处理成“你们这些……雇佣兵”，加入了居住关系并过度明确其军事身份。τὸ κράτος αὐτοῦ宜保留为“力量/威势”，不宜限定为“大军”；ἀπὸ προσώπου τῆς γῆς宜译为“从地上”，而非“从地面上”。
  naturalness: “你算什么”与“救不了”符合人物轻蔑、夸口的口吻；不过“说预言”改为“说了预言”或“说预言说”更顺畅。“你这……又算什么”能够在现代汉语中较自然地保留原文单数称呼与紧随其后的复数名词短语之间的张力，而不擅自解决其艰涩句法。
  terminology: 专名“亚基奥、摩押、以法莲、尼布甲尼撒”可保留。“以色列族”能体现γένος的族属／世系含义。“神”用于尼布甲尼撒的僭称，并以脚注说明；指以色列所敬奉者的两处“上帝”也可保留。μισθωτοί用“受雇者”比“雇佣兵”更不预断其为军事人员，同时脚注可说明“雇佣兵”是可能译法。
  issues:
  - severity: medium
    issue: “住在摩押众子中间”加入原文未明说的居住关系。
    rationale: πρὸς πάντας υἱοὺς Μωὰβ可表达“在／面对所有摩押子孙”，不能安全地具体化为“住在”。
  - severity: medium
    issue: “以法莲雇佣兵”将μισθωτοί限定为军事雇佣兵。
    rationale: 该词基本义为受雇取酬者；本句有轻蔑语气和军事上下文，但原词本身未明确要求“雇佣兵”。
  - severity: medium
    issue: “派出自己的大军”把κράτος限定为军队。
    rationale: κράτος指力量、威势或权能；与“派出”连用有军事语境，但仍应避免把其具体化为“大军”。
  - severity: low
    issue: “从地面上”未充分体现“从地上／从大地表面上”的惯用圣经表达。
    rationale: ἀπὸ προσώπου τῆς γῆς是“从地上除灭”的固定式空间意象。
  revised_text: “亚基奥，你是谁？你这以法莲的受雇者，在所有摩押子孙中又算什么，竟像今天这样在我们中间说了预言，说不可攻打以色列族[b]，因为他们的上帝必保护他们？除了尼布甲尼撒，还有谁是神[c]？他必派出自己的力量，把他们从地上彻底消灭；他们的上帝必不能搭救他们。”
  revised_footnotes:
  - marker: a
    text: “受雇者”原文指受雇取酬的人，带有轻蔑意味；在此军事语境中，也可译作“雇佣兵”或“受雇的人”。
    reason: lexical_alternative
  - marker: b
    text: “以色列族”原文强调共同血缘、世系或族属，也可译作“以色列人”。
    reason: lexical_alternative
  - marker: c
    text: “除了尼布甲尼撒，还有谁是神”是说话者狂妄的夸口，并非叙述者认可尼布甲尼撒为神。
    reason: theological_clarification
  revision_rationale: 删去无原文依据的“住在”，并以“受雇者”保留μισθωτοί的较宽词义；保留脚注所列的“雇佣兵”作为上下文可能译法。将κράτος译作“力量”，避免限定为一支“大军”；将地上的惯用语恢复为“从地上”。原文开头的单数称呼后紧接复数名词短语，句法本有艰涩；修订以“你这……受雇者”尽量保留这一张力，而不以“你们这些”把它平整化。脚注a保留在完整脚注集中，但由于修订正文未在该词处设置标记，建议在排版时将[a]置于“受雇者”之后。
