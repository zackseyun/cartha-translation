base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: zh_hans
  text: “你算什么，亚基奥？你们这些住在摩押众子中间的以法莲雇佣兵[a]，竟敢今天在我们当中说预言，说不可攻打以色列族[b]，因为他们的上帝会保护他们？除了尼布甲尼撒，还有谁是神[c]？他必派出自己的大军，把他们从地面上彻底消灭；他们的上帝救不了他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雇佣兵”原文指受雇取酬的人，也可译作“受雇的人”；这里带有轻蔑意味。
    reason: lexical_alternative
  - marker: b
    text: “以色列族”原文强调共同血缘或族属，也可译作“以色列人”。
    reason: lexical_alternative
  - marker: c
    text: “除了尼布甲尼撒，还有谁是神”是说话者狂妄的夸口，并非叙述者认可尼布甲尼撒为神。
    reason: theological_clarification
lexical_decisions:
- source_word: μισθωτοὶ Ἐφράιμ
  choice: 以法莲雇佣兵
  rationale: μισθωτοί指受雇取酬的人；在军事语境及侮辱性话语中，“雇佣兵”自然保留其轻蔑意味。Ἐφράιμ按传统译作“以法莲”。
- source_word: ἐπροφήτευσας
  choice: 说预言
  rationale: 保留原文明确的先知性用语，同时在敌意语境中也能呈现说话者的讥讽口吻。
- source_word: τὸ γένος Ἰσραήλ
  choice: 以色列族
  rationale: γένος可指血缘、族类或民族群体；“以色列族”既保留族裔和世系意味，也比现代汉语中的“种族”自然且不易引发误解。
- source_word: μὴ πολεμῆσαι
  choice: 不可攻打
  rationale: 以简洁自然的汉语表达依附于“说”的禁止性不定式，并保留军事含义。
- source_word: ὑπερασπιεῖ
  choice: 会保护
  rationale: 该词表示庇护、保卫或为人作战；“保护”在此清楚自然，又不把含义缩窄为亲自参战。
- source_word: τὸ κράτος αὐτοῦ
  choice: 自己的大军
  rationale: κράτος本义涉及力量、威势或权能；在“派出”的军事语境中具体指其武力。“大军”自然传达其军事力量，但承认原词也可较抽象地译为“威力”。
- source_word: ἐξολεθρεύσει
  choice: 彻底消灭
  rationale: 该动词具有灭尽、除灭的强烈意味；加入“彻底”较完整地体现其力度。
- source_word: ἀπὸ προσώπου τῆς γῆς
  choice: 从地面上
  rationale: 保留圣经惯用语的空间意象，同时采用现代汉语可自然理解的表达。
- source_word: ῥύσεται
  choice: 救不了
  rationale: ῥύομαι表示从危险中搭救或解救；“救不了”符合夸口式口吻，并直接对应当前的军事危难。
theological_decisions:
- issue: 尼布甲尼撒被称为神的夸口
  choice: 除了尼布甲尼撒，还有谁是神？
  alternative: 除了尼布甲尼撒，还有谁是上帝？
  rationale: 希腊文大小写不能裁定此处的神学指称。用“神”呈现谓语性的僭妄宣称，而以脚注说明这是人物的狂妄话语，不是叙述者认可；这样既保留冒犯性的张力，也避免读者误认作经文的神学断言。
- issue: 两处“他们的神”如何称呼
  choice: 他们的上帝
  alternative: 他们的神
  rationale: 这两处明确指以色列所敬奉的上帝，采用“上帝”便于现代读者辨认所指；同时保留说话者否认其保护和拯救能力的敌意言论，并不暗示叙述者赞同。
translation_notes:
  register: 采用现代、庄重而有力度的直接引语。“你算什么”和“竟敢”呈现τίς εἶ及整句质问的蔑视语气；专名采用常见圣经译名“亚基奥、摩押、以法莲、尼布甲尼撒”。所有脚注标记均置于相关正文之后。
