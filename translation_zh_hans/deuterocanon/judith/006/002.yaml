review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了质问、讥讽性的“说预言”、禁止攻打以色列、尼布甲尼撒的僭妄宣称，以及毁灭和不能搭救的意思。但“住在”不是原文所明说；“雇佣兵”和“大军”均将原文较宽的“受雇者／武力”军事化、具体化；“地面上”也弱化了“从地上（除去）”这一圣经惯用表达。开头希腊句法本身艰涩，宜以不额外补足身份或居住事实的中文处理。
  naturalness: “说预言”在现代汉语中不够自然，改为“预言”更合适。“你算什么”可保留蔑视口吻，但将后续称谓整理为直接呼语，可避免“你们这些住在……”带来的不必要断言和句法拖沓。
  terminology: 专名“亚基奥、摩押、以法莲、尼布甲尼撒”可保留。“以色列族”恰当传达γένος的族属／血缘意味。“神”用于尼布甲尼撒的僭妄自称、而“他们的上帝”用于以色列所敬奉者，区分清楚。将μισθωτοί译为“受雇的人”比“雇佣兵”更不越界；将κράτος译为“兵力”并以脚注保留“武力／威势”的范围。
  issues:
  - severity: medium
    issue: “住在摩押众子中间”加入了原文未明说的居住事实。
    rationale: πρὸς／ἐν此处的句法关联艰涩；无论如何，它不足以安全地断定这些人“住在”那里。宜仅译作“在摩押众人中间”，并保持其作为称呼背景的关系。
  - severity: medium
    issue: “雇佣兵”将μισθωτοί限定为军事雇佣兵。
    rationale: 该词基本义是受雇取酬者；语境可以含贬义，却不必然指职业军人。正文宜用“受雇的人”，脚注说明可译“雇佣兵”。
  - severity: medium
    issue: “自己的大军”把κράτος过度限定为军队。
    rationale: κράτος可指力量、武力、威势或权能；尽管紧邻“派出”且处于战争语境，译为“兵力”较贴近上下文，同时脚注保留其较宽范围。
  - severity: low
    issue: “从地面上”未充分表达ἀπὸ προσώπου τῆς γῆς的惯用语力度。
    rationale: “从地上除灭”在现代汉语中自然，并保留从全地上被除去的庄重、强烈意象。
  - severity: low
    issue: “说预言”不够符合现代汉语搭配。
    rationale: 动词ἐπροφήτευσας可直接译为“预言”；敌对、讥讽口吻已由整段反问和语境呈现，无须以不自然搭配表达。
  revised_text: “亚基奥，你算什么？你们这些在摩押众人中间的以法莲受雇的人[a]，竟在我们中间预言，像你今天所做的那样，又说不可攻打以色列族[b]，因为他们的上帝必保护他们？除了尼布甲尼撒，还有谁是神[c]？他必派出自己的兵力[d]，把他们从地上彻底除灭；他们的上帝救不了他们。”
  revised_footnotes:
  - marker: a
    text: “受雇的人”原文指为报酬服务的人，也可译作“雇佣兵”或“受雇者”；在这里带有轻蔑意味。
    reason: lexical_alternative
  - marker: b
    text: “以色列族”原文强调共同血缘、世系或族属，也可译作“以色列人”。
    reason: lexical_alternative
  - marker: c
    text: “除了尼布甲尼撒，还有谁是神”是说话者狂妄的夸口，并非叙述者认可尼布甲尼撒为神。
    reason: theological_clarification
  - marker: d
    text: “兵力”原文也可指“武力、力量”或“威势”。
    reason: lexical_alternative
  revision_rationale: 修订避免将艰涩的开头句法解释为“居住”，并避免把“受雇者”和κράτος分别硬性限定为“雇佣兵”和“大军”。正文仍保留说话者的蔑视、预言用语、γένος的族属意味、对尼布甲尼撒的僭妄宣称及灭绝威胁。新增d脚注对应正文中需要保留的κράτος语义范围；全部脚注标记均置于相应词语之后。
