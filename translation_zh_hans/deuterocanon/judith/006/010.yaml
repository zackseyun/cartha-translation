  yaml_path: translation/deuterocanon/judith/006/010.yaml
  text: And Holofernes ordered his servants[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: zh_hans
  text: 荷罗斐乃命令他帐篷里侍立的奴仆，抓住亚希约尔，把他带到贝突路亚[a]，交在以色列子孙[b]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贝突路亚”也常按传统形式译作“伯突利亚”。
    reason: 地名的传统译法
  - marker: b
    text: 原文直译为“以色列的儿子们”，这里是对以色列人的群体称呼。
    reason: 说明希腊文的字面表达及其群体含义
lexical_decisions:
- source_word: προσέταξεν
  choice: 下令
  rationale: 表达带有权威的命令，符合军事叙事语境，也比一般的“吩咐”更有力度。
- source_word: τοῖς δούλοις αὐτοῦ
  choice: 他的奴仆
  rationale: δοῦλος可指受主人支配的奴隶或仆役；“奴仆”既保留其从属身份，又适合庄重的现代汉语叙事。
- source_word: παρεστηκότες
  choice: 侍立
  rationale: 该完成时分词表示他们站在近旁听候差遣；“侍立”简洁呈现其位置和服侍状态。
- source_word: σκηνῇ
  choice: 帐篷
  rationale: 此处是军营中的实际帐篷，不是宗教意义上的会幕。
- source_word: συλλαβεῖν
  choice: 抓住
  rationale: 保留强制捉拿之意，同时不加入原文没有明确表达的正式司法程序。
- source_word: ἀποκαταστῆσαι
  choice: 押送到
  rationale: 此处指将亚希约尔强制带往贝突路亚；“押送到”符合叙事处境，也避免“送回”暗示他原本来自该城。
- source_word: Βετυλουὰ
  choice: 贝突路亚
  rationale: 按希腊文地名音译，并采用便于现代普通话读者辨认和朗读的形式。
- source_word: παραδοῦναι εἰς χεῖρας
  choice: 交在……手中
  rationale: 保留原文“交付到手中”的生动惯用语，表达把人移交给对方控制。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留υἱῶν的亲属称谓和圣经式群体表达；这里整体指以色列人。
theological_decisions:
- issue: δοῦλοι所表达的社会身份
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 原词可强调受主人支配的身份，但本节未具体说明其法律地位；“奴仆”不将其淡化为普通工作人员，也不比原文更精确地断定制度身份。
- issue: υἱῶν Ἰσραήλ的群体与性别表达
  choice: 以色列子孙
  alternative: 以色列人；以色列的儿子们
  rationale: “以色列子孙”既保留原文的后裔性表达，又自然地指整个以色列群体，不把此处僵硬地限定为若干男性个体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“侍立”“奴仆”“交在……手中”保留叙事的古典庄严感，但句法仍自然易懂；专名以希腊文形式为主要依据。
