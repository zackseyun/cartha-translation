base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/005.yaml
  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: zh_hans
  text: 但你，亚希约尔，亚扪的雇工[a]，在你不义之日说了这些话[b]；从今日起，你必不再见我的面，直到我施行报复。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雇工”也可译作“受雇的人”或“雇佣兵”。
    reason: lexical_alternative
  - marker: b
    text: “在你不义之日”也可理解为“在你作恶的那一天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτὲ
  choice: 雇工
  rationale: 指受雇取酬之人；“雇工”贴近原词，也保留直呼时略带轻蔑的语气，而不擅自限定为军事意义上的“雇佣兵”。
- source_word: τοῦ Ἀμμών
  choice: 亚扪的
  rationale: 按属格直译为归属或出身，避免改写成形容词式称谓。
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: 说了这些话
  rationale: 自然而贴近原文，明确回指亚希约尔先前所说的话。
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: 在自己行不义之日
  rationale: 保留“日”这一时间表达及ἀδικία的道德指控；中文用“行不义”比抽象的“你的不义之日”更自然，但不判定其具体所指。
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: 你必不再见我的面
  rationale: 保留原文“见我的面”的惯用表达及威吓语气。
- source_word: ἀπὸ τῆς ἡμέρας ταύτης ἕως οὗ ἐκδικήσω
  choice: 从今日起……直到我施行报复
  rationale: 准确表达起始点和终止界限；“施行报复”保留ἐκδικέω在此处的惩罚性力度。
theological_decisions:
- issue: 敌对统治者指控中的ἀδικία如何表达
  choice: 行不义
  alternative: 作恶；不公不义
  rationale: “行不义”既保留道德和司法色彩，也不把所指缩窄为某一项具体罪行或单纯的不忠。
- issue: ἕως οὗ ἐκδικήσω的对象在本节未明说
  choice: 直到我施行报复
  alternative: 直到我报仇；直到我惩罚你
  rationale: 原文没有明示报复的对象；译文不补入“你”，以保留句法上的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。直呼与宣判之间用分号分隔，使长句清楚；保留“见我的面”和“直到”等原文结构。
