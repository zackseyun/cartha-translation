  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
translation:
  language: zh_hans
  text: 到那时，我军的铁器[a]和我仆从的部众必穿透你的两胁[b]；当他们回来时，你必倒在他们的伤者中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铁器”原文直译为“铁”，这里很可能以铁代指兵器或武装力量；也可较明确地译作“我军的刀剑”。
    reason: lexical_alternative
  - marker: b
    text: “两胁”也可译作“两侧”或“肋骨”；原词既可指人的身体侧部，也可在群体或军事语境中指侧翼。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他们的伤者”，表达较为凝练；“他们”具体指谁，以及这一属格是否暗示“被他们击伤的人”，都可有不同理解。译文保留原文的歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: διελεύσεται
  choice: 必穿透
  rationale: 该动词本义为“经过、穿过”；在以铁制兵器和身体两侧为语境的威吓中，“穿透”自然传达其隐含的刺穿与毁伤意味，又不扩写为具体攻击方式。
- source_word: ὁ σίδηρος
  choice: 铁器
  rationale: 原文直译为“铁”，在此以材料代指铁制兵器。“铁器”保留这一鲜明的转喻，不擅自限定为刀或剑。
- source_word: τῆς στρατείας μου
  choice: 我军的
  rationale: στρατεία在此指军事力量，而非抽象的战役或出征行动；“我军”简洁自然。
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: 我仆从的部众
  rationale: λαός指人众，θεράπων指服侍者、随从或仆从。“部众”符合军事场景，同时没有把他们直接窄化为原文未明说的某一兵种。
- source_word: τὰς πλευράς σου
  choice: 你的两胁
  rationale: πλευρά可指身体的侧面、肋部，也可作军事意义的侧翼。此处单数第二人称直接受到死亡威胁，“两胁”既自然又保留身体侧部的意象。
- source_word: πεσῇ
  choice: 你必倒在
  rationale: πίπτω在战斗语境中可表示倒下、败亡；译作“倒在”保留原文形象，不明说究竟是受伤还是死亡。
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: 在他们的伤者中
  rationale: τραυματίας是“受伤的人”；αὐτῶν的关系在原文中较为压缩。“他们的伤者”保留这种表达，并由脚注说明可能的施事含义。
- source_word: ὅταν ἐπιστρέψωσιν
  choice: 等他们回来时
  rationale: ὅταν加虚拟式构成指向未来的时间从句；“等他们回来时”符合威吓语气，也保留“返回”的基本含义。
