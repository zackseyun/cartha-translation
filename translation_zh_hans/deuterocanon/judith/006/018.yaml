  text: 百姓俯伏敬拜上帝，高声呼喊说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: 俯伏在地
  rationale: 该不定过去时分词表示先于主要动作发生的身体动作。译作“俯伏在地”既保留倒伏、伏地之意，也自然呈现敬拜时的姿态，而不必另加解释。
- source_word: ὁ λαός
  choice: 众人
  rationale: λαός在此为单数集合名词，指在场的百姓群体；现代汉语用“众人”比“人民”更符合叙事场景。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: προσκυνέω以“上帝”为对象时明确表示宗教性的敬拜；“敬拜”准确且符合现代汉语圣经语体。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: θεός在此指以色列所敬拜的神；采用现代标准普通话中庄重、通行的“上帝”，不额外传递希腊冠词。
- source_word: ἐβόησαν
  choice: 高声呼喊
  rationale: 该动词表示发出响亮而迫切的声音；“高声呼喊”兼顾音量与强烈语气。
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词引出呼喊的具体内容。汉语以“呼喊说”自然衔接下一节，并保留原句尚未完结的结构。
