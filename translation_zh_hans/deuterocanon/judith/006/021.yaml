  yaml_path: translation/deuterocanon/judith/006/021.yaml
  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
translation:
  language: zh_hans
  text: 乌西雅把他从集会中带到自己的家里[a]，又为众长老设宴[b]。那一整夜，他们都呼求以色列的上帝施以援助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “集会”所译的希腊语ἐκκλησία在这里指聚集起来的民众或公共大会，并非后世基督教意义上的“教会”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“办饮宴”或“备酒”；这里指设下宴席款待长老。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: 带到
  rationale: 此处表示乌西雅带着亚基约从聚集之处转移到自己家中；“带到”自然呈现从一处到另一处的动作。
- source_word: ἐκ τῆς ἐκκλησίας
  choice: 从会众中
  rationale: ἐκκλησία在此指聚集起来的群体或民众大会，并非后世基督教意义上的“教会”；“会众”兼顾群体与聚集的语境。
- source_word: οἶκον ἑαυτοῦ
  choice: 自己家里
  rationale: 指乌西雅本人的住所；现代汉语中“自己家里”比生硬的“自己的房屋”更自然。
- source_word: ἐποίησεν πότον
  choice: 设宴
  rationale: 该短语字面涉及饮宴，在此是为人置办宴席；“设宴”简洁、庄重，也保留宴饮的社交场景。
- source_word: τοῖς πρεσβυτέροις
  choice: 为众长老
  rationale: 此处所指是群体中的长者或领袖；“长老”保留其社会身份，而不只强调年龄。
- source_word: ἐπεκαλέσαντο
  choice: 呼求
  rationale: 该中间语态在此表示向上帝祈求、求告；“呼求”准确保留祷告和恳求的意味。
- source_word: τὸν θεὸν Ἰσραήλ
  choice: 以色列的上帝
  rationale: 直接保留这一属格称号，明确所呼求的是以色列的上帝。
- source_word: εἰς βοήθειαν
  choice: 帮助
  rationale: 该介词短语表示求取援助；与“呼求”连用译作“呼求……帮助”，符合现代汉语表达。
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: 那一整夜
  rationale: 准确表达时间延续了一整夜；“都”进一步自然呈现持续不断的意味。
theological_decisions: []
