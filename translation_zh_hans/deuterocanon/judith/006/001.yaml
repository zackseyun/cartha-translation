  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: zh_hans
  text: 围在议事会周围的众男子停止喧嚷后，亚述[a]军队的统帅荷罗弗尼当着全体外族会众的面，对亚基约说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作专名“亚述”；此处可理解为人名或族名“亚述”，也可理解为国名“亚述国”。
    reason: 保留Ἀσσοὺρ作为人名／族名或国名的可能歧义。
lexical_decisions:
- source_word: κατέπαυσεν
  choice: 停止
  rationale: 表示喧嚷已经平息，随后荷罗弗尼才开口；“停止喧嚷后”自然体现叙事先后。
- source_word: θροῦβος
  choice: 喧嚷
  rationale: 该词指嘈杂骚动；“喧嚷”同时保留声音嘈杂和群情扰攘的意味。
- source_word: συνεδρίας
  choice: 议事会
  rationale: 指为商议而聚集的会议或议事团体；“议事会”保留其议事性质。
- source_word: ἀρχιστράτηγος
  choice: 统帅
  rationale: 这是高阶军事头衔，不只是一般将领；“统帅”在现代中文中简洁庄重。
- source_word: δυνάμεως
  choice: 军队
  rationale: 在军事语境中指武装力量，译作“军队”最清楚自然。
- source_word: Ἀσσοὺρ
  choice: 亚述
  rationale: 按专名音译；中文“亚述”可用于同名始祖或国名，具体所指以脚注保留。
- source_word: ἐναντίον
  choice: 当着……的面
  rationale: 这里强调公开发言的场合，而非单纯空间上的“前面”。
- source_word: δήμου
  choice: 会众
  rationale: 指聚集在场的全体群体；“会众”比泛称“人民”更贴合公开讲话的场景。
- source_word: ἀλλοφύλων
  choice: 外族
  rationale: 泛指其他族类或民族的人，并非特指非利士人；“外族”保留族群差异而不过度解释。
theological_decisions:
- issue: 专名Ἀσσοὺρ的所指
  choice: 正文音译为“亚述”，脚注说明可指“亚述”这一专名或亚述国
  alternative: 直接译为“亚述国”
  rationale: 希腊文采用专名形式，本节语法允许将其理解为个人／族名或国名；正文不把这种含混单方面化解为地缘政治名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“停止喧嚷后”清楚呈现动作顺序；“当着全体外族会众的面”体现讲话的公开性。脚注标记紧随“亚述”，避免与“停止喧嚷”误连。
