base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: zh_hans
  text: “因为我们必在他们所在之处把他们烧尽；他们的边境必饱饮他们的血[a]，他们的平原必遍布他们的尸体。他们的脚踪在我们面前必站立不住[b]，他们必彻底灭亡。”全地的主宰尼布甲尼撒王这样说。因为他说过：“他所说的话绝不会落空。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们的边境必因他们的血而醉”。原文以醉酒为喻，描写遍地流血。
    reason: lexical_alternative
  - marker: b
    text: “脚踪站立不住”可理解为连他们留下的踪迹也不能存留，或无人能在进攻者面前站立抵抗；原文意象容许这两层意思。
    reason: genuine_ambiguity
lexical_decisions:
- source_word: κατακαύσομεν ... ἐν αὐτοῖς
  choice: 我们必在他们所在之处把他们烧尽
  rationale: κατακαίω带有烧毁、烧尽的加强意味；重复的ἐν αὐτοῖς按处所义自然表达为“在他们所在之处”，既保留原文指向，又避免生硬直译。
- source_word: τὰ ὅρια αὐτῶν
  choice: 他们的边境
  rationale: ὅρια可指边界或边境地区；军事语境中“边境”保留了具体的地理意象。
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: 必饱饮他们的血
  rationale: 原文动词本义为“喝醉”；以边境为主语时是拟人化的血腥意象。“饱饮”在现代汉语中自然而庄重，并保留原文比单纯“浸透”更强烈的修辞。
- source_word: τὰ πεδία αὐτῶν
  choice: 他们的平原
  rationale: πεδία指平地、平原或开阔地；“平原”符合军事地理语境。
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: 必遍布他们的尸体
  rationale: νεκροί在这里指死者或尸体；“遍布尸体”自然呈现“被填满”的惨烈景象。
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: 他们的脚踪在我们面前必站立不住
  rationale: 译文保留“脚踪”与“站立不住”的异常而鲜明的原文意象，不把它无注释地化解为“无人能够抵抗”。
- source_word: ἀπωλείᾳ ἀπολοῦνται
  choice: 他们必彻底灭亡
  rationale: 同根名词与动词连用构成加强表达；“彻底灭亡”以自然汉语传达这种强调。
- source_word: κύριος πάσης τῆς γῆς
  choice: 全地的主宰
  rationale: κύριος在此是尼布甲尼撒的帝王自称。“主宰”保留统治权的含义，同时减少与专指上帝的“主”混淆。
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: 他所说的话绝不会落空
  rationale: 原文有同义复叠，核心意思是其话语不会成为空言或归于无效；“绝不会落空”自然传达其强烈断言，不额外限定实现方式。
theological_decisions:
- issue: 尼布甲尼撒被称为κύριος πάσης τῆς γῆς
  choice: 全地的主宰
  alternative: 全地的主
  rationale: 这是人间君王的帝国式宣称，并非叙述者确认其具有神圣身份。“主宰”准确表达统治者之意，也避免在汉语中不必要地套用神圣称号。
- issue: 末句话语归属与效力
  choice: 因为他说过：“他所说的话绝不会落空。”
  alternative: 因为他说：“他言语中的话必不归于虚空。”
  rationale: 保留第三人称“他”以及原文因果连接，不擅自判定这是神学上的应许公式还是单纯的王室夸言；“不会落空”仅表达话语不会归于无效。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。军事威吓的强烈语气予以保留；“饱饮鲜血”“脚踪站立不住”等意象不过度弱化。引号区分王所说的威吓与叙述者的引介。
