  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
translation:
  language: zh_hans
  text: 城里的男子看见他们在山顶上，就拿起武器，出城上到山顶。凡是使用投石索的男子[a]都拦住他们上山，并不断向他们投掷石块。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语σφενδονήτης直译为“投石手”。
    reason: 说明原文使用的是专指用投石索作战者的名词。
lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: 看见……就
  rationale: ὡς与不定过去时在此引出时间关系及随即发生的反应；汉语“……就……”自然地表达这一衔接。
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: 城里的男子
  rationale: 保留ἄνδρες明确的男性含义，同时采用现代汉语自然表达。
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: 在山顶上／上到山顶
  rationale: κορυφή指山的顶部；随“看见”时作处所表达，随移动动词时则表达趋向。
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: 拿起武器
  rationale: 表达为行动或交战而取用武器的意思。
- source_word: ἐπῆλθον ἔξω τῆς πόλεως
  choice: 出城上到
  rationale: 结合ἔξω τῆς πόλεως和后续山顶方位，清楚表达他们离城并向上行进。
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: 凡是使用投石索的男子
  rationale: 既保留ἀνήρ的男性指称，也将σφενδονήτης按其职业或作战功能译成普通读者易懂的说法。
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: 拦住他们上山
  rationale: διεκράτησαν含阻挡、遏止之意，ἀνάβασις在地形语境中指向上攀登。
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: 不断向他们投掷石块
  rationale: 用“不断”体现未完成过去时所表达的持续或反复动作；石块是投掷的手段。
