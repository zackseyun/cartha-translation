base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/019.yaml
  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: zh_hans
  text: 主啊，天上的上帝，求你察看他们的狂傲，怜悯我们本族所受的屈辱；也求你在今日垂顾那些已分别为圣、归你之人的面容[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉献给你的人”或“你的圣民”。希腊文直译为“那些已分别为圣、归你的人”。
    reason: 说明ἡγιασμένων σοι可突出“分别为圣”的既成状态，也可按语境译为“奉献给你的人”或以实体名词“圣民”表达；不限定其所指群体。
lexical_decisions:
- source_word: Κύριε ὁ θεὸς τοῦ οὐρανοῦ
  choice: 主，天上的上帝啊
  rationale: 保留呼格祷告语气，并以现代汉语自然表达“天上的上帝”这一称号。
- source_word: κάτιδε ἐπὶ τὰς ὑπερηφανίας αὐτῶν
  choice: 察看他们的狂傲
  rationale: “察看”体现祷告中请求上帝留意、鉴察之意；“狂傲”既表达高傲，也带出外显的傲慢行径。
- source_word: ἐλέησον τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: 怜悯我们本族所受的屈辱
  rationale: “怜悯”对应祷告用语ἐλεέω；将ταπείνωσις译为“所受的屈辱”，体现受压迫而遭贬抑的处境；“本族”表达γένος的共同族群含义，避免现代“种族”一词可能造成的误解。
- source_word: ἐπίβλεψον ἐπὶ τὸ πρόσωπον
  choice: 垂顾……的面容
  rationale: “垂顾”自然传达祈求上帝眷顾、注视的语气；保留πρόσωπον具体的“面容”意象。
- source_word: τῶν ἡγιασμένων σοι
  choice: 分别为圣归你的人
  rationale: 保留ἁγιάζω的成圣、分别出来之意，也明确σοι所表示的归属关系，不将其限缩为礼仪性奉献或某一特定群体。
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: 在今日
  rationale: 以庄重而自然的现代汉语表达时间短语；置于“垂顾”之前，符合汉语语序。
theological_decisions:
- issue: τῶν ἡγιασμένων σοι所指之人的身份与状态
  choice: 分别为圣归你的人
  alternative: 献给你的人；你的圣民
  rationale: 原文是ἁγιάζω的完成时被动分词，强调这些人已经被分别为圣，并与上帝有归属关系。“分别为圣归你”保留这种动词性及关系性，又不擅自认定其专指祭仪奉献者或某一固定称谓的“圣民”。
- issue: ἐν τῇ ἡμέρᾳ ταύτῃ的修饰关系
  choice: 理解为修饰“垂顾”，译作“在今日垂顾”
  alternative: 理解为修饰“分别为圣归你”，即“今日分别为圣归你的人”
  rationale: 希腊语末尾位置容许一定句法歧义；按祷告请求的自然推进，将其理解为请求上帝“今日”垂顾较为顺畅，但不据此增加额外神学含义。
translation_notes:
  register: 采用庄重、清晰的现代祷告语体。“察看—怜悯—垂顾”保留原文连续祈求的节奏；以分号呈现前后平行结构。
