  yaml_path: translation/deuterocanon/judith/006/009.yaml
  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: zh_hans
  text: 如果你心里真指望他们不会被擒[a]，就不要面露沮丧[b]。我已经说了；我的话一句也不会落空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不会被抓住”。原文的被动表达在这里可自然地带有军事上的“被擒获”之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“不要让你的脸垮下来”，是形容灰心、沮丧的说法。
    reason: idiom
lexical_decisions:
- source_word: εἶπερ
  choice: 如果……真
  rationale: εἶπερ引出带有强调意味的条件；“如果……真”既保留这种语气，也不将其加强为让步性的“即使”。
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: 你心里……指望
  rationale: 保留“心里”这一内在思想与盼望的表达；“指望”在此比单纯“认为”更能体现ἐλπίζεις所含的期待。
- source_word: οὐ λημφθήσονται
  choice: 他们不会被擒
  rationale: 未来被动式在当前军事语境中自然指“被擒获”；中文保留被动意义，同时用简洁、庄重的表达。
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: 不要面露沮丧
  rationale: 原文直译近于“不要让你的脸垮下来”，表示外显的灰心沮丧；“面露沮丧”保留面容意象，又避免现代汉语中可能表示恼怒的“拉下脸”。
- source_word: ἐλάλησα
  choice: 我已经说了
  rationale: 以完成性的汉语表达承接刚作出的郑重宣告，但不额外加入“说定”等原文没有的含义。
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: 我的话一句也不会落空
  rationale: διαπίπτω在此表示所说的话不会失效、不会不应验；“一句也不会落空”自然地保留全称否定和预言必然实现的语气。
theological_decisions:
- issue: 条件句的强调程度
  choice: 如果你心里真指望
  alternative: 即使你心里指望
  rationale: εἶπερ可带强调，但本身不必解释为让步条件；采用“如果……真”保留条件性及轻微强调，不替说话者断定对方确实如此。
- issue: 话语不会落空的含义
  choice: 我的话一句也不会落空
  alternative: 我的话一句也不会消逝
  rationale: 上下文强调宣告必将兑现，而不主要讨论话语永久存在；“落空”准确表达不会失败或不应验，同时不额外引入特定教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“面露沮丧”保留原文以面容表现情绪的具体意象；分号呈现宣告与保证之间紧密而郑重的关系。
