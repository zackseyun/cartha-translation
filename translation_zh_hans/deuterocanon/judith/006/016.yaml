- from: 他召集了城里所有的长老；他们所有的青年和妇女都急忙聚到会众中来。他们让亚希约站在全体民众中间，乌齐雅便问他发生了什么事。
  to: 他召集城里所有的长老；城中所有的青年男子和妇女都急忙奔到集会中。众人让亚希约站在全体民众中间，乌齐雅问他发生了什么事。
