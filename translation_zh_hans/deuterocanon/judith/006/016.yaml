  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: zh_hans
  text: 他召集城里所有的长老；城中所有的青年男子和妇女都急忙奔到集会中。众人让亚希约站在全体民众中间，乌齐雅问他发生了什么事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: 召集了
  rationale: 保留使众人聚集起来的使动含义，符合现代汉语叙事表达。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 此处指城中公认的群体领袖，不只是年长男子。
- source_word: συνέδραμον
  choice: 急忙聚到
  rationale: 兼顾“共同聚集”与动词所带的奔赴、急切色彩；避免生硬直译为“跑到一起”。
- source_word: πᾶς νεανίσκος αὐτῶν καὶ αἱ γυναῖκες
  choice: 他们所有的青年和妇女
  rationale: 将单数形式但具集合意义的 νεανίσκος 译为群体性的“青年”；αἱ γυναῖκες 保持为“妇女”。
- source_word: ἐκκλησίαν
  choice: 会众
  rationale: 在本处指聚集起来的共同体，而非后世制度意义上的“教会”；“会众”也能自然承接“聚到……中来”。
- source_word: ἔστησαν
  choice: 让……站
  rationale: 该及物结构表示使亚希约站立于指定位置，比单纯“安置”更贴近动作画面。
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: 在全体民众中间
  rationale: 保留“在……中间”的空间表达及 παντός 的全体含义。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 符合直接、自然的叙事语体。
- source_word: τὸ συμβεβηκός
  choice: 发生了什么事
  rationale: 自然表达完成时分词实体化所指的已经发生之事。
