base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/003.yaml
  text: But we[a], his servants, will strike them down as one man, and they will not withstand the might of our horses.
translation:
  language: zh_hans
  text: 但我们这些作他奴仆的，必把他们当作一个人击倒[a]；他们必抵挡不住我们战马的威力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像击倒一个人那样”。这个希腊语说法可能强调他们会一致行动，也可能强调敌人仿佛只有一人，很容易被击败。
    reason: 保留ὡς ἄνθρωπον ἕνα这一习语的词义与句法歧义。
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 该词表示完全隶属于主人。在这段军事夸口中，“奴仆”既保留从属和效忠的分量，也比现代汉语“奴隶”更自然地表达说话者以此身份自称。
- source_word: πατάξομεν
  choice: 必……击倒
  rationale: 动词表示以暴力击打，在军事语境中可指击溃或杀伤；“击倒”保留动作意象和强烈语气，又避免古旧表达。
- source_word: ὡς ἄνθρωπον ἕνα
  choice: 当作一个人
  rationale: 按字面保留希腊语的比较结构，不把它单一定解为同心行动或轻易取胜；其习语含义另以脚注说明。
- source_word: ὑποστήσονται
  choice: 必抵挡不住
  rationale: 此处表示面对敌对力量而站立、抗拒；否定式译为“抵挡不住”，符合现代汉语军事语境。
- source_word: κράτος
  choice: 威力
  rationale: 所指是战斗中展现出来的强大力量；“威力”与战马搭配自然，并传达压倒性的军力。
- source_word: ἵππων
  choice: 战马
  rationale: 希腊文明确说“马”，而非骑兵或骑手；结合军事语境译作“战马”，既保留词义对象，也使中文清楚自然。
theological_decisions:
- issue: δοῦλοι所表达的身份
  choice: 奴仆
  alternative: 奴隶
  rationale: 原词强调对主人的隶属和效忠；中文“奴仆”在此自称语境中自然且庄重，仍保留强烈从属关系，不另行引入特定神学身份含义。
- issue: ὡς ἄνθρωπον ἕνα的解释
  choice: 在正文中保留“当作一个人”的歧义
  alternative: 明确译成“像击倒一个人那样”或“我们同心合意地”
  rationale: 希腊语习语可能突出把众敌视为一人、敌人不堪一击，也有人理解为统一行动；正文不替读者消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“必”体现两个将来时所带的断言和夸口语气；分号保留原句两个并列结果之间的紧密关系。
