  text: 'who were in those days: Uzziah son of Micah[a], from the tribe of Simeon, and Chabris son of Gothoniel, and Charmis son of Melchiel.'
translation:
  language: zh_hans
  text: 当时有这些人[a]：出自西缅支派的米迦之子乌西雅、哥托尼耶勒之子哈布里斯，以及默基耶勒之子哈尔米斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在那些日子的人”；这可能指当时任职的人，或当时在场的人。
    reason: 原文的表达较为宽泛；脚注保留其可能的上下文含义，而不在正文中限定为“在任”。
lexical_decisions:
- source_word: οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις
  choice: 当时在任的有
  rationale: 希腊文直译近于“当时存在的有”，结合上下文是在列举当时担任职务的人。“在任”使现代汉语自然，但以脚注保留原文较为宽泛的表达。
- source_word: Ὀζείας
  choice: 乌西雅
  rationale: 采用现代中文圣经中较熟悉的人名形式，所对应的是希腊文 Ὀζείας。
- source_word: ὁ τοῦ Μειχὰ
  choice: 米迦的儿子
  rationale: 冠词加属格在这里表示父子关系，译明为“……的儿子”符合汉语表达。
- source_word: ἐκ τῆς φυλῆς Συμεὼν
  choice: 西缅支派
  rationale: ἐκ 表示出身或归属；中文用“西缅支派”简洁自然，并将这一成分置于乌西雅姓名之前，清楚限定其支派归属。
- source_word: Χαβρεὶς
  choice: 哈布里斯
  rationale: 按希腊文专名音译；词首 Χ 在此采用“哈”以近似其希腊语擦音，避免把它读成现代英语的 ch 音。
- source_word: ὁ τοῦ Γοθονιὴλ
  choice: 哥托尼耶勒的儿子
  rationale: 将希腊文父名按音译处理，并把亲子关系明确译出。
- source_word: Χαρμεὶς
  choice: 哈尔米斯
  rationale: 依希腊文 Χαρμεὶς 音译，保留其中的 r 音节痕迹。
- source_word: ὁ τοῦ Μελχειήλ
  choice: 默基耶勒的儿子
  rationale: 将父名按希腊文形式音译，并将属格亲子结构自然地译为“……的儿子”。
