  text: and my servants will bring you back to the hill country and place you in one of the cities of the mountain passes,[a]
translation:
  language: zh_hans
  text: 我的仆从会把你送回山区，将你安置在上山通道一带的城中一座[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸上行之处相关的城邑之一。”希腊文此处直译为“诸上行之处”或“诸上坡通道”；在地形语境中，可能指进入山区的上坡道路、通道或山口。
    reason: 保留τῶν ἀναβάσεων的字面意义及其所指地形特征的不确定性。
lexical_decisions:
- source_word: ἀνταποστήσουσίν σε
  choice: 把你送回
  rationale: 该动词在这里表示把亚基奥尔送往他原先所属的山区；“送回”既保留返回的方向，也符合由属下押送的具体语境。
- source_word: οἱ δοῦλοί μου
  choice: 我的仆从
  rationale: 这里指听命于军事统帅的属下。“仆从”体现从属身份和差遣关系，又比现代汉语的“奴隶”更适合此处军事随员的语境。
- source_word: εἰς τὴν ὀρεινήν
  choice: 回山区
  rationale: ὀρεινή指山地或高地地区；“山区”是现代汉语中自然、明确的地理表达。
- source_word: θήσουσίν σε
  choice: 将你安置
  rationale: τίθημι在此意为把某人置于某地；“安置”保持具体处置含义，也符合庄重叙事语体。
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: 在……的一座城里
  rationale: 忠实保留“诸城之一”的结构；πόλις按通常义译为“城”。
- source_word: τῶν ἀναβάσεων
  choice: 上山通道
  rationale: ἀνάβασις字面指“上行、上坡”，在此地形语境中很可能指进入山区的上坡道路、通道或山口。“上山通道”既清楚传达地理功能，也不过度限定为特定类型的山口。
