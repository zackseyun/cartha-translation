  yaml_path: translation/deuterocanon/judith/006/014.yaml
  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
translation:
  language: zh_hans
  text: 以色列人[a]从他们的城里下来，来到他跟前[b]；他们给他松了绑，把他带到伯突利亚，又带到他们城的首领面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“以色列的儿子们”，是《圣经》中对以色列人的传统称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“走近他”或“站到他身旁”。希腊语动词可按语境表达来到、走近或站在某人旁边。
    reason: lexical_alternative
  - marker: c
    text: 意思是把他带到城中掌权者面前；这里的动词不是说任命他管理这些首领。
    reason: lexical_clarification
lexical_decisions:
- source_word: καταβάντες
  choice: 下来
  rationale: 保留从城中往低处移动的方向含义，并以连动结构自然表达希腊语不定过去时分词。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 这是现代汉语中自然、清楚的传统民族称谓；脚注保留希腊语字面的家族性表达。
- source_word: ἐπέστησαν αὐτῷ
  choice: 来到他跟前
  rationale: 该动词在此可指走近、来到或站到某人身边；正文采用不预设敌意的自然表达，并用脚注保留语义幅度。
- source_word: λύσαντες αὐτόν
  choice: 给他松了绑
  rationale: 上下文表明λύω指解开亚基阿所受的捆绑；此译法具体而符合现代汉语。
- source_word: ἀπήγαγον
  choice: 把他带到
  rationale: 结合紧随其后的目的地，译为“带到”准确而流畅，也保留由一处领往另一处的动作。
- source_word: εἰς τὴν Βετυλουά
  choice: 到伯突利亚
  rationale: 按希腊语地名Βετυλουά音译，并清楚表达εἰς所示的移动目的地。
- source_word: κατέστησαν αὐτὸν ἐπὶ τοὺς ἄρχοντας
  choice: 带到本城的首领面前
  rationale: 在此语境中表示把他置于城中掌权者面前，而非任命他管理这些人；译文自然呈现其会见或受审的场景。
- source_word: οἱ ἄρχοντες
  choice: 首领
  rationale: 泛指城中掌权的人，不擅自限定为某种特定官职或政制。
