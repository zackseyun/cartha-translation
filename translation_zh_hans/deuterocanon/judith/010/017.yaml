  text: And they selected one hundred men from among them, and they escorted her and her maid, and brought them to the tent of Holofernes.
translation:
  language: zh_hans
  text: 他们从他们中间挑选了一百名男子，护送友弟德和她的婢女，把她们带到何罗斐尼的帐篷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν
  choice: 挑选了
  rationale: 表示从较大群体中有意选出，现代汉语自然且保留选择的意味。
- source_word: ἐξ αὐτῶν
  choice: 从自己人中
  rationale: 明确表达从该群体当中选人的部分关系；结合上文，用“自己人”比单说“他们中”更顺畅。
- source_word: ἄνδρας ἑκατόν
  choice: 一百名男子
  rationale: 准确传达人数；“名”适合正式叙事，“男子”保留原文的性别指称。
- source_word: παρέζευξαν
  choice: 护送
  rationale: 此处指所选之人随行，将两名女子正式带往统帅帐篷；“护送”自然地表达这种随行职责。
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: 她的婢女
  rationale: ἄβρα指随侍友弟德的女性仆役；“婢女”简洁、庄重，并保留其从属身份。
- source_word: ἤγαγον
  choice: 带到
  rationale: 动词表示领往或带往，且原文明确给出目的地；“带到”符合现代汉语叙事习惯。
- source_word: σκηνήν
  choice: 帐篷
  rationale: 采用该词普通而直接的含义，也符合军营语境，不额外提升为“营帐”或“华帐”。
- source_word: Ὀλοφέρνου
  choice: 何罗斐尼
  rationale: 按本项目中文专名形式音译该人名。
