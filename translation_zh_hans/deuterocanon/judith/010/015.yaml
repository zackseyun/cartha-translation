base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: zh_hans
  text: 他们对她说：“你赶紧下来，来到我们主人面前，保全了自己的性命。[a]现在请到他的帐篷那里去吧。我们当中会有人护送你，直到把你交在他手中。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“你救了你的生命”；其中“生命”一词也可指“魂”，但这里是指性命。
    reason: 说明ψυχή的词义范围及其在本节语境中的含义。
  - marker: b
    text: “交在他手中”是惯用说法，意思是交由他掌管或看管。
    reason: 解释“进入他的手中”这一希腊文具象惯用表达。
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: 保全了自己的性命
  rationale: σῴζω与ψυχή连用，在这里指救下或保全性命；“保全了自己的性命”既保留原文含义，也符合现代汉语表达。
- source_word: σπεύσασα καταβῆναι
  choice: 赶紧下来
  rationale: 分词σπεύσασα说明她保全性命的方式或相关情形；“赶紧下来”保留了急迫感和向下的方向。
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: 来到我们主帅面前
  rationale: εἰς πρόσωπον是“到……面前”的惯用表达；κύριος在此指军中的人类上级。结合军事语境译为“主帅”，可避免误解为对上帝的称呼。
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: 到他的帐篷去吧
  rationale: σκηνή在军营语境中明确指帐篷；祈使语气以“去吧”自然表达。
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: 我们中会有人护送你
  rationale: προπέμπω可指送行或护送；ἀφʼ ἡμῶν配合复数动词，表示他们当中会有人负责护送。
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: 直到把你交到他手中
  rationale: 保留“交到手中”的具体意象，同时汉语也能自然表达转交给某人掌管或看管的意思。
theological_decisions:
- issue: κύριος指人类统帅时的译法
  choice: 我们主帅
  alternative: 我们的主；我们的主人
  rationale: 上下文所指是军中的人类上级，而非上帝。“主帅”符合军事场景，也避免引入神圣称号的歧义。
- issue: ψυχή在此处的含义
  choice: 性命
  alternative: 灵魂；生命
  rationale: 此处谈的是友军认为友弟德因及时前来而免于死亡，故ψυχή指人的性命；译作“灵魂”会在此语境中造成不当的神学化理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主帅”体现军营背景和上下级关系；保留“交到他手中”的原文意象，并以脚注说明其惯用含义。
