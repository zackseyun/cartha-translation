  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: zh_hans
  text: 他们对她说：“愿我们祖先的上帝使你蒙恩[a]，使你所筹划的事[b]圆满成就，好让以色列子民引以为荣，也使耶路撒冷得到尊崇[c]。”她便俯伏敬拜上帝[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你得蒙眷顾”或“使你得到接纳”。希腊文直译近似“使你进入恩惠之中”，是指获得有利的接纳或成功。
    reason: lexical_alternative
  - marker: b
    text: 或译“你的计划”“你所要做的事”。希腊词可泛指一个人所筹划、从事或追求的事。
    reason: lexical_alternative
  - marker: c
    text: 或译“成为以色列子民的荣耀和耶路撒冷的尊荣”。原文分别含“可引以夸耀”和“被高举”的意思。
    reason: alternative_reading
  - marker: d
    text: 或译“她便向上帝俯身”或“她便俯伏在上帝面前”。希腊词既可着重俯伏的动作，也可表达敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη ... εἰς χάριν
  choice: 使你蒙恩
  rationale: 这里是祝愿语气；希腊文直译近似“使你进入恩 favor 中”，在此指使友第德获得有利的接纳与助力。“使你蒙恩”自然、庄重，也保留“恩”的词义范围。
- source_word: τελειῶσαι
  choice: 使……圆满成就
  rationale: 表达使其行动达到目标并成功完成；“圆满成就”保留完成、达成的终向意义。
- source_word: τὰ ἐπιτηδεύματά σου
  choice: 你所筹划的事
  rationale: 该词可指所从事、谋划或着手进行的事；上下文指友第德即将实行的计划，译法兼顾计划与行动。
- source_word: εἰς καύχημα υἱῶν Ἰσραήλ
  choice: 好让以色列子民引以为荣
  rationale: καύχημα 指可夸耀、引以为荣的根据。中文若直译为“以色列众子的夸耀”生硬，故以自然表达保留公共荣耀和欢庆之意；υἱῶν Ἰσραήλ 在群体称谓中译为“以色列子民”。
- source_word: εἰς ... ὕψωμα Ἰερουσαλήμ
  choice: 也使耶路撒冷得到尊崇
  rationale: ὕψωμα 含被高举、升高之意；“得到尊崇”在现代中文中自然地表达耶路撒冷被高举而获尊荣。
- source_word: προσεκύνησεν τῷ θεῷ
  choice: 俯伏敬拜上帝
  rationale: προσκυνέω 可表示俯身、俯伏并敬拜。此处对象是上帝；译文同时呈现身体动作和敬拜含义，而脚注保留较窄的可能译法。
theological_decisions:
- issue: 祝福语中两个 εἰς 短语的目的或结果关系
  choice: 好让以色列子民引以为荣，也使耶路撒冷得到尊崇
  alternative: 成为以色列子民的夸耀和耶路撒冷的高举
  rationale: εἰς 可表达所指向的结果或目的。采用“好让……也使……”使中文关系清楚，却不把这份公共荣耀改写为抽象的神学术语。
- issue: προσκυνέω 是身体姿态还是敬拜行为
  choice: 俯伏敬拜上帝
  alternative: 向上帝俯身／俯伏在上帝面前
  rationale: 希腊词兼具俯伏动作与尊崇、敬拜语义；对象明确为上帝，因此合并表达较符合语境，同时以脚注保存动作层面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先的上帝”比传统的“列祖的神”更直接易懂；“上帝”与本项目现代标准普通话风格一致。祝愿句保留希腊文的平行结构，并避免把 καύχημα 简化为泛泛的“荣耀”。
