  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: zh_hans
  text: 他们就照办了。友弟德便出去，她的婢女与她同行。城里的男人一直望着她，直到她下了山，穿过谷地[a]，再也看不见她了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷地”或译“沟谷”或“山口”；希腊语αὐλών可指这些地形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: 他们就照办了
  rationale: 自然表达“他们如此做了”的叙事确认；“照办”承接上文的吩咐或安排，简洁而明确。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 保留普通的叙事移动含义，不额外引入“逃离”或“启程”等解释。
- source_word: παιδίσκη
  choice: 婢女
  rationale: 指友弟德身边具有从属身份的女性侍从；“婢女”简洁地保留其性别和社会身份。
- source_word: ἀπεσκόπευον
  choice: 一直望着
  rationale: 用“一直”体现未完成时所表示的持续动作，“望着”也符合人物渐行渐远的场景。
- source_word: ἄνδρες τῆς πόλεως
  choice: 城里的男人
  rationale: 直接保留ἄνδρες的男性所指，同时用现代汉语自然表达其所属地点。
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: 直到她下了山
  rationale: 准确呈现下山的空间移动及观看持续到该阶段的时间界限。
- source_word: αὐλών
  choice: 谷地
  rationale: 该词可指山谷、沟谷或山间通道；正文采用涵盖面较广且符合地形语境的“谷地”，并以脚注保存其他可能。
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: 再也看不见她了
  rationale: 自然表达视觉观察的终止；语境表明她已离开视野，汉语用可能补语最为顺畅。
