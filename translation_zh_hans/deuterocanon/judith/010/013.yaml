base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: zh_hans
  text: 我正前往你们军队的总司令何罗斐尼面前，向他宣告真实的话；我还要在他面前给他指出一条路，他将沿着这条路进军，征服整个山区。在他的部下中，一个血肉之躯也不会少，也不会少一口生命之气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他的部下中，一个身体也不会少，也不会少一口生命之气。”原文采用鲜明的身体性说法。
    reason: 说明σὰρξ μία与πνεῦμα ζωῆς的直译选择及较自然的替代译法。
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι
  choice: 我正要到
  rationale: 以“正要”表达现在时在眼前情境中的迫近意味，同时避免把方向过度解释为单纯的“来”或“去”。
- source_word: εἰς τὸ πρόσωπον
  choice: 到……面前
  rationale: 这是进入某人面前、亲自晋见的惯用表达；中文“到……面前”既保留具体意象，也自然清楚。
- source_word: Ὀλοφέρνου
  choice: 何罗斐尼
  rationale: 按希腊文人名音译，并采用便于现代普通话读者辨读的汉字。
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: 你们军队的总司令
  rationale: ἀρχιστράτηγος 指最高军事统帅，δύναμις 在此指军队；“总司令”简洁传达其最高军职。
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: 向他宣告真实的话
  rationale: 保留目的关系及“真实的话”这一庄重的属格结构，不把它弱化为一般性的“消息”。
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: 我还会当面给他指出一条路
  rationale: “指出一条路”保留道路意象，“当面”对应 πρὸ προσώπου αὐτοῦ，并符合自然汉语。
- source_word: καθʼ ἣν πορεύσεται
  choice: 他将沿着这条路进军
  rationale: πορεύομαι 基本义为行进；军事语境下译作“进军”自然，但仍以“沿着这条路”保留路线关系。
- source_word: κυριεύσει πάσης τῆς ὀρινῆς
  choice: 征服整个山区
  rationale: κυριεύω 在战事语境中表示取得支配权，“征服”清楚传达军事控制；ὀρινή 指山地或山区。
- source_word: οὐ διαφωνήσει
  choice: 不会少
  rationale: 该动词通常可指不一致，但在此与“一个血肉之躯”和“生命之气”搭配，语境义是“缺少、失去”；“不会少”简洁而贴近原文。
- source_word: σὰρξ μία οὐδὲ πνεῦμα ζωῆς
  choice: 一个血肉之躯，也不会少一口生命之气
  rationale: 保留原文以“血肉”和“生命之气”描述人员毫发无损的鲜明身体性表达，而不直接改写成“一个人也不会死”。
theological_decisions:
- issue: 非保罗语境中 σάρξ 的译法
  choice: 血肉之躯
  alternative: 人；身体
  rationale: 这里是军事情境中的具体身体用语，不涉及“罪性”等神学化含义；“血肉之躯”既保留 σάρξ 的字面色彩，又比单独的“肉”更符合现代汉语。
- issue: πνεῦμα ζωῆς 的具体意象
  choice: 一口生命之气
  alternative: 生命；活着的人
  rationale: 原文将生命描写为气息，译文保留这一意象，不把它平化为抽象的“生命”，也不预先判定其更广泛的人论含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“总司令”“进军”“征服”符合军事语境；末句刻意保留希腊文“血肉之躯／生命之气”的并列张力，脚注提供稍平顺的替代译法。
