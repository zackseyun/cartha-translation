  yaml_path: translation/deuterocanon/judith/010/018.yaml
  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: zh_hans
  text: 营中顿时有众人奔集而来[a]，因为她来到的消息已经传遍各帐篷。众人前来，围拢在她身边；她正站在敖罗斐乃的帐篷外，直到他们向他禀报有关她的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“营中顿时聚起一群人，因为她的出现被人在各帐篷间喊着传开了。”希腊文可指众人奔集；“她来到”也可作“她出现”或“她在场”。
    reason: 保留συνδρομή所含的聚集／奔集幅度、διεβοήθη所含的呼喊传播意象，以及παρουσία在“来到”与“出现、在场”之间的词义空间。
lexical_decisions:
- source_word: ἐγένετο συνδρομή
  choice: 顿时众人奔集
  rationale: συνδρομή指众人迅速跑到一起；译文保留实际奔集的动态，又不擅自解释为恐慌或骚乱。
- source_word: παρεμβολή
  choice: 营中
  rationale: 在军事叙事中指军营；“营中”自然简洁。
- source_word: διεβοήθη
  choice: 消息已经……传开了
  rationale: 该被动动词含呼喊传播之意；正文以现代汉语表达消息传遍各处，并在脚注保留其可能更直译的声音意象。
- source_word: τὰ σκηνώματα
  choice: 各帐篷间
  rationale: 指军营里的帐篷住处；“各帐篷间”也传达消息遍及营帐的范围。
- source_word: ἡ παρουσία αὐτῆς
  choice: 她来到的消息
  rationale: παρουσία本义可为“临在、出现”，语境中主要指她来到军营这一事实；脚注保留“她出现/在场”的词义张力。
- source_word: ἐκύκλουν αὐτήν
  choice: 围在她身边
  rationale: 保留环绕她的空间图景，但不暗示敌意或拘捕。
- source_word: ὡς ἱστήκει
  choice: 她站在
  rationale: 按其状态性用法直译，交代众人围拢时她所处的位置。
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: 敖罗斐乃的帐篷外
  rationale: 直接、清楚地呈现地点；人名采用现代中文圣经传统中常见的音译形式。
- source_word: ἕως προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: 直到有人进去向他通报她的事
  rationale: 表达把关于她的消息呈报给敖罗斐乃；汉语补出不定主语“有人”和语境自然蕴含的“进去”，不限定具体人员身份。
