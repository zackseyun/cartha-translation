  terminology: “伯突利亚”“乌西雅”“哈布里斯”“哈尔米斯”均可作为按希腊文形式处理的人名、地名；“城里的长老”准确且自然。脚注宜将ἐπʼ αὐτῇ的可能方位明确为“在城门上／在城门处”，不以“旁边”作为直译可能性。
