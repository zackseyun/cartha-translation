  yaml_path: translation/deuterocanon/judith/010/006.yaml
  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: zh_hans
  text: 她们出来，走到伯突利亚城门口，发现乌西雅站在那里[a]，又发现城里的长老哈布里斯和哈尔米斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“站在它上面／在它那里”；“它”指城门。这里按汉语习惯译作“站在那里”。
    reason: 说明代词所指，并保留原文方位短语的字面表达与汉语化译法之间的差别。
lexical_decisions:
- source_word: ἐξῆλθον ἐπὶ τὴν πύλην
  choice: 她们出来，走到……城门口
  rationale: ἐξέρχομαι表示向外移动，ἐπί加宾格在此表示朝向城门；译为“出来，走到……城门口”既交代向外的动作，也符合现代汉语表达。
- source_word: τῆς πόλεως Βαιτυλουά
  choice: 伯突利亚城
  rationale: πόλις意为“城”；Βαιτυλουά按希腊文音译为“伯突利亚”，合并表达为自然的中文地名结构。
- source_word: εὗρον
  choice: 发现／见到了
  rationale: εὗρον统摄后续人物，基本义为“找到、发现”。对站在那里的乌西雅译作“发现”，对其余长老顺应汉语句法译作“也见到了”，不改变他们同为该动词宾语的关系。
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: 站在那里
  rationale: 完成时主动分词ἐφεστῶτα在此描写乌西雅已站在城门处；ἐπʼ αὐτῇ回指阴性名词“城门”。“站在那里”自然传达位置关系，不强加“驻守”或“管理”的含义。
- source_word: Ὀζίαν
  choice: 乌西雅
  rationale: 采用现代中文圣经语境中易辨认的闪族人名形式；希腊文形式亦可较直接音译为“奥齐亚”。
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: 城里的长老
  rationale: πρεσβύτεροι在此指城邑中的长老或领袖；“城里的长老”清楚保留其社会身份。
- source_word: Χάβρειν καὶ Χάρμειν
  choice: 哈布里斯和哈尔米斯
  rationale: 两词为宾格人名形式，按其希腊文主格形式Χάβρις、Χάρμις音译，保留人名而不赋予额外含义。
