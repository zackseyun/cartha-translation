base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: zh_hans
  text: 他们抓住她，盘问她说：“你是哪一方的人[a]？从哪里来？要往哪里去？”她说：“我是希伯来人的女儿[b]，正从他们面前逃走，因为他们快要被交给你们吞吃了[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“你是谁的？”可能是在问她属于哪个民族或哪一方。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我是希伯来妇人”。希腊文直译为“我是希伯来人的女儿”。
    reason: lexical_alternative
  - marker: c
    text: 或译“给你们吃掉”或“成为你们的食物”。原文用的是鲜明的“供吞吃”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: 抓住
  rationale: 在军事场景中表示实际将友弟德控制住；“抓住”自然、直接，也保留动作的突然性。
- source_word: Τίνων εἶ
  choice: 你是哪一方的人
  rationale: 希腊文直译为“你是谁的”，这里很可能询问族属或政治归属。“哪一方的人”在现代汉语中自然，并保留归属层面的含义。
- source_word: πόθεν ἔρχῃ
  choice: 从哪里来
  rationale: 简洁自然地表达来源方向。
- source_word: ποῦ πορεύῃ
  choice: 要往哪里去
  rationale: 自然表达行进目的地，并体现当下正在赶路的语境。
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: 我是希伯来人的女儿
  rationale: 保留原文“女儿”的亲属—族群表达，不将其直接抹平为“希伯来妇人”。
- source_word: ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν
  choice: 正从他们面前逃走
  rationale: “逃走”体现脱离、逃亡之意；“从他们面前”保留原文带闪语色彩的 παρουσία/面前表达。
- source_word: μέλλουσιν δόσθαι
  choice: 快要被交给
  rationale: 同时保留临近发生的语气和被动结构。
- source_word: εἰς κατάβρωμα
  choice: 吞吃
  rationale: 原词意为供吃掉、吞噬之物；“吞吃”保留其鲜明、凶险的意象，且比抽象的“消灭”更贴近原文。
theological_decisions:
- issue: 友弟德对自身族群身份的表述
  choice: 我是希伯来人的女儿
  alternative: 我是希伯来妇人
  rationale: 原文明确使用“女儿”并以“希伯来人”为所属群体；保留这一表达，既准确呈现女性身份，也保存其亲属化的族群认同意象。
- issue: 希伯来人将被交付的形象
  choice: 被交给你们吞吃
  alternative: 被交给你们消灭
  rationale: 原文采用“供吞吃”的具体意象。译作“消灭”会解释性地削弱这一比喻，因此保留其张力和生动性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“盘问”符合武装哨兵连续查问身份、来处和去向的场景；引语保持简洁。“希伯来人的女儿”和“从他们面前逃走”有意保留原文异于日常汉语的族群及闪语式表达，并借脚注说明。
