  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
translation:
  language: zh_hans
  text: 她从俯伏中起来，叫了她的侍女阿布拉[a]，便下到那所她在安息日和她的节期居住的房子里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“叫了她的阿布拉”；“侍女”是根据上下文补出的。
    reason: translation_clarity
  - marker: b
    text: 希腊文直译为“在安息日的日子里，以及在她的节期里”。“安息日”在原文中为复数，可能表示一次次安息日的惯例；“她的”在语法上修饰“节期”，不修饰“安息日”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη ἀπὸ τῆς πτώσεως
  choice: 从俯伏中起来
  rationale: πτῶσις本可指“跌倒”，但上文是祷告、哀恸的场景，此处更可能指伏地的姿势；“从俯伏中起来”既自然，也保留身体动作。
- source_word: ἐκάλεσεν τὴν Ἄβραν αὐτῆς
  choice: 叫了她的侍女阿布拉
  rationale: 希腊文本身只说“叫了她的阿布拉”；结合上下文，阿布拉是她的女侍。“叫了”不比原文更加强调命令意味，脚注则说明角色词属于语境补足。
- source_word: κατέβη εἰς τὸν οἶκον
  choice: 下到那所房子里
  rationale: 保留κατέβη的向下移动和εἰς所表达的进入方向。
- source_word: ἐν ᾧ διέτριβεν
  choice: 她都住在那里
  rationale: διατρίβω可指逗留、居住或度过一段时间；此处描述她在特定日子使用该处，“住在那里”在现代汉语中简明自然，又不必暗示永久住所。
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: 每逢她守安息日的时候
  rationale: 原文使用复数形式，可能指多次安息日的惯常遵守；“每逢她守安息日”以自然汉语表达这种反复性。
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: 过节期的时候
  rationale: ἑορταί指宗教历法中的节庆；“节期”保留宗教语境，“过节期”则符合现代汉语表达。
theological_decisions:
- issue: ἀπὸ τῆς πτώσεως所指的身体与敬虔姿势
  choice: 从俯伏中起来
  alternative: 从跌倒之处起来
  rationale: 祷告和哀恸的近接语境支持“俯伏”，但πτῶσις自身仍可表示“跌倒”，故以脚注保留词义上的另一可能。
- issue: 安息日复数形式的表达
  choice: 每逢她守安息日
  alternative: 在她的安息日的日子里
  rationale: 直译在中文中生硬；采用“每逢”表达复数可能包含的反复遵守，同时用脚注说明原文形式，不把它压平为某一个安息日。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“俯伏”适合祷告语境；“侍女”清楚说明阿布拉的身份，同时以脚注交代这是上下文补足。分号用于理清进入房屋与惯常居住时间之间的关系。
