base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: zh_hans
  text: 他们惊叹她的美貌，也因她而对以色列人惊叹不已[a]。人人都对身边的人说：“谁会轻看这个拥有如此女子的民族呢？他们中间连一个男人也不该留下[b]；因为留下来的人足以凭智谋胜过全地[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”，希腊文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “留下”在这里也可理解为“留下活口”。
    reason: implicit_context
  - marker: c
    text: “全地”也可译作“全世界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: 惊叹
  rationale: 未完成时动词连续出现两次，既表达持续的惊异，也含赞叹之意；中文重复“惊叹”保留了原文的修辞呼应。
- source_word: κάλλει
  choice: 美貌
  rationale: 在此明确指友弟德外在的美丽；“美貌”自然、准确，也符合庄重叙事语体。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，是指以色列民族的传统集体称谓；正文采用现代中文自然说法，并以脚注保留字面形式。
- source_word: ἀπʼ αὐτῆς
  choice: 因她而
  rationale: 介词短语表示她是他们转而惊叹以色列人的缘由，而非来源或空间关系。
- source_word: καταφρονήσει
  choice: 会轻看
  rationale: 将来时用于反问；“轻看”表达蔑视、低估之意，并贴合下文对以色列人智谋的忌惮。
- source_word: λαοῦ
  choice: 民族
  rationale: 此处指以色列这一族群共同体；“民族”比泛指的“人民”更符合上下文。
- source_word: γυναῖκας τοιαύτας
  choice: 如此女子
  rationale: 保留复数和评价意味，且在这段带古代色彩的直接引语中自然庄重。
- source_word: οὐ καλόν ἐστιν
  choice: 不该
  rationale: 上下文是敌军从战略角度作出的判断；“不该”中文顺畅，同时不把原文宽泛的评价明确限定为道德或功利判断。
- source_word: ὑπολειπέσθαι
  choice: 留下
  rationale: 本义为使其余留；军事语境暗示“留下活口”，但正文不把该含义明说，以免过度阐释，并在脚注注明。
- source_word: ἄνδρα ἕνα
  choice: 连一个男人
  rationale: ἄνδρα明确为男性，ἕνα在否定结构中带强调意味，故译作“连一个男人”。
- source_word: οἱ ἀφεθέντες
  choice: 留下来的人
  rationale: 较为贴近分词的字面表达；语境可指被留下或存活下来的人，不强行判定他们是被饶恕还是偶然幸存。
- source_word: δυνήσονται κατασοφίσασθαι
  choice: 足以凭智谋胜过
  rationale: 兼顾“有能力”与以机智、谋略占上风的含义；避免将其窄化为单纯欺骗。
- source_word: πᾶσαν τὴν γῆν
  choice: 全地
  rationale: 保留 γῆ 可指土地、大地或世界的语义宽度；脚注提示现代中文更惯用的另一译法。
theological_decisions:
- issue: 称呼以色列的阳性集体用语
  choice: 正文译“以色列人”，脚注注明原文直译“以色列的众子”
  alternative: 正文直译“以色列的众子”
  rationale: 该希腊惯用语在这里指整个以色列民族，而现代中文“以色列人”准确且自然；脚注保留其阳性字面形式，不掩盖原文措辞。
- issue: 战争语境中的男性单数
  choice: 连一个男人
  alternative: 连一个人
  rationale: 原文明确使用 ἄνδρα，指战争中的男性余民，故不将其泛化为无性别的“人”。
- issue: 敌军关于不留活口的判断
  choice: 按直接引语如实保留，不增添道德评断
  alternative: 将“不好”解释为“不明智”或“不道德”
  rationale: οὐ καλόν ἐστιν 本身可表达宽泛评价，而语境偏向战略判断；译文不替叙述者或读者化解其中的伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。两次保留“惊叹”以重现原文重复；直接引语略带郑重色彩，但避免生硬古语。正文保持原文对敌军惊艳、忌惮以及灭绝性言论之间的张力，不加解释性缓和。
