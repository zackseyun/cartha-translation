  terminology: 将人名统一作“何罗弗尼”。κωνώπιον正文译为“床帐”，既自然又不预断其究竟是蚊帐、帷幕还是华盖；脚注保留词义范围。“紫色布料、黄金、绿宝石和贵重宝石”可保留，且“织成”传达καθυφασμένων的织入/交织含义。
