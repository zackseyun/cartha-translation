  yaml_path: translation/deuterocanon/judith/010/021.yaml
  text: And Holofernes was reclining on his bed under the canopy[a], which was woven with purple, gold, emeralds, and costly stones.
translation:
  language: zh_hans
  text: 何罗弗尼正在床帐内自己的床上歇息；这床帐是用紫色布料、黄金、绿宝石和贵重宝石织成的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蚊帐”或“床帷”；希腊语这个词可指罩在床上的网帐或帷幔。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: 正躺着
  rationale: 表示在床上歇息的状态；“正躺着”自然清楚，也不额外暗示宴席姿势。
- source_word: κλίνης
  choice: 床
  rationale: κλίνη可指床或卧榻；本处有床罩，并处于私人寝居场景，译作“床”最直接。
- source_word: κωνωπίῳ
  choice: 床罩
  rationale: 该词可指床上的防蚊网、帷帐或覆盖物；正文用较宽泛而自然的“床罩”，具体词义范围在脚注保留。
- source_word: πορφύρας
  choice: 紫色织物
  rationale: πορφύρα可指紫色染料或紫色布料；在交织材料的语境中，译作“紫色织物”比单说“紫色”更符合汉语表达。
- source_word: χρυσίου
  choice: 黄金
  rationale: 直接保留材料名称，不擅自具体化为原文未明说的“金线”。
- source_word: σμαράγδου
  choice: 绿宝石
  rationale: 这是该希腊词的常见对应词；集合性的材料清单在汉语中可使用单数形式。
- source_word: λίθων πολυτελῶν
  choice: 贵重宝石
  rationale: πολυτελής强调昂贵、奢华；“贵重宝石”自然且贴近语义，不必限定具体宝石种类。
- source_word: καθυφασμένων
  choice: 交织而成
  rationale: 该分词表示这些华贵材料被织入织物；“交织而成”保留织造含义，避免较不确定的“刺绣”。
