  source_fidelity: 译文基本呈现了何乐弗尼在自己的床上歇息，以及床上覆盖物由紫色材料、黄金、绿宝石和贵重宝石织成的内容。但“何乐弗乃”不是较通行且与Ὀλοφέρνης更相符的中文音译；并且ἐν τῷ κωνωπίῳ宜译出“在床帐内”，不宜固定为“床罩之下”，因为该词可指网帐或帷幕，空间关系未必是单纯的“下方”。
