revisions:
- from: 何乐弗乃正躺在自己的床上，床罩之下[a]；床罩由紫色织物、黄金、绿宝石和贵重宝石交织而成。
  to: 何罗弗尼正在床帐内自己的床上歇息；这床帐是用紫色布料、黄金、绿宝石和贵重宝石织成的。[a]
  rationale: 修正人名音译，并将κωνώπιον译作含义较宽、自然的“床帐”，以保留原文对床上覆盖物的词义弹性及“在其内”的空间关系。其余材料清单和织造含义均保持贴近希腊文本。
