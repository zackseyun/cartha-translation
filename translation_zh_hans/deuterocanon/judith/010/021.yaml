  register: 采用现代、庄重且易懂的叙事语言。“何乐弗乃”沿用《友弟德传》中常见的现代中文音译；“床罩”避免把 κωνώπιον 过度限定为纯粹防蚊用品，同时用脚注保留其词义歧义。
