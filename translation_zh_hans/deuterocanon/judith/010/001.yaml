  text: And it happened, when she stopped crying out to the God of Israel and finished all these words,
translation:
  language: zh_hans
  text: 她停止向以色列的上帝呼求，并说完这一切话以后，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: 不单独译出
  rationale: 这是七十士译本常见的叙事衔接语；本句在希腊文中尚未完结，现代汉语若硬译为“事情发生了”会显得突兀，因此用整体时间从句自然承接后文。
- source_word: ὡς
  choice: ……以后
  rationale: 在此引出时间背景；“以后”清楚表达前述动作完成后主句事件才发生。
- source_word: ἐπαύσατο βοῶσα
  choice: 呼求完毕
  rationale: 既保留停止、结束的语义，也以“呼求”传达祷告中迫切出声恳求的意味，避免“喊叫”可能带来的不敬或单指音量的感觉。
- source_word: πρὸς τὸν θεὸν Ἰσραήλ
  choice: 向以色列的上帝
  rationale: 保留原文的完整称号和圣经语体；“向”准确标明呼求的对象。
- source_word: συνετέλεσεν
  choice: 说完
  rationale: 该动词表示使话语达到终点；“说完”是自然、准确的现代汉语。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: 这一切话
  rationale: 贴近原文，同时自然指回前面的整段祷告。
theological_decisions:
- issue: θεὸν Ἰσραήλ的译法
  choice: 以色列的上帝
  alternative: 以色列的神
  rationale: 完整保留原文的关系性称号及其经文共鸣；依本项目现代普通话语体采用“上帝”，不增加原文没有的宗派含义。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。本节原文以逗号结束，句法承接下一节，因此中文也保留未完句式，以逗号收尾。
