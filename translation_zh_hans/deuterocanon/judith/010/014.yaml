  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
translation:
  language: zh_hans
  text: 那些人听见她的话，又仔细端详她的面容，就觉得她美得惊人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“她在他们面前，在美貌方面极其令人惊叹。”
    reason: 保留原文较为特殊的表达方式，并说明这是那些人眼中所见的非凡美貌。
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: 听见……后／听见……又
  rationale: ὡς与不定过去时在此引出时间关系；汉语用顺承结构自然表达，不额外强调“立刻”。
- source_word: οἱ ἄνδρες
  choice: 那些人
  rationale: ἄνδρες本义为“男人／人”；上下文虽可能指守卫，但本节没有明确使用“士兵”，故不作具体化。
- source_word: τὰ ῥήματα αὐτῆς
  choice: 她的话
  rationale: ῥήματα指说出的话语；“她的话”贴近原文且符合现代汉语。
- source_word: κατενόησαν
  choice: 仔细端详
  rationale: κατανοέω含专注观察、留意之意；以面容为宾语时，“仔细端详”比一般的“看见”更能体现有意观察。
- source_word: τὸ πρόσωπον αὐτῆς
  choice: 她的面容
  rationale: πρόσωπον直接指脸或面容；“面容”既具体又具有合宜的叙事语体。
- source_word: ἦν ἐναντίον αὐτῶν
  choice: 他们就觉得她
  rationale: 字面为“她在他们面前／在他们眼中”；结合后面的审美判断，译为“他们就觉得她”自然传达其在他们眼中所呈现的印象。
- source_word: θαυμάσιον τῷ κάλλει σφόδρα
  choice: 美得惊人
  rationale: θαυμάσιον表示令人惊叹，τῷ κάλλει限定在美貌方面，σφόδρα强烈加强程度；“美得惊人”凝练地保留三者合力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“仔细端详”保留观察动作的专注意味；“美得惊人”避免生硬直译，同时传达原文强烈的赞叹语气。脚注标记置于整句判断之后。
