  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: zh_hans
  text: 她给脚穿上凉鞋，又戴上脚镯、手镯、戒指、耳环，以及她所有的饰物[a]；她把自己装扮得极其美丽，好欺骗任何可能看见她的男人的眼睛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饰物”或译“妆饰”或“华美装饰”。这里的希腊词 κόσμος 指装饰、妆饰，而不是“世界”。
    reason: lexical_alternative
  - marker: b
    text: “任何可能看见她的男人”也可译作“凡可能看见她的男人”。原文的表达是不定而概括的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: 她脚上穿了凉鞋
  rationale: ἔλαβεν字面可指“拿”，但与凉鞋和双脚连用时，语境表达的是穿戴动作；译成“脚上穿了凉鞋”自然且忠实。
- source_word: περιέθετο
  choice: 戴上
  rationale: 该中间态动词在饰物清单中表示她给自己佩戴这些物件；现代汉语用“戴上”最为自然。
- source_word: χλιδῶνας
  choice: 脚镯
  rationale: 在一连串具体饰物中，此词较可能指脚部饰物；“脚镯”既保持具体性，也比抽象的“华饰”更符合上下文。
- source_word: ψέλια
  choice: 手镯
  rationale: ψέλια通常指腕镯或臂镯；“手镯”是普通现代读者最易理解的对应词。
- source_word: δακτυλίους
  choice: 戒指
  rationale: 此词通常指指环，译作“戒指”简明准确。
- source_word: ἐνώτια
  choice: 耳环
  rationale: 该词指耳部饰物，“耳环”是自然、通行的现代汉语表达。
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: 她所有的饰物
  rationale: κόσμος在这里不是“世界”，而是装饰、妆饰之物。“饰物”既承接前面的首饰清单，也不把范围不必要地限定为珠宝。
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: 她把自己装扮得极其美丽
  rationale: 中间态表示她装扮自己，σφόδρα强化程度；此译兼顾动作、结果及强烈程度。
- source_word: εἰς ἀπάτησιν
  choice: 为要迷惑
  rationale: 介词短语表达目的，ἀπάτησις具有欺骗、诱骗之意。“迷惑”保留策略性的欺骗意味，又契合“眼睛”的视觉语境。
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: 男人的眼睛
  rationale: 原文明确保留“眼睛”的意象，因此不简化为“吸引男人”或“让男人动心”。
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: 所有看见她的男人
  rationale: ὅσοι ἄν加虚拟式具有开放、概括的意味；此译自然表达凡是可能见到她的人，并不限定具体群体。
theological_decisions:
- issue: 犹滴装扮自己的道德目的
  choice: 明确译出她装扮自己是“为要迷惑”看见她的男人
  alternative: 弱化为“吸引”或“抓住”他们的目光
  rationale: ἀπάτησις明确含有欺骗、诱骗的意义。译文不替叙事消解这一具有道德张力的策略，也不额外对她作道德评判。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。首饰名称保持具体，句法依照汉语习惯调整；保留“迷惑……眼睛”的原文意象和叙事中的道德张力。
