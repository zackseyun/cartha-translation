  text: And they were going straight through the courtyard[a], and an Assyrian advance guard met her.
translation:
  language: zh_hans
  text: 她们正径直穿过院子，一队亚述前哨兵迎面遇见了她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处是单数“她”，而前一句“她们正……穿过”是复数；叙事焦点在这里特别转向友弟德。
    reason: 保留原文由复数主语转为单数受事者的语法变化与叙事焦点。
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 她们正……穿过
  rationale: 未完成时表示当时正在进行的行动；结合叙事中的女性同行者，以“她们正”自然地保留复数和持续意味。
- source_word: ἐν τῷ αὐλῶνι
  choice: 穿过院子
  rationale: αὐλών指院子或有围界的院落；与行进动词连用时，“穿过院子”比静态的“在院子里”更符合现代汉语。
- source_word: εἰς εὐθεῖαν
  choice: 径直
  rationale: 该短语作状语，表示沿直线直接前行；“径直”简洁保留了不偏离方向的意味。
- source_word: συνήντησεν
  choice: 迎面遇见了
  rationale: συναντάω表示相遇、遇见；“迎面遇见”在行进场景中自然，也不额外断定卫队是否特意前来拦截。
- source_word: αὐτῇ
  choice: 她
  rationale: 原文为阴性单数与格。尽管前句主语为复数，此处明确转为单数，叙事焦点落在友弟德身上。
- source_word: προφυλακὴ
  choice: 前哨卫队
  rationale: προφυλακή可指部署在前方的警戒部队或前哨；“前哨卫队”既体现其前置警戒作用，也表明这里所指的是人员而非建筑。
- source_word: τῶν Ἀσσυρίων
  choice: 亚述人的
  rationale: 属格表示这支前哨卫队隶属于亚述人；采用所有格结构，准确且符合现代汉语习惯。
