  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: zh_hans
  text: 友弟德来到他和他的侍从面前时，众人都惊叹她面容的美丽。她俯伏在地，向他下拜[a]；他们把她扶了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他致敬”。这里的希腊语动词也可表示“敬拜”，但在本处是对人间统帅所行的礼敬。
    reason: 说明προσκυνέω的词义范围及其在当前语境中的用法，避免将对人的礼敬误解为宗教敬拜。
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ καὶ τῶν θεραπόντων αὐτοῦ
  choice: 来到他和他的侍从面前
  rationale: κατὰ πρόσωπον在这里表示进入某人面前或来到其面前；与后面的属格并列结构合看，指友弟德来到荷罗孚尼及其侍从面前。译文采用自然的宫廷场景表达，不拘泥于字面的“面对面”.
- source_word: θεραπόντων
  choice: 侍从
  rationale: θεράπων可指在权贵或统帅身边服侍的人。“侍从”符合军事首领身边的场景，也避免“奴仆”所带来的更强身份含义。
- source_word: ἐθαύμασαν
  choice: 惊叹
  rationale: 该动词兼有惊讶和赞叹之意；“惊叹”简洁地传达众人因她美貌而产生的反应。
- source_word: κάλλει τοῦ προσώπου
  choice: 她容貌美丽
  rationale: κάλλος指美丽，πρόσωπον直指脸或面容。“容貌美丽”在现代汉语中自然，并保留原文对她面容之美的强调。
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: 俯身，面伏于地
  rationale: 原文具体描写她俯伏、脸朝向地面的动作。此译法保留身体姿态与“面”的意象，同时符合庄重的现代汉语。
- source_word: προσεκύνησεν αὐτῷ
  choice: 向他下拜
  rationale: προσκυνέω语义范围包括敬拜、俯伏致敬和向权势者行礼。因对象是人间军事统帅，这里用“下拜”表达臣服式礼敬，而不直接判定为宗教敬拜。
- source_word: ἤγειραν αὐτήν
  choice: 他们就把她扶了起来
  rationale: 原文复数主语指在场众人，动词表示使她起来。“扶了起来”在该动作场景中自然地表达他们将俯伏的她带起。
theological_decisions:
- issue: 对人使用προσκυνέω时如何翻译
  choice: 向他下拜
  alternative: 向他敬拜；向他致敬
  rationale: 该词本身具有从礼敬到敬拜的宽广语义，但上下文对象是人间统帅。“下拜”既保留俯伏礼敬的强度，也不无根据地将此举定性为对人的宗教崇拜；脚注说明其语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“友弟德”为书名和人物名的通行天主教汉译；句式保留原文动作推进：来到面前、众人惊叹、俯伏下拜、被扶起。脚注标记紧随其实际所注释的“下拜”，而非置于“侍从”之后。
