  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
translation:
  language: zh_hans
  text: 他们把她的事禀报给他；他便出来，到帐幕前的庭院[a]去，银灯[b]在他前面行进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕前的庭院”指主帐或接见处前面的区域；也可译作“帐前”或“前厅”。
    reason: lexical_alternative
  - marker: b
    text: “灯”也可译作“火把”；希腊词可指二者，不过这里提到银制，更像礼仪用的灯具。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήγγειλαν
  choice: 禀报
  rationale: 此动词表示向人报告或通报；在军营中向统帅报告的叙事语境里，“禀报”自然地传达了上下级关系，又不过分古雅。
- source_word: ἐξῆλθεν
  choice: 走到
  rationale: 原词表示从里面出来。结合目的地“帐幕前庭”，“走到”在现代汉语中较自然，也保留了他由帐内来到外部空间的动作。
- source_word: προσκήνιον
  choice: 帐幕前庭
  rationale: 此处不是戏剧意义上的“舞台”，而是主帐或接见处前面的区域。“帐幕前庭”既交代军营帐幕背景，也表达其位于帐前的正式空间。
- source_word: λαμπάδες
  choice: 灯
  rationale: 该词可指灯，也可指火把；因其被形容为银制，礼仪用的银灯较为可能，但正文不增加原文未明说的持灯者。
- source_word: ἀργυραῖ
  choice: 银
  rationale: 形容词可表示银制或银质；“银灯”简洁自然，保留材质含义。
- source_word: προάγον
  choice: 在他前面开道
  rationale: 该分词描写银灯在他前面行进。“开道”自然呈现仪仗队列的场景，同时没有明添原文未提到的持灯人。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“禀报”契合军营统帅的场景；“帐幕前庭”避免把 προσκήνιον 误解为舞台。保留“银灯”自行在前开道的原文表达，不擅自补入持灯者。
