  yaml_path: translation/deuterocanon/judith/010/009.yaml
  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: zh_hans
  text: 她对他们说：“你们下令叫人为我打开城门吧；我要出去，完成你们同我谈过的事。”于是，他们吩咐那些年轻人为她开门，正如他们所说的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“正如他们所说的”。这句话的所指并不完全明确，可能指他们先前所说的话，也可能泛指他们与友弟德交谈后所商定的事。
    reason: 保留καθὼς ἐλάλησαν中复数主语及其指代上的真实含混，避免像部分意译那样直接改为“正如她所说的”。
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: 你们下令
  rationale: 保留不定过去时命令式的权威语气；“下令”在现代汉语中简洁自然，也符合她对城中领袖说话的情境。
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: 叫人为我打开城门
  rationale: 以“下令叫人……”自然表达命令动词后的不定式结构；“城门”准确而简洁地传达“城的门”。
- source_word: ἐξελεύσομαι
  choice: 我要出去
  rationale: 直接表达将来时所指的出城行动，语气自然明确。
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: 完成……的事
  rationale: τελείωσις表示完成、成就；λόγοι在本语境中指交谈所涉及的事情，而不只是说出的字句。此译法保留目的含义，同时符合现代汉语习惯。
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: 你们同我谈过的
  rationale: μετʼ ἐμοῦ带有彼此交谈的意味；“同我谈过”比“对我说过”更能保留这种互动性。
- source_word: συνέταξαν
  choice: 他们吩咐
  rationale: 表达向属下作出指示；与前面的“下令”有所区分，避免中文重复过重。
- source_word: τοῖς νεανίσκοις
  choice: 那些年轻人
  rationale: 按νεανίσκοι的通常词义翻译，不擅自把他们具体认定为守卫或侍从。
- source_word: ἀνοῖξαι αὐτῇ
  choice: 为她开门
  rationale: 承接前文已提到的城门，中文无需重复全称；“为她”保留与格所表达的受益关系。
- source_word: καθὼς ἐλάλησαν
  choice: 正如他们所说的
  rationale: 按希腊文复数动词直译为“他们所说的”，不在正文中擅自改成“她所说的”；其具体所指仍有语境上的含混，故加注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“你们下令叫人……吧”既保留命令语气，也避免生硬的欧化结构；“年轻人”保持原文称谓的开放性。
