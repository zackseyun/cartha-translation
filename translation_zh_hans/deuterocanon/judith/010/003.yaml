base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: zh_hans
  text: 她脱下身上所穿的麻衣，也脱去寡居时所穿的衣服。她用水洗了身体，给自己涂上浓郁的香膏[a]，梳理头发，戴上头饰[b]，又穿上喜庆的衣裳；在她丈夫玛拿西在世的日子里，她常穿这些衣裳装扮自己[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给自己涂上浓厚的香膏。”原文可指芳香的膏油，其中的形容词有“浓厚、丰厚”的意味。
    reason: 保留 μύρῳ παχεῖ 在质地、浓度或丰厚程度上的词义幅度。
  - marker: b
    text: 或译：“戴上束发带”或“戴上头巾”。原词指一种头部覆盖物或装饰带，具体样式不能确定。
    reason: μίτρα 的具体形制有歧义，正文不作过度限定。
  - marker: c
    text: 直译：“在她丈夫玛拿西生命的日子里。”
    reason: 说明正文“在世的日子里”所对应的原文表达。
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: 脱下身上所穿的麻衣
  rationale: 中间语态表明她从自己身上除去麻衣；“麻衣”保留其哀悼和克己的文化含义，关系从句则体现此前一直穿着的状态。
- source_word: ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: 脱去守寡的衣服
  rationale: 保留“守寡”这一明确的身份和处境，不笼统改作“丧服”；“脱去”自然表达脱衣动作。
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: 用水洗净身体
  rationale: 忠实表达以水洗身，不额外断定具体采用沐浴、浸洗或其他方式。
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: 给自己涂上浓郁的香膏
  rationale: “香膏”体现 μύρον 所指的芳香膏油，“涂上”传达中间语态；παχύς 可表示浓厚、丰厚，译作“浓郁”兼顾自然中文与原文意象，并以脚注保留其他可能。
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: 梳理头发
  rationale: 动词表示整理、安排；“梳理”符合现代汉语，但不具体描述发式。
- source_word: μίτραν
  choice: 头饰
  rationale: 该词可指束发带、头巾或其他头部覆盖物；正文采用较宽泛的“头饰”，避免武断限定其具体样式。
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: 喜庆的衣裳
  rationale: εὐφροσύνη 表示喜乐、欢庆；此处与守寡服形成鲜明对照，“喜庆的衣裳”自然且保留叙事作用。
- source_word: ἐστολίζετο
  choice: 常用来装扮自己
  rationale: “装扮”保留穿戴以修饰自己的含义，“常”体现未完成过去时所表达的惯常动作。
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσῆ
  choice: 她丈夫玛拿西在世的日子里
  rationale: 既准确表达丈夫尚在世的时期，也较为贴近原文“在……生命的日子里”的措辞。
theological_decisions:
- issue: 守寡与哀悼的意象
  choice: 分别保留“麻衣”和“守寡的衣服”
  alternative: 合并译为“丧服”或“哀悼的衣服”
  rationale: 原文用两个衣着表述强调友弟德从哀悼、守寡状态转向刻意装扮；分别保留可呈现这一叙事张力，而不加入对其行为动机或道德性质的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。连续动作以简洁动词推进，并保留“麻衣—守寡的衣服—喜庆的衣裳”的对照。人名按常见次经译名写作“玛拿西”；不添加原文未明说的礼仪、诱惑或道德判断。
