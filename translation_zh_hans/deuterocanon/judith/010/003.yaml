  to: 她脱下身上所穿的麻衣，也脱去寡居时所穿的衣服。她用水洗了身体，给自己涂上浓郁的香膏[a]，梳理头发，戴上头饰[b]，又穿上喜庆的衣裳；在她丈夫玛拿西在世的日子里，她常穿这些衣裳装扮自己[c]。
