  text: But when they saw her[a], and her face had been changed and her clothing altered, they marveled very greatly at her beauty,
translation:
  language: zh_hans
  text: 可是，他们看见她时，发现她的面容已经改变，衣着也换了，便因她的美貌而大为惊叹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文可直译为“他们对她的美貌非常强烈地惊叹”；原文以两个程度加强成分（ἐπὶ πολὺ σφόδρα）加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: 可是，他们看见她时
  rationale: ὡς加不定过去时在此引出时间从句；δέ作轻微转折或承接。译为“可是……时”既保留叙事转折，也不过度强化。
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: 见她的面容已经改变
  rationale: ἠλλοιωμένον表示已经发生的改变；τὸ πρόσωπον具体指面容。加入“见”使汉语句法自然，并与前面的视觉感知相衔接。
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: 衣着也换了
  rationale: στολή在此泛指衣服或装束；μεταβεβληκυῖαν表示已更换。结合上下文，现代汉语“衣着也换了”比“衣着被改变”自然，同时保留实际换装之意。
- source_word: ἐθαύμασαν
  choice: 惊叹不已
  rationale: 该词表示惊奇、赞叹；“惊叹不已”兼顾震惊与赞美，也能自然承载后面的强烈程度表达。
- source_word: ἐπὶ τῷ κάλλει αὐτῆς
  choice: 因她的美貌
  rationale: κάλλος意为美貌；ἐπί加与格在此说明引发惊叹的缘由，译作“因……而”符合现代汉语。
- source_word: ἐπὶ πολὺ σφόδρα
  choice: 不已
  rationale: 原文用叠加强调表达极高程度。正文以“惊叹不已”自然传达强烈语气，脚注说明希腊文的重复加强形式。
