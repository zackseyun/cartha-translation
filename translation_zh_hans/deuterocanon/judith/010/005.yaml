  yaml_path: translation/deuterocanon/judith/010/005.yaml
  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: zh_hans
  text: 她把一皮袋酒和一小瓶油交给自己的侍女，又把一个行囊装满大麦粉、无花果饼和洁净的饼[a]；随后，她把自己所有的容器都包好，放在侍女身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼仪上洁净的饼”或“纯净的饼”。希腊文可能暗示这些食物是遵照洁净规条预备的。
    reason: 说明καθαρῶν可能具有一般洁净或礼仪洁净的含义，避免正文过度解释。
lexical_decisions:
- source_word: ἅβρᾳ
  choice: 侍女
  rationale: 指友弟德的女性随从；“侍女”符合叙事语境，又不刻意强化其受奴役的身份。
- source_word: ἀσκοπυτίνην οἶνον
  choice: 一皮袋酒
  rationale: 该复合词所指为皮制容器；“一皮袋酒”自然地同时表达容器及其中的酒。
- source_word: καψάκην ἐλαίου
  choice: 一小瓶油
  rationale: καψάκη指便于携带的小容器；“小瓶”在现代汉语中清楚自然，且不武断限定材质。
- source_word: πῆραν
  choice: 行囊
  rationale: 指旅行者携带食物或用品的袋子；“行囊”既体现旅途语境，也保持庄重易懂。
- source_word: ἀλφίτων
  choice: 大麦粉
  rationale: ἀλφίτων通常指大麦制成的粗粉或粉食；本处采用具体而易懂的“大麦粉”，与旅途食物清单相符。
- source_word: παλάθης
  choice: 无花果饼
  rationale: 指压制成块或饼状的无花果；“无花果饼”简洁自然。
- source_word: ἄρτων καθαρῶν
  choice: 洁净的饼
  rationale: καθαρός可表示洁净、纯净，也可能在饮食语境中带有礼仪洁净含义；正文保留较宽泛的“洁净”，不将含义限定为技术性的礼仪术语。
- source_word: περιεδίπλωσε
  choice: 包好
  rationale: 该动词表示折叠包裹；结合整理旅途用品的语境，“包好”自然准确。
- source_word: τὰ ἄγγη αὐτῆς
  choice: 自己所有的容器
  rationale: ἄγγη泛指器皿或容器；此处上下文集中于盛装食物和油酒的器具，“容器”最清楚。
- source_word: ἐπέθηκε αὐτῇ
  choice: 放在侍女身上
  rationale: 阴性代词最自然地回指侍女，表示把包好的物品交由她负载；不添加原文未说明的“肩上”或“背上”。
theological_decisions:
- issue: ἄρτων καθαρῶν中的洁净含义
  choice: 洁净的饼
  alternative: 礼仪上洁净的饼；纯净的饼
  rationale: 本节的饮食预备可能涉及友弟德对洁净饮食的遵守，但形容词本身并未明确限定为技术性的礼仪用语，因此正文保留语义张力，并以脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“一皮袋酒”“行囊”“无花果饼”保持古代旅途物资的语境，同时避免生僻或过度古雅的词语。脚注标记[a]紧接其所说明的“洁净的饼”。
