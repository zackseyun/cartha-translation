  yaml_path: translation/deuterocanon/judith/010/016.yaml
  text: But if you stand before him, do not be afraid in your heart; instead, report according to your words, and he will treat you well.
translation:
  language: zh_hans
  text: 但你若站在他面前，心里不要害怕；只要照你所说的向他禀报，他就会善待你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στῇς ἐναντίον αὐτοῦ
  choice: 站在他面前
  rationale: 直译其空间与觐见语境，现代中文自然清楚，不额外解释为“被带到”或“晋见”。
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: 心里不要害怕
  rationale: 保留“心”的表达，同时按现代汉语语序自然呈现。
- source_word: ἀνάγγειλον
  choice: 向他禀报
  rationale: 该动词意为报告、宣告；此处是向统帅陈说，采用带有下对上语感的“禀报”，而非泛化为“说”。
- source_word: κατὰ τὰ ῥήματά σου
  choice: 照你所说的
  rationale: 保留原文较不寻常的措辞及其可能指向先前拟定说辞的含义，不擅自补成“照我们商定的话”。
- source_word: εὖ σε ποιήσει
  choice: 他就会善待你
  rationale: 自然表达“对你行得好、优待你”的含义，并保留结果陈述。
