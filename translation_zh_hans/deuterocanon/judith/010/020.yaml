  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
translation:
  language: zh_hans
  text: 那些在荷罗孚尼身边侍候的人[a]和他所有的侍从都出来，把她带进帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些睡在荷罗孚尼身旁的人”或“那些躺卧在荷罗孚尼近旁的人”。希腊文分词按字面可指睡卧在他近旁的人；在这里很可能指在他身边侍候的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 直接表达从里面向外移动的叙事动作；汉语中“出来”自然保留了原文的方向感。
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: 那些在荷罗孚尼身边值宿的人
  rationale: παρακαθεύδω字面指在旁边睡卧；“身边值宿”既保留夜间睡卧和近身位置的含义，也符合军营中近身侍候、守候的语境，避免让现代读者误解为亲密关系。
- source_word: θεράποντες
  choice: 侍从
  rationale: θεράπων可指服侍者、随从；“侍从”在此军政首领的帐幕语境中自然清楚，也与前面的近身值宿者有所区分。
- source_word: εἰσήγαγον
  choice: 带进
  rationale: εἰσάγω表示带领或带入；“带进”简洁保留了进入帐篷的动作。
- source_word: σκηνήν
  choice: 帐篷
  rationale: σκηνή在军营语境中直接指帐篷；此译法现代、明确，不采用较古雅且解释性更强的“帐幕”或“行营”。
theological_decisions: []
