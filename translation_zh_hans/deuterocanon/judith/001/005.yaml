  text: And in those days King Nebuchadnezzar made war against King Arphaxad in the great plain[a], that is, in the territory of Ragae.
translation:
  language: zh_hans
  text: 那些日子，尼布甲尼撒王在大平原上，就是在拉盖境内，与亚法撒王交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些日子
  rationale: 以简洁自然的现代汉语保留希腊文的时间表达。
- source_word: ἐποίησεν πόλεμον
  choice: 交战
  rationale: 该短语直译为“发动战争”，此处“与……交战”既准确表达敌对军事行动，也符合现代汉语习惯。
- source_word: βασιλεὺς Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒王
  rationale: 保留“王”的称号，并采用中文圣经传统中通行的人名音译。
- source_word: πρὸς βασιλέα Ἀρφαξὰδ
  choice: 与亚法撒王
  rationale: 在战争语境中，πρός标明敌对对象；汉语“与……交战”已经清楚表达“对抗”之意。
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  choice: 在大平原上
  rationale: πεδίον指平坦开阔之地；“平原”比“田野”更符合军事地理语境，“在……上”则是自然汉语搭配。
- source_word: τοῦτʼ ἔστιν
  choice: 就是
  rationale: 自然地引出对前述地点的进一步说明。
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  choice: 在拉盖境内
  rationale: ὅρια可指边界或由边界界定的领土；“境内”简洁表达此处的地域意义，同时不将其误解为只在边界线上。
