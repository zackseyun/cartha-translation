  text: its width was fifty cubits; and he set up its towers at its gates[a], one hundred cubits high, and he founded its breadth at sixty cubits.
translation:
  language: zh_hans
  text: 它的宽度为五十肘；他又在它的城门处建起塔楼，高一百肘；又将它的宽度立基至六十肘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“又将它的宽度立基至六十肘”。这里重复“宽度”，而“立基”与“宽度”的搭配在原文中较为压缩；代词具体所指也未明说。
    reason: 说明原文末句压缩的句法，同时避免把“宽度”改释为“根基的宽度”。
lexical_decisions:
- source_word: πλάτος αὐτοῦ πηχῶν πεντήκοντα
  choice: 它宽五十肘
  rationale: πλάτος表示横向宽度；保留古代长度单位“肘”，并以简洁的现代汉语表达无系词的度量短语。代词所指承接上文，不在本节擅自补明。
- source_word: τοὺς πύργους αὐτοῦ
  choice: 城楼
  rationale: πύργοι在城门防御建筑语境中指塔楼；“城楼”比泛称“塔”更贴合城门建筑，同时自然易懂。
- source_word: ἔστησεν
  choice: 建起
  rationale: 该动词本义为使站立、设立，在建筑语境中译作“建起”，兼顾动作感与现代汉语自然度。
- source_word: ἐπὶ ταῖς πύλαις αὐτῆς
  choice: 在城门上
  rationale: ἐπί加与格可表示位于其上或其处；建筑语境倾向“城门上”，但不进一步规定具体结构。
- source_word: πηχῶν ἑκατόν
  choice: 高一百肘
  rationale: 原文仅列数值，依其紧随城楼而来的位置，补出自然隐含的高度维度，使汉语清楚而不改变信息。
- source_word: τὸ πλάτος αὐτῆς ἐθεμελίωσεν εἰς πήχεις ἑξήκοντα
  choice: 并将其根基的宽度定为六十肘
  rationale: ἐθεμελίωσεν表示奠基、立基；原句把“其宽度”作为宾语，结构压缩。译文将这一尺寸与根基相联，使汉语通顺，并以“其”保留所指上的含混。
