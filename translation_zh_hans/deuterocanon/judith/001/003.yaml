  naturalness: “塔楼”“在城门处”在现代标准汉语中自然且庄重。“将其宽度立基至六十肘”略带书面和建筑语体，恰能保留原文的压缩与生硬感；脚注予以说明。
  terminology: πύργους译为“塔楼”较“城楼”更中性、贴近防御塔的通常含义。ἐθεμελίωσεν以“立基”体现奠基／建立基础的动作；不将“宽度”直接重释为“根基的宽度”。
