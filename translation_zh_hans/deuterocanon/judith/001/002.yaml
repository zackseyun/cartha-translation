lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: 修筑
  rationale: 这里指城防工程；“修筑”比泛称“建造”更自然地搭配“城墙”，也保留了动词的建造含义。
- source_word: ἐπʼ Ἐκβατάνων καὶ κύκλῳ τείχη
  choice: 在埃克巴坦周围……修筑城墙
  rationale: κύκλῳ明确表达环绕之意；将ἐπί按地点关系译作“在”，并与“周围”合译，符合上下文所述的环城防御工事，同时不把介词本身过度具体化。
- source_word: λίθων λελαξευμένων
  choice: 凿好的石头
  rationale: λελαξευμένων表示石料经过凿削加工；“凿好的石头”现代、清楚，也不带“雕刻”可能暗示的装饰意义。
- source_word: εἰς πλάτος πηχῶν τριῶν καὶ εἰς μῆκος πηχῶν ἕξ
  choice: 石头宽三肘、长六肘
  rationale: 从语法和建筑语境看，尺寸最自然地修饰前述石料；正文明确补出“石头”，并以脚注保留也可能指砌体尺寸的歧义。
- source_word: ἐποίησεν τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα
  choice: 他把城墙筑到七十肘高
  rationale: 以现代汉语自然表达“使城墙的高度达到七十肘”，保留工程建造的动作感。
- source_word: καὶ τὸ
  choice: 并把它的……
  rationale: 所给希腊文本在冠词后中断；用省略号显明句子残缺，不从其他版本擅自补足宾语。
