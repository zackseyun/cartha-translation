  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: zh_hans
  text: 亚述王尼布甲尼撒差遣到所有住在波斯的人那里，也到所有住在西方的人那里，就是住在基利家和大马士革、黎巴嫩山地和外黎巴嫩山地的人，以及沿海一带的所有人那里——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派人
  rationale: 原文动词意为“派出、差遣”，没有明说所派的对象；按这里向各地传达召令的语境译作“派人”，既自然，也不具体限定信息内容。
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: 到所有住在……的人那里
  rationale: ἐπί在ἀποστέλλω之后表示差遣所朝向的对象，而非敌对性的“攻击”；此译保留收信者兼居民的表达。
- source_word: τὴν Περσίδα
  choice: 波斯
  rationale: 指波斯地区，采用现代中文通行地名。
- source_word: πρὸς δυσμαῖς
  choice: 住在西方
  rationale: 字面为“朝西方／在西方一带”；在 κατοικοῦντας 的限定下，“住在西方”自然表达其地理方位，同时不把它强行处理为正式行政区名。
- source_word: κατοικοῦντας τὴν Κιλικίαν
  choice: 住在基利家的人
  rationale: 以现代汉语自然表达居住于该地区之意，并采用通行的圣经地名译法。
- source_word: Δαμασκόν
  choice: 大马士革
  rationale: 采用现代中文通行地名。
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: 黎巴嫩和外黎巴嫩
  rationale: 这里指相对的两处山地；“外黎巴嫩”是 Anti-Lebanon 的中文通行名称，可保留两者的区别。
- source_word: κατὰ πρόσωπον παραλίας
  choice: 沿海一带
  rationale: 该短语描写面向海岸、沿海分布的地区；“沿海一带”比逐字译作“在海岸面前”更符合现代汉语。
