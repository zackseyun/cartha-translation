base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: zh_hans
  text: '全地所有的居民都藐视亚述王尼布甲尼撒的话[a]，不肯与他一同出战，因为他们不怕他，只把他看作一个与他们平等的人[b]；他们打发他的使者空手受辱地回到他那里[c]。


    [a] “话”也可译作“信息”或“命令”。希腊语 τὸ ῥῆμα 在这里指尼布甲尼撒传达的要求；“藐视”表示他们认为这话无足轻重。


    [b] 直译：“他在他们面前如同一个平等的人。”意思是，他们只把他当作与自己处于同等地位的人，并不认为他可怕。


    [c] 也可译作：“他们使他的使者空手受辱而归，回到他那里。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“命令”。希腊语 τὸ ῥῆμα 在这里指尼布甲尼撒传达的要求；“藐视”表示他们认为这话无足轻重。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他在他们面前如同一个平等的人。”意思是，他们只把他当作与自己处于同等地位的人，并不认为他可怕。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“他们使他的使者空手受辱而归，回到他那里。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: 藐视
  rationale: 该动词表示把某事看得低微、无足轻重；“藐视”简洁地保留了主动轻看王命的语气。
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: 全地所有的居民
  rationale: 保留 πάντες 与 πᾶσαν 的周遍范围；“全地”也保留 γῆ 可指土地、地域或大地的宽度。
- source_word: τὸ ῥῆμα
  choice: 话
  rationale: ῥῆμα 可指话、信息或命令；正文用较宽泛的“话”，不把上下文中的王命过度限定，并以脚注说明其他可能。
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: 不肯与他一同出战
  rationale: 表达他们拒绝集合并参与他的军事行动；“不肯”在中文中自然体现上下文所含的主动拒绝。
- source_word: οὐκ ἐφοβήθησαν αὐτόν
  choice: 他们不怕他
  rationale: 直接对应希腊语，清楚说明他们拒绝参战的原因。
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: 只把他看作一个与自己平等的普通人
  rationale: 以自然中文传达他们认为他不过与自己同等、并非不可抗拒的霸主；脚注保留较直译的句法。
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: 使他的使者空手而回
  rationale: ἀναστρέφω 在此指使其返回，κενούς 表示毫无成果、空手而归。
- source_word: ἐν ἀτιμίᾳ
  choice: 蒙受羞辱
  rationale: 表示使者遭到不光彩、羞辱性的对待；措辞自然且保留被辱的结果。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: 回到他面前
  rationale: 该表达字面涉及“在他面前／面前所在”；结合使者被遣回的语境，正文表达其空手受辱后回到王面前，并在脚注保留句法上的另一种组织方式。
