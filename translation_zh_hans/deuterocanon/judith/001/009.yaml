  text: and all those in Samaria and its cities[a], and beyond the Jordan as far as Jerusalem, and Batane and Chelous and Kadesh and the river of Egypt, and Taphnas and Rameses and all the land of Goshen[b],
translation:
  language: zh_hans
  text: 撒玛利亚及其各城中所有的人，以及约旦河对岸直到耶路撒冷、巴塔尼、赫卢斯、加低斯、埃及河[a]、塔弗纳斯[b]、拉美西和歌珊全地所有的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃及溪”。希腊文本作“埃及河”（ποταμός），但这个边界地名在圣经翻译传统中有不同译法。
    reason: lexical_alternative
  - marker: b
    text: “塔弗纳斯”是该地名的希腊文形式；它也常按希伯来文形式称为“答比匿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ καὶ ταῖς πόλεσιν αὐτῆς
  choice: 撒玛利亚及其各城里所有的人
  rationale: πάντας τοὺς 为地点短语所限定，指其中所有的人；译文补出“的人”，既呈现省略成分，也避免把名单误读为单纯的地名罗列。αὐτῆς 指回撒玛利亚。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河对岸
  rationale: πέραν 表示越过或在另一边；“对岸”是现代汉语中自然且保留相对方位感的表达。
- source_word: ἕως Ἰερουσαλήμ
  choice: 直到耶路撒冷
  rationale: ἕως 标示地域延伸的终点；“直到”直接保留其范围意义。
- source_word: Βαττανὴ
  choice: 巴塔尼
  rationale: 按希腊文地名音译，不以“巴珊”等可能对应地名取代，以免作未经文本明示的地理协调。
- source_word: Χελούς
  choice: 基路斯
  rationale: 该地名的确切对应地点不确定，因此采用保守音译，不作推测性辨认。
- source_word: Κάδης
  choice: 加低斯
  rationale: 采用现代中文圣经读者较熟悉的标准地名形式。
- source_word: τοῦ ποταμοῦ Αἰγύπτου
  choice: 埃及河
  rationale: 希腊文明确使用 ποταμός（河）；正文据此直译，同时脚注保留其他圣经传统中的替代称法。
- source_word: Τάφνας
  choice: 塔弗纳斯
  rationale: 按本节希腊文形式音译；较常见的希伯来文地名形式另收入脚注。
- source_word: Ραμεσσὴ
  choice: 兰塞
  rationale: 依希腊文 Ραμεσσὴ 音译，避免擅自扩充为其他文本传统中的较长形式。
- source_word: πᾶσαν γῆν Γέσεμ
  choice: 歌珊全地
  rationale: Γέσεμ 所指为熟知的歌珊；采用通行中文名称，并以“全地”表达 πᾶσαν γῆν。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。原文是承接上文的长串并列成分，故保留句末逗号；在各地点后补出“的人”，使希腊文中受 πάντας 支配但有所省略的句法关系在中文中清楚可读。专名以通行中文形式或保守音译处理，不对不确定地点作推测性统一。
