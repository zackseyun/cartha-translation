  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: zh_hans
  text: 第十七年，他率领军队列阵，迎战亚法撒王。他在战事中占了上风，击溃了亚法撒的全部军力、所有骑兵和一切战车。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  choice: 他率领军队列阵
  rationale: παρατάσσω 的中动态在军事语境中指列阵备战；ἐν τῇ δυνάμει αὐτοῦ 指他所统率的军队。合译既保留列阵的具体动作，也符合现代汉语表达。
- source_word: πρὸς Ἀρφαξὰδ βασιλέα
  choice: 迎战亚法撒王
  rationale: πρός 在列阵与战争语境中表示敌对方向；“迎战”自然地表达列阵对抗某王，而不额外说明谁先发动攻击。
- source_word: ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ
  choice: 他在战事中占了上风
  rationale: ἐκραταιώθη 字面可指“变得强盛”，在战报语境中表示取得军事优势。“占了上风”保留过程性的优势含义，避免直接扩张为彻底获胜。
- source_word: ἀνέστρεψεν
  choice: 击溃了
  rationale: 该动词本义涉及使之转回；用于敌军时表示将其击退、使其溃败。“击溃”准确传达这里的军事结果。
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: 亚法撒的全部军力
  rationale: δύναμις 在此指军事力量。“全部军力”既可涵盖军队整体，又与随后列举的骑兵和战车自然衔接。
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: 所有骑兵
  rationale: ἵππος 字面为“马”，但军事语境中的集合单数指骑兵部队，译作“骑兵”最为自然明确。
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: 一切战车
  rationale: ἅρματα 在此直接指用于战争的战车；“战车”清楚且符合古代军事语境。
