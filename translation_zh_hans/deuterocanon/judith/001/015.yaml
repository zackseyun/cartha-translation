    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβε
  choice: 擒获
  rationale: 在军事叙事中表示俘获敌手；“擒获”比中性的“拿住”更准确，也符合现代汉语表达。
- source_word: ἐν τοῖς ὄρεσι
  choice: 在……山区
  rationale: ὄρη为复数，指群山或山地；“山区”自然地表达战事发生的地理环境。
- source_word: Ῥαγαῦ
  choice: 拉高
  rationale: 依照希腊文本Ῥαγαῦ音译，不以其他文本传统中的地名形式替代正文读法。
- source_word: κατηνάγκισεν
  choice: 制服
  rationale: 该动词含以强力迫使、压服之意；在战斗语境中，“制服”既保留武力压倒的含义，也比“强迫”更自然。
- source_word: σιβύναις
  choice: 投枪
  rationale: σιβύνη指可用于投掷的轻型枪矛；“投枪”保留具体兵器形象，并区别于一般长矛。
- source_word: ἐξωλέθρευσεν
  choice: 灭绝
  rationale: 该词强于单纯的“杀死”，表达彻底毁灭；“灭绝”保留其力度，同时不额外添加原文没有的副词。
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: 直到那日
  rationale: 直译保留ἐκείνης的指示意义，也保留原文中这一时间短语与“灭绝”搭配所产生的张力，不擅自解释为“至今”。
