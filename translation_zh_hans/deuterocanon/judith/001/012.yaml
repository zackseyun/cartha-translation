base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: zh_hans
  text: 尼布甲尼撒对这整片土地极其愤怒。他指着自己的王位和王国起誓，必向基利家、大马士革和叙利亚的一切疆域报仇[a]，并要用刀剑除灭其中的人、所有住在摩押的人、亚扪人、整个以土买，以及所有在埃及的人，直到来到两海的边界[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“除非他报仇”；在这种希腊语誓言格式中，这句话表达的是坚定的誓愿，并非普通的否定条件。
    reason: lexical_alternative
  - marker: b
    text: “两海”很可能用作界定这里所指地域全部范围的地理界标。
    reason: cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  choice: 极其愤怒
  rationale: 合并表达动词的发怒含义与副词的强烈程度，现代汉语自然有力。
- source_word: ἐπὶ πᾶσαν τὴν γῆν ταύτην
  choice: 对这一带所有地方
  rationale: ἐπί在此表示愤怒所针对的对象；γῆ可指土地或地区。“这一带所有地方”既保留地域范围，也避免误解为全球。
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: 指着自己的王位和王国起誓
  rationale: 在起誓语境中，κατά引出凭以起誓的对象；“指着……起誓”符合现代汉语习惯。
- source_word: εἰ μὴ ἐκδικήσει
  choice: 必……报仇
  rationale: εἰ μή用于誓言公式时表达强烈而确定的决意；译作“必”传达其强调作用，脚注保留字面形式。
- source_word: πάντα τὰ ὅρια
  choice: 所有疆域
  rationale: ὅρια字面为边界，在这里借指边界以内的领土；“疆域”兼顾两层含义。
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ
  choice: 用刀剑杀死
  rationale: 直接传达军事屠杀的含义，不以较文言的固定套语弱化暴力色彩。
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: 亚扪人
  rationale: 这是闪族式族名称谓，现代汉语自然对应为“亚扪人”。
- source_word: πᾶσαν τὴν Ἰδουμαίαν
  choice: 以土买全境的人
  rationale: 保留希腊文本的地名形式“以土买”，并依“杀死”的宾语关系明示所指为全境居民。
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν
  choice: 一直到达两海的边界
  rationale: 希腊文不定式未明说主语；汉语用无显式主语的表达，既自然又保留这一不确定性。
theological_decisions:
- issue: 誓言公式 εἰ μὴ 的语力
  choice: 译作表示坚决誓愿的“必……”，并以脚注说明字面结构
  alternative: “除非他报仇”
  rationale: 若机械译为否定条件句，现代汉语容易误解其逻辑；正文表达誓言的实际语力，脚注保留原文形式与张力。
- issue: ἐλθεῖν 的隐含主语
  choice: 采用“一直到达”，不明说主语
  alternative: “直到他到达”或“直到有人到达”
  rationale: 希腊文没有显式主语；省略主语可避免把解释写入正文，同时在汉语中仍然通顺。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。地名依通行圣经译名处理；长串地域与族群保持原文的累积气势，同时适度补出“那里的人”“全境的人”，使“杀死”的宾语在汉语中明确。
