- from: 尼布甲尼撒对这一带所有地方极其愤怒。他指着自己的王位和王国起誓，必向基利家、大马士革和叙利亚的所有疆域报仇[a]，用刀剑杀死那里的人，以及住在摩押的所有人、亚扪人、以土买全境的人和埃及所有的人，一直到达两海的边界[b]。
  to: 尼布甲尼撒对这整片土地极其愤怒。他指着自己的王位和王国起誓，必向基利家、大马士革和叙利亚的一切疆域报仇[a]，并要用刀剑除灭其中的人、所有住在摩押的人、亚扪人、整个以土买，以及所有在埃及的人，直到来到两海的边界[b]。
