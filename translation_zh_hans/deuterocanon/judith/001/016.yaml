  language: zh_hans
  text: 他本人和他的军队同他们一起返回，历时一百二十天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: 返回
  rationale: 此处是不定过去时的叙事用法，表示回返，而非品行或生活方式；“返回”自然并保留方向含义。
- source_word: μετʼ αὐτῶν
  choice: 和他们一同
  rationale: μετά接属格表示伴随；“和他们一同”直接表达同行关系。
- source_word: αὐτὸς
  choice: 他本人
  rationale: 明示代词带有强调作用，突出统帅本人也在其中；“他本人”保留这一强调。
- source_word: ἡ δύναμις αὐτοῦ
  choice: 他的军队
  rationale: δύναμις在军事叙事中指武装力量；现代汉语用“军队”最为自然清楚，也不超出本处语境。
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: 历时一百二十天
  rationale: ἐπί接宾格用于时间，表达持续时段；“历时”准确而自然地传达这一百二十天的持续时间。
