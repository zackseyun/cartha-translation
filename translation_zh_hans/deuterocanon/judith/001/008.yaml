  text: and those among the nations of Carmel and Gilead[a], and Upper Galilee, and the great plain of Esdraelon,
translation:
  language: zh_hans
  text: 以及迦密和基列的各族人、上加利利，以及埃斯德赖隆[a]的大平原，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“埃斯德雷姆”（Ἐσδρήμ），可能指埃斯德赖隆平原，即耶斯列平原。
    reason: 说明希腊文本的地名形式及其可能对应的通行地名，同时保留辨识上的谨慎。
lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: 各族中的人
  rationale: 保留τοὺς所指的“人”，并将ἔθνεσι按一般意义译为“各族”，避免采用带有较强神学色彩的“外邦人”。
- source_word: Καρμήλου
  choice: 迦密
  rationale: 采用现代中文圣经传统中通行的地名形式，不增补原文未明说的“山”或“地区”。
- source_word: Γαλαὰδ
  choice: 基列
  rationale: 采用现代中文圣经传统中通行的地名形式。
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: 上加利利
  rationale: ἄνω在此表示地理上的“上部”，译作通行的地区名称“上加利利”。
- source_word: τὸ μέγα πεδίον
  choice: 大平原
  rationale: πεδίον指平坦开阔之地，μέγα直接译为“大”，简洁保留原文地理描述。
- source_word: Ἐσδρήμ
  choice: 埃斯德赖隆
  rationale: 采用该平原名称的惯用音译，指向通常称为埃斯德赖隆、亦即耶斯列的平原；脚注同时说明希腊文本的具体形式及可能所指。
