  verdict: revise
  source_fidelity: 首句将希腊文并列的居民群体准确呈现为山区及三条河流沿岸的居民；但“以吕迈人的王阿里奥克也在平原上与他会合”误将地点短语中的阿里奥克王当作新的主语。希腊文此处虽有省略和不顺畅之感，仍应理解为“阿里奥克——以吕迈人的王——的平原”上的居民。末句的“列入”不当地明确了这些民族加入赫勒乌勒众子一方；原文属格关系宜保留，不预断敌我关系。
  naturalness: 修订后采用“阿里奥克王的平原上居住的人”补足汉语所需的中心成分，句法清楚且保持庄重的叙事语体。“为……的战阵而聚集”较为贴近原文，虽略带书面感，适合本段军事叙事。
  terminology: “幼发拉底河”“底格里斯河”“希达斯佩斯河”“以吕迈人”“阿里奥克”“赫勒乌勒”可保留。以“战阵”对应 παράταξις，并以脚注说明其军事性的“战斗队形／阵列”含义。
