  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: zh_hans
  text: 所有住在山区的人，以及所有住在幼发拉底河、底格里斯河和希达斯佩斯河沿岸的人，又所有住在以吕迈人的王阿里奥克的平原上的人，都前来与他会合[a]。许多民族也为赫勒乌勒众子的战阵而聚集起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前来与他会合”也可译作“前来见他”；原文在这里可能含有与他联合、加入其一方的意思。
    reason: lexical_alternative
  - marker: b
    text: “战阵”译自军事用语，指为作战列成的队形或阵列。原文“赫勒乌勒众子”的属格关系未明确说明这些民族是组成该战阵，还是与之对阵。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  choice: 前来与他会合
  rationale: 该短语本义是“前来与他相遇”，在军事政治语境中可含联合或归附之意；“会合”既自然，又不像“投奔”那样过度确定其效忠关系。
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  choice: 住在山区的人
  rationale: ὀρεινή 是名词化形容词，指山地或山区；此译简明自然，保留地理含义。
- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: 住在幼发拉底河、底格里斯河和希达斯佩斯河沿岸的人
  rationale: 河名在 κατοικέω 后宜按汉语习惯补出“沿岸”，避免字面译成“住在河中”。
- source_word: πεδίῳ
  choice: 在平原上
  rationale: 与格在此作地点用法；“在平原上”是自然的现代汉语地理表达。
- source_word: Ἀριὼχ
  choice: 阿里奥克
  rationale: 依希腊语形式音译，并与传统形式“亚略”保持区分。
- source_word: Ἐλυμαίων
  choice: 以吕迈人
  rationale: 按希腊语所指的 Elymais 居民音译，避免直接等同于范围更广、认同未必完全相同的“以拦人”。
- source_word: συνῆλθον
  choice: 聚集起来
  rationale: 准确表达众多群体共同聚合，并符合军事语境。
- source_word: εἰς παράταξιν
  choice: 列入……的战阵
  rationale: παράταξις 指军队列成的战斗阵势；此译保留军事术语的名词意味。
- source_word: υἱῶν Χελεούλ
  choice: 赫勒乌勒众子
  rationale: 直译 υἱῶν 为“众子”，不擅自判定这是亲生后代、宗族名称还是某一族群。
