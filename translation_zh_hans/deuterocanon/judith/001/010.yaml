lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: 直到来到／直至来到
  rationale: 此处“ἕως τοῦ＋不定式”主要标示空间所及的终点。中文保留两次“来到”，既呈现原文的重复结构，也能表达行程延伸至某地的意思。
- source_word: ἐπάνω
  choice: 到
  rationale: 与地名连用时表示趋向或抵达该处；译作“到”最符合现代汉语。
- source_word: Τάνεως
  choice: 塔尼斯
  rationale: 采用该古埃及城市 Tanis 的通行中文音译。
- source_word: Μέμφεως
  choice: 孟斐斯
  rationale: 采用 Memphis 的通行中文译名。
- source_word: κατοικοῦντας
  choice: 住在
  rationale: 分词指长期居住于某地的人；“住在”自然清楚，不增加原文没有的动作。
- source_word: τὴν Αἴγυπτον
  choice: 埃及
  rationale: 直接使用现代汉语通行国名。
- source_word: ἐπὶ τὰ ὅρια
  choice: 到……的边界
  rationale: ὅρια 指领土界限；“边界”准确而自然。
- source_word: Αἰθιοπίας
  choice: 埃塞俄比亚
  rationale: 按希腊文地名 Αἰθιοπία 采用通行中文译名；不擅自改译为“古实”。
