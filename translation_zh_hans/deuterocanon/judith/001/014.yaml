  text: And he gained control of his cities[a], and he came as far as Ecbatana, and he seized its towers and plundered its streets[b], and he turned its splendor into disgrace.
translation:
  language: zh_hans
  text: 他控制了他的各城，直到埃克巴坦那为止；他夺取城中的塔楼，劫掠城里的大街[a]，使这城的华美[b]沦为耻辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大街”所译的希腊词也可特指城中宽阔的街道或公共广场。
    reason: lexical_alternative
  - marker: b
    text: “华美”所译的希腊词在这里指城市的装饰、荣美或壮丽，并非“世界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: 控制了他的各城
  rationale: κυριεύω表示取得支配权或成为主宰；此处是军事征服语境，用“控制了”既体现占领，也不额外暗示长期统治。αὐτοῦ直译为“他的”，保留原文指代。
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: 一路来到埃克巴坦那
  rationale: ἀφικνέομαι表示到达，ἕως标明行程所及；“一路来到”自然表达军队推进至该城。Ἐκβάτανα按通行音译作“埃克巴坦那”。
- source_word: ἐκράτησεν τῶν πύργων
  choice: 夺取城中的塔楼
  rationale: κρατέω接属格在此表示以武力取得控制；“夺取”符合攻城语境。“城中的”根据埃克巴坦那及后文阴性代词所指补出，使中文清楚自然。
- source_word: ἐπρονόμευσε τὰς πλατείας αὐτῆς
  choice: 劫掠城里的大街
  rationale: προνομεύω指掠夺战利品；πλατεῖαι可指宽阔街道或公共广场。正文采用自然且不失具体性的“大街”，并以脚注保留另一可能。
- source_word: τὸν κόσμον αὐτῆς
  choice: 城中的华美
  rationale: κόσμος在此不是“世界”，而是装饰、妆饰所呈现的美观与荣华；“华美”能涵盖城市的装饰与壮丽。
- source_word: ἔθηκεν εἰς ὄνειδος
  choice: 使……沦为耻辱
  rationale: 该结构表示使某物成为受辱或蒙羞之物；“沦为耻辱”保留“华美—耻辱”的强烈反转，并符合现代汉语。
