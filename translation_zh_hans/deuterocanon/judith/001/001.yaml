lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας Ναβουχοδονοσόρ
  choice: 尼布甲尼撒在位第十二年
  rationale: 这是纪年格式；“在位第十二年”以自然、庄重的现代汉语表达 βασιλεία 所指的统治时期。人名采用现代中文读者较熟悉的“尼布甲尼撒”。
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: 他……统治亚述人
  rationale: ἐβασίλευσεν 加属格表示对某民族施行王权；译作“统治亚述人”既准确，也避免误把属格直接理解为地名。
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: 在大城尼尼微
  rationale: 保留地点和同位性的尊称；“大城尼尼微”比逐字译作“在尼尼微这座大城”更凝练。
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: 当时，亚法撒
  rationale: 该短语表示与前述时期同时；“当时”符合现代汉语叙事习惯，同时不额外界定两位君王之间的关系。
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: 统治米底人
  rationale: Μήδων 是“米底人”的属格复数，指受其统治的民族，不直接改译为地域“米底”。
- source_word: ἐν Ἐκβατάνοις
  choice: 在厄克巴坦
  rationale: 按希腊文作地点表达，并采用清晰的现代汉语音译。
- source_word: καὶ
  choice: 以逗号表示未完句
  rationale: 本节希腊文末尾的 καὶ 直接连接下一节；中文若孤立保留“并且”会显得突兀，因此用逗号保留句意尚未完结的状态，并以脚注说明。
