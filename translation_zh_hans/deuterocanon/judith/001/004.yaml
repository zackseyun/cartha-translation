  yaml_path: translation/deuterocanon/judith/001/004.yaml
  text: He laid its foundation to a depth of sixty cubits[a], and he made its gates, gates raised to a height of seventy cubits, and its width forty cubits, for the departures of the force of his mighty men and the formations of his foot soldiers.
translation:
  language: zh_hans
  text: 他为那城奠定了深达六十肘的地基[a]；又造了高耸的城门，高七十肘，宽四十肘，供他勇士的军队出动，并供他的步兵列阵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把它奠基到六十肘”；“深”是根据根基的建筑语境补出的尺度方向。
    reason: 保留原文在尺度方向上的含蓄。
  - marker: b
    text: 末句的希腊文是较为紧缩的军事用语，也可译作“供他勇士的军队出击，并供他的步兵排列成队”。
    reason: 说明“出动／出击”和“列阵／排列成队”的词义可能。
lexical_decisions:
- source_word: αὐτῆς ἐθεμελίωσεν
  choice: 他把城的根基打到
  rationale: ἐθεμελίωσεν表示奠定或铺设根基；结合上文所指的城，以“把城的根基打到”表达建筑语境，现代汉语自然清楚。
- source_word: εἰς πήχεις ἑξήκοντα
  choice: 六十肘深
  rationale: 在根基语境中，这一尺度最自然地指向下的深度；原文没有明说“深”，故用脚注保留其仅表尺度范围的形式。
- source_word: πύλας διεγειρμένας
  choice: 高耸的大门
  rationale: διεγειρμένας有“被抬高、竖起”的意思；“高耸”保留门被高高建起的形象，也符合汉语建筑描写。
- source_word: εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: 高七十肘
  rationale: 直接而自然地表达原文的高度尺度。
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: 宽四十肘
  rationale: 简洁对应宽度说明；按紧邻语境理解为城门的宽度。
- source_word: εἰς ἐξόδους
  choice: 供……出动
  rationale: ἔξοδος本义为出去、出发，在军事语境中可指部队出动乃至出击；“出动”兼顾字面范围和军事语感。
- source_word: δυνάμεως δυνατῶν αὐτοῦ
  choice: 他勇士的军队
  rationale: 将δυνάμεως的军队义与δυνατῶν的勇士义分别表达，避免把两个词合并为单一概念。
- source_word: διατάξεις τῶν πεζῶν αὐτοῦ
  choice: 供他的步兵列阵
  rationale: διατάξεις在军事语境中指编排、队列或阵形；πεζοί指徒步作战的士兵。“步兵列阵”简明且具军事色彩。
