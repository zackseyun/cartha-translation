base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/002.yaml
  text: Look[a], we, the servants of Nebuchodonosor the great king, lie before you[b]; deal with us as is pleasing in your sight.
translation:
  language: zh_hans
  text: 看哪，我们这些伟大君王纳布科多诺索尔[a]的仆人，伏在你面前[b]；请照你看为好的处置我们。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纳布科多诺索尔”依照本节希腊文本中的姓名形式音译；其他译本也常按较熟悉的形式译作“尼布甲尼撒”。
    reason: alternative_reading
  - marker: b
    text: “伏在你面前”所译的希腊语也可译作“躺在你面前”或“被置于你面前”，在这里含有顺服并任凭处置的意味。
    reason: lexical_alternative
  - marker: c
    text: “照你看为好的”直译是“照在你面前所喜悦的”。
    reason: literal_rendering
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、郑重陈诉的语用功能；“看哪”在现代中文中仍清楚可懂，也比单说“看”更符合此处正式的请降语气。
- source_word: παῖδες
  choice: 仆人
  rationale: 此处是臣属对君王的谦称，重点在服事与隶属关系，不在年龄；“仆人”比“孩子”准确，也不武断地认定其法律身份为奴隶。
- source_word: Ναβουχοδονοσὸρ
  choice: 纳布科多诺索尔
  rationale: 按本节希腊文本中的姓名形式音译，不径自与其他经卷中较熟悉的希伯来语姓名形式统一。
- source_word: βασιλέως μεγάλου
  choice: 伟大君王
  rationale: 保留王号中的尊称意味，同时采用自然、庄重的现代中文表达。
- source_word: παρακείμεθα
  choice: 伏在你面前
  rationale: 保留该完成时中间/被动形式所呈现的“躺着、置于近前”形象，并在请降语境中自然表达俯伏顺服、任凭处置之意。
- source_word: χρῆσαι ἡμῖν
  choice: 处置我们
  rationale: 此处要求对方按自己的意愿对待、使用或安排说话者；“处置”既能体现其任凭支配的处境，又比直译“使用我们”更符合中文请降语境。
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: 照你看为好的
  rationale: 以自然中文传达“在你面前为可喜悦的”这一惯用表达，不把它过度解释为某一种具体行动。
