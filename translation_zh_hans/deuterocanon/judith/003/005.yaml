  text: 那些人来到荷罗孚尼那里，照着这些话向他报告了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用这些话向他报告了。”希腊文直译为“照着这些话”，很可能指他们按刚才所说的话向他报告。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  choice: 来到……面前
  rationale: 该动词表示来到或抵达；结合 πρὸς Ὀλοφέρνην，译作“来到荷罗孚尼面前”自然地表达他们前去见他的叙事动作。
- source_word: οἱ ἄνδρες
  choice: 那些人
  rationale: 定冠词短语回指上文所说的那批男子；现代汉语以“那些人”承接上下文较自然，也不额外添加“使者”或“代表”等原文未明说的身份。
- source_word: ἀπήγγειλαν
  choice: 禀报
  rationale: 该词指传达或报告消息；对象是军事统帅荷罗孚尼，因此“禀报”既体现向上报告的语境，又保持简洁庄重。
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: 照着这些话
  rationale: 贴近希腊文“按照这些话”，并保留它与上文信息乃至具体措辞之间的紧密联系，不弱化为仅仅“大意如此”。
