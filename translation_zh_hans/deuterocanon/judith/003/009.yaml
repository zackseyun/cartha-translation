lexical_decisions:
- source_word: κατὰ πρόσωπον
  choice: 前面
  rationale: 此短语与表示移动的ἦλθεν连用，表达来到某地之前、其正面或面向该地的位置；“前面”自然保留其空间含义，同时不把关系解释得过于具体。
- source_word: Ἐσδρηλών
  choice: 埃斯德勒隆
  rationale: 依照希腊文地名形式音译，不以较熟悉但带有名称协调性质的“耶斯列”代替。
- source_word: πλησίον
  choice: 靠近
  rationale: 准确表达空间上的邻近，符合现代汉语地理叙述习惯。
- source_word: Δοταίας
  choice: 多泰亚
  rationale: 按希腊文地名形式音译，避免直接协调为另一处经文中较熟悉的“多坍”。
- source_word: ἀπέναντι
  choice: 正对着
  rationale: 表达相对、相向的地理位置；“正对着”比单说“对面”更适合接续地貌名称。
- source_word: πρίονος
  choice: 山脊
  rationale: 该词本义为“锯”，在此地形语境中很可能借锯齿状外形指崎岖的山脊；正文采用可理解的地理用语，并以脚注保留字面意象。
- source_word: τῆς Ἰουδαίας
  choice: 犹太地的
  rationale: 用现代中文圣经语境中自然的地理称谓，表示该山脊属于或位于犹太地区。
