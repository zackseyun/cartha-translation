  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: 派
  rationale: 不定过去时主动语态，在叙事中表示派遣人员；“派”比泛泛的“送”更符合中文对使者的自然表达。
- source_word: πρὸς αὐτόν
  choice: 到他那里
  rationale: πρός加宾格与差遣动词连用，表示使者前往的对象或目的地；“到他那里”自然传达方向与受事者。
- source_word: ἀγγέλους
  choice: 使者
  rationale: 此处指受派的人类代表，而非天使；“使者”既贴近原词，也不像“使臣”那样额外限定其政治身份。
- source_word: λόγοις εἰρηνικοῖς
  choice: 用求和的话
  rationale: 该与格短语可表示说话的方式或所传信息的内容。“求和的话”在现代汉语中自然，并保留安抚性言辞与提出和平条件之间的语义空间。
- source_word: λέγοντες
  choice: 说
  rationale: 现在分词引出使者所说的内容；汉语以“说”接冒号，简洁自然。
