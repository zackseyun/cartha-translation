  yaml_path: translation/deuterocanon/judith/003/007.yaml
  text: And they themselves, and all their surrounding region, received him with garlands and dances and tambourines.
translation:
  language: zh_hans
  text: 他们自己和他们周围地区的所有人，都带着花环、跳着舞、敲着手鼓迎接[a]他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎接”或译“接待”。希腊语动词既可指接纳、接待，也可在这里表示欢迎、迎接。
    reason: lexical_alternative
  - marker: b
    text: “花环”也可译作“花冠”。这里指庆典所用的环状饰物，不一定是王冠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: 迎接
  rationale: δέχομαι可表示“接待、迎接”。本节描写带着花环、歌舞和手鼓的礼仪性场面，“迎接”最符合语境，也自然体现欢迎之意。
- source_word: αὐτὸν
  choice: 他
  rationale: 作直接宾语，按上下文指敖罗斐乃。
- source_word: αὐτοὶ
  choice: 他们亲自
  rationale: 独立主格代词带有强调意味；译作“他们亲自”保留这一强调。
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: 他们周围全境的人
  rationale: περίχωρος指周围地区；原文以地区集合性地指其中居民。汉语补出“的人”，避免把地域本身写成执行迎接动作的主体。
- source_word: μετὰ στεφάνων
  choice: 拿着花环
  rationale: στέφανος在此节庆语境中指花环或环状饰物，并非必然指王冠；“拿着”使伴随迎接的场景在现代汉语中自然清楚。
- source_word: χορῶν
  choice: 载歌载舞
  rationale: χορός可指舞蹈、合舞或歌舞队。此处采用汉语惯用表达，传达节庆性的集体歌舞，但不限定具体编制。
- source_word: τυμπάνων
  choice: 敲着手鼓
  rationale: τύμπανον指手持的鼓或类似铃鼓的打击乐器；“手鼓”既具体又避免误作大型鼓。
theological_decisions: []
