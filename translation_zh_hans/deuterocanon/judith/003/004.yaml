  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your servants; come and deal with them as is good in your eyes.
translation:
  language: zh_hans
  text: 看哪，我们的城邑和住在其中的人也都是你的奴隶；请你来，照你眼中看为好的处置这些城邑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文用于郑重引起注意和强调呈示的语气；现代读者也能自然理解。
- source_word: πόλεις
  choice: 城邑
  rationale: 指城市或设防聚落；“城邑”适合古代叙事语境，同时不局限于现代意义的大城市。
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: 其中的居民
  rationale: 自然表达居住在这些城邑里的人，并保留与前项的从属关系。
- source_word: δοῦλοί
  choice: 奴仆
  rationale: 此处是面对征服者表示完全臣服。“奴仆”既传达受支配的身份，也保留该词可在奴隶与仆役之间摆动的词义张力。
- source_word: ἐλθὼν ἀπάντησον
  choice: 请来……对待
  rationale: 将附属分词与命令式自然合译。“对待”适合以城邑及居民为对象的投降语境，又不额外指定征服者将采取何种行动。
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: 照你眼中看为好的
  rationale: 贴近希腊语习语，表达由对方按照自己的判断或意愿行事，同时保留原文庄重措辞。
theological_decisions:
- issue: 政治臣服语境中 δοῦλοι 的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “仆人”容易淡化无条件降服于征服者的意味，“奴隶”则可能把词义限定得过窄；“奴仆”较能兼顾强制性的隶属关系和原词的语义范围，并以脚注提示更强译法。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“看哪”和“照你眼中看为好的”保留古代叙事与臣服陈词的修辞色彩；句法则调整为现代汉语自然语序。
