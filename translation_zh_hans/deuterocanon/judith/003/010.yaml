revisions:
- from: 他们在该拜和西徐人的城[a]之间安营；他在那里住了整整一个月[b]，为要集齐他军队的全部编制[c]。
  to: 他们在该拜和斯基泰人的城[a]之间安营；他在那里停留了整整一个月[b]，为要备齐他军队所需的一切[c]。
  rationale: 修订避免把语义宽泛的ἀπαρτίαν限定为现代军事“编制”，改为“军队所需的一切”，并以脚注明确其可指齐备状态、装备或人员数额。族名采用通行的“斯基泰人”，但主文仍按希腊文保留“……人的城”这一非专名结构；传统地名仅置于脚注。其余句法、单复数转换和目的关系均维持原文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:18:01Z'
review_pass:
  verdict: revise
  source_fidelity: 主要意思忠实地保留了军队在两地之间扎营、统帅停留一月及其目的。μως，“集齐他军队的全部编制”把ἀπαρτίαν误落实为现代军队的组织编制；“编制”本身不是可被“集齐”的对象，也未能恰当保留该词可指军队齐备状态、足额人员或装备的涵义。
  naturalness: 叙事语体总体自然、庄重。“他在那里住了”可理解，但用于军队统帅的临时驻留时，“停留”更贴切。将“西徐人的城”改为“斯基泰人的城”可使族名在现代标准汉语中清晰、通行，同时仍保留希腊文的透明表达而非直接将其等同为传统地名。
  terminology: “安营”“该拜”及单数“他”均可保留。Σκυθῶν宜译“斯基泰人”，脚注保留“西徐波利斯”这一传统地名备选。ἀπαρτίαν宜以不预断其究竟偏指人员还是装备的措辞处理，并在脚注说明语义范围。
  issues:
  - severity: medium
    issue: “全部编制”误导性地对应ἀπαρτίαν
    rationale: 现代汉语“编制”通常指组织设置或核定员额，不能自然作为“集齐”的对象；原词在此可指军队达到齐备所需之物、全套装备或足额数额。应以涵盖性表达并由脚注保留歧义。
  - severity: low
    issue: “西徐人”并非现代汉语中通常的Σκύθης族名译法
    rationale: “斯基泰人”是现代汉语较通行且清楚的族名；这不将原文透明的“斯基泰人的城”改作专名，只改善名称可识别性。
  - severity: low
    issue: “住了”略带定居意味
    rationale: ἦν ἐκεῖ在此表示统帅在营地停留；“停留”更符合军事行军叙事。
