  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: zh_hans
  text: 他们在该拜和斯基泰人的城[a]之间安营；他在那里停留了整整一个月[b]，为要备齐他军队所需的一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“西徐波利斯”；希腊文直译为“斯基泰人的城”。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“一个月的日子”，是表示一个月时长的习惯说法。
    reason: lexical_alternative
  - marker: c
    text: 原词可指军队的完全齐备，也可具体指全套装备或足额兵力。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: 安营
  rationale: 该动词指军队扎营；“安营”自然、庄重，并保留军事语境。
- source_word: ἀνὰ μέσον
  choice: 在……之间
  rationale: 后接两个地点，表示位于两地之间。
- source_word: Γαιβαὶ
  choice: 该拜
  rationale: 按斯威特希腊文本的地名形式音译，不擅自与其他可能的地名等同。
- source_word: Σκυθῶν πόλεως
  choice: 西徐人的城
  rationale: 直译为“西徐人的城”，保留原文透明的普通名词结构；传统地名“西徐波利斯”列入脚注。
- source_word: ἦν ἐκεῖ
  choice: 他在那里住了
  rationale: 动词为单数，所指自然是上下文中的统帅；“住了”在持续一月的语境中比单纯“在”更符合现代汉语，但不额外说明具体活动。
- source_word: μῆνα ἡμερῶν
  choice: 整整一个月
  rationale: 希腊文直译为“一个月的日子”，是表示一个月时长的习惯说法；现代汉语用“整整一个月”自然地传达其完整时段。
- source_word: συλλέξαι
  choice: 集齐
  rationale: 不定式表示目的；与军队编制搭配时，“集齐”既表达聚集，也表达达到齐备状态。
- source_word: ἀπαρτίαν
  choice: 全部编制
  rationale: 该词可指齐备、全套装备或完整数额；“全部编制”在军事语境中保留“足额齐备”的核心意义，同时以脚注注明其他可能。
- source_word: δυνάμεως αὐτοῦ
  choice: 他军队的
  rationale: 此处 δύναμις 指军事力量；“军队”在现代汉语中清楚自然。
