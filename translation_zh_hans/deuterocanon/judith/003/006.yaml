  yaml_path: translation/deuterocanon/judith/003/006.yaml
  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: zh_hans
  text: 他和他的军队下到沿海地区，在那些高地上的城邑驻军；他们[a]从这些城邑中带走了精选的男子，纳入同盟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“他们带走了”是复数形式，虽然前面的动词是单数（“下到”“驻军”）。这个复数可能指在他指挥下行动的军队；有些译本将其顺译为“他带走了”。
    reason: 保留原文动词数的变化及其可能的所指，不在正文中替原文消除这一张力。
lexical_decisions:
- source_word: κατέβη
  choice: 下到
  rationale: 保留καταβαίνω所表达的向下移动，不额外加入“进军”等军事含义。
- source_word: παραλίαν
  choice: 沿海地区
  rationale: παραλία可指海岸或沿海地带；“沿海地区”在现代汉语中自然，也适合这里的地理行程。
- source_word: δύναμις
  choice: 军队
  rationale: 在明确的军事语境中，δύναμις指武装力量；“军队”比直译为“力量”清楚自然。
- source_word: ἐφρούρησε
  choice: 驻守
  rationale: 该动词表示守卫、看守；以城邑为宾语时，“驻守”准确传达军事控制的语境，同时不把具体部署方式写入正文。
- source_word: πόλεις τὰς ὑψηλάς
  choice: 位于高处的城邑
  rationale: 按字面保留ὑψηλάς的地势含义，避免译成“坚固的城”而加入原文未明说的防御性质。
- source_word: ἄνδρας ἐπιλέκτους
  choice: 挑选男子
  rationale: ἐπιλέκτους表示被选出；“挑选男子”保留ἄνδρας明确的男性指称，又避免擅自提升为“精锐”。
- source_word: εἰς συμμαχίαν
  choice: 纳入盟军
  rationale: 该介词短语表示把这些人吸收进结盟作战的力量；“纳入盟军”在军事上下文中简洁自然。
- source_word: ἔλαβον
  choice: 他们……挑选
  rationale: 保留希腊文复数动词所要求的复数主语，不因前面两个单数动词而改成“他”。
