revisions:
- from: 他拆毁了他们境内所有的圣所，又砍倒他们的圣林；他奉命消灭地上所有的神明，好让万国只敬拜他——尼布甲尼撒，并让他们各种语言的人和各族都称他为神。[a]
  to: 他拆毁了他们所有的疆界，又砍倒了他们的圣林；他获准毁灭那地上所有的神明，好使万国只敬拜他——尼布甲尼撒——，并使所有语言群体和他们所有的支族都称他为神。
  rationale: 依希腊文将ὅρια恢复为“疆界”，不以推测性的宗教语境取代其直接词义；将ἦν δεδομένον αὐτῷ译作“他获准”，保留原文未说明授予者的被动表达。其余按原文的句法与重点调整：尼布甲尼撒是“他”的同位说明，也是敬拜与称为神的对象；γλῶσσαι和φυλαί保留为两个并列群体。无需脚注，因为修订后的正文已直接表达原文，且本节没有必须以脚注保留的文本歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:18:15Z'
review_pass:
  verdict: revise
  source_fidelity: “他们境内所有的圣所”不符合ὅρια的通常且直接含义；此处应译为“疆界／边界”。原文没有将其限定为宗教场所的根据，且英语审校底本亦作“borders”。其余主要内容大致传达了原文：砍伐圣林、获准毁灭诸神、万国敬拜尼布甲尼撒，并称他为神。
  naturalness: 原译整体通顺，但“他们各种语言的人和各族”搭配略显生硬。用“所有说各种语言的民族和他们所有的支族”或较简洁的“所有语言群体和所有支族”更自然，同时保留γλῶσσαι与φυλαί的并列。
  terminology: “圣林”“神明”“敬拜”均可保留。“他奉命”比ἦν δεδομένον αὐτῷ更明确地暗示有命令；宜译为“他获准／这权柄已交给他”，不说明授予者。“地上”可译为“那地上的”，以对应τῆς γῆς并避免不必要的宇宙性扩展。
  issues:
  - severity: high
    issue: 将ὅρια译为“境内所有的圣所”
    rationale: ὅρια的基本义为“边界、疆界”，原文并无“圣所”之义。与圣林和诸神同处于破坏宗教的叙事语境，并不足以把该词改译为宗教设施；脚注虽承认其本义，却不能补救正文的无据改译。
  - severity: medium
    issue: “他奉命”强化了原文未明说的命令关系
    rationale: ἦν δεδομένον αὐτῷ是被动式，意为“已赐给／交给／准许给他”。“奉命”通常表示领受明确命令，宜以“他获准”保留原文的未指明施事者和授予性质。
  - severity: low
    issue: “他们各种语言的人”表达不够自然且稍改变并列结构
    rationale: γλῶσσαι字面为“舌头”，此处指语言群体；应与“支族”并列表达，而非将其转成不够明确的“语言的人”。
  revised_text: 他拆毁了他们所有的疆界，又砍倒了他们的圣林；他获准毁灭那地上所有的神明，好使万国只敬拜他——尼布甲尼撒——，并使所有语言群体和他们所有的支族都称他为神。
  revised_footnotes: []
