base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: zh_hans
  text: 他拆毁了他们所有的疆界，又砍倒了他们的圣林；他获准毁灭那地上所有的神明，好使万国只敬拜他——尼布甲尼撒——，并使所有语言群体和他们所有的支族都称他为神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρια
  choice: 境内所有的圣所
  rationale: 此词通常意为“疆界、边界”，但本节与“圣林”和“诸神”并列，语境可能指境内的宗教设施；采用“境内所有的圣所”使汉语自然，并呈现毁灭各地崇拜场所的语境。因原词本义仍有歧义，以脚注说明。
- source_word: ἄλση
  choice: 圣林
  rationale: 指与异教祭祀有关的树林或木柱；“圣林”简洁保留宗教含义，不泛化为普通树林。
- source_word: ἦν δεδομένον αὐτῷ
  choice: 他奉命
  rationale: 字面为“这事已被交给／准许他”；上下文表明任务或权柄被授予他。“奉命”符合叙事语境，但不明说授命者。
- source_word: θεοὺς
  choice: 神明
  rationale: 这里指各地受崇拜的诸神；“神明”能自然表达复数异教神祇。
- source_word: λατρεύσωσι
  choice: 敬拜
  rationale: 该词表示宗教性的事奉、崇拜；此处尼布甲尼撒要求获得唯独归于神的敬拜。
- source_word: γλῶσσαι
  choice: 各种语言的人
  rationale: 字面为“舌头”，在此借指语言群体；如此译法既保留语言层面，也使其与“各族”并列时符合现代汉语。
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: 称他为神
  rationale: 表达把尼布甲尼撒当作神来呼求或称认；“称他为神”保留其自我神化的核心意思。
theological_decisions:
- issue: “他奉命／获准”是否暗示神认可尼布甲尼撒的行动
  choice: 保留被动表达，不指明授命者
  alternative: 译为“上帝准许他”或“尼布甲尼撒下令”
  rationale: 希腊文采用无人称被动，未明说权柄来源；不应把叙事中人的命令擅自解释为上帝的认可，也不应完全改成主动自令。
- issue: 尼布甲尼撒是受敬拜者还是仅代表某位神
  choice: 明确译为万国只敬拜尼布甲尼撒，并称他为神
  alternative: 把敬拜对象理解为尼布甲尼撒所敬奉的神
  rationale: 代词 αὐτῷ 和随后明确出现的 τῷ Ναβουχοδονοσόρ 同位，末句又说“称他为神”，因此受敬拜者就是尼布甲尼撒本人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“圣林”“神明”“敬拜”保留宗教语域；破折号突出“他”就是尼布甲尼撒，避免汉语代词指向不清。
