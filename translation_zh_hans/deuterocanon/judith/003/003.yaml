  yaml_path: translation/deuterocanon/judith/003/003.yaml
  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: zh_hans
  text: 看哪[a]，我们的田庄、每一块麦田、羊群、牛群，以及我们帐篷的所有围栏，都摆在你面前[b]；请随你的心意取用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田庄”也可译作“农庄”。希腊词指农业环境中的乡间产业或固定居所。
    reason: lexical_alternative
  - marker: b
    text: “我们帐篷的所有围栏”按原文直译，可能指与帐篷、营地或牲畜有关的围起或划定的处所。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留直接唤起注意的指示语气；“看哪”庄重而仍为现代读者所理解。
- source_word: ἐπαύλεις
  choice: 田庄
  rationale: 指乡间的居所或农牧产业；结合麦田与牲畜的语境，“田庄”比单纯的“房屋”更准确。
- source_word: πᾶν πεδίον πυρῶν
  choice: 所有的麦田
  rationale: πεδίον 可指平地或田地，与 πυρῶν（小麦）连用时自然指种植小麦的田地；“所有的”自然表达 πᾶν 的总体意义。
- source_word: ποίμνια
  choice: 羊群
  rationale: 在与 βουκόλια 对举的农牧语境中，指绵羊或山羊等小型牲畜群；“羊群”简洁自然。
- source_word: βουκόλια
  choice: 牛群
  rationale: 该词指牛类牲畜的群体，与“羊群”形成清楚自然的对举。
- source_word: μάνδραι
  choice: 圈栏
  rationale: 泛指围起来供牲畜或营地使用的地方；“圈栏”既保留围护空间之意，又不限定为某一种牲畜圈。
- source_word: τῶν σκηνῶν ἡμῶν
  choice: 我们帐篷的
  rationale: 按字面保留 σκηναί 的“帐篷”意象，不扩译为“营地”。
- source_word: παράκεινται πρὸ προσώπου σου
  choice: 都摆在你面前
  rationale: 保留“在你面前”的空间隐喻，同时在汉语中自然传达这些产业已任其处置的含义。
- source_word: χρῆσαι
  choice: 请……取用
  rationale: 此处为带命令或许可意味的用法；“取用”适合前列财产与物资，“请”体现说话者的恭顺语气。
- source_word: καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: 随你的心意
  rationale: 自然表达由对方喜好决定的许可，保持原文的宽泛性，不限定具体处置方式。
