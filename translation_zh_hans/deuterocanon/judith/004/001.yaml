base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: zh_hans
  text: 住在犹太地的以色列人[a]听说了亚述王尼布甲尼撒的最高统帅荷罗斐尼对列国所做的一切，也听说他怎样劫掠了他们所有的圣所[b]，并将这些圣所交付毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“以色列的众子”，也可译作“以色列子民”。
    reason: 保留原文群体称谓的字面形式和可能译法。
  - marker: b
    text: 或译“神庙”或“神圣之物”；希腊文可泛指神圣的场所或物件。
    reason: 说明τὰ ἱερά的指称范围，避免把原文过度限定为建筑物。
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 希腊文直译为“以色列的众子”，是表示以色列群体的惯用语。正文采用现代汉语自然、庄重的“以色列人”，并以脚注保留字面形式及其盟约群体色彩。
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: 住在犹太地的
  rationale: κατοικοῦντες表示居住、定居；“住在犹太地的”自然地保留了持续居住的含义。
- source_word: πάντα ὅσα ἐποίησεν
  choice: 所做的一切
  rationale: 准确表达πάντα ὅσα的全面性，也符合现代汉语叙事习惯。
- source_word: ὁ ἀρχιστράτηγος
  choice: 最高统帅
  rationale: ἀρχιστράτηγος指居首位的军事统帅，强于一般的“将军”；“最高统帅”简洁地传达其等级。
- source_word: τοῖς ἔθνεσιν
  choice: 对列国
  rationale: 此处指荷罗斐尼所征服的各国或各族，并非特指后期神学意义上的“外邦人”；“列国”也符合庄重的圣经叙事语体。
- source_word: ἐσκύλευσεν
  choice: 劫掠了
  rationale: 该动词有掠夺战利品、洗劫之意；“劫掠”保留军事暴力语境且为现代读者易懂。
- source_word: τὰ ἱερὰ αὐτῶν
  choice: 他们所有的圣所
  rationale: τὰ ἱερά既可指圣地、神庙等神圣场所，也可广指神圣之物。上下文谈及列国宗教设施被摧毁，“圣所”最合语境，但脚注保留词义范围。
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: 使这些圣所尽遭毁灭
  rationale: 该短语字面有“将它们交付于毁灭”之意；此译保留使其落入彻底毁坏结局的力度，同时避免引入技术性的“奉献毁灭”概念。
theological_decisions:
- issue: οἱ υἱοὶ Ἰσραήλ的群体称谓
  choice: 正文译作“以色列人”，脚注注明字面为“以色列的众子”
  alternative: 以色列的众子／以色列子民
  rationale: “以色列人”在现代汉语中最自然地指整个民族群体，不应误解为仅限男性；脚注则保存原文男性复数惯用语及其历史、盟约色彩。
- issue: τὰ ἱερὰ αὐτῶν所指的宗教对象
  choice: 圣所
  alternative: 神庙／神圣之物
  rationale: “圣所”不对列国崇拜作神学认可，而是如实标示其宗教场所；同时不将原文含义过度限定为单一建筑或可移动物件。
- issue: ἔδωκεν αὐτὰ εἰς ἀφανισμόν是否采用圣战术语
  choice: 使这些圣所尽遭毁灭
  alternative: 把它们交付毁灭／将它们灭尽
  rationale: 原文强调交付于毁灭的结果，但没有必要将其等同于希伯来圣战中的专门术语；所选译法保留力度而不增加该神学联想。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“列国”“圣所”保留经文风格，但句法按自然现代汉语组织。专名采用通行且易辨认的音译“尼布甲尼撒”和“荷罗斐尼”。两个“听说”相配，清楚呈现原句中“所做的一切”与“怎样劫掠”两层内容；末尾重复“这些圣所”，避免汉语代词指代含混。
