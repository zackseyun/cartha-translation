revisions:
- from: 因为他们不久前才从被掳之地回来[a]，全犹太的百姓也刚刚重新聚集起来；器皿、祭坛和圣殿[b]也已从亵渎中重新分别为圣[c]。
  to: 因为他们不久前才从被掳中归来[a]，犹太地区的全体百姓也刚刚聚集起来；器皿、祭坛和圣殿[b]也都已从亵渎中恢复为圣[c]。
  rationale: 修订“全犹太的百姓”和“被掳之地”，以更准确地对应τῆς Ἰουδαίας及αἰχμαλωσίας，并改善现代汉语表达。末句改为“从亵渎中恢复为圣”，既保留ἐκ所示的脱离／恢复关系，也自然表达ἡγιασμένα所示已完成的圣别状态；相关可选译法保留于脚注。
  reviewer_model: gpt-5.6-terra
