base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/003.yaml
  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: zh_hans
  text: 因为他们不久前才从被掳中归来[a]，犹太地区的全体百姓也刚刚聚集起来；器皿、祭坛和圣殿[b]也都已从亵渎中恢复为圣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从被掳中归来”也可译作“从被掳中上来”或“从流亡之地归来”。原文“上来”保留了前往犹太地区的地理表达。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“房屋”，这里指圣殿。
    reason: cultural_note
  - marker: c
    text: “从亵渎中恢复为圣”也可译作“从亵渎中重新分别为圣”或“在遭亵渎后重新献为圣”；原文强调先遭亵渎、后来恢复为圣。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσφάτως
  choice: 不久前才
  rationale: 表达时间非常临近，并以“才”体现原文对近期性的强调。
- source_word: ἀναβεβηκότες
  choice: 回来
  rationale: 该完成时分词本义为“上来”，在从被掳状态归回犹太的语境中，“回来”是自然明确的汉语表达；其地理性的“上来”可在脚注中保留。
- source_word: αἰχμαλωσίας
  choice: 被掳之地
  rationale: αἰχμαλωσία可指被掳、囚虏状态或相关处境；结合介词ἐκ和归回语境，译作“被掳之地”在现代汉语中较为通顺，同时保留“被掳”的历史色彩。
- source_word: νεωστὶ
  choice: 刚刚
  rationale: 与前面的προσφάτως呼应，突出百姓重新聚集也是近期发生的事。
- source_word: συνελέλεκτο
  choice: 重新聚集起来
  rationale: 过去完成时被动形式表示百姓已经被聚集成为共同体；“重新”根据被掳归回的上下文表达恢复之意，但不具体规定组织过程。
- source_word: σκεύη
  choice: 器皿
  rationale: 圣殿语境中指礼仪用具；“器皿”简洁且符合中文圣经语体，无须在正文另加“圣”。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 准确表达献祭所用的坛。
- source_word: ὁ οἶκος
  choice: 圣殿
  rationale: 字面为“殿、房屋”，此处与器皿和祭坛并列，明确指圣殿；直译“殿”在孤立经节中可能不够清楚。
- source_word: βεβηλώσεως
  choice: 亵渎
  rationale: 指圣物或圣所被俗化、玷污；“亵渎”准确保留礼仪及宗教层面的含义。
- source_word: ἡγιασμένα
  choice: 重新分别为圣
  rationale: 完成时被动分词表示这些对象已恢复为圣的状态；“分别为圣”保留ἁγιάζω的核心意义，“重新”体现先遭亵渎、后得恢复的对照。
theological_decisions:
- issue: 如何表达圣殿物件与空间从亵渎中恢复为圣
  choice: 已从亵渎中重新分别为圣
  alternative: 在遭亵渎后已经洁净／重新献为圣
  rationale: ἐκ保留“从……中”的关系，而ἡγιασμένα侧重成为圣、被分别为圣，不宜仅译成“洁净”。加入“重新”自然呈现先前被亵渎、随后恢复为圣的张力，却不增添具体仪式细节。
- issue: ὁ οἶκος在圣殿语境中的译法
  choice: 圣殿
  alternative: 殿／那殿
  rationale: 原词字面是“房屋、殿”，但此处所指明确为圣殿。现代普通读者在单节文本中读“圣殿”更清楚；脚注说明原文用词，以保留其敬称色彩。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“被掳”“祭坛”“分别为圣”保留必要的圣经与礼仪语汇；用“回来”“刚刚重新聚集起来”避免过度古雅。句中分号区分百姓归聚与圣殿恢复两个相连层面。
