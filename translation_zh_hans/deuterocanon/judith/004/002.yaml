  text: And they were very, very afraid because of him, and they were troubled about Jerusalem and the temple of the Lord their God.
translation:
  language: zh_hans
  text: 他们因他而万分恐惧，也为耶路撒冷和他们的主上帝的圣殿感到不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν σφόδρα σφόδρα
  choice: 极其恐惧
  rationale: 希腊文以重复的 σφόδρα 强烈加重恐惧程度；现代汉语用“极其恐惧”自然、庄重地表达这一强化，而不采用较生硬的“非常非常害怕”。
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: 因他
  rationale: 此处短语表示面对他所带来的威胁、因他而惧怕；“因他”简洁保留因由，不额外说明其身份或行动。
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  choice: 为耶路撒冷和……圣殿
  rationale: περί 在此指所忧虑关切的对象；“为……忧惧不安”符合现代汉语表达。
- source_word: ἐταράχθησαν
  choice: 忧惧不安
  rationale: 该词表达内心受扰、惶恐不安；结合所关切的圣城和圣殿，译为“忧惧不安”兼顾扰乱与忧虑。
- source_word: Κυρίου θεοῦ αὐτῶν
  choice: 主他们上帝的
  rationale: 保留“主”和“他们的上帝”两层称谓及原文所属关系，不将 Κύριος 专名化为其他称呼。
theological_decisions:
- issue: “主”与“他们的上帝”的关系
  choice: 主他们上帝的圣殿
  alternative: 他们的主上帝的圣殿
  rationale: 原文为“主、他们的上帝之殿”，重点是圣殿属于那位作为他们上帝的主；现译尽量贴近原有次序，避免引入原文没有的神名形式。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“极其恐惧”体现 σφόδρα σφόδρα 的强烈强调；后半句以“忧惧不安”避免与前半句机械重复，同时保留 ἐταράχθησαν 的内心震动感。
