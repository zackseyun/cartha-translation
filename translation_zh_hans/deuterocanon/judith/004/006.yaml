  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: zh_hans
  text: 他们为其中的村庄设防[a]，并储备粮食，为战争作准备，因为他们的田地刚刚收割完。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们中间的村庄。”希腊语的空间关系较为含混。
    reason: 保留τὰς ἐν αὐτοῖς κώμας可能具有的另一种空间理解，不作过度具体化。
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: 加固了
  rationale: 该中间语态动词表示给地点筑墙或设防；“加固”在现代汉语中自然，并不限定具体防御工事。
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: 其中的村庄
  rationale: κώμας 指村庄；ἐν αὐτοῖς 的空间指向较为压缩含混，“其中的”保留这种关系，不强行确定具体地理所指。
- source_word: παρέθεντο εἰς ἐπισιτισμὸν
  choice: 储备粮食
  rationale: παρέθεντο 在此表示预先置备，ἐπισιτισμός 指粮食供应；合译为“储备粮食”清楚表达为将来需要而囤积给养。
- source_word: εἰς παρασκευὴν πολέμου
  choice: 为战争做准备
  rationale: παρασκευή 在此是准备、预备之意，πολέμου 表明所准备的是战争。
- source_word: προσφάτως
  choice: 不久前才
  rationale: 该副词表示事情发生在近期；与完成时被动分词结合，译法自然地突出刚完成不久。
- source_word: τεθερισμένα
  choice: 收割完
  rationale: θερίζω 的完成时被动分词表示田地已经收割；“收割完”既通俗，也保留完成状态。
