  text: telling them to seize the mountain passes[a], because through them was the entrance into Judea; and it was easy to hold them back as they came up[b], since the approach was narrow enough for all the men to go two abreast.
translation:
  language: zh_hans
  text: 吩咐他们占据山地的上行通道[a]，因为这些通道是进入犹太地的入口；他们上来时，很容易把他们拦住，因为进路狭窄，众人每次只能两人并排而行。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“山地的上行通路”，指穿越山地、向上延伸的道路或隘口。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希腊文十分简练，句法也较难确定；这里理解为道路狭窄，众人每次只能两人并排前进。
    reason: alternative_reading
lexical_decisions:
- source_word: διακατασχεῖν
  choice: 占据
  rationale: 此处指控制并守住战略地形；“占据”兼顾采取控制与驻守的军事语境，比单纯“夺取”更不过度强调交战过程。
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: 山区的各处上坡通道
  rationale: 原文直指山区中向上的道路或入口；采用较贴近字面的译法，并以脚注说明其战略上相当于山口、隘道。
- source_word: ἡ εἴσοδος εἰς τὴν Ἰουδαίαν
  choice: 进入犹太地的入口
  rationale: 保留 εἴσοδος 的具体入口意象，也自然表达这些通道构成进入该地的路径。
- source_word: εὐχερῶς
  choice: 很容易
  rationale: 准确表达地形使阻敌变得容易。
- source_word: διακωλῦσαι
  choice: 把他们拦住
  rationale: 符合军事移动语境，表达阻止敌军继续前进，而不额外引入歼灭或击退之意。
- source_word: προσβαίνοντας
  choice: 上来时
  rationale: 既保留向前接近之意，也呼应前文山地上坡通道；避免武断译成“进攻”。
- source_word: στενῆς τῆς προσβάσεως οὔσης
  choice: 因为进路狭窄
  rationale: 将属格独立结构自然译为原因从句；“进路”指进入或接近的路线。
- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  choice: 所有人只能两人并排而行
  rationale: 希腊文本简练且句法困难；依上下文理解为道路仅容两人并行，同时用“只能”明确受限含义。
