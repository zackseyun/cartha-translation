  yaml_path: translation/deuterocanon/judith/004/007.yaml
  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: zh_hans
  text: 当时在耶路撒冷的大祭司[a]约雅金写给住在伯图利亚和伯托麦斯泰姆的人；伯托麦斯泰姆位于以斯德伦对面，朝向多泰姆附近的平原。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“祭司，那位大的”；“大祭司”为惯用译法。
    reason: 说明职衔ἱερεὺς ὁ μέγας的字面形式及惯用译法。
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写信给
  rationale: γράϕω本义为“写”；与间接受词“给……的人”连用时，现代汉语自然表达为“写信给”，虽原文没有明说“信”，但这里的交际含义清楚。
- source_word: Ἰωακεὶμ
  choice: 约雅金
  rationale: 按常见圣经人名音译处理希腊文人名。
- source_word: ἱερεὺς ὁ μέγας
  choice: 大祭司
  rationale: 这是现代汉语对该祭司职衔自然、准确的表达；原文较直译为“祭司，那位大的”，故以脚注保留其形式。
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: 当时在耶路撒冷的
  rationale: 原句逐字近于“在那些日子里在耶路撒冷的”；中文用前置定语简洁表达同一时间和地点信息。
- source_word: τοῖς κατοικοῦσι
  choice: 住在……的人
  rationale: 保留κατοικέω所表达的居住、定居意义，并使用自然现代汉语。
- source_word: Βαιτουλουὰ
  choice: 伯图利亚
  rationale: 依希腊文地名音译，并采用适合现代汉语阅读的形式。
- source_word: Βαιτομεσθαίμ
  choice: 伯托麦斯泰姆
  rationale: 依希腊文地名音译，尽量保留其音节结构。
- source_word: ἀπέναντι
  choice: 位于……对面
  rationale: 准确表达两地相对、相望的空间关系。
- source_word: Ἐσρηλὼν
  choice: 以斯德伦
  rationale: 依希腊文地名音译。
- source_word: κατὰ πρόσωπον
  choice: 朝向
  rationale: 在地理描述中表示面向某处；“朝向”自然地保留其方位意义。
- source_word: τοῦ πεδίου
  choice: 平原
  rationale: πεδίον通常指平坦开阔之地；“平原”符合此处地貌语境。
- source_word: τοῦ πλησίον Δωθάειμ
  choice: 多泰姆附近的
  rationale: 将πλησίον与属格表达的邻近关系自然译出。
theological_decisions:
- issue: ἱερεὺς ὁ μέγας的职衔表达
  choice: 大祭司
  alternative: 大的祭司／祭司，那位大的
  rationale: “大祭司”是现代汉语中明确而惯用的职衔，不额外引入宗派解释；脚注同时说明希腊文的字面构造，以保留原文措辞。
- issue: 关系代词ἥ的所指
  choice: 那里
  alternative: 伯托麦斯泰姆
  rationale: 希腊文使用阴性单数关系代词，语法上最贴近紧邻的伯托麦斯泰姆，但地理说明也可能被读作对前述居住地区的说明。“那里”避免在汉语中不必要地锁定所指，保留原句的衔接弹性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将冗长希腊句重组为中文前置定语，并以分号划分收信对象与地理说明；不补入原文没有的历史或教义信息。
