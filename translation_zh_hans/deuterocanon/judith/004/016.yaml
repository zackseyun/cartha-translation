  to: 他们的头巾上有灰烬；他们竭尽全力向主呼求，求他以恩惠眷顾以色列全家。
  rationale: 删去将 εἰς ἀγαθόν扩展成独立“赐福”行为的措辞，改以“以恩惠”修饰“眷顾”，从而更忠实保留希腊文的句法关系和语义范围；同时将“蒙着灰”调整为更直接对应 ἐπὶ 的方位表达。
