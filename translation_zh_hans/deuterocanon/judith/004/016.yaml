  yaml_path: translation/deuterocanon/judith/004/016.yaml
  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: zh_hans
  text: 他们的头巾上有灰烬；他们竭尽全力向主呼求，求他以恩惠眷顾以色列全家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδός
  choice: 灰
  rationale: 指哀悼、禁食时撒在身上的灰烬；现代汉语用“灰”自然简洁。
- source_word: κιδάρεις
  choice: 头巾
  rationale: 指缠裹或戴在头上的头饰；“头巾”较“冠冕”更符合此处集体哀悼的语境，也便于普通读者理解。
- source_word: ἐβόων
  choice: 呼求
  rationale: 未完成时态描写他们持续高声向主祈求；“呼求”兼顾声音强烈与祷告含义。
- source_word: ἐκ πάσης δυνάμεως
  choice: 竭尽全力
  rationale: 自然表达“以全部力量”，保留祈求的迫切程度。
- source_word: ἐπισκέψασθαι
  choice: 眷顾
  rationale: 此处并非普通探访，而是求神临到、关注并施恩；“眷顾”符合汉语圣经语体且含义清楚。
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: 以色列全家
  rationale: 保留闪族式集体称谓“以色列家”，并以“全家”表达 πᾶν 的整体范围。
theological_decisions:
- issue: εἰς ἀγαθόν 与 ἐπισκέψασθαι 的关系
  choice: 求他眷顾以色列全家，赐福给他们
  alternative: 求他以恩惠眷顾以色列全家
  rationale: εἰς ἀγαθόν 表明所求眷顾的良善结果或有利方向。正文以“赐福给他们”自然传达这一含义，但不具体限定神将如何施恩。
- issue: 主语是否明说为神
  choice: 保留代词“他”，承接“主”
  alternative: 重复译为“求主……”
  rationale: 希腊文不定式的逻辑主语由 Κύριον 承接；使用“他”既清楚又保持原句结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“蒙着灰”保留原文静态描写；分号连接外在哀悼标志与强烈祷告。
