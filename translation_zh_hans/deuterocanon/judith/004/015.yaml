  naturalness: 原句庄重通顺；改为“腰束粗麻布”和“常例的全燔祭”更自然，也更清楚呈现服饰与例常祭的关系。
  terminology: “大祭司”“侍立”“事奉主”“全燔祭”“甘心献的礼物”均恰当。“祈祷”可保留为εὐχαί的正文译法，但应以脚注保留“所许的愿／还愿相关供物”的可能，不能在正文中武断定为其中一义。
