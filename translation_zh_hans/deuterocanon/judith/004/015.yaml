base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/015.yaml
  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
translation:
  language: zh_hans
  text: 大祭司约阿金，以及所有侍立在主面前的人，就是祭司和事奉主的人，都腰束粗麻布，献上常例的全燔祭[a]、百姓的祈祷[b]和甘心献的礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常例的”也可译作“持续的”；希腊语指按常规或持续举行，但本身未必特指每日。
    reason: 说明τοῦ ἐνδελεχισμοῦ的词义范围，避免过度具体化。
  - marker: b
    text: “祈祷”也可译作“所许的愿”；希腊语εὐχαί两义皆可，在这里的献祭语境中也可能指所许的愿或相关供物。
    reason: 保留εὐχαί在本节中的真实词义歧义。
lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: 约雅金
  rationale: 按希腊语人名音译，并采用现代中文圣经语境中自然、易辨认的形式。
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: 大祭司
  rationale: 这是该职分在现代汉语中的标准称谓。
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: 侍立在主面前的人
  rationale: 既保留“站在……面前”的形象，也体现圣所中侍奉、候命的含义。
- source_word: Κυρίου / Κυρίῳ
  choice: 主
  rationale: 忠实对应希腊语 κύριος，不把原文未明写的神名引入正文。
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: 事奉主的人
  rationale: 在祭仪语境中，λειτουργέω 指向神所行的圣职服事；“事奉”自然且庄重。
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: 用麻布束腰
  rationale: 保留以麻布围束腰部的具体动作及哀恸、谦卑的祭仪意象。
- source_word: προσέφερον
  choice: 献上
  rationale: 符合献祭语境；希腊语未完成时所表达的持续背景，在整句叙述中自然呈现，不强加“不断”等副词。
- source_word: τὴν ὁλοκαύτωσιν
  choice: 全燔祭
  rationale: 准确表达祭物全部焚烧的含义，也符合中文祭祀术语。
- source_word: τοῦ ἐνδελεχισμοῦ
  choice: 经常献的
  rationale: 表达例行、持续举行之意，同时避免无充分依据地限定为“每日”。
- source_word: τὰς εὐχὰς
  choice: 祈祷
  rationale: εὐχή 可指祈祷或许愿；在此列举献呈之物的结构中含义有张力，正文采用直接且常见的“祈祷”，脚注保留“所许的愿”的可能。
- source_word: τὰ ἑκούσια δόματα
  choice: 甘心献的礼物
  rationale: 同时保留 ἑκούσια 的自愿性质和 δόματα 的“礼物”词义。
theological_decisions:
- issue: κύριος 在希腊文次经祭仪语境中的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文使用 κύριος，并未在此直接书写希伯来神名；译作“主”可忠实保留希腊文本的称号。
- issue: εὐχαί 在献祭清单中的含义
  choice: 祈祷
  alternative: 所许的愿／还愿祭
  rationale: 该词本身兼有“祈祷”和“所许的愿”之义。上下文虽属献祭场景，但不足以无歧义地把它限定为祭物，因此正文保留较直接的“祈祷”，并以脚注呈现另一种真实可能。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“侍立”“事奉”“全燔祭”保留圣所与祭仪色彩；句法适度重组，使各参与者与所献项目关系清楚。所有脚注标记均已置于正文对应位置。
