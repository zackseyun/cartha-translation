  yaml_path: translation/deuterocanon/judith/004/012.yaml
  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: zh_hans
  text: 住在耶路撒冷的所有以色列男人、妇女和孩子，都在圣殿前俯伏在地，把灰撒在头上，又在主面前展开他们的麻衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伸开他们的麻衣”。原文说法不常见，可能指把麻衣铺开，也可能描写他们身穿麻衣伸展身体、俯伏祈求的姿态。
    reason: 保留ἐξέτειναν τοὺς σάκκους αὐτῶν所指具体动作的不确定性。
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραὴλ καὶ γυνὴ καὶ παιδία
  choice: 所有以色列男人、妇女和孩子
  rationale: 保留原文对男人、妇女和孩子的逐项列举；“男人”反映ἀνήρ明确的男性含义，而不将整组概括为不分性别的“以色列人”。汉语用“所有”统摄并列各项，比逐字译为“每一个……和妇女和孩子”自然。
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: 住在耶路撒冷的
  rationale: 以现代汉语定语结构自然表达分词短语，并将其理解为修饰前述整组居民。
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: 面向圣殿俯伏在地
  rationale: ἔπεσον表达伏下，κατὰ πρόσωπον τοῦ ναοῦ在此表示朝向或面对圣殿；译文保留身体姿态及其方向。
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: 把灰撒在头上
  rationale: 该动词表示以灰覆盖或撒灰，是哀恸、谦卑与祈求的举动；此译法具体而自然。
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: 展开他们的麻衣
  rationale: ἐκτείνω的基本含义是伸展、展开；σάκκους指用于哀恸的粗麻衣。原文动作较不寻常，因此正文采用具体但不过度解释的译法，并以脚注保留不确定性。
- source_word: κατὰ πρόσωπον Κυρίου
  choice: 在主面前
  rationale: 这是表示处于上帝面前或临在中的常见圣经表达；“在主面前”简洁、庄重而自然。
- source_word: Κυρίου
  choice: 主
  rationale: 在此犹太语境中指以色列的上帝；译作“主”既符合原词，也不额外引入解释性称号。
theological_decisions:
- issue: 敬拜群体的性别与年龄列举
  choice: 保留“以色列男人、妇女和孩子”的明确次序
  alternative: 概括为“所有以色列人”
  rationale: 原文特意列出男人、妇女和孩子；保留这一修辞细节，避免以概括性称谓抹去原文的明确列举。
- issue: κύριος的译法
  choice: 主
  alternative: 上帝
  rationale: “主”直接对应κύριος，并保留称号本身；在本段语境中所指清楚，无须改译为更具解释性的“上帝”。
- issue: 展开麻衣这一动作的含义
  choice: 正文保留具体动作“展开他们的麻衣”，并用脚注说明歧义
  alternative: 解释为“穿着麻衣伸展身体”或“铺下麻衣”
  rationale: 希腊语以“麻衣”为直接宾语，但整体表达不寻常；不宜在正文中断定具体姿势或用途。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“面向圣殿俯伏在地”兼顾动作与方向；“麻衣”沿用读者熟悉的圣经哀恸用语。脚注标记置于真正存在词义疑难的“麻衣”短语之后，而非置于“以色列男人”之后。
