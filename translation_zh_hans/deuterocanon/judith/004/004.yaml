  text: And they sent word into all the territory of Samaria[a], and to Kona, and Beth-horon, and Belmaim, and Jericho, and to Choba, and Aisora, and the valley of Salem[c][b],
translation:
  language: zh_hans
  text: 他们传信到撒马利亚全境[a]，又到科拿、伯和仑、贝勒买、耶利哥、科巴、艾索拉和撒冷谷[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撒马利亚各区”。希腊词 ὅριον 可指边界、地区或领土。
    reason: lexical_alternative
  - marker: b
    text: “撒冷谷”也可译作“撒冷平原”；希腊词 αὐλών 可指山谷、谷地或谷状平地。
    reason: lexical_alternative
  - marker: c
    text: 本节若干地名按希腊文音译，因为仅凭其希腊文形式无法确定这些地点的确切位置。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: 传信
  rationale: 原词意为“派遣、送出”，但希腊文未明说所派的人或所送的物；结合一连串目的地，译作“传信”能自然表达语境中隐含的传讯行动，同时不具体断定使者身份。
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  choice: 到撒马利亚全境
  rationale: ὅριον 可指边界、地区或领土；πᾶν 与传信所到的地域相连，在这里译作“全境”比“每一条边界”更符合语境，并保留地域范围的含义。
- source_word: Κωνὰ
  choice: 科拿
  rationale: 按希腊文形式音译；地点的确切对应不明，不作推定性归并。
- source_word: Βαιθωρὼν
  choice: 伯和仑
  rationale: 采用现代中文圣经地名中较熟悉的形式，对应 Beth-horon。
- source_word: Βαιλμὰιν
  choice: 贝勒买
  rationale: 依希腊文形式音译，不把它强行等同于其他已知地点。
- source_word: Ἰερειχὼ
  choice: 耶利哥
  rationale: 采用该著名地名通行的现代中文译名。
- source_word: Χωβὰ
  choice: 科巴
  rationale: 依希腊文 Χωβά 音译；因地点鉴定不确定，不采用可能暗示特定对应地点的意译。
- source_word: Αἰσωρὰ
  choice: 艾索拉
  rationale: 按希腊文形式作接近原音的音译，保留其地点鉴定的不确定性。
- source_word: τὸν αὐλῶνα Σαλήμ
  choice: 撒冷谷
  rationale: αὐλών 可指谷地、狭长山谷或谷状平地；“谷”简洁自然，并保留地貌上的主要含义。Σαλήμ 采用通行形式“撒冷”。
