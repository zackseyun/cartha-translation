base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: zh_hans
  text: 主垂听了他们的声音[a]，垂看了他们的苦难。百姓在犹太全地和耶路撒冷禁食了许多天，在全能的主的圣物[b]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的呼求声”。希腊文直译为“他们的声音”，在祷告和苦难的语境中可指求助的呼声。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣所”或“各圣处”。希腊文为复数，直译是“神圣之物”，可能泛指圣物，也可能指与全能的主有关的神圣区域。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: 垂听了
  rationale: 该动词表示听见、听取，在祷告语境中常含应允式聆听的意味。“垂听”自然体现上主留意祈求，同时不明说已经施行拯救。
- source_word: τῆς φωνῆς αὐτῶν
  choice: 他们的声音
  rationale: φωνή直指“声音”；上下文容许理解为求告声，但正文保留原文较宽泛的表达。
- source_word: ἐπεῖδεν
  choice: 垂看了
  rationale: 该复合动词在此不只是视觉上的看见，也含留意、顾念之意。“垂看”贴近其带有关注意味的用法，又未直接译成采取行动。
- source_word: τὴν θλίψιν αὐτῶν
  choice: 他们的苦难
  rationale: θλῖψις指受压迫、困苦或患难；“苦难”庄重自然，适合全体百姓受威胁的语境。
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: 百姓……禁食
  rationale: 迂回式结构表示持续进行的行动；结合“许多天”，汉语以“禁食了许多天”自然表达持续性。
- source_word: ἡμέρας πλείους
  choice: 许多天
  rationale: 该短语表示延续多日；“许多天”直接保留其数量范围，不缩窄为“几天”。
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: 全犹太和耶路撒冷的百姓
  rationale: 将地点范围自然融入汉语定语，表达禁食遍及犹太全地及耶路撒冷。
- source_word: κατὰ πρόσωπον
  choice: 在……前
  rationale: 这是表示“在……面前”的惯用语；“在……前”简洁保留敬拜场所的临在意味。
- source_word: τῶν ἁγίων
  choice: 圣物
  rationale: 原文为中性复数、形容词名词化，字面指“神圣之物”。“圣物”保留复数集合性和指称开放性，不径自确定为单数的圣所。
- source_word: Κυρίου Παντοκράτορος
  choice: 全能主
  rationale: κύριος作为神圣称号译作“主”，παντοκράτωρ译作“全能”；“全能主”是简洁、庄重且自然的汉语称号。
theological_decisions:
- issue: κύριος作为神的称号
  choice: 主
  alternative: 上主／主人
  rationale: “主”准确保留希腊文神圣称号的功能；“主人”会削弱其称号性质，“上主”虽可表达神名传统，但并非本句希腊词形所必须。
- issue: τῶν ἁγίων在礼仪语境中的所指
  choice: 圣物
  alternative: 圣所／各圣处
  rationale: 原文使用中性复数，可能泛指神圣物件或相关神圣区域。正文不将其限定为单一圣所，以保留原文真实的指称空间。
- issue: 神对百姓苦难的关注程度
  choice: 垂看了
  alternative: 看见了／看顾了
  rationale: “垂看”体现ἐπεῖδεν所含的关注意味，但不像“看顾”那样可能使读者直接理解为已经介入或施行拯救。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“垂听”“垂看”形成适度的经文语体，但句法保持简洁。正文中的脚注标记按相关词语放置：[a]说明“声音”的语境含义，[b]说明复数“圣物”的可能所指。
