base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/011.yaml
  text: They themselves and their wives and their little children and their livestock—and every resident alien or hired worker or purchased servant among them—put sackcloth on their waists[a][b][c].
translation:
  language: zh_hans
  text: 他们自己、他们的妻子、幼小的孩子和牲畜，以及他们中所有寄居者[a]，或雇工和用银子买来的奴隶[b]，都把粗麻布围在腰间[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“侨居者”，指住在当地的外族人。
    reason: lexical_alternative
  - marker: b
    text: “用银子买来的”是原文的字面意思，所指的是被购买的奴隶。
    reason: lexical_alternative
  - marker: c
    text: 把粗麻布围在腰间，是表示哀恸或恳切祈求的举动。
    reason: cultural_note
lexical_decisions:
- source_word: νήπια
  choice: 幼小的孩子
  rationale: 表示年幼、尚不能自理或说话的孩子；“幼小的孩子”自然易懂，又不像“婴儿”那样把年龄范围限定得过窄。
- source_word: κτήνη
  choice: 牲畜
  rationale: 泛指家养、作为财产的动物；“牲畜”是现代汉语中清楚自然的集合称呼。
- source_word: πάροικος
  choice: 寄居者
  rationale: 指住在当地却不属于本地族群或公民群体的人；“寄居者”保留居住其中而身份在外的含义。
- source_word: μισθωτός
  choice: 雇工
  rationale: 指受雇领取工价的人；“雇工”简洁、现代，并避免带入不必要的贬义。
- source_word: ἀργυρώνητος
  choice: 用银子买来的奴隶
  rationale: 该词字面意为“用银子买来的”，语境指被购买而归人所有的人；明确译作“奴隶”，不淡化原文所表达的受奴役身份。
- source_word: ἐπέθεντο σάκκους
  choice: 把麻布围在
  rationale: 此处指把粗麻布穿戴在身上；结合后面的腰部位置，“围在”符合现代汉语表达。
- source_word: ἐπὶ τὰς ὀσφύας αὐτῶν
  choice: 腰间
  rationale: ὀσφύες 指腰或腰胯部位；“腰间”自然、庄重，也避免古奥的身体用语。
theological_decisions:
- issue: ἀργυρώνητος所表示的受奴役身份
  choice: 用银子买来的奴隶
  alternative: 买来的仆人
  rationale: 原词直接表明此人经购买而归人所有。译作“奴隶”忠实呈现这种身份，不以较温和的“仆人”遮蔽原文的社会现实。
- issue: πάροικος、μισθωτός与ἀργυρώνητος之间的连接关系
  choice: 寄居者，或雇工和用银子买来的奴隶
  alternative: 寄居者、雇工或用银子买来的奴隶
  rationale: 希腊文为πάροικος ἢ μισθωτὸς καὶ ἀργυρώνητος，字面连接是“寄居者，或雇工和买来的奴隶”。正文保留这一不完全对称的连接结构，不擅自将三者改成整齐的并列选项。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文反复出现的“他们”，以清楚表明妻子、孩子、牲畜及各类依附者都属于所述群体；对希腊文“或……和……”的不对称并列也予以保留，以免无依据地消解句法上的含混。
