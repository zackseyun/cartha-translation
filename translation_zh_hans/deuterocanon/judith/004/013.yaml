base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: zh_hans
  text: 他们用粗麻布遮盖祭坛，同心恳切地向以色列的上帝呼求，求他不要让他们的幼儿遭人抢掠，让他们的妇女成为战利品[a]，让他们承受为业的各城遭到毁灭，让圣物遭到亵渎和羞辱，成为列国幸灾乐祸的对象。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让他们的妇女任人掳掠。”原文使用战争中掳取战利品的措辞。
    reason: lexical_alternative
  - marker: b
    text: 或译：“成为列国欢喜的缘由。”这里所指的是列国因他们受辱而恶意欢庆。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: 指献祭用的坛；上下文已足够明确，无须增译为“献祭的祭坛”。
- source_word: σάκκῳ περιέβαλλον
  choice: 用麻布包住
  rationale: περιβάλλω 有围裹、覆盖之意；“包住”既保留动作形象，也符合现代汉语表达。
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: 同心恳切地……呼求
  rationale: “呼求”体现 ἐβόησαν 的高声急切；“同心”表达 ὁμοθυμαδόν 的一致行动，“恳切地”表达 ἐκτενῶς 的强烈与迫切。
- source_word: τοῦ μὴ δοῦναι
  choice: 求他不要让
  rationale: 该结构说明呼求的内容或目的；汉语以“求他不要让”自然呈现祈求上帝不要交付的意思。
- source_word: τὰ νήπια ... εἰς διαρπαγὴν
  choice: 让他们的幼儿遭人抢掠
  rationale: νήπια 指婴幼儿或年幼的孩子；“幼儿”保留年龄上的脆弱性。διαρπαγή 指劫掠、掳掠，译作“遭人抢掠”呈现其被动受害处境。
- source_word: τὰς γυναῖκας εἰς προνομὴν
  choice: 让他们的妇女成为战利品
  rationale: γυναῖκες 在此是群体性的“妇女”，不宜收窄为“妻子”；προνομή 属战争掳掠用语，“成为战利品”清楚而不淡化原文。
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: 他们承受为业的各城
  rationale: κληρονομία 含继承之业、产业之意；“承受为业”保留其宗教和民族语境中的分量，又比生硬的“他们产业的城”自然。
- source_word: εἰς ἀφανισμὸν
  choice: 遭到毁灭
  rationale: ἀφανισμός 表示毁坏乃至消灭；“遭到毁灭”与句中其他受害结果形成自然排比。
- source_word: τὰ ἅγια
  choice: 圣物
  rationale: 中性复数指神圣之物，可能包括圣殿器物等；“圣物”保留复数集合意义，不擅自限定为圣所或圣殿。
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμόν
  choice: 遭到亵渎和羞辱
  rationale: βεβήλωσις 是对神圣之物的亵渎，ὀνειδισμός 是羞辱、凌辱；该译兼顾礼仪与荣辱两个层面。
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: 成为列国幸灾乐祸的对象
  rationale: ἐπίχαρμα 指使人怀着敌意欢喜、得意的对象；“幸灾乐祸”准确传达恶意欢庆，而“对象”保留名词性表述。
theological_decisions:
- issue: κληρονομία 在以色列民族与宗教语境中的表达
  choice: 承受为业
  alternative: 产业；所继承的基业
  rationale: “承受为业”保留土地和城邑作为所承之业的意味及其潜在圣约共鸣，但不在正文中添加原文未明说的神学解释。
- issue: τὰ ἅγια 的所指范围
  choice: 圣物
  alternative: 圣所；神圣之物
  rationale: 原文使用中性复数，所指可能较广；译作“圣物”避免将其限定为单一建筑，同时保留礼仪性的神圣含义。
- issue: 祈求中上帝“交付”的施事关系
  choice: 求他不要让……遭到／成为
  alternative: 求他不要把……交给
  rationale: 希腊文 δοῦναι 可直译“交给”，但多个并列结果在汉语中以“不要让”更自然；仍保留祈求上帝不容这些灾祸临到的神学张力，不解释其许可与直接施行之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文连续并列的祈求结构，同时用“遭人抢掠、成为战利品、遭到毁灭、遭到亵渎和羞辱”形成清晰排比。“上帝”按现代普通话圣经语体处理 θεός；不增加宗派性称谓或解释。
