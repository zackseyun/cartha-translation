lexical_decisions:
- source_word: προκατελάβοντο
  choice: 抢先占据
  rationale: 该复合动词表示预先取得或控制；在军事防御语境中，“抢先占据”既传达先发行动，也自然表达对战略地点的控制。
- source_word: πάσας
  choice: 所有
  rationale: 该词表示无一遗漏的整体范围；与复数名词搭配时，“所有”最自然。
- source_word: κορυφὰς
  choice: 峰顶
  rationale: κορυφή指山的顶部或顶峰；“峰顶”准确、清楚，也适合军事地理语境。
- source_word: ὀρέων
  choice: 山
  rationale: ὄρος的通常含义是“山”；此处没有理由弱化为“丘陵”。
- source_word: ὑψηλῶν
  choice: 高
  rationale: 该形容词直接描述山的高度；“高山”是现代汉语中自然凝练的表达。
