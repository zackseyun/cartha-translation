base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: zh_hans
  text: 以色列人照大祭司约雅敬和以色列全体民众的长老会所吩咐的去做了；他们坐在耶路撒冷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为“他们坐在耶路撒冷”。这个复数关系从句可能按意义指长老会的成员，也可能指前面提到的大祭司和长老会等领袖。
    reason: 保留原文末尾复数关系从句的字面措辞及其先行词范围的歧义。
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 这是现代汉语表达该群体称谓最自然、准确的方式；若直译为“以色列的儿子们”，容易被误解为仅指男性或雅各的亲生儿子。
- source_word: ἐποίησαν ... καθὰ
  choice: 就照……所吩咐的做了
  rationale: 合并表达“做”与“照……”，自然传达他们依照命令采取行动。
- source_word: συνέταξεν
  choice: 吩咐
  rationale: 此处指权威性的指示或命令。“吩咐”既保留权威意味，又符合现代叙事语体。
- source_word: Ἰωακεὶμ
  choice: 约雅敬
  rationale: 采用现代中文圣经读者较熟悉的对应音译名，同时依据希腊形式辨认该人名。
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: 大祭司
  rationale: 这是该犹太宗教职分标准而清楚的现代汉语名称。
- source_word: ἡ γερουσία
  choice: 长老会
  rationale: 该词指由长老组成的议事团体；“长老会”比泛称“议会”更能显出其成员性质，也避免“元老院”的特定罗马政治色彩。
- source_word: παντὸς δήμου Ἰσραήλ
  choice: 以色列全体民众的
  rationale: 保留παντός的整体性，并以“民众”表达δῆμος所指的人民共同体。
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: 这长老会设在耶路撒冷
  rationale: ἐκάθηντο字面为“坐着”，用于议事团体时可表达其驻会、设席之处；正文采用自然汉语，同时用脚注保留字面表达及修饰范围的歧义。
theological_decisions:
- issue: 以色列群体称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 原文的“以色列之子”具有群体和盟约身份色彩，但现代汉语“以色列人”最少引起性别或亲子关系误解；此处不涉及改变其民族共同体身份。
- issue: 末尾关系从句的修饰范围
  choice: 解释为描述长老会设在耶路撒冷
  alternative: 也可能笼统描述前述大祭司与长老会等领袖在耶路撒冷就座
  rationale: 复数阳性关系代词οἱ与阴性单数ἡ γερουσία在语法形式上不完全一致，可能按意义指长老会成员，也可能涵盖前述领导者；正文采用最顺畅的集合性理解，脚注保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就照……做了”清楚呈现顺服指令的叙事关系；避免把“坐在耶路撒冷”生硬直译进正文，但以脚注明示原文措辞。
