  text: 以色列的每一个男子都极其恳切地向上帝高声呼求[a]；他们也以极大的恳切谦卑自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极其恳切地”也可译作“以极大的恳切”或“以极大的热切”。这一希腊语短语在下一个分句中再次出现，形成强调。
