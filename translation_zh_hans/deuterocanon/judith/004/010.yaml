lexical_decisions:
- source_word: ἀνεβόησαν
  choice: 高声呼求
  rationale: 该动词表示发出响亮的呼声；在向上帝祷告的语境中，“高声呼求”既保留声音的强度，也自然体现祈求的方向。
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: 以色列的每一个男子
  rationale: 原文采用带有分配意义的单数“每一个男子”，并明确使用表示成年男性的 ἀνήρ；译文保留其性别和分配意味。
- source_word: πρὸς τὸν θεόν
  choice: 向上帝
  rationale: πρός 加宾格在此表示呼求所指向的对象；“向上帝”符合现代汉语祷告语境。
- source_word: ἐν ἐκτενείᾳ μεγάλῃ
  choice: 极其恳切地
  rationale: 该短语表达强烈、持续的专注与热切。“极其恳切地”自然且庄重，并在两个分句中照原文重复，以保留强调效果。
- source_word: ἐταπείνουσαν
  choice: 使……降卑
  rationale: ταπεινόω 的基本意义是使之卑微、降低；“使……降卑”保留主动自我谦卑或克己的意味，不擅自限定为禁食或苦待。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 自己的心灵
  rationale: 原文明确使用 ψυχή 的复数形式。此处可按闪语式表达理解为“自己”，但译作“自己的心灵”既保留原文的人内在生命用语，也避免生硬的“使灵魂降卑”。
theological_decisions:
- issue: πᾶς ἀνὴρ Ἰσραήλ 的性别与分配表达
  choice: 以色列的每一个男子
  alternative: 所有以色列人／以色列众男子
  rationale: 原文使用 ἀνήρ 而非泛指人的词，并用单数分配结构；译文不将其性别中性化，同时以自然汉语呈现“每一个”的含义。
- issue: τὰς ψυχὰς αὐτῶν 是直译为“心灵”还是按习语译为“自己”
  choice: 使自己的心灵降卑
  alternative: 使自己降卑
  rationale: 保留 ψυχή 的明示用语以及经文在人内在生命层面的张力，同时用脚注说明其可作整体自我的习语理解，不据此引入固定的人论体系。
- issue: ἐταπείνουσαν 是否具体译作“苦待”
  choice: 使……降卑
  alternative: 苦待／使……受苦
  rationale: 上下文可能涉及禁食、悔罪或自我克制，但本节动词本身首先表示“使降卑”；不在正文中加入原文未明确说明的具体做法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“高声呼求”体现祷告语境与声音强度；两个分句重复“极其恳切地”，保留原文刻意的平行和强调。分号用于清楚呈现两个紧密相连的动作。
