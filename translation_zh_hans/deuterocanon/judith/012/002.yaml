base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: zh_hans
  text: 友弟德说：“我不吃这些，免得这事成为绊脚石[a]；但我会从随我带来的东西中得到供应。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绊脚石”也可译作“冒犯”或“使人跌倒的缘由”。希腊文 σκάνδαλον 可指使人绊倒、受冒犯或陷入祸患的事物。
    reason: 说明原词的比喻及语义范围，避免将此处的道德和宗教意味限缩为单一解释。
lexical_decisions:
- source_word: Οὐ φάγομαι
  choice: 我不吃
  rationale: 直译将来时所表达的明确拒绝；现代汉语用“不吃”即可自然传达此意，无须生硬地译成“将不吃”。
- source_word: ἐξ αὐτῶν
  choice: 这些东西
  rationale: 代词指上文提供给友弟德的食物；“这些东西”保留指代关系，并不过度补明原文未明说的名词。
- source_word: ἵνα μὴ γένηται σκάνδαλον
  choice: 免得这事成为绊脚石
  rationale: “免得”保留避免某种结果的目的含义；“这事”承接吃所供食物一事，同时“绊脚石”保留 σκάνδαλον 的比喻及其道德、宗教层面的张力。
- source_word: ἀλλʼ
  choice: ；
  rationale: 汉语借分号及前后内容的鲜明对照自然表达转折；不强加可能显得累赘的连接词。
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: 从随我带来的东西中
  rationale: 保留“随同而来”的意象，又以现代汉语自然表明这些东西是友弟德带来的物品或给养。
- source_word: χορηγηθήσεται
  choice: 会……供应
  rationale: 保留将来被动的供应含义；用“我所需的”补足汉语句法，但不限定供应者。
theological_decisions:
- issue: 友弟德所说 σκάνδαλον 的含义
  choice: 绊脚石
  alternative: 冒犯；使人跌倒的缘由；祸患
  rationale: “绊脚石”保留希腊文的比喻，不把友弟德的顾虑仅仅解释为社交上的冒犯，也不武断断定其具体属于礼仪污秽、犯罪或公开丑闻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“友弟德”沿用该书名及人物名在简体中文中的常见译法。句式保持直接引语的简洁力度，并保留末句供应者未明的特点。
