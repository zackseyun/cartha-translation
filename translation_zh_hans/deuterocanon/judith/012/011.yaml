  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: zh_hans
  text: 他对负责管理他一切事务的太监[a]巴哥阿说：“你去劝[b]那位在你那里的希伯来女子来我们这里，和我们一同吃喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太监”在某些语境中也可泛指宫廷官员；这里按希腊文的字面含义翻译。
    reason: lexical_alternative
  - marker: b
    text: “劝”也可译作“说服”或“促请”；原文的意思是要使她答应前来。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαγώᾳ
  choice: 巴哥阿
  rationale: 按希腊文音译人名，并采用现代汉语易读的字形。
- source_word: εὐνούχῳ
  choice: 太监
  rationale: 保留希腊词的字面含义；该词有时也可指宫廷官员，但本节没有足够理由将其弱化为职衔。
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: 总管自己一切事务的
  rationale: ἐφίστημι与ἐπί构成的分词短语表示受委托监管；“总管……一切事务”自然表达其全面管理职责，同时避免把范围只限于财物。
- source_word: Πεισὸν
  choice: 劝
  rationale: 该命令要求巴哥阿设法使她前来；“劝”在现代汉语中自然，并保留劝说、促成而非强迫的意味。
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: 那位希伯来女子
  rationale: γυνή在此指成年女性，并无妻子的含义；“希伯来”直接保留Ἑβραίαν的族群称谓。
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: 在你那里的
  rationale: παρά加与格在此可表示在某人身边、住处或照管之下；采用宽泛直白的表达，不把关系限定为正式监护。
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: 来我们这里
  rationale: 表达劝说的内容或结果；πρός表示朝向、来到说话者一方。
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: 和我们一同吃喝
  rationale: 直接保留两个不定式及共同宴饮的含义，不额外加入“赴宴”等原文未明说的内容。
