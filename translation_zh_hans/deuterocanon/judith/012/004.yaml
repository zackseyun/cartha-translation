base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your servant will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: zh_hans
  text: 友弟德对他说：“我主啊，我指着你的性命起誓[a]，你的婢女不会把我随身的物品[b]用完，直到他借我的手成就他所谋定的事[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你的性命活着”，是起誓用语，意思是“我指着你的性命起誓”或“你既然确实活着”。
    reason: lexical_alternative
  - marker: b
    text: “我随身的物品”原文泛指“与我同在的东西”，很可能指友弟德自备的食物或口粮。
    reason: lexical_alternative
  - marker: c
    text: “成就”和“谋定”的主语在希腊文中没有明说；按上下文，最自然是指上帝借友弟德行事。
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: 我指着你的性命起誓
  rationale: 这是以对方性命起誓的惯用语；如此译法自然清楚，也保留了原文郑重的誓言语气。原文直译为“你的性命活着”。
- source_word: κύριέ μου
  choice: 我主啊
  rationale: 此处是友弟德对敖罗斐乃的尊称，并非称呼上帝；“我主”保留了宫廷场景中的恭敬语体。
- source_word: ἡ δούλη σου
  choice: 你的婢女
  rationale: 这是女性说话者以低下身份自称的敬语。“婢女”既保留 δούλη 所含的从属意味，也符合现代中文叙事中的女性自称。
- source_word: οὐ δαπανήσει
  choice: 不会……用完
  rationale: δαπανάω 有花费、耗尽之意；结合随身物品尤其食物的语境，“用完”最为自然。
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: 随身带来的东西
  rationale: 原文笼统地说“与我同在之物”，并未明说食物或口粮；此译保持所指的开放性，同时使中文通顺。
- source_word: ἐν χειρί μου
  choice: 借我的手
  rationale: 保留原文“借着手”表达工具或代理作用的圣经惯用语，表示事情通过友弟德施行。
- source_word: ἃ ἐβουλεύσατο
  choice: 他所谋定的事
  rationale: βουλεύομαι 表示筹划、定意；“谋定”兼具计划与决意的含义，并符合庄重叙事语体。
theological_decisions:
- issue: ποιήσῃ / ἐβουλεύσατο 的隐含主语
  choice: 正文用“他”而不明说身份
  alternative: 明确译作“上帝”，或采用“所谋定的事借我的手得以成就”的无主句
  rationale: 希腊文动词是第三人称单数，主语未明说；上下文最自然地指向上帝，但正文不补出“上帝”，以保存原文的隐含性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“我主啊”和“你的婢女”体现友弟德对敖罗斐乃表面的恭敬与自谦；“借我的手”保留圣经式代理表达。脚注标记均置于相关正文之后。
