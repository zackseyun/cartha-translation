  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: zh_hans
  text: 她拿过之后，在他面前吃喝她的女奴所预备的东西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβοῦσα
  choice: 拿过来
  rationale: 不定过去时分词表示先于主要动作发生的动作；希腊文未明说宾语，中文用“来”自然承接上下文，而不擅自限定具体所拿之物。
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: 吃喝
  rationale: 两个不定过去时动词并列，简洁表达她吃了也喝了；中文合说“吃喝”自然，并保留两项动作。
- source_word: κατέναντι αὐτοῦ
  choice: 在他面前
  rationale: 表达她处于那男子面前的空间位置，也符合宴席场景。
- source_word: ἃ
  choice: 食物
  rationale: 中性复数关系代词统指她所吃喝的东西；译作“食物”使中文通顺，其中可包含饮食之物。
- source_word: ἡτοίμασεν
  choice: 所预备的
  rationale: 动作发生在吃喝之前；中文关系结构本身足以呈现这一先后关系，无须另加完成标记。
- source_word: ἡ δούλη αὐτῆς
  choice: 她的女奴
  rationale: δούλη是δοῦλος的阴性形式，明确指女性奴隶；“女奴”比“婢女”更直接保留其受奴役身份。
theological_decisions:
- issue: δούλη所表达的社会身份
  choice: 女奴
  alternative: 婢女／女仆
  rationale: 原词明确带有女性奴隶的含义；正文保留这一较强的社会身份用语，不将其弱化为一般雇佣仆役。
- issue: λαβοῦσα的隐含宾语
  choice: 正文不明确补出具体宾语，并加脚注说明
  alternative: 拿起食物／拿了它
  rationale: 希腊文没有明示宾语；保留省略可避免把上下文所指过度限定为某一件物品。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“就在他面前”保持场景感；“女奴”准确而不过度古雅。
