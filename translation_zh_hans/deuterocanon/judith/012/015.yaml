base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female servant came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: zh_hans
  text: 她脱下衣服以后[a]，便穿上衣裳，佩戴各样女性的妆饰，把自己装扮起来。她的女奴[b]走来，把巴哥阿交给她供日常使用的羊皮铺在荷罗斐乃对面的地上，好让她用餐时斜倚在上面[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“换过衣服以后”；更直译可作“分开以后”。这里的希腊语分词较少见，按上下文似乎是指她先脱下原有衣着，再重新装扮。
    reason: lexical_alternative
  - marker: b
    text: “女奴”所译的希腊词是“奴仆”一词的阴性形式；也可译作“婢女”，但原词含有受奴役的身份。
    reason: lexical_alternative
  - marker: c
    text: 古代人用餐时常侧身斜倚，并非像现代人一样坐在桌旁。
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: 脱下原先的衣服以后
  rationale: 该分词用法较少见，字面可表示“分开、离开”；但紧接着描写她以衣裳和妆饰装扮自己，语境最自然地指她先脱去原有衣着。脚注保留其他可能。
- source_word: ἐκοσμήθη
  choice: 把自己装扮起来
  rationale: 该动词不仅表示穿衣，也含整理、妆饰之意；此译体现她有意装扮自己的动作。
- source_word: ἱματισμῷ
  choice: 衣裳
  rationale: 这里是集合用法，指她所穿戴的衣物；“衣裳”自然且符合叙事语体。
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: 各样女性的妆饰
  rationale: κόσμος在这里指装饰、饰物，不宜限缩为珠宝；“妆饰”兼顾饰品与整体装扮。
- source_word: δούλη
  choice: 女奴
  rationale: 希腊词明确为阴性的奴仆身份；译作“女奴”保留其社会身份，不弱化为一般侍女。
- source_word: κώδια
  choice: 羊毛皮
  rationale: 该词指带毛的兽皮或羊毛皮，常可铺垫使用；“羊毛皮”具体而不额外推断其制成褥垫。
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: 供日常起居用
  rationale: δίαιτα可指生活方式、日常安排或起居；这里与每日铺设并斜倚用餐有关，“日常起居”比单指饮食更能保留其范围。
- source_word: κατακλινομένην
  choice: 斜倚
  rationale: 该词反映古代宴饮时侧身倚卧的姿势；“斜倚”既区别于现代坐着用餐，也避免误解为睡卧。
