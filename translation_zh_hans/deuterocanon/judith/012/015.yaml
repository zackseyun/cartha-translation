  rationale: 改以“得到/交给”准确表达从巴哥阿处取得羊皮的关系，并重组定语以消除歧义；以自然的“羊皮”表达κώδια；将用途表述收束为中性的“日常使用”。其余内容和脚注均保留原文的语义范围与不确定性。
