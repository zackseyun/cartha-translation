base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/005.yaml
  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: zh_hans
  text: 何罗斐乃的侍从把她带进帐篷；她一直睡到夜半[a]，然后在晨更时分[b]起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“午夜”。希腊文直译为“直到夜到了中间”。
    reason: lexical_alternative
  - marker: b
    text: “晨更”指古代夜间划分的更次之一，即临近黎明的时段。
    reason: cultural_note
lexical_decisions:
- source_word: θεράποντες
  choice: 侍从
  rationale: 该词指随侍或服侍之人；“侍从”符合军营中将领身边人员的语境，也不额外暗示奴隶身份。
- source_word: σκηνήν
  choice: 帐篷
  rationale: 在军营语境中，σκηνή自然指帐篷；此译法准确、清楚，符合现代汉语。
- source_word: ὕπνωσεν
  choice: 睡
  rationale: 该动词在此直接叙述她睡了一段时间；“睡”简洁自然，不必增译为“入睡”。
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: 一直睡到夜半
  rationale: 原文表达“直到夜到了中间”；“夜半”既贴近希腊文意象，又是自然庄重的现代汉语。“一直”明确呈现μέχρι所表示的持续界限。
- source_word: ἀνέστη
  choice: 起来
  rationale: ἀνίστημι在此指从睡卧状态起身；“起来”比“站起来”更符合上下文，也自然明白。
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: 在晨更时分
  rationale: φυλακή可指夜间的一个更次，ἑωθινή表明这是接近清晨的一更；“晨更时分”保留古代按更次计时的背景，πρός在这里按时间临近或到达来表达。
