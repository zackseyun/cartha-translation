base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/014.yaml
  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: zh_hans
  text: 友弟德对他说[a]：“我算什么人，竟敢顶撞我主呢？凡他看为喜悦的事，我都要赶快去做；这将成为我的欢喜，直到我死的那一天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顶撞我主”也可译作“反对我主”或“反驳我主”。
    reason: 说明ἀντειποῦσα兼有回嘴、反驳和反对的词义范围。
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: 顶撞
  rationale: 该词表示反驳、唱反调或出言抵触；“顶撞”在现代汉语中自然地传达对上位者回嘴或反对的意味，也符合友弟德表面谦顺的社交语境。脚注保留“反对、反驳”的词义范围。
- source_word: τῷ κυρίῳ μου
  choice: 我主
  rationale: 此处指对敖罗斐乃的尊称，并非神圣称号。“我主”保留原文的尊卑和礼仪语气；不译作“主人”，以免过度限定为奴仆关系。
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: 凡他看为喜悦的事
  rationale: 既保留“在他眼中”的希伯来式判断意象，又用现代汉语中自然的“看为”表达其认可和喜悦。
- source_word: σπεύσασα
  choice: 赶快去做
  rationale: 分词可表达迅速或热切从事；“赶快去做”自然传达行动的急切和及时，不额外断定其内在动机。
- source_word: ἀγαλλίαμα
  choice: 欢喜
  rationale: 该名词指强烈的喜乐或欢腾。“欢喜”庄重而易懂，比“狂喜”克制，又较“快乐”更贴近经文语体。
- source_word: ἕως ἡμέρας θανάτου μου
  choice: 直到我死的那一天
  rationale: 直译其时间表达，保留原句的郑重语气，同时符合现代汉语习惯。
theological_decisions:
- issue: κύριος用于非神圣对象的称呼
  choice: 我主
  alternative: 我的主人
  rationale: 这里是友弟德对敖罗斐乃的社会性敬称，不是对上帝的称号。“我主”保留尊称和上下关系，同时不将其明确收窄为所有权式的主仆关系。
- issue: 友弟德话语是真诚顺服还是策略性言辞
  choice: 不在译文中解释其动机
  alternative: 用措辞暗示欺骗或讽刺
  rationale: 原句表层表达恭顺，但叙事情境可能使读者感受到策略性张力；译文保留这种张力，不替文本判定她的内心态度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我算什么人，竟敢……”自然呈现原文反问及谦卑姿态；“他”沿用原文第三人称指称敖罗斐乃。
