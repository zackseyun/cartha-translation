  yaml_path: translation/deuterocanon/judith/012/001.yaml
  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: zh_hans
  text: 他吩咐人把她领进存放他的银器[a]的地方，又命人从他的佳肴中取些摆在她面前[b]，并让她喝他的酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的银制器皿”。原文可泛指各种银制物件；在宴席语境中，也可能特指餐具或盛器。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“用他的佳肴为她摆席”。原文动词含有铺开、摆设之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: 表达上位者发出命令的权威语气，同时符合现代汉语叙事习惯。
- source_word: εἰσαγαγεῖν αὐτὴν
  choice: 把她领进
  rationale: 不定式依附于命令动词，语境表明是由侍从带领友弟德进入。
- source_word: οὗ ἔτιθετο
  choice: 存放……的地方
  rationale: 未完成时在此可表达持续或惯常状态；“存放”比直译“放置”更自然。
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: 他的银器
  rationale: 该复数名词指银制物件；上下文虽可能是餐饮器皿，但原词本身范围较广，译作“银器”较稳妥。
- source_word: συνέταξεν
  choice: 又命人
  rationale: 表示进一步作出权威安排；“又”衔接前一个命令，并避免汉语表达累赘。
- source_word: καταστρῶσαι αὐτῇ
  choice: 为她摆设食物
  rationale: 保留铺陈、摆上供食用之物的动作含义，不将其仅解释为烹制。
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: 从他的佳肴中
  rationale: ὀψοποιήματα指烹制好的菜肴或美食；“佳肴”自然表达其宴席语境。
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: 让她喝他的酒
  rationale: 承接命令内容，清楚表达她要取用他所供应的酒。
