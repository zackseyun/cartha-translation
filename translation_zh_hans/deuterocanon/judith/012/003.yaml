  yaml_path: translation/deuterocanon/judith/012/003.yaml
  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: zh_hans
  text: 荷罗斐尼对她说：“可是，如果你随身带的东西用完了，我们从哪里给你弄来同样的食物[a]呢？我们这里并没有你本族的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”也可译作“给养”或“供应”。这里的希腊词通常意为“力量”或“能力”，但在本句语境中似乎指维持体力所需的食物或给养。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: 用完了
  rationale: 该动词可指耗尽、用尽；这里所说的是友弟德随身携带之物，译作“用完了”自然清楚。
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: 你随身带的东西
  rationale: 贴近原文“与你同在的东西”这一宽泛表达，不提前把所指完全限定为食物。
- source_word: ἐξοίσομεν
  choice: 能……弄来
  rationale: ἐκφέρω 的将来时在此表示为她取得或带来所需之物；“弄来”符合现代汉语对话语境，也保留从别处取得的意味。
- source_word: δύναμιν
  choice: 食物
  rationale: δύναμις 通常意为“力量、能力”，但此处与随身之物耗尽及“同样的”搭配，显然指维持体力的食物或给养；正文采用自然的“食物”，并以脚注说明原词的特殊用法。
- source_word: ὁμοίαν αὐτοῖς
  choice: 同样的
  rationale: 保留与她随身所带之物的比较关系；汉语无需重复宾语即可自然表达。
- source_word: ἐκ τοῦ ἔθνους σου
  choice: 你本族的人
  rationale: ἔθνος 在此指友弟德所属的族群；“本族的人”比现代汉语中的“你国家的人”更准确地传达族属含义。
