base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/008.yaml
  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
translation:
  language: zh_hans
  text: 她上去时，正向以色列的主上帝祈求，求他指引她的道路，使他百姓的众子得以兴起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兴起”也可译作“高升”或“恢复”。希腊语这个名词较少见，可表示被抬起，或地位、境况得到提升。
    reason: 说明罕见词ἀνάστημα的词义范围，保留原文在高升、恢复等含义之间的开放性。
lexical_decisions:
- source_word: ἀνέβη
  choice: 上来
  rationale: 该词通常指向上的移动。结合前文她在泉边洗浴后离开的场景，“上来”自然保留空间方向，不把它误解为抽象的升高。
- source_word: ἐδέετο
  choice: 祈求
  rationale: δέομαι可指恳求、祈求；受词是“以色列的主上帝”，因此这里明确是祷告。“祈求”也能体现未完成过去时所描写的持续动作。
- source_word: κυρίου θεοῦ Ἰσραήλ
  choice: 以色列的主上帝
  rationale: 按希腊语敬称直译，既保留“主”和“上帝”，又采用自然的现代汉语领属结构。
- source_word: κατευθῦναι
  choice: 指引
  rationale: 该动词兼有使道路笔直、引导方向之意。“指引”在祷告语境中自然，也适用于下文既可具体又可比喻理解的“道路”。
- source_word: τὴν ὁδὸν αὐτῆς
  choice: 她的道路
  rationale: 保留ὁδός既指实际路径、也可指行动进程或使命方向的双重可能，不收窄为单纯的行程或计划。
- source_word: εἰς ἀνάστημα
  choice: 使……得以兴起
  rationale: ἀνάστημα是少见名词，基本意象是抬起、升高，也可延伸到地位或境况的恢复。“兴起”保留这种开放性，并能自然表达εἰς所指向的目的或结果。
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: 他百姓的众子
  rationale: 原文明确使用阳性复数υἱῶν（儿子、众子）。译作“众子”保留这一措辞，而不直接泛化成“百姓”或“人民”。
theological_decisions:
- issue: 犹太祷告称谓中κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文本写的是κύριος，并未在本节直接写出神名。“主”既忠于现有文本，也避免擅自把称谓改成特定的神名形式。
- issue: υἱῶν的性别用语
  choice: 众子
  alternative: 子民；儿女
  rationale: “众子”保留希腊文的阳性复数形式；虽然上下文可能广指以色列群体，但正文不将其无标记地中性化。
- issue: ἀνάστημα所表达的拯救或复兴含义
  choice: 兴起
  alternative: 高升；复兴；恢复
  rationale: 上下文涉及犹滴为以色列采取行动，但这个罕见词本身没有精确限定兴起的方式。“兴起”避免把它过早固定为政治高升、军事解救或属灵复兴。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“向……祈求，求他……”略作句法展开，以避免“祈求上帝指引”可能产生的粘连，同时清楚表达祷告对象和祈求内容。脚注标记紧随其实际说明的“兴起”，而非置于前面的“上来”之后。
