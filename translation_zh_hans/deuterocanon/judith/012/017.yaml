  text: And Holofernes said to her, “Do drink, and join us in gladness.”
translation:
  language: zh_hans
  text: 敖罗斐乃对她说：“喝吧，和我们一同欢乐。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίε δὴ
  choice: 喝吧
  rationale: Πίε是πί­νω的不定过去时命令式，δὴ加强劝促语气；“喝吧”在现代汉语中自然地表达邀请兼催促，避免生硬的“务要喝”。
- source_word: γενήθητι μεθʼ ἡμῶν
  choice: 和我们一同
  rationale: γενήθητι本义为“成为、处于”，与μεθʼ ἡμῶν连用时表示进入并参与众人当下的状态；“和我们一同”保留“与我们同在”的关系含义。
- source_word: εἰς εὐφροσύνην
  choice: 欢乐
  rationale: εὐφροσύνη指欢喜、宴饮中的欢乐；这里译为“欢乐”，简洁庄重，也符合宴席语境。
- source_word: Ὀλοφέρνης
  choice: 敖罗斐乃
  rationale: 采用中文圣经传统中较常见的人名音译，便于与《友弟德传》的既有中文称谓衔接。
