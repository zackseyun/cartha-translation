  yaml_path: translation/deuterocanon/judith/012/009.yaml
  text: And when she went in[a], she remained in the tent purified until she brought in her food toward evening.
translation:
  language: zh_hans
  text: 她进去后，便保持洁净，留在帐篷里，直到傍晚才把自己的食物拿来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净”也可理解为“清洁”或“在礼仪上洁净”；希腊语在此既可表达一般的洁净，也可带有礼仪意义。
    reason: 保留 καθαρά 在一般洁净与礼仪洁净之间的词义幅度。
lexical_decisions:
- source_word: εἰσπορευομένη
  choice: 她进去后
  rationale: 现在时中间形态分词在此交代伴随或先行的动作；用时间结构“进去后”符合现代汉语叙事，也保留进入帐篷的基本含义。
- source_word: καθαρά
  choice: 保持洁净
  rationale: 阴性主格形容词与主语一致，并与 παρέμενεν 构成持续状态；“洁净”既可指一般的清洁纯净，也可承载礼仪洁净的语境含义，而不在正文中过度限定。
- source_word: παρέμενεν
  choice: 留在……保持……
  rationale: 未完成时表达一段持续状态；汉语以“留在帐篷里，保持洁净”自然呈现其延续性。
- source_word: τῇ σκηνῇ
  choice: 在帐篷里
  rationale: σκηνή在叙事场景中通常指帐篷；与 παρέμενεν 连用时，汉语以处所短语表达最自然。
- source_word: μέχρι οὗ
  choice: 直到……才
  rationale: 该短语标示持续状态的时间终点；“直到……才”在汉语中清楚表达此前一直持续、至该时点方发生后项动作。
- source_word: προσηνέγκατο τὴν τροφὴν αὐτῆς
  choice: 进食
  rationale: προσφέρω 的中间语态与 τροφή 连用可表示取用食物；此处译作“进食”比机械地译为“把食物带来”更符合搭配和上下文，同时不将 τροφή 限定为某一种餐食。
- source_word: πρὸς ἑσπέραν
  choice: 傍晚时
  rationale: πρός加时间词可指临近该时段；“傍晚时”是自然汉语，保留大致而非精确时点的表达。
theological_decisions:
- issue: καθαρά是否应在正文中明确译为礼仪上的洁净
  choice: 正文译作“洁净”，脚注说明可含礼仪意义
  alternative: 礼仪上洁净；清洁；纯洁
  rationale: 上下文很可能涉及洁净规例，但形容词本身并未明说“礼仪上”；采用较宽的“洁净”可保留一般意义与礼仪意义之间的张力。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“帐篷”通俗明确；“保持洁净”避免生硬的名词化表达。正文脚注标记[a]已与脚注对应。
