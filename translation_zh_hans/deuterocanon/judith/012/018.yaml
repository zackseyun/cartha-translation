  text: And Judith said[a], “I will drink now, my lord, because my life has been magnified within me today beyond all the days since my birth.”
translation:
  language: zh_hans
  text: 友弟德说：“大人，我现在就喝，因为今天，我里面的生命比自我出生以来的任何一天都更为伟大[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为今天，我的生命在我里面被显为伟大，胜过我出生以来的所有日子。”
    reason: 保留ἐμεγαλύνθη的被动表达及其“被使为大／被显为伟大”的修辞，供读者参照。
lexical_decisions:
- source_word: Πίομαι δή
  choice: 我现在就喝
  rationale: Πίομαι是πίνω的将来时中间形式，在此表达友弟德对饮酒邀请的主动回应；δή增添当下性和轻微强调。“我现在就喝”既自然，也保留意愿和即时语气。
- source_word: κύριε
  choice: 大人
  rationale: 这是对敖罗斐乃的尊敬呼语，不是神圣称号。“大人”符合古代上下关系中的礼貌称呼，也避免“主”可能引起的神学联想。
- source_word: ἐμεγαλύνθη
  choice: 更为壮大
  rationale: 该词为μεγαλύνω的不定过去时被动式，基本义是“被增大、被显为大”。“壮大”保留原文关于生命变得宏大或强盛的修辞意象，又比生硬的“被放大”更符合现代汉语。比较意义由后面的“比……任何一天都更”共同表达。
- source_word: τὸ ζῆν μου
  choice: 我的生命
  rationale: 带冠词的不定式字面为“我的活着”。现代汉语用“我的生命”最清楚，同时仍可指生命状态或生存本身。
- source_word: ἐν ἐμοὶ
  choice: 我里面
  rationale: 保留原文的内在方位表达，不将其省略或解释为单纯的情绪感受。
- source_word: παρὰ πάσας τὰς ἡμέρας τῆς γενέσεώς μου
  choice: 比自出生以来的任何一天都
  rationale: παρά加宾格在此表示比较；γένεσις指诞生或出生。该译法以自然汉语明确表达从出生至今的时间范围和比较关系。
theological_decisions:
- issue: “生命被增大”这一陈述的含义
  choice: 保留生命在她里面“壮大”的高昂而略带含混的比喻
  alternative: 今天我比有生以来任何时候都更快乐／更有活力
  rationale: 原文没有明确把这句话限定为快乐、兴旺或主观活力，而是以μεγαλύνω修饰“我的活着”。译文不把这一修辞张力化约成单一心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大人”体现友弟德对敖罗斐乃的恭敬口吻；“我里面的生命……壮大”有意保留希腊文略显非日常的修辞，不改写为纯粹的快乐或兴奋。
