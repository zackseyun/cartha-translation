  - severity: medium
    issue: “魂魄震动”不够符合现代标准汉语，且可能给 ψυχή 加入中国传统“魂魄”二分的含义。
    rationale: 原文只以 ψυχή 指其内在生命；“心灵震动”既保留该层面，也更自然中性。
  - severity: low
