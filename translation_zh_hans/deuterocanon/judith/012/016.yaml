base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: zh_hans
  text: 友弟德进入后，便在席上斜倚而坐[a]。敖罗斐乃因她而心神迷乱；他的心灵震动。他极想与她同寝[b]；自从见到她的那一天起，就一直伺机欺骗她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在席上斜倚而坐”指古代宴饮时倚卧在席位上用餐的习俗。
    reason: cultural_note
  - marker: b
    text: “同寝”在此是指性关系的委婉说法。
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: 进去后
  rationale: 不定过去时分词在此表示先于主要动作发生的动作；译作“进去后”自然地交代先后次序。
- source_word: ἀνέπεσεν
  choice: 斜倚席上
  rationale: 在宴席语境中指按当时习俗斜躺着赴席，并非普通的躺下；补出“席上”以使现代读者明白。
- source_word: ἐξέστη ἡ καρδία Ὀλοφέρνου ἐπʼ αὐτῇ
  choice: 敖罗斐乃因她心神荡漾
  rationale: 该习语描写他因犹滴而失去平常的自持；“心神荡漾”保留强烈迷乱之意，又符合现代汉语表达。
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: 魂魄震动
  rationale: 保留 ψυχή 所表达的内在生命，并以“震动”对应 σαλεύω，避免仅释作一般情绪激动。
- source_word: κατενθύμως σφόδρα
  choice: 极想
  rationale: 表达强烈的内在欲望和意图，简洁而自然。
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: 与她同寝
  rationale: 此处是性关系的委婉说法；“同寝”在中文中含义清楚而不粗俗，并保持原文的含蓄程度。
- source_word: ἐτήρει καιρόν
  choice: 一直伺机
  rationale: 未完成过去时表示持续寻找合适时机；“一直伺机”同时传达持续性与谋划意味。
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: 欺骗她
  rationale: ἀπατάω 的基本意义是欺骗或哄骗；上下文可能涉及以欺骗达成性目的，但正文不把词义窄化为“诱奸”或“勾引”。
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: 从见到她的那一天起
  rationale: 贴近原文的时间表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 性意图的委婉表达
  choice: 与她同寝
  alternative: 与她发生关系；和她在一起
  rationale: 原文以委婉语表达性结合。“同寝”足以传达其性意图，又不比原文更加直露；“在一起”则过于含混。
- issue: ψυχή 的内在人格语言
  choice: 魂魄震动
  alternative: 内心震动；他激动不已
  rationale: 保留原文关于内在生命的措辞及其与“心”的并列关系，不将其完全化约为现代心理描写。
- issue: ἀπατάω 在性剥削语境中的范围
  choice: 欺骗她
  alternative: 诱骗她；勾引她
  rationale: 采用该动词的核心词义，保留欺骗所采取方式及具体目的上的含混，不在正文中替原文作更窄的判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依《友弟德传》常见天主教音译传统作“犹滴”“敖罗斐乃”。正文保留“心”与“魂魄”的平行内在生命语言，并以脚注说明宴席姿势及性委婉语。
