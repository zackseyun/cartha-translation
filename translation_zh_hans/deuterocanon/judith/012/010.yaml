  text: And on the fourth day[a], Holofernes gave a banquet for his servants alone[b], and he did not invite any of those in attendance.
translation:
  language: zh_hans
  text: 第四天，荷罗斐尼只为自己的奴仆[a]设了酒宴；他没有邀请任何负责事务的人[b]赴宴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”所译的希腊词也可译作“仆人”；原词强调他们隶属于荷罗斐尼。
    reason: lexical_alternative
  - marker: b
    text: 原文这一短语也可理解为“当值的人”或“办理公务的人”，确切所指并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: 第四天
  rationale: 这是叙事中常见的时间引入语；简洁译作“第四天”自然地保留了时间信息，无须生硬重现“事情发生了”。
- source_word: ἐποίησεν ... πότον
  choice: 设了酒宴
  rationale: πότος指以饮酒为显著内容的宴席；“设了酒宴”既符合现代汉语，也比泛称“宴会”更贴近原词。
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  choice: 只为自己的奴仆
  rationale: δοῦλος可依语境指奴隶或仆役；“奴仆”保留其从属身份，又适合宫廷侍从语境。μόνοις译作“只”，清楚表达宾客范围受到限制。
- source_word: οὐκ ἐκάλεσεν
  choice: 没有邀请
  rationale: 在设宴语境中，καλέω表示邀请赴席，译作“邀请”最自然。
- source_word: εἰς τὴν χρῆσιν
  choice: 赴宴
  rationale: χρῆσις本义范围包括使用、事务或场合，此处承接酒宴，译作“赴宴”自然表达受邀参与该场合，但不把它解释为某种特定礼仪。
- source_word: οὐδένα τῶν πρὸς ταῖς χρείαις
  choice: 任何负责事务的人
  rationale: 该惯用表达所指身份并不完全明确，大致是办理实际事务或职务的人；“负责事务的人”保留这种宽泛性，避免武断限定为军官或普通侍从。
