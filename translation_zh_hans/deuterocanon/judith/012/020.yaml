base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/020.yaml
  text: And Holofernes was delighted with her[a], and he drank a very great amount of wine—as much as he had never drunk in a single day since he was born.
translation:
  language: zh_hans
  text: 敖罗斐乃因她而欢喜[a]，并喝了极多的酒；自出生以来，他从未在一天之内喝过这么多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“由于她”或“从她而来”；原文表明她是敖罗斐乃欢喜的来源或原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠυφράνθη
  choice: 欢喜
  rationale: 该被动形式表示他因外在对象而变得喜悦；“欢喜”自然庄重，又不过度强化其情绪。
- source_word: ἀπʼ αὐτῆς
  choice: 因她而
  rationale: ἀπό在此表示喜悦的来源或原因；“因她而”保留犹滴是其欢喜缘由或诱因的含义，同时不擅自限定究竟是因她本人、她的陪伴还是她的举动。
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: 喝了极多的酒
  rationale: πολὺν σφόδρα强烈强调酒量之大；“极多”简洁地保留这种加强语气。
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: 是他……从未……喝过的量
  rationale: 保留ὅσον所表达的数量范围，以及οὐκ…πώποτε的“从未”意味，而不改写为更明确但略偏离形式的比较级。
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: 在一天之内
  rationale: 准确表达一次单日时段内的饮酒量，并以现代汉语自然呈现。
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: 自出生以来
  rationale: 清楚表达从出生到当时的整个时间跨度。
