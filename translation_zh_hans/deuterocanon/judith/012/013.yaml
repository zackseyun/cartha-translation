base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: zh_hans
  text: 巴哥亚从敖罗斐乃面前退了出来，进到友弟德那里，对她说：“这位美丽的年轻女子不要迟疑，只管到我主人那里，在他面前得尊荣，与我们一同饮酒欢庆，并在今天成为那些侍立在尼布甲尼撒宫中的亚述女子之一。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου
  choice: 从……面前退了出来
  rationale: 保留离开某人面前的宫廷语感；“退了出来”符合巴哥亚从敖罗斐乃处出来的叙事动作。
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: 进去见友弟德
  rationale: 按字面保留进入的动作，同时用现代汉语的“见”自然表达趋向某人，避免产生性含义。
- source_word: Μὴ ὀκνήσῃς
  choice: 不要迟疑，只管
  rationale: ὀκνέω表示犹豫或退缩；“不要迟疑”准确，“只管”则自然呈现劝诱口吻。
- source_word: ἡ παιδίσκη ἡ καλὴ αὕτη
  choice: 这位美丽的年轻女子
  rationale: παιδίσκη可指少女、婢女或女奴，但此处是奉承性的称呼；译作“年轻女子”既庄重自然，也不无根据地强调奴仆身份。
- source_word: κύριόν μου
  choice: 我主人
  rationale: 此处指人间统帅敖罗斐乃，不是神；“我主人”保留从属关系和宫廷语境。
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: 在他面前得尊荣
  rationale: 被动式表示受到尊崇；此处不是神学意义上的“得荣耀”，故采用宫廷语境中自然的“得尊荣”。
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: 与我们一同饮酒欢庆
  rationale: 传达饮酒所带来的宴乐和欢庆；汉语表达简洁自然，又保留酒宴语境。
- source_word: γενηθήναι ... ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ
  choice: 成为亚述人众女子中的一员
  rationale: 希腊文直译近于“成为亚述众子之女中的一个”；此处意指跻身亚述女子之列，采用自然汉语而不误解为某一人的女儿。
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: 那些侍立在尼布甲尼撒宫中的女子
  rationale: παρίστημι兼有站立在旁和侍候之意；“侍立”同时保留姿态与宫廷侍从含义。
theological_decisions:
- issue: κύριος在世俗宫廷语境中的译法
  choice: 主人
  alternative: 主
  rationale: 说话者所指为敖罗斐乃，且有第一人称属格；“我主人”明确表达社会等级，不会与对上帝的称呼混淆。
- issue: δοξάζω被动式的语义
  choice: 得尊荣
  alternative: 得荣耀
  rationale: 这里描述在统帅面前受到礼遇，采用“尊荣”可保留被尊崇之意，而不把宫廷场景神学化。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事语言。人名依《友弟德传》常见的简体中文传统译名处理；“侍立”保留宫廷色彩。原文中的奉承与劝诱语气通过“这位美丽的年轻女子”“不要迟疑，只管”呈现。
