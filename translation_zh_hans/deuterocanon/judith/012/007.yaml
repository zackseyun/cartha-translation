base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: zh_hans
  text: 敖罗斐乃命令护卫，不得拦阻她。她在军营中住了三天；每天夜里，她都出去，到拜突里雅的峡谷[a]，在军营内的泉水边沐浴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “峡谷”也可译作“山谷”或“沟壑”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“沐浴”的希腊语动词也可指浸入水中或浸洗；后来同一词根也用于“施洗”一词。本节按语境是指清洗身体，不宜理解为后来的基督教洗礼。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: 吩咐
  rationale: 体现上级下令的权威语气，同时符合现代汉语叙事表达。
- source_word: σωματοφύλαξι
  choice: 护卫
  rationale: 该复合词指贴身或人身护卫；“护卫”简洁自然，也保留其军事身份。
- source_word: μὴ διακωλύειν
  choice: 不要拦阻她
  rationale: 准确表达不得妨碍或阻止她行动的意思。
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ
  choice: 在营中住了
  rationale: παρεμβολή在此指军营；“住了”自然表达一段时间内的停留。
- source_word: ἡμέρας τρεῖς
  choice: 三天
  rationale: 按现代汉语习惯直接表达持续时间。
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: 每天夜里，她都出去
  rationale: 未完成过去时结合κατὰ νύκτα可表达三天期间反复发生的夜间行动，因此明示其惯常、重复意味。
- source_word: φάραγγα
  choice: 峡谷
  rationale: 该词可指峡谷、沟壑或狭长山谷；“峡谷”既贴近地貌含义，又不显生硬。
- source_word: Βαιτυλοῦα
  choice: 拜突里雅
  rationale: 采用该地名在中文《友弟德传》传统中较通行的音译形式。
- source_word: ἐβαπτίζετο
  choice: 洗身
  rationale: 在此叙事场景中指以水浸洗或沐浴；“洗身”表达实际动作，又避免误使读者联想到后来的基督教洗礼术语。
- source_word: ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: 在……水泉边
  rationale: 自然表达她在泉水源头或水泉旁洗身；“水泉”保留πηγή作为水源、泉眼的含义。
theological_decisions:
- issue: 如何处理ἐβαπτίζετο可能具有的浸洗含义
  choice: 正文译作“洗身”，脚注说明原词也可表示浸入水中或浸洗
  alternative: 译作“浸洗自己”或“给自己施洗”
  rationale: 上下文描写的是友弟德夜间在水泉边清洗身体，并未明确使用后来基督教礼仪意义上的“洗礼”。正文采用普通动作义，同时以脚注保留原词的语义范围，不引入后期教义含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每天夜里……都”体现希腊语未完成过去时可能包含的重复动作。“营中的水泉边”紧贴ἐν τῇ παρεμβολῇ ἐπὶ τῆς πηγῆς的空间表达，同时保留原文在行动地点衔接上的张力。专名采用中文《友弟德传》中较通行的“敖罗斐乃”和“拜突里雅”。
