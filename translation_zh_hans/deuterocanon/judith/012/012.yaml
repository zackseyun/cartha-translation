base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/012.yaml
  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
translation:
  language: zh_hans
  text: 你们看，若我们让这样的女人就这样走了，连话都不跟她说，这对我们实在丢脸；因为我们若不把她拉拢过来[a]，她就会嘲笑我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把她吸引过来”或“赢得她”。希腊语动词指把某人拉向自己；在这里可能暗含诱引，甚至勾引她的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 你看
  rationale: ἰδού带有提示和强调作用，γάρ承接前文作解释；现代汉语以“你看”自然体现其话语功能，无须生硬译出“因为”。
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  choice: 在我们脸面上实在难看
  rationale: 原文直译近于“对我们的脸面是可耻的”，涉及羞耻与社会颜面；此译保留“脸面”意象，并用“难看”表达丢脸、难堪之意。
- source_word: παρήσομεν
  choice: 让……走了
  rationale: παρίημι在此指任其离去或放过，译为“让……走了”符合现场语境和现代汉语表达。
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  choice: 却没有和她亲近
  rationale: ὁμιλέω可指交谈、交往或亲近；结合上下文的性意味，“亲近”保留含蓄和语义张力，避免仅限于普通说话。
- source_word: ἐπισπάσωμεθα
  choice: 把她勾引过来
  rationale: ἐπισπάομαι基本义为把人拉向自己，在此明显带有吸引、诱引乃至勾引的意味；“勾引过来”切合人物企图，同时脚注保留较中性的可能译法。
- source_word: καταγελάσεται ἡμῶν
  choice: 她就会嘲笑我们
  rationale: καταγελάω表示嘲笑、讥笑；“嘲笑我们”比单纯“笑我们”更清楚传达轻蔑意味。
