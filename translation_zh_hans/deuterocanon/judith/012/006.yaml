base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/006.yaml
  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: zh_hans
  text: 她在晨更将近时起身，派人向霍洛弗尼斯传话说：“请我主下令，准许你的婢女[a]出去祷告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女奴”。希腊文δούλη是阴性形式，按语境可指婢女或女奴。
    reason: 保留原词在谦恭自称与奴隶身份之间的词义幅度。
lexical_decisions:
- source_word: ἀνέστη
  choice: 起来
  rationale: 此处是不定过去时，叙述友弟德在那个时刻起身；“起来”自然、准确，也符合现代汉语叙事。
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: 在晨更将近时
  rationale: φυλακή可指夜间的更次，ἑωθινή限定为临近清晨的更次；“将近”保留πρός所表达的趋近时间含义。
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην
  choice: 派人去见霍洛弗尼斯
  rationale: 希腊文直译为“差遣到霍洛弗尼斯那里”；结合后面的“说”，这里显然是派人传话。汉语补出“人”可自然表达隐含的使者，又不改变事件内容。
- source_word: Ἐπιταξάτω
  choice: 请……下令
  rationale: 不定过去时命令语气要求霍洛弗尼斯发出命令；加“请”体现δή及整句谦恭请求的语用色彩，“下令”保留其权威性。
- source_word: ὁ κύριός μου
  choice: 我主
  rationale: κύριος在此指人间上级霍洛弗尼斯，是恭敬称谓，并非神圣称号；“我主”保留古代宫廷式敬语及人物刻意谦卑的语气。
- source_word: ἐᾶσαι
  choice: 准许
  rationale: 表示命令的内容，即容许她出去；“准许”在现代汉语中清楚而庄重。
- source_word: τὴν δούλην σου
  choice: 你的婢女
  rationale: δούλη是阴性形式，可指女仆或女奴；此处是女性对权势者的谦称。“婢女”既保留女性身份与低下地位，也符合直接引语的古代社会语境；脚注注明更强的奴隶含义。
- source_word: ἐπὶ προσευχὴν
  choice: 祷告
  rationale: 此介词短语表示出去的目的；与ἐξελθεῖν合译为“出去祷告”，比机械译作“为祷告出去”更符合现代汉语。
- source_word: ἐξελθεῖν
  choice: 出去
  rationale: 直接表达从营地或所在处向外行动，简明忠实。
theological_decisions:
- issue: 人间上级称谓κύριος的译法
  choice: 我主
  alternative: 我的主人
  rationale: 所指是霍洛弗尼斯，不是上帝；采用“我主”体现恭敬的社会称谓，但不使用专指神的“大写”或其他神圣化表达。
- issue: 友弟德自称δούλη时应译作服侍者还是奴隶
  choice: 你的婢女
  alternative: 你的女奴
  rationale: 此处主要功能是面对统帅时的谦卑自称，但原词仍可能带有奴隶身份的强烈含义；正文用符合语境的“婢女”，脚注保留“女奴”这一真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“晨更”保留古代夜间分更的时间表达；“霍洛弗尼斯”按希腊文Ὁλοφέρνης作音译。直接引语维持友弟德面对军事统帅时谦恭而审慎的口吻。
