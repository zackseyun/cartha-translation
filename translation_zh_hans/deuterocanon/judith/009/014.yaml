  to: 也求你使你的全体百姓和各个支派得以认识[a]，好叫他们知道：你是具有一切大能和权柄的上帝[b]；除你以外，没有别的护卫者保护以色列民族。
  rationale: 修订避免把ἐπίγνωσις限定为“真正”的认识，并以“得以认识……好叫他们知道”保留该词与后续τοῦ εἰδῆσαι之间相近却不完全相同的表达。将“威权”改为“权柄”，使κράτος在现代庄重汉语中更自然地与δύναμις并列；末句补出“护卫者”，清楚对应ὑπερασπίζων，同时保持原文“除你以外，没有别的”的排他句式。
