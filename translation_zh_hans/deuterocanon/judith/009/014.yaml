base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: zh_hans
  text: 也求你使你的全体百姓和各个支派得以认识[a]，好叫他们知道：你是具有一切大能和权柄的上帝[b]；除你以外，没有别的护卫者保护以色列民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以认识”也可译作“得着充分的认识”或“得以承认”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“一切大能和权柄的上帝。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ... ἐπίγνωσιν
  choice: 使……都真正认识
  rationale: ποίησον以ἐπίγνωσιν为宾语，表达促成认识或确认的意思。汉语用使动结构较自然，也保留了祈求上帝促成此事的语气。
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: 你的全民族和各支派
  rationale: ἔθνος取集体意义，译作“民族”；φυλή指支派，单数配合πᾶς具有逐一涵盖的分配意义，译作“各支派”。
- source_word: ἐπίγνωσιν
  choice: 真正认识
  rationale: ἐπίγνωσις可指认识、确认或充分认识。此处后接τοῦ εἰδῆσαι解释其内容；“真正认识”既与后面的“知道”略作区分，也不把“充分”的程度绝对化。
- source_word: τοῦ εἰδῆσαι
  choice: 让他们知道
  rationale: 带冠词的不定式在这里说明目的或结果；“让他们知道”以自然汉语保留两者之间未完全定死的关系。
- source_word: πάσης δυνάμεως καὶ κράτους
  choice: 一切能力和威权
  rationale: δύναμις与κράτος都属于力量、权能的语义范围。“能力和威权”保留两个并列词：前者偏重能力，后者兼有强力与统御权威之意。
- source_word: ὑπερασπίζων
  choice: 护卫
  rationale: 该分词指为某方抵御、保护或辩护者；本书的危难和拯救语境适合用主动而庄重的“护卫”。
- source_word: τοῦ γένους Ἰσραήλ
  choice: 以色列民族
  rationale: γένος可指族类、血族或民族。“以色列民族”保留其群体和族裔含义，又避免现代汉语中“种族”可能带来的额外联想。
- source_word: εἰ μὴ σύ
  choice: 除你以外，没有别的
  rationale: 保留原文排他而强调的表达，不将其扩展为本节以外的教义陈述。
theological_decisions:
- issue: 上帝是以色列唯一的护卫者
  choice: 除你以外，没有别的能护卫以色列民族
  alternative: 唯有你是以色列民族的护卫者
  rationale: 原文以“没有别的……除非是你”的否定排除句式强调独一性；正文保留这一句式及其神学张力。
- issue: 上帝与一切能力和威权的关系
  choice: 拥有一切能力和威权的上帝
  alternative: 掌管一切能力和威权的上帝
  rationale: 属格短语可表达上帝具有全部能力和威权，但不宜无依据地明确改成“掌管”，因此采用较贴近原文的所属表达。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“也求你”承接上下文的祈求；“全民族和各支派”兼顾整体与分支。“真正认识……知道”保留希腊文ἐπίγνωσις与εἰδῆσαι的相近而不完全相同的表达。
