    rationale: ἐπίγνωσις可表示认识、承认或较充分的认识，但其词义本身并不要求与错误或虚假的认识形成对照。正文宜避免加入“真正”这一限定，可在脚注保留“充分的认识”等可能表达。
  - severity: medium
    issue: “威权”不宜作为κράτος的主要译法。
    rationale: 现代汉语“威权”通常带有政治体制或威势的联想，不能自然表达κράτος此处与δύναμις并列的力量、权柄。以“权柄”对应更稳妥。
  - severity: low
    issue: “你的全民族”及末句省略的“别的［人］”略不自然。
    rationale: “全体百姓和各个支派”更符合现代汉语，同时保留ἔθνος的整体和φυλή的逐一涵盖；补出“护卫者”则明确呈现分词的施事者含义。
