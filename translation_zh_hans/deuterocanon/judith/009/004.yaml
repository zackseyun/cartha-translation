base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: zh_hans
  text: 你使他们的妻子成为掳物，使他们的女儿被掳；又把一切战利品交给你所爱的众子[a]分配。他们也以你的热忱为热忱，憎恶他们血液的污秽[b]，并呼求你帮助。上帝啊，我的上帝啊，求你垂听我这寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“被你所爱的众子”；也可译作“你的爱子们”。
    reason: lexical_alternative
  - marker: b
    text: “他们血液的污秽”也可译作“他们的血污”；原文可指与血有关的礼仪性或道德性玷污，但“血”与“污秽”的确切关系并未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκας αὐτῶν
  choice: 他们的妻子
  rationale: γυνή可指“女人”或“妻子”；有物主成分“他们的”，且与“女儿”并列，在此译作“妻子”最合语境。
- source_word: προνομὴν
  choice: 交给人掳掠
  rationale: 该词指战争中的掳物或掳掠；用动词性表达与“交给”搭配，使现代汉语自然，并保留被当作战利品的严酷含义。
- source_word: αἰχμαλωσίαν
  choice: 交去被俘
  rationale: εἰς αἰχμαλωσίαν表示进入被掳、被俘的处境；译文保留其结果意义。
- source_word: σκῦλα
  choice: 战利品
  rationale: 这是战争中夺得之物的常用词；“战利品”准确而清楚。
- source_word: εἰς διαίρεσιν
  choice: 交给……分配
  rationale: 原文名词强调划分、分派；汉语以动词表达更自然，同时保留分配战利品的意义。
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: 你所爱的众子
  rationale: 保留原文明确的“子”及被上帝所爱的被动关系，不泛化为“子民”。
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: 以你的热忱为热忱
  rationale: 保留ζηλόω与ζῆλος的同源复沓和强调，避免把它简化为一般性的“热心”。
- source_word: ἐβδελύξαντο
  choice: 憎恶
  rationale: 表达强烈的道德及礼仪性厌弃，语体庄重而通俗。
- source_word: μίασμα αἵματος αὐτῶν
  choice: 他们血的污秽
  rationale: 尽量保留μίασμα的污秽、玷污意味以及属格结构的歧义，不擅自断定血与污秽之间的具体关系。
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: 呼求你帮助
  rationale: 自然表达向上帝求助、求援的祷告含义。
- source_word: εἰσάκουσον ἐμοῦ
  choice: 求你垂听我
  rationale: “垂听”是现代汉语中自然、庄重的祷告用语，体现请求得到回应，而不只是听见声音。
- source_word: τῆς χήρας
  choice: 我这寡妇
  rationale: 原文以“这寡妇”同位说明说话者；译作“我这寡妇”既保留自称的修辞姿态，也符合汉语表达。
theological_decisions:
- issue: υἱῶν ἠγαπημένων ὑπὸ σοῦ中的性别明确亲属称谓
  choice: 你所爱的众子
  alternative: 你所爱的儿女／子民
  rationale: 原文明确使用阳性复数“众子”，译文不将其神学化或中性化。
- issue: ἐζήλωσαν τὸν ζῆλόν σου的同源“热忱”表达
  choice: 以你的热忱为热忱
  alternative: 为你大发热心／怀着你的妒忌
  rationale: 保留他们参与上帝之“热忱”的张力，又避免“妒忌”在现代汉语中可能造成的无根据负面限定。
- issue: μίασμα αἵματος αὐτῶν中血与污秽的关系
  choice: 他们血的污秽
  alternative: 他们所流之血造成的污秽／他们受玷污的血统
  rationale: 希腊语属格可容纳不止一种关系；不把它限定为流血罪、礼仪污染或血统受辱中的任何一种。
translation_notes:
  register: 采用现代、庄重而可懂的祷告语体。“交给人掳掠”“交去被俘”直面战争语境，不淡化原文。“上帝啊，我的上帝啊”保留重复呼告；末句用“我这寡妇”呈现犹滴在祷告中的自我定位。脚注标记按其实际解释对象置于“众子”和“污秽”之后。
