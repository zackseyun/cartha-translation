  yaml_path: translation/deuterocanon/judith/009/005.yaml
  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: zh_hans
  text: 因为在它们以前的那些事，是你成就的；那些事、后来的事、现今的事和将要来的事，都是你所筹划的[a][b]；你所筹划的，都成了事实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “筹划”也可译作“思量”或“定意”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文连续列举“在它们以前的那些事”“那些事”“后来的事”“现今的事”和“将要来的事”，强调上帝的筹划涵盖各个时段。
    reason: literary_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: 因为……是你
  rationale: γάρ承接祷告的论证，表示原因；用“因为”保留其因果作用，并以“是你”体现显著的第二人称主语。
- source_word: ἐποίησας
  choice: 成就
  rationale: ποιέω在此可指使某事发生或将其做成；“成就”比“创造”范围更宽，避免加入原文未明确要求的技术性创造含义。
- source_word: τὰ πρότερα ἐκείνων
  choice: 在它们以前的那些事
  rationale: 保留πρότερα与ἐκείνων构成的比较时间关系，也不擅自判定“它们”的具体所指。
- source_word: ἐκεῖνα
  choice: 那些事
  rationale: 直译指示代词，并保留它与前一句“它们”的照应及原文略显压缩的表达。
- source_word: τὰ μετέπειτα
  choice: 后来的事
  rationale: 准确表达其时间上的后续意义，并与现今及将来的事构成并列。
- source_word: τὰ νῦν
  choice: 现今的事
  rationale: 保留νῦν所指的当前时段，同时维持原文时间项目的排列。
- source_word: τὰ ἐπερχόμενα
  choice: 将要来的事
  rationale: 表达正在临近或未来之事，中文自然且不缩窄其范围。
- source_word: διενοήθης
  choice: 筹定
  rationale: διανοέομαι可指思量、意定或谋定；“筹定”兼具深思与定意的意味，适合上下文中计划付诸实现的语义，同时保留词义张力。
- source_word: ἐγενήθησαν
  choice: 实现了
  rationale: γίνομαι在此表示所意定的成为现实；“实现了”自然呈现结果义，不将其限定为创造行为。
- source_word: ἃ ἐνενοήθης
  choice: 你所筹定的
  rationale: 重复“筹定”反映两个相关动词的语义呼应，并清楚指出成为现实的是上帝所意定之事。
theological_decisions:
- issue: 上帝对于过去、现在与未来之事的认识、旨意和主权
  choice: 以“成就”和“筹定”表达上帝跨越各时段的行动与意定，不加入系统神学术语。
  alternative: 可将διενοήθης译为“思量”或“定意”，或将ἐποίησας译为“创造”。
  rationale: 上下文不只描述认知，也说所筹定的成为现实，因此“筹定”适度呈现目的性；但不采用“预定”等可能带有特定教义体系色彩的术语。“成就”则保留ποιέω的广义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留原文密集的时间列举和“它们”指代上的含混；用分号梳理长句结构，不消除原文各时间项目之间的张力。
