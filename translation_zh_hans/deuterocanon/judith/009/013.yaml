base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: zh_hans
  text: 求你使我的话和诡计成为他们的创伤和青肿[a]；他们曾针对你的约、你分别为圣的殿、锡安之巅，以及你众子所持有的家园[b]，图谋残酷之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为他们的创伤和青肿”也可译作“使我的话和诡计给他们造成创伤和青肿”。希腊文十分紧凑，既可侧重犹滴所用的手段，也可侧重敌人所受的结果。
    reason: 保留εἰς所表达的目的或结果之间的语义弹性。
  - marker: b
    text: “你众子所持有的家园”原文含义不易确定，也可能指“你众子的产业”，即上帝子民所得的土地或圣所。
    reason: 说明οἴκου κατασχέσεως υἱῶν σου的语法和所指存在真实歧义。
lexical_decisions:
- source_word: δὸς ... εἰς
  choice: 求你使……成为
  rationale: 这里的命令式与 εἰς 连用，表示祈求上帝使犹滴的话和诡计产生伤害敌人的结果；此译法比孤立地译作“赐下”更符合汉语，也保留目的与结果之间的张力。
- source_word: λόγον μου
  choice: 我的话
  rationale: λόγος 可指话、言语或陈述；“我的话”简洁自然，并未把它过度限定为计划或某一种说辞。
- source_word: ἀπάτην
  choice: 诡计
  rationale: 该词明确表示欺骗、诡诈的手段。“诡计”保留其道德张力，同时在犹滴采取计策的语境中比抽象的“欺骗”更自然。
- source_word: εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: 成为他们的创伤和青肿
  rationale: 保留两个身体受伤的意象；τραῦμα 是伤口或创伤，μώλωψ 是挫伤、青肿。
- source_word: ἐβουλεύσαντο σκληρά
  choice: 曾图谋残酷的事
  rationale: βουλεύομαι 表示谋划，σκληρά 字面为“严酷之事”，在此指残酷、凶狠的行动；“图谋残酷的事”兼顾形式与可读性。
- source_word: διαθήκης σου
  choice: 你的约
  rationale: “约”是现代汉语圣经语体中对 διαθήκη 的自然表达，保留上帝与其子民之关系的神学含义。
- source_word: οἴκου ἡγιασμένου σου
  choice: 你分别为圣的殿
  rationale: ἡγιασμένου 是完成时被动分词，强调这座殿已被分别为圣；“殿”在这里自然指圣所，并避免“房屋”的含混。
- source_word: κορυφῆς Σιὼν
  choice: 锡安之巅
  rationale: κορυφή 指顶峰或至高处；“锡安之巅”保留原文的空间意象和庄重语气。
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: 你众子所拥有的居所
  rationale: κατάσχεσις 涉及占有、持有；原短语结构生硬且意义不确定，此译尽量贴近“你众子所持有的居所”，并以脚注说明也可能指产业或土地。
theological_decisions:
- issue: 犹滴祈求上帝使用她的欺骗手段
  choice: 直译为“我的话和诡计”
  alternative: “我的言辞和计策”或弱化为“谋略”
  rationale: ἀπάτην 明确带有欺骗含义。正文不替原文消解其伦理与神学张力，也不另作辩护或谴责。
- issue: διαθήκη 的圣经神学含义
  choice: 你的约
  alternative: 你的盟约或你的协定
  rationale: “约”既简明，又保留以色列与上帝关系中的专门含义，不把它降为普通协议。
- issue: οἴκου κατασχέσεως υἱῶν σου 的所指
  choice: 你众子所拥有的居所
  alternative: 你众子的产业／你子民所得之地／你众子所持有的殿
  rationale: 希腊短语本身困难，可能指上帝子民所拥有的住处、土地、产业或圣所。正文采取较形式对应的译法，脚注保留其他可能性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“求你”体现祷告语境；“分别为圣的殿”“锡安之巅”保持经文的宗教与诗性语域。句法适度调整为现代汉语次序，但保留原文的并列对象、伤害意象以及关于“诡计”的神学张力。
