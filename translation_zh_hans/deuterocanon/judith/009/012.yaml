base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: zh_hans
  text: 是的，是的！我父亲的上帝，以色列产业的上帝[a]，诸天与大地的主宰[b]，众水的创造者，你所造万有的君王，你，请垂听我的祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列产业的上帝”也可译作“以色列基业的上帝”；原文可指以色列所承受的产业或基业。
    reason: lexical_alternative
  - marker: b
    text: “主宰”所译的希腊词比通常译作“主”的词更强，着重绝对的统属权柄。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: 是的，是的
  rationale: 保留原文重复肯定语的强调和祷告中的感叹语气；不译作“实实在在”，以免带入不属于本处语境的固定表达。
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: 我父亲的上帝
  rationale: 保留 πατρός 的单数形式；全句是直接呼求，中文借整体祷告句式自然呈现其呼格功能。
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: 以色列产业的上帝
  rationale: κληρονομία 可指产业、基业或承受所得之物；“产业”较直接，也保留属格结构，没有把其具体所指解释得过窄。
- source_word: δέσποτα
  choice: 主宰
  rationale: δέσποτης 比通常译作“主”的 κύριος 更突出统属和绝对权柄；“主宰”在现代汉语中庄重自然，又能保留这一区别。
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: 诸天与大地
  rationale: 以“诸天”保留希腊文 οὐρανῶν 的复数，并维持庄重的祷告语体。
- source_word: κτίστα τῶν ὑδάτων
  choice: 众水的创造者
  rationale: “创造者”准确表达 κτίστης；“众水”保留 ὑδάτων 的复数和宇宙性的语境。
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: 统管你一切受造之物的君王
  rationale: κτίσις 可指“创造”或“受造之物”；此处用“一切受造之物”清楚表达君王所统管的对象，同时保留 σου 的所属关系。
- source_word: σὺ εἰσάκουσον
  choice: 你，请垂听
  rationale: 将显明而带强调的代词 σὺ 译出；“垂听”适合向上帝祈求的庄重语境，并包含留心回应恳求的意味。
- source_word: τῆς δεήσεώς μου
  choice: 我的祈求
  rationale: δέησις 特指恳求或祈求；“祈求”比泛称“祷告”更准确，同时通俗自然。
theological_decisions:
- issue: 在对上帝的称呼中如何翻译 δέσποτα
  choice: 主宰
  alternative: 主；至高统治者
  rationale: “主宰”保留 δέσποτα 所强调的统属权和绝对权柄，也避免与通常对应 κύριος 的“主”完全合并。
- issue: κτίσις 在君王称号中的范围
  choice: 一切受造之物
  alternative: 整个创造；一切你所创造的
  rationale: 原词可表示创造整体或受造物；本译文采用集合性的“受造之物”，但不把范围限于人或有生命者，保留宇宙性的含义。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语祷告语体。保留“诸天”“众水”等原文复数意象；用“你，请垂听”体现显明主语的强调，同时避免过度命令式的口吻。
