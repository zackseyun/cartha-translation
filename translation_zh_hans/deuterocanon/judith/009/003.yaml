- from: 你因此把他们的首领交给杀戮，又把他们那受了欺骗、因他们的诡诈而蒙羞的床交给鲜血[a]；你击打仆人，使他们倒在权贵身上，也击打权贵，使他们倒在自己的宝座上[b]。
  to: 为此，你把他们的首领交给杀戮；他们的床——那因他们的诡诈而羞愧的——也受骗而流血[a]。你击打仆人，落在权贵身上；又击打权贵，落在他们的宝座上[b]。
  rationale: 修订将报应性连接词译为“为此”，恢复“床”先羞愧、后受骗流血的原文次序，并避免把单一的“交给”动词不必要地重复为“交给鲜血”。末句不再添加“倒在”的叙事动作，改以“落在……上”维持原文空间表达的开放性；脚注明确说明该处的句法和语义争议。
