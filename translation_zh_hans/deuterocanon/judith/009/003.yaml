  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck servants against princes, and princes upon their thrones.
translation:
  language: zh_hans
  text: 为此，你把他们的首领交给杀戮；他们的床——那因他们的诡诈而羞愧的——也受骗而流血[a]。你击打仆人，落在权贵身上；又击打权贵，落在他们的宝座上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“首领”和“床”之后只出现一次“交给”的动词；“床”被描写为因诡诈而羞愧，又“受骗而流血”。这是含蓄而异常的拟人化表达；末语也可理解为“受骗至于流血”或“被骗入流血之中”。
    reason: 说明省略的动词关系及 ἀπατηθεῖσαν εἰς αἷμα 的语义张力，避免将其限定为“交给鲜血”或某一特定事件。
  - marker: b
    text: 原文直译近于：“你击打仆人，在权贵之上；又击打权贵，在他们的宝座之上。”两个“在……之上”的短语同“击打”的具体关系不够明确；正文保留其空间图景，不断定是仆人攻击权贵，还是被击者倒在其上。
    reason: 交代 ἐπί 短语及其不同格位所造成的简略和歧义，避免把一种解释写成正文事实。
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: 因此
  rationale: 表示因前述恶行而施行相应报应；简洁保留因果与报偿意味。
- source_word: ἄρχοντας
  choice: 首领
  rationale: 指群体中的领袖；与后文较强调权势的 δυνάσται 区分。
- source_word: στρωμνήν
  choice: 床
  rationale: 按原文保留拟人化、转喻性的意象，不径直释作婚床、玷污或女子本人。
- source_word: ἀπάτην
  choice: 诡诈
  rationale: 既可指欺骗行为，也带奸诈意味，符合上下文而不额外解释具体事件。
- source_word: δούλους
  choice: 仆人
  rationale: 在此社会身份对举中采用中性而自然的称呼，避免现代语境中不必要的制度性强化。
- source_word: δυνάσταις / δυνάστας
  choice: 权贵
  rationale: 突出有权势者，与 ἄρχοντας 的“首领”有所区别，并保留两次出现的一致性。
- source_word: ἐπὶ
  choice: 倒在……身上／倒在……上
  rationale: 保留介词的空间图景，同时以中文补足击倒后的结果，使句意可懂。
theological_decisions:
- issue: 神施行暴力审判的表述
  choice: 直译为神把首领交给杀戮并击打各阶层的人
  alternative: 弱化为神容许他们遭遇失败或死亡
  rationale: 原文明确把行动归于第二人称主语，不宜淡化其审判力度。
- issue: “床”所指的解释
  choice: 保留“床”的拟人化与受骗、蒙羞的张力
  alternative: 明确解释为底拿、婚床或性暴行
  rationale: 原文意象异常且存在解释空间，译文不应把某一种释义写进正文。
- issue: ἐπὶ 短语中人物关系
  choice: 理解为被击者倒在权贵身上、权贵倒在宝座上
  alternative: 理解为神使仆人起来攻击权贵
  rationale: ἐπάταξας 的直接宾语首先是“仆人”，后又明确以“权贵”为宾语；空间性译法更贴近句法，但以脚注说明原文简略。
translation_notes:
  register: 采用庄重而现代的祷告叙事语体。保留“床”的陌生化意象和血的审判语言；通过“使他们倒在……”使末句在现代汉语中可理解，同时用脚注呈现希腊文的简略结构与歧义。
