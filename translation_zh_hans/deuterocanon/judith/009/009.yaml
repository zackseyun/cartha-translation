  text: Look upon their arrogance; send your wrath upon their heads; give power to what I have planned by the hand of me[a], a widow.
translation:
  language: zh_hans
  text: 求你察看他们的狂妄，把你的烈怒降在他们头上；求你借我这寡妇的手，赐能力给我所谋划的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你把能力赐在我这寡妇手中，好成就我所谋划的事。”希腊原文末句句法紧凑，“借我这寡妇的手”也可理解为“在我这寡妇手中”；两种理解彼此相近。
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον
  choice: 察看
  rationale: 这是向上帝发出的祈求，意为留意并采取行动；“察看”既贴近原意，也保持祷告语体的庄重。
- source_word: ὑπερηφανίαν
  choice: 狂妄
  rationale: 该词指傲慢、自高和盛气凌人；“狂妄”能在现代汉语中清楚表达其负面道德含义。
- source_word: ἀπόστειλον τὴν ὀργήν σου
  choice: 把你的烈怒降在
  rationale: ἀπόστειλον本义为“差遣、发出”，与ὀργή搭配表示使审判性的怒气临到；“降在”符合自然汉语，并保留神怒临到的意象。
- source_word: εἰς κεφαλὰς αὐτῶν
  choice: 他们头上
  rationale: 保留原文“头”的具体意象，表达惩罚归到他们自身。
- source_word: ὃ διενοήθην
  choice: 所谋划的事
  rationale: διανοέομαι在这里指心中拟定或筹划；“谋划”适合犹滴正在筹备行动的语境，又不额外断定其道德性质。
- source_word: κράτος
  choice: 大有能力
  rationale: κράτος表示力量、权能或效力。结合δὸς与压缩的句法，译为“使……大有能力”，自然表达求上帝赋予所拟行动以成事之力。
- source_word: ἐν χειρί μου τῆς χήρας
  choice: 使我这寡妇亲手
  rationale: ἐν χειρί可表达在手中或借着手施行；“我这寡妇亲手”保留“手”的意象、第一人称强调及寡妇身份，同时形成自然现代汉语。
theological_decisions:
- issue: 末句κράτος、ἐν χειρί μου τῆς χήρας与ὃ διενοήθην之间的句法关系
  choice: 理解为求上帝使犹滴这位寡妇亲手谋划并要施行的事获得成事的能力
  alternative: “求你把能力赐在我这寡妇手中，好成就我所谋划的事。”
  rationale: 希腊语末句高度压缩，ἐν χειρί既可偏向工具义“借我的手”，也可偏向处所或支配义“在我手中”；κράτος也可与所谋之事或她的手更直接相连。正文采用自然且贴近语境的理解，脚注保留另一种紧密相关的构句，避免把歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”在三个祈求中适度重复，以使汉语结构清晰；保留“烈怒”“头上”“亲手”等审判和行动意象。
