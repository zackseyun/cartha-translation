base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: zh_hans
  text: 因为，你的权能不在于人多，你的统治权也不在强者那里；你却是卑微之人的上帝、弱小者的帮助、软弱者的扶持、被人视为无可挽救之人的庇护[a]、绝望之人的救主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陷入绝望之人的庇护”。希腊文也可指被人断定没有希望、已被放弃的人。
    reason: lexical_alternative
  - marker: b
    text: “救主”也可译作“拯救者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: 人多
  rationale: πλῆθος指众多的人或数量；“人多”简洁自然，也不把语境限定为军队人数。
- source_word: κράτος
  choice: 权能
  rationale: κράτος表示力量、权势或施行统治的能力；“权能”既保留力量含义，也适合此处庄重的祷告语体。
- source_word: δυναστεία
  choice: 统治权
  rationale: δυναστεία指统治、主权或掌权的能力；“统治权”明确保留其政治和权柄层面的含义。
- source_word: ἐν ἰσχύουσιν
  choice: 在强者那里
  rationale: 分词实词化，指强壮或有权势的人；“在强者那里”保留希腊文ἐν的表达，不擅自解释为单纯依靠或属于。
- source_word: ταπεινῶν
  choice: 卑微之人
  rationale: ταπεινός可指卑微、低下或受压而降卑的人；此处周围均指处境脆弱者，因此避免译成偏重内在品德的“谦卑者”。
- source_word: ἐλαττόνων
  choice: 弱小者
  rationale: ἐλάττων本义为较小、较低或较弱；“弱小者”在现代汉语中自然，并保留其社会力量较小的语境，未强化为最高级的“最小者”。
- source_word: βοηθός
  choice: 帮助
  rationale: βοηθός指前来援助者；汉语谓语名词链中用“……的帮助”庄重自然，也与后续称谓保持平行。
- source_word: ἀντιλήμπτωρ
  choice: 扶持
  rationale: 该罕见名词含有抓住、托住并支援之意；“扶持”保留托住软弱者的形象，并与下一项“庇护”有所区别。
- source_word: ἀσθενούντων
  choice: 软弱者
  rationale: ἀσθενέω可指软弱、患病或无力；“软弱者”保留宽泛含义，不将语境限缩为疾病。
- source_word: ἀπεγνωσμένων
  choice: 被人视为无可挽救之人
  rationale: 完成时被动形式可指已被判定没有希望、被放弃为无可救药的人，也可能描述陷入绝望者；正文以被动含义与下一项“绝望之人”区分。
- source_word: σκεπαστής
  choice: 庇护
  rationale: σκεπαστής指遮盖、庇护者；“庇护”保留遮蔽保护的意象，并适合“……之人的庇护”这一称谓结构。
- source_word: ἀπηλπισμένων
  choice: 绝望之人
  rationale: ἀπηλπισμένων指失去希望的人；“绝望之人”准确、自然，并与前一词可能具有的被动含义形成区别。
- source_word: σωτήρ
  choice: 救主
  rationale: σωτήρ可指拯救者、救助者；“救主”保留称谓性质和庄重语气，同时以脚注注明较一般的译法。
theological_decisions:
- issue: 是否把一连串关于上帝的谓语称谓扩写成解释性的敬虔表述
  choice: 保留紧凑的称谓链：“你却是……的上帝、……的帮助、……的扶持……”
  alternative: 扩写为“你帮助卑微的人，扶持软弱的人，并拯救绝望的人”
  rationale: 希腊文以一连串谓语名词形成祷告中的礼赞。保留这一结构能维持修辞力度，也避免加入原文没有明说的神学解释。
- issue: ἀπεγνωσμένων与ἀπηλπισμένων两个相近词是否合并处理
  choice: 分别译为“被人视为无可挽救之人”和“绝望之人”
  alternative: 两处都译作“绝望的人”
  rationale: 原文有意连续使用不同词形；前者可有“被判定无望、被放弃”的被动色彩，后者更直接指失去希望。区分译法保留原文的语义张力，但以脚注承认前者也可指陷入绝望。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。分号前保留两句否定式对偶，分号后以连续的“……之人的……”称谓构成礼赞。正文中的[a]、[b]均与对应脚注准确相连。
