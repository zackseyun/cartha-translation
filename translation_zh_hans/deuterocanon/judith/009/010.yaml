  yaml_path: translation/deuterocanon/judith/009/010.yaml
  text: Strike servant against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
translation:
  language: zh_hans
  text: 求你借我嘴唇的诡诈，使奴隶攻击首领，也使首领攻击他的侍从；求你借一个女人的手，粉碎他们的狂傲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的起事”或“他们的狂妄”；这个希腊名词很少见，既可能指他们骄傲自高，也可能指他们起来反抗。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάταξον
  choice: 使……击打
  rationale: 该命令式动词表示施以打击；结合两个身份倒置的结构，用“使……击打”自然表达祈求上帝令双方互相攻击，同时不把结果限定为死亡。
- source_word: δοῦλον
  choice: 奴仆
  rationale: 该词指受奴役、居从属地位的人。“奴仆”保留其与“首领”之间鲜明的社会等级反差，又符合庄重的经文语体。
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: 以我嘴唇的诡诈
  rationale: 贴近原文“从／借我诡诈的嘴唇”这一不寻常表达，并按语境将ἐκ理解为手段；不增补原文没有明说的“话语”。
- source_word: ἐπʼ ἄρχοντι
  choice: 击打首领
  rationale: ἐπί在击打语境中表示攻击所针对的对象；汉语由“击打”的宾语关系自然体现，无须另加“反对”。
- source_word: ἄρχοντα
  choice: 首领
  rationale: 泛指掌权或领头的人；“首领”适合这里的军事政治场景，又不添加“王子”等特定身份。
- source_word: θεράποντι
  choice: 侍从
  rationale: θεράπων常指贴身服侍者或随从。“侍从”既自然，也保留它与δοῦλος“奴仆”的用词区别。
- source_word: θραῦσον
  choice: 粉碎
  rationale: 表达强烈而彻底的破坏，比一般的“打破”更能体现动词力度。
- source_word: τὸ ἀνάστεμα
  choice: 他们的狂傲
  rationale: 此罕见名词可指高抬、傲慢，也可能指起事或兴起。正文依语境采用道德意义明确且自然的“狂傲”，脚注保留另一可能。
- source_word: ἐν χειρὶ θηλείας
  choice: 借一个女人的手
  rationale: 保留“手”所表达的施行媒介，也明确呈现原文特意指出的女性身份。
theological_decisions:
- issue: 祷告中女性作为施行审判的媒介
  choice: 借一个女人的手
  alternative: 借女性之手
  rationale: 原文明示女性施行者，这一点与叙事中强者借出人意料的女性之手被倾覆密切相关，不应中性化。
- issue: 犹滴对诡诈手段的直陈
  choice: 以我嘴唇的诡诈
  alternative: 以我诡诈的嘴唇
  rationale: 保留第一人称对诡诈的明确陈述，不替叙事作伦理辩护或弱化处理；同时维持原短语中“嘴唇”与“诡诈”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奴仆—首领—侍从”保留原文的身份层级和倒置效果；两个“求你”使长句层次清楚。脚注标在其实际解释的“狂傲”之后，而不是置于“诡诈”之后。
