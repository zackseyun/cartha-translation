  yaml_path: translation/deuterocanon/judith/009/006.yaml
  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: zh_hans
  text: 你所谋定的事都已就绪，并且说：“看哪，我们在这里！因为你的一切道路都已预备妥当，你的裁断也在预知之中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的裁断也依照预知而定”，或“你的裁断也在你的预知之中”。希腊语表达凝练，可能表示上帝的裁断处于预知之中，或与预知相符、以预知为依据。
    reason: 保留ἐν προγνώσει在语法关系及神学含义上的真实歧义。
lexical_decisions:
- source_word: παρέστησαν
  choice: 都已就绪
  rationale: 该词为复数，承接“你所谋定的事”，描写这些事已经来到面前、随时可以施行。“都已就绪”既体现临在，也自然传达准备完毕之意。
- source_word: ἃ ἐβουλεύσω
  choice: 你所谋定的事
  rationale: ἐβουλεύσω是第二人称单数，指上帝所筹划、定意的事；原文并非第一人称。“谋定”保留βουλεύω所含的筹划与定意意味。
- source_word: πάρεσμεν
  choice: 我们在这里
  rationale: 这是拟人化的应答，宣告已经在场并可供差遣或施行；直译为“我们在这里”清楚而自然。
- source_word: ὁδοί
  choice: 道路
  rationale: 此处广义指上帝行事的途径与作为；“道路”保留原文意象，也符合庄重的祷告语体。
- source_word: ἕτοιμοι
  choice: 已预备妥当
  rationale: 表达上帝的一切道路已经准备完成、可以实行的状态；“妥当”使现代汉语表达完整自然。
- source_word: κρίσις
  choice: 裁断
  rationale: 此处侧重上帝所作的司法性判断或决定。“裁断”比抽象的“公义”更贴近具体判定，也避免“审判”仅被理解为审判行动或末世事件。
- source_word: πρόγνωσις
  choice: 预知
  rationale: 该词指事先知道。“预知”直接、简洁，并能保留原文与上帝之裁断之间未完全说明的关系。
theological_decisions:
- issue: 上帝的裁断与πρόγνωσις之间的关系
  choice: 你的裁断也在预知之中
  alternative: 你的裁断也依照预知而定；你的裁断也在你的预知之中
  rationale: 希腊语ἐν προγνώσει十分凝练，ἐν可表示范围、依据或关联。正文保留“在……之中”的形式，不擅自断定裁断是以预知为依据，还是存在于上帝的预知之内；脚注列出自然的可能理解。
- issue: ἃ ἐβουλεύσω的人称
  choice: 你所谋定的事
  alternative: 我所谋定的事
  rationale: 希腊语ἐβουλεύσω是第二人称单数，且上下文是向上帝说话，因此按原文译作“你”。英语咨询层的第一人称与希腊文本不符，不予沿用。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“谋定”“裁断”保留经文的严肃感，但避免生僻文言。以拟人化的“我们在这里”重现所谋定之事应声就位的画面。
