base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: zh_hans
  text: 因为看哪，亚述人的势力大增；他们倚仗战马和骑兵而自高，夸耀步兵的力量；他们仰赖[a]盾牌、长矛、弓和投石索，却不知道你是主，是击碎战争的那一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仰赖”也可译作“寄望于”。希腊词兼有盼望和信赖的意思。
    reason: lexical_alternative
  - marker: b
    text: “击碎战争”也可译作“止息战争”。原文直译为“击碎战争”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 因为看哪
  rationale: 兼顾 γάρ 的承接、说明作用和 ἰδού 的强调、引人注意作用，并保留祷告中的庄重语气。
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: 势力大增
  rationale: ἐπληθύνθησαν 表示增多或增强；结合 δυνάμει，以自然汉语表达其军事力量扩张，同时不限定究竟是人数还是战力增长。
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: 倚仗战马和骑兵而自高
  rationale: ὑψώθησαν 保留“抬高、自高”的形象；ἐπί 在语境中指出他们因骑兵力量而高傲。“战马和骑兵”自然呈现成对的军事意象。
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: 夸耀步兵的膂力
  rationale: ἐγαυρίασαν 表示骄傲夸耀；βραχίων 本义为手臂，在此象征力量。“膂力”既保留身体力量的具体意象，也符合庄重文体。
- source_word: ἤλπισαν
  choice: 仰赖
  rationale: 该词可表示盼望或信赖；以兵器为对象时，“仰赖”最符合现代汉语，也保留把信心寄托于武力的含义。
- source_word: γαίσῳ
  choice: 长矛
  rationale: 指矛类武器；“长矛”通俗明确，又不武断限定为标枪或骑枪。
- source_word: σφενδόνῃ
  choice: 投石带
  rationale: 准确指古代甩掷石块的带状武器，避免现代“弹弓”可能引起的器具误解。
- source_word: οὐκ ἔγνωσαν
  choice: 却不知道
  rationale: 自然表达其未曾认识或承认上帝身份的属灵失败；“却”显明他们倚仗武力与不认识主之间的反差。
- source_word: συντρίβων πολέμους
  choice: 击碎战争的那一位
  rationale: 直承 συντρίβω 的强烈、具体意象，不将其平滑处理为单纯“止息战争”；“那一位”体现现在分词对主持续特征的描述。
theological_decisions:
- issue: 如何翻译祷告中指以色列上帝的 Κύριος
  choice: 主
  alternative: 主宰
  rationale: “主”是 κύριος 作为神圣称号的直接、庄重译法；不越过希腊文本擅自引入神名。
- issue: 是否将 συντρίβων πολέμους 意译为“止息战争”
  choice: 是击碎战争的那一位
  alternative: 是止息战争的那一位
  rationale: 原文采用“击碎”这一有力隐喻，描绘上帝摧毁战争及军事权势；正文保留这一神学张力，脚注提供结果性的自然表达。
translation_notes:
  register: 采用现代、庄重而可懂的祷告语体。军事词汇清楚具体；以“自高”“夸耀”“仰赖”形成递进，保留原文对亚述军力自恃的修辞节奏。
