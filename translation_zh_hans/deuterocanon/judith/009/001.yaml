base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: zh_hans
  text: 犹滴俯伏在地[a]，把灰撒在头上，露出她身上所穿的麻衣。就在那时，在耶路撒冷的上帝殿中，正献上那天傍晚的香[b]；犹滴便高声向主呼求：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“面伏于地”。原文具体描写她面伏于地的姿态，表示哀恸、谦卑和恳求。
    reason: lexical_alternative
  - marker: b
    text: 指在耶路撒冷圣所按规定于傍晚献上的香。
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: 俯伏在地
  rationale: 这一习语直指面伏于地的动作，在此表达哀恸、谦卑和恳求；“俯伏在地”自然庄重，并保留具体姿态。
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: 把灰撒在头上
  rationale: 这是哀悼和自卑的礼仪动作；汉语用“把灰撒在头上”比直译“放灰”更自然。
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: 露出她身上所穿的麻衣
  rationale: ἐγύμνωσεν在这里表示使之显露；关系从句说明麻衣原已穿在身上，因此不译成脱去麻衣。
- source_word: ἦν ἄρτι προσφερόμενον
  choice: 就在那时……正献上
  rationale: 兼顾ἄρτι的即时性和迂回式进行被动态，表明献香与犹滴祷告同时发生。
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 耶路撒冷上帝的殿里
  rationale: 原文直译为“上帝的家”，语境明确指耶路撒冷圣所；“上帝的殿”在现代汉语中清楚自然，且不改变所指。
- source_word: τὸ θυμίαμα τῆς ἑσπέρας ἐκείνης
  choice: 那天傍晚的香
  rationale: 保留ἐκείνης所指的“那天”，并将θυμίαμα准确译为礼仪中所献的香，而非一般祭物。
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: 高声……呼求
  rationale: 表达迫切而响亮地向上帝祷告；比逐字译作“以大声音喊叫”更符合现代汉语。
- source_word: πρὸς Κύριον
  choice: 向主
  rationale: πρός表示呼求所朝向的对象；Κύριος在祷告语境中译作“主”。
theological_decisions:
- issue: Κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处所称呼的是上帝，处于敬拜祷告语境；“主”既符合传统神圣称谓，也不加入额外的教派解释。
- issue: οἶκος τοῦ θεοῦ的圣所含义
  choice: 上帝的殿
  alternative: 上帝的家
  rationale: 该短语在这里指耶路撒冷圣所。“殿”明确传达礼仪场所，同时保留“上帝的”这一所有关系。
- issue: 傍晚献香的礼仪背景
  choice: 正文译为“那天傍晚的香”，脚注说明为圣所规定的傍晚献香
  alternative: 直接在正文扩写为“规定在傍晚献上的香”
  rationale: 正文保留希腊文的简洁表达，脚注提供理解礼仪背景所需的信息，避免把解释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句末补出“说”，因为本节希腊文以“向主呼求”引入随后祷告的直接引语；中文需要自然承接下一节。正文保留麻衣是被显露而非被脱去的含义。
