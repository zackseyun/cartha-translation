  to: 她说：“主啊，我祖先西缅的神啊，你把刀交在他手中，使他向外族人报仇[c]。那些人侵犯了处女的子宫，使她受污[a]；裸露她的大腿，使她蒙羞[b]；又亵渎她的子宫，使她受辱。你原说：‘这事不可这样。’他们却这样做了。”
