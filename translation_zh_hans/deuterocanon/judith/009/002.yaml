  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: zh_hans
  text: 她说：“主啊，我祖先西缅的神啊，你把刀交在他手中，使他向外族人报仇[c]。那些人侵犯了处女的子宫，使她受污[a]；裸露她的大腿，使她蒙羞[b]；又亵渎她的子宫，使她受辱。你原说：‘这事不可这样。’他们却这样做了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侵犯了处女的子宫”所译的希腊语字面近于“解开了处女的子宫”，是委婉却明确指向性侵犯的说法。
    reason: lexical_alternative
  - marker: b
    text: “裸露她的大腿”是涉及性羞辱的身体意象，类似圣经其他地方以暴露下体或赤身来描写凌辱。
    reason: cultural_note
  - marker: c
    text: 这里指向《创世记》34章西缅和底拿的事件；本段祷告把西缅的暴力解释为对所受凌辱的报仇。
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 用于向神直接呼告，符合现代汉语祷告语体；不将其特别处理为神名。
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: 我先祖西缅的神
  rationale: πατήρ在族谱和民族先祖语境中可指祖先；“先祖”既表达犹滴与西缅的宗族关系，也避免现代读者误以为西缅是她的亲生父亲。
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: 你把刀交在他手中
  rationale: 保留“交在手中”的具体意象；ῥομφαία在此泛指用于杀伐的刀剑，译作常用而凝练的“刀”。
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: 使他向外族人报仇
  rationale: ἐκδίκησις表达报复或伸冤惩罚，结合西缅事件译作“报仇”；ἀλλογενῶν译作“外族人”，避免采用带有后期技术色彩的“外邦人”。
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  choice: 那些人侵犯了处女的子宫
  rationale: ἔλυσαν μήτραν是委婉却强烈的性侵犯表达；汉语若机械译作“解开子宫”会难以理解，因此以“侵犯”传达实际含义，同时保留“处女的子宫”这一原文意象。
- source_word: εἰς μίασμα
  choice: 使之受污
  rationale: μίασμα兼有道德和礼仪上的污秽意味；“受污”简洁保留这一双重色彩。
- source_word: ἐγύμνωσαν μηρὸν
  choice: 裸露大腿
  rationale: 直译其身体意象，不在正文中将性羞辱的含义完全解释出来。
- source_word: εἰς αἰσχύνην
  choice: 使之蒙羞
  rationale: 表达行为导致羞耻和羞辱的结果，同时保持与前一分句的平行结构。
- source_word: ἐβεβήλωσαν μήτραν
  choice: 亵渎子宫
  rationale: βεβηλόω不只是一般的弄脏，而有把神圣之物当作俗物、加以玷辱的意味；“亵渎”保留这种强度。
- source_word: εἰς ὄνειδος
  choice: 使之受辱
  rationale: ὄνειδος指耻辱、羞辱或责难；“受辱”自然地承接性暴力语境。
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται
  choice: 你原说：‘事情不可这样。’
  rationale: “不可这样”保留希腊语可能呈现的禁止、否定意旨及其与后句之间的张力，不把它单纯改写成预测或伦理评语。γάρ在这里为前文提供依据，汉语用“原”自然衔接。
- source_word: καὶ ἐποίησαν
  choice: 他们却这样做了
  rationale: 原文宾语隐含，由上下文补为“这样”；“却”显出人的行为与神所说之话之间的鲜明反差。
theological_decisions:
- issue: 如何呈现对底拿所受性暴力的委婉描述
  choice: 保留“处女的子宫”“大腿”“亵渎子宫”三重意象，同时将ἔλυσαν意译为“侵犯”以保证汉语可懂。
  alternative: 统一直译成“解开处女的子宫”，或概括为“强奸了处女”。
  rationale: 机械直译在现代汉语中语义不明，而只用“强奸”又会压缩原文层层递进的污秽、羞耻和亵渎修辞。现译兼顾原文形式、明确含义与庄重语体。
- issue: 神所说“Οὐχ οὕτως ἔσται”的语气
  choice: 事情不可这样。
  alternative: 事情绝不会这样；事情不应如此。
  rationale: 原句在形式上可被理解为否定将来之事，也可在上下文中带有神所不许的意味；“不可这样”保留一定张力，避免译文自行判定这是预言还是规范性宣告。
- issue: 西缅暴力行为在祷告中的定位
  choice: 按原文译作神把刀交在西缅手中，使他报仇，不另加赞同或谴责性说明。
  alternative: 弱化为“惩罚”，或在正文中加入对其行为的道德评断。
  rationale: 本节祷告按其自身神学视角解释创世记34章；译文应呈现这一主张，而不替文本消解它与创世记叙事可能产生的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。以分号保留原文三个并列侵犯意象的递进节奏；避免古奥的“外邦”“复仇于”等表达，也不把性暴力修辞软化。
