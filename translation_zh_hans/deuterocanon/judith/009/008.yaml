base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: zh_hans
  text: 你的名是“主”。求你以你的能力击碎他们的力量，在你的烈怒中击垮他们的威势；因为他们图谋亵渎你的圣物[a]，玷污你荣耀之名安息的帐幕，并用铁器击倒你祭坛的角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可包括神圣的场所或整个圣域，不一定只指器物。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用铁”；这里可能以制造兵器的材料代指铁制武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: 你的名是“主”
  rationale: 保留希腊文“主是你的名”这一判断关系，同时调整为自然的现代汉语语序；引号表明“主”在此被明确说成名号。
- source_word: ῥάξον αὐτῶν τὴν ἰσχὺν
  choice: 击碎他们的力量
  rationale: ῥάξον是力度强烈的命令式，“击碎”体现猛烈破坏；ἰσχύς译作“力量”，不把所指限缩为军力。
- source_word: κατάξον τὸ κράτος αὐτῶν
  choice: 摧毁他们的威势
  rationale: κατάξον含击垮、摧毁之意；κράτος与前面的ἰσχύς平行，但侧重强势或威力，因此译作“威势”以保留区别。
- source_word: ἐν τῷ θυμῷ σου
  choice: 在你的烈怒中
  rationale: θυμός在此指强烈的忿怒；“烈怒”符合祷告语境的庄重力度，又不额外加入教义判断。
- source_word: βεβηλῶσαι τὰ ἅγιά σου
  choice: 亵渎你的圣物
  rationale: βεβηλόω指把神圣之物当作凡俗；中性复数τὰ ἅγια可指圣物或圣域，正文采用宽泛而具体的“圣物”，并以脚注保留范围上的歧义。
- source_word: τὸ σκήνωμα τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  choice: 你荣耀之名安息的居所
  rationale: 把σκήνωμα译作“居所”，κατάπαυσις译作“安息”，并将τοῦ ὀνόματος τῆς δόξης σου理解为“你荣耀之名”；既保留神圣居所意象，也避免把σκήνωμα过早限定为某种特定建筑。
- source_word: καταβαλεῖν σιδήρῳ κέρας θυσιαστηρίου σου
  choice: 用铁器砍倒你祭坛的角
  rationale: σιδήρῳ字面为“用铁”，可借指铁制兵器；正文用“铁器”保留原文用词。καταβαλεῖν与祭坛之角搭配，译作“砍倒”体现暴力毁坏和向下击落之意。
theological_decisions:
- issue: 神的“名”与“主”之间的关系
  choice: 直译为“你的名是‘主’”
  alternative: “主啊”或“你名为主”
  rationale: 原文不只是以“主”呼告，而是明确陈述“主”是神的名；正文保留这一不寻常而有神学分量的表达，不将其简化为普通称呼。
- issue: 圣所术语的范围
  choice: 分别保留“圣物”“居所”“祭坛的角”等具体意象
  alternative: 统称为“圣殿”或“圣所”
  rationale: 原文依次提及复数的神圣之物、神名安息的居所和祭坛的角。分别翻译可避免把这些概念压平为单一建筑，并保留敌人所图谋之亵渎的具体性。
- issue: “荣耀之名安息”的神学意象
  choice: 保留为“你荣耀之名安息的居所”
  alternative: 意译为“你荣耀临在的圣所”
  rationale: 原文把“名”“荣耀”“安息”和“居所”并置，关系浓缩且可能具有多重回响；直译其主要结构，避免把“名”直接等同于某套关于神临在的解释。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。祈求部分用“求你”补出汉语祷告中自然的命令语气；整体保留原文强烈的破坏性动词、平行结构和圣所意象。脚注标记已按其实际说明对象重新安放，避免所给英文咨询层中标记与脚注内容错配。
