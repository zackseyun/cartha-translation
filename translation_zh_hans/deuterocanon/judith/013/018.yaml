base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/018.yaml
  text: And Uzziah said to her[a], “Blessed are you, daughter, by the Most High God above all the women on the earth,”
translation:
  language: zh_hans
  text: 乌西雅对她说：“女儿，你蒙至高的上帝赐福，比地上所有的女子更有福。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“女儿，你在至高的上帝面前，比地上所有的女子更有福。”原文在“蒙福”后使用与格，可有不同理解。
    reason: 保留希腊语与格可能表示施予祝福者，也可能表示在上帝面前或按上帝判断的歧义。
lexical_decisions:
- source_word: Εὐλογητὴ
  choice: 你蒙……赐福
  rationale: 这是用于直接称呼的表语形容词，表达宣告受祝福的状态；现代汉语用“蒙……赐福”自然、庄重，也保留祝福语气。
- source_word: θυγάτηρ
  choice: 女儿
  rationale: 保留呼格所表达的亲切而尊重的称呼；原文没有物主成分，因此不译作“我的女儿”。
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: 蒙至高上帝赐福
  rationale: 将与“蒙福”相关的与格理解为上帝施予祝福，但原文与格也可表示在上帝面前或按上帝的判断，故以脚注保留这一歧义。
- source_word: παρὰ πάσας τὰς γυναῖκας
  choice: 胜过……所有的女子
  rationale: παρά加宾格在这里具有比较意义，表示她所得的福超过其他女子，而不只是置身她们之中。
- source_word: τὰς ἐπὶ τῆς γῆς
  choice: 地上
  rationale: 按通常含义指全地上的女子；“地上”简洁自然，并保留原文的广泛范围。
- source_word: Ὀζίας
  choice: 乌西雅
  rationale: 采用现代中文圣经读者较熟悉的对应人名形式。
theological_decisions:
- issue: τῷ θεῷ τῷ ὑψίστῳ与祝福宣告的关系
  choice: 理解为友弟德蒙至高上帝赐福
  alternative: 理解为她在至高上帝面前（或在上帝看来）比众女子更蒙福
  rationale: 上下文是在宣告友弟德蒙福，而不是说她向上帝祝福；不过希腊语与格并未完全限定是施事关系还是评判、关系层面，因此正文采用自然的主要理解，脚注保存另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“胜过……所有的女子”保留原文明确的比较意味；正文避免古奥表达。脚注标记已置于正文相应句末。
