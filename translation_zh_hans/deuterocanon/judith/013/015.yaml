base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/015.yaml
  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: zh_hans
  text: 她走上前来，从袋中把那颗头拿给众人看，对他们说：“看哪，这是亚述军队总司令敖罗斐乃的头；看哪，这是他醉卧其下的帐幔。主借一个女人的手击倒了他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  choice: 走上前来
  rationale: 表达向前走到众人面前的动作，符合现代汉语叙事习惯。
- source_word: πήρας
  choice: 袋
  rationale: 指携带物品的袋子；原文没有限定材质或具体样式，故不作增补。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留两次展示时的强调和宣告语气，同时维持庄重的经文体。
- source_word: ἀρχιστρατήγου δυνάμεως Ἀσσούρ
  choice: 亚述军队总司令
  rationale: ἀρχιστράτηγος表示最高军事统帅，δύναμις在此指军队；Ἀσσούρ按语境译为亚述。
- source_word: κωνώπιον
  choice: 帐幔
  rationale: 该词本指防蚊的帷帐或床帐；此处译作“帐幔”，既符合寝卧场景，也避免无依据地具体化为蚊帐。
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: 醉卧
  rationale: 原短语表示他处于醉酒状态；结合κατέκειτο，以简洁自然的“醉卧”传达。
- source_word: ἐπάταξεν
  choice: 击倒
  rationale: 可指击打、击杀或使之倒下；“击倒”保留动作力度，并由上下文显明其死亡结果。
- source_word: ἐν χειρὶ θηλείας
  choice: 借一个女人的手
  rationale: 这是表示施事媒介的闪语式表达；“借……的手”保留其神学陈述和原文意象。
theological_decisions:
- issue: 主与友弟德行动之间的施事关系
  choice: 主借一个女人的手击倒了他
  alternative: 一个女人亲手击倒了他
  rationale: 原文以“主”为语法主语，并用“借一个女人的手”说明行动媒介；译文保留神的主导行动与人的实际参与之间的张力。
- issue: θηλείας的泛称性质
  choice: 一个女人
  alternative: 这个女人／友弟德
  rationale: 原文使用“女性、女人”的普通名词，而未直称友弟德；保留泛称能维持宣告中对性别反差的强调。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留原文两次ἰδού的公开展示和强调语气；人名采用《思高圣经》常见译名“敖罗斐乃”，地名译作“亚述”。
