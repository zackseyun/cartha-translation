  text: And approaching the bedpost that was at Holofernes’s head[a], she took down his sword from it,
translation:
  language: zh_hans
  text: 她走近敖罗斐乃头边的床柱，从上面取下他的短剑[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
