lexical_decisions:
- source_word: προσελθοῦσα
  choice: 走近
  rationale: 以自然的汉语顺承结构表达不定过去时分词所交代的先行动作，不额外强化为“走近之后”。
- source_word: κανόνι τῆς κλίνης
  choice: 床柱
  rationale: κανών 在床榻语境中指床的结构部件；该物位于头边并可悬放兵器，“床柱”具体而自然。
- source_word: πρὸς κεφαλῆς Ὀλοφέρνου
  choice: 敖罗斐乃头边
  rationale: 保留原文以人物的头部为方位参照的表达，避免改成较宽泛的“床头”。
- source_word: καθεῖλε ... ἀπʼ αὐτοῦ
  choice: 从上面取下
  rationale: καθαιρέω 配合 ἀπό 表示把兵器从所悬放或安置之处取下来；“从上面”自然回指床柱。
- source_word: ἀκινάκην
  choice: 短剑
  rationale: ἀκινάκης 特指东方类型的短剑或匕首；正文用“短剑”兼顾准确性与现代读者的可理解性。
