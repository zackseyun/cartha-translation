base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/004.yaml
  text: And Judith told her female servant to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: zh_hans
  text: 友弟德吩咐她的女奴站在她寝室外，守候她出去[a]，照她每日的惯例；因为她说，她要出去祷告[b]。她又照这些话对巴哥阿说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守候她出去”也可译作“留意她离开”。
    reason: 原文τὴν ἔξοδον αὐτῆς直译为“她的出去／离开”；与ἐπιτηρεῖν连用，表达看守、留意她离开的行动。
  - marker: b
    text: “照她每日的惯例”较直译为“如同逐日”，指她每天出去祷告的惯例。
    reason: 说明καθάπερ καθʼ ἡμέρας的字面形式及其语境意义。
lexical_decisions:
- source_word: δούλῃ
  choice: 女奴
  rationale: 阴性与格单数，既表明性别，也保留其受奴役的身份；不弱化为泛指的“侍女”。
- source_word: στῆναι
  choice: 站在
  rationale: 保留ἵστημι的直接意义；在此也自然表达奉命守候于寝室外。
- source_word: κοιτῶνος
  choice: 寝室
  rationale: 指供睡眠的房间；“寝室”在现代汉语中简洁、庄重，也比“卧房”略贴近原词。
- source_word: ἐπιτηρεῖν
  choice: 留意
  rationale: 表达警醒观察、守候之意，并与后面的“她何时出去”自然搭配。
- source_word: τὴν ἔξοδον αὐτῆς
  choice: 她何时出去
  rationale: 原文直指“她的出去／离开”；结合ἐπιτηρεῖν，汉语以“留意她何时出去”自然表达守候并观察其离开的意思。
- source_word: καθάπερ καθʼ ἡμέρας
  choice: 像往日天天所做的一样
  rationale: 较直译为“如同逐日”；此译保留反复、每日的惯例，同时以自然汉语表明这是先前数日的做法。
- source_word: ἐξελεύσεσθαι
  choice: 要出去
  rationale: 未来中间态不定式受ἔφη支配，构成间接引语；“说自己要出去”符合现代汉语。
- source_word: ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: 出去祷告
  rationale: ἐπί加宾格在此表示目的；避免生硬的“为她的祷告”，同时保留行动目的。
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: 照这些话
  rationale: 保留“按照这些话”的对应关系；不扩展为原文未明说的解释。
