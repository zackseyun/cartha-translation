base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: zh_hans
  text: 犹滴从远处对守卫城门的那些人说：“开门，快开门！因为神——我们的神[a]——与我们同在，还要在以色列中施展力量，以大能对抗我们的仇敌，正如他今天所行的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为“神，我们的神”；“神”重复出现以加强语气。
    reason: 说明原文神名短语的强调性重复，并解释正文的破折号表达。
lexical_decisions:
- source_word: μακρόθεν
  choice: 从远处
  rationale: 准确表达空间上的距离，符合现代汉语习惯。
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: 对守卫各城门的人
  rationale: 以名词性短语表达分词结构；“守卫”体现 φυλάσσω 的看守含义，“各城门”保留希腊文复数。
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: 开门，快开门
  rationale: 保留命令的重复，以“快”传达 δὴ 的催促和强调；“门”按直接宾语的单数处理。
- source_word: μεθʼ ἡμῶν
  choice: 与我们同在
  rationale: 补出汉语所需的谓语，清楚表达神与众人同在。
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: 神——我们的神
  rationale: 保留 θεός 的强调性重复，并用破折号使现代汉语自然流畅。
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: 还要在以色列中施展力量
  rationale: “施展力量”自然表达 ποιεῖν ἰσχύν；“还要”保留 ἔτι 所含的继续或进一步之意。
- source_word: ἰσχὺν
  choice: 力量
  rationale: 保留其“力量、强力”的基本含义，并与 κράτος 的译法稍作区分。
- source_word: κράτος
  choice: 大能
  rationale: 在军事拯救语境中表达实际施行、足以制胜的能力，同时避免误译为政治性的“统治权”。
- source_word: κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: 对抗我们的仇敌
  rationale: 体现 κατά 加属格在此处的敌对含义，不预先断定为已经完全胜过。
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: 正如他今天所行的
  rationale: 保留比较关系和当日已经完成之行动与当前宣告的紧密联系。
theological_decisions:
- issue: 如何表达强调性的神名结构 ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: 神——我们的神
  alternative: 我们的神
  rationale: 希腊文重复 θεός，是强调性的认信表达；保留两个成分既反映原文修辞，也不引入额外神学称号。
- issue: 不定式 ποιῆσαι 与“神与我们同在”的关系
  choice: 译为“还要……施展力量”，使其表达神同在所指向的继续行动
  alternative: 译为“为要……施展力量”，明确处理为目的关系
  rationale: 原文不定式可带目的或预期行动色彩；“还要”既承接 ἔτι，也避免把句法关系限定得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“开门，快开门”保留紧迫的重复命令；正文避免古奥措辞。脚注标记紧随其实际说明的“神——我们的神”之后。
