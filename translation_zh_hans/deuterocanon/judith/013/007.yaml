  text: And she went up to the bed, seized the hair of his head, and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: zh_hans
  text: 她走近床边，抓住他的头发，说：“以色列的上帝啊，求你今日赐我力量。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: 走近
  rationale: 该分词表示靠近、临近；“走近床边”自然表达她向床靠近的动作。
- source_word: κλίνης
  choice: 床边
  rationale: κλίνη在此叙事场景中指床；结合“走近”，译作“床边”符合现代汉语搭配，未改变所指。
- source_word: ἐδράξατο
  choice: 抓住
  rationale: δράσσομαι的中间语态表示牢牢抓取；“抓住”简明有力，符合此处动作。
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: 他的头发
  rationale: 希腊语直指“他头上的头发”；现代汉语用“他的头发”已清楚表达，不必保留显得累赘的重复。
- source_word: Κραταίωσόν με
  choice: 求你……赐我力量
  rationale: 该不定过去时命令式祈求上帝使她刚强；“求你赐我力量”既保留祈求语气，也符合现代汉语祷告表达。
- source_word: ὁ θεὸς Ἰσραήλ
  choice: 以色列的上帝啊
  rationale: 形式上虽为主格，功能上是直接呼语；用“啊”传达庄重而急切的呼求。
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: 今日
  rationale: 该短语特指“在这一天”；“今日”简洁庄重，并保留时间上的具体性。
theological_decisions:
- issue: 友弟德在实施暴力解救行动时向上帝发出的呼求
  choice: 直接译出“以色列的上帝啊，求你今日赐我力量”
  alternative: 以色列的上帝啊，求你在这一天使我刚强
  rationale: 原文仅记载简短而迫切的祷告，并未解释或评判其行动与神意之间的关系；译文保留这一神学张力，不加以淡化或扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。祷告保留简短急切的节奏；“今日”略带庄重色彩，但在当代书面汉语中仍自然。原文无需脚注，正文亦无脚注标记。
