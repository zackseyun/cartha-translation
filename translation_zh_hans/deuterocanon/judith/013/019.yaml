  yaml_path: translation/deuterocanon/judith/013/019.yaml
  text: And blessed is the Lord God[a], who created the heavens and the earth, who directed you to strike the head of the ruler of our enemies.
translation:
  language: zh_hans
  text: 创造诸天和大地的主上帝是应当称颂的！他引导你击伤我们仇敌首领的头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他引导你，使我们仇敌首领的头受创。”希腊文较直译为“他引导你去／为造成我们仇敌首领头部的创伤”；其中介词短语可带方向、目的或结果的意味。
    reason: 保留εἰς τραῦμα κεφαλῆς的名词性表达，以及其方向、目的或结果色彩。
lexical_decisions:
- source_word: εὐλογημένος
  choice: 当受称颂的
  rationale: 这是颂赞公式中的表语形容词；“当受称颂的”既保留礼仪性的颂赞意味，也比单说“有福的”更符合现代汉语对上帝的称颂表达。
- source_word: Κύριος ὁ θεὸς
  choice: 主上帝
  rationale: 保留 κύριος 与 ὁ θεός 的称谓内容，以现代汉语中自然、庄重的组合表达。
- source_word: ἔκτισεν
  choice: 创造
  rationale: 此处指上帝创造诸天和大地；“创造”准确而清楚。
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: 诸天和大地
  rationale: “诸天”保留希腊文 οὐρανούς 的复数形式，“大地”自然对应单数 γῆν。
- source_word: κατεύθυνέν σε
  choice: 他引导你
  rationale: 该动词表示指引、导向某一结果；“引导”保留上帝的主动作用，又不把其强化为强制性的因果。
- source_word: εἰς τραῦμα κεφαλῆς
  choice: 击伤了……的头
  rationale: 希腊文较直译为“进入/为了头部的创伤”。正文采用汉语自然的动词结构表达其目的及结果，脚注保留原文结构上的歧义。
- source_word: ἄρχοντος
  choice: 首领
  rationale: ἄρχων 可指统治者或领袖；在军事语境中，“首领”自然明确，又不引入后来的技术性含义。
- source_word: ἐχθρῶν ἡμῶν
  choice: 我们仇敌
  rationale: 直接、自然地表达希腊文属格关系。
theological_decisions:
- issue: 上帝在友弟德行动中的作用
  choice: 他引导你击伤了我们仇敌首领的头
  alternative: 他引导你，使我们仇敌首领的头受创
  rationale: 希腊文明确把行动的成功归于上帝的引导；译文保留这一神圣主动性，同时不把 κατευθύνω 扩大为比原文更强的决定或强制。
- issue: εἰς τραῦμα κεφαλῆς 的目的与结果关系
  choice: 击伤了……的头
  alternative: 为了……头部的创伤
  rationale: 正文以自然汉语表达在叙事中已经实现的行动结果；脚注说明原文介词短语也可较形式化地理解为方向或目的，避免掩盖其语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当受称颂的”保留颂赞语气；第二分句用自然汉语动词结构呈现行动，并以脚注交代希腊文较生硬而有歧义的名词结构。
