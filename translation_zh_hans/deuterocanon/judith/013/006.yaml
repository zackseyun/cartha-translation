  naturalness: “拥有一切能力的上帝”虽可理解，却不如现代汉语祷告语体中“全能的上帝”自然。其余措辞庄重、清楚。
  terminology: “友弟德”“主啊”“上帝”“耶路撒冷”均恰当。“全能的上帝”在此可自然表达ὁ θεὸς πάσης δυνάμεως，且不增加教义性说明。
