base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: zh_hans
  text: 友弟德站在他的床边，心里说[a]：“主啊，全能的上帝，求你在这时垂看我手所做的事，为高举耶路撒冷[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对自己说。”希腊文直译为“在自己的心里说”，这是表示内在言语或祷告的圣经用语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为耶路撒冷的升高”或“为耶路撒冷得高举”。希腊文表达的是耶路撒冷被抬高或高举。
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα
  choice: 站在
  rationale: 该词是ἵστημι的不定过去主动分词，表示她先来到床边站定，继而在心里祷告；汉语用连贯动作“站在……说”自然地保留这一先后关系。
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: 在他的床边
  rationale: παρά加宾格在此表示位于旁边；κλίνη可指床或卧榻，按本段情境译作“床”最清楚自然。
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: 心里说
  rationale: 直译保留原文以“心”表达内在言语和祷告的圣经意象，同时符合现代汉语用法。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是对上帝的直接呼告；“主啊”准确表达呼格语气，并保持庄重的祷告语域。
- source_word: ὁ θεὸς πάσης δυνάμεως
  choice: 拥有一切能力的上帝
  rationale: πάσης δυνάμεως表示毫无遗漏的能力或权能。“拥有一切能力”比单纯套用“全能”更显明地对应原文的属格短语，也避免把它不加说明地等同于另一固定称号。
- source_word: ἐπίβλεψον
  choice: 求你……眷顾
  rationale: 该命令式不只是请求观看，也可含垂顾、关注之意；祷告中用“求你眷顾”既体现方向性的注视，也自然传达恳求上帝施恩关注。
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: 在这一刻
  rationale: ὥρα在此指当前关键时刻；“这一刻”比机械的“这一小时”更符合现代汉语，同时保留事件的即时性与紧迫感。
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: 我双手所做的事
  rationale: 保留“手”的身体意象及复数形式所表达的行动，同时用现代汉语自然呈现ἔργα的实际含义。
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: 使耶路撒冷得高举
  rationale: εἰς可表达目的或结果，ὕψωμα指升高、高举或崇高地位。“使……得高举”保留向上的比喻，不把它窄化为原文未明说的“得拯救”或“得荣耀”。
theological_decisions:
- issue: 友弟德内在祷告的表达
  choice: 心里说
  alternative: 对自己说
  rationale: 下文直接呼求上帝，显明这是内在的祷告，而不只是自言自语；保留“心”的措辞忠实呈现原文，又不额外引入有关“心”的系统性教义解释。
- issue: εἰς ὕψωμα Ἰερουσαλήμ的含义
  choice: 使耶路撒冷得高举
  alternative: 为拯救耶路撒冷
  rationale: 原文明确使用“升高／高举”的词，却没有直接说“拯救”。正文保留这一隐喻及目的或结果关系，不替读者消除“地位提高、尊荣或复兴”等可能含义。
- issue: ὁ θεὸς πάσης δυνάμεως是否采用固定神学称号
  choice: 拥有一切能力的上帝
  alternative: 全能的上帝
  rationale: 原文是“上帝”加“所有／一切能力”的属格结构。采用展开式译法可忠实反映措辞，又不否认其语义与“全能”高度接近。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊”“求你眷顾”保留敬虔语气，但避免古奥措辞；“我双手所做的事”和“得高举”保留原文的重要身体及空间意象。所有脚注标记均已置于正文相应位置。
