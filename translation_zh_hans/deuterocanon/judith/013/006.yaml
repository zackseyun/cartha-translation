revisions:
- from: 友弟德站在他的床边，心里说[a]：“主啊，拥有一切能力的上帝，求你在这一刻眷顾我双手所做的事，使耶路撒冷得高举[b]。”
  to: 友弟德站在他的床边，心里说[a]：“主啊，全能的上帝，求你在这时垂看我手所做的事，为高举耶路撒冷[b]。”
  rationale: 修订以“垂看”对应ἐπίβλεψον，避免把祈求上帝注视的措辞强化为已含照料意味的“眷顾”；以“为高举耶路撒冷”保留εἰς的目的关系和ὕψωμα的向上隐喻。将称谓调整为自然庄重的“全能的上帝”。脚注a保留内心言语的替代译法；脚注b相应说明目的短语及其升高意象。
