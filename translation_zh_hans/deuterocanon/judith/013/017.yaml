  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: zh_hans
  text: 众人都大为惊叹，俯身敬拜上帝，同心说道：“我们的上帝啊，你是应当称颂的！你今日使你子民的仇敌归于无有。［a］”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστη ... σφόδρα
  choice: 大为惊叹
  rationale: ἐξίστημι在此表示强烈的惊异反应，σφόδρα加以强化；“大为惊叹”自然、庄重，并保留其力度。
- source_word: κύψαντες
  choice: 俯身
  rationale: 该分词描写身体向下弯曲；“俯身”准确表达动作，并与随后的敬拜自然衔接。
- source_word: προσεκύνησαν τῷ θεῷ
  choice: 敬拜上帝
  rationale: 对象是上帝，因此“敬拜”最符合语境；前面的“俯身”已表达其身体姿态。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 该词强调众人意志一致、共同发声；“同心说道”比单纯“共同说道”更能保留这种一致性。
- source_word: Εὐλογητὸς εἶ
  choice: 你当受称颂
  rationale: 这是直接向上帝发出的颂赞，不是第三人称陈述，也不只是愿望；“当受称颂”符合现代汉语中的庄重赞美语体。
- source_word: ἐξουδενώσας
  choice: 使……归于无有
  rationale: 该词可表示视为无物或使之变得无足轻重、归于败亡；在得胜语境中，“使……归于无有”保留了使仇敌彻底失去力量的含义及原词的张力。
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: 今日
  rationale: 这是加强语气的时间表达；“今日”简洁、庄重而自然。
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  choice: 你子民的仇敌
  rationale: 直译其明确的所属关系；“子民”适合圣经语境，又是普通现代读者熟悉的表达。
theological_decisions:
- issue: 众人得胜后向上帝所作回应的句式
  choice: 采用第二人称直接颂赞：“我们的上帝啊，你当受称颂！”
  alternative: 译作第三人称陈述：“我们的上帝是当受称颂的。”
  rationale: 希腊文εἶ是第二人称“你是”，表明众人直接向上帝说话；呼语式汉语保留了这一敬拜场景。
- issue: ἐξουδενώσας所表达的上帝对仇敌的行动
  choice: “使……归于无有”
  alternative: “藐视……／使……无足轻重”
  rationale: 原词既可涉及视为无物，也可在此语境中指使仇敌败亡、失去效力。正文采用符合胜利场景的结果性表达，同时不扩写具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”对应θεός；句式保持集体敬拜的节奏。原文没有必须另列的文本异读或解释性脚注，因此不设脚注标记。
