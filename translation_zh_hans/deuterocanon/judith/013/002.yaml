- source_word: διὰ τὸ ... γεγονέναι
  choice: 因为……持续
  rationale: 带冠词的不定式结构说明众人疲惫的原因；中文用“因为”明确表达因果关系。
- source_word: ἐπὶ πλεῖον
  choice: 过久
  rationale: 该表达可指在程度或时长上超出通常范围；结合饮酒场景，“过久”简洁自然，同时保留过度之意。
- source_word: τὸν πότον
  choice: 酒宴
  rationale: πότος指饮酒，也可指饮酒聚会；此处“酒宴”符合叙事情境且不显生硬，但不应理解为该词本身必然包含进食。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文作解释；调整为中文因果从句，使关系清楚自然。
