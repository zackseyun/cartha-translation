  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: zh_hans
  text: 她用尽全力，朝他的颈项猛击了两下，又砍下了他的头[a]，把他的身体从床榻上滚下去，然后从柱子上取下床帐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“取去（或除去）他的头”；按上下文，是指她砍下了他的头。
    reason: lexical_alternative
  - marker: b
    text: “床帐”所译的希腊词也可指蚊帐。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  choice: 朝他的颈项砍了
  rationale: πατάσσω表示猛力击打；在持刀斩首的叙事情境中译作“砍”自然且准确，同时“朝他的颈项”保留εἰς所表达的动作方向。
- source_word: δὶς ἐν τῇ ἰσχύϊ αὐτῆς
  choice: 用尽全力……两下
  rationale: δὶς直接译为“两下”；ἐν τῇ ἰσχύϊ αὐτῆς表示凭她的力量施行动作，现代汉语以“用尽全力”最能自然传达其强度。
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: 取下他的头
  rationale: ἀφαιρέω的基本义是拿走、除去；“取下”既贴近原词，又能在上下文中清楚表达头已与身体分离，而不把原文换成专门表示斩首的动词。
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: 把他的身体从床榻上滚下去
  rationale: ἀποκυλίω表示使某物滚开或滚下；στρωμνή指床铺或卧榻，“床榻”符合叙事语体。“身体”对应σῶμα，不擅自强化为“尸体”。
- source_word: ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων
  choice: 从柱子上取下帐幔
  rationale: κωνώπιον可指防蚊帐或床上的罩幔；“帐幔”在现代中文中兼顾卧室陈设和悬挂形态，并避免过度限定其用途。στῦλοι译为“柱子”。
theological_decisions:
- issue: 斩首动作的叙事明示程度
  choice: 取下他的头
  alternative: 砍下他的头
  rationale: 原文ἀφεῖλεν本身是较宽泛的“取去、除去”，而上下文已明确表明斩首结果。正文保留这一词义张力，脚注说明其实际所指，不以更专门的中文动词取代原文措辞。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“颈项”“床榻”“帐幔”略具书面色彩，但普通读者容易理解；句法依照希腊文连续动作的推进，同时用“又”“然后”使中文流畅。所有脚注标记均已置于正文相应位置。
