  yaml_path: translation/deuterocanon/judith/013/013.yaml
  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: zh_hans
  text: 众人，不论大小，都一同跑来；因为她来了，这事令他们感到惊异。他们打开城门，迎接她们[a]。他们点起火来照明，围聚在她们周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她们”指友弟德和与她同行的女伴。
    reason: 代词所指在本节单独阅读时可能不够明确；脚注说明其叙事指向，而不在正文中扩写。
lexical_decisions:
- source_word: συνέδραμον
  choice: 跑来聚集
  rationale: 该复合动词兼有从各处奔来和会合之意；“跑来聚集”既保留匆忙的动态，也表达众人汇合。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: 他们中无论大小
  rationale: 这是涵盖全体的两极表达，可能涉及年龄或地位；“无论大小”保留其概括性，不把含义限定为“老少”或社会等级。
- source_word: παράδοξον
  choice: 出人意料
  rationale: 该词表示不合通常预期、令人惊异；“出人意料”自然地表达意外与惊奇，同时避免“奇怪”可能带出的负面意味。
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: 她来到这里
  rationale: 带冠词的不定式短语说明众人惊异的缘由或内容；译作“她来到这里”保留“来”的基本意义，不擅自增添“回来”或“平安归来”。
- source_word: ἀπεδέξαντο
  choice: 迎接
  rationale: 该动词指欣然接纳；结合开门的场景，“迎接”比中性的“接纳”更自然。
- source_word: ἅψαντες πῦρ
  choice: 点起火来
  rationale: 分词表示先于围聚发生的动作；“点起火来”清楚呈现动作次序，也符合叙事语体。
- source_word: εἰς φάσιν
  choice: 照明
  rationale: 介词短语说明点火的用途，即提供亮光；“照明”简洁明确，不将火解释为信号或烽火。
- source_word: περιεκύκλωσαν
  choice: 围聚在……身旁
  rationale: 该动词本义为环绕；“围聚”保留空间上的环绕，又避免“包围”在欢迎场景中容易产生的敌对色彩。
- source_word: αὐτάς
  choice: 她们
  rationale: 阴性复数代词指友弟德及与她同行的女伴；正文保留代词，并以脚注说明所指。
