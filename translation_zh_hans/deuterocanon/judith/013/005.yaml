  text: And they all went away from his presence[a], and no one was left in the bedroom, from the least to the greatest.
translation:
  language: zh_hans
  text: 众人都从他面前离开了[a]；寝室里从小到大，一个人也没有留下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“从面前”；“他”是根据上下文补出的。
    reason: 说明原文省略所属对象，并保留其字面表达。
  - marker: b
    text: “从小到大”也可理解为“从卑微的到尊贵的”，意即无一例外。
    reason: 保留 μικροῦ 与 μεγάλου 可能涉及年龄、地位或概括全体的语义张力。
lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: 退去了
  rationale: 表达离开现场的完成动作；“退去”在叙事中自然庄重，也与“从他面前”搭配顺畅。
- source_word: ἐκ προσώπου
  choice: 从他面前
  rationale: 贴近希腊语“从面前”的表达，同时按上下文补出所属者“他”；既传达离开其跟前，也保留原文较具形象性的说法。
- source_word: οὐδεὶς κατελείφθη
  choice: 一个人也没有留下
  rationale: 准确体现被动式所表达的结果，即室内无人留存；现代汉语清楚自然。
- source_word: ἐν τῷ κοιτῶνι
  choice: 寝室里
  rationale: κοιτών指供睡眠使用的私人房间；“寝室”比“卧房”略显庄重，又不至于古奥。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: 从小到大
  rationale: 保留原文由“小”至“大”的概括性两极表达，不武断限定为年龄或身份；脚注说明其可能含义及“无一例外”的功能。
