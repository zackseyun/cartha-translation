  text: And when she came near to the bed, she seized the hair of his head and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: zh_hans
  text: 她走近床边，抓住他头上的头发，说：“以色列的上帝啊，求你今日使我刚强。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: 她走近
  rationale: 不定过去时分词表示先行或伴随动作；译为“走近”自然呈现她靠近床边的动作次序。
- source_word: κλίνη
  choice: 床边
  rationale: κλίνη可指床或卧榻；叙事场景中译为“床”最清楚，与“走近”组合成自然的“走近床边”。
- source_word: ἐδράξατο
  choice: 抓住
  rationale: 该动词表示用力抓取、握住；“抓住”既体现动作的果断，也符合现代汉语表达。
- source_word: κόμη / κεφαλή
  choice: 他头上的头发
  rationale: 原文以属格结构明确指他头部的头发；这一译法保留其具体所指，同时避免文言化。
- source_word: Κραταίωσόν με
  choice: 求你……使我刚强
  rationale: 命令式在祷告中表达恳求。“使我刚强”直接反映使之强壮、得力的含义；加“求你”符合现代汉语祈求语气，不增添实质内容。
- source_word: ὁ θεὸς Ἰσραήλ
  choice: 以色列的上帝啊
  rationale: 原文在此具有直接呼告功能；“啊”自然传达呼格祷告语气。
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: 今日
  rationale: 这是时间短语，意为“在这一天”；“今日”简洁、庄重，并保留祷告当下的紧迫感。
theological_decisions:
- issue: 祷告中的神圣称呼
  choice: 以色列的上帝啊
  alternative: 以色列的上帝
  rationale: 希腊文虽采用带冠词的形式，但句法上是直接呼告；句末“啊”明确呈现祷告呼语，不改变神学内容。
- issue: 祈求得力的表达
  choice: 求你今日使我刚强
  alternative: 求你今日赐我力量
  rationale: κραταιόω的宾语是“我”，核心意思是使说话者变得强健有力；“使我刚强”较贴近其使役结构，也不限定力量以何种方式临到。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祷告语言。保留原文简短有力的动作次序，并以引号区分直接祷告。无需脚注。
