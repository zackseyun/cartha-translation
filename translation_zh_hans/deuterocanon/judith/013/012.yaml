  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: zh_hans
  text: 她城里的男人听见她的声音，就急忙下到本城城门口，召集了城里的长老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: ……听见……，就……
  rationale: 这是推进叙事并引出随后事件的时间结构。汉语用“……就……”自然表达时间上的紧接，无须直译“事情发生了”。
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: 城里的人
  rationale: ἄνδρες在形式上是阳性复数，但在此叙事场景中可指城中的人众；现代汉语“城里的人”自然、清楚，且不额外限定只有成年男子。αὐτῆς所指的正是友弟德所在、所属的城，中文语境已可明确，无须生硬重复“她的城”。
- source_word: τὴν φωνὴν αὐτῆς
  choice: 她的声音
  rationale: 忠实保留φωνή的直接含义，同时让代词清楚指向友弟德。
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: 急忙下到
  rationale: ἐσπούδασαν表达迅速、迫切的行动，καταβῆναι含向下移动之意；合译为“急忙下到”既保留方向，也符合现代汉语叙事。
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: 自己的城门那里
  rationale: πύλη指城门；αὐτῶν指这些城中人所属的城。用“自己的城门那里”保留所属关系，并以“那里”使“下到”的落点自然。
- source_word: συνεκάλεσαν
  choice: 召集了
  rationale: 该复合动词表示把众人召来聚集。“召集”简洁准确，并保留主动召聚的含义。
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: 城里的长老
  rationale: πρεσβύτεροι在此指城邑中承担领导职分的长老。“城里的长老”既贴近原文，也为普通读者所理解。
theological_decisions:
- issue: ἄνδρες是否必须明确译作“男人”
  choice: 城里的人
  alternative: 她城里的男人
  rationale: 虽然ἄνδρες为阳性复数，且可特指男子，但它也可在群体语境中指人或居民。此处上下文重在听见声音后采取行动的城中人，并未借性别形成神学论点；译作“城里的人”保留其可能的群体性用法，不作不必要的性别收窄。
translation_notes:
  register: 采用现代、庄重而流畅的叙事语体；句式紧凑，保留原文动作顺序：听见、急忙下去、召集长老。
