base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: zh_hans
  text: 愿神使这一切成为你永远的尊荣，并以美善眷顾你；因为我们民族受辱，你没有顾惜自己的性命，反而为我们的败亡挺身而出[a]，在我们的神面前走正直的路。全体民众都说：“愿如此，愿如此[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我们的败亡挺身而出”所译的希腊语结构含义较难确定；也可理解为“因我们的败亡而出去”或“为应对我们的败亡而出去”。
    reason: 保留ἐπεξῆλθες与πτώματι ἡμῶν之间与格关系的歧义，避免把原文未明说的“抗击”或“复仇”加入正文。
  - marker: b
    text: 或译：“阿们，阿们。”希腊文直译为“愿如此，愿如此”。
    reason: 说明Γένοιτο, γένοιτο兼具字面祈愿和会众礼仪回应的意味。
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: 愿神使这一切成为你永远的尊荣
  rationale: 保留祈愿语气和αὐτά的复数指代；将“永远的高处”这一意象按语境译为“永远的尊荣”，表达犹滴的事迹使她长久受尊崇。
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: 以美福眷顾你
  rationale: ἐπισκέπτομαι兼有探访、看顾、眷顾之意；“以美福眷顾”既保留神主动临到并施恩的意味，也不把“美善之物”过度具体化。
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: 你没有顾惜自己的性命
  rationale: ψυχή在此指处于死亡危险中的生命；现代汉语“顾惜自己的性命”自然表达她甘冒生命危险。
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: 因为我们民族受辱
  rationale: ταπείνωσις可指降卑、屈辱或苦难；此处既有受压迫也有蒙羞的语境。“民族”对应集体性的γένος，避免现代汉语中“种族”可能带来的额外含义。
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  choice: 挺身抗击我们的败亡
  rationale: ἐπεξέρχομαι可表示出击、追击或针对某事采取行动，πτῶμα可指跌倒、败落或毁灭。此译保留她针对百姓败亡局面采取行动的方向感，同时以脚注说明该难解结构的其他可能理解。
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα ἐνώπιον τοῦ θεοῦ ἡμῶν
  choice: 在我们的神面前走正直的路
  rationale: 保留“行走”与“直路”的具体路径意象，也自然传达行为正直、蒙神认可的道德含义。
- source_word: Γένοιτο, γένοιτο
  choice: 愿如此，愿如此
  rationale: Γένοιτο字面是表达祈愿和赞同的“愿如此”；保留重复以体现全体民众郑重的共同回应，并在脚注列出礼仪性译法“阿们”。
theological_decisions:
- issue: 全体民众对祝福的回应Γένοιτο, γένοιτο
  choice: 愿如此，愿如此
  alternative: 阿们，阿们
  rationale: 直译保留希腊文的祈愿语气；“阿们”能准确传达会众礼仪性的认同，但会把希腊词改用闪语礼仪词，因此列入脚注。
- issue: 犹滴行动与“我们的败亡”之间的关系
  choice: 挺身抗击我们的败亡
  alternative: 为我们的败亡挺身而出／为我们的败亡复仇
  rationale: 原文中ἐπεξέρχομαι与间接格πτώματι的关系较难确定，可能表示针对败亡局面出击，也可能含回应或复仇意味；正文不将其收窄为明确的“复仇”。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“美福”“眷顾”“顾惜性命”等词略具经文语体，但普通读者容易理解；句法避免仿古，也保留祝福、行动与会众回应的层次。
