  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
translation:
  language: zh_hans
  text: 但帐篷里只剩下友弟德一人；敖罗斐乃已经仆倒在自己的床上[a]，因为酒已使他醉得不省人事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆倒”也可译作“向前倒在”。希腊文的完成时分词描写他先前倒下、当时仍处于倒卧的状态。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近似“酒已倾倒在他身上（或周围）”。这是一种形象表达，指酒使他完全醉倒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη
  choice: 只剩下
  rationale: 该词是ὑπολείπω的不定过去时被动式，表示其他人离开后，友弟德独自留在帐篷中；“只剩下”在现代汉语中自然，并与μόνη共同突出她独处的情形。
- source_word: μόνη
  choice: 一人
  rationale: 与“只剩下”搭配，清楚表达友弟德独自一人在场，同时避免生硬重复“独自留下”。
- source_word: σκηνῇ
  choice: 帐篷里
  rationale: 军事营地语境中的σκηνή指帐篷；“帐篷”准确、通俗，不作过度华饰。
- source_word: προπεπτωκὼς
  choice: 已经扑倒
  rationale: προπίπτω的完成时分词兼有先前倒下和仍处于该状态之意；“已经扑倒”保留向前倒下的形象，也符合醉酒后的场景。
- source_word: κλίνην
  choice: 床上
  rationale: κλίνη可指床或卧榻；此处“床”是最清楚自然的现代汉语表达。
- source_word: περικεχυμένος
  choice: 压倒了
  rationale: 字面涉及“倾倒、浇在周围”，但此处以酒为主语，按语境是酒使人完全不支；“酒力压倒了他”既保留酒的主动形象，又传达醉酒制伏他的惯用含义。
- source_word: ὁ οἶνος
  choice: 酒力
  rationale: 希腊文以“酒”为主语；汉语用“酒力”可自然保留这一句法和拟人化效果，指他所饮之酒产生的作用。
