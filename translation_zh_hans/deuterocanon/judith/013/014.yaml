  yaml_path: translation/deuterocanon/judith/013/014.yaml
  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: zh_hans
  text: 她大声对他们说：“赞美上帝，赞美他！赞美上帝！他没有从以色列家收回自己的怜悯，反而就在今夜借我的手击溃了我们的仇敌。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε τὸν θεόν, αἰνεῖτε
  choice: 赞美上帝，赞美他
  rationale: 保留原文命令式的重复与呼告力度；第二个未明说宾语的“赞美”按汉语自然表达补出“他”，其指代清楚。
- source_word: οὐκ ἀπέστησεν τὸ ἔλεος αὐτοῦ
  choice: 没有……收回自己的怜悯
  rationale: ἀφίστημι在此表示使某物离开、撤去；“收回”准确传达上帝并未使其怜悯离开以色列家的意思。
- source_word: ἀπὸ τοῦ οἴκου Ἰσραήλ
  choice: 从以色列家
  rationale: 保留圣经中的集体称谓“以色列家”，不缩减为地理或政治意义上的“以色列”。
- source_word: ἔθραυσε τοὺς ἐχθροὺς ἡμῶν
  choice: 击溃了我们的仇敌
  rationale: θραύω字面含打碎、粉碎之意；用于敌人时，“击溃”既自然又保留彻底挫败的力度。
- source_word: διὰ χειρός μου
  choice: 借我的手
  rationale: 保留原文工具性表达，表明行动归于上帝，同时友第德是施行行动的媒介。
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: 在今夜
  rationale: 明确保留介词ἐν的时间范围意义和指示词ταύτῃ；“在今夜”庄重且贴近原文。
theological_decisions:
- issue: 上帝的行动与友第德的能动性
  choice: 他……借我的手击溃了我们的仇敌
  alternative: 我靠着他击溃了我们的仇敌
  rationale: 原文以“上帝”为ἔθραυσε的主语，并以διὰ χειρός μου表达友第德的媒介角色；所选译法不倒置二者关系。
- issue: ἔλεος的盟约性内涵
  choice: 怜悯
  alternative: 慈爱
  rationale: “怜悯”直接对应ἔλεος，也不排除其在以色列家语境中的信实与眷顾内涵；正文不额外限定为某一系统神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留三次“赞美”形成的强烈重复，并用感叹号呈现φωνῇ μεγάλῃ所示的公开高声宣告。
