  yaml_path: translation/deuterocanon/judith/013/016.yaml
  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: zh_hans
  text: 永活的主为证——他在我所走的路上保护了我：我的容貌[a]迷惑了他，使他走向灭亡；他没有同我犯下罪，以致玷污和蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的容貌”直译为“我的脸”；这里指友弟德的外表迷惑了敖罗斐乃。
    reason: 说明πρόσωπόν μου的字面措辞及其在语境中的所指；锚点紧随受注词语。
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: 永生的主……可以作证
  rationale: 这是庄严的起誓惯用语。汉语若直译为“主活着”较生硬；此译既保留主是永活者的内容，也自然表达誓言的证明功能。
- source_word: διεφύλαξέν με
  choice: 保护我
  rationale: 表达一路守护、保全之意，符合上下文中的神圣保护。
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: 在我所走的路上
  rationale: 保留具体的“路”及行走意象，不将其解释性地改成“使命”。
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: 我的容貌迷惑了他
  rationale: πρόσωπον字面是“脸、面容”；现代汉语用“容貌”可自然表达友弟德的外在形貌使对方受骗，同时不失原文意象。
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: 使他走向灭亡
  rationale: 体现εἰς所指向的结果，并保留ἀπώλεια的毁灭、灭亡之义。
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: 他并没有与我犯罪
  rationale: 保留原文较含蓄、宽泛的表达，不把性方面的含义明说得超过原文。
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: 使我受玷污和羞辱
  rationale: 按语境将εἰς理解为若该罪发生便会带来的结果；“玷污”兼具道德和礼仪层面的意味，“羞辱”自然表达αἰσχύνη。
theological_decisions:
- issue: 誓言中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这里是对神的称号，并用于庄严起誓；“主”是自然且合宜的汉语圣经用语。
- issue: 是否明说“与我犯罪”的性含义
  choice: 保留含蓄措辞“与我犯罪”
  alternative: “侵犯我”或“与我发生不洁关系”
  rationale: 原文没有直接说侵犯或性关系，而用一般性的“犯下罪行”；后文“玷污和羞辱”提供语境，译文不应替原文消除这种克制。
- issue: εἰς μίασμα καὶ αἰσχύνην与否定句的关系
  choice: 译为未发生之罪本会给友弟德带来的结果：“使我受玷污和羞辱”
  alternative: 较形式化地译为“以致玷污和羞辱”
  rationale: 保留结果含义，同时在汉语中明确玷污和羞辱所涉及的是友弟德；不将其扩展为额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“永生的主……可以作证”使希腊语誓言公式在汉语中自然成立；分号呈现誓言依据与后续陈述之间的层次。
