  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his servants hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: zh_hans
  text: 到了晚上，他的奴仆急忙离去；巴哥亚从外面关上帐篷，使侍立的人不得到他主人面前；他们就各自回到床铺去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψία
  choice: 晚上
  rationale: 在ὀψία ἐγένετο这一时间表达中，指傍晚或晚上来到；“到了晚上”自然且不过度强化为“夜幕降临”。
- source_word: ἐσπούδασαν
  choice: 急忙
  rationale: 保留动词所表达的匆忙和急切。
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: 他的奴仆
  rationale: δοῦλοι指处于主人权下的家内随从。“奴仆”既保留从属身份，也符合古代叙事的庄重语体，不淡化为泛指雇佣人员的“仆人”。
- source_word: ἀναλύειν
  choice: 退去
  rationale: 此处指侍从散去、离开当值之处；“退去”兼顾离开的动作与上下尊卑语境。
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: 从外面把帐篷关好
  rationale: 表达从帐篷外将其关闭或合拢；“关好”自然传达关闭妥当，但不武断添加上锁等细节。
- source_word: ἀπέκλεισεν
  choice: 挡在……之外
  rationale: 该复合动词表示阻止接近或排除在外；此译明确呈现侍立者不能再进入主人面前。
- source_word: τοὺς παρεστῶτας
  choice: 侍立的人
  rationale: 分词指在旁侍候、随时听命的人；“侍立的人”保留其动作色彩和宫廷、军营语境。
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: 在他主人面前之外
  rationale: 按希腊语习语表达被隔离于主人所在之处；κύριος在此是社会身份称谓，译作“主人”而非神圣称号“主”。
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: 众人便回到自己的床铺去了
  rationale: κοίτας为复数，指各自睡卧之处；译文保留众人各归床铺的叙事动作。
- source_word: Βαγώας
  choice: 巴哥亚
  rationale: 按希腊文人名Βαγώας音译，并采用适合现代普通话的形式。
theological_decisions:
- issue: 次经叙事中δοῦλοι的身份表达
  choice: 奴仆
  alternative: 仆人／侍从
  rationale: 原词可泛指服役者，也常明确含有受主人支配的奴属身份。上下文是军中权贵的家内扈从；“奴仆”保留古代社会关系，同时比单用“奴隶”更适合此处叙事语体。
- issue: κύριος是否采用神圣称号
  choice: 主人
  alternative: 主／大人
  rationale: 此处所指是巴哥亚的主人荷罗孚尼，并非上帝；“主人”避免引入神学称号，也准确反映社会从属关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句式基本顺随希腊文事件次序，同时避免生硬直译；不添加原文未明说的上锁、就寝等细节。
