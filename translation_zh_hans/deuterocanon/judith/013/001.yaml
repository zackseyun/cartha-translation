revisions:
- from: 到了晚上，他的奴仆都急忙退去；巴哥亚从外面把帐篷关好，又把侍立的人挡在他主人面前之外，众人便回到自己的床铺去了。
  to: 到了晚上，他的奴仆急忙离去；巴哥亚从外面关上帐篷，使侍立的人不得到他主人面前；他们就各自回到床铺去了。
  rationale: 修改仅为改善汉语表达并更清楚呈现“排除在主人面前之外”的动作：以“使侍立的人不得到他主人面前”替代生硬的空间直译。另删去无须强调的“都”，并将“退去”调整为更中性的“离去”。未改变人物、社会身份、事件顺序或原文的任何歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:18:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了傍晚、奴仆匆忙离开、巴哥亚从帐篷外关闭帐篷、侍立者被排除在主人面前之外，以及众人回到各自睡处的事件次序。惟“挡在他主人面前之外”虽可理解，但汉语搭配生硬，且不如改文清楚表达ἀπέκλεισεν所指的禁止接近。
  naturalness: “他的奴仆都急忙退去”基本自然，但“都”并非原文所需的强调；“急忙离去”更平实准确。“使侍立的人不得到他主人面前”既保留庄重叙事语体，也避免“在……面前之外”的不自然结构。
  terminology: “奴仆”适当保留δοῦλοι所含的从属、奴役关系；“主人”正确对应此处指荷罗孚尼的κύριος，并不带神圣称号含义。“巴哥亚”可接受。
  issues:
  - severity: medium
    issue: “挡在他主人面前之外”搭配不自然。
    rationale: 希腊文ἀπέκλεισεν…ἐκ προσώπου表达将侍立者排除、不许接近其主人的面前。中文“挡在……面前之外”不合现代汉语的惯常表达，宜改为“使……不得到……面前”，以清楚保留排除和禁止接近的意义。
  - severity: low
    issue: “都”略增原文未明示的整体强调。
    rationale: οἱ δοῦλοι为复数定指，未特别强调“全都”。删去“都”可避免不必要强化，同时不改变叙事意义。
  revised_text: 到了晚上，他的奴仆急忙离去；巴哥亚从外面关上帐篷，使侍立的人不得到他主人面前；他们就各自回到床铺去了。
