  yaml_path: translation/deuterocanon/judith/014/015.yaml
  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: zh_hans
  text: 可是无人应声，他便掀开帘子[a]，走进卧房，发现那人被抛倒在床帐上[b]，已经死了；他的头也已被取走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“分开（或拉开）以后”，没有明说所拉开的物件；此处按卧房场景补出“帘子”。
    reason: implicit_object
  - marker: b
    text: 此处所译的希腊词具体所指不确定，可能指床的罩帐、帐幔，或与床相连的悬挂物。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他的头已从他那里被取走”，意思是他已被斩首。
    reason: literal_expression
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: 可是无人应声
  rationale: ἐπακούω在呼叫后无人回应的语境中表示“应声、回应”，而非单指“听见”。
- source_word: διαστείλας
  choice: 他便掀开帘子
  rationale: διαστέλλω表示分开、拉开；原文未明说宾语，但卧房场景暗示所掀开的是帘幕。
- source_word: κοιτῶνα
  choice: 卧房
  rationale: κοιτών指供人睡卧的房间；“卧房”现代、庄重，也比“寝宫”少添身份色彩。
- source_word: ἐπὶ τῆς χελώνιδος
  choice: 在床边的脚凳上
  rationale: χελωνίς可指床榻附近一种低矮的承托物或脚凳；具体家具形制不确定，故正文采用符合场景的称呼，并以脚注保留其他可能。
- source_word: ἐρριμμένον νεκρόν
  choice: 被抛在……上，已经死了
  rationale: 保留ῥίπτω所含“抛下、扔下”的力度，并将νεκρόν清楚表达为已经死亡。
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: 他的头也已从身上被取走
  rationale: 贴近原文“头已从他那里被取走”的被动表述，保留叙事冲击，不直接压缩为解释性的“他已被斩首”。
