  text: 他高声呼喊，伴着哭泣、呻吟和强烈的号叫，并撕裂了自己的衣服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: 放声大哭
  rationale: 该短语表示高声呼喊；结合随后哀泣、呻吟的语境，译作“放声大哭”自然地传达强烈悲恸，同时不把声音理解为具体言语。
- source_word: μετὰ κλαυθμοῦ
  choice: 又是哀泣
  rationale: κλαυθμός指哭泣或哀哭；“哀泣”既保留悲悼色彩，也与前面的高声哭喊有所区分。
- source_word: στεναγμοῦ
  choice: 又是呻吟
  rationale: στεναγμός可指呻吟或叹息；此处悲痛程度强烈，“呻吟”比“叹息”更贴合语境。
- source_word: βοῆς ἰσχυρᾶς
  choice: 又发出强烈的号叫
  rationale: βοή指呼喊、号叫，ἰσχυρά强化其力度；“强烈的号叫”保留原文在“高声”之外再次加强哀号的累积表达。
- source_word: διέρρηξεν
  choice: 撕裂
  rationale: 该动词表示撕开、扯裂，常用于描述哀悼时撕裂衣服的动作；“撕裂”准确且庄重。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 自己的衣服
  rationale: ἱμάτια泛指衣服或外衣；原文未限定为长袍，“衣服”最稳妥，“自己的”清楚表达反身所有关系。
