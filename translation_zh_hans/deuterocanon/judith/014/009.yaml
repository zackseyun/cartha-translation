  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
translation:
  language: zh_hans
  text: 她停止说话后，百姓高声欢呼[a]，在他们的城里发出喜乐的呼声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“呐喊”。希腊文这个动词表示大声呼喊，有时也可指战斗时的呐喊；这里则指百姓庆贺时发出的欢呼。
    reason: 词义选择
lexical_decisions:
- source_word: ὡς δὲ
  choice: 以后
  rationale: 与前面的分句共同构成“她说完以后”，自然表达希腊文的时间推进关系。
- source_word: ἐπαύσατο λαλούσα
  choice: 她说完
  rationale: 原文直义为“她停止说话”。在此叙事语境中，“她说完”简洁自然，表示她的话告一段落，却不增添原文没有的内容。
- source_word: ἠλάλαξεν
  choice: 欢呼
  rationale: 该动词表示大声呼喊，有时也可指战斗呐喊；此处紧接“喜乐的呼声”，语境明显是庆贺性的集体呼喊，因此译作“欢呼”，并以脚注保留其较宽的词义范围。
- source_word: ὁ λαὸς
  choice: 百姓
  rationale: 准确表达集体性的“民众、人民”，且符合圣经叙事中庄重而通俗的现代汉语语体。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 以自然汉语表达声音宏大的方式意义，避免生硬直译为“用大声音”。
- source_word: ἔδωκεν φωνὴν εὐφρόσυνον
  choice: 发出喜乐的呼声
  rationale: “发出……呼声”自然传达希腊文“给出声音”的惯用表达；“喜乐”保留 εὐφρόσυνον 所含的欢欣、庆贺意味。
- source_word: ἐν τῇ πόλει αὐτῶν
  choice: 在他们的城里
  rationale: 保留地点和 αὐτῶν 的领属含义，不省略“他们的”。
