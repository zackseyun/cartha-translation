  yaml_path: translation/deuterocanon/judith/014/012.yaml
  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: zh_hans
  text: 亚述的子孙看见他们，就传信给自己的首领；首领们便去见众将领、千夫长和他们的每一位官长。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: 亚述的子孙
  rationale: 原文直译为“亚述的儿子们”，在此是族群称谓。“亚述的子孙”既保留原文表达，也符合庄重自然的现代汉语。
- source_word: ὡς εἶδον αὐτούς
  choice: 看见他们
  rationale: ὡς与简单过去时在此表示时间关系；译作“看见……就”自然体现随后的反应，又不强化为“刚一看见”。
- source_word: διεπέμψαν
  choice: 传信
  rationale: 该动词可指派人或传送消息，原文未明说所派的是使者还是信息；“传信”保留交流行动而不补入未经明说的宾语。
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: 给自己的首领
  rationale: ἡγούμενοι泛指带领者或掌权者；“首领”适合此处军事层级语境。“自己”清楚表示反身所属关系。
- source_word: στρατηγοὺς
  choice: 众将领
  rationale: 在军事语境中指统兵的高级指挥者；“将领”比现代军衔意味较强的“将军”更稳妥。
- source_word: χιλιάρχους
  choice: 千夫长
  rationale: 该词本义为统领一千人的长官；“千夫长”在汉语圣经叙事中简洁、清楚，并保留数字含义。
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: 他们的每一位官长
  rationale: πᾶς与单数名词连用具有逐一、周遍的分配意义；“每一位”比笼统的“所有”更贴近原文结构。
