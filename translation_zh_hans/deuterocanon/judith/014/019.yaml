  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: zh_hans
  text: 亚述军队的将领听见这些话，就撕裂自己的长衣[a]；他们心中极其不安[b]，军营中央随即响起极大的喊叫和喧嚷声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撕裂衣服是当时表达悲痛、震惊或极度忧愁的惯常举动。
    reason: cultural_note
  - marker: b
    text: 或译：“他们的心灵极其不安。”希腊文直译为“他们的魂极其不安”，其中“魂”采用集合性的单数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν τὰ ῥήματα
  choice: 听见这些话
  rationale: ὡς加不定过去时引出时间从句；现代汉语按叙事顺序表达即可。“这些话”既保留ῥήματα的言语含义，也自然回指上文所传的信息。
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: 亚述军队的将领
  rationale: ἄρχοντες在军事语境中指领军者；δύναμις在此指军队或兵力。译作“将领”与“军队”准确而自然。
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: 撕裂自己的衣袍
  rationale: χιτών具体指贴身长衣或袍服；汉语“衣袍”比音译服饰名称更易理解，同时保留撕裂衣服这一具体动作。
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: 他们心里极其惊惶
  rationale: ψυχή在此表示人的内在生命、心灵或精神状态；希腊文采用集合性的单数。汉语“他们心里”能自然保留共同的内在反应，ταράσσω则依语境译为“惊惶”。
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: 顿时响起极大的哭喊和喧嚷声
  rationale: ἐγένετο在场景描写中可自然译为“响起”；κραυγή与βοή是意义相近的双重表达，分别译为“哭喊”和“喧嚷声”，保留其累加强调。
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: 营中
  rationale: παρεμβολή指军营；“营中”简洁自然地表达ἐν μέσῳ的空间范围。
theological_decisions:
- issue: ψυχή的表达
  choice: 他们心里极其惊惶
  alternative: 他们的灵魂极其不安
  rationale: 此处描述听闻消息后的内在震动，并非在界定灵魂与身体的神学关系。“心里”符合现代汉语用法，也不额外导入特定人论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“衣袍”保留古代服饰意象而避免生硬音译；“哭喊和喧嚷声”保留原文近义词并列所形成的强烈效果。
