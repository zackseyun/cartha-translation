  text: 他走进友弟德住着的帐篷[a]，却没有找到她；他便猛然冲出去，到众人中间，高声喊道[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“友弟德暂住的帐篷”。希腊语分词 καταλύουσα 指在某处住宿或暂住。
    reason: lexical_alternative
