    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 走进
  rationale: 准确表达进入帐篷的方向，又符合现代汉语叙事习惯。
- source_word: σκηνήν
  choice: 帐篷
  rationale: 军事营地语境中，σκηνή通常指帐篷；此译法简明且贴合场景。
- source_word: καταλύουσα
  choice: 住宿
  rationale: 该分词表示临时住下或投宿；“住宿”自然地保留其暂居含义。
- source_word: οὐχ εὗρεν
  choice: 没有找到
  rationale: 按普通语义直译，表示进去后未见她在那里，不增添“发现”等额外意味。
- source_word: ἐξεπήδησεν
  choice: 猛然冲到
  rationale: 保留动词所含突然、迅速向外而出的生动感；结合目的语“到众人那里”，译成“冲到”较自然。
- source_word: λαόν
  choice: 众人
  rationale: λαός在此泛指聚集的人群；“众人”不把所指过度限定为军队。
- source_word: κράζων
  choice: 高声喊道
  rationale: 表达分词所含的大声呼喊，并以冒号承接下一节的喊话内容。
