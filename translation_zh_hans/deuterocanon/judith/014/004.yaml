  text: Then you and all who live within the whole territory of Israel[a], following after them[b], strike them down on their roads.
translation:
  language: zh_hans
  text: 然后，你们和住在以色列全境的所有居民，要随后追赶他们[a]，在他们所走的路上把他们击倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随后追赶他们”也可译作“跟随在他们后面”；希腊语分词本身可表示随后跟去，在这里的军事语境中带有追击之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακολουθήσαντες
  choice: 随后追赶他们
  rationale: 该不定过去时分词表示伴随或先于主命令的行动，基本义为“跟随在后”；在军事溃逃的语境中自然含有追击之意。“随后追赶”兼顾行动次序和上下文，又不把含义收窄为已经追上。希腊文未明说分词的宾语，中文依上下文补出“他们”。
- source_word: οἱ κατοικοῦντες πᾶν ὅριον Ἰσραήλ
  choice: 住在以色列全境的所有人
  rationale: κατοικοῦντες表示居住者；ὅριον在这里指疆域、地区，而非单纯的边界线。按现代汉语习惯译作“住在以色列全境的所有人”。
- source_word: καταστρώσατε
  choice: 把他们击倒
  rationale: 该命令式在军事语境中表示使敌人倒下、将其击溃或杀倒。“击倒”保留强烈的军事动作，同时避免在动词本身可能具有一定幅度时过度明定死亡。
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: 在他们所走的路上
  rationale: 直译为“在他们的道路上”。这里指敌军行进或溃逃所经的路线；“他们所走的路上”既保留具体道路意象，也符合现代汉语。
