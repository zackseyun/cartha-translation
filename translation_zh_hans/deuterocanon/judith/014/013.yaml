review_pass:
  verdict: revise
  source_fidelity: 正文中的人名混入拉丁字母，必须校正。另，ἵνα ἐξολοθρευθῶσιν εἰς τέλος宜明确保留目的导向；“这样，他们就会”偏向单纯结果，且弱化了原文的句法关系。其余主要信息均已涵盖：到达何罗弗尼的帐篷、向管理其事务者说话、紧急唤醒主人、以贬称称敌方、以及“下来”作战的空间意象。
  naturalness: “荷olofer尼”不合现代汉语书写规范。改为通行且纯中文的“荷罗弗尼”。“来到……帐篷那里”不额外限定为帐篷的“前面”，也较自然。“奴仆”在庄重叙事及敌对轻蔑称呼中可用。
  terminology: κύριος译为“主人”恰当，避免神圣称号含义；δοῦλοι译为“奴仆”可保留受支配和贬抑色彩。τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ不宜擅加正式官衔，译作“负责管理他一切事务的人”合适。
  issues:
  - severity: high
    issue: 人名“荷olofer尼”含有拉丁字母，且不是有效的简体中文人名写法。
    rationale: 这既是出版层面的文本错误，也妨碍人名一致性。应统一为“荷罗弗尼”。
  - severity: medium
    issue: “这样，他们就会被彻底消灭”将ἵνα从句主要处理为结果。
    rationale: ἵνα在此保有目的/预期目的的表达功能；“好让他们被彻底消灭”较直接保留原文句法，同时不需断言这是敌军自身的主观意图。
  - severity: low
    issue: “帐篷前”比ἐπὶ τὴν σκηνήν更具体。
    rationale: 原文表达抵达帐篷处，未明确说停在帐篷正前方；改为“帐篷那里”可避免添加空间细节。
  revised_text: 他们来到荷罗弗尼的帐篷那里，对负责管理他一切事务的人说：“快叫醒我们的主人！那些奴仆竟敢下来攻打我们，好让他们被彻底消灭。”
