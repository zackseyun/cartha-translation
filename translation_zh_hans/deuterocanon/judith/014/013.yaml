- from: 他们来到荷olofer尼的帐篷前，对那位掌管他一切事务的人说：“快叫醒我们的主人！那些奴仆竟敢下来攻打我们；这样，他们就会被彻底消灭。”
  to: 他们来到荷罗弗尼的帐篷那里，对负责管理他一切事务的人说：“快叫醒我们的主人！那些奴仆竟敢下来攻打我们，好让他们被彻底消灭。”
  rationale: 修正混合字符的人名为“荷罗弗尼”，避免将到达帐篷的表述具体化为“帐篷前”，并用“好让”重现ἵνα从句的目的导向。未增设脚注：原草稿没有脚注锚点，且“负责管理他一切事务的人”已在正文中清楚表达该官员职能。
