  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the servants have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: zh_hans
  text: 他们来到荷罗弗尼的帐篷那里，对负责管理他一切事务的人说：“快叫醒我们的主人！那些奴仆竟敢下来攻打我们，好让他们被彻底消灭。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεγένοντο ἐπὶ τὴν σκηνὴν Ὁλοφέρνου
  choice: 来到荷olofer尼的帐篷前
  rationale: παραγίνομαι在此表示抵达某处；ἐπί加宾格指来到帐篷所在之处。“帐篷”符合军营语境，避免“会幕”的宗教含义。
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: 那位掌管他一切事务的人
  rationale: 传本文句略显生硬，但ἐπὶ πάντων τῶν αὐτοῦ表明此人受命管理荷olofer尼的一切所有或事务；不擅自赋予“总管”等原文未明说的正式头衔。
- source_word: Ἔγειρον δὴ
  choice: 快叫醒
  rationale: 命令式ἔγειρον表示唤醒，δή在此加强催促语气；“快叫醒”自然传达紧迫感。
- source_word: κύριον ἡμῶν
  choice: 我们的主人
  rationale: 此处κύριος指人的上级荷olofer尼，不是神圣称号；“主人”符合部属对统帅的称呼。
- source_word: οἱ δοῦλοι
  choice: 那些奴仆
  rationale: 说话者以轻蔑的身份称谓指敌人。现代汉语“奴仆”兼具受支配身份与贬抑色彩，比中性的“仆人”更能保留语气，又比单用“奴隶”更适合此处的军事辱称。
- source_word: καταβαίνειν ἐφʼ ἡμᾶς εἰς πόλεμον
  choice: 下来攻打我们
  rationale: 保留καταβαίνειν的向下空间意象，并以“攻打”自然表达ἐφʼ ἡμᾶς与εἰς πόλεμον的敌对、交战含义。
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: 这样，他们就会被彻底消灭
  rationale: ἐξολοθρεύω表示消灭，εἰς τέλος进一步强调完全程度。“这样……就会”保留ἵνα在语境中带有结果或预期目的的张力，不明确替说话者判定是目的还是结果。
theological_decisions:
- issue: 军事辱称语境中的δοῦλοι
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 该词在此并非尊荣性的服事称谓，而是亚述一方对敌军的贬称。“奴仆”保留受辖制和轻蔑意味，同时在叙事对话中比“奴隶”略自然。
- issue: ἵνα从句的目的与结果色彩
  choice: 这样，他们就会被彻底消灭
  alternative: 为要使他们被彻底消灭；好让他们被彻底消灭
  rationale: 希腊语ἵνα通常可表示目的，但此处也可理解为敌人下来作战所将招致的结果。译文不把“被消灭”错误地说成敌军自己的主观目的。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。保留“下来”的地形意象和“奴仆”的贬抑语气；人名按通行天主教次经译名应作“荷olofer尼”，但提交正文中出现了混合字符，出版前须校正为纯简体中文“荷olofer尼”。
