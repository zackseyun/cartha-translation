base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: zh_hans
  text: 当天一破晓，太阳一出来照在地上时，你们各人都要拿起自己的兵器；所有健壮的男子都要出城。你们要为他们委派一名首领，假装要下到平原，前往亚述子孙[b]的先头部队[a]；但你们不可下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先头部队”也可译作“前哨”或“前卫”。希腊词προφυλακή可指先头部队、前哨或前沿警戒；原文的介词结构也可译作“前往亚述子孙的前哨”。
    reason: lexical_alternative
  - marker: b
    text: “亚述子孙”是希腊文表达的直译，指亚述人。
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: 黎明破晓
  rationale: 用现代汉语常用表达传达晨光初现之意，同时保留原文的时间意象。
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: 太阳照临大地
  rationale: 既保留太阳出现并临到大地的图景，也比生硬的“太阳出来在地上”更符合现代汉语。
- source_word: ἀναλήμψεσθε
  choice: 要拿起
  rationale: 准确表达拿起并准备使用军用器具的动作。
- source_word: τὰ σκεύη τὰ πολεμικὰ
  choice: 自己的兵器
  rationale: σκεύη可泛指装备或器具；在明确的军事语境中译为“兵器”简明自然。
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: 所有健壮的男子
  rationale: 保留ἀνήρ明确的男性所指，并以“健壮”表达有力量、能出战之意。
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: 为他们委派一名首领
  rationale: 表达为出城者指定带领之人的意思，不把ἀρχηγός过度限定为某一正式军阶。
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: 装作要下到平原
  rationale: ὡς在此表示表象或假意行动；“装作”清楚呈现这是诱敌策略。
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: 迎战亚述子孙的先头部队
  rationale: 按军事语境将εἰς理解为趋向敌军，并以“先头部队”表达προφυλακή；脚注保留“前哨”等词义及介词关系的可能性。
- source_word: οὐ καταβήσεσθε
  choice: 但你们不可下去
  rationale: 将未来时形式在指令语境中的禁止作用自然译出，并与前面的佯装行动形成鲜明转折。
theological_decisions:
- issue: πᾶς ἀνὴρ ἰσχύων中的性别明确性
  choice: 所有健壮的男子
  alternative: 所有能出战的人；所有勇士
  rationale: 原文使用明确指男性的ἀνήρ，且语境为军事出动，因此不将其性别中和。
- issue: υἱῶν Ἀσσούρ的族称表达
  choice: 亚述子孙
  alternative: 亚述人
  rationale: 正文保留希腊文“亚述的子孙”这一闪族式族称结构，脚注说明其实际所指，避免悄然抹平原文措辞。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“黎明破晓”“照临大地”保留叙事的文学感；命令部分使用“要”“不可”，使军事部署明确有力。正文保留“亚述子孙”这一原文表达，并用脚注帮助普通读者理解。
