  source_fidelity: 原文的时间推进、悬挂示众、逐一武装、按队伍出行及前往ἀναβάσεις的基本内容均有体现。不过“从城墙上悬挂下来”在现代汉语里通常表示把原先挂在城墙上的物体取下，与ἐκρέμασαν（悬挂）及ἐκ τοῦ τείχους（从城墙上／由城墙处）所描写的动作相反或至少明显含混，必须改正。
  naturalness: “黎明升起的时候”可懂，但“黎明升起时”更凝练自然。“以色列人个个”自然，却未明确原文分配用法中的ἀνήρ（男子）；在不牺牲自然度的前提下可译为“以色列的每个男子都”。“列队出去”比“分队出发”更自然，且不暗示将人分割编成特定的“分队”。
  terminology: “荷罗孚尼”可保留，前后一致。“武器”准确。将ἀναβάσεις译作“上坡处”保留原文地形词的开放性，不把它限定成“通道”或“山间通道”；脚注可说明其可能指上坡进路。
  issues:
