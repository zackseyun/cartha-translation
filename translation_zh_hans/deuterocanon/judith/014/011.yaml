  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: zh_hans
  text: 黎明升起时，他们把荷罗孚尼的头悬挂在城墙上[a]；以色列的每个男子都拿起自己的武器，列队出去，前往上坡处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从城墙上挂出”。希腊原文直译为“从城墙悬挂”，描写头颅由城墙处悬挂示众。
    reason: lexical_alternative
  - marker: b
    text: 直译“上坡处”；这里可能指上坡的进路或山间通道。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα δὲ ὁ ὄρθρος ἀνέβη
  choice: 黎明升起的时候
  rationale: 保留ὄρθρος ἀνέβη“黎明升起”的形象，同时以现代汉语自然的时间从句表达；δὲ在此承接叙事，不另加“现在”等原文没有的词。
- source_word: ἐκρέμασαν τὴν κεφαλὴν Ὀλοφέρνου ἐκ τοῦ τείχους
  choice: 他们把荷罗孚尼的头从城墙上悬挂下来
  rationale: ἐκρέμασαν直译为“悬挂”；ἐκ τοῦ τείχους表示悬挂所依附或伸出的地点，以“从城墙上……下来”保留ἐκ的空间意象，不把它简单消解为“挂在城墙上”。
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: 以色列人个个
  rationale: 该短语为阳性单数的分配用法，强调每一个以色列男子；结合战事语境，“以色列人个个”在现代汉语中自然地保留逐一、全体投入的力量，且不误写成包括所有居民的抽象整体。
- source_word: ἀνέλαβεν τὰ ὅπλα αὐτοῦ
  choice: 拿起自己的武器
  rationale: 准确表达军事语境中的“拿起兵器”；αὐτοῦ按分配结构译作“自己的”。
- source_word: κατὰ σπείρας
  choice: 分队
  rationale: σπεῖρα在这里指有组织的队伍或编组；“分队”简洁自然，又不强行指定严格的古代军事编制。
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: 前往上坡的通道
  rationale: ἀναβάσεις字面为“上升处、上坡处”；结合地形与军事语境译作“上坡的通道”，比“山口”少一层未明说的地貌限定，同时比生硬的“上升处”清楚。
