    issue: “从城墙上悬挂下来”方向和动作含混，且通常理解为取下。
    rationale: 希腊文ἐκρέμασαν的核心意思是“悬挂”；中文“悬挂下来”在“把……从城墙上……”这一构式中容易表达把悬挂物卸下，改变叙事事件。改为“悬挂在城墙上”，并以脚注说明原文介词的字面表达，既自然又不失文本信息。
  - severity: medium
    issue: “分队出发”可能表示把人员划分为分队。
    rationale: κατὰ σπείρας表示按队伍、成队地行动，并不必然叙述此刻进行分队编组。“列队出去”较符合汉语军事叙事，也不增加编制层面的细节。
  - severity: low
    issue: “上坡的通道”略将ἀναβάσεις具体化。
    rationale: ἀναβάσεις字面是“上坡处／上行处”，可指上坡进路，但未必明确为“通道”。正文采用“上坡处”，在脚注保留可能的地形解释。
