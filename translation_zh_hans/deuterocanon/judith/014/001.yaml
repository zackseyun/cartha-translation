translation:
  language: zh_hans
  text: 友弟德对他们说：“弟兄们，听我说；拿起这颗头，把它挂在你们城墙的女墙上[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们城墙的垛口上”或“城垛上”。希腊语ἐπάλξ指防御城墙顶部的垛墙、女墙或城垛一类的构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: 请听我说
  rationale: Ἀκούσατε是直接命令；δή加强催促和当下的语气。译作“请听我说”既自然庄重，也传达恳切而紧迫的呼吁，不把δή机械地另译为“现在”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 原文为阳性复数称呼，语境中指伯突利亚的男子；“弟兄们”保留性别和共同体称谓。
- source_word: λαβόντες
  choice: 拿着
  rationale: 不定过去时分词在此与后面的命令构成先后相接的动作。汉语用“拿着……把它挂……”自然表达这一关系。
- source_word: τὴν κεφαλὴν ταύτην
  choice: 这颗头
  rationale: 原文只说“这头”，并未明说“砍下的”；“这颗头”符合现代汉语量词习惯，同时不增添上下文信息。
- source_word: κρεμάσατε
  choice: 挂
  rationale: 保留具体的悬挂动作，不以表达目的的“展示”替代。
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: 在……垛口上
  rationale: ἐπάλξ指防御城墙顶部的垛口、女墙或胸墙。“垛口”贴合军事建筑语境，正文采用较具体而自然的对应词，并以脚注保留词义范围。
- source_word: τοῦ τείχους ὑμῶν
  choice: 你们城墙的
  rationale: τεῖχος在语境中是城市的防御墙；补出“城”使现代读者立即明白所指，而“你们”保留原文所属关系。
