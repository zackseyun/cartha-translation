  text: And these men, after taking up their armor, will go into their camp and will rouse the commanders of the army of Assyria;
translation:
  language: zh_hans
  text: 这些人拿起他们的全套装备后，要进入他们的营地，唤醒亚述军队的将领；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: 拿起……后
  rationale: 不定过去时分词表示动作先于主要动词发生；此译自然地呈现先后次序。
- source_word: οὗτοι
  choice: 这些人
  rationale: 保留指示代词的强调和指向作用，并按汉语习惯补出“人”。
- source_word: τὰς πανοπλίας αὐτῶν
  choice: 他们的全副武装
  rationale: πανοπλία指整套武装或全副甲胄；译作“全副武装”既保留“全套”的语义，也不局限于防护甲胄。
- source_word: πορεύσονται
  choice: 要进入
  rationale: 与εἰς τὴν παρεμβολήν连用，表达他们将前往并进入营地；“要”体现将来意义。
- source_word: παρεμβολὴν
  choice: 营地
  rationale: 在军事语境中指军营或驻扎之处；“营地”是现代汉语的自然表达。
- source_word: ἐγεροῦσι
  choice: 唤醒
  rationale: ἐγείρω在此最直接的意义是使人醒来；保留字面动作，不扩大解释为动员或鼓动。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 泛指军队中的统帅或高级指挥者，避免套用现代特定军衔。
- source_word: δυνάμεως Ἀσσούρ
  choice: 亚述军队
  rationale: δύναμις在此军事搭配中指军队；Ἀσσούρ按常用中文名称译为“亚述”。
