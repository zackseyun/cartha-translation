base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The servants have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: zh_hans
  text: “奴仆们失职了！[a]希伯来人中一个女人竟使尼布甲尼撒王室蒙羞。看哪，何罗斐乃躺在地上，头不在身上了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”或译“仆役”。希腊语δοῦλοι可按语境指奴隶或仆役；这里很可能带有受辖制身份的含义。
    reason: 说明δοῦλοι在“奴仆”与“仆役”之间的词义范围。
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: 失职了
  rationale: ἀθετέω可表示不守信、漠视或未尽本分；这里是对何罗斐乃属下酿成灾难性疏失的斥责。“失职了”符合语境，同时不把词义过度限定为盟约性的“背信”。
- source_word: οἱ δοῦλοι
  choice: 奴仆们
  rationale: δοῦλοι指受权势支配、在军营及家内服役的人。“奴仆”既保留其受辖制的身份色彩，也符合古代王室和军营语境。
- source_word: ἐποίησεν αἰσχύνην
  choice: 使……蒙羞
  rationale: 这是表达造成羞辱的习语；“使……蒙羞”自然保留其结果和公开受辱的意味。
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: 希伯来人中一个女人
  rationale: 保留μία对“一个女人”的突出强调，也明确她属于希伯来人。
- source_word: εἰς τὸν οἶκον τοῦ βασιλέως Ναβουχοδονόσορ
  choice: 使尼布甲尼撒王室蒙羞
  rationale: οἶκος在这里不只指建筑物，更指君王之家或王室；结合羞辱语义，译为“王室”自然准确。
- source_word: χαμαί
  choice: 倒在地上
  rationale: χαμαί意为“在地上”；结合被斩首后的场景，“倒在地上”清楚而有画面感。
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: 头已经不在身上了
  rationale: 保留原文突兀、具体的视觉表达，不释义为较平淡的“被斩首了”。
theological_decisions:
- issue: 非比喻叙事中δοῦλοι的身份色彩
  choice: 奴仆们
  alternative: 仆役们
  rationale: 此处人物是在王室和军营权力结构下服役的属下；“奴仆”较能保留受辖制甚至隶属的身份含义，但脚注同时承认该词可按语境泛指仆役。
translation_notes:
  register: 采用现代、庄重而具叙事张力的普通话。“竟”传达说话者对一名希伯来女子使整个王室受辱的震惊，但不增加新的事实内容；“看哪”保留ἰδού的突发指示和戏剧效果。
