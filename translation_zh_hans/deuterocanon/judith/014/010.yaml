  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: zh_hans
  text: 阿希奥尔看见以色列的上帝所做的一切，就深深信靠上帝[a]，给自己行了割礼，割去自己包皮的肉，并归入以色列家[b]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“深信上帝。”这里的希腊语可侧重相信、信赖或信靠。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被加到以色列家中。”这句话指阿希奥尔被接纳为以色列民的一员。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见……就
  rationale: 以自然的汉语承接结构表达不定过去时分词所引出的时间及因果背景。
- source_word: πάντα ὅσα ἐποίησεν ὁ θεὸς τοῦ Ἰσραήλ
  choice: 以色列的上帝所做的一切
  rationale: 完整保留行为的总体范围和“以色列的上帝”这一称号。
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: 深深信靠上帝
  rationale: πιστεύω接与格在此兼有相信与倚靠之意；“信靠”保留其关系性含义，“深深”表达σφόδρα的强烈程度。
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: 割去了自己包皮的肉
  rationale: 保留原文具体的身体措辞及中间语态的反身意义，不以委婉说法抹去细节。
- source_word: προσετέθη πρὸς τὸν οἶκον Ἰσραήλ
  choice: 归入以色列家
  rationale: 表达被纳入群体的被动含义，同时保留“以色列家”这一圣经传统称谓。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今日
  rationale: 保留叙述者立足当下回顾其持续归属的时间表达。
theological_decisions:
- issue: 归信语境中πιστεύω的译法
  choice: 深深信靠上帝
  alternative: 深信上帝
  rationale: 原词可侧重相信、信赖或信靠；正文采用自然且具有关系性的“信靠”，脚注保留“深信”的可能，避免把词义限定为纯理智认同或导入后期教义公式。
- issue: 阿希奥尔被纳入以色列
  choice: 归入以色列家
  alternative: 被加到以色列家中
  rationale: 正文清楚表达群体归属，又不添加“皈依者”等原文没有的制度性或技术性称谓；脚注保留更贴近动词字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以色列家”保留经文传统表达；割礼部分按希腊原文保留具体措辞，不作委婉化处理。
