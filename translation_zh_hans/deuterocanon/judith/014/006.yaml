  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: zh_hans
  text: 他们把亚基奥尔从乌西雅的家中叫出来。他来到后，看见在百姓的集会中，有一个人手里拿着敖罗斐乃的头，就俯伏在地，昏了过去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他的灵（或气息）衰竭了／松脱了”。这是一种描述身体瘫软或昏厥的说法；也可译作“他的精神崩溃了”。
    reason: 保留 ἐξελύθη τὸ πνεῦμα αὐτοῦ 的字面意象及其可指身体性昏厥的语义范围，且不把动词误释为“离开”。
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: 叫了出来
  rationale: 结合 ἐκ τοῦ οἴκου，译为“从……家里叫了出来”，自然表达呼叫某人出来，并不过度加强为正式“召来”。
- source_word: τὸν Ἀχιὼρ
  choice: 亚基奥尔
  rationale: 按希腊文人名音译，并采用现代简体中文中清楚可读的形式。
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: 从乌西雅家里
  rationale: 此处 οἶκος 最自然地指实际住所；“家里”比“房屋中”更符合现代汉语叙事。
- source_word: ὡς δὲ ἦλθεν
  choice: 他来到后
  rationale: ὡς 在这里引出时间关系；δέ 仅作轻微叙事推进，汉语无需硬译为“但是”。
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: 看见……敖罗斐乃的头
  rationale: 直接保留所见对象及所属关系。
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: 有一个人手里提着
  rationale: 保留 ἑνός 的单数强调；对于被砍下的头，“提着”比静态的“在手中”更自然且不增加实质内容。
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: 百姓的会众中
  rationale: 在前基督教叙事语境中，ἐκκλησία 指聚集的民众，不宜译作制度化含义的“教会”。
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: 俯伏在地
  rationale: 以自然中文表达面朝下倒伏的身体动作。
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: 失去了知觉
  rationale: 该习语在此描写因震惊而身体瘫软、昏厥；正文采用自然现代汉语，脚注保留“灵/气息离开”的字面意象及可能范围。
theological_decisions:
- issue: πνεῦμα 在昏厥语境中的含义
  choice: 失去了知觉
  alternative: 他的灵衰弱了／气息离开了他
  rationale: 上下文重在亚基奥尔见到首级后的身体反应，并非明确陈述灵魂离体或死亡。译为“失去了知觉”传达最可能的语用意义，同时用脚注保存原文意象和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依希腊文音译；“会众”避免把 ἐκκλησία 误解为后来的“教会”。脚注标记置于它所解释的“失去了知觉”之后。
