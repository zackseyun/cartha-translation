  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: zh_hans
  text: 巴哥阿走进去，敲了敲帐篷的门帘[a]，因为他以为何罗斐乃正与友弟德同睡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“击打帐篷的门帘。”希腊文所用词语较直译可作“击打”和“帘幕／门帘”；正文按这一场景采用更自然的表达。
    reason: lexical_alternative
  - marker: b
    text: “他以为”表明这是巴哥阿对何罗斐乃情况的推测；希腊文并没有把这件事陈述为已经确认的事实。“同睡”保留语境中可能的亲密暗示，但不将其明确为性关系。
    reason: cultural_note
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进去
  rationale: 该词是εἰσέρχομαι的简单过去时，表示进入某处；“进去”符合现代汉语叙事习惯，又保留了进入帐篷空间的动作。
- source_word: ἔκρουσε
  choice: 敲了敲
  rationale: κρούω可指击打或敲击；此处宾语是帐篷的帘子，情境更像在入口处发出示意声，因此译作“敲了敲”自然且不过分强化动作。
- source_word: αὐλαίαν
  choice: 帘子
  rationale: 在帐篷语境中，αὐλαία指悬挂的帘幕或门帘；“帘子”清楚自然，也避免“幔子”可能带来的礼仪性或古奥色彩。
- source_word: σκηνῆς
  choice: 帐篷
  rationale: σκηνή在本叙事中指何罗斐乃所住的帐篷，而非宗教性的会幕。
- source_word: ὑπενόειτο
  choice: 他以为
  rationale: 该形式表达当时的推想或认定。依上下文，推想者是巴哥阿；“以为”既自然，也表明这只是他的判断，并非叙述者确认的事实。
- source_word: καθεύδειν
  choice: 正……睡在一起
  rationale: καθεύδειν本义为睡觉；与μετά短语连用时译为“和……睡在一起”，保留原文在情境中的暗示，却不额外说明性关系。
- source_word: μετὰ Ἰουδείθ
  choice: 和友弟德……在一起
  rationale: μετά加属格表示“与……同在”；此译保留共同睡卧的含义及其可能暗示，不作超出原文的解释。
- source_word: Βαγώας
  choice: 巴哥阿
  rationale: 按现代汉语音译该人名，并与本书人名译法保持一致。
- source_word: αὐτόν
  choice: 何罗斐乃
  rationale: 希腊文使用阳性代词“他”，所指依上下文为何罗斐乃。汉语若连续使用“他”容易误指刚出现的巴哥阿，因此以人名明确所指，不改变原文人物关系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“敲了敲”呈现入口处示意的动作；“睡在一起”保留原文可能含有的亲密暗示而不加以坐实。为避免代词歧义，以“何罗斐乃”明确希腊文αὐτόν的指称。
