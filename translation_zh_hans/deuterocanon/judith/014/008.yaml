  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: zh_hans
  text: “现在，请把这些日子里你所做的事告诉我。”犹滴就在百姓中间[a]，把自她出去那天起，直到此时向他们讲话为止所做的一切，都告诉了他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在百姓面前”。希腊文既可强调她身处百姓中间，也可强调她公开面对百姓。
    reason: lexical_alternative
  - marker: b
    text: 或译“直到她对他们说话为止”。希腊文动词采用未完成时，既可能突出当时正在说话，也可能只是叙事中的时态用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: 告诉我
  rationale: 表达命令语气和“向我”的对象关系；在现代汉语中自然，也保留叙述、禀告所发生之事的含义。
- source_word: ὅσα ἐποίησας
  choice: 你所做的事
  rationale: 概括她已经完成的各项行动，不额外加入“成就”等评价色彩。
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: 这些日子里
  rationale: 既贴近原文的时间表达，也符合现代汉语习惯，不限定为某个更具体的时段。
- source_word: ἀπήγγειλεν αὐτῷ
  choice: 全都告诉了他
  rationale: 与前句“告诉我”形成词义呼应，并通过“全都”承接后面的 πάντα；“他”保留希腊文单数受事者。
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: 在百姓中间
  rationale: 保留原文的空间意象；此短语也可能强调公开站在百姓面前，故以脚注说明。
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: 她……所做的一切
  rationale: 希腊文迂回过去完成结构回顾她在讲述以前已经做完的事；汉语以语序和上下文自然表达其先时性。
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: 从出城那天起
  rationale: ἐξέρχομαι本义为“出去、离开”；结合叙事处境，“出城”比单说“出去”更清楚，但没有进一步指定目的地。
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: 直到向他们说话时
  rationale: 用“说话时”体现未完成时可能呈现的进行状态，同时不把这句话过度解释为某一段特定演说。
