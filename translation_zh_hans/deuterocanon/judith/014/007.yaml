base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: zh_hans
  text: 他们把他扶起来以后，他就俯伏在友弟德脚前，向她下拜，说：“你在犹大的每一处居所[a]和各国之中都是蒙福的；凡听见你名的，都必惊惶不安[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大的每一座帐棚”。希腊词σκηνώμα既可指“帐棚”，也可泛指“居所、住处”。
    reason: lexical_alternative
  - marker: b
    text: “惊惶不安”也可译为“受扰动”或“震动不安”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον
  choice: 把他扶起来
  rationale: 这里最自然地指把他从先前的姿势中扶起，既保留向上的动作，也不把词义抽象化为“接待”。
- source_word: προσέπεσεν τοῖς ποσὶν Ἰουδεὶθ
  choice: 俯伏在友弟德脚前
  rationale: 保留身体动作及表示敬意、恳求的语境，表达自然庄重。
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: 向她下拜
  rationale: προσκυνέω用于人际场景时可指俯伏致敬；“下拜”保留动作和敬意，而不限定为对神的敬拜。
- source_word: Εὐλογημένη σὺ
  choice: 你……是蒙福的
  rationale: 对应希腊文传统祝福用语，在现代汉语中庄重而清楚。
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: 在犹大的每一处居所
  rationale: σκηνώμα既可指帐棚，也可泛指居所；正文采用涵盖面较广的“居所”，以脚注保存具体的帐棚意象。
- source_word: ἐν παντὶ ἔθνει
  choice: 在各国之中
  rationale: 表达友弟德的声名和蒙福地位超出犹大，符合ἐν加与格的范围含义。
- source_word: ταραχθήσονται
  choice: 都必惊惶不安
  rationale: 保留将来被动所表达的受扰动状态，不把含义收窄为单纯恐惧或混乱。
theological_decisions:
- issue: προσκυνέω指向友弟德这一人类对象时的含义
  choice: 译为表示俯伏致敬的“向她下拜”
  alternative: 向她敬拜；在她面前俯伏致敬
  rationale: 语境中的对象是友弟德；该动词可表示敬拜，也可表示对人的伏地致敬。此处不引入神圣敬拜的限定，同时保留原文强烈的身体性敬礼动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扶起来”交代具体动作；“俯伏……下拜”保持叙事的身体感和敬礼意味。脚注标记按其实际解释对象分别置于“居所”和“惊惶不安”之后。
