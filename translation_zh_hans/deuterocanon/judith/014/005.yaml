base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: zh_hans
  text: 不过，在做这些事以前，你们要把亚扪人亚基奥叫到我这里来，好让他看见并认出[a]那个藐视以色列家、把他[b]送到我们这里来，如同把他送去受死[c]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文连续使用“看见”和“认出”两个动词，也可译作“看见并清楚知道”。
    reason: lexical_alternative
  - marker: b
    text: “他”最可能指亚基奥：藐视以色列家的人把亚基奥送到他们这里，仿佛是叫他去死。
    reason: alternative_reading
  - marker: c
    text: 或译：“等于送他去死。”希腊文直译为“仿佛送往死亡”，可能表示他被交出去时已如同必死的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: 不过，在做这些事以前
  rationale: πρό加冠词化不定式表示时间上的先后；δέ在此作轻微转折或承接，以“不过”自然表达。
- source_word: καλέσατέ μοι
  choice: 你们先把……叫到我这里来
  rationale: 复数命令式以“你们”体现，μοι表达“到我这里来”；“先”符合上下文中的时间次序。
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: 亚扪人亚基奥
  rationale: 人名按希腊文音译，族属名称采用现代中文圣经惯用的“亚扪人”。
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: 好让他亲眼看见并认出
  rationale: ἵνα加两个虚拟式表达目的；保留“看见”和“认出”两个连续动词，“亲眼”使前一动词在中文中自然有力。
- source_word: τὸν ἐκφαυλίσαντα
  choice: 那个藐视……的人
  rationale: ἐκφαυλίζω表示轻看、鄙视；“藐视”简洁庄重，并保留主动贬抑的语气。
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: 以色列家
  rationale: 保留圣经中以“家”指整个以色列群体的传统表达，不缩窄为某一家庭。
- source_word: καὶ αὐτὸν
  choice: 又把他
  rationale: αὐτόν最自然地回指亚基奥；正文仍保留代词，不把所指明说得超过原文。
- source_word: ὡς εἰς θάνατον
  choice: 仿佛送他去受死
  rationale: “仿佛”对应ὡς所保留的比较或限定意味；“去受死”自然表达εἰς θάνατον的趋向。
- source_word: ἀποστείλαντα εἰς ἡμᾶς
  choice: 送到我们这里来
  rationale: ἀποστέλλω在此取普通的“送来”，εἰς ἡμᾶς明确表示朝向说话者一方。
