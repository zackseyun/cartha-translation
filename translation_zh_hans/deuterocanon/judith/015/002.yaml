base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: zh_hans
  text: 战栗和恐惧临到他们，再也没有一个人还留在同伴面前；他们却一齐[a]溃散[b]，沿着平原和山区的每一条路逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同心一致地”；这里更可能是指众人一同或同时逃跑，并非和谐地同心行动。
    reason: lexical_alternative
  - marker: b
    text: 直译“被倾倒出来”；原文描绘军队在惊慌中散开，也可译作“四散”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: 临到
  rationale: 表达某种强烈感受突然落在众人身上，同时保留希腊文以单数动词统摄两个并列名词的整体效果。
- source_word: τρόμος καὶ φόβος
  choice: 战栗和恐惧
  rationale: 分别保留两个并列名词；“战栗”兼有发抖与惊骇之意，“恐惧”则表达较宽泛的害怕，不将二者合并为一个概念。
- source_word: οὐκ ἦν ἄνθρωπος μένων κατὰ πρόσωπον τοῦ πλησίον ἔτι
  choice: 再也没有一个人还留在同伴面前
  rationale: 保留原文“没有一个人”、持续停留以及“在同伴面前”的表达；“同伴”比“邻人”更符合军队溃逃的语境，同时不额外加入原文未明说的“阵线”或“站立”。
- source_word: ἐκχυθέντες
  choice: 溃散
  rationale: 该分词本义有“被倾倒出来、散开”之意；在军队惊慌逃亡的语境中，“溃散”自然传达队伍瓦解四散的画面。
- source_word: ὁμοθυμαδόν
  choice: 一齐
  rationale: 保留众人共同或同时行动的副词意义，又避免“同心合意”在此造成积极、和谐一致的误解。
- source_word: ἔφευγον ἐπὶ πᾶσαν ὁδὸν
  choice: 沿着每一条路逃跑
  rationale: 自然表达他们经由所有可走的道路逃离，并保留未完成时在叙事中所描写的持续逃亡场面。
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: 平原和山区
  rationale: 分别对应开阔平地与山地地区；“山区”在现代汉语中比直译为“山”更符合地理区域的含义。
theological_decisions: []
