  yaml_path: translation/deuterocanon/judith/015/013.yaml
  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: zh_hans
  text: 他们把何罗斐尼的帐幕，以及所有银器、卧榻、附属物件[a]和他的一切装备，都交给了友弟德。她接过这些东西，把它们驮在自己的骡子上；又套好自己的车辆[b]，把这些东西堆放在车上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“附属物件”的希腊词（ὅλκια）十分罕见，确切含义不明；也可能特指帷幔或其他帐幕配件。
    reason: lexical_alternative
  - marker: b
    text: 末句的希腊文连续使用代词，表达较为紧凑；这里理解为友弟德把物品堆放到车辆上。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: 帐幕
  rationale: 这里指军营中何罗斐尼居住的帐篷；“帐幕”既符合场景，也保持庄重的叙事语体。
- source_word: ἀργυρώματα
  choice: 银器
  rationale: 该词泛指银制物品；“银器”自然简洁，又不把范围限定为餐具。
- source_word: κλίνας
  choice: 卧榻
  rationale: κλίνη可指床或供斜卧的榻；“卧榻”保留两者之间的语义空间，并符合富贵陈设的语境。
- source_word: ὅλκια
  choice: 附属物件
  rationale: 此词罕见，确切所指不明，可能是帷幔等帐幕附属品；采用较宽泛的译法，避免武断限定。
- source_word: σκευάσματα
  choice: 装备
  rationale: 该词可泛指器具、装备或各样物品；在军营和战利品的语境中，“装备”贴切，并与前面的具体物件区分。
- source_word: ἡμίονον
  choice: 骡子
  rationale: 原词指骡子，虽词形可能特指母骡，但性别在此并非叙事重点，现代汉语通常直译为“骡子”。
- source_word: ἔζευξεν
  choice: 套好
  rationale: 该动词指给牲畜上轭或把牲畜套在车辆上；汉语说“套好车”简洁自然。
- source_word: ἁμάξας
  choice: 车
  rationale: 原词指用于运输的有轮车辆，可译为大车或货车；“车”避免加入原文未明说的具体式样。
- source_word: ἐσώρευσεν
  choice: 堆到
  rationale: 该动词有堆积、堆放之意；“堆到车上”保留物品大量装载的具体画面。
