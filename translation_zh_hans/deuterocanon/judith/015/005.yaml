base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: zh_hans
  text: 以色列众子听见后[a]，便齐心向他们猛攻，不停地击打他们，直到科巴。同样，从耶路撒冷和整个山区来的人也赶到了，因为他们已经得知仇敌营中发生的事；住在基列和加利利的人则包抄他们[b]，给他们以沉重打击[c]，直到他们越过大马士革及其边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”。希腊文直译为“以色列众子”。
    reason: lexical_alternative
  - marker: b
    text: “包抄”所译的军事动词也可表示越过他们、绕到他们前面，或在追击中截住他们。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“以重重一击”或“以重大打击”。在这里的战斗语境中，这句话可能指造成严重杀伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列众子
  rationale: 保留希腊文的亲属称谓及复数群体含义；现代汉语通常可译为“以色列人”，故以脚注说明较自然的译法。
- source_word: ὁμοθυμαδόν
  choice: 齐心
  rationale: 表达众人同心一致采取行动，简洁自然，也保留共同意志的意味。
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: 向他们猛攻
  rationale: 体现原文突然扑向、猛烈攻击的军事语气，比一般的“攻击”更有力度。
- source_word: ἔκοπτον αὐτούς
  choice: 一路不断击杀
  rationale: 以“不停”体现未完成时所表达的持续行动；战斗语境支持“击杀”，但不限定具体武器。
- source_word: ἕως Χωβά
  choice: 直到科巴
  rationale: ἕως与地名连用表示行动所达到的空间界限；Χωβά按希腊文音译。
- source_word: οἱ ἐξ Ἰερουσαλήμ καὶ ἐκ πάσης τῆς ὀρεινῆς
  choice: 从耶路撒冷和整个山区来的人
  rationale: 自然表达按来源地界定的人群，并将ὀρεινή译作地理意义明确的“山区”。
- source_word: παρεγενήθησαν
  choice: 赶到了
  rationale: 说明这些人来到战场；“赶”也符合得知消息后迅速来援的上下文。
- source_word: τὰ γεγονότα τῇ παρεμβολῇ τῶν ἐχθρῶν αὐτῶν
  choice: 他们仇敌营中发生的事
  rationale: 忠实保留事件发生于其仇敌营中的信息，语序符合现代汉语。
- source_word: ὑπερεκέρασαν αὐτούς
  choice: 包抄他们
  rationale: 该复合动词可指越过、绕到前面或截断对方；追击语境中“包抄”传达军事行动，同时以脚注保留歧义。
- source_word: πληγῇ μεγάλῃ
  choice: 大肆击杀
  rationale: 在战斗语境中，字面“重重一击／重大打击”很可能指造成严重杀伤；正文采用自然军事表达，脚注保留较字面的可能。
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: 直到他们越过大马士革及其边界
  rationale: 保留παρῆλθον“经过、越过”的空间动态，也保留“他们”所指可能依上下文理解的形式。
