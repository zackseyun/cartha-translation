  terminology: 地名音译“科巴”、基列、加利利和大马士革可保留。“包抄”作为ὑπερεκέρασαν的正文译法可行，脚注已恰当保留“越过／绕到前面／截住”的语义范围。πληγῇ μεγάλῃ宜译为“沉重打击”，不宜在正文预断为“击杀”。
