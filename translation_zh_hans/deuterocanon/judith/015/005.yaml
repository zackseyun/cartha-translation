- from: 以色列众子听见后[a]，便齐心向他们猛攻，一路不断击杀，直到科巴。同样，从耶路撒冷和整个山区来的人也赶到了，因为有人已经把他们仇敌营中发生的事告诉了他们；住在基列和加利利的人则包抄他们，大肆击杀[b][c]，直到他们越过大马士革及其边界。
  to: 以色列众子听见后[a]，便齐心向他们猛攻，不停地击打他们，直到科巴。同样，从耶路撒冷和整个山区来的人也赶到了，因为他们已经得知仇敌营中发生的事；住在基列和加利利的人则包抄他们[b]，给他们以沉重打击[c]，直到他们越过大马士革及其边界。
  rationale: 修订收束两处超出原文的“击杀”表述：前者改为持续“击打”，后者改为“沉重打击”，同时以脚注保留战斗语境中可能包含严重杀伤的理解。并简化消息传达的表述，避免补出原文未指定的施事者；其余军事和地理表述予以保留。
