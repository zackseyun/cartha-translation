  yaml_path: translation/deuterocanon/judith/015/016.yaml
  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: zh_hans
  text: 友弟德在全体以色列人中领唱这篇颂谢[a]，众百姓都应和这赞美[b]；友弟德说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颂谢”也可译作“称颂”“感谢”或“公开承认”；原词在圣经希腊语中有这些相关含义。
    reason: lexical_alternative
  - marker: b
    text: “应和”所译的动词含有出声回应的意思，可能指对答式或轮唱式的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: 唱出
  rationale: 此处动词带宾语，结合随后引出的诗歌，并非单纯表示空间上的“出去”，而是指领唱或发出歌辞。希腊语未完成时所含的展开性，在汉语叙事中由语境自然体现。
- source_word: ἐξομολόγησιν
  choice: 颂谢
  rationale: 该词在圣经希腊语中可指公开承认、称颂或感谢；此处为诗歌语境，“颂谢”兼顾称颂与感谢，并与下句的“赞歌”保持词汇区别。
- source_word: ἐν παντὶ Ἰσραήλ
  choice: 在全以色列中
  rationale: 保留原文可兼指地域范围与整个群体的表达，不缩窄为单一含义。
- source_word: ὑπεφώνει
  choice: 应和
  rationale: 该动词表示以声音回应，可能带有轮唱或对唱意味；“应和”自然传达群众回应领唱的情景。
- source_word: πᾶς ὁ λαὸς
  choice: 众百姓
  rationale: 自然表达全体民众，同时保留集合性。
- source_word: αἴνεσιν
  choice: 赞歌
  rationale: 本义为赞美；在当前歌唱语境中译作“赞歌”较自然，并与“颂谢”有所区别。
- source_word: εἶπεν
  choice: 说
  rationale: 作为后续诗歌的引语提示，采用简洁自然的叙事用语。
theological_decisions:
- issue: 是否把 ἐξομολόγησις 与 αἴνεσις 合并译为同一个赞美用语
  choice: 分别译作“颂谢”和“赞歌”
  alternative: 两者都译作“赞美”或“称颂”
  rationale: 原文相邻使用两个不同名词；区分翻译可避免抹平修辞，也不把 ἐξομολόγησις 限定为认罪。
- issue: ἐξομολόγησις 是否表示认罪
  choice: 按诗歌语境理解为公开的颂谢
  alternative: 译作“认信”或“承认”
  rationale: 上下文是全体百姓回应的赞歌，而非承认罪过；“颂谢”保留其向神公开称谢的宗教含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“唱出”“应和”呈现诗歌及群体回应的场景；句末用冒号承接下一节友弟德的歌词。
