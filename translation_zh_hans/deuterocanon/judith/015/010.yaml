base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: zh_hans
  text: 这一切都是你亲手完成的；你为以色列[a]行了美善的事，上帝也喜悦这些事[b]。愿你蒙全能的主赐福，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为以色列”也可译作“与以色列一起”；希腊文介词通常有“与……一起”的意思，但这里更可能是指所行之事使以色列得益。
    reason: lexical_alternative
  - marker: b
    text: “这些事”或指前面所说的美善之事；也可能指以色列人，即“上帝也喜悦他们”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα ἐν χειρί σου
  choice: 这一切都是你亲手完成的
  rationale: “亲手完成”自然传达 ἐν χειρί σου 的工具性和生动意味；“这一切”涵盖 πάντα ταῦτα 的总体指向，同时保持已完成行动的语气。
- source_word: τὰ ἀγαθὰ
  choice: 美善的事
  rationale: 保留带冠词的中性复数实质用法，不将其进一步解释为“恩惠”或“功绩”。
- source_word: μετὰ Ἰσραήλ
  choice: 为以色列
  rationale: μετά 通常可表示“与……一起”，但在“行美善的事”之后，此处最自然地表达有利于以色列的受益关系；脚注保留较直译的可能。
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς
  choice: 上帝也喜悦这些事
  rationale: 将复数代词主要理解为回指前面的“美善的事”，以自然汉语表达上帝的悦纳；脚注说明也可能指以色列人。
- source_word: εὐλογημένη γίνου
  choice: 愿你……蒙……赐福
  rationale: 命令式在祝福语境中具有祝愿和宣告色彩，“愿你蒙……赐福”比直译“你要成为有福的”更符合现代汉语的祝福表达。
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: 蒙全能的主赐福
  rationale: 以汉语常用的主动施事结构清楚表达 παρά 与格在祝福公式中的来源或施事意义，并保留“主”和“全能”的神圣称号。
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: 直到永远
  rationale: 这是表达持续无尽时间的惯用语；“直到永远”简洁、庄重，也适合祝福语体。
theological_decisions:
- issue: κύριος 在希腊文祝福公式中的译法
  choice: 主
  alternative: 主人
  rationale: 此处 κύριος 是对上帝的称号，译作“主”既符合语境，也避免“主人”在现代汉语中产生世俗主仆关系的联想。
- issue: εὐλογημένη γίνου 的语气
  choice: 愿你蒙……赐福
  alternative: 你要蒙福
  rationale: 虽然原文形式上是命令式，但在此处发挥祝福和祝愿功能；采用“愿”保留其礼仪性和施行性的语气，而不把它误读为一般命令。
- issue: ἐπʼ αὐτοῖς 的指代
  choice: 主要回指所行的美善之事
  alternative: 指以色列人
  rationale: 代词在数和性上与 τὰ ἀγαθὰ 相合，因此主文采用这一较直接的回指；但以色列可按集合意义理解为人民，故在脚注保留另一可能，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲手完成”保留原文手的意象而不显生硬；“美善的事”较“好事”更适合正式经文语体；末句使用汉语祝福公式“愿你蒙……赐福，直到永远”。所有脚注标记均置于相应主文位置。
