  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: zh_hans
  text: 其余住在伯图利亚的人袭击了亚述的营地[a]，又追赶他们[b]，大肆掠夺[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“亚述军营”。希腊文直译为“亚述的营地”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文这一表达直译为“跟在他们后面走”；在这里的战斗语境中，意思是“追赶他们”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“大大掠夺”或“从营中掠夺了许多财物”。希腊文没有明说掠夺的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ οἱ κατοικοῦντες Βαιτυλουὰ
  choice: 留在伯图利亚的其余人
  rationale: οἱ λοιποί指“其余的人”，分词短语οἱ κατοικοῦντες Βαιτυλουὰ说明他们是住在伯图利亚的人；结合上下文译作“留在……的其余人”，自然地表达群体转换。δέ在此仅作轻微承接，不必机械译出。
- source_word: ἐπέπεσαν
  choice: 袭击了
  rationale: 该动词在军事语境中表示突然扑向或攻击；“袭击”既保留敌对行动的力度，也符合现代汉语叙事。
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: 亚述的营地
  rationale: παρεμβολή在这里指军营；Ἀσσούρ为属格形式，直译为“亚述的营地”，不强行改成更具体的“亚述军营”。
- source_word: ἐπορεύοντο αὐτούς
  choice: 追赶他们
  rationale: πορεύομαι通常指行走、前往，但这里带人称宾语并处于溃军战斗语境，意为“跟在他们后面追赶”；译文表达语境义，并以脚注保留字面信息。
- source_word: ἐλούτησαν σφόδρα
  choice: 大肆掳掠
  rationale: ἐλούτησαν表示抢掠、掳掠，σφόδρα加强程度。“大肆掳掠”是简洁自然的现代汉语，同时避免补入希腊文未明说的宾语或战利品数量。
