  yaml_path: translation/deuterocanon/judith/015/014.yaml
  text: And every woman of Israel ran together to see her[a], and they blessed her, and they made a dance for her from among themselves; and she took thyrsi in her hands and gave them to the women with her[b],
translation:
  language: zh_hans
  text: 以色列的妇女全都赶来见她[a]。她们称颂她，并从她们中间组成舞队为她起舞。友弟德手拿节庆杖，又把它们交给与她在一起的妇女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的每一个妇女”，这里是集合性单数，指以色列所有的妇女。
    reason: lexical_alternative
  - marker: b
    text: “节庆杖”指庆典或仪式游行中使用的手杖。
    reason: cultural_note
lexical_decisions:
- source_word: συνέδραμεν
  choice: 赶来
  rationale: 该动词表示迅速汇聚；“赶来”既保留急切、快速的意味，也符合现代汉语表达。
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: 以色列的妇女全都
  rationale: 希腊文使用集合性单数，实际指以色列全体妇女；汉语用复数式表达更自然，并以脚注说明原文形式。
- source_word: εὐλόγησαν αὐτήν
  choice: 称颂她
  rationale: εὐλογέω可表示祝福或赞颂；在妇女欢迎并尊崇友弟德的场景中，“称颂”自然，同时保留其带有宗教色彩的褒扬意味。
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: 从她们中间组成舞队为她起舞
  rationale: χορός可指舞队或集体舞蹈；此译同时表达由这些妇女组成队伍和为友弟德起舞的意思。
- source_word: θύρσους
  choice: 节庆杖
  rationale: θύρσος指庆典或仪式游行所用的杖；“节庆杖”比音译更便于普通读者理解，又避免无依据地限定其具体装饰。
- source_word: ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: 与她同来的妇女
  rationale: 明确指当时陪同友弟德的妇女，符合上下文和现代汉语习惯。
