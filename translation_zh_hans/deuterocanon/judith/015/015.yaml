  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
translation:
  language: zh_hans
  text: 她和随行的妇女都戴上橄榄枝编的花冠[a]。她在全体民众前面跳舞前行，带领着所有妇女[b]；以色列所有男子都武装着，头戴花冠，口中唱着颂歌，跟在后面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面近于“她和随行的妇女以橄榄（枝叶）加冠”；动词的中间语态表明主语参与并关涉自身。这里指她们戴上节庆或凯旋用的橄榄枝花冠。
    reason: 说明中间语态及“橄榄”在加冠语境中所隐含的花冠意义，同时避免把中间语态过度限定为严格反身用法。
  - marker: b
    text: “跳舞前行”也可理解为“在舞蹈中前行”或“列成歌舞队伍前行”；原词既可指舞蹈，也可指有组织的歌舞行列。
    reason: 保留χορεία在舞蹈活动与歌舞队列之间的词义幅度。
lexical_decisions:
- source_word: ἐστεφανώσαντο
  choice: 都戴上了……花冠
  rationale: 该词为中间语态复数，后置主语是“她和与她同行的妇女”，表示她们给自己戴上花冠；这样比理解为别人单独给友弟德加冠更符合希腊语句法。
- source_word: τὴν ἐλαίαν
  choice: 橄榄枝编成的花冠
  rationale: 字面为“橄榄树／橄榄枝叶”，与“加冠”动词连用时，指以橄榄枝叶制成的节庆或凯旋花冠。
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: 她和与她同行的妇女
  rationale: 阴性复数表达与友弟德同行的人；下文明确提到众妇女，因此将性别关系明说。
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: 她走在全体民众前面
  rationale: 表达她在庆祝队伍中居于众人之前，不额外暗示她从某处离开。
- source_word: ἐν χορείᾳ
  choice: 跳舞前行
  rationale: χορεία可指舞蹈活动，也可指有组织的歌舞行列；正文采用自然且不过度技术化的表达，歧义在脚注说明。
- source_word: ἡγουμένη πασῶν τῶν γυναικῶν
  choice: 领着所有妇女
  rationale: 准确表达友弟德在众妇女中的带领角色。
- source_word: ἐνωπλισμένοι
  choice: 全副武装
  rationale: 该分词表示携带武器、处于武装状态；现代汉语“全副武装”简洁清楚。
- source_word: μετὰ στεφάνων
  choice: 头戴花冠
  rationale: 凯旋庆典语境中的στέφανοι是节庆花冠，并非王权冠冕；中文补出佩戴位置，使画面自然。
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: 口中唱着颂歌
  rationale: 保留“在口中”的具体意象，同时以自然汉语说明颂歌正在被唱出。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式呈现凯旋队伍的行进层次，以“花冠”区别于王权性的“冠冕”，并保留希腊文对歌舞庆典和武装男子并置的画面。
