  text: 全体百姓都说：“愿如此。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: 全体百姓
  rationale: 准确表达全体共同回应；“百姓”符合经文叙事语体，也自然易懂。
- source_word: Γένοιτο
  choice: 愿如此
  rationale: 这是 γίνομαι 的祈愿式，直指“愿这事成就／愿如此”，而非希腊文 ἀμήν。译作“愿如此”既保留祈愿语气，也避免把原文词汇改成“阿们”。
theological_decisions:
- issue: 是否依照英文审校层译作“阿们”
  choice: 愿如此
  alternative: 阿们
  rationale: 现存希腊文本为 Γένοιτο，不是 ἀμήν；应优先依据原文保留其祈愿含义。虽然“阿们”在功能上可作群体认同回应，但会遮蔽这里实际使用的希腊词。
translation_notes:
  register: 采用简洁、庄重的现代汉语。“全体百姓”体现 πᾶς 的整体性；引语用“愿如此”保留原文的祈愿式语气。
