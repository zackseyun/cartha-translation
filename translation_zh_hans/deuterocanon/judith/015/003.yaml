  yaml_path: translation/deuterocanon/judith/015/003.yaml
  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: zh_hans
  text: 那些驻扎在伯突利亚周围山区的人转而逃跑；于是，以色列的子孙中，凡属战士的男子都向他们涌去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他们涌去”直译为“倾泻到他们身上”，描写战士如洪流般涌出。
    reason: 保留希腊文ἐξέχυθησαν的生动隐喻。
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: 那些驻扎……的人
  rationale: 完成时分词作名词用，指已经扎营或部署在那里的人；“驻扎”保留军事语境，也符合现代汉语表达。
- source_word: ἐν τῇ ὀρεινῇ
  choice: 山区
  rationale: ὀρεινή指多山的地区或高地，并非一座具体的山；“山区”自然准确。
- source_word: κύκλῳ Βαιτυλουὰ
  choice: 伯突利亚周围
  rationale: κύκλῳ在地名旁表达环绕或周边的空间关系；“周围”简明自然。
- source_word: ἐτράπησαν εἰς φυγήν
  choice: 转身逃跑
  rationale: 该军事习语意为转而逃亡；“转身逃跑”既保留动态形象，又比生硬的“转入逃亡”自然。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列的子孙
  rationale: 保留希腊文传统族群称谓的“子孙”意象，不将其完全泛化为“以色列人”。
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: 凡是战士
  rationale: πᾶς配单数ἀνήρ具有逐一而概括的分配意义；结合军事语境，“凡是战士”在现代汉语中自然，并未暗示非战斗人员参战。
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: 冲出去攻击他们
  rationale: ἐκχέω的被动形式在此以倾泻作比喻，描写军队汹涌出击；正文采用自然的动态表达，并以脚注保留原文形象。
theological_decisions:
- issue: 带性别色彩的族群和军事用语
  choice: 以色列的子孙，凡是战士
  alternative: 以色列人，所有能作战的男子
  rationale: “以色列的子孙”保存传统族群表达；πᾶς ἀνὴρ πολεμιστής明确处于男性战士的军事语境，但逐字译成“每个男人战士”不合汉语。“凡是战士”自然传达其分配范围，不把范围扩大到全体百姓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“伯突利亚”沿用常见次经地名译法；句法尽量保留原文先叙敌军溃逃、再叙以色列战士出击的推进关系。
