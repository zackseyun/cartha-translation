base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: zh_hans
  text: 乌西雅派人到贝托马斯泰姆、科拜、科拉和以色列全境，报告所发生的事，并叫众人都涌出去[a]攻击敌人，将他们消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“使众人都倾泻出去攻击敌人”，形容人群大批涌出发动攻击。
    reason: 说明原文的形象化军事用语及其字面意义。
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派人
  rationale: 在叙事中自然表达“差遣”之意；后接目的性分词“报告”，可清楚表明这些人是报信者。
- source_word: Ὀζίας
  choice: 乌西雅
  rationale: 采用现代中文圣经传统中对该人名的常见译名。
- source_word: Βαιτομασθαΐμ
  choice: 贝托马斯泰姆
  rationale: 此地名的确切对应不明，按斯威特希腊文本作较贴近原音的音译。
- source_word: Χωβὰι
  choice: 科拜
  rationale: 按希腊文形式音译；各语言传统中的拼写并不一致。
- source_word: Χωλὰ
  choice: 科拉
  rationale: 按希腊文形式作简明音译。
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: 以色列全境
  rationale: ὅριον在此指地域、疆域，而非仅指边界线；“全境”简洁自然。
- source_word: τοὺς ἀπαγγέλλοντας
  choice: 派人……报告
  rationale: 实词化分词指受差遣去传报消息的人；中文以“派人……报告”表达其身份和任务最自然。
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: 所发生的事
  rationale: 完成时分词指已经完成或发生的事件；保留概括性，不擅自具体化为某一项战果。
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: 叫众人都涌出去
  rationale: 字面为“使众人都倾泻出去”，在军事语境中形容大批人迅速出动；“涌出去”保留原文意象且符合现代汉语。
- source_word: τοῖς πολεμίοις
  choice: 攻击敌人
  rationale: 与表示向外涌出的动词连用时，该与格表示敌对行动的对象；中文补出“攻击”以明确语义。
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: 将他们消灭
  rationale: ἀναίρεσις在军事语境中指除灭或毁灭；采用目的性表达，保留原文严厉程度而不强化为特指屠杀。
theological_decisions:
- issue: 军事叙事中的暴力措辞
  choice: 将他们消灭
  alternative: 为要毁灭他们；将他们杀戮
  rationale: 原文明确以消灭敌人为行动目的。“消灭”忠实保留暴力含义，同时不像“杀戮”那样增添原词未必要求的方式色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名沿用常见译法“乌西雅”，三个出处不确定的地名则依希腊文音译。句法保留“报告……并叫……”的双重目的结构；暴力措辞不淡化，也不作超出原文的强化。
