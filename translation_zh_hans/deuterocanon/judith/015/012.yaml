lexical_decisions:
- source_word: ἐλαφύρευσεν
  choice: 掳掠
  rationale: 该动词指从战败者那里夺取战利品。“掳掠”简洁自然，并保留军事语境中的夺取战利品之意。
- source_word: πᾶς ὁ λαός
  choice: 全体百姓
  rationale: 该短语指整个群体。“全体百姓”忠实表达其整体性，又不把他们具体限定为军队。
- source_word: τὴν παρεμβολήν
  choice: 那营地
  rationale: παρεμβολή在这里指上下文中已经明确的军营；“那营地”自然简明，也没有把原文未明说的“敌军”加入正文。
- source_word: ἐφʼ ἡμέρας τριάκοντα
  choice: 共三十天
  rationale: 该介词短语表示持续时间。“共三十天”符合现代汉语表达，并清楚保留持续的时长。
