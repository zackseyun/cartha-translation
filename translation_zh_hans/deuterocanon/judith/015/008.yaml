base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: zh_hans
  text: 住在耶路撒冷的大祭司约雅金和以色列子孙的长老议会[a]前来，要观看主为以色列所成就的美事，也要见友弟德，并同她说平安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列人”；希腊文保留了这一传统的群体称号。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译是“与她说平安”；这可指向她问安、以和平相待，或向她表示祝贺。
    reason: idiom_clarification
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: 约雅金
  rationale: 按希腊文人名音译，并采用现代中文圣经语境中自然、易辨识的形式。
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: 大祭司
  rationale: 这是该祭司最高职分在现代汉语中的标准称谓。
- source_word: ἡ γερουσία
  choice: 长老会
  rationale: 该词指由长老组成的议事或治理团体；“长老会”既体现其成员性质，也比“元老院”少罗马制度色彩。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙的
  rationale: 保留原文传统的群体称号“以色列子孙”，不将其简化为“以色列人”。
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: 住在耶路撒冷的
  rationale: 依希腊文就近修饰的句法，可指大祭司和长老会这一复合主语；置于句首使中文关系清楚自然。
- source_word: τὰ ἀγαθὰ ἃ ἐποίησεν Κύριος τῷ Ἰσραήλ
  choice: 主为以色列所成就的美事
  rationale: “美事”保留 τὰ ἀγαθὰ 的宽泛含义，涵盖有益的作为与结果，不具体化为单纯“祝福”。
- source_word: Κύριος
  choice: 主
  rationale: 这是 κύριος 指以色列的神时庄重而通行的中文译法。
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: 向她说祝福平安的话
  rationale: 原文直译为“与她说平安”，带有闪语式表达；正文以自然中文传达向她和平问候、祝贺的含义，同时由脚注保留字面形式。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 原文只有 κύριος；译作“主”忠实保留七十士译本的称谓，也不额外确定其背后的希伯来神名形式。
- issue: τῶν υἱῶν Ἰσραήλ 的群体称号
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文具有家族和盟约色彩的传统称号，同时不把它误解为仅指当场的成年男性。
- issue: λαλῆσαι μετʼ αὐτῆς εἰρήνην 的含义
  choice: 向她说祝福平安的话
  alternative: 与她说平安；向她和平地说话
  rationale: 此习语可表示和平问候或祝贺。正文传达其自然语用意义，脚注说明字面表达，避免将其收窄为一般的温和说话。
translation_notes:
  register: 采用现代、庄重而通顺的叙事文体。“美事”保留原文语义宽度；“祝福平安的话”使闪语式习语在中文中可理解，并以脚注呈现其字面形式。
