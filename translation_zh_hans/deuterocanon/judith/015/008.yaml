  source_fidelity: “祝福平安的话”把原文的“说平安”（λαλῆσαι ... εἰρήνην）扩展为施予祝福，语义偏强；原文更稳妥地保留了和平问候、和好致意或祝贺的开放性。另，“长老会”在现代中文中容易带出特定教会宗派机构的联想，未必准确表达γερουσία所指的犹太长老治理议会。
  naturalness: 句子整体通顺庄重。“看看”稍偏口语，改为“观看”更配合叙事的正式语体及θεάσασθαι的观看、瞻看意味。“同她说平安”虽带有圣经式表达，但正文可由脚注解释，且较能避免过度释义。
  terminology: “约雅金”“大祭司”“以色列子孙”“主”均可接受。“长老议会”比“长老会”更中性、准确地表达γερουσία。“美事”能够保留τὰ ἀγαθὰ所涵盖的有益作为或福惠，不必改动。
