  - severity: low
    issue: “长老会”可能带有现代宗派联想
    rationale: γερουσία指由长老构成的议事、治理团体；“长老议会”在此较少指向现代教会制度。
  - severity: low
    issue: “看看”语体略口语
    rationale: 改作“观看”更符合全句庄重叙事语体，并较好体现θεάσασθαι。
