revisions:
- from: 住在耶路撒冷的大祭司约雅金和以色列子孙的长老会[a]前来，要看看主为以色列所成就的美事，也要见友弟德，向她说祝福平安的话[b]。
  to: 住在耶路撒冷的大祭司约雅金和以色列子孙的长老议会[a]前来，要观看主为以色列所成就的美事，也要见友弟德，并同她说平安[b]。
  rationale: 修订避免把“说平安”的习语额外译成“祝福”，以保留原文语义的开放性；将γερουσία译为“长老议会”，减少现代宗派制度的联想；并以“观看”维持庄重而自然的叙事语体。脚注锚点均保留并与对应词语相符。
