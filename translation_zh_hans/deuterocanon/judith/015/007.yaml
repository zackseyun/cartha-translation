base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/007.yaml
  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
translation:
  language: zh_hans
  text: 以色列人[a]从杀戮中归来，制服了其余的人。山区和平原的村庄和农庄[b]也夺得许多战利品[c]，因为数量极其庞大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“乡间住所”或“乡间聚落”。这个词可指乡间住所、农庄或小型聚落。
    reason: lexical_alternative
  - marker: c
    text: 或译“许多掳获物”或“许多掳物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 希腊文直译为“以色列的众子”，但现代汉语通常以“以色列人”自然表达这一民族称谓；脚注保留字面形式。
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  choice: 从杀敌之处返回
  rationale: ἀναστρέψαντες表示返回；κοπή在军事语境中指砍杀或杀戮。“杀敌之处”既传达暴力战事背景，也避免汉语“从杀戮返回”可能产生的生硬感。
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: 占领了其余的一切
  rationale: κυριεύω表示取得控制或占有；τῶν λοιπῶν所指略有含混，可指剩余的人或物。译作“其余的一切”保留宽泛指向，不擅自限定为残敌或财物。
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: 村庄和乡间聚落
  rationale: κῶμαι指村庄；ἐπαύλεις可指乡间住所、农庄或小型聚落。“乡间聚落”在现代汉语中清楚自然，并保留词义范围。
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: 山区和平原上的
  rationale: 以自然的现代汉语表达两个地理区域，同时保持原文的对举。
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: 夺得许多战利品
  rationale: κρατέω在此指夺取或取得；λάφυρα是战争中掳获的财物。“夺得许多战利品”准确且符合现代汉语习惯。
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: 因为战利品多得不可胜数
  rationale: 原文用πλῆθος、πολύ、σφόδρα叠加强调数量极多。汉语以“多得不可胜数”自然传达这一强烈程度；根据近接语境补出“战利品”。
