  register: 采用庄重而清晰的现代标准汉语。“以色列人”避免不自然的直译，“战利品”保留军事语境。将希腊文两个并列主语分别成句，以免汉语长句产生指代混乱；未把“其余的”明确限定为人或物，从而保留原文歧义。
