lexical_decisions:
- source_word: Καὶ
  choice: 就
  rationale: 承接前文并连接听见后的反应；现代汉语用“就”自然表达叙事推进，而不额外强化时间上的即时性。
- source_word: ὡς
  choice: ……听见……
  rationale: 与不定过去时ἤκουσαν构成时间从句；汉语以主句中的“听见……就……”表达“当……时”，简洁自然。
- source_word: ἤκουσαν
  choice: 听见
  rationale: 保留基本的听闻义，不解释为“得知”。
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: 住在帐篷里的人
  rationale: 忠实保留分词短语的范围，不把这些人明确限定为男性。
- source_word: σκηνώμασιν
  choice: 帐篷
  rationale: 军事营地语境中指帐篷或营帐；“帐篷”是清楚、自然的现代用语。
- source_word: ἐξέστησαν
  choice: 惊慌失措
  rationale: ἐξίστημι可指因震惊而失常、惊愕；此处上下文是敌营遭逢突变后的强烈反应，“惊慌失措”比单纯“惊讶”更能保留该词的力度。
- source_word: ἐπὶ τὸ γεγονός
  choice: 因所发生的事
  rationale: 自然表达对已经发生之事作出的反应，并保留γεγονός的完成意味。
