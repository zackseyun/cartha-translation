  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: zh_hans
  text: 他们来到她面前时，众人都同心一致地祝福她，对她说：“你是耶路撒冷的尊荣[a]，你是以色列极大的夸耀，你是我们民族极大的荣耀[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“高处”或“高举”；希腊词带有被抬高、升高的意象。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”也可译作“夸耀”或“可夸耀之事”。希腊词指使人引以为荣、可以夸耀的人或事。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: 来到她那里
  rationale: εἰσῆλθον本有“进入”之意，πρὸς αὐτήν指向她、到她面前；结合语境，现代汉语用“来到她那里”自然表达众人进入她所在之处，又不弱化趋向性。
- source_word: εὐλόγησαν
  choice: 为她祝福
  rationale: 该动词可指祝福或称颂；此处随后是正式的赞颂语，译作“为她祝福”保留其基本意义和庄重语气。
- source_word: πάντες ὁμοθυμαδόν
  choice: 众人同心一致地
  rationale: πάντες强调所有人，ὁμοθυμαδόν强调同心、意见一致；此译同时保留两个要素。
- source_word: ὕψωμα
  choice: 高举
  rationale: 该名词表示高度、高升或被高举之物；“高举”保留耶路撒冷因友弟德而被抬高、得尊荣的形象，避免直接化约为“骄傲”或泛化为“荣耀”。
- source_word: γαυρίαμα
  choice: 极大的夸耀
  rationale: 该词指欢欣自豪或可夸耀之事；“夸耀”保留公开称扬以及以之为荣的具体意味。
- source_word: καύχημα
  choice: 极大的荣耀
  rationale: 该词常指夸口、可夸之事或引以为荣之物；正文译作“荣耀”既传达荣誉性的赞颂，也保留与前一分句γαυρίαμα的修辞变化，另以脚注说明较直译的可能。
- source_word: τοῦ γένους ἡμῶν
  choice: 我们民族
  rationale: γένος在此指共同血统与身份构成的群体；“民族”符合上下文中的以色列共同体，也避免现代汉语“种族”可能带来的误导。
theological_decisions:
- issue: 以崇高的城邦与民族称号赞颂友弟德
  choice: 按原文直接保留三重平行的公共赞颂，不弱化为一般性称赞。
  alternative: 将三项统一意译为“骄傲”或“荣光”等较平顺但区分度较低的表达。
  rationale: 希腊文以三个平行述语正式宣告友弟德在耶路撒冷、以色列和本民族中的尊荣；直陈其赞誉可保留经文的修辞力度，同时不额外赋予这些称号超出语境的教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文三句“你是……”的排比和“极大的”重复，以呈现公开祝福的礼仪性与气势；不用古奥称谓，也不把三个近义荣誉词全部合并。
