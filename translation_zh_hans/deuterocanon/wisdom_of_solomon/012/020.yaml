base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: zh_hans
  text: 因为，如果你对你儿女的仇敌，就是那些罪该处死的人，尚且如此看重，带着极大的关切和恳求来对待他们[a]，给他们时间和机会，使他们可以借此摆脱邪恶，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关切和恳求”直译原文两个词，分别有“留意、关注”和“恳求、祈求”之意；结合上下文，后者也可理解为宽容或忍耐。
    reason: 保留 δέησις 的通常词义及其在本处按上下文理解的可能性，避免在正文中消除歧义。
lexical_decisions:
- source_word: ἐχθροὺς
  choice: 仇敌
  rationale: 指敌对者；“仇敌”在庄重而现代的经文语体中自然，并保留其强烈的敌对含义。
- source_word: παίδων σου
  choice: 你儿女的
  rationale: παῖς 可指孩子、儿子或仆人；本处按上下文采用亲属含义，并用“儿女”避免无根据地限定为男性。
- source_word: ὀφειλομένους θανάτῳ
  choice: 该死的人
  rationale: 该短语字面表示“欠死亡之债”或“对死亡负有责任”；“该死”简洁传达其司法性的死亡定罪含义。
- source_word: ἐτίμησας
  choice: 看重
  rationale: 保留 τιμάω“尊重、看重”的基本词义，也保留上帝竟如此对待仇敌所形成的修辞张力；比单纯译成“对待”更贴近原文。
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: 以极大的关切和恳劝对待他们
  rationale: προσοχή 表示留意、关注；δέησις 通常表示恳求、祈求。译作“关切和恳劝”优先保留原词的语义张力，不把它直接解释为“忍耐”或“宽容”。补出“对待他们”使中文句法完整。
- source_word: δοὺς χρόνους καὶ τόπον
  choice: 给他们时间和机会
  rationale: χρόνοι 是时间、期限；τόπος 字面为地方、空间，在此可指余地或机会。“时间和机会”自然表达获准改变的时机。
- source_word: διʼ ὧν ἀπαλλαγῶσι
  choice: 使他们可以借此摆脱
  rationale: 保留 διʼ ὧν 的工具性“借此”，并以“可以”表达虚拟式所含的可能性；“摆脱”传达 ἀπαλλάσσω 的脱离含义。
- source_word: τῆς κακίας
  choice: 邪恶
  rationale: κακία 在此泛指道德上的恶；“邪恶”既可指恶行，也可指邪恶状态。
theological_decisions:
- issue: δέησις 用来描述上帝对待该死之仇敌时的含义
  choice: 正文译为“恳劝”，保留“恳求、劝请”这一较直接的词义及其神学张力。
  alternative: 按上下文解释为“宽容”“忍耐”或“容让”。
  rationale: 上下文确实强调延迟惩罚、给人离恶的机会，但原词本身通常指恳求或祈求。正文不宜无声地把这个罕见表述改释成神学上更顺畅的“忍耐”；脚注说明其语义与上下文解释空间。
- issue: παῖδες 与上帝的关系
  choice: 译为“儿女”，保留亲属性表达且不限定性别。
  alternative: 译为“儿子”或“仆人”。
  rationale: παῖς 本身有多义性；本节论证中的对比适合亲属含义，但不应引入男性限定，也不宜断然排除“仆人”这一词典义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看重”刻意保留原文 τιμάω 的反常张力；句末保留逗号，因为本节在希腊文中是尚未完结的条件从句，论证延续至下一节。
