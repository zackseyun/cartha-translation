base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: zh_hans
  text: 因此，你也借着他们自己的可憎之物[a]折磨了那些一生愚昧、行事不义的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”也可译作“可憎的行为”。希腊文可泛指令人厌恶的事物，包括偶像崇拜的行为或对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν καὶ
  choice: 因此……也
  rationale: ὅθεν承接上文作推论，译为“因此”；καὶ在此有追加、呼应之意，译为“也”。
- source_word: τοὺς ... ἀδίκους
  choice: 行事不义的人
  rationale: 希腊文以冠词加形容词实词化，指被不义所刻画的人；此译自然，并保留道德与公义层面的含义。
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  choice: 一生愚昧
  rationale: βιώσαντας指他们生活、度日，ἀφροσύνη指缺乏明辨的愚昧；以“一生愚昧”简洁表达其生活方式，同时不把紧凑的属格结构解释得过细。
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: 借着他们自己可憎之物
  rationale: διά加属格最自然地表示手段；βδελύγματα可泛指可憎的事物、行为或偶像崇拜相关对象，因此正文保留较宽泛的表达。
- source_word: ἐβασάνισας
  choice: 折磨
  rationale: βασανίζω在审判语境中表示使受严厉痛苦或苦楚；“折磨”保留原文力度，避免弱化为一般的惩罚。
theological_decisions:
- issue: “借着他们自己可憎之物”所表达的报应性质
  choice: 保留工具或媒介意义：上帝借着与他们自身可憎事物有关的方式折磨他们。
  alternative: 因他们所行的可憎之事而惩罚他们；或借着与其偶像崇拜有关的特定受造物、偶像惩罚他们。
  rationale: διά加属格首先指向手段而非单纯原因；经文本身没有明确指出具体媒介，故不把它限定为某类偶像、行为或受造物，以保留相称报应的张力和原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一生愚昧、行事不义的人”避免生硬照搬希腊语序；“可憎之物”配脚注保留βδελύγματα在事物、行为及偶像崇拜对象之间的语义宽度。
