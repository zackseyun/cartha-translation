revisions:
- from: 你审判自己的众子，是何等审慎；他们的祖先就是你曾赐下誓言、立下盟约，并许以美好应许的人。[a]
  to: 你审判自己的众子，是何等严谨！你曾把带有美好应许的誓言和盟约赐给他们的祖先。[a]
  rationale: 修订消除了原译后半句生硬且易歧义的关系结构，并使“美好应许”明确修饰“誓言和盟约”。将“审慎”改为“严谨”，更准确表达ἀκριβείας在审判语境中的严格、周密。未改变原文的性别化子嗣用语、誓言与盟约的区分，或其修辞强调。
