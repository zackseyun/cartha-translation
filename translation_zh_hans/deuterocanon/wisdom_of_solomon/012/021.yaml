  text: with how much care you judged your sons[a], to whose fathers you gave oaths and covenants with good promises[c][b];
translation:
  language: zh_hans
  text: 你审判自己的众子，是何等严谨！你曾把带有美好应许的誓言和盟约赐给他们的祖先。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带有美好应许的誓言和盟约”也可译作“誓言和盟约，其中包含美好的应许”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: 是何等审慎
  rationale: ἀκρίβεια可表示精确、严谨或周密；在上帝施行审判的语境中，“审慎”既自然，也保留严谨而慎重的意味。
- source_word: ἔκρινας
  choice: 审判
  rationale: 保留κρίνω在此处的司法与道德意味，不弱化为一般的管理或处置。
- source_word: τοὺς υἱούς σου
  choice: 自己的众子
  rationale: υἱούς明确为阳性复数；“众子”保留原文的性别形式及以色列作为上帝之子的盟约意象。
- source_word: ὧν τοῖς πατράσιν
  choice: 他们的祖先
  rationale: 自然表达关系代词与与格结构，明确这些“众子”与先祖之间的世代联系。
- source_word: ὅρκους
  choice: 赐下誓言
  rationale: ὅρκος直指郑重起誓；中文用“赐下誓言”保留原文“给予”的表达。
- source_word: συνθήκας
  choice: 立下盟约
  rationale: 在圣经语境中，“盟约”能表达庄严而具约束力的关系承诺，并与“誓言”保持区别。
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: 许以美好应许
  rationale: 此属格短语与前面的誓言、盟约相关；译法表达这些誓约所包含的美好承诺，同时避免生硬的“美好应许的盟约”。
theological_decisions:
- issue: 以色列的性别化子嗣称谓
  choice: 自己的众子
  alternative: 自己的儿女
  rationale: 原文使用υἱούς而非中性词；保留“众子”也维持盟约性的父子意象。
- issue: 誓言与盟约的区分
  choice: 赐下誓言、立下盟约
  alternative: 许诺并立约
  rationale: 原文并列ὅρκους与συνθήκας，分别翻译可避免压缩其盟约神学的层次。
- issue: ἀγαθῶν ὑποσχέσεων的修饰关系
  choice: 并许以美好应许
  alternative: 含有美好应许的誓言和盟约
  rationale: 希腊文属格可理解为誓言和盟约所涉及或包含的美好应许；正文采用自然中文，但脚注保留较形式对应的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“是何等审慎”保留原文感叹性的强调；分号维持整节的长句结构，并使后半句的先祖关系清楚。
