    rationale: 希腊文ὧν τοῖς πατράσιν连接“你的众子”及其祖先；ἀγαθῶν ὑποσχέσεων则说明誓言和盟约所含或所关涉的美好应许。改为“赐给他们的祖先”及“带有美好应许的誓言和盟约”，可更清楚保留该关系。
  - severity: low
    issue: “审慎”未充分体现ἀκριβείας的精确、严谨含义。
    rationale: 在神施行审判的语境中，“严谨”比“审慎”更贴近该词所强调的严格、周密，同时中文自然。
