  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/025.yaml
  text: Therefore[a], as to senseless children, you sent judgment for mockery;
translation:
  language: zh_hans
  text: 因此，你把他们当作不明事理的孩子，降下审判作为嘲弄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“降下审判来嘲弄他们”；也可理解为“降下审判，使他们受嘲弄”。希腊文的表达可侧重这审判所作的嘲弄、其目的，或其结果。
    reason: 保留εἰς ἐμπαιγμόν在“作为嘲弄”、目的和结果之间的语义弹性，并避免在正文中确定嘲弄的对象。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文并引出结论，简洁保留推论关系。
- source_word: ὡς παισὶν ἀλογίστοις
  choice: 把他们当作不懂事的孩子
  rationale: ὡς 表示看待或对待的方式，并非断言他们真是孩子；ἀλογίστοις 指缺乏思考和理解，“不懂事”在现代汉语中自然，也符合儿童比喻。
- source_word: τὴν κρίσιν
  choice: 审判
  rationale: 保留 κρίσις 的司法性及惩治意味，不将其收窄为单纯的“惩罚”。
- source_word: εἰς ἐμπαιγμόν
  choice: 带有嘲弄意味的
  rationale: 以修饰性表达呈现审判所具有的嘲弄、讥刺性质，同时在脚注中保留目的性理解。
- source_word: ἔπεμψας
  choice: 降下
  rationale: πέμπω 本义为“差遣、送出”；对上帝发出的审判而言，“降下”是自然庄重的汉语，并保留审判从上帝而来的动态意象。
theological_decisions:
- issue: ὡς παισὶν ἀλογίστοις 是身份断言还是对待方式
  choice: 译作“把他们当作不懂事的孩子”，理解为上帝对待他们的方式
  alternative: 译作“像对不懂事的孩子一样”
  rationale: 保留比较意味，避免误解为他们在字面身份上就是孩子。
- issue: κρίσις 是否应具体译作“惩罚”
  choice: 审判
  alternative: 惩罚；判罚
  rationale: 原词具有司法行动及其后果的宽广含义，“审判”避免加入希腊文没有明确限定的惩罚性细节。
- issue: εἰς ἐμπαιγμόν 表示审判的性质还是目的
  choice: 正文表达审判带有嘲弄意味
  alternative: 降下审判来戏弄他们；降下审判，使他们受嘲弄
  rationale: εἰς 可表达趋向、结果或目的，ἐμπαιγμός 也可指嘲弄或受嘲弄；正文采用自然但不过分具体的表达，并用脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不懂事的孩子”比“无理性的孩子”自然，也能表达缺乏判断力的责备；“降下审判”保留圣经语体而不显生硬。
