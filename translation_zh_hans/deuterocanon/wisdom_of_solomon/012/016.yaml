  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/016.yaml
  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: zh_hans
  text: 因为你的力量是公义的根源[a][b]；你统管万有，使你宽待万有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根源”或译“开端”或“首要原则”。希腊文ἀρχή可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “公义”或译“正义”。希腊文δικαιοσύνη兼有这两方面的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχύς
  choice: 力量
  rationale: 表示能力与强力；“力量”自然、庄重，也保留本节由能力引出公义与宽容的论理。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: δικαιοσύνη兼有公义与正义的语义；正文采用圣经语体中自然的“公义”，另以脚注保留“正义”。
- source_word: ἀρχή
  choice: 根源
  rationale: ἀρχή可指开端、根源或首要原则。此处说上帝的力量是公义所由出的基础，“根源”比直译“开端”更符合现代汉语，同时保留脚注说明歧义。
- source_word: δεσπόζειν
  choice: 统管
  rationale: 表达作主、掌权和拥有主权；“统管万有”自然地呈现其实际统治权，又避免“支配”的负面色彩。
- source_word: φείδεσθαι
  choice: 怜惜
  rationale: 该词指宽免、不加毁灭；“怜惜”在此既包含慈悯，也保留克制惩罚、予以保全之意。
- source_word: ποιεῖ
  choice: 使你
  rationale: 保留希腊文明确的使动关系：对万有的统治权使上帝怜惜万有。
- source_word: πάντων ... πάντων
  choice: 万有……万有
  rationale: 保留原文重复与广泛范围，不把对象提前限定为所有人或所有事物。
theological_decisions:
- issue: δικαιοσύνη在描述上帝品格与治理时的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”能涵盖上帝品格与行动之正直；“正义”更突出公正审判。原词兼有二义，因此正文选“公义”，脚注保留替代译法。
- issue: ἀρχή所表达的关系
  choice: 根源
  alternative: 开端；首要原则
  rationale: 此处可理解为上帝的力量是公义的来源或起始基础。正文用自然的“根源”，但不排除原词所含的“开端”或“首要原则”含义。
- issue: 统治万有与怜惜万有之间的关系
  choice: 保留使动关系
  alternative: 译作较弱的“使你倾向于”或“因此你”
  rationale: ποιεῖ明确表达使动或结果；译文不把这种张力解释为某一特定神学体系，而按原文陈述：普遍主权带来普遍宽免。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“统管万有……怜惜万有”保留原文πάντων的重复和修辞平衡；分号呈现两个彼此相关而各自完整的分句。
