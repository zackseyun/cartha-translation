base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/009.yaml
  text: not because you were unable[a], in battle, to give the ungodly into subjection, or to wipe them out at once by savage beasts or by a sharp word[b];
translation:
  language: zh_hans
  text: 你并非没有能力在交战中使不敬虔的人屈服，或用凶猛的野兽，或凭一句严厉的话[a]，将他们一举[b]消灭；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉的话”也可译作“锋利的话”或“严厉的命令”。
    reason: 希腊词ἀπότομος兼有锐利、严厉、决绝等意味，而λόγος既可指话语，也可在此理解为命令。
  - marker: b
    text: “一举”直译为“在一次之下”，意思是一下子、在一次行动中全部完成。
    reason: 说明希腊习语ὑφʼ ἓν所强调的一次性和整体性。
lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: 你并不是没有能力
  rationale: 保留否定分词所表达的“并非无能为力”，并按上下文补出第二人称主语；不把神渐次施行审判误解为能力不足。
- source_word: ἐν παρατάξει
  choice: 在交战中
  rationale: παράταξις可指列阵或战斗；“在交战中”自然地保留军事语境，又不局限为某一种特定战法。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: ἀσεβής不仅泛指作恶，也含有对神不敬的意味；“不敬虔的人”保留这一宗教伦理色彩。
- source_word: ὑποχειρίους δοῦναι
  choice: 使……屈服
  rationale: 该短语字面上是使人处于手下、权下；“使……屈服”以现代汉语表达制服并置于支配之下的结果。
- source_word: θηρίοις δεινοῖς
  choice: 用凶猛的野兽
  rationale: θηρίον指野兽，δεινός在此突出可怕、凶猛；“凶猛的野兽”清楚而有力度。
- source_word: λόγῳ ἀποτόμῳ
  choice: 凭一句严厉的话
  rationale: ἀπότομος可表示锐利、严厉或决绝；正文采用自然的“严厉的话”，同时以脚注保留“锋利”这一较贴近字面的隐喻。
- source_word: ὑφʼ ἓν
  choice: 一举
  rationale: 这一习语表示在一次行动中、一下子完成；“一举”简洁地传达一次全部消灭的意思。
- source_word: ἐκτρῖψαι
  choice: 消灭
  rationale: ἐκτρίβω含彻底除掉、磨灭之意；“消灭”在现代汉语中庄重自然，并保留彻底毁灭的力度。
theological_decisions:
- issue: 分词短语中省略的主语及神克制施行审判的原因
  choice: 按上下文以第二人称称呼神，并译作“你并不是没有能力”
  alternative: 较逐字地译作“并非无能为力”，不明说主语
  rationale: 上下文直接向神说话，并将神的大能与有节制、渐次施行的审判相对照。补出“你”只使希腊语隐含的指向在汉语中清楚，并未把神克制的具体动机作超出原文的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文连续列举的节奏，并以分号显示本节在篇章中仍承接下文；避免文言化的“置于手下”等表达，也不把“严厉的话”直接限定为某种特定神学概念。
