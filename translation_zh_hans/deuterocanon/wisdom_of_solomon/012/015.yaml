base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: zh_hans
  text: 但你既是公义的，就公义地治理万有；你认为定罪一个不该受惩罚的人[a]，与你的能力格格不入[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个不负受惩罚之责的人。”希腊文按字面可译为“一个不欠受惩罚之债的人”。
    reason: 说明ὀφείλω在此表达应受性或责任，并保留其“欠／负债”的字面隐喻。
  - marker: b
    text: 或译：“是你的能力所不容的”或“与你的能力不相称”。所译为“格格不入”的希腊词，字面有“外来的、属于别者的”之意。
    reason: 保留ἀλλότριον的字面隐喻及其在语境中的合理理解。
lexical_decisions:
- source_word: δίκαιος ... δικαίως
  choice: 公义的……公义地
  rationale: 保留形容词与同源副词之间刻意的呼应，既表达上帝的品格，也表达他治理的方式。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 概括一切受治理者，庄重简洁，又不把范围过度限定为物质宇宙。
- source_word: διέπεις
  choice: 治理
  rationale: 体现有秩序的统管与料理，比单纯的“统治”更能传达此处公义施政的意味。
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: 一个不该受惩罚的人
  rationale: ὀφείλω加不定式表示应当、负有义务或责任；这里指此人不负受罚之责。正文采用自然现代汉语，脚注保留较直译的表达。
- source_word: καταδικάσαι
  choice: 定罪
  rationale: 保留该词司法判决和宣告有罪的含义，并与全句关于公义治理的语境相称。
- source_word: ἀλλότριον
  choice: 格格不入
  rationale: 原义为“外来的、属于别者的”；此处表示这种行为不属于、也不符合上帝能力的性质。该译法自然表达其比喻意义，脚注提示更贴近字面的译法。
- source_word: ἡγούμενος
  choice: 你认为
  rationale: 表达经过判断而视某事为何种性质；改为独立谓语符合现代汉语句法。
- source_word: τῆς σῆς δυνάμεως
  choice: 你的能力
  rationale: δύναμις在此广义指神的能力或权能；“能力”不把含义缩窄为法律上的权限。
theological_decisions:
- issue: 上帝的能力与公义之间的关系
  choice: 将定罪不该受罚之人表述为“与你的能力格格不入”
  alternative: 可理解为“非你的能力所有”或“不符合你的权能”，也可能侧重“不配你的威能”
  rationale: 希腊文把上帝的公义、公义的治理和不定罪无辜者紧密相连。译文保留“能力”与公义之间不寻常而重要的张力，不把它改释成单纯的尊严、权限或后来的系统神学命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“公义的……公义地”有意保留原文同源词的修辞呼应；分号呈现前后两部分的逻辑关系。脚注标记均置于其实际所说明的词组之后。
