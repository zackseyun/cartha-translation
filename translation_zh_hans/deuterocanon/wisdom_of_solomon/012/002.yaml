base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: zh_hans
  text: 因此，你一点一点地[a]责备那些偏离正道的人，又使他们想起自己所犯的罪，借此劝诫他们，好让他们得以摆脱邪恶，信靠你[b]，主啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一点一点地”也可译作“稍加”，表示责备的分量有所节制。
    reason: 原文κατʼ ὀλίγον既可侧重渐进过程，也可侧重程度不重。
  - marker: b
    text: “信靠你”也可译作“信你”。原文表示把信心或信赖投向神。
    reason: 保留πιστεύω ἐπί在相信与倚赖之间的语义幅度。
lexical_decisions:
- source_word: διό
  choice: 因此
  rationale: 承接上文并引出结论，清楚保留原文的推论关系。
- source_word: τοὺς παραπίπτοντας
  choice: 那些偏离正道的人
  rationale: παραπίπτω在这里指偏离或陷入过错；此译保留道德上的偏离，又不把它局限为一次失足或彻底背弃。
- source_word: κατʼ ὀλίγον
  choice: 逐步
  rationale: 主要理解为神以渐进、有节制的方式施行责备；简洁自然，同时以脚注保留‘稍加’这一程度性理解。
- source_word: ἐλέγχεις
  choice: 责备
  rationale: 表达指出过错并加以纠正的行动，兼顾原文的揭露与管教意味。
- source_word: ἐν οἷς ἁμαρτάνουσιν ὑπομιμνήσκων
  choice: 使他们想起自己所犯的罪
  rationale: 保留具体提醒其犯罪之处的意思，并按现代汉语重组分词结构。
- source_word: νουθετεῖς
  choice: 劝诫
  rationale: νουθετέω是以纠正为目的的提醒和告诫；‘劝诫’比单纯‘警告’更能涵盖教导性。
- source_word: ἀπαλλαγέντες τῆς κακίας
  choice: 摆脱邪恶
  rationale: 表达从邪恶状态中脱离；汉语中‘摆脱’自然地传达结果，而不强行指定施事者。
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: 信靠你
  rationale: πιστεύω与ἐπί加宾格表示把信赖指向神；‘信靠’兼具相信与倚赖之意。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对神的直接呼告；汉语呼格用‘啊’自然庄重。
theological_decisions:
- issue: πιστεύσωσιν ἐπὶ σέ所表达的相信与信赖
  choice: 信靠你
  alternative: 信你
  rationale: 介词结构强调信心与倚赖指向神；‘信靠’在汉语中较完整，但‘信你’也是较贴近动词形式的可行译法，故列入脚注。
- issue: ἀπαλλαγέντες的语态与脱离邪恶的施事者
  choice: 摆脱邪恶
  alternative: 从邪恶中得释放
  rationale: 原文为被动形式，但未明说施事者。正文采用自然汉语而不补出‘神释放他们’；替代译法可突出被动意味，却可能使施事者显得更明确。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文由责备、提醒、劝诫通向脱离邪恶并信靠神的目的关系；避免使用带有特定宗派色彩的术语。
