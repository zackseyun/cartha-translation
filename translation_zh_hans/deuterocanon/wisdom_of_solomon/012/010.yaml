base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: zh_hans
  text: 但你逐步[a]审判他们，给他们悔改的余地；你并非不知道，他们的根源[b]是恶的，他们的邪恶是与生俱来的，而且他们的心思永远不会改变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逐步”也可译作“渐渐地”或“一点一点地”。
    reason: lexical_alternative
  - marker: b
    text: “根源”所译的希腊词也可指“出生”或“族类”；本句也可译作“他们的出身是恶的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχὺ
  choice: 但你逐步审判他们
  rationale: κρίνων以现在分词表达伴随情形，κατὰ βραχύ表示分阶段、逐渐进行；“逐步审判”自然保留其渐进意味。
- source_word: ἐδίδους τόπον μετανοίας
  choice: 给他们悔改的余地
  rationale: τόπος本义为“地方、空间”，在此构成习语，指给予机会或余地；此译保留空间隐喻，同时符合现代汉语。
- source_word: οὐκ ἀγνοῶν
  choice: 你并非不知道
  rationale: 按希腊文否定式表达，保留其克制而强调充分知情的语气，不改写成解释性的“你深知”。
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: 他们的根源是恶的
  rationale: γένεσις可指起源、出生或族类；“根源”保持一定语义宽度，避免擅自限定为血统或出生时的本性。
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: 邪恶是与生俱来的
  rationale: ἔμφυτος指内在生长、天生或固有；“与生俱来”准确而通俗，同时保留原文严厉的判断。
- source_word: ὁ λογισμὸς αὐτῶν
  choice: 他们的心思
  rationale: λογισμός可指思想、推理、意念或思维取向；“心思”在此简洁自然，也不把含义缩窄为逻辑推理。
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: 永远不会改变
  rationale: οὐ μή加强否定，εἰς τὸν αἰῶνα表达永久性；“永远不会改变”在汉语中同时传达强调否定和持续时间。
theological_decisions:
- issue: 本节是否断言一种绝对的、形而上的悔改无能
  choice: 保留原文关于其邪恶与心思永不改变的强烈陈述，但不增添其机制或教义定义。
  alternative: 译成“他们生来就有罪，绝不可能悔改”等更具教义解释色彩的措辞。
  rationale: 原文并置了上帝给予悔改余地与他知道他们的心思永不改变这两方面。译文保留这种张力，不将其系统化为经文本身未明说的遗传罪责或形而上必然性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“悔改的余地”保留希腊文“给悔改以地方”的比喻；句中分号呈现上帝施行渐进审判、给予悔改余地与其完全知情之间的张力。
