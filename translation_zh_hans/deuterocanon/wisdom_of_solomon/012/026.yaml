base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/026.yaml
  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
translation:
  language: zh_hans
  text: 但那些没有因近乎儿戏的责备而受到劝导的人，必将经历一场与上帝相称的审判[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “近乎儿戏的责备”也可译作“儿戏般的惩戒”或“对待孩童般的管教”。希腊语的表达十分凝练，可能强调先前的责备或惩戒相对轻微、近于游戏或孩童式的方式。
    reason: lexical_alternative
  - marker: b
    text: “经历”直译可作“试验”或“尝试”；此处是指他们将通过实际承受而认识这种审判。“与上帝相称的审判”也可理解为“上帝的审判”或“来自上帝的审判”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: παιγνίοις
  choice: 儿戏般的
  rationale: 该词在此不是指实际的玩具，而是形容先前的惩戒相对轻微，近乎对待孩童的管教；“儿戏般的”保留了希腊语略带反常的修辞色彩。
- source_word: ἐπιτιμήσεως
  choice: 惩戒
  rationale: 本义可指责备、申斥；上下文涉及逐步加重的神圣处罚，因此“惩戒”兼顾责备、纠正和处罚的含义。
- source_word: νουθετηθέντες
  choice: 受到教导
  rationale: 该被动分词表示借劝戒或纠正而得到教导；此译法保留先前惩戒具有教育目的这一层含义。
- source_word: ἀξίαν
  choice: 配得上
  rationale: 表示相称、合宜或配得；“配得上”贴近原文结构，并不将其简化为人所“应得的”。
- source_word: θεοῦ κρίσιν
  choice: 配得上帝的审判
  rationale: 结合ἀξίαν，最自然地表示与上帝相称的审判；同时保留θεοῦ也可理解为所属或来源的余地。
- source_word: πειράσουσιν
  choice: 必将亲身领受
  rationale: 字面义为试验、尝试；在此指通过实际承受而认识。“亲身领受”表达亲历审判的语境含义，又避免误解为他们主动试探或评判上帝。
theological_decisions:
- issue: ἀξίαν θεοῦ κρίσιν中θεοῦ的作用
  choice: 理解为性质或相称关系：“配得上帝的审判”
  alternative: 可理解为所属关系“上帝的审判”，或来源关系“来自上帝的审判”
  rationale: ἀξίαν直接修饰κρίσιν，而θεοῦ紧随其后，最顺畅的理解是审判与上帝相称；脚注保留希腊语压缩结构中的其他可能性，避免消除其神学张力。
- issue: 较轻惩戒与最终审判的关系
  choice: 保留由教育性惩戒升级为严厉审判的对比
  alternative: 把前者仅译成口头责备，或把后者仅译成人所应得的报应
  rationale: 原文既呈现先前措施的劝戒目的，也强调拒绝受教者将亲历与上帝相称的审判，不宜偏废其中任何一面。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“儿戏般的惩戒”刻意保留原文不寻常的形象；“亲身领受”使πειράσουσιν在审判语境中的体验义自然明确。上帝采用现代基督教汉语中通行的称谓。
