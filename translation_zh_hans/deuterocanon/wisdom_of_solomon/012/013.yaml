base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/013.yaml
  text: For there is no god besides you who cares for all[a], so that you should show that you did not judge unjustly[b];
translation:
  language: zh_hans
  text: 因为除你以外，再没有一位神关怀万有[a]，使你显明自己并非不公正地审判[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有”也可理解为“所有人”或“一切事物”；希腊语在这里没有限定所指。
    reason: 保留 πάντων 在人称与中性范围之间的真实歧义。
  - marker: b
    text: 直译是“使你显明自己并非不公正地审判”；也可意译为“使你显明自己的审判是公正的”。
    reason: 说明 ἵνα 从句可带目的或结果意味，并保留 οὐκ ἀδίκως 的否定结构及其正面意涵。
lexical_decisions:
- source_word: οὔτε γὰρ θεός ἐστιν πλὴν σοῦ
  choice: 因为除你以外，再没有一位神
  rationale: γάρ表达解释关系，译作“因为”；πλὴν σοῦ表达排除与唯一性，译作“除你以外”。“一位神”自然传达原文单数 θεός 的类别性排他陈述。
- source_word: ᾧ μέλει περὶ πάντων
  choice: 关怀万有
  rationale: μέλει περὶ表示关心、照管；πάντων既可能涵盖众人，也可能涵盖万物，故以“万有”保留其普遍范围，不限缩为某一类对象。
- source_word: ἵνα δείξῃς
  choice: 要你证明
  rationale: ἵνα加虚拟式在此带目的或结果色彩；“要你证明”保留与前句之间略带反诘意味的逻辑关联，同时符合现代汉语表达。
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: 自己的审判并非不公
  rationale: 保留原文以否定方式表达的 οὐκ ἀδίκως，而不直接改写为肯定式“审判公正”；κρίνω按司法语境译为“审判”。
theological_decisions:
- issue: 如何表达排他性的 θεός
  choice: 除你以外，再没有一位神
  alternative: 除你以外，再没有神
  rationale: 两种译法都表达独一性；加入“一位”使现代汉语句法更自然，同时没有把普通类别名词 θεός 改成专名。
- issue: 是否将 οὐκ ἀδίκως 正面化
  choice: 审判并非不公
  alternative: 审判是公正的
  rationale: 原文采用否定“不公”的方式，而非直接断言“公正”；保留这一修辞形式，可避免消解原文的神学张力。
- issue: ἵνα 从句的逻辑关系
  choice: 要你证明
  alternative: 好使你显明
  rationale: 原文可有目的或结果意味，并带有“无人能要求上帝自证”的语境张力；正文不将其过度明确化，脚注提示这一关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“关怀万有”兼顾原文普遍范围与经文语体；“并非不公”刻意保留双重否定式的修辞张力。所有脚注标记均已置于正文。
