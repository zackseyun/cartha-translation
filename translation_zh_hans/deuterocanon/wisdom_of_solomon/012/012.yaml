base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: zh_hans
  text: 因为，有谁会说：“你做了什么？”有谁会抗拒你的判决？又有谁会就那些被你毁灭的民族控告你呢？[a]有谁会来到你面前，作为惩治不义之人的复仇者呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“就已经灭亡、而你使之如此的民族”。“使之如此”所用的动词通常可译为“做”或“使成”；结合上下文，这里译作“被你毁灭”。
    reason: lexical_alternative
  - marker: b
    text: 本句的希腊文表达罕见而难解，也可理解为：“谁会前来与你对抗，为不义的人申冤呢？”这里译作“来到你面前”，保留其司法场景，却不排除更强的敌对含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: 因为谁会说
  rationale: 保留γάρ承接上文、说明理由的作用，也保留将来时形式和反问语气；不添加原文没有的“敢”或“能”。
- source_word: Τί ἐποίησας
  choice: 你做了什么
  rationale: 直译质问句式，不擅自改成“你为什么这样做”。
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: 会抗拒你的判决
  rationale: ἀνθίστημι表示抵抗、反对；κρίμα在此有司法裁断的意味，译作“判决”比泛称“判断”更贴合语境。
- source_word: ἐγκαλέσει σοι
  choice: 会……控告你
  rationale: 保留动词鲜明的法律诉讼色彩。
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  choice: 为了那些被你毁灭的民族
  rationale: 希腊文结构紧缩，ἐποίησας本义宽泛，可指“做、使成”；结合ἀπολωλότων，正文表达为上帝使这些民族灭亡，同时以脚注保留字面结构及歧义。
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: 会来到你面前
  rationale: κατάστασις在此结构罕见难解；正文采用不过度限定的司法性场景表达，脚注说明也可能具有更强的对抗意味。
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: 作惩治不义之人的报应者
  rationale: ἔκδικος可指执行公正或报应的人；κατά按其通常的敌对方向译作“惩治……”，并在脚注保留该短语可能涉及替人申诉的法律性理解。
theological_decisions:
- issue: 上帝的司法行动是否可受质疑
  choice: 以连续反问表达无人能对上帝的判决提出有效控告或抗拒
  alternative: 仅表达事实上无人有能力反对，而不涉及判决本身的正当性
  rationale: 重复的τίς反问及κρίμα、ἐγκαλέω等司法词汇共同强化上帝判决不可被成功挑战的语气；译文不额外加入系统性的神学命题。
- issue: ἀδίκων ἀνθρώπων的指称
  choice: 不义的人
  alternative: 不义的男人
  rationale: ἀνθρώπων在这里泛指实施不义的人，并非特指男性；现代汉语“不义的人”准确保留其道德和司法含义。
- issue: 末句报应者所针对或代表的对象
  choice: 正文依κατά的常见敌对意义译为惩治不义之人
  alternative: 来到上帝面前，为不义的人申冤或辩护
  rationale: 原句搭配罕见，语义关系不完全确定；正文选取较直接的句法理解，脚注明示另一种司法性理解，避免消除原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。连续使用“谁会……”保持原文反问的节奏；“判决”“控告”“报应者”保留司法语域。脚注标记均置于相关分句之后。
