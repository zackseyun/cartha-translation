base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/022.yaml
  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: zh_hans
  text: 因此，你管教我们，却以无数的鞭笞惩罚我们的仇敌[a]，好叫我们在审判别人时思量你的良善，在受审判时盼望怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以无数的鞭笞”也可译作“以万千鞭笞”；希腊语强调鞭打极多，也可包含其程度极重的意味。
    reason: 说明ἐν μυριότητι与μαστιγοῖς结合所表达的巨大数量意象，并保留强度的可能含义。
lexical_decisions:
- source_word: παιδεύων
  choice: 管教
  rationale: 既保留教导、纠正的目的，也包含纪律性惩戒的意味，不将其缩减为单纯处罚。
- source_word: ἐν μυριότητι
  choice: 无数的
  rationale: 该表达强调数量极多或程度极重；正文采用自然现代汉语，具体字面意象在脚注中说明。
- source_word: μαστιγοῖς
  choice: 以……鞭打责罚
  rationale: 保留鞭笞的具体形象及严厉惩罚的力度，同时使其与宾语“我们的仇敌”自然衔接。
- source_word: μεριμνῶμεν
  choice: 顾念
  rationale: 在此不是指焦虑，而是审判时留心、考虑上帝的良善；“顾念”简洁地表达这种伦理关切。
- source_word: κρίνοντες
  choice: 在审判别人时
  rationale: 将情境分词按时间关系表达；补出“别人”使现代汉语清楚，但不限定具体对象。
- source_word: κρινόμενοι
  choice: 在受审判时
  rationale: 保留被动意义，并与前句主动的“审判别人”形成平行对照。
- source_word: προσδοκῶμεν ἔλεος
  choice: 盼望怜悯
  rationale: 表达期待和等候的意味，不把这种期待强化为必然获得的断言。
- source_word: ἀγαθότητα
  choice: 良善
  rationale: 涵盖道德上的善与仁厚，适合指上帝的品格，也符合庄重而通俗的经文语体。
theological_decisions:
- issue: 上帝管教“我们”与鞭打“我们的仇敌”之间的关系
  choice: 将ἡμᾶς视为παιδεύων的宾语，将τοὺς ἐχθροὺς ἡμῶν视为μαστιγοῖς的宾语，并以“却”呈现两者的对照。
  alternative: 把无数的鞭打理解为施加在“我们”身上。
  rationale: 希腊语句法最自然地支持两个不同宾语；这一译法也保留纠正性的管教与严厉惩罚之间的张力，而不进一步作教义化解释。
- issue: μεριμνῶμεν与“你的良善”的关系
  choice: 译为审判别人时“顾念你的良善”。
  alternative: 译为“关心你的良善”或“为你的良善忧虑”。
  rationale: 原词可有忧虑或关切之意，但在此语境中指认真留意上帝的良善，使之影响人的审判；“顾念”避免误传为对上帝良善感到焦虑。
- issue: “审判别人”与“受审判”的对应
  choice: 保留主动与被动的鲜明平行，并不明说最终审判或人的法庭。
  alternative: 明确解释为人在今世审断他人与将来受上帝审判。
  rationale: 原文没有限定两种审判的具体场景；正文保留这种开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“管教”与“鞭打责罚”形成有意对照；两个“在……时”保持原文主动审判与被动受审判的平行结构。
