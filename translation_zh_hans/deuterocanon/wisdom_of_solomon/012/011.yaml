base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: zh_hans
  text: 因为他们本是从起初就受咒诅的后裔[a]；你也没有因顾忌任何人而使他们免受他们所犯之罪的惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“种子”，在这里可比喻“后裔”“族类”或“血脉”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“你也不惧怕任何人，因他们所犯的罪而给他们豁免。”希腊文相关词可表示“惧怕”“敬畏”或“顾忌”；“豁免”也可译为“免罚”或“免责”。
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: 后裔
  rationale: 该词本义为“种子”，也可比喻血脉、后代或族类。此处指受审判的一群人；“后裔”在现代汉语中自然，并保留其世系含义，字面意象及其他可能含义列入脚注。
- source_word: κατηραμένον
  choice: 受咒诅的
  rationale: 准确表达处于咒诅之下的状态，也保持原文庄重、严肃的语气。
- source_word: ἀπʼ ἀρχῆς
  choice: 从起初就
  rationale: 直译其时间意义；“就”自然地突出这一状态自起初已经存在。
- source_word: εὐλαβούμενός τινα
  choice: 顾忌任何人
  rationale: εὐλαβέομαι可指惧怕、谨慎看待或出于敬畏而有所顾忌。这里以人为宾语，“顾忌任何人”既符合语境，也避免把含义限定为单纯恐惧。
- source_word: ἄδειαν
  choice: 宽免
  rationale: 该词可表示自由、许可或免受追究；在审判语境中，“宽免”自然表达免除应受惩处之意，同时不必把它明确限定为赦罪术语。
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: 对他们所犯的罪
  rationale: 原短语指他们犯罪所涉及的事，也是不给予宽免的根据。此译符合现代汉语表达，并保留犯罪与宽免之间的直接关系。
- source_word: ἐδίδους
  choice: 予以
  rationale: 原文为未完成过去时，表示叙事中过去的行动或一贯做法；汉语无须强行标示时体，以“予以宽免”自然传达“给予宽免”。
theological_decisions:
- issue: 是否在正文中明确“后裔”所指的具体民族
  choice: 不补出具体民族，仅译作“后裔”
  alternative: 他们原是从起初就受咒诅的族类
  rationale: 上下文可帮助辨明所指，但本节本身只用比喻性的σπέρμα。正文不加入原文未明说的民族名称，以免过度释义。
- issue: εὐλαβούμενος与否定词及后续短语的句法关系
  choice: 译为“你也没有因为顾忌任何人，而……予以宽免”
  alternative: “你也不惧怕任何人，没有在他们所犯的事上给他们豁免”
  rationale: 分词可表达因惧怕、尊重或顾忌某人而采取行动；这里将其理解为可能促使宽免的顾虑，并受否定。脚注保留较贴近表面结构、以“惧怕”表达的译法。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“从起初就受咒诅”保留原文强烈措辞；第二分句按汉语习惯重组语序，但用脚注呈现希腊文在“惧怕／顾忌”及句法连接上的张力。
