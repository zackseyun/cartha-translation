base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: zh_hans
  text: 因为，当人不相信你的能力全备时，你便显明你的力量[a]；在那些知道的人当中，你揭露狂妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当你在能力的全备上不被信任时。”希腊文十分凝练，既可侧重人不信上帝本人，也可侧重人怀疑他能力的全备。
    reason: alternative_reading
  - marker: b
    text: “狂妄”也可译作“放肆”或“胆大妄为”；这里含有负面意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: 力量
  rationale: ἰσχύς指力量、强力；译作“力量”自然清楚，也与后文表示能力、权能的δύναμις有所区别。
- source_word: ἐνδείκνυσαι
  choice: 显明
  rationale: 该动词意为显示、表明或证明；“显明”既保留展示之意，也符合庄重的现代汉语。
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: 当人不信你能力的完满时
  rationale: 希腊文结构凝练，可指人不信上帝本人，也可指人怀疑其能力的完满；正文采用自然汉语表达主要语意，并以脚注保留句法歧义。
- source_word: δυνάμεως τελειότητι
  choice: 能力的完满
  rationale: τελειότης表示完全、完满；“能力的完满”比单纯译作“完全的能力”更贴近原文名词结构。
- source_word: ἐν τοῖς εἰδόσι
  choice: 在那些明知的人中
  rationale: 原文没有明说他们所知道的对象；“明知的人”保留这一省略，避免擅自补成知道上帝或知道其能力。
- source_word: τὸ θράσος
  choice: 狂妄
  rationale: θράσος虽可泛指大胆，但本句与揭露、责证相连，明显带有放肆、傲慢的负面意味；“狂妄”能自然传达这一语气。
- source_word: ἐξελέγχεις
  choice: 揭露
  rationale: ἐλέγχω复合形式可表示揭发、证实有罪、驳斥或责备；“揭露”保留使隐藏的狂妄显露出来这一语义，又不把它局限为口头斥责。
theological_decisions:
- issue: 不信所直接针对的是上帝本人，还是其能力的完满
  choice: 正文表述为人不信上帝能力的完满
  alternative: 当上帝在能力的完满上受到怀疑或不被信任时
  rationale: 分词ἀπιστούμενος在语法上以“你”为承受不信者，但介词短语又把不信与能力的完满联系起来。正文采用汉语中较易理解的表达，脚注则明确保留原文可能侧重上帝本人不受信任的含义。
- issue: “明知的人”所知道的对象
  choice: 不补明宾语
  alternative: 那些认识上帝的人；那些知道上帝能力的人
  rationale: 希腊文仅说“那些知道的人”，对象由语境补足。保持省略可避免把经文限定为某一种解释。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的汉语。“能力的完满”略带书面色彩，用以保留原文τελειότης的名词性表达；分号呈现两组彼此对应的神圣行动。
