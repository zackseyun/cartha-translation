base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: zh_hans
  text: 但你掌管力量，却以宽厚[a]施行审判，并以极大的克制治理我们；因为行事的能力随时都供你运用，只要你愿意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽厚”也可译作“宽仁”或“温和公允”；希腊词 ἐπιείκεια 含有不苛刻、宽和处置的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译近于：“因为每当你愿意，‘能够’就在你那里。”这里“能够”是名词化的说法，指有能力行事；意思是：采取行动的能力始终可供你运用。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: 掌管大能
  rationale: δεσπόζων 表示作主、掌权，ἰσχύος 表示力量或大能。“掌管大能”保留了对能力拥有主权的含义，也与末句表示“能够”的 τὸ δύνασθαι 保持词义区别。
- source_word: ἐν ἐπιεικείᾳ
  choice: 以宽厚
  rationale: ἐπιείκεια 可指宽仁、温和、公允而不苛刻；“宽厚”在现代汉语中自然凝练，并适合本节大能与克制并置的语境。
- source_word: κρίνεις
  choice: 施行审判
  rationale: 保留 κρίνω 的司法性含义；“施行审判”比单说“判断”更符合此处上帝治理的语境。
- source_word: μετὰ πολλῆς φειδοῦς
  choice: 以极大的克制
  rationale: φειδώ 的核心是爱惜、不滥用、有所节制。“克制”既表达有能力而不用尽的意思，也避免直接增译为“怜悯”。
- source_word: διοικεῖς ἡμᾶς
  choice: 治理我们
  rationale: διοικεῖς 指管理、安排或治理；明确保留宾语 ἡμᾶς“我们”，不将其泛化为万物。
- source_word: πάρεστιν γάρ σοι ὅταν θέλῃς τὸ δύνασθαι
  choice: 因为只要你愿意，行事的能力随时都在你手中
  rationale: 以自然汉语表达原文“能够这件事在你这里、任你意愿而有”的结构，突出能力始终可供支配，而不是偶然获得。
theological_decisions:
- issue: 上帝的大能与温厚审判之间的张力
  choice: 同时保留“掌管大能”与“以宽厚施行审判、以克制治理”
  alternative: 把重点单方面落在绝对权威上，或把 φειδώ 强化译成“怜悯”
  rationale: 希腊文刻意把完全的能力与有节制的运用并列；译文不把宽厚理解为软弱，也不把克制限定为某种特定教义术语。
- issue: 末句所说能力的可支配性
  choice: 译为能力随时都在上帝手中
  alternative: 译成“你若愿意才会有能力”
  rationale: πάρεστιν σοι 表示能力已经在场、可随时运用；条件在于意愿，不在于能力是否存在。
- issue: 第一人称复数 ἡμᾶς
  choice: 保留“我们”
  alternative: 按上下文泛化为“万物”或“众人”
  rationale: 原文明确使用第一人称复数，保留说话者及其群体的参与，不作无文本依据的扩展。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“掌管大能”保持经文语体；“宽厚”“克制”“治理”均为普通读者熟悉的词。用“却”清楚呈现大能与温厚审判之间的语义反差，但不把这种反差扩展为原文没有明说的教义判断。
