  text: For your imperishable Spirit is in all things[a].
translation:
  language: zh_hans
  text: 因为你不朽的灵在万物之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切之中。”希腊语 ἐν πᾶσιν 也可作这种较简短的表达；正文译作“在万物之中”，明确体现其很可能为中性复数。
    reason: 词义与句法上的可选译法
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”在现代汉语中自然地保留了该连词的因果功能。
- source_word: ἄφθαρτόν
  choice: 不朽的
  rationale: 表达不受败坏、衰朽或灭亡支配之意；“不朽”简洁庄重，也比“不腐坏的”更适合修饰此处属上帝的“灵”。
- source_word: πνεῦμά
  choice: 灵
  rationale: 在“你的”修饰下，此词指向上帝的灵或属上帝的生命气息；译作“灵”可保留原文的神学张力，不强行限定为单纯的“气息”。
- source_word: ἐν πᾶσιν
  choice: 在万物之中
  rationale: πᾶσιν在此最可能是中性复数，范围涵盖受造万物；“万物之中”避免将所指缩窄为所有人。
theological_decisions:
- issue: πνεῦμά σου所指的性质
  choice: 你的灵
  alternative: 你的气息
  rationale: 上下文指上帝临在并维系万物的灵；中文“灵”既能表达神圣所指，又不像专名化处理那样把后期教义上的位格界定直接读入本节。
- issue: ἐν πᾶσιν的范围
  choice: 在万物之中
  alternative: 在一切之中
  rationale: 采用最可能的中性复数理解，明确其普遍涉及受造界，同时不译成“在每个人里面”，以免把范围限制于人类。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你那不朽的灵”保留希腊语定冠词与物主成分所形成的强调；不以中文专名化方式额外确定“灵”的位格含义。
