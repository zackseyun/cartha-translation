base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: zh_hans
  text: 因为他们在谬误的道路上越发迷失[a]，甚至把仇敌的动物中卑贱的也当作神[b]，如同愚昧的婴孩一样受了蒙骗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被引得更远”。希腊文既可强调他们自己越发迷失，也可强调他们被引入更深的迷途。
    reason: 词义存在主动偏行与受误导之间的真实歧义。
  - marker: b
    text: 或译：“甚至把仇敌那些卑贱的动物也当作神。”
    reason: 希腊语短语中“仇敌的”“动物中”和“卑贱的”之间的修饰关系可有不同理解。
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: 谬误的道路
  rationale: πλάνη兼有迷失、错误和迷惑之意；“谬误的道路”保留ὁδοί的道路意象，也符合本节对偶像崇拜之错误判断的批评。
- source_word: μακρότερον ἐπλανήθησαν
  choice: 越走越远
  rationale: μακρότερον加强ἐπλανήθησαν，表达偏离得更远；“越走越远”与前面的“道路”自然衔接，并保留持续深入歧途的意象。
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: 当作神
  rationale: ὑπολαμβάνω在此指认定、看作；“当作神”是现代汉语中自然简洁的表达，并清楚呈现其错误判断。
- source_word: τὰ καὶ ἐν ζῴοις τῶν ἐχθρῶν ἄτιμα
  choice: 仇敌的动物中那些卑贱的
  rationale: 以“那些卑贱的”承接中性复数τὰ与ἄτιμα，并保留ἐν ζῴοις和τῶν ἐχθρῶν的关系，避免擅自具体化这些动物。
- source_word: νηπίων δίκην ἀφρόνων
  choice: 像愚昧的婴孩一样
  rationale: δίκην表示“如同”；νήπιοι是婴孩或幼儿，ἄφρονες意为愚昧、无知。译文保留原文严厉的比喻。
- source_word: ψευσθέντες
  choice: 受了欺骗
  rationale: 该被动分词表达被欺骗或被误导；“受了欺骗”保留被动意味，不将其单纯解释为自欺。
theological_decisions:
- issue: 本节对偶像崇拜的道德与神学评价
  choice: 保留“谬误”“卑贱”“受了欺骗”等明确的负面措辞
  alternative: 弱化为“误会”“低微”或其他较中性的措辞
  rationale: 希腊文以πλάνη、ἄτιμα和ψευσθέντες明确批评这种偶像崇拜；译文应保留原文的评价，同时不额外强化。
- issue: 迷失是主动偏行还是被引入歧途
  choice: 正文译作“越走越远”，脚注说明也可理解为“被引得更远”
  alternative: 在正文中直接译作“被引得更远”
  rationale: ἐπλανήθησαν的形式和语境容许强调他们自己偏行，也容许强调他们受迷惑；正文采用与道路意象自然衔接的表达，脚注保留另一层可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟”传达καὶ在此处“甚至、连……也”的递进意味；整体保持原文的道路意象、偶像崇拜批评和婴孩比喻。所有脚注标记均已置于正文相应位置。
