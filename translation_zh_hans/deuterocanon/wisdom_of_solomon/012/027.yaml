base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: zh_hans
  text: 因为他们正是在那些使自己受苦、心生愤恨的事物上受惩罚——就是他们以为是神明的那些事物；他们由此看见并认出，他们从前不肯认识的那一位才是真神。[a] 因此，定罪的终局也临到了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们真正认识了那位他们从前拒绝认识的神。”希腊文中的“真”也可作副词理解，意为“真正地”。
    reason: 保留ἀληθῆ既可修饰“神”也可作副词理解的句法歧义；并准确表达ἠρνοῦντο εἰδέναι为拒绝／否认认识神。
lexical_decisions:
- source_word: ἐφʼ οἷς ... ἐπὶ τούτοις ... ἐν αὐτοῖς
  choice: 正是在那些……的事物上……就是……那些事物；他们由此
  rationale: 保留原文对同一组事物的反复指称及修辞关联，同时用现代汉语理顺受苦、愤恨与受罚之间的关系。
- source_word: πάσχοντες ἠγανάκτουν
  choice: 受苦、心生愤恨
  rationale: πάσχω直译为“受苦”，ἠγανακτέω表达强烈不满或愤慨；“心生愤恨”自然且保留情绪力度。
- source_word: οὓς ἐδόκουν θεούς
  choice: 他们以为是神明的那些事物
  rationale: 体现δοκέω所表达的主观认定，也保留原文把受造之物误认为神的反讽。
- source_word: κολαζόμενοι
  choice: 受惩罚
  rationale: 采用中性而明确的司法—惩戒用语，不额外限定惩罚的性质。
- source_word: ὧν πάλαι ἠρνοῦντο εἰδέναι
  choice: 那位他们从前不肯认识的
  rationale: “从前”对应πάλαι，“不肯认识”保留ἠρνοῦντο的主动拒绝意味，而不弱化为单纯无知。
- source_word: θεὸν ἐπέγνωσαν ἀληθῆ
  choice: 认出……才是真神
  rationale: ἐπιγινώσκω取“认出、确认”之意；将ἀληθῆ主要理解为修饰θεόν，突出真假神明的对比。
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: 定罪的终局
  rationale: “终局”表达τέρμα的终点、最终结局之义；“定罪”保留καταδίκη的司法色彩，又不擅自具体化为某一种刑罚。
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: 临到了他们
  rationale: 自然传达审判或结局来到并落在人身上的意象。
theological_decisions:
- issue: ἀληθῆ在θεὸν ἐπέγνωσαν ἀληθῆ中的句法归属
  choice: “认出……才是真神”，把ἀληθῆ理解为形容θεόν
  alternative: “真正认识了……神”，把ἀληθῆ作副词理解
  rationale: 上下文将他们误认为神明的事物与真实的神相对照，因此形容词读法较贴合语境；但希腊文也容许副词性理解，故在脚注保留。
- issue: 惩罚的媒介与领域
  choice: 他们在自己以为是神明的那些事物上受惩罚，并“由此”认出真神
  alternative: 他们“被那些事物”直接惩罚
  rationale: ἐπί与ἐν的表达可兼有领域和工具色彩；正文避免把所谓神明人格化为主动施罚者，同时保留同一事物成为惩罚媒介的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以破折号标明对“那些事物”的解释关系，用“才是真神”呈现偶像与真神之间的鲜明反差；避免古奥的“震怒”“刑罚极限”等措辞。
