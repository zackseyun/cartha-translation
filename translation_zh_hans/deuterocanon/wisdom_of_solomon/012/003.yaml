lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为，就连
  rationale: γάρ承接上下文，带有解释或说明的作用；καί在这里加强语气。译作“因为，就连”既保留连接关系，也自然体现强调。
- source_word: τοὺς παλαιοὺς
  choice: 古时的
  rationale: παλαιός在此指久远年代、从前的人；“古时的”符合历史语境，又避免“古代的”可能带来的过强时代划分。
- source_word: οἰκήτορας
  choice: 居民
  rationale: 该词指居住在某地的人。“居民”准确、自然；“居住者”较生硬，“定居者”则可能额外暗示迁入和拓殖。
- source_word: τῆς ἁγίας σου γῆς
  choice: 你圣地上的
  rationale: γῆ在此指特定地域，宜译“地”而非泛指世界的“大地”；属格短语按现代汉语自然表达为“你圣地上的”，并保留对上帝的直接称呼。
theological_decisions:
- issue: γῆ应理解为普遍的“大地”，还是特定的“土地／地域”
  choice: 圣地
  alternative: 神圣的大地
  rationale: 上下文所指是上帝名下的一片特定地域，而非整个世界。“圣地”保留其地域性与神圣属性，不额外加入经文未明说的神学限定。
