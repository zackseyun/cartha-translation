  text: so that the land most precious of all in your sight might receive a worthy colony of God's children[a][b].
translation:
  language: zh_hans
  text: 好使在你看来比一切土地都宝贵的那片地[b]，得以接纳一个相称的、由上帝儿女组成的定居群体[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定居群体”或译“殖居群体”；也可理解为“定居点”或“殖民地”。希腊词ἀποικία可指殖居的人群或其定居之处。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在你面前一切之中最宝贵的地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好让
  rationale: 引出目的或结果；“好让”自然地保留希腊文的目的意味。
- source_word: ἀξίαν
  choice: 配得的
  rationale: 修饰ἀποικίαν，表示这群移民在品格或资格上与所得之地相称；“配得的”保留其评价意味。
- source_word: ἀποικίαν
  choice: 移民
  rationale: 该词可指殖民地、移居群体或定居点。句中作δέξηται的宾语，侧重土地所接纳的定居人群；译作“移民”比现代汉语中常带政治历史色彩的“殖民地”更自然。
- source_word: δέξηται
  choice: 接纳
  rationale: 对应“接受、接纳”，不额外加入“欢迎”所可能包含的热情意味。
- source_word: θεοῦ παίδων
  choice: 上帝儿女
  rationale: παῖς复数在此适合按亲属关系理解，并不限定男性；“上帝儿女”简洁表达归属于上帝的子民。
- source_word: ἡ ... γῆ
  choice: 那片地
  rationale: 上下文所指是特定土地，而非整个大地；“那片地”符合现代汉语表达。
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη
  choice: 在你看来比一切土地都宝贵
  rationale: παρὰ σοὶ表示从上帝的眼光或评价而言，τιμιωτάτη是最高级；补出比较范围中的“土地”，使汉语清楚而不改变所指。
theological_decisions:
- issue: θεοῦ παίδων的译法
  choice: 上帝儿女
  alternative: 上帝的孩子；上帝众子
  rationale: 此处παῖς并不要求仅指男性。“儿女”既保留亲属关系，也避免无根据地把所指限于男性。
- issue: ἀποικίαν所指是地方还是人群
  choice: 正文按移居群体译作“移民”
  alternative: 定居点；殖民地
  rationale: 希腊词本身可兼指定居地与定居人群。δέξηται以土地为主语时，将其理解为土地接纳一群移居者较顺，但原词的地点义仍在脚注中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作为移民”明确ἀποικίαν在句中的人群意义，同时用脚注保留其“定居点／殖民地”的真实歧义；“上帝儿女”避免不必要的男性限定。
