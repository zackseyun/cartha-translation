translation:
  language: zh_hans
  text: 你憎恨他们，因为他们行最可憎恶的行径，即巫术[a]和不圣洁的礼仪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巫术”或译“魔法”；希腊词也可能涉及药剂或毒物的使用。
    reason: lexical_alternative
  - marker: b
    text: “礼仪”或译“仪式”“入教仪式”；希腊词可指宗教性的礼仪活动。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισήσας
  choice: 你憎恨他们
  rationale: 这是指向上帝的简式过去主动分词；宾语须由上文补出，译作“他们”可自然承接前文所说的当地居民，同时保留上帝憎恨其恶行这一语境关系。
- source_word: ἐπὶ τῷ
  choice: 因为
  rationale: 此结构在这里说明憎恨的根据或原因；“因为”是现代汉语中自然清楚的因果表达。
- source_word: ἔχθιστα
  choice: 极可憎的
  rationale: 保留最高程度的强烈厌恶意味；汉语用“极”比生硬直译为“最可憎的”更自然。
- source_word: πράσσειν
  choice: 行
  rationale: 表示实施或惯行某些行为；“行”简洁庄重，也适合与道德及宗教行为搭配。
- source_word: ἔργα
  choice: 事
  rationale: 此处指具体作为或行为；译作“事”符合现代汉语习惯，并避免“工作”可能产生的误解。
- source_word: φαρμακειῶν
  choice: 巫术
  rationale: 该词可指借药物、毒物或符咒进行的魔法活动；在本节宗教谴责的语境中，“巫术”最能传达其主要含义，同时以脚注保留较宽泛的可能。
- source_word: τελετὰς
  choice: 礼仪
  rationale: 可指宗教仪式，尤其可能包括入教或秘仪性质的礼仪；正文采用范围较宽的“礼仪”，不把具体形式定死。
- source_word: ἀνοσίους
  choice: 不圣洁的
  rationale: 该词指违背圣洁或虔敬要求；“不圣洁的”贴近原词，也与宗教礼仪的语境相称。
theological_decisions:
- issue: 分词 μισήσας 的主语、宾语及其与因果短语的关系
  choice: 译作“你憎恨他们，因为他们行……”，把分词的主语理解为上文中的上帝，宾语“他们”承接上文所说的居民。
  alternative: 可较少补足地译作“因他们行……而憎恨他们”，或把重点处理为“你所憎恨的事”。
  rationale: 希腊文在本节单独看来省略了宾语，但分词的主语由上下文指向上帝；ἐπὶ τῷ 加不定式说明憎恨的根据。译文补出“他们”以形成自然汉语，同时没有把 μισήσας 改释为修饰“事”的成分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行极可憎的事”保持经文语体，却不使用艰深古语；破折或过多嵌套未采用，以清楚呈现本节的因果结构。
