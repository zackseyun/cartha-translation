  text: Neither king nor tyrant will be able to look you in the face concerning those whom you punished[a].
translation:
  language: zh_hans
  text: 没有君王或暴君能就你所惩罚的人，当面与你相对。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当面面对你”、“与你正面对视”或“站在你面前”。希腊文这个罕见动词生动地表示直接面对某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε βασιλεὺς ἢ τύραννος
  choice: 无论君王还是暴君，都不能
  rationale: 这里是否定并列，涵盖两类掌权者；“君王”和“暴君”保留原文对 βασιλεύς 与 τύραννος 的区分。
- source_word: ἀντοφθαλμῆσαι
  choice: 与你当面对质
  rationale: 这个罕见动词带有面对面、目光相接地抗辩或对抗的生动意味；“当面对质”在现代汉语中自然，也不把它过度解释为正式审判用语。
- source_word: δυνήσεταί σοι
  choice: 都不能……与你
  rationale: δυνήσεται 表示将来或一般性的能力否定；汉语用“不能”即可自然表达。σοι 指动作所针对的对象，融入“与你当面对质”。
- source_word: περὶ ὧν
  choice: 为……的人
  rationale: 字面可理解为“关于那些……的”；结合关系代词与惩罚语境，译作“为你所惩罚的人”较自然，同时保留这些掌权者因受罚者而提出抗辩的关系。
- source_word: ἐκόλασας
  choice: 你所惩罚
  rationale: κολάζω 在此指施加惩罚或刑罚；“惩罚”准确而不过度限定为管教。
theological_decisions:
- issue: 掌权者面对上帝惩罚行为时的“对视/对质”意象
  choice: 译作“与你当面对质”，表示没有世上掌权者能因上帝所惩罚的人而直接抗辩或对抗上帝。
  alternative: “敢正眼看你”或“能站在你面前”
  rationale: 原文意象比单纯“反对”更生动，却未明确采用完整的法庭问责术语；本译保留直接面对并抗辩的张力，不将含义收窄为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无论……还是……”自然表达两类统治者均被排除；“当面对质”保留原文鲜明的面对面冲突意象。
