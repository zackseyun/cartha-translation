  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/006.yaml
  text: and you intended to destroy, by the hands of our fathers, even parents who killed helpless lives,[a]
translation:
  language: zh_hans
  text: 你定意借着我们祖先的手，毁灭那些杀害无助者性命的父母。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些杀害无助灵魂（或‘无助之人’）的父母。”希腊语 ψυχῶν 可译为“生命”“灵魂”或“人”；这里很可能具体指弱小受害者的性命。
    reason: 保留 ψυχῶν 的词义幅度，并说明 αὐθέντας γονεῖς 可作较贴近原文结构的表达。
lexical_decisions:
- source_word: αὐθέντας
  choice: 杀害……的
  rationale: 此处修饰“父母”，表示他们犯有杀人流血之罪；译为“杀害”既符合上下文，也避免采用后期的“主人”等词义。
- source_word: γονεῖς
  choice: 父母
  rationale: 该词泛指双亲，并非专指父亲；“父母”准确保留其家庭关系含义。
- source_word: ψυχῶν
  choice: 生命
  rationale: 上下文针对杀害弱小者的行为，此处指受害者活生生的性命，而非强调抽象的灵魂观念。
- source_word: ἀβοηθήτων
  choice: 无助的
  rationale: 该词指得不到援助、无人保护；“无助”简洁自然，并保留受害者弱小无援的意味。
- source_word: ἐβουλήθης
  choice: 你定意
  rationale: 表达经过意志决定的旨意；“定意”庄重而不生硬，也比单纯“想要”更能体现明确意向。
- source_word: ἀπολέσαι
  choice: 毁灭
  rationale: 指使这些人走向灭亡或死亡；“毁灭”保留该动词较宽的审判性语义。
- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: 借着我们祖先的手
  rationale: 该短语表示工具或媒介，并以“手”突出执行行动；πατέρων 在历史语境中指以色列人的祖先。
theological_decisions:
- issue: ψυχῶν ἀβοηθήτων 的所指
  choice: 无助的生命
  alternative: 无助的灵魂／无助的人
  rationale: 上下文谴责献祭儿童及暴力杀戮。“生命”聚焦于弱小受害者被夺去的性命，不额外引入灵魂与身体二分的观念，同时以脚注保留希腊语的其他可能表达。
- issue: αὐθέντας 与 γονεῖς 的关系
  choice: 那些杀害无助生命的父母
  alternative: 无助灵魂的凶手——那些父母
  rationale: 将 αὐθέντας 理解为描述父母所犯的杀人行为，符合紧邻宾语和上下文；中文采用关系结构，清楚表达父母既是施害者，也是受审判者。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“借着……的手”保留希腊语的鲜明工具性表达；“祖先”比“父辈”更准确指向以色列历史上的先民。
