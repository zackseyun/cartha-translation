base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: zh_hans
  text: 但你借着这样的作为教导了你的子民：义人应当仁爱待人[a]；你也使你的儿子们满怀美好的盼望[b]，因为你赐给人悔改罪过的机会[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人应当爱护世人。”
    reason: lexical_alternative
  - marker: b
    text: “儿子们”也可按代表性用法理解为神的儿女或子民；希腊原文明确作“儿子们”。
    reason: lexical_alternative
  - marker: c
    text: 较直译：“因为你赐下悔改。”原文可指神赐予悔改本身，也可理解为神赐给犯罪者悔改的机会。
    reason: theological_ambiguity
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: 借着这样的作为
  rationale: διά加属格在此表工具或途径；“作为”自然地指神在上文所行之事，也避免“工作”可能产生的现代职业含义。
- source_word: τὸν δίκαιον
  choice: 义人
  rationale: 保留希腊文单数实体形容词的代表性表达；“义人”是现代中文圣经语体中自然、庄重且不笨重的说法。
- source_word: φιλάνθρωπον
  choice: 仁爱待人
  rationale: 该词指向对人的善意、仁厚与关爱；“仁爱待人”既保留其明确的人际指向，也不将含义缩窄为单纯的怜悯。
- source_word: εὐέλπιδας
  choice: 满怀美好的盼望
  rationale: 表达拥有良好、积极盼望的状态；“满怀”传达该形容词强烈而正面的色彩。
- source_word: τοὺς υἱούς σου
  choice: 你的儿子们
  rationale: 希腊文明确使用阳性复数“儿子们”；正文保留其词形与亲子意象，脚注说明其代表性用法。
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: 你赐人机会为罪悔改
  rationale: διδοῖς突出神的赐予，μετάνοια指悔改；补出“机会”能自然表达此处神为犯罪者提供悔改可能性的语境，同时以脚注保留较直译的理解。
theological_decisions:
- issue: 阳性代表性表达
  choice: 正文译作“义人”和“你的儿子们”
  alternative: “行义的人”和“你的儿女／子民”
  rationale: “义人”在中文中可自然作代表性单数；“儿子们”则保留原文明确的阳性复数及亲子意象，不在正文中默默中性化，并以脚注说明其可代表神的儿女或子民。
- issue: 神赐予悔改的含义
  choice: “你赐人机会为罪悔改”
  alternative: “你赐下为罪悔改的心／你赐予悔改”
  rationale: 原文强调悔改来自神的赐予，但没有明确界定所赐的是内在悔改之心、许可还是机会。正文依语境采用自然表达，脚注保留形式上更贴近原文、神学上更开放的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“仁爱待人”比单用“仁慈”更充分呈现φιλάνθρωπος对人的指向；分号清楚标示教导内容与随后结果之间的层次。
