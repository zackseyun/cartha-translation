base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: zh_hans
  text: 但即使是这些人，你也因他们是人而宽待他们[a]；你派黄蜂作你军队的先锋[c][b]，好使它们逐步消灭这些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他们是人”也可译作“把他们当作人”。希腊文强调他们是人，表明这是上帝宽待他们、没有立即毁灭他们的缘由。
    reason: lexical_alternative
  - marker: b
    text: “黄蜂”呼应上帝差遣有螫刺的昆虫走在以色列人前面、攻击敌对民族的圣经意象；参《出埃及记》23:28；《申命记》7:20；《约书亚记》24:12。
    reason: cross_reference
  - marker: c
    text: “军队”或作“军营”。希腊文στρατόπεδον可指军营，也可指军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: 但即使是这些人
  rationale: 保留ἀλλὰ καί的转折兼递进语气，并以“这些人”承接上下文所说的民族。
- source_word: ὡς ἀνθρώπων ἐφείσω
  choice: 你也因他们是人而怜惜他们
  rationale: 将ὡς ἀνθρώπων理解为施行克制的理由；ἐφείσω既可指顾惜、宽待，也可指不加毁灭。“怜惜”自然表达此处因其为人而有所克制的含义。
- source_word: ἀπέστειλάς τε
  choice: 你派
  rationale: 简明表达不定过去时的派遣动作；分号已体现与前句的连接。
- source_word: προδρόμους
  choice: 作……先锋
  rationale: 保留“走在前面者”的军事比喻，又符合现代汉语表达。
- source_word: τοῦ στρατοπέδου σου
  choice: 你军队的
  rationale: στρατόπεδον兼有“军营”和“军队”之义；此处与“先锋”相连，译作“军队”更顺畅，同时以脚注保留另一可能。
- source_word: σφῆκας
  choice: 黄蜂
  rationale: 这是该词在本语境中的常见对应，也呼应《出埃及记》23:28、《申命记》7:20和《约书亚记》24:12的意象。
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: 好将他们逐步消灭
  rationale: “好”表达ἵνα的目的关系，“逐步”保留κατὰ βραχύ的渐进性，“消灭”体现ἐξολεθρεύω的强烈含义。
theological_decisions:
- issue: 上帝怜惜他们的理由
  choice: 译为“因他们是人而怜惜他们”，把其人类身份呈现为上帝克制审判的理由。
  alternative: 可译为“把他们当作人而予以宽待”，使ὡς的因果意味较弱。
  rationale: 属格ὡς ἀνθρώπων在此最自然地说明ἐφείσω的考虑或依据；译文不将此处扩展成经文未明说的普遍教义。
- issue: 上帝行动的军事比喻
  choice: 保留“军队”和“先锋”的军事意象。
  alternative: 将στρατόπεδον译为“军营”。
  rationale: 原文把黄蜂描绘成上帝军队或军营前面的先锋；直译这一修辞可避免将其过度寓意化。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“怜惜”保留神的仁慈与暂缓毁灭之意；“先锋—军队”维持原文连贯的军事图像。脚注标记均置于对应词句之后，并按英文审校层提供的a、b、c标识保留。
