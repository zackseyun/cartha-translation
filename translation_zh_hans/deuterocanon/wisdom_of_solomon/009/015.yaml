base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/015.yaml
  text: For a perishable body weighs down the soul[a], and the earthly tent burdens a mind full of cares.
translation:
  language: zh_hans
  text: 因为必朽的身体使灵魂沉重，属土的帐幕也重压着多思多虑的心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多思多虑”也可译作“思虑纷繁”或“满怀忧虑”。
    reason: πολυφρόντιδα可指有许多思虑、挂虑；保留其在“多有思想”与“多所忧虑”之间的语义范围。
lexical_decisions:
- source_word: φθαρτὸν
  choice: 必朽的
  rationale: 表示会腐朽、败坏的性质；“必朽”简洁自然，并保留身体脆弱且终归朽坏的含义。
- source_word: σῶμα
  choice: 身体
  rationale: 该词在此指人的肉身，“身体”是现代汉语中直接而准确的对应。
- source_word: βαρύνει
  choice: 压迫
  rationale: 原词有使之沉重、压下之意；“压迫”保留身体给灵魂带来重负的意象。
- source_word: ψυχήν
  choice: 灵魂
  rationale: 与后句的“心”相区别，保留原文 ψυχή 与 νοῦς 所呈现的不同内在层面。
- source_word: βρίθει
  choice: 压得……沉重
  rationale: 该词表达以重量压住或使负担沉重；如此译出可自然呈现原文的重量意象，并与前句形成平行。
- source_word: γεῶδες
  choice: 属土的
  rationale: 既可指属地，也可指由土而成；“属土的”保留这两层相近含义，不把它窄化为单纯的“世俗”。
- source_word: σκῆνος
  choice: 帐幕
  rationale: 原义是帐篷或临时居所；“帐幕”保留身体作为暂时居所的比喻，同时具有庄重的经文语体。
- source_word: νοῦν
  choice: 心
  rationale: 此处指思想、理智的内在官能；汉语“心”能自然承载心思与理智之义，并与“灵魂”有所区别。
- source_word: πολυφρόντιδα
  choice: 思虑纷繁的
  rationale: 该词可表示充满许多挂虑或思绪；“思虑纷繁”保留“多所思虑”的开放性，不限定为临床意义的焦虑。
theological_decisions:
- issue: ψυχή 与 νοῦς 在身体意象中的人论区别
  choice: 分别译作“灵魂”和“心”
  alternative: 将 ψυχή 译作“生命”或“自身”，将 νοῦς 译作“理智”或“悟性”
  rationale: 原文以两个不同词描述人的内在层面。分别译出可保留诗句的层次与张力，避免把两者合并成同一概念，也不据此建立超出经文的体系。
- issue: γεῶδες σκῆνος 的身体隐喻
  choice: 译作“属土的帐幕”
  alternative: 译作“土造的居所”或直接译作“属地的身体”
  rationale: “帐幕”保留 σκῆνος 的临时居所隐喻，“属土”则保留人与尘土及地上存在的联系，而不把隐喻解释性地改写为“身体”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“身体—灵魂”与“帐幕—心”的平行结构及重量意象；“帐幕”略具经文色彩，但仍为现代读者所能理解。
