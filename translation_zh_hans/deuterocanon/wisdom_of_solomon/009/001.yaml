  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/001.yaml
  text: God of the fathers and Lord of your mercy[a], who made all things by your word,
translation:
  language: zh_hans
  text: 列祖的上帝、你怜悯之主[a]啊，你借着你的话[b]创造了万物，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“你怜悯之主”的属格结构；也可译为“施行你怜悯的主”。
    reason: 保留原文明确的“你的”及其与“怜悯”和“主”的属格关联，同时说明自然的释义性译法。
  - marker: b
    text: “话”也可按语境理解为“命令”。
    reason: λόγος在此既可保留为“话”，也可理解为上帝施行创造的命令。
lexical_decisions:
- source_word: θεὲ πατέρων
  choice: 列祖的上帝
  rationale: θεέ是直接呼告；πατέρων没有明示所属代词。“列祖”既保留祖辈与信仰传承的意味，也不擅自补入“我们的”
- source_word: Κύριε τοῦ ἐλέους σου
  choice: 施怜悯的主
  rationale: 希腊语直译式“你怜悯的主”在现代汉语中容易被误解为“你所怜悯的主”。采用自然的动词结构表达主施行其怜悯，并以脚注保留原文独特的属格结构及明确的“你的”
- source_word: ὁ ποιήσας τὰ πάντα
  choice: 创造了万物
  rationale: ποιήσας表示已经完成的创造行动；在以万物为宾语且主语为上帝的语境中，“创造”比一般性的“造了”更清楚自然，同时不扩展τὰ πάντα的范围
- source_word: ἐν λόγῳ σου
  choice: 借着你的话
  rationale: ἐν在此可表凭借或媒介；“借着”保留这种关系。λόγος译作“话”，既忠于基本词义，也避免把它单义化为“命令”或直接赋予后期专门神学含义
theological_decisions:
- issue: 创造语境中λόγος的含义
  choice: 话
  alternative: 命令
  rationale: “话”保留λόγος本身的宽度及可能的经文互文回响，却不强行认定其为特定的位格称号；“命令”符合语境，但会缩窄原词含义。
- issue: Κύριε τοῦ ἐλέους σου中怜悯与主的关系
  choice: 施怜悯的主
  alternative: 你怜悯的主；满有怜悯的主
  rationale: 原文属格结构可表达以怜悯为特征或与怜悯有主属关系。正文用自然汉语表达，却不把它处理成单纯的形容词“仁慈”；脚注交代字面结构，以保留其张力。
translation_notes:
  register: 采用庄重而清楚的现代普通话。“列祖”保留经文祷告中的传承语感；两个“啊”中的呼告语气只在并列称号末尾表达一次。句末逗号依照本节尚未完结的句法保留。
