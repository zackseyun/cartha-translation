  text: and my works will be acceptable, and I will judge your people justly, and I will be worthy of my father's thrones.
translation:
  language: zh_hans
  text: 这样，我所做的事必蒙悦纳；我必按公义审判你的子民，也必配得我父亲的众宝座。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众宝座”依希腊文直译；原文“宝座”为复数。
    reason: 复数形式在中文中较为突显，脚注说明这是源文本身的表达，避免读者误以为排印有误。
lexical_decisions:
- source_word: προσδεκτὰ
  choice: 蒙悦纳
  rationale: 表达“受到接纳、认可”的被动含义，较“可接受”更自然庄重。
- source_word: διακρινῶ
  choice: 审判
  rationale: 在治理百姓的语境中指作出裁断；与副词“按公义”搭配自然。
- source_word: δικαίως
  choice: 按公义
  rationale: 保留行为符合公正、公义标准的含义。
- source_word: ἄξιος
  choice: 配得
  rationale: 准确表达有资格、堪当之意。
- source_word: θρόνων
  choice: 众宝座
  rationale: 希腊文为复数，正文保留其数的信息，不擅自改为单数。
theological_decisions:
- issue: “我父亲的宝座”在原文中为复数
  choice: 我父亲的众宝座
  alternative: 我父亲的宝座
  rationale: 忠实保留θρόνων的复数形式；虽中文表达略显特别，但不以常见的单数观念消解原文。
- issue: διακρινῶ的司法或治理意味
  choice: 审判你的子民
  alternative: 公正治理你的子民
  rationale: 原词主要指分辨、裁决或审判；采用“审判”保留司法力度，同时不把它缩窄为一般行政治理。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；以“这样”承接上文祈求所得的结果，用分号呈现三个并列后果。
