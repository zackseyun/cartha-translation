base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/005.yaml
  text: for I am your servant and the son of your female servant[a], a weak man and short-lived, and lacking in understanding of judgment and laws[b];
translation:
  language: zh_hans
  text: 因为我是你的奴仆，也是你女奴的儿子[a]；我是个软弱、寿命短暂的人，对审判和律法的理解也不足[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”和“女奴”所译的希腊词都带有奴役和隶属的身份意味；也可较弱地译作“仆人”和“婢女”。
    reason: lexical_alternative
  - marker: b
    text: 原文说说话者在领悟“审判和律法”上较为不足或不及，比较对象没有明说。“审判”也可理解为“判断”或“裁决”。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴仆
  rationale: 该词表示受奴役、隶属的身份，不只是一般的服事。“奴仆”既保留说话人在上帝面前自卑、隶属的语气，也符合现代中文庄重语体。
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: 你婢女的儿子
  rationale: παιδίσκη可指女奴或婢女；“婢女”自然简洁，并与“奴仆”共同保留原文的卑微身份用语。
- source_word: ἄνθρωπος ἀσθενής
  choice: 软弱的人
  rationale: ἄνθρωπος在此指说话者本人，ἀσθενής强调能力有限和脆弱；“软弱的人”直接而自然。
- source_word: ὀλιγόχρονιος
  choice: 寿命短促
  rationale: 该复合词表示时日不多、寿命短暂；“寿命短促”准确传达人的有限与必死性。
- source_word: ἐλάσσων ἐν συνέσει
  choice: 在理解……上能力不足
  rationale: ἐλάσσων是比较级，表达较少、较弱或不足；结合σύνεσις，用“能力不足”传达理解力不够，同时避免生硬直译为“较小”。
- source_word: κρίσεως
  choice: 审判
  rationale: κρίσις可指判断、裁决或司法审判；此处处于君王求智慧的语境，“审判”保留司法治理色彩。
- source_word: νόμων
  choice: 律法
  rationale: 原文为复数，泛指法律、法则；“律法”符合经文语体，并保留其规范与治理含义。
theological_decisions:
- issue: 祷告中奴役身份用语的力度
  choice: 正文采用“奴仆／婢女”
  alternative: 仆人／使女
  rationale: 原文δοῦλος与παιδίσκη都带有明确的从属身份色彩。译作“奴仆／婢女”能保留说话人在上帝面前的自卑，而不把这种张力淡化为一般服务关系。
- issue: κρίσις在君王祷告中的含义
  choice: 译作“审判”
  alternative: 判断；裁决；公正
  rationale: 原词有一定语义幅度。主文采用带司法色彩的“审判”，但不将其进一步解释为某种特定治理理论；脚注说明也保留“判断、裁决”的可能。
- issue: ἐλάσσων的比较意味
  choice: 译作“能力不足”
  alternative: 较少；不及；欠缺
  rationale: 希腊文形式上是比较级，但没有明说比较对象。中文若直译为“较少”不够自然，因此正文表达为“不足”，并在脚注保留其“较少／不及”的形式张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。句式保留祷告中层层自谦的推进：“奴仆”身份、人的软弱短寿、判断与律法方面的不足。分号承接上下文。
