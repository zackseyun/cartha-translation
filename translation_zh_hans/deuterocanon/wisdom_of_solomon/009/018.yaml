translation:
  language: zh_hans
  text: 这样，地上之人的道路得以修直；人们也受到教导，知道你所喜悦的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωρθώθησαν
  choice: 得以修直
  rationale: 该被动动词表示被矫正、整治或使之正直；与“道路”搭配译作“得以修直”，既保留具体意象，也容纳人生道路归正的比喻意义。
- source_word: τρίβοι
  choice: 道路
  rationale: 原词指踩踏形成的路径、道路；“道路”在现代汉语中自然，并能保留智慧文学中常见的人生道路意象。
- source_word: τῶν ἐπὶ γῆς
  choice: 世上之人的
  rationale: 原文为实体化短语，泛指生活在地上的人；此译法贴近原文范围，不将其缩窄为某一群体。
- source_word: ἀρεστά σου
  choice: 你所喜悦的事
  rationale: 中性复数形容词在此作名词使用，指一切蒙上帝喜悦、合其心意的事；此译法自然且保留其内容上的复数广度。
- source_word: ἐδιδάχθησαν
  choice: 受教，明白了
  rationale: 被动形式强调人领受教导；“受教”保留被动语态，“明白了”补足现代汉语中教导内容与学习结果之间的自然表达。
- source_word: ἄνθρωποι
  choice: 人们
  rationale: 该词在此泛指人类，并非专指男性；现代汉语“人们”准确表达其通用的人类指称。
theological_decisions:
- issue: 道路被修直的意象是否应抽象化为道德纠正
  choice: 保留“道路得以修直”的具体意象
  alternative: 人的行为得到纠正
  rationale: 原文把“路径”和“修直”相连，既可指引导，也带有道德与属灵归正的意味；保留意象可避免只限定为行为层面的纠正。
- issue: ἄνθρωποι的通用人类指称
  choice: 人们
  alternative: 男人
  rationale: 上下文泛指世上的人类；汉语“人们”自然准确，不引入原文并无的男性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样”承接前文的推论；以“世上之人的道路”保留原文的智慧文学意象，以“受教”呈现被动意义，同时用“明白了”使句法符合现代汉语习惯。
