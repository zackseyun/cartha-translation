base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/011.yaml
  text: For she knows all things and understands[a], and she will guide me prudently in my actions, and will guard me by her glory.
translation:
  language: zh_hans
  text: 因为她知道万事，也明白；她必在我的行动中审慎地引导我，并以她的荣耀护卫我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在她的荣耀中护卫我。”希腊语介词在这里既可表示所处的范围，也可表示所凭借的方式。
    reason: 保留 ἐν τῇ δόξῃ αὐτῆς 的地点义与工具义之间的歧义。
lexical_decisions:
- source_word: οἶδε
  choice: 知道
  rationale: 表示认知、知晓；与后面的 συνίει 区分，保留“知道”与“明白”两个相近而不相同的动作。
- source_word: ἐκείνη
  choice: 她
  rationale: 指前文人格化、在希腊语中为阴性的“智慧”；现代汉语用“她”自然地保留这一人格化表达。
- source_word: πάντα
  choice: 万事
  rationale: 概括性地指一切事物；“万事”简洁庄重，也保留原文的全面范围。
- source_word: συνίει
  choice: 明白
  rationale: 表达领会、理解；原文此处未重复宾语，因此译作“也明白”，不擅自补入“万事”。
- source_word: ὁδηγήσει
  choice: 引导
  rationale: 表示领路、指引；在智慧指导实际行为的语境中，“引导”贴切自然。
- source_word: ἐν ταῖς πράξεσί μου
  choice: 在我的行动中
  rationale: πράξεις 指实际行为、作为或事务；此译法既贴近介词结构，也符合现代汉语表达。
- source_word: σωφρόνως
  choice: 审慎地
  rationale: 指以健全判断、自制和稳妥的方式行事；“审慎地”比笼统的“智慧地”更能体现其实际判断与节制意味。
- source_word: φυλάξει
  choice: 护卫
  rationale: 突出保护、守护之意，并与智慧主动扶助祈求者的语境相合。
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: 以她的荣耀
  rationale: 将 ἐν 理解为方式或凭借，表示智慧以自己的荣耀施行保护；地点性的理解则收入脚注，以保留原文歧义。
theological_decisions:
- issue: ἐν τῇ δόξῃ αὐτῆς 中 ἐν 的含义
  choice: 按工具或凭借义译为“以她的荣耀”
  alternative: 按地点或范围义译为“在她的荣耀中”
  rationale: 希腊语 ἐν 在此既可表示所处范围，也可表示施行护卫的方式或凭借。正文采用与“护卫”衔接自然的工具义，但用脚注保留地点义，不将原文张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“她”保留“智慧”的女性人格化；首句依照希腊语语序译作“知道万事，也明白”，避免把“万事”未经说明地同时支配两个动词。
