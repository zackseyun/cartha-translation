base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: zh_hans
  text: 求你从圣洁的诸天差遣她[a]，从你荣耀的宝座派她来，使她与我同在，与我一同劳作[b]，好让我知道什么是你所喜悦的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“她”指智慧；希腊文把智慧人格化为女性形象。
    reason: 说明阴性代词所保留的人格化表达，避免读者误解指代对象。
  - marker: b
    text: “劳作”也可译作“辛劳”；原文强调智慧与祈祷者共同参与工作。
    reason: 保留κοπιάσῃ所含的辛劳意味及共同劳作的形象。
lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν
  choice: 差遣她
  rationale: ἐξαπόστειλον含有从某处差出、派出的方向意味；“差遣”符合祷告的庄重语体。“她”保留希腊文对智慧的阴性人格化表达。
- source_word: ἐξ ἁγίων οὐρανῶν
  choice: 从圣洁的诸天
  rationale: 保留οὐρανῶν的复数形式；“诸天”在现代中文宗教文学中庄重且易懂，“圣洁的”准确表达ἁγίων。
- source_word: ἀπὸ θρόνου δόξης σου
  choice: 从你荣耀的宝座
  rationale: 贴近希腊文“你之荣耀的宝座”这一属格结构，同时保持自然中文；不直接改写为“你荣耀无比的宝座”，以免过度解释。
- source_word: πέμψον αὐτήν
  choice: 派她来
  rationale: πέμψον是一般性的“派遣、差来”；补出“来”可自然表达朝向祈祷者的动作，并与前句“差遣”形成平行而不显重复。
- source_word: συνπαροῦσά μοι
  choice: 使她与我同在
  rationale: 保留共同在场、陪伴祈祷者的含义，不进一步解释为引导、帮助或住在里面。
- source_word: κοπιάσῃ
  choice: 与我一同劳作
  rationale: κοπιάω表示辛劳、劳作；结合前面的共同在场语义，译出共同劳作的形象，比泛化为“帮助我”更忠实。
- source_word: γνῶ
  choice: 让我知道
  rationale: 准确表达目的从句中的“使我知道”；中文以“让我”承接祈求语气自然清楚。
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: 什么是你所喜悦的
  rationale: 自然表达παρὰ σοί在此处“在你看来、对你而言”的关系含义，同时保留εὐάρεστόν的“蒙喜悦”意味。
theological_decisions:
- issue: 智慧被人格化为阴性形象，并从上帝的诸天和荣耀宝座那里受差遣
  choice: 以“她”指代智慧
  alternative: 用“它”作抽象指代，或每次重复“智慧”
  rationale: 希腊文以阴性代词αὐτήν和阴性分词συνπαροῦσά明确延续智慧的女性人格化形象。“她”忠实保留这一文学和神学张力，但不把智慧进一步等同于经文未明说的特定神圣位格。
- issue: 智慧与祈祷者共同劳作
  choice: 译作“与我一同劳作”
  alternative: 译作“帮助我”或“替我劳作”
  rationale: 原文描绘智慧与说话者共同在场并劳作；保留共同劳作的形象，不将其削弱为一般帮助，也不暗示智慧取代人的行动。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“诸天”保留原文复数和诗性高度；“差遣她／派她来”呈现两个平行命令。“她”有意保留智慧的女性人格化，不作超出本节的教义认定。
