  text: For the reasonings of mortals are timid, and our thoughts are uncertain;
translation:
  language: zh_hans
  text: 因为必死之人的推理怯弱，我们的思虑也不可靠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμοὶ
  choice: 推理
  rationale: 指思考、权衡的过程，而不只是静态的念头；“推理”也与后面的“思虑”保持词义区别。
- source_word: θνητῶν
  choice: 必死之人
  rationale: 突出人受死亡辖制的处境，而非性别；比泛称“人”更完整地保留原文的死亡性意味。
- source_word: δειλοί
  choice: 怯弱
  rationale: 在此形容人的推理胆怯、软弱而缺乏把握；“怯弱”保留其消极力度，又不至于强化为道德上的“懦弱”。
- source_word: ἐπισφαλεῖς
  choice: 不可靠
  rationale: 该词表示不稳固、易出差错或失败；“不可靠”自然地表达人的思虑不能作为稳妥依据。
- source_word: ἐπίνοιαι
  choice: 思虑
  rationale: 可指构想、计谋或心中的考虑；“思虑”既表达内在思想活动，又避免与 λογισμοί 译成同一个词。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 直接保留第一人称复数，表明说话者将自己包括在一般人类之中。
theological_decisions:
- issue: θνητῶν 的人论重点
  choice: 必死之人
  alternative: 人类；世人
  rationale: 原文强调人是必死的受造者，并由此显出人的认知局限；译作“必死之人”保留这一对照意味。
- issue: δειλοί 是否带有道德谴责
  choice: 怯弱
  alternative: 懦弱；畏缩
  rationale: 上下文重在说明人类推理的有限和迟疑，不宜把该词断然解释成可责备的懦夫品格；“怯弱”保留原文张力而不过度定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留希腊文两个并列分句的平衡；以“也”自然呈现 καί 的连接作用。无脚注。
