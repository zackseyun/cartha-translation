  text: You chose me beforehand as king of your people and as judge of your sons and daughters;[a]
translation:
  language: zh_hans
  text: 是你预先拣选我作你百姓的王，作你儿子和女儿的审判者；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你任命我”或“你事先选中我”；希腊文动词含有在先选择的意思。
    reason: 说明 προείλω 的词义范围及其前缀所表达的在先意味。
lexical_decisions:
- source_word: σύ
  choice: 是你
  rationale: 保留句首独立人称代词的强调作用，并以现代汉语“是你”自然地突出上帝是施行拣选者。
- source_word: προείλω
  choice: 预先拣选我
  rationale: 既保留动词“选择、拣选”的核心意义，也表达前缀 προ- 所含的事先、在先之意；不将其缩减为较偏制度性的“任命”。
- source_word: βασιλέα λαοῦ σου
  choice: 作你百姓的王
  rationale: “王”直接对应 βασιλέα；属格 λαοῦ σου 译为“你百姓的”，符合汉语习惯，也不额外添加原文没有明说的关系。
- source_word: δικαστήν
  choice: 审判者
  rationale: 保留 δικαστής 作出司法裁断、施行审判的含义，比宽泛的“统治者”更准确。
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: 你儿子和女儿的
  rationale: 原文明确并列“儿子”和“女儿”，故不概括为“儿女”或“子民”，以保存源文本身的性别配对表达。
theological_decisions:
- issue: 所罗门蒙选立为王的性质
  choice: 预先拣选我
  alternative: 任命我；选中我
  rationale: 译文表达神在先的选择，却不把本节扩展为关于预定论的系统性断言，从而保留经文本身的范围。
- issue: 神子民的亲属称谓
  choice: 你儿子和女儿
  alternative: 你的儿女；你的子民
  rationale: 按原文分别保留男性与女性后裔的称谓，不中性化，也不将亲属意象改写成政治称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首“是你”保留希腊文强调；两个“作”使并列身份清楚自然。正文脚注标记与脚注条目一致。
