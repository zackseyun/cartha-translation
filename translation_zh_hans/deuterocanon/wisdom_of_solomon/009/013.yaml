  text: For what man can know the counsel of God? Or who can discern what the Lord wills?[a]
translation:
  language: zh_hans
  text: 因为，世人中有谁能知道上帝的旨意？谁又能揣度主所愿的是什么？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为，世人中有谁能知道上帝的计划？谁又能思量主想要什么？”
    reason: 提供βουλή（“旨意／计划”）、ἐνθυμηθήσεται（“揣度／思量”）和θέλει（“所愿／想要”）的主要词义替代。
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: 因为有谁
  rationale: ἄνθρωπος在此为泛指的单数“人”。现代汉语的反问句用“有谁”已自然包含“什么人”的意思，既保留普遍性，也避免生硬的“哪个人”。γάρ译为“因为”，承接上文的论证。
- source_word: γνώσεται
  choice: 能知道
  rationale: 形式上是将来时，但在反问中表达人的能力与可能性；译作“能知道”最符合汉语语用，并保留人无法凭自己认识之意。
- source_word: βουλὴν θεοῦ
  choice: 上帝的谋算
  rationale: βουλή可指商议、谋划、旨意或计划。“谋算”保留其审慎筹划的意味，又不把它过度限定为已经颁明的“旨意”。θεός译作“上帝”。
- source_word: ἐνθυμηθήσεται
  choice: 能揣度
  rationale: 该词表示在心里思量、考虑。此处与“知道”平行，重点是人能否思量而把握主的心愿；“揣度”兼具内心推求和有限认知的语感。
- source_word: τί θέλει ὁ κύριος
  choice: 主所愿的是什么
  rationale: θέλει表示愿意、意欲；“所愿”庄重而自然，并保留其与“旨意”等术语之间的开放性。κύριος按神圣称谓译为“主”。
theological_decisions:
- issue: 泛指ἄνθρωπος是否明译为“人”
  choice: 有谁
  alternative: 什么人
  rationale: 希腊文虽有ἄνθρωπος，但中文“有谁能……”是自然的泛指反问，不损失其指向全人类的含义，也不引入性别限定。
- issue: βουλή的神学语义
  choice: 谋算
  alternative: 旨意／计划
  rationale: “谋算”保留神的筹划、意图这一宽广语义，避免将βουλή与下半句θέλει完全同义化，也不把经文系统化为特定教义术语。
- issue: ἐνθυμηθήσεται的认知强度
  choice: 能揣度
  alternative: 会思量／能明白
  rationale: 原词本义偏向内心思量，语境又暗含能否把握主的意愿。“揣度”保留这两层意味，不将其过强地解释成完全洞察。
translation_notes:
  register: 采用现代、庄重而可朗读的智慧文学语体。两个平行反问保持简洁有力；“谋算”与“所愿”避免重复，并保留原文两个相关但不完全相同的表达。
