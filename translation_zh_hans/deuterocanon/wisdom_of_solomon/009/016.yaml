base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: zh_hans
  text: 我们对地上的事尚且只能勉强推测，连手边的事也要费力才能弄清；至于天上的事，谁曾探究透彻呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “探究透彻”也可译作“追查到底”；希腊语动词含有循着踪迹彻底查明的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: 勉强
  rationale: 表达困难和近乎不能，符合本节对人类认知局限的强调。
- source_word: εἰκάζομεν
  choice: 推测
  rationale: 表示依据有限而作判断，并非确知；比“猜”庄重，也不过度强化为严密推论。
- source_word: τὰ ἐπὶ γῆς
  choice: 地上的事
  rationale: 直接保留与“天上的事”的空间和意义对照。
- source_word: τὰ ἐν χερσὶν
  choice: 手边的事
  rationale: 希腊语字面为“在手中的事”，此处自然指近在眼前、容易接触的事；“手边”既保留意象，也符合现代汉语。
- source_word: εὑρίσκομεν μετὰ πόνου
  choice: 要费力才能弄清
  rationale: εὑρίσκομεν 可指发现、查明，μετὰ πόνου 强调劳苦和艰难；合译后自然清楚，并避免生硬的“以劳苦找到”。
- source_word: τὰ ἐν οὐρανοῖς
  choice: 天上的事
  rationale: 与“地上的事”形成整齐对照；汉语无需机械体现希腊语“诸天”的复数形式。
- source_word: τίς ἐξιχνίασεν
  choice: 谁曾探究透彻呢
  rationale: ἐξιχνιάζω 有循迹查究到底的意味；“探究透彻”保留彻底查明的语义和反问语气。
theological_decisions:
- issue: 人类对天上现实的认识限度
  choice: 保持由地上之事难知转向天上之事无人能彻底探明的反问
  alternative: 将“天上的事”明确解释为“上帝的旨意”或“属天的奥秘”
  rationale: 本节希腊文本只说“天上的事”，尚未在句内明确指称上帝的旨意；译文不提前引入后文可能提供的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文三层递进：地上的事只能勉强推测，手边的事也须费力弄清，天上的事则以反问凸显人的限度。脚注标记置于全句末尾，对应末句动词。
