  source_fidelity: 译文准确保留了原文的三重结构：人对地上之事仅能勉强推测；即使近在手边之事也须劳苦才能查明；对于天上之事，则以反问表达人无法彻底探究。没有将“天上的事”预先解释为神的旨意或奥秘，恰当地保留了原文的开放性。
