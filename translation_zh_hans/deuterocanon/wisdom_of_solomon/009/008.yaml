base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/008.yaml
  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: zh_hans
  text: 你曾说，要在你的圣山上建造一座殿宇，在你居住的城中筑一座祭坛，作为你从起初就预备好的圣幕[a]的仿本。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣幕”也可译作“神圣的帐篷”；希腊词既可泛指帐篷，也可在圣经语境中指敬拜所用的帐幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας
  choice: 你曾说
  rationale: 直译 λέγω 的不定过去时，保留祷告中的直接称呼；不将语义强化为“你命令”。
- source_word: οἰκοδομῆσαι
  choice: 建造……筑……
  rationale: 该不定式承接 εἶπας；中文依宾语自然搭配，殿宇用“建造”，祭坛用“筑”，共同表达建造之意。
- source_word: ναὸν
  choice: 一座殿宇
  rationale: ναός 指圣殿或圣所；“殿宇”庄重而通俗，并保留原文无冠词所允许的不定表达。
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: 在你的圣山上
  rationale: 按现代汉语对山体地点的自然说法译为“山上”，同时保留“你的”和“圣”的修饰关系。
- source_word: πόλει κατασκηνώσεώς σου
  choice: 你居住的城中
  rationale: κατασκήνωσις 含居住、安营之意；此译自然清楚，表达上帝临在并居住于城中的意思，而不额外限定其方式。
- source_word: θυσιαστήριον
  choice: 一座祭坛
  rationale: 祭祀语境中的标准对应词。
- source_word: μίμημα
  choice: 仿制品
  rationale: 表达依照先在范型制成之物，比单纯“样式”更能保留名词的实体性，又不引入后期神学体系。
- source_word: σκηνῆς ἁγίας
  choice: 圣幕
  rationale: σκηνή 本义为帐幕，在圣经祭祀语境中可指神圣帐幕；“圣幕”简洁庄重，兼顾本义与传统用语。
- source_word: ἣν προητοίμασας
  choice: 你……预备好的
  rationale: 保留上帝已经预先预备的完成意味；其先在性也由下文“从起初”明确表达。
- source_word: ἀπʼ ἀρχῆς
  choice: 从起初
  rationale: 保留原文的时间深度，不将其具体化为创造之初或某一历史时点。
theological_decisions:
- issue: 地上圣所与先在神圣帐幕在 μίμημα σκηνῆς ἁγίας 中的关系
  choice: 作为……圣幕的仿制品
  alternative: 作为……圣幕的摹本／样式
  rationale: “仿制品”保留地上建造物依照先在范型而成的对应关系，却不进一步断定该范型是天上的实体、启示中的图样，或某种哲学意义上的原型。
- issue: κατασκήνωσις 所表达的上帝临在方式
  choice: 你居住的城
  alternative: 你安营的城／你设立帐幕的城
  rationale: 采用自然中文表达上帝的居所，同时避免把词源中的帐幕意象发展成经文本身未明确陈述的教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”“祭坛”“圣幕”维持经文的礼仪语域；句式保留祷告中对上帝的第二人称直接称呼。脚注仅说明 σκηνή 的真实词义范围，不消解其可能兼具普通帐篷与圣所帐幕的意涵。
