  text: and govern the world in holiness and righteousness, and judge with uprightness of soul.
translation:
  language: zh_hans
  text: 以圣洁和公义治理世界，以正直的心施行审判。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέπῃ
  choice: 治理
  rationale: 该动词在此表示管理、统治；“治理”自然庄重，也与世界这一宾语搭配。
- source_word: κόσμον
  choice: 世界
  rationale: 直接对应 κόσμος，指受造世界或人所居住的世界；本节无需缩窄范围。
- source_word: ὁσιότητι
  choice: 圣洁
  rationale: 表达合乎神圣要求的敬虔与圣洁；与 δικαιοσύνη 并列时，“圣洁”简洁且保留宗教伦理色彩。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 保留其正义、公正和合宜行为的伦理含义，并与“圣洁”形成自然并列。
- source_word: εὐθύτητι ψυχῆς
  choice: 正直的心
  rationale: 字面为“灵魂的正直”；现代汉语中“正直的心”更自然，且能表达内在品格与动机。
- source_word: κρίσιν κρίνῃ
  choice: 施行审判
  rationale: 希腊语使用同源宾语结构，意为作出或执行判断；中文以“施行审判”传达其强调而避免生硬重复。
theological_decisions:
- issue: ἐν ὁσιότητι καὶ δικαιοσύνῃ 所描述的治理品质
  choice: 以圣洁和公义
  alternative: 在虔敬和正义中
  rationale: “圣洁和公义”保留宗教与伦理两个层面，不将其解释为特定宗派的成圣或称义教义。
- issue: ψυχή 在伦理判断语境中的译法
  choice: 心
  alternative: 灵魂
  rationale: 这里强调审判者内在的正直品格；“心”符合现代汉语表达，同时不对人的构成作神学界定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“以”保持原文并列结构；不增补主语，因为本节承接上文的祈求内容。
