    issue: “差来”可能附带汉语的趋向义，且搭配略不够凝练。
    rationale: ἔπεμψας只表示“差遣”，ἀπὸ ὑψίστων说明其来源；“从高天差遣”可无增义地表达二者。
  - severity: low
    issue: 脚注“希腊原文在形式上不能区分这是专名，还是描述‘圣洁的灵’”表述过强。
    rationale: 希腊语的确没有现代汉语以惯用称谓体现的专名化标记，但该短语本身有明确的限定结构。脚注宜说其措辞本身未要求按后来的专名化理解，以保留解释空间。
