base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: zh_hans
  text: 若不是你赐下智慧，并从高天差遣你的圣灵[a]，谁能知道你的谋划呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的圣灵”也可译作“你圣洁的灵”。希腊原文直译为“你的圣洁的灵”；其措辞本身并未要求把这一短语理解为明确的专名。
    reason: 保留该短语可作惯用称谓或描述性短语理解的解释空间，避免由汉语惯用的“圣灵”一词预先限定其神学含义。
lexical_decisions:
- source_word: βουλήν
  choice: 谋划
  rationale: βουλή可指谋议、筹划或意旨。“谋划”保留上帝所定意图与安排的含义，同时避免把它过度限定为单纯的愿望或不可更改的命令。
- source_word: ἔγνω
  choice: 能知道
  rationale: 该不定代词疑问句表达普遍而持续的反问；汉语用“谁能知道”自然地传达：若非上帝启示，无人可能认识他的谋划。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是智慧文学中的标准核心用语，兼具认识、道德与敬虔层面的意义。
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: 你的圣灵
  rationale: πνεῦμα在此处宜译为“灵”，而不是“气息”；“你的圣灵”是现代汉语中自然、庄重的表达。原文也可按描述性短语理解为“你圣洁的灵”，故以脚注保留这一语义张力。
- source_word: ἀπὸ ὑψίστων
  choice: 从高天
  rationale: 该复数中性形容词名词化，指天上的高处。“从高天”既简洁自然，也保留其属天来源。
theological_decisions:
- issue: τὸ ἅγιόν σου πνεῦμα是否必须作为具有明确位格含义的专名来理解
  choice: 正文译作“你的圣灵”，脚注说明也可译作“你圣洁的灵”
  alternative: 你圣洁的灵
  rationale: 希腊文没有现代语言专名大小写所带来的区分，本身既容许传统的“圣灵”理解，也可作描述性的“圣洁的灵”。正文采用汉语中自然的传统表达，脚注则避免把后期教义上的限定强加于原文。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。将条件从句前置，使逻辑在汉语中清楚自然；“又”对应两个并列的神圣行动，即赐下智慧与差来圣灵。
