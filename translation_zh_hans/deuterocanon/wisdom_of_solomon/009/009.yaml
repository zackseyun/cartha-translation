base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: zh_hans
  text: 智慧与你同在；她知道你的作为，在你创造世界[a]时也在场，并且明白什么是你眼中所喜悦的，什么是合乎你诫命的正当之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有秩序的世界”。希腊语κόσμος可强调世界井然有序的整体。
    reason: 说明κόσμος除一般的“世界”外，还可突出秩序与整体性的词义。
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: 与你同在
  rationale: 表达智慧与上帝相伴、同在的关系，既自然，也不把短语过度解释为空间位置。
- source_word: ἡ σοφία ἡ εἰδυῖα
  choice: 智慧……她知道
  rationale: σοφία通常译为“智慧”；用“她”和后续谓语保留希腊文鲜明的拟人表达，同时不作超出经文的身份认定。
- source_word: τὰ ἔργα σου
  choice: 你的作为
  rationale: “作为”可涵盖上帝所行的一切，不局限于道德意义上的行为。
- source_word: παροῦσα
  choice: 也在场
  rationale: 准确表达智慧在创造之时的临在，不加入“协助”或“参与”等原文未明说的含义。
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: 在你创造世界时
  rationale: κόσμος在此指受造且有秩序的世界；“世界”通俗自然，“创造”在语境中清楚表达上帝造作世界。
- source_word: ἐπισταμένη
  choice: 明白
  rationale: 表达有认知、有辨识的了解，并与前面的“知道”有所区别。
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: 什么是你眼中所喜悦的
  rationale: 保留“在你眼中”的原文意象和以上帝判断为准的意味。
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: 什么是合乎你诫命的正直之事
  rationale: “正直”保留εὐθές所含的端正、正当意味；“合乎”自然表达ἐν在此所指的规范范围。
theological_decisions:
- issue: 智慧的拟人化
  choice: 以“智慧……她知道……也在场，并且明白”保留拟人表达
  alternative: 将智慧完全作为抽象概念，译作“那知道……的智慧”而避免人称代词
  rationale: 希腊文以与σοφία一致的阴性分词连续描写智慧，拟人意味明确；但译文不进一步将她等同于任何特定神学位格。
- issue: κόσμος的范围
  choice: 世界
  alternative: 宇宙；有秩序的世界
  rationale: “世界”既可涵盖整体受造秩序，又避免“宇宙”可能带来的现代科学限定；脚注保留“有秩序的世界”这一词义侧重。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与你同在”“你眼中所喜悦的”保留经文语体；用分号和连续谓语使长句清晰。脚注标记置于其实际解释的“世界”之后。
