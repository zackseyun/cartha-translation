    reason: alternative_reading
lexical_decisions:
- source_word: σοφίᾳ
  choice: 以你的智慧
  rationale: 与属格 σου 连用的与格在此表示凭借或方式；“智慧”保留了本书中该词的神学与文学分量。
- source_word: κατεσκεύασας
  choice: 造了
  rationale: 该动词可指制造、预备或塑造；创造语境中的“造了”自然凝练，也避免赋予词义过多具体的塑形色彩。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 希腊文为单数，在创造语境中以一个代表性的人指向人类；汉语“人”既保留单数形式，也可自然承载泛指意义。
- source_word: ἵνα δεσπόζῃ
  choice: 使他统管
  rationale: ἵνα 引出目的；δεσπόζω 表达掌权管理。“统管”保留其较强的权柄含义，又符合现代汉语表达。
- source_word: τῶν ... κτισμάτων
  choice: 受造之物
  rationale: κτίσματα 可指被创造的生灵或事物；“受造之物”保留其范围，不把所指限缩为有生命的受造物。
- source_word: ὑπὸ σοῦ γενομένων
  choice: 由你而有的
  rationale: 该分词短语修饰“受造之物”，表明其存在源于上帝；“由你而有”保留 γίνομαι“成为、产生、存在”的意味，也避免与前文“造了”机械重复。
theological_decisions:
- issue: 创造语境中 ἄνθρωπον 的代表性所指
  choice: 人
  alternative: 人类；一个人
  rationale: 原文采用单数，却很可能代表全体人类。“人”保留这种单数与整体所指之间的张力，不把它直接改写为集合名词。
- issue: δεσπόζῃ 所表达的管辖强度
  choice: 统管
  alternative: 治理；拥有管辖权
  rationale: 该词表达对受造界的权柄。“统管”能传达较强的治理含义，同时不额外界定这种权柄应如何行使。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“由你而有的受造之物”略带经文语体，以保留原文关于受造物因上帝而存在的表达；脚注标记均置于对应词语之后。
