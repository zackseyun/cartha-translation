  text: and by your wisdom you made man to rule over the creatures that came into being through you[b][a],
translation:
  language: zh_hans
  text: 你又以你的智慧造了人[a]，使他统管[b]你所造的万物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人类”或“一个人”。希腊文用单数“人”，在创造语境中很可能代表全体人类。
    reason: lexical_alternative
