lexical_decisions:
- source_word: σοφίᾳ
  choice: 智慧
  rationale: 与本书贯穿始终的主题和希腊化犹太语境中的通常用法一致；译作“聪明”或“悟性”会使含义过窄。介词性与格结构 τῇ σοφίᾳ 在此自然译为“借着智慧”，表达凭借或媒介。
- source_word: ἐσώθησαν
  choice: 得救了
  rationale: σῴζω 的不定过去时被动语态可涵盖获救、蒙解救和得保全。“得救了”保留原词较宽的救援含义，不把它限定为单纯的肉身脱险或保存。
theological_decisions:
- issue: σῴζω 所表达之拯救的范围
  choice: 得救了
  alternative: 蒙解救了；得保全了
  rationale: “得救了”保留希腊文在历史性解救、保全和较广义救恩之间的张力，不强行赋予后期教义中的狭义含义；脚注列出语境许可的其他译法。
