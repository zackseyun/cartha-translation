base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/006.yaml
  text: For even if someone is perfect among the sons of men[a], apart from the wisdom that comes from you, he will be regarded as nothing.
translation:
  language: zh_hans
  text: 因为，即使有人在世人[a]中堪称完全，若没有从你而来的智慧，他也必算不得什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“人的众子”，是泛指人类的传统说法。
    reason: 说明原文的字面表达及其泛指含义，并避免正文使用可能引起误解的“人子”。
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: 因为，即使有人……是
  rationale: κἄν（καί + ἐάν）表达让步，γάρ承接上文作解释；“因为，即使”在现代汉语中同时保留这两层关系。
- source_word: τέλειος
  choice: 完全的
  rationale: τέλειος可指完全、完备或成熟；“完全的”保留其较高的评价意味，又不把含义限定为道德上毫无瑕疵。
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: 在世人中
  rationale: 该短语直译为“在人的众子中”，是泛指全人类的传统表达。正文采用自然且庄重的“世人”，脚注保留其字面形式。
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  choice: 若没有从你而来的智慧
  rationale: ἀπό明确表示智慧的来源，ἀπούσης表示智慧不在或缺失；此译法自然地保留来源与条件关系。
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: 他也必算不得什么
  rationale: λογισθήσεται是被动将来式，意为被算作或被看作；“算不得什么”是自然现代汉语，同时保留εἰς οὐδέν所表达的彻底否定评价。
theological_decisions:
- issue: “人的众子”这一带有阳性形式的人类统称
  choice: 正文译作“世人”，并以脚注说明字面形式
  alternative: 人的众子
  rationale: 希腊语短语泛指人类，而现代汉语中的“人的众子”生硬，“人子”又容易引起特定称号的联想。“世人”准确传达人类整体的所指，脚注则保存原文形式。
- issue: τέλειος所指的“完全”
  choice: 保留“完全的”，不具体解释为道德无罪或仅指成熟
  alternative: 完美的；成熟的
  rationale: 原词语义范围较宽，本节并未明确限定是哪一种完全；译文保留这种张力，避免加入特定人论判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“完全的”保留原文的评价力度与语义宽度；“算不得什么”比生硬的“被算为无有”更自然，同时仍传达被评定为毫无分量的意思。
