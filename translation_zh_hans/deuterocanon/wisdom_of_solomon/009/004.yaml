  text: Give me the wisdom that sits beside your thrones, and do not reject me from among your children.
translation:
  language: zh_hans
  text: 求你赐给我那坐在你众宝座旁的智慧[a]，不要从你的儿女中弃绝我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那坐在你宝座旁的智慧。”希腊文“宝座”是复数。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要从你的仆人中弃绝我。”希腊文 παῖδες 按语境既可指“儿女”，也可指“仆人”。
    reason: alternative_reading
lexical_decisions:
- source_word: δός μοι
  choice: 求你赐给我
  rationale: δός是直接的命令式“给”，在向上帝祈祷的语境中译作“求你赐给我”，既传达请求语气，也保持自然庄重。
- source_word: πάρεδρον
  choice: 坐在……旁
  rationale: πάρεδρος指坐在某者身旁的人，常含同席、侍立或辅佐之意；此处用动词短语保留空间和宝座意象，不进一步解释其身份。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是σοφία的直接对应；本节将智慧人格化，句法和“坐在……旁”的描写已自然呈现这一点，无须额外加专名标记。
- source_word: τῶν σῶν θρόνων
  choice: 你的众宝座
  rationale: 希腊文θρόνων为复数。虽然汉语通常会自然化为单数“宝座”，正文仍用“众宝座”保留原文形式及其可能具有的天庭或尊荣意象。
- source_word: ἀποδοκιμάσῃς
  choice: 弃绝
  rationale: 该词表示经过判断后拒绝、不予接纳。“弃绝”在祷告语境中庄重而清楚，也比“取消资格”自然。
- source_word: ἐκ παίδων σου
  choice: 从你的儿女中
  rationale: παῖδες可指儿女，也可指仆人；结合此祷告中人与上帝的关系，正文采用“儿女”，并以“从……中”明确表达ἐκ的范围意味。
theological_decisions:
- issue: παῖδες描述人与上帝关系时的含义
  choice: 儿女
  alternative: 仆人
  rationale: παῖδες本身兼有“儿女”和“仆人”两种可能。正文采用符合此处亲属关系语感的“儿女”，但用脚注保留“仆人”这一真实词义可能，不把歧义作教义化处理。
- issue: 上帝的θρόνοι使用复数
  choice: 众宝座
  alternative: 宝座
  rationale: 原文明确使用复数。尽管单数更符合现代汉语惯常表达，译文保留复数，避免擅自消除原文可能承载的尊荣复数或天庭意象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你赐给我”符合普通话祈求语气；“众宝座”略带陌生感，是为忠实保留希腊文复数；“弃绝”保持经文语体的肃穆，同时仍为现代读者所能理解。
