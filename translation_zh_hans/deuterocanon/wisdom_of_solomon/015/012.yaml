base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/012.yaml
  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: zh_hans
  text: 但他把我们的生命看作一场游戏[a]，把我们的生活当作有利可图的庆典；因为他说：“人必须从任何地方设法取得所需，哪怕是从恶中取得[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一场游戏”也可译作“玩物”；后半句也可译作“把我们的生计当作有利可图的盛会”。
    reason: 保留παίγνιον以及βίος的词义范围。
  - marker: b
    text: 或译：“无论有何机会，哪怕行恶，也必须从中获利。”“从恶中”也可能指从坏处境或祸患中取得利益。
    reason: 保留ὅθεν δὴ κἂν、πορίζειν和ἐκ κακοῦ在逐利方式与获利处境之间的歧义。
lexical_decisions:
- source_word: ἐλογίσατο
  choice: 看作
  rationale: 表达有意识的判断和估量，符合此处对这种人错误人生观的描述。
- source_word: παίγνιον
  choice: 一场游戏
  rationale: 保留玩乐、儿戏的意味，同时避免“笑话”过于口语化；“玩物”作为可能意义收入脚注。
- source_word: τὴν ζωὴν ἡμῶν
  choice: 我们的生命
  rationale: 用“生命”表达 ζωή，并与随后 βίος 所指的人生、生活层面保持区别。
- source_word: τὸν βίον
  choice: 人生
  rationale: 与前面的“生命”形成自然的中文变化，也可涵盖生活方式或生计；具体歧义在脚注中说明。
- source_word: πανηγυρισμὸν ἐπικερδῆ
  choice: 有利可图的庆典
  rationale: πανηγυρισμός 的基本意象是节庆或盛会，ἐπικερδής 则加上逐利色彩；译文保留二者之间刻意形成的张力。
- source_word: δεῖν
  choice: 必须
  rationale: 准确传达非人称结构所表达的必要性，并在引语中保持自然。
- source_word: ὅθεν δὴ κἂν
  choice: 无论从哪里，哪怕
  rationale: 体现来源不限且带强调的语气，并顺畅引出 ἐκ κακοῦ。
- source_word: ἐκ κακοῦ
  choice: 从恶事中
  rationale: 保留 κακόν 的道德含义，又不把原文进一步限定为某一种具体罪行；较弱的处境性理解列入脚注。
- source_word: πορίζειν
  choice: 设法取得所需
  rationale: 体现该动词筹措、取得资源的含义，比单纯“获利”更宽，同时适合逐利语境。
theological_decisions:
- issue: ἐκ κακοῦ 的道德力度
  choice: 理解为即使借助恶事也要取得所需
  alternative: 也可较弱地理解为即使从坏处境或祸患中也要取得利益
  rationale: 上下文谴责逐利和偶像崇拜所体现的道德败坏，因此道德性理解更符合论证；但脚注保留词语可能具有的处境性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有利可图的庆典”有意保留原文将人生视为欢宴兼牟利机会的尖锐比喻；直接引语使 φησιν 的转述关系清楚。
