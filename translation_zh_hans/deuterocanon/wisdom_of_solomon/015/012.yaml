    issue: βίος译作“人生”
    rationale: “人生”与ζωή所译的“生命”语义高度重叠，较难保留原文在生命与生活／生计之间的措辞变化；“生活”更自然且保留范围。
  - severity: medium
    issue: ἐκ κακοῦ主文译作“从恶事中”
    rationale: “恶事”是合理的解释，但比原文中性名词κακόν更具体。主文用“从恶中”可保留其可能指恶事、恶的手段，或较弱地指不幸／坏处境的开放性，并由脚注交代。
  - severity: low
    issue: 引语内状语语序略显生硬
    rationale: 将“从任何地方”置于“设法取得所需”之前，并以“哪怕是从恶中取得”补足强调，读起来更自然，意义不变。
