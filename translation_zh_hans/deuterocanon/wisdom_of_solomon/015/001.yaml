  text: But you, our God, are kind and true, patient, and governing all things with mercy.
translation:
  language: zh_hans
  text: 但你，我们的上帝，是仁慈、真实、长久忍耐的，并以怜悯治理万有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: 但你
  rationale: 保留δέ所表达的上下文对比，也保留第二人称直接呼告。
- source_word: χρηστός
  choice: 仁慈
  rationale: 该词可表示良善、仁厚或恩慈；“仁慈”在此自然地描述上帝善待人的品格，并与后文“怜悯”相呼应而不完全重合。
- source_word: ἀληθής
  choice: 真实
  rationale: 保留该词“真实、确实”的宽广含义，避免用较窄的“诚实”或直接限定为盟约语境中的“信实”。
- source_word: μακρόθυμος
  choice: 恒久忍耐
  rationale: 既传达持久忍耐，也含蓄保留不轻易发怒、长久宽容的意味；比单用“耐心”更庄重且更贴近原词。
- source_word: ἐλέει
  choice: 以怜悯
  rationale: 将与格理解为方式或手段，保留名词“怜悯”，自然表达上帝治理万有的方式。
- source_word: διοικῶν
  choice: 治理
  rationale: 该词有管理、安排、治理之意；用于上帝与万有时，“治理”简洁地表达持续的统管，不额外引入特定神学体系。
- source_word: τὰ πάντα
  choice: 万有
  rationale: “万有”在现代中文圣经语体中自然、凝练，并保留原文所指的一切事物之全面范围。
theological_decisions:
- issue: 现在分词διοικῶν与前列神圣属性的关系
  choice: 译作“并以怜悯治理万有”，表达上帝持续施行的治理
  alternative: 译作“以怜悯治理万有的”，把整个分词短语更紧密地并入属性列举
  rationale: 原文现在分词与一连串描述上帝的词并列，既可视为持续行动，也带有品格描述作用。中文用“并……治理”保持句子自然，同时不削弱其持续性，也不把“治理”化约为静态属性。
- issue: ἀληθής所表达的神圣品格
  choice: 真实
  alternative: 信实
  rationale: “真实”保留原词可能涵盖的真实、真确与不虚假；“信实”虽在神学语境中常见，却会较明确地导向守约可靠这一较窄解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“但你——我们的上帝”以破折号清楚标示同位呼告；属性列举用“仁慈、真实、恒久忍耐”，随后以“并”衔接持续的治理行动。全节不使用生僻古语，也不添加原文没有的教派性术语。
