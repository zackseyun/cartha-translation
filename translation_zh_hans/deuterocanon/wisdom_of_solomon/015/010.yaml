  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/010.yaml
  text: His heart is ashes[a], and his hope is more worthless than earth, and his life more dishonored than clay[b],
translation:
  language: zh_hans
  text: 他的心是灰烬；他的盼望比土更低贱；他的生命比泥土更可鄙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更可鄙”也可译作“更不受尊重”；希腊词着重表示缺乏尊荣或遭人轻视。
    reason: lexical_alternative
lexical_decisions:
- source_word: σποδός
  choice: 灰烬
  rationale: 保留直接的名词性隐喻，表达其内在已归于死寂、毫无价值。
- source_word: καρδία
  choice: 心
  rationale: 沿用圣经中常见的人论用语，指人的内在核心，不窄化为理智或情绪。
- source_word: γῆς
  choice: 尘土
  rationale: 在此贬抑性的比较中，译作“尘土”自然地呈现卑微、低贱的物质意象，并与后面的陶泥相呼应。
- source_word: εὐτελεστέρα
  choice: 更卑微
  rationale: 表达价值低下、微不足道，而不局限于价格便宜。
- source_word: ἐλπίς
  choice: 希望
  rationale: 保留该词通常的意义，也呈现其所倚赖之物落空的神学张力。
- source_word: πηλός
  choice: 陶泥
  rationale: 上下文涉及制作偶像，故“陶泥”比泛指的“泥”更贴合可塑造器物的材料。
- source_word: ἀτιμότερος
  choice: 更不受尊重
  rationale: 突出缺乏尊荣、遭轻视的含义，避免将它简单等同于“毫无价值”。
- source_word: βίος
  choice: 生命
  rationale: 与“心、希望、生命”的三重结构相称，概括此人的整个存在。
theological_decisions:
- issue: 三个谓语对拜偶像者的贬抑性描述
  choice: 保留“心是灰烬”这一直接隐喻，并以比较句直陈其希望和生命的卑微。
  alternative: 译为“他的心像灰烬”或将“心”解释为“思想”。
  rationale: 希腊文使用直接的名词性谓语和比较级；不改成明喻，也不作心理化解释，可保留原文尖锐的反偶像崇拜修辞。
- issue: ἀτιμότερος 的荣辱含义
  choice: 译为“更不受尊重”，保留缺乏尊荣与被轻视的语义。
  alternative: 译为“更可鄙”或“更没有价值”。
  rationale: 该词的核心涉及尊荣和评价；正文采用较直接、自然的现代汉语，脚注保留更强烈的贬义译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留原文“心—希望—生命”的三联排比和逐层贬抑的诗性力度；“尘土—陶泥”维持物质意象的连贯。
