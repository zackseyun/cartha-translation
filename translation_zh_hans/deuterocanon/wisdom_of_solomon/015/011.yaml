base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/011.yaml
  text: because he did not know the one who formed him[b][a], and the one who breathed into him an active soul and breathed into him a life-giving spirit.
translation:
  language: zh_hans
  text: 因为他不认识那位塑造他、向他吹入活跃的魂[b]，又向他吹入赐生命的灵的那一位[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不认识”或译“没有认出”。
    reason: lexical_alternative
  - marker: b
    text: “活跃的魂”也可译作“有作用的魂”或较意译地译作“有生命的魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγνόησεν
  choice: 不认识
  rationale: ἀγνοέω可指不知道、不认识或未能认出。“不认识”自然简明，同时保留认知与关系层面的含义，不预先断定这种无知是否出于故意。
- source_word: πλάσαντα
  choice: 塑造
  rationale: πλάσσω含塑形、造作之意；“塑造”保留创造者亲手成形的意象，又不增添原文未明说的材料。
- source_word: ἐμπνεύσαντα
  choice: 吹入……里面
  rationale: 该动词描写将气息吹入某人，呼应创造的图景；“吹入”保留具体意象，避免抽象化。
- source_word: ψυχὴν ἐνεργοῦσαν
  choice: 能活动的魂
  rationale: ψυχή译作“魂”，ἐνεργοῦσαν译作“能活动的”，尽量保留“起作用、活动”的实际含义，而不直接解释为“活的”或“使人有生命的”。
- source_word: ἐμφυσήσαντα
  choice: 又把……吹入……里面
  rationale: 与ἐμπνεύσαντα构成平行的赋气意象；重复“吹入……里面”清楚呈现原文的并列，也符合现代汉语表达。
- source_word: πνεῦμα ζωτικόν
  choice: 赋予生命的灵
  rationale: πνεῦμα可指灵或气息，ζωτικόν有使之存活、赋予生命之意；此译保留“灵”与“魂”的区别，同时呈现其生命作用。
theological_decisions:
- issue: ψυχή与πνεῦμα在人论上的关系
  choice: 分别译为“魂”和“灵”
  alternative: 将二者都泛译为“生命”或“气息”
  rationale: 希腊文刻意使用两个不同名词并列。分别翻译可保留原文的修辞及可能的人论区分，却不把后来的系统神学定义强加于本节。
- issue: 两个带冠词的分词结构是否指两位不同对象
  choice: 两次使用“那一位”，依照原文句法，同时由上下文自然理解为同一位创造者
  alternative: 合并为“那位塑造他、又把……吹入他的”
  rationale: 原文在πλάσαντα和ἐμπνεύσαντα前各有冠词，中文保留其重复与强调；但不据此主张有两位不同施事者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“魂／灵”的词汇对举和两次“吹入”的创造意象；“能活动的魂”略带源语质感，因此用脚注补充较自然的可能译法。
