base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/016.yaml
  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: zh_hans
  text: 因为它们是人造的；人借得灵，便塑造了它们。因为没有人有能力塑造一位与自己相似的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 人
  rationale: 两处均为单数泛指，突出制造者不过是人；现代汉语用“人”自然且不额外限定性别。
- source_word: ἐποίησεν
  choice: 造了
  rationale: 概括制造偶像的动作，简洁自然，并与后面的“塑造”形成适当变化。
- source_word: τὸ πνεῦμα
  choice: 灵
  rationale: 紧贴希腊语 πνεῦμα，并保留“灵”与“气息、生命之气”之间的语义张力。
- source_word: δεδανεισμένος
  choice: 借来的
  rationale: 表达人的生命并非自有，而是领受且有限的；“也是借来的”能自然修饰“他自己的灵”。
- source_word: ἔπλασεν
  choice: 塑造了
  rationale: 保留 πλάσσω 所含手工塑形的意象，适合偶像制作的语境。
- source_word: ὅμοιον
  choice: 与自己相似的
  rationale: 清楚表达偶像照着制造者自身形象而成的讽刺意味。
- source_word: ἰσχύει
  choice: 有能力
  rationale: 传达能力或力量之意；现代汉语中比“有力量去”更自然。
- source_word: πλάσαι
  choice: 塑造
  rationale: 保持工匠塑形的意象，也与前面的 ἔπλασεν 形成词汇呼应。
- source_word: θεόν
  choice: 一个……神
  rationale: 语境所指是人所制作的所谓神明，而非独一真神；量词“一个”体现不定的单数用法。
theological_decisions:
- issue: “借来的灵”与人的生命之间的关系
  choice: 将偶像制造者的灵或生命表述为借来之物，强调他自身也是依赖者、受造者。
  alternative: 译作“借来的气息”或“生命之气”，更直接强调肉身生命及其短暂性。
  rationale: πνεῦμα 可指灵，也可指气息或生命之气。正文采用“灵”以贴近原词并保留较宽语义，不把经文的含义只限定为生理呼吸。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留两项行动的紧密反差；“却”凸显制造者自己尚依赖借来的生命，竟塑造神像的讽刺。“毕竟”承接第二个 γάρ，在汉语中自然表达论证性的强调。
