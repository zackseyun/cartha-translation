  naturalness: “他自己的灵也是借来的，却塑造了它们”存在主谓指向不清的问题。“人借得灵，便塑造了它们”以现代庄重汉语明确参与者与动作关系，也保留原文的讽刺性。
  terminology: “人”“灵”“塑造”“神”均适当。“灵”可保留 πνεῦμα 所具有的灵、气息或生命之气的开放含义；不宜在正文将其限定为某一教义性的“灵魂”。
