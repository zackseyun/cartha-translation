  rationale: 修订仅消除第二分句中“灵”似为“塑造”主语的歧义，并以“因为”明确两个 γάρ 的论证联系。“借得灵”保留 δεδανεισμένος 的受领、非自有之意，且不预断 πνεῦμα 在此究竟偏向“灵”还是“生命之气”。
