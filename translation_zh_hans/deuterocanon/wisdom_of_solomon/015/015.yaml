base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: zh_hans
  text: 因为他们甚至把列国所有的偶像都当作神；这些偶像的眼睛不能看，鼻子不能吸入空气[a]，耳朵不能听，手指不能触摸，脚也不能迈步。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼吸”；希腊文直译为“吸入空气”。
    reason: 说明原文具体措辞及自然汉语的可选表达。
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: 当作
  rationale: 表示把某物视为或算作某种身份；“当作神”符合现代汉语习惯，也保留认知判断的含义。
- source_word: εἴδωλα
  choice: 偶像
  rationale: 本节所指是被奉为神明的祭祀形象；“偶像”既指实体，也保留原文鲜明的批判语气。
- source_word: ἐθνῶν
  choice: 列国
  rationale: 在犹太智慧文学语境中，“列国”自然、庄重，且不必引入后期“外邦人”的固定用语。
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: 眼睛不能看
  rationale: 把希腊文“眼睛用于观看的功用”转化为自然汉语，同时保留偶像缺乏视觉能力的功能性对照。
- source_word: συνολκὴν ἀέρος
  choice: 吸入空气
  rationale: 贴近原文“把空气吸入”的具体表达，并由脚注说明其实际所指是呼吸。
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: 手指不能触摸
  rationale: ψηλάφησις指以触觉摸索或触摸；此译简洁地保留手指与触觉功能的对应。
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: 脚也不能迈步
  rationale: ἀργοί表示不起作用，ἐπίβασις在此指迈步或行走；“不能迈步”贴合逐项列举身体功能的句式。
theological_decisions:
- issue: 如何呈现本节对偶像的讽刺与谴责
  choice: 直陈偶像被误当作神，却没有感官和行动能力
  alternative: 用更抽象的措辞称偶像为“没有生命的物体”
  rationale: 原文通过眼、鼻、耳、手指和脚的功能逐项揭露偶像的无能；译文保留这种具体而有力的论证，不另加超出原文的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以连续的身体部位和功能对应句式再现原文的排比，并用分号区分“把偶像当作神”与随后对其无能的说明。
