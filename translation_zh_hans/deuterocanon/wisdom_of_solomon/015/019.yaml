  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
translation:
  language: zh_hans
  text: 它甚至没有活物外表所具有、足以令人向往的美；它既未蒙上帝的称许，也未蒙他的赐福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未蒙”原文直译为“已经逃脱（或错过）”；这里指未获得上帝的称许和赐福。前半句也可译作：“它也不够美丽，不能像活物在外观上所显出的那样令人向往。”
    reason: 说明ἐκπέφευγεν的字面表达及其在语境中的否定性含义，并保留ὡς ἐν ζῴων ὄψει的句法歧义。
lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: 甚至连……足以令人向往的……也没有
  rationale: οὐδʼ ὅσον表示连某种程度也达不到；ἐπιποθῆσαι在此表达对象足以引发向往，而非该对象主动向往。这样译成现代汉语自然，也保留程度比较。
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: 活物外表所有……的美
  rationale: ὄψις可指外表或所见形貌；ζῷα在上下文中指活物。此处按“活物在外表上显出的美”理解，但希腊语句法另有可能，故在脚注说明。
- source_word: ἐκπέφευγεν
  choice: 得不到
  rationale: 该完成时动词字面为“已经逃脱/避开”，此处语境却表示未能获得、与之无分。直译“逃过”在汉语中容易产生正面或主动避开的误解，因此正文按否定性的缺失来译，并以脚注保留字面形象。
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: 上帝的称许
  rationale: ἔπαινος可指赞扬或认可；属格既可理解为来自上帝，也可形式上译为“上帝的”。“上帝的称许”符合此处受造物蒙上帝认可的语境。
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: 他的赐福
  rationale: εὐλογία在这里指上帝所赐的福；“赐福”比单说“祝福”更清楚地体现来源于上帝。
theological_decisions:
- issue: 本节单数主语的所指
  choice: 承接上下文，指人所制作的动物形象或偶像这一类对象
  alternative: 泛指被描摹的动物本身
  rationale: 上下文集中批判工匠所制的偶像，单数形式可把这类制品视作一个代表性对象；正文用“它”而不直接补出“偶像”，避免超出原文明确程度。
- issue: ἐκπέφευγεν与上帝称许、赐福的关系
  choice: 表达偶像未能获得上帝的称许和赐福
  alternative: 按字面译为“逃过了上帝的称赞和赐福”
  rationale: 上下文显然不是说它成功躲避某种好处，而是说它与这些恩认可无分；采用“得不到”可避免错误神学联想，同时以脚注保存原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“活物”保持智慧文学语境中的概括性；“称许”和“赐福”清楚表达上帝的认可与福分。脚注标记[a]已在正文出现。
