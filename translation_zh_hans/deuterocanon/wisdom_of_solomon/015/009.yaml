base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: zh_hans
  text: 然而，他并不挂虑自己将要疲惫，也不挂虑自己寿命短促；反倒与金匠和银匠争高下[a]，仿效青铜工匠，并以塑造伪造之物[b]为荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争高下”也可译作“与……竞争”或“同……抗衡”。
    reason: lexical_alternative
  - marker: b
    text: “伪造之物”也可译作“虚假之物”或“假冒之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: 挂虑
  rationale: 表达占据心思的关切，同时不过度强化为焦虑；与后文工匠真正看重的事形成对照。
- source_word: μέλλει κάμνειν
  choice: 将要劳累
  rationale: μέλλει 表示将要发生，κάμνειν 在此指劳累、疲惫；“将要劳累”既贴近希腊文，也符合工匠劳作的语境。
- source_word: βραχυτελῆ βίον
  choice: 寿命短促
  rationale: 该短语指生命很快终结；“寿命短促”以自然庄重的现代汉语保留其死亡意识。
- source_word: ἀντερείδεται
  choice: 争高下
  rationale: 此动词带有与人抗衡、竞逐之意；“争高下”清楚表现他与贵金属工匠竞争的姿态。
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: 金匠和银匠
  rationale: 采用现代汉语中标准且简洁的职业名称，并保留原文并列结构。
- source_word: χαλκοπλάστας
  choice: 铜匠
  rationale: 指塑造铜或青铜器物的工匠；“铜匠”自然易懂，又保留材料类别。
- source_word: μιμεῖται
  choice: 仿效
  rationale: 保留模仿他人技艺的含义，且比“模仿”略显庄重，适合经文语体。
- source_word: δόξαν ἡγεῖται
  choice: 以……为荣耀
  rationale: 保留 δόξα 的荣耀、夸耀意味，并传达作者对其自负态度的反讽。
- source_word: κίβδηλα
  choice: 假冒之物
  rationale: κίβδηλα 可指掺假、伪造或虚假的东西；“假冒之物”同时保留制品不真实与仿造的意味。
- source_word: πλάσσει
  choice: 塑造
  rationale: 适合工匠把材料塑成物件的语境，同时不把制作方法限定为某一种具体工艺。
theological_decisions:
- issue: 工匠以制造偶像为荣的评价力度
  choice: 采用“以塑造假冒之物为荣耀”，保留原文对工匠自负及其制品虚假的反讽批判。
  alternative: 可较中性地译作“以塑造仿制品为荣”，侧重技艺模仿而弱化道德评价。
  rationale: 上下文批判偶像制造，而 κίβδηλα 本身具有假冒、伪劣的贬义；此译法不额外引入教派性解释，也不消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挂虑”“寿命短促”“以……为荣耀”保持智慧文学的凝练语气；分号凸显他不顾自身劳苦与生命短促，反而追逐工艺声名的强烈对比。脚注标记均置于其实际所解释的词语之后。
