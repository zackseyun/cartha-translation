base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/004.yaml
  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
translation:
  language: zh_hans
  text: 因为人的邪恶巧思没有使我们误入歧途，画师徒然的辛劳也没有使我们误入歧途——那是一个涂有各样不同颜色的形象；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάνησεν
  choice: 使我们误入歧途／迷惑我们
  rationale: 该动词既可指使人偏离正路，也可指欺骗、迷惑。前一分句用“误入歧途”保留行路隐喻；后一分句补出同一动词时用“迷惑”，使现代汉语句式自然，同时不改变两项并列主语共用同一谓语的结构。
- source_word: κακότεχνος ἐπίνοια
  choice: 邪巧构想
  rationale: “邪巧”同时表达工巧、诡巧与负面的道德评价；“构想”对应经过设计、构思而成的意念，保留偶像制作语境中的技艺意味。
- source_word: σκιαγράφων
  choice: 描影画匠们
  rationale: 该词在此为复数属格，指从事勾勒轮廓或明暗描绘的人。“描影画匠们”保留复数和具体的绘画技艺，避免泛化为普通艺术家。
- source_word: πόνος ἄκαρπος
  choice: 徒劳的辛苦
  rationale: “徒劳”表达其没有成果或真实益处，“辛苦”保留 πόνος 所含的劳作与劳苦意味。
- source_word: εἶδος
  choice: 形像
  rationale: 上下文谈论人工制作的偶像，此处指可见的造型或图像；“形像”既可指形体，也可指所造之像。
- source_word: σπιλωθὲν χρώμασιν διηλλαγμένοις
  choice: 用各样颜色涂抹的
  rationale: “各样颜色”表达颜色彼此不同；“涂抹”保留颜料覆于形像之上的具体视觉动作，也带有原文“染污、弄脏”的贬义色彩。
theological_decisions:
- issue: 如何保留本节对偶像艺术的道德批判，而不把一切绘画本身都定为邪恶
  choice: 把“邪巧”用于人的构想，并以“那不过是”连接被涂抹的形像，明确批判对象是使人迷失的偶像制作。
  alternative: 可较中性地译作“人的艺术构思”和“画家的工作”，但会削弱 κακότεχνος 与 ἄκαρπος 明确的负面评价。
  rationale: 希腊文将道德贬斥、徒劳的劳作和绘制形像紧密相连；译文保留这种张力，却不扩大为对所有视觉艺术的普遍判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“邪巧”略具书面色彩，用来浓缩原文兼具工巧和邪恶的复合含义；“描影画匠”保留不常见但具体的艺术术语，并由脚注说明。主句依照汉语习惯分配共用谓语，以避免冗长拗口。
