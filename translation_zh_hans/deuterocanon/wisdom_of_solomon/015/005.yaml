base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: zh_hans
  text: 它们的外观使愚昧人蒙羞；愚昧人渴慕那死而无气息之像的外形。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文第二句结构紧缩，动词“渴慕”是单数，主语没有明说；也可较直译为：“它们的外观使愚昧人受辱，并渴慕死而无气息之像的外形。”
    reason: 保留原文关于第二分句主语的语法歧义，并说明较字面的另一种译法。
lexical_decisions:
- source_word: ὄψις
  choice: 外观
  rationale: 此词可指观看、容貌或外在形貌；本句以“它们的外观”承接关系代词ὧν，既自然，也保留对偶像可见形态的强调。
- source_word: ἄφροσιν
  choice: 愚昧人
  rationale: ἄφρων指缺乏理性与智慧的人；“愚昧人”符合《智慧篇》中智慧与愚昧的道德对比，也适合庄重的现代汉语。
- source_word: εἰς ὄνειδος ἔρχεται
  choice: 使……蒙羞
  rationale: 该结构表达导致羞辱或成为耻辱的结果；汉语用“使……蒙羞”清楚传达其结果义，而不拘泥于“来到”的希腊语字面表达。
- source_word: ποθεῖ
  choice: 渴慕
  rationale: 此动词表示强烈想望；“渴慕”保留其强度。希腊文为单数，主语表达紧缩，正文依语境补出“愚昧人”，并以脚注说明歧义。
- source_word: νεκρᾶς εἰκόνος
  choice: 死……之像
  rationale: νεκρά修饰εἰκών，直指没有生命的像，而非死者的画像；译为“死……之像”保留原文尖锐的偶像讽刺。
- source_word: εἶδος
  choice: 外形
  rationale: εἶδος指可见的形状或样貌；“外形”与前面的“外观”有所区分，并准确表达所渴慕的是像的可见形态。
- source_word: ἄπνουν
  choice: 无气息
  rationale: 此词字面意为“没有气息”；译作“无气息”保留原文以生命气息反衬偶像死寂的措辞。
theological_decisions:
- issue: 渴慕行为的主语
  choice: 将“愚昧人”理解为第二分句省略的主语
  alternative: 把单数动词ποθεῖ与前面的“外观”相连，译成“它的外观渴慕……”
  rationale: 希腊文第二分句语法紧缩，若以“外观”为主语，汉语既晦涩，意义也难以成立。上下文抨击人对无生命之像的迷恋，因此正文补出“愚昧人”最能传达语境意义；脚注保留原文单数动词及句法张力。
- issue: νεκρᾶς εἰκόνος的所指
  choice: 理解为本身死而无生命的像
  alternative: 理解为死者的画像
  rationale: 形容词与“无气息”并列描述像本身的无生命状态，符合本段对偶像的批判；正文不引入“死者画像”这一较窄解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“死而无气息之像”刻意保留νεκρά与ἄπνουν的双重描写，呈现原文以死亡和无气息讽刺偶像的力度；分号及“却”凸显愚昧人因这些像蒙羞、仍然渴慕它们的张力。
