base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/014.yaml
  text: But all of them are most foolish and more miserable than an infant's soul—these enemies of your people who oppressed it.
translation:
  language: zh_hans
  text: 但他们全都愚蠢至极，比婴孩的生命更可怜[a]——他们就是你子民的仇敌，曾欺压你的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“比婴孩的灵魂更可怜”，也可理解为“比婴孩更可怜”。希腊文直译是将他们与“婴孩的生命／灵魂”相比，这是一种简缩的说法，可能强调极度软弱或可怜的处境。
    reason: 词义与原文修辞均有歧义，需保留ψυχή可指“生命”或“灵魂”的可能。
lexical_decisions:
- source_word: πάντες
  choice: 全都
  rationale: 保留概括全体的范围，并自然承接后面对这些人的说明。
- source_word: ἀφρονέστατοι
  choice: 愚蠢至极
  rationale: 体现ἄφρων最高级的强烈语气，比单说“愚蠢”更准确。
- source_word: τάλανες ὑπὲρ ψυχὴν νηπίου
  choice: 比婴孩的生命更可怜
  rationale: 将ὑπέρ按比较义处理；ψυχή在此可指“生命”或“灵魂”，译作“生命”较符合现代汉语，同时保留原文压缩而不寻常的比较。
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: 他们就是你子民的仇敌
  rationale: 明示同位关系，使汉语读者清楚后半句是在说明前面的“他们”。
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: 曾欺压你的子民
  rationale: καταδυναστεύω表示以强权压迫；重复“你的子民”可避免汉语代词在单复数和指代上的含混，且忠实反映αὐτόν所回指的集合名词λαός。
theological_decisions:
- issue: ὑπὲρ ψυχὴν νηπίου这一比较语的含义
  choice: 比婴孩的生命更可怜
  alternative: 比婴孩的灵魂更可怜；比婴孩更可怜
  rationale: 原文确实以“婴孩的ψυχή”为比较对象，表达高度可怜或悲惨的处境。正文保留这一不寻常的意象，不把它解释成特定的人性论或灵魂论命题；脚注列出“灵魂”的形式对应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愚蠢至极”保留最高级力度；破折号呈现原文同位说明。“你子民”沿用祷告式直接称呼，末尾重复名词以避免代词歧义。
