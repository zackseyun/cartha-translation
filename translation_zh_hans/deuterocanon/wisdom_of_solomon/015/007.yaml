base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are servants to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: zh_hans
  text: 陶匠辛苦地揉压柔软的泥土，塑造每一件器皿，供我们使用；但他又用同一团陶泥，既做成供洁净用途的器皿[a]，也做成用途相反的器皿，全都一样。至于每一件器皿的用途是什么，则由陶匠裁定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供洁净用途”直译为“作洁净之工的奴仆”；“奴仆”在这里是比喻，表示器皿被派定去执行某种功用。
    reason: 保留δοῦλα的字面意象及其功能性含义，同时使正文符合自然现代汉语。
lexical_decisions:
- source_word: κεραμεύς
  choice: 陶匠
  rationale: 现代汉语中对制作陶器者自然、准确且庄重的称呼。
- source_word: ἁπαλὴν γῆν
  choice: 柔软的泥土
  rationale: 保留 γῆν 的“土”义，并与后文明确的 πηλός“陶泥”有所区分。
- source_word: θλίβων ἐπίμοχθον
  choice: 辛苦地揉压
  rationale: θλίβων含挤压、揉压之意，ἐπίμοχθον强调劳苦；合译既呈现动作，也保留费力的意味。
- source_word: πλάσσει πρὸς ὑπηρεσίαν ἡμῶν ἕκαστον
  choice: 塑造出各种器皿，供我们使用
  rationale: ἕκαστον所指的器物由语境补明；ὑπηρεσία在此指实际服用或用途，译为“供我们使用”较自然。
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: 用同一团陶泥
  rationale: πηλός在制陶语境中即陶泥；“一团”是符合汉语表达的量词补充。
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: 供洁净用途的器皿
  rationale: δοῦλα在此以奴仆身份比喻器皿被派定的功用；正文采用自然汉语表达，并以脚注保留该隐喻。
- source_word: τὰ ἐναντία
  choice: 用途相反的器皿
  rationale: 原文只说“相反的”，没有明说“不洁净”，故不把含义过度具体化。
- source_word: πάνθʼ ὁμοίως
  choice: 全都用同样的方式
  rationale: 明确表达这些器皿在制作方式上相同。
- source_word: κριτὴς ὁ πηλουργός
  choice: 由制陶的人决定
  rationale: κριτής字面为“判断者”；这里指制陶者判定每件器皿的用途，译为“决定”符合现代汉语，同时保留其裁定权。
theological_decisions:
- issue: δοῦλα用于器皿的奴仆隐喻
  choice: 正文译作“供洁净用途的器皿”，脚注说明字面隐喻
  alternative: “作洁净之工的奴仆器皿”或“服役于洁净用途的器皿”
  rationale: 直译“奴仆器皿”在现代汉语中生硬且可能被误解为器皿本身具有人的身份；以功能性正文配合脚注，既不抹去原文隐喻，也保证经文自然可懂。
- issue: τὰ ἐναντία所指的用途
  choice: “用途相反的”
  alternative: “供不洁净用途的”
  rationale: 上下文可暗示洁净与不洁净的对照，但希腊文此处只明确说“相反的”；保留其概括性，避免补入原文没有明说的限定。
- issue: 陶匠对器皿用途的权柄
  choice: “由制陶的人决定”
  alternative: “制陶的人是判断者”
  rationale: 该句陈述制陶者判断各器皿用途的事实；不将它扩展为本节未明说的教义类比。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“陶匠—泥土—陶泥—器皿”维持制陶意象；前半句用“泥土”保留 γῆ，后半句用“陶泥”对应 πηλός。正文脚注标记[a]已与脚注对应。
