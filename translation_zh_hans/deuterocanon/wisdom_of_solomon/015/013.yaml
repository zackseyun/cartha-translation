  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/013.yaml
  text: For this man knows better than all others that he is sinning[a], making fragile vessels and carved images out of earthy material.
translation:
  language: zh_hans
  text: 因为这人比所有人都更清楚自己是在犯罪[a]：他用土质材料制作易碎的器皿和雕刻的像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这人比所有人都更知道自己犯罪。”希腊文的比较短语可按中文语序作不同安排。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指向上下文中的偶像制造者；“这人”自然保留了指示语和单数人物焦点。
- source_word: παρὰ πάντας
  choice: 比所有人都更清楚
  rationale: 与 οἶδεν 连用表达比较程度，说明他比别人更明白自己的行为；中文以“比所有人都更清楚”自然呈现。
- source_word: οἶδεν ὅτι ἁμαρτάνει
  choice: 清楚自己是在犯罪
  rationale: 保留认知动词所强调的自觉，也用“正在/是在”的持续意味反映现在时 ἁμαρτάνει 的进行性道德行为。
- source_word: ὕλης γεώδους
  choice: 用土质材料
  rationale: ὕλη 指材料或质料，γεώδης 指土质、似土的；不把范围过度限定为陶土。
- source_word: εὔθραυστα σκεύη
  choice: 易碎的器皿
  rationale: 准确表达 εὔθραυστα 的易破碎性质，并以“器皿”保留 σκεύη 的宽泛器物含义。
- source_word: γλυπτὰ
  choice: 雕像
  rationale: 该词指雕刻制品；在偶像制造的语境中，“雕像”自然明确，又不直接以“偶像”替代原词而增加解释。
- source_word: δημιουργῶν
  choice: 制作
  rationale: 分词说明他犯罪时所从事的制造行为；“制作”符合手工造物语境，简洁而庄重。
theological_decisions:
- issue: 偶像制造者的道德认知与罪责
  choice: 译为他比所有人更清楚自己正在犯罪，突出其明知而为。
  alternative: 也可理解为“他比所有人都更知道自己犯罪”，比较语的具体着落及中文语序略有不同。
  rationale: 希腊文最自然地把比较短语与“知道”相连，并陈述制造者对自身犯罪的明确认知；译文保留这一道德张力，不添加文本之外的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“土质材料”避免把 γεώδους 过度具体化为“陶土”；冒号使后面的分词结构自然说明其犯罪行为。
