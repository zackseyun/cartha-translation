revisions:
- from: 他又邪恶地劳作，用同样的泥土塑造一个虚妄的神；而他自己不久前才从尘土而生，过不多时就要回到那取他而出的尘土中，那时，他灵魂的债将被追讨[a]。
  to: 一个劳苦不堪的人，用同样的泥土塑造一个虚妄的神；他自己不久前才从地而生，过不多时就要回到那他从其中被取出的地，那时，他灵魂的债将被追讨[a]。
  rationale: 修订以“劳苦不堪的人”表达κακόμοχθος的困苦劳作之意，避免把其解释为明确的道德邪恶；以“地”对应γῆ，保留原文范围。其余措辞维持原稿对偶像虚妄、泥土塑造、人的短暂和“债被追讨”这一死亡隐喻的表达。
