base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/008.yaml
  text: And with wicked toil he molds a futile god from the same clay—he who a little before had come from the earth[a], and after a short time goes back to the earth from which he was taken, when the debt of his soul is demanded.
translation:
  language: zh_hans
  text: 一个劳苦不堪的人，用同样的泥土塑造一个虚妄的神；他自己不久前才从地而生，过不多时就要回到那他从其中被取出的地，那时，他灵魂的债将被追讨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时，他生命的债将被追讨。”希腊语“ψυχή”既可指“灵魂”，也可指“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόμοχθος
  choice: 邪恶地劳作
  rationale: 兼顾该词所含的劳苦与道德败坏之意；在汉语中用状语加动词表达较自然，也明确这项劳作本身是邪恶的。
- source_word: θεὸν μάταιον
  choice: 一个虚妄的神
  rationale: “虚妄”保留 μάταιος 所表达的空虚、无效与徒然，也传达工匠造神的反讽。
- source_word: πλάσσει
  choice: 塑造
  rationale: 贴合用泥土捏塑成形的语境，同时保持庄重、自然。
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: 用同样的泥土
  rationale: 明确指出偶像与其他陶器材料相同，保留原文的反讽重点。
- source_word: ὃς
  choice: 而他自己
  rationale: 关系代词所指是造偶像的工匠，不是所造之神；如此译法可消除汉语中的指代歧义。
- source_word: πρὸ μικροῦ ἐκ γῆς γενηθεὶς
  choice: 不久前才从尘土而生
  rationale: γενηθεὶς 可宽泛表示产生或成为；“而生”自然地表达人的受造来源，又不具体限定为生育过程。“尘土”也呼应受造与归土的意象。
- source_word: μετʼ ὀλίγον πορεύεται
  choice: 过不多时就要回到
  rationale: 结合随后“从其中被取出”的分句，πορεύεται 在此指向死亡归土；“回到”把上下文隐含的返回关系自然表达出来。
- source_word: ἐξ ἧς ἐλήμφθη
  choice: 那取他而出的尘土中
  rationale: 保留被动的“被取出”含义和创造叙事的回声，并重提“尘土”以避免关系代词指向不清。
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: 他灵魂的债将被追讨
  rationale: 保留 χρέος 的债务隐喻及 ἀπαιτέω 的索回、追讨语气；ψυχή 译作“灵魂”，同时以脚注保存“生命”的可行理解。
theological_decisions:
- issue: 死亡语境中的 ψυχή
  choice: 灵魂
  alternative: 生命
  rationale: ψυχή 可指“灵魂”或“生命”。正文采用“灵魂”，以保留原文的人论措辞和道德分量；但不排除“生命”之义，故在脚注中注明。
- issue: 人的来源与归宿所用的 γῆ
  choice: 尘土
  alternative: 土地／大地
  rationale: 此处既涉及人从 γῆ 而来，也涉及死后归回其中。“尘土”在现代汉语中更清楚地传达人受造、必死和归土的意象；不把这一措辞扩展成特定宗派的人论结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“邪恶地劳作”保留复合词的道德与劳苦双重含义；“虚妄的神”维持原文对偶像无效、空洞的讽刺。用分号区分造神之举与工匠自身必死的反讽对照。
