  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/003.yaml
  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: zh_hans
  text: 因为认识你，就是完全的义[a]；知道你的大能，就是不朽的根源。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完全的公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: 认识
  rationale: 此不定式指对上帝的认知与承认；“认识”在现代汉语中自然，也适合关系性的语境，并与后句“知道”形成轻微而不过度强调的变化。
- source_word: ὁλόκληρος
  choice: 完整的
  rationale: 该词作表语，表示完整、全备。“完整的”直接保留原文所强调的整体性，且不额外引入道德完美之意。
- source_word: δικαιοσύνη
  choice: 义
  rationale: 此处把认识上帝与人在他面前的正当状态相联系；“义”既保留智慧文学中的神学维度，也不排除“公义”的含义。
- source_word: εἰδέναι
  choice: 知道
  rationale: 基本义为知道、认识。译作“知道”与前句“认识”保持平行，同时自然反映两个希腊动词的细微措辞差别，而不主张二者必有严格语义区分。
- source_word: κράτος
  choice: 大能
  rationale: 该词表示强力、威能或彰显出来的力量。“大能”适合指上帝有效施行的能力，并保持庄重语体。
- source_word: ῥίζα
  choice: 根源
  rationale: “根源”保留了“根”的词源意象，同时在“……的根源”这一汉语搭配中比直译“根”更自然。
- source_word: ἀθανασίας
  choice: 不朽
  rationale: 该词意为不死、永不灭亡。“不朽”简洁庄重，符合《智慧篇》的神学与哲思语域。
theological_decisions:
- issue: δικαιοσύνη在智慧神学语境中的含义
  choice: 义
  alternative: 公义；正义
  rationale: 原词既可指义，也可指公正。上下文把认识上帝与不朽并列，重点不限于社会或司法层面的正义；“义”更能涵盖与上帝关系中的正当状态，同时以脚注保留“公义”这一可能译法。
- issue: ῥίζα ἀθανασίας的因果隐喻
  choice: 不朽的根源
  alternative: 不朽的根
  rationale: 保留认识上帝大能与不朽之间的根源性关联，但不进一步界定这种关联是功德、手段还是结果，以保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文两项平行结构；“认识你”与“知道你的大能”既相互呼应，又轻微体现ἐπίστασθαι和εἰδέναι的措辞差别。
