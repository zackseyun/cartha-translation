base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/006.yaml
  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
translation:
  language: zh_hans
  text: 爱好邪恶的人，就是那些制造偶像的[b]、渴求偶像的和敬拜偶像的人，都配得这样的盼望[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“配得这类盼望”。这里指上下文中与偶像相关的那一类期待。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“做／制造的〔人〕”；按上下文，是指制造或塑造偶像的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταὶ
  choice: 爱恶的人
  rationale: κακῶν是中性复数属格，与ἐρασταί搭配，指以恶为所爱的人。“爱恶的人”简洁自然，保留鲜明的道德谴责，也不把“恶”局限为某一种恶行。
- source_word: ἄξιοί
  choice: 配得
  rationale: 表达与某种结果相称、应得的意思；“配得”贴近原文，并保留这里带有反讽和审判意味的张力。
- source_word: τοιούτων ἐλπίδων
  choice: 这样的盼望
  rationale: τοιούτων回指上下文中寄托于偶像的那一类指望；“这样的”保留回指作用，“盼望”则保留ἐλπίδων既可指主观盼望、也可涉及所期待结果的语义空间。
- source_word: οἱ δρῶντες
  choice: 制造偶像的
  rationale: δρῶντες字面较宽，可指“做这些事的人”；但本段上下文谈论人手制造的偶像，因此译出隐含宾语，并按语境表达为制造偶像者。
- source_word: οἱ ποθοῦντες
  choice: 渴求偶像的
  rationale: ποθέω表示强烈思慕或欲求；“渴求”体现其力度，同时不预先限定这种欲求的具体形式。
- source_word: οἱ σεβόμενοι
  choice: 敬拜偶像的
  rationale: σέβομαι在宗教语境中表示尊崇、敬奉或敬拜；上下文对象是偶像，因此“敬拜”最清楚地传达其祭祀性含义。
theological_decisions:
- issue: 三个分词所省略的宾语
  choice: 在中文中补出“偶像”，指向上下文所论的人造偶像。
  alternative: 保留省略，译作“做的、渴求的和敬拜的”；或把δρῶντες泛译为“行这些事的”。
  rationale: 希腊文可因上下文清楚而省略宾语，现代中文若完全照搬会语意残缺。补出“偶像”使所指明确，并未加入新的神学判断；其中δρῶντες依本段语境理解为制造偶像。
- issue: “这样的盼望”的评价性质
  choice: 保留“配得这样的盼望”这一凝练而带张力的表达。
  alternative: 解释性地译成“只配得到他们从偶像所能期待的结局”。
  rationale: 原文没有明说这些盼望的具体内容，而由上下文赋予负面和反讽意味。直译其张力可避免把隐含的结局过度明文化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“爱恶的人”保持原文简洁有力的谴责；“无论……还是……都是如此”自然呈现三个并列群体。脚注标记均置于正文相应词语之后。
