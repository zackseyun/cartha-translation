base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/017.yaml
  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: zh_hans
  text: 然而，他自己是必死的人，却用不法的双手造出死物；因为他胜过自己所敬拜之物[a]：他自己曾经活过，那些却从未活过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所敬拜之物”也可译作“他的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητὸς
  choice: 必死的人
  rationale: 表达θνητός“终有一死、受死亡辖制”的含义，并与没有生命的偶像形成鲜明对照。
- source_word: νεκρὸν
  choice: 死物
  rationale: 此处形容词作名词用，指被造出的无生命之物；“死物”简洁保留原文反讽，也避免译成“尸体”所造成的误解。
- source_word: ἐργάζεται
  choice: 造出
  rationale: 语境是制造敬拜之物，“造出”自然地表达制作、产生之意。
- source_word: χερσὶν ἀνόμοις
  choice: 用不法的双手
  rationale: 保留工具性表达以及ἄνομος与违背法则、邪恶相关的语义，不把它泛化为单纯的“罪恶”。
- source_word: κρείττων
  choice: 胜过
  rationale: 表达制造者相较于所造敬拜物的优越性；“胜过”比“更好”在现代汉语中更适合此类比较。
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: 自己所敬拜之物
  rationale: σεβάσματα指受尊崇或敬拜的对象；此译保留词义范围，同时不直接把上下文所指的偶像写入正文。
- source_word: ἔζησεν
  choice: 曾经活过
  rationale: 用过去时态意义凸显制造者至少有过生命，与敬拜物从未有生命形成对照。
- source_word: οὐδέποτε
  choice: 从未活过
  rationale: 明说所省略的“活过”，使汉语对比完整清楚，并准确表达“任何时候都没有”的否定。
theological_decisions:
- issue: 反偶像语境中σεβάσματα的译法
  choice: 所敬拜之物
  alternative: 偶像
  rationale: 原词本身泛指受尊崇、敬拜之物，语境明确指偶像；正文采用较贴近词面的表达，脚注注明语境性译法，以免在正文中缩窄原词。
- issue: 制造者“胜过”敬拜物的比较依据
  choice: 保留原文直接比较，并由后句说明生命上的反差
  alternative: 解释为人在本质或道德上优于偶像
  rationale: 原文只指出制造者曾活过，而所造之物从未活过；不额外引入本体论或道德层面的教义解释。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“不法的双手”保留原文较强的道德与律法色彩；“死物—活过—从未活过”的重复刻意维持原文反偶像的讽刺对照。
