base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: zh_hans
  text: 因为即使我们犯罪，我们仍属于你，因我们知道你的权能；我们也不会犯罪，因我们知道自己已被算作属于你。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已被算作属于你”也可译作“已被认定为是你的”。希腊文用了带有计算、算账意味的词，表示被算作或认定为属于你。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 即使
  rationale: καὶ γὰρ在此引出带强调意味的解释，而让步色彩主要由随后ἐὰν条件句体现；汉语用“即使”自然承接上下文，并突出让步关系。
- source_word: ἐὰν ἁμάρτωμεν
  choice: 我们犯罪
  rationale: ἐάν加虚拟式构成未定条件；与“即使”合译为“即使我们犯罪”，简洁保留可能性，不改成既成事实。
- source_word: σοὶ ἐσμεν
  choice: 我们仍属于你
  rationale: 与格代词σοί配合系词表达归属。“属于你”在现代汉语中清楚自然；“仍”显明让步句中的持续归属，但不把它解释为纵容犯罪。
- source_word: εἰδότες
  choice: 因为我们知道
  rationale: 分词可作伴随或原因解。汉语直译“知道着”不自然，译为“因为我们知道”清楚呈现此处合理的因果功能。
- source_word: σου τὸ κράτος
  choice: 你的权能
  rationale: κράτος可指力量、威能或彰显出来的权力。“权能”兼顾能力与威势，又不把意义过度限定为统治权。
- source_word: οὐχ ἁμαρτησόμεθα
  choice: 我们不会犯罪
  rationale: 未来时直译为将来的陈述“不会犯罪”，不弱化为劝勉，也不改成一般现在时，从而保留与前半句之间的张力。
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: 因为我们知道自己已被算为属于你的人
  rationale: λογίζομαι完成时被动保留“计算、算作”的意象；σοί表达归属关系。“已被算为属于你的人”兼顾已然结果与归属含义。
theological_decisions:
- issue: “即使我们犯罪”与“我们不会犯罪”之间的表面张力
  choice: 照原文保留两个陈述，不作调和。
  alternative: 把后句译为“我们就不该犯罪”或“愿我们不犯罪”，使其成为劝勉。
  rationale: 希腊文前句使用条件式，后句却用未来陈述；这同时表达犯罪的可能性、对神的持续归属，以及基于这种归属而有的不犯罪之确信或决心。译文不替原文消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“权能”略带经文语体但仍易懂；句法避免文言化。用“属于你”明确表达σοί的归属关系，并用唯一脚注说明λογίζομαι的记账意象。
