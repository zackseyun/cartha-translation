  text: Even the most hateful animals they revere; for[a], compared in foolishness with the others, they are worse.
translation:
  language: zh_hans
  text: 他们甚至敬奉最可憎的动物[a]；因为在愚昧方面，这些动物比其他的更差。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬奉”也可译作“敬拜”或“尊崇”。希腊语动词可广义地表示宗教性的敬重。
    reason: 词义替代
lexical_decisions:
- source_word: τὰ ζῷα
  choice: 动物
  rationale: ζῷον泛指有生命之物或动物；本节谈人向动物形象表达宗教敬意，译作“动物”清楚自然。
- source_word: τὰ ἔχθιστα
  choice: 最可憎的
  rationale: 保留ἐχθρός最高级的强烈贬义和评价色彩；“最可憎的”比“最敌对的”更符合此处描述受敬奉对象的语境。
- source_word: σέβονται
  choice: 敬奉
  rationale: σέβομαι可指尊崇、敬奉或敬拜。“敬奉”既传达宗教性敬意，又不把动词限定为某种具体礼仪行为。
- source_word: ἀνοίᾳ
  choice: 论愚钝
  rationale: ἄνοια表示缺乏理性、愚昧或愚钝；这里的与格界定比较的方面，故译作“论愚钝”。
- source_word: συγκρινόμενα
  choice: 比
  rationale: 该被动分词表达比较关系；结合汉语句式译作“比”，简洁地保留“拿来比较”的逻辑。
- source_word: τῶν ἄλλων
  choice: 其他的
  rationale: 原文仅用实质化的“其他的”，没有明说所指为何；译文同样不补出“动物”或“偶像”，以保留其指代空间。
- source_word: χείρονα
  choice: 更差
  rationale: χείρων是比较级，基本义为“更差、较劣”；“更差”直接保留原文宽泛的负面比较。
theological_decisions:
- issue: σέβονται的宗教含义强度
  choice: 敬奉
  alternative: 敬拜；尊崇
  rationale: 本节显然批评人对动物所给予的宗教性尊敬，但σέβομαι本身可涵盖较宽的尊崇或敬拜含义。“敬奉”保留宗教语气，同时不擅自规定其礼仪强度。
- issue: τῶν ἄλλων的指代
  choice: 其他的
  alternative: 其他动物；别的受造物
  rationale: 希腊文没有明确补出比较对象的类别。译文不将其限定为“其他动物”或“别的受造物”，以保存原文的指代含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“甚至”体现καὶ…δὲ的递进语气；后半句以“论愚钝”简洁表达比较所涉及的方面，同时避免过度解释“其他的”究竟指什么。
