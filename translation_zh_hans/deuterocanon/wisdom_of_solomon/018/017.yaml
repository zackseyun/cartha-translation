lexical_decisions:
- source_word: τότε παραχρῆμα
  choice: 就在那时
  rationale: τότε标明叙事时序，παραχρῆμα强调事情立即发生；合译为“就在那时”，既自然，也保留突发感。
- source_word: φαντασίαι ὀνείρων
  choice: 梦中的可怕幻象
  rationale: φαντασίαι可指显现、幻象或幽灵般的形象，ὀνείρων限定其与梦有关；“梦中的……幻象”保留这种关系，不断言它们是实体鬼怪。
- source_word: δεινῶς ἐτάραξαν
  choice: 可怕……扰乱了
  rationale: δεινῶς加强ἐτάραξαν所表达的剧烈惊扰；汉语将其自然地落实为幻象的“可怕”及其造成的“扰乱”，避免把动词过度强化为“吓坏”。
- source_word: αὐτούς
  choice: 他们
  rationale: 按上下文指向受审判的埃及人；本节沿用代词，不添加原文未明说的身份。
- source_word: φόβοι
  choice: 恐惧
  rationale: 原文为复数，表示一阵阵或多种恐惧；现代汉语抽象名词通常不作复数，译作“恐惧”最自然。
- source_word: ἐπέστησαν ἀδόκητοι
  choice: 意想不到的恐惧突然临到
  rationale: ἐπέστησαν表示来到、临到或突然袭至，ἀδόκητοι表示未曾预料；加入“突然”体现动词的突临意味，同时以“意想不到”准确传达形容词。
