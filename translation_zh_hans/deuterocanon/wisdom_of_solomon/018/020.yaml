base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/020.yaml
  text: But the trial of death also touched the righteous[a], and a destruction of the multitude occurred in the wilderness[b]; yet the wrath did not remain for long.
translation:
  language: zh_hans
  text: 然而，死亡的考验也临到了义人[a]；旷野中有许多人遭到毁灭[b]。但震怒并没有持续多久。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡的考验”也可译作“死亡的经历”或“借死亡而来的试炼”。
    reason: lexical_alternative
  - marker: b
    text: “遭到毁灭”原文也可译作“遭到击碎”或“遭受重创”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἥψατο
  choice: 临到了
  rationale: 此处中间语态 ἅπτομαι 表示某事触及、影响某人；“临到了”在现代汉语中自然，也保留灾祸来到义人身上的意象，而不夸大为彻底毁灭。
- source_word: δικαίων
  choice: 义人
  rationale: 将复数名词化形容词译为“义人”，保留其道德与宗教范畴，也是庄重而通行的圣经汉语。
- source_word: πεῖρα θανάτου
  choice: 死亡的考验
  rationale: πεῖρα 可指试验、考验或经历；“死亡的考验”保留紧凑的属格结构及其歧义，没有直接断定义人都实际死亡。
- source_word: θραῦσις
  choice: 毁灭
  rationale: θραῦσις 本义为打破、击碎；在致命灾祸的语境中，“毁灭”较自然地表达群体所受的重创，脚注保留更贴近字面的译法。
- source_word: πλήθους
  choice: 许多人
  rationale: πλῆθος 指众多的人或群体；“许多人”符合现代汉语表达，并保留数量众多的集体意义。
- source_word: ἐν ἐρήμῳ
  choice: 旷野中
  rationale: “旷野”符合以色列出埃及背景中的传统语境，也比“沙漠”覆盖面更准确。
- source_word: ὀργή
  choice: 震怒
  rationale: 此处指审判性的烈怒；“震怒”庄重有力，同时不在正文中明说其所有者。
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: 并没有持续多久
  rationale: 自然表达该时间短语，准确传达震怒未长久延续。
theological_decisions:
- issue: 是否明确说明震怒是上帝的震怒
  choice: 震怒
  alternative: 上帝的震怒／他的震怒
  rationale: 上下文强烈暗示这是上帝的震怒，但希腊文只有带冠词的 ἡ ὀργή，没有明示所有者，因此让上下文确定所指。
- issue: 如何表达义人与死亡之考验的关系
  choice: 死亡的考验也临到了义人
  alternative: 义人也经历了死亡／死亡也考验了义人
  rationale: 原文表明义人也受到致命事件波及，却没有明确说所有义人都死亡；此译法保留这种神学张力和 πεῖρα 的语义幅度。
- issue: 如何理解许多人所受的 θραῦσις
  choice: 有许多人遭到毁灭
  alternative: 众人遭到击碎／人群遭受重创
  rationale: 语境指旷野中的严重灾难；正文采用自然且有力度的“毁灭”，同时借脚注保存“击碎、重创”的原始意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现前两分句的紧密关系，再用句号突出震怒持续短暂这一转折。正文避免生硬照搬希腊文，但脚注保留 πεῖρα 与 θραῦσις 的真实词义范围。
