base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: zh_hans
  text: 因为那些使他们惊惶的梦，预先警示了这事[a]，免得他们在不知道自己为何遭受苦难[b]的情况下灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“预先表明了这事”或“预告了这事”。希腊语动词既可表示事先告知，也可带有预先警告的意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他们因什么而受苦”；也可译作“他们为何受苦”或“他们为何遭难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: 因为那些梦
  rationale: ὄνειροι直译为“梦”；定冠词结合上下文译作“那些”，γάρ译作“因为”，承接并解释前文。
- source_word: θορυβήσαντες αὐτοὺς
  choice: 使他们惊惶
  rationale: θορυβέω表示使人骚动、惊慌或不安；“使他们惊惶”既保留强烈的情绪反应，也符合庄重的现代汉语。
- source_word: τοῦτο προεμήνυσαν
  choice: 预先警示了这事
  rationale: προμηνύω兼有预先表明、预告和警告之意；“预先警示”保留梦境既预告又示警的语气，不把含义限定为单纯预言。
- source_word: ἵνα μὴ ... ἀπόλωνται
  choice: 使他们不至于……就灭亡
  rationale: ἵνα μή自然表示否定目的；此译法保留“为使他们不至于”的目的意味。ἀπόλωνται译为“灭亡”，符合本节严肃的文学语域。
- source_word: ἀγνοοῦντες διʼ ὃ κακῶς πάσχουσιν
  choice: 不知道自己为何遭受苦难
  rationale: διʼ ὃ按汉语习惯译为“为何”；κακῶς πάσχειν表示受苦、遭难。“遭受苦难”自然表达其负面和严重程度，同时避免生硬的“受苦得很厉害”。
theological_decisions:
- issue: 不祥之梦的目的
  choice: 将梦描述为预先的警示，使受苦者不至于在不明白受苦缘由的情况下灭亡。
  alternative: 也可把ἵνα从较宽泛的结果意义理解为：这些梦所产生的结果，是他们并非无知地灭亡。
  rationale: 在通用希腊语和七十士译本用法中，ἵνα在这里最自然地表达目的。此译法保留经文中的张力：苦难严厉，却有预先警示，使受苦者并非全然不明其缘由。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“使他们惊惶”保留梦所造成的强烈不安；“预先警示”兼顾预告与警告两层可能含义；句末“不知道……就灭亡”按汉语语序清楚表达伴随状态及否定目的。
