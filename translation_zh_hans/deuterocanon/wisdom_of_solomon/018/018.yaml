  naturalness: “半死不活”虽常用，但带有较强口语色彩，也常可泛指萎靡不振；本节灾祸叙事中用“已是半死”更庄重直接。“显明了自己为何将死”搭配略显生硬，改为“表明了自己因何濒死”更合现代叙事汉语。
  terminology: 无需处理专门神学术语。以“濒死”表达ἡμίθνητος与ἔθνησκεν共同构成的尚在死亡过程中的情景，避免把死亡说成既成事实。
