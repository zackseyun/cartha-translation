  text: and another[a], cast down elsewhere, half-dead[b], made known the cause for which he was dying.
translation:
  language: zh_hans
  text: 另一个人在别处被抛倒，已是半死，表明了自己因何濒死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被抛倒”也可译作“被掷倒”或“被扔下”。希腊语分词强调此人是被抛下而倒地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλαχῇ
  choice: 在别处
  rationale: 该副词表示与上文所述情形不同的地点；“在别处”简洁自然，并保留空间上的对比。
- source_word: ῥιφεὶς
  choice: 倒在
  rationale: 原词是被动分词，本义涉及被抛下、摔倒；结合中文叙事，“倒在别处”自然地呈现其倒地状态，同时不擅自说明施事者。其较强的“被抛倒”意味收入脚注。
- source_word: ἡμίθνητος
  choice: 半死不活
  rationale: 直接表达“半死”的状态，现代中文自然且形象，也与后文尚在死亡过程中的描述相合。
- source_word: διʼ ἣν ... αἰτίαν
  choice: 为何
  rationale: 该结构指向致死的具体原因；“自己为何将死”在中文中清楚自然，保留解释原因的功能。
- source_word: ἔθνησκεν
  choice: 将死
  rationale: 希腊语未完成时描写死亡正在发生而非已经完成；“将死”与“半死不活”相配，表明此人尚未死亡。
- source_word: ἐνεφάνιζεν
  choice: 显明
  rationale: 该动词意为使某事显露、让人知道；“显明”庄重凝练，并保留主动披露死因的含义。
theological_decisions:
- issue: 垂死者披露死因时的叙事体貌
  choice: 译作“为何将死”，表明死亡尚未完成。
  alternative: 为何死去／因何而死
  rationale: ἔθνησκεν为未完成时，与ἡμίθνητος“半死”共同描绘此人仍在垂死过程中；如此保留原文现场感，不把事件误写成已经完成。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“半死不活”虽属常用语，但准确传达ἡμίθνητος的鲜明状态；句末用“为何将死”保持死亡过程尚未完成。
