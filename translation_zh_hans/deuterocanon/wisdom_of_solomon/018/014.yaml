  text: 因为当安宁的静寂笼罩万物，黑夜正以自身的迅疾行至半途时[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为：“黑夜以自身的迅疾正处于中间。”希腊原文的措辞高度凝练，富有诗意；此处指黑夜已行至中点。
