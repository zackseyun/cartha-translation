lexical_decisions:
- source_word: ἡσύχου σιγῆς
  choice: 宁静的寂静
  rationale: 保留形容词与名词的组合，以及原文安谧、无声的诗意；虽有轻微语义叠合，但符合庄重文体。
- source_word: περιεχούσης
  choice: 笼罩
  rationale: 表达环绕、包围之意，与“寂静”和“万物”搭配自然，也保留原文的空间意象。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 保持表达的广泛性，不将其缩窄为“全世界”。
- source_word: νυκτός
  choice: 黑夜
  rationale: 现代汉语中自然而庄重，并适合诗性语境。
- source_word: ἐν ἰδίῳ τάχει
  choice: 按着自己的速度
  rationale: 较贴近字面“以它自己的速度”，不擅自加入“既定”或“飞快”等原文未明确表达的含义。
- source_word: μεσαζούσης
  choice: 行至中途
  rationale: 表达黑夜运行到中点；“行至”承接速度与进程的意象，同时避免误解为黑夜穿行于“万物”之中。
