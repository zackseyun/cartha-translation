  terminology: “施罚者”“誓言”“约”均符合现代标准汉语和本段庄重语体。κoλάζω对应词中的拉丁字母拼写仅见于词汇说明，不影响正文；建议规范为κωλάζω。为对应διαθήκας的复数，正文采用“诸约”。
