  source_fidelity: 正文基本忠实反映希腊文的三重对比：不是凭肉身力量，也不是凭武器效力，而是凭话语制伏施罚者。对τὸν κολάζοντα的身份保持不确定，且脚注恰当说明。ὅρκους πατέρων具有属格关系上的余地；正文取“向列祖所起的誓言”可由盟约语境支持，脚注保留另一可能，处理审慎。需要将διαθήκας的复数在汉语中明确表达，并略去未由原文强调的“只……就”语气。
