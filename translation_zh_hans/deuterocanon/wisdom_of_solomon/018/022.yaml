base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/022.yaml
  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: zh_hans
  text: 他战胜那一群人，并不是靠身体的力量，也不是靠武器的威力；却凭一句话制伏了施罚者[a]，使他想起向列祖所起的誓言和所立的诸约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在施罚的那一位。”希腊文没有明确说明这是指上帝、毁灭的天使，还是人格化的审判力量。
    reason: 保留实体化分词所指对象的不确定性。
  - marker: b
    text: “向列祖所起的誓言”也可理解为“列祖所起的誓言”；这里的希腊语属格关系并未明说。上下文较支持指上帝向列祖所作的盟誓。
    reason: 说明ὅρκους πατέρων的语法歧义及正文选择。
lexical_decisions:
- source_word: ἐνίκησεν
  choice: 胜过了
  rationale: 表示取得胜利或占了上风；这里并非描述军事杀戮，“胜过”既贴近原义，也适合制止灾祸的语境。
- source_word: τὸν ὄχλον
  choice: 那一大群人
  rationale: ὄχλος可指群众、大群人。保留其集合性和指称性，不把它解释成原文没有明说的“瘟疫”。
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: 不是靠身体的力量
  rationale: 与原文工具格意义相符，并保留身体力量、武器与话语之间的对比。
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: 也不是靠武器的威力
  rationale: ἐνέργεια在此指实际发挥的效力或力量；“武器的威力”是自然且准确的现代汉语。
- source_word: ἀλλὰ λόγῳ
  choice: 他只凭一句话
  rationale: λόγος在此最可能指说出的话；“一句话”保留原文的简洁，不直接扩写为“代求”。
- source_word: τὸν κολάζοντα
  choice: 施罚者
  rationale: 这是κoλάζω的实体化现在分词，指正在施行惩罚者。译文不进一步确定是上帝、天使还是人格化的审判力量。
- source_word: ὑπέταξεν
  choice: 制伏了
  rationale: ὑποτάσσω意为使服从、置于控制之下。“制伏”符合制止惩罚的语境，同时不额外暗示对上帝的绝对支配。
- source_word: ὅρκους πατέρων
  choice: 向列祖所起的誓
  rationale: 属格πατέρων在形式上可理解为与列祖相关或列祖所起的誓；上下文偏向上帝向列祖所作的誓言，正文采用这一自然读法，同时以脚注保留语法上的另一可能。
- source_word: καὶ διαθήκας
  choice: 和所立的约
  rationale: διαθήκη在七十士译本及圣经希腊语中通常指“约”。原文为复数，汉语中“所立的约”可自然涵盖多项立约承诺而不必机械加“诸”。
- source_word: ὑπομνήσας
  choice: 使他想起
  rationale: 分词表示伴随方式或手段。汉语补出隐含宾语“他”，与前面的“施罚者”衔接，但不确定其身份。
theological_decisions:
- issue: “施罚者”的身份及ὑπομνήσας的隐含宾语
  choice: 正文译为“施罚者”，并以“使他想起”回指该角色，但不说明其究竟是谁。
  alternative: 可译为“正在施罚的那一位”，或按语境解释为毁灭者、天使或上帝。
  rationale: 希腊文只有实体化分词，没有明确指认该角色。保留这种不确定性，避免把某种神学解释写入正文。
- issue: λόγῳ的含义
  choice: 译为“凭一句话”。
  alternative: 可译为“凭话语”“凭代求”或“凭理据”。
  rationale: 上下文确实涉及代求，但原词本身只说“话/言语”。简洁直译可保留文本张力，避免解释性扩写。
- issue: ὅρκους πατέρων中属格的关系
  choice: 正文采用“向列祖所起的誓”，理解为向列祖作出的盟誓。
  alternative: “列祖所起的誓”或更宽泛的“与列祖有关的誓言”。
  rationale: 单凭属格形式存在歧义；盟约语境支持“向列祖所起的誓”，但不宜抹去另一语法可能，因此脚注注明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那一大群人”保留ὄχλος的集合意义；分号突出身体力量、武器威力与一句话之间的强烈对比。所有解释性限定均留在脚注，不在正文中指定施罚者的身份。
