base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: zh_hans
  text: 然而，你的圣民却有极明亮的光。那些人听见他们的声音，却看不见他们的形貌；因为那些人自己也曾渴望[a]，就称他们有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语这里的动词通常意为“曾渴望”或“曾思念”，但句中没有说明所渴望的对象，所以语意较难确定。按上下文，也有人将这句话理解为“因为他们没有遭受同样的苦难”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: 你的圣民
  rationale: ὅσιος指在上帝面前虔诚、圣洁的人；“圣民”既符合这里群体性的语境，也避免“圣徒”可能带来的后世宗派色彩。
- source_word: μέγιστον ... φῶς
  choice: 极明亮的光
  rationale: μέγιστον是最高级；汉语用“极明亮”自然表达强烈程度，同时保留与黑暗的鲜明对比。
- source_word: φωνὴν
  choice: 声音
  rationale: φωνή在此可指人的声音，与下文看不见其μορφή形成听觉和视觉的对照。
- source_word: μορφὴν
  choice: 形貌
  rationale: μορφή指可见的形态或外貌；“形貌”不额外限定具体容貌或身体轮廓。
- source_word: ἐπεπώθεισαν
  choice: 曾渴望
  rationale: 按现存希腊文本，该动词通常表示“渴望、思念”。原句未明说渴望的对象，逻辑也较费解，因此正文保留其词义和语意张力，并以脚注列出按上下文形成的另一种理解。
- source_word: ἐμακάριζον
  choice: 称他们有福
  rationale: μακαρίζω意为宣称或认为某人有福；此译法自然，并保留评价性的含义。
theological_decisions:
- issue: 分号后各动词的隐含主语
  choice: 将听见、看不见、渴望和称为有福者理解为与圣民相对的“那些人”，即上下文中的埃及人
  alternative: 把前两个分词理解为圣民的行动，或认为压缩句法描写双方彼此感知
  rationale: 上下文在黑暗之灾中对比埃及人与上帝的子民；ὧν回指圣民，而κἀκεῖνοι表明另一个群体，因此最自然的是由埃及人听见圣民并称他们有福。
- issue: ἐπεπώθεισαν在语境中的含义
  choice: 正文保留“曾渴望”这一现存希腊文本的通常词义
  alternative: 按语境译作“没有遭受同样的苦难”
  rationale: 希腊文没有明确的否定词，而该动词通常意为“渴望”。虽然“没有遭受同样的苦难”较符合上下文并见于解释性译法，但不宜在正文中无说明地取代现存措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“然而……却……”体现δὲ的转折；后半句保留原文压缩的指代和难解之处，但用“那些人”使群体转换在汉语中可辨。
