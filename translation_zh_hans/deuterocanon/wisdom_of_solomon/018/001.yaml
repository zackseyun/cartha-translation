review_pass:
  verdict: revise
  source_fidelity: 译文正确呈现了“你的圣民”“极明亮的光”、听见声音而看不见形貌，以及“称他们有福”的基本结构。μως，ἐπεπώθεισαν为过去完成时，通常义为“曾渴望／曾思慕”，原文未明示宾语；现有“自己也曾渴望”虽保留词义，却在汉语中显得宾语缺失且“自己”不必要。英文审校轨迹中“没有遭受同样的苦难”的说法不受所给希腊文本支持：κἀκεῖνοι没有否定词，ἐπεπώθεισαν也并非“遭受”。
  naturalness: 整体庄重自然；将后半句改为“因为他们也曾有所渴望”，可保留原文省略的对象与句意难点，同时使现代汉语更通顺。
  terminology: “圣民”“声音”“形貌”“有福”均合乎本段宗教书面语体和原文语义。“极明亮的光”可保留，以自然表达μέγιστον的强度。
  issues:
  - severity: medium
    issue: “因为那些人自己也曾渴望”在汉语中缺少所渴望的对象，且“自己”会造成不必要的强调。
    rationale: 希腊文的ποθέω通常需要或预设所渴望的对象，但本句并未明确给出。汉语宜用“有所渴望”来保持这种省略，而不凭上下文补定对象。
  - severity: high
    issue: 脚注把“因为他们没有遭受同样的苦难”列作上下文理解，容易误导为原文可直接译出否定和“遭受”。
    rationale: 所给希腊文本没有否定词；ἐπεπώθεισαν的通常义是“曾渴望／思慕”。若记录解释性处理，应明确它是脱离通常词义的语境性释读，且不应加入原文没有的“没有”。
  revised_text: 然而，你的圣民却有极明亮的光。那些人听见他们的声音，却看不见他们的形貌；因为他们也曾有所渴望[a]，就称他们有福。
  revised_footnotes:
  - marker: a
    text: 希腊语动词通常意为“曾渴望”或“曾思念”，但这里没有明说所渴望的对象，因此句意较难确定。有些解释按上下文将其理解为与先前灾难有关的经历；这不是该动词的通常词义，且希腊文本没有“没有”的否定词。
    reason: alternative_reading
  revision_rationale: 修订只处理汉语表达和脚注准确性。“有所渴望”保留ἐπεπώθεισαν的通常词义、过去完成的“曾”以及原文未明示宾语的歧义。脚注删去会在中文中直接加入否定及“遭受苦难”含义的表述，同时公平说明语境性解释。
