review_pass:
  verdict: revise
  source_fidelity: 正文正确保留了ἐπεπώθεισαν通常的“渴望”义，且没有跟随英文审校轨迹把原文未出现的否定或“遭受苦难”直接写入正文。ὧν宜在汉语中明确回指“圣民”，以免“他们”产生不必要的指代歧义。
  naturalness: 原译整体庄重通顺；但“那些人听见他们的声音”中两个代词相邻，指代稍显费解。将受事明确为“圣民”更合现代汉语，也不增加原文信息。
  terminology: “圣民”“声音”“形貌”“称他们有福”均合乎宗教书面语和原文语义。“极其明亮的光”比“极明亮的光”更自然，同时表达μέγιστον的强度。
  issues:
  - severity: low
    issue: 代词指代在汉语中不够清楚
    rationale: ὧν回指“你的圣民”，而听见、看不见及称为有福的隐含主语是另一群体。中文连续使用“那些人／他们”会使读者短暂停顿才能辨明谁在听、谁被听见。
  - severity: low
    issue: 脚注中“没有遭受同样的苦难”须明确为解释性译法，而非希腊文本的直接读法
    rationale: 所给希腊文既没有否定词，也没有“遭受”的动词；脚注可保留该传统性、上下文驱动的解释，但应说明它不是该措辞的字面翻译。
  revised_text: 然而，你的圣民却有极其明亮的光。那些人听见圣民的声音，却看不见他们的形貌；因为他们自己也曾渴望[a]，就称圣民有福。
