base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/015.yaml
  text: your all-powerful word leaped from heaven[a], from royal thrones, a relentless warrior, into the midst of the doomed land[b];
translation:
  language: zh_hans
  text: 你那全能的话语[a]——一名凌厉的战士——从天上、从王室的众宝座[b]跃入那注定毁灭之地的中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话语”也可译作“全能之言”。这里的话语被描写成战士；有人据此理解为人格化的神圣行动者，但希腊文本也可泛指上帝大有能力、必然成就的话。
    reason: 保留λόγος的人格化及神学解释空间，避免正文过早限定。
  - marker: b
    text: 原文“天”和“宝座”均为复数；“王室的众宝座”也可译作“君王的众宝座”。
    reason: 说明希腊文复数形式，并保留βασιλείων可表王室或君王的语义范围。
lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: 你全能的话语
  rationale: παντοδύναμος意为“全能的”；λόγος在本节首先指上帝发出并施行审判的话语。译作“话语”既自然，也不在正文中预先限定其人格化或基督论解释。
- source_word: ἀπʼ οὐρανῶν
  choice: 从诸天
  rationale: 原文为复数。中文“诸天”能以庄重而简洁的方式保留这一形式。
- source_word: ἐκ θρόνων βασιλείων
  choice: 从王者的众宝座
  rationale: θρόνων为复数，βασιλείων带有王权、王者或王室色彩；此译保留复数和王权意象，不擅自归并为单一宝座。
- source_word: ἀπότομος πολεμιστής
  choice: 一名凌厉的战士
  rationale: πολεμιστής是“战士”；ἀπότομος在此表达严峻、猛烈而不留余地的力量。“凌厉”能自然传达审判行动的迅猛与严酷，同时避免使用词义过强的“无情”。
- source_word: εἰς μέσον
  choice: 进入……的中央
  rationale: 保留进入某地正中间的空间图景；与ἥλατο结合译为“跃入……的中央”。
- source_word: τῆς ὀλεθρίας γῆς
  choice: 那注定灭亡之地
  rationale: ὀλέθριος既可指带来毁灭，也可指面临毁灭。上下文是埃及遭受审判，故译作“注定灭亡”最切合语境，同时以脚注承认另一种可能。
- source_word: ἥλατο
  choice: 跃入
  rationale: 该动词描写跳跃、腾跃，突出动作的突然和迅疾；“跃入”兼顾动作及其方向。
theological_decisions:
- issue: λόγος是否应直接译成具有明确人格或基督论指向的称谓
  choice: 正文译作“话语”，并以破折号保留战士形象所形成的人格化表达
  alternative: 译作“圣言”或把它明确解释为一位神圣代理者
  rationale: 本节把上帝有效施行审判的话语人格化为战士，但希腊文本本身并未明确要求读者作后来的特定基督论认定。正文不消除这种可能，也不将其定为唯一解释。
- issue: 如何呈现战争与审判意象
  choice: 一名凌厉的战士
  alternative: 一名无情的战士；如同一名战士
  rationale: 保留原文严峻的军事意象，并以同位结构而非明喻呈现，因为希腊文直接称这话语为战士；同时避免“无情”所附加的道德判断。
- issue: ὀλεθρίας描述土地是“毁灭性的”还是“注定灭亡的”
  choice: 注定灭亡之地
  alternative: 毁灭之地；带来毁灭的土地
  rationale: 逾越节审判的叙事语境支持“遭受毁灭”之意，但形容词本身存在一定张力，因此在脚注中保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以破折号呈现希腊文中“战士”与“话语”的同位关系，避免添入“如同”；“跃入”保留原文鲜明而迅疾的动作感。
