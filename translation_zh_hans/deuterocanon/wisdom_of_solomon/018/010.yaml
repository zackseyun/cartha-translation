  text: But the discordant cry of enemies echoed back[a], and the pitiful lament for children being mourned was carried abroad.
translation:
  language: zh_hans
  text: 但仇敌那杂乱刺耳的哀号回荡着；为孩子哀悼的凄惨哀声也传遍各处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντήχει
  choice: 回荡着
  rationale: 该动词描写声音响应、回响或震荡；“回荡着”既保留听觉画面，也符合未完成时所呈现的持续状态。
- source_word: ἀσύμφωνος
  choice: 不和谐的
  rationale: 原词指不协调、不合拍；这里既可描写声音杂乱刺耳，也带出痛苦中的失序感。“不和谐”保留其声学意象而不过度解释。
- source_word: ἐχθρῶν
  choice: 仇敌
  rationale: 属格表明哭喊的发出者。上下文所指是敌对者；译作“仇敌”贴近原文，且不在本节内额外点明埃及人。
- source_word: ἡ βοή
  choice: 哭喊
  rationale: βοή可指呼喊、喊声；在死亡与哀悼的语境中，“哭喊”比“呐喊”更自然，也不致误解为战斗呼号。
- source_word: οἰκτρά
  choice: 凄惨哭声
  rationale: 中性复数形式在此可作实质性或状语性表达，表示令人怜悯、凄惨的声音；结合θρηνουμένων，译为“凄惨哭声”自然地呈现悲恸之声。
- source_word: διεφέρετο
  choice: 传遍各处
  rationale: 未完成时被动形式描写声音不断被传开、传往各处；中文用主动形态的“传遍各处”更自然，同时保留声音扩散的动态。
- source_word: θρηνουμένων
  choice: 哀悼
  rationale: 该分词为被动意义，所修饰的孩子是被哀悼者。中文“哀悼孩子”明确表达这一关系，不会误成孩子自己哀哭。
- source_word: παίδων
  choice: 孩子
  rationale: 原词在本节采用较宽泛的“孩子”，虽上下文涉及长子，仍不宜把本节具体化为“长子”或“儿子”。
theological_decisions:
- issue: 是否按上下文将παίδων明确译为“长子”或“长子们”
  choice: 孩子
  alternative: 长子；儿子
  rationale: 本章语境确实关乎埃及长子之死，但本节自身只用宽泛的παίδων。依照原文优先原则，正文保留“孩子”，不把上下文中的限定加入词义。
- issue: θρηνουμένων的施受关系
  choice: 将孩子理解为被哀悼者
  alternative: 理解为正在哀哭的孩子
  rationale: 该分词为中间/被动形态，在此与παίδων构成属格结构，最自然地指“被哀悼的孩子”。译文用“哀悼孩子”避免施受关系含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不和谐的哭喊”略带文学色彩，以保留ἀσύμφωνος刻意突出的声音失调；后半句调整为自然中文语序，避免“孩子被哀悼的凄惨之声”一类生硬结构。
