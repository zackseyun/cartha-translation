base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/002.yaml
  text: because, though they had been attacked before, they gave thanks that they were not being harmed[b][a], and they begged pardon for their hostility.
translation:
  language: zh_hans
  text: 因为他们先前虽遭受攻击，却因没有受到伤害[a]而献上感谢，并为彼此的嫌隙恳求宽宥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所传希腊文句法艰涩，尤其是涉及“没有受到伤害”的短语。这里按上下文最可能的意思翻译：先前的敌对已转为感谢和求宽宥。
    reason: textual_variant
  - marker: b
    text: 或译：“并为彼此的疏远（或冲突）求恩惠。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: 如今没有受到伤害
  rationale: 所传希腊文的形式和句法均有困难；βλάπτω通常指“伤害、损害”。结合上下文，此处最可能表达先前受敌对者如今未受伤害，故采用被动意义，同时以脚注保留不确定性。
- source_word: προπολεμημένοι
  choice: 先前虽遭受攻击
  rationale: 保留προ-的先前时间意义及πολεμέω的敌对、交战色彩；“虽”自然呈现先前受攻击与如今感谢之间的转折关系，但不补入希腊文没有明说的施事者。
- source_word: εὐχαριστοῦσιν
  choice: 献上感谢
  rationale: 准确表达动词“感谢、表示感激”的意义，语言庄重而自然。
- source_word: τὸ διενεχθῆναι
  choice: 彼此的嫌隙
  rationale: 该不定式可指分歧、疏远或冲突。“嫌隙”既包含关系失和，也避免将其限定为战争或普通意见分歧。
- source_word: χάριν ἐδέοντο
  choice: 恳求宽宥
  rationale: χάριν与δέομαι的组合直指恳求恩惠；在先前敌对和关系失和的语境中，“宽宥”自然传达求情、求谅的意味，同时不采用更具特定神学色彩的措辞。
theological_decisions:
- issue: 如何处理抄本中句法艰涩、疑有讹误的表述
  choice: 按上下文译为先前受攻击者因如今未受伤害而感谢，并为关系嫌隙求宽宥
  alternative: 较机械地译为“因为那些先前交战、不伤害的人感谢，并为产生分歧而求恩惠”
  rationale: 机械对应会使主语关系和“不伤害”的语态难以理解。正文采用最可能的上下文意义，但用脚注明示希腊文困难，不把推断伪装成确定文本。
- issue: χάριν ἐδέοντο是否明确表示求赦免
  choice: 译作“恳求宽宥”
  alternative: 译作“为彼此的嫌隙求恩惠”
  rationale: “宽宥”符合敌对关系后的求情语境，却不把该短语提升为特定的神学赦罪概念；脚注同时保留较字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上感谢”保持经文语体；“彼此的嫌隙”表达关系失和但不过度解释。脚注标记均置于正文相应位置。
