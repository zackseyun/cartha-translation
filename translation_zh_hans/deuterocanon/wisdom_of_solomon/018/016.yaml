translation:
  language: zh_hans
  text: 他手持利剑——就是你真实无伪的命令；他一站定，就使万物充满死亡。他上触苍天，脚却已踏在大地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξίφος ὀξὺ
  choice: 利剑
  rationale: 直译“锋利的剑”，用现代汉语中庄重凝练的“利剑”保留鲜明的战争意象；希腊文未明确以 σου 修饰“剑”，因此不擅自译成“你的利剑”。
- source_word: τὴν ἀνυπόκριτον ἐπιταγήν σου
  choice: 你真实无伪的命令
  rationale: ἐπιταγή指权威性的命令；ἀνυπόκριτος本义为不虚假、不伪装。“真实无伪”保留其直接语义和庄重语体，不把它解释性收窄为“不可违抗”。破折号呈现“命令”与“利剑”之间紧密而略带歧义的同位或比拟关系。
- source_word: φέρων
  choice: 带着
  rationale: 现在分词表示与主句行动同时发生；“带着”自然清楚，也不强行判定是手持、佩带还是承载。
- source_word: στὰς
  choice: 一站定
  rationale: 该词为ἵστημι的不定过去分词，表示取定站位后施行行动；“一站定，便……”既保留先行动作，也符合现代汉语节奏。
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: 使万物充满死亡
  rationale: 保留τὰ πάντα的全面范围和θανάτου的强烈、直接表达，不把“万物”具体化为世界或宇宙。
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: 上触苍天
  rationale: ἅπτομαι基本义为触及；“上触苍天”简洁地保留巨人般的宇宙图景，不弱化为仅仅“达到”。
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: 脚却已踏在大地上
  rationale: βαίνω的完成时态表达已经踏足并保持立足状态；“已踏在”兼顾动作完成与站立结果，“却”呈现μέν…δέ的对举。
theological_decisions:
- issue: 施行灾罚者的人格化身份
  choice: 以“他”延续上下文中如战士般行动的上帝之话语或命令，但不进一步界定其本体身份
  alternative: 明确译为灭命天使、独立的天使性毁灭者，或具有特定后期教义身份的“圣言”
  rationale: 本节用持剑、站定、触天踏地等拟人化战争图像描绘神圣命令的施行者，却没有在本节明确作本体论认定；译文保留人格化及其神学张力，不引入经文未明说的身份。
- issue: “利剑”与“命令”的语法关系
  choice: 用破折号表达二者可能为同位或解释关系
  alternative: 明确译成“把你的命令当作利剑”或“手持你的利剑，并带着你的命令”
  rationale: 原文连续使用两个宾格，关系凝练而有一定歧义；破折号既保留“命令就是利剑”的强烈意象，也避免把语法关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句首“他”承接上文的人格化主体；“利剑”“苍天”“万物”维持诗性高度。“上触苍天，脚却已踏在大地上”以平衡句式再现希腊文μέν…δέ的天地对举。
