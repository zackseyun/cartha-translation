base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: zh_hans
  text: 因为在那件垂至脚边的长袍上，有整个世界[a]；在四行宝石上的刻文上，有列祖的荣耀[b]；在他头上的冠冕上，有你的威严。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “垂至脚边的长袍”也可译作“长及脚的袍子”。
    reason: lexical_alternative
  - marker: b
    text: 原文的表达凝缩而较难确定，可能指大祭司胸牌上排成四行的宝石及其刻文。
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: 长及脚面的礼袍
  rationale: ποδήρης指下垂至脚的衣服；“长及脚面的礼袍”既保留长度特征，也以“礼袍”自然呈现大祭司服饰的庄重语境。
- source_word: ὅλος ὁ κόσμος
  choice: 整个世界
  rationale: κόσμος在此具有世界或宇宙秩序的广义象征意义；“整个世界”贴近原文，同时不扩译为“万物”或“受造界”。
- source_word: πατέρων δόξα
  choice: 列祖的荣耀
  rationale: πατέρων直译为“父辈”，在圣经历史语境中“列祖”自然且不必限定为某几位族长；δόξα译作“荣耀”，保留庄严语体及其可指尊荣或辉光的开放性。
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: 在四行宝石的雕刻上
  rationale: 原短语高度凝缩，τετράστιχος表示排成四行，λίθος以单数集合性地指宝石构成，γλυφή指雕刻；译文传达四行宝石及其刻纹，同时不把胸牌直接写入正文。
- source_word: μεγαλοσύνη σου
  choice: 你的威严
  rationale: μεγαλοσύνη可指伟大、尊荣或威严；对上帝的直接称呼中，“威严”庄重自然，并保留神圣尊荣的含义。
- source_word: διάδημα
  choice: 冠冕
  rationale: διάδημα指戴在头上的冠带或冠冕；“冠冕”符合现代中文圣经语体，并比普通“帽子”更能体现其礼仪尊荣。
theological_decisions:
- issue: 大祭司礼服所承载的宇宙与祖先象征
  choice: 保留“整个世界”“列祖的荣耀”和“你的威严”三重象征，不在正文中进一步解释其对应物。
  alternative: 明确增译为大祭司的胸牌、十二支派宝石和额上的圣冠。
  rationale: 希腊文暗示大祭司服饰及其象征，却没有在本节逐项明说出埃及记背景；正文应保存意象及神学张力，相关文化背景放入脚注。
- issue: κόσμος的范围
  choice: 译为“整个世界”。
  alternative: 译为“整个宇宙”或“整个受造界”。
  rationale: “世界”保留κόσμος可能兼指有秩序的宇宙整体的宽度，又避免把其意义过度限定为物质宇宙或创造神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的中文。以三个“在……上，有……”形成平行句式，尽量再现希腊文三重ἐπί结构；“礼袍”“列祖”“冠冕”维持礼仪与诗性语域，但避免过度古雅。
