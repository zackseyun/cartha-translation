base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: zh_hans
  text: 因为善人的敬虔子女暗中献祭[a]，又同心立定神圣的律法[b]，使圣洁的人[c]同等分享同样的福乐和危险；那时，他们的父辈早已预先唱着赞美之歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秘密地献祭”。希腊文强调献祭是在不公开的情况下进行的。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“神性的律法”。原希腊语短语较为少见。
    reason: lexical_alternative
  - marker: c
    text: 或译“圣者”；这里没有采用后来较具专门宗教色彩的“圣徒”。
    reason: alternative_reading
lexical_decisions:
- source_word: κρυφῇ
  choice: 暗中
  rationale: 这是作状语用的形式，表示献祭以隐秘、不公开的方式进行；“暗中”自然且保留了秘密行动的意味。
- source_word: ἐθυσίαζον
  choice: 献祭
  rationale: 未完成时可表达当时正在进行或反复进行的行动；“献祭”明确保留其礼仪含义。
- source_word: ὅσιοι παῖδες ἀγαθῶν
  choice: 善人的虔敬子女
  rationale: ὅσιοι侧重对神虔敬、忠诚，παῖδες可指儿女或后代，ἀγαθῶν在此自然理解为“善人”的属格；译文不额外限定年龄或性别。
- source_word: τὸν τῆς θειότητος νόμον
  choice: 神圣的律法
  rationale: 原短语字面近于“神性的律法”，措辞较为少见；“神圣的律法”在现代汉语中清楚，同时不把它改写成特定教派概念。
- source_word: ἐν ὁμονοίᾳ διέθεντο
  choice: 同心立定
  rationale: ἐν ὁμονοίᾳ表示同心一致；中动词διέθεντο含有共同安排、制定或郑重确立之意，“同心立定”兼顾群体共识与庄重语气。
- source_word: μεταλήμψεσθαι
  choice: 要……分享
  rationale: 不定式说明他们所立定内容，指共同有分；“分享”是自然的现代汉语表达。
- source_word: τῶν αὐτῶν ὁμοίως καὶ ἀγαθῶν καὶ κινδύνων
  choice: 同样分享相同的福乐和危险
  rationale: 保留αὐτῶν与ὁμοίως对“相同”和“同等参与”的双重强调；ἀγαθῶν在与“危险”对举时译为“福乐”，比笼统的“好东西”更合语境。
- source_word: τοὺς ἁγίους
  choice: 圣洁的人
  rationale: 贴近“分别为圣者／圣者”的基本意义，并避免“圣徒”可能带入的后期基督教专门用法。
- source_word: πατέρων
  choice: 他们的父辈
  rationale: 属格独立结构中的“父辈”与前文群体具有亲属或祖辈关系；补出“他们的”使汉语关系清楚。
- source_word: προαναμελπόντων αἴνους
  choice: 已经预先唱起赞歌
  rationale: προαναμελπόντων同时包含歌唱与事先、预先的意味，αἴνους是赞美之歌；译文保留两层信息。
theological_decisions:
- issue: 经文中行动者的历史身份
  choice: 按字面译为“善人的虔敬子女”和“圣洁的人”，让上下文显明其为出埃及逾越节背景中的忠信群体。
  alternative: 直接增译为“以色列人”或泛化为“义人”。
  rationale: 本节自身没有出现“以色列人”一词；不在正文补入身份称谓，可保留原文表达，同时不抹去上下文的历史背景。
- issue: τοὺς ἁγίους的宗教称谓
  choice: 圣洁的人
  alternative: 圣徒
  rationale: “圣洁的人”保留原词的分别为圣含义，又避免将后期教会中的技术性称谓提前带入所罗门智训的叙事。
- issue: τὸν τῆς θειότητος νόμον的含义
  choice: 神圣的律法
  alternative: 神性的律法；敬神的法则
  rationale: 原短语本身不寻常，既可能强调律法属于神圣领域，也可能强调其与神性有关；正文采用通顺但不过度阐释的表达，并以脚注保留字面可能性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“同心立定”保留共同一致与郑重确立的语气；分号划分父辈歌唱的伴随背景。所有脚注标记均置于相应正文词语之后。
