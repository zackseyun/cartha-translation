  text: So your people expected both the salvation of the righteous and the destruction of their enemies[b][a];
translation:
  language: zh_hans
  text: 你的子民所期待的[a]是：一方面义人蒙拯救[b]，另一方面仇敌遭毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所等候的”“所迎接的”或“所接受的”；希腊文动词可指期待、等候，也可指迎接或接受。
    reason: lexical_alternative
  - marker: b
    text: 直译“义人的拯救”；也可译“义人的解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδέχθη
  choice: 所等候的
  rationale: προσδέχομαι在此可表示等候、期待，也可能带有迎接或欣然接受之意；结合上下文所盼望的拯救与审判，用“等候”自然地保留其前瞻意味。
- source_word: λαοῦ σου
  choice: 你的子民
  rationale: λαός指作为整体、与上帝有归属关系的人民；“你的子民”既保留对上帝的直接称呼，也符合庄重的现代汉语表达。
- source_word: σωτηρία
  choice: 蒙拯救
  rationale: σωτηρία可指拯救、解救或救恩。这里涉及历史处境中的搭救；“蒙拯救”清楚自然，同时不削弱其神学分量。
- source_word: δικαίων
  choice: 义人
  rationale: δικαίων是复数属格，直译为“义人的”；“义人”保留其道德与神学类别。
- source_word: ἐχθρῶν
  choice: 仇敌
  rationale: 希腊文只说“仇敌的”，未明说所属关系；译作“仇敌”避免擅自限定为“他们的仇敌”。
- source_word: ἀπωλία
  choice: 遭毁灭
  rationale: ἀπωλία表示毁灭、灭亡或败亡；“遭毁灭”与“蒙拯救”形成鲜明对照，符合本节审判语境。
- source_word: μὲν...δὲ
  choice: 一面是……另一面是……
  rationale: 这一结构明确并列而对照两种结局；汉语用“一面……另一面……”保留拯救与毁灭同时受期待的张力。
theological_decisions:
- issue: 是否保留拯救义人与毁灭仇敌这两种鲜明对立的结局
  choice: 将两者译为子民所等候之事的两个对照面向：义人蒙拯救，仇敌遭毁灭。
  alternative: 可译作“义人的解救和仇敌的败亡”，以较弱的词语表达。
  rationale: 希腊文以μὲν...δὲ明确对照σωτηρία与ἀπωλία。译文不淡化其中拯救与审判并存的神学张力。
- issue: δικαίων作为属格与σωτηρία的关系
  choice: 正文采用自然汉语“义人蒙拯救”。
  alternative: 较形式对应地译作“义人的拯救”。
  rationale: “义人的拯救”在现代汉语中可能被误解为义人施行的拯救；“义人蒙拯救”表达此处最自然的受益者关系，同时以脚注保留形式对应的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”保留经文中群体归属的语感；“蒙拯救／遭毁灭”构成平衡而鲜明的对照。
