base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/004.yaml
  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: zh_hans
  text: 因为那些人理当被剥夺光明，并被囚禁在黑暗中；他们曾把你的众子禁闭起来；那不朽的律法之光正要借着你的众子赐给世间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世间”也可译作“万世”或“永世”。希腊文为单数“时代／世”（αἰών），可侧重世界秩序，也可侧重延续的时间。
    reason: 保留τῷ αἰῶνι在宇宙性与时间性之间的语义广度，不在正文中将其完全限定为单一解释。
lexical_decisions:
- source_word: ἄξιοι
  choice: 理当
  rationale: 在审判语境中表达应得的刑罚；“理当被……”既保留道德裁断意味，也符合现代汉语习惯。
- source_word: στερηθῆναι φωτός
  choice: 被剥夺光明
  rationale: 保留被动形式及惩罚意味，并呼应黑暗之灾的语境。
- source_word: φυλακισθῆναι σκότει
  choice: 被囚禁在黑暗中
  rationale: φυλακίζω具有监禁、拘禁色彩；此译也显出压迫者遭受对等报应的反转。
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: 曾把……禁闭起来
  rationale: 兼顾κατάκλειστος的封闭状态与φυλάσσω的持续看守含义，以自然汉语表达拘禁。
- source_word: τοὺς υἱούς σου
  choice: 你的众子
  rationale: 保留υἱούς明确的阳性复数形式及以色列作为上帝众子的称谓；“众子”庄重且避免误解为某几个亲生儿子。
- source_word: διʼ ὧν
  choice: 借着这些人
  rationale: 最近的语法先行词是“你的众子”；补出“这些人”可在汉语中清楚保留人的指向和工具性。
- source_word: ἤμελλεν ... δίδοσθαι
  choice: 正要……赐给
  rationale: 表达从叙事时点看将要发生或命定发生之事，不额外限定其迫近程度。
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: 那不朽的律法之光
  rationale: “不朽”保留ἄφθαρτον不腐坏、不消逝的意义；“律法之光”维持νόμου修饰φῶς的自然关系。
- source_word: τῷ αἰῶνι
  choice: 给世代
  rationale: αἰών单数可有时代、永世或世界秩序的广度；正文采用较为开放的“世代”，脚注说明其时间与宇宙两方面的可能含义。
theological_decisions:
- issue: “你的众子”所指及传递律法之光的工具性
  choice: 理解为以色列；律法之光借着他们赐下
  alternative: διʼ ὧν也可能较宽泛地指“借着这些事件”
  rationale: διʼ ὧν在语法上最近且最自然的先行词是τοὺς υἱούς σου。译文明确保留这一人称指向，同时不进一步界定这种中介作用的具体方式。
- issue: αἰών的含义
  choice: 正文译作“世代”，保留时间跨度的开放性
  alternative: 可理解为“世界”或“直到永远”
  rationale: 该词既可指时代、长久时间，也可带世界秩序的意味。脚注保留这些可能，避免把含义限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“理当”“禁闭”“不朽的律法之光”保留审判和诗性意象；分号呈现前后报应关系。“世代”略具经文语体，但脚注帮助普通读者理解其语义范围。
