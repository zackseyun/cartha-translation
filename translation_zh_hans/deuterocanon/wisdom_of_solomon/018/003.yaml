base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
translation:
  language: zh_hans
  text: 与这些事相反，你赐下一根烈火熊熊的柱子，在陌生的旅途中作向导，又在他们光荣的异乡旅居[a]中作不伤人的太阳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光荣的异乡旅居”也可译作“尊贵的寄居”或“光荣的流寓”。希腊语φιλοτίμου ξενιτείας含义较难确定，可能强调以色列人在异乡生活所具有的尊荣，而不一定指纯粹负面的流放。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: 与这些事相反
  rationale: 该短语承接上文，表达对应性的强烈反差；这样译比生硬的“代替这些事”更符合现代汉语，同时不把所指限定得过窄。
- source_word: πυριφλεγῆ στῦλον
  choice: 一根烈火熊熊的柱子
  rationale: 保留στῦλος“柱子”的具体形象，并以“烈火熊熊”传达复合形容词所强调的炽烈燃烧景象。
- source_word: ὁδηγόν
  choice: 作向导
  rationale: 该词以同位方式说明火柱的功用；“作向导”自然地呈现引路含义。
- source_word: ἀγνώστου ὁδοιπορίας
  choice: 在陌生的旅途中
  rationale: ἀγνώστου可指未知或不熟悉；“陌生的旅途”保留这种开放性，也符合行旅语境。
- source_word: ἥλιον
  choice: 太阳
  rationale: 原文明确使用“太阳”，不宜弱化为泛指的“光”。
- source_word: ἀβλαβῆ
  choice: 不伤人的
  rationale: 以自然现代汉语表达“不造成伤害”，并保留它与降在埃及人身上的灾害之间的对照。
- source_word: φιλοτίμου ξενιτείας
  choice: 光荣的异乡旅居
  rationale: ξενιτεία指在异乡居住、寄居或流寓；φιλοτίμου赋予其尊荣、可贵的色彩。“光荣的异乡旅居”避免把它单向定为负面的“流放”。
- source_word: παρέσχες
  choice: 你赐下
  rationale: 动词表示供给、赐予；在对上帝的直接称呼中，“赐下”自然、庄重。
theological_decisions:
- issue: 火柱与太阳意象所承载的出埃及传统
  choice: 保留“柱子”和“太阳”的具体意象
  alternative: 概括译成“你赐光引导他们”
  rationale: 原文借具体意象唤起上帝在旷野引导百姓的叙事；抽象化会削弱经文互涉和神学张力。
- issue: ξενιτεία应理解为流放还是异乡寄居
  choice: 译为“异乡旅居”，并保留正面的修饰语
  alternative: 译为“光荣的流放”或“尊贵的寄居”
  rationale: 该词可涵盖寄居异乡、旅居或流寓，并不必然具有严格负面的“流放”含义；此处正面修饰语尤其要求保留这种语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留火柱、向导和太阳的具体意象。“不伤人的太阳”虽带有诗性，却清楚传达原文与毁灭性灾害相对的无害性质。
