base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: zh_hans
  text: 因为他们虽因巫术[a]对一切都不肯相信，但在长子遭毁灭时，便承认这百姓是上帝的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“法术”。这里的希腊词指与埃及有关的秘术。
    reason: lexical_alternative
  - marker: b
    text: 这里是把以色列民作为一个整体称为上帝的“儿子”，并非指某一个人。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: 不肯相信
  rationale: 该分词在语境中不只是表示疑惑，也含有拒绝接受灾祸所显明之事的意味；“不肯相信”自然地保留这种主动抗拒。
- source_word: φαρμακείας
  choice: 巫术
  rationale: 这里指与埃及有关的秘术或法术，并非药物用途；“巫术”在现代汉语中简明且符合语境。
- source_word: ὀλέθρῳ
  choice: 灭亡
  rationale: ἐπὶ τῷ 加与格表示事件发生的时机；“灭亡”保留灾难性毁灭的广义，没有增添原文未明说的方式。
- source_word: πρωτοτόκων
  choice: 头生者
  rationale: 原文有定冠词而无物主代词。“头生者”既保留原文措辞，也不擅自限定为“他们的长子”。
- source_word: ὡμολόγησαν
  choice: 承认
  rationale: 此处表示在事件迫使之下公开认可一个事实；“承认”比带有宗教告白色彩的译法更贴合叙事语境。
- source_word: θεοῦ υἱὸν
  choice: 上帝的儿子
  rationale: 原文以单数“儿子”描述作为整体的民，译文保留这种集体性儿子身份，而不改写为复数“儿女”。
- source_word: λαὸν
  choice: 这民
  rationale: λαός 指叙事中的以色列民；“这民”简洁保留其集合性，并与单数“儿子”构成原文有意保留的表达张力。
theological_decisions:
- issue: 以色列作为整体被称为上帝的儿子
  choice: 这民是上帝的儿子
  alternative: 这民是上帝的儿女／这民是上帝的一个儿子
  rationale: 希腊文以单数 υἱόν 配合表示集体的 λαόν，把全体人民作为一个整体称为上帝的儿子。译文不将其复数化，也不以“一位”之类措辞强化不定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不肯相信”表达持续抗拒；“这民”略带经文语体，以便保留 λαός 的集合性和单数“儿子”所形成的神学张力。句中以“虽然……但……”自然呈现先前不信与后来承认之间的让步关系。
