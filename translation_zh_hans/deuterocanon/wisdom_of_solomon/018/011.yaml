base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/011.yaml
  text: And servant and master alike were punished with the same judgment[a], and the commoner suffered the same things as the king.
translation:
  language: zh_hans
  text: 奴隶和主人一同受罚，所受的刑罚[a]相同；平民和君王所遭受的也一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑罚”所译的希腊语 δίκη 也可指“惩罚”“判决”或“公正的报应”。
    reason: 保留该词在具体刑罚、司法判决和报应性公正之间的语义幅度。
lexical_decisions:
- source_word: ὁμοία
  choice: 相同
  rationale: 本词本可表示“相似”或“同等”；这里与后半句 τὰ αὐτά（同样的事）相呼应，强调不同社会身份的人所受刑罚并无差别。
- source_word: δίκη
  choice: 刑罚
  rationale: 上下文所指是实际临到人的惩罚性后果，而非抽象的正义；“刑罚”既具体，也保留审判语境。
- source_word: δοῦλος
  choice: 奴隶
  rationale: δοῦλος 与 δεσπότης 构成明确的社会身份对比；译作“奴隶”比“仆人”更准确地体现其受支配身份。
- source_word: δεσπότῃ
  choice: 主人
  rationale: 与“奴隶”相对时，“主人”是现代汉语中最自然、准确的对应词；“主”在此容易产生不必要的神学联想。
- source_word: κολασθείς
  choice: 受罚
  rationale: 保留分词的被动惩罚含义，并以汉语并列句清楚表达奴隶与主人一同承受刑罚。
- source_word: δημότης
  choice: 平民
  rationale: 本节将普通社会身份与君王并列对照，“平民”能自然表达非王室、非统治者的普通人。
- source_word: βασιλεῖ
  choice: 君王
  rationale: βασιλεύς 的具体含义是王；“君王”语体庄重，并与“平民”形成鲜明对照。
- source_word: τὰ αὐτὰ πάσχων
  choice: 所遭受的也一样
  rationale: 忠实保留“遭受同样之事”的含义，同时避免在现代汉语中生硬直译为“遭受同样的事情”。
theological_decisions:
- issue: 审判对不同社会身份一视同仁
  choice: 保留“奴隶—主人”与“平民—君王”两组鲜明对比
  alternative: 将“奴隶”弱化为“仆人”，或将两组身份概括为“人人”
  rationale: 原文借具体社会阶层的两极对照，表达刑罚不因身份而异；保留这些称谓可呈现原文的社会现实和神学张力，而不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前后两组身份对比均予保留，并通过“相同”“也一样”再现原文的平行结构；分号使两小句关系清楚，又不把原文扩展为解释性陈述。
