  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/008.yaml
  text: For just as you punished the adversaries[a], so by this, having summoned us, you glorified us.
translation:
  language: zh_hans
  text: 因为你怎样惩罚敌对者，也照样召唤我们，借着这事使我们得荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召唤我们”也可译作“召来我们”或“邀请我们”；希腊语προκαλεσάμενος可能含有“召到自己这里”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτιμώρησας
  choice: 惩罚了
  rationale: τιμωρέω在此表示施行惩罚；“惩罚”自然明确，又不额外限定为报仇或雪恨。
- source_word: τοὺς ὑπεναντίους
  choice: 敌对者
  rationale: ὑπεναντίος指站在对立面、怀有敌意的人；“敌对者”保留其广度，不局限于军事意义上的敌人。
- source_word: τούτῳ
  choice: 借着这事
  rationale: 与格指回上文所述的行动，并带工具意味；“借着这事”比单说“因此”更明确地保留这种关系。
- source_word: προκαλεσάμενος
  choice: 召来我们
  rationale: προκαλέω的中间语态分词可表示召唤、召到自己这里或邀请；“召来”保留召唤方向的含义，却不把“归向你自己”明说得超过原文。
- source_word: ἐδόξασας
  choice: 使我们得了荣耀
  rationale: δοξάζω可指使人得荣耀或尊荣；此译保留其神学分量，也符合现代汉语表达。
theological_decisions:
- issue: 同一神圣行动对敌对者与“我们”产生的对照结果
  choice: 译为神惩罚敌对者，同时借着这事召来“我们”，使“我们”得荣耀。
  alternative: 可将προκαλεσάμενος较强地译作“把我们召到你自己这里”，或较弱地译作“召唤我们”。
  rationale: 原文把对敌对者的审判与赐给“我们”的荣耀并置。译文保留这种张力，并让中间语态可能含有的趋向性有所体现，但不把关系性含义绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……怎样……也照样……”重现ὡς γάρ引出的对应结构；句末脚注说明分词的词义幅度，避免在正文中消除原文的含混。
