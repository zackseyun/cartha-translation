base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/023.yaml
  text: For when heaps of dead had already fallen one upon another[a], he stood in the midst and checked the wrath, and cut off the way to the living.
translation:
  language: zh_hans
  text: 因为死人已经成堆地倒下，一个压在另一个上面；他站在中间，制止了烈怒，截断了通往活人的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: 成堆地
  rationale: 该副词表示“成堆、成垛”，与后面的倒下和彼此叠压连用，保留尸体堆积的鲜明图景。
- source_word: ἤδη πεπτωκότων
  choice: 已经……倒下
  rationale: 完成时分词表达先前已经发生并形成现状的动作；“已经倒下”自然保留这一时态意味。
- source_word: ἐπʼ ἀλλήλων
  choice: 彼此叠压
  rationale: 表达死者一个压在另一个之上的状态；“彼此叠压”比直译“在彼此之上”更符合现代汉语，同时保留具体画面。
- source_word: μεταξὺ στὰς
  choice: 他站在中间
  rationale: 表示站到两方之间；此处两方从语境看是死人和活人。译文不把这种解释直接扩写进正文。
- source_word: ἀνέκοψεν
  choice: 制止了
  rationale: 该动词有拦阻、遏止之意；“制止”清楚表达烈怒被阻住。
- source_word: τὴν ὀργήν
  choice: 烈怒
  rationale: 此处指带来惩罚与死亡的神圣震怒；“烈怒”兼具庄重感和现代可读性，又不额外补明主体。
- source_word: διέσχισεν
  choice: 截断了
  rationale: 原词本义涉及劈开、切断；在这里指阻断烈怒继续蔓延的路径，“截断”既保留形象，也符合语境。
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: 烈怒通向活人的道路
  rationale: 原文直译为“通向活人的道路”，所属关系由前句的“烈怒”自然承接。汉语补出“烈怒”可避免误读，同时保留道路这一隐喻。
theological_decisions:
- issue: 省略主语所指的人物
  choice: 正文保留“他”，不补出姓名
  alternative: 译作“亚伦”
  rationale: 希腊文只以动词形式隐含主语，具体人物可由上下文得知；不在本节补名，更忠实地保留原文表达。
- issue: ὀργή的性质
  choice: 译作“烈怒”
  alternative: 译作“愤怒”或直接解释为“上帝的惩罚”
  rationale: 上下文中的ὀργή具有神圣审判的分量，但原文此处没有明说“上帝的”；“烈怒”保留其神学重量，又不作过度解释。
- issue: 道路隐喻的施事者
  choice: 以“烈怒通向活人的道路”明确语法关系
  alternative: 仅译“通向活人的道路”
  rationale: 希腊文以定冠词短语承接前述烈怒；汉语若完全省略容易使“道路”与“他”发生误连。补出已出现的“烈怒”属于必要的语法明晰化，并未增添新的神学信息。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“死人”“活人”直接保留原文对照；分号呈现属格独立结构与主句之间的推进关系。未设置脚注，因为可在正文中自然保留关键意象和语义关系。
