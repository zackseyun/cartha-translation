base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: zh_hans
  text: 毁灭者向这人[a]退让，也惧怕这些事物[b]；因为仅仅经历一次烈怒[c]，就已经足够了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭者”也可理解为“施行毁灭的天使”，但希腊文没有明说“天使”。
    reason: alternative_reading
  - marker: b
    text: “这些事物”可能指上一节所说祭司礼服上的象征和纪念标记。希腊文在这里十分凝练，而且“惧怕”的动词是复数形式，句法关系并不明确；正文按上下文译出其大意。
    reason: textual_grammar
  - marker: c
    text: “经历”也可译作“试验”“验证”或“体验”；原文短语也可理解为“仅仅一次对烈怒的验证”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: 这人
  rationale: 阳性单数指示代词承接上文那位身着祭司礼服的人；译作“这人”既明确其人物所指，也不额外加入身份称谓。
- source_word: εἶξεν
  choice: 退让
  rationale: 该动词表示让步、退却或让出地位；“退让”自然保留毁灭者受到遏止的画面，却不解释其具体方式。
- source_word: ὀλοθρεύων
  choice: 毁灭者
  rationale: 这是名词化的现在分词，直译为“正在施行毁灭的那一位”；“毁灭者”简洁庄重，又不把原文未明说的“天使”加入正文。
- source_word: ταῦτα
  choice: 这些事物
  rationale: 中性复数指示代词所指含蓄，可能承接上一节祭司服饰上的象征和纪念标记；译文保留其宽泛指称。
- source_word: ἐφοβήθησαν
  choice: 惧怕
  rationale: 词形是复数，但本句结构高度压缩，且上下文把反应归于毁灭者；正文依语境译出“也惧怕”，脚注说明原文语法上的含混，不强行把它化为毫无疑义的单数结构。
- source_word: πεῖρα
  choice: 经历一次
  rationale: πεῖρα可指试验、体验、经历或验证；此处表达烈怒一经显露便已足够。“经历一次”符合现代汉语，同时保留一次实际领受或验证的意味。
- source_word: ὀργῆς
  choice: 烈怒
  rationale: 在神圣审判语境中，“烈怒”比一般的“愤怒”更能表达其严厉性，但不额外界定其神学机制。
- source_word: ἱκανή
  choice: 足够
  rationale: 准确表达“充分、足以”的谓语意义，且在现代汉语中自然清楚。
theological_decisions:
- issue: ὀλοθρεύων的身份
  choice: 毁灭者
  alternative: 施行毁灭的天使
  rationale: 上下文可使人联想到执行灾祸或审判的使者，但希腊文只说“施行毁灭者”；正文不补入“天使”，以免把传统解释写成明文。
- issue: ταῦτα所指为何
  choice: 这些事物
  alternative: 上一节所述祭司礼服上的象征和纪念标记
  rationale: 所指很可能来自上一节，却没有在本节重新明说；保留指示语的开放性，避免在正文中替原文作唯一判定。
- issue: ἐφοβήθησαν的复数形式与句法关系
  choice: 按上下文译为毁灭者“也惧怕这些事物”
  alternative: 按词形直译为“这些事物却害怕了”或理解为省略了复数主语
  rationale: 现存所给希腊文本的动词为第三人称复数，若把ταῦτα看作主语会得到语义突兀的“这些事物害怕了”；若视作宾语，又缺少明确的复数主语。正文采用与上下文连贯的传统句义，同时用脚注公开保留语法疑难。
- issue: πεῖρα τῆς ὀργῆς的关系
  choice: 经历一次烈怒
  alternative: 对烈怒的试验／烈怒的一次验证
  rationale: 希腊语短语凝练，可表示试验、体验或经验证实；正文不把它解释成特定教义概念，只表达烈怒一次显现或被经历便已足够。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“退让”“惧怕”“烈怒”保持审判场景的力度；对原文中毁灭者的身份、指示代词的所指以及复数动词造成的句法含混，均不在正文中作过度解释，而以脚注如实说明。
