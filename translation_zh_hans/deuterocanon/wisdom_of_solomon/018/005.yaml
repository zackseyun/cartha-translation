base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: zh_hans
  text: 他们图谋杀害圣民的婴孩时，有一个孩子被弃置而获救[a]；以此责备他们，你夺去了他们众多的儿女，并使他们一同灭亡在猛烈的水中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个孩子”很可能暗指摩西；他曾被放在河边，后来蒙保全（出2:3–10）。
    reason: cross_reference
  - marker: b
    text: “猛烈的水”也可译作“汹涌的水”或“狂暴的水”；原文指海水成为毁灭他们的媒介。
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  choice: 图谋
  rationale: 该分词表达经过商议而形成的蓄意计划；“图谋”简洁自然，并保留其主观故意。
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: 圣民的婴孩
  rationale: ὅσιοι在此指属于上帝、向他忠诚的群体；“圣民”比“圣徒”更少带后世宗派色彩。νήπια指年幼的孩子，译作“婴孩”。
- source_word: ἑνὸς ... τέκνου
  choice: 一个孩子
  rationale: τέκνον本身不指明性别；“孩子”保留原文范围，也适合其对摩西事件的含蓄指涉。
- source_word: ἐκτεθέντος
  choice: 被弃置
  rationale: 该词指把婴孩放置在外、予以遗弃；“被弃置”既传达具体动作，也不加入原文未明说的细节。
- source_word: σωθέντος
  choice: 得以获救
  rationale: 这里强调孩子从生命危险中被保全；“获救”符合叙事情境，又不必赋予该词额外的系统神学含义。
- source_word: εἰς ἔλεγχον
  choice: 为了谴责他们
  rationale: ἔλεγχος含揭露过错、责备或惩戒之意；此译保留审判性的道德力度，同时不把它收窄为单纯报复。
- source_word: ἀφεῖλον
  choice: 你夺去了
  rationale: 该动词表示取走、除去；“夺去”在此清楚表达埃及众多儿女被取去生命的严厉审判。
- source_word: πλῆθος τέκνων
  choice: 他们众多的儿女
  rationale: πλῆθος突出数目众多；此译保留“一个孩子”与“众多儿女”之间的修辞对照。
- source_word: ὁμοθυμαδόν
  choice: 一同
  rationale: 在本句中，该副词强调众人共同、同时遭灭亡；“一同”简洁而自然。
- source_word: ἐν ὕδατι σφοδρῷ
  choice: 在汹涌的水中
  rationale: σφοδρός表示强烈、猛烈或狂暴；“汹涌”贴合海水作为毁灭媒介的语境，并保留原文集合单数“水”。
theological_decisions:
- issue: “一个孩子被弃置，却得以获救”所指为何
  choice: 正文维持不具名的“一个孩子”，脚注指出这很可能暗指摩西
  alternative: 直接在正文中说明是摩西，或理解为泛指一名获救的以色列孩子
  rationale: 措辞强烈呼应《出埃及记》2:3–10，但希腊文没有写出摩西的名字。正文保留原文的含蓄，脚注提供最可能的互文背景。
- issue: ὅσιοι的群体身份
  choice: 圣民
  alternative: 圣徒；虔敬者；忠信的人
  rationale: 此处所指是上帝分别为圣的百姓。“圣民”能表达群体身份，又避免“圣徒”可能引起的后世技术性或宗派性联想。
- issue: 埃及儿女遭毁灭的审判性表达
  choice: 为了谴责他们，你夺去了他们众多的儿女
  alternative: 作为责罚，你除灭了他们许多孩子
  rationale: 译文保留原文将埃及谋害圣民婴孩与自身儿女被夺去并置的审判张力，不弱化其严厉性，也不另加超出文本的辩护。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和句号理清希腊文较长的句法结构；用“一个孩子”与“众多的儿女”保留原文对照。脚注标记按实际说明对象分别置于“获救”和“水中”之后。
