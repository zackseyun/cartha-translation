base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: zh_hans
  text: 众人都同受一个死亡判决[b]，死者多得数不清；活着的人甚至不足以埋葬他们，因为就在一瞬间，他们更受珍视的子嗣[a]被毁灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 上下文暗指他们的头生子；但希腊文更直译为“他们更受珍视的子嗣（或一代）”。
    reason: 保留出埃及记背景所暗示的对象与本节实际措辞之间的差别。
  - marker: b
    text: “同一个死亡判决”原文直译近于“归于死亡的同一名目”，也可理解为“同一种死亡”。
    reason: 说明希腊文罕见短语的字面形式及其未决的含义。
lexical_decisions:
- source_word: ὁμοθυμαδόν
  choice: 一同
  rationale: 在此强调众人共同、同时陷入同一灾祸，而不是经过商议后“同心一致”；“一同”简洁保留其集体性。
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: 承受同一个死亡判决
  rationale: 原文直译近于“在死亡的一个名下”，含义并不完全透明；结合语境，表达众人同受一个死亡定命。“死亡判决”自然且保留灾难所带的裁决意味，另以脚注说明字面形式。
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: 死者多得数不清
  rationale: 传达死亡人数无法计数的惨重情形，比直译“有数不清的死人”更符合现代汉语庄重叙述。
- source_word: οἱ ζῶντες
  choice: 活着的人
  rationale: 直接保留生者与死者的对照，不把他们进一步解释为“幸存者”。
- source_word: πρὸς μίαν ῥοπήν
  choice: 就在一瞬间
  rationale: 体现事件发生得极其突然；“就在”加强原句所强调的骤然性而不增添事件内容。
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: 他们更受珍视的后代
  rationale: γένεσις在此指后代或子嗣，ἐντιμοτέρα表示更受尊重、更为宝贵。上下文指向头生子，但原句没有使用明确表示“头生”的词，因此正文保留较宽的措辞。
- source_word: διεφθάρη
  choice: 被毁灭了
  rationale: 保持希腊文被动形式，并传达审判语境中彻底丧亡的强烈语气。
theological_decisions:
- issue: 是否在正文中把“更受珍视的后代”明确译为“头生子”
  choice: 他们更受珍视的后代
  alternative: 他们的头生子
  rationale: 出埃及灾祸的上下文清楚暗指埃及的头生子，但本节希腊文用的是ἐντιμοτέρα γένεσις，并非明确的“头生”一词。正文保留原文的描述性和一定歧义，脚注交代其语境所指。
- issue: 是否把ἐν ἑνὶ ὀνόματι θανάτου解释为司法性的判决
  choice: 同一个死亡判决
  alternative: 死亡的同一个名目／同一种死亡
  rationale: 该短语字面特殊，可能表示共同的死亡定命或同一种死亡。正文采用在汉语中可理解且符合上下文的“死亡判决”，但脚注明示字面形式及另一种理解，避免把解释伪装成毫无歧义的原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文先述死者无数、继而说明生者无力埋葬、最后追溯骤然灾祸的推进。为使脚注紧邻所释内容，[a]置于“后代”之后；[b]虽位于句末，但说明前半句较难直译的死亡短语。
