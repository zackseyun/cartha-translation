base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: zh_hans
  text: 那一夜曾预先向我们的先祖显明，使他们确知自己所信赖的誓言，从而受到鼓舞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη ἡ νύξ
  choice: 那一夜
  rationale: 自然保留指示语的回指作用，不额外加强语气。
- source_word: προεγνώσθη
  choice: 预先启示给了
  rationale: 该被动动词字面也可指“预先知道”，但结合与格“给我们的先祖”和上下文，更可能表示那一夜预先向他们显明。
- source_word: πατράσιν ἡμῶν
  choice: 我们的先祖
  rationale: 这里指以色列的列祖；“先祖”在现代汉语中自然、庄重，并能表达群体祖先之意。
- source_word: ἀσφαλῶς εἰδότες
  choice: 确知
  rationale: 简洁表达确定无疑地知道、确信之意。
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: 自己所信赖的誓言
  rationale: 保留“誓言”的直接词义和将信赖置于其中的关系，不擅自明确誓言的发出者或具体内容。
- source_word: ἐπευθυμήσωσιν
  choice: 振作起来
  rationale: 表达因确信而受到鼓舞、重新得力；比单纯“高兴”更符合语境。
theological_decisions:
- issue: “誓言”的所指
  choice: 保留为“誓言”，不在正文中明说是上帝的誓言
  alternative: 译作“上帝起誓所作的应许”
  rationale: 上下文很可能指上帝向列祖所作的庄严应许，但本节本身没有明说发誓者；直译可保留原文的含蓄。
- issue: προεγνώσθη的语态和含义
  choice: 理解为那一夜预先向先祖启示
  alternative: 理解为先祖预先知道那一夜
  rationale: 被动形式本身容许较字面的“被预知”，但句法和救赎叙事语境较支持“预先被告知”；以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“先祖”比“父辈”更准确地指向以色列列祖；“振作起来”自然传达受到鼓舞、鼓起勇气的含义。
