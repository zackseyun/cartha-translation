base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: zh_hans
  text: 因为一位无可指摘的人急忙上前，在最前线奋战；他带着自己职事的武器——祷告和借着焚香所作的赎罪[a]，抵挡烈怒，终止灾祸，表明自己是你的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪”也可译作“除罪”或“平息”。希腊词ἐξιλασμός在祭礼语境中可涵盖这些彼此相关的意思。
    reason: lexical_alternative
  - marker: b
    text: “仆人”所译的希腊词θεράπων也可指在尊贵身份中服事的侍从或服事者。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: 急忙上前
  rationale: 表达不定过去时分词所带出的迅速、紧迫行动，并与随后介入灾祸的语境自然衔接。
- source_word: ἀνὴρ ἄμεμπτος
  choice: 一个无可指摘的人
  rationale: 保留阳性单数及ἄμεμπτος“不能受责”的分量；现代汉语庄重而清楚。
- source_word: προεμάχησεν
  choice: 奋战在最前线
  rationale: 保留动词的军事意象及“在前方作战”的空间含义，不弱化为一般性的帮助或辩护。
- source_word: τὸ τῆς ἰδίας λειτουργίας ὅπλον
  choice: 自己职事的武器
  rationale: “职事”体现λειτουργία在本节祭司礼仪语境中的正式服事含义；“武器”保留ὅπλον与前线奋战相呼应的比喻。
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: 祷告和借焚香所行的赎罪
  rationale: 将两个并列项目明确呈现为职事的“武器”；“借焚香所行的赎罪”保留θυμιάματος与ἐξιλασμός之间的礼仪关联，同时避免把机制解释得过细。
- source_word: ἀντέστη τῷ θυμῷ
  choice: 抵挡烈怒
  rationale: “抵挡”体现强有力的对抗；不补出“上帝的”，因为希腊文仅以定冠词使该烈怒成为特指，所指对象由语境判定。
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: 终止灾祸
  rationale: 自然表达“给灾祸设下终点”的意思，简洁保留灾难被遏止的结果。
- source_word: θεράπων
  choice: 仆人
  rationale: 在现代中文圣经语体中自然且庄重，可表达忠诚服事者；脚注提示该词也可含受尊重的侍从意味。
theological_decisions:
- issue: ἐξιλασμός在祭礼语境中的性质
  choice: 赎罪
  alternative: 除罪；平息
  rationale: “赎罪”兼顾可读性与祭礼分量，又不把该词限定为某一种后世关于赎罪机制的理论；相关语义可能包括除去罪污或平息烈怒。
- issue: θυμός所指的烈怒
  choice: 不明说是谁的烈怒
  alternative: 上帝的烈怒
  rationale: 上下文可使读者理解为神施行审判的烈怒，但原文没有在此明说所属，正文不予增补，以保留原文的含蓄。
- issue: θεράπων的身份色彩
  choice: 仆人
  alternative: 侍从；服事者
  rationale: “仆人”最符合现代中文的自然庄重表达，但不将其等同于强调奴隶身份的δοῦλος；脚注保留其尊贵侍奉的语感。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的中文。以“奋战在最前线—职事的武器—抵挡烈怒”贯穿原文的军事比喻；“职事、焚香、赎罪”保留祭司礼仪色彩。脚注标记均置于相应词语之后。
