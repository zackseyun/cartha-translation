  text: and at the time of their visitation they will shine forth[a], and they will run about like sparks through stubble[b];
translation:
  language: zh_hans
  text: 在上帝临到他们的时候，他们必焕发光辉[a]，像火星穿过干茬飞窜[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝临到他们的时候”也可译作“他们受察看的时候”或“他们受眷顾的时候”。希腊文可指上帝的临到、察看或鉴察，也可包含审判或伸冤的意味。
    reason: lexical_alternative
  - marker: b
    text: “干茬”也可译作“干稻草”或“芦苇”；希腊文描绘火星在易燃的干燥植物间迅速窜行。
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: 时候
  rationale: καιρός指合宜或特定的时刻；“时候”自然简明，并保留这一时刻具有决定性的语感。
- source_word: ἐπισκοπῆς
  choice: 受眷顾
  rationale: ἐπισκοπή可指察看、鉴察或临到，语境中涉及上帝对义人的介入与伸冤；“受眷顾”适合现代汉语，同时由脚注保留审察、判断等词义范围。
- source_word: ἀναλάμψουσιν
  choice: 必焕发光辉
  rationale: 该动词表示突然或鲜明地发亮；“焕发光辉”既传达明亮显现，也符合庄重的现代汉语表达。
- source_word: σπινθῆρες
  choice: 火星
  rationale: σπινθήρ的基本意象是迸散的小火星；“火星”准确、通俗，并与下文可燃的干茬相配。
- source_word: καλάμῃ
  choice: 干茬
  rationale: καλάμη在此可指收割后留下的秸秆、残茬，也可能使人想到干草或芦苇；“干茬”突出火焰迅速蔓延所需的易燃意象。
- source_word: διαδραμοῦνται
  choice: 飞窜
  rationale: 该动词描写迅速穿行或奔走；“飞窜”凝练地表现火星穿过干燥植物、疾速扩散的动态画面。
theological_decisions:
- issue: “他们受眷顾的时候”的含义
  choice: 正文用“受眷顾”，指上帝临到并介入义人的处境，但不在正文中限定其方式
  alternative: “他们受鉴察的时候”或“上帝来为他们伸冤的时候”
  rationale: 上下文偏向义人最终得到昭雪，但ἐπισκοπή本身也可含察看、审察和判断之意。正文采用较自然且符合语境的“受眷顾”，脚注同时保存原词的司法性与开放性，避免把神学张力完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“到了……的时候”自然承接上文；“焕发光辉”保留显明发亮的意象，“飞窜”则再现火星疾速穿行的动态。正文与两个脚注标记[a]、[b]完全对应。
