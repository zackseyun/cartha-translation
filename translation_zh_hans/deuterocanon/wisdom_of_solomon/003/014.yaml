base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/014.yaml
  text: And the eunuch who has not worked lawlessness with his hand, nor conceived evil things against the Lord, will be given the chosen grace of faith and a more delightful inheritance in the temple of the Lord.
translation:
  language: zh_hans
  text: 那没有亲手行不法之事，也没有心怀恶念敌对主的阉人，必蒙赐信心的上好恩惠[a]，并在主的圣殿中得到更可喜的份额[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心的上好恩惠”也可译作“信心的精选恩赐”“忠信所得的上好恩惠”或“信靠的至佳恩惠”。希腊语短语十分凝练，“恩惠”和“信心”各自的含义以及二者的关系均可有不同理解。
    reason: 保留τῆς πίστεως χάρις ἐκλεκτή的词义与语法歧义。
  - marker: b
    text: “更可喜的份额”也可译作“更令人喜悦的产业”或“更合意的所得之分”。
    reason: 保留κλῆρος与θυμηρέστερος在“份额／产业”及“可喜／合意”之间的词义幅度。
lexical_decisions:
- source_word: εὐνοῦχος
  choice: 阉人
  rationale: 原词明确指被阉割的男子；不用“太监”或“宦官”，以免附加宫廷官职的含义。
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: 没有亲手行不法之事
  rationale: “亲手”保留ἐν χειρί具体的身体意象；“行不法之事”自然表达ἐργάζομαι与ἀνόμημα的行动及道德—律法含义。
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: 也没有心怀恶念敌对主
  rationale: “心怀”表现内在思量，“敌对主”保留κατά所表达的针对、对抗方向。
- source_word: δοθήσεται γὰρ αὐτῷ
  choice: 必蒙赐
  rationale: 表达将来被动，并用“蒙赐”自然呈现受惠者的语气；γάρ在单节中文中不硬译为“因为”，以免形成无前文支撑的突兀连接。
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: 信心的上好恩惠
  rationale: 保留πίστις与χάρις的信心—恩惠措辞；“上好”表达ἐκλεκτή在此可有“精选、优美、上乘”的含义，同时以脚注保留紧缩属格结构的多种理解。
- source_word: κλῆρος
  choice: 份额
  rationale: 原词指抽签所得或获分配的一份；“份额”较“产业”少作继承解释，能保留其分得之份的基本意象。
- source_word: ἐν ναῷ Κυρίου
  choice: 在主的圣殿中
  rationale: ναός指殿宇或圣所；“圣殿”是现代中文宗教语境中清楚而庄重的对应。
- source_word: θυμηρέστερος
  choice: 更可喜
  rationale: 保留比较级所表达的更加令人喜悦、称心或可取之意。
theological_decisions:
- issue: τῆς πίστεως χάρις ἐκλεκτή中πίστις及属格关系的理解
  choice: 信心的上好恩惠
  alternative: 忠信所得的上好恩惠；使人有信心的上好恩赐；信靠的精选恩惠
  rationale: 希腊语短语高度凝练，πίστις可指信心、信靠或忠信，属格也可有不同关系。正文采用不作过度解释的“信心的……恩惠”，并在脚注列出主要可能性。
- issue: κύριος的译法
  choice: 主
  alternative: 上主；主人
  rationale: 此处作为对神的称呼，“主”最简明、通行，也不额外引入特定宗派格式。
- issue: κλῆρος在末世赏赐语境中的理解
  choice: 份额
  alternative: 产业；福分；所得之分
  rationale: “份额”保存抽签、分配所得之份的词义，不把它单一定义为法律继承意义上的产业。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“阉人”准确指称原文对象，避免“太监／宦官”的宫廷职务联想；正文保持外在行为与内在意念的对称，并将紧缩而多义的赏赐短语留给脚注说明。
