base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: zh_hans
  text: 因为轻看智慧和教导[a]的人实在可悲；他们的盼望虚空，劳苦愚妄，所做的事毫无用处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“管教”或“训练”；希腊词 παιδεία 兼有教育培养和纠正管束的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν
  choice: 智慧
  rationale: 在智慧文学中指兼具道德与理性的真智慧；“智慧”是准确而自然的常用译法。
- source_word: παιδείαν
  choice: 教导
  rationale: 该词涵盖教育、训练和纠正管教；正文用“教导”保持宽泛易懂，并以脚注保留“管教”的可能。
- source_word: ὁ ἐξουδενῶν
  choice: 轻看……的人
  rationale: 表达把某事视为无足轻重、加以蔑视；“轻看”自然庄重，并保留主动拒斥的意味。
- source_word: ταλαίπωρος
  choice: 实在可悲
  rationale: 表示处境悲惨、令人怜悯；“可悲”比“困苦”更能表达此处对其状态的评断，“实在”体现谓语强调。
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: 他们的盼望虚空
  rationale: κενή直指空洞、落空；“虚空”保留形象与智慧文学语体。
- source_word: οἱ κόποι ἀνόητοι
  choice: 劳苦愚妄
  rationale: κόποι是辛劳、劳苦，ἀνόητοι是缺乏明悟、愚妄；直译其判断，不将其与下一分句的“无用”合并。
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: 所做的事毫无用处
  rationale: ἄχρηστα意为无用、不能带来益处；此译清楚自然，并与前句“劳苦愚妄”保持语义区别。
theological_decisions:
- issue: 前半句单数主体与后半句复数代词的转换
  choice: 保留“……的人”这一代表性单数，随后照原文转为“他们的”。
  alternative: 全句统一为复数：“轻看……的人都……；他们……”；或统一为单数：“他的盼望……”
  rationale: 希腊文由单数分词ὁ ἐξουδενῶν转为复数αὐτῶν，显然把该单数人物视为一类人的代表。中文保留这一转换，既忠于原文，也不强行消除其数的张力。
- issue: κόποι ἀνόητοι的含义
  choice: 译为“劳苦愚妄”。
  alternative: 译为“劳苦徒然”或“劳苦无益”。
  rationale: ἀνόητοι本义侧重无知、缺乏理解、愚妄，而不是直接表示无利或无效；后一意义已由ἄχρηστα表达，因此保留两种评断之间的区别。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“轻看”比“藐视”稍自然，却仍保留蔑视和拒斥之意；“盼望虚空、劳苦愚妄”保留原文简洁并列的智慧文学节奏。
