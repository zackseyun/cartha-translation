base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: zh_hans
  text: 那些信靠他的人必明白真理；忠信的人必在爱中留在他身边[a]，因为恩典和怜悯归于他所拣选的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必在爱中等候他。”这个希腊语动词既可表示继续留在某人身边，也可表示期待地等候某人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的选民。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: 那些信靠他的人
  rationale: 完成时分词表达因已经信靠而持续处于信赖中的状态；现代汉语用“信靠”即可自然涵盖这种稳定、延续的信赖。
- source_word: συνήσουσιν ἀλήθειαν
  choice: 必明白真理
  rationale: 直译其将来意义；ἀλήθειαν没有冠词，译作“真理”而不额外限定。
- source_word: οἱ πιστοὶ
  choice: 忠信的人
  rationale: 此处更自然地指持守忠信的人，与前句“信靠他的人”平行；避免将其收窄为单纯的认知性相信。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 保留希腊语的凝练表达，不擅自判定这是他们对上帝的爱、上帝对他们的爱，还是爱所构成的关系领域。
- source_word: προσμενοῦσιν αὐτῷ
  choice: 必与他同在
  rationale: προσμένω可指继续留在某人身边，也可指等候某人；正文采用符合上下文中义人最终与上帝相交的“与他同在”，并以脚注保留“等候他”的可能。
- source_word: χάρις καὶ ἔλεος
  choice: 恩典和怜悯
  rationale: 采用现代汉语中清楚、庄重且通行的对应词，保留两个词各自的分量。
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: 临到他所拣选的人
  rationale: 与格表示恩典和怜悯归于或临到这些人；“他所拣选的人”明确保留上帝拣选的含义，同时避免术语化过强。
theological_decisions:
- issue: πιστοὶ强调相信还是忠信
  choice: 忠信的人
  alternative: 信他的人／信徒
  rationale: 智慧文学语境与上下句的平行更支持坚定忠诚的品格含义；译文不将其限定为后来的群体称谓。
- issue: προσμενοῦσιν αὐτῷ的语义
  choice: 必与他同在
  alternative: 必等候他
  rationale: 本段论义人的归宿，“与他同在”较能表达持续留在上帝身边；但动词也可表示期待地等候，因此脚注保留该歧义。
- issue: ἐν ἀγάπῃ所指的爱
  choice: 在爱中
  alternative: 以爱忠于他／在他的爱中
  rationale: 原文未明说爱的主体或所属，故采用开放表达，不替文本解决其神学张力。
- issue: ἐκλεκτοῖς的表达
  choice: 他所拣选的人
  alternative: 他的选民
  rationale: 前者清楚表达被上帝拣选，却较少带入后世系统神学或固定群体称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”承接希腊语将来时在此处的确定语气；分号呈现两组平行陈述。所有代词均保持原文的男性单数指称，不在正文中补出“上帝”，以免超出本节措辞。
