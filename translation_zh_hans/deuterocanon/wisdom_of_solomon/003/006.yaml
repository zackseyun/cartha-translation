  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/006.yaml
  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: zh_hans
  text: 他试炼他们，如同在熔炉中试炼金子[a]；他接纳他们，如同接纳全燔祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “熔炉”或译“坩埚”；希腊语可指熔炼、精炼金属的器具或场所。
    reason: lexical_alternative
  - marker: b
    text: “全燔祭”指全部焚烧献上的祭物；也可译“燔祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς χρυσὸν ἐν χωνευτηρίῳ
  choice: 如同在熔炉中试炼金子
  rationale: ὡς引出比喻；χωνευτήριον指熔炼或精炼金属的器具或场所。“熔炉”自然保留炼金意象，另以脚注说明“坩埚”这一可能译法。
- source_word: ἐδοκίμασεν
  choice: 试炼
  rationale: δοκιμάζω在炼金比喻中指检验以证实真伪或品质。“试炼”既保留检验意味，也符合本段庄重语境，而不擅自限定为净化。
- source_word: αὐτούς
  choice: 他们
  rationale: 指向上下文中的义人，按原文保留代词。
- source_word: ὁλοκάρπωμα θυσίας
  choice: 全燔祭
  rationale: ὁλοκάρπωμα表示全部焚烧的祭物，θυσίας进一步标明献祭范畴。“全燔祭”简洁而具体，也避免生硬重复为“祭祀的全燔祭”。
- source_word: προσεδέξατο
  choice: 接纳
  rationale: 该动词表示欣然接受；献祭语境中“接纳”既自然，也保留蒙悦纳的含义，不额外加入原文没有明说的评价用语。
theological_decisions:
- issue: ὁλοκάρπωμα θυσίας的祭祀意象
  choice: 全燔祭
  alternative: 燔祭；完全焚烧的祭物
  rationale: 保留祭物完全焚烧的特性及上帝悦纳义人的比喻，同时不把该意象解释成特定赎罪理论。
- issue: 第二分句中比较结构的汉语表达
  choice: 他接纳他们，如同接纳全燔祭
  alternative: 他把他们当作全燔祭而接纳
  rationale: 补出汉语理解所需的第二个“接纳”，清楚表明这是比较，不将义人与祭物直接等同，从而保留ὡς所表达的比喻张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“试炼”呼应炼金检验的语境；两分句保持平行结构。所有脚注标记均置于对应词语之后。
