  text: They will judge nations and rule over peoples[c][b][a], and the Lord will reign over them forever.
translation:
  language: zh_hans
  text: 他们必审判列国，统治万民[a]；主必永远作王统治他们[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统治”也可译作“掌管”或“胜过”；希腊文动词可表示行使权力或取得优势。
    reason: lexical_alternative
  - marker: b
    text: “永远”也可较直译为“直到万世”；希腊文直指历世长存。
    reason: lexical_alternative
  - marker: c
    text: “他们”按上下文很可能指义人，也可能较广地指本节刚提到的列国和万民。
    reason: alternative_reading
lexical_decisions:
- source_word: κρινοῦσιν
  choice: 必审判
  rationale: 保留κρίνω的司法含义；在智慧文学和末世语境中也可兼含治理之意，但不在正文中将其窄化为单纯治理。
- source_word: ἔθνη
  choice: 列国
  rationale: 准确表达ἔθνη的复数群体含义，并与后面的λαῶν有所区分；避免译作“外邦人”而引入原句未明说的犹太人与外邦人对立。
- source_word: κρατήσουσι
  choice: 统治
  rationale: κρατέω接属格λαῶν，在此最自然地表示对众民行使权柄；“统治”既符合上下文的权柄意象，也保留其支配含义。
- source_word: λαῶν
  choice: 万民
  rationale: 用“万民”自然表达多个民族群体，同时维持与“列国”的平行和词汇差别。
- source_word: βασιλεύσει
  choice: 必作王统治
  rationale: βασιλεύω明确带有君王掌权的含义；“作王统治”比单说“统治”更充分保留其王权色彩。
- source_word: αὐτῶν
  choice: 他们
  rationale: 保留希腊文代词而不在正文中明确限定所指，使其既可按上下文主要指义人，也容许读者理解为刚提到的列国和万民。
- source_word: Κύριος
  choice: 主
  rationale: 作为对上帝的称号，现代汉语圣经语体中自然译为“主”。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是现代汉语中自然、庄重的恒久表达；其较直译的“直到万世”置于脚注说明。
theological_decisions:
- issue: αὐτῶν（“他们”）的所指
  choice: 正文保留未明确界定的代词“他们”，按近处上下文可主要指义人。
  alternative: 也可理解为本节刚提到的列国和万民。
  rationale: 希腊文代词本身未消除这种指代张力；正文不擅自补成“义人”或“万民”，脚注交代两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列国／万民”保留希腊文ἔθνη／λαῶν的平行差别；“作王统治”保留βασιλεύω的王权意味。所有脚注标记均置于正文相应位置。
