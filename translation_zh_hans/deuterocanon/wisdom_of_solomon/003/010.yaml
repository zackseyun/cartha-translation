  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/010.yaml
  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
translation:
  language: zh_hans
  text: 他们不顾念那义人[b]，又背离主；但不敬虔的人必按他们所思量的[a]受惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所思量的”也可译作“所想的”或“所图谋的”。希腊文强调，他们所受的惩罚与他们自己的思量和谋划相称。
    reason: lexical_alternative
  - marker: b
    text: “那义人”也可译作“那位正义的人”。原文为阳性单数；按本书上下文，很可能指具有代表性的义人。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 兼顾该词对上帝缺乏敬畏的宗教含义及其道德意味，也符合现代中文表达。
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: 按自己所盘算的
  rationale: κατά引出惩罚与其先前思量之间的对应关系；“盘算”保留λογίζομαι的思考、谋划意味，同时不把它限死为阴谋。
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: 必……受惩罚
  rationale: ἐπιτιμία在此指处罚或刑罚；中文以“受惩罚”自然表达ἔχω加宾语的结果含义。
- source_word: ἀμελήσαντες τοῦ δικαίου
  choice: 因为他们忽视了那义人
  rationale: ἀμελέω表示不在意、忽略；带冠词的阳性单数τοῦ δικαίου在上下文中宜作具体的代表性义人。“因为”在中文中自然呈现分词所说明的行为及其罪责背景。
- source_word: τοῦ κυρίου ἀποστάντες
  choice: 又背离了主
  rationale: ἀφίστημι在此表示离开、转离；“背离”既保留关系与信仰层面的严重性，又避免采用过于技术化的“叛教”。κύριος依其神学语境译为“主”。
theological_decisions:
- issue: τοῦ δικαίου的所指
  choice: 那义人
  alternative: 义人群体；抽象的正义或公义
  rationale: 阳性单数冠词与《智慧篇》2—5章的论述脉络支持一位具有代表性的义人；“那义人”保留其具体性，但不进一步认定为某一特定人物。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在犹太希腊文智慧文学的语境中，此处指上帝；“主”既准确又保留其神学分量。
- issue: 分词ἀμελήσαντες与ἀποστάντες的逻辑关系
  choice: 以“因为……又……”表达伴随并带有缘由色彩的行为
  alternative: 严格保留为“他们忽视……并背离……”的并列分词结构
  rationale: 希腊文分词可说明不敬虔者受罚所对应的行为；中文加入“因为”使句法自然，但不排除其同时具有描述性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不敬虔的人”保留宗教与道德双重含义；“盘算”传达认知与谋划之间的语义张力。所有脚注标记均置于相关词语之后。
