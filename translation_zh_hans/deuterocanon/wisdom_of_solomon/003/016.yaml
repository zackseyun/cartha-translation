base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/016.yaml
  text: But the children of adulterers will be imperfect[b][a], and the offspring of an unlawful union will perish.
translation:
  language: zh_hans
  text: 但通奸者的子女必不完全[a]；出于不法结合[b]的后代必消亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不完全”也可译作“未完成”“未臻完全”或“发育不全”。希腊词强调未达到完全，却没有明确说明这种缺失具体指什么。
    reason: lexical_alternative
  - marker: b
    text: “不法结合”直译为“不法之床的种子”；“床”在这里借指性结合，“种子”指所生的后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: 儿女
  rationale: 表示子女或后代；“儿女”自然、庄重，也不限定为男性。
- source_word: μοιχῶν
  choice: 通奸者
  rationale: 属格复数，指以通奸行为为特征的人；保留原文直接的道德判断。
- source_word: ἀτέλεστα
  choice: 不得完全
  rationale: 保留“未达完成、未臻完全”的宽泛语义，不具体断定是身体、社会身份或人生结局方面的缺失。
- source_word: ἔσται
  choice: 必……
  rationale: 表达简单将来时；在智慧文学的判断句中，“必”简洁自然。
- source_word: ἐκ
  choice: 出于
  rationale: 准确体现来源关系。
- source_word: παρανόμου κοίτης
  choice: 不法床笫
  rationale: 兼顾 παρανόμου 的违法、悖法意味与 κοίτης 的“床榻/性结合”意象；用脚注说明其转喻。
- source_word: σπέρμα
  choice: 后代
  rationale: 字面为“种子”，此处集合性地指所生的后裔；“后代”符合现代汉语。
- source_word: ἀφανισθήσεται
  choice: 必被除灭
  rationale: 该将来被动式可指被消灭、从存有中消失；“被除灭”同时保留被动性与严厉的审判语气。
theological_decisions:
- issue: 对通奸关系所生儿女或后代的严厉判断
  choice: 按原文保留这一智慧判断的尖锐性，不将其弱化为单纯的社会歧视或名誉损害。
  alternative: 解释为后代只会遭受社会污名，或将其泛化为没有道德—法律力度的格言。
  rationale: 希腊文直接把后代的结局与通奸及不法结合相连。译文应保留这种神学张力，却不进一步断言原文没有明说的遗传罪责机制。
- issue: ἀτέλεστα 所指缺失的具体性质
  choice: 采用“不得完全”，保留未完成、未成全的开放含义。
  alternative: 具体译成夭折、残缺、没有合法身份或人生不得善终。
  rationale: 原词本身没有明确限定缺失属于身体、法律身份、社会地位还是最终结局，不应替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“床笫”保留希腊文的床榻意象，虽略具书面色彩，但有脚注帮助理解；分号对应两个紧密平行的判断分句。
