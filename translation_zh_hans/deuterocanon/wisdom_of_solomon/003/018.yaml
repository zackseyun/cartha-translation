  text: Even if they die quickly[a], they have no hope, nor comfort on the day of judgment.
translation:
  language: zh_hans
  text: 即使他们很快死去，他们也没有希望；在审判之日[a]也没有安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判定之日”或“辨明之日”。该希腊词可指经过辨别后作出的判定或审判。
    reason: 保留διάγνωσις可指辨明、判定或审判的词义幅度。
lexical_decisions:
- source_word: ἐάν τε
  choice: 即使
  rationale: 结合上下文按让步条件理解，现代汉语用“即使”自然清楚。
- source_word: ὀξέως
  choice: 很快
  rationale: 直接表达该副词“迅速、很快”的基本意义，不把它解释性地扩展为“早逝”。
- source_word: τελευτήσωσιν
  choice: 死去
  rationale: 此处指生命终结；“死去”准确、自然。
- source_word: ἐλπίδα
  choice: 希望
  rationale: 保留其通常意义，也符合本段关于死后结局的语境。
- source_word: ἡμέρᾳ διαγνώσεως
  choice: 审断之日
  rationale: διάγνωσις可指辨明之后所作的判定；“审断”既适合终末性的语境，又不完全抹去“鉴察、判定”的词义幅度。
- source_word: παραμύθιον
  choice: 安慰
  rationale: 简明表达慰藉、安慰之意，符合现代汉语。
theological_decisions:
- issue: ἡμέρᾳ διαγνώσεως的终末论含义
  choice: 审断之日
  alternative: 审判之日；鉴察之日；判定之日
  rationale: 上下文涉及义人与不敬虔者死后的结局，具有终末审判色彩；但希腊词本身也包含辨明、判定的意味，因此正文采用“审断”，并以脚注保留其他可能表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“也没有……；……也……”保持原句两个否定分句的平衡；脚注标记置于其实际说明的“审断之日”之后。
