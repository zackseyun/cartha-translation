  text: For even if they become long-lived[a], they will be counted as nothing[b], and in the end their old age will be dishonored.
translation:
  language: zh_hans
  text: 即使他们得以长寿，也会被看作毫无价值；到最后[a]，他们的晚年也毫无尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到最后”也可译作“最终”。原文可指最后的阶段，也可着重最终的结局。
    reason: 保留ἐπʼ ἐσχάτων在时间阶段与最终结果之间的语义幅度。
lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: 因为，即使
  rationale: 保留γὰρ的承接、说明作用和ἐὰν的条件意味；结合上下文，以“即使”自然表达让步语气。
- source_word: μακρόβιοι γένωνται
  choice: 他们得享长寿
  rationale: μακρόβιοι指寿命长，γένωνται在条件句中表示可能达到这种状态；“得享长寿”符合现代汉语表达，又不引入福乐或兴盛之意。
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: 会被算作无足轻重
  rationale: 保留λογισθήσονται的将来被动评价含义，并以“无足轻重”自然传达εἰς οὐθέν所表达的毫无分量、算不得什么。
- source_word: ἐπʼ ἐσχάτων
  choice: 到末了
  rationale: 表达事物最终阶段或结局，同时保留原短语在时间范围上的一定开放性。
- source_word: ἄτιμον τὸ γῆρας αὐτῶν
  choice: 他们的晚年也毫无尊荣
  rationale: ἄτιμον直接涉及尊荣与羞辱的评价；“毫无尊荣”保留其状态性，不把被谁羞辱或轻视说得过于具体。
theological_decisions:
- issue: 长寿是否本身带来价值与尊荣
  choice: 即使他们长寿，也仍被判为无足轻重，晚年没有尊荣。
  alternative: 仅把本句理解为对晚年社会声誉的描述。
  rationale: 本节在上下文中对不敬虔者作价值判断；译文保留这种张力，但不擅自补入“在上帝面前”等原文没有明说的限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得享长寿”“无足轻重”“毫无尊荣”兼顾普通读者的可懂性与原文的评价、荣辱语义；避免补入评价主体或具体审判场景。
