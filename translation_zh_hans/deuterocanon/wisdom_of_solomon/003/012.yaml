  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/012.yaml
  text: Their women are foolish[a], and their children are evil[b]; their offspring is accursed.
translation:
  language: zh_hans
  text: 他们的妇女[a]愚昧，儿女邪恶；他们的后裔[b]落在咒诅之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妻子”。希腊文γυναῖκες依语境可指“妇女”，也可指“妻子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“子孙”“世系”。希腊文γένεσις在这里可指所生的后代、血脉或家系。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: 妇女
  rationale: γυνή可指“妇女”或“妻子”。正文采用较直接的“妇女”，并在脚注保留家庭语境中“妻子”的可能。
- source_word: ἄφρονες
  choice: 愚昧
  rationale: 表达缺乏明辨和理解，也保留原文在道德与心智层面的贬义，比单纯“不聪明”更有分量。
- source_word: πονηρά
  choice: 邪恶
  rationale: 此处带有明确的道德否定，并非仅指品质不好；“邪恶”符合审判语境。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα通常指儿女；译作“儿女”既自然，也与下句较广义的后裔相区别。
- source_word: ἐπικατάρατος
  choice: 落在咒诅之下
  rationale: 以自然现代汉语表达处于咒诅之中的严厉状态，保留原文庄重的审判语气。
- source_word: γένεσις
  choice: 后裔
  rationale: 此处可指所生的后代、血脉或世系；“后裔”切合上下文的家族范围，同时不与前面的“儿女”完全重复。
theological_decisions:
- issue: 对恶人家庭及后代的严厉判语
  choice: 按原文直陈妇女愚昧、儿女邪恶、后裔落在咒诅之下，不弱化其审判力度。
  alternative: 将这些话泛化为家庭遭遇不幸，或用较缓和的措辞淡化道德定性。
  rationale: 希腊文连续使用直接的表语形容词，没有提供将其缓和为一般不幸的文本依据；译文保留原文的伦理与神学张力，而不代为化解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号对应原文前两项与末项之间的语义推进；“落在咒诅之下”避免生硬的“是可咒诅的”，同时保持判语的严肃性。
