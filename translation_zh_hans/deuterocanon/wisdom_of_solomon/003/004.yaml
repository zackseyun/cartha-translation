  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/004.yaml
  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
translation:
  language: zh_hans
  text: 因为，即使在人看来他们受到惩罚[a]，他们的盼望仍满有不朽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受到惩罚”也可译作“受到管教”或“受到责罚”。希腊词既可指惩罚，也可指带有纠正作用的管教；这里“在人看来”强调的是人的外在观感，而非最终实情。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为，即使
  rationale: γάρ承接上文，表示解释或理由；καί在与ἐάν连用的语境中加强让步意味。译文保留经文与上文的因果衔接和“即使”的让步关系。
- source_word: ἐν ὄψει ἀνθρώπων
  choice: 在人看来
  rationale: ὄψις在此指人的观察和判断角度。“在人看来”是自然的现代汉语，也凸显外在观感与最终实情之间的对照。
- source_word: ἐὰν κολασθῶσιν
  choice: 他们受了惩罚
  rationale: κολάζω可指惩罚，也可含管教、责罚之意。“受了惩罚”保留较强的基本词义，而“在人看来”使这不必被理解为上帝对义人的最终定罪。
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: 他们的盼望
  rationale: 按原文所有关系直译，同时符合现代汉语表达。
- source_word: ἀθανασίας
  choice: 不朽
  rationale: ἀθανασία指不受死亡辖制的状态。“不朽”保留其抽象名词形式，避免将其直接释义为某一套特定的末世论表述。
- source_word: πλήρης
  choice: 充满
  rationale: 原文省略系词，πλήρης作谓语，表达“满有、充满”。译作“充满”既自然，也保留盼望以不朽为其内容的表达。
theological_decisions:
- issue: 义人所受苦难是否是上帝的惩罚
  choice: 译作“受了惩罚”，同时以“在人看来”限定其为人的观察角度
  alternative: 译作“受了管教”或“受了责罚”
  rationale: 原文既使用可表示惩罚或管教的κολάζω，又明确加入“在人看来”。译文保留这两方面的张力，不把义人的苦难直接断定为上帝的定罪，也不把它预先解释成纯粹的纠正性管教。
- issue: ἀθανασία的神学含义
  choice: 译作“不朽”
  alternative: 译作“永生”或“不死”
  rationale: “不朽”最直接对应ἀθανασία，并保留原文抽象而开放的表达；“永生”可能引入更宽泛的神学内涵，“不死”则较口语且偏重单纯免于死亡。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“在人看来”自然表达人的观察角度；“充满不朽”略带经文诗性，以贴近原文“盼望满有不朽”的结构和神学张力。
