  text: and their departure from us was thought to be ruin[b][a], but they are in peace.
translation:
  language: zh_hans
  text: 他们的离去，被认为是毁灭[a]；但他们却在平安中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句承接上文所述人的看法；希腊文此处省略了“被认为”一类的动词。也可译作“他们的离去，看来是一场灾祸”。
    reason: 说明上下文所补出的判断视角，并保留σύντριμμα可指灾祸、破灭的表达幅度。
  - marker: b
    text: “平安”在这里不仅可指没有冲突，也可包含安息、安宁和福祉。
    reason: 说明εἰρήνη在本语境中的宽广含义。
lexical_decisions:
- source_word: πορεία
  choice: 离开
  rationale: 本义是“行程、行去”，此处指义人从活人中间离去。“离开”保留离去的意象，又不把原文未明说的“死亡”直接写入正文。
- source_word: ἀφʼ ἡμῶν
  choice: 离开我们
  rationale: 按空间和关系意义直译为“从我们这里离去”；现代汉语用“离开我们”自然清楚，也保留留下之人的观察角度。
- source_word: σύντριμμα
  choice: 毁灭
  rationale: 该词可指压碎、破灭或毁坏；这里表示旁观者以为义人的离去是彻底败亡。“毁灭”简洁有力，同时不把这种判断当作真实结局。
- source_word: οἱ δὲ
  choice: 但他们却
  rationale: δέ在此形成强烈转折，对照世人的判断与义人的真实处境；“但……却……”在现代汉语中清楚呈现这一反差。
- source_word: ἐν εἰρήνῃ
  choice: 在平安之中
  rationale: 较贴近希腊语介词结构，并保留εἰρήνη可涵盖安息、安宁、福祉与稳妥的宽广含义。
theological_decisions:
- issue: 是否明确前半句只是人的判断，而非义人的真实结局
  choice: 被认为是毁灭
  alternative: 就是毁灭
  rationale: 本分句省略了判断动词，但承接上文“被认为”的视角。补出“被认为”能忠实传达上下文中的省略，避免把世人的误判陈述为事实，并保留后半句带来的神学反转。
- issue: 如何表达义人的真实状态
  choice: 在平安之中
  alternative: 安息了
  rationale: “安息了”容易将εἰρήνη的含义收窄为死亡后的休息；“在平安之中”保留原文关于安宁、完整和稳妥的开放幅度，不额外规定其具体形态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“离开我们”避免生硬的“从我们中间的行程”，“在平安之中”则有意保留希腊文表达的宽度。正文中的[a]、[b]均与脚注对应。
