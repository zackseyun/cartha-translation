base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
translation:
  language: zh_hans
  text: 他们受了些许管教[a]，却必大大受益[b]，因为上帝考验了他们，认定他们配作他的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “些许”也可译作“受了短暂的管教”或“只受了少许管教”。希腊语ὀλίγα既可指程度有限，也可指时间短暂。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必领受极大的益处。”希腊语直指他们将受到重大的益处。
    reason: lexical_alternative
  - marker: c
    text: 或译：“认定他们配属自己。”原文强调他们被认定在与上帝自身的关系上是相配的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: 些许
  rationale: 既可表示程度轻微，也可暗示时间短暂；“些许”自然简洁，并保留与“广大恩惠”的对比。
- source_word: παιδευθέντες
  choice: 受了管教
  rationale: παιδεύω兼有教育、训练和纠正性管教之意；“管教”比“惩罚”更能保留塑造与纠正的双重含义。
- source_word: μεγάλα εὐεργετηθήσονται
  choice: 必蒙大恩
  rationale: εὐεργετέω意为施惠、使受益；“蒙大恩”以自然中文表达被动领受重大益处，同时未将恩惠具体化。
- source_word: ἐπείρασεν
  choice: 考验
  rationale: 此处指检验、验证品格，并非引诱犯罪；“考验”清楚保留其语义。
- source_word: ἀξίους ἑαυτοῦ
  choice: 配得上他
  rationale: 直译关系性的“配得上他”，保留以神自身为衡量与归向的表达，而不将其泛化为抽象的道德资格。
theological_decisions:
- issue: 苦难与上帝考验之间的关系
  choice: 上帝考验了他们
  alternative: 上帝试炼了他们／上帝验证了他们
  rationale: 经文将他们所受的管教描述为上帝的考验，却没有进一步界定上帝如何借苦难施行考验；译文保留这种张力，不解释为诱惑、刑罚或某一特定的成圣理论。
- issue: “配得上他”的关系含义
  choice: 发现他们配得上他
  alternative: 发现他们配为他所用／发现他们在他面前是配得的
  rationale: 原文ἀξίους ἑαυτοῦ保留一定关系性歧义；正文采用较贴近原文的说法，脚注列出目的性较强的可能译法，避免将其单一化。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“蒙大恩”适合智慧文学的凝练语体，也清楚表达被施惠的被动意义；“上帝”与中文《智慧篇》语境相符。所有歧义均在正文或脚注中保留。
