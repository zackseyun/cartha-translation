  text: For the ends of an unrighteous generation are grievous[a].
translation:
  language: zh_hans
  text: 因为不义世代的结局是悲惨的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不义者的后裔”或“邪恶的家系”。希腊词γενεά可指一代人、家系或一群后裔。
    reason: 保留γενεά在本句中可能具有的血缘及家系含义。
lexical_decisions:
- source_word: γενεᾶς
  choice: 一代
  rationale: γενεά可指一代人、家系或后裔群体；“一代”自然保留其集合意义，又不把经文限定为生物血统。
- source_word: ἀδίκου
  choice: 不义的
  rationale: ἀδίκου含不公、不正或不义之意；“不义的”既保留智慧文学中的道德和宗教意味，也避免将含义缩窄为司法层面的“不公正”。
- source_word: χαλεπὰ
  choice: 悲惨的
  rationale: χαλεπός在此表示艰难、痛苦、严酷或可悲；“悲惨的”符合庄重语气，并自然描述其最终遭遇的严重性。
- source_word: τὰ τέλη
  choice: 结局
  rationale: τέλη是复数，可指终局、结果或命运；现代汉语以集合性的“结局”表达最自然，同时不额外加入原文没有的意象。
theological_decisions:
- issue: γενεᾶς ἀδίκου应理解为带血缘意味的“不义者的后裔”，还是作为道德集合类别的“不义的一代”。
  choice: 不义的一代
  alternative: 不义者的后裔；邪恶的家系
  rationale: 希腊文容许家系或后裔的理解，且上下文谈到子孙与无子；但本句本身简洁而具集合性。“不义的一代”保留道德定性，同时不引入比原文更强的遗传或世袭观念；脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“因为”承接上文的γάρ；“结局是悲惨的”比直译“终局是艰难的”更符合自然汉语，同时维持原句严肃的警告语气。
