base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: zh_hans
  text: 因为那不能生育而不受玷污的女子是有福的；她未曾在过犯中有床笫之事[a]，在灵魂受察访之时，必有果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床笫之事”是性关系的委婉说法。原文直译为“未曾在过犯中知道床”。
    reason: lexical_alternative
  - marker: b
    text: “灵魂受察访之时”可能指神将来察访、鉴察灵魂之时，因而可含审判或为义人申冤的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: 有福的
  rationale: 保留圣经语体中蒙福、值得称羡的评价意味，较“快乐”或“幸运”更贴切。
- source_word: στεῖρα
  choice: 不能生育的女子
  rationale: 明确所指为不能生育的女性，同时使用现代汉语中自然且不带贬抑色彩的表达。
- source_word: ἀμίαντος
  choice: 不受玷污
  rationale: 保留该词在道德与礼仪层面未被污损的含义，又不把它泛化为单纯的“纯洁”。
- source_word: ἔγνω κοίτην
  choice: 有过床笫之事
  rationale: 希腊文直译为“知道床”，以“床”婉指性关系；中文采用庄重而可理解的对应委婉语。
- source_word: ἐν παραπτώματι
  choice: 在过犯中
  rationale: 紧贴希腊文，表明所说的性关系涉及过犯，却不擅自限定具体罪行。
- source_word: ἕξει καρπὸν
  choice: 必有果实
  rationale: 保留“有果实”的原文措辞及其反讽性反转：不能生育者最终却有果实。
- source_word: ἐν ἐπισκοπῇ ψυχῶν
  choice: 在众灵魂受察访的时候
  rationale: “察访”可涵盖神的眷顾、鉴察与审断，避免直接窄化为“审判”；补出“受”与“时候”使现代汉语通顺。
theological_decisions:
- issue: “众灵魂受察访”所指为何
  choice: 保留为神将来对众灵魂的察访，容纳鉴察、申冤或审断等意味
  alternative: 明确译作“审判众灵魂的时候”或“神眷顾众灵魂的时候”
  rationale: 上下文涉及义人死后的结局与伸冤，但ἐπισκοπή本身没有把含义限定为惩罚性的审判或恩惠性的眷顾，因此正文不消解这种张力。
- issue: 女子“不受玷污”与“过犯中的床笫之事”的关系
  choice: 按原文并列描述：她不受玷污，并未有过带着过犯的性关系
  alternative: 解释为她完全没有任何性关系，或专指婚外性关系
  rationale: 原文只否定“在过犯中”的床笫之事，未明确否定一切婚姻内性关系，也未具体界定过犯的类型。
translation_notes:
  register: 采用现代、庄重而易懂的圣经汉语。“不能生育的女子”避免古语“石女”的贬抑感；“床笫之事”保留原文委婉意象；“察访”有意维持ἐπισκοπή在眷顾与审断之间的语义开放性。所有脚注标记均置于正文对应位置。
