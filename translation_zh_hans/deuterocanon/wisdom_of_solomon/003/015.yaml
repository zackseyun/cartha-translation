  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/015.yaml
  text: For the fruit of good labors is glorious[a], and the root of understanding does not fail.
translation:
  language: zh_hans
  text: 因为，美好的劳苦所结的果实享有美名，明辨[a]的根永不衰败。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨”或译“审慎”。
    reason: φρόνησις兼有实践理解、审慎判断等含义，中文没有完全对应的单一词。
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: 美善劳作
  rationale: ἀγαθῶν修饰πόνων，指具有美善性质的劳苦或努力。“美善劳作”既保留道德上的正面意味，也不把πόνος过度收窄为痛苦。
- source_word: ὁ καρπός
  choice: 所结的果实
  rationale: 保留“果实”的农业比喻，并以“所结的”自然表达劳作与成果之间的关系。
- source_word: εὐκλεής
  choice: 享有美名
  rationale: 该词主要表示声誉良好、享有荣名；“享有美名”比笼统的“荣耀”更直接呈现其声誉含义。
- source_word: ἀδιάπτωτος
  choice: 永不衰败
  rationale: 该词表示不坠落、不失效或不败坏；用于“根”的比喻时，“永不衰败”自然表达其持久稳固。
- source_word: ἡ ῥίζα
  choice: 根
  rationale: 明确保留原文与“果实”相呼应的农业意象。
- source_word: τῆς φρονήσεως
  choice: 明辨
  rationale: φρόνησις在此指实践性的理解、审慎和判断力；“明辨”简洁自然，并避免与σοφία通常所译的“智慧”混同。
theological_decisions:
- issue: φρόνησις与“智慧”术语的区分
  choice: 明辨
  alternative: 审慎；智慧；悟性
  rationale: 原文使用φρόνησις而非σοφία。“明辨”保留实践判断的意味，同时不把两个不同的希腊词无区别地译成“智慧”。
- issue: 果实与根的平行比喻
  choice: 同时保留“果实”和“根”
  alternative: 意译为“美善努力的成果长存”
  rationale: 原文以两种农业意象构成平衡的箴言式表达；直保留两者能保存文学结构，也避免加入原文没有明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式语体。“享有美名”传达εὐκλεής的声誉含义；“永不衰败”与“根”的意象自然搭配。
