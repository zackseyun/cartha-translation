base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/001.yaml
  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: zh_hans
  text: 义人的灵魂却在上帝手中，任何折磨都绝不会触及他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任何苦难都绝不会触及他们。”希腊语 βάσανος 可指严重的痛苦、苦难或折磨。
    reason: 词义存在合理的翻译选择；正文采用较强的“折磨”，脚注保留较宽泛的“苦难”。
lexical_decisions:
- source_word: Δικαίων
  choice: 义人
  rationale: δίκαιος 的复数属格在此作名词用；“义人”简洁自然，并保留原文的道德与神学范畴。
- source_word: ψυχαὶ
  choice: 灵魂
  rationale: ψυχή 可指灵魂、生命或人；紧接下文所述世人眼中的死亡，此处“灵魂”最能保留原文关于死后存续的表达，同时不增添更具体的人论体系。
- source_word: ἐν χειρὶ θεοῦ
  choice: 在上帝手中
  rationale: 直译并保留圣经中有关上帝保护、掌管和归属的意象，不把其丰富含义缩减为单一解释。
- source_word: οὐ μὴ ἅψηται
  choice: 都绝不会触及
  rationale: οὐ μή 加虚拟式表达强烈否定；“绝不会”体现其强调语气，“触及”则保留原文的接触意象。
- source_word: βάσανος
  choice: 折磨
  rationale: βάσανος 可指严酷的痛苦、苦难或折磨；“折磨”保留其较强烈的含义，并与本节安慰性的对照相称。
theological_decisions:
- issue: ψυχαί 是否指死后存续的灵魂
  choice: 正文译作“灵魂”
  alternative: 生命；人
  rationale: 上下文涉及义人在世人看来已经死亡的处境；“灵魂”忠实保留原文的人论与末世意味，但不据此引申经文本身未说明的细节。
- issue: ἐν χειρὶ θεοῦ 的意象范围
  choice: 保留“在上帝手中”的直译
  alternative: 在上帝保护之下；蒙上帝看顾
  rationale: 原有意象可同时涵盖保护、掌管与归属；解释性译法会不必要地缩窄其含义。
- issue: βάσανος 的语义强度
  choice: 正文译作“折磨”
  alternative: 苦难；痛苦
  rationale: “折磨”传达该词的强烈程度；脚注列出较宽泛的可能译法，以保留原词在此处的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却”承接 δέ 的转折，突出本节与前文世人看法之间的对照；句式简洁，并保留“手中”和“触及”的原文意象。
