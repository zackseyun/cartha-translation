    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξαν
  choice: 似乎
  rationale: 该词在这里表达从观察者角度形成的表象，并非对事实本身的断言；“似乎”也保留了上下文中人的判断与真实情形之间的反差。
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: 在愚昧人眼中
  rationale: 保留“在……眼中”这一希腊语习语；“愚昧人”既自然易懂，也保留了 ἀφρόνων 所带的道德与属灵判断意味。
- source_word: τεθνάναι
  choice: 已经死了
  rationale: 完成时不定式强调死亡已经发生及其结果状态；在“似乎”之后译作“已经死了”符合现代汉语表达。
- source_word: ἐλογίσθη
  choice: 被看作
  rationale: 这里指旁观者所作的估量或判断；被动式“被看作”准确且自然。
- source_word: ἡ ἔξοδος αὐτῶν
  choice: 他们的离去
  rationale: ἔξοδος 本义为“出去、离去”，此处委婉指向死亡；译作“离去”保留隐喻，不将其直接化约为“死亡”。
theological_decisions:
- issue: ἔξοδος 对死亡的隐喻表达
  choice: 他们的离去
  alternative: 他们的死亡／他们的结局
  rationale: “离去”保留原文含蓄而开放的表达，也维持本段关于义人外在遭遇与真实处境之间的张力。
- issue: 所给希腊文本在 ἐλογίσθη ἡ ἔξοδος αὐτῶν 后缺少表语成分
  choice: 以省略号保留未完结构，并加注说明
  alternative: 依据其他文本或英文咨询层补入“灾祸”
  rationale: 本稿优先依据所提供且标为高置信度的希腊语来源。该来源只说“他们的离去被看作……”而未载明被看作什么，因此不把来源中没有的 κακοῦ、κάκωσις 或“灾祸”补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“愚昧人”保留原文的评价力度；“离去”保留死亡隐喻。分号呈现两个并列判断，省略号则如实反映所给希腊来源的未完句法。
