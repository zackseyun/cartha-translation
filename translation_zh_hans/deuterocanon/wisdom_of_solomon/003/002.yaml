  text: In the eyes of fools they seemed to have died[a], and their departure was regarded as calamity,
translation:
  language: zh_hans
  text: 在愚昧人眼中，他们似乎已经死了；他们的离去被看作是一场灾祸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
