  terminology: “不敬虔之人”恰当保留ἀσεβῶν面向上帝的不虔敬意味。“私生的枝条”在正文中可保留原词的尖锐性及比喻性质；但脚注中的“非正统的”“伪杂的”不是自然、准确的现代汉语释义，宜改为“非婚生的”及引申义“不纯正、伪冒的”。
