base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: zh_hans
  text: 不敬虔之人的众多子孙毫无用处；他们从私生的枝条而出，不能向深处扎根，也不能奠定稳固的根基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  choice: 子孙纵然众多
  rationale: 该短语描写一个多产、后代众多的群体。“子孙众多”自然传达集体含义，并以“纵然”显明本节所强调的反差，而不改变命题内容。
- source_word: ἀσεβῶν
  choice: 不敬虔之人
  rationale: ἀσεβής侧重对上帝缺乏敬畏与虔诚；“不敬虔”保留其宗教和道德层面，又不扩大为泛指一切邪恶。
- source_word: οὐ χρησιμεύσει
  choice: 终将毫无用处
  rationale: χρησιμεύω意为有用、派上用场；否定将来时译为“终将毫无用处”，既自然，也保留将来的指向。
- source_word: ἐκ νόθων μοσχευμάτων
  choice: 从私生的枝条长出的
  rationale: νόθος可指私生、非正统或伪杂，μοσχεύματα指嫩枝、插条或接枝。“私生的枝条”刻意保留原文尖锐的称谓及园艺比喻；“长出的”使汉语句法完整。
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: 不会向深处扎根
  rationale: 原文直译为“不会把根伸向深处”。“向深处扎根”符合现代汉语习惯，同时完整保留根向下深入的意象。
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  choice: 也不能奠定稳固的根基
  rationale: ἀσφαλής表示稳固、可靠，βάσις表示基础，ἐδράζω表示立稳或建立。“奠定稳固的根基”自然传达稳定性意象。
theological_decisions:
- issue: ἀσεβῶν所表达的道德与宗教性质
  choice: 不敬虔之人
  alternative: 恶人；不虔之人
  rationale: 选择“不敬虔”以保留该词面向上帝的含义，不把它缩减为一般性的恶行，也不附加特定宗派解释。
- issue: νόθων在枝条比喻中的尖锐语气
  choice: 私生的枝条
  alternative: 非正统的枝条；杂生的枝条；伪杂的插条
  rationale: 原词兼有社会身份上的“私生”和真实性上的“非正统”意味。正文保留其刺耳的修辞力度，并借“枝条”明确这是比喻；脚注交代其他可能义，避免把一个多义词过度定死。
- issue: 后代意象与植物意象的转换
  choice: 保留“子孙—枝条—扎根—根基”的复合意象
  alternative: 统一改写为后代不能长久兴旺
  rationale: 原文有意把血统与植物生长、建筑稳固的意象交织在一起。译文不将这种张力化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留原文由后代转入枝条、根和根基的复合比喻；“私生的枝条”有意维持希腊文的严厉语气，但以脚注说明其语义范围。
