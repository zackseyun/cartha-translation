  text: They will see and will despise[b][a], but the Lord will laugh at them.
translation:
  language: zh_hans
  text: 他们必看见，也必轻蔑[a]；但主必嗤笑他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻蔑”也可译作“视为无物”。希腊文没有明说轻蔑的对象。
    reason: lexical_alternative
  - marker: b
    text: “嗤笑”也可译作“嘲笑”；原词含讥诮、嘲弄之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: 他们看见了
  rationale: 这是ὁράω的将来时形式。结合上下文，用“看见了”自然表达将来的实际所见，并不增添所见对象。
- source_word: ἐξουδενήσουσιν
  choice: 就必轻蔑
  rationale: 该词有“视为无物、鄙视”的含义。“轻蔑”在现代汉语中简洁自然，也保留其轻视意味；不补出原文未明说的宾语。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处κύριος指上帝；“主”既符合智慧文学的神学语境，也保留原词的称谓分量。
- source_word: ἐκγελάσεται
  choice: 必嗤笑他们
  rationale: ἐκγελάω不只是发笑，还带有嘲弄、讥笑意味。“嗤笑”简洁地传达这种贬抑色彩。
theological_decisions:
- issue: κύριος在次经智慧文学语境中的译法
  choice: 主
  alternative: 主人
  rationale: 本节所指是作为审判者的上帝，因此译作“主”；“主人”会误导为一般的人际主从关系。
- issue: 主“笑”的拟人及审判意味
  choice: 嗤笑他们
  alternative: 嘲弄他们／向他们发笑
  rationale: 保留原文对上帝行动的拟人表达，不将其弱化为抽象的审判，同时以“嗤笑”呈现ἐκγελάω所含的嘲讽意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们看见了，就必……”以完成体“了”配合“必”表达将来场景中的先后关系；分号保留两方行动之间鲜明的审判性转折。所有代词所指均按希腊原文保留，不擅自补明“他们所看见并轻蔑”的对象。
