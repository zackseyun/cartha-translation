base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: zh_hans
  text: 此后，他们必沦为蒙羞的尸首，在死人中永远成为耻辱[a]。因为他[b]必将他们猛摔在地，使他们俯伏无声，并从根基上摇撼他们；他们必被彻底毁坏，成为荒废之地，陷在痛苦之中；他们的记忆也必消亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸首”所译的希腊词也可指“倒下之物”或“倒毙的身体”，强调他们结局的羞耻。
    reason: lexical_alternative
  - marker: b
    text: 原文没有在这里明说“他”是谁；按上下文，这是指施行审判的上帝。
    reason: implicit_subject
lexical_decisions:
- source_word: πτῶμα
  choice: 尸首
  rationale: 该词可指坠落或倒下之物，在本段审判与死人语境中，具体指倒毙的身体；“尸首”自然传达其可耻结局，同时以脚注保留词义幅度。
- source_word: ἄτιμον
  choice: 蒙羞的
  rationale: 表达失去尊荣、受羞辱的状态，与“尸首”搭配自然，也保留原文的耻辱色彩。
- source_word: ὕβριν
  choice: 耻辱
  rationale: 此处侧重他们在死人中所处的可鄙地位，而非主动施加的暴行；“成为耻辱”符合 εἰς 所表示的结果。
- source_word: ἐν νεκροῖς
  choice: 在死人中
  rationale: 直译并自然表达他们置身死者之列的意思。
- source_word: διʼ αἰῶνος
  choice: 永远
  rationale: 在持续审判和记忆消亡的语境中，清楚传达该时间表达的长久、恒常意味。
- source_word: ῥήξει
  choice: 猛摔下去
  rationale: 该动词含破裂、猛击或猛烈摔下之意；结合 πρηνεῖς，译文突出强烈的向下动作。
- source_word: ἀφώνους
  choice: 无声
  rationale: 既可指不能说话，也可表示被迫沉默；“无声”保留两者之间的含混。
- source_word: πρηνεῖς
  choice: 俯伏
  rationale: 表示脸朝下、俯身倒地的姿势；“俯伏”简洁且符合庄重语体。
- source_word: σαλεύσει
  choice: 摇撼
  rationale: 传达猛烈摇动和使之不稳的意思，并与随后“从根基上”形成自然搭配。
- source_word: ἐκ θεμελίων
  choice: 从根基上
  rationale: 保留原文彻底动摇的根基意象，不将其缩减为较解释性的“连根拔除”。
- source_word: ἕως ἐσχάτου
  choice: 彻底
  rationale: 表达达到极点、直到尽头的全面程度，在现代汉语中清楚有力。
- source_word: χερσωθήσονται
  choice: 沦为荒凉
  rationale: 该动词表示荒废、荒芜或成为不毛之地；用“沦为荒凉”保留其荒地意象及被动受审判的意味。
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: 他们的记忆也必消亡
  rationale: 贴近原文，既可指关于他们的记忆消失，也可按字面理解为“他们的记忆”；不在正文中擅自限定。
theological_decisions:
- issue: 施行审判者在动词中的隐含主语
  choice: 正文译作“他”，不直接补出“上帝”
  alternative: 明确译作“上帝”或改为无人称被动句
  rationale: ῥήξει 与 σαλεύσει 的主语为隐含的阳性单数；上下文指向上帝的审判，但本节没有重述其名号。保留“他”既忠于句法，也避免把上下文推断直接写入正文。
- issue: “他们的记忆”所指
  choice: 保留“他们的记忆”这一结构
  alternative: 解释为“世人对他们的记忆”或“他们自身的记忆能力”
  rationale: 希腊语可自然指他们留在人间的名声或记念，但字面结构没有明说记忆的持有者；译文保留其开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“沦为”“摇撼”“消亡”保持智慧文学审判宣告的力度；句法尽量贴近希腊文，同时避免生硬直译。脚注标记均已置入正文。
