  to: 此后，他们必沦为蒙羞的尸首，在死人中永远成为耻辱[a]。因为他[b]必将他们猛摔在地，使他们俯伏无声，并从根基上摇撼他们；他们必被彻底毁坏，成为荒废之地，陷在痛苦之中；他们的记忆也必消亡。
