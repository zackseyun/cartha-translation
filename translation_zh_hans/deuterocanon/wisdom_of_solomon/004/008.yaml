  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/008.yaml
  text: For old age is honorable not because it is long-lived, nor is it measured by the number of years;
translation:
  language: zh_hans
  text: 因为，可敬的老年不在于长寿，也不是用年数来衡量的；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆρας
  choice: 老年
  rationale: 指老年这一人生阶段本身，而非老人个体；“老年”自然、准确，也与后文年数的对比相称。
- source_word: τίμιον
  choice: 可敬的
  rationale: 此处表示受尊重、具有道德价值，而非物质上的贵重；“可敬的”能自然表达其伦理意味。
- source_word: οὐ τὸ πολύχρονον
  choice: 不在于长寿
  rationale: 原文否定年岁长久本身是可敬老年的标准；这样译既符合现代汉语，也避免把“长寿”本身说成不可敬。
- source_word: οὐδὲ
  choice: 也不是
  rationale: 承接前一否定，紧密引出第二项否定，在汉语中自然清楚。
- source_word: ἀριθμῷ ἐτῶν
  choice: 用年数
  rationale: 表达衡量所依据的尺度，即岁月的数量；“年数”简洁并贴近原文。
- source_word: μεμέτρηται
  choice: 来衡量的
  rationale: 原文完成时被动态在格言语境中表达既定的衡量标准；汉语用一般被动含义即可自然传达。
theological_decisions:
- issue: 可敬老年的性质
  choice: 老年之所以可敬，不取决于寿命长短或累计年数。
  alternative: 把经文理解为一概否定长寿的价值。
  rationale: 原文否定的是以长久年岁作为老年可敬与否的尺度，并未否定长寿本身；译文保留这一智慧文学中的伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”承接上下文的论证关系；保留句末分号，以反映本节与下一节在句意上的延续。
