  text: For gray hair is understanding for men, and an unblemished life is the age of old age.
translation:
  language: zh_hans
  text: 因为，对人来说，白发就是明智；无瑕的生活就是老年的年岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιὰ
  choice: 白发
  rationale: 本义为灰白的头发，并以此象征年高；译作“白发”自然且保留本节的比喻。
- source_word: φρόνησις
  choice: 明智
  rationale: 指实践性的智慧或明达判断；“明智”比单纯“聪明”更符合语境。
- source_word: ἀνθρώποις
  choice: 人的
  rationale: 这里泛指人类，并非专指男性；采用“人的”准确表达其通称意义。
- source_word: ἡλικία γήρως
  choice: 老年的岁数
  rationale: 尽量保留原文将“无瑕的生活”比作老年岁数的紧凑表达，不扩展为原文未明说的“成熟”。
- source_word: βίος ἀκηλίδωτος
  choice: 无瑕的生活
  rationale: ἀκηλίδωτος意为没有污点、无可玷污；“无瑕的生活”保留其伦理意味及形象性。
theological_decisions:
- issue: 真正年高的衡量标准
  choice: 保留原文的等同式隐喻：明智就是白发，无瑕的生活就是老年的岁数
  alternative: 解释为明智和无瑕生活“胜过”实际高龄，或称其为“成熟的老年”
  rationale: 原文以系词直接建立对应关系，意在重新界定可敬的年高；直译可保留其神学与智慧文学张力，而不加入解释。
translation_notes:
  register: 采用庄重而简洁的现代标准汉语。两分句保持平行结构；“白发—老年的岁数”保留原文关于年高的连续意象。“老年的岁数”略带凝练的书面色彩，但可理解，并避免把ἡλικία解释性改写为“成熟”。
