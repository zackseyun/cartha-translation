  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/010.yaml
  text: Having become pleasing to God[a], he was loved; and while living among sinners, he was taken away.
translation:
  language: zh_hans
  text: 他成了上帝所喜悦的人，便蒙爱；他还活在罪人中间时，就被接走了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被挪去了”或“被迁移了”。希腊文没有明确这里着重指英年早逝、上帝将他从败坏的环境中挪去，还是像以诺那样被接去。
    reason: 说明μετετέθη的替代译法，并保留原文对于被接走之性质的含混性。
lexical_decisions:
- source_word: εὐάρεστος τῷ θεῷ
  choice: 上帝所喜悦的
  rationale: 表达此人令上帝喜悦、蒙上帝悦纳的关系含义；“所喜悦的”自然庄重，也不把含义缩减为一般性的“可接受”。
- source_word: γενόμενος
  choice: 成了
  rationale: 保留不定过去时分词相对于主句的先行意味，即他先成为上帝所喜悦的人，继而“蒙了爱”。
- source_word: ἠγαπήθη
  choice: 蒙了爱
  rationale: 保留希腊文的被动语态，不明说施爱者；上下文自然使人联想到上帝，同时避免补入原文未明说的主语。
- source_word: ζῶν
  choice: 还活……时
  rationale: 体现现在时分词与后面动作同时发生，明确他被接走时仍生活在罪人中间。
- source_word: μεταξὺ ἁμαρτωλῶν
  choice: 在罪人中间
  rationale: 直接保留原文对周围人群的道德称谓及身处其中的空间关系。
- source_word: μετετέθη
  choice: 被接走了
  rationale: 此词可表示被转移、挪去或带走；“被接走”在现代汉语中自然，并能保留死亡、脱离败坏环境及类似以诺被上帝接去等多重可能。
theological_decisions:
- issue: μετετέθη所指的是死亡、上帝挪去，还是类似以诺被接去
  choice: 译作“被接走了”，不明确限定其方式
  alternative: 可译“被挪去了”或“被迁去了”
  rationale: 希腊文只明确表达从原处被转移，并未在本节界定这是通常意义的早逝，还是特殊的神圣接取；译文应保留这种神学张力。
- issue: ἠγαπήθη的施动者是否应明确为上帝
  choice: 保留被动表达“蒙了爱”
  alternative: 译作“蒙上帝爱他”或“为上帝所爱”
  rationale: 上帝很可能是语境中的施爱者，但希腊文此动词没有明说施动者；不补明可忠实保存原句结构及其含蓄表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成了……的人，便……”保留原句的先后关系；“还活在……时”避免读者误解为死后才被转移。脚注标记置于“被接走了”之后，与注释所解释的词准确对应。
