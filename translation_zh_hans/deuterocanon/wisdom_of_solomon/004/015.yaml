  text: For grace and mercy are upon his chosen ones[a], and visitation upon his holy ones.
translation:
  language: zh_hans
  text: 因为恩惠和怜悯临到他所拣选的人；眷顾[a]也临到他的圣洁之人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”所译的希腊词也可指察看、鉴察、巡视或照管；本节与“恩惠和怜悯”并列，侧重慈爱的看顾，但不完全排除察验的意味。
    reason: 说明ἐπισκοπή的语义范围，并保留其可能含有察验意味的歧义。
lexical_decisions:
- source_word: χάρις
  choice: 恩惠
  rationale: 既保留神所赐恩宠、善意的含义，又能与“怜悯”自然并列；相比单用“恩典”，较少预设后来的神学术语含义。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接表达对困苦者的慈悲与宽仁，符合此处神施恩的语境。
- source_word: ἐκλεκτοῖς
  choice: 所拣选的人
  rationale: 准确表达“被选择者”，同时避免用高度术语化的“选民”来加入原文未明确限定的群体身份。
- source_word: ἐπισκοπή
  choice: 眷顾
  rationale: 该词可指察看、鉴察、巡视或照管；因其与“恩惠和怜悯”平行，此处“眷顾”最符合正面语境，但以脚注保留其较宽的语义范围。
- source_word: ὁσίοις
  choice: 圣洁之人
  rationale: 保留ὅσιος所含敬虔、圣洁及忠于神的意味，并避免“圣徒”可能带来的后期教会身份色彩。
- source_word: ἐν
  choice: 临到／眷顾
  rationale: 希腊文两次用ἐν表示恩惠、怜悯和眷顾与这些人的关系。中文分别以“临到”和动词化的“眷顾”表达，使平行意义清楚而不生硬照搬“在……中”。
theological_decisions:
- issue: ἐπισκοπή所指的神圣行动
  choice: 以正面的“眷顾”表达神的照管
  alternative: 鉴察、察看，或包含审判意味的临察
  rationale: “恩惠和怜悯”的直接平行关系明显支持慈爱照管的含义；但该词本身也可指察验或巡视，因此在脚注中保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩惠和怜悯”保留原文并列结构；后半句将抽象名词ἐπισκοπή自然转为动词“眷顾”，避免直译成“眷顾在……中”造成生硬。
