  text: But the righteous man[a], if he dies early, will be at rest.
translation:
  language: zh_hans
  text: 但义人即使早逝，也必得享安息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “早逝”较直译可作“先于预期而死”或“过早死亡”；这里的希腊语表达很可能指在人通常预期的年龄之前死亡。
    reason: 说明φθάσῃ τελευτῆσαι的字面结构及其习语含义。
lexical_decisions:
- source_word: δίκαιος
  choice: 义人
  rationale: 该词在此作名词用，指一位以公义为特征的人；“义人”是现代汉语圣经语体中自然、凝练且不失庄重的表达。
- source_word: ἐὰν
  choice: 即使
  rationale: 形式上引出条件，但上下文具有让步意味：义人纵然早逝，仍得安息；译作“即使”能自然呈现这一转折张力。
- source_word: φθάσῃ τελευτῆσαι
  choice: 早逝
  rationale: φθάνω与“死”的不定式连用，表达在通常预期之前遭逢死亡；“早逝”简洁传达其习语意义，同时以脚注保留较直译的可能。
- source_word: ἐν ἀναπαύσει
  choice: 得享安息
  rationale: 表示处于休息、安歇的状态。“得享安息”符合现代庄重汉语，也保留慰藉意味而不具体界定死后状态。
- source_word: ἔσται
  choice: 必得
  rationale: 对应将来时“将会处于”；结合汉语表达译为“必得享安息”，自然呈现陈述的确定性，并未额外引入因果意义。
theological_decisions:
- issue: 是否把ἐν ἀναπαύσει明确译成特定的死后生命状态
  choice: 得享安息
  alternative: 进入永生／在天上安息
  rationale: 原文只陈述义人将处于安息之中，并未说明其形而上机制或具体所在；因此保留安慰与末世意味，却不加入原文未明说的教义细节。
- issue: ἐὰν应按条件还是让步表达
  choice: 即使
  alternative: 如果
  rationale: ἐὰν本身可译“如果”，但本节以δὲ形成与前文观念的对照，整体意义接近“义人即便早死，仍在安息中”；“即使”更自然地保存这种反常识的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人”“安息”延续广为理解的经文用语；句式简洁，保留原文对早逝与安息之间的张力。
