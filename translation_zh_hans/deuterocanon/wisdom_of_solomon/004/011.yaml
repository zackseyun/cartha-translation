  text: He was taken away, lest evil change his understanding or deceit mislead his soul.
translation:
  language: zh_hans
  text: 他被接去，免得邪恶改变他的悟性，或诡诈迷惑他的心灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: 被接去
  rationale: 该词为被动形式，含突然被夺去、带走之意；结合上下文义人早逝的论述，“被接去”既保留被动性，也不在本节中明说施事者或具体方式。
- source_word: κακία
  choice: 邪恶
  rationale: 概括道德上的恶，保持原文抽象名词的宽泛含义。
- source_word: ἀλλάξῃ
  choice: 改变
  rationale: 直接表达使其发生变化，不额外限定为败坏或扭曲，以保留原文的简洁与张力。
- source_word: σύνεσιν
  choice: 悟性
  rationale: 指理解、辨识和明达的能力；“悟性”在庄重而通俗的经文语体中较为贴切。
- source_word: δόλος
  choice: 诡诈
  rationale: 兼具欺骗手段与奸诈性质，比单纯“欺骗”更能保留名词的道德色彩。
- source_word: ἀπατήσῃ
  choice: 迷惑
  rationale: 表达欺骗而使人走入歧途的结果，也避免与“诡诈”构成生硬的同根重复。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 此处指人的内在生命与自我；“心灵”自然且不把 ψυχή 过度限定为某一种系统神学意义上的“灵魂”。
theological_decisions:
- issue: ἡρπάγη 的施事者及所指事件
  choice: 译作“被接去”，不补出“被上帝接去”或“死亡”
  alternative: “被上帝接走”／“被夺去生命”
  rationale: 希腊文本使用无施事者的被动语态；上下文可以暗示上帝的作为及早逝，但本节本身没有明说，故保留含蓄表达。
- issue: μή 所引目的或防止结果的关系
  choice: 译作“免得”
  alternative: “为要避免”／“恐怕”
  rationale: “免得”自然传达预防性的目的或结果，同时不把因果机制解释得过细。
- issue: ψυχή 的人论含义
  choice: 译作“心灵”
  alternative: “灵魂”／“生命”
  rationale: 避免将词义锁定为与身体截然二分且不朽的实体，也比“生命”更符合被诡诈迷惑的内在主体。
translation_notes:
  register: 采用现代、庄重、简洁的书面普通话。保留原文两分句的平行结构：“邪恶……悟性”与“诡诈……心灵”。不添加原文未明说的施事者，也不以脚注制造不必要的解释。
