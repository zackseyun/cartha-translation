base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/012.yaml
  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
translation:
  language: zh_hans
  text: 因为邪恶的蛊惑使美善之物黯然失色[a][b]，欲望的游移使纯真的心思变质。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛊惑”也可译作“恶意的嫉妒”“恶眼”或“迷惑”；希腊词 βασκανία 可指由嫉妒而来的恶意影响，或有害的影响力。
    reason: lexical_alternative
  - marker: b
    text: “美善之物”也可译作“美好的事物”或“高尚之物”；希腊词 τὰ καλά 同时含有善、美和高贵的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασκανία
  choice: 迷惑
  rationale: 该词可指恶意嫉妒、恶眼或有害的蛊惑力；此处与“邪恶”连用，并以主动的败坏力量出现。“迷惑”在现代汉语中自然，也保留使人判断失真的意味。
- source_word: φαυλότητος
  choice: 邪恶
  rationale: 这里是修饰 βασκανία 的属格，表达源于或属于道德败坏的迷惑；“邪恶”清楚传达伦理意义。
- source_word: ἀμαυροῖ
  choice: 使……黯然失色
  rationale: 原词表示使昏暗、模糊或失去光彩；这一表达保留明暗意象，并能自然搭配“美善之物”。
- source_word: τὰ καλά
  choice: 美善之物
  rationale: καλά兼有美、善、高贵的含义；“美善”比单用“善”更能保留原文的道德—审美双重意味。
- source_word: ῥεμβασμός
  choice: 游荡
  rationale: 该词表示漫游、漂移或心神不定；“游荡”保留原文的动态比喻，而不把它仅解释为分心。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: ἐπιθυμία本身范围较广，语境赋予其负面作用；“欲望”避免将其不必要地限于性欲。
- source_word: μεταλλεύει
  choice: 腐蚀
  rationale: 此处表示使之改变并趋于败坏；“腐蚀”既体现渐进损害，也符合对心思的道德影响。
- source_word: νοῦν
  choice: 心思
  rationale: νοῦς可指思想、理解和道德判断的官能；“心思”在现代汉语中兼顾认知与内在取向。
- source_word: ἄκακον
  choice: 纯真的
  rationale: 该词意为无恶意、无诡诈；“纯真”表达尚未被邪恶污染的状态，同时保持自然庄重。
theological_decisions:
- issue: τὰ καλά 的道德与审美双重含义
  choice: 译作“美善之物”
  alternative: “善事”“美好的事物”“高尚之物”
  rationale: 原词既可指道德上的善，也可指美与高贵；合译“美善”保留其张力，不将经文限缩为单一层面。
- issue: βασκανία 的作用力
  choice: 正文译作“迷惑”，脚注保留“恶意嫉妒／恶眼／蛊惑”的可能
  alternative: “嫉妒”“恶眼”“蛊惑”
  rationale: 语境强调邪恶对美善判断的有害影响。“迷惑”适合正文的现代汉语表达，而脚注说明原词较强且多义的恶意影响。
- issue: ἄκακον 所指的无恶状态
  choice: 译作“纯真的心思”
  alternative: “无邪的心”“无害的心思”“不设防的心思”
  rationale: 原文强调没有恶意或诡诈，并非宣告绝对无罪；“纯真”保留道德未受污染的意味，而不过度教义化。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。用“美善之物”保存 καλά 的道德与审美含义；“欲望的游荡”有意保留希腊文略带陌生感的拟人化结构。正文脚注标记依对应词序列为[a][b]。
