revisions:
- from: 但义人虽已死去[a]，却要定仍活着的不敬虔之人的罪；而迅速达到圆满的青春年华[b]，要定不义之人多年高寿的罪。
  to: 但义人虽已死去[a]，却要判定仍活着的不敬虔之人有罪；迅速得以圆满的青春年华[b]，也要判定不义之人漫长的老年有罪。
  rationale: 修订“多年高寿”为“漫长的老年”，以准确传达πολυετὲς γῆρας且避免褒义色彩；以“判定……有罪”重组两个分句，既使现代汉语清楚自然，也保留原文中义人的早逝和早早完成的青春对不义者仍活着及其漫长老年的审判性见证。脚注锚点及其所保留的词汇替代译法均维持不变。
