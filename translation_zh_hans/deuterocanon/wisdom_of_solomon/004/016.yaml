base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: zh_hans
  text: 但义人虽已死去[a]，却要判定仍活着的不敬虔之人有罪；迅速得以圆满的青春年华[b]，也要判定不义之人漫长的老年有罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人死后”。这里的希腊语分词按上下文指死亡。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“迅速得以完全的青春年华”。这里的“圆满”着重于生命达到完成，并不必然指道德上毫无瑕疵。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινεῖ
  choice: 要定……的罪
  rationale: 表达κατακρίνω宣告有罪、定罪的含义，并让两个并列主语共同支配这一动词，符合汉语表达。
- source_word: δίκαιος
  choice: 义人
  rationale: 保留单数实体化形容词的个人指向，与后文“不义之人”形成清楚对照。
- source_word: καμών
  choice: 虽已死去
  rationale: 按本段早逝语境将κάμνω理解为死亡，并以“虽”自然呈现死者反倒定活人罪的转折张力。
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: 仍活着的不敬虔之人
  rationale: “仍活着”突出他们与已死义人的对比；“不敬虔”保留ἀσεβής在宗教伦理上的色彩。
- source_word: νεότης
  choice: 青春年华
  rationale: 这里指年轻的年龄或人生阶段；“青春年华”比抽象的“青春”更适合与“多年高寿”对举。
- source_word: τελεσθεῖσα
  choice: 达到圆满
  rationale: 保留完成、达至终点的语义，同时不把它限定为道德上毫无瑕疵。
- source_word: ταχέως
  choice: 迅速
  rationale: 直接表达过程很快完成，并保持庄重简洁的语体。
- source_word: πολυετὲς γῆρας
  choice: 多年高寿
  rationale: 自然表达“有许多年岁的老年”，并保留短暂青春与漫长寿数之间的反差。
- source_word: ἀδίκου
  choice: 不义之人
  rationale: 将属格理解为高寿所属的人，且与前面的“义人”保持词义上的鲜明对应。
theological_decisions:
- issue: 如何理解καμών
  choice: 虽已死去
  alternative: 劳苦之后；患病之后
  rationale: κάμνω本可指疲惫或患病，但在《智慧篇》第4章义人早逝的直接语境中，死亡义最合适；脚注仍保留较贴近分词结构的译法。
- issue: 是否用“完全”或“完美”翻译τελεσθεῖσα
  choice: 达到圆满
  alternative: 得以完全；臻于完美
  rationale: “达到圆满”保留生命达到终点或成全的含义，却避免把经文过早解释为绝对的道德完美。
- issue: 第二分句是否补出“定罪”
  choice: 补出“要定……的罪”
  alternative: 仅说青春年华胜过不义之人的高寿
  rationale: 希腊文中κατακρινεῖ同时统摄两个并列主语。汉语补出谓语可清楚保留句法和审判意味，而不是把后半句弱化为一般比较。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“义人／不义之人”和“已死去／仍活着”、“青春年华／多年高寿”构成原文的对照；保留末世或超越现世的定罪张力，不解释定罪发生的具体方式或时间。
