base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: zh_hans
  text: 因为从不法结合所生的儿女，在受审查时，是指证父母恶行的见证人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不法结合”原文直译近于“不法的睡卧”或“不法的床笫”，是指不正当性关系的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: “在受审查时”也可理解为“在父母受审查时”，或较笼统地译作“在查究之下”；原文代词的指代并不完全明确。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων ὕπνων
  choice: 不法床笫
  rationale: ὕπνων字面为“睡卧”，在此委婉指性关系；“床笫”保留原文委婉而庄重的表达，ἀνόμων译作“不法”，传达违反律法或道德秩序之意。
- source_word: τέκνα γεννώμενα
  choice: 所生的儿女
  rationale: 自然表达被生下、成为后代的结果义，并保留分词结构的被动意味。
- source_word: μάρτυρές εἰσιν
  choice: 就是……见证人
  rationale: 保留原文谓语名词及司法语感，不弱化为一般性的“证据”。
- source_word: πονηρίας κατὰ γονέων
  choice: 指证父母恶行
  rationale: κατά加属格在此有针对、控告的意味；此译法既呈现不利于父母的见证，也使πονηρίας所指的道德恶行清楚自然。
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: 在受察验时
  rationale: ἐξετασμός可指察验、审查或查究；采用“受察验”保留司法色彩。αὐτῶν的指代存在歧义，正文按最近的复数先行词“儿女”理解，另一可能见脚注。
theological_decisions:
- issue: ἀνόμων ὕπνων的道德性质与委婉语体
  choice: 不法床笫
  alternative: 不法结合；邪恶的性关系
  rationale: 此译既保留原文对这种关系的否定判断，也避免使用比希腊文更直露或更具特定制度含义的说法。
- issue: αὐτῶν在ἐν ἐξετασμῷ αὐτῶν中的指代
  choice: 理解为儿女受察验
  alternative: 理解为父母受审查，或泛指在查究之下
  rationale: “儿女”是最近且语法上自然的复数先行词，但原文代词并未明说所指，因此以脚注保留其他理解。
- issue: 见证针对谁以及见证什么
  choice: 儿女作为见证人指证父母的恶行
  alternative: 儿女是关于父母恶行的证据
  rationale: κατὰ γονέων带有不利于父母的司法意味，而πονηρίας说明所见证的是恶行；正文保留人格化的“见证人”，不将其完全解释为非人格的证据。
translation_notes:
  register: 采用现代、庄重且可理解的书面汉语。“床笫”略带文学色彩，但能准确保留原文委婉语体；“察验”“指证”“见证人”共同维持经文的司法语感。
