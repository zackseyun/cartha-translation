base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/014.yaml
  text: For his soul was pleasing to the Lord; therefore he hastened him out of the midst of wickedness. But the peoples, seeing and not understanding, nor taking such a thing to heart,
translation:
  language: zh_hans
  text: 因为他的灵魂蒙主喜悦，所以主赶紧把他从邪恶中带走。[a]众人虽然看见了，却不明白，也没有把这样的事放在心上，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以主迅速使他离开邪恶。”原文动词强调迅速；“邪恶”也可译为“败坏”。
    reason: 说明ἔσπευσεν所强调的迅速动作，并提示πονηρία在此可指道德邪恶或败坏。
lexical_decisions:
- source_word: ἀρεστὴ ... Κυρίῳ
  choice: 蒙主喜悦
  rationale: 表达“为主所喜悦、所悦纳”的关系意义，现代中文自然庄重，也保留原文被动意味。
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: 他的灵魂
  rationale: ψυχή在此指人的内在生命或灵魂；采用“灵魂”以保留智慧文学中的人观与神学分量。
- source_word: ἔσπευσεν
  choice: 主催促他离开
  rationale: 原动词强调迅速、急切；补出由上文隐含的主语“主”，并用“催促……离开”保留使其迅速脱离的动态含义。
- source_word: ἐκ μέσου πονηρίας
  choice: 离开邪恶之中
  rationale: 保留原文从邪恶环境内部被带出的空间隐喻；πονηρία可指邪恶、恶行或败坏。
- source_word: οἱ δὲ λαοὶ
  choice: 众人
  rationale: λαοί形式为复数，但此处泛指看见这事的人群；“众人”在中文中自然，并可涵盖复数群体而不误导为多个民族。
- source_word: ἰδόντες καὶ μὴ νοήσαντες
  choice: 虽然看见了，却不明白
  rationale: 将希腊语分词结构化为自然中文让步转折，保留“看见”与“不理解”的鲜明对照。
- source_word: μηδὲ θέντες ἐπὶ διανοίᾳ
  choice: 也没有……放在心上
  rationale: 原义为“放在心思上”，是认真思量的习语；“放在心上”既贴近意象，也符合现代中文。
- source_word: τὸ τοιοῦτο
  choice: 这样的事
  rationale: 宽泛指向前述神的行动，不额外限定其具体内涵。
theological_decisions:
- issue: ἔσπευσεν的隐含主语
  choice: 补明为“主催促他离开”
  alternative: 不明确主语，译作“所以他便迅速离开”或“所以有人赶紧使他离开”
  rationale: 紧接前句的“主”是最自然的隐含主语，上下文也把义人早逝描述为神使其脱离邪恶；补明主语有助于中文清晰，但不增加原文之外的神学主张。
- issue: 义人被移离邪恶的动作色彩
  choice: 保留“催促”的急切意味
  alternative: 平顺地译作“把他迅速带离”或“使他早早离开”
  rationale: ἔσπευσεν本身突出迅速与急切，不宜仅译成中性的“带走”；正文保留动态表达，脚注说明另一种自然译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。经文在本节末仍以逗号收束，以反映希腊原文句法尚未完结，并与下一节衔接。
