base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: zh_hans
  text: 因为它即使一时在枝条间抽芽[a]，立足不稳，必被风摇动；又必因风势猛烈而被连根拔起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抽芽”也可译作“萌发”或“一时发芽”；希腊文保留植物暂时生长的意象。“重新萌发”是可能的理解，但“重新”并非必须明说。
    reason: lexical_alternative
  - marker: b
    text: 本节的单数主语承接上一节的植物比喻；原文在这里没有明说它所指的是谁。
    reason: cross_reference
lexical_decisions:
- source_word: κἂν
  choice: 即使
  rationale: καὶ ἐάν的缩合形式，引出让步条件；“即使”在现代汉语中准确自然。
- source_word: ἐν κλάδοις
  choice: 在枝条间
  rationale: 原文没有明确的物主代词；“在枝条间”保留植物意象，也避免补入“它的”。
- source_word: πρὸς καιρόν
  choice: 一时
  rationale: 表示持续时间短暂；“一时”简洁保留其暂时性。
- source_word: ἀναθάλῃ
  choice: 重新萌发
  rationale: 该词可指再次抽芽、萌发；“重新萌发”保留ἀνα-可能具有的再度生长意味及植物意象。
- source_word: ἐπισφαλῶς βεβηκότα
  choice: 根基仍不稳
  rationale: 直义近于“立得不稳”；在植物语境中译作“根基不稳”自然地表达其立足不牢，同时为下文“连根拔起”铺陈。
- source_word: σαλευθήσεται
  choice: 必被风摇动
  rationale: 未来被动式表示将受风撼动；“被……摇动”直接保留被动关系。
- source_word: ὑπὸ βίας ἀνέμων
  choice: 被狂风
  rationale: βία表示力量或猛烈程度；“狂风”以自然汉语浓缩表达“风的猛烈力量”，并保留复数风势的加强作用。
- source_word: ἐκριζωθήσεται
  choice: 连根拔起
  rationale: 准确传达“拔除根部”的植物意象，比单说“拔除”更具体。
theological_decisions:
- issue: 本节省略主语，而单数动词承接上文关于无根植物的比喻
  choice: 使用“它”，不明说是“孩子”或“后裔”
  alternative: 将主语解释性译为“那孩子”或“那些后裔”
  rationale: 希腊文以单数形式延续植物比喻，并未在本节明指所喻对象；“它”既使汉语句子完整，又不提前消解比喻及其指涉张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“根基仍不稳”把希腊文“立得不稳”放入植物语境表达；全句保留从暂时萌发、受风摇动到连根拔起的递进。
