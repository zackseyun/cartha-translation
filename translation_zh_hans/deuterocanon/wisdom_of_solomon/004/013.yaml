  text: having been perfected in a short time[a], he fulfilled long years;
translation:
  language: zh_hans
  text: 他在短时间内被成全，便补足了漫长的岁月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειωθεὶς
  choice: 达到完满
  rationale: 该词是 τελειόω 的不定过去时被动分词，表示被带到完成、成熟的状态。中文用“达到完满”自然表达结果，又不将其限定为抽象意义上的绝对无罪。
- source_word: ἐν ὀλίγῳ
  choice: 在短时间内
  rationale: 此短语指短暂的时间，与后文“漫长的岁月”形成鲜明对照。
- source_word: ἐπλήρωσεν
  choice: 度尽
  rationale: πληρόω 在这里含有充满、完成之意；“度尽”适合与“岁月”搭配，表达短暂一生已具有漫长年日的圆满分量。
- source_word: χρόνους μακρούς
  choice: 漫长的岁月
  rationale: χρόνους 字面为“时间、时期”，在寿命语境中可自然译作“岁月”；“漫长”保留与“短时间”的对比。
theological_decisions:
- issue: 义人早逝语境中“完满”的含义
  choice: 译作“达到完满”，保留生命虽短却已臻于完成或成熟的意思。
  alternative: “被成全”或“达到成熟”
  rationale: 原文被动形式可以暗示他被带到完满，但未明说施动者；正文采用自然中文而不把它解释成绝对的道德无罪，也不消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“虽……却……”明确呈现原句中短暂与漫长的反差；正文保留诗性，不作额外教义解释。
