  text: Then the righteous man will stand with great boldness before those who afflicted him[a].
translation:
  language: zh_hans
  text: 那时，义人必以极大的胆量站在那些苦待他的人面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……面前”：希腊文直译为“在……的脸前”；这里指直接面对那些苦待他的人。
    reason: 说明κατὰ πρόσωπον的字面形象及其在本句中的直接面对之意，避免“脸面”一词可能带来的“体面、声誉”联想。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 承接前文所述的审判场景，标明随后发生的情形；“那时”自然且庄重。
- source_word: στήσεται
  choice: 必……站在
  rationale: 这是ἵστημι的将来时中间语态，在此作不及物用，表示义人将站立或挺身而立；“必……站在”既表达将来语气，也不额外引入使役含义。
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: 坦然无惧地
  rationale: παρρησία可指勇气、信心或公开直言；在义人获得伸张、面对迫害者的语境中，“坦然无惧”自然传达公开而毫不畏缩的姿态。
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 希腊文为阳性单数的名词化形容词，指上下文中的典型义者；“义人”保留单数及智慧文学的传统称谓，同时可具有代表性。
- source_word: κατὰ πρόσωπον
  choice: 在……面前
  rationale: 该短语字面涉及“脸面”，惯用义是处在某人面前；中文“在……面前”自然，并保留直接面对、当面对质的意味。
- source_word: τῶν θλιψάντων αὐτὸν
  choice: 那些曾苦待他的人
  rationale: θλίβω表示使人受苦、受压或遭患难；“苦待”涵盖敌意造成的痛苦与压迫，又不把含义局限于政治或经济压迫。
theological_decisions:
- issue: ὁ δίκαιος的阳性单数及代表性
  choice: 义人
  alternative: 正义的人；那义者
  rationale: 原文刻画一位单数的典型义人。中文“义人”没有强行添加“男人”，却保留了单数称谓及其可能的代表性，不把人物解释为某一特定身份。
- issue: παρρησία在伸冤场景中的含义
  choice: 坦然无惧
  alternative: 大有胆量；满有信心
  rationale: 此处既可能包含勇气，也可能包含公开、自由面对迫害者的信心。“坦然无惧”保留这种语义张力，不将其收窄为内在确信或言语上的直率。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“坦然无惧”体现司法伸张场景中的勇气和公开信心；“曾苦待”用“曾”明确分词所指的先前行为。
