base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/005.yaml
  text: Unfinished branches will be broken off[a], and their fruit is useless, unripe for eating and fit for nothing[b];
translation:
  language: zh_hans
  text: 未长成的枝条必被折断[a]；它们的果实毫无用处，尚未成熟，不能食用[b]，也派不上任何用场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未长成的枝条”也可译作“幼嫩的枝条”；希腊语形容词指尚未达到完成状态。
    reason: lexical_alternative
  - marker: b
    text: “尚未成熟，不能食用”也可译作“过早，不宜食用”。在果实的语境中，“尚未成熟”更贴合这一意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  choice: 必被折断
  rationale: 保留将来时的结果意味和被动语态；“折断”自然呈现枝条遭毁折的意象，不强行细化为从树上“折下”。
- source_word: κλῶνες
  choice: 枝条
  rationale: 采用清楚、现代的植物用语，保留原文的农业比喻。
- source_word: ἀτέλεστοι
  choice: 未长成的
  rationale: 表达尚未达到完成或成熟状态；既贴近词义，也符合枝条的具体语境，同时不把比喻直接解释为后代。
- source_word: καρπὸς
  choice: 果实
  rationale: 保留字面的植物意象，并与“枝条”自然衔接。
- source_word: ἄχρηστος
  choice: 毫无用处
  rationale: 直接表达无用、不能发挥功用之意，语气明确而不额外引入道德评断。
- source_word: ἄωρος
  choice: 尚未成熟
  rationale: 该词可指不合时或过早；用于果实和食用的语境时，“尚未成熟”最自然，同时以脚注保留另一可能。
- source_word: εἰς βρῶσιν
  choice: 不能食用
  rationale: 按上下文表达果实因未成熟而不适合食用，比逐字译为“为了食用”更符合现代汉语。
- source_word: εἰς οὐδὲν ἐπιτήδειος
  choice: 派不上任何用场
  rationale: 自然传达“对任何事都不适用”的全面否定，并保留原文在“毫无用处”之后的强调性重复。
theological_decisions:
- issue: 农业意象在上下文中的比喻所指
  choice: 正文保留“枝条”和“果实”的字面意象，不明说其所指。
  alternative: 解释性译为“不敬虔者的后代必衰败”等。
  rationale: 上下文虽指向不敬虔者的后代，本节却以农业意象陈述。保留比喻可避免把上下文解释直接写入经文，也保留其文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文的农业比喻、被动表达及末尾对“无用”的强调性复述；分号对应两个紧密相连的分句。
