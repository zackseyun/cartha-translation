base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: zh_hans
  text: 因为他们会看见智慧人的结局[a]，却不明白主对他有何安排，也不明白主使他安稳是为了什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧人的死亡。”希腊语τελευτή既可指“结局”，也可指“死亡”；正文采用“结局”，以保留上下文中较宽的含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不明白主保守他，是要达到什么目的。”希腊原文没有说明这种安稳或保守的具体性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: 他们会看见
  rationale: 直译将来时的感知动作，现代汉语自然清楚。
- source_word: τελευτὴν
  choice: 结局
  rationale: τελευτή既可指“终结”，也可具体指“死亡”。“结局”保留较宽的语义，并与上下文中旁观者只见表象、却不懂上主旨意的反差相呼应。
- source_word: σοφοῦ
  choice: 智慧人
  rationale: 希腊文为阳性单数，指有智慧的人；“智慧人”简洁、庄重，也符合智慧文学的表达习惯。
- source_word: οὐ νοήσουσιν
  choice: 却不明白
  rationale: νοέω在此指未能领会所见之事的意义；“明白”符合现代汉语，同时“却”体现语境中的转折。
- source_word: ἐβουλεύσατο
  choice: 作了什么打算
  rationale: 中间语态表达主对这人的旨意或筹划；“作了什么打算”自然传达有意识的谋划，又不额外规定其具体内容。
- source_word: περὶ αὐτοῦ
  choice: 为他
  rationale: περί加属格通常可指“关于他”；在“打算”的汉语搭配中译作“为他”更自然，也可表达涉及此人的安排，但不把内容具体化。
- source_word: εἰς τί
  choice: 究竟是为了什么
  rationale: 保留该短语指向目的或终向的力量；“究竟”凸显旁观者未能理解的意味。
- source_word: ἠσφαλίσατο
  choice: 使他安稳
  rationale: ἀσφαλίζω含使之稳固、安全之意。“使他安稳”保留使役意味，同时不限定这是肉身保护、属灵保守还是末世性的安全。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按中文圣经惯用法译为“主”，庄重且自然。
theological_decisions:
- issue: τελευτή是专指智慧人的死亡，还是兼含更广的终局
  choice: 正文译作“结局”
  alternative: 死亡；终结
  rationale: 上下文确实涉及义人的死亡，但本节将旁观者所见与他们不明白的神圣旨意相对照。“结局”既可涵盖可见的死亡，也为上主所定的更完整终局保留空间。
- issue: ἠσφαλίσατο αὐτὸν所指的保障性质
  choice: 译作“主使他安稳”
  alternative: 主保护了他；主使他安全；主保守他
  rationale: 原文没有说明这种安稳的具体方式。较宽泛的译法保留了表面死亡与在主里面真实稳妥之间的神学张力，避免将其缩减为肉身免受伤害。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧人”保留智慧文学色彩；两个“不明白”形成平行结构，使长句关系清晰。正文与脚注均避免把“安稳”具体解释为肉身安全或某一种末世论结论。
