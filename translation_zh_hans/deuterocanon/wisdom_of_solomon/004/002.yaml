base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: zh_hans
  text: 她在时，人们效法她；她离去后，人们就思慕她。她在万世中[a]头戴胜利的花冠，凯旋而行，已在那场奖赏纯洁无瑕的竞赛中获胜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远。”希腊语直译为“在世代中”，可表示长久延续、历久不衰。
    reason: 保留 αἰών 在“世代、长久时期、永远”之间的词义幅度。
lexical_decisions:
- source_word: παροῦσάν
  choice: 她在的时候
  rationale: 按 πάρειμι 的“在、临在”义翻译，并与 ἀπελθοῦσαν“离去以后”形成鲜明对照；避免译作“在世”而把含义限定为仍然活着。
- source_word: μιμοῦνται
  choice: 效法她
  rationale: 准确表达“模仿、仿效”，在现代汉语中自然庄重，也适合德行人格化的语境。
- source_word: ποθοῦσιν
  choice: 仍思念她
  rationale: 表达强烈的怀念和渴慕；“仍”虽非独立对应某一希腊词，却自然显明她离去之后思念持续存在。
- source_word: ἀπελθοῦσαν
  choice: 她离去以后
  rationale: 保留不定过去分词所表示的先行、已完成的离去，并与前句的“在”相对。
- source_word: ἐν τῷ αἰῶνι
  choice: 在久远的世代中
  rationale: 保留 αἰών 可指世代或长久时期的宽度，不在正文中径直限定为形而上的“永恒”；脚注列出“永远”这一自然译法。
- source_word: στεφανηφοροῦσα
  choice: 头戴胜利的花冠
  rationale: 呈现佩戴冠冕的具体形象，并以“胜利的花冠”保留古代竞赛优胜者所戴花冠的意象。
- source_word: πομπεύει
  choice: 列队凯旋
  rationale: 表达参加公开、荣耀而带有凯旋意味的行列；措辞简洁，并与花冠和竞赛的整体图像协调。
- source_word: ἀμιάντων ἄθλων
  choice: 纯洁无瑕的奖赏
  rationale: ἀμίαντος 表示未受沾染、无玷污；“纯洁无瑕”在现代汉语中自然，并保留道德纯净的意味。ἆθλον 则译为竞赛所得的“奖赏”。
- source_word: ἀγῶνα
  choice: 竞赛
  rationale: 保留运动竞技的语义场，不把它缩窄为赛跑，也不泛化为一般斗争。
- source_word: νικήσασα
  choice: 已经……得胜
  rationale: 体现不定过去分词所表示的胜利已先于凯旋行列完成，同时保持竞技语境。
theological_decisions:
- issue: 阴性代词所指
  choice: 保留人格化的“她”
  alternative: 改用抽象名词“德行”或“美德”重复指称
  rationale: 本节承接上下文对德行的阴性人格化。保留“她”既忠于希腊语形式，也不把文学张力消解成纯抽象陈述。
- issue: ἐν τῷ αἰῶνι 的时间范围
  choice: 正文译作“在久远的世代中”
  alternative: “永远”或“在永恒中”
  rationale: 该短语可强调历久不衰的尊荣，也可能带有永久意味。正文不将它过早技术化为形而上的永恒，脚注则保留“永远”的可能。
- issue: ἀμιάντων 所修饰的对象
  choice: 理解为修饰“奖赏”，译作“纯洁无瑕的奖赏”
  alternative: 将“无玷污”理解为参赛者或竞赛本身的性质
  rationale: 希腊语属格短语最直接地把 ἀμιάντων 与 ἄθλων 联系起来；译文保持这种语法关联，同时不进一步解释奖赏具体为何。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前半节以“在／离去”保持简洁对照；后半节连续保留花冠、凯旋行列、竞赛和奖赏的竞技意象。脚注标记置于其实际解释的“在久远的世代中”之后。
