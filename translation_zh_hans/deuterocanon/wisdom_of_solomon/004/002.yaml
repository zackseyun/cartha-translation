    rationale: νικήσασα是分词，表示凯旋前已经取得胜利，但并未以连接词明示“因为”。中文宜用“已在……中获胜”作为伴随或先行说明。
  - severity: low
    issue: “列队凯旋”不适合单数的拟人主体。
    rationale: πομπεύει指参加或进行公开行列；“凯旋而行”保留庆典/行进意味，且不暗示她与他人列队。
  - severity: low
