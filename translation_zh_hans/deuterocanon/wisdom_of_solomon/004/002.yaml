revisions:
- from: 她在的时候，人们效法她；她离去以后，人们仍思念她。她在久远的世代中[a]头戴胜利的花冠，列队凯旋，因为她已在争夺纯洁无瑕奖赏的竞赛中得胜。
  to: 她在时，人们效法她；她离去后，人们就思慕她。她在万世中[a]头戴胜利的花冠，凯旋而行，已在那场奖赏纯洁无瑕的竞赛中获胜。
  rationale: 修订仅处理分词的句法关系、单数主体与“列队”之间的不协调，以及αἰών的单复数表达。修订后仍保留原文对人格化美德的描写、持续的荣誉、胜利花冠、凯旋行列和无瑕奖赏的竞赛，不对其神学或具体奖赏内容作额外解释。
