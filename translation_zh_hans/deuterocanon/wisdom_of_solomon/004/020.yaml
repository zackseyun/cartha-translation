base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/020.yaml
  text: They will come in fear[a], reasoning over their sins[b], and their lawless deeds will convict them to their face.
translation:
  language: zh_hans
  text: 他们必胆怯[a]地前来，思量自己的罪过；他们的不法行为必当面[b]指证他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胆怯”也可译作“畏惧”或“恐惧”；此词也带有怯懦、畏缩的意味。
    reason: lexical_alternative
  - marker: b
    text: “当面”原文直译为“从对面”，表示他们自己的不法行为正面与他们对质，并指证他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται
  choice: 必……前来
  rationale: 这是ἔρχομαι的将来时中间形式；用“前来”保留基本的趋向意义，“必”体现将来陈述在本语境中的确定性。
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: 思量自己的罪过
  rationale: συλλογισμός可指推想、思考或盘算；这里表达他们对自身罪过的内在思量，但不额外加入“悔恨”等原文未明说的情感。
- source_word: δειλοί
  choice: 胆战心惊地
  rationale: δειλός可指胆怯、畏惧；此处作述语并在汉语中自然转为方式状语，既传达恐惧，也保留怯懦畏缩的色彩。
- source_word: ἐλέγξει
  choice: 必……指证
  rationale: ἐλέγχω在此具有揭露并证实有罪的司法性含义；“指证”能自然表达他们自己的行为反过来成为罪证。
- source_word: ἐξ ἐναντίας
  choice: 当面
  rationale: 该短语字面表示“从对面”，在这里描绘不法行为正面与他们对质；“当面”保留公开、直接对质的形象。
- source_word: τὰ ἀνομήματα
  choice: 不法行为
  rationale: ἀνόμημα着重违反法律或正当秩序的行为；译作“不法行为”与前面的“罪过”有所区别，也保留原文的递进。
theological_decisions:
- issue: “罪过”与“不法行为”的关系
  choice: 分别译出ἁμαρτήματα和ἀνομήματα，不将二者合并为同一用语
  alternative: 两处均译作“罪”
  rationale: 原文使用两个相关而不同的道德词语：先写他们思量自己的罪过，再写其不法行为出面指证他们。保留区别可呈现原文由内心思量转向客观罪证的张力。
- issue: 指证者与受审者的关系
  choice: 保留“不法行为”作主语，指证行为人本人
  alternative: 意译为“他们将因自己的不法行为被定罪”
  rationale: 原文以人格化方式让不法行为主动指证他们；直译此结构保留了罪行与作恶者正面对质的鲜明意象。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“胆战心惊地前来”使希腊文中作述语的δειλοί在汉语里自然顺畅；分号呈现前后两幅相连的图景：罪人内心思量罪过，以及不法行为公开指证他们。
