base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: zh_hans
  text: 无子女而有德行更好；因为在对她的记念中有不朽，她在上帝和世人那里都被认识[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”按语法最可能指“德行”。也有人认为是指“无子女的状态”，或指一位无子女的女子。原文“世人”泛指所有人。
    reason: 保留阴性代词所指的真实歧义，并说明ἀνθρώποις的泛指意义。
lexical_decisions:
- source_word: κρείσσων
  choice: 胜过别的景况
  rationale: 这是表比较的谓语形容词；中文补出“别的景况”，使独立经句自然，同时不擅自限定具体比较对象。
- source_word: ἀτεκνία
  choice: 无子女
  rationale: 表示没有子女的状态；比“不育”更宽泛，不把经文限定为生理上的不能生育。
- source_word: μετὰ ἀρετῆς
  choice: 有德行而
  rationale: ἀρετή在此指道德上的美善；此表达自然地把德行与无子女的状态联系起来。
- source_word: ἀθανασία
  choice: 不朽
  rationale: 保留本书重要词汇的强度，也适合本句借着长存的记念表达不朽的语境。
- source_word: ἐν μνήμῃ αὐτῆς
  choice: 德行被人记念，就有不朽
  rationale: 将最可能的阴性先行词ἀρετή明确译出，以免中文代词所指含混；同时用“被人记念”表达ἐν μνήμῃ的语义。
- source_word: γινώσκεται
  choice: 被认识
  rationale: 直接保留被动语态及“认识、认可”的语义范围，不将其缩窄为“称赞”或“接纳”。
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: 在上帝和世人那里都
  rationale: παρά加与格表示在某者那里、在其评断或认知范围中；“世人”准确表达ἀνθρώποις泛指人类，并非仅指男性。
theological_decisions:
- issue: ἐν μνήμῃ αὐτῆς及后续阴性主语的所指
  choice: 正文按“德行”理解
  alternative: 也可指无子女的状态，或含蓄所指的无子女女子
  rationale: ἀρετή是较近且在论证上更连贯的先行词：有德行的无子女状态之所以更好，是因为德行得着长存的记念，并为上帝和人所认识。脚注保留其他语法可能，不把真实歧义抹去。
- issue: ἀθανασία的含义
  choice: 译作“不朽”
  alternative: 可按语境解释为“永远留名”或“不被遗忘”
  rationale: 原词本身是“不死、不朽”，正文应保留其神学和修辞张力，不直接把它化约为身后名声。
- issue: παρὰ θεῷ的关系含义
  choice: 在上帝那里被认识
  alternative: 被上帝认识；在上帝面前得到认可
  rationale: 希腊语可涵盖认识与评价；正文采用较形式对应的表达，以免过度解释为神的赞许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文将希腊语阴性代词最可能的所指“德行”明确化，但随后保留“她”，既反映原文的拟人色彩，也由脚注说明其他可能。比较项未见于本节原文，因此用宽泛的“别的景况”，并在脚注交代。
