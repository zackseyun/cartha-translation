base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: zh_hans
  text: 但毒蛇的牙齿未能胜过你的儿子们，因为你的怜悯前来援助他们，并医治了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱούς
  choice: 众子
  rationale: 希腊语为阳性复数“儿子们”，在此指上帝的子民以色列；译作“众子”保留原文性别与庄重语体。
- source_word: ἰοβόλων
  choice: 喷毒
  rationale: 该复合词含有投射、放出毒液之意；“喷毒”比泛称“有毒”更贴近词形，同时在现代汉语中清楚自然。
- source_word: δρακόντων
  choice: 蛇
  rationale: 结合旷野中毒蛇咬人的语境，此词指蛇类；译作“蛇”可避免现代读者误解为神话中的龙。
- source_word: ἐνίκησαν
  choice: 没有胜过
  rationale: 保留动词“征服、战胜”的形象，表达蛇牙最终未能制伏上帝的众子。
- source_word: ἀντιπαρῆλθεν
  choice: 前来援助
  rationale: 这是较罕见的复合动词，在此表示上帝的怜悯临到并与危害相抗；“前来援助”自然传达介入救助之意。
- source_word: ἰάσατο
  choice: 医治了
  rationale: 直接对应医治、使痊愈的常用含义，也与被蛇咬伤的语境相合。
theological_decisions:
- issue: “你的众子”的所指
  choice: 保留对上帝的第二人称称呼，并把以色列人称为“你的众子”。
  alternative: 译作“你的儿女”或“你的子民”。
  rationale: 原文明确使用阳性复数“儿子们”，本节回顾旷野中的以色列；保留“众子”既忠于措辞，也不额外引入有关其范围的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“喷毒蛇”保留原文生动的毒液意象；“没有胜过”与“前来援助”兼顾原文修辞和汉语自然度。
