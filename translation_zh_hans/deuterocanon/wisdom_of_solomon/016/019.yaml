base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/019.yaml
  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
translation:
  language: zh_hans
  text: 但有时，火甚至在水中也燃烧，超越了火本身的力量[a]，为要毁灭大地所生的不义之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“超越火的力量”；意思也可能是，火虽被水包围，仍发挥出超过通常限度的威力。
    reason: 说明希腊文的悖论性表达及其可能含义。
  - marker: b
    text: 直译“大地所生的不义之物”。这句话也可能指与不义之人有关的大地出产，但原文直接称所生之物为“不义的”。
    reason: 保留ἄδικον与γῆς γέννημα之间不寻常的修饰关系。
lexical_decisions:
- source_word: ποτὲ δὲ
  choice: 但有时
  rationale: ποτέ在此可表示某时或有时；“但有时”既承接上下文的对比，也不过度限定为单独一次事件。
- source_word: μεταξὺ ὕδατος
  choice: 在水中
  rationale: 保留火处于水中的反常景象；“在水中”是现代汉语自然、清楚的方位表达。
- source_word: ὑπὲρ τὴν πυρὸς δύναμιν
  choice: 超越了火本身的力量
  rationale: ὑπέρ加宾格表达超过；直译其悖论性说法，不把“力量”解释性改写成火势或烈度。
- source_word: φλέγει
  choice: 火……燃烧起来
  rationale: 动词意为燃烧、炽燃；根据上下文补出隐含主语“火”，使汉语句子明确。
- source_word: ἵνα
  choice: 为要
  rationale: 保留目的从句的语义，同时采用庄重而易懂的现代汉语。
- source_word: ἄδικον
  choice: 不义的
  rationale: 保留该词在智慧文学语境中的道德含义，不弱化为一般的“不当”或仅法律意义的“不公”。
- source_word: γῆς γέννημα
  choice: 大地所生之物
  rationale: γέννημα指所生、所产之物；这一译法兼容出产、作物或后代等语义，不把所指过早限定为庄稼。
- source_word: διαφθείρῃ
  choice: 毁灭
  rationale: 此处表示使之败坏、灭亡；“毁灭”符合审判语境并保持力度。
theological_decisions:
- issue: ἄδικον修饰γῆς γέννημα所形成的道德张力
  choice: 大地所生的不义之物
  alternative: 不义之人的地上出产
  rationale: 希腊文直接把“不义的”用于“所生之物”，没有明说它属于不义之人。正文保留这种不寻常的修饰关系，不替作者解释其道德归属；脚注提示可能的语境理解。
- issue: 火“超越自身力量”的悖论
  choice: 超越了火本身的力量
  alternative: 燃烧得比平常更猛烈
  rationale: 原文有意描写受造元素超越通常能力的反常现象；不将其平化为单纯的火势增强。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“为要”略带经文语体，但普通读者仍易理解；全句保留火在水中燃烧、并超越自身力量的鲜明悖论。
