  terminology: “得救”对应ἐσώζετο，并与“救主”形成恰当呼应。“万有的救主”不将πάντων限定为“所有人”，也不将其专断地限定为“万物”。脚注保留“不是借着……而是借着……”的因果／工具对照，避免把可见标记说成自主的拯救原因。
