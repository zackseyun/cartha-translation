base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
translation:
  language: zh_hans
  text: 因为，那转过身来的人[a]得救，不是借着所看见的，而是借着你[b]——万有的救主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转过身来的人”也可译作“转向的人”或“转身的人”。希腊文着重于转向指定标记的动作；这个词本身并未明确表达“悔改”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“不是借着那被观看的，而是借着你”。这句话强调，可见的对象本身并不施行拯救；真正施行拯救的是上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: 那转身望去的人
  rationale: 该不定过去时被动分词在这里名词化，指转向指定标记的人。“转身望去”以自然汉语表达其方向性，并结合语境说明其转向观看，但不把这个词直接解释为“悔改”或“归信”。
- source_word: θεωρούμενον
  choice: 他所注视的事物
  rationale: 该现在时被动分词名词化，指正在被观看的对象。“所注视的事物”保留观看对象的含义，也使它与真正施行拯救的上帝形成清楚对照。
- source_word: ἐσώζετο
  choice: 得救
  rationale: 未完成时被动语态在本句中说明得救的事实或过程；“得救”是简洁自然的汉语表达，并与后面的“救主”保持词义呼应。
- source_word: σωτῆρα
  choice: 救主
  rationale: 这是对上帝的称号，指出他才是拯救的真正来源。“救主”庄重、通行，也保留原文的神学分量。
- source_word: πάντων
  choice: 万有的
  rationale: 该属格复数范围宽泛，既可涉及所有人，也可泛指一切。“万有的”保留其综合性，不在正文中限定为仅指人或仅指万物。
theological_decisions:
- issue: 可见标记与上帝之间的因果对照
  choice: 得救不是靠所注视的事物，而是靠上帝
  alternative: 可见之物本身作为施行拯救的工具
  rationale: 原文用“οὐ διὰ…ἀλλὰ διὰ…”作明确对照，否定可见对象本身是拯救的根源，并肯定上帝才是拯救者；译文同时不否认该标记在叙事中的作用。
- issue: 神圣称号中 πάντων 的范围
  choice: 万有的救主
  alternative: 所有人的救主；万物的救主
  rationale: 原文没有限定 πάντων 的范围。“万有”保留其宽广性，避免把经文直接解释为只关乎人类、只关乎受造物，或据此推导特定的普救结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“靠……而是靠……”自然呈现希腊文的工具或原因对照；破折号突出“万有的救主”是对“你”的同位说明。所有脚注标记均已置于正文相应位置。
