base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: zh_hans
  text: 蝗虫和苍蝇的叮咬杀死了他们；他们的性命没有得到医治[a]，因为他们配受这类事物的惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的灵魂没有得到医治。”这里译作“性命”，因为上下文说的是人因这些生物的叮咬而死亡。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这类生物”；希腊原文较宽泛，直译为“这类事物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δήγματα
  choice: 咬
  rationale: 该词可指动物或昆虫造成的咬伤、叮伤；此处与蝗虫和苍蝇并用，以“咬”简洁自然，也不细化伤害机制。
- source_word: ἀκρίδων
  choice: 蝗虫
  rationale: ἀκρίς通常指蝗虫，在灾祸语境中译作“蝗虫”准确且符合圣经汉语习惯。
- source_word: μυιῶν
  choice: 苍蝇
  rationale: 该词的普通含义就是苍蝇，原文没有依据进一步限定种类。
- source_word: ἀπέκτεινεν
  choice: 咬死
  rationale: 原文动词明确表示致死；与前面的δήγματα合译为“咬死”，使现代汉语流畅，并保留因咬伤而死亡的因果关系。
- source_word: οὐχ εὑρέθη ἴαμα
  choice: 无药可救
  rationale: ἴαμα指医治、疗法或药方；“无药可救”自然表达找不到救治办法的被动结果，同时与死亡语境吻合。
- source_word: τῇ ψυχῇ αὐτῶν
  choice: 他们的性命
  rationale: ψυχή在此处关乎昆虫咬伤导致的肉身死亡，因此译作“性命”比“灵魂”更贴合上下文，又保留生命含义。
- source_word: ἄξιοι ἦσαν
  choice: 他们配受
  rationale: 该短语表达相称性和应得性；“配受”较贴近原文，同时在现代汉语中清楚传达他们应受惩罚。
- source_word: ὑπὸ τοιούτων
  choice: 这类东西
  rationale: 原文表述宽泛，并未明确说“这类生物”；译作“这类东西”保留其指涉上的开放性。
- source_word: κολασθῆναι
  choice: 受……惩罚
  rationale: 此处指惩戒性的审判；“受惩罚”直接、自然，不额外加入折磨或管教等意味。
theological_decisions:
- issue: 死亡与医治语境中ψυχή的含义
  choice: 性命
  alternative: 灵魂
  rationale: 本节谈昆虫咬伤、死亡以及没有救治办法，故“性命”最符合直接语境；脚注保留“灵魂”这一形式上更直译的可能，避免抹去原词的语义张力。
- issue: ἄξιοι ἦσαν……κολασθῆναι的道德与审判含义
  choice: 因为他们配受这类东西的惩罚
  alternative: 因为他们应当被这类生物惩罚
  rationale: 原文明言这种灾祸是他们应得的惩罚；译文保留这一判断，同时不把宽泛的τοιούτων限定为“生物”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“咬死”将伤害与致死结果自然连结；“无药可救”比“找不到医治”更符合汉语表达。正文中的[a]、[b]分别保留ψυχή及τοιούτων的真实翻译选择。
