base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
translation:
  language: zh_hans
  text: 因为忘恩之人的希望，必像冬日的霜一样消融，也必像无用的水一样流去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流去”也可译作“流走”；“无用的水”也可译作“派不上用场的水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀχάριστου
  choice: 忘恩之人的
  rationale: 该形容词为属格单数并作名词用，指不感恩、忘恩的人。“忘恩之人”在现代汉语中清楚保留其伦理意味。
- source_word: ἐλπὶς
  choice: 希望
  rationale: 采用常用义“希望”，符合本节所说虚妄盼望终必消散的语境。
- source_word: χειμέριος πάχνη
  choice: 冬日的霜
  rationale: χειμέριος表示冬季的，πάχνη指霜或白霜；此译自然、易懂，也保留霜容易消融的比喻。
- source_word: τακήσεται
  choice: 必……消融
  rationale: 该将来时形式在此表达霜融化、消散；“消融”兼顾物象与希望落空的隐喻。
- source_word: ῥυήσεται
  choice: 必……流逝
  rationale: 该动词表示流走、流去；“流逝”既保持水流失的画面，也自然描述希望归于消散。
- source_word: ὕδωρ ἄχρηστον
  choice: 无用的水
  rationale: ἄχρηστον意为无用、派不上用场；直译可保留原文略显突兀却有力的意象。
theological_decisions:
- issue: ἀχάριστου的道德含义
  choice: 忘恩之人
  alternative: 不知感恩的人
  rationale: 原文刻画一种缺乏感恩的道德状态。“忘恩之人”简洁有力，同时不额外引入特定教义解释。
- issue: “希望”的性质
  choice: 保留为一般性的“希望”
  alternative: 译作“指望”或明确为“虚妄的希望”
  rationale: 原文只说“希望”，其虚妄性由融霜和无用之水的比喻显明；不在正文中添加“虚妄”，以保留原文表达的张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“因为”承接上文的γὰρ；两个“必”体现将来时和对称结构。脚注仅说明末句可行的词汇替代，不消解“无用的水”这一原文意象的含混性。
