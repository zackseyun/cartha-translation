base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: zh_hans
  text: 因为有一次，火焰被驯得温和[a]，免得烧尽那些被派去攻击不敬虔之人的动物；但那些人自己看见这一幕，就可知道自己正被上帝的审判追逼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被驯得温和”也可译作“变得温和”或“受到节制”。
    reason: lexical_alternative
  - marker: b
    text: “追逼”也可译作“驱赶”或“催逼”；“亲眼看见这一幕”的“一幕”为按上下文补出，希腊文只作“看见”。
    reason: lexical_and_implicit_object
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: 会变得温和
  rationale: 该词本义为“驯服、使温和”。用于火焰时，“变得温和”既保留拟人化意象，也表达火势受到节制而非熄灭。未译作单纯的“被压制”，以免丢失词根所含的柔和、驯服意味。
- source_word: φλόξ
  choice: 火焰
  rationale: φλόξ特指火焰，使用单数“火焰”保留原文意象。
- source_word: καταφλέξῃ
  choice: 烧尽
  rationale: 复合动词表达彻底焚烧、烧毁；“烧尽”简洁地传达其加强语气。
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: 那些被派去攻击不敬虔之人的动物
  rationale: ζῷα在灾祸叙事中指动物；ἐπί结合语境带有敌对方向，译为“攻击”比单纯“到……那里”更明确。被动式“被派去”保留原文未在此明说差遣者的表达。
- source_word: ἀσεβεῖς
  choice: 不敬虔之人
  rationale: 该词兼具宗教与道德含义；“不敬虔”保留其对上帝缺乏敬畏的维度，避免泛化为一般的“恶人”。
- source_word: βλέποντες
  choice: 亲眼看见这一幕
  rationale: 原文未明说所见宾语。“这一幕”自然承接火焰没有烧尽动物的情景，同时脚注说明原文的省略，以免把所见对象限定为单一事物。
- source_word: εἴδωσιν
  choice: 就会知道
  rationale: 此处由视觉观察进入认知结果；“知道”准确表达该动词在目的从句中的认识含义。
- source_word: θεοῦ κρίσει
  choice: 受上帝的审判
  rationale: 保留κρίσις明确的司法、审判含义，不将其弱化为一般的处境或天意。
- source_word: ἐλαύνονται
  choice: 正……追逼
  rationale: ἐλαύνω可表示驱赶、催逼或追逐；“追逼”在灾祸语境中自然，也保留持续承受外力压迫的被动意味。
theological_decisions:
- issue: 灾祸中上帝审判的作用
  choice: “正受上帝的审判追逼”
  alternative: “正被上帝的审判驱赶”或“正因上帝的审判而被追赶”
  rationale: θεοῦ κρίσει明确把他们的处境归于上帝的审判行动。译文保留这种司法性和主动压力，但不进一步规定上帝施行灾祸的具体因果机制。
- issue: “他们自己”的指代
  choice: “那些人……自己”指不敬虔之人
  alternative: 把αὐτοὶ理解为前述动物
  rationale: αὐτοὶ为阳性复数，与阳性复数ἀσεβεῖς相应，而前述ζῷα为中性复数；因此语法上指向不敬虔之人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为有时”承接上下文论证；用“免得……；而……”保留原文目的与转折结构。译文避免生硬直译，同时保留火焰被拟人化、审判具有追逼力量的诗性张力。
