base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: zh_hans
  text: 因为，那些施行暴政的人必须遭受不可避免的匮乏[a][b]；但对这些人，只需向他们显示他们的仇敌怎样受折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可避免的匮乏”或译“无法逃避的缺乏”。
    reason: lexical_alternative
  - marker: b
    text: “那些施行暴政的人”或译“暴君”；希腊文使用带动作意味的形式，强调他们实施压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: 必须
  rationale: 表达非人称结构所指的必要性，语气明确，又不额外解释为道德上的“理所当然”。
- source_word: ἀπαραίτητον ἔνδειαν
  choice: 无法逃避的匮乏
  rationale: ἀπαραίτητον 表示不能避开或推却，ἔνδεια 表示缺乏、匮乏；合译既保留强度，也不擅自限定为饥荒。
- source_word: ἐπελθεῖν
  choice: 遭受
  rationale: 原义是临到、袭来；汉语用“遭受”自然表达灾难临到他们，同时不改变受害关系。
- source_word: τυραννοῦσιν
  choice: 那些施行暴政的人
  rationale: 保留现在分词的动作性，突出他们正在实施压迫，而不只给出静态身份“暴君”。
- source_word: τούτοις δὲ μόνον
  choice: 而这些人只须
  rationale: 保留两组人的鲜明对比及 μόνον 的限制意味；“这些人”承接语境中的上帝子民。
- source_word: δειχθῆναι
  choice: 看见
  rationale: 按现代汉语将被动的“被显示给他们”自然转化为接受者视角；“只须”仍保留他们只是被展示、并未亲受灾祸的含义。
- source_word: πῶς
  choice: 怎样
  rationale: 保留原文对仇敌受苦情形或方式的开放表达，不压缩成单纯的“他们受罚”这一事实。
- source_word: ἐβασανίζοντο
  choice: 受折磨
  rationale: 表达持续遭受严重痛苦的含义，强度适当，又避免现代“酷刑”所带来的过窄司法联想。
theological_decisions:
- issue: 压迫者与上帝子民所受待遇的对比
  choice: 压迫者必须亲自遭受匮乏，而这些人只须看见仇敌怎样受折磨。
  alternative: 这些人只被显示他们的仇敌怎样受折磨。
  rationale: 原文以 τούτοις δὲ μόνον 和被动式 δειχθῆναι 强调不对称：一方直接承受灾祸，另一方仅蒙展示。正文采用自然汉语，但不扩展为具体教义解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“匮乏”保留原文未明确说明所缺为何物的概括性；分号呈现两个群体之间的审判对比。脚注标记均置于相关短语之后。
