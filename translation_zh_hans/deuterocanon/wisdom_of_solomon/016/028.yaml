base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/028.yaml
  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
translation:
  language: zh_hans
  text: 为使人知道，人必须在太阳升起以前向你献上感谢[a]，并在曙光初现时向你祈求[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“先于太阳向你感谢”。
    reason: lexical_alternative
  - marker: b
    text: 或译“向你恳求”；原文动词可指来到某人面前提出请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: 为要让人知道
  rationale: ὅπως引出目的或结果；结合γνωστὸν ἦν，译为“为要让人知道”，既保留目的意味，也符合现代汉语表达。
- source_word: δεῖ
  choice: 必须
  rationale: 保留无人称结构所表达的普遍必要性，不额外限定具体主体。
- source_word: φθάνειν τὸν ἥλιον
  choice: 在太阳升起以前
  rationale: φθάνειν在这里表示赶在……之前、先于；此译自然地表达时间上的先后，同时避免把原文没有明说的“起床”加入正文。
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: 向你献上感谢
  rationale: 该短语表达指向上帝的感谢；“献上感谢”既自然庄重，也保留敬拜语境。
- source_word: πρὸς ἀνατολὴν φωτός
  choice: 在曙光初现时
  rationale: 原义为“朝向光的升起”；此译保留黎明的意象，又比逐字译法更符合现代汉语。
- source_word: ἐντυγχάνειν σοι
  choice: 向你祈求
  rationale: ἐντυγχάνειν接与格可表示带着请求来到某人面前、恳求；“祈求”在对上帝的语境中简明准确，同时以脚注说明其请求意味。
theological_decisions:
- issue: 本节表达的是普遍的敬拜义务，还是特定的晨祷礼仪
  choice: 保留为普遍必要性，并使用清晨敬拜的语言：人在日出以前感谢上帝，在曙光初现时向他祈求。
  alternative: 将其译成一项正式晨祷礼仪规定。
  rationale: 希腊文δεῖ表达普遍的必要性，而日出与曙光的诗性措辞呈现清晨祷告的场景，却没有明确规定某种制度化礼仪。
- issue: 是否在正文中加入“起床”
  choice: 不加入，只译作“在太阳升起以前”。
  alternative: 译作“必须在太阳升起以前起身”。
  rationale: φθάνειν τὸν ἥλιον强调先于太阳，并未明确使用“起床”的动词；不增译可避免把合理推断写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“曙光初现”保留原文诗意；两个分句结构平衡，适合经文朗读。所有脚注标记均已置于正文相应词语之后。
