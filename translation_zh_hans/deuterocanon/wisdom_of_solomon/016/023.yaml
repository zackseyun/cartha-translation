  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/023.yaml
  text: But this again[a], so that the righteous might be fed, forgot even its own power.
translation:
  language: zh_hans
  text: 但这火又一次，为使义人得以饱足，竟忘了自身的威力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忘了自身的威力”也可理解为“失去了自身的效力”或“搁置了自身的能力”。希腊文将火人格化，说它“忘了”自己的威力。
    reason: 说明原文的人格化表达及其可能的语义展开。
lexical_decisions:
- source_word: τοῦτο
  choice: 这火
  rationale: τοῦτο是中性指示代词，回指上文的“火”；汉语明说“火”可使所指清楚，同时保留其回指作用。
- source_word: πάλιν δʼ
  choice: 但……反过来
  rationale: δέ带出转折，πάλιν在此表示同一受造之物转而产生相反作用；“反过来”比单说“又”更能呈现上下文的对照。
- source_word: ἵνα τραφῶσιν
  choice: 为使……得到供养
  rationale: 保留ἵνα加虚拟式所表达的目的，以及τραφῶσιν的被动意义；“得到供养”也适合此处神供应义人的语境。
- source_word: δίκαιοι
  choice: 义人
  rationale: 将复数名词化形容词译为通行且简洁的道德—宗教称谓“义人”，不另加解释。
- source_word: ἐπιλησθῇ
  choice: 竟忘了
  rationale: 直译其“忘记”之义，保留火被人格化的鲜明修辞；“竟”自然传达其反常和出人意料。
- source_word: τῆς ἰδίας δυνάμεως
  choice: 自身的威力
  rationale: “自身”保留ἰδίας的反身所属意味；“威力”表达δύναμις在此所指火本有的作用力和效能。
theological_decisions:
- issue: 受造元素在上帝护理之下的人格化描写
  choice: 保留“火……忘了自身的威力”这一人格化说法
  alternative: 火失去了天然的效力／火暂时不再发挥作用
  rationale: 希腊文明确用“忘记”描写火，不宜改写成纯物理说明；保留张力可呈现《智慧篇》中受造界为义人得供养而响应神旨意的诗性神学。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这火”承接上文，“反过来”呈现对照；保留目的从句、被动含义和原文的人格化张力。
