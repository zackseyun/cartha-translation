  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/027.yaml
  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: zh_hans
  text: 因为那没有被火毁坏的东西，只受一缕微弱阳光的温热，便融化了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只受一缕短暂的阳光的温热”。希腊语形容词可指微小、微弱，也可指短暂。
    reason: βραχείας有“微弱／微小”与“短暂”的词义幅度；正文采用“微弱”，以保留与火的强烈对比。
lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  choice: 那没有被火毁坏的
  rationale: 冠词化分词在此作名词用，按上下文指前述奇妙的食物；“毁坏”贴合与火及融化相对照的物理语境。
- source_word: ὑπὸ πυρὸς
  choice: 被火
  rationale: ὑπό加属格表示施事或作用来源；汉语被动结构自然传达“没有被火毁坏”。
- source_word: ἁπλῶς
  choice: 竟……就
  rationale: 此处强化反差：连火都不能毁坏之物，却仅受微弱阳光照热便融化。用“竟……就”自然呈现该修辞力度，不将其生硬直译为“简单地”。
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: 因一缕微弱的阳光
  rationale: βραχείας可表示短暂、微小或微弱；正文采用“微弱”突出火与阳光之间的强弱反差，同时保留ἀκτίς的光线意象。
- source_word: θερμαινόμενον
  choice: 照热
  rationale: 分词描述受到阳光温热的情形；“照热”在现代汉语中简洁地表达太阳光使其变热，且程度不至于过强。
- source_word: ἐτήκετο
  choice: 融化了
  rationale: τήκω在此表示融化；以完成式汉语叙述该现象，清楚自然，虽不逐一标出希腊语未完成时态的过程意味。
theological_decisions:
- issue: 本句是对奇妙食物性质的具体描述，还是关于受造物的普遍格言
  choice: 按上下文直陈这种食物的反常表现，不另加解释
  alternative: 译成关于受造之物的一般性道理
  rationale: 希腊文表述具体，并与上下文的吗哪叙事及火、阳光的对比相连；译文保留其悖论张力，不把神迹解释为普通自然过程。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“竟……就”凸显原文反差；“一缕微弱的阳光”保留光线意象，并以脚注交代“短暂”的可能译法。
