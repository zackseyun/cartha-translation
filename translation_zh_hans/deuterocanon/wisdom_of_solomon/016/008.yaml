base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/008.yaml
  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: zh_hans
  text: 并且，借着这件事，你也使我们的仇敌确信：你是救人脱离一切灾祸的那一位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“邪恶”、“伤害”或“患难”。希腊原词κακοῦ含义宽泛，可指邪恶、危害或不幸。
    reason: 保留原词的词义宽度，避免正文单一译法消除其歧义。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 借着这件事
  rationale: 此处介词短语在语境中表示凭借前述事件；“借着这件事”既保留指示意义，也自然表达工具或途径。
- source_word: ἔπεισας
  choice: 使……确信
  rationale: 该动词表示说服、使人信服；后接ὅτι内容从句，译作“使……确信”最符合现代汉语句法。
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: 我们的仇敌
  rationale: 直接保留共同体第一人称和敌对关系；“仇敌”庄重而易懂。
- source_word: ὅτι σὺ εἶ
  choice: 唯有你是
  rationale: 原文显式使用第二人称代词σὺ，具有强调作用；用“唯有你”传达对“你”的突出，但不改变其身份判断。
- source_word: ὁ ῥυόμενος
  choice: 救人……的那一位
  rationale: 现在时中间语态分词带冠词，描述上帝一贯的拯救特征；“救人……的那一位”自然保留实体化分词结构。
- source_word: ἐκ παντὸς κακοῦ
  choice: 脱离一切灾祸
  rationale: κακόν可泛指恶、伤害或患难；本节承接获救事件，“灾祸”在汉语中兼顾危害与不幸，同时以脚注保留更宽的词义范围。
theological_decisions:
- issue: κακοῦ的范围
  choice: 一切灾祸
  alternative: 一切邪恶；一切伤害；一切患难
  rationale: 原词语义宽泛，既可涉及邪恶，也可指伤害、不幸或灾难。正文依上下文采用“一切灾祸”，脚注说明其他可能含义，避免把上帝的拯救仅限于道德之恶或身体危险。
- issue: σὺ的强调程度
  choice: 唯有你是
  alternative: 你就是；你是
  rationale: 显式代词使“你”受到强调，语境又在辨认真正施行拯救者；“唯有你”以自然汉语体现这种排他性的强调，但不加入具体宗派解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“仇敌”与“那一位”保持经文语体的尊严；整体句式清楚，不使用古奥虚词。
