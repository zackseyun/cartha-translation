base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: zh_hans
  text: 然而，雪和冰经受住了火，并没有融化；为要使他们知道，火在冰雹中燃烧，在暴雨中闪耀，正毁坏仇敌的出产[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出产”或译“果实”“收成”。希腊原文直译为“仇敌的果实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χιὼν
  choice: 雪
  rationale: 该词通常指“雪”；后文另有 χαλάζῃ（冰雹），译文保留两者的区别。
- source_word: κρύσταλλος
  choice: 冰
  rationale: 此处与雪并列，又涉及不融化，按气象语境译为“冰”最自然；“水晶”容易造成误解。
- source_word: ὑπέμεινε
  choice: 经受住了
  rationale: 表达在火的作用下仍然存留、未被消融，兼顾原文的承受意味与现代汉语表达。
- source_word: ἐτήκετο
  choice: 并没有融化
  rationale: 主语是雪和冰，“融化”准确而自然。
- source_word: ἵνα γνῶσιν
  choice: 为要使他们知道
  rationale: 保留 ἵνα 所表达的目的意味，同时不补明原文未明确指出的“他们”所指。
- source_word: κατέφθειρε
  choice: 正毁坏
  rationale: 用“正”体现未完成过去时所描写的持续进行动作；“毁坏”适合农作物遭灾的语境。
- source_word: φλεγόμενον
  choice: 燃烧
  rationale: 作为修饰“火”的分词，简洁呈现火正在燃烧的状态。
- source_word: ἐν τῇ χαλάζῃ
  choice: 在冰雹中
  rationale: 直接保留 ἐν 的空间意象，表明火出现于冰雹之中。
- source_word: ἐν τοῖς ὑετοῖς
  choice: 在暴雨中
  rationale: ὑετοῖς 为复数，指降雨；结合灾祸场景译作“暴雨”，比直译“诸雨”自然，也与火的闪耀相称。
- source_word: διαστράπτον
  choice: 闪耀
  rationale: 传达如闪电般发光、闪现的动态，同时不把原文直接名词化为“闪电”。
- source_word: τοὺς τῶν ἐχθρῶν καρπούς
  choice: 仇敌的出产
  rationale: καρπούς 可指果实、收成或农产；“出产”既保留宽泛含义，也符合此处灾害毁坏农作物的语境。
theological_decisions:
- issue: 目的从句中“他们”的所指
  choice: 保留代词“他们”，不明确指定所指对象
  alternative: 明确译为“仇敌”或“看见这事的人”
  rationale: γνῶσιν 的主语在本节中没有明说。上下文可能指遭受审判的人，也可泛指见证此事的人；译文不替原文消除这一含混。
- issue: 火与冰雹、暴雨的关系
  choice: 译为火“在冰雹中燃烧，在暴雨中闪耀”
  alternative: 译为火“伴随冰雹燃烧，在暴雨间如闪电”
  rationale: 保留两个 ἐν 的表达及神迹中相反自然力量并存的张力，不把它普通化为仅仅伴随风暴的闪电。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“然而”承接前文的对照；用分号划分神迹事实与其目的。保留“他们”的指代含混，并以“在……中”呈现火与冰雹、暴雨并存的悖论意象。
