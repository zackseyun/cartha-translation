base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/013.yaml
  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
translation:
  language: zh_hans
  text: 因为你掌管生命和死亡；你使人下到阴间的门，又把人带上来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在之境。末句也可译作“又把人领上来”；希腊文只说“带上来”，并未明确使用“复活”一词。
    reason: 说明ᾅδης的词义，并保留ἀνάγεις的开放性及其与“下到”的对照。
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 掌管
  rationale: 这里表示对生命和死亡拥有主权和支配权；“掌管”在现代汉语中自然凝练，也不把含义缩减为单纯的能力。
- source_word: ζωῆς καὶ θανάτου
  choice: 生命和死亡
  rationale: 直接保留原文成对的属格结构及鲜明对照，不作不必要的扩展。
- source_word: κατάγεις
  choice: 使人下到
  rationale: 保留向下的空间意象，并以“使人”自然表达希腊语使动性的动作；宾语由语境补出，但不限定具体对象。
- source_word: πύλας ᾅδου
  choice: 阴间的门
  rationale: “阴间”在现代汉语圣经语境中可指死者所在之境，较“坟墓”更能保留ᾅδης的范围；“门”则保留原文的具体意象。
- source_word: ἀνάγεις
  choice: 把人带上来
  rationale: 与“使人下到”形成向下与向上的对应，不添加原文没有的“再次”，也不以“复活”消解其可能保留的神学张力。
theological_decisions:
- issue: ᾅδου的译法
  choice: 阴间
  alternative: 坟墓；冥府
  rationale: 原词指死者之境，不只是个别坟墓。“阴间”较为自然且能保留概念范围；“冥府”容易带入特定神话色彩。
- issue: ἀνάγεις是否明确译作复活
  choice: 把人带上来
  alternative: 使人复活；把人领上来
  rationale: 原文只陈述向上带领的动作，并与“下到”相对；不宜把它技术化为明确的复活术语，也不应增添原文没有的“再次”。
- issue: 动作对象是否明说
  choice: 补出“人”
  alternative: 省略宾语：又带上来
  rationale: 希腊文宾语可由语境理解。现代汉语若完全省略会显得突兀，补出泛指的“人”可使句子自然，同时不把对象限定为某个群体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号保留前后两组陈述的逻辑层次；“下到……又……上来”重现原文的垂直对照。脚注标记[a]已置于相关句末。
