base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/006.yaml
  text: But for a short time they were troubled as a warning, having a sign of salvation, for a reminder of the commandment of your law;
translation:
  language: zh_hans
  text: 但他们只是一时受了惊扰，作为警戒；他们得着了一个拯救的标记[a]，使他们记起你律法的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拯救的象征”，或“救援的凭证”。
    reason: σύμβολον可表示标记、象征或凭证；σωτηρίας可理解为拯救、救援或救恩。
lexical_decisions:
- source_word: εἰς νουθεσίαν
  choice: 作为警戒
  rationale: νουθεσία指为纠正人而作的劝诫或警告；“作为警戒”既保留目的意味，也符合现代汉语表达。
- source_word: πρὸς ὀλίγον
  choice: 只……片刻
  rationale: 该短语表示持续时间有限；与“惊扰”搭配，简洁地传达“只在短时间内”的意思。
- source_word: ἐταράχθησαν
  choice: 受了……惊扰
  rationale: 被动式表示他们遭到扰乱或陷入不安；“受了惊扰”既能涵盖内心不安，也可指所遭遇的患难。
- source_word: σύμβολον
  choice: 标记
  rationale: σύμβολον可指标记、凭证或象征；此处是可见之物，指向上帝的拯救。“标记”保留其指示作用，又不把它限定为纯抽象的象征。
- source_word: σωτηρίας
  choice: 拯救
  rationale: σωτηρία在上下文中首先指从致命审判中获救，同时带有更广的神学内涵；“拯救”在现代汉语中兼顾具体解救和神学意味。
- source_word: εἰς ἀνάμνησιν
  choice: 使……记起
  rationale: 该结构表达目的或作用，即这标记使人回想某事；动词化处理比“作为提醒”更自然，也保留原意。
- source_word: ἐντολῆς νόμου σου
  choice: 你律法的诫命
  rationale: 保留ἐντολή的单数和νόμος，并维持紧凑的属格关系，不擅自判定所指的是哪一条具体诫命。
theological_decisions:
- issue: σωτηρίας在具体脱险与较广神学含义之间的张力
  choice: 拯救
  alternative: 救援；救恩
  rationale: “拯救”可直接指旷野事件中免于死亡，也不排除更广的神学共鸣；避免用“救援”削弱其分量，也避免“救恩”使读者只作后期系统神学理解。
- issue: σύμβολον与铜蛇事件的关系
  choice: 拯救的标记
  alternative: 拯救的象征；得救的凭证
  rationale: “标记”体现该物件可见并有所指向的功能，同时不预先裁定它只是象征，或本身就是保证得救的凭证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只受了片刻的惊扰”保持原文对苦难短暂性的强调；分号呈现前后两个相关但各自完整的分句。
