base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: zh_hans
  text: 因为最令人惊奇的是：在能熄灭一切的水中，火反而发挥出更大的威力；因为受造世界为义人争战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“受造世界是义人的捍卫者”或“宇宙是义人的护卫者”。
    reason: ὑπέρμαχος 可作形容词或名词理解，κόσμος 也可译为“世界”“宇宙”或“受造界”；这些译法保留同一拟人化意象而侧重点略有不同。
lexical_decisions:
- source_word: παραδοξότατον
  choice: 最令人惊奇
  rationale: 这是 παράδοξος 的最高级，指极其出乎意料、令人惊异之事；此译自然传达惊奇感，又不把它收窄为逻辑意义上的“悖论”.
- source_word: σβεννύντι
  choice: 能熄灭一切
  rationale: 分词描述水通常具有的熄灭作用；“能熄灭”在中文中自然，也保留其与火相对的语境。
- source_word: πλεῖον ἐνήργει
  choice: 反而发挥出更大的威力
  rationale: ἐνήργει 表示产生作用、显出效力，πλεῖον 表示程度更强；“反而”明确呈现水中之火这一反常对照，而“发挥出更大的威力”保留动态效力。
- source_word: ὑπέρμαχος
  choice: 为……争战
  rationale: 该词指替他人作战、维护他人的一方；动词化翻译保留其军事性和拟人化力度。
- source_word: κόσμος
  choice: 受造世界
  rationale: 此处指有秩序的被造界，并被拟人化为义人的护卫者；“受造世界”比单说“世界”更清楚，又不把所指限定为人类社会。
- source_word: δικαίων
  choice: 义人
  rationale: 属格复数泛指公义的人；“义人”简洁庄重，也是现代中文圣经语体中自然的道德—神学称谓。
theological_decisions:
- issue: κόσμος ὑπέρμαχος δικαίων 的拟人化含义
  choice: 受造世界为义人争战
  alternative: 受造世界是义人的捍卫者／盟友
  rationale: 原文将受造界拟人化为替义人作战的一方。正文保留 ὑπέρμαχος 的军事力度，不将其弱化为一般性的支持，也不进一步构造关于自然界的系统教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在能熄灭一切的水中，火反而……”保留原文的强烈反常对照；分号连接现象与解释。脚注标记置于相关整句之后。
