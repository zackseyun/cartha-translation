base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: zh_hans
  text: 他们受到刺痛，是要使他们想起你的话语；他们又迅速获救，免得落入深重的遗忘，而与你的恩泽隔绝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεκεντρίζοντο
  choice: 被刺伤
  rationale: 该词为未完成时被动式，结合上下文指以蛇咬般的刺伤使人警醒；“被刺伤”既保留具体意象，也不把动作过度限定为某一种伤害。
- source_word: λογίων
  choice: 圣言
  rationale: λόγιον常指来自上帝的言语、训示或宣告；“圣言”在此既体现其神圣来源，又避免仅译成泛泛的“话”。
- source_word: ὀξέως διεσώζοντο
  choice: 迅速获救
  rationale: ὀξέως表示迅速，διασῴζω的未完成时被动式表示他们蒙拯救、得以脱险；译文自然表达被动含义。
- source_word: βαθεῖαν…λήθην
  choice: 深深的遗忘
  rationale: 贴近原文“深的遗忘”，保留其强烈程度和抽象意象。
- source_word: εὐεργεσίας
  choice: 恩惠
  rationale: 指上帝施予的善行、益处或恩泽；“恩惠”符合本节关系语境，又不将其窄化为单一事件。
theological_decisions:
- issue: ἀπερίσπαστοι与属格τῆς σῆς εὐεργεσίας的关系
  choice: 与[a]你的恩惠隔绝
  alternative: 不再专心留意你的恩惠
  rationale: ἀπερίσπαστος通常可表示“不受干扰、专心”，但与属格连用在此语境中也可理解为“被隔开、脱离”。正文采用与上下文警告后果相符的“隔绝”，同时以脚注保留重要词义歧义。
- issue: 伤害与拯救的目的
  choice: 伤害使人想起圣言，并迅速获救，以免遗忘而失去恩惠
  alternative: 将受伤本身解释成惩罚或圣礼象征
  rationale: 只呈现希腊句法明确表达的提醒和防止遗忘之目的，不引入特定教派的预表性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣言”“恩惠”保持经文语体；句式按希腊文的因果与目的关系重组，使中文流畅，同时保留神学张力。
