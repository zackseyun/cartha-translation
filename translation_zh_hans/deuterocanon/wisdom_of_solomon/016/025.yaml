base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
translation:
  language: zh_hans
  text: 因此，那时它也变成各种事物[a]，为你那滋养万有的恩赐效力，按照有需要之人的愿望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变成各种事物”也可译作“以各种方式变换”；希腊文强调这供给奇妙的适应性。
    reason: lexical_alternative
  - marker: b
    text: “有需要之人”也可译作“有所求之人”；希腊词既可表示有需要，也可表示提出请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  choice: 因此，那时……也
  rationale: 保留推论关系、时间指向和 καί 的承接作用，同时采用自然的现代汉语语序。
- source_word: εἰς πάντα μεταλλευομένη
  choice: 变成各种形态
  rationale: 表达供物可发生多样变化的意象；不把 εἰς πάντα 抽象化为单纯的“以各种方式”。
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  choice: 你那滋养万有的恩赐
  rationale: παντοτρόφος 表示滋养或维系一切；译文保留其宏阔而庄重的表达。
- source_word: ὑπηρετεῖ
  choice: 效力
  rationale: 体现服侍、供役之意，也保留该供物服务于上帝恩赐安排的拟人化表达。
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  choice: 随从有需要之人的愿望
  rationale: πρός 在此表示配合、适应；δεομένων 可指有需要者，也可指有所求者，正文取较宽泛的前者，并以脚注保留另一可能。
theological_decisions:
- issue: 发生变化之主语的所指
  choice: 沿用隐含主语“它”，不在正文中明确补作“吗哪”
  alternative: 直接译为“吗哪”或更广义的“受造之物”
  rationale: 上下文很可能指旷野中的天粮，但希腊文本本节未明说主语；保留代词可避免过早限定所指。
- issue: 神圣恩赐与变化之物的关系
  choice: 译作“为你那滋养万有的恩赐效力”
  alternative: 将变化之物直接等同于“滋养万有的恩赐”
  rationale: 原文用与格 τῇ…δωρεᾷ 配合 ὑπηρετεῖ，语法上呈现“为……效力”的关系；不擅自消除两者在措辞上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“变成各种形态”保留天粮奇妙适应性的具体意象；分号改为句号，以符合本节独立呈现时的中文标点习惯。
