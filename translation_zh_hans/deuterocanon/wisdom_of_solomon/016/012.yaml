base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: zh_hans
  text: 因为医好他们的，不是药草[a]，也不是外敷药[b]，而是你那医治万物的话，主啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “药草”也可译作“植物”；希腊词可泛指草木，在这里很可能指药用植物。
    reason: lexical_alternative
  - marker: b
    text: “外敷药”也可译作“药膏”或“敷剂”；希腊词指敷在身体上、用于医治的制剂。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βοτάνη
  choice: 药草
  rationale: 该词可泛指植物，但在医治语境中指具有药用性质的草木。“药草”自然清楚，也保留了它与外用疗法之间的区别。
- source_word: μάλαγμα
  choice: 外敷药
  rationale: 该词指敷在身体上的软化或治疗性制剂。“外敷药”比专业性较强的“敷剂”更易懂，又不像“药膏”那样把具体形态限定得过窄。
- source_word: ἐθεράπευσεν
  choice: 医好
  rationale: 不定过去时在这里表示实际医治的结果，而非仅仅治疗或照料；“医好”准确表达痊愈之意，并适合现代汉语。
- source_word: λόγος
  choice: 话
  rationale: 这里指主具有功效的言语或所表达的旨意。“话”保留原文的基本含义及神学回响，同时不把它技术化为后期特定教义术语。
- source_word: πάντα
  choice: 万物
  rationale: 中性复数涵盖范围广。“万物”以庄重而自然的汉语表达其广泛、总体性的指向；原文是否专指各样病患并未明说，译文不加限定。
- source_word: ἰώμενος
  choice: 医治
  rationale: 现在分词描述主的话持续具有或本来具有医治功效。用“你的话医治万物”构成自然完整的汉语分句，并保留其概括性的现在时意味。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格的直接称呼；“主啊”符合祷告式言语的庄重语域。
theological_decisions:
- issue: 普通疗法与主之话语的对比
  choice: 译为在这一次事件中，药草和外敷药没有医好他们，真正使他们得医治的是主的话。
  alternative: 将本节理解为普遍否定一切药物和医疗手段。
  rationale: 原文陈述的是“他们”在具体情境中并非由这些疗法医好，没有把这一对比扩展成对所有医疗的全面否定。
- issue: “医治万物”的范围
  choice: 保留“万物”的宽广表达，不缩限为“所有疾病”或“所有人”。
  alternative: 按上下文解释为“医治一切疾病”或“医治所有人”。
  rationale: πάντα 本身是宽泛的中性复数。译文保留原文的开放范围和神学张力，不替作者作更窄的界定。
- issue: λόγος 的神学含义
  choice: 译作“话”，指主具有功效的言语，同时不进一步界定其位格或机制。
  alternative: 译作“命令”、特定的创造性宣告，或后期神学意义上的位格化“圣言”。
  rationale: 上下文支持神的话语具有医治功效，但本节本身没有要求将 λόγος 限定为某一更专门的神学概念。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“既不是……也不是……而是……”清楚呈现希腊文的对比结构；破折号后的重复主语使末尾现在分词的描述作用在汉语中成为自然完整的判断句。所有脚注标记均紧随其所说明的词语。
