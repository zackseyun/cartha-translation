base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/002.yaml
  text: Instead of this punishment[a], you did good to your people; for a strange craving of appetite[b], you prepared quail as food for them.
translation:
  language: zh_hans
  text: 作为对这种惩罚的对照[a]，你恩待了你的子民；为满足他们食欲的渴望，你预备鹌鹑给他们作食物，作为一种新奇的滋味[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你以恩待自己的子民代替这种惩罚。”
    reason: 原文ἀνθʼ ἧς既可突出对照，也可表达“代替、取代”。
  - marker: b
    text: 原文结构紧凑，直译近于：“为了食欲的渴望，一种新奇的滋味。”其中“新奇的”在语法上修饰“滋味”；各短语之间的具体关系略有含混。
    reason: 说明εἰς ἐπιθυμίαν ὀρέξεως ξένην γεῦσιν的压缩表达，并保留其语法关系与含混性。
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  choice: 与这种惩罚相反
  rationale: ἀντί加属格在上下文中表示对照或替代；译作“与……相反”既保留神对其子民和对敌人不同处置的对比，也避免误解为同一种惩罚的替换形式。
- source_word: εὐεργετήσας
  choice: 恩待了
  rationale: 该分词表示施惠、行善。“恩待”在现代汉语中自然庄重，表达实际的善待，又不必引入“赐福”等额外礼仪或盟约含义。
- source_word: τὸν λαόν σου
  choice: 你的子民
  rationale: “子民”符合圣经语境中λαός指属神群体的用法，也比一般性的“人民”更贴合对上帝的第二人称称呼。
- source_word: εἰς ἐπιθυμίαν ὀρέξεως
  choice: 为了满足他们食欲的渴望
  rationale: 原文叠用“渴望”和“食欲”两个近义概念，带有加强语气；中文保留二者，并以“为了满足”自然表达εἰς在此可能具有的目的意味。
- source_word: ξένην γεῦσιν
  choice: 尝到新奇的滋味
  rationale: ξένην在语法上修饰γεῦσιν，意为异乎寻常或新奇的味道。译文保留“滋味”，同时用动词化表达使压缩的希腊语在中文中清楚可读。
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  choice: 你预备鹌鹑给他们作食物
  rationale: τροφὴν表示食物，ἡτοίμασας表示预备，ὀρτυγομήτραν指鹌鹑；按自然汉语调整语序而不改变信息。
theological_decisions:
- issue: 上帝恩待其子民与惩罚他人的对照
  choice: 译作“与这种惩罚相反，你恩待了你的子民”
  alternative: “你没有这样惩罚，反而恩待你的子民”或“你以恩待子民代替这种惩罚”
  rationale: ἀνθʼ ἧς最自然地标示对照或替代。正文保留对照关系，却不补入原文没有明说的“没有”，也不把“替代”解释成一套具体的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“恩待”“子民”“预备”保持经文语体，但不过分古雅；分号保留原句从对照到供食的推进。所有脚注标记均已置于正文。
