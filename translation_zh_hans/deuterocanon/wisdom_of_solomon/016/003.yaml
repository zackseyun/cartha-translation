base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/003.yaml
  text: so that those men[a], though desiring food, might, because of the appearance of the creatures that had been sent, turn away even from their necessary appetite, while these others, after becoming needy for a short time[b], might partake of a strange taste.
translation:
  language: zh_hans
  text: 好使那些人虽想要食物，却因所派来之物的形貌[a]，连出于基本需要的食欲也转而排斥；而这些人短暂陷入匮乏之后，得以尝到一种陌生的滋味[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“因看见那派来攻击他们的东西”。这里指上帝所派来的灾害之物；原文着重于它们呈现在眼前的形貌使人反感。
    reason: lexical_alternative
  - marker: b
    text: “陌生的滋味”指此前不熟悉、不同寻常的食物，可能是为下文所述赐给以色列人的非凡食物作铺垫。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμοῦντες τροφήν
  choice: 虽想要食物
  rationale: 表达对食物的欲求，同时不把 ἐπιθυμέω 过度强化为难以抑制的“馋求”。
- source_word: διὰ τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων
  choice: 因所降之物显出的模样
  rationale: 按上下文将名词化的 ἐπαπεσταλμένων 译为“所降之物”，保留未明说具体物种的特点；“显出的模样”传达 δειχθεῖσαν 的可见性，以及视觉形态引起厌弃这一因果关系。
- source_word: τὴν ἀναγκαίαν ὄρεξιν
  choice: 维持生命所需的食欲
  rationale: ἀναγκαῖος 在此指由基本需要所迫的食欲；此译比生硬的“必要的食欲”更自然，也保留“连基本食欲都受到影响”的力度。
- source_word: ἀποστρέφωνται
  choice: 也厌弃
  rationale: 中间语态在语境中含转离、反感之意；“厌弃”自然呈现由所见之物引发的拒食反应。
- source_word: ἐπʼ ὀλίγον ἐνδεεῖς γενόμενοι
  choice: 只短暂地陷入匮乏
  rationale: 同时保留匮乏状态及其持续时间有限的对比重点，不擅自具体化为饥饿或濒死。
- source_word: ξένης μετάσχωσι γεύσεως
  choice: 得以尝到一种陌生的滋味
  rationale: μετέχω 表示有份、参与，在食物语境中自然译为“尝到”；ξένος 表示此前不熟悉、不同寻常，故用“陌生”而不译成带族群意味的“外来的”。
theological_decisions:
- issue: “那些人”与“这些人”的所指
  choice: 正文保留希腊文的指示代词对比，不直接补出“埃及人”和“以色列人”。
  alternative: 根据上下文在正文中明确译为“埃及人”与“以色列人”。
  rationale: 《智慧篇》16章的上下文确实将受灾者与蒙供应者相对照，但本节本身使用代词。保留代词既忠于措辞，也避免把解释直接写入正文。
- issue: “陌生的滋味”所指
  choice: 正文保留其概括而略带张力的说法，仅在脚注说明可能指向旷野中的非凡食物供应。
  alternative: 正文直接译作“吗哪的奇异滋味”。
  rationale: 本节没有直接出现“吗哪”一词；明确化虽符合较大语境，却会消除原文有意保留的表达空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句子保留“那些人／这些人”的对照结构，并以分号呈现两组人的平行反差；避免古奥的“口腹之欲”“有分于”等表达，也不将上下文中的历史身份或吗哪直接增补进正文。
