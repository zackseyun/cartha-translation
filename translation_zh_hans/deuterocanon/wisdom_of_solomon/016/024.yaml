base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: zh_hans
  text: 因为受造万物服侍你——创造它们的那一位——：它们绷紧起来，去惩罚不义的人；又松开来，施惠给那些信靠你的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文采用一组相反的物理意象：受造万物为施行惩罚而“拉紧”，为施惠而“松开”；也可意译为“加强以施行惩罚……又转而施惠”。
    reason: 说明ἐπιτείνει与ἀνίεται的词义对照及可选译法。
lexical_decisions:
- source_word: κτίσις
  choice: 受造万物
  rationale: 指整个受造秩序，并在句中作为服侍上帝的整体行动；比单说“自然界”更能保留其受造及从属的含义。
- source_word: σοι τῷ ποιήσαντι
  choice: 你这位创造它们的主
  rationale: 将同位性的与格表达为对“你”的说明；“主”使现代汉语句法自然，也表明受造万物所服侍的对象，但不增添独立于上下文的教义内容。
- source_word: ὑπηρετοῦσα
  choice: 服侍
  rationale: 保留受造万物奉创造者差遣、为其效力的主动图景。
- source_word: ἐπιτείνει
  choice: 绷紧起来
  rationale: 保留动词“拉紧、加强”的具体动力意象，并与下文ἀνίεται的“舒展开来”形成鲜明对照。
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: 惩罚不义的人
  rationale: 以自然汉语表达趋向惩罚这一目的；ἀδίκων采用“不义的人”，保留其道德和司法意味。
- source_word: ἀνίεται
  choice: 舒展开来
  rationale: 表达松开、放松之义，同时与“绷紧起来”构成源文所具有的物理意象对照。
- source_word: εἰς εὐεργεσίαν
  choice: 造福
  rationale: 简洁表达施惠、行善并使人得益的主动意义，比抽象的“善行”更符合现代汉语。
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: 造福那些信靠你的人
  rationale: ὑπέρ在此表示为了、使之得益；“信靠”表达πεποιθότων所指已经建立并持续的倚赖状态。
theological_decisions:
- issue: 受造万物在审判与施惠中的能动性
  choice: 将受造万物译为服侍创造者、执行惩罚和造福之事的整体
  alternative: 将自然视为自主运作的非人格力量
  rationale: ὑπηρετοῦσα及σοι τῷ ποιήσαντι清楚表明其行动从属于创造者，而非独立于他。
- issue: 拉紧与松开意象的解释
  choice: 在正文保留“绷紧／舒展”的对照，并用脚注说明其意义
  alternative: 直接释义为“增强惩罚／转而施惠”
  rationale: 源文刻意使用相反的物理意象；保留该张力比只呈现抽象结果更忠实，同时脚注帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“绷紧起来／舒展开来”保留源文生动的物理意象；冒号使“服侍”与其后两种具体行动的关系清楚。脚注标记已在正文中呈现。
