base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/001.yaml
  text: Therefore they were justly punished by similar things[b][a], and were tormented by a multitude of creatures.
translation:
  language: zh_hans
  text: 因此，他们藉着相似之物，受到应得的惩罚[a]；又因众多生物而受折磨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相似之物”也可译作“类似的事物”或“藉着同样的事物”；希腊文强调惩罚与过犯之间的相应关系。
    reason: lexical_alternative
  - marker: b
    text: “生物”所译的希腊词含义较宽，可指各种动物，尤其可包括爬行或令人厌恶的动物；不宜限指某一类动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文并引出结论，保留因果推论的语气。
- source_word: διʼ ὁμοίων
  choice: 受同类事物的惩罚
  rationale: 保留惩罚手段与先前行为彼此对应的含义，而不把对应关系解释得超出本节原文。
- source_word: ἐκολάσθησαν ἀξίως
  choice: 理当受……惩罚
  rationale: 将被动的惩罚和ἀξίως所表达的相称、应得之意自然结合，避免把它弱化为管教。
- source_word: διὰ πλήθους
  choice: 被大群……
  rationale: 表达数量众多，并采用符合现代汉语动物群体描写的措辞。
- source_word: κνωδάλων
  choice: 爬行的动物
  rationale: 该词可泛指低等、可憎或爬行的动物；此译保留其动物意象及一定范围上的宽泛性，不限缩为爬虫类。
- source_word: ἐβασανίσθησαν
  choice: 被……折磨
  rationale: 准确体现强烈痛苦，且不额外引入司法刑讯的意味。
theological_decisions:
- issue: 神圣审判中罪与罚的对应关系
  choice: 译作“受同类事物的惩罚”，仅表达惩罚方式与所行之事相对应。
  alternative: 可解释性地译作“他们怎样犯罪，就受怎样的惩罚”。
  rationale: 希腊文此处明说的是“相似、同类”的对应，并未在本节完整陈述更广泛的报应原则；因此保留其含蓄和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“理当”简洁表达ἀξίως的应得、相称之意；“大群爬行的动物”保留原文的数量感和动物意象。脚注标记均置于正文相应词语之后。
