  text: But it is impossible to escape your hand[a].
translation:
  language: zh_hans
  text: 但要逃脱你的手，是不可能的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃离你的手。”希腊文保留“手”这一具体意象，用来表达上帝的权能及其无所不及。
    reason: 词义替代译法
lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  choice: 你的手
  rationale: χείρ本义为“手”，在此也承载权能与掌控所及的含义。保留具体意象，既忠于原文，也让读者体会无人能逃避上帝的权能。
- source_word: φυγεῖν
  choice: 逃脱
  rationale: φυγεῖν可指“逃跑、逃离”；在以“你的手”为宾语的结构中，意为从其手中逃脱。“逃脱”符合现代汉语表达，也保留逃离的动态意味。
- source_word: ἀδύνατόν ἐστιν
  choice: 是不可能的
  rationale: 这是无人称表达，直陈某事不可能；译为“是不可能的”准确、清楚，并保留原句的强调语势。
- source_word: δὲ
  choice: 但
  rationale: δέ在上下文中表示转折，用“但”自然呈现与前文的对比。
theological_decisions:
- issue: 描述上帝作为的拟人化语言
  choice: 正文保留“你的手”
  alternative: 你的权能；你的掌控
  rationale: 希腊文以身体意象表达上帝有效而无可逃避的权能。译文不将这一神学意象抽象化，以保留原文的张力和具体性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“逃脱你的手”保留原文意象；逗号使前置的不定式短语在汉语中更自然，并突出“不可能”的断言。
