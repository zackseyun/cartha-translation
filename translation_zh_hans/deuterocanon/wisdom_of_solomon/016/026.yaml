base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: zh_hans
  text: 好使你所爱的儿子们明白，主啊，滋养人的并不是庄稼的出产[a]，而是你的话保全那些信靠你的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句可能呼应《申命记》8:3：人的生命并不只由食物维持，也由上帝所说的话维持。
    reason: cross_reference
  - marker: b
    text: 或译“相信你的人”。希腊文在这里既可表示相信，也可表示信赖、倚靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: 好使……明白
  rationale: ἵνα加虚拟语气表示目的；“好使……明白”自然地保留这一目的关系。
- source_word: οἱ υἱοί σου
  choice: 你的儿女
  rationale: υἱοί字面为阳性复数“儿子们”，但在这里指属于上主并蒙他爱的一群人；汉语“儿女”能自然表达群体性的亲子关系，字面形式另见脚注。
- source_word: οὓς ἠγάπησας
  choice: 你所爱的
  rationale: 简洁表达不定过去时的陈述，不额外加入时体含义。
- source_word: Κύριε
  choice: 主啊
  rationale: 用现代而庄重的汉语呼语表达希腊文呼格。
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: 并不是庄稼的出产
  rationale: γενέσεις在此指生长所得的产品或产物，καρπῶν指农作物的收成；“庄稼的出产”清楚且避免把它缩窄为树上的果子。
- source_word: τρέφουσιν ἄνθρωπον
  choice: 滋养人
  rationale: τρέφω意为喂养、滋养；单数ἄνθρωπον在这里具有泛指意义，汉语“人”自然保留单数集合性表达。
- source_word: τὸ ῥῆμά σου
  choice: 你的话
  rationale: ῥῆμα指所说的话或言语；“你的话”既自然，也保留与《申命记》8:3可能存在的呼应。
- source_word: τοὺς σοὶ πιστεύοντας
  choice: 那些信靠你的人
  rationale: πιστεύω接与格时可表达相信某人或信赖某人；“信靠你”在此突出倚赖，同时不排除相信的含义。
- source_word: διατηρεῖ
  choice: 保全
  rationale: διατηρέω表示保存、保守或使之存留；“保全”既与前面的身体滋养形成对照，也保留较宽的维系生命之意。
theological_decisions:
- issue: 本句可能呼应《申命记》8:3，即人的生命不单靠食物，也靠上帝的话
  choice: 保留“滋养人的并不是……而是你的话保全……”这一原有表述
  alternative: 扩写为“人活着不是单靠食物”等较完整的《申命记》措辞
  rationale: 希腊文本有明显的经文共鸣，却采用自己的句式；译文不应把暗示改写成直接引文。
- issue: πιστεύοντας所表达的是相信还是信赖
  choice: 正文译作“信靠你”，脚注保留“相信你”的可能
  alternative: 相信你
  rationale: 与格结构在此可兼有相信和倚赖之意；上下文谈上主保全人，“信靠”较贴切，但不应抹去词义上的张力。
- issue: οἱ υἱοί σου的群体指称
  choice: 正文译作“你的儿女”，脚注说明字面为“你的儿子们”
  alternative: 你的儿子们
  rationale: 该词形确为阳性复数，但在此作为上主所爱群体的称谓；现代汉语用“儿女”更自然，脚注则保存原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。“主啊”保留祷告式呼语；“庄稼的出产”避免生硬直译；整句维持原文中物质滋养与上主之话保全生命之间的对照。
