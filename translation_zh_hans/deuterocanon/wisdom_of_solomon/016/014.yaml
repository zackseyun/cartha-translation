base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: zh_hans
  text: 然而，人能因自己的邪恶杀人；灵一旦离去，他却不能使它返回，也不能使已被取去的魂得释放。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“气息”，“魂”也可译作“生命”；后半句也可译作：“气息一旦离去，他就不能使它返回，也不能使已被取去的生命得释放。”希腊文πνεῦμα和ψυχή在这里分别可涵盖“灵／气息”和“魂／生命”的意思。
    reason: 保留死亡语境中两个希腊词的词义重叠及另一种自然译法。
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里是泛指单数，与上下文中上帝的能力形成对比；现代汉语用“人”既自然，也保留人类个体代表性的表达。
- source_word: ἀποκτέννει
  choice: 杀人
  rationale: 该动词直接表示杀死；汉语补出自然的受事“人”，清楚表达凡人能夺去他人生命，却不能逆转死亡。
- source_word: τῇ κακίᾳ αὐτοῦ
  choice: 因自己的恶行
  rationale: κακία表示邪恶、恶意或恶行；“恶行”在此既保留道德含义，也自然说明杀人的手段或原因。
- source_word: ἐξελθὸν ... πνεῦμα
  choice: 灵一旦离去
  rationale: πνεῦμα在死亡语境中可指灵，也可指气息。正文保留“灵”，以呈现原文的人论用语和概念张力；“气息”列入脚注。
- source_word: οὐκ ἀναστρέφει
  choice: 不能使它回来
  rationale: 这里指人不能使已经离去的πνεῦμα返回；此译法保留“返回”的具体意象，并符合现代汉语。
- source_word: οὐδὲ ἀναλύει
  choice: 也不能释放
  rationale: ἀναλύω在这里有解开、释放之意。“释放”保留原文所描绘的从死亡权势中解脱的形象，而不将其解释成较抽象的“复活”。
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: 被取去的魂
  rationale: ψυχή可指魂或生命，παραλημφθεῖσαν表示已经被取去或接去。正文用“魂”保留与πνεῦμα不同的原文词汇，脚注说明“生命”的可能译法。
theological_decisions:
- issue: 死亡语境中πνεῦμα与ψυχή的人论含义
  choice: 正文分别译作“灵”和“魂”
  alternative: 分别译作“气息”和“生命”
  rationale: 希腊文使用两个彼此相关却不完全相同的词。正文保留二者的区别，以免把原文的概念层次合并；同时用脚注指出它们在本语境中也可具体理解为维系生命的气息和被夺去的生命，避免赋予两个词过强、过于固定的形而上区分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“固然……却……”呈现μέν…δέ的对照关系；保留“灵／魂”的词汇差异，同时在脚注中说明更具生命现象色彩的译法。
