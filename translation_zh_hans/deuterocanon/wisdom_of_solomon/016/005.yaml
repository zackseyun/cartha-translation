base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/005.yaml
  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: zh_hans
  text: 因为，即使野兽的可怕狂怒临到他们，他们正因蜿蜒的蛇[a]所咬而遭毁灭，你的愤怒却没有持续到底；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弯曲的蛇”或“盘绕的蛇”。希腊词字面意为“弯曲的”；此处看来是描述蛇蜿蜒的形态，并非道德性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεινὸς
  choice: 可怕的
  rationale: 表达袭击令人恐惧而又猛烈的性质，不超出原词语义。
- source_word: θηρίων θυμός
  choice: 野兽狂怒
  rationale: θηρίων指野兽，θυμός在此指猛烈的怒气；“野兽狂怒”保留原文的拟人化力度和庄重语气。
- source_word: ἐπῆλθεν
  choice: 袭击
  rationale: 原词表示临到、袭来；结合野兽之怒的语境，译作“袭击”自然明确。
- source_word: δήγμασίν
  choice: 咬伤
  rationale: 该词指咬噬造成的伤害；汉语用“被……咬伤”比名词化的“因咬伤”更自然。
- source_word: σκολιῶν ὄφεων
  choice: 蜿蜒毒蛇
  rationale: σκολιός本义为弯曲，描述蛇盘曲蜿蜒的形态；ὄφις在本段民数记背景中指致命的蛇，译作“毒蛇”自然传达其危害，但不把“弯曲”道德化。
- source_word: διεφθείροντο
  choice: 正……而丧命
  rationale: 保留未完成时所表达的持续过程，并传达被蛇咬后遭毁灭、死亡的严重后果。
- source_word: οὐ μέχρι τέλους ἔμεινεν
  choice: 没有持续到底
  rationale: 贴近原文的时间表达，不将其解释为抽象的“并非永恒”或“惩罚并非最终”。
- source_word: ἡ ὀργή σου
  choice: 你的愤怒
  rationale: “愤怒”在现代汉语中庄重自然，足以表达神施行审判的怒气，而不过度依赖特定宗教术语。
theological_decisions:
- issue: 神的审判之怒在这一事件中没有持续到底
  choice: 你的愤怒却没有持续到底
  alternative: 你的怒气并没有永远持续
  rationale: 原文直接说神的愤怒没有“持续到底”。正文保留真实的神圣愤怒与其在本次事件中受到限制之间的张力，不把它扩大解释为关于永恒刑罚的普遍命题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“因为即使”承接上文论证；分句保持原文的持续受害过程，并以“却”凸显神的愤怒没有持续到底这一转折。原文末尾分号表明句意延续至下一节，译文予以保留。
