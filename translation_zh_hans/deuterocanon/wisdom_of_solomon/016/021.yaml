base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
translation:
  language: zh_hans
  text: 因为你所赐食物的本质[a]，向你的儿女显明了你的甘甜；它顺应领受这食物的人的心愿，变成各人所想要的样子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本质”所译的希腊语也可指“性质”“构成”或“根基性的实在”；原文直译近于“你的本质”。按上下文，这里可理解为神所赐食物的本质或构成。
    reason: lexical_alternative
  - marker: b
    text: 意思是这食物会顺应各人的喜好；上下文尤其可能指它呈现出各人所想要的滋味。
    reason: contextual_clarification
lexical_decisions:
- source_word: ὑπόστασίς σου
  choice: 你所赐食物的本质
  rationale: ὑπόστασις可指构成、本质或根基性的实在。上下文谈论神所赐食物及其变化，因此正文明确其语境所指，同时以“本质”保留原词略带哲理而未完全具体化的意味。
- source_word: γλυκύτητα
  choice: 甘甜
  rationale: 此词兼有味觉上的甜美和性情上的恩慈意味；“甘甜”在本节食物语境中保留这两层含义。
- source_word: τέκνα
  choice: 儿女
  rationale: 该词泛指神所眷顾的子民，并不限于男性；“儿女”自然且包含两性。
- source_word: τοῦ προσφερομένου
  choice: 食用者
  rationale: προσφέρω在饮食语境中可表示取用、进食；“食用者”比生硬的“被献上之人”更符合上下文，也保留领受食物之人的焦点。
- source_word: ἐπιθυμίᾳ ὑπηρετῶν
  choice: 顺应……的心愿
  rationale: 表达食物服务、配合领受者愿望的功能；“顺应”是现代汉语中自然而准确的表达。
- source_word: πρὸς ὃ τις ἐβούλετο μετεκιρνᾶτο
  choice: 变成各人所想要的样子
  rationale: μετακιρνάω含改变调配或构成之意；此译保留个别适应的重点，又不擅自限定为某一种味道。
theological_decisions:
- issue: “你的本质”（ὑπόστασίς σου）的所指
  choice: 理解为神所赐食物的本质或构成
  alternative: 理解为神自身的本性，显明他对儿女的恩慈
  rationale: 紧接的分句描述食物顺应食用者的心愿而变化，故上下文更支持以神所赐食物为所指；脚注仍保留希腊语可能具有的较宽泛含义，避免把歧义彻底消除。
- issue: 食物变化的范围
  choice: 译为“各人所想要的样子”
  alternative: 明确译成“各人想要的滋味”
  rationale: 上下文很可能着重味道，但原文所用关系表达并未明说“滋味”；正文不作过度限定，脚注说明其语境意义。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“甘甜”刻意保留味觉与神恩慈之间的双关；“样子”不把原文未明说的变化范围缩限为味道。
