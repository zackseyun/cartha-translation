base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: zh_hans
  text: 因为那些不敬虔的人拒绝认识你，便被你膀臂的大能鞭打；奇异的雨、冰雹和无法避开的暴雨追赶他们，他们又被火吞灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνούμενοι … σε εἰδέναι
  choice: 拒绝认识你
  rationale: ἀρνούμενοι 支配不定式 εἰδέναι，表达有意拒绝；“认识你”保留 εἰδέναι 的直接含义，不扩写为“承认你是神”。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 该词着重指向对神的不敬，而不只是一般意义上的邪恶；此译法准确且符合现代中文圣经语体。
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: 被你膀臂的大能
  rationale: 保留“膀臂”这一圣经常用的神圣能力意象，也保留 ἰσχύς 所表达的力量；结合被动动词自然译出工具意义。
- source_word: ἐμαστιγώθησαν
  choice: 鞭打
  rationale: 原词本义是鞭笞，在此借喻严厉惩治；保留形象性，避免弱化为笼统的“惩罚”。
- source_word: ξένοις ὑετοῖς
  choice: 奇异的雨
  rationale: ξένος 在此形容反常、异乎寻常的降雨；“奇异”既保留原文陌异感，也比“外来的雨”自然。
- source_word: χαλάζαις
  choice: 冰雹
  rationale: 直接对应原文，中文以集合名词表达自然。
- source_word: ὄμβροις ἀπαραιτήτοις
  choice: 无法避开的暴雨
  rationale: ὄμβρος 指大雨或暴雨；ἀπαραίτητος 表示不能推开、回避或免除。“无法避开的”较直接保留其语义，且不把它过度解释为时间上“无休止”。
- source_word: διωκόμενοι
  choice: 追赶他们
  rationale: 保留“追逐、追赶”的拟人化图景，使这些灾害仿佛紧追不舍。
- source_word: πυρὶ καταναλισκόμενοι
  choice: 火也吞灭他们
  rationale: καταναλίσκω 表示彻底耗尽、烧灭；“吞灭”保留火焰毁灭性的生动表达。
theological_decisions:
- issue: εἰδέναι 所指的“认识”是否应解释为承认神
  choice: 认识你
  alternative: 承认你；认你为神
  rationale: 上下文确有拒绝承认神的意味，但希腊文直接说“认识”。正文保留这一开放而简洁的表达，不加入超出原文的神学阐释。
- issue: ἐμαστιγώθησαν 的鞭打意象
  choice: 鞭打
  alternative: 惩罚；折磨
  rationale: 虽然具体刑罚借自然灾害施行，原文仍刻意采用鞭笞的强烈形象；直译可保留审判的严厉性。
- issue: 灾害与神之膀臂大能的关系
  choice: 被你膀臂的大能鞭打
  alternative: 在你膀臂的大能中受鞭打
  rationale: ἐν 在这里适合按工具意义理解，但仍以被动结构呈现，不额外明确灾害与神行动之间原文未细分的因果机制。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“不敬虔的人”“膀臂的大能”“吞灭”保留智慧文学和圣经叙事的崇高语感；句式稍作重排，以清楚呈现主语及连续受罚的画面。无脚注标记，因为正文已能准确保留主要词义与歧义。
