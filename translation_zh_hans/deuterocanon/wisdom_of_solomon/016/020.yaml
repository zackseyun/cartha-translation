base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: zh_hans
  text: 与这些事相对，你用天使的食物[a]喂养你的子民，并从天上赐给他们现成的饼，使他们无需劳作；这饼能带来各种愉悦，迎合各种口味。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使之粮”或“适合天使的食物”。希腊语的表达并不要求作出更具体的解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: 为了与这些事相对
  rationale: 短语承接上文的惩罚，与上帝对自己子民的不同待遇形成对照；此译保留其语境中的对比意味，也不完全排除报偿或对应关系。
- source_word: ἀγγέλων τροφήν
  choice: 天使的食物
  rationale: τροφὴ意为食物、滋养；保留属格表达，不把它限定为天使所送的食物或适合天使的食物。
- source_word: ἐψώμισας
  choice: 喂养
  rationale: 该动词表示给人食物、使人得喂养；“喂养”简洁自然，并与宾语“你的子民”搭配。
- source_word: ἕτοιμον ἄρτον
  choice: 现成的饼
  rationale: ἕτοιμον表示已经备妥、随时可得；“现成的饼”突出这食物由上帝预备，而非百姓制作。
- source_word: ἀπʼ οὐρανοῦ
  choice: 从天上
  rationale: 直接表达食物来源，符合现代汉语习惯。
- source_word: ἀκοπιάτως
  choice: 无须他们劳作
  rationale: 该副词意为不劳苦、不费力；结合受惠者语境，译出百姓无需为这饼劳作。
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: 能满足各种享受
  rationale: ἰσχύοντα表示有能力、有效力，ἡδονή表示愉悦或享受；此译保留能力含义，并以自然汉语表达食物带来的满足。
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: 适合各种口味
  rationale: γεῦσις指味觉或滋味，ἁρμόνιον表示相合、适宜；“适合各种口味”清楚自然。
theological_decisions:
- issue: “天使的食物”的性质
  choice: 保留“天使的食物”这一属格表达，不作具体解释
  alternative: 天使送来的食物；适合天使吃的食物；天使所吃的饼
  rationale: 希腊文属格本身未明确说明具体关系；直译可保留其真实歧义，并使重点仍落在来自天上的供应上。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“现成的饼”贴近原文，并避免使用过度宗教化或古雅的措辞。主句用“却”强化上下文对照；分号使修饰“这饼”的后半句关系清楚。
