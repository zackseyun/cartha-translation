  text: For she is an initiate in the knowledge of God[a], and a chooser of his works.
translation:
  language: zh_hans
  text: 因为她通晓上帝的知识，也选择他的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“认可他的作为。”这里的希腊语表达较为少见，可能强调智慧对上帝所行之事的辨识和赞同。
    reason: lexical_alternative
lexical_decisions:
- source_word: μύστις
  choice: 深谙
  rationale: 该阴性名词本指获准进入奥秘、通晓隐秘知识的人。汉语若直译为“入秘者”会显得生硬且容易引入特定宗教仪式联想；“深谙”自然地表达智慧对上帝知识的特殊、深入通晓，同时不采用带有后世色彩的“神秘主义者”一类称谓。
- source_word: ἐπιστήμης
  choice: 知识
  rationale: 在“关于上帝的知识”这一属格结构中，“知识”直接而宽泛，可包含认识与理解，不必窄化为现代意义的“科学”。
- source_word: αἱρέτις
  choice: 拣选
  rationale: 此罕见阴性名词源于“选择、取定”，与“他的作为”相连时可指拣选，也可能含鉴别后认可之意。正文保留较贴近词形的“拣选”，脚注说明另一可能。
- source_word: ἔργων
  choice: 作为
  rationale: “作为”可自然涵盖上帝所做的事、行动及其成果，比“工作”更符合现代汉语宗教与文学语境。
- source_word: γάρ
  choice: 因为
  rationale: 连接上文并说明理由；“因为”在单节呈现中清楚自然。
theological_decisions:
- issue: 如何表达 μύστις 所含的宗教—哲学意味
  choice: 深谙关于上帝的知识
  alternative: 是上帝知识的入秘者
  rationale: 原文把智慧描写为获知并深入参与神圣知识者。“深谙”保留其特殊而深入的认识，同时避免“入秘者”在现代汉语中的生硬感，以及“神秘主义者”可能带来的时代错置。
- issue: 如何理解 αἱρέτις τῶν ἔργων αὐτοῦ
  choice: 拣选他的作为
  alternative: 认可他的作为
  rationale: 希腊语表达罕见且紧缩，可能着重于选择，也可能指辨识并赞同上帝的作为。正文贴近“选择”的基本词义，不把含义直接限定为“认可”；另一理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“深谙”略具书面色彩，适合智慧文学，也比生硬的“入秘者”自然。保留女性代词“她”，与上下文中人格化的智慧及希腊语阴性形式相应。
