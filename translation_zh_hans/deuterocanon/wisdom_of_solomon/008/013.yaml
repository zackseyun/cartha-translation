  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/013.yaml
  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: zh_hans
  text: 借着她[a]，我必得不朽[b]；我也要给后世留下永恒的纪念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着她”也可理解为“因她”或“与她相伴”；“她”指人格化的智慧。
    reason: lexical_alternative
  - marker: b
    text: “不朽”可能指个人不死，也可能结合下句理解为身后长久流传的声名；原文没有明确限定二者的关系。
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: 我必得
  rationale: 这是ἔχω的将来时，可表示将来拥有或获得。中文用“必得”自然表达说话者预期因智慧而有此福分，同时不把动词过度解释为主动争取。
- source_word: δὲ
  choice: 也
  rationale: 此处是较弱的承接词，延续上下文所列举的益处；“也”比“但是”更符合语流。
- source_word: αὐτὴν
  choice: 借着她
  rationale: 阴性代词回指人格化的“智慧”。依本节语义关系译为“借着她”，既保留女性人格化，也表达智慧作为媒介或缘由的含义；其他可能表达见脚注。
- source_word: ἀθανασίαν
  choice: 不朽
  rationale: “不朽”是现代中文中对ἀθανασία的简洁、庄重表达，既可指不受死亡辖制，也可与下句的长久名声发生联系，而不预先限定其范围。
- source_word: μνήμην αἰώνιον
  choice: 永远记念我
  rationale: 该词组表示长久存留的记忆、纪念或声名。译作“永远记念我”把希腊语名词结构自然转化为现代中文动词结构，并由说话者语境补出所记念的对象“我”。
- source_word: τοῖς μετʼ ἐμὲ
  choice: 后世
  rationale: 指说话者之后的人或世代。“后世”简洁自然，涵盖后人及后来世代。
- source_word: ἀπολείψω
  choice: 要使……记念
  rationale: ἀπολείπω在这里指为后来的人留下某种长存之物。结合中文表达习惯，将“留下永远的记念”动态化为“使后世永远记念我”。
theological_decisions:
- issue: “不朽”与人格化智慧及下句“永远记念”的关系
  choice: 保留“不朽”本身的开放含义，不限定为个人永不死亡，也不把它完全等同于身后留名。
  alternative: 明确译成“永生”，或解释为“名垂不朽”。
  rationale: ἀθανασίαν与“永远记念”并列而又彼此相关；原文没有明确要求二者完全同义，也没有充分界定“不朽”的形而上范围。保留张力更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“借着她”保留智慧的女性人格化；“使后世永远记念我”避免生硬直译“给后来的人留下永远的记忆”。脚注标记均已在正文中出现。
