  text: Fearsome tyrants will fear me when they hear[a]; among the multitude I will appear good[b], and in war courageous.
translation:
  language: zh_hans
  text: 可畏的暴君一听见，就必惧怕我；在众人中，我必显得良善；在战争中，我必显得勇敢。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβηθήσονταί με
  choice: 也必惧怕我
  rationale: 该将来时形式在此表示暴君将对说话者产生惧怕；“惧怕我”直接保留原文的宾语关系。“也”使“可怕的暴君反而惧怕我”的修辞对照在汉语中更清楚，但不增添新的命题。
- source_word: ἀκούσαντες
  choice: 听到后
  rationale: 不定过去时分词在此作时间状语。原文没有明说听到什么，因此不补入“我的名声”等对象，以保留原文的省略。
- source_word: τύραννοι φρικτοί
  choice: 可怕的暴君
  rationale: τύραννοι 指专横的统治者，译作“暴君”；φρικτοί 表示令人战栗、可畏，译作“可怕的”，自然地修饰“暴君”。
- source_word: ἐν πλήθει
  choice: 在众人中
  rationale: πλῆθος 表示众多的人；“在众人中”保留其宽泛的公共场合含义，不限定为正式集会。
- source_word: φανούμαι
  choice: 我必显为／我必显得
  rationale: 该词在这里可表示显现或被人看出具有某种品格。“显为／显得”既自然，又不强行判定重点在自我表现还是他人评价。
- source_word: ἀγαθός
  choice: 贤良
  rationale: 此词可涵盖道德上的良善、品格高尚及治理中有益于人。“贤良”适合公共领导语境，同时避免只理解为抽象的“善良”。
- source_word: ἐν πολέμῳ ἀνδρεῖος
  choice: 在战争中……勇敢
  rationale: ἀνδρεῖος 表示勇武、有胆量；“勇敢”以现代汉语传达其德性含义，不带现代语境中不必要的性别色彩。
theological_decisions:
- issue: 说话者兼具公共德行与战争勇气
  choice: 保留“在众人中贤良、在战争中勇敢”的并列描述
  alternative: 将其扩展解释为理想君王的仁政与军事才能
  rationale: 原文确实并置公共场合中的ἀγαθός与战争中的ἀνδρεῖος，但没有在本节展开完整的政治或君王神学，因此译文不作超出经文的阐释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听到后”保留原文未说明所听内容的省略；分号呈现前后两组品格描述。“也必”凸显令人惧怕的暴君反而惧怕说话者的修辞张力。
