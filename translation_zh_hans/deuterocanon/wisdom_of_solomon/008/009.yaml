base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
translation:
  language: zh_hans
  text: 因此，我决定带她来和我共同生活[a]，因为我知道，她会在美善之事上作我的顾问，也会在忧虑和悲伤中给我劝勉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“娶她”或“接她作妻子”。希腊文直译为“带她来共同生活”；本节使用拟人化的智慧意象，却没有明确采用表示婚姻的词。
    reason: alternative_reading
  - marker: b
    text: “劝勉”也可译作“鼓励”或“安慰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  choice: 因此，我决定
  rationale: ἔκρινα表示经过判断后作出确定的决定；τοίνυν承接上文并引出结论，译作“因此”自然且清楚。
- source_word: ταύτην
  choice: 她
  rationale: 所指是被拟人化为女性的智慧；中文用“她”可保留这一拟人形象。
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  choice: 接她来与我共同生活
  rationale: 原文表达把她带来一同生活，并未在本节明确使用“结婚”或“妻子”等词；此译保留亲密的共同生活意象而不作过度限定。
- source_word: εἰδὼς
  choice: 因为我知道
  rationale: 分词说明作出决定的理由；展开为原因从句更符合现代汉语表达。
- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: 她会在美善的事上作我的顾问
  rationale: σύμβουλος是“顾问、谋士”；ἀγαθῶν含义宽泛，译作“美善的事”既保留其广度，也不局限为实用利益或单一道德范畴。
- source_word: παραίνεσις
  choice: 劝勉
  rationale: 该词通常指劝告、劝勉或鼓励；“劝勉”保留其言语引导的核心意义，不因忧虑与悲伤的语境而直接收窄为“安慰”。
- source_word: φροντίδων καὶ λύπης
  choice: 在忧虑和悲伤中
  rationale: φροντίδων指令人挂虑的忧愁或担心，λύπης指悲伤、痛苦；介词关系在希腊文中简约，中文以“在……中”自然表达相关处境。
theological_decisions:
- issue: 共同生活的措辞是否应明确译成婚姻
  choice: 接她来与我共同生活
  alternative: 娶她／接她作妻子
  rationale: 上下文确有婚姻式的智慧拟人意象，但本节只明确说“为了共同生活而带来”。正文不把隐含意象提升为明说的婚姻关系，并以脚注提供可能的理解。
- issue: παραίνεσις在忧虑和悲伤语境中的含义
  choice: 劝勉
  alternative: 安慰／鼓励
  rationale: 语境容许支持、慰藉的意味，但该词本身仍可表示劝告或劝勉。采用较贴近词义核心的“劝勉”，并在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“共同生活”保留原文关系亲密但未明言婚姻的张力；“顾问”和“劝勉”清楚传达智慧在判断与患难中的双重作用。
