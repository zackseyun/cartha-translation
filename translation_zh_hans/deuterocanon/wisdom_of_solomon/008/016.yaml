base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/016.yaml
  text: When I go into my house[a], I will find rest beside her; for her company has no bitterness, nor does living with her have pain, but gladness and joy.
translation:
  language: zh_hans
  text: 我进到家中，就要在她身旁安歇[a]；因为与她相伴没有苦涩，与她共同生活也没有痛苦，只有欢欣和喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与她一同安歇。”希腊文动词含有在智慧近旁、与她亲密相伴而安歇的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 我进到
  rationale: 将不定过去时分词按主句的时间背景自然译出，既保留“进入”的动作，也避免生硬直译为“进入以后”。
- source_word: προσαναπαύσομαι αὐτῇ
  choice: 就要在她身旁安歇
  rationale: 动词表示安歇、休息，并含有与智慧亲近相伴的意味；“在她身旁安歇”保留这种空间和关系上的贴近感。
- source_word: συναναστροφή
  choice: 与她相伴
  rationale: 该词指交往、相处或陪伴；此处译为“与她相伴”，符合现代汉语，也与下句共同生活的表达有所区别。
- source_word: πικρίαν
  choice: 苦涩
  rationale: 保留原词既可指苦味、又可比喻不快与严酷的形象性。
- source_word: συμβίωσις
  choice: 与她共同生活
  rationale: 直接表达一同生活、共享日常的含义，避免较技术化或容易引起歧义的用语。
- source_word: ὀδύνην
  choice: 痛苦
  rationale: 涵盖身体或内心的疼痛、忧苦，符合本句与喜乐相对的语境。
- source_word: εὐφροσύνην
  choice: 欢欣
  rationale: 表达愉悦、欢畅，并与后面的“喜乐”分别译出，以保留希腊文双重表达的修辞力度。
- source_word: χαράν
  choice: 喜乐
  rationale: 采用清楚而庄重的常用译法，并与“欢欣”并列，保留原文两个近义名词。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 持续使用女性代词“她”
  alternative: 把智慧抽象化而使用“它”，或在各处重复“智慧”
  rationale: 希腊文以阴性代词指向智慧，原文有意将智慧人格化；保留“她”可呈现其文学和神学张力，而不把它化约为抽象概念。
- issue: προσαναπαύσομαι αὐτῇ 所表达的亲近关系
  choice: 在她身旁安歇
  alternative: 与她一同安歇
  rationale: 所选译文呈现 πρός- 可能带出的贴近意味，同时脚注保留较直接的共同安歇理解，不把细微语义限定为唯一解释。
translation_notes:
  register: 采用现代、自然而庄重的书面汉语。“我进到家中，就要……”顺畅表达分词与将来时主句的关系；“苦涩—痛苦”与“欢欣—喜乐”保持原文的平衡和对照。
