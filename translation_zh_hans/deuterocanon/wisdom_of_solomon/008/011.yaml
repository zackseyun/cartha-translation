  source_fidelity: 主文总体准确传达将来时、未明说的被动认定，以及在判断中的敏锐和在掌权者面前受赞叹的意思。不过，脚注 b 将 ἐν ὄψει 的备选释为“在掌权者中间”，缺少“眼前／面前”的视觉、公开呈现之义，不是此短语合适的词汇替代。
  naturalness: “人们会发现我判断敏锐”可以理解，但“我在判断上会显得敏锐”更自然地保留“被发现／显为”的希腊语习语，且不补出“人们”这一施事者。“我会受到赞叹”也比“我会令人赞叹”更直接对应将来被动式。
