  text: I will be found keen in judgment[b][a], and in the sight of rulers I will be admired.
translation:
  language: zh_hans
  text: 我在判断上会显得敏锐[a]；在掌权者眼前[b]，我会受到赞叹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在判断中显得锐利。”原文所用的词本义为“锋利、锐利”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在掌权者面前”或“在掌权者的视野中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: 敏锐
  rationale: 该词本义为“锋利、锐利”，用于判断时表示思维或辨别力敏锐；此译自然地保留了比喻意义。
- source_word: εὑρεθήσομαι
  choice: 人们会发现我……
  rationale: 保留将来被动式“将被发现、显明为”的含义，同时以现代汉语自然表达其未明说的施事者。
- source_word: ἐν κρίσει
  choice: 判断
  rationale: κρίσις可指判断、裁决或审判过程；“判断”保持较宽的语义范围，不限定为法庭审理。
- source_word: ἐν ὄψει
  choice: 在……面前
  rationale: 原短语直指“在……眼前、视线之内”；“在……面前”兼顾公开呈现和身处其面前的意味。
- source_word: δυναστῶν
  choice: 掌权者
  rationale: δυνάστης指拥有权势的人；“掌权者”比“君王”范围更宽，也比“有权势的人”更凝练。
- source_word: θαυμασθήσομαι
  choice: 我会令人赞叹
  rationale: 将来被动式表示成为他人惊叹或钦佩的对象；“令人赞叹”既保留惊异感，也符合此处正面的评价语境。
