  text: And if wealth is a desirable possession in life, what is richer than wisdom, which works all things?
translation:
  language: zh_hans
  text: 若财富是人生中值得追求的财物，那么，有什么比成就万事的智慧更富足呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就万事”也可译作“作成一切”或“施行一切”。希腊语的表达范围宽广，强调智慧在一切事上有效的作为，并不限定为创造。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: 财富
  rationale: 指丰厚的财物或资财；“财富”是现代汉语中自然、概括的表达，也能与下文“更丰富”形成词义呼应。
- source_word: ἐπιθυμητὸν
  choice: 值得追求的
  rationale: 表达“可欲、令人向往”的评价意义；结合“人生中”与“产业”，译为“值得追求的”自然清楚。
- source_word: κτῆμα
  choice: 产业
  rationale: 指取得并拥有之物。“产业”兼具财产和所有物的含义，适合此处以财富为语境的表达。
- source_word: ἐν βίῳ
  choice: 人生中
  rationale: 表示在人生或现世生活之中；“人生中”简洁自然，不额外限定为“今生”。
- source_word: τί ... πλουσιώτερον
  choice: 有什么……更丰富呢
  rationale: 保留比较级的财富隐喻，并以反问句呈现原文句法；“丰富”也可涵盖超越物质财富的丰盛。
- source_word: σοφίας
  choice: 智慧
  rationale: σοφία的标准译法，也是本书的核心概念。
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: 成就万事的
  rationale: 阴性分词短语修饰“智慧”。ἐργάζομαι可表示工作、产生或成就；“成就万事”在现代汉语中自然，并保留智慧广泛而有效的作为，未将其限定为创造。
theological_decisions:
- issue: τὰ πάντα ἐργαζομένης所指智慧作为的范围
  choice: 成就万事的
  alternative: 造作万物的；运行万事的
  rationale: 原文赋予智慧广泛而有实效的能动作用，但ἐργάζομαι本身并不要求专指从无创造。“成就万事”保留其神学分量及范围上的开放性，避免加入原文未明说的形而上限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“财富—更丰富”保持原文的词义呼应；“那么，有什么……呢”自然呈现反问语气。
