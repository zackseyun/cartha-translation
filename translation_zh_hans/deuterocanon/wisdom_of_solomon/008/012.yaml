  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/012.yaml
  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: zh_hans
  text: 我沉默时，他们会等候我；我开口时，他们会留心听；我讲得较久时，他们便会用手掩口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用手掩口”表示在说话者面前保持缄默、克制言语，也可表达敬畏。
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: 我沉默时
  rationale: 现在分词作时间性状语，并以με为其主语；译为“我沉默时”自然地保留原文结构。
- source_word: περιμενοῦσιν
  choice: 他们会等候我
  rationale: 该动词表示等候、等待；“等候我”既保留宾语，也体现众人静候他说话的语境。
- source_word: φθεγγομένῳ
  choice: 我开口时
  rationale: 该分词表示发声或说话；“开口”与前句“沉默”形成自然对照，同时不额外限定所说内容。
- source_word: προσέξουσιν
  choice: 他们会留心听
  rationale: προσέχω在此表示专注、留意；补出“听”使现代汉语语义明确，并符合言说语境。
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: 我讲得较久时
  rationale: 属格独立结构带有时间意味，ἐπὶ πλεῖον表示持续更久或讲得更多；避免译成条件句，以免加入原文没有的“若”。
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: 他们便会用手掩口
  rationale: 贴近“把手放在自己的口上”这一动作；“用手掩口”简洁庄重，并保留其象征沉默克制的文化意涵。
