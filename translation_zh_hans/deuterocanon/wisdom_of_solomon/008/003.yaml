  text: Her nobility is glorified by living together with God[a], and the Master of all loved her.
translation:
  language: zh_hans
  text: 她与上帝共同生活，使她的尊贵得以彰显[a]；万有的主宰爱她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她与上帝相伴，使她的高尚品格受到尊崇。”希腊语“共同生活”（συμβίωσις）也可指相伴或共享生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγένειαν
  choice: 尊贵
  rationale: 该词可指高贵出身、尊贵或高尚品格；这里描写智慧的卓越与尊荣，用“尊贵”既自然，也保留词义的宽度。
- source_word: δοξάζει
  choice: 使……更显荣耀
  rationale: 原文以“共同生活”为主语、“尊贵”为宾语，表达与上帝共同生活使她的尊贵得到彰显；此译保留主动句法，并符合现代汉语表达。
- source_word: συμβίωσις
  choice: 共同生活
  rationale: 该名词可指共同生活、相伴或共享生命；“共同生活”保留其具体而亲密的语义，不将其弱化为泛泛的关系。
- source_word: θεοῦ
  choice: 上帝
  rationale: 作συμβίωσις的属格关联成分，指与上帝共同生活。
- source_word: ἔχουσα
  choice: 她与上帝共同生活
  rationale: 该阴性分词与拟人化的智慧相应；汉语将“具有与上帝共同生活”转化为自然的分句，同时保留“她”所指的女性人格化形象。
- source_word: ὁ πάντων δεσπότης
  choice: 万有的主宰
  rationale: δεσπότης意为主人、主宰或统治者，并非κύριος；“主宰”既体现统辖权，也保留与通常译作“主”的κύριος之间的词汇区别。
- source_word: ἠγάπησεν
  choice: 爱
  rationale: 简单过去时在汉语中通常不需另加时态标记；“也爱她”自然表达原文不定过去时的陈述。
- source_word: αὐτήν
  choice: 她
  rationale: 上下文将智慧人格化为女性，原文也使用阴性代词；译作“她”保留这一文学与神学表达。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 用“她”指智慧
  alternative: 用“它”将智慧视为抽象属性
  rationale: 希腊文采用阴性形式，并将智慧描绘为女性人物。保留“她”忠实呈现本段的文学神学，同时不进一步认定她与任何后来的教义身份等同。
- issue: δεσπότης的神圣称号
  choice: 译作“主宰”
  alternative: 译作“主”或“统治者”
  rationale: 原文是δεσπότης而非κύριος；“主宰”既传达对万有的权柄，也避免抹平不同希腊称号之间的区别。
- issue: συμβίωσις的关系强度
  choice: 译作“共同生活”
  alternative: 译作“相伴”或“交往”
  rationale: “共同生活”保留原词共享生活的具体含义；脚注说明也可理解为相伴，以免把原文的语义范围收窄为单一方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更显荣耀”避免生硬的“被荣耀”，并保留δοξάζει的彰显、增荣之意；“万有的主宰”保持神圣称号的庄严感。
