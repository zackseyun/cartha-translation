  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/001.yaml
  text: But she reaches mightily from one end to the other[a], and she governs all things well.
translation:
  language: zh_hans
  text: 她强而有力地从一端伸展到另一端[a]，并妥善治理万物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她从一端强而有力地伸展到另一端。”
    reason: “伸展”也可译为“延伸”或“达到”；该表达保留原文从一端到另一端的全面跨度及其力量。
lexical_decisions:
- source_word: διατείνει
  choice: 延伸
  rationale: 此动词表示伸展、贯通或达到某一范围；“延伸”保留空间跨度的意象，又不额外引入“遍及”所可能包含的解释。
- source_word: ἀπὸ πέρατος εἰς πέρας
  choice: 从一端到另一端
  rationale: 自然表达由一个极端直到另一个极端的完整范围，保留原文所强调的全面跨度。
- source_word: εὐρώστως
  choice: 强有力地
  rationale: 原词表示强健、有力或充满力量；此译清楚而庄重，能体现智慧延伸时的能力与效力。
- source_word: διοικεῖ
  choice: 治理
  rationale: 原词有管理、安排、治理之意；“治理”最能传达智慧对万物持续而主动的统摄。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 表示一切事物的总体；“万物”简洁庄重，并适合本节的宇宙性范围。
- source_word: χρηστῶς
  choice: 妥善
  rationale: 原词可表示良好、合宜，也可能带有良善或仁厚的意味；“妥善”在治理语境中兼顾良好与合宜，而不过度限定为仁慈。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处连接词可表示轻微转折或承接。中文单节中若硬译为“但是”会加强原文未必具有的对立；通过句式自然承接，更符合其语篇功能。
- source_word: implicit feminine subject (Wisdom)
  choice: 她
  rationale: 隐含主语承接上下文中被人格化、语法上为阴性的“智慧”；用“她”保留这一文学形象，而不对其本体身份作进一步界定。
theological_decisions:
- issue: 智慧的人格化
  choice: 以女性代词“她”指代智慧
  alternative: 重复使用“智慧”，避免代词带来的较强人格感
  rationale: 希腊文上下文把智慧呈现为施行行动的阴性人格化主体。保留“她”忠实反映文本的文学—神学表达，但不据此断定智慧是独立位格，也不把她直接等同于任何后来的教义身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强有力地”表达力量，“妥善治理”保持治理之良好、合宜及可能的良善意味；整体保留智慧的女性人格化和全域统摄意象。
