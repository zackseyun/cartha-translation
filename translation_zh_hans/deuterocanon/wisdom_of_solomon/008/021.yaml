base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: zh_hans
  text: 但我知道，除非上帝赐予，我就无法自制；而知道这恩赐是谁所赐，这也是明智[a]。于是我向主祈求，恳求他，并且全心全意地说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明智”也可译作“有见识”。“恩赐”所译的希腊词也可指“恩惠”或“恩典”；这里指使人能够自制的赐予来自上帝。
    reason: 保留φρόνησις与χάρις的词义范围，并说明上下文中的具体所指。
lexical_decisions:
- source_word: γνοὺς
  choice: 我知道
  rationale: 以认知动词自然引出说话者已经领悟的事实；希腊语不定过去分词的先行动作可由上下文体现，无须生硬译成“既已知道”。
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατὴς ἐὰν μὴ ὁ θεὸς δῷ
  choice: 除非上帝赐下，我就不可能自制
  rationale: 保留“唯有上帝赐予才可能”的排他条件；ἐγκρατής指对欲望和情感的节制、自我掌控，译作“自制”简洁自然。原文未明说所赐对象，中文“赐下”也可保持这一省略。
- source_word: καὶ τοῦτο δὲ ἦν φρονήσεως
  choice: 本身也是明智
  rationale: φρόνησις在此指实际的明辨和见识；“明智”符合现代汉语，并保留认出恩赐来源本身即属智慧的含义。
- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: 知道这恩赐出于谁
  rationale: χάρις在语境中指上帝所赐、使人能够自制的恩惠或恩赐；“恩赐”兼顾赠予和恩惠，且“出于谁”清楚表达属格所指的来源。
- source_word: ἐνέτυχον τῷ κυρίῳ
  choice: 我求告主
  rationale: ἐντυγχάνω与向主祷告的语境结合，表示向其陈情、求告；“求告”庄重而通俗。
- source_word: ἐδεήθην αὐτοῦ
  choice: 恳求他
  rationale: δέομαι表达迫切祈求；“恳求”保留强度，也与前面的“求告”构成递进。
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: 全心
  rationale: 忠实表达“从我的全心”，用现代汉语惯用的“全心”传达完全真诚和投入。
theological_decisions:
- issue: χάρις应译作“恩典”、“恩惠”还是“恩赐”
  choice: 恩赐
  alternative: 恩典；恩惠
  rationale: 上下文强调自制是上帝所赐，而不是人单靠自己获得；“恩赐”最直接体现具体的赐予，同时脚注保留“恩惠”的词义可能，避免把该词限定为后期神学术语。
- issue: 自制与上帝赐予之间的关系
  choice: 保留“除非……就不可能……”的必要条件表达
  alternative: 弱化为“若有上帝帮助，我便能自制”
  rationale: 原文οὐκ ἄλλως与ἐὰν μή共同强调除此以外别无途径，不宜把它弱化为一般性的帮助。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这是向上帝祷告的语境，“主”是自然、传统且不附加宗派含义的对应词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝”对应θεός，“主”对应κύριος。“于是我求告主，恳求他”保留原文两个相近祈求动词的叠加及迫切语气；末尾冒号承接第九章随后的祷告。
