  text: And as a young man I will have glory among crowds[a], and honor before elders,
translation:
  language: zh_hans
  text: 我虽年轻，却要在众人中享有声望[a]，在长者面前受到尊重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我年轻时，要在众人中享有声望，在长者那里受到尊重。”希腊文末尾的“年轻人”（ὁ νέος）表达紧缩，既可指“年轻的我”，也可理解为“虽年轻”或“年轻时”。
    reason: 保留ὁ νέος在句法及让步、时间含义上的歧义。
lexical_decisions:
- source_word: ἕξω
  choice: 我要享有／受到
  rationale: 这是ἔχω的将来时第一人称单数；结合两个不同宾语，分别自然译作“享有声望”和“受到尊重”，保留未来意味。
- source_word: δόξαν
  choice: 声望
  rationale: δόξα在此处于众人和长者构成的社会评价语境中，主要指名望、荣誉；“声望”比“荣耀”更准确地传达公共名誉。
- source_word: ἐν ὄχλοις
  choice: 在众人中
  rationale: ὄχλοι指人群、众人；“在众人中”自然庄重，并保留ἐν的群体范围含义。
- source_word: τιμήν
  choice: 尊重
  rationale: τιμή可指尊荣、敬重；与“声望”区分开来，译为“尊重”能表达长者给予或认可的敬意。
- source_word: παρὰ πρεσβυτέροις
  choice: 在长者面前
  rationale: παρά加与格可表示在某人那里、面前或其评价范围内；此译法不武断限定尊重必定“来自”长者。
- source_word: ὁ νέος
  choice: 我虽年轻
  rationale: 希腊文形式紧缩，字面为带冠词的“年轻人”；结合第一人称ἕξω，译为让步性的“我虽年轻”符合语境，同时以脚注保留其他句法理解。
