base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: zh_hans
  text: 若有人甚至渴求丰富的经验[a]，智慧通晓古事，也能推断未来之事[b]；她明白言辞的转折和谜语的解法，预先知道征兆和奇事，以及各个时机和时期的结果。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“广泛的经验”、“丰富的阅历”或“深厚的见识”。
    reason: lexical_alternative
  - marker: b
    text: 或译“揣度将来之事”。这里的希腊语动词力度弱于后文的“预先知道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  choice: 广博的阅历
  rationale: 该词指由经验而来的广泛见识或丰富阅历；“广博的阅历”既保留 πολυ- 所表达的广度，也不把含义局限于学术知识。
- source_word: ποθεῖ
  choice: 渴求
  rationale: 表达强烈而持续的愿望，语气庄重，又符合现代汉语。
- source_word: τὰ ἀρχαῖα
  choice: 古事
  rationale: 概括古代或往昔之事，不将其过度限定为万物起源。
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: 能推断未来之事
  rationale: εἰκάζειν 通常指根据迹象推测或判断，力度弱于本节稍后的 προγινώσκει；“推断”保留了这一差别。
- source_word: στροφὰς λόγων
  choice: 言辞的转折
  rationale: 可涵盖言语、修辞或论述中的曲折与微妙之处，同时保持汉语清楚自然。
- source_word: λύσεις αἰνιγμάτων
  choice: 谜语的解法
  rationale: 直陈 λύσεις 的解开、解决之意和 αἰνιγμάτων 的谜语、隐语之意。
- source_word: σημεῖα καὶ τέρατα
  choice: 征兆和奇事
  rationale: 既保留“标志、征兆”与“非凡奇事”的并列，也避免在原文未明说时擅自加入“神”字。
- source_word: προγινώσκει
  choice: 预先知道
  rationale: 准确表达事先知道，并与前文较弱的“推断”形成原文所有的力度差别。
- source_word: ἐκβάσεις
  choice: 结局
  rationale: 该词指事情最终的结果或归宿；“结局”适合时节与年代的发展结果。
- source_word: καιρῶν καὶ χρόνων
  choice: 时节和年代
  rationale: “时节”传达 καιρός 所含适当、特定时机之意，“年代”传达 χρόνος 较一般的时间进程；并列保留原文区分。
theological_decisions:
- issue: 智慧的人格化与阴性指称
  choice: 先明说“智慧”，随后用“她”指称
  alternative: 全程重复“智慧”，或将其作为非人格抽象概念处理
  rationale: 上下文将智慧塑造成女性人格形象；“她”忠实保存这一文学表达，却不据此加入关于其本体或后世教义身份的断言。
- issue: εἰκάζειν 与 προγινώσκει 的力度差别
  choice: 分别译作“推断”和“预先知道”
  alternative: 都译作“预见”或“预知”
  rationale: 前者偏重依据迹象推测，后者明确表示事先知道；区分二者可保留经文本身的张力和措辞层次。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“古事”“奇事”保留智慧文学的凝练感；句中明确提出“智慧”后再用“她”，使人格化清晰且行文流畅。所有脚注标记均置于所说明的词组之后。
