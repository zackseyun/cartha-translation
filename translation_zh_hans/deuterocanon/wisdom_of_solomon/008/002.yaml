base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/002.yaml
  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: zh_hans
  text: 我自年轻时便爱她，并竭力寻求她；我又寻求娶她作自己的新娘[a]，也成了爱慕她美貌的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“寻求把她领来作自己的新娘。”
    reason: 说明ἀγαγέσθαι ἐμαυτῷ字面上“领来归自己”的婚嫁表达，以及正文“娶她作自己的新娘”所作的自然汉语处理。
lexical_decisions:
- source_word: Ταύτην
  choice: 她
  rationale: 指向上文被女性人格化的智慧；用“她”自然保留原文的阴性人格化。
- source_word: ἐφίλησα
  choice: 爱慕
  rationale: 此处表达对人格化智慧的深厚爱恋，而非字面的亲吻；“爱慕”也契合全节的婚恋意象。
- source_word: ἐξεζήτησα
  choice: 竭力寻求
  rationale: 复合动词带有加强语气；“竭力寻求”既体现这种力度，也保持现代汉语的庄重自然。
- source_word: ἐκ νεότητός μου
  choice: 从年轻时
  rationale: 准确表达自青年时期开始并延续下来的时间含义，且便于普通现代读者理解。
- source_word: ἐζήτησα
  choice: 想
  rationale: 在求娶语境中，该动词可表达追求和意愿；译作“想”避免汉语中“寻求娶她”的生硬，同时仍保留主动追求之意。
- source_word: νύμφην
  choice: 新娘
  rationale: 直接保留原文的婚嫁和新娘意象，不将人格化的智慧抽象化。
- source_word: ἀγαγέσθαι ἐμαυτῷ
  choice: 娶她作自己的新娘
  rationale: 这是领女子归己、与之成婚的表达；“娶她作自己的新娘”自然传达婚姻含义，并体现反身成分。
- source_word: ἐραστὴς
  choice: 爱恋……的人
  rationale: 保留强烈的爱恋意味及全节的婚恋语调，又比现代汉语中可能产生歧义的“情人”更准确庄重。
- source_word: τοῦ κάλλους αὐτῆς
  choice: 她的美貌
  rationale: κάλλος在此直指美丽；“美貌”贴合女性人格化和求婚意象。
theological_decisions:
- issue: 以婚恋语言人格化智慧
  choice: 保留女性代词、新娘、美貌及爱恋等意象
  alternative: 淡化为珍视智慧或仰慕智慧的卓越
  rationale: 希腊文本明确把智慧描写成受爱慕、寻求和求娶的女子；直面这种诗性张力比改写成抽象观念更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以分号呈现三个递进动作，保留原文从爱慕、寻求到求娶和爱恋其美貌的诗性发展。
