  language: zh_hans
  text: 我必治理万民，列国也必顺服我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοικήσω
  choice: 我必治理
  rationale: 该词为διοικέω的将来主动式，表示管理、治理；“治理”自然地体现政治领导，又避免“统治”可能带来的强硬色彩。
- source_word: λαούς
  choice: 万民
  rationale: λαός的复数表示多个群体或众民；“万民”在庄重的经文语体中自然表达复数集合意义，并与下句“列国”保持词汇区别。
- source_word: ἔθνη
  choice: 列国
  rationale: 在此政治语境中指各邦国或民族国家；“列国”简洁庄重，也不会引入“外邦人”的宗教族群含义。
- source_word: ὑποταγήσεταί
  choice: 必顺服
  rationale: 该形式可按将来被动或中间意义理解，核心是处于从属地位。“顺服”保留主动归服与被置于从属地位之间的一定张力，避免明确强化武力强制。
- source_word: μοι
  choice: 我
  rationale: 与“顺服”搭配时，希腊语关系与格在现代汉语中可直接译作“顺服我”，无需另加介词。
