base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: zh_hans
  text: 同她为友，有美好的喜乐；在她双手的劳作中，有永不枯竭的财富；在同她交往、共同操练中[a]，有明智；分享她的话语，便有美名[b]。我四处寻求，要怎样才能把她得来归自己[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同她交往、共同操练”也可译作“在同她一起操练的交往中”。希腊文把共同操练、密切交往或交谈等意思紧密结合在一起。
    reason: lexical_alternative
  - marker: b
    text: “美名”也可译作“荣誉”或“好名声”；“分享她的话语”也可能含有“与她交谈”或“参与她的教导”之意。
    reason: lexical_alternative
  - marker: c
    text: “把她得来归自己”也可译作“将她领到自己这里”或“为自己得着她”。原文保持了把人格化的智慧归于自己的意味，却没有在这里明确说是婚姻。
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ αὐτῆς
  choice: 同她为友
  rationale: 表达与人格化智慧建立友谊关系的含义，既自然，又不把关系浪漫化。
- source_word: τέρψις ἀγαθή
  choice: 美好的喜乐
  rationale: τέρψις指喜悦、享受，ἀγαθή明确赋予正面价值；译文保留这种道德评价。
- source_word: πόνοις χειρῶν αὐτῆς
  choice: 她双手的劳作
  rationale: 保留原文具体的“双手”意象及πόνοι所含劳作、辛劳之意。
- source_word: πλοῦτος ἀνεκλιπής
  choice: 永不枯竭的财富
  rationale: ἀνεκλιπής表示不衰竭、不止息；“永不枯竭”在现代汉语中清楚自然。
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: 在与她交往、共同操练中
  rationale: 原文把共同操练与交往压缩在同一结构中；译文并列呈现两层含义，避免只译作一般“陪伴”而失去操练意味。
- source_word: φρόνησις
  choice: 明智
  rationale: φρόνησις偏重审慎而实际的智慧；“明智”避免与本段人格化的“智慧”用词混同。
- source_word: εὔκλεια
  choice: 美名
  rationale: 该词主要指良好声誉、荣名；“美名”比宽泛的“尊荣”更贴近公众赞誉这一语义。
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: 分享她的话语
  rationale: κοινωνία表示分享、参与，λόγοι可指话语、言论或教导；此译保留参与其话语的意思。
- source_word: περιῆλθον ζητῶν
  choice: 我四处寻求
  rationale: περιέρχομαι与ζητῶν共同传达为寻求而四处奔走、积极追寻的意味。
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: 要怎样才能将她得来归我
  rationale: 兼顾λαμβάνω的取得、接受义和εἰς ἐμαυτόν的归于自己之意，同时不把表达限定为婚姻或内在化。
theological_decisions:
- issue: 智慧以女性形象出现，并以关系性语言描述
  choice: 全节以“她”指智慧，并保留与她为友、交往以及将她得来归己的个人性表达
  alternative: 将智慧完全抽象化，或把“将她得来归我”明确解释为娶她为妻
  rationale: 希腊文持续使用阴性代词和关系性意象，但本节本身没有明确说明婚姻；译文保留人格化及其张力，不进一步作教义化限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以分号保留原文层层并列的节奏。女性代词“她”维持智慧的人格化。对难以直译的συγγυμνασία与ὁμιλία采取正文适度展开、脚注保留其他可能性的处理。
