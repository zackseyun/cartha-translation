  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/017.yaml
  text: When I considered these things within myself and reflected in my heart that there is immortality in kinship with wisdom,[a]
translation:
  language: zh_hans
  text: 我在心里思量这些事，又在心中思索：与智慧有亲缘关系，其中有不朽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不朽在于与智慧的亲缘关系。”希腊语“亲缘关系”可指亲属般的密切关联；该表达可能暗含藉此而有不朽，却没有明确说明因果关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: 我在心里思量这一切
  rationale: λογίζομαι在此表示内在的推想、权衡；“思量”自然地传达审慎思考。结合ἐν ἐμαυτῷ译作“在心里”，避免生硬的“在我自己里面”。
- source_word: καὶ φροντίσας ἐν καρδίᾳ μου
  choice: 又在心中深思
  rationale: φροντίζω指认真思想、思索；“深思”与前句形成递进，同时保留ἐν καρδίᾳ μου的“心”这一原文意象。
- source_word: ὅτι ἐστιν ἀθανασία
  choice: 就有不朽
  rationale: ἀθανασία译为“不朽”，保留其不死亡、永存的含义；ἐστιν采用存在句“有”，表达简洁自然。
- source_word: ἐν συγγενείᾳ σοφίας
  choice: 与智慧亲近
  rationale: συγγένεια本指亲属关系，也可指亲近、亲缘或密切关联。“与智慧亲近”在现代汉语中自然，并保留关系性的核心，但其与“不朽”的具体逻辑关系仍需脚注说明。
theological_decisions:
- issue: ἐν συγγενείᾳ σοφίας所表达的智慧与不朽之间的关系
  choice: 与智慧亲近，就有不朽
  alternative: 因与智慧相亲而得不朽；与智慧有亲缘，就有不朽
  rationale: 原文以ἐν加关系名词把不朽与智慧的亲近关系相联，并未明确说明因果机制。“就有”在中文中保持二者的紧密关联，同时不采用“得”“带来”等更明确的因果措辞；脚注进一步保留关系性与可能因果意味之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在心里思量”与“在心中深思”保留原文平行的内在反省表达；“亲近”避免“亲缘”在正文中显得生硬，脚注则补出原词的亲属关系意象与语义张力。
