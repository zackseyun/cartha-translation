  text: I was a gifted child[a], and I received a good soul,
translation:
  language: zh_hans
  text: 我原是个禀赋优良的孩子[a]，也得了美好的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “禀赋优良”也可译作“天资优越”；希腊语所指的先天优越较为宽泛，并不限于聪明才智或外在体格。
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς
  choice: 孩子
  rationale: 这里回顾说话者幼年时的禀赋，因此采用年龄意义上的“孩子”；不额外限定性别，也不取本处不合语境的“仆人”义。
- source_word: εὐφυής
  choice: 禀赋优良
  rationale: 此词可指天生长成良好、资质优越或本性良好。“禀赋优良”保留其宽泛的先天优越之意，避免只理解为外形端正或智力聪颖。
- source_word: ἤμην
  choice: 我原是
  rationale: 用“原是”自然表达未完成时对早年状态的回顾，不添加原文没有的明确时间副词。
- source_word: ἔλαχον
  choice: 得了
  rationale: 该动词有“分得、获配、获得”之意；“得了”简洁表达这一领受，并保留某种并非自行造就的意味。
- source_word: ψυχῆς
  choice: 灵魂
  rationale: 原文明确使用 ψυχή，具有超出单纯生命或性情的人的内在构成含义；“灵魂”保留其人论分量与可能的神学张力。
- source_word: ἀγαθῆς
  choice: 美好的
  rationale: “美好的”表达宽泛的正面评价，不把含义收窄为仅仅道德上的“善良”或“有德”。
theological_decisions:
- issue: ψυχῆς ἔλαχον ἀγαθῆς 所涉及的人论表达
  choice: 正文保留“得了美好的灵魂”
  alternative: “具有良好的性情”或“得了美好的生命”
  rationale: 希腊文明确说 ψυχή，并以 ἔλαχον 表达获得或分得。保留“灵魂”可忠实呈现原文，并不预先消解身体、灵魂及先天禀赋之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我原是个……”自然承接上下文；“禀赋优良”虽略具书面色彩，但能较准确地保留 εὐφυής 的宽泛含义。
