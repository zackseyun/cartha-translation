  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/006.yaml
  text: And if understanding is effective[b][a], who among existing things is more skillful than she?
translation:
  language: zh_hans
  text: 如果明智能成事[a]，那么在一切存在者中，谁比她更有工匠的技艺呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “能成事”也可译作“发挥作用”“起作用”或“有所成就”。希腊文动词可强调实际运作，也可强调产生结果。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在存在之物中，谁比她更是工匠呢？”希腊文“工匠”为阴性形式，与指“明智”的“她”相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνησις
  choice: 明智
  rationale: 指能判断并指导行动的实际智慧或明达，与上下文中的“智慧”（σοφία）保持词义区别；“明智”也是自然、易懂的现代汉语。
- source_word: ἐργάζεται
  choice: 能成事
  rationale: 该动词表示工作、产生或发挥实际功效；“能成事”既传达有效运作和产生成果，也与下文工匠的意象相呼应。
- source_word: τῶν ὄντων
  choice: 万有
  rationale: 字面意为“存在之物”。此处更自然地理解为工匠施艺的对象，即一切存在之物；“万有”简洁保留其广泛范围。
- source_word: τεχνῖτις
  choice: 工匠
  rationale: 指有技艺的制作之人。汉语职业名词通常不标示性别，因此以代词“她”保留希腊文明确的阴性拟人，同时用“工匠”保留制作和技艺的含义。
- source_word: μᾶλλον
  choice: 更高明
  rationale: 在比较问句中表示“更、更加”；与“工匠”搭配译为“更高明”，符合自然汉语并表达技艺上的比较。
theological_decisions:
- issue: φρόνησις的阴性拟人
  choice: 用“她”保留拟人表达
  alternative: 用中性的“它”，或省略代词
  rationale: 希腊文以阴性代词αὐτῆς和阴性名词τεχνῖτις明确延续拟人手法；保留“她”忠实呈现原文，而不进一步赋予教义性身份。
- issue: φρόνησις与σοφία的关系
  choice: 译作“明智”，不直接译作“智慧”
  alternative: 译作“智慧”
  rationale: 本节所用词是φρόνησις而非σοφία。保持词汇区别，可避免把两者的关系在译文中预先等同。
- issue: τῶν ὄντων的句法归属
  choice: 理解为τεχνῖτις所涉及的对象，即“万有的制作”
  alternative: 理解为比较范围：“在一切存在者中”
  rationale: 词序与常见希腊语结构更支持“万有的工匠／制作万有的工匠”；但另一种句法理解确有可能，故在脚注中说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“能成事”通俗但不随意；“万有的制作”保留工匠意象和宇宙性范围。以“她”明确呈现原文的阴性拟人，职业名词“工匠”则按现代汉语习惯不另造性别标记。
