  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/020.yaml
  text: Rather[a], being good, I came into an undefiled body.
translation:
  language: zh_hans
  text: 不如说，我既是良善的，便来到了一个未受玷污的身体中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进入了一个未受玷污的身体。”希腊文动词直译为“来到”，但按上下文也可理解为进入有形体的生命状态。
    reason: 说明动词ἦλθον的直译和合乎语境的另一种译法，同时不替正文解决灵魂先存的问题。
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: 不如说
  rationale: 该短语承接上文，表示修正并加强前一句的说法；“不如说”自然保留这种转折性重述。
- source_word: ἀγαθὸς ὢν
  choice: 我是善的
  rationale: 直译其善良或美善的性质，不采用“有德行”等解释性更强的表达，也不增添明确的因果关系。
- source_word: ἦλθον
  choice: 来到了
  rationale: 保留ἔρχομαι“来、来到”的基本义，不直接译作“进入”，以免在正文中过早确定其关于灵魂与身体关系的含义。
- source_word: εἰς σῶμα
  choice: 一个……身体之中
  rationale: εἰς表示朝向或进入其中，σῶμα没有冠词；用“一个”避免误译为某个特指的身体。
- source_word: ἀμίαντον
  choice: 未受玷污的
  rationale: 兼顾“不被污染、不受沾染”的本义及其道德和洁净色彩，比泛化的“纯洁”更贴近原词。
theological_decisions:
- issue: “来到一个未受玷污的身体之中”是否明确教导灵魂先存或轮回
  choice: 按希腊文直接翻译，不在正文中判定更广泛的人论含义
  alternative: 将其解释为先存的灵魂进入身体，或解释为生来具有纯净的体质
  rationale: 原文确实说话者“是善的”并“来到”一个未受玷污的身体之中，但没有在本句明说其机制；直译可保留这一神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不如说”体现与上文的修正关系；句法尽量贴近希腊文，并避免使用会明确断定灵魂先存、轮回或单纯出生体质的术语。
