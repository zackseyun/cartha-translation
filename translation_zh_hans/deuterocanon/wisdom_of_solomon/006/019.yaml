  text: and incorruptibility makes one near to God[a].
translation:
  language: zh_hans
  text: 而不朽使人亲近上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不死使人亲近上帝。”希腊词 ἀφθαρσία 可指不受朽坏或败坏的状态；这里译作“不朽”，以保留较宽的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφθαρσία
  choice: 不朽
  rationale: 该词指不受败坏、朽坏的状态。“不朽”在现代汉语中自然凝练，也能保留本体层面的广义；其在本节是否特指“不死”，留由脚注说明。
- source_word: ἐγγὺς
  choice: 亲近
  rationale: 与属格 θεοῦ 连用表示靠近上帝；“亲近上帝”既符合现代汉语，也保留关系性的含义，不将其强化为与上帝联合。
- source_word: εἶναι
  choice: （体现在“亲近”中）
  rationale: 作为 ποιεῖ 的不定式补语，表达“使……处于亲近的状态”；汉语无需另译系词。
- source_word: ποιεῖ
  choice: 使人
  rationale: 此处是使役用法。希腊文未明说受事者，汉语补出泛指的“人”，承接上下文中追求并持守智慧的人。
- source_word: θεοῦ
  choice: 上帝
  rationale: 作为 ἐγγὺς 的属格补语，表达亲近的对象；按现代汉语译为“亲近上帝”。
theological_decisions:
- issue: 句中隐含的受事者
  choice: 补出泛指的“人”：使人亲近上帝
  alternative: “使之亲近上帝”；或把智慧理解为被带到上帝近旁者
  rationale: 原文没有明示 ποιεῖ 的宾语；上下文的论证链指向寻求并拥有智慧的人。补出“人”使汉语完整，但不限定某个特定群体。
- issue: ἀφθαρσία 的含义
  choice: 不朽
  alternative: 不死；不腐朽；不败坏
  rationale: “不朽”可兼顾不受朽坏与不归于消灭的含义，避免直接把词义收窄为仅仅永生；脚注保留“不死”的可能解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“而”承接上一节的推论链；“使人亲近上帝”清楚表达希腊文的使役结构，同时不把“亲近”解释为神秘联合。
