  text: Therefore be instructed by my words[a], and you will benefit.
translation:
  language: zh_hans
  text: 所以，你们要接受我话语的教导[a]，就必得益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“接受我话语的管教”。希腊语动词除“教导”外，也可包含训练或管教的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文并引出推论，保留原文的结论性语气，也符合现代汉语表达。
- source_word: παιδεύεσθε
  choice: 要受……教导
  rationale: 保留命令语气以及被动或中间语态的开放性；该词含教育、训练和管教之意，此处正文采用较宽泛自然的“受教导”。
- source_word: τοῖς ῥήμασίν μου
  choice: 受我的话教导
  rationale: 将与格理解为工具用法，即教导借着说话者的话临到；“我的话”简明传达ῥήμασιν μου。
- source_word: καὶ
  choice: 就
  rationale: 在汉语中自然连接命令与随后的结果，同时不额外加强原文逻辑。
- source_word: ὠφεληθήσεσθε
  choice: 必得益处
  rationale: 表达将来时所指的有益结果；“得益处”庄重自然，避免“获利”可能带来的商业意味。
