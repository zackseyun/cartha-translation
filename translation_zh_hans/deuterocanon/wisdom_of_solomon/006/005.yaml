  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/005.yaml
  text: He will come upon you terribly and swiftly[a], because severe judgment comes upon those in high places.
translation:
  language: zh_hans
  text: 他必以令人畏惧的方式迅速临到你们[a]，因为对身居高位的人，审判是严厉的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必令人畏惧地迅速来到你们面前，因为对居高位者，审判来得突然。”
    reason: 保留φρικτῶς可表达“令人畏惧”、ἐπιστήσεται可表达“来到……面前”，以及ἀπότομος可表达“突然”的词义可能；避免把动词限定为言语性的“当面对质”。
lexical_decisions:
- source_word: φρικτῶς
  choice: 以可怕的方式
  rationale: 该副词表示令人战栗、恐惧的方式；此译保留其强烈语气，同时避免把它误解为行动者自己感到害怕。
- source_word: ταχέως
  choice: 迅速
  rationale: 直接表达行动来得快，符合警告性的庄重语气。
- source_word: ἐπιστήσεται
  choice: 必……临到
  rationale: ἐφίστημι 的将来时中间形式可指来到、突然出现在面前或逼近；“临到”保留迫近之意，不把敌对行动过度具体化。
- source_word: κρίσις
  choice: 审判
  rationale: 上下文针对掌权者，所指是司法性的裁断，而非抽象的正义。
- source_word: ἀπότομος
  choice: 严厉的
  rationale: 该词可表示严厉、尖锐或突然而至；前文 ταχέως 已明确速度，因此正文采用“严厉的”以突出审判的严峻性，同时在脚注保留“突如其来”的可能。
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: 身居高位的人
  rationale: 分词短语指地位、权势高于他人的人；此译自然传达其社会和政治身份，并保留“居高位”的意象。
- source_word: γίνεται
  choice: 必临到
  rationale: 动词表示发生、成为现实；结合审判语境，译为“临到”可自然表达审判落在这些人身上。
theological_decisions:
- issue: 警告所指行动的性质
  choice: 把本句译为上帝以可怕而迅速的方式临到掌权者，并使严厉的审判临到他们。
  alternative: 也可理解为对居高位者所作的一般性宣告：严酷或突然的审判会发生在他们中间。
  rationale: 本节第二人称复数承接上下文对统治者的直接劝诫，因此正文保留直接警告；同时不把“临到”进一步解释为攻击、惩罚或显现，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以可怕的方式”准确表达令人恐惧的方式，“身居高位的人”清楚指向有权势者。正文保持简洁的警告节奏，脚注保留原文中“严厉/突然”以及“临到/面对”的歧义。
