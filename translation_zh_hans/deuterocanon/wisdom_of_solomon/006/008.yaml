  text: But for the mighty, a stern inquiry is coming.
translation:
  language: zh_hans
  text: 但有权势的人，必受到严厉的审查。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ κραταιοῖς
  choice: 但有权势的人
  rationale: κραταιός在本段语境中指身居强势和统治地位的人；“有权势的人”比单纯的“强者”更自然，也承接本章对君王和掌权者的训诫。δέ译为“但”，保留转折。
- source_word: ἰσχυρὰ
  choice: 严厉的
  rationale: 该形容词修饰“审查”，表达强有力、严格而不容宽贷的性质；“严厉的”符合现代汉语搭配，并保留审判语境的力度。
- source_word: ἐφίσταται
  choice: 必受到
  rationale: 原词可表达临到、逼近或加在其上。结合间接受词和“审查”，汉语用“受到”较自然；“必”传达陈述中迫近且确定的意味，但不额外规定具体时间。
- source_word: ἔραυνα
  choice: 审查
  rationale: ἔρευνα/ἔραυνα指查究、察验；此处是对掌权者的司法性追究。“审查”既保留查验含义，也不把原文进一步限定为刑罚本身。
theological_decisions:
- issue: 审查的施行者是否明说为上帝
  choice: 不在正文补出施行者
  alternative: 译作“上帝必严厉审问他们”
  rationale: 本节希腊文没有明说施行者；虽然上下文可指向上帝的审判，正文仍保留原文的省略，避免消除其表达张力。
- issue: ἐφίσταται的时间与临近感
  choice: 译作“必受到”
  alternative: 译作“严厉的审查即将临到”
  rationale: “必受到”突出确定性且汉语自然；不以“即将”过度锁定时间，同时保留未来审判的指向。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；句式简洁，适合智慧文学中的警告语气。无脚注标记。
