base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/012.yaml
  text: Wisdom is radiant and unfading[a], and is readily seen by those who love her;
translation:
  language: zh_hans
  text: 智慧光辉灿烂，永不衰残；爱她的人很容易看见她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见”也可译作“察觉”或“观见”；希腊语动词既可指视觉上的看见，也可指认知上的领会。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαμπρὰ
  choice: 光辉灿烂
  rationale: 表达可见的明亮与荣美，又不额外加入专门的神学含义，并与智慧的人格化形象相称。
- source_word: ἀμάραντός
  choice: 永不衰残
  rationale: 保留“不凋谢、不失去鲜美”的具体意象，比抽象的“不朽”更贴近原词。
- source_word: ἡ σοφία
  choice: 智慧
  rationale: 直译名词；汉语没有语法性别，后文以“她”明确保留本段把智慧人格化为女性形象的文学表达。
- source_word: εὐχερῶς
  choice: 很容易
  rationale: 自然、清楚地表达毫不困难、易于发生之意。
- source_word: θεωρεῖται
  choice: 看见
  rationale: 保留与“光辉灿烂”呼应的视觉意象；该词也可含观察、察觉或领会之意，因此以脚注说明其语义幅度。
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: 爱她的人
  rationale: 直接传达现在分词结构，并用女性代词保留智慧的人格化呈现。
theological_decisions:
- issue: 智慧（σοφία）的人格化
  choice: 用“她”指称智慧，保留女性人格化形象。
  alternative: 将智慧完全按抽象性质处理，不使用人格代词。
  rationale: 希腊文使用阴性形式，且上下文持续把智慧描写为女性人物；译文保留这一文学—神学张力，但不进一步断定她的身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光辉灿烂，永不衰残”保留诗性和平衡感；分号呈现两个并列陈述。脚注标记置于相关动词之后。
