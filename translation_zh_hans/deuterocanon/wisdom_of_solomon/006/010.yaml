base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: zh_hans
  text: 因为，凡以圣洁持守圣洁之事的，必成为圣洁[a]；凡受教于这些事的，必找到答辩的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为圣洁”也可译作“被使成圣”或“显为圣洁”。希腊文在“以圣洁”“圣洁之事”和“成为圣洁”中刻意重复同源词。
    reason: lexical_alternative
  - marker: b
    text: “答辩的话”也可译作“答复”或“辩护”。原词可指人在受审查或遭指控时所作的答辩。
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: 持守
  rationale: 既可表达谨慎遵守，也保留守护、看守的意味；在道德与宗教语境中自然庄重。
- source_word: ὁσίως
  choice: 以圣洁
  rationale: 与本句其他同源的圣洁词语形成清楚呼应，同时避免生硬的“圣洁地”。
- source_word: τὰ ὅσια
  choice: 圣物
  rationale: 直译为与神圣有关的事物；该中性复数也可能泛指神圣之事或圣洁规条，因此加注说明其范围。
- source_word: ὁσιωθήσονται
  choice: 必成为圣洁
  rationale: 保留将来被动形式以及与ὁσίως、τὰ ὅσια之间刻意的同源词复现；不以教会化较强的专门术语缩窄含义。
- source_word: διδαχθέντες
  choice: 受过这些教导的人
  rationale: 保留被动含义，表明这些人接受了有关前述神圣之事的教导。
- source_word: αὐτά
  choice: 这些
  rationale: 自然回指前述圣物或神圣之事，同时避免中文“受过它们教导”的不自然表达。
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: 必找到申辩的依据
  rationale: ἀπολογία可指面对审查或指控时的答辩、申辩；加入“依据”使“找到申辩”在现代汉语中通顺，又不预断其必获宣告无罪。
theological_decisions:
- issue: ὁσίως / τὰ ὅσια / ὁσιωθήσονται的圣洁同源词群
  choice: 用“以圣洁／圣物／成为圣洁”尽量重现同源呼应
  alternative: “虔诚地遵守神圣之事／必被分别为圣”
  rationale: 希腊文刻意密集使用同源词，构成由圣洁行事到成为圣洁的修辞与神学张力；译文不将其化约为一般虔敬。
- issue: ὁσιωθήσονται的被动含义
  choice: 必成为圣洁
  alternative: 必显为圣洁；必被分别为圣
  rationale: 希腊文形式为将来被动，但可涉及成为圣洁、被使成圣或被认定为圣洁。正文采用宽而自然的表达，脚注保留其他可能。
- issue: ἀπολογία的法庭性语义
  choice: 申辩的依据
  alternative: 答复；辩护；获得申明为正当的理由
  rationale: 保留面对审查或指控时答辩的意味，同时避免把该词直接译成带有后期教义负载的“称义”。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“以圣洁持守圣物”略带修辞密度，以保留原文同源词群；分号呈现两个并列的未来结果。所有脚注标记均置于正文对应语句之后。
