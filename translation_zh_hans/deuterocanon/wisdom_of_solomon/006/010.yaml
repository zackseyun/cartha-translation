  to: 因为，凡以圣洁持守圣洁之事的，必成为圣洁[a]；凡受教于这些事的，必找到答辩的话[b]。
  rationale: 修订澄清“受教”的对象是前述圣洁之事，而非“这些教导”；同时删除“依据”所添加的证据意味。以“圣洁之事”替代可能过度具体的“圣物”，并在正文和注释中维持希腊文圣洁同源词群及ἀπολογία的法庭性余地。
