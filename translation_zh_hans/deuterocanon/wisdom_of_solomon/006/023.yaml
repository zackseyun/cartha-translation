  text: Nor indeed will I accompany wasting envy[a], because it will have no share in wisdom.
translation:
  language: zh_hans
  text: 我也绝不与那日渐消损的嫉妒同行[a]，因为这样的人与智慧无分。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日渐消损的嫉妒”直译可作“正在消融／耗损的嫉妒”。原文的分词也可能带出嫉妒者因嫉妒而逐渐憔悴的意象；并未明确说嫉妒使别人消瘦。
    reason: lexical_alternative
  - marker: b
    text: 原文的阳性指示词较自然地指受嫉妒支配的人，即“这样的人”；也可能回指被人格化的“嫉妒”，即“因为它与智慧无分”。
    reason: referent_ambiguity
lexical_decisions:
- source_word: οὔτε μὴν
  choice: 我也绝不
  rationale: 承接上文的否定，并带有加强语气；“也绝不”在现代汉语中自然地表达“而且确实不”。
- source_word: φθόνῳ
  choice: 嫉妒
  rationale: 此词通常指因他人所得之善而产生的嫉妒或恶意；“嫉妒”是智慧文学语境中准确而通行的道德用语。
- source_word: τετηκότι
  choice: 令人消瘦的
  rationale: τήκω的完成时分词有“融化、消瘦、耗损”之意。这里保留嫉妒具有消磨作用的形象，同时用普通读者易懂的现代汉语表达；其语态和所指仍有一定歧义，故加脚注。
- source_word: συνοδεύσω
  choice: 同行
  rationale: 原词指一同上路或陪伴；“同行”既保留行路隐喻，也自然表达拒绝与嫉妒为伍。
- source_word: οὗτος
  choice: 它
  rationale: 阳性指示代词在语法上可回指阳性名词φθόνος，并将嫉妒人格化；也可能意指受嫉妒支配的人。正文用“它”保留与前一名词的直接衔接，另一理解列入脚注。
- source_word: οὐ κοινωνήσει
  choice: 与……无分
  rationale: κοινωνέω表示参与、分享或有分；“与智慧无分”简洁庄重，清楚表达被排除在智慧之外。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: 这是《智慧篇》的核心词汇，译作“智慧”准确且保持全书术语一致。
theological_decisions:
- issue: οὗτος的所指
  choice: 正文将其理解为人格化的“嫉妒”
  alternative: 也可理解为“嫉妒的人”，即这种人与智慧无分
  rationale: οὗτος为阳性，与阳性名词φθόνος在语法上相合，因此可直接回指“嫉妒”；但人格化表达也容易转指受嫉妒支配的人。原文并未彻底排除任何一种理解，故正文保留人格化，脚注明示另一可能。
- issue: τετηκότι所表达的耗损关系
  choice: 译为嫉妒“令人消瘦”，强调其消磨作用
  alternative: 可译为“使自己消瘦的”或“日渐消损的嫉妒”，强调嫉妒者自身因嫉妒而憔悴
  rationale: 分词字面涉及融化、消瘦或耗损，但在此可描述嫉妒的腐蚀作用，也可描述嫉妒者被其折磨。正文采用自然且形象的汉语，脚注保留原文的双向张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“同行”保留原文的陪伴与同行隐喻，“与智慧无分”保持智慧文学的凝练语气。两个脚注分别保存分词意象及指示代词所指的真实歧义。
