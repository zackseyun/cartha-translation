base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/003.yaml
  text: For authority was given to you by the Lord[a], and sovereignty by the Most High, who will examine your works and investigate your plans[b];
translation:
  language: zh_hans
  text: 因为你们的权柄是主赐予的，统治权来自至高者；他必审查你们的行为，查究你们的谋算[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋算”也可译作“谋议”“计划”或“意图”；原词既可涉及统治者的商议和筹划，也可涉及其内在意向。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτησις
  choice: 权柄
  rationale: 此处指执政者所持有并行使的治理权力。“权柄”既体现政治权威，也与后面的“统治权”有所区别。
- source_word: δυναστεία
  choice: 统治权
  rationale: 此词在这里指统治、支配的权力，并非世袭王朝。“统治权”自然清楚，也保留它与 κράτησις 的平行关系。
- source_word: παρὰ τοῦ κυρίου
  choice: 主赐予的
  rationale: παρά 加属格表示来源；结合 ἐδόθη（被赐予），译作“主赐予的”符合现代汉语，也明确权柄来自主。
- source_word: παρὰ Ὑψίστου
  choice: 来自至高者
  rationale: 保留 παρά 所表达的来源，并将 Ὕψιστος 作为神的称号译为“至高者”。
- source_word: ἐξετάσει
  choice: 必审查
  rationale: 此将来时动词表示仔细检验；“必审查”既清楚，又保留审判语境中的确定性。
- source_word: διεραυνήσει
  choice: 查究
  rationale: 该复合动词含深入搜索、彻底查明之意；“查究”比前面的“审查”更强调追查到底。
- source_word: βουλάς
  choice: 谋算
  rationale: 此词可指谋划、商议或内心意图。“谋算”能涵盖执政者的筹划与内在意向，并与外在“行为”形成对照。
theological_decisions:
- issue: κύριος 与 Ὕψιστος 平行用作神的称号
  choice: 分别译为“主”和“至高者”
  alternative: “上主”和“至高者”；或“主宰”和“至高者”
  rationale: 原文以两个平行称号指向赐予世间统治权、并审察统治者的神。译文保留两个不同称号，不将其合并，也不额外引入特定宗派用语。
- issue: 世俗权力的来源及问责
  choice: 明确表达权柄由主赐予、统治权来自至高者，并保留神将审查的宣告
  alternative: 将 παρά 弱化为一般关联，或把审查理解为仅针对外在行为
  rationale: 原文同时强调统治权的神圣来源与统治者对神的责任，并把外在行为和内在谋算都置于审察之下。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“权柄／统治权”呈现两个近义政治权力词的平行和细微区别；以“审查／查究”反映后一个希腊动词更强的深入追查意味。
