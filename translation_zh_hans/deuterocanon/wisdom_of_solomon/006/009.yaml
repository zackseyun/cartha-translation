base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/009.yaml
  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
translation:
  language: zh_hans
  text: 所以，暴君们[a]啊，我的话是对你们说的，使你们学习智慧，不致失足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴君们”或译“统治者们”。希腊词可泛指拥有主权的统治者，但在这里带有尖锐的负面意味。
    reason: lexical_alternative
  - marker: b
    text: “失足”或译“跌倒”或“走入歧途”。希腊词可泛指失败、偏离或走错道路。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: 对你们说的
  rationale: 与“我这些话”连用，补出希腊文所省略的陈述成分，清楚表达这些话以他们为对象，同时保留原文的指向性。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文对掌权者的警告，表达推论关系；“所以”自然、庄重，又符合现代汉语。
- source_word: ὦ τύραννοι
  choice: 暴君们啊
  rationale: τύραννοι可指拥有主权的统治者，但在此警告语境中带有明显的贬斥意味；“暴君”保留了这一尖锐语气。
- source_word: οἱ λόγοι μου
  choice: 我这些话
  rationale: 保留λόγοι的复数含义，并使中文表达自然。
- source_word: ἵνα μάθητε
  choice: 为要使你们学得
  rationale: 明确表达ἵνα加虚拟式所具有的目的意义。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是本书核心的伦理和神学用语，“智慧”是准确且通行的译法。
- source_word: μὴ παραπέσητε
  choice: 不致失足
  rationale: παραπίπτω可表示跌倒、失败或走入歧途；“失足”在中文中既可保留跌落意象，也可表达道德上的偏离，而不把含义限定为背教。
theological_decisions:
- issue: 对政治掌权者称呼中τύραννοι的语气
  choice: 译作“暴君们”，保留原文在警告语境中的负面评价。
  alternative: 译作“统治者们”或“专制者们”。
  rationale: “统治者”过于中性，容易削弱原文的尖锐语气；“专制者”虽可表达负面意义，却不如“暴君”简洁有力。
- issue: μὴ παραπέσητε所指失败的性质
  choice: 译作“不致失足”，保留道德失败、走错道路等多重可能。
  alternative: 译作“不致跌倒”“不致误入歧途”或“不致背离”。
  rationale: 原词语义较宽，本文不明确限定为身体跌倒、一般迷失或宗教背离，因此避免采用会过早消除歧义的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“暴君们啊”保留直接呼告的修辞力度；“为要”维持经文的庄重感，但整句仍符合当代汉语习惯。
