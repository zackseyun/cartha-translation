base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/014.yaml
  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
translation:
  language: zh_hans
  text: 为寻求她而早起的人不会劳累[a]，因为他会发现她就坐在自己的门旁。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为她早起的人。”希腊语动词的本义是早起，也可引申为一早就热切寻求。
    reason: lexical_alternative
  - marker: b
    text: 这里把智慧描绘成人，坐在寻求者的门旁，显出她近在眼前。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας ἐπ' αὐτὴν
  choice: 为寻求她而早起的人
  rationale: ὀρθρίζω的基本意思是“早起、清早行动”，ἐπ’ αὐτήν表示行动所朝向的对象。译文保留“早起”的具体形象，并以“寻求”自然表达其目的；“她”保留智慧的女性拟人形象。
- source_word: οὐ κοπιάσει
  choice: 不会劳累
  rationale: κοπιάω可指辛劳，也可指因辛劳而疲乏；“不会劳累”在此兼顾付出劳苦与感到疲倦的含义。
- source_word: πάρεδρον
  choice: 就坐在……旁
  rationale: πάρεδρος表示坐在旁边或陪侍在侧。“就坐在”具体呈现拟人化的智慧已经近在身旁，也呼应寻找者无需劳累。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ引出前句“不会劳累”的原因；“因为”清楚保留解释关系。
- source_word: τῶν πυλῶν αὐτοῦ
  choice: 自己的门旁
  rationale: πύλη指门或门口，原文复数具有庄重的入口意象；现代汉语以“门旁”表达较自然。“自己”明确这是寻求者的门，而不是智慧的门。
theological_decisions:
- issue: 智慧的女性拟人和寻求者的阳性单数表达
  choice: 以“她”指拟人化的智慧，以“……的人”和“自己”指泛称的寻求者
  alternative: 把智慧译为不带性别的“它”，或明确使用“他”指寻求者
  rationale: 希腊文以阴性代词指智慧，故保留“她”；阳性分词在此具有泛称作用，汉语用“……的人”可自然表达普遍对象，而“自己”既保持单数关系，又避免不必要地把泛称者限定为男性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“就”传达智慧已经近在门旁的意味，但不把“等候”等原文未明说的动作写入正文。
