  text: She hastens to make herself known to those who desire her[a].
translation:
  language: zh_hans
  text: 她抢先向渴慕她的人显明自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的不定式在形式上是被动，带有“预先被认识”或“先被认识”的字面意味；但全句结构十分凝练。结合上下文，正文按较通顺的意思译出：智慧主动先向渴慕她的人显明自己。
    reason: 保留 προγνωσθῆναι 的被动形式、前置意味及压缩句法所造成的歧义，避免把形式被动固定改作主动。
lexical_decisions:
- source_word: φθάνει
  choice: 抢先
  rationale: 该动词可表示“先到、抢在前面、预先”。这里强调智慧主动迎向渴慕她的人；“抢先”自然地保留了这种先行主动性。
- source_word: τοὺς ἐπιθυμοῦντας
  choice: 渴慕她的人
  rationale: ἐπιθυμέω 表示强烈的愿望或向往。宾语“她”由上下文中人格化的“智慧”补出；“渴慕”既传达力度，也符合庄重的经文语体。
- source_word: προγνωσθῆναι
  choice: 显明自己
  rationale: 该不定式形式上是被动，可直译为“预先被认识”。结合 φθάνει，句意很可能是智慧先采取行动，让渴慕她的人认识她；“显明自己”在现代汉语中清楚自然，但其形式上的歧义另以脚注保留。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 用“她”和“自己”保留人格化表达
  alternative: 将智慧作为抽象事物，用“它”指称
  rationale: 希腊语上下文把智慧描写为女性形象。中文采用“她”可保留这种文学与神学呈现，不把人格化削平为抽象概念。
- issue: προγνωσθῆναι 的被动形式及“预先”含义
  choice: 正文译为“显明自己”，并用“抢先”体现智慧的先行主动
  alternative: 形式化译作“抢先被那些渴望预先被认识的人认识”或“先被认识”
  rationale: 希腊文极为压缩，形式化直译在汉语中难以确定“预先认识”的主客关系。正文表达上下文中较可能的意思，同时在脚注中公开保留原文结构与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“抢先”承载 φθάνει 的先行意味，“渴慕”体现强烈愿望；以女性代词保留智慧的人格化。脚注标记已在正文中呈现。
