  text: Therefore desire my words[a]; long for them[b], and you will be instructed.
translation:
  language: zh_hans
  text: 所以，你们要渴慕我的话语，并切切地向往它们[a]，你们就会受教[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “切切地向往”所译的希腊词比前面的“渴慕”语气更强，表达更深切的思念和向往。
    reason: lexical_alternative
  - marker: b
    text: 或译“受到训练”或“受到管教”；原词既可指教导，也可包括塑造人的训练和管教。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμήσατε
  choice: 渴慕
  rationale: 该词为不定过去时命令式，在正面的劝勉语境中表示热切愿望；“渴慕”自然庄重，也不带“贪恋”的负面色彩。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文作出推论；“所以”在现代汉语中清楚保留其逻辑作用。
- source_word: τῶν λόγων μου
  choice: 我的话语
  rationale: λόγοι在此指说话者所说的话或教诲；“话语”较直接，不把含义过早限定为“教导”。
- source_word: ποθήσατε
  choice: 切切向往
  rationale: ποθέω比前面的ἐπιθυμέω情感更强，表达深切的向往；“切切”保留递进力度。希腊文省略宾语，中文也不补明具体代词，以保留原文结构。
- source_word: καὶ
  choice: 就
  rationale: 此处连接命令与将来的结果；汉语用“就”自然表达随之而来的结果，同时不强化为明确的目的关系。
- source_word: παιδευθήσεσθε
  choice: 必受到教导
  rationale: 这是παιδεύω的将来时被动语态；在智慧教诲的语境中首先指受教，同时也可能含有训练和管教所带来的塑造。“受到”保留被动意义，“必”体现将来陈述的确定语气。
theological_decisions:
- issue: παιδεύω在智慧文学语境中的语义范围
  choice: 正文突出“受到教导”
  alternative: 受到训练；受到管教
  rationale: 紧邻语境劝人渴慕说话者的话，因此教育、受教之义居前；但原词也可涵盖塑造性的训练或管教，故以脚注保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“渴慕……切切向往”保留两个命令之间的力度递进；“就必受到教导”自然呈现命令之后的结果，并保留被动语态。
