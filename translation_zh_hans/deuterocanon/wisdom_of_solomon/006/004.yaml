base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/004.yaml
  text: because[a], though you were ministers of his kingdom, you did not judge rightly, nor keep the law[c][b], nor walk according to the counsel of God.
translation:
  language: zh_hans
  text: 因为你们既是他国度的臣仆[a]，却没有正确地施行审判[b]，没有遵守律法，也没有按照上帝的旨意[c]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臣仆”也可译作“仆役”或“官员”。希腊语ὑπηρέται指在更高权威之下服事的下属；这里很可能是把世上的统治者视为在上帝王权之下任职的人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“秉公审判”或“正确地判断”。希腊语ὀρθῶς指正确、合宜地。
    reason: lexical_alternative
  - marker: c
    text: “旨意”也可译作“计划”或“定意”。希腊语βουλή侧重经过谋定的意向或计划。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  choice: 臣仆
  rationale: 该词指在更高权威之下服事的人；上下文针对君王和执政者。“臣仆”兼顾其官职身份与从属于上帝王权的含义。
- source_word: βασιλείας
  choice: 国度
  rationale: βασιλεία可指王权、统治或国度；“国度”在此自然地表达他们在上帝王权之下任职，同时不排除“统治”的含义。
- source_word: ἐκρίνατε ὀρθῶς
  choice: 秉公审判
  rationale: 在司法语境中，ὀρθῶς修饰审判，表示合宜、正直地作出判断；“秉公审判”符合现代汉语表达，也保留其道德和司法意味。
- source_word: ἐφυλάξατε νόμον
  choice: 遵守律法
  rationale: φυλάσσω与νόμος连用，意为持守、遵行律法；“遵守律法”比直译为“守护律法”更自然，并保留其规范性的含义。
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  choice: 遵照上帝的旨意
  rationale: βουλή可指谋划、决意或计划；“旨意”在汉语中可自然表达上帝所定的意向，但以脚注保留其他可能。
- source_word: ἐπορεύθητε
  choice: 行事
  rationale: πορεύομαι本义为行走，在这里比喻人的行为方式；“行事”准确传达伦理性的生活实践，避免生硬的“行走”。
theological_decisions:
- issue: 世上掌权者与上帝王权的关系
  choice: 把受话者称为上帝国度之下的“臣仆”，表明他们的权柄具有从属性。
  alternative: 也可将此泛指一切在上帝之下行使权柄的人。
  rationale: 紧邻语境所针对的是君王和审判者，而ὑπηρέται与τῆς αὐτοῦ βασιλείας的组合强调他们在上帝统治之下服事；译文保留这一点，不进一步引入特定的政教理论。
- issue: βουλή所表达的神圣意向
  choice: 译为“上帝的旨意”，并在脚注保留“计划”或“决意”。
  alternative: 上帝的计划；上帝的决意。
  rationale: 该词包含经过谋定的意向或计划，不只是一般愿望；正文采用自然的汉语表达，脚注则保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“身为……却……”自然呈现希腊语分词在语境中的让步意味；三个“没有”保持原文连续否定的力度，末句以“行事”传达伦理性的行走隐喻。
