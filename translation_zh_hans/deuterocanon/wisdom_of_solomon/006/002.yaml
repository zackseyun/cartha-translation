  text: Listen[a], you who rule over multitudes and boast over crowds of nations.
translation:
  language: zh_hans
  text: 你们这些统治众民、因万国的人群而自夸的，要侧耳听！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们这些掌管众人的、因列国的群众而洋洋自得的，要留心听。”
    reason: 保留κρατέω可作“掌管”、γαυρόω可表达“洋洋自得”，以及πλῆθος和ὄχλοι的集合性措辞。
lexical_decisions:
- source_word: ἐνωτίσασθε
  choice: 要侧耳听
  rationale: 这是不定过去时中间语态命令式，意为留心倾听。“侧耳听”既保留原文的听觉意象和郑重召唤，也符合现代汉语的庄重语体。
- source_word: οἱ κρατοῦντες πλήθους
  choice: 你们这些统治众民
  rationale: κρατέω在这里指掌权、统治；πλῆθος虽为单数，却是集合名词。“统治众民”自然表达对广大民众行使权力，且不额外赋予压迫含义。
- source_word: γεγαυρωμένοι
  choice: 自夸
  rationale: 该完成时分词表示因自身地位或所有而骄傲、夸耀；“自夸”保留责备语气，同时避免把它弱化为中性的“自豪”。
- source_word: ἐπὶ ὄχλοις ἐθνῶν
  choice: 因万国的人群而
  rationale: ἐπί与此分词连用可表示夸耀的依据；ὄχλοις ἐθνῶν指由各国之民构成的广大人群。“因……而”明确其因由关系，又不将ἐπί强行处理为空间性的“在……之上”。
