  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/017.yaml
  text: For the truest beginning of her is the desire for instruction,[a]
translation:
  language: zh_hans
  text: 因为，智慧最确实的开端，是渴慕受教。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为，智慧最真实的开端，是对教诲的渴慕。”希腊语παιδεία可指教诲、训练或管教。
    reason: 说明ἀληθεστάτη与παιδεία的可译范围，并提供较形式对应的表达。
lexical_decisions:
- source_word: ἀρχὴ
  choice: 开端
  rationale: 表示起始点或开头；“开端”保留了追求智慧之初始阶段的比喻。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”在现代汉语中自然地表达解释关系。
- source_word: αὐτῆς
  choice: 得到智慧
  rationale: 该阴性代词回指拟人化的“智慧”。汉语不以代词标示语法性别，直译“她的开端”容易含混，因此明确所指，同时保留获得智慧这一语境关系。
- source_word: ἡ ἀληθεστάτη
  choice: 最真切的
  rationale: 保留ἀληθής最高级所表达的“最真实、最确实”之意；“最真切”在箴言式语句中较自然，也不把意义限定为逻辑真伪。
- source_word: παιδείας
  choice: 受教
  rationale: 涵盖接受教导、培育和管教的过程，比“教育”少制度色彩，也比单用“管教”更宽。
- source_word: ἐπιθυμία
  choice: 渴望
  rationale: 表达强烈的愿望，同时符合智慧文学劝勉性的语气。
theological_decisions:
- issue: 智慧的阴性拟人化及代词所指
  choice: 用“得到智慧”明确αὐτῆς的所指
  alternative: 译作“她的”以直接保留阴性代词
  rationale: 希腊文以阴性代词回指拟人化的智慧，但现代汉语的“她”会比原文更强烈地暗示具体女性身份。明确译出“智慧”，既保留所指，也避免增添本体论解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“渴望受教”简洁保留智慧文学的劝勉语气；正文显明代词所指，脚注补充较形式对应的译法与词义范围。
