base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: zh_hans
  text: 所以，你们这些以宝座和权杖为乐的万民统治者[a]，要尊崇智慧，好使你们永远作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统治者”或译“暴君”。希腊语这个词可以泛指统治者，但在某些语境中也带有较强的贬义。
    reason: 保留τύραννοι在中性“统治者”与负面“暴君”之间的词义张力。
lexical_decisions:
- source_word: ἥδεσθε
  choice: 以……为乐
  rationale: 表达因某事而喜悦、乐在其中，既贴近原义，也保留劝诫文体的庄重语气。
- source_word: θρόνοις
  choice: 宝座
  rationale: 直接保留政治统治与王权的核心意象。
- source_word: σκήπτροις
  choice: 权杖
  rationale: 指象征君王权柄的杖，与“宝座”并列自然，也保留原文的王权意象。
- source_word: τύραννοι λαῶν
  choice: 众民统治者
  rationale: τύραννοι在此可泛指掌权者，不必然含现代“暴君”的强烈贬义；λαῶν为复数，译作“众民”以保留其复数范围。
- source_word: τιμήσατε
  choice: 尊崇
  rationale: 既表达给予尊荣，也体现高度重视；用于“智慧”时庄重而自然。
- source_word: σοφίαν
  choice: 智慧
  rationale: 采用标准译法，并保留本书中智慧兼具实践意义和人格化色彩的开放性。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该持续时间习语在现代汉语中的自然表达。
- source_word: βασιλεύσητε
  choice: 作王
  rationale: 明确保留动词的君王统治含义，并与前文“宝座”和“权杖”的意象呼应。
theological_decisions:
- issue: 称呼政治领袖时τύραννοι的语气
  choice: 正文采用较中性的“统治者”
  alternative: 暴君；专制君主；君王
  rationale: 该词在希腊化时期可中性地指统治者，语境是在劝勉掌权者，而非明确谴责压迫。若直译为现代汉语的“暴君”，会过早限定其道德评价；脚注则保留其可能带有的负面意味。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“以宝座和权杖为乐”保留原文政治意象；“好使你们永远作王”保留目的从句及王权语义。脚注标记置于其实际说明的“众民统治者”之后。
