  text: Therefore listen[a], O kings, and understand; learn[b], O judges of the ends of the earth.
translation:
  language: zh_hans
  text: 因此，诸王啊，要听[a]，要明白；大地四极的审判者啊，要学习[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听”也可译作“听见”；这里的希腊语命令式带有留心听取的意思。
    reason: lexical_alternative
  - marker: b
    text: “大地四极的审判者”指在大地极远各处施行审判的人，强调这番警告面向天下的掌权审判者。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσατε
  choice: 要听
  rationale: 复数命令式要求受话者留心听从；“要听”既保留听觉意象，也自然表达劝诫语气。
- source_word: οὖν
  choice: 所以
  rationale: 表示承接上文所得的推论；“所以”在现代汉语中自然清楚。
- source_word: βασιλεῖς
  choice: 诸王
  rationale: 原词特指多位君王；“诸王”简洁、庄重，并保留直接呼告。
- source_word: σύνετε
  choice: 要明白
  rationale: 保留 συνίημι 的认知含义，不扩译为“要有智慧”。
- source_word: μάθετε
  choice: 要领受教诲
  rationale: μανθάνω 的基本义是学习；在此劝诫语境中，“领受教诲”较自然地表达主动学习和接受训导，同时脚注说明直译。
- source_word: δικασταί
  choice: 审判……的人
  rationale: 以汉语关系结构表达直接称呼，保留其施行审判的职能，而不泛化为一般统治者。
- source_word: περάτων γῆς
  choice: 大地四极
  rationale: 保留“地的尽头、极远之处”的空间意象，并以汉语圣经文体中自然而庄重的表达呈现其普世范围。
