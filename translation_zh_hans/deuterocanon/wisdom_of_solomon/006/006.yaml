  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/006.yaml
  text: For the least is deserving of mercy[b][a], but the mighty will be examined mightily.
translation:
  language: zh_hans
  text: 因为最卑微的人因怜悯而可获宽宥[a]，有权势的人却必受严厉的审查[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因怜悯而可获宽宥”也可译作“可因怜悯而得到宽待”。希腊文形容词含有可被谅解、宽宥或宽容相待的意思。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在“有权势的人”和表示“强有力地”的副词之间运用了同源词呼应；译作“严厉”表达其语意，但未能完全保留这项文字效果。
    reason: wordplay
lexical_decisions:
- source_word: ἐλάχιστος
  choice: 地位最低微的人
  rationale: 此最高级形容词带冠词并作名词用，与后文“有权势的人”相对，指地位或权力最低的人；这样译能在本段统治者受审的语境中明确其所指。
- source_word: συγγνωστός
  choice: 可……获宽恕
  rationale: 该词表示可被谅解、宽宥或以宽容相待。“可获宽恕”保留司法语境，也不把它扩大为无条件赦免。
- source_word: ἐλέους
  choice: 蒙怜悯而
  rationale: 原文属格结构简练，确切关系略有压缩；“蒙怜悯而”自然表达宽恕出于怜悯，同时避免添加更完整的教义解释。
- source_word: δυνατοὶ
  choice: 有权势的人
  rationale: 在向君王和统治者说话的上下文中，此词指拥有权力或权威的人；“有权势的人”比单纯的“强者”更贴合语境。
- source_word: δυνατῶς
  choice: 严厉
  rationale: 该副词与 δυνατοί 同源，原文有“有权势者受到强有力审查”的文字呼应。中文若直译为“有力地”不够自然，因此正文用“严厉”，并在脚注说明原文修辞。
- source_word: ἐτασθήσονται
  choice: 必受……审查
  rationale: 未来被动式表示将受到深入的查验或审察；“受审查”保留司法和问责意味，又不预先断定审查结果。
theological_decisions:
- issue: 如何表达低微者蒙宽待与掌权者受严格审查之间的原则
  choice: 保留怜悯、宽恕与严格审查的对比，不把审查直接译成定罪。
  alternative: 最卑微的人会因怜悯而获赦免，有权势的人却必受严厉审判。
  rationale: 希腊文强调身份与责任所带来的不同对待，却没有在本句中明说有权者必被定罪；译为“审查”可保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。前半句用“地位最低微的人”明确与掌权者的身份对比；后半句以自然中文传达严格问责，并由脚注交代希腊文同源词的修辞。
