  text: So then[a], desire for wisdom leads to kingship.
translation:
  language: zh_hans
  text: 因此，渴慕智慧引人获得王权。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”也可译作“王位”或“国度”。希腊语 βασιλεία 可指君王身份、统治权或国度；本句上下文较适合理解为王权或王者地位。
    reason: 保留 βασιλεία 的词义范围，并说明本句主译的语境依据。
lexical_decisions:
- source_word: ἐπιθυμία
  choice: 渴慕
  rationale: 此词表示强烈的愿望；“渴慕”既保留其力度，也避免“欲望”在现代汉语中可能产生的负面联想。
- source_word: ἄρα
  choice: 所以
  rationale: 标明本句是根据上文推导出的结论，现代汉语中自然清楚。
- source_word: σοφίας
  choice: 智慧
  rationale: “智慧”是 σοφία 的标准译法，也保留本书中实践、伦理及神学哲思方面的广度。
- source_word: ἀνάγει
  choice: 使人登上
  rationale: 原词有“引领上去、带到”的方向意味；结合王权语境，“使人登上”自然表达趋向并达到某种地位。
- source_word: ἐπὶ βασιλείαν
  choice: 登上王位
  rationale: 介词短语表示朝向王权或君王身份。中文“登上王位”在此比“进入国度”更符合上下文关于取得统治地位的论述，同时保留 βασιλεία 可指王权的意义。
theological_decisions:
- issue: 本智慧格言中 βασιλεία 的含义
  choice: 王位
  alternative: 王权；国度
  rationale: 上下文的推论链条涉及尊重智慧并由此取得统治地位，因此这里理解为君王身份或王权比领土意义的“国度”更贴切。这是语境中的词义判断，并不排除该希腊词本身具有其他含义。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“渴慕智慧”保留原文的强烈愿望；“使人登上王位”以自然汉语表达 ἀνάγει 的方向性和 βασιλεία 在本语境中的王权含义。
