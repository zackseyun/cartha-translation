  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/024.yaml
  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: zh_hans
  text: 众多的智者，是世界的拯救[a]；明智的君王，是民众的安定[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“保全”。
    reason: lexical_alternative
  - marker: b
    text: “民众”也可译作“人民”或“公民群体”；本句可直译为“明智的君王，是民众的稳定”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: πλῆθος σοφῶν
  choice: 智慧人众多
  rationale: 保留“众多”这一数量概念，并以现代汉语自然表达属格结构；“智慧人”兼顾庄重的格言语气与普通读者的可懂性。
- source_word: σωτηρία
  choice: 拯救
  rationale: 该词可指拯救、解救或保全；此处虽带有公共和政治语境，仍保留其较强的救助含义，不将其弱化为一般的“福祉”。
- source_word: κόσμου
  choice: 世界
  rationale: 按其广泛含义译为“世界”，不擅自限定为某个国家、社会或单纯的人类群体。
- source_word: βασιλεὺς
  choice: 君王
  rationale: 原词特指王；“君王”在现代中文中庄重而清楚，也符合智慧文学的语体。
- source_word: φρόνιμος
  choice: 明智的
  rationale: 表达实际判断力和审慎，与前句较宽泛的“智慧”有所区分，同时比“精明”更符合正面语境。
- source_word: εὐσταθία
  choice: 使……安定
  rationale: 该词表示稳定、稳固；将希腊文名词谓语转为中文使动表达，可自然传达君王对民众稳定所起的作用。
- source_word: δήμου
  choice: 民众
  rationale: δῆμος可指人民、民众或公民共同体；“民众”保留集体与政治意味，又不过度限定为现代民族国家。
theological_decisions:
- issue: σωτηρία在智慧与政治语境中的范围
  choice: 译为“拯救”
  alternative: 可译“解救”或“保全”
  rationale: 上下文指向共同体和世界所蒙的救助，但原词的力度超过一般的安康或福利；译文保留这种张力，不把它专门化为属灵救恩，也不把它弱化为纯粹的社会福祉。
- issue: εὐσταθία δήμου的句法关系
  choice: 译为“使民众安定”
  alternative: 直译为“是民众的稳定”
  rationale: 希腊文为省略系词的名词句；中文采用使动表达更自然，也保留明智君王构成民众稳定根基的意思，而不额外规定具体治理机制。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学格言语体。两分句保持平行；第一句保留“拯救”的强度，第二句适度调整为自然汉语的使动结构。所有脚注标记均置于其所说明的词句之后。
