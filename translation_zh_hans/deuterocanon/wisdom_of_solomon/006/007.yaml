base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: zh_hans
  text: 因为万有的主宰不徇情面[a]，也不因人的显赫而退让；因为卑微的和尊贵的，都是他亲自造的，他也同样眷顾所有人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处使用含“面孔”的惯用说法，意思是不看情面、不偏袒人。
    reason: lexical_alternative
  - marker: b
    text: “眷顾”也可译作“照管”或“为……筹划”；原文强调他以同样的关怀顾及所有人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστελεῖται πρόσωπον
  choice: 不徇情面
  rationale: 这是表示偏袒、看情面的惯用语；译作“不徇情面”自然凝练，并保留审判语境中的公正含义。
- source_word: ὁ πάντων δεσπότης
  choice: 万有的主宰
  rationale: δεσπότης强调绝对权柄，与通常译作“主”的κύριος有所区别；“主宰”既庄重，也能体现其权柄。
- source_word: ἐντραπήσεται μέγεθος
  choice: 不因人的尊贵而有所顾忌
  rationale: 这里不是指道德意义上的羞愧，而是指不会因对方的地位、权势或显赫而退让、畏惧；结合上下文，以“人的尊贵”点明社会身份层面的对比。
- source_word: μικρὸν καὶ μέγαν
  choice: 无论卑微的还是尊贵的
  rationale: 这一对词在语境中主要指社会地位低微与显贵的人；此译保留两极并举的修辞，同时避免现代汉语中“大小人物”的轻佻感。
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: 他也同样眷顾所有人
  rationale: προνοεῖ可表示关怀、照管或为之筹划；“眷顾”保留神对万人的关怀与治理意味，而“同样”对应ὁμοίως。
theological_decisions:
- issue: δεσπότης与κύριος的称号区别
  choice: 主宰
  alternative: 主；主人
  rationale: 采用“主宰”以表现δεσπότης所含的绝对权柄，并避免把不同的希腊称号完全合并为同一译词。
- issue: 神不偏待人的表述
  choice: 不徇情面
  alternative: 不偏待人；不看人的情面
  rationale: 此译准确传达希腊语惯用表达的含义，不把经文扩展为后来的系统教义公式。
- issue: “小与大”的所指
  choice: 卑微的与尊贵的
  alternative: 小的与大的；小人物与大人物
  rationale: 上下文针对掌权者与社会等级，故译出身份高低；同时保留这是对人的概括，而非身体大小或年龄差异。
- issue: 神对所有人的πρόνοια
  choice: 同样眷顾所有人
  alternative: 同样照管所有人；平等地为所有人预备
  rationale: “眷顾”保留关怀和治理的宽广语义，不将προνοεῖ过度限定为物质供应，也不额外引入特定的天意论体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万有的主宰”保留称号的权柄意味；以“卑微—尊贵”呈现社会地位的对照。句式保持因果推进，并避免使用过于古雅的“无所徇情”等表达。
