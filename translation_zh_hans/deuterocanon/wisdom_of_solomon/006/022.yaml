base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: zh_hans
  text: 至于智慧是什么，又是怎样产生的[a]，我要宣明；我不会向你们隐藏奥秘。相反，我要从它产生之初追寻到底，把有关它的知识显明出来；我绝不会略过真理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产生”也可译作“出现”或“形成”。原文表达智慧如何成为或出现，并未明确说“被创造”。
    reason: 保留起源用语的词义范围及其神学开放性。
  - marker: b
    text: “绝不会略过真理”也可译作“决不会忽略真理”。原文用加强否定，语气十分确定。
    reason: 说明παροδεύω的“略过、忽略”之意及οὐ μή所表达的强调。
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  choice: 至于智慧是什么
  rationale: 保留直接问句的内容，并以“至于”承接上文的转折语气；σοφία一贯译为“智慧”。
- source_word: πῶς ἐγένετο
  choice: 又是怎样产生的
  rationale: γίνομαι在此可指产生、出现或形成；“产生”保留起源含义，却不擅自译成“被创造”。
- source_word: ἀπαγγελῶ
  choice: 我要宣明
  rationale: 兼顾宣告、讲明之意，符合本段庄重而公开陈述的语体。
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: 我不会向你们隐藏奥秘
  rationale: “隐藏”准确表达ἀποκρύπτω；“奥秘”保留μυστήρια的宗教与启示意味，不弱化成普通秘密。
- source_word: ἀλλὰ ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: 相反，我要从它产生之初追寻到底
  rationale: ἐξιχνιάζω带有循踪探究之意；“追寻到底”自然呈现细察并追溯的力度，“产生之初”保留γενέσεως的起源意味。
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: 把有关它的知识显明出来
  rationale: θήσω εἰς τὸ ἐμφανές字面是置于显明之处；“显明出来”在现代汉语中自然，并保留公开揭示的意象。
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: 我绝不会绕过真理
  rationale: “绝不会”体现οὐ μή的强烈否定；“绕过”保留παροδεύω从旁经过、不予触及的空间隐喻。
theological_decisions:
- issue: πῶς ἐγένετο与γενέσεως是否暗示智慧是受造物
  choice: 采用“怎样产生”“产生之初”的起源语言，不说明智慧是“被创造”的
  alternative: 译作“怎样被创造”“受造之初”
  rationale: 希腊文本谈及智慧的产生或起源，却未在本句明确使用“创造”一词。译文保留这一张力，不让本节单独裁定智慧受造或永恒的神学问题。
- issue: αὐτῆς是否应人格化为女性代词
  choice: 译作中性的“它”
  alternative: 译作人格化的“她”
  rationale: 希腊语阴性代词与阴性名词σοφία在语法上自然一致，本句本身不足以要求汉语采用人格化的女性代词。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文由宣告、不隐藏、追溯、显明到不略过真理的递进结构；避免生硬直译“从起源的开端”，改作自然的“从它产生之初”。
