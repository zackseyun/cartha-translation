  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/018.yaml
  text: and concern for instruction is love[a], and love is the keeping of her laws, and attention to her laws is the assurance of incorruptibility[b],
translation:
  language: zh_hans
  text: 关心训诲，就是爱[a]；爱，就是遵守她的律法；留心她的律法，就是不朽不坏的确证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”（παιδεία）也可译作“管教”或“培育”，侧重塑造品格的教育。
    reason: lexical_alternative
  - marker: b
    text: “不朽不坏”（ἀφθαρσία）也可译作“不死”；希腊原词更直接指免于腐朽或败坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: 关心
  rationale: 表达用心关注、挂念之意，并保留本节抽象概念逐层推进的结构。
- source_word: παιδείας
  choice: 训诲
  rationale: παιδεία兼有教导、管教和塑造品格的教育之意；“训诲”较自然地涵盖其智慧文学中的道德塑造色彩。
- source_word: ἀγάπη
  choice: 爱
  rationale: 直接译为“爱”，并照原文重复，以保留定义式的连锁结构。
- source_word: τήρησις
  choice: 遵守
  rationale: 此处指守住、奉行律法；“遵守”在现代汉语中清楚自然。
- source_word: νόμων
  choice: 律法
  rationale: 忠实反映νόμος的法律—伦理含义，也符合智慧文学的庄重语域。
- source_word: αὐτῆς
  choice: 她的
  rationale: 保留上下文中智慧的女性人格化，不将其淡化为无人格的“它的”。
- source_word: προσοχή
  choice: 留心
  rationale: 表达专注、谨慎留意并认真对待，汉语简洁自然。
- source_word: βεβαίωσις
  choice: 保证
  rationale: 该词有使之稳固、确认之意；“保证”能表达稳固可靠的结果，但不扩张为绝对的神学承诺。
- source_word: ἀφθαρσίας
  choice: 不朽不坏
  rationale: 兼顾“不受败坏、朽坏”的字面意义与现代汉语可读性，并避免只译为“永生”而过早缩窄含义。
theological_decisions:
- issue: αὐτῆς所保留的智慧人格化
  choice: 译作“她的”，指向上下文中人格化的智慧。
  alternative: 译作“它的”，将所指理解为训诲或非人格化的智慧。
  rationale: 希腊语使用阴性代词，且上下文持续将智慧人格化；保留“她”更能反映原文的文学和神学张力。
- issue: ἀφθαρσία的含义
  choice: 正文译作“不朽不坏”。
  alternative: 可译作“不死”或“永生”。
  rationale: 原词首先表示免于腐朽、败坏；“不朽不坏”保留其较宽的语义范围，不把它直接等同于较窄的永生观念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以三个平行分句保留原文环环相扣的定义式推进，并保留“她”对智慧的女性人格化。
