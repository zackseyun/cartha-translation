base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: zh_hans
  text: 因为智慧亲自四处寻找配得她的人，在路上亲切地向他们显现，并在他们的每一个意念中与他们相遇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意念”也可译作“打算”或“意图”。希腊词既可泛指思想，也可指已经形成的目的。
    reason: 保留ἐπίνοια在思想与目的之间的词义幅度。
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: 配得她的人
  rationale: 保留ἄξιος的评价含义以及属格所表达的关系，不进一步断定这种“配得”如何形成。
- source_word: αὐτὴ περιέρχεται ζητοῦσα
  choice: 智慧亲自四处寻找
  rationale: αὐτή带强调意味；περιέρχεται与ζητοῦσα共同描写智慧主动周行、持续寻找。中文补明“智慧”，使拟人形象清楚自然。
- source_word: ἐν ταῖς τρίβοις
  choice: 在路上
  rationale: τρίβος指道路、小径或行走的路径；采用概括而具象的“路上”，不将其抽象化为人生方式。
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: 亲切地向他们显现
  rationale: φαντάζεται在此指显现、让人看见；εὐμενῶς表达善意、友好的态度。“亲切地”保留其积极恩善的色彩而不过度神学化。
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: 在他们的每一个意念中
  rationale: ἐπίνοια可指思想、意念、打算或意图。“意念”在现代中文中可涵盖思量和成形的意图，较能保留原词的语义幅度；“他们的”依据相邻的αὐτοῖς补出关系。
- source_word: ὑπαντᾷ αὐτοῖς
  choice: 与他们相遇
  rationale: ὑπαντάω可表示遇见或前来迎接。“与他们相遇”自然简洁，并与前文共同呈现智慧主动接近人的形象。
theological_decisions:
- issue: 智慧被拟人化为主动行动的女性形象
  choice: 用“她”指称智慧，并保留其寻找、显现和相遇等人格化行动
  alternative: 将智慧作为非人格的抽象概念，用“它”指称
  rationale: 希腊文以阴性代词和分词持续塑造智慧的女性拟人形象；中文保留“她”，忠实呈现该文学与神学张力，而不把智慧直接等同于某一特定教义身份。
- issue: “配得智慧”的含义
  choice: 直译为“配得她的人”
  alternative: 解释为“因道德功绩而有资格得着智慧的人”或弱化为“适合她的人”
  rationale: 原文有真实的评价意味，却没有说明这种配得来自功绩、品格、寻求还是其他因素，因此不在译文中替文本作教义性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧亲自”突出原文强调代词；“四处寻找”保留行动感；全句维持智慧的女性拟人形象。脚注标记置于实际存在词义歧义的“意念”所在分句之后。
