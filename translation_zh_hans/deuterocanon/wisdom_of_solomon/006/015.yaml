  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/015.yaml
  text: For thinking about her is the perfection of understanding, and the one who stays awake because of her will quickly be free from care.
translation:
  language: zh_hans
  text: 因为思量她，就是明智的圆满；因她而警醒不眠的人，很快就会免于忧虑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  choice: 思念她
  rationale: 表达主动把智慧放在心上、反复思想之意；保留阴性代词所承接的拟人化“智慧”。
- source_word: φρονήσεως τελειότης
  choice: 明达的完美境界
  rationale: φρόνησις在此指实际而明辨的理性与智慧；“完美境界”自然表达τελειότης所指的圆满、成熟状态。
- source_word: ὁ ἀγρυπνήσας δι' αὐτὴν
  choice: 为她警醒的人
  rationale: ἀγρυπνέω意为保持清醒、警醒；διά加宾格可表达“因她/为了她”，此处用“为她”保留动机与追求对象两层可能。
- source_word: ταχέως ἀμέριμνος ἔσται
  choice: 很快就会无忧无虑
  rationale: 直接保留时间副词ταχέως，并以“无忧无虑”表达ἀμέριμνος的免于挂虑、操心。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 以“她”指智慧
  alternative: 改为无性别的“智慧”或“它”
  rationale: 希腊文αὐτῆς、αὐτήν明确使用阴性代词，并承接上下文中人格化的智慧，译文应予保留。
- issue: διά所表达的关系
  choice: 译作“为她”
  alternative: “因她”
  rationale: διά加宾格可指缘故，也可指以某对象为动机；“为她警醒”在中文中既自然，又不把该关系限缩为单纯因果。
translation_notes:
  register: 采用庄重而通顺的现代普通话；句式保留原文两分句的因果与并列推进，不增添宗派性解释。
