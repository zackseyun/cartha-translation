  terminology: 保留以“她”指称上下文人格化的智慧。以“思量”对应思考，以“明智”对应φρόνησις，以“圆满”对应τελειότης；“因她而警醒不眠”同时保留因果关系与ἀγρυπνήσας的实际不眠含义。
