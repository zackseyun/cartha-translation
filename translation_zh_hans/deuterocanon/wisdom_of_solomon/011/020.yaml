base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: zh_hans
  text: 即使没有这些事，他们本可因一口气[a]而倒下，被公义[b]追赶，又被你大能的气息簸散；但你却按尺度、数目和重量安排万物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译作“风”或“灵”；希腊语πνεῦμα兼有这些含义。本节两处均为此词。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“刑罚”或“审判”；希腊语δίκη可指公义、审判或惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: 即使没有这些灾祸
  rationale: χωρίς加属格表示“没有、离开”；τούτων在上下文中指先前所述的惩罚手段，译为“这些灾祸”比直译“这些事”更清楚，同时不改变所指。
- source_word: ἐνὶ πνεύματι
  choice: 因一口气
  rationale: ἐνί意为“一”；πνεῦμα可指气息、风或灵。此处与扬场意象及后文πνεύματος呼应，“一口气”保留具体力度，也不排除神圣施为的意味。
- source_word: πεσεῖν
  choice: 倒下
  rationale: 保留πίπτω“倒下”的基本意象；语境暗示毁灭，但不直接改译为“灭亡”。
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: 被公义追赶
  rationale: δίκη可表示公义、审判或刑罚；“公义”保留原文拟人化的追赶者形象及道德司法意味。
- source_word: λικμηθέντες
  choice: 扬散
  rationale: λικμάω指扬场簸谷，使糠秕被风吹散；“扬散”简洁保留农业图景及被吹散的结果。
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: 被你大能的气息扬散
  rationale: 属格短语直译为“你大能的气息”，与前一个πνεῦμα形成文学呼应，并避免将其过度限定为位格性的“圣灵”。
- source_word: διέταξας
  choice: 安排了
  rationale: 表达按秩序配置、安排之意，现代汉语自然，也保留神设定万物秩序的含义。
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: 按尺度、数目和重量
  rationale: 保留原文著名的三项并列；σταθμός在此指称量所得的重量，“按”自然表达工具或准则意义。
theological_decisions:
- issue: πνεῦμα在本节应译为“气息”、“风”还是“灵”
  choice: 正文两处均译作“气/气息”
  alternative: 风；灵
  rationale: 扬场意象支持具有吹动作用的气息或风；译为“灵”容易加入原文并未明确要求的位格性解释。脚注保留其真实的多义性。
- issue: δίκη应译为“公义”还是“刑罚/审判”
  choice: 公义
  alternative: 刑罚；审判
  rationale: “公义”最能保留δίκη作为主动追赶者的拟人化形象；惩罚性含义确实存在，故在脚注中说明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一口气而倒下”保留原文的简洁力度；“扬散”承接扬场意象。脚注标记置于相关分句末，正文中的[a]对应πνεῦμα，[b]对应δίκη。
