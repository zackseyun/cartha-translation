revisions:
- from: 或是翻腾如扬谷的污浊烟团[a]，或是从眼中闪出的可怕火星；这些东西不但能以其伤害将他们一同碾碎，甚至仅凭令人惊恐的外貌就能将他们毁灭。
  to: 或是被簸扬的污浊烟团[a]，或是从眼中闪出的可怕火星；它们的伤害不但能把他们一同碾碎，甚至它们那令人惊恐的外貌也能将他们毁灭。
  rationale: 修订仅校正“如扬谷”所造成的比较性表达，恢复 λικμωμένους 的被动簸扬意象；同时微调后半句的主语和并列结构，使其更贴合原文“伤害”与“令人恐惧的外观”分别都足以造成毁灭的句法。保留“一同”以反映 συνεκτρῖψαι 的 συν- 前缀所可能含有的集合／加强色彩，且不把“他们”解释为特定群体。
