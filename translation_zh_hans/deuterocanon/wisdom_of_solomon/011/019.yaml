  text: or foul masses of smoke being winnowed[a], or terrible sparks flashing from their eyes—whose harm was able not only to crush them together, but even their frightening appearance to destroy them.
translation:
  language: zh_hans
  text: 或是被簸扬的污浊烟团[a]，或是从眼中闪出的可怕火星；它们的伤害不但能把他们一同碾碎，甚至它们那令人惊恐的外貌也能将他们毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“翻滚的污浊烟云。”希腊文直译近于“被簸扬的污浊烟团”，借用了扬谷时将谷物抛向空中的图像。
    reason: 说明罕见词组及农业隐喻，并提供较自然的另一译法。
lexical_decisions:
- source_word: βρόμους λικμωμένους καπνοῦ
  choice: 翻腾如扬谷的污浊烟团
  rationale: βρόμους罕见，表达污秽、有害之物；与καπνοῦ连用，译作“污浊烟团”保留具体威胁感。λικμωμένους本指扬谷、簸扬，正文以“如扬谷”保留农业意象，并用“翻腾”使现代汉语自然。
- source_word: δεινοὺς
  choice: 可怕
  rationale: 此处重在令人畏惧，并非道德上的邪恶；“可怕”直接而自然。
- source_word: ἀπʼ ὀμμάτων σπινθῆρας ἀστράπτοντας
  choice: 从眼中闪出的可怕火星
  rationale: 保留火星从眼中如闪电般迸现的怪兽意象；“闪出”简洁传达ἀστράπτοντας的突发亮光。
- source_word: βλάβη
  choice: 伤害
  rationale: 保留该词泛指损害、伤害的宽泛意义，不把具体伤害方式说死。
- source_word: συνεκτρῖψαι
  choice: 将他们一同碾碎
  rationale: “碾碎”表达ἐκτρίβω的彻底毁坏力度；“一同”呈现συν-可能具有的共同或集合色彩，同时不将其解释为彼此挤压。
- source_word: ἡ ὄψις ἐκφοβήσασα
  choice: 仅凭令人惊恐的外貌
  rationale: ὄψις指所见的样貌，分词ἐκφοβήσασα表达使人惊恐的作用；加入“仅凭”自然呈现与实际伤害相对的“光是看见”。
- source_word: διολέσαι
  choice: 毁灭
  rationale: 传达该动词彻底毁坏的强烈含义，并保持对象究竟是杀死还是彻底消灭的概括性。
theological_decisions:
- issue: 高度压缩的怪兽意象应保留到何种程度
  choice: 保留扬谷、眼中闪出火星以及仅凭外貌便能毁灭的奇异意象
  alternative: 顺译为“翻滚的污烟”并弱化农业隐喻
  rationale: 原文刻意使用夸张而陌生的诗性图景；保留这种张力比将其解释成普通烟云更忠于源文，且不牵涉特定宗派解释。
- issue: συνεκτρῖψαι中συν-的力度
  choice: 译作“一同碾碎”
  alternative: 只译作“碾碎”或“彻底粉碎”
  rationale: συν-既可能带共同、集合意味，也可能主要加强动词力度。“一同”保留前一种可能，但不进一步断言受害者彼此相撞。
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。“翻腾如扬谷”有意保留原文略显奇异的比喻；分号连接两类可怕之物与其共同后果，避免中文句法拖沓。脚注标记[a]已在正文对应位置出现。
