- source_word: ἀντέστησαν
  choice: 抵挡
  rationale: 该词为ἀνθίστημι的不定过去时，表示站出来抗拒或抵抗；“抵挡”自然、简洁，并保留对抗意味。
- source_word: πολεμίοις
  choice: 仇敌
  rationale: 该词指处于敌对、尤其是战争关系中的人；“仇敌”符合军事语境，也可与后句“敌人”形成近义平行。
- source_word: ἠμύναντο
  choice: 击退
  rationale: ἀμύνω的中间语态可表示自卫、抵御或击退来敌；“击退”在汉语中自然地表达成功抵御，而不额外明说原文未明示的“自己”。
- source_word: ἐχθρούς
  choice: 敌人
  rationale: 该词意为敌人；与“仇敌”搭配，既保留原文两个近义敌称的平行，也避免短句中机械重复。
