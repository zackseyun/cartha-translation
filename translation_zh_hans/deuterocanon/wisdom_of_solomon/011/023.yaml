base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/023.yaml
  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
translation:
  language: zh_hans
  text: 然而，你怜悯众人，因为你无所不能；你宽容人的罪过[a]，好让他们悔改[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽容”也可译作“暂且不追究”。这里不是说上帝不知道罪或认为罪无关紧要，而是说他出于怜悯加以容忍。
    reason: 说明παρορᾷς在本语境中的语义，避免将其误解为漠视罪。
  - marker: b
    text: “好让他们悔改”也可译作“以致悔改”；原文可表示目的，也可表示所趋向的结果。
    reason: 保留εἰς μετάνοιαν在目的与结果之间的语义张力。
lexical_decisions:
- source_word: ἐλεεῖς
  choice: 怜悯
  rationale: 表达带有行动意味的慈悲与恩待，既符合本节的神学分量，也自然庄重。
- source_word: πάντας
  choice: 众人
  rationale: 这里泛指所有人；“众人”简洁保留其普遍范围。
- source_word: πάντα δύνασαι
  choice: 你无所不能
  rationale: 以现代汉语的固定表达传达“能够做一切事”的全面能力，凝练而庄重。
- source_word: παρορᾷς
  choice: 宽容
  rationale: 在本语境中指因怜悯而暂不追究，并非不知道罪或认为罪无关紧要；“宽容”比直译“忽略”更不易造成道德冷漠的误解。
- source_word: ἁμαρτήματα ἀνθρώπων
  choice: 人的罪过
  rationale: ἀνθρώπων泛指人类，并不限于男性；“人的罪过”准确、自然，也保留复数罪行的概括意义。
- source_word: εἰς μετάνοιαν
  choice: 好让他们悔改
  rationale: εἰς可表达趋向、目的或结果；此译在汉语中自然地呈现宽容所指向的悔改，同时以脚注保留语义范围。
theological_decisions:
- issue: 上帝“宽容”人的罪所表达的含义
  choice: 上帝出于怜悯暂不追究人的罪，使其有悔改的指向
  alternative: 上帝忽视罪，或本句已经明确宣告无条件赦罪
  rationale: παρορᾷς与εἰς μετάνοιαν相连，所强调的是指向悔改的忍耐与宽容；正文不把它等同于轻看罪，也不提前解释为完全赦免。
- issue: εἰς μετάνοιαν的目的与结果张力
  choice: 正文译作“好让他们悔改”，脚注说明也可理解为“以致悔改”
  alternative: 只译成明确的目的，或只译成确定发生的结果
  rationale: 希腊语介词短语容许目的或趋向结果的理解；正文采用自然汉语，脚注保留其真实语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“然而”承接上下文的转折；分号呈现两个并列的神圣行动及其理由与指向。所有脚注标记均已置于正文相应位置。
