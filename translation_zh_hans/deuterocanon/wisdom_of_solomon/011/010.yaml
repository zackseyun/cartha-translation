base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/010.yaml
  text: For these you tested by admonishing them as a father[b][a], but those you examined by condemning them as a stern king.
translation:
  language: zh_hans
  text: 因为你考验这些人时，像父亲一样劝诫他们；但你察验那些人时，却像严厉的君王定他们的罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉的”也可译作“严峻的”或“严酷的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: 这些人……那些人
  rationale: 保留希腊文两组指示代词所构成的鲜明对比，又不在正文中增添“以色列人”和“埃及人”等原文未明说的名称。
- source_word: ὡς πατὴρ
  choice: 像父亲一样
  rationale: 直接保留父亲的比喻意象，现代汉语自然清楚。
- source_word: νουθετῶν
  choice: 劝诫
  rationale: 兼顾劝导、警戒和纠正之意，避免弱化为一般教导，也避免强化为惩罚。
- source_word: ἐδοκίμασας
  choice: 考验
  rationale: 表达对品格或表现的试验，并适合本段所指的管教性考验。
- source_word: ἀπότομος
  choice: 严厉的
  rationale: 传达尖锐、严峻、不宽贷的意味；“严厉”在现代汉语中庄重自然。
- source_word: βασιλεὺς
  choice: 君王
  rationale: 保留王权意象；“君王”比“统治者”更贴近 βασιλεύς，也符合经文语体。
- source_word: καταδικάζων
  choice: 定他们的罪
  rationale: 明确体现不利判决的司法含义，比泛称“审判”更完整地表达 καταδικάζω。
- source_word: ἐξήτασας
  choice: 察验
  rationale: 表达细察、审查之意，并与前句的“考验”区分，以保存两个希腊动词之间的差异。
theological_decisions:
- issue: 上帝对两组人采取不同方式
  choice: 保留父亲般的劝诫性考验与严厉君王般的定罪性察验之间的对照。
  alternative: 把两句都译成一般性的“考验”或“审查”，淡化管教与刑罚之间的区别。
  rationale: 希腊文分别使用不同的身份意象、分词和主要动词；译文不应消解这种神学张力。
- issue: καταδικάζων 与 ἐξήτασας 的句法关系
  choice: 译作“察验……却是……定他们的罪”，保留察验与定罪同时出现的结构。
  alternative: 将其处理为先审查、后定罪的明确时间顺序。
  rationale: 希腊文现在分词主要表达伴随或方式，并未明确规定严格的先后次序，因此不额外加入时间逻辑。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“考验／察验”保留两个希腊动词的区别，以“劝诫／定罪”凸显父亲式管教与君王式司法审判的对照。脚注标记置于全句末，指向“严厉的”的词义选择。
