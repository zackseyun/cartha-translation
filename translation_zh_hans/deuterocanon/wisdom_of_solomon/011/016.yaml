  text: so that they might know that by the very things through which a person sins[a], by these he is punished.
translation:
  language: zh_hans
  text: 好让他们知道：人借着哪些事物犯罪，也借着这些事物受惩罚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文重复使用同一个介词，直译可作“人借着哪些事物犯罪，也借着这些事物受惩罚”，强调犯罪所借的事物与受罚所借的事物彼此对应。
    reason: 说明希腊文重复结构及其强调作用
lexical_decisions:
- source_word: ἵνα γνῶσιν
  choice: 好让他们知道
  rationale: ἵνα加虚拟式表示目的或预期结果；“好让”自然保留目的意味，又不把结果说成已经实现。
- source_word: διʼ ὧν
  choice: 借着什么
  rationale: διά在此表示媒介或手段；关系代词ὧν为复数，但现代汉语用“什么”可自然泛指使人犯罪的那些事物。
- source_word: τις
  choice: 人
  rationale: τις是不定泛指的单数主语；“人”在现代汉语中简洁自然，保留普遍性。
- source_word: ἁμαρτάνει
  choice: 犯罪
  rationale: 保留ἁμαρτάνω的道德和神学分量，比泛化为“做错事”更准确。
- source_word: διὰ τούτων
  choice: 也就借着什么
  rationale: 重复“借着”以对应原文διά……διά……的结构；“也就”凸显犯罪手段与受罚手段之间的对应关系。
- source_word: κολάζεται
  choice: 受惩罚
  rationale: 被动形式在本语境中指受到惩处；“受惩罚”准确而不额外限定惩罚是管教性的还是终局性的。
theological_decisions:
- issue: 与罪相称的惩罚
  choice: 明确保留人借以犯罪之物也成为其受罚媒介的对应关系
  alternative: 仅笼统表达罪人因自己的罪受罚，不强调手段上的对应
  rationale: 原文以διʼ ὧν……διὰ τούτων重复同一介词结构，突出罪与罚之间相称、对应的关系；译文保留这一张力，但不扩展为严格机械式的报应原则。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“借着什么……也就借着什么……”有意保留原文的平行与重复，同时避免生硬的逐词照搬。
