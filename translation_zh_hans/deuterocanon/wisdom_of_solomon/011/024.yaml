base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: zh_hans
  text: 因为你爱一切存在的事物[a]，也不厌恶你所造的任何一样；因为若是你恨恶什么，你就不会把它塑造出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切存在的事物”也可译作“所有存在着的事物”或“一切存在之物”。
    reason: 保留τὰ ὄντα πάντα所表达的“一切存在者”及其存在性含义。
  - marker: b
    text: “塑造出来”也可译作“制成”或“造成”；此处原文所用动词与前面的“造”不同，带有制作、构成或精心制成的意味。
    reason: 说明κατασκευάζω的词义层次，并在中文中尽量保留它与前文ποιέω的用词区别。
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: 你爱
  rationale: 直译现在时动词，保留其广泛、积极而有意志指向的含义，不额外强化为偏重情感的表达。
- source_word: τὰ ὄντα πάντα
  choice: 一切存在之物
  rationale: 保留ὄντα的“存在着”之义及πάντα的全称范围；中文庄重自然，也不把范围缩窄为某类受造物。
- source_word: οὐδὲν βδελύσσῃ
  choice: 没有一样是你厌恶的
  rationale: βδελύσσομαι表示强烈厌弃或憎恶；“厌恶”在现代中文中力度较强且自然，并与下句的“恨”保持词义区别。
- source_word: ὧν ἐποίησας
  choice: 你所造的
  rationale: ποιέω基本义为“做、造”；此处涉及上帝的作为，以“造”简洁表达，但不额外加入更具系统神学色彩的解释。
- source_word: μισῶν τι
  choice: 若恨什么
  rationale: 分词与ἂν及不定过去时动词构成非现实条件；中文用“若……就不会……”自然表达反事实逻辑。τι译作不定代词“什么”，保持范围开放。
- source_word: κατεσκεύασας
  choice: 把它塑造出来
  rationale: κατασκευάζω含预备、建造、精心制成之意；“塑造出来”体现有意制作的意味，并与前面的ἐποίησας“造”有所区别。
theological_decisions:
- issue: 上帝的爱、厌恶与受造存在之间的关系
  choice: 保留经文的广泛陈述：上帝爱一切存在之物，并不厌恶自己所造的任何一样；其理由是，他不会塑造自己所恨之物。
  alternative: 将本节限定为只谈创造之初的良善，或解释为上帝无条件赞同受造界当前的一切状态。
  rationale: 希腊文直接涵盖“一切存在之物”和“你所造的”，但没有在本节中处理受造物当前状态、道德败坏或审判等后续问题；译文因此既不缩窄其范围，也不把它扩展成经文本身未明说的形而上结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“一切存在之物”保留原文的本体性广度；“没有一样是你厌恶的”使否定范围清楚；末句用自然的中文反事实条件句呈现原文逻辑。所有脚注标记均已置于正文相应位置。
