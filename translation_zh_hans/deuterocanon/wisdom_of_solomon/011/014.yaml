base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: zh_hans
  text: 因为他们曾讥笑着弃绝那位很久以前在被弃置时被抛下的人[a]；但到了这些事情的结局[b]，他们经历了与义人不同的干渴，便惊叹不已。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指那位幼年时曾被弃置、被抛下的人，暗指摩西。
    reason: cross_reference
  - marker: b
    text: 或译“到了那些结果最终显现时”；希腊语可指一连串事情的最终结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει
  choice: 被弃置
  rationale: 这里的名词指把婴孩置于户外遗弃的做法；译作“被弃置”既保留具体的历史情境，又不在正文中直接点明摩西。
- source_word: ῥιφέντα
  choice: 抛下
  rationale: 分词表示被扔下、抛弃；与“被弃置”连用，传达婴孩遭遗弃的动作，同时避免生硬的字面对译。
- source_word: ἀπεῖπον
  choice: 弃绝
  rationale: 该动词表达否认、拒斥或断然摒弃；“弃绝”能体现强烈的拒绝意味，并保持庄重语体。
- source_word: χλευάζοντες
  choice: 讥笑
  rationale: 分词说明他们弃绝那人的方式或伴随行为；“讥笑并弃绝”在现代汉语中自然清楚。
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: 到了这些事情的结局
  rationale: ἐκβάσεις可指结果、结局或事情发展的结果。此译保留其一定的语义开放性，不把它限定为某一场具体灾难。
- source_word: ἐθαύμασαν
  choice: 惊叹
  rationale: 准确表达因意外结果而惊奇；“惊叹”简洁且符合经文语体。
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  choice: 因所受的干渴与义人不同
  rationale: 保留埃及人与义人所经历之干渴的明确对比，并以因由结构自然承接“惊叹”；不额外解释两者具体如何不同。
theological_decisions:
- issue: 被弃置抛下者的身份
  choice: 正文仍以间接称谓表达，不直接写出摩西
  alternative: 在正文中译为“摩西”或“婴孩摩西”
  rationale: 希腊文只作间接描述。保留这种含蓄表达可忠实于原文，并由脚注说明历史典故。
- issue: 义人与对方所受干渴的差异
  choice: 仅说明二者不同，不解释差异的性质
  alternative: 明确解释为义人缺水后蒙供应，而埃及人的干渴属于惩罚
  rationale: 上下文支持这种背景，但本节本身只作比较；正文不应把隐含的神学因果全部明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“弃置抛下”保留弃婴情境，“这些事情的结局”保留ἐκβάσεις在“事情发展”与“最终结果”之间的语义空间。末句用“因……而惊叹”使希腊语分词关系在汉语中清楚，但不进一步限定干渴差异的具体性质。
