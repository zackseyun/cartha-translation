translation:
  language: zh_hans
  text: 或是新造的、无人知晓的猛兽，满怀狂怒；又或是喷吐火焰气息的猛兽，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεοκτίστους
  choice: 新造的
  rationale: 保留复合词中“新”与“创造、造出”的含义，表明这些猛兽是新近被造出的，并非仅指幼小。
- source_word: θυμοῦ πλήρεις
  choice: 满怀狂怒
  rationale: πλήρεις表示“充满”，θυμός在此指猛烈的怒气；译文既保留原有结构，也传达猛兽的凶猛状态。
- source_word: θῆρας ἀγνώστους
  choice: 陌生猛兽
  rationale: θήρ指具有威胁性的野兽或猛兽；ἄγνωστος意为未知、未曾见过。此处用“陌生”表达这些兽类前所未见，同时避免误解为其身份单纯不明。
- source_word: ἤτοι
  choice: 又或是
  rationale: 在这一连串可能施行惩罚的方式中引出另一种情形；“又或是”保留选择关系，不把它强解为解释性的“也就是”。
- source_word: πυρπνόον φυσῶντας ἆσθμα
  choice: 喷吐着带火的气息
  rationale: 原文把“吹、喷吐”“气息”和“喷火的”压缩组合在一起。译文保留火与气息的意象，同时采用自然的现代汉语表达。
