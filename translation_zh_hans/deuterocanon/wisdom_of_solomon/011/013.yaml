  text: For when they heard that those very people were being benefited through their own punishments[a], they recognized the Lord.
translation:
  language: zh_hans
  text: 因为他们听说，另一些人竟借着自己所受的惩罚得了益处，便察觉到主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便认识到主”或“便意识到主。”希腊文可表示察觉、感知或认识，并不一定意味着完全承认或信靠主。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: 因为……就
  rationale: γάρ承接上文说明原因，ὅτε引出事情发生的时点；汉语用“因为……就……”自然表达这一因果兼时间关系。
- source_word: ἤκουσαν
  choice: 他们听说
  rationale: 保留听闻消息的基本含义；在此处“听说”比单纯“听见”更符合获知他方处境的语境。
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: 借着他们自己所受的惩罚
  rationale: διά加属格表示途径或手段；“他们自己所受的”保存ἰδίων的反衬意味，并明确惩罚临到听闻者这一方。
- source_word: εὐεργετουμένους
  choice: 得了益处
  rationale: 表达被动领受好处的意义，同时避免生硬的“被施惠”；与惩罚形成经文中的反讽对照。
- source_word: αὐτούς
  choice: 那些人
  rationale: 代词指向前文另一群体，即以色列人；“那些人”在现代汉语中足以标明双方区别，又不在正文中直接补入专名。
- source_word: ᾔσθοντο
  choice: 意识到
  rationale: 该动词可表示察觉、感知或认识；“意识到”保留认识逐渐形成的意味，不暗示完整的信仰告白。
- source_word: τοῦ κυρίου
  choice: 这是主的作为
  rationale: 希腊文直译近于“意识到主”；汉语若仅说“意识到主”不自然。依语境补出“这是……的作为”，表达他们察觉主在事件中的行动，同时以脚注保留原文较简约、开放的说法。
theological_decisions:
- issue: αὐτούς所指的受益群体
  choice: 理解为与受罚者相对的以色列人，正文称“那些人”
  alternative: 仅译作“他们”，让群体对比完全隐含
  rationale: 本章上下文对照埃及人所受的灾罚与以色列人所得的供应；“那些人”使普通读者能跟上指代，同时不把解释性专名写入正文。
- issue: ᾔσθοντο τοῦ κυρίου的力度
  choice: 译为“意识到这是主的作为”
  alternative: “认出了主”或“觉察到主”
  rationale: 原文表示对主的察觉或认识，却未必指完全归信。所选译法将认识落在主借事件显出的行动上，避免把它强化为信仰告白；脚注提示原文也可更简约地理解。
translation_notes:
  register: 采用现代、庄重而自然的叙述语体。“竟”轻度呈现惩罚与受益之间的反讽；“得了益处”比“被施惠”更易懂。脚注标记置于完整句末，并与脚注条目对应。
