base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: zh_hans
  text: 因为整个世界在你面前，就像天平上的一粒微尘[a]，又像落在地上的一滴晨露。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像天平轻微的一偏”，也可能指“天平上的一枚极小砝码”；希腊语意象强调其极其微小、轻若无物。
    reason: 保留ῥοπὴ ἐκ πλαστίγγων的词义歧义。
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: 天平上的一粒微尘
  rationale: 这一短语描绘天平上极其微小、几乎无足轻重之物或极轻微的偏转。“一粒微尘”在现代汉语中自然地传达其微小之意，同时由“天平”保留称量意象；原文可能指天平的轻微转动或极小砝码，故以脚注保留歧义。
- source_word: ὅλος ὁ κόσμος
  choice: 整个世界
  rationale: κόσμος在此指作为整体的有序世界；“整个世界”自然、全面，又不额外限定为现代宇宙学意义上的“宇宙”。
- source_word: ἐναντίον σου
  choice: 在你面前
  rationale: 贴近原文“在你面前／在你跟前”，并让两个比喻自然表达世界相对于上帝何等微小，而不将其改写为抽象判断。
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: 一滴晨露
  rationale: ῥανίς意为“一滴”，ὄρθρινή修饰“露”，表示清晨的露水；“一滴晨露”简洁而有诗意。
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: 落在地上的
  rationale: 分词本义为“降下、落下”；汉语说露水“落在地上”自然清楚，并保留下降至地面的图景。
theological_decisions:
- issue: 世界在上帝面前显得极其微小
  choice: 保留原文两个具体比喻，不将其抽象化为“世界在你面前算不得什么”。
  alternative: 意译为“整个世界在你面前如同虚无”或“毫无价值”。
  rationale: 希腊文强调的是尺度上的微小，并未直接断言受造世界毫无价值；直译比喻可避免把诗意比较扩大为关于创造物价值的形而上判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”对应句首ὅτι，并保留本节与上文的论证关系；两个“像”维持原文平行结构。
