base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/017.yaml
  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: zh_hans
  text: 因为你全能的手从无定形的物质[a]创造了世界，却并非不能派遣大群的熊或凶猛的狮子去攻击他们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无定形的物质”也可译作“未成形的材料”。这一希腊语短语带有希腊化时代的宇宙论色彩；不宜用本节来裁定后世关于创造方式的教义争论。
    reason: 说明ἐξ ἀμόρφου ὕλης的词义备选及思想背景，避免将本节用于过度裁定其未明确处理的教义问题。
lexical_decisions:
- source_word: ἠπόρει
  choice: 并非没有能力
  rationale: ἀπορέω可指缺乏办法、手段或能力；否定式在此构成曲言，既保留希腊文的表达方式，也自然说明上帝完全有能力如此施行。
- source_word: ἡ παντοδύναμός σοι χείρ
  choice: 你那……全能之手
  rationale: 保留“手”这一表示神圣行动与能力的喻象；παντοδύναμος译为“全能”，用语庄重而通行。
- source_word: κτίσασα τὸν κόσμον
  choice: 创造世界
  rationale: 分词修饰“手”，说明其能力的根据；κόσμος在此译作“世界”，不额外限定为现代意义上的“宇宙”。
- source_word: ἐξ ἀμόρφου ὕλης
  choice: 于无定形物质
  rationale: 直译这一具有希腊化思想背景的宇宙论表述；“无定形”对应ἀμόρφου，“物质”对应ὕλης，并不借译文裁定后世关于创造方式的争论。
- source_word: ἐπιπέμψαι αὐτοῖς
  choice: 降下……攻击他们
  rationale: ἐπιπέμπω含差遣到某人身上或攻击某人的意味；结合猛兽作为审判手段的语境，用“降下……攻击他们”较为自然且保留方向性。
- source_word: πλῆθος ἄρκων
  choice: 成群的熊
  rationale: πλῆθος强调数量众多；汉语“成群的”比“许多”更形象，也不误译为昆虫般的“群 swarm”。
- source_word: θρασεῖς λέοντας
  choice: 凶猛的狮子
  rationale: θρασύς本可指大胆、强横；用于具有威胁性的猛兽时，“凶猛”最合乎语境。
theological_decisions:
- issue: 关于神圣能力的曲言表达
  choice: 并非没有能力
  alternative: 本来能够；并不缺少能力
  rationale: 保留οὐ ἠπόρει的否定式表达，不把它顺译成更强或更直接的断言，同时清楚表达全能之手并不缺乏施行审判的能力。
- issue: ἐξ ἀμόρφου ὕλης所涉及的创造观表述
  choice: 于无定形物质
  alternative: 从未成形的材料；用无定形的物质
  rationale: 如实保留本节的希腊化宇宙论措辞，不将其改写为本节没有明说的“从无创造”，也不据此否定该教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“全能之手”的原文喻象和“并非没有能力”的曲言；句末逗号反映本节在原文中尚未完句，并与下一节衔接。
