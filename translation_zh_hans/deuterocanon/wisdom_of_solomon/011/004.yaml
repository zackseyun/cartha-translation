base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: zh_hans
  text: 他们渴了，便呼求你；水从陡峭的磐石中赐给他们；又从坚硬的石头中赐给他们解渴的良药。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίψησαν
  choice: 他们渴了
  rationale: 以自然现代汉语表达不定过去时所述的缺水状态，同时保留叙事推进。
- source_word: ἐπεκαλέσαντό σε
  choice: 呼求你
  rationale: 这里的中间语态表示人在困境中向上帝求告；“呼求”既自然，也保留祷告和求助意味。
- source_word: ἐδόθη αὐτοῖς
  choice: 赐给他们
  rationale: 保留原文被动含义，不在正文中明确补出施予者；“赐给”契合上帝供应的语境。
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: 从陡峭的磐石中
  rationale: ἀκρότομος有陡峭、峻削之意；此译体现水源所在之险峻与出水的不可思议。
- source_word: ὕδωρ
  choice: 水
  rationale: 直接、准确的对应。
- source_word: ἄκος δίψης
  choice: 解渴的良药
  rationale: 保留ἄκος的医治性比喻，而不是弱化为普通的“缓解”或“饮水”。
- source_word: ἐκ λίθου σκληροῦ
  choice: 从坚硬的石头中涌出
  rationale: “坚硬的石头”准确对应原文；补入“涌出”使后半句在汉语中完整，并从前半句承接水的出现，未改变其来源。
theological_decisions:
- issue: 是否明确说上帝赐下水
  choice: 使用“有水……赐给他们”，不补出“你”作施事者
  alternative: “你从陡峭的磐石中赐水给他们”
  rationale: 原文采用神学被动式；上下文虽清楚暗示上帝是施予者，译文仍保留原文在句法上的含蓄。
- issue: 如何处理ἄκος δίψης的医治比喻
  choice: 译作“解渴的良药”
  alternative: “解除干渴”或“解渴之物”
  rationale: “良药”保留原文将水描绘为医治之物的诗性张力，也呈现上帝供应的恢复性。
- issue: 后半句省略谓语的处理
  choice: 补出“涌出”，并以脚注说明原文结构
  alternative: 重复“赐给他们”
  rationale: 希腊文后半句与前句平行而省略谓语；现代汉语需要适当补足。“涌出”自然指向由石头出水的图景，但以脚注避免将补足成分误当作明说。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“磐石”保持经文语体，“呼求”和“良药”清楚易懂。正文仅设一个脚注，且标记[a]已置于正文相应句末。
