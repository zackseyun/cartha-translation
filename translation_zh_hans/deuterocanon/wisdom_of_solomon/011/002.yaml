  text: They traveled through an uninhabited wilderness, and in trackless places they pitched tents;
translation:
  language: zh_hans
  text: 他们走过无人居住的旷野，在没有路径之地搭起帐篷；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διώδευσαν
  choice: 走过
  rationale: 该复合动词表示穿行、经过某一区域；“走过”简洁自然，并保留穿越旷野的动态。
- source_word: ἔρημον ἀοίκητον
  choice: 无人居住的旷野
  rationale: ἔρημον 指荒凉的野地，不必限定为沙漠；ἀοίκητον 明确表示无人居住。合译既准确又符合现代汉语。
- source_word: ἐν ἀβάτοις
  choice: 在无路可行之地
  rationale: ἀβάτοις 可指难以进入、不可通行或无人踏过之处；这里与旅程相连，“无路可行之地”保留险阻和没有现成道路的意味，而不将其绝对化为完全无法进入。
- source_word: ἔπηξαν σκηνάς
  choice: 搭起帐篷
  rationale: πήγνυμι 本义涉及固定、支立，与 σκηνάς 连用时自然指支搭帐篷；“搭起帐篷”是现代汉语的惯常表达。
theological_decisions:
- issue: 出埃及旷野旅程的意象
  choice: 保留具体的行旅与搭帐篷描写，不增添解释性神学措辞。
  alternative: 意译为“他们在沙漠中安营”。
  rationale: 本节使人联想到以色列人在旷野的经历，但希腊文本本身只作具体叙述；直陈其行动可保留典故空间及文本的含蓄性。
- issue: ἀβάτοις 的语义张力
  choice: 译作“无路可行之地”。
  alternative: 译作“无法进入之地”或“人迹未到之地”。
  rationale: 若译成“无法进入”，会与他们实际在那里搭帐篷形成过强的字面冲突；所选译法表达地势难行、没有道路，同时保留原词所含的险阻感。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旷野”契合经文语境且不过度限定地貌；句式紧凑，保留原文两个并列动作及分号收束。
