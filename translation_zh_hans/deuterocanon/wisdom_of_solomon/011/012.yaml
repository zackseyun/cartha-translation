lexical_decisions:
- source_word: διπλῆ
  choice: 双重的
  rationale: 保留“二重、双倍”的形象；在本句中既可表达两方面的悲痛，也带有加倍之感，不强行消除这种含混。
- source_word: ἔλαβε
  choice: 攫住了
  rationale: 情绪在此仿佛主动临到并控制他们；“攫住”比普通的“临到”更能保留希腊语表达的力度。
- source_word: λύπη
  choice: 悲痛
  rationale: 表达深重的哀伤，并与后面的“呻吟”自然搭配。
- source_word: στεναγμός
  choice: 呻吟
  rationale: 指因痛苦发出的可闻叹声；“呻吟”保留其强度，强于一般的“叹息”。
- source_word: μνημῶν
  choice: 回想……而发的
  rationale: 这是压缩的属格结构，表示呻吟与记忆之间的关联，可能兼具来源或原因含义；正文用自然汉语呈现，脚注保留较直译的可能。
- source_word: τῶν παρελθουσῶν
  choice: 往事
  rationale: 字面为“已经过去的事”；“往事”简洁自然，所指仍是他们回忆的先前事件。
