base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/021.yaml
  text: For it is always in your power to show great strength[a], and who will withstand the might of your arm?
translation:
  language: zh_hans
  text: 因为你随时都能施展大能[a]；谁能抵挡你膀臂的威力呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为施展大能始终由你支配。”
    reason: 原文πάρεστίν σοι πάντοτε既可直接表达“你随时都能”，也可强调施展大能始终可由你支配。
lexical_decisions:
- source_word: μεγάλως ἰσχύειν
  choice: 大施能力
  rationale: μεγάλως修饰ἰσχύειν，表示强有力地运用或彰显力量；“大施能力”既保留程度，也自然表达能力的实际施展。
- source_word: πάρεστίν σοι πάντοτε
  choice: 随时都在你掌握之中
  rationale: πάρεστίν σοι表达某事随时可供支配、可以施行，而不只是抽象的可能性；此译法保留“始终可用”的含义。
- source_word: κράτει
  choice: 威力
  rationale: κράτος侧重显出的强大力量；“威力”简洁庄重，并与前半句的“能力”有所区分。
- source_word: βραχίονός σου
  choice: 你膀臂的
  rationale: 直译并保留圣经中以“膀臂”象征有效力量的拟人性意象，不将其抽象化为“权能”。
- source_word: τίς ἀντιστήσεται
  choice: 谁能抵挡呢
  rationale: 反问表达无人能够成功抗拒；汉语以“能”清楚传达这种无法抵御之意。
theological_decisions:
- issue: 以“你的膀臂”拟人化描写上帝的能力
  choice: 保留“你膀臂”的形象
  alternative: 译作“你的权能”或“你的力量”
  rationale: 原文明确采用传统的圣经意象；保留该比喻可维持文本的文学质感与神学张力，避免将形象扁平化。
- issue: πάρεστίν σοι所表达的是能力的拥有还是随时可施展
  choice: 译为“随时都在你掌握之中”
  alternative: “你总有能力”或“你随时都能”
  rationale: 原句强调大施能力始终可供上帝支配；所选译法既不暗示力量需要从外而来，也保留其可随时施展的语感。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大施能力”略具经文语体但不古奥；“膀臂”保留圣经传统意象。反问句用“谁能抵挡呢”自然呈现无人可抗拒的含义。
