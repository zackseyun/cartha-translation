base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/005.yaml
  text: For by the very things through which their enemies were punished[a], they themselves, when in need, were benefited.
translation:
  language: zh_hans
  text: 因为他们的仇敌借着那些事物受惩罚，他们自己在困境中[a]却借着同样的事物得益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在困境中”也可译作“无计可施时”、“感到困惑时”或“有需要时”。希腊文可表示困惑、无助、匮乏或需要。
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: 借着什么……也借着同样的事物
  rationale: 保留前后重复的工具性表达，并用“同样的”凸显反转：惩罚仇敌的事物也使他们得益。
- source_word: ἐκολάσθησαν
  choice: 受到惩罚
  rationale: 清楚表达该动词所指的惩罚性处置，同时保留被动语态。
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: 他们的仇敌
  rationale: 自然、庄重地表达希腊文的所属关系。
- source_word: αὐτοὶ
  choice: 他们自己
  rationale: 保留代词的强调作用，使神子民与其仇敌形成鲜明对照。
- source_word: ἀποροῦντες
  choice: 在困境中
  rationale: 该分词可指困惑、无计可施、匮乏或有需要；“在困境中”较宽泛地保留这些可能含义，不把语义限于心理困惑或物质缺乏。
- source_word: εὐεργετήθησαν
  choice: 得到恩惠
  rationale: 体现被动领受益处或善待的意思，并与“受到惩罚”形成形式上的对应。
theological_decisions:
- issue: 神行动中的工具性反转主题
  choice: 明确保留同一类事物既惩罚仇敌、又使神的子民得益的对应关系。
  alternative: 较宽松地只表达惩罚与受益的对比，不重复工具性措辞。
  rationale: 希腊文“διʼ ὧν ... διὰ τούτων”的重复是本节文学结构和神学反转的重要部分；保留这一结构而不进一步指明行动者，可避免加入经文本身未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“仇敌”保持智慧文学语体；“在困境中”保存原文词义的宽度。脚注标记置于整句末尾，说明该分词的真实歧义。
