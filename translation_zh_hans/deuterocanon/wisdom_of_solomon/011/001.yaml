  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/001.yaml
  text: He prospered their works by the hand of a holy prophet[a].
translation:
  language: zh_hans
  text: 他借着一位圣先知的手，使他们所做的事顺利。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“圣先知”从上下文看很可能指摩西，但本节希腊文没有提到他的名字。
    reason: 交代上下文所暗示的身份，同时说明正文不直接点名的文本依据。
lexical_decisions:
- source_word: Εὐόδωσεν
  choice: 使……顺利
  rationale: 该动词在此为使役意义，表示使事情进展顺利、获得成功；这一译法自然保留了其使役含义，同时没有额外加入“引导”等原文未明说的概念。
- source_word: τὰ ἔργα αὐτῶν
  choice: 他们所做的事
  rationale: ἔργα 可泛指工作、行为或所从事的事。“他们所做的事”在现代汉语中自然清楚，也保留了原词较宽的指涉范围。
- source_word: ἐν χειρὶ
  choice: 借着……的手
  rationale: 这一表达既可表示工具或中介，也保留圣经语言中“借某人的手”这一形象，没有把它解释性地扩写成“在……引导下”。
- source_word: προφήτου ἁγίου
  choice: 一位圣先知
  rationale: 希腊文没有冠词，也没有物主成分；译作“一位圣先知”既符合汉语表达，也不擅自补入“他的”或直接点名摩西。
theological_decisions:
- issue: 动词省略的主语
  choice: 译作“他”，让其所指由上下文确定
  alternative: 明确译作“上帝”或“主”
  rationale: 希腊文动词本身未明说主语；使用“他”可保留上下文所指的神圣主体，同时避免加入原文没有出现的称谓。
- issue: 圣先知的身份
  choice: 正文保留为“一位圣先知”
  alternative: 直接译作“摩西”或“他的圣先知”
  rationale: 上下文很可能指摩西，但本节希腊文本身没有点名，也没有物主代词，因此正文维持原文的具体程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着……的手”有意保留原文的经文式中介意象；“使他们所做的事顺利”则避免生硬直译，同时准确表达使役意义。
