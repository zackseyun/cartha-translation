base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/008.yaml
  text: You gave them abundant water unexpectedly[a], showing through their thirst at that time how you punished their adversaries.
translation:
  language: zh_hans
  text: 你出乎他们意料地赐给他们丰富的水[a]，借着他们当时的干渴，显明你怎样惩罚了他们的敌人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出乎他们意料地”也可译为“在他们没有盼望时”或“超乎他们所盼望的”。
    reason: ἀνελπίστως可指“出乎意料”，也可带有“没有盼望／超乎所盼望”的意味。
lexical_decisions:
- source_word: ἔδωκας
  choice: 赐给
  rationale: 此处主语是上帝；“赐给”既准确表达给予，也符合本书庄重而自然的语体。
- source_word: δαψιλὲς ὕδωρ
  choice: 充足的水
  rationale: δαψιλής强调供应丰裕；“充足”清楚自然，又不额外强化为奢华或无穷。
- source_word: ἀνελπίστως
  choice: 在他们意想不到时
  rationale: 该副词可指意料之外，也可能带有“不再抱希望”的意味；正文采用自然的时间状语表达，脚注保留较强的希望层面。
- source_word: δείξας
  choice: 显明
  rationale: 分词说明赐水这一行动同时具有彰显作用；“显明”保留其展示、使人看出的意义。
- source_word: διὰ τοῦ τότε δίψους
  choice: 借着他们当时所受的干渴
  rationale: διά加属格在这里表达媒介；“当时”对应 τότε，“所受的”使汉语表达顺畅而不改变所指。
- source_word: πῶς
  choice: 怎样
  rationale: 引出所显明的内容，即上帝惩罚敌人的方式。
- source_word: τοὺς ὑπεναντίους
  choice: 他们的敌人
  rationale: 该词指处于敌对地位的人；“敌人”比“对头”更自然明确。物主关系由上下文补出。
- source_word: ἐκόλασας
  choice: 惩罚了
  rationale: κολάζω在此表示惩处；“惩罚”直接清楚，不弱化其刑罚含义。
theological_decisions:
- issue: “他们”与“他们的敌人”所指及其对比
  choice: 正文保留代词，以“他们”指上帝的百姓，“他们的敌人”指遭惩罚的敌对者。
  alternative: 将两者明确译为“以色列人”和“埃及人”，或泛化为“义人”和“敌对他们的人”。
  rationale: 紧接的上下文支持以色列与埃及人的历史背景，但希腊文本本节使用代词和概括性称谓；保留代词既忠实原文，也避免在正文中把所指收窄得超过本句措辞。
- issue: 干渴如何显明对敌人的惩罚
  choice: 保留“借着……干渴，显明你怎样惩罚”的紧张关系，不解释其具体机制。
  alternative: 明确补写为“借着他们曾经历的干渴，使他们明白敌人受干渴之罚何等严厉”。
  rationale: 上下文存在对照，但本句本身表达凝练；不在正文中补足推论，可保留原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐给”“显明”保持智慧文学的较高语体；句法稍作汉语化处理，同时保留原文中赐水与惩敌之间的对照。
