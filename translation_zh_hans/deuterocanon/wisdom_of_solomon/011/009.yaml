base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: zh_hans
  text: 因为他们受考验时，虽在怜悯中受管教[a]，却由此明白了不敬虔的人在震怒中受审判、遭受折磨的情形。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教导”或“惩戒”；希腊词可包括教育、训练和纠正性的管束。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  choice: 受考验
  rationale: 此处指经受试炼或检验，并非主要指受引诱犯罪；“受考验”自然且符合上下文的对比。
- source_word: καίπερ
  choice: 虽
  rationale: 保留让步意味，并使汉语句式简洁自然。
- source_word: ἐν ἐλέει
  choice: 在怜悯中
  rationale: 既可表示受管教的方式，也可表示其所处的恩慈范围；直译保留这种轻微歧义。
- source_word: παιδευόμενοι
  choice: 受管教
  rationale: 该词兼有教育、训练和纠正性惩戒之意；“管教”能体现纠正目的，并与后文震怒中的审判形成对照。
- source_word: ἔγνωσαν
  choice: 由此明白了
  rationale: 表达因亲身经历而获得认识；“由此”使这种经验性的领悟在现代汉语中更清楚。
- source_word: ἐν ὀργῇ
  choice: 在震怒中
  rationale: 保留介词结构及神圣忿怒的分量；“震怒”庄重而通俗。
- source_word: κρινόμενοι
  choice: 受审判
  rationale: 直接表达正在承受审判，不擅自加强为已经定罪。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 突出对上帝缺乏敬畏的宗教伦理含义，比泛称“恶人”更贴近希腊词。
- source_word: ἐβασανίζοντο
  choice: 遭受折磨
  rationale: 传达严重痛苦而不具体限定施加痛苦的方式。
theological_decisions:
- issue: 义人所受的考验与不敬虔者所受痛苦的性质
  choice: 将前者译为“在怜悯中受管教”，后者译为“在震怒中受审判、遭受折磨”。
  alternative: 可将 παιδευόμενοι 较中性地译为“受教导”，或较严厉地译为“受惩戒”。
  rationale: 原文有意将带着怜悯、具有纠正性质的经历，与震怒中的审判和折磨相对照；本译法保留这种神学张力，不否认前者也包含真实苦难。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“虽……却……”呈现让步关系；“由此明白了……的情形”使复杂的希腊语分词结构在中文中清楚顺畅，同时保留受怜悯的管教与震怒审判之间的对照。
