lexical_decisions:
- source_word: ἀντὶ μὲν
  choice: 得到的不是……反而
  rationale: ἀντί表示替代或交换；μὲν又使本句带有承接下文对照的意味。此译法在现代汉语中自然地表达“本应有此，却换来彼”的关系，同时保留句末未完的衔接感。
- source_word: πηγῆς ἀενάου ποταμοῦ
  choice: 长流不息的河泉
  rationale: πηγή指泉源，ἀέναος指持续流动，ποταμός指河流。“河泉”简洁表达河流的泉源，也避免生硬的“长流不息之河的泉源”。
- source_word: αἵματι λυθώδει
  choice: 泥浆般的血
  rationale: αἷμα是血；λυθώδης带有泥泞、污浊如泥的意象。“泥浆般的血”保留具体而令人厌恶的污染画面，不把它抽象化为一般的“污水”。
- source_word: ταραχθέντες
  choice: 被……所困扰
  rationale: 该被动分词可表示受到搅扰、扰乱或陷入不安；这里既可涉及灾祸造成的实际困境，也可涉及人的惊惶，译作“所困扰”保留这层宽度。
theological_decisions:
- issue: 是否明说这是尼罗河之水变血的埃及灾祸
  choice: 保持含蓄，只译“泥浆般的血”，不增添“尼罗河”或“水变成”
  alternative: 译作“因河水变成泥浆般的血而受困扰”
  rationale: 希腊文以压缩的诗性措辞唤起出埃及事件，却没有在本分句中明说尼罗河或水的转变。直陈这些内容虽便于理解，却会消除原文的含蓄。
- issue: πηγῆς ἀενάου ποταμοῦ中属格关系的表达
  choice: 长流不息的河泉
  alternative: 长流不息之河的泉源
  rationale: 两种表达都可反映“泉源—河流”的属格关系；正文采用较自然的现代汉语，脚注保留更贴近形式的译法。
