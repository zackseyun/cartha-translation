base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: zh_hans
  text: 若非你愿意，什么能存留呢？那未被你召唤的[a]，又怎能得以保全呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未被你召唤进入存在的。”希腊文只说“被召唤”；按上下文，这可能指上帝以创造性的召唤使万物存在。
    reason: 说明“被召唤”的字面表达及其可能的创造性语境含义，同时不在正文中把“进入存在”的解释固定化。
lexical_decisions:
- source_word: πῶς δὲ ἔμεινεν ἄν τι
  choice: 什么能存留下来呢
  rationale: πῶς与ἄν构成反问，表达离开上帝的旨意便不可能存续；ἔμεινεν在此指继续存在。译为“能存留下来”既保留反问语气，也自然表达存续之意。
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: 若不是你愿意
  rationale: θέλω表示意愿或旨意；“愿意”在现代汉语中自然清楚，并保留原文所说的主动意愿，不额外引入更强的哲学或教义术语。
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: 不是你所呼召的
  rationale: κληθέν字面义为“被呼召”。上下文可能暗示上帝以呼召使万物存在，但希腊文没有明说“进入存在”，因此正文保留较为直译且开放的表达，并以脚注说明可能的语境含义。
- source_word: διετηρήθη
  choice: 得以保存
  rationale: διατηρέω表示保全、维持或使之继续存在。“得以保存”贴合被动语态，并与前半句“存留下来”形成自然呼应。
theological_decisions:
- issue: 是否在正文中把τὸ μὴ κληθέν明确译为“未被呼召进入存在的”，从而直接表达创造意义
  choice: 正文译作“不是你所呼召的”
  alternative: “不是你呼召使之存在的”或“不是你召唤进入存在的”
  rationale: 本节语境确实容许把“呼召”理解为创造性的召唤，但原文只写“呼召”，没有明说“进入存在”。正文保留原有含混与神学张力，较明确的解释置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个反问句保持原文的平行结构；“存留下来”和“得以保存”分别传达继续存在与被维持、保全的含义。脚注标记置于实际涉及歧义的“呼召”之后。
