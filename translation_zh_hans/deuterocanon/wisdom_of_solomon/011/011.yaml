  text: And both those absent and those present were afflicted alike;[a]
translation:
  language: zh_hans
  text: 无论不在场的还是在场的，都同样受苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受苦”也可译作“受困扰”或“受折磨”；希腊文动词含有被耗损、受苦的意思。
    reason: 词义存在若干相近译法；脚注说明该动词可指受苦、受困扰或被耗损，而正文避免将痛苦性质具体化。
lexical_decisions:
- source_word: ἀπόντες
  choice: 不在场的
  rationale: 该分词表示离开或不在场；此译法自然，并与“在场的”形成清晰对照。
- source_word: παρόντες
  choice: 在场的
  rationale: 该分词表示在场、身处其地；与ἀπόντες的对称结构相呼应。
- source_word: ὁμοίως
  choice: 同样
  rationale: 表达两类人所受痛苦在方式或程度上相同，简洁保留原文含义。
- source_word: ἐτρύχοντο
  choice: 饱受折磨
  rationale: 该未完成时中间／被动形式表示持续被耗损、受苦或受折磨；“饱受折磨”既体现持续状态，也不限定痛苦的具体形式。
theological_decisions:
- issue: ἐτρύχοντο所表达的受苦性质
  choice: 用“饱受折磨”概括持续而深重的痛苦
  alternative: 受苦；困苦不堪；备受煎熬
  rationale: 希腊词可指被耗损、困扰或折磨。译文保留痛苦的强度和持续性，但不将其限定为某一种肉体刑罚或特定神学意义上的惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论……还是……”自然呈现两个群体的并列；“都同样”对应ὁμοίως，并保持原句简洁。
