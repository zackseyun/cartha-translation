base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
translation:
  language: zh_hans
  text: 作为对他们不义的愚妄思虑[a]的报应——他们因这些思虑受迷惑，敬拜没有理性的爬行之物和低贱的兽类——你使许多没有理性的动物[c]临到他们，作为惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚妄思虑”或译“无知的念头”。
    reason: lexical_alternative
  - marker: b
    text: “惩罚”也可译作“报应”或“惩治”。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文在“没有理性的爬行之物”和“没有理性的动物”中重复同一词，形成修辞上的呼应。
    reason: rhetorical_echo
lexical_decisions:
- source_word: ἀντὶ
  choice: 为了报应
  rationale: 此处表示与其罪行相应的惩治，而非单纯的替代；“为了报应”在中文中自然表达这种对应关系。
- source_word: λογισμῶν ἀσυνέτων
  choice: 愚妄思虑
  rationale: λογισμοί指思考、推想或盘算，ἀσύνετοι指出其缺乏明智；“愚妄思虑”兼顾认知与道德层面的批评。
- source_word: ἀδικίας αὐτῶν
  choice: 他们不义的
  rationale: 保留ἀδικία的道德—宗教分量，同时不把含义缩窄为社会层面的“不公”。希腊语属格关系略有压缩，中文也避免过度解释。
- source_word: ἐν οἷς πλανηθέντες
  choice: 他们受这些思虑迷惑
  rationale: 明确关系词回指复数的“思虑”，并保留πλανηθέντες的被动意味。
- source_word: ἐθρήσκευον
  choice: 敬拜
  rationale: 在偶像崇拜语境中，该词表示宗教礼敬；“敬拜”清楚而庄重。
- source_word: ἄλογα ἑρπετὰ
  choice: 无理性的爬行之物
  rationale: “无理性的”贴近ἄλογα，并与后文同词根表达形成反复；“爬行之物”涵盖ἑρπετά而不局限于现代动物分类中的爬行动物。
- source_word: κνώδαλα εὐτελῆ
  choice: 卑贱的兽类
  rationale: κνώδαλα带有兽类的意味，εὐτελῆ表示低贱、微不足道；此译保留原文轻蔑色彩，并与后文ζῴων的“动物”有所区分。
- source_word: ἐπαπέστειλας αὐτοῖς
  choice: 你就把……降到他们身上
  rationale: 表达差遣灾害临到他们的审判语气，比直译“送给他们”更符合此处语境。
- source_word: πλῆθος ἀλόγων ζῴων
  choice: 许多无理性的动物
  rationale: “许多”自然表达πλῆθος；再次译出“无理性的”，保存ἄλογος前后呼应的讽刺效果。
- source_word: εἰς ἐκδίκησιν
  choice: 惩罚他们
  rationale: 在上帝施行对应性审判的语境中，“惩罚”准确自然，同时避免把词义过度限定为出于私怨的复仇。
theological_decisions:
- issue: ἀδικία在智慧文学及偶像崇拜语境中的道德—宗教含义
  choice: 不义
  alternative: 不公；恶行
  rationale: “不义”既保留其神学和道德分量，也不把含义局限于社会公义或泛化为任何错误行为。
- issue: 两处ἄλογος的重复
  choice: 两处均译作“无理性的”
  alternative: 分别译作“无知觉的”和“禽兽般的”
  rationale: 原文有意重复同一词根，构成对应性讽刺：他们敬拜无理性的受造物，便受无理性动物惩治。统一译法保留这一修辞。
- issue: ἐκδίκησις的审判色彩
  choice: 惩罚
  alternative: 报复；伸冤
  rationale: 此处着重对偶像崇拜的司法性报应。“惩罚”既传达审判，又不额外引入私人报复的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以破折号标出解释性从句，使较长的希腊句法在中文中清晰可读；保留第二人称“你”对上帝的直接称呼，以及两处“无理性的”的刻意重复。
