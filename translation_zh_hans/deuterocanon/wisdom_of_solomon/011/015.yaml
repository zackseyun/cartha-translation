  to: 作为对他们不义的愚妄思虑[a]的报应——他们因这些思虑受迷惑，敬拜没有理性的爬行之物和低贱的兽类——你使许多没有理性的动物[c]临到他们，作为惩罚[b]。
  rationale: 修订将ἀντί译为“作为对……的报应”，准确表达其对应性；将末句调整为“作为惩罚”，保留εἰς ἐκδίκησιν的目的／结果功能，而不额外明确直接宾语。措辞也改为较自然的现代书面普通话，并把修辞脚注锚定在第二次重复的关键词上。
