  language: zh_hans
  text: 为斥责那道杀害婴孩的谕令。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：作为对一道杀婴谕令的斥责。
    reason: 保留原文以名词“斥责”和复合形容词“杀婴的”构成的紧凑句法。
lexical_decisions:
- source_word: εἰς
  choice: 为
  rationale: 此处引出目的或作用，且原文是依附上下文的片语；“为”简洁自然，也保留目的与结果之间的语义空间。
- source_word: ἔλεγχον
  choice: 斥责
  rationale: ἔλεγχος可指揭露、驳斥、责备或定罪；在此语境中，“斥责”既表达道德谴责，也不过度限定其具体方式。
- source_word: νηπιοκτόνου
  choice: 杀害婴孩的
  rationale: 该形容词直指“杀婴的、使婴孩被杀的”；展开为关系结构符合现代汉语表达，并保留νήπιος所指年幼婴孩的词义。
- source_word: διατάγματος
  choice: 谕令
  rationale: διατάγμα指具有权威的正式命令；“谕令”适合古代君王颁令的语境，同时普通现代读者仍能理解。
theological_decisions:
- issue: 对埃及杀害希伯来婴孩之命令的历史—神学暗指
  choice: 译为“那道杀害婴孩的谕令”
  alternative: “那道杀婴谕令”或“那道针对婴孩的残杀令”
  rationale: 原文以紧凑的复合形容词修饰“谕令”。所选译法明确保留杀害婴孩的历史暗指，却不补入“埃及”“法老”或“希伯来”等本节未明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“谕令”体现古代权威命令的语域；全句保留原文依附上下文的片语性质。
