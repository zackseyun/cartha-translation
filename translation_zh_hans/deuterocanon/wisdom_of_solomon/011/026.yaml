base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: zh_hans
  text: 然而，爱生命的主宰啊，你顾惜万物，因为万物都属于你。[a] 因为你不朽的灵在万物之中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱生命的”也可译作“爱灵魂的”或“爱众生的”。希腊词φιλόψυχε有这些可能含义；这里因上下文谈到上帝顾惜万物，采用较宽广的译法。
    reason: lexical_alternative
  - marker: b
    text: 有些经文编排把“因为你不朽的灵在万物之中”列为下一章的第1节。
    reason: verse_numbering
lexical_decisions:
- source_word: φείδῃ
  choice: 顾惜
  rationale: 此动词表示怜惜而不加伤害或毁灭。“顾惜”既保留克制、饶恕的含义，也自然表达上帝对受造万物的眷顾。
- source_word: πάντων
  choice: 万物
  rationale: 指受造界的总体；“万物”简洁庄重，也与后文“在万物之中”形成呼应。
- source_word: σά ἐστιν
  choice: 它们都是你的
  rationale: 明确承接前面的“万物”，自然表达希腊文的所属关系。
- source_word: Δέσποτα
  choice: 主宰
  rationale: Δέσποτα强调拥有权和绝对权柄；“主宰”可与通常译作“主”的κύριος保持区别，又符合中文经文语体。
- source_word: φιλόψυχε
  choice: 爱护生命的
  rationale: 该复合词可指爱生命、爱众生或爱灵魂。上下文谈上帝顾惜万物，因此正文采用较宽广的受造界含义，同时用脚注保留较窄的可能解释。
- source_word: ἄφθαρτόν
  choice: 不朽的
  rationale: 表示不腐坏、不灭亡；“不朽”在现代汉语中清楚庄重，并适合修饰上帝的灵。
- source_word: πνεῦμά
  choice: 灵
  rationale: 此处是上帝使万物得以存续的临在，不宜仅译作“气息”；“灵”保留其神学与文学张力。
- source_word: ἐν πᾶσιν
  choice: 在万物之中
  rationale: 保持普世性的受造界范围，并与前句“万物”相互照应；不进一步解释这种“在……之中”的具体方式。
theological_decisions:
- issue: φιλόψυχε所表达的上帝之爱指向什么范围
  choice: 爱护生命的
  alternative: 爱灵魂的；爱众生的
  rationale: 上下文先说上帝顾惜一切属于他的受造物，随后又说他的灵在万物之中，因此正文保留较广的生命与受造界范围；脚注同时呈现“灵魂”这一较窄而较直译的理解。
- issue: 如何翻译Δέσποτα
  choice: 主宰
  alternative: 主；主人
  rationale: “主宰”保留该词所含的所有权与绝对权柄，也避免与κύριος通常对应的“主”完全合并。
- issue: “你的灵在万物之中”的含义
  choice: 按原文直译，不说明其存在方式
  alternative: 你的灵使万物存活；你的气息遍及万物
  rationale: 原文只陈述上帝不朽的灵“在万物之中”，并未界定这是维系、内住或遍在；正文保留这一神学张力，不作教义化阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“顾惜万物”表达上帝克制毁灭并眷顾受造物；“主宰”保留Δέσποτα与κύριος的词义区别。标点将呼语与理由句清楚分开，同时保留原文连续的论证关系。
