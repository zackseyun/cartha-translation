base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/014.yaml
  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: zh_hans
  text: 因为那些人不接待在场的陌生人[a][b]，这些人却奴役外来的恩人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陌生人”直译为“不认识的人”或“他们所不熟悉的人”。
    reason: lexical_alternative
  - marker: b
    text: “在场的”也可译为“当前在此的”。
    reason: lexical_alternative
  - marker: c
    text: “奴役外来的恩人”也可译为“把外来的恩人变成奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ... οὗτοι δὲ
  choice: 前一班人……这一班人却
  rationale: 保留两个群体之间鲜明的对照，同时不把上下文所暗示的具体身份直接写入本节。
- source_word: τοὺς ἀγνοοῦντας
  choice: 素不相识的人
  rationale: 分词字面指不认识或不熟悉的人；此处以自然汉语保留“对他们而言是陌生人”的含义，不径直与后面的 ξένους 合并。
- source_word: οὐκ ἐδέχοντο
  choice: 不接待
  rationale: δέχομαι 可指接受、接纳；在待客语境中，“接待”既贴近原义，也自然表达拒绝收留之意。
- source_word: παρόντας
  choice: 来到他们那里
  rationale: 原义为“在场、来到面前”。汉语如此表达可交代这些陌生人已经到了他们中间，又不添加原文没有的“有需要”等信息。
- source_word: εὐεργέτας
  choice: 曾给他们恩惠的
  rationale: εὐεργέτης 指施恩者或恩人；用关系分句表达，可清楚保留这些外乡人曾施惠于他们的道德反差。
- source_word: ξένους
  choice: 外乡人
  rationale: 此词可指陌生人、外来者或异乡人；在这里修饰“施恩者”，译作“外乡人”可自然表现其外来身份。
- source_word: ἐδουλοῦντο
  choice: 奴役了
  rationale: δουλόω 表示使人成为奴隶、置于奴役之下；“奴役”准确保留其强烈含义。
theological_decisions:
- issue: 两个对照群体的历史身份
  choice: 正文只称“前一班人”和“这一班人”
  alternative: 按上下文直接写成所多玛人和埃及人
  rationale: 希腊文本本节仅用 οἱ μὲν 与 οὗτοι δὲ 对举。具体身份虽可由上下文推知，却不宜在正文中替原文明确指名。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“前一班人……这一班人却”承接上下文并保留原文未明说群体身份的特点；分号突出两种恶待外来者行为之间逐步加重的对比。
