  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/020.yaml
  text: Fire was strong in water beyond its own power[a], and water forgot its extinguishing power;
translation:
  language: zh_hans
  text: 火在水中竟比自身的力量更强盛[a]，水也忘记了自己熄灭火焰的能力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“火在水中仍以自身固有的力量显出强盛。”
    reason: 原文中“自身的力量”这一属格短语与“强盛”之间的句法关系有歧义；可理解为比较关系，也可理解为火仍保持或施展其固有力量。
lexical_decisions:
- source_word: πῦρ
  choice: 火
  rationale: 直译名词，与下半句的“水”构成鲜明对照。
- source_word: ἴσχυεν
  choice: 强过了
  rationale: 该动词表示强盛、占优势或显出力量；结合其后的属格短语，译为“强过了”可体现超越通常能力的比较意味。未完成时所表达的持续状态，在汉语叙事中可由语境自然承载。
- source_word: ἐν ὕδατι
  choice: 在水中
  rationale: 保留空间关系，突出火在本应将其熄灭的水中仍显威力这一反常景象。
- source_word: τῆς ἰδίας δυνάμεως
  choice: 自身的力量
  rationale: ἰδίας指属于火自身的，δύναμις指力量或效能；与ἴσχυεν合读为比较意味，但另有不同句法理解，故加脚注。
- source_word: ὕδωρ
  choice: 水
  rationale: 直译，并与“火”形成对偶。
- source_word: ἐπελανθάνετο
  choice: 忘记了
  rationale: 保留原文拟人化的鲜明表达，不将其平化为“失去了”或“不再发挥”。
- source_word: τῆς σβεστικῆς δυνάμεως
  choice: 自己灭火的能力
  rationale: σβεστική表示熄灭、扑灭火焰的效能；“灭火的能力”比名词化的“熄灭之力”更符合现代汉语，同时准确表达水的正常作用。
theological_decisions:
- issue: 神迹语境中水的拟人化描写
  choice: 保留“水也忘记了”
  alternative: 水失去了灭火的能力；水不再灭火
  rationale: 原文以拟人手法描写受神掌管的受造界反常运行。保留“忘记”可维持其诗性与神学张力，而不额外解释神迹的机制。
- issue: 火的力量与其自身能力之间的关系
  choice: 译作“强过了自身的力量”
  alternative: 仍以自身的力量显威；保持了自身的力量
  rationale: 属格τῆς ἰδίας δυνάμεως可随ἴσχυεν理解为比较或程度关系，形成“超过自身能力”的悖论式表达；但句法存在歧义，故正文保留较强的比较读法，并以脚注列出另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“火—水”“力量—能力”的对偶和“水忘记”的拟人手法；“竟”突出反常情形，但不补入原文未明说的神学解释。
