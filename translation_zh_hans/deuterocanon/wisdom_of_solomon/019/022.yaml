base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/022.yaml
  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: zh_hans
  text: 因为主啊，你在各方面使你的子民尊大，使他们得荣耀；你没有置他们于不顾[a]，无论何时何地，都在他们身旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你没有忽视他们”。原文动词有“忽略、不顾”的意思，后面接“在他们身旁”。
    reason: 说明“置他们于不顾”的词义选择，并保留原文“不忽视”与随后的在旁临在之间的联系。
lexical_decisions:
- source_word: Κατὰ πάντα
  choice: 在各方面
  rationale: κατά加复数宾格在这里表示全面涵盖；“在各方面”自然地保留了这一概括意义。
- source_word: ἐμεγάλυνας
  choice: 使……壮大
  rationale: 该动词意为“使之为大、使之强盛”。“使……壮大”是现代汉语中的自然表达，也保留了上帝使其子民昌盛尊大的含义。
- source_word: τὸν λαόν σου
  choice: 你的子民
  rationale: λαός在七十士译本的语境中常指属于上帝的人民；“你的子民”准确、自然，并保留其群体和归属含义。
- source_word: ἐδόξασας
  choice: 使他们得荣耀
  rationale: 该动词表示赋予荣耀或尊荣；“使他们得荣耀”比单纯译作“尊重他们”更能保留原词的分量。
- source_word: οὐχ ὑπερεῖδες
  choice: 没有置他们于不顾
  rationale: ὑπεροράω可表示忽视、不顾。“置……于不顾”符合现代汉语习惯，也清楚传达上帝并未漠视其子民。
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: 无论何时何地
  rationale: 原文全面涵盖时间和地点；这一汉语成语简洁自然，并准确保留两重范围。
- source_word: παριστάμενος
  choice: 都在他们身旁
  rationale: 分词本义为“站在近旁、在场”，语境中含有陪伴和扶助之意；此译保留空间意象，同时不把援助的具体方式说得过满。
theological_decisions:
- issue: κύριε的直接称呼
  choice: 主啊
  alternative: 主
  rationale: κύριε是对上帝的呼语；汉语用“主啊”自然地标明直接呼唤，并保持庄重语气。
- issue: παριστάμενος的隐含受益对象
  choice: 在他们身旁
  alternative: 在旁边／亲自临在
  rationale: 希腊文没有明说分词的对象，但上下文清楚指向“你的子民”。补出“他们”使汉语明确通顺，并未增加新的神学断言。
- issue: 上帝临在的时间与空间范围
  choice: 无论何时何地，都在他们身旁
  alternative: 在每一个时刻和地方临在
  rationale: 译文保留原文对上帝眷顾之时间和空间范围的全面陈述，同时避免将其扩展为脱离本节对象与语境的抽象教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“主啊”保留祷告式呼语；“壮大”“得荣耀”“置他们于不顾”兼顾清晰度与经文语体。分号呈现前后两组并列的上帝作为；末句调整为自然汉语语序，同时保留原文的时间、地点和在旁临在三项要素。
