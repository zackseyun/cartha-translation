lexical_decisions:
- source_word: παραμυθίαν
  choice: 慰藉
  rationale: 该词表示安慰、宽慰；在此语境中，鹌鹑作为食物缓解了以色列人的困乏。“带来慰藉”既保留其情感色彩，也符合现代汉语表达。
- source_word: ἀνέβη
  choice: 飞来
  rationale: 字面为“上来”。主语是鹌鹑，且其来源为海上，译作“飞来”自然地呈现其移动方式；“从海上”仍保留原文方向信息。
- source_word: ὀρτυγομήτρα
  choice: 鹌鹑
  rationale: 该词在此指鹌鹑；与出埃及旷野传统中的供食之鸟相合，无须采用生僻的具体鸟种名称。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 保留原文第三人称复数所指，不在本节中补明身份。
