base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/016.yaml
  text: But those who had welcomed with festivities those who had already shared in the same rights afflicted them with terrible sufferings[a][b].
translation:
  language: zh_hans
  text: 然而，那些曾以庆典接待他们的人，却使这些已经同享相同权利的人遭受可怕的苦难[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同享相同权利”直译也可作“同享相同的正当之物”或“同享相同的供给”；这里可能是指享有同等的地位、权益或待遇。
    reason: lexical_alternative
  - marker: b
    text: 传世希腊文本在“苦难”前所用的词通常意为“宴席”或“饭食”，因此本句较难解释；正文“可怕的”按上下文译出很可能的意思。
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ ἑορτασμάτων
  choice: 以庆典
  rationale: 保留复数名词所表达的节庆、欢庆氛围，也自然修饰“接待”。
- source_word: εἰσδεξάμενοι
  choice: 曾……接待
  rationale: 该分词指接纳、迎入，语境含有起初友好款待的意味；“接待”比单纯“接受”更合适。
- source_word: τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: 这些已经同享相同权利的人
  rationale: μετέχω表示分享、参与；δικαίων为属格复数，可指合乎正义之事、应有权益或待遇。正文采用符合上下文社会伦理意味的“相同权利”，脚注保留其他可能。
- source_word: δείπνοις
  choice: 可怕的
  rationale: 传世希腊文本通常意为“宴席/饭食”，但在此与πόνοις连用语意和句法均十分困难。正文依上下文表达很可能的意思“可怕的苦难”，同时在脚注明确交代原文读法，避免掩盖文本问题。
- source_word: ἐκάκωσαν
  choice: 使……遭受
  rationale: 该动词意为加害、虐待；与πόνοις搭配时，用使役结构能形成自然中文。
- source_word: πόνοις
  choice: 苦难
  rationale: 该词可指痛苦、劳苦或艰难；“苦难”符合本节所述压迫的严重性，同时不过度限定为体力劳役。
theological_decisions:
- issue: τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων所指为何
  choice: 同享相同权利或应有待遇
  alternative: 同享相同的正当之物；同享相同的供给
  rationale: 上下文谴责埃及人先接纳、后压迫寄居者，社会地位和正当权益的含义最为贴切；但希腊语本身并未把所分享的内容限定得如此明确，因此以脚注保留歧义。
- issue: 如何处理困难读法δείπνοις
  choice: 正文按上下文译出“可怕的苦难”，脚注注明传世文本直译
  alternative: 在宴席上以苦难折磨他们；用饭食使他们受苦
  rationale: δείπνοις通常意为“宴席/饭食”，照字面放入本句十分费解，而且源资料已标为重大不匹配。正文采用最可能的语境意义，脚注则完整保留文本不确定性，不将推定伪装成无争议读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“然而……却……”清楚呈现起初接待与后来加害之间的反差；不在正文擅自补入时间副词“后来”，以尽量贴近现有希腊文结构。
