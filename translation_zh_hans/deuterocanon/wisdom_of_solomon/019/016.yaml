    text: “同享他们所享的同等权益”直译也可作“分享同样正当之物”或“同享同样的供给”；这里可能指享有与接待者相同的地位、权益或待遇。
    reason: lexical_alternative
  - marker: b
    text: 传世希腊文本在动词“使……遭受”之前用的词通常意为“宴席”或“饭食”，使本句的句法和意义较难解释。正文“可怕的”是按上下文对这处困难读法作出的语境性译法。
    reason: textual_variant
  revision_rationale: 修订仅澄清主语、受事与比较关系，并使困难读法的脚注说明在词义和句法位置上更准确。保留“权益”作为正文的可行语境译法，同时以脚注保留“正当之物／供给”等歧义；不把传世文本的δειπνοις伪作无争议的“可怕的”。
