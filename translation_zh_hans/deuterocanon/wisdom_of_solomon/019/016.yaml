review_pass:
  verdict: revise
  source_fidelity: 正文把δείπνοις（通常为“宴席、饭食”）所造成的文本困难转化为“可怕的”，这一点没有词汇根据；而且脚注b虽说明原文有“宴席/饭食”，却没有说明其在句中的位置和问题。应在正文保留“以宴席/饭食”的字面线索，并以脚注说明此处句法和意义困难。
  naturalness: “那些曾以庆典接待他们的人”中的“他们”先行词不明确，随后又说“这些……的人”，指代略显混乱。改为重复“那些人”可使现代汉语更清楚。
  terminology: “同享相同权利”可作为对τῶν αὐτῶν ... δικαίων的一种审慎、语境化理解，但应保留其并非唯一释义的注释。“苦难”可译πόνοις；“可怕的”应删除，因原文未见相应修饰语。
  issues:
  - severity: high
    issue: 将δείπνοις译作“可怕的”
    rationale: δείπνοις通常意为“宴席、饭食”，并不表示“可怕的”。即使承认传世文本难解，正文也不宜以无词汇依据的形容词取代该词。
  - severity: medium
    issue: 人称指代不清
    rationale: “接待他们的人”与“这些已经同享……的人”可被读作不同群体；重复名词可准确呈现分词所指的同一受事。
  - severity: medium
    issue: 脚注b未充分保留困难读法
    rationale: 应明确原文在“遭受苦难”之前有“以宴席/饭食”的读法，且其与全句的句法关系难定，避免读者以为“可怕的”来自希腊文。
  revised_text: 但那些曾以庆典接待已经同享相同权利之人的人，却以宴席使他们遭受苦难[a][b]。
  revised_footnotes:
  - marker: a
    text: “同享相同权利”也可直译为“同享相同的正当之物”；也有人理解为同享相同的供给或待遇。这里可能指享有同等的地位、权益或待遇。
    reason: lexical_alternative
  - marker: b
    text: 传世希腊文本在“使他们遭受苦难”前有一词，通常意为“宴席”或“饭食”。该词在本句中的句法关系和确切意思难以确定；正文保留“以宴席”的字面线索。
    reason: textual_variant
  revision_rationale: 修订删除无原文依据的“可怕的”，并在正文保留δείπνοις的“宴席/饭食”语义。由于该读法在上下文和句法上确实困难，脚注明确说明不确定性，而不以推测性时间或程度副词掩盖它。调整指代，使接待者与受害者的关系在中文中清晰可读。
