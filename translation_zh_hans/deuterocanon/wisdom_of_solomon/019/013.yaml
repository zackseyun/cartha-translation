  rationale: 修订主要纠正前半句的句法重组：正文将雷霆明确保留为惩罚临到的力量/方式，同时脚注说明该高度压缩短语可有的另一种组合，避免将争议关系定死。后半句以“这是公正的”直接反映δικαίως，以“惯行”反映ἐπετήδευσαν，并以“更为严重的仇视陌生人之恶”保留比较级及μισοξενία的强烈道德含义。
