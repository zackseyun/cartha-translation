base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/013.yaml
  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: zh_hans
  text: 惩罚临到那些罪人，并非没有已经发生之事的明证；惩罚是借着雷霆的威力临到的[a]。他们因自己的恶行而受苦，这是公正的；因为他们惯行一种更为严重的仇视陌生人之恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文结构紧凑。“借着雷霆的威力”也可与“明证”相连，译作“在雷霆的威力中，已发生之事的明证”；或可译作“惩罚临到……并非没有已发生之事的明证，借着雷霆的威力”。各译法都保留雷霆、已发生之事的明证与惩罚之间的密切关联。
    reason: 句法歧义与译法选择
  - marker: b
    text: “仇视陌生人”也可译作“仇视外来者”或“不接待客旅”。原词可指对陌生人、外来者或宾客的主动敌视，不只是缺少热情接待。
    reason: 词义范围与强度
lexical_decisions:
- source_word: τιμωρίαι
  choice: 惩罚
  rationale: 指针对恶行施加的刑罚；“惩罚”在现代汉语中清楚自然，也保留经文的审判意味。
- source_word: ἁμαρτωλοῖς
  choice: 那些罪人
  rationale: 将作名词用的形容词直接译出，保留原文对这些人的道德定性。
- source_word: οὐκ ἄνευ τῶν γεγονότων τεκμηρίων
  choice: 使已经发生的事有据可证
  rationale: τεκμήρια 指明证、凭据；采用自然汉语表达其证据意味，同时由脚注说明压缩句法的其他理解。
- source_word: τῇ βίᾳ τῶν κεραυνῶν
  choice: 猛烈的雷霆伴随而来
  rationale: βία 表示强力、猛烈，κεραυνοί 指雷霆或霹雳；此译保留灾难性意象，又避免生硬直译介词关系。
- source_word: δικαίως
  choice: 实属罪有应得
  rationale: 传达其受苦在道义和审判意义上是公正、应得的，比单译“公正地”更符合现代汉语习惯。
- source_word: ἔπασχον
  choice: 受苦
  rationale: 直接表达遭受苦难，不额外限定苦难的具体形式。
- source_word: ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: 因自己的恶行
  rationale: 将复数 πονηρίαι 具体译为“恶行”，并按语境表达其原因或根据。
- source_word: χαλεπωτέραν
  choice: 更为恶劣的
  rationale: 保留比较级，不添加原文没有的“甚至”等强化成分；在此修饰一种严重的道德恶行。
- source_word: μισοξενίαν
  choice: 仇视外乡人之举
  rationale: 该词强于单纯“不好客”，可指对陌生人、外来者或宾客的主动敌视；“外乡人”在此兼顾可懂性与语境范围。
- source_word: ἐπετήδευσαν
  choice: 惯行
  rationale: 表示刻意奉行或习以为常的行为，而非一次性的举动。
theological_decisions:
- issue: μισοξενία 的道德强度
  choice: 仇视外乡人之举
  alternative: 不接待客旅；不好客
  rationale: 原词含“憎恶陌生人或宾客”的主动敌意，且有 χαλεπωτέραν 修饰；较强的译法符合原文语气，又不引入特定教派解释。
- issue: ταῖς ἰδίαις αὐτῶν πονηρίαις 与受苦的关系
  choice: 因自己的恶行而受苦
  alternative: 在自己的恶行中受苦；藉自己的恶行受苦
  rationale: 与 δικαίως 合看，最自然地表达他们因自身恶行而遭受应得后果，同时脚注并无必要将工具性解释排除为纯语法不可能。
- issue: 雷霆、明证与惩罚之间的句法关系
  choice: 猛烈的雷霆伴随惩罚而来，并使已经发生的事有据可证
  alternative: 惩罚借猛烈的雷霆临到，并非没有此前事件的明证
  rationale: 希腊文结构高度压缩，τῇ βίᾳ 可与临到的惩罚或 τεκμηρίων 的证明作用相连；正文采用通顺且不偏离整体意义的理解，脚注保留另一种组合方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罪有应得”传达 δικαίως 的司法与道德色彩；“惯行”保留持续、刻意奉行的意味。正文避免政治化的现代术语“排外”，并以脚注说明“外乡人”也包括陌生人和宾客。
