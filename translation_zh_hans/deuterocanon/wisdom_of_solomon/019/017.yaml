base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: zh_hans
  text: 他们也遭击打而失明[a]，就像从前在那义人门前的那些人一样；当时，那些人被茫茫黑暗笼罩，各人都摸索着，要从自己的门出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里影射《创世记》19:11：聚集在罗得家门口的人被击打而失明，找门口找得疲乏不堪。
    reason: cross_reference
  - marker: b
    text: 这句希腊文直译近于“各人从自己众门的通路出去”，措辞和句法较为生硬；也可理解为各人在黑暗中反复寻找自己门口的通路。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν δὲ καὶ ἀορασίᾳ
  choice: 他们也遭击打而失明
  rationale: 保留被动受击打的力度，同时把工具或结果性的“失明”自然地表达出来；“也”对应 καί，承接上下文。
- source_word: ὥσπερ ἐκεῖνοι
  choice: 就像从前……的那些人一样
  rationale: 保留指向先前经文事件的比较关系；加入“从前”只为使中文的回指清楚，并未把人物姓名写入正文。
- source_word: ἐπὶ ταῖς τοῦ δικαίου θύραις
  choice: 在那义人门前
  rationale: τοῦ δικαίου 仍译作称谓“义人”，不直接增补“罗得”；θύραι 在房屋入口语境中用中文集合性表达“门前”。
- source_word: ἀχανεῖ περιβληθέντες σκότει
  choice: 被茫茫黑暗笼罩
  rationale: “茫茫”传达 ἀχανής 所含的广大、无边之感，“笼罩”准确体现 περιβληθέντες 的环绕意象。
- source_word: ἕκαστος τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  choice: 各人都摸索着，要从自家的门出去
  rationale: 原句搭配生硬；ἐξῄει 通常表示“出去”，δίοδος 表示通路，τῶν αὐτοῦ θυρῶν 指各人自己的门或门口。结合失明和黑暗的场景，以“摸索着，要……出去”表达未能顺利辨明通路的持续行动，同时用脚注说明原文结构的含混。
theological_decisions:
- issue: “义人”的身份
  choice: 正文保留“那义人”，脚注指出创世记第19章的对应事件
  alternative: 在正文中直接译为“罗得”
  rationale: 希腊文使用 τοῦ δικαίου，并未出现罗得的名字；保留称谓可避免把解释直接写入正文。
- issue: 末句所描述的是寻找入口还是寻找出去的通路
  choice: 译作“摸索着，要从自家的门出去”
  alternative: 译作“不断寻找自家门的入口”
  rationale: 现有希腊文本的 ἐξῄει 更直接指“出去”，但整句句法不够顺畅，且与《创世记》19:11“寻找门口”的典故存在张力。正文优先保留本节现有词形所指的出去动作，脚注交代异样，不静默消解张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遭击打而失明”保留原文力度；“茫茫黑暗”传达广大且压迫性的景象。末句以自然中文呈现，同时用脚注保留希腊文本本身的生硬和可能的另一种理解。
