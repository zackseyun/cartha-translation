base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/009.yaml
  text: For they grazed like horses[a], and skipped about like lambs, praising you, Lord[b], the one who delivered them.
translation:
  language: zh_hans
  text: 因为他们像马一样吃草[a]，像羊羔一样欢跳，赞美你，主啊；你是救他们的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像马一样在草场上得喂养”。希腊文动词描绘牲畜在牧场取食，也可含被放牧、得喂养之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεμήθησαν
  choice: 吃草
  rationale: 该动词在这里描绘牲畜在牧场取食；“吃草”具体、自然地保留了比喻，也不把动作抽象化为单纯“得喂养”。
- source_word: διεσκίρτησαν
  choice: 欢跳
  rationale: 该词表示活泼地跳跃；“欢跳”既传达羊羔跳跃的动作，也符合全句喜乐赞美的语境。
- source_word: ἀμνοί
  choice: 羊羔
  rationale: 这是该词的通常意义，并保留幼小羊只活泼跳跃的形象。
- source_word: αἰνοῦντές
  choice: 赞美
  rationale: 现在分词表示伴随动作；“赞美”是现代汉语中直接、庄重而自然的对应。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格，在这里是对上帝的直接称呼；译作“主啊”保留呼语形式。
- source_word: τὸν ῥυόμενον αὐτούς
  choice: 那救他们脱险的你
  rationale: 定冠词加现在分词指向施行拯救者；“救……脱险”体现ῥύομαι使人脱离危难的含义，并用“你”明确其与前面第二人称呼语同指。
theological_decisions:
- issue: κύριος用于对上帝的直接称呼
  choice: 主啊
  alternative: 主人啊
  rationale: 上下文是以色列民向上帝发出的赞美；“主啊”是自然、庄重且不额外引入宗派解释的译法。
- issue: τὸν ῥυόμενον的时态与身份表达
  choice: 那救他们脱险的你
  alternative: 正在救他们的你
  rationale: 希腊文现在分词可刻画上帝作为拯救者的行动或身份，并不必然限定为正在发生的动作；中文不强行加入“正在”，以保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号承接希腊文分词所表达的伴随赞美，并重复“赞美”以避免“主啊，那救他们脱险的你”在中文里生硬或指代不清。
