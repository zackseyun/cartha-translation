  text: For land animals were changed into creatures of the water[a], and swimming creatures moved onto the land.
translation:
  language: zh_hans
  text: 因为陆地上的生物变成了水中的生物[a]，会游水的生物也转移到陆地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为陆地生物转变成了水生生物，会游水的生物也迁到陆地上。”
    reason: 词汇与表达方式的另一种可能译法；以“转变”和“迁到”分别呈现μετεβάλλετο与μετέβαινεν所表达的变化及地点转换。
lexical_decisions:
- source_word: χερσαῖα
  choice: 陆地上的生物
  rationale: 该名词化形容词指属于旱地的事物或生物；这里与水域生物对举，译为“陆地上的生物”自然且不限定具体类别。
- source_word: ἔνυδρα
  choice: 水中的生物
  rationale: 该词指在水中或属于水域的生物；“水中的生物”清楚保留栖息领域的对比。
- source_word: μετεβάλλετο
  choice: 变成了
  rationale: 未完成时中被动态表达正在经历改变；“变成了”保留变化结果，却不进一步断定其机制。
- source_word: νηκτά
  choice: 会游水的生物
  rationale: 名词化形容词指具有游泳特征的生物；此译保留其描述性，并与前半句的“生物”平行。
- source_word: μετέβαινεν
  choice: 转移到
  rationale: 该动词表示越过、迁往或从一个领域转到另一个领域；“转移到”体现领域转换而不额外解释方式。
- source_word: γῆς
  choice: 陆地上
  rationale: 在与水域明确对照的语境中，γῆ 指陆地；方位表达“陆地上”符合现代汉语。
theological_decisions:
- issue: 受造生物变化的性质
  choice: 按经文呈现生物类别或栖息领域的反转，不说明变化机制
  alternative: 将其明确解释为物种的字面变形，或仅解释为反常行为的现象性描述
  rationale: 希腊文说陆地生物变为水中生物，而会游水的生物转到陆地；译文保留这种意象及其张力，不加入经文本身未说明的自然机制或寓意解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上文的 γάρ；两分句保持平行。“生物”比“动物”更贴近希腊文名词化形容词的开放范围，并避免过度限定。
