base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/004.yaml
  text: For a deserved necessity dragged them to this end[a], and cast forgetfulness of what had happened upon them[b], so that they might beforehand complete the punishment lacking in their torments.
translation:
  language: zh_hans
  text: 因为一种应得的必然性把他们拖到这样的结局[a]，又使他们忘记已经发生的事，为要让他们预先补足那在他们所受苦难中尚未完成的刑罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所应得的必然性”或“相称的必然性”。希腊文把“应得、相称”与“必然、强制”结合在一起。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“剩下的刑罚”，即他们先前所受的苦难尚未完成的刑罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷλκεν
  choice: 拖向
  rationale: 表达强制牵引而非温和带领，符合上下文中他们被迫走向结局的意味。
- source_word: ἡ ἀξία ... ἀνάγκη
  choice: 一种他们罪有应得的必然力量
  rationale: 同时保留ἀξία所含的应得、相称之意，以及ἀνάγκη所含的必然性和强制力；用“力量”使拟人化的施动关系在现代汉语中清楚可懂。
- source_word: ἐπὶ τοῦτο πέρας
  choice: 向这样的结局
  rationale: πέρας在此指事件最终到达的终点或结果；“结局”自然地传达这一语境意义。
- source_word: τῶν συμβεβηκότων
  choice: 已经发生的事
  rationale: 忠实表达完成时分词所指的先前事件，同时保持简明自然。
- source_word: ἀμνηστίαν ἐνέβαλεν
  choice: 使他们忘记了
  rationale: 以自然现代汉语表达“把遗忘加在他们身上”的希腊语意象，并保留同一拟人化主语的作用。
- source_word: προαναπληρώσωσιν
  choice: 预先补足
  rationale: 兼顾复合动词中“预先”与“补满、完成”两层意义。
- source_word: τὴν λείπουσαν ... κόλασιν
  choice: 尚缺的惩罚
  rationale: 保留λείπουσαν所表达的尚未补足、仍有欠缺之意，避免直接改写为已明确界定的时间顺序。
- source_word: ταῖς βασάνοις
  choice: 在所受苦刑中
  rationale: βάσανοι在惩罚语境中指剧烈痛苦或苦刑；此译法保留其严厉程度而不限定为人为刑讯。
theological_decisions:
- issue: 驱使他们并使他们遗忘的施动者
  choice: 让“他们罪有应得的必然力量”充当句中施动者，不明确补出上帝。
  alternative: 将上帝明确译作驱使他们、使他们遗忘的主体。
  rationale: 希腊文以拟人化的ἀνάγκη为语法主语，并未直接点明上帝；译文保留神意、报应与人的罪责之间未被明说的张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“罪有应得的必然力量”略带非常规搭配，是为保留原文把道德上的应得与不可抗拒的必然性结合起来的张力；全句不补出未明说的神圣施动者。
