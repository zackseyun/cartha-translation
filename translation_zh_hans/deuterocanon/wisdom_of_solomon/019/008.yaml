  text: through which those sheltered by your hand passed[a], the whole nation[b], having seen marvelous wonders.
translation:
  language: zh_hans
  text: 蒙你手遮护的全民族，在看见令人惊叹的奇事之后，都从那里经过。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人惊叹的奇事”也可译作“奇妙的异兆”。原文两个词连用，强调非凡而超常的现象。
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ οὗ
  choice: 从那里走过
  rationale: 关系代词承接上文所述的通道；διά加属格在此表示经过的路径。汉语用“从那里走过”自然地保留这一指向，而不把它解释为某个人。
- source_word: πανεθνεὶ
  choice: 全民族都
  rationale: 这是副词，强调他们作为一个完整民族共同经过，而非仅指许多个体；“全民族都”简洁保留其群体性。
- source_word: διῆλθον
  choice: 走过
  rationale: 该动词表示穿行、经过；结合“从那里”，译作“走过”既自然，也避免额外加入“渡海”等上下文推断。
- source_word: οἱ τῇ σῇ σκεπαζόμενοι χειρί
  choice: 蒙你手遮护的人
  rationale: σκεπάζω含遮盖、庇护之意；“遮护”兼顾具体的覆盖意象和保护含义，并保留“你的手”这一拟人化的神圣保护图景。
- source_word: θεωρήσαντες
  choice: 亲眼看见了
  rationale: 分词表示他们观看、目睹；“亲眼看见”传达直接见证的意味。希腊语在此并未明确要求译成严格先于主句动作的时间从句，因此不强加“之后”。
- source_word: θαυμάσια τέρατα
  choice: 令人惊叹的奇事
  rationale: θαυμάσια表达令人惊异，τέρατα指超常的奇事或异兆；此译避免汉语中生硬的同义叠加，同时保留非凡、超自然的色彩。
theological_decisions:
- issue: “你的手”所表达的神圣保护意象
  choice: 保留“你手遮护”的具体形象
  alternative: 译为“蒙你保护的人”
  rationale: 原文明确使用“手”的形象来表达上帝主动的遮盖和保护；保留这一表达可维持经文的神学质感，不将其抽象化。
- issue: θεωρήσαντες与主句动作的时间关系
  choice: 用并列式“亲眼看见了”保留开放关系
  alternative: 译为“在亲眼看见……之后”
  rationale: 不定过去时分词可按语境表达伴随或先行动作；本节自身没有充分依据要求严格的先后解释，因此不在正文中将其限定为“之后”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙……遮护”保留经文语体但不过分古奥；语序先提出受保护的群体，再以“全民族都”突出集体经过。
