base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/015.yaml
  text: And not only that[a], but there will be an inspection of them, because they received the foreigners with hostility.
translation:
  language: zh_hans
  text: 不但如此，他们还要受到查察[a]，因为他们怀着敌意接待外来人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查察”也可译作“临到”或“眷顾”；希腊文在这里可指上帝临到他们、施行审判性的追究。
    reason: 说明ἐπισκοπή兼有察看与临到的含义；本句语境暗示审判，但正文不将其直接限定为惩罚。
lexical_decisions:
- source_word: οὐ μόνον
  choice: 不但如此
  rationale: 承接上文并引出进一步的指控；补出“如此”符合现代汉语表达，而不改变原句逻辑。
- source_word: ἐπισκοπή
  choice: 察访
  rationale: 该词可指查看、鉴察或临到，在审判语境中常含上帝前来追究之意。“察访”保留其核心意义及审判色彩，又不直接把含义收窄为“惩罚”。
- source_word: ἀπεχθῶς
  choice: 以敌意
  rationale: 准确表达带着憎恶、排斥态度行事的方式，现代汉语自然清楚。
- source_word: προσεδέχοντο
  choice: 接待
  rationale: 原词表示接纳或接待；与“以敌意”连用，保留了他们虽让对方进入、却态度恶劣的张力。
- source_word: τοὺς ἀλλοτρίους
  choice: 外来的人
  rationale: 指不属于本族群的人。“外来的人”比“异族人”较少加入族裔限定，也比“陌生人”更能体现群体归属上的外部身份。
theological_decisions:
- issue: ἐπισκοπή在审判语境中的含义
  choice: 他们还必受察访
  alternative: 他们还必遭到惩罚／上帝还必临到他们施行审判
  rationale: 上下文暗示这是带有审判性质的察访，但本句并未明说“惩罚”，也没有在此处明确说出施事者是上帝。因此正文保留原词的多义性，并以脚注说明其审判含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必受察访”略带经文语体，适合表达将来的审判性临到；全句保留原文因果关系和神学张力。
