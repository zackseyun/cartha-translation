base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/001.yaml
  text: But for the ungodly, merciless wrath came upon them to the very end; for he knew beforehand both them and what was going to happen,
translation:
  language: zh_hans
  text: 但毫不留情的忿怒临到不敬神的人[a]，直到最后；因为他[b]预先知道他们，也知道将要发生的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬神的人”也可译作“不虔敬的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“预先知道”的主语；按上下文，“他”最自然地指神。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβέσιν
  choice: 不敬神的人
  rationale: 该词首先指对神缺乏敬畏、表现出不虔不义的人；“不敬神的人”保留其宗教与道德色彩，又比单泛指道德败坏的“恶人”更贴近原义。
- source_word: μέχρι τέλους
  choice: 直到最后
  rationale: 保留短语的时间延续意义及其强调作用，不将其改释为单纯表示程度的“彻底”。
- source_word: ἀνελεήμων θυμός
  choice: 毫不留情的震怒
  rationale: ἀνελεήμων表示不施怜悯，θυμός在审判语境中表示强烈的怒气；合译既自然，也保留严厉的审判色彩。
- source_word: ἐπέστη
  choice: 临到
  rationale: ἐφίστημι在此表示突然来到、加在某人身上；“临到”符合庄重叙事语体，并自然承接前置的与格对象。
- source_word: προῄδει
  choice: 预先知道
  rationale: 直陈在事情发生以前已经知道，避免使用可能带有特定系统神学含义的专门术语。
- source_word: αὐτῶν καὶ τὰ μέλλοντα
  choice: 他们将来的事
  rationale: 将αὐτῶν理解为与τὰ μέλλοντα相联，指关乎他们、尚未发生之事；此译保留“将来的事”的宽度，不武断限定为他们的行为或遭遇。
theological_decisions:
- issue: προῄδει的省略主语
  choice: 译为“他”，并加注说明按上下文最自然地指神
  alternative: 直接补译为“神”
  rationale: 希腊文动词包含第三人称单数主语，但本句未明说名词；用“他”既满足现代汉语表达，也不把上下文推定直接写进正文。
- issue: αὐτῶν与τὰ μέλλοντα的关系
  choice: 译为“他们将来的事”
  alternative: “他预先知道他们，也知道将要发生的事”或“他预先知道他们将要做的事”
  rationale: 原文更自然地容许αὐτῶν修饰τὰ μέλλοντα，指他们未来相关之事；正文不限定为行为，以保存原文语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“毫不留情的震怒”保留原文审判语气；分号对应希腊文解释性连接γάρ，使后半句作为前半句的理由。
