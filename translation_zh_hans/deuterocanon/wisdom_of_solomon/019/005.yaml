  text: and your people experienced a marvelous journey[b][a], but they found a strange death.
translation:
  language: zh_hans
  text: 你的子民经历了一段非同寻常的旅程[a]，而那些人却遭遇了离奇的死亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走过了一段令人惊叹的路程。”这里的动词也可表达亲身承受或体验，并非只是尝试。
    reason: 说明πειράσῃ的语义范围，并提供παράδοξον ὁδοιπορίαν的自然替代译法。
  - marker: b
    text: 或译：“遇见了陌生的死亡。”
    reason: 保留ξένον较为直译的“陌生、异样”含义，以及εὕρωσι“遇见”的表达。
lexical_decisions:
- source_word: λαός σου
  choice: 你的子民
  rationale: λαός指一个群体，与第二人称所有格连用时自然指上帝的子民；“子民”在现代中文中庄重而清楚。
- source_word: παράδοξον
  choice: 非同寻常的
  rationale: 该词表示出乎意料、令人惊异；“非同寻常”既保留其反常、惊奇之意，也适合此处正面的奇妙旅程。
- source_word: ὁδοιπορίαν
  choice: 旅程
  rationale: 指行旅或旅行过程；“旅程”自然，并能涵盖过海及旷野行进的语境。
- source_word: πειράσῃ
  choice: 经历了
  rationale: πειράω可指尝试、试验，也可指亲身经历；此处以“旅程”为宾语，译作“经历了”避免误解为仅仅尝试启程。
- source_word: ἐκεῖνοι
  choice: 那些人
  rationale: 指示代词与“你的子民”形成鲜明对照；“那些人”保留指示性，不额外加入性别信息。
- source_word: ξένον
  choice: 离奇的
  rationale: ξένος可表示陌生、异乎寻常；修饰“死亡”时，“离奇”保留其异常而不祥的意味，并与前句的正面惊异形成区别。
- source_word: εὕρωσι
  choice: 遭遇了
  rationale: εὑρίσκω在此可作“遇见、碰上”理解；中文谈及死亡时“遭遇”比直译“找到”更自然。
- source_word: θάνατον
  choice: 死亡
  rationale: 采用该词通常、直接的含义，不泛化为“毁灭”。
theological_decisions:
- issue: 上帝子民与敌对者之间的对照
  choice: 译成“你的子民……而那些人却……”，突出经文的鲜明对照。
  alternative: 将ἐκεῖνοι弱化为普通的“他们”，或把两处形容词都译成“奇异”。
  rationale: 希腊文以ὁ μὲν…ἐκεῖνοι δὲ构成对举，并用παράδοξον和ξένον两个不同形容词分别描述旅程与死亡；译文保留结构和褒贬张力，不把两词强行合并。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“非同寻常”与“离奇”分别承载παράδοξον和ξένον，保留原文词汇差异及正面奇妙与不祥异常之间的张力。所有脚注标记均置于相关短语之后。
