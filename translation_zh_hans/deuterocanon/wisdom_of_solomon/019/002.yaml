base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/002.yaml
  text: because after they themselves[a] had turned back from letting them go, and had sent them on with urgency, they would pursue them[b], having changed their minds.
translation:
  language: zh_hans
  text: 因为他们自己曾在让他们离去这件事上反悔[a]，又急切地送他们上路；后来改变了心意[b]，便要追赶他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在让他们离去这件事上反悔”直译可作“从让他们离去这件事上回转”。希腊原句关系较为凝缩，也可理解为“在让他们离去之后返回”。
    reason: lexical_alternative
  - marker: b
    text: “改变了心意”也可译作“后悔了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: 回转了
  rationale: 该词表示转回、转向或改变原先的做法。译作“回转了”保留方向逆转的意象，也不把这里较难确定的具体转变过度解释为单一含义。
- source_word: τοῦ ἀπεῖναι
  choice: 在放那些人离去这件事上
  rationale: 结合出埃及的叙事语境，这个带冠词的不定式指向那些人的离去；中文用“在……这件事上”承接ἐπιστρέψαντες，同时保留原句结构所带来的张力。
- source_word: μετὰ σπουδῆς
  choice: 急切地
  rationale: σπουδή兼有急迫、热切和迅速之意；“急切地”能自然涵盖其态度与速度。
- source_word: προπέμψαντες
  choice: 送他们上路
  rationale: 该动词可指送行、送往前方或伴送启程；“送他们上路”保留行程方向，不强行加入陪同的含义。
- source_word: διώξουσιν
  choice: 便要追赶他们
  rationale: 此处是埃及人实际追赶离去者的叙事，译作“追赶”直接而自然；“要”体现希腊文将来时在叙事预述中的作用。
- source_word: μεταμεληθέντες
  choice: 改变了心意
  rationale: 该词表示事后懊悔而改变决定；“改变了心意”避免赋予“悔改”可能带有的特定神学含义。
theological_decisions:
- issue: 叙事主体与代词所指
  choice: 保留“他们自己”为行动主体，并以“那些人／他们”指被送走和被追赶的人
  alternative: 直接补明“埃及人”和“以色列人”
  rationale: 上下文足以确定双方，但希腊文本身使用代词。保留代词既使中文可懂，也避免在本节正文中加入原文未明说的专名。
- issue: 两次转变之间的叙事张力
  choice: 分别译作“回转了”和“改变了心意”，不替原文消除其先送行、后追赶之间的张力
  alternative: 把前者明确解释为“决定让他们离去”或“反悔不让他们离去”
  rationale: ἐπιστρέψαντες τοῦ ἀπεῖναι的关系较为凝缩，且与随后“送他们上路”并列。正文采用较开放的表达，并用脚注列出主要理解，以免暗中裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“送他们上路”“追赶他们”属于普通读者易懂的叙事表达；以分号划分先前行动和后来追赶，使希腊文分词链条在中文中清晰，同时保留原句的因果关系与语义张力。
