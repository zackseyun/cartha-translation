base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: zh_hans
  text: 因为他们手中还拿着哀悼之物[a]，仍在死者的坟墓旁哀哭，却又打起另一个愚昧的主意[b]；他们曾苦苦恳求并催促离开的那些人，如今竟被他们当作逃亡者追赶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“手中还拿着哀悼”。这是一个鲜明的说法，可能指他们仍在进行哀悼礼仪，或手中仍持有表示哀伤的物品。
    reason: cultural_note
  - marker: b
    text: 也可译作“另一个愚妄的计划”或“另一个愚昧的谋算”。
    reason: lexical_alternative
  - marker: c
    text: 他们先前苦苦恳求并催促这些人离开，后来却又把同一群人当作逃亡者追赶。
    reason: contextual_clarification
lexical_decisions:
- source_word: ἔτι
  choice: 还；仍
  rationale: 表示哀悼和哀哭尚在持续，并与随后改变主意的行动形成时间上的重叠。
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: 手中还带着哀悼之物
  rationale: 保留原文“在手中”的具体意象，同时用“哀悼之物”提示可能指哀悼仪式所用之物或悲恸的外在标志，不把含义限定得过死。
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: 仍在死者的坟墓旁哀哭
  rationale: προσοδύρομαι表达对着或临近某对象悲号；“在……旁哀哭”符合现代汉语，也保留持续而可闻的悲恸。
- source_word: ἕτερον ἐπεσπάσαντο λογισμὸν ἀνοίας
  choice: 却又采取了一个愚昧的念头
  rationale: λογισμός可指念头、谋算或计划；“念头”保留其思虑层面，“采取”反映ἐπεσπάσαντο所含的接受、揽取并付诸行动之意。
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: 他们曾苦苦哀求那些人离去
  rationale: 同时表达ἱκετεύοντες的恳求和ἐξέβαλον使人出去、赶出去的结果；汉语中这样处理比“以哀求赶出”自然，并避免误解为一面暴力驱逐一面求情。
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: 如今竟把他们当作逃亡者追赶
  rationale: “当作逃亡者”准确保留ὡς φυγάδας的讽刺意味；“竟”突出前后行为的强烈反转，却未增添原文之外的事件细节。
theological_decisions:
- issue: 埃及人对以色列人态度逆转所形成的历史—神学讽刺
  choice: 直接呈现“先哀求离去、后当作逃亡者追赶”的对照
  alternative: 明说这是灾祸之后埃及人催促以色列离开，继而在海边追赶他们
  rationale: 希腊文本本身已借ἱκετεύοντες…ἐξέβαλον与ὡς φυγάδας ἐδίωκον表达反转；译文不补入本节未明说的《出埃及记》情节。
- issue: “哀悼在手中”所指为何
  choice: 正文保留具体意象，并以脚注说明可能涉及哀悼礼仪或标志
  alternative: 径译为“仍忙于服丧”或明确译成“手里还拿着丧礼用品”
  rationale: 原文意象鲜明，但具体所指并不完全确定；避免将其单一定义为某种特定礼仪物件。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“因为……却又……”承接上文因果并突出荒谬反转；不使用过度古雅的“恳求逐出”“亡命者”等表达。所有脚注标记均在正文中出现。
