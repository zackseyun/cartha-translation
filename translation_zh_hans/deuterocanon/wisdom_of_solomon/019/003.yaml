  to: 因为他们手中还拿着哀悼之物[a]，仍在死者的坟墓旁哀哭，却又打起另一个愚昧的主意[b]；他们曾苦苦恳求并催促离开的那些人，如今竟被他们当作逃亡者追赶[c]。
