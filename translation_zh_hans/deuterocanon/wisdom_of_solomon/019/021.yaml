base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: zh_hans
  text: 火焰反而[a]没有使那些易受毁坏、在其中行走的生物的肉身枯萎，也没有融化那易融、晶体般的神馔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “反而”也可译作“相反地”或“反常地”；希腊语副词强调火焰的作用与通常所预期的恰好相反。
    reason: lexical_alternative
  - marker: b
    text: “晶体般的”也可理解为“冰一般的”或“结晶状的”，形容这种奇妙食物的外观或质地。“神馔”指如神明所享的食物；也可译作“不朽的食物”或“天上的食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  choice: 火焰
  rationale: 复数名词指叙事中的火焰现象；汉语通常不必标出复数。
- source_word: ἀνάπαλιν
  choice: 反而
  rationale: 表示与通常结果相反的情形，也承接上下文的反常对照；“反而”自然简洁。
- source_word: εὐφθάρτων ζῴων
  choice: 容易毁坏的生物
  rationale: 保留εὐφθάρτων所表达的易受毁坏、易朽坏之意，并以“生物”避免把ζῴων过度限定为某类动物。
- source_word: οὐκ ἐμάραναν
  choice: 没有……枯萎
  rationale: μαραίνω本义为使枯萎、萎缩；保留原文刻意使用的反常措辞，不泛化为“烧毁”。
- source_word: σάρκας
  choice: 肉体
  rationale: 指生物可受损坏的肉身；“肉体”在此比单用“肉”更庄重清楚。
- source_word: ἐμπεριπατούντων
  choice: 行走在其中
  rationale: 现在分词描写这些生物在火焰之中走动；“其中”自然回指火焰，同时不额外扩写场景。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 连接第二个并列否定句，符合现代汉语表达。
- source_word: τηκτὸν εὔτηκτον
  choice: 融化那易融的
  rationale: 原文以同一词根形成“融化—易融”的强调效果；汉语用重复的“融”尽量再现这一修辞。
- source_word: κρυσταλλοειδὲς
  choice: 晶体般的
  rationale: 保留其外观或质地像晶体的形象，同时不武断限定为冰。
- source_word: γένος
  choice: 食物
  rationale: γένος在此构成对食物种类或形态的描述；汉语若直译“种类”会显得累赘，故融入中心语。
- source_word: ἀμβροσίας τροφῆς
  choice: 神仙食物
  rationale: ἀμβρόσιος带有希腊文学中神明所享、不受死亡辖制之食物的色彩；“神仙食物”在现代汉语中较易理解，又保留其文学意象，而不直接赋予后来的教义含义。
theological_decisions:
- issue: 如何翻译神奇食物的意象而不引入后来的特定教义解释
  choice: 神仙食物
  alternative: 天上的食物；不死的食物
  rationale: 本节以诗性语言描绘类似吗哪的奇妙食物。“神仙食物”保留ἀμβρόσιος的希腊文学色彩；脚注同时说明其他可能理解，不把它限定为某一教义象征。
- issue: 是否明确生物是在火焰里面行走
  choice: 行走在其中
  alternative: 在它们中间行走；在火焰中走动
  rationale: 分词ἐμπεριπατούντων很可能描写生物在火焰之中活动。“其中”保留这一鲜明图景，也避免重复“火焰”。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。“枯萎”和“融化那易融的”刻意保留希腊文不寻常的措辞与词根重复；“神仙食物”保留希腊化文学意象，并以脚注呈现语义范围。
