base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: zh_hans
  text: 因为各种元素彼此重新调配，正如弦琴上随节奏发出的乐音改变了名称，却始终存留在声响之中；从所发生的事中，便可准确看出这一点[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的音乐比喻十分凝缩，也可译作：“弦琴中有节奏的乐音改变了名称。”其中“名称”是原文的直译，所指的具体音乐现象并不完全明确；末句说明，这个比喻是根据前文所述事件中可观察的现象得出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: στοιχεῖα
  choice: 各种元素
  rationale: 本章语境描述出埃及事件中受造界的变化；“元素”既保留希腊词的基本含义，也避免把它解释为具位格的宇宙势力。
- source_word: διʼ ἑαυτῶν … μεθαρμοζόμενα
  choice: 彼此重新调配
  rationale: μεθαρμόζω含有重新调整、重新配合之意，并与随后乐器的比喻呼应；“彼此”表达διʼ ἑαυτῶν所指元素之间的相互变换。
- source_word: ψαλτηρίῳ
  choice: 弦琴
  rationale: 指拨奏的弦乐器；“弦琴”在现代汉语中具体而易懂，又不武断认定其精确形制。
- source_word: φθόγγοι
  choice: 音符
  rationale: 在乐器比喻中指有区别的乐音；“音符”比泛称“声音”更能呈现音乐秩序。
- source_word: τοῦ ῥυθμοῦ
  choice: 节奏的
  rationale: 直译ῥυθμός，并保留其可能兼指有节律的音乐结构或曲调安排的语义幅度。
- source_word: τὸ ὄνομα διαλλάσσουσιν
  choice: 改变了……名称
  rationale: 保留ὄνομα“名称”的醒目而压缩的表达，不将其顺解为“性质”或“形态”。
- source_word: πάντοτε μένοντα ἤχῳ
  choice: 却始终存留在声响之中
  rationale: 这是一处语法和意义都较凝缩的短语；译文保留变化与声响持续共存的张力，不进一步解释其音乐学含义。
- source_word: ὅπερ ἐστὶν εἰκάσαι … ἀκριβῶς
  choice: 这一点……便可准确推知
  rationale: εἰκάσαι可指推测、判断或由迹象推知；结合ἀκριβῶς，译作“准确推知”符合论述语气。
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: 从所发生之事的景象
  rationale: 兼顾ὄψις的视觉性与γεγονότα所指已经发生的事件；脚注补充更自然的理解。
theological_decisions:
- issue: 元素变化的音乐比喻是否指向特定宇宙论
  choice: 按上下文译作受造界各种元素的重新调配
  alternative: 将στοιχεῖα理解为具位格的元素势力或抽象宇宙本原
  rationale: 上下文着眼于出埃及事件中可观察的自然变化；译文不引入后期哲学体系，同时保留“元素”一词本身的开放性。
- issue: 音乐比喻中变化与持续的关系
  choice: 保留“名称改变”与“声响存留”的并置
  alternative: 解释为旋律虽变化、音乐本质却不变
  rationale: 原文表述高度凝缩，未明确说明究竟什么在本质上不变；直陈两方面可避免替作者消解张力。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“重新调配”与音乐比喻相呼应；对“节奏的名称”和“存留在声响之中”等原文难句保持适度直译，并以脚注标明歧义。
