  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/011.yaml
  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: zh_hans
  text: 后来，他们又看见有新的飞鸟出现[a]；那时，他们受欲望驱使，求取奢华的美食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有新的飞鸟出现”也可译作“有新一代飞鸟产生了”；较不可能的理解是“出现了一种新的飞鸟”。希腊语 νέαν γένεσιν ὀρνέων 可侧重飞鸟新近产生或出现。
    reason: lexical_alternative
  - marker: b
    text: 指他们所求的不是仅为果腹的食物，而是奢华享用的美食。可参看《出埃及记》16章和《民数记》11章所记旷野中贪求食物的事。
    reason: cross_reference
lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  choice: 后来
  rationale: 表示叙事进程中较后的阶段；“后来”简洁自然。
- source_word: εἶδον
  choice: 他们看见
  rationale: 直接对应ὁράω的简单过去时，保留亲眼见到的叙事意味。
- source_word: νέαν γένεσιν ὀρνέων
  choice: 飞鸟重新出现
  rationale: γένεσις在此可指产生、发生或出现；结合旷野中鹌鹑来到的背景，“重新出现”在现代汉语中自然，同时不把ὀρνέων限缩为某一鸟种。其可能带有“新一代／新一种”的歧义置于脚注。
- source_word: ὅτε
  choice: 那时
  rationale: 引出飞鸟出现时的相关情形，比机械直译为“当……时”更顺畅。
- source_word: ἐπιθυμίᾳ
  choice: 欲望
  rationale: 此词在语境中带有强烈贪求之意；“欲望”保留评价色彩，又不引入性方面的联想。
- source_word: προαχθέντες
  choice: 受……驱使
  rationale: 被动分词表达被欲望推动、引领；“驱使”准确传达其力度。
- source_word: ᾐτήσαντο
  choice: 求取
  rationale: 表达为自己请求得到，语气不夸张为“强求”或“索要”。
- source_word: ἐδέσματα τρυφῆς
  choice: 奢享的美食
  rationale: ἐδέσματα指食物、佳肴，τρυφή指奢华、逸乐或纵情享受；合译为“奢享的美食”，兼顾食物的精美及为享乐而求的意味。
theological_decisions:
- issue: 对旷野中求食行为的道德刻画
  choice: 以“受欲望驱使”和“奢享”呈现过度贪求及纵情享乐的意味
  alternative: 较中性地译作“因想吃而求食物”，或更强烈地译作“被贪欲控制，索求奢侈品”
  rationale: ἐπιθυμία与τρυφή本身带有评价色彩，但经文并未使用最强烈的定罪措辞；本译既保留批评意味，也不超出希腊文本。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“飞鸟”保留ὀρνέων的宽泛所指，不在正文中直接指定为鹌鹑；分号呈现前后事件与动机的紧密关系。所有脚注标记均已置入正文。
