revisions:
- from: 人们看见那遮蔽营地的云，也看见干地从原先存在的水中显露出来，红海[a]中有一条畅通无阻的道路，汹涌的波涛中有一片长满青草的平原。
  to: 那为营地遮荫的云被看见；干地从先前停立的水中显现出来；红海[a]中显现出一条畅通无阻的道路，汹涌的波涛中显现出一片长满青草的平原。
  rationale: 修订恢复“先前停立的水”的状态性，并以“显现出来”反映被动式“被看见”所统摄的连续异象；不改变“红海”的文本选择，也不添加原文没有的神学或历史解释。
