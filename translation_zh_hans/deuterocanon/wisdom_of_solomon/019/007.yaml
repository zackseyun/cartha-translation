base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/007.yaml
  text: The cloud that overshadowed the camp was seen[a], and from the water that had stood before them dry land emerged; from the Red Sea came an unhindered road, and from the violent surge a grassy plain.
translation:
  language: zh_hans
  text: 那为营地遮荫的云被看见；干地从先前停立的水中显现出来；红海[a]中显现出一条畅通无阻的道路，汹涌的波涛中显现出一片长满青草的平原。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“芦苇海”。本节希腊文作“红海”，故正文据此翻译。
    reason: 说明出埃及传统中的另一译法，同时坚持现存希腊文本的读法。
lexical_decisions:
- source_word: σκιάζουσα
  choice: 遮蔽
  rationale: 该分词指投下阴影、以荫影覆盖；“遮蔽”既保留云覆盖营地的图景，也自然含有保护意味，而不过度解释。
- source_word: παρεμβολήν
  choice: 营地
  rationale: 在出埃及叙事语境中，该词指以色列人的驻营之处；“营地”是现代汉语中自然、准确的表达。
- source_word: προϋφεστῶτος ὕδατος
  choice: 原先存在的水
  rationale: 完成时分词表示水先已存在；此译保留时间上的先在性，不擅自加入希腊文未明说的方位或对象。
- source_word: ξηρᾶς ἀνάδυσις γῆς
  choice: 干地……显露出来
  rationale: 该名词短语描绘干地从水下出现；译为“显露出来”符合现代汉语，也保留浮现、露出的动态意象。
- source_word: ἐθεωρήθη
  choice: 人们看见
  rationale: 希腊文为被动式“被看见”；汉语以不定主语“人们看见”表达更自然，并保留观察、目睹的语气。
- source_word: ἐρυθρᾶς θαλάσσης
  choice: 红海
  rationale: 希腊文本明确为“红海”，故正文直接照译，不以可能的希伯来背景替换现存希腊文。
- source_word: ὁδὸς ἀνεμπόδιστος
  choice: 一条畅通无阻的道路
  rationale: 该短语强调道路没有阻碍、可以通行；“畅通无阻”准确传达其重点，同时保留具体的道路意象。
- source_word: χλοηφόρον πεδίον
  choice: 一片长满青草的平原
  rationale: 复合形容词意为生长或承载青绿草木；此译自然地保留海中竟如青草平原的鲜明反差。
- source_word: κλύδωνος βιαίου
  choice: 汹涌的波涛
  rationale: 该词组描写强烈而翻腾的水势；“汹涌的波涛”兼顾力度与动态，符合庄重的叙事语体。
theological_decisions:
- issue: 出埃及意象中ἐρυθρᾶς θαλάσσης的译法
  choice: 红海
  alternative: 芦苇海
  rationale: 现存希腊文明确写作“红海”，译文以原文证据为先，不依据可能的希伯来语背景改写正文；“芦苇海”仅在脚注中作为相关传统译法说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“人们看见”统摄并列的四幅景象，使希腊文单数被动动词所支配的列举关系在汉语中清楚自然；不补入原文未明说的神学解释。
