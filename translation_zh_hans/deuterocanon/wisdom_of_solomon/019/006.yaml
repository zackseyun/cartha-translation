base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: zh_hans
  text: 因为整个受造界都按其本类从上方重新被塑造[a]，服从你自己的命令，好使你的儿女得以安然无损。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都按其本类从起初重新被塑造。”希腊语“从上方”（ἄνωθεν）也可意为“从起初”；“被塑造”（διετυποῦτο）也含有被重新塑形、改造的意思。
    reason: 保留ἄνωθεν“从上方”与“从起初”的词义歧义，并说明διετυποῦτο所含重塑意味。
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: 整个受造界
  rationale: κτίσις在此指整体的被造秩序，而非某一个受造物；“整个受造界”既保留总体范围，也比“整个创造”更符合现代汉语。
- source_word: ἐν ἰδίῳ γένει
  choice: 按其本类
  rationale: γένος表示种类、类别；“按其本类”保留其分类意义，并避免将其改释为 φύσις 所表达的“本性”。
- source_word: πάλιν ἄνωθεν
  choice: 重新从上而
  rationale: πάλιν表达再次、重新，ἄνωθεν可指“从上面”或“从起初”。正文保留“从上而”的垂直及神圣来源意涵，另一可能在脚注说明。
- source_word: διετυποῦτο
  choice: 被塑造
  rationale: 该未完成时被动态表达受造界正在被赋形、重塑的过程；“被塑造”兼顾形态重整的含义和汉语可读性。
- source_word: ὑπηρετοῦσα
  choice: 服从
  rationale: 分词描述受造界为命令效力、听候差遣；在与“命令”搭配时，“服从”自然且能体现从属关系。
- source_word: ταῖς ἰδίαις ἐπιταγαῖς
  choice: 你自己的命令
  rationale: 上下文中的第二人称指向神；ἐπιταγαί是具有权威的命令。保留ἰδίαις为“自己的”，呈现原文重复使用ἴδιος。
- source_word: οἱ σοὶ παῖδες
  choice: 你的儿女
  rationale: παῖδες可指儿女或仆人；此处指蒙神保护的子民。“儿女”保留亲属关系，也不局限于男性。
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: 得以安然无损
  rationale: ἵνα加被动虚拟式表示目的，即受到保守而不遭损害；“得以安然无损”自然表达这一保护结果。
theological_decisions:
- issue: ἄνωθεν描述受造界更新时的含义
  choice: 正文译作“从上而”，保留来自上方、亦即神圣主导的可能意涵。
  alternative: “从起初”或“从头”
  rationale: ἄνωθεν本身兼有“从上面”和“从起初”的语义。此处受造界听从神的命令，故正文采用“从上而”；但不排除“从起初重新塑造”的理解，以脚注保存张力。
- issue: παῖδες所表达的身份关系
  choice: 译作“儿女”
  alternative: “仆人”
  rationale: 原词兼有子女与仆役的含义。上下文着重神对其子民的保护，“儿女”较贴切，但不据此引入特定教派性的身份论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“受造界”传达宇宙性的被造秩序；“按其本类”有意保留原文的类别用语。正文略带形式对应，以承载ἴδιος的重复和ἄνωθεν的歧义；脚注提供自然的另一读法。
