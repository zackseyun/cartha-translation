base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: zh_hans
  text: 因为他们仍记得自己寄居异乡[a]期间的事：大地所生出的不是寻常动物，而是蚋虫[b]；河流所喷吐出的不是寻常水中生物，而是一大群青蛙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居异乡”也可译作“寄居”或“作为外来者居住”。希腊词强调人在异地以外来者身份生活。
    reason: lexical_alternative
  - marker: b
    text: 这里所指的确切虫种不能确定，也可能理解为蠓、蚊蚋之类的细小叮咬昆虫。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο ... ἔτι
  choice: 仍记得
  rationale: 未完成时配合ἔτι，表达持续保有记忆；“仍记得”在现代汉语中简洁自然。
- source_word: παροικίᾳ
  choice: 寄居异乡
  rationale: 既保留暂居之意，也保留身为外来者居住的社会身份；不译作“流亡”，以免加入原词未必包含的含义。
- source_word: γενέσεως ζῴων
  choice: 使动物繁生
  rationale: γένεσις在此指动物的产生、繁衍过程；“繁生”比单说“出生”更能涵盖这一过程，并与大地作为主语相衔接。
- source_word: ἐξήγαγεν
  choice: 生出了
  rationale: 表现事物从地中产生、出来，符合汉语对大地产生生物的自然表达。
- source_word: σκνῖπα
  choice: 蚋虫
  rationale: 指细小叮咬昆虫，但确切虫种不明；“蚋虫”保留虫害意象，同时以脚注说明其他可能。
- source_word: ἐνύδρων
  choice: 水中生物
  rationale: 这是形容词名词化用法，泛指生活在水里的生物；译文不把范围缩窄为鱼类。
- source_word: ἐξηρεύξατο
  choice: 喷吐出
  rationale: 原动词带有强烈的吐出、涌出色彩；“喷吐出”保留河流猛然排出大量青蛙的生动意象。
- source_word: πλῆθος βατράχων
  choice: 大群青蛙
  rationale: πλῆθος强调数量众多；“大群”自然、清楚，也保留群集之感。
theological_decisions:
- issue: παροικία所指的历史处境
  choice: 译作“寄居异乡”，指以色列人在埃及作为外来者居住的时期
  alternative: 寄居；流亡
  rationale: 上下文回顾埃及灾祸；“寄居异乡”保留外来居住的含义，而“流亡”会过度引入后来的被掳或放逐观念。
- issue: ἐξηρεύξατο的灾祸意象强度
  choice: 译作“喷吐出”
  alternative: 涌出；生出
  rationale: 原词比中性的“产生”更有力度；此译保留修辞张力，却不增加神学解释。
- issue: 两个ἀντί结构的对照关系
  choice: 译作“没有……反而……”
  alternative: 代替……；不是……而是……
  rationale: 这种汉语结构清楚呈现“取而代之”的反常对照，同时避免把灾祸发生的机制解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“仍记得”保持回顾语气；两组“没有……反而……”再现原文平行结构；“喷吐出”保留希腊文鲜明而有力的灾祸图景。脚注标记均放在其实际说明的词语之后。
