  rationale: 将两组对照改为“所……的不是寻常……，而是……”，在不把原文修辞性反常对照机械化为绝对否定的前提下，保留ἀντί的“代替”关系及原文平行句式。“寻常”是为汉语表达该对照所需的最小补足，不界定这些生物的具体类别或机制。脚注锚点均紧随所说明的词语。
