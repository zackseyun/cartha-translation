  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/026.yaml
  text: forgetfulness of favors[a], defilement of souls, perversion of birth, disorder in marriages[b], adultery and debauchery.
translation:
  language: zh_hans
  text: 对恩惠的遗忘[a]，灵魂的玷污，生育的变乱[b]，婚姻的失序，通奸和淫荡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“恩典”；希腊语 χάρις 也可有“感恩”相关的含义，须由上下文判定。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“出生（或产生）的改变、交替”。这句希腊语含义简略，可能指生育或繁衍秩序受到扰乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: 忘却恩惠
  rationale: 保留“遗忘、未记念”的直接意义，也体现 χάρις 在此处“恩惠、好处”的含义；不直接译成“忘恩负义”，以免把隐含的伦理结果写成明说。
- source_word: ψυχῶν μιασμός
  choice: 玷污灵魂
  rationale: ψυχή 在本句的伦理语境中具有内在生命和属灵层面的意味；μιασμός 可兼指道德及礼仪性的污秽，“玷污”能保留这种力度。
- source_word: γενέσεως ἐναλλαγή
  choice: 生育的变乱
  rationale: γένεσις 可指出生、产生或生育，ἐναλλαγή 本义为改变、交替或交换。原文短语含义压缩且不完全明确；“变乱”既符合恶行清单的负面语境，又不把所指过度限定为某一种行为。
- source_word: γάμων ἀταξία
  choice: 婚姻的混乱
  rationale: γάμος 指婚姻或婚姻关系，ἀταξία 指失序、混乱；此译简洁保留原文结构。
- source_word: μοιχεία
  choice: 通奸
  rationale: 准确表达破坏婚姻关系的性不忠。
- source_word: ἀσέλγεια
  choice: 淫荡
  rationale: 表达无羞耻、无节制的放纵行为，符合本节恶行清单的语气。
theological_decisions:
- issue: χάριτος 是否应明确译为神学意义上的“恩典”
  choice: 恩惠
  alternative: 恩典；恩情
  rationale: 上下文是偶像崇拜所造成的社会与道德恶行，并非专论救赎性的恩典；“恩惠”保留词义范围而不引入后期神学限定。
- issue: ψυχῶν 是否应淡化为“人”或“生命”
  choice: 灵魂
  alternative: 人；生命
  rationale: “灵魂”保留《智慧篇》道德—属灵语域中的内在玷污意味，同时不进一步规定系统神学中的灵魂观。
- issue: γενέσεως ἐναλλαγή 的具体所指
  choice: 生育的变乱
  alternative: 出生的改变；生育秩序的颠倒
  rationale: 希腊语可直指“出生/产生的改变或交换”，但具体行为并未明说。“生育的变乱”传达负面语境，同时保留原文的含混；不在正文中断定为某一种生殖、性别或亲属秩序问题。
translation_notes:
  register: 采用庄重而易懂的现代书面汉语，并保留原文连续列举恶行的简洁节奏。“生育的变乱”刻意避免过度解释含义不明的 γενέσεως ἐναλλαγή。
