  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
translation:
  language: zh_hans
  text: 因为求利的欲望构想了那船[a]，工巧的智慧则建造了它；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为中性指示代词“那个”，回指上一节的船；“求利”也可译作“谋利”或“求取收益”。
    reason: 说明ἐκείνο对上一节“船”的回指，并保留πορισμῶν可指获利、收益的词义幅度。
lexical_decisions:
- source_word: ἐκείνο
  choice: 那船
  rationale: 中性指示代词回指上一节所说的船；正文明确补出所指，使现代汉语自然，同时以脚注说明希腊文原为指示代词。
- source_word: ὄρεξις πορισμῶν
  choice: 谋利的欲望
  rationale: ὄρεξις表示欲望、渴求；πορισμῶν在航运语境中指获取收益或利益，合译为“谋利的欲望”既保留经济动机，也符合现代汉语。
- source_word: ἐπενόησεν
  choice: 想出了
  rationale: 表示在心中构想、设计；“想出了”自然地呈现从意念中发明或筹划的动作。
- source_word: τεχνῖτις σοφία
  choice: 工巧的智慧
  rationale: τεχνῖτις带有工艺、匠作和技术熟练的意味；“工巧的”修饰“智慧”，既保留σοφία这一全书的重要主题词，也传达实际制作技能。
- source_word: κατεσκεύασεν
  choice: 把它造了出来
  rationale: 该动词可指建造、制作；在船的语境中译为“造了出来”，并补出汉语所需的宾语“它”，与前句的构想形成呼应。
theological_decisions:
- issue: 在实际工艺语境中如何翻译 σοφία
  choice: 智慧
  alternative: 技艺；聪明才智
  rationale: σοφία是本书具有文学和神学分量的核心词。保留“智慧”可维持主题呼应，而τεχνῖτις所译的“工巧的”已交代这里侧重制作技能，不必将其窄化为单纯“技艺”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首“因为”承接上下文；“想出了／造了出来”呈现从构想到制作的对照。保留分号以反映本节尚未完结的句法关系。
