  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: zh_hans
  text: 因为，对无名偶像的敬拜是一切恶事的开端、原因和终结[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有名字的偶像。”希腊语这个形容词也可能强调这些偶像没有真实或相称的名号。
    reason: lexical_alternative
  - marker: b
    text: “开端、原因和终结”也可理解为“起源、缘由和最终结局”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  choice: 敬拜
  rationale: 这里指向偶像所行的宗教性礼敬与崇拜，而非泛指抽象意义上的“宗教”；“敬拜”简明自然，也符合本节的谴责语境。
- source_word: ἀνωνύμων
  choice: 无名的
  rationale: 该词本义为“没有名字的”或“未被命名的”。“无名的”保留其修辞力量，也不擅自断定是指没有真实身份、没有配得的名号，还是不值得被称名。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 在《所罗门智训》的语境中，该词通常指代表假神、受人崇拜的形像；“偶像”准确传达其宗教和论辩含义。
- source_word: παντὸς ... κακοῦ
  choice: 一切恶事
  rationale: 这个属格词组具有全面概括的意味；“一切恶事”在现代汉语中自然，并保留原文强烈而广泛的断言。
- source_word: ἀρχὴ
  choice: 开端
  rationale: 与“原因”和“终结”组成紧凑的三项并列；“开端”既贴近原义，也能清楚呈现原文的修辞结构。
- source_word: αἰτία
  choice: 原因
  rationale: 此处表示致使某事发生的缘由；“原因”准确而克制，不额外加入责任或罪责等原文未明说的含义。
- source_word: πέρας
  choice: 终结
  rationale: 该词可指终点、界限、结果或最终完成。“终结”保留原文“开端—原因—终结”的鲜明结构，并容纳结局与最终完成两层可能含义。
theological_decisions:
- issue: 如何表达 ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας 这一三项并列结构
  choice: 是一切恶事的开端、原因和终结
  alternative: 是一切邪恶的起源、缘由和最终结局
  rationale: 原文措辞紧凑而强调。“开端、原因和终结”尽量保留其形式与张力，也维持作者对偶像崇拜的全面谴责，不将“终结”单向解释成结果、目标或极致。
- issue: ἀνωνύμων（“无名的”）对偶像所含的暗示
  choice: 无名的偶像
  alternative: 没有名字的偶像
  rationale: 原文没有解释“无名”究竟表示这些偶像没有真实神性、没有确定身份，还是不配拥有名号；译文保留这种神学张力，不作解释性定论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首“因为”承接上下文的论证关系；以“敬拜无名的偶像”为主语，避免把 θρησκεία 扩大为泛指宗教。“开端、原因和终结”保留希腊文三项并列的凝练与力度。
