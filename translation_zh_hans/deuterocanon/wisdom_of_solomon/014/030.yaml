base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/030.yaml
  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
translation:
  language: zh_hans
  text: 然而，应得的惩处必会在这两方面临到他们[a]：他们依附偶像，因而对上帝有错误的认识[b]；他们又以诡诈不义地起誓，蔑视神圣之事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在这两方面”也可译作“因这两件事”或“在两项罪过上”；也可能指上文所说的两类人。“应得的惩处”也可译作“公正的裁断”“公义的要求”或“正当的报应”。
    reason: 保留ἀμφότερα的所指以及τὰ δίκαια的语义力度和具体表达方式。
  - marker: b
    text: 即他们因转向、依附偶像，而对上帝形成了错误的看法。
    reason: 说明προσχόντες εἰδώλοις与“对上帝有错误的认识”之间的分词性关联。
  - marker: c
    text: “神圣之事”也可译作“虔敬”“神圣性”或“对神圣之事应有的敬畏”。
    reason: ὁσιότης可指虔敬、神圣性，以及对神圣事物和义务应有的尊重。
lexical_decisions:
- source_word: ἀμφότερα
  choice: 这两件事
  rationale: 中性复数指本节随后列出的两项罪行：因依附偶像而错误认识上帝，以及以诡诈不义地起誓。这样译出双重所指，比单说“二者”更适合现代汉语。
- source_word: μετελεύσεται
  choice: 必……追上
  rationale: 该动词带有追赶并施行惩治的意味；“追上”保留公正报应主动临到作恶者的形象，同时不限定惩罚的具体方式。
- source_word: τὰ δίκαια
  choice: 公正的惩处
  rationale: 带冠词的中性复数可指公正的要求、裁断或相应后果。汉语若直译为“公正之事”语意生硬；“公正的惩处”清楚传达司法性后果，但以脚注保留较宽的可能译法。
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: 对上帝有错误的认识
  rationale: 该短语重在对上帝作出错误判断或形成错误观念，并非仅指心存恶念；此译自然、明确。
- source_word: προσχόντες εἰδώλοις
  choice: 依附偶像
  rationale: 分词表示他们转向、留心并执着于偶像，也说明其错误认识上帝的缘由。“依附”兼顾关注与归向之意，又不额外加入原文未明说的礼仪细节。
- source_word: ἀδίκως ὤμοσαν ἐν δόλῳ
  choice: 心怀诡诈，不义地起誓
  rationale: ἀδίκως强调起誓行为的不义，ἐν δόλῳ说明其欺骗性的方式或心态；分别译出可避免把含义缩窄为仅仅“说了假话”。
- source_word: καταφρονήσαντες ὁσιότητος
  choice: 藐视虔敬
  rationale: ὁσιότης可指对神圣之事应有的虔敬或敬畏。“虔敬”在此比单纯的个人“敬虔”更能涵盖尊重神圣义务的意思，脚注列出另一种表达。
theological_decisions:
- issue: ἀμφότερα的所指及τὰ δίκαια的力度
  choice: 将“这两件事”理解为随后所列的两项罪行，并把τὰ δίκαια译作“公正的惩处”。
  alternative: “两者”也可能指上文所说的两类人；τὰ δίκαια亦可较宽地译为“公正的裁断”或“公义的要求”。
  rationale: 本句后半紧接着列出两项罪行，因此就近回指最为顺畅。τὰ δίκαια具有司法和报应意味，但其措辞并未说明惩处的具体形式，故正文明确其惩治作用，脚注保留较宽的语义范围。
- issue: ὁσιότης所指的神圣义务
  choice: 译为“虔敬”，保留其兼有敬畏神圣与履行神圣义务的含义。
  alternative: 可译为“神圣”或“对神圣之事的敬畏”。
  rationale: 上下文涉及以神圣之名起誓却行诡诈；“虔敬”既可指对上帝及神圣之事的敬重，也不把经文限定为某一宗派的敬虔观。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“追上他们”保留希腊文的动态司法意象；两个分句以分号并列，清楚呈现两项罪行。使用“上帝”作为θεός的通顺对应，不加入宗派性术语。
