revisions:
- from: 然而，公正的惩处必因这两件事追上他们[a]：他们依附偶像，因而对上帝有错误的认识[b]；他们又心怀诡诈，不义地起誓，藐视虔敬[c]。
  to: 然而，应得的惩处必会在这两方面临到他们[a]：他们依附偶像，因而对上帝有错误的认识[b]；他们又以诡诈不义地起誓，蔑视神圣之事[c]。
  rationale: 修订主要改善了ἀμφότερα与τὰ δίκαια在汉语中的句法表达，并以“在这两方面”保留原文所指的开放性。“应得的惩处临到他们”保有报应性的司法语气，而不具体限定惩罚形式。末语改为“蔑视神圣之事”，使现代汉语更自然，并避免将ὁσιότης仅限于个人的虔敬态度。
