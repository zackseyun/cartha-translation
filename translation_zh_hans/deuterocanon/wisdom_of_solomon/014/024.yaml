base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: zh_hans
  text: 无论生活还是婚姻，他们都不再保持纯洁；反而一个人或设伏[a]杀害另一个人，或通奸[b]，使人痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设伏”也可译作“暗中伺机袭击”或“用诡计”；希腊文含有埋伏等待、暗中攻击的意思。
    reason: lexical_alternative
  - marker: b
    text: “通奸”所译的希腊词也可指“败坏婚姻”或“破坏婚姻忠贞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: 生活
  rationale: βίος可指生命、生活方式或生计；本节处于道德败坏的罪恶清单中，与“婚姻”并列，译作“生活”既自然，也保留其涵盖个人和社会生活的宽度。
- source_word: γάμους
  choice: 婚姻
  rationale: γάμος可指婚姻、婚礼或婚床；这里与“保持纯洁”搭配，主要指婚姻关系。
- source_word: καθαροὺς
  choice: 纯洁
  rationale: 该词表示洁净、纯净；“纯洁”可同时自然地修饰生活和婚姻，并传达此处的道德含义。
- source_word: φυλάσσουσιν
  choice: 保持
  rationale: φυλάσσω有守护、保守、维持之意；“保持纯洁”符合现代汉语表达，也保留持续维护的含义。
- source_word: λοχῶν
  choice: 设伏
  rationale: 该分词表示埋伏、伺机袭击；“设伏”直接保留暗中等待并攻击的具体意象，相关的诡诈意味由语境自然呈现。
- source_word: ἀναιρεῖ
  choice: 杀死
  rationale: ἀναιρέω在此意为杀害、除掉；“杀死”直接清楚，不额外加入法律定性。
- source_word: νοθεύων
  choice: 通奸
  rationale: νοθεύω可指掺假、败坏，在婚姻和性关系语境中可表示破坏婚姻忠贞；紧接前文“婚姻”，译作“通奸”最为简明，但以脚注保留较宽的词义。
- source_word: ὀδυνᾷ
  choice: 使人痛苦
  rationale: 该动词表示使疼痛、使悲伤或折磨；“使人痛苦”保留身体或情感痛苦的宽泛含义，不限定具体受害者。
theological_decisions:
- issue: βίους ... γάμους καθαρούς所指的纯洁范围
  choice: 理解为生活与婚姻两方面的道德纯洁。
  alternative: 可较窄地理解为正当的生计与合法婚姻，或理解为礼仪上的洁净。
  rationale: 上下文描述偶像崇拜所引发的普遍道德混乱，因此道德含义居于首位；译文不把βίους局限于经济生活，也不把“纯洁”专门礼仪化。
- issue: νοθεύων的具体行为
  choice: 正文译为“通奸”，指出婚姻不忠。
  alternative: 也可译为“败坏婚姻”或“玷污婚姻关系”。
  rationale: 该词本义较宽，但本节刚提到婚姻，性与婚姻上的不忠最符合语境；脚注保留其可表示败坏或破坏婚姻忠贞的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无论……还是……”自然呈现两个并列宾语；分号和冒号体现原文从总体败坏转到具体相害行为的结构。“彼此相害”为衔接性表达，随后以两个“有人”保留ἕτερος…ἕτερον所呈现的人际伤害。
