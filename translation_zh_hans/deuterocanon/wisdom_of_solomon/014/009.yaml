  text: For the ungodly man and his ungodliness are equally hateful to God;[a]
translation:
  language: zh_hans
  text: 因为不敬虔的人和他的不敬虔，同样为上帝所憎恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不虔敬的人和他的不虔敬，同样为上帝所憎恶。”
    reason: 提供ἀσεβῶν／ἀσέβεια的词汇替代译法；正文用“不敬虔”以保留同根呼应并兼顾通俗性。
lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: 同样
  rationale: 保留“处于同等程度”的比较意味，同时符合现代汉语表达。
- source_word: μισητά
  choice: 为……所憎恶
  rationale: 准确表达二者都是上帝憎恶的对象；“憎恶”比“讨厌”庄重，也不弱化原文力度。
- source_word: θεῷ
  choice: 为上帝所
  rationale: 与“憎恶”构成自然的被动结构，对应希腊语与格所标示的关系。
- source_word: ὁ ἀσεβῶν
  choice: 不敬虔的人
  rationale: 将带冠词的现在分词译为以不敬虔行为为特征的人；“人”自然地指个体，不额外强化希腊语语法阳性的性别含义。
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: 他的不敬虔
  rationale: 保留ἀσεβῶν与ἀσέβεια的同根呼应，并明确该不敬虔属于前述之人。
theological_decisions:
- issue: 上帝的憎恶同时指向不敬虔者及其不敬虔
  choice: 明确说二者同样为上帝所憎恶。
  alternative: 仅说上帝憎恶不敬虔的行为，或将对人的憎恶弱化为不悦。
  rationale: 希腊文把“行不敬虔的人”和“他的不敬虔”并列置于同一谓语μισητά θεῷ之下；译文不应消除这种神学张力，也不把本节扩展成更广泛的系统性论断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”对应γάρ，表明本节承接上文的论证；“同样”紧邻并列主语后的谓语，清楚传达ἐν ἴσῳ。
