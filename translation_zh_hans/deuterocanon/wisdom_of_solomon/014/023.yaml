  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/023.yaml
  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: zh_hans
  text: 因为他们或举行杀害儿女的仪式，或举行秘密的秘仪，或举行遵循奇异习俗的疯狂狂欢，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  choice: 杀害儿女的仪式
  rationale: 直译其核心意义；τεκνοφόνος 指杀害子女或孩童，τελετή 指宗教仪式。用“儿女”保留亲子关系的语感。
- source_word: κρύφια μυστήρια
  choice: 秘密的祭典
  rationale: μυστήρια 在此指仅限入门者参与的秘密宗教礼仪；“祭典”比现代汉语中易被误解为抽象奥秘的“奥秘”更符合语境。
- source_word: ἐμμανεῖς … κώμους
  choice: 狂欢作乐
  rationale: κῶμος 指宴饮游行式的纵乐狂欢，ἐμμανής 加强其疯狂、失控的性质；“狂欢作乐”自然传达两者。
- source_word: ἐξάλλων θεσμῶν
  choice: 奇异的规俗
  rationale: ἐξάλλων 表示异常、离奇，θεσμῶν 可指规条、制度或习俗；“规俗”兼顾规范与风俗两层含义，不将其限定为成文律例。
- source_word: ἄγοντες
  choice: 举行／作乐
  rationale: 该分词支配并列宾语，含举行仪式、进行狂欢之意；汉语按不同搭配分别表达，使句子自然。
theological_decisions:
- issue: τεκνοφόνους 是否具体译作献祭儿童
  choice: 杀害儿女的仪式
  alternative: 献祭儿童的仪式
  rationale: 原文明确说杀害儿女，却未在该词组内明说其为献祭；虽处宗教礼仪语境，仍避免把推论写入正文。
- issue: μυστήρια 是否译为神学术语“奥秘”
  choice: 秘密的祭典
  alternative: 秘密的奥秘仪式
  rationale: 此处是对异教秘密礼仪的谴责，不是正面神学意义的“奥秘”；采用语境化译法可避免误导。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文三个“或”所构成的并列列举，以及句末逗号所显示的语法未完状态，以衔接下一节。
