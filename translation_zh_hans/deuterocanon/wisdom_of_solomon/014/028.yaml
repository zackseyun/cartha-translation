base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
translation:
  language: zh_hans
  text: 因为他们或是在狂欢作乐时发狂[a]，或是预言虚假之事，或是过着不义的生活，或是轻易发假誓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们狂欢作乐，却已陷入疯狂。”希腊语的分词与完成时动词可以侧重表达狂欢时的发狂，也可以侧重已经陷入疯狂的状态。
    reason: lexical_alternative
  - marker: b
    text: “轻易发假誓”也可译为“轻率地发假誓”或“随时就发假誓”。希腊语指发虚假的誓言或犯伪誓。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: 在狂欢作乐时
  rationale: 该分词表示欢宴、作乐的状态；结合本段放纵失序的语境，“狂欢作乐”比单纯“欢乐”更准确，并以“时”体现其与主句的时间关系。
- source_word: μεμήνασιν
  choice: 发狂
  rationale: 该词源于 μαίνομαι，表示陷入疯狂或狂乱。希腊语完成时强调已经进入并处于这种状态；中文“发狂”简洁有力，保留其动态和现时结果。
- source_word: προφητεύουσιν ψευδῆ
  choice: 预言虚假之事
  rationale: 保留动词与宾语结构，明确所预言的内容是虚假的，不将其弱化为一般性的“说错预言”。
- source_word: ζῶσιν ἀδίκως
  choice: 过着不义的生活
  rationale: ἀδίκως兼有不公正和不正直的伦理含义；“不义”保留这种幅度，且符合智慧文学的庄重语域。
- source_word: ἐπιορκοῦσιν
  choice: 起假誓
  rationale: 该动词指发虚假的誓言或作伪誓。“起假誓”直观保留誓言意象，也比法律色彩较强的“作伪证”范围更合适。
- source_word: ταχέως
  choice: 轻易
  rationale: 该副词本义可指迅速，在此也可表达随意、毫不迟疑地作伪誓；“轻易”是自然中文，并保留其轻率、 readily 的语用意味。
theological_decisions:
- issue: ἀδίκως在智慧文学伦理语境中的译法
  choice: 不义
  alternative: 不公正；邪恶
  rationale: “不义”同时容纳个人道德败坏与社会性不公的含义，不把词义限定为法律层面的“不公正”，也不扩大成泛指一切“邪恶”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以四个“或是”对应希腊文反复出现的ἢ，保留并列罪行的修辞节奏；首句保留γάρ的因果衔接，译作“因为”。
