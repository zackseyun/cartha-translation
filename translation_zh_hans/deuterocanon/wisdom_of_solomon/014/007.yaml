  text: For blessed is the wood through which righteousness comes[a].
translation:
  language: zh_hans
  text: 因为那借以成就公义的木头是有福的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译为“正义”。希腊语 δικαιοσύνη 可指公义或正义；“得以成就”表达 γίνεται 在此“发生、实现”的意思。
    reason: 保留δικαιοσύνη的词义幅度，并说明谓语的实现意义，同时使脚注的替代范围明确。
lexical_decisions:
- source_word: εὐλόγηται
  choice: 是有福的
  rationale: 该词为完成时被动语态，表达受祝福后所处的状态；“是有福的”自然保留了这种结果状态，也适合上下文中蒙福之木与受咒诅的偶像材料之间的对比。
- source_word: γὰρ
  choice: 因为
  rationale: 保留其对上文的解释关系；现代汉语中用“因为”比“原来”更直接清楚。
- source_word: ξύλον
  choice: 木头
  rationale: 该词可指树、木材或木制之物；这里侧重作为材料或器具的木头，不宜具体化为“树木”。
- source_word: δι’ οὗ
  choice: 那……的
  rationale: 关系代词回指中性的 ξύλον，并表达媒介或工具关系；汉语用“那成就……的木头”自然呈现“借着它”的意思。
- source_word: γίνεται
  choice: 成就
  rationale: γίνομαι 在这里指某事得以发生或实现。“成就”既表达公义借此实现，也避免生硬的“发生”。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: 该词可涵盖道德上的正直、公正及正义秩序；“公义”保留较宽广的伦理与神学含义，另以脚注注明“正义”这一可行译法。
theological_decisions:
- issue: δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”能同时承载道德正直与公正秩序的宽广含义，不将本节限制为司法或社会层面的正义；但原词确可译为“正义”，故保留于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那成就公义的木头”保持原文简洁，并保留木头作为媒介的表达；脚注明确呈现词义上的真实歧义。
