base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: zh_hans
  text: 因为他们信赖毫无生命的偶像[a]，不正当地起誓后，也不认为自己会受到伤害[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虚妄的偶像”或“毫无价值的偶像”。希腊语形容词强调偶像的空洞或不真实。
    reason: lexical_alternative
  - marker: b
    text: 或译“遭受不义对待”，也可能指“受到惩罚”。希腊语可泛指遭受损害；按上下文，很可能暗示他们不怕因邪恶地起誓而遭到报应。
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  choice: 毫无生命的
  rationale: 该词修饰“偶像”，强调偶像空洞、虚妄、没有真实能力；“毫无生命的”在现代汉语中具体自然，同时切合上下文对偶像无能的批判。
- source_word: πεποιθότες
  choice: 信赖
  rationale: 完成时分词表示已经形成并持续存在的倚赖；“信赖”简洁地保留这种稳定的信心。
- source_word: εἰδώλοις
  choice: 偶像
  rationale: 这里指被当作神明敬奉的宗教塑像或形象，“偶像”准确体现本段的宗教批判语境。
- source_word: κακῶς
  choice: 恶
  rationale: 该副词从道德层面限定起誓行为；译作“发了恶誓”符合汉语习惯，也保留其邪恶、不正当之意，而不把含义缩窄为“虚假”。
- source_word: ὀμόσαντες
  choice: 发了……誓以后
  rationale: 以时间结构表达希腊语分词，既体现行为先于后文的预期，也符合现代汉语表达。
- source_word: ἀδικηθῆναι
  choice: 受到伤害
  rationale: 该被动不定式含义较宽，可指遭受损害、被亏待，也可在语境中暗示受惩罚；“受到伤害”保留这种宽度。
- source_word: οὐ προσδέχονται
  choice: 不认为自己会
  rationale: 表达不期待、不料想某事发生；此译法自然清楚，并与后接的“受到伤害”顺畅衔接。
theological_decisions:
- issue: 结果分句所指的后果
  choice: 他们不认为恶意起誓会使自己受到伤害
  alternative: 他们不怕被偶像亏待；或他们不认为自己会因假誓而受惩罚
  rationale: ἀδικηθῆναι 本身含义宽泛；在反偶像崇拜的上下文中，很可能包括因恶意起誓而遭报应，但正文采用“受到伤害”，不把它限定为某一种惩罚机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“发了恶誓以后”直接表达时间关系；正文保留“受到伤害”的宽泛性，由脚注说明“被亏待”与“受惩罚”等可能含义。
