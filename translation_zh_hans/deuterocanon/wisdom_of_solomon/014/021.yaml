base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: zh_hans
  text: 这事也成了人生的陷阱，因为人们沦为灾祸或暴政的奴仆，竟把那不可共享的名[a]加给石头和木头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指不可归给别者的名；这里很可能是指神独有的名或尊荣，不应归给偶像。
    reason: 说明“不可共享的名”在反偶像语境中的可能所指，同时保留原文措辞的含蓄性。
lexical_decisions:
- source_word: ἔνεδρον
  choice: 陷阱
  rationale: 原词可指埋伏、伏击或圈套；“陷阱”在现代汉语中自然清楚，也保留这事暗中危害人生的比喻。
- source_word: τῷ βίῳ
  choice: 人生
  rationale: βίος在这里指人的生活或生命历程；“人生”与“陷阱”搭配自然，同时不把含义限缩为肉体生命。
- source_word: συμφορᾷ
  choice: 灾祸
  rationale: 表达临到人的不幸或灾难，语体庄重，并与“暴政”构成并列。
- source_word: τυραννίδι
  choice: 暴政
  rationale: 直接表达专横统治及其压迫力量，符合上下文所说的奴役。
- source_word: δουλεύσαντες
  choice: 沦为……的奴仆
  rationale: 保留δουλεύω所含的奴役和受制意味，比单纯译作“服从”更能体现强制性。
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: 那不可共享的名
  rationale: ἀκοινώνητος直指不可与别者共有；此译保留原文对这“名”之独有性的强调，而不在正文中明确增补“神的”。
- source_word: λίθοις καὶ ξύλοις
  choice: 石头和木头
  rationale: 按原文保留具体材料，不擅自增补“偶像”或“雕像”。
- source_word: περιέθεσαν
  choice: 加给
  rationale: 在此表示把名加在或赋予某物；“加给”简洁地传达错误归给石木的动作。
theological_decisions:
- issue: 反偶像语境中“τὸ ἀκοινώνητον ὄνομα”的所指
  choice: 那不可共享的名
  alternative: 那不可共用的名；那不能归给别者的名；神独有的名
  rationale: 上下文很可能指神独有、不可归给偶像的名或尊荣，但希腊文只明说“那不可共享的名”。正文保留其含蓄与排他性，脚注说明可能所指，避免把解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人生的陷阱”保留原文的危险比喻；“沦为……的奴仆”体现受灾祸或暴政辖制的力度。脚注标记紧随其实际解释的短语。
