  text: For it was not from the beginning[a], nor will it be forever.
translation:
  language: zh_hans
  text: 因为它并非从起初就存在[a]，也不会存到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明说主语；按上下文，“它”可以指偶像，也可以指偶像崇拜。
    reason: 保留原文省略主语所产生的指代含混。
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: 因为……并非……也不
  rationale: γάρ具有解释作用，译作“因为”；οὔτε…οὔτε以现代汉语自然的“并非……也不”表达其关联否定。
- source_word: ἦν
  choice: 存在
  rationale: 此处εἰμί涉及所指对象是否存在；译作“存在”在汉语中比单用“是”完整自然，同时不明说省略的主语。
- source_word: ἀπ' ἀρχῆς
  choice: 从起初
  rationale: 准确表达自开端以来的时间起点，并保留庄重、常见的圣经语体。
- source_word: εἰς τὸν αἰῶνα
  choice: 到永远
  rationale: 该短语在这里表示永久延续，与“从起初”形成时间上的对照。
- source_word: ἔσται
  choice: 不会存到
  rationale: 未来时与前句的“存在”呼应；“存到永远”是自然汉语，也准确表达持续存在至永久之意。
theological_decisions:
- issue: 希腊文省略了主语
  choice: 正文使用代词“它”，不明确限定所指
  alternative: 明确译为“偶像”或“偶像崇拜”
  rationale: 原文依靠上下文确定主语，既可能指偶像，也可能指偶像崇拜。保留代词可避免把原文的含混过早限定为某一解释。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“从起初”和“到永远”保留原文首尾时间对照；正文不补出具体主语。
