  text: And the ambition of the craftsman urged on even those who were ignorant toward an intensification of worship[a].
translation:
  language: zh_hans
  text: 工匠的求名心甚至促使那些无知的人越发热衷于敬拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使宗教更加兴盛”，或“使宗教礼仪更加隆重”。
    reason: 保留 ἐπίτασιν θρησκείας 可理解为宗教本身的增长，或宗教礼仪、崇拜活动加剧的词义空间。
lexical_decisions:
- source_word: ἐπίτασιν
  choice: 越发热衷
  rationale: 该词表示增强、加剧；与“敬拜”搭配译为“越发热衷”，自然表达敬拜活动被推向更强烈程度的含义。
- source_word: θρησκείας
  choice: 敬拜
  rationale: 该词可指宗教、宗教礼仪或敬拜；本节处于偶像崇拜的语境中，“敬拜”最能体现实际的崇拜活动，同时避免把它抽象化为宗教体系。
- source_word: ἀγνοοῦντας
  choice: 那些无知的人
  rationale: 该分词指缺乏认识或理解的人；“那些无知的人”保留了其人物指向，也不擅自补明他们不知道什么。
- source_word: τεχνίτου
  choice: 工匠
  rationale: 该词指制作形像的技艺人；“工匠”是现代汉语中自然、准确而庄重的称呼。
- source_word: προετρέψατο
  choice: 促使
  rationale: 该中间语态动词表达劝动、推动某人趋向某事；“促使”保留推动意味，又不把力度夸大为强迫或猛烈煽动。
- source_word: φιλοτιμία
  choice: 求名心
  rationale: 该词本义涉及爱慕荣誉、追求声望，常可指野心；本段指工匠借作品博取名声的动机，“求名心”比泛称“野心”更具体地保留这一内涵。
theological_decisions:
- issue: 在批判偶像的语境中如何翻译 θρησκεία
  choice: 敬拜
  alternative: 宗教；宗教礼仪
  rationale: 上下文所说的是对偶像的崇拜因工匠求名而变得更强烈、更铺张。“敬拜”突出具体的崇拜实践，不将其处理为抽象宗教概念，也不引入后来的宗派性术语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“求名心”点明工匠追求声望的动机；“越发热衷于敬拜”自然呈现 εἰς ἐπίτασιν θρησκείας 的方向与增强意味。主句保留“甚至”，对应 καί 对“那些无知的人”的强调。
