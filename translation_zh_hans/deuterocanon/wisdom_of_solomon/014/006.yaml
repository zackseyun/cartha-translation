base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: zh_hans
  text: 因为当初狂傲的巨人遭到毁灭时，世界的希望逃到一只筏子上避难[a]，在你手的引导下，给后来的时代[b]留下了繁衍的种子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“船只”或“小舟”。希腊文直译为“筏子”，是一个带有修辞色彩的用词，并非常用的“船”或“方舟”一词。
    reason: lexical_alternative
  - marker: b
    text: 或译“给后世”或“给那时代”。这里的希腊词是“时代”（αἰών），与本节前面的“世界”（κόσμος）不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: 在太初
  rationale: 按时间意义理解，指洪水审判发生的远古时期；“太初”保留庄重语体，但不把它解释为抽象的宇宙本原。
- source_word: ἀπολλυμένων
  choice: 遭到毁灭时
  rationale: 保留现在时中被动分词所表达的受毁灭过程及其时间背景，不明确添加施事者。
- source_word: ὑπερηφάνων γιγάντων
  choice: 狂傲的巨人
  rationale: “狂傲”表达ὑπερήφανος的贬义道德色彩；“巨人”符合希腊化犹太文献中的远古巨人传统，避免引入希腊神话的“泰坦”。
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  choice: 世界的希望
  rationale: 保留原文拟人化表达，不直接改写为挪亚或幸存的人类余民。
- source_word: ἐπὶ σχεδίας
  choice: 到一只筏子上
  rationale: σχεδία通常指筏子，并非一般的船或“方舟”；直译可保留作者刻意采用的修辞性称呼。
- source_word: καταφυγοῦσα
  choice: 逃到
  rationale: 在自然现代汉语中表达逃往安全之处、寻求庇护的含义；“世界的希望”仍作为拟人化主语。
- source_word: ἀπέλιπεν
  choice: 留下了
  rationale: 采用动词的直接意义，不将其解释性地改写为“保存了”。
- source_word: τῷ αἰῶνι
  choice: 给未来的时代
  rationale: 以时间性的“时代”区别于前文κόσμος“世界”；“未来的”明示其延续至后来的时间指向。
- source_word: σπέρμα γενέσεως
  choice: 繁衍的种子
  rationale: 保留σπέρμα的“种子”意象，并以“繁衍”表达γένεσις在此处所指的生育、世代延续；不擅自加入原文没有的“新”。
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  choice: 由你的手掌舵
  rationale: κυβερνάω带有航海中操舵、驾驶的意味；此译保留水上航行意象及神的主动引导。
theological_decisions:
- issue: “世界的希望”所指为何
  choice: 保留拟人化说法“世界的希望”
  alternative: 明确译作“挪亚”或“幸存的人类余民”
  rationale: 阴性分词在语法上与ἐλπίς一致，语境又使其具体关联挪亚及借他得以存留的人类；正文不替读者消除这种抽象拟人与具体所指之间的张力。
- issue: κόσμος与αἰών的区别
  choice: 分别译作“世界”与“时代”
  alternative: 将两者都译成“世界”，或把αἰών直接意译为“后世”
  rationale: 原文在同一句中使用两个不同名词；保留空间—人类整体意义的“世界”和时间意义的“时代”之间的差别。
- issue: 神的手与筏上幸存者的关系
  choice: 译作“由你的手掌舵”，不另行补出宾语
  alternative: 明确译为“那筏子由你的手驾驶”或“你亲手引导挪亚”
  rationale: 原文分词在语法上修饰拟人化的“希望”，同时航海动词自然使人联想到承载它的筏子；省略汉语中的明确宾语可保存这一意象关联。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“太初”“世界的希望”“繁衍的种子”等措辞保留原文的远古背景、拟人和种子意象；句法经过适度调整，使多个希腊分词在汉语中自然衔接。
