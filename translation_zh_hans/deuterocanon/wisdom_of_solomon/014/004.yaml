    reason: lexical_alternative
lexical_decisions:
- source_word: δεικνὺς
  choice: 表明
  rationale: 现在分词承接上文，表达借前述事情显出或证明某事；“表明”自然并保留其论证意味。
- source_word: δύνασαι
  choice: 你能
  rationale: 直接表达对上帝能力的陈述，简洁而庄重。
- source_word: ἐκ παντὸς
  choice: 脱离任何危险
  rationale: 字面为“从一切中”；航海语境表明所指是各种险境。正文采用自然的语境化表达，并以脚注保留希腊文较宽泛的措辞。
- source_word: σώζειν
  choice: 救人
  rationale: 保留“拯救、救助”的核心意义；补出泛指宾语“人”，符合现代汉语表达而不限定获救者。
- source_word: ἵνα κἂν
  choice: 使人即使……也
  rationale: “使”保留ἵνα的目的或结果关系，“即使……也”体现κἂν的让步加强语气。
- source_word: ἄνευ τέχνης
  choice: 没有技能
  rationale: τέχνη泛指实际技艺或专门技能；上下文自然使读者理解为驾船、航海方面的技能，同时避免在正文中过度缩窄词义。
- source_word: τις
  choice: 人
  rationale: 以泛指的“人”表达不定代词，符合现代汉语习惯。
- source_word: ἐπιβῇ
  choice: 可以登船
  rationale: 在航海语境中指登上船只；“登船”准确、自然。“可以”配合目的或结果结构表达虚拟式语气。
theological_decisions:
- issue: ἐκ παντὸς σώζειν所表达的上帝拯救能力之范围
  choice: 正文译为“救人脱离任何危险”，并以脚注注明字面更宽泛
  alternative: “从一切中拯救”
  rationale: 经文直接处于航海险境的语境，但ἐκ παντός本身没有明说“危险”。正文传达具体语境，脚注则保留其可能更广的范围，避免把上帝拯救能力只限定于海难。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子保留承接上文的分词式开头“表明”，并把两个脚注分别置于对应词语之后。
