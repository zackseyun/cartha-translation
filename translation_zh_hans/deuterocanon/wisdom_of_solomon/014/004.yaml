translation:
  language: zh_hans
  text: 表明你能救人脱离任何危险[a]，使人即使没有技能[b]也可以登船。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从一切中拯救。”希腊文的说法比眼前的航海语境更宽泛；“任何危险”表达了此处在海上遇险的具体含义。
    reason: lexical_alternative
  - marker: b
