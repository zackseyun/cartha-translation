base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: zh_hans
  text: 因为那总是追究不义之人过犯的，并不是他们起誓时所凭之物的力量[a]，而是对犯罪之人的惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“誓言的力量”或“他们起誓时所凭对象的力量”。希腊语表达较为凝缩，既可能指誓言本身，也可能指起誓时所援引的对象。
    reason: lexical_alternative
  - marker: b
    text: 或按原文语序译：“而是犯罪之人的惩罚，总是追究不义之人的过犯。”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……并不是
  rationale: 承接上文，保留解释原因的语气，并使汉语句式自然。
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: 他们起誓时所凭之物的力量
  rationale: 希腊语表达凝缩，可指誓言本身，也可指起誓时援引或凭借的对象；正文按语境采用后者，同时以脚注保留歧义。
- source_word: ἀλλ᾽ ἡ τῶν ἁμαρτανόντων δίκη
  choice: 而是对犯罪之人的惩罚
  rationale: δίκη在此具有司法报应和刑罚之义；“惩罚”在现代汉语中清楚自然，并与前项形成鲜明对照。
- source_word: ἐπεξέρχεται
  choice: 追究
  rationale: 该动词有追赶、追讨之意；“追究”既保留主动追索的意象，也契合过犯与惩罚的司法语域。
- source_word: ἀεὶ
  choice: 常常
  rationale: ἀεί可表示总是、始终；此处译作“常常”较自然，但仍表达持续而不落空的追究。
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: 不义之人的过犯
  rationale: παράβασις指越界、违犯；ἀδίκων指不义者。“过犯”保留道德与司法色彩。
theological_decisions:
- issue: δίκη在智慧文学报应语境中的含义
  choice: 对犯罪之人的惩罚
  alternative: 临到犯罪之人的公正裁断／犯罪之人所当受的刑罚
  rationale: 本节强调真正追究过犯的并非所凭之物的神力，而是罪所招致的司法性报应。“惩罚”清楚传达结果，同时不额外规定施罚机制。
- issue: 誓言、所凭对象与惩罚之间的关系
  choice: 保留“所凭之物”的表达，并以脚注说明也可能指誓言本身
  alternative: 誓言的力量
  rationale: 希腊语属格结构本身有歧义；不应在正文和注释中将其完全限定为偶像或某类神明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为避免“不是……而是……”长句产生错误挂接，将“常常追究……”前置为关系分句；保留司法与报应语域，不把起誓所凭对象明确限定为偶像。
