  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/020.yaml
  text: And the multitude[a], drawn by the charm of the workmanship, now regarded as an object of worship the man who a little before had been honored.
translation:
  language: zh_hans
  text: 众人被那制作工艺的精美所吸引，竟把不久前受人尊敬的那个人，如今当作敬拜的对象[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜的对象”或译“偶像”或“神圣形象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  choice: 众人
  rationale: 表达人数众多的群体，现代汉语自然，也保留集合意义。
- source_word: ἐφελκόμενον
  choice: 被……所吸引
  rationale: 体现分词所含的受动吸引之意；与工艺的悦目特质搭配自然。
- source_word: διὰ τὸ εὔχαρι τῆς ἐργασίας
  choice: 被那工艺的精美所吸引
  rationale: εὔχαρι指悦人、讨喜的特质，ἐργασία在此指制作技艺或工艺成果；“工艺的精美”简洁传达其吸引力。
- source_word: τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον
  choice: 不久前还只是受人尊敬的那个人
  rationale: 保留先前的人间尊荣与如今宗教敬拜之间的对比；“还只是”使汉语中的转折清楚，但不改变其基本指向。
- source_word: νῦν
  choice: 如今
  rationale: 与“不久前”形成鲜明的时间对照。
- source_word: σέβασμα
  choice: 敬拜的对象
  rationale: 涵盖受宗教尊崇或敬拜之物的意义，不把词义过早限定为“偶像”或具体的“圣像”。
- source_word: ἐλογίσαντο
  choice: 当作
  rationale: 自然表达“认定、视为”的宾语补足结构。
theological_decisions:
- issue: σέβασμα所指受谴责行为的性质
  choice: 译为“敬拜的对象”，表明原先仅受尊敬的人后来被赋予宗教敬拜地位。
  alternative: 可译为“偶像”或“神圣形象”。
  rationale: 希腊词可指受崇敬或敬拜之物；宽泛译法保留经文对从尊敬人到敬拜形象这一转变的批判，同时避免把具体形态解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“竟”传达语境中从人间尊敬转为宗教敬拜的反常推进；句序按现代汉语调整，同时保留“不久前—如今”的修辞对照。
