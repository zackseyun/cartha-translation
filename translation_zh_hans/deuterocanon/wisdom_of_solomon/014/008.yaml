base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/008.yaml
  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: zh_hans
  text: 但人手所造之物是受咒诅的[a]；它和造它的人都受咒诅，因为造它的人在制作它，这可朽坏之物却被称为神[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可更明确地译作“人手所造的偶像”。希腊语直译为“人手所造之物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被称为一个神”。
    reason: alternative_reading
lexical_decisions:
- source_word: χειρόποιητον
  choice: 人手所造之物
  rationale: 直译其“由手制成”的含义，不在正文中直接增添“偶像”一词；上下文已足以表明所指。
- source_word: ἐπικατάρατον
  choice: 受咒诅的
  rationale: 表达处于咒诅之下的状态，保留原文庄重而强烈的审判语气。
- source_word: ὁ ποιήσας αὐτό
  choice: 造它的人
  rationale: 清楚表达分词短语的施事含义，同时不额外强调原文未明说的身份。
- source_word: ἠργάζετο
  choice: 动手制作了它
  rationale: 兼顾“劳作、加工”的过程意味及现代汉语的自然表达，并借“动手”呼应前文“人手所造”。
- source_word: φθαρτὸν
  choice: 可朽坏之物
  rationale: 突出该物会败坏、毁灭的性质，与它竟被赋予神的称号形成鲜明反差。
- source_word: θεὸς ὠνομάσθη
  choice: 被称为神
  rationale: 保留原文将可朽坏之物称作“神”的讽刺和神学张力，不在正文中限定为众多神明中的“一个神”。
theological_decisions:
- issue: 是否在正文中明确译作“偶像”
  choice: 保留“人手所造之物”
  alternative: 人手所造的偶像
  rationale: 原文使用较宽泛的 χειρόποιητον，而非明确的“偶像”名词；保留其字面修辞，使谴责聚焦于这对象本是人造之物。
- issue: θεὸς 是否译为“神”或“一个神”
  choice: 神
  alternative: 一个神
  rationale: 原文无冠词，但重点在于可朽坏之物竟得了“神”的称号；“被称为神”在汉语中更自然，也避免过度限定为多神体系中的一员。
- issue: 如何呈现 ὁ μὲν…τὸ δὲ 的对照
  choice: “那人动手制作了它，这可朽坏之物却被称为神”
  alternative: “一方制作，另一方却被称为神”
  rationale: 明确保留制作者与受造物之间的对照，并用“却”传达原文的反差，不把句法关系解释得过度抽象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受咒诅”保留宗教与审判语域；后半句以“却”凸显人造、可朽坏之物竟被称为神的讽刺性对照。
