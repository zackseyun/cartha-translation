base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/001.yaml
  text: Again[a], someone preparing to sail and about to pass through wild waves boards more fragile wood than the ship that carries him.
translation:
  language: zh_hans
  text: 又有人准备出海，即将穿越狂暴的波涛，却登上一块比承载他的船更不结实的木头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更不结实”也可译作“更腐朽”。希腊词既可表示结构脆弱、不牢固，也可表示朽坏。
    reason: 保留σαθρότερον的词义幅度及其比较语气。
lexical_decisions:
- source_word: πλοῦν / Ἰλοῦν
  choice: 准备出海
  rationale: 所给文本开头的“Ἰλοῦν”在语境中显然具有航海含义；结合στελλόμενος，译为自然的现代汉语“准备出海”，同时不把动作提前说成已经启航。
- source_word: τις
  choice: 有人
  rationale: 不定代词指一个具有代表性的人；汉语“有人”自然保留其不定性，无须添加原文未强调的性别。
- source_word: πάλιν
  choice: 又
  rationale: 承接上文，再举一例；“又”简洁自然。
- source_word: ἄγρια κύματα
  choice: 狂暴的波涛
  rationale: ἄγρια描写波浪凶猛、难以驾驭；“狂暴”保留鲜明意象，“波涛”符合庄重叙述语体。
- source_word: διοδεύειν
  choice: 穿越
  rationale: 表达从汹涌波浪中经过、横越的动作。
- source_word: τοῦ φέροντος αὐτὸν πλοίου
  choice: 承载他的船
  rationale: 保留船作为运载主体的关系，并以现代汉语清楚表达。
- source_word: σαθρότερον
  choice: 更不结实
  rationale: 该比较级可指结构不牢、脆弱或腐朽；“更不结实”保留广义和比较关系，不武断限定为已经腐烂。
- source_word: ξύλον
  choice: 一块……木头
  rationale: ξύλον本义为木材或木制之物；量词“一块”使汉语通顺，同时保留原文刻意以“木头”称呼它的修辞效果。
- source_word: ἐπιβᾶται
  choice: 登上
  rationale: 依照所给希腊文本的ἐπιβᾶται，译作踏上、登上，而不改从其他文本可能出现的“呼求”。
theological_decisions:
- issue: σαθρότερον ξύλον的比较含义
  choice: 比承载他的船更不结实的木头
  alternative: 比承载他的船更腐朽的木头
  rationale: 原词兼有不牢固、脆弱和腐朽等含义。正文采用涵盖面较广的“不结实”，脚注保留“腐朽”这一真实可能，避免过度确定具体物理状态。
- issue: 不定主语τις
  choice: 有人
  alternative: 一个男人
  rationale: 这里是在提出代表性事例，并未以性别为论点；现代汉语“有人”准确对应不定代词，也不消除任何与经文论旨有关的信息。
- issue: ἐπιβᾶται所表达的动作
  choice: 登上
  alternative: 呼求
  rationale: 严格依照用户提供且标为高置信度的翻译用希腊文本ἐπιβᾶται处理。虽然其他文本传统可能产生不同动词，正文不据此擅改所给原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“又……却……”凸显此例的反讽张力；保留“木头”与“船”的直接比较，不替原文解释其象征意义。
