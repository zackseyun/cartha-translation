base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/003.yaml
  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: zh_hans
  text: 但父啊，你的眷顾为它掌舵[a]，因为你甚至在海中也赐下道路，在波涛中赐下安全的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“操舵引航它”“引导它”；希腊语动词带有掌舵、领航的含义，与上下文的船只意象相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακυβερνᾷ
  choice: 为它掌舵
  rationale: 该动词带有驾船、领航的具体含义；上文谈到船只，因此保留航海意象，并以“它”指代语境中的船。
- source_word: πρόνοια
  choice: 眷顾
  rationale: 此词兼有预先筹划与主动照管之意；“眷顾”在现代汉语中自然庄重，也保留了这里所说上帝持续看顾的神学分量。
- source_word: πάτερ
  choice: 父啊
  rationale: 原文为直接呼语；“父啊”清楚保留对上帝的亲身称呼，同时符合现代汉语祷告式语体。
- source_word: ἔδωκας
  choice: 赐下
  rationale: 原义是“给”；对上帝而言，“赐下”自然庄重，又没有把动作具体化为原文未明说的“开辟”或“造出”。
- source_word: ὁδὸν
  choice: 道路
  rationale: 保留与“在海中”构成的鲜明意象，并与后面的 τρίβον 形成近义平行。
- source_word: τρίβον
  choice: 路径
  rationale: 用“路径”与前面的“道路”相区分，同时保留原文的平行结构。
- source_word: ἀσφαλῆ
  choice: 安全的
  rationale: 直接表达免于危险、稳妥可行的含义，现代汉语清楚易懂。
- source_word: ἐν θαλάσσῃ
  choice: 在海中
  rationale: 按原文保留介词“在”，不改成解释性的“穿过海洋”；“甚至……也”体现 καί 在此处的强调意味。
- source_word: ἐν κύμασι
  choice: 在波涛中
  rationale: 保留与“在海中”对应的介词结构；“波涛”比“波浪”更符合本句庄重而富诗意的语体。
theological_decisions:
- issue: 如何表达 πρόνοια 所指上帝的主动照管
  choice: 眷顾
  alternative: 护理；预见；照料
  rationale: “眷顾”同时容纳上帝有意的关怀与实际的引导，不把该词缩减为单纯预知，也不引入特定宗派对“神圣护理”的系统定义。
- issue: 是否保留 διακυβερνᾷ 的航海隐喻
  choice: 为它掌舵
  alternative: 治理它；引导它
  rationale: 上下文以船为对象，原动词本身具有掌舵、领航色彩；保留该隐喻能使上帝的眷顾既呈现为治理，也呈现为具体引航，而不必在两者之间作排他选择。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“但父啊”保留转折与直接呼语；以“为它掌舵”延续航海意象，以“道路／路径”和“海中／波涛中”的平行表达重现原文结构。
