base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: zh_hans
  text: 人们因住得遥远，不能当面尊敬他们，便照着从远处所见的样貌[a]，制作了一尊受尊崇的君王的清晰可见的像，为要借着这番殷勤，奉承[b]那位不在场的君王，仿佛他在场一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从远处所见的样貌”也可译作“远处的外貌”或“远望所得的样貌”。
    reason: lexical_alternative
  - marker: b
    text: “奉承”也可译作“讨好以求欢心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει
  choice: 当面
  rationale: 原义涉及亲眼看见或在眼前；本节以远隔和不在场为对照，“当面”自然地表达亲身在场之意。
- source_word: τιμᾶν
  choice: 尊敬
  rationale: 此处首先描述人对远方君王所表示的政治和社会性敬意；“尊敬”不提前加入明确的祭祀或敬拜含义。
- source_word: διὰ τὸ μακρὰν οἰκεῖν
  choice: 因他们住在远方
  rationale: 保留原因关系和空间距离；代词按上文所指的统治者或君王理解。
- source_word: τὴν πόρρωθεν ὄψιν
  choice: 那远方的容貌
  rationale: ὄψις可指所见的样貌或外观，πόρρωθεν强调从远处而来的视觉印象；译文保留这一略有含混的表达。
- source_word: ἀνατυπωσάμενοι
  choice: 摹下
  rationale: 该词表示依照原型复制、描摹或作出表象；“摹下”符合造像语境，也不限定具体媒介。
- source_word: ἐμφανῆ εἰκόνα
  choice: 清晰可见的像
  rationale: ἐμφανής突出形象显明可见，与君王本人不在场形成对照；εἰκών用宽泛的“像”，不武断限定为画像或雕像。
- source_word: τοῦ τιμωμένου βασιλέως
  choice: 受尊崇君王
  rationale: 将分词理解为被动，君王是人们尊崇的对象；此译法简洁并保留其受敬重的地位。
- source_word: τὸν ἀπόντα ὡς παρόντα
  choice: 那位不在场的君王，如同他就在场一样
  rationale: 明确保留“不在场—在场”的鲜明对照，并补出“君王”以使现代汉语指代清楚。
- source_word: κολακεύωσιν
  choice: 奉承
  rationale: 该动词含谄媚、讨好以求欢心之意；“奉承”保留作者对这种行为的批判语气。
- source_word: διὰ τῆς σπουδῆς
  choice: 借着这番热心
  rationale: σπουδή可指热心、殷勤或急切投入；这里指他们积极制作君王像的行动和态度。
theological_decisions:
- issue: 是否把τιμᾶν译成明确的宗教敬拜用语
  choice: 尊敬
  alternative: 敬拜、崇拜
  rationale: 本句直接描写的是对君王的尊敬及由此产生的造像行为；虽然上下文整体批判偶像崇拜，但此处不宜提前强化为明确的祭祀敬拜，以保留论述的发展过程。
- issue: 是否把εἰκών具体化为雕像或画像
  choice: 像
  alternative: 雕像、画像
  rationale: 希腊文没有在本句限定形象的材质或二维、三维形式；采用概括性的“像”可避免添加原文未说明的细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句中保留“远方／不在场／在场”之间的空间对照，并以“奉承”呈现原文的批判色彩；不将“像”具体限定为画像或雕像。
