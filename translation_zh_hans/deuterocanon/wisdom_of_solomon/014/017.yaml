revisions:
- from: 人们因他们住在远方，不能当面尊敬他们，便摹下那远方的容貌[a]，造出受尊崇君王清晰可见的像，好借着这番热心奉承[b]那位不在场的君王，如同他就在场一样。
  to: 人们因住得遥远，不能当面尊敬他们，便照着从远处所见的样貌[a]，制作了一尊受尊崇的君王的清晰可见的像，为要借着这番殷勤，奉承[b]那位不在场的君王，仿佛他在场一样。
  rationale: 修订明确“住得遥远”的主语为“人们”，这是本节最关键的句法与意义校正。并将“从远处所见的样貌”与“受尊崇的君王的清晰可见的像”调整为自然、完整的汉语结构。保留原文的空间和临在对照，以及“奉承”的批判性语气；未将尊敬或造像额外具体化为宗教敬拜、雕像或画像。
