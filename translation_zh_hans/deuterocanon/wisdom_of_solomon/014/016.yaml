  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
translation:
  language: zh_hans
  text: 后来，随着时间推移，这种不敬虔的习俗日益稳固，被当作法律遵守；又因暴君的命令，雕刻的像受到敬拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: 后来，随着时间推移
  rationale: εἶτα承接上文的发展次序，ἐν χρόνῳ表示经过一段时间的渐进过程；合译既自然，也保留时间推进之意。
- source_word: κρατυνθὲν
  choice: 日益稳固
  rationale: 该词为κρατύνω的不定过去时被动分词，表示某种习俗随着时间变得强固、确立；“日益稳固”体现其渐进发展。
- source_word: τὸ ἀσεβὲς ἔθος
  choice: 这种不敬虔的习俗
  rationale: ἀσεβής含有对神不敬、悖逆敬虔的宗教道德评价；ἔθος指习俗或惯例。“这种”使其与上文所述行为衔接。
- source_word: ὡς νόμος ἐφυλάχθη
  choice: 被当作法律遵守
  rationale: φυλάσσω在此是遵守、守持，ὡς νόμος表示像法律一样或当作法律；译文保留这种比拟关系，并不断言它必然是正式成文法。
- source_word: τυράννων ἐπιταγαῖς
  choice: 因暴君的命令
  rationale: τύραννος在此带有负面评价，不宜弱化为中性的“统治者”；ἐπιταγή指命令或指令。“因”表达与格所示的手段或原因。
- source_word: ἐθρησκεύετο
  choice: 受到敬拜
  rationale: 该动词表示宗教性的崇奉或敬拜；在雕像语境中，“受到敬拜”直接清楚。
- source_word: τὰ γλυπτά
  choice: 雕刻的像
  rationale: 字面指雕刻之物或雕像；“雕刻的像”保留制造方式，比直接译为“偶像”少一层解释，也比“雕刻物”更自然。
theological_decisions:
- issue: τύραννος应译作中性的统治者，还是带评价色彩的暴君
  choice: 暴君
  alternative: 统治者
  rationale: 希腊词在本段批判权力强制推行敬拜雕像的语境中具有负面色彩；“暴君”保存原文的道德评价，不另加教义判断。
- issue: τὰ γλυπτά应直译其雕刻性质，还是解释为偶像
  choice: 雕刻的像
  alternative: 偶像
  rationale: 原文突出这些对象是人工雕刻之物，而ἐθρησκεύετο已明确它们受到宗教敬拜；保留“雕刻”可避免把名词本身过度解释。
- issue: ὡς νόμος是否表示正式立法
  choice: 被当作法律遵守
  alternative: 成为法律而被遵守
  rationale: ὡς保留“如同、当作”的比较或身份认定色彩，并不必然说明该习俗已正式制定为法律；译文保存这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文由时间发展、习俗固化到政治强制的递进结构；避免使用较陈旧的“雕刻之像”或解释性更强的“偶像”。
