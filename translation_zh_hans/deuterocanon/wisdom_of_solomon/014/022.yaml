base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: zh_hans
  text: 接着，他们在认识上帝的事上误入歧途，这还不够；他们还活在无知的大战之中[a]，竟把如此多的恶事称为和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知的大战”保留了希腊原文的战争比喻，描写他们被无知支配的生活如同处在一场大战或深重冲突之中。
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
  choice: 后来
  rationale: 承接上文并推进论述；“后来”自然表达进一步的发展，不额外指定严格的时间次序或因果关系。
- source_word: οὐκ ἤρκεσεν
  choice: 还不以此为足
  rationale: 保留希腊文“不足够”的意思，同时用现代汉语自然表达前述迷误并未止住他们。
- source_word: τὸ πλανᾶσθαι
  choice: 误入歧途
  rationale: 表达认知与道德上的偏离，同时不把中间/被动形式明确限定为外力使其受迷惑。
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: 在认识上帝的事上
  rationale: γνῶσις在此关乎对上帝的真实认识；此译法比“关于上帝的知识”更符合现代汉语，又保留其关系范围。
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: 无知的大战之中
  rationale: 保留πόλεμος的战争隐喻，不将其弱化为一般的混乱或纷争；属格“无知的”仍可包含由无知造成或以无知为特征的张力。
- source_word: ζῶντες
  choice: 活在
  rationale: 以自然汉语保留分词所表达的持续处境，并与主句“称为”相连。
- source_word: τὰ τοσαῦτα κακὰ
  choice: 如此严重的恶事
  rationale: τοσαῦτα可强调程度或数量；结合语境译为“如此严重”凸显这些恶事的重大，同时不笨拙直译。
- source_word: εἰρήνην
  choice: 和平
  rationale: 直接保留原词及其与“大战”“恶事”之间的讽刺性反差，不扩展为“和平与安全”。
- source_word: προσαγορεύουσιν
  choice: 称为
  rationale: 简洁自然地表达给这些恶事冠以“和平”之名。
theological_decisions:
- issue: πλανᾶσθαι是否明确译为被动的“被引入歧途”
  choice: 误入歧途
  alternative: 被引入歧途
  rationale: 该中间/被动不定式容许较被动的理解，但经文本身重在指出他们偏离了对上帝的认识，并未明确交代使其受骗的外在主体，因此正文避免增加因果主体。
- issue: εἰρήνην是否作解释性扩充
  choice: 和平
  alternative: 安宁；和平与安全
  rationale: 原文只有“和平”。直译既保存战争与和平的尖锐反讽，也避免引入原文未明说的政治或末世论含义。
- issue: ἀγνοίας与πολέμῳ的关系是否解释为因果
  choice: 无知的大战
  alternative: 由无知引起的大战
  rationale: 希腊文属格可表示性质、领域或来源；正文保留较开放的关系，不把“无知”仅限定为战争的原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“上帝”用于θεός；以“竟”自然呈现καὶ在递进语境中的强调，并加强“恶事”与“和平”的反讽对照。正文只设一条确有助益的注释，且标记[a]已在正文出现。
