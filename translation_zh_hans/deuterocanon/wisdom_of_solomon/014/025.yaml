    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此表示全面概括；“一切”简洁保留了控诉的总体范围。
- source_word: ἐπιμὶξ ἔχει
  choice: 都混杂在一起
  rationale: 保留各种罪恶彼此混杂、无所不有的意象，也自然引出后面的罪恶清单。
- source_word: αἷμα
  choice: 流血
  rationale: 原词字面为“血”，在罪恶清单中指向流血之事；译作“流血”符合现代汉语，同时以脚注保留字面形式。
- source_word: φόνος
  choice: 杀人
  rationale: 表示非法夺取人命；“杀人”清楚、庄重，也避免“谋杀”可能带来的现代法律技术含义。
- source_word: κλοπή
  choice: 偷窃
  rationale: 准确表达盗取行为，并与清单中的其他名词性项目协调。
- source_word: δόλος
  choice: 欺骗
  rationale: 涵盖诡诈、欺哄等语义，在现代汉语中清楚自然。
- source_word: φθορά
  choice: 败坏
  rationale: 该词可指毁坏、腐化或道德沦丧；“败坏”在此保留道德和社会层面的双重意味。
- source_word: ἀπιστία
  choice: 失信
  rationale: 上下文列举社会与道德罪恶，此处较可能指不守信、不可靠，而非专指宗教上的不信。
- source_word: τάραχος
  choice: 动乱
  rationale: 表达骚动、混乱和社会失序，适合此处逐步加剧的罪恶清单。
- source_word: ἐπιορκία
  choice: 发假誓
  rationale: 具体表达违背誓言真实性的行为，比单用较生僻的“伪誓”更便于普通读者理解。
- source_word: θόρυβος ἀγαθῶν
  choice: 对何为善的混乱
  rationale: 原短语意义困难；此译体现伦理判断遭到扰乱的可能含义，同时用脚注保留“善事受扰乱”等其他可行理解。
theological_decisions:
- issue: ἀπιστία在罪恶清单中的含义
  choice: 失信
  alternative: 不信；不忠
  rationale: 本节语境侧重偶像崇拜所造成的人际和社会败坏，因此采用关系与伦理层面的“失信”；但不否认该词在其他语境中可有“不信”的宗教含义。
- issue: θόρυβος ἀγαθῶν所指的混乱
  choice: 对何为善的混乱
  alternative: 善事受到扰乱；因福祉而喧嚷
  rationale: 属格结构容许多种关系，且θόρυβος可指喧嚷、骚动或混乱。正文采用适合罪恶清单的伦理迷乱读法，脚注明确保留其他可能性，不把难解处定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。罪恶清单尽量保持短促并列的节奏；对两个需要说明的希腊语表达使用脚注，正文不以过度解释消除原文的歧义。
