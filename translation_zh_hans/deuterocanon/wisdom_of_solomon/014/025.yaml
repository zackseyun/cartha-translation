  text: 'and everything is mixed together: blood and murder, theft and deceit, corruption, faithlessness, turmoil, perjury, and confusion over what is good,'
translation:
  language: zh_hans
  text: 一切都混杂在一起：流血与杀人[a]、偷窃与欺骗、败坏、失信、动乱、发假誓，以及对何为善的混乱[b]。
