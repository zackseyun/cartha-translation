base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: zh_hans
  text: 因为人的虚荣，它进入了世间[a][b]；正因如此，它们的结局被定为短暂[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”在希腊文中没有明说；从上下文看，是指偶像或偶像崇拜的兴起。
    reason: alternative_reading
  - marker: b
    text: “人的虚荣”也可译作“人的浮夸”或“人对虚名的追求”；原词指空洞的自我荣耀。
    reason: lexical_alternative
  - marker: c
    text: “被定为”是被动表达；原文没有明说是谁定下了它们短暂的结局。
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ ἀνθρώπων
  choice: 人的虚荣
  rationale: 该与格在此表示原因或凭借；“虚荣”自然表达因追求空洞荣耀而自矜的含义，“人的”保留属格限定。
- source_word: εἰσῆλθεν εἰς κόσμον
  choice: 它进入了世间
  rationale: 动词为单数，主语由上下文补足；用“它”避免在正文中直接解释为“偶像崇拜”。κόσμος译作“世间”，符合此处人类世界的语境。
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 明确表达前因所导致的后果，并以“正”体现原句连接的强调感。
- source_word: σύντομον ... τέλος
  choice: 结局……短暂
  rationale: τέλος保留为宽泛的“结局”，不强化为“毁灭”；σύντομον表示持续时间短，译作“短暂”自然且准确。
- source_word: αὐτῶν
  choice: 它们的
  rationale: 保留希腊文复数，按上下文指前述偶像或形像，不将其压平为单数。
- source_word: ἐπενόηθη
  choice: 被定为
  rationale: 保留被动结构和未说明的施事者；“定为”表达被筹定、设定的含义，同时比“被设计”更符合现代汉语。
theological_decisions:
- issue: εἰσῆλθεν的隐含主语
  choice: 正文用“它”，由上下文确定所指。
  alternative: 明确译作“偶像崇拜进入了世间”或按上下文采用复数“偶像进入了世间”。
  rationale: 希腊文没有明说主语；代词是最低限度的补足，可保留原文含混，不在正文中锁定解释。
- issue: ἐπενόηθη的施事者
  choice: 采用未说明施事者的被动式“被定为”。
  alternative: 明确译作“上帝给它们定下了短暂的结局”，或用非人称表达“它们注定很快消亡”。
  rationale: 原文没有点明施事者；不应在正文中擅自加入上帝，也不应把审慎的被动式改成更强的宿命表述。
- issue: αὐτῶν所指
  choice: 保留复数“它们”，让上下文指向偶像或形像。
  alternative: 按隐含单数主语译作“它的”。
  rationale: 希腊文明确使用复数代词；保留数的一致性可呈现原文从隐含单数现象转向具体复数对象的张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“世间”较“世界”更适合“进入人类生活领域”的语境；分号保留原句前因后果的紧密关系。所有解释性补足均置于脚注，正文保留隐含主语、复数指代和未明施事者所形成的张力。
