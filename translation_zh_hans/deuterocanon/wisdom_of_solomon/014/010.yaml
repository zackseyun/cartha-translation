  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/010.yaml
  text: For the thing done[a], together with the one who did it, will be punished.
translation:
  language: zh_hans
  text: 因为所造之物[a]必和造它的人一同受惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所做之事必和做这事的人一同受惩罚。”按上下文，“所造之物”指制成的偶像。
    reason: 保留τὸ πραχθέν和τῷ δράσαντι可按一般“做、行”理解的词义歧义，同时说明本译文采用“制造”义的语境依据。
lexical_decisions:
- source_word: καὶ γάρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语用“因为”自然表达其解释性、因果性的连接作用。
- source_word: τὸ πραχθέν
  choice: 所造之物
  rationale: 该带冠词的过去时被动分词本可泛指“所做之事”，但上下文谈论偶像及其制造，因而这里更可能指被造出的对象。“所造之物”保留结果或对象意味，又不在正文中直接增添“偶像”一词。
- source_word: σὺν
  choice: 和……一同
  rationale: 明确表达被造之物与制造者共同承受惩罚的关联。
- source_word: τῷ δράσαντι
  choice: 造它的人
  rationale: δράω通常可指“做、行”，但与τὸ πραχθέν配对，并处于制造偶像的语境中，译作“造它的人”能自然呈现对象与制造者的关系。
- source_word: κολασθήσεται
  choice: 必……受惩罚
  rationale: 未来被动式表达将临到的惩处；“受惩罚”是清楚、庄重的现代汉语，“必”体现未来陈述的确定性。
theological_decisions:
- issue: 是否在正文中明确把所造之物称为“偶像”
  choice: 保留较宽泛的“所造之物”
  alternative: 偶像；所做之事
  rationale: 上下文清楚指向偶像，但本句希腊文没有使用“偶像”这个名词。正文不将语境信息替换成原文未明说的专名，同时用脚注说明所指。
- issue: τὸ πραχθέν与τῷ δράσαντι应按“制造”还是一般的“做”来理解
  choice: 按语境译为“所造之物”和“造它的人”
  alternative: 所做之事和做这事的人
  rationale: 原词容许一般的“做”义，因此保留脚注中的另一译法；但偶像制造的近距离语境及两个表达之间的对象—行动者对应关系，使“制造”义更切合本节。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“所造之物”略具书面色彩，适合智慧文学的论断语气；“和……一同受惩罚”清楚表达共同受罚。脚注标记[a]已置于相关短语之后。
