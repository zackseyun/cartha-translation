  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/012.yaml
  text: For the beginning of sexual immorality is the devising of idols[b][a], and the invention of them is the corruption of life.
translation:
  language: zh_hans
  text: 因为淫乱的开端是对偶像的构想，而偶像的创制则是生命的败坏[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“淫乱的根源是对偶像的构想。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“偶像的创制是生命的毁灭”，或“是生命的覆亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ
  choice: 开端
  rationale: 既保留“开始、起源”的基本意义，也不把这里的因果意味解释得过死。
- source_word: πορνείας
  choice: 淫乱
  rationale: 该词指不正当的性行为；译作“淫乱”简洁庄重，也保留上下文可能带出的属灵不忠联想，却不将其直接等同于偶像崇拜。
- source_word: ἐπίνοια
  choice: 构想
  rationale: 该词可指设想、筹划或构思；“构想”能体现偶像出于人的意念，并与后句“发明”形成对应。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 在犹太希腊语的反偶像语境中，该词明确指供崇拜的偶像，而非中性的形象。
- source_word: εὕρεσις
  choice: 发明
  rationale: 虽可表示“发现”，此处与人的构想并列，强调偶像是人为创制出来的；“发明”最能传达这一点。
- source_word: φθορὰ
  choice: 败坏
  rationale: 该词兼有腐化、毁坏和灭亡之意；“败坏”保留道德与生命受损的双重意味，避免缩窄为单纯的物质毁灭。
- source_word: ζωῆς
  choice: 生命
  rationale: 直译其属格关系，使“生命的败坏”保持原文凝练而宽广的表达。
theological_decisions:
- issue: πορνεία应按性方面的淫乱理解，还是直接解释为属灵不忠或偶像崇拜
  choice: 译作“淫乱”
  alternative: 不忠；偶像崇拜
  rationale: 原文把“构想偶像”说成淫乱的开端，二者在句法上并未等同。保留字面所指，才能维持作者的因果陈述，同时让上下文自然承载比喻性的回响。
- issue: φθορὰ ζωῆς应译为宽泛的“生命的败坏”，还是明确解释为生命遭毁灭
  choice: 生命的败坏
  alternative: 生命的毁灭；人生的 ruin（覆亡）
  rationale: 原文措辞简练，既可涉及道德腐化，也可涉及毁灭性后果；采用较宽的表达可保留这种神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式尽量保留希腊文两半句的平行结构与箴言式凝练；用“则”凸显后半句对应关系，不额外补入具体因果机制。
