    rationale: τελετάς 指宗教礼仪、仪式，可包括祭仪但并不必然指献祭；用“礼仪”较稳妥。
  - severity: low
    issue: 句首“因为，”的标点及前半句语序不够自然。
    rationale: 删除逗号并调整为“被……所折磨，日渐憔悴”，可保持庄重文体并改善可读性。
