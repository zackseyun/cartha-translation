  source_fidelity: 译文总体准确传达父亲因孩子过早离世而哀痛憔悴、制作死者形像、继而以神相待并向属下传授仪式的叙述。惟“这当时已经死去的人”在现代汉语中不够自然，且“祭礼”可能把 τελετάς 的一般宗教仪式义缩窄为祭祀；宜作小幅调整。
  naturalness: “因为，”后的逗号不合现代汉语习惯；“承受着……，日渐憔悴”的衔接略显滞涩。“为那……孩子所致的过早哀痛所折磨”更顺畅，也清楚呈现哀痛与憔悴的因果关系。
  terminology: εἰκόνα 译“形像”保持中性，合乎原文；ὡς θεόν 译“当作神来尊崇”准确。μυστήρια 译“秘仪”、τελετάς 译“礼仪”既保留古代宗教语境，也不无据地限定为献祭。
