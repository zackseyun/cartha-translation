base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: zh_hans
  text: 因为一个父亲被那迅速被夺去的孩子所致的过早哀痛所折磨，日渐憔悴；他为那当时已死去的人制作了一尊形像，如今却把他当作神来尊崇，又把秘仪和礼仪传授给自己权下的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迅速被夺去”也可译作“突然被夺去”或“被攫去”。希腊原文同时以“过早”形容这场哀痛，突出孩子未到应有的时候便死去。
    reason: lexical_alternative
  - marker: b
    text: “秘仪和礼仪”指古代崇拜中隐秘的、可能带有入门性质的宗教仪式与礼典。
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: 过早的丧亲之痛
  rationale: ἀώρῳ表示“不合时、未到时候”，在此指孩子早逝所带来的非正常时序之哀痛；译作“过早的丧亲之痛”，既保留时间意味，也符合现代汉语表达。
- source_word: τρυχόμενος
  choice: 日渐憔悴
  rationale: 该分词表示被不断损耗、折磨或消磨；“日渐憔悴”自然传达持续受哀痛消磨的状态，同时不过度限定为纯粹肉体痛苦。
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: 那迅速被夺去的孩子
  rationale: ταχέως保留“迅速、很快”的意味，ἀφαιρεθέντος直译为“被夺去”，在语境中婉指死亡；τέκνου不限定性别，故译“孩子”而非“儿子”。
- source_word: εἰκόνα
  choice: 像
  rationale: 采用中性的基本义“像、形像”，不预先译成带有贬义判断的“偶像”，让后文对其神化的描述显明问题。
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: 这当时已经死去的人
  rationale: 保留τότε“当时”与νῦν“如今”的修辞对照，也明确这位后来被奉为神者原是已经死去的人。
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: 如今却把他当作神来尊崇
  rationale: ὡς θεόν表示按神的身份对待；“当作神”直接保留神化之意，“却”显出与“当时已经死去”之间的反差。
- source_word: παρέδωκεν
  choice: 传给
  rationale: 该动词可指交付或传承；此处是把宗教规制传给属下，“传给”简明自然，并未额外断定是首次设立还是世代传承。
- source_word: τοῖς ὑποχειρίοις
  choice: 自己权下的人
  rationale: 原词指在某人手下或控制之下的人；“自己权下的人”可涵盖家属、仆从或臣属，不武断限定其社会身份。
- source_word: μυστήρια καὶ τελετάς
  choice: 奥秘礼仪和祭礼
  rationale: μυστήρια指具有隐秘性或入门性质的宗教仪式，τελετάς指祭仪、宗教礼典；此译保留两词的并列及古代崇拜语境。
theological_decisions:
- issue: 偶像崇拜语境中θεός的译法
  choice: 神
  alternative: 神明；具有神性者
  rationale: 经文所说的是把死者按神的身份尊崇，并非承认其为真神；“当作神”准确保留这一神化行为，同时不加入宗派性解释。
- issue: εἰκών是否直接译为“偶像”
  choice: 像
  alternative: 偶像；形像
  rationale: 原词本身是中性的“像”；本节随后才说明人如何把死者当神尊崇，因此不在前半句提前加入“偶像”的评价色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为”承接上文的因果论述；以分号划分父亲受哀痛折磨、制作形像，以及后来神化死者并传授礼仪三个推进层次。保留“当时—如今”的时间对照，并避免用“儿子”“臣民”等词过度限定原文。
