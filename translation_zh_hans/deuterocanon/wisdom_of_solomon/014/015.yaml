revisions:
- from: 因为，有个父亲为那迅速被夺去的孩子承受着过早的丧亲之痛[a]，日渐憔悴；他为这当时已经死去的人制作了像，如今却把他当作神来尊崇，又把奥秘礼仪和祭礼[b]传给自己权下的人。
  to: 因为一个父亲被那迅速被夺去的孩子所致的过早哀痛所折磨，日渐憔悴；他为那当时已死去的人制作了一尊形像，如今却把他当作神来尊崇，又把秘仪和礼仪传授给自己权下的人。[a][b]
  rationale: 修订仅改善汉语表达并避免缩窄原文。“过早哀痛”对应 ἀώρῳ πένθει，“被……所折磨，日渐憔悴”对应 τρυχόμενος；“那当时已死去的人／如今”保留 τότε 与 νῦν 的时间对照。“一尊形像”自然呈现 εἰκόνα，未预断为“偶像”。脚注锚点保留且分别紧随其所说明的“迅速被夺去”与“秘仪和礼仪”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:33:23Z'
review_pass:
