  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/019.yaml
  text: For he[a], perhaps wishing to please the ruler, forced the likeness by his skill into a more beautiful form[b];
translation:
  language: zh_hans
  text: 因为他或许想讨掌权者[a]的欢心，便凭自己的技艺，强行把那肖像修饰得更为俊美[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统治者”“有权势的人”。
    reason: κρατοῦντι泛指行使权力的人，未限定其具体头衔。
  - marker: b
    text: 直译“强使那形象趋向更美”；意思是工匠把肖像美化得超过通常的如实相似。
    reason: 原文表达从相似向更美的方向强行加工，兼有写实与理想化之间的张力。
lexical_decisions:
- source_word: τάχα
  choice: 或许
  rationale: 此处表示对雕刻者动机的推测，而非时间上的“很快”。
- source_word: κρατοῦντι
  choice: 掌权者
  rationale: 该分词指正在行使权力、居于统治地位的人；“掌权者”既贴近原文，也不把具体政治身份说得过窄。
- source_word: βουλόμενος ἀρέσαι
  choice: 想讨……的欢心
  rationale: 表达有意取悦权势人物的目的；较“想使……喜悦”更符合现代汉语，同时保留迎合意味。
- source_word: ἐξεβιάσατο
  choice: 硬是……做得
  rationale: 该动词含有用力推进、超出自然程度的意味；“硬是”保留这种强行加工的语气，但不直接加入“歪曲”等道德判断。
- source_word: τῇ τέχνῃ
  choice: 凭自己的技艺
  rationale: τέχνη在这里指雕刻者所运用的工艺或技巧；“凭自己的技艺”清楚表达手段。
- source_word: τὴν ὁμοιότητα
  choice: 肖像
  rationale: ὁμοιότης本义为相似、 likeness；结合上文制作人物形象的语境，“肖像”自然地指按本人样貌制作的形象，同时不明说其为偶像。
- source_word: ἐπὶ τὸ κάλλιον
  choice: 做得更加俊美
  rationale: 比较级指朝更美、更好看的方向加工；“更加俊美”适合人物肖像，并保留原文所说的理想化美化。
theological_decisions:
- issue: 反偶像语境中对工匠行为的评价
  choice: 描述工匠为取悦掌权者而美化肖像，不在正文中另加明确谴责词语。
  alternative: 把ἐξεβιάσατο译作“歪曲了”或“弄得失真”，以突出批判意味。
  rationale: 全段确在批判偶像崇拜，但本节直接叙述的是肖像受政治迎合驱动而被美化的过程。译文以“硬是”保留不自然用力的意味，却不把上下文中的道德结论提前写进本句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“讨……的欢心”自然呈现迎合权势者的动机；“硬是”传达ἐξεβιάσατο的强行意味，又避免过度解释。句末保留分号，以衔接下一节尚未说完的论述。
