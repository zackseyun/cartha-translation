base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
translation:
  language: zh_hans
  text: 因此，列国的偶像也必遭查察[a]；因为它们在上帝所造之物中成了可憎之物，成了使人的心灵跌倒的绊脚石，也成了套住愚昧人双脚的网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭查察”也可译为“有临到（带着追究意味的察看）”。这里按上下文含有追究、惩治的意味。
    reason: 保留ἐπισκοπή兼有临到、察看及在语境中导向追究或惩治的词义幅度。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然、简洁地承接上文所作的推论。
- source_word: ἐν εἰδώλοις ἐθνῶν
  choice: 列国的偶像
  rationale: 保留ἐθνῶν的属格关系；“列国”符合智慧文学语境，也不将其限缩为某一族群。
- source_word: ἐπισκοπὴ ἔσται
  choice: 也必受察验
  rationale: ἐπισκοπή可指巡视、察看或临到；本句语境带有惩治意味。“受察验”保留其察看与问责的张力，而不直接将含义收窄为“受审判”。
- source_word: ἐν κτίσματι θεοῦ
  choice: 在上帝所造之物中
  rationale: κτίσμα可指受造之物；这里采用集合性的自然汉语，保留ἐν所表达的范围。
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: 成了可憎之物
  rationale: 保留宗教及道德层面的强烈厌恶意味，同时符合现代汉语表达。
- source_word: σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: 使人心灵绊倒之物
  rationale: 保留σκάνδαλον使人失足、跌倒的隐喻；ψυχή在此译作“心灵”，传达人的内在生命，ἀνθρώπων则以泛指的“人”表达。
- source_word: παγίδα ποσὶν ἀφρόνων
  choice: 套住愚昧人双脚的网罗
  rationale: 保留网罗与脚的具体意象；“愚昧人”在智慧文学中兼有道德与认知层面的含义。
theological_decisions:
- issue: ἐπισκοπή在惩治语境中的力度
  choice: 也必受察验
  alternative: 也必受惩罚／也必受审判
  rationale: 上下文表明这次察验带有不利后果，但原词本身并不只等于“审判”。正文保留察看、追究与惩治之间的语义张力，脚注说明其语境含义。
- issue: ψυχαῖς ἀνθρώπων所指的人群与层面
  choice: 人的心灵
  alternative: 世人的灵魂／人的生命
  rationale: ἀνθρώπων泛指人类，并非专指男性；ψυχαῖς在此涉及人的内在生命。“人的心灵”在现代普通话中自然，也未将其固定为某种特定灵魂论。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“可憎之物—绊倒之物—网罗”保留原文三重递进结构，并保留“脚”的具体隐喻。
