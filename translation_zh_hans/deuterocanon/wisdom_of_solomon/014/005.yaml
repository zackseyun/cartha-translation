  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
translation:
  language: zh_hans
  text: 但你不愿让你智慧的作为闲置；因此，人甚至把性命托付给一小块木头，乘木筏渡过汹涌的波涛，得以安然脱险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλεις
  choice: 你愿
  rationale: 表达上帝主动的意愿和旨意，既贴近希腊语，也比单纯表示将来的译法更准确。
- source_word: μὴ ἀργὰ εἶναι
  choice: 不致闲置
  rationale: 保留ἀργός“闲着、不活动”的基本意象，同时自然传达智慧的作为并非不起作用。
- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: 你智慧的作为
  rationale: 保留属格关系及其神学张力，不把“智慧”过度解释为独立位格或仅仅抽象的明智安排。
- source_word: ἐλαχίστῳ ξύλῳ
  choice: 一小块木头
  rationale: ξύλον在此指构成简陋水上工具的木材；ἐλάχιστος强调其微小、脆弱，现代汉语以“一小块木头”表达最自然。
- source_word: πιστεύουσιν … ψυχάς
  choice: 把性命托付给
  rationale: 动词与ψυχάς连用表示将自身生命交托出去；“性命”符合海上冒险的语境，避免“灵魂”引起不必要的二元论联想。
- source_word: κλύδωνα
  choice: 汹涌的波涛
  rationale: 该词指海上的巨浪或涌浪；此译既呈现危险的海况，也符合现代汉语的庄重叙述。
- source_word: σχεδίᾳ
  choice: 乘木筏
  rationale: 明确译出简陋的筏子，并以“乘”自然表达工具格用法。
- source_word: διεσώθησαν
  choice: 得以安然脱险
  rationale: 体现复合动词所含的“从危险中安全通过”之意，并保留被动语态暗示的蒙保全意味，而不擅自补出施事者。
theological_decisions:
- issue: “你智慧的作为”所指及海上获救中的神圣护理
  choice: 保留对上帝的第二人称称呼，并将安全脱险与其智慧有效的作为相联系，但不进一步界定“智慧”的位格性质。
  alternative: 把“智慧”明确译作独立行动的位格，或仅释为上帝抽象的明智安排。
  rationale: 希腊文直接对上帝说话，并提到“你智慧的作为”；原文容许一定程度的人格化和神学张力，译文不应替作者作更强的形而上判断。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“不致闲置”保留原文意象；“性命”“木筏”“汹涌的波涛”“安然脱险”使航海场景清楚可感。原文无必须以脚注保留的文本异读或不可兼容歧义，因此正文未设脚注。
