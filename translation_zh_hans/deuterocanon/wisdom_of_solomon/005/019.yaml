  text: He will take holiness as an unconquerable shield,[a]
translation:
  language: zh_hans
  text: 他必以圣洁为不可战胜的盾牌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虔敬”或“敬虔”。
    reason: 词义存在合理的翻译选择；ὁσιότης可强调在上帝面前的圣洁，也可表达虔敬或敬虔。
lexical_decisions:
- source_word: λήμψεται
  choice: 必拿起
  rationale: 这是 λαμβάνω 的将来时中间语态；在武装的语境中，“拿起”自然表现装备自己的动作，比“领受”更符合盾牌的意象。
- source_word: ἀσπίδα
  choice: 盾牌
  rationale: 这是该词在军事语境中的通常含义；“盾牌”现代、清楚，也不带古奥色彩。
- source_word: ἀκαταμάχητον
  choice: 不可战胜的
  rationale: 该词表示不能被击败或压倒；“不可战胜的”保留战斗意象，并自然修饰盾牌。
- source_word: ὁσιότητα
  choice: 圣洁
  rationale: 该词指在上帝面前虔敬、合宜的圣洁品格；“圣洁”能保留其较广的道德与宗教内涵，并适合本段把德性描写为军装的语境。
theological_decisions:
- issue: ὁσιότητα应译作较广义的道德与宗教品质，还是较偏重敬虔表现的词语。
  choice: 圣洁
  alternative: 虔敬；敬虔
  rationale: “圣洁”保留此德性词广泛的神学和道德力量，不把它缩减为外在宗教表现；脚注同时保留“虔敬、敬虔”的真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必拿起……作……”保持经文的宣告语气和武装意象；脚注标记已在正文中对应出现。
