base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/022.yaml
  text: And hailstones full of stony wrath will be hurled, and the water of the sea will rage against them; and rivers will suddenly overwhelm them.
translation:
  language: zh_hans
  text: 满含石头般烈怒的冰雹将被投掷下来；海水要向他们发怒，江河要猛然把他们淹没。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πετροβόλου θυμοῦ
  choice: 满含石头般烈怒
  rationale: πετροβόλου 字面与“投石、石头”相关，修饰 θυμοῦ（烈怒）；保留原文突兀而有力的“石头般烈怒”意象，不把它解释成投石器或单纯的猛烈力量。介词 ἐκ 在此结构中的确切作用不够清楚，译文按冰雹所带的烈怒来表达。
- source_word: πλήρεις ῥιφήσονται χάλαζαι
  choice: 冰雹将被投掷下来
  rationale: 保留 πλήρεις 所表达的“满含”，并以被动态“被投掷”对应 ῥιφήσονται；“下来”符合汉语中冰雹降落的自然表达。
- source_word: ἀγανακτήσει κατʼ αὐτῶν ὕδωρ θαλάσσης
  choice: 海水要向他们发怒
  rationale: ἀγανακτέω 表示愤怒、激愤；保留海水人格化的审判图景，κατʼ αὐτῶν 译为“向他们”。
- source_word: ποταμοὶ δὲ συγκλύσουσιν ἀποτόμως
  choice: 江河要猛然把他们淹没
  rationale: συγκλύζω 表示洪水般冲击、淹没；ἀποτόμως 可指突然、猛烈或严厉，此处以“猛然”兼顾突发性与冲击力。宾语由上句“他们”承接补出，使中文完整自然。
theological_decisions:
- issue: 自然力量是否仅作比喻
  choice: 保留冰雹、海水和江河作为人格化审判力量的表述
  alternative: 将其解释性改写为上帝借自然施行审判
  rationale: 原文直接描绘受造界向恶人发怒并将其淹没，没有明说施动者；译文不额外补入神学解释，以保留原文的诗性张力。
- issue: πετροβόλου θυμοῦ 的含义
  choice: 石头般烈怒
  alternative: 投石器般的烈怒／猛烈的力量
  rationale: 该短语罕见且意象浓缩；采用较贴近词形的译法，避免把真实的词义张力单一化为器械或抽象力度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；保留原文自然界人格化和猛烈审判的诗歌意象。分号对应两个紧密相连但不同的画面；不添加原文没有明示的施动者。
