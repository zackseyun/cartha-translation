base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: zh_hans
  text: 不法与毁灭的路径充满了我们[a]；我们又穿越了无路可通的荒野[b]，却不认识主的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译为“我们被不法与毁灭的路径充满”。希腊文中“不法”和“毁灭”可理解为修饰“路径”的抽象名词。
    reason: lexical_alternative
  - marker: b
    text: “无路可通的荒野”也可译作“无法通行的荒漠”或“没有路径的旷野”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομίας … τρίβοις καὶ ἀπωλείας
  choice: 不法与毁灭之路
  rationale: 两个属格抽象名词描述“路径”的性质，既指背离正道，也含通向毁灭的意味。“不法”保留ἀνομία的道德与律法色彩，“毁灭”对应ἀπώλεια的严重后果。
- source_word: ἐνεπλήσθημεν
  choice: 我们走过的尽是
  rationale: 希腊文直译为“我们被……路径充满”，在汉语中意象生硬；用“走过的尽是”表达其充斥、遍及之意，并与全节道路意象自然衔接。直译形式在脚注中保留。
- source_word: διωδεύσαμεν
  choice: 穿越了
  rationale: 准确表达从中经过、横越的动作，简洁而符合现代汉语。
- source_word: ἐρήμους ἀβάτους
  choice: 无路可通的荒野
  rationale: ἐρήμους可指荒野或荒漠，ἀβάτους可指无路、难以进入或无法通行；此译保留环境荒凉和没有通路两层含义。
- source_word: τὴν … ὁδὸν Κυρίου
  choice: 主的道路
  rationale: 保留圣经中“道路”的比喻开放性，既可指主所定的生活道路，也不完全排除路线、行程的表层意象。
- source_word: οὐκ ἔγνωμεν
  choice: 不认识
  rationale: “认识”既可表达不知道，也可带有未曾辨认、未曾亲知的意味，比单纯“不知道”更能保留γινώσκω在语境中的张力。
theological_decisions:
- issue: “主的道路”的性质
  choice: 保留“主的道路”这一未加解释的道路隐喻
  alternative: 明确译为“主所喜悦的生活方式”或“主所指定的道路”
  rationale: 上下文强烈暗示道德和属灵层面的生活道路，但原文仍使用ὁδός，与前面的路径和荒野形成连续意象；不在正文中将其窄化。
- issue: “不认识”是否表示无知或拒绝遵行
  choice: 译作“不认识”，不判定是单纯无知、未能辨认，还是没有实际遵行
  alternative: 译作“不遵行”或“没有找到”
  rationale: 原文只明确表达οὐκ ἔγνωμεν；把它改成“不遵行”会加入解释，把它改成“没有找到”则改变认知动词的意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不法”“毁灭”“主的道路”保留经文的道德力度与道路意象；通过“走过的尽是”化解希腊文直译在汉语中的生硬，同时以脚注公开原文结构。
