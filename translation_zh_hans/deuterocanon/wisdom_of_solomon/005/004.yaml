  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/004.yaml
  text: and as a proverb of reproach among fools[a]. We considered his life madness, and his end dishonorable[b];
translation:
  language: zh_hans
  text: 我们这些愚昧人又把他当作受人讥讽的话柄[a]；我们曾认定他的一生是疯狂，他的结局毫无尊荣[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受人讥讽的俗语”。希腊文παραβολή在这里可指流传于人口、用来嘲弄人的说法，并不只表示狭义的“比喻”。
    reason: lexical_alternative
  - marker: b
    text: “结局”也可译作“死亡”；这里可能特指他死去的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραβολὴν
  choice: 话柄
  rationale: 这里不是狭义的“比喻”，而是指流传于人口、用来议论或讥讽人的说法；“话柄”在现代汉语中自然地表达这种公开嘲弄的语境。
- source_word: ὀνειδισμοῦ
  choice: 受人讥讽的
  rationale: 该属格限定 παραβολή，表示这种说法带有责骂、羞辱和嘲弄的性质；译作“受人讥讽的”可与“话柄”自然搭配。
- source_word: οἱ ἄφρονες
  choice: 我们这些愚昧人
  rationale: 结合第一人称复数动词和上下文，这是作恶者回顾自己先前判断时的自我指认，并非叙述者另行评论一群愚昧人。
- source_word: ἐλογισάμεθα
  choice: 我们曾认定
  rationale: 该动词表示经过估量而作出的判断；“认定”比一般的“以为”更能体现其评断意味，“曾”则显出这是事后的追悔。
- source_word: βίον
  choice: 一生
  rationale: βίος在此可指此人所度的生活或整个人生历程；“一生”简洁自然，同时保留这两层含义。
- source_word: μανίαν
  choice: 疯狂
  rationale: 该词表示狂乱、疯癫；“疯狂”保留说话者从前带有轻蔑意味的强烈判断。
- source_word: τελευτὴν
  choice: 结局
  rationale: 该词既可泛指生命的终局，也可具体指死亡；正文用“结局”保留希腊文的语义宽度，并在脚注说明具体可能。
- source_word: ἄτιμον
  choice: 毫无尊荣
  rationale: 该词基本义是“没有荣誉、不受尊重”。“毫无尊荣”既与后文关于义人得荣耀的反转相呼应，也避免把它过度收窄为道德上的“可耻”。
theological_decisions:
- issue: 本节忏悔话语的说话者身份
  choice: 把 οἱ ἄφρονες 处理为第一人称说话者对自己的指认：“我们这些愚昧人”。
  alternative: 视为叙述者插入的第三人称评语：“那些愚昧人”。
  rationale: 本句的第一人称复数 ἐλογισάμεθα 及《智慧篇》第5章的上下文表明，这是恶人回顾并承认自己从前对义人的错误判断。
- issue: 义人“结局”的所指范围
  choice: 正文保留较宽的“结局”。
  alternative: 直接译作“死亡”。
  rationale: τελευτή既能指生命的终结，也能特指死亡；采用“结局”可保留原文的含混，同时由脚注提示“死亡”的可能读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文开头的“又”保留其与上一节并列相接的性质；破折号使后置的 οἱ ἄφρονες 清楚成为说话者的自我指认。正文中的脚注标记[a]、[b]均已对应列出。
