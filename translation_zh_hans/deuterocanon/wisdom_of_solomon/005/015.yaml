base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/015.yaml
  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
translation:
  language: zh_hans
  text: 但义人永远活着；他们的赏报在主那里[a]，他们所蒙的眷顾在至高者那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的赏报在主里面。”希腊语介词可较直译为“在……里面”；此处也可表达赏报在主的同在或保守中。
    reason: lexical_alternative
  - marker: b
    text: 希腊语原文十分凝练，也可理解为：“他们的福祉在至高者那里。”原文的表达也可指至高者对他们的关怀。
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: 义人
  rationale: 这是形容词作名词，指以公义为特征的人；“义人”是现代中文圣经语体中自然、庄重且准确的表达。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该惯用语在这里表示持续无尽的时间；“永远”简洁自然。
- source_word: ζῶσιν
  choice: 活着
  rationale: 现在时表达义人持续存活；译作“活着”直接而自然。
- source_word: ἐν Κυρίῳ
  choice: 在主那里
  rationale: ἐν通常可译为“在……里面”，但与“赏报”连用时，此处更自然地表达赏报在主的同在或保守中；“在主那里”也与下句παρὰ Ὑψίστῳ形成呼应。
- source_word: ὁ μισθὸς αὐτῶν
  choice: 他们的赏报
  rationale: μισθός可指工价或报偿；在本段智慧文学的语境中，“赏报”能准确表达义人所得的报偿，并保持庄重语气。
- source_word: ἡ φροντὶς αὐτῶν
  choice: 顾念他们
  rationale: φροντίς可表示关怀、挂念、关注，也可涉及所关怀之人的福祉。中文若直译为“他们的顾念”容易误解为义人对至高者的思想，因此正文以动词化表达呈现最可能的语义关系，并用脚注保留其他理解。
- source_word: παρὰ Ὑψίστῳ
  choice: 至高者也……
  rationale: παρά加与格可表示在某人身边、面前或掌管之中；结合φροντίς，中文以“至高者也顾念他们”自然传达关怀来自至高者，同时保留其尊称。
theological_decisions:
- issue: ἡ φροντὶς αὐτῶν的语义关系
  choice: 至高者也顾念他们
  alternative: 他们的福祉在至高者那里；对他们的眷顾在至高者那里
  rationale: 希腊语名词短语十分凝练，可理解为至高者对义人的关怀，也可着重于义人的福祉由至高者看顾。正文采用自然中文表达最可能的方向，脚注明确保留相近的另一种理解，不将其扩展为更具体的教义命题。
- issue: ἐν Κυρίῳ的表达
  choice: 他们的赏报在主那里
  alternative: 他们的赏报在主里面
  rationale: 直译“在主里面”可能使现代中文读者联想到本节未必强调的神秘联合；“在主那里”较自然地表达赏报在主的同在、掌管或保守中，脚注则保留形式上更贴近原文的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义人”“主”“至高者”保留智慧文学的神学语域；分号呈现原文先陈述义人的生命、再并列说明赏报与眷顾的结构。
