  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/005.yaml
  text: How was he counted among the sons of God[b][a], and his lot is among the holy ones?
translation:
  language: zh_hans
  text: 他怎么竟被列在上帝的众子之中[a]，他的份[b]也在圣者之中？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的儿女之中。”希腊原文作“上帝的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他所得的分。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: 怎么竟
  rationale: πῶς在上下文中引出恶人的惊愕；“怎么竟”自然表达出面对身份逆转时的震惊，而不是追问道德原因。
- source_word: κατελογίσθη
  choice: 被列在
  rationale: 保留希腊语被动语态，并表达被算入、被列入某一群体之意。
- source_word: ἐν υἱοῖς θεοῦ
  choice: 在上帝的众子之中
  rationale: ἐν加与格在此表示群体归属；“众子”保留υἱοῖς的阳性复数和身份称谓，同时用“之中”清楚传达“among”。
- source_word: ἅγιοις
  choice: 圣者
  rationale: 表示分别为圣的人；“圣者”既简洁庄重，也避免“圣徒”可能带入的后期教会称谓色彩。
- source_word: κλῆρος
  choice: 份
  rationale: κλῆρος可指抽签所得的份额、所分得的地位；正文用自然的“份”表达，脚注补出“分”。
- source_word: αὐτοῦ ἐστιν
  choice: 他的份也在
  rationale: 按现代汉语调整语序，同时保留其所分得的位置属于圣者群体这一含义；“也”对应καί并连接两个并列的惊叹内容。
theological_decisions:
- issue: υἱοῖς θεοῦ的称谓
  choice: 上帝的众子
  alternative: 上帝的儿女
  rationale: 希腊语明确使用阳性复数υἱοῖς，正文保留其字面身份语言；脚注列出汉语中更具总括性的自然表达，不据此限定该群体的性别构成。
- issue: ἅγιοις所指群体的译法
  choice: 圣者
  alternative: 圣徒
  rationale: “圣者”保留原文对圣洁之人的概括称呼，不预设后期宗派或册封意义。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话。“怎么竟”传达惊愕语气；“被列在……之中”保留被动与群体归属；两个脚注标记均置于正文相关词语之后。
