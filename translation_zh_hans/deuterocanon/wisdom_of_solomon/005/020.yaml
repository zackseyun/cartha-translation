base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: zh_hans
  text: 他要把严厉的震怒磨成利剑；受造界也要与他一同作战，攻击那些不理性的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不理性的人”也可译作“愚妄的人”。这里的希腊词评价他们在悖逆上帝时的不理性和道德上的悖谬，并非指患有精神疾病的人。
    reason: 说明παράφρονας的词义范围，并避免产生临床精神疾病的误解。
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: 磨成利剑
  rationale: 该动词意为“磨利、使锋利”；与εἰς ῥομφαίαν合译，保留磨剑的鲜明武器意象。
- source_word: ἀπότομον ὀργὴν
  choice: 严厉的震怒
  rationale: ἀπότομος在此表达严峻、凌厉的强度；“震怒”符合本段庄重而审判性的语域。
- source_word: εἰς ῥομφαίαν
  choice: 成利剑
  rationale: εἰς可表示结果；译作“成利剑”保留震怒仿佛被磨成武器的转化意象。
- source_word: συνεκπολεμήσει
  choice: 与他一同作战
  rationale: 复合动词表示与某一方共同参战；此译直接保留协同作战之意。
- source_word: ὁ κόσμος
  choice: 整个受造界
  rationale: κόσμος在上下文中指参与神审判的有序世界或受造秩序；“整个受造界”比单说“世界”更清楚地传达其宇宙性含义。
- source_word: ἐπὶ τοὺς παράφρονας
  choice: 攻击那些丧失理性的人
  rationale: παράφρων可指不理性、心智偏离常道者；这里是对悖逆者的道德与属灵评价，并非现代临床诊断。
theological_decisions:
- issue: αὐτῷ（“与他”）的指代
  choice: 正文保留代词“他”
  alternative: 明确译为“与上帝一同作战”或理解为间接与义人并肩作战
  rationale: 上下文最自然地指向施行审判的上帝，但希腊文本本节没有明说所指，因此不在正文中补出“上帝”，以保留原文的指代张力。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“磨成利剑”保留原文浓烈的军事隐喻；分号呈现两个彼此呼应的审判行动。脚注标记置于所解释短语之后。
