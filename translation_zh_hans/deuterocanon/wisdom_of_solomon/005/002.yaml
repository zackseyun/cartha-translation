base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/002.yaml
  text: When they see him[a], they will be shaken with dreadful fear, and they will be astonished at the unexpectedness of his salvation.
translation:
  language: zh_hans
  text: 他们看见他[a]，就会因极其恐惧而惊惶，并会对这出人意料的拯救感到惊异。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“看见（以后），他们会因强烈的恐惧而惊惶，并会对那出人意料的拯救感到惊异”。本节没有明说所看见的对象；“他”是根据上一节所说的义人补出的。
    reason: 说明原文省略的宾语及其上下文所指。
lexical_decisions:
- source_word: ἰδόντες
  choice: 他们看见他
  rationale: 不定过去时分词在此具有时间意味，可自然译为“他们看见”。原文未明说宾语；“他”依据上一节所说的义人补出，并以脚注说明。
- source_word: ταραχθήσονται
  choice: 就会……惊慌
  rationale: ταράσσω的将来时被动形式表示受到强烈扰动；“惊慌”在现代汉语中自然地传达内心被恐惧搅乱的状态。
- source_word: φόβῳ δεινῷ
  choice: 因可怕的恐惧
  rationale: 与格短语可表原因或方式；“因”体现其致使惊慌的作用，“可怕的恐惧”保留δεινός的强烈程度，虽有语义叠加，却忠实于希腊文的强调。
- source_word: ἐκστήσονται
  choice: 震惊
  rationale: ἐξίστημι在此指因意外之事而极度惊异，不必按字面译作“失去常态”；“震惊”既有力度，也符合现代汉语。
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: 因这出人意料的
  rationale: 带冠词的παράδοξος作名词使用，指意外、超乎预料之事；结合σωτηρίας，用“这出人意料的拯救”自然表达其修饰关系。
- source_word: τῆς σωτηρίας
  choice: 拯救
  rationale: σωτηρία兼有“拯救、解救、得救”之义；此处指义人所蒙的救援与伸冤，“拯救”保留较宽的语义和庄重语体。
theological_decisions:
- issue: 是否补出所看见的对象
  choice: 正文补出“他”，指上一节的义人，并加脚注交代原文省略。
  alternative: 保留省略，译作“他们看见，就会……”；或明确译作“他们看见义人”。
  rationale: 希腊文ἰδόντες没有明示宾语，但上下文清楚指向义人。现代汉语需要宾语才自然；用“他”比重复“义人”更接近原文的含蓄。
- issue: 是否把拯救明确表述为“他的拯救”
  choice: 译作“这出人意料的拯救”，不在正文补出所有格。
  alternative: 译作“他所得的拯救”或“他的拯救”。
  rationale: 希腊文τῆς σωτηρίας本身没有所有格代词。上下文虽表明这是义人所蒙的拯救，但中文无需补出所有格也能自然表达，因此保留原文在此处的含蓄，避免把语境推断写成明示成分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“惊慌”与“震惊”分别对应受恐惧扰动和面对意外拯救时的强烈惊异，避免同义重复。正文只在汉语语法较需要之处补出“他”，并用脚注保留希腊文的省略信息。
