base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/023.yaml
  text: A spirit of power will stand against them[a], and like a whirlwind it will winnow them away;
translation:
  language: zh_hans
  text: 大能的灵必起来抵挡他们[a]，又像旋风一样把他们簸散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大能的风必起来抵挡他们”，或“强劲的风必起来抵挡他们”。希腊语πνεῦμα可指“灵”“风”或“气息”。
    reason: 保留πνεῦμα在此处可能表示“灵”或“风”的词义歧义，同时使替代译法准确对应ἀντιστήσεται“抵挡”的含义。
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: 必起来抵挡
  rationale: 该动词表示迎面抗拒、与之对立；“起来抵挡”保留具体的对抗意味，也符合现代汉语表达。
- source_word: πνεῦμα
  choice: 灵
  rationale: πνεῦμα可指“灵”“风”或“气息”。本句中它是“抵挡”的施事者，译作“灵”较能保留拟人化意味；其“风”的可能含义则在注脚中说明。
- source_word: δυνάμεως
  choice: 大能的
  rationale: 属格δυνάμεως修饰πνεῦμα，表示能力或威力；“大能的”自然凝练，同时不限定为军事力量。
- source_word: λαῖλαψ
  choice: 旋风
  rationale: λαῖλαψ指猛烈的暴风或旋风；“旋风”形象鲜明，并与审判场景中的猛烈风势相称。
- source_word: ἐκλικμήσει
  choice: 把他们簸散
  rationale: 该词带有扬场簸谷、使糠秕被风吹散的意象；“簸散”既保留农业隐喻，也表达强力驱散。
- source_word: αὐτούς
  choice: 他们
  rationale: 宾语代词承接上下文中的恶人或敌对者，直译为“他们”即可。
theological_decisions:
- issue: πνεῦμα应理解为非人格的“风”，还是较具施事性的“灵”
  choice: 灵
  alternative: 风；劲风
  rationale: 句法上πνεῦμα δυνάμεως是“起来抵挡他们”的主语，较具施事性，因此正文采用“灵”；但πνεῦμα本身也可表示“风”或“气息”，且下句明说“像旋风”，故以注脚保留真实的词义张力，不把解释定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“起来抵挡”保留原文动词的具体对抗感；“簸散”保留扬场筛簸的农业意象。正文与注脚共同保存“灵／风”的歧义。
