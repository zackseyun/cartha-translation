base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: zh_hans
  text: 又如飞鸟飞过空中，找不到它飞行路线的任何凭据[a]；轻轻的空气[b]被翅翼拍打得如同受鞭笞，又被振翅的呼啸声猛烈划开；飞鸟从中穿过，此后，空中再也找不到它经过的痕迹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “飞行路线的任何凭据”也可译作“所经路线的任何明证”。希腊文 τεκμήριον 强调没有留下可以证实飞行路线的标记。
    reason: lexical_alternative
  - marker: b
    text: “轻轻的空气”所译的希腊文 πνεῦμα κοῦφον，也可理解为“轻风”或“微风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  choice: 飞鸟穿过空中
  rationale: 以自然的现代汉语表达鸟飞越空气这一意象；“穿过”保留 διιπτάντος 所表示的贯穿性移动，“空中”在此比生硬的“空气中”更符合汉语习惯。
- source_word: τεκμήριον πορείας
  choice: 行程的任何凭据
  rationale: τεκμήριον 强调可据以证明或判定的证据，不只是一道可见痕迹；“行程”表达 πορεία 所指经过的路线或过程，并与后文 σημεῖον 的“痕迹”有所区别。
- source_word: πληγῇ μαστιζόμενον ταρσῶν
  choice: 被翅翼拍击，如遭鞭打
  rationale: 保留原文把空气描写成受到翅翼抽打的强烈拟人化图景；“翅翼”既指飞行用的翼部，也避免使用普通读者较难理解的解剖术语。
- source_word: πνεῦμα κοῦφον
  choice: 轻盈的空气
  rationale: 此处 πνεῦμα 指鸟飞行时穿越并扰动的空气；κοῦφον 表示轻、轻盈。“空气”最切合物理语境，同时脚注保留“微风”等可能理解。
- source_word: σχιζόμενον βίᾳ ῥοιζῷ, κινουμένων πτερύγων
  choice: 被振动双翼的呼啸猛然劈开
  rationale: “劈开”对应 σχιζόμενον，“猛然”传达 βίᾳ 的强力，“呼啸”呈现 ῥοιζῷ 的疾速声响；“振动双翼”明确声响的来源。
- source_word: διωδεύθη
  choice: 飞鸟从中穿过
  rationale: 希腊文以被动式说空气“被穿越”；汉语改用鸟作施事者更自然，同时不改变空气作为飞行通道的图景。
- source_word: σημεῖον ἐπιβάσεως
  choice: 经过的痕迹
  rationale: σημεῖον 是可见的记号或迹象，ἐπίβασις 在此指经过或通行；“经过的痕迹”简明地表达飞鸟过后不留踪迹。
