translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句子保留原文由飞鸟、空气受击与劈开、最终不留痕迹所构成的连续意象；前后分别用“凭据”和“痕迹”，呈现 τεκμήριον 与 σημεῖον 的词义差别。所有脚注标记均已置于正文相应位置。
