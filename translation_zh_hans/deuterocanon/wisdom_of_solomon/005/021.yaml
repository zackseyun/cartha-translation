base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
translation:
  language: zh_hans
  text: 瞄得很准的闪电飞矢必会出动；它们如同从云层的匀圆之弓射出，跃向目标。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύσονται
  choice: 必飞射而出
  rationale: 该词是πορεύομαι的将来时，基本义为“前往、行进”。结合飞矢投入攻击的诗歌语境，译作“必飞射而出”既表达将来的行动，也符合现代汉语习惯。
- source_word: εὔστοχοι
  choice: 瞄得准的
  rationale: 该形容词表示善于命中目标或方向准确；“瞄得准的”保留射击和目标意象，又通俗自然。
- source_word: βολίδες ἀστραπῶν
  choice: 闪电飞矢
  rationale: βολίς指投射物、飞镖或飞矢，ἀστραπῶν为“闪电”的复数属格。“闪电飞矢”保留元素被用作武器的诗性画面，同时避免把它仅仅处理为普通闪电。
- source_word: εὐκύκλου τόξου τῶν νεφῶν
  choice: 云层那弯曲匀称的弓
  rationale: εὔκυκλος侧重弧度良好、形状匀称，并非“拉满”。“弯曲匀称”较准确地传达其形状；“云层……的弓”保留希腊文属格意象，不直接确定为彩虹。
- source_word: ἐπὶ σκοπόν
  choice: 直扑目标
  rationale: σκοπός是射击的标靶或目标；“目标”清楚保留军事意象，而“直扑”与动态动词自然衔接。
- source_word: ἁλοῦνται
  choice: 直扑
  rationale: 此处动词形象而略难，可理解为跃向、冲向或被发射到目标。“直扑”保留迅疾而有方向的运动感，又不把其语态和具体弹道解释得过死。
theological_decisions:
- issue: “云的弓”是否特指彩虹
  choice: 正文译作“云层那弯曲匀称的弓”
  alternative: 彩虹；云中的弓
  rationale: 希腊文直译是“云的弓”，虽可能令人联想到彩虹或暴风云中的天弓，却没有明确使用必须译作“彩虹”的专词。保留较宽泛的意象，可避免加入超出原文的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文的武器和风暴意象；以“必”表达将来行动，以分号呈现两个紧密相连的诗行画面。正文中的[a]、[b]均与脚注对应。
