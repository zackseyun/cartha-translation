  text: He will put on righteousness as a breastplate, and will place sincere judgment as a helmet;
translation:
  language: zh_hans
  text: 他要把公义当作胸甲穿上[a]，把无伪的审判当作头盔戴上[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。希腊语 δικαιοσύνη 可兼指正直和公正。
    reason: lexical_alternative
  - marker: b
    text: 直译“无伪的审判”，即真实而不虚伪的审判；按语境也可理解为公正无私的审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσεται
  choice: 要穿上
  rationale: 这是ἐνδύω的将来时中间语态；在披挂军装的意象中，“穿上”自然地表达主动披戴。
- source_word: θώρακα
  choice: 胸甲
  rationale: 指保护胸部和躯干的军用护甲；“胸甲”是现代汉语圣经语境中清楚而惯常的对应词。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: δικαιοσύνη兼有合乎正直与施行公正的语义；“公义”在此保留其道德和司法层面的宽度，“正义”列为脚注中的可译法。
- source_word: περιθήσεται
  choice: 戴上
  rationale: περιτίθημι意为放置于周围或戴上；与“头盔”搭配时译作“戴上”最自然，同时保留披挂装备的动作。
- source_word: κόρυθα
  choice: 头盔
  rationale: 该词指军用护头装备，直译为“头盔”。
- source_word: κρίσιν
  choice: 审判
  rationale: κρίσις在此指作出并施行判断；“审判”保留其司法性和行动性。
- source_word: ἀνυπόκριτον
  choice: 不虚假的
  rationale: 该词字面意为“不假装的、无伪的”。译为“不虚假的”保留原文对审判真实性的直接限定，不把它仅收窄为“公正无私”。
theological_decisions:
- issue: 军装比喻中δικαιοσύνη的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”能同时承载正直品格与公正行动，适合此处神圣争战的比喻；“正义”也是可能译法，故在脚注保留。
- issue: ἀνυπόκριτον κρίσιν所强调的审判性质
  choice: 不虚假的审判
  alternative: 无伪的审判；公正无私的审判
  rationale: 原文首先陈述审判是“不假装、非虚伪”的；“公正无私”可能是语境蕴含，却比希腊词本身更具体，因此正文保留较为形式对应的表达。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。两个并列分句保持军装比喻及动词变化：“穿上”胸甲、“戴上”头盔。正文较贴近希腊语措辞，脚注说明关键语义范围。
