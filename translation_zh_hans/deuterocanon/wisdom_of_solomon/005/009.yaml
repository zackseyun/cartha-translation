  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/009.yaml
  text: All those things passed away like a shadow[a], and like a report running past;
translation:
  language: zh_hans
  text: 那一切都已如影子般逝去，又如飞驰而过的消息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传报”或“宣告”；原文描绘消息迅速奔过。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  choice: 消逝
  rationale: 该词表示经过、逝去；这里与“影子”的比喻相配，“消逝”自然地传达事物转瞬即逝并不再可得的意味。
- source_word: ἐκεῖνα πάντα
  choice: 这一切
  rationale: 指说话者回顾前文所提到的一切事物。现代汉语用“这一切”比直译为“那些一切”自然，同时保留总括作用。
- source_word: ὡς σκιὰ
  choice: 如影子般
  rationale: 直接保留希腊文关于短暂无常、缺乏实体感的明喻。
- source_word: ἀγγελία
  choice: 消息
  rationale: 该词可指消息、传报或宣告；“消息”涵盖面较广，也能与后面的快速运动意象自然结合。
- source_word: παρατρέχουσα
  choice: 飞驰而过
  rationale: 该分词描绘从旁快速跑过的动作；“飞驰而过”既保留速度和经过的动态感，又符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个“如／像”的明喻平行呈现，并保留第二个比喻中较为奇特的拟人化动态意象，不将其解释性改写为抽象的“转瞬即逝”。
