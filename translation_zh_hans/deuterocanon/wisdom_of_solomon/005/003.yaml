base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: zh_hans
  text: 他们会彼此说，心中悔悟，并因心灵的痛苦而呻吟：“这人就是我们从前当作笑柄[a]的那个人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们从前讥笑的人。”
    reason: “当作笑柄”对应εἰς γέλωτα，强调此人是被视为可笑、受嘲弄的对象；脚注提供较主动的汉语表达。
lexical_decisions:
- source_word: ἐροῦσιν
  choice: 会……说道
  rationale: 保留将来时，并以现代汉语自然地引出后面的直接引语。
- source_word: ἐν ἑαυτοῖς
  choice: 彼此
  rationale: 此短语既可指各自在心里，也可指群体内部彼此交谈；结合恶人共同说出的直接引语，译作“彼此”较为自然，同时不把场景限定为公开发言。
- source_word: μετανοοῦντες
  choice: 悔悟
  rationale: 保留该词所含的思想与道德转变意味，但不进一步断定这种悔悟是否带来救恩。
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: 因心灵的痛苦
  rationale: στενοχωρία表示困苦、压迫或痛楚；πνεύματος指内在的灵或心灵。此译法既保留内在层面，也避免缩减为一般情绪。
- source_word: στενάξονται
  choice: 呻吟
  rationale: 表达强烈痛苦所发出的声音，比“叹息”更符合此处语气，又不像“哀号”那样加重原文。
- source_word: Οὗτος ἦν
  choice: 这就是……那个人
  rationale: 以自然汉语呈现指示语和系词结构；过去的时间关系由“从前”及后面的旧有态度清楚表达。
- source_word: ἔσχομέν ποτε εἰς γέλωτα
  choice: 我们从前当作笑柄
  rationale: ἔχω与εἰς加宾格在此表示把某人视为某种对象；γέλως在该结构中指受人嘲笑的对象。“当作笑柄”准确而通顺。
theological_decisions:
- issue: 恶人所表现的μετανοοῦντες具有何种性质
  choice: 悔悟
  alternative: 后悔；懊悔
  rationale: “悔悟”保留原词较强的道德转变意味；经文本身并未说明这种末后承认是否构成得救的悔改，因此译文不对其结果作神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“彼此说道”体现群体内部的言说，“心灵的痛苦”保留原文πνεῦμα的内在或属灵色彩；句式尽量贴近希腊文的悔悟、呻吟与直接引语之间的关系。
