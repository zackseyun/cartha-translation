  text: like a ship passing through surging water[a], after it has gone by no trace can be found, nor the track of its keel in the waves[b];
translation:
  language: zh_hans
  text: 如船驶过翻腾的水面[a]，船过去以后，便找不到它的踪迹，波浪中也不见它龙骨划过的路径[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“波涛起伏的水面”。希腊文强调水翻动成浪。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“龙骨”的希腊词是航海用语；也可较宽泛地理解为船行过的航道或路线。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναῦς
  choice: 船
  rationale: 这是海上船只的通称；“船”自然、简洁，适合此处的比喻。
- source_word: διερχομένη
  choice: 驶过
  rationale: 分词描写船从水中经过；“驶过”既体现航行，也保持动作短暂而流逝的意象。
- source_word: κυμαινόμενον ὕδωρ
  choice: 翻腾的水面
  rationale: κυμαινόμενον 表示水起伏成浪；“翻腾的水面”在现代汉语中自然，并突出波动不定。
- source_word: ἧς διαβάσης
  choice: 船过去以后
  rationale: 属格独立结构表示先于主句完成的动作；明确补出“船”，使中文指代清楚。
- source_word: ἴχνος
  choice: 踪迹
  rationale: 表示经过后留下的可见痕迹；“踪迹”符合本句讨论船过无痕的语境。
- source_word: ἀτραπός
  choice: 路径
  rationale: 本义为小路、途径，此处比喻船划出的航迹；“路径”保留其形象性。
- source_word: τρόπιος αὐτῆς
  choice: 它龙骨划过的
  rationale: τρόπιος 是与船的龙骨有关的航海用语；译出“龙骨”保留具体的船体意象，“划过的”使其与“路径”自然衔接。
- source_word: ἐν κύμασιν
  choice: 波浪中
  rationale: 直接表达消失的路径位于波浪之中，简明而忠实。
