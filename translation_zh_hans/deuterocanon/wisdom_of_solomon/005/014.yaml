  to: 因为不敬虔之人的希望，如被风带走的绒毛，如被暴风驱散的薄霜，如被风吹散的烟，已经过去，如同对一个只投宿一日的人的记忆。 [a]
  rationale: 修订将“已经过去”明确归于“不敬虔之人的希望”，以对应希腊文末尾的单数过去时谓语παρῴδευσεν；同时将“旅客留下的记忆”改为“对……人的记忆”，避免误改μνεία与καταλύτου的关系。其余三个层叠比喻及原有庄重、现代的普通话语体均予保留。
