base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: zh_hans
  text: 因为不敬虔之人的希望，如被风带走的绒毛，如被暴风驱散的薄霜，如被风吹散的烟，已经过去，如同对一个只投宿一日的人的记忆。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记忆”也可译作“提及”。“只投宿一日的人”指短暂停留的投宿者；末句也可理解为“如同对只住一日的旅客的记忆”。
    reason: 保留 μνεία（“记忆／提及”）及 καταλύτης（暂住的投宿者）的词义范围，并说明末句属格短语在汉语中的自然表达。
lexical_decisions:
- source_word: ἐλπὶς
  choice: 希望
  rationale: 既可指“希望”，也可指“期待”；此处“希望”自然贴切，并保留上下文中的道德反差。
- source_word: ἀσεβοῦς
  choice: 不敬虔之人
  rationale: 该词强调对上帝缺乏敬畏，而不只泛指行为邪恶；此译法保留其向神的道德含义。
- source_word: χνοῦς
  choice: 绒毛
  rationale: 指轻盈的细绒或茸毛，并非通常所说的糠秕；“绒毛”准确呈现其轻微、易被风吹走的形象。
- source_word: πάχνη λεπτὴ
  choice: 薄霜
  rationale: πάχνη 指霜，λεπτὴ 表明其薄而细微；合译为“薄霜”简洁自然。
- source_word: λαίλαπος
  choice: 暴风
  rationale: 指猛烈的风暴或飑风；“暴风”既表现力度，也符合现代汉语。
- source_word: διωχθεῖσα
  choice: 驱散
  rationale: 被动分词含有受强力赶走、驱逐之意；用于薄霜的意象时，“驱散”较自然。
- source_word: διεχύθη
  choice: 吹散
  rationale: 原词可指流散、消散；在烟受风作用的语境中译为“吹散”，既明示施动关系，也符合汉语表达。
- source_word: μνεία
  choice: 记忆
  rationale: 可指记忆或提及；此处意象着重短暂停留者很快被遗忘，故译“记忆”，同时在脚注保留“提起”的可能。
- source_word: καταλύτου μονοημέρου
  choice: 仅住一日的旅客
  rationale: καταλύτης 指暂时投宿的人，μονοήμερος 指仅一日；此译兼顾旅居、投宿和时间短暂的含义。
- source_word: παρῴδευσεν
  choice: 转瞬即逝
  rationale: 原动词有经过、过去之意；结合“记忆”的比喻，译为“转瞬即逝”自然传达其迅速消失，但不改变核心意象。
theological_decisions:
- issue: ἀσεβοῦς 的道德与神学指向
  choice: 不敬虔之人
  alternative: 恶人；不虔诚的人
  rationale: “不敬虔”保留该词相对于上帝的含义，又不额外引入特定宗派术语。
- issue: 末句的句法主语与意象关系
  choice: 以“仅住一日的旅客留下的记忆”承接“转瞬即逝”
  alternative: 将“希望”明确补作“逝去”的主语
  rationale: 希腊文末句没有重新明说主语；此译保持比喻链条和一定句法张力，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。连续使用“好像／又像／也像／又如”呈现希腊文层叠的四个比喻；末句略作汉语语序调整，以保留转瞬消逝的力度。
