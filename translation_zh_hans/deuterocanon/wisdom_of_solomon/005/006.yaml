base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/006.yaml
  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: zh_hans
  text: 这样看来，我们偏离了真理之道；公义之光[a]没有照耀我们，太阳也没有为我们升起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义之光”或译“正义之光”。希腊语 δικαιοσύνη 既可指道德上的正直，也可含司法上的公正之意。
    reason: 保留 δικαιοσύνη 的道德与司法双重语义。
lexical_decisions:
- source_word: ἄρα
  choice: 这样看来
  rationale: 表示说话者回顾后所得的推论，既保留承接和结论意味，也符合现代汉语表达。
- source_word: ἐπλανήθημεν ἀπὸ ὁδοῦ ἀληθείας
  choice: 我们偏离了真理之道
  rationale: 保留“道路”的具体隐喻；将中间被动形式按不及物意义表达，避免擅自加入使他们受迷惑的外在主体。
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: 公义之光
  rationale: 保留希腊文属格结构和光的意象；“公义”兼顾道德正直的主要语境，并以脚注保留司法性含义。
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: 没有照耀我们
  rationale: 自然表达光与说话者的关系，忠实保留照耀意象。
- source_word: ὁ ἥλιος οὐκ ἀνέτειλεν ἡμῖν
  choice: 太阳也没有为我们升起
  rationale: 直接保留太阳升起的图像，并用“为我们”体现与格所表达的关系或受益含义。
theological_decisions:
- issue: δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: 本节的智慧文学语境突出道德正直，但该词也可带有司法、公正的意味；正文采用“公义”，脚注保留“正义”这一真实可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号呈现原文三个并列分句的推进；保留“真理之道”“公义之光”和“太阳升起”的连续意象，不将其神学含义具体化。
