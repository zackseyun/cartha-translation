  text: 'or like an arrow shot at a target: the air[a], once cut through, immediately closed up on itself, so that its path could not be known.'
translation:
  language: zh_hans
  text: 或像一支射向靶子的箭：空气被划开后，随即恢复原状，以致人无法知道它所经过的路径[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路径”也可译作“通道”或“路线”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλους βληθέντος ἐπὶ σκοπόν
  choice: 一支射向靶子的箭
  rationale: βέλος在此指箭，βληθέντος表示箭被射出，σκοπός是瞄准的对象；合译既保留射箭的具体意象，也符合现代汉语表达。
- source_word: τμηθεὶς ὁ ἀήρ
  choice: 空气被划开
  rationale: τμηθείς表示被切开或分开；“被划开”保留箭穿过空气时鲜明的动态画面。
- source_word: εὐθέως εἰς ἑαυτὸν ἀνελύθη
  choice: 随即恢复原状
  rationale: 此短语直观描写被分开的空气马上重新归合；“恢复原状”自然传达其语境意义，同时避免把物理过程说得过于具体。
- source_word: ὡς ἀγνοῆσαι τὴν δίοδον αὐτοῦ
  choice: 以致箭经过的路径无从辨认
  rationale: ὡς加不定式表示结果；δίοδος指穿行的通路或路线，αὐτοῦ在语境中自然指箭。“无从辨认”保留路径不留痕迹、无法察知的含义。
