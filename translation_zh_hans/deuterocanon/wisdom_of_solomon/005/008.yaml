  text: What did arrogance profit us? And what did wealth joined with boasting gain us?
translation:
  language: zh_hans
  text: 骄傲给我们带来了什么益处？财富连同自夸，又给了我们什么好处？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερηφανία
  choice: 骄傲
  rationale: 指高傲、自大的态度；“骄傲”自然明白，并保留其负面道德含义。
- source_word: ὠφέλησεν
  choice: 带来了什么益处
  rationale: 准确表达“使……受益、有益于”的意思，并与反问语气相合。
- source_word: πλοῦτος
  choice: 财富
  rationale: 直接对应物质财富，庄重且通行。
- source_word: μετὰ ἀλαζονίας
  choice: 连同自夸
  rationale: 介词短语表示财富与夸耀、自吹自擂相伴；“连同”不强行解释二者关系。
- source_word: συμβέβληται ἡμῖν
  choice: 给了我们什么好处
  rationale: 该完成时动词在这里有“贡献、带来益处”之意；译文以自然汉语呈现其对我们所得利益的追问。
theological_decisions:
- issue: 财富与自夸之间的关系
  choice: 译为“财富连同自夸”
  alternative: 财富所带来的自夸
  rationale: 希腊文 μετὰ ἀλαζονίας 只明确二者相伴，并未清楚表达因果关系，因此不把自夸解释成财富的结果。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；两句平行，保留原文对骄傲及伴随自夸的财富之徒劳的追问。
