base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/017.yaml
  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
translation:
  language: zh_hans
  text: 他要以自己的热忱作全副铠甲[a]，并要把受造界制成武器，以抵御仇敌[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热忱”也可译作“嫉妒”或“妒忌”；希腊文 ζῆλος 可表达这两方面的意思，须由语境判断。
    reason: lexical_alternative
  - marker: b
    text: “把受造界制成武器”按字面也可理解为“为受造界制作武器”或“武装受造界”。希腊文动词带有制作或配备武器的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: 要以……为
  rationale: 这是 λαμβάνω 的将来时中间语态；在“以热忱为铠甲”的汉语结构中，用“以……为”自然表达拿取并用作装备的意思。
- source_word: πανοπλίαν
  choice: 全副铠甲
  rationale: 指重装战士的整套武装。“全副铠甲”既保留完整、全套的含义，也符合现代汉语的军事意象。
- source_word: τὸν ζῆλον αὐτοῦ
  choice: 自己的热忱
  rationale: ζῆλος 可指热忱，也可指嫉妒或妒忌；此处处于神圣战士的语境，“热忱”较自然，同时以脚注保留词义张力。反身代词“自己的”清楚对应 αὐτοῦ 与隐含主语同指。
- source_word: ὁπλοποιήσει
  choice: 要武装
  rationale: 该动词与制造、配备武器有关；“武装受造界”简洁地表达使受造界成为战斗装备或手段的结果，较逐字译法自然。
- source_word: τὴν κτίσιν
  choice: 受造界
  rationale: κτίσις 在此广指整个被造秩序；“受造界”比单说“创造”更明确地指向被造的世界，又不缩窄为人类或自然界。
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: 用来抵御仇敌
  rationale: ἄμυνα 表示防御、抵挡或击退；“抵御”兼顾防卫与击退的语势。原文没有明确说“他的仇敌”，因此不补入领属词。
theological_decisions:
- issue: 隐含主语的所指
  choice: 用“他”承接上下文中的上帝，保留希腊文隐含的阳性单数主语
  alternative: 理解为拟人化的神圣正义
  rationale: 《智慧篇》第5章的上下文描绘主如战士行动；译文不直接添加“上帝”，避免比本节原文说得更明。
- issue: ζῆλος 在神圣战士意象中的含义
  choice: 正文译作“热忱”，并视之为铠甲的比喻
  alternative: 译作“嫉妒”或“妒忌”
  rationale: 原文是鲜明的战争比喻，并非系统教义陈述。“热忱”符合审判语境，同时脚注保留 ζῆλος 的另一真实词义。
- issue: 受造界在战争意象中的作用
  choice: 译作上帝将“武装受造界”以抵御仇敌
  alternative: 译作上帝把受造界“制成武器”或“装备成武器”
  rationale: ὁπλοποιήσει 的构词保留制造或配备武器的强烈意味；正文采用自然汉语，脚注说明更贴近字面的可能表达，不限定受造界究竟是被装备还是本身成为武器。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全副铠甲”保留完整武装的形象；“受造界”表达 κτίσις 的宇宙性范围；分号承接本段连续的战士意象。所有脚注标记均已置于正文对应位置。
