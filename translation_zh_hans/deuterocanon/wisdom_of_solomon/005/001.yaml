base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
translation:
  language: zh_hans
  text: 那时，义人必满怀勇气[a]，站在那些曾压迫他、轻看他的劳苦[b]的人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满怀勇气”也可译作“以极大的胆量”或“十分坦然”；希腊词兼有勇敢、坦然和公开无惧的意味。
    reason: lexical_alternative
  - marker: b
    text: “劳苦”也可译作“辛劳”或“痛苦”；原词可指劳作、艰难或所受的苦楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 表示随后展开的场景；“那时”在现代汉语中自然庄重，也保留时间推进。
- source_word: στήσεται
  choice: 必……站在
  rationale: 保留站立的形象和未来语气；不额外限定为“被使站立”或“挺身而出”。
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: 满有勇气
  rationale: παρρησία兼有坦然、无所畏惧和公开表达的意味；“满有勇气”适合受伸冤者公开面对压迫者的语境。
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 汉语圣经语体中自然且简洁，保留单数代表性人物的表达，不必添加性别词。
- source_word: κατὰ πρόσωπον
  choice: 在……面前
  rationale: 传达直接处于对方面前、与之面对的含义，同时避免生硬直译为“在……脸前”。
- source_word: τῶν θλιψάντων αὐτὸν
  choice: 那些曾压迫他的人
  rationale: θλίβω可指挤压、使受苦或压迫；此处“压迫”清楚表达他人施加的苦难，且“曾”体现不定过去分词。
- source_word: τῶν ἀθετούντων
  choice: 那些……轻看……的人
  rationale: ἀθετέω有弃置、不承认、视为无价值之意；搭配“劳苦”时，“轻看”自然表达将其视为不足道。
- source_word: τοὺς πόνους αὐτοῦ
  choice: 他所受的劳苦
  rationale: πόνος兼有劳作、艰辛和痛苦；“所受的劳苦”保留主动付出与承受苦难之间的张力。
theological_decisions:
- issue: ὁ δίκαιος的单数与性别表达
  choice: 义人
  alternative: 那个义人／义者
  rationale: 希腊文为阳性单数，但现代汉语“义人”本身不标明语法性别，并可自然指称一个代表性的正义者；不把它改成复数，也不无根据添加“男子”。
- issue: 审判与伸冤场景中παρρησία的含义
  choice: 满有勇气
  alternative: 大有信心／十分坦然
  rationale: “勇气”较能保留公开面对昔日压迫者时无所畏惧的张力；脚注同时说明它也可侧重坦然与信心。
- issue: πόνος究竟侧重劳作还是苦难
  choice: 劳苦
  alternative: 辛劳／痛苦
  rationale: 原词的语义范围同时涉及费力劳作、艰难和痛楚；正文用“劳苦”保留这种重叠，不将其限定为功业或纯粹肉体痛苦。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“在……面前”自然传达κατὰ πρόσωπον的直接临场感；“曾压迫”与“轻看”区分实际加害和否定其劳苦这两类行为。所有脚注标记均置于正文相关句末。
