base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
translation:
  language: zh_hans
  text: 同样，我们既已出生，也归于消逝了[a]；我们没有任何美德的明证可展示[b]，却在自己的邪恶中被耗尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归于消逝”也可译作“终结了”或“消失了”；希腊语动词可表达消失或止息。
    reason: lexical_alternative
  - marker: b
    text: “美德”也可译作“卓越”；这里的希腊语词可指道德上的优良或卓越。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ἡμεῖς
  choice: 同样，我们
  rationale: 承接前文关于事物转瞬即逝的比喻，保留比较意味，并采用自然的现代汉语表达。
- source_word: γενηθέντες
  choice: 一出生
  rationale: 该不定过去时被动分词在此指来到世上或出生；译作“一出生”简洁地保留时间关系。
- source_word: ἐξελίπομεν
  choice: 就消逝了
  rationale: ἐκλείπω可表示消失、止息或终结；“消逝”契合上下文的短暂无常意象，同时保留一定语义幅度。
- source_word: ἀρετῆς
  choice: 美德
  rationale: ἀρετή在此主要指伦理上的良善与卓越；“美德”是现代汉语中自然且明确的对应词。
- source_word: σημεῖον οὐδὲν ἔσχομεν δεῖξαι
  choice: 没有留下任何美德的明证
  rationale: 短语直指没有任何可展示、可证明其美德的迹象；“明证”传达σημεῖον的证据意味，“留下”使全句在死亡回顾的语境中自然。
- source_word: κακίᾳ
  choice: 邪恶
  rationale: 此处指道德上的败坏，而非一般的不幸或缺陷；“邪恶”保留其伦理分量。
- source_word: κατεδαπανήθημεν
  choice: 耗尽了
  rationale: 该被动形式表示被彻底耗费、消磨殆尽；汉语“耗尽了”既保留结果性，也呈现生命在邪恶中被消耗的意象。
theological_decisions:
- issue: 智慧文学中ἀρετή的伦理含义
  choice: 美德
  alternative: 卓越；善行
  rationale: 上下文是恶人对自身一生的反省，强调他们未能显出任何道德价值。“美德”保留伦理和智慧文学色彩，又不引入后来的专门神学含义。
- issue: ἐν δὲ τῇ κακίᾳ ἡμῶν所表达的关系
  choice: 反而在自己的邪恶中耗尽了
  alternative: 却因自己的邪恶而耗尽了
  rationale: 希腊语ἐν首先表达所在领域或处境，也可能隐含原因。正文用“在……中”保留这种张力，不明确改写为单一因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留原句两部分的对照；“反而”体现μέν……δέ结构中由无美德转向邪恶耗损的反差。所有脚注标记均已置于正文对应处。
