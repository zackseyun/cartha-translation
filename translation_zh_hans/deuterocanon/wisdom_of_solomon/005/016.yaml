base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: zh_hans
  text: 因此，他们将从主手中领受荣美的国度和华美的冠冕[a]；因为他必用右手庇护他们，用臂膀护卫他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”所译的希腊词特指君王所戴的头饰；也可译作“王冠”。前面的“国度”一词也可理解为“王权”或“王室之物”。
    reason: 保留两个王权词语的词义范围及原文可能存在的歧义。
  - marker: b
    text: “护卫他们”直译为“为他们护卫”，含有替他们抵御的意思。
    reason: 说明希腊语属格结构所表达的“为他们、替他们”之意。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 表达承接上文的推论关系，简洁自然。
- source_word: λήμψονται
  choice: 将……领受
  rationale: 结合“从主手中”来看，此处强调接受主所赐之物，而非主动夺取。
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  choice: 荣美的国度
  rationale: βασίλειον可指国度、王权或王室之物；正文依其名词性读法译作“国度”，保留与冠冕并列所形成的君王意象，也不把它收窄为某一种王室饰物。εὐπρέπεια在此表示庄严华美。
- source_word: τὸ διάδημα τοῦ κάλλους
  choice: 华美的冠冕
  rationale: διάδημα特指君王所戴的头饰；“冠冕”既通俗庄重，又能传达其王权色彩。κάλλος直指美丽、华美。
- source_word: ἐκ χειρὸς Κυρίου
  choice: 从主手中
  rationale: 保留原文“手”的形象，清楚表明赏赐来自主。
- source_word: τῇ δεξιᾷ σκεπάσει αὐτούς
  choice: 他必用右手庇护他们
  rationale: 工具格译作“用”；σκεπάζω兼有遮盖与保护之意，“庇护”自然地表达保护性的遮蔽。
- source_word: τῷ βραχίονι ὑπερασπιεῖ αὐτῶν
  choice: 用臂膀护卫他们
  rationale: 保留“臂膀”这一象征力量的圣经意象；“护卫”表达ὑπερασπίζω替人抵御、保护的含义。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处κύριος指作为赏赐者和保护者的神；“主”符合中文圣经传统和本段庄严语域。
- issue: 义人所得赏赐的王权意象
  choice: 按原文保留“国度”和“冠冕”的具体意象
  alternative: 概括译为“王者的尊荣”或把βασίλειον理解为王室冠饰
  rationale: 原文把国度或王权用语与君王冠冕并列。直译保留这些意象之间的张力，不预先断定它们仅是抽象荣誉或某件具体饰物。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“领受、冠冕、庇护、臂膀”维持经文的崇高语感，同时避免生僻古语；用分号呈现赏赐与神施行保护之间的因果关系。
