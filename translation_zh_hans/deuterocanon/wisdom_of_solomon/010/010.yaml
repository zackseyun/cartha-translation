base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: zh_hans
  text: 她引导那因弟兄的怒气而逃亡的义人走笔直的道路；她向他显明上帝的国，赐给他对神圣之事的认识[a]；她使他在劳苦中亨通，并使他劳碌的成果增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赐给他有关圣者的知识”。希腊语可指神圣之事，也可指圣洁的人或灵界存在。
    reason: 保留 γνῶσιν ἁγίων 的语法和语义歧义。
  - marker: b
    text: 较直译为“使他的劳苦（或痛苦）增多”。这里按上下文译作劳碌所得的成果增多。
    reason: 说明 πόνοι 的字面意义与本节正面语境所支持的译法。
lexical_decisions:
- source_word: αὕτη
  choice: 她
  rationale: 阴性指示代词回指上下文中被人格化的“智慧”；用“她”既保留照应，也保留人格化表达。
- source_word: φυγάδα ὀργῆς ἀδελφοῦ δίκαιον
  choice: 那因兄长发怒而逃亡的义人
  rationale: φυγάδα 表示逃亡者，属格短语说明逃亡缘由；δίκαιον 是阳性单数名词化形容词，译作“义人”自然且准确。
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: 引导……走正直的道路
  rationale: 保留“引导”和“道路”的比喻；“正直”既可表达道路笔直，也与经文中的正道意象相合。
- source_word: βασιλείαν θεοῦ
  choice: 上帝的国
  rationale: 直接对应原文，采用现代汉语中庄重而通行的圣经表达。
- source_word: γνῶσιν ἁγίων
  choice: 有关神圣之事的知识
  rationale: ἁγίων 可理解为中性复数“神圣之事”，也可能指“圣者”；正文采用前者，脚注保留原文歧义。
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: 使他在劳苦中亨通
  rationale: εὐπορέω 表示使人顺利、富足或亨通；ἐν μόχθοις 指在辛劳之中，译文保留两者的张力。
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: 使他劳碌的成果增多
  rationale: 字面可作“使他的劳苦增多”，但在连续施恩的语境中，πόνοι 可指劳作所得；正文采用语境较合适的含义，并以脚注注明字面可能。
theological_decisions:
- issue: 人格化智慧的指称
  choice: 以阴性代词“她”承接人格化的智慧
  alternative: 在本节明说“智慧”
  rationale: 原文只有阴性指示代词，并未重复名词；“她”能忠实保留上下文照应和文学人格化。
- issue: γνῶσιν ἁγίων 的所指
  choice: 有关神圣之事的知识
  alternative: 有关圣者的知识
  rationale: 该属格复数在形式上容许两解；正文按启示神圣现实的语境处理，同时在脚注中明确保留另一种解释。
- issue: τοὺς πόνους αὐτοῦ 在正面语境中的含义
  choice: 他劳碌的成果
  alternative: 他的劳苦／痛苦
  rationale: 本节各分句都描述智慧对义人的帮助，因此正文取 πόνοι 可指劳作所得的语义；但不掩盖较字面的读法，故加脚注。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“义人”“上帝的国”“亨通”等词保留经文语体，但避免古奥句式；分号对应原文层层推进的结构。
