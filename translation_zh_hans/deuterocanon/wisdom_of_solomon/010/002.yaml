  text: 又赐给他力量，使他能掌管万物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌管”也可译作“掌控”；原文动词可指取得或施行支配权。
    reason: 说明κρατῆσαι兼有掌握、控制和统治的语义，不将其强度限定为单一解释。
lexical_decisions:
- source_word: ἔδωκέν
  choice: 赐给
  rationale: δίδωμι在此表示给予；“赐给”自然体现智慧作为施予者，并符合本书庄重的叙述语体。
- source_word: τε
  choice: 又
  rationale: 连接本句与上文，表达承接和追加，汉语用“又”简洁自然。
- source_word: αὐτῷ
  choice: 他
  rationale: 阳性单数与格代词，承接上下文所说的人。
- source_word: ἰσχὺν
  choice: 力量
  rationale: ἰσχύς指力量、能力；译作“力量”既直接，又与后面的目的性表达自然衔接。
- source_word: κρατῆσαι
  choice: 使他能掌管
  rationale: κρατέω在此可表示取得或施行支配权；以“使他能掌管”表达不定式与所赐力量之间的关系，同时保留统治、控制的语义范围。
- source_word: ἁπάντων
  choice: 万物
  rationale: ἅπας的复数属格具有全面范围；“万物”简洁庄重，也不擅自把范围限定为受造物或生物。
theological_decisions:
- issue: 此处亚当所得权柄的范围
  choice: 掌管万物
  alternative: 掌管一切；制伏万物
  rationale: 原文仅笼统地说ἁπάντων，并未明确补出“受造界”或“各种生物”。译作“万物”保留其广泛范围，也不把可能呼应人类受托治理的含义解释得过细。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“又”承接上文；“赐给他力量，使他能……”避免生硬直译希腊语结构。“万物”保持原文范围的概括性。
