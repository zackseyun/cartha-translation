  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/016.yaml
  text: She entered into the soul of a servant of the Lord[b][a], and stood against fearsome kings with wonders and signs.
translation:
  language: zh_hans
  text: 她进入主的一位仆人的心灵[a]，并以奇事和神迹[b]抵挡可怕的君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里“主的一位仆人”从上下文看是指摩西。
    reason: cross_reference
  - marker: b
    text: 或译：“带着奇事和神迹”。希腊文在此既可表示所用的手段，也可表示伴随的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: 不定过去时，直接表示进入；保留智慧进入人内在生命的具体意象。
- source_word: ψυχὴν
  choice: 心灵
  rationale: ψυχή在此指人的内在生命或自我；“心灵”在现代汉语中自然，也比单纯译作“心思”更能保留其人论意味。
- source_word: θεράποντος Κυρίου
  choice: 主的一位仆人
  rationale: θεράπων指服侍者或仆人，并可含尊荣意味；原文未直接点名摩西，因此正文保留普通名词表达。
- source_word: ἀντέστη
  choice: 抵挡
  rationale: 表示站出来反对、抗拒；“抵挡”简洁自然，并保留对抗意味。
- source_word: βασιλεῦσι φοβεροῖς
  choice: 可怕的君王
  rationale: φοβερός在此表示令人惧怕；“可怕的”避免被误解为君王自己害怕。
- source_word: ἐν τέρασι καὶ σημείοις
  choice: 以奇事和神迹
  rationale: ἐν在此可表示手段或伴随情形；正文采用工具义的“以”，并以脚注保留伴随义。τέρας与σημεῖον构成圣经常见的成对用语。
theological_decisions:
- issue: 本节省略主语的指代与拟人化性别
  choice: 用“她”承接上下文中拟人化的“智慧”
  alternative: 在正文重复“智慧”，或用不带性别的“它”
  rationale: 希腊文动词本节没有明示主语，但上下文持续以阴性、拟人化的智慧为行动者；“她”既保持篇章连贯，也不在本节额外添入名词。
- issue: “主的仆人”的身份
  choice: 正文保留普通名词，不直接写“摩西”
  alternative: 译作“摩西”
  rationale: 上下文可确认所指为摩西，但本节希腊文只写“主的仆人”；正文忠实保留原文措辞，并在脚注说明。
- issue: ἐν所表达的关系
  choice: 正文译作手段义“以”
  alternative: 译作伴随义“带着”
  rationale: 该介词短语既可表示借助奇事和神迹，也可表示在这些现象伴随之下；正文选取较自然的工具义，脚注保存另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心灵”保留ψυχή的内在生命意味；“奇事和神迹”保持圣经语体中的固定搭配。脚注标记依其在正文中的实际位置顺排。
