base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: zh_hans
  text: 她赐给圣洁的人为自己劳苦所应得的报偿，引导他们走奇妙的路；她成为他们白昼的庇护，并在黑夜成为星辰的火焰[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的景象使人联想到神在出埃及时的引导和保护，尤其是白昼的云与黑夜的火；但希腊原文只作含蓄暗示，并未使用完整的传统说法。
    reason: cross_reference
  - marker: b
    text: “星辰的火焰”直译自希腊文；也可按诗性表达理解为“繁星般的火焰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: 把……所得的报偿赐给
  rationale: 该动词有交付、偿还、给予应得之物之意；与 μισθὸν κόπων 连用时，表达因劳苦而得的回报，同时避免把语气过度商业化。
- source_word: ὁσίοις
  choice: 圣洁的人
  rationale: ὅσιος 指敬虔、忠于神或圣洁的人；此译保留其形容词实体化的特点，又不引入后期技术性称谓。
- source_word: μισθὸν κόπων αὐτῶν
  choice: 他们劳苦所得的报偿
  rationale: μισθός 可指工价或报偿，κόπος 强调辛劳；此译兼顾应得的回报与艰苦付出。
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: 引导他们走奇妙的路
  rationale: 用现代汉语自然表达‘在奇妙的道路上引导他们’，保留道路意象及 θαυμαστός 所含的非凡、令人惊奇之意。
- source_word: σκέπην
  choice: 庇护
  rationale: 该词可指遮蔽、掩护或保护；‘庇护’在此清楚表达白昼中的保护作用。
- source_word: φλόγα ἄστρων
  choice: 星辰的火焰
  rationale: 按压缩的希腊语结构直译，保留‘火焰’与‘星辰’之间可能存在的属格歧义，不直接改写为传统的‘火柱’。
theological_decisions:
- issue: 本节隐含主语的身份
  choice: 用“她”承接上下文中人格化的智慧
  alternative: 在正文中明确补出“智慧”，或用不标性别的重复名词
  rationale: 本节希腊文没有重述主语，但上下文以“智慧”为施事者。现代汉语不能像希腊语那样自然省略全部主语；用“她”承接阴性名词“智慧”，既避免额外补词，也保留人格化表达。
- issue: 与出埃及云柱、火柱传统的关联
  choice: 正文照原文译作“白昼……庇护；黑夜……星辰的火焰”
  alternative: 扩译为“白昼的云柱和黑夜的火柱”
  rationale: 经文明显使人联想到出埃及传统，但希腊文本并未采用完整的传统公式，因此不在正文中补入“云柱”或“火柱”。
- issue: φλόγα ἄστρων 的语义关系
  choice: 保留为“星辰的火焰”
  alternative: 译作“星光般的火焰”或“繁星般的火焰”
  rationale: ἄστρων 是属格复数，关系较为压缩；直译保留真实歧义及诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号划分三个并列动作，并重复“她成为”，使汉语关系清楚。正文保留出埃及意象的含蓄性和“星辰的火焰”的诗性歧义。
