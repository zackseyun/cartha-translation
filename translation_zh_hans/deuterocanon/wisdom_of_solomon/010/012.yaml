base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: zh_hans
  text: 她保护他免受仇敌伤害，也使他免受那些埋伏之人的伤害；她在一场艰苦的较量中为他作出裁决[a]，使他知道敬虔比一切都更有力量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一场艰苦的较量中为他作出裁决”也可译作“赐他一场艰苦的较量”或“使他在艰苦的较量中得奖”。希腊原文的动词带有竞赛中的裁判或授奖意象；正文不明确补出较量的结果。
    reason: lexical_alternative
  - marker: b
    text: “敬虔”也可译作“虔敬”，指对上帝的敬重与忠诚，以及这种态度在生活中的表现。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  choice: 保护
  rationale: 表达严密守护、使其免遭危险；“保护他脱离仇敌”自然且忠实于ἀπό结构。
- source_word: ἐχθρῶν
  choice: 仇敌
  rationale: 准确指敌对者，语体庄重而通俗。
- source_word: ἐνεδρευόντων
  choice: 埋伏他的人
  rationale: 保留分词所含设伏袭击的具体意象，不泛化为仅仅“谋害”。
- source_word: ἠσφαλίσατο
  choice: 使他安然躲过
  rationale: 传达使其稳妥安全之意，并与埋伏的场景自然衔接。
- source_word: ἀγῶνα ἰσχυρὸν
  choice: 一场艰苦的较量
  rationale: ἀγών兼有竞赛、较量和斗争之义，ἰσχυρός强调其强烈艰难；此译保留竞赛意象而不限定为体育比赛。
- source_word: ἐβράβευσεν αὐτῷ
  choice: 为他裁定
  rationale: 该动词带有裁判、判定或授奖的竞赛语义；“裁定”保留其不寻常的裁判意象，也不擅自把结果解释成胜利。
- source_word: ἵνα γνῷ
  choice: 使他知道
  rationale: 简洁保留目的或预期结果关系。
- source_word: παντὸς δυνατωτέρα
  choice: 比一切都更有力量
  rationale: 保留比较级及其涵盖一切的范围，中文自然明确。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 指向对上帝的虔敬以及由此体现的生活方式，比单纯“敬畏”范围更广。
theological_decisions:
- issue: 本节各动词隐含的阴性主语
  choice: 译作“她”，承接上下文中人格化的智慧
  alternative: 在本节直接补出“智慧”
  rationale: 希腊文本本节未重复主语；用“她”既保留上下文的人格化，也不在本节增添明说内容。
- issue: ἐβράβευσεν与ἀγῶνα ἰσχυρόν的关系
  choice: 译作“为他裁定了一场艰苦的较量”
  alternative: “使他在艰苦的较量中获胜”或“把艰苦的较量赐给他”
  rationale: 原文的裁判、竞赛及授奖语义交叠，难以用单一汉语表达完全复现；本译不把它直接化约为“得胜”，从而保留智慧、苦斗与认识敬虔力量之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号保留原句前后保护与教导目的的推进。“安然躲过”使埋伏场景在中文中通顺；关键的竞赛—裁判隐喻因汉语难以一词兼容，正文采用“裁定……较量”，并以脚注保存其他可能。
