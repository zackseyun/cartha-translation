base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: zh_hans
  text: 当列国同心作恶、陷入混乱时，智慧也找到了那义人[a]，保守他在上帝面前无可指责，又使他面对自己对孩子的怜爱仍然刚强[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那义人”按上下文很可能指亚伯拉罕，但希腊原文在这里没有写出他的名字。
    reason: cross_reference
  - marker: b
    text: 或译：“又保守他，使他虽对孩子满怀柔情，仍然坚定。”希腊文所说的是人内心深处对孩子的怜爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: 智慧
  rationale: 阴性指示代词回指上下文中人格化的“智慧”。汉语代词不标示阴性，明说“智慧”可使所指清楚。
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  choice: 因邪恶的同心
  rationale: ὁμόνοια 表示同心、意见一致，πονηρά 赋予其邪恶性质；这一译法保留了众民在恶事上同心的反常张力，没有过度具体化为某种阴谋。
- source_word: ἐθνῶν συγχυθέντων
  choice: 列国……陷入混乱时
  rationale: 以时间状语表达属格独立结构；“陷入混乱”传达 συγχέω 被动式的混乱、混淆之意，也保留可能指向巴别事件的含蓄性。
- source_word: εὗρεν τὸν δίκαιον
  choice: 找到了那义人
  rationale: 保留定冠词与阳性单数实体化形容词的指称作用；上下文可能指亚伯拉罕，但正文不补出名字。
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: 保守他在上帝面前无可指责
  rationale: τηρέω 译为“保守”，兼具看守与维持之意；θεῷ 用关系性的“在上帝面前”自然表达。
- source_word: ἐπὶ τέκνου σπλάγχνοις
  choice: 面对对孩子的怜爱
  rationale: σπλάγχνα 在此指内心深处的柔情、怜爱；ἐπί 与“刚强”连用，可表达面对这种亲情考验时仍坚定。τέκνον 保持较一般的“孩子”，不擅自改成“儿子”。
- source_word: ἰσχυρὸν ἐφύλαξεν
  choice: 使他……仍然刚强
  rationale: 以使役结构自然表达“守护他处于刚强状态”；“仍然”凸显在亲情张力之下的坚定，而不补述献祭等原文未明说的细节。
theological_decisions:
- issue: “那义人”的身份
  choice: 正文保留“那义人”，脚注说明上下文很可能指亚伯拉罕。
  alternative: 在正文直接译作“亚伯拉罕”。
  rationale: 上下文及对孩子的怜爱明显使人联想到亚伯拉罕，但希腊文本没有写出其名；保留称号符合原文明确程度。
- issue: 末句中亲情与刚强的关系
  choice: 译作“使他面对对孩子的怜爱仍然刚强”。
  alternative: “使他胜过对儿子的怜爱”或“在儿子的事上保守他刚强”。
  rationale: 原文表达父母深情与坚定之间的张力，却未明说献祭，也不必把亲情描写成被彻底克服的敌对力量；所选译法保留这种张力。
- issue: 邪恶中的同心
  choice: 译作“邪恶的同心”。
  alternative: “邪恶的阴谋”或“恶意的一致”。
  rationale: ὁμόνοια 本身是同心、和谐，却被 πονηρά 修饰；直保这种道德反差，比“阴谋”更少加入计划性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邪恶的同心”略带文学性，用以保留原文把“同心”与“邪恶”并置的反常表达；末句避免补入“献祭”“儿子”等原文没有明说的内容。
