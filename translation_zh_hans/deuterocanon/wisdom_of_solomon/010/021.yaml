base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/021.yaml
  text: For wisdom opened the mouths of the mute[c][b][a], and made the tongues of infants eloquent.
translation:
  language: zh_hans
  text: 因为智慧[a]使不能说话的人开口[b]，又使婴孩的舌头吐字清晰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段把“智慧”人格化，写成主动施行作为的主体。
    reason: alternative_reading
  - marker: b
    text: 希腊词也可指“耳聋的人”；这里上下文谈到口、舌头和说话，因此正文译作“不能说话的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使婴孩的舌头说话清楚（或表达分明）。”希腊文强调言语清晰、可辨。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 保留该词“智慧”的基本词义；句中把智慧写成主动施行者，人物化意味可由语法自然显出，无须借助中文中并不存在的大小写区别。
- source_word: ἤνοιξεν στόμα κωφῶν
  choice: 使不能说话的人开口
  rationale: κωφός可指耳聋或不能说话的人；本句紧接“口”和“舌头”，语境着重说话能力，因此正文取“不能说话的人”。中文用“使……开口”自然传达“开启其口”的意象。
- source_word: γλώσσας νηπίων
  choice: 婴孩的舌头
  rationale: 保留γλῶσσα的身体意象，并将νήπιος译作“婴孩”，呈现尚不善言语者蒙赋予清楚表达能力的反差。
- source_word: ἔθηκεν τρανάς
  choice: 使……吐字清晰
  rationale: τρανός表示清楚、分明、明晰；“吐字清晰”既符合现代汉语，也保留此处关于清楚、可辨言语的重点，而不把它过度解释为修辞上的雄辩。
theological_decisions:
- issue: σοφία的人格化
  choice: 正文译作“智慧”，通过其主动行为显出人格化表达
  alternative: 译作带专名意味的“智慧者”或以其他方式强化人格化
  rationale: 希腊文把智慧作为行动主体，但中文没有相当于英文首字母大写的中性标记。直译“智慧”既保留词义，也避免将文学性人格化进一步定格为特定神学身份。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“使……开口”保留原文开启口的意象，同时避免“哑巴”等今日可能显得不够尊重的称呼；“吐字清晰”自然表达τρανάς，但脚注保留“说话清楚／表达分明”的词义范围。
