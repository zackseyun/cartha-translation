  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
translation:
  language: zh_hans
  text: 但智慧淹没了他们的仇敌[a]，又使他们从深渊的深处涌上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又使他们从深渊的深处翻涌上来。”希腊文动词可指使某物涌起或升上来；这里很可能描写海水把仇敌从深处带上来。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέκλυσεν
  choice: 用洪水淹没
  rationale: 该动词表示以水淹没、吞没；此译保留鲜明的水灾意象，同时不在动词本身之外明说仇敌已经死亡。
- source_word: ἐχθρούς
  choice: 仇敌
  rationale: 这是该复数名词在庄重叙事中的自然标准译法。
- source_word: ἐκ βάθους ἀβύσσου
  choice: 从深渊的深处
  rationale: 贴近希腊文单数 βάθους 与 ἀβύσσου 的结构，保留深水与无底深渊的宏大意象。
- source_word: ἀνέβρασεν
  choice: 冲了上来
  rationale: 该动词可表示使某物翻涌、冒起或被抛上来；结合海水的语境，‘冲了上来’自然呈现深渊之水将仇敌带回水面的动态图景。
- source_word: αὐτούς
  choice: 他们
  rationale: 代词回指前面的‘仇敌’，中文照常明确译出。
theological_decisions:
- issue: 海中审判的意象
  choice: 保留洪水淹没并将仇敌从深渊冲上来的具体意象，不加入‘淹死’或‘尸体’。
  alternative: 解释性地译为‘淹死他们的仇敌，又把他们的尸体从深渊带上来’。
  rationale: 经文唤起出埃及过海时的审判，但希腊文本身以两个生动动词描写事件，没有直接说‘死亡’或‘尸体’；译文因此不替原文消除这一张力。
- issue: 动词主语的显明
  choice: 将省略的主语按上文语境译为‘智慧’。
  alternative: 依中文承接关系只译‘但她……’，或不明说主语。
  rationale: 希腊文动词主语承接本章反复出现的‘智慧’；中文若孤立呈现本节，明说‘智慧’更清楚，也避免无先行词的代词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。‘用洪水淹没’保留水审判意象；‘深渊的深处’维持原文的崇高语体；‘冲了上来’兼顾海水语境中的力度与中文自然度。脚注标记已在正文中列出。
