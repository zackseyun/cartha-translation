  text: He brought them across the Red Sea, and led them through abundant water;
translation:
  language: zh_hans
  text: 她使他们渡过红海，又领他们穿过大水[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穿过许多水。”希腊文直译为“穿过大量的水”。
    reason: 说明διʼ ὕδατος πολλοῦ的较贴近字面的译法，并保留“大水”所概括的水量广大之意。
lexical_decisions:
- source_word: διεβίβασεν
  choice: 使……渡过
  rationale: 该动词含使人越过、将人送过之意；“使他们渡过”既保留使役意味，又符合现代汉语表达。
- source_word: θάλασσαν ἐρυθράν
  choice: 红海
  rationale: 这是出埃及传统中该海域的通行专名，译作“红海”清楚自然。
- source_word: διήγαγεν
  choice: 领……穿过
  rationale: 该动词意为领着或带着经过；“领他们穿过”保留引导前行的意象，也与前句“渡过”有所区分。
- source_word: διʼ ὕδατος πολλοῦ
  choice: 穿过浩瀚的水域
  rationale: 原文为单数“许多／大量的水”；“浩瀚的水域”自然庄重，表达水量广大，同时不硬译为复数“众水”。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 按上下文指智慧所护佑的圣民；希腊文代词本身为阳性复数宾格，译作“他们”。
theological_decisions:
- issue: 未明说的主语及其阴性指向
  choice: 她
  alternative: 智慧
  rationale: 本节希腊文动词未明列主语，但上下文持续以阴性“智慧”为施事者。译作“她”承接前文，又不在本节重复补入原文未写出的名词。
- issue: 出埃及事件与海的名称
  choice: 红海
  alternative: 红色的海
  rationale: θάλασσαν ἐρυθράν在此明确呼应出埃及过海事件；采用现代汉语通行专名“红海”，不另作教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“使他们渡过……又领他们穿过……”保留两个希腊动词的差异和平行结构；句末沿用原文未完结的分号语气。
