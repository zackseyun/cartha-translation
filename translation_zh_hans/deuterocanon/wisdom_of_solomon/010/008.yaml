base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: zh_hans
  text: 因为他们对智慧置之不理，不但因不认识何为美善而受害，也给人世间[a]留下他们愚妄的记号，使他们在所失足的事上，甚至无法逃过人的注意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人世间”或可译作“生命”或“人生”；希腊语βίος在这里可能泛指活人所处的人类生活世界。
    reason: 保留τῷ βίῳ的词义范围及所指对象的歧义。
lexical_decisions:
- source_word: παροδεύσαντες
  choice: 过而不顾
  rationale: 原词本义是从旁经过、越过；此处也含忽视智慧之意。“过而不顾”既保留行经而过的意象，也自然传达漠视。
- source_word: ἐβλάβησαν
  choice: 受了损害
  rationale: 保留被动语态及宽泛的受损含义，可涵盖道德与实际层面的损失。
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: 因不认识美善之事
  rationale: τὰ καλά兼有美好、高尚、良善之意；“美善之事”保留其伦理意味与词义幅度，而不局限为实用的好处。
- source_word: τῆς ἀφροσύνης
  choice: 他们愚妄
  rationale: ἀφροσύνη指缺乏明辨所表现的愚昧或愚妄；“愚妄”符合本节庄重的道德语气。
- source_word: ἀπέλιπον
  choice: 留下了
  rationale: 准确表达遗留在身后的结果，并与持久的“纪念”自然搭配。
- source_word: τῷ βίῳ
  choice: 给人世
  rationale: βίος在此可能泛指活人所处的人类生活世界；“人世”在现代汉语中自然，并以脚注保留“生命／人生”的可能理解。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 指使某事持续被记住的标志或记念；“纪念”保留其公开而长久的意味。
- source_word: ἔσφαλησαν
  choice: 失足
  rationale: 该词可指绊倒、犯错或走入歧途；“失足”保留其动作意象及道德偏离的意味。
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: 甚至无法不被察觉
  rationale: 忠实保留“不能逃过注意／不能隐而不显”的含义，也保留原文否定结构的力度。
theological_decisions:
- issue: τὰ καλά的伦理力度
  choice: 美善之事
  alternative: 好事；高尚之事
  rationale: “美善”兼顾καλά所含的良善、高尚与美好，不把经文缩减为物质利益，也不引入特定哲学体系。
- issue: 过犯不能隐藏的范围
  choice: 在自己失足的事上，甚至无法不被察觉
  alternative: 他们的过错无法隐藏
  rationale: 保留ἐν οἷς的关系结构，不把原文扩大成他们一切行为或所有过错都必然公开。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“过而不顾”略带凝练色彩，用以保留原文“从旁经过”与“忽视”并存的意象；其余句法尽量自然清晰。
