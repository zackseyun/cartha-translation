base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: zh_hans
  text: 当不敬畏神的人正在灭亡时，她救出了一个逃离降在五城[a]之上之火[b]的义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “五城”指与所多玛相关的五城联盟；本节暗指罗得逃生的事。
    reason: cross_reference
  - marker: b
    text: 原文也可译作“那降下的火”；希腊文说火降在五城之上，却没有明确说是“从天上”降下。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: 她
  rationale: 阴性指示代词承接上文人格化的“智慧”；用“她”保留这一文学形象，又不在本节重复补出“智慧”。
- source_word: δίκαιον
  choice: 一个义人
  rationale: 无冠词的阳性单数宾格指被救者，语境中暗指罗得；“义人”准确保留其道德含义，同时不在正文中明说姓名。
- source_word: ἐξαπολλυμένων
  choice: 正在灭亡
  rationale: 现在时中被动分词表达毁灭正在发生的过程；“正在灭亡”保留过程性，也不额外限定施事者。
- source_word: ἀσεβῶν
  choice: 不敬神的人
  rationale: 该词突出对神缺乏敬畏的宗教—道德含义，比宽泛的“恶人”更贴近原词。
- source_word: ἐρρύσατο
  choice: 救出了
  rationale: 该动词表示从危险中搭救；“救出了”自然清楚，并符合具体逃生场景。
- source_word: φυγόντα
  choice: 那人逃离了
  rationale: 不定过去时分词描述义人的逃离与获救相连；汉语拆为后续分句，可自然呈现动作关系而不过度规定严格的先后次序。
- source_word: πῦρ καταβάσιον
  choice: 降在……之上的火
  rationale: καταβάσιον意为向下而降；此译保留火降临五城的方向性，不擅自补入原文未明说的“从天上”。
- source_word: Πενταπόλεως
  choice: 五城
  rationale: 指与所多玛有关的五城联盟；意译为“五城”比音译地名更易懂，也保留原文概括性的称呼。
theological_decisions:
- issue: 阴性主语αὕτη的所指
  choice: 以“她”指承接上文人格化的智慧
  alternative: 译作“这位”或直接补作“智慧”
  rationale: 《智慧篇》第10章持续把拯救行动归于人格化的智慧；“她”既维持篇章衔接和人格化表达，也不引入后来的教义认同。
- issue: 义人与五城的身份
  choice: 正文维持隐指，以脚注说明与罗得及所多玛相关
  alternative: 正文直接写出“罗得”和“所多玛”
  rationale: 希腊文本只说“一个义人”和“五城”，没有明说罗得或所多玛；正文保留这种含蓄，脚注帮助现代读者辨认典故。
- issue: 火的来源
  choice: 只译为降在五城之上的火
  alternative: 译为“从天降下的火”
  rationale: 原文说明火向下降临，却未明确说“从天上”；不补明来源可保留原文措辞的边界。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不敬神的人”保留ἀσεβῶν的宗教—道德色彩；分号连接获救与逃离的叙述，使汉语顺畅，同时维持原文紧凑结构。所有脚注标记均置于正文对应词语之后。
