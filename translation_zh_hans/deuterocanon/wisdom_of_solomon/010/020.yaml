base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: zh_hans
  text: 因此，义人从不敬神的人那里夺取了战利品[a]；主啊，他们歌颂你的圣名，又同心赞美你那为人争战的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从……那里夺取战利品”也可译作“掠夺了不敬神的人”或“从不敬神的人那里取了掳物”。希腊词指从败敌那里夺取战利品。
    reason: lexical_alternative
  - marker: b
    text: “为人争战的手”也可译作“护卫人的手”或“为人出战的手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 表达由上文的拯救引出的推论，简洁自然。
- source_word: δίκαιοι
  choice: 义人
  rationale: 保留实词化复数形容词所表达的道德与神学类别，不在正文中增添族群身份。
- source_word: ἐσκύλευσαν
  choice: 夺取了……的战利品
  rationale: 准确呈现从败敌取走掳物的具体军事图景，比笼统的“抢夺”更明确。
- source_word: ἀσεβεῖς
  choice: 不敬神之人
  rationale: 突出该词对神不虔敬的宗教含义，而不只表示一般性的邪恶。
- source_word: ὕμνησαν
  choice: 歌颂
  rationale: 保留以诗歌或颂歌赞美的意味，并与后文一般性的“赞美”有所区别。
- source_word: Κύριε
  choice: 主啊
  rationale: 自然呈现对神的呼格称呼。
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: 你的圣名
  rationale: 采用清楚而庄重的圣经惯用表达。
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: 你那为他们争战的手
  rationale: 保留“手”的比喻，并表达ὑπέρμαχος为人作战、护卫其人的主动军事意味；“他们”依上下文指义人。
- source_word: ᾔνεσαν
  choice: 赞美
  rationale: 采用一般性的赞美用语，与ὕμνησαν的歌唱意味形成对应区别。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 强调共同意志与一致心志，而非仅仅同时行动。
theological_decisions:
- issue: “义人”与“不敬神之人”的历史所指
  choice: 正文保留“义人”和“不敬神之人”的概括性称谓。
  alternative: 明确译作“以色列人”和“埃及人”。
  rationale: 上下文虽指向以色列人离开埃及时夺取埃及人的财物，但希腊文本采用道德—宗教类别而非族群名称，译文不应把上下文解释直接写入正文。
- issue: 神之“手”的行动含义
  choice: 译作“你那为他们争战的手”。
  alternative: “你保护人的手”或“你大能的手”。
  rationale: 此译保留神之“手”的圣经意象，也保留ὑπέρμαχος代表人出战、为人辩护和护卫的张力，避免弱化为抽象的能力。
- issue: “为他们”所指对象
  choice: 以“他们”承接本节的义人。
  alternative: 译作“为我们争战”，或不明说受益者。
  rationale: 希腊形容词表达“为一方作战”的性质，但没有第一人称代词；采用第三人称可按叙述语境说明关系，又不擅自改成“我们”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”保留直接呼告；以“歌颂／赞美”反映两个希腊动词的差异；“同心”自然表达共同一致的心志。所有脚注标记均已置于正文相应位置。
