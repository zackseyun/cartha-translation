base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: zh_hans
  text: 她陪他下到坑里[a]，在锁链中也没有撇下他，直到把王国的权杖和管辖那些曾统治他之人的权柄带给他；她揭露那些诬告他的人为虚假的[b]，并赐给他永远的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牢坑里”；希腊文直译为“坑里”，可指用作囚牢的坑或蓄水池。
    reason: lexical_alternative
  - marker: b
    text: 或译“证明那些指控他的人所言不实”。
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη
  choice: 陪他下到
  rationale: 该复合动词含共同下去之意；“陪他下到”自然地表达智慧与他一同进入困境。
- source_word: εἰς λάκκον
  choice: 到坑里
  rationale: λάκκος本义为坑，也可指蓄水池或用作囚牢的坑；正文保留具体意象，脚注说明语境含义。
- source_word: ἐν δεσμοῖς
  choice: 在锁链中
  rationale: δεσμοί指捆绑或镣铐；此译保留原文意象并清楚表达受囚状态。
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: 也没有撇下他
  rationale: 此处ἀφίημι表示离弃、丢下；“没有撇下”自然且能体现智慧持续与他同在。
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: 直到把……带给他
  rationale: φέρω与间接受格连用可表示带给或授予；“带给他”保留动词的具体色彩。
- source_word: σκῆπτρα βασιλείας
  choice: 王国的权杖
  rationale: 希腊文σκῆπτρα为复数，可能是惯用或强化用法；汉语以单数类称表达王权象征较自然，同时不扩展其含义。
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: 管辖那些曾统治他的人的权柄
  rationale: τυραννέω含专横统治、支配之意；“曾统治他的”保留地位逆转，也避免直接将其窄化为“压迫者”。
- source_word: ψευδεῖς ... ἔδειξεν
  choice: 显明……是虚假的
  rationale: 该结构表示显出某些人为假；此译保留形容词表达，不擅自改为“骗子”。
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: 那些诬告他的人
  rationale: μωμάομαι可指责备、非难或挑错；约瑟叙事背景涉及不实控告，“诬告”准确传达敌意与虚假性，同时脚注保留较宽泛译法。
- source_word: δόξαν αἰώνιον
  choice: 永远的荣耀
  rationale: αἰώνιος在此表示长存、永远；该译庄重、通顺，也符合智慧文学语体。
theological_decisions:
- issue: 本节阴性主语的身份
  choice: 以“她”指代上下文中人格化的智慧
  alternative: 句首明说“智慧”
  rationale: 希腊文由上下文承接阴性主语；使用“她”保存原文衔接及人格化表达，不额外作教义身份认定。
- issue: τυραννούντων的道德色彩
  choice: 译为“那些曾统治他的人的”
  alternative: “那些曾压迫他的人的”或“那些曾暴虐统治他的人的”
  rationale: 原词可以带专横、压迫意味，但正文采用较不窄化的表达，保留支配关系和地位逆转；不以更强措辞替原文消除语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“她”延续人格化智慧；句式尽量保留原文从苦难、获权到得荣耀的推进。所有脚注标记均已置于正文相应位置。
