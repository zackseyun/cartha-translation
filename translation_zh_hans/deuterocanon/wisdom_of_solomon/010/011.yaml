  text: When others overpowered him in greed[a], she stood by him and made him rich.
translation:
  language: zh_hans
  text: 当有人因贪婪胜过他时[a]，智慧站在他身旁，使他富足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当有人因贪婪压倒他时。”希腊文较直译可作“当有人在贪婪中胜过他时”；此处介词短语可表示情状、方式或相关动机。
    reason: 保留ἐν πλεονεξίᾳ对κατισχυόντων的情状、方式或动机色彩，以及κατισχύω可译为“胜过”或“压倒”的语义幅度。
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: 贪婪之徒
  rationale: πλεονεξία表示贪婪、贪得无厌；结合属格复数分词κατισχυόντων，汉语用“贪婪之徒”自然地表达那些在贪婪中行事的人，但不限定其具体身份。
- source_word: κατισχυόντων αὐτόν
  choice: 胜过他时
  rationale: κατισχύω意为胜过、压倒；“胜过他”较贴近原文，又保留其可能指占上风或压制的语义幅度。属格分词结构译为时间性从句“……时”。
- source_word: παρέστη
  choice: 站在他身旁
  rationale: παρίστημι在此有站在旁边、扶助之意；此译保留空间意象，也自然暗示支持，而不直接把隐含的援助意义完全明说。
- source_word: ἐπλούτισεν αὐτόν
  choice: 使他富足
  rationale: πλουτίζω意为使人富有、使人富足；“使他富足”庄重而易懂，并保留物质兴盛的直接含义。
theological_decisions:
- issue: παρέστη和ἐπλούτισεν的省略主语
  choice: 明译为“智慧”
  alternative: 依照希腊文保持主语省略
  rationale: 本章上下文持续以拟人化的“智慧”为施事者。现代汉语在此补出“智慧”，可明确承接上文，不额外引入神学解释。
- issue: κατισχυόντων所指之人的身份
  choice: 泛译为“贪婪之徒”
  alternative: 根据雅各叙事具体指认拉班等人
  rationale: 本节希腊文本身没有点名对手，因此不将上下文中的可能指涉写进正文，以保留原文的概括性。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“站在他身旁”保留原文形象；“富足”比“致富”更符合智慧文学语体。正文脚注标记与脚注一致。
