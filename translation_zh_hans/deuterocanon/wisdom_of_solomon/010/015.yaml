  text: She rescued a holy people and a blameless offspring from a nation of oppressors[a].
translation:
  language: zh_hans
  text: 她从压迫人的民族中，救出了圣洁的子民和无可指责的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “压迫人的民族”也可译作“施加苦难的民族”或“压迫他们的民族”。希腊语 θλιβόντων 可指施加苦难或压迫的人，也可用来描述该民族的行为。
    reason: 保留希腊分词可能作名词性或形容性理解的词汇与句法差异。
lexical_decisions:
- source_word: αὕτη
  choice: 她
  rationale: 阴性指示代词回指上下文中被人格化的智慧；用“她”自然保留其阴性人格化和承接关系，而不把原文代词明说为“智慧”。
- source_word: λαὸν
  choice: 子民
  rationale: 此处指作为共同体的以色列。“子民”既符合立约语境，也与后面的 ἔθνος“民族”保持词汇区别。
- source_word: ὅσιον
  choice: 圣洁的
  rationale: ὅσιος 可表达对上帝虔敬、圣洁之意；“圣洁”保留经文对这群子民的宗教与伦理评价。
- source_word: σπέρμα
  choice: 后裔
  rationale: 该词字面为“种子”，在此作集合意义，指血脉后代；“后裔”是现代汉语中自然且庄重的表达。
- source_word: ἄμεμπτον
  choice: 无可指责的
  rationale: 准确表达不受责难、无可非议之意，同时避免将其绝对化扩展为哲学意义上的完美。
- source_word: ἐρρύσατο
  choice: 救出了
  rationale: 该动词表示从危险或压迫中解救；“救出”清楚体现脱离某一处境，也不过度引入后来的系统神学含义。
- source_word: ἐξ
  choice: 从……中
  rationale: 表达脱离和来源；与“救出”搭配符合现代汉语习惯。
- source_word: ἔθνους
  choice: 民族
  rationale: 保留其群体、国族意义，并与 λαός 所译“子民”相区别；不增译为“外邦”。
- source_word: θλιβόντων
  choice: 压迫人的
  rationale: 现在主动分词表达施加苦难或压迫的性质。结合其修饰 ἔθνους 的句法，用“压迫人的”保留形容性理解，同时不擅自补出宾语“他们”。
theological_decisions:
- issue: 阴性代词 αὕτη 的所指
  choice: 按人格化的智慧译为“她”
  alternative: 明译为“智慧”，或直译为“这一位”
  rationale: 上下文以女性形象描写智慧的行动。“她”保留原文代词及文学人格化，又不添加原文此处未重复的名词。
- issue: ὅσιον 与 ἄμεμπτον 对获救群体的评价
  choice: 直译为“圣洁的”与“无可指责的”
  alternative: 译为“虔敬的”与“无瑕的”，或弱化为一般褒义词
  rationale: 原文以鲜明的宗教和伦理用语描写这群子民及后裔；译文保留这一张力，不借系统神学解释来限定或淡化。
- issue: θλιβόντων 与 ἔθνους 的关系
  choice: 按形容民族性质的分词译为“压迫人的民族”
  alternative: 将分词名词化，译为“压迫者的民族”；或补足宾语，译为“压迫他们的民族”
  rationale: 希腊语分词属格复数与 ἔθνους 的属格单数在形式上存在张力，可被理解为集合性的施事者或较自由的修饰关系。正文采用自然且较少增补的表达，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“子民”承载立约共同体色彩，“民族”对应另一希腊词，以保留原文区别；整句保持简洁有力。
