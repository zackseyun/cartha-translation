  language: zh_hans
  text: 但那不义的人离弃了她，便在弑兄的狂怒中灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在弑兄的狂怒中”也可按与格理解为“因弑兄的狂怒而”或“被弑兄的狂怒所驱使而”。
    reason: 说明ἀδελφοκτόνοις ... θυμοῖς与συναπώλετο之间可表示处境、原因或手段；不将前面的“她”误作“同灭亡”的对象。
lexical_decisions:
- source_word: ἀποστὰς ἀπ' αὐτῆς
  choice: 离弃了她
  rationale: 既保留“离开、背离”的动作，也保留阴性代词所指的智慧，与上下文衔接。
- source_word: ἄδικος
  choice: 不义的人
  rationale: 准确表达缺乏公义、行事不正之意，不额外指定该人物姓名。
- source_word: ἀδελφοκτόνοις ... θυμοῖς
  choice: 弑兄的狂怒
  rationale: 复合形容词明确涉及杀害兄弟；θυμός在此指强烈而致命的怒气，译作“狂怒”符合语境。
- source_word: συναπώλετο
  choice: 与她一同灭亡
  rationale: 保留动词中συν-的“一同”成分；此处与阴性复数“狂怒”在语法和意义上的关系存在难点，故在正文保留较直译表达并加注说明。
theological_decisions:
- issue: 不义之人的身份
  choice: 不在正文点名
  alternative: 明确译为“该隐”
  rationale: 经文借弑兄行为明显影射该隐，但希腊文只称其为“不义的人”；不把解释直接写入正文。
- issue: 阴性代词“她”的所指
  choice: 保留“她”
  alternative: 明译为“智慧”
  rationale: 上文以阴性代词指智慧，保留代词可维持原文的拟人表达和篇章连贯。
- issue: συναπώλετο中“一同”的对象
  choice: 正文保留“与她一同”，脚注提示另一种句法理解
  alternative: 译为“因弑兄的狂怒而灭亡”
  rationale: 希腊文表面上ἀπ’ αὐτῆς提供最近的阴性单数所指，但复数与格ἀδελφοκτόνοις θυμοῖς也可能表达伴随或原因；不应无声消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弑兄”凝练呈现ἀδελφοκτόνοις；脚注处理原文句法难点，正文不直接点明该隐。
