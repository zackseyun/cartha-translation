base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/004.yaml
  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: zh_hans
  text: 因那人之故[a]，大地被洪水淹没时，智慧再次拯救了大地，用一块微不足道的木头为义人掌舵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因那人之故”也可译作“借着那人”。按上文，“那人”指离弃智慧的不义之人；这里通常表达他成为洪水审判的缘由。
    reason: 说明διά加宾格的语义范围及跨节回指，保留“因……之故”与“借着……”之间的细微歧义。
lexical_decisions:
- source_word: δι' ὃν
  choice: 因那人之故
  rationale: 介词διά与关系代词在此最自然地表达原因，回指上节的不义之人；译为“那人”保留跨节回指，同时避免在正文中直接补出其身份。
- source_word: κατακλυζομένην γῆν
  choice: 大地被洪水淹没时
  rationale: 保留现在时被动分词所表达的受灾过程；洪水语境下，γῆ译作“大地”比“土地”更符合整体范围。
- source_word: πάλιν διέσωσεν
  choice: 再次拯救了
  rationale: πάλιν直译为“再次”；διασῴζω含有使对象安然渡过危险的意味，“拯救”简洁自然，并能涵盖保存之意。
- source_word: σοφία
  choice: 智慧
  rationale: 保留本章中智慧作为主动行动者的拟人表达，不将其专名化，也不加入超出经文的位格判断。
- source_word: δι' εὐτελοῦς ξύλου
  choice: 用一块微不足道的木头
  rationale: ξύλον在此从材质角度暗指方舟；εὐτελής强调低微、寻常或不受重视，而非现代汉语中“廉价”可能暗示的劣质，因此译为“微不足道”。
- source_word: τὸν δίκαιον
  choice: 义人
  rationale: 这是现代中文圣经语体中自然而庄重的表达，保留阳性单数所指的挪亚，但不在正文中直接点名。
- source_word: κυβερνήσασα
  choice: 为……掌舵
  rationale: 该词具有航海中的驾驶、操舵含义；“掌舵”保留方舟叙事的航海意象，也清楚表达智慧是引导者。
theological_decisions:
- issue: 智慧的拟人化
  choice: 将“智慧”写作主动施行拯救并掌舵的主体，但不视为专名
  alternative: 将“智慧”大写或明确解释为具有独立位格的存在
  rationale: 希腊文确实赋予σοφία人格化行动，但本节本身不足以要求更强的本体论解释。
- issue: “那人”与“义人”的所指
  choice: 正文保留“那人”与“义人”；按上下文分别理解为前节的不义之人与挪亚
  alternative: 在正文中直接译为“因那个恶人”及“为挪亚掌舵”
  rationale: 所指由紧邻上下文和洪水典故可以辨明，但希腊正文未直接点名；保留间接称谓更忠实，也避免把解释写入正文。
- issue: “拯救了大地”的含义
  choice: 保留γῆν为动词的宾语，译作“拯救了大地”
  alternative: 解释性改译为“保存了大地上的生命”或将宾语理解为义人
  rationale: 希腊句法以γῆν为διέσωσεν的直接宾语。虽其语义可能指借保存幸存者而使大地得以延续，正文不宜擅自消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因那人之故”略带书面色彩，以准确承载因果关系；“为义人掌舵”保留原文鲜明的航海比喻。“微不足道的木头”强调所用媒介的卑微寻常，不暗示木料质量低劣。
