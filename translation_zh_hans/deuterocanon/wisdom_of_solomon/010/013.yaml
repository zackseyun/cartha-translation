  text: She did not abandon the righteous man when he was sold, but rescued him from sin;
translation:
  language: zh_hans
  text: 她没有抛弃那被卖的义人，却救他脱离罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη
  choice: 她
  rationale: 阴性指示代词回指上文拟人化的“智慧”；译作“她”既保持上下文指代，也不在本节重复增添原文未明说的名词。
- source_word: πραθέντα δίκαιον
  choice: 那被卖的义人
  rationale: 保留分词的被动意义及“义人”的明确称谓，指向被卖的约瑟。
- source_word: οὐκ ἐγκατέλιπεν
  choice: 没有抛弃
  rationale: 准确表达“没有离弃、遗弃”，用现代汉语中自然且庄重的措辞。
- source_word: ἐξ ἁμαρτίας ἐρρύσατο αὐτόν
  choice: 救他脱离了罪
  rationale: ἐκ/ἐξ与ῥύομαι构成“从……中救出”的表达；“脱离了罪”保留原文单数名词的概括性，不擅自限定为某一种罪或解释为罪的后果。
theological_decisions:
- issue: “从罪中救出”是指免于犯罪，还是脱离罪的权势或后果
  choice: 救他脱离了罪
  alternative: 使他免于犯罪
  rationale: 原文ἐξ ἁμαρτίας可容纳一定语义张力；直译式表达避免把意义单一限定为“没有犯某项罪”，同时在约瑟叙事语境中仍自然可懂。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“却”清楚呈现οὐκ…ἀλλά的转折；全句不加注释性成分，以保持原文的凝练。
