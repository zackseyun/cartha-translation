  text: But wisdom rescued those who served her from hardships[a].
translation:
  language: zh_hans
  text: 智慧却把服侍她的人从劳苦中救出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳苦”也可译作“辛劳”、“患难”或“痛苦”；希腊词可泛指劳作、苦楚或困厄。
    reason: 词义范围较广，正文无法同时呈现其所有可能侧重。
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 采用现代汉语中的常用抽象名词；同时借助后文的“她”保留希腊文鲜明的拟人表达，而不将其强行处理为专名。
- source_word: θεραπεύσαντας
  choice: 服侍……的人
  rationale: 该分词在这里表示对拟人化智慧的服事、侍候或忠诚投入。“服侍”既贴近原义，也能自然地与“她”搭配。
- source_word: αὐτὴν
  choice: 她
  rationale: 希腊文以阴性代词回指智慧，具有文学上的拟人作用；译作“她”可保留这一特点。
- source_word: ἐκ
  choice: 从……中
  rationale: 清楚表达被解救、脱离某种处境的关系，符合现代汉语习惯。
- source_word: πόνων
  choice: 劳苦
  rationale: 该词可涵盖劳作、辛苦、痛楚和患难。“劳苦”保留劳动与痛苦两方面的语义空间，避免只限定为身体疼痛或外在灾难。
- source_word: ἐρρύσατο
  choice: 解救出来
  rationale: 准确表达从困苦处境中救拔、脱离的动作，语言自然，也不额外加入超出本节语境的特定救恩含义。
- source_word: δὲ
  choice: 然而
  rationale: 保留承接语境时可能具有的转折意味；中文加逗号使句首衔接自然。
theological_decisions:
- issue: 智慧的拟人化
  choice: 将 σοφία 译作普通名词“智慧”，并以“她”指称
  alternative: 将“智慧”作为明确专名处理，或改用非人格化的“它”
  rationale: 原文既把智慧作为概念，又通过阴性代词和主动施救的行动将其拟人化。译文保留这种张力，不将其进一步界定为某一特定神格或位格，也不抹去拟人色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把……从……中解救出来”清楚流畅；“服侍她”保留原文的拟人特征，虽略带文学色彩，却不显古奥。
