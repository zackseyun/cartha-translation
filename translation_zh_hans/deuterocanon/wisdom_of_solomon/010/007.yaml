  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/007.yaml
  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
translation:
  language: zh_hans
  text: 那地方的邪恶，至今仍有冒烟的荒地、结着果实却不能成熟的植物，以及一根矗立的盐柱[a]作为见证；这盐柱是一个不信[b]之人的纪念碑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盐柱”暗指创世记19:26中的罗得妻子，但本节并未直接说出她的名字。
    reason: cross_reference
  - marker: b
    text: “不信”也可译作“不忠”。希腊词ἀπιστούσης可表示不相信，也可表示不忠实。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἧς
  choice: 那地方的
  rationale: 阴性属格关系代词承接上文所说之地；汉语补出“那地方”，使指代和属格关系自然清楚，又不增添具体地名。
- source_word: μαρτύριον τῆς πονηρίας
  choice: 邪恶……的见证
  rationale: μαρτύριον指可作证据、见证之物；τῆς πονηρίας在审判语境中指道德上的邪恶。
- source_word: καπνιζομένη χέρσος
  choice: 冒烟的荒地
  rationale: καπνιζομένη是现在分词，描写仍在冒烟；χέρσος指荒芜、未耕之地，而非天然沙漠。
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  choice: 结出不能成熟之果的植物
  rationale: 该短语描写植物虽结果，果实却不能达到成熟或完成的状态；采用动词化表达，使现代汉语清楚自然，同时保留异常结果的意象。
- source_word: ἑστηκυῖα στήλη ἁλός
  choice: 一根矗立的盐柱
  rationale: ἑστηκυῖα为完成时态分词，强调盐柱持续立着的状态；“矗立”保留其持久、醒目的形象。
- source_word: ἀπιστούσης ψυχῆς
  choice: 一个不信之人
  rationale: ψυχή在此以“人”表达比直译“灵魂”更符合现代汉语；ἀπιστούσης可指不信或不忠，正文取“不信”，并以脚注保留另一可能。
- source_word: μνημεῖον
  choice: 纪念碑
  rationale: 此处指使人记起某人及其结局的纪念性物体；“纪念碑”也与具体的盐柱形象相称。
theological_decisions:
- issue: 盐柱及“不信之人”的身份
  choice: 正文只作描述，不直接写明罗得的妻子
  alternative: 在正文中明确写作“罗得妻子的盐柱”
  rationale: 创世记19:26的典故十分明显，但本节希腊文本没有直接点名；保留含蓄指涉可避免把经文未明说的身份写进正文。
- issue: ἀπιστούσης的语义
  choice: 正文译为“不信”
  alternative: 译为“不忠”或“不守信”
  rationale: 该词可涵盖不相信、不信任或不忠实；正文采用贴近基本词义的“不信”，脚注说明另一语义，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句中先列出三项持续存在的见证，再用分号说明盐柱的纪念意义；不点明罗得妻子，以保留原文的含蓄。所有脚注标记均置于其实际说明的词语之后。
