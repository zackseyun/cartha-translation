  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/001.yaml
  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
translation:
  language: zh_hans
  text: 她守护了那位最初被造、当时独自一人的世人之父[a]；也救他脱离了自己的过犯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指第一个人亚当。
    reason: cross_reference
  - marker: b
    text: “过犯”也可译作“失足”或“罪过”；译作“堕落”则带有较多神学解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  choice: 她
  rationale: 阴性指示代词承接上文拟人化的“智慧”；译作“她”既保留照应关系，也不在本节擅自补出“智慧”。
- source_word: πρωτόπλαστον
  choice: 最初受造
  rationale: 保留“最先被塑造、形成”的意思；现代汉语中“受造”自然庄重，也避免用“首先被创造”造成生硬表达。
- source_word: πατέρα κόσμου
  choice: 世人之父
  rationale: κόσμος字面可指“世界”，但此处说亚当为人类始祖；“世人之父”保留“父”的原有意象，同时比“世界之父”更符合现代汉语且不过度扩写为“人类始祖”。
- source_word: μόνον κτισθέντα
  choice: 当时他独自一人
  rationale: μόνον强调他受造时孤身一人；拆成独立分句，使修饰关系在汉语中清楚自然。
- source_word: διεφύλαξεν
  choice: 守护
  rationale: 表达谨慎保护、保全之意，并与拟人化智慧的行动相称。
- source_word: ἐξείλατο
  choice: 救……脱离
  rationale: 准确传达搭救、解救之意，并自然承接希腊文ἐκ所引出的对象。
- source_word: παραπτώματος ἰδίου
  choice: 自己的过犯
  rationale: παράπτωμα可指失足、过犯或罪过；“过犯”保留道德分量，却不直接套用后来的神学术语“堕落”。
theological_decisions:
- issue: “最初受造、作世人之父的人”所指是谁
  choice: 正文依照希腊文以描述语指向亚当，不直接补出其名。
  alternative: 在正文中明确译作“亚当”。
  rationale: 原文并未出现“亚当”这个专名；保留含蓄指称可维持原文的文学表达，脚注则帮助读者确认所指。
- issue: παράπτωμα的神学表达
  choice: 过犯
  alternative: 堕落
  rationale: “堕落”容易成为特定神学事件的固定标签，而原词本身主要表示失足或过犯；“过犯”保留原文的道德意义和诠释空间。
- issue: 智慧如何救亚当脱离其过犯
  choice: 不解释具体方式，仅译出“救他脱离”。
  alternative: 解释为使他悔改、赦免他，或挽回堕落后果。
  rationale: 本节没有说明搭救的机制或范围；正文不应替原文消除这一神学上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“世人之父”保留原文的崇高称谓；将较长的希腊文宾语结构拆分为两个分句，以避免汉语修饰层次含混。
