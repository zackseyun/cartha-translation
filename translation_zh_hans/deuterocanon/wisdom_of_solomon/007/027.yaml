base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: zh_hans
  text: 她虽为一，却凡事都能；她仍安住于自身，却使万物更新[a]；她世世代代进入圣洁的灵魂[b]，使他们成为上帝的朋友和先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使万物焕然一新。”希腊文动词既可指更新，也可指使之成为新的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“转入圣洁的灵魂。”这里的分词描写智慧在接续的世代中进入圣洁的灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  choice: 虽为一
  rationale: 保留希腊文对智慧单一性的简洁陈述；不用“独一”，以免增添原文未明说的排他意味。
- source_word: πάντα δύναται
  choice: 凡事都能
  rationale: 自然、凝练地表达涵盖一切的能力，不改译为对万物的支配权。
- source_word: μένουσα ἐν αὐτῇ
  choice: 仍安住于自身
  rationale: 按上下文将 αὐτῇ 理解为反身用法，并保留分词所表达的持续状态以及智慧行动而不离自身的张力。
- source_word: τὰ πάντα καινίζει
  choice: 使万物更新
  rationale: καινίζει 可指更新或使之成为新的；正文采用现代汉语中自然且不过度套用固定神学措辞的“使万物更新”。
- source_word: κατὰ γενεὰς
  choice: 世世代代
  rationale: 表达智慧在接续的各代中反复行动，符合汉语习惯。
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: 进入圣洁的灵魂
  rationale: 保留 μεταβαίνουσα 的动态进入含义，也保留 ψυχὰς 的“灵魂”用语，不弱化为“人”。
- source_word: φίλους θεοῦ
  choice: 上帝的朋友
  rationale: 直接保留属格关系和亲近上帝的关系性表达。
- source_word: προφήτας
  choice: 先知
  rationale: 采用该词在圣经语境中的标准译法。
- source_word: κατασκευάζει
  choice: 使他们成为
  rationale: 在此语境中表示智慧将所进入的圣洁灵魂造就为上帝的朋友和先知；此译法清楚交代结果，同时避免机械性的“制造”。
theological_decisions:
- issue: 全节以阴性单数人格化智慧
  choice: 以“她”指智慧
  alternative: 反复使用“智慧”，或采用非人格化表达
  rationale: 希腊文明确以阴性单数形式人格化智慧；保留“她”可呈现原文的文学和神学张力，却不据此断定原文没有明说的位格身份。
- issue: “圣洁的灵魂”的含义
  choice: 保留“圣洁的灵魂”
  alternative: 译作“圣洁的人”或“圣民”
  rationale: ψυχὰς 明确指灵魂；直译保留原文的人论和智慧文学色彩，避免将其扁平化为泛指的人。
- issue: 智慧进入灵魂并使其成为上帝的朋友和先知
  choice: 保留进入与造就结果之间的关系，不解释其机制
  alternative: 解释为内住、启示、感动或赋予职分
  rationale: 原文陈述智慧进入圣洁灵魂并造就上帝的朋友和先知，却未界定这一行动的具体神学机制；译文不替原文作宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用三个并列分句保留希腊文的推进结构；“虽……却……”呈现智慧虽为一而能行万事、安住自身而更新万物的张力。脚注标记依其实际词汇对象分别置于“更新”和“灵魂”之后。
