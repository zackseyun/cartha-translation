  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/010.yaml
  text: I loved her more than health and beauty[a], and I chose to have her rather than light, because the radiance that comes from her never sleeps.
translation:
  language: zh_hans
  text: 我爱她，胜过健康与美貌；我宁愿拥有她，不要光明，因为她所发的光辉永不止息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为从她而来的光辉永不睡眠。”希腊文把智慧所发的光辉描写为从不止息。
    reason: 保留ἀκοίμητον的字面意象及另一种较形式对应的译法。
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  choice: 胜过健康与美貌
  rationale: ὑπέρ在此表示比较和偏爱；“胜过”自然地表达智慧比健康与外在美貌更可珍爱。
- source_word: ἠγάπησα αὐτήν
  choice: 我爱她
  rationale: 直译动词ἠγάπησα，并以阴性代词保留上下文中智慧的人格化形象。
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: 我宁愿拥有她，不要光明
  rationale: προειλόμην与ἀντί共同表达有意识的取舍和偏爱；此译保留“拥有她”与“光明”之间的对照。
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: 她所发的光辉
  rationale: φέγγος指亮光或光辉；“所发的”简洁呈现ἐκ ταύτης所表达的来源。
- source_word: ἀκοίμητον
  choice: 永不止息
  rationale: 该词字面为“不睡的”；修饰光辉时表示持续不灭。“永不止息”在现代汉语中自然，同时保留其不间断之意；字面意象收入脚注。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 使用“她”指智慧
  alternative: 使用“它”
  rationale: 希腊文在强烈的人格化语境中以阴性形式指智慧；“她”保留原文的诗性与神学张力，而不进一步断定其身份。
- issue: 智慧光辉的持续性意象
  choice: 正文译作“永不止息”
  alternative: 直译为“永不睡眠”
  rationale: ἀκοίμητον字面含“不睡”之意，但修饰光辉时表示不间断；正文采用自然汉语，脚注保留鲜明的字面隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；分号维持诗句前后两层取舍与理由的结构。“她”延续智慧的人格化，“光明／光辉”则保留原文相近而有区别的两个光意象。
