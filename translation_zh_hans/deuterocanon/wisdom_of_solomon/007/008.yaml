lexical_decisions:
- source_word: προέκρινα
  choice: 我宁愿选择她，而不要
  rationale: 该动词表达在若干对象中优先选择的比较意义；这一译法在现代汉语中自然，并清楚呈现智慧胜过王权象征。
- source_word: αὐτὴν
  choice: 她
  rationale: 代词指向上下文中以阴性形象人格化的智慧；用“她”保留原文的文学表达。
- source_word: σκήπτρων
  choice: 权杖
  rationale: 该词指象征君王权柄的杖；保留具体意象，不将其抽象化为“权力”。
- source_word: θρόνων
  choice: 王位
  rationale: 该词本义为宝座，此处转指君王地位；“王位”既保留王权意象，又符合现代汉语习惯。
- source_word: πλοῦτον
  choice: 财富
  rationale: 该名词表示物质财富；“财富”清楚、庄重，适合本节语境。
- source_word: οὐδὲν ἡγησάμην
  choice: 我把……看作一无所有
  rationale: 这一结构表达价值判断，意为在比较中视为毫无价值；译文保留其强烈评价。
- source_word: ἐν συγκρίσει αὐτῆς
  choice: 与她相比
  rationale: 明确呈现比较标准，简洁自然地对应希腊文结构。
theological_decisions:
- issue: 智慧的人格化
  choice: 以阴性人称“她”指智慧
  alternative: 使用非人格化的“它”
  rationale: 希腊文以阴性代词指向智慧，并在语境中将智慧人格化。译作“她”保留这种文学和神学张力，而不进一步断定其本体身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权杖和王位”保留王权的双重具体意象；分号对应原文两个紧密相连的比较判断。
