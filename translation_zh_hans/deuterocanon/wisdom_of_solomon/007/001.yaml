  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: zh_hans
  text: 我也同样是必死的人，与众人同等，是那位由大地而生、最初被塑造的人[a]的后裔；我在母腹中被塑造成肉身[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最初被塑造的人”暗指亚当。
    reason: cross_reference
  - marker: b
    text: 或译：“我在母腹中被塑造成了肉身。”
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητός
  choice: 必死的人
  rationale: 表达凡人必然死亡的处境，既保留“会死、难免一死”的含义，也符合现代汉语表达。
- source_word: ἴσος ἅπασιν
  choice: 与所有人平等
  rationale: 保留ἴσος所强调的共同地位，而不弱化为仅仅“和大家一样”。
- source_word: γηγενοῦς
  choice: 由大地而生
  rationale: 保留复合词“由地而生”的鲜明意象，不在正文中将其解释性改写为“尘土所造”。
- source_word: ἀπόγονος
  choice: 后裔
  rationale: 准确表达从祖先而出的谱系关系，现代汉语自然庄重。
- source_word: πρωτοπλάστου
  choice: 最初被塑造之人
  rationale: 保留“最初”与“塑造”的词义，并以“人”补足汉语所需的指称；不直接用专名“亚当”。
- source_word: ἐγλύφην
  choice: 被塑造成
  rationale: 该动词本可指雕刻、刻塑；在母腹成形的语境中，“塑造成”保留被动及塑形意象，同时自然易懂。
- source_word: σάρξ
  choice: 血肉之躯
  rationale: 此处指实际形成的肉身；“血肉之躯”比单独“肉”更符合现代汉语，同时保留具体、有形的意味。
theological_decisions:
- issue: πρωτοπλάστου所指为何
  choice: 正文译作描述性的“最初被塑造之人”，脚注说明暗指亚当
  alternative: 正文直接译作“亚当”
  rationale: 希腊文使用描述性称号而非专名。如此既忠于原文，又让读者借脚注辨认其典故。
- issue: 人类共同处境的表达
  choice: “与所有人平等”
  alternative: “和所有人一样”
  rationale: 原文ἴσος侧重共同、平等的身份与处境；保留这一张力，避免只表达笼统的相似。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“由大地而生、最初被塑造之人”刻意保留原文的双重描述及其创世意象；分号对应希腊文两个并列陈述之间的停顿。
