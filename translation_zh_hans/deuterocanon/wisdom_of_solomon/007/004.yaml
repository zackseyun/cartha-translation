  text: 我在襁褓中，在照料和关怀[a]之下被养育。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在照料中”；也可理解为“在忧虑或操心中”。希腊语此词可指关怀、照料或忧虑。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σπαργάνοις
  choice: 裹在襁褓中
  rationale: σπάργανα指包裹婴儿的布带或襁褓；此译保留具体的婴儿形象，也符合现代汉语表达。
- source_word: ἀνετράφην
  choice: 被抚养……长大
  rationale: ἀνατρέφω的被动过去时表示受养育、被抚养成人；结合两个并列介词短语，在汉语中补出“长大”使句意自然完整。
- source_word: ἐν φροντίσιν
  choice: 在操心照料中
  rationale: φροντίς可表示关怀、费心照顾，也可带忧虑、操心之意；“操心照料”兼顾照护与忧心两层可能含义。
theological_decisions:
- issue: φροντίσιν在婴儿处境中的含义
  choice: 操心照料
  alternative: 照料；忧虑操心
  rationale: 经文强调说话者与众人一样经历普通而依赖他人的婴儿期。此译不把该词仅限定为照护，也不把它强化为焦虑，尽量保留关怀与忧心之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“襁褓”虽略具书面色彩，但在现代汉语中通行且准确；“操心照料”用于保留原词兼有照顾与忧虑的含义。
