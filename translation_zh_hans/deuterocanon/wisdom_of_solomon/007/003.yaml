base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/003.yaml
  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: zh_hans
  text: 我出生时，也吸入了众人共有的空气[a]，落在与众人同受苦难的大地上[b]；我最初发出的声音，也和众人一样，是哭声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大家共享的空气。”希腊语强调说话者进入了所有人共同拥有的人生处境。
    reason: lexical_alternative
  - marker: b
    text: “与众人同受苦难”所译的希腊语，也可理解为“有同样经历”或“处于相同境况”。原文用这个词修饰“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: 出生时
  rationale: 在本节分娩与初啼的语境中，指作为人出生；译为“出生时”自然且保留时间关系。
- source_word: ἔσπασα
  choice: 吸入
  rationale: 以“空气”为宾语时表示吸气，具体呈现新生儿第一次呼吸的图景。
- source_word: τὸν κοινὸν ἀέρα
  choice: 众人共有的空气
  rationale: κοινός意为共同、共享；此译清楚表达说话者与所有人同享普通人的生存条件。
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: 在与众生同受苦患的大地上
  rationale: ὁμοιοπαθής含有同受、同样经历或处于相同境况之意；译文保留其不寻常的拟人表达及苦患色彩，而不简化成“同一片大地”。
- source_word: κατέπεσον
  choice: 落在
  rationale: 保留动词“落下、落到”的具体动态，并符合出生的图景。
- source_word: πρώτην φωνήν
  choice: 发出的第一个声音
  rationale: φωνή本义为声音或嗓音；如此翻译可与后面的“啼哭”形成说明关系，避免提前合并意象。
- source_word: τὴν ὁμοίαν πᾶσιν
  choice: 也和所有人一样
  rationale: 突出说话者的初声与任何人都无不同，呼应全节反复强调的共同人性。
- source_word: ἶσα κλαίων
  choice: 是啼哭声
  rationale: κλαίων指哭泣；ἶσα的“同样”之意已由前句“和所有人一样”承载，中文用判断式自然交代第一个声音就是啼哭。
theological_decisions:
- issue: 本节对共同人性的强调
  choice: 借“众人共有”“与众生同受”“和所有人一样”突出说话者与普通人在出生、脆弱和苦患上的共同处境。
  alternative: 采用较为尊贵化或平淡化的表达，削弱反复出现的共同性。
  rationale: 希腊文以κοινόν、ὁμοιοπαθῆ和ὁμοίαν πᾶσιν连续强调共同处境；译文应保留这种修辞力量，同时不加入后来的教义解释。
- issue: ὁμοιοπαθῆ修饰“大地”的语义张力
  choice: 保留“大地与众生同受苦患”的拟人化表达。
  alternative: 译成“所有人共同居住的大地”或“同样的大地”。
  rationale: 原文在语法上让ὁμοιοπαθῆ直接修饰γῆν，表达颇为奇特；不应为求顺畅而消除其可能指共同经历、共同受苦或相同处境的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众生”在此泛指世人，不承载特定宗教术语义；全句保留原文的出生、落地、初啼三重具体意象及其共同人性主题。
