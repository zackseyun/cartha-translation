  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/011.yaml
  text: But all good things came to me together with her[a], and in her hands was wealth beyond counting[b];
translation:
  language: zh_hans
  text: 所有美好的事物都同她[a]一起来到我这里；她手中有数不尽的财富[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指上下文中被人格化为女性的智慧。
    reason: cross_reference
  - marker: b
    text: 或译“不可胜数的财富”或“无法计量的财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 临到
  rationale: 这是ἔρχομαι的不定过去时；此处说美好事物来到说话者那里。“临到”自然庄重，也保留动态意象。
- source_word: τὰ ἀγαθὰ
  choice: 美好的事物
  rationale: 中性复数泛指各种美好之物或益处，并不限于物质财产；此译保留原文的宽泛含义。
- source_word: ὁμοῦ πάντα
  choice: 一切……一同
  rationale: 同时表达总体性与伴随关系，贴近原文语序和强调。
- source_word: μετ’ αὐτῆς
  choice: 随她
  rationale: 阴性代词在上下文中回指被人格化为女性的智慧；“随她一同”保留紧密伴随之意。
- source_word: ἀναρίθμητος πλοῦτος
  choice: 数不尽的财富
  rationale: ἀναρίθμητος意为无法计数，πλοῦτος指财富；此译简明自然，并保留夸张力度。
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: 她手中有
  rationale: 保留“在她手中”的具体意象，同时以现代汉语自然表达她拥有或带来财富。
theological_decisions:
- issue: 阴性代词αὐτῆς所指为何
  choice: 以“她”回指上下文中人格化的智慧
  alternative: 将代词淡化为非人格化的“它”或直接改称“智慧”
  rationale: 本章上下文把智慧塑造成女性形象；保留阴性人格化既忠于希腊文，也不进一步界定其神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“然而”承接前文并体现δέ的轻微转折；分号保留原句两个并列分句的结构。
