lexical_decisions:
- source_word: ἐνιαυτῶν
  choice: 年岁的
  rationale: 这是“年”的复数属格，与“循环”构成所属关系；“年岁”自然庄重，也保留原文的复数意味。
- source_word: κύκλους
  choice: 循环
  rationale: 该词可指圆圈、运行或周期；此处列举宇宙秩序方面的知识，“循环”既表达周而复始，也不额外限定具体天文学机制。
- source_word: ἀστέρων
  choice: 星辰的
  rationale: 这是“星”的复数属格；“星辰”符合现代汉语的庄重文体，并与“位置”保持原文所属关系。
- source_word: θέσεις
  choice: 位置
  rationale: 该词表示安置、方位或位置；“位置”在天文语境中清楚自然，同时不过度解释为固定星位或运行站点。
