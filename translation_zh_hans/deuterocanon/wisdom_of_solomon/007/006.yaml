  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/006.yaml
  text: But there is one entrance into life for all[a], and an equal departure.
translation:
  language: zh_hans
  text: 但众人进入生命的入口只有一个[a]，离去也是一样的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人进入生命的入口是同一个，离去也同样。”希腊文以“入口”和“离去／出口”构成平衡的隐喻，指向人共同的开始与终局。
    reason: 保留μία可译为“一个／同一个”以及ἔξοδος可译为“离去／出口”的词义选择。
lexical_decisions:
- source_word: μία
  choice: 一样的
  rationale: μία在这里修饰“入口”，既可强调“一个”，也可表达众人共有同一入口；结合πάντων和后半句的ἴση，译为“一样的”可自然呈现共同性，同时在脚注保留“一条”的形式可能。
- source_word: πάντων
  choice: 所有人
  rationale: 属格πάντων表示范围涵盖所有人；汉语用“所有人”直接、自然地表达普遍性。
- source_word: εἴσοδος
  choice: 入口
  rationale: 保留“进入/离去”这一对空间隐喻，不直接释为“出生”。
- source_word: εἰς τὸν βίον
  choice: 进入生命
  rationale: βίος在此指人的尘世生命；“进入生命”贴近原文，并避免加入原文没有明说的“世界”或“今生”。
- source_word: ἔξοδος
  choice: 离去
  rationale: 与“进入”构成平衡对照，暗指死亡而不将隐喻直接解释为“死亡”。
- source_word: ἴση
  choice: 同样如此
  rationale: ἴση说明离去是同等、相同的；“也同样如此”在现代汉语中简洁承接前半句，并保留平行关系。
- source_word: δὲ
  choice: 但
  rationale: δὲ承接上文并形成轻微转折，指出即使身份不同，所有人的生命始终相同。
theological_decisions:
- issue: 是否把“进入生命”和“离去”明确译成出生与死亡
  choice: 正文保留“进入生命”与“离去”的隐喻
  alternative: 所有人都有同样的出生和同样的死亡
  rationale: 希腊文使用εἴσοδος与ἔξοδος这一对隐喻，而非直接使用出生、死亡的词。保留隐喻既忠于原文，也让共同的人性与必死性由读者从语境中领会。
- issue: μία与ἴση所表达的是数量上的“一个”，还是共同、相同
  choice: 正文译作“一样的……同样如此”，突出所有人共有相同的开始与终局
  alternative: 所有人进入生命都只有一条入口，离去也是同等的
  rationale: μία本身可强调单一，ἴση则强调相等；在πάντων限定下，两者共同形成平衡表达。脚注保留较形式对应的“一条入口、一条出口”译法，以免消除原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“进入生命”与“离去”保留原文凝练的对偶隐喻；避免直接增译为“出生”和“死亡”。
