  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/012.yaml
  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: zh_hans
  text: 我因这一切而欢喜，因为智慧引领着它们；但我不知道她是这一切的根源。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφράνθην
  choice: 我……欢喜
  rationale: 表达不定过去时所述的喜乐，并保持庄重自然。
- source_word: ἐπὶ πάντων
  choice: 因这一切
  rationale: ἐπί加与格在此表示喜乐所缘由或所关涉的对象；结合上下文，以“因这一切”自然传达。
- source_word: ἡγεῖται
  choice: 引领
  rationale: 保留智慧走在众物之前、带领它们的意象，不弱化为单纯的“优于”。
- source_word: γένεσιν
  choice: 母亲
  rationale: γένεσις本义涉及产生、起源；此处谓语结构将智慧人格化为众物的生发者，译作“母亲”保留人格化意象，也与审定咨询层一致。
- source_word: τούτων / αὐτῶν
  choice: 它们
  rationale: 两个代词均回指前文所说的各种美物或福分；中文统一用“它们”维持指代连贯。
theological_decisions:
- issue: 智慧与众物的关系
  choice: 她是它们的母亲
  alternative: 她是这些事物的源头／起源
  rationale: 原文γένεσις可指起源、产生或出生。此处智慧已被阴性人格化，“母亲”鲜明表达其生发关系；但不进一步解释为特定的形而上创造论。
- issue: 智慧的位次或作用
  choice: 智慧引领它们
  alternative: 智慧居它们之首
  rationale: ἡγεῖται兼有带领与居首之意；“引领”保留动态关系，也避免把含义限定为等级比较。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“这一切”承接上文，以阴性代词“她”延续智慧的人格化。加入“当时”自然呈现ἠγνόουν未完成过去时所表达的先前不知状态。
