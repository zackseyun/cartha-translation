  text: For no king had a different beginning of birth[a].
translation:
  language: zh_hans
  text: 因为没有一位君王有不同的生命起点。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为没有一位君王有不同的出生开端。”希腊语γενέσεως可指“出生”，也可较宽泛地指“生成”或“起源”。
    reason: 保留γενέσεως可作较具体“出生”或较广义“生成、起源”的词义幅度，并说明与ἀρχή（开端）的组合。
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有一位
  rationale: 与属格复数“君王”连用，表达无一例外的否定；“没有一位君王”符合现代汉语习惯。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文的解释关系；在汉语中用“因为”自然地承接前文论述。
- source_word: βασιλέων
  choice: 君王
  rationale: 保留该词具体的王权含义，不泛化为“统治者”。
- source_word: ἑτέραν
  choice: 不同的
  rationale: 表示有别于他人的另一种起点，突出君王在人之起源上并无特殊之处。
- source_word: ἔσχεν
  choice: 有
  rationale: 此处ἔχω用于说明某人具有怎样的起始状态；汉语“有”简洁自然，不必机械体现希腊语不定过去时。
- source_word: γενέσεως
  choice: 出生
  rationale: 上下文论及人进入生命的共同方式，“出生”最为清楚；该词也可有较宽泛的“生成、起源”之义，收入脚注。
- source_word: ἀρχήν
  choice: 起点
  rationale: 表达开始之处；与“出生”搭配时，“出生起点”既贴近原文“生成的开端”，又避免把γενέσεως与ἀρχήν合并成单一的“起源”。
theological_decisions:
- issue: 君王与众人在人类起源上的共同性
  choice: 译文表明，没有任何君王拥有不同的出生起点。
  alternative: 没有一位君王有不同的存在起源。
  rationale: 紧接上下文有关共同人类处境的论述，保留其消除王者先天特殊性的含义，同时不将本句扩展成超出文本的系统性教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“君王”准确保留王权指称；“出生起点”有意保留γενέσεως与ἀρχήν两个词各自的语义，而脚注说明更宽泛的可能理解。
