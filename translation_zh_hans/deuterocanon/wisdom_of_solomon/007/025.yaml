base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: zh_hans
  text: 因为她是上帝能力所发出的气息[a]，是全能者荣耀的纯净流露[b]；因此，没有任何污秽之物能进入她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“蒸汽”或“气雾”（ἀτμίς）；这个希腊词可指从源头呼出的气息，或升起的蒸汽。
    reason: lexical_alternative
  - marker: b
    text: “纯净的流露”也可译作“清澈、无杂质的流露”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμίς
  choice: 气息
  rationale: 该词可指气息、呼气或蒸气。译作“气息”既保留从源头发出的鲜明意象，也避免把比喻限缩为自然界的蒸气现象；“所发的”使汉语表达自然，并传达属格所体现的来源关系。
- source_word: δυνάμεως
  choice: 能力
  rationale: “能力”直接对应此处上帝的力量或权能，现代汉语自然清楚，也与“所发的气息”搭配顺畅。
- source_word: ἀπόρροια
  choice: 流溢
  rationale: 该词表示从源头流出之物。“流溢”保留其流出、源出意象及较庄重的哲学和神学分量，同时不把这种关系解释为后来的特定教义。
- source_word: εἰλικρινής
  choice: 纯净的
  rationale: 此处形容流溢纯粹、无杂、未受污染；“纯净的”清楚自然，并与下句“污秽之物”形成语义呼应。
- source_word: παντοκράτορος
  choice: 全能者
  rationale: 这是该神圣称号在现代汉语中准确、庄重而通行的表达，兼顾能力与统御万有的含义。
- source_word: μεμιαμμένον
  choice: 污秽之物
  rationale: 完成时被动分词表示处于被沾污、受玷污状态的事物；“污秽之物”兼容道德、礼仪及一般污染含义，不作不必要的限缩。
- source_word: παρεμπίπτει
  choice: 侵入
  rationale: 该动词有闯入、落入或进入其中之意。“侵入”传达污秽之物无法进入智慧的语境力量，比单纯“进入”更符合汉语表达。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 使用“她”指智慧
  alternative: 重复使用“智慧”，或用中性的“它”
  rationale: 希腊文以阴性形式回指智慧，且上下文将智慧人格化。使用“她”保留这一文学和神学形象，但不据此加入经文本身未明说的身份认定。
- issue: 智慧与上帝之间以源出意象表达的关系
  choice: 直译为“上帝能力所发的气息”和“全能者荣耀纯净的流溢”
  alternative: 弱化源出意象的解释性意译，或采用更技术化的形而上术语
  rationale: 原文使用强烈的源出和流溢意象，却没有在本节中界定其精确的形而上含义。译文保留这种张力，不以较晚的教义体系替原文作结论。
- issue: 污秽不能进入智慧的陈述力度
  choice: 译为“没有任何污秽之物能侵入她”
  alternative: 较字面的“没有任何受玷污之物进入她里面”
  rationale: “能侵入”在现代汉语中自然表达原文因果语境中的排拒意味，同时没有把智慧的纯净进一步解释为某一特定教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“气息”与“流溢”保留原文连续的源出意象；后者略带诗性和哲思色彩，适合本段对智慧的颂赞。分号维持两组意象与结论之间的结构。
