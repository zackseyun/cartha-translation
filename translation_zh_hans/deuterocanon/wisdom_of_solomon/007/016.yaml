    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: 在他手中
  rationale: 保留原文表示掌管、权能与归属的圣经惯用语；现代汉语中也自然可懂，不必解释性地译成“受他支配”。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 对应原文明确出现的代词，并与“我们的话”形成并列。
- source_word: οἱ λόγοι ἡμῶν
  choice: 我们的话
  rationale: λόγοι 在此宽泛指人的言语或表达；“我们的话”直接、自然，也保留原文范围。
- source_word: πᾶσά τε φρόνησις
  choice: 一切明智
  rationale: φρόνησις 可指明智、审慎或实际智慧；“明智”在现代汉语中兼顾理解力与审慎判断，且不过度技术化。
- source_word: ἐργατειῶν ἐπιστήμη
  choice: 技艺的知识
  rationale: ἐργατειῶν 涉及实际工作、手艺或技能，ἐπιστήμη 指知识或专门认识；此译法保留名词结构及其较宽的语义范围。
theological_decisions:
- issue: αὐτοῦ 所指为何者
  choice: 译作“他”，由上下文理解为上帝
  alternative: 直接译作“上帝”
  rationale: 原文只用代词。保留“他”既忠于形式，也避免把上下文判断直接写入正文。
- issue: “在他手中”的神学含义
  choice: 保留具象惯用语
  alternative: 译作“在他掌管之下”或“属于他的权能”
  rationale: 原表达可同时包含掌管、保守、归属与依赖等意涵；直译能保留这种丰富性，而不限定为单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。末尾补出“也都在他手中”，使汉语并列关系清楚；这是承接希腊语共同支配结构，并未增加新的命题。
