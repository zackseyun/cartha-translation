  text: 因为我们和我们的话，以及一切见识[a]和各种技艺的知识[b]，都在他手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见识”或译“审慎”“实际智慧”；希腊语 φρόνησις 可指理解、明辨或审慎判断。
