base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/030.yaml
  text: For this is succeeded by night[b][a], but evil does not prevail against wisdom.
translation:
  language: zh_hans
  text: 因为黑夜固然会接替它[a]，邪恶却不能胜过智慧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上一节所说的“光”；也可译作“因为黑夜固然会接替光”。
    reason: 说明指示代词的所指，并提供明示所指对象的译法。
  - marker: b
    text: “不能胜过智慧”也可译作“不能抵挡智慧”。
    reason: 说明 ἀντισχύει 可表达抵挡、抗衡或胜过之意。
lexical_decisions:
- source_word: τοῦτο
  choice: 它
  rationale: 保留希腊文中性指示代词的含蓄表达；在上下文中，它回指上一节所说的“光”，但正文不把所指对象明说出来。
- source_word: διαδέχεται
  choice: 接替
  rationale: 表达随后而来、接续并取而代之的意思；用“黑夜会接替它”的主动句式，符合现代汉语习惯，也保留原文的先后对照。
- source_word: νύξ
  choice: 黑夜
  rationale: 准确表达 νύξ，并与上一节的“光”形成鲜明对照。
- source_word: σοφίας
  choice: 智慧
  rationale: 这是本章核心用语；此处为 ἀντισχύει 所支配的属格，指邪恶所不能胜过的对象。
- source_word: οὐκ ἀντισχύει
  choice: 不能胜过
  rationale: 传达“不能在对抗中占上风”的含义，保留原文的较量意象；“不能”在汉语中自然表达该否定陈述所显示的无力。
- source_word: κακία
  choice: 邪恶
  rationale: κακία 在此泛指道德上的恶；“邪恶”比“恶意”或“恶行”涵盖更广，也适合与智慧形成对照。
- source_word: μὲν…δὲ
  choice: 固然……却……
  rationale: 以自然汉语呈现两个分句之间的让步与强烈对照：黑夜能够接替光，邪恶却不能胜过智慧。
theological_decisions:
- issue: τοῦτο 所指对象是否应在正文中明说
  choice: 用“它”保留原文的隐含所指
  alternative: 直接译为“光”
  rationale: 希腊文使用指示代词而不是重复“光”；上下文足以辨认其所指，因此正文保留这种衔接方式，并用脚注说明。
- issue: ἀντισχύει 所表达的力量关系
  choice: 译为“不能胜过智慧”
  alternative: “不能抵挡智慧”或“无法压倒智慧”
  rationale: “胜过”保留对抗与结果两层含义，又不额外规定邪恶究竟是无法抵抗、压制还是消灭智慧，从而避免超出原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“固然……却……”清楚呈现 μὲν…δὲ 的对照；“接替”保持光与黑夜依次更替的意象。脚注标记均置于正文相应词句之后。
