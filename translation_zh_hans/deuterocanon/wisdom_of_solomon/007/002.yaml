  text: for a period of ten months[c][b][a], having been formed in blood from a man's seed and the pleasure accompanying sleep.
translation:
  language: zh_hans
  text: 我经过十个月[a]，在血中凝结成形[b]，由男子的种子和伴随睡眠而来的欢愉[c]而成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“十个月”，反映古代对妊娠期的计算方式，可能按阴历月份计算。
    reason: cultural_note
  - marker: b
    text: “凝结成形”也可译作“凝固”。希腊语这个词既可表示凝结、凝固，也可表示形成。
    reason: lexical_alternative
  - marker: c
    text: 末尾短语委婉地指性结合；原文近于“欢愉，睡眠相伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: 在十个月的时间里
  rationale: 该与格短语表示孕育所经历的时段；直译“十个月”并以脚注说明古代的妊娠月份计算方式。
- source_word: παγεὶς
  choice: 凝结成形
  rationale: πήγνυμι在此既可表达凝固、凝结，也可指形成。“凝结成形”保留古代胚胎形成的具体意象，同时让现代汉语读者容易理解。
- source_word: ἐν αἵματι
  choice: 在血中
  rationale: 按ἐν的基本含义直译，保留原文关于母体孕育的具体身体意象，不改写成解释性较强的“由血而成”。
- source_word: ἐκ σπέρματος ἀνδρός
  choice: 由男子的种子
  rationale: σπέρμα在此指生殖之种；“男子的种子”保持原文含蓄而具体的表达，也避免采用过于临床化的术语。
- source_word: ἡδονῆς
  choice: 欢愉
  rationale: ἡδονή意为愉悦、快感；此处语境指性欢愉。“欢愉”既忠实于词义，也符合原文克制的委婉语气。
- source_word: ὕπνῳ συνελθούσης
  choice: 与睡眠相伴的
  rationale: 该结构字面关系较压缩，描述与床笫或睡眠相联的欢愉。“与睡眠相伴”保留原文委婉和一定含混度，不直接改写为“性交”。
theological_decisions:
- issue: 对人类共同受孕和孕育过程的强调
  choice: 按普通人的受孕和孕育过程来表达，不加入现代生物学术语
  alternative: 把παγείς严格译作“凝固”，或直接明说“性交”
  rationale: 上下文强调所罗门与众人一样具有普通的人类出生经历。译文保留古代身体意象和委婉措辞，不把古代胚胎观现代化，也不把性结合说得比原文更直白。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“男子的种子”“与睡眠相伴的欢愉”保留希腊原文含蓄的生殖与床笫意象；“凝结成形”兼顾古代胚胎观中的凝结含义与现代读者的可理解性。
