base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/007.yaml
  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: zh_hans
  text: 因此，我祈求，明悟就被赐给我；我呼求[a]，智慧之灵[b]便临到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求”也可译作“求告（上帝）”；希腊原文没有明说呼求的对象。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为泛指的“智慧之灵”，或特指为“那智慧之灵”。希腊原文没有定冠词；正文保留这种歧义，不将这短语限定为正式称号。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达由上文引出的因果或推论关系。
- source_word: ηὐξάμην
  choice: 我祈求
  rationale: εὔχομαι在此表示祷告、祈求；此译法简明自然。
- source_word: φρόνησις
  choice: 明悟
  rationale: 该词可指理解力、明辨力或审慎；译作“明悟”既与后文的“智慧”有所区分，也避免过强的哲学术语色彩。
- source_word: ἐδόθη μοι
  choice: 赐给了我
  rationale: 保留被动领受的重点，并以“赐给”传达语境中的恩赐意味，而不暗示这是靠自己取得的。
- source_word: ἐπεκαλεσάμην
  choice: 我呼求
  rationale: 该动词有呼唤、求告之意；原文未明说呼求的对象，因此正文不增补“上帝”。
- source_word: πνεῦμα σοφίας
  choice: 智慧之灵
  rationale: 直译属格结构，同时保留它既可泛指带来智慧的灵，也可能具有更特定属灵含义的开放性。
- source_word: ἦλθέν μοι
  choice: 便临到我
  rationale: 自然表达“来到我这里”，适合以“灵”为主语的语境，又不额外加入“充满”或“降在身上”等更强含义。
theological_decisions:
- issue: πνεῦμα σοφίας应理解为一般性的智慧之灵，还是特定的“那智慧之灵”
  choice: 智慧之灵
  alternative: 一位（或一种）智慧之灵；那智慧之灵
  rationale: 希腊语短语没有冠词，既不要求把它处理为正式称号，也不排除较具体的属灵所指。汉语正文不加量词或指示词，可保留这一张力。
- issue: 是否为ἐπεκαλεσάμην补出呼求的对象
  choice: 我呼求
  alternative: 我求告上帝
  rationale: 祷告语境使上帝作为对象十分自然，但希腊原文没有明说宾语；正文不作增补，脚注说明其可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“明悟”与“智慧”保持词义区分；分号保留原文两个平行分句的结构。
