  text: For God loves nothing except the one who dwells with wisdom[a].
translation:
  language: zh_hans
  text: 因为上帝什么都不爱，除了与智慧同住的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章上下文强烈将“智慧”人格化，因此“与智慧同住”带有与人格化的智慧共同居住、相伴的意味。
    reason: 说明上下文中的人格化意涵，同时不在正文中把“智慧”强行定为专名或排除其词汇上的开放性。
lexical_decisions:
- source_word: οὐθὲν
  choice: 所爱的，唯有……的人
  rationale: οὐθὲν直译为“没有什么”，但其后的例外项是指人的实体化分词。采用“所爱的，唯有”自然表达绝对排除，同时避免生硬地说“上帝不爱任何东西”。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 直接传达ἀγαπάω在此处的含义，并保留上帝之爱的神学分量。
- source_word: εἰ μὴ
  choice: 唯有
  rationale: 此处引出唯一的例外，并非表达条件；“唯有”与前文搭配，准确而自然。
- source_word: τὸν ... συνοικοῦντα
  choice: 与……同住的人
  rationale: 实体化分词指具有持续特征的人；“同住”保留συνοικέω共同居住、长久相伴的具体关系意象。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: 与格在此表示共同相处的对象。上下文虽强烈将智慧人格化，汉语“智慧”本身不以大小写作出区分，因而可保留这种开放性。
theological_decisions:
- issue: “智慧”是否应明确处理为人格化称谓
  choice: 正文写作“智慧”，并以脚注说明人格化可能
  alternative: 明确译作人格化的“智慧者”或加引号、专名号
  rationale: 希腊文σοφίᾳ既可表达智慧，也因上下文而带有强烈人格化色彩。现代汉语没有相应的大小写区别；不添加“者”等原文没有的成分，可避免把文学与神学张力单向定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“与智慧同住”有意保留原文共同居住的鲜明意象；句式以“所爱的，唯有……”自然承载希腊文的绝对排除与唯一例外。
