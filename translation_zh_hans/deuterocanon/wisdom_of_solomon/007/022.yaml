base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: zh_hans
  text: 因为，智慧这位万物的巧匠教导了我；因为她里面有一种灵，是聪慧的、圣洁的、独特的[a]、多面的、精微的、灵动的、明澈的、纯洁无玷的、清晰的、不受损害的[b]、喜爱良善的、敏锐的、不受阻碍的、施行恩惠的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独特的”也可译作“唯一的”或“独生的”。这里没有亲子关系的明确语境，因此正文取“独特、仅此一个”的意思。
    reason: lexical_alternative
  - marker: b
    text: “不受损害的”也可理解为“不伤害人的”或“无害的”；希腊词既可指自身未受伤害，也可指不造成伤害。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: τεχνῖτις
  choice: 创造万物的
  rationale: 该阴性名词指精于技艺、制作万物者；汉语难以用自然的单一名词同时保留工匠意象与阴性人格化，因此用“创造万物的智慧”，并以“她”延续人格化。
- source_word: πνεῦμα
  choice: 灵
  rationale: 此处指智慧里面具有心智能力并赋予活力的属灵实在，不是字面的风或气息。
- source_word: νοερόν
  choice: 聪慧的
  rationale: 表达具有心智、理解与领悟能力，符合现代汉语且不过度哲学化。
- source_word: μονογενές
  choice: 独一无二的
  rationale: 此处修饰智慧里面的灵，没有亲子语境，宜取“独特、仅此一个”的意义，同时以脚注保留传统的“独生”可能。
- source_word: πολυμερές
  choice: 多面的
  rationale: 保留“具有许多部分或方面”的含义，现代汉语自然易懂。
- source_word: λεπτόν
  choice: 精微的
  rationale: 兼顾细微、精细和能深入渗透的意味，避免译成脆弱的“纤弱”。
- source_word: εὐκίνητον
  choice: 灵动的
  rationale: 表达容易活动、行动敏捷，也适合描述人格化智慧之灵。
- source_word: τρανόν
  choice: 明澈的
  rationale: 表达明亮清楚，并与后面的 σαφές 作适度区分。
- source_word: ἀμόλυντον
  choice: 纯洁无玷的
  rationale: 保留未受污染、没有玷污的道德与礼仪色彩。
- source_word: σαφές
  choice: 清晰的
  rationale: 表达清楚、分明；与 τρανόν 的“明澈”保持原文近义词并列而不完全合并。
- source_word: ἀπήμαντον
  choice: 不受损害的
  rationale: 采用“不被伤害、未受损”的被动意义，同时在脚注说明也可能表示“不伤害人的”。
- source_word: φιλάγαθον
  choice: 喜爱良善的
  rationale: 直接表达爱好善与良善之事的复合意义。
- source_word: ὀξύ
  choice: 敏锐的
  rationale: 在心智与灵的语境中表示锐利、敏捷而有洞察力。
- source_word: ἀκώλυτον
  choice: 无所阻碍的
  rationale: 保留不被拦阻、不受限制之意。
- source_word: εὐεργετικόν
  choice: 施行恩惠的
  rationale: 表达主动行善、使人受益，语体庄重并保持形容性质。
theological_decisions:
- issue: μονογενές 用于描述智慧里面的灵
  choice: 独一无二的
  alternative: 独生的／唯一的
  rationale: 这里没有亲子关系的明确语境，因此正文采用“仅此一个、独特”的词义，不把其他经文中的基督论含义带入；传统译法以脚注保留。
- issue: 智慧的人格化及 τεχνῖτις 的阴性形式
  choice: 以“她”指智慧，并译作“创造万物的智慧”
  alternative: 万物的巧匠／工匠
  rationale: 原文将智慧人格化，且 τεχνῖτις 为阴性名词。现代汉语没有自然、庄重且明确为阴性的对应职业名词，因此用“她”保留人格化，以“创造万物的”传达其技艺与制作功能，但不进一步断言本体身份。
- issue: ἀπήμαντον 的语态歧义
  choice: 不受损害的
  alternative: 不伤害人的／无害的
  rationale: 希腊词可表示未受伤害，也可表示不造成伤害。正文保留被动意义，脚注呈现主动意义，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文连续形容词所形成的颂赞式节奏；以“她”延续智慧的女性人格化。正文的句末句号仅为本节独立呈现时的中文标点处理；原文列举在下一节继续。
