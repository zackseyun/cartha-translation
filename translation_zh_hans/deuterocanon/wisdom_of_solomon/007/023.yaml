translation:
  language: zh_hans
  text: 仁爱世人[a]，坚定，安稳，无挂虑，全能[b]，鉴察一切，并穿行于一切有悟性、纯净而最精微的灵之中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仁爱世人”也可译作“善待世人”。
    reason: lexical_alternative
  - marker: b
    text: “全能”也可译作“有一切能力”。
    reason: lexical_alternative
  - marker: c
    text: “穿行于一切有悟性、纯净而最精微的灵之中”也可理解为“遍及一切有悟性、纯净而最精微的灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: 仁爱世人
  rationale: 该词表示爱人、善待人的品性；“仁爱世人”既保留以人为对象的含义，也符合庄重而自然的现代汉语。
- source_word: βέβαιον
  choice: 坚定
  rationale: 在这一连串品性中，表示稳固、可靠；“坚定”简洁自然。
- source_word: ἀσφαλές
  choice: 稳妥
  rationale: 表达安全、可靠而无危险的性质，并与“坚定”有所区分。
- source_word: ἀμέριμνον
  choice: 无忧无虑
  rationale: 准确表达不受忧虑困扰的含义；在此并无轻浮随意之意。
- source_word: παντοδύναμον
  choice: 全能
  rationale: 直接表达拥有一切能力或权能；现代汉语简洁通行，同时保留其强烈的神学语感。
- source_word: πανεπίσκοπον
  choice: 鉴察一切
  rationale: 该复合词重在察看、监察一切；“鉴察一切”比单纯“看见一切”更能保留其主动察验的意味。
- source_word: διὰ πάντων χωροῦν
  choice: 贯通一切
  rationale: 既可表达穿行通过，也可表达遍及、渗透；“贯通”在中文中保留这两方面的意象。
- source_word: πνευμάτων
  choice: 灵
  rationale: 语境所指是具有悟性、纯净且精微的灵；“灵”比“气息”更合乎本段观念。
- source_word: νοερῶν
  choice: 有悟性
  rationale: 表示具有心智、理解力；“有悟性”自然且避免把它窄化为现代意义上的智力高低。
- source_word: καθαρῶν
  choice: 纯净
  rationale: 准确传达纯洁、无杂染的性质，并适合修饰“灵”。
- source_word: λεπτοτάτων
  choice: 最精微
  rationale: 保留最高级以及极其细微、精妙的哲学色彩；比“最纤细”更适合描述灵。
theological_decisions:
- issue: παντοδύναμον是否采用传统神学用语
  choice: 全能
  alternative: 有一切能力；无所不能
  rationale: “全能”在现代汉语中直接、凝练，也忠实反映复合词的字面意义；正文不进一步界定其后期教义内涵。
- issue: 如何理解διὰ πάντων χωροῦν πνευμάτων νοερῶν καθαρῶν λεπτοτάτων
  choice: 贯通一切有悟性、纯净而最精微的灵
  alternative: 穿行于一切有悟性、纯净而最精微的灵之中；遍及这一切灵
  rationale: 希腊文可呈现穿行通过与渗透遍及的意味。“贯通”保留这种张力，脚注列出较具空间感的另一译法，而不把含义固定为单一解释。
translation_notes:
  register: 采用现代、庄重且便于诵读的品性列举句式。以“仁爱世人”“鉴察一切”“最精微”等表达维持智慧文学的崇高语体，同时避免古奥难懂。
