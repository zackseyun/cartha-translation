  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/020.yaml
  text: the natures of animals and the tempers of wild beasts[a], the violence of winds and the reasonings of men, the varieties of plants and the powers of roots.
translation:
  language: zh_hans
  text: 动物的本性、野兽的性情、风的威力[a]、人的思虑、植物的差异，以及根的效能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸灵的威力”，也可译“猛烈的风”；希腊文“πνεύματα”既可指“风”，也可指“灵”。
    reason: 保留 πνευμάτων βίας 的词义和结构歧义。
lexical_decisions:
- source_word: φύσεις ζῴων
  choice: 动物的本性
  rationale: φύσεις 指生物内在的禀性或自然属性；“本性”保留本节知识分类中的哲理和自然研究意味。
- source_word: θυμοὺς θηρίων
  choice: 野兽的性情
  rationale: θυμός 在此指脾性、冲动倾向或气质；“性情”自然地表达野兽特有的脾性，同时避免仅理解为怒气。
- source_word: πνευμάτων βίας
  choice: 风的威力
  rationale: 在列举受造界各种知识的语境中，πνεύματα 很可能指风，βίαι 指强力或猛烈之势；“风的威力”简洁自然，同时以脚注保留“灵”的真实歧义。
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: 人的思虑
  rationale: διαλογισμός 可指思想活动、推想或盘算；“思虑”兼顾思考过程及其内容。ἀνθρώπων 泛指人类，译作“人”自然且不限定性别。
- source_word: διαφορὰς φυτῶν
  choice: 植物的差异
  rationale: διαφοράς 指区别、差异或不同种类；“差异”较为贴近原文，也涵盖植物种类和属性上的分别。
- source_word: δυνάμεις ῥιζῶν
  choice: 根的效能
  rationale: δύναμις 在根这一语境中指其所具有的作用、功效或内在能力，可能包括药用性质；“效能”比单纯的“力量”更符合现代汉语。
theological_decisions:
- issue: πνευμάτων βίας 中 πνευμάτων 的歧义
  choice: 风的威力
  alternative: 诸灵的威力；猛烈的风
  rationale: πνεῦμα 既可指风，也可指灵。上下文主要列举自然界与人类可被认识的现象，因此正文采用“风”；但原词并未排除“灵”，故在脚注中明确保留另一读法，不把词义歧义处理成教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的名词列举句式，与上下文智慧所得的知识清单相配。“性情”“思虑”“效能”既自然又保留原文各词的语义层次；脚注标记紧随存在歧义的短语。
