base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/026.yaml
  text: For she is a radiance of eternal light[a], and a spotless mirror of the working of God, and an image of his goodness.
translation:
  language: zh_hans
  text: 因为她是永恒之光的光辉[a]，是上帝作为的一面无瑕明镜，也是他良善的形象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永恒之光所反射的光辉”。希腊词既可指从光源发出的光辉，也可指反射出来的亮光。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: 光辉
  rationale: 此词可指从光源发出的辉光，也可指反射出的光辉。“光辉”自然庄重，并保留原词的语义开放性。
- source_word: φωτὸς ἀϊδίου
  choice: 永恒之光
  rationale: 直接保留属格关系；“永恒”准确表达ἀΐδιος持续不息的含义，也符合本节的崇高语体。
- source_word: ἔσοπτρον
  choice: 明镜
  rationale: 指镜子；“明镜”比单说“镜子”更适合诗性语境，并与“无瑕”搭配自然。
- source_word: ἀκηλίδωτον
  choice: 无瑕
  rationale: 表达没有污点、未受玷污；简洁地维持镜面的意象。
- source_word: τῆς τοῦ θεοῦ ἐνεργείας
  choice: 上帝作为的
  rationale: ἐνέργεια在此指上帝实际施行的活动或功用。“作为”避免将其技术化为“能量”，同时比“工作”更庄重自然。
- source_word: εἰκών
  choice: 形象
  rationale: 直接表达形像、表征之意，并保留其神学分量。
- source_word: ἀγαθότητος
  choice: 美善
  rationale: 涵盖良善、善性之意；“美善”在现代中文中庄重而不局限于待人仁慈。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 以“她”指称智慧
  alternative: 重复“智慧”或采用无性别转述
  rationale: 上下文将智慧人格化，希腊文代词也与阴性名词σοφία一致。保留“她”忠实呈现文学与神学张力，但不据此断言智慧是独立的神祇。
- issue: ἀπαύγασμα所表达的光源关系
  choice: 正文译作“光辉”，不明确限定为发出或反射
  alternative: 光芒；反光；流辉
  rationale: 原词可强调由源头发出的辉光，也可理解为反射的亮光；正文采用兼容性较强的表达，并以脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。三个并列名词短语保持原文节奏；“光辉—明镜—形象”的意象次序完整保留。
