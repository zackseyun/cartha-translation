  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/013.yaml
  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: zh_hans
  text: 我诚实无欺地学习，也毫不吝惜地分享；我不隐藏她[a]的财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指智慧；原文用阴性代词，延续了对智慧的人格化描写。
    reason: 说明原文的语法性别与文学人格化，避免现代读者误解代词所指。
lexical_decisions:
- source_word: ἀδόλως
  choice: 诚实无欺地
  rationale: 该副词表示没有欺骗或诡诈；此译保留其道德意味，又符合现代汉语表达。
- source_word: ἔμαθον
  choice: 学来
  rationale: μανθάνω 的不定过去时，基本义为“学习、学得”；“学来”保留第一人称已经获得智慧的语气，并与下文“传授”自然呼应。
- source_word: ἀφθόνως
  choice: 毫不吝惜地
  rationale: 该副词本义涉及不嫉妒、不吝啬；在把所学传给他人的语境中，“毫不吝惜地”既传达不藏私的含义，也比直译“毫无嫉妒地”更自然。
- source_word: μεταδίδωμι
  choice: 传授
  rationale: 该动词意为分给、分享或传递；此处与所学的智慧相连，“传授”在现代汉语中清楚而庄重。
- source_word: πλοῦτον
  choice: 财富
  rationale: πλοῦτος 指财富、丰富；这里比喻智慧所蕴含的丰盛，“财富”保留原文隐喻。
- source_word: αὐτῆς
  choice: 她的
  rationale: 阴性代词回指上下文中人格化的智慧；“她的”保留原文的人格化表达。
- source_word: ἀποκρύπτομαι
  choice: 不隐藏
  rationale: 该中间形式在这里具有主动意义，意为隐藏、隐瞒；“不隐藏”简洁贴近原文。
theological_decisions:
- issue: 阴性代词 αὐτῆς 所体现的智慧人格化
  choice: 译作“她的财富”
  alternative: 译作“智慧的财富”或“它的财富”
  rationale: 原文以阴性代词延续对智慧的人格化描写。“她”保留文学与神学上的张力，却不把这种人格化进一步解释为任何特定后期教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“诚实无欺”与“毫不吝惜”分别体现两个希腊副词的差异；保留“财富”的隐喻和“她”的人格化指称。
