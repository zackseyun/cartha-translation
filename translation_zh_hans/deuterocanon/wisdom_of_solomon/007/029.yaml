  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/029.yaml
  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: zh_hans
  text: 因为她比太阳更美，胜过群星的一切排列；若与光相比，她显得更为在先。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更为在先”也可理解为“居于更优先的地位”；希腊文兼有时间或次序上在先的意味。
    reason: 说明προτέρα的语义张力，保留时间先后与地位优先之间的可能性。
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: 更美
  rationale: 该比较级表示外观美好、华美或庄美；这里以自然简洁的“更美”描写智慧胜过太阳。
- source_word: ὑπὲρ
  choice: 胜过
  rationale: 在比较语境中表达超越，不仅是空间上的“高于”。
- source_word: πᾶσαν ἄστρων θέσιν
  choice: 群星的一切排列
  rationale: θέσις可指位置、配置或排列；保留原文有关众星布局的具体意象及一定开放性。
- source_word: προτέρα
  choice: 更为在先
  rationale: 该词通常表示时间、次序或地位上的在先。依原文直译为“在先”，不擅自化解为“更优越”；“更为”使与光的比较关系在中文中更清楚。
theological_decisions:
- issue: 智慧与光相比时προτέρα的含义
  choice: 更为在先
  alternative: 更优越／更卓越
  rationale: 希腊文προτέρα首先表达“较早、在先”；译文保留智慧先于光的时间或次序含义，也不排除其地位上的优先性，避免把文本单向解释为品质优越。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“她”承接上下文中拟人化的智慧；分号保留两组比较之间的紧密推进。
