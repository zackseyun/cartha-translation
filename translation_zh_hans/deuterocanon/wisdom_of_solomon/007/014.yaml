base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/014.yaml
  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: zh_hans
  text: 因为智慧是人们取用不尽的宝藏；使用智慧的人借着教诲所带来的恩赐蒙了称许，并获得了与上帝的友谊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”也可译作“训导”或“陶冶”；原词兼有教育、管教和品格培养之意。
    reason: 说明παιδεία的语义范围，避免正文单一词语掩盖其丰富含义。
lexical_decisions:
- source_word: ἀνεκλιπής
  choice: 取用不尽的
  rationale: 表达宝藏永不枯竭、不会耗尽之意，并与后文“善用”自然衔接。
- source_word: θησαυρός
  choice: 宝藏
  rationale: 保留财富意象及其比喻力量。
- source_word: οἱ χρησάμενοι
  choice: 善用智慧的人
  rationale: χράομαι表示使用、利用；补明上下文中的所指“智慧”，避免汉语代词指向不清。
- source_word: πρὸς θεὸν ... φιλίαν
  choice: 与上帝的友谊
  rationale: 保留原文直接而富张力的关系性表述，不改写为较弱的“蒙上帝喜爱”。
- source_word: ἐστείλαντο
  choice: 获得了
  rationale: 按此处中间语态在语境中的结果义处理，表达这些人取得、赢得友谊，同时避免译成过度功德化的措辞。
- source_word: συσταθέντες
  choice: 蒙称许
  rationale: 保留“受到举荐、认可或称许”的被动含义，不擅自补出称许者。
- source_word: παιδεία
  choice: 教诲
  rationale: 在智慧文学语境中涵盖教育、训导和陶冶；正文采用现代汉语中自然且庄重的概括词。
theological_decisions:
- issue: “获得与上帝的友谊”是否暗示人凭功劳换取神的友谊
  choice: 保留“获得了与上帝的友谊”
  alternative: 与上帝结为朋友／蒙上帝眷爱
  rationale: 原文确实把善用智慧与取得对神的友谊相连；译文不应为消除神学张力而弱化或改写这一关系。
- issue: συσταθέντες的施事者是否明确为上帝
  choice: 不补出施事者，仅译“蒙称许”
  alternative: 蒙上帝称许
  rationale: 希腊文使用被动分词却未明说谁称许他们，因此保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“取用不尽的宝藏”保留原文意象，用“善用智慧”使上下文所指清楚。句式尽量贴近希腊文的因果与分句结构，同时避免生硬直译。
