base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: zh_hans
  text: 愿上帝赐我能按明智的判断说话[a]，并能以相称的态度思量所赐之事[b]，因为他自己是智慧的引导者，也是纠正智慧者的那一位[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按着理解说话。”希腊语短语可指说话合乎明智的判断或理解。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所赐之物”或“所赐的恩赐”。希腊语没有具体说明所赐的是什么。
    reason: lexical_alternative
  - marker: c
    text: 或译：“智慧者的校正者”或“智慧者的指导者”。原词指使人端正、归正，也可含正确引导之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: 但愿……赐我
  rationale: 不定过去时祈愿式表达愿望或祈求；“但愿……赐我”自然保留其祈愿语气。
- source_word: εἰπεῖν κατὰ γνώμην
  choice: 按明智所当有的方式说话
  rationale: κατὰ γνώμην表示言语合乎明智、判断或理解；此译既传达规范性的判断意味，也避免缩减为个人意见。
- source_word: ἐνθυμηθῆναι ἀξίως
  choice: 作相称的思考
  rationale: ἐνθυμηθῆναι指内在思考或省察，ἀξίως表示与对象相配、相称；合译简洁而保留评价意味。
- source_word: τῶν δεδομένων
  choice: 所赐的一切
  rationale: 带冠词的完成时被动分词泛指已经赐下之事物；“一切”使汉语自然，同时不限定为某种特定恩赐。
- source_word: ὁδηγός
  choice: 引导
  rationale: 原词指领路者或向导；在“智慧”的抽象语境中转为动词表达，更符合现代汉语。
- source_word: διορθωτής
  choice: 纠正
  rationale: 原词指使之端正、矫正者；“纠正”保留校正意味，也没有强化为惩罚或管教。
- source_word: τῶν σοφῶν
  choice: 有智慧的人
  rationale: 实体化复数形容词，意为智慧者；此译比“智者”更通俗自然。
theological_decisions:
- issue: τῶν δεδομένων的所指与范围
  choice: 宽泛译为“所赐的一切”，不明确限定所赐的具体内容
  alternative: 所赐的恩赐；所传授的教导
  rationale: 希腊文没有明说对象，语境可能包括智慧及其内容；保持宽泛可避免加入经文本身未限定的教义性所指。
- issue: διορθωτής所表达的上帝与智慧者之间的关系
  choice: 上帝“纠正有智慧的人”
  alternative: 上帝引导有智慧的人；上帝管教有智慧的人
  rationale: 该词含使之端正、纠正之意；此译保留即使智慧者仍需上帝校正的张力，又不把含义过度强化为惩戒。
- issue: αὐτός的强调作用
  choice: 译作“他亲自”
  alternative: 省略强调，仅译“他”
  rationale: αὐτός在此具有强调作用，突出上帝自己既与智慧的引导有关，也与智慧者的纠正有关。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“但愿”呈现祈愿语气；“所赐的一切”保留原文对象的开放性；后半句以动词结构自然表达两个表语名词，并借“亲自”保留αὐτός的强调。
