  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/017.yaml
  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
translation:
  language: zh_hans
  text: 因为他亲自赐给我关于万有确实无误的知识[a]，使我知道世界的构造[b]和元素的活动[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“真实的知识”或“毫无虚假的知识”。
    reason: lexical_alternative
  - marker: b
    text: “世界的构造”也可译作“宇宙的组成”或“世界的秩序”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“元素”指构成物质世界的基本要素；“活动”也可译作“作用”或“运作”。
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς
  choice: 是他亲自
  rationale: 保留强调代词的语气，同时不把原文的代词直接改写为“上帝”；其所指可由上下文辨明。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 在上帝赐予智慧的语境中，“赐给”自然庄重，又未增加原文没有的技术含义。
- source_word: τῶν ὄντων
  choice: 万有
  rationale: 概括一切存在之物，适合本节宇宙论语境，也比“存在者”更符合现代汉语。
- source_word: γνῶσιν ἀψευδῆ
  choice: 确实无误的知识
  rationale: 兼顾ἀψευδής的真实、不虚假和可靠之意，避免“绝对无误”等可能过度强化的神学措辞。
- source_word: εἰδέναι
  choice: 使我知道
  rationale: 将不定式自然地处理为所赐知识带来的认识范围，同时保留其可表内容或结果的宽度。
- source_word: σύστασιν κόσμου
  choice: 世界的构造
  rationale: σύστασις在此可指构成、结构或组织；“构造”简明，并与κόσμος所指的受造秩序相称。
- source_word: ἐνέργειαν στοιχείων
  choice: 各种元素的运行
  rationale: “运行”表达ἐνέργεια的活动、作用或运作，不把它收窄为现代物理学意义上的“力”。
- source_word: στοιχείων
  choice: 各种元素
  rationale: 在此宇宙论语境中指构成物质世界的基本要素；加“各种”使复数含义在汉语中更清楚。
theological_decisions:
- issue: 强调主语αὐτὸς所指为何
  choice: 保留代词“他”，由上下文表明赐予者是上帝
  alternative: 在正文中直接译作“上帝亲自”
  rationale: 上下文支持所指为上帝，但希腊文此处使用代词；保留代词既忠实于措辞，也不替原文作显化改写。
- issue: ἀψευδῆ所表达的知识性质
  choice: 译为“确实无误”，表达真实可靠
  alternative: 译为“绝无谬误”或“不会错的”
  rationale: 原词表示不虚假、真实可靠；所选译法保留其力度，却避免将后来的系统神学术语直接带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万有”保留宇宙论范围而不过分哲学化；“是他亲自”体现αὐτὸς的强调。“使我知道”让希腊文不定式与前句自然衔接。所有脚注标记均置于相关词语之后。
