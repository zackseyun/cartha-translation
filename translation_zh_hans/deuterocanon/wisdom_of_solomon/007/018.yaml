lexical_decisions:
- source_word: ἀρχὴν καὶ τέλος καὶ μεσότητα χρόνων
  choice: 时间的开始、终结和中点
  rationale: 三个名词共同受“时间”限定，构成起始、终结与中间的时间序列；保留原文并列结构及其概括性。
- source_word: τροπῶν
  choice: 回转
  rationale: τροπαί可泛指周期性的回转，在天文语境中也可特指太阳的回转点，即至日。正文采用较宽泛的“回转”，避免把潜在的天文学专义直接确定下来。
- source_word: ἀλλαγὰς
  choice: 变化
  rationale: 直接表达改变、交替之意，并与后面的“变迁”形成近义而不完全重复的对应。
- source_word: μεταβολὰς
  choice: 变迁
  rationale: 表达状态或时段的转换，与ἀλλαγάς的“变化”保持原文有意的词汇变化。
- source_word: καιρῶν
  choice: 时节
  rationale: καιροί可指特定、适宜或划分出的时段；在宇宙与历法知识的语境中，“时节”自然，同时未限定为四季。
