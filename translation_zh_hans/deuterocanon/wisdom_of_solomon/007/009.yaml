base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: zh_hans
  text: 我也没有把任何无价的宝石[a]与她相比，因为一切黄金在她眼中不过是一点沙子[b]，白银在她面前也将被看作黏土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无价的宝石”也可译作“价值无法估量的宝石”。希腊语在这里指珍贵到无法定价，并非“没有价值”。
    reason: lexical_alternative
  - marker: b
    text: 直译“一点沙”。这里表示，与智慧相比，黄金微不足道。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: 我也没有把……与她相比
  rationale: ὁμοιόω在此表示拿某物与智慧相比；中文用“把……与她相比”自然，并保留与上文相承的“也没有”。
- source_word: λίθον ἀτίμητον
  choice: 任何无价的宝石
  rationale: ἀτίμητος在此并非“没有价值”，而是价值无法估量；“无价的宝石”准确表达其语境意义。“任何”使中文否定句自然，也不改变单数名词的泛指作用。
- source_word: ὁ πᾶς χρυσός
  choice: 一切黄金
  rationale: 保留原文集合性和总括性的表达。
- source_word: ἐν ὄψει αὐτῆς
  choice: 在她面前
  rationale: 保留原文空间意象及智慧的拟人化，而不直接化约为“与她相比”。
- source_word: ψάμμος ὀλίγη
  choice: 少许沙土
  rationale: 贴近原文“少量的沙”，同时“沙土”较符合现代汉语的比喻语感；其重点是黄金相较智慧微不足道。
- source_word: λογισθήσεται
  choice: 必被视为
  rationale: 表达λογίζομαι将来时被动态的评价含义；“必”在中文中自然呈现此处将来陈述，而不额外赋予神学必然性。
- source_word: πηλός
  choice: 泥土
  rationale: πηλός可指泥或黏土；在价值对比中，“泥土”自然，并与贵金属形成鲜明反差。
- source_word: ἄργυρος ἐναντίον αὐτῆς
  choice: 白银在她面前
  rationale: “白银”明确指金属银；“在她面前”保留原文拟人化和空间框架。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 全节以“她”指智慧
  alternative: 改用“它”，或重复“智慧”
  rationale: 希腊文以阴性代词αὐτῇ、αὐτῆς指向上下文中的智慧。使用“她”保留文学拟人手法，但不据此增添关于智慧身份的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“她”的拟人化以及“在她面前”的空间意象；用“不过”自然呈现金银与智慧相比时价值悬殊的语气。
