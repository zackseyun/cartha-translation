  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: zh_hans
  text: 因为智慧比任何运动都更灵动[a]；因她的纯洁，她穿过并渗透万物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比一切运动更具活动能力。”希腊语比较级着重表达智慧超越一切运动的活动能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: 任何运动
  rationale: πάσης与比较级连用，表达智慧胜过一切运动；“任何运动”在现代汉语中自然地保留这种全称比较。
- source_word: κινητικώτερον
  choice: 更灵动
  rationale: 该比较级强调运动、活动的能力。“更灵动”既保留动态意味，也避免把它窄化为单纯的物理位移或抽象的“积极”。
- source_word: σοφία
  choice: 智慧
  rationale: 这是智慧文学中的核心用语；译作“智慧”既准确，又容许上下文中的文学性拟人。
- source_word: διήκει
  choice: 贯通
  rationale: 该动词有延伸、通达、贯穿之意；“贯通”保留其遍及万物的动态，并与后一个动词区分。
- source_word: χωρεῖ
  choice: 穿行
  rationale: 该词在此表示行经、通过。“穿行”保存第二个运动动词，不把两个并列动词合并成一个概念。
- source_word: διὰ πάντων
  choice: 万物
  rationale: πάντων在此具有包罗一切的中性复数含义；“万物”简洁、庄重，并符合汉语智慧文学语体。
- source_word: διὰ τὴν καθαρότητα
  choice: 由于她纯洁
  rationale: διά加宾格表示原因；译文明确保留因果关系，并以“她”体现本节对智慧的拟人表达。
theological_decisions:
- issue: 智慧的拟人化
  choice: 以女性代词“她”指智慧，但不将“智慧”处理为专名或独立神圣位格
  alternative: 使用非人格化的“它”或省略代词；或将“智慧”专名化以强化其位格含义
  rationale: σοφία在希腊语中为阴性名词，且上下文具有明确的拟人色彩；“她”可传达这种文学表达，但本节本身不足以断定更强的本体论含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“灵动”保留原文同根词所强调的运动能力；“贯通并穿行”保留两个并列动词及其细微差别。脚注说明拟人语法与可能的词义替代，同时不消解经文的神学张力。
