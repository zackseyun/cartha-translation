base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: zh_hans
  text: 然而，因魔鬼的嫉妒，死亡进入了世界；凡属于他那一份的人，都经历死亡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经历死亡”较直译可作“试验它（或他）”。希腊语此处表达较难；代词最自然地回指“死亡”，全句很可能是说，属于魔鬼那一份的人亲身经历死亡。
    reason: 保留 πειράζουσιν αὐτόν 的字面含义、代词指向及原文难解之处。
lexical_decisions:
- source_word: φθόνῳ
  choice: 因……的嫉妒
  rationale: 该与格可表示原因或手段；“因”在现代汉语中自然地保留死亡进入世界与魔鬼嫉妒之间的因果关系。
- source_word: διαβόλου
  choice: 魔鬼
  rationale: 在本节的犹太希腊语智慧文学语境中，此词指向具有位格的邪恶者，而不只是泛指“诽谤者”或“控告者”。
- source_word: θάνατος
  choice: 死亡
  rationale: 直接对应原词，不把其范围缩窄为肉体死亡，也不作额外神学扩展。
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: 进入了世界
  rationale: 保留原文的进入意象，同时符合现代汉语表达。
- source_word: πειράζουσιν
  choice: 经历
  rationale: 该动词通常有“试验、尝试、试探”之意，但以“死亡”为宾语时，直译为“试验死亡”在汉语中晦涩且容易误导；“经历”表达此处很可能指亲身遭遇死亡的语境意义，直译歧义则保留在脚注中。
- source_word: αὐτὸν
  choice: 死亡（重复名词）
  rationale: 该阳性代词最自然地回指同为阳性的“死亡”。汉语若译作“它”略显生硬，因此重复“死亡”，但脚注说明原文为可作“它／他”的代词。
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: 凡属于他那一份的人
  rationale: “那一份”保留 μερίς 的“份、分得的部分”意象，也传达这些人与魔鬼归属相连；避免直接改写为较强解释性的“党羽”或“站在他一边的人”。
theological_decisions:
- issue: διάβολος 的身份
  choice: 译为具有位格含义的“魔鬼”
  alternative: 泛指“诽谤者”或“控告者”
  rationale: 死亡因其嫉妒而进入世界的叙述，以及当时犹太希腊语的用法，都支持此处指魔鬼；同时不进一步指明原文未明说的具体事件或身份。
- issue: πειράζουσιν αὐτόν 的含义
  choice: 译作“经历死亡”
  alternative: “试验它／他”“试探它／他”或把死亡拟人化
  rationale: 原文用词确有“试验、试探”的张力，但与“死亡”搭配时很可能表示亲身遭遇死亡。正文采用可理解的语境译法，脚注保留其字面形式与代词指向的难点。
- issue: “属于他那一份”的归属关系
  choice: 保留“份”的意象
  alternative: 释义为“属于他一方”或“与魔鬼同党”
  rationale: 原文表达归属，却没有明确使用“党派”或“同党”等词；保留 μερίς 的意象可避免过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“然而”承接前文转折；“属于他那一份”有意保留原文较为凝练的归属意象。正文避免生硬的“试验死亡”，同时以脚注明示原文的词汇张力。
