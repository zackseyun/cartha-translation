base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/004.yaml
  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: zh_hans
  text: 我们的名字终会随着时间被遗忘，没有人会记得我们的作为；我们的一生将像云的踪迹一样流逝，又像雾气一样消散，被太阳的光芒驱散，又被它的热力压下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被它的热力压下”所译的希腊语，字面意思是“被它的热力弄得沉重”。这里的意象较为罕见；也可理解为雾在太阳的热力之下受压而消失。
    reason: 说明βαρυνθεῖσα的字面义及该意象的不寻常性，避免将其过度解释为现代物理意义上的蒸发。
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  choice: 终会随着时间被遗忘
  rationale: 保留将来被动语态，并把时间推移的一般意义译成自然的现代汉语，不限定为某一短暂时段。
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: 会记得我们的作为
  rationale: 在与“被遗忘”平行的语境中，μνημονεύω主要表示记得；“作为”既庄重自然，也不预先把ἔργα限定为善行或恶行。
- source_word: παρελεύσεται ὁ βίος ἡμῶν
  choice: 我们的一生将……流逝
  rationale: βίος在此指今世生命或一生；“流逝”保留παρέρχομαι的经过、逝去之意，并与后面的云雾意象协调。
- source_word: ἴχνη νεφέλης
  choice: 云的踪迹
  rationale: ἴχνη为“足迹、痕迹、踪迹”；“云的踪迹”保留原文略带诗意且转瞬即逝的形象。
- source_word: ὁμίχλη διασκεδασθήσεται
  choice: 像雾气一样消散
  rationale: ὁμίχλη指雾或薄雾，διασκεδάζω的被动形式表示被吹散、驱散；“消散”符合汉语云雾意象。
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: 被太阳的光芒驱散
  rationale: διώκω在此描写雾被迫退去；“驱散”自然呈现阳光使雾消失的动态。
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: 受它的热力重压
  rationale: βαρύνω字面有“使沉重、重压”之意。原文意象不同寻常，译文保留这种物理性的张力，不擅自改成单纯的“蒸发”。
