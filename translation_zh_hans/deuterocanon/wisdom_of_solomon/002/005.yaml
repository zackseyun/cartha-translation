  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: zh_hans
  text: 因为我们的生命不过如影而逝；从我们的终局没有回头路，因为它已经封定，没有人能返回。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιᾶς … πάροδος
  choice: 如影掠过
  rationale: 保留“影子经过、转瞬即逝”的意象，并以简洁自然的现代汉语表达生命的短暂。
- source_word: ἀναποδισμὸς
  choice: 挽回
  rationale: 该词表示回转、撤回或逆转；在“终局”的语境中译作“挽回”，表达死亡无法逆转。
- source_word: τῆς τελευτῆς ἡμῶν
  choice: 我们的终局
  rationale: τελευτή可指生命的终结或死亡；“终局”保留其含蓄和庄重感，不把原文窄化为单一解释。
- source_word: κατεσφραγίσθη
  choice: 已被封定
  rationale: 兼顾“盖印封闭”与“确定不可更改”之意；被动形式也得到保留，而不擅自说明施事者。
- source_word: ἀναστρέφει
  choice: 返回
  rationale: 此处与死亡不可逆的上下文相合，指从终局返回；不采用可能被误解为悔改或改变行为的“回转”。
theological_decisions:
- issue: 本句关于死亡不可逆的陈述范围
  choice: 按说话者的论证直接译出“无人能够返回”
  alternative: 加以解释，使之符合某种复活或来世教义
  rationale: 本节属于不敬虔者的话语脉络；翻译应忠实呈现其观点，而不在正文中替其纠正或加入教派性阐释。
- issue: “它已被封定”的施事者
  choice: 保留无施事者的被动表达
  alternative: 明确译为“上帝已经把它封定”
  rationale: 希腊原文未明说施事者；不应由译者补入。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如影掠过”保留诗性意象；分号呈现原句两个紧密相连的判断。未设置脚注，因此正文无脚注标记。
