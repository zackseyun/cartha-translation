  - severity: low
    issue: “生命如影掠过”略有修饰关系歧义。
    rationale: 希腊文是“生命是影子的经过”。“生命不过如影而逝”在汉语中更顺畅地呈现生命短促流逝的比喻，未增添解释。
  revised_text: 因为我们的生命不过如影而逝；从我们的终局没有回头路，因为它已经封定，没有人能返回。
