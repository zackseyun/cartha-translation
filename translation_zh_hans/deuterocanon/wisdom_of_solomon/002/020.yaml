  text: Let us condemn him to a shameful death[a], for there will be an examination of him according to his words.
translation:
  language: zh_hans
  text: 让我们判处他可耻的死刑[a]，因为必会按他所说的话对他有所察看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”也可译作“眷顾”“看顾”“察验”或“昭雪”；后半句也可理解为：“他所遭遇的事必检验他的话。”希腊词可泛指察看、关注或介入。
    reason: lexical_alternative
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  choice: 受羞辱的死刑
  rationale: 与 καταδικάσωμεν 连用，表示判处的刑罚；“受羞辱的死刑”既保留死亡判决，也突出 ἀσχήμονι 所含的耻辱、不体面之意。
- source_word: καταδικάσωμεν
  choice: 让我们判他
  rationale: 第一人称复数劝勉虚拟式，带司法定罪、判刑意味；“让我们判他”自然保留其鼓动语气。
- source_word: ἐπισκοπή
  choice: 眷顾
  rationale: 该词可指察看、关注或介入；本句承接义人关于上帝会关注他的宣称。“眷顾”在中文中可保留神圣关注及可能介入的意味，而不明确限定为拯救、昭雪或惩罚。
- source_word: ἐκ λόγων αὐτοῦ
  choice: 照他所说的
  rationale: 保留 ἐκ 表明的依据或关联：将发生在他身上的事，会按他自己的话显明；中文表达自然，同时不把关系过度解释为单纯审讯。
theological_decisions:
- issue: ἐπισκοπή 对义人而言究竟指何种行动
  choice: 眷顾
  alternative: 察验、看顾、昭雪，或借他所遭遇的事检验他的话
  rationale: 希腊词本身可泛指察看、关注或介入；上下文可能暗示上帝会应验或检验义人的宣称，但未明确说明结果。正文用“眷顾”保存这种神学张力，脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“判他受羞辱的死刑”体现司法语境和公开羞辱；后半避免用“审查”过早把 ἐπισκοπή 限定为审讯，也避免明确断定必蒙拯救。
