base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: zh_hans
  text: 因为他们心里这样想，想得不对：“我们的一生短暂而愁苦；人到了生命尽头时，再无补救，也从未听说有人从阴间出来[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从阴间回来”或“从阴间获释”。“出来”所对应的希腊语分词，字面可有“解开”或“离去”的意思；结合“从阴间”，指从死者所在之境出来。
    reason: 保留ὁ ἀναλύσας的词义弹性，并说明ἐξ ᾅδου所标示的动作方向。
lexical_decisions:
- source_word: ἐν ἑαυτοῖς
  choice: 彼此
  rationale: 在此引出一群人内部的言谈，译作“彼此”自然地表达“在他们中间”；“心里”亦有可能，但上下文的复数主体更适合群体内部相互谈论。
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: 思想不正
  rationale: 分词说明他们说话时所作的判断或推想，οὐκ ὀρθῶς同时带有思想错误、不正当的评价意味；“思想不正”简洁保留这种双重色彩。
- source_word: ὀλίγος
  choice: 短暂
  rationale: 修饰βίος时指生命历时短；“短暂”符合现代汉语表达。
- source_word: λυπηρός
  choice: 愁苦
  rationale: 兼顾悲伤、痛苦和困厄，不把含义限于身体疼痛。
- source_word: βίος
  choice: 一生
  rationale: 此处指人的生命历程；“我们的一生”比单说“生活”更准确。
- source_word: ἴασις
  choice: 补救
  rationale: 该词本义为医治、治愈；在生命终结的语境中，“再无补救”自然表达死亡无法得到逆转或挽回，同时保留医治隐喻的功能。
- source_word: ἐν τελευτῇ ἀνθρώπου
  choice: 人生命终时
  rationale: τελευτή可指终结或死亡，ἀνθρώπου为泛指的人；此译不限定男性，并清楚表达人的生命抵达终点。
- source_word: ἐγνώσθη
  choice: 从未听说
  rationale: 被动形式表示没有这样的人为人所知；汉语“从未听说”自然传达历来无人知晓此类事例的经验性断言。
- source_word: ὁ ἀναλύσας ἐξ ᾅδου
  choice: 有人脱离阴间
  rationale: ἀναλύσας在此可有解开、离去或返回的含义；“脱离”较贴近其字面动作，又不完全消除究竟是获释还是返回的含混。ᾅδης译为“阴间”，指死者所在之境，而非只指坟墓。
theological_decisions:
- issue: ᾅδης所指的死者领域
  choice: 阴间
  alternative: 冥府；死亡之境；坟墓
  rationale: “阴间”是现代汉语中可理解且相对中性的死者领域用语，既不把它缩窄为坟墓，也不将其等同于最终刑罚之地。
- issue: ὁ ἀναλύσας的动作方向与含义
  choice: 脱离阴间
  alternative: 从阴间回来；从阴间获释
  rationale: 希腊语分词本身可表达解开、离去等动作，结合ἐξ ᾅδου可理解为从阴间出来。正文用“脱离”保留一定开放性，脚注列出主要可能译法，不把经文强行解释为某一种复活或释放观。
- issue: 泛指单数ἀνθρώπου
  choice: 人生命终时
  alternative: 一个男人生命终结时；人的结局中
  rationale: 这里泛指全人类的死亡，并非只论男性；现代汉语用“人”准确保留其普遍范围。
translation_notes:
  register: 采用现代、庄重而通顺的叙述语体。“短暂而愁苦”“再无补救”适合智慧文学中简练、有力的论辩语气；引号明确标示这是思想不正之人的观点，而非叙述者认可的结论。
