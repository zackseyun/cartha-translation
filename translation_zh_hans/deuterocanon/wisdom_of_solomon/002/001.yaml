  naturalness: “人生命终时”略显生硬且缺少结构助词；改为“人到了生命尽头时”更自然、庄重，也清楚表达泛指的人类死亡。“他们心里这样想，想得不对”在现代汉语中清楚保留叙述者对其推理的评价。
