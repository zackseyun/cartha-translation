base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: zh_hans
  text: 让我们欺压贫穷的义人[a]，不要顾惜寡妇，也不要敬重年迈老人的白发[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫穷而正直的人”。希腊文“贫穷的”和“正直的”都修饰同一个人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“也不要敬重一位高龄老人的白发。”白发在这里是高龄的具体标志。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: 让我们欺压
  rationale: 该动词表示仗势辖制、苛待他人；“欺压”自然简洁，并保留滥用权力的意味。
- source_word: πένητα δίκαιον
  choice: 贫穷的义人
  rationale: 两个阳性单数词共同描述同一个受害者；“贫穷的义人”既保留其贫困处境，也呈现其道德上的正直。
- source_word: μὴ φεισώμεθα χήρας
  choice: 不要顾惜寡妇
  rationale: φείδομαι 在此表示顾惜、饶恕或不加伤害；“不要顾惜”贴近原文，并符合恶人彼此怂恿的语气。
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: 也不要敬重
  rationale: ἐντρέπομαι 可表示羞惭、尊重或有所顾忌；以老人的白发为对象时，“敬重”最自然地表达应有的尊敬与顾念。
- source_word: πρεσβύτου ... πολιάς πολυχρονίους
  choice: 年高老人的白发
  rationale: 译文保留“老人—白发”的具体意象，并以“年高”表达 πολυχρονίους 对高龄的强调，避免生硬地重复年岁。
theological_decisions:
- issue: δίκαιον 在《智慧篇》第2章义人与恶人对照中的译法
  choice: 义人
  alternative: 正直的人；公义的人
  rationale: “义人”在中文圣经语境中能简洁表达道德和宗教层面的正直，并维持本章恶人与义人之间的张力；原词本身也可依语境译为“正直的人”或“公正的人”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欺压”“顾惜”“敬重”形成简洁的排比，保留原文恶人共同谋议的劝诱口吻；正文中的[a]、[b]均与脚注对应。
