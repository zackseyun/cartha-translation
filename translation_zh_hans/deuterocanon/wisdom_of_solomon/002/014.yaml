  text: He became a reproof to our thoughts[a]; even being seen is burdensome to us[b],
translation:
  language: zh_hans
  text: 他成了我们心思的指证[a]；就连看见他，也使我们难以忍受[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他成了对我们内心思量的揭露。”希腊语“指证”可指揭露过错、显明不是；“心思”也可指内在的思量或意念。
