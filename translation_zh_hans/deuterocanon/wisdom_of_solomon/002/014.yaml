    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 成了
  rationale: 对应不定过去时 ἐγένετο，表达他对说话者而言已成为某种存在；“成了”自然简洁，不额外引入完成体色彩。
- source_word: εἰς ἔλεγχον
  choice: 责备
  rationale: ἔλεγχος 可指责备，也含揭露过错、使人知罪之意；“责备”保留其道德指斥力，同时避免强化为司法性的“定罪”。
- source_word: ἐννοιῶν ἡμῶν
  choice: 我们的心思
  rationale: ἐννοίαι 指内在的思想、意念或思量；“心思”既自然，又保留其内在活动的含义，不将其限定为动机或计谋。
- source_word: βαρύς ἐστιν ἡμῖν
  choice: 使我们难以忍受
  rationale: βαρύς 字面为“沉重”，此处比喻他的存在或出现令人不堪承受；采用现代汉语的自然表达。
- source_word: βλεπόμενος
  choice: 看见他
  rationale: 该被动分词字面为“被看见”；汉语若直译为“被看见”生硬，转为“看见他”准确表达连见到他都难以忍受的意思。
theological_decisions:
- issue: 省略主语所指的人物
  choice: 他
  alternative: 义人；这个人
  rationale: 本节承接上下文中的义人。采用“他”保留希腊文隐含主语，不在本节加入原文没有的解释性称谓。
- issue: ἔλεγχος 的道德作用
  choice: 责备
  alternative: 揭露；斥责；定罪
  rationale: 原词兼有指出并暴露错误的意味。“责备”保留这种道德张力，而不将其解释为正式的司法定罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成了对我们心思的责备”有意保留原文较凝练的结构；后半句适度转为自然汉语，同时以脚注保存字面形式。
