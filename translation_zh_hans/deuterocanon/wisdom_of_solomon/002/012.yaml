base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: zh_hans
  text: 让我们埋伏那义人吧[a]，因为他令我们感到棘手，反对我们的所作所为，责备我们违犯律法的罪，又指控我们有违所受教养的过错[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那位义者”。希腊文为单数，也可指具有代表性的义人。
    reason: lexical_alternative
  - marker: b
    text: “所受教养”也可译作“所受训练”或“所受管教”。希腊词可指教养、训练或管教。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: 我们来埋伏……吧
  rationale: 以第一人称复数祈使式表达劝诱语气，并保留暗中伺机加害的含义，不把具体手段说得过死。
- source_word: τὸν δίκαιον
  choice: 那义人
  rationale: 保留希腊文带冠词的阳性单数及其代表性用法；“义人”自然、庄重，也符合中文圣经语域。
- source_word: δύσχρηστος
  choice: 妨碍我们
  rationale: 此处表示此人令说话者感到棘手、不便，而非字面的“无用”；“妨碍我们”适合上下文中的敌视口吻。
- source_word: ἐναντιοῦται τοῖς ἔργοις ἡμῶν
  choice: 反对我们的所作所为
  rationale: 明确表达主动抵制，并用自然现代汉语保留ἔργα在此处的行为和道德色彩。
- source_word: ὀνειδίζει ἡμῖν ἁμαρτήματα νόμου
  choice: 责备我们违犯律法的罪
  rationale: 将νόμου理解为罪所触犯的规范；“责备”保留言语谴责之意，又不增强为嘲弄。
- source_word: ἐπιφημίζει ἡμῖν
  choice: 指控我们
  rationale: 体现该动词在本句中的归罪、控告色彩，简洁而具有司法意味。
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: 有违所受教养的过错
  rationale: παιδεία可指教养、培育或管教；此译突出他们所受的道德塑造，同时保留原短语关系上的压缩与一定歧义。
theological_decisions:
- issue: τὸν δίκαιον是具体个人还是代表性人物
  choice: 那义人
  alternative: 那个义人／那位义者
  rationale: 保留单数男性人物的形式，不把他直接限定为某个特定对象，也不抹去其可代表一般义人的余地。
- issue: παιδεία的伦理含义
  choice: 所受教养
  alternative: 所受的训练／管教
  rationale: 上下文所指不只是学校教育，而是已经领受的道德培育；“教养”在现代汉语中较自然，同时脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“埋伏”“义人”“律法”保留经文语体；后半句用自然句法区分违犯律法与辜负所受教养这两项指控。
