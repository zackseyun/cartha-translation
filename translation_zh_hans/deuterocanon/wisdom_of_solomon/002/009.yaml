base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: zh_hans
  text: 我们中谁也不要无分于这场狂欢[a]；让我们处处留下欢乐的印记，因为这就是我们的份额，这就是我们的命分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骄傲”“傲慢”。这个希腊词可指高傲或自负；在这里，纵情享乐的语境更支持“狂欢”。
    reason: 保留ἀγερωχίας在语境义与常见贬义之间的词义歧义。
lexical_decisions:
- source_word: ἄμοιρος
  choice: 无分于
  rationale: 保留“没有分、未得一份”的分配意象，并与后文的“份额”和“命分”呼应。
- source_word: ἀγερωχίας
  choice: 狂欢
  rationale: 本段是不敬虔者纵情享乐的劝说，“狂欢”贴合语境；该词也可表示骄傲、傲慢，因此以脚注保留其真实歧义。
- source_word: πανταχῇ
  choice: 处处
  rationale: 简洁自然地表达“在各处、到处”。
- source_word: καταλίπωμεν
  choice: 让我们……留下
  rationale: 体现希腊语劝勉性虚拟语气和有意留下痕迹的动作。
- source_word: σύμβολα
  choice: 印记
  rationale: 表达可辨认的标志或痕迹，符合狂欢者要在各处留下欢乐迹象的语境。
- source_word: εὐφροσύνης
  choice: 欢乐
  rationale: 在这里指宴乐和欢快，不赋予该词超出上下文的属灵含义。
- source_word: μερὶς
  choice: 份额
  rationale: 保留所得之分的基本意义，并承接“无分于”的意象。
- source_word: κλῆρος
  choice: 命分
  rationale: 既保留被分派所得的一份，也传达此处所宣称的人生归宿；避免将其限定为法律意义的产业。
theological_decisions:
- issue: 享乐主义言论中ἀγερωχίας的含义
  choice: 狂欢
  alternative: 骄傲、傲慢、夸耀
  rationale: 《智慧篇》第二章的直接语境是恶人主张趁死前纵情享乐，因此“狂欢”最顺合话语脉络；同时，该词本身可带傲慢意味，故不在正文中强行合并两义，而在脚注中保留另一可能。
- issue: κλῆρος所表达的分派与归宿意象
  choice: 命分
  alternative: 所得、产业、签所定的份
  rationale: “命分”能与“份额”形成平行，同时保持“被分得之份／所归之命运”的张力，不将其过度解释为宗教性产业或法律继承。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无分于”略带书面色彩，用来保留全句反复出现的分配意象；“处处留下欢乐的印记”则保持自然流畅。
