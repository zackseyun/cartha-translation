  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/006.yaml
  text: Come then[a], let us enjoy the good things that exist, and let us make use of creation eagerly, as in youth[c][b];
translation:
  language: zh_hans
  text: 来吧，我们就享受现有的美好事物[a]，也像在青春年华时那样[c]，热切地取用受造万物[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“眼前的美物”或“现今的美好事物”。希腊文直译为“存在着的美好事物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“受造界”。
    reason: lexical_alternative
  - marker: c
    text: 原文也可理解为“像青春时那样”，可能指带着青春特有的活力或无所顾忌的态度。
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  choice: 来吧
  rationale: δεῦτε是号召语，οὖν承接上文并带有推论意味；现代汉语用“来吧”即可自然引出劝说，不必生硬地译成“所以来吧”。
- source_word: ἀπολαύσωμεν
  choice: 让我们享受
  rationale: 表达享用并从中得到乐趣，保留说话者及时行乐的语气。
- source_word: τῶν ὄντων ἀγαθῶν
  choice: 现有的美好事物
  rationale: 贴近字面“存在着的美好事物”，同时在汉语中自然表达当前实际可得之物；脚注保留其他可能理解。
- source_word: χρησώμεθα
  choice: 取用
  rationale: 表示使用、利用；“取用”既适合受造万物这一宾语，也避免与前面的“享受”完全合并。
- source_word: τῇ κτίσει
  choice: 受造万物
  rationale: κτίσις在此广指被创造的整体；“受造万物”比术语化的“受造界”更易懂，并保留其广度。
- source_word: ὡς νεότητι
  choice: 趁着青春年华
  rationale: 原文表达压缩，可能指以青春特有的活力或放纵态度行事；正文采用自然的时间性表达，脚注说明其比较意味。
- source_word: σπουδαίως
  choice: 尽情
  rationale: 在本段及时行乐的语境中，表示热切、急切地使用；“尽情”能传达强烈投入而不赋予道德褒义。
theological_decisions:
- issue: τῶν ὄντων ἀγαθῶν的范围
  choice: 现有的美好事物
  alternative: 眼前的美物；存在着的美好事物
  rationale: 该短语既可按字面理解为“存在的美好事物”，也可按语境理解为今生当前可得的美物。正文兼顾两者，不把它限定为某类享乐。
- issue: τῇ κτίσει的所指
  choice: 受造万物
  alternative: 受造界；所造之物
  rationale: 此处宜保留广义的创造整体，不窄化为单一受造物或仅指物质资源。
- issue: ὡς νεότητι的压缩表达
  choice: 趁着青春年华
  alternative: 像青春时那样；仿佛正值青春
  rationale: 希腊语比较结构含义略有压缩，可能强调青春的活力或放纵。正文采用自然汉语，脚注保留其比较性和语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留这段恶人言论中及时行乐的急切语气。句末分号承接后文。
