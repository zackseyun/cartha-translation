  text: Let us fill ourselves with costly wine and perfumes[a], and let no flower of spring pass us by.
translation:
  language: zh_hans
  text: 让我们尽享名贵的美酒和香膏[a]，不要错过任何一朵春花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香膏”也可译作“香油”或“芳香油”。希腊语μύρων泛指用于涂抹的芳香油膏，也是奢华享受之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴνου πολυτελοῦς
  choice: 名贵的美酒
  rationale: οἴνου是“酒”，πολυτελοῦς强调昂贵、高价值；合译为“名贵的美酒”，既自然，也保留奢靡享乐的语气。
- source_word: μύρων
  choice: 香膏
  rationale: μύρον泛指带香气的油或膏，常用于涂抹及奢华享受；“香膏”比现代汉语中的“香水”更贴近古代实物，又不带“药膏”的医疗意味。
- source_word: πλησθῶμεν
  choice: 让我们尽享
  rationale: 第一人称复数劝勉虚拟式，字面为“让我们充满/饱享”；“尽享”在汉语中自然表达尽情满足自己的享乐意味。
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: 不要错过任何
  rationale: 原文意象是不要让某物从身旁经过；结合宾语“春花”，“不要错过任何”自然传达不放过任何短暂享乐的意思。
- source_word: ἄνθος ἔαρος
  choice: 一朵春花
  rationale: 直译为“春天的花”；采用“一朵春花”保留诗意，并与“任何”搭配，使现代汉语流畅。
