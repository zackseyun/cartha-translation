base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/019.yaml
  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
translation:
  language: zh_hans
  text: 让我们用凌辱和酷刑来考验他[a]，以便了解他的温良，并衡量他忍受恶待而不报复的坚忍[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凌辱和酷刑”也可译作“侮辱和折磨”。原文两词可指傲慢而羞辱人的恶待，以及用痛苦折磨来试验人。
    reason: lexical_alternative
  - marker: b
    text: 原文所指的不只是一般的忍耐，而是遭受伤害或恶待时仍能忍受、不加报复。
    reason: lexical_clarification
lexical_decisions:
- source_word: ὕβρει
  choice: 用凌辱
  rationale: ὕβρις指傲慢、暴虐而羞辱人的恶待；“凌辱”既涵盖侮辱，也保留实际侵害的意味，符合上下文。
- source_word: βασάνῳ
  choice: 和酷刑
  rationale: βάσανος在此指以痛苦折磨作为试验手段；“酷刑”具体呈现这种手段，也避免与ἐτάσωμεν重复译作“考验”。
- source_word: ἐτάσωμεν
  choice: 让我们……考验他
  rationale: 第一人称复数劝勉虚拟式表达恶人提出的共同主张；“考验”兼顾查验和以苦难试炼之意。
- source_word: ἐπιείκειαν
  choice: 温良
  rationale: ἐπιείκεια可指温和、宽厚、不严厉的品性；“温良”自然而庄重，并与末句的坚忍区分。
- source_word: δικάσωμεν
  choice: 评断
  rationale: δικάζω本义带有判断、裁定色彩；此处指根据受试验者的表现加以判定。“评断”保留司法性的语感，同时适合本句语境。
- source_word: ἀνεξικακίαν
  choice: 忍受伤害而不报复的坚忍
  rationale: 该词特指遭受恶待或伤害时耐心承受、不以恶报恶；展开翻译可保留这一比一般“忍耐”更具体的含义。
theological_decisions:
- issue: 义人在迫害中所显出的两种相关品格
  choice: 分别译为“温良”和“忍受伤害而不报复的坚忍”
  alternative: “柔顺”和“忍耐”
  rationale: 原文用ἐπιείκεια与ἀνεξικακία描述彼此相关却不相同的品格；分别处理可保留修辞平行和伦理层次，不把二者合并为泛泛的“忍耐”。
- issue: δικάσωμεν在此是司法判断还是继续试验
  choice: 译为“评断”，保留判断意味
  alternative: 译为“检验”或“考验”以加强与前句的平行
  rationale: 该动词具有判断、裁定的基本语义，但在这里判断是借着试炼作出的；“评断”既不抹去其司法色彩，也不把它解释成正式定罪。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“凌辱和酷刑”直陈恶人的暴行；“温良”与展开式的“忍受伤害而不报复的坚忍”保持两种品格之间的区别。
