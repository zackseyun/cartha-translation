  text: Let us crown ourselves with rosebuds before they wither[a].
translation:
  language: zh_hans
  text: 趁玫瑰花苞还未凋谢，让我们把它们编成花冠，戴在头上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“趁玫瑰花朵还未凋谢，让我们用它们编成花环，戴在头上。”希腊语把“玫瑰”与可指花苞、花萼或花盏的词连用，描绘的是新鲜的玫瑰花苞或花朵。
    reason: lexical_alternative
lexical_decisions:
- source_word: στεψώμεθα
  choice: 让我们用它们编成花冠戴上
  rationale: 这是不定过去时虚拟语气，用作劝勉，表示以花环为自己加冠。译文用“编成花冠戴上”自然呈现节庆性的自我装饰意象。
- source_word: ῥόδων κάλυξιν
  choice: 玫瑰花苞
  rationale: ῥόδων意为“玫瑰的”，κάλυξ可指花苞、花萼或花盏；二词合用最自然地指新鲜的玫瑰花苞，也可能泛指玫瑰花朵。
- source_word: πρὶν ἢ
  choice: 趁……还未
  rationale: 该结构引出应抢在其发生之前的事件；汉语“趁……还未”既准确表达时间先后，也契合本句及时享乐的劝勉语气。
- source_word: μαρανθῆναι
  choice: 凋谢
  rationale: μαραίνω的不定过去时被动不定式，指花枯萎、衰残；“凋谢”是现代汉语中描写花朵衰败的自然用语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“趁……还未”使希腊语的时间关系自然清楚；“编成花冠戴上”保留στεψώμεθα的花环加冠意象，避免仅译作笼统的“装饰自己”。
