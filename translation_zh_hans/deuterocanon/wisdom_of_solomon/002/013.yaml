  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/013.yaml
  text: He claims to have knowledge of God[a], and calls himself a child of the Lord;
translation:
  language: zh_hans
  text: 他自称认识上帝，并称自己为主的孩子[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”也可译作“儿子”；希腊词 παῖς 在某些语境中也可指“仆人”。
    reason: 保留 παῖς 的词义歧义及可能的神学张力。
lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: 自称
  rationale: 这里指恶人所描述的义人对自己的宣称；“自称”自然表达其自我表述，同时不预先判断所言是真是假。
- source_word: γνῶσιν ἔχειν θεοῦ
  choice: 认识上帝
  rationale: 希腊文直译为“具有对上帝的认识”。现代汉语用“认识上帝”更自然，也保留了关系性与认知性的含义。
- source_word: θεοῦ
  choice: 上帝
  rationale: 无冠词属格在此无需引入额外区别，按所指直接译为“上帝”。
- source_word: παῖδα
  choice: 孩子
  rationale: παῖς 可指孩子、儿子或仆人。此处上下文更侧重与主的亲属关系；“孩子”既保留亲子含义，也不过度限定为男性。其“仆人”的可能义在脚注中说明。
- source_word: Κυρίου
  choice: 主
  rationale: 按书卷用语将 κύριος 译为“主”，简洁而庄重。
- source_word: ἑαυτὸν ὀνομάζει
  choice: 称自己为
  rationale: 自然对应反身结构，准确表达自我称谓。
theological_decisions:
- issue: παῖδα Κυρίου 可表达亲子关系，也可能表达服侍身份
  choice: 主的孩子
  alternative: 主的儿子；主的仆人
  rationale: 本节着重义人所宣称的与上帝的特殊关系，亲子义较合语境；“孩子”不额外引入男性限定，同时以脚注保留该希腊词的语义张力。
- issue: κύριος 的译法
  choice: 主
  alternative: 主上帝
  rationale: 原文仅有 Κυρίου，译作“主”既忠实，也不加入原文没有的“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自称”贴合恶人话语中的修辞视角；分号承接上下文。脚注标记已置于正文相应词语之后。
