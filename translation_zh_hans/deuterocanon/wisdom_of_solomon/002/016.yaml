base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: zh_hans
  text: 他把我们看作赝品[a]，远离我们的行径，如同远离污秽之物；他称义人的结局[b]为有福，并夸口说上帝是他的父亲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虚假的人”“不纯正之物”或“劣质品”。希腊文指并非真品或成色不足的东西。
    reason: lexical_alternative
  - marker: b
    text: 或译“义人的最终境况”或“义人的最终结果”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“以‘上帝为父’夸口”，意思是他声称上帝是他的父亲。
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: 赝品
  rationale: 原词指不纯正、伪造或成色不足之物。“赝品”保留真假对照的具体比喻，也传达恶人口中那位义人认为他们并非真正良善之人的意味。
- source_word: ἐλογίσθημεν
  choice: 把我们看作
  rationale: 该被动形式表示在某人的判断中被算为、被视为；汉语改用主动结构，更自然，并保留评价意味。
- source_word: ἀπέχεται
  choice: 避开
  rationale: 表达有意与某事保持距离；与后面的“像避开污秽之物一样”衔接自然。
- source_word: ὁδῶν
  choice: 道路
  rationale: 保留圣经中以“道路”指生活方式或行为的常见隐喻，而不直接窄化为“行为”。
- source_word: ἀκαθαρσιῶν
  choice: 污秽之物
  rationale: 保留洁净与不洁净的语域，并以“之物”体现希腊文复数所指的各种会使人沾染污秽的事物。
- source_word: μακαρίζει
  choice: 称……为有福
  rationale: 准确表达认定或宣称某人有福，不把它弱化为主观的快乐。
- source_word: ἔσχατα
  choice: 结局
  rationale: 此处复数可指最后的境况、最终结果；“结局”简洁自然，同时以脚注保留“最终境况”的可能含义。
- source_word: δικαίων
  choice: 义人
  rationale: 采用现代中文圣经语域中清楚而通行的道德—宗教称谓。
- source_word: ἀλαζονεύεται
  choice: 夸口
  rationale: 保留原词带有的自夸、傲慢语气，也符合说话者对义人的负面指控。
- source_word: πατέρα θεόν
  choice: 说上帝是他的父亲
  rationale: 希腊文是压缩的宾语结构，意为以父亲上帝为夸口或声称上帝为父；正文采用自然汉语展开，但用脚注保存原文的简略表达。
theological_decisions:
- issue: πατέρα θεόν与ἀλαζονεύεται的关系
  choice: 恶人指控义人夸口说上帝是他的父亲
  alternative: 他以上帝为父而夸口；他夸耀父亲上帝
  rationale: 整句仍属于恶人的陈述，并非叙述者直接作出的教义宣告。译文明确亲属关系，却不把它专门解释为后来的基督论称号。
- issue: ἔσχατα δικαίων所指
  choice: 义人的结局
  alternative: 义人的最终境况；义人末后的事
  rationale: 原文可泛指义人最后的境况或结果。正文采用自然而宽泛的“结局”，不进一步断定具体的末世论内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“赝品”保留原文鲜明的真假比喻；“道路”“义人”“有福”“夸口”维持圣经语域而不过分古雅。脚注依正文出现顺序标为[a]、[b]、[c]。
