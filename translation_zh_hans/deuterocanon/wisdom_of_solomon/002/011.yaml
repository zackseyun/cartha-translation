  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/011.yaml
  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: zh_hans
  text: 要让我们的力量成为正义的法则[a]，因为凡是软弱的，都被证明是无用的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”也可译作“公义”。希腊文δικαιοσύνη可指正义或公义。
    reason: 保留δικαιοσύνη的词义幅度，不在脚注中加入超过原文的解释性判断。
lexical_decisions:
- source_word: ἔστω
  choice: 但愿……成为
  rationale: 第三人称命令式在此表达劝诱或主张；“但愿……成为”保留其祈使语气，并承接前文恶人的言论。
- source_word: ἡμῶν ἡ ἰσχὺς
  choice: 我们的力量
  rationale: 直译属格和名词结构；“力量”既可涵盖体力，也可涵盖强权，不将含义限缩为军事或政治权力。
- source_word: νόμος τῆς δικαιοσύνης
  choice: 正义的法则
  rationale: νόμος译为“法则”，体现支配行为的规范；δικαιοσύνη在此涉及公平和正当秩序，译为“正义”较自然，同时保留这句话以强力重定义正义的反讽张力。
- source_word: τὸ ἀσθενὲς
  choice: 软弱的
  rationale: 中性单数形容词作名词使用，泛指一切软弱者或软弱之物；中文保持概括性，不擅自限定为某一类人。
- source_word: ἄχρηστον
  choice: 无用
  rationale: 准确表达“没有用处、派不上用场”，并保留说话者冷酷的功利判断。
- source_word: ἐλέγχεται
  choice: 显为
  rationale: 该动词可指揭露、证实或显明；被动态“显为”在中文中自然，并避免过度加入司法审判意味。
theological_decisions:
- issue: δικαιοσύνη在恶人言论中的含义
  choice: 正义
  alternative: 公义
  rationale: 语境关乎强者把自己的力量立为社会正当性的准则，“正义”较贴合公共秩序和公平层面；“公义”也可能，但容易使现代读者首先联想到专门的神学用语。正文保留原句的反讽：恶人并非真正拥护正义，而是企图让强权定义正义。
- issue: τὸ ἀσθενές所指范围
  choice: 软弱的
  alternative: 弱者
  rationale: 希腊文为中性单数的名词化形容词，可泛指软弱者或软弱之物。采用“软弱的”保留这种开放性，不把对象只限定为人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但愿……成为”保留劝诱式命令语气；“正义的法则”略带刻意的尖锐感，以呈现恶人把强权说成正义标准的悖谬。
