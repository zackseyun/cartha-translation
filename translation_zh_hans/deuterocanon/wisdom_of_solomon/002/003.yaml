  text: when it is extinguished[a], the body will become ashes[b], and the spirit will be dispersed like thin air.
translation:
  language: zh_hans
  text: 它熄灭时[a]，身体将化为灰烬，灵也将如轻飘而空虚的空气般消散[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”承接上文生命气息与火星的意象；也可译作“这气息熄灭时”。
    reason: contextual_antecedent
  - marker: b
    text: “灵”也可译作“气息”或“生命之气”；希腊词 πνεῦμα 在这里可兼有这些意思。“轻飘而空虚的空气”对应原文，含松散、不实在且易于消散之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  choice: 它一熄灭
  rationale: 这是由 σβέννυμι 构成的属格独立结构，承接上文气息如火星的意象；用“它”保留本节中先行词未明说的特点，也不把所指限定得过死。
- source_word: τέφρα ἀποβήσεται
  choice: 会化为灰烬
  rationale: ἀποβαίνω 在此表示变成、落得某种结果；“化为灰烬”既贴近原意，也符合现代汉语表达。
- source_word: τὸ σῶμα
  choice: 身体
  rationale: 按带冠词的单数名词直译；不增补“我们的”，也不把它解释为“尸体”。
- source_word: τὸ πνεῦμα
  choice: 灵
  rationale: πνεῦμα 可指灵、气息或生命之气；“灵”保留它与身体的对举，同时由脚注说明此处仍有气息层面的歧义。
- source_word: διαχυθήσεται
  choice: 消散
  rationale: 该词是 διαχέω 的将来时被动态；在空气的比喻中，“消散”自然地表达扩散至无形的意象。
- source_word: ὡς χαῦνος ἀήρ
  choice: 像稀薄的空气一样
  rationale: χαῦνος 可表达松散、轻飘、空疏或不实在；“稀薄的空气”保留其轻而易散的性质，避免使用汉语成语“凭空消失”所带来的额外含义。
theological_decisions:
- issue: 怀疑死亡之言论中 πνεῦμα 的人论含义
  choice: 灵
  alternative: 气息；生命之气
  rationale: 原文把身体与 πνεῦμα 并列，却又以空气描述后者的消散。译作“灵”保留身体与灵的张力，但不据此引入灵魂不灭等后来的教义结论；脚注同时保留“气息”的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“它一熄灭”保留原文承上而未在本节明说所指的结构；“身体……灵……”保留原文的人论对举与神学张力。所有脚注标记均在正文中出现。
