base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: zh_hans
  text: 因为上帝创造人，是要人不受败坏[a]，并使人成为上帝自己本性的形象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不受败坏”也可译作“不朽”“不死”“不灭”或“不败坏”。希腊词兼有不受朽坏、败坏和死亡辖制的意思。
    reason: lexical_alternative
  - marker: b
    text: “上帝自己本性的形象”也可理解为“上帝自己独特属性的形象”或“上帝自己存在样式的形象”。原文短语较为罕见，有几种贴近原文的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，表达原因；保留希腊文的因果关系。
- source_word: ἔκτισε
  choice: 创造了
  rationale: κτίζω在此指使之存在；“创造”自然、准确，也符合创造语境。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 带冠词的单数在这里代表全人类；现代汉语用“人”既保留单数形式，也自然涵盖人类整体。
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: 为要他不朽坏
  rationale: ἀφθαρσία指不受败坏、衰残和死亡辖制的状态；“不朽坏”比单说“不死”保留更宽的语义范围，“为要”则自然表达ἐπί在此的目的或指向。
- source_word: εἰκόνα
  choice: 形象
  rationale: 保留εἰκών的基本意义及其与创造叙事中“形象”概念的呼应。
- source_word: τῆς ἰδίας ἰδιότητος
  choice: 上帝自身本性的
  rationale: ἰδιότης可指某者特有的性质、本性或独特属性；“自身本性”在汉语中较自然，但原短语罕见而多义，故以脚注保留其他可能。
- source_word: ἐποίησεν αὐτόν
  choice: 使他成为
  rationale: 希腊文直述上帝“使他成为……形象”；这一译法比“照着……形象造他”更贴近句法，也避免把宾语补语改成方式状语。
theological_decisions:
- issue: τὸν ἄνθρωπον所指的范围
  choice: 以单数“人”代表全人类
  alternative: 人类；这个人
  rationale: 经文提出普遍的人论陈述，并呼应创造传统；“人”可在现代汉语中自然表达代表性单数，不把经文限制为某一个体。
- issue: ἀφθαρσία在本节的含义
  choice: 不朽坏
  alternative: 不死；不灭；不败坏
  rationale: 该词兼有不腐朽、不败坏及不受死亡辖制之意。“不朽坏”保留这种张力，不把它缩减为灵魂永存等特定哲学或教义命题。
- issue: τῆς ἰδίας ἰδιότητος的含义
  choice: 上帝自身的本性
  alternative: 上帝自身的独特属性；上帝自身的存在样式
  rationale: 此短语在希腊文中不寻常。“自身本性”可读且能表达属于上帝自己的特质，但不排除“独特属性”等理解，因此在脚注中说明歧义。
- issue: εἰκόνα在句中的句法关系
  choice: 使人成为上帝自身本性的形象
  alternative: 照着上帝自身本性的形象造人
  rationale: εἰκόνα是ἐποίησεν的宾语补语，较直接的理解是“使他成为一个形象”。此译法不将其悄然改写为创造的范式或方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“人”作代表性单数；两处脚注分别保留ἀφθαρσία与ἰδιότης的真实语义幅度。为避免代词“他”连续出现时指代上帝或人的歧义，后半句重提“上帝”。
