  text: They reasoned these things, and were led astray; for their own wickedness blinded them,
translation:
  language: zh_hans
  text: 他们这样盘算，就走入了迷途；因为他们自己的邪恶蒙蔽了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: 这样
  rationale: 承接上文恶人的种种议论；汉语用“这样盘算”自然地保留其回指作用，虽不机械译出复数。
- source_word: ἐλογίσαντο
  choice: 盘算
  rationale: 该词表示思量、推断或谋算；上下文中的思想带有刻意谋议的意味，“盘算”兼顾思考与筹谋。
- source_word: ἐπλανήθησαν
  choice: 走入了迷途
  rationale: 保留被动形式所表达的陷入错误这一结果，同时避免额外指定是谁引他们误入歧途。
- source_word: ἀπετύφλωσεν
  choice: 蒙蔽了
  rationale: 该动词本义涉及使之失明；此处用于道德与认知层面，“蒙蔽”是自然且清楚的汉语表达。
- source_word: ἡ κακία αὐτῶν
  choice: 他们自己的邪恶
  rationale: κακία 指道德上的恶与败坏；“自己的”突出致盲根源属于他们本身，而不引入外在致盲者。
theological_decisions:
- issue: 道德邪恶与盲目之间的因果关系
  choice: 他们自己的邪恶蒙蔽了他们
  alternative: 邪恶蒙蔽了他们／他们的恶意蒙蔽了他们
  rationale: 希腊文明确把他们的迷误归因于他们自身的 κακία。译文保留这一道德因果关系，不扩展为神使人刚硬或外力欺骗的教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“盘算”贴合上下文中的 deliberation；“走入了迷途”保留 ἐπλανήθησαν 的结果性与一定的被动意味；分号和“因为”呈现原文推论关系。
