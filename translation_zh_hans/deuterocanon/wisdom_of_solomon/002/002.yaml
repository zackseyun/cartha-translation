  text: because we came into being by mere chance, and after this we will be as though we had not existed; because the breath in our nostrils is smoke, and reason is a spark in the beating of our heart,
translation:
  language: zh_hans
  text: 因为我们是偶然出现的，之后我们将如同从未存在过；因为我们鼻孔中的气息是烟，而理性是我们心脏跳动中的一星火花；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: 偶然
  rationale: 此处描述恶人所持的人生观，表示人的产生出于偶然、没有预定目的；译为“偶然”自然且准确。
- source_word: ἐγενήθημεν
  choice: 产生
  rationale: 保留“进入存在、形成”的宽泛含义，避免使用可能暗示受造者或明确生育过程的词。
- source_word: πνοή
  choice: 气息
  rationale: 结合“鼻孔中”的语境，指呼吸之气；“气息”符合现代汉语表达。
- source_word: λόγος
  choice: 思想
  rationale: 在此与心脏运动所生的火花相联，较可能指理性活动或思想，而不是单纯的言语；同时避免把它神学化为专名“道”。
- source_word: ἐν κινήσει καρδίας
  choice: 心脏跳动时
  rationale: 将“在心的运动中”按其生理语境自然表达为心脏跳动，同时保留思想被视为身体运动产物的论证。
theological_decisions:
- issue: 本句是否陈述作者认可的创造论
  choice: 按恶人口中的偶然发生观直译，不加纠正性措辞
  alternative: 译成暗示上帝创造或护理的表述
  rationale: 上下文是在呈现恶人的推论；译文应保留其虚无主义和唯物主义立场，不把叙述者的神学判断混入引语内容。
- issue: λόγος 的含义
  choice: 思想
  alternative: 言语／理性／道
  rationale: 这里的 λόγος 被比作心脏运动中的火花，重点是人的思维或理性活动。“思想”在现代汉语中自然，也不引入“道”的基督论联想。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原句两次“因为”所形成的推论结构，并用分号呈现句内层次。
