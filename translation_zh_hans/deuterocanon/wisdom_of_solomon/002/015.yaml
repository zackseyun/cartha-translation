  text: for his life is unlike that of others[a], and his ways are different.
translation:
  language: zh_hans
  text: 因为他的生活与别人的生活不同[a]，他的道路也与众不同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他的生活方式与别人的生活方式不同。”
    reason: βίος可指“生活”，也可特指“生活方式”或生活的方式。
lexical_decisions:
- source_word: ἀνόμοιος
  choice: 不一样
  rationale: 表达“不同、不相似”的比较含义，与后面的 τοῖς ἄλλοις 自然搭配，符合现代汉语。
- source_word: βίος
  choice: 生活
  rationale: 此处既可指人的生活，也可侧重生活方式；正文用“生活”保留其简洁和一定的语义宽度，另以脚注说明较明确的译法。
- source_word: ἐξηλλαγμέναι
  choice: 异乎寻常
  rationale: 该完成时被动分词表示因改变而处于不同状态；结合上下文，译作“异乎寻常”能自然表达其道路与常人有别，同时不过分强调改变的施事者。
- source_word: τρίβοι
  choice: 所走的路
  rationale: 保留“路径”的具体比喻，也让现代读者自然理解为人的行事道路。
theological_decisions:
- issue: 是否在正文中明确 βίος 和 τρίβοι 的道德行为含义
  choice: 保留“生活”和“所走的路”的普通表达与路径比喻
  alternative: 译作“生活方式”和“行事为人”
  rationale: 原文借日常词语和道路意象描述义人与众不同的生活，不宜在正文中将其解释性地限定为道德行为。
- issue: 是否把 ἐξηλλαγμέναι 明译为“被改变了”
  choice: 译作“异乎寻常”以表达现存的不同状态
  alternative: 译作“已经改变”或“被改变了”
  rationale: 希腊语形式含有改变后状态的意味，但语境重点是其道路与众不同；直译成被动式会在汉语中不自然，并可能无端引出是谁使之改变的问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟别人不一样”清楚通顺，“异乎寻常”略带书面色彩，与智慧文学语体协调。
