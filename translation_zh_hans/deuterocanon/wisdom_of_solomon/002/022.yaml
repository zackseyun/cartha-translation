    rationale: ἔκριναν γέρας ψυχῶν ἀμώμων意为不认为（或不判定）无瑕者的灵魂配有尊荣。“会得”虽可由语境推知，却将其显化为未来获得；“配得尊荣”更准确保留原文的判断语气。
  - severity: low
