base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/022.yaml
  text: And they did not know his mysteries[a], nor did they hope for the reward of holiness[c][b], nor did they consider blameless souls worthy of honor.
translation:
  language: zh_hans
  text: 他们不明白他的奥秘[a]，也不盼望虔敬的奖赏[b]，也不认为无瑕的灵魂配得尊荣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥秘”也可译作“隐秘的事”。
    reason: lexical_alternative
  - marker: b
    text: “虔敬”也可译作“圣洁”或“敬虔”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译近于“也不判断无瑕灵魂的尊荣”，句式较为压缩；此处“配得尊荣”表达其评价意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: 明白
  rationale: γινώσκω在此既可指知道，也可含领会之意；“明白”自然表达恶人未能认识、领悟上帝隐秘安排的语境。
- source_word: μυστήρια
  choice: 奥秘
  rationale: μυστήρια指隐藏、未显明的事；“奥秘”保留其宗教语境与神学分量，而不具体限定其内容。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 依照希腊文保留代词，不在正文中改写为“上帝的”；语境所指可理解为上帝，同时保留原文的表达形式。
- source_word: μισθὸν
  choice: 报偿
  rationale: μισθός可指工价或奖赏；此处是道德与宗教语境，“报偿”兼具回报和奖赏之意，且不过度商业化。
- source_word: ἤλπισαν
  choice: 盼望
  rationale: ἐλπίζω表示怀着希望、期待；“盼望”准确保留其面向未来的意味。
- source_word: ὁσιότητος
  choice: 虔敬
  rationale: ὁσιότης表示对神圣之事的虔诚、敬虔或圣洁；“虔敬”在现代汉语中较自然，并保留宗教伦理色彩。
- source_word: ἔκριναν
  choice: 认为
  rationale: κρίνω在此表示作出判断或评价；“认为”适合后接补足语，也使压缩的希腊语结构在中文中清楚自然。
- source_word: γέρας
  choice: 尊荣
  rationale: γέρας可指荣誉、奖赏或特权。这里与“灵魂”构成压缩表达，“会得尊荣”既通顺，也不把它过度限定为物质奖品。
- source_word: ψυχῶν
  choice: 灵魂
  rationale: ψυχή可指灵魂、生命或人；在本段有关义人终局的语境中，“灵魂”保留原词的人论及末世意味。
- source_word: ἀμώμων
  choice: 无瑕疵的
  rationale: ἄμωμος本义为没有污点、无可指摘；“无瑕疵的”保留其形象性及道德含义。
theological_decisions:
- issue: “他的奥秘”中代词的所指
  choice: 正文保留“他的”，按语境理解为上帝
  alternative: 直接译作“上帝的奥秘”
  rationale: 上下文支持代词指上帝，但希腊文使用代词；保留“他的”可避免在正文中把所指明说得超过原文。
- issue: ψυχῶν的语境含义
  choice: 译作“灵魂”
  alternative: 译作“生命”或“人”
  rationale: 本段涉及义人在现世表象之外的命运与昭雪；“灵魂”保留这种共鸣，但不进一步加入原文未说明的灵魂论细节。
- issue: γέρας ψυχῶν ἀμώμων的压缩句法
  choice: 译作“无瑕疵的灵魂会得尊荣”
  alternative: 较形式化地译作“无瑕疵灵魂的尊荣”或将γέρας译为“奖赏”
  rationale: 希腊文直译近于“判断无瑕疵灵魂的尊荣”，关系较压缩；中文补出“会得”以表达评价与归属，但不明确规定尊荣的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个“也不”保留原文οὐδέ反复形成的平行节奏；避免使用带有特定宗派色彩的术语。
