revisions:
- from: 他们不明白他的奥秘[a]，也不盼望虔敬所得的报偿[b]，也不认为无瑕疵的灵魂会得尊荣[c]。
  to: 他们不明白他的奥秘[a]，也不盼望虔敬的奖赏[b]，也不认为无瑕的灵魂配得尊荣[c]。
  rationale: 修订仅澄清原文的压缩句法并改善现代汉语表达：以“配得尊荣”保留κρίνω的评价动作和γέρας的尊荣含义，不将其限定为未来发生；以“虔敬的奖赏”更直接呈现μισθὸν ὁσιότητος。脚注锚点均保留且与相关词语对应。
