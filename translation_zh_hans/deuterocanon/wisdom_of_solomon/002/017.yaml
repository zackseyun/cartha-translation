  text: Let us see whether his words are true[a], and let us test what will happen at his end.
translation:
  language: zh_hans
  text: 让我们看看他的话是否属实，也来检验他最终会有怎样的结局[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的结果会怎样。”希腊语短语可指临到他的结果或终局。
    reason: 保留ἐκβάσις在“结果、结局、终局”之间的词义幅度。
lexical_decisions:
- source_word: ἴδωμεν
  choice: 让我们看看
  rationale: 这是ὁράω的第一人称复数劝勉虚拟式；“让我们看看”既自然，也保留说话者带有挑战意味的提议。
- source_word: οἱ λόγοι αὐτοῦ
  choice: 他的话
  rationale: λόγοι可指言语、说法或主张；“他的话”贴近原文，同时容纳这里所暗含的“主张”之意。
- source_word: ἀληθεῖς
  choice: 属实
  rationale: 该词表示内容真实；“属实”把重点放在他所说的话是否为真，而不是他本人是否诚实。
- source_word: πειράσωμεν
  choice: 也来试验一下
  rationale: πειράζω在此有试验、检验之意；此译保留恶人要以实际遭遇验证义人之言的敌意语气。
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: 他最终会有怎样的结局
  rationale: ἐκβάσις可表示结果、结局或终局。此译以自然中文表达原文略带习语性的结构，同时不把这种最终结果限定为某一种具体的神学事件。
theological_decisions:
- issue: ἐκβάσις与义人所宣称之事的关系
  choice: 他最终会有怎样的结局
  alternative: 他的结果会怎样；他的终局如何
  rationale: 上下文中的说话者企图借义人最后的遭遇来验证他的话。译文保留“最终结果”可能包含的末后意味，却不越过希腊文本，断定某种更具体的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“试验一下”保留原文带有敌意的实际检验意味；“结局”自然表达ἐκβάσις，又不消除其“结果”与“终局”之间的含混。
