base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/018.yaml
  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: zh_hans
  text: 因为义人若是上帝的儿子[a]，上帝必帮助他，救他脱离敌对之人的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的儿子”也可译作“上帝的一个儿子”或“上帝之子”。希腊语在此可以有不同理解；正文保留父子身份的主张，但不预先将其处理为后来的基督论称号。
    reason: 说明无冠词表语 υἱὸς θεοῦ 的真实语法与神学歧义。
lexical_decisions:
- source_word: δίκαιος
  choice: 义人
  rationale: 定冠词加形容词在此作名词用，指上下文中的那位正直之人；“义人”简洁、自然，也保留其道德和宗教含义。
- source_word: υἱὸς θεοῦ
  choice: 上帝的儿子
  rationale: 无冠词的表语结构可表达身份或关系；此译法保留父子关系，却不借大小写或专名化措辞预先赋予后来的基督论称号含义。
- source_word: ἀντιλήμψεται
  choice: 必帮助他
  rationale: 该动词有扶持、援助之意；“帮助”在现代汉语中自然清楚，并与下文“救”形成递进。
- source_word: ῥύσεται
  choice: 救他脱离
  rationale: 该动词表示从危险或敌对势力中解救；“救……脱离”既准确又保留经文语体。
- source_word: ἐκ χειρὸς
  choice: 脱离……的手
  rationale: 保留希腊文表示权势或控制的身体隐喻；汉语圣经语体中易懂，且不必解释性改写为“权势”。
- source_word: ἀνθεστηκότων
  choice: 敌对之人
  rationale: 完成时主动分词指已经站在对立面、与义人为敌的人；该译法保留持续敌对状态，而不限定为法律或军事对手。
theological_decisions:
- issue: υἱὸς θεοῦ是否应译成专名化、明确基督论称号的“上帝之子”
  choice: 上帝的儿子
  alternative: 上帝之子；上帝的一个儿子
  rationale: 希腊文本本身容许身份性或类别性的理解，后世虽可作基督论解读，但本句并不强制专名化。正文保留亲子身份主张，脚注说明其语法歧义。
- issue: ἀντιλήμψεται与ῥύσεται的主语是否应在汉语中明说
  choice: 补出“上帝”作主语
  alternative: 他必帮助他，救他脱离……
  rationale: 希腊语的主语由前句属格 θεοῦ 所指的上帝承接；若机械译作两个“他”，现代汉语会产生严重指代歧义。补出“上帝”属于清晰化隐含主语，不改变命题内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“义人”“脱离……的手”保留可理解的经文语感；为避免连续代词造成误解，明确补出隐含主语“上帝”。
