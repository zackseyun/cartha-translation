base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: zh_hans
  text: 因为他创造万物，是要它们存在；世界所生的一切[a]都有益于生命，其中没有毁灭性的毒物，阴间的统治权也不在地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界所生的一切”也可译作“世界的产物”、“世上的受造物”或“世界的起源”。希腊语表达范围较宽，可指受造界中产生的事物或种类。
    reason: lexical_alternative
  - marker: b
    text: “阴间的统治权”也可译作“阴间的国度”或“阴间的领域”。希腊语可指统治的权势，也可指受统治的境域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: 创造
  rationale: κτίζω表示使某物受造、开始存在；“创造”准确表达神使万有产生的行动。
- source_word: εἰς τὸ εἶναι
  choice: 是要它们存在
  rationale: 保留该结构所表达的目的或结果，突出创造的指向是存在，而不是毁灭。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 简洁而全面地表达一切受造之物，也符合庄重的现代汉语经文语体。
- source_word: σωτήριοι
  choice: 有益于生命
  rationale: 此处与毁灭、阴间相对，表示有助于保存生命、带来健全福祉；这样既保留生命导向，也避免将其限定为后期神学意义上的“救赎”。
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: 世界所生的一切
  rationale: γένεσις复数可指起源、所产生之物或受造的种类。“世界所生的一切”在自然汉语中保留其生成意味及所指范围的宽泛性。
- source_word: φάρμακον ὀλέθρου
  choice: 致人灭亡的毒物
  rationale: φάρμακον在此与有益生命形成对照，宜理解为有害的毒物；“致人灭亡”自然表达ὀλέθρου的毁灭性。
- source_word: ᾅδου βασίλειον
  choice: 阴间的统治权
  rationale: ᾅδης译为“阴间”以保留希腊文本的死亡领域概念；βασίλειον在此可指领域或支配权，“统治权”避免过度具体化为地理王国。
- source_word: ἐπὶ γῆς
  choice: 在地上
  rationale: 自然表达该权势在尘世范围内的所在，同时保留原文的空间意象。
theological_decisions:
- issue: σωτήριοι在创造语境中的含义
  choice: 译作“有益于生命”，表达保存生命、带来福祉
  alternative: “带来拯救”或“有益健康”
  rationale: 上下文将神创造的旨意与毁灭和阴间相对照；本译法保留生命与死亡的张力，而不将词义缩窄为身体健康，也不预先导入明确的救赎教义。
- issue: ᾅδου的表达
  choice: 阴间
  alternative: 坟墓、死亡、冥府
  rationale: 原文明确使用ᾅδης。“阴间”在现代汉语圣经语境中既可理解，又不会把它简化为坟墓或抽象的死亡。
- issue: βασίλειον所指是领域还是权势
  choice: 统治权
  alternative: 国度、领域
  rationale: 该词可表示王国、领域或王权；上下文否认阴间在地上的支配，“统治权”保留这一层意义，同时以脚注承认领域性理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“是要它们存在”明确保留目的意味；“世界所生的一切”兼顾原文生成性表达与汉语自然度；整体维持创造、毁灭与阴间之间的鲜明对照。
