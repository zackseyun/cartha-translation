base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: zh_hans
  text: 因为主的灵已经充满了人所居住的世界；那维系万有的[a]，知晓一切声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那包容万有的”，也可理解为“那位维系万有者”。希腊语原文使用中性分词，可着重表达包容、维持或使万有联结在一起。
    reason: lexical_alternative
  - marker: b
    text: 直译“具有对声音的认识”。这里可指知晓每一个声音或每一句言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: 主的灵
  rationale: “灵”自然承载上帝主动、遍在的临在之意；现代汉语本无大小写之分，因此不借排版预先界定其位格性质。
- source_word: πεπλήρωκεν
  choice: 已经充满了
  rationale: 以“已经……了”表达希腊语完成时所呈现的既成行动及其当前结果。
- source_word: τὴν οἰκουμένην
  choice: 人所居住的世界
  rationale: 保留 οἰκουμένη 所指“有人居住的世界／大地”，避免仅译“世界”而抹去其词汇特点。
- source_word: τὸ συνέχον τὰ πάντα
  choice: 那维系万有的
  rationale: “那……的”对应中性实体化分词，不强行判定其是有位格的“那一位”还是较抽象的维系力量；“维系”能表达 συνέχω 的保持、联结和维持之义。
- source_word: γνῶσιν ἔχει
  choice: 知晓
  rationale: 将字面的“具有知识”按现代汉语习惯译为“知晓”，意思准确而不显生硬。
- source_word: φωνῆς
  choice: 一切声音
  rationale: φωνή 可指声音、嗓音或言语；“一切声音”保留其宽广范围，并以“一切”在普遍性语境中自然表达希腊语单数属格的泛指意义。
theological_decisions:
- issue: πνεῦμα Κυρίου 是否应明确作位格化理解
  choice: 主的灵
  alternative: 主的气息
  rationale: 本句描述其充满世界并知晓声音，采用有神学分量的“灵”更合语境；同时汉语不靠大小写明定其位格，因而保留文本张力。
- issue: τὸ συνέχον τὰ πάντα 是指有位格者还是较抽象的维系者／力量
  choice: 那维系万有的
  alternative: 那位维系万有者；包容万有的
  rationale: 希腊语使用中性实体化分词。“那……的”在汉语中可兼容有位格与非位格的理解，不把它过早明确等同于某一位格，也保留“维系”与“包容”之间的词义空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人所居住的世界”保留原文的具体词义；“万有”维持宇宙性的语域。“那维系万有的”刻意避免以“者”或“那一位”消除原文在位格指称上的含混。
