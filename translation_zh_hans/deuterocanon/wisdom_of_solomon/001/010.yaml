  language: zh_hans
  text: 因为嫉妒的耳朵[a]听见一切，抱怨的声音[b]也无法隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”或译“热忱”。希腊词ζηλώσεως可指嫉妒，也可指热忱或热切的关切。
