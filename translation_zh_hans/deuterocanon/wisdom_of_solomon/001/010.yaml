    reason: lexical_alternative
lexical_decisions:
- source_word: οὖς
  choice: 耳
  rationale: 保留原文以“耳”表现听察的拟人意象；在中文中用“忌邪之耳”构成庄重而简洁的表达。
- source_word: ζηλώσεως
  choice: 忌邪
  rationale: 此词既可表示嫉妒，也可表示热忱；“忌邪”保留其强烈、带道德要求的警醒意味，同时避免现代汉语“嫉妒”通常所含的卑下或恶意色彩。其词义张力在脚注中保留。
- source_word: ἀκροᾶται
  choice: 听见
  rationale: 直接表达听到、听察之意，并与“耳”的意象自然搭配。
- source_word: τὰ πάντα
  choice: 一切
  rationale: 简洁对应原文的全称表达，强调没有任何事能逃过听察。
- source_word: θροῦς
  choice: 声响
  rationale: 该词可指声音、响动，也可指低声传言；“声响”承接本节的听觉意象，又不把音量或传播方式限定得过死。
- source_word: γογγυσμῶν
  choice: 埋怨
  rationale: 该词常指低声嘀咕、发怨言；“埋怨”保留其负面的言语和态度含义。
- source_word: οὐκ ἀποκρύπτεται
  choice: 不能隐藏
  rationale: 保留希腊文的被动意象，强调即使隐秘的怨言也无法被遮掩。
theological_decisions:
- issue: ζηλώσεως所表达的神圣听察性质
  choice: 译作“忌邪”，表现带有道德要求、不能容忍邪恶的警醒听察
  alternative: “嫉妒”或“热忱”
  rationale: 原词容许“嫉妒”和“热忱”两方面含义。正文采用“忌邪”，既保留其尖锐力度，又不把它理解为有罪的猜忌；脚注同时呈现其他可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“忌邪之耳”有意保留原文凝练的拟人隐喻；后半句用“埋怨的声响”延续听觉意象。
