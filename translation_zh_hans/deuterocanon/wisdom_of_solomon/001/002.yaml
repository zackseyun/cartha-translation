  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/002.yaml
  text: because he is found by those who do not test him[b][a], and he reveals himself to those who do not distrust him.
translation:
  language: zh_hans
  text: 因为他被不试探他的人[a]寻见，也向不怀疑他的人[b]显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“试验”。
    reason: lexical_alternative
  - marker: b
    text: “不怀疑他”也可译作“不信他”或“不信任他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，明确表达本句对前文劝勉的原因说明。
- source_word: εὑρίσκεται
  choice: 必寻见
  rationale: 保留被动式“被找到”的基本意义；汉语用“不试探他的人必寻见他”更自然，也不额外解释神如何让人找到。
- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: 不试探他的人
  rationale: πειράζω可指试验、考验或试探；对象为神时，“试探”自然表达以挑衅或验证的态度对待神，同时以脚注保留较中性的“考验”义。
- source_word: ἐμφανίζεται
  choice: 向他们显现
  rationale: 直接保留“显现、变得可见或明显”的意义，避免将其限缩为纯粹内在的启示或认知。
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: 不怀疑他的人
  rationale: ἀπιστέω在此可涉及不信、不信任或缺乏信心；“怀疑”在现代汉语中兼顾认知与关系层面，并以脚注保留“不信任”的可能。
theological_decisions:
- issue: ἀπιστοῦσιν αὐτῷ所表达的是不信、怀疑还是不信任
  choice: 不怀疑他
  alternative: 不信他；不信任他；对他没有信心
  rationale: 原词兼有认知和关系意味。“不怀疑他”避免把经文仅仅解释为理智上承认，也没有把它完全限定为关系上的信任；脚注说明其他可能。
- issue: ἐμφανίζεται是客观显现还是使人认识
  choice: 向他们显现
  alternative: 让他们认识他；向他们启示自己
  rationale: “显现”最贴近原词，并保留神以何种方式使自己显明的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两分句保持希腊文的平行结构；为使汉语主谓关系清楚，第二分句补出“他必”，不增加新的神学含义。
