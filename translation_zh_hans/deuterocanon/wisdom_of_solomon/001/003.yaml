  text: For crooked thoughts separate from God, and when his power is tested, it exposes the foolish.
translation:
  language: zh_hans
  text: 因为乖谬的念头使人与上帝隔绝[a]；他的能力受到考验时，就揭露愚昧人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为乖谬的谋算使人与上帝隔绝。”
    reason: λογισμοί可指念头、推想或谋算；此处保留其较具筹划意味的可能译法。
  - marker: b
    text: 或译：“当这能力受到检验时，就责备愚昧人。”
    reason: δοκιμαζομένη可译作“受到检验”或“受到考验”；ἐλέγχει也可表达揭露、驳斥或责备之意。
lexical_decisions:
- source_word: σκολιοὶ
  choice: 乖谬的
  rationale: 该词指道德上的扭曲、不正，而非单纯的认知错误；“乖谬”庄重而明确。
- source_word: λογισμοὶ
  choice: 念头
  rationale: 此词可指思想、推想或谋算；这里涉及人内在的道德与理性活动，“念头”自然且涵盖面适当。
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: 使人与上帝隔绝
  rationale: 直接表达“从上帝分离”的含义；补出受影响的“人”，使现代汉语句法完整，但不引入额外神学概念。
- source_word: δοκιμαζομένη
  choice: 受到试探时
  rationale: 保留分词被动或中间形式所表达的受检验、受挑战之意，并以时间从句自然呈现。
- source_word: ἡ δύναμις
  choice: 他的能力
  rationale: 希腊文直译为“这能力/能力”，但紧承“上帝”，最自然的所指是上帝的能力；以“他的”明确衔接。
- source_word: ἐλέγχει
  choice: 显明……的真相
  rationale: ἐλέγχω可指揭露、证实有错、责备或定罪；此译突出揭露功能，又不把含义限缩为司法定罪。
- source_word: τοὺς ἄφρονας
  choice: 愚昧人
  rationale: 指缺乏智慧或明辨的人；“愚昧人”符合智慧文学语体，也比口语性的辱骂表达庄重。
theological_decisions:
- issue: ἡ δύναμις的所指
  choice: 理解为上帝的能力，译作“他的能力”
  alternative: 保留为非特指的“能力”
  rationale: 前句刚提到上帝，因此该能力归属于上帝是最自然的篇章衔接；代词只是明确所指，并未增加新的神学主张。
- issue: ἐλέγχει在能力受试探语境中的语力
  choice: 译为“显明愚昧人的真相”
  alternative: “定愚昧人的罪”或“责备愚昧人”
  rationale: 原词兼有揭露、驳倒、责备和定罪等含义；正文采用较宽的“显明”，保留神圣能力揭穿愚昧的张力，脚注列出较强的可能译法。
- issue: δοκιμαζομένη所表达的关系
  choice: 按时间关系译为“受到试探时”
  alternative: “被检验的能力”或“经过验证的能力”
  rationale: 分词可表达能力受到检验或挑战；时间从句既通顺，也不把它解释成能力需要被证明才真实。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“乖谬”“隔绝”“愚昧人”保留伦理与神学分量；以分号呈现希腊文两个并列分句之间紧密的因果推进。所有脚注标记均已置于正文相应位置。
