  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/013.yaml
  text: For God did not make death[a], nor does he delight in the destruction of the living;
translation:
  language: zh_hans
  text: 因为上帝没有造出死亡[a]，也不以生者的毁灭为乐；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“创造死亡”。希腊语动词既可译作“造出”，也可译作“创造”；正文采用较直接且不过度限定的“造出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明其理由；现代汉语中“因为”能自然保留原文的因果或解释功能。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直接译出带冠词的主语，符合现代标准普通话的圣经语体。
- source_word: θάνατον
  choice: 死亡
  rationale: 保留抽象名词，不解释为某一种具体死亡或死亡过程。
- source_word: οὐκ ἐποίησεν
  choice: 并没有造
  rationale: ποιέω可表示“制造、造出”；“造”紧扣原文，又不像“创造”那样额外强化宇宙论意味。
- source_word: οὐδὲ
  choice: 也不
  rationale: 自然连接第二个否定分句，并保留递进并列关系。
- source_word: τέρπεται
  choice: 以……为乐
  rationale: 准确传达享受、喜悦之意，同时保持庄重而自然的汉语表达。
- source_word: ἐπʼ ἀπωλείᾳ
  choice: 以……的毁灭为乐
  rationale: ἀπώλεια表示毁灭、灭亡或败亡；“毁灭”保留结果性的强烈含义，且不把它窄化为死亡本身。
- source_word: ζώντων
  choice: 活物
  rationale: 该实词化现在分词泛指活着的存在者；“活物”简洁保留其广泛范围，不武断限定为人类。
theological_decisions:
- issue: 如何翻译关于上帝与死亡关系的ἐποίησεν
  choice: 并没有造死亡
  alternative: 并没有创造死亡
  rationale: “造”较贴近ποιέω的一般含义，并保留死亡并非出于上帝制造这一主张，同时避免将经文进一步具体化为一套创造论论断。
- issue: ζώντων所指范围是否限定为人
  choice: 活物
  alternative: 活着的人；生者
  rationale: 希腊文为泛指“活着者”的复数分词，未明确限定为人；采用“活物”保留原文可能涵盖一切有生命者的开放范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”保留与上文的解释关系；“以……为乐”兼顾原文的情感力度与汉语自然度。分号依照本节与后文相连的篇章走势。
