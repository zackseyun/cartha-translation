base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/008.yaml
  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: zh_hans
  text: 因此，任何说不义之言的人都无法逃过察觉[a]；定罪的公义也不会越过他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任何说不义之言的人都不会逃过注意。”
    reason: lexical_alternative
  - marker: b
    text: “公义”也可理解为拟人化的审判：“施行定罪的审判也不会越过他。”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 作为推论连接语，承接上文，现代汉语中简洁自然。
- source_word: φθεγγόμενος ἄδικα
  choice: 口出不义之言的人
  rationale: 将现在分词与中性复数宾语合译，既保留言说行为，也保留 ἄδικα 的道德与司法语义范围。
- source_word: οὐδεὶς μὴ λάθῃ
  choice: 谁也不能隐而不显
  rationale: 表达带 μή 和虚拟式的强烈否定，并体现 λανθάνω“逃过察觉、保持隐蔽”的含义。
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: 也不会从他身旁越过
  rationale: 保留 παροδεύω“经过、越过”的空间隐喻，同时在语境中传达不会放过他的意思。
- source_word: ἐλέγχουσα
  choice: 揭露罪过的
  rationale: ἐλέγχω 可指揭露、责备或定罪；此译保留其使过错显明并加以指证的作用，而不把含义限缩为法院判决。
- source_word: ἡ δίκη
  choice: 公义
  rationale: δίκη 在此可指公义、审判或拟人化的司法力量；“公义”保留道德秩序与司法行动之间的张力。
theological_decisions:
- issue: 如何呈现 ἄδικα 与 δίκη 之间同属 dik- 词族的道德—司法呼应
  choice: 正文采用“不义之言”与“公义”
  alternative: “不公正的话”与“审判”
  rationale: “不义／公义”在汉语中形成清晰呼应，并同时涵盖伦理与司法层面；避免将本节只解释为世俗法律程序。
- issue: 是否将 δίκη 明确定为人格化的审判者
  choice: 保留拟人化表达，但不明说其为某一位格
  alternative: 译作“定罪的审判”或“惩罚”
  rationale: 希腊文以主动分词修饰 δίκη，具有拟人化色彩；正文让“公义”执行揭露行动，既保存这一修辞，也不额外引入特定神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“隐而不显”略带典雅色彩，用以简洁表达“逃过察觉”；第二分句保留原文“越过”的形象，并以“揭露罪过”呈现 ἐλέγχουσα 的开放语义。
