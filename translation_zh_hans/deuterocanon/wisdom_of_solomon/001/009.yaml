base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/009.yaml
  text: For an inquiry will be made into the schemes of the ungodly[c][b][a], and a report of his words will come to the Lord for the exposing of his lawless deeds.
translation:
  language: zh_hans
  text: 因为，必会查究不敬虔之人的谋算[a]；他的话也必传到主面前[b]，以揭露他的不法行为[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋算”也可译作“计划”“商议”或“筹划”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“他话语的听闻将来到主面前”；意思是他所说的话必被主听见，来到主面前。
    reason: lexical_alternative
  - marker: c
    text: “揭露”也可译作“指证”“责备”或“判明有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβουλίοις
  choice: 谋算
  rationale: 该词可指商议、筹划或所定的计划；在“不敬虔之人”的语境中，“谋算”既保留筹划之意，也自然带出负面的语境色彩，但不把恶意说得超过原文。
- source_word: ἀσεβοῦς
  choice: 不敬虔之人
  rationale: 保留该词针对上帝的宗教—道德含义，并按希腊文单数形式表达其泛指用法。
- source_word: ἐξέτασις
  choice: 查究
  rationale: 表达仔细审查、调查的司法性色彩；“必受查究”在现代汉语中简洁自然。
- source_word: λόγων
  choice: 话
  rationale: 忠实保留 λόγος 在此处对言语的宽泛指称，并与上下文对人所说之话的关注相符。
- source_word: ἀκοὴ
  choice: 传到
  rationale: ἀκοή 字面与“听见、听闻”有关；结合 ἥξει，句意是此人的话会进入主的听闻、到达主面前。正文用“传到”表达这一动态，脚注保留字面意象。
- source_word: Κύριον
  choice: 主
  rationale: 按智慧文学及七十士译本中的通常神圣称谓译为“主”，不额外补入专名。
- source_word: ἔλεγχον
  choice: 揭露
  rationale: 该词可指揭露、驳斥、责备或定罪；“揭露”保留使违法之事显明的证据性含义，同时避免提前把它限定为最终判罪。
- source_word: ἀνομημάτων
  choice: 违法行为
  rationale: 该复数名词指违反律法或法则的具体行为；“违法行为”清楚保留其行为性和复数集合意义。
theological_decisions:
- issue: ἀσεβοῦς 与 αὐτοῦ 的泛指单数
  choice: 用单数“不敬虔之人……他”表达
  alternative: 改用复数“不敬虔的人……他们”，或省去全部代词
  rationale: 希腊文以单数泛指一个不敬虔的人。中文的“之人”及“他”可自然保留这一语法形式；这里的阳性单数是源文的泛指表达，并非断言只有男性在所指范围内。
- issue: ἔλεγχον 的审判色彩
  choice: 译为“揭露”
  alternative: 译为“责备”“指证”或“定罪”
  rationale: 原词兼有显明、反驳、责备和判明有罪等可能。正文选“揭露”以保留违法行为被显明的核心，同时不把含义收窄为某一种司法程序；其他可能见脚注。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必受查究”保留审查意味；分号呈现希腊文两个并列分句。措辞避免文言化过重，也不将含义限定为特定宗派的审判论解释。
