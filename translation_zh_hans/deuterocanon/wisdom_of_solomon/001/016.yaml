base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/016.yaml
  text: But the ungodly[a], with their hands and their words, called for him; considering him a friend, they wasted away, and they made a covenant with him[c][b], because they are worthy to belong to his portion.
translation:
  language: zh_hans
  text: 但不敬虔的人以手和言语召唤他[a]；他们把他视为朋友，渐渐衰亡，又与他立约[b]，因为他们配得归在他那一份里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指上文被人格化的“死亡”（参1:12—15）。
    reason: cross_reference
  - marker: b
    text: “与他立约”也可译作“与他订立盟约”。
    reason: lexical_alternative
  - marker: c
    text: “归在他那一份里”也可译作“归在他的份内”或“与他同分”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 保留该词对神缺乏敬畏的宗教—道德含义，比泛指行为恶劣的“恶人”更贴近原文。
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: 用双手和言语
  rationale: 保留“手”与“言语”的具体并列意象，同时符合现代汉语表达。
- source_word: προσεκαλέσαντο αὐτόν
  choice: 把他召来
  rationale: 中间语态含有召到自己这里、主动招引的意味；“召来”简洁保留这一方向性。
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: 把他视为朋友
  rationale: 准确表达ἡγέομαι带宾语补足语的“视为”，并保留把死亡人格化为朋友的反讽。
- source_word: ἐτάκησαν
  choice: 渐渐衰亡
  rationale: 该动词带有融化、消损、衰败之意；“渐渐衰亡”既保留消损过程，也与死亡语境相合，而不额外规定其原因。
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: 与他立约
  rationale: συνθήκη指正式而具约束力的协议；“立约”保留其庄重性及与死亡结盟的强烈反讽。
- source_word: ἄξιοί εἰσιν τῆς ἐκείνου μερίδος εἶναι
  choice: 他们配归入他的份中
  rationale: “配”贴近ἄξιοι的配得、相称之意；“归入他的份中”保留μερίς所表达的份额、归属或所得之分。
theological_decisions:
- issue: 本节多次出现的阳性代词αὐτόν所指为何
  choice: 正文保留“他”，脚注说明所指是上文人格化的“死亡”
  alternative: 在正文中直接译作“死亡”
  rationale: 希腊文本本节使用代词，而1:12—15提供其先行对象。保留代词可维持篇章衔接和人格化效果，脚注则避免读者误解。
- issue: συνθήκη是否采用圣约色彩较强的措辞
  choice: 译作“立约”
  alternative: 译作“订立盟约”或“达成协议”
  rationale: 这里并非神所立的约，但原词具有正式、郑重且具约束力的结盟意味；“立约”能保留这种庄重性及其反讽，而不把它解释为某种特定教义上的圣约。
- issue: ἄξιοί εἰσιν的语气
  choice: 译作“他们配……”
  alternative: 译作“他们理当……”或“他们值得……”
  rationale: “配”保持原文关于相称或配得的判断及其尖锐反讽，不明确断定这是自我宣称还是叙述者裁断。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留“手”和“言语”的具体意象、死亡的阳性人格化代词以及“立约”的反讽力度；避免以解释性增译消除“渐渐衰亡”与周边分句之间的语义张力。
