base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: zh_hans
  text: 因为训诲的圣洁之灵必躲避诡诈[a]，远离愚昧的思量；不义临近时[c]，它就必受责斥[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲的圣洁之灵”也可理解为“施行训诲的圣灵”。希腊语没有冠词，因此既可作性质性的表述，也可理解为专称。
    reason: alternative_reading
  - marker: b
    text: “受责斥”也可译作“被揭露”或“被证实有错”。
    reason: lexical_alternative
  - marker: c
    text: “不义临近时”也可译作“不公来到时”或“不义临到时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: 圣洁之灵
  rationale: 希腊语没有冠词，可按性质理解为“圣洁之灵”，不宜在正文中径自确定为专名“圣灵”；同时保留其神圣位格化色彩。
- source_word: παιδείας
  choice: 训诲的
  rationale: παιδεία兼有教导、训练和纠正之意。“训诲”比单纯“教导”更能保留道德塑造与规正的内涵，又比“管教”稍宽。
- source_word: φεύξεται
  choice: 必躲避
  rationale: 保留φεύγω鲜明的逃避、远避动作；“必”表达将来时在格言语境中的确定性。
- source_word: δόλον
  choice: 诡诈
  rationale: δόλος指欺骗、奸诈或诡计；“诡诈”在现代汉语中简洁而庄重，也保留其道德意味。
- source_word: ἀπαναστήσεται
  choice: 远离
  rationale: 该复合动词含起身离开、退离之意。汉语“远离”自然地表达与愚昧思量断开并离去，避免生硬直译为“起身离开”。
- source_word: λογισμῶν ἀσυνέτων
  choice: 愚昧的思量
  rationale: λογισμοί可指思想、推理或盘算，ἀσύνετος指缺乏明悟。“思量”比“思想”更能包含思考与谋划，“愚昧”则保留其道德和认知层面的不足。
- source_word: ἐλεγχθήσεται
  choice: 必受责斥
  rationale: ἐλέγχω可指责备、驳斥、定罪或揭露。被动式译作“受责斥”贴近其核心语义，同时在脚注保留“被揭露／被证实有错”等可能。
- source_word: ἐπελθούσης ἀδικίας
  choice: 不义临近时
  rationale: 属格独立结构表达伴随情境；ἐπέρχομαι有来到、逼近或临到之意，ἀδικία兼指不义与不公。正文采用较广的道德性“不义”，并以“临近”避免擅自补定其所临到的对象。
theological_decisions:
- issue: ἅγιον ... πνεῦμα是否应直接译为专名“圣灵”
  choice: 训诲的圣洁之灵
  alternative: 施行训诲的圣灵／管教的圣灵
  rationale: 原文无冠词，既可作性质性表述，也可能指上帝的圣灵。正文不以固定专名预先解决此歧义，脚注则明示另一种读法。
- issue: ἀδικία应译为“不义”还是“不公”
  choice: 不义
  alternative: 不公／不正义
  rationale: 本段重点是诡诈、愚昧思量与圣洁之灵的不相容，“不义”能涵盖较广的道德和宗教含义；“不公”仍属可能读法。
- issue: 末句被动式所表达的神学张力
  choice: 它就必受责斥
  alternative: 它就必被揭露／被证实有错
  rationale: 依语法延续以“圣洁之灵”为主语，不因“圣洁之灵受责斥”显得突兀而改换主语或重写逻辑；以脚注保留ἐλέγχω的其他语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以两个并列分句保留希腊文的递进节奏；用“它”明确后半句仍承接“圣洁之灵”，但不将该短语强行专名化。所有词义和神学歧义均由正文与脚注共同保留。
