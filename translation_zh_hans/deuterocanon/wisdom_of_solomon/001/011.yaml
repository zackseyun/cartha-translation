base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: zh_hans
  text: 所以，你们要谨防无益的怨言，约束舌头，不要毁谤；因为暗中的话绝不会徒然传出[a]，说谎的口会毁灭灵魂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暗中的话绝不会毫无后果地传出。”希腊文直译近于“不会空空地出去”，强调隐秘的话仍会产生作用和后果。
    reason: lexical_alternative
  - marker: b
    text: “灵魂”也可译作“生命”或“人”。希腊词ψυχή可有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε
  choice: 要谨防
  rationale: 该词是带反身意味的不定过去时中间语态命令式，要求听者主动保护自己、远离所说之事；“要谨防”既保留警戒和命令语气，也符合现代汉语表达。
- source_word: τοίνυν
  choice: 所以
  rationale: 此词承接上文并引出推论；“所以”自然地表达这种推论关系。
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: 无益的怨言
  rationale: γογγυσμός指低声抱怨、发怨言，ἀνωφελής指无益、无用；“无益的怨言”保留名词结构及其道德批评意味。
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: 约束舌头，不要毁谤
  rationale: φείδομαι在此有克制、避免之意，καταλαλιά指毁谤或背后中伤。译文保留“舌头”的身体意象，同时用“不要毁谤”清楚表达所禁戒的言语行为。
- source_word: φθέγμα λαθραῖον
  choice: 暗中的话
  rationale: φθέγμα指发出的声音或话语，λαθραῖον指隐秘、暗中；“暗中的话”简洁自然，并保留秘密言谈的含义。
- source_word: κενὸν οὐ πορεύεται
  choice: 绝不会徒然传出
  rationale: 原文直译近于“不会空空地出去”，意指暗中的言语不会毫无作用或后果。“徒然传出”保留行进隐喻及结果层面的含混，脚注予以说明。
- source_word: στόμα ... καταψευδόμενον
  choice: 说谎的口
  rationale: 分词καταψευδόμενον表示说假话或撒谎；“说谎的口”保留原文凝练的箴言式身体意象。
- source_word: ἀναιρεῖ ψυχήν
  choice: 毁灭灵魂
  rationale: ἀναιρέω可指除掉、毁灭或杀死；“毁灭”保留严重性，又不把含义限定为肉身死亡。
- source_word: ψυχήν
  choice: 灵魂
  rationale: ψυχή可指灵魂、生命或人本身；正文采用“灵魂”以保留智慧文学语境中的道德与属灵分量，同时在脚注中保留其他词义可能。
theological_decisions:
- issue: 末句ψυχή的所指
  choice: 正文译作“灵魂”
  alternative: “生命”或“人”
  rationale: ψυχή的语义范围包括灵魂、生命和人。译作“灵魂”能保留原文警告所具有的深层道德重量，但不排除该句也可理解为虚谎危害生命或毁掉一个人，因此以脚注保留张力。
- issue: 暗中言语“不会空空出去”的含义
  choice: 译作“绝不会徒然传出”
  alternative: “绝不会毫无后果地传出”
  rationale: 原文没有明说言语产生何种后果。正文保留“徒然”这一较开放的表达，避免将隐喻完全解释化；脚注说明其可能强调隐秘言语仍有作用和后果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨防”“怨言”“毁谤”保持智慧文学劝诫的凝练语气；分号呈现前后两组劝诫与理由之间的结构。脚注标记均置于其实际说明的词句之后，以避免来源咨询层中标记与注释内容错位的问题。
