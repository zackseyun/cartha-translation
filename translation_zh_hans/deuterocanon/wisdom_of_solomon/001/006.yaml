base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: zh_hans
  text: 因为智慧是爱世人的灵；它不会因亵渎者口中所出的话而宣告其无罪[a]。因为上帝是洞悉他肺腑的见证者，是确实鉴察他内心的，也是听见他舌头所说之言的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译近于“从他的嘴唇”，句式较为压缩；这里按因果意味理解，指他口中所说的话使他不能被判为无罪。
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: 爱世人的
  rationale: 表达对人类的慈爱与善意，保留其主动意味，又避免“人道的”等可能削弱人格化色彩的说法。
- source_word: πνεῦμα σοφία
  choice: 智慧是……的灵
  rationale: 保留希腊文中“智慧”与“灵”的直接表述，不将其明确等同于圣灵，也不消除智慧在本节中的人格化。
- source_word: οὐκ ἀθῳώσει
  choice: 不会……宣告他无罪
  rationale: 保留动词的司法语气，准确表达不判定为无罪、不予开脱之意。
- source_word: βλάσφημον
  choice: 亵渎者
  rationale: 保留原词在宗教和道德层面的分量，不弱化为一般的失言者。
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: 因……口中所出的话
  rationale: 按上下文取因果意味，并以现代汉语自然表达嘴唇所发出的言语；脚注说明原文的压缩形式。
- source_word: τῶν νεφρῶν αὐτοῦ
  choice: 他的肺腑
  rationale: “肺腑”是现代汉语仍可理解的内在自我意象，既传达隐秘内心，又比直译“肾脏”自然，并避免把含义收窄为单一的“动机”。
- source_word: μάρτυς
  choice: 见证者
  rationale: 保留司法语境，并与后面的鉴察、聆听构成平行。
- source_word: ἐπίσκοπος ἀληθής
  choice: 真实的鉴察者
  rationale: 突出上帝洞察内心且其鉴察真实可靠，避免采用带有教会职衔意味的译法。
- source_word: τῆς καρδίας αὐτοῦ
  choice: 他的内心
  rationale: “内心”在现代汉语中自然表达思想、意志与情感的中心。
- source_word: τῆς γλώσσης ἀκουστής
  choice: 他舌头的聆听者
  rationale: 保留“舌头”的身体意象以及与“见证者”“鉴察者”相平行的名词结构。
theological_decisions:
- issue: πνεῦμα σοφία是否明确指圣灵
  choice: 译作“智慧是爱世人的灵”，不加“圣”字。
  alternative: 智慧就是圣灵；智慧具有仁爱的心灵。
  rationale: 希腊文把智慧表述为“灵”并加以人格化，但本节本身没有明确要求将其等同于圣灵；此译保留原有的神学张力。
- issue: τῶν νεφρῶν αὐτοῦ所指的内在人性层面
  choice: 正文译作“他的肺腑”，脚注交代字面为“肾脏”。
  alternative: 他的肾脏；他的内在动机；他的内在生命。
  rationale: 原意涵盖隐秘的内在自我，若只译“动机”可能过度限定义项；“肺腑”兼顾可读性、意象与语义宽度。
- issue: ἀπὸ χειλέων αὐτοῦ与定罪之间的关系
  choice: 按因果意味译作“因……口中所出的话”。
  alternative: 更贴近形式地译作“从他的嘴唇”；或译作“不会让亵渎者从自己的嘴唇逃脱罪责”。
  rationale: 介词短语十分简练，因果理解最符合上下文，但脚注保留其形式上的压缩与其他表达可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宣告他无罪”保留司法语气；“肺腑”保持圣经式身体意象而不显生硬。三个称谓“见证者—鉴察者—聆听者”尽量重现希腊文的平行结构。
