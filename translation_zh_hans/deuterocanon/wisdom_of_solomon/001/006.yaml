revisions:
- from: 因为智慧是爱世人的灵，不会因亵渎者口中所出的话而宣告他无罪[a]；因为上帝是他肺腑的见证者[b]，是他内心真实的鉴察者，也是他舌头的聆听者。
  to: 因为智慧是爱世人的灵；它不会因亵渎者口中所出的话而宣告其无罪[a]。因为上帝是洞悉他肺腑的见证者，是确实鉴察他内心的，也是听见他舌头所说之言的。
  rationale: 修订仅处理汉语搭配和指代清晰度：以“洞悉他肺腑的见证者”表达上帝见证并知悉隐秘内在的含义；将“聆听者”改为自然的“听见……所说之言的”，并维持希腊文“见证者—鉴察者—听者”的平行。脚注b保留，且应将其锚点置于正文“肺腑”之后。
