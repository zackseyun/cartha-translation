base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: zh_hans
  text: 因为智慧不会进入图谋恶事的灵魂[a]，也不会住在受罪辖制的身体里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“善于作恶的”“诡诈的”；原词更直译为“精于恶事的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“服在罪下的”“欠罪债的”。原词可表示负有债务、责任，或处于某种权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: 图谋恶事的
  rationale: 该词含有“善于作恶、策划恶事”的意味；译作“图谋恶事的”既保留构词所含的谋划色彩，也自然地表达其道德贬义。
- source_word: ψυχὴν
  choice: 灵魂
  rationale: 原文与后面的“身体”形成明确对照；“灵魂”保留这一文学和人论层面的张力，不进一步界定二者关系。
- source_word: εἰσελεύσεται
  choice: 会进入
  rationale: 保留原文“进入”的空间意象，并以“不会”自然表达否定将来式。
- source_word: σοφία
  choice: 智慧
  rationale: 智慧文学中的标准对应词，清楚而庄重。
- source_word: κατοικήσει
  choice: 住在
  rationale: 表达持续居住，与前面的“进入”构成递进；现代汉语自然，同时保留原文意象。
- source_word: σώματι
  choice: 身体
  rationale: 直接对应原词，并保留与“灵魂”的对照。
- source_word: κατάχρεῳ
  choice: 受……辖制的
  rationale: 该词可指负有债务、处于义务或权势之下；“受罪辖制”传达罪对人的控制，同时不像“被罪奴役”那样过度限定隐喻。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 直接保留原文属格名词的道德和神学分量，不抽象化为“罪性”。
theological_decisions:
- issue: 灵魂与身体的对照
  choice: 分别译作“灵魂”和“身体”
  alternative: 将 ψυχή 译作“内心”或“人”
  rationale: 希腊文明确并列 ψυχή 与 σῶμα。译文保留两者的区别，却不据此建立超出本节的二元人论。
- issue: κατάχρεῳ ἁμαρτίας 的力度与隐喻
  choice: 受罪辖制的
  alternative: 欠罪债的；服在罪下的；被罪奴役的
  rationale: 原词兼有负债、受制或负有义务的语义可能。“受罪辖制”在现代汉语中清楚表达罪的支配力，又以脚注保留“负债”等较贴近字面的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“图谋恶事”保留 κακότεχνον 的谋划意味；“住在”自然呈现持续居住的意象。脚注标记均置于其所说明的短语之后。
