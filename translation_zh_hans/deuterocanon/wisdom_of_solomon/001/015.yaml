lexical_decisions:
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”在现代中文圣经语体中可兼具道德上的正直与公正之意，能够保留原词在伦理和神学层面的宽广含义；“正义”作为可能的侧重在脚注中注明。
- source_word: γάρ
  choice: 因为
  rationale: 该连词承接上文并说明理由；“因为”自然、清楚地表达其解释或论证功能。
- source_word: ἀθάνατος
  choice: 不死的
  rationale: 原词表示不受死亡辖制或不会死亡；“不死的”简洁直译，并保留格言式表达。
- source_word: ἐστιν
  choice: 是
  rationale: 按原文保留简单系词结构，不作无根据的扩充。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 正义
  rationale: 原词既可指道德上的义，也可指公正、正义。本节语境具有广泛的伦理与神学意味，因此正文采用涵盖面较广的“义”，同时以脚注保留“正义”这一合理译法。
- issue: “义是不死的”的所指
  choice: 保留原文的拟人化和简约陈述
  alternative: 扩译为“行义的人必得永生”或“正义永存”
  rationale: 希腊文直接断言δικαιοσύνη本身“是不死的”，没有明说行义之人的结局，也没有使用“永存”一词；因此不把潜在含义写入正文，以保留神学张力。
