base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: zh_hans
  text: 你们这些审判大地的人啊[b]，要爱公义[a]；要怀着良善思念主，并以专一的心[c]寻求他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希腊语δικαιοσύνη既可指公义，也可指正义；本节对审判大地的人说话，因此“正义”尤其切合语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“你们这些统治大地的人”。原文直译为“审判大地的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“真诚的心”。希腊语这一表达指不分裂、坦率真诚的心。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: 要爱
  rationale: 该词是ἀγαπάω的不定过去时命令式；“要爱”直接、自然地保留了劝命的力度。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: δικαιοσύνη兼有道德正直与公平正义的含义。“公义”保留其较广的伦理和宗教内涵，同时以脚注注明“正义”这一切合语境的译法。
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: 你们这些审判大地的人
  rationale: 直译希腊文“审判大地的人”，不把其身份径直限定为统治者；“大地”保留γῆ较广的范围。
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: 要……思念主
  rationale: φρονέω在此表示思想、留心或存某种心意；“思念主”在现代汉语中自然，也保留了持续关注和思想主的意味。
- source_word: ἐν ἀγαθότητι
  choice: 怀着良善
  rationale: ἀγαθότης表示良善或正直的品性；“怀着良善”清楚表达思想主时应有的内在态度。
- source_word: ἐν ἁπλότητι καρδίας
  choice: 以专一的心
  rationale: ἁπλότης可指单纯、真诚或不分心。“专一的心”既保留“心”的意象，也表达不分裂、坦诚的内在状态。
- source_word: ζητήσατε αὐτόν
  choice: 寻求他
  rationale: ζητέω的不定过去时命令式；“寻求他”简洁自然，并保留原文恳切追寻的意味。
theological_decisions:
- issue: δικαιοσύνη的含义范围
  choice: 公义
  alternative: 正义
  rationale: “公义”较能涵盖道德正直与公平正义；鉴于本句直接对审判大地的人说话，“正义”也很切合上下文，故列入脚注而不消除原词的多义性。
- issue: οἱ κρίνοντες τὴν γῆν所指的人
  choice: 审判大地的人
  alternative: 大地的统治者
  rationale: 这些人很可能是君王、官长或统治者，但希腊文明确使用“审判”这一分词，因此正文保留其字面表达，脚注注明可能的身份含义。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在本书的神学语境中，“主”是自然且恰当的译法；上下文没有理由将其缩窄为一般意义的“主人”。
- issue: ἁπλότης καρδίας的内涵
  choice: 专一的心
  alternative: 真诚的心
  rationale: 原表达可强调内心不分裂，也可强调坦率真诚；正文采用“专一”保留其整体性意象，并在脚注保存“真诚”的可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文两个命令句的推进关系；“审判大地的人”刻意保留希腊文措辞及其可能的政治含义，“怀着良善”和“专一的心”则力求兼顾自然表达与原文内在品格的意象。
