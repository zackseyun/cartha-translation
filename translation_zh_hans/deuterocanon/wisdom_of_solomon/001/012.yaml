base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/012.yaml
  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: zh_hans
  text: 不要因你们生活中的迷误而追求死亡[a]，也不要因你们双手所做的事[b]给自己招来毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追求”所译的希腊语也可表示“热切渴望”或“热心于”。
    reason: lexical_alternative
  - marker: b
    text: “双手所做的事”可泛指人的行为，也可能使人联想到亲手制造之物。
    reason: cultural_note
lexical_decisions:
- source_word: ζηλοῦτε
  choice: 追求
  rationale: 该动词可表示热切向往、渴求或积极追逐；以“追求”表达主动趋向死亡的警告，同时避免把它弱化为单纯的愿望。
- source_word: θάνατον
  choice: 死亡
  rationale: 直接对应原文宾语，清楚而庄重。
- source_word: ἐν πλάνῃ ζωῆς ὑμῶν
  choice: 因你们人生的迷误
  rationale: πλάνη可指迷误、迷失或谬误；“人生的迷误”既保留其与生活道路有关的含义，也让ἐν在此可能具有的凭借或原因意味自然呈现。
- source_word: ἐπισπᾶσθε
  choice: 给自己招来
  rationale: 保留中间语态所表达的自我牵连：人因自己的作为把毁灭带到自己身上。
- source_word: ὄλεθρον
  choice: 毁灭
  rationale: 表达彻底、灾难性的败亡，又不额外加入后期神学术语的特定含义。
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: 因你们双手所做的事
  rationale: 保留“双手”这一具体意象，同时用现代汉语说明其可泛指人的行为，也可能让人联想到亲手制造之物。
theological_decisions:
- issue: ζηλοῦτε应译为字面的“热心于死亡”，还是译出语境中的主动趋向
  choice: 追求死亡
  alternative: 渴求死亡；切慕死亡；热心于死亡
  rationale: “追求死亡”在现代汉语中自然地传达主动趋向或寻求死亡，保留劝诫的力度而不把词义限定为情绪上的渴望。
- issue: 如何表达ἐπισπᾶσθε的中间语态
  choice: 给自己招来毁灭
  alternative: 招致毁灭；把毁灭拉到自己身上
  rationale: 所选译法清楚保留主体因自身行为而使毁灭临到自己的反身含义。
- issue: ἔργοις χειρῶν ὑμῶν是否特指偶像
  choice: 保留为“你们双手所做的事”
  alternative: 你们的行为；你们亲手制造的偶像
  rationale: 原文没有明说偶像；保留具体措辞，可兼容一般行为与人手所造之物的潜在回响，不作教义性限缩。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保持原文两项并列禁令；“人生的迷误”保留生活道路与错误、迷失之间的张力，“给自己招来”则明确呈现原文的反身意味。
