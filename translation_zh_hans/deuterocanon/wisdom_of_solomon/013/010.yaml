revisions:
- from: 但那些人实在可悲[a]！他们的希望寄于死者之中；他们竟把人手所造的称为神明：金银制品、技艺精心制成之物、动物的形像，或一块无用的石头[b]，都是古人之手的作品。
  to: 可悲的是，他们的盼望竟在死者之中[a]；他们把人手所造的——金银、精工制成之物、动物的像，或一块出自古人之手的无用石头[b]——称作神。
  rationale: 修订主要纠正原文句法范围：古老之手所作的是“无用的石头”，不是前列的一切物件。其余调整旨在提升现代汉语的流畅度，并保留ἐν νεκροῖς的刻意歧义和原文对人造偶像的批判语气。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:33:43Z'
