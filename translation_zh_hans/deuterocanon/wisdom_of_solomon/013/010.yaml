base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: zh_hans
  text: 可悲的是，他们的盼望竟在死者之中[a]；他们把人手所造的——金银、精工制成之物、动物的像，或一块出自古人之手的无用石头[b]——称作神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的盼望竟在死者之中”也可译作“他们的盼望寄托在死物上”或“他们的盼望与死人同在”。希腊文十分凝练，可能有意同时让人想到无生命的偶像和与死亡相连的虚妄。
    reason: alternative_reading
  - marker: b
    text: “出自古人之手”也可能指一尊很久以前雕成的石像，强调它虽年代久远，却仍只是人手所造。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταλαιπώροι
  choice: 实在可悲
  rationale: 既保留谴责与悲惨意味，又符合现代汉语表达；“实在”传达希腊文句首的强调语气。
- source_word: ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν
  choice: 他们的希望寄于死者之中
  rationale: 尽量保留介词结构与“死者／死物”之间的凝练歧义，不直接限定为偶像或阴间。
- source_word: οἵτινες ἐκάλεσαν θεοὺς
  choice: 他们竟把……称为神明
  rationale: 保留“称为”的直接动词意义；“竟”自然呈现原句谴责性的反差。
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: 人手所造的
  rationale: 保留圣经传统中“人手所造”的反偶像意象，同时清楚表达泛指人类。
- source_word: τέχνης ἐμμελέτημα
  choice: 技艺精心制成之物
  rationale: ἐμμελέτημα含经技艺用心加工、精心制作之意；此译兼顾工艺性与人的制作活动。
- source_word: ἀπεικάσματα ζώων
  choice: 动物的形像
  rationale: 直接表达动物的摹像或表象；采用庄重而易懂的“形像”。
- source_word: λίθον ἄχρηστον
  choice: 一块无用的石头
  rationale: 准确保留ἄχρηστος“无用、派不上用场”的讽刺力度，避免译成偏重价格判断的“无价值”。
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: 古人之手的作品
  rationale: 将ἀρχαίας理解为年代久远之手，即古人之手；保持其仅为人造物的论辩重点，同时以脚注说明结构上的可能理解。
theological_decisions:
- issue: “他们的希望寄于死者之中”所指为何
  choice: 保留“死者之中”的意象，不明确限定所指
  alternative: “他们的希望寄托在死物上”或“他们的希望与死人同在”
  rationale: 希腊文ἐν νεκροῖς简短而多义，可能同时唤起无生命偶像和与死亡相连的虚妄；正文不应消解这种神学张力。
- issue: “人手所造”的性别范围
  choice: 译为泛指全人类的“人手”
  alternative: “男人的手所造”
  rationale: ἀνθρώπων在此泛指人类，并非特指男性；“人手所造”也保留了传统的反偶像措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文用分号和冒号理清希腊文长句的谴责与列举关系；保留“希望寄于死者之中”的陌生意象，以脚注呈现真实歧义。
