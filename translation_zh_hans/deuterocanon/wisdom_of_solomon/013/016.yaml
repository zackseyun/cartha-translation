base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: zh_hans
  text: 所以，为了不让它倒下，他预先为它作了安排，因为他知道它不能帮助自己；它毕竟是个像[a]，本身还需要帮助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偶像”。希腊语直译为“像”或“形像”，但这里所说的是人手制作、供人敬拜的物件。
    reason: 说明εἰκών的字面意义与反偶像语境中的可选译法。
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: 所以，为了不让它倒下
  rationale: ἵνα与μή及虚拟式表达防止某事发生的目的；这样译既保留“倒下”的具体意象，也符合现代汉语表达。
- source_word: προενόησεν αὐτοῦ
  choice: 他预先为它作了安排
  rationale: προνοέω在此指事先考虑并采取措施；“预先……作了安排”保留先行防范之意。αὐτοῦ指前文人造的像，故用“它”。
- source_word: εἰδὼς ὅτι ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: 因为知道它不能帮助自己
  rationale: 分词εἰδώς在此说明采取措施的缘由；ἀδυνατεῖ与不定式表示无力做某事，直译为“不能帮助自己”可凸显讽刺。
- source_word: εἰκὼν
  choice: 像
  rationale: εἰκών本义为“像、形像”；上下文虽指供人敬拜的偶像，正文保留较直接的词义，避免把语境解释取代原词。
- source_word: χρείαν ἔχει βοηθείας
  choice: 本身还需要帮助
  rationale: 原文直义为“有帮助的需要”。现代汉语用“需要帮助”自然清楚；“本身还”强化原文关于它不能自助、反而需人帮助的反讽关系，却未加入“仅仅”等原文没有的限定。
theological_decisions:
- issue: 反偶像语境中εἰκών的译法
  choice: 正文译作“像”
  alternative: “偶像”或“神像”
  rationale: 语境明确涉及人手制造并受敬拜的对象，但εἰκών本身是较宽泛的“像、形像”。采用“像”保存词汇层面的开放性及作者的反讽；脚注说明语境中的可选译法。
- issue: 是否将γάρ明确译为因果说明
  choice: 译作“毕竟”
  alternative: “因为”或不显译
  rationale: γάρ承接前句，说明该物为何不能自助并需要帮助。“毕竟”在汉语中既有解释作用，也保留讽刺语气，不把论证关系处理得过于生硬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子保留原文的目的、认知理由和γάρ解释关系，并以“不能帮助自己……还需要帮助”再现原文的反讽。
