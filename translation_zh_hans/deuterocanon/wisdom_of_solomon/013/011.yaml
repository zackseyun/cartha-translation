base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/011.yaml
  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: zh_hans
  text: 又如，一个伐木人，是个木匠，锯下一棵易于处理的树[a]，熟练地刮去它全部的树皮，又巧妙地把它制成一件实用的器具，供日常生活使用[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “易于处理的树”也可译作“容易搬动的树木”；原文形容这树或木料容易移动、摆弄或加工。
    reason: lexical_alternative
  - marker: b
    text: “供日常生活使用”直译为“供生活之用”，指满足日常生活的实际需要。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑλοτόμος τέκτων
  choice: 伐木的木匠
  rationale: ὑλοτόμος表示伐木者，τέκτων在木材加工的语境中指木匠；合译既保留伐木动作，也说明其工匠身份。
- source_word: εὐκίνητον φυτὸν
  choice: 容易加工的树
  rationale: φυτὸν依上下文自然指树；εὐκίνητον本可指容易移动或摆弄，在这里侧重木料易于处理、加工，同时以脚注保留其他可能。
- source_word: ἐκπρίσας
  choice: 锯下
  rationale: 该词明确含用锯切割之意；与树搭配时，“锯下”准确而自然。
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: 熟练地刮净树皮
  rationale: περιέξυσεν指从周围刮除，εὐμαθῶς在工艺语境中表达娴熟，πάντα强调全部除净。
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: 凭精巧的手艺
  rationale: τεχνησάμενος突出运用技艺，εὐπρεπῶς可含合宜、雅致或美观之意；“精巧”在不把器物限定为装饰品的同时保留工艺品质。
- source_word: χρήσιμον σκεῦος
  choice: 一件实用的器具
  rationale: σκεῦος泛指器皿、用具或器物，具体种类未明；“器具”避免将其窄化为容器，χρήσιμον译作“实用的”。
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: 供日常生活使用
  rationale: 字面为“为生活的服事/用途”，实际指满足生活中的普通实用需要；此译符合现代汉语，又由脚注保留较贴近形式的表达。
theological_decisions:
- issue: 本节普通木工活动与后文制造偶像的对照关系
  choice: 按本节本身，以中性语气描述正常的木工制作
  alternative: 在措辞中提前加入贬义，以预示后文对偶像制造的批判
  rationale: 本节只叙述木材加工和生活器具的制作；批判力量来自后续语境，不应在此先行加入原文尚未表达的定罪色彩。
translation_notes:
