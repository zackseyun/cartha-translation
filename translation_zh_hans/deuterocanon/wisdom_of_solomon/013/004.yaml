base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/004.yaml
  text: But if they were astonished by their power and activity[a], let them understand from them how much more powerful is the one who made them;
translation:
  language: zh_hans
  text: 但如果他们因这些事物的能力和作用[a]而惊叹，就应当从这些事物明白，造它们的那一位比它们强大得多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“力量和运行。”希腊文把δύναμις（能力、力量）与ἐνέργεια（作用、运行）并列，用来描述这些受造事物令人惊叹的力量及其实际运作。
    reason: 词义存在自然的替代译法；脚注保留希腊文并列词组的语义范围。
lexical_decisions:
- source_word: δυνάμει
  choice: 能力
  rationale: 与ἐνεργείᾳ并列，指受造事物所显出的力量或能力；译为“能力”自然，并与后文“强大得多”保持语义呼应。
- source_word: ἐνεργείᾳ
  choice: 作用
  rationale: 表示实际运行、发挥功效的状态；“作用”既适合自然事物的活动，也不过度引入哲学术语。
- source_word: ἐκπλαγέντες
  choice: 惊叹
  rationale: 表达因强烈震撼而惊奇；“惊叹”简洁地保留了该分词的情感力度。
- source_word: νοησάτωσαν
  choice: 就该……明白
  rationale: 该命令式要求人作理性的推断；“就该明白”在现代汉语中自然，并保留劝令语气。
- source_word: ἀπʼ αὐτῶν
  choice: 从中
  rationale: 指从前述受造事物本身作出推论；“从中”简明且承接清楚。
- source_word: πόσῳ
  choice: ……得多
  rationale: 在比较结构中强调制造者远胜于所造之物；汉语用“得多”自然表达程度差异。
- source_word: ὁ κατασκευάσας αὐτὰ
  choice: 造它们的那一位
  rationale: 保留希腊文以描述而非明确神名来指称创造者的表达，也避免“建造”所带来的机械意味。
- source_word: δυνατώτερός
  choice: 强大得多
  rationale: 直接回应前文δυνάμει；“强大得多”清楚表达创造者在能力上超过受造之物。
theological_decisions:
- issue: 制造者所指为何
  choice: 造它们的那一位
  alternative: 创造主；造它们的上帝
  rationale: 希腊文在本句以描述性分词指称制造者，并未明说“上帝”或使用“创造主”这一称号；保留描述性说法，可维持从受造物推知创造者的论证进程。
- issue: 由受造之物推知制造者的比较力度
  choice: 强大得多
  alternative: 更强大
  rationale: πόσῳ与比较级构成强化比较。“强大得多”保留了不只一般比较、而是显著超越的意味，同时不把比较扩展成经文未明说的无限性命题。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这些事物”补明复数代词的指向，使中文起句自然；“造它们的那一位”则保留原文未直接称“上帝”的修辞方式。
