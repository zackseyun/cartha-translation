  text: But after using up the scraps from his work to prepare food, he was filled.
translation:
  language: zh_hans
  text: 至于做工剩下的碎料[a]，他用来预备食物；用尽之后，他便吃饱了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“丢弃的边角料”或“做工产生的废料”。希腊文指工匠劳作时抛下或剔除的材料。
    reason: lexical_alternative
  - marker: b
    text: 直译“他被充满了”，这里很可能是说他用剩余的木料预备食物后，吃得饱足。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ
  choice: 至于
  rationale: δέ在此承接上文并转向工匠对剩余材料的另一种用途；“至于”自然体现话题转换，而不把对比加强为明显的“但是”。
- source_word: ἀποβλήματα
  choice: 剩下的碎料
  rationale: 该词指制作过程中抛下或丢弃的材料。在木工语境中，“剩下的碎料”既表达边角余料之意，也避免把它说成毫无用处的垃圾。
- source_word: τῆς ἐργασίας
  choice: 做工
  rationale: ἐργασία泛指工作或劳作；此处上下文已表明是工匠制作，因此用现代汉语“做工”简洁自然。
- source_word: εἰς ἑτοιμασίαν τροφῆς
  choice: 用来预备食物
  rationale: 介词短语表达用途或目的；“用来预备食物”保留原文宽泛说法，不擅自明确为生火、烹煮或某一顿饭。
- source_word: ἀναλώσας
  choice: 用尽之后
  rationale: 分词表示耗用、用完这些余料，并与主句形成先后关系；“用尽之后”清楚传达伴随的完成性。
- source_word: ἐνεπλήσθη
  choice: 他便吃饱了
  rationale: 该被动式字面为“被充满”，在预备食物的语境中自然指饱足。“吃饱了”是现代汉语中清楚而不生硬的对应，同时脚注保留较直译的可能。
