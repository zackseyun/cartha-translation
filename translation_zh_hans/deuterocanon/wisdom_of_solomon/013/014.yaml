  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/014.yaml
  text: or he made it like some lowly animal[a], smearing it with red ocher and with dye, reddening its surface, and smearing over every blemish on it[b],
translation:
  language: zh_hans
  text: 或把它做成某种低贱的动物的样子[a]，用红赭石和红色颜料涂抹，把它的表面染红，又把它上面的每一处瑕疵都涂抹遮盖起来[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低贱”也可译作“低廉”或“普通”；希腊文强调这种动物地位低微或价值低廉。
    reason: lexical_alternative
  - marker: b
    text: 希腊文具体提到两种着色材料：“红赭石”（μίλτος）和φῦκος；后者是一种红色染料或化妆颜料。
    reason: cultural_note
lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: 某种卑贱动物
  rationale: ζῷον指动物或活物；εὐτελής含低贱、低廉或普通之意。“卑贱动物”保留原文的轻蔑语气，又不把它过度解释为道德意义上的“无用”或“邪恶”。
- source_word: ὡμοίωσεν αὐτό
  choice: 把它做成……的样子
  rationale: ὁμοιόω表示使某物与另一物相似；此处处于工匠制作偶像的语境，这一译法自然地表达塑造成某种形象。
- source_word: καταχρίσας
  choice: 涂抹／涂盖
  rationale: 该分词表示把某种材料抹在表面。前半句译作“涂抹”以描写施加颜料，末尾依语境译作“涂盖”以突出遮掩瑕疵；两处均保留反复覆盖表面的动作。
- source_word: μίλτῳ
  choice: 红赭石
  rationale: μίλτος指用作颜料的红赭土；“红赭石”是现代汉语中明确而适合工艺语境的名称。
- source_word: φύκει
  choice: 红色颜料
  rationale: φῦκος可指红色染料或化妆颜料，或与海藻制成的色料有关。“红色颜料”既交代其颜色和用途，也避免把来源说得过于确定。
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: 把它的表面染红
  rationale: χρόα可指皮肤、肤色、外表或表面；对象是雕像，译作“表面”最合语境。ἐρυθῆνας表达使之变红。
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: 上面的每一处瑕疵
  rationale: κηλίς可指斑点、污迹或瑕疵；在雕像修饰的语境中，“瑕疵”最能体现被颜料掩盖的表面缺陷。介词短语按汉语自然表达译作“上面的”，不将其理解为内部缺陷。
