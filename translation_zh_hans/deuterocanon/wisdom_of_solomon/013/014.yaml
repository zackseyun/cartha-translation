translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。保留本节与上下文衔接的句首“或”和句末逗号。用“某种”传达不定代词τινί；“涂抹—染红—涂盖”重现原文连续的制作动作，并避免“膏抹”等可能带有宗教仪式意味的措辞。
