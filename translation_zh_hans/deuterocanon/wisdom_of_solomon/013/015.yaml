  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/015.yaml
  text: And after making for it a dwelling fit for it[a], he set it in a wall, securing it with iron.
translation:
  language: zh_hans
  text: 他为它造了一处与它相称的居所[a]，随后把它安放在墙里，用铁加以固定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“配得上它的居所”，或“适合它的住处”。
    reason: ἄξιος可表示“配得上”或“合适”，οἴκημα可译为“居所”“住处”或“房屋”。
lexical_decisions:
- source_word: ποιήσας
  choice: 又……造了
  rationale: 不定过去时分词表示先于主句动作发生的行动；汉语用连动结构自然呈现这一先后关系，并以“又”承接上下文。
- source_word: αὐτῷ
  choice: 为它
  rationale: 所指是人工制作的偶像，因此用非人格化的“它”，不赋予其人格地位。
- source_word: αὐτοῦ ἄξιον
  choice: 与它相称的
  rationale: ἄξιος在此可指“配得上”或“合适”；“相称”既保留评价色彩，也适用于为偶像制作居所的讽刺语境。
- source_word: οἴκημα
  choice: 居所
  rationale: 该词基本义是居住之处；“居所”保持原文意象，又不把它过度具体化为“神龛”。
- source_word: ἐν τοίχῳ
  choice: 在墙里
  rationale: ἐν加与格表示位置；“在墙里”保留原文空间关系，可能指墙上的凹龛或嵌入墙中的位置。
- source_word: ἔθηκεν
  choice: 安放
  rationale: 表达把物件放置并安装在固定位置，比口语化的“放”更符合本句庄重叙述。
- source_word: ἀσφαλισάμενος
  choice: 固定好
  rationale: 该分词说明安放时伴随的加固动作；“固定好”自然表达使其稳固、不致移动或倒下。
- source_word: σιδήρῳ
  choice: 用铁
  rationale: 工具与格表示所用材料或器具；不增补原文未说明的铁钉、铁箍等具体构件。
theological_decisions:
- issue: 偶像应使用人格代词还是非人格代词
  choice: 全句使用“它”
  alternative: 使用“他”
  rationale: 上下文所指为人手制造的物像。现代汉语用“它”既符合指称对象，也保留作者对偶像无生命性质的批判，不额外赋予人格。
- issue: ἄξιον的评价意味
  choice: 译作“与它相称的”
  alternative: 译作“配得上它的”或“适合它的”
  rationale: “相称”保留“配得上”与“适合”之间的语义张力，也让原文中人为偶像建造居所的讽刺意味自然显现，而不在正文中过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“居所”保留偶像仿佛需要住所的反讽；“在墙里”避免擅自明确为神龛；句式简洁，并保留原文两个分词与主要动作之间的关系。
