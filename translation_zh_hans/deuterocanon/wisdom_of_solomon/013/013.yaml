base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: zh_hans
  text: 至于从这些木料中弃下的废料[a]，毫无用处；那是一块弯曲、满是木节的木头。他拿起它，在闲懒中精心雕刻，又以安逸中的熟练把它塑出形状，并使它仿照人的形象[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废料”也可译作“被丢弃的余料”。希腊词指因无价值而被扔掉的东西。
    reason: lexical_alternative
  - marker: b
    text: “在闲懒中精心……以安逸中的熟练”贴近希腊原文的反讽性并置：人竟把精心与熟练耗在将无用木料制成偶像上。
    reason: rhetorical_note
lexical_decisions:
- source_word: ἀπόβλημα
  choice: 丢弃的……废料
  rationale: 该词指被扔掉或弃置之物；“废料”自然表达木工语境中的无用余料，“丢弃的”则保留词本身所含的弃置意味。
- source_word: εἰς οὐδὲν εὔχρηστον
  choice: 毫无用处
  rationale: 准确保留该短语所强调的全然无用，现代汉语自然明白。
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  choice: 一块弯曲而且长满木节的木头
  rationale: ξύλον在此指具体木料；σκολιόν表示弯曲，ὅζοις συμπεφυκός描写枝节与木料一同长成，译作“长满木节”既符合木材语境，也显出材料的缺陷。
- source_word: ἐγλύψεν
  choice: 加以雕刻
  rationale: 该动词表示切削、雕刻，用于木头及造像语境十分贴切。
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ
  choice: 用闲懒中的那份精心
  rationale: 保留ἐπιμέλεια与ἀργία之间刻意形成的反差，呈现作者对制造偶像者把心力耗在无价值之事上的讽刺。
- source_word: ἐμπειρίᾳ ἀνέσεως
  choice: 凭安逸中的熟练
  rationale: ἐμπειρία可指经验、熟练，ἄνεσις可指舒缓、安逸；此译与前句平行，尽量保留原文反讽而不将其平化为普通的“空闲时间”。
- source_word: ἐτύπωσεν αὐτό
  choice: 把它塑成形
  rationale: ἐτυπόω表示赋予形状或制成某种形态；“塑成形”清楚承接前面的雕刻动作。
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  choice: 使它仿照人的形像
  rationale: ἀπεικάζω表示使之相似或依样仿造；“人的形像”保留ἀνθρώπου在此可能泛指人的自然含义，不额外断定所造之像必为男性。
theological_decisions:
- issue: εἰκόνι ἀνθρώπου所指形像的性别范围
  choice: 人的形像
  alternative: 男人的形像
  rationale: ἄνθρωπος虽为阳性语法形式，却通常可泛指“人、人类”；本节上下文本身未明确限定男性。译作“人的形像”保留原文范围，避免加入并无充分依据的性别限定。
- issue: 制造偶像时“精心”与“闲懒”、“熟练”与“安逸”的反讽
  choice: 用闲懒中的那份精心……凭安逸中的熟练
  alternative: 在空闲时精心雕刻，熟练地塑成形
  rationale: 原文有意把勤谨工夫与闲懒安逸并置，以讽刺人精心制作无用偶像。正文保留这一张力，而脚注帮助现代读者把握其修辞。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“闲懒中的那份精心”和“安逸中的熟练”略带刻意的悖论感，以保存希腊文的讽刺力度。句末保留逗号，因为原文语法与下一节连续。
