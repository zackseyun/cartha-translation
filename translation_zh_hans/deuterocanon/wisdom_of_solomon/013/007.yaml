base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: zh_hans
  text: 因为他们置身于他的造物之中，仔细探究，并因眼前所见而信服，认定所看见的事物是美丽的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“美好的。”希腊语 καλά 既可表示“美丽”，也可表示“美好、良善”；本节强调视觉和所看见的事物，故正文译作“美丽”。
    reason: 保留 καλά 的真实词义歧义。
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: 置身于……之中
  rationale: 该分词可指在某处生活、活动或往来；这里描述人身处上帝可见的造物之中并加以观察。“置身于……之中”自然地保留了空间性和亲身接触之意，而不把它弱化为单纯的思想活动。
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: 他的造物
  rationale: ἔργα 基本义为“工作、作品、所做成的事物”。上下文讨论从可见的受造秩序推求其创造者，因此译为“造物”比“作品”更符合现代汉语表达；αὐτοῦ 保留为男性单数“他的”，所指由上下文确定。
- source_word: διεραυνῶσιν
  choice: 仔细探究
  rationale: 该动词表示深入搜索、彻底考察；“仔细探究”兼顾其加强语气和有意识研究的含义。
- source_word: πείθονται
  choice: 信服
  rationale: 这里的中动或被动形式表达观察者被证据说服。“信服”保留受所见之物影响而形成确信的意味，同时避免添加原文没有明说的信仰对象。
- source_word: τῇ ὄψει
  choice: 因眼前所见
  rationale: ὄψις 可指视觉、所见或外观；此处与工具或原因性的与格连用。“因眼前所见”在现代汉语中自然，也保留视觉证据产生说服力的关系。
- source_word: καλά
  choice: 美丽的
  rationale: καλός 可指美丽、美好或良善。由于本句强调视觉和可见之物，正文采用审美义“美丽”，并以脚注保留“美好”的可能。
- source_word: τὰ βλεπόμενα
  choice: 所看见的事物
  rationale: 该现在时被动分词实词化，指正在被观看或可见的事物。“所看见的事物”既贴近希腊文，也符合现代汉语习惯。
theological_decisions:
- issue: αὐτοῦ 所指为何
  choice: 译作“他的”，按上下文指上帝或创造者
  alternative: 若抽象承接上下文，也可理解为“它的”
  rationale: 本节所在论证由受造之物推及其创造者，阳性单数代词自然指向创造者；正文只保留“他的”，不额外加入“上帝”，避免超出本句明说的内容。
- issue: καλά 的审美义与伦理义
  choice: 正文采用“美丽的”
  alternative: 可译“美好的”或“良善的”
  rationale: 视觉词汇 ὄψις 和 βλεπόμενα 使审美义较为突出，但 καλός 本身仍有更宽的“美好、良善”语义，因此用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句子保留原文由身处造物、仔细探究、受视觉证据说服到作出判断的推进关系；不添加宗派性解释。
