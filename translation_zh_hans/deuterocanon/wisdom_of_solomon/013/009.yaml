base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/009.yaml
  text: For if they had power to know so much that they could speculate about the age, how did they not more quickly find its Master?
translation:
  language: zh_hans
  text: 因为，他们既有如此大的能力，竟能推究宇宙[a]，怎么会没有更早找到这些事物的主宰呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宇宙”也可译作“时代”或“世代”。希腊词 αἰών 的含义可随上下文指时代、世界或宇宙秩序。
    reason: 保留 αἰών 的真实语义范围，不将其歧义完全限定为单一解释。
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: 有如此大的本领
  rationale: 表达他们具备相当强的认知能力，保留原文带有反诘意味的能力表述。
- source_word: στοχάσασθαι
  choice: 探究
  rationale: 该词表示凭观察、推测而求知；“探究”在现代汉语中自然，也不把含义限定为纯粹猜测。
- source_word: τὸν αἰῶνα
  choice: 世代
  rationale: 按 αἰών 的直接词义译出，并保留其可指时代、世代或世界秩序的语义张力，不在正文中径直解释为“世界”。
- source_word: τὸν τούτων δεσπότην
  choice: 这一切的主宰
  rationale: τούτων 回指他们所考察的事物；δεσπότης 表示拥有权柄的主，译作“主宰”准确而庄重。
- source_word: πῶς τάχιον οὐχ εὗρον
  choice: 怎么没有更快找到……呢
  rationale: 保留比较级 τάχιον 和原文的反问语气。
theological_decisions:
- issue: αἰών 的宇宙论含义
  choice: 正文译作“世代”，脚注说明也可理解为“世界”或“宇宙秩序”
  alternative: 直接译作“世界”
  rationale: 原词具有多义性；采用较形式对应的译法并用脚注保存语义范围，避免无依据地消除歧义。
- issue: δεσπότης 所指的神圣身份
  choice: 译作“主宰”，不直接增译“上帝”
  alternative: 译作“创造主”或“上帝”
  rationale: 上下文指向上帝，但本节原文只称“主宰”；不补入“创造”或神名，以保存原文措辞和论证张力。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“这一切”使希腊语复数代词 τούτων 在汉语中有所着落；全句保留对人类认知能力与未能认识主宰之间的张力。
