revisions:
- from: 因为凡不认识上帝的人，本性都是虚妄的；他们不能从眼前可见的美好事物认识那位真实存在者，也没有留心他的作为，从而认出那位匠师。
  to: 因为所有人按本性说都是虚妄的；他们对上帝无知，不能从可见的美好事物中认识那位存在者；他们也没有借着留心这些作为认出那位匠师。
  rationale: 修订恢复原文“所有人……他们”的语法范围，保留ἀγνωσία为对这群人的描述，而不将其改作限定性条件；删去“眼前”和“真实”这两项原文未明说的限定。末句以“借着留心”表达分词προσχόντες的方式含义，并保留他们仍未认出τεχνίτης的否定结果。
  reviewer_model: gpt-5.6-terra
