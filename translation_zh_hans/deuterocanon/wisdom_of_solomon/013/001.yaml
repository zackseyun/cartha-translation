base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: zh_hans
  text: 因为所有人按本性说都是虚妄的；他们对上帝无知，不能从可见的美好事物中认识那位存在者；他们也没有借着留心这些作为认出那位匠师。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  choice: 虚妄的
  rationale: 既保留“徒然、空虚、无实效”的语义，也避免把它单纯收窄为智力上的“愚蠢”。
- source_word: φύσει
  choice: 本性
  rationale: 直译其“按本性、就本性而言”的含义，并保留原文可能引发的神学张力。
- source_word: οἷς παρῆν θεοῦ ἀγνωσία
  choice: 不认识上帝的人
  rationale: 用自然汉语表达“在他们里面有对上帝的无知”，不把ἀγνωσία强化为故意拒绝。
- source_word: τῶν ὁρωμένων ἀγαθῶν
  choice: 眼前可见的美好事物
  rationale: 保留ἀγαθῶν的“美好之物”，并明确这些事物是可见的。
- source_word: τὸν ὄντα
  choice: 那位真实存在者
  rationale: 保留定冠词分词所指的“那位存在者”，并以“真实”传达其强调意味，而不直接套用特定神名。
- source_word: τοῖς ἔργοις προσχόντες
  choice: 留心他的作为
  rationale: προσέχω表示注意、专注；“作为”在此兼顾受造之工与行动成果。
- source_word: τὸν τεχνίτην
  choice: 那位匠师
  rationale: 保留创造者作为技艺高超之工匠的形象，不泛化为抽象的“创造主”。
theological_decisions:
- issue: φύσει是否表达所有人先天本质上的彻底败坏
  choice: 译作“本性都是虚妄的”，不作进一步教义解释
  alternative: “生来都是愚昧的”或“按本性都是徒然的”
  rationale: 原文确有φύσει，但本节重点是因不认识上帝而显出的虚妄；译文保留张力，不将其系统化为某一宗派的人论表述。
- issue: τὸν ὄντα是否直接等同于特定神名启示
  choice: 译作“那位真实存在者”
  alternative: “自有永有者”或“那位存在的”
  rationale: 此处可能呼应神圣存在的语言，但原文并未直接引用出埃及记中的神名公式；避免过度确定互文。
- issue: 受造之物是否足以使人获得完整的上帝知识
  choice: 仅陈述人未能由可见美物认识上帝
  alternative: 补译为“本来能够充分认识上帝”
  rationale: 原文谴责其未能认识，却没有在本节界定自然启示所能提供之知识的完整范围。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“匠师”保留原文工匠隐喻；整体维持因果与并列结构，同时避免生硬照搬希腊语关系从句。
