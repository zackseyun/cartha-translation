  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/003.yaml
  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: zh_hans
  text: 他们若因这些事物的美丽而欣喜，便以为这些事物是神，就该知道，这些事物的主远比它们优越；因为美的创造者创造了它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλλονῇ / κάλλους
  choice: 美丽 / 美
  rationale: 保留同一词根形成的呼应；前者指受造物可见的美丽，后者概括“美”本身。
- source_word: θεοὺς ὑπελάμβανον
  choice: 以为它们是神
  rationale: ὑπολαμβάνω在此表示认定、以为；“神”不加“众”，现代汉语已可由“它们”表达复数。
- source_word: γνωτώσαν
  choice: 就应当知道
  rationale: 表达第三人称复数命令式的劝诫和要求语气，比单纯“让他们知道”更自然。
- source_word: δεσπότης
  choice: 主
  rationale: 表示对这些受造物拥有主权者；采用庄重而常用的“主”，不擅自扩充为专名。
- source_word: βελτίων
  choice: 美好
  rationale: 此比较级可指更优越、更卓越；在上下文谈论美时译作“美好”，既保留语义关联，又不缩窄为仅仅外观更美。
- source_word: τοῦ κάλλους γενεσιούργης
  choice: 创造美的那一位
  rationale: γενεσιούργης意为使之产生者、创造者；此译自然表达“美的创造者”，并避免生硬名词堆叠。
- source_word: ἔκτισεν
  choice: 创造了
  rationale: 准确呈现κτίζω的创造含义，并与“创造美的那一位”形成原文的语义呼应。
theological_decisions:
- issue: “它们的主”与受造物之间的关系
  choice: 保留“它们的主”
  alternative: 创造它们的主宰
  rationale: 原文δεσπότης强调主权，但本句随后才明确说他创造了它们；不提前把解释并入称谓。
- issue: “美的创造者”是否直接称为上帝
  choice: 译作“创造美的那一位”
  alternative: 创造美的上帝
  rationale: 原文此处未直接使用θεός称呼真正的创造者；保留措辞和论证推进，不补入明说的身份。
- issue: βελτίων的比较范围
  choice: 比它们美好多少
  alternative: 比它们优越多少
  rationale: “美好”既可表达整体卓越，也呼应本节反复出现的“美”；同时不把比较限定为外表。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“这些事物”承接上下文所论的自然现象，以“它们”保持复数指代；保留条件句、命令式劝诫和因果句的原文结构。
