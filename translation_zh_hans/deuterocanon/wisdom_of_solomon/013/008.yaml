  text: 再者[a]，就连他们也无可推诿；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再者，就连他们也不可原谅”，或“再者，就连他们也不配得宽宥”。
    reason: “再者”表达 πάλιν δέ 在论证中的再次／进一步推进；“无可推诿”对应 συγγνωστοί 的“不可获谅解、不可开脱”之意。
lexical_decisions:
- source_word: πάλιν
  choice: 仍然
  rationale: 在论证中承接上文并再次作出判断；结合后置连词 δέ，译作“然而……仍然”可自然表达续接兼轻微转折的语气。
- source_word: δʼ
  choice: 然而
  rationale: δέ 在此有轻微转折兼承接作用，置于句首译作“然而”，与“仍然”共同传达 πάλιν δέ 的语势。
- source_word: οὐδʼ
  choice: 无可
  rationale: οὐδέ 强化否定，原意为“连他们也不”；汉语“他们仍然无可推诿”在上下文中自然保留了对这些人的强调。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 强调性代词回指前文所说的人。汉语主语“他们”配合强化否定已能清楚表达重点，无须生硬添加“自己”。
- source_word: συγγνωστοί
  choice: 可推诿
  rationale: 该形容词表示可获谅解、可被宽宥，或有理由得到开脱。否定式“无可推诿”贴合本段关于人是否能为自己的无知开脱责任的论证，同时避免把它限定为关系性的“饶恕”。
theological_decisions:
- issue: συγγνωστοί 所表达的责任程度
  choice: 译为“无可推诿”，表明这些人不能以所述缘由为自己开脱。
  alternative: 也可译为“不可原谅”或“不值得宽宥”。
  rationale: 《智慧篇》第13章讨论人从受造之物认识上帝以及由此产生的责任。“无可推诿”保留道德问责的重点，又不把词义过早收窄为某种特定的赦罪教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号保留原文作为后续论证片段的开放性；脚注标记置于与词义和语气相关的“仍然”之后。
