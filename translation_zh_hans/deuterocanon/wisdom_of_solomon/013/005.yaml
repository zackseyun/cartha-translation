  text: For from the greatness and beauty of created things[a], their Creator is seen by analogy.
translation:
  language: zh_hans
  text: 因为，人可以从受造之物的宏伟和美丽，由此类推而看出它们的创造者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可以按相应的关系察知它们的创造者”或“可以相应地看出那创造它们的”。希腊语副词强调一种相称的推论：从受造之物的特质推知其创造者。
    reason: 说明ἀναλόγως的“相应／类推”意味，以及θεωρεῖται可译为“察知”或“看出”的词义范围；删除原文未出现的“主”。
lexical_decisions:
- source_word: ἐκ
  choice: 从
  rationale: 表示认识创造者所依据的来源，即由观察受造之物而作出推知。
- source_word: μεγέθους
  choice: 宏伟
  rationale: 此词不只指物理尺寸，也可表达受造界所显出的广大与壮伟；“宏伟”能自然涵盖这一层意思。
- source_word: καλλονῆς
  choice: 美丽
  rationale: 直接表达事物悦目、美好的特质，符合上下文。
- source_word: κτισμάτων
  choice: 受造之物
  rationale: 保留复数以及“被创造之物”的含义，又不把范围限于有生命的受造物。
- source_word: ἀναλόγως
  choice: 类推
  rationale: 表达从作品的特质依相应关系推知其创造者的思辨过程，同时避免暗示人能借此完全认识创造者。
- source_word: ὁ γενεσιουργὸς αὐτῶν
  choice: 它们的创造者
  rationale: γενεσιουργός指使事物产生、赋予其存在者；“创造者”与κτισμάτων相呼应，也清楚自然。
- source_word: θεωρεῖται
  choice: 可以……认识
  rationale: 该被动形式表示创造者可借着省察受造之物而被察知；“认识”在“类推”的限定下保留其理性观察与辨识的意味。
theological_decisions:
- issue: 自然启示所能带来的认识
  choice: 可以类推而认识它们的创造者
  alternative: 可以按相应的关系看出它们的创造者
  rationale: 译文肯定人能从受造之物推知创造者，却不进一步断言这种认识的完整程度或救赎功效，从而保留原文的认识论范围与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宏伟和美丽”兼顾原文两个并列特质；“类推而认识”保留哲理性的推论意味，但避免过度学术化。脚注标记已在正文中列出。
