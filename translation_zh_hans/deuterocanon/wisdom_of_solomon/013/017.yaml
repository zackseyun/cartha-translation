base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/017.yaml
  text: But concerning his possessions and his marriage and children[a], while praying he is not ashamed to address the lifeless thing; and concerning health, he calls on what is weak[c][b],
translation:
  language: zh_hans
  text: 他为自己的财产、婚姻[a]和儿女祷告时，不以同那没有生命之物[b]说话为耻；为求健康，他呼求那软弱之物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此词为复数；也可译作“婚事”或“婚姻方面的事”。
    reason: 保留γάμων的复数形式及其可能的范围意义。
  - marker: b
    text: 直译：“那无生命的（东西）”。作者没有直接称它为偶像，而以“没有生命”来描述它。
    reason: 说明原文的实体化形容词及其讽刺修辞。
  - marker: c
    text: 也可译作“那孱弱无力的东西”；这里轻蔑地指出受呼求者本身毫无能力。
    reason: 保留τὸ ἀσθενές在“软弱、无力”之间的词义幅度。
lexical_decisions:
- source_word: κτημάτων
  choice: 财产
  rationale: 指人所拥有的财物或产业；“财产”范围较宽，不局限于土地。
- source_word: γάμων
  choice: 婚姻
  rationale: 原文为复数，但在此表示婚姻或婚事这一类关切；中文用“婚姻”自然，并以脚注保留复数形式及另一种理解。
- source_word: τέκνων
  choice: 儿女
  rationale: 直接表达子女、后代之意，符合现代汉语家庭语境。
- source_word: προσευχόμενος
  choice: 祈求时
  rationale: 将分词译为时间兼方式状语，使祈祷行为与向无生命之物说话紧密相连。
- source_word: οὐκ αἰσχύνεται
  choice: 竟不以……为耻
  rationale: 保留“不感到羞耻”的道德批判语气；“竟”自然传达上下文中的讽刺。
- source_word: τῷ ἀψύχῳ
  choice: 那没有生命之物
  rationale: ἀψύχῳ指没有生命或气息的东西；不直接补出“偶像”，以保留原文迂回而轻蔑的修辞。
- source_word: προσλαλῶν
  choice: 向……说话
  rationale: 贴近该动词“对某者说话”的基本意义，也避免在已有“祈求”的语境中重复强化。
- source_word: ὑγείας
  choice: 健康
  rationale: 准确表达身体健康，与下文所呼求对象的软弱形成反讽。
- source_word: τὸ ἀσθενές
  choice: 那软弱之物
  rationale: 保留中性实体化表达及轻蔑语气，不擅自加入“偶像”这一名词。
- source_word: ἐπικαλεῖται
  choice: 呼求
  rationale: 符合祷告和求助语境，同时清楚呈现向某对象求告的动作。
theological_decisions:
- issue: ἀψύχῳ与τὸ ἀσθενές中的偶像讽刺
  choice: 分别译为“那没有生命之物”和“那软弱之物”，不在正文补出“偶像”
  alternative: 译为“没有生命的偶像”和“无能的偶像”
  rationale: 希腊文刻意使用描述性的中性表达，而没有在本句直接点名偶像；保留这一方式，既传达其无生命、无能力的讽刺，也不增加原文没有的明说。
- issue: γάμων的复数形式
  choice: 正文采用自然的集合性表达“婚姻”，脚注说明原文为复数
  alternative: 正文译作“婚事”或“婚姻诸事”
  rationale: 中文“婚姻”可自然涵盖这一生活领域；脚注保留原文复数可能指多项婚事或婚姻事务的开放性，避免过度确定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“竟”强化原文的反讽和责难；“之物”略带庄重色彩，并使两个中性实体化形容词的呼应清楚可见。分号保留两组祈求事项之间的平行结构。
