base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/018.yaml
  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
translation:
  language: zh_hans
  text: 为了生命，他向死物有所求；为了帮助，他恳求那最没有经验的；为了旅程，他求助于连脚也不能使用的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“连自己的基座也不能使用的。”希腊词 βάσις 可指脚、步履，也可指基座；此处讥讽偶像连自己都不能移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ ζωῆς
  choice: 为了生命
  rationale: περί加属格在三个平行分句中表示所求之事；译作“为了生命”简洁自然，并保留与“为了帮助”“为了旅程”的排比。
- source_word: τὸ νεκρόν
  choice: 死物
  rationale: 中性单数指没有生命的偶像；“死物”既表明其非人格性质，也保留原文讽刺的力度。
- source_word: ἀξιοῖ
  choice: 认为……配受所求
  rationale: 保留ἀξιόω“认为配得、看为合宜”的评价意味，同时借“所求”交代语境中的祈求关系，避免仅译成“请求”而抹去原词张力。
- source_word: ἐπικουρίας
  choice: 帮助
  rationale: 这是现代汉语中自然、范围恰当的对应词，也与本节其他所求之事构成清楚的平行。
- source_word: τὸν ἀπειρότατον
  choice: 最没有经验的
  rationale: 保留ἀπειρότατος作为最高级的字面意义“最无经验、最不谙其事”，不直接改释为“最无能的”。
- source_word: ἱκετεύει
  choice: 求告
  rationale: 表达恳切祈求，并适合向神明求助的语境；语体庄重而仍为现代读者易懂。
- source_word: ὁδοιπορίας
  choice: 旅程
  rationale: 准确表达行路、出行之意，也能突出求助对象自身不能移动的反讽。
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: 连脚也不能使用的
  rationale: βάσις可指脚、步履，也可指基座；正文采用与“旅程”直接呼应的“脚”，另以脚注保留基座之义。
theological_decisions:
- issue: 本节对偶像所用中性与阳性表达的转换
  choice: 先译作非人格的“死物”，后以“最没有经验的”及“连脚也不能使用的”作拟人化指称
  alternative: 把各处统一明说为“偶像”或一律译作“它”
  rationale: 原文先以中性形式强调偶像是死物，继而用阳性最高级形成拟人化讽刺；保留这种变化，不将原文的修辞张力整齐化。
- issue: ἀξιοῖ在此处的祈求含义与评价含义
  choice: 译为“认为死物配受所求”
  alternative: 译为“向死物求取生命”
  rationale: 正文保留动词“认为配得”的基本评价意义，同时以“所求”使上下文中的请求关系清楚，不把可能的语义张力单向化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，以三个“为了……”保持希腊文排比。加入“竟”凸显原文对敬拜死物之荒谬的讽刺，但不另加宗派性解释。正文脚注标记[a]与脚注完全对应。
