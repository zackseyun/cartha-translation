base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: zh_hans
  text: 不过，对于这些人，责备也不算多，因为他们也是在寻求上帝[a]、想要找到他时，或许迷失了；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一位神”。希腊文“神”前没有冠词；但按上下文，作者很可能是指他们虽迷失却试图寻找的真神。
    reason: 保留无冠词θεόν的另一种可能理解，同时说明语境支持主文译法。
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: 然而，即使
  rationale: 保留转折兼让步的语气，并自然承接上文。
- source_word: ἐπὶ τούτοις
  choice: 对这些人
  rationale: 本句所指是上文描述的那一类人，而非抽象的事物。
- source_word: μέμψις ὀλίγη
  choice: 只有轻微的责备
  rationale: μέμψις表示责备或非难，不宜译成司法意味较重的“罪责”；ὀλίγη则明确减轻其程度。
- source_word: τάχα
  choice: 或许
  rationale: 保留原文对判断的缓和语气。
- source_word: πλανῶνται
  choice: 走入了歧途
  rationale: 兼顾迷失、犯错的认知与道德意味，同时不额外指定使其迷失的外在主体。
- source_word: θεὸν ζητοῦντες
  choice: 在寻求上帝
  rationale: 结合《智慧篇》第13章的创造主语境，单数θεόν最可能指向真神；以脚注保留无冠词形式可能产生的不定理解。
- source_word: θέλοντες εὑρεῖν
  choice: 想要找到他
  rationale: 准确表达θέλοντες所含的意愿，现代汉语自然清楚，并以“他”承接上帝。
theological_decisions:
- issue: 无冠词的θεόν应译为“上帝”还是“一位神”
  choice: 上帝
  alternative: 一位神
  rationale: 上下文所论是人从受造物推求创造主，却未能正确认识他，因此主文采用“上帝”；但希腊文没有冠词，故用脚注保留“一位神”的形式可能性，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“对这些人”明确回指上文；“走入了歧途”置于时间性结构之后，使两个现在分词“寻求”“想要找到”的伴随关系清楚。保留句末分号以顺应所给经文片段与后文的连续论述。
