base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: zh_hans
  text: 至于谋生、劳作和亲手所做之事的成就[a]，他竟用双手[b]向那最不能行动的东西求取行事的能力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“双手的成功”，指亲手所做之事取得成果。
    reason: lexical_alternative
  - marker: b
    text: 原文此处直译为“用双手”。这短语较可能指祈求者用自己的手向偶像求取；其紧缩的句法也使它与邻近词语的关系显得简略。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: πορισμοῦ
  choice: 谋生
  rationale: 该词指取得所需、获得生计或供给；在此与“劳作”并列，“谋生”自然地表达获取生活所需的意思，同时不局限于利润。
- source_word: ἐργασίας
  choice: 劳作
  rationale: 该词泛指工作、劳动或经营活动；“劳作”既简明，又适合本节庄重而带讽刺的语气。
- source_word: χειρῶν ἐπιτυχίας
  choice: 手中所做之事能否成功
  rationale: 原文直译近于“双手的成功”，指人亲手从事之事取得成果；如此译法既符合现代汉语，也保留“双手”这一贯穿本句讽刺的意象。
- source_word: τὸ ἀδρανέστατον
  choice: 那双手毫无作为的东西
  rationale: ἀδρανέστατον是最高级，强调完全不活动、不能起作用；中性单数指受人祈求的偶像这一物件。“毫无作为”与后文所求的行动能力构成鲜明反讽。
- source_word: ταῖς χερσὶν
  choice: 双手
  rationale: 与τὸ ἀδρανέστατον连读，作为所指范围，意为“在双手方面最不能活动”。译文保留“双手”，但脚注说明其可能的直译和所指，以免消除原文句法的紧缩感。
- source_word: εὐδράνειαν
  choice: 办事的能力
  rationale: 这是罕见词，表示良好的活动能力、效能或有力行动，正与ἀδρανέστατον形成词义对照；“办事的能力”在现代汉语中清楚，并保留向无能行动者求行动效能的讽刺。
- source_word: αἰτεῖται
  choice: 求
  rationale: 该动词在此表示请求、求取；“求”简洁自然，也符合向偶像祈求的语境。
theological_decisions:
- issue: 中性单数τὸ ἀδρανέστατον所指为何
  choice: 指人所祈求的偶像，即一个双手不能有任何作为的物件
  alternative: 泛指一个不能行动的神像，而不特别强调其雕制的双手
  rationale: 《智慧篇》第13章的上下文持续批判人手制造并受人敬拜的偶像；中性单数以及“手中所做之事”与“那双手毫无作为的东西”之间的反讽，都支持此处首先指偶像本身。译文不把它改称为“假神”，以免加入原文没有明说的教义判断。
- issue: ταῖς χερσὶν的句法关系
  choice: 主要理解为限定τὸ ἀδρανέστατον，即偶像在双手方面毫无行动能力
  alternative: 理解为祈求者“用双手”向偶像求取能力
  rationale: 词序以及“手的成功—手上最无作为—行动能力”的连续反讽更支持前一种理解；不过原文表达紧缩，因此以脚注保留较直译的形式，而不作过度展开。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“谋生—劳作—手中所做之事”形成递进，并以“毫无作为”对照“办事的能力”，尽量重现希腊文ἀδρανέστατον与εὐδράνειαν之间的词义反讽。所有脚注标记均已置于正文。
