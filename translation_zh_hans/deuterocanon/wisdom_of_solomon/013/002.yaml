base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: zh_hans
  text: 他们反倒认为，火、风[a]、迅疾的空气、群星的圆环[b]、狂暴的水，或天上的光体，都是神明，是世界的主宰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”所译的希腊词也可指“灵”或“气息”；此处列举自然事物，因此译作“风”。
    reason: lexical_alternative
  - marker: b
    text: “群星的圆环”也可译作“群星的环行”或“群星的运行轨道”。
    reason: lexical_alternative
  - marker: c
    text: “主宰”原文指主持、掌管或统治者；“世界的主宰”与“神明”构成同位说明。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: 反倒……或
  rationale: 承接上文形成转折，并引出一连串被误认作神的自然事物；“反倒”自然地表达强烈的反向对照。
- source_word: πῦρ
  choice: 火
  rationale: 直接保留自然元素的基本含义。
- source_word: πνεῦμα
  choice: 风
  rationale: 本节列举自然力量和天体，“风”最符合语境，也避免无根据地引入人格性或神学性的“灵”。
- source_word: ταχινὸν ἀέρα
  choice: 迅疾的空气
  rationale: 保留形容词的速度含义和ἀήρ“空气”的基本义，并与前面的πνεῦμα“风”维持词汇区别。
- source_word: κύκλον ἄστρων
  choice: 群星的圆环
  rationale: 较为直接地保留κύκλος的圆形意象，不武断确定它是星辰的轨道、运行还是天球。
- source_word: βίαιον ὕδωρ
  choice: 狂暴的水
  rationale: 表达βίαιος所含的强猛、暴烈之意，并保留ὕδωρ的单数集合用法。
- source_word: φωστῆρας οὐρανοῦ
  choice: 天上的光体
  rationale: “光体”清楚而凝练，指天上发光的物体，又不把它们限定为某一种天体。
- source_word: πρυτάνεις κόσμου
  choice: 世界的主宰
  rationale: 保留πρυτάνεις“主持、统管者”的含义，并以同位结构说明这些所谓神明被视为世界的统治者。
- source_word: θεοὺς ἐνόμισαν
  choice: 认为……都是神明
  rationale: 明确表达ἐνόμισαν所指的判断或认定，并使中文列举结构自然完整。
theological_decisions:
- issue: πνεῦμα应译为“风”还是“灵”
  choice: 风
  alternative: 灵；气息
  rationale: 上下文所列均为受造界的自然力量和天体，因此“风”最符合此处语义；“灵”容易使读者误以为经文在指人格性的属灵存在。
- issue: πρυτάνεις κόσμου与θεούς的关系
  choice: 神明，是世界的主宰
  alternative: 统治世界的神明；神明、世界的统治者
  rationale: 希腊文可将“世界的主宰”理解为对“神明”的同位说明。保留两个并列谓语成分，既呈现其神格身份，也呈现人们所设想的宇宙统治地位，不把两者合并得过紧。
- issue: κύκλον ἄστρων所指的古代宇宙图景
  choice: 群星的圆环
  alternative: 群星的环行；群星的运行轨道
  rationale: 原文可以指圆环、圆周或循环运行。正文采用较少解释性的表达，并用脚注保留动态理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。列举中保留“风”与“空气”的区别；以“神明，是世界的主宰”再现原文的同位张力，避免将其过度改写成单一的修饰关系。
