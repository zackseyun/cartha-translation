  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/028.yaml
  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
translation:
  language: zh_hans
  text: 为使人知道，必须在太阳升起以前向你献上感谢[a]，在晨光初现时向你祈求[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赶在太阳升起以前向你感谢。”希腊文直译为“必须先于太阳，为向你感谢”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在黎明时向你祷告。”希腊文此语直译为“向着（或临近）光的升起，向你祈求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: 为使
  rationale: 引出目的或结果，既保留希腊文的目的意味，也符合现代汉语表达。
- source_word: γνωστὸν ἦν
  choice: 人知道
  rationale: 在ὅπως引导的结构中表达预期形成的认识；补出泛指的“人”，使汉语自然，而不限定具体主体。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达必要或应当之意，不把经文扩展为有关固定祷告时辰的制度性命令。
- source_word: φθάνειν τὸν ἥλιον
  choice: 在太阳升起以前
  rationale: φθάνω带宾语可指赶在其前；此处按时间语境处理，清楚表达先于日出，同时由脚注保留较直译的说法。
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: 向你献上感谢
  rationale: 该短语较为凝练，按其敬拜语境译作向上帝表达感谢；“献上”保持庄重而自然。
- source_word: πρὸς ἀνατολὴν φωτός
  choice: 在晨光初现时
  rationale: 原文直指光的升起，译文保留黎明的意象，又避免汉语中生硬的“光升起”。
- source_word: ἐντυγχάνειν σοι
  choice: 向你祈求
  rationale: ἐντυγχάνω在宗教语境可表示带着请求来到某位面前或提出恳求；“祈求”简明表达其诉求性质。
theological_decisions:
- issue: 清晨敬拜行为的规范性
  choice: 译为泛指性的“必须”，保留经文所说的必要性。
  alternative: 可将整句理解为灾祸叙事中特定群体所领悟的功课，而非设立普遍且固定的祷告时辰。
  rationale: 希腊文δεῖ明确带有必要性，但没有明说这是制度化的每日礼仪；译文不增添这种教义性规定。
- issue: ἐντυγχάνειν所表达的祷告性质
  choice: 译作“祈求”，突出向上帝提出恳求。
  alternative: 也可较宽泛地译作“祷告”，或较字面地理解为“到你面前”。
  rationale: 在此敬拜语境中，“祈求”最能体现该动词所含的请求意味，同时不把它限定为代求。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“晨光初现”保留原文光升起的诗性意象；两个脚注分别交代φθάνειν τὸν ἥλιον和πρὸς ἀνατολὴν φωτός的较直译表达。脚注标记均置于相关正文之后。
