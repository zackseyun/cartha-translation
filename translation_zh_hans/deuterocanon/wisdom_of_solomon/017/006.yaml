base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: zh_hans
  text: 只有一团充满恐惧、自行燃起的火焰[a]向他们显现；他们被那看不见的异象[b]吓坏了，便觉得眼前所见的比那异象更糟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自发的火焰”或“自己燃起的火焰”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“那看不见的异象”，是一个刻意保留的悖论式表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφαίνετο
  choice: 显现
  rationale: 未完成时表达当时显露、可见的状态；“显现”自然且保留不祥事物呈现出来的意味。
- source_word: μόνον
  choice: 只有
  rationale: 保留限制和强调作用：向他们显现的仅是这一团火焰。
- source_word: αὐτομάτη πυρά
  choice: 一团自行燃起的火焰
  rationale: αὐτομάτη意为自行发生、无外力而成；此译既准确，也保留诡异意味，而不预设其具体成因。
- source_word: φόβου πλήρης
  choice: 充满恐惧
  rationale: 贴近希腊文的字面表达，并保留它究竟指火焰本身带着恐怖，还是使人恐惧的语义张力。
- source_word: ἐκδειματούμενοι
  choice: 被……吓坏了
  rationale: 该分词表示强烈惊恐；此表达现代、自然，并有足够力度。
- source_word: τῆς μὴ θεωρουμένης ἐκείνης ὄψεως
  choice: 那看不见的异象
  rationale: 保留“看不见”与“异象/所见景象”之间刻意形成的悖论，不将其解释性地抹平。
- source_word: ἡγοῦντο
  choice: 认为
  rationale: 表达判断、认定，适合后接比较性结论。
- source_word: χείρω τὰ βλεπόμενα
  choice: 认为眼前所见的更加可怕
  rationale: χείρω是比较级，直义为“更坏”；在恐怖语境中译为“更加可怕”较自然，同时“眼前所见”与前面的“看不见”形成对照。
theological_decisions:
- issue: 是否化解“看不见的异象”这一悖论
  choice: 正文保留为“那看不见的异象”
  alternative: 那无形的幽灵；那无法看见的景象
  rationale: 原文借悖论刻画恐惧和错乱的感知；保留张力可避免添加原文没有给出的解释。
- issue: 如何处理αὐτομάτη在超常语境中的含义
  choice: 自行燃起
  alternative: 自发出现；自己点燃
  rationale: “自行燃起”兼顾字义与诡异氛围，同时不明确断言其为神迹或其他特定成因。
- issue: χείρω在此处应译为一般价值判断还是恐惧语境中的感受判断
  choice: 更加可怕
  alternative: 更坏；更糟
  rationale: 上下文围绕恐惧展开，“更加可怕”在汉语中清楚表达比较关系；但脚注说明其字面范围更宽，以免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一团……火焰”符合汉语量词习惯；分号保留原句两个紧密相连的层次。正文保持“充满恐惧”和“看不见的异象”的陌生感，以保存原文的心理张力。
