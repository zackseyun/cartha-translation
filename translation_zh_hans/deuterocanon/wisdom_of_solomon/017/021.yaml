base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/021.yaml
  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: zh_hans
  text: 唯独那些人被沉重的黑夜笼罩；这黑夜是那将要接纳他们的黑暗的写照[a]；然而，对他们自己而言，他们比黑暗更沉重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将要接纳他们的黑暗”可能指眼前灾祸之后更大的审判，但原文没有进一步说明这种黑暗的性质。
    reason: theological_ambiguity
  - marker: b
    text: 也可译为：“对他们自己而言，他们比黑暗更难承受。”希腊原文在“沉重的黑夜”和“更沉重”之间保留了同一重量意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνοις δὲ ἐκείνοις
  choice: 唯独那些人
  rationale: 保留 μόνοις 所强调的排他性，并以现代汉语自然表达“只临到他们”。
- source_word: ἐπέτατο
  choice: 被……笼罩
  rationale: 该动词在此表示黑夜伸展、覆盖或加在他们身上；“笼罩”符合汉语对黑夜的通常搭配，同时保留外在临到他们的意味。
- source_word: βαρεῖα νύξ
  choice: 沉重的黑夜
  rationale: 直译 βαρεῖα 为“沉重”，既表现黑夜的压迫感，也与末句 βαρύτεροι“更沉重”形成刻意的词语呼应。
- source_word: εἰκὼν
  choice: 影像
  rationale: 表达当前黑夜与将来黑暗之间的对应和预示关系，不把它解释为单纯比喻或完整实体。
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: 那将要接纳他们之黑暗
  rationale: μέλλοντος 表示将要发生；διαδέχεσθαι 在此可有接纳、承接或继而取代之意。“接纳他们”保留原文阴森而开放的拟人化表达。
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: 对他们自己来说，他们自身比黑暗更沉重
  rationale: 尽量保留 ἑαυτοῖς 的反身意味和 βαρύτεροι 与前文“沉重”的呼应，不擅自将原因限定为罪疚、恐惧或心理折磨。
theological_decisions:
- issue: “将要接纳他们的黑暗”所指为何
  choice: 保留为一种将临的黑暗，当前的黑夜是其影像
  alternative: 明确解释为死后刑罚、末世审判，或仅仅是心理恐惧
  rationale: 原文暗示当前灾祸预示更大的将来黑暗，却没有明确界定其历史、末世或死后性质；译文与注释均不越过文本作教义化定论。
- issue: “他们自身比黑暗更沉重”的含义
  choice: 保留反身性和异常的重量意象
  alternative: 解释为他们的良心、罪疚或恐惧比黑暗更难承受
  rationale: 原文确实把“他们”说成对自己更沉重；将其具体化为某种内在状态会消除原有的含混与张力。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“沉重的黑夜”略带文学色彩，用以保留希腊文前后重复的重量意象；末句有意保留原文突兀的反身表达，并用脚注提供较自然的意译。
