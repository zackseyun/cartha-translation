  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/020.yaml
  text: For the whole world was illuminated with bright light and was occupied with unhindered works;[a]
translation:
  language: zh_hans
  text: 因为整个世界都被明亮的光照耀着，也都忙于不受阻碍的各样事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“整个世界都从事着毫无阻碍的各样活动。”此处希腊语可指黑暗灾祸所未波及之处，日常事务仍照常进行。
    reason: 说明συνείχετο ἔργοις可译为“忙于/从事……活动”，并交代其在上下文中的含义。
lexical_decisions:
- source_word: ὅλος ... ὁ κόσμος
  choice: 整个世界
  rationale: 表达修饰 κόσμος 的整体性，并保留叙事中埃及黑暗地区与外界的鲜明对照，不扩大为严格的宇宙论断言。
- source_word: λαμπρῷ ... φωτί
  choice: 明亮的光
  rationale: 以自然的现代汉语保留形容词与名词的搭配；与动词合用为“被明亮的光照耀着”。
- source_word: κατελάμπετο
  choice: 被……照耀着
  rationale: 反映未完成时被动形式所呈现的持续状态，同时比“被照亮”更能保留动词的动态色彩。
- source_word: ἀνεμποδίστοις
  choice: 畅行无阻
  rationale: 将“没有受到阻碍”的含义自然地用于各样工作的进行，避免生硬直译为“无阻碍的工作”。
- source_word: συνείχετο
  choice: 都畅行
  rationale: 按语境理解为世界正忙于或持续进行各种活动；这里不取“被拘束”或“被维系”的物理意义。
- source_word: ἔργοις
  choice: 各样工作
  rationale: 保留 ἔργα 可指工作、事务或活动的宽泛含义；加“各样”使汉语表达自然，但不限定为某一种劳动。
theological_decisions:
- issue: κόσμος 在黑暗灾祸对照中的范围
  choice: 整个世界
  alternative: 整个宇宙；一切受造之物
  rationale: “整个世界”忠实保留普遍光明与局部灾祸之间的文学对照，同时避免把本节解释成超出叙事语境的宇宙论命题。
- issue: συνείχετο 与 ἔργοις 的关系
  choice: 各样工作也都畅行无阻
  alternative: 世界忙于不受阻碍的活动；世界被无阻的工作维系着
  rationale: 上下文强调黑暗使受灾者无法行动，而外界日常事务仍正常进行；译文体现这一对照，却以脚注保留较贴近希腊语结构的另一表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”承接上文的论证；“照耀着”与“畅行无阻”呈现持续状态和光明地区的正常活动，并与灾祸中的停滞形成对照。
