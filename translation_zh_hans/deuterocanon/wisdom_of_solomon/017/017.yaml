  source_fidelity: 原译对三类人物及持续受制的基本意思把握良好，但将προλημφθεὶς译为“被困住”、将ἀνάγκη译为“困境”，使“被突然攫住／追上”与“不可摆脱的强制、不得已”两层表达混合，且弱化了ἀνάγκη的强制性。
  naturalness: 原句总体通顺庄重；改为“若有人……他一旦被攫住，就仍处在……强制之下”，更清楚地呈现条件句、分词动作与持续状态，也避免“受制于……困境”的搭配略显抽象。
