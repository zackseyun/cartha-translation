base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/017.yaml
  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
translation:
  language: zh_hans
  text: 因为，若有人是农夫、牧人，或是在荒野辛劳的人，他一旦被攫住，就仍处在那无法逃避的强制之下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一旦被追上，他就仍处在那不可摆脱的不得已之下。”“被攫住”所译的希腊语可指被抓住或被追上；“强制”所译的词也可指不得已、必然的约束。
    reason: 保留προλημφθεὶς“被抓住／被追上”的词义幅度，并准确呈现ἀνάγκη的强制或不得已之意。
lexical_decisions:
- source_word: εἴ τε γὰρ ... ἢ ... ἢ
  choice: 因为，无论是……还是……
  rationale: γὰρ引出解释，译为“因为”；εἴ τε与后续两个ἢ构成列举不同可能身份的结构，用“无论是……还是……”比单纯的“如果”更自然，也保留其涵盖各类人的语气。
- source_word: γεωργὸς
  choice: 农夫
  rationale: 指耕种土地的人；“农夫”简洁、庄重，并符合古代语境。
- source_word: ποιμὴν
  choice: 牧人
  rationale: 这是该词在此处的常用义，既可指牧羊者，也不过度限定牲畜种类。
- source_word: τῶν κατʼ ἐρημίαν ἐργάτης μόχθων
  choice: 在荒野劳作的人
  rationale: 保留ἐρημία的荒野、僻远之地含义和μόχθων所含的辛苦劳作意味，同时避免生硬直译为“荒野劳苦的工人”。
- source_word: προλημφθεὶς
  choice: 一旦被困住
  rationale: 该被动分词可表达被攫住、被追上或被突然困住；结合黑暗与恐惧使人无法脱身的上下文，“被困住”在现代汉语中自然且保留被动受制的意象。
- source_word: ἔμενεν
  choice: 仍受制于
  rationale: 未完成时表达持续停留在某种状态中；“仍”体现持续性，“受制于”自然衔接后面的ἀνάγκη。
- source_word: τὴν δυσάλυκτον ... ἀνάγκην
  choice: 无法逃脱的困境
  rationale: δυσάλυκτος意为难以摆脱、无法逃避，ἀνάγκη可指必然、强制或不得已的处境；“无法逃脱的困境”保留压迫感，又符合本段叙事语境。
