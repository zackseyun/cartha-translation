base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/015.yaml
  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: zh_hans
  text: 有的被可怕的幻象驱赶[a]，有的因自己心灵的背叛而瘫软无力[b]；因为突如其来、意想不到的恐惧临到了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幻影”或“异象”。希腊文指令人恐惧的显现，可能带有幽灵般或虚幻的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“因心灵的背叛而瘫软”。这句话可能是说，他们的内在生命崩溃了，仿佛反过来出卖了自己。
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν … φαντασμάτων
  choice: 可怕的幻象
  rationale: τέρασιν 表明这些显现怪异、骇人，φαντασμάτων 指显现、幻影或异象。“可怕的幻象”自然传达其恐怖而似真似幻的性质，同时不武断认定它们是真实鬼怪。
- source_word: ἠλαύνοντο
  choice: 被……驱赶
  rationale: 该动词的被动形式有被赶逐、逼迫前行之意；“被……驱赶”保留外来威逼的动态意象。
- source_word: παρελύοντο
  choice: 瘫软无力
  rationale: 原词可指被松解、削弱、弄得瘫痪。此处兼有心理崩溃与身体失去行动能力的意味，“瘫软无力”在现代汉语中较自然。
- source_word: προδοσίᾳ τῆς ψυχῆς
  choice: 因自己心灵的背叛
  rationale: 原文直译近于“因心灵的背叛”，是刻意突兀的隐喻，可能描写人的内在生命在惊恐中仿佛反过来出卖自己。译文保留这一张力，不把它解释成某种具体心理机制。
- source_word: αἰφνίδιος … καὶ ἀπροσδόκητος φόβος
  choice: 突如其来、意想不到的恐惧
  rationale: 两个形容词分别强调恐惧来得突然且全无预料；译文保留双重强调。
- source_word: ἐπῆλθεν
  choice: 临到了
  rationale: 准确表达某事突然来到并落在人身上的含义，语体庄重而易懂。
theological_decisions:
- issue: 如何处理 πρoδοσίᾳ τῆς ψυχῆς 这一含义压缩且隐喻性强的短语
  choice: 因自己心灵的背叛
  alternative: 因内心失守；因心灵弃守；因良心反过来控告他们
  rationale: 希腊文没有明确说明“心灵的背叛”具体指良心控告、勇气崩溃还是生命力弃守。保留“背叛”这一反常隐喻，可避免把原文的真实歧义收窄为单一解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“有的……有的……”对应原文的对举结构；“瘫软无力”避免生硬的医学化表达，同时保留彻底失去力量的语气。所有解释性补充均限于脚注，正文保留原文隐喻与歧义。
