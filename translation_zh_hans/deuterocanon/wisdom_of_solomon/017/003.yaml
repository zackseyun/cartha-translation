base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: zh_hans
  text: 因为他们以为自己暗中犯罪，可以不被察觉；他们却在遗忘的无光帷幕下四散，惊骇万分，又被幻影[a]搅扰得心神不宁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幻影”也可译作“幽影”或“异象”。希腊语可指影像般或幽灵般的显现。
    reason: 保留ἰνδάλμασιν在影像、幻象与幽灵般显现之间的词义幅度。
lexical_decisions:
- source_word: λανθάνειν
  choice: 不被察觉
  rationale: 该不定式与νομίζοντες连用，表示他们以为自己能逃过注意；“不被察觉”自然、准确地保留了隐匿之意。
- source_word: κρυφαίοις ἁμαρτήμασιν
  choice: 暗中犯罪
  rationale: κρυφαίοις表示隐秘，ἁμαρτήμασιν指罪或犯罪行为；译成动宾结构更符合现代汉语，同时保留道德分量。
- source_word: ἀφεγγεῖ
  choice: 无光
  rationale: 该词直指没有光亮；“无光”比单用“黑暗”更贴近原文，并能自然修饰“帷幕”。
- source_word: λήθης
  choice: 遗忘
  rationale: λήθη可指遗忘或被遗忘的状态；“遗忘”保留其基本意义，不将其强化为形而上的“湮灭”。
- source_word: παρακαλύμματι
  choice: 帷幕
  rationale: 该词指遮盖物；“帷幕”保留覆盖和遮蔽的意象，且适合庄重文体。
- source_word: ἐσκορπίσθησαν
  choice: 四散
  rationale: 被动形式的核心意义是被驱散、分散；“四散”简洁地保留空间意象，也容许语境中的精神溃乱意味。
- source_word: θαμβούμενοι δεινῶς
  choice: 惊骇万分
  rationale: θαμβέω表达震惊、惊骇，δεινῶς加强程度；“惊骇万分”兼顾强烈震动与恐惧。
- source_word: ἰνδάλμασιν
  choice: 幻影
  rationale: ἴνδαλμα可指影像、幻象或幽灵般的显现；“幻影”保留现象性质，不断定其纯属主观或确为客观灵体。
- source_word: ἐκταρασσόμενοι
  choice: 搅扰得心神不宁
  rationale: 该分词表示受到强烈扰乱或震动；此译法在现代汉语中自然，并清楚传达内心失序。
theological_decisions:
- issue: ἰνδάλμασιν所指可怕现象的性质
  choice: 译作“幻影”，不判定这些显现是主观幻觉还是客观存在的幽灵形体
  alternative: 可译“异象”“幽影”或“鬼影”
  rationale: 原文描绘审判中的恐惧，却没有明确界定这些形象的本体性质；译文应保留这一含混性，避免加入特定的灵界解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“遗忘的无光帷幕”刻意保留原文浓缩的属格意象；前半句改用“暗中犯罪，可以不被察觉”的汉语结构，使逻辑关系清楚而不削弱原意。
