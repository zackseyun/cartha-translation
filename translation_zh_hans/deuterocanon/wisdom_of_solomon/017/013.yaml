translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文句法较抽象，译文将名词“无知”展开为“不知道是什么原因”，但没有补出希腊文未明说的比较对象；脚注交代直译及可理解为“更为可怕”的译法。
