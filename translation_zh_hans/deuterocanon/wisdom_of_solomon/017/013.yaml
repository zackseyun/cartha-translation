  text: But expectation, being weaker from within, counts ignorance of the cause that brings the torment as a greater thing.
translation:
  language: zh_hans
  text: 但预期既在内里较为软弱，便把对那带来痛苦之原因的无知看作更严重。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便认为，不知道造成痛苦的原因更为严重。”希腊原文直译为：预期“把对那带来痛苦之原因的无知算为更大”。
    reason: 说明原文不寻常的比较结构，并保留一种较顺畅的理解。
lexical_decisions:
- source_word: ἔνδοθεν
  choice: 内心的
  rationale: 该词表示“从里面、在内里”；结合汉语表达，将它与“预期”连用，保留这种软弱出自内在的意思，而不把它解释成外在威胁。
- source_word: ἥττων
  choice: 变得软弱
  rationale: 比较级本义为“较弱、较低劣”；此处描述预期或预想能力受到削弱。“变得软弱”符合心理语境，也避免生硬的“较为低劣”。
- source_word: προσδοκία
  choice: 预期
  rationale: 该词可指期待、预想或预料；上下文虽与恐惧有关，仍不宜直接译成“忧惧”或“凶兆”，以免缩窄原文。
- source_word: πλείονα λογίζεται
  choice: 看得更为严重
  rationale: 该短语直指“算为更大、认为更重”；汉语用“看得更为严重”自然表达其权衡判断，同时保留比较对象未明说的原文张力。
- source_word: ἄγνοιαν
  choice: 不知道
  rationale: 名词表示无知或不知情；在现代汉语中，以“不知道是什么原因”的从句表达，比抽象的“无知”更清楚自然。
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  choice: 是什么原因造成这痛苦
  rationale: 分词修饰“原因”，意为造成或带来折磨的原因；“造成这痛苦”保留因果关系及 βάσανος 的强烈痛苦含义。
