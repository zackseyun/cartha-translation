  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: zh_hans
  text: 因为，那没有被火烧毁[a]的，只被一缕微弱的日光照暖，就融化了。
  philosophy: optimal-equivalence
  footnotes:
