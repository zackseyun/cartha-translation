base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/016.yaml
  text: Then[a], whoever it might have been there, when he fell down, was kept under guard, shut up in that ironless prison.
translation:
  language: zh_hans
  text: 于是，无论当时在那里的是谁，倒下时都被看守，禁闭在那没有铁的牢狱[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“没有铁的牢狱”，是一个反常的拘禁意象：人虽没有被铁链或铁栏囚住，却仍受困。
    reason: 说明原文刻意保留的反常隐喻，避免读者误以为“没有铁”是遗漏或普通材质说明。
lexical_decisions:
- source_word: εἶθʼ οὕτως
  choice: 于是
  rationale: 表示叙事推进及结果承接；“于是”在现代汉语中自然庄重，又不过度强调 οὕτως 的方式含义。
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  choice: 无论当时是谁
  rationale: δὴ ποτʼ οὖν 加强不定意味，重点不在身份，而在任何身处那里的个人都遭遇同样结果；“无论当时是谁”保留这种概括性的单数表达。
- source_word: καταπίπτων
  choice: 倒在那里时
  rationale: 现在分词表达伴随或同时发生的情形；译文保留“倒下”的具体形象，并以“时”自然连接主句。
- source_word: ἐφρουρεῖτο
  choice: 被看守起来
  rationale: 保留被动语态及受监守、拘押的意味。
- source_word: εἰς τὴν ἀσίδηρον εἱρκτήν
  choice: 在那没有铁的牢狱中
  rationale: ἀσίδηρον 直指“没有铁的”；保留原文反常而鲜明的意象，不擅自具体化为铁链或铁栏。
- source_word: κατακλεισθείς
  choice: 禁闭
  rationale: 表达被封闭、拘禁的加强意味；与“牢狱”搭配自然，并保留分词所补充的囚禁图景。
theological_decisions:
- issue: 不定主语的性别表达
  choice: 谁
  alternative: 他／任何一个人
  rationale: 希腊文使用阳性单数不定表达，但汉语“谁”既能保持单数个人指向，也无需添加原文在汉语中不必明说的性别；这不构成对性别含义的神学改写。
- issue: “无铁牢狱”的性质
  choice: 保留为“没有铁的牢狱”这一隐喻
  alternative: 解释为没有铁链或铁栏却仍能囚人的黑暗／恐惧
  rationale: 本节本身以悖论式形象描述拘禁，译文不在正文中限定牢狱具体指黑暗、恐惧或其他力量，以保留上下文的诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“无论当时是谁……都……”传达原文加强的不定性；正文保留“没有铁的牢狱”这一突兀意象，并将解释置于脚注。
