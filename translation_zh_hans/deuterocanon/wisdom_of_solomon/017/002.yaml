base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: zh_hans
  text: 因为不法之人自以为能压迫圣洁的民族[a]，他们就成了黑暗的囚徒，被漫漫长夜束缚，关在屋檐之下；他们作为逃离永恒眷顾[c]的逃亡者，躺在那里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不法之人”也可译作“无法之徒”或“那些不法的人”。希腊文是阳性复数形容词，在这里作名词使用。
    reason: lexical_alternative
  - marker: b
    text: 本句也可较贴近原文结构译为：“不法之人自以为能压迫圣洁的民族，就作为黑暗的囚徒、被漫漫长夜束缚的人，关在屋檐之下，作为逃离永恒眷顾的逃亡者，躺在那里。”
    reason: structural_alternative
  - marker: c
    text: “眷顾”译自希腊文πρόνοια；该词也可译作“预见”或“护理”，这里很可能指神恒久的照管和安排，而不只是预先知道。
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: 自以为能
  rationale: 该完成时分词表示带有误判或自负意味的认定；“自以为能”自然地传达其错误且僭妄的判断。
- source_word: καταδυναστεύειν
  choice: 压迫
  rationale: 此动词指凭权势严酷辖制、欺压；“压迫”保留其强烈的道德色彩，也符合出埃及灾祸的语境。
- source_word: ἔθνος ἅγιον
  choice: 一个圣洁的民族
  rationale: 基本对应原文，并保留圣约群体称谓所带有的经文回响。
- source_word: ἄνομοι
  choice: 无法之徒
  rationale: 该阳性复数形容词在此作名词使用，指违背律法或正道的人；“无法之徒”简洁保留其道德与律法含义。
- source_word: δέσμιοι σκότους
  choice: 黑暗的囚徒
  rationale: δέσμιοι直指被拘禁者；属格σκότους可理解为黑暗所拘禁的人，也可表明其囚禁领域，名词性表达保留这一图像。
- source_word: μακρᾶς πεδῆται νυκτός
  choice: 被漫漫长夜锁住
  rationale: πεδῆται带有脚镣、束缚的意象；“锁住”保留拘束感，“漫漫长夜”自然表达μακρᾶς νυκτός。
- source_word: κατακλεισθέντες ὀρόφοις
  choice: 困在屋顶之下
  rationale: ὀρόφοις字面涉及屋顶或有顶的遮蔽空间；此译保留具体意象，不直接泛化为“屋里”。
- source_word: φυγάδες
  choice: 逃避……的人
  rationale: 该词指逃亡者或处于逃遁中的人；动词化表达在现代汉语中更自然，同时保留他们虽被困住却仍被描写为逃避者的反讽。
- source_word: τῆς αἰωνίου προνοίας
  choice: 永恒眷顾与治理
  rationale: πρόνοια既可指预先筹划，也可在《智慧篇》中指神持续的照管和秩序性治理；并列措辞在正文中以通俗语言呈现其较宽的语义范围。
- source_word: ἔκειντο
  choice: 躺在那里
  rationale: 未完成时描绘持续的静态处境；“躺在那里”具体而自然地再现场景。
theological_decisions:
- issue: πρόνοια在《所罗门智慧篇》中的含义
  choice: 永恒眷顾与治理
  alternative: 永恒的预见／永恒的护理
  rationale: 在本书语境中，该词很可能不只表示预先知道，也包括神对世界持续的照管和安排。“眷顾与治理”避免把它缩窄为单纯预见，同时比教义术语“护理”更便于普通读者理解。
- issue: ἄνομοι的性别与实体化用法
  choice: 无法之徒
  alternative: 不法的人／无法的男人们
  rationale: 希腊文虽为阳性复数，但此处是类别性的实体化形容词；现代汉语“无法之徒”不强加原文未强调的生理性别，也没有削弱其对具体作恶群体的指称。
- issue: “逃避永恒眷顾与治理”的神学张力
  choice: 保留“逃避”的表述
  alternative: 被永恒的眷顾所弃绝
  rationale: 原文称他们为φυγάδες，即从πρόνοια而逃的人，并未说神的眷顾失效或弃绝他们；直译保留其反讽和张力，不替作者作神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“漫漫长夜”“黑暗的囚徒”保留诗性和拟人化意象；“反倒”明确呈现压迫者反被囚禁的语境性反转，但不增添新的事件内容。脚注标记依正文出现次序编号，并说明关键词义与句法替代方案。
