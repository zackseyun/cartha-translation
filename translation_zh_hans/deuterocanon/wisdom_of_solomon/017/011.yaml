base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: zh_hans
  text: 因为邪恶被定罪时，格外显出其怯懦[a]；它受良心逼迫，总会料想可怕的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为邪恶被定罪时，格外怯懦地作证；它受良心困逼，总会料想可怕的事。”
    reason: 原文中“怯懦”“作证”和“被定罪”之间的句法关系紧凑；此译保留将“怯懦”理解为修饰“作证”的可能。
lexical_decisions:
- source_word: δειλὸν
  choice: 胆怯
  rationale: 该词表示怯懦、畏缩；“胆怯”既保留其道德意味，也适合把“邪恶”人格化的语境。
- source_word: ἰδίως
  choice: 尤其
  rationale: 表达特别、格外之意，在现代汉语中自然地加强“胆怯”的程度。
- source_word: πονηρία
  choice: 邪恶
  rationale: 这里指抽象的道德之恶；“邪恶”比“恶事”或“罪行”更能保留原文的概括性。
- source_word: μαρτυρεῖ
  choice: 显出
  rationale: 原义是“作证、见证”。这里以邪恶为主语，译作“显出”可自然表达它以自身状态为证据，同时脚注保留较直译的可能。
- source_word: καταδικαζομένη
  choice: 被定罪时
  rationale: 保留被动分词的司法性含义，不擅自明确是外在审判还是内心自我定罪。
- source_word: προσειληφεν
  choice: 预想
  rationale: 此处表示在心里先行接受或料想某事；结合恐惧语境，“预想”比字面的“领受”更符合汉语。
- source_word: τὰ χαλεπὰ
  choice: 种种可怕的事
  rationale: τὰ χαλεπά可指艰难、严酷或可怕之事；此译保留对象的复数与不确定性，避免把它收窄成单一的“最坏结果”。
- source_word: συνεχομένη τῇ συνειδήσει
  choice: 受良心逼迫
  rationale: συνέχω有压迫、困住、辖制之意；“受良心逼迫”简洁呈现罪疚意识所造成的内在压力。
- source_word: συνειδήσει
  choice: 良心
  rationale: 上下文涉及定罪与惧怕，所指是人的道德意识，而非一般的知觉或意识。
theological_decisions:
- issue: 定罪来自外在审判还是内心自我定罪
  choice: 正文采用不明说施事者的“被定罪”，并借下一分句的“良心”呈现内在罪疚压力。
  alternative: 译为“自知有罪”或“被自己定罪”。
  rationale: καταδικαζομένη本身是未注明施事者的被动分词；上下文确实支持良心自责的理解，但原文没有明确的反身代词，因此不宜在正文中完全排除外在定罪的意味。
- issue: 邪恶“作证”的含义
  choice: 译为“显出它的胆怯”，理解为邪恶在被定罪时以自身表现证明其怯懦。
  alternative: 直译为“胆怯地作证”。
  rationale: 原文结构紧凑，δειλὸν与μαρτυρεῖ的关系可有不同分析；正文优先采用自然可懂的汉语，脚注保留较贴近字面的读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“邪恶”在本节中按原文作人格化主语；分号保留两分句之间紧密并列的论证关系。
