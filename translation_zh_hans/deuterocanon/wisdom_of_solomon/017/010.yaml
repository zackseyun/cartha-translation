base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/010.yaml
  text: They were being destroyed[a], trembling and refusing even to look at the air, though there was nowhere to flee from it.
translation:
  language: zh_hans
  text: 他们战战兢兢，正在被毁灭[a]，甚至连那无处可逃避的空气也不肯看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在恐惧中渐渐灭亡。”
    reason: διώλλυντο可表示“正在被毁灭”，也可侧重中间语态意义的“正在灭亡”；ἔντρομοι可连同理解为“在恐惧中”。
lexical_decisions:
- source_word: διώλλυντο
  choice: 正走向毁灭
  rationale: 未完成时中间/被动形式描写持续进行的毁灭或沉沦状态；译文保留过程性，又不明说施事者。
- source_word: ἔντρομοι
  choice: 战战兢兢
  rationale: 该形容词兼有恐惧与身体颤抖的意味；此译法自然、鲜明，并保持庄重。
- source_word: μηδαμόθεν φευκτόν
  choice: 无处可逃避的
  rationale: μηδαμόθεν与表示应当躲避、可以逃开的动词形容词φευκτόν结合，表达从任何方向都无法逃离；汉语以定语结构简洁呈现其不可逃避性。
- source_word: ἀέρα
  choice: 空气
  rationale: 采用该词在此处的通常含义，并保留原文刻意造成的奇异意象。
- source_word: προσιδεῖν
  choice: 看
  rationale: 表示朝向观看或注视；“看”是清楚自然的现代汉语，不额外解释为“面对”。
- source_word: ἀρνούμενοι
  choice: 甚至……也不肯
  rationale: 分词表达拒绝；“不肯”准确传达主动拒绝，“甚至……也”体现他们连空气都拒绝观看的极端程度。
theological_decisions:
- issue: 毁灭的性质与施事者
  choice: 译为持续走向毁灭的状态，不在正文中指明施事者
  alternative: 译成单纯的心理崩溃，或明确说是上帝毁灭他们
  rationale: 希腊语中间/被动形式在本分句没有明说施事者。上下文虽是神圣审判，译文仍保留本句在语法上的含混与神学张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“战战兢兢”保留恐惧和颤抖的双重形象；“那无处可逃避的空气”尽量保存希腊语修饰关系及其突兀意象。
