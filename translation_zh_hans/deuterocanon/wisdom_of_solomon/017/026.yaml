base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes man[c][b], but your word preserves those who trust in you.
translation:
  language: zh_hans
  text: 为要使你所爱的众子[a]明白：主啊，养活人的并不是农作物的出产[b]，而是你的话语保全那些信靠你的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众子”原文为阳性复数，也可按群体意义理解为“儿女”或“子民”。
    reason: 说明原文的语法性别及其可能具有的群体涵盖范围。
  - marker: b
    text: 或译：“果实的产物”“田地的收成”。原文指生长出来的农产，并不是字面意义的“世代”。
    reason: 保留γενέσεις τῶν καρπῶν的词义范围，并说明其农业语境。
  - marker: c
    text: 或译：“相信你的人”或“对你有信心的人”。
    reason: 保留πιστεύω与人称间接格连用时“相信”与“信赖”之间的语义幅度。
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: 为要使……明白
  rationale: ἵνα加虚拟式表示目的；“为要使……明白”既保留目的意味，也符合现代汉语表达。
- source_word: οἱ υἱοί σου
  choice: 你的众子
  rationale: υἱοί是阳性复数“儿子们”；“众子”保留原文形式，同时具有庄重而自然的经文语体。
- source_word: οὓς ἠγάπησας
  choice: 你所爱的
  rationale: 准确表达不定过去时ἠγάπησας；汉语无需强行标出英语式过去时，定语结构也自然顺畅。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格的直接称呼；“主啊”是现代汉语中庄重、清楚的呼语。
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: 并不是农作物的出产
  rationale: γενέσεις在此指生长出来的产品、收成或出产，并非谱系意义的“世代”；καρπῶν在上下文中指农作物或其果实。
- source_word: τρέφουσιν ἄνθρωπον
  choice: 养活人的
  rationale: τρέφω在此指供养、滋养或维持生命；“养活”清楚呈现食物维生的语境。单数ἄνθρωπον在此具有泛指意义，译作“人”可自然涵盖人类。
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: 而是你的话语
  rationale: ῥῆμα指所说的话、言语；“话语”保留神发言的意味，又不把含义限定为命令或法令。
- source_word: τοὺς σοὶ πιστεύοντας
  choice: 那些信靠你的人
  rationale: πιστεύω与人称代词间接格连用，可表达相信、信赖和倚靠；“信靠你”最自然地呈现这里个人倚赖的意味。
- source_word: διατηρεῖ
  choice: 保全
  rationale: διατηρέω表示保存、守护或维持；“保全”既与前面的生命供养形成对应，也保留其可能包含守护与维持的较宽含义。
theological_decisions:
- issue: “众子”的性别形式与群体指向
  choice: 你的众子
  alternative: 你的儿女／你的子民
  rationale: 原文υἱοί明确为阳性复数，因此正文保留“众子”；但此称呼在群体语境中可能涵盖上帝所爱的全体成员，脚注提示其实际指向，避免把范围武断地缩窄。
- issue: πιστεύοντας所表达的相信或倚靠
  choice: 信靠你的人
  alternative: 相信你的人／对你有信心的人
  rationale: 原文既可突出相信，也可突出对上帝的信赖。上下文论及上帝借话语保全人，“信靠”较能表达关系性的倚赖，同时以脚注保留其他可能。
- issue: 上帝话语的保全作用
  choice: 保全
  alternative: 维持生命／保存
  rationale: 原文διατηρεῖ的意义不必仅限于使人存活，也可包含保存和守护；“保全”避免将其过度限定，同时保留与物质食物形成的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”保留呼格；“养活”清楚表达食物维生的语境，“保全”则维持原文较宽的保存、守护和维持含义。句式保留原文“不是……而是……”的鲜明对照。
