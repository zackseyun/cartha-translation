base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/004.yaml
  text: For not even the inner chamber that held them kept them free from fear[a], but sounds that troubled them rang around them[b], and gloomy apparitions with unsmiling faces appeared.
translation:
  language: zh_hans
  text: 因为，连那容纳着他们的内室也不能使他们免于恐惧；扰乱他们的声响在他们四周回荡[a]，面容阴郁、毫无笑容的幽影[b]显现出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们四周回荡”所译的希腊语动词十分罕见，可能含有噪声反复环绕、轰响或回荡的意思。
    reason: lexical_alternative
  - marker: b
    text: “幽影”也可译作“幻影”或“幽灵般的形影”；原词指怪异、幽灵般的显现，并未明确说明其本质。
    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  choice: 内室
  rationale: 指隐蔽的内部空间或最里面的房间；“内室”自然地保留封闭、藏身之处的意味。
- source_word: ὁ κατέχων αὐτούς
  choice: 那困住他们的
  rationale: κατέχω表示容纳、扣住或限制；结合黑暗拘禁的语境，“困住”较“容纳”更能传达他们无法脱身的处境，但不明确外加施行拘禁者。
- source_word: ἀφόβως διεφύλασσεν
  choice: 不能使他们免于恐惧
  rationale: 按语境把副词与“守护、保全”合译，表达内室未能保护他们脱离恐惧，避免误解为内室本身“无所畏惧地守护”。
- source_word: ἦχοι ἐκταράσσοντες
  choice: 扰乱他们的声响
  rationale: 既保留声音这一宽泛指称，也呈现其使人惊扰不安的作用，不将程度过度强化为“吓破胆”。
- source_word: ἐτρεκόμπουν
  choice: 在四周回荡
  rationale: 这个罕见动词似乎描写反复环绕、轰响或回荡的噪声；译文保留其包围感，脚注说明词义的不确定范围。
- source_word: φάσματα
  choice: 幽影
  rationale: 表示怪异、幽灵般的显现；“幽影”保留超自然或幻象之间的开放性，不断定其实体性质。
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  choice: 面带阴沉、毫无笑容
  rationale: 分别保留κατηφῆ的阴郁低沉和ἀμειδήτοις的“不笑”这一具体面容描写。
- source_word: ἐνεφανίζετο
  choice: 向他们显现
  rationale: 表达变得可见、出现；“显现”适合此处诡异景象的语域，又不判定其来源。
theological_decisions:
- issue: φάσματα所指现象的性质
  choice: 译作“幽影”，不判定是客观存在的灵体还是恐惧所生的异象。
  alternative: 鬼魂、幽灵、幻象
  rationale: 原文描写可怕的显现，却没有明确规定其形而上性质；译文保留这种含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号呈现前后转折；视觉描写按汉语习惯重组为“面带阴沉、毫无笑容”，同时保留两项希腊语特征。所有脚注标记均置于对应正文之后。
