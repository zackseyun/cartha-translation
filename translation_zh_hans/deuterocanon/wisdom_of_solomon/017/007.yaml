  text: And the tricks of magical art were laid low, and the boast of wisdom was disgracefully exposed.
translation:
  language: zh_hans
  text: 巫术技艺的种种伎俩都倒下了；那凭着智慧而自夸的傲慢，也受到了使人蒙羞的揭露。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαγικῆς … τέχνης
  choice: 巫术
  rationale: 原文指施行魔法的技艺；现代汉语用“巫术”简洁自然，也避免译成中性的“魔术”而令人联想到表演戏法。
- source_word: ἐμπαίγματα
  choice: 伎俩
  rationale: 该词在这里指巫术所施展的花招或把戏；译作“伎俩”既保留贬义，也符合现代汉语表达。
- source_word: κατέκειτο
  choice: 败下阵来
  rationale: 原义有倒下、躺倒之意；在此描写巫术的伎俩被彻底挫败，以惯用语传达其低伏败落的形象。
- source_word: τῆς ἐπὶ φρονήσει ἀλαζονίας
  choice: 自夸有智慧
  rationale: ἀλαζονία表示夸耀、自负，ἐπὶ φρονήσει说明其所夸的是智慧或见识；此译保留行为主体未明说的结构。
- source_word: ἔλεγχος ἐφύβριστος
  choice: 遭到了羞辱性的揭露
  rationale: ἔλεγχος可指揭露、证伪或责斥，ἐφύβριστος含耻辱、凌辱意味；此译保留“被揭穿并蒙羞”的双重效果。
theological_decisions:
- issue: φρόνησις在本节中的语义
  choice: 智慧
  alternative: 见识／聪明
  rationale: 上下文针对术士自称具有特殊认知能力；“智慧”与原词及英语审校层相符，同时不把它限定为纯粹智力或实践判断。
- issue: ἔλεγχος的结果与行动含义
  choice: 揭露
  alternative: 斥责／证伪
  rationale: 原词语义范围包含揭穿、证明错误和责斥；“揭露”最自然地表达其虚妄公开显明，但不额外指明揭露者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前后两分句保持原文平行关系；不补出术士、上帝或其他未在本节明说的主语。
