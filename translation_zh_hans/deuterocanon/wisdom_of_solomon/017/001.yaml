base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/001.yaml
  text: For your judgments are great and hard to describe[c][b][a]; therefore undisciplined souls went astray.
translation:
  language: zh_hans
  text: 因为你的审判伟大而难以述说[a]；因此，未受教化[b]的心灵[c]走入了迷途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “难以述说”也可译作“难以讲明”“难以尽述”。原词表示难以充分叙说或解释，不一定指绝对无法描述。
    reason: lexical_alternative
  - marker: b
    text: “未受教化”也可译作“未受教导”或“缺乏训练”。原词兼有未受教育与缺少操练、规训之意。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“心灵”或“灵魂”；按汉语习惯也可理解为“人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλαι
  choice: 伟大
  rationale: 表示上帝审判的重大与崇高；“伟大”简洁自然，也不把含义收窄为单纯的能力或分量。
- source_word: κρίσεις
  choice: 审判
  rationale: 保留该词在圣经希腊语中的司法和神学意味；汉语中“审判”可作集合性表达，无须机械地标示复数。
- source_word: δυσδιήγητοι
  choice: 难以述说
  rationale: 该复合词指难以充分讲述或解释；“难以述说”保留其程度上的开放性，不强化为绝对不可言说。
- source_word: ἀπαίδευτοι
  choice: 未受教化
  rationale: 兼顾缺少教导、训练和品格塑造的含义，比单说“无知”更贴近《智慧篇》的道德—智识语境。
- source_word: ψυχαὶ
  choice: 心灵
  rationale: 保留希腊文明确使用“魂/心灵”的表达及其道德属灵色彩，同时比现代汉语中的“灵魂们”自然。
- source_word: ἐπλανήθησαν
  choice: 走入了迷途
  rationale: 表达陷入错误、偏离正路的结果，同时不武断指定是自己走错还是受外力迷惑。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 清楚表达由前句引出的因果或推论关系，简洁而符合现代汉语。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句与前文之间的解释性连接；虽然单独阅读时略显承接性，但符合原文篇章关系。
theological_decisions:
- issue: ψυχαὶ应直译为“灵魂/心灵”，还是按汉语习惯译为“人”
  choice: 心灵
  alternative: 人
  rationale: 原文特意使用ψυχαὶ，保留“心灵”可呈现其道德与属灵层面的语感；脚注同时说明可按集合意义理解为人。
- issue: ἐπλανήθησαν的被动形式是否应明确译作“被引入迷途”
  choice: 走入了迷途
  alternative: 被引入了迷途
  rationale: 希腊语形式可容许被动或结果性理解；正文避免擅自补出外在施动者，从而保留原文的含混。
- issue: ἀπαίδευτοι侧重缺乏知识还是缺乏道德训练
  choice: 未受教化
  alternative: 未受教导
  rationale: “教化”可同时涵盖教导、训练和品格养成，避免将其限制为纯粹的信息不足。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为”保留γὰρ与上文的承接关系；分号呈现原文前因后果的结构。“走入了迷途”避免将希腊语被动形式过度解释为明确的外力诱导。
