base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/018.yaml
  text: For all were bound with one chain of darkness—whether it was the whistling of wind[a], or the pleasant sound of birds among the leafy branches, or the rushing force of flowing water,
translation:
  language: zh_hans
  text: 因为众人都被一条黑暗的锁链捆住了。无论是风的呼啸[a]，还是茂密枝叶间悦耳的鸟鸣，或是水流猛烈奔涌的声响，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼啸的灵”。希腊词 πνεῦμα 可指“风”，也可指“灵”；这里与鸟声和流水声并列，译作“风”更符合上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ ... ἁλύσει σκότους
  choice: 同一条黑暗的锁链
  rationale: 保留“锁链”这一具体的束缚意象；工具与格由被动句中的“被……捆住”自然表达。μιᾷ 在此强调众人受同一锁链束缚。
- source_word: πάντες ἐδέθησαν
  choice: 众人都被……捆住了
  rationale: 保留希腊文的被动语态和囚禁意象，同时符合现代汉语表达。
- source_word: εἴ τε ... ἢ ... ἢ
  choice: 无论是……还是……或是
  rationale: 清楚呈现一连串可能引起恐惧的声响，并保留原文列举结构。
- source_word: πνεῦμα συρίζον
  choice: 风的呼啸
  rationale: πνεῦμα 可指“风”或“灵”；本节与鸟声、水声并列，语境更支持“风”。συρίζον 所表达的尖细呼啸声以“呼啸”自然传达。
- source_word: περὶ ἀμφιλαφεῖς κλάδους
  choice: 茂密枝叶间
  rationale: ἀμφιλαφεῖς 描写枝条繁茂、浓密；“茂密枝叶间”既呈现环境，也自然说明鸟声传来的位置。
- source_word: ὀρνέων ἦχος εὐμελής
  choice: 悦耳的鸟鸣
  rationale: εὐμελής 表示音调和谐悦耳；“鸟鸣”在汉语中比“鸟的声音”自然，又未增添原文没有的具体曲调内容。
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  choice: 水流奔涌的激荡声
  rationale: ῥυθμός 在此兼有有节律的运动及其声响之意，βίᾳ 强调水势有力；“奔涌的激荡声”兼顾动态和听觉层面。
theological_decisions:
- issue: 恐惧场景中 πνεῦμα 的含义
  choice: 风
  alternative: 灵；气息
  rationale: 紧接着列出鸟声和流水声，表明这里是一组自然界的声响；译作“风”最符合直接语境，同时以脚注保留词义上的真实歧义。
