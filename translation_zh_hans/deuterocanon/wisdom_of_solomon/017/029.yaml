base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
translation:
  language: zh_hans
  text: 因为忘恩之人的希望，必像冬日的霜一样消融，也必像无用的水一样流逝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无用的水”可能指水流失了，不能存留下来供人使用。
    reason: 说明这一比喻可能蕴含的意思，同时不把该解释写死在正文中。
lexical_decisions:
- source_word: ἀχαρίστου
  choice: 忘恩之人的
  rationale: 该属格单数形容词指缺乏感恩之心的人；“忘恩之人”在现代汉语中自然、明确，也保留原文的道德评价。
- source_word: ἐλπίς
  choice: 希望
  rationale: 此处采用该词最常见的意义“希望”，符合本节的道德诗歌语境。
- source_word: χειμέριος πάχνη
  choice: 冬日的霜
  rationale: 保留原文的冬季霜冻意象，同时避免生硬的逐词对应。
- source_word: τακήσεται
  choice: 必……消融
  rationale: 该动词表示融化、消解；“消融”与霜的意象搭配自然，并传达其消失无存。
- source_word: ῥυήσεται
  choice: 必……流逝
  rationale: 该动词表示流走；“流逝”既保留水流离去的画面，也符合庄重的诗体语域。
- source_word: ὕδωρ ἄχρηστον
  choice: 无用的水
  rationale: 直接保留ἄχρηστος“无用、派不上用场”的含义，不额外限定水为何无用。
theological_decisions:
- issue: ἀχαρίστου的道德定性
  choice: 忘恩之人
  alternative: 不知感恩的人；不敬虔的人
  rationale: 希腊词直接强调缺乏感恩，而不是泛指不敬虔；译文不扩大为原文没有明说的宗教类别。
- issue: “无用的水”的意象
  choice: 保留原文的简略表达
  alternative: 译作“流走而不能使用的水”
  rationale: 原文没有明确说明水无用的具体原因，故正文保存其含混性，仅在脚注提示一种可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式以“必……也必……”呈现希腊文两个将来时动词的对应关系；保留霜消融、水流逝的平行意象。
