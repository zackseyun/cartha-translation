base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/014.yaml
  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
translation:
  language: zh_hans
  text: 而他们正同睡一觉，那实在无力的黑夜[a]从无力的阴间深处临到他们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那实在不可抗拒的黑夜，从不可抗拒的阴间深处临到了他们。”希腊文在“黑夜”和“阴间”两处重复同一词根；其字面义为“无力的、没有能力的”，但在此语境中也可能指人无力抵抗，因而有“不可抗拒”的含义。
    reason: 说明原文重复的ἀδύνατος及其在本句中“无力的／不可抗拒的”的语义歧义。
lexical_decisions:
- source_word: ἀδύνατον / ἐξ ἀδυνάτου
  choice: 无力的／从无力的
  rationale: 原文两处重复同一形容词词根，基本义为“无力、没有能力”。中文也重复“无力”，以保留修辞上的呼应；在语境中也可能指人无法抗拒，故以脚注说明。
- source_word: ὄντως
  choice: 真正
  rationale: 保留该副词的强调作用，表达这黑夜确实具有所述性质。
- source_word: νύκτα
  choice: 黑夜
  rationale: “黑夜”自然、庄重，也符合本段阴森的意象。
- source_word: ᾅδου
  choice: 阴间
  rationale: 此处指死者所在之境；“阴间”是现代中文圣经语境中较自然的对应，不等同于后世教义意义上的“地狱”。
- source_word: μυχῶν
  choice: 深处
  rationale: 表达隐秘的内部或幽深之处，并保留原文的空间意象。
- source_word: ἐπελθοῦσαν
  choice: 临到了
  rationale: 表达黑夜来到并笼罩他们，贴近分词所描述的动作。
- source_word: τὸν αὐτὸν ὕπνον κοιμώμενοι
  choice: 睡着同一个觉时
  rationale: 较贴近原文“睡同一个睡眠”的表达，保留他们共同处于同一种睡眠状态的含义。
theological_decisions:
- issue: ᾅδου所指的死者领域
  choice: 阴间
  alternative: 地狱／冥府／死者之境
  rationale: “阴间”保留希腊文所指的死者领域，又避免把后世关于最终刑罚之地的特定教义直接带入本句。
- issue: ἀδύνατος在上下文中的语义张力
  choice: 正文译作“无力的”，脚注保留“不可抗拒的”可能性
  alternative: 两处均译作“不可抗拒的”
  rationale: 直译能保留同一词根的重复和原文反常、压缩的措辞；但语境可能暗示这黑夜是人所无力抵抗的，因此不应在正文中完全排除该理解。
translation_notes:
  register: 采用现代、庄重而可理解的书面普通话。此句在希腊文中是未完的从属结构，末尾保留逗号，以衔接下一节；不擅自补足主句。
