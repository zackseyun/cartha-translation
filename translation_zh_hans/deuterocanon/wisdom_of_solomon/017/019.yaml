base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/019.yaml
  text: or a harsh crash of rocks falling down[a], or the unseen rush of leaping animals, or the sound of the roaring of most savage beasts, or an echo thrown back from the hollow of the mountains[c][b], paralyzed them with fear.
translation:
  language: zh_hans
  text: 或是岩石坠落的刺耳轰响[a]，或是跳跃动物不见踪影的奔跑声[b]，或是最凶猛野兽的吼叫声，或是从群山的凹处反射回来的回声[c]，都会使他们吓得瘫软。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坠落”也可译作“被猛然抛下”。希腊语分词既可理解为向下坠落，也可能含有被用力投下的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译为“跳跃动物那看不见的奔跑（或行程）”。正文按上下文表达其未见踪影的奔跑所带来的动静。
    reason: lexical_alternative
  - marker: c
    text: 直译为“从群山的空凹处反射回来的回声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  choice: 刺耳的轰响
  rationale: κτύπος指撞击所发出的响声，ἀπηνής在听觉语境中表示严酷、猛烈；“刺耳的轰响”既传达声音的剧烈，也符合现代汉语表达。
- source_word: καταρριπτομένων πετρῶν
  choice: 岩石坠落时
  rationale: καταρρίπτω表示向下投掷或使之坠下；在此中间/被动分词既可泛指岩石坠落，也可能带有被猛然抛下的意味。正文采用自然且不作过度限定的“坠落”，脚注保留较强的可能译法。
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  choice: 跳跃动物那看不见的奔跑声
  rationale: σκιρτάω表示跳跃，δρόμος本义为奔跑或行程，ἀθεώρητος意为不能看见。上下文罗列令人恐惧的声响，因此以“奔跑声”自然传达其在语境中的听觉效果，同时用脚注说明原文较直译的结构。
- source_word: ὠρυομένων ἀπηνεστάτων θηρίων φωνή
  choice: 最凶猛野兽的吼叫声
  rationale: ὠρύομαι指野兽大声吼叫，ἀπηνεστάτων为最高级，表示极其凶狠或猛烈；“最凶猛野兽的吼叫声”保留最高级和声音意象。
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: 从群山深处反射回来的回声
  rationale: ἀντανακλωμένη表示反射、折返回来，κοιλότης指内部凹处或空处。“群山深处”在现代汉语中自然，并保留声音从山中空凹之处返回的图景。
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: 都会使他们吓得瘫软
  rationale: παραλύω表示使人失去力量、瘫软，ἐκφοβέω表示使人极度惊恐；此译把惊吓表达为导致瘫软的原因，简洁保留原文关系。
