base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/005.yaml
  text: And no force of fire prevailed to give light[a], nor did the brilliant flames of the stars endure to illumine that dreadful night.
translation:
  language: zh_hans
  text: 火的威力丝毫不能照明，群星那灿烂的火焰也不能持续照亮那可怕的黑夜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可怕的”也可译作“阴森的”或“可憎的”。希腊语这个词带有令人厌恶、恐惧的强烈意味。
    reason: 保留στυγνήν的多重感情色彩和词义幅度。
lexical_decisions:
- source_word: πυρὸς … βία
  choice: 火的任何威力
  rationale: 保留属格结构及“有效力量”的含义；“威力”在现代汉语中比“暴力”更符合此处火不能发挥照明效能的语境。
- source_word: οὐδεμία … κατίσχυεν
  choice: 都不能
  rationale: 表达“不具备足以成功的力量”，并以自然汉语体现未能奏效的持续状态。
- source_word: φωτίζειν
  choice: 发出光来
  rationale: 在此指火产生照明作用；译法自然，同时避免与后半句“照亮”完全重复。
- source_word: ἄστρων ἔκλαμπροι φλόγες
  choice: 群星灿烂的火焰
  rationale: 保留原文将星光描绘为明亮火焰的诗性意象。
- source_word: ὑπέμενον
  choice: 不能持续
  rationale: 体现ὑπομένω“坚持、持续、承受”的语义，而不把它简化为一般的“不能”。
- source_word: καταυγάζειν
  choice: 照亮
  rationale: 准确表达光照在对象上、使之明亮的含义，且符合现代汉语表达。
- source_word: στυγνὴν
  choice: 可怕的
  rationale: 该词含可憎、阴森、令人厌恶或恐惧的强烈感情色彩；正文采用自然而庄重的“可怕”，其他色彩在脚注中保留。
- source_word: νύκτα
  choice: 黑夜
  rationale: “黑夜”比单用“夜”更符合本节浓重黑暗的语境，又不额外解释其成因。
theological_decisions:
- issue: 灾祸语境中宇宙性黑暗的诗性描写
  choice: 保留火与星光均无法照亮黑夜的超常、诗性图景
  alternative: 将其解释为普通黑暗，或仅解释为人在恐惧中的心理感受
  rationale: 希腊文直接描写火的威力和群星的火焰都不能照明；译文不把这种张力限定为气象现象或纯粹心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“群星灿烂的火焰”这一诗性拟象，并以“不能持续”传达原文动词所含的坚持、承受意味。
