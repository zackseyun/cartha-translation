  text: For fear is nothing but the betrayal of the helps that come from reason[a].
translation:
  language: zh_hans
  text: 因为，恐惧无非是背弃理性所提供的帮助[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“背弃从思考所得的助力。”
    reason: 保留ἀπὸ λογισμοῦ可指由推理、思考而来的助力，以及βοηθήματα较具体的“助力”之意。
lexical_decisions:
- source_word: φόβος
  choice: 恐惧
  rationale: 表示一般的惧怕状态；“恐惧”庄重自然，又不至于像“恐怖”那样过度强化语气。
- source_word: οὐθὲν ... εἰ μὴ
  choice: 无非是
  rationale: 这一排除式结构意为“不是别的，只是”；“无非是”简洁地保留其界定和解释作用。
- source_word: προδοσία
  choice: 背弃
  rationale: 原词有背叛、弃绝之意。此处以“背弃”保留恐惧反过来抛弃内在助力的比喻，同时避免把行为过度道德化。
- source_word: βοηθημάτων
  choice: 帮助
  rationale: 指可供援助的资源或助力；中文用“帮助”自然易懂，并可涵盖希腊文复数所指的各种助益。
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: 理性所提供的
  rationale: ἀπό表示来源，λογισμός在此指理性思考或推理。“理性所提供的”清楚表达这些帮助源于理性判断。
theological_decisions:
- issue: λόγισμος所含的人论和哲学意味
  choice: 理性
  alternative: 思考；推理；理性思考
  rationale: 本节是在描述恐惧与理性资源之间的关系，并非提出特定教义。“理性”简洁自然；脚注保留“思考所得”这一较侧重思维过程的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“无非是背弃……”保留原文略带警句色彩的定义句式；脚注呈现λόγισμος偏重思考过程时的译法。
