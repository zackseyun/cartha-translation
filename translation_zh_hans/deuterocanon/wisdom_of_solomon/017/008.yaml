  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
translation:
  language: zh_hans
  text: 因为那些承诺要从患病的心灵中驱除恐惧和不安的人，自己反倒患着可笑的畏惧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可笑的胆怯”。希腊语 εὐλάβεια 在别处也可指“谨慎”，甚至“敬畏”，但在这里的语境中更可能带有负面意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  choice: 声称能
  rationale: 该分词可指承诺或表示愿意承担某事；此处指这些人自称有能力驱除恐惧。“声称能”自然地传达其宣称，并与下文的讽刺形成呼应。
- source_word: δείματα
  choice: 恐惧
  rationale: 复数名词指种种令人害怕之事或恐惧感；汉语用“恐惧”即可涵盖其心理意义。
- source_word: ταραχὰς
  choice: 慌乱
  rationale: 该词表示内心的搅扰、动荡或不安。“慌乱”与“恐惧”并列，突出心灵失序的状态。
- source_word: ἀπελαύνειν
  choice: 驱除
  rationale: 该不定式有赶走、逐出的意思；“驱除”简洁而有力度。
- source_word: ψυχῆς νοσούσης
  choice: 患病的心灵
  rationale: 保留ψυχή所指的内在生命以及νοσέω的疾病隐喻，不把它缩减为单纯的理智或思想。
- source_word: καταγέλαστον
  choice: 可笑的
  rationale: 该词意为值得嘲笑或招人讥笑；“可笑的”直接保留原文的讽刺和贬斥意味。
- source_word: εὐλάβειαν
  choice: 畏惧
  rationale: 该词在别处可表示谨慎、敬畏，但此处受“恐惧”“慌乱”及“可笑的”限定，应取负面的害怕、畏缩之义；“畏惧”既自然，也保留一定词义张力。
- source_word: ἐνόσουν
  choice: 患上了
  rationale: 与前面的“患病”重复疾病隐喻，显出反讽：自称医治他人心灵的人，自己反而患病。
theological_decisions:
- issue: εὐλάβεια在负面语境中的含义
  choice: 畏惧
  alternative: 谨慎；敬畏；胆怯
  rationale: 上下文谈论恐惧、慌乱和心灵患病，且该词受καταγέλαστον“可笑的”修饰。译作正面的“敬畏”会与语境冲突；“畏惧”保留负面意义，同时脚注交代其较宽的词义范围。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“心灵”保留原文的内在生命意象；“反倒”明确呈现原句的讽刺对照，但不额外引入教派性解释。
