  text: And he said to him[a], “I saw you, lord, like an angel of God, and my heart was troubled with fear because of your glory.”
translation:
  language: zh_hans
  text: 她对他说：“主上，我看见你如同上帝的天使，我的心因惧怕你的荣光而惊惶。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶδόν σε
  choice: 我看见你
  rationale: 不定过去时在这一叙事语境中表示一次已经发生的看见，简洁译为“我看见你”。
- source_word: κύριε
  choice: 主上
  rationale: 这里是对人间君王的直接尊称；“主上”既保留κύριε的敬称意味，也避免让人误以为受称呼者是上帝。
- source_word: ὡς ἄγγελον θεοῦ
  choice: 如同上帝的天使
  rationale: ὡς在此表达比较而非身份认定；“如同”清楚保留这种比拟，ἄγγελον θεοῦ则按其天上使者的意象译为“上帝的天使”。
- source_word: ἐταράχθη ἡ καρδία μου
  choice: 我的心……惊惶
  rationale: 保留“心”作为内在情感中心的希腊语表达；“惊惶”传达ταράσσω所指的内心震动，又不与后面的“惧怕”机械重复。
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: 因惧怕你的荣光
  rationale: ἀπό在这里指出内心惊惶的缘由；属格结构自然理解为对其荣光的惧怕。“荣光”兼顾δόξα在此可见威仪与崇高光彩的含义。
theological_decisions:
- issue: κύριε所称呼者的身份
  choice: 译作指向人间君王的尊称“主上”
  alternative: 译作“主”或“主啊”
  rationale: 上下文是以斯帖面对君王并向他说话，并非称呼上帝；采用“主上”可保留尊敬语气而不引入神性身份。
- issue: ὡς所表达的是比较还是身份认定
  choice: 译作“如同上帝的天使”，表达比较
  alternative: 译作“就是上帝的天使”
  rationale: ὡς在此构成明喻，强调君王显现出来的威荣令人敬畏，并不认定他本身就是天使。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“主上”符合臣民对君王的尊称语境；全句保持原文的情感张力，不把“荣光”弱化为一般的外貌或气派。主语“她”由以斯帖面对君王的上下文确定，因为希腊语动词εἶπεν本身不标明性别。
