  yaml_path: translation/deuterocanon/additions_to_esther/004/007.yaml
  text: '...entirely covered with gold and costly stones, and he was very terrifying. And lifting up his face, blazing with splendor at the height of anger, he looked; and the queen fell and changed color in faintness, and she bent down upon the head of the delicate maidservant who was going before her.'
translation:
  language: zh_hans
  text: ……全身满是黄金和贵重宝石[a][b]，显得极其可怕。他抬起那因威荣而如火炽烈的脸，在怒气最盛时注视着；王后便倒下，因虚脱而脸色改变[c]，并俯身在走在她前面的娇柔侍女头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文本在这里从一句描述的中间开始，开头没有完整保存；因此正文用省略号标明残缺，没有补作“他身穿”等文字。
    reason: textual_variant
  - marker: b
    text: 或译：“全身披金戴宝。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“她渐渐昏厥，脸色也变了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: 全身尽是黄金和贵重宝石
  rationale: 保留残存希腊文对整体外观的奢华描写，同时不擅自补出原文未明说的衣服或穿戴动作。
- source_word: φοβερὸς σφόδρα
  choice: 显得极其可怕
  rationale: 表达君王外貌给人强烈恐惧之感，也与前面的外观描写自然衔接。
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: 他抬起脸来
  rationale: 贴近原文具体的身体动作，并保留随后怒视的画面感。
- source_word: πεπυρωμένον δόξῃ
  choice: 那脸因威荣而如火炽烈
  rationale: 兼顾 πεπυρωμένον 的火焰意象与 δόξα 在君王场景中的荣光、威仪含义，避免理解为真的燃烧。
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: 怒气正盛
  rationale: 以自然简洁的现代汉语表达怒气达到强烈程度，保留 ἀκμή 的高峰或盛势之意。
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: 昏厥中脸色骤变
  rationale: 同时呈现外貌颜色变化与虚脱昏厥的状态，不把颜色具体限定为苍白。
- source_word: κατέκυψεν
  choice: 伏在
  rationale: 描写王后因昏厥而向下倒伏，不赋予主动敬拜或行礼的意味。
- source_word: ἅβρας
  choice: 柔弱侍女
  rationale: ἁβρά 可指娇柔、纤弱或精致；此处结合搀扶与昏倒场景，译为“柔弱”自然且不夸大身份。
- source_word: τῆς προπορευομένης
  choice: 走在她前面的
  rationale: 准确表达侍女在行列中先行于王后的位置。
theological_decisions:
- issue: 本节所给希腊文开头残缺，句子从描述中段开始
  choice: 以省略号起首，只翻译现存措辞，不补出主语的衣着动作
  alternative: 在正文补作“他身穿……”或“他的衣服……”
  rationale: 现有见证并未保存完整开头；明确标示残缺可避免把合理猜测当成经文本身。
- issue: δόξα 在君王怒容中的含义
  choice: 译为“威荣”并保留如火炽烈的意象
  alternative: 译为“荣耀”或解释成“威严使脸涨红”
  rationale: “威荣”兼含光辉与王者威仪，且不将形象过度生理化或神学化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“怒气正盛”“脸色骤变”等表达自然易懂；保留原文突兀、强烈的宫廷场景，并用脚注透明说明开头残缺。
