lexical_decisions:
- source_word: ἑτέρα
  choice: 另一个女子
  rationale: 阴性单数形式指另一名女性；中文补出“女子”，既显明原文的语法性别，也不进一步限定其身份。
- source_word: ἐπηκολούθει
  choice: 跟在后面
  rationale: 未完成过去时表示持续跟随；“跟在后面”自然保留其行进和随从意味。
- source_word: κουφίζουσα
  choice: 替她提着
  rationale: κουφίζω有使之变轻、减轻负担之意；以衣裳为宾语时，“提着”自然表达托起衣物、减轻穿衣者负担的动作。“替她”明确这一动作是为衣裳所属者减负。
- source_word: τὴν ἔνδυσιν αὐτῆς
  choice: 衣裳
  rationale: ἔνδυσις可指衣服、服饰，单数在此可作集合义；“衣裳”庄重自然，也适合被提起以减轻负担的语境。所属关系由“替她”表达。
- source_word: καὶ αὐτὴ
  choice: 她自己
  rationale: αὐτή在此带强调意味；“她自己”保留这一强调，同时不补写本分句之外的谓语。
