  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
translation:
  language: zh_hans
  text: 她穿过所有的门[a]进入后，站在王面前。王正坐在他王国的宝座上，身着一身彰显他威仪的全套华服。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译作“出入口”；在宫殿场景中，这个复数词可能指接连经过的多重门或出入口。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文本末尾在ἐνεδεΒ处突然中断；这显然是一个表示“穿着”或“穿上”的动词的残缺形式。译文依现存短语最可能的意思译出。
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: 进去
  rationale: 不定过去时分词在这里表示先于主句的动作；结合“穿过一道道门户”，自然表达为“进去”。
- source_word: πάσας τὰς θύρας
  choice: 穿过一道道门户
  rationale: θύρα可指门或出入口；宫廷场景中的复数暗示连续经过多重门禁。“一道道门户”既保留复数和行进感，也符合现代汉语。
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  choice: 站在王面前
  rationale: κατέστη在此指来到并取站立姿势；简洁译作“站在王面前”，符合觐见场景。
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: 他的国位
  rationale: 该属格结构直译近于“他王国的宝座”或“他王权的宝座”。“国位”保留王权与宝座的关联，也避免冗长。
- source_word: πᾶσαν στολὴν
  choice: 全套……礼服
  rationale: στολή指袍服或正式衣装，πᾶσαν在此可表达整套装束；“全套礼服”适合宫廷语境。
- source_word: τῆς ἐπιφανείας αὐτοῦ
  choice: 彰显他威仪的
  rationale: ἐπιφάνεια在此强调外显的光辉和盛仪，不采用后期神学术语义；“彰显他威仪”自然传达可见的王者威荣。
- source_word: ἐνεδεΒ
  choice: 身穿
  rationale: 所提供的希腊文本在此残缺，但开头显然属于表示穿上或穿着的动词形式；译文按最可能的句义处理，并以脚注注明文本状况。
