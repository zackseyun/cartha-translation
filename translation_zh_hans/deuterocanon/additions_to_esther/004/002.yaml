    reason: cultural_note
lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  choice: 她显露在人前时
  rationale: 该短语表示她从隐而不显转为公开露面。“显露在人前”保留“变得可见、显现”的基本含义，同时符合现代汉语表达；不把它引申为“显赫”或“容光焕发”。
- source_word: ἐπικαλεσαμένη
  choice: 呼求
  rationale: 此处的中间语态分词指在祷告中呼唤、求告上帝。“呼求”兼顾宗教语境、庄重语体和现代可懂性。
- source_word: τὸν πάντων ἐπόπτην θεὸν
  choice: 那位鉴察万有的上帝
  rationale: ἐπόπτης指观看、监察或看顾者。“鉴察万有”保留其普遍而主动的察看含义，也避免把它误读为教会职分意义上的“监督”。
- source_word: σωτῆρα
  choice: 救主
  rationale: σωτήρ可指拯救者、救援者；“救主”保持原文庄严的神学称谓，并与“上帝”共同指向同一位受呼求者。
- source_word: παρέλαβεν
  choice: 带上
  rationale: 在此行动语境中，παραλαμβάνω表示将随行者带在身边或带着同行。“带上”比单纯的“领受”或“拿取”更准确自然。
- source_word: τὰς δύο ἅβρας
  choice: 两个侍女
  rationale: ἅβρα在此指陪伴以斯帖的年轻女仆或女侍从。“侍女”简洁、庄重，并清楚表达其随侍身份。
theological_decisions:
- issue: ἐπόπτην、θεὸν与σωτῆρα之间的关系
  choice: 那位鉴察万有的上帝和救主
  alternative: 那位鉴察万有、施行拯救的上帝
  rationale: 原文以一个冠词统摄“上帝”和“救主”，最自然地把两者理解为同一位受呼求者的称谓。译文保留“上帝和救主”两个并列名号，不把“救主”弱化为一般性的行动描述。
- issue: “鉴察万有”所表达的神圣属性
  choice: 鉴察万有
  alternative: 看顾万有；洞察一切
  rationale: “鉴察”兼有察看与审视的含义，能够表达ἐπόπτης的主动观看；但原词也可能侧重看顾或遍察，因此以脚注保留其他可行表达，不额外界定其具体神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“显露在人前”略带书面色彩，以贴近希腊语的显现含义；“呼求”“鉴察万有”“救主”维持祷告语境的庄严感。分词关系处理为“……时，……，便……”，自然呈现先后相连的动作，同时不把时间间隔说得过强。
