  text: And when she had become visible[a], having called upon God, the overseer of all and Savior, she took the two maids[c][b],
translation:
  language: zh_hans
  text: 当她出现在人前时[a]，呼求那位鉴察万有[b]的上帝和救主，便带上两个侍女[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她露面时。”希腊语可指她从不显露转为公开出现。
    reason: lexical_alternative
  - marker: b
    text: “鉴察万有”也可译作“看顾万有”或“洞察一切”。
