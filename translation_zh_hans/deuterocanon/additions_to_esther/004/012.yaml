translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。原文主语仅由动词形式承接，但上下文明确是王，译文补出“王”以符合汉语叙事习惯。未为ἠσπάσατο添加脚注，因为正文“亲吻”在当前语境中最贴切；其较宽泛的“问候”义不足以构成必须标示的实质歧义。
