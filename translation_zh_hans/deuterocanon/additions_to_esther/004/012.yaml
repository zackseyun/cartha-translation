  text: And lifting up the golden scepter[a], he placed it on her neck, and kissed her and said, “Speak to me.”
translation:
  language: zh_hans
  text: 王举起金杖，把它放在她的颈项上，亲吻了她[a]，对她说：“跟我说话吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向她问候”。这个希腊动词可指问候；但此处的上下文较支持具体的亲吻动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρας
  choice: 举起
  rationale: 该不定过去时分词表示先于后续主要动作发生的举动；“举起”自然、具体，也符合金杖的动作场景。
- source_word: χρυσῆν ῥάβδον
  choice: 金杖
  rationale: ῥάβδος 可指棍、杖或权杖；王宫语境带有王权含义。中文《以斯帖记》的叙事传统常用“金杖”，既简洁又能体现其礼仪性。
- source_word: ἐπέθηκεν
  choice: 放在
  rationale: ἐπιτίθημι 在此表示将金杖置于她的颈项上；“放在”准确而自然，不额外解释动作含义。
- source_word: ἐπὶ τὸν τράχηλον αὐτῆς
  choice: 在她的颈项上
  rationale: 直译该介词短语；“颈项”庄重且易懂，并保留原文所指的身体部位。
- source_word: ἠσπάσατο
  choice: 亲吻
  rationale: ἀσπάζομαι 常可泛指问候，但在这里以她为直接宾语，并与身体动作相连，“亲吻”较符合具体场景。
- source_word: Λάλησόν μοι
  choice: 对我说吧
  rationale: 保留命令式邀请的直接性；句末“吧”使现代汉语自然，也表现王准许并鼓励她开口，而不增添具体内容。
