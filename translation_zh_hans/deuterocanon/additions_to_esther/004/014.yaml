  yaml_path: translation/deuterocanon/additions_to_esther/004/014.yaml
  text: For you are wonderful[a], Lord, and your face is full of grace.
translation:
  language: zh_hans
  text: 因为你奇妙非凡，主啊，你的面容满有恩惠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的面容满有恩惠”也可译作“你的同在充满恩宠”或“你的面容满有恩慈”。
    reason: 说明 πρόσωπον 与 χάρις 的词义范围及可行译法。
lexical_decisions:
- source_word: θαυμαστὸς
  choice: 奇妙非凡
  rationale: 该词表示令人惊叹、值得赞叹。“奇妙非凡”在现代汉语中自然庄重，也保留敬畏和赞叹的意味。
- source_word: κύριε
  choice: 主啊
  rationale: 这是祷告中对上帝的直接称呼；“主啊”准确体现呼格语气，也符合现代汉语圣经体裁。
- source_word: πρόσωπόν
  choice: 面容
  rationale: 原词的直接意义是“脸、面容”。译作“面容”保留原文拟人化的具体意象，而不将其抽象化为“同在”。
- source_word: χαρίτων
  choice: 恩惠
  rationale: χάρις 的复数可指恩惠、恩宠或种种美善特质。汉语“恩惠”可作集合性表达，与“满有”搭配自然，并避免把含义局限为外在魅力。
- source_word: μεστόν
  choice: 满有
  rationale: 该形容词意为“充满”。“满有恩惠”简洁、自然，并保留原文“充满某物”的结构。
theological_decisions:
- issue: 描述上帝时使用“你的面容”这一拟人化表达
  choice: 保留“你的面容”
  alternative: 你的同在
  rationale: 希腊文直接使用 πρόσωπον。保留具体意象，不以抽象神学措辞消解原文的张力。
- issue: 描述主的面容时如何表达 χάρις
  choice: 恩惠
  alternative: 恩宠；恩慈
  rationale: 此处 χάρις 的复数具有恩惠、恩宠或美善特质等语义空间。“恩惠”既保留神学共鸣，也不把原文过度限定为某一种系统化含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“奇妙非凡”传达赞叹意味；“面容”保留原文意象；全句按汉语呼告习惯安排“主啊”的位置。
