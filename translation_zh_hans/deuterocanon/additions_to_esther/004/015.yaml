lexical_decisions:
- source_word: ἐν δὲ τῷ διαλέγεσθαι αὐτήν
  choice: 她正说着话
  rationale: 该结构表示动作进行期间；διαλέγεσθαι在此语境中自然译为“说着话”，不额外限定谈话对象或方式。δέ承接叙事，汉语无需机械译出。
- source_word: ἔπεσεν
  choice: 倒下了
  rationale: 保留“跌落、倒下”的直接动作含义；结合人物因虚弱失力的语境，“倒下”比单纯“跌倒”自然，也不扩大为失去知觉。
- source_word: ἀπὸ ἐκλύσεως
  choice: 因虚弱
  rationale: ἀπό在此表达原因；ἔκλυσις指体力衰竭、虚弱无力。译作“因虚弱”既保留原因关系，也避免将原文明确化为“昏厥”。
