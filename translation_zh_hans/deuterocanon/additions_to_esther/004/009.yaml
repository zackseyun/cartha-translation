  text: And he said to her[a], “What is it, Esther? I am your brother[b]; take courage.”
translation:
  language: zh_hans
  text: 他对她说：“以斯帖，怎么了？[a]我是你的兄弟；[b]鼓起勇气来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以斯帖，是什么事？”
    reason: lexical_alternative
  - marker: b
    text: “兄弟”也可作较宽泛的亲属称谓，译作“亲族”。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ἐστιν
  choice: 怎么了？
  rationale: 这是现代汉语中自然、直接的问法，符合此处关切对方情状的语境；希腊文也可较字面地译作“是什么事？”，故以脚注保留。
- source_word: ἀδελφός
  choice: 兄弟
  rationale: 希腊词通常直指“兄弟”，也可能宽泛指亲族。正文保留其直接的亲属称谓，不在翻译中擅自限定具体关系。
- source_word: θάρσει
  choice: 鼓起勇气来
  rationale: 准确传达现在时命令语气所表达的勉励与安慰，在现代汉语中自然有力。
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: 我是你的兄弟
  rationale: 译出显式代词ἐγώ所带的强调，并将希腊文名词短语自然处理为完整汉语判断句，保留说话者安慰、保证的语气。
theological_decisions:
- issue: 说话者对以斯帖所用的亲属称谓
  choice: 正文译作“兄弟”
  alternative: 可理解为“亲族”或“亲人”
  rationale: 原文明确使用ἀδελφός。尽管该词在语境中可能有较宽泛的亲属含义，正文仍保留字面称谓，并以脚注呈现另一种理解，避免替读者消解关系上的歧义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“怎么了”体现直接关切，“鼓起勇气来”保留命令式的勉励力度；标点使人物话语清晰流畅。
