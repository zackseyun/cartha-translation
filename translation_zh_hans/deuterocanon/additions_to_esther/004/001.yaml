base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/004/001.yaml
  text: And it happened on the third day[a], when she had stopped praying, that she took off the garments of her service and put on her splendor[b];
translation:
  language: zh_hans
  text: 到了第三天，她祷告完毕，就脱下服侍时所穿的衣服[a]，穿上自己的华服[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服侍”也可译作“侍候”或“敬拜”。希腊词可指服侍、侍奉或敬虔操练。
    reason: lexical_alternative
  - marker: b
    text: 直译“她的荣耀”或“她的荣华”；这里很可能指她华美的王室服饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγενήθη
  choice: 到了
  rationale: 这是叙事推进公式；结合后面的时间语，用“到了”自然引出第三天发生的事，又不采用古雅生硬的“事情发生了”。
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 第三天
  rationale: 这是标准时间表达，现代汉语自然译为“第三天”。
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: 她祷告完毕
  rationale: 表达祷告已经停止或结束，且先于随后换衣的动作；“完毕”比“停止”更符合此处自然语境，但不额外说明祷告的内容。
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: 脱下……衣服
  rationale: 准确表达脱去所穿衣物的动作，语言清楚自然。
- source_word: τῆς θεραπείας
  choice: 服侍时所穿的
  rationale: θεραπεία可指服侍、侍候或敬拜操练；正文采用含义较宽的“服侍”，并以脚注保留其他可能。
- source_word: περιεβάλετο
  choice: 穿上
  rationale: 在衣着语境中是自然、简洁的现代汉语表达。
- source_word: τὴν δόξαν αὐτῆς
  choice: 自己的华服
  rationale: 字面为“她的荣耀/荣华”，此处与换衣相连，最自然是指彰显王后荣华的华美服饰；“华服”清楚传达具体语境，脚注保留字面表达。
theological_decisions:
- issue: τῆς θεραπείας所指的衣着性质
  choice: 译作“服侍时所穿的衣服”，保持“服侍”的宽泛含义。
  alternative: “敬拜时所穿的衣服”或“侍候时所穿的衣服”
  rationale: 紧接“祷告完毕”可能暗示敬虔操练，但希腊词本身并不限定为正式敬拜；正文不把较宽的词义收窄为特定礼仪。
- issue: τὴν δόξαν αὐτῆς是抽象荣耀还是王室华服
  choice: 按换衣语境译作“自己的华服”。
  alternative: “她的荣耀”或“她的荣华”
  rationale: 动作“穿上”表明这里以荣耀或荣华指可见的华美装束。正文采用现代汉语可理解的具体表达，同时由脚注保留原文修辞及可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到了第三天”顺畅承接叙事；“祷告完毕”简洁表达先行动作；衣着用语具体易懂。正文中的脚注标记与脚注内容一一对应。
