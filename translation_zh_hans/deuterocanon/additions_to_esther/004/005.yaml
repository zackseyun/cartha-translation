translation:
  language: zh_hans
  text: 她正值美貌盛时，脸涨红了[a]；她神色欢悦，仿佛亲切可人[b]，心却因恐惧而紧缩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她在美貌达到顶峰时涨红了脸。”希腊文将“涨红”与“美貌正值盛时”连在一起。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她面容明朗，仿佛惹人喜爱。”原文可表达亲爱、可爱或令人喜欢之意，并以“仿佛”保留比较或表象的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρυθριῶσα
  choice: 面泛红晕
  rationale: 该现在分词描写外表泛红；“面泛红晕”在现代汉语中自然，也保留可理解为羞红或气色泛红的空间。
- source_word: ἀκμῇ κάλλους αὐτῆς
  choice: 正值美貌盛时
  rationale: ἀκμή表示顶峰、盛期，与κάλλος连用指美貌达到盛时；此译简洁而保留“处于巅峰”的意象。
- source_word: τὸ πρόσωπον αὐτῆς ἱλαρόν
  choice: 她神色欢悦
  rationale: ἱλαρός可指欢悦、明朗、和悦；“神色欢悦”比单说“脸很快乐”更符合现代汉语表达，并保留外在表情的意味。
- source_word: ὡς προσφιλές
  choice: 仿佛亲切可人
  rationale: ὡς保留表象或比较意味；προσφιλής兼有亲爱、可爱、讨人喜欢之义。“亲切可人”适合修饰面容，同时不把它硬定为“被爱”。
- source_word: ἡ καρδία αὐτῆς ἀπεστενωμένη
  choice: 心却……紧缩
  rationale: ἀπεστενωμένη带有受压、收紧的身体性隐喻；“心……紧缩”保留这一形象，而不泛化为普通的“忧愁”。
- source_word: ἀπὸ τοῦ φόβου
  choice: 因恐惧
  rationale: ἀπό在此表达来源或原因；“因恐惧”是自然、直接的汉语。
