base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/004/008.yaml
  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: zh_hans
  text: 神使王的心转为温和[a]。王焦急万分，从宝座上一跃而起，把她抱在怀中，直到她恢复过来[b]，又用温言安慰她[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”直译“灵”，也可译作“心态”或“性情”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到她镇定下来。”
    reason: lexical_alternative
  - marker: c
    text: “用温言”也可译作“用和平的话”或“用使人安心的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέβαλεν
  choice: 使……转为
  rationale: 表达内在状态发生转变，并清楚保留神是这一转变的直接施动者。
- source_word: τὸ πνεῦμα τοῦ βασιλέως
  choice: 王的心
  rationale: 此处 πνεῦμα 指王内在的心态或性情；“心”在现代汉语中自然简洁，同时保留内在层面的含义。脚注列出更贴近字面的译法。
- source_word: εἰς πραΰτητα
  choice: 转为温和
  rationale: πραΰτης 表示温和、柔和；“温和”贴合王由严厉转向柔和的语境，不引入额外道德评价。
- source_word: ἀγωνιάσας
  choice: 焦急万分
  rationale: 该分词表达强烈的焦虑和忧急；此译法保留情绪强度，也与王随即跃起的动作自然衔接。
- source_word: ἀνεπήδησεν
  choice: 一跃而起
  rationale: 传达动作突然且迅速向上，符合叙事的紧迫感。
- source_word: ἀνέλαβεν αὐτὴν ἐπὶ τὰς ἀγκάλας αὐτοῦ
  choice: 把她抱在怀中
  rationale: 自然呈现王扶起并拥抱以斯帖的具体动作，语体庄重而不生硬。
- source_word: μέχρις οὗ κατέστη
  choice: 直到她恢复过来
  rationale: καθίστημι 在此语境中指从昏厥或失态中恢复稳定；“恢复过来”保留一定开放性，不具体限定为恢复意识或站稳。
- source_word: παρεκάλει
  choice: 安慰
  rationale: 在以斯帖惊惧昏倒的语境中，该动词指以言语抚慰、劝慰；“安慰”准确自然。
- source_word: λόγοις εἰρηνικοῖς
  choice: 用温言
  rationale: 该短语字面涉及“和平”的话语，在此功能上是温和、使人安心的话；“温言”简洁庄重，脚注保留字面及功能性译法。
theological_decisions:
- issue: 神改变王的内在状态
  choice: 神使王的心转为温和
  alternative: 神改变了王的灵，使之温柔
  rationale: 希腊文明确把王态度的转变归因于神；正文保留这一直接神学陈述，同时用现代汉语自然表达 πνεῦμα 在此处所指的内在心态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一跃而起”“抱在怀中”保留动作的鲜明性；以两个句子承载希腊文的连续长句，使中文流畅，同时不改变事件顺序和因果关系。
