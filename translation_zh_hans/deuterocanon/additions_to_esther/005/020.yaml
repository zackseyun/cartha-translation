  text: and to strengthen them[a], so that they might defend themselves against those who attacked them in the time of distress, on the thirteenth day of the twelfth month, Adar[b], on that same day.
translation:
  language: zh_hans
  text: 并且加强他们的力量[a]，使他们能在患难之时[b]抵御攻击他们的人，在第十二月，即亚达月，十三日那同一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加强他们的力量”也可译作“支持他们”或“加强他们”。
    reason: lexical_alternative
  - marker: b
    text: “在患难之时”也可较宽泛地理解为“在遭难的时候”或“在困苦之时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπισχύειν
  choice: 增援
  rationale: 表示在原有力量之外再给予支持或加强；“增援”契合敌对行动的语境，也保留共同加强其力量的含义。
- source_word: ὅπως
  choice: 使
  rationale: 引出目的，现代汉语中简洁自然。
- source_word: ἐν καιρῷ θλίψεως
  choice: 在患难之时
  rationale: 保留“时刻、时期”与“压迫、苦难”的庄重语气，不把所指限缩为某一种具体灾祸。
- source_word: ἐπιθεμένους
  choice: 攻击……的人
  rationale: 该分词在此表示敌意袭击；“攻击”符合现代汉语，并保留军事或暴力语境。
- source_word: ἀμύνωνται
  choice: 抵御
  rationale: 中间语态表达为自身防护而行动；“抵御”既体现防卫，也不额外加入法律层面的解释。
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: 十二月亚达月十三日
  rationale: 明确保留亚达为第十二月，并按现代汉语日期表达习惯排列。
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: 就在……那一天
  rationale: “就”体现原文对同一指定日期的强调。
