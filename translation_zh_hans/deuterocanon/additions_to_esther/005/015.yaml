  yaml_path: translation/deuterocanon/additions_to_esther/005/015.yaml
  text: But we find that the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals, but are governed by most righteous laws,
translation:
  language: zh_hans
  text: 但我们查明，那些被那个三重受咒诅的人交付以遭毁灭的犹太人[a]并不是恶徒，反而按最为公正的律法生活[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三重受咒诅的人”原文是一个异常强烈的辱称，也可译作“那个极其受咒诅的人”或“那个三重受诅咒的人”。
    reason: lexical_alternative
  - marker: b
    text: “按……律法生活”也可译作“遵行……律法”；原文动词可指依照这些律法安排并实践共同体或公民生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: δέ承接上文并形成转折；“但我们”自然保留诏令中纠正先前判断的语气。
- source_word: τοὺς ... Ἰουδαίους
  choice: 犹太人
  rationale: 此处指波斯宫廷背景中的犹太族群及其宗教共同体；“犹太人”是现代汉语中清楚而通行的称呼。
- source_word: ὑπὸ τοῦ τρισαλιτηρίου
  choice: 被那个三重可诅咒之人
  rationale: τρισαλιτήριος是极强烈的贬称，近于“三重受咒诅的”；“那个……之人”既补明人的所指，也保留鄙斥语气。
- source_word: παραδεδομένους εἰς ἀφανισμόν
  choice: 交付、任其灭亡
  rationale: παραδίδωμι表示交在他者权势或某种结局之下，ἀφανισμός表示毁灭、消除；该译法保留被动交付及其致命目的。
- source_word: εὑρίσκομεν
  choice: 我们查明
  rationale: 在王家诏令和司法复核语境中，此词表达审查后所得的结论；“查明”比单纯“发现”更符合文体。
- source_word: οὐ κακούργους ὄντας
  choice: 并不是恶徒
  rationale: κακοῦργος可指作恶者或罪犯；“恶徒”兼顾道德与法律指控，避免将含义限缩为已经定罪的“罪犯”。
- source_word: δικαιοτάτοις ... νόμοις
  choice: 至为公正的律法
  rationale: δικαιότατος为最高级，兼有正直、公义和司法公正之意；“至为公正”保留其最高级力度及法律伦理色彩。
- source_word: πολιτευομένους
  choice: 遵行
  rationale: 该中动态词表示按某种秩序生活、履行共同体或公民生活；与νόμοις连用时，“遵行……律法”在现代汉语中自然，并保留主动生活实践的含义。
theological_decisions:
- issue: δικαιοτάτοις在法律—伦理语境中的表达
  choice: 至为公正的律法
  alternative: 至为公义的律法
  rationale: “公正”在汉语中更直接兼顾法制与伦理判断，同时没有排除“公义”的道德内涵；此处不应把一般性的法律伦理评价强化为特定教义术语。
- issue: πολιτευομένους的语态与共同体生活含义
  choice: 遵行至为公正的律法
  alternative: 按至为公正的律法生活／受至为公正的律法治理
  rationale: 希腊文强调主体依这些律法安排并实践其共同生活，而非单纯被动受治理；“遵行”简洁地保留这一主动含义，脚注交代其公民生活色彩。
translation_notes:
  register: 采用庄重而可读的王家诏令语体。“查明”体现复核后的官方结论；“反而”清楚呈现οὐ ... δέ的对照。句末保留逗号，因为希腊原句在此继续，属于跨节长句。所有脚注标记均已置于正文相应位置。
