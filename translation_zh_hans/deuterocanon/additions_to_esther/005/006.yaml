lexical_decisions:
- source_word: κακοηθείας
  choice: 恶意
  rationale: 该词指恶劣品性所表现出的敌意或恶毒；“恶意”简洁自然，并符合此处的道德语气。
- source_word: ψευδεῖ
  choice: 虚假的
  rationale: 该形容词直接修饰“推断”，表明这种推断不真实、会使人误入歧途。
- source_word: παραλογισμῷ
  choice: 推断
  rationale: 该词可指错误的计算或谬误性的推理；“推断”保留认知过程，也与同根分词形成自然呼应。
- source_word: παραλογισαμένων
  choice: 误判了
  rationale: 该分词与 παραλογισμῷ 同根，表示因错误推理而得出错误判断；“误判了”清楚表达其及物方向。
- source_word: ἐπικρατούντων
  choice: 掌权者
  rationale: 该分词指占优势或行使权力的人；“掌权者”是自然、宽泛的现代汉语表达，不限定为某一正式官职。
- source_word: ἀκέραιον
  choice: 纯正的
  rationale: 该词在此修饰善意，表达不掺杂、未受败坏的性质；“纯正”保留其完整无杂的含义。
- source_word: εὐγνωμοσύνην
  choice: 善意
  rationale: 该名词可表示善良友好的态度、仁厚或感激；在此以上位者为发出者，“善意”比“感激”更合乎语境。
theological_decisions:
- issue: τὴν τῶν ἐπικρατούντων ἀκέραιον εὐγνωμοσύνην 中属格短语的句法作用
  choice: 理解为掌权者所具有的纯正善意
  alternative: 理解为对掌权者所怀的纯正感激
  rationale: 最直接的句法理解是把 τῶν ἐπικρατούντων 视为修饰 εὐγνωμοσύνην 的主观属格；结合该名词可指仁厚、友善的态度，此读法在上下文中更连贯。另一读法语法上较不自然，语境支持也较弱。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因恶意而作虚假的推断”保留原文名词结构及因果关系；“误判”与“推断”在汉语中不能复制希腊文同根形式，故在脚注中说明。
