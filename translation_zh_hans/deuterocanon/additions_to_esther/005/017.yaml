lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  choice: 所以……就是做得妥当
  rationale: 保留οὖν的推论关系，并以自然的现代汉语表达καλῶς ποιήσετε这一带有温和劝告意味的将来时结构。
- source_word: μὴ προσχρησάμενοι
  choice: 若不采用
  rationale: 该否定中间语态分词说明“做得妥当”的方式或条件；“采用”既可指利用文书，也可在此行政语境中暗含不据此执行，而不把含义限定为“服从”。
- source_word: τοῖς ... γράμμασιν
  choice: 那些文书
  rationale: γράμματα在王室行政语境中指已发出的书面公文；“文书”比一般的“信件”更切合此处，同时未具体化为“命令”。
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου
  choice: 哈曼之子哈米大他所发出的
  rationale: 按上下文及专名传统，将Ἁμαδάθου理解为哈曼父名的属格，并用汉语“哈曼之子……”结构表达；被动施事关系译为“所发出的”。
- source_word: ἀποσταλεῖσι
  choice: 所发出的
  rationale: 体现不定过去被动分词修饰文书，并符合向各地颁发王室公文的语境。
