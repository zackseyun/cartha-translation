  yaml_path: translation/deuterocanon/additions_to_esther/005/012.yaml
  text: But[a], unable to bear his arrogance, he made it his aim to deprive us of both our position and our life.
translation:
  language: zh_hans
  text: 可是，他不能忍受这种傲慢，便蓄意要剥夺我们的权位和性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权位”（ἀρχή）也可译作“统治权”“职位”或“权柄”；“性命”（πνεῦμα）也可直译作“灵”或“气息”。
    reason: 保留 ἀρχή 与 πνεῦμα 的词义范围；正文按政治谋害的语境译为“权位”和“性命”。
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: 容忍不了
  rationale: 该不定过去时分词中的 φέρω 按惯用法表示“忍受、容忍”；此译自然表达其原因性背景，又不把它误作身体上的“承受”能力。
- source_word: τὴν ὑπερηφανίαν
  choice: 那人的狂傲
  rationale: ὑπερηφανία 指傲慢、狂妄或高傲。“狂傲”保留鲜明的贬义；希腊文没有明说所属者，故以“那人的”顺应语境指称，同时避免译成主语自己的傲慢。
- source_word: ἐπετήδευσεν
  choice: 便一心图谋
  rationale: 该动词可指刻意追求、设法或以某事为目标。“一心图谋”表现蓄意的谋划，但没有暗示图谋已经成功。
- source_word: τῆς ἀρχῆς
  choice: 我们的权位
  rationale: ἀρχή 在政治语境中可指统治权、职权或职位。“权位”兼顾权力和地位，避免限定为某一具体官职。
- source_word: στερῆσαι
  choice: 夺去
  rationale: στερέω 表示使人丧失、剥夺。“夺去”在中文中直接有力，并能同时支配“权位”和“性命”。
- source_word: ἡμᾶς
  choice: 我们的
  rationale: 希腊文以“我们”为被剥夺者；中文把人称关系分别落实在被夺之物上，更符合自然表达。
- source_word: καὶ τοῦ πνεύματος
  choice: 和性命
  rationale: πνεῦμα 本可指灵、气息或生命气息；与丧失权位并列的政治威胁语境最自然地指丧命，故译“性命”，并以脚注保留词义范围。
theological_decisions:
- issue: 政治威胁语境中 πνεῦμα 的含义
  choice: 性命，即生命气息
  alternative: 灵；气息
  rationale: “夺去权位和 πνεῦμα”呈递进关系，最自然是从政治地位到生命本身。译作“性命”不把后期关于非物质之灵的观念强加给此处，同时脚注保留原词可能的直译。
- issue: τὴν ὑπερηφανίαν 所指的归属
  choice: 那人的狂傲
  alternative: 他的狂傲；这狂傲
  rationale: 希腊文只有定冠词，没有所有格。语境要求它指主语所不能容忍的另一人的狂傲；采用“那人的”使中文可读，却不额外点名该人物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事公文语体。“可是……便……”清楚呈现转折与因由；“一心图谋”表达蓄意企图，不暗示已经得逞。
