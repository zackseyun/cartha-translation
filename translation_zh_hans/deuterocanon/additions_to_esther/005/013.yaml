  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: zh_hans
  text: 他借着错综诡诈的计谋[b]，请求毁灭末底改——我们的拯救者、又一直施恩于我们的人——以及无可指责、有分于王权的以斯帖，并连同他们的全体同胞一并毁灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救者”也可译作“救主”或“保全者”。这里指末底改曾施行拯救、保全他人，并非专门的神学称号。
    reason: lexical_alternative
  - marker: b
    text: “错综诡诈的计谋”概括了原文几个语气强烈的贬义词，含有手段盘曲复杂、蓄意设计和欺骗谬诈之意。
    reason: lexical_clarification
lexical_decisions:
- source_word: σωτῆρα
  choice: 救主
  rationale: 直译该名词，同时由脚注说明这里按普通语义指拯救、保全人的人，并非专门称号。
- source_word: διὰ παντὸς εὐεργέτην
  choice: 一向施恩于我们的
  rationale: 保留持续性的时间意味，并以现代汉语自然表达曾不断带来益处、作出贡献的人。
- source_word: ἄμεμπτον
  choice: 无可指责的
  rationale: 体现道德和法律层面无可非难的含义，比“完美无瑕”更不过度。
- source_word: τῆς Βασιλείας κοινωνὸν
  choice: 与王权同享尊荣
  rationale: κοινωνός表示有分、共享者；Βασιλεία在此可指王权、王室地位或国度。正文采用适合宫廷语境的表达，同时避免把以斯帖写成共同执政者。
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: 连同他们的全族
  rationale: τούτων自然回指末底改和以斯帖；ἔθνος在灭族语境中译作“全族”，比“国家”更符合现代汉语。
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: 用错综诡诈的计谋
  rationale: 综合表达原文中盘曲复杂、蓄意设计和欺骗谬诈的贬义语气。
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: 请求将……一并毁灭
  rationale: 保留“提出请求”及其指向毁灭的目的结构，而不弱化为一般性的“谋求”。
theological_decisions:
- issue: 以“救主”称末底改
  choice: 正文译为“救主”，脚注限定为普通的拯救者意义
  alternative: 拯救者；保全我们的人
  rationale: σωτήρ并非只能作神学专称；此处是在叙事和宫廷语境中称末底改为施行拯救、保全的人。
- issue: Βασιλεία所指为何
  choice: 译作“王权”，并以“同享尊荣”表达参与关系
  alternative: 国度；王室地位；王位
  rationale: 原文可涉及国度、王权或王室身份，不宜武断解释为与王共同统治；当前译法保留宫廷身份和共享地位的张力。
- issue: “他们的全族”的回指
  choice: 视为末底改与以斯帖共同所属的民族
  alternative: 他的民族；这些人的民族
  rationale: 复数指示词τούτων最自然地回指前述两人，并将他们与受毁灭威胁的犹太民族相连。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。“一向施恩于我们”保留宫廷谕旨的赞誉口吻；“请求将……毁灭”维持希腊文分词与目的短语的结构。所有脚注标记均置于正文中。
