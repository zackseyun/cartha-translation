revisions:
- from: 他用错综诡诈的计谋，请求将我们的救主[a]、一向施恩于我们的末底改，以及与王权同享尊荣、无可指责的以斯帖，连同他们的全族，一并毁灭。[b]
  to: 他借着错综诡诈的计谋[b]，请求毁灭末底改——我们的拯救者、又一直施恩于我们的人——以及无可指责、有分于王权的以斯帖，并连同他们的全体同胞一并毁灭。[a]
  rationale: 修订避免对王权关系增添“尊荣”这一解释性内容，并将“全族”改为“全体同胞”以准确表达整体民族。调整末底改的称谓以符合现代汉语的非专门语境，并将脚注b移至其实际解释的短语后。脚注a保留“救主”作为可行译法，说明其在本处的非专门意义。
