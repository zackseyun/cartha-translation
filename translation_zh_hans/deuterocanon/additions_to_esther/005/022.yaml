  text: And so you also[a], on your appointed festivals, keep a notable day with every kind of feasting,
translation:
  language: zh_hans
  text: 所以，你们也要在你们那些有名号的节期中[a]，以各样宴乐庆祝一个隆重的日子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你们指定的节期中”，或“在你们纪念性的节期中”。希腊文直译为“在你们有名称（或名号）的节期中”，指这些节期带有名称或称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: 所以，你们也要
  rationale: “所以”表达 οὖν 的推论作用，“也”保留 καί 与 ὑμεῖς 所带出的承接和强调；补出“要”以自然承载后面的命令语气。
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: 在自己那些有特定名称的节期中
  rationale: ἐπώνυμος 的基本意思是“有名称、带有名号的”。译文保留这一不寻常的表达，不直接将其限定为“指定的”或“纪念性的”，并用脚注列出语境中可能的理解。
- source_word: ἐπίσημον ἡμέραν
  choice: 把这一天当作隆重的日子
  rationale: ἐπίσημος 表示显著、受标记或隆重。“隆重的日子”符合节庆语境；“这一天”按上下文指所吩咐纪念的日子，使中文表达完整自然。
- source_word: μετὰ πάσης εὐωχίας
  choice: 以各样宴乐
  rationale: εὐωχία 主要指宴饮、欢宴及节庆享乐；“宴乐”兼顾设宴与欢乐，πάσης 译作“各样”。
- source_word: ἄγετε
  choice: 庆祝
  rationale: 此处 ἄγω 指举行、度过或守节。“庆祝”在现代汉语中自然地表达对节日的隆重遵守。
