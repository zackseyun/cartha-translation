  text: because the very man who had brought about these things was crucified at the gate of Susa with his whole household[a], since God, who rules over all, swiftly repaid him with the punishment he deserved,
translation:
  language: zh_hans
  text: 因为正是那造成这些事的人，在书珊的城门旁同他全家上下被钉在木架上[a]；掌管万有的上帝迅速向他施行了他所应得的刑罚，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被钉在木桩上”或“被挂在木架上”。希腊语动词可指在木桩或十字形刑具上处死；这里所指的波斯处刑方式未必与后来罗马人的钉十字架相同。
    reason: 保留ἐσταυρῶσθαι所指刑具及处刑方式的词义不确定性。
lexical_decisions:
- source_word: διὰ τὸ
  choice: 因为
  rationale: 引出前文所述事情的原因，保留原文的因果说明作用。
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  choice: 那一手造成这些事的人
  rationale: “一手”自然传达 αὐτόν 的强调意味；“造成这些事”保留 ἐξεργασάμενον 对阴谋实施及其后果的含义，而不过度具体化。
- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: 在书珊城门口
  rationale: πρός 加与格表示在……旁或近处；汉语“城门口”自然表达这一地点。Σούσων 采用中文圣经传统中通行的地名“书珊”。
- source_word: ἐσταυρῶσθαι
  choice: 被钉在木架上
  rationale: 该动词可指钉十字架、钉木桩或悬挂于刑具；鉴于波斯处刑背景，正文采用较宽泛的表达，并以脚注保留具体方式的不确定性。
- source_word: σὺν τῇ πανοικίᾳ
  choice: 和他全家一同
  rationale: πανοικία 指整个家户；“全家”简洁自然，在语境中可涵盖其家属及家中成员。
- source_word: τὴν καταξίαν
  choice: 照他所应得的
  rationale: 表达与其行为相称、理当承受之意，并与 κρίσιν 合成自然的汉语司法表述。
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: 掌管万有的上帝
  rationale: ἐπικρατέω 表示拥有权势、制胜或统管；“掌管万有”清楚而庄重地保留上帝的主权。
- source_word: διὰ τάχους
  choice: 迅速
  rationale: 以自然的副词形式准确表达快速施行之意。
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: 以刑罚报应了他
  rationale: ἀποδίδωμι 带有偿还、按行为施报之意，κρίσις 在此司法语境中指惩罚性的裁断；“报应”保留回报性质，“刑罚”明确其审判结果。
theological_decisions:
- issue: 上帝在审判中的主动作用
  choice: 明确表述掌管万有的上帝迅速施行了相称的刑罚报应
  alternative: 弱化为此人只是受到应得的刑罚，不明确指出上帝的施行
  rationale: 原文的属格独立结构直接把迅速施行报应归于上帝；译文保留这一施事关系，但不把它扩展成经文未明说的系统教义。
- issue: 刑罚的相称性
  choice: 照他所应得的刑罚
  alternative: 给予他审判
  rationale: τὴν καταξίαν 与 κρίσιν 共同突出裁断与罪行相称；译为“所应得的刑罚”保留其惩罚性和司法色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“书珊”沿用通行圣经地名；“上帝”用于 θεός。“一手造成”传达强调而不显生硬。句末保留逗号，以反映本节在原文中属于尚未结束的长句。
