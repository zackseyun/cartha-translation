translation:
  language: zh_hans
  text: 善用各种变化，并且总是明辨眼前的事，以更宽厚的方式加以应对。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρώμενοι ταῖς μεταβολαῖς
  choice: 善用时势的变化
  rationale: χρώμενοι 表示“利用、运用”，μεταβολαῖς 表示“变化、变动”；结合诏书式语境，加“时势”使现代汉语自然，同时保留顺应变化之意。
- source_word: τὰ δὲ ὑπὸ τὴν ὄψιν ἐρχόμενα
  choice: 眼前发生的事
  rationale: 直译为“来到视线之下的事”，自然汉语可表达为“眼前发生的事”，指呈现在面前、需要处理的情况。
- source_word: διακρίνοντες
  choice: 判断
  rationale: 该词可指分辨、辨别或作出判断；此处采用范围较宽的“判断”，不把它收窄为单纯辨识。
- source_word: ἀεὶ μετʼ ἐπιεικεστέρας ἀπαντήσεως
  choice: 总以更宽厚的态度
  rationale: ἐπιεικεστέρας 为比较级，含更温和、宽厚、通情达理之意；ἀπάντησις 在此指面对或应对事情的方式，译作“态度”较符合现代汉语搭配。
