lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 指文书的抄本或复制件；“副本”符合现代汉语的公文语境。
- source_word: ἐπιστολῆς
  choice: 信
  rationale: ἐπιστολή通常指书信；虽处于官方诏令语境，仍不宜径自扩译为“谕旨”。
- source_word: ἐκθέντες
  choice: 张贴
  rationale: 此处指将文书陈列发布，供公众看见；“张贴”自然地表达这一行政行为。
- source_word: ἐν παντὶ τόπῳ
  choice: 在各处
  rationale: 保留原文逐处分布的意思，同时符合现代汉语表达。
- source_word: μετὰ παρρησίας
  choice: 公开
  rationale: 在公布文书的语境中，παρρησία强调公开、不受遮掩，而非心理上的勇敢。
- source_word: ἐᾶν
  choice: 准许
  rationale: 表达官方许可，语体庄重，适合王室公文语境。
- source_word: χρῆσθαι
  choice: 遵行
  rationale: 字面为“使用”，但与律例或惯例搭配时，“遵行”更符合自然汉语，并准确表达依其规范生活和行事。
- source_word: τοῖς ἑαυτῶν νομίμοις
  choice: 自己的律例
  rationale: νόμιμα兼有法律、规例和既定习俗之义；“律例”既保留规范性，也不把范围限定为成文法律。
