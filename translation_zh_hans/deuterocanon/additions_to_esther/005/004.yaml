base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: zh_hans
  text: 他们不但从人间夺去感恩之心，又因那些被视为极其高尚之人的夸口[a]而心高气傲，竟以为自己能逃脱那位时刻察看万事、恨恶邪恶之上帝的审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些被视为极其高尚之人”所对应的希腊词形在文本和词义上都有困难；它很可能指被认为格外良善或高贵的人。
    reason: textual_variant
  - marker: b
    text: “审判”也可译作“公正的惩处”或“刑罚”；原文一词兼有司法裁决和惩罚的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  choice: 感恩之心
  rationale: 此名词表示感谢、感恩；在“夺去”的搭配中，“感恩之心”比单说“感谢”更自然，也保留其抽象含义。
- source_word: ἀνταναιροῦντες
  choice: 夺去
  rationale: 表达剥夺、拿走之意；“夺去”保留动作的力度，又不武断地译成“毁灭”。
- source_word: κόμποις
  choice: 夸口
  rationale: 可指夸耀、浮夸之言；“夸口”在现代汉语中清楚地传达傲慢自夸的意味。
- source_word: ἐπαρθέντες
  choice: 心高气傲
  rationale: 被动分词字面有“被抬高”之意，此处指因骄傲而自高；用成语化表达使中文自然，并保留道德贬义。
- source_word: ἀπεράγἀθων
  choice: 那些被视为极其高尚之人
  rationale: 传世词形异常，词义和文本均有困难；译文谨慎表达其大概所指，即被认为格外良善或高贵的人，而不掩盖不确定性。
- source_word: κατοπτεύοντος
  choice: 时刻察看万事
  rationale: 该分词表示观察、注视，并由ἀεί与τὰ πάντα限定为持续而全面的察看。
- source_word: μισοπόνηρον
  choice: 恨恶邪恶
  rationale: 此形容词意为“憎恨恶事的”；在中文中改作修饰上帝的动词短语，既自然又保留其道德力度。
- source_word: δίκην
  choice: 审判
  rationale: 此处指他们自以为能够逃避的司法性追究；“审判”保留司法与惩罚两方面的可能含义。
theological_decisions:
- issue: 上帝被描述为全面察看并反对邪恶
  choice: 那位时刻察看万事、恨恶邪恶之上帝
  alternative: 那位永远洞察一切、憎恨恶事的上帝
  rationale: 希腊文以紧凑结构并列上帝的持续察看与对邪恶的憎恶；译文保留这两个属性，不引入后期神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“心高气傲”自然表达因夸口而自高；对异常词形用“被视为”保留语义与文本上的不确定性。
