    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτεταγμένους
  choice: 那些归我们管辖的人
  rationale: 该分词指被置于权柄之下的人；此译保留从属关系，同时不把其政治身份过度限定为“臣民”。
- source_word: ζητοῦσι κακοποιεῖν
  choice: 想加害
  rationale: 这一结构表示企图对人行恶或造成伤害；“想加害”在现代汉语中自然、简洁，并保留主动作恶之意。
- source_word: κόρον
  choice: 富足
  rationale: κόρος可指饱足、过量或富足到令人骄纵的状态；上下文侧重他们不能正确承受优裕处境，“富足”可读性较好，而脚注保留“饱足、过度丰裕”的词义范围。
- source_word: οὐ δυνάμενοι φέρειν
  choice: 承受不了
  rationale: 直译其不能承担、忍受某种处境的意思，也自然衔接“富足”。
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: 自己的恩人
  rationale: εὐεργέτης指施恩、行善于人的人；“恩人”准确而符合现代汉语习惯，并保留反身代词所强调的忘恩负义。
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: 甚至还企图谋害
  rationale: ἐπιχειρέω表示着手或企图，μηχανάομαι表示设计、图谋；因对象是人，“谋害”自然呈现敌对图谋，但不限定具体手段。
