  text: so that both now and after these things there may be deliverance for us and for the Persians who are well-disposed toward us[a], but for those plotting against us[b], a memorial of destruction.
translation:
  language: zh_hans
  text: 好使如今和此后，我们和那些对我们怀有善意的波斯人都蒙拯救[a]；至于那些图谋害我们的人，却有毁灭的纪念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“保全”或“解救”；希腊词 σωτηρία 可涵盖这些意思，此处很可能指从现实危险中得以保存。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“毁灭的纪念”，也可能意为“使毁灭长久被记住”。希腊文表达紧缩；结合上下文，这毁灭很可能与图谋者有关，但原文没有明说所属关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: 好使
  rationale: 引出目的或预期结果；“好使”自然保留原文向前指向的语气。
- source_word: καὶ νῦν καὶ μετὰ ταῦτα
  choice: 如今和此后
  rationale: 简洁呈现“现在及这些事以后”的时间并列，也保留修辞上的对应。
- source_word: σωτηρία
  choice: 蒙拯救
  rationale: 此处主要指在政治危难中得到保全；“拯救”既可表达具体脱险，也不排除该词较宽的救助含义。
- source_word: εὐνοοῦσιν
  choice: 对我们怀有善意的
  rationale: 准确表达友好、善意的态度，不把这些人过度具体化为盟友或支持者。
- source_word: Πέρσαις
  choice: 波斯人
  rationale: 与“我们”同受 σωτηρία 支配，指对他们怀有善意的波斯人。
- source_word: ἐπιβουλεύουσιν
  choice: 图谋害我们
  rationale: 体现暗中策划并带有敌意的含义；补出“害”使现代汉语清楚自然。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 保留某事被长久记住或成为纪念的庄重意味，不将其具体解释为警戒或碑记。
- source_word: ἀπωλείας
  choice: 毁灭
  rationale: 表达灾难性的败亡或覆灭，符合上下文的严肃司法语气。
theological_decisions:
- issue: 次经宫廷叙事中 σωτηρία 的译法
  choice: 拯救
  alternative: 救恩；解救；保全
  rationale: 语境着眼于人民及友善者脱离现实危险。“拯救”能涵盖具体保全，又不强行限定为系统神学意义上的“救恩”。
- issue: μνημόσυνον τῆς ἀπωλείας 的紧缩表达
  choice: 留下他们毁灭的纪念
  alternative: 成为毁灭的纪念；留下毁灭的记忆；成为他们覆灭的警戒
  rationale: 希腊文结构简练，所属关系略有含混。正文以合乎汉语的方式指向图谋者的毁灭，脚注同时保留较为直译且不明确所属对象的可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“如今和此后”保留原文的时间对举；分号呈现对蒙拯救者与图谋者命运的鲜明对比。正文为汉语清晰度补出“他们”，脚注说明希腊文在所属关系上的紧缩与含混。
