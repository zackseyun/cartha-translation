lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该复数形容词在此作名词用，泛指许多人；译法直接、自然。
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: 因……莫大的善意
  rationale: 与被尊重相连的与格短语可表示原因或凭借；“莫大”体现最高级 πλείστῃ，“善意”保留 χρηστότης 所含的仁厚、恩慈之意。
- source_word: τῶν εὐεργετούντων
  choice: 恩待他们之人的
  rationale: 现在分词指向他们行善、施惠的人；用“恩待他们之人”比单用“恩人”更贴近其动作性。
- source_word: πυκνότερον
  choice: 越发
  rationale: 该比较级副词本可表示更频繁或更密集；在此与受尊重的情形相连，译作“越发”能自然表达程度递增，同时不把语义限定为单纯频率。
- source_word: τιμώμενοι
  choice: 受到尊重
  rationale: 准确传达 τιμάω 的被动分词；“尊重”在现代汉语中自然，并可涵盖被看重、受礼遇。
- source_word: μεῖζον ἐφρόνησαν
  choice: 越发自高自大
  rationale: 字面为“思想更大的事／看得更高”，在此是自视过高、骄傲自大的习语；“自高自大”清楚表达其负面道德含义，而脚注保留较直译的可能。
