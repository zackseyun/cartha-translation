base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/011.yaml
  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: zh_hans
  text: 我们对各民族所怀的仁厚，竟达到这样的地步：他被尊为我们的父亲，受众人俯伏致敬[a]，并一直居于仅次于王位的地位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受众人敬拜。”这里的希腊词可指向尊长俯伏行礼，也可指宗教性的敬拜。
    reason: 保留προσκυνέω在宫廷礼敬与宗教敬拜之间的词义幅度；正文按当前宫廷语境采用“俯伏致敬”。
lexical_decisions:
- source_word: ἔτυχεν ἧς ἔχομεν
  choice: 我们……竟达到
  rationale: 原句措辞略显生硬，τυγχάνω与属格搭配有获得、享有之意；结合ἧς ἔχομεν，译文以“达到”表达所享有的仁厚达到某种程度，同时保留结果结构。
- source_word: φιλανθρωπίας
  choice: 仁厚
  rationale: 指对人的仁慈、宽厚或善意；“仁厚”符合诏书的庄重语体，也比抽象的“人道”更贴合此处。
- source_word: πρὸς πᾶν ἔθνος
  choice: 对各民族
  rationale: πρός加宾格表示仁厚所指向的对象；ἔθνος在帝国政治语境中指各民族或各族群。
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: 竟达到这样的地步：
  rationale: 该结构引出程度及其结果；此译法自然地衔接后面的三个不定式，并保留强调意味。
- source_word: ἀναγορεύεσθαι
  choice: 被尊为
  rationale: 该词表示公开宣告、正式称为；“被尊为父亲”兼顾公开称号与宫廷尊崇语境。
- source_word: πατέρα
  choice: 父亲
  rationale: 直译亲属称谓，不以“庇护者”或“恩主”等解释性称谓替换。
- source_word: προσκυνούμενον
  choice: 受众人敬拜
  rationale: 该分词可指俯伏致敬，也可指敬拜；正文采用较为直接且保留神学张力的“敬拜”，脚注说明宫廷语境下也可理解为俯伏致敬。
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: 居于仅次于王位的地位
  rationale: 希腊文是生硬的宫廷表达，字面近于“王家宝座的第二人物”；译文表达其权位仅次于君王，同时避免汉语中“第二个人”可能造成的误解。
- source_word: διατελεῖν
  choice: 一直居于
  rationale: διατελέω带有持续、始终处于某状态的意味；译作“一直居于”保留其延续性。
theological_decisions:
- issue: προσκυνούμενον在宫廷语境中的含义
  choice: 正文译作“受众人敬拜”并加脚注
  alternative: 受众人俯伏致敬；受众人尊崇
  rationale: 该动词的语义范围包括向尊长俯伏行礼和对神明的敬拜。宫廷语境倾向于臣属礼敬，但原词本身的力度不宜在正文中完全淡化；因此采用“敬拜”，并由脚注明确其可能指向人间权贵所行的俯伏礼，避免断言这里是在赋予神性。
- issue: πατέρα作为政治称号
  choice: 保留“父亲”
  alternative: 恩主；庇护者
  rationale: 原文明确使用“父亲”，虽在王室修辞中含庇护者意味，仍应保留其比喻性亲属称号，不将解释写入正文。
translation_notes:
  register: 采用现代、庄重的诏书语体。“仁厚”“被尊为”“仅次于王位”便于普通读者理解，又保留宫廷政治色彩。正文的脚注标记[a]紧随存在词义歧义的“敬拜”之后。
