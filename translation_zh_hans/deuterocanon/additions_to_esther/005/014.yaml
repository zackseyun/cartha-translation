  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
translation:
  language: zh_hans
  text: 因为他以为，凭着这些手段，在使我们荒凉凋敝[a]之后，他会把波斯人的统治权转交给马其顿人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在使我们被弃置、无人照应之后。”希腊语短语λαβὼν ἡμᾶς ἐρήμους较为含蓄，可指使“我们”处于被弃置、荒凉或凋敝的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  choice: 因为……凭这些手段
  rationale: 保留γάρ所表达的解释关系；τρόποι在政治谋划的语境中指所采用的方式或手段，译作“手段”自然且不过度强化为阴谋。
- source_word: ᾠήθη
  choice: 他以为
  rationale: 该动词表示主观判断或设想；“以为”简明地传达其未必属实的盘算。
- source_word: λαβὼν ἡμᾶς ἐρήμους
  choice: 一旦使我们陷入荒凉
  rationale: λαβών与作表语的ἐρήμους构成较难直译的惯用表达，表示先使“我们”处于荒凉、凋敝的状态；“一旦”体现这一行动相对于转移统治权的先行关系。
- source_word: ἐρήμους
  choice: 陷入荒凉
  rationale: ἐρήμους可指荒凉、被弃或凋敝。此处“我们”具有集体意义，译为“陷入荒凉”保留宽泛的毁坏含义，也不强行限定为地理荒地。
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  choice: 波斯人的统治权
  rationale: ἐπικράτησις指支配、统治或优势地位；“统治权”既贴近政治语境，也避免将其具体化为原文未明说的“帝国”。
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  choice: 把……转到马其顿人手中
  rationale: μετάξει表示转移或移交；中文用“转到……手中”自然表达统治权从一方落入另一方。
- source_word: τοὺς Μακεδόνας
  choice: 马其顿人
  rationale: 直接保留原文族名，不泛化为“希腊人”，也不改译为地域或国家名称。
theological_decisions:
- issue: 希腊文增补中的历史政治表述
  choice: 按原文直译波斯人与马其顿人之间统治权的转移
  alternative: 概括为“把波斯王国交给希腊人”
  rationale: 原文明确点名波斯人与马其顿人，并使用表示统治权转移的措辞；译文不以较宽泛的后世历史称谓加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“统治权”保持政治语体；“一旦……就能……”使希腊文分词所表达的先行动作在中文中清楚自然。脚注保留λαβὼν ἡμᾶς ἐρήμους在受弃与荒凉之间的语义张力。
