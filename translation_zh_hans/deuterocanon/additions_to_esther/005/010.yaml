  yaml_path: translation/deuterocanon/additions_to_esther/005/010.yaml
  text: For Haman son of Hammedatha[a], a Macedonian, being alien to the true Persian blood and far removed from our goodwill, though he had been received by us as a guest[b],
translation:
  language: zh_hans
  text: 因为哈曼——哈米大他的儿子、一个马其顿人[a]——实非波斯人的后裔[b]，又与我们的仁厚相去甚远，尽管我们曾接待他为宾客，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“马其顿人”。这一族属称谓出自希腊文增补，可能反映其历史背景或传承中的论战性表述。
    reason: cultural_note
  - marker: b
    text: 这里的希腊文句法较难确定；大意是哈曼并非波斯人的后裔。也可译作“与真正的波斯血统无分”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: 哈曼是哈米大他的儿子
  rationale: 属格在此最自然地表示父子关系；用“……的儿子”清楚保留人物身份。
- source_word: Μακεδὼν
  choice: 是个马其顿人
  rationale: 原文明确以族属或地域称谓指认哈曼，译文予以保留，不将其弱化为泛称“外族人”。
- source_word: ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος
  choice: 他实在不是波斯血统
  rationale: 原文形式与句法较为困难；“实在”保留ἀληθείας可能具有的强调意味，“不是波斯血统”则自然表达ἀλλότριος与“波斯人的血”所指的血缘疏离。
- source_word: πολὺ διεστηκὼς
  choice: 相去甚远
  rationale: 表达完成时分词所呈现的持续疏离状态，也保留程度副词“很、远为”的力度。
- source_word: τῆς ἡμετέρας χρηστότητος
  choice: 与我们的仁厚
  rationale: χρηστότης在王室诏书语境中指仁慈、厚待或宽厚；“仁厚”兼具庄重和可懂性。
- source_word: ἐπιξενωθεὶς ἡμῖν
  choice: 虽曾被我们接纳为宾客
  rationale: 被动分词表示受到款待、成为宾客；结合上下文以“虽”显出让步关系，但不把它改写成独立主句。
theological_decisions:
- issue: 希腊增补中哈曼的马其顿人身份
  choice: 在正文中保留“马其顿人”
  alternative: 淡化为“外族人”或视为后加评语而省略
  rationale: 现存希腊文本明确作Μακεδών。翻译应忠实呈现该见证，即使这一称谓带有历史或论战色彩。
- issue: ταῖς ἀληθείας与“波斯人的血”的句法关系
  choice: 译作“实在不是波斯血统”，并以脚注说明困难
  alternative: 译作“与真正的波斯血统无分”
  rationale: 希腊语形式不规则，ἀληθείας未必自然地直接修饰“血统”。将其处理为强调性的“实在”，既避免武断加入“真正的”，也保留原文强调哈曼并非波斯血统的基本意义。
translation_notes:
  register: 采用现代、庄重而易懂的诏书语体。“哈米大他”依希腊文Ἁμαδάθου音译；末尾保留逗号，因为本节在原文中是尚未结束的从属结构，将在后文续接。
