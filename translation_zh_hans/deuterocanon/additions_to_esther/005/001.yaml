  yaml_path: translation/deuterocanon/additions_to_esther/005/001.yaml
  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: zh_hans
  text: '以下是这封信的副本：


    大王亚达薛西致从印度到埃塞俄比亚的一百二十七个总督辖区的各地长官，以及认同我们立场的人[a]：问安。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“思想我们的事”，意思是认同、支持或倾向于王所代表的一方。
    reason: 说明希腊语政治立场用语的字面形式及语义范围。
lexical_decisions:
- source_word: ἀντίγραφον τῆς ἐπιστολῆς τὰ ὑπογεγραμμένα
  choice: 以下是这封信的副本
  rationale: 按公文引介语的整体功能翻译；“副本”准确表达书面文件的誊本，“以下”自然传达“写在下面的内容”。
- source_word: Βασιλεὺς μέγας Ἀρταξέρξης
  choice: 大王亚达薛西
  rationale: “大王”保留波斯帝王称号的正式色彩；“亚达薛西”采用现代中文圣经语境中通行的人名形式。
- source_word: τοῖς ἀπὸ τῆς Ἰνδικῆς ἕως τῆς Αἰθιοπίας ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις χωρῶν ἄρχουσι
  choice: 致从印度直到埃塞俄比亚的一百二十七个总督辖区内各地的长官
  rationale: 保留地理范围、数目及波斯行政区划的层次；用“总督辖区”表达 σατραπείαις，比泛称“省”更能体现历史行政背景，同时以“各地的长官”表达 χωρῶν ἄρχουσι。
- source_word: τοῖς τὰ ἡμέτερα φρονοῦσι
  choice: 与我们同心的人
  rationale: 该短语直指在立场、事务或利益上赞同王室的一方。“与我们同心”既自然，又避免把原文较含蓄的政治倾向过度限定为正式效忠。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的固定问候语；“问安”符合中文正式书信语体，也比字面译作“喜乐”准确。
