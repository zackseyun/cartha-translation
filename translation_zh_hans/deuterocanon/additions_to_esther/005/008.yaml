    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχειν
  choice: 留意
  rationale: 表示把注意力转向、考虑；与后面的时间性短语连用，既保留“关注”的基本义，也自然含有顾及后果之意。
- source_word: τὰ μετὰ ταῦτα
  choice: 此后将发生的事
  rationale: 指这些事之后的情形或结果；加入“将发生”明确其面向未来的时间意义。
- source_word: Βασιλείαν
  choice: 国度
  rationale: 可指疆域、王国，也可指王权或统治；“国度”保留其较宽泛的政治含义，不强行限定为领土或抽象王权。
- source_word: ἀτάραχον
  choice: 安定无扰
  rationale: 表示不受骚乱、动荡或搅扰；在政治语境中，“安定无扰”兼顾状态与语体。
- source_word: τοῖς πᾶσιν ἀνθρώποις
  choice: 所有人
  rationale: ἀνθρώποις泛指人类，并非专指男性；“所有人”准确保留普遍范围。
- source_word: μετʼ εἰρήνης
  choice: 享有和平
  rationale: 直译为“带着和平/在和平中”；结合παρέξεσθαι的供给、使之可得之义，中文用“享有和平”较自然，并保留和平惠及众人的意思。
- source_word: παρέξεσθαι
  choice: 使……享有
  rationale: 未来中态不定式表示提供、使某物可得；此处译为“使……享有”，自然表达统治者使国度以安定和平的状态临到众人。
theological_decisions:
- issue: Βασιλείαν所指是疆域还是王权
  choice: 正文采用含义较宽的“国度”
  alternative: 王国；王权；统治
  rationale: 希腊词本身可指政治疆域或君王统治，语境未要求排除其中任何一义，因此不在正文中过度限定，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句子是上下文中未完的并列结构，末尾保留逗号。将ἀτάραχον处理为“安定无扰”，并把παρέξεσθαι与μετʼ εἰρήνης合译为“让所有人都享有和平”，避免生硬的“把国度赐给所有人”，同时保留原文关于国度安定与众人和平的双重关系。
