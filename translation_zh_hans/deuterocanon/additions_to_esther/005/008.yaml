translation:
  language: zh_hans
  text: 并要留意此后将发生的事[a]，好使国度[b]安定无扰，并让所有人在和平中享有它，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关注接下来的事。”希腊语προσέχειν可指留意、关注或考虑；这里与“此后的事”连用，带有顾及未来情形或后果的意思。
    reason: lexical_alternative
