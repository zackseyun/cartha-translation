  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: zh_hans
  text: 但请你们想一想：是否能够不那么从我们所传下来的较早历史记载中，而更多从你们在查究的、近在眼前的事上，看出有多少不敬神圣地完成的事，是由那些不配掌权之人的瘟疫造成的。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “近在眼前的事”直译为“在你们脚边的事”，指就在眼前、手边可查验的事，并不一定指正在发生的事。
    reason: lexical_alternative
  - marker: b
    text: “不敬神圣地完成的事”也可译作“以亵渎的方式做成的事”或“邪恶地做成的事”。原词兼有对神圣的不敬和严重道德邪恶的意味。
    reason: lexical_alternative
  - marker: c
    text: “瘟疫”很可能是比喻，形容不配掌权者所带来的毁灭性影响。
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε δὲ ἐξέστιν
  choice: 但你们要留心……就能看出
  rationale: σκοπεῖτε是复数命令式，要求收信者审慎观察；ἐξέστιν在此表达可能或能力，而非许可。按现代汉语句法合并表达，以保留劝告和推断的语气。
- source_word: ἐκ τῶν παλαιοτέρων ὡς παρεδώκαμεν ἱστοριῶν
  choice: 根据我们传下来的较早史实
  rationale: 保留παλαιοτέρων的比较意味和παρεδώκαμεν“我们传下”的信息；ἱστοριῶν在此指历史记载或史实。
- source_word: ὅσα ἐστὶν παρὰ πόδας ὑμᾶς ἐξητοῦντας
  choice: 查考眼前发生的事……看出……多少
  rationale: παρὰ πόδας是“在脚边”的惯用语，表示近在眼前；ἐξητοῦντας表示仔细查究；ὅσα保留为“多少”，不弱化成笼统的“什么”。
- source_word: ἀνοσίως συντετελεσμένα
  choice: 已经造成了多少亵渎正道的恶事
  rationale: ἀνοσίως兼有不敬神圣、违背正道和邪恶之意；“亵渎正道”保留其宗教伦理力度，又不限定为礼仪层面的不敬。συντετελεσμένα的完成时态以“已经造成”体现。
- source_word: τῇ τῶν ἀναξία δυναστευόντων λοιμότητι
  choice: 那些不配掌权之人的瘟疫般祸害
  rationale: ἀναξία修饰掌权行为，指以不配、不当的方式行使权势；λοιμότης本义为瘟疫，此处比喻其毁灭性，译文同时保留意象并说明其为祸害。
theological_decisions:
- issue: ἀνοσίως的道德—宗教含义
  choice: 亵渎正道的恶事
  alternative: 无法无天的恶事；不敬神的恶事
  rationale: 原词同时涉及对神圣秩序的冒犯和严重的道德邪恶。“亵渎正道”保留这种张力，避免只解释为违反成文法律，也避免把对象明确限定为“神”，超出本句所说。
- issue: λοιμότητι是否按字面翻译
  choice: 瘟疫般祸害
  alternative: 瘟疫；腐败
  rationale: 保留“瘟疫”的强烈隐喻，同时用“般祸害”使现代读者清楚这不是在陈述实际疫情，而是描写不当掌权者造成的毁灭性影响。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。调整希腊语长句结构为汉语的“与其……不如……”对比，并保留“我们传下来的”、ὅσα“多少”、完成体“已经”及λοιμότης的瘟疫隐喻。所有脚注标记均置于相应正文处。
