revisions:
- from: 但你们要留心：与其根据我们传下来的较早史实，不如查考眼前发生的事[a]，就能看出，那些不配掌权之人的瘟疫般祸害[b]，已经造成了多少亵渎正道的恶事[c]。
  to: 但请你们想一想：是否能够不那么从我们所传下来的较早历史记载中，而更多从你们在查究的、近在眼前的事上，看出有多少不敬神圣地完成的事，是由那些不配掌权之人的瘟疫造成的。[a][b][c]
  rationale: 修订恢复ἐξέστιν的可能性语气，避免把“近在眼前”限定为“发生的事”，并以“历史记载”对应ἱστορίαι。重组长句以尽量保留希腊文中“由……的瘟疫造成”的关系；将ἀνοσίως处理为副词性“不敬神圣地”，既保留宗教—伦理力度，也不加入“正道”等原文未明说的概念。脚注锚点已按所释词语重新放置。
