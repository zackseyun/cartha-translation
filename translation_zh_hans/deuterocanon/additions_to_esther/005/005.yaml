  yaml_path: translation/deuterocanon/additions_to_esther/005/005.yaml
  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: zh_hans
  text: 她[a]常因疯狂，使许多被委任掌权、受托管理事务的亲信，有分于流无辜人之血[b]，又使他们陷入无法挽回的灾祸中，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的动词显示主语为阴性单数（“她使……又使……陷入”），但本节没有明确说明“她”指谁。
    reason: alternative_reading
  - marker: b
    text: 也可译作“参与流无辜人之血”。这里指参与杀害无辜者，而不必然表示每个人都亲手行凶。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: 常
  rationale: 表达多次发生，现代汉语中简洁自然。
- source_word: τῶν ἐπʼ ἐξουσίας τεταγμένων
  choice: 受命掌权
  rationale: 兼顾 τεταγμένων 的受委派之意与 ἐξουσίας 的权柄、职权含义。
- source_word: τῶν πιστευθέντων χειρίζειν φίλων τὰ πράγματα
  choice: 被信任以朋友身份管理事务的人
  rationale: 保留句法的压缩和一定歧义：这些人既受信任管理事务，也被视为朋友；不擅自限定为国家政务。
- source_word: παρανοίᾳ
  choice: 因疯狂
  rationale: 将与格理解为原因或手段，保留其严重的精神与道德失常含义。
- source_word: μετόχους αἱμάτων ἀθώων
  choice: 无辜人之血的有分者
  rationale: 较形式对应地保留“有分于血”的表达，并借脚注说明指涉参与流无辜人的血。
- source_word: καταστῆσα
  choice: 使……成了
  rationale: 体现使役含义，即使人进入某种身份或状态。
- source_word: περιέβαλε συμφοραῖς ἀνηκέστοις
  choice: 使他们陷入无法挽回的灾祸中
  rationale: περιέβαλε 在灾祸语境中表示包围、笼罩或使陷入；ἀνηκέστοις 表示不可医治、无法补救。
theological_decisions:
- issue: 阴性单数主语的所指
  choice: 正文用“她”，但不指明具体所指
  alternative: 将其解释为某位女性、人格化力量或其他阴性名词
  rationale: 希腊文动词表明阴性单数主语，但本节没有明说其所指；译文保留语法信息和原有歧义。
- issue: “无辜人之血的有分者”的性质
  choice: 保留参与或牵连于流无辜人之血的开放表达
  alternative: 明确译作亲手杀害无辜者
  rationale: μετόχους 表示分享、参与或有分，不必然断定每个人都是直接行凶者。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“有分者”略带经文语体，用来保留希腊文 μετόχους 与“血”搭配的紧凑表达；全句末尾保留逗号，因为原文在更大的王谕句段中继续展开。
