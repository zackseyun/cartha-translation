  text: For God[a], who rules over all, has made this a joy for them instead of the destruction of the chosen race,
translation:
  language: zh_hans
  text: 因为统管万有的上帝已使这事成为他们的喜乐，而非蒙拣选的子民遭毁灭，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην
  choice: 这事
  rationale: 阴性宾格指示代词回指上文所述之事；译作“这事”自然，并保留所指范围的宽泛性。
- source_word: ὁ πάντα δυναστεύων θεὸς
  choice: 统管万有的上帝
  rationale: δυναστεύω 表示掌权、施行统治；“统管万有”既体现上帝主动而全面的主权，也避免套用希腊文未明确使用的后期固定称号。
- source_word: ἀντʼ ὀλεθρίας
  choice: 取代了……的毁灭
  rationale: ἀντί 表示替代、交换，ὀλεθρία 表示毁灭或覆亡；此译清楚呈现由毁灭转为喜乐的对照。
- source_word: τοῦ ἐκλεκτοῦ γένους
  choice: 蒙拣选族类
  rationale: γένος 可指族类、血统、民族或群体；“族类”较贴近原词的共同血缘与群体身份含义，“蒙拣选”则自然表达被动意义。
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  choice: 已使这事成为他们的喜乐
  rationale: ποιέω 与宾语、表语性成分连用，可表示“使……成为”；εὐφροσύνη 指喜乐、欢欣。此译保留 ταύτην 与“喜乐”的直接关系。
theological_decisions:
- issue: ὁ πάντα δυναστεύων θεὸς 所表达的神圣主权
  choice: 统管万有的上帝
  alternative: 全能的上帝；掌管一切的上帝
  rationale: 原文强调上帝对万有实际施行统治，并扭转灭族威胁；“统管万有”保留这一力度，同时不把该短语等同于原文未采用的固定神名或称号。
- issue: ἐκλεκτοῦ γένους 的群体身份含义
  choice: 蒙拣选族类
  alternative: 蒙拣选的子民；蒙拣选的民族
  rationale: 原文同时包含拣选和共同族属的观念。“族类”保留 γένος 的语义张力；脚注列出在本语境中更自然、但较偏解释性的“子民”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“已使……成为……，取代了……”重现原文由毁灭转为喜乐的逆转结构。句末保留逗号，以反映该节在上下文中句法未完。
