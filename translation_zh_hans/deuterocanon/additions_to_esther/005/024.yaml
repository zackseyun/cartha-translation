  yaml_path: translation/deuterocanon/additions_to_esther/005/024.yaml
  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: zh_hans
  text: 但每一座城或地区，若整体不遵照这些命令行事，必在愤怒中被矛与火吞灭[a]；它不仅将使人无法进入，也将永远成为野兽和飞鸟最厌恶之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被矛与火吞灭”也可译作“用矛与火吞灭”。希腊文明确说“矛”；有些译本较笼统地译作“刀剑”。
    reason: 说明与格可表达所用手段，并保留δόρατι“矛”的具体词义。
lexical_decisions:
- source_word: πᾶσα δὲ πόλις ἢ χώρα τὸ σύνολον
  choice: 但任何一座城或任何一个地区，若全体
  rationale: πᾶσα ... πόλις ἢ χώρα具有逐一涵盖的意思；τὸ σύνολον强调该城或地区的整体。译作“任何……若全体”，既保留整体性，也符合中文法令语体。
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: 不照这些命令行事
  rationale: κατὰ ταῦτα回指王令的内容，ποιέω在这里指遵行或执行；“照这些命令行事”清楚而不过度具体化。
- source_word: δόρατι καὶ πυρὶ
  choice: 被矛与火
  rationale: δόρατι是δόρυ的与格，字面指“矛”；保留具体兵器意象，不按传统泛化为“刀剑”。与格可表示施行毁灭的手段。
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: 必在烈怒中……毁灭
  rationale: καταναλίσκω表示耗尽、吞灭或彻底毁坏；在中文里“毁灭”自然表达结果。μετʼ ὀργῆς译作“在烈怒中”，保留怒气伴随惩罚的表达。
- source_word: ἀνθρώποις ἄβατος
  choice: 成为人无法进入之地
  rationale: ἄβατος指不可进入或无法通行；ἀνθρώποις泛指人类。采用自然现代中文，避免“不可通行于人”等生硬结构。
- source_word: θηρίοις καὶ πετεινοῖς
  choice: 野兽和飞鸟
  rationale: θηρία指野生兽类，πετεινά指飞禽；“野兽和飞鸟”简洁且保留两类生物的区分。
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: 永远
  rationale: 该短语表示贯穿全部时间的持续状态；“永远”在庄重中文中自然传达其强烈而长久的语气。
- source_word: ἔχθιστος κατασταθήσεται
  choice: 将……成为……最厌恶的地方
  rationale: ἔχθιστος是最高级，表示“最可憎、最受厌恶”；κατασταθήσεται表示被置于或成为某种状态。补出“地方”承接前文城与地区，使中文完整。
theological_decisions:
- issue: ἀνθρώποις的泛指范围
  choice: 人
  alternative: 男人；人类
  rationale: ἀνθρώποις在此泛指人，不限定男性。现代汉语“人”既准确又自然，无须引入性别限定。
- issue: δόρατι所指的毁灭工具
  choice: 矛
  alternative: 刀剑；兵器
  rationale: 希腊文明确使用δόρυ“矛”。保留原文的具体意象，避免受传统译法影响而改成“刀剑”。
- issue: ἔχθιστος的最高级力度
  choice: 最厌恶
  alternative: 厌恶；极其可憎
  rationale: 保留希腊文最高级的修辞力度，不将其弱化；同时按与格对象理解为野兽和飞鸟对该地的厌恶。
translation_notes:
  register: 采用现代、庄重的法令与审判语体。“任何一座城或任何一个地区”保留逐一涵盖的力度；“若全体”体现τὸ σύνολον对整体责任的强调。句子维持原文严厉、诅咒式的修辞，不淡化暴力或永久荒废的意象。
