  text: being sons of the Most High[a], greatest, living God[b], who directs the kingdom for us and for our forefathers in the best order.
translation:
  language: zh_hans
  text: 我们身为至高、至大、永活的上帝的儿子[a]，他以最美好的安排，为我们和我们的先祖治理王国[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿女”。希腊文直译为“儿子”，正文保留这一明确的亲子称谓。
    reason: lexical_alternative
  - marker: b
    text: “以最美好的安排，为我们和我们的先祖治理王国”也可译作“以最美好的秩序，为我们和我们的先祖引导王国”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὄντας δὲ
  choice: 而我们身为
  rationale: 保留分词结构及连接语气，不擅自增添明确的因果关系；汉语补出“我们”，使句意自然清楚。
- source_word: υἱοὺς
  choice: 儿子
  rationale: 原文为明确的阳性复数，译作“儿子”以保留其亲子身份用语；较宽泛的“儿女”列入脚注。
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
  choice: 至高、至大、永活的上帝
  rationale: 按原文叠加的神圣称号逐项呈现，保留庄重而累积的修辞。
- source_word: κατευθύνοντος
  choice: 引导
  rationale: 兼顾“指引”和“导向、安排”的含义，又不把原文过度限定为单纯的行政治理。
- source_word: τὴν βασιλείαν
  choice: 王国
  rationale: 在此最自然地指王国或王权统治；“王国”简明且保留原词的宽度。
- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: 为我们和我们的先祖
  rationale: 准确表达受益对象以及与历代先人的历史关联。
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: 以最完善的安排
  rationale: διάθεσις在此表示安排、秩序或部署；译文保留最高级，并以自然汉语表达卓越的治理安排。
theological_decisions:
- issue: 群体性的神圣儿子身份用语
  choice: 上帝的儿子
  alternative: 上帝的儿女
  rationale: 保留原文υἱούς明确的阳性亲子称谓及其神学张力，不在正文中泛化。
- issue: 上帝引导王国之行动的时态与范围
  choice: 这位上帝……引导王国
  alternative: 这位上帝曾……引导王国；这位上帝……治理王权
  rationale: 希腊文现在分词适合表达持续或一般性的行动，不强行改作过去时；“引导”也避免把其意义缩窄为行政治理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号承接希腊文修饰“上帝”的分词结构，避免中文中连续多个“的”造成歧义；保留原文作为较大句子一部分的承接感。
