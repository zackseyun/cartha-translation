translation:
  language: zh_hans
  text: 因为我想起了我所见、有关这些事的那个梦；其中没有一句话落空。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“没有一句话从其中过去”。希腊文措辞简约，也可能指梦中所涉及的事没有一件被略过，或没有一件未实现。
    reason: 说明παρῆλθεν ἀπʼ αὐτῶν λόγος的字面表达，并保留其“被略过”或“未实现”等解释可能。
lexical_decisions:
- source_word: ἐμνήσθην
  choice: 我想起了
  rationale: 该形式在此具有主动意义，表示说话者回想起先前的梦；“想起了”自然、准确。
- source_word: ἐνυπνίου
  choice: 梦
  rationale: 该名词直接指梦境；不增译为“异象”，以免加入原文未明确表达的含义。
- source_word: περὶ τῶν λόγων τούτων
  choice: 关于这些事
  rationale: λόγοι 在此可指话语、事情或事件；上下文指梦所涉及的事项，因此译作“这些事”较自然，同时保留一定概括性。
- source_word: οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: 其中没有一句落空
  rationale: 原文措辞凝练，字面近于“其中没有一句过去”。“没有一句落空”保留 λόγος 的“一句”意象，也自然表达梦中所指没有失效或未应验；脚注说明较直译的可能。
theological_decisions:
- issue: οὐδὲ ... παρῆλθεν ἀπʼ αὐτῶν λόγος 的解释
  choice: 正文译作“其中没有一句落空”，表达梦中所言没有失效或未实现。
  alternative: “其中没有一句过去”或“其中没有一件被略过”。
  rationale: 希腊文可能强调没有任何话语消逝、没有任何细节被略过，或没有任何内容未实现。正文采用自然且符合语境的表达，但以脚注保留原文的简约性和解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己所见的那个梦”清楚表达关系从句；分号呈现后半句的解释和结果意味。
