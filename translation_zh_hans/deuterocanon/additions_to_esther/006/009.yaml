  text: And God remembered his people[a], and vindicated his inheritance.
translation:
  language: zh_hans
  text: 上帝记念了自己的子民，也为自己的产业伸张了正义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判定自己的产业为义”或“公正对待自己的产业”。希腊语动词可含司法判定或为人昭雪、伸张正义之意。
    reason: 保留ἐδικαίωσεν的法律性和昭雪性含义及其可能译法。
lexical_decisions:
- source_word: ἐμνήσθη
  choice: 记念了
  rationale: 保留圣经希腊语中“记念”的惯用表达；在这里不仅指想起，也含有上帝眷顾并采取行动的意味，但正文不把这一含义过度明说。
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: 自己的子民
  rationale: λαός在此指属上帝的群体；“子民”自然表达其群体性和圣约语境。
- source_word: ἐδικαίωσεν
  choice: 为……伸张了正义
  rationale: δικαιόω可表示称义、判为义或使其获得公正。在拯救整个群体的语境中，“伸张了正义”较能表达公开维护、昭雪的司法性含义，同时以脚注保留其他可能译法。
- source_word: τὴν κληρονομίαν ἑαυτοῦ
  choice: 自己的产业
  rationale: κληρονομία意为产业、基业或继承所得之物；这里以“产业”保留上帝子民是他产业的圣经隐喻。
theological_decisions:
- issue: 如何翻译非保罗书信语境、以群体为对象的ἐδικαίωσεν
  choice: 为自己的产业伸张了正义
  alternative: 判定自己的产业为义；公正对待自己的产业
  rationale: 本句着重上帝拯救并公开维护其子民，而非明确陈述后期神学体系中的个人称义教义。正文采用具有司法和昭雪意味的表达，脚注则保留希腊词本身的多义性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“记念”保留熟悉的圣经用语；“自己的子民／自己的产业”对应原文两个彼此解释的群体称谓。脚注标记紧接存在词义歧义的谓语之后。
