base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/010.yaml
  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: zh_hans
  text: 这些日子要在亚达月的十四日和十五日，成为他们在上帝面前聚集[a]、欢喜快乐的日子；在他的子民以色列中，这样的日子要世世代代直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集”也可译作“集会”或“会众聚会”；这里的希腊文指群体性的聚集，并非特指会堂建筑。
    reason: 词义替代说明；对应συναγωγή，并使脚注锚点与所注释的词语一致。
lexical_decisions:
- source_word: ἔσονται αὐτοῖς αἱ ἡμέραι αὗται
  choice: 这些日子要定在
  rationale: 希腊文直译为“这些日子对他们将是……”。中文用“要定在”自然表达节期日期的规定，并保留将来、法令式语气；不把原文补成更具体的制度名称。
- source_word: ἐν μηνὶ Ἀδάρ
  choice: 亚达月
  rationale: 按现代中文圣经人名地名惯例音译犹太月份名称；月份语境清楚，无须重复“在……月中”。
- source_word: τῇ τεσσαρεσκαιδεκάτῃ καὶ τῇ πεντεκαιδεκάτῃ τοῦ αὐτοῦ μηνός
  choice: 就是同一个月的十四日和十五日
  rationale: 明确两个日期同属亚达月，并用“就是”衔接前项，符合自然中文日期表达。
- source_word: μετὰ συναγωγῆς
  choice: 他们要聚集
  rationale: συναγωγή在此指群体聚集，而非会堂建筑；改用动词结构，使中文流畅，同时不限定聚集的具体制度形式。
- source_word: χαρᾶς καὶ εὐφροσύνης
  choice: 欢喜快乐
  rationale: 以两个近义词保留希腊文并列的喜庆语势；“欢喜”与“快乐”自然易懂，也适合敬虔节庆语境。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留庆典面向上帝、在其临在中的神学方向；“面前”兼有空间与关系含义。
- source_word: εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: 世世代代永远
  rationale: 保留两个持续性短语的叠加强调，既表达历代延续，也表达永久性。
- source_word: ἐν τῷ λαῷ αὐτοῦ Ἰσραήλ
  choice: 在他的子民以色列中
  rationale: 保留“他的子民”这一关系性称谓及“以色列”的同位说明，不添加所指主体的解释。
theological_decisions:
- issue: 是否保留节庆活动明确朝向上帝的表述
  choice: 在上帝面前
  alternative: 在上帝的临在中
  rationale: 原文明确有ἐνώπιον τοῦ θεοῦ；正文采用自然、传统且不缩减含义的说法，脚注提示另一种能凸显临在意味的译法。
- issue: 如何表达节期跨世代且永久持续
  choice: 世世代代永远遵守
  alternative: 历世历代，直到永远
  rationale: 原文以εἰς γενεὰς与εἰς τὸν αἰῶνα叠加强调持续性。中文保留两层含义；“遵守”由节期和日期的规约语境得出，但不界定具体礼仪。
- issue: “他的子民”中代词的指向
  choice: 保留“他的子民”
  alternative: 上帝的子民
  rationale: 希腊文使用代词αὐτοῦ。为避免消除其语法形式或加入解释，正文保留代词，尽管最近明确提到的主体是上帝。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和句号拆分希腊文长句，使日期规定、共同庆祝及永久遵守三个层次清晰。正文中的[a]、[b]与脚注逐一对应；不将συναγωγή误解为会堂建筑，也不引入宗派性节期解释。
