  text: For this reason he made two lots[a], one for the people of God and one for all the nations;
translation:
  language: zh_hans
  text: 因此，他设定了两个签：一个给上帝的子民，一个给所有列国[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有外邦人”。这里的希腊词可泛指列国；与“上帝的子民”对举时，也可特指外邦人。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁自然地表达希腊语的因果承接关系。
- source_word: ἐποίησεν
  choice: 设了
  rationale: 原词是普通的“做、设立”，并未明确说“抽签”或“掣签”；“设了”既符合中文习惯，也避免增添原文没有的动作。
- source_word: κλήρους δύο
  choice: 两个签
  rationale: κλῆρος在此指用来决定结果或归属的签；保留数词“两个”，以呈现下文的对举结构。
- source_word: ἕνα τῷ λαῷ τοῦ θεοῦ
  choice: 一个为上帝的子民
  rationale: 贴近希腊语的与格结构，并以自然中文保留“上帝的子民”这一群体称谓。
- source_word: ἕνα πᾶσι τοῖς ἔθνεσιν
  choice: 一个为列国
  rationale: “列国”保留ἔθνη的广义集体含义，并与“上帝的子民”形成鲜明对照，而不在正文中过度限定为族群或宗教标签。
theological_decisions:
- issue: ἔθνεσιν与“上帝的子民”对举时的译法
  choice: 列国
  alternative: 所有外邦人
  rationale: 此处既可泛指各国，也可在犹太语境中专指上帝子民以外的外邦人。正文采用“列国”以保留词义范围，脚注注明另一种合乎语境的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“设了两个签”避免把普通动词ἐποίησεν具体化为原文未明说的“掣签”。分号承接原段落未完的句法。
