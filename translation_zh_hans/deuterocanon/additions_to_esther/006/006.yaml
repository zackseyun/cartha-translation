base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: zh_hans
  text: 但我的民族，就是以色列，是那些向上帝求助[a]、蒙了拯救的人。主拯救了他的子民，主救我们脱离了这一切灾祸；上帝又施行了列国中从未发生过的神迹和大奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向上帝呼求”。这句希腊语的表达略显生硬，意思是以色列向上帝寻求帮助，并蒙他拯救。
    reason: 说明不寻常希腊语搭配的词义选择及可行译法。
lexical_decisions:
- source_word: τὸ ἔθνος τὸ ἐμόν
  choice: 我的民族
  rationale: ἔθνος在此指说话者所属的整体族群，随后明确认同为以色列；“民族”既保留民族性含义，也不暗示现代民族国家。
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: 就是以色列
  rationale: 保留原文直接而强调的同一认定，在现代汉语中自然顺畅。
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: 那些向上帝求助的人
  rationale: 该希腊语搭配不寻常；结合紧接着的“蒙了拯救”，语境表明是以色列向上帝寻求帮助，而非帮助上帝。
- source_word: σωθέντες
  choice: 蒙了拯救
  rationale: 保留被动意义，并与下句ἔσωσεν形成清楚的词义呼应。
- source_word: ἔσωσεν
  choice: 拯救了
  rationale: 直接表达上帝施行拯救，也维持与σωθέντες的词汇关联。
- source_word: ἐρρύσατο
  choice: 救……脱离
  rationale: 体现从危险或困境中搭救出来的意义，同时与ἔσωσεν略作区分。
- source_word: τῶν κακῶν τούτων
  choice: 这一切灾祸
  rationale: κακά在此指临到犹太人的种种祸患；“灾祸”比抽象的“邪恶”更符合事件语境，同时保留其广度。
- source_word: τὰ σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: 神迹和大奇事
  rationale: 采用自然、庄重且为普通读者熟悉的圣经汉语搭配，并保留μεγάλα的强调。
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: 列国中从未发生过的
  rationale: 保留完成时所表达的截至叙述时点未曾发生，并保持以色列与列国之间的对照。
- source_word: κύριος
  choice: 主
  rationale: 希腊文本为κύριος而非直接呈现希伯来神名，故译作“主”。
theological_decisions:
- issue: βοηθήσαντες πρὸς τὸν θεόν的解释
  choice: 理解为向上帝求助
  alternative: 呼求上帝；转向上帝寻求帮助；字面作帮助上帝
  rationale: 该搭配在希腊语中略显生硬，但后文“蒙了拯救”及上帝施救的语境支持“向上帝求助”；字面译成“帮助上帝”会歪曲上下文。
- issue: 连续拯救用语的处理
  choice: 分别译作“拯救”和“救……脱离”
  alternative: 均译作“拯救”；分别译作“救助”和“搭救”
  rationale: 既呈现σωθέντες／ἔσωσεν之间的词根呼应，也体现ἐρρύσατο侧重从灾祸中救出的语义。
- issue: κακά的语境含义
  choice: 灾祸
  alternative: 邪恶；患难；祸患
  rationale: 原词含义宽泛，此处主要指威胁犹太人的种种灾难事件；“灾祸”不把它限缩为道德邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的民族”与后文“列国”形成词汇关联；“子民”则自然表达λαός在上帝与其百姓关系中的含义。脚注标记已置于相关短语之后。
