lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处καί承接上下文；现代汉语直接以“末底改说”起句更自然，叙事连接仍由语境体现，不额外加入时间含义。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω的不定过去时用于普通叙事引语，译作“说”准确自然。
- source_word: Μαρδοχαῖος
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Παρὰ τοῦ θεοῦ
  choice: 出于上帝
  rationale: παρά接属格表示来源；“出于上帝”既自然，又保留这些事以上帝为源头的含义，而不进一步界定其因果机制。
- source_word: ἐγένετο
  choice: （体现在“出于”中）
  rationale: γίνομαι在这里表示发生、形成；汉语“这些事出于上帝”已自然表达事情发生且源自上帝，无须生硬重复为“发生了”。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词对相关诸事的概括，也符合现代汉语表达。
theological_decisions:
- issue: παρά加属格所表达的神圣来源或因果关系
  choice: 这些事出于上帝
  alternative: 这些事是由上帝成就的
  rationale: 原文明确把这些事的来源归于上帝，却没有细说上帝使其发生的方式；“出于上帝”保留这种归因及其神学张力，避免把机制解释得更具体。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“末底改”为通行专名译法；“上帝”清楚指向犹太叙事中的独一神。原文虽有连接词καί，但中文省译可避免不自然的句首“于是/并且”，且不损失实质意义。
