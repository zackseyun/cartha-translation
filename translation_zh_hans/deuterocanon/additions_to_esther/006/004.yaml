lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  choice: 那两条巨龙
  rationale: δράκων可指巨龙或大蛇；“巨龙”保留梦境中鲜明而宏大的象征意象，并直接对应复数形式。量词“条”符合现代汉语习惯。
- source_word: ἐγώ εἰμι καὶ Ἁμάν
  choice: 就是我和哈曼
  rationale: 希腊文以强调的第一人称代词和系词作直接身份认定。汉语用“就是”自然表达复数象征物与“我和哈曼”之间的对应关系，也保留“我”的强调意味。
- source_word: Ἁμάν
  choice: 哈曼
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δέ
  choice: 但
  rationale: δέ表示轻微转折或话题推进；此处进入对梦中象征的解释，用“但”保留原文的转折衔接。
theological_decisions:
- issue: 梦中象征人物的身份认定
  choice: 按原文直译为“那两条巨龙，就是我和哈曼”，让说话者直接将象征对应于自己和哈曼。
  alternative: 将“巨龙”译作“大蛇”，或解释性补出说话者是末底改。
  rationale: 原文只作直接的象征身份认定，没有在本句中明说“我”是谁；正文不补入“末底改”，以避免将语境信息变成原文明说的内容。δράκοντες的词义差异则用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“就是”使象征身份认定自然清楚；不额外补出说话者姓名。脚注标记已在正文中以[a]呈现。
