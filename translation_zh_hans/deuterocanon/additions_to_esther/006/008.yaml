  text: 这两个签来到了那一时刻和定期，也来到了在上帝和万国面前的审判日，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δύο κλῆροι οὗτοι
  choice: 这两个签
  rationale: κλῆρος本指抽签所用的“签”，也可引申为抽签所得的份或命运；正文保留具体的抽签意象，并译出οὗτοι的指示意义。
- source_word: ἦλθον
  choice: 到了
  rationale: ἔρχομαι的简单过去时在此表示“来到、到达”；结合后接的时间短语，现代汉语自然表达为“到了”，不另行加入“落下”等抽签动作。
- source_word: εἰς ὥραν καὶ καιρόν
  choice: 到了那时、那定期
  rationale: ὥρα指特定时刻，καιρός指合宜或指定的时机；“那时、那定期”既保留并列，也体现后者的指定意味。
- source_word: εἰς ἡμέραν κρίσεως
  choice: 到了……施行审判的日子
  rationale: κρίσις具有裁断、审判之义；用动词结构“施行审判”使汉语顺畅，同时保持司法语境。
- source_word: ἐνώπιον τοῦ θεοῦ καὶ πᾶσι τοῖς ἔθνεσιν
  choice: 在上帝和万国面前
  rationale: ἐνώπιον明确修饰“上帝”，后面的与格“万国”在句法和意义上与之并列；汉语用一个“在……面前”统摄两者，既简洁又不重复添加原文没有的介词。
theological_decisions:
- issue: κλῆροι在上下文中的象征意义
  choice: 正文直译为“签”，让可能的命运或所得之份的象征意味由上下文呈现
  alternative: 译为“命运”或“所分得的份”
  rationale: 希腊文仍使用具体的抽签词汇；直译能保留《以斯帖记》增补部分中活跃的签之意象，避免将象征解释直接写入正文。
- issue: “上帝和万国面前”的句法关系
  choice: 让“面前”同时统摄上帝和万国
  alternative: 译成“在上帝面前，也在万国面前”
  rationale: 原文只出现一次ἐνώπιον，而“万国”以与格并列承接；共享“面前”最直接地保留原句结构，也维持审判公开显明的庄严意味。
- issue: κρίσεως所指的审判
  choice: 保留一般性的“施行审判”，不明确指定谁受审或谁作证
  alternative: 解释为末日审判、对敌人的审判或万国见证下的裁决
  rationale: 本句具有神学和司法张力，但并未明说审判对象或将其限定为末世事件；译文不应替原文作出额外判定。
translation_notes:
  register: 采用庄重而现代的叙事语体。“签”简明且保留原文意象；“那时、那定期”用自然汉语呈现ὥρα与καιρός的并列。“上帝和万国面前”避免重复介词。句末保留逗号，以反映该节在更大句段中尚未完结。
