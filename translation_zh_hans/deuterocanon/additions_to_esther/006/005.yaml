lexical_decisions:
- source_word: ἔθνη
  choice: 各族
  rationale: 这里指犹太人以外的各民族或族群。“各族”在现代汉语中自然，也避免赋予该词不必要的宗教术语色彩。
- source_word: ἐπισυναχθέντα
  choice: 已经聚集起来
  rationale: 该分词在希腊文中形式为被动，表示被召集或聚集在一起；正文采用自然的汉语表达，脚注保留形式上更明确的被动译法。
- source_word: ἀπολέσαι
  choice: 要除灭
  rationale: 不定式表示聚集的目的。“除灭”既体现彻底毁灭的语气，又不额外限定具体手段。
- source_word: τὸ ὄνομα
  choice: 名号
  rationale: 原文直译为“名字”。此处“名号”较自然地保留源文意象，并可承载抹去一个民族记忆或存续的习语含义。
- source_word: Ἰουδαίων
  choice: 犹太人的
  rationale: 在《以斯帖记》的叙事语境中，该词通常指犹太民族；“犹太人”是现代汉语最清楚、通行的表达。
theological_decisions:
- issue: “除灭犹太人的名号”的习语含义
  choice: 正文保留“名号”这一源文意象。
  alternative: 抹去犹太人的记忆；使犹太人不复存在
  rationale: 这句话可能意指彻底消灭一个民族，使其记忆和存续都被抹去；但希腊文明确使用“名”这一意象，因此正文不把潜在含义单一化，而由脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文转折；“各族”避免过强的宗教术语色彩；正文与脚注标记完整对应。
