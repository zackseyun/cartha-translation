  text: The little spring that became a river was Esther, whom the king married and made queen; and there was light and sun and abundant water.
translation:
  language: zh_hans
  text: 那小小的泉源变成了河流；又有光、太阳和丰沛的水。以斯帖就是那条河；王娶了她，立她为王后。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: 那小小的泉源
  rationale: πηγή指水的源头、泉或泉源；“泉源”自然庄重，并保留梦境中由小变大的意象。
- source_word: ἡ ἐγένετο ποταμός
  choice: 变成了河流
  rationale: 直译其变化过程，清楚保留泉源变为河流的象征图景。
- source_word: φῶς καὶ ἥλιος καὶ ὕδωρ πολύ
  choice: 光、太阳和丰沛的水
  rationale: 分别保留三个梦境意象；“丰沛的水”准确表达ὕδωρ πολύ的数量充足之意。
- source_word: Ἐσθήρ ἐστιν ὁ ποταμός
  choice: 以斯帖就是那条河
  rationale: 保留希腊文现在时和直接判断句，不把“河”宽泛改写成整个象征场景。
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: 王娶了她
  rationale: ἐγαμέω在此指娶妻；中文简洁自然，并明确关系代词所指为以斯帖。
- source_word: ἐποίησεν βασίλισσαν
  choice: 立她为王后
  rationale: 表达使她成为王后的结果；“立……为王后”符合现代汉语的王室叙事语体。
theological_decisions:
- issue: 梦境解释中泉源、河流与以斯帖的对应关系
  choice: 保留“以斯帖就是那条河”的明确对应，同时依照原文先陈述泉源变河及其他意象。
  alternative: 可将全句整合为“那道变成河流的小泉就是以斯帖”，并把光、太阳和水后置。
  rationale: 希腊文明确说“以斯帖是那条河”，而不是笼统地把她等同于全部意象；保留原有分句可避免消解这一细微区别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“小小的泉源”保留原文形象感；分号呈现希腊文各意象之间略显并列、解释性的结构，不额外阐释其神学含义。
