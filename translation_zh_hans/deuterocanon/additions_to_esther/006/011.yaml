revisions:
- from: 在托勒密和克利奥帕特拉执政的第四年，多西提乌——自称是祭司和利未人——与他的儿子托勒密带来了上述关于普珥节的文书[a]。他们说，这文书确实存在，并且是由耶路撒冷人托勒密的儿子吕西马科翻译的。[b]
  to: 在托勒密和克利奥帕特拉在位的第四年，多西提乌——他说自己是祭司和利未人——和他的儿子托勒密带来了所载的这封关于普珥节的书信[a]；他们说，这封信尚存，并且已由住在耶路撒冷的人之一、托勒密的儿子吕西马科翻译。[b]
