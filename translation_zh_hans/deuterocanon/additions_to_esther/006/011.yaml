base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: zh_hans
  text: 在托勒密和克利奥帕特拉在位的第四年，多西提乌——他说自己是祭司和利未人——和他的儿子托勒密带来了所载的这封关于普珥节的书信[a]；他们说，这封信尚存，并且已由住在耶路撒冷的人之一、托勒密的儿子吕西马科翻译。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“弗鲁赖亚的”；“弗鲁赖亚”是此处对犹太人普珥节所用的希腊语名称。
    reason: 保留 Φρουραίων 的希腊文形式，并说明正文按其所指节期翻译。
  - marker: b
    text: 或译：“他们说，这封信存在，并已由托勒密的儿子吕西马科翻译；他是住在耶路撒冷的人之一。”希腊文措辞简略，可能强调该文书尚存或可得，而非断言其真伪。
    reason: 说明 εἶναι 的“存在/尚存”语义及末尾地域短语与吕西马科的关系。
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: 在托勒密和克利奥帕特拉执政的第四年
  rationale: 保留希腊文纪年格式，以自然现代汉语表达共同执政的时间背景；“执政”不额外规定二人的具体王号或关系。
- source_word: εἰσήνεγκεν
  choice: 带来了
  rationale: 基本义为“带入、带来”；在文书跋语语境中表示将该文书带来，避免用“呈交”而过度限定行政场景。
- source_word: ὃς ἔφη εἶναι
  choice: 自称是
  rationale: 简洁对应“他说自己是”。“自称”在此作中性身份陈述，不必然表示怀疑；相关语气张力予以保留。
- source_word: ἱερεὺς καὶ Λευείτης
  choice: 祭司和利未人
  rationale: 保留 καί 所连接的两个身份，不把二者解释为同位关系，也不为消除历史上的张力而改写。
- source_word: τὴν προκειμένην ἐπιστολήν
  choice: 上述……文书
  rationale: προκειμένην 指摆在读者面前、前面所载的文书；鉴于本句位于全书末尾，“上述”比“以下”更符合篇章位置。“文书”也比现代私人通信意味较强的“书信”更适合此处。
- source_word: τῶν Φρουραίων
  choice: 关于普珥节的
  rationale: 这是希腊文《以斯帖记》传统中对普珥节的称谓；正文直接表达所指节期，并在脚注保留希腊称呼。
- source_word: ἣν ἔφασαν εἶναι
  choice: 他们说，这文书确实存在
  rationale: 希腊文表达简略，直陈该文书“是/存在”；译为“确实存在”表达其存世或可得，而不擅自解释为“真实可靠”。
- source_word: καὶ ἑρμηνευκέναι
  choice: 并且是……翻译的
  rationale: ἑρμηνεύω 在文书及语言转换语境中最自然地指“翻译”，同时不排除较宽的“解释、译述”含义。
- source_word: Λυσίμαχον Πτολεμαίου
  choice: 托勒密的儿子吕西马科
  rationale: 属格最自然地表示父子关系，按现代汉语姓名结构清楚表达。
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: 耶路撒冷人
  rationale: 自然表达“在耶路撒冷的人之一”；不强行判定其出生地，只表明其与耶路撒冷的地域联系。
theological_decisions:
- issue: ὃς ἔφη εἶναι 是否含怀疑意味
  choice: 自称是
  alternative: 他说自己是／声称自己是
  rationale: 原文可作中性转述，也可能略带距离感。“自称”保留这种开放性，但不采用贬义较强的措辞。
- issue: ἣν ἔφασαν εἶναι 所指为何
  choice: 他们说，这文书确实存在
  alternative: 他们说，这文书尚存／他们说，这文书是真实的
  rationale: εἶναι 本身只明确表达“是、存在”，未直接断言正典性或真实性，因此正文不加入“真实可靠”等神学或文献判断。
- issue: ἱερεὺς καὶ Λευείτης 两种身份的关系
  choice: 祭司和利未人
  alternative: 祭司，也就是利未人
  rationale: 原文以 καί 并列，故保留并列，不将其神学或历史关系解释为同位。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保持古代文书跋语的纪年与来源说明风格。人名依通行希腊语音译处理。破折号标明插入的身份说明；脚注标记均已置于正文相应位置。
