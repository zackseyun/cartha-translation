  text: The matter was being hurried along even in Susa; but the king and Haman were reclining at table[a], while the city was in turmoil.
translation:
  language: zh_hans
  text: 这事在书珊也被加紧催办；王和哈曼却斜倚着饮宴[a]，全城则陷入骚乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正在欢宴”或“正在饮宴”。希腊文动词特指正式宴席上斜倚在卧榻用餐。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  choice: 加紧进行
  rationale: 未完成时被动语态表示事情持续受到催促、加速推进；中文用“加紧进行”自然表达这一持续而紧迫的过程。
- source_word: τὸ πρᾶγμα
  choice: 这事
  rationale: πρᾶγμα泛指事情、事务；不译作“诏令”，以免把上下文中的具体所指写入原词。
- source_word: καὶ εἰς Σουσάν
  choice: 也在书珊
  rationale: 表示行动也延伸到书珊；按现代汉语习惯译为“也在书珊”，不拘泥于介词的空间字面义。
- source_word: ἐκωθωνίζοντο
  choice: 斜倚席间用宴
  rationale: 该动词描绘在正式宴席上倚卧饮宴的姿态；正文保留这一文化画面，同时以“用宴”说明其活动。
- source_word: ἐταράσσετο
  choice: 陷入骚乱
  rationale: 未完成时表示全城持续处于不安、混乱之中；“陷入骚乱”能传达群体性的动荡，并与王和哈曼安坐饮宴形成鲜明对照。
- source_word: ἡ πόλις
  choice: 全城
  rationale: πόλις字面为“城”；此处指书珊城及城中民众的整体反应，汉语“全城”表达自然。
