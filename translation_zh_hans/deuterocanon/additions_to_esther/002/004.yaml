base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: zh_hans
  text: 在普天下各族之中，混杂着某个心怀敌意的民族；其律法与各国相抵触[a]，又不断漠视君王的谕令[b]，以致我们无可指摘地推行的共同治理无法维持下去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“习俗”；希腊语 νόμοι 既可指成文法律，也可泛指风俗惯例。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊文句法紧缩；“漠视”按其“置之不理”或“忽略王命”的可能含义翻译。原文“君王”为复数，可能是泛称或王朝性的用法。
    reason: lexical_alternative
  - marker: c
    text: “共同治理”也可译作“共同政权”或“联合统治”；希腊语 συναρχίαν 的确切政治含义并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: 在普天下各族之中
  rationale: “各族”体现 φυλαῖς 的族群含义；“普天下”自然表达 οἰκουμένη 所指的整个有人居住的世界，也符合王室诏书的庄重语域。
- source_word: ἀναμεμιγμένον δυσμενῆ λαόν τινα
  choice: 混杂着一个心怀敌意的民族
  rationale: “混杂着”保留 ἀναμεμιγμένον 所含掺杂、混居的贬抑色彩；“一个”体现 τινα 的不定性，“心怀敌意”传达 δυσμενῆ，而不把王室指控误写成叙述者的客观判断。
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: 他们的律法与各国相抵触
  rationale: νόμοι 首先译作“律法”，但可兼指习俗，故以脚注保留另一可能；“相抵触”准确体现 ἀντίθετον 的对立含义。汉语以复数代词“他们”自然回指作为群体的“民族”。
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: 又不断漠视历代君王的谕令
  rationale: παραπέμπω 在此按置之不理、忽略理解；προστάγματα 在王室公文中译为“谕令”。原文复数“君王”以“历代君王”自然呈现其概括或王朝性的含义。
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: 致使……无法稳固
  rationale: 该结构表示所导致或意图造成的阻碍。κατατίθεσθαι 在此可指确立、安置或维持稳定；结合已经施行的统治语境，译作“无法稳固”，同时避免过度断定是目的还是结果。
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: 由我们无可指摘地推行的共同治理
  rationale: “无可指摘地”保留 ἀμέμπτως 的自我褒扬语气；“推行”表达 κατευθυνομένην 的引导、治理含义；罕见词 συναρχίαν 可指共同治理、共同政权或联合统治，正文采用较自然且不过度制度化的“共同治理”。
theological_decisions:
- issue: 王室对该民族的敌意指控
  choice: 保留“混杂”“心怀敌意”“相抵触”“漠视”等带有指控性的措辞
  alternative: 改用“散居”“有独特律法”等中性表达
  rationale: 本节是诏书中说话者的政治宣传，并非叙述者直接作出的神学或道德裁断。忠实翻译应保留其敌意，同时借语境归属避免把指控悄然认可为事实。
- issue: συναρχίαν 所指的政治秩序
  choice: 译作“共同治理”并注明其他可能
  alternative: 译作“共同政权”或“联合统治”
  rationale: 原词罕见，所指可能是共同治理、共享政权或联合统治。正文不将其限定为某一种具体政体，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诏书语体。保留王室文告自我褒扬并贬斥被指控群体的修辞，不将其软化为中性叙述。脚注标记依正文出现次序排列为 [a]、[b]、[c]。
