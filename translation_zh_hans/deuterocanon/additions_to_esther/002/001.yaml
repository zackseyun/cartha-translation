    text: “地区”也可译作“辖区”“地域”或“土地”；希腊语所指较宽，但此处处于帝国行政语境。
    reason: lexical_alternative
  - marker: b
    text: “内容如下”直译为“写这些话”，也可译作“写道如下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: 信
  rationale: ἐπιστολή指书信或书面公文；此处是王室正式信函，以“信”表达自然，也保留文体性质。
- source_word: ἀντίγραφον
  choice: 副本
  rationale: ἀντίγραφον指文件的抄本或副本；“副本”符合现代汉语行政文书语体。
- source_word: Βασιλεὺς μέγας
  choice: 大王
  rationale: 这是君王称号；“大王”简洁保留其头衔性质和庄重语气，不将形容词仅理解为一般赞语。
- source_word: Ἀρταξέρξης
  choice: 亚达薛西
  rationale: 采用现代中文圣经传统中对该波斯王名的通行译名。
- source_word: χωρῶν
  choice: 辖区
  rationale: χώρα可泛指地区、地域或土地；在帝国行政语境中，“辖区”既显出行政属性，又不把它过度限定为某一种固定建制。
- source_word: ἄρχουσι
  choice: 统治者
  rationale: ἄρχων泛指掌权者；译作“统治者”可与较具体的τοπάρχης区分。
- source_word: τοπάρχαις
  choice: 地方长官
  rationale: τοπάρχης是管理某一地方或区域的人；“地方长官”准确且便于现代读者理解。
- source_word: ὑποτεταγμένοις
  choice: 臣服于他的
  rationale: 该分词表示从属或服在权下；补出“他的”说明其从属于亚达薛西王，符合上下文和自然汉语。
- source_word: τάδε γράφει
  choice: 写道
  rationale: 直译为“写这些话”；在正式书信引语前译作“写道”自然，并保留其引出下文的功能。
theological_decisions:
- issue: 次经叙事增补中的王室称号与行政措辞
  choice: 按正式帝国书信的开头翻译，不附加神学或历史协调性的解释。
  alternative: 将其意译为一般性的王家公告。
  rationale: 原文在此主要是行政和叙事语言。保留正式书信体与各级官职的区别，避免加入原文没有的教派性或历史性判断。
translation_notes:
