base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: zh_hans
  text: 因此，我们已指示那些按照哈曼——那位受命掌管政务、作我们第二位父亲的人——所写的文书向你们传达指令的人[a]，要在本年十二月亚达月十四日，用他们仇敌的刀剑，把他们所有人连同妇女和孩子斩草除根，毫不怜悯，绝不留情，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些向你们口授文书的人”。这个希腊语分词可指口授文书措辞的人，也可指负责起草或传达文书的官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: 我们已指示
  rationale: 该词形和具体语义较难确定；在王室公文的语境中，它表示发出指示。“已指示”既通顺，也不过度限定传令方式。
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: 那些向你们口授文书的人
  rationale: ὑπαγορεύω通常指口授或给出文书措辞。译文保留“口授”的基本意义，但不把这些人的官职具体化；脚注说明也可能泛指负责起草文书的人。
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: 照哈曼所写的文件行事
  rationale: γεγραμμένοις在此指已经写成的官方材料。“文件”比“书信”范围更宽，符合王室诏令语境；汉语中补出“照……行事”，使复杂的希腊语行政句式自然清楚。
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: 受命掌管政务
  rationale: 该短语表示被任命管理事务；“政务”在王室语境中准确传达其行政职权。
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: 我们的第二位父亲
  rationale: 直译保留原文罕见而夸张的宫廷尊称，不擅自改释为“首席顾问”等具体官衔。
- source_word: ἀπολέσαι ὁλορριζεί
  choice: 斩草除根
  rationale: ἀπολέσαι表示毁灭、消灭，ὁλορριζεί强调连根除尽。“斩草除根”在现代汉语中自然地保留彻底根除的意象与力度。
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: 用他们仇敌的刀剑
  rationale: 与格表示工具；“他们”指被消灭的人，使仇敌关系在汉语中清楚，同时不改变原文意象。
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: 毫不怜悯，绝不留情
  rationale: 两个并列名词分别表达没有怜悯和不予宽免；这一对汉语短语保留累加强调。
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ τοῦ ἐνεστῶτος ἔτους
  choice: 在本年十二月亚达月十四日
  rationale: 按自然汉语日期顺序表达，并保留亚达月是第十二月以及“本年”的正式公文语气。
theological_decisions:
- issue: 王室诏令中的灭绝性暴力语言
  choice: 直译包括妇女和孩子在内的彻底杀戮命令，不作淡化
  alternative: 用“清除”“处置”等较温和的行政措辞
  rationale: 希腊文明确说要消灭所有人，包括妇女和孩子，并以“连根除尽”和“毫不怜悯、绝不留情”加强语气。译文应忠实保留这项命令的道德严酷性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留王室公文语气。为避免照搬不透明的希腊语长句，分为三句，但保留末尾逗号，以反映本节在诏书中尚未结束。脚注标记分别置于其实际解释的短语之后。
