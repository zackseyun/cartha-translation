  yaml_path: translation/deuterocanon/additions_to_esther/002/007.yaml
  text: so that those who were hostile in the past and are hostile now[a], after going down violently to Hades in a single day, may for all time afterward provide us with stable and undisturbed affairs.
translation:
  language: zh_hans
  text: 好让那些从前和现在都怀有敌意的人，在一天之内暴死、下到阴间[a]之后，使我们今后的局势始终安定，不受扰乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在的领域，并非特指最终受刑罚之处。或译“坟墓”或“死者的领域”。
    reason: 说明ᾅδης的语义范围，避免读者将其直接等同于“地狱”。
lexical_decisions:
- source_word: οἱ πάλαι καὶ νῦν δυσμενεῖς
  choice: 那些从前和现在都怀有敌意的人
  rationale: “怀有敌意”准确表达 δυσμενεῖς 所指的敌对态度，又不将其过度限定为具有正式身份的“敌人”；“从前和现在都”保留 πάλαι καὶ νῦν 的时间跨度。
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: 在一天之内
  rationale: 自然表达事件集中发生于一日的突然性。
- source_word: βιαίως εἰς τὸν ἅδην κατελθόντες
  choice: 被强行打入阴间之后
  rationale: “强行”保留 βιαίως 的暴力、强制意味；“打入”以自然汉语传达向下进入死者领域的严厉图景；将分词按时间关系译为“之后”。
- source_word: εἰς τὸν μετέπειτα χρόνον
  choice: 今后
  rationale: 简明自然地表达从敌对者覆灭以后开始的未来时期。
- source_word: εὐσταθῆ καὶ ἀτάραχα
  choice: 安定，不受扰乱
  rationale: 分别传达稳固安稳以及不受骚动、动乱侵扰的含义，同时避免中文近义词堆叠。
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: 使我们……的局势
  rationale: τὰ πράγματα 在此泛指公共处境或事态；“局势”符合王室诏书的政治语境，而“使我们……安定”自然表达 παρέχωσιν 的致使关系。
- source_word: διὰ τέλους
  choice: 始终
  rationale: 表达持续到底、长久不变的意思，并与“今后”合起来呈现持久性。
theological_decisions:
- issue: 次经希腊语语境中 ᾅδης 的译法
  choice: 阴间
  alternative: 坟墓；死者的世界；地狱
  rationale: ᾅδης 指死者所在的领域，并不专指最终刑罚之地。“阴间”是现代汉语圣经语境中自然且较为中性的对应词，避免用“地狱”引入后期教义含义；脚注保留语义说明。
translation_notes:
  register: 采用现代、庄重而易懂的诏书语体。“好让”承接目的从句；句中保留敌对者覆灭与此后局势安定之间略显紧缩的希腊语逻辑关系，不额外补入解释性因果内容。
