base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: zh_hans
  text: 当我询问谋士们这事怎样才能办成[a]时，哈曼为我们指明了办法；他在我们中间以审慎见长，并被证实在善意上始终不变、忠诚坚定，且获得了王国中的第二位尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“哈曼向我们指出了”或“哈曼使我们知道了。”希腊文在“这事怎样才能办成”之后没有明说“指明”的宾语。
    reason: 说明 ἐπεδείξεν 后宾语省略，并保留“指明了办法”之外的词义可能。
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: 我询问谋士们
  rationale: 用时间背景式分句表达属格独立结构；“询问”自然传达 πυνθάνομαι，“谋士”符合王廷语境。
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: 这事怎样才能办成
  rationale: 保留“如何使这事达到完成”的含义；现代汉语以“办成”自然表达被动虚拟语气所含的可能性和完成意味。
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: 他在我们中间以审慎出众
  rationale: σωφροσύνη 在行政褒扬语境中指审慎、稳健的判断；διενέγκας 表示胜过或表现出众。
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: 始终怀有善意
  rationale: εὔνοια 是善意或好感，ἀπαραλλάκτως 表示不改变；“始终”简洁传达其恒常性。
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: 已显明自己……忠贞不渝
  rationale: πίστις 在王廷效忠语境中指忠诚可靠，而非宗教意义的信仰；βεβαίᾳ 强调坚定，ἀποδεδειγμένος 表示已经受证实或显明。
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: 获得了王国中仅次于王的尊荣
  rationale: γέρας 指尊荣、殊荣或特权；δεύτερον 在王室语境中表达居第二位的尊荣。中文补出“仅次于王”以清楚表达等级关系，但不把它具体化为未经明说的官职。
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: 哈曼为我们指明了办法
  rationale: ἐπιδείκνυμι 可指展示、指出；宾语承接前文“怎样办成”而省略。译文以“办法”补足汉语表达，脚注同时说明原文的省略和其他可能译法。
theological_decisions:
- issue: 非宗教王廷语境中 πίστις 的译法
  choice: 忠贞
  alternative: 信、信实、忠诚
  rationale: 此处称赞哈曼对王廷坚定可靠，并非谈论宗教信仰。“忠贞不渝”保留坚定忠诚的关系性含义。
- issue: 第二等尊荣所指的等级关系
  choice: 王国中仅次于王的尊荣
  alternative: 王国中的第二等尊荣
  rationale: “第二等”较贴近字面但现代汉语容易被理解为品质较差；“仅次于王”清楚传达王廷中的次位尊荣，同时不指定某一官职。
translation_notes:
  register: 采用现代、庄重而易懂的王室诏书语体。拆分希腊文长句以避免汉语层层嵌套；保留对哈曼的连续褒扬及原文宾语省略所产生的歧义，并以脚注交代。
