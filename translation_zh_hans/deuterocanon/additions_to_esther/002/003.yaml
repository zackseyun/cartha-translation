    rationale: “已显明自己始终怀有善意、忠贞不渝”在汉语中搭配稍显紧涩；调整为“被证实在善意上始终不变、忠诚坚定”可清楚体现 ἀποδεδειγμένος、ἀπαραλλάκτως 与 βεβαίᾳ 的修饰关系。
