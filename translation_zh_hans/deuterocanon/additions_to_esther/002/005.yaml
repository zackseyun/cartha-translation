base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: zh_hans
  text: 所以，我们已经认定：唯独这个民族始终与所有人对立[a]，在其律法中引入一种异样的生活方式[b]；他们又对我们的事务心怀恶意，造成最严重的祸害，以致王国无法安定，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有人”也可译作“人人”。希腊文用单数“每一个人”，在这里具有泛指作用。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文十分紧凑，带有敌意；其大意是把这个民族的律法和生活方式描绘为异样，并含有“改变／变更”之意。生活方式、律法和“异样”之间的具体句法关系可有不同理解。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: διειληφότες
  choice: 我们已经认定
  rationale: 该完成时分词表示已经形成并持定的判断；在王室谕令的语境中，“认定”既自然，也不把它夸大为正式裁决。
- source_word: ἔθνος
  choice: 民族
  rationale: 这里指一个可辨识的族群；“民族”能保留政治和族群色彩，又避免现代汉语中“种族”可能带来的生物学含义。
- source_word: μονώτατον
  choice: 唯独
  rationale: 最高级形式强调这个民族被指为唯一、格外孤立的一方；“唯独”准确保留这种排他性指控。
- source_word: ἐν ἀντιπαραγωγῇ ... κείμενον
  choice: 始终……对立
  rationale: κείμενον描写持续的状态，ἀντιπαραγωγή表达敌对、对抗的姿态；结合διὰ παντός译作“始终……对立”。
- source_word: παντὶ ... ἀνθρώπῳ
  choice: 所有人
  rationale: 希腊文为单数形式，具有泛指作用；现代汉语用“所有人”可自然表达其普遍范围。
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: 偏离常态，过着一种因其律法而显得异样的生活
  rationale: 原文结构高度压缩，把“生活方式”“律法”“异样”和“偏离”结合在一起。此译保留法律与生活方式两方面，并避免擅自限定究竟是改变律法还是在生活方式上有别。
- source_word: δυσονοοῦν
  choice: 心怀恶意
  rationale: 该词表示不友善或敌对的意向；“心怀恶意”符合谕令的控诉语气。
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: 我们的事务
  rationale: 该短语可广指王室或国家所关切的政务与利益；“我们的事务”保留原文的宽泛性。
- source_word: τὰ χείριστα συντελοῦν κακά
  choice: 造成最严重的祸害
  rationale: χείριστα是强烈的最高级，συντελοῦν含促成、造成之意；此译在现代汉语中自然地保留控诉力度。
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: 以致王国无法安定
  rationale: 该结构表示所指控行为的目的或结果，原文在此不完全消除二者之间的张力；“以致”侧重上下文中自然的结果含义，而“无法安定”准确表达政治稳定。
theological_decisions:
- issue: 王室文书对犹太民族的敌意描述
  choice: 直接保留文书中的控诉和敌意语气
  alternative: 在正文中加入“据称”“他们声称”等距离化措辞
  rationale: 本节属于王室谕令，所述内容代表发令者的敌对立场。译文应忠实呈现其修辞，不宜弱化，也不应借增添解释性措辞替读者判断其真实性。
- issue: πρὸς τό结构所表达的是目的还是结果
  choice: 译作“以致”，在正文中呈现结果含义
  alternative: 译作“为要使王国不得安定”
  rationale: 该结构可表达目的或结果；上下文将国家不稳描绘为上述行为所造成的后果，但原文仍带有指控其意图的可能性，因此不在正文中作更强的动机判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持王室谕令自称“我们”的正式口吻。句末保留逗号，因为希腊原句在此尚未结束，语法和论述都延续到下一节。
