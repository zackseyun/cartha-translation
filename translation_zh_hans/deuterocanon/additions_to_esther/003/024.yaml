base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/024.yaml
  text: But rescue us by your hand, and help me, who am alone and have no one except you, Lord. You have knowledge of all things,
translation:
  language: zh_hans
  text: 求你用你的手搭救我们，也求你帮助我；我孤身一人，除你以外没有别人。主啊，你知道一切，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαι
  choice: 救
  rationale: 不定过去时命令语气表达危难中急切的搭救请求；“救”简洁自然，并由上下文明确为脱离当前危险。
- source_word: ἐν χειρί σου
  choice: 亲手
  rationale: 该短语表示上帝以自己的手施行拯救，即亲自运用能力；“亲手”以自然汉语保留“手”的意象和施事含义。
- source_word: βοήθησόν μοι
  choice: 帮助我
  rationale: 直接对应命令语气及与格代词，适合现代汉语祷告语体。
- source_word: τῇ μόνῃ
  choice: 我这孤身一人……的人
  rationale: 阴性单数与说话者以斯帖一致，突出她孤立无援的处境；在汉语中用同位描述自然呈现。
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: 除你以外别无倚靠
  rationale: 原文直译为“除你以外没有（任何人）”；“别无倚靠”自然表达此处没有其他援助者的含义，同时保留以神为唯一依靠的语境。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是向以色列的神直接呼求；“主啊”是庄重、通行的现代汉语祷告称谓。
- source_word: πάντων γνῶσιν ἔχεις
  choice: 你洞悉万事
  rationale: 原文为“拥有关于一切的知识”；“洞悉万事”在汉语中凝练、庄重，并传达完全知晓的意思。
theological_decisions:
- issue: 直接称呼上帝时Κύριε的译法
  choice: 主啊
  alternative: 主人啊
  rationale: 祷告对象是以色列的神，“主啊”符合κύριος的神圣称谓用法，也避免“主人”在现代汉语中的人际或所有权色彩。
- issue: μὴ ἔχουσῃ εἰ μὴ σέ所表达的唯一性
  choice: 除你以外别无倚靠
  alternative: 除你以外一无所有
  rationale: 原文省略ἔχω的宾语，语境可理解为没有其他援助者；“别无倚靠”保留这种关系性含义，避免误解为没有任何财物。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“亲手”保留神之“手”的意象；末尾逗号保留原文句子尚未结束、继续进入下一节的结构。
