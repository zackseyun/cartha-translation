base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/019.yaml
  text: to remove the decree from your mouth and to destroy your inheritance[a], and to shut the mouth of those who praise you, and to extinguish the glory of your house and your altar[d][c][b],
translation:
  language: zh_hans
  text: 要废除你口所定的谕令[a]，毁灭你的产业[b]，封住赞美你的人的口[c]，并熄灭你殿宇的荣耀，毁灭你的祭坛[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你口所定的谕令”也可译作“除去你口中的谕令”。这句话大概是指使上帝以权威颁定的命令失效。
    reason: lexical_alternative
  - marker: b
    text: “你的产业”可能指属于上帝的子民或所有物；圣经的盟约用语常把以色列称为上帝的产业。
    reason: cross_reference
  - marker: c
    text: “封住……的口”意为使他们不能出声，也就是“使赞美你的人沉默”。正文保留了希腊文具体的口部意象。
    reason: lexical_alternative
  - marker: d
    text: “殿宇”的希腊文直译是“房屋”或“家”；这里与“祭坛”并列，大概是指圣殿。希腊文以同一动词连及“荣耀”和“祭坛”；中文为清楚起见，将对祭坛的结果表达为“毁灭”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐξᾶραι
  choice: 废除
  rationale: 此处是不定式，承接敌对者的目的；该词有“除去、拿走”之意，与“定旨”搭配时译作“废除”自然，也能表达使其失效的含义。
- source_word: ὁρισμὸν στόματός σου
  choice: 你口中的定旨
  rationale: ὁρισμός指确定的决断或谕令；保留“口”的意象，使上帝权威的言语与下文被封住的赞美之口形成呼应。
- source_word: ἀφανίσαι
  choice: 毁灭
  rationale: 该词表示使某物消失或灭亡；“毁灭”保留了威胁的强烈程度。
- source_word: κληρονομίαν σου
  choice: 你的产业
  rationale: κληρονομία可指产业、基业或继承所得；在圣经语境中可指属于上帝的子民或所有物。“产业”保留盟约色彩，同时不在正文中明定所指。
- source_word: ἐμφράξαι στόμα
  choice: 封住……的口
  rationale: ἐμφράσσω本义为堵住、封闭；采用具体表达，以保留原文两次出现“口”的平行意象。
- source_word: αἰνούντων σοι
  choice: 赞美你的人
  rationale: 现在分词指正在或一向赞美上帝的人；现代汉语用“赞美你的人”自然清楚。
- source_word: σβέσαι
  choice: 熄灭
  rationale: 该词通常指把火或光扑灭；用于荣耀和祭坛时保留原文鲜明而强烈的隐喻。
- source_word: δόξαν οἴκου σου
  choice: 你殿宇的荣耀
  rationale: δόξα译作“荣耀”，保留其圣经与神学分量；οἶκος字面为“房屋、家”，但在此与祭坛并列，极可能指上帝的殿，故用不额外添加专名的“殿宇”。
- source_word: θυσιαστήριόν σου
  choice: 你的祭坛
  rationale: θυσιαστήριον的标准含义是祭坛；保留第二人称所有格，以维持对上帝的直接呼告。
theological_decisions:
- issue: “你的产业”所指为何
  choice: 正文保留“你的产业”，不直接改写为以色列或你的子民
  alternative: 你的子民；你的基业
  rationale: 上下文很可能指属于上帝的百姓，但希腊文没有明确点名。保留产业一词，既维持盟约用语，也避免消除原文的指称空间。
- issue: “你的殿宇”与圣殿的关系
  choice: 译作“你的殿宇”，并以脚注说明原文字面
  alternative: 你的家；你的圣殿
  rationale: οἶκος本身只说房屋或家，但与“祭坛”并列时大概指圣殿。“殿宇”在中文中既符合语境，又不把较明确的“圣殿”直接写入正文。
- issue: “熄灭”是否同时支配荣耀和祭坛
  choice: 保留一个谓语“熄灭”，同时支配“荣耀”和“祭坛”
  alternative: 熄灭荣耀，并毁掉祭坛
  rationale: 希腊文只有一个σβέσαι支配后面的并列宾语。即使“熄灭祭坛”在现代汉语中带有强烈隐喻，仍应保留原文的语法张力，不擅自补入另一个动词。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。句式保持祷告中连续列举敌对目的的节奏；“定旨、产业、荣耀、祭坛”等词保留经文语域，但避免古奥表达。正文保存“口”的重复意象以及“熄灭祭坛”这一原文隐喻张力。
