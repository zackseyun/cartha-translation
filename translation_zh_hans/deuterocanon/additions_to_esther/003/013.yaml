base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/013.yaml
  text: And she was pleading with the Lord[a], the God of Israel, and said, “My Lord, our king, you alone are the only one; help me, who am alone and have no helper except you,”
translation:
  language: zh_hans
  text: 她向主，就是以色列的上帝，恳切祈求，说：“我的主，我们的王，惟有你[a]；求你帮助我这个孤身一人、除你以外没有帮助者的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是独一的。”希腊文此处表达简略。
    reason: 保留σὺ εἶ μόνος在句法和意义上的省略性，并提供较贴近表层形式的译法。
lexical_decisions:
- source_word: ἐδεῖτο
  choice: 恳切祈求
  rationale: δέομαι表示迫切恳求；结合未完成时，以“恳切祈求”传达持续而急切的祈求。
- source_word: Κυρίου θεοῦ Ἰσραὴλ
  choice: 主—以色列的上帝
  rationale: 保留“主”与“以色列的上帝”两个称谓，并以破折号清楚表达同位关系。
- source_word: Κύριέ μου
  choice: 我的主
  rationale: 明确译出μου，并保留直接呼告及个人倚靠的语气。
- source_word: ὁ βασιλεὺς ἡμῶν
  choice: 我们的王
  rationale: 自然、直接地保留上帝作为以色列之王的称号。
- source_word: σὺ εἶ μόνος
  choice: 惟有你
  rationale: 希腊文直译近于“你是独一的／只有你”，但谓语含义略显省略；“惟有你”保留其简短、强调而开放的表达，不补入未经明说的能力或身份。
- source_word: βοήθησόν μοι
  choice: 求你帮助我
  rationale: 以简洁有力的祈使表达求助，并用“求”体现祷告语境中的恳请。
- source_word: τῇ μόνῃ
  choice: 我这孤身一人……的人
  rationale: 该阴性与格形式描述说话者以斯帖；如此处理既合乎现代汉语，也保留她孤立无援的处境。
- source_word: μὴ ἔχουσῃ βοηθὸν
  choice: 再无援助者
  rationale: 保留βοηθός所指的施助者，而不将其完全抽象化为“帮助”。
- source_word: εἰ μὴ σέ
  choice: 除你以外
  rationale: 清楚表达排除意义：上帝之外没有任何援助者。
theological_decisions:
- issue: 祷告中上帝的君王称号
  choice: 我们的王
  alternative: 我们的统治者
  rationale: 原文明确称上帝为以色列群体的王；保留“王”能呈现本段中上帝主权与地上君王之间的张力。
- issue: σὺ εἶ μόνος的省略式宣认
  choice: 正文译作“惟有你”，脚注列出“你是独一的”
  alternative: 你独自是唯一的那一位
  rationale: 原文表达短促，可能强调上帝独一，也可能在上下文中指惟有他能施救。正文不补足隐藏谓语，以免消解原有歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“恳切祈求”“我的主，我们的王”保持肃穆感；“孤身一人、除你以外再无援助者”自然呈现以斯帖的绝境。正文中的[a]与脚注对应。
