  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: zh_hans
  text: 他说：“主啊，主啊，统管一切权势的王！因为万有都在你的权柄之下；当你定意拯救以色列时，没有人能抗拒你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε, κύριε
  choice: 主啊，主啊
  rationale: 保留希腊文重复的呼告，以传达祷告中的迫切与敬畏；“主”是 κύριος 作为神圣称号时自然、庄重的现代汉语译法。
- source_word: βασιλεῦ πάντων κρατῶν
  choice: 统管一切权势的王
  rationale: κράτος 可指力量、权势或统治权。此译保留其广泛范围，不把它局限为政治疆域；“统管”自然表达这位王超越一切权势的主权。
- source_word: ἐν ἐξουσίᾳ σου τὸ πᾶν ἐστιν
  choice: 万有都在你的权柄之下
  rationale: ἐξουσία 在王权语境中侧重权柄、支配权；τὸ πᾶν 用“万有”表达总体性，并保持祷告文体的庄重。
- source_word: ὁ ἀντιδρῶσών σοι
  choice: 没有人能抗拒你
  rationale: 将未来分词的实体化用法译为“能抗拒你”，表达无人能够有效阻挡，而非仅指无人有反对的意愿。
- source_word: ἐν τῷ θέλειν σε
  choice: 当你定意
  rationale: 介词加冠词不定式在此具有时间兼情状意义；“定意”既保留神主动意愿的含义，也符合庄重而自然的现代汉语。
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: 拯救以色列
  rationale: σῴζω 在此既可指救拔，也具有更宽广的“拯救”意义；上下文是为以色列脱离危难而祷告。
theological_decisions:
- issue: 重复的神圣呼告 Κύριε, κύριε
  choice: 主啊，主啊
  alternative: 主，我主啊
  rationale: 原文没有物主代词，因此不增添“我”；保留重复，以免削弱祷告的迫切和敬畏。
- issue: πάντων κρατῶν 的范围
  choice: 一切权势
  alternative: 一切统治权；一切力量
  rationale: 原词可涵盖力量、权势与统治，不应只解释为地上的诸国或疆域；“一切权势”保留其综合性和神学张力。
- issue: ἐξουσία 表达能力还是主权
  choice: 权柄
  alternative: 能力；权能
  rationale: 王权语境使“权柄”更贴近合法支配与主权的内涵，同时并不否认神施行拯救的能力。
translation_notes:
  register: 采用现代标准普通话的庄重祷告语体。“万有”“权柄”“定意”清楚易懂，同时维持经文的崇高感。原文 καὶ εἶπεν 的主语由上文承接，译作“他说”。本节无需脚注；所有真实词义宽度已在不累赘正文的前提下保留。
