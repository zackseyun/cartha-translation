  yaml_path: translation/deuterocanon/additions_to_esther/003/009.yaml
  text: Do not overlook your portion[a], which I redeemed for myself out of the land of Egypt.
translation:
  language: zh_hans
  text: 不要忽视你从埃及地为自己赎回的那一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那一份”也可译为“份额”或“产业”。
    reason: 说明μερίς的词义范围，同时保留原文未明说的归属含义。
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: 不要不顾
  rationale: ὑπεροράω在这里表示忽视、不理会；“不要不顾”保留禁止语气，也符合向上帝祈求的语境。
- source_word: τὴν μερίδα σου
  choice: 你的分
  rationale: μερίς本义为所分得的一份、份额；直译为“你的分”可保留原文关于归属的比喻，不直接限定为“产业”或“子民”。
- source_word: ἣν
  choice: 就是……的
  rationale: 关系代词ἣν回指“你的分”；汉语用“就是……的”引出限定说明，关系清楚而自然。
- source_word: σεαυτῷ
  choice: 为自己
  rationale: 反身代词与第二人称动词一致，强调上帝将这一份赎归自己；“为自己”保留其反身和受益含义。
- source_word: ἐλυτρώσω
  choice: 你……赎回
  rationale: ἐλυτρώσω是第二人称单数形式，在此指受祈求者上帝所施行的行动；λυτρόω含赎回、解救之意，“赎回”保留其救赎分量。
- source_word: ἐκ γῆς Αἰγύπτου
  choice: 从埃及地
  rationale: 忠实保留介词短语及“埃及地”的圣经惯用表达。
theological_decisions:
- issue: μερίς是否应明确解释为上帝的子民或产业
  choice: 你的分
  alternative: 你的产业；属于你的子民
  rationale: 原文使用“份额”比喻，却未明说“子民”或“产业”。正文保留这一含蓄的归属与盟约意蕴，脚注提供较明确的词义选择。
- issue: σεαυτῷ与ἐλυτρώσω的人称和归属关系
  choice: 你从埃及地为自己赎回的
  alternative: 从埃及地赎归你自己的
  rationale: 希腊文动词和反身代词均为第二人称，祈祷者是在对上帝说话；因此不采用英语咨询层中的第一人称“I redeemed for myself”，而按原文译为“你……为自己赎回”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不要不顾”比“不要漠视”更适合祈祷语气；“你的分”刻意保留原文简洁的份额比喻。正文依希腊文第二人称语法翻译，不沿用英语咨询层误作第一人称的表达。
