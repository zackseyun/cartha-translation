base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: zh_hans
  text: 如今，主啊，上帝、君王、亚伯拉罕的上帝，求你顾惜你的子民，因为他们正盯着我们，意图毁灭我们[a]；他们一心想毁灭你自起初就有的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达凝练，也可译作“他们敌视我们，意图使我们灭亡”或“他们注视着我们，要使我们遭毁灭”。
    reason: 保留ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν所表达的敌意注视及其指向毁灭的语义张力。
  - marker: b
    text: “自起初”也可按惯用语义理解为“自古以来”。“产业”在这里可能指上帝的子民，也可能较广地包括他们所承受的圣约归属与传承。
    reason: 说明ἐξ ἀρχῆς的时间含义，并保留κληρονομία所指范围的真实歧义。
lexical_decisions:
- source_word: Κύριε ὁ θεὸς ὁ βασιλεὺς ὁ θεὸς Ἀβραάμ
  choice: 主上帝，君王，亚伯拉罕的上帝啊
  rationale: 保留原文层叠的呼求与同位称号，并用“啊”自然标示汉语呼格；不将诸称号合并，以免削弱祷告的庄严节奏。
- source_word: φεῖσαι τοῦ λαοῦ σου
  choice: 求你饶恕你的子民
  rationale: φείδομαι在此是恳求不要使其遭灭亡；“饶恕”可表达顾惜、不加毁灭，且“子民”保留λαός在圣约语境中的群体含义。
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: 他们虎视眈眈，要毁灭我们
  rationale: 原短语高度凝练，表达带敌意地盯住某人、以其毁灭为目的。“虎视眈眈”在现代汉语中自然传达敌意注视，后接“要毁灭我们”明示εἰς καταφθοράν的目的或趋向。
- source_word: ἐπεθύμησαν ἀπολέσαι
  choice: 他们一心要灭掉
  rationale: ἐπιθυμέω表示强烈愿望或意图；在敌对语境中“一心要”比单纯“想要”更能体现其强度，同时没有把它明确解释成已经制定计划。
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: 你从起初就拥有的产业
  rationale: 保留κληρονομία的“产业”隐喻，不直接替换为“子民”；“从起初就拥有”自然表达ἐξ ἀρχῆς与所属关系，同时脚注保留“自古以来”的惯用理解。
theological_decisions:
- issue: “你的产业”所指为何
  choice: 正文保留“产业”的圣约隐喻，语境上与“你的子民”平行
  alternative: 明确译成“你所继承的子民”，或理解为祖地及整体圣约遗产
  rationale: 原文没有重复λαός，而使用κληρονομία；保留不同意象可避免把可能涵盖子民、归属和圣约传承的表达缩窄。
- issue: ἐξ ἀρχῆς的时间范围
  choice: 从起初
  alternative: 自古以来
  rationale: “从起初”形式上贴近原文，也保留其可能指向起源的力度；但此处也可能惯用地表示久远的过去，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。称号层叠照原文保留；“虎视眈眈”虽属常用成语，但语气庄重且准确传达敌意注视。分号用于呈现两项彼此相连的控诉。
