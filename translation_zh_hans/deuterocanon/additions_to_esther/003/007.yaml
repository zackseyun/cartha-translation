base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: zh_hans
  text: 但我这样做，是为了不把人的荣耀置于上帝的荣耀之上。我不会向任何人下拜，惟独向你[a]——我的主下拜；我也不会出于骄傲做这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不会敬拜任何人，惟独敬拜你——我的主。”希腊语这个动词按语境既可指俯身下拜，也可指敬拜。
    reason: 保留προσκυνέω在致敬动作与宗教敬拜之间的词义幅度。
lexical_decisions:
- source_word: ἐποίησα
  choice: 我这样做
  rationale: 不定过去时直陈语气第一人称单数，指说话者已经采取的行动；结合后文目的从句，译为“我这样做”自然且直接。
- source_word: ἵνα μὴ θῶ
  choice: 是为了不把……置于
  rationale: 保留ἵνα的目的意味及τίθημι“放置、置于”的比喻表达，同时符合现代汉语习惯。
- source_word: δόξαν ἀνθρώπου
  choice: 人的荣耀
  rationale: ἀνθρώπου虽为单数属格，但此处可作类指，表示属于人的荣耀；译作“人的荣耀”既自然，也与下文“上帝的荣耀”形成对应。
- source_word: ὑπεράνω
  choice: 之上
  rationale: 准确表达“在……上方、超过”的比较关系。
- source_word: οὐ προσκυνήσω
  choice: 我不会……下拜
  rationale: προσκυνέω可指俯伏致敬，也可指敬拜；正文采用能体现具体动作、又不过早限定为宗教敬拜的“下拜”，并以脚注保留另一可能。
- source_word: οὐδένα πλὴν σοῦ
  choice: 不向任何人下拜，惟独向你
  rationale: 清楚保留否定范围及πλήν所表达的例外关系。
- source_word: τοῦ κυρίου μου
  choice: 我的主
  rationale: 该短语与第二人称“你”同位；祷告语境表明所指为上帝，因此译作“我的主”，但不额外扩展其含义。
- source_word: οὐ ποιήσω αὐτὰ
  choice: 我做这些事，并不是
  rationale: 保留αὐτά的复数“这些事”。希腊语将来时在此表达说话者不会带着某种动机行这些事；汉语用“并不是”连接动机说明更自然。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 出于骄傲
  rationale: ὑπερηφανία表示骄傲、自高；“出于骄傲”自然呈现行为动机，同时保留原文的道德分量。
theological_decisions:
- issue: προσκυνέω是指礼仪性下拜还是敬拜
  choice: 正文译为“下拜”
  alternative: “敬拜”或“俯伏”
  rationale: 语境涉及末底改拒绝向人表示臣服，而前句又以人的荣耀与上帝的荣耀对比。“下拜”保留具体社会动作，不把该词的宗教含义完全排除；脚注说明“敬拜”的可能，以保存原文张力。
- issue: ἀνθρώπου的单数如何表达
  choice: 译为类指的“人的荣耀”
  alternative: “一个人的荣耀”
  rationale: 希腊语为单数，但无冠词且在“上帝的荣耀”的对照结构中可自然理解为人的荣耀。现代汉语“人的荣耀”既可保留人神对比，也避免不必要地限定为某个未明说的个体。
- issue: τοῦ κυρίου μου所指及称谓
  choice: 译为“我的主”
  alternative: “我的主人”
  rationale: 本段是向上帝发出的祷告，代词“你”指向上帝；“我的主”符合语境。译文不借大小写作额外神学标示。
- issue: ἐν ὑπερηφανίᾳ修饰的行为范围
  choice: 译为“我做这些事，并不是出于骄傲”
  alternative: “我不会骄傲地做这些事”
  rationale: 原文可理解为说话者否认骄傲是其行为动机。所选译法在汉语中清楚自然，同时不进一步界定“这些事”具体包含哪些行动。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“置于……之上”保留荣耀高下的比喻；“惟独”突出例外关系。破折号标明“我的主”是对“你”的同位称呼。脚注标记[a]已在正文对应位置出现。
