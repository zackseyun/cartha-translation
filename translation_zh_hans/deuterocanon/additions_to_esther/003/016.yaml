  text: 如今，我们在你面前犯了罪，你把我们交在我们仇敌手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: 如今
  rationale: 承接上文并标明当前处境；“如今”自然庄重，不额外加入希腊文未明示的转折。
- source_word: ἡμάρτομεν
  choice: 我们……犯了罪
  rationale: 准确表达不定过去时的认罪陈述；汉语无需用时态助词强行区分“犯了”与“已经犯了”，此处“犯了罪”也自然带出当前后果。
- source_word: ἐνώπιόν σου
  choice: 在你面前
  rationale: 保留身处上帝面前、为其所见并向其负责的关系与审判意味。
- source_word: παρέδωκας
  choice: 你就把我们交在
  rationale: 直接保留第二人称的神圣施事与交付到他人权下之意；“就”自然体现前句认罪与后句审判之间的语境联系，但不把因果说得超过原文。
- source_word: εἰς χεῖρας
  choice: ……手中
  rationale: 保留圣经中“落入某人手中”即受其权势支配的形象，现代汉语也通顺。
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: 仇敌
  rationale: “仇敌”准确表达敌对者，语体庄重且符合祷告语境；所属关系由“我们交在仇敌手中”自然理解为“我们的仇敌”。
theological_decisions:
- issue: 以色列受审判时上帝的直接作用
  choice: 明确译作“你就把我们交在仇敌手中”
  alternative: 弱化为“我们便落在仇敌手中”
  rationale: 希腊文以第二人称 παρέδωκας 明确以上帝为施事者。译文保留罪、神的审判和仇敌权势之间的张力，不淡化神圣施事。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。句式紧凑，保留“在你面前”和“交在……手中”两个源文意象；无须脚注。
