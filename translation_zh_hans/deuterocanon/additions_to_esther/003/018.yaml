  text: And now they were not satisfied with the bitterness of our slavery[a], but they have laid their hands upon us,
translation:
  language: zh_hans
  text: 如今，他们还不以我们所受奴役的苦楚为足，竟又伸出了手[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“放置了他们的手”；原文没有明说对象或具体行动，按上下文可能指他们进一步采取敌对行动。
    reason: 说明原文省略结构及其可能含义，避免正文擅自补足。
lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  choice: 还不以……为足
  rationale: 表达此前的苦难仍不能使他们满足；“不以……为足”自然地保留了原文被动形式在此所传达的“不觉得已经够了”。
- source_word: ἐν πικρασμῷ
  choice: 苦楚
  rationale: πικρασμός可指苦涩，也可指使人痛苦的遭遇；与δουλείας连用时，“苦楚”既保留苦味意象，也适合描述奴役带来的实际痛苦，避免扩写为原文未明说的“压迫”。
- source_word: δουλείας ἡμῶν
  choice: 我们所受奴役的
  rationale: δουλεία直指奴役、为奴状态。“我们所受奴役的苦楚”符合现代汉语，同时保留这种受辖制状态的严重性。
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: 伸出了手
  rationale: 原文直译近于“放置了他们的手”，但没有明说手伸向谁或要做什么。“伸出了手”在汉语中保持动作及其未完结感，并由脚注说明其可能含有敌对行动之意。
theological_decisions:
- issue: 民族受辖制语境中δουλεία的译法
  choice: 奴役
  alternative: 服役；束缚
  rationale: “奴役”直接呈现群体受人支配的严酷处境，又不额外引入特定历史制度的细节。
- issue: 是否补出“向我们下手”
  choice: 正文保留含蓄的“伸出了手”，不补明对象
  alternative: 向我们下手
  rationale: 所给希腊文本没有明确宾语，且句子在此尚未结束。正文保留其省略和张力，脚注再交代语境中可能的敌对含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“还不以……为足，竟又……”呈现递进和责难语气；句末保留逗号，以反映原文在此仍承接下文。
