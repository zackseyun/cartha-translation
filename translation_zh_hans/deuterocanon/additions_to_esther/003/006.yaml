translation:
  language: zh_hans
  text: 因为，为了拯救以色列，我本可以亲吻他的脚底。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”或译“解救”。
    reason: σωτηρία既可译作“拯救”，也可按本处民族危难的语境译作“解救”。
lexical_decisions:
- source_word: ἠδυνάμην
  choice: 我本可以
  rationale: 该未完成时形式表达过去处境中的能力或可能性；“本可以”自然地保留其假设或让步意味，又不把亲吻说成已经发生的事实。
- source_word: φιλεῖν
  choice: 亲吻
  rationale: φιλέω虽也可表示“爱”，但以“脚掌”为宾语时，最自然地指以亲吻表达极度谦卑或敬意的具体动作。
- source_word: πέλματα ποδῶν αὐτοῦ
  choice: 他的脚掌
  rationale: πέλμα指脚底或脚掌；现代汉语用“他的脚掌”既准确，也保留原文鲜明而屈尊的身体意象。
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: 为了拯救以色列
  rationale: πρός在此表示目的，σωτηρία在语境中指以色列得救、获解救；此译法自然清楚，同时以脚注保留“解救”的词义选择。
theological_decisions:
- issue: 以斯帖所说向王屈尊的性质
  choice: 表达一种为了拯救以色列而甘愿作出极度谦卑举动的假设性陈述
  alternative: 把这句话理解为她确实亲吻过他的脚掌，或仅泛指爱戴、尊敬他
  rationale: ἠδυνάμην配合不定式较适合表达当时能够或甘愿采取的行动，并不明确断言行动已经发生；“脚掌”这一具体宾语也支持实际亲吻所体现的极度屈尊，而非笼统的感情。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“本可以”保留希腊文关于过去能力与假设意愿之间的张力；“亲吻他的脚掌”保留原文具体而强烈的屈尊意象。
