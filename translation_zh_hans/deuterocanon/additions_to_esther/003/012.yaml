base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: zh_hans
  text: 她脱下自己荣华的衣裳，穿上困苦与哀悼的衣裳；她没有用华贵的香料[a]，却用灰和粪盖满自己的头[b]。她大大地使自己的身体降卑，又用自己扭结的头发，盖满了自己为欢庆而妆饰的每一处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华贵”所译的希腊语字面有“骄傲、高傲”的意思；这里可能指昂贵而招摇的香料或香膏。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“她使自己的头充满灰和粪”；也可译为“她把灰和粪撒满自己的头”。
    reason: lexical_alternative
  - marker: c
    text: 本句末尾的希腊语较难理解，可能是说她从前为欢庆而妆饰的部位，如今都被扭结或散乱的头发遮盖，显出哀悼的样子。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: 她脱下自己荣华的衣裳
  rationale: ἀφελομένη表示主动脱去；“荣华的衣裳”保留属格结构及衣着所象征的华美与身份，并与哀悼服形成鲜明对照。
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: 困苦和哀悼的衣服
  rationale: στενοχωρία含困厄、痛苦之意，πένθος指哀痛、服丧；译文兼顾处境与哀悼行为。
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: 不用华贵的香料
  rationale: ἡδύσματα指芳香物、香料或香膏；ὑπερήφανος本义为骄傲、高傲，在此修饰奢华招摇的香料。“华贵”较符合现代汉语语境，脚注保留其特殊字面色彩。
- source_word: σποδοῦ καὶ κοπριῶν
  choice: 灰和粪
  rationale: 直译两种刻意造成污秽和自卑的物质，不以“尘土”“污物”等较缓和的措辞削弱原文的强烈形象。
- source_word: ἔπλησεν τὴν κεφαλήν
  choice: 把灰和粪撒满头上
  rationale: 原文直说“使头充满”，汉语若直译易被误解为头颅内部；“撒满头上”自然地表达哀悼动作，同时在脚注说明字面形式。
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: 她极力卑微自己的身体
  rationale: 保留ταπεινόω“使卑微、降卑”的词义以及身体层面的自我降卑，不擅自具体化为禁食或其他仪式。
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: 自己从前为欢庆而妆饰的每一处
  rationale: κόσμος在此是妆饰而非世界，ἀγαλλίαμα带有欢庆、喜乐之意；加入“从前”明确其与当前哀悼状态的对比，未改变句中逻辑。
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: 扭结的头发
  rationale: στρεπτός与扭转、缠绕有关；“扭结”既贴近词形，也不武断判定为撕扯或纯粹蓬乱。
theological_decisions:
- issue: 以身体表达哀悼的强烈程度
  choice: 保留“灰和粪”及“卑微自己的身体”等直白形象
  alternative: 淡化为“灰尘和污物”或概括为“她使自己受苦”
  rationale: 经文强调以彻底自降来表达危难中的哀恸；淡化物质和身体形象会削弱原文力度。
- issue: στρεπτῶν τριχῶν αὐτῆς这一疑难短语的含义
  choice: 正文译为“扭结的头发”，脚注说明可能指头发散乱、失去平日妆饰
  alternative: 直接译为“蓬乱的头发”或“撕扯自己的头发”
  rationale: 原文明确涉及头发的扭转或缠结，却不能确定是否强调蓬乱，更没有清楚表达撕扯；因此保留其含混性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“荣华”“困苦和哀悼”“卑微自己的身体”保留经文的肃穆感；对“使头充满”作最低限度的汉语自然化处理，对末尾疑难短语则以正文保守翻译、脚注说明可能含义。
