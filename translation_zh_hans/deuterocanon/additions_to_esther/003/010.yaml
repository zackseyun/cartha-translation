base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: zh_hans
  text: 求你垂听我的恳求，怜悯你所得为业的子民[a]；求你使我们的哀恸变为欢喜，好叫我们得以存活，歌颂你的名。主啊，不要除灭赞美你之人的口[b]。以色列众人都竭尽全力呼求，因为他们的死亡就在眼前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“怜悯你的份”。“份”指抽签或分配所得之物；这里是指归属于上帝的子民，也可译作“你的产业”。
    reason: 保留κλῆρος的字面意象及“子民／产业”的译法差异。
  - marker: b
    text: “除灭赞美你之人的口”是原文的具体说法，意思包括不要消灭这些敬拜者，使他们不能再赞美。
    reason: 说明直译意象所表达的语用含义，避免读者误解为仅指身体器官。
lexical_decisions:
- source_word: κουσον τῆς δεήσεώς μου
  choice: 求你垂听我的恳求
  rationale: 按祷告语境处理为直接祈求；“垂听”庄重而自然，“恳求”体现δέησις所含迫切请求之意。
- source_word: ἱλάσθητι τῷ κλήρῳ σου
  choice: 怜悯你所得为业的子民
  rationale: ἱλάσθητι在此表达施怜悯、转意恩待；κλῆρος本义为签、所得之份，在语境中指上帝归属自己的子民。译文显明所指，同时以脚注保留字面意象。
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: 使我们的哀恸变为欢喜
  rationale: 保留从哀恸到欢喜的逆转结构；用语自然且符合祷告文体。
- source_word: ἵνα ζῶντες ὑμνῶμεν σου τὸ ὄνομα
  choice: 好让我们存活，歌颂你的名
  rationale: 保留“存活”与持续赞美之间的目的关系；ὑμνέω译为“歌颂”，兼具颂赞及吟唱色彩。
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: 不要除灭赞美你之人的口
  rationale: 保留希腊文“除灭……的口”这一强烈具体的意象，不直接释为“使……闭口”；脚注说明其语用含义。
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: 都竭尽全力呼求
  rationale: ἐκράζω表示高声呼喊；ἐξ ἰσχύος αὐτῶν在此表达用尽力量，以“竭尽全力”自然传达其强度。
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: 他们的死亡就在眼前
  rationale: 对应原文两处αὐτῶν，并保留死亡迫近、已在眼前的鲜明表达。
theological_decisions:
- issue: κύριε的称谓
  choice: 主啊
  alternative: 耶和华啊
  rationale: 底本为希腊文κύριε，并未直接呈现希伯来文神名；译作“主啊”既忠于现有见证，也避免反向重构底本。
- issue: τῷ κλήρῳ σου的所指
  choice: 你所得为业的子民
  alternative: 你的份／你的产业
  rationale: κλῆρος保有“抽签所得之份”的字面背景，在本祷告中则以以色列为上帝所属之民。正文表达语境所指，脚注保留其词义张力。
- issue: ἱλάσθητι的神学色彩
  choice: 怜悯
  alternative: 息怒施恩／悦纳
  rationale: 此处是求上帝恩待其子民，不宜加入经文没有明说的特定赎罪机制；“怜悯”准确传达祈求的作用力，同时不抹去其求上帝转意施恩的背景。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂听、哀恸、歌颂”保持经文尊严但不过度文言；保留原文连续祈求及最后全体呼求的紧迫感。所有脚注标记均已置于正文对应位置。
