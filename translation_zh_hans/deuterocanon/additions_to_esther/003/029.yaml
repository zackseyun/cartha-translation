base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: zh_hans
  text: 上帝啊，你大有能力，统管万有；求你垂听失去希望之人的呼声，救我们脱离作恶之人的手，也救我脱离我的恐惧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救我脱离我所惧怕的事。”希腊语既可指以斯帖心里的恐惧，也可指她所惧怕的危险。
    reason: 词义存在合理的双重理解，正文无法同时明确表达两者。
lexical_decisions:
- source_word: ὁ θεὸς ὁ ἰσχύων ἐπὶ πάντας
  choice: 能力统管万有的上帝啊
  rationale: 定冠词加主格在祷告中作直接呼语；“能力统管万有”表达 ἰσχύων ἐπὶ πάντας 所指向的能力与至高权柄，同时不把 πάντας 不必要地限于“所有人”。
- source_word: εἰσάκουσον
  choice: 求你垂听
  rationale: 该命令式在祷告中表达恳求；“垂听”既自然庄重，也含有留意并回应呼求的意味。
- source_word: φωνὴν ἀπηλπισμένων
  choice: 失去希望之人的呼声
  rationale: ἀπηλπισμένων 描写已经陷入无望处境的人；“失去希望之人”保留其完成状态和悲苦色彩，“呼声”则自然传达这里祈求上帝听见的声音。
- source_word: ῥῦσαι ἡμᾶς / ῥῦσαί με
  choice: 救我们 / 救我
  rationale: ῥύομαι 指从危险或敌对势力中救出；两处重复使用“救”，保留希腊文的平行和反复。
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: 脱离作恶之人的手
  rationale: 保留“手”这一表示控制或权势的源文比喻；τῶν πονηρευομένων 泛指正在行恶的人，不将其窄化为谋害者。
- source_word: ἐκ τοῦ φόβου μου
  choice: 脱离我的恐惧
  rationale: 这是希腊文最直接的表达，可首先理解为内在的恐惧，同时仍可能借“恐惧”指引发恐惧的危险；正文不替原文消解这一含混。
theological_decisions:
- issue: ἐκ τοῦ φόβου μου 是指从内在恐惧中获救，还是从所惧怕的外在危险中获救
  choice: 脱离我的恐惧
  alternative: 脱离我所惧怕的事
  rationale: 希腊语短语既可指人的恐惧状态，也可转指令人惧怕的对象。正文采用较直接的表达，脚注保留另一种合理理解，以维持祷告中的情感与处境张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你垂听”体现恳求语气；两次使用“救”保持原文修辞平行；保留“作恶之人的手”这一清楚可懂的圣经性比喻。
