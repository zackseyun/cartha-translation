base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: zh_hans
  text: 你也知道，我憎恨不法之人的荣耀，并且厌恶未受割礼者和一切外族人的床榻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床榻”也可译作“婚床”，并可借指婚姻或性关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίσησα
  choice: 我憎恨
  rationale: 希腊语为不定过去时主动直陈语气；在祷告语境中表达已然且强烈的厌弃。“憎恨”保留原词力度，又符合现代庄重汉语。
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα在此可指荣耀、尊荣或显赫地位；“荣耀”保留原文较高的语体及其可能涉及世俗显荣的含义。
- source_word: ἀνόμων
  choice: 不法之人
  rationale: ἀνόμων指无视或违背律法的人。“不法之人”保留其与“律法”的词义联系，不泛化为一般的“恶人”。
- source_word: βδελύσσομαι
  choice: 厌恶
  rationale: 该词表达强烈反感与憎恶；“厌恶”自然、庄重，并能在句中传达明显的排斥意味。
- source_word: κοίτην
  choice: 床榻
  rationale: κοίτη可指床、婚床，也可借指婚姻或性关系。“床榻”保留原文意象及委婉性，不把隐含意义直接释入正文。
- source_word: ἀπεριτμήτων
  choice: 未受割礼者
  rationale: 原文为复数形容词名词化用法，所指之人未明说性别；“未受割礼者”准确而不额外补入“男人”。
- source_word: παντὸς ἀλλοτρίου
  choice: 一切外族人
  rationale: ἀλλότριος可指外来的、属于别人的或外族之人；与“未受割礼者”并列时，以人群为所指最自然。“外族人”也较“外国人”更符合古代族群语境。
theological_decisions:
- issue: 是否把κοίτην明确译为婚床或性关系
  choice: 床榻
  alternative: 婚床；性关系
  rationale: 原文以“床”委婉指涉婚姻或性结合，但没有完全明说。正文保留意象，脚注说明可能含义，以保存原文的含蓄与张力。
- issue: 是否把ἀνόμων解释性地译为“恶人”
  choice: 不法之人
  alternative: 恶人
  rationale: 原词明确带有违背或没有律法的含义；译作“不法之人”比泛称“恶人”更贴近希腊语，也不引入额外的道德概括。
- issue: ἀλλοτρίου在此指外族之人还是泛指一切陌生或外来的事物
  choice: 外族人
  alternative: 外人；一切外来的事物
  rationale: 该词与复数的“未受割礼者”相连，并受κοίτην所表达的人际或婚姻关系制约，因此理解为外族之人最符合句法和语境。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“你也知道”顺应καὶ οἶδας的自然汉语表达；“并且”保留两个厌弃陈述的并列关系。正文避免将“床榻”的委婉含义过度明确化。
