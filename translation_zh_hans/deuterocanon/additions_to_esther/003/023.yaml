base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/023.yaml
  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: zh_hans
  text: 求你赐我合宜的话[a]，好让我在狮子面前[b]说出来；也求你使他的心转而憎恨那攻击我们的人，好使那人和与他同心的人都归于毁灭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合宜的话”也可译作“组织得当的话”或“恰当的言辞”。希腊语可强调话语得体、安排妥当，适合当时的场合。
    reason: lexical_alternative
  - marker: b
    text: 这里的“狮子”是以斯帖祷告中对王的比喻性称呼；原文保留了这一形象，没有直接说“王”。
    reason: cultural_note
  - marker: c
    text: “归于毁灭”也可译作“走到尽头”或“遭到毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς λόγον εὔρυθμον εἰς τὸ στόμα μου
  choice: 求你赐我合宜的话，使我……可以说出来
  rationale: δὸς 是祈求式命令语气；λόγον εὔρυθμον 指适合当下、组织得当的话语。中文采用自然表达，保留话语由上帝赐下的含义。
- source_word: ἐνώπιον τοῦ λέοντος
  choice: 在狮子面前
  rationale: 按原文保留“狮子”的比喻，不在正文中直接改译为“王”。
- source_word: μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος
  choice: 使他的心转而憎恨
  rationale: μετάθες 表示改变、转移内在倾向；“转而憎恨”清楚表达 εἰς 所指向的结果。
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: 那攻击我们的人
  rationale: 保留希腊文单数主动分词的指向及其动作含义，不笼统改为复数“仇敌”。
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: 以致那人……灭亡
  rationale: συντέλεια 可指终局、毁灭性的结局；上下文要求清楚表达敌对者的覆灭。“以致”呈现 εἰς 在此可能具有的结果意味。
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: 与他同心的人
  rationale: ὁμονοούντων 指与某人心意、目的相同者；此译保留原词的意象，避免压缩为较解释性的“同党”。
theological_decisions:
- issue: “狮子”是否应直接解释为王
  choice: 正文保留“狮子”
  alternative: 译作“王”
  rationale: 原文以“狮子”称呼以斯帖将要面对的王。保留比喻可维持祷告中面对强权与危险的文学张力，脚注说明所指。
- issue: 是否把 τοῦ πολεμοῦντος ἡμᾶς 泛化为多个仇敌
  choice: 译作单数“那攻击我们的人”
  alternative: 译作“我们的仇敌”或“攻击我们的人们”
  rationale: 希腊文是单数，可能特指主要敌对者；随后才提到与他同心的多人，因此正文维持单复数区别。
- issue: εἰς συντέλειαν 的目的或结果关系
  choice: 用“以致”表达导向的结果
  alternative: 译作“为要使……灭亡”
  rationale: εἰς 在这里可表达所导向的结局，而原文没有必要严格排除目的或结果的交叠；“以致”较少把祈求过度限定为单一逻辑类别。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”体现对上帝的祈求；分号划分赐言与转心两个请求。保留“狮子”“与他同心”等原文意象，同时通过自然汉语句法明确动作关系。
