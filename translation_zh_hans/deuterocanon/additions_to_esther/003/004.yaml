  text: And you are Lord of all[a], and there is no one who will oppose you, O Lord.
translation:
  language: zh_hans
  text: 你是万有的主，也没有谁会抵挡你[a]，主啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：没有谁会起来与你为敌。
    reason: ἀντιτάξεται既可概括为“抵挡”，也可较具体地表达为站出来与对方敌对。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 在祷告中是对上帝的尊称；译作“主”既表达权柄，也保留敬虔的直接称呼。
- source_word: πάντων
  choice: 万有
  rationale: 概括希腊文中性复数属格“所有的一切”，与“主”连用为“万有的主”，庄重而自然。
- source_word: οὐκ ἔστιν ὃς
  choice: 没有谁会
  rationale: 保留“没有一个……的人”这一普遍否定及随后将来时的表达，不把它改写成单纯的能力判断。
- source_word: ἀντιτάξεται
  choice: 会抵挡
  rationale: 该词表示站出来反对、抗拒；“抵挡”简洁地传达敌对行动，并与后接的“你”自然搭配。
- source_word: σοι τῷ κυρίῳ
  choice: 你，主啊
  rationale: τῷ κυρίῳ与σοι同为与格，可理解为同位说明；在祷告语境中用“主啊”呈现直接呼告，同时保留“你”这一代词。
theological_decisions:
- issue: 祷告中两次κύριος的译法
  choice: 主……主啊
  alternative: 主……你这位主
  rationale: 首处说明上帝是“万有的主”，末处则在与格同位结构中具有呼告作用。译作“主啊”保持重复、敬称和祷告语气，不加入额外的神学称号。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“万有”比“所有事物”更凝练，也适合敬拜语境；“主啊”自然呈现直接呼告。
