  text: because we glorified their gods[a]. You are righteous[b], Lord.
translation:
  language: zh_hans
  text: 因为我们把荣耀归给了他们的神明[a]。主啊，你是公义的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们尊崇了他们的神明。”
    reason: δοξάζω可强调给予尊荣；此译法比“把荣耀归给”更简洁，但意义基本相同。
  - marker: b
    text: 或译：“主啊，你是公正的。”
    reason: δίκαιος也可突出审判上的公平、公正。
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: 因为
  rationale: 该短语在这段认罪祷告中引出因由；译作“因为”自然地表达因果关系，也保留本节承接上文的句法特点。
- source_word: ἐδοξάσαμεν
  choice: 我们把荣耀归给了
  rationale: δοξάζω在此表示把荣耀、尊荣给予某对象。“把荣耀归给”既清楚表达其宾语关系，也符合庄重的祷告语体。
- source_word: τοὺς θεοὺς αὐτῶν
  choice: 他们的神明
  rationale: 保留希腊文的复数和所属关系；“神明”在现代汉语中自然，也能与独一的“主”形成对照。
- source_word: δίκαιος
  choice: 公义的
  rationale: δίκαιος既可指道德上的正直，也可含司法上的公正；“公义”适合向上帝所作的认信，同时以脚注保留“公正”的可能。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是κύριος的呼格，在祷告中是对上帝的直接称呼；“主啊”符合现代汉语的呼语形式。
theological_decisions:
- issue: 对上帝使用δίκαιος的译法
  choice: 公义的
  alternative: 公正的
  rationale: 上下文承认百姓犯罪，并确认上帝施行审判的正当性。“公义”兼顾道德与神学语域，而“公正”更突出司法意味，故列为脚注异译。
- issue: κύριος作为神圣称呼
  choice: 主
  alternative: 主人
  rationale: 在祷告语境中，该词是对以色列之上帝的称呼，不是一般社会关系中的“主人”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“因为”有意保留本节承接上文的片段性质；“神明”保留复数含义，并避免把异教诸神与对真神的专称混同。
