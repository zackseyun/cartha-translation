base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: zh_hans
  text: 你知道我的困境[a]：我厌恶我头上那骄傲的标志[b]，就是在我公开露面的日子所戴的[c]；我厌恶它，如同厌恶月经时用的破布[d]；在我清静的日子里，我不戴它[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困境”也可译作“迫切需要”或“不得已的处境”。
    reason: lexical_alternative
  - marker: b
    text: “骄傲的标志”大概指以斯帖王后身份的头上饰物或地位象征；希腊文没有说明它具体是什么。
    reason: cultural_note
  - marker: c
    text: “公开露面”直译为“在我显现的日子”，指她在人前或宫廷中出现的时候。
    reason: lexical_alternative
  - marker: d
    text: 希腊文直译为“月经的破布”，是刻意直露、表达强烈厌恶的说法。
    reason: lexical_alternative
  - marker: e
    text: “清静的日子”也可译作“休息的日子”或“私下生活的时候”，与公开露面相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: 困境
  rationale: 该词可指必要、需要、压力或困苦；在以斯帖的祷告中，指她受情势逼迫的艰难处境。“困境”自然地传达语境含义，同时不把它缩窄为单纯的情绪痛苦。
- source_word: βδελύσσομαι
  choice: 厌恶
  rationale: 原词表达强烈的反感与憎恶。“厌恶”在现代汉语中庄重自然，并可顺畅用于本节两次出现之处。
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: 那骄傲的标志
  rationale: σημεῖον是标志或记号，ὑπερηφανία在此带有负面的骄傲、高傲意味。译文保留概括性表达，不径自认定它是王冠。
- source_word: ἐν ἡμέραις ὀπτασίας μου
  choice: 我公开露面时
  rationale: ὀπτασία通常可指显现或所见景象，但本句与头上饰物及安静独处形成对照，最可能指以斯帖被人看见、公开出现的场合。
- source_word: ῥάκος καταμηνίων
  choice: 经期的破布
  rationale: ῥάκος是破布、碎布，καταμήνια明确指月经。此译保留原文刻意鲜明而令人反感的比喻，不以含糊的“污秽衣物”弱化。
- source_word: ἡσυχίας
  choice: 安静独处
  rationale: 该词可表示安静、休息或不参与公开活动的状态；这里与公开露面相对。“安静独处”既自然，也保留休息和私下生活两方面的可能含义。
theological_decisions:
- issue: 以斯帖所厌恶之物的具体性质
  choice: 正文称其为“骄傲的标志”，并以“饰物”说明它戴在头上，但不具体认定为王冠。
  alternative: 王冠、冠冕、头饰
  rationale: 希腊文没有直接说“王冠”，只说那标志位于她头上。如此处理既便于中文理解，也避免超出原文确定具体器物。
- issue: 经期比喻的直露程度
  choice: 保留“经期的破布”这一明确比喻。
  alternative: 污秽的布、肮脏的破布
  rationale: 原文明说月经，并借此表达强烈厌恶。保留这一意象，才能维持祷告中的情感力度，不以委婉措辞消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文以短句疏解希腊文较长的从属结构；保留“骄傲”和经期破布的尖锐意象，同时用脚注呈现ἀνάγκη、ὀπτασία与ἡσυχία的真实语义幅度。所有脚注标记均按[a]至[e]置于正文相关位置。
