base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/028.yaml
  text: And your servant has not rejoiced from the day of my change until now[a], except in you, Lord[b], God of Abraham.
translation:
  language: zh_hans
  text: 你的婢女[a]自我转变[b]那日起，直到如今，从未欢喜；唯独因你而欢喜。主啊，亚伯拉罕的上帝！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”所译的希腊词是阴性形式，既可译作“女仆”，也可译作“女奴”；这里是她在上帝面前谦卑的自称。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“逆转”或“境遇改变”。原文没有说明这次“转变”具体指什么。
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  choice: 婢女
  rationale: 这是“奴仆”的阴性形式，既表明说话者为女性，也保留她在上帝面前自谦、完全从属的语气；“婢女”比单用“仆人”更准确地反映原文形式。
- source_word: ηὐφράνθη
  choice: 欢喜
  rationale: 该动词表示喜悦、欢欣；“欢喜”自然简洁，不额外限定喜乐的表现方式。
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: 自我转变之日起
  rationale: μεταβολή可指改变、转变或逆转。译文保留“转变”的开放性，不擅自说明是身份、命运还是处境的变化。
- source_word: πλὴν ἐπὶ σοί
  choice: 除了因你而欢喜以外
  rationale: πλήν表示例外，ἐπί加与格在此可表示喜乐的根据或所系；此译法用自然汉语表达上帝是她唯一喜乐的缘由，同时避免加入更具体的解释。
- source_word: Κύριε
  choice: 主啊
  rationale: 呼格形式，采用现代中文祷告语体中的标准称呼。
- source_word: ὁ θεὸς Ἀβραάμ
  choice: 亚伯拉罕的上帝
  rationale: 保留原文的圣约性称号，并以自然的中文领属结构表达。
theological_decisions:
- issue: 祷告中δούλη的自称
  choice: 你的婢女
  alternative: 你的女仆；你的仆人
  rationale: “婢女”兼顾阴性形式与从属意味，也符合庄重的祷告语体；“仆人”较柔和，却会隐去原文明确的阴性形式和较强的依附色彩。
- issue: μεταβολή所指的变化
  choice: 我的转变
  alternative: 我的逆转；我的境遇改变
  rationale: 原文没有说明变化的具体性质，因此不将其限定为王后身份、命运逆转或处境改变，以保留其真实含混性。
- issue: ἐπὶ σοί所表达的喜乐关系
  choice: 因你而欢喜
  alternative: 在你里面欢喜；以你为乐
  rationale: 原短语可表达喜乐的根据或所系。“因你而欢喜”在现代汉语中自然，同时保留上帝是唯一例外和喜乐根源的含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“婢女”保留说话者的女性身份和自谦语气；句序略按汉语习惯调整，但保留“从转变之日起直到如今”“唯一的喜乐在于上帝”以及末尾呼告的结构和神学张力。
