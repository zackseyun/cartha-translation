  text: 他恳求主，追想主的一切作为，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: 恳求
  rationale: 表示迫切、诚恳的祈求；“恳求”保留其力度，也符合现代汉语祷告语境。
- source_word: Κυρίου
  choice: 主
  rationale: 在希腊文祷告语境中按通常圣经称谓译为“主”；汉语无需添加冠词。
- source_word: μνημονεύων
  choice: 记念
  rationale: 分词说明他恳求时伴随的行动或状态。“记念”既可指心中追想，也可包含在祷告中述说，保留原文的开放性。
- source_word: πάντα
  choice: 一切
  rationale: 表达完整、无遗漏的范围，与“事”搭配自然。
- source_word: τὰ ἔργα
  choice: 所行的事
  rationale: ἔργα在这里指主的作为；译作“所行的事”自然清楚，并避免“工作”在现代汉语中的日常职业含义。
- source_word: Κυρίου
  choice: 主
  rationale: 保留希腊文中“主”的重复，不以代词替换。
theological_decisions:
- issue: 祷告语境中 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华；主人
  rationale: 原文为κύριος，直接译作“主”既保留希腊文本的称谓，也不额外断定其背后的希伯来文形式；“主人”在此会削弱神圣称谓的语感。
- issue: μνημονεύων所指的是默想还是口头述说
  choice: 记念
  alternative: 回想；述说
  rationale: 希腊分词本身未明确限定为内在回忆或口头陈述，因此采用可涵盖两者的“记念”，不消除原文的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。“记念”保留圣经语感；句末逗号反映本节在原文中尚未完结，并与下文衔接。
