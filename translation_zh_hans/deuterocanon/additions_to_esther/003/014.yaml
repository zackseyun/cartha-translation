  text: 因为我正身陷险境[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“因为我的危险在我手中。”这句话按语境是说我正处于危险之中，性命受到威胁。
    reason: lexical_alternative
lexical_decisions:
- source_word: κίνδυνός μου
  choice: 我的性命
  rationale: κίνδυνος通常指“危险、危难”。但与ἐν χειρί μου合成此处的表达时，重点是说话者的性命正处于危险之中。正文按语义译为“我的性命”，脚注保留原文较直译的形式。
- source_word: ἐν χειρί μου
  choice: 就在我手中
  rationale: 原文直译为“在我手中”。保留“手中”的意象，并用“就在”自然地表达性命处于随时可能丧失的险境，而不把它误解为“在我掌控之中”。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在这里引出前文所述行动或陈述的理由；现代汉语用“因为”衔接自然、明确。
