base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: zh_hans
  text: 我自出生起，就在我祖家所属的支派中听说：主啊，你从万国中选取了以色列，又从他们所有的先祖中选取了我们的先祖，作为永远的产业；你也为他们成就了你所说的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你为他们做了凡你所说的事。”希腊文直译更接近这一表达。
    reason: 保留ἐποίησας……ὅσα ἐλάλησας的字面措辞及ὅσα的总括意义，并说明正文“成就”是较自然的语境译法。
lexical_decisions:
- source_word: ἐγὼ ἤκουον
  choice: 我……听说
  rationale: 未完成过去时在回忆自幼承受的传统这一语境中，表示过去持续领受并知晓的状态；“听说”比“听见”更符合口传传统的含义。
- source_word: ἐκ γενετῆς μου
  choice: 自出生以来
  rationale: γενετή指人的出生或起源；此译自然保留从出生之时开始的时间意义。
- source_word: ἐν φυλῇ πατριάς μου
  choice: 在我祖家的支派中
  rationale: φυλή指支派，πατριά指父系家族、宗族或祖家；译文保留两个亲族层级，同时避免古奥表达。
- source_word: σύ, Κύριε
  choice: 主啊，你
  rationale: 保留Κύριε的呼格语气；现代汉语祷告中以“主啊”自然表达直接呼求。
- source_word: ἔλαβες
  choice: 选取了
  rationale: λαμβάνω本义为拿取、取来；在ἐκ“从……中”的结构里具有从众多对象中取出的意味。“选取”既体现语境，也不把它强化为后来的教义术语。
- source_word: ἐκ πάντων τῶν ἐθνῶν
  choice: 从万国中
  rationale: ἐκ表示从一个较大的集合中取出；ἔθνη在此译为“万国”，不预先解释为“外邦人”。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 我们的祖宗
  rationale: πατέρες在民族历史语境中指先祖；“祖宗”保留群体祖先及男性先辈的传统色彩，比现代汉语中的直译“父亲们”准确。
- source_word: ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: 从他们所有的先祖中
  rationale: πρόγονοι指前代、先祖；“他们”依照希腊语句法回指“我们的祖宗”，不擅自改换所指。
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: 作为永远的产业
  rationale: κληρονομία可指产业、继承所得或所拥有之物；“永远的产业”保留圣约语域及持续不变的意味。
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: 你也为他们成就了你所说的一切
  rationale: 希腊语直译为“你为他们做了你所说的一切”。正文用“成就”表达所说之事得到实现，符合现代汉语习惯；脚注保留更贴近字面的译法。
theological_decisions:
- issue: εἰς κληρονομίαν αἰώνιον中的圣约性语言
  choice: 作为永远的产业
  alternative: 作为永恒的所有物；作为永久的基业
  rationale: 此短语唤起拣选和圣约的语境，但原句并未进一步界定“产业”的系统神学含义。译文保留这种圣约色彩，不对以色列或祖宗作为产业的关系作超出原文的解释。
- issue: ἔλαβες在拣选语境中的力度
  choice: 选取了
  alternative: 取了；拣选了
  rationale: “选取”表达从万国及众先祖中取出的句法意义，同时避免让“拣选”这一较固定的神学术语替原文解决其可保留的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持祷告中的呼告语气。以“祖家—支派”“万国”“产业”等词保留古代族群和圣约语境；避免文言化，也不引入特定宗派术语。脚注标记置于其实际解释的末句之后。
