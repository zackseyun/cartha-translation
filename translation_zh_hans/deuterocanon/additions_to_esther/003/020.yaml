base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/020.yaml
  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
translation:
  language: zh_hans
  text: 并使列国开口，颂扬虚妄之物[a]，又使一个血肉之躯的王永远受人惊叹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“称颂虚妄之物的卓越之处”，又或“赞美虚空之物”。希腊文较直译为“向着虚妄之物的卓越之处”。
    reason: 保留ἀρεταί与ματαίων组合在“卓越、称颂”和“虚妄、无价值之物”之间的词义张力。
  - marker: b
    text: “血肉之躯的王”也可译为“必死的王”或“仅仅是人的王”。希腊文直译为“属血肉的王”。
    reason: 说明σάρκινον的具体原文意象及可采用的释义译法。
lexical_decisions:
- source_word: ἀνοῖξαι στόμα
  choice: 使……开口
  rationale: 保留希腊文“开口”的具体意象，同时以“使”表达不定式在祷告语境中的目的或结果意味。
- source_word: ἐθνῶν
  choice: 列国
  rationale: 该词在七十士译本中常指以色列以外的各国；“列国”既简洁庄重，也避免把含义限定为宗教术语“外邦人”。
- source_word: ἀρετὰς ματαίων
  choice: 颂扬虚妄之物
  rationale: ἀρεταί可指美德、卓越之处，也可在此表达称颂；ματαίων是实词化的复数形容词，直指虚空、无价值之物。正文采用自然中文表达其称颂行为，同时以脚注保留原文较生硬且多义的结构。
- source_word: θαυμασθῆναι
  choice: 受人惊叹
  rationale: 保留“令人惊异、受人赞叹”的基本词义，不加强为“受敬拜”，以免超出词汇本身。
- source_word: βασιλέα σάρκινον
  choice: 一个血肉之躯的王
  rationale: σάρκινος意为由血肉构成或属血肉的；此译保留具体意象及其与神的隐含对照，又比直译“血肉的王”更符合现代汉语。
- source_word: εἰς αἰῶνα
  choice: 永远
  rationale: 这是七十士译本中常见的持久时间表达，此处自然译为“永远”。
theological_decisions:
- issue: ματαίων是否应明确译为“偶像”
  choice: 虚妄之物
  alternative: 虚妄的偶像
  rationale: 上下文确有反偶像崇拜色彩，但希腊文本身只说“虚妄、无价值之物”，没有明用“偶像”一词。正文保留原有范围，不把语境推论写入经文。
- issue: σάρκινον是否应释义为“必死的”或“仅仅是人的”
  choice: 血肉之躯的
  alternative: 必死的人间君王
  rationale: 保留原文具体的“血肉”措辞，让人王与神之间的神学张力由原有意象呈现，而不把隐含意义完全解释出来。
- issue: θαυμασθῆναι是否具有敬拜含义
  choice: 受人惊叹
  alternative: 受人敬拜
  rationale: 语境可能暗示近乎偶像化的尊崇，但动词本身主要表示惊叹或赞赏；不用“敬拜”，以免强化原文未明确表达的礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“列国”“开口”“血肉之躯”保留原文意象；句中以“并使……又使……”维持两个并列不定式的结构。
