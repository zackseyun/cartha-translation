base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/027.yaml
  text: And your servant did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: zh_hans
  text: 你的女奴[a]没有吃哈曼席上的食物；我也没有把王的宴席当作荣耀，也没有喝过浇奠用的酒[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的婢女”。希腊文用阴性词“女奴”，比一般的“仆人”更强地表达从属身份。
    reason: lexical_alternative
  - marker: b
    text: 指与浇奠或饮祭有关的酒，并非仅指普通的酒。
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  choice: 你的女奴
  rationale: δούλη是阴性名词，表示处于从属地位的女奴。译作“女奴”既保留阴性，也不把原文较强的隶属含义淡化为一般的“仆人”。
- source_word: ἔφαγεν … τράπεζαν Ἁμάν
  choice: 没有吃过哈曼席上的食物
  rationale: 希腊文直译近于“没有吃哈曼的桌席”；汉语补出“席上的食物”，自然表达在某人席上进食的含义，同时保留具体的筵席场景。
- source_word: ἐδόξασα
  choice: 尊崇
  rationale: δοξάζω在这里以王的宴席为宾语，含尊重、看重并给予荣耀之意。“尊崇”保留较强语气，又避免把该词限定为专用于敬拜的“荣耀”。
- source_word: συμπόσιον βασιλέως
  choice: 王的宴席
  rationale: συμπόσιον指设有饮酒的宴会。“宴席”符合现代庄重汉语，也不把它缩减为单纯的酒会。
- source_word: οἶνον σπονδῶν
  choice: 奠祭用的酒
  rationale: σπονδαί指浇奠或献作饮祭的酒。“奠祭用的酒”明确保留祭仪关联，避免误解为普通酒。
theological_decisions:
- issue: 以δούλη自称所表达的从属程度
  choice: 你的女奴
  alternative: 你的婢女／你的仆人
  rationale: 原文使用带有较强隶属意味的阴性δούλη。正文保留这种自我降卑，不以较柔和的“仆人”消解其力度；脚注说明较自然的替代译法。
- issue: οἶνον σπονδῶν的祭仪色彩
  choice: 奠祭用的酒
  alternative: 奠酒／献酒
  rationale: 原文所说并非仅仅普通饮酒，而是与浇奠、饮祭相关的酒。译文保留这一宗教文化含义，但不进一步断定具体祭仪对象或场合。
- issue: 原文人称从第三人称自称转为第一人称
  choice: 保留“你的女奴……我也……”的转换
  alternative: 全句统一译成第一人称
  rationale: 希腊文先用ἡ δούλη σου，随后转用第一人称动词ἐδόξασα、ἔπιον。保留这一不整齐的人称变化，呈现祷告中的自称方式，不替原文作平滑化处理。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“女奴”有意保留原文较强的从属含义；“席上的食物”使希腊语“吃某人的桌席”在汉语中自然。“尊崇王的宴席”略带庄重色彩，以保留δοξάζω的强度。保留分号，显示本节仍与后文相连。
