base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/022.yaml
  text: Remember[a], Lord; make yourself known in the time of our affliction, and encourage me[b], O King of the gods and ruler over every authority.
translation:
  language: zh_hans
  text: 主啊，求你垂念；在我们遭受患难的时候显明自己，也赐我勇气。众神之王、统管一切权柄者啊！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权柄”也可译作“掌权者”或“统治势力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: 求你顾念我们
  rationale: 该词为祷告中的命令式呼求，基本义是“记念、顾念”。汉语若仅译“记得”容易被理解为单纯回忆；“顾念我们”既保留圣经祷告用语，也自然承接下文“我们的患难”。原文未明说宾语，所补“我们”由紧接的“我们的患难”得出。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格，在向上帝祷告的语境中以“主啊”最自然、庄重。
- source_word: γνώρισθητι
  choice: 显明自己
  rationale: 该词为被动形式的命令式，在祷告中可表达“使自己被认识、显现自己”。“显明自己”保留其自我彰显的意味，又不把所求具体限定为某一种介入方式。
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: 在我们遭受患难的时候
  rationale: καιρός表示时候或时机，θλῖψις表示患难、困苦。“我们遭受患难的时候”符合现代汉语，同时保留时间短语和群体性的“我们”。
- source_word: ἐμὲ θάρσυνον
  choice: 也赐我勇气
  rationale: θαρσύνω意为使人刚强、鼓起勇气。“赐我勇气”在向上帝祷告时自然准确，比“鼓励我”更能体现面对危难而得胆量的语义。
- source_word: Βασιλεῦ τῶν θεῶν
  choice: 你是众神之王
  rationale: 直译保留“众神之王”这一原文大胆而明确的尊号，不将“众神”改写为其他概念；在句法上用“你是”使连续呼语在现代汉语中自然。
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: 统管一切权柄
  rationale: ἀρχή可指权柄、统治或掌权者，ἐπικρατέω表示掌控、支配。译作“统管一切权柄”保留其抽象而全面的范围；脚注提示“掌权者”这一真实可能。
theological_decisions:
- issue: τῶν θεῶν这一上帝尊号的表达
  choice: 众神之王
  alternative: 超乎众神之上的王；一切神明之王
  rationale: 原文明确使用“众神之王”，应保留其措辞所表达的至高统治，不因潜在的神学张力而弱化或改写。此表述本身强调主凌驾于一切被称为神的存在之上，并不要求译文进一步裁定这些存在的性质。
- issue: γνώρισθητι的语态与祷告含义
  choice: 显明自己
  alternative: 求你被人认识；求你显现
  rationale: 希腊文形式上是被动命令式，但在祷告语境中可能带有让上帝彰显自己的意义。“显明自己”既符合汉语表达，也保留自我彰显的核心，不具体化为某种神迹或审判。
- issue: ἀρχή指抽象权柄还是掌权者
  choice: 权柄
  alternative: 掌权者；统治势力
  rationale: 该词在此可指权柄本身，也可指拥有权柄者。正文采用自然且涵盖面广的“权柄”，以脚注保留“掌权者”的可能，避免过度裁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语祷告体。“主啊，求你……”保持直接呼求；分为两句以清楚呈现祈求与尊号。保留“众神之王”的原文张力，不作神学淡化。
