  text: And Esther the queen fled to the Lord[a], seized by a struggle of death[b],
translation:
  language: zh_hans
  text: 王后以斯帖投奔主[a]，正陷在死亡的苦斗中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃向主寻求庇护”。希腊语动词可指逃向某人以寻求庇护。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正被一场致命的苦斗所困”，或“陷在临死的煎熬中”。希腊语表达兼有剧烈挣扎和死亡迫近之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέφυγεν
  choice: 逃到
  rationale: 该动词表示逃向某人以寻求庇护。“逃到”保留原文鲜明的逃奔意象；寻求庇护的含义在脚注中说明。
- source_word: κύριον
  choice: 主
  rationale: 此处指以斯帖所投靠的神。希腊文用κύριος而未明确呈现神名，因此译作“主”，不译作带特殊排印的“耶和华”。
- source_word: ἐν ἀγῶνι
  choice: 在……苦斗中／被……苦斗攫住
  rationale: ἀγών可指竞赛、争战或剧烈挣扎；在死亡威胁的语境中，“苦斗”既保留争斗意象，也传达强烈痛苦。中文句式与后面的被动分词合并处理为“被……苦斗攫住”。
- source_word: θανάτου
  choice: 死亡的
  rationale: 保留属格表达的紧凑和一定歧义，不直接限定为“致命的”或“临死的”；其具体关系可包括因死亡威胁而有的苦斗或面临死亡的苦斗。
- source_word: κατειλημμένη
  choice: 正被……攫住
  rationale: 被动分词表示被某种处境追上、抓住或控制。“攫住”保留原文强烈而形象的被动意味，“正”体现分词所描写的当时状态。
theological_decisions:
- issue: κύριον所指的神及其译法
  choice: 主
  alternative: 耶和华
  rationale: 祷告语境表明所指是以色列的神，但现存希腊文本此处只有κύριον，没有直接呈现神名。译作“主”既忠于希腊文，也避免把未明说的神名加入正文。
- issue: ἀγῶνι θανάτου的关系
  choice: 死亡的苦斗
  alternative: 致命的苦斗／临死的煎熬
  rationale: 原文属格可表达与死亡相连的苦斗，却未明确规定死亡是原因、结果还是迫近的威胁。正文保留这种张力，脚注列出较解释性的自然译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“逃到”与“攫住”保留希腊文的强烈动作感；“死亡的苦斗”略带凝练的文学色彩，用以保存原文属格结构的含混和神学张力。所有脚注标记均已置入正文。
