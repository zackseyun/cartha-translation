base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: zh_hans
  text: 主啊，不要把你的权杖交给那些并不存在的[a]；不要让他们在我们败亡之时讥笑。反要使他们的计谋归到他们自己身上，并使那最先攻击我们的人成为鉴戒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些算不得什么的”或“那些虚无的人”。希腊文直译为“那些并不存在的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: 不要……交给
  rationale: 保留 παραδίδωμι“交出、移交”的基本含义；现代汉语自然清楚，也表达将权柄让渡他人的意味。
- source_word: τὸ σκῆπρόν σου
  choice: 你的权杖
  rationale: σκῆπτρον 指象征君王权威的权杖；保留原文具体而具有神学意味的意象，不抽象化为“权力”或“统治权”。
- source_word: τοῖς μὴ οὖσιν
  choice: 那些并不存在的
  rationale: 原文直译为“那些不是/不存在的”。这一突兀表达可能含有贬斥敌人为虚无之意；正文保留其歧义和神学张力，并以脚注列出较具解释性的译法。
- source_word: μὴ καταγελασάτωσαν
  choice: 不要让他们……讥笑
  rationale: καταγελάω 表示嘲笑、讥讽；“讥笑”既自然，也保留敌人在群体败亡时幸灾乐祸并加以羞辱的意味。
- source_word: ἐν τῇ πτώσει ἡμῶν
  choice: 因我们的败亡
  rationale: πτῶσις 本义为“跌倒、倒下”，在群体危亡语境中译作“败亡”，较准确地传达覆灭或惨败。介词短语可表达他们以此为讥笑的缘由或处境。
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: 反使他们的计谋临到他们自己
  rationale: στρέφω 表示转回、反转，βουλή 在此为敌对的谋划；该译法保留“使其谋略反噬自身”的结构，并避免额外说明具体实现方式。
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: 那带头攻击我们的人
  rationale: ἀρξάμενον 可指开始者或带头者，ἐφʼ ἡμᾶς 在此具有敌对意味。“带头攻击我们”自然补足汉语所需语意，同时未限定攻击的具体形式。
- source_word: παραδειγμάτισον
  choice: 使……当众受辱
  rationale: παραδειγματίζω 可指公开暴露、羞辱，或使人成为鉴戒。“当众受辱”保留公开惩处的核心意义，且比“杀一儆百”等说法更少限定惩罚方式。
theological_decisions:
- issue: τοῖς μὴ οὖσιν 所指为何
  choice: 那些并不存在的
  alternative: 那些算不得什么的／那些虚无的人
  rationale: 希腊文表述异常鲜明，可能是在神学或修辞上否定敌人的实在性、地位或能力。正文采用较贴近字面的译法，不把它明确解释为偶像、异教徒或无足轻重者，从而保存原文张力。
- issue: παραδειγμάτισον 的审判性质
  choice: 使……当众受辱
  alternative: 拿……示众／惩罚……以儆效尤
  rationale: 原词包含公开暴露或使人成为鉴戒的意味，但没有明确规定惩罚的形式。译文体现公开羞辱，避免擅自加入处死或某种具体刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“权杖”保留君王权威的具体意象；句首称呼“主啊”符合自然汉语呼告。“愿你”承接祈求语气，同时避免连续使用生硬的命令句。脚注标记[a]已置于对应短语之后。
