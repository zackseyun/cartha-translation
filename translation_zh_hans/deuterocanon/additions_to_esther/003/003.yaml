translation:
  language: zh_hans
  text: 因为你造了天地和天底下一切令人惊叹之物[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天底下一切奇妙之物”或“天底下一切受人惊叹之物”。希腊语分词可指奇妙的、受到人惊叹的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在祷告语境中引出前文所述之事的理由，取因果义最自然。
- source_word: ἐποίησας
  choice: 你造了
  rationale: ποιέω在以“天地”为宾语时指制造、创造；“造了”既贴近原词，也不额外加入技术性的神学措辞。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: 这是涵盖整个受造秩序的惯用并称；现代汉语以“天地”表达最简洁自然。
- source_word: πᾶν θαυμαζόμενον
  choice: 所有令人惊叹之物
  rationale: 中性单数πᾶν配合分词可作集合性表达；“所有……之物”兼顾整体范围与庄重语体。θαυμαζόμενον字面指受到惊叹、被视为奇妙的事物。
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: 天下
  rationale: 该省略结构指“在天以下的领域中”；“天下”是自然而凝练的汉语对应，并保留其空间与普世范围。
theological_decisions:
- issue: 创造语言的范围
  choice: 译为上帝造了天地及天下所有令人惊叹之物，表达广泛的受造界范围。
  alternative: 将ἐποίησας译为“创造了”，或将θαυμαζόμενον概括为“万物”。
  rationale: 原文明确列出天地，又提到天下一切受人惊叹之物；正文保留这一具体表述，不把它改写成更抽象的教义术语“万物”，也不赋予ποιέω超出语境所需的技术含义。
- issue: θαυμαζόμενον的语义张力
  choice: “令人惊叹之物”
  alternative: “奇妙之物”或“受人惊叹之物”
  rationale: 希腊语被动分词既可着重事物受到惊叹，也可自然引申为事物本身奇妙；正文采用符合现代汉语习惯的使动表达，脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“造了天地”为简洁的圣经汉语表达；“令人惊叹之物”避免生硬直译，同时以脚注保留希腊语被动分词的语义幅度。保留句末逗号，以反映本节在连续祷告句中的从属关系。
