base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: zh_hans
  text: 你知道万事；主啊，你知道，我这样做——不向那傲慢的哈曼俯伏下拜[a]——并不是出于狂妄、自高或贪图名望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不向那傲慢的哈曼躬身下拜。”
    reason: προσκυνεῖν可表达俯伏、跪拜或躬身致敬；脚注保留另一种自然的动作性译法，而不把它限定为宗教敬拜。
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: 你知道万事
  rationale: 保留第二人称强调和“万事”的完整范围，也符合祷告的庄重语气。
- source_word: σὺ οἶδας
  choice: 你知道
  rationale: 原文连续使用两个表示“知道”的动词以加强语气；译文不将这层重复合并或删去。
- source_word: Κύριε
  choice: 主啊
  rationale: 作为对上帝的直接称呼，“主啊”自然、庄重，并体现呼格语气。
- source_word: οὐκ ἐν ὕβρει
  choice: 并不是出于狂妄
  rationale: ὕβρις在此指放肆、凌人而带有冒犯性的狂妄态度；“狂妄”保留其道德贬义。
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: 也不是出于自高
  rationale: “自高”突出抬高自己的心态，并与前面的“狂妄”有所区别。并列结构在整句中压缩为“狂妄、自高或……”，符合现代汉语表达。
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: 也不是出于贪图名望
  rationale: φιλοδοξία可指好名、追求荣誉或个人野心；“贪图名望”既清楚表达自利动机，也不把词义收窄为政治野心。
- source_word: ἐποίησα τοῦτο
  choice: 我这样做
  rationale: 保留“做这事”的概括性，让随后的不定式短语具体说明所指行为。
- source_word: τὸ μὴ προσκυνεῖν
  choice: 不……俯伏下拜
  rationale: 该冠词不定式说明“这样做”的具体内容。“俯伏下拜”传达身体伏下致敬的动作，同时不擅自断定这是宗教敬拜。
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: 那傲慢的哈曼
  rationale: 保留原文对哈曼的负面定性；“傲慢”在现代汉语中自然，也与描述末底改自身动机的“自高”相区别。
theological_decisions:
- issue: 末底改不向哈曼下拜的动机
  choice: 只说明这一行为并非出于狂妄、自高或贪图名望，不补明其正面动机。
  alternative: 直接解释为纯粹出于宗教信仰，或主要出于政治及个人原因。
  rationale: 本节希腊文只否定三种不当动机，没有在此明确陈述正面理由；译文保留这种未决状态，不借上下文或特定神学立场加以补足。
- issue: προσκυνεῖν所指行为的性质
  choice: 译作“俯伏下拜”，描述外在动作而不直接定性为敬拜神明。
  alternative: 译作“敬拜”，将行为明确解释为宗教崇拜。
  rationale: προσκυνέω可用于敬拜，也可用于向人俯伏致敬；本处宾语是哈曼，因此采用不预断其宗教性质的动作性表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留“你知道……你知道”的原文重复；用破折号标明“不向……下拜”是对“这样做”的解释。三个被否定的动机以并列短语呈现，简洁且保持彼此区别。
