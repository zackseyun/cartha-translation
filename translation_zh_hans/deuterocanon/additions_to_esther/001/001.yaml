  yaml_path: translation/deuterocanon/additions_to_esther/001/001.yaml
  text: In the second year of the reign of Artaxerxes the great king[a], on the first day of Nisan, Mordecai son of Jair, son of Shimei, son of Kish, of the tribe of Benjamin, saw a dream[b],
translation:
  language: zh_hans
  text: 亚达薛西大王在位第二年，尼散月[a]初一，便雅悯支派的人末底改——睚珥的儿子、示每的孙子、基士的曾孙——做了一个梦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“尼萨”；这里采用这个犹太月份通行的中文名称“尼散”。
    reason: cultural_note
  - marker: b
    text: 希腊文直译为“看见了一个梦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους δευτέρου βασιλεύοντος
  choice: 在位第二年
  rationale: 这是纪年的属格独立结构；译作“在位第二年”自然简洁，并保留按君王统治年数纪年的含义。
- source_word: Ἀρταξέρξου τοῦ μεγάλου βασιλέως
  choice: 亚达薛西大王
  rationale: Ἀρταξέρξης采用现代中文圣经传统中通行的译名“亚达薛西”；“大王”保留波斯语境中的王室尊号，同时符合汉语表达。
- source_word: τῇ μιᾷ τοῦ Νεισὰ
  choice: 尼散月初一
  rationale: 希腊文直指该月第一日；“初一”是现代汉语自然的月日表达。“尼散”采用该犹太月份的中文通行名称。
- source_word: ἐνύπνιον εἶδεν
  choice: 做了一个梦
  rationale: 希腊文直译为“看见一个梦”，但汉语通常说“做梦”。此处没有足够依据把 ἐνύπνιον 扩译为“异象”，故保持为“梦”。
- source_word: Μαρδοχαῖος ὁ τοῦ Ἰαείρου, τοῦ Σεμεείου τοῦ Κεισαίου
  choice: 末底改——睚珥的儿子、示每的孙子、基士的后裔
  rationale: 连续属格表达家系。按中文习惯区分儿子、孙子与较远祖先，既清楚呈现谱系层级，也避免把末底改误说成三人的直接儿子。
- source_word: ἐκ φυλῆς Βενιαμείν
  choice: 便雅悯支派的人
  rationale: 自然表达其支派归属，并将该说明与末底改衔接。
