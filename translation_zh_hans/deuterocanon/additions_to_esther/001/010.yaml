  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
translation:
  language: zh_hans
  text: 光明和太阳升起了；卑微的人[a]被高举，并吞吃了显贵的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谦卑的人”。希腊词既可指谦卑的品性，也可指低微的身份；正文着重保留地位逆转的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“有声望的人”或“受尊崇的人”。希腊词指享有尊荣或名望的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: 光明
  rationale: 保留希腊文开头凝练而富有象征意味的意象；不收窄为仅指时辰的“天光”。
- source_word: ὁ ἥλιος
  choice: 太阳
  rationale: 按该名词短语的通常含义直译。
- source_word: ἀνέτειλεν
  choice: 升起了
  rationale: 此动词常用于太阳升起；中文以一个谓语承接“光明和太阳”，尽量保留原文紧凑而略显奇特的意象结构。
- source_word: οἱ ταπεινοὶ
  choice: 卑微的人
  rationale: ταπεινός既可指谦卑的品性，也可指低下的社会地位；正文选“卑微的人”，较能保留本句地位逆转的意味而不限定为内在美德。
- source_word: ὑψώθησαν
  choice: 被高举
  rationale: 保留希腊文被动形式及由低至高的鲜明对照；“高举”也比单纯的“受尊崇”更能传达空间性意象。
- source_word: κατέφαγον
  choice: 吞吃了
  rationale: 该强化动词表示吃尽、吞噬；“吞吃”保留胜利场景中强烈而生动的比喻。
- source_word: τοὺς ἐνδόξους
  choice: 尊荣的人
  rationale: ἔνδοξος指享有荣耀、声望或尊荣的人；“尊荣的人”兼顾字面荣誉含义，并与“卑微的人”形成社会地位上的对照。
theological_decisions:
- issue: 是否把高度浓缩的意象解释为单纯的拯救与胜利陈述
  choice: 直接保留“光明和太阳升起”“卑微的人被高举并吞吃尊荣的人”等意象
  alternative: 意译为卑微者得拯救并战胜权贵
  rationale: 希腊文本本身采用象征性且充满张力的逆转语言，没有解释各意象的具体所指；译文不应替原文消解这种开放性。
translation_notes:
  register: 采用现代、庄重而凝练的书面语。分号呈现前后两组意象的推进关系；保留原文强烈的“吞吃”措辞，不将其弱化为抽象的“战胜”。
