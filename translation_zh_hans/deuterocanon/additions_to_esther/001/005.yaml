  text: And behold[a], two great dragons came forward, both ready to fight; and a great sound came from them[b],
translation:
  language: zh_hans
  text: 看哪，两条巨大的龙都上前来，准备搏斗[a]；它们发出了一阵巨响[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搏斗”也可译作“摔跤”或“近身角力”；希腊文动词可特指摔跤或近身争斗。
    reason: lexical_alternative
  - marker: b
    text: “巨响”也可译作“洪大的声音”或“大声的呼喊”；希腊文可指声音、呼声或喊声，并未说明这是清晰可辨的话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留异象叙事中引人注目、使画面骤然呈现的语气，同时符合庄重的现代汉语。
- source_word: δύο δράκοντες μεγάλοι
  choice: 两个巨大的龙
  rationale: “龙”直接保留 δράκων 的异象性和象征性，不提前解释其所指；“巨大”在现代汉语中自然表达体量与震撼感。
- source_word: ἕτοιμοι προῆλθον ἀμφότεροι
  choice: 一同上前，准备
  rationale: 将 ἀμφότεροι 表达为“一同”，说明两者都进入对峙；“上前”自然传达 προῆλθον 朝向冲突而出的动作。
- source_word: παλαίειν
  choice: 搏斗
  rationale: 该词可专指摔跤，也可指近身争斗；“搏斗”既保留近身相斗的色彩，又不把异象限定为竞技摔跤。
- source_word: φωνὴ μεγάλη
  choice: 巨大的声响
  rationale: φωνή 可指声音、呼声或喊声；此处没有说明是可理解的话语，因此用“声响”避免过度诠释，同时以“巨大”对应 μεγάλη。
- source_word: αὐτῶν
  choice: 它们发出了
  rationale: 以自然汉语将所属或来源关系表达为声音由两条龙发出，不改变希腊文的指向。
theological_decisions:
- issue: 末底改异象中两条龙的性质
  choice: 正文直接译作“龙”，不解释其象征对象
  alternative: 在译文中直接认定为特定人物、民族或国度
  rationale: 本节只呈现尚未解释的异象；翻译应保留象征及其张力，不能把后文或某种解释预先写进正文。
- issue: φωνή 是否表示有意义的言语
  choice: 译作“声响”
  alternative: 译作“声音”“呼喊”或暗示清晰言语
  rationale: 原词语义范围较宽，本句未明确表明是言语；“声响”保留这种不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留异象叙事的突现感；“搏斗”兼顾 παλαίειν 的近身争斗意味与上下文的自然表达。脚注标记置于相关分句之后。
