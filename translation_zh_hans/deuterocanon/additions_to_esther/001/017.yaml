  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: zh_hans
  text: 哈米大他之子哈曼，这布该人[a]，在王面前颇受尊荣；他因王的两个太监一事，一直图谋加害末底改和他的族人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“布该人”。较为人熟知的传统称哈曼为“亚甲族人”，但本希腊文本作“布该人”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: 哈米大他的儿子哈曼
  rationale: 属格Ἁμαδάθου在此自然表示父子关系；采用现代汉语清楚表达，并按通行圣经译名音译人名。
- source_word: Βουγαῖος
  choice: 布该人
  rationale: 这是含义不明的族属或家族称号，依希腊文本音译，不以其他传统中的“亚甲族人”替换。
- source_word: ἔνδοξος ἐνώπιον τοῦ βασιλέως
  choice: 在王面前地位尊贵
  rationale: ἔνδοξος在宫廷语境中指受尊崇、身居显位；此译既保留“在王面前”的原文表达，也避免将其理解为内在荣耀。
- source_word: ἐζήτει κακοποιῆσαι
  choice: 便一心谋害
  rationale: 未完成时ἐζήτει表达持续的企图；“一心谋害”以自然汉语传达持续恶意，而κακοποιῆσαι在此包括有意加害。
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: 末底改和末底改的族人
  rationale: λαός在此指末底改所属的民族群体；重复姓名可避免“他的族人”被误解为指哈曼。
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: 因王的那两个太监
  rationale: ὑπέρ在上下文中表示缘由，指哈曼的敌意与那两个王宫太监一事有关；εὐνούχων按宫廷语境译为“太监”。
theological_decisions:
- issue: 如何处理含义不明的称号Βουγαῖος
  choice: 按本希腊见证音译为“布该人”
  alternative: 亚甲族人
  rationale: 所指定的希腊底本明确作Βουγαῖος。译文应忠实保留该读法，不以较熟悉的另一文本传统加以协调；异读信息置于脚注。
- issue: ὑπέρ所表达的关系
  choice: 译为因果性的“因”
  alternative: 为着／关于
  rationale: 此处最自然地说明哈曼谋害末底改及其族人的缘由，但原文未进一步交代哈曼与两名太监之间的具体关系，因此译文不作补充解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“地位尊贵”体现宫廷身份，“一心谋害”传达未完成时所含的持续企图。脚注标记置于整节末尾，所注对象为正文中的“布该人”。
