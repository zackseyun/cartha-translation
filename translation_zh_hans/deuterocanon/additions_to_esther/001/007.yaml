  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: zh_hans
  text: 看哪，黑暗、幽冥之日；地上有患难与困厄、苦难与大动乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”或译“那地”；希腊文 γῆ 既可泛指大地，也可指某一特定地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留突然而庄重的提示语气，符合异象式、诗性的宣告。
- source_word: ἡμέρα σκότους καὶ γνόφου
  choice: 黑暗、幽冥之日
  rationale: 以“黑暗”对应 σκότος，以“幽冥”表现 γνόφος 的浓暗阴沉，并保留两个近义意象的并列。
- source_word: θλίψις καὶ στενοχωρία
  choice: 患难与困厄
  rationale: 保留受压迫、陷入窘迫的成对表达，同时采用现代读者易懂且庄重的措辞。
- source_word: κάκωσις
  choice: 苦难
  rationale: 此处列举灾祸而未明确施害者，故采用不强行指定外在压迫者的概括性译法。
- source_word: τάραχος μέγας
  choice: 大动乱
  rationale: 兼顾 τάραχος 所含的扰乱、混乱与社会震荡之意，并直接表达 μέγας。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上
  rationale: “地上”自然保留 γῆ 可指全地或某一地域的弹性，不在正文中强行限定范围。
theological_decisions:
- issue: γῆ 所指灾难范围
  choice: 地上
  alternative: 那地
  rationale: 希腊文既可指广义的“大地”，也可指特定的“土地/地域”；“地上”贴合宏阔语气，同时以脚注保留较窄理解。
translation_notes:
  register: 采用现代、庄重而略带诗性的书面语；以分号呈现先宣告黑暗之日、后列举地上灾难的结构。“幽冥”在此指幽暗阴沉，并非特指死者所在之处。
