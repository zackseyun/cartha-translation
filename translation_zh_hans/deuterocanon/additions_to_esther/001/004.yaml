  yaml_path: translation/deuterocanon/additions_to_esther/001/004.yaml
  text: 'And this was his dream: behold[a], voices and tumult, thunder and earthquake, upheaval upon the earth.'
translation:
  language: zh_hans
  text: 这就是他的梦：看哪，有声音和喧嚷，有雷鸣和地震，大地一片动荡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”或“呼声”；“喧嚷”也可译作“喧闹”或“骚动”；“大地”也可译作“那地”。
    reason: 保留φωνή、θόρυβος及γῆ在此处的词义范围，不把梦境限定为人声、纯粹噪声或全球性的事件。
lexical_decisions:
- source_word: ἐνύπνιον
  choice: 梦
  rationale: 这是该词通常且直接的含义；不增译为“梦中异象”，以免过度解释。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留希腊语感叹词带来的鲜明、突现效果，也符合庄重的梦境叙述语体。
- source_word: φωναὶ
  choice: 声音
  rationale: φωνή可指人声、呼声或一般声响；“声音”在中文中较为宽泛，避免限定为可辨识的话语。
- source_word: θόρυβος
  choice: 喧嚷
  rationale: 表达嘈杂纷乱的骚动，并与前面的“声音”形成自然搭配。
- source_word: βρονταὶ
  choice: 雷鸣
  rationale: 自然表达复数所描写的阵阵雷声，无须机械保留希腊语复数形式。
- source_word: σεισμός
  choice: 地震
  rationale: 这是σεισμός在此处最直接的含义，也与雷鸣和大地动荡的异象相称。
- source_word: τάραχος
  choice: 动荡
  rationale: 该词可表示扰乱、骚动或混乱；“动荡”既能涵盖大地受扰，也保留可能涉及普遍混乱的张力。
- source_word: ἐπὶ τῆς γῆς
  choice: 大地一片
  rationale: γῆ既可指“大地”也可指“土地／境内”；正文依上下文中的雷鸣和地震采用“大地”，但以脚注保留地域性理解。
theological_decisions:
- issue: 梦境语境中γῆ所指的范围
  choice: 大地
  alternative: 那地／境内
  rationale: 雷鸣、地震与动荡构成规模宏大的景象，因此正文采用“大地”；但希腊词本身也可指特定地域，故不将另一可能性排除，借脚注予以保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文中突现式的梦境效果；连续使用“有”再以“大地一片动荡”收束，使异象的层层推进在中文中清楚自然。脚注标记置于相关整句末尾。
