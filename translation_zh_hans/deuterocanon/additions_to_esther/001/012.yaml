lexical_decisions:
- source_word: ἡσύχασεν
  choice: 留在
  rationale: 该动词可表示安静、静止或歇息；结合地点短语“在宫院里”，此处译作“留在”自然地表达末底改仍在那里，同时避免把语义限定为保持沉默。
- source_word: αὐλή
  choice: 宫院
  rationale: 该词可指院落，也可指王宫的庭院；上下文提到王的太监负责守卫，译作“宫院”既保留空间含义，也点明王宫背景。
- source_word: μετά
  choice: 同……在一起
  rationale: 此处表示人与人之间的伴随或同处关系。
- source_word: εὐνούχων
  choice: 太监
  rationale: 希腊文明确指被阉割而任宫廷职务的人；“太监”是现代汉语中准确、通俗的对应词，不泛化为“官员”。
- source_word: φυλασσόντων
  choice: 守卫着
  rationale: 现在分词表示持续承担看守、警卫宫院的职责；“守卫着”保留其进行性和职务性质。
- source_word: Μαρδοχαῖος
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Γαβὰθα
  choice: 迦巴他
  rationale: 按希腊文本音译，并采用自然的汉语音节形式。
- source_word: Θαῤῥὰ
  choice: 他拉
  rationale: 按希腊文本音译，并采用自然的汉语音节形式。
