base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/011.yaml
  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: zh_hans
  text: 末底改醒来后，想起自己所见的这个梦，以及上帝定意要做的事，就把这事记在心里[a]；直到夜晚，他一直想从各方面弄明白它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文印刷本此处作“ἐν Β τῇ καρδίᾳ”，其中“Β”很可能是排印或转录造成的异常；按上下文，意思应为“记在心里”。
    reason: textual_variant
  - marker: b
    text: “从各方面”所译的希腊语也可理解为“在每件事上”或“在每句话中”；这里可能指与这个梦有关的各个层面。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: 醒来后
  rationale: 该不定过去时被动分词在叙事中表示时间先后；现代汉语用“醒来后”自然清楚，也不必把被动形式生硬译出。
- source_word: ἑωρακὼς τὸ ἐνύπνιον τοῦτο
  choice: 见了这个梦
  rationale: ἑωρακώς表示在主要动作之前已经有过的看见或经历；ἐνύπνιον通常指“梦”。“见了这个梦”保留原文的视觉表达，又不把梦解释为异象。
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: 得知上帝定意要做的事
  rationale: βεβούλευται是完成时中间语态，表达已经形成的意旨或决定；“定意”既保留意向已定的意味，又不过度说明其具体内容。结合“见梦”的语境，以“得知”自然表达梦中所见涉及上帝的旨意。
- source_word: εἶχεν αὐτὸ … τῇ καρδίᾳ
  choice: 把这一切存在心里
  rationale: 保留καρδία的“心”这一圣经常用意象，兼有牢记、思量的意味；αὐτό在此概括前述梦及其中所显明的事，译作“这一切”较符合汉语指代习惯。
- source_word: ἐν παντὶ λόγῳ
  choice: 从各方面
  rationale: λόγος可指话语、事项、缘由或层面。此处与“弄明白”连用，较可能表示他希望全面理解；正文采用自然的“从各方面”，脚注保留“每件事／每句话”等可能。
- source_word: ἤθελεν ἐπιγνῶναι αὐτό
  choice: 一直想……弄明白这一切
  rationale: 未完成时ἤθελεν表示持续的愿望，ἐπιγνῶναι含充分认识或辨明之意；“一直想弄明白”同时传达持续性和深入理解。
- source_word: ἕως τῆς νυκτός
  choice: 直到夜晚
  rationale: 直译其时间终点，不额外限定为日落、黄昏或夜幕降临。
theological_decisions:
- issue: ὁ θεός的译法
  choice: 上帝
  alternative: 神
  rationale: 采用现代标准普通话中庄重而通行的称谓；原文只有一般神圣称号，不扩写为更具体的神学称号。
- issue: “存在心里”的人观意象
  choice: 把这一切存在心里
  alternative: 把这一切记在脑中
  rationale: 原文明确使用καρδία；保留“心”的意象，可同时涵盖记忆、反思与情感，而不把它缩减为纯认知活动。
- issue: 上帝定意与末底改理解之间的关系
  choice: 上帝定意要做的事；末底改想弄明白这一切
  alternative: 上帝已经启示了完整计划，末底改只是加以回想
  rationale: 原文并列上帝已经定意的事与末底改持续寻求理解的行动，正文保留二者之间的张力，不推断他当时已完全明白。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句中以分号呈现先把梦存在心里、继而持续寻求理解的两层动作；避免使用“异象”“神谕”等会缩窄ἐνύπνιον含义的术语。脚注标记按实际所注词语放置，分别标在“心里”和“从各方面”之后。
