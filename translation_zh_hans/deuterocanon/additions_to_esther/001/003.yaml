  text: He was from the captivity that Nebuchadnezzar king of Babylon had carried away from Jerusalem with Jeconiah king of Judea.
translation:
  language: zh_hans
  text: 他出自那次被掳的群体[a]，就是巴比伦王尼布甲尼撒曾把这个群体与犹大王耶哥尼雅[b]一同从耶路撒冷掳走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“出自被掳”，也可理解为“在流亡者中”或“出自被掳之民”。
    reason: lexical_alternative
  - marker: b
    text: “犹大王”按此处王室历史语境译出；希腊文用词为“犹地亚”，所指为犹大王国及其王室。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: 出自被掳的群体
  rationale: 原文直译为“出自被掳／被掳之事”。这里指他属于被掳离乡的群体；译作“出自被掳的群体”既保留来源、归属之意，也比生硬的“出自被掳”更符合现代汉语。
- source_word: ᾐχμαλώτευσεν
  choice: 掳走
  rationale: 该动词表示把人俘获并带走。“掳走”简洁地表达强制迁离，且符合这段历史叙述的语体。
- source_word: Ναβουχοδονόσορ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文读者熟悉的标准译名。
- source_word: μετὰ Ἰεχονίου
  choice: 连同……耶哥尼雅一起
  rationale: μετά加属格表示伴随；此译明确表示被掳群体与耶哥尼雅一同被带走，避免误解为耶哥尼雅协助执行掳掠。
- source_word: τῆς Ἰουδαίας
  choice: 犹地亚
  rationale: 紧随希腊文Ἰουδαία的表达，不直接改写为“犹大”；同时用脚注说明其历史所指。
theological_decisions:
- issue: 如何表达被掳身份而不附加后来的神学含义
  choice: 他出自被掳的群体
  alternative: 他在流亡者中／他属于被掳之民
  rationale: 本句是历史与人物背景说明。“被掳的群体”保留强制迁离及群体归属的含义，却不把该词扩展为特定的神学身份。
- issue: “犹地亚”与“犹大”的选择
  choice: 犹地亚王
  alternative: 犹大王
  rationale: 正文保留希腊文本的Ἰουδαία，避免无提示地校正原文；脚注则交代历史上所指的是犹大王国及其王室。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号拆开希腊文较紧密的关系结构，并补出“他们”来清楚表达被掳群体是“掳走”的受事；不改变耶哥尼雅与该群体一同被掳的关系。
