lexical_decisions:
- source_word: ἄνθρωπος Ἰουδαῖος
  choice: 一个犹太人
  rationale: 这里指一名具体的男性犹太人；现代汉语用“一个犹太人”自然、准确，无须重复译出“人”。
- source_word: οἰκῶν
  choice: 住在
  rationale: 该分词表示居住；“住在”是简明自然的现代汉语表达。
- source_word: ἐν Σούσοις τῇ πόλει
  choice: 在书珊城
  rationale: “书珊”采用中文圣经传统中通行的地名形式；“城”对应希腊文同位语 τῇ πόλει，并以自然汉语整合表达。
- source_word: ἄνθρωπος μέγας
  choice: 是个有地位的人
  rationale: μέγας 在王室语境中主要指身份、地位或影响力；“有地位的人”比字面的“大人物”更庄重，同时避免误解为身材高大。
- source_word: θεραπεύων
  choice: 供职
  rationale: 在宫廷语境中表示服侍、任职或随侍；“供职”清楚表达王室服务关系，又不带宗教性的“侍奉”色彩。
- source_word: ἐν τῇ αὐλῇ τοῦ βασιλέως
  choice: 在王的宫廷中
  rationale: αὐλή 在此指王室宫廷或宫廷范围；“宫廷”兼顾场所与王室机构含义，比单译“宫殿”更准确。
