  yaml_path: translation/deuterocanon/additions_to_esther/001/009.yaml
  text: And they cried out to God[a], and from their cry there came, as it were, a great river from a little spring, abundant water.
translation:
  language: zh_hans
  text: 他们向上帝呼求；从他们的呼声中，仿佛有一条大河从一眼小泉涌出，水很多。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他们的呼声中，仿佛从一眼小泉涌出一条大河，许多水。”
    reason: 保留ἐγένετο、ὡσανεί及ὕδωρ πολύ较贴近希腊语形式的另一种表达，并反映该句可采用不同的自然汉语语序。
lexical_decisions:
- source_word: ἐβόησαν
  choice: 呼求
  rationale: 该动词表示大声呼喊；因其对象是上帝，此处用“呼求”既体现迫切高声的呼喊，也自然传达祈求之意。
- source_word: πρὸς τὸν θεόν
  choice: 向上帝
  rationale: πρός在呼喊类动词之后标明呼喊所指向的对象；“向上帝”符合现代汉语表达。
- source_word: βοῆς
  choice: 呼声
  rationale: 与前面的“呼求”保持词义呼应，同时适合“从他们的呼声中”这一结构。
- source_word: ἐγένετο
  choice: 涌出
  rationale: 此处表示大河从泉源出现；结合水流意象译为“涌出”自然，但不理解为某物发生本质转变。
- source_word: ὡσανεὶ
  choice: 仿佛
  rationale: 保留比较或近似语气，使河流意象不被断定为纯粹的字面历史描写。
- source_word: μικρᾶς πηγῆς
  choice: 一个小泉源
  rationale: πηγή指泉或源头；“泉源”准确清楚，并以“小”保留与“大河”的鲜明对比。
- source_word: ποταμὸς μέγας
  choice: 一条大河
  rationale: 直译其规模之大，不额外加入“汹涌”或“壮阔”等原文未明说的含义。
- source_word: ὕδωρ πολύ
  choice: 水量充沛
  rationale: 该同位性短语强调河水众多；“水量充沛”是自然的现代汉语，同时保留数量上的强调。
theological_decisions:
- issue: 后半句河流意象的性质
  choice: 保留“仿佛”这一比较标记，不把意象直接断定为字面事件。
  alternative: 省略比较标记，把小泉涌出大河写成直接发生的事实。
  rationale: 希腊文ὡσανεί明确带有比较或近似意味；保留它可维持原文象征性与叙述性之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“呼求”适合祷告语境而不过度宗派化；“小泉源—大河”保留原文的尺度反差；分号清楚呈现呼求与随后异象之间的推进。
