  yaml_path: translation/deuterocanon/additions_to_esther/001/013.yaml
  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: zh_hans
  text: 他听取了他们的谋划，又细查了他们的心思，得知他们正准备向亚达薛西王动手[a]，便将此事禀告了王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把手加在亚达薛西王身上”，可指袭击、捉拿或其他敌对行动。
    reason: 保留希腊语习语的字面形象及其具体所指的不确定性。
lexical_decisions:
- source_word: ἠκρόασεν
  choice: 听到了
  rationale: 表示听取、获悉；结合密谋语境，“听到了”自然表达他听见其谋划，而不把方式说得过细。
- source_word: λογισμοὺς
  choice: 谋划
  rationale: 该词可指思想、盘算或计划；宫廷阴谋语境中的“谋划”兼具筹谋和敌意。
- source_word: μερίμνας
  choice: 心思
  rationale: 该词本可指挂虑、所关切之事；此处与密谋相关，“心思”保留其内在关注或意图的宽度，避免直接定为“意图”。
- source_word: ἐξηραύνησεν
  choice: 查明
  rationale: 表达深入探查并弄清；“查明”符合叙事结果，也比逐字的“彻底搜究”自然。
- source_word: ἑτοιμάζουσιν
  choice: 正准备
  rationale: 以进行体表达当时正在进行的准备。
- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: 下手加害
  rationale: 希腊语直译为“把手加在……身上”，在此表示敌对行动；“下手加害”既自然又不武断限定为逮捕或刺杀。
- source_word: ὑπέδειξεν
  choice: 禀告
  rationale: 表示使王知道此事；“禀告”简洁体现臣民向君王报告的宫廷语域。
