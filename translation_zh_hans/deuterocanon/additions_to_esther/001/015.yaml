  text: And the king wrote these words as a memorial[b][a], and Mordecai wrote concerning these words.
translation:
  language: zh_hans
  text: 王把这些话写下来，作为纪念[a]；末底改也写下了有关这些话的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留作记念”或“存档备忘”。希腊语εἰς μνημόσυνον可侧重纪念，也可侧重保存记录以供日后记忆。
    reason: lexical_alternative
  - marker: b
    text: “这些话”也可译作“这些事”。希腊语λόγοι在此既可指话语，也可较广泛地指事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写下来／记录下来
  rationale: γράφω在两处都指书写或记录。首句译作“写下来”，次句为使现代汉语自然译作“记录下来”，含义不变。
- source_word: τοὺς λόγους τούτους
  choice: 这些话／这些事
  rationale: λόγοι既可指具体的“话”，也可泛指所述的“事情”。首处保留“这些话”，第二处依περί结构译为“这些事”，并以脚注说明歧义。
- source_word: εἰς μνημόσυνον
  choice: 作为纪念
  rationale: μνημόσυνον指使人记念之物或保存以供记忆的记录；“作为纪念”保留其纪念与记存两方面的可能含义。
- source_word: Μαρδοχαῖος
  choice: 末底改
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: περὶ τῶν λόγων τούτων
  choice: 把这些事记录下来
  rationale: περί加属格表示“关于、涉及”；结合γράφω，中文用“把这些事记录下来”自然表达“写下有关这些事的内容”，但不进一步限定所写文本的性质。
