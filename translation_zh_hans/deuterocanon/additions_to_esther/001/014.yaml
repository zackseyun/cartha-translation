  text: And the king examined the two eunuchs[a], and after they confessed[b], they were led away.
translation:
  language: zh_hans
  text: 王查问[a]了那两个太监[b]；他们供认后，就被带走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查问”也可译作“审查”或“审问”；希腊文可指正式调查。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“宦官”；这类人常任宫廷官员，但原文使用的是特指太监的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήτασεν
  choice: 查问
  rationale: 该动词表示仔细查究或审问。“查问”自然地传达正式调查的意味，又不额外加入严酷审讯的色彩。
- source_word: εὐνούχους
  choice: 太监
  rationale: 原文明确使用指被阉割宫廷人员的词。“太监”是现代汉语中准确、易懂的对应词；不泛化为“宫廷官员”。
- source_word: ὁμολογήσαντες
  choice: 供认后
  rationale: 该过去时分词表示二人在受查问后承认了有关事实；“供认”符合司法语境，“后”清楚表达其与随后被带走之间的先后关系。
- source_word: ἀπήχθησαν
  choice: 被带走了
  rationale: 该被动形式表示二人在权力控制下被押离。“被带走了”保留原文未说明目的地及后续处置的含蓄性。
