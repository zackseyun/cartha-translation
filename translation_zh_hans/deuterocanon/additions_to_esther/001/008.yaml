base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/008.yaml
  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
translation:
  language: zh_hans
  text: 各个正直的民族都惊惶不安[a]；他们惧怕自身的灾祸[b]，并预备灭亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都受了搅扰”或“都陷入动荡”。希腊文ἐταράχθη可指受到搅扰、惊惶不安，也可指整体陷入动荡。
    reason: lexical_alternative
  - marker: b
    text: 或译：“自己的恶事”或“临到他们的灾难”。希腊文τὰ ἑαυτῶν κακά可指属于他们的恶，也可指他们自身所面临的祸患。
    reason: lexical_alternative
  - marker: c
    text: 或译：“预备被毁灭”。希腊文ἀπολέσθαι可着重于自身灭亡，也可着重于遭到毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: 陷入动荡
  rationale: 该词为被动形式，既可指内心不安，也可指群体受到搅扰；“陷入动荡”保留了被扰乱的力度和群体性的震动。
- source_word: δίκαιον
  choice: 正义的
  rationale: δίκαιος兼有正直、公义和合乎正义之意；修饰“民族”时，“正义的”自然庄重，也保留其道德分量。
- source_word: πᾶν ἔθνος
  choice: 所有……民族
  rationale: 希腊文以单数表达逐一涵盖的“每一个民族”；现代汉语用“所有……民族”更自然，同时不限定为国家政体或族群类别。
- source_word: φοβούμενοι
  choice: 他们惧怕
  rationale: 分词表达伴随状态或原因。汉语改用分句，并补出“他们”，既符合复数呼应，也清楚连接前文。
- source_word: τὰ ἑαυτῶν κακά
  choice: 自己将遭的灾祸
  rationale: κακά本可泛指恶事、祸患或灾害；在面临灭亡的语境中，“灾祸”较贴切。“将遭的”为汉语所需的轻度明示，表达他们所惧怕临到自身的祸患。
- source_word: ἡτοιμάσθησαν
  choice: 预备
  rationale: 该被动或中间形式在此可作不及物意义，表示他们已经作好准备；“预备”简洁且保留原文措辞。
- source_word: ἀπολέσθαι
  choice: 走向灭亡
  rationale: 中间语态不定式可表示灭亡、丧命，也可能带有被毁灭的意味；“走向灭亡”在现代汉语中自然，并未明确指定施害者。
theological_decisions:
- issue: δίκαιον用于描述受影响的ἔθνος时所含的意义
  choice: 采用具有道德意味的“正义的”
  alternative: 可译作“正直的”或“公正的”
  rationale: 该词在圣经希腊语中常带有道德和宗教色彩，但此处直接修饰民族。“正义的”既保留这种分量，又避免将其过度限定为个人敬虔或法律制度上的公正。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“于是”承接上下文；前半句保留群体性的动荡，后半句按汉语习惯补出复数代词“他们”。保留“预备……灭亡”这一不寻常而有张力的表达，不将其解释为主动求死、消极认命或军事备战。
