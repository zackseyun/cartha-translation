  rationale: 修订以“各个正直的民族”自然地表达“每一个义／正直的民族”，避免“正义的民族”的制度性或政治性联想；删去原文未特别强调的“于是”。末句保留“预备灭亡”的刻意张力和语义开放性，不擅自说明其是主动赴死、被杀，或面对某种特定灾难。脚注同步调整，使替代译法与正文及希腊文的语义范围一致。
