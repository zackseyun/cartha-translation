  yaml_path: translation/deuterocanon/additions_to_esther/001/006.yaml
  text: And at their cry every nation was made ready for war[b][a], so as to fight against the nation of the righteous.
translation:
  language: zh_hans
  text: 因他们的呼喊[a]，各国都被动员备战，为要攻打义人之国[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“声音”或“声响”；希腊语也可泛指他们发出的声音或喧嚷声。
    reason: lexical_alternative
  - marker: b
    text: 或译“公义之国”。希腊语既可理解为属格结构“义人之国”，也可作较凝练的描述“公义之国”。
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῇ
  choice: 呼喊
  rationale: 此处指他们发出的声音；在战争语境中译为“呼喊”自然贴切，同时以脚注保留“声音”等较宽泛的可能。
- source_word: ἡτοιμάσθη
  choice: 被整备
  rationale: 保留希腊语不定过去时被动语态，表明各国因外在推动而进入备战状态，而非自行预备。
- source_word: πᾶν ἔθνος
  choice: 各国
  rationale: 希腊语单数配合 πᾶν 具有逐一涵盖的分配意义；现代汉语以“各国”简洁自然地表达“每一个国家”。
- source_word: εἰς πόλεμον
  choice: 作战
  rationale: 在“整备”之后译作“作战”，表达朝向战争、为战争作准备的意义，避免生硬直译。
- source_word: ὥστε πολεμῆσαι
  choice: 要攻打
  rationale: 保留 ὥστε 加不定式所含的目的或预期结果色彩，不强行判定为已经发生的结果。
- source_word: δικαίων ἔθνος
  choice: 义人之国
  rationale: 按属格结构译出“义人之国”，不把所指直接限定为某一特定民族，并以脚注保留“公义之国”的描述性理解。
theological_decisions:
- issue: δικαίων ἔθνος 所指的群体
  choice: 义人之国
  alternative: 公义之国；犹太人的国家
  rationale: 原文使用描述性短语而非明确族名，因此正文不补入“犹太人”或“以色列”，以保留其群体身份与道德描述之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“随着”避免过度限定呼喊与备战之间究竟是时间关系还是促成关系；“被整备”虽略具书面色彩，但能清楚保留原文被动语态。
