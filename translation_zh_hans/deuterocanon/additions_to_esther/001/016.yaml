  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: zh_hans
  text: 王吩咐末底改在宫廷中服侍[a]，又因这些事赐给他礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在王宫里服侍”。希腊语直译为“在宫廷中”，可指王室宫廷或王宫范围内的服侍。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: 吩咐
  rationale: 表示君王发出具有权威的指令；“吩咐”自然庄重，又不把这一结构过度解释为正式任命。
- source_word: θεραπεύειν
  choice: 任职
  rationale: 此处指在王室环境中侍奉、供职；结合“宫廷中”，“任职”符合现代汉语表达，也避免宗教意味。
- source_word: ἐν τῇ αὐλῇ
  choice: 在宫廷中
  rationale: αὐλή可指庭院、宫殿范围或王宫廷臣环境；这里按叙事语境译为“宫廷”，同时保留介词的处所意味。
- source_word: δόματα
  choice: 礼物
  rationale: δόματα直接指所赐之物；“礼物”不预先断定其性质必为奖赏。
- source_word: περὶ τούτων
  choice: 因这些事
  rationale: 语境中表示赐礼的缘由；“这些事”保留复数指示，并自然承接前文事件。
