revisions:
- from: 在他后面。他们把他连同营地包围起来，从清早直到傍晚，不断向民众射出箭矢[a]。可是，民众……
  to: 在他后面。他们把他和营地包围起来，从清早直到傍晚，向众人射出箭矢[a]。可是，众人……
  rationale: 修订避免以“连同”解决原文中两个受事的困难关系，改以汉语自然的并列结构保留其歧义；删除“不断”，使时段表达不额外断定攻击频率；将“民众”改为“众人”，以较中性地对应λαός。脚注锚点仍紧随“箭矢”，准确关联词义不确定性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:50:47Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了开头和结尾承接前后文的残句，也正确表达了从清早到傍晚的攻击。可是，“不断”虽与持续时段相称，却是原文未明说的动作频率；“连同”则把两个宾语之间在希腊文中本已生硬、可能有文本问题的关系解释得过于确定。宜采用并列而不强化其关系的译法。
  naturalness: “在他后面”和“可是，众人……”作为跨节残句自然可读。“他们把他和营地包围起来”比“把他连同营地包围起来”更简洁，也较少造成“他在营地内”这一额外印象。“众人”在此比“民众”更中性，避免现代汉语中偏指非战斗平民的联想。
  terminology: “营地”恰当对应παρεμβολή；“箭矢”可作为σχίζας的上下文译法，脚注适当地保留其具体种类不确定性。
  issues:
  - severity: medium
    issue: “连同”过度界定αὐτόν与τὴν παρεμβολήν的关系。
    rationale: 该希腊语宾语组合本身不够顺畅，英文审计轨迹亦反映其句法困难。“连同”会明确表示把人和营地作为一个结合单位，超出原文可安全确定的范围。
  - severity: low
    issue: “不断”增添了未明说的动作频率。
    rationale: ἐκ πρωΐθεν ἕως δείλης表明攻击时段横跨全天，但不必然要求译为无间断地反复射击。
  - severity: low
    issue: “民众”在战斗语境中可能带来现代平民的较强联想。
    rationale: λαός可保留为较中性的“众人”，既不技术化为军队，也不特别限定为平民。
