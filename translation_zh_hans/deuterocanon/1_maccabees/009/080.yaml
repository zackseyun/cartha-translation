lexical_decisions:
- source_word: κατόπισθεν αὐτοῦ
  choice: 在他后面
  rationale: κατόπισθεν表示位于后方；原文从上一节未完的语句接续而来，因此保留片段式开头。
- source_word: ἐκύκλωσαν αὐτὸν τὴν παρεμβολήν
  choice: 他们把他连同营地包围起来
  rationale: ἐκύκλωσαν表示环绕、包围；αὐτόν与τὴν παρεμβολήν并列关系在现存希腊文中较为生硬，此译法保留‘他’和‘营地’两个受事，不擅自删去其中任何一个。
- source_word: παρεμβολήν
  choice: 营地
  rationale: 在军事叙事中，παρεμβολή通常指军营或营地；‘营地’简洁自然。
- source_word: ἐξετίναξαν
  choice: 不断……射出
  rationale: 该动词在此战斗语境中表示将投射物发射出去；结合持续一整天的时间语，加入‘不断’自然表达动作的延续性。
- source_word: σχίζας
  choice: 箭矢
  rationale: 这是较少见的投射物名称，可能泛指木制尖矢、飞镖或其他投射物；正文依战斗语境采用自然且较可能的‘箭矢’，并以脚注保留不确定性。
- source_word: ἐκ πρωΐθεν ἕως δείλης
  choice: 从清早直到傍晚
  rationale: 准确表达攻击从早到晚持续进行的时间跨度。
- source_word: λαόν
  choice: 民众
  rationale: λαός本义为人民、民众；上下文虽可能特指作战人群，仍避免擅自技术化为‘军队’或‘士兵’。
