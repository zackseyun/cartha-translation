  text: And Bacchides learned of it and gathered all his forces[c][b][a], and he gave orders to those from Judea.
translation:
  language: zh_hans
  text: 巴基德得知这事，就召集了他的全部人马[a]，又向那些来自犹太地的人[b]下令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的全体人众”；在这里很可能指他统率的全部军队或支持者。
    reason: lexical_alternative
  - marker: b
    text: 或译“那些在犹太地的人”。希腊文直译为“那些来自犹太地的人”，可能是指与犹太地有关的同伙，而不只是当时身处当地的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: 得知这事
  rationale: 该不定过去时在叙事中表示获知某项事态发展；“得知这事”自然承接上文，也不把它弱化为静态的“知道”。
- source_word: συνήγαγεν
  choice: 召集
  rationale: 表示把人聚集起来准备行动；在军事语境中，“召集”准确而自然。
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: 他的全部人马
  rationale: 字面为“他的全体群众/大队人众”，此处指由他统率的军队或随从；“全部人马”既符合军事语境，也避免把范围过度限定为正规军。
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: 那些来自犹太地的人
  rationale: 保留介词 ἐκ 的“从……来”之意，不擅自改作纯地点意义的“在犹太地的人”，也不额外限定其身份。
- source_word: παρήγγειλεν
  choice: 下令
  rationale: 该词表示发出命令或指示；“下令”符合军事叙事，简洁有力。
