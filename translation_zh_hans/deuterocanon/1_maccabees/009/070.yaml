base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
translation:
  language: zh_hans
  text: 约拿单得知这事，就派使者到他那里，要与他讲和，并请他把俘虏交还给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俘虏”原文直译为“被掳”或“被掳者的整体”，这里指被俘的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: 得知这事
  rationale: 该不定过去时在这里表示获知前文所述的发展；“得知这事”既自然，也保留了由上下文补足宾语的表达。
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 在派遣正式代表的语境中，“派”比单纯的“送”更自然。
- source_word: πρέσβεις
  choice: 使者
  rationale: 此词指承担交涉任务的正式代表；“使者”在现代中文中庄重而易懂，也不把其身份过度限定为现代常驻外交官。
- source_word: τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην
  choice: 要与他讲和
  rationale: 带冠词的不定式表示目的；“讲和”准确表达缔结和平、达成和议之意，而不额外指定正式条约形式。
- source_word: ἀποδοῦναι
  choice: 交还
  rationale: 表达把所扣留的人归还原方；“交还”适合外交交涉语境。
- source_word: τὴν αἰχμαλωσίαν
  choice: 俘虏
  rationale: 该词字面可指“被掳状态”或“被掳者的整体”，此处与“交还”搭配，具体指被俘的人。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 按原文保留复数代词的指向，不擅自明确为约拿单一方或某一特定群体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“使者”体现外交代表的身份，又避免现代政治术语“使节／大使”可能带来的过度限定。脚注标记置于其所说明的“俘虏”之后。
