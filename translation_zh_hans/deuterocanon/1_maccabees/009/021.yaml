  text: How the mighty one has fallen, he who was saving Israel.
translation:
  language: zh_hans
  text: 那位拯救以色列的勇士，竟然倒下了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的措辞呼应圣经中的哀歌句式“勇士何竟倒下”（参撒母耳记下1:19、25、27）。
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: 竟然
  rationale: 此处引出哀歌式惊叹，并非询问方式或原因。“竟然”以自然的现代汉语表达震惊与哀叹，不把它误译成实际疑问。
- source_word: ἔπεσεν
  choice: 倒下了
  rationale: 该不定过去时在这里指勇士战死；“倒下了”既保留“倒下”的形象，也符合哀悼逝者的汉语表达。
- source_word: δυνατός
  choice: 勇士
  rationale: 该形容词在此名词化并为单数。“勇士”保留其强有力、英勇之人的含义及庄重的哀歌语气，又不擅自补出犹大的名字。
- source_word: σώζων
  choice: 拯救
  rationale: 现在分词表示持续或具有代表性的行动。汉语定语结构“拯救以色列的”自然地保留其对这位勇士的描述；不限定为一次已经完成的拯救。
- source_word: τὸν Ἰσραήλ
  choice: 以色列
  rationale: 按专名直接译为“以色列”，在此可兼指以色列民，无须在正文中增添解释。
theological_decisions:
- issue: 与圣经哀歌套语的呼应
  choice: 采用“勇士……竟然倒下了”的哀叹句式
  alternative: 勇士怎么倒下了
  rationale: 原文明显带有“勇士何竟倒下”的传统哀歌回声。所选译法在现代汉语中自然地传达这一震惊与悲痛，同时避免把 Πῶς 处理成寻求答案的疑问句。
- issue: σώζων 的时间与行动性质
  choice: 译作定语“拯救以色列的”
  alternative: 曾拯救以色列的；一直在拯救以色列的
  rationale: 原文现在分词可表达当时持续或人物特有的行动。定语结构保留这种开放性，既不把行动限定为一次完成，也不额外强化为不间断的过程。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟然”承载 Πῶς 在哀歌中的惊叹作用；将分词短语前置为定语，使整句简洁流畅，同时保留单数勇士和其拯救以色列的特征。
