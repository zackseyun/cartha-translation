  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: zh_hans
  text: 到了阿左托，他们进了伯大衮，就是他们的偶像神庙，为求保命[b]。约拿单焚烧了阿左托和周围的城镇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或较直译作“他们的偶像”。这里很可能是指伯大衮的偶像圣所，而不只是偶像本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: 阿左托
  rationale: 按希腊文地名音译，以符合希腊语次经文本的表达；其希伯来语对应名称“亚实突”列入脚注。句首“到了”承接现存希腊文片段的方向关系。
- source_word: Βηθδαγὼν
  choice: 伯大衮
  rationale: 将其作为地点或建筑名称音译；后面的同位语说明其性质，无须在正文中另译为“大衮之家”。
- source_word: τὸ εἴδωλον αὐτῶν
  choice: 他们的偶像庙
  rationale: 字面为“他们的偶像”，但“进了伯大衮”的语境表明所指很可能是供奉偶像的庙宇或圣所；正文采用自然且符合场景的表达，同时以脚注保留字面可能。
- source_word: τοῦ σωθῆναι
  choice: 为求保命
  rationale: 带冠词的不定式表示目的；在军事逃亡语境中指寻求安全、保全性命，而非宗教意义上的救恩。
- source_word: ἐνεπύρισεν
  choice: 放火焚烧了
  rationale: 准确表达“使燃烧、放火烧”的动作，又不擅自断定城邑已被彻底烧毁。
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: 周围的城镇
  rationale: 自然表达阿左托附近环绕的各城邑。
theological_decisions:
- issue: σωθῆναι在军事逃亡场景中的含义
  choice: 为求保命
  alternative: 为要得救
  rationale: 上下文描述逃入异教圣所寻求庇护，因此这里是现实处境中的获救或安全，不应赋予专门的宗教救恩含义。
- issue: τὸ εἴδωλον αὐτῶν所指范围
  choice: 他们的偶像庙
  alternative: 他们的偶像
  rationale: “进了伯大衮”支持庙宇或圣所的理解，但希腊文字面仍为“偶像”；正文按语境传达，脚注保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“为求保命”避免把军事避难误读为神学意义上的救恩；“偶像庙”使场景清楚，同时借脚注保存希腊文的字面歧义。
