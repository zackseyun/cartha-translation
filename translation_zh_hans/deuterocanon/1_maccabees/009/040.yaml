  register: 采用现代、庄重而易懂的叙事语言。“冲出来攻击”呈现伏兵突然发动进攻的场景；分号和句号使连续战斗动作层次清楚。避免古雅词汇，并在脚注中保留τραυματίαι与σκεύη的词义范围。
