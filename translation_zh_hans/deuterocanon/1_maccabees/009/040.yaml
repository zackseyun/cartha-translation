  yaml_path: translation/deuterocanon/1_maccabees/009/040.yaml
  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: zh_hans
  text: 伏兵从埋伏之处冲出来攻击他们，把他们杀死；又有许多人负伤倒下[a]，其余的人都逃到山上。伏兵夺走了那些人所有的装备[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又有许多人成了伤亡者。”希腊语τραυματίαι可指受伤的人，也可较宽泛地指战斗中的伤亡人员。
    reason: lexical_alternative
  - marker: b
    text: 或译：“行装”或“用具”。希腊语σκεύη泛指各类物件；在这里的军事语境中，较可能指个人或行军装备。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτοὺς
  choice: 冲出来攻击对方
  rationale: ἐξανέστησαν本有“起来、起身”之意，在伏击的军事语境中表示突然起而进攻；译作“冲出来攻击”既保留行动的突发性，也符合现代汉语叙事习惯。
- source_word: ἀπὸ τοῦ ἐνέδρου
  choice: 从埋伏之处
  rationale: 表明攻击者由隐蔽伏击的位置现身；“埋伏之处”比单说“埋伏”更清楚地表达地点含义。
- source_word: ἀπέκτειναν αὐτούς
  choice: 把他们杀死
  rationale: 直接对应杀死对方的动作，措辞清楚，不使用古雅的“杀戮”或“击杀”。
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: 又有许多人负伤倒下
  rationale: 兼顾ἔπεσαν的“倒下”和τραυματίαι的“伤者、负伤者”之义，不把这些人一概说成死亡者，并以脚注保留“伤亡者”的较宽理解。
- source_word: οἱ ἐπίλοιποι
  choice: 其余的人
  rationale: 自然表达余下而逃脱的人，不额外断定他们的具体身份或伤势。
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: 逃到山上
  rationale: 保留原文单数τὸ ὄρος，不扩译成“山区”或“群山”。
- source_word: πάντα τὰ σκεύη αὐτῶν
  choice: 对方所有的装备
  rationale: σκεύη意义宽泛，可指器具、行装或装备；军事语境下“装备”最为自然。“对方”在汉语中避免连续使用“他们”造成指代混乱。
