  text: And Bacchides heard[a], and on the day of the Sabbaths he came as far as the banks of the Jordan with a great force.
translation:
  language: zh_hans
  text: 巴基德听到这消息后，于安息日带着大批军队抵达约旦河岸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听见了这消息
  rationale: ἀκούω在叙事语境中表示听到前文所述的消息；补出“这消息”使现代汉语自然，同时不具体说明消息来源。
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 在安息日
  rationale: 这是犹太希腊语中指单数安息日的惯用表达；译作“在安息日”准确、自然，无须机械保留复数形式。
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: 来到约旦河岸
  rationale: κρηπίς可指边缘或岸边；在河流地理语境中，“河岸”最贴切。ἕως在此表示抵达该处，汉语用“来到”即可自然表达。
- source_word: ἐν δυνάμει πολλῇ
  choice: 率领大批军队
  rationale: δύναμις在军事叙事中指武装力量；“大批军队”传达人数众多的军事队伍，而“率领”自然表达巴基德带兵前来的关系。
- source_word: Βακχίδης
  choice: 巴基德
  rationale: 按现代中文圣经人名惯例音译该希腊人名。
