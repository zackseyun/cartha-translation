base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: zh_hans
  text: 他对那些曾劝他进入这地方的无法无天之人发怒；他们杀了其中许多人[a]。他便决定返回自己的国土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本直译为“他们杀了其中许多人”。但前后的主要动词都是单数，叙事主角也是同一位领袖，因此也可能应理解为“他杀了其中许多人”。
    reason: 文本与句法上的主语疑难
lexical_decisions:
- source_word: ὠργίσθη
  choice: 发怒
  rationale: 该词为不定过去时，表示怒气发作；“发怒”自然简洁，又不额外强化为“暴怒”。
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: 那些无法无天的人
  rationale: ἀνόμοις 含有违背法律、律法或既定规范之意；“无法无天”保留其法律—道德色彩，并符合现代汉语表达。
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: 因为他们曾劝他
  rationale: 分词说明他发怒所针对之人的身份和缘由；“曾劝他”体现该劝说先于当前行动。汉语加入“因为”使句间逻辑自然，但不改变所指。
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: 来到这地区
  rationale: χώρα 在此指当前军事行动涉及的地域；“地区”避免把它误读为具有特殊神学含义的“地”。“这”按叙事视角自然表达定冠词所指的当地。
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: 他们杀了其中许多人
  rationale: 现存所给希腊文本的动词 ἀπέκτειναν 是第三人称复数，故正文不擅自改为单数；同时脚注说明上下文造成的主语疑难。
- source_word: ἐβουλεύσατο
  choice: 决定
  rationale: 中间语态不定过去时在此表示作出打算或决断；“决定”清楚表达已形成的意向。
- source_word: τοῦ ἀπελθεῖν
  choice: 返回
  rationale: ἀπελθεῖν 表示离开当前地点；结合目的地是“自己的国土”，汉语用“返回”最自然。
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: 自己的国土
  rationale: γῆ 在这里指其本国或所属疆土；“自己的国土”保留归属意味，也符合军事叙事语域。
