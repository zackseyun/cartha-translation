lexical_decisions:
- source_word: Ἰούδας
  choice: 犹大
  rationale: 按现代中文圣经人名惯例译作“犹大”；本处指犹大·马加比。
- source_word: ἔπεσεν
  choice: 倒下了
  rationale: πίπτω 的不定过去时直义为“倒下”；在战事叙述中常暗示战死，但原文没有更明确地说“死”，因此正文保留其简洁而庄重的战场表达，并以脚注说明。
- source_word: οἱ λοιποὶ
  choice: 其余的人
  rationale: 指除犹大以外剩下的人；“其余的人”在现代汉语中清楚自然，并保留原文的对照。
- source_word: ἔφυγον
  choice: 都逃跑了
  rationale: φεύγω 在此表示因战败或危险而逃离；“逃跑”直接表达其义，“都”自然体现带冠词复数主语所指的全体余众。
