  yaml_path: translation/deuterocanon/1_maccabees/009/016.yaml
  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: zh_hans
  text: 左翼的人[a]看见右翼已经被击溃，就转身从后方紧追犹大和与他同在的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “左翼”和本节的“右翼”，希腊文直译分别为“左角”和“右角”，是指军队阵形两翼的军事用语。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“转回到犹大和与他同在之人的脚后跟处，从后面”；其中“在……脚后跟处”是表示紧随或紧追的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: 左翼 / 右翼
  rationale: κέρας字面意为“角”，但在此为希腊军事用语，指军队阵形的两翼；译作“左翼、右翼”自然清楚，并保留两者的对应关系。
- source_word: συνετρίβη
  choice: 已被击垮
  rationale: 该词是被动形式，表示被打碎、摧毁；“已被击垮”既保留其强烈语气和被动意义，也符合战场语境，同时避免直接增译为“溃逃”。
- source_word: ἐπέστρεψαν
  choice: 掉转方向
  rationale: 表示转向或回转；结合战局，此处是左翼改变行进方向，转而追击犹大一方。
- source_word: κατὰ πόδας
  choice: 紧追
  rationale: 该习语字面与“脚后跟”有关，表示紧跟在某人脚后追赶；“紧追”是现代汉语中自然的军事叙述。
- source_word: ἐκ τῶν ὄπισθεν
  choice: 从后面
  rationale: 明确交代追击来自犹大一行人的后方，故直接译出。
- source_word: τῶν μετʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 原文泛指与犹大同在的一群人；此译不将其范围限定为士兵，同时在战事语境中表达自然。
theological_decisions: []
