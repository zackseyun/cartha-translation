base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/044.yaml
  text: And Jonathan said to his brothers[a], “Let us rise now and fight for our lives, for today is not as yesterday and the day before.”
translation:
  language: zh_hans
  text: 约拿单对他的弟兄们说：“现在我们起来，为保全性命而战吧！因为今天的情势已不同于昨天和前天。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: 我们起来
  rationale: 不定过去时虚拟语气在此用于劝勉；“我们起来”保留行动的紧迫感和军事号召的语气。
- source_word: πολεμήσωμεν
  choice: 而战吧
  rationale: 该动词指投入战斗；“而战”简洁庄重，并与劝勉语气相配。
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: 为保全性命
  rationale: ψυχή在当前战斗语境中指生命而非非物质的灵魂；“为保全性命”自然表达为生存而战的意思。
- source_word: σήμερον
  choice: 今天
  rationale: 直接对应时间副词，符合现代汉语常用表达。
- source_word: ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: 不同于昨天和前天
  rationale: 这是指此前两天的希腊语习语；按现代汉语自然译为“昨天和前天”，并结合οὐ…ὡς表达“不同于”。
- source_word: ἀδελφοῖς
  choice: 弟兄们
  rationale: 保留希腊文阳性亲属称谓；在此既可指亲兄弟，也可能涵盖亲近的同族战士，译文不进一步限定。
- source_word: οὐ γάρ ἐστιν σήμερον ὡς
  choice: 因为今天的情势已不同于
  rationale: 原文省略明确的比较主体，意为今日状况不同；补出“情势”使中文完整自然，同时不具体解释变化内容。
