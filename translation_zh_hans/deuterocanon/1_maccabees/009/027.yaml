  yaml_path: translation/deuterocanon/1_maccabees/009/027.yaml
  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: zh_hans
  text: 以色列中发生了极大的苦难；自从先知不再在他们中间出现以来，从未有过这样的苦难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先知不再在他们中间出现”也可译作“先知不再被他们看见”或“先知不再向他们显现”。希腊文的被动形式可按字面理解为“被看见”，也可表示“出现”或“显现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 遭遇了
  rationale: 在叙事语境中自然表达苦难的发生，同时避免生硬照译为“成为了”。
- source_word: θλίψις μεγάλη
  choice: 极大的苦难
  rationale: 表达严重的困苦与压迫，不引入“灾难时期”等可能带有特定末世论意味的术语。
- source_word: ἐν τῷ Ἰσραήλ
  choice: 以色列
  rationale: 将以色列理解为承受危机的群体；汉语“以色列遭遇”比“在以色列中有”更自然。
- source_word: ἥτις οὐκ ἐγένετο
  choice: 这是……从未有过的
  rationale: 体现关系从句的定性和比较作用，强调这场苦难前所未有。
- source_word: ἀφʼ ἧς ἡμέρας
  choice: 自从……以来
  rationale: 自然传达作为比较起点的时间表达；“日”在汉语中无需机械译出。
- source_word: οὐκ ὤφθη
  choice: 不再有……显现
  rationale: ὤφθη既可按被动义理解为“被看见”，也可作“显现”；正文采用自然的“显现”，并以“不再”表达语境所含的中止。
- source_word: προφήτης
  choice: 先知
  rationale: 保留希腊文单数形式的类指意义，指先知这一身份的人不再出现，而非某位特定先知。
- source_word: αὐτοῖς
  choice: 他们中间
  rationale: 按语境表达先知在以色列群体中的出现；形式上也可理解为“向他们”。
theological_decisions:
- issue: 先知缺席从何时开始，以及是否表示预言职分正式终止
  choice: 将经文译作对以色列中间不再有先知显现这一历史时期的哀叹
  alternative: 可理解为从没有先知向他们显现之日起，或仅指当时没有先知公开出现
  rationale: 先知的单数是类指用法。译文表达经文所述的历史性缺席，但不将其扩展为关于预言永久终止的教义判断。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“极大的苦难”保留原文的强度；句法稍作汉语化处理。脚注保留οὐκ ὤφθη的真实歧义，正文不据此建立超出经文的神学结论。
