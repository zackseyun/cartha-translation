  text: And they avenged the blood of their brother[b][a], and returned to the hill country of the Jordan.
translation:
  language: zh_hans
  text: 他们为自己的兄弟报了血仇[a]，然后回到约旦河山区[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“为自己兄弟的血报了复仇”，是强调报血仇的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“约旦河的山”。希腊文ὄρος既可指一座山，也可指山地或山区。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδίκησαν τὴν ἐκδίκησιν αἵματος
  choice: 报了血仇
  rationale: 原文采用同根词构成强调表达，直译会显得重复生硬；“报了血仇”自然、简洁地传达为流血之死复仇的含义，同时保留叙事中的强烈语气。
- source_word: ἀδελφοῦ αὐτῶν
  choice: 自己的兄弟
  rationale: ἀδελφός在此为单数，通常指具体的一位兄弟；不扩大译为“亲族”或“同胞”。“自己的”明确对应αὐτῶν，并符合现代汉语表达。
- source_word: ἀπέστρεψαν
  choice: 回到
  rationale: 该动词在此表示返回先前所在的地区；“回到”兼顾方向含义和自然叙事语气。
- source_word: εἰς τὸ ὄρος τοῦ Ἰορδάνου
  choice: 到约旦河山区
  rationale: ὄρος既可指一座山，也可指山地或山区。叙事语境更可能指一个地理区域，故正文采用自然的“约旦河山区”，并以脚注保留“山”的可能译法。
