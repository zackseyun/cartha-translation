  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: zh_hans
  text: 约拿单、西门和跟随他的人[a]撤往旷野里的伯巴西；他重建了伯巴西被拆毁的部分，并加固了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟随他的人”：希腊文直译如此，其中“他”为单数；也可按约拿单和西门共同带领这群人的语境理解为“跟随他们的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: 撤到
  rationale: 该动词在此军事叙事中表示退出、撤离；“撤到”既体现离开险境的意味，也不夸大为仓皇逃跑。
- source_word: οἱ μετʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 希腊文使用单数代词αὐτοῦ，直译为“跟随他的人”。虽然约拿单和西门同作前面的主语，仍保留原文单数所形成的指向张力，不擅自改为复数。
- source_word: Βεθβασί
  choice: 伯巴西
  rationale: 作为地名，按希腊文音译，并采用适合现代汉语的三字形式。
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: 旷野里的
  rationale: ἐρήμος在此指人烟稀少的荒野；“旷野”符合圣经叙事语域，又不限定为沙漠地貌。
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: 重建了那里被拆毁的部分
  rationale: καθηρημένα指已经被拆下或毁坏之物；此译比单说“废墟”更贴近原文结构，也自然传达修复重建之意。
- source_word: ἐστερέωσεν
  choice: 加固了
  rationale: 该词基本义是使坚固、加强；在战事背景中指加强据点，但译作“加固”比“设防”少一层未明说的军事具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“撤到”“重建”“加固”保持动作推进简洁有力；保留希腊文单数代词的歧义，并用脚注说明另一种符合上下文的理解。
