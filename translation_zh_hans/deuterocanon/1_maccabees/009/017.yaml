  text: And the battle grew fierce[a], and many fell wounded from both sides.
translation:
  language: zh_hans
  text: 战斗越发激烈，双方[a]都有许多人负伤倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从这些人中，也从那些人中”，意思是交战双方。
    reason: 说明希腊文指示代词构成的对称表达。
lexical_decisions:
- source_word: ἐβαρύνθη
  choice: 越发激烈
  rationale: 该动词的被动形式字面有“变得沉重”之意；用于战斗语境，表示战况加剧、趋于激烈。现代汉语用“越发激烈”自然地传达这一语境义。
- source_word: ὁ πόλεμος
  choice: 战斗
  rationale: πόλεμος虽可指“战争”，但此处描述当前交战场面，译作“战斗”更贴合上下文。
- source_word: ἔπεσαν τραυματίαι
  choice: 负伤倒下
  rationale: ἔπεσαν意为“倒下”，τραυματίαι指受伤者；合译为“负伤倒下”，既保留动作，也不把伤者误说成阵亡者。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 直接表达人数众多，符合现代汉语叙事习惯。
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: 双方都有
  rationale: 希腊文直译为“从这些人中，也从那些人中”，在此是对称地指交战双方；“双方都有”简洁自然，并保留两边均有伤者的意思。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“负伤倒下”保留原文对受伤与倒下的并列表达，避免使用可能兼指死亡的“伤亡”。
