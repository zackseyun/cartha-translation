base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/054.yaml
  text: And in the one hundred and fifty-third year[a], in the second month, Alcimus ordered the wall of the inner court of the sanctuary to be torn down, and he tore down the works of the prophets[b], and began to tear it down.
translation:
  language: zh_hans
  text: 一百五十三年[a]二月，阿尔基慕下令拆毁圣所内院的墙；他拆毁了先知们的工程[b]，并开始拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说纪年体系；上下文采用的是塞琉古纪年。
    reason: historical_context
  - marker: b
    text: “先知们的工程”直译原文；可能指与先知有关的建筑或修缮工程，但希腊文没有具体说明。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: 一百五十三年
  rationale: 希腊文以相加方式表达年份；汉语按自然次序译为“一百五十三年”，不在正文中补入原文未明说的纪年名称。
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: 二月
  rationale: 这是表时间的与格结构；“二月”简洁自然，并保留历法月份的含义。
- source_word: ἐπέταξεν
  choice: 下令
  rationale: 准确表达发布命令的力度，也符合现代汉语叙事文体。
- source_word: καθελεῖν / καθεῖλεν / καθαιρεῖν
  choice: 拆毁／拆除
  rationale: 三个形式出自同一动词，均指拆除建筑物；主体词统一采用“拆”，末句稍作词形变化以避免汉语生硬重复。
- source_word: τὸ τεῖχος
  choice: 墙
  rationale: τεῖχος在此指围墙或墙体；“墙”准确、清楚，不额外限定其规模。
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: 圣所内院的
  rationale: 将ἐσωτέρας理解为修饰αὐλῆς，译出圣所范围内的“内院”；“圣所”自然表达τὰ ἅγια所指的神圣殿宇区域。
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: 先知们的工程
  rationale: 原短语所指不明，可能是与先知有关的建筑或修缮工程；采用较直译的表达，避免擅自确定其具体性质。
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: 着手拆除
  rationale: 表达“开始拆除”。希腊文此处没有明说宾语，因此中文也不补入“它”或具体建筑，以保留原文的省略。
theological_decisions:
- issue: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας所表达的圣殿空间关系
  choice: 圣所内院的墙
  alternative: 圣地内院的墙／圣所的内院墙
  rationale: “圣所内院的墙”既保留神圣空间用语，也以自然汉语呈现内院与圣所的所属关系，不引入原文之外的后期圣殿术语。
- issue: τὰ ἔργα τῶν προφητῶν的历史所指
  choice: 先知们的工程
  alternative: 先知们所建的建筑／先知们的修缮工程
  rationale: 希腊文没有说明这些“工程”究竟是什么，也没有明确说是先知亲手建造或修缮；正文保留其含混性，并用脚注提示。
- issue: 末句省略拆除对象
  choice: 并着手拆除
  alternative: 并开始拆毁它
  rationale: 原文没有表达“它”的代词；不补足宾语，可避免把末句所指武断限定为墙或先知们的工程。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“阿尔基慕”按希腊名Ἄλκιμος作现代汉语音译。分号帮助读者辨明命令与后续行动，同时保留原句连续推进的结构。
