    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: 他追赶那人
  rationale: δίωκω在军事叙事中表示追赶、追击；用“那人”表达希腊文阳性单数代词，同时不擅自确定其所指。
- source_word: εἰς Ἄζωτον
  choice: 直到阿所突
  rationale: 介词εἰς在追赶语境中可表示追赶所达到的地点；“直到”自然地传达范围终点。Ἄζωτος按传统地名译作“阿所突”。
- source_word: συνῆψαν … εἰς πόλεμον
  choice: 交战
  rationale: συνάπτω与εἰς πόλεμον连用，在军事语境中指接战、投入战斗；“交战”简洁自然。
- source_word: αἱ παρεμβολαὶ
  choice: 各军
  rationale: παρεμβολή本义为营地或军营，也可转指驻营的军队；此处作为交战主体，译作“各军”比字面的“各营”更符合现代汉语，同时保留复数而不明确限定为“两军”。
- source_word: ὀπίσω αὐτοῦ
  choice: 在那人后方
  rationale: 此处取空间意义“在他后面”；再次用“那人”避免现代汉语连续多个“他”所造成的指代混乱，也不替原文消除所指的不明确性。
- source_word: ἀπέλειπεν
  choice: 留下了
  rationale: 该动词表示使某人或某物留在后面；“留下了”保留其基本意义，不进一步推断骑兵是伏兵、后备军或驻防部队。
- source_word: χιλίαν ἵππον
  choice: 一千名骑兵
  rationale: ἵππος字面为“马”，但在军事人数表达中可转指骑兵；汉语用“一千名骑兵”清楚自然。
- source_word: Ἀπολλώνιος
  choice: 亚波罗尼乌
  rationale: 按希腊文人名音译，并采用简明的现代汉语形式。
