  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: zh_hans
  text: 他追赶他，直到亚实突；各军在他后方交战[a]。亚波罗尼乌斯留下了一千名骑兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“各营在他后面投入战斗”。这里的“各营”很可能指军队或军事部队；“他”具体指谁，原文没有明说。
    reason: lexical_alternative
  - marker: b
