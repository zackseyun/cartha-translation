translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“子孙”表达家族成员的可能含义；末句明确承接前面的约翰及其财物，以消除汉语代词歧义。原文无需要另加脚注才能保存的神学或文本歧义。
