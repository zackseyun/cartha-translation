  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: zh_hans
  text: 雅姆利的儿子们从米底巴出来，抓住了约翰和他所有的一切，然后把约翰和他所有的一切都带走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: 雅姆利的子孙
  rationale: υἱοί字面为“儿子们”，但此处很可能泛指雅姆利家族或宗族成员；译作“子孙”既保留亲族称谓，也避免限定为亲生儿子。Ἰαμβρεί按希腊文音译为“雅姆利”。
- source_word: ἐκ Μηδαβά
  choice: 从米底巴出来
  rationale: ἐκ表示从某地出来；“从……出来”自然保留移动方向，Μηδαβά音译为“米底巴”。
- source_word: συνέλαβον
  choice: 抓住了
  rationale: 该动词在语境中表示强行捉拿或擒获；“抓住”符合现代汉语，也不引入“逮捕”所带的司法含义。
- source_word: Ἰωάνην
  choice: 约翰
  rationale: 按希腊文人名Ἰωάνης的通行汉语译名处理，不反向重构为闪语形式。
- source_word: πάντα ὅσα εἶχεν
  choice: 他所有的一切
  rationale: 保留πάντα的全面性及ὅσα εἶχεν“凡他所有的”这一关系结构；汉语表达清楚而庄重。
- source_word: ἀπῆλθον ἔχοντες
  choice: 然后把人和财物都带走了
  rationale: 希腊文直译为“他们带着〔所抓获的〕离去了”，ἔχοντες的所指承接约翰及他所有的一切。为避免汉语代词在“人”和“物”之间含混，明示为“人和财物”，但不改变其范围。
