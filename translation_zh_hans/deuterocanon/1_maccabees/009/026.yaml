  register: 采用现代、庄重而易懂的叙事语言。“搜寻、追查”保留原文近义词叠用的力度；“押到”贴合拘捕交付的语境。原文在“巴基德惩治”处使用单数动词，随后“戏弄”改用复数动词，译文以“巴基德”及“那些人”保留这一主语转换，并避免擅自认定复数施事者的具体身份。
