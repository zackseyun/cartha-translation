  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: zh_hans
  text: 他们不断搜寻、追查犹大的朋友[a]，把他们押到巴基德那里；巴基德惩罚他们，那些人也嘲弄他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”也可指犹大的支持者或盟友。希腊文直译为“朋友”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν καὶ ἐξηραύνων
  choice: 不断搜寻、追查
  rationale: 两个近义动词叠用，加强主动搜捕、查找之意；未完成时态所表达的持续或反复行动用“不断”体现。希腊文本中第二个形式与前后复数主语在语法上不整齐，译文按语境表达为同一持续行动，不据此另立不明主语。
- source_word: τοὺς φίλους Ἰούδου
  choice: 犹大的朋友
  rationale: 保留 φίλους 的基本义“朋友”，不在正文中直接限定为政治或军事支持者；上下文可能包含该引申义，列入脚注。
- source_word: ἦγον αὐτοὺς πρὸς Βακχίδην
  choice: 把他们押到巴基德那里
  rationale: ἦγον 是未完成时，表示反复带去；在搜捕并交付的敌对语境中，“押到”比中性的“带到”更自然，同时没有增添审判程序。
- source_word: ἐξεδίκα αὐτούς
  choice: 巴基德惩治他们
  rationale: 动词为单数，主语自然承接巴基德。ἐκδικέω 可表示施行惩罚、伸张公道或报复；正文采用较宽的“惩治”，脚注保留报复性理解。
- source_word: ἐνέπαιζον αὐτοῖς
  choice: 那些人还戏弄他们
  rationale: 动词为复数，与前一单数动词形成主语数的转换；用“那些人”显明复数施事者，但不进一步确定其具体身份。“戏弄”保留嘲弄、使人受辱的意味。
