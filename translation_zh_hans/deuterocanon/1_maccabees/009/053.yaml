base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/053.yaml
  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: zh_hans
  text: 他们扣留当地首领的儿子作人质，并将他们安置在耶路撒冷的卫城[a]内加以看守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚克拉堡”，即耶路撒冷的一座设防堡垒。
    reason: 原文ἄκρα可泛指卫城或堡垒，也可能在此特指称为“亚克拉”的耶路撒冷堡垒。
lexical_decisions:
- source_word: ἔλαβον
  choice: 抓来
  rationale: 此处指把人控制起来作为人质；“抓来”比单纯的“带走”更能体现强制意味，同时不必强化为军事意义上的“俘获”。
- source_word: τοὺς υἱοὺς
  choice: 儿子
  rationale: 原文明确使用阳性复数“儿子”，故不泛化为“子女”或“孩子”。
- source_word: τῶν ἡγουμένων
  choice: 首领
  rationale: 该分词名词化后指当地居领导地位的人；“首领”自然、明确，又不武断限定为正式官职。
- source_word: τῆς χώρας
  choice: 当地
  rationale: χώρα可指地方、地区或国土；结合“首领”译作“当地首领”，符合现代汉语表达，并保留地域范围未被精确界定的特点。
- source_word: ὁμήρα
  choice: 作人质
  rationale: ὁμήρα明确指人质；“作人质”自然表达这些儿子被抓的身份和用途。
- source_word: ἔθεντο
  choice: 将……拘禁
  rationale: 结合后面的ἐν φυλακῇ，将放置与看守的含义合并表达为“拘禁”，使叙事简洁自然。
- source_word: ἐν τῇ ἄκρᾳ
  choice: 在……城堡里
  rationale: ἄκρα可指设防的城堡，也可能特指耶路撒冷的亚克拉堡；正文用通俗的“城堡”，专名可能性收入脚注。
- source_word: ἐν φυλακῇ
  choice: 拘禁
  rationale: φυλακή在这里表示受看守、被羁押的状态；“拘禁”不限定为某座专门的监狱，也准确体现失去自由。
