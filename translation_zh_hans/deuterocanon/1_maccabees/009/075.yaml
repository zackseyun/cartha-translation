  naturalness: “城下扎营”“拒于城外”及“攻打这城”均符合现代庄重叙事文体。以分号串联各分句，更贴近原文连续的叙事推进。
  terminology: “约帕”“亚波罗尼”“驻军”用语恰当；“一支驻军”自然反映希腊文φρουρά的不定指，且不对其具体编制作无根据的限定。
