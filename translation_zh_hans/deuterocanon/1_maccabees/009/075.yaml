  yaml_path: translation/deuterocanon/1_maccabees/009/075.yaml
  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: zh_hans
  text: 他在约帕城下扎营；城里的人把他拒于城外，因为亚波罗尼的一支驻军在约帕；他们便攻打这城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他们攻打它”。前文动词以单数“他”为主语，到这里转为复数；“他们”很可能指约拿单及其部队，“它”则指约帕。译文保留这一主语转换。
    reason: 保留原文突然而明确的单复数转换，并说明末句代词最可能的所指。
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: 在……对面扎营
  rationale: παρεμβάλλω表示扎营或布阵；ἐπί加城市名在此带有敌对进军的意味。“在……对面扎营”既保留扎营这一具体动作，也自然传达围攻背景。
- source_word: Ἰόππην
  choice: 约帕
  rationale: 采用该古代港城在现代中文圣经传统中通行的译名。
- source_word: ἀπέκλεισαν αὐτόν
  choice: 把他拒于城外
  rationale: 动词表示阻挡、拒之于外，宾语αὐτόν明确是“他”；此译明确城中人不让他进城。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 直指来自或属于该城的人，不增添原文未明说的性别，也比“从城里出来的人”更符合此处居民拒绝其入城的语境。
- source_word: φρουρὰ Ἀπολλωνίου
  choice: 亚波罗尼的驻军
  rationale: φρουρά指驻守当地的卫戍部队，属格表明其隶属或关联于亚波罗尼。
- source_word: ἐπολέμησαν αὐτήν
  choice: 他们攻打这城
  rationale: 保留第三人称复数主语，并将阴性代词αὐτήν按其最自然的先行词“城”译出；πολεμέω在军事语境中译为“攻打”自然且准确。
