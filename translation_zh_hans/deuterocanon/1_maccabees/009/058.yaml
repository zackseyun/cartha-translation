  yaml_path: translation/deuterocanon/1_maccabees/009/058.yaml
  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: zh_hans
  text: 所有不法之人一同商议说：“看，约拿单和与他在一起的人正安然居住，心里很有把握。[a]现在我们把巴基德带来，他就会在一夜之间把他们全都捉住。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正平静地居住，满有信心。”希腊文将“安静、不受搅扰地居住”（ἐν ἡσυχίᾳ κατοικοῦσιν）与表示“有信心”“信赖”或“确信”的分词（πεποιθότες）连在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: 一同商议
  rationale: 该中间语态动词表示众人彼此商议、共同谋划；译文保留审议行动，又不额外断定其秘密性质。
- source_word: οἱ ἄνομοι
  choice: 不守律法的人
  rationale: ἄνομοι 指违背或不遵守律法者；此译保留本段犹太语境中的律法色彩，避免泛化为仅指品行恶劣的“恶人”。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引人注意的语气词，“看”简明自然，并保留原文现场感。
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: 跟随他的人
  rationale: 该短语泛指约拿单身边或与他同在的人，并未明确限定其为士兵；“跟随他的人”在汉语中自然且不过度具体化。
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν
  choice: 正安然居住
  rationale: 兼顾 κατοικοῦσιν 的居住含义和 ἐν ἡσυχίᾳ 所表达的平静、未受搅扰状态。
- source_word: πεποιθότες
  choice: 心里毫无疑虑
  rationale: 该完成时分词表示处于信任、确信或自觉安全的状态；结合敌人准备突袭的语境，此译自然呈现其笃定安稳，同时以脚注保留较形式对应的译法。
- source_word: ἄξομεν
  choice: 我们把……引来
  rationale: 原文形式为将来时，语境中带提议和决意色彩；“现在我们把……引来”符合现代汉语谋划语气。
- source_word: συλλήψεται
  choice: 捉住
  rationale: 可指抓获、擒拿；“捉住”适合军事突袭语境，又不带现代司法程序中“逮捕”的限定意味。
- source_word: ἐν νυκτὶ μιᾷ
  choice: 在一夜之间
  rationale: 保留 μία 对行动迅速集中、仅需一夜的强调，汉语表达也自然。
