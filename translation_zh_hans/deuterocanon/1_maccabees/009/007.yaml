base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/007.yaml
  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: zh_hans
  text: 犹大看出自己的部队正逐渐不支[a]，因为战斗正紧逼着他；他心中十分痛苦，因为没有时间把他们召集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大看出”之后的希腊原文措辞简略，句意有所省略。“部队”所译的词也可指“军营”或驻营的兵力；这里按上下文理解为，犹大看出自己的兵力在战斗压力下正逐渐不支。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 自己的军队正在溃散
  rationale: παρεμβολή在军事语境中可指营地，也可转指驻营的军队。传世希腊文本在此句法简略，未明说军队如何；结合下句战事逼迫的语境，译作“军队正在溃散”自然表达其兵力正瓦解，同时用脚注保留原文的省略性。
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: 战事正重重压迫他
  rationale: πόλεμος在眼前交战的语境中译作“战事”；未完成时ἔθλιβεν表示持续施压，“正重重压迫”保留其压迫、逼迫的力度。
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: 他心里崩溃了
  rationale: συντρίβω有击碎、压碎之意，与“心里”连用形容内心遭受沉重打击；“心里崩溃了”在现代汉语中自然且保留强烈意象。
- source_word: καιρὸν
  choice: 时间
  rationale: καιρός可指合宜的时机或机会；紧迫的战场语境侧重可供行动的时间，译作“时间”最自然，也隐含机会之意。
- source_word: συναγαγεῖν αὐτούς
  choice: 把他们召集起来
  rationale: συνάγω意为聚集、召集；“召集起来”贴合军事语境，又不额外解释为整顿或重振士气。
