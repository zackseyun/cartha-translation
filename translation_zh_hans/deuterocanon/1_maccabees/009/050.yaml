base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/050.yaml
  text: 'And they returned to Jerusalem and built fortified cities in Judea: the stronghold in Jericho[a], and Emmaus, and Beth-horon, and Bethel, and Thamnatha-pharathon, and Tephon[b], with high walls and gates and bars.'
translation:
  language: zh_hans
  text: 他们回到耶路撒冷，在犹太地修筑了设防的城邑：耶利哥的堡垒、以马忤斯、伯和仑、伯特利、特玛纳塔·法拉通[a]和特丰[b]，都设有高墙、城门和门闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特玛纳塔·法拉通”在其他文本传统中也有不同的拼写形式，如“亭拿特·法拉通”。
    reason: lexical_alternative
  - marker: b
    text: “特丰”依所给希腊文本音译；有些传统采用不同的拼写形式，如“塔丰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: 回到
  rationale: 表示返回先前所在之处；“回到耶路撒冷”自然、明确。
- source_word: ᾠκοδόμησαν
  choice: 修筑了
  rationale: 原词本义为建造、修建，并未明确表示“重建”；结合防御工程的语境译作“修筑”，但不加入重复建造之意。
- source_word: πόλεις ὀχυράς
  choice: 设防的城邑
  rationale: 既保留 πόλεις 的城邑含义，也准确表达 ὀχυράς 所指的军事设防状态。
- source_word: τὸ ὀχύρωμα
  choice: 堡垒
  rationale: 指一处坚固的防御设施；“堡垒”符合军事语境，也与后列城邑有所区别。
- source_word: Ἰερειχώ
  choice: 耶利哥
  rationale: 采用现代中文圣经读者熟悉的地名形式。
- source_word: Ἐμμαούμ
  choice: 以马忤斯
  rationale: 采用现代中文中较通行、可辨识的地名形式。
- source_word: Βεθωρών
  choice: 伯和仑
  rationale: 采用中文圣经传统中较通行的地名形式。
- source_word: Βαιθήλ
  choice: 伯特利
  rationale: 采用现代中文圣经中通行的地名形式。
- source_word: Θεμανάθα Φαραθών
  choice: 特玛拿塔·法拉通
  rationale: 依所给希腊文本音译这组地名，并用间隔号表明其由两个名称成分构成；抄本及传统中的拼写差异留在脚注说明。
- source_word: Τεφών
  choice: 特丰
  rationale: 按所给希腊形式音译，不以其他传统中的异体拼写取代正文。
- source_word: ἐν τείχεσιν ὑψηλοῖς
  choice: 各处都有高墙
  rationale: 介词短语描述这些防御地点所配备的设施；如此表达比直译“在高墙中”自然，也避免误解。
- source_word: πύλαις καὶ μοχλοῖς
  choice: 城门和门闩
  rationale: πύλαις 是城门，μοχλοῖς 在设防语境中指用来闩住城门的横木或门闩。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文以原文所列各处为并列项目，并用分号引出共同的防御设施，减少长串地名造成的句法含混。英文咨询层的脚注标记位置与脚注内容不一致；本稿按脚注实际所说明的地名，将[a]置于“特玛拿塔·法拉通”之后，将[b]置于“特丰”之后。
