base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: zh_hans
  text: 犹大死后，不守律法的人[a]在以色列全境各处涌现；所有行不义[b]的人都兴起了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不法之人”。
    reason: 词义选择：ἄνομοι指违背律法、以不法为特征的人。
  - marker: b
    text: 或译：“不公”。
    reason: 词义选择：ἀδικία既可指广义的“不义”，也可指“不公、不公正”。
lexical_decisions:
- source_word: ἐγένετο
  choice: （不单独译出，以“犹大死后”引出叙事）
  rationale: 这是常见的叙事衔接语。现代汉语无需机械译作“事情发生了”，用时间从句直接转入事件更自然，也不损失实际信息。
- source_word: τελευτήν
  choice: 死
  rationale: 此处明确指犹大的死亡；“死后”比抽象的“终结之后”准确自然。
- source_word: ἐξέκυψαν
  choice: 纷纷冒了出来
  rationale: 原词带有突然显露、出现的意味；“冒了出来”保留其鲜明动态，“纷纷”在汉语中自然表达复数群体四处出现的情景。
- source_word: οἱ ἄνομοι
  choice: 不守律法的人
  rationale: ἄνομοι 指以违背律法为特征的人。“不守律法的人”保留 νόμος 的律法关联，又不额外限定性别。
- source_word: ὁρίοις
  choice: 全境各处
  rationale: 这里指以色列疆域内的各地区，并非仅指边界线；“全境各处”准确表达地理范围。
- source_word: ἀνέτειλαν
  choice: 兴起了
  rationale: 原词本可用于植物长出或日光升起，此处比喻这类人出现并得势；“兴起”既保留上升、涌现的意象，也符合庄重叙事语体。
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: 所有行不义的人
  rationale: “行不义”自然凝练，并保留 ἐργάζομαι 所表达的实际作为及 ἀδικία 的道德分量。
theological_decisions:
- issue: 如何表达 ἄνομοι 的律法及道德含义
  choice: 不守律法的人
  alternative: 无法无天的人；恶人
  rationale: “不守律法”保留原词与“律法”的直接联系，避免用泛称“恶人”抹平可能具有的盟约语境，也避免“无法无天”过度强化社会治安色彩。
- issue: 如何表达 ἀδικία 的广义道德含义
  choice: 不义
  alternative: 不公；恶事
  rationale: “不义”可以涵盖广义的邪恶和不正，不把原文限定为司法或社会层面的“不公”；脚注保留后者的可能性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。分号呈现希腊文两个并列分句；“冒了出来”与“兴起了”保留两个不同动词的动态意象。所有脚注标记均置于其所解释的词语之后。
