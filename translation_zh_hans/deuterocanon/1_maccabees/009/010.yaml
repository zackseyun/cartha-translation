base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: zh_hans
  text: 犹大说：“我断不能做这种事——从他们面前逃跑。我们的时刻已经临近；让我们为了弟兄们勇敢赴死[a]，也不要留下使我们的荣誉[b]受人责难的把柄。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇敢赴死”也可译作“奋勇而死”；原文所用表达强调勇气和英武。
    reason: lexical_alternative
  - marker: b
    text: “荣誉”也可理解为“名声”或“声誉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: 我断不能
  rationale: 这是表达强烈拒绝的希腊语愿望式惯用语；译为“我断不能”既保留第一人称的坚决态度，也符合现代汉语表达。
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο
  choice: 做这种事
  rationale: 保留πρᾶγμα所指的“事”，同时避免生硬的逐字翻译。
- source_word: φυγεῖν ἀπʼ αὐτῶν
  choice: 从他们面前逃跑
  rationale: 直接表达φυγεῖν的逃离之意；“从他们面前”在战场语境中自然体现ἀπʼ αὐτῶν。
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: 我们的时刻已经临近
  rationale: καιρός可指关键或注定的时刻；此处不明说“死期”，以保留原文庄严而含蓄的表达。原文为直陈语气，没有表示“如果”的词，因此不增译条件。
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: 让我们……勇敢赴死
  rationale: ἀνδρίᾳ表示勇气、英勇；“勇敢赴死”比“像男子一样死去”更符合现代汉语，同时传达其尚武语境。
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: 为了弟兄们
  rationale: χάριν加属格表示“为了……的缘故”；ἀδελφῶν为阳性复数，在军事及同族语境中译作“弟兄们”。
- source_word: μὴ καταλίπωμεν αἰτίαν
  choice: 不要留下……受人责难的把柄
  rationale: αἰτία可指缘由、指控或可供责难的根据；“留下把柄”自然传达不为后人提供责难依据的含义。
- source_word: τῇ δόξῃ ἡμῶν
  choice: 使我们的荣誉……
  rationale: δόξα在此荣辱语境中主要指荣誉或名声，而非神学意义上的荣耀；该译法与αἰτία结合后在汉语中清楚自然。
theological_decisions:
- issue: ἀδελφῶν的阳性亲属称谓
  choice: 弟兄们
  alternative: 同胞；弟兄姊妹
  rationale: 原词是明确的阳性复数，且上下文是男性战士的军事场景；保留“弟兄们”不将其无根据地扩展为男女混合称呼。
- issue: δόξα在荣辱语境中的含义
  choice: 荣誉
  alternative: 荣耀；名声
  rationale: 此处谈的是战败或逃跑可能招致的责难，“荣誉”最贴合语境；脚注保留“名声”等可能理解，避免把词义限定得过窄。
- issue: ἤγγικεν ὁ καιρὸς ἡμῶν是否为条件句
  choice: 我们的时刻已经临近
  alternative: 如果我们的时刻已经临近
  rationale: 所给希腊文本没有条件连词，ἤγγικεν也是直陈语气；因此按原文译为陈述句，同时不把“时刻”明确解释成“死期”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留战前讲话的坚决和凝练。“我断不能”体现强烈拒绝；破折号说明所拒绝之事就是逃跑。分号连接时刻临近与勇敢赴死，使语势紧凑。
