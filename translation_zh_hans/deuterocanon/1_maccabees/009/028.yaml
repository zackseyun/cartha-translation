lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: 聚集起来
  rationale: 该词为ἀθροίζω的简单过去时被动形式，此处具有不及物或中动态意味；“聚集起来”自然地表达众人集合的动作。
- source_word: πάντες
  choice: 全都
  rationale: 保留πάντες的整体性强调，并使现代汉语语序自然。
- source_word: οἱ φίλοι
  choice: 朋友
  rationale: φίλοι的基本义是“朋友”；虽可能含同伴或支持者的意味，但此处不宜将潜在政治色彩明确化。
- source_word: Ἰούδου
  choice: 犹大的
  rationale: 属格修饰“朋友”，表达与犹大的归属或关联关系。
- source_word: εἶπον
  choice: 说
  rationale: 叙事中λέγω的常规译法，简洁自然。
- source_word: τῷ Ἰωναθάν
  choice: 对约拿单
  rationale: 与格作间接宾语；现代汉语用“对……说”表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留“朋友”这一宽泛关系称谓，不将其收窄为“支持者”或“盟友”。句末用冒号，因为原文以“说”引出下一节的直接话语。
