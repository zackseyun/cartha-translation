lexical_decisions:
- source_word: ἐσείσθη
  choice: 震动
  rationale: 保留被动语义，直接表达大地因两军阵营而震动。
- source_word: παρεμβολῶν
  choice: 军营
  rationale: 该词可指军营、营阵或军队；复数形式及上下文指交战双方的营阵，译作“军营”自然且不额外限定。
- source_word: ὁ πόλεμος συνηγμένος
  choice: 战斗……激烈地持续
  rationale: 原文表达战事已经会合、接战并持续进行；按现代汉语习惯译出鏖战不止的语境，同时避免生硬直译为“战争被聚集”。
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: 从早晨一直……到晚上
  rationale: 准确保留时间跨度，并用“一直”体现持续性。
