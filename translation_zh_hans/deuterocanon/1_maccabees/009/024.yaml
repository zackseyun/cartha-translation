  text: 那些日子，发生了极其严重的饥荒；全境也跟他们一起倒戈了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全境也投到他们一边了。”希腊文动词表示脱离原来一方、转投另一方。
