lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些日子
  rationale: 保留希腊文常见的叙事时间表达，简洁自然。
- source_word: ἐγενήθη
  choice: 发生了
  rationale: 表达事件的出现或发生，不额外说明成因。
- source_word: λιμὸς μεγάλη σφόδρα
  choice: 极其严重的饥荒
  rationale: λιμός意为“饥荒”，μεγάλη与σφόδρα共同加强程度；“极其严重”在现代汉语中自然地传达强烈语气。
- source_word: ἡ χώρα
  choice: 全境
  rationale: χώρα可指土地、地区或其中居民；“全境”保留地域整体的转喻表达，避免把它误解为现代民族国家。
- source_word: αὐτομόλησεν
  choice: 倒戈了
  rationale: 该动词表示脱离原属一方、转投另一方；“倒戈”适合这里的政治军事语境。
- source_word: μετʼ αὐτῶν
  choice: 跟他们一起
  rationale: μετά接属格的基本含义是“与……一起”；此译保留同行或共同阵营的含混性，不擅自明确为投向“他们”。
