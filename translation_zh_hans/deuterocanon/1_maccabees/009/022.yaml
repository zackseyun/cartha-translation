base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: zh_hans
  text: 至于有关犹大的其余记载，以及他的战争、他所行的英勇壮举和他的伟大，都没有记载下来，因为实在太多了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων Ἰούδα
  choice: 犹大的其他事迹
  rationale: τὰ περισσὰ 表示前文之外其余的内容；λόγοι 在史书总结语中可指有关某人的记述或事迹。译作“其他事迹”自然简明，也与后列内容衔接。
- source_word: τῶν πολέμων
  choice: 他的战争
  rationale: πολέμων 泛指犹大参与的军事冲突；“战争”比“战役”范围更广，贴近原词。
- source_word: τῶν ἀνδραγαθιῶν ὧν ἐποίησεν
  choice: 他所行的英勇壮举
  rationale: ἀνδραγαθία 指体现勇武与卓越的行动。“英勇壮举”保留褒扬意味，同时避免按字面译成现代汉语中可能造成性别误解的表达。
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: 他的伟大
  rationale: μεγαλωσύνη 在此指犹大的伟大、卓越地位或声望，并不必然具有专指君王威严的技术含义，故保留较宽泛的“伟大”。
- source_word: οὐ κατεγράφη
  choice: 都没有记载下来
  rationale: καταγράφω 在被动式中表示写下、登记或载入记录；“记载下来”符合史书语境。
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: 因为实在太多了
  rationale: σφόδρα 强化数量之多；汉语“实在太多了”自然表达其解释意味，并暗示多到未能尽录，而不额外增添原文没有明说的原因。
