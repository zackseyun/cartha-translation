lexical_decisions:
- source_word: ἔγνω
  choice: 得知此事
  rationale: 不定过去时在这里表示获知或察知某事；中文补出“此事”，自然承接上文，而不把它误解为单纯“知道”。
- source_word: ἐζήτει
  choice: 设法要
  rationale: 未完成过去时表示持续或尝试中的行动；“设法要”既传达谋求、尝试之意，也避免暗示行动已经成功。
- source_word: ἀποκτεῖναι
  choice: 杀死
  rationale: 直接表达使人死亡，不额外引入正式处决的含义。
- source_word: Βακχίδης
  choice: 巴基德
  rationale: 采用现代中文圣经传统中常见的人名音译，清楚简洁。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词，所指人物由上文确定；中文直译为“他”。
