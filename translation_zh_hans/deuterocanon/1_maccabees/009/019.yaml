  source_fidelity: 主要意思准确：并列主语、犹大为二人的兄弟、安葬及家族墓地均已表达。μως，“抬走了”在现代汉语中通常带有“从某处移走、带离”的语感，较原文在遗体安葬语境中单纯“抬/携带”的意思略强。
  naturalness: 原句“在摩得因他祖先的坟墓里”虽可勉强理解，但地点短语直接置于领属结构之前不够自然，容易造成瞬间歧解。改为“他祖先位于摩得因的坟墓里”更合现代汉语语序，也清楚交代墓地所在地。
  terminology: “约拿单”“西门”“犹大”“摩得因”音译一致；“祖先”“坟墓”“安葬”均恰当且保持庄重叙事语体。
