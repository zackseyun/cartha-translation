  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: zh_hans
  text: 约拿单和西门抬着他们的兄弟犹大，把他安葬在他祖先位于摩得因的坟墓里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν
  choice: 抬走了
  rationale: αἴρω在安葬的叙事语境中指抬起并运走遗体；“抬走”自然传达这一具体动作，又不增添原文未明说的细节。
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: 约拿单和西门
  rationale: 人名按通行的现代中文圣经译名音译。
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: 他们的兄弟犹大
  rationale: αὐτοῦ形式上是单数，但并列主语约拿单和西门表明犹大是二人的兄弟；中文用“他们的”可避免误解，同时保留亲属关系。
- source_word: ἔθαψαν
  choice: 安葬
  rationale: θάπτω在此表示埋葬死者；“安葬”庄重、自然，也不把动词本身过度具体化为“入墓”。
- source_word: ἐν τῷ τάφῳ
  choice: 在……坟墓里
  rationale: τάφος可指坟墓或墓穴；此处是家族安葬之所，“坟墓”清楚自然，并与处所介词结构相合。
- source_word: τῶν πατέρων αὐτοῦ
  choice: 他祖先的
  rationale: πατέρων为复数，在家族墓地语境中泛指先祖；现代汉语用“祖先”比直译“父辈”更准确自然。
- source_word: ἐν Μωδεείμ
  choice: 在摩得因
  rationale: 按希腊文地名Μωδεείμ音译；ἐν可表示地点，“在摩得因”直接保留原文的处所关系。
