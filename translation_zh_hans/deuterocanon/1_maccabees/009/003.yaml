lexical_decisions:
- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: 正月
  rationale: 该属格短语作时间状语，指该年的第一个月；“正月”是现代汉语中自然、简洁且庄重的表达。
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: 一百五十二年
  rationale: 希腊文以相加次序表达年份数值，译为汉语惯用的“一百五十二年”，不额外补入原文未明说的纪年体系。
- source_word: παρενέβαλον
  choice: 他们进驻
  rationale: 该动词在军事语境中表示扎营、安营；与 εἰς 连用时兼有向某地移动并在那里设营之意。“进驻”自然保留军事行动和抵达后的驻扎含义。
- source_word: εἰς Ἱερουσαλήμ
  choice: 耶路撒冷
  rationale: εἰς 通常带有进入或趋向之意；配合“进驻”即可自然表达“进入耶路撒冷并驻扎”，又不擅自译成带敌对意味的“攻打”。
