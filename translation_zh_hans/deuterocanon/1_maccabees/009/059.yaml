  text: And after they went, they took counsel with him[a].
translation:
  language: zh_hans
  text: 他们去了以后，就同他商议[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“他们去了，就同他商议。”
    reason: 说明原文分词结构及其简洁的叙事表达。
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推进叙事；与“以后”搭配，自然表达动作先后，而不增加因果含义。
- source_word: πορευθέντες
  choice: 去了以后
  rationale: 这是不定过去时分词，通常表示先于主要动词发生的动作；此译保留“先去、后商议”的时间关系。
- source_word: συνεβουλεύσαντο
  choice: 商议
  rationale: 该中间语态动词表示参与共同谋议或磋商；“商议”既自然，又保留共同讨论的意味。
- source_word: αὐτῷ
  choice: 同他
  rationale: 与该动词连用的与格可指共同商议的对象；“同他”在现代汉语中清楚表达这一关系。
