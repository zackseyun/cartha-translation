  text: And the right wing was crushed before them[b][a], and he pursued after them as far as the mountain of Azotus.
translation:
  language: zh_hans
  text: 他们的右翼被对方击溃；他追赶他们，直到亚锁都的山地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到亚锁都山。”希腊文可指一座特定的山，也可指亚锁都一带的山地。
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: 被击溃了
  rationale: 该被动词本义为“被打碎、被粉碎”；用于战斗语境时表示遭到决定性挫败。“被击溃”在现代汉语中自然，并保留强烈的军事败退意味。
- source_word: τὸ δεξιὸν κέρας
  choice: 右翼
  rationale: κέρας直译为“角”，在军阵中比喻一侧翼部。中文军事用语“右翼”准确而自然；直译“右角”容易令人误解。
- source_word: ἀπʼ αὐτῶν
  choice: （由“被击溃”及上下文体现）
  rationale: ἀπό在此可表示因对方进逼而败退。中文“他们的右翼被击溃了”已自然表达敌军右翼遭挫；若硬译为“从他们面前”会显得生硬，并可能误指方向。
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: 他就在他们后面追赶
  rationale: 该表达在语境中指追赶败退之敌。保留单数“他”以对应希腊文动词，既可指犹大本人，也可按领袖代表部队理解；“在他们后面追赶”也保留了ὀπίσω的空间意象。
- source_word: ἕως Ἀζώτου ὄρους
  choice: 直到亚锁都的山地
  rationale: 希腊文结构可指一座与亚锁都相关的山，也可指其山地或高地。“亚锁都的山地”避免武断地把它定为专名山峰，并符合自然中文地理表达。
