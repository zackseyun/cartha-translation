  yaml_path: translation/deuterocanon/1_maccabees/009/061.yaml
  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: zh_hans
  text: 他们从当地人中捉拿了五十名作恶的首领[a]，他把他们杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“恶的首领”；可指邪恶或恶行的首领，也可指带头作恶的人。
    reason: 词义存在可合理保留的不同理解。
lexical_decisions:
- source_word: συνέλαβον
  choice: 捉拿了
  rationale: 表示抓住并控制这些人；“捉拿”直接自然，又不必然赋予正式司法程序的含义。
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: 从当地人中
  rationale: ἀπό表示从较大群体中选取，χώρα指当地、地区或乡土；此译在现代汉语中自然，并保留“从……中”的关系。
- source_word: τῶν ἀρχηγῶν
  choice: 首领
  rationale: ἀρχηγός在这里指居于带头地位的人；“首领”保留其领导身份，不额外加入“罪魁”等解释。
- source_word: τῆς κακίας
  choice: 作恶的
  rationale: κακία可指邪恶、恶行或恶意。结合属格结构译为“作恶的首领”较自然，但原文也可能意指恶事的带头者或主要作恶者，故加注说明。
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: 五十个
  rationale: 该短语表示人数达到五十；汉语直接说“五十个”即可准确传达确数。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 动词基本义为杀死；“杀了”不额外引入司法处决的含义。
theological_decisions:
- issue: 末句主语由复数转为单数
  choice: 保留单数：“他把他们杀了”
  alternative: 顺译为复数：“他们把这些人杀了”
  rationale: 希腊文先用复数 συνέλαβον（他们捉拿），后用单数 ἀπέκτεινεν（他杀了）。译文保留这一明确的数变化，不擅自协调；“他”在上下文中或指主要领袖，但本节不明说其身份。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“当地人”比“这地的男人”自然；末句刻意保留原文从“他们”到“他”的主语转换。
