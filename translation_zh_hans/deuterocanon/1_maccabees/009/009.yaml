base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/009.yaml
  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: zh_hans
  text: 他们却劝阻他[a]，说：“我们绝不能这样做。不如眼下先保全自己的性命[b]；让我们回去，同弟兄们一起与他们交战吧。只是我们人太少。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝阻他”也可按字面译作“使他转回”或“使他回心转意”；结合上下文，是指他们反对他的主张。
    reason: lexical_alternative
  - marker: b
    text: “性命”直译为“灵魂”；在这里是身处危险时保全生命的常见说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: 他们却转身离开他
  rationale: 该短语可表示实际转身离开，也可在语境中表达拒绝他的主张；正文保留动作和关系层面的含混，脚注说明另一可能。
- source_word: Οὐ μὴ δυνώμεθα
  choice: 我们绝对抵挡不了
  rationale: οὐ μή构成强烈否定；结合战斗语境，“绝对抵挡不了”比泛指的“不能做到”更自然明确。
- source_word: σώσωμεν τὰς ἑαυτῶν ψυχὰς
  choice: 先保住自己的性命
  rationale: ψυχαί在当前军事危境中指人的性命，并非专指神学意义上的灵魂。
- source_word: τὸ νῦν
  choice: 现在先
  rationale: 表达眼前暂时采取的保命行动，现代汉语中简洁自然。
- source_word: ἐπιστρέψωμεν μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: 等我们和弟兄们会合，再来
  rationale: μετά加属格本义为“与……一起”；结合撤离后再战的语境，以“和弟兄们会合”自然表达返回并同他们一起行动，但不将“弟兄”中性化。
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: 与他们交战
  rationale: 准确表达针对敌方进行武装战斗，语体庄重而自然。
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: 可是我们人数太少
  rationale: 保留δέ的转折语气，并补出汉语所需的“人数”；“太少”传达此句作为无法当下作战之理由的实际分量。
theological_decisions:
- issue: 战斗语境中ψυχὰς的译法
  choice: 性命
  alternative: 灵魂
  rationale: 此处谈的是在战场上存活，译作“性命”可避免加入原文并未要求的灵魂论含义。
- issue: ἀδελφῶν的译法
  choice: 弟兄们
  alternative: 同胞／同伴
  rationale: 原词为阳性复数，语境可能指战友或犹太同胞；保留“弟兄们”既贴近原文，也不把其范围限定为血缘兄弟。
- issue: 末句δέ的关系
  choice: 可是
  alternative: 因为
  rationale: 虽然“人数少”在逻辑上说明撤退理由，但原文使用δέ而非明确因果连词；译作“可是”保留其转折张力，不把关系解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。用“抵挡不了”“会合”“交战”体现军事处境；保留“弟兄们”和末句的转折，不引入特定宗派解释。
