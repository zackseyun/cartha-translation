  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: zh_hans
  text: 约拿单和与他同行的人跳进约旦河，游到对岸；追兵却没有渡过约旦河追赶他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“渡过约旦河去攻击他们”。希腊原文末句表达简略，指追兵渡河朝约拿单一行人而去，并可带有敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: 跳进
  rationale: 该动词表示突然跃入；“跳进”自然简洁，也保留动作的急迫感。
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: 跟随他的人
  rationale: 原文泛指与约拿单同行的人，并未明确限定身份；此译法自然且不增添“士兵”等信息。
- source_word: διεκολύμβησαν
  choice: 游到了对岸
  rationale: 该复合动词明确表示以游泳方式渡过；结合 εἰς τὸ πέραν，译为“游到了对岸”准确而流畅。
- source_word: εἰς τὸ πέραν
  choice: 到了对岸
  rationale: 此短语指抵达河的另一边；“对岸”符合现代汉语习惯。
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: 追兵却没有渡过约旦河来追击他们
  rationale: 根据上文，省略的主语是追赶约拿单一行的人；ἐπ᾿ αὐτούς 表示朝他们而去，并带敌对意味。“来追击他们”在语境中自然，但其具体含义仍可能是“追赶”或“攻击”，故加脚注说明。
- source_word: Ἰορδάνην
  choice: 约旦河
  rationale: 现代汉语通常将该地名译作“约旦河”；虽原文仅用专名，补出“河”能清楚表明所指水域。
