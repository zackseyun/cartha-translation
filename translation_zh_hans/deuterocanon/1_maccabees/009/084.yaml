lexical_decisions:
- source_word: ἔλαβεν
  choice: 夺取了
  rationale: 在战争叙事中自然表达 λαμβάνω 的简单过去时意义，也与随后提到的战利品相配。
- source_word: τὰ σκῦλα αὐτῶν
  choice: 他们的战利品
  rationale: σκῦλα 指战争中从敌方夺得的物品；“战利品”准确而符合现代汉语。
- source_word: τὸ ἱερὸν Δαγὼν
  choice: 大衮的神庙
  rationale: ἱερόν 在此指异教神祇大衮的庙宇或圣所；“神庙”清楚表明其性质。
- source_word: τὸ ἱερὸν αὐτῆς
  choice: 她的神庙
  rationale: 保留希腊文阴性代词 αὐτῆς，不擅自确定残缺上文中的所指；脚注说明它很可能回指阴性名词“城”。
- source_word: ἐνεπύρισεν ἐν πυρί
  choice: 放火焚烧了
  rationale: 以自然现代汉语表达动词与“用火”短语所形成的强调，避免生硬重复“用火烧”。
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: 那些倒在刀剑下的人
  rationale: “倒在刀剑下”保留 πεπτωκότες 的完成状态及 μαχαίρᾳ 的战争语境；原文在此处断裂，故不补出谓语。
