base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/029.yaml
  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: zh_hans
  text: “自从你哥哥犹大去世以后，就再没有像他那样的人，能出战对抗仇敌、巴基德，以及那些仇恨我们民族的人[a]；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本此处直译为“以及在那些仇恨我们民族的人中”，与上文的句法衔接不顺。正文按语境将他们理解为另一个需要对抗的敌对群体。
    reason: 保留传世希腊文本中介词ἐν所造成的句法困难及另一种直译可能。
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: 自从……以后
  rationale: 兼顾时间起点及其延续至今的意味，符合后接完成时所表达的现时后果。
- source_word: ὁ ἀδελφός σου Ἰούδας
  choice: 你哥哥犹大
  rationale: ἀδελφός意为兄弟；结合人物关系，犹大是受话者的兄长，现代汉语用“哥哥”自然明确。
- source_word: τετελεύτηκεν
  choice: 去世
  rationale: 表达死亡这一已完成且后果仍在的事实；语体庄重而不晦涩。
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: 像他那样的人
  rationale: 保留对犹大个人能力与地位的比较；汉语无需生硬译作“男人”，上下文已明确所指。
- source_word: ἐξελθεῖν πρὸς τοὺς ἐχθρούς
  choice: 出战对抗仇敌
  rationale: ἐξελθεῖν本义为“出去”，在军事语境中指挥军出战；πρός在此表示敌对方向。
- source_word: Βακχίδην
  choice: 巴基德
  rationale: 按希腊语人名音译，并采用现代汉语中《马加比一书》人物的常见译形。
- source_word: τοῦ ἔθνους ἡμῶν
  choice: 我们民族
  rationale: ἔθνος在此指犹太民族这一兼具族群和政治共同体性质的集体；“民族”比“国家”或泛称“人民”更贴近原词。
- source_word: καὶ ἐν τοῖς ἐχθαίνουσιν
  choice: 以及那些仇恨……的人
  rationale: 传世文本的ἐν（“在……中”）与前文结构衔接生硬；正文依语境将该群体理解为另一个敌对对象，同时以脚注保留原文措辞的不确定性。
theological_decisions:
- issue: ἀνήρ是否必须显性译为男性用语
  choice: 像他那样的人
  alternative: 像他那样的男子
  rationale: 原文使用阳性名词ἀνήρ，但这里指可接替犹大出战的人。汉语“人”并不否定其男性身份，且比“男子”更自然，不将该处扩展为关于性别资格的教义陈述。
- issue: ἔθνος ἡμῶν所指共同体的性质
  choice: 我们民族
  alternative: 我们的人民
  rationale: 本书语境中的ἔθνος指犹太民族这一政治—宗教共同体；“民族”保留其集体身份，又不额外引入现代民族国家概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“出战对抗”明确军事语境；句末分号保留本节在语法和话语上尚未结束、将接续下文的特点。
