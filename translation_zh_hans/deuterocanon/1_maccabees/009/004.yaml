lexical_decisions:
- source_word: ἀπῆραν καὶ ἐπορεύθησαν
  choice: 拔营出发
  rationale: 两个动词连用，表示动身并前往；“拔营出发”符合军事叙事语境，同时保留行程开始的动态。
- source_word: εἰς Βερέαν
  choice: 前往比利亚
  rationale: εἰς表示朝向某地；Βερέαν按本书地名译作“比利亚”。
- source_word: ἐν εἴκοσι χιλιάσιν ἀνδρῶν
  choice: 带着两万名士兵
  rationale: 此处ἐν引出随行兵力；ἄνδρες字面为“人”，在军事语境中指士兵。
- source_word: δισχιλίοις ἵπποις
  choice: 两千匹战马
  rationale: ἵπποις字面是“马”，原文并未明说骑兵；正文保留这一具体意象，并以“战马”表明军事语境。
