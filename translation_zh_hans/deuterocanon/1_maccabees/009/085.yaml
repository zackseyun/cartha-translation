  text: together with those burned[a], to eight thousand men. And he departed
translation:
  language: zh_hans
  text: 连同那些遭焚烧的人[a]在内，共有八千名男子。随后，他离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存的希腊文在语意上是残缺的，只保留“连同那些遭焚烧的人在内，共有八千名男子。随后，他离去了”这一片段。本译文紧随现存措辞，不补构缺失的上下文。
    reason: textual_variant
lexical_decisions:
- source_word: σὺν
  choice: 连同
  rationale: 表示把这一群体计入前文所述的人数；“连同”自然体现附加关系。
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: 那些被烧死的
  rationale: 忠实表达ἐμπυρίζω不定过去时被动分词所指遭焚烧的人；不译作“被活活烧死”，以免增添原文未明说的细节。
- source_word: εἰς
  choice: 总计
  rationale: 此处引出合计所得的数目；现代汉语用“总计”比逐字译作“到”更清楚自然。
- source_word: ἄνδρας
  choice: 人
  rationale: 在汉语计数表达“八千人”中，“人”自然且不抹去上下文所指人员；译作“男人”会显得生硬，并可能过度突出性别。
- source_word: ὀκτακισχιλίους
  choice: 八千
  rationale: 直接对应原文基数词。
- source_word: ἀπῆρεν
  choice: 他离去了
  rationale: 表达叙事中过去发生的离开行动，同时保持庄重、清楚的语体。
