  yaml_path: translation/deuterocanon/1_maccabees/009/052.yaml
  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: zh_hans
  text: 他们加固了那城、伯夙拉、迦撒拉[a]和卫城[b]，并在其中驻扎军队，储存粮食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦撒拉”依希腊文名称音译；此地通常被认定为“基色”。
    reason: cross_reference
  - marker: b
    text: “卫城”所译的希腊文也可作为专名“阿克拉堡”，指耶路撒冷的一个设防据点。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: 加固
  rationale: 该动词指加强防御、使地点坚固；“加固”自然简洁，并适用于城邑和堡垒。
- source_word: τὴν πόλιν
  choice: 那城
  rationale: πόλις意为“城”；定冠词表明是上下文所指的特定城，因此译作“那城”。
- source_word: Βεθοσούραν
  choice: 伯夙
  rationale: 按《马加比一书》中该地名的通行中文形式音译，对应伯特夙尔（Beth-zur）。
- source_word: Γάζαρα
  choice: 迦撒拉
  rationale: 依希腊文Γάζαρα的形式音译，不在正文中直接改用其常见希伯来名称“基色”。
- source_word: τὴν ἄκραν
  choice: 堡垒
  rationale: ἄκρα可指设于高处的坚固据点或城堡；此处也可能特指耶路撒冷的阿克拉堡，正文用普通名词保留其基本意义。
- source_word: ἔθεντο
  choice: 驻扎
  rationale: 该词本义为“安置”；与军队连用时，“驻扎”最符合军事语境。
- source_word: δυνάμεις
  choice: 军队
  rationale: δυνάμεις在此指武装力量或部队；“军队”清楚自然，而不把它进一步限定为“守军”。
- source_word: παραθέσεις βρωμάτων
  choice: 储备粮食
  rationale: παραθέσεις含放置、贮存之意，βρωμάτων指食物；“储备粮食”准确表达在设防地点存放给养的行动。
