  yaml_path: translation/deuterocanon/1_maccabees/009/002.yaml
  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: zh_hans
  text: 他们沿着通往迦勒迦拉[a]的路前行，在亚贝拉的米撒洛对面扎营，攻占了那里[b]，杀了许多人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒迦拉”是希腊文地名Γάλγαλα的音译；其具体地点未能确定。
    reason: geographical_uncertainty
  - marker: b
    text: “攻占”所译的希腊动词较罕见且含义不易确定；也可理解为“抢先占据”或较笼统地说“占领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν ὁδὸν τὴν εἰς Γάλγαλα
  choice: 取道前往迦勒迦拉
  rationale: ὁδόν与行进动词构成取某路线的表达；“取道前往”既保留具体路线感，也符合军事行军语境。
- source_word: παρενέβαλον ἐπὶ
  choice: 在……对面扎营
  rationale: παρεμβάλλω在军事语境中指扎营；ἐπί在此带有针对该地部署的意味。“对面”保留敌对逼近之意，又不把文本过度解释为正式围城。
- source_word: Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: 在亚贝拉的米撒洛
  rationale: 介词短语用于限定米撒洛的位置或归属；采用简洁、自然的中文地名结构。
- source_word: προκατελίβοντο
  choice: 攻占了那城
  rationale: 该罕见复合动词含抢先占据、夺取之意；上下文是敌军扎营进攻，译作“攻占”自然且保留夺取城邑的核心意义，其前置或抢先色彩在脚注中说明。
- source_word: ἀπώλεσεν ψυχὰς ἀνθρώπων πολλὰς
  choice: 杀了许多人
  rationale: 原文直译近于“毁灭许多人的性命”，是表示杀死许多人的惯用说法；中文直译“毁灭性命”不自然，故按实际语义表达。
