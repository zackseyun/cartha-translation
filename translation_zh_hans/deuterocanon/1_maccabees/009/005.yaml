  text: And Judas was encamped at Alasa, and three thousand chosen men were with him.
translation:
  language: zh_hans
  text: 犹大驻扎在阿拉撒，三千名精选的人与他在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: 驻扎
  rationale: 这是παρεμβάλλω的完成时分词，在军事语境中表示已经安营并处于驻守状态；“驻扎”自然简洁，也保留其状态意味。
- source_word: ἐν Ἀλασά
  choice: 在阿拉撒
  rationale: 介词ἐν表示地点；“阿拉撒”按希腊文音译，避免把专名意译。
- source_word: τρισχίλιοι
  choice: 三千名
  rationale: 准确表达基数词，并以量词“名”修饰人员。
- source_word: ἄνδρες
  choice: 人（体现于“精兵”）
  rationale: ἄνδρες本义为成年男子；本节军事语境明确指随同犹大的战斗人员，因此汉语用“兵”自然，但不额外引入军阶或编制。
- source_word: ἐκλεκτοὶ
  choice: 精
  rationale: ἐκλεκτοί指经过挑选或出众的人；“精兵”是现代汉语中自然庄重的军事表达，兼具“选拔出来”与“精锐”的语义。
- source_word: μετʼ αὐτοῦ
  choice: 和他在一起
  rationale: 直接表达随同、同在之意，不增添“跟随作战”等原文未明说的含义。
