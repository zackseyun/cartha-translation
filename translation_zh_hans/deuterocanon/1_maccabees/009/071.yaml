  yaml_path: translation/deuterocanon/1_maccabees/009/071.yaml
  text: And he accepted[a], and did according to his words, and swore to him not to seek harm against him all the days of his life.
translation:
  language: zh_hans
  text: 他接受了，照他所说的做了，并向他起誓：在他一生的日子里，不图谋加害他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他一生所有的日子里，不寻求加害于他。”
    reason: 保留原文“寻求恶事／加害”以及“一生所有日子”的较直译表达。
lexical_decisions:
- source_word: ἀπεδέξατο
  choice: 接受了
  rationale: 此处中间语态表示接受前文所提的条件或建议；“接受了”简洁自然，也比“收下了”更符合语境。
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: 照他所说的做了
  rationale: 准确表达按对方的话行事；比逐字译作“按照他的话做了”更符合现代汉语，同时保留原文关系。
- source_word: ὤμοσεν αὐτῷ
  choice: 向他起誓
  rationale: “起誓”保留了行为的郑重性，“向他”明确誓言所针对的对象。
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: 绝不谋害他
  rationale: ἐκζητέω与κακόν连用，在此指蓄意寻求加害或图谋不利；“谋害”自然凝练，并传达敌意与主动意图。“绝不”在汉语中体现誓言所辖否定的强度。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: 终其一生
  rationale: 这是自然、庄重的现代汉语表达，完整传达“一生所有日子”的持续范围。
