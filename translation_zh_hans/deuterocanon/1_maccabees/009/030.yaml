  yaml_path: translation/deuterocanon/1_maccabees/009/030.yaml
  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: zh_hans
  text: 因此，今天我们选定你接替他，作我们的首领和领袖，去打我们的仗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: 我们选定
  rationale: 该中间语态不定过去时表示为某一职分选择某人；“选定”既自然，也能体现决定已作出，而不把过程限定为正式选举。
- source_word: ἀντʼ αὐτοῦ
  choice: 接替他
  rationale: 该短语表示取代前任、承接其位置；“接替他”符合现代汉语表达，并保留职分承继的含义。
- source_word: ἄρχοντα
  choice: 统领
  rationale: ἄρχων泛指掌权、治理的人；在此军事与群体领导语境中，“统领”兼有权柄和治理意味，又不将其限定为后世的技术性官职。
- source_word: ἡγούμενον
  choice: 领袖
  rationale: 该词指带领众人的人；“领袖”与“统领”相配，保留原文两个并列称谓，不将二者合并。
- source_word: τοῦ πολεμῆσαι
  choice: 带领我们争战
  rationale: 带冠词不定式表达目的。单就词面是“争战”；汉语补出“带领”，自然承接前面的领导职分，也说明其受选目的。
- source_word: τὸν πόλεμον ἡμῶν
  choice: 我们争战
  rationale: πόλεμος指战争或战事，而非单次战斗；这里采用动词化表达，使现代汉语自然，并保留这是该群体所承担之战的含义。
theological_decisions:
- issue: 如何翻译并列称谓 ἄρχοντα καὶ ἡγούμενον
  choice: 统领和领袖
  alternative: 首领和统帅；统治者和领导者
  rationale: 原文以两个近义而不完全相同的称谓并列，前者偏重权柄与治理，后者偏重实际带领。译文分别保留二者，同时避免导入后世固定政治或教会职衔。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文推论；保留“今天”以对应 σήμερον。“作我们的统领和领袖”维持公开推举与群体关系的语气。末句将希腊语目的结构译为“带领我们争战”，比直译“去打我们的战争”更符合现代汉语，同时不限定具体战役。
