  text: Now then[a], cry out to heaven, so that you may be delivered from the hand of our enemies.
translation:
  language: zh_hans
  text: 所以，现在你们要向天呼求[a]，好使你们从我们仇敌的手中获救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向上帝呼求”。希腊文直译为“向天呼求”；这里的“天”可能是对神圣领域或上帝的敬畏性委婉代称。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: 现在
  rationale: 该短语兼有时间和承接、推论意味；在此紧迫号召中，“现在”自然简洁，上下文可传达“所以现在”的推进作用。
- source_word: κεκράξατε
  choice: 要……呼求
  rationale: κράζω的命令式在这里指迫切而强烈地求告，并非单纯大声喊叫；“呼求”符合向神圣对象求助的语境。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 直译保留原文“天”的措辞及其可能作为对上帝敬称性转喻的含蓄表达，不在正文中将其明确解释为“上帝”。
- source_word: ὅπως
  choice: 好使
  rationale: 表达目的或预期结果，保留原文从句的目的意味。
- source_word: διασωθῆτε
  choice: 获救
  rationale: διασῴζω的被动虚拟式在军事险境中表示被搭救、脱离危险；“获救”简明自然，同时由后接的仇敌语境限定其现实性救援含义。
- source_word: ἐκ χειρὸς
  choice: 从……手中
  rationale: 保留表示权势、控制或掌握的圣经惯用语，在现代汉语中也清楚自然。
- source_word: ἐχθρῶν ἡμῶν
  choice: 我们仇敌
  rationale: 准确保留第一人称复数所属关系；“仇敌”较“敌人”更贴近庄重的经文语体。
theological_decisions:
- issue: 应直译“天”，还是明确译作“上帝”
  choice: 向天
  alternative: 向上帝；向天上的主
  rationale: 希腊文明确写作“天”，很可能以敬称性转喻指上帝或神圣领域，但没有直接说“上帝”。正文保留原文措辞和神学含蓄，脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向天呼求”保留原文意象和敬称性含蓄；“从我们仇敌的手中获救”保留圣经惯用表达，同时语义清楚。
