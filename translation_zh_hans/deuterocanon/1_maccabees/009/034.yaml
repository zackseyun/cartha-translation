  yaml_path: translation/deuterocanon/1_maccabees/009/034.yaml
  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: zh_hans
  text: 巴基德在安息日得知了这事[a]；他本人和他的全军都来到约旦河对岸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明说“这事”，是按上下文补出的。
    reason: implicit_object
  - marker: b
    text: 或译“越过约旦河”。这里的希腊语既可指河对岸的地区，也可表示移到河的另一边。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: 得知了这事
  rationale: 不定过去时在此表示获得消息；希腊文宾语省略，中文依上下文补出“这事”，使语意自然完整。
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 在安息日
  rationale: 字面为“在安息日的日子”，复数 σαββάτων 是指单数安息日的惯用表达；中文简洁译作“在安息日”。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 保留强调代词的语气，表明巴基德本人随军前来。
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: 全军
  rationale: στράτευμα 指其统率的军队；结合“率领”译为“全军”，准确而自然。
- source_word: πέραν τοῦ Ἰορδάνη
  choice: 来到约旦河对岸
  rationale: πέραν 可指河的另一边，也可表达越过河流后的地域；“来到……对岸”保留移动含义，同时不指定具体方位。
