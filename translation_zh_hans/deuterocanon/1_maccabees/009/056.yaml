  text: And Alcimus died at that time after great torment[a].
translation:
  language: zh_hans
  text: 那时，亚基摩在极大的痛苦中死去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伴随着极大的痛苦。”希腊语μετὰ βασάνου μεγάλης通常表示死亡时伴随的极大痛苦；按上下文，也可理解为他在经历剧烈苦楚后死去。
    reason: 保留介词短语可指伴随情形、并可在上下文中理解为死前受苦的语义弹性；避免加入“受尽”的额外含义。
lexical_decisions:
- source_word: ἀπέθανεν
  choice: 死去
  rationale: 这是ἀποθνῄσκω的简单过去时陈述，直接叙述死亡事件；“死去”自然、庄重，不添加原文没有的委婉意味。
- source_word: Ἄλκιμος
  choice: 阿尔基摩
  rationale: 按希腊语Ἄλκιμος音译人名，采用便于现代普通话读者辨读的形式。
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: 那时
  rationale: 简明保留该短语的一般时间指向，不把καιρός过度解释为具有特殊含义的“时期”或“时机”。
- source_word: μετὰ βασάνου μεγάλης
  choice: 在极大的痛苦中
  rationale: μετά接属格通常表示伴随情形；此译自然地描述他死亡时伴随的剧烈痛苦，同时不排除痛苦此前已经持续一段时间。
- source_word: βασάνου
  choice: 痛苦
  rationale: βασάνος表示强烈的疼痛、折磨或苦楚；配以“极大的”传达其强度，而不武断断定这是人为施加的酷刑。
