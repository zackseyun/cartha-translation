  yaml_path: translation/deuterocanon/1_maccabees/009/037.yaml
  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: zh_hans
  text: 这些话以后，有人报告约拿单和他兄弟西门说，雅姆布里的众子正在举行盛大的婚礼，正从拿达巴特迎接新娘；她是迦南一位显赫权贵的女儿，随行的队伍十分浩大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随行的队伍”也可译作“盛大的迎亲行列”。希腊语 παραπομπή 既可指护送的人员，也可指随行的仪仗或队列。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: 这些话以后
  rationale: 保留 λόγους 的“话”这一直接含义，并以自然的汉语承接上文；不擅自扩展为“这些事以后”。
- source_word: ἀπηγγέλησαν
  choice: 有人报告……说
  rationale: 希腊文为未明说施事者的被动表达；汉语用泛指主语“有人”自然传达信息传来的意思，又不补入具体人物。
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: 约拿单和他兄弟西门
  rationale: 与格表示报告的对象；αὐτοῦ 最自然地指约拿单，因此明确西门是约拿单的兄弟。
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: 雅姆布里的子孙
  rationale: 保留原文家族或宗族称谓的形式；“子孙”在现代汉语中比“众子”更可能涵盖宗族成员。
- source_word: ποιοῦσιν γάμον μέγαν
  choice: 正在大办婚礼
  rationale: ποιεῖν γάμον 是举行婚礼的惯用表达；“大办”同时体现 μέγαν 所表达的盛大规模。
- source_word: ἄγουσι τὴν νύμφην ἀπὸ Ναδαβάθ
  choice: 要从拿达巴特迎娶新娘
  rationale: 婚礼语境中的 ἄγειν τὴν νύμφην 指把新娘迎来；“迎娶”符合现代汉语习惯，并保留从该地接来的方向。
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: 她是迦南一位权贵的女儿
  rationale: μεγιστάν 指身份显赫的要人或贵族；“权贵”简明传达其高位。希腊文 μεγάλων 与 μεγιστάνων 有强化、略显叠加的色彩，中文不机械重复“伟大的大权贵”。
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: 随行的队伍十分浩大
  rationale: παραπομπή 可指护送人员，也可指伴随的行列；采用较宽泛的“随行的队伍”以保留两种可能，并用脚注说明。
