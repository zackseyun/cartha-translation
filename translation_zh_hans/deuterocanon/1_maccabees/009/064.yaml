  yaml_path: translation/deuterocanon/1_maccabees/009/064.yaml
  text: And he came and encamped against Bethbasi[a], and fought against it for many days, and made siege engines.
translation:
  language: zh_hans
  text: 他来到贝特巴西，在城外扎营，攻打这城多日，并制造了攻城器械。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“制造了器械”；希腊语此词可泛指机械装置，在这里的围城语境中指军事器械。
    reason: 保留μηχανάς较宽的词义，并说明其在当前军事语境中的具体所指。
lexical_decisions:
- source_word: ἐλθὼν
  choice: 他来到
  rationale: 不定过去时分词承接叙事中的下一步行动；用现代汉语顺接表达，保留事件次序。
- source_word: παρεβάλεν ἐπὶ
  choice: 在那里扎营攻城
  rationale: 该军事用语表示在某地对面安营、进逼；译文既保留扎营的具体动作，也以“攻城”自然表达敌对目标，而不直接等同于后文的持续交战。
- source_word: Βεθβασί
  choice: 贝特巴西
  rationale: 按希腊文地名音译，采用便于现代普通话读者辨读的形式。
- source_word: ἐπολέμησεν αὐτήν
  choice: 与城里的人交战
  rationale: 原文直译为“与它交战”，所指为该城；现代汉语通常不说与一座城交战，因此以城中守军为隐含对象自然表达，同时没有把动作强化为攻陷。
- source_word: ἡμέρας πολλὰς
  choice: 一连多日
  rationale: 准确表达持续时间，并符合现代汉语叙事习惯。
- source_word: ἐποίησεν μηχανάς
  choice: 制造了攻城器械
  rationale: μηχαναί本义可泛指机械装置，但在围攻语境中指军用攻城设备；正文明确其语境义，脚注保留较宽的字面可能。
