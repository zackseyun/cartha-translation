  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: zh_hans
  text: 犹大看见巴基德和军营的主力在右翼，所有心里勇敢的人都聚集到他那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεν
  choice: 看见
  rationale: 按其不定过去时的直接叙事意义翻译，不额外解释为“意识到”或“察觉”。
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: 营中最精锐的部队
  rationale: στερέωμα有坚固、力量、支柱之意；在战场语境中指军营（即军队阵营）中坚强有力的主体，而非实体工事。译作“最精锐的部队”既自然，也保留其军事所指。
- source_word: ἐν τοῖς δεξιοῖς
  choice: 在右翼
  rationale: 该复数表达指右侧位置；军事语境下“右翼”比单纯“右边”更明确自然。
- source_word: συνῆλθον αὐτῷ
  choice: 聚集到他那里
  rationale: 保留 συνέρχομαι 的共同聚集之意以及与格 αὐτῷ 所表达的趋向关系，避免把它弱化为单纯“加入他”。
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: 所有心里勇敢的人
  rationale: εὔψυχοι表示有勇气，τῇ καρδίᾳ突出内在心志；译文保留“心里勇敢”的表达。上下文已明确这些人是战士，汉语无需另加“男人”。
theological_decisions:
- issue: 军事语境中阳性复数的性别表达
  choice: 所有心里勇敢的人
  alternative: 所有心里勇敢的男人／所有勇士
  rationale: 希腊文阳性复数在此指参战者，但现代汉语“人”本身不抹除上下文所显示的男性战士身份；强加“男人”不够自然，译作“勇士”又会淡化“心里”这一明确成分。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“巴基德”按常见汉译音译；“右翼”符合战场语境。“营中最精锐的部队”以可懂的军事汉语表达原文隐喻，不将其误解为营寨工事。
