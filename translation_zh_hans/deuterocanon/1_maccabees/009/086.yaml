  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: zh_hans
  text: 约拿单从那里起行，在亚实基伦安营；城里的人出来迎接他，极其隆重。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文在随后一个词的开头“καὶ ἐπέ-”处中断；不过，到“极其隆重”为止的句子完整，译意明确。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 自然表达空间上的承接和叙事行程的推进。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 保留该动词设置营地的军事语义，又符合现代汉语叙事习惯。
- source_word: εἰς Ἀσκάλωνα
  choice: 在亚实基伦
  rationale: 介词 εἰς 本可表示“到、进入”，但与“安营”搭配时译作“在”更自然；原文未明确营地位于城内还是城外，因此不作细化。
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: 城里的人出来
  rationale: 贴近原文较为笼统的指称，不擅自限定为全体居民或某类官员。
- source_word: εἰς συνάντησιν αὐτῷ
  choice: 迎接他
  rationale: 在友好而隆重的会面语境中，“迎接”比字面的“与他相见”更符合现代汉语。
- source_word: ἐν δόξῃ μεγάλῃ
  choice: 极其隆重
  rationale: 此处 δόξα 指公开迎接时所给予的尊荣和排场；“极其隆重”自然传达其情境意义，而不误解为抽象的“荣耀”。
