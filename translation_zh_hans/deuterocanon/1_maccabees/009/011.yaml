  yaml_path: translation/deuterocanon/1_maccabees/009/011.yaml
  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: zh_hans
  text: 军队从营中出发，列阵迎战他们。骑兵分成两队，投石手和弓箭手走在军队前面，所有勇士都在最前列作战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有在最前列作战的都是勇士。”希腊语“καὶ οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί”结构紧缩，可理解为勇士都在最前列，也可理解为最前列的战士都是勇士。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 此处描写军队离开营地投入行动；“出发”自然清楚，并保留军事行进的语境。
- source_word: ἡ δύναμις
  choice: 军队
  rationale: δύναμις在此指一支由骑兵、投石手、弓箭手等组成的武装力量；“军队”是现代汉语中最自然的统称。
- source_word: παρεμβολῆς
  choice: 营
  rationale: παρεμβολή在军事叙事中指营地；“营”简洁而符合上下文。
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: 列阵迎战他们
  rationale: 该短语表示站定阵势与敌军相遇；“列阵迎战”传达有意部署作战的含义，而不拘泥于字面的“站立”。
- source_word: ἡ ἵππος
  choice: 骑兵
  rationale: ἵππος字面为“马”，但在此作为军事集合名词，指骑兵部队。
- source_word: ἐμερίσθη ... εἰς δύο μέρη
  choice: 分成两队
  rationale: 表达骑兵在战术上被分作两部分；汉语军事叙事中“分成两队”自然明确。
- source_word: σφενδονῆται
  choice: 投石手
  rationale: 指使用投石索作战的兵士；“投石手”是简明易懂的对应词。
- source_word: τοξόται
  choice: 弓箭手
  rationale: 指持弓作战的兵士；“弓箭手”是现代汉语常用称呼。
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: 走在军队前面
  rationale: 原文强调这些兵种位于主力之前，并不必然表示他们统率全军，因此不用“率领”。
- source_word: πρωταγωνισταὶ
  choice: 在最前列作战
  rationale: 该词在此指处于最前方战斗位置的人；用位置兼动作的表达可避免现代“主角”一词造成误解。
- source_word: πάντες οἱ δυνατοί
  choice: 所有勇士
  rationale: δυνατοί在军事语境中指强健勇猛的战士；“勇士”既自然，也保留其褒义和战斗色彩。
