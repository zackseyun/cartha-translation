  yaml_path: translation/deuterocanon/1_maccabees/009/008.yaml
  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: zh_hans
  text: 他就灰心了[a]，对剩下的人说：“我们起来，上去攻击我们的对手吧；也许我们能同他们作战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衰弱了”或“失去了勇气”；这个希腊语动词可以表示身体虚弱，也可以表示内心失去勇气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: 泄了气
  rationale: 该被动形式可指松弛、衰弱或丧失勇气；在战场语境中，“泄了气”自然表达意志受挫，同时不排除身心疲弱的含义。
- source_word: τοῖς καταλειφθεῖσιν
  choice: 对剩下的人
  rationale: 忠实保留“被留下、仍剩余者”的宽泛意义，不擅自明确为幸存者或留守者。
- source_word: Ἀναστῶμεν
  choice: 我们起来
  rationale: 以劝勉语气表达第一人称复数虚拟式，并保留“起来”的动作和号召意味。
- source_word: ἀναβῶμεν
  choice: 上去迎战
  rationale: “上去”保留ἀναβαίνω可能具有的地势含义；结合ἐπὶ与军事语境，用“迎战”自然表达向对手进军，但未具体化战术。
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: 我们的对手
  rationale: “对手”准确表达彼此敌对、相抗的关系，较“敌人”更贴近该词的对立意味。
- source_word: ἐὰν ἄρα
  choice: 或许还能
  rationale: 表达原文带有迟疑和试探的条件语气；“还”结合残余兵力的上下文，呈现能否作战的不确定性。
- source_word: δυνώμεθα πολεμῆσαι αὐτούς
  choice: 能与他们一战
  rationale: 自然表达“有能力同他们作战”；“一战”简洁而符合当前战场语境。
