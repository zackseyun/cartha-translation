  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: zh_hans
  text: 战斗越发激烈[a]。约拿单伸手要击打巴基德，巴基德却向后避开了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“战斗逼近了”，或“战事收紧了”。希腊文动词既可描写交战双方逼近、战局收紧，也可由此表达战斗加剧。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为：“但他转离他，退向后方。”原文着重描写巴基德避开约拿单并往后方移动的动作和方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν ὁ πόλεμος
  choice: 战斗越发激烈
  rationale: 在近身交战的语境中，συνάγω的不及物用法可描写战局收紧、双方逼近，因而也呈现战斗加剧之意。“越发激烈”是自然的现代汉语，同时以脚注保留“逼近、收紧”的意象。
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: 伸手
  rationale: 保留希腊文“伸出他的手”的动作表达；汉语省去已由主语明确的“他的”，较为自然。
- source_word: πατάξαι
  choice: 击打
  rationale: 表达直接出手击中或打击的意图，比泛化的“攻击”更贴近原词，也避免古雅的措辞。
- source_word: Βακχίδην
  choice: 巴基德
  rationale: 按希腊文人名 Βακχίδης 音译，并采用中文圣经传统中常见的形式。
- source_word: ἐξέκλινεν ἀπ᾿ αὐτοῦ εἰς τὰ ὀπίσω
  choice: 向后避开了他
  rationale: 同时呈现“从他那里侧转避开”和“往后方”的方向；“避开”在打击场景中自然，却不具体断定其动作方式。
