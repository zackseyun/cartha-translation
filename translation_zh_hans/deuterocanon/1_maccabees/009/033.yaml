translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“提哥亚”使用通行圣经地名译法；“阿斯法尔”按希腊文音译。原文μετʼ αὐτοῦ为单数，译作“跟他在一起的人”，不把所指擅自改成复数。
