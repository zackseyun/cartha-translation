  yaml_path: translation/deuterocanon/1_maccabees/009/033.yaml
  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: zh_hans
  text: 约拿单、他的兄弟西门和所有跟他在一起的人得知了这事[a]，就逃到提哥亚的旷野，在阿斯法尔蓄水池[b]的水边扎营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“知道了”或“得知了”，所知道的事情没有明说，要由上下文判断。
    reason: lexical_alternative
  - marker: b
    text: “蓄水池”也可译作“坑”或“井”；但原文说“蓄水池的水”，表明这里是水源或储水处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: 得知了这事
  rationale: 该动词的不定过去时在此表示获悉某项消息；原文未明说宾语，中文依上下文补出“这事”，同时用脚注保留这一特点。
- source_word: ἔφυγον
  choice: 逃到
  rationale: 保留因危险而逃离的紧迫意味，并与目的地自然衔接。
- source_word: ἔρημον Θεκώε
  choice: 提哥亚的旷野
  rationale: ἔρημος在此指荒僻、少有人烟的地域；“旷野”既符合地理叙事，也不过度限定其干旱程度。
- source_word: παρενέβαλον
  choice: 扎营
  rationale: 准确表达安营驻扎的叙事动作，现代汉语自然且庄重。
- source_word: ἐπὶ τὸ ὕδωρ
  choice: 在……的水边
  rationale: 结合扎营语境，ἐπί加宾格在此表示营地靠近水源的位置。
- source_word: λάκκου
  choice: 蓄水池
  rationale: λάκκος可指坑、井或蓄水池；与“水”连用时，蓄水设施最符合语境，但词义余地以脚注说明。
- source_word: Ἀσφάρ
  choice: 阿斯法尔
  rationale: 按希腊文地名音译，并保留词尾ρ所反映的音节。
