  yaml_path: translation/deuterocanon/1_maccabees/009/066.yaml
  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: zh_hans
  text: 他在他们的营地中击打奥多米拉、他的兄弟和法西隆的众子。[a]他开始攻击，并同军队一同向前推进。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营地”直译为“营帐”或“住所”。原文为单数；在这里的军事语境中，可指他们扎营之处或营地。
    reason: lexical_alternative
  - marker: b
    text: “向前推进”直译为“上去”。在军事语境中很可能指进军或推进；该词也可带有向高处行进的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάτεξεν
  choice: 击杀
  rationale: πατάσσω指击打、重击；在此军事叙事中，宾语是敌方人物，译作“击杀”自然地表达致命攻击，但不额外说明具体手段。
- source_word: Ὀδομηρὰ
  choice: 奥多米拉
  rationale: 按希腊文人名音译，采用现代普通话中易读的形式。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: 他的兄弟们
  rationale: 保留ἀδελφοί通常的直系亲属含义，不擅自扩大为“亲族”。
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: 法西隆的众子
  rationale: 直译υἱοί为“众子”，同时保留其可能指儿子或后裔群体的古代族谱表达。
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: 当时他们正在营地里
  rationale: σκἠνωμα字面指帐篷或居所；在军事语境中，“营地”最自然。调整语序以避免中文误读为“法西隆的儿子们住在属于他们自己的单一帐篷中”。
- source_word: ἐξηρξατο
  choice: 开始
  rationale: 明确保留动词所表达的起始意义。
- source_word: τύπτειν
  choice: 攻击
  rationale: τύπτω字面为“击打”；此处接续军事行动，译为“攻击”符合现代中文，又避免连续使用“击杀”而暗示每次行动都必然致死。
- source_word: ἀναβαίνειν
  choice: 向前推进
  rationale: ἀναβαίνω字面为“上去”；军事上下文中可能指向上行进或进军。正文采用“向前推进”，脚注保留字面可能性。
- source_word: ἐν ταῖς δυνάμεσιν
  choice: 率军
  rationale: δυνάμεις复数常指军队、兵力。“率军”以简洁中文表达主语与军队一同行动；希腊文并无明确所有格，故不译成强调归属的“他的军队”。
