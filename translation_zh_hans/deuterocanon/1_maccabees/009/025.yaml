translation:
  language: zh_hans
  text: 巴基德挑选了那些不敬虔的男子，立他们作那地的掌权者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立他们作那地的主人。”希腊语原文用的是可指“主人”或“主宰者”的词；这里可能是指政治上的统治者。
    reason: 保留κυρίους较为字面的译法，并说明其在本处政治语境中的功能性理解。
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: 挑选了
  rationale: 准确表达不定过去时动词“选择、选出”的直接含义，现代汉语自然明白。
- source_word: Βακχίδης
  choice: 巴基德
  rationale: 按通行中文形式音译人名，不赋予额外含义。
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  choice: 那些不敬虔的人
  rationale: ἀσεβεῖς侧重对神或宗教义务的不敬，而不只是一般道德败坏；“不敬虔”保留这一宗教—道德色彩。ἄνδρας在此指一群男性，但现代汉语“人”可自然涵盖语境中的男性成员，无须生硬译作“男人”。
- source_word: κατέστησεν
  choice: 立
  rationale: 表示把人安置在某种职位或权力地位上；“立……作……”简洁庄重，符合历史叙事语体。
- source_word: κυρίους
  choice: 掌权者
  rationale: κυρίους字面可指“主人”或“主宰者”，在本节行政政治语境中指对该地拥有权柄的人；“掌权者”既表达实际权力，也避免误读为家主关系。
- source_word: τῆς χώρας
  choice: 当地
  rationale: χώρα可指土地、地区或国土；与κυρίους搭配时，属格表达他们对该地区的支配。“当地”在中文中自然传达具体地域，而不武断限定为整个国家。
