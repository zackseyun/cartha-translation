  text: Jonathan returned with those who were with him[a], carrying much plunder.
translation:
  language: zh_hans
  text: 约拿单与他同行的人带着许多战利品返回了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：转回。
    reason: 词义替代：στρεψεν在此叙事语境中可译为“返回”或“转回”。
lexical_decisions:
- source_word: στρεψεν
  choice: 返回了
  rationale: 此处不定过去时在叙事语境中表示转回、返回；译作“返回了”自然地表达行动完成，同时保留移动方向。
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: 和跟随他的人
  rationale: 原短语指在约拿单身边、与他同行的一群人。“跟随他的人”符合现代汉语表达，又不将其过度限定为士兵。
- source_word: ἔχοντες
  choice: 带着
  rationale: 分词表示伴随情形，说明约拿单及同行者返回时拥有并携带战利品；“带着”比直译“有”更自然。
- source_word: σκῦλα πολλά
  choice: 许多战利品
  rationale: σκῦλα指冲突中夺得的物品；“战利品”准确且庄重，πολλά译作“许多”以表达数量。
