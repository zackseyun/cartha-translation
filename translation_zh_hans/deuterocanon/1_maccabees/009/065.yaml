  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
translation:
  language: zh_hans
  text: 约拿单把他的兄弟西门留在城里，自己出到乡间，带着一批人前来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在这里是省略性表达，字面为“带着数目而来”；在上下文中，可能指他带着一群或一队人前来。
    reason: 说明原文的省略性表达及其可能含义，避免正文把人数或队伍编制说得过于确定。
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: 留在
  rationale: 这里表示约拿单离去时让西门留在原地；“留在”符合现代汉语习惯，也不额外说明西门承担何种任务。
- source_word: ἐν τῇ πόλει
  choice: 在城里
  rationale: πόλις可指城或城镇；“城里”既自然，也保留了它与后文乡间的空间对照。
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: 出到乡间
  rationale: χώρα在此指城外地区或乡野；“乡间”与“城里”形成清楚对照，同时不把范围限定为某一行政区域。
- source_word: ἦλθεν ἀρίθμῳ
  choice: 带着一批人前来
  rationale: 原文是省略性表达，直译近似“按数目而来”；结合军事叙事，所指大概是一群随行人员。“一批人”补明汉语必需的隐含对象，但不具体断定人数或编制。
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: 他的兄弟西门
  rationale: 自然表达同位关系，明确西门是约拿单的兄弟。
