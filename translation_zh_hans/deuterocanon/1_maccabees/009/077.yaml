base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/077.yaml
  text: He encamped three thousand cavalry and a large force[a], and went to Azotus as though passing through; at the same time he was leading them into the plain[c][b], because he had a multitude of cavalry and trusted in it.
translation:
  language: zh_hans
  text: 他带着三千骑兵和大批军队安营[a]，然后前往阿左托，装作只是路过[b]；与此同时，他把军队引到平原上，因为他拥有大批骑兵，并且倚仗这支力量[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文行末止于一个未写完的词（καὶ κατε-），表明句子在下一节继续；本译文只翻译本节单元中完整保存的部分。
    reason: textual_variant
  - marker: b
    text: “装作只是路过”也可译为“仿佛从那里经过”；原文可能暗示他故意造成只是途经的假象。
    reason: lexical_alternative
  - marker: c
    text: “这支力量”原文为阴性单数代词，可能特指前文的“大批军队”，也可能泛指他所拥有的骑兵力量；本译文不完全限定其所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: 安营驻扎
  rationale: 该动词在军事叙事中通常指扎营；“安营驻扎”既保留具体动作，也符合现代汉语表达。
- source_word: τρισχιλίαν ἵππον
  choice: 三千骑兵
  rationale: ἵππος在这里是集合性的军事用语，指骑兵部队；“三千骑兵”自然且准确。
- source_word: δύναμιν πολλήν
  choice: 一支大军
  rationale: δύναμις在此指军事力量，而非抽象能力；译作“一支大军”符合上下文。
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: 前往阿左托
  rationale: 保留动词的一般行进含义，不额外限定为急行或进军；Ἄζωτος采用常见音译“阿左托”。
- source_word: ὡς διοδεύων
  choice: 装作只是路过
  rationale: ὡς加分词可表达表象或佯装；“装作”呈现策略性的假象，“只是路过”传达διοδεύων的穿行含义。
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: 与此同时，他把军队引到平原上
  rationale: ἅμα表示同时发生；προσάγω在此有带领、引入之意。希腊文宾语省略，中文为清楚起见按军事语境补出“军队”。
- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου
  choice: 因为他拥有大批骑兵
  rationale: 该结构说明行动或信心的原因；πλῆθος ἵππου是集合性军事表达，译作“大批骑兵”简洁自然。
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: 并且倚仗这支力量
  rationale: 完成时不定式表达已经形成的稳固信赖；阴性单数代词的所指存在一定歧义，用“这支力量”既可承接军队，也可涵盖骑兵这一主要倚仗。
