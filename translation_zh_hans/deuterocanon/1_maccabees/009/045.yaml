  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: zh_hans
  text: 因为你看，战斗在我们前面，也在我们后面；约旦河的水在这边和那边[a]，还有沼泽和树林；我们无处可以转向躲避[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在两边。”希腊文直译为“在这边和那边”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“退却”或“逃脱”。希腊文的基本意思是“转向一旁”；在这里是指没有脱身的路线。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 因为看哪
  rationale: γάρ承接上文，表示解释或理由；ἰδού是唤起注意的语气词。译作“因为看哪”，兼顾两者，并保留原文紧迫、鲜明的语气。
- source_word: ὁ πόλεμος
  choice: 战斗
  rationale: 此处描述眼前的战术处境，所指是正在临近的交战，而非范围更广的“战争”。
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: 就在我们前后
  rationale: 两短语形成明确的空间对照，描述前后受敌的局面；“前后”在现代汉语中简洁自然。
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: 约旦河的水
  rationale: 保留原文对“水”的明确强调，突出其作为地形障碍的作用，而不只笼统译作“约旦河”。
- source_word: ἔνθεν καὶ ἔνθεν
  choice: 在这边和那边
  rationale: 较贴近原文分指两处的表达，并以脚注说明可自然理解为“两边”。
- source_word: ἕλος καὶ δρυμός
  choice: 沼泽和树林
  rationale: 分别表达湿软沼泽地与林木密集之地，既准确又为普通现代读者所熟悉。
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: 我们没有地方可以转向躲避
  rationale: “转向”保留ἐκκλῖναι的基本空间意象，“躲避”则说明其在被围困语境中的实际含义，同时不把它限定为某一种军事行动。
