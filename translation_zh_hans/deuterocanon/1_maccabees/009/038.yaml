  text: And they remembered John their brother[a], and they went up and hid under the cover of the mountain.
translation:
  language: zh_hans
  text: 他们想起了自己的兄弟约翰，便上去，藏在山的遮蔽下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮蔽”也可译作“庇护”或“掩护”。希腊文σκέπη可指覆盖、遮蔽之处或保护。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: 想起了
  rationale: 该词在此表示把某人记起、想到；“想起了”符合现代汉语叙事，也不额外说明他们因何想起约翰。
- source_word: Ἰωάνου τοῦ ἀδελφοῦ αὐτῶν
  choice: 自己的兄弟约翰
  rationale: 忠实表达约翰与主语众人的兄弟关系；“自己的”在汉语中比重复“他们的”更自然。
- source_word: ἀνέβησαν
  choice: 上去
  rationale: 保留动词所表达的向上移动，不擅自补出“上山”或“进入山区”等原文未明说的目的地。
- source_word: ἐκρύβησαν
  choice: 藏
  rationale: 该形式在语境中表示他们把自己隐藏起来；“藏”简洁自然，并由上下文清楚表明主语。
- source_word: ὑπὸ τὴν σκέπην τοῦ ὄρους
  choice: 在山的遮蔽下
  rationale: σκέπη可指覆盖、遮蔽或庇护；此译保留具体空间意象及其保护意味，不把它具体化为山洞、树林或山阴。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“便”承接两个连续动作；脚注标记置于实际存在词义差异的“山的遮蔽下”之后，而不是置于“兄弟约翰”之后。
