base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: zh_hans
  text: 他不再率领大批军队前来，却暗中派人送信给他在犹太地的所有盟友，要他们捉拿约拿单和与他同在的人；但这事未能得逞[a]，因为他们的计谋已经被对方察觉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文动词为单数，直译可作“他未能做到”，可能指主谋本人；结合前文受命行动的盟友，也可理解为谋划者一方未能得逞。正文不明确限定行动失败者的单复数所指。
    reason: 语法指代存在歧义，正文以非人称式结果表达保留两种可能。
  - marker: b
    text: 希腊文直译为“他们的计谋被他们知道了”。按上下文，属格“他们的”指谋划者一方，间接受格“被他们知道”指约拿单和与他同在的人；故正文译作“被对方察觉”。
    reason: 原文代词指代紧缩；脚注说明谋划者与知悉阴谋的目标一方分别为何者。
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: 打消了……前来的念头
  rationale: 该结构表示停止、放弃原定行动。此译自然地表达不再前来的意思，同时不额外推断其动机。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 率领大批军队
  rationale: δύναμις在此指军事力量或兵员；“大批军队”符合叙事语境，又不强调特定军制。
- source_word: ἀπέστειλεν ἐπιστολὰς λάθρᾳ
  choice: 暗中写信
  rationale: λάθρᾳ强调行动隐秘；现代汉语以“暗中写信”表达简洁自然。
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: 给他在犹太地的所有盟友
  rationale: σύμμαχος在政治军事语境中宜译为“盟友”；保留地域限定。
- source_word: ὅπως συλλάβωσι
  choice: 要他们捉拿
  rationale: συλλαμβάνω在此表示抓获、擒拿；“捉拿”既适合敌对行动，也不强加正式司法程序。
- source_word: τοὺς σὺν αὐτῷ
  choice: 跟随他的人
  rationale: 原文泛指与约拿单同在的一群人；此译通顺且不添加具体身份。
- source_word: οὐκ ἠδύνατο
  choice: 这事却没能办成
  rationale: 希腊文动词为单数，可指主谋“他”，但行动执行者在上文为复数。采用无明确人称的表达，保留句法与语境之间的张力。
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: 他们的计谋已经被对方察觉
  rationale: βουλή在此为秘密谋划；希腊文两个代词所指不同且表达紧缩，“对方”清楚传达计谋被目标一方识破，同时避免重复含混的“他们”。
