  text: And they stationed a garrison in them to be hostile toward Israel[a].
translation:
  language: zh_hans
  text: 他们在这些地方部署守军，为要与以色列为敌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为要敌对以色列”。希腊文τοῦ ἐχθραίνειν表示部署守军的目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: 驻扎
  rationale: τίθημι在此指部署人员；结合军事语境，用“驻扎”比直译为“放置”自然准确。
- source_word: φρουράν
  choice: 守军
  rationale: 此处指派驻在设防地点的军事守备力量；“守军”符合现代汉语军事语境。
- source_word: ἐν αὐτοῖς
  choice: 在这些地方
  rationale: 代词所指承接上文提到的地点；译出“这些地方”使中文清楚，同时不在本节中过度具体化。
- source_word: τοῦ ἐχθραίνειν
  choice: 为要敌对
  rationale: 带τοῦ的动词不定式表示驻军的目的；“为要敌对”既保留目的关系，也不将敌对行为强化为全面战争。
- source_word: τῷ Ἰσραήλ
  choice: 以色列
  rationale: 与ἐχθραίνειν连用的与格表示敌对行为的对象；汉语用“敌对以色列”自然表达。
