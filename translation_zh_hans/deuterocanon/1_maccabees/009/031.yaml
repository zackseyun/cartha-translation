  text: And Jonathan took up the leadership at that time, and arose in place of Judas his brother.
translation:
  language: zh_hans
  text: 那时，约拿单接掌了领导权，并起来接替他的兄弟犹大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起来”也可译作“兴起”或“挺身而出”。这里指约拿单接替犹大，承担领导职责。
    reason: 希腊语ἀνέστη保有“起来、兴起”的字面意象；在此继任语境中，也表示约拿单起来承担犹大原有的领导角色。
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: 接掌
  rationale: 该中间语态在这里表示接受并承担职分；“接掌”自然地表达约拿单承接领导职责。
- source_word: ἡγεσίαν
  choice: 领导权
  rationale: 此词可指领导、统领或指挥；“领导权”符合犹大之后权责承接的语境，又不夸大为君王统治。
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: 那时
  rationale: 简洁、自然地传达该时间短语。
- source_word: ἀνέστη
  choice: 而起
  rationale: 保留“起来、兴起”的叙事意象，同时在承接职位的语境中表达挺身继任。
- source_word: ἀντί
  choice: 接替
  rationale: 清楚表达替代和继任关系，不暗示敌对。
- source_word: Ἰωναθὰν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中 Jonathan 的通行译名。
- source_word: Ἰούδου
  choice: 犹大
  rationale: 采用现代中文圣经传统中 Judas（马加比）的通行译名。
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: 他哥哥
  rationale: ἀδελφός本身只明确表示兄弟；结合上下文中犹大与约拿单的家族次序，译作“哥哥”使中文关系自然明确。
