  yaml_path: translation/deuterocanon/1_maccabees/009/035.yaml
  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
translation:
  language: zh_hans
  text: 他派自己的兄弟去带领众人，又请求他的纳巴泰朋友替众人收存[a]大量行李。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收存”也可译作“受托保管”。原文动词可含有替人接收并看管财物的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 这是常见的叙事动词，表示差派某人执行任务；“派……去”符合现代汉语表达。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的兄弟
  rationale: 忠实表达原文的亲属关系和回指所属，且不擅自指明兄弟姓名。
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: 带领众人
  rationale: 分词表示兄弟承担领导者的职能；“带领”保留领导含义，又不把它强化为正式军职。ὄχλος在此指同行的一群人，译作“众人”比“群众”更适合叙事语境。
- source_word: παρεκάλεσεν
  choice: 请求
  rationale: 该词可表示恳求、劝请或敦促；此处是请朋友代管财物，“请求”自然且不过度强化语气。
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: 他的纳巴泰朋友
  rationale: 简洁保留族群身份及友好关系。
- source_word: παραθέσθαι αὐτοῖς
  choice: 替他们收存
  rationale: 中间语态不定式在此可指接收受托之物并加以保管；“收存”兼顾接收和看管，αὐτοῖς译为“替他们”。
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: 许多行李
  rationale: ἀποσκευή指旅途中携带的行李、装备或物品；“行李”最合语境。后置的τὴν πολλήν强调数量多，译作“许多”自然清楚。
