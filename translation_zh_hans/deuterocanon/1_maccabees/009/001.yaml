base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
translation:
  language: zh_hans
  text: 德米特里听说尼加挪和他的军队发动了战争，就再次派巴基德和阿尔基慕前往犹大地，并派军队的右翼[a]与他们同去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“右角”；在军事用语中指军队的右翼或右侧翼。
    reason: 说明军事语境中的比喻性用词，并保留原文意象。
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 既保留“听见、获悉”的基本意义，又符合现代汉语叙事表达，不额外说明消息来源。
- source_word: ἐποίησεν ... πόλεμον
  choice: 发动了战争
  rationale: 按所提供的希腊文本直译其“进行／发动战争”的惯用结构，不依据其他文本传统改作“战死”或“败亡”。
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: 他的军队
  rationale: 此处 δυνάμεις 用于军事语境，指尼加挪所统率的武装力量；“军队”比生硬的“力量”更自然。
- source_word: προσέθετο ... ἀποστεῖλαι / ἐκ δευτέρου
  choice: 再次派
  rationale: 将“接着／又派遣”与“第二次”的重复意义合并为简洁自然的汉语，同时保留行动再次发生的明确含义。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 贴近字面的“犹大之地”，避免直接替换成可能带有不同时代地域含义的“犹太省”。
- source_word: τὸ δεξιὸν κέρας
  choice: 军队的右翼
  rationale: κέρας 字面为“角”，但在军事语境中指军阵的一翼；补出“军队的”使现代汉语读者能自然理解。
