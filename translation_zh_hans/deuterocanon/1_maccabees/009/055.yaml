base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: zh_hans
  text: 那时，阿尔基摩遭到重击，他所做的事也受了阻碍；他的口被堵住了，他瘫痪了，再也说不出一句话，也不能吩咐家中的事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家中的事务”直译为“他的家”；希腊语“家”（οἶκος）也可指家属、家业或整个家庭单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: 遭到重击
  rationale: 保留“被击打、受重创”的被动含义及突发、严重的语气，但不擅自说明施动者，也不把它限定为某种现代医学诊断。
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: 他所做的事也受了阻碍
  rationale: ἐμποδίζω表示阻挡、妨碍；ἔργα含义宽泛，可指行动、事务或筹划。此译保留其宽度，也不把结果强化成彻底终止。
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: 他的嘴闭塞了
  rationale: ἀποφράσσω有堵住、封闭之意；采用具体的身体意象，并与下文不能说话相呼应。
- source_word: παρελύθη
  choice: 身体瘫痪
  rationale: παραλύω通常表示瘫痪或严重失去身体活动能力；补出“身体”使现代汉语自然，同时避免误解为抽象的意志消沉。
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: 再也说不出一句话
  rationale: 自然表达“不能再说一句话”，准确体现ἔτι在否定句中的“不再”以及λαλῆσαι λόγον的习语。
- source_word: ἐντείλασθαι περὶ τοῦ οἴκου αὐτοῦ
  choice: 吩咐家中的事务
  rationale: ἐντέλλομαι表示吩咐、下令；οἶκος在此可涵盖家宅、家人和家务管理。“家中的事务”符合发号施令的语境，同时以脚注保留词义范围。
theological_decisions:
- issue: 阿尔基摩所受打击的性质与来源
  choice: 译作严重而致残的“遭到重击”，不明说施动者或具体病症
  alternative: 明确译成上帝的惩罚，或医学化地译成中风、发作
  rationale: 本节以一连串被动动词描述事件，却没有明说是上帝施行，也没有给出足以确定现代诊断的医学细节。译文保留严重性及潜在的审判语感，而不越过原文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。分号保留原文连续列举症状与后果的推进感；避免古奥的“受击打”“口被封住”，也避免把事件过度医学化。脚注标记置于相关句末。
