lexical_decisions:
- source_word: ὑστήκει
  choice: 队伍坚守原位
  rationale: 该动词表示处于站定或固定的位置；希腊文未明说主语。结合军事语境，以“队伍”作必要的语境补足，但用脚注保留主语不明这一点。
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: 照约拿单所吩咐的
  rationale: καθώς表示相符关系，ἐπιτάσσω表示下令、吩咐；此译自然表达此前命令与当前阵势的对应。
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: 他们的马也疲乏了
  rationale: κοπιάω表示因劳累而疲乏，不必强化为彻底精疲力尽；αὐτῶν按通常所有格译为“他们的”。
- source_word: ἐξέλυσεν Σίμων τὴν δύναμιν αὐτοῦ
  choice: 西门展开他的兵力
  rationale: ἐκλύω在此与军事力量搭配，含调动、展开之意；δύναμις在历史军事叙事中指军队或兵力，“兵力”既准确又不过度具体化。
- source_word: συνῆψεν πρὸς
  choice: 与……交战
  rationale: συνάπτω与πρός用于战事语境，可表示接战、交战；现代汉语以“与……交战”简洁自然。
- source_word: τὴν
  choice: 那……
  rationale: 所给希腊文本止于阴性单数宾格定冠词，句子明显未完；以省略号保留其残缺状态，不从其他版本补足宾语。
