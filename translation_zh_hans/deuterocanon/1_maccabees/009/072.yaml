  yaml_path: translation/deuterocanon/1_maccabees/009/072.yaml
  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: zh_hans
  text: 他把先前从犹大地掳走的俘虏交还给约拿单[a]，然后转身回到自己的国土，从此不再进入他们的境内[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“被掳的群体”，这里指被掳走的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文所用习语直译近似“不再加上前来”，意思是此后没有再进入他们的领土。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν αὐτῷ
  choice: 交还给约拿单
  rationale: ἀποδίδωμι表示把先前取得之物归还；中文用“交还”自然明确。代词αὐτῷ按上文所指译为“约拿单”，避免连续代词造成歧义。
- source_word: τὴν αἰχμαλωσίαν
  choice: 俘虏
  rationale: 该词字面可指“被掳的群体／俘获物”，此处具体指被掳的人；译作“俘虏”既符合军事语境，也比抽象的“被掳”自然。
- source_word: ᾐχμαλώτευσεν
  choice: 掳走
  rationale: 表达战争中俘获并带走人的含义，并与“俘虏”保持词义联系。
- source_word: τὸ πρότερον
  choice: 先前
  rationale: 准确标明该俘获行动发生在归还之前，现代汉语简洁自然。
- source_word: ἐκ γῆς Ἰούδα
  choice: 从犹大地
  rationale: 保留γῆ的地域含义；“犹大地”是简明而庄重的地名表达。
- source_word: ἀποστρέψας ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: 然后转身回到自己的国土
  rationale: 保留转离、离去并返回本国的动作次序；“国土”适合此处军事政治语境。
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: 从此不再进入
  rationale: προστίθημι加不定式构成重复或继续行动的习语；“从此不再”自然表达此后没有再来。
- source_word: τὰ ὅρια αὐτῶν
  choice: 他们的境内
  rationale: ὅρια可指边界或边界以内的领土；与“进入”搭配时，“境内”比“边界”更符合现代汉语习惯。
