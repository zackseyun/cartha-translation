base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: zh_hans
  text: 约拿单听见亚波罗尼乌斯所说的话，心中激动起来，就挑选了一万人，从耶路撒冷出发。他的兄弟西门前来与他会合[a]，帮助他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“遇见他，为要帮助他”；这里译作“与他会合”，表达西门前来支援约拿单的语境含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: 听见……时／听见……后（在句中译作“听见”）
  rationale: ὡς与不定过去时在此引出时间从句；汉语按事件先后自然表达为“听见……就……”。
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: 亚波罗纽所说的话
  rationale: λόγοι直指“话、言语”；补出“所说”符合现代汉语习惯，又不把它泛化为“消息”。
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: 心中激动起来
  rationale: 被动式κινέω配合διάνοια，表示内在思想或心绪受到激发、扰动；此译保留情绪性质未明的张力，不限定为愤怒、惧怕或忧愁。
- source_word: ἐπέλεξεν
  choice: 挑选了
  rationale: 直接表达从众人中选出之意，适合此处军事行动的语境。
- source_word: δέκα χιλιάδας ἀνδρῶν
  choice: 一万人
  rationale: 忠实保留人数及ἀνδρῶν“男人／人”的表述，不擅自具体化为原文未明说的“士兵”。
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: 从耶路撒冷出发
  rationale: 表达离开耶路撒冷的动作；“出发”在汉语中自然，也避免加入“进军”等原文未明确给出的军事色彩。
- source_word: συνήντησεν αὐτῷ
  choice: 前来与他会合
  rationale: συναντάω本义为“遇见、会见”；结合随后“帮助他”的目的，此处“会合”既保留相遇含义，也符合西门前来支援的上下文。
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: 帮助他
  rationale: ἐπί加名词在此表示目的；简洁译出西门会合的目的。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心中激动起来”刻意不说明约拿单究竟是愤怒、震动还是忧虑，以保留希腊文的语义开放性。源文开头的φυγεῖν（“逃跑”）在句法上属于上一节残句，故本节正文从Ὡς δὲ ἤκουσεν起译。
