  text: And the wedding was turned into mourning[a], and the sound of their musicians into lamentation.
translation:
  language: zh_hans
  text: 婚礼变成了哀悼，他们的乐师所奏的乐声[a]变成了哀歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们乐器的声音。”希腊语 μουσικῶν 可指乐师，也可能指乐器或音乐演奏。
    reason: 保留原文词义范围所造成的词汇歧义。
lexical_decisions:
- source_word: μετεστράφη
  choice: 变成了
  rationale: 该被动动词表示处境发生逆转；“变成了”在现代汉语中自然，并保留从喜庆骤然转为悲哀的意味。
- source_word: ὁ γάμος
  choice: 婚礼
  rationale: 上下文所指是公开举行的婚庆活动，而非抽象的婚姻关系；“婚礼”简明准确。
- source_word: πένθος
  choice: 哀悼
  rationale: 该词指因死亡或灾祸而有的悲痛、哀悼，与婚礼的喜庆形成鲜明对照。
- source_word: φωνὴ
  choice: 声音
  rationale: 原义为“声音”；在这里指乐师或乐器发出的声响，译作“声音”既贴近原文，又不预先限定其具体来源。
- source_word: μουσικῶν
  choice: 乐师
  rationale: 该属格复数可指乐师，也可能涉及乐器或演奏；正文采用自然且直接的“乐师”，另一可能保留于脚注。
- source_word: θρῆνον
  choice: 哀歌
  rationale: 该名词可指正式的哀悼之歌；“哀歌”既体现音乐语境，也与前句的“哀悼”相呼应。
