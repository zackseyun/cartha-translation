lexical_decisions:
- source_word: φάλαγγα
  choice: 方阵
  rationale: φάλαγξ指密集的战斗队形或战列；译作“方阵”保留具体军事含义，也保留现存希腊文从半句开始的突兀感。
- source_word: ἡ ἵππος
  choice: 骑兵
  rationale: 虽为单数形式，此处可作集合名词，指骑乘部队；“骑兵”比直译“马”更符合军事语境。
- source_word: ἐξελύθη
  choice: 已经溃散
  rationale: 该动词有松脱、解体之意；在战斗叙事中，“溃散”自然地表达队伍瓦解，同时不额外断定其已被彻底歼灭。
- source_word: συνετρίβησαν
  choice: 被击溃
  rationale: 该词表示被打碎、遭受重创；“被击溃”既体现强烈的军事失败，也符合现代汉语表达。
- source_word: ἀπʼ αὐτοῦ
  choice: 被他
  rationale: ἀπό加代词在此十分简略，可表示失败源自他或在他面前败退；结合被动动词，译为“被他”最自然，但不进一步说明具体攻击方式。
- source_word: ἐσκορπίσθη
  choice: 分散
  rationale: 准确表达部队散开、四散的意思；与前面的“溃散”相呼应而不机械重复。
- source_word: πεδίῳ
  choice: 平原
  rationale: πεδίον在军事叙事中通常指开阔的平地或平原，而非耕作的田地。
