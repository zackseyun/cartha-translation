  text: And Simon and those with him went out from the city and set fire to the siege engines[a].
translation:
  language: zh_hans
  text: 西门和跟他在一起的人从城里出来，放火烧了那些攻城器械[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“那些器械”或“那些机械装置”；按上下文，这是攻城时使用的军事装置。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μετʼ αὐτοῦ
  choice: 跟他在一起的人
  rationale: 保留希腊语所指的宽泛性，不把这些人限定为士兵或部下；表达自然清楚。
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: 从城里出来
  rationale: 明确表达由城内向外的移动，贴合希腊语动词及介词短语，符合现代汉语习惯。
- source_word: ἐνεπύρισαν
  choice: 放火烧了
  rationale: 准确表达主动点火焚烧的动作，比单用“烧了”更清楚地体现原文动词的含义。
- source_word: τὰς μηχανάς
  choice: 那些攻城器械
  rationale: μηχαναί本义可泛指机械或器械，但本节军事语境表明是攻城时使用的装置；“攻城器械”让现代读者易于理解，同时以脚注保留较直译的可能。
