lexical_decisions:
- source_word: φοβηθέντες
  choice: 害怕了
  rationale: 该词为不定过去时被动分词，在此表达城里的人因惧怕而采取行动；译作“害怕了”自然清楚，并保留其因果意味。
- source_word: ἤνοιξαν
  choice: 打开了城门
  rationale: 希腊文只说“打开”，宾语省略；军事与城池语境强烈暗示所开的是城门。正文补出“城门”以符合现代汉语表达，同时用脚注说明原文的省略。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 该名词化短语指属于或身处城中的人；“城里的人”比直译“从城里的人”更符合现代汉语，也不额外限定为男人或守军。
- source_word: ἐκυρίευσεν
  choice: 控制了
  rationale: κυριεύω表示取得支配权或控制权；“控制了”适合军事政治语境，又不将含义过度收窄为单纯攻占。
- source_word: Ἰόππης
  choice: 约帕
  rationale: 采用该古代地名在现代中文圣经传统中通行且易识别的译名。
- source_word: ἤκουσεν
  choice: 听说
  rationale: ἀκούω在此可表示听到消息；“听说”符合汉语叙事习惯。因所供见证在连词处中断，后文以省略号显示未完。
