base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/012.yaml
  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: zh_hans
  text: 巴基德在右翼[a]，方阵从两边逼近；他们不断吹响号角，跟随犹大的人也同样吹响了号角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在右角”；这是军事用语，指军阵的右翼或右侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βακχίδης
  choice: 巴基德
  rationale: 按现代中文圣经人名音译惯例处理希腊人名。
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: 在右翼
  rationale: κέρας字面为“角”，但在军事语境中指军阵的翼侧；“右翼”自然且准确。
- source_word: ἤγγισεν
  choice: 逼近
  rationale: 表达ἐγγίζω所指的接近行动，并符合临战语境。
- source_word: ἡ φάλαγξ
  choice: 方阵
  rationale: 保留φάλαγξ的具体军事含义，不泛化为普通战线或队伍。
- source_word: ἐκ τῶν δύο μερῶν
  choice: 从两边
  rationale: 依其通常句法连接到“逼近”，保留军阵由两个方向接近的空间图景。
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: 不断吹响号角
  rationale: 以“不停/不断”的进行意味反映未完成时ἐφώνουν，并按战场信号语境自然表达以号角发声。
- source_word: οἱ παρὰ Ἰούδαν
  choice: 跟随犹大的人
  rationale: 指与犹大同在、属于他这一方的人，不额外限定其正式身份。
- source_word: ἐσάλπισαν ... ταῖς σάλπιγξιν
  choice: 吹响了号角
  rationale: 准确表达σαλπίζω的具体动作，并以完成性措辞体现不定过去时。
- source_word: καὶ αὐτοὶ
  choice: 也同样
  rationale: 保留αὐτοί的强调和对照作用，表明犹大一方也以相同方式回应。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。通过“不断吹响”与“吹响了”体现希腊文未完成时和不定过去时的叙事对比；分号用于清楚区分军阵逼近与双方号角响应。未沿用英文层中标在“号角”后的脚注，因为其内容“或作：从两边逼近”实际涉及ἐκ τῶν δύο μερῶν的句法归属，而希腊语在此最自然地与ἤγγισεν相连，正文已直接表达，且该脚注标位与内容不相符。
