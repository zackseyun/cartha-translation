  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: zh_hans
  text: 他们与巴基德交战，把他击溃了，又猛烈进逼他，因为他的计谋和进攻都落了空。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落了空”直译为“是空的”，也可译作“全属徒然”。
    reason: 说明κενή的字面意象及可行译法。
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: 与……交战
  rationale: πολεμέω搭配πρός及宾格表示以某人为敌进行战斗；“与……交战”自然保留敌对行动的含义。
- source_word: Βακχίδην
  choice: 巴基德
  rationale: 按现代汉语常见的圣经人名音译方式处理该希腊人名。
- source_word: συνετρίβη
  choice: 被……击溃
  rationale: συντρίβω的被动形式本义为“被打碎、压碎”；在战斗语境中，“击溃”既保留强烈意象，也清楚表达军事失败。
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: 又猛烈进逼他
  rationale: θλίβω可指挤压、逼迫；在此军事语境中译作“进逼”能表达持续施压，σφόδρα由“猛烈”体现。
- source_word: βουλή
  choice: 计谋
  rationale: βουλή可指谋划、计划或主意；这里涉及巴基德的军事行动，“计谋”符合语境，又不把含义缩窄为具体战术。
- source_word: ἔφοδος
  choice: 进攻
  rationale: ἔφοδος在军事语境中可指进军、袭击或攻势；“进攻”是清楚而宽泛的现代汉语表达。
- source_word: κενή
  choice: 落了空
  rationale: κενή字面义为“空的”，在这里表达计谋和进攻徒然无效；“落了空”自然传达这一结果，同时保留“空”的意象。
