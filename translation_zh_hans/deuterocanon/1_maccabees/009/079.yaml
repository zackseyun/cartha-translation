lexical_decisions:
- source_word: κρυπτῶς
  choice: 暗中
  rationale: 表示隐秘、秘密地行动；“暗中”在现代汉语中自然简洁，并保留隐蔽意味。
- source_word: κατόπισθεν
  choice: 跟在……后面
  rationale: 表示在后面或从后方；结合军事语境，这一表达既清楚又保留空间关系。
- source_word: αὐτῶν
  choice: 他们
  rationale: 原文为属格复数代词，应保留其复数所指，不改作单数。
- source_word: ἔγνω
  choice: 知道
  rationale: 直接对应 γινώσκω 的简单过去时形式；不额外解释为“发现”或“认出”。
- source_word: ἔνεδρον
  choice: 伏兵
  rationale: 该军事用语既可指埋伏，也可指埋伏的人；“伏兵”在此自然，并保留其可能指设伏部队的含义。
