  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: zh_hans
  text: 巴基德得知亚基慕已死，就回到王那里；犹大地安宁了两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: 见……已经
  rationale: 在ὅτι从句前可表示看出、得知某事；中文用“见……已经死了”既贴近字面，又符合叙事语境。
- source_word: ἀπέθανεν
  choice: 已经死了
  rationale: 希腊语不定过去时陈述死亡事件；“已经”自然交代该事件先于巴基德的反应。
- source_word: ἀπέστρεψεν
  choice: 回到
  rationale: 表达转回、返回之意；与πρὸς τὸν βασιλέα连用时，“回到王那里”自然简洁。
- source_word: πρὸς τὸν βασιλέα
  choice: 到王那里
  rationale: πρός加宾格在此表示朝向某人的移动；“王那里”保留以王为目的地的表达。
- source_word: ἡσύχασεν
  choice: 安宁了
  rationale: 该动词表示平静、止息；“安宁”适合描述战乱暂息的地域状态，又不强化为更具神学意味的“平安”。
- source_word: ἡ γῆ Ἰούδα
  choice: 犹大地
  rationale: 保留γῆ“地、土地”的明确含义，也延续圣经中“犹大地”的地域称呼。
- source_word: ἔτη δύο
  choice: 两年
  rationale: 希腊语宾格表示持续时间；中文直接说“安宁了两年”即可自然表达时长。
