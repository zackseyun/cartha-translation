  text: And about a thousand men fell beside Bacchides on that day.
translation:
  language: zh_hans
  text: 那一天，巴基德一方约有一千人阵亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一天，约有一千人在巴基德身旁倒下。”希腊语παρά在这里既可表示与巴基德同属一方，也可表示在他身旁。
    reason: 保留介词παρά在阵营关联与空间邻近之间的词义歧义。
lexical_decisions:
- source_word: διέπεσαν
  choice: 阵亡
  rationale: 该动词本义为“倒下”，在战事语境中指战死；“阵亡”在现代汉语中自然、明确地表达其军事含义。
- source_word: παρὰ Βακχίδα
  choice: 巴基德一方
  rationale: παρά加宾格在此可表示与巴基德的关联或所属阵营；译作“巴基德一方”符合战况统计的语境，同时避免误译成由巴基德亲手杀死。原文也可能侧重空间上的“在巴基德身旁”，故以脚注保留。
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 这是标准的时间与格用法；“那一天”简洁自然。
- source_word: εἰς χιλίους ἄνδρας
  choice: 约有一千人
  rationale: εἰς与数词连用可表示达到某一数量或约数；“约有一千人”准确传达其数量范围，避免生硬直译。
