  text: And they mourned for him there[a], and all Israel mourned for him with great mourning, and they grieved for many days and said,
translation:
  language: zh_hans
  text: 他们在那里为他哀悼[a]；以色列众人也为他举行了盛大的哀悼。他们悲痛了许多天，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文连续使用哀悼用语：先用表示哀悼或举哀的动词，继而用同源名词表达“盛大的哀悼”，最后换用表示悲痛的动词。译文保留这种重复、加强与词汇转换，没有将其合并简化。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόψαντο
  choice: 哀哭
  rationale: 该词在丧礼语境中指哀悼、举哀；“哀哭”自然明确，并可借重复保留原文的层层加强。
- source_word: αὐτόν
  choice: 他
  rationale: 代词承接上文的犹大，现代汉语直译为“他”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接保留地点副词，不增加原文未说明的地点信息。
- source_word: πᾶς Ἰσραήλ
  choice: 全以色列
  rationale: 保留以色列作为整体群体的表达；“全以色列”符合现代中文圣经语体。
- source_word: κοπετὸν μέγαν
  choice: 大大哀哭
  rationale: 名词 κοπετός 与前面的动词同源，表示强烈的哀悼；“大大哀哭”既传达程度，也保留重复累积的效果。
- source_word: ἔπενθουν
  choice: 悲痛
  rationale: πενθέω 与前述哀悼词义相近但并不相同；译作“悲痛”保留词汇转换及丧亲哀伤之意。
- source_word: ἡμέρας πολλὰς
  choice: 许多天
  rationale: 这是表示持续时间的宾格，中文以“悲痛了许多天”自然表达。
- source_word: καὶ εἶπαν
  choice: 说：
  rationale: 此语引出下一节的直接引语，故以冒号收尾；中文不必机械重复连接词和主语。
