base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/006.yaml
  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
translation:
  language: zh_hans
  text: 他们看见军队人数众多，便十分惧怕；他们中许多人从营中逃走了[a]，只剩下八百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从营中溜走了。”这个希腊语动词可表示溜走，也可表示逃离。
    reason: 保留ἐξερρύησαν在“溜走”与“逃走／逃离”之间的词义幅度，避免将离开的方式限定为“悄悄”。
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων, ὅτι πολλοί εἰσιν
  choice: 敌军人数众多
  rationale: πλῆθος表示数量庞大，δυνάμεις在这里指军队；结合上下文译作“敌军”，自然地表明这是他们所看见的对方兵力。ὅτι πολλοί εἰσιν解释其人数很多，合并为现代汉语的“人数众多”，避免生硬重复。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 就非常害怕
  rationale: σφόδρα强化恐惧程度；“非常害怕”准确、自然，也保留了看见敌军众多与惧怕之间的因果推进。
- source_word: ἐξερρύησαν
  choice: 逃走了
  rationale: 该动词本义带有流出、溜走的色彩，在军营语境中表示离开或逃离。正文采用清楚自然的“逃走”，脚注保留“悄悄溜走”的词义可能。
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: 从营中
  rationale: παρεμβολή在军事语境中指营地或军营；“从营中”简洁明确。
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: 最后只剩下八百人
  rationale: 准确表达许多人离去后的余数。“最后只剩下”符合现代汉语叙事习惯，ὀκτακόσιοι ἄνδρες在此指八百名作战人员，简译为“八百人”即可。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。将希腊文中“看见军队的众多，因为他们人数很多”的重复结构整合为“看见敌军人数众多”，同时保留事件顺序与强烈恐惧；用脚注呈现关键动词的真实歧义。
