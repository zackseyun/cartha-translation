  yaml_path: translation/deuterocanon/1_maccabees/009/039.yaml
  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: zh_hans
  text: 他们抬眼一看，只见一片喧闹，行装众多；新郎带着朋友和弟兄出来迎接他们，又有手鼓、乐师和许多兵器。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: 人声喧闹
  rationale: 该词指嘈杂声响或喧闹；结合婚礼队伍的场景，译为“人声喧闹”自然且不把原文进一步限定为“游行队伍”。
- source_word: ἀποσκευή πολλή
  choice: 行装众多
  rationale: ἀποσκευή可指装备、辎重或随身行李；“行装”既适合出行及婚礼队伍语境，也保留其范围。
- source_word: οἱ φίλοι αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: 朋友和弟兄
  rationale: 分别直译朋友与兄弟；“弟兄”可涵盖亲兄弟或同族伙伴，不擅自消除原文可能的语义宽度。
- source_word: μουσικῶν
  choice: 乐师
  rationale: 该复数名词指奏乐者；译作“乐师”比泛称“音乐”更符合其人物指称。
- source_word: ὅπλων πολλῶν
  choice: 许多兵器
  rationale: ὅπλα在此最自然地指武器；“兵器”保持叙事时代感，同时现代读者易懂。
