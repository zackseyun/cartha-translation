  yaml_path: translation/deuterocanon/1_maccabees/009/088.yaml
  text: And it happened that when Alexander the king heard these words[a], he continued to honor Jonathan, and he sent him a clasp.
translation:
  language: zh_hans
  text: 后来，亚历山大王听见这些话，就更加尊荣约拿单，并送给他一枚扣饰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胸针”或“带扣”；希腊词指一种用来扣合的饰物。
    reason: πόρπη 的具体形制无法仅凭本节确定，可指扣针、胸针或带扣一类的固定饰物。
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 后来，……就
  rationale: 这是叙事推进的套语；用“后来”引出新的发展，并以“就”自然衔接后续行动，避免生硬直译为“事情发生了，当……时”。
- source_word: ἤκουσεν
  choice: 听见
  rationale: 保留听到这些话或消息的基本意义，不擅自具体化为“得知”。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 贴近 λόγοι 的字面意义，同时保留其可指话语或消息内容的语义空间。
- source_word: προσέθετο δοξάσαι
  choice: 更加尊荣
  rationale: προσέθετο 加不定式表达在原有行动上进一步有所作为；“更加尊荣”自然体现增添荣誉之意。政治语境中的 δοξάζω 译为“尊荣”，避免“荣耀”可能带来的专门神学色彩。
- source_word: πόρπην
  choice: 一枚扣饰
  rationale: πόρπη 指兼有固定和装饰作用的物件；“扣饰”既保留其扣合功能，也不武断限定为胸针或带扣。量词“一枚”符合小型饰物的现代汉语习惯。
theological_decisions: []
