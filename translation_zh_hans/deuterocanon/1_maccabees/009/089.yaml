  text: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
translation:
  language: zh_hans
  text: 一个金扣[a]，按惯例赐给君王亲属的；又把阿卡隆[b]和它的全境赐给他，作为产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊原文只有阴性形式、意为“金制的”的形容词；所修饰的名词承接上文而省略。这里补作“扣”。也可能指胸针、饰物或扣饰。
    reason: lexical_alternative
  - marker: b
    text: “阿卡隆”是按希腊文形式音译的地名，通常称为“以革伦”。
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
  choice: 金扣
  rationale: 原文只有阴性形容词“金的”，所修饰的名词承前省略。为使中文完整，按上下文补出“扣”；因具体器物仍有不确定性，附注说明。
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: 照惯例，这是赐给……的
  rationale: 既保留“惯例”的含义，也以自然的现代汉语表达非人称被动结构。
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: 君王亲族
  rationale: 直译其亲属关系，不将其扩大解释为官职、贵族阶层或所有王室成员。
- source_word: Ἀκκαρὼν
  choice: 阿卡隆
  rationale: 依希腊文地名形式音译；较常见的传统名称“以革伦”置于脚注，便于辨认。
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: 其全境
  rationale: 此处 ὅρια 指城邑辖界内的全部地域，而不只是边界线；“全境”简洁且符合土地赐予的语境。
- source_word: εἰς κληρονομίαν
  choice: 作为产业
  rationale: 保留土地作为可承受之产业的法律意味，同时避免擅自加入原文未明说的世袭细节。
