  text: And he selected from the country twenty thousand fighting men and horsemen[a], and they marched against Kendebaios, and camped in Modein.
translation:
  language: zh_hans
  text: 他从当地选出两万名战士和骑兵；他们向肯德拜奥进军，并在摩丁宿营[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“睡在摩丁”；在这里的行军语境中，意思是他们在那里过夜宿营。
    reason: 说明由字面义到军事语境义的翻译。
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: 选出
  rationale: 表达从较大群体中有意挑选人员，符合军事征募语境。
- source_word: ἐκ τῆς χώρας
  choice: 从当地
  rationale: χώρα在此指周围地区或境内；“当地”比“从国家”更符合现代汉语，也不把范围限定为某座城。
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: 两万名战士
  rationale: 保留明确人数及作战人员的含义；现代汉语中“战士”自然简洁。
- source_word: ἱππεῖς
  choice: 骑兵
  rationale: 指骑马作战的人；“骑兵”是现代汉语中自然的军事称谓。希腊文未另列骑兵人数，因此译文也不补明。
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: 向肯德拜奥进军
  rationale: ἐπί加宾格在军事叙事中表示朝敌手进发；“进军”体现敌对行动，又不额外说明交战结果。
- source_word: ἐκοιμήθησαν
  choice: 宿营
  rationale: 字面义为“睡下”，在行军语境中指夜间停驻；“宿营”准确传达实际语用。
- source_word: Μωδαείμ
  choice: 摩丁
  rationale: 采用该地名在现代中文中的简洁音译形式。
