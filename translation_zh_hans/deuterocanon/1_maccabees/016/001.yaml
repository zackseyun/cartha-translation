lexical_decisions:
- source_word: ἀνέβη
  choice: 上来
  rationale: 保留ἀναβαίνω所表达的上行方向；“上来”在叙事中自然，也与希腊文的简单过去时相称。
- source_word: Γαζάρων
  choice: 迦撒拉
  rationale: 依希腊文地名Γάζαρα的形式音译，不改用源自希伯来文的另一地名形式。
- source_word: ἀπήγγειλεν
  choice: 报告
  rationale: 此词指把消息带回并陈报；“报告”符合本节军事与政治语境。
- source_word: συνετέλει
  choice: 正在做的事
  rationale: 未完成时态呈现持续中的行动；这一译法自然，并保留该动词既可泛指所做之事、也可指执行计划的语义空间。
- source_word: Κενδεβαῖος
  choice: 肯德拜
  rationale: 按希腊文人名作现代汉语音译，避免借英语拼写转译。
