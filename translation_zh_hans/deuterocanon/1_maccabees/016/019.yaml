  yaml_path: translation/deuterocanon/1_maccabees/016/019.yaml
  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: zh_hans
  text: 他派其他人到加匝拉[b]去带走约翰[a]；又写信给千夫长们，叫他们到他那里来，好让他把金银和礼物给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带走”也可译作“移走”或“除去”。希腊语原词可指拿走、带走或移走；上下文显示敌意，却没有明确说明具体手段。
    reason: lexical_alternative
  - marker: b
    text: “加匝拉”是本节希腊文所用的地名形式，对应较常见的地名“基色”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派；写信给
  rationale: 此动词在两处都表示差遣或发送；前者按人物宾语译为“派”，后者与“信”搭配自然译作“写信给”。
- source_word: ἑτέρους
  choice: 其他人
  rationale: 保留希腊文未进一步说明身份的泛指，不擅自补入军士或刺客等身份。
- source_word: Γάζαρα
  choice: 加匝拉
  rationale: 按本节希腊文地名形式音译；该地即较常称为基色的地方，另以脚注说明。
- source_word: ἄραι
  choice: 除掉
  rationale: αἴρω可表示拿走、带走或除去；上下文显示敌对意图，但具体手段并未明说。“除掉”保留其敌对含义，同时不明确限定为逮捕或杀害。
- source_word: τοῖς χιλιάρχοις
  choice: 给千夫长们
  rationale: χילίαρχος本义为统领一千人的军官；“千夫长”是简洁而传统的汉语军职表达。
- source_word: ἐπιστολάς
  choice: 信
  rationale: 采用通常意义“信件”，不强化为原文未明确表达的“命令”。
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: 叫他们到他那里来
  rationale: 自然表达抵达或前来见某人的意思，并与书信所传达的要求衔接。
- source_word: ὅπως δῷ αὐτοῖς
  choice: 好让他……送给他们
  rationale: 保留ὅπως加虚拟式所表达的目的关系；中文用“好让”清楚自然。
- source_word: ἀργύριον καὶ χρυσίον
  choice: 金银
  rationale: 原文次序为“银和金”，现代汉语固定搭配“金银”更自然，含义不变。
- source_word: δόματα
  choice: 礼物
  rationale: δόματα泛指赠礼；“礼物”既通俗又不额外限定其性质。
