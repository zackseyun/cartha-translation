  yaml_path: translation/deuterocanon/1_maccabees/016/010.yaml
  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: zh_hans
  text: 他们逃进阿佐托斯田野间的塔楼里[a]；他放火焚烧了那地方[b]。他们中约有一千人阵亡[c]，他便平安返回犹太地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿佐托斯”是“亚实突”的希腊名称。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他用火焚烧了它”。其中代词“它”是单数，可能概括指整片设防之地，而不是逐一指复数的“塔楼”。
    reason: lexical_alternative
  - marker: c
    text: 或译“一千人”；这里的希腊文表达可能表示约数。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: 逃进
  rationale: 既表达军事溃逃，也结合 εἰς 所表示的进入方向，使现代汉语自然清楚。
- source_word: πύργους
  choice: 塔楼
  rationale: 保留该词具体的防御性建筑形象，不扩大解释为“堡垒”或“要塞”。
- source_word: ἐν τοῖς ἀγροῖς
  choice: 田野间
  rationale: 贴近“在田地、乡野中”的基本含义，同时符合现代汉语地理描写习惯。
- source_word: Ἀζώτου
  choice: 阿佐托斯
  rationale: 按希腊名称音译，保留本书希腊文本的专名形式；其对应的希伯来名称另见脚注。
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: 他放火焚烧了那地方
  rationale: 保留动词的纵火焚烧含义，并用单数概括性指称“那地方”来反映希腊文阴性单数代词 αὐτήν，避免擅自改成复数“塔楼”。
- source_word: ἔπεσον
  choice: 阵亡
  rationale: 在战事叙述中，该词指倒下并死亡；“阵亡”自然传达这一语境含义。
- source_word: ἐξ αὐτῶν
  choice: 他们中
  rationale: 简洁体现部分关系，即死者出自逃亡的那一群人。
- source_word: εἰς ἄνδρας χιλίους
  choice: 约有一千人
  rationale: εἰς 加数量在此可表达达到大约某数；“约有”保留其可能的约数意味。
- source_word: ἀπέστρεψεν
  choice: 返回
  rationale: 准确表达行动结束后回到原地或本土。
- source_word: μετʼ εἰρήνης
  choice: 平安
  rationale: 自然表达未再遭遇冲突、安然返回的意思，同时保留圣经叙事的庄重语感。
