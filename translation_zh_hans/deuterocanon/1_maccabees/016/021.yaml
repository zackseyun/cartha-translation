  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: zh_hans
  text: 他先跑去，向在迦泽拉的约翰报信说：“你的父亲和兄弟都丧命了；他也已经派人去杀你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他也已经派遣，要杀你。”希腊文没有明说“派遣”的宾语；正文为使中文清楚而补出“人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: 跑在前面
  rationale: 兼顾“走在前头”和急速奔跑的含义，保留报信时的紧迫感。
- source_word: ἀπήγγειλεν
  choice: 报信
  rationale: 此处指把突发消息传给约翰；“报信”比“宣布”自然，也符合信使语境。
- source_word: εἰς Γάζαρα
  choice: 向在迦泽拉的约翰
  rationale: 按整个结构自然处理为约翰当时位于迦泽拉，同时保留消息传向约翰的关系。
- source_word: ἀπώλετο
  choice: 遇害了
  rationale: 上下文所报的是暴力死亡；“遇害”既清楚又不在动词本身之外具体说明死亡方式。
- source_word: Ἀπέσταλκεν
  choice: 已经派人
  rationale: 完成时表示派遣已经发生且危险仍然迫近。希腊文未明说所派的宾语，中文为通顺补出“人”。
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: 也……来杀你
  rationale: 保留καὶ σέ所表达的递进重点，即约翰也同样是谋杀目标。
