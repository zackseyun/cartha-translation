  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: zh_hans
  text: 托勒密写了这些事，又送给王，请王派军队来援助他，并交出他们的地区和城邑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν ταῦτα
  choice: 把这些事写下来
  rationale: 既保留“写”的明确动作，也以自然汉语表达“写下这些事”。
- source_word: ἀπέστειλεν τῷ βασιλεῖ
  choice: 派人送给王
  rationale: 原文省略所送之物的宾语，语境上指所写的内容；译文保留书面传递的动作，又避免生硬的“发送给王”。
- source_word: δυνάμεις
  choice: 军队
  rationale: 此处复数指可供军事援助的兵力或部队，译作“军队”清楚自然。
- source_word: εἰς βοήθειαν
  choice: 来支援他
  rationale: 表达军队被派来的目的，即为托勒密提供援助。
- source_word: χώραν
  choice: 地区
  rationale: 该词可指土地、疆域或地区；此处选择中性的“地区”，不额外断定其政治性质。
- source_word: πόλεις
  choice: 城邑
  rationale: 在古代叙事语境中，“城邑”比现代行政意义较强的“城市”更贴切。
theological_decisions:
- issue: παραδῷ的隐含间接宾语及αὐτῶν的指代
  choice: “把他们的地区和城邑交给他”
  alternative: “交出他们的地区和城邑”或“把自己的地区和城邑交给他”
  rationale: παραδῷ未明说接受者，但与前面的αὐτῷ自然衔接，可理解为交给托勒密；αὐτῶν为第三人称复数“他们的”，译文保留这一指代，不改成“自己的”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”依照上下文保留普通称号；“城邑”体现古代历史文本的语域。
