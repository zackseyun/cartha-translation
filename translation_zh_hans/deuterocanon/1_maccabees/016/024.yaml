    text: 直译：“他任大祭司日子的书”。也可译作“他任大祭司期间的年鉴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留希腊文引人注意、郑重指示的语气，也适合全书结尾的档案式说明。
- source_word: ταῦτα
  choice: 这些事
  rationale: 中性复数概括前文所叙述的诸事；译作“这些事”范围清楚自然。
- source_word: γέγραπται
  choice: 都记在……上
  rationale: 希腊文完成时被动语态表示这些内容已经写下并存于记录中；中文以“记在……上”自然表达其档案意义，“都”照应复数范围。
- source_word: ἐπὶ βιβλίῳ ἡμερῶν ἀρχιερωσύνης αὐτοῦ
  choice: 在他任大祭司期间的史册上
  rationale: 该短语直译近于“在他大祭司职任日子的书上”，很可能指按时日编录的官方记录；正文采用自然的“史册”，脚注保留字面结构。
- source_word: ἀφʼ οὗ
  choice: 自……之时起
  rationale: 明确标示所述记录涵盖时期的起点，并保持结句庄重流畅。
- source_word: ἐγενήθη ἀρχιερεὺς
  choice: 成为大祭司
  rationale: 忠实表达就任该职，且不引入原文未明说的任命者。
- source_word: μετὰ τὸν πατέρα αὐτοῦ
  choice: 继父亲之后
  rationale: 此处不仅表示时间先后，也含接续父亲职任之意；“继……之后”简洁保留继任含义。
