    text: 或译“急流”或“季节性河床”。希腊词指冬季或雨季流动的水道，既可指水流本身，也可指其河床。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: 他们清早起来
  rationale: 分词与时间短语表示起行前的动作；“清早起来”自然地保留了时间和先后次序。
- source_word: ἐπορεύοντο εἰς τὸ πεδίον
  choice: 往平原去
  rationale: 未完成过去时描写他们正在行进；汉语叙事无需生硬标出持续体。“平原”符合军事场景中的开阔平地。
- source_word: καὶ ἰδού
  choice: 看哪
  rationale: 保留原文引人注意、呈现突发景象的叙事语气。
- source_word: δύναμις πολλὴ
  choice: 一支大军
  rationale: δύναμις在此指军事力量；“大军”简洁自然，并由下文的步兵和骑兵得到明确。
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: 迎面而来
  rationale: 表达对方向他们接近、相遇的动作，同时不把原词本身未明说的攻击行动加进译文。
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: 步兵和骑兵
  rationale: 采用现代汉语中清楚而标准的军事类别名称。
- source_word: χειμάρρους
  choice: 溪谷
  rationale: 该词可指冬季或雨季有水奔流的季节性水道，也可指其河床；正文用易懂的“溪谷”，并以脚注保留具体词义范围。
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: 双方之间隔着
  rationale: 自然表达这道地形位于两支军队之间并将其隔开的空间关系。
