base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: zh_hans
  text: 西门召来他的两个年长的儿子，就是犹大和约翰，对他们说：“我和我的弟兄们，以及我父家，从年轻时直到今天，一直为以色列争战；我们多次成功地解救了以色列[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为：“在我们手中，解救以色列这件事多次亨通。”希腊文以“亨通／成功”表达他们多次得以解救以色列。
    reason: 说明 εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν 的特殊、近乎非人称的成功结构；正文采用自然的现代汉语表达，未增添明确的神圣行动者。
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: 他的两个年长的儿子
  rationale: πρεσβυτέρους 是比较级，表示“年长的”；此译法不武断地暗示西门总共只有两个儿子，也不将其解释为“最年长的两个”。
- source_word: ἐπολεμήσαμεν τοὺς πολέμους Ἰσραήλ
  choice: 一直为以色列争战
  rationale: 结合“从年轻时直到今天”表达持续至今的经历；“为以色列争战”在现代汉语中自然，同时保留属格可能表达以色列相关战争的宽度。
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: 从年轻时直到今天
  rationale: 自然表达由青年时期延续到说话当日的时间跨度；原文“年轻”未明示所有格，中文也无须补出。
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: 我们手中所做的亨通
  rationale: 保留 εὐόδοομαι 的“亨通、顺利成功”之意及“在我们手中”的原文意象；正文虽略带经文语体，但仍可理解，并以脚注提供更动态的译法。
- source_word: ῥύσασθαι τὸν Ἰσραήλ
  choice: 解救了以色列
  rationale: ῥύομαι 在军事危难语境中指救出、解救；“解救”避免额外引入更全面的救恩含义。
- source_word: πλεονάκις
  choice: 多次
  rationale: 准确表达重复发生许多次，简洁自然。
theological_decisions:
- issue: 以色列获救时行动者与成功来源的关系
  choice: 保留人的行动以及“亨通”的表达，不明说上帝是主语
  alternative: 译作“我们多次成功地解救了以色列”
  rationale: 原文明确以西门家族为实施解救的人，却没有明说使他们成功的是上帝；译文不应补入未明示的神圣行动者，也不应消除“亨通”一词可能带有的护理意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父家的人”保留古代亲族共同体的含义；“亨通”稍具经文语体，用来保存原文成功／顺利及“在手中”的意象。
