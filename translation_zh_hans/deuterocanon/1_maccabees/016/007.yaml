  text: And he divided the people and the horsemen among the foot soldiers; but the cavalry of the enemy was very numerous.
translation:
  language: zh_hans
  text: 他把部众和骑兵分开，部署在步兵中间；敌军的骑兵非常多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεῖλεν
  choice: 分队
  rationale: 该动词意为“分开、分配”。此处是军事部署语境，“分队”自然表达把部众划分编组的意思，同时不具体断定其战术阵形。
- source_word: τὸν λαόν
  choice: 众人
  rationale: 原文直译为“人民、众人”，在本书语境中可指受指挥的战斗人员。“众人”既保留原词较宽的含义，也适合当前军事上下文。
- source_word: τοὺς ἱππεῖς
  choice: 骑兵
  rationale: 指骑马作战的人；现代汉语以“骑兵”最简明自然。
- source_word: ἐν μέσῳ τῶν πεζῶν
  choice: 在步兵中间
  rationale: πεζοί 指徒步作战者，即步兵；“在……中间”准确传达骑兵被配置于步兵之中的空间关系。
- source_word: ἡ δὲ ἵππος
  choice: 而……骑兵
  rationale: ἵππος 字面为“马”，但此处用单数集合名词指骑兵部队，译作“骑兵”符合现代汉语军事表达。
- source_word: τῶν ὑπεναντίων
  choice: 敌军的
  rationale: 该词指对立者或敌对一方；在战事语境中，“敌军”比“对手”更明确自然。
- source_word: πολλὴ σφόδρα
  choice: 非常多
  rationale: 该短语强烈强调数量众多；“非常多”简洁而准确，不把数量含义误译为抽象的“强大”。
