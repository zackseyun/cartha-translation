  text: And he committed a great act of treachery[a], and repaid evil for good.
translation:
  language: zh_hans
  text: 他犯下了严重的背信之举[a]，以恶报善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“严重违背信义”或“极其不忠”。希腊语原词可指违背信任、约定或义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: 犯下了
  rationale: 与表示恶行的名词搭配时，意为实施、犯下；“犯下”符合现代汉语习惯，也保留明确的道德谴责。
- source_word: ἀθεσίαν
  choice: 背信之举
  rationale: 该词可指违背信任、约定或义务；上下文所指是具体的背叛行为，因此译为“背信之举”，避免泛化为抽象的“不法”。
- source_word: μεγάλην
  choice: 大逆不道的
  rationale: 原词强调行为的严重程度。结合汉语表达，以“大逆不道的”突出这次背信行为性质极其严重，而非仅指规模大。
- source_word: ἀνταπέδωκεν
  choice: 报
  rationale: 该动词表示回报、报还；在固定汉语表达“以恶报善”中，“报”准确传达相应的回报关系。
- source_word: κακὰ
  choice: 恶
  rationale: 原文中性复数可指恶事或恶待；“恶”保留其广泛的道德含义，不局限于具体伤害。
- source_word: ἀντὶ ἀγαθῶν
  choice: 以恶报善
  rationale: ἀντί在此表示交换或回报关系；“以恶报善”是自然凝练的现代汉语成语，清楚保留善恶对照。
theological_decisions:
- issue: ἀθεσία的道德性质
  choice: 译为关系性的背信行为“背信之举”
  alternative: 大大地行了不法／极其不忠／严重违背信义
  rationale: 叙事语境谴责的是一项具体背叛，不宜把词义抽象化为一般的违法或不敬；正文保留背信这一关系和义务层面的含义，脚注则呈现其词义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“犯下……背信之举”贴近原文结构；“大逆不道”强化 μεγάλην 所表达的严重性，“以恶报善”自然保留原文鲜明的善恶对照。
