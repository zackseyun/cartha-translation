  yaml_path: translation/deuterocanon/1_maccabees/016/006.yaml
  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: zh_hans
  text: 他和他的军兵在他们对面安营。他见众人害怕渡过那条旱溪[a]，就率先渡了过去；众人见他过去，也跟在他后面渡了过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“急流”或“河床”；希腊词指雨季常有水、旱季可能干涸的季节性水道。
    reason: 说明χείμαρρους的语义范围，并保留可行的译法。
lexical_decisions:
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 该动词在军事叙事中通常指扎营；“安营”自然简洁，并保留军事场景。
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: 在他们对面
  rationale: 该短语表示位于对方面前或与其相对；“在他们对面”准确传达双方对峙的位置关系。
- source_word: ὁ λαὸς αὐτοῦ
  choice: 他的军兵
  rationale: λαός本义为“民众、众人”，但此处处于军事行动语境，所指是跟随他的部队；译作“军兵”可避免误解为一般百姓。
- source_word: δειλούμενον
  choice: 害怕
  rationale: 此处分词描述众人因恐惧而不敢前进，并不必然带有“怯懦”的道德评判；“害怕”保留这一中性含义。
- source_word: διαπερᾶσαι
  choice: 渡过
  rationale: 在跨越季节性水道的语境中，“渡过”比一般性的“穿过”更自然。
- source_word: τὸν χειμάρρουν
  choice: 那条季节河
  rationale: χείμαρρους指雨季有水、旱季可能干涸的水道；“季节河”在现代汉语中较易理解，并以脚注补充其他可能译法。
- source_word: διεπέρασεν πρῶτος
  choice: 率先渡了过去
  rationale: πρῶτος强调他首先行动并起带头作用；“率先”保留叙事中的领导意味。
- source_word: οἱ ἄνδρες
  choice: 众人
  rationale: 原文直译为“那些人/男人”，在此指同行的人员；“众人”与上文呼应，又不额外加入原文没有明说的所属关系。
- source_word: κατόπισθεν αὐτοῦ
  choice: 跟在他后面
  rationale: 该短语表示众人循着他走过的路线前进；“跟在他后面”符合现代汉语叙事习惯。
theological_decisions: []
