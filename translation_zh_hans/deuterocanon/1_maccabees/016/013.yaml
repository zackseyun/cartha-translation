    text: 或译：“他变得骄傲”；直译：“他的心被高举起来。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他们除去。”希腊文意为“移除他们”；在本段语境中很可能暗指以暴力杀害他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: 他的心高傲起来
  rationale: 保留“心……起来”的源语意象，同时以现代汉语自然传达自高、骄傲之意；脚注补出更直译的表达。
- source_word: ἐβουλήθη
  choice: 想要
  rationale: 表达已经形成的意图，但不把语气强化为已经作出不可更改的决定。
- source_word: κατακρατῆσαι τῆς χώρας
  choice: 夺取这国家的控制权
  rationale: κατακρατέω加属格表示取得支配权；此处政治语境下“夺取……控制权”比单纯“占有”更准确。
- source_word: ἐβούλευετο
  choice: 谋害
  rationale: 结合δόλῳ、敌对对象以及目的短语ἆραι αὐτούς，此处指策划加害；“谋害”在现代汉语中简洁自然，并保留阴谋意味。
- source_word: δόλῳ
  choice: 用诡计
  rationale: 将工具或方式的与格明确译出，保留欺骗、奸诈的含义。
- source_word: ἆραι αὐτούς
  choice: 除掉他们
  rationale: αἴρω本义可指拿走、移除；敌对语境很可能暗指杀害，但正文不把隐含意思明确化，脚注说明其语境力度。
- source_word: χώρα
  choice: 国家
  rationale: 该词可指土地、地区或国家；在争夺政治统治权的上下文中，“国家”最贴切。
- source_word: Σίμωνος
  choice: 西满
  rationale: 采用适合《玛加伯书》语境的传统汉语音译，同时准确指称人名Simon。
- source_word: τῶν υἱῶν αὐτοῦ
  choice: 他的众子
  rationale: 保留复数所指，并用“众子”形成简洁、庄重的经文语体。
