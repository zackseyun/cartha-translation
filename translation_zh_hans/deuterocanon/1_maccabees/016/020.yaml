lexical_decisions:
- source_word: ἑτέρους
  choice: 另一些人
  rationale: 指另外派出的人员，与前文提到的人有别；“另一些人”在现代汉语中自然，并保留原文的不定复数。
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 叙事中表示派人执行任务；“派”简洁自然，且比单纯的“送”更符合使命语境。
- source_word: καταλαβέσθαι
  choice: 夺取
  rationale: 在军事政治语境中表示取得并控制目标；“夺取”体现敌对行动，又不额外限定具体手段。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: 圣殿山
  rationale: ὄρος意为山或山丘，ἱερόν指圣所或圣殿范围；“圣殿山”是清楚自然的现代中文表达，同时脚注保留其较为字面的结构。
