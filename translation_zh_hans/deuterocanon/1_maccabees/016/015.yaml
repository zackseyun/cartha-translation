  yaml_path: translation/deuterocanon/1_maccabees/016/015.yaml
  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
translation:
  language: zh_hans
  text: 亚布布的儿子以诡诈把他们迎进那座名叫多克、由他建造的堡垒；他为他们大摆酒宴[a]，又在那里藏了人手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“为他们大摆饮酒的筵席”；希腊词 πότος 特别侧重饮酒，也可泛指宴饮。
    reason: 说明希腊文的词义侧重，并保留“饮酒筵席”这一较为字面的译法。
lexical_decisions:
- source_word: ὑπεδέξατο
  choice: 迎进
  rationale: 此动词表示接待、迎接宾客；结合其后的地点短语，译作“把他们迎进”既自然，也清楚交代他们进入堡垒。
- source_word: ὁ τοῦ Ἀβουβον
  choice: 亚布布的儿子
  rationale: 希腊文用省略式父名结构指称主语。这里保留原文的父名称谓，不根据上下文补入其个人名字。
- source_word: εἰς τὸ ὀχύρωματιν
  choice: 进……堡垒
  rationale: 底本词形虽不寻常，语义显然指设防之处；“堡垒”是现代汉语中自然且准确的对应。
- source_word: τὸ καλούμενον Δὼκ
  choice: 堡垒名叫多克
  rationale: 直接表达命名结构；“多克”按希腊文 Δώκ 音译。
- source_word: μετὰ δόλου
  choice: 心怀诡诈
  rationale: 保留 δόλος 所表达的欺骗和设局意味，同时不把它强化为原文未明说的具体罪名。
- source_word: ὃ ᾠκοδόμησεν
  choice: 他建造的那座堡垒
  rationale: 关系从句所指为堡垒；汉语前置定语能清楚保留这一关系。
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: 他为他们大摆酒宴
  rationale: πότος 字面着重饮酒，但此处也指盛大的宴饮接待。“大摆酒宴”兼顾饮酒含义和自然汉语表达，另以脚注说明字面侧重。
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: 又预先把一些人藏在那里
  rationale: 译出蓄意藏人的动作；“预先”符合伏击安排的语境，但不具体说明这些人的身份或人数。
