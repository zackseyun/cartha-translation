- source_word: ἦν
  choice: 是
  rationale: 未完成时在这里表达过去持续存在的身份关系；汉语叙事中用“是”即可自然呈现，无须另加时间标记。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明原因；“因为”在现代汉语中清楚保留其解释性关联。
- source_word: γαμβρὸς
  choice: 女婿
  rationale: 此词可泛指姻亲，也可指新郎；结合语境，最可能特指大祭司的女婿。因词义本身范围较宽，以脚注保留这一可能性。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司的
  rationale: ἀρχιερεύς在犹太语境中是“大祭司”的标准称谓；属格结构自然译作“大祭司的”。
