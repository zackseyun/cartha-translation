  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: zh_hans
  text: 至于约翰其余的事、他的战争、他所立下的英勇功绩、他修筑城墙的工程，以及他的作为——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ τῶν λόγων Ἰωάννου
  choice: 约翰其余的事迹
  rationale: λόγων 在这段史书结语中指关于约翰生平事业的记述内容，而非单指言语；用“事迹”自然地概括这些材料。
- source_word: πολέμων
  choice: 战争
  rationale: 保留复数所涵盖的广泛军事冲突，不缩窄为个别战役。
- source_word: ἀνδραγαθιῶν ... ὧν ἠνδραγάθησεν
  choice: 他所立下的英勇功绩
  rationale: 名词和同源动词形成强调性重复；汉语采用“所立下的英勇功绩”，既传达勇武、卓越之意，也避免生硬重复。
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: 他所修筑的城墙
  rationale: 将希腊语名词与同源动词的重复压缩为自然汉语关系结构；τειχέων 指防御性城墙。
- source_word: πράξεων
  choice: 他所做的一切
  rationale: 此词作为清单末项，广泛概括约翰的其他行动；“所做的一切”保持其宽泛性并适合未完结的结语句式。
- source_word: Καὶ
  choice: 至于
  rationale: 本节承接前文并引出史书结尾的资料索引式陈述；“至于”比直译“并且”更符合现代汉语结语表达。
