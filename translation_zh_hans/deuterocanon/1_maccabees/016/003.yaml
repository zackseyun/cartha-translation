base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: zh_hans
  text: 但如今我已经年老了；你们也蒙怜悯，年纪已足够。[a]你们要接替我和我兄弟的位置，[b]出去为我们的民族争战。愿从天上来的帮助与你们同在。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙怜悯”原文没有明说是谁施予怜悯；按上下文，很可能是指上帝的怜悯。
    reason: lexical_alternative
  - marker: b
    text: 直译为“成为代替我和我兄弟的人”，意思是接替他们的位置。
    reason: alternative_reading
  - marker: c
    text: “从天上来的帮助”是含蓄而敬虔的说法，意指神圣的援助，却没有直接称说上帝。
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: 我已经年老了
  rationale: 完成时表达年老过程所形成的现状；“已经年老了”在现代汉语中自然，并兼顾过程与当前状态。
- source_word: ἐν τῷ ἐλέει
  choice: 蒙怜悯
  rationale: 原文直译近于“在怜悯中”，没有明说怜悯的施予者；“蒙怜悯”保留被施恩的意味，同时不在正文中补出“上帝”。
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: 年岁已经足以担当重任
  rationale: ἱκανοί表示足够、胜任，与“年岁”连用，意为年龄和成熟程度已足以承担任务；这样译比“年纪够大”更符合此处委以军政责任的语境。
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: 接替我和我兄弟的位置
  rationale: ἀντί加属格表达替代；此译清楚保留“代替、接任”的含义，也符合现代汉语表达。
- source_word: ὑπερμαχεῖτε
  choice: 为……争战
  rationale: 该动词指为某一方作战、护卫；“为……争战”兼顾战斗与维护本民族的含义。
- source_word: ἔθνους
  choice: 民族
  rationale: 在《马加比传》的语境中指犹太这一民族共同体；“民族”比现代政治意义较强的“国家”更稳妥。
- source_word: ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: 从天上来的帮助
  rationale: 保留帮助来源于“天上”的意象和对神圣援助的含蓄指称，不直接补出“上帝”。
- source_word: ἤτω μεθʼ ὑμῶν
  choice: 愿……与你们同在
  rationale: 第三人称命令式在此具有祈愿、祝福语气，现代汉语以“愿”表达最自然。
theological_decisions:
- issue: “怜悯”和“从天上来的帮助”所含的神圣施事者
  choice: 正文保留含蓄说法，不补出“上帝”
  alternative: 译作“蒙上帝怜悯”及“愿上帝从天上帮助你们”
  rationale: 上下文自然使人想到上帝的怜悯和援助，但希腊文本在本节没有明确称名；保留含蓄表达可避免把隐含意义改成明说。
- issue: ἔθνος所指共同体的性质
  choice: 译作“民族”
  alternative: 译作“国家”或“百姓”
  rationale: 这里兼有族群和政治共同体色彩；“民族”保留这种张力，不把它完全限定为现代主权国家或单纯人口群体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“担当重任”将年龄上的足够与语境中的胜任联系起来；短句和祈愿句保留临战嘱托与祝福的语气。
