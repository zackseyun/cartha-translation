  yaml_path: translation/deuterocanon/1_maccabees/016/008.yaml
  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
translation:
  language: zh_hans
  text: 他们吹响号角，肯德拜乌斯和他的军队陷入混乱[a]。他们中有许多人负伤倒下[b]，其余的人逃进了堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溃败了”“被击退了”或“被打得四散奔逃”。希腊语这个军事用语可表示军队陷入混乱，也可带有被击溃、败退的较强含义。
    reason: lexical_alternative
  - marker: b
    text: “负伤倒下”贴近希腊原文；这里不一定表示这些人全都死亡，也可以指他们在战斗中受伤倒地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: 吹响号角
  rationale: 以自然的现代汉语表达吹奏军用号角、发出战斗信号的动作，同时保留原文的具体意象。
- source_word: ἐτροπώθη
  choice: 溃败了
  rationale: 该动词在军事语境中通常指被击溃、败退；“溃败”准确传达其军事含义，而后文再具体叙述余众逃跑，并不构成不必要的重复。
- source_word: παρεμβολὴ
  choice: 军队
  rationale: 该词可指营地或驻营的军队；这里它与统帅并列，又承受溃败、伤亡和逃亡，因此“军队”比字面的“营地”更符合所指。
- source_word: ἔπεσον ... τραυματίαι πολλοί
  choice: 有许多人负伤倒下
  rationale: 紧贴原文“许多伤者倒下”的结构，既呈现战场上的倒地，也不武断地说这些人全都死亡。
- source_word: οἱ ... καταλειφθέντες
  choice: 其余的人
  rationale: 自然表达仍然留下、没有倒下的那部分人；比“幸存者”更少暗示前述伤者已经死亡。
- source_word: ὀχύρωμα
  choice: 堡垒
  rationale: 指设防并可供退守的坚固地点；“堡垒”简明、具体，符合军事场景。
