  yaml_path: translation/deuterocanon/1_maccabees/016/009.yaml
  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
translation:
  language: zh_hans
  text: 那时，约翰的兄弟犹大受了伤；约翰却追赶他们，直到他来到克德龙[a]；这地方是他[b]先前建造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “克德龙”音译希腊文地名 Κεδρών；也可按其他音译传统写作“刻德龙”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文“建造”的主语没有明说。紧邻句法可使人理解为约翰；但按上文16:8，建造克德龙的是肯德拜。因此正文保留“他”的指代未定。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: 受了伤
  rationale: 这是不定过去时被动语态，在战事语境中表示犹大遭受创伤；“受了伤”自然、准确，不把伤势程度说得过重。
- source_word: κατεδίωξεν
  choice: 继续追赶
  rationale: 该动词表示紧追、追击逃走的敌军；“继续追赶”既体现追击动作，也承接前文战斗叙事。
- source_word: ἕως ἐλθεῖν
  choice: 直到来到
  rationale: 这一结构说明追赶所达到的界限。希腊文不定式没有明示主语，按紧邻句法最自然地由约翰承接；中文省略主语可保留一定的原文含蓄性。
- source_word: Κεδρών
  choice: 克德龙
  rationale: 按希腊文地名 Κεδρών 音译，采用适合现代汉语的形式。
- source_word: οἰκοδόμησεν
  choice: 先前建造
  rationale: 动词通常指“建造”。加入“先前”明确建造发生在此次抵达以前，但不增添原文没有明说的“加固”之义。
theological_decisions:
- issue: 关系从句“ἣν οἰκοδόμησεν”中省略主语的所指
  choice: 译作“就是他先前建造的地方”，保留“他”的指代空间
  alternative: 明确译作“就是约翰先前建造的地方”或“就是肯德拜先前建造的地方”
  rationale: 希腊文动词只以第三人称单数形式出现，并未明说主语。紧邻语法可能使人想到约翰，但上文叙事把克德龙的建造归于肯德拜；因此不宜在正文中消除这项真实的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”呈现 δέ 的转折，“继续追赶”符合军事场景；正文保留省略主语所造成的指代含混，并以脚注交代上下文证据。
