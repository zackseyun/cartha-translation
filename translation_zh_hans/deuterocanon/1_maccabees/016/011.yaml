lexical_decisions:
- source_word: Καὶ
  choice: 承接上文，不另译“和”
  rationale: 本句在叙事中承接上文；现代汉语句首不必机械译出连接词，省略后语流更自然，也不增添时间意味。
- source_word: Πτολεμαῖος ὁ τοῦ Ἀβούβου
  choice: 亚布布的儿子托勒密
  rationale: 属格结构在这里表示父子关系；明确译为“亚布布的儿子”，符合现代汉语的人物介绍方式。人名按希腊文音译。
- source_word: ἦν καθεστημένος
  choice: 已被任命为
  rationale: 迂回结构表达先前任命所形成的现存状态；“已被任命为”兼顾被动意义与结果状态。
- source_word: στρατηγὸς
  choice: 总督
  rationale: 该词兼有将领和地方军政长官之义；此处与所辖地域连用，译作“总督”最能自然表达其地区管辖职务，同时以脚注保留军事长官的词义可能。
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  choice: 耶利哥平原的
  rationale: εἰς在职衔语境中指管辖范围；“耶利哥平原的总督”自然表达对该地区的权力，并保留πεδίον“平原”的具体地理含义。
- source_word: ἀργύριον καὶ χρυσίον πολύ
  choice: 拥有许多金银
  rationale: 按自然汉语习惯将“银和金”译为“金银”；补出“拥有”承接εἶχεν，直接表达其财富丰厚。
