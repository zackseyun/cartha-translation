base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/016.yaml
  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: zh_hans
  text: 西门和他的儿子们都喝醉了的时候，托勒密和同他在一起的人便起身拿起武器，进入宴席[a]，向西门下手，杀了他和他的儿子们，又杀了一些年轻侍从。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴席”或译“饮酒聚会”；希腊词可特指以饮酒为主要内容的宴会。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: 喝醉以后
  rationale: 该不定过去时被动形式在这里表示进入醉酒状态；“喝醉以后”既保留这一动态含义，也自然地交代袭击发生的时机。
- source_word: ἐξανέστη
  choice: 起身
  rationale: 表示托勒密等人开始采取果断行动；“起身”简洁自然，并保留叙事推进力。
- source_word: οἱ μετʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 原文没有明确这些人的身份或关系，因此不用“部下”或“同伴”等更具体的称谓。
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: 拿起武器
  rationale: 准确表达拿取并准备使用武器的动作，同时不额外强化为“夺取”或“抄起”。
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι
  choice: 闯进……袭击西门
  rationale: 复合动词结合与格带有敌对地进入、扑向某人的意味；“闯进……袭击”在现代汉语中自然呈现其移动和敌对性质。
- source_word: συμπόσιον
  choice: 宴席
  rationale: 该词可指宴饮或饮酒聚会；“宴席”符合设宴场景，又不把含义限定为单纯的酒会。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 采用基本词义，不因事件的背叛性质而另加“谋杀”等评价色彩。
- source_word: παιδαρίων
  choice: 少年侍从
  rationale: 该词可指男孩，也可指年轻的仆役或侍从；“少年侍从”兼顾年龄和服侍身份，同时保留原词可能具有的语义张力。
theological_decisions: []
