  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: zh_hans
  text: 他听见这事，就大为惊慌，随即抓住那些前来杀害他的人，把他们杀了，因为他知道他们正想杀害他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: 他听见这事
  rationale: 不定过去时分词在此表示先于主句的动作；补出“这事”使现代汉语自然，所指由上文确定。
- source_word: ἐξέστη σφόδρα
  choice: 大为惊慌
  rationale: ἐξίστημι可指震惊或情绪受到强烈冲击；暗杀语境支持“惊慌”，σφόδρα译作“大为”以保留强烈程度。
- source_word: συνέλαβεν
  choice: 抓住
  rationale: 表达擒获、控制之意，同时避免“逮捕”可能带入的正式司法程序含义。
- source_word: τοὺς ἄνδρας
  choice: 那些……的人
  rationale: 汉语关系结构中用“那些……的人”自然指明这群男子；此处无需另加性别词，因为身份由行为界定。
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: 那些前来杀害他的人
  rationale: 在明确的暗杀情境中，ἀπόλλυμι表示置人于死地，译作“杀害”比“毁灭”更符合现代汉语搭配。
- source_word: ἀπέκτεινεν
  choice: 把他们杀了
  rationale: ἀποκτείνω明确表示杀死；“杀了”直白、现代，并清楚标示结果。
- source_word: ἔγνω
  choice: 他知道
  rationale: 保留原文直接陈述其认知的语气，不额外解释为某一具体获知过程。
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: 他们正想杀害他
  rationale: 未完成时体现持续或正在形成的图谋；“正想”自然表达其意图，并与前面的“杀害”保持词义对应。
