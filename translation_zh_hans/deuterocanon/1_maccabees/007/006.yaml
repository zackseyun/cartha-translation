  yaml_path: translation/deuterocanon/1_maccabees/007/006.yaml
  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: zh_hans
  text: 他们在王面前控告百姓，说：“犹大和他的弟兄们消灭了你所有的朋友[a]，又把我们从我们的土地上驱散了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲信”或“盟友”。在王室语境中，“朋友”可特指王的政治支持者或宫廷近臣。
    reason: 说明φίλοι在希腊化王室语境中的政治或宫廷含义，同时保留正文的基本词义。
lexical_decisions:
- source_word: κατηγόρησαν
  choice: 控告
  rationale: 该动词表示提出指控或罪状；“控告”简洁自然，也符合他们向王作敌意陈诉的正式语境。
- source_word: τοῦ λαοῦ
  choice: 百姓
  rationale: 此处属格作κατηγόρησαν的受事，指被控告的民众；“百姓”直接传达原文，不额外赋予技术性的民族或国家含义。
- source_word: πρὸς τὸν βασιλέα
  choice: 在王面前
  rationale: πρός在陈说或控告的语境中可表示言语所朝向的对象；“在王面前”体现正式呈诉的场景。
- source_word: Ἀπώλεσεν
  choice: 消灭了
  rationale: ἀπόλλυμι在此表示使人灭亡或被除掉；“消灭了”保留其强烈程度，而不把方式限定为“杀死”。
- source_word: οἱ φίλοι σου
  choice: 你所有的朋友
  rationale: “朋友”保留φίλοι的基本义；鉴于希腊化王室语境中该词也可能指政治支持者、盟友或宫廷亲信，相关含义在脚注说明。
- source_word: ἐσκόρπισεν
  choice: 驱散了
  rationale: 该动词表示使人分散、流离；“驱散”既保留外力造成离散的意味，又不具体断定所用手段。
- source_word: ἀπὸ τῆς γῆς ἡμῶν
  choice: 从自己的土地上
  rationale: γῆ可指土地、地域或国土；“自己的土地”自然表达说话者所称归属之地，并避免连续使用两个“我们”造成生硬。
theological_decisions:
- issue: 单数动词Ἀπώλεσεν和ἐσκόρπισεν与“犹大和他的弟兄们”这一并列主语的关系
  choice: 译作“犹大和他的弟兄们消灭了……又把我们……驱散了”
  alternative: 译作“犹大消灭了……，他的弟兄们也与他一同……”以突出犹大的主导地位
  rationale: 希腊文用单数动词并首先点出犹大，可能在叙述上突出其领导地位；现代汉语动词没有单复数形态，因此可自然保留并列主体，而不必补入原文没有的“一同”等解释性措辞。此处不涉及教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”比“国王”更贴合本书连续历史叙事的简洁风格；引语保持直接控诉的力度。
