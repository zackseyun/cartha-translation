  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: zh_hans
  text: 阿尔基慕看见犹大和同他一起的人已经强盛起来，又意识到自己不能抵挡他们[a]，便回到王那里，恶意控告他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本字面作“知道自己能够抵挡他们”，没有“不”字；但上下文强烈表明这里的意思是“不能抵挡他们”。
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: 可是，……看见
  rationale: ὡς与不定过去时在此引出时间情境；δέ带有轻微转折，译作“可是”符合叙事推进。
- source_word: ἐνίσχυσεν
  choice: 已经强盛起来
  rationale: 该动词表示变得强大、力量增强；“已经强盛起来”既呈现变化，也交代阿尔基慕观察到的既成局面。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 跟随他的人
  rationale: 原文直指“与他同在的人”；此处译作“跟随他的人”自然明白，又不擅自限定其身份。
- source_word: ἔγνω
  choice: 知道
  rationale: 可表示知道、认识到；“知道”在现代汉语中简洁自然，并能承载因观察而得出的判断。
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: 自己不能抵挡他们
  rationale: 现存印本文字没有否定词，字面是“自己能够抵挡他们”；但这与前文犹大一方强盛及后文阿尔基慕返回王那里控告的行动明显冲突。正文依上下文采用“不 能”，并以脚注透明说明原文形式。
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: 回到王那里
  rationale: ἐπιστρέφω在这里表示转回、返回；“回到王那里”简洁自然。
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: 恶意控告他们
  rationale: κατηγορέω表示控告，πονηρά赋予控告邪恶、恶毒的性质；“恶意控告”保留法律性动作和道德评价。
theological_decisions:
- issue: δύναται ὑποστῆναι αὐτούς是否应按现存文字译为肯定式
  choice: 正文译作“自己不能抵挡他们”
  alternative: 按现存希腊文直译为“自己能够抵挡他们”
  rationale: 肯定式与紧接着的叙事发展难以协调；上下文强烈暗示原句应含否定意义，可能有否定词在传抄中脱落。为兼顾连贯意义与原文透明度，正文采用否定式，脚注保留外交式文本的字面读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“阿尔基慕”按常见音译处理；“王”保留原文简称。“恶意控告”比“控告他们恶事”更符合现代汉语，同时保留原文对控告行为的负面评价。
