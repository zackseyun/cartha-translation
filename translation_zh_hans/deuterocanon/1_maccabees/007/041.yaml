  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: zh_hans
  text: 当从王那里来的人出言辱骂时[a][b]，你的天使出去，在他们中间击杀了十八万五千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说亵渎的话。”希腊语动词可指辱骂、毁谤，也可指说亵渎的话；正文采用含义较宽的译法。
    reason: lexical_alternative
  - marker: b
    text: 这句话指希西家在位时亚述大军被毁灭的事。参王下19:35；赛37:36。
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: 王的人
  rationale: 原短语指从王那里来、代表王或属于王一方的人。“王的人”简洁自然，并保留其所指可能是王的使者、臣属或军队成员的宽度，不作过度限定。
- source_word: ἐδυσφήμουν
  choice: 出言辱骂
  rationale: 该动词可指说坏话、辱骂、毁谤，也可在针对上帝的语境中表示亵渎。“出言辱骂”保留言语攻击的基本意义，而不在正文中把隐含对象或神学含义明确化。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 直译其移动意象，同时符合现代汉语叙事表达。
- source_word: ἄγγελός σου
  choice: 你的天使
  rationale: ἄγγελος虽也可指使者，但本节所援引的神圣干预事件以天上执行者为背景，因此译作“天使”最切合语境。
- source_word: ἐπάταξεν
  choice: 击杀
  rationale: 该动词本义为击打；在这里结果是大规模死亡。“击杀”既传达打击动作，也明确呈现语境中的致命结果。
- source_word: ἐν αὐτοῖς
  choice: 他们中间
  rationale: 介词短语在这里表示受击群体之内，译为“他们中间”符合汉语习惯。
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: 十八万五千人
  rationale: 准确呈现希腊文明确给出的数目，并按现代汉语经文的行文习惯书写。
theological_decisions:
- issue: 是否将 δυσφημέω 译为明确带有神学含义的“亵渎”
  choice: 出言辱骂
  alternative: 亵渎
  rationale: 本节背景确实涉及敌对者向上帝所发的狂妄言语，但该希腊动词的词义范围更广。正文采用较宽的“出言辱骂”，让针对上帝的神学含义由上下文显明；脚注保留“亵渎”这一可能译法。
- issue: “你的ἄγγελος”所指为何
  choice: 你的天使
  alternative: 你的使者
  rationale: 虽然该词可泛指使者，但此处回顾的是借超自然执行者施行审判的事件，译作“天使”较能反映历史互文的语境，同时不对天使身份作进一步推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王的人”避免把原文进一步限定为使者或军队；“出言辱骂”保持原词的语义宽度。脚注标记均置于相关短语之后，并按正文出现顺序排列。
