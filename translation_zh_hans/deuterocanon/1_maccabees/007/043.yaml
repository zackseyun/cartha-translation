  text: 两军在亚达月十三日交战，尼加挪的军队被击溃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψαν αἱ παρεμβολαὶ εἰς πόλεμον
  choice: 两军……交战
  rationale: 该军事语境中的 συνάπτω 与 εἰς πόλεμον 合起来表示双方投入交战；παρεμβολαί 字面为复数“营地”，在此转指敌对的两支军队。译作“两军交战”既自然，也准确表达双方开战。
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: 在亚达月十三日
  rationale: 与格结构表示时间；“日”虽未明写，却由月份和序数词明确暗含，汉语中补出可使日期表达完整。Ἀδάρ 音译为通行的“亚达”。
- source_word: συνετρίβη
  choice: 被击溃
  rationale: 该被动形式含有被打碎、摧毁之意；用于军队时，“被击溃”既保留其强烈程度，也比字面的“被压碎”更符合现代汉语军事表达。
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: 尼加挪的军队
  rationale: παρεμβολή 可指营地，也可转指驻营的军队。此处作为 συνετρίβη 的主语，所指是尼加挪的军事力量；“军队”在汉语中清楚自然。Νικάνωρ 依次经传统音译作“尼加挪”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事体。希腊文前后以同一词 παρεμβολή 指“营地/军队”，但直译“营地被击溃”在现代汉语中不自然，因此按其军事转喻统一译为“军”。句末不保留源文逗号，作为独立经节用句号收束。
