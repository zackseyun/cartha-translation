lexical_decisions:
- source_word: ἠγωνίσατο
  choice: 竭力争夺
  rationale: ἀγωνίζομαι表示在争斗中奋力争取；结合所争的是一种职位，此处指积极争夺，而不必理解为实际动武。
- source_word: Ἄλκιμος
  choice: 亚基慕
  rationale: 采用《马加比一书》中适合现代汉语、并与希腊语人名相对应的音译。
- source_word: περὶ
  choice: 为争取
  rationale: 与表示争夺的动词连用时，περὶ指出争夺的目标；译为“为争取”能自然表达谋求该职位之意。
- source_word: τῆς ἀρχιερωσύνης
  choice: 大祭司的职位
  rationale: ἀρχιερωσύνη指大祭司的职分、职位或尊位；“大祭司的职位”清楚保留其制度性含义。
