base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: zh_hans
  text: 于是，恐惧和战栗临到全体百姓，因为他们说：“这些人毫无诚信，也不秉公行事；他们违背了所立的约[a]和他们所起的誓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约”也可译作“协议”或“盟约”；希腊词在这里可指正式确立的安排，并有随后的誓言加以保证。
    reason: 说明στάσις在本语境中的词义范围，避免把它过度限定为神学性的盟约或弱化为一般口头约定。
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: 临到
  rationale: 保留情绪突然笼罩众人的动态，同时符合现代汉语的庄重叙事语体。
- source_word: ὁ φόβος καὶ ὁ τρόμος
  choice: 恐惧和战栗
  rationale: φόβος译作“恐惧”，τρόμος保留其由颤抖引申出的强烈惧怕意味，译作“战栗”，避免把两个词合并。
- source_word: εἰς πάντα τὸν λαόν
  choice: 全体百姓
  rationale: 表达恐惧遍及整个群体；“百姓”适合本书的历史叙事语境。
- source_word: ἀλήθεια
  choice: 诚信
  rationale: 此处针对这些人是否可信、是否信守承诺；“诚信”比抽象的“真理”更贴合上下文，同时保留真实可靠的道德含义。
- source_word: κρίσις
  choice: 秉公行事
  rationale: 这里不是单指审判行为，而是指公正的处事原则；动词化表达使现代汉语自然清楚。
- source_word: παρῆρσαν
  choice: 违背了
  rationale: 在约定与誓言的语境中表示破坏、违反已经承担的义务。
- source_word: τὴν στάσιν
  choice: 所立的约
  rationale: στάσις在此与誓言并列，指正式确立的安排或约定；“约”简洁且有正式性，但不必然赋予神学上的“圣约”含义。
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: 所起的誓
  rationale: 保留名词ὅρκος与动词ὤμοσαν之间的同源强调，并用自然的汉语表达。
theological_decisions:
- issue: στάσις是否应使用带有强烈圣约色彩的译语
  choice: 所立的约
  alternative: 协议；盟约
  rationale: 上下文表明这是由誓言加强的正式约定，但στάσις本身不要求特定的神学性“圣约”概念。“所立的约”兼顾正式关系与语义克制，并以脚注说明其他可能译法。
- issue: ἀλήθεια在此译作抽象的“真理”还是关系性的“诚信”
  choice: 诚信
  alternative: 真实；信实
  rationale: 百姓的指控紧接违约和背誓，因此重点是对方不可信、不守承诺；“诚信”保留道德和关系层面的含义，而不把经文误读为抽象命题真理。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“恐惧和战栗”保留原文并列的力度；“毫无诚信，也不秉公行事”自然呈现ἀλήθεια与κρίσις的伦理指控；“所立的约和所起的誓”维持原文两项义务并列，脚注标记[a]已置于正文对应词后。
