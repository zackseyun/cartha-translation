  text: And he himself fell first in the battle. But when his camp saw that Nicanor had fallen[a], they threw down their weapons and fled.
translation:
  language: zh_hans
  text: 他自己在战斗中第一个倒下了。他的军队[a]看见尼加诺倒下，就扔掉武器逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的营中众人”或“他的营地”。
    reason: παρεμβολή可指军营、营地，也可指驻营的军队或部队。
lexical_decisions:
- source_word: ἔπεσεν
  choice: 倒下
  rationale: 保留希腊语“倒下”的战场惯用表达；上下文暗示阵亡，但正文不把含义限定得更死。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 体现代词的强调作用，突出尼加诺本人。
- source_word: πρῶτος
  choice: 第一个
  rationale: 直接保留原文的先后次序含义。
- source_word: ἐν τῷ πολέμῳ
  choice: 在战斗中
  rationale: 此处指眼前的交战，而非范围更广的战争。
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 他的军队
  rationale: παρεμβολή既可指营地，也可转指驻营的军队；此处能“看见”、丢下武器并逃跑的是士兵群体，因此译作“军队”自然且符合语境。
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: 扔掉武器
  rationale: 表现他们在逃跑前弃置兵器的仓皇行动。
- source_word: ἔφυγον
  choice: 逃跑了
  rationale: 符合军事溃败语境，简明自然。
