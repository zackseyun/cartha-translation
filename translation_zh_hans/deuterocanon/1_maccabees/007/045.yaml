  yaml_path: translation/deuterocanon/1_maccabees/007/045.yaml
  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
translation:
  language: zh_hans
  text: 他们从亚大萨追赶敌人，追了一天的路程，直到抵达迦泽拉；又在敌人后面吹响用来传递信号的号角[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“在他们后面吹响信号的号角。”希腊文可较形式地译作“吹响信号的号角”；此处按上下文将代词明确为被追赶的敌人。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωκον
  choice: 追赶
  rationale: 未完成时描写持续进行的军事追击；“追赶”自然清楚，不额外强化为追杀。
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: 追了一天的路程
  rationale: 这一惯用语表示一天所走的路程或持续一天的行程；此译既保留量度，也符合现代汉语表达。
- source_word: ἀπὸ Ἀδασὰ
  choice: 从亚大萨
  rationale: 按希腊文音译地名，并明确追击的起点。
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: 直到迦泽拉
  rationale: ἕως加冠词不定式标明追击终点；汉语无需补出主语即可自然表达“直到抵达迦泽拉”。
- source_word: ἐσάλπισαν
  choice: 吹响
  rationale: 该动词指吹号；“吹响号角”准确、自然，并保留军事语域。
- source_word: ὀπίσω αὐτῶν
  choice: 在敌人后面
  rationale: 保留原文的空间意义“在他们后面”；为避免连续代词所指不清，将αὐτῶν按语境明示为逃敌。
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: 吹响号角，发出信号
  rationale: 属格短语可指用于发信号的号角，也可较形式地理解为“信号的号角”；拆译为动作及功能，在现代汉语中清楚传达军事信号之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敌人”两次均为按上下文补明原文代词所指，以免汉语中的“他们”产生歧义；不加入原文没有的神学解释。地名采用常见圣经音译风格。
