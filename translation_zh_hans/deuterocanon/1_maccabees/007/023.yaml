base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: zh_hans
  text: 犹大看见阿尔基摩和与他同在的人在以色列子孙中所行的一切恶事，甚至比列国所行的恶事更甚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“超过列国”；也可译作“比外邦人所行的恶事更甚”。希腊文在比较项中省略了“所行的恶事”，意思是阿尔基摩及与他同在的人所行的恶，甚至超过周边列国所行的恶。
    reason: 说明ὑπὲρ τὰ ἔθνη的比较意义、原文省略现象及τὰ ἔθνη的另一译法。
lexical_decisions:
- source_word: ἴδεν
  choice: 看见
  rationale: 这是ὁράω的简单过去时叙事用法；“看见”自然直接，也可涵盖察觉并认识当时情势之意。
- source_word: ἅπαν τὴν κακίαν
  choice: 一切恶事
  rationale: 既保留ἅπαν所表达的全面性，也以“恶事”传达κακία的道德意味及其具体恶行。
- source_word: ἐποίησεν
  choice: 所行的
  rationale: 以定语结构自然表达这些恶事已经发生，并与“看见”形成清楚的时间关系。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 跟随他的人
  rationale: 该习语指与阿尔基摩同伙或支持他的人；此译简明自然，又不把关系限定为朋友或正式同僚。
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: 在以色列子孙中
  rationale: ἐν在此表示恶事发生的群体范围；“以色列子孙”保留原文的亲子性表达及民族—圣约色彩。
- source_word: ὑπὲρ τὰ ἔθνη
  choice: 甚至比列国所行的更甚
  rationale: ὑπέρ带有超过、胜过的比较意味；“甚至”体现修辞上的震撼，“列国”则保留τὰ ἔθνη较为直接且不受传统术语限制的表达。
theological_decisions:
- issue: υἱοῖς Ἰσραήλ的表达
  choice: 在以色列子孙中
  alternative: 在以色列民中；在以色列人中
  rationale: 原文明确使用“儿子／子孙”的复数形式；正文保留这一亲子性和圣约性的称谓，而不将其完全化约为一般民族名称。
- issue: τὰ ἔθνη的表达
  choice: 列国
  alternative: 外族人；外邦人
  rationale: 在这一犹太历史语境中，该词指以色列以外的周边民族，也可理解为“外邦人”。“列国”较贴近字面，并保留它究竟偏重政治民族还是宗教族群的张力。
- issue: ὑπὲρ τὰ ἔθνη所比较的内容
  choice: 甚至比列国所行的更甚
  alternative: 甚至超过列国；比外邦人更甚
  rationale: 希腊文省略了比较项中的动词和“恶事”，语意是阿尔基摩一伙的恶行超过列国的恶行。正文补出“所行的”以符合现代汉语，同时脚注说明原文的简略形式和另一种译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“阿尔基摩”依希腊文Ἄλκιμος音译；句式尽量贴近原文的叙事推进，同时补足汉语比较句所需成分。
