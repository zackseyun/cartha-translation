base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: zh_hans
  text: 巴基德离开耶路撒冷，在贝特泽特[a]安营。他派人抓住了许多曾投奔他的人[b]，也抓了一些百姓，把他们宰杀[c]在大坑里[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贝特泽特”按希腊文音译；这一地名也有其他拼写和还原方式。
    reason: textual_or_name_uncertainty
  - marker: b
    text: 或译：“倒戈归顺他的人”或“转投他的人”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文这个动词直译可作“献祭”；这里指残暴杀害，并非正当的礼仪献祭。
    reason: lexical_alternative
  - marker: d
    text: 也可理解为“进大坑中”；“坑”也可指井或蓄水池。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 离开
  rationale: 表示从耶路撒冷动身离去；“离开”自然、准确，不额外强调行程方式。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 该动词在军事叙事中指扎营，“安营”符合上下文并保持庄重。
- source_word: ἐν Βηξέθ
  choice: 在贝特泽特
  rationale: 地名背后的闪语形式并不确定，因此依据希腊文本作保守音译，不作推测性归一。
- source_word: συνέλαβεν
  choice: 抓住
  rationale: 表达将人拿住，既符合暴力情境，又不加入正式司法程序的含义。
- source_word: αὐτομολησάντων
  choice: 投奔过他的人
  rationale: 该词指从原有一方脱离并转投巴基德的人；“投奔”清楚表达阵营转换，同时保留他们后来被其抓捕的反讽张力。
- source_word: τινας τοῦ λαοῦ
  choice: 一些百姓
  rationale: 自然表达不定数量及部分关系。
- source_word: ἔθυσεν
  choice: 宰杀
  rationale: 该动词本义可指献祭，但此处是对被捕者的暴力杀害。“宰杀”保留其残酷及潜在的祭牲色彩，又不把事件误说成正当礼仪。
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: 在大坑里
  rationale: φρέαρ可指坑、井或蓄水池；结合杀人和弃尸场景，“大坑”较自然。εἰς在此可涉及进入坑内或以坑为事件终点，正文采用自然的地点表达，并以脚注保留歧义。
theological_decisions:
- issue: ἔθυσεν在非礼仪性杀戮语境中的献祭色彩
  choice: 宰杀
  alternative: 献祭；杀死
  rationale: “献祭”容易让读者误以为这是合法或正式的祭礼，“杀死”则削弱原词的残酷和祭牲联想；“宰杀”较好地保存两者之间的张力。
- issue: 投奔者的身份与行动方向
  choice: 投奔过他的人
  alternative: 从他那里逃走的人
  rationale: 与格短语μετ’ αὐτοῦ在此最自然地修饰那些曾转投巴基德、与他站在一起的人；正文不把他们改解为从巴基德一方逃走的人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以短句理清连续动作；“巴基德”“贝特泽特”按希腊见证音译。所有正文脚注标记均与脚注一一对应。
