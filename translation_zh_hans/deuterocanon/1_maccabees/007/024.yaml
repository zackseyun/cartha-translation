  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
translation:
  language: zh_hans
  text: 他出去，走遍犹太的各境及其周围地区[a]，向那些人和投敌者[b]施行报复；他们被阻止，不能进入那地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四周一带”。希腊文 κυκλόθεν 表明范围还包括犹太周边地区。
    reason: lexical_alternative
  - marker: b
    text: 或译“叛逃者”“倒向敌方的人”。希腊文指离开己方、转投另一方的人。
    reason: lexical_alternative
  - marker: c
    text: “那地”也可译作“该国土”或“那地区”。希腊文 χώρα 可指土地、国土或地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν εἰς πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: 走遍犹太各地
  rationale: 原文描写他出去，到了犹太的各处边界或地域。“走遍……各地”以自然的现代汉语表达其行动范围，同时避免把 ὅρια 仅限于边界线。
- source_word: κυκλόθεν
  choice: 四周地区
  rationale: 该副词表示周围、四面一带；译作“四周地区”表明行动范围还包括犹太地域以外或周边的地方。
- source_word: ἐποίησεν ἐκδίκησιν
  choice: 施行报复
  rationale: 原文惯用表达直译为“实行报复/惩罚”。“施行报复”保留其惩治和报复意味，又不擅自断定这是司法审判。
- source_word: ἐν τοῖς ἀνδράσιν
  choice: 向那些人
  rationale: 在 ἐκδίκησιν 的搭配中，ἐν 标示报复所针对的对象。原文仅称“那些男人/人”，不进一步说明其身份，故保持概括表达。
- source_word: τοῖς αὐτομολήσασιν
  choice: 投敌者
  rationale: αὐτομολέω 指离开己方、转投另一方。“投敌者”简洁表达叛离并倒向对方的含义；脚注保留“叛逃者”等可能译法。
- source_word: ἐνεστάλησαν
  choice: 被阻止
  rationale: 被动形式表示这些人受到拦阻或限制。译文保留被动和未明说的施事者，不把它弱化为主观上的“不敢”。
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: 不能再前往乡间
  rationale: 属格冠词不定式说明被阻止之事；χώρα 在此可指乡间、地域或境内。“乡间”与城市区域形成自然对照，但以脚注注明其词义范围。
