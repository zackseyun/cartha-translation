  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: zh_hans
  text: 一群文士聚集到阿尔基摩和巴基德那里，要寻求公道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公正之事”或“正当的事”。希腊文δίκαια兼有道德正当性和法律公正的含义。
    reason: 保留δίκαια在道德正当性、法律公正与合理诉求之间的语义幅度，并反映其复数形式。
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: 聚集
  rationale: 该词在这里描述众人集合起来；“聚集”自然地表达其集体行动，不必把被动或中间语态形式生硬地译出。
- source_word: πρὸς
  choice: 到……那里
  rationale: 与表示聚集的动词及人物连用时，表示朝向并与其会合；“到……那里”同时保留移动和关联之意。
- source_word: συναγωγὴ
  choice: 一群
  rationale: 这里指聚集起来的群体，并非会堂建筑。“一群”符合现代汉语叙事，也避免与前面的“聚集”构成生硬重复。
- source_word: γραμματέων
  choice: 经学家
  rationale: 在犹太—希腊化语境中指熟悉并讲解律法文献的人；“经学家”比现代行政意义的“书记”更准确，也较易为普通读者理解。
- source_word: ἐκζητῆσαι
  choice: 要寻求
  rationale: 不定式表示目的；“要寻求”清楚自然，并保留主动探求之意。
- source_word: δίκαια
  choice: 公道
  rationale: 中性复数可指公正之事、合理权益或正当结果。“公道”在现代汉语中兼具道德和法律色彩，且不把政治语境限定为某一种诉求。
- source_word: Ἄλκιμον
  choice: 阿尔基摩
  rationale: 按希腊文人名音译，并采用自然的现代汉语音节形式。
- source_word: Βακχίδην
  choice: 巴基德
  rationale: 按希腊文人名音译，并采用简洁、易读的现代汉语形式。
theological_decisions:
- issue: δίκαια在政治语境中的含义
  choice: 公道
  alternative: 正义；公正的条件；正当的事
  rationale: 本节没有说明这些经学家所求的是法律裁断、公平条件，还是广义上正当之事。“公道”保留道德与法律两方面的张力，不替经文作更窄的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”体现历史语境；“到……那里”明确聚集的方向；“寻求公道”属自然汉语，同时以脚注保留δίκαια的真实歧义。
