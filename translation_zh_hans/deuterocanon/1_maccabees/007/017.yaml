    reason: cross_reference
lexical_decisions:
- source_word: Σάρκας
  choice: 尸肉
  rationale: 原词是σάρξ的复数，具体指死者的肉身。译作“尸肉”保留了原文强烈、惨烈的身体意象，也比单译“尸体”更贴近该词；同时避免汉语中不自然的“肉身和血被倾倒”。
- source_word: ὁσίων σου
  choice: 你的圣民
  rationale: ὅσιος可指圣洁、虔诚或忠于上帝的人。“圣民”在现代汉语中自然，并保留群体性的圣约含义；“圣徒”可能带入较固定的后期教会称谓，“虔诚人”则会缩窄为个人敬虔。
- source_word: αἵματα αὐτῶν
  choice: 他们的血
  rationale: 希腊文使用αἷμα的复数，着重多人所流的血；汉语通常用集合名词“血”，而代词“他们的”保留其复数所指。
- source_word: ἐξέχεαν
  choice: 倾倒
  rationale: ἐκχέω本义为“倒出、倾倒”，并可指流血。此处同时支配“尸肉”和“血”，故“倾倒”比只适用于血的“流”或“洒”更能保留原句的搭配与诗性冲击。
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: 在耶路撒冷四周
  rationale: κύκλῳ表示环绕某地。“在耶路撒冷四周”清楚传达空间范围，也符合现代汉语习惯。
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: 无人埋葬他们
  rationale: 原结构直译为“没有为他们埋葬的人”。“无人埋葬他们”简洁自然，并保留死者不得安葬的悲惨意味。
theological_decisions:
- issue: 哀歌语境中ὁσίων的身份称谓
  choice: 圣民
  alternative: 圣徒；虔诚人；忠信之人
  rationale: “圣民”保留了这些人归属于上帝并分别为圣的含义，又不把词义限定为后期制度化的圣徒称号，或只解释为主观敬虔。
- issue: 是否把ἐξέχεαν按流血习语弱化处理
  choice: 倾倒
  alternative: 流出；洒出；倾洒
  rationale: 原动词兼辖“尸肉”和“血”，保留“倾倒”既反映其字面图像，也维持本节与《诗篇》79:2–3（七十士译本78:2–3）的语言呼应。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“尸肉”刻意保留原文的惨烈意象；句式简洁，呈现哀歌般的力度。脚注标记均置于相关正文之后。
