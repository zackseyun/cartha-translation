  text: They poured out the flesh of your holy ones and their blood around Jerusalem[c][b][a], and there was no one to bury them.
translation:
  language: zh_hans
  text: 他们将你圣民[a]的肉和他们的血倾倒在耶路撒冷四周[b]，无人埋葬他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣民”也可译作“圣徒”“虔诚人”或“忠信之人”。
    reason: lexical_alternative
  - marker: b
