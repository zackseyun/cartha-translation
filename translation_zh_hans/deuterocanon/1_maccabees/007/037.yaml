  yaml_path: translation/deuterocanon/1_maccabees/007/037.yaml
  text: You chose this house for your name to be called upon it[a], to be a house of prayer and petition for your people.
translation:
  language: zh_hans
  text: 你拣选了这殿，使这殿归在你的名下[a]，使它成为你子民祷告和恳求的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使你的名被称在其上。”或译：“使它承载你的名”或“使你的名在其上被求告。”这是圣经中的一种表达，表示这殿属于上帝，并与他的名相联。
    reason: 说明ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν的字面形式及其可能含义；正文采用自然汉语表达其归属性含义，同时保留原文公式的解释空间。
lexical_decisions:
- source_word: ἐξελέξω
  choice: 你拣选了
  rationale: 该词为不定过去时中间语态，指上帝对圣殿的选择。“拣选”自然庄重，也保留其圣约语境中的意味。
- source_word: τὸν οἶκον τοῦτον
  choice: 这殿
  rationale: οἶκος直译为“房屋”，但此处明确指圣殿；中文用“殿”既简洁自然，又不失经文语体。
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: 使你的名被称在其上
  rationale: 贴近希腊文的被动结构及介词表达，保留圣经中上帝之名与圣所相联、表明归属的公式性说法，同时不把含义缩减为单一解释。
- source_word: εἶναι
  choice: 使它成为
  rationale: 承接“拣选”所表达的目的，用“使它成为”比孤立的“成为”更符合现代汉语句法。
- source_word: οἶκον προσευχῆς καὶ δεήσεως
  choice: 祷告和恳求的殿
  rationale: προσευχή是较广义的祷告，δέησις着重迫切的请求；“祷告和恳求”保留二者区别，并保持平行结构。
- source_word: τῷ λαῷ σου
  choice: 你子民……的
  rationale: 将与格理解为关联或受益对象，并依汉语自然地嵌入“你子民祷告和恳求的殿”；此表达可涵盖供子民使用及为子民而设的意味。
theological_decisions:
- issue: 圣殿与上帝之名相联的公式
  choice: 使你的名被称在其上
  alternative: 使它承载你的名；使人可在其上求告你的名
  rationale: 原文公式兼有圣殿属于上帝、处于其名下并与其名相联的意味。正文保留较直译且略具张力的表达，脚注说明其可能含义，避免只落实为“命名”或“求告”其中之一。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“殿”明确所指为圣殿；“被称在其上”刻意保留原文公式性和一定的陌生感，并由脚注帮助普通读者理解。
