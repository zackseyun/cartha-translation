  yaml_path: translation/deuterocanon/1_maccabees/007/028.yaml
  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: zh_hans
  text: “在我和你们之间，不要有争战。我会带着少数人前来，和平地与你们会面。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: 不要有
  rationale: 以自然的现代汉语表达第三人称命令式的禁止或劝止语气，保留直接性而不过分强硬。
- source_word: μάχη
  choice: 争战
  rationale: 该词指争斗或战斗；上下文属于军事政治场景，“争战”既庄重，也可涵盖双方武力冲突。
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: 我和你们之间
  rationale: 准确保留说话者单数与受话者复数的区别，并自然表达双方之间的关系。
- source_word: ἥξω
  choice: 我要……来
  rationale: 表达将来的来到或抵达；“来”符合说话者前往受话者所在之处的视角。
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: 带几个人
  rationale: 此处ἐν与人连用表示陪同；“带几个人”自然传达随行者人数很少。语境暗示他们是男性随从，但正文无需把性别重复明说。
- source_word: ἵνα ἴδω
  choice: 好……会面
  rationale: “好”保留目的从句的功能；结合宾语的惯用含义译作“会面”，比逐字译为“看见脸面”更符合现代汉语。
- source_word: ὑμῶν τὰ πρόσωπα
  choice: 与你们……会面
  rationale: 字面为“你们的脸面”，在此是亲自见面的习语；采用自然汉语表达其实际意义。
- source_word: μετ’ εἰρήνης
  choice: 和平
  rationale: 保留和平、无敌意的方式或处境，不扩展为较具体的“友好”，以免超出原文。
