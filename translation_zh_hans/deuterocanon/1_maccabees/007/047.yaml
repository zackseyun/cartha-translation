base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: zh_hans
  text: 他们夺取了战利品和掠夺物，又砍下尼加诺尔的头和他曾傲慢地伸出的右手，把这些带到耶路撒冷附近[a]展示出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶路撒冷旁边”。希腊文作“在耶路撒冷旁边”，没有说明确切地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: 战利品
  rationale: 该词通常指从战败者那里取得的战利品；此译法保留军事语境，并与下一个名词有所区别。
- source_word: προνομήν
  choice: 掠夺物
  rationale: 指作为掳掠所得的财物；与“战利品”并列翻译，保留原文两个名词的累加表达，不将其合并。
- source_word: ἀφεῖλαν
  choice: 砍下
  rationale: 动词本义可指移去或取下，但以“头”和“右手”为宾语时，语境明确表示将其砍断。
- source_word: δεξιὰν
  choice: 右手
  rationale: δεξιά在这里自然指右手；不扩大译作“右臂”。
- source_word: ἐξέτεινεν
  choice: 曾……伸出来
  rationale: 指尼加诺尔先前伸出这只手的动作；“曾”自然呈现其相对于砍手这一事件的先时关系。
- source_word: ἐν ὑπερηφάνως
  choice: 傲慢地
  rationale: 希腊语形式略不规则，但意义清楚，带有骄横自大的负面色彩。
- source_word: ἤνεγκαν
  choice: 带去
  rationale: 顺应叙事动作，表示把砍下的头和右手带到所述地点。
- source_word: ἐξέτειναν
  choice: 陈列
  rationale: 字面为“伸展、展开”，在此语境中指将这些残肢公开展出；“陈列”比机械重复“伸出”更符合现代汉语。
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: 在耶路撒冷旁边
  rationale: παρά加宾格在此表示临近、靠着某地；直译为“旁边”可保留地点的含混性，不擅自确定为城门、城外或圣殿区域。
theological_decisions:
- issue: 如何呈现公开处置尼加诺尔遗体的行为
  choice: 按历史叙事直接描述为砍下并公开陈列，不添加道德评判
  alternative: 将其明确解释为在城门或圣殿区域施行的神圣审判仪式
  rationale: 经文本身叙述胜利后的行为，并以“傲慢”评价尼加诺尔先前的举动，却没有说明具体陈列地点，也没有在本节直接展开神学评断；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“战利品和掠夺物”保留原文同义近义名词的并列；“陈列”清楚表达公开展示的语境功能。脚注标记置于实际涉及地点歧义的“耶路撒冷旁边”之后。
