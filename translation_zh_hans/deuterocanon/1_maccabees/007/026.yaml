base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: zh_hans
  text: 王派尼加挪[a]前去；他是王手下一位显赫的官员，憎恨以色列，也敌视以色列。王命令他消灭这百姓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显赫的官员”也可译作“有声望的统治者”。
    reason: lexical_alternative
  - marker: b
    text: “消灭”也可译作“除掉”或“铲除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……前去
  rationale: 准确表达君王差派属下执行任务的叙事语气，也符合现代汉语习惯。
- source_word: ὁ Βασιλεὺς
  choice: 王
  rationale: 上下文所指是当时在位的君王；汉语叙事中用“王”简洁自然。
- source_word: Νικάνορα
  choice: 尼加挪
  rationale: 按希腊语 Νικάνωρ 音译，并采用中文圣经次经人名中常见的译法。
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: 他手下一位显赫的官员
  rationale: ἀρχόντων 在王室行政语境可指统治者或高级官员；ἐνδόξων 表示有声望、显赫。此译法既保留其地位，也避免误定为王子。
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: 憎恨以色列，与他们为敌
  rationale: 分别保留 μισοῦντα 的憎恨和 ἐχθραίνοντα 的敌对含义，不将两个并列分词合并弱化；“他们”按群体意义回指以色列。
- source_word: ἐνετείλατο αὐτῷ
  choice: 王命令他
  rationale: ἐνετείλατο 表示有权威的命令；补出主语“王”，使分句关系在现代汉语中清楚。
- source_word: ἐξᾶραι τὸν λαόν
  choice: 消灭这百姓
  rationale: ἐξᾶραι 基本意象是除去，在此敌对和军事政治语境中带有彻底铲除、消灭之意；“这百姓”自然承接前面的以色列。
theological_decisions:
- issue: ἐξᾶραι τὸν λαόν 的力度
  choice: 消灭这百姓
  alternative: 除掉这百姓；铲除这百姓
  rationale: 语境表明命令并非普通迁移，而是针对以色列百姓的毁灭性行动。“消灭”保留严重程度；脚注同时呈现该动词较贴近字面的“除掉”及更具根除色彩的“铲除”，不把词义范围压缩为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的希腊语并列句拆为三个汉语句子，以清楚呈现差派、人物特征和命令，同时保留原文信息及两个敌意分词的递进。所有脚注标记均置于正文对应位置。
