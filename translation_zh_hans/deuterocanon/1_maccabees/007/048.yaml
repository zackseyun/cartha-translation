  text: And the people rejoiced greatly[a], and they made that day a day of great gladness.
translation:
  language: zh_hans
  text: 百姓非常欢喜，并把那一天当作一个充满极大欢乐的日子来庆祝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他们把那一天带领／度过为一个极大欢乐的日子”；这是指把那一天作为喜乐的日子来庆守或庆祝的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐφράνθη
  choice: 欢喜
  rationale: 该词为不定过去时被动形式，此处自然表达百姓因事态发展而欢喜；译作“欢喜”简明自然，也保留情感色彩。
- source_word: ὁ λαός
  choice: 百姓
  rationale: 希腊文仅作“人民、百姓”，上下文虽指犹太百姓，本节却未明说“以色列”，因此不增补限定语。
- source_word: σφόδρα
  choice: 非常
  rationale: 此副词加强欢喜的程度；“非常”符合现代普通话，清楚而不过分古雅。
- source_word: ἦγαγον
  choice: 来庆祝
  rationale: ἄγω字面可指“带领、度过”，但与“日子”搭配时是守节或庆祝某日的习语；译作“来庆祝”传达实际含义。
- source_word: τὴν ἡμέραν ἐκείνην
  choice: 那一天
  rationale: 直接对应指示性短语，现代汉语自然。
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: 大大欢庆的日子
  rationale: εὐφροσύνη可指喜乐、欢庆，且此处带有μεγάλην的强烈程度；“大大欢庆”既与前句“欢喜”有所区分，也保留节庆气氛。
