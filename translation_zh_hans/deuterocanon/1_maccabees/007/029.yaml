lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: 他来到犹大那里
  rationale: ἔρχομαι与πρός表示朝某人而来；此译自然保留叙事中的移动，不额外推断动机。
- source_word: ἠσπάσαντο ἀλλήλους
  choice: 二人彼此问候
  rationale: ἀσπάζομαι通常指问候或致意，本身并不必然表示拥抱；用“彼此问候”较稳妥。
- source_word: εἰρηνικῶς
  choice: 友好地
  rationale: 该副词描述会面时外在和平、无敌意的姿态；“友好地”在现代汉语中自然，并与下文暗藏的敌意形成反差。
- source_word: οἱ πολέμιοι
  choice: 敌人
  rationale: πολέμιος作名词指敌对者；定冠词表明这是上下文中已知的一群人。
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: 已经准备好突然擒住
  rationale: ἕτοιμοι表示已准备就绪，ἐξαρπάζω带有猛然攫取、突然抓走之意；“突然擒住”兼顾行动的突发性和此处拘捕人的语境。
