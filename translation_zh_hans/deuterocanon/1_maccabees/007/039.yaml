  yaml_path: translation/deuterocanon/1_maccabees/007/039.yaml
  text: And Nicanor went out from Jerusalem and camped at Beth-horon[a], and a force of Syria met him.
translation:
  language: zh_hans
  text: 尼加挪离开耶路撒冷，在伯和仑安营；一支叙利亚军队[a]与他相遇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叙利亚军队”也可译作“叙利亚的一支兵力”或“叙利亚的军队”。希腊文δύναμις在军事语境中可指“兵力”或“军队”。
    reason: 保留δύναμις Συρίας在“兵力／军队”及属格表达上的合理译法，同时主文已按原文保留“相遇”而未预设会合关系。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 该词表示从一处出去；现代汉语用“离开耶路撒冷”自然明确，又不额外加入“率军出发”等原文未明说的军事色彩。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 在军事叙事中，该动词通常指扎营；“安营”简洁庄重，也符合现代中文叙事习惯。
- source_word: Βεθωρών
  choice: 伯和仑
  rationale: 按传统中文圣经地名音译处理，不翻译其词义。
- source_word: συνήντησεν αὐτῷ
  choice: 前来与他会合
  rationale: συναντάω基本义是相遇、碰见；上下文中叙利亚军队与尼加挪应属同一阵营，因此“会合”较自然，但“相遇”这一较宽泛的词义仍在脚注中保留。
- source_word: δύναμις Συρίας
  choice: 一支叙利亚的军队
  rationale: δύναμις在军事语境中可指军队或兵力；无冠词形式适合译为“一支”。属格Συρίας可理解为“叙利亚的”或“来自叙利亚的”。
