  source_fidelity: 原文的“用诡诈”（μετὰ δόλου）修饰尼加挪遣人传话的方式；现译“虚假的和平话”虽能表达其不诚实意图，却容易将诡诈仅限于“和平话”的内容。宜在中文中明确保留其以诡诈手段传递和平言辞的关系。其余信息均得到保留：尼加挪带着大量军力来到耶路撒冷，向犹大及其弟兄传话，且冒号正确承接下一节引语。
