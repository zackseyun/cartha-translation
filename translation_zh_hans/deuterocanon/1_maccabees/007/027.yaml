  text: And Nikanor came to Jerusalem with a large force, and he sent to Judas and his brothers deceitfully with peaceful words, saying,
translation:
  language: zh_hans
  text: 尼加挪带着大军来到耶路撒冷；他用诡诈的手段派人向犹大和他的弟兄们传去和平的话，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: 率领大军
  rationale: 这里的 δύναμις 指军事力量；用“率领大军”自然表达尼加挪带着庞大军力而来。
- source_word: μετὰ δόλου
  choice: 虚假的
  rationale: δόλος 表示诡诈、欺骗；修饰“和平话”，表明这些话表面和平，实则出于欺骗。
- source_word: λόγους εἰρηνικούς
  choice: 和平话
  rationale: 直译为“和平的话”，指传达和平意向的言辞；“和平话”简洁并保留原文含义。
- source_word: ἀπέστειλεν πρὸς
  choice: 派人向
  rationale: 原文省略所派对象，语境上指派遣使者传话；中文补出“人”以使句意完整，不具体限定使者身份。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: 他的弟兄们
  rationale: 保留 ἀδελφοί 的基本意义及可能兼指亲兄弟或同伴的语义空间，不擅自窄化。
