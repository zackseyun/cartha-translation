base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: zh_hans
  text: 他们信任他；他[a]从他们中抓住六十名男子，并在一天内杀了他们，照他所写的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里使用混合结构：先说“他们抓住了”，随后说“他杀了”。正文按主要行动者译作单数。
    reason: 原文语法／叙事主语转换
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: 信任了
  rationale: 表示把信任或信心放在某人身上；叙事语境中用“信任”自然清楚，也避免“相信”可能带出的宗教专门含义。
- source_word: συνέλαβον
  choice: 他抓了
  rationale: 现存希腊文形式是第三人称复数“他们抓了”，但紧接着的ἀπέκτεινεν是第三人称单数“他杀了”。正文按主要行动者用单数，使现代汉语连贯，同时以脚注保留原文的数不一致。
- source_word: ἐξ αὐτῶν
  choice: 从他们中
  rationale: 保留从较大群体中选取一部分人的部分含义。
- source_word: ἑξήκοντα ἄνδρας
  choice: 六十个人
  rationale: 这里指六十名男子；现代汉语叙事中“六十个人”自然明确，语境并不要求特别强调性别。
- source_word: ἀπέκτεινεν
  choice: 把他们杀了
  rationale: 直接表达杀害，清楚而不额外引入司法处决的意味。
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: 在一天之内
  rationale: 保留行动在一日内完成的时间范围和集中性。
- source_word: κατὰ τοὺς λόγους
  choice: 正如……的话
  rationale: 表达事件与随后所引书面话语相符；“正如”适合引出下文的引语。
- source_word: οὓς ἔγραφεν
  choice: 他所写的
  rationale: 保留希腊文主动单数及其略显突兀、指向下文引文的表达，不擅自明确“他”的身份。
theological_decisions:
- issue: συνέλαβον（复数）与ἀπέκτεινεν（单数）之间的叙事主语转换
  choice: 正文以单数主要行动者表述：“他……抓了……把他们杀了”
  alternative: 直译为“他们……抓了……他把他们杀了”
  rationale: 希腊文确有复数接单数的混合结构。按主要行动者统一为单数可使汉语叙事连贯，但脚注明确记录原文形式，避免掩盖代理者或群体参与方面的真实歧义。
- issue: οὓς ἔγραφεν中“他”的指代
  choice: 保留“他所写的”，不明说作者身份
  alternative: 译作“经上所写的”或“诗人所写的”
  rationale: 原文使用主动单数，却未在本句明确其所指。保留代词可维持原文的含混和引向下一节引文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“信任了”体现受骗后的信赖；“抓了”比“逮捕”更少暗示合法司法程序。句末冒号保留其引出下一节引文的功能。
