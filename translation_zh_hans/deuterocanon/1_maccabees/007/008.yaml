lexical_decisions:
- source_word: ἐπέλεξεν
  choice: 选中了
  rationale: 直接表达“选择、挑选”，同时不把上下文中的任命意味过度写入正文。
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: 王的“朋友”之一
  rationale: 保留部分关系，并以引号提示“朋友”很可能是希腊化宫廷中的正式或半正式等级称号，而不只是私人友谊。
- source_word: κυριεύοντα
  choice: 管辖
  rationale: 该分词表示巴基德对某地域掌有权柄；“管辖”自然体现行政职能，又比直接增译为特定官职更审慎。
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: “大河以西”地区
  rationale: 此语很可能是幼发拉底河以西行政区的地域称谓；补出“地区”有助于现代读者理解。中文按当地帝国视角译作“以西”，并在脚注保留直译。
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: 在国中位高权重
  rationale: μέγαν在此指政治地位和影响力，并非体格高大；此译较自然地传达其实际含义。
- source_word: πιστὸν τῷ βασιλεῖ
  choice: 忠于王
  rationale: 在政治语境中表示对君王忠诚可靠；“忠于”简洁且符合现代汉语。
