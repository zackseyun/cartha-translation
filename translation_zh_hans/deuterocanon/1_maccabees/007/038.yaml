base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: zh_hans
  text: 求你向这人和他的军营施行报应，使他们倒在刀下。求你记住他们的毁谤之言[a]，不要给他们容身之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁谤之言”也可译作“辱骂的话”或“亵渎的话”；希腊词可泛指恶言、毁谤或辱骂。在这祷告语境中，也可能带有冒犯神圣之事的意味。
    reason: lexical_alternative
  - marker: b
    text: “不要给他们容身之处”也可理解为“不要让他们存留下来”或“不要给他们喘息之机”；希腊原文可指居留、存留或获得安顿。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: 施行报应
  rationale: 保留“实施报应、惩罚”的祈求语气，既体现司法性的惩治，也不将其弱化为泛指的“伸张正义”。
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: 向这人
  rationale: 介词ἐν与“施行报应”连用时，按现代汉语习惯译出报应所针对的对象。
- source_word: παρεμβολῇ
  choice: 军营
  rationale: 该词在这里指军事营地，也可连带指驻营的军队；“军营”简明地保留其军事背景。
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  choice: 使他们倒在刀下
  rationale: 复数祈使式涵盖这人及其军营；“倒在刀下”自然表达死于刀剑或战事中的审判。
- source_word: μνήσθητι
  choice: 求你记住
  rationale: 在向上帝发出的祷告中，“记住”不仅指回想，也含有关注并据此采取行动的司法意味。
- source_word: δυσφημιῶν
  choice: 亵渎的话
  rationale: 该词可泛指诋毁、辱骂之言；在此宗教祷告语境中，“亵渎的话”保留其较强的冒犯神圣之意，同时以脚注说明较宽泛的可能。
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: 不要给他们容身之处
  rationale: μονή的核心意义涉及停留、居留或安顿。“容身之处”保留这一空间性意象；脚注同时呈现“不让他们存留”或“不给喘息之机”等语境可能。
theological_decisions:
- issue: 咒诅祷告中δυσφημιῶν的宗教分量
  choice: 亵渎的话
  alternative: 辱骂或诋毁的话
  rationale: 上下文是向上帝祈求惩治神圣冲突中的敌人，因此采用带有宗教意味的“亵渎”；但不排除该词更广义地指恶言、辱骂或诋毁。
- issue: μὴ δῷς αὐτοῖς μονήν所指的审判结果
  choice: 不要给他们容身之处
  alternative: 不要让他们存留下来；不要给他们喘息之机
  rationale: 原词可表示停留、居处或持续存留。正文保留较贴近词形的居留意象，不把含义限定为死亡或暂时不得休息，并在脚注交代其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你”明确祷告对象与祈求口吻；“施行报应”“倒在刀下”保留原文强烈的审判语言，不加以淡化。
