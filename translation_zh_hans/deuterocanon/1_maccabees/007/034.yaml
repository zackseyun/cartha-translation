  text: And he sneered at them, and laughed at them and defiled them, and spoke arrogantly.
translation:
  language: zh_hans
  text: 他嗤笑他们，嘲笑他们，玷污他们，并且傲慢地说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: 嗤笑
  rationale: 该动词表达带着轻蔑的讥笑，原有以鼻表示鄙夷的形象；“嗤笑”在现代汉语中自然且能传达这种轻蔑。
- source_word: κατεγέλασεν
  choice: 嘲笑
  rationale: 该词指以笑声讥嘲。“嘲笑”既保留具体的笑，也与前面的“嗤笑”有所区分，避免把两个希腊动词合并。
- source_word: ἐμίανεν
  choice: 玷污
  rationale: μιαίνω可指沾污、污秽或亵渎；“玷污”保留其较强的礼仪与道德色彩，同时不擅自限定具体方式。
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: 口出狂言
  rationale: 原短语意为以傲慢、狂妄的方式说话。“口出狂言”是自然而庄重的现代汉语表达，突出了言语中的狂傲。
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: 又……又……又……还……
  rationale: 以重复连接语保留原文层层累加的修辞效果；末项用“还”使汉语节奏自然，同时不削弱连续动作的强调。
