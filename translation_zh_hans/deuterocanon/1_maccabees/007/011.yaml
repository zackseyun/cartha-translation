  text: But they did not pay attention to their words[a], for behold[c][b], they had come with great force.
translation:
  language: zh_hans
  text: 但他们不理会那些人的话[a]，因为——看哪——那些人带着大批兵力而来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不听从那些人的话。”
    reason: lexical_alternative
  - marker: c
    text: “大批兵力”也可译作“强大的军力”或“大批军队”；这里很可能指人数众多的武装队伍或强盛的军力。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ προσεῖχον
  choice: 不理会
  rationale: προσέχω接与格可表示留意、听从或重视；“不理会”自然地表达他们没有听信或采纳对方的话，同时不把含义限于听觉行为。
- source_word: τοῖς λόγοις αὐτῶν
  choice: 那些人的话
  rationale: λόγοι在此指对方所说的内容。“那些人的话”贴近原文，也用指示语区分句中两个复数群体，避免现代汉语代词指向含混。
- source_word: ἴδου γὰρ
  choice: 因为，看哪
  rationale: γάρ说明前句的缘由，ἴδου则是引人注意的表达；保留“看哪”可呈现原文突出的叙事语气，不将其悄然省略。
- source_word: ἦλθον
  choice: 而来
  rationale: 简单过去时表示那些人前来；汉语“而来”无需另加时态标记，也能自然承接他们来时所带的兵力。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 带着强大的兵力
  rationale: δύναμις可指力量、能力或军事力量；叙事语境明显偏向武装力量。“强大的兵力”表达军事含义，却不具体断定为某种规模或编制的军队。
