  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: zh_hans
  text: 第一百五十一年，塞琉古的儿子德米特里离开罗马，带着少数人上到一座海边的城[a]，并在那里作王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到一座沿海的城”。希腊文直译为“到一座在海边的城”。
    reason: lexical_alternative
  - marker: b
    text: 或译“就在那里登基为王”。这个希腊语动词按上下文既可表示开始作王，也可表示以王的身份统治。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: 第一百五十一年
  rationale: 按希腊文纪年格式直译，不自行补入原文未明说的历法名称。
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 表达从罗马出去的动作；现代汉语中“离开罗马”自然清楚，也不额外引入“逃离”等含义。
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: 塞琉古的儿子德米特里
  rationale: 定冠词加属格在这里构成父名表达，明确译出父子关系。
- source_word: ἀνέβη
  choice: 上到
  rationale: 保留ἀναβαίνω的方向性叙事用语，不将其泛化为“前往”，也不推断具体地势或路线。
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: 带着少数几个人
  rationale: 自然表达随行者人数很少，并保留ἀνδράσιν所指的人员含义。
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: 到一座海边的城
  rationale: 贴近παραθαλασσίαν“在海边的、沿海的”这一空间描述，同时符合现代汉语习惯。
- source_word: ἐβασίλευσεν
  choice: 作王
  rationale: 保留明确的王权含义，同时不像“登基”那样过度限定即位方式，也可兼容开始作王与以王身份统治的语义。
theological_decisions:
- issue: ἐβασίλευσεν所表达的王权阶段
  choice: 在那里作王
  alternative: 在那里登基为王；在那里以王的身份统治
  rationale: 希腊文不定过去时在此既可能着重开始取得王位，也可能概括其作王统治。“作王”保留这种历史叙述上的张力，脚注列出两种可能侧重。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名依通行音译处理；“上到”有意保留希腊文行进动词的方向色彩。脚注标记均置于其所说明的词句之后。
