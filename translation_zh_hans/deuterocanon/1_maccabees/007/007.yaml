  yaml_path: translation/deuterocanon/1_maccabees/007/007.yaml
  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: zh_hans
  text: 所以现在，请派一个你所信任的人，让他去看看他给我们和王的疆土造成的这一切毁坏，并惩罚他们和所有前来帮助他们的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστειλον
  choice: 请派
  rationale: 保留命令语气；鉴于说话对象是君王，汉语用“请派”自然而庄重，并不削弱请求其采取行动的力度。
- source_word: ἄνδρα ᾧ πιστεύεις
  choice: 一个你所信任的人
  rationale: 保留关系从句所表达的重点：此人是受君王信任的，而不只是一般意义上的“可靠之人”。
- source_word: πορευθεὶς ἰδέτω
  choice: 让他去看看
  rationale: 将分词加命令式自然地转化为连续动作；“看看”表达亲自察看，不额外加入正式调查之意。
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: 这一切毁坏
  rationale: “毁坏”涵盖破坏、摧毁所造成的结果；“这一切”体现ἅπασαν的整体性。
- source_word: ἣν ἐποίησεν
  choice: 他……造成的
  rationale: 汉语以“造成毁坏”搭配自然，并忠实表达ποιέω在此处导致破坏的语境义。
- source_word: τῇ χώρᾳ τοῦ βασιλέως
  choice: 王的疆土
  rationale: χώρα指土地、地域或领土；“疆土”避免现代民族国家色彩，也清楚表明属于君王管辖的地域。
- source_word: κολάσατο
  choice: 惩罚
  rationale: 中性地表达惩处行动，不将其强化为“报仇”或弱化为“管教”。
- source_word: τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: 所有前来帮助他们的人
  rationale: “前来帮助”保留ἐπιβοηθέω所含赶来援助、施以支援的动态意味，同时不限定为军事援助。
