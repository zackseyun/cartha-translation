  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: zh_hans
  text: 他委任阿尔基摩治理那地，又留下一支军队驻在他那里，帮助他；巴基德便到王那里去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν ... τὴν χώραν τῷ Ἀλκίμῳ
  choice: 委任阿尔基摩治理那地
  rationale: 该结构表示将那地交由阿尔基摩掌管；此译自然地传达政治与行政上的任命，同时不把 χώρα 扩大为现代民族国家意义的“国家”。
- source_word: τὴν χώραν
  choice: 那地
  rationale: χώρα 在此指一片受管辖的土地或地区。“那地”符合叙事语境，也避免“国家”可能带来的现代政治含义。
- source_word: ἀφῆκεν
  choice: 留下
  rationale: 与“在他身边”和军事力量连用，指巴基德把军队留给阿尔基摩，而非释放或准许。
- source_word: δύναμιν
  choice: 一支军队
  rationale: 在军事叙事中 δύναμις 指武装力量；“一支军队”清楚自然，又不明确限定其规模。
- source_word: μετ’ αὐτοῦ
  choice: 在他身边
  rationale: 直译其伴随含义，表明这支军队留在阿尔基摩那里供其使用。
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: 帮助他
  rationale: 带冠词的不定式表达目的，即留下军队是为了援助阿尔基摩。
- source_word: ἀπῆλθεν ... πρὸς τὸν βασιλέα
  choice: 便到王那里去了
  rationale: 表达离开当前地点并前往王所在之处；不添加原文未明说的“回”字。
