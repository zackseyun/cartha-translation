  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: zh_hans
  text: 因为他们说：“有一个人，是出自亚伦后裔的祭司，随军队而来[a]，他不会不公正地对待我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随军队而来”也可译作“带着军队来了”或“与众军同行而来”。希腊文的复数名词在这里指军事力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: 因为他们说
  rationale: γάρ承接上文，说明前述行动的缘由；εἶπαν是不定过去时，在叙事中自然译为“说”。
- source_word: Ἄνθρωπος ἱερεὺς
  choice: 有一个人，是……祭司
  rationale: 保留ἄνθρωπος所指的个体和ἱερεύς的同位说明，同时采用自然的现代汉语表达。
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: 亚伦后裔中的
  rationale: σπέρμα在此是谱系用语，指后裔或血脉；“亚伦后裔中的”清楚表达其祭司血统，又避免现代汉语中“亚伦的种子”可能造成的误解。
- source_word: ἦλθεν
  choice: 而来
  rationale: 不定过去时表示已经来到；结合随行军队的表达，译作“随军队而来”简洁自然，并保留其当前到场所带来的影响。
- source_word: ἐν ταῖς δυνάμεσιν
  choice: 随军队
  rationale: δύναμις复数在此指军事力量；“军队”比直译“诸力量”更符合语境和现代汉语习惯，但不细化其兵种或编制。
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: 他不会亏待我们
  rationale: ἀδικέω可指不公正地对待、侵害或伤害；“亏待”保留不义相待的伦理色彩，也能涵盖实际侵害。
theological_decisions:
- issue: 亚伦谱系与祭司身份的正当性
  choice: 亚伦后裔中的祭司
  alternative: 出自亚伦血脉的祭司
  rationale: 正文明确保留祭司身份与亚伦谱系之间的联系，但不进一步断言该人物的品格或其主张必然正当。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“后裔”表达古代谱系说法，以“军队”明确军事语境；保留人物因祭司血统而产生信任、但这一信任尚未得到叙述者确认的张力。
