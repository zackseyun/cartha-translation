  text: And the forces killed them, and Demetrius sat on the throne of his kingdom.
translation:
  language: zh_hans
  text: 军队杀了他们，德米特里就登上了他的王位。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: 在此军事叙事语境中指武装部队；“军队”自然简明，又不把它误解为抽象的“能力”或“权势”。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 该不定过去时动词直接表示杀死；“杀了”是清楚自然的现代汉语，不额外暗示正式处决。
- source_word: ἐκάθισεν
  choice: 登上
  rationale: 原义为“坐下”，但与“王位”搭配时表达即位；汉语说“登上王位”比“坐在王位上”更自然，并保留王权承继的语境含义。
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: 他的王位
  rationale: 希腊语直译近于“他国度／王权的宝座”；现代汉语以“他的王位”简洁传达其登基掌权之意，避免生硬的“他国度的宝座”。
- source_word: Δημήτριος
  choice: 德米特里
  rationale: 采用此书人物名 Δημήτριος 的现代汉语音译。
