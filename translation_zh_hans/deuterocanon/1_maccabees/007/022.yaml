base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
translation:
  language: zh_hans
  text: 那些扰乱自己百姓的人都聚集到他那里；他们取得了对犹大地的控制，并在以色列中造成了沉重打击。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在以色列中”也可理解为“在以色列人中间”；这里的希腊语可以指这场沉重打击发生在以色列民这个群体之中，不一定单指地理区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: 都聚集到他那里
  rationale: 保留向某人聚集并与之联合的动态含义，但不把它过度解释为正式投效或参军。
- source_word: πάντες οἱ ταράσσοντες τὸν λαὸν αὐτῶν
  choice: 所有扰乱本族百姓的人
  rationale: ταράσσω译为“扰乱”，保留分词的行动意味；“本族百姓”自然表达λαός及αὐτῶν所指的共同族群，避免把它强化为现代政治意义的“国家”。
- source_word: κατεκράτησαν
  choice: 控制了
  rationale: 表达取得实际支配权，不额外暗示永久占有或合法领有。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 明确保留γῆ的地域含义，同时符合现代汉语圣经文体。
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: 造成了重创
  rationale: 以自然汉语传达“施加重大打击”的惯用含义，同时不把πληγή窄化为屠杀、瘟疫或单一类型的灾害。
- source_word: ἐν Ἰσραήλ
  choice: 在以色列中
  rationale: 保留ἐν表示范围或群体内部的基本含义，使“以色列”既可理解为人民共同体，也不完全排除地域色彩。
theological_decisions:
- issue: “以色列”指人民共同体还是地理区域
  choice: 在以色列中
  alternative: 在以色列境内；使以色列遭受重创
  rationale: 原文ἐν Ἰσραήλ允许群体内部或所在范围两种理解；正文采用不预先消解该张力的表达，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚集到他那里”“控制了犹大地”清楚直接；“造成了重创”既自然，也保留原文对伤害性质与具体形式的开放性。
