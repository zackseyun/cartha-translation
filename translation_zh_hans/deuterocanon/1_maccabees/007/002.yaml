  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
translation:
  language: zh_hans
  text: 当他正进入他祖先的王宫时，军队捉住了安条克和吕西亚，要把他们带到他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 事情是这样：当……时
  rationale: 保留叙事转换公式及其时间关系，同时采用自然的现代汉语表达。
- source_word: εἰσεπορεύετο
  choice: 进入
  rationale: 结合“当……时”表达未完成时所呈现的进行中背景动作；汉语无需另加“正在”也可自然传达。
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  choice: 他祖先的王宫
  rationale: “王宫”自然表达王室居所；“祖先”保留复数πατέρων所含的家族、王朝承继意味，而不生硬直译为“父辈”。
- source_word: συνέλαβον
  choice: 拿住了
  rationale: 既表达强力拘拿，又不预设正式司法逮捕程序。
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: 此处复数名词指军事力量；“军队”在现代汉语中简洁自然。
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: 要把他们带到他面前
  rationale: 清楚表达不定式的目的关系，并保留两个代词的指向。
