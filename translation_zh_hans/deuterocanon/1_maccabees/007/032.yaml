    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: 在
  rationale: κατά与地名连用，在这段战事叙述中表示交战地点；译作“在”既贴近原文，也不把它误解为“攻击”。
- source_word: Χαρφαρασαραμά
  choice: 哈尔法拉萨拉玛
  rationale: 这是一个文本形态和转写均不确定的地名。译文依现存希腊文作较透明的音译，并以脚注保留其不确定性。
- source_word: ἔπεσαν
  choice: 阵亡
  rationale: πίπτω在军事叙事中可委婉表示战死；“阵亡”简洁自然，符合此处语境，又不增加死亡方式等原文未说明的信息。
- source_word: τῶν παρὰ Νικάνορος
  choice: 尼加诺一方
  rationale: 原短语直指在尼加诺身边或与他同阵营的人，即他的部队；“尼加诺一方”清楚表达阵营关系，同时避免把范围过度限定为私人随从。
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: 约有五千人
  rationale: ὡς置于数目前表示约数；“约有五千人”是现代汉语中自然、准确的表达。
- source_word: ἔφυγον
  choice: 他们逃进了
  rationale: 原文只说“他们逃走”，没有明说“其余的人”。译文保留代词及其略显突兀的主语转换，不擅自补出原文没有的限定。
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: 进了大卫城
  rationale: εἰς表示向内进入；“大卫城”是描述性地名，在中文圣经语境中也自然明确。
