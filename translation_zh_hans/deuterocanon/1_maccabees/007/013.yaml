  text: And the Hasideans were the first among the sons of Israel[a], and they sought peace from them.
translation:
  language: zh_hans
  text: 哈西德人是以色列人[a]中最先向他们寻求和平的一批人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以色列众子。”这是传统的民族称谓。
    reason: 说明希腊文υἱοῖς Ἰσραήλ的字面传统表达；正文用现代汉语“以色列人”自然呈现其民族含义。
lexical_decisions:
- source_word: πρῶτοι
  choice: 最先前来
  rationale: πρῶτοι与ἦσαν连用，表示次序上的领先；结合后面的寻求和平，译为“最先前来”自然表达他们率先采取行动，但不增添行动结果。
- source_word: Ἀσιδαῖοι
  choice: 哈西德派
  rationale: 这是特定群体的名称。采用音译并加“派”，既保留专名性质，也便于现代中文读者识别其为一个群体。
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: 在以色列众子中
  rationale: ἐν在此表示“在……中”；“以色列众子”保留原文传统的家族—圣约性民族称谓，脚注说明其自然中文替代译法。
- source_word: ἐπεζήτουν
  choice: 寻求
  rationale: 该未完成过去时可表示持续或尝试中的行动；中文“寻求”在叙事中自然，也不武断规定行动是否成功。
- source_word: παρʼ αὐτῶν
  choice: 向他们
  rationale: παρά加属格本义涉及来源；在“寻求和平”的中文搭配中，“向他们”最自然，并保留复数代词，不擅自将所指改为单数。
- source_word: εἰρήνην
  choice: 和平
  rationale: 采用基本义“和平”，不扩展为较具解释性的“和平条件”或“和约”。
theological_decisions:
- issue: 如何翻译民族—圣约表达υἱοῖς Ἰσραήλ
  choice: 在以色列众子中
  alternative: 在以色列人中
  rationale: 原文明确使用“以色列众子”这一传统表达。正文保留其形式和语感，同时以脚注提供更自然的现代中文替代译法，避免无提示地抹平原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哈西德派”作为群体专名清楚自然；“以色列众子”有意保留原文传统表达。正文中的脚注标记与脚注逐一对应。
