lexical_decisions:
- source_word: ἡσύχασεν
  choice: 安静了
  rationale: 该动词的不定过去时在战事语境中表示进入或处于不受扰动的状态。“安静了”自然简洁，并保留结果意味，也不把短暂的平静夸大为持久和平。
- source_word: ἡ γῆ Ἰούδα
  choice: 犹大地
  rationale: γῆ指土地或地域；“犹大地”既贴近希腊文结构，又以现代汉语自然表达其地域含义。
- source_word: ἡμέρας ὀλίγας
  choice: 几天
  rationale: 宾格短语表示持续时间；“几天”准确传达时间短暂，汉语中无需另加介词即可自然表达。
