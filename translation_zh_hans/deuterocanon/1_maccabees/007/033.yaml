  yaml_path: translation/deuterocanon/1_maccabees/007/033.yaml
  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: zh_hans
  text: 这些话说完以后，尼加挪尔上了锡安山。祭司中有人从圣所出来[a]，民间的长老中也有人出来[b]，要和平地迎接他，并让他看那正在为王献上的燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“圣地”或“神圣区域”；希腊语在这里可以较具体地指圣殿的圣所或神圣范围。
    reason: lexical_alternative
  - marker: b
    text: 原文在“祭司”和“民间的长老”前重复使用“从”一词，很可能表示从这两个群体中出来一些代表，并非所有祭司和长老都出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτους λόγους τούτους
  choice: 这些话说完以后
  rationale: 按上下文表达“在这些话之后”，现代汉语这样说较自然；不额外指定说话者。
- source_word: ἀνέβη
  choice: 上了
  rationale: 保留向高处、向锡安山而行的方向感，同时符合现代汉语叙事习惯。
- source_word: τὸ ὄρος Σιών
  choice: 锡安山
  rationale: 采用通行地名译法，准确对应希腊语短语。
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: 祭司中有人……民间的长老中也有人
  rationale: 重复的ἀπό在此很可能具有部分义，表明是两个群体中的一些代表，而非全体成员。
- source_word: ἐκ τῶν ἁγίων
  choice: 从圣所出来
  rationale: 中性复数τὰ ἅγια在圣殿语境中可指圣所或神圣区域；“圣所”简洁自然，并在脚注保留“圣地/神圣区域”的可能。
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: 要和平地迎接他
  rationale: ἀσπάζομαι可表示问候或迎接；尼加挪尔来到锡安山的场景中，“迎接”较自然，εἰρηνικῶς的和平方式或意图仍予保留。
- source_word: δεῖξαι αὐτῷ
  choice: 并让他看
  rationale: 自然表达“给他看、向他展示”，保持两个目的不定式的并列关系。
- source_word: τὴν ὁλοκαύτωσιν
  choice: 燔祭
  rationale: 这是汉语圣经传统中清楚、简洁的整献祭术语，表示祭物全部焚烧的祭。
- source_word: τὴν προσφερομένην
  choice: 正在……献上的
  rationale: 用进行体呈现现在分词所表达的当时正在进行的献祭行动。
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: 为王
  rationale: 保留ὑπέρ“为了、代表、使……受益”的宽泛关系，不具体断定祭献的确切目的。
theological_decisions:
- issue: 为王献祭的关系
  choice: 为王献上的
  alternative: 代表王献上的／为王求福而献上的
  rationale: ὑπέρ可涵盖“为了、代表、使其受益”等意思；正文采用宽泛译法，避免加入原文未明确说明的祭献目的。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尼加挪尔”“锡安山”“燔祭”沿用通行圣经译名与祭祀术语；通过“……中有人”清楚传达希腊语可能的部分义。
