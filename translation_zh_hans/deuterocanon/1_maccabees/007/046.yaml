  yaml_path: translation/deuterocanon/1_maccabees/007/046.yaml
  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
translation:
  language: zh_hans
  text: 犹太各村庄的人从四面出来，包抄他们[a]；这些人便转回去面对那些人[b]。他们全都倒在刀下，一个也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “包抄”所译的希腊词也可较笼统地理解为“包围”或“占了上风”。
    reason: alternative_reading
  - marker: b
    text: 希腊原文直译近于“这些人转回去面对那些人”，说法紧凑，两个指示代词具体各指哪一方，要由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 按叙事语境表达众人从各村庄出动，简明自然。
- source_word: κωμῶν
  choice: 村庄
  rationale: κώμη通常指不同于城市的村落；“村庄”是现代汉语中清楚而准确的对应词。
- source_word: κυκλόθεν
  choice: 从四面
  rationale: 保留其“从周围、从各方”的空间意义，也与随后战斗场面的合围态势相接。
- source_word: ὑπερεφέρων
  choice: 包抄
  rationale: 此词形在本句中的具体战术意义不完全明确；结合κυκλόθεν和战斗语境，“包抄”表达从周围取得位置优势，同时不必断言已完全包围。
- source_word: ἀνέστρεφον
  choice: 转身攻向
  rationale: ἀναστρέφω在这里可指转回或转向；加上πρός，在战斗语境中译作“转身攻向”，既传达方向逆转，也避免直接解释为逃退。
- source_word: οὗτοι πρὸς τούτους
  choice: 这些人……那些人
  rationale: 原文连续使用两个指示代词而未明说各自所指；译文保留这一对举和指代上的含混，不擅自补出具体阵营。
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: 他们全都倒在刀下
  rationale: 采用汉语常见的战争叙事表达，贴近“全都倒下，被刀剑所杀”的原意。
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: 一个也没有留下
  rationale: 保留οὐδὲ εἷς所加强的彻底否定语气。
