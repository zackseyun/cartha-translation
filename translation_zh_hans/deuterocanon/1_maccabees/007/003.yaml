  text: And the matter became known to him[a], and he said, “Do not show me their faces.”
translation:
  language: zh_hans
  text: 此事传到他耳中，他说：“不要让我看见他们的面孔。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要让我看见他们的面孔”是拒绝让人把他们带到自己面前的说法。
    reason: 说明原文具体表达在语境中的习惯含义，避免读者只按字面理解。
lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: 传到他那里
  rationale: 该短语直译为“被他知道”或“为他所知”；“传到他那里”自然地表达事情进入他的知悉范围，同时保留被动意味，不把他写成主动查知此事。
- source_word: τὸ πρᾶγμα
  choice: 这事
  rationale: πρᾶγμα在此泛指有关的事情或情况；“这事”简洁自然，并由上下文确定所指。
- source_word: Μή μοι δείξητε
  choice: 不要让我看见
  rationale: μή加命令式构成禁令；“不要让我看见”既保留δείκνυμι“给……看”的基本意思，也符合现代汉语表达。
- source_word: τὰ πρόσωπα αὐτῶν
  choice: 他们的面孔
  rationale: 原文具体说“他们的脸/面孔”。选用“面孔”保留原文形象，也较适合庄重叙事语体。
