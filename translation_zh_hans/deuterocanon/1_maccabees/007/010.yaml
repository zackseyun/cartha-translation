  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: zh_hans
  text: 他离开后，带着大批军队来到犹大地；又派使者到犹大和他的弟兄那里去，传达和平的话，却带着诡诈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传达带着诡诈的和平话语。”希腊文将和平的言辞与诡诈并置，表明言辞表面和平，却含有欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: 出发……来到
  rationale: 两个不定过去时动词依次表示离开原处和抵达目的地；中文用“出发……来到”自然保留叙事进程。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 率领大军
  rationale: 在军事语境中，δύναμις 指兵力或军队，而非抽象的“能力”；“大军”简洁地表达 πολλῆς 所指的庞大规模。
- source_word: εἰς γῆν Ἰούδα
  choice: 来到犹大地
  rationale: 保留 γῆ 的地域含义；“犹大地”符合现代中文地名表达。
- source_word: ἀπέστειλεν ἀγγέλους
  choice: 派使者
  rationale: ἀγγέλους 在此政治军事场景中指受派遣的人类信使，而不是天使。
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: 去见犹大和他的弟兄
  rationale: πρός 在“派遣”之后表示对象；“弟兄”保留 ἀδελφούς 的男性复数及历史语境。
- source_word: λόγους εἰρηνικοὺς
  choice: 口中说着和平的话
  rationale: 表达话语表面上的和平性质；加入“口中”是自然中文措辞，也与后面的内在诡诈形成清楚对照。
- source_word: μετὰ δόλου
  choice: 心里却怀着诡诈
  rationale: δόλος 指欺骗、诡计或奸诈意图；“却”显明和平言辞与欺骗意图之间原文隐含的反差，而“心里”将其作为意图表达，不改变事件内容。
