base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/005.yaml
  text: And all the lawless and ungodly men from Israel came to him[a], and Alcimus led them, wanting to be priest,
translation:
  language: zh_hans
  text: 以色列中所有不守律法、不敬虔的男子都来见他；阿尔基慕带领他们，想要担任祭司[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“取得祭司职分”。这里的希腊文直译是“作祭司”；按本书的历史语境，阿尔基慕谋求的是大祭司职位。
    reason: 说明动词的直译范围及其在历史语境中的具体所指。
lexical_decisions:
- source_word: ἄνδρες
  choice: 人
  rationale: 希腊文为阳性复数，所指是具体的一群男子；但现代汉语以“人”指称这群行动者更自然，并不改变其历史所指。
- source_word: ἄνομοι
  choice: 不守律法
  rationale: 保留其违背律法的含义及犹太盟约背景，比泛称“邪恶”更准确。
- source_word: ἀσεβεῖς
  choice: 不敬虔
  rationale: 表达对上帝缺乏敬畏的宗教性含义，并与“不守律法”形成有区别的双重评价。
- source_word: ἐξ Ἰσραήλ
  choice: 以色列中
  rationale: 表明这些人来自以色列内部；在现代汉语中比直译“从以色列”更能清楚传达此意。
- source_word: πρὸς αὐτόν
  choice: 来见他
  rationale: πρός与表示移动的动词连用，表示来到某人那里；“来见他”符合此处觐见掌权者的语境。
- source_word: ἡγείται
  choice: 带领
  rationale: 叙事现在时在汉语中可自然译为“带领”，清楚表达阿尔基慕在这群人中的领导角色。
- source_word: βουλόμενος
  choice: 想要
  rationale: 直接表达分词所说明的愿望或动机，不额外强化为已经确定的计划。
- source_word: ἱερατεύειν
  choice: 担任祭司
  rationale: 按该动词本身译为履行祭司职分，不在正文中加入希腊文未明说的“最高”；历史语境所指的职位则在脚注中说明。
theological_decisions:
- issue: 如何译出对以色列内部反对者的双重道德评价
  choice: 不守律法、不敬虔
  alternative: 违法作恶、亵渎上帝
  rationale: 分别保留ἄνομοι的律法／盟约维度和ἀσεβεῖς的敬神维度，不把两者合并成笼统的“恶人”。
- issue: 阿尔基慕所谋求的祭司职位是否在正文中明确为大祭司
  choice: 担任祭司
  alternative: 担任大祭司
  rationale: ἱερατεύειν本身意为作祭司或履行祭司职分，并未明确含有“大祭司”；上下文很可能指大祭司职位，故以脚注交代，避免正文消除原文措辞与历史语境之间的张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事用语。“来见他”避免生硬的“来到他那里”；分号呈现两个紧密相连的分句。正文保留“祭司”的原文宽度，并以脚注说明大祭司语境。
