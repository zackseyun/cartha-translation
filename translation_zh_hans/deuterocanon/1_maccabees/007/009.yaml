base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: zh_hans
  text: 他就派他和不敬虔的阿尔基摩去；他们为他立定了祭司职分[a]，并命令他在以色列子孙中施行报复[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他们为他立定了祭司职分”：动词为复数，其确切指称在本节中未明说；语境表明这里的“他”指阿尔基摩。也可按语境译作“任命阿尔基摩担任祭司”。
    reason: 保留ἔστησαν的复数形式及αὐτῷ的语境指向，并说明较自然的替代译法。
  - marker: b
    text: 也可译作“向以色列子孙施行报复”或“对以色列子孙施行报复”。希腊文介词可表示行动发生在他们中间；结合上下文，也含有以他们为报复对象的意思。
    reason: 保留介词ἐν在范围义与敌对对象义之间的解释空间。
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 这是叙事中表示差遣的常用动词；“派……去”符合现代汉语表达，也保留了奉命执行任务的意味。
- source_word: Ἄλκιμον
  choice: 阿尔基摩
  rationale: 按希腊文人名音译，并采用适合现代普通话的形式。
- source_word: τὸν ἀσεβῆ
  choice: 不敬虔的
  rationale: ἀσεβής主要指对上帝或神圣之事缺乏敬畏；“不敬虔”保留了叙述者评价中的宗教和道德色彩，未泛化为一般的“邪恶”。
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: 为阿尔基摩确立了祭司职分
  rationale: 该短语直译为“为他确立祭司职分”。上下文表明这里的“他”是阿尔基摩；正文明确人名，以免连续多个“他”造成不必要的误解，同时保留“确立”的源文意象。
- source_word: ἱερωσύνην
  choice: 祭司职分
  rationale: 此处不是抽象讨论祭司制度，而是指阿尔基摩所获的祭司职位；“祭司职分”既贴近词义，也适合具体语境。
- source_word: ἐνετείλατο
  choice: 命令
  rationale: 准确传达具有权威性的吩咐，语气强于一般的“嘱咐”。
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: 施行报复
  rationale: 保留ἐκδίκησις所含的报复或惩治意味；“施行”自然地对应“实行、执行”。
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: 在以色列子孙中
  rationale: 按ἐν的基本空间或范围意义译为“在……中”，不在正文中径直改成敌对方向性的“攻击”；语境所含的敌意另在脚注说明。
theological_decisions:
- issue: 如何表达阿尔基摩的贬义称号ἀσεβῆ
  choice: 不敬虔的
  alternative: 不虔诚的；邪恶的
  rationale: “不敬虔”保留叙述者对其与上帝及神圣之事关系的负面判断，又不把含义扩大为笼统的道德败坏。
- issue: 如何处理ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: 为阿尔基摩确立了祭司职分
  alternative: 任命阿尔基摩担任祭司；确立了他的祭司职分
  rationale: 源文措辞是“确立祭司职分”，而语境指就任祭司职位。正文兼顾源文形式和汉语可懂度，不进一步指定为“大祭司”，以免超出本节字面。
- issue: 如何理解ἐν τοῖς υἱοῖς Ἰσραήλ中的介词ἐν
  choice: 在以色列子孙中
  alternative: 向以色列子孙施行报复；对以色列子孙施行报复
  rationale: ἐν可表示行动发生的范围；但报复在语境中也显然带有针对他们的敌对意味。正文保留形式上的张力，脚注列出方向性更强的理解。
- issue: 如何翻译υἱοῖς Ἰσραήλ这一固定族群称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 源文直称“以色列的儿子们/子孙”，是传统族群称谓；“以色列子孙”在现代中文中仍可理解，并保留其原有表达。
- issue: 连续代词αὐτόν／αὐτῷ／αὐτῷ的指向
  choice: 第一处和末处保留“他”，祭司职分处明确为“阿尔基摩”
  alternative: 分别明确译作“巴基德”“阿尔基摩”“巴基德”
  rationale: 本节希腊文自身使用代词，前后人物需由上下文辨认。祭司职分在语义上明确属于阿尔基摩，故为可读性点明其名；其余两处不在本节内加入源文未明说的人名，以免过度消解代词指向。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句式保持历史叙事的紧凑推进；“不敬虔”“祭司职分”“以色列子孙”保留宗教历史语域，但避免古奥文言。
