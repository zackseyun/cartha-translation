  text: 尼加挪得知自己的计划已被泄露，就出去与犹大相会。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: 得知
  rationale: 此处不定过去时表示获知某一事实，而非单纯处于“知道”的状态；“得知”自然地传达这一变化。
- source_word: ἀπεκαλύφθη
  choice: 已经泄露
  rationale: 被动形式表示计划已被人知晓；“泄露”符合军事政治语境，也避免“启示”可能带来的神学色彩。
- source_word: ἡ βουλὴ αὐτοῦ
  choice: 自己的计划
  rationale: βουλή 可指谋议、意图或计划；在此军事政治语境中，“计划”最清楚中性。“自己的”明确回指尼加挪。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 直接保留动词“出去”的意义，不额外添加原文未明说的“率军出发”等信息。
- source_word: εἰς συνάντησιν
  choice: 迎战
  rationale: 该短语本义为出去相遇或迎接；上下文是敌对军事行动，现代汉语用“迎战”能自然表达这种相遇，同时不具体规定战斗方式。
- source_word: τῷ Ἰούδα
  choice: 犹大
  rationale: 按中文圣经传统音译人名 Ἰούδας 为“犹大”，所指为犹大·马加比。
