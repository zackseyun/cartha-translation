  yaml_path: translation/deuterocanon/1_maccabees/007/049.yaml
  text: And they established that this day should be observed year by year, on the thirteenth day of Adar.
translation:
  language: zh_hans
  text: 他们规定，每年亚达月十三日都要守这一天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: 他们规定
  rationale: 此处为不定过去时，在该结构中表示确立一项持续实行的纪念安排。“规定”自然明确，又不强化为正式法令。
- source_word: τοῦ ἄγειν
  choice: 都要守
  rationale: 带冠词的不定式说明所确立之事的内容，即守这一日。“守”适用于节期或纪念日，也避免“庆祝”可能带来的过度欢庆色彩。
- source_word: κατʼ ἐνιαυτόν
  choice: 每年
  rationale: 准确表达逐年实行的意思，符合现代汉语习惯。
- source_word: τὴν ἡμέραν ταύτην
  choice: 这一天
  rationale: 保留近指代词 ταύτην 的指向，并自然承接上文所述事件。
- source_word: τῇ τρισκαιδεκάτῃ
  choice: 十三日
  rationale: 与月份名称结合，按现代汉语日期表达为“亚达月十三日”；希腊语与格表示举行纪念的日期。
- source_word: τοῦ Ἀδάρ
  choice: 亚达月
  rationale: 将月份专名 Ἀδάρ 音译为“亚达”，并补出“月”，使日期表达清楚自然。
