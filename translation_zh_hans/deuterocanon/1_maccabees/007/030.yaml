  yaml_path: translation/deuterocanon/1_maccabees/007/030.yaml
  text: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
translation:
  language: zh_hans
  text: 犹大得知这件事：他是带着诡诈来对付犹大的。犹大因他而惊惧，不愿再见他的面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος τῷ Ἰούδα
  choice: 犹大得知这事
  rationale: 希腊文直译近于“这事为犹大所知”；用主动式汉语更自然，同时保留信息传到犹大那里这一含义。λόγος在此指有关阴谋的事情或消息，而非狭义的“话”。
- source_word: μετὰ δόλου
  choice: 怀着诡诈
  rationale: δόλος表示欺骗、诡诈或奸计；“怀着诡诈”既贴近介词结构，也不把含义强化为已实施的背叛。
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: 来对付自己的
  rationale: ἐπί加宾格在此语境带有敌对指向，不只是“到他那里”；“来对付自己”以自然汉语表达其针对犹大的意味。
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: 犹大因他而警惕起来
  rationale: ἐπτοήθη可指受惊、惊惧或震动；结合随后拒绝会面，“警惕起来”自然呈现其因对方而产生戒惧的反应，又避免夸大为恐慌。
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: 不愿再
  rationale: 表达从此以后不再愿意，简洁保留βουλομαι所含的意愿或决定。
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: 见他的面
  rationale: 保留希腊文“见他的面”这一具有人际会面意味的表达，在现代汉语中也自然可懂。
