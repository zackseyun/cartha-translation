translation:
  language: zh_hans
  text: 他同他们讲和睦的话，又向他们起誓说：“我们不会图谋加害[a]你们，也不会图谋加害你们的朋友。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋加害”或译“图谋恶事”。希腊文κακόν既可指“恶”，也可指“伤害”；这里较可能指有害的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  choice: 他对他们说了
  rationale: μετά加属格本义为“与……一起”，但现代汉语在引出言语内容时用“对他们说”更自然；仍保留双方当面交谈的语境。
- source_word: εἰρηνικοὺς λόγους
  choice: 和睦的话
  rationale: 直译该形容词与名词的组合，表达旨在安抚、示好的言辞，同时不预断说话者是否真诚。
- source_word: ὤμοσεν αὐτοῖς
  choice: 向他们起誓
  rationale: 准确表达ὄμνυμι的宣誓行为，并以“向他们”保留誓言的对象。
- source_word: Οὐκ ἐκζητήσομεν
  choice: 我们不会加害
  rationale: ἐκζητέω与κακόν连用时表示寻求、图谋对人不利；汉语“加害”自然表达所指的敌对行动，而不拘泥于生硬的“寻求伤害”。
- source_word: ὑμῖν κακὸν
  choice: 加害你们
  rationale: κακόν既可指“恶”，也可指实际的伤害；此处作为政治军事语境中的保证，较可能指不采取有害行动。
- source_word: τοῖς φίλοις ὑμῶν
  choice: 你们的朋友
  rationale: 保留φίλοι的通常意义“朋友”，不在证据不足时收窄为“盟友”或“支持者”。
