base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: zh_hans
  text: 求你今天就在我们眼前击溃这营地[a]，使其余的人知道：他曾恶言攻击你的圣物；求你照着他的邪恶审判他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所”。希腊文为复数，直译“你的圣物”；此词也可能泛指属于上帝的一切神圣事物，包括圣所。
    reason: 说明τὰ ἅγιά σου的复数形式及“圣所”的可能理解；标记置于相关语句所在句中。
lexical_decisions:
- source_word: σύντριψον
  choice: 击溃
  rationale: 该词为不定过去时命令式，表达果断、彻底的毁灭行动；在军事语境中，“击溃”既自然有力，也比字面的“打碎”更符合中文表达。
- source_word: παρεμβολὴν
  choice: 营
  rationale: παρεμβολή通常指军营或营地；“这营”简洁地保留原文的军事集体意象，不擅自改成“军队”。
- source_word: ἐνώπιον ἡμῶν
  choice: 就在我们眼前
  rationale: 保留“在我们面前／眼前”的直接空间与见证意味；“就在”也自然传达祈求今日当场成就的语气。
- source_word: οἱ ἐπίλοιποι
  choice: 其余的人
  rationale: 原词指剩下或其余者，并未明确限定为幸存者；此译保留其范围上的含混。
- source_word: κακῶς ἐλάλησεν
  choice: 曾恶言攻击
  rationale: κακῶς在此带有道德谴责，ἐπὶ又指向所攻击的对象；“恶言攻击”比“说得不好”准确，也符合现代汉语。
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: 攻击你的圣物
  rationale: τὰ ἅγια为中性复数，字面指属于上帝的神圣之物，也可能涵盖圣所；正文用“圣物”保留复数和较宽泛的所指，以脚注说明另一可能。
- source_word: κρῖνον αὐτὸν
  choice: 审判他
  rationale: κρίνω在此是向上帝发出的司法性祈求；“审判”保留核心意义，而不预先把结果译成“定罪”。
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: 按他的恶行
  rationale: κακία指邪恶、恶劣品性或恶行；“按他的恶行”在中文祷告语体中自然，并表达审判与其罪恶相称。
theological_decisions:
- issue: 单数αὐτόν（“他”）及ἐλάλησεν（“他说”）的指称
  choice: 保留单数“他”，不把它复数化，也不在正文中点名其身份。
  alternative: 把单数理解为对敌营或敌军领袖的集合性／代表性指称，泛译为“他们”。
  rationale: 希腊文从集体性的“这营”转向单数的发言者和受审者。保留单数忠实呈现语法及祷告所聚焦的个人责任，同时不加入本节未明说的具体身份。
- issue: τὰ ἅγιά σου的范围
  choice: 正文译作“你的圣物”，保留较宽泛的复数含义。
  alternative: 译作“你的圣所”，将其理解为圣殿或圣所区域。
  rationale: 该表达既可指神圣之物，也可在语境中指圣所。正文不将真实的词义张力单一化，另一解释置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。“求你”承接命令式祷告语气；分号保留原文从击溃敌营到审判单数冒犯者的推进。正文避免古奥的“圣者”“营寨”等用语，也不加入具体历史人物名称。
