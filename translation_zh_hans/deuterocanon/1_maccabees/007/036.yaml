lexical_decisions:
- source_word: ἐμπυριῶ
  choice: 我要放火烧
  rationale: 该将来时动词表达纵火焚烧的威胁；“放火烧”直接自然，又不预先断定建筑必被完全烧毁。
- source_word: τὸν οἶκον τοῦτον
  choice: 这座殿
  rationale: οἶκος字面为“房屋”，但在此明确指圣殿；“这座殿”在现代汉语中自然清楚，脚注保留其字面措辞及经文意蕴。
- source_word: μετὰ θυμοῦ
  choice: 怒气冲冲地
  rationale: 表达带着怒气离去的状态，符合现代汉语叙事习惯，也保留强烈情绪。
- source_word: οἱ ἱερεῖς
  choice: 祭司们
  rationale: 准确表达复数的圣殿祭司。
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: 站在……前
  rationale: 忠实表达站在某物面前或当面的空间关系，简洁自然。
- source_word: τοῦ θυσιαστηρίου
  choice: 祭坛
  rationale: 标准的礼仪用语。
- source_word: τοῦ ναοῦ
  choice: 圣所
  rationale: ναός在此可特指圣殿的核心圣所；如此也与前面的οἶκος有所区分。
- source_word: ἔκλαυσαν
  choice: 哭着
  rationale: 自然表达他们流泪哭泣，并与随后说话的动作顺畅衔接。
- source_word: εἶπαν
  choice: 说
  rationale: 标准的引语引介词；句末用冒号表明祷告或话语在下一节继续。
