  language: zh_hans
  text: 又有雇佣军从别的君王那里和海上的岛屿来到他那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλέων ἑτέρων
  choice: 其他君王
  rationale: 按希腊语直译，保留复数及“其他”的关系含义。
- source_word: νήσων θαλασσῶν
  choice: 海岛
  rationale: 希腊语字面为“诸海的岛屿”；现代汉语以“海岛”自然表达其地理含义，避免生硬的“诸海之岛”。
- source_word: δυνάμεις μισθωταί
  choice: 雇佣军
  rationale: δυνάμεις 在军事语境中指军队或兵力，μισθωταί 表明受雇性质；“雇佣军”简洁准确。
- source_word: ἦλθον πρὸς αὐτόν
  choice: 来到他那里
  rationale: 保留移动方向及第三人称指代，不额外补明原文未直接重述的人名。
