lexical_decisions:
- source_word: διάδημα
  choice: 王冠
  rationale: 指君王的头饰；“王冠”是现代汉语中自然清楚的对应，也保留王权含义。
- source_word: στολὴν αὐτοῦ
  choice: 自己的袍服
  rationale: στολή在此王室语境中指具有身份象征的袍服；“自己的”忠实表达αὐτοῦ，并避免过度具体化为礼服或朝服。
- source_word: δακτύλιον
  choice: 戒指
  rationale: 原词本义为戒指；虽可能是象征权柄的印戒，但希腊文本没有明说“印”，故不作增译。
- source_word: τοῦ ἀγαγεῖν
  choice: 好让他……带来
  rationale: 带属格冠词的不定式在此表达目的；译为“好让他……带来”既自然，也保留使其带领安提阿古前来的意思。
- source_word: Ἀντίοχον τὸν υἱὸν αὐτοῦ
  choice: 自己的儿子安提阿古
  rationale: 以现代汉语自然语序表达同位结构，并保留αὐτοῦ所指的亲属关系。
