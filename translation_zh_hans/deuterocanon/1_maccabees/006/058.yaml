  text: Now then[a], let us give our right hand to these men, and let us make peace with them and with their whole nation;
translation:
  language: zh_hans
  text: “既然如此，现在让我们向这些人伸出右手[a]，同他们和他们整个民族讲和；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“给出右手”，这是表示信义、议和或结盟的惯用说法。
