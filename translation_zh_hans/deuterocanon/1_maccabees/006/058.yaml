lexical_decisions:
- source_word: νῦν οὖν
  choice: 所以现在
  rationale: 既保留οὖν承接上文、引出结论的推论作用，也表达νῦν的当下紧迫感；现代汉语自然明白。
- source_word: δῶμεν δεξιὰν
  choice: 让我们……伸出右手
  rationale: 原文直译为“给出右手”，是以右手表示信义、议和或结盟的惯用语。汉语用“伸出右手”保留具体动作意象，并由脚注说明其文化含义。
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: 向这些人
  rationale: 此处指眼前特定的一方；“这些人”准确而自然，且不在希腊词本身可泛指人的情况下额外强化性别。
- source_word: ποιήσωμεν ... εἰρήνην
  choice: 讲和
  rationale: 表示缔结和平关系；“讲和”简洁自然，适合当前军事政治语境。
- source_word: μετʼ αὐτῶν
  choice: 同他们
  rationale: 直接表达议和的对象。
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  choice: 以及他们全民族
  rationale: ἔθνος在此指他们所属的整个民族或国族，παντός强调全体；“全民族”保留其整体性。
