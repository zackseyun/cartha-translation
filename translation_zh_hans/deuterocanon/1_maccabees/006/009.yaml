  text: And he remained there for many days[a], because great grief came over him, and he thought that he was dying.
translation:
  language: zh_hans
  text: 他在那里逗留了多日，因为极大的忧愁重新临到他[a]，他以为自己要死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极大的忧愁在他身上重新被激起”。希腊语动词含有忧愁被更新、复发或重新出现的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: 他在那里住了
  rationale: 按叙事语境表达持续停留；比直译“他在那里”更自然，也保留延续意味。
- source_word: ἡμέρας πλείους
  choice: 多日
  rationale: 表示一段较长的日子；“多日”简洁、庄重，符合现代书面叙事。
- source_word: ἀνεκαινίσθη
  choice: 再次临到
  rationale: 被动形式用于“忧愁”，含更新、复发或重新出现之意；“再次临到”既自然，也保留复发意味。
- source_word: ἐπ᾽ αὐτόν
  choice: 临到他
  rationale: 与情绪负担搭配自然，保留原文忧愁加在其身上的意象。
- source_word: λύπη μεγάλη
  choice: 极大的忧愁
  rationale: 直接反映λύπη与μεγάλη的力度，表达深重的悲伤与痛苦。
- source_word: ἐλογίσατο
  choice: 认定
  rationale: 该词可指思量、判断或断定；此处“认定”比泛泛的“以为”更能体现经过判断所得的看法，又不过度强化为确定事实。
- source_word: ὅτι ἀποθνήσκει
  choice: 自己快要死了
  rationale: 希腊语现在时呈现死亡迫近或正在发生的状态；汉语“快要死了”自然表达人物意识到死亡临近，避免“正在死”在现代汉语中的生硬。
