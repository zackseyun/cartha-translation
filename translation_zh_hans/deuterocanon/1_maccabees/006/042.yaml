  text: And Judas and his camp advanced into battle formation, and six thousand men from the king’s camp fell.
translation:
  language: zh_hans
  text: 犹大和他的军队列阵上前，王的军队中有六千人阵亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισεν
  choice: 上前
  rationale: 原义为“接近、走近”；在列阵交战的军事语境中译作“上前”，自然表达向敌军推进而接近的动作，同时不额外断定具体战术。
- source_word: παρεμβολὴ
  choice: 军队
  rationale: 该词可指军营、营地，也可转指驻营的军队。本节描述列阵及战死人数，汉语用“军队”比重复使用“营地”更符合实际所指；两个出现处采用同一译法。
- source_word: εἰς παράταξιν
  choice: 列阵
  rationale: παράταξις指为交战而排列的阵势。“列阵”简洁保留军事含义，与“上前”连用也符合现代汉语表达。
- source_word: ἔπεσαν
  choice: 阵亡
  rationale: 原文直译为“倒下”，在战争叙事中是战死的惯用说法。现代汉语“阵亡”清楚传达这一战场语义，且保持庄重。
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: 六千人
  rationale: 忠实保留明确数目及“人”的表述，不擅自改成原文未明说的“士兵”。
