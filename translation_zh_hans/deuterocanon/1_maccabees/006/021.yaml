  yaml_path: translation/deuterocanon/1_maccabees/006/021.yaml
  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: zh_hans
  text: 他们从那里出来，脱离了受困的处境[a]；以色列中有些不敬虔的人也加入了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“围困”或“被封锁的处境”；希腊词强调被合围、关闭在内或受困的状态。
    reason: 说明συγκλεισμοῦ的语义范围，并保留其可能具有的军事含义。
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 直接表达从某处向外移动，符合不定过去时在叙事中的用法，现代汉语自然简洁。
- source_word: ἐξ αὐτοῦ
  choice: 从那里
  rationale: 原文代词的所指须由上下文补足；译作“从那里”保留指代，不擅自加入具体地点名称。
- source_word: συγκλεισμοῦ
  choice: 受困的处境
  rationale: 该词核心含义是被合围、关闭或限制在内；此译保留状态义，同时不在正文中过度限定为军事性的“围城”。
- source_word: ἐκολλήθησαν
  choice: 加入了
  rationale: 此处表示依附、归入某一群体；“加入了”在现代汉语中自然，也避免把关系过度解释为正式结盟或投降。
- source_word: τινες
  choice: 有些
  rationale: 准确表达不定复数，不额外补入原文没有明说的性别。
- source_word: ἀσεβῶν
  choice: 不敬虔的人
  rationale: 保留该词针对上帝与宗教忠诚的道德评价，比泛指的“恶人”更贴近原文，也比“不虔诚者”更自然庄重。
- source_word: ἐξ Ἰσραήλ
  choice: 以色列中
  rationale: 这里指这些人来自以色列群体内部；“以色列中”清楚表达群体来源。
theological_decisions:
- issue: ἀσεβῶν所表达的宗教—道德评价
  choice: 不敬虔的人
  alternative: 恶人；不虔诚的人；悖逆上帝的人
  rationale: 原词不只是一般意义上的邪恶，也含有不尊崇神明的意味；“不敬虔的人”保留这一张力，又不把经文扩写为更具体的神学判词。
- issue: συγκλεισμοῦ是否明确译为军事围困
  choice: 受困的处境
  alternative: 围困；封锁；禁闭
  rationale: 上下文可能涉及围困，但该名词本身着重于被封闭、合围的状态。正文采用较宽的译法，并在注释中列出军事语境下可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从那里出来，摆脱了……”在汉语中自然呈现原文连续两个ἐκ短语的强调，同时避免生硬直译；分号清楚区分两个并列事件。
