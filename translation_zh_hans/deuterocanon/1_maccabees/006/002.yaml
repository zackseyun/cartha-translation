base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/002.yaml
  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
translation:
  language: zh_hans
  text: 城里的神庙极其富有，那里有金制的覆盖物[a]、胸甲和兵器；这些都是腓力的儿子、马其顿王亚历山大留在那里的。他是最先统治希腊人的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金的遮盖物”。希腊文只说明这些物件是金制、用于覆盖，未明确其具体形制。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: 神庙
  rationale: 此处指城中的宗教建筑或圣所；鉴于语境并非耶路撒冷圣殿，用“神庙”既自然，也避免无根据地赋予犹太圣殿含义。
- source_word: πλούσιον σφόδρα
  choice: 极其富有
  rationale: 保留σφόδρα的强烈程度，表达神庙拥有大量财富。
- source_word: καλύμματα χρυσᾶ
  choice: 金制的覆盖物
  rationale: καλύμματα泛指用于遮盖的物件，具体形制不明；采用较透明的译法，不擅自具体化为帘幕或饰板。
- source_word: θώρακες
  choice: 胸甲
  rationale: 准确表达护卫躯干的甲胄，比泛称“盔甲”更具体。
- source_word: ὅπλα
  choice: 兵器
  rationale: 在与胸甲并列的军事物品清单中，“兵器”清楚而庄重。
- source_word: κατέλειπεν
  choice: 留在
  rationale: 表达亚历山大先前将这些物品留置于该处；汉语由上下文自然体现过去事件，无须另加时态标记。
- source_word: Ἀλέξανδρος ὁ τοῦ Φιλίππου
  choice: 腓力的儿子……亚历山大
  rationale: 自然呈现希腊文的父名说明，并保持人物身份清晰。
- source_word: ὁ βασιλεὺς ὁ Μακεδών
  choice: 马其顿王
  rationale: 简洁保留其马其顿身份和王者称号。
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: 他是最先统治希腊人的王
  rationale: 保留πρῶτος的“最先”及ἐβασίλευσεν加与格所表达的统治关系，不对这一历史性陈述另作解释。
