  text: And they saw the strength of the kingdom and the fierce rush of the forces, and they turned away from them.
translation:
  language: zh_hans
  text: 他们看见王国的强大和军队猛烈的冲锋[a]，就避开了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队猛烈的进攻”或“部队的突击”。希腊词表示战斗中强力向前推进的动作。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文作“他们”，是复数，可能指敌方军队，也可能概括前面所说的王国势力。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: 强大
  rationale: 指力量、威势；与“王国”搭配时，“王国的强大”自然地涵盖其政治和军事力量，又不过度抽象化。
- source_word: βασιλείας
  choice: 王国
  rationale: 该词可指王权、统治或王国；此处以军事力量为语境，“王国”保留其较宽泛的含义。
- source_word: ὁρμήμα
  choice: 猛烈的冲锋
  rationale: 该名词表示强力向前的运动或攻势；“猛烈的冲锋”既呈现战场上的动势，也保持现代汉语的清晰度。
- source_word: δυνάμεων
  choice: 军队
  rationale: 复数形式在军事语境中指兵力、部队；“军队”简明自然，且不把所指限定为某一兵种。
- source_word: ἐξέκλιναν
  choice: 避开了
  rationale: ἐκκλίνω意为转开、避开；“避开了”贴近原词，同时让上下文自然传达退却之意，而不明确添加“撤退”。
- source_word: ἀπʼ αὐτῶν
  choice: 他们
  rationale: 希腊文使用复数代词，最可能回指刚提到的敌方军队；译作“他们”保留原文的数，并不把指代强行改为单数的王国或王权。
