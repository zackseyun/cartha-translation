  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: zh_hans
  text: 他的军队共有十万步兵、两万骑兵，以及三十二头受过作战训练的象。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受过作战训练的”直译为“懂得战争的”，也可理解为有作战经验。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς τῶν δυνάμεων
  choice: 军队共有
  rationale: 原文直译为“他军力的数目是”；中文用“他的军队共有”自然表达军事编制的总数，同时保留统属关系。
- source_word: πεζῶν
  choice: 步兵
  rationale: 指徒步作战的军人，与后面的骑兵相对；“步兵”是现代汉语清楚、准确的军事用语。
- source_word: ἵππων
  choice: 骑兵
  rationale: 字面为“马”，但在步兵之后的军队人数列举中，是以马代指骑乘部队；译作“骑兵”符合语境。
- source_word: ἐλέφαντες
  choice: 象
  rationale: 直接对应原词；军事语境已由后面的修饰语明确，无须另加“战象”。
- source_word: εἰδότες πόλεμον
  choice: 受过作战训练的
  rationale: 字面为“懂得战争的”，修饰象，表示经过战争训练或有作战经验；此译自然且不强行限定为仅有训练而无实战经验。
