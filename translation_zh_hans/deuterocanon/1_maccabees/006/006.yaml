base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/006.yaml
  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: zh_hans
  text: 起初，吕西阿率领一支强大的军队进兵，却在他们面前败退；他们也借着从那些被他们摧毁的营寨中夺来的兵器，变得强盛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们凭着从那些被他们摧毁的营寨中夺来的兵器得胜。”希腊语既可侧重他们变得强盛，也可侧重他们得胜或占了优势；末尾的关系从句采用了简略的军事表达。
    reason: 保留 ἴσχυσαν 的词义歧义，以及 ὧν ἐξέκοψαν 这一压缩表达的开放性。
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 进兵
  rationale: 在军事语境中表示率军行进或出征；“进兵”既自然，也比泛泛的“前往”更能体现语境。
- source_word: Λυσίας
  choice: 吕西阿
  rationale: 按希腊语人名 Λυσίας 音译，并采用现代简体中文的自然形式。
- source_word: δυνάμει ἰσχυρᾷ
  choice: 率领一支强大的军队
  rationale: δύναμις 在此指军事力量；中文以“军队”明确其军事所指，而“强大的”对应 ἰσχυρᾷ。
- source_word: ἐν πρώτοις
  choice: 起初
  rationale: 表示事件最初阶段，并与随后败退的转折相呼应。
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: 在他们面前败退
  rationale: ἀνατρέπω 的被动式在战事中可指被击退或溃败；保留“在他们面前”这一空间性表达，同时使中文流畅。
- source_word: ἴσχυσαν
  choice: 日益强盛
  rationale: 该动词既可表示变得强大，也可表示占优势；上下文提到缴获兵器，“日益强盛”较好地呈现力量增长这一可能含义，同时在脚注保留另一解。
- source_word: ὅπλοις
  choice: 借着……兵器
  rationale: 用“借着”清楚表达工具格的意义，即他们凭缴获的武器增强实力。
- source_word: παρεμβολῶν
  choice: 营寨
  rationale: 该词在军事语境中指军营或营地；“营寨”兼具军旅色彩与庄重叙事语体。
- source_word: ἐξέκοψαν
  choice: 摧毁
  rationale: 其本义有砍下、铲除之意，在此压缩的军事表达中，“摧毁”可自然地以营寨为宾语，又不擅自补出希腊文未明说的敌军。
