translation:
  language: zh_hans
  text: 他从波斯和米底返回了；那些随王前去的军队也和他在一起[a]；并且他正设法接管政务；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一分句的希腊文句法艰涩：原文既有与“王”有关的表达，又有“与他一起”的表达。两者的确切句法关系及“他”的所指并不明确；正文仅保留这些信息，不作进一步判定。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: 返回
  rationale: 此处表示从一个地区折返、回来；“返回”自然简洁，也不额外引入撤退之意。
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: 从波斯和米底
  rationale: 按ἀπό加属格直译为出发或返回所离开的地区，保留两个地名。
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: 在军事叙事中指武装力量；“军队”是现代汉语中清楚而不过度限定编制的表达。
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: 那些随王前去的军队也和他在一起
  rationale: 原文同时出现与“王”相关的与格和“与他一起”，句法艰涩。正文保留“随王前去”和“和他在一起”这两个要素，并补出汉语所需的判断关系，但不进一步断定各代词的确切所指。
- source_word: ζητεῖ
  choice: 正设法
  rationale: 体现现在时所表达的持续意图或企图，比单纯“要”更贴近ζητεῖ。
- source_word: παραλαβεῖν
  choice: 接管
  rationale: 在政治军事语境中表示取得控制、承担掌管之权，而不只是一般性的“接收”。
- source_word: τὰ τῶν πραγμάτων
  choice: 政务
  rationale: 该习语指事务的管理或政权运作；“政务”符合上下文，同时保持简洁。
