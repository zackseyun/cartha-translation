base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: zh_hans
  text: 他把其余的骑兵部署在军营左右两翼；他们挥舞兵器[a]，在方阵中严密列队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“挥动着”；希腊文所挥动的对象没有明说，可能是兵器。
    reason: lexical_alternative
  - marker: b
    text: “严密列队”所译的希腊词含义较难确定，也可理解为“在方阵中护卫自己”“严阵以待”或“结成屏障”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: 其余的骑兵
  rationale: ἵππος 在军事语境中可集合性地指骑兵；译作“骑兵”既符合上下文，也比直译“马”自然准确。
- source_word: ἔνθεν καὶ ἔνθεν
  choice: 左右
  rationale: 该习语在此表示分处两边，并非零散地“到处”部署。
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: 在军营……两翼
  rationale: παρεμβολή 在军事叙事中指军营，τὰ δύο μέρη 指其两边；“两翼”自然传达战术位置。
- source_word: κατασείοντες
  choice: 挥舞兵器
  rationale: 该分词表示带威吓意味的挥动或摇动；原文未明说宾语，中文补出语境中隐含的“兵器”，使动作清楚自然。
- source_word: καταφρασσόμενοι
  choice: 严密列队
  rationale: 该词本有遮护、围堵或加强防卫之意；与“在方阵中”连用时，较可能描写骑兵收紧、排密阵列，但词义存在困难，故以脚注保留其他可能。
- source_word: ἐν ταῖς φάλαγξιν
  choice: 在方阵中
  rationale: φάλαγξ 是希腊化军事语境中的阵列术语；“方阵”保留其具体军事色彩。
