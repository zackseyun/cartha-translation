  text: and to follow his commands[a], because those of our people were becoming alienated from us on account of this, except those who were found among us.
translation:
  language: zh_hans
  text: 并遵从他的命令，因为我们本族的人正因此与我们疏远；但那些被发现是在我们当中的人除外。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希腊文的结构紧缩，直译近于“但那些被发现是从我们而来的人除外”。末尾“从我们而来”所表示的关系并不明确，也可指“与我们在一起”或“与我们有关联”；正文译作“在我们当中”，以保留这种含混。
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθεῖν
  choice: 遵从
  rationale: 该不定式与“命令”搭配时表示跟从并服从；“遵从”在现代汉语中自然地传达顺服权威指令之意。
- source_word: προστάγμασιν
  choice: 命令
  rationale: 指具有权威性的指令；因有第三人称所有语“他的”，译作“命令”比“法令”更贴合。
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: 我们本族的人
  rationale: 希腊文为省略式表达，直义近于“我们人民中的人”；“我们本族的人”保留群体归属，又不擅自添加性别。
- source_word: χάριν τούτου
  choice: 因此
  rationale: 表达原因；“正因此”简洁自然，并与前后因果关系相称。
- source_word: ἠλλοτριοῦντο
  choice: 正……疏远
  rationale: 未完成时中间/被动形式表示持续发展的疏离过程；“正与我们疏远”保留其进行性及社会关系上的隔阂。
- source_word: ἀφʼ ἡμῶν
  choice: 与我们
  rationale: 在ἠλλοτριοῦντο之后表示离开、疏远的对象；汉语以“与我们疏远”最为自然。
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: 只有那些被发现属于我们这边的人例外
  rationale: πλήν引出例外，εὑρίσκοντο直译为“被发现”；末尾ἀφʼ ἡμῶν的关系含义不够明确，可指与说话者一方有关联，故正文采用“属于我们这边”，并以脚注保留歧义。
