  text: And Judas moved away from the citadel and encamped at Beth-zachariah[a], opposite the king’s camp.
translation:
  language: zh_hans
  text: 犹大离开堡垒[a]，在伯特撒迦利亚安营，与王的营地相对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译为专名“阿克拉”，即耶路撒冷的坚固堡垒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 离开
  rationale: 该动词表示从一处动身或离去；“离开”自然准确，也不额外暗示败退。
- source_word: ἄκρας
  choice: 堡垒
  rationale: ἄκρα可指高处的坚固堡垒；在《马加比一书》中常特指耶路撒冷的阿克拉堡。正文采用普通名词，脚注保留专名可能。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 这是军事语境中的扎营、设营，译作“安营”简洁庄重。
- source_word: εἰς Βεθζαχαριά
  choice: 在伯特撒迦利亚
  rationale: εἰς本含向着或进入之意，但与“安营”连用时，现代汉语自然表达为“在……安营”。
- source_word: ἀπέναντι
  choice: 与……相对
  rationale: 表示处在对面或面向某处；“与……相对”保留其空间关系而不作额外推断。
- source_word: παρεμβολῆς
  choice: 营地
  rationale: 此名词指军队驻扎的营盘；“营地”与前文动词“安营”搭配自然。
- source_word: τοῦ βασιλέως
  choice: 王的
  rationale: 直接表达希腊文属格关系，简明自然。
