  yaml_path: translation/deuterocanon/1_maccabees/006/045.yaml
  text: And he charged boldly into the middle of the phalanx[a], and kept killing right and left, and they were split apart before him on both sides.
translation:
  language: zh_hans
  text: 他勇敢地向那头象冲去，闯入方阵中央，在左右不断杀敌；军阵便在他面前向两边裂开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“军阵便在他面前向这边那边裂开。”希腊语“ἔνθα καὶ ἔνθα”直译为“这边和那边”，可指朝不同方向分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέδραμεν αὐτῷ
  choice: 向它冲去
  rationale: ἐπιτρέχω在此表示带有攻击性的猛冲；保留与格代词αὐτῷ，以“它”承接上文所指的象，而不把动作弱化为单纯奔跑。
- source_word: θράσει
  choice: 勇猛地
  rationale: 方式与格表达大胆、无畏的行动；“勇猛地”既自然，也符合战斗语境。
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: 直闯方阵中央
  rationale: φάλαγξ指列队作战的密集军阵；“方阵”保留具体军事意象，“直闯……中央”传达进入其正中的冲势。
- source_word: ἐθανάτου
  choice: 不断击杀
  rationale: 未完成时表示冲锋过程中持续或反复杀敌；“不断击杀”在现代汉语中清楚呈现这一体貌。
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: 左右
  rationale: 这是表示右边和左边的惯用并列表达；译作“左右”简洁自然。
- source_word: ἐσχίζοντο ἀπʼ αὐτοῦ
  choice: 敌军便在他面前……分开
  rationale: 被动未完成时描绘军阵随着他的推进持续裂开或让开；根据复数主语和军事语境以“敌军”明示所指，“在他面前”自然表达ἀπʼ αὐτοῦ在此处的空间关系。
- source_word: ἔνθα καὶ ἔνθα
  choice: 向两边
  rationale: 字面可指“这边和那边”；结合前面的“左右”，此处最自然地表示敌军朝两侧分开，同时用脚注保留较逐字的可能译法。
