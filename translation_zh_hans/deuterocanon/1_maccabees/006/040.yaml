  to: 王军的一部分部署在高山上，另一些则部署在低处[a]；他们安全而有序地前进。
  rationale: 修订以“部署在”自然表达部队沿不同地势展开，并在第二分句补出汉语所需的平行动词，不增添原文没有的兵力规模或战术细节。“安全而有序地前进”分别对应ἀσφαλῶς和τεταγμένως。脚注移至“低处”，说明τὰ ταπεινά的地貌范围及其与高山的对照。
