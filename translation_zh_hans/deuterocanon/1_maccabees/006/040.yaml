base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/040.yaml
  text: And part of the king’s camp spread out over the high mountains[a], and some over the lowlands; and they advanced securely and in formation.
translation:
  language: zh_hans
  text: 王军的一部分部署在高山上，另一些则部署在低处[a]；他们安全而有序地前进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“较低的地方”或“低地”。原文将此处与“高山”相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάθη
  choice: 展开到
  rationale: 该不定过去时被动形式表示军队沿地势铺开或部署；“展开到”既保留延展之意，也符合军事语境。
- source_word: μέρος τι
  choice: 一部分
  rationale: 表示不确定的一部分兵力；“一部分”自然简洁，不额外限定其规模。
- source_word: παρεμβολῆς τοῦ βασιλέως
  choice: 王军
  rationale: παρεμβολή可指营地，也可转指驻营的军队；上下文描写部队部署和行进，因此译作“王军”比字面的“王的营地”更符合此处所指。
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: 到高山上
  rationale: ἐπί加宾格在此表示沿地势延伸、部署到其上；“高山”保留原文的明确地貌用语。
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: 另一些人则在低处
  rationale: τινες指另一些兵士，τὰ ταπεινά是形容词中性复数名词化，泛指较低的地方；译文保留其与“高山”的地势对照，也保留原文略语式结构。
- source_word: ἤρχοντο
  choice: 前进
  rationale: 未完成时描写军队持续行进；军事语境中“前进”比一般的“来”更自然。
- source_word: ἀσφαλῶς
  choice: 稳稳地
  rationale: 该副词可表示安全、稳妥或不受威胁地行动；“稳稳地”在此既自然，也避免把含义过度限定为人身安全或主观自信。
- source_word: τεταγμένως
  choice: 列队
  rationale: 源于排列、编队的军事概念；“列队前进”清楚表达军队按秩序、按阵形行进。
