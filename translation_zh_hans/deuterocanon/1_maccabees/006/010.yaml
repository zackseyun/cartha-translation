base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/010.yaml
  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
translation:
  language: zh_hans
  text: 他召集了所有的朋友[a]，对他们说：“睡意从我眼中消退[b]，我的心因忧虑而消沉[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”也可译作“同伴”或“亲信”；在希腊化时代的宫廷语境中，这个希腊词也可指君王核心圈子中的近臣或顾问。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“睡眠从我的眼睛离开”。也可译作“我无法入睡”。
    reason: idiom_clarification
  - marker: c
    text: 也可译作“我的心衰颓”或“我心里发昏”。原文表达因忧虑而陷入消沉、无力的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 召来
  rationale: καλέω在此可指叫来或召集；“召来”符合君王召见身边人的语境，又不把动作强化为正式征召。
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: 自己所有的朋友
  rationale: 直译φίλοι为“朋友”，保留原文措辞；在希腊化宫廷语境中，该词也可能指君王的亲信或近臣，故以脚注说明。
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: 睡眠离开了我的双眼
  rationale: 保留ἀφίσταται“离开、退去”以及“从眼中离开”的鲜明意象，同时在现代汉语中仍清楚表达无法入睡。
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: 我的心……衰弱
  rationale: 该表达描写内心陷入衰颓、无力的状态；“我的心衰弱”保留“心”的意象，也避免把含义限定为单纯悲伤或恐惧。
- source_word: ἀπὸ τῆς μερίμνης
  choice: 因忧虑
  rationale: μέριμνα可指挂虑、忧愁或焦虑；“忧虑”自然庄重，并准确说明造成内心衰弱的原因。
