  yaml_path: translation/deuterocanon/1_maccabees/006/036.yaml
  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: zh_hans
  text: 无论那兽在哪里，这些人都预先在那里；无论它往哪里去，他们都和它一同前行，不离开它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 指上一文所说被派在象旁的人；汉语补出“人”，可使指代自然清楚，并未改变所指。
- source_word: πρὸ καιροῦ
  choice: 预先
  rationale: 表达事先就位、提前守候的时间意义，简洁而符合现代汉语。
- source_word: οὗ ἂν ᾖ
  choice: 所在的地方
  rationale: 原文是不定关系从句，表示那兽无论在何处；结合“预先守在”译为“所在的地方”，在汉语中自然地保留地点范围。
- source_word: τὸ θηρίον
  choice: 那兽
  rationale: 保留原文“兽、动物”的一般称呼，不直接以语境中的“大象”替换；“那”承接前文已提到的对象。
- source_word: ἐπορεύετο
  choice: 往哪里去
  rationale: 采用一般移动动词，不额外加入“行军”等原文未明说的军事色彩。
- source_word: ἅμα
  choice: 与它同行
  rationale: 表达一同前行、行动同步的意义，符合上下文。
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: 不离开它
  rationale: 自然表达这些人始终留在那兽旁边、不与它分开的意思。
