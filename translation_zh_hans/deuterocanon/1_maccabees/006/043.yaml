base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: zh_hans
  text: 以利亚撒·撒瓦兰看见群兽中有一头[a]披挂着王室的铠甲，比所有的兽都高大；看来王就在它上面。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所说的“兽”，按上下文是战象。
    reason: cultural_note
  - marker: b
    text: “看来”也可译作“似乎”；希腊文表达的是外观所造成的判断，并非确定无疑。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: 以利亚撒·撒瓦兰
  rationale: 将Ἐλεάζαρ按通行圣经人名译作“以利亚撒”，并依本节希腊文本音译Σαυαρὰν；冠词ὁ表明后者是附加于人名的称号或别名，但其确切含义不明，故不作解释性翻译。
- source_word: ἐν τῶν θηρίων
  choice: 群兽中有一头
  rationale: θηρίον本义为兽或动物；上下文所指是战象。正文保留本节的泛称，同时以“一头”自然表达群体中的某一头。
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: 披挂着王室的铠甲
  rationale: 动词与名词为同根的甲胄用语。中文若机械重复为“用胸甲武装”不自然；“披挂着……铠甲”既表现装备状态，也保留βασιλικοῖς所表达的王室属性。
- source_word: ὑπεράγον πάντα τὰ θηρία
  choice: 比所有的兽都高大
  rationale: ὑπεράγω在此表示这头兽明显高出或胜过其余的兽；结合可见外形，“高大”比抽象的“胜过”更符合场景，同时不过度限定为精确身高。
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: 看来王就在它上面
  rationale: ὤφθη表达显现、看来如此，而非确定事实；“看来”保留推断性。ἐν在乘骑语境中自然译为“在……上面”。
theological_decisions:
- issue: 王是否确实在兽上
  choice: 以“看来”表达叙述中的表象和推断
  alternative: 王就在它上面／以利亚撒认定王在它上面
  rationale: 希腊文ὤφθη只说明当时看起来如此，并未保证判断属实；译文不把不确定性改写成事实，也不强化为人物内心的确定判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“群兽”“披挂”“王室的铠甲”略带历史叙事色彩，但不古奥；保留原文对动物的泛称及对王是否在场的不确定语气。
