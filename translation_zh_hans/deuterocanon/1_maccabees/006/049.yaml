base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: zh_hans
  text: 他与伯夙拉的人达成协议后，便从城里出来；因为伯夙拉的人在那里没有粮食可供困守城中，原来那一年是土地的安息年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译较简略，可作“对土地而言是安息”；这里指土地休耕的安息年。正文为清楚起见补出了“年”。
    reason: 说明“安息年”是按上下文对原文简约表述所作的清楚表达。
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: 他与伯夙拉的人达成协议
  rationale: 该历史叙事惯用语表示与对方议和或达成协议；“达成协议”符合围城语境，又不额外断定具体条款。
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: 便从城里出来
  rationale: 按所给希腊文本保留第三人称单数动词的主语连续性，不擅自改成复数，也不将这一行动解释为投降或撤离。
- source_word: διατροφή
  choice: 足够的粮食
  rationale: 该词指维持生活所需的供给；在围城及土地休耕的上下文中，核心所指是食物。加入“足够”自然表达无法继续困守的因果关系。
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: 继续困守城中
  rationale: 表达被围而留在城内的持续状态；“困守”贴合军事语境，但不明说其是否自愿。
- source_word: σάββατον ἦν τῇ γῇ
  choice: 那一年是土地的安息年
  rationale: 直译为“土地有安息”，语境所指是土地休耕的安息年；正文补出“年”以免现代读者误解为每周的安息日。
theological_decisions:
- issue: σάββατον ἦν τῇ γῇ 所指为何
  choice: 土地的安息年
  alternative: 土地有安息
  rationale: 历史与农业语境表明这是土地休耕之年。译文明确其通常所指，同时以脚注保留希腊文较简约的字面表达，避免添加进一步的宗派性解释。
- issue: ἐξῆλθε 的单数主语
  choice: 按希腊文本译作“他……出来”
  alternative: 依上下文译作“他们……出来”
  rationale: 所给原文动词为第三人称单数，故保留其语法形式及由此产生的叙事张力，不根据其他文本传统或上下文默改为复数。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“达成协议”比“处理”明确，又比“投降”中性；“困守城中”自然呈现围城处境。脚注标记置于实际需要说明的“安息年”之后。
