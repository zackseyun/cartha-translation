lexical_decisions:
- source_word: ἔγνων
  choice: 我知道
  rationale: 该不定过去时在直接引语中表达已经形成、现今持有的认识；“我知道”自然地传达说话者此刻的领悟。
- source_word: χάριν τούτων
  choice: 正因这些事
  rationale: χάριν加属格在此表示原因；“正因”既准确表达“由于”，又保留说话者将当前灾祸归因于先前行为的强调。
- source_word: εὗρόν με
  choice: 临到我
  rationale: 字面为“找到了我”；以灾祸为主语时，汉语“临到我”自然表达不幸降临，同时保留庄重的经文语体。
- source_word: τὰ κακὰ ταῦτα
  choice: 这些灾祸
  rationale: κακά在这里指遭遇的苦难或祸患，而非说话者所行的道德邪恶；“灾祸”比“恶事”更符合语境。
- source_word: καὶ
  choice: 并且……
  rationale: 所提供的希腊语片段以连接词καὶ结束。译文保留“并且”，并以省略号明确显示语句未完，不擅自补足缺文。
