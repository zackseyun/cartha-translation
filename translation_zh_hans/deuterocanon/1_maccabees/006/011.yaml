base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: zh_hans
  text: 我心里说：“我竟陷入何等的苦难和巨大的风暴中！如今我正身在其中，因为我曾为人仁厚，受人爱戴。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ
  choice: 我心里说
  rationale: 按希腊语习语表达内心自语；现代汉语自然，同时保留“心”的意象。
- source_word: Ἕως τίνος θλίψεως ἦλθον
  choice: 我竟落到这般苦难之中
  rationale: Ἕως τίνος 在此感叹所陷苦难之深；“落到……之中”对应 ἦλθον，并呈现突遭困境的语气。
- source_word: κλύδωνος μεγάλου
  choice: 如此巨大的风暴
  rationale: κλύδων 可指巨浪、风浪或猛烈动荡；语境使用比喻，“风暴”既自然又保留灾难性的海浪意象。
- source_word: ἐν ᾧ νῦν εἰμί
  choice: 如今我身陷其中
  rationale: 保留关系结构所指的当前困境，并以“身陷”传达持续处境。
- source_word: χρηστὸς
  choice: 为人仁厚
  rationale: χρηστός 可表示良善、仁慈或宽厚；此处是对其以往待人品格的陈述，“仁厚”较贴切。
- source_word: ἀγαπώμενος
  choice: 受人爱戴
  rationale: 被动分词意为“被爱”；君王自述往日处境时，“受人爱戴”比单纯“被爱”更自然。
theological_decisions:
- issue: ὅτι 所表达的逻辑关系
  choice: 译作“虽曾”，理解为让步性的张力
  alternative: 译作“因为我曾为人仁厚，受人爱戴”
  rationale: ὅτι 通常可作“因为”，但在此若作严格因果，逻辑生硬；上下文是今昔反差。译为“虽曾”明确呈现这一反差，但不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留内心独白、苦难与风暴的并列意象，以及昔日受爱戴与如今身陷困境之间的张力。
