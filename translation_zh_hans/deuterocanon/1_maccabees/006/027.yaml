base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/027.yaml
  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
translation:
  language: zh_hans
  text: 如果他不赶快抢在他们前面采取行动[a]，他们就会做出比这些更大的事[b]，到时他便无法制止他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赶快先下手阻止他们”或“赶快追上他们”；希腊语动词含有抢先行动、预先阻止之意。
    reason: lexical_alternative
  - marker: b
    text: 直译“比这些更大的事”；按上下文，也可能指更严重或规模更大的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  choice: 抢在他们前面采取行动
  rationale: 该动词表示先于对方行动或预先阻止其行动；此译法自然传达先发制人的含义，同时不把语义限定为单纯追赶或军事术语。
- source_word: διὰ τάχους
  choice: 赶快
  rationale: 该短语表示迅速、毫不迟延；“赶快”符合劝告语境中的紧迫感。
- source_word: μείζονα τούτων
  choice: 比这些更大的事
  rationale: 保留比较级“更大”的字面表达及其开放性；在上下文中可指更严重或规模更大的行动，但不在正文中强行限定。
- source_word: κατασχεῖν
  choice: 制止
  rationale: 此处表示压制、阻止或控制对方；“制止”适合政治军事语境，且与“无法”搭配自然。
- source_word: αὐτῶν
  choice: 他们
  rationale: 属格在这里依附于不定式，汉语宜按受事译为“他们”。
- source_word: οὐ δυνήσεται
  choice: 到时他便无法
  rationale: 保留将来时所表达的未来无能为力；加入“到时”使汉语中的时间后果关系清楚而不改变命题内容。
