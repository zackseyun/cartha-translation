base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/051.yaml
  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: zh_hans
  text: 他在圣所前安营多日，并在那里架设投射器、攻城机具、抛火器、抛石器和蝎子[a]，用来发射箭矢和弹石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蝎子”是古代一种小型军用投射器。
    reason: 解释古代军械专名，避免将其误解为动物，同时不把其具体构造或技术类型过度确定。
lexical_decisions:
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 该动词首先表示扎营或安营；军事语境含有围攻意味，但正文保留原词所明说的行动，不直接改译为“围攻”。
- source_word: ἐπὶ τὸ ἁγίασμα
  choice: 对着圣所
  rationale: ἐπί加宾格在此表示朝向敌对目标；“对着”既呈现军事上的针对性，也避免把ἁγίασμα过度限定为圣殿建筑本身。
- source_word: ἡμέρας πολλάς
  choice: 多日
  rationale: 简洁自然地表达时间宾格所表示的持续时段。
- source_word: ἔστησεν
  choice: 架设
  rationale: 适合安置并立起各类军用投射设备，比笼统的“放置”更符合上下文。
- source_word: βελοστασίσεις
  choice: 投射器
  rationale: 该词指发射箭矢或其他投射物的装置；采用较宽泛的现代汉语称呼，以免武断指定某一种器械。
- source_word: μηχανὰς
  choice: 攻城机具
  rationale: μηχανή本义宽泛，在此器械清单和围攻语境中指军用机械；补出“攻城”使现代读者清楚其用途。
- source_word: πυροβόλα
  choice: 抛火器
  rationale: 直译其“投抛火物”的复合词义，同时避免让人误解为后世的火器。
- source_word: λιθοβόλα
  choice: 抛石器
  rationale: 忠实表达“投石装置”，而不把具体结构过度确定为某一种投石机。
- source_word: σκορπίδια
  choice: 蝎子炮
  rationale: 保留古代军械“蝎子”的专名，并以“炮”表明它是投射器械；脚注说明其性质，防止读者按动物字面理解。
- source_word: εἰς τὸ βάλλεσθαι
  choice: 用来发射
  rationale: 以自然汉语表达冠词化不定式的目的意义。
- source_word: βέλη
  choice: 箭矢
  rationale: βέλος可泛指投射物，但在与弹石并列时，“箭矢”是清楚且合乎语境的具体译法。
- source_word: σφενδόνας
  choice: 弹石
  rationale: 这里列举被发射的物体，故按投石索所用的石弹理解，而非译作投石索本身。
