lexical_decisions:
- source_word: ἐπέγνω
  choice: 得知
  rationale: 这里表示吕西亚获知王已死这一事实；“得知”符合现代汉语叙事习惯，也不额外强调辨认或亲眼确认。
- source_word: τέθνηκεν
  choice: 已经死了
  rationale: 完成时表达死亡已经发生且结果持续；“已经死了”自然传达这一状态。
- source_word: κατέστησεν βασιλεύειν
  choice: 立……作王
  rationale: 该结构表示使某人取得君王的身份并执掌王权；“立……作王”兼顾正式任立与实际统治。
- source_word: ἀντʼ αὐτοῦ
  choice: 接替他
  rationale: 此处指安条克继承已故君王的位置；“接替他”在现代汉语中自然清楚。
- source_word: ἐξέθρεψεν
  choice: 抚养长大
  rationale: 该词指养育儿童直至成长；“抚养长大”准确而通俗。
- source_word: νεώτερον
  choice: 从小
  rationale: 这里描述安条克年幼时即由吕西亚抚养；“从小”自然表达其幼年阶段，同时不武断规定具体年龄。
- source_word: καί
  choice: 并且……
  rationale: 所给希腊文本以连接词结尾，显示句意尚未完结；保留“并且”及省略号可让中文读者看出这一断续。
