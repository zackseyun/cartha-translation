base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: zh_hans
  text: 可是现在，我想起自己在耶路撒冷所行的恶事：我拿走了城里所有的银器和金器，又派人去无缘无故地[a]铲除住在犹大的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无缘无故地”也可译作“毫无理由地”；原文是一个含有“空”之意的习语，在这里表示没有正当理由。
    reason: 说明διὰ κενῆς的习语含义及其可替代译法，避免将其误解为行动没有结果。
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: 我想起
  rationale: 现在时中间语态表达说话者此刻回想起来；“我想起”符合现代汉语叙述，也保留突然自省的语气。
- source_word: τῶν κακῶν
  choice: 恶事
  rationale: κακά在此指具有道德性质的恶行，而非单纯的灾祸或失误；“恶事”既保留伦理分量，又自然易懂。
- source_word: πάντα τὰ σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: 所有的银器和金器
  rationale: σκεύη在圣殿财物的语境中指器皿；原文分别提到银制和金制的器物，译文保留这种并列。
- source_word: ἐξαπέστειλα τοῦ ἐξᾶραι
  choice: 派人去……铲除
  rationale: ἐξαπέστειλα表示派出，后接表目的的属格不定式；汉语补出隐含的受派者“人”，比直译“派出”更完整。“铲除”传达ἐξαίρω在此彻底除去居民的强烈语义。
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: 住在犹大的人
  rationale: 分词结构指居住在犹大地区的人；此译简洁自然，并避免把地名擅自限定为某一现代行政称谓。
- source_word: διὰ κενῆς
  choice: 无缘无故地
  rationale: 该习语在此表示没有缘由或正当理由；“无缘无故地”是自然的现代汉语，同时脚注说明其可替代表达。
theological_decisions:
- issue: 安条克在自述中对自身行为的道德定性
  choice: 将κακῶν译作“恶事”
  alternative: 错事；恶行
  rationale: 原文让说话者承认其行为具有道德上的邪恶性质，而不只是政策失误；“恶事”保留这种认罪般的伦理力度，却不附加特定教义解释。
- issue: 铲除犹大居民的动机
  choice: 译作“无缘无故地”，保留缺乏正当理由的含义
  alternative: 徒然地；毫无理由地
  rationale: διὰ κενῆς可能引出“空、徒然”的联想，但在此语境中主要表示行动没有缘由或根据；脚注保留措辞层面的余地。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是现在”呈现νῦν δὲ的转折，“城里”自然回指耶路撒冷；整体保留第一人称自省和承认罪责的语气。
