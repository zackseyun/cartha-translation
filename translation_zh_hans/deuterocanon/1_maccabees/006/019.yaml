  text: And Judas decided to root them out[a], and he assembled all the people to besiege them.
translation:
  language: zh_hans
  text: 犹大决意铲除他们，并召集全体民众来围困他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλογίσατο
  choice: 决意
  rationale: 此处中间语态表达经过考虑后形成的坚定意图；“决意”既保留思量后作出决定的意味，也符合军事叙事语境。
- source_word: ἐξᾶραι
  choice: 铲除他们
  rationale: 该不定式指以强力除去对方。“铲除”体现敌对性和彻底清除的意图，但不进一步限定为杀灭。
- source_word: ἐξεκκλησίασεν
  choice: 召集
  rationale: 该动词表示召集或聚集会众；与“全体民众”搭配时，“召集”自然、准确。
- source_word: πάντα τὸν λαόν
  choice: 全体民众
  rationale: 希腊文直指“全体人民”。上下文可能侧重可参与作战的群体，但原文未明确说“军队”，因此不作窄化。
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: 围困他们
  rationale: 这一带冠词不定式表示召集民众的目的；相关表达字面有“坐在四周”之意，在军事语境中即包围并实施围攻。“围困”比逐字翻译更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“决意……就……”清楚呈现决定与行动的推进；保留“民众”而不改作“军队”，避免超出希腊文本。英文咨询层脚注实际解释的是“围困”对应的军事习语，而其标记置于“铲除”之后，标记与内容疑似错位；中文正文已直接表达该军事含义，故不设脚注。
