  yaml_path: translation/deuterocanon/1_maccabees/006/054.yaml
  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: zh_hans
  text: 留在圣所[a]里的只剩下少数人，因为饥荒压倒了他们；他们就四散，各自往自己的地方去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣地”或“神圣区域”。希腊文直译为“在神圣的事物／地方中”，在这里是指圣殿的神圣区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: 只剩下
  rationale: 保留其余人已经离去、仅有少数人留下的含义；“只剩下”在现代汉语中自然，也能表达被动结果。
- source_word: ἐν τοῖς ἁγίοις
  choice: 在圣所里
  rationale: 此复数中性形容词实体化用法在上下文中指圣殿的神圣区域；“圣所”简洁自然，同时以脚注保留“圣地/神圣区域”的可能表达。
- source_word: ἄνδρες ὀλίγοι
  choice: 少数人
  rationale: ἄνδρες在此指守卫中的男子；中文“少数人”在该叙事语境中自然，且不必生硬重复性别信息。
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: 饥荒压倒了他们
  rationale: κατακρατέω表示制伏、占上风；“压倒”保留饥荒人格化并胜过他们的力度。
- source_word: ἐσκορπίσθησαν
  choice: 他们四散
  rationale: 表达众人分散开来的结果；中文不必机械保留希腊语被动形式，仍保留其离散意象。
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: 各自回到自己的地方
  rationale: 忠实保留τόπος宽泛的“地方”，不将其过度具体化为“家”；补出“回到”使汉语方向表达自然。
theological_decisions:
- issue: 圣殿相关短语ἐν τοῖς ἁγίοις的译法
  choice: 在圣所里
  alternative: 在圣地里；在神圣区域内
  rationale: 短语在此具有空间和礼仪含义，所指是圣殿的神圣区域。“圣所”最简洁易懂，但原文形式并不强制限定为单一房间，因此用脚注保留范围上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“只剩下少数人”突出人数锐减；分号保留原句前后两个结果之间的紧密联系。
