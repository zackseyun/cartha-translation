lexical_decisions:
- source_word: κρίσιν
  choice: 审判
  rationale: 原文在此以宾格名词开头，显然承接前文；译作“审判”保留其司法含义及残句状态，不擅自补足句法。
- source_word: ἐκδικήσεις
  choice: 为……伸冤
  rationale: 该动词既可指报仇，也可指为受屈者讨回公道。“伸冤”自然表达寻求公正的含义，同时用脚注保留“报仇”的可能。
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: 我们的弟兄
  rationale: 保留ἀδελφοί的亲属称谓；在本段政治、军事语境中，也可涵盖同族或同伴。
- source_word: εὐδοκοῦμεν
  choice: 我们甘愿
  rationale: 此处表示欣然同意或乐意采取某种行动。“甘愿”比直译“喜悦”更符合现代汉语，又保留主动、正面的意愿。
- source_word: δουλεύειν
  choice: 服事
  rationale: 在此指对君王效忠、为其服务，并非着重奴隶身份；“服事”兼顾政治臣服和圣经语体。
- source_word: τῷ πατρί σου
  choice: 你父亲
  rationale: 按与格所指对象直接翻译，不作增补。
- source_word: πορεύεσθαι
  choice: 去行
  rationale: πορεύομαι在此与“照他所说的”连用，表达按其话语行事；“去行”自然传达此义，并略保留行动意象。
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: 照他所说的
  rationale: 直译为“按照由他所说的事”；此译自然、准确，且不将一般的“所说之事”强化为明确的“命令”。
theological_decisions:
- issue: ἐκδικήσεις所表达的是报仇还是伸张正义
  choice: 正文译为“为我们的弟兄伸冤”
  alternative: “替我们的弟兄报仇”
  rationale: 希腊词兼有讨回公道与报仇的语义。正文选用较能涵盖司法正义的“伸冤”，脚注保留较强的报复性译法，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“审判”有意保留原文残句的突兀；“弟兄”维持经文称谓；“照他所说的去行”避免生硬的被动表达，也不把原文过度解释为“遵守他的命令”。
