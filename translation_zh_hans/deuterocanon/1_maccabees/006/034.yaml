  text: And they showed the elephants the blood of grapes and mulberries[a], to provoke them for battle.
translation:
  language: zh_hans
  text: 他们把葡萄和桑葚的血[a]给大象看，要激励它们投入战斗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“葡萄和桑葚的血”，是对它们红色汁液的生动说法。
    reason: 说明原文保留的比喻，避免读者将“血”误解为动物血。
lexical_decisions:
- source_word: ἔδειξαν
  choice: 给……看
  rationale: 这是表示“让某人看见、给某人看”的简单过去时叙事动词；结合与格“给大象”，译为“把……给大象看”自然准确。
- source_word: τοῖς ἐλέφασιν
  choice: 给大象
  rationale: 与格复数标明展示的对象；现代汉语用“给大象看”清楚表达间接宾语关系。
- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: 葡萄和桑葚的血
  rationale: 保留原文以“血”指红色汁液的鲜明比喻；σταφυλῆς按集合意义译作“葡萄”，μόρων译作“桑葚”。
- source_word: τοῦ παραστῆσαι
  choice: 好使它们投入
  rationale: 带τοῦ的不定式表示目的；παραστῆσαι在此军事语境中指使大象上阵、投入作战。译文避免把原意过度限定为单纯的刺激或激怒。
- source_word: εἰς τὸν πόλεμον
  choice: 战斗
  rationale: 介词短语在此指进入战事、上阵作战；与“投入”搭配为自然的现代汉语军事表达。
