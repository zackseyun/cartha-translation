  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: zh_hans
  text: 王清早起来，便率军以迅猛之势[b]沿着通往伯特撒迦利亚的道路[a]开拔。军队列阵准备交战，吹响了号角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沿伯特撒迦利亚那条路”或“取道伯特撒迦利亚”。希腊语可指沿着与该地相关的路线行进。
    reason: lexical_alternative
  - marker: b
    text: 也可译“带着全营的冲势”。这里的希腊语可指军事行动中的冲势、猛劲或推进势头。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  choice: 清早起来
  rationale: 该动词指清早起身或一早行动；译文保留时间重点，不把它直接释作“黎明出发”。
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: 率领全营……进发
  rationale: ἀπαίρω与παρεμβολή连用，表示使营地开拔、率军启程。此译法以自然汉语表达有组织的全营移动。
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: 以迅猛之势
  rationale: ὅρμημα在军事语境中可指冲势、猛劲或推进的势头；“以迅猛之势”保留动态力量，也避免将其限定为兵力规模。
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: 沿着通往伯特撒迦利亚的道路
  rationale: κατά与ὁδός连用表示沿某条道路行进；“通往”自然呈现行进方向，同时以脚注保留“经由”的可能理解。
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: 军队列阵准备交战
  rationale: διατάσσω在军事语境中指部署或排成战阵；该译法清楚表达战术性的列阵。
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: 吹响了号角
  rationale: 同源动词与名词的结构表示以号角发出军事信号；“吹响了号角”是自然、庄重的现代汉语。
- source_word: Βεθζαχαριά
  choice: 伯特撒迦利亚
  rationale: 按希腊语地名作音译，并使其与现代汉语常见的人名构形“撒迦利亚”相衔接。
