  text: And they rose up against him in battle, and he fled and went away from there with great sorrow, to return to Babylon.
translation:
  language: zh_hans
  text: 他们起而与他交战；他便逃走，怀着极大的愁苦离开那里，返回巴比伦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: 他们起来与他交战
  rationale: 保留ἀνέστησαν“起来”的动作意象，同时将εἰς πόλεμον自然译为“交战”；αὐτῷ在此表示敌对对象，译作“与他”。
- source_word: ἔφυγεν
  choice: 他便逃走
  rationale: 直接表达逃离之意；“便”承接前句的交战行动，使叙事关系在现代汉语中自然清楚，但不额外说明因果。
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: 离开那里
  rationale: 准确保留从该地离去的空间指向，措辞简洁自然。
- source_word: μετὰ λύπης μεγάλης
  choice: 带着极大的愁苦
  rationale: λύπη可指忧愁、悲痛或苦闷；“愁苦”既呈现强烈的负面情绪，又不把含义限定为单纯哀伤。
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: 返回巴比伦
  rationale: 此处不定式与离去动作相连，可表达返回的目的或结果；中文不强加二者之别，以“返回巴比伦”自然保留其方向和回返含义。
