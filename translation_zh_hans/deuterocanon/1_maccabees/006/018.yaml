base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: zh_hans
  text: 他给他取名为欧帕托尔。来自堡垒的人在圣所周围[a]围困以色列，不断图谋加害，并成为列国[b]的后盾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在圣地（或圣物）周围”。希腊文用复数形式，在这里很可能指圣所及其周边区域。
    reason: 保留τῶν ἁγίων这一复数表达在所指范围上的歧义。
  - marker: b
    text: 或译“外族人的后盾”。
    reason: ἔθνεσιν既可译为“列国”，也可依犹太语境译为“外族人”。
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: 他给他取名叫
  rationale: 这是希腊语表示命名的惯用语；译文采用现代汉语自然说法，同时保留施名者与受名者的关系。
- source_word: Εὐπάτωρ
  choice: 欧帕托尔
  rationale: 按希腊语音译这一人名或称号，不在正文中解释其词义。
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: 堡垒里的人
  rationale: ἄκρα在本书语境中指耶路撒冷的设防堡垒；此译法表达他们与堡垒的关联，又不额外限定性别。
- source_word: συγκλείοντες
  choice: 围困
  rationale: 该分词有封锁、围住之意，与κύκλῳ相呼应；“围困”在此军事语境中自然明确。
- source_word: τὸν Ἰσραὴλ
  choice: 以色列
  rationale: 保留希腊文单数集合称谓，不改释为“以色列人”。
- source_word: κύκλῳ τῶν ἁγίων
  choice: 在圣所周围
  rationale: τὰ ἅγια为复数形式，可指圣物、圣地或圣所范围；结合上下文，正文以“圣所”简洁表达，脚注保留“圣地范围”的可能性。
- source_word: ζητοῦντες κακὰ
  choice: 图谋加害
  rationale: 该短语表达持续的敌意与谋害意图；此译法比逐字译作“寻求恶事”更符合现代汉语，同时不把伤害方式具体化。
- source_word: διʼ ὅλου
  choice: 不断
  rationale: 这一惯用语表示行动持续不止，以“不断”传达其延续性。
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: 成为列国的后盾
  rationale: στήριγμα指支撑、支持；“后盾”自然表达堡垒一方为外族势力提供支持的作用。
theological_decisions:
- issue: ἔθνεσιν的译法
  choice: 列国
  alternative: 外族人
  rationale: 此处主要是民族和政治语境。“列国”保留词语的广义，不预先把它限定为后期神学意义上的犹太人与外邦人对立；脚注列出语境上可行的另一译法。
- issue: τῶν ἁγίων所指范围
  choice: 圣所
  alternative: 圣地范围
  rationale: 上下文很可能指圣殿及其神圣区域，但希腊文使用中性复数，具体范围并不完全明说，因此正文采用通顺称谓，脚注保留范围较广的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“围困”“图谋加害”“后盾”符合军事冲突语境；对圣所范围及ἔθνη的含义不作过度限定。
