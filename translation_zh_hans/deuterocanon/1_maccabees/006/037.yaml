  source_fidelity: 译文正确识别上下文中的兽为战象，也保留了木塔、遮盖、作战器械、三十二名作战者和印度驭手等主要要素。不过，原文两次用“每一头兽”标示人员配置；将后一句改为“每一座塔上”虽在事实上可通，却把原文的明确指向转为推断的塔。应保留以每头象为单位的表达。
