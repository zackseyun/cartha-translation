  yaml_path: translation/deuterocanon/1_maccabees/006/037.yaml
  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
translation:
  language: zh_hans
  text: 每头象背上都安有坚固而有遮盖的木塔，塔上配备了作战器械；每头象上有三十二名战士在其上作战，另有它的印度驭手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“它的印度人”；这里很可能是指负责驾驭每头象的印度驭手。
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι
  choice: 木塔
  rationale: 直译为“木塔”，指安置在战象背上的塔状战斗设施；“塔楼”也可，但“木塔”简洁而庄重。
- source_word: ὀχυροὶ
  choice: 坚固的
  rationale: 表达结构牢固、具有防护性的含义，不额外限定为正式筑垒。
- source_word: σκεπαζόμενοι
  choice: 塔上有遮盖
  rationale: 保留被覆盖、设有顶盖的意思，同时避免臆定遮盖物的具体形制。
- source_word: θηρίου
  choice: 象
  rationale: 该词字面为“兽”，但上下文明示所指为战象；现代汉语在本句中译作“象”更清楚自然。
- source_word: ἐζωσμένοι ἐπʼ αὐτοῖς μηχαναῖς
  choice: 并配备了作战器械
  rationale: ἐζωσμένοι有装配、束装之意，μηχαναῖς指器械或机械装置；“作战器械”传达军事语境，又不武断指定器械种类。
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  choice: 三十二名战士
  rationale: 自然表达人数及其战斗职责；希腊文的分词在汉语中以名词“战士”凝练呈现。
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: 那头象的印度驭手
  rationale: 字面为“它的印度人”，上下文表明此人负责驾驭战象；“驭手”明确角色，又不采用较生僻的外来术语。
