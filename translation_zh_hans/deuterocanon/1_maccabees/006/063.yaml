  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: zh_hans
  text: 他急忙离开，返回安提阿，发现腓力正掌控着那城，就与他交战，并用武力攻占了那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 离开
  rationale: 此处表示从当时所在之地动身离去；“离开”自然简明，不额外限定出发方式。
- source_word: κατὰ σπουδήν
  choice: 急忙
  rationale: 该短语兼有迅速和紧迫之意；“急忙”在现代汉语中简洁地保留了叙事的紧迫感。
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: 返回安提阿
  rationale: ἀποστρέφω与方向介词εἰς连用，在这里表示回到先前的地点；“返回安提阿”准确而自然。
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: 发现腓力控制了那城
  rationale: κυριεύω表示掌管、支配或控制；“控制了那城”清楚表达实际统治权，又不加入君王身份等原文未明说的含义。
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: 与他交战
  rationale: πολεμέω指进行战争或战斗；“与他交战”符合军事语境，也自然表达双方对抗。
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: 用武力夺取了城
  rationale: καταλαμβάνω在此指夺取、攻占，βίᾳ说明以强力为手段；此译兼顾行动结果和方式。
