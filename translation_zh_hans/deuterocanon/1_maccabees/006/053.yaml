base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: zh_hans
  text: 圣所里没有食物，因为那是第七年[a]；那些从列国[b]逃进犹太地的人，已经把储备中剩下的食物吃光了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指第七年的安息年；这一年农业生产受到律法限制，因此造成食物短缺。
    reason: cultural_note
  - marker: b
    text: 或译“外邦”或“外邦地区”。希腊文直译为“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: 食物
  rationale: 泛指可食用之物；在围城缺粮的语境中，“食物”自然、清楚，也不作过度限定。
- source_word: ἐν τοῖς ἁγίοις
  choice: 圣所里
  rationale: 原文直译为“在诸圣处”，在本段语境中指圣殿的神圣区域；“圣所里”既简洁自然，也保留地点的神圣性质。
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: 因为那是第七年
  rationale: 紧贴希腊文措辞，不在正文中直接改写为解释性的“安息年”；其历史含义由脚注说明。
- source_word: οἱ ἀνασωζόμενοι
  choice: 那些……逃……的人
  rationale: 此处分词指安全逃脱并来到犹太地的人；“逃进”符合上下文，也比“得救的人”更少引入神学含义。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 逃进犹太地
  rationale: “进”保留 εἰς 所表达的进入某地区之动态方向。
- source_word: ἀπὸ τῶν ἐθνῶν
  choice: 从列国
  rationale: 保留犹太希腊语中“列国”的表达及其一定程度的开放性；脚注交代也可理解为外族人或外邦人所在之地。
- source_word: κατέφαγον
  choice: 吃光了
  rationale: 复合动词带有彻底耗尽之意；“吃光了”在现代汉语中生动自然。
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: 储备中剩下的食物
  rationale: ὑπόλιμμα 表示剩余之物，παράθεσις 在此缺粮语境中最可能指存放或储备的供应；此译法清楚表达储备已被耗尽，同时避免生硬的名词堆叠。
theological_decisions:
- issue: 是否在正文中明确“第七年”就是安息年
  choice: 保留“第七年”
  alternative: 译作“安息年”
  rationale: 希腊文只明说“第七年”。安息年的历史背景几乎可以确定，也解释了缺粮原因，但宜置于脚注，不应取代正文原有措辞。
- issue: 如何处理 ἐθνῶν 的犹太历史语境
  choice: 译作“列国”
  alternative: 译作“外邦人”或“外族人”
  rationale: “列国”较透明地保留原文惯用语，也不把此处究竟侧重各族、各地或外邦人的含义过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“圣所”符合圣殿语境；用分号清楚连接缺粮原因与储备耗尽的进一步说明。脚注标记分别紧随“第七年”和“列国”，与注释内容准确对应。
