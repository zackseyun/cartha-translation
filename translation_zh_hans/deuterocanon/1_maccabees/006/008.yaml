base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: zh_hans
  text: 王听见这些话，就惊愕，心神大受震动；他倒在床上，因忧伤病倒了，因为事情并没有照他所盘算的那样实现。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为事情的发展没有如他所愿。”
    reason: 原文可指事情没有照他的意图、设想或期望实现；正文的“所盘算的”较突出谋划意味，脚注保留较宽泛的理解。
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: 听见……就
  rationale: 这是带有闪语色彩的叙事衔接语。现代汉语用“听见……就”自然地表达时间推进和随即发生的反应，不机械保留“事情发生了，当……”。
- source_word: ἐθαμβήθη
  choice: 惊愕万分
  rationale: 该词表示突受震惊、惊诧；结合恶讯语境，“惊愕”既保留强烈冲击，也不额外限定为恐惧或绝望。“万分”与下文的强化语气协调。
- source_word: ἐσαλεύθη σφόδρα
  choice: 心神大受震动
  rationale: σαλεύω在此比喻内心受到猛烈撼动，σφόδρα加以强化。“心神大受震动”清楚而庄重，避免被误解为身体摇晃。
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: 倒在床榻上
  rationale: 保留ἔπεσεν的突发和衰弱感；“床榻”符合历史叙事的庄重语域，同时仍为现代读者所理解。
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: 病倒了
  rationale: 这一表达指陷入疾病状态。“病倒了”是自然现代汉语，也与前面的“倒在床榻上”形成清楚的事件进展。
- source_word: ἀπὸ τῆς λύπης
  choice: 因忧伤
  rationale: ἀπό在这里表达原因，λύπη指忧愁、悲痛。“因忧伤”简洁保留情绪与疾病之间的因果关系。
- source_word: οὐκ ἐγένετο αὐτῷ
  choice: 事情没有……成就
  rationale: 原文采用非人称表达，意为事情没有为他实现或没有按其所愿发生。“事情没有……成就”保留实现未遂的含义，同时符合汉语表达。
- source_word: καθὼς ἐνεθυμεῖτο
  choice: 照他所盘算的那样
  rationale: ἐνθυμέομαι可指心中思量、打算或谋划。“盘算”在此适合国王谋划落空的语境，又不把含义过度收窄为一项正式计划。
