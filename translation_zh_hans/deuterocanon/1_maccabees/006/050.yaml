  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: zh_hans
  text: 王夺取了贝特苏拉[a]，又在那里派驻一支驻军，以守卫这城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夺取”也可译作“占领”或“取得”。希腊文动词较广义地表示取得并控制这城。
    reason: lexical_alternative
  - marker: b
    text: “派驻一支驻军，以守卫这城”也可译作“在那里部署守军看守这城”。希腊文强调指派一支军事力量留守当地。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: 攻占了
  rationale: 该动词在军事语境中表示夺取并控制一处地方；“攻占”自然地表达成功夺取设防城镇，也保留其占有之意。
- source_word: ὁ βασιλεύς
  choice: 王
  rationale: 直接译出君王称号，不以具体人名替代原文。
- source_word: τὴν Βεθσούραν
  choice: 贝特苏拉
  rationale: 按希腊文 Βεθσούρα 音译地名，不与希伯来形式“伯夙”强行协调。
- source_word: ἐπέταξεν
  choice: 派驻
  rationale: 该词与“守军”及目的不定式连用，在此表示指派并部署军事力量；“派驻”符合现代汉语军事表达。
- source_word: φρουράν
  choice: 守军
  rationale: 军事背景及被攻占的城镇表明，这里指留驻当地以控制和防守城池的部队。
- source_word: τηρεῖν αὐτήν
  choice: 守住这城
  rationale: τηρεῖν 可表示看守、守护或保有；在驻军语境中，“守住”兼顾防守和继续控制之意。代词阴性单数所指为贝特苏拉，汉语明说“这城”较清楚。
