  text: And he gave himself to save his people and to win for himself an everlasting name.
translation:
  language: zh_hans
  text: 他献出自己，为要拯救他的人民，也为自己赢得永恒的名声。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτόν
  choice: 献上自己
  rationale: 直译为“把自己交出”，此处表达主动舍身；“献上自己”在现代汉语中自然、庄重，并保留自我牺牲的意味。
- source_word: τοῦ σῶσαι
  choice: 为要拯救
  rationale: 保留不定式所表达的目的，并以“拯救”对应救援、挽救人民的行动。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 他的人民
  rationale: λαός在此指其所属的民族共同体；“人民”比“百姓”更贴合现代标准普通话，同时不额外限定政治或宗教身份。
- source_word: περιποιῆσαι αὐτῷ
  choice: 为自己赢得
  rationale: περιποιέω在此有取得、赢得之意；反身代词指向主语，译作“为自己赢得”准确而自然。
- source_word: ὄνομα αἰώνιον
  choice: 永恒的名声
  rationale: ὄνομα在此语境指身后长存的声名，而非单指名字；αἰώνιον译作“永恒的”，保留强烈而庄重的时间表达。
theological_decisions:
- issue: “献上自己”是否暗示特定的赎罪教义
  choice: 按叙事语境理解为主动舍身以拯救人民
  alternative: 译为“牺牲自己”或赋予祭献、赎罪的专门含义
  rationale: 希腊文表达自我交付，但本句没有明确使用祭献或赎罪术语；译文保留舍身意味，不导入经文本身未明说的教义框架。
- issue: “永恒的名声”的价值判断
  choice: 保留原文所述的目的，不加赞许或批判
  alternative: 将其解释为荣耀、纪念或属灵奖赏
  rationale: 原文将拯救人民与为自己赢得长存声名并列，存在可感的动机张力；译文不替作者化解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式保留原文两个并列目的：“拯救他的人民”与“为自己赢得永恒的名声”，不弱化后者，也不将其灵性化。
