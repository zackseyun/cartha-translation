  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: zh_hans
  text: “看哪，我在异乡，正带着极大的忧愁走向死亡。[a]”他召来腓力——他的一位朋友[b]——并任命他管理整个王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我在异乡，正因极大的悲痛而死去。”ἀπόλλυμαι可指灭亡、衰亡或死亡；λύπη可译为忧愁、悲伤或痛苦。
    reason: lexical_alternative
  - marker: b
    text: “朋友”也可能是宫廷称号，指君王的亲信或朝廷侍从，并不一定仅指私人朋友。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、加强临终话语迫切感的作用；“看哪”庄重而仍为现代读者所理解。
- source_word: ἀπόλλυμαι
  choice: 我正……走向死亡
  rationale: 该词在此可指走向毁灭或死亡；结合国王临终语境，以“走向死亡”自然表达进行中的状态，同时不把它窄化成单纯的瞬间“死去”。
- source_word: λύπῃ μεγάλῃ
  choice: 因极大的忧愁
  rationale: λύπη可指忧愁、悲伤或痛苦；与ἀπόλλυμαι连用时，工具或原因意味较自然，因此译作“因极大的忧愁”，但以脚注保留其他理解。
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: 在异乡
  rationale: 简洁自然地传达身处不属于自己之地的疏离感，比“在外国土地上”更符合现代汉语叙事语体。
- source_word: ἐκάλεσεν
  choice: 召来
  rationale: 语境是君王把腓力叫到身边办理正式托付；“召来”比普通的“叫”更切合身份与场景，又未过度增添仪式细节。
- source_word: Φίλιππον
  choice: 腓力
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: 他的一位“朋友”
  rationale: 正文保留φίλος的字面意义，同时用引号和脚注提示它也可能是希腊化宫廷中的正式称号。
- source_word: κατέστησεν
  choice: 任命
  rationale: 这里表示正式置于权柄职位之上，“任命”准确而自然。
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: 管理自己的整个王国
  rationale: ἐπί在此表达受托掌管的权柄范围；“管理……整个王国”清楚传达行政权责，同时避免误译成继承王位。
