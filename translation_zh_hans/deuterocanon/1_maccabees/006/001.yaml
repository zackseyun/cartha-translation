  yaml_path: translation/deuterocanon/1_maccabees/006/001.yaml
  text: And King Antiochus was traveling through the upper regions[a], and he heard that in Elymais, in Persia, there was a city renowned for wealth, silver, and gold;
translation:
  language: zh_hans
  text: 安提阿古王正穿行于上方各地区[a]，听说在波斯的以利迈有一座城，以财富、金银闻名；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上方各地区”也可译作“内陆各地区”或“高地各处”；原文只说“上方”，具体所指并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: 正在经过
  rationale: 未完成时表达持续进行的行程；“正在经过”在现代汉语中自然地保留这一延续意味。
- source_word: τὰς ἐπάνω χώρας
  choice: 上方各地
  rationale: χώρας泛指地区，ἐπάνω直指“上方”；译文保留原文的空间表达，不进一步断定是内陆、高地或东方地区。
- source_word: Ἐλυμαΐς
  choice: 以利迈
  rationale: 按希腊语地名音译，并采用适合现代简体中文圣经文本的形式。
- source_word: ἐν τῇ Περσίδι
  choice: 在波斯
  rationale: 将Περσίς理解为波斯地域；“波斯”对普通中文读者清楚自然。
- source_word: πόλις ἔνδοξος
  choice: 有一座城……闻名
  rationale: ἔνδοξος在此表示著名、享有声名，而非道德或神学意义上的荣耀；调整语序以符合现代汉语。
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: 以财富、金银
  rationale: 与“闻名”搭配，表达该城因何著名；保留“财富”总称后再列“银、金”的累加强调，以“金银”作自然汉语并列。
