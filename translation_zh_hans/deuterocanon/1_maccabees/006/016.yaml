  text: to raise him up to reign. And Antiochus the king died there[a], in the one hundred forty-ninth year.
translation:
  language: zh_hans
  text: 把他抚养起来，以便他作王[a]。安提阿古王死在那里，时值第一百四十九年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“抚养他，为要他作王”。这里的不定式承接上文，说明抚养他的目的。
    reason: 说明原文的目的不定式及其与上文的句法关系，避免加入原文未明说的“成年”或具体继位方式。
lexical_decisions:
- source_word: ἐκθρέψαι
  choice: 抚养成人
  rationale: 该不定式承接上文，指把年幼的继承人养育成人；“抚养成人”符合现代汉语，也清楚表达养育过程。
- source_word: βασιλεύειν
  choice: 作王
  rationale: 该动词特指行使王权；“作王”简明保留其君王含义，避免用含义较宽的“统治”。
- source_word: ἀπέθανεν
  choice: 死
  rationale: 原文是直白的死亡用语，因此不采用“去世”等委婉表达。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接、自然地对应地点副词，并承接上文所指地点。
- source_word: ἔτους ἐνάτου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: 时值第一百四十九年
  rationale: 保留原文的纪年表达及确切数字；“时值”使汉语叙事自然，不额外指定原文未明说的纪年体系。
