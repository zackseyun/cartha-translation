  text: And they also made engines against their engines[a], and they fought for many days.
translation:
  language: zh_hans
  text: 他们也制造器械来对抗对方的器械，并交战了许多天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器械”也可译作“战争机器”或“攻城器械”。希腊语一词指战争中使用的机械装置；在这里的围城语境中，尤其可指围城作战所用的器械。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  choice: 攻城器械
  rationale: 在围城作战的语境中，该词指用于战争的机械装置；“攻城器械”比泛称“机器”更自然、明确，同时保留其类别上的宽泛性。
- source_word: πρὸς
  choice: 用来对付
  rationale: πρός加宾格在此表达敌对和针对关系；译为“用来对付”自然呈现一方制造器械以抗衡另一方器械的意思。
- source_word: ἐπολέμησαν
  choice: 双方交战
  rationale: 该动词表示进行战斗。希腊文主语可由上下文理解为交战各方；中文用“双方交战”避免将紧邻的“他们”误当作唯一行动方。
- source_word: ἡμέρας πολλάς
  choice: 许多天
  rationale: 宾格表示持续时间；中文“交战了许多天”可自然表达这一时段。
- source_word: καὶ αὐτοὶ
  choice: 他们也
  rationale: 保留附加意义，说明这一方也照样制造了相应器械；不额外强化为“他们自己也”。
