  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: zh_hans
  text: 他们经过以土买，在伯夙拉城外扎营。他们攻打了许多天，又造了攻城器械；可是，城里的人出城[a]，放火烧毁了这些器械，并英勇作战[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“出城”的动词是单数，主语也未明说；按上下文，很可能是把伯夙拉的守军作为一个整体来指称。
    reason: textual_variant
  - marker: b
    text: 也可译作“奋勇作战”；这个希腊副词的字面意思是“以男子汉的方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: 经过以土买
  rationale: διά加属格表示穿越一个地区；“以土买”是现代中文圣经语境中对Ἰδουμαία的通行地名形式。
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: 来到伯夙拉对面扎营
  rationale: παρεμβάλλω表示扎营；军事语境中的ἐπί加与格表明敌对驻扎，译作“对面扎营”既传达围攻态势，也符合现代汉语。
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: 攻打了许多天
  rationale: ἐπʼ ἡμέρας πολλάς表示持续时间；因对象是城池，“攻打”比泛指“作战”更贴合围城语境。
- source_word: μηχανὰς
  choice: 攻城器械
  rationale: μηχαναί在此军事语境中指围城所用的器械，不是一般的机器。
- source_word: ἔξηλθεν
  choice: 城里的人出城
  rationale: 原文动词为单数，且没有明说主语；上下文最自然地指伯夙拉城内的守方出城反击。正文采用自然汉语表达，脚注保留原文的语法异常和一定的不确定性。
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: 放火烧毁了这些器械
  rationale: 短语强调以火焚烧；代词αὐτούς最自然地回指前述攻城器械。中文用“放火烧毁”清楚而不显重复。
- source_word: ἀνδρωδῶς
  choice: 英勇
  rationale: 该副词字面含“以男子汉的方式”之意，在这里表达勇敢、刚强地作战；“英勇”自然、庄重，也避免现代汉语中不必要的性别化措辞。
