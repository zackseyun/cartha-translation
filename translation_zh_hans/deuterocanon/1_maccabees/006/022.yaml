lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: 到……那里
  rationale: 该词在此表示前往；与 πρὸς τὸν βασιλέα 合译为“到王那里”，符合现代汉语叙事表达，也保留了前去谒见的基本意思。
- source_word: πρὸς τὸν βασιλέα
  choice: 到王那里
  rationale: πρός 加宾格表示向某人移动；“到王那里”自然、清楚，不额外加入原文未明说的礼仪性含义。
- source_word: Ἕως πότε
  choice: 还要多久
  rationale: 这是对拖延提出质问的惯用语；“还要多久”比逐字的“直到何时”更符合现代汉语，同时保留催促和不满的语气。
- source_word: οὐ ποιήσεις
  choice: 不采取行动
  rationale: ποιέω 可泛指“做、行事”。由于现存所给希腊文本在此中断，没有宾语，“采取行动”能表达要求王有所作为的意思，又不擅自补明具体行动。
