  yaml_path: translation/deuterocanon/1_maccabees/006/048.yaml
  text: And from the king’s camp they went up to meet them at Jerusalem[a], and the king encamped in Judea and at Mount Zion.
translation:
  language: zh_hans
  text: 王军从王的军营上到耶路撒冷，去与他们交锋；王又在犹太地和锡安山安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολῆς
  choice: 军营
  rationale: 在军事叙事中指军队驻扎之处；“军营”自然、明确，也与后文“安营”的同源军事用语相呼应。
- source_word: ἀνέβησαν
  choice: 上到
  rationale: 保留动词“上去、登上”的地势含义；以耶路撒冷为目的地时，“上到耶路撒冷”符合圣经地理叙述习惯。
- source_word: εἰς συνάντησιν αὐτῶν
  choice: 迎战他们
  rationale: 该短语本义为前去迎面相遇；此处处于交战叙事中，“迎战”传达敌对相遇的语境，同时不额外说明战斗结果。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 在军事语境中意为扎营；“安营”简洁庄重，适合历史叙事。
- source_word: Ἰουδαίαν
  choice: 犹太地
  rationale: 指希腊化时期的地理区域Judea；“犹太地”是现代中文圣经语体中清楚而熟悉的地名表达。
- source_word: ὄρος Σιών
  choice: 锡安山
  rationale: 采用该地名在现代中文圣经中的通行译法，直接保留原文的“山”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。原句“从王的军营”在主语所指上并未明说具体是谁，因此译作“王的军营里有人”，保留这种不确定性，避免擅自补为某支特定部队。
