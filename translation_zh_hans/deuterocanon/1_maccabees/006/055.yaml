  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: zh_hans
  text: 吕西亚听说，腓力——安条克王还在世时曾任命他抚养他的儿子安条克，好让他日后为王[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让他日后登基为王。”希腊语 βασιλεῦσαι 可译为“为王、作王”，也可在这里更明确地理解为成为君王。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 这里的过去时动词引出吕西亚所得的消息；“听说”既贴近原词，也符合现代汉语叙事习惯。
- source_word: κατέστησεν
  choice: 曾任命
  rationale: 该词表示正式委派某人承担职责；“曾”表明任命发生在吕西亚听到消息之前。
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: 安条克王还在世时
  rationale: 这是属格独立结构，所指是安条克王在任命腓力时仍然活着；明确重复其名号可避免汉语代词歧义。
- source_word: ἐκθρέψαι
  choice: 抚养
  rationale: 该不定式表示把孩子养育成人，包含照料和教养，但不额外限定腓力的具体职衔。
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: 使这儿子日后作王
  rationale: 此结构表达任命腓力抚养王子的目的，即让王子将来掌权；“这儿子”明确指小安条克，并保留“作王”可指执政或成为君王的语义空间。
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: 安条克王
  rationale: 按现代汉语习惯把王号置于人名之后，清楚自然。
