  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: zh_hans
  text: 太阳照在金色的盾牌上时，群山被盾牌反射的光映得闪耀，明亮如火炬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: 发出闪光／闪耀
  rationale: 该动词在本节重复出现，表示明亮地闪光。中文按不同主语分别译为“发出闪光”和“闪耀”，自然地保留重复意象。
- source_word: χρυσᾶς ἀσπίδας
  choice: 金盾牌
  rationale: 直译为金质或金色的盾牌；“金盾牌”自然简洁，也不额外断定盾牌是纯金制成还是包金。
- source_word: τὰ ὄρη
  choice: 群山
  rationale: ὄρη通常指山岳；“群山”既准确，也符合场景的宏阔感。
- source_word: ἀπʼ αὐτῶν
  choice: 因盾牌的反光
  rationale: 原文直译为“从它们而来”，所指为盾牌反射的光。中文略作显化以避免“因它们”指代含混，同时不改变因反射而发亮的意思。
- source_word: κατήγαζεν
  choice: 灿烂
  rationale: 该动词表示发光、照耀；与后面的火炬比喻相连，译作“灿烂”能表现整片山野被强光照亮的视觉效果。
- source_word: ὡς λαμπάδες πυρός
  choice: 如火炬
  rationale: λαμπάδες πυρός直译为“火的火炬”，现代汉语用“如火炬”已清楚传达燃烧发光的比喻，并避免冗赘。
