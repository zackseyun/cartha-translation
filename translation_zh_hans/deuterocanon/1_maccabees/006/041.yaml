  yaml_path: translation/deuterocanon/1_maccabees/006/041.yaml
  text: And all who heard the sound of their multitude, and the marching of the multitude, and the clashing of the weapons, were shaken; for the camp was exceedingly great and strong.
translation:
  language: zh_hans
  text: 凡听见他们众多军兵的喧声、大军行进的声响和兵器碰撞声的人，无不震动；因为这军营极其庞大而强盛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: 震动
  rationale: 此未完成时被动形式表达听者持续受到震撼、心神不安；“震动”保留身体与情绪兼具的生动张力，不将其明确强化为“恐惧”。
- source_word: φωνῆς πλήθους αὐτῶν
  choice: 他们大队人马的喧声
  rationale: φωνή 在军队集结的语境中指众人发出的声音；“喧声”比“声音”更能传达大批人马的嘈杂声势，而“大队人马”自然体现 πλήθος 的庞大数量。
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: 行进的声响
  rationale: ὁδοιπορία 本义为行路、行程，此处指大队军兵的移动；译为“行进”符合军事场景，又不把原文进一步限定为特定队列的“行军”。补出“声响”以衔接“听见”并符合汉语表达。
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: 兵器碰撞声
  rationale: σύγκρουσις 表示相撞、碰击，ὅπλα 在此泛指军用装备或兵器；“兵器碰撞声”清楚保留原文的听觉意象。
- source_word: παρεμβολὴ
  choice: 营阵
  rationale: παρεμβολή 可指营地、军营，也可转指驻营的军队。“营阵”在此兼顾军营规模与军势，避免把“强盛”生硬地用于单纯的地点。
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: 极其庞大强盛
  rationale: σφόδρα 强化 μεγάλη；“极其庞大”表达数量和规模，“强盛”表达 ἰσχυρά 的实力，保留并列的双重描述。
