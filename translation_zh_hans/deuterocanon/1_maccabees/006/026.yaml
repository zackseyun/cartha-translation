  yaml_path: translation/deuterocanon/1_maccabees/006/026.yaml
  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: zh_hans
  text: 看哪，他们今天已在耶路撒冷的堡垒[a]前安营，要夺取堡垒和圣所；并加固了伯夙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译作“阿克拉堡”，即耶路撒冷的一座坚固堡垒。
    reason: 保留ἄκρα既可作普通名词、也可能作为特定历史据点名称的歧义。
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: 作为引起注意的话语标记，保留原文的突显作用；“看哪”庄重而为现代读者所理解。
- source_word: παρεμβεβλήκασιν
  choice: 已经……安营
  rationale: 该完成时动词在军事语境中表示扎营布阵；避免直接译作“围攻”，以免加入动词本身未明确表达的程度。
- source_word: σήμερον
  choice: 今天
  rationale: 自然、直接地表达时间副词。
- source_word: ἐπὶ τὴν ἄκραν
  choice: 在……堡垒对面
  rationale: ἐπί加宾格在此表达针对该据点的军事位置；ἄκρα可指堡垒，也可能特指耶路撒冷的阿克拉堡。
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: 要夺取堡垒
  rationale: 带τοῦ的不定式表达目的；καταλαμβάνω在此指军事夺取。将代词所指明确为“堡垒”，使中文不致误解。
- source_word: τὸ ἁγίασμα
  choice: 圣所
  rationale: 准确表达神圣的圣殿区域，同时保持简洁。
- source_word: τὴν Βεθσούραν
  choice: 伯夙
  rationale: 采用该地名常见的现代中文圣经音译。
- source_word: ὠχύρωσαν
  choice: 加固了
  rationale: 直接表达修筑、加强防御工事之意；与地点宾语搭配自然。
