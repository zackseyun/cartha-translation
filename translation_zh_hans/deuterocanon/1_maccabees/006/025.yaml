  yaml_path: translation/deuterocanon/1_maccabees/006/025.yaml
  text: They were being put to death[a], and our inheritances were being plundered. And they stretched out their hand not only against us, but also against all their territories.
translation:
  language: zh_hans
  text: 他们不断被处死，我们祖传的产业也不断遭到掠夺。他们不但向我们下手，还向他们所有的疆域[a]下手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们所有的边界”，也可理解为“他们周围所有的地区”。希腊语ὅρια既可指边界线，也可指边界所划定的地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθανατοῦντο
  choice: 不断被处死
  rationale: 未完成时被动语态表示过去持续或反复发生的行动；“不断被处死”保留了过程性、被动性和处死的严厉含义。
- source_word: κληρονομίαι
  choice: 祖传的产业
  rationale: κληρονομία可指继承所得的财产或世袭产业；此译法以现代汉语表达其家族承继和祖业色彩，而不笼统译为“财物”。
- source_word: διηρπάζοντο
  choice: 不断遭到掠夺
  rationale: 该动词表示暴力抢夺；“不断遭到掠夺”同时体现未完成时的持续或反复含义及被动语态。
- source_word: ἐξέτειναν χεῖρα
  choice: 伸手攻击
  rationale: 保留“伸手”这一原文意象，同时用“攻击”明确该习语在语境中的敌对含义。
- source_word: ὅρια
  choice: 疆域
  rationale: ὅρια既可指边界，也可指边界所划定的地区；“疆域”在本句中自然，并保留地域范围的含义。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 按希腊文保留第三人称复数所属关系，不擅自改定其指代对象。
