  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
translation:
  language: zh_hans
  text: 他钻到大象身下，从下方攻击它〔a〕，将它杀死；大象倒在地上，压在他身上，他就死在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: 钻到
  rationale: 该动词描写进入狭窄处的动作；“钻到大象身下”在现代汉语中自然、具体，也保留了行动的迅疾感。
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: 大象身下
  rationale: 直接表达空间关系，同时“身下”比单说“下面”更适合有生命的庞大动物。
- source_word: ὑπέθηκεν αὐτῷ
  choice: 从下面刺它
  rationale: 此短语在本语境中较为特殊，指从大象下方发动攻击。“刺”符合上下文所述的攻击方式，但不增添希腊文本在本节没有明说的具体武器。
- source_word: ἀνεῖλεν αὐτόν
  choice: 将它杀死
  rationale: 准确传达“杀死、除掉”的常用义，措辞清楚而不古奥。
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: 大象倒在地上，压在他身上
  rationale: 同时保留倒地和落在他上方这两层空间信息；“压在”自然传达庞大动物倒在其身上的致命结果。
- source_word: ἀπέθανεν ἐκεῖ
  choice: 他就死在那里
  rationale: 紧贴希腊文的简单结语，不额外加入“当场”等强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“钻到”“刺”“压在”等动词使动作连贯鲜明，同时避免古语化表达。希腊语ὑπέθηκεν αὐτῷ虽有一定习语性，但结合叙事上下文译为“从下面刺它”最为自然；本节不另设脚注。
