base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/035.yaml
  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: zh_hans
  text: 他们把那些兽[a]分配到各军阵中[b]，在每头象旁[c]安置一千名身披锁子甲的士兵，士兵头上戴着铜盔；又给每头兽配备五百名精选的骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那些兽”；这里所指的是象。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“各编队”或“各队伍”。希腊语 εἰς τὰς φάραγγας 在这里含义较难确定，但很可能是军事用语。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“为每头象”或“在每头象那里”。这里的希腊语介词有多种可能的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: 分配
  rationale: 此处描述军队部署；“分配”既保留“划分、分派”的含义，也能自然表达把象编入不同军阵。
- source_word: τὰ θηρία
  choice: 那些兽
  rationale: 按原文保留“兽”的称呼，不直接改作“象”；上下文及随后出现的“每头象”已明确所指。
- source_word: εἰς τὰς φάραγγας
  choice: 到各军阵中
  rationale: 该短语在此语境中较难确定；φάραγγες 很可能指军事编队。“各军阵”保留军事意义，同时避免武断地限定为某一种具体编制。
- source_word: παρέστησαν
  choice: 安置
  rationale: 在军事部署语境中表示把人员配置、驻列在某处；“安置”自然且不暗示这些人都骑在象上。
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: 在每头象旁
  rationale: ἐπί 加与格可表示“在、旁、为”；结合一千名士兵与象协同部署的场景，“在……旁”最为通顺，但以脚注保留其他可能。
- source_word: χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: 一千名身披锁子甲的士兵
  rationale: τεθωρακισμένους 表示披甲，ἐν ἁλυσιδωτοῖς 进一步说明是链甲；“身披锁子甲”准确而易懂。
- source_word: περικεφαλαῖαι χαλκαῖ
  choice: 铜盔
  rationale: 直接表达铜制头盔；“铜盔”简洁、现代，也符合军事语境。
- source_word: πεντακόσιοι ἵπποι
  choice: 五百名……骑兵
  rationale: ἵπποι 字面为“马”，但在军队编制语境中可借指骑兵；译作“骑兵”能准确传达所指。
- source_word: διατεταγμένοι
  choice: 配备
  rationale: 该分词表示按命令排列或配置；这里指为每头兽指定骑兵，“配备”最符合上下文。
- source_word: ἐκλελεγμένοι
  choice: 精选的
  rationale: 完美时分词强调这些骑兵已经过挑选；“精选的”保留其选拔意味。
