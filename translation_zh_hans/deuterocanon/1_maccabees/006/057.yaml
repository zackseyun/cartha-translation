base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: zh_hans
  text: 他们不断催促，坚持要离去。于是，他对王、军队的将领和众人说：“我们一天比一天衰竭[a]，粮食也不多；我们安营的地方十分坚固[b]，国事又催逼着我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰竭”也可理解为“日渐减少”或“渐渐耗尽”；希腊语没有明确限定所减少或耗尽的是人数、力量还是资源。
    reason: lexical_ambiguity
  - marker: b
    text: “坚固”也可译作“设防严密”或“地势险固”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: 不断催促，坚持
  rationale: 两个并列的未完成时动词共同表达持续、反复施压的语气；采用近义递进的中文表达，既保留强调，也避免生硬重复。
- source_word: τοῦ ἀπελθεῖν
  choice: 要离去
  rationale: 表达离开当前军事行动或营地的意思；“离去”庄重自然，又不擅自明确为撤军。
- source_word: Ἐκλείπομεν
  choice: 我们一天比一天衰竭
  rationale: ἐκλείπω可指衰弱、减少或耗尽；“衰竭”保留对象未被明确限定的宽度，脚注说明其他可能理解。
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: 粮食也不多
  rationale: 在军事语境中，τροφή指维持军队所需的食物；“粮食不多”是自然、清楚的现代汉语。
- source_word: ὁ τόπος, οὗ παρεμβάλλομεν, ἐστὶν ὀχυρός
  choice: 我们安营的地方十分坚固
  rationale: 尽量保留原文对地点强固性的概括，不额外断定具体是工事坚固还是地势险要。
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: 国事又催逼着我们
  rationale: 该表达指王国事务形成现实而紧迫的压力；“催逼着我们”保留ἐπίκειται的压迫感。
- source_word: τοὺς ἄνδρας
  choice: 众人
  rationale: 原文仅作“那些人”，语境中可能主要指军中人员；译作“众人”避免把范围过度限定为普通士兵。
