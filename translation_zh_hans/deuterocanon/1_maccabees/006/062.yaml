base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/062.yaml
  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: zh_hans
  text: 王进入锡安山，看见那地方的防御工事[a]，就背弃了自己所起的誓[b]，下令把四周的城墙拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堡垒”或“要塞”。
    reason: 原词 ὀχύρωμα 可指防御工事、坚固据点或堡垒，具体形制并未限定。
  - marker: b
    text: 或译“废弃了”或“违背了”；原文动词表示使一项有约束力的承诺失效，或置之不顾。
    reason: 保留 ἠθέτησεν 在誓言语境中的词义范围与伦理张力。
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: 准确表达不定过去时叙事中进入某处的动作，简洁自然。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 符合历史叙事语体，也忠实对应带冠词的 βασιλεύς；上下文已能确定其身份，无须增补姓名。
- source_word: τὸ ὄρος Σιών
  choice: 锡安山
  rationale: 这是现代中文中对该地名的通行表达，保留 ὄρος 的地理含义。
- source_word: τὸ ὀχύρωμα τοῦ τόπου
  choice: 那地方的防御工事
  rationale: ὀχύρωμα 指加固、防守用的设施或据点；“防御工事”贴合军事语境，同时避免把具体形制限定为单一堡垒。
- source_word: ἠθέτησεν
  choice: 背弃
  rationale: 该动词在誓言语境中表示不再承认或不履行有约束力的承诺；“背弃”既保留违誓的道德力度，也不额外解释其动机。
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: 自己所起的誓
  rationale: 保留“誓言”名词及“他曾起誓”的关系从句含义，并用自然现代汉语表达。
- source_word: ἐνετείλατο καὶ καθεῖλεν
  choice: 下令……拆毁
  rationale: 在军事叙事中自然表达王发出命令并使拆毁行动得以执行；中文使役式避免误解为王亲手拆墙。
- source_word: τὸ τεῖχος κυκλόθεν
  choice: 四周的城墙
  rationale: τεῖχος 为城墙，κυκλόθεν 表示周围、环绕；此译清楚保留其空间范围。
theological_decisions:
- issue: ἠθέτησεν 用于誓言时的道德力度
  choice: 背弃了自己所起的誓
  alternative: 废弃了自己所起的誓；违背了自己所起的誓
  rationale: 原文叙述王否认或不履行具有约束力的誓言。“背弃”保留违誓的伦理分量，但不添加神学判断或说明其动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“王”符合历史叙事的简洁语体；“下令把……拆毁”清楚表达命令所导致的行动。脚注标记分别紧跟其所解释的“防御工事”和“背弃了自己所起的誓”，避免来源材料中标记位置与脚注内容错位。
