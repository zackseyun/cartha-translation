  yaml_path: translation/deuterocanon/1_maccabees/006/007.yaml
  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
translation:
  language: zh_hans
  text: 他们拆毁了他在耶路撒冷祭坛上建造的那可憎之物[a]；又像从前一样，用高墙围住圣所和伯夙拉——他的城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那令人厌恶的东西”。希腊文用的是“可憎之物”，在这里带有敬拜和礼仪上的强烈贬义。
    reason: lexical_alternative
  - marker: b
    text: 希腊文“伯夙拉，他的城”表达较为紧缩。“他的”在叙事语境中很可能指犹大，也可较宽泛地理解为归他掌控的城。
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: 拆毁了
  rationale: καθαιρέω在这里表示把建筑物或宗教设施强行拆除；“拆毁”既保留具体的物理动作，也符合现代汉语叙事习惯。
- source_word: τὸ βδέλυγμα
  choice: 那可憎之物
  rationale: βδέλυγμα指令人厌恶、尤其在敬拜上被视为污秽冒犯之物。“可憎之物”保留其礼仪和宗教色彩，又不擅自补入原文没有的“使地荒凉”等成分。
- source_word: ᾠκοδόμησεν
  choice: 建造的
  rationale: οἰκοδομέω的基本义是“建造”。此处采用“建造”，不以较具解释性的“设立”取代原词的建筑意象。
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷的祭坛上
  rationale: ἐπί加宾格在本句表示位于祭坛之上；后置定语τὸ ἐν Ἰερουσαλήμ修饰祭坛。中文调整语序，以自然方式保留这一关系。
- source_word: τὸ ἁγίασμα
  choice: 圣所
  rationale: ἁγίασμα在圣殿语境中指神圣之处或圣区；“圣所”简洁、庄重，也为普通读者熟悉。
- source_word: καθὼς τὸ πρότερον
  choice: 像从前一样
  rationale: 该短语表示恢复先前的状态；“像从前一样”自然地保留这一比较含义。
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: 用高墙围住
  rationale: κυκλόω表示环绕、围住，τείχεσιν ὑψηλοῖς为工具与方式。“用高墙围住”紧贴原文，避免用“加固”提前解释其军事功能。
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: 他的城伯夙拉
  rationale: 原文表达紧缩，直译为“伯夙拉，他的城”。中文保留代词“他的”，而不在正文中武断确定其所指；“伯夙拉”采用简明的希腊地名音译。
theological_decisions:
- issue: βδέλυγμα在敬拜争议语境中的译法
  choice: 那可憎之物
  alternative: 那令人厌恶的东西；那可憎之像
  rationale: “可憎之物”保留该词在犹太经文传统中的强烈礼仪色彩，同时不把它具体化为原文未明说的“像”，也不扩展成其他传统固定短语。
- issue: αὐτοῦ（“他的”）所指对象
  choice: 在正文中保留“他的”
  alternative: 译作“犹大的城”；译作“他们控制的城”
  rationale: 上下文可能使读者想到犹大，但本句本身只使用代词。保留代词可维护原文的指代张力，并以脚注说明可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拆毁”“圣所”“高墙”等词清楚具体；保留“可憎之物”的经文语体和“他的”的指代含混，不以解释性改写消除原文张力。
