base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: zh_hans
  text: 他前来，试图夺取那城并洗劫它，却未能成功，因为城里的人得知了这项计划。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “计划”或可译作“事情”或“消息”。希腊文 λόγος 含义较广，可指话语、消息、事情或计划；这里的上下文较支持指他打算采取的行动被城里的人得知。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  choice: 夺取
  rationale: 在军事语境中指取得对城的控制；“夺取”自然明确，也保留行动的强制性。
- source_word: προνομεῦσαι
  choice: 洗劫
  rationale: 该动词指掠夺财物；“洗劫”适合以城市为对象的语境，准确传达劫掠之意。
- source_word: οὐκ ἠδυνάσθη
  choice: 却未能得逞
  rationale: 表达他未能实现前述企图；比逐字译作“不能”更符合现代汉语叙事，同时不补入失败的具体原因。
- source_word: ἐγνώσθη
  choice: 知道了
  rationale: 希腊文为被动，表示此事为城中人所知；汉语用主动结构更自然，且未说明消息如何泄露。
- source_word: ὁ λόγος
  choice: 这项图谋
  rationale: λόγος 可指话、消息、事情或谋划；此处上下文最可能指他夺城洗劫的意图，但词义本身较宽，故以脚注保留其他可能。
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 字面为“来自城中的人”；在此显然指城内居民或守城者。“城里的人”既自然，也不擅自限定为某一群体。
