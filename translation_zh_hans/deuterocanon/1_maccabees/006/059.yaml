base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: zh_hans
  text: 让我们准许他们照自己的律法生活[a]，像从前一样；因为我们废止了他们的律法[b]，他们才发怒，做出了这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照自己的律法生活”也可译作“遵行自己的规例（或习俗）”；希腊文直译为“按他们的律法行走”。
    reason: lexical_alternative
  - marker: b
    text: “废止”所译的动词本义是“驱散、使分散”，在这里也可理解为“扰乱”或“破坏”他们的律法实践。
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: 让我们准许
  rationale: 此处是劝议式虚拟语气，提出恢复一项政策。结合后接不定式，译为“准许”比生硬的“设立给他们”更符合现代汉语，也表达使其得以如此行的语境意义。
- source_word: τοῦ πορεύεσθαι
  choice: 生活
  rationale: πορεύεσθαι本义为“行走、行事”，与律法连用时指按其规范安排生活；“照……生活”自然地保留这一伦理实践含义。
- source_word: τοῖς νομίμοις αὐτῶν
  choice: 照自己的律法
  rationale: νομίμοις可指律法、法规或既定习俗；本段涉及犹太人的宗教法律实践，主文采用“律法”，并在脚注保留“规例、习俗”的可能。
- source_word: ὡς τὸ πρότερον
  choice: 像从前一样
  rationale: 直接表达恢复先前状态的时间比较。
- source_word: χάριν
  choice: 因为
  rationale: 此处表示原因；结合关系从句重组为现代汉语的因果句。
- source_word: διεσκεδάσαμεν
  choice: 废止了
  rationale: 该动词本义涉及“驱散、使分散”，在此语境中指破坏、取消其律法制度；“废止”准确表达实际政策效果，脚注说明其字面色彩及“扰乱、破坏”的可能。
- source_word: ὠργίσθησαν
  choice: 发怒
  rationale: 准确表达其不及物或被动形态所呈现的进入愤怒状态，不额外强化程度。
- source_word: ἐποίησαν ταῦτα πάντα
  choice: 做出了这一切
  rationale: 自然概括前文所述全部行动，同时保留πάντα的总括意味。
