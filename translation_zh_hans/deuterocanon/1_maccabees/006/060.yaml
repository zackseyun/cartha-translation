base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/060.yaml
  text: And the proposal pleased the king and the rulers[a], and he sent to them to make peace[c][b], and they accepted.
translation:
  language: zh_hans
  text: 这提议得到了王和众首领的赞同[a]。王便派遣前去与他们议和[b]，他们也接受了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提议”也可译作“话”或“所谈的事”。希腊文 λόγος 在这里可指所说的提议，也可指正在商议的事情。
    reason: lexical_alternative
  - marker: b
    text: 直译为“王便派到他们那里去议和”。希腊文没有明说王派去的是使者还是信息。
    reason: lexical_alternative
  - marker: c
    text: 即他们接受了议和的提议或条件；原文没有明说宾语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν
  choice: 得到了……的赞同
  rationale: 这里表示所谈之事为王和众首领所认可；这一表达自然传达认可之意。
- source_word: ὁ λόγος
  choice: 这提议
  rationale: λόγος 可指话语或事情；结合外交语境，指前文所提出的方案，以“这提议”最清楚。
- source_word: ἐναντίον
  choice: 得到了王和众首领的赞同
  rationale: ἐναντίον 字面为“在……面前”，但与 ἤρεσεν 连用时，整句自然表达为王和众首领赞同此提议。
- source_word: ἀρχόντων
  choice: 众首领
  rationale: ἄρχοντες 指掌权者；“众首领”保留其权威身份，又不把具体官职说得过细。
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: 王便派人去
  rationale: 希腊文只说“他派遣到他们那里”，未明说所派的是人还是信息。中文若直译“派去”不完整，正文按外交行动自然译作“派人去”，并以脚注说明原文的省略。
- source_word: εἰρηνεῦσαι
  choice: 与他们议和
  rationale: 该不定式说明派遣的目的，即达成和平；“议和”符合外交语境，同时不额外限定正式条约形式。
- source_word: ἐπεδέξαντο
  choice: 他们也接受了
  rationale: 动词意为接受、接纳，其宾语在原文中省略；中文保留简洁表述，由语境和脚注说明所接受的是议和提议或条件。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“得到了……的赞同”自然表达王与众首领的认可；“议和”简洁体现外交场景。正文在汉语可读性与原文省略之间取最优对等，并用脚注保留 λόγος、派遣对象及“接受”宾语的歧义。
