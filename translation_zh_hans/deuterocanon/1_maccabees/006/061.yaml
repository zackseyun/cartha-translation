  yaml_path: translation/deuterocanon/1_maccabees/006/061.yaml
  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
translation:
  language: zh_hans
  text: 王和众官长就这些条件向他们起了誓[a]；随后，他从堡垒里出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就这些事向他们起了誓。”这里所起的誓是针对上文所说的条件。
    reason: lexical_alternative
  - marker: b
    text: 希腊文动词是单数（“他出来”），但上下文也可能使人理解为“他们出来”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: 起了誓
  rationale: 直接表达正式起誓的法律和盟约性质，比“答应”更准确；过去时体在汉语叙事中由语境体现。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 符合历史叙事中的现代汉语常用表达，简洁而庄重。
- source_word: οἱ ἄρχοντες
  choice: 众官长
  rationale: 这里指掌权或居领导地位的官员；“众官长”保留其政治和治理意味。
- source_word: ἐπὶ τούτοις
  choice: 就这些条件
  rationale: 该短语回指上文所述的议和条件；这样译既自然，也明确保留指代关系。
- source_word: ἐξῆλθεν
  choice: 他……出来
  rationale: 严格保留希腊文本的第三人称单数形式；主语并未明说，因此不在正文中擅自确定其身份。
- source_word: τοῦ ὀχυρώματος
  choice: 堡垒
  rationale: 准确传达设防据点的军事含义，且是现代汉语中自然、易懂的说法。
theological_decisions:
- issue: ἐξῆλθεν的隐含主语及单复数张力
  choice: 正文译作单数“他……出来”
  alternative: 他们从堡垒里出来
  rationale: 现存所据希腊文本的动词为单数，应在正文保留；但上下文可能使读者理解为一群人出来，故以脚注保存这一可能性，而不替文本消除张力。
translation_notes:
  register: 采用现代、庄重而通俗的历史叙事语体。“就这些条件向他们起了誓”兼顾希腊文结构与汉语自然度；分号保留两个连续动作间的紧密关系。
