  text: in the one hundred and fiftieth year[a]; and he made against them missile-launchers and siege engines.
translation:
  language: zh_hans
  text: 第一百五十年，他制造了投射器[a]和攻城器械来攻击他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发射投射物的器械”。希腊语βελοστασίεις指发射箭矢等投射物的装置，不一定专指某一种攻城武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: 第一百五十年
  rationale: 这是纪年用的属格结构，按现代汉语自然表达为“第一百五十年”；希腊语词序直译近于“第五十又第一百年”，合为一百五十年。
- source_word: ἐποίησεν
  choice: 制造了
  rationale: ποιέω本义宽泛，可指“做、制造”；在军事器械语境中，“制造了”既贴近原文，又比泛泛的“做了”自然明确。
- source_word: ἐπʼ αὐτούς
  choice: 用来攻击他们
  rationale: ἐπί加宾格在此表示敌对方向。译作“用来攻击他们”清楚呈现这些器械的用途，并避免生硬的“对着他们”。
- source_word: βελοστασίεις
  choice: 投射器
  rationale: 该词指发射箭矢或其他投射物的装置，具体器型未必确定；“投射器”简洁且不武断限定为某一种弩炮或抛石机。
- source_word: μηχανάς
  choice: 攻城器械
  rationale: μηχανή可泛指机械装置，但在围城军事语境中指用于攻城的器械；此译比“机器”更符合上下文。
