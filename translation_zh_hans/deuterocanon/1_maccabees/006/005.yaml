  text: And someone came reporting to him in Persia that the camps that had gone into the land of Judah had been routed;
translation:
  language: zh_hans
  text: 有人来到波斯，向他报告说，前往犹大地的军队已经被击溃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγγέλλων
  choice: 报告
  rationale: 表达来人向王传达战况的正式语气，同时使现代汉语自然简明。
- source_word: εἰς τὴν Περσίδα
  choice: 来到波斯
  rationale: 按希腊语结构与上文情境，地点短语说明来人抵达王所在的波斯；译文避免生硬的“在波斯向他报告”。
- source_word: αἱ παρεμβολαί
  choice: 军队
  rationale: παρεμβολή可指营地、军营或驻营部队；此处能“前往”并“溃败”的是部队，现代汉语以“军队”最自然，也保留其军事集合意义。
- source_word: τετρόπωνται
  choice: 已经溃败
  rationale: 该完成时被动态表示遭到击溃且败局已成；“已经溃败”准确呈现完成体结果。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 直译地理名称，保留其作为地区而非人物的含义。
