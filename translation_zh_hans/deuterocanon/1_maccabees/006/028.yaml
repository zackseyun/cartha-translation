  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: zh_hans
  text: 王听见这事，就勃然大怒；他召集了所有的“王友”、军队的统帅和负责缰绳的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责缰绳的人”原文直译为“在缰绳之上的人”。这可能指驾驭者，也可能指负责相关事务或部队的官员；具体职掌不能确定。
    reason: 保留原文“缰绳”的转喻表达，避免正文擅自限定为战车职务，同时说明可能的理解。
lexical_decisions:
- source_word: οἱ φίλοι αὐτοῦ
  choice: 他的“王友”
  rationale: 此处 φίλοι 很可能是希腊化宫廷中受封的官衔或特定臣僚群体，不只是一般朋友；译作“王友”并加引号，既体现制度含义，也保留原词“朋友”的形象。
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: 军队的统帅
  rationale: ἄρχοντες 指领袖、长官，δύναμις 在此指军事力量；此译自然地表达军队指挥官。
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: 掌管战车的人
  rationale: 字面为“在缰绳之上的人”。结合军事语境，通常指负责御车或统领战车部队者；正文采用可读的概括表达，并以脚注保留字面信息与歧义。
- source_word: ὠργίσθη
  choice: 勃然大怒
  rationale: 表达强烈、突然显出的愤怒，符合叙事语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“王友”作为宫廷称号用引号标示，避免读者误解为国王的一般私人朋友；分号呈现听闻、震怒与召集臣将之间的推进关系。
