base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: zh_hans
  text: 他死于第一百四十六年[a]。他的儿子们把他安葬在摩得因他祖先的坟墓中；全以色列都为他举行了盛大的哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 很可能是指塞琉古纪元的第一百四十六年。
    reason: 历史文化说明；原文只写纪年数字，未注明纪元。
lexical_decisions:
- source_word: ἀπέθανεν
  choice: 死
  rationale: 希腊语简单直接地陈述死亡；用“死”准确自然，不加委婉色彩。
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: 于第一百四十六年
  rationale: 保留原文纪年公式及序数含义，不在正文中补出原文未明说的纪元。
- source_word: ἔθαψαν
  choice: 安葬
  rationale: 准确表达埋葬行为，在现代中文叙事中自然且庄重。
- source_word: τάφοις πατέρων αὐτοῦ
  choice: 他祖先的坟墓
  rationale: πατέρων在家族安葬语境中泛指先祖；“祖先”比字面的“父亲们”更符合现代汉语，同时保留家族墓葬的含义。
- source_word: Μωδεείν
  choice: 摩得因
  rationale: 按希腊语地名音译，并采用中文圣经传统中可辨识的形式。
- source_word: ἐκόψαντο
  choice: 哀悼
  rationale: 该词可涉及哀丧礼仪或动作；“哀悼”传达语境核心而不擅自限定具体动作。
- source_word: κοπετὸν μέγαν
  choice: 大大哀悼
  rationale: 以汉语程度副词重现同源宾格的加强作用，表达极深、盛大的哀悼。
- source_word: πᾶς Ἰσραήλ
  choice: 全以色列
  rationale: 保留原文将以色列作为整体群体的传统表达。
theological_decisions:
- issue: 纪年公式所指的纪元
  choice: 正文只译作“第一百四十六年”
  alternative: “塞琉古纪元第一百四十六年”
  rationale: 希腊原文没有明说纪元；虽然历史上很可能指塞琉古纪元，但将其放入正文会把解释写成原文内容，因此仅在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“安葬”与“哀悼”符合丧葬语境；保留“全以色列”的集体表达。
