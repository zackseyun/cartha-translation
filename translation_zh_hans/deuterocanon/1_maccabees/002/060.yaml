lexical_decisions:
- source_word: Δανιὴλ
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐν τῇ ἁπλότητι αὐτοῦ
  choice: 因他的纯正
  rationale: 介词短语在这组劝勉性的例证中表达但以理获救所关联的品格根据；“纯正”可涵盖真诚、专一与正直，且避免把此词误解为天真或头脑简单。
- source_word: ἐρύσθη
  choice: 被救了出来
  rationale: 准确表达不定过去时被动语态及从具体危险中获救的意思，现代中文自然清楚。
- source_word: ἐκ στόματος λεόντων
  choice: 从狮子的口中
  rationale: 保留希腊文单数“口”与复数“狮子”的鲜明表达，也与中文惯用的“从……口中”相合。
theological_decisions:
- issue: 如何翻译对但以理具有褒义的 ἁπλότης
  choice: 纯正
  alternative: 单纯；专一；正直
  rationale: 原词既可指单纯、不搀杂，也可引申为真诚、专一或品格完整。“纯正”保留其褒义和一定的语义开放性，不把经文收窄为某一种特定德目；脚注列明其他可能理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留“从狮子的口中”这一原文意象；以脚注呈现 ἁπλότης 的真实词义幅度，避免将其解释为幼稚或简单无知。
