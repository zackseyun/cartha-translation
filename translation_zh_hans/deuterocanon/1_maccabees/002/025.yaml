  yaml_path: translation/deuterocanon/1_maccabees/002/025.yaml
  text: And he killed the king’s man who was compelling them to sacrifice at that time[a], and he tore down the altar,
translation:
  language: zh_hans
  text: 当时，他杀了那个强迫人献祭的王的官员[a]，又拆毁了祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“王的人”，可能指王的官员或使者。
    reason: 说明原文的直译形式，并保留该人物具体身份的不确定性。
lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: 王室官员
  rationale: 字面为“王的人”，指隶属或代表国王的人。现代汉语用“王室官员”自然地表达其官方身份；脚注保留原文较直白的说法及“使者”的可能性。
- source_word: τὸν ἀναγκάζοντα θύειν
  choice: 强迫人献祭
  rationale: ἀναγκάζω 表示强迫、迫使；θύειν 在此为宗教礼仪语境中的“献祭”。希腊文未明说被强迫者是谁，因此用泛指的“人”，避免把对象限定为单数或特定群体。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 直接表达 ἀποκτείνω 的含义，现代、清楚，不采用古雅的“杀死/诛杀”式措辞。
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: 当时
  rationale: 简洁自然地表达该时间短语，同时保留叙事中的时间强调。
- source_word: τὸν βωμὸν
  choice: 祭坛
  rationale: βωμός 在献祭语境中通常指祭坛。
- source_word: καθεῖλεν
  choice: 拆毁
  rationale: καθαιρέω 在此指拆下、拆除或摧毁；“拆毁”体现针对祭坛的强力拆除，又不额外断言毁坏程度。
theological_decisions:
- issue: “强迫献祭”的隐含对象
  choice: 强迫人献祭
  alternative: 强迫他们献祭；强迫他献祭
  rationale: 希腊文 θύειν 没有明示施行献祭者。上下文表明这是对当地人的宗教强制，但本节本身不限定单数或复数；用泛指“人”既符合汉语习惯，也保留原文的不明确性。
- issue: “王的人”的身份表达
  choice: 王室官员
  alternative: 王的人；王的使者
  rationale: 属格结构表明此人隶属于或代表国王，却未提供具体官衔。“王室官员”传达其官方角色，但以脚注说明字面形式及其他可能理解，避免过度确定其职位。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王室官员”比直译“王的人”更符合现代汉语，但以脚注保留字面信息；“强迫人献祭”刻意不明确指定被强迫者，以对应希腊文的省略。
