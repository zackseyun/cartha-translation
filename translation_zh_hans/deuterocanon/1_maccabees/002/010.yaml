  text: What nation has not inherited a kingdom and taken hold of its spoils?[a]
translation:
  language: zh_hans
  text: 哪个民族没有继承过一个王国，也没有夺取它的战利品呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”也可译作“掠物”或“掳物”。希腊语 σκῦλα 指战争或征服中夺得的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: 哪一个民族
  rationale: 保留反问形式；“民族”在这里表达政治共同体，比单纯的“人民”更贴近 ἔθνος。
- source_word: ἐκληρονόμησεν
  choice: 承受
  rationale: 保留 κληρονομέω 所含的继承、承受产业之意，同时符合王国易手的语境。
- source_word: βασιλείαν
  choice: 一个王国
  rationale: 此处与“承受”及取得战利品并列，具体的政治实体“王国”比抽象的“王权”更自然。
- source_word: ἐκράτησεν
  choice: 夺取
  rationale: κρατέω 与属格连用可表示取得、占有；在战利品语境中，“夺取”自然体现其强力取得的意味。
- source_word: τῶν σκύλων αὐτῆς
  choice: 它的战利品
  rationale: σκῦλα 指战争或征服所得的战利品；以代词“它的”保留 αὐτῆς 的指代张力，不在正文中强行确定其先行对象。
