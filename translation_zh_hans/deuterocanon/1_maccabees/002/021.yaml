  text: 我们绝不可离弃律法和条例。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较字面的表达译作：“愿我们蒙怜悯，不至于离弃律法和条例。”希腊语在这里使用一个表示强烈拒绝的惯用语，意为“这事绝不可发生在我们身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: 我们绝不可
  rationale: 该结构在这里是表达强烈拒绝的惯用语。译为“我们绝不可”符合现代汉语习惯，也保留了说话者坚决排斥这一行为的语气。
- source_word: καταλεῖπειν
  choice: 离弃
  rationale: 表示撇下、背弃；“离弃”能体现对盟约义务的主动背离，比中性的“留下”更贴合语境。
- source_word: νόμον
  choice: 律法
  rationale: 语境指以色列所领受、具有明确所指的律法；“律法”是自然且具经文语域的现代汉语表达。
- source_word: δικαιώματα
  choice: 条例
  rationale: 在圣经希腊语中常指规定、法令或应当遵守的要求；“条例”清楚自然，并避免将其范围限定为某一种法律类别。
theological_decisions:
- issue: νόμον καὶ δικαιώματα 的盟约含义
  choice: 律法和条例
  alternative: 律法和律例；律法和规定
  rationale: 保留其对以色列盟约法律传统的指涉和庄重分量，同时不引入后来的教义分类。
- issue: ἵλεως ἡμῖν 的语气与潜在字面含义
  choice: 正文按强烈拒绝的惯用义译作“我们绝不可”
  alternative: 愿上帝怜悯我们，使我们不至于离弃
  rationale: 上下文和不定式结构支持强烈否决的惯用读法；脚注保留该词与“恩慈、怜悯”有关的较字面理解，以免抹去希腊文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不可”传达坚决拒绝；“离弃”保留背弃盟约责任的严肃意味。脚注标记已在正文中出现。
