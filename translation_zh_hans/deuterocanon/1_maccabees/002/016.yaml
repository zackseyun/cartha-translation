  text: to the city[a], so that they might offer sacrifice. And many from Israel came over to them[b], and Mattathias and his sons were gathered together.
translation:
  language: zh_hans
  text: 进城[a]，好让他们献祭。许多以色列人来到他们那里[b]；玛他提亚和他的儿子们也聚集到了一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有希腊文见证从句中开始；“进城”承接上一句，并非独立完整的一句。
    reason: textual_variant
  - marker: b
    text: 或译“走向他们”“投向他们”或“加入他们”。希腊文直指“来到／走向他们”；在此语境中可能含有站到他们一边的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν πόλιν
  choice: 进城
  rationale: 该宾格短语承接上文的移动动作；现代汉语用“进城”自然表达趋向，但不擅自补出残缺见证中未提供的主句成分。
- source_word: ἵνα θυσιάσωσιν
  choice: 好让他们献祭
  rationale: ἵνα加虚拟式表示目的；“献祭”准确保留θυσιάζω的礼仪含义。
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: 许多以色列人
  rationale: ἀπό表示出身或所属；汉语以“许多以色列人”自然表达“许多来自以色列的人”。
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: 归向他们
  rationale: 该短语本义是来到或走向他们；结合语境，“归向”可兼顾实际趋近与可能投向对方的意味，又不像“加入他们”那样把归附关系说得过实。
- source_word: συνήχθησαν
  choice: 聚集到了一起
  rationale: 该形式表示聚集或被召集；汉语不必机械保留被动，“聚集到了一起”自然呈现共同会合的结果，同时不说明是谁召集了他们。
theological_decisions:
- issue: πρὸς αὐτοὺς προσῆλθαν所暗示的政治与宗教立场
  choice: 译作“归向他们”
  alternative: “来到他们那里”或“加入他们”
  rationale: 原文明确表达趋向这些人，语境又可能暗示站到王的官员一边；所选译法保留这种张力，既不削弱为纯粹的空间移动，也不把正式归附强加给文本。
- issue: 玛他提亚父子的聚集与前句之间的关系
  choice: 用“也”承接，不译成转折
  alternative: “但玛他提亚和他的儿子们……”
  rationale: 原文使用καί而非明确的转折连词；即使上下文可能形成对照，本节本身不应被译文强化为显性的“但”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“献祭”保留宗教礼仪色彩；分号使两组人的行动并列呈现。“玛他提亚”按希腊文Ματταθίας作通行式音译。
