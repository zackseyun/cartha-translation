  yaml_path: translation/deuterocanon/1_maccabees/002/020.yaml
  text: But I and my sons and my brothers will walk in the covenant of our fathers[a].
translation:
  language: zh_hans
  text: 但我和我的儿子、我的弟兄，必遵行我们祖先的约。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“必行在我们祖先的约中。”这里的“行”大概指一生忠于并遵守这约。
    reason: 保留πορεύομαι与ἐν的字面意象及其可能的盟约性惯用含义。
lexical_decisions:
- source_word: κἀγώ
  choice: 但我
  rationale: κἀγώ由καί与ἐγώ缩合而成；结合上文众人可能顺从王命的对比，此处用“但我”自然表达马 Mattathias 的坚定反向立场，同时保留连接作用。
- source_word: οἱ υἱοί μου
  choice: 我的儿子
  rationale: υἱοί明确指男性子嗣，译作“儿子”保留原文的性别与叙事所指。
- source_word: οἱ ἀδελφοί μου
  choice: 我的弟兄
  rationale: ἀδελφοί通常指兄弟；“弟兄”较庄重，也不把原文无根据地扩展为所有亲族。
- source_word: πορευσόμεθα
  choice: 必遵行
  rationale: 该动词本义为“去、行走”，但与ἐν διαθήκῃ连用时表达按约而行、忠于盟约的生活实践；“遵行”在现代汉语中清楚自然。
- source_word: ἐν διαθήκῃ
  choice: 所立的约
  rationale: διαθήκη在此是宗教与群体意义上的“约”。汉语不宜直译为“在约中走”，故与动词合译为“遵行……所立的约”；“所立”使所属关系自然，但未另加立约者。
- source_word: πατέρων ἡμῶν
  choice: 我们祖先
  rationale: πατέρων字面为“我们的父辈”，在此指承受并传递此约的先祖；“祖先”在现代汉语中比“父亲们”自然，也保留历史传承之意。
theological_decisions:
- issue: πορευσόμεθα ἐν διαθήκῃ的盟约性表达
  choice: 必遵行我们祖先所立的约
  alternative: 必行在我们父辈的约中
  rationale: 原短语不单表示空间上的“去”，而是宣告按承继的约生活。“遵行……约”准确传达实践与忠诚，同时脚注保留较字面的表达，避免掩盖希腊语意象。
- issue: 男性亲属称谓
  choice: 我的儿子、我的弟兄
  alternative: 我的孩子、我的亲族
  rationale: 原文使用明确的男性复数称谓，正文保留其历史和家庭具体性，不作中性化或范围扩展。
- issue: πατέρων的译法
  choice: 我们祖先
  alternative: 我们的父辈
  rationale: 这里既可较字面地理解为“父辈”，也可指先祖传统。正文采用自然的“祖先”，脚注意识不必另设，因为此处差异不造成重要释义分歧。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“遵行……约”比生硬的“行在……约中”更符合普通话表达；用“弟兄”保持经文语体的庄重感。
