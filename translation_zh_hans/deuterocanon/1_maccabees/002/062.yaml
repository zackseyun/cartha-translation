base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/062.yaml
  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: zh_hans
  text: 不要因罪人的话而惧怕[a]，因为他的荣耀归于粪土和虫子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要怕罪人所说的话。”希腊文直译为“不要因一个有罪男子的话而害怕”。
    reason: 说明ἀπό与λόγος构成的表达，并保存ἀνδρός的阳性单数信息。
lexical_decisions:
- source_word: λόγου
  choice: 话
  rationale: λόγος在此指罪人所说的话或发出的言语。译作“话”既保留单数的具体表达，也符合现代汉语；译成“威胁”虽可能切合语境，却缩窄了原词含义。
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: 罪人
  rationale: 此短语指一个有罪的男子。汉语“罪人”简洁自然，并能保留道德判断；若译作“有罪的男子”则过于生硬。阳性单数的信息在脚注中说明。
- source_word: μὴ φοβηθῆτε
  choice: 不要……惧怕
  rationale: 直接保留否定命令的语气。“惧怕”庄重而通俗，也不把含义限定为“受威吓”。
- source_word: δόξα
  choice: 荣耀
  rationale: δόξα可指荣耀、尊荣或声望；“荣耀”保留原文高昂而带反讽的语气，与其最终归于腐朽形成强烈对照。
- source_word: εἰς κόπρια
  choice: 归于粪土
  rationale: εἰς表达趋向或结局。“归于”在汉语中自然呈现最终去向；“粪土”保留κόπρια粗粝、贬抑的具体意象。
- source_word: καὶ εἰς σκώληκας
  choice: 和虫子
  rationale: σκώληξ泛指虫或蠕虫，在腐朽语境中也可指蛆。“虫子”不超出原词范围，并保留死亡腐败的意象；“蛆虫”则较为具体。
theological_decisions:
- issue: ἀνήρ的阳性信息在现代汉语中如何表达
  choice: 正文译作“罪人”，脚注说明原文为阳性单数
  alternative: 有罪的男子
  rationale: 原文确为阳性单数，但“有罪的男子”在本句中不自然。“罪人”准确传达其身份判断，同时不把原文改成明确的泛称；以脚注保存语法信息。
- issue: 末句是否弱化粪土与虫子的腐朽意象
  choice: 保留“粪土和虫子”的具体意象
  alternative: 他的荣耀终必败坏
  rationale: 本句的警戒力量来自羞辱与死亡的鲜明图景。抽象译法会消除原文刻意保留的神学张力和修辞冲击。
- issue: εἰς是否明确译为将来的结局
  choice: 译作“归于”，不另加“终将”
  alternative: 终将化为粪土，归给虫子
  rationale: “归于”可表达趋向和结局，又不额外规定时间或具体变化过程，较好保留希腊文简练而略带歧义的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“惧怕”“荣耀”“归于”保持经文语体，“粪土和虫子”则不淡化原文尖锐的腐朽意象。
