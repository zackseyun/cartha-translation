  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: zh_hans
  text: 当天，他们作出决定，说：“安息日若有人来攻打我们，我们就迎战，这样我们绝不会全都死去，像我们的弟兄死在藏身之处那样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: 商议后说
  rationale: 该中动词表示共同商议并作出决定；“商议后说”既保留集体商议的过程，也自然引出后面的直接引语。
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: 若有人来
  rationale: πᾶς与带ἐὰν的关系从句在此表达开放条件，即“任何来……的人”；现代汉语以“若有人”最自然。
- source_word: εἰς πόλεμον
  choice: 攻打
  rationale: 此处指前来交战；结合πρὸς ἡμᾶς，译为“来攻打我们”比直译“为战争而来”清楚自然。
- source_word: πολεμήσομεν κατέναντι αὐτοῦ
  choice: 我们就迎战
  rationale: 表达面对来敌作战；“迎战”准确传达κατέναντι的对抗意味，又避免生硬重复“攻打”。
- source_word: οὐ μὴ ἀποθάνωμεν πάντες
  choice: 绝不能全都死去
  rationale: οὐ μή加强否定；此处是共同决议中的坚定表态。“绝不能”保留强烈否定，也符合现代汉语语境。
- source_word: ἐν τοῖς κρυφοῖς
  choice: 在藏身之处
  rationale: 中性复数名词指隐蔽、藏匿的地方；上下文可涉及洞穴等藏身处，但原文未在本节限定具体地形，故不具体化。
theological_decisions:
- issue: 安息日遇袭时是否作战
  choice: 按原文保留人物作出的集体决议：“安息日若有人来攻打我们，我们就迎战。”
  alternative: 将其扩展为普遍性的安息日律法解释，或加上“自卫”等解释性术语。
  rationale: 本节叙述的是特定历史情境中的决定，并未在措辞上系统界定安息日律法；译文不把叙事性决议提升为未明说的教义原则。
- issue: 强否定语气的理解
  choice: “绝不能全都死去”
  alternative: “我们肯定不会全都死去”
  rationale: 该话语既可听作坚定预测，也可听作决意不让同样的事重演；“绝不能”保留决议语境中的意志力度，而不将其化为神学保证。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“就在那一天”承接叙事；直接引语简洁有力。保留“安息日”“弟兄”等经文传统词汇，同时避免古奥句式和不必要的解释性增补。
