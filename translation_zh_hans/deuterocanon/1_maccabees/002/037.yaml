  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: zh_hans
  text: 他们说[a]：“让我们大家清白无辜地死去吧！天地就我们的事作证：你们竟不经审判就杀害我们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们说”原文是引出下文话语的分词，也可译作“说道”。“清白无辜地”所译的原词也可指“单纯”或“真诚”；此处语境较可能指无罪、无害的清白。
    reason: grammatical_alternative; lexical_alternative
  - marker: b
    text: “不经审判”也可译作“未经判断”或“不公正地”；原词兼有未经审理和不合公义的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 他们说
  rationale: 希腊语为引出直接引语的现在分词；汉语用“他们说”自然承接上文，又不改变其叙事功能。
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: 让我们大家……死去吧
  rationale: 不定过去时虚拟式具有劝勉语气；“让我们……吧”保留共同接受死亡的意愿，“大家”体现 οἱ πάντες 的强调。
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: 清白无辜地
  rationale: ἁπλότης 本可指单纯、真诚或专一；在此面对攻击而不还手的语境中，主要表达自身无罪、无害，但以脚注保留其词义幅度。
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: 为我们作证
  rationale: ἐπί 加宾格在这里可表达关于他们或有利于他们的见证；“为我们作证”符合司法申诉语境，同时避免增添希腊文未明说的“控告你们”。
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天地
  rationale: “天地”是现代汉语中自然、庄重且符合圣经语体的固定表达。
- source_word: ἀκρίτως
  choice: 未经审判
  rationale: 该副词直接指未经判断、审理或查验；正文保留其司法程序色彩，而脚注说明也含不公正、无理之意。
- source_word: ἀπόλλυτε
  choice: 就要消灭我们
  rationale: 动词可指毁灭、杀害；当下语境涉及死亡，“消灭”保留原词较宽的毁灭含义，“就要”传达迫近的现实行动。
theological_decisions:
- issue: 殉难语境中 ἁπλότης 的含义
  choice: 清白无辜
  alternative: 单纯、真诚、专一
  rationale: 说话者是在死亡面前申明自己没有罪责和敌意；正文采用符合语境的伦理含义，脚注则保留原词可能表达的单纯或真诚。
- issue: ἀκρίτως 的司法与道德意味
  choice: 未经审判
  alternative: 不公正地、未经判断、无理地
  rationale: 希腊词首先凸显没有判断或审理的程序性含义，也隐含行为不公；正文采用较具体的译法，脚注交代较宽的道德意味。
- issue: μαρτυρεῖ ἐφʼ ἡμᾶς 的关系指向
  choice: 为我们作证
  alternative: 为我们的事作证、针对我们作证、作证控告你们
  rationale: 介词结构存在一定幅度；语境表明天地的见证支持受害者，但原文没有明确的“控告你们”宾语，因此不在正文中补入。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“天地”为凝练的圣经式见证语。“清白无辜地”避免把 ἁπλότης 误解为天真幼稚；“未经审判”保留原文鲜明的司法申诉意味。
