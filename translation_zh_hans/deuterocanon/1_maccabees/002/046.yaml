  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: zh_hans
  text: 他们给在以色列境内找到的所有未受割礼的男孩，强行施了割礼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强行”直译为“凭力量”或“以强力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: 施了割礼
  rationale: περιτέμνω是表示施行割礼的标准动词；“施割礼”在现代汉语中准确、自然。
- source_word: τὰ παιδάρια τὰ ἀπερίτμητα
  choice: 未受割礼的男孩
  rationale: παιδάριον可指儿童或男孩；结合割礼语境，译作“男孩”较为明确，又不额外限定年龄。“未受割礼”直接表达ἀπερίτμητα所指的状态。
- source_word: ὅσα εὗρεν
  choice: 找到的所有
  rationale: ὅσα具有概括、穷尽意味。希腊文εὗρεν为单数，但上下文行动主体为复数；汉语采用不明说寻找者的定语结构，既自然，也不擅自消除原文的数变换。
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: 在以色列境内
  rationale: ὅρια可指边界、疆域或地区；“境内”简洁保留其地域范围含义。
- source_word: ἐν ἰσχύϊ
  choice: 强行
  rationale: 字面为“凭力量／以强力”；在此修饰对未受割礼男孩施行割礼，语境显示带有强制意味，“强行”能准确而简洁地传达这一点。
theological_decisions:
- issue: 所述行动的道德与神学色彩
  choice: 如实译为“强行”，只描述其强制性质，不加辩护或谴责。
  alternative: 有力地；大有能力地
  rationale: ἐν ἰσχύϊ在此语境中表示以强力施行。译文不应淡化其中的强制性，也不应加入原文没有明说的道德评断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“施割礼”保留经文术语的准确性；句式避免生硬照搬希腊文，同时保留原文关于行动范围及强制方式的信息。
