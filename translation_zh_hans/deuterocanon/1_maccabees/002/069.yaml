  text: And he blessed them[a], and was gathered to his fathers.
translation:
  language: zh_hans
  text: 他祝福了他们，便归到他列祖那里去了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归到他列祖那里”是表示死亡的传统说法；原文直译为“被加到他列祖那里”。
    reason: 说明原文的字面措辞与这一传统死亡惯用语的含义。
lexical_decisions:
- source_word: ηὐλόγησεν
  choice: 祝福了
  rationale: 此处指玛 Mattathias 对在场众人施予祝福；“祝福了”自然、庄重，并准确表达不定过去时所叙述的动作。
- source_word: προσετέθη
  choice: 归到……那里去了
  rationale: προστίθημι 的被动形式直译为“被加到”，但在这一传统死亡用语中，现代汉语若直译会生硬。“归到……那里去了”既保留含蓄表达，也符合汉语圣经语体。
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: 他列祖那里
  rationale: “列祖”准确表达此处的先祖群体，并保留传统经文用语的历史与宗族色彩；不直接改译为“死了”，以免消除原文的委婉表达。
theological_decisions:
- issue: 如何翻译 προσετέθη πρὸς τοὺς πατέρας αὐτοῦ 这一死亡惯用语
  choice: 归到他列祖那里去了
  alternative: 被加到他列祖那里；与他的祖先同归
  rationale: 原句是表示死亡的传统经文惯用语，但并未具体阐明死后状态。主文保留“归到列祖那里”的意象和含蓄性，不将其展开为特定的死后生命教义；脚注说明其字面形式及惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“列祖”略带传统经文色彩，但在此固定表达中清楚自然；“便”衔接祝福与死亡两个连续动作。
