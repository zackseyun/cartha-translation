base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/048.yaml
  text: And they rescued the law from the hand of the nations and from the hand of the kings[a], and they did not give a horn to the sinner.
translation:
  language: zh_hans
  text: 他们从列国和君王手中救出了律法，也没有把角给罪人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“没有把角给罪人”。“角”在圣经中常象征力量、权势或高升；本句也可译作“没有给罪人力量”或“没有让罪人掌权”。
    reason: 说明原文“角”的比喻意义及可能的功能性译法，同时保留正文的字面意象。
lexical_decisions:
- source_word: ἀντελάβοντο
  choice: 救出了
  rationale: 该动词的中间语态可表示扶助、援救或出手保护；这里以“律法”为宾语，又说从敌对势力手中将其取回，因此译作“救出了”最能表达主动解救之意。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 在马加比时代的语境中指犹太人的律法，即妥拉；“律法”是现代汉语圣经语体中自然且明确的对应词。
- source_word: ἐκ χειρὸς
  choice: 从……手中
  rationale: 保留希腊文以“手”表示掌控或占有的具体比喻，在现代汉语中也通顺易懂。
- source_word: τῶν ἐθνῶν
  choice: 列国
  rationale: 原词字面为“各国、列国”，在此语境中指非犹太民族；“列国”既保留原文措辞，也避免直接加入“外邦人”或“异教徒”等解释。
- source_word: τῶν βασιλέων
  choice: 君王
  rationale: βασιλεῖς直指君王；“君王”比泛称“统治者”更贴近原文。
- source_word: οὐκ ἔδωκαν κέρας
  choice: 没有让……得到角
  rationale: 保留κέρας“角”的具体形象，同时用“让……得到”自然表达希腊文“给……角”的句法；角在圣经语汇中可象征力量、权势或高升。
- source_word: τῷ ἁμαρτωλῷ
  choice: 罪人
  rationale: 原文为单数，直译作“罪人”；不将其扩释为“恶人”，以免缩窄词义。
theological_decisions:
- issue: 末句“角”的比喻意义
  choice: 正文保留“角”的形象，译为“没有让罪人得到角”
  alternative: 没有给罪人力量；没有让罪人掌权；没有让罪人高升
  rationale: “角”是圣经中表示力量、权势或高升的传统意象。正文保留这一意象，可维持原文的互文色彩与含义张力；脚注则说明其可能的功能意义，而不在正文中只选定一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列国”“君王”“律法”保留经文的历史宗教语感；末句略带陌生感，是为保存原文“角”的鲜明比喻，并以脚注帮助普通读者理解。
