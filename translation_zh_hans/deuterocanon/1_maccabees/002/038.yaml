  yaml_path: translation/deuterocanon/1_maccabees/002/038.yaml
  text: And they rose up against them in battle on the Sabbath[a], and they died—they and their wives and their children and their livestock—about a thousand persons.
translation:
  language: zh_hans
  text: 他们在安息日起来，向那些人发动攻击；那些人及其妻子、儿女和牲畜都死了，死亡人数约有一千人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死亡人数不超过一千”；希腊文可能表示一个约略的上限，并非精确统计。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτούς
  choice: 起来攻击那些人
  rationale: 保留ἀνέστησαν“起来”的动作意象，同时以“攻击”自然表达ἐπί所带的敌对含义，不额外限定具体战术。
- source_word: ἐν τῷ πολέμῳ
  choice: 攻击
  rationale: 此处表示实际发生的武力交战；与前面的敌对结构合译为“攻击”，比直译“在战争中”更符合现代汉语。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊文虽为复数形式，但在犹太安息日用语中可指某一个具体的安息日；上下文所述是当日发生的一次攻击。
- source_word: ἀπέθανον
  choice: 都死了
  rationale: 忠实保留不及物动词“死了”，不擅自强化为“被杀”，尽管上下文表明死亡发生于敌方攻击之中。
- source_word: τὰ κτήνη
  choice: 牲畜
  rationale: κτήνη指归人所有、饲养的动物；“牲畜”是清楚自然且不局限于牛的现代汉语表达。
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: 人数约有一千
  rationale: ψυχῶν ἀνθρώπων在此用于计算人数；ἕως加数词可能表示近似的上限，因此用“约有”保留非精确数字的意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那些人”承接前句受攻击的对象，以免连续使用“他们”造成施袭者与遇难者混淆；经文仍按希腊文使用“死了”，不把死亡方式明确改写为“被杀”。
