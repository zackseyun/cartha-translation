  yaml_path: translation/deuterocanon/1_maccabees/002/027.yaml
  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: zh_hans
  text: 玛塔提亚在城里高声喊道：“凡热心于律法、坚守盟约[a]的人，都出来跟随我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚守”所译的希腊语也可理解为“维护”或“使……站立得住”；这里指忠于并维系既有的盟约。
    reason: 说明 ἱστῶν 的语义幅度，并避免将其误解为首次“订立”或“确立”盟约。
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: 高声喊道
  rationale: 该动词表示强有力的公开呼喊；结合 φωνῇ μεγάλῃ，译作“高声喊道”自然地传达其声势和公开性。
- source_word: ἐν τῇ πόλει
  choice: 在城里
  rationale: 按其处所意义直接翻译；“城里”符合现代汉语叙事表达。
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: 凡热心于律法的人
  rationale: ζηλόω 与与格连用，在此指对律法怀有热忱并忠于律法；“热心于律法”保留其宗教与盟约语境中的力度。
- source_word: νόμῳ
  choice: 律法
  rationale: 在《马加比一书》的语境中指以色列的律法，即托拉；“律法”是现代中文圣经语体中清楚而庄重的对应词。
- source_word: ἱστῶν διαθήκην
  choice: 坚守盟约
  rationale: 此处的 ἵστημι 表示维持、支持或站稳于盟约，而非首次订立盟约；“坚守盟约”突出主动忠诚，同时保持简洁自然。
- source_word: διαθήκην
  choice: 盟约
  rationale: 虽无显式冠词，语境明确指以色列与上帝之间的盟约；中文不必加指示词也能表达其特指意义。
- source_word: ἐξελθέτω ὀπίσω μου
  choice: 都出来跟随我
  rationale: “出来”保留 ἐξέρχομαι 的实际离开之意，“跟随我”自然表达 ὀπίσω μου；“都”承接句首的 Πᾶς，使中文号召语气流畅。
theological_decisions:
- issue: διαθήκη 在犹太盟约语境中的翻译
  choice: 盟约
  alternative: 约
  rationale: “盟约”明确保留以色列与上帝之约的神学分量，又不额外限定盟约的具体内容。
- issue: ἱστῶν διαθήκην 的动作含义
  choice: 坚守盟约
  alternative: 维护盟约；确立盟约
  rationale: 上下文所说的是对既有盟约保持忠诚，而不是创立一个新约；但原词含有使之站立、维持的主动意味，因此以脚注提示其语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“高声喊道”传达公开号召的力度；引语使用“凡……的人，都……”形成自然的中文号召句式。“出来跟随我”同时保留实际离城与跟随领袖两层意思。
