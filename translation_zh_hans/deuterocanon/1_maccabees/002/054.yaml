translation:
  language: zh_hans
  text: 我们的祖先非尼哈因大有热心[a]，领受了圣洁祭司职分之约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文将“热心”的同根动词和名词并用，以加强语气；较字面的表达可作“因他热心地显出热心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φινεὲς
  choice: 非尼哈
  rationale: 采用现代中文圣经中这一人名的通行译法，便于辨认其与《民数记》传统的关联。
- source_word: ὁ πατὴρ ἡμῶν
  choice: 我们的祖先
  rationale: 原文直译为“我们的父亲”，此处指民族先祖；译作“我们的祖先”在现代汉语中自然准确，同时保留群体认同意味。
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: 因大发热心
  rationale: 该结构以同根动词和名词加强语气，并在语境中带有因由意味。“大发热心”以自然中文表达其强调程度；脚注说明原文的同根复沓。
- source_word: ἔλαβε
  choice: 得了
  rationale: 表示领受、获得；“得了”简洁自然，也没有暗示他凭武力夺取。
- source_word: διαθήκην
  choice: 约
  rationale: 采用圣经语境中 διαθήκη 的标准译法，保留与非尼哈传统的互文和神学含义。
- source_word: ἱερωσύνης ἁγίας
  choice: 圣洁祭司职分
  rationale: ἁγίας 修饰 ἱερωσύνης；“祭司职分”比单说“祭司”更准确地表达职分或祭司体系，“圣洁”对应其分别为圣的性质。
theological_decisions:
- issue: 非尼哈的热心与领受祭司之约之间的关系
  choice: 译作“因大发热心”，保留因由关联，并以脚注交代同根强调
  alternative: “当他表现出热心时”或较直译的“因以热心发热心”
  rationale: 上下文将领受此约与非尼哈的热心相联；“因”能表达这里自然的因由意味，但不补充希腊文未明说的行为细节。中文正文不生硬复制同根复沓，脚注则保存其修辞信息。
- issue: διαθήκην ἱερωσύνης ἁγίας 的结构
  choice: “圣洁祭司职分的约”
  alternative: “圣洁祭司之约”
  rationale: 属格短语表明约与圣洁的祭司职分相关；采用“……的约”保留结构关系，不进一步断定其确切制度范围或持续方式。
translation_notes:
  register: 使用庄重而通顺的现代标准汉语。“祖先”避免现代读者误解为亲生父亲；“大发热心”传达强调语气；正文脚注标记与脚注完全对应。
