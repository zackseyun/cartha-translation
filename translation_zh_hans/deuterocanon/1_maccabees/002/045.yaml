  text: And Mattathias and his sons went around and tore down their altars,
translation:
  language: zh_hans
  text: 玛他提亚和他的儿子们走遍各处，拆毁了那些人的祭坛，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: 走遍各处
  rationale: 该动词本义为“绕行、巡行”。结合上下文，这里指他们到各处采取行动；译作“走遍各处”自然表达这种巡行，而不误导为军事包围。
- source_word: καθεῖλον
  choice: 拆毁
  rationale: 该动词表示拆除、毁坏建筑物或设施；“拆毁”准确而自然地表达对祭坛的实际破坏。
- source_word: βωμοὺς
  choice: 祭坛
  rationale: βωμός通常指献祭用的坛；“祭坛”是现代汉语中直接、清楚的对应词，不引入原文没有的“丘坛”等概念。
- source_word: αὐτῶν
  choice: 那些人的
  rationale: 代词意为“他们的”，其具体所指须由上文确定。译作“那些人的”既保留所属关系，也避免中文中“他的儿子们……他们的祭坛”可能造成的指代误解。
- source_word: Ματταθίας
  choice: 玛他提亚
  rationale: 采用适合中文圣经人名的音译形式。
theological_decisions:
- issue: 被拆毁祭坛的宗教归属
  choice: 保留为“那些人的祭坛”
  alternative: 笼统译为“祭坛”或明确增译为“偶像祭坛”
  rationale: 原文以αὐτῶν表明这些祭坛属于上文所指的一方，但本句本身并未明说“偶像”。译文保留所属关系，不把所有祭坛一概包括，也不添加原文未明说的定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“走遍各处”传达巡行各地的语境意义；“那些人的”消除汉语代词可能产生的歧义。句末保留逗号，以对应本节可能接续的句法结构。
