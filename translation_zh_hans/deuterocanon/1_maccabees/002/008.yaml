  text: Her sanctuary became like a man of honor;[a]
translation:
  language: zh_hans
  text: 她的圣所变得像一位尊贵的男子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”或译“圣殿”；“尊贵的”或译“受尊崇的”或“荣耀的”。
    reason: ναός可译为“圣所”或“圣殿”；ἔνδοξος可表示“尊贵的”“受尊崇的”或“荣耀的”。
lexical_decisions:
- source_word: ἐγένετο
  choice: 变得
  rationale: γίνομαι 的不定过去时表示状态发生改变；“变得”自然地保留了这一动态含义。
- source_word: ὁ ναὸς
  choice: 圣所
  rationale: ναός 可指圣殿，也可特指其中神圣的殿宇或圣所；此处译作“圣所”，既保留敬拜场所的神圣意味，也不武断地扩大为整个圣殿建筑群。
- source_word: αὐτῆς
  choice: 她的
  rationale: 阴性代词承接上下文中被拟人化的耶路撒冷；“她的”保留原文的拟人表达。
- source_word: ὡς ἀνὴρ ἔνδοξος
  choice: 像一个尊贵的人
  rationale: ὡς 明示比喻，ἀνήρ 保留男性单数形象；ἔνδοξος 可指有荣耀、受尊崇或显贵，“尊贵”在现代汉语中自然，并保留社会地位和尊荣的含义，而不过度解释其语境效果。
