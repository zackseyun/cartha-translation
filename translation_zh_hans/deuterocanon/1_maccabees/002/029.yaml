  text: Then many who were seeking righteousness and justice went down into the wilderness to settle there,[a]
translation:
  language: zh_hans
  text: 那时，许多寻求公义和公正的人下到旷野，要住在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“寻求正义和判断。”希腊文将 δικαιοσύνην 与 κρίμα 并列；二者含义可能重叠，但很可能仍表达两个彼此相关的理念。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 表示叙事顺序；“那时”简洁自然，也保留了事件承接的意味。
- source_word: κατέβησαν
  choice: 下到
  rationale: 保留 καταβαίνω 明确的下降、下行意象，不笼统译作“去了”。
- source_word: πολλοὶ
  choice: 许多……的人
  rationale: 按其数量含义直译，并与分词 ζητοῦντες 组合成自然的现代汉语名词结构。
- source_word: ζητοῦντες
  choice: 寻求
  rationale: 现在分词表明持续或具有特征性的追求；“寻求”比“寻找”更适合抽象的道德理想。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 该词在此可指正直、合乎正义的生活；译作“公义”既保留其道德与宗教色彩，也与后面的 κρίμα 略作区分。
- source_word: καὶ κρίμα
  choice: 和公正
  rationale: κρίμα 可指判断、裁断或公正；此处与 δικαιοσύνην 并列，译作“公正”较自然，并保留两个相关而不完全相同的理念。
- source_word: εἰς τὴν ἔρημον
  choice: 到旷野
  rationale: ἔρημος 指人烟稀少、荒僻之地；“旷野”符合圣经叙事语域，又不把地貌限定为沙漠。
- source_word: καθίσαι ἐκεῖ
  choice: 要住在那里
  rationale: 此处不宜按字面译为“坐在那里”，而表示留下居住；用“要”表达不定式所带的目的意味。
theological_decisions:
- issue: δικαιοσύνη 与 κρίμα 这一并列词组的处理
  choice: 公义和公正
  alternative: 正义和判断／公义和裁断
  rationale: 两个希腊词意义有所重叠，却仍可能分别侧重正直、公义与判断、公正。正文不把二者合并为一个概念，也不把 κρίμα 限定为某一次具体的司法判决；脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“下到旷野”保留原文的空间方向，“要住在那里”则以自然汉语表达居住目的。正文中的脚注标记为[a]，与脚注相对应。
