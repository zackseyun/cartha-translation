  text: Joseph[a], in the time of his distress, kept the commandment, and became lord of Egypt.
translation:
  language: zh_hans
  text: 约瑟在他困苦的时候，遵守了诫命[a]，成为埃及的统治者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“遵守了一条诫命”或“遵守了命令”。希腊文没有说明所指的是哪一条诫命，也可能是在概括约瑟一贯的顺服。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: 在困苦的时候
  rationale: 按希腊语直译为处于他受困、遭难的时期；“困苦”自然庄重，也保留 στενοχωρία 所含的受压迫、陷入艰难之意。
- source_word: ἐφύλαξε
  choice: 遵守了
  rationale: 与“诫命”搭配时，“遵守”准确表达持守并实行命令，比字面的“守护”更符合现代汉语。
- source_word: ἐντολήν
  choice: 诫命
  rationale: 原文为无冠词单数，可能泛指上帝的诫命，也可能指一项具体命令；正文采用宗教语境中自然的“诫命”，以脚注保留其不确定性。
- source_word: ἐγένετο
  choice: 后来成为
  rationale: 表示身份或地位发生转变；“后来”自然显明前后结果关系，但不额外断言严格的因果机制。
- source_word: κύριος Αἰγύπτου
  choice: 埃及的主宰
  rationale: 这里 κύριος 指约瑟在埃及所得的崇高权位，并非上帝的称号；“主宰”保留其地位之高，也避免“埃及之主”在汉语中可能产生神性称号的误解。
theological_decisions:
- issue: 约瑟所遵守的诫命具体指什么
  choice: 正文概括为“遵守了诫命”，不指定内容
  alternative: 具体理解为约瑟拒绝波提乏之妻时所遵守的某一条命令
  rationale: 希腊文没有说明是哪一条诫命。上下文或可使人联想到《创世记》39章，但译文不应把这一可能的背景确定为唯一所指。
- issue: κύριος 是否为神性称号
  choice: 理解为约瑟在埃及拥有的权位，以“主宰”表达
  alternative: 译作“埃及之主”
  rationale: 句子的主语是约瑟，且叙述其升高后的政治地位；这里并非用 κύριος 称呼上帝。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“困苦”适合智慧劝勉式语境；“主宰”用于政治权位，避免把约瑟误读为具有神性身份。脚注标记已在正文“诫命”之后标出。
