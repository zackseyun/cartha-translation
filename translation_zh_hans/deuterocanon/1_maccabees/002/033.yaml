  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
translation:
  language: zh_hans
  text: 他们对那些人说：“事到如今[a]——你们出来，照王的话[b]去做，便可活命。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头很简短，也可译为：“到如今。”这句话可能表示他们还有最后一次服从的机会。
    reason: lexical_alternative
  - marker: b
    text: “照王的话”也可译作“照王的命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  choice: 到现在
  rationale: 保留希腊文突兀、简短的时间短语，不在正文中径直解释为“现在还来得及”，从而留下它表示时间界限或最后机会的含混性。
- source_word: ἐξέλθοντες
  choice: 你们出来
  rationale: 该分词与后面的命令式连用，在直接喊话的语境中用汉语命令句表达最自然；“出来”也符合对藏匿者或身处围困之地者说话的方向感。
- source_word: ποιήσατε
  choice: 去做
  rationale: 对应宽泛的命令式“做、实行”；加“去”使现代汉语命令句通顺，但不增添具体行动内容。
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: 照王的话
  rationale: λόγος 在此可指王所说的话，也可具有命令之意；正文保留“话”，避免把语义范围过早限定为正式诏令。
- source_word: ζήσεσθε
  choice: 就能活命
  rationale: 在威胁与招降语境中，“活命”自然表达“得以存活、性命获保”的含义；“就能”呈现顺从后将产生的结果，又不明确添加谁来饶命。
