  text: David[a], because of his mercy, inherited the throne of an everlasting kingdom.
translation:
  language: zh_hans
  text: 大卫[a]因着他的怜悯，继承了永远国度的王位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大卫因着上帝的怜悯，继承了永远国度的王位。”原文“他的”也可能指上帝，而不是大卫。
    reason: 保留αὐτοῦ所指对象的真实歧义。
lexical_decisions:
- source_word: Δαυεὶδ
  choice: 大卫
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: 因着他的怜悯
  rationale: ἐν加与格在此可表达原因、凭借或所处范围；“因着”自然地传达可能的原因或凭借意义，“他的”则保留原文代词所指的歧义。正文按就近句法理解为大卫的怜悯，另一种理解见脚注。
- source_word: ἐκληρονόμησεν
  choice: 承受了
  rationale: 保留κληρονομέω所含的继承、得为产业之意，也符合中文圣经语体，并避免泛化为单纯的“获得”。
- source_word: θρόνον
  choice: 宝座
  rationale: 指王权所系的王座；“宝座”在现代中文中庄重而易懂，也能表达其王室含义。
- source_word: βασιλείας αἰωνίας
  choice: 永远国度的
  rationale: 保留属格结构，并以“永远”表达αἰωνίας所指持久、长存的王权或国度，不额外限定其哲学意义。
theological_decisions:
- issue: ἐν τῷ ἐλέει αὐτοῦ中αὐτοῦ所指是大卫还是上帝
  choice: 正文按就近句法理解为大卫：因着他的怜悯。
  alternative: 因着上帝的怜悯，他承受了永远国度的宝座。
  rationale: 前文主语“大卫”是代词最直接的先行词，而且本段逐一称颂先贤的突出品格；但圣经语言中将此理解为上帝的怜悯同样可能，因此不在正文中擅自消除张力，而以脚注保留。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“因着”略带经文语体，但仍属现代常用表达；“承受……宝座”保留继承和王朝延续的意味。
