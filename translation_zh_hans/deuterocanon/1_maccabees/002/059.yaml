translation:
  language: zh_hans
  text: 哈拿尼雅[a]、亚撒利雅和米沙利信靠后，从烈焰中获救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文名形为“亚拿尼亚、亚撒利亚、米撒伊尔”。正文采用较为人熟悉的希伯来名字形式，指《但以理书》第3章中的三位青年。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: 哈拿尼雅、亚撒利雅和米沙利
  rationale: 采用这三人的希伯来名字在现代中文圣经中的常见形式，便于读者认出他们是《但以理书》第3章中的三位青年；脚注保留希腊文名形。
- source_word: πιστεύσαντες
  choice: 信靠了
  rationale: 以动词表达 πιστεύω 的不定过去时分词，保留“相信、信靠”的动作，不改写成名词性的“凭信心”，也不补出原文没有明说的信靠对象。
- source_word: ἐσώθησαν
  choice: 得救
  rationale: 直接对应 σῴζω 的被动形式；在此语境中指从致命烈焰中获救，同时保留该词较宽的语义范围。
- source_word: ἐκ φλογός
  choice: 从烈焰中
  rationale: φλόξ 是“火焰、烈焰”，ἐκ 表示从其中出来；“从烈焰中”自然、鲜明，并与但以理书的事件相呼应。
theological_decisions:
- issue: πιστεύσαντες 与 ἐσώθησαν 的关系
  choice: “信靠了，便……得救”
  alternative: “因着信靠而……得救”或“信了以后……得救”
  rationale: 希腊文分词可表达伴随、先行或原因等关系。正文用“便”自然连接两项动作，却不把它严格限定为纯粹的因果或时间关系；脚注说明其他可能理解。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“烈焰”保留原文单数 φλογός 的鲜明火焰意象；全句简洁，适合格言式劝勉的上下文。
