  text: And the king’s agents, who were compelling apostasy, came to Modein
translation:
  language: zh_hans
  text: 王派来强迫人背弃信仰的官员到了摩得因。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: 王派来的官员
  rationale: 原文直译为“从王那里来的人”，语境表明他们奉王命执行命令；“王派来的官员”在现代汉语中自然，也不具体限定其官职。
- source_word: καταναγκάζοντες
  choice: 强迫
  rationale: 该分词表达施加强制和胁迫；“强迫”准确保留其力度，并适合本句的定语结构。
- source_word: τὴν ἀποστασίαν
  choice: 背弃信仰
  rationale: ἀποστασία可指背叛、离弃；在本段逼迫犹太人放弃祖传信仰与礼俗的语境中，“背弃信仰”清楚传达宗教意义，同时比术语化的“叛教”更便于普通读者理解。
- source_word: εἰς Μωδεείν
  choice: 到了摩得因
  rationale: εἰς与移动动词连用，表示前往并抵达；“到了”符合现代汉语叙事习惯。地名Μωδεείν音译为“摩得因”。
- source_word: Καὶ ἦλθον
  choice: 到了
  rationale: καί承接上文推动叙事，汉语无需机械译出“并且”；以“到了”自然表达事件的接续。
theological_decisions:
- issue: 逼迫语境中ἀποστασία的含义
  choice: 按宗教意义译为“背弃信仰”
  alternative: 按政治意义译为“叛乱”，或笼统译为“背离”
  rationale: 马加比书当前语境是强迫犹太人放弃祖传信仰和礼俗、参与异教仪式，因此宗教性的离弃是主要含义；译文不把它误解为政治叛乱。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王”依原文保留，不补出王名；关系分词结构处理为前置定语，使句子简洁自然。
