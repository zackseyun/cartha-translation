  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: zh_hans
  text: 那时，有一群哈西德人[a]聚集到他们那里；他们来自以色列，力量强大，人人都甘心委身于律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈西德人”也可音译为“哈西丁”或“阿西代人”；这是一个以热心维护律法著称的犹太群体名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: 聚集到他们那里
  rationale: 表达向前述群体靠拢、与之会合的动作，同时不把它过度解释为正式入伍或结盟。
- source_word: συναγωγὴ
  choice: 一群人
  rationale: 这里指聚集起来的群体；译作“一群人”自然清楚，也避免带入后世“会堂”的专门含义。
- source_word: Ἀσιδαίων
  choice: 哈西德派的人
  rationale: 该词在此是特定犹太群体的名称，采用音译并加“派的人”以便现代汉语读者辨明其为群体称谓，而不直接解释成“虔诚人”。
- source_word: ἰσχυρὰ δυνάμει
  choice: 力量强大
  rationale: 保留原文对能力或实力的强调，同时采用自然、庄重的现代汉语。
- source_word: ἀπὸ Ἰσραήλ
  choice: 来自以色列
  rationale: 忠实表达ἀπό所表示的来源，不进一步限定为地域、民族或支派意义。
- source_word: πᾶς ὁ ἑκουσιαζόμενος
  choice: 人人都甘心献身
  rationale: 兼顾自愿性和主动委身之意，比单译“自愿”更能体现其与律法的关系，同时不额外加入军事色彩。
- source_word: τῷ νόμῳ
  choice: 于律法
  rationale: 与“献身”搭配为“献身于律法”，准确表达对律法的自愿委身；“律法”按中文圣经惯用表达处理。
theological_decisions:
- issue: Ἀσιδαίων是群体专名还是描述性称呼
  choice: 哈西德派的人
  alternative: 虔诚人
  rationale: 上下文宜视为历史群体称谓；保留音译可避免把具体身份消解为一般性的敬虔评价。
- issue: ἑκουσιαζόμενος τῷ νόμῳ所表达的委身性质
  choice: 甘心献身于律法
  alternative: 自愿为律法效力
  rationale: 所选译法保留自愿和委身两层含义，却不将原文明确军事化，也不把它弱化为泛指遵守律法。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“力量强大”保留希腊文的强调；分号理清“聚集”与群体说明之间的关系。
