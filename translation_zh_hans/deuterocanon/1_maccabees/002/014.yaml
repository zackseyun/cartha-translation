  text: And Mattathias and his sons tore their clothes[a], put on sackcloth, and mourned greatly.
translation:
  language: zh_hans
  text: 玛他提亚和他的儿子们撕裂了自己的衣服，披上麻衣，深深哀悼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξεν
  choice: 撕裂
  rationale: 该动词在这里指以撕裂衣服表达悲痛或义愤。“撕裂”既准确，也保留了这一哀悼动作的力度。希腊文虽以单数动词配合复合主语，中文按整体事件自然表达即可。
- source_word: τὰ ἱμάτια αὐτῶν
  choice: 衣服
  rationale: ἱμάτια泛指他们所穿的衣物，尤其可指外衣；“衣服”是现代中文自然、清楚的对应，不必限定为长袍。
- source_word: περιεβάλοντο σάκκους
  choice: 披上麻衣
  rationale: 此短语字面涉及把粗麻制成的哀服披在身上。“披上麻衣”符合中文圣经语境中的哀悼表达，又清楚呈现穿戴动作；希腊文复数不必机械译成“麻衣们”。
- source_word: ἐπένθησαν
  choice: 悲哀
  rationale: 该词表示因重大事件而哀悼、悲伤；结合撕衣和披麻衣的仪式性语境，“悲哀”自然且不弱化其哀悼意味。
- source_word: σφόδρα
  choice: 极其
  rationale: σφόδρα是程度副词，强烈修饰哀悼。“极其”准确保留强度，不额外加入“痛苦地”或“悲痛欲绝”等原文未明说的色彩。
- source_word: Ματταθίας
  choice: 玛他提亚
  rationale: 采用现代中文音译，保持人名辨识度，并与次经中文译名传统相协调。
