  naturalness: “披上麻衣”自然、庄重，并符合中文对古代哀悼习俗的常用表达。“撕裂了自己的衣服，披上麻衣，深深哀悼”在现代书面中文中更完整顺畅，也保留原文的动作序列。
  terminology: “玛他提亚”音译可接受；“麻衣”恰当地对应 σάκκους，中文无需反映希腊文复数。“哀悼”比“悲哀”更贴合仪式性且带动作性的 ἐπένθησαν。
