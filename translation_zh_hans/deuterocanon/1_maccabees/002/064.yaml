  yaml_path: translation/deuterocanon/1_maccabees/002/064.yaml
  text: And you, children, be strong and act like men in your law, because in it you will be glorified.
translation:
  language: zh_hans
  text: 至于你们，孩子们，要在你们的律法中刚强，表现得像男子汉[a]，因为你们必在其中得荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要勇敢”。希腊语直译带有男性意象，可译作“表现得像男子汉”。
    reason: lexical_alternative
  - marker: b
    text: 或译“受尊荣”或“赢得荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们
  rationale: 这是泛指“儿女、孩子”的称呼，并非专指儿子；“孩子们”自然保留了原文的广泛指向。
- source_word: ἰσχύετε
  choice: 要刚强
  rationale: 现在时命令语气要求持续保持力量和坚定；“要刚强”简洁而有劝勉力度。
- source_word: ἀνδρίζεσθε
  choice: 显出男子气概
  rationale: 该动词带有明确的男性意象，同时惯常表达勇敢、刚毅。“显出男子气概”保留原文修辞意象，并以脚注说明其惯用含义。
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: 在你们的律法上
  rationale: ἐν在此表示行动所处的领域或根基；保留ὑμῶν为“你们的”，指他们所属民族承受的律法。
- source_word: δοξασθήσεσθε
  choice: 你们必……得荣耀
  rationale: 未来被动形式可指被赋予荣耀、受尊荣或赢得荣耀。“得荣耀”在现代汉语中自然，并不限定施予荣耀的主体或实现方式。
theological_decisions:
- issue: ἀνδρίζεσθε所含的男性意象
  choice: 显出男子气概
  alternative: 要勇敢
  rationale: 原文有明确男性意象，不宜在正文中完全中和；脚注同时给出其惯用义“要勇敢”，便于现代读者理解。
- issue: δοξασθήσεσθε的含义与施事者
  choice: 得荣耀
  alternative: 受尊荣；赢得荣耀
  rationale: 原文没有说明荣耀由谁赐予，也没有界定它是社会性的尊荣还是终末性的伸冤；“得荣耀”保留这种开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于你们”体现καὶ ὑμεῖς中对受话者的强调；句式保持劝勉语气，并保留律法、男性意象及“得荣耀”的神学张力。
