  yaml_path: translation/deuterocanon/1_maccabees/002/050.yaml
  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: zh_hans
  text: 如今，孩子们，你们要为律法热心，并要为我们列祖的约献出你们的性命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们
  rationale: 这是 τέκνον 的呼格复数，是亲属式称呼；“孩子们”自然保留父亲对后辈的直接呼唤，也不把词义限定为男性。
- source_word: ζηλώσατε τῷ νόμῳ
  choice: 要为律法大发热心
  rationale: ζηλόω 的不定过去时命令式表达强烈而迫切的委身；与与格 τῷ νόμῳ 连用，意为对律法满怀热忱、为之竭力。“大发热心”保留其宗教与盟约语境中的力度。
- source_word: τῷ νόμῳ
  choice: 律法
  rationale: 在本段犹太历史语境中，νόμος 指祖传的妥拉；“律法”是现代中文圣经语体中准确而易懂的对应。
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: 献出你们的性命
  rationale: ψυχή 在此自我牺牲的劝勉中指人的生命；“献出性命”既自然，也避免把它窄化为与身体相对的非物质“灵魂”。
- source_word: ὑπὲρ διαθήκης
  choice: 为……的约
  rationale: ὑπέρ 在牺牲语境中表示“为了、为维护”；简洁译作“为”，由“献出性命”清楚传达为某事舍命的含义。
- source_word: διαθήκης
  choice: 约
  rationale: 在犹太经文语境中，διαθήκη 指具有约束力的盟约关系；中文“约”准确简洁，并与“列祖”构成自然的经文表达。
- source_word: πατέρων ἡμῶν
  choice: 我们列祖
  rationale: πατέρων 明确是阳性复数，并带有以色列盟约传统中的祖先含义；“列祖”既保留男性祖辈色彩，又比“我们的父亲们”更符合现代中文经文语体。
theological_decisions:
- issue: πατέρων ἡμῶν 的性别与祖传盟约语言
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原文明确使用“父辈”一词。“列祖”保留其男性祖辈和盟约传统的色彩，不将之中性化，同时避免现代汉语中“父亲们”可能造成的直系生父误解。
- issue: 殉道式劝勉中 ψυχή 的含义
  choice: 性命
  alternative: 灵魂；自己
  rationale: 上下文要求为约作出至死的自我牺牲，故 ψυχή 在此是“生命、性命”，而非专指非物质的灵魂；如此不额外引入原文未断定的人论立场。
- issue: ὑπὲρ διαθήκης 所表达的关系
  choice: 为我们列祖的约
  alternative: 为了维护我们列祖的约
  rationale: 原文 ὑπέρ 可表达为了、为维护或为……缘故。正文用简洁的“为”保留语义幅度，不把维护、捍卫等具体行动方式明说出来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“现在，孩子们”保留临终父亲直接劝诫的口吻；“大发热心”“献出你们的性命”传达两个命令式的迫切与力度。“列祖的约”保留犹太经文的盟约语域，同时普通读者仍可理解。
