base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: zh_hans
  text: 他说：“哀哉！我为何生在世上，竟要看见我百姓的破败[a]和圣城的毁坏，还要坐在那里，眼看圣城被交在仇敌手中[b]，圣所被交在外族人手中呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “破败”所译的希腊词是复数，也可译作“残破的景象”或“遍地废墟”，可能强调百姓所受毁坏的广泛与惨重。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在仇敌的手中……在外族人的手中”；这是圣经常见的说法，表示被交给他们掌控。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  choice: 哀哉
  rationale: 这是表达深切悲痛的感叹语；“哀哉”庄重而简洁，保留哀歌语气。
- source_word: ἵνα τί τοῦτο ἐγενήθην
  choice: 我为何生在世上，竟要
  rationale: 在此哀叹语境中，ἐγενήθην指“出生、来到世上”；加入“竟”自然传达说话者悲愤不解的语气，而不改变疑问内容。
- source_word: τὰ συντρίμματα τοῦ λαοῦ μου
  choice: 我百姓的破败
  rationale: συντρίμματα为复数，描绘遭击碎、毁坏后的惨状；汉语用集合性的“破败”较自然，复数所强调的广泛灾情在脚注中说明。
- source_word: τὸ σύντριμμα τῆς πόλεως τῆς ἁγίας
  choice: 圣城的毁坏
  rationale: 与前句保持意义平行，同时用自然汉语表达城市遭摧毁的状态；不直接补出“耶路撒冷”，因为原文仅称“圣城”。
- source_word: καθίσαι ἐκεῖ
  choice: 坐在那里
  rationale: 保留原文具体的“坐”及无力滞留、目睹灾难的画面，不释为较抽象的“居住”。
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: 眼看圣城被交在
  rationale: ἐν加冠词化不定式表示同时发生的处境；阴性代词αὐτήν回指“城”。“眼看”承接前文的目睹与无力感，“被交在”保留被动表达。
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: 在仇敌手中
  rationale: 保留圣经常见的“在……手中”这一权势归属隐喻，表示落入仇敌控制之下。
- source_word: τὸ ἁγίασμα
  choice: 圣所
  rationale: 指分别为圣的敬拜场所或圣殿范围；“圣所”准确简洁，且不把含义过度限定为某一具体建筑部分。
- source_word: ἀλλοτρίων
  choice: 外族人
  rationale: 该词表示不属于本群体的人、外人；此处与仇敌占领圣城和圣所的语境相合。“外族人”既自然，也保留群体界线。
theological_decisions:
- issue: 约民与圣城称谓的处理
  choice: 保留“我百姓”和“圣城”
  alternative: 译作“我的民族”，或直接补明“耶路撒冷”
  rationale: 原文使用λαός和“圣城”这一带有盟约与敬虔色彩、却未进一步解释的称谓。直译其称谓可保留神学分量，又避免加入原文没有的明确指认。
- issue: 圣城与圣所被交付的被动表达
  choice: 圣城“被交在”仇敌手中，圣所“落在”外族人手中
  alternative: 明确补出上帝为交付者，或全部改为主动式“仇敌夺取”
  rationale: 原文没有说明交付者；保留被动与省略，可维持经文关于灾难发生方式及施事者的含蓄，不擅自作神学解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“哀哉”保留哀叹的经文语域；其余句法尽量现代自然。通过“竟要”“眼看”呈现悲痛与无力感，同时不补入原文未明说的施事者或地名。所有脚注标记均置于正文相关词句之后。
