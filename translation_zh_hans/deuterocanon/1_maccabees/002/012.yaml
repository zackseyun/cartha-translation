  yaml_path: translation/deuterocanon/1_maccabees/002/012.yaml
  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: zh_hans
  text: 看哪，我们的圣物、我们的荣美和我们的荣耀都已被毁，沦为荒凉；列国亵渎了它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意和哀叹的语气；比单用“看”更符合庄重叙事语体。
- source_word: τὰ ἅγια ἡμῶν
  choice: 我们的圣物
  rationale: 采用复数集合意义，既贴近希腊文，也不把所指范围限缩为圣殿或圣所。
- source_word: ἡ καλλονὴ ἡμῶν
  choice: 我们的荣美
  rationale: 表达美丽、华美以及珍贵可夸之处，并与后面的“荣耀”形成庄重的并列。
- source_word: ἡ δόξα ἡμῶν
  choice: 我们的荣耀
  rationale: 直接保留 δόξα 的核心意义及其群体性的尊荣内涵。
- source_word: ἠρημώθη
  choice: 都已荒废
  rationale: 被动形式表示遭到毁坏、变为荒凉；“都”统摄前面的三个并列主语。
- source_word: ἔθνη
  choice: 各国的人
  rationale: 在此指外来诸族或列国之民；此译法保留群体含义，且避免带入后世固定的宗教标签。
- source_word: ἐβεβήλωσαν αὐτὰ
  choice: 还亵渎了这一切
  rationale: “亵渎”准确表达使圣物沾污、失去神圣性的含义；“这一切”自然回指前述复数整体。
theological_decisions:
- issue: “圣物”的具体所指
  choice: 保留概括性的“我们的圣物”
  alternative: 译作“我们的圣所”或“我们的圣殿”
  rationale: 原文为中性复数 τὰ ἅγια，可泛指神圣之物或圣洁之处；不应在译文中擅自限定为单一建筑。
- issue: ἔθνη 的身份含义
  choice: 译作“各国的人”
  alternative: 译作“外邦人”
  rationale: 原文强调列国或诸族；“各国的人”避免把历史语境中的敌对民族直接套入特定神学术语。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”维持经文式的呼告力度；三项“我们的……”保留原文排比。“还”传达荒废之外进一步遭受亵渎的递进关系。
