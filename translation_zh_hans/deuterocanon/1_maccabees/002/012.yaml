  source_fidelity: “荒废”通常指因无人使用或管理而废置，未充分表达ἠρημώθη（被毁坏而成荒凉）的受害性与毁灭结果。“还”给καὶ加入了原文未明示的递进色彩。ἔθνη以“列国”直译更准确，也保留其群体、政治性的指称。
  naturalness: 原译整体庄重通顺，但“圣物、荣美和荣耀都已荒废”在现代汉语中略显搭配不稳；改为“都已被毁，沦为荒凉”更自然，并保留哀歌式排比。
  terminology: “圣物”“荣美”“荣耀”“亵渎”均可保留；不应将τὰ ἅγια限缩为圣殿或圣所。“列国”对应ἔθνη，避免“各国的人”较口语且将集体名词拆解为个人。
  issues:
