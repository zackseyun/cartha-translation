    rationale: 该动词表示被使成荒凉、遭毁灭，而不只是闲置失修。
  - severity: low
    issue: “还”添加递进关系。
    rationale: 原文仅以καὶ连接两个陈述；可用一般并列，不宜明确加上“还”的附加语气。
  - severity: low
    issue: “各国的人”不如“列国”贴近ἔθνη。
    rationale: ἔθνη在此为复数群体／列国，而非主要强调其中的个人。
  revised_text: 看哪，我们的圣物、我们的荣美和我们的荣耀都已被毁，沦为荒凉；列国亵渎了它们。
