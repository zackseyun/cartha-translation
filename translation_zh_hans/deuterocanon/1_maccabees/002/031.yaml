base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: zh_hans
  text: 有人向王的部下和在耶路撒冷——大卫城——的军队报告说，那些因王的命令而四散的人[a]，已下到旷野中的隐蔽处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些违抗王命的人，已经下到旷野中的藏身处去了。”希腊语这一分句表达紧缩，既可理解为众人因王命而四散，也可理解为他们不理会或违抗王命。
    reason: 保留διεσκέδασαν与“王的命令”搭配所产生的两种可能理解。
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: 有人……报告说
  rationale: 希腊语为不定人称式的被动报告用语；汉语用主动式“有人报告说”自然清楚，又不增添报告者身份。
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: 王的手下
  rationale: 保留ἄνδρες所指人员范围的宽泛性，不限定为官员或士兵；“手下”符合现代叙事语体。
- source_word: ταῖς δυνάμεσιν
  choice: 军队
  rationale: 在此军事语境中指武装力量；“军队”是自然且不细分兵种的译法。
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: 驻扎在耶路撒冷——大卫城——的
  rationale: 将“耶路撒冷”与“大卫城”的同位关系保留下来，并以破折号避免误读为两个地点。
- source_word: κατέβησαν
  choice: 已经下到
  rationale: 保留动词“下去、下到”的空间意象；“已经”表明此事先于报告发生。
- source_word: διεσκέδασαν
  choice: 四散
  rationale: 采用该动词通常的“驱散、散开”词义；因它与“王的命令”构成的希腊语表达较压缩，正文以“因……而四散”使句意可懂，同时用脚注保留另一种理解。
- source_word: τὴν ἐντολὴν τοῦ βασιλέως
  choice: 王的命令
  rationale: ἐντολή直指命令或指令；“命令”准确、通俗。
- source_word: εἰς τοὺς κρυφοὺς
  choice: 到……隐蔽处
  rationale: 该形容词在此作名词使用，指隐藏、隐秘的地点；“隐蔽处”自然且贴近原文。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 旷野中
  rationale: ἔρημος可指荒无人烟之地，不一定是沙漠；“旷野”符合圣经叙事语域。
theological_decisions:
- issue: διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως的理解
  choice: 理解为这些人因王的命令而四散，随后躲入旷野。
  alternative: 理解为这些人违抗或不理会王的命令，随后躲入旷野。
  rationale: διεσκέδασαν通常表示“使分散、四散”，但以“王的命令”为宾语时表达并不寻常，也可能引申为废弃、不理会命令。正文保留动词的常用词义，脚注则明确另一种可能，不消除原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“王的手下”避免把相关人员过度限定为官员或士兵；“旷野”“大卫城”等沿用普通读者熟悉的圣经用语。脚注标记紧跟有歧义的短语，以清楚标明注释范围。
