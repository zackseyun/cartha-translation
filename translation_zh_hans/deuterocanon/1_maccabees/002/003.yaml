- source_word: Σίμων
  choice: 西蒙
  rationale: 这是人名 Simon 的现代汉语常用音译；相较于较旧的“西门”，更符合当代普通读者的语言习惯。
- source_word: ὁ καλούμενος
  choice: 人称
  rationale: 该带冠词的现在时中被动分词作同位修饰，表示此人以另一称号为人所知。“人称”自然简洁，也保留了称号而非另一个普通名字的语感。
- source_word: Θασσίς
  choice: 塔西斯
  rationale: 这是称号或别名，含义不确定，宜按希腊文音译而不臆测其词义；“塔西斯”也保留了词尾的辅音信息。
