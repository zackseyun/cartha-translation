lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 准确表达“大声、响亮地”的意思，也符合现代汉语叙事习惯。
- source_word: ἔθνη
  choice: 各族
  rationale: 这里指王权统治下的各个族群；“各族”比“外邦人”更少加入宗教身份方面的解释，也比“列国”更适合共同处于一个王国境内的语境。
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: 王国境内
  rationale: 希腊语字面近似“王之国的家/领域”，措辞不寻常；正文用自然汉语表达其所指的王权辖境，并以脚注保留原文的特殊结构。
- source_word: ἀκούουσιν αὐτοῦ
  choice: 听从他
  rationale: ἀκούω的基本义是“听”，但此处显然涉及响应王的要求；“听从”既保留听取之意，也自然传达语境所含的顺服意味。
- source_word: ἀποστῆναι
  choice: 离弃
  rationale: 表示从原有的祖传敬拜中转离；“离弃”传达背离之意，而不使用带有后世技术色彩的“叛教”。
- source_word: λατρίας πατέρων αὐτοῦ
  choice: 祖先的敬拜
  rationale: λατρεία在此指宗教性的礼拜或事奉；“敬拜”清楚体现其宗教语境，分配性的单数以汉语复数概念“祖先”表达。
- source_word: ᾑρετίσαντο ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: 选择遵行他的命令
  rationale: 该短语字面结构较生硬，核心意思是选择或偏向王的命令；加入“遵行”使汉语通顺，并与上下文中的实际服从相符，同时不把“命令”宗教化为专指神圣律法的“诫命”。
theological_decisions:
- issue: 如何处理οἴκῳ τῆς βασιλείας τοῦ βασιλέως的不寻常结构
  choice: 正文译作“王国境内”，脚注说明字面结构
  alternative: “王的国之家中”或“王的王国中”
  rationale: 此处不涉及教义定论。完全照搬结构会造成难以理解的现代汉语；正文传达王权辖境，脚注则保留原文确有的措辞异常。
- issue: ἀκούουσιν应强调“听”还是“服从”
  choice: 听从他
  alternative: 听他的话；服从他
  rationale: “听从”保留该动词的听取成分，同时呈现上下文所暗含的顺服；脚注提醒读者原词并非一个单纯直说“服从”的动词。
- issue: λατρεία应译为一般“事奉”还是宗教性的“敬拜”
  choice: 祖先的敬拜
  alternative: 祖先的事奉；祖传的礼拜
  rationale: 上下文谈的是放弃祖传宗教实践，“敬拜”最直接；译文不进一步判定其具体仪式范围或宗派含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留本节未完的条件句形式，因为句意将在下一节继续；引号不在本节闭合。脚注标记分别紧随其实际所解释的“王国境内”和“听从他”，避免标记与注释内容错位。
