  yaml_path: translation/deuterocanon/1_maccabees/002/065.yaml
  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: zh_hans
  text: 看哪，你们的兄弟西缅，我知道他是个有谋略的人。你们要一生听从他；他必作你们的父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意的提示语气，同时采用现代读者仍能理解的庄重表达。
- source_word: Συμεὼν
  choice: 西缅
  rationale: 按希腊文人名 Συμεών 音译，并与常见圣经人名译法保持一致。
- source_word: ἀνὴρ βουλῆς
  choice: 有谋略的人
  rationale: βουλή 在此指谋划、献策与判断的能力；此译法既自然，也不把含义收窄为某一正式职位。
- source_word: αὐτοῦ ἀκούετε
  choice: 听从他
  rationale: 此处的“听”在劝诫语境中含有接受其指导、依从其意见之意。
- source_word: πάσας τὰς ἡμέρας
  choice: 一生
  rationale: 原文直译为“所有的日子”；结合对受话者的劝告，用“一生”自然表达持续终身之意。
- source_word: εἰς πατέρα
  choice: 作……的父亲
  rationale: 保留原文父亲这一关系性比喻，不改译为“领袖”或“顾问”。
theological_decisions:
- issue: “父亲”是亲属身份还是领导性比喻
  choice: 他必作你们的父亲
  alternative: 他必作你们的领袖
  rationale: 原文明确使用 πατέρα（父亲），表达西缅将承担父亲般的指导和照顾角色；保留比喻可避免将其神学和家族性内涵过早解释掉。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“看哪”保留原文强调，“一生听从他”符合现代汉语表达；不添加原文没有的头衔或制度性含义。
