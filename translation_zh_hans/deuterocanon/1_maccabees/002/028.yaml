  text: 他和他的儿子们逃到山里，撇下了他们在城里所有的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: 逃到
  rationale: 该动词表示因危险而逃离；结合目的地短语“εἰς τὰ ὄρη”，译作“逃到山里”自然且准确。
- source_word: εἰς τὰ ὄρη
  choice: 到山里
  rationale: 复数“群山”在现代汉语叙事中自然表达为“山里”，既保留地理方向，也避免生硬。
- source_word: ἐγκατέλιπον
  choice: 撇下了
  rationale: 表达离去时把财物留在原处，不额外强化为主动弃绝或永久放弃。
- source_word: ὅσα εἶχον
  choice: 他们……所有的一切
  rationale: 概括其拥有的全部东西；“他们”按复数动词主语理解为父子众人。
- source_word: ἐν τῇ πόλει
  choice: 在城里
  rationale: 直接保留地点含义，符合现代汉语习惯。
