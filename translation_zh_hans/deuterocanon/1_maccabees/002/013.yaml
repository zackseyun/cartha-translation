lexical_decisions:
- source_word: ἵνα τί
  choice: 为什么
  rationale: 在通用希腊语中，ἵνα τί可作询问原因或目的的惯用表达；“为什么”自然保留了问句的力度。
- source_word: ἡμῖν
  choice: 我们
  rationale: 与ζῇν共同构成“对我们而言活着”的结构；现代汉语以“我们……活”表达更自然。
- source_word: ἔτι
  choice: 还
  rationale: 表示状态的延续，即“仍然、继续”；与“活下去”搭配，传达不愿继续存活的哀叹语气。
- source_word: ζῇν
  choice: 活下去
  rationale: 现在时不定式表示活着或继续生活；“活下去”在现代汉语中简洁自然，也能体现上下文中的延续意味。
