  yaml_path: translation/deuterocanon/1_maccabees/002/056.yaml
  text: Caleb[a], when he testified before the assembly, received the land as an inheritance.
translation:
  language: zh_hans
  text: 迦勒在会众面前作见证时，得了那地为产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在会众面前作见证时”也可译作“在会众中作证时”。
    reason: 希腊文结构可表示时间或伴随情形，且与格 τῇ ἐκκλησίᾳ 可按中文习惯译作“在会众面前”或“在会众中”。
lexical_decisions:
- source_word: Χαλὲβ
  choice: 迦勒
  rationale: 采用现代中文圣经传统中通行的人名译法，清楚对应 Caleb。
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: 作见证时
  rationale: ἐν 加冠词不定式可表达时间或伴随情形；此处译为“……时”，自然保留“见证、证言”的语义。
- source_word: τῇ ἐκκλησίᾳ
  choice: 在会众面前
  rationale: 此处指以色列聚集的群体，并非后来的基督教“教会”；结合“作见证”，中文以“在会众面前”最自然。
- source_word: ἔλαβε
  choice: 得了
  rationale: 表示获得、领受所分配之物；“得了”简明自然，也适合产业语境。
- source_word: γῆν
  choice: 那地
  rationale: 希腊文虽无冠词，但上下文所指是特定的应许之地；“那地”既明确所指，又不把它泛化为一块土地。
- source_word: κληρονομίαν
  choice: 为产业
  rationale: κληρονομία指承受或分得的产业；“为产业”保留其结果及归属性质，且不额外加入原文没有的“他的”。
theological_decisions:
- issue: 第二圣殿时期历史语境中 ἐκκλησία 的译法
  choice: 会众
  alternative: 集会；教会
  rationale: 这里回指旷野时期聚集的以色列群体。“会众”符合历史语境；“教会”容易造成时代错置。
- issue: 迦勒得地的表达
  choice: 得了那地为产业
  alternative: 承受了那地；取得那地作为产业
  rationale: 原文同时使用“得了”和“产业”两个概念；保留二者可呈现获得与产业身份之间的关系，而不进一步解释其神学机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“会众”避免把前基督教时期的以色列集会误译为“教会”；“产业”为普通中文读者较熟悉的圣经用语。脚注标记置于整句末尾，对应整处措辞的可替代译法。
