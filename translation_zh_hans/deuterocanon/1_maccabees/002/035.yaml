  text: 他们便迅速向他们开战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们赶紧向他们开战”，或“他们迅速攻击他们”。希腊原文十分简练，直译近似“他们加快了针对他们的战争”。
    reason: 说明ἐτάχυναν与πόλεμον构成的压缩表达，并保留“开战”和“攻击”两种合乎语境的译法。
lexical_decisions:
- source_word: ἐτάχυναν
  choice: 赶紧
  rationale: ταχύνω的简单过去时表达迅速采取行动；“赶紧”保留其急速展开行动的意味，又符合现代汉语表达。
- source_word: πόλεμον
  choice: 出兵攻打
  rationale: πόλεμος本义为“战争、争战”；在此压缩句式中作宾语，与动词合起来表示迅速发动军事行动。“出兵攻打”比生硬的“加快战争”自然，同时不把行动限定为某一种具体战术。
- source_word: ἐπʼ αὐτούς
  choice: 攻打他们
  rationale: ἐπί接宾格用于敌对军事行动时，表示“向着、针对”；融入“攻打他们”可自然传达“针对他们”的意思。
