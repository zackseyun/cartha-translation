  text: And seeing the blasphemies being committed in Judah and in Jerusalem,
translation:
  language: zh_hans
  text: 他看见在犹大和耶路撒冷发生的亵渎之事，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδών
  choice: 他看见
  rationale: 这是ὁράω的不定过去时主动分词，在此承接后续言语或行动。译为“他看见”符合现代汉语叙事习惯，同时保留与下文尚未完结的句法联系。
- source_word: βλασφημίας
  choice: 亵渎之事
  rationale: 该复数名词指对上帝或神圣事物的亵渎行为。“亵渎之事”既保留宗教含义和复数所表达的多项行为，也比单用抽象名词“亵渎”更自然。
- source_word: τὰς γινομένας
  choice: 发生的
  rationale: γίνομαι的现在时中间/被动分词修饰“亵渎之事”，表示当时正在出现或进行的事。汉语“发生的”自然且不额外指定行为主体。
- source_word: ἐν Ἰούδᾳ
  choice: 在犹大
  rationale: 此处为地域名称；“犹大”保留希腊文名称所带的传统地域与民族历史色彩，避免采用较偏后期行政区称谓的“犹太地”。
- source_word: ἐν Ἱερουσαλήμ
  choice: 在耶路撒冷
  rationale: 采用该地名在现代中文圣经语境中的通行译法。
theological_decisions:
- issue: βλασφημίας在宗教迫害与圣物受辱语境中的表达
  choice: 亵渎之事
  alternative: 暴行；亵圣行为
  rationale: “亵渎之事”直接保留原词对上帝及神圣事物的冒犯含义，不将其泛化为一般“暴行”，也不收窄为仅针对圣物的“亵圣行为”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文在希腊文中以分词结构引出下文，因此中文以逗号收束，保留句意未完、继续承接下一节内容的特点。
