  to: 他们加入他们的队伍，成为他们的助力[a]。他们又组织起一支队伍，在愤怒中击打罪人，在烈怒中击打不守律法的男子；其余的人便逃往列国求生[b]。
  rationale: 修订避免将“击打”无依据地收窄为“击杀”，并以“男子”保留原文的显性男性称谓。同步调整加入对象和逃亡目的地的表达，使其在现代标准汉语中更清楚自然，同时保留原文对“列国”所指人群或地域的开放性。
