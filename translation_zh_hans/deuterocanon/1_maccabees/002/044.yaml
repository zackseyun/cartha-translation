base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: zh_hans
  text: 他们加入他们的队伍，成为他们的助力[a]。他们又组织起一支队伍，在愤怒中击打罪人，在烈怒中击打不守律法的男子；其余的人便逃往列国求生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们被增添到其中，成为他们的支持。”希腊文采用被动形式，表示这些人被归入该群体。
    reason: lexical_alternative
  - marker: b
    text: “列国”也可译作“外邦人”；这里可能指周围的非犹太民族，也可能连带指其地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: 加入了这些人
  rationale: 该被动形式在这里表示人员归入一个群体；译为“加入”符合现代汉语，也保留了增添、归附的含义。
- source_word: εἰς στήριγμα
  choice: 成为他们的助力
  rationale: στήριγμα指支撑或巩固力量；“助力”自然凝练，又不把本词过度军事化。
- source_word: συνεστήσαντο δύναμιν
  choice: 组织起一支队伍
  rationale: 短语表示集结并组织成有战斗力的力量；“队伍”切合军事语境，但不把δύναμις限定为正式军队。
- source_word: ἐπάταξαν
  choice: 击杀
  rationale: πατάσσω表示猛烈击打，在此战斗语境中很可能含致死之意；“击杀”保留其暴力和致命色彩。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 直接保留原文的道德—宗教评价，不弱化为一般的“犯错者”。
- source_word: ἐν ὀργῇ αὐτῶν
  choice: 在怒气中
  rationale: 保留ἐν的表达方式及ὀργή的愤怒含义，并与下句较强烈的θυμός形成层次。
- source_word: ἄνδρας ἀνόμους
  choice: 不守律法的人
  rationale: ἀνόμους在《马加比一书》的犹太语境中不只是一般违法，也指违背律法；现代汉语用“人”即可自然指涉原文所说的男性群体，避免生硬的“男人”。
- source_word: ἐν θυμῷ αὐτῶν
  choice: 在烈怒中
  rationale: θυμός表达炽烈的怒气；“烈怒”与前面的“怒气”构成平行并有所加强。
- source_word: οἱ λοιποί
  choice: 其余的人
  rationale: 准确表达剩余者，与被击杀的人形成对照。
- source_word: εἰς τὰ ἔθνη
  choice: 到外族那里
  rationale: 在本书语境中，ἔθνη主要指周围非犹太民族，也可连带指其地域；“外族那里”比直译“列国”更自然，同时保留指向上的弹性。
- source_word: σωθῆναι
  choice: 求生
  rationale: 被动不定式在逃亡语境中表示为获得保全、逃过死亡；“求生”自然表达其目的，但不额外说明由谁施救。
theological_decisions:
- issue: 军事叙事中的道德称谓
  choice: 保留“罪人”和“不守律法的人”作为叙述本身的评价性称呼。
  alternative: 译作“恶人和违法者”等较泛化措辞。
  rationale: 希腊文明确以道德和律法范畴描述敌对者；译文应保留这种张力，而不改写成纯政治或军事类别。
- issue: ἄνδρας的性别表达
  choice: 译作“不守律法的人”。
  alternative: 译作“不守律法的男人”或“无法之人”。
  rationale: 原词ἄνδρας确为阳性复数，但现代汉语“人”在此并不主动消除历史所指的男性群体；结合上下文可自然、准确地表达，且避免“男人”在庄重叙事中的突兀感。
- issue: σωθῆναι的被动与求生含义
  choice: 译作“求生”。
  alternative: 译作“得救”或“保全性命”。
  rationale: 此处首先是逃亡求得安全的叙事意义；“求生”避免把该词预先限定为神学性的救恩，同时保留寻求存活的目的。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“加入”“助力”“组织起一支队伍”保持行文自然；保留“罪人”“不守律法的人”等原文的评价性措辞，以及“怒气／烈怒”的平行递进。
