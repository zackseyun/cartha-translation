  language: zh_hans
  text: 他们带着自己的儿子、妻子和牲畜去了，因为临到他们的灾祸已经十分严重。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: 他们
  rationale: 承接上一节的主语；此处虽可译作“他们自己”，但上下文不要求额外强化语气。
- source_word: οἱ υἱοὶ αὐτῶν
  choice: 他们的儿子
  rationale: υἱοί明确指“儿子”，保留原文的性别所指，不泛化为“孩子”。
- source_word: αἱ γυναῖκες αὐτῶν
  choice: 妻子
  rationale: 在家庭成员并列的语境中，γυναῖκες与所属代词连用，宜译为“妻子”，而非泛指“妇女”。
- source_word: τὰ κτήνη αὐτῶν
  choice: 牲畜
  rationale: κτήνη泛指家养或作为财产的动物；“牲畜”在现代汉语中自然且范围适当。
- source_word: ἐσκληρύνθη ἐπʼ αὐτοὺς
  choice: 临到他们的……已经十分严重
  rationale: ἐσκληρύνθη本义与“变硬”有关，在此描述灾祸加于他们而变得严酷、严重；译文传达结果状态，并避免生硬直译。
- source_word: τὰ κακά
  choice: 灾祸
  rationale: 此处指临到人的坏事、患难或灾难；“灾祸”既自然，也保留其负面事件的概括性。
