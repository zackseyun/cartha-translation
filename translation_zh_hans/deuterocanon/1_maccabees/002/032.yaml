base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/032.yaml
  text: And many ran after them[a], and when they caught up with them, they encamped against them and joined battle with them on the Sabbath day.
translation:
  language: zh_hans
  text: 许多人追赶他们；追上他们后，便在他们对面扎营，并在安息日[a]与他们交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译形式为“在安息日们的日子”；这里的复数形式是指单一“安息日”的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  choice: 追赶他们
  rationale: 该短语在这里表示追击。“追赶”符合现代汉语习惯，也保留了希腊文奔跑追随的动态感。
- source_word: πολλοί
  choice: 许多人
  rationale: 直接表达人数众多，简明自然。
- source_word: καταλαβόντες αὐτούς
  choice: 追上以后
  rationale: 追击语境表明 καταλαμβάνω 是“赶上、追上”，不必解释为“抓住”。
- source_word: παρενέβαλον ἐπʼ αὐτούς
  choice: 就在他们对面安营
  rationale: παρεμβάλλω 在军事语境中指扎营；“在他们对面”既表达敌对态势，也避免把它提前译成直接进攻。
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  choice: 与他们交战
  rationale: 此处指展开实际军事冲突。“交战”自然简洁，也比宽泛的“发动战争”更贴合当下场景。
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 在安息日
  rationale: 虽然希腊文形式直译为“在安息日之日”，且 σαββάτων 为复数形式，但这是指安息日的惯用表达；现代汉语以“在安息日”最自然。
theological_decisions:
- issue: 犹太历法用语 σαββάτων 的表达
  choice: 安息日
  alternative: 安息日那一天；众安息日之日
  rationale: 该复数形式受闪语表达习惯影响，在本处指单数的安息日。采用通行的“安息日”，既清楚保留犹太背景，也不赋予复数形式额外神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“追赶—追上—安营—交战”保留原文动作次序；避免文言式“追及”“列营”以及可能过度解释的军事术语。
