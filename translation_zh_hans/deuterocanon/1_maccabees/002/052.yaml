  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
translation:
  language: zh_hans
  text: 亚伯拉罕不是在试炼[a][b]中显为忠信，并且这也算作他的义吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在考验中”。希腊语也可指“诱惑”，但这里所说的是亚伯拉罕受试炼。
    reason: lexical_alternative
  - marker: b
    text: 这里呼应《创世记》15:6，并将该处经文与亚伯拉罕受试炼联系起来。
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραάμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中该族长的标准译名。
- source_word: πειρασμῷ
  choice: 在考验中
  rationale: πειρασμός 可指考验、试炼或诱惑；此处涉及亚伯拉罕受考验，并非受引诱犯罪，因此译作“考验”。
- source_word: εὑρέθη πιστός
  choice: 显为忠信
  rationale: 保留被动结构所表达的结果和评价，即亚伯拉罕经过考验被显明为忠信；“忠信”兼顾可信可靠与持守信实之意。
- source_word: ἐλογίσθη αὐτῷ
  choice: 这就算为他的
  rationale: “算为”保留 λογίζομαι 的归算意味，并呼应《创世记》15:6；句中的“这”承接前一分句，但不进一步界定所指，从而保留原文的张力。
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是 δικαιοσύνη 在亚伯拉罕经文语境中的通行且凝练的中文表达，既自然，也不额外加入后世教义解释。
theological_decisions:
- issue: 亚伯拉罕受考验与被算为义之间的关系
  choice: 直译两个并列分句，以“这”承接前文，不解释其确切所指或事件次序。
  alternative: 明确解释为亚伯拉罕在考验中表现出的信心被算为义，或将《创世记》15章与22章调和为一个时间顺序明确的陈述。
  rationale: 希腊文以反问句把受考验而显为忠信与算为义相联，却没有说明二者如何在时间和因果上衔接；译文应保留这一神学张力。
- issue: δικαιοσύνη 的译法
  choice: 义
  alternative: 公义；正义
  rationale: 此处呼应《创世记》15:6，“义”最能保留其关系性和归算语境；“正义”容易偏向社会或司法意义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“显为忠信”略带经文语体，但普通读者可以理解；保留反问形式及两个分句之间未被解释的关联。
