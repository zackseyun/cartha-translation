  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: zh_hans
  text: 犹大·马加比自己，自幼就大有力量[a]；他要作你们的军队统帅，你们要与列国争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本直译近似“从他、从他幼年起大有力量”；其中“从他”的措辞突兀而难解。正文按上下文所显示的意思译为犹大自幼就大有力量。
    reason: 原文措辞疑难
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: 犹大·马加比
  rationale: 采用现代中文中通行且易辨认的人名和称号音译；定冠词所标示的称号关系已由姓名形式自然表达。
- source_word: ἰσχυρὸς δυνάμει
  choice: 大有力量
  rationale: 原文以形容词和同源意义的名词叠加强调强健有力；“大有力量”保留强调，又避免生硬重复。
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: 自幼就
  rationale: 传世希腊文本中的ἐκ αὐτοῦ语意和句法均显突兀；正文按可确定的核心意思表达，即犹大从年幼时便很有力量，并以脚注保留原文疑难。
- source_word: ἄρχοντα στρατιᾶς
  choice: 军队统帅
  rationale: ἄρχων在军事语境中指领军者，στρατιά指军队；“军队统帅”准确、庄重，也符合现代汉语。
- source_word: πολεμήσετε πόλεμον
  choice: 争战
  rationale: 希腊文以同词根的动词与名词构成强调式表达；中文用“争战”自然传达进行战争的意思，不机械复制同源重复。
- source_word: λαῶν
  choice: 列国
  rationale: 这里指与犹太群体敌对的多个外邦民族或国家；“列国”保持集体复数意味，又不直接采用带有较强神学色彩的“外邦人”。
theological_decisions:
- issue: 疑难短语ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ的处理
  choice: 正文译出清楚可辨的意思“自幼就大有力量”，并用脚注说明传世文本的异常措辞。
  alternative: 逐字译作类似“从他、从他幼年起大有力量”，但中文语意不明。
  rationale: 该处原文确有句法疑难，不宜假装文本毫无问题，也不宜让无法理解的逐字表达遮蔽明确的核心信息；正文与脚注并用，兼顾可读性和原文可审查性。
- issue: λαῶν的群体身份
  choice: 译作“列国”。
  alternative: 译作“各民族”或“外邦人”。
  rationale: 上下文是军事和民族冲突。“列国”能表达多个民族共同体，同时避免把该词预先限定为具有特定教义含义的“外邦人”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“本人”保留αὐτός的强调作用；分号呈现先描述犹大、再委任其领军的句法推进。脚注标记[a]已置于相关疑难短语之后。
