base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: zh_hans
  text: 今天他会被高举[a]，却必再也寻不见他，因为他已归回自己的尘土，他的谋算[b]也消亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被高举”也可译作“被抬高”或“显赫起来”；希腊文保留了“举高”的形象，在这里可以指地位或声势上升。
    reason: lexical_alternative
  - marker: b
    text: “谋算”也可译作“思想”“思量”或“计划”。原文是单数。
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: 今天
  rationale: 直接表达当下的时间，保留原句警策、格言式的语气。
- source_word: ἐπαρθήσεται
  choice: 会被高举
  rationale: 保留将来时、被动语态及“举高”的形象；在上下文中也可含地位显赫之意，但不将其限定为受尊崇。
- source_word: οὐ μὴ εὑρεθῇ
  choice: 必再也寻不见他
  rationale: 用“必……再也不”传达 οὐ μή 加虚拟语气所表达的强烈否定，同时符合现代汉语表达。
- source_word: ἐπέστρεψεν
  choice: 已归回
  rationale: 表达已经完成的返回，并保留“归回尘土”的经文意象。
- source_word: εἰς τὸν χοῦν αὐτοῦ
  choice: 归回自己的尘土
  rationale: 按原文保留“他的／自己的尘土”这一不寻常表达及其死亡、归尘的意象，不弱化为泛指的“地里”。
- source_word: διαλογισμὸς
  choice: 谋算
  rationale: 此单数名词可指思想、思量或计划；“谋算”在死亡语境中自然表达一个人的筹划，同时不涉及灵魂是否消灭的问题。
- source_word: ἀπώλετο
  choice: 消亡了
  rationale: 传达 ἀπόλλυμι 的终止、归于无有之意，与人的谋算因死亡而止息的语境相合。
theological_decisions:
- issue: 死亡时 διαλογισμός 消亡所涉及的人论含义
  choice: 译为“他的谋算也消亡了”
  alternative: 他的思想也消亡了／他的思量也归于无有
  rationale: 原文说的是人的思量或谋划消失，并未使用“灵魂”等术语；译文因此不据此断定人的本体或灵魂在死亡时消灭。
- issue: ἐπαρθήσεται 的升高含义
  choice: 译为“会被高举”
  alternative: 会显赫起来／会被抬高
  rationale: “高举”保留原文的空间隐喻及被动形式，也容许它在语境中指地位或声势升高，不把含义收窄为正面的尊荣。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“却”呈现前半句一时升高与后半句彻底消逝之间的强烈反差；“必再也寻不见”保留原文强调否定的力度。所有脚注标记均置于所解释词语之后。
