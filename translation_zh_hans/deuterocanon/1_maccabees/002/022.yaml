  naturalness: “我们绝不听从王的法令而向右或向左偏离我们的敬拜”庄重、通顺，且“而”足以表达服从该法令与偏离敬拜之间的关联，不把原文较紧凑的句法关系过度限定为单一的因果或目的关系。
  terminology: “王的法令”适合此处νόμος所指的王室规定；“听从”适合ἀκούω面对命令的语境；“敬拜”可表达λατρεία的宗教事奉含义。脚注应将“法令”字面说成“律法”明确归于希腊语νόμος，避免似乎是汉语词“法令”本身的字面义。
