  to: 我们绝不听从王的法令[a]而向右或向左偏离我们的敬拜。
  rationale: 修订将否定直接落在“听从王的法令”上，符合希腊原文主句；同时用“而”维持听从王命与偏离既有敬拜之间的紧密关联，而不将其过度解释为单纯因果。脚注则澄清“律法”是原文νόμος的字面义。
