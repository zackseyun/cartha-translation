  yaml_path: translation/deuterocanon/1_maccabees/002/022.yaml
  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
translation:
  language: zh_hans
  text: 我们绝不听从王的法令[a]而向右或向左偏离我们的敬拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王的律法”。希腊语动词可表示“听”或“听从”；此处译作“法令”的希腊语词字面是“律法”。
    reason: 说明ἀκούω与νόμος的词义范围，并保留较直译的可能。
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: 听从
  rationale: 该动词本义是“听”，在以命令或法规为对象时可表示“听从、服从”。“听从”既保留听取的词义色彩，也自然表达实际服从之意。
- source_word: νόμον
  choice: 法令
  rationale: 字面可译“律法”，但此处指王所颁布并强制执行的规定；“法令”在现代汉语中更准确地传达这一具体王命，同时避免与上帝的律法混淆。
- source_word: παρελθεῖν
  choice: 偏离
  rationale: 该不定式在这里表达离开既定敬拜之道；“偏离”既能表达背离，也能与后面的“向右还是向左”保持方向性的比喻。
- source_word: λατρίαν
  choice: 敬拜
  rationale: 此词在语境中指以色列人对上帝的宗教礼仪与事奉。“敬拜”清楚、自然，并保留宗教含义。
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: 无论向右还是向左
  rationale: 保留原文的方向比喻，表示绝不向任何一边偏离；这种表达在现代汉语中自然，也具有经文语体的庄重感。
theological_decisions:
- issue: “王的律法”的所指与效力
  choice: 译作“王的法令”，表明这是王所颁布的强制性规定，与忠于原有敬拜形成冲突。
  alternative: 译作“王的律法”或“王的命令”。
  rationale: “法令”忠实传达王权命令的法律效力，又不暗示它与上帝的律法具有同等地位。
- issue: 听从王命与偏离敬拜之间的关系
  choice: 译作“因听从……而偏离”，表达拒绝服从王命的原因在于这种服从会导致背离敬拜。
  alternative: 译作“我们绝不听从王的法令，偏离我们的敬拜”。
  rationale: 希腊文以不定式 παρελθεῖν 接在拒绝听从之后，二者的确切句法关系略显紧凑；汉语采用“因……而……”清楚呈现语境中的实际关系，但不进一步界定偏离的具体形式。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“绝不”传达 οὐκ 与将来时在宣告中的坚定拒绝；“无论向右还是向左”保留原文的圣经式方向隐喻。
