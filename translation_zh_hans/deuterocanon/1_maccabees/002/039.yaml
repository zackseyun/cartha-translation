  text: And Mattathias and his friends learned of it, and they mourned for them very greatly.
translation:
  language: zh_hans
  text: 玛他提亚和他的朋友们得知了这事，就为他们深深哀悼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: 得知了这事
  rationale: 不定过去时在此表示获悉前文所述事件，而非单纯处于“知道”的状态；“得知了这事”在现代汉语中自然且明确。
- source_word: οἱ φίλοι αὐτοῦ
  choice: 他的朋友们
  rationale: φίλοι 可指朋友或亲近的同伴；直译为“朋友们”既保留原词关系，也符合叙事语境。
- source_word: ἐπένθησαν
  choice: 哀悼
  rationale: 该动词表示因死亡而悲痛、举哀；前文涉及遇害者，因此“哀悼”最贴合语境。
- source_word: ἐπʼ αὐτούς
  choice: 为他们
  rationale: ἐπί 加宾格与哀悼动词连用时，指出哀悼的对象；“为他们”是自然的现代汉语表达。
- source_word: ἕως σφόδρα
  choice: 深深
  rationale: 这一强化表达突出哀痛程度极深；“深深哀悼”自然、庄重，并保留强烈的程度意味。
