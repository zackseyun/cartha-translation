  yaml_path: translation/deuterocanon/1_maccabees/002/068.yaml
  text: Repay the nations with recompense[a], and pay attention to the commands of the law.
translation:
  language: zh_hans
  text: 要向列国施以报偿[a]，并要留心律法的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“要向列国施以报应”。希腊文的动词和宾语同源，直译近似“回报回报”，用以加强语气。
    reason: 说明希腊文同源宾语的强调，并保留ἀνταπόδομα可按上下文理解为“报偿”或“报应”的词义范围。
lexical_decisions:
- source_word: ἀνταποδίδοτε
  choice: 回报
  rationale: 这是复数命令式，表示照对方所行的予以偿还；“回报”简明保留了相应回施的含义，在本段冲突语境中也可承载惩罚性的意味。
- source_word: ἀνταπόδομα
  choice: 报偿
  rationale: 此词与前面的动词同源，构成强调性的同源宾语。“报偿”既保留回施、偿还之意，又不把原文本身可容纳的褒贬范围过早限定为纯粹的“报复”或“惩罚”。
- source_word: τοῖς ἔθνεσιν
  choice: 列国
  rationale: 在本书的民族冲突语境中，指以色列周围的非犹太民族；“列国”兼顾民族和政治群体的含义，避免仅译作“外邦人”而缩窄其国家性语感。
- source_word: προσέχετε
  choice: 留心
  rationale: 该命令式要求认真注意、谨慎看待；“留心”自然简洁，并未直接把它扩释为“遵守”。
- source_word: εἰς προστάγματα
  choice: 命令
  rationale: πρόσταγμα表示所颁下的命令或训令；“命令”清楚易懂，也不额外加入制度化色彩。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 此处指以色列的律法，即妥拉；现代中文圣经语境中的“律法”能明确传达这一特指含义。
theological_decisions:
- issue: τοῖς ἔθνεσιν应译为“列国”还是“外邦人”
  choice: 列国
  alternative: 外邦人；异族
  rationale: 希腊词可指非犹太人，也可指各民族或列国。本节处于民族与军事斗争的语境，“列国”保留其民族—政治含义，同时不否认所指为非犹太群体。
- issue: ἀνταπόδομα应表达为中性的“报偿”还是更强的“报应”
  choice: 报偿
  alternative: 报应；惩罚性的回报
  rationale: 上下文使这项回报明显带有敌对和惩罚色彩，但该名词本身主要表示回施、偿还。采用“报偿”保留原词范围，由语境呈现其严厉性，不在译文中额外强化。
- issue: προσέχετε是否应直接译成遵守律法
  choice: 留心律法的命令
  alternative: 遵守律法的命令
  rationale: “遵守”在语境中可能是实际要求，却比表示注意、专心的προσέχετε更具体。译作“留心”保存原文措辞，不把关注与实行之间的关系提前解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“以报偿回报”略带刻意的重复，用以重现希腊文同源宾语的强调；句末“律法的命令”清楚指向以色列的律法，而不作宗派性扩释。
