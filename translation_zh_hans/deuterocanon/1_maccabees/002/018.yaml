base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: zh_hans
  text: “所以，现在你要先上前来，执行王的命令，正如各国、犹大的首领和留在耶路撒冷的人所做的一样；这样，你和你的家就会列在王的‘朋友’[a]中；你和你的儿子们也必因金银和许多赏赐[b]而得尊荣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”也可译作“王友”；这里的希腊词可能指希腊化王室宫廷中称为“王友”的一类受宠信者和顾问。
    reason: 保留φίλοι既可指普通“朋友”、也可能是宫廷称号的歧义。
  - marker: b
    text: “赏赐”所译的希腊词也可指拨给的利益或委派；这里与金银并列，可能泛指王室另行给予的奖赏。
    reason: 原词ἀποστολαί在此处含义不寻常，不宜把具体奖赏形式说得过死。
lexical_decisions:
- source_word: πρόσελθε πρῶτος
  choice: 你先上前来
  rationale: 既保留“先”的带头意味，也自然表达在公开场合走上前去的动作。
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: 执行王的命令
  rationale: πρόσταγμα指有权威的命令；“执行”准确传达按命令行事。
- source_word: πάντα τὰ ἔθνη
  choice: 各国的人
  rationale: 此处泛指犹大以外的各民族或各国之人；该译法保留广义范围，又符合现代汉语。
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: 犹大的首领
  rationale: ἄρχοντες指掌权者或领导人物；“首领”不把其具体官职说得过死。
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: 留在耶路撒冷的人
  rationale: 保留分词“被留下、仍留在那里”的基本含义，不擅自解释为幸存者。
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: 王的‘亲信’
  rationale: φίλοι既可按普通意义指朋友、亲近者，也可能是希腊化宫廷中的身份称号；“亲信”自然体现君王身边受宠信者的政治语境，引号提示其可能具有称号性质。
- source_word: δοξασθήσεσθε
  choice: 备受尊荣
  rationale: 这里是王所赐的社会地位与荣耀，并非神学意义上的“得荣耀”。
- source_word: ἀποστολαῖς πολλαῖς
  choice: 许多赏赐
  rationale: 该词义域可涉及派送之物、拨给或委任；与金银并列时，语境最可能指王室额外给予的利益或赏赐，同时以脚注保留其宽泛性。
theological_decisions:
- issue: φίλοι是否为宫廷称号
  choice: 正文译作“王的‘亲信’”，并加脚注说明可能是正式称号
  alternative: 王的朋友
  rationale: 经文描述王室官员以地位和财物利诱玛 Mattathias；宫廷身份的意味很可能存在，但希腊文形式本身仍容许普通意义，因此不在正文中绝对化。
- issue: ἔθνη的范围
  choice: 各国的人
  alternative: 外族人；列国
  rationale: 这里的对比带有民族与政治意味，但译成“外族人”可能过度突出宗教界线；“各国的人”较贴近πάντα τὰ ἔθνη的广泛表达。
- issue: 赏赐与尊荣的句法关系
  choice: 译为“得到金银和许多赏赐，备受尊荣”
  alternative: 以金银和许多赏赐得荣耀
  rationale: 希腊文用与格说明尊荣所借助或伴随的奖赏；汉语拆开表达更自然，且不改变王以物质利益加以抬举的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上前来”“执行命令”体现公开顺服王令的压力；“亲信”配合引号及脚注呈现可能的宫廷称号；分号连接地位与财物两层诱因。
