  yaml_path: translation/deuterocanon/1_maccabees/002/034.yaml
  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: zh_hans
  text: 他们说：“我们不出来，也不照王的话去做，去亵渎安息日。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: 出去
  rationale: ἐξέρχομαι的将来时中间形式在此指从藏身之处出来；现代汉语用“出去”自然简洁，也保留原文动作方向在语境中可能呈现为“出来”的空间视角。
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: 照王的话去做
  rationale: 原文直译为“行王的话”。“照王的话去做”既保留ποιέω“做、实行”的词义，也清楚表达执行王命，避免仅译作“服从”而弱化原文措辞。
- source_word: βεβηλῶσαι
  choice: 亵渎
  rationale: 该词指把神圣之物当作凡俗之物。“亵渎”保留宗教与礼仪层面的严重含义，并符合现代汉语圣经语体。
- source_word: ἡμέραν τῶν σαββάτων
  choice: 安息日
  rationale: 形式上是“安息日之日”，其中复数σαββάτων按常见希腊语用法指单数的安息日；汉语以“安息日”表达最自然。
theological_decisions:
- issue: βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων所表达的神圣时间观
  choice: 免得亵渎安息日
  alternative: 去亵渎安息日
  rationale: “亵渎”保存了将神圣之日俗化的礼仪与神学含义。“免得”在汉语中自然说明他们拒绝执行王命所要避免的结果；原文不定式也可理解为与执行王命相关的目的，因此不把句法关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照王的话去做”有意贴近希腊文“做王的话”，同时避免生硬直译；全句维持人物坚定拒绝的语气。
