  yaml_path: translation/deuterocanon/1_maccabees/002/036.yaml
  text: And they did not answer them[a], nor did they hurl a stone at them, nor did they block up the hiding places,
translation:
  language: zh_hans
  text: 他们没有回答那些人，也没有向他们扔一块石头，也没有堵住藏身之处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐蔽之处”或“秘密之处”。希腊文很可能是指藏匿的地点，而不是藏在那里的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 回答
  rationale: 该动词通常表示“回答、回应”；此处直译为“回答”，自然地表达他们面对喊话并未作答。
- source_word: λίθον
  choice: 一块石头
  rationale: 保留希腊文单数形式；现代汉语中“扔一块石头”既自然，也凸显他们毫不反抗。
- source_word: ἐνετίναξαν
  choice: 扔
  rationale: 该词表示用力投掷；结合“一块石头”，“扔”简明自然，并能表达实际攻击行动。
- source_word: ἐνέφραξαν
  choice: 堵住
  rationale: 该动词有封堵、塞住之意；在此表示封住藏身地点或其入口，“堵住”准确且通俗。
- source_word: τοὺς κρυφούς
  choice: 藏身之处
  rationale: 该短语实质上指隐蔽、秘密的地点，语境中是这些人藏匿之处；译为“藏身之处”比“隐秘者”更符合空间含义。
