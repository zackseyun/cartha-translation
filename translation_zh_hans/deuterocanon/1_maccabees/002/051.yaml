  yaml_path: translation/deuterocanon/1_maccabees/002/051.yaml
  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: zh_hans
  text: 要记住我们列祖在他们各自的世代中所行的事，并要领受极大的荣耀和永恒的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“尊荣”或“美名”；原文在这里两次使用同一个词。
    reason: 说明δόξα的词义范围，并交代主文刻意保留原文重复。
lexical_decisions:
- source_word: μνήσθητε
  choice: 要记住
  rationale: 这是带有劝勉语气的命令式；“要记住”自然、明确地表达主动追念之意。
- source_word: τῶν πατέρων ἡμῶν
  choice: 我们列祖
  rationale: πατέρων直指先辈之父；“列祖”保留其男性祖辈措辞和经文语体，又比“我们的父亲们”更符合此处指以色列先辈的语境。
- source_word: ἔργα ἃ ἐποίησαν
  choice: 所行的事
  rationale: 表达列祖实际做出的行为，既贴近ἔργα与ἐποίησαν的组合，也符合现代汉语习惯。
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: 在他们各自的世代中
  rationale: 保留γενεαί的“世代”意象；“各自”说明列祖分别生活、行事于其所属时代，但不把该短语改释为更宽泛的“历代”。
- source_word: δέξασθε
  choice: 要领受
  rationale: δέχομαι的命令式基本义为接受、领受；“领受”保留所得之物并非单纯凭自己夺取的意味，同时不明定授予者。
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  choice: 极大的荣耀和永恒的荣耀
  rationale: 原文两次使用δόξα，故译文也重复“荣耀”，保留修辞强调及“尊荣、声望、荣耀”之间的语义张力。αἰώνιον译为“永恒的”，保持其持续不息的力度。
theological_decisions:
- issue: πατέρων所指的祖辈及其男性形式
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: “列祖”既能自然指以色列的先辈，也较“祖先”更清楚地保留希腊文男性亲属词的经文色彩。
- issue: 两个命令式之间的逻辑关系
  choice: 并要领受
  alternative: 从而获得
  rationale: 希腊文以καί连接“记住”与“领受”两个命令式，并未明确标示结果关系；因此不用“从而”或“就”，避免把隐含关联解释成明确的因果条件。
- issue: 重复出现的δόξα
  choice: 两处均译为“荣耀”
  alternative: 极大的荣耀和永恒的美名
  rationale: 重复同一词更忠实于原文，也保留荣耀究竟偏指尊荣、名望还是更强神学含义的开放性；脚注说明可行语义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“列祖”“领受”保留经文语体，但整句结构简明，普通读者可以直接理解；不增添原文未明说的因果关系或荣耀的授予者。
