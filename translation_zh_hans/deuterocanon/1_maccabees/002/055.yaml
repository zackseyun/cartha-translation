  text: Joshua[a], in fulfilling the word[b], became a judge in Israel.
translation:
  language: zh_hans
  text: 约书亚在成全那话[a]时，在以色列中作了审判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在成全那话时”也可译作“当他成全那话时”或“借着成全那话”。“那话”也可理解为“那命令”、“那应许”或“那件事”。希腊文在此没有明确限定这些含义。
    reason: 保留ἐν τῷ πληρῶσαι的时间性或工具性歧义，以及λόγος的多种可能含义。
lexical_decisions:
- source_word: Ἰησοῦς
  choice: 约书亚
  rationale: 此处处于以色列忠信先辈的历史回顾中，所指是嫩的儿子约书亚；采用现代中文圣经与通行历史称谓“约书亚”，避免与耶稣混淆。
- source_word: ἐν τῷ πληρῶσαι
  choice: 在成全……时
  rationale: ἐν 加带冠词的不定式可表达时间情境，也可能带有方式或凭借的意味。“在……时”中文自然，并在脚注中保留“借着”的可能性。
- source_word: λόγον
  choice: 那话
  rationale: λόγος 语义宽泛，可指话、命令、应许或事情。“那话”保持原文的简洁与未明确性，也暗示一项已有的话语，而不把它限定为某一种解释。
- source_word: ἐγένετο
  choice: 成了
  rationale: 直接表达“成为、成了”的变化或取得身份之意，符合中文叙事表达。
- source_word: κριτὴς
  choice: 一位审判者
  rationale: κριτής 的直接对应是“审判者”。虽然此职分可能兼有治理和带领功能，但译作“领袖”会缩窄并改释原词。
- source_word: ἐν Ἰσραήλ
  choice: 以色列中的
  rationale: 保留 ἐν 的范围或群体内部含义；不译作“治理以色列”，以免加入原文未明说的统治关系。
theological_decisions:
- issue: 约书亚所成全的 λόγος 究竟是什么
  choice: 译为较宽泛的“那话”
  alternative: “那命令”、“那应许”或“那件事”
  rationale: 希腊文 λόγος 本身没有明确限定其为神的命令、应许或某件事情。采用宽泛表达可保留经文的神学与叙事张力，不替读者决定具体所指。
- issue: ἐν τῷ πληρῶσαι 所表达的关系
  choice: 正文采用时间性较自然的“在……时”，脚注保留工具性解释
  alternative: “借着成全那话”
  rationale: 该希腊结构既可按时间理解，也可带有方式或凭借意味；正文须自然可读，同时不应隐去另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“成全那话”略带经文语体，但仍属自然表达；“审判者”准确保留古代以色列职分名称。
