  yaml_path: translation/deuterocanon/1_maccabees/002/061.yaml
  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: zh_hans
  text: 所以，你们要一代一代地思想[a]：凡仰望他的人，都不会软弱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“明白”或“铭记在心”。
    reason: lexical_alternative
  - marker: b
    text: 或译“不会变得软弱”；这里也可宽泛地理解为“不会失败”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: 要思想
  rationale: 这是复数第二人称不定过去时命令式，表达劝勉众人认真思索、领会。译作“要思想”既保留命令语气，也避免把其含义限定为单纯的理性理解。
- source_word: κατὰ γενεὰν
  choice: 历世历代的事
  rationale: 该短语按一代一代的范围来回顾历史。结合上下文列举先祖事迹，译作“历世历代的事”自然地表达跨越各代的历史视野；“的事”是汉语表达所需的轻度补足。
- source_word: ἐλπίζοντες
  choice: 仰望
  rationale: ἐλπίζω表示怀着盼望而倚靠。中文圣经语境中的“仰望”兼具盼望与信赖之意，同时保持简洁庄重。
- source_word: ἐπʼ αὐτόν
  choice: 他
  rationale: 介词短语与ἐλπίζω连用，表示盼望所指向、所倚靠的对象。上下文所指是上帝，但正文保留希腊文的代词“他”，不将其明说。
- source_word: ἀσθενήσουσιν
  choice: 不会软弱
  rationale: 该动词的基本意义是“软弱、无力”。“不会软弱”直接保留其状态性含义，而不贸然强化为必然“不会失败”。
theological_decisions:
- issue: 代词αὐτόν（“他”）的所指
  choice: 正文保留“他”，由上下文理解为上帝
  alternative: 直接译作“上帝”
  rationale: 上下文清楚指向上帝，但希腊文在本节使用代词。保留代词既忠于原文形式，也让读者从上下文辨明所指。
- issue: ἀσθενήσουσιν所表达的结果
  choice: 不会软弱
  alternative: 不会失败
  rationale: “失败”可表达语境中的较广结果，却比动词本身的“软弱、无力”更强。正文采用较直接的译法，并在脚注说明宽泛理解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“历世历代的事”顺应本段回顾以色列先祖历史的语境；冒号自然承接ὅτι引出的内容。所有脚注标记均置于正文相应词语之后。
