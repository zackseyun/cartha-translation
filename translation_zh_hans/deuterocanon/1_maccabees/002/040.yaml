base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: zh_hans
  text: 其中一人对身旁的人说：“如果我们都像我们的弟兄那样行，又不为自己的性命和权利[b]与列国[a]争战，他们很快就会将我们从这地上灭绝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外邦人”。该词字面可指“列国”或“万民”；在这里可能特指与犹太人敌对的非犹太族群或势力。
    reason: 保留τὰ ἔθνη的字面范围及其在犹太语境中可能具有的特定指向。
  - marker: b
    text: 或译“法规”“规条”或“合法主张”。原文可指既定的法律规范、权利或合法权益。
    reason: 保留δικαιωμάτων在法律规范与法定权利之间的语义范围。
lexical_decisions:
- source_word: ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
  choice: 有人对身边的人说
  rationale: 按希腊语保留一人向近旁同伴发言的场景；“身边的人”比现代汉语中可能带居住关系色彩的“邻舍”更贴合此处群体内部的语境。
- source_word: ἀδελφοὶ
  choice: 弟兄
  rationale: 阳性复数在上下文中指先前遭杀害的犹太同胞；“弟兄”既保留亲族式称呼，也符合庄重叙事语体。
- source_word: πολεμήσωμεν
  choice: 争战
  rationale: 该动词在此明确指武装抵抗；“争战”保留军事含义，并适合经文叙事的庄重语域。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 本处与“我们的弟兄”形成对照，所指是敌对的非犹太族群，而非抽象意义上的各国；脚注保留较直译的“列国”。
- source_word: ψυχῆς
  choice: 性命
  rationale: 在“为……而战”的结构中指维系生命，并非抽象的灵魂；集合性的单数在汉语中自然译作“自己的性命”。
- source_word: δικαιωμάτων
  choice: 律例
  rationale: δικαίωμα可指确立的法规、规条或合法权利。安息日及祖传律法受到威胁的上下文使“律例”更贴切，同时以脚注保留“权利、合法权益”的可能。
- source_word: νῦν τάχιον
  choice: 很快就会
  rationale: νῦν与比较级副词在此共同表达迫近的后果；“很快就会”自然传达紧迫性，不生硬直译为“现在更快地”。
- source_word: ὀλεθρεύσουσιν ἀπὸ τῆς γῆς
  choice: 把我们从这片土地上灭绝
  rationale: ὀλεθρεύω表达彻底毁灭；γῆ在这里是他们所居之地，不必扩大为整个地球。“这片土地”明确表达当地疆土而不额外指定专名。
theological_decisions:
- issue: τὰ ἔθνη在犹太抵抗语境中的所指
  choice: 外族人
  alternative: 列国
  rationale: 该词字面可作“列国”，但在此与犹太“弟兄”相对，语境上指非犹太的敌对族群。“外族人”表达这种社会宗教区分，同时不采用带有后世神学色彩较强的专门术语。
- issue: δικαιωμάτων所指的是律例还是权利
  choice: 律例
  alternative: 权利、合法权益
  rationale: 前文直接涉及守安息日，因而“律例”较能呈现群体为祖传法规而战的含义；不过该词也可表示法定权利或合法主张，故不在正文中武断排除，而由脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“争战”“性命”“律例”维持经文语体，但句法按现代普通话组织。引号内保留条件句的紧迫论证；所有脚注标记均紧随相应词语。
