base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/067.yaml
  text: And you[a], gather to yourselves all who practice the law[b], and take vengeance for your people.
translation:
  language: zh_hans
  text: 你们也要把所有遵行律法的人[a]召集到你们这里，并为你们的百姓报仇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“所有行律法的人”，即所有实行、遵守律法的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“为你们的百姓报复一场报复”，以同根词连用来加强“报仇”的命令语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: 召集到你们这里
  rationale: 该动词与介词短语合用，表示把人带到自己一方、使之加入自己的队伍。“召集到你们这里”既自然，也保留了招聚支持者的含义。
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: 所有遵行律法的人
  rationale: ποιητής在这里指实行者、遵行者，而不是制定或创作律法的人。“遵行律法的人”清楚表达实际奉行律法之意。
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: 报仇
  rationale: 原文采用同根动词与名词连用的结构，加强复仇命令的语气。中文正文用简洁有力的“报仇”，并在脚注说明原文的强调结构。
- source_word: τοῦ λαοῦ ὑμῶν
  choice: 为你们的百姓
  rationale: 该属格在此说明复仇所代表或维护的对象；“为你们的百姓”自然表达替百姓雪恨的意思，而不把关系误解为向百姓复仇。
theological_decisions:
- issue: 马加比时代犹太语境中 νόμος 的译法
  choice: 律法
  alternative: 法律；妥拉
  rationale: 在此语境中，νόμος指犹太民族所承受并遵守的神圣律法。“律法”是现代中文圣经语体中清楚而通行的译法；不直接音译为“妥拉”，以免加入原文未明说的专门称谓。
- issue: ἐκδίκησις 所表达的是伸张正义还是复仇
  choice: 报仇
  alternative: 为……伸冤；替……讨还公道
  rationale: 同根词组 ἐκδικήσατε ἐκδίκησιν 在本段武装抵抗的语境中语气强烈，直接指替百姓复仇。“报仇”保留了这种张力，不将其淡化为较抽象的司法性“伸冤”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们也要”承接上下文并体现命令意味；“召集到你们这里”保留招聚到己方的空间和阵营含义。脚注标记均置于所解释的词语之后。
