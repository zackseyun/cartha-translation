  terminology: “玛他提亚”“狂傲”“羞辱”“毁灭”“烈怒”均为适切的现代汉语对应。“烈怒”能够表现ὀργὴ θυμοῦ的强化怒气，且不预设怒气属于上帝或人。脚注b应避免声称中文成语在语法形式上“保留被动”；它实际保留的是已被巩固的结果状态。
