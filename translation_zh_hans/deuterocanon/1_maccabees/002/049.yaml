base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/049.yaml
  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: zh_hans
  text: 玛他提亚离世的日子临近了[a]，他就对儿子们说：“如今，狂傲和羞辱已经根深蒂固[b]；正是毁灭和烈怒的时刻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“玛他提亚死去的日子临近了。”
    reason: 说明希腊文独特的时间表达，同时正文采用自然、庄重的现代汉语。
  - marker: b
    text: “根深蒂固”也可译作“已经坚立”或“已经强盛”；希腊文的被动式强调狂傲和羞辱已被巩固，形成牢固的局面。
    reason: 交代ἐστηρίχθη的被动及其结果性语义，并保留可行的替代译法。
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι τοῦ Ματταθίου ἀποθανεῖν
  choice: 玛他提亚离世的日子临近了
  rationale: 保留希腊文以“日子临近”表达死亡将至的时间意象；“离世”庄重自然，清楚传达ἀποθανεῖν。
- source_word: ἐστηρίχθη
  choice: 已经根深蒂固
  rationale: 该不定过去时被动式表示被坚立、巩固后的状态；与“狂傲和羞辱”搭配时，“根深蒂固”自然地体现恶势力已经牢固确立。
- source_word: ὑπερηφανία
  choice: 狂傲
  rationale: 表达高傲、跋扈的负面道德含义，比中性的“骄傲”更符合语境。
- source_word: ἔλεγμος
  choice: 羞辱
  rationale: 此词可指责斥、羞耻或受辱；在描述整体危局的抽象并列结构中，“羞辱”较自然，也保留公共蒙羞的意味。
- source_word: καιρὸς καταστροφῆς
  choice: 毁灭的时刻
  rationale: καιρός指具有决定性的特定时刻，καταστροφή指倾覆、毁灭；此译紧贴原文且符合现代汉语。
- source_word: ὀργὴ θυμοῦ
  choice: 烈怒
  rationale: 原文叠用两个表示愤怒的词，以属格结构加强语气；“烈怒”简洁自然地传达强烈、炽盛的怒气。
theological_decisions:
- issue: “烈怒”的主体
  choice: 不明说是谁的烈怒
  alternative: 明确译作“上帝的烈怒”或“迫害者的暴怒”
  rationale: 希腊文只有ὀργὴ θυμοῦ，并未指出怒气属于谁；译文保留这一神学与叙事上的开放性。
- issue: 危机陈述的性质
  choice: 将其译为对当下道德与政治危局的概括
  alternative: 将其解释为对神圣审判的明确宣告
  rationale: 原文列举狂傲、羞辱、毁灭和烈怒，却没有显明限定为神的审判，因此不额外加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“离世的日子临近”保留原文意象；“根深蒂固”以自然汉语表现抽象恶势力已被巩固；末句用两个平行的“时刻”增强宣告感，并避免为“烈怒”补出原文未说明的主体。
