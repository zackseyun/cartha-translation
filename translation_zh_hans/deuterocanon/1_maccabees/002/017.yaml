  yaml_path: translation/deuterocanon/1_maccabees/002/017.yaml
  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: zh_hans
  text: 王派来的人[a]回答玛他提雅说：“在这城中，你是一位首领，受人敬重，地位显赫，又有儿子和弟兄支持[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“从王那里来的人”；即王的代表或使者。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“并因儿子和弟兄而根基稳固”。希腊文既可强调家人的支持，也可强调他凭借家族而有稳固的地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: 王那里来的人
  rationale: 较贴近希腊文“从王那里的人”，同时在上下文中自然指王的代表或使者；以脚注说明其功能含义。
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν ... λέγοντες
  choice: 回答……说
  rationale: 希腊文连续使用“回答、说、说道”的叙事套语。中文以“回答……说”保留回应与发言两层意思，同时避免不自然的重复。
- source_word: Ἄρχων
  choice: 首领
  rationale: 表示在当地具有权威和显要身份的人；“首领”既保留权威含义，也比“统治者”更符合此处城中名望人士的语境。
- source_word: ἔνδοξος
  choice: 德高望重
  rationale: 此处侧重社会声望和受人尊敬，而非字面上的“荣耀”；该表达符合中文尊称语体。
- source_word: μέγας
  choice: 地位显赫
  rationale: 此处的“伟大”主要指社会地位和影响力；译作“地位显赫”能与前面的声望相区分。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: 在这城里
  rationale: 直接保留 πόλις 的通常含义及指示语气。
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: 有儿子和弟兄作你的后盾
  rationale: 分词可表示因家族成员而得到支持、站稳地位；此译自然呈现其最可能的语境义，同时脚注保留“根基稳固”的可能理解。
