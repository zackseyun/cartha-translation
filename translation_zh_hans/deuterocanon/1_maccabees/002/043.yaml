lexical_decisions:
- source_word: πάντες
  choice: 所有……的人
  rationale: 该词与冠词及分词连用，整体指这一类人中的全体；用“所有……的人”自然表达其概括性。
- source_word: οἱ φυγαδεύοντες
  choice: 逃避……的人
  rationale: 带冠词的现在分词在此作名词用，表示正在逃离或躲避的人；“逃避……的人”保留其行动过程，也不把他们定性为罪犯式的“逃犯”。
- source_word: ἀπὸ
  choice: 逃避
  rationale: ἀπό表示离开、脱离；在汉语中与φυγαδεύοντες合译为“逃避”，比逐字译出介词更自然。
- source_word: τῶν κακῶν
  choice: 这些恶事
  rationale: 中性复数可指恶行、祸患或压迫性的坏事。“恶事”保留较宽泛的含义；“这些”反映定冠词可能回指上文，但不进一步限定具体所指。
