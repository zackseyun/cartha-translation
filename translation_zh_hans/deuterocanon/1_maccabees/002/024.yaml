  yaml_path: translation/deuterocanon/1_maccabees/002/024.yaml
  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: zh_hans
  text: 玛他提亚看见了，心中便燃起热忱；他内心深处震颤[a]，就照着裁断[b]发出怒气，冲上前去，把那人宰杀在祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的肾脏震颤”，是以身体内部器官表达内心深处剧烈激动或情感的说法。
    reason: cultural_note
  - marker: b
    text: 或译“照着判决”；也可理解为“按照条例所要求的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: 满怀热忱
  rationale: 这里表示因热忱而激愤，并非嫉妒；译文保留“热忱”的主题，同时不把它直接解释为单纯的愤怒。
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: 他的肺腑
  rationale: 原文直译为“他的肾脏”，属于以身体内部器官指深层情感的表达；“肺腑”既保留身体意象，也符合现代汉语的庄重叙事语体。
- source_word: ἀνήνεγκεν θυμόν
  choice: 发出烈怒
  rationale: 保留ἀναφέρω与θυμός所形成的动态意象，不将其弱化为一般的“生气”；“烈怒”也传达此处强烈而迅猛的情绪。
- source_word: κατὰ τὸ κρίμα
  choice: 按着判决
  rationale: κρίμα可指判决、裁断或法定要求；“判决”保留司法色彩，同时不擅自断定具体是神律、条例还是某项宣判。
- source_word: δραμὼν
  choice: 冲上前去
  rationale: 分词表示迅速奔向目标；“冲上前去”在汉语叙事中自然地表现动作的急迫性。
- source_word: ἔσφαξεν
  choice: 宰杀
  rationale: σφάζω常用于屠宰、杀戮，也可能带有献祭语境的回响；“宰杀”保留原文的残酷力度和潜在祭牲色彩。
- source_word: ἐπὶ τὸν βωμόν
  choice: 在祭坛上
  rationale: 明确保留事件发生在祭坛上的震撼性位置，不淡化为较含混的“祭坛旁”。
theological_decisions:
- issue: 是否明确解释热忱、判决与杀戮之间的圣约或律法含义
  choice: 保留“热忱”“判决”“宰杀”等原文用语，不增添对行为正当性的解释
  alternative: 译作“他义愤填膺，依法处死了那人”
  rationale: 原文以热忱和司法性措辞叙述此举，但没有在本句中明说其法理依据或作系统评价；译文应保留这种神学与伦理张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“满怀热忱”保留宗教性热忱主题；“肺腑震颤”保存原文身体意象；“发出烈怒”和“宰杀”维持原句强烈、未经缓和的力度。所有脚注标记均已置于正文相应位置。
