base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/023.yaml
  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
translation:
  language: zh_hans
  text: 他刚说完这些话，就有一个犹太男子[a]当着众人的面走上前来，要照王的命令，在摩得因的祭坛上献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个来自犹太地的男子”。希腊语Ἰουδαῖος既可表示犹太身份，也可表示来自犹太地；这里按上下文更可能指犹太身份。
    reason: 保留Ἰουδαῖος在群体身份与地域来源之间的词义可能。
lexical_decisions:
- source_word: ὡς ἐπαύσατο
  choice: 刚……完，就
  rationale: 表达前一动作结束后，后一动作紧接着发生，符合希腊语短语在此处的时间推进作用，也使现代汉语自然流畅。
- source_word: λαλῶν τοὺς λόγους τούτους
  choice: 说完这些话
  rationale: 准确保留“说这些话”的内容，并与ἐπαύσατο合译为自然的汉语完成结构。
- source_word: προσῆλθεν
  choice: 走上前来
  rationale: 体现此人在公开场合趋近祭坛、进入众人视线的动作，比单纯“来到”更契合叙事情境。
- source_word: ἀνὴρ Ἰουδαῖος
  choice: 一个犹太男子
  rationale: ἀνήρ明确指男性；Ἰουδαῖος在本段主要表示犹太群体身份，但也可能含有犹太地居民之意，因此正文采用自然且较符合语境的“犹太男子”，并以脚注保留另一可能。
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: 当着众人的面
  rationale: 这是表示公开可见的惯用语；此译自然地传达“在所有人眼前”的含义。
- source_word: θυσιάσαι
  choice: 要……献祭
  rationale: 不定式表示此人上前的目的；“献祭”准确保留礼仪和祭祀语义。
- source_word: ἐπὶ τοῦ βωμοῦ
  choice: 在……祭坛上
  rationale: 直接表达献祭发生于祭坛之上，保留原文的空间关系。
- source_word: ἐν Μωδεείμ
  choice: 摩得因
  rationale: 按希腊文Μωδεείμ作中文音译，并采用现代汉语地名表达方式。
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: 照王的命令
  rationale: πρόσταγμα指权威性的命令；“照王的命令”简洁、自然，并清楚表明行动依据。
theological_decisions:
- issue: Ἰουδαῖος所指的身份
  choice: 犹太男子
  alternative: 犹太地男子
  rationale: 上下文强调在王命压力下的群体和宗教身份，因此“犹太男子”最合语境；但该词也可指犹太地区的人，故用脚注保留真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“刚……完，就……”自然呈现紧接发生的动作；“当着众人的面”避免生硬直译，同时保留公开可见的强调。脚注标记已置于相关词语之后。
