  yaml_path: translation/deuterocanon/1_maccabees/002/026.yaml
  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: zh_hans
  text: 他为律法大发热心，正如非尼哈对撒隆的儿子赞布里所做的那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“撒隆的儿子赞布里”；《民数记》25章中同一人物通常称为“撒路的儿子心利”。
    reason: 说明本节希腊文本的人名形式与《民数记》25章中常见的中文姓名形式之间的对应关系。
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: 大发热心
  rationale: 该不定过去时动词在上下文中指强烈而付诸果断行动的热忱；“大发热心”既保留强度，也不把它弱化为单纯的内在感受。
- source_word: τῷ νόμῳ
  choice: 为律法
  rationale: 与 ζηλόω 连用的与格表示热心所指向或所缘的对象；“为律法”自然、简洁，并指向犹太律法。
- source_word: καθὼς
  choice: 正如
  rationale: 明确引出与非尼哈历史行动的类比，并保留原文的修辞力度。
- source_word: ἐποίησεν
  choice: 所做的那样
  rationale: 原词语义宽泛；此处不具体补出杀死、处置等动作，以免超出本句措辞，同时由“对……”表达行动对象。
- source_word: Φινεὲς
  choice: 非尼哈
  rationale: 采用现代中文圣经读者较熟悉的《民数记》人物译名。
- source_word: τῷ Ζαμβρὶ
  choice: 对……心利
  rationale: 形式上是与格，但结合《民数记》第二十五章的典故，此处表示行动针对的对象；“对……所做的”保留关系而不过度明说具体动作。
- source_word: υἱῷ Σαλώμ
  choice: 撒罗的儿子
  rationale: 正文采用该人物在中文《民数记》传统中较常见的姓名形式；脚注交代希腊文本中的音译形式，兼顾源文本与读者识别。
theological_decisions:
- issue: 如何呈现玛他提亚效法非尼哈、以激烈行动表达热心的比较
  choice: 直接保留比较，不淡化，也不补写评价
  alternative: 解释性改写该典故，或为避免暴力意味而弱化“热心”
  rationale: 希腊文明确把他的热心与非尼哈针对心利的行动相提并论。译文应保留这一叙事和神学张力，但不额外断言赞同或谴责。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大发热心”传达行动性的强烈热忱；比较句保留原文宽泛的“做”，不在正文中补出典故里的具体暴力行为。脚注标记置于整句之后，所注内容涉及本句两个姓名。
