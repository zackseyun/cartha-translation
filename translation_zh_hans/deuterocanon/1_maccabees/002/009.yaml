base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: zh_hans
  text: 她那荣耀的器皿被掳去了[a]；她的婴孩在她的街道上被杀[b]，她的青年人则死于仇敌的刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被掳掠带走了。”希腊文强调这些器皿遭强行掳去，作为掳物被带走。
    reason: lexical_alternative
  - marker: b
    text: 本节反复出现的“她”把这座城人格化；结合上下文，所指很可能是耶路撒冷或锡安。
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: 器皿
  rationale: 该词可指器皿、用具或器物；“器皿”保留了这里可能指贵重或神圣器物的含义，又不把原文未明说的圣殿背景写入正文。
- source_word: δόξης
  choice: 荣耀
  rationale: 既保留哀歌体的庄重语气，也保留该词可能具有的神学意味；不单一限定为外在的“华美”或社会性的“尊荣”。
- source_word: αἰχμάλωτα ἀπήχθη
  choice: 被掳走了
  rationale: 自然地表达遭强行带走、成为掳物的被动含义；中文不把无生命的器皿直称为“俘虏”，但脚注保留原文较强的被掳意象。
- source_word: νήπια
  choice: 婴孩
  rationale: 指年幼、尚未成熟的孩子；“婴孩”简洁庄重，符合悲悼语境。
- source_word: ἀπεκτάθη
  choice: 被杀
  rationale: 准确表达杀害之意；现代中文中“被杀”比“被杀戮”更自然，同时仍保持沉重语气。
- source_word: πλατείαις
  choice: 街上
  rationale: 该词可指宽阔街道或城中的开放空间；“街上”自然且不作过度具体化。
- source_word: νεανίσκοι
  choice: 青年人
  rationale: 与前面的婴孩形成清楚的年龄对照，并保持庄重、通行的现代汉语表达。
- source_word: ῥομφαίᾳ
  choice: 刀下
  rationale: 该词指刀剑类兵器；“死于……刀下”是自然的中文哀悼表达，无须在此强调兵器尺寸。
- source_word: ἐχθροῦ
  choice: 仇敌
  rationale: 单数在语境中可作集合性或代表性用法；“仇敌”保持原文的敌对关系和庄重语体。
theological_decisions:
- issue: 本节中阴性所属形式 αὐτῆς 所指为何
  choice: 正文以“她”保留城邑人格化的表达，不直接点明名称。
  alternative: 在正文中明确译为“耶路撒冷”或“锡安”。
  rationale: 希腊文反复使用阴性所属形式，所指须由上下文确定。保留“她”既维持哀歌的诗性，也避免在本节内消除原文保留的指称空间。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体中文。分号保留原文由器皿被掳转向居民遭害的层次；末句补出“死于”，使希腊文省略谓语的并列结构在中文中自然清楚，同时不增添新的施事或神学解释。
