  text: All her glory was taken away; instead of being free[a], she became a servant.
translation:
  language: zh_hans
  text: 她所有的荣光都被夺去；她不再自由，反倒成了奴隶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“自由的”和“奴隶”都用阴性形式，指被拟人化为女性的城；“奴隶”保留了与“自由”相对的受奴役身份。
    reason: 说明原文阴性形式所呈现的城市拟人化，并澄清自由与奴役的词义对照。
lexical_decisions:
- source_word: πᾶς
  choice: 所有的
  rationale: 与单数名词 κόσμος 连用时表示整体、全部；“所有的荣光”自然地保留了总括含义。
- source_word: κόσμος
  choice: 荣光
  rationale: 此处不是“世界”，而是指装饰、华美以及由此体现的尊荣；在哀叹耶路撒冷受辱的语境中，“荣光”兼顾外在华美与尊荣。
- source_word: ἀφηρέθη
  choice: 被夺去了
  rationale: 保留不定过去时被动语态所表达的外力剥夺；“夺去”也契合本节受辱、失去自由的语境。
- source_word: ἀντὶ ἐλευθέρας
  choice: 不再是自由的，反倒
  rationale: ἀντί 表示身份和处境的替换与逆转；该译法用自然汉语明确呈现由自由转为奴役的对照。
- source_word: δούλην
  choice: 奴仆
  rationale: 阴性名词与 ἐλευθέρας 形成“自由—受奴役”的鲜明对照；“奴仆”既保留受辖制、失去自由的核心含义，也符合庄重的现代汉语表达。
theological_decisions:
- issue: δούλην 与 ἐλευθέρας 的身份对照
  choice: 奴仆
  alternative: 奴隶；婢女；仆人
  rationale: 经文重点是从自由身份沦为受辖制身份。“仆人”可能弱化失去自由的含义，“婢女”又会过度突出家内角色；“奴仆”较自然地保留奴役关系，并与被拟人化为女性的城相称。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“她”承接上下文中对城的女性拟人；分号保留原文两分句之间由失去荣光到沦为奴役的递进与逆转。
