  text: And they pursued the sons of arrogance[b][a], and the work prospered in their hands.
translation:
  language: zh_hans
  text: 他们追赶狂傲之子[a]，这事在他们手中进展顺利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“狂傲的人”或“骄傲之子”。希腊文直译为“狂傲之子”。
    reason: lexical_alternative
  - marker: b
    text: 意思是这项行动由他们经手而取得成功；直译为“这事在他们手中顺利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξαν
  choice: 追赶
  rationale: 此处指带有敌意的积极追逐；“追赶”保留动作本身，不额外断定最终是驱逐、迫害还是杀死。
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  choice: 狂傲之子
  rationale: 保留希腊文所承载的闪语式“……之子”表达及其修辞力度；其实际所指是狂傲的人。
- source_word: ὑπερηφανίας
  choice: 狂傲
  rationale: “狂傲”明确表达盛气凌人、应受谴责的骄傲，比可能带有正面含义的“自豪”更贴合原文。
- source_word: κατευωδώθη
  choice: 进展顺利
  rationale: 该被动形式表示事情获得顺利结果；“进展顺利”是自然的现代汉语，同时没有把成功的具体方式说得过满。
- source_word: τὸ ἔργον
  choice: 这事
  rationale: 这里泛指他们正在进行的行动或事业；“这事”在上下文中自然，并保留所指范围的开放性。
- source_word: ἐν χειρὶ αὐτῶν
  choice: 在他们手中
  rationale: 保留原文“在他们手中”的惯用意象，表示事情由他们经手、掌管并在其行动下取得进展。
