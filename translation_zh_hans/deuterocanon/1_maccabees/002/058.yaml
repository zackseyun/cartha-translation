  text: Elijah[a], in his zeal for the law, was taken up into heaven.
translation:
  language: zh_hans
  text: 以利亚为律法大发热心，被接升，仿佛进入天上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“如同进入天上”。希腊文有“如同、仿佛”（ὡς）一词，可能是在描绘或缓和这一说法，而不只是直接说明目的地。
    reason: 保留ὡς所带来的真实歧义，并交代较直译的表达。
lexical_decisions:
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代汉语中广为人知的圣经人名译法。
- source_word: ἐν τῷ ζηλῶσαι ζῆλον νόμου
  choice: 热心维护律法
  rationale: ἐν加冠词不定式表示当时的情形或处境；ζηλῶσαι ζῆλον以同源宾语加强“热心”的语气。汉语用“热心维护”自然传达这种强烈投入，同时不把该结构明确解释为因果关系。νόμου在本书语境中指犹太律法。
- source_word: ἀνελήμφθη
  choice: 被接升
  rationale: 保留动词的被动形式及向上而去的含义，又避免补明未明说的施事者。
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: 仿佛进入天上
  rationale: 明确呈现ὡς的比较或表象意味，不将其省略为单纯、确定的目的地陈述。
theological_decisions:
- issue: 以利亚被接升的表述中是否明确译出ὡς
  choice: 译作“仿佛进入天上”
  alternative: 译作“进入天上”或“升到天上”
  rationale: 原文在εἰς τὸν οὐρανόν之前有ὡς。正文保留其比较性语气，以免把原文含蓄的措辞处理成毫无限定的目的地陈述；脚注同时说明此处也可能只是修饰、描绘被接升的情景。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“热心维护律法”避免生硬复制希腊文同源宾语；“被接升”保留被动和上升意象；“仿佛进入天上”则保留原文ὡς造成的神学张力。
