  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: zh_hans
  text: 百姓听见这些话，就说：“我们该拿什么来报答西门和他的儿子们呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们该怎样向西门和他的儿子们表示感谢呢？”希腊文 χάρις 可指恩惠、感谢或感激；与“报答”连用时含有回报之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: 听见……就
  rationale: 以现代汉语常用的“……就……”结构表达希腊文的时间背景和随后反应；不必另行实译语气轻微的 δέ。
- source_word: ὁ δῆμος
  choice: 百姓
  rationale: 此处指作为整体作出回应的民众；“百姓”自然庄重，也不把它限定为正式议会。
- source_word: τῶν λόγων τούτων
  choice: 这些话
  rationale: 直接保留 λόγοι 对前文言辞的指称。
- source_word: Τίνα χάριν ἀποδώσομεν
  choice: 我们该拿什么来报答
  rationale: ἀποδώσομεν 是将来时，在问句中带商议意味；χάρις 与之连用，表示因所受恩惠而作出的回报。汉语“拿什么来报答”自然表达回报的内容与方式，同时保留问题的开放性。
- source_word: Σίμωνι
  choice: 西门
  rationale: 采用中文圣经传统中对 Σίμων 的通行译名。
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: 他的儿子们
  rationale: υἱοί 明确指复数的儿子，故不泛化为“儿女”或“孩子”。
