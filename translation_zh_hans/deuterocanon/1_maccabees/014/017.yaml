  text: But when they heard that Simon his brother had become high priest in his place and was ruling over the country and the cities in it,
translation:
  language: zh_hans
  text: 但他们听说他的兄弟西门已经接替他担任大祭司，并掌管着那片土地和其中的各城，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: 但他们听说
  rationale: ὡς与不定过去时在此引出时间情境，δέ表示轻微转折或叙事推进；结合本节作为未完句的结构，译为“但他们听说”自然承接上下文。
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: 他的兄弟西门
  rationale: 同位语说明西门与前述人物的关系；汉语采用“他的兄弟西门”清楚自然。
- source_word: γέγονεν
  choice: 已经……作了
  rationale: 完成时表达先前发生且结果持续的状态；“已经……作了”表明西门就任在获悉之前，且当时仍任此职。
- source_word: ἀντ' αὐτοῦ
  choice: 接替他
  rationale: ἀντί在此表示职位上的替代或继任；“接替他”比直译“代替他”更符合官职承继语境。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该犹太宗教职分在现代汉语圣经语境中的标准、清楚译法。
- source_word: ἐπικρατεῖ
  choice: 掌管着
  rationale: 该词可表示占有控制权、掌权或统治；“掌管着”既表达持续的实际权力，也不额外限定其权力的法律或军事性质。
- source_word: τῆς χώρας
  choice: 那片土地
  rationale: χώρα在此指包含若干城邑的地域；“那片土地”保留地域含义，并与后面的各城形成自然搭配。
- source_word: τῶν πόλεων τῶν ἐν αὐτῇ
  choice: 其中的各城
  rationale: 忠实表达这些城位于上述地域之内；“各城”简洁而符合历史叙事文体。
theological_decisions:
- issue: ἐπικρατεῖ所表达的政治权力性质
  choice: 掌管着
  alternative: 统治着；控制着
  rationale: 上下文涉及西门对土地与各城的实际权威。“掌管着”保留政治与行政层面的宽泛含义，不把该权威过度解释为纯军事控制，也不引入后来的神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语言。保留原文句末逗号所显示的从属结构，因为本节语意延续至下一节；不为使本节独立成句而补入原文没有的主句内容。
