  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: zh_hans
  text: 他使犹太男子在那里定居，并加固那里，以保障该地区和这城的安全；又加高耶路撒冷的城墙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: 让……住在那里
  rationale: 该动词有使人定居、安置为居民的使役含义；此译自然体现使役关系，又不引入“殖民”等原文未必包含的现代政治色彩。
- source_word: ἄνδρας Ἰουδαίους
  choice: 一些犹太男子
  rationale: ἄνδρας明确指男性，译作“男子”保留这一信息；Ἰουδαίους在此采用自然的族群—宗教称谓“犹太”。希腊文无不定冠词，中文补“一些”以使句子通顺，不表示特定人数。
- source_word: ὠχύρωσεν αὐτήν
  choice: 加固了那地方
  rationale: 动词表示设防、加固；代词阴性单数回指上文所述地点。中文用“那地方”明确回指，避免单独使用“它”显得生硬。
- source_word: πρὸς ἀσφάλειαν
  choice: 以保障……的安全
  rationale: πρός加宾格在此表达目的；“以保障……的安全”符合军事防卫语境，也自然传达目的关系。
- source_word: τῆς χώρας
  choice: 这地区
  rationale: χώρα可指领土、地区或乡野；这里与“城”并列，指较广范围的周边地域。“地区”比现代国家意义较强的“国家”更稳妥。
- source_word: τῆς πόλεως
  choice: 城
  rationale: πόλις在此意为城；上下文可能特指耶路撒冷，但本节直到后半句才明说耶路撒冷，因此不在前半句擅自补明。
- source_word: ὕψωσεν
  choice: 加高了
  rationale: 该词表示使之更高；用于城墙时，“加高”准确保留提升高度的动作，不把它解释成完全重建。
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: 耶路撒冷的城墙
  rationale: 直接而自然地表达属格关系；中文“城墙”通常用集合性单数即可对应希腊文复数 τὰ τείχη。
