  text: 'At Saramel[a], in a great assembly of the priests and the people and the leaders of the nation and the elders of the country[b], it was made known to us:'
translation:
  language: zh_hans
  text: 在撒拉默[a]，祭司、民众、民族领袖和当地长老举行盛大集会时，向我们宣布如下[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒拉默”为地名音译。希腊语介词在这里表示事件发生于此地，也可译为“于撒拉默”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“有如下事项为我们所知”或“我们得知如下事项”。原文采用被动表达，没有说明宣布者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Σαραμέλ
  choice: 在撒拉默
  rationale: ἐν加地名表示事件发生的地点；现代汉语用“在”自然涵盖希腊语可表达的“在……里面／于……地点”之意。地名按音译处理。
- source_word: ἐπὶ συναγωγῆς μεγάλης
  choice: 举行盛大集会时
  rationale: συναγωγή在此指公众集会，并非作为建筑物或制度名称的“会堂”；ἐπί与属格在此交代场合，“……时”能自然连接全句。μεγάλη译为“盛大”，兼顾规模和正式庄重的语气。
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  choice: 祭司、民众、民族首领和本地长老
  rationale: 保留四个并列群体。ἄρχοντες采用现代且不过度限定官职性质的“首领”；ἔθνος在犹太民族语境中译为“民族”；χώρα表示相关地域，结合长老译作“本地”较为自然。
- source_word: ἐγνώσθη ἡμῖν
  choice: 以下事项向我们公布了
  rationale: 保留不定过去时被动式所呈现的正式宣告语气，并用“以下事项”顺畅引出后文；不擅自补出公布者。
theological_decisions: []
translation_notes:
