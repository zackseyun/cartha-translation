base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: zh_hans
  text: 因为境内屡次发生战争，玛他提雅的儿子西满——约雅立后裔中的一员——和他的弟兄们甘冒危险，挺身抵抗本民族的仇敌，为要使他们的圣所[a]和律法得以存立；他们为自己的民族带来极大的荣耀。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”原文为复数，也可译作“圣物”或“圣地”，可统指圣殿及其神圣范围。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们以极大的荣耀荣耀了自己的民族”；这里按现代汉语译作“为自己的民族带来极大的荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: 因为境内屡次发生战争
  rationale: ἐπεί在这里引出缘由；“境内”自然表达χώρᾳ所指的本土疆域，“屡次发生战争”准确传达战争反复出现。
- source_word: Σίμων δὲ ὁ υἱὸς Ματταθίου ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: 玛 Mattathias 的儿子、西满——约雅立后裔中的一员——
  rationale: 保留人物的父子关系及约雅立宗族归属；ὁ υἱὸς τῶν υἱῶν是闪语式族谱表达，译作“后裔中的一员”比逐字译法自然。
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: 甘冒危险
  rationale: 希腊语直指主动把自己置于危险之中；“甘冒”兼顾自愿性与现代汉语的自然表达。
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις τοῦ ἔθνους αὐτῶν
  choice: 挺身抵抗本民族的仇敌
  rationale: “挺身抵抗”保留ἀντέστησαν具体而有力的抗争意象；ὑπεναντίοις在战争语境中可自然译为“仇敌”。
- source_word: ὅπως σταθῇ
  choice: 为要使……得以存立
  rationale: 既保留“站立、确立”的意象，也传达圣所与律法得以维持、延续的含义。
- source_word: τὰ ἅγια αὐτῶν
  choice: 他们的圣所
  rationale: 中性复数可指圣物、圣地或圣所范围；此处与律法并列且处于护卫宗教制度的语境，“圣所”最贴切，同时用脚注保留复数形式的开放性。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 此处特指犹太民族的律法传统；“律法”在现代中文圣经语体中清楚而庄重。
- source_word: δόξῃ μεγάλῃ ἐδόξασαν τὸ ἔθνος αὐτῶν
  choice: 他们使自己的民族大得荣耀
  rationale: 以自然汉语保留δόξα与δοξάζω的同根强调，表达使民族获得极大尊荣。
theological_decisions:
- issue: ἔθνος在犹太群体语境中的译法
  choice: 民族
  alternative: 人民
  rationale: 本节具有公共纪念和政治共同体语境，“民族”保留其群体及国家性维度，又不引入现代民族主义含义。
- issue: τὰ ἅγια αὐτῶν所指范围
  choice: 他们的圣所
  alternative: 他们的圣物／他们的圣地
  rationale: 上下文较可能指圣殿及其神圣范围，但希腊语为复数，可能涵盖圣物或诸圣区，因此正文采用语境上最明晰的“圣所”，脚注说明歧义。
- issue: ὅπως σταθῇ所表达的目的
  choice: 得以存立
  alternative: 得以确立／屹立不倒
  rationale: “存立”不把意义限于初次建立，也不额外强化为永不动摇，保留维持、稳立和延续之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事兼碑铭语体。“甘冒危险”“挺身抵抗”体现行动力度；“得以存立”“大得荣耀”保留原文较正式的修辞。人物名按通行中文次经形式处理，但需在出版流程中统一专名拼写。
