  text: ἐπεὶ πολλάκις ἐγενήθησαν πό- λεμοι ἐν τῇ χώρᾳ, Σίμων δὲ ὁ υἱὸς Ματταθίου ὁ υἱὸς τῶν υἱῶν Ἰωαρὶβ καὶ οἱ ἀδελφοὶ αὐτοῦ ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ, καὶ ἀντέστησαν τοῖς ὑπεναντίοις τοῦ ἔθνους αὐτῶν, ὅπως σταθῇ τὰ ἅγια αὐτῶν καὶ ὁ νόμος, καὶ δόξῃ μεγάλῃ ἐδόξασαν τὸ ἔθνος αὐτῶν.
