base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: zh_hans
  text: 人民看出西门的忠信[a]，也看出他立志要为自己的民族带来荣耀，于是立他作他们的领袖和大祭司；因为他做了这一切，也因为他为自己的民族始终持守公义[b]和忠信，并且千方百计要提升自己人民的地位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信”也可译作“忠诚”或“信实”；希腊语 πίστις 在这里着重西门表现出的可靠和忠贞。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”；希腊语 δικαιοσύνη 在这里可能带有公共治理和伦理行为方面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν / πίστιν
  choice: 忠信
  rationale: 本节两次使用 πίστις，语境着重西门以实际行动表现出的可靠、忠诚与守信。“忠信”既符合历史政治语境，也保留该词所含的品格意味。
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα 在此可指民族所得的尊荣、声望或显赫地位；“荣耀”保留其较宽的语义范围和庄重语体。
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: 立志要……带来
  rationale: βουλεύομαι 的中间语态表达经过考虑的意图或决心；此译自然地传达西门有意促成此事。
- source_word: ἔθνει
  choice: 民族
  rationale: 这里指西门所属的民族共同体，而非与犹太人相对的外邦人；“民族”适合本节的政治和群体语境。
- source_word: ἔθεντο
  choice: 立……作
  rationale: 此处表示正式确立其职位；“立他作”简洁、庄重，并能表达任命或拥立之意。
- source_word: ἡγούμενον
  choice: 领袖
  rationale: 该词泛指带领或治理者；“领袖”避免将其过度限定为某一种具体官职。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是犹太祭司制度语境中 ἀρχιερεύς 的通行译法。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 该词可涵盖正直、公正和合宜的行为；“公义”保留其伦理含义，脚注注明本节政治语境中“公正”的可能性。
- source_word: συνετήρησεν τῷ ἔθνει αὐτοῦ
  choice: 始终以……对待自己的民族
  rationale: συντηρέω 含持续保持、维护之意。结合与格 τῷ ἔθνει，此译自然表达西门一直在与本民族的关系中保持公义和忠信。
- source_word: ἐζήτησεν παντὶ τρόπῳ
  choice: 千方百计
  rationale: 这一现代汉语成语准确传达“用一切方式努力寻求”的周全和迫切，且不失庄重。
- source_word: ὑψῶσαι τὸν λαὸν αὐτοῦ
  choice: 提升自己人民的地位
  rationale: ὑψόω 在这里主要指提高人民的声望、尊荣或政治地位；补出“地位”能避免误解为身体上的举高。
theological_decisions:
- issue: πίστις 在对西门品格和政治行为的赞许中如何理解
  choice: 忠信
  alternative: 信心；忠诚
  rationale: 上下文强调西门已经做成的事以及他对民族持续可靠的态度，因此“忠信”比单纯的“信心”更贴合；同时该译仍保留 πίστις 所具有的信实与可信含义。
- issue: δικαιοσύνη 在历史政治语境中的含义
  choice: 公义
  alternative: 公正
  rationale: “公义”可涵盖西门正直合宜的作为，但该词在公共治理语境中也可能侧重公平正义，故以脚注保留“公正”这一译法。
- issue: ὑψόω 是否带有宗教性的“高举”含义
  choice: 提升……地位
  alternative: 高举
  rationale: 直接宾语是“他的人民”，上下文谈民族荣耀和公共领导，主要是提高民族地位；不把它解释为特定的神学性高举。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“立他作”保留正式拥立的意味；“千方百计”使 παντὶ τρόπῳ 的全面努力自然呈现。以“民族”对应 ἔθνος，以“人民”对应 λαός，尽量保留原文的词汇区分。
