  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: zh_hans
  text: 西门接受了，并同意担任大祭司，作犹太人[a]和祭司的统帅、民族领袖[b]，统领他们众人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地人”；希腊词既可指族群，也可带有地域含义。
    reason: lexical_alternative
  - marker: b
    text: “民族领袖”译自一个历史政治头衔，指一个民族或族群的统治者或领袖；其具体权力范围因历史处境而异。
    reason: cultural_note
  - marker: c
    text: 也可译作“居于他们众人之上”或“负责他们全体”。“他们众人”指前文的犹太人和祭司。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: 接受了
  rationale: 希腊文未明说宾语，所接受的是上文所述的任命或安排；中文可自然保留这种省略。
- source_word: εὐδόκησεν
  choice: 同意
  rationale: 这里表示西门甘愿接受并担任随后列举的职务；“同意”比“喜欢”更符合语境。
- source_word: ἀρχιερατεύσαι
  choice: 担任大祭司
  rationale: 该不定式指履行大祭司职分；“担任”兼顾职衔与实际任职。
- source_word: στρατηγός
  choice: 统帅
  rationale: 表示军事领导职务；“统帅”庄重、清楚，又避免套用过于现代化的军衔。
- source_word: ἐθνάρχης
  choice: 民族领袖
  rationale: 这是治理一个族群的历史政治头衔；意译使普通读者易懂，同时以脚注说明其专门性质。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: 该词既可指犹太民族，也可按地域理解为犹太地人；本处全国性政治语境较支持前者，但保留另一可能。
- source_word: ἱερέων
  choice: 众祭司
  rationale: 准确表达复数群体，并用“众”使中文表达自然。
- source_word: προστῆσαι ἁπάντων
  choice: 统管……所有人
  rationale: προΐστημι在此表示居于其上、主持或管理；“统管”自然表达权柄关系，而“所有人”保留ἁπάντων指涉范围可能较广的特点。
theological_decisions:
- issue: ἐθνάρχης这一政治头衔的译法
  choice: 民族领袖
  alternative: 民族长；一族之长；音译为“埃特纳克”
  rationale: 此处是历史政治职衔，并非神学称号。“民族领袖”既传达治理族群之意，也不强行规定其精确宪制地位；脚注保留历史专名性质。
- issue: Ἰουδαίων的族群或地域含义
  choice: 犹太人
  alternative: 犹太地人
  rationale: 希腊词可兼有族群与地域意义。本节谈到西门在全国性安排中的领导职务，译作“犹太人”较自然，但脚注明确保留地域性理解。
- issue: τῶν Ἰουδαίων καὶ ἱερέων与后续ἁπάντων的句法关系
  choice: 将“犹太人”主要连接“民族领袖”，并把“众祭司和所有人”作为统管对象
  alternative: 将“犹太人和祭司”都理解为“民族领袖”的属格修饰语，末句译作“居于他们众人之上”
  rationale: 原文连续属格和并列结构略显压缩，存在句法张力。正文采用较通顺的中文分配，但脚注说明也可把犹太人和祭司一并视为前述职权所涉及的群体，避免把歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“大祭司”“统帅”保留历史职务色彩；“民族领袖”配脚注说明专门政治含义。正文适度理顺希腊文的压缩句法，同时以脚注保留其真实歧义。
