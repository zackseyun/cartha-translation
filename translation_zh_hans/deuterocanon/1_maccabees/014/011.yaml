  text: He made peace upon the land, and Israel rejoiced with great joy.
translation:
  language: zh_hans
  text: 他使境内太平[a]，以色列就大大欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地上”；希腊文直译“在地上”。
    reason: 保留ἐπὶ τῆς γῆς中γῆ可指当地疆土或较一般的“地”的词义幅度。
lexical_decisions:
- source_word: ἐποίησεν
  choice: 使……太平
  rationale: ποιέω以“和平”为宾语，表示促成和平。汉语用“使……太平”既保留其使成含义，也比直译“制造和平”自然。
- source_word: τὴν εἰρήνην
  choice: 太平
  rationale: 此处指全地公共安宁的状态；“太平”在叙述国家和地域安定时自然、庄重。
- source_word: ἐπὶ τῆς γῆς
  choice: 境内
  rationale: γῆ既可指“地、土地”，也可指一国的疆土；本书语境更可能指当地疆域。译作“境内”符合现代汉语，同时以脚注保留原文较宽的表达。
- source_word: ηὐφράνθη
  choice: 欢喜
  rationale: 该形式在此表达因局势而喜乐的反应；“欢喜”自然地传达其意义。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 采用现代汉语圣经传统中通行的专名译法；此处整体指以色列民。
- source_word: εὐφροσύνην μεγάλην
  choice: 大大欢喜
  rationale: 该宾格短语加强ηὐφράνθη所表达的喜乐。汉语以“大大欢喜”自然保留原文喜乐词语的强调和重复效果。
