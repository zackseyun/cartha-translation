  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: zh_hans
  text: 他们的仇敌打算入侵他们的国土，以毁灭他们的国土，并向他们的圣所[a]伸手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文τὰ ἅγια为复数，也可指“圣地”或“圣物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: 企图
  rationale: 表示形成意图或谋划；在敌对语境中，“企图”自然传达蓄意行动，又不把该词强化为已作正式决议。
- source_word: ἐμβατεῦσαι
  choice: 侵入
  rationale: 本义为进入、踏入；与国土及敌对行动连用时具有军事入侵意味。“侵入”既明确敌意，也不过度增添具体作战方式。
- source_word: χώραν
  choice: 国土
  rationale: 指他们所属的土地或疆域；两处均译作“国土”，保留希腊文的重复及其强调效果。
- source_word: τοῦ ἐκτρῖψαι
  choice: 要毁灭
  rationale: 不定式表达目的；ἐκτρίβω在此有彻底毁坏之意。“毁灭”庄重清楚，并保留原文较强的力度。
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπὶ
  choice: 伸手攻击
  rationale: 保留“伸手”的原文意象，同时以“攻击”表达ἐπί加宾格在此处的敌对方向；不限定亵渎或劫掠等具体形式。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 中性复数在礼仪语境中可指神圣之处、圣域或圣物；中文“圣所”可作集合性称谓，表达敬拜场所而不武断限定为单一建筑。脚注保留其他可能。
theological_decisions:
- issue: 礼仪语境中τὰ ἅγια的所指
  choice: 圣所
  alternative: 圣地；圣物
  rationale: 希腊文使用中性复数，可能指神圣区域，也可能指神圣物件。正文采用自然且合乎上下文的“圣所”，但以脚注明示复数形式及语义开放性，避免将所指绝对限定为单数圣殿。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留两次“他们的国土”的重复以及“伸手”的具体意象；以脚注保存τὰ ἅγια在地点与物件之间的真实歧义。
