base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: zh_hans
  text: 在第一百七十二年[a]，德米特里国王召集自己的军队，前往米底亚，为要给自己争取援助[b]，以便与特里丰交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的纪年通常按塞琉古纪年理解；希腊文直译为“第二、七十及第一百年”。
    reason: cultural_note
  - marker: b
    text: 或译“为自己拉拢援助”。希腊文动词含有把援助吸引过来或争取过来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: 一百七十二年
  rationale: 希腊文以累加方式直译为“第二、七十及第一百年”；现代汉语按通常理解的塞琉古纪年自然表述为“一百七十二年”。
- source_word: συνήγαγεν
  choice: 召集
  rationale: 此处指把军事力量集合起来；“召集”既贴近原义，也符合现代汉语军事叙事。
- source_word: τὰς δυνάμεις αὐτοῦ
  choice: 自己的军队
  rationale: δυνάμεις在军事语境中指武装力量；“军队”清楚自然，而“自己的”保留αὐτοῦ与主语的关系。
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: 前往米底亚
  rationale: ἐπορεύθη表示前去或行程，没有必要额外加入“进军”的强烈军事色彩；εἰς表明目的地。
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: 为自己争取援助
  rationale: 带τοῦ的不定式表示目的；ἐπισπάσθαι含有拉拢、吸引而获得之意，“争取援助”比单纯“获得帮助”更能保留这一语义。
- source_word: ὅπως πολεμήσῃ
  choice: 好攻打
  rationale: ὅπως加虚拟式表达目的；πολεμέω指交战或发动战争。“好攻打”简洁地保留目的关系及军事行动。
- source_word: τὸν Τρύφωνα
  choice: 特里丰
  rationale: 按Τρύφων的希腊语形式作现代汉语音译。
