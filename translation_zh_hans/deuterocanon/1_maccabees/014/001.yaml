  source_fidelity: 译文基本准确传达了集结军队、赴米底亚寻求援助及对付特里丰的双重目的。但“好攻打”较口语化，且较易将πολεμέω所指的交战／作战缩窄为单方面进攻；改作“以便与特里丰交战”更贴近原文。
