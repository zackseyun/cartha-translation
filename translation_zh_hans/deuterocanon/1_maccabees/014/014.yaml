  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: zh_hans
  text: 他使自己百姓中所有卑微的人得以坚立[a]；他殷切寻求律法[b]，除掉一切不法和邪恶的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卑微的人”也可译作“低微的人”或“谦卑的人”。希腊词既可指社会地位低微的人，也可指性情谦卑的人。
    reason: lexical_alternative
  - marker: b
    text: “律法”很可能指犹太人祖传的律法，即妥拉。
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: 使……得坚立
  rationale: 该动词有使稳固、坚固或扶持之意；此处用“使……得坚立”，既保留主动扶持并巩固的含义，也适合描述西门治理百姓的语境。
- source_word: πάντας τοὺς ταπεινοὺς τοῦ λαοῦ αὐτοῦ
  choice: 自己百姓中所有卑微的人
  rationale: ταπεινός既可指社会地位低微、受压的人，也可指性情谦卑的人。“卑微的人”保留这两方面的可能；将属格自然译作“百姓中”，符合现代汉语表达。
- source_word: τὸν νόμον ἐξεζήτησεν
  choice: 寻求遵行律法
  rationale: ἐκζητέω表示认真寻求、追求；若直译“寻求律法”在现代汉语中容易被理解为寻找一部失落的文本。结合治理语境，“寻求遵行”表达他以律法为追求和准则，但“遵行”属于语境性补足，故附注说明。
- source_word: ἐξῆρεν
  choice: 除掉
  rationale: 该动词意为拿走、移除。“除掉”自然有力，同时不限定被移除的是人、行为还是事物。
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: 一切不法和邪恶的事
  rationale: 中性形容词在此作名词性用法，可概括事物、行为或现象。“不法”保留与前句 νόμος（律法）的词义呼应，“邪恶”对应 πονηρόν。
theological_decisions:
- issue: νόμος是否应明确译为犹太传统中的《妥拉》
  choice: 律法
  alternative: 法律；妥拉
  rationale: 上下文很可能指以色列祖传的律法，即妥拉；但希腊文只用 νόμος，正文采用传统且自然的“律法”，脚注交代其文化所指，避免在正文中增加原文未明说的专名。
- issue: ταπεινούς主要指社会地位低下者还是品格谦卑者
  choice: 卑微的人
  alternative: 谦卑的人；低微的人；穷人
  rationale: 原词可兼有社会处境与内在品格的含义。“卑微的人”较能保留这种歧义；“穷人”过度收窄，“谦卑的人”则容易只剩品格意义。
- issue: ἐξεζήτησεν是否仅指查考律法，还是指致力于实行律法
  choice: 寻求遵行律法
  alternative: 寻求律法；查考律法
  rationale: 该动词本身强调殷切寻求，并未明说“遵行”；然而在治理功绩的并列语境中，所表达的更可能是致力于维护并实行律法。正文作自然化表达，同时以脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“得坚立”略带经文语体，但普通读者仍易理解；全句保持三项治绩的平行节奏。
