  text: And Jonathan gathered their nation[a], and became their high priest, and was added to his people.
translation:
  language: zh_hans
  text: 约拿单聚集了他们的民族，成为他们的大祭司，并被归入自己的人民之中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“被加到自己的人民中。”这是圣经中表示死亡的惯用语。
    reason: 说明原文的被动措辞及其死亡惯用义，同时保留正文含蓄的表达。
lexical_decisions:
- source_word: ἠθροισεν
  choice: 聚集了
  rationale: ἀθροίζω意为聚集、召集；“聚集了”直接保留其动作含义，不额外限定具体方式。
- source_word: τὸ ἔθνος αὐτῶν
  choice: 他们的民族
  rationale: ἔθνος在这里指一个作为整体的民族共同体；“民族”保留其群体和民族性含义，也照实表达αὐτῶν“他们的”。
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: 作了他们的大祭司
  rationale: ἐγενήθη与表语名词连用，表示“成为”；现代汉语用“作了”自然、庄重。ἀρχιερεύς译为标准称谓“大祭司”，αὐτοῖς译作“他们的”。
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: 归到他自己的人民那里
  rationale: 原文直译为“被加到他自己的人民中”，是表示死亡并归于先民的圣经惯用语。正文采用自然汉语“归到……那里”，同时不把隐含意义直接改写成“死了”。
- source_word: λαός
  choice: 人民
  rationale: λαός指作为整体的人民；“人民”是现代汉语中庄重而通行的对应词。
theological_decisions:
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ这一死亡惯用语的表达
  choice: 归到他自己的人民那里
  alternative: 被加到他自己的人民中；归到他的先民那里
  rationale: 正文保留“归到其人民”的圣经意象及其含蓄性，不把它明确化为“死了”，也不将λαός窄化为“祖先”；脚注说明直译和惯用含义。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“作了”避免生硬的“成为了”；末句保持圣经式死亡隐语，不使用古奥表达。
