base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/020.yaml
  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: zh_hans
  text: 以下是斯巴达人——即斯巴达人的官长和城邦——寄给大祭司西门、众长老、众祭司，以及其余犹太民众——他们的弟兄——的书信副本[a]：问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“书信”采用复数形式，直译为“书信的副本”；中文“书信副本”本身不标明单复数。
    reason: 保留原文复数形式，同时说明中文表达不区分单复数。
lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 指文书的抄本或副件；“副本”准确、自然，也符合正式外交文书的语境。
- source_word: ἐπιστολῶν
  choice: 书信
  rationale: 希腊文为复数属格，但本句引出的是一份外交文书；中文“书信”不强制标明单复数，既忠于原文形式上的含混，也保持自然。
- source_word: οἱ Σπαρτιᾶται Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: 斯巴达人……斯巴达人的官长和全城
  rationale: 原文结构紧凑，后半部分可视为对发信者“斯巴达人”的进一步说明。“官长”保留政治职分，“全城”表达城邦共同体，而非仅指地理城市。
- source_word: ἱερεῖ μεγάλῳ
  choice: 大祭司
  rationale: 这是犹太制度中该职分的现代汉语惯用名称，比逐字译作“伟大的祭司”准确自然。
- source_word: πρεσβυτέροις
  choice: 众长老
  rationale: 此处指获认可的群体领袖，而不只是年长者；“长老”符合当时公民与宗教语境。
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: 其余的犹太民众
  rationale: δῆμος在此指作为共同体的人民；“犹太民众”自然地传达这一集体含义，“其余”则保留与前述领袖及祭司相对的结构。
- source_word: ἀδελφοῖς
  choice: 他们的弟兄
  rationale: 该词与收信者同格，表达斯巴达人与犹太人之间所宣称的兄弟关系；补出“他们的”使中文所指清楚，同时保留外交亲族称谓。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的惯用问候语；“问安”庄重而自然，符合正式信函语体。
theological_decisions:
- issue: ἱερεῖ μεγάλῳ所指的犹太职分
  choice: 大祭司
  alternative: 大司祭；伟大的祭司
  rationale: “大祭司”是现代汉语中明确、通行的职衔，不额外加入宗派含义，也避免逐字翻译造成误解。
- issue: ἀδελφοῖς所表达的关系
  choice: 他们的弟兄
  alternative: 同胞；亲族
  rationale: 保留“弟兄”可呈现原文的外交亲缘宣称；译作“同胞”会暗示双方同属一个民族，译作“亲族”则会减弱原词的直接性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留外交书信的正式语气。以冒号引出发信者与收信者，以破折号标示“他们的弟兄”与“其余的犹太民众”的同格关系。
