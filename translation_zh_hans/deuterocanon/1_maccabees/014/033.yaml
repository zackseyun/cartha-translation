  yaml_path: translation/deuterocanon/1_maccabees/014/033.yaml
  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: zh_hans
  text: 他加固了犹太地的各城，又加固了犹太地边境上的伯夙；那里从前有敌人的兵器。他还在那里安置了一支由犹太男子[a]组成的守军。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地男子”。希腊语Ἰουδαίους在这里既可指族群—宗教身份，也可指地域身份。
    reason: 保留Ἰουδαίους在第二圣殿时期语境中“犹太人”与“犹太地人”之间的词义歧义，同时正文保留ἄνδρας所指的男性。
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: 加固
  rationale: 该动词表示通过防御工事或军事部署使城邑坚固；“加固”自然、准确，也适用于后文的边境据点。
- source_word: τὰς πόλεις τῆς Ἰουδαίας
  choice: 犹太地的各城
  rationale: πόλεις在此指多个城市或城镇；“各城”符合汉语叙事习惯。Ἰουδαία作为地域名称译为“犹太地”。
- source_word: Βαιθσουρὰμ
  choice: 伯夙
  rationale: 采用中文圣经传统中对Beth-zur的常见地名译法，避免按希腊语形态另造不熟悉的音译。
- source_word: ἐπὶ τῶν ὁρίων
  choice: 边境上
  rationale: 该短语指位于犹太地的边界地带；“边境上”简洁保留其地理和军事含义。
- source_word: ὅπλα
  choice: 兵器
  rationale: 该词泛指武器或军械；“兵器”在历史军事语境中自然且易懂。
- source_word: τῶν πολεμίων
  choice: 敌人的
  rationale: 属格表明兵器属于敌方；直译为“敌人的”保留原文关系。
- source_word: τὸ πρότερον
  choice: 从前
  rationale: 表示较早的状况；“从前”是自然的现代汉语叙事表达。
- source_word: ἔθετο ἐκεῖ φρουράν
  choice: 在那里安置了一支……守军
  rationale: ἔθετο与φρουράν连用，指部署驻防力量；“安置……守军”兼顾原文动作和军事语境。
- source_word: ἄνδρας Ἰουδαίους
  choice: 由犹太人组成
  rationale: 原文明确说明守军人员是Ἰουδαῖοι。汉语“犹太人”通常已可指群体成员；“由……组成”清楚表达ἄνδρας与φρουράν的同位说明关系，而不把他们增译为原文未明说的“士兵”。
theological_decisions:
- issue: Ἰουδαίας与Ἰουδαίους的区分
  choice: 犹太地／犹太人
  alternative: 犹太地／犹太地人
  rationale: Ἰουδαία在这里明确是地名，译作“犹太地”；Ἰουδαίους既可表达族群—宗教身份，也可表达地域身份。正文采用现代汉语中更自然且含义较广的“犹太人”，并以脚注保留地域性译法的可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“加固”“边境”“兵器”“守军”准确呈现军事语境；将较长的希腊语并列句分为两句，以符合现代汉语节奏，同时保留所有信息及其先后关系。
