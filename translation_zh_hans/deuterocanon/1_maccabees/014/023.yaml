  yaml_path: translation/deuterocanon/1_maccabees/014/023.yaml
  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: zh_hans
  text: 民众认为，应当隆重接待这些人，并将他们的话抄写一份，存入为民众指定的册簿中[a]，好让斯巴达民众有所纪念；他们又把这些事的副本写给大祭司西门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为民众指定的册簿”，指城邦用来保存公文的正式档案或登记册。
    reason: cultural_note
lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: 民众认为，应当
  rationale: 保留非人称结构所表达的集体认可和正式公共决议语气；比“民众喜欢”更符合城邦政务语境。
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: 隆重接待这些人
  rationale: ἐπιδέξασθαι表示正式接待，ἐνδόξως表示给予尊荣；“隆重接待”在现代汉语中自然、庄重，也不把ἄνδρας过度解释为“使者”。
- source_word: τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: 把他们所说的话抄录一份
  rationale: ἀντίγραφον指副本，λόγοι在这里指他们的话或陈述；此译法清楚表达制作文字副本的动作。
- source_word: δέσθαι
  choice: 存入
  rationale: 结合副本和官方册簿的语境，译为将副本收存于其中；避免采用现代技术性的“归档”，也不把动作窄化为单纯“记录”。
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: 为民众指定的档案册中
  rationale: 较直接地保留“为民众指定的册簿”这一结构，同时用“档案册”说明其官方保存文书的用途。
- source_word: τοῦ μνημόσυνον ἔχειν τὸν δῆμον τῶν Σπαρτιατῶν
  choice: 使斯巴达民众留作纪念
  rationale: 以目的句表达冠词不定式；“留作纪念”兼顾μνημόσυνον的纪念与留存含义，并保留δῆμος的公民群体色彩。
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ
  choice: 他们还为大祭司西门抄写了一份
  rationale: 把与ἀντίγραφον搭配的ἔγραψαν自然译成“抄写”，将西门的与格处理为受益对象；不加入原文未明说的“寄送”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“民众认为，应当”体现公共决议语气；“档案册”说明制度背景，同时以脚注保留希腊语的字面表达。所有代词均按上下文保留，不额外认定这些人必为使者，也未加入原文没有明说的寄送动作。
