  yaml_path: translation/deuterocanon/1_maccabees/014/042.yaml
  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
translation:
  language: zh_hans
  text: 并且由他担任他们的统帅，照管圣所[a]，并任命人负责管理他们的各项事务、国土、武器和堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传承下来的希腊语在这里措辞不顺；也可理解为“圣物”或“圣地”。
    reason: alternative_reading
lexical_decisions:
- source_word: στρατηγόν
  choice: 统帅
  rationale: στρατηγός在此指兼具军事与行政权力的领袖；“统帅”保留军事色彩，又不限定为某一现代军衔。
- source_word: μέλῃ αὐτῷ περὶ
  choice: 让他负责照管
  rationale: 该结构表示某事由他关心并负责；“负责照管”符合公共法令的语境，也自然体现持续照料之意。
- source_word: τῶν Α ἅγιον
  choice: 圣所
  rationale: 传抄下来的希腊语措辞不顺；结合上下文，神圣之物或神圣之处很可能指圣所。“圣所”用于正文较自然，同时以脚注保留“圣物”等可能。
- source_word: καθιστάναι δʼ αὐτοῦ
  choice: 又由他委派人管理
  rationale: καθιστάναι在此表示任命或设置人员负责某些领域；汉语需补出“人”与“管理”，而“由他”保留任命权属于他的含义。
- source_word: τῶν ἔργων αὐτῶν
  choice: 他们的各项事务
  rationale: ἔργα字面为“工作、工程”，在行政语境中可泛指所办事务；“各项事务”比“工作”更自然，也避免误解为单指建筑工程。
- source_word: χώρας
  choice: 国土
  rationale: χώρα指辖境、土地或领土；此处与武器、堡垒并列，采用“国土”体现政治与行政范围。
- source_word: ὅπλων
  choice: 武器
  rationale: ὅπλα指兵器或军械；“武器”是清楚、通行的现代汉语表达。
- source_word: ὀχυρωμάτων
  choice: 堡垒
  rationale: ὀχυρώματα指设防之处或要塞；“堡垒”简洁保留其军事含义。
theological_decisions:
- issue: 难解短语τῶν Α ἅγιον所指为何
  choice: 正文译作“圣所”
  alternative: “圣物”或“神圣之处”
  rationale: 这是文本与词义上的歧义，而非需要由教义预先裁定的问题。上下文支持“圣所”，但传承文本的形式不规则，因此用脚注保留范围较广的其他理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留公共法令式的并列结构。正文避免生硬直译，并在难解的圣所相关短语处明确标注文本歧义。
