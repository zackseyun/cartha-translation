  language: zh_hans
  text: 这些信在耶路撒冷的会众面前宣读了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: 宣读了
  rationale: 该词为不定过去时被动形式，结合书信语境，表示文件被当众读出；“宣读了”自然体现公开朗读，同时保留被动含义。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 直接表达某事在一群人面前进行，符合现代汉语庄重而自然的用法。
- source_word: ἐκκλησίας
  choice: 会众
  rationale: 此处指耶路撒冷聚集起来的群体，而非后世特指的基督教“教会”；“会众”兼顾聚集、共同体和宗教公共场合的意味。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 按通常的处所意义翻译；在汉语句法中与“会众”结合为“耶路撒冷的会众”，避免连续出现两个“在”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“这些信”承接上文所指的复数文件；希腊文本本节仅有代词所隐含的复数主语，中文为独立经节的可读性将其明确为书信。
