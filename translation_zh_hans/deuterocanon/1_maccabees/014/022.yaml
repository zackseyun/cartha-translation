  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
translation:
  language: zh_hans
  text: 他们把使者所说的话记载在人民议会的记录[a]中，内容如下：“安提阿古的儿子努米尼乌斯和雅孙的儿子安提帕特，是犹太人的使者[b]；他们来到我们这里，更新同我们的友好关系[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人民议会的记录”也可译作“人民的议事会所作的议决（或其记录）”。这里的希腊语指人民政治机构的议事、议决或相关正式文书；在本句的记载语境中，译作“记录”。
    reason: lexical_alternative
  - marker: b
    text: 传世希腊文本在“犹太人的”之前有一个孤立的字母 Α，可能是抄写或编辑过程中留下的讹文，并非有实际意义的词；本译文按句子的清楚意思译作“犹太人的使者”。
    reason: textual_variant
  - marker: c
    text: 这里的“友好关系”带有外交含义，可能指正式的友好邦交，也可能包含盟好关系。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγραψάμενοι
  choice: 记入
  rationale: 该分词表示正式写下、登记；“记入”既体现官方文书语境，也保留先行于下文陈述的动作。
- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: 使者所说的话
  rationale: 原文直译为“由他们所说的事”；结合上下文，“使者所说的话”在现代汉语中指代清楚。
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: 人民议会的决议
  rationale: βουλαί 可指议事、议决或决议；在此官方记录语境中译为“人民议会的决议”，同时以脚注保留其他可能。
- source_word: οὕτως
  choice: 内容如下
  rationale: 此词引出所记录文书的正文；“内容如下”符合现代汉语公文叙述。
- source_word: πρεσβευταὶ
  choice: 使者
  rationale: 指奉派从事正式外交事务的代表；“使者”庄重自然，也适合古代外交背景。
- source_word: Α Ἰουδαίων
  choice: 犹太人的
  rationale: 传抄文本在 Ἰουδαίων 前有一个孤立的 Α；依清楚句义理解为“犹太人的使者”，异常字符另见脚注。
- source_word: ἀνανεούμενοι
  choice: 重续
  rationale: 表示使已有关系重新恢复或更新；“重续”简洁地保留既存外交关系得到更新的含义。
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: 同我们的友好关系
  rationale: φιλία 基本义为友谊，在希腊化时代外交文书中可指正式友好关系；此译法保留外交意味而不直接收窄为“同盟”。
