  yaml_path: translation/deuterocanon/1_maccabees/014/012.yaml
  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: zh_hans
  text: 人人都坐在自己的葡萄树和无花果树下[a]，没有人使他们害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一措辞呼应圣经中表示和平与安稳的惯用语；参见《列王纪上》4:25和《弥迦书》4:4。
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: 坐
  rationale: 保留具体的安坐图景，并与圣经中安享太平的固定意象相呼应；不扩译为“安居”。
- source_word: ἕκαστος
  choice: 人人都
  rationale: 表达逐一分配的含义，即每个人都享有这种安稳，同时避免添加原文没有明说的性别。
- source_word: ὑπὸ
  choice: 在……下
  rationale: 准确表达空间关系，也是汉语中呈现这一圣经惯用语的自然方式。
- source_word: ἄμπελον
  choice: 葡萄树
  rationale: 准确而自然地呈现农耕意象，也符合这一圣经和平用语的传统表达。
- source_word: συκῆν
  choice: 无花果树
  rationale: 该词指无花果树；此译法准确，并保留固定的圣经意象。
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: 没有人使……害怕
  rationale: 带冠词的分词作名词用，意为“使人害怕的那一个/人”；此译法保留其使役含义，且现代汉语清楚自然。
- source_word: αὐτούς
  choice: 他们
  rationale: 直接对应代词，回指共同享有安稳的众人。
theological_decisions:
- issue: “在自己的葡萄树和无花果树下”的经文互文性和平公式
  choice: 在正文中保留葡萄树和无花果树的字面农耕意象。
  alternative: 概括意译为人人安居、太平无忧。
  rationale: 这一表达是圣经中象征和平与安全的鲜明惯用语。保留原有图景能维持经文之间的呼应，也不把丰富意象压缩成单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人人都坐在……”既保留希腊文的具体动作，又自然传达普遍安稳的景象；句末不额外加入“来”，以贴近原文简洁结构。
