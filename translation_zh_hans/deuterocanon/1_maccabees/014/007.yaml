  yaml_path: translation/deuterocanon/1_maccabees/014/007.yaml
  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: zh_hans
  text: 他聚集了许多俘虏，又控制了基色、伯夙和城堡[a]，并除去了城堡里的污秽；没有人起来反对他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“阿克拉”，即耶路撒冷的一座特定堡垒。
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγεν
  choice: 聚集了
  rationale: 直译其“聚集、收拢”之意；与宾语“俘虏”连用，保留征战后将俘虏集中起来的具体动作，不额外推断处置方式。
- source_word: αἰχμαλωσίαν πολλήν
  choice: 许多俘虏
  rationale: 该短语字面可指“大量被掳之物/俘虏”，此处自然指被俘的人；译作“许多俘虏”简洁自然，并保留数量意义。
- source_word: ἐκυρίευσεν
  choice: 控制了
  rationale: 该动词表示取得主权或支配权；“控制了”适合军事与政治语境，又不将其限缩为攻城动作或长期统治。
- source_word: Γαζάρων
  choice: 基色
  rationale: 采用该古代地名在现代中文圣经传统中通行且易辨认的译名。
- source_word: Βαιθσούρων
  choice: 伯夙
  rationale: 采用该地名常见的现代中文译名，兼顾可读性与历史辨识度。
- source_word: τῆς ἄκρας
  choice: 城堡
  rationale: ἄκρα可作普通名词，意为堡垒或城堡；正文以“城堡”表达其透明词义，同时在脚注保留其可能是耶路撒冷特定堡垒“阿克拉”的读法。
- source_word: ἐξῆρεν
  choice: 除去了
  rationale: 准确表达“移走、清除”的完成动作，并与宗教性洁净语境自然衔接。
- source_word: τὰς ἀκαθαρσίας
  choice: 污秽
  rationale: 希腊文为复数，可指各种造成不洁的事物或污秽；中文“污秽”可作集合性表达，既自然，又保留礼仪及宗教层面的含义。
- source_word: ἐξ αὐτῆς
  choice: 城堡里的
  rationale: 阴性代词最自然地回指紧邻的阴性名词ἄκρα；中文明确重复“城堡”，避免“其中”可能误指三个地点整体。
- source_word: ὁ ἀντικείμενος αὐτῷ
  choice: 没有人起来反对他
  rationale: 分词表示与他对立或抵抗的人；“起来反对他”以自然现代汉语传达实际反抗，同时不增加具体军事行动。
theological_decisions:
- issue: ἀκαθαρσίαι的礼仪和宗教含义
  choice: 译作“污秽”
  alternative: 不洁之物；玷污之物
  rationale: 马加比时代清除堡垒内污秽的叙述很可能兼具宗教洁净意味。“污秽”保留这种意味，却不具体断定污秽的种类或来源。
- issue: ἄκρα是普通名词还是专名
  choice: 正文译作“城堡”
  alternative: 阿克拉
  rationale: 希腊文本身容许普通名词“城堡”的理解，但在本书历史语境中也可能特指耶路撒冷的阿克拉堡垒。正文传达词义，脚注保留专名读法，以保存真实歧义。
- issue: αἰχμαλωσίαν是被掳状态还是被掳的人群
  choice: 按转喻译作“俘虏”
  alternative: 大批战利品；许多被掳的人
  rationale: 在此征服语境中，集合名词最自然地指被掳的人。译作“俘虏”不对他们的身份或后续遭遇作进一步神学或历史判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以并列分句保留希腊文叙事的推进感；将代词所指明确为“城堡”，避免中文歧义。正文中的脚注标记与脚注须一致，因此在“城堡”后补入[b]。
