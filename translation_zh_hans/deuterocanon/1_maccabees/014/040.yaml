base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/040.yaml
  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
translation:
  language: zh_hans
  text: 因为人们听说，罗马人称犹太人为朋友、盟友和弟兄，并且郑重而隆重地接待了西门的使者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“郑重而隆重地迎见了西门的使者。”希腊文动词直译为“迎见”，在这里指对外交使者的正式迎接和接待。
    reason: 说明ἀπήντησαν的字面意义及其在外交语境中的译法；“郑重而隆重地”对应ἐνδόξως所指的尊荣、体面待遇。
lexical_decisions:
- source_word: ἠκούσθη
  choice: 有消息传来
  rationale: 保留无人称被动表达所传达的意思，即这件事已被人听闻、传开；这样也比生硬的“被听见”更符合现代汉语。
- source_word: προσηγορεῦνται
  choice: 称……为
  rationale: 准确表达以正式称号称呼或认定某方的意思，并适合外交语境。
- source_word: φίλοι
  choice: 朋友
  rationale: 直译这一希腊化外交称号，同时保留其关系性和可能具有的正式含义。
- source_word: σύμμαχοι
  choice: 盟友
  rationale: 这是现代汉语中表达政治、军事同盟关系的自然对应词。
- source_word: οἱ ἀδελφοί
  choice: 弟兄
  rationale: 保留原文阳性复数和外交公式中的兄弟关系称号，不将其泛化为亲属或中性伙伴。
- source_word: ἀπήντησαν
  choice: 接待
  rationale: 该词本义为“迎见、会见”，但与使者连用时指正式迎接和接待；正文采用符合汉语外交语境的表达。
- source_word: πρεσβευταῖς
  choice: 使者
  rationale: 简明表达受正式委派的代表，既准确又符合古代外交场景。
- source_word: ἐνδόξως
  choice: 隆重
  rationale: 在此表示以尊荣、体面的方式对待使者；“隆重接待”是自然且贴合语境的现代汉语。
theological_decisions:
- issue: 外交称号 οἱ ἀδελφοί 的译法
  choice: 弟兄
  alternative: 亲族；兄弟般的盟友
  rationale: 原文明确使用阳性复数，并把它与“朋友、盟友”并列为正式关系称号；译作“弟兄”既保留原文形式，也不额外解释这种外交关系的具体性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有消息传来”避免机械复制希腊语被动句式；“朋友、盟友和弟兄”保留外交称号的并列结构；“隆重接待”清楚传达正式、尊荣的接见。
