  text: and he made him one of his Friends[a], and he honored him with great honor.
translation:
  language: zh_hans
  text: 他把他列为自己的“朋友”之一[a]，并赐给他极大的尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他的朋友之一”。这里的希腊文既可能指私人朋友，但更可能指王廷中称为“朋友”的正式身份或等级。
    reason: 保留 φίλοι 在普通友谊关系与希腊化王廷称号之间的歧义。
lexical_decisions:
- source_word: ἐποίησεν
  choice: 把……列入……之中
  rationale: 这里的 ποιέω 带宾语和身份补语，表示使某人成为某群体中的一员；译为“列入”既符合任命或纳入的语境，也使现代汉语自然。
- source_word: τῶν φίλων αὐτοῦ
  choice: 自己的“朋友”之中
  rationale: 属格复数表示被纳入一个群体。φίλοι 字面可指私人朋友，但在希腊化王廷语境中很可能是获承认的宫廷身份；正文用引号提示其可能的称号性质，同时由脚注保留两种理解。
- source_word: ἐδόξασεν
  choice: 赐给……尊荣
  rationale: 在王权和政治语境中，δοξάζω 指给予荣誉或显要地位，而非神学意义上的“荣耀”；“赐给”也切合君王授予尊荣的场景。
- source_word: δόξῃ μεγάλῃ
  choice: 极大的尊荣
  rationale: 工具或方式与格说明他以何种尊荣抬举此人；“极大的尊荣”保留 μεγάλῃ 的强度，并准确表达此处 δόξα 的社会政治含义。
theological_decisions:
- issue: φίλοι 是普通关系用语，还是王廷称号
  choice: 正文译作带引号的“朋友”，保留其很可能具有的王廷身份含义
  alternative: 普通意义的“朋友”
  rationale: 希腊词本身容许私人友谊之义，但《马加比一书》及希腊化宫廷用语支持其作为君王近臣等级或称号的可能。中文缺乏靠首字母大写标示专名的手段，因此用引号并加脚注，避免把歧义默默定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列入……之中”自然表达群体身份的授予；“赐给他极大的尊荣”避免重复、生硬的“以大荣耀荣耀他”，并符合君王授荣的政治语境。
