  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: zh_hans
  text: 西满在世的日子，国土一直安宁；他为自己的民族谋求福祉；在他一生的日子里，他的权柄和荣耀都为他们所喜悦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  choice: 境内一直安定
  rationale: γῆ在此指西满治下的国土，而非全世界；ἡσυχάζω描述安宁稳定的状态。“境内一直安定”符合现代汉语历史叙事，也不夸大为正式和约所带来的和平。
- source_word: πάσας τὰς ἡμέρας Σίμωνος
  choice: 西满在世的日子
  rationale: 保留“所有日子”的持续含义，并用自然汉语表达西满一生或执政期间的概括；“在世”也与本节末尾的重复形成呼应。
- source_word: ἐζήτησεν ἀγαθὰ
  choice: 谋求福祉
  rationale: 表达主动寻求有益之事，语气庄重自然；“福祉”在此是民族的实际利益，不额外加入神学含义。
- source_word: τῷ ἔθνει αὐτοῦ
  choice: 为自己的民族
  rationale: ἔθνος在本书的历史政治语境中指犹太民族这一共同体；“民族”比泛称“人民”更能保留其族群与国家层面的意义。
- source_word: ἡ ἐξουσία αὐτοῦ
  choice: 他的权柄
  rationale: ἐξουσία指所拥有并施行的权力或权威；“权柄”保留庄重语体，又不强化为君王式的统治权。
- source_word: ἡ δόξα αὐτοῦ
  choice: 他的荣耀
  rationale: δόξα可指荣耀、尊荣或声望；“荣耀”保留希腊文颂赞性的高雅语气，同时不把含义限缩为名声。
- source_word: ἤρεσεν αὐτοῖς
  choice: 深得民心
  rationale: 此处表示西满的权柄和荣耀令其民族喜悦、认可。“深得民心”是自然的现代汉语概括，并以“民”明确承接前文的民族共同体。
- source_word: πάσας τὰς ἡμέρας ... πάσας τὰς ἡμέρας
  choice: 在世的日子……在世的日子……一直
  rationale: 保留原文首尾重复所形成的强调框架，并以“一直”清楚传达贯穿始终的持续性。
theological_decisions:
- issue: 对西满政治领导的颂扬
  choice: 按民族历史叙事译为对西满治理的正面评价
  alternative: 把“境内安定”解释为上帝所赐的盟约性平安，或赋予西满弥赛亚色彩
  rationale: 本节并未明说安定来自上帝，也没有使用明确的盟约或弥赛亚措辞，因此保持原文克制，不加入其未表达的神学因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“西满”沿用《马加比一书》常见的音译传统；句式保留原文对西满一生的首尾强调，同时避免生硬直译。
