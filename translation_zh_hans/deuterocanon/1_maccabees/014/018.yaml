  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
translation:
  language: zh_hans
  text: 他们给西门写了铜版文书，为要同他更新他们先前同他的兄弟犹大和约拿单所订立的友好关系和联盟。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜版”也可译作“铜牌”。希腊文指铜制的正式文书版片，可能用作长期保存的公共或外交记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψαν
  choice: 把文字刻在
  rationale: 基本义是“写”，但直接宾语为铜制书写版；汉语用“把文字刻在铜版上”自然地表达在金属载体上书写，同时不改变正式文书的性质。
- source_word: δέλτους χαλκᾶς
  choice: 铜版
  rationale: δέλτος指供书写的版片，χαλκᾶς说明其为铜制；“铜版”简洁自然，适合外交文书语境。
- source_word: τοῦ ἀνανεώσασθαι
  choice: 为要……重续
  rationale: 带冠词的不定式表示目的；“重续”既传达“更新、恢复效力”，也适合友好关系与盟约的正式语境。
- source_word: φιλίαν
  choice: 友好关系
  rationale: 此处是外交意义上的正式友好关系，而不只是个人友情；译为“友好关系”可准确体现语境。
- source_word: συμμαχίαν
  choice: 盟约
  rationale: 该词指政治军事联盟；“盟约”既表达结盟关系，也符合古代正式外交文书的语域。
- source_word: ἔστησαν
  choice: 所确立的
  rationale: 在此表示建立或缔结某种关系；“确立”可同时自然搭配“友好关系”和“盟约”。
- source_word: πρὸς αὐτόν
  choice: 与他
  rationale: 在关系及结盟语境中，πρός加宾格自然译作“与他”。
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: 他的兄弟犹大和约拿单
  rationale: 同位语明确犹大和约拿单是西门的兄弟；此语序符合现代汉语。
