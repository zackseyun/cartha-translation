  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: zh_hans
  text: 他又加固了海边的约帕，以及位于亚锁都边界的加撒拉[a]；敌人从前住在那里。他让犹太人定居在那里，并在这些地方配置了恢复所需的一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加撒拉”也可按其较为人熟悉的希伯来名称译作“基色”；这里的希腊文本作“加撒拉”。
    reason: lexical_alternative
  - marker: b
    text: “恢复”可能指这些地方的恢复或重整，也可能指安置在其中的犹太群体得以重新建立；希腊文表述简练，允许这两种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: 加固了
  rationale: 该动词指使城邑坚固、设防；“加固”既保留军事防御含义，也符合现代汉语表达。
- source_word: Ἰόππην
  choice: 约帕
  rationale: 采用该古代海港在现代中文圣经传统中通行且易于辨认的名称。
- source_word: τὴν ἐπὶ τῆς θαλάσσης
  choice: 海边的
  rationale: 自然地表达其位于海滨，同时忠实保留原文的地理说明。
- source_word: Γάζαραν
  choice: 加撒拉
  rationale: 按希腊文 Γάζαρα 音译，不直接与较熟悉的希伯来名称“基色”协调。
- source_word: τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  choice: 位于亚锁都边界的
  rationale: ὅρια 可指边界或边境地带；“边界”简洁地保留原文的地理关系。
- source_word: οἱ πολέμιοι
  choice: 敌人
  rationale: 准确表达作为名词使用的复数形容词，指敌对者。
- source_word: τὸ πρότερον
  choice: 从前
  rationale: 自然、简洁地标明过去的时间。
- source_word: κατῴκισεν
  choice: 让……定居
  rationale: 明确呈现该动词使役性的居住含义，而不额外断定这是首次迁入还是重新安置。
- source_word: Ἰουδαίους
  choice: 犹太人
  rationale: 在此人口安置语境中，“犹太人”是现代汉语最清楚自然的对应词，并保留其族群与宗教身份的综合意味。
- source_word: ὅσα ἐπιτήδεια
  choice: 所需的一切
  rationale: 该短语可泛指必需品、合用之物或供应；此译法避免将范围缩窄为食物或军需。
- source_word: πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: 恢复所需
  rationale: ἐπανόρθωσις 指恢复、整顿或重新建立；不明说恢复对象，以保留 τούτων 所指略有含混的特点。
- source_word: ἔθετο ἐν αὐτοῖς
  choice: 在城中备齐了
  rationale: 原文直译为“放置在它们里面”；结合必需品和两座城的语境，“在城中备齐”更符合现代汉语，同时保留复数地点的含义。
