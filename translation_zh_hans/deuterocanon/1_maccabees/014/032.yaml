  yaml_path: translation/deuterocanon/1_maccabees/014/032.yaml
  text: Then Simon rose up and fought for his nation[a], and spent much of his own money, and armed the men of his nation's forces[b], and gave them wages.
translation:
  language: zh_hans
  text: 随后，西满起来[b]，为自己的民族[a]作战；他花费了自己许多钱财，武装了本民族军队的士兵，并给他们发军饷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民族”也可译作“人民”；原文在这里侧重作为整体的政治共同体。
    reason: lexical_alternative
  - marker: b
    text: 原文此处的印刷形式为ἀνέστησενσεν，似有重复的音节或抄印错误；通常理解为ἀνέστησεν，意为“起来”或“奋起”。
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 自然承接叙事时序，也可理解为“于是”；此处不额外强化因果关系。
- source_word: ἀνέστησενσεν
  choice: 挺身而出
  rationale: 所印形式疑有音节重叠，显然对应ἀνέστησεν；在本语境中不只是身体起立，而是起而担当、采取行动。
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: 为自己的民族作战
  rationale: περὶ在此表达为了、维护之意；“民族”保留ἔθνος在上下文中的共同体及政治含义。
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: 拿出许多自己的钱
  rationale: 准确表达花费个人钱财；“拿出”比机械直译“花费”更符合中文叙事，同时未扩展为全部财富。
- source_word: ὡπλοδότησεν
  choice: 武装
  rationale: 简洁表达供给武器、使之装备起来的含义。
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: 本民族军队中的男丁
  rationale: δύναμις在此为军事力量，ἄνδρας明确指男性；译文保留其性别所指，又避免生硬的“军力之人”。
- source_word: ὀψώνια
  choice: 军饷
  rationale: 该词在军事语境中指士兵所得的给养或薪酬；“军饷”准确而自然，并保留其军事性质。
theological_decisions:
- issue: 犹太共同体语境中ἔθνος的译法
  choice: 民族
  alternative: 人民
  rationale: 本节涉及为共同体作战、组织军力和发放军饷，呈现政治—民族共同体含义；“民族”比“人民”更能保留这一层面，同时不引入现代民族主义观念。
- issue: τοὺς ἄνδρας的性别所指
  choice: 男丁
  alternative: 士兵
  rationale: 原文明确使用阳性复数名词，指参与军事力量的男子；译作“男丁”保留性别信息，而不是中性化处理。
- issue: ὀψώνια是薪酬还是给养
  choice: 军饷
  alternative: 口粮／给养
  rationale: 该词可源于军粮、给养，也常指士兵报酬；上下文说西满动用自己的钱，因此“军饷”最契合，但脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“西满”沿用次经人名常见译法；“挺身而出”“军饷”兼顾原文军事语境与现代汉语自然度。所有脚注标记均已置于正文。
