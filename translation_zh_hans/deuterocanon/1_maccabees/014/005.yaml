  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
translation:
  language: zh_hans
  text: 他在极大的荣耀中取得约帕作港口，并使它成为通往海岛的门户。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为海中的岛屿造了入口”。希腊文的说法较为凝缩；这里可能是指约帕成为通往各海岛的海上通道。
    reason: 说明ἐποίησεν εἴσοδον ταῖς νήσοις τῆς θαλάσσης较字面的译法，并保留与格可表示方向或关联的空间。
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  choice: 他满有荣耀
  rationale: δόξα可指荣耀、尊荣或光彩；这里处于颂扬性的历史语境中。“满有荣耀”保留庄重语气，也不把含义限于声望或外在盛况。
- source_word: ἔλαβεν
  choice: 夺取
  rationale: λαμβάνω基本义为“取、取得”；结合约帕作为城邑和港口的历史语境，“夺取”自然表达取得控制权，但不额外描写具体军事过程。
- source_word: τὴν Ἰόππην
  choice: 约帕
  rationale: “约帕”是该地名在现代中文圣经传统中通行且易识别的译名。
- source_word: εἰς λιμένα
  choice: 作为港口
  rationale: εἰς在这里可表达目的或结果，即取得约帕，使其发挥港口作用；“作为港口”比直译“进入港口”更符合句法和上下文。
- source_word: ἐποίησεν εἴσοδον
  choice: 使它成为……门户
  rationale: ποιέω与εἴσοδος的组合表示造出或提供入口、通道；补出承接上文的“它”，以自然中文说明约帕的功能。
- source_word: ταῖς νήσοις τῆς θαλάσσης
  choice: 通往海岛
  rationale: 与εἴσοδον连用的与格可表达关联或方向；“通往海岛”自然传达约帕作为海上交通入口的作用。“海岛”简洁保留“海中的岛屿”之意。
