    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα ποιήσῃ
  choice: 做出违背这些规定的事
  rationale: παρά加宾格与ποιέω连用，在此法令语境中表示违反前述规定；译文既表达行为的宽泛性，也保留法律措辞。
- source_word: ἀθετήσῃ
  choice: 废弃
  rationale: 在法令语境中，ἀθετέω可指废除、使失效或置之不理；“废弃”简洁地保留其正式的法律意味。
- source_word: τι τούτων
  choice: 其中任何一项
  rationale: 这是部分属格式表达，指前述各项规定中的任意一项。
- source_word: ἔνοχος ἔσται
  choice: 就要承担罪责
  rationale: ἔνοχος表示处于有罪或须负法律责任的状态；“承担罪责”兼顾罪责与法律责任两层含义，并与法令语体相称。
