  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
translation:
  language: zh_hans
  text: 但若有人作出任何违背这些规定的行为，或废弃其中任何一项，就要负法律责任。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
