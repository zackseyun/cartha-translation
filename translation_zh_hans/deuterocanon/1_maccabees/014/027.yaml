  yaml_path: translation/deuterocanon/1_maccabees/014/027.yaml
  text: 'And this is the copy of the writing: On the eighteenth of Elul[a], in the one hundred seventy-second year, and this was the third year under Simon the high priest,'
translation:
  language: zh_hans
  text: 以下是这份文书[a]的副本：以禄月十八日，第一百七十二年；这也是大祭司西门任内的第三年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文书”直译可作“书写”或“书写记录”；这里指正式的书面文件。
    reason: 说明希腊语 γραφῆς 在本节行政文书语境中的含义，避免将其误解为“经文”。
lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 该词指书面文本的抄本或复制件；“副本”自然、准确，也符合正式文书的语境。
- source_word: γραφῆς
  choice: 文书
  rationale: 这里不是指“经文”，而是指一份正式的书面记录；“文书”既保留书写文本之意，也符合行政公文语境。
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  choice: 以禄月十八日
  rationale: 序数词与月份名共同构成日期；“以禄月”采用犹太月份名称的常见汉语音译。
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: 第一百七十二年
  rationale: 按希腊语纪年表达直译为该时代的第一百七十二年；原文没有明说纪元名称，因此不擅自补入。
- source_word: τοῦτο τρίτον ἔτος
  choice: 这是……第三年
  rationale: 将省略系词的说明性短语译成现代汉语完整分句，同时保留它对前一纪年的补充说明作用。
- source_word: ἐπὶ Σίμωνος τοῦ ἀρχιερέως
  choice: 大祭司西门任内
  rationale: ἐπί加属格用于纪年时表示某人任职或掌权期间；“任内”符合这里的官职与年代语境。
theological_decisions:
- issue: 本节中 γραφή 的性质
  choice: 文书
  alternative: 文字；书写记录
  rationale: 法律和历史语境表明，这里所指的是正式书面文件，而不是作为圣经的“经文”；译作“文书”可避免不必要的神学联想。
- issue: 纪年体系是否明示
  choice: 不补出具体纪元名称
  alternative: 补作“塞琉古纪元第一百七十二年”
  rationale: 原文只说“第一百七十二年”。为保留原文表达范围，不把历史推定直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以下是……的内容”使引出文书正文的公式在汉语中清楚顺畅；分号保留两个纪年说明之间的紧密关系。
