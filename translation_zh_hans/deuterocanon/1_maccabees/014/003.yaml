lexical_decisions:
- source_word: ἐπορεύθη
  choice: 前去
  rationale: 该词在这里是简单的叙事性移动动词；“前去”自然庄重，又不额外加入“进军”等原文未明说的军事色彩。
- source_word: ἐπάταξεν
  choice: 攻打
  rationale: πάτασσω本义为击打、打击；宾语是军营时，“攻打”符合现代汉语军事语境，同时不擅自断定已经“击败”对方。
- source_word: παρεμβολὴν
  choice: 营地
  rationale: παρεμβολή在军事语境中指军营或营地；“营地”简洁清楚。
- source_word: συνέλαβεν
  choice: 俘虏了
  rationale: 该动词表示抓住、擒获；在军事背景下，“俘虏”比带现代司法色彩的“逮捕”更合适。
- source_word: ἤγαγεν
  choice: 带到
  rationale: ἄγω在此表示把某人带往另一人那里；“带到……那里”符合现代汉语习惯。
- source_word: Ἀρσάκην
  choice: 阿尔萨克
  rationale: 按希腊文Ἀρσάκης音译，并采用现代汉语中简明易辨的人名形式。
- source_word: ἔθετο
  choice: 关进
  rationale: τίθημι本义为放置；与“监牢”搭配时，现代汉语自然表达为“关进”，没有超出上下文所明确表达的拘禁含义。
- source_word: ἐν φυλακῇ
  choice: 监牢
  rationale: φυλακή可指看守、拘禁或监牢；在“将他……ἐν φυλακῇ”的结构中，监禁之意明确，“监牢”表达直接。
