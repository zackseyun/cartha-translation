  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
translation:
  language: zh_hans
  text: 罗马的人[a]，甚至远至斯巴达的人，都听说约拿单已经死了，就非常悲痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“听说”用单数动词，后面的“他们悲痛”却用复数。译文按集合性的意思处理，指罗马以及远至斯巴达的人听到了这个消息。
    reason: 原文语法说明
lexical_decisions:
- source_word: ἤκουσεν
  choice: 都听说
  rationale: 原文为单数动词，但其后“他们悲痛”为复数，且句中涉及罗马及远至斯巴达的人；译文按集合性或非人称意义表达，同时以脚注保留这一语法张力。
- source_word: ἐν Ῥώμῃ
  choice: 罗马的人
  rationale: ἐν加地名本义为“在罗马”；为使现代汉语主语清楚自然，译出所指的当地人。
- source_word: καὶ ἕως Σπάρτης
  choice: 甚至远至斯巴达的人
  rationale: ἕως加属格表示范围延伸至某处；“远至斯巴达”保留消息传播所达地域的意味，“甚至”自然体现递进。
- source_word: ἀπέθανεν
  choice: 已经死了
  rationale: 在“听说”的报道语境中，用“已经”表明约拿单的死亡先于听闻。
- source_word: ἐλυπήθησαν σφόδρα
  choice: 就非常悲痛
  rationale: ἐλυπήθησαν与σφόδρα表达强烈哀伤；“非常悲痛”庄重、自然，并保留程度。
