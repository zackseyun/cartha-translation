  text: He honored the holy things and increased the vessels of the sanctuary[a][b].
translation:
  language: zh_hans
  text: 他尊崇圣物[a]，又增添了圣所的器皿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他尊崇圣所”，或“他尊崇神圣之物”。希腊语“τὰ ἅγια”既可指圣物，也可引申指圣所。
    reason: lexical_alternative
  - marker: b
    text: 指在圣所敬拜礼仪中使用的神圣器皿或用具。
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: 圣物
  rationale: 中性复数既可指神圣之物，也可引申为圣所；正文译作“圣物”，保留较宽泛的直接含义，并避免与后句“圣所的器皿”重复。
- source_word: ἐδόξασεν
  choice: 使……得尊荣
  rationale: 该动词有使之得荣耀、尊崇之意；“使……得尊荣”既贴近其使役意味，也自然表达对圣物的尊崇。
- source_word: ἐπλήθυνεν
  choice: 增添了
  rationale: 该动词意为使数量增加；在圣所器皿的语境中，“增添了”比机械直译“使增多”更自然。
- source_word: τὰ σκεύη
  choice: 器皿
  rationale: 在祭祀语境中指供礼仪使用的器具；“器皿”是庄重且通行的中文表达。
- source_word: τῶν ἁγίων
  choice: 圣所的
  rationale: 此属格指出器皿所属的神圣场所；译作“圣所的”清楚表达礼仪语境，同时与前句“圣物”形成区别。
theological_decisions:
- issue: τὰ ἅγια 所指是圣物还是圣所
  choice: 正文采用“圣物”
  alternative: “圣所”或“神圣之物”
  rationale: 希腊文容许两种理解。正文采用直接的复数意义，脚注保留“圣所”的引申可能，不把歧义强行消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使圣物得尊荣”保留原文“使之得荣耀”的语义力度；“增添”符合历史叙事中扩充圣所器具的自然说法。
