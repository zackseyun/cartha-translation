revisions:
- from: 因为他和他的弟兄，以及他父家的人都坚定站立；他们击退了以色列的仇敌，使仇敌离开他们，又为他[a]奠定了自由。他们把这些事刻在铜版上，并把铜版安放在锡安山的一根石柱上。
  to: 因为他和他的弟兄，以及他父家的人都坚守；他们使以色列的仇敌离开他们，又为他[a]确立了自由。他们把这些事记在铜牌上，并把铜牌安放在锡安山的一根柱子上。
  rationale: 修订删除无原文依据的“石”，将军事—保护性的表达收束为较贴近ἀπʼ αὐτῶν的“使……离开他们”，并以更自然的“确立了自由”替换“奠定了自由”。脚注保留原有、且必要的αὐτῷ指代歧义说明。
