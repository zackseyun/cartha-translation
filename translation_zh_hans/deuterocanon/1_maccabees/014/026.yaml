base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: zh_hans
  text: 因为他和他的弟兄，以及他父家的人都坚守；他们使以色列的仇敌离开他们，又为他[a]确立了自由。他们把这些事记在铜牌上，并把铜牌安放在锡安山的一根柱子上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”原文为阳性单数，可能指人格化的以色列民族，也可能指西门本人。
    reason: 保留αὐτῷ的单数形式及其指代歧义，避免把民族性或个人性的解释直接写入正文。
lexical_decisions:
- source_word: ἐστήρισεν
  choice: 坚定站立
  rationale: 该动词可指使之坚固、确立或坚定不移；这里与他、弟兄和父家并列，译作“坚定站立”能自然表达他们在军事和政治压力下持守不退，同时保留原文单数动词与复合主语之间的不规则结构所产生的语义张力。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的弟兄
  rationale: 按通常的亲属义翻译；上下文没有充分理由扩大为一般族人。
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: 他父家的人
  rationale: “父家”保留闪族式家族表达，补出“的人”使现代汉语自然，并表明所指是家族成员。
- source_word: ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  choice: 击退了以色列的仇敌，使仇敌离开他们
  rationale: “击退”表达战争行为，后句明确保留ἀπό所含的离开、除去之意以及复数代词，而不把代词的具体所指无声固定下来。
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: 为他奠定了自由
  rationale: “奠定”体现使自由稳固成立的含义；“他”严格保留希腊文阳性单数与格代词，未在正文中改写为复数或中性国家称谓。
- source_word: κατέγραψαν ἐν δέλτοις χαλκαῖς
  choice: 把这些事刻在铜版上
  rationale: 铜制书写版所涉及的是铭刻；补出“这些事”承接前述功绩，比汉语中的无宾语表达清楚。
- source_word: ἔθεντο ἐν στήλῃ
  choice: 把铜版安放在一根石柱上
  rationale: στήλη可指柱碑或纪念碑；此处用普通读者易懂的“石柱”，并明确宾语为铜版。
- source_word: ἐν ὄρει Σιών
  choice: 在锡安山
  rationale: 采用现代汉语中地名与山名的标准表达。
theological_decisions:
- issue: ἔστησαν αὐτῷ ἐλευθερίαν中αὐτῷ的指代
  choice: 正文保留阳性单数“为他”，脚注说明可能指人格化的以色列
  alternative: 译作“为以色列奠定自由”或“为他们赢得自由”，也可能理解为专指西门
  rationale: 紧邻上文提到“以色列的仇敌”，民族自由在语境中很自然；但希腊文确为阳性单数，亦可能被理解为西门本人。正文与脚注共同保留这种真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“坚定站立”“奠定了自由”保持历史颂辞的正式语气；“他父家的人”兼顾源语习语与普通读者的理解。正文所有脚注标记均与脚注对应。
