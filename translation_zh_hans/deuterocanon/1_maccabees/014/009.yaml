  yaml_path: translation/deuterocanon/1_maccabees/014/009.yaml
  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
translation:
  language: zh_hans
  text: 长者们坐在公共广场上；他们都一同谈论美好的事；年轻人则穿上华美的装束和战袍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“荣耀和战争的衣袍”。这里的“荣耀”在穿戴的语境中，可能指华美的装饰或彰显尊荣的装束。
    reason: 说明δόξας的字面意义及其语境译法，并保留στολὰς πολέμου的原文意象。
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: 长者们
  rationale: 在公共生活的场景中，这个词可指社区中年长而受尊重的人；“长者”既保留社会身份色彩，也不把他们限定为正式官员。
- source_word: ἐν ταῖς πλατείαις
  choice: 在广场上
  rationale: πλατεῖαι可指城中的宽阔街道或公共空地；此处描绘众人安坐交谈的和平景象，“广场”自然贴切。
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: 大家一同谈论美好的事
  rationale: ἀγαθά含义宽泛，可指好事、福祉或有益的事务；不具体化为“繁荣”或“祝福”，以保留原文的开放性。ἐκοινολόγουν表达共同交谈，故译作“一同谈论”。
- source_word: οἱ νεανίσκοι
  choice: 年轻人
  rationale: 指群体中的年轻男性；现代汉语以“年轻人”表达自然，且上下文中的战争服装保留了其社会场景。
- source_word: δόξας
  choice: 华美的服饰
  rationale: 该词通常有“荣耀、荣美”之意，但在“穿上”以及与战袍并列的语境中，指可见的华美装束较为自然；译文采用语境义，脚注保留其字面表达。
- source_word: στολὰς πολέμου
  choice: 战袍
  rationale: 字面为“战争的衣袍/服装”，即军事装束。“战袍”比泛化为“盔甲”更贴近στολή的服装含义，也符合简洁庄重的汉语表达。
