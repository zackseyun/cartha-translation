  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: zh_hans
  text: 并且，犹太人和祭司都赞同西门永远作他们的领袖和大祭司，直到有一位可信的[a]先知兴起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信的”，也可译“真实的”。希腊语 πιστός 可指忠信、可靠或值得信赖。
    reason: 保留 πιστός 的词义幅度，以及“忠信的先知”“真实的先知”等可能理解。
lexical_decisions:
- source_word: εὐδόκησαν
  choice: 赞同
  rationale: 该动词表示赞许、认可或乐意接受；“赞同”既自然，也适合这里正式认可西门职分的语境。
- source_word: ἡγούμενον
  choice: 领袖
  rationale: 此词指西门的领导或治理身份；“领袖”保留其宽泛含义，不擅自限定为某一具体官职。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是该正式祭司职分在现代汉语圣经语体中的通行译法。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 直译并保留其持久、无定期终止的表达；下文“直到”所形成的限定和张力不予消解。
- source_word: ἕως τοῦ ἀναστῆναι
  choice: 直到……兴起
  rationale: 准确表达其所指的终点以及先知未来出现的前瞻意味。
- source_word: προφήτην πιστόν
  choice: 一位可信的先知
  rationale: πιστός可表示忠信、可靠、可信；此处“可信”自然表达这位先知的身份与话语可受信赖，同时通过脚注保留其他可能译法。
theological_decisions:
- issue: “永远”（εἰς τὸν αἰῶνα）与随后“直到……”之间的关系
  choice: 同时保留“永远”和“直到有一位……先知兴起”
  alternative: 把“永远”弱化为“长期”，或将后面的“直到”处理为不具限定作用的说明
  rationale: 希腊文本既使用看似永久性的授职措辞，又紧接一个以“直到”引出的界限。译文保留两者的张力，不替文本判定其逻辑关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“赞同让……作”兼顾正式认可与现代可读性；“永远……直到……”依原文保留刻意形成的语义张力。人名 Σίμων 译作现代汉语圣经读者熟悉的“西门”。
