lexical_decisions:
- source_word: εὐδόκησεν
  choice: 赞同
  rationale: 此处表示全体百姓作出认可、同意的集体决定；“赞同”自然地传达正式认可之意，又不过分强调情感上的喜悦。
- source_word: πᾶς ὁ λαός
  choice: 全体百姓
  rationale: 保留πᾶς的整体性；“百姓”符合历史叙事语境，也不把λαός过度解释为现代意义的“国家”或“民族”。
- source_word: θέσθαι Σίμωνι ποιῆσαι
  choice: 让西门……行事
  rationale: 希腊文结构较为紧缩，表达众人就西门应当做什么所作的决议；此译法在现代汉语中通顺，同时避免增添“任命”等原文未明说的含义。
- source_word: ποιῆσαι
  choice: 行事
  rationale: ποιέω含义宽泛；在此政治与行政语境中，“行事”比单说“做”更自然，也不将其具体化为某一种行动。
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照这些话
  rationale: 贴近希腊文“按照这些话”，保留其可能指前述言辞、规定或条款的开放性。
