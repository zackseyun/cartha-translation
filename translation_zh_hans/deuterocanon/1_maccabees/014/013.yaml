  text: And he ceased fighting against them on the earth[a], and their kings were crushed in those days.
translation:
  language: zh_hans
  text: 这地上再没有人与他们交战[a]，他们的诸王也在那些日子被击溃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不再在这地上与他们交战。”原文动词为单数，但本句未明示主语；按上下文也可理解为不再有人与他们交战。
    reason: 保留原文未在本句明示主语所带来的语境解释空间。
lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν αὐτούς
  choice: 再没有人与他们交战
  rationale: ἐκλείπω与现在分词πολεμῶν连用，表示交战者不复存在或交战活动止息。结合上下文，以“再没有人……交战”自然表达这种结果，同时避免误把“他”当作明确的语法主语。
- source_word: ἐπὶ τῆς γῆς
  choice: 境内
  rationale: γῆ可指“大地”或特定的“土地、疆域”；本段为犹太地安定的历史政治语境，“境内”最贴切。
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: 他们的众王
  rationale: 保留复数冠词和属格代词，指与前述敌对群体相关的诸王。
- source_word: συνετρίβησαν
  choice: 被击溃了
  rationale: συντρίβω的被动式在军事语境中表示遭到彻底打击或摧毁；“被击溃”既保留被动意味，也符合现代汉语。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 在那些日子
  rationale: 按原文保留常见的时间表达，不缩并为较笼统的“当时”。
