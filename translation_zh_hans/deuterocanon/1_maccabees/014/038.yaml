lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文并增添德米特里王的举措；现代汉语用“也”比句首“并且”更自然。
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: 德米特里王
  rationale: 采用现代汉语常见的姓名加王号表达，清楚保留其君王身份。
- source_word: ἔστησεν
  choice: 确认
  rationale: ἵστημι在此与大祭司职分连用，有确立、使之稳固之意；结合上下文，德米特里是在认可并巩固他已有的地位，而非创设该职分。“确认”保留政治批准的意味。
- source_word: αὐτῷ τὴν ἀρχιερωσύνην
  choice: 他担任大祭司
  rationale: ἀρχιερωσύνη指大祭司的职分或职位。汉语将原文“为他确认大祭司职分”自然转换为“确认他担任大祭司”，既准确又易懂。
- source_word: κατὰ ταῦτα
  choice: 照此
  rationale: 该短语回指前述安排、条款或情形。“照此”简洁保留这种回指关系，不额外限定究竟是条款还是一般情形。
