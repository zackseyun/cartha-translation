  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: zh_hans
  text: 此后，西门派努美尼乌斯前往罗马；他带着一面重达一千弥那[a]的大金盾，为要与罗马人确立盟约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 弥那是古代的重量单位；这里所说的重量表明，这是一件极其沉重且贵重的外交礼物。
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 此后
  rationale: 自然表达叙事中的时间承接，同时保留“这些事以后”的含义。
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 这里是西门差遣使者赴罗马，“派”比一般的“送”更符合外交语境。
- source_word: Νουμήνιον
  choice: 努美尼乌斯
  rationale: 按希腊语人名音译，并采用适合现代汉语的形式。
- source_word: εἰς Ῥώμην
  choice: 前往罗马
  rationale: 准确表达方向，现代汉语自然通顺。
- source_word: ἔχοντα
  choice: 带着
  rationale: 该分词修饰努美尼乌斯，表示他随身带去外交礼物。
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: 一面……的大金盾
  rationale: ἀσπίς译为“盾”，χρυσῆν表明材质为金，μεγάλην描述其大；“大金盾”简洁自然。
- source_word: ὁλκὴν μνῶν χιλίων
  choice: 重达一千弥那
  rationale: ὁλκή在此指重量；“重达”也传达这一重量非同寻常。
- source_word: εἰς τὸ στῆσαι
  choice: 为要……确立
  rationale: 保留冠词不定式所表达的目的；στῆσαι在外交语境中可指使盟约成立或得到正式确认。
- source_word: πρὸς αὐτοὺς
  choice: 与罗马人
  rationale: 代词所指是罗马方面；在中文中明说“罗马人”可避免指代不清。
- source_word: τὴν συμμαχίαν
  choice: 盟约
  rationale: συμμαχία指政治或军事联盟；“盟约”既能表达正式协议，也符合庄重的历史叙事语体。
