base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/010.yaml
  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
translation:
  language: zh_hans
  text: 他给各城供应粮食，又为各城配备防御器材[a]，直到他荣耀的名传扬到地极[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “防御器材”也可泛指用于设防或加固各城的装备和物资。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“直到他荣耀的名被称说到地极”，意思是他荣耀的名远近闻名。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχορήγησεν
  choice: 供应
  rationale: 该动词表示供给所需之物，常含承担费用、充足供应之意；“供应”适合城市治理与防务语境。
- source_word: βρώματα
  choice: 粮食
  rationale: 字面指食物；在向各城提供防务保障的语境中，“粮食”自然表达储备性食品，又不扩大为泛指一切补给。
- source_word: ἔταξεν
  choice: 配备
  rationale: 该词基本义为安置、安排；与宾语“各城”和防御器材连用时，表示使各城获得相应装备。“配备”传达实际结果，同时未将其窄化为单纯建造城防。
- source_word: σκεύεσιν ὀχυρώσεως
  choice: 防御器材
  rationale: σκεύεσιν泛指器具、装备，ὀχυρώσεως指设防或加固；“防御器材”保留其具体装备色彩，却不擅自限定为兵器、工事或攻城器械。
- source_word: ἕως ὅτου
  choice: 直到
  rationale: 保留原文表示发展所达到程度或节点的连接方式，不改写成明确的目的关系。
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: 他荣耀的名
  rationale: 保留原文“名”与“荣耀”的属格关系及庄重语气，避免完全化约为普通的“名声”。
- source_word: ὠνομάσθη
  choice: 传扬
  rationale: 字面为“被称名、被提及”；此处结合“到地极”表示其名广为人知。“传扬”在现代汉语中自然，同时脚注保留其较直译的表达。
- source_word: ἕως ἄκρου γῆς
  choice: 到地极
  rationale: 对应原文单数“地的尽头”，采用庄重而通行的汉语表达“地极”。
