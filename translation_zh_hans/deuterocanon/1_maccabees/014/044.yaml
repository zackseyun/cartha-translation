base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: zh_hans
  text: 百姓和祭司中任何人都不得废除这些规定中的任何一项，不得反驳他将要说的话，也不得不经他就在境内召集集会[a]，也不得穿着紫色服饰或佩戴金扣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集集会”也可能译作“组织结社”或“组织派系”。这里的希腊语可指聚集、结社，也可能指带有对抗性质的集团。
    reason: lexical_alternative
  - marker: b
    text: 紫色服饰和金扣是身份、官职或尊荣的标志。
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: 任何人都不得
  rationale: 以自然、正式的现代汉语表达制度性的禁止，同时保留原文涵盖百姓和祭司的普遍范围。
- source_word: ἀθετῆσαί τι τούτων
  choice: 废除这些规定中的任何一项
  rationale: ἀθετέω在此指取消、废止或使既定决议失效；结合上文法令语境，将τούτων明示为“这些规定”，比“这些事”更清楚。
- source_word: ἀντειπεῖν
  choice: 反对
  rationale: 该词指发言抵制或提出异议；“反对”既包含言语上的抗辩，也不把含义缩窄为单纯指出矛盾。
- source_word: τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: 他所说的话
  rationale: 未来被动分词字面上是“将由他说出的事”；在授予持续权威的法令中，汉语以“他所说的话”自然表达其有效范围，不必生硬标出未来时。
- source_word: ἐπιστρέψαι συστροφὴν
  choice: 召集聚会
  rationale: 这是较难确定的短语；συστροφή可指集会、结社，也可能带有党派或骚动色彩。正文采用中性的行政语境译法，并以脚注保留较强的可能含义。
- source_word: ἐν τῇ χώρᾳ ἄνευ αὐτοῦ
  choice: 未经他准许就在境内
  rationale: ἄνευ αὐτοῦ字面为“没有他”；在法定权限语境中理解为没有他的参与或授权。“未经他准许”使汉语关系清楚，但不暗示神学权威。
- source_word: περιβαλέσθαι πορφύραν
  choice: 身穿紫袍
  rationale: πορφύρα在此指作为尊荣标志的紫色服饰；“紫袍”简洁、可懂，也传达其礼仪和身份色彩。
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: 佩戴金扣
  rationale: 动词与名词合指扣上或佩戴金制饰扣；“金扣”保持器物类别的宽泛性，避免过度确定为胸针或带扣。
theological_decisions:
- issue: 禁令的性质
  choice: 译为确立西门专属政治与礼仪权限的法令性禁令
  alternative: 把召集συστροφή明确译成煽动叛乱或组织反叛集团
  rationale: 本节处于授予西门治理权和尊荣的公共决议中；希腊文虽容许较负面的理解，却未明确使用“叛乱”一词，因此正文不加入额外的道德或神学判断。
- issue: “未经他”所表达的权限
  choice: 译作“未经他准许”，表达需有其授权
  alternative: 译作“没有他在场”或“撇开他”
  rationale: 上下文关乎法定权力，授权义最合语境；但原文简略，可能兼含不经其参与之意，故不进一步说明权限的具体程序。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保持法令式的连续禁止结构；“百姓”“祭司”“境内”等词符合历史政治语境。脚注分别保留συστροφή的词义歧义，并说明紫袍与金扣的文化功能。
