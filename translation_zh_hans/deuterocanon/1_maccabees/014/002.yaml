  yaml_path: translation/deuterocanon/1_maccabees/014/002.yaml
  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: zh_hans
  text: 波斯和米底亚王阿尔撒息听说德米特里已经进入他的疆域，就派了一个官长去活捉他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 这里指听到关于德米特里的消息；“听说”既直接又符合现代汉语叙事习惯，不额外断定消息传递的具体方式。
- source_word: Ἀρσάκης
  choice: 阿尔撒息
  rationale: 按希腊文人名音译，并采用中文圣经及历史文献中较常见、易辨认的形式。
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: 波斯和米底亚王
  rationale: 忠实表达其统治范围，同时采用自然、简洁的现代汉语王号结构。
- source_word: ἦλθεν
  choice: 已经进入
  rationale: 在“听说”所引出的内容中，用“已经”体现德米特里的到来先于王的反应；“进入”也与后面的疆域自然搭配。
- source_word: τὰ ὅρια αὐτοῦ
  choice: 他的疆域
  rationale: ὅρια字面可指边界，也可转指边界以内的领土；本处德米特里进入的是王所控制的地域，因此译作“疆域”。
- source_word: ἀπέστειλεν
  choice: 派了
  rationale: 比单纯的“送去”更准确地表达差遣属下执行任务，适合王室叙事语境。
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: 一个官长
  rationale: ἄρχων含义较宽，可指统治者、首领或高级官员；“官长”保留这种宽泛性，避免把其职位过度限定为军事将领。
- source_word: συλλαβεῖν
  choice: 捉
  rationale: 表示拘捕或擒获；与ζῶντα合译为惯用语“活捉”，自然且符合此处政治军事语境。
- source_word: ζῶντα
  choice: 活
  rationale: 明确要求在其活着时将其擒获；与“捉”组合为“活捉”，准确传达原文重点。
