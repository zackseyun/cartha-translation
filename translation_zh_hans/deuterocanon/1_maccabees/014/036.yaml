base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: zh_hans
  text: 在他的日子，他手中的事得以顺利成就：他从他们的土地上清除了列邦，也清除了那些在耶路撒冷大卫城中的人；这些人为自己筑了一座堡垒[a]，常从那里出来，玷污圣所四周的区域，并对那里的洁净造成极大的损害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”或作“阿克拉堡”，指耶路撒冷那座设防的城堡。
    reason: 说明 ἄκρα 在马加比时代的耶路撒冷语境中可能具有专名性质。
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: 他手中诸事亨通
  rationale: 保留“在他手中”的原文意象，同时以“诸事亨通”表达无人称被动式所表示的顺利成功，不把句法过度改写成单纯的“他成功了”。
- source_word: τοῦ ἐξαρθῆναι
  choice: 得以……清除……并除掉
  rationale: 不定式说明所成就的结果。按两个宾语分别译作“清除”和“除掉”，中文自然，也不强行限定为杀灭或驱逐。
- source_word: τὰ ἔθνη
  choice: 列邦
  rationale: 表达非犹太诸民族或外邦势力，又保留“各国、各族”的基本词义，避免加入更强的宗教标签。
- source_word: χώρα
  choice: 土地
  rationale: 对应这里广义的地域或国土；“他们的土地”保留希腊文代词所具有的指代张力。
- source_word: ἄκραν
  choice: 一座堡垒
  rationale: 按普通名词义翻译为设防堡垒；其在本段可能特指耶路撒冷的阿克拉堡，另在脚注说明。
- source_word: ἐμίανον
  choice: 玷污
  rationale: 准确保留圣所语境中的礼仪性污秽含义。
- source_word: κύκλῳ τῶν ἁγίων
  choice: 圣所周围
  rationale: 原短语较压缩，字面可理解为“圣物周围”或“圣地周围”；结合耶路撒冷圣殿语境，译作“圣所周围”清楚而不过度展开。
- source_word: πληγὴν μεγάλην
  choice: 严重破坏
  rationale: 这里是对洁净状态造成重大伤害的比喻性说法；中文用“严重破坏”比直译“大伤口”自然。
- source_word: ἁγνείᾳ
  choice: 那里的洁净
  rationale: 保留礼仪洁净的含义；“那里”承接圣所周围的范围，但不把名词抽象化为一般的“圣洁”。
theological_decisions:
- issue: 圣殿语境中的礼仪用语
  choice: 采用“玷污”“圣所”“洁净”等礼仪性词语
  alternative: 采用“败坏”“神圣地方”“纯洁”等一般性表达
  rationale: 希腊文强调圣殿范围内的礼仪性污染和洁净；保留这种措辞，才能呈现本节以圣所为中心的张力。
- issue: “他们的土地”的指代
  choice: 保留“他们的土地”
  alternative: 明确译作“以色列人的土地”或“列邦自己的土地”
  rationale: 希腊文 αὐτῶν 的具体所指在紧邻句法与较大语境之间存在张力；正文不擅自消除这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他手中诸事亨通”略带经典语体，以保留希腊文的手之意象；其余句式尽量顺畅，并用分号区分被清除者与其行为的说明。
