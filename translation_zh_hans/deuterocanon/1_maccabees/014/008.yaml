  yaml_path: translation/deuterocanon/1_maccabees/014/008.yaml
  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: zh_hans
  text: 他们平安地耕种自己的土地；土地出产作物，田野[a]的树木也结出果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平原”。希腊语πεδίων可指平原，也可泛指开阔的田地或乡野。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  choice: 耕种
  rationale: 表示持续从事农耕劳作；“耕种”自然、明确，并保留主动进行的意味。
- source_word: γῆν
  choice: 土地
  rationale: 此处指他们用于耕作的土地，而非泛指大地或国家。
- source_word: μετʼ εἰρήνης
  choice: 平安地
  rationale: 表达耕作时所处的和平、安稳状态，兼具无战乱与安全之意。
- source_word: ἐδίδου
  choice: 出产
  rationale: 希腊文未完成时态表示持续或惯常的产出；汉语“出产”在上下文中自然涵盖这一意味。
- source_word: γενήματα
  choice: 作物
  rationale: 泛指土地的农产，与下句树木所结的“果实”相区别。
- source_word: ξύλα
  choice: 树木
  rationale: 后接“果实”，可知所指是活的结果树木，而非木材。
- source_word: πεδίων
  choice: 田野
  rationale: πέδιον可指平原或开阔田地；“田野”符合农业语境且为现代汉语自然表达，同时以脚注保留“平原”的可能。
- source_word: καρπὸν
  choice: 果实
  rationale: 与树木搭配时，“果实”最直接准确。
