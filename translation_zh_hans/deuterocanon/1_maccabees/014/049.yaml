  text: And copies of them were to be placed in the treasury[a], so that Simon and his sons might have them.
translation:
  language: zh_hans
  text: 至于这些文书的副本，应存放在财库里[a]，以便西门和他的儿子们得以持有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “副本”也可译作“抄本”或“誊本”；希腊文指文书的复制件。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφα
  choice: 抄本
  rationale: 该词指文书的复制件或副本；“抄本”既自然，又保留其文书复制品的含义，不限定具体复制方式。
- source_word: θέσθαι
  choice: 要存放
  rationale: 不定式承接上文所作的决定或规定；“要存放”在现代汉语中自然表达这种指令性，并符合文书入库的语境。
- source_word: γαζοφυλακίῳ
  choice: 库房
  rationale: 该词可指财库或存放贵重物品的房室；本节涉及保存文书，“库房”既保留实体储藏空间的含义，也避免误解为抽象的财政机构。
- source_word: ὅπως
  choice: 好让
  rationale: ὅπως引出目的；“好让”清楚、自然地表达目的关系。
- source_word: ἔχῃ
  choice: 持有
  rationale: 动词的宾语由前面的“抄本”补出；“持有”比单纯“有”更适合正式文书的保管与占有语境，同时不额外限定所有权。
