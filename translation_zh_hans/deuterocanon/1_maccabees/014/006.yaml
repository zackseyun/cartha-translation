  text: And he enlarged the borders of his nation, and gained control of the country.
translation:
  language: zh_hans
  text: 他为本民族扩展疆界，并控制了那地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: 扩展了
  rationale: 原义为“拓宽、使宽广”；用于疆界时，“扩展”符合现代汉语的领土语境，也保留行动及其结果。
- source_word: τὰ ὅρια
  choice: 疆界
  rationale: 指边界或界限；“疆界”准确表达国家或民族领土边界，并与“扩展”自然搭配。
- source_word: τῷ ἔθνει αὐτοῦ
  choice: 自己民族的
  rationale: τῷ ἔθνει 是利益与格的形式，可理解为“为自己的民族”，而在汉语中译作“自己民族的疆界”更自然，同时保留民族政治共同体的含义。
- source_word: ἐκράτησεν
  choice: 掌控了
  rationale: κρατέω 后接属格可表示取得并保持支配权；“掌控”传达实际控制，不额外断定法律上的所有权。
- source_word: τῆς χώρας
  choice: 这片国土
  rationale: χώρα 可指土地、地区或国土；“这片国土”适合本节的政治领土语境，并避免与前半句“疆界”重复。
