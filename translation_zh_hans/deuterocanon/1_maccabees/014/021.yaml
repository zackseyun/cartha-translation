  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: zh_hans
  text: 那些被派往我国人民那里的使者，向我们报告了你们的荣耀和尊荣[a]；我们因他们的到来而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被派往我国人民那里的使团，向我们报告了你们的荣耀和尊荣……”希腊语οἱ πρεσβεῖαι既可指使团或外交使命，也可指使者本人；正文采用后一种理解，因为本节随后提到“他们的到来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι οἱ ἀποσταλέντες
  choice: 那些奉派……的使者
  rationale: 原文形式可指外交使团，也可按成员理解为使者；后文以复数代词指其到来，正文采用人物义更自然。“奉派”也保留了分词所表达的受差遣身份。
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: 到我们人民那里去
  rationale: δῆμος在此指作为政治共同体的人民；“我们人民”既通顺，也不把含义收窄为议会或群众。
- source_word: ἀπήγγειλαν ἡμῖν
  choice: 向我们报告了
  rationale: 该动词在外交语境中带有正式传达、报告之意，“报告”比“告诉”更符合文体。
- source_word: περὶ τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: 你们的荣耀和尊荣
  rationale: 直译并保留δόξα与τιμή的并列。“尊荣”突出公开给予的敬重，避免两个词都译作“荣耀”。
- source_word: ηὐφράνθημεν
  choice: 我们甚是欢喜
  rationale: 表达强烈而正式的喜悦；“甚是欢喜”自然庄重，又不显得过分宗教化。
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: 他们到来时
  rationale: ἐφόδος在此可指前来、抵达或访问；“到来时”保留方向未明的含混，不擅自补出“返回”。
