review_pass:
  verdict: revise
  source_fidelity: “这份文书”“刻在铜版上”“圣所的院内”基本符合希腊文。可是原文第二个动作“立起它们”的宾语是复数的铜版（αὐτάς），现译将“立在”紧接“文书”，容易使文书成为被立起的对象。εἶπαν的直接语义为“说”，在此可带正式决议语境，但不必改作较强的“决定”。
  naturalness: 原译总体庄重自然；补出“并把铜版”后，两个动作的对象清楚，句法也更顺畅。“安全的地方”比“稳妥的地方”更贴近此处形容保存地点的“可靠、稳固”。
  terminology: “文书”“铜版”“圣所”“院内”均适合正式文献语境。保留“圣所”可避免把τῶν ἁγίων的范围过度窄化为具体建筑。
