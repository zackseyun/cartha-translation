    rationale: στῆσαι αὐτάς中的αὐτάς为阴性复数，指前面的δέλτοις（铜版），不是γραφήν（文书）。中文应明确是把铜版立起。
  - severity: low
    issue: “决定”较原文εἶπαν更具决议性。
    rationale: 上下文确有正式决议背景，但原文仍使用“说”；译作“说，应当”既保留正式语气，也避免强化动词。
