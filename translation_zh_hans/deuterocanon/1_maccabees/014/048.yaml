  text: And they said that this document should be put on bronze tablets and set up in the court of the sanctuary, in a secure place.
translation:
  language: zh_hans
  text: 他们又说，应当把这份文书刻在铜版上，并把铜版立在圣所的院内一个安全的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν
  choice: 决定
  rationale: 此处并非单纯叙述“说”，而是在记载正式决议；现代汉语用“决定”更自然地表达其施行意图。
- source_word: τὴν γραφὴν ταύτην
  choice: 这份文书
  rationale: γραφή在这里指前述正式书面文件或法令，“文书”兼顾正式语体与可读性。
- source_word: θέσθαι ἐν δέλτοις χαλκαῖς
  choice: 刻在铜版上
  rationale: 字面为“置于铜版上”；在碑版文书语境中指将文字铭刻其上，用“刻在”准确自然。
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  choice: 在圣所的院内
  rationale: περίβολος指围合区域或院落，τὰ ἅγια在此指圣所；译文保留其空间关系。
- source_word: ἐν τόπῳ πιστῷ
  choice: 一个稳妥的地方
  rationale: πιστός在此描述地点可靠、安全，适合保存文书；“稳妥”既包含安全也包含可靠之意。
theological_decisions:
- issue: τῶν ἁγίων所指的圣域范围
  choice: 圣所
  alternative: 圣殿
  rationale: 希腊语是复数中性名词“圣物/圣地”，在此与院落相连，宜概括译为“圣所”，避免将其范围过度限定为圣殿建筑本身。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持正式决议文书的语气；不添加原文没有的解释性信息。
