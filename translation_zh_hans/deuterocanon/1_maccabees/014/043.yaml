  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: zh_hans
  text: 并且由他掌管神圣之事[a]，众人都要听从他[b]；境内的一切文书都要以他的名义写成[c]；他可以穿紫色，佩戴黄金[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神圣之事”也可译作“圣所”或“圣物”。希腊文直译为“圣的事物”，是一个范围较宽的复数表达。
    reason: lexical_alternative
  - marker: b
    text: 直译为“为众人所听”。在此权威和行政语境中，指众人应当听从他。
    reason: lexical_alternative
  - marker: c
    text: “以他的名义”表示文书是在他的权威之下、以他的名义写成；原文没有具体说明签发程序。
    reason: cultural_note
  - marker: d
    text: 紫色和黄金是显赫地位与官方尊荣的标志。
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ ... περὶ
  choice: 由他负责
  rationale: 该结构可表示关心或照管；在授予西门职权的法令语境中，“负责”自然表达正式的管理责任。
- source_word: τῶν ἁγίων
  choice: 圣物
  rationale: 希腊文为中性复数，泛指分别为圣之物，也可能涵盖圣所及相关宗教事务；正文保留其宽泛性，脚注说明其他可能。
- source_word: ἀκούηται ὑπὸ πάντων
  choice: 众人都要听从他
  rationale: 字面为“被众人听”；在权威与行政语境中表示其命令应受重视和服从。“听从”既保留听的意象，也传达实际语力。
- source_word: συγγραφαὶ
  choice: 文书
  rationale: 此词可指书面文件、契约或正式记录；“文书”适合行政语境，同时避免限定为某一种文件。
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: 以他的名义签发
  rationale: 该表达指文件以某人的名义或权威发布；“签发”明确呈现官方文书语境，但不把文件种类说得过窄。
- source_word: πορφύραν
  choice: 身穿紫袍
  rationale: 原文直指紫色衣饰；汉语以“紫袍”自然呈现作为高位标志的紫色服装。
- source_word: χρυσοφορῇ
  choice: 佩戴金饰
  rationale: 动词意为穿戴或佩带黄金；“佩戴金饰”准确表达其动作和身份象征。
theological_decisions:
- issue: τῶν ἁγίων的范围
  choice: 圣物
  alternative: 圣所；神圣事务
  rationale: 复数形式并未明确限定为圣殿建筑，也可能包括与圣所有关的物品或事务，因此正文不将其收窄为单一的“圣所”。
translation_notes:
  register: 采用现代、庄重而易懂的法令语体。以分号呈现四项并列授权；“由他负责”“都要听从”“以他的名义签发”“可以身穿”体现法令规定。正文各脚注标记按内容顺序排列，并全部出现。
