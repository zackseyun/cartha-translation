base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: zh_hans
  text: 他隆重地接待了他，把他引见[a]给自己所有的朋友[b]，又送给他礼物，并命令自己的朋友和军队也同样服从他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他介绍给”。这个希腊动词可指介绍某人，也可指正式把某人引见给众人。
    reason: lexical_alternative
  - marker: b
    text: “朋友”在希腊化王室语境中可能带有宫廷政治含义，指君王核心圈子中的成员，而不只是私人朋友。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο ... ἐνδόξως
  choice: 隆重地接待
  rationale: 合译动词和副词，既表达接纳、迎接某人，也体现其受到尊荣礼遇的宫廷语境；用语自然而不过度渲染。
- source_word: συνέστησεν
  choice: 引见
  rationale: 此处指把某人介绍或正式呈现在一群相关人士面前。“引见”简洁、庄重，也符合政治交往场景。
- source_word: φίλοις
  choice: 朋友
  rationale: 保留希腊词的字面表达，不直接把可能存在的希腊化宫廷头衔含义写入正文；相关文化含义以脚注说明。
- source_word: δόματα
  choice: 礼物
  rationale: 准确对应赠物之义，是现代汉语中自然、清楚的表达。
- source_word: δυνάμεσιν
  choice: 军队
  rationale: 复数在此指统治者麾下的军事力量；“军队”比抽象的“力量”更符合上下文。
- source_word: ὑπακούειν
  choice: 服从
  rationale: 在命令的语境中表达听从、遵命之意，力度与原文相称。
- source_word: ὡσαύτως
  choice: 也同样
  rationale: 保留原文的附加和比较意味，同时不强行限定究竟与前文哪一项行为作比较。
