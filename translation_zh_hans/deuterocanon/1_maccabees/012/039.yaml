  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: zh_hans
  text: 特利丰意图统治亚细亚[a]，戴上王冠，并向安条克王下手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指当时所说的希腊化王国疆域，并非现代所称的亚洲大陆。
    reason: cultural_note
  - marker: b
    text: 或译：“攻击安条克王”；直译为“向安条克王伸出手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: 想要
  rationale: 这里表示特利丰的意图和图谋，而不是寻找或询问；“想要”保留目的性，又不暗示他已经成功。
- source_word: βασιλεῦσαι τῆς Ἀσίας
  choice: 统治亚细亚
  rationale: βασιλεύω可表示作王、掌权或统治；结合后文戴上王冠，“统治”自然清楚，也避免重复表达登基之意。Ἀσία按古代地名译作“亚细亚”。
- source_word: περιθέσθαι τὸ διάδημα
  choice: 给自己戴上王冠
  rationale: 中间语态表明是戴在自己头上；διάδημα指君王的冠冕或王室头带。“王冠”既传达王权含义，也便于现代读者理解。
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: 对安条克王下手
  rationale: 原文直译为“向安条克伸出手”，在此是带敌意的行动。“下手”保留行动方式未明的宽泛性，同时自然表达谋害或攻击之意。
- source_word: τὸν βασιλέα
  choice: 安条克王
  rationale: 原文以同位语明确称安条克为王；汉语合并为“安条克王”，简洁而完整。
