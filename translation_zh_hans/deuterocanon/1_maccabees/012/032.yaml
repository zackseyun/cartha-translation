  text: And after breaking camp, he came to Damascus and traveled through the whole region.
translation:
  language: zh_hans
  text: 他拔营后，来到大马士革，又走遍了整个地区。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζεύξας
  choice: 拔营后
  rationale: 该分词常指拔营启程，带有行军语境；“拔营后”既保留这一具体意味，也符合现代中文叙事习惯。
- source_word: ἦλθεν εἰς Δαμασκόν
  choice: 来到大马士革
  rationale: ἔρχομαι 与表示目的地的介词短语连用，表示到达或前往；“来到”自然简洁，并保留原文叙述视角可容许的表达。
- source_word: διώδευσεν
  choice: 走遍了
  rationale: 该动词表示行经、穿行某地；结合“整个地区”，译作“走遍了”自然地表达其在全境行走的范围。
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: 整个地区
  rationale: χώρα 可指土地、乡间或地区；此处范围未被进一步限定，“地区”避免将其误解为现代国家。
- source_word: καὶ ... καὶ
  choice: ……又……
  rationale: 两个 καί 推进连续行动；中文以逗号承接首项，并用“又”连接后一项，既保留叙事顺序，也避免生硬重复“并且”。
