  yaml_path: translation/deuterocanon/1_maccabees/012/027.yaml
  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: zh_hans
  text: 太阳落山后，约拿单命令跟随他的人整夜保持清醒，守在武器旁，为作战做好准备；并在营地四周布置了哨兵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: 太阳落山后
  rationale: 以自然的现代汉语表达日落已经发生，并交代命令发出的时间。
- source_word: ἐπέταξεν
  choice: 命令
  rationale: 保留军事语境中权威下令的力度。
- source_word: τοῖς παρʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 贴近“在他身边、与他同在的人”，又自然表明这是随行人员，而不额外限定其身份。
- source_word: γρηγορεῖν
  choice: 保持清醒
  rationale: 保留其基本的醒着、警醒之意，并避免与后文另行布置哨兵混同。
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: 武器不离身
  rationale: 以简洁自然的汉语传达武器随时在手、处于戒备状态的军事意象。
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: 预备作战
  rationale: 符合眼前战术情境；“作战”比泛指长期冲突的“战争”更准确。
- source_word: διʼ ὅλης τῆς νυκτός
  choice: 整夜
  rationale: 简明保留整个夜晚的持续范围。
- source_word: ἐξέβαλεν προφύλακας
  choice: 布置了哨兵
  rationale: 按军事惯用义翻译部署外围警戒人员，而不拘泥于字面的“派出”。
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: 在营地四周
  rationale: 清楚表达哨兵环绕军营布置的位置。
