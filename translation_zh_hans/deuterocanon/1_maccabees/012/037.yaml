base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/037.yaml
  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: zh_hans
  text: 众人聚集起来建造；东边溪谷那里的城墙有一段倒塌了[a]，他便修复了名叫“哈斐拿他”的地方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构简略，也可理解为“东边季节性水道（或其沟谷）一带的城墙”。这里译作“溪谷”的希腊词可指季节性水流，也可指水流经过的沟谷或河床。
    reason: lexical_alternative
  - marker: b
    text: “哈斐拿他”是音译的地名；希腊原文没有进一步说明它究竟是哪一类地点或建筑物。
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν
  choice: 众人聚集起来
  rationale: 该不定过去时被动形式在这里作不及物用，表示众人为共同目的聚集；“众人聚集起来”自然保留了复数主语。
- source_word: τοῦ οἰκοδομεῖν
  choice: 进行修建
  rationale: 带冠词的不定式在此表示目的；原文只说“修建”，并未明确说“重建”，因此不增添这一含义。
- source_word: ἔπεσεν
  choice: 倒塌了
  rationale: 原义为“倒下”；用于城墙时译作“倒塌”符合现代汉语表达，又不扩大动作含义。
- source_word: τοῦ τείχους
  choice: 一段城墙
  rationale: τείχος指城墙或防御墙。此处属格结构较压缩，汉语补出“一段”可自然表达城墙有一部分倒塌，同时不把整道墙都解释为倒塌。
- source_word: τοῦ χειμάρρου
  choice: 旱谷旁
  rationale: χείμαρρος可指季节性水流，也可指其河床或沟谷；在黎凡特地理语境中，“旱谷”能兼顾季节性水道及谷地的含义，“旁”则自然表达城墙与旱谷的关系。
- source_word: τοῦ ἐξ ἀπηλιώτου
  choice: 东边
  rationale: ἀπηλιώτης表示东方或东风；这里按方位理解，但不强行断定究竟修饰城墙还是旱谷，因此以简洁的“东边”表达。
- source_word: ἐπεσκεύασεν
  choice: 修复了
  rationale: 该词表示修理、恢复；“修复”适合受损城防的语境，也不暗示完全拆除重建。
- source_word: τὸ καλούμενον Χαφεναθά
  choice: 那称为“哈斐拿他”的地方
  rationale: 中性冠词与分词所指可能是地点或某种建筑物；正文以“地方”作最低限度的汉语补足，并用音译保留专名，脚注说明原文未明确其类别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以分号连接聚集修建与城墙倒塌两件相继叙述的事；保留前半句复数“众人”与后半句单数“他”的主语转换，不擅自补出人物姓名。对压缩的地理短语采用流畅正文并以脚注保留其句法和词义上的不确定性。
