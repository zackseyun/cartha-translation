  yaml_path: translation/deuterocanon/1_maccabees/012/024.yaml
  text: And Jonathan heard that Demetrius’s commanders had returned with a much larger force than before to make war against him.
translation:
  language: zh_hans
  text: 约拿单听说，底米丢的将领带着比先前更多的兵力回来，要与他交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 此处指约拿单得知消息；“听说”既保留听闻之义，也符合现代汉语叙事习惯。
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: 底米丢的将领
  rationale: ἄρχοντες 可指首领、官长或掌权者；军事语境中译为“将领”最能体现其带兵作战的职能。
- source_word: ἐπέστρεψαν
  choice: 回来
  rationale: 动词表示返回；汉语无需用专门的过去完成形式，借“听说……回来”即可自然呈现先于听闻或作为消息内容的行动。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 带着……更多的兵力
  rationale: δύναμις 在军事叙事中指军力或部队；结合后面的比较语译作“兵力”，避免理解为抽象能力。
- source_word: ὑπὲρ τὸ πρότερον
  choice: 比先前更多
  rationale: 该短语表达与此前相比有所增加；与“兵力”搭配为“比先前更多”，自然且忠实。
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: 要与他交战
  rationale: 带冠词的不定式表目的；“要”明确目的，“与他交战”准确表达 πολεμέω 的军事敌对含义。
