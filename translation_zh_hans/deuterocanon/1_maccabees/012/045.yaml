base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: zh_hans
  text: “现在，把他们遣回各自的家去；你却要为自己挑选少数几个人，让他们随你同行。你跟我到多利买去，我就把那城交给你，也把其余的堡垒、大批军队和所有主管事务的人[a]交给你。然后我会转回去，再离开[b]；因为我正是为此而来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有官员”。希腊原文直译是“所有被派管理各项需要（或事务）的人”。
    reason: lexical_alternative
  - marker: b
    text: “转回去，再离开”在希腊原文中较为简略，表示说话者先转回或返回，然后离去，但没有说明转回哪里或离往何处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: 请让他们各自回家
  rationale: ἀπόστειλον在语境中指遣散并让众人返回住处；“各自回家”自然表达εἰς τοὺς οἴκους αὐτῶν，而不局限于实体房屋。
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  choice: 你要为自己挑选少数几个人
  rationale: “为自己”体现中间语态所含的为己选取之意；ἄνδρας虽处军事语境，但原文只说“人”，故不直接译作“士兵”。
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: 你同我到多利买去
  rationale: δεῦρο在这里是召请对方同行；“同我……去”符合现代汉语，并保留目的地多利买。
- source_word: παραδώσω σοι αὐτὴν
  choice: 我就把那城交给你
  rationale: αὐτήν按阴性先行词Πτολεμαΐδα指多利买城；παραδώσω表示移交控制权，“交给”不额外加入投降意味。
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: 其余的堡垒
  rationale: ὀχυρώματα指设防的军事据点；“堡垒”简洁、明确。
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: 众多军队
  rationale: δυνάμεις在此为军事力量或部队，πολλάς强调数量众多；“众多军队”保留这一军事及数量含义。
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: 所有主管事务的人
  rationale: 该短语直指被安排管理各种需要、事务的人；此译保留行政含义，又不将其过度限定为现代官职。
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: 我会转回去，再离开
  rationale: 以连续动作表达分词在先、限定动词在后的次序，同时保留ἐπιστρέψας究竟是“转回”还是“返回”的语义含混，不补出原文未说明的目的地。
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: 因为我正是为此而来的
  rationale: 自然表达说话者到场的目的；“正是”体现τούτου χάριν的强调和解释作用。
