  source_fidelity: 译文整体准确呈现了惧怕、约拿单可能阻挠并交战、寻找办法擒杀约拿单，以及离开后抵达该城的叙事次序。μως，“容他”在现代汉语中通常意为宽容、容纳某人，并不自然地表达ἐάω的“准许/任由”；地名“伯特珊”也不如中文圣经常用的“伯珊”合适。
  naturalness: “他就害怕，恐怕”语义重复，且“恐怕”引出的从句在此可改为更流畅的“担心……或许……”。“不准他”虽保留希腊文未说明的行动宾语，在中文中略带省略，但可由脚注明确，且比“容他”自然、准确。
  terminology: 将ἐάσῃ译为“不准他”保留其人称宾语及未明说的所准许事项，不把它限定为“让他作王”等具体行动。“同他交战”保留军事语域。Βεθσά按中文圣经通行地名译为“伯珊”。
