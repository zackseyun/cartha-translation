base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/040.yaml
  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: zh_hans
  text: 他担心约拿单或许不准他[a]，又会同他交战；便设法捉住约拿单，杀死他。随后，他动身，来到伯珊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“约拿单或许不准他”。原文没有说明约拿单不准许他做什么。
    reason: 保留原文的人称宾语及未明说的行动，不在正文擅自补足其具体所指。
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: 害怕
  rationale: 此处表示因可能遭到阻挠和攻击而产生惧怕、戒备；译作“害怕”自然清楚，也不引入该词在其他语境中可能具有的敬虔含义。
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: 恐怕约拿单不肯容他[a]
  rationale: 保留希腊文明确出现的人称宾语“他”，却不擅自补明约拿单不容许他做什么；脚注说明原文的省略，以保存其真实歧义。
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: 会与他交战
  rationale: πολεμέω具有军事冲突意味，“交战”比泛指的“争斗”更贴合原文，又符合现代汉语叙事语体。
- source_word: ἐζήτει πόρον
  choice: 设法
  rationale: πόρος在这里指实现计谋的途径或办法；“设法”简洁自然，并能涵盖寻找手段或机会两层可能。
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: 捉住约拿单，把他杀死
  rationale: 两个带冠词的不定式表达目的。“捉住”不暗示合法逮捕程序；重复专名有助于消除连续代词在中文中的指代含混。
- source_word: ἀπάρας
  choice: 动身前往
  rationale: 该分词表示离开原处、继而抵达；“动身前往”自然呈现行动顺序，而不额外断定其为拔营。
- source_word: Βεθσά
  choice: 伯特珊
  rationale: 采用该地点在现代中文圣经地名中的通行形式，对应通常认定的 Beth-shan。
