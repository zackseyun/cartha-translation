- from: 他就害怕，恐怕约拿单不肯容他[a]，还会与他交战；于是他设法捉住约拿单，把他杀死。随后，他动身前往伯特珊。
  to: 他担心约拿单或许不准他[a]，又会同他交战；便设法捉住约拿单，杀死他。随后，他动身，来到伯珊。
  rationale: 修订以“不准他”替换会产生“宽容某人”含义的“容他”，同时用脚注说明希腊文所省略的行动对象，因而既更忠实也更自然。将地名规范为“伯珊”，并调整句式以消除重复而不改变原文的叙事关系、时态意味或人物指代。
