  text: But many afflictions and many wars have surrounded us,[a]
translation:
  language: zh_hans
  text: 但许多患难和许多战争包围了我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“但许多患难和许多战争包围了我们”。这里按原文不定过去时译作“包围了”；结合书信语境，也可理解为这些患难和战争所造成的处境仍在持续。
    reason: 时态与语境说明
lexical_decisions:
- source_word: ἡμᾶς
  choice: 我们
  rationale: 第一人称复数宾格代词，在句中作“包围”的宾语。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并表达转折，用“但”自然保留其逆接作用。
- source_word: ἐκύκλωσαν
  choice: 包围了
  rationale: κυκλόω 的不定过去时，基本义为“环绕、包围”；译为“包围了”既保留原文意象，也不把持续状态强加给希腊文时态。
- source_word: πολλαὶ θλίψεις
  choice: 许多患难
  rationale: θλίψεις 指压力、困苦或苦难；“患难”庄重而通俗，并保留其严重程度。
- source_word: καὶ
  choice: 和
  rationale: 连接“患难”与“战争”两个并列主语。
- source_word: πόλεμοι πολλοί
  choice: 许多战争
  rationale: πόλεμοι 广指战争或武装冲突；重复“许多”保留原文对两类困境分别作出的强调。
