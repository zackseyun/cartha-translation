  text: And Jonathan went out to meet him with forty thousand chosen men for battle[a], and he came to Beth-shan.
translation:
  language: zh_hans
  text: 约拿单率领四万名为列阵作战而精选的人出去迎接他，来到伯善。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 采用常见叙事义，表达约拿单从所在之处出发，不额外加入“进军”等原文未明说的军事色彩。
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: 迎接他
  rationale: εἰς ἀπάντησιν 是出去与某人相会的常用表达；“迎接他”自然传达其目的，同时保留这次相会本身可能友好也可能带有军事背景的张力。
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: 率领四万名……的人
  rationale: 此处 ἐν 表示随同人员；中文用“率领”清楚表达约拿单带着四万人同行，且与军事语境相称。保留“人”，不直接改作“士兵”，避免超出原文字面。
- source_word: ἐπιλεγμέναις
  choice: 精选出来
  rationale: 表示这些人经过特别挑选；“精选出来”既准确，又符合现代中文军事叙事的庄重语体。
- source_word: εἰς παρατάξιν
  choice: 列阵作战
  rationale: παράταξις 可指列成战阵、战斗部署或作战；“列阵作战”兼顾具体阵形和军事目的，避免仅译“作战”而丢失列阵含义。
- source_word: ἦλθεν εἰς Βεθσάν
  choice: 来到伯善
  rationale: 直译其到达动作，并按通行中文圣经地名形式音译 Βεθσάν 为“伯善”。
