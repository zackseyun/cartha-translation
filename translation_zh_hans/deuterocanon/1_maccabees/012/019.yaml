  yaml_path: translation/deuterocanon/1_maccabees/012/019.yaml
  text: Therefore we did not wish to trouble you and the rest of our allies and friends in these wars[a].
translation:
  language: zh_hans
  text: 因此，我们不愿在这些战争中烦扰你们和我们其余的盟友与朋友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烦扰”也可译作“给……加添负担”。希腊文动词可指打扰、造成不便或强加负担；这里很可能是指在外交或军事上使对方承担压力，而不只是惹人厌烦。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβουλόμεθα
  choice: 我们不愿
  rationale: 未完成时中间形式表达过去的意愿或打算；“不愿”自然简洁，并保留有意不这样做的意味。
- source_word: οὖν
  choice: 因此
  rationale: 表示由上文得出的推论，“因此”清楚保留其逻辑承接作用。
- source_word: παρενοχλεῖν
  choice: 烦扰
  rationale: 该动词可指打扰、造成不便或加添负担；在外交和战争语境中，“烦扰”既自然，又不把含义收窄为个人层面的恼怒。
- source_word: ὑμῖν
  choice: 你们
  rationale: 第二人称复数间接受词，指书信的收信方。
- source_word: τοὺς λοιποὺς συμμάχους καὶ φίλους ἡμῶν
  choice: 我们其余的盟友与朋友
  rationale: “其余的”指收信方以外的其他盟友和朋友；“盟友”保留政治军事含义，“朋友”则保留希腊文在外交语境中可能兼有的广义关系色彩。
- source_word: ἐν τοῖς πολέμοις τούτοις
  choice: 在这些战争中
  rationale: 直译介词结构并保留 πολέμοις 的复数形式，说明烦扰发生于这些战争的处境中。
