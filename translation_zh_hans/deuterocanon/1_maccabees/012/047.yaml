  yaml_path: translation/deuterocanon/1_maccabees/012/047.yaml
  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: zh_hans
  text: 他留下三千人随他同行；其中约两千人留在加利利，其余一千人则与他会合[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“与他一同聚集”或“与他会合”；前句“随他同行”中的“他”对应原文较强调的“自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: 留下
  rationale: 该词表示留下或使之留存；这里采用“留下”，既贴近原文，也不额外解释为正式驻防。
- source_word: μεθʼ ἑαυτοῦ
  choice: 跟自己在一起
  rationale: 保留希腊语反身代词“自己”的语义，虽然现代汉语略显特别，脚注予以说明。
- source_word: ἄνδρας τρισχιλίους
  choice: 三千人
  rationale: ἄνδρας直译为“人”；上下文已表明军事背景，无须明确增译“士兵”。
- source_word: ὡς δισχιλίους
  choice: 约两千人
  rationale: ὡς用于数词前表示约数，“约”准确传达其近似含义。
- source_word: ἀφῆκεν
  choice: 留
  rationale: 此动词可表示让某人留下；采用中性的“留”，避免过度具体化为“驻扎”。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: 在加利利
  rationale: 按ἐν加地域名的通常处所意义翻译。
- source_word: χίλιοι
  choice: 一千人
  rationale: 根据前文省略的ἄνδρες补出量词“人”，使汉语自然清楚。
- source_word: συνῆλθον αὐτῷ
  choice: 跟他会合
  rationale: συνέρχομαι的基本意思是聚到一起、会合；此译比单纯“跟随”更直接保留原词意义，同时不排除随后同行。
