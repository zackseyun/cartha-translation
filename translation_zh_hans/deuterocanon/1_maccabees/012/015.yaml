base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: zh_hans
  text: 因此，我们在一切时候都不断地记念你们；每逢节期和其他应守的日子[a]，我们都在献祭和祷告时记念你们，因为记念弟兄是应当而合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “应守的日子”原文也可理解为“合宜的日子”或“规定的日子”，这里指宗教历法中应当举行礼仪的日子。
    reason: 保留καθηκούσαις在“合宜”与“按规定应守”之间的语义幅度。
lexical_decisions:
- source_word: ἀδιαλείπτως ἐν παντὶ καιρῷ
  choice: 时时不断地
  rationale: 兼顾“在任何时候”和“不间断”的意思；在礼仪语境中表达恒常、反复的记念，而不刻意解释为每一刻都在进行。
- source_word: ἑορταῖς
  choice: 节期
  rationale: 自然表达宗教历法中的节庆日，比一般性的“节日”更能保留礼仪语境。
- source_word: καθηκούσαις ἡμέραις
  choice: 应守的日子
  rationale: καθήκω可表示合宜、应当或按规定而行；此处结合节期与献祭，译作“应守的日子”能传达宗教历法中应当举行礼仪的日期，同时用脚注保留其语义幅度。
- source_word: μνημονεύομεν ὑμῶν
  choice: 记念你们
  rationale: 既可表示心中记得，也适用于祷告和献祭中的礼仪性提念；“记念”符合庄重的经文语体。
- source_word: ἐφʼ ὧν προσφέρομεν θυσίων
  choice: 每逢……日子，我们献祭时
  rationale: 将关系结构按时间关系自然译出，使献祭与前述节期和应守之日相连。
- source_word: ἐν ταῖς προσευχαῖς
  choice: 祷告中
  rationale: 保留复数所表达的反复礼仪行为；汉语无需机械标示复数。
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: 因为……是应当而合宜的
  rationale: 分别传达δέον的责任、必要意味与πρέπον的合宜、相称意味。
- source_word: ἀδελφῶν
  choice: 弟兄
  rationale: 保留原文阳性复数的亲族称谓，以及外交书信中所表达的群体亲谊。
theological_decisions:
- issue: ἀδελφῶν的群体亲属称谓
  choice: 弟兄
  alternative: 同胞；弟兄姊妹
  rationale: 原文为阳性复数，在这里用于群体间的盟友或亲族式称呼。译作“弟兄”既保留原文形式，也不把其范围扩展为原文未明说的两性并称。
- issue: 记念与献祭、祷告的关系
  choice: 献祭时和祷告中都记念你们
  alternative: 为你们献祭并祷告
  rationale: 原文明确说的是在这些礼仪行动中“记念”收信人，并未明说祭物是专为他们而献；因此不补入“为你们”，以免扩大祭祀意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“记念”保留经文与礼仪语感；分号帮助呈现主句与具体礼仪场景的关系。所有脚注标记均已置于正文相应位置。
