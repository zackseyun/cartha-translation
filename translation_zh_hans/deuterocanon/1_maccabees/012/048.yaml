base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: zh_hans
  text: 约拿单进入多利买时，多利买人关上城门，捉住他，又用刀剑杀了所有同他一同前来的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“所有同他一同前来的人。”按上下文，指同他进城的人。
    reason: 说明分词 συνελθόντας 的字面意义及其由上下文限定的地点含义，避免正文过度明说。
lexical_decisions:
- source_word: ὡς δὲ
  choice: 一……就
  rationale: 该结构兼有叙事承接和时间意义；结合随后突发的敌对行动，汉语“一……就”自然表现约拿单进城后事情随即发生。
- source_word: εἰσῆλθεν
  choice: 进了
  rationale: 准确表达进入某地的简单过去动作，符合现代汉语叙事习惯。
- source_word: Πτολεμαΐδα
  choice: 多利买
  rationale: 采用该古城在中文圣经传统中通行且易于识别的译名。
- source_word: ἀπέκλεισαν
  choice: 关上
  rationale: 该词表示封闭、关闭；与“城门”搭配时，“关上”简洁自然，不额外断定是否加闩。
- source_word: οἱ Πτολεμαεῖται
  choice: 城里的人
  rationale: 原文为多利买居民的族称；上下文已出现城名，用“城里的人”既避免生硬重复，也保留居民作为行动主体的含义。
- source_word: συνέλαβον
  choice: 捉住
  rationale: 表现突然控制、擒获约拿单的动作，又不引入“逮捕”可能暗示的正式司法程序。
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: 所有同他一起来的人
  rationale: 保留 συνελθόντας 的“一同前来”含义，不在正文中强行补入“进城”；由前文进入多利买的语境自然限定所指。
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: 用刀杀了
  rationale: 清楚表达以刀剑杀人的原文惯用语；“刀”在现代汉语中自然，也不采用古雅的“诛杀”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。以“一……就”增强叙事的突转感；“捉住”“用刀杀了”直白呈现背叛和杀戮，不作神学化解释。脚注标记置于其所说明的短语之后。
