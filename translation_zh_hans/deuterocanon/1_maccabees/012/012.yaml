  text: But we rejoice in your glory;[a]
translation:
  language: zh_hans
  text: 但我们因你们的荣耀而欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我们因你们的尊荣而欢喜”，或“但我们因你们的声望而欢喜”。
    reason: 词义选择：δόξα在这里也可指尊荣或声望。
lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: 欢喜
  rationale: 该动词在此表达喜乐、欣慰；“欢喜”自然庄重，并保留动词的力度。
- source_word: δὲ
  choice: 但
  rationale: δέ在此表示轻微的转折或承接；“但”保留了上下文中的对比语气，不过分强化。
- source_word: ἐπὶ
  choice: 因……而
  rationale: ἐπί接与格可表示喜乐的缘由或依据；“因……而”符合现代汉语习惯，同时保留“以此为喜乐缘由”的意思。
- source_word: τῇ δόξῃ
  choice: 荣耀
  rationale: δόξα可指荣耀、尊荣或声望；正文采用较直接且保留语义宽度的“荣耀”，不把含义限定为社会名望。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 准确表达第二人称复数所有关系。
theological_decisions: []
