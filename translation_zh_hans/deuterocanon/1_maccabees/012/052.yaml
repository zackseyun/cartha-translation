base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/052.yaml
  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: zh_hans
  text: 他们全都平安来到犹大地，为约拿单和与他同在的人哀悼，也十分惧怕；以色列大大哀恸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以色列哀悼了大哀悼。”希腊原文以同源的动词和名词构成强调表达。
    reason: 说明原文ἐπένθησεν…πένθος的同源宾语强调结构；正文按自然中文表达其强调语气。
lexical_decisions:
- source_word: ἦλθον πάντες μετʼ εἰρήνης
  choice: 他们全都平安回到
  rationale: 结合上文所述行动方向，ἦλθον在此自然表达返回；μετʼ εἰρήνης既可指平安状态，也隐含安然抵达，译为“平安回到”符合现代汉语叙事。πάντες明确译作“全都”。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 保留γῆ的地域含义，并采用传统而自然的中文地名表达，避免译作带有较晚行政区色彩的“犹太省”。
- source_word: ἐπένθησαν
  choice: 哀悼
  rationale: 该词表示为死者或失踪者悲哀，中文“哀悼”能体现庄重、公开的悼念意味。
- source_word: τὸν Ἰωνάθαν καὶ τοὺς μετʼ αὐτοῦ
  choice: 为约拿单和跟随他的人
  rationale: “为”符合中文中“哀悼”的支配习惯；τοὺς μετʼ αὐτοῦ保持开放，不具体限定这些人的身份。“跟随他的人”在本叙事语境中比生硬的“与他同在的人”自然。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 他们十分惧怕
  rationale: “十分”保留σφόδρα的强烈程度，“惧怕”较“害怕”庄重，符合经文语体。
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: 以色列举国大大哀恸
  rationale: 动词与同源名词构成强调表达。中文用“大大哀恸”传达强烈程度；“举国”表明集合名词“以色列”在此指全体百姓，而不是另一个单独人物。脚注说明原文形式，以免完全抹平其修辞特点。
theological_decisions:
- issue: “以色列”的所指范围
  choice: 以色列举国
  alternative: 以色列
  rationale: 上下文描述群体性的全国哀悼，“举国”在中文中自然呈现集合意义，并未引入额外的神学身份界定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哀悼”用于约拿单及其随从，“哀恸”用于全以色列的强烈悲痛，以避免机械重复，同时保留末句递进的力度。所有脚注标记均已置于正文。
