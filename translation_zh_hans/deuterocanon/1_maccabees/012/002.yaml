  text: And he sent letters to the Spartans and to other places in the same terms[a].
translation:
  language: zh_hans
  text: 他也给斯巴达人和其他地方寄去内容相同的书信。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照样”或“以同样的措辞”。希腊文表明这些书信与刚才提到的书信在内容或措辞上相同。
    reason: 词义存在可合理表达为内容或措辞相同的细微差别。
lexical_decisions:
- source_word: ἀπέστειλεν ἐπιστολὰς
  choice: 写信给
  rationale: 希腊文直译为“寄出书信”。中文用“写信给”自然简明，也保留了发信这一行动；复数信息由多个收信对象和脚注所说明的同样内容自然体现。
- source_word: πρὸς Σπαρτιάτας
  choice: 给斯巴达人
  rationale: πρός在发送语境中表示收信对象。“斯巴达人”是Σπαρτιάτας准确、通行的现代汉语译法。
- source_word: τόπους ἑτέρους
  choice: 其他地方的人
  rationale: 原文直说“其他地方”，但书信实际寄给当地的群体或有关人士。汉语补出“的人”可避免产生把信寄给抽象地点的不自然表达，同时不具体限定其政治身份。
- source_word: κατὰ ταὐτά
  choice: 照着同样的内容
  rationale: 该短语表示这些信与上文所提书信在内容或主旨上相同。此译法比单纯“同样地”更清楚，同时不强断为逐字相同。
