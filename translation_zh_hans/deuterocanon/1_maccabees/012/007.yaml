base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: zh_hans
  text: 早在此以前，在你们中间作王的阿瑞乌斯曾寄书信给大祭司敖尼雅，说：“你们是我们的弟兄。”正如这里所附的副本所示。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如下列副本所示。”希腊文表示先前书信的副本现列于此处，或附在下文。
    reason: 说明ὑπόκειται在文书语境中可指文本列在此处或附于下文，避免将版面位置绝对化。
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: 早在这以前
  rationale: 兼顾ἔτι的强调意味和πρότερον的比较、时间含义，表明此事发生在当前通信之前更早的时候。
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  choice: 曾……寄去书信
  rationale: 用自然汉语表达被动结构；“书信”在汉语中可作集合性复数，不将希腊文复数误改为明确的单数“一封信”。
- source_word: πρὸς Ὀνίαν τὸν ἀρχιερέα
  choice: 给大祭司敖尼雅
  rationale: 准确表达πρός所指的收信对象，并以现代汉语的自然次序安排名称与头衔。
- source_word: παρὰ δʼ Ἀρείου
  choice: 阿瑞乌……给……寄去
  rationale: παρά加属格表示书信的来源；转换为汉语主动句，使发信人清楚而不改变原意。
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: 在你们中间作王的
  rationale: 保留分词的动作性及ἐν ὑμῖν“在你们中间”的措辞，不擅自强化为“统治你们”。
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: 说：“你们是我们的弟兄。”
  rationale: 将ὅτι按引出话语理解，以直接引语自然呈现；“弟兄”保留ἀδελφοί的亲族称谓及两族所宣称的兄弟关系。
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: 正如下列抄本所载
  rationale: ἀντίγραφον指抄本或副本，ὑπόκειται在此表示文件列在下文或置于此处；“下列……所载”符合本段随后引录文书的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“早在这以前……就曾”传达时间上的强调；以主动句处理希腊文被动结构，避免汉语生硬，同时保留发信人、收信人、书信复数含义以及“在你们中间作王”的原文张力。
