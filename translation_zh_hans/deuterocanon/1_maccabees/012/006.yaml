base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: zh_hans
  text: 本民族的大祭司约拿单、长老议会、众祭司和其余的犹太民众，向斯巴达的弟兄们[a]问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”是原文外交书信中的亲族称谓，不一定表示有直接的血缘关系。
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς τοῦ ἔθνους
  choice: 本族的大祭司
  rationale: 保留 τοῦ ἔθνους 所表达的民族共同体含义，同时用自然汉语表明约拿单在本民族中的职分；避免误解为统辖万族。
- source_word: ἡ γερουσία
  choice: 长老议会
  rationale: 既体现由长老组成的治理机构，也比“元老院”更贴合犹太语境并便于现代读者理解。
- source_word: οἱ ἱερεῖς
  choice: 众祭司
  rationale: 准确表达复数，并与大祭司相区别。
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  choice: 其余的犹太民众
  rationale: δῆμος 指作为公共群体的人民；“其余”将他们与前述领袖和祭司区分开来，“犹太民众”自然承载 Ἰουδαίων 的民族、政治与宗教多重含义。
- source_word: Σπαρτιάταις
  choice: 向斯巴达的
  rationale: 与格标明收信对象；“斯巴达”是现代汉语通行名称。
- source_word: τοῖς ἀδελφοῖς
  choice: 弟兄们
  rationale: 直译外交书信中的亲族称谓，保留其宣称的兄弟关系，不改释为普通朋友或盟友。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊化时期书信开头的惯用问候语；“问安”符合中文书信表达，而非按字面译作“喜乐”。
theological_decisions:
- issue: 外交称呼“弟兄们”的含义
  choice: 正文保留“弟兄们”
  alternative: 亲族；朋友；盟友
  rationale: 原文明确使用 ἀδελφοῖς，陈述双方的外交性亲缘关系。译文不替文本判定这种关系是血缘事实、政治修辞或盟约性称谓，并以脚注提示其语境。
- issue: Ἰουδαίων 的群体含义
  choice: 犹太民众
  alternative: 犹大地的民众
  rationale: 该词在本书中可兼具民族、地域政治和宗教含义；“犹太”是现代汉语最自然的通称，同时不将其含义缩限为单纯宗教身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留希腊书信的“发信者—收信者—问安”结构；将多个并列发信群体适度压缩为流畅中文，但不删减任何群体。
