  yaml_path: translation/deuterocanon/1_maccabees/012/044.yaml
  text: And he said to Jonathan[a], “Why have you cut down all this people, when no war is pressing upon us?”
translation:
  language: zh_hans
  text: 他对约拿单说：“在我们并未面临战争的时候，你为什么把这些人全都砍倒了[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “砍倒了”希腊文直译为“砍了”或“切断了”。这个词在此可指击倒、杀伤或剪除；本句未明确说明所指行动的具体程度。
    reason: 保留ἔκοψας的基本形象与语义范围，不以“遣散”这一未经本句明示的解释取代原文。
lexical_decisions:
- source_word: Τίνα τί
  choice: 为什么
  rationale: 传世希腊文本的疑问词组合较为突兀；按上下文是询问缘由，现代汉语自然译作“为什么”。
- source_word: ἔκοψας
  choice: 遣散了
  rationale: κόπτω本义为“砍、切断”，但本节上下文中约拿单遣散军队，只留下少数人；因此这里宜理解为“削减、解散”众人，而非杀戮。译作“遣散了”既符合叙事语境，也在脚注保留其字面意象与可能范围。
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: 这么多人都
  rationale: λαός可指民众，也可在此语境中指随行的队伍。结合上文遣返军队，汉语用“这么多人”自然，同时不把它限定成特定军事编制。
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: 既然我们并没有面临战争
  rationale: ἐνίστημι在此有“临到、逼近、当前存在”之意；分词属格结构表达伴随情形或理由。译文保留“战争并未临到我们”的反问逻辑。
- source_word: τῷ Ἰωναθάν
  choice: 对约拿单
  rationale: 与格表示说话的对象；人名按现代中文圣经通行形式译为“约拿单”。
