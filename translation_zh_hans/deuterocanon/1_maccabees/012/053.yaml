base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: zh_hans
  text: 他们周围所有的民族都企图铲除他们[a]，因为他们说：“他们没有一个男人能统治并援助他们[b]。如今，就让我们攻打他们，从世人当中除去对他们的记念[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铲除”也可译作“彻底消灭”或“抹去”；希腊文动词含有根绝之意。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他们没有一个男人统治并援助他们”；也可译作“他们没有一位统领来带领和援助他们”。
    reason: source_form_and_lexical_alternative
  - marker: c
    text: 也可译作“从人类当中抹去对他们的记忆”或“使他们不再为世人所记念”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: 企图
  rationale: 这里的 ζητέω 后接不定式，表达付诸行动的意图；“企图”比单纯的“想要”更能体现敌对谋划，又不把尚未实现的行动译成既成事实。
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: 他们周围所有的民族
  rationale: ἔθνη 在这里指周边敌对的族群或政治群体；“民族”较为中性，也避免将其限定为现代意义上的国家。
- source_word: ἐκτρῖψαι
  choice: 铲除
  rationale: 该动词有擦去、彻底消灭之意；“铲除”简洁地保留了根绝、消灭的力度。
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  choice: 有人治理和援助他们
  rationale: 希腊文直陈“一个男人”并以两个分词描述其治理和援助的作用。现代汉语“有人治理和援助他们”自然保留了个人统领者的含义；脚注说明较直译形式，以免掩盖原文的阳性单数。
- source_word: πολεμήσωμεν
  choice: 我们去攻打他们
  rationale: 这是劝勉式虚拟语气，号召采取军事行动；“去攻打”在现代汉语中自然表达共同发动战争的提议。
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: 把世人对他们的记念除掉
  rationale: μνημόσυνον 可指记念、纪念或留存的名声；本句表达使他们在人类中彻底不再被记念。“世人”自然传达 ἀνθρώπων 的泛指人类意义。
theological_decisions:
- issue: 敌对者话语中阳性单数 ἄνδρα 的表达
  choice: 正文译为“没有人治理和援助他们”，脚注注明原文为“没有一个男人治理和援助他们”
  alternative: “没有一位统领和援助他们的人”或“没有一个男人治理和援助他们”
  rationale: 原文确用阳性单数 ἄνδρα，但重点也在此人所承担的治理和援助职能。正文采用自然现代汉语，不将“男人”不必要地凸显为对比焦点，同时用脚注保存形式信息和可能的强调。
- issue: ἀνθρώπων 的泛指范围
  choice: 译为“世人”
  alternative: “人类当中”或较形式化的“众人中间”
  rationale: 此处不是特指男性，而是指整个人类社会；“世人”准确保留泛指意义，也符合庄重而通俗的汉语表达。
- issue: τὸ μνημόσυνον αὐτῶν 的含义
  choice: 译为“世人对他们的记念”
  alternative: “他们的名号”“他们的纪念”或“关于他们的记忆”
  rationale: 原词既可涉及记忆，也可涉及纪念物或留名。正文用“记念”保留其语义张力，不把它缩窄为名号、史料或实体纪念物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。敌人的引语保持直接有力；“所以，现在”对应 νῦν οὖν 的推进语气。正文避免生硬照搬希腊分词结构，并以脚注保存阳性单数和“记念”短语的可选理解。
