  terminology: “民族”“铲除”“统治”“援助”“记念”均适合本段庄重的历史叙事语域。“男人”保留ἄνδρα的阳性单数形式；“世人”恰当表达ἀνθρώπων的泛指，不能理解为仅指男性。
