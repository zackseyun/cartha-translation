  yaml_path: translation/deuterocanon/1_maccabees/012/029.yaml
  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
translation:
  language: zh_hans
  text: 但约拿单和他在一起的人直到早晨才知道，因为他们一直看见那些灯火还在燃烧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灯火”或译“火光”；按上下文，很可能是营中留下继续燃烧的火。
    reason: 说明τὰ φῶτα的字面意义及其在军事语境中的可能所指，同时保留原文未明确说明是营火的余地。
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: 才知道
  rationale: 与“直到早晨”搭配成“直到……才知道”，自然表达希腊文否定动词与 ἕως 所标明的时间界限，同时不增添“识破”等解释。
- source_word: ἕως πρωί
  choice: 直到早晨
  rationale: 直接保留时间终点；“早晨”较“黎明”更贴近 πρωί 的通常范围，也避免过度具体化。
- source_word: ἔβλεπον
  choice: 一直看见
  rationale: 用“一直”体现未完成过去时的持续背景作用：他们因持续看见灯火燃烧，尚未察觉实际情形。
- source_word: τὰ φῶτα
  choice: 那些灯火
  rationale: φῶτα 字面是“光、灯火”。正文采用自然且较少解释性的“灯火”，既适合夜间军营语境，又不直接将其限定为营火。
- source_word: καιόμενα
  choice: 还在燃烧
  rationale: 表达分词所描述的持续可见状态；“还在”在汉语中自然呈现燃烧仍未停止的背景。
- source_word: οἱ παρʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 表示与约拿单同在的一群人；此译法自然，并避免把原文未明确限定的群体直接译成“部下”或“士兵”。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“直到早晨才知道”符合汉语习惯；保留“灯火”而不在正文中解释为“营火”，以维持原文的词汇开放性。
