  text: And Jonathan returned and assembled the elders of the people, and he took counsel with them to build fortresses in Judea,
translation:
  language: zh_hans
  text: 约拿单回来后，召集了百姓的长老，与他们商议在犹太地修建堡垒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回来
  rationale: 此处指约拿单从先前所在之处返回，是实际行程，不含悔改或转向的比喻义；“回来”符合现代汉语叙事习惯。
- source_word: ἐξεκκλησίασεν
  choice: 召集
  rationale: 该动词表示召集人组成会议；“召集”既保留正式、公共的语气，也自然地以“长老”为宾语。
- source_word: πρεσβυτέρους τοῦ λαοῦ
  choice: 百姓的长老
  rationale: 此处指百姓中具有公认地位的领袖，而非泛指年长男子；“长老”保留其群体治理职分。
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: 与他们商议
  rationale: 中间语态在此表达共同谋议、征求意见；“与他们商议”简洁自然，并保留协商而非单方面决定的意味。
- source_word: οἰκοδομῆσαι
  choice: 修建
  rationale: 不定式表达商议的内容或目的；用于防御工事时，“修建”比笼统的“建造”更符合现代汉语搭配。
- source_word: ὀχυρώματα
  choice: 堡垒
  rationale: 该词指用于防御的坚固建筑或据点；“堡垒”具体明确，不易被理解为抽象意义上的保障。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地
  rationale: 介词短语说明修建堡垒的地域；“犹太地”是现代中文圣经地名中自然且易懂的表达。
