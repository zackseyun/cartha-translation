  text: And he pursued after them, but did not overtake them, for they had crossed the Eleutherus River.
translation:
  language: zh_hans
  text: 他追赶他们，却没有追上，因为他们已经渡过了厄琉特洛河。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν
  choice: 追赶
  rationale: 该动词表示积极追击；“追赶”自然、清楚，并保留军事叙事语感。
- source_word: ὀπίσω αὐτῶν
  choice: 他们
  rationale: 希腊语直译为“在他们后面”；汉语在“追赶他们”中已自然表达其义，无须另译“在后面”。
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: 没有追上
  rationale: καταλαμβάνω在追击语境中指赶上逃走的人；“没有追上”比泛泛的“没有抓住”更准确。
- source_word: διέβησαν
  choice: 已经渡过
  rationale: 该不定过去时所述行动构成未能追上的原因；“已经”清楚表达渡河先于追赶未果。
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: 厄琉特洛河
  rationale: Ἐλεύθερος在此为河流专名，采用贴近希腊语读音的音译，并按现代汉语河名习惯加“河”。
