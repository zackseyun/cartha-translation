  text: And he set out from Jerusalem and met them in the land of Hamath, for he gave them no respite to enter his land.
translation:
  language: zh_hans
  text: 他从耶路撒冷出发，在哈马地区与他们相遇，因为他没有给他们踏入自己领地的机会。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν ἐξ Ἰερουσαλήμ
  choice: 从耶路撒冷出发
  rationale: ἀπαίρω在此表示启程、离开；译文自然保留出发地点。
- source_word: ἀπήντησεν αὐτοῖς
  choice: 迎击他们
  rationale: ἀπαντάω本义为迎上、相遇；军事语境中约拿单主动出兵阻截敌军，译作“迎击”可体现行动目的，而不额外说明战斗结果。
- source_word: τὴν Ἀμαθεῖτιν χώραν
  choice: 哈马地区
  rationale: Ἀμαθεῖτις指哈马一带的地域；“地区”对应χώρα，也避免误解为现代民族国家。
- source_word: οὐ γὰρ ἔδωκεν αὐτοῖς ἀνοχήν
  choice: 因为他没有给他们……喘息之机
  rationale: ἀνοχή在此指延缓、余地或机会；“喘息之机”兼顾军事压力与不容耽搁的含义。
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν χώραν αὐτοῦ
  choice: 进入自己领地
  rationale: ἐμβατεύω表示踏入、进入；χώρα αὐτοῦ指属于或受他掌控的地域，译作“自己领地”比“他的国家”更贴合古代政治地理语境。
