base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/021.yaml
  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: zh_hans
  text: 在一份有关斯巴达人和犹太人的文献[a]中发现，他们是弟兄，并且都出自亚伯拉罕的家系。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文献”也可译作“文件”或“记录”。这里的希腊词指书面资料，不一定是指神圣经典。
    reason: lexical_alternative
  - marker: b
    text: 这是所引文献所宣称的共同血统，即斯巴达人和犹太人都出自亚伯拉罕。
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: 有一份……文献记载
  rationale: 希腊文为简单过去时被动语态，直译是“被发现”；结合汉语叙事习惯，以“有一份……文献记载”自然表达发现某项书面记载的结果，同时不增添发现者。
- source_word: ἐν γραφῇ
  choice: 一份……文献
  rationale: γραφή在此指书面资料或记录，不必然指神圣经文；“文献”既庄重自然，又避免误解为“圣经”。
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: 论到斯巴达人和犹太人
  rationale: περί加属格表示“关于、论到”；τε…καί将两个民族并列。现代汉语无需机械加入“两者”也能清楚保留配对关系。
- source_word: ἀδελφοί
  choice: 弟兄
  rationale: 原文为阳性复数，在此表示两个民族之间所宣称的亲族关系；“弟兄”保留原文比喻和性别形式，而不弱化为一般的“友邦”。
- source_word: ἐκ γένους Ἀβραάμ
  choice: 都是亚伯拉罕的后裔
  rationale: γένος在此表示血统、家系或族裔来源；“后裔”是现代汉语中表达共同祖先最清楚自然的说法。“都是”承接两个群体，并表达原文所称二者同出一系。
theological_decisions:
- issue: 斯巴达人与犹太人亲缘关系的性质
  choice: 按文献所述，直接译作“他们是弟兄，都是亚伯拉罕的后裔”
  alternative: 将其淡化为政治友谊或盟友关系
  rationale: 希腊文明确声称二者为“弟兄”并出自亚伯拉罕的家系。译文保留这一记载中的主张，但通过“文献记载说”表明这是所引文献的陈述，并不替其历史真实性作判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有一份……文献记载说”避免生硬复制希腊文被动句；“弟兄”保留亲族隐喻，“后裔”清楚表达家系来源。所有脚注标记均置于正文相关陈述之后。
