base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: zh_hans
  text: 敖尼雅郑重接待了那位奉差而来的人[a]，并收下了书信；信中阐明了结盟和友好的事宜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“隆重接待了使者。”希腊文直译为“郑重接待了那位奉差而来的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“信中列明了同盟和友好关系。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: 接待
  rationale: 此动词可指接受或迎接某人；在正式使节往来的语境中，“接待”自然准确，又不越过副词而额外强化热情程度。
- source_word: ἐνδόξως
  choice: 郑重
  rationale: 该副词表示以尊荣、体面的方式；“郑重接待”符合现代汉语外交叙事，也避免“荣耀地”可能造成的误解。
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: 那位奉差而来的人
  rationale: 保留希腊文“那人，就是被差来的”这一描述性表达，不直接把身份明确化为原文未明说的“使者”。
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: 收下了书信
  rationale: λαμβάνω本可指“拿、接受”；正式递交书信的语境中，“收下”比字面的“拿了”自然，并与前面的“接待”避免重复。
- source_word: διεσάφειτο
  choice: 阐明了
  rationale: 该形式在这里表示书信内容对有关事项作出清楚说明或陈述；“阐明”兼顾清楚说明与正式列明的语气。
- source_word: συμμαχίας
  choice: 结盟
  rationale: 此词指政治或军事联盟；“结盟”在此能自然表达书信所论的外交关系，同时不擅自限定为纯军事同盟。
- source_word: φιλίας
  choice: 友好
  rationale: 在外交语境中并非仅指私人友情；“友好”保留其基本意义，也贴合国与群体之间的正式关系。
