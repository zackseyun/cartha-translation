translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“时势有利于他”避免生硬直译；“确立并更新”则有意保留原文两个目的动词并列，以及新立与续旧之间的表面张力。主文中的脚注标记按相关短语依次放置。
