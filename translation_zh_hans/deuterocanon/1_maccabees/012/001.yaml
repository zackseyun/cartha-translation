base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: zh_hans
  text: 约拿单看见时势有利于他[a]，就挑选了一些人，派他们到罗马去，为要确立并更新与罗马人的友好关系[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看见时机正帮助他”或“看见时机正与他配合”。希腊文是一种带有比喻色彩的说法，意思是当时的形势对约拿单有利。
    reason: lexical_alternative
  - marker: b
    text: 这里的“友好关系”很可能指正式的外交关系，而不只是私人之间的情谊。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: 见
  rationale: 不定过去时分词交代后续行动的背景；汉语用“见……就……”自然表达其时间兼因由关系。
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: 时势有利于他
  rationale: καιρός指合宜的时机或形势，συνεργεῖ本义为“共同作用、协助”。“时势有利于他”以自然汉语传达环境正在助益约拿单的惯用含义，同时在脚注保留较直译的可能。
- source_word: ἐπέλεξεν ἄνδρας
  choice: 挑选了几个人
  rationale: ἄνδρας在此指受选派的男子；“几个人”是汉语中不限定具体人数的自然表达，并未断定原文没有说明的数目。
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: 派他们到罗马去
  rationale: 准确表达外交使者受差派前往罗马，简洁自然。
- source_word: στῆσαι
  choice: 确立
  rationale: 在外交语境中表示使某种关系成立并稳固；“确立”保留其使之站立、建立的基本意象。
- source_word: ἀνανεῶσαι
  choice: 更新
  rationale: 表示使既有关系重新恢复新鲜或效力；“更新”贴近原词，并保留它与“确立”并列所形成的张力。
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: 与罗马人的友好关系
  rationale: αὐτούς按最近的复数指称解释为罗马人；φιλία在本段外交语境中不只是私人感情，“友好关系”既自然又避免直接强化为正式“同盟”。
