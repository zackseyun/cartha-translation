  yaml_path: translation/deuterocanon/1_maccabees/012/034.yaml
  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: zh_hans
  text: 因为他听说，他们打算把堡垒交给底米丢一方的人；于是他在那里部署了一支守军，好让他们守卫这座堡垒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 他听说
  rationale: 直译其听到消息之意，也自然引出下文采取行动的原因。
- source_word: βούλονται
  choice: 他们打算
  rationale: 表达具体意图或计划，又不把尚未实行的事情说成已经确定。
- source_word: τὸ ὀχύρωμα
  choice: 堡垒
  rationale: 指设有防御工事的坚固据点；“堡垒”在现代汉语军事语境中清楚自然。
- source_word: παραδοῦναι
  choice: 交给
  rationale: 准确表达将控制权移交给另一方，不额外加入“投降”的解释。
- source_word: τοῖς παρὰ Δημητρίου
  choice: 底米丢一方的人
  rationale: 保留παρά所表达的归属或阵营关系，不将其过度限定为士兵或亲信。
- source_word: ἔθετο
  choice: 驻扎了
  rationale: 与“守军”搭配，合乎军事语境，表达把守备力量安置在当地。
- source_word: φρουράν
  choice: 一支守军
  rationale: 此处指被留驻守卫据点的军事队伍，而非抽象的守卫任务。
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: 好让他们守住堡垒
  rationale: ὅπως加虚拟式表示目的；“守住”既包含防守，也符合对堡垒维持控制的语境。重复“堡垒”可避免汉语代词指向守军的歧义。
