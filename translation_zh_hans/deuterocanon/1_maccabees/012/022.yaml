  yaml_path: translation/deuterocanon/1_maccabees/012/022.yaml
  text: And now[a], since we have learned these things, you will do well to write to us concerning your peace.
translation:
  language: zh_hans
  text: 如今，我们既已得知这些事；你们若写信告诉我们有关你们和平的事，就很好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有关你们安好的事。”希腊语“和平”也可指安好、福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 如今
  rationale: 承接上文并转入当前请求；“如今”在书信语体中自然、庄重。
- source_word: ἀφʼ οὗ
  choice: 既
  rationale: 此处兼有时间起点和因由意味；汉语“既已”可自然表达“既然已经得知”。
- source_word: ἔγνωμεν
  choice: 已得知
  rationale: 不定过去时表示获知这些信息；“已得知”既体现事件发生，也保留其当前结果。
- source_word: ταῦτα
  choice: 这些事
  rationale: 照应前文所述信息，保留复数指代。
- source_word: καλῶς ποιήσετε
  choice: 那就再好不过了
  rationale: 这是书信中礼貌敦促对方采取行动的惯用表达；译文采用现代汉语中自然、得体的请求语气。
- source_word: γράφοντες ἡμῖν
  choice: 请你们写信……告诉我们
  rationale: 分词说明怎样做才是合宜的；按汉语表达重组为礼貌请求，同时明确写信对象是“我们”。
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: 把你们平安的情况告诉我们
  rationale: εἰρήνη可指和平，也可指平安、安好；“平安的情况”保留核心词义，并适合询问对方近况或局势的书信语境。
