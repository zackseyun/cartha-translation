lexical_decisions:
- source_word: ἐπολέμησαν
  choice: 攻打了
  rationale: 该词是 πολεμέω 的不定过去时主动语态，表示发动战争或进行敌对军事行动；“攻打了”自然、简洁，并保留其针对“我们”的敌对含义。
- source_word: οἱ βασιλεῖς
  choice: 列王
  rationale: 定冠词指向语境中可识别的一群君王；“列王”以庄重而易懂的现代汉语表达这一复数称谓。
- source_word: οἱ κύκλῳ ἡμῶν
  choice: 我们周围的
  rationale: κύκλῳ 与属格代词连用，表达环绕或邻近的位置；“我们周围的”既保留空间意象，也能自然传达周边诸王的地缘含义。
