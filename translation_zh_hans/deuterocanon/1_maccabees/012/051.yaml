  yaml_path: translation/deuterocanon/1_maccabees/012/051.yaml
  text: And when the pursuers saw that it was a matter of life and death for them[a], they turned back.
translation:
  language: zh_hans
  text: 追赶的人发现自己的性命危在旦夕[a]，就转身回去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这对他们是关乎性命的”，是指他们的性命正处于危险之中。
    reason: 说明希腊习语的字面形式和实际含义。
lexical_decisions:
- source_word: ἰδὼν
  choice: 见
  rationale: 不定过去时分词在这里表示先于主句动作发生的情形，汉语用“见……就……”自然表达。希腊文本虽用单数形式，但语义主语是复数的“追赶的人”，译文按其意义处理。
- source_word: οἱ διώκοντες
  choice: 追赶的人
  rationale: 带冠词的现在分词指正在追赶的那群人；此译简洁自然，并保留叙事中的追逐意味。
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: 他们是在拼命
  rationale: περὶ ψυχῆς 是表示性命攸关的习语；结合上下文，“拼命”既表明他们为保命而全力以赴，也自然说明追赶者为何退回。脚注保留字面意象及更明确的释义。
- source_word: ψυχῆς
  choice: 命（见“拼命”）
  rationale: 此处指人在危险中的性命，并非作为非物质实体的“灵魂”。
- source_word: ἐπέστρεψαν
  choice: 转身回去了
  rationale: 在追逐场景中，该动词表示停止追赶、掉头返回；“转身回去了”比单说“返回”更清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拼命”是普通话常用表达，在此避免生硬直译，同时以脚注交代原文“关乎性命”的结构。
