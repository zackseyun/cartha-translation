lexical_decisions:
- source_word: ἀπρόσδεοι τούτων
  choice: 并不需要这些
  rationale: ἀπρόσδεοι表示“不需要、无须依赖”，τούτων回指上文所说之事；此译自然简洁，也不夸大为绝对的自足。
- source_word: παράκλησιν
  choice: 勉励
  rationale: 此处指从圣书所得的支持与振奋。“勉励”保留其较宽泛的意义；“安慰”也可能，但更偏重纾解忧伤。
- source_word: τὰ βιβλία τὰ ἅγια
  choice: 圣书
  rationale: 直译为“神圣的书卷”。“圣书”保留原文的泛称，不以较后期的正典术语限定其范围。
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: 手中的
  rationale: 保留“在我们手中”的具体意象，同时现代汉语也可自然表达拥有、保管或随时取用之意。
theological_decisions:
- issue: “圣书”所指的范围
  choice: 译作泛称“圣书”，不界定具体正典范围
  alternative: 圣经；神圣的著作
  rationale: 希腊文只称这些书为神圣，并未明确界定后世意义上的正典边界，因此不在译文中加入额外的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“以……为勉励”略带正式色彩，与书信体相称。句末保留逗号，以反映本节在希腊文中尚未完结，并与下节衔接。
