  text: But we[a], though having no need of these things, have as encouragement the holy books that are in our hands[b],
translation:
  language: zh_hans
  text: 但我们并不需要这些；我们以手中的圣书[b]为勉励[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勉励”也可译作“安慰”或“慰藉”。
