  yaml_path: translation/deuterocanon/1_maccabees/012/050.yaml
  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: zh_hans
  text: 他们得知，他和与他在一起的人都已被俘并丧命；于是彼此鼓励，列成紧密队形前进，准备作战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: 得知
  rationale: 在叙事语境中表示获知或确认消息；“得知”自然简洁。
- source_word: συνελήμφθη
  choice: 被俘
  rationale: 被动形式在军事语境中指被捉拿、俘获；“被俘”准确而自然。
- source_word: ἀπώλωλεν
  choice: 遇害
  rationale: 完成时表达已经丧命的结果；“遇害”符合本段敌对军事背景，同时不具体说明死亡方式。
- source_word: οἱ μετʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 保留原文宽泛所指，不额外限定为士兵或同伴。
- source_word: παρεκάλεσαν ἑαυτούς
  choice: 彼此鼓励
  rationale: 原文直译为“鼓励自己”，用于群体时自然表达为相互鼓励、振作。
- source_word: ἐπορεύοντο
  choice: 前进
  rationale: 中性表达行进，军事色彩由上下文及后续措辞体现。
- source_word: συνεστραμμένοι
  choice: 结成紧密的队形
  rationale: 表达聚拢、收紧队列的军事含义，又符合现代汉语习惯。
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: 准备迎战
  rationale: 贴合眼前战斗场景，比宽泛的“准备战争”更自然。
