  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
translation:
  language: zh_hans
  text: 特利丰派遣部队和骑兵进入加利利，前往大平原，要消灭所有与约拿单在一起的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有站在约拿单一边的人。”希腊语直译为“所有在约拿单身边／与约拿单在一起的人”，可能指他的随从、部属或支持者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派遣
  rationale: 该不定过去时动词表示差派兵力；“派遣”自然、庄重，也符合军事语境。
- source_word: δυνάμεις
  choice: 军队
  rationale: 复数在此指军事力量或部队，而非抽象的“能力”；“军队”是现代汉语中清楚自然的表达。
- source_word: ἵππον
  choice: 骑兵
  rationale: 该词虽为单数形式，在这里却是集合用法，指骑乘作战的部队；译作“骑兵”准确而简洁。
- source_word: εἰς Γαλιλαίαν
  choice: 进入加利利
  rationale: εἰς 表示朝向并进入一个地区；“进入”保留了军队向境内移动的含义。
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: 前往大平原
  rationale: 第二个 εἰς 继续标明目的地；“大平原”贴近 πεδίον τὸ μέγα，并保留其可能作为特定地理区域名称的性质。为避免汉语中连续两次使用“进入”显得生硬，此处采用“前往”。
- source_word: τοῦ ἀπολέσαι
  choice: 要消灭
  rationale: 带冠词的不定式表达目的；“要消灭”自然呈现军事行动的意图，同时不把词义缩窄为单纯的“杀死”。
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: 所有跟随约拿单的人
  rationale: παρά 加人名在此表示与约拿单的关联或归属；“跟随约拿单的人”在现代汉语中自然，也保留其可能指随从、部属或支持者的宽泛含义。
