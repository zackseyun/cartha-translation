  yaml_path: translation/deuterocanon/1_maccabees/012/026.yaml
  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
translation:
  language: zh_hans
  text: 他派侦察兵到对方的营地去；侦察兵回来向他报告说：“对方这样部署，是要在夜间袭击他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 叙事中过去时动词，表示差派人员执行任务；“派”在现代汉语中自然简洁。
- source_word: κατασκόπους
  choice: 侦察兵
  rationale: 指受命察看敌方军情的人；“侦察兵”准确体现军事侦察语境，也比“探子”更庄重。
- source_word: παρεμβολὴν
  choice: 营地
  rationale: 此处指军队驻扎的营盘；“营地”清楚、自然。
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 表示侦察人员回来传达所获军情；“报告”符合军事叙事。
- source_word: Οὕτως τάσσονται
  choice: 他们这样列阵
  rationale: τάσσονται可指排列、部署或列成阵势；“这样列阵”保留其战术部署含义和现在时态的现场感。
- source_word: ἐπιπεσεῖν
  choice: 袭击
  rationale: 表示突然扑向并攻击；结合夜间行动，“袭击”既自然又保留敌对进攻的力度。
- source_word: τὴν νύκτα
  choice: 在夜间
  rationale: 准确表达时间宾格，符合现代标准汉语。
- source_word: ἐπʼ αὐτοὺς
  choice: 我们
  rationale: 希腊文直译为“他们”，但在侦察兵向约拿单直接报告的引语中，所指是约拿单一方；正文采用自然直接引语的“我们”，并以脚注保存原文人称。
