  yaml_path: translation/deuterocanon/1_maccabees/012/009.yaml
  text: And so we also[a], though having no need of these things, have the holy books that are in our hands as encouragement[b],
translation:
  language: zh_hans
  text: 所以，我们虽然不需要这些事，却有手中的圣书作为鼓励[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼓励”也可译作“安慰”或“慰藉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: 不需要
  rationale: 该词表示“无所需、不依赖”；译为“不需要”自然清楚，并保留对前文所说之事并无所求的意思。
- source_word: τούτων
  choice: 这些事
  rationale: 中性复数代词概括指向上下文所谈之事；“这些事”不额外限定其具体内容。
- source_word: παράκλησιν
  choice: 勉励
  rationale: 此处指从圣书所得的激励、安慰或支持。“勉励”在现代汉语中较自然，同时以脚注保留“安慰”的可能。
- source_word: τὰ βιβλία τὰ ἅγια
  choice: 圣书
  rationale: 直译为“神圣的书卷”。“圣书”贴近原文，也避免直接用“圣经”而过度确定其范围。
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: 手中的
  rationale: 保留“在我们手中”的具体意象，同时自然表达持有并可随时取用。
theological_decisions:
- issue: “圣书”所指的范围
  choice: 保留为“圣书”，自然指向以色列的神圣典籍，但不明确界定其正典范围
  alternative: 译作“圣经”或泛指他们持有的神圣文书
  rationale: 原文称“神圣的书卷”，语境很可能指以色列的神圣典籍；采用“圣书”既传达这一点，又不把原文没有说明的范围固定下来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以，我们虽然……却……”呈现 οὖν 与分词结构的逻辑；“手中的圣书”保留原文具体表达。脚注标记已置于正文。
