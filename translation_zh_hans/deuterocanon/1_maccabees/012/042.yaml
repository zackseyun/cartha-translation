  yaml_path: translation/deuterocanon/1_maccabees/012/042.yaml
  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
translation:
  language: zh_hans
  text: 特利丰见约拿单带着强大兵力前来，就害怕，不敢向他下手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“向他伸出手”。这是一种可指敌对行动的习语，也可译作“动手加害他”；原文未明确说明具体方式。
    reason: 保留原文习语的字面形象及其语义范围。
lexical_decisions:
- source_word: παρέστη
  choice: 来到
  rationale: 此处为叙事中的不定过去时，指约拿单率兵来到现场；“来到”比静态的“在场”更符合上下文。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 带着大批兵力
  rationale: δύναμις 在军事叙事中指军队或兵力；“大批兵力”保留军事含义，又不把它过度限定为某种编制的军队。
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: 向他下手
  rationale: 这是表示敌对行动的希腊语习语；现代汉语“向他下手”自然、庄重，也保留具体行动究竟是袭击、捉拿还是杀害的不确定性。
- source_word: ηὐλαβήθη
  choice: 害怕起来，不敢
  rationale: 该动词在这里表达因畏惧而有所顾忌；结合不定式译为“害怕起来，不敢”，清楚呈现惧怕导致退缩的关系。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话，语言自然而庄重。为避免连续两个“他”造成指代混淆，依上下文明确写出“约拿单”；“向他下手”保留原文对敌对行动方式的开放性。
