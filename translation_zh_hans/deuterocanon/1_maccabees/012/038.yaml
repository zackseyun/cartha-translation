  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
translation:
  language: zh_hans
  text: 西门重建了谢非拉地区的亚底大[a][b]，并用城门和门闩加以巩固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谢非拉”指犹大山区与沿海平原之间的丘陵地带；也可译作“低地”。
    reason: cultural_note
  - marker: b
    text: “重建”或译“建造”；希腊文动词可按语境表达这两种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: 重建
  rationale: 该动词可指“建造”，也可按语境指重建或修复。这里所说的是一处已有名称的城镇，随后又提到设防，因此正文采用“重建”，同时以脚注保留“建造”的可能。
- source_word: τὴν Ἀδιδὰ
  choice: 亚底大
  rationale: 按希腊文地名音译，并采用适合现代汉语的传统圣经地名风格。
- source_word: ἐν τῇ σεφηλά
  choice: 谢非拉地区
  rationale: σεφηλά是指犹大丘陵与沿海平原之间的特定地理区域；保留地名比笼统译作“低地”更准确，并加“地区”帮助普通读者理解。
- source_word: ὠχύρωσεν
  choice: 加以巩固
  rationale: 该词表示使某处坚固、可防守。结合后面的城门和门闩，“加以巩固”自然表达修筑防御设施之意。
- source_word: θύρας
  choice: 城门
  rationale: 语境是城镇防御，故译作“城门”而非一般的“门”。
- source_word: μοχλούς
  choice: 门闩
  rationale: 该词指用来闩住城门的横木或闩具；“门闩”在现代汉语中准确清楚。
