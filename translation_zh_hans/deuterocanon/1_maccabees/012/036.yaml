base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: zh_hans
  text: 又要加固耶路撒冷的城墙，并在堡垒[a]和城之间筑起一道高大的屏障，把堡垒与城隔开，使它孤立起来，好叫里面的人既不能买，也不能卖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚克拉堡”，即耶路撒冷城内设防的坚固据点。
    reason: 保留ἄκρα在本段历史语境中的专名可能性，同时让正文使用普通读者易懂的称谓。
lexical_decisions:
- source_word: προφυῶσαι
  choice: 加固
  rationale: 该罕见动词在此表示增设防御结构或进一步强化工事；“加固”既符合军事建筑语境，也避免武断说明具体工程形式。
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: 耶路撒冷的城墙
  rationale: τείχη通常指城墙；此处直译自然、明确。
- source_word: ὑψῶσαι ὕψος μέγα
  choice: 筑起一道高大的屏障
  rationale: 希腊文直译近于“升起一个很大的高度”，表达略显迂回；结合其隔绝堡垒与城的用途，译作“高大的屏障”较符合现代汉语，同时保留其高耸、阻隔的重点，不具体断定必为某种墙体。
- source_word: ἄκρας
  choice: 堡垒
  rationale: 此词在这里指耶路撒冷境内设防的坚固据点；“堡垒”通俗而准确，历史专名“亚克拉堡”置于脚注。
- source_word: εἰς τὸ διαχωρίσαι
  choice: 把……隔开
  rationale: 该结构表示目的；“隔开”贴合空间和军事封锁语境。
- source_word: αὐτὴν τῆς πόλεως
  choice: 把堡垒与城隔开
  rationale: 阴性代词最自然地回指阴性名词ἄκρα；汉语重复“堡垒”可避免代词指向含混。
- source_word: κατὰ μόνας
  choice: 使它孤立起来
  rationale: 该短语表示单独、隔离的状态；“孤立起来”自然传达被切断联系的结果。
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: 好叫里面的人既不能买，也不能卖
  rationale: 原文复数主语未明说，语境指堡垒中的人；补出“里面的人”使现代汉语清楚，同时不另行限定其具体身份。
theological_decisions:
- issue: ἄκρα的历史名称与功能性称谓
  choice: 正文译作“堡垒”
  alternative: “亚克拉堡”或“卫城”
  rationale: 此处主要是历史地理名称，并无教义性争议。正文采用功能清楚的普通称谓，脚注保留历史专名，兼顾可读性与准确性。
- issue: 复数动词ἀγοράζωσιν、πωλῶσιν的隐含主语
  choice: 译作“里面的人”
  alternative: 仅译作“他们”
  rationale: 希腊文没有明说主语身份；语境最自然地指被隔离在堡垒中的人。译文只补足位置关系，不进一步判定其族群或政治身份，以保留原文未明说之处。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑起一道高大的屏障”兼顾原文对高度的强调与上下文中的隔绝功能；末句以“既不能买，也不能卖”保留原文对称结构。
