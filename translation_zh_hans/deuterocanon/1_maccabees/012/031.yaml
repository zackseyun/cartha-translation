  yaml_path: translation/deuterocanon/1_maccabees/012/031.yaml
  text: And Jonathan turned aside against the Arabs called the Zabadeans, and struck them, and took their spoils.
translation:
  language: zh_hans
  text: 约拿单转而进攻那些称为撒巴代人的阿拉伯人，打击了他们，并夺取了他们的战利品。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: 转而攻打
  rationale: 该动词本义是“转向、偏转”；在军事叙事中表示约拿单改变行进方向去攻击对方。“转而攻打”既保留转向之意，也自然呈现语境中的敌对行动。
- source_word: Ἀράβας
  choice: 阿拉伯人
  rationale: 指阿拉伯族群；“阿拉伯人”是现代汉语中自然、明确的表达。
- source_word: τοὺς καλουμένους
  choice: 称为
  rationale: 直接对应表示名称的被动分词，简洁说明该阿拉伯群体的称谓。
- source_word: Ζαβαδαίους
  choice: 撒巴代人
  rationale: 按希腊文 Ζαβαδαῖοι 音译这一族群名称，并用“人”标明群体身份。
- source_word: ἐπάταξεν
  choice: 击败
  rationale: 该词基本义为“击打、打击”；在随即夺取战利品的战斗语境中，“击败”是自然的现代汉语表达，但不额外断言其被彻底消灭。
- source_word: σκῦλα
  choice: 战利品
  rationale: 指战争中从敌方夺得的财物；“战利品”准确、庄重，也符合现代汉语习惯。
