  text: But we rejoice in your glory[a].
translation:
  language: zh_hans
  text: 但我们因你们的荣耀而欢喜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们因你们的尊荣而欢喜”，或“我们因你们的声望而高兴”。希腊语“荣耀”（δόξα）也可指尊荣或名声。
    reason: 说明δόξα的词义范围，并保留此处究竟强调荣耀、尊荣还是声望的歧义。
lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: 我们……欢喜
  rationale: 该形式在此表示欢欣、喜悦；“欢喜”自然庄重，并保留现在时所表达的持续状态。
- source_word: δὲ
  choice: 但
  rationale: δέ在此表示轻微的转折或承接；“但”保留其连接作用，不过原文的转折语气并不强。
- source_word: ἐπὶ
  choice: 因
  rationale: ἐπί与与格连用，在此表示欢喜的缘由或依据；译作“因”符合现代汉语表达。
- source_word: τῇ δόξῃ
  choice: 荣耀
  rationale: δόξα可指荣耀、尊荣或声望；“荣耀”保留原词较宽的语义范围和庄重语体，具体语境中也可能侧重受人尊重的地位或名声。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 第二人称复数所有格，指收信者这一群体。
