lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 指书面文件的抄本或副本；“副本”符合公函语境，现代中文自然简洁。
- source_word: ἐπιστολῶν
  choice: 书信
  rationale: 希腊文为复数属格，但现代汉语“书信”本身可作集合性表达，既不强行改为单数，也避免不自然的“多封书信”，从而保留原文形式与下文具体文本之间的张力。
- source_word: ἔγραψεν
  choice: 写给
  rationale: 动词本义是“写”；结合与格受信人，译为“写给”准确而自然，并不扩展为“寄给”。
- source_word: Ἰωνάθαν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Σπαρτιάταις
  choice: 斯巴达人
  rationale: 与格表示收信对象；“斯巴达人”是直接、通行的族群称呼。
