translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“重续”“弟兄情谊”“友好关系”适合正式外交往来；对两处ἀποστέλλω省略的宾语仅作汉语所需的最低限度补足，并用脚注说明。分号保留原句后半句的解释关系。
