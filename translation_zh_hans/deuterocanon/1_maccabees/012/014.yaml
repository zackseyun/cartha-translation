base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: zh_hans
  text: 我们曾设法向你们有所差遣[a]，以重续我们与你们之间的弟兄情谊和友好关系，免得我们与你们疏远；因为自从你们向我们有所差遣，已经过去许多时日了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“差遣”或“送出”，没有明说所遣的人、所送的东西或信息。
    reason: 保留希腊文ἀποστεῖλαι宾语省略所产生的含混；正文以“有所差遣”避免限定其对象。
  - marker: b
    text: “许多时日”原文直译为“许多时期”或“许多时节”；也可理解为“已经过了很久”。
    reason: 希腊文καιροί为复数，其时间单位并不明确，不宜径直限定为“许多年”。
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: 我们便设法
  rationale: 表达为实现某事而作出努力或尝试；“设法”在现代汉语中自然，也不暗示行动必已成功。上下文承接关系以“便”顺畅表达，但不增加因果内容。
- source_word: ἀποστεῖλαι
  choice: 派人去
  rationale: 原词基本义为“差遣、派出、送出”，希腊文未明说被派者或所送之物。汉语若只说“派去”不够自然，因此正文作最小限度补足，并以脚注保留原文省略。
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: 同你们的弟兄情谊和友好关系
  rationale: ἀδελφότης指弟兄般的情谊或联合关系，φιλία指友谊；πρὸς ὑμᾶς标明这关系以收信人为对象。“弟兄情谊和友好关系”兼顾外交语境与两个并列名词。
- source_word: ἀνανεώσασθαι
  choice: 重续
  rationale: 指使既有关系重新恢复或更新；“重续”符合书信及外交关系的语境，也表明这不是首次建立关系。
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: 免得我们与你们疏远
  rationale: πρὸς τὸ μή加不定式表示目的；ἐξαλλοτριόω在此为变得疏离、隔绝。“疏远”自然表达关系上的离异，未强化为敌对。
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: 因为……已经过去许多时日了
  rationale: καιροί为复数，可指多个时期、时节或一段段时间；“许多时日”保留时间延续感，同时避免无据地具体化为“许多年”。
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: 自从你们派人到我们这里来
  rationale: 原文直译为“自从你们差遣到我们这里”，同样未明说所差遣者。汉语以“派人”作必要补足，不擅自指定为使者、书信或礼物。
