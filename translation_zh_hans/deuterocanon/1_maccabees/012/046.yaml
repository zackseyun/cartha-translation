  text: And trusting him, he did as he said, and sent out the forces, and they went away into the land of Judah.
translation:
  language: zh_hans
  text: 他信任那人，就照那人所说的做，派出了军队；他们便前往犹大地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入犹大地”。这里的介词可强调进入该地，也可表示前往该地的目的地。
    reason: 保留εἰς在移动语境中可表示“进入”或“到、去往”的词义弹性。
lexical_decisions:
- source_word: ἐμπιστεύσας αὐτῷ
  choice: 他信任那人
  rationale: 不定过去时分词表示主句行动之前或其原因的信任。译作“信任”自然庄重；用“那人”避免连续两个“他”造成指代混乱，同时不擅自补入专名。
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: 就照那人所说的做
  rationale: 忠实表达按照对方先前所说而行动；“就”自然承接分词所含的因果或先后关系。
- source_word: ἐξαπέστειλεν τὰς δυνάμεις
  choice: 遣走了军队
  rationale: ἐξαποστέλλω在此表示把部队送离当前地点，δυνάμεις在军事语境中指武装力量。“遣走军队”保留离去之意，又不误解为解散军队。
- source_word: ἀπῆλθον
  choice: 他们便进入
  rationale: 动词本身含离开之意，但汉语若同时直译“离去并进入”较累赘；前文“遣走”已呈现离开，此处以“他们便进入”自然推进叙事。
- source_word: εἰς γῆν Ἰούδα
  choice: 进入犹大地
  rationale: γῆ Ἰούδα直译为“犹大地”；εἰς与移动动词连用，可强调进入该地，也可只表示前往该地，正文采用较贴近其基本空间意义的“进入”。
