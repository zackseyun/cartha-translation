base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
translation:
  language: zh_hans
  text: 我们曾试图借着传信[a]，更新与您们之间的弟兄情谊和友好关系，免得我们与您们疏远；因为自从您们传信给我们以来，许多时日已经过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传信”原文只作“差派”，没有说明所差派的是使者、书信，还是别的事物。下文“传信给我们”同样如此。
    reason: 保留ἀποστεῖλαι和ἀπεστείλατε未明说宾语所造成的歧义，同时使中文正文在外交通信语境中通顺。
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: 我们设法
  rationale: 表达尝试、作出努力的意思，又不暗示行动必已成功。
- source_word: ἀποστεῖλαι
  choice: 派人
  rationale: 原词只说“差派”，宾语未明；本句外交往来的语境很可能指派遣使者，但以脚注保留原文的开放性。
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: 与你们的弟兄情谊和友好关系
  rationale: “弟兄情谊”保留ἀδελφότης的亲族或兄弟关系色彩，“友好关系”自然表达外交语境中的φιλία。
- source_word: ἀνανεώσασθαι
  choice: 重申
  rationale: 该动词意为使既有关系再次更新；外交书信中“重申”比生硬的“更新”更自然，同时表明这种关系已经存在。
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: 好使我们不至于与你们疏远
  rationale: 保留目的结构以及关系变得生疏、隔绝的含义。
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: 因为……已经过了很长时间
  rationale: καιροί为复数，可泛指多个时期或时段；现代汉语用“过了很长时间”自然表达其整体时长。
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: 自从你们派人到我们这里以来
  rationale: ἀφʼ οὗ标示起点；ἀπεστείλατε未明说所派的是人、信或其他事物，正文按外交语境译为“派人”，并在脚注说明。
