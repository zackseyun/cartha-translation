base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: zh_hans
  text: 因此，我们时时不断地记念你们：在节期和其他指定的日子[a]，在所献的祭和祷告中；记念弟兄原是理所当然且合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其他合宜的日子”“其他惯常的日子”或“其他规定的日子”。希腊文 καθηκούσαις 可指合宜、惯常或为礼仪而指定的日子。
    reason: 保留καθηκούσαις在“合宜”“惯常”与“指定／规定”之间的词义范围，避免将其限定为“应当遵守”。
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: 不断
  rationale: 表达持续而不间断的记念，并与“无论何时”共同保留原文的强调语气。
- source_word: ἑορταῖς
  choice: 节期
  rationale: 指宗教礼仪中的节庆日期；“节期”在现代中文圣经语境中清楚、庄重，也不局限于宴席含义。
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: 其他应当遵守的日子
  rationale: καθηκούσαις 可指合宜、惯常或规定的日子；正文采用适合敬拜礼仪语境的表达，同时以脚注保留词义范围。
- source_word: μιμνησκόμεθα ὑμῶν
  choice: 记念你们
  rationale: 既可表示心中记得，也可表示在献祭和祷告中提及对方；“记念”保留此处积极、礼仪性的意味。
- source_word: ἐφʼ ὧν προσφέρομεν θυσιῶν
  choice: 在我们所献的祭……中
  rationale: 按祭祀语境处理为在所献的祭中记念对方，保留 προσφέρομεν θυσιῶν 的明确献祭用语，不泛化为一般敬拜。
- source_word: προσευχαῖς
  choice: 祷告中
  rationale: 与献祭并列，表示在共同体的祷告中记念收信者；中文依第一人称复数语境自然理解为“我们的祷告”。
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: 理所当然、合宜
  rationale: 用两个相近而不完全相同的词保留 δέον 与 πρέπον 所表达的应当性和适宜性。
- source_word: ἀδελφῶν
  choice: 弟兄
  rationale: 保留希腊文阳性复数的亲属称谓及其在民族外交关系中的手足修辞。
theological_decisions:
- issue: ἀδελφῶν 的性别化亲属称谓
  choice: 弟兄
  alternative: 弟兄姊妹；同胞；亲族
  rationale: 原文为阳性复数，并在盟友民族之间发挥手足般的政治及亲属修辞作用；不将其无依据地中性化或扩展。
- issue: 献祭与祷告的礼仪语境
  choice: 明确保留“所献的祭”和“祷告”
  alternative: 概括为奉献或敬拜
  rationale: 原文明确提到祭和祷告；泛化会削弱圣殿祭祀背景和两种礼仪行动的区分。
- issue: ἐφʼ ὧν προσφέρομεν θυσιῶν 的句法关系
  choice: 理解为在所献的祭中记念对方
  alternative: 理解为“当我们献祭时”
  rationale: 该短语可在中文中按礼仪关联自然表达；正文避免把它仅缩减为时间从句，并保留记念发生于献祭之中的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“节期”“记念”“献祭”等词保留礼仪语境；为使长句清楚，以分号划分主句，并在后半句重述“记念你们”，使各介词短语与核心动作的关系明确。
