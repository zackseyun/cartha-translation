base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/004.yaml
  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
translation:
  language: zh_hans
  text: 他们把信件交给这些人；信是写给沿途各地之人的[a]，好让当地的人送他们继续前往[b]犹大地，一路平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逐地写给当地的人”。原文表示信件分别写给行程中各地的人或当地主管者。
    reason: lexical_alternative
  - marker: b
    text: 或译：“帮助这些人继续上路”。原词也可包括送行、陪同并为旅人提供行程协助之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: 交给
  rationale: 表示把信件交到使团手中，比单说“给”更符合现代汉语叙事。
- source_word: ἐπιστολὰς
  choice: 信件
  rationale: ἐπιστολή通常指书信或书面函件；“信件”自然且不额外限定其官方性质。
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: 交给这些人……写给沿途各地之人
  rationale: 希腊文两个代词所指不同：前者是携信者，后者是沿途各地的收信者。汉语须适度明示，避免误解为同一群人。
- source_word: κατὰ τόπον
  choice: 沿途各地
  rationale: 保留逐地、各处的分配意义；结合行程语境译为“沿途各地”较自然，但不具体断定收信者必为官员。
- source_word: ὅπως
  choice: 要
  rationale: 引出信件的目的，简洁表达“为要／使得”的目的含义。
- source_word: προπέμπωσιν
  choice: 护送……前行
  rationale: 该词可指送行、护送或帮助旅人继续上路；正文采用符合旅行语境的“护送”，脚注保留较宽的可能含义。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 贴近“犹大的土地／地区”的原文结构，也符合中文圣经地名表达。
- source_word: μετʼ εἰρήνης
  choice: 平安
  rationale: 原义为“带着平安”，在旅行语境中含安全、顺利抵达之意；“平安”保留原文惯用表达。
