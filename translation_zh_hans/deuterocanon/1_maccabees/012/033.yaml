translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。地名依中文圣经常用译名处理：“亚实基伦”“约帕”；人名Σίμων译作“西门”。分号呈现行程推进与转向约帕之间的层次，同时保留原文连续叙事的节奏。
