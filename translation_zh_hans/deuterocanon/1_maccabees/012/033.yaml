  yaml_path: translation/deuterocanon/1_maccabees/012/033.yaml
  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: zh_hans
  text: 西门出发，一路行进，直到亚实基伦，并经过附近的要塞；随后他转往约帕，抢先占领了那城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢先占领”也可译作“预先控制”或“先夺取”；希腊文动词含有赶在另一方之前取得控制的意思。
    reason: 词义存在数种相近表达，脚注说明该动词所带的预先、抢先意味。
lexical_decisions:
- source_word: διώδευσεν
  choice: 一路行进
  rationale: 该动词表示穿行一片地域或沿路线行进；此译法自然地表达行经各处的意思，又不额外断定这是军事进军。
- source_word: ἕως Ἀσκάλωνος
  choice: 直到亚实基伦
  rationale: ἕως表示行程所达到的界限；“直到”保留了这一范围含义，而不只把亚实基伦说成普通目的地。
- source_word: τὰ πλησίον ὀχυρώματα
  choice: 附近的要塞
  rationale: ὀχυρώματα指设防之地或坚固据点；“要塞”简洁、清楚，πλησίον则译为“附近的”，不强行限定其具体从属关系。
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: 转往约帕
  rationale: ἐκκλίνω含有偏离原来路线、转向别处之意；“转往”在现代汉语中自然地体现行进方向的改变。
- source_word: προκατελάβετο
  choice: 抢先占领
  rationale: 该复合动词表示预先或赶在他方之前取得、控制某地；“抢先占领”同时保留占据和先于他方行动的语义。
- source_word: αὐτήν
  choice: 那城
  rationale: 代词在语法上回指阴性名词“约帕”；汉语用“那城”明确其所指，比直译为“它”更自然，且没有增加新的对象。
