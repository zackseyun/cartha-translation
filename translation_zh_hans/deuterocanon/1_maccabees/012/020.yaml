  text: Arius[a], king of the Spartans, to Onias the high priest, greetings.
translation:
  language: zh_hans
  text: “斯巴达人之王阿瑞乌斯[a]致大祭司敖尼雅：问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“阿瑞斯”（Ἄρης），与希腊神祇阿瑞斯之名同形；这里按历史背景视为斯巴达王的名字“阿瑞乌斯”。
    reason: 保留原文姓名形式与历史通称之间的差异和歧义。
lexical_decisions:
- source_word: Ἄρης
  choice: 阿瑞乌斯
  rationale: 此处在书信抬头中是斯巴达王的人名，不译作希腊神祇“阿瑞斯”；采用与历史上通常称作 Arius 的王名相对应的中文音译，并以脚注保留希腊文本形式上的歧义。
- source_word: βασιλεὺς Σπαρτιατῶν
  choice: 斯巴达人之王
  rationale: Σπαρτιατῶν 是复数属格，直接指“斯巴达人”这一群体，而不只是斯巴达这座城；“之王”兼顾准确与庄重。
- source_word: Ὀνείᾳ
  choice: 致……敖尼雅
  rationale: 与格在书信抬头中标明收信人；现代汉语以“致”自然表达。人名按其通行的闪语背景译作“敖尼雅”。
- source_word: ἱερεῖ μεγάλῳ
  choice: 大祭司
  rationale: 这是犹太宗教职分的通行中文称谓，比逐字译为“伟大的祭司”准确自然。
- source_word: χαίρειν
  choice: 问安
  rationale: 此词用于希腊书信的惯用问候格式，并非在此命令对方“喜乐”；“问安”简洁而符合中文书信语体。
