base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: zh_hans
  text: 他们到了罗马，进入议事厅[a]，说：“大祭司约拿单和犹太民族差遣我们来，要照从前那样，同他们重续盟约。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议事厅”也可译作“议政厅”或“议会大厅”；希腊文指执政议事团体开会的场所，并未直接使用罗马正式机构的名称。
    reason: 说明地点名词的词义范围，并避免把解释性的罗马制度名称写入正文。
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: 到了／进入
  rationale: 该动词表示前往；第一次按目的地自然译为“到了罗马”，第二次结合地点译为“进入议事厅”，既符合汉语表达，也保留两个连续动作。
- source_word: βουλευτήριον
  choice: 议事厅
  rationale: 该词具体指议政团体开会的场所；“议事厅”保留地点含义，不直接套用较具制度解释色彩的“元老院”。
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: 大祭司约拿单
  rationale: ἀρχιερεύς在此是犹太教职称“大祭司”；汉语将称号置于姓名前更自然。
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος在这里指作为政治和民族共同体的犹太人；“犹太民族”简洁且符合现代汉语。
- source_word: ἀπέστειλαν ἡμῖς
  choice: 差遣我们
  rationale: 现有希腊文本的ἡμῖς形式异常，但上下文明确表达约拿单和犹太民族派遣说话者前来，因此按句法所要求的第一人称复数宾格意义翻译。
- source_word: ἀνανεώσασθαι
  choice: 重续
  rationale: 该词表示使既有关系重新生效；外交语境中“重续”比“更新”更自然，并包含再次缔续之意。
- source_word: συμμαχίαν
  choice: 盟约
  rationale: 该词指政治或军事联盟关系；“盟约”在此体现正式外交协定，同时不增添原文未明说的具体条款。
- source_word: κατὰ τὸ πρότερον
  choice: 照从前那样
  rationale: 忠实表达恢复先前安排或关系的意思，措辞自然明白。
- source_word: αὐτοῖς
  choice: 与罗马人
  rationale: 代词所指是他们正在罗马接洽的对象；汉语若直译“与他们”容易指代不清，因此明示为“罗马人”，但不进一步限定为元老院或其他机构。
