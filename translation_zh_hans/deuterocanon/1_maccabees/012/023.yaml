base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: zh_hans
  text: 我们也写信答复你们说：“你们的牲畜和财产就是我们的，我们的也就是你们的。”[a] 因此，我们吩咐：要照此通知你们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们的牲畜和财产就是我们的，我们的也就是你们的”是一种表达联盟和彼此同心的外交用语，不一定表示双方在法律上取消各自的所有权。
    reason: cultural_note
  - marker: b
    text: “照此通知你们”也可译作“把同样的意思告诉你们”。希腊文没有明说所通知的具体内容，也只借复数动词形式暗示施事者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: 回信
  rationale: 在书信往来的语境中，此词表示以书面作答，而不只是机械地“抄写”；“回信”自然保留了回应之意。
- source_word: κτήνη
  choice: 牲畜
  rationale: 此处指作为财产的驯养动物或畜群；“牲畜”符合现代汉语，也与后面的“财产”搭配自然。
- source_word: ὕπαρξις
  choice: 财产
  rationale: 此处表示一个人的物质所有或产业；“财产”简洁地保留其集合性含义。
- source_word: ἐντελλόμεθα
  choice: 已吩咐
  rationale: 该词表示下达指示或命令；“吩咐”保留正式权威语气，又不过分生硬。
- source_word: ἀπαγγείλωσιν
  choice: 使者……转告
  rationale: 动词表示报告、传达消息。希腊文的主语仅由复数动词形式体现，结合外交书信语境，译作“使者……转告”可使中文通顺，但“使者”为语境性补足。
- source_word: κατὰ τὰ αὐτά
  choice: 照此
  rationale: 该短语指按照前述内容、传达同样意思；“照此”简洁自然，并保留其所指略有含混的特点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书信语言。“就是”体现联盟宣言的强调语气；将复数动词所指的传信人员译为“使者”，以避免现代汉语中无明确先行词的“他们”，并用脚注说明原文的省略与含混。
