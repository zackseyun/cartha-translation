  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
translation:
  language: zh_hans
  text: 敌人听说约拿单和同他在一起的人已经做好了作战的准备，就害怕起来，灰心丧胆[a]，并在营中点起火来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“他们使自己的心凝固了”；这是形容因恐惧而灰心丧胆的说法。
    reason: 保留希腊原文的具体意象及其习语含义。
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: 敌人
  rationale: 指与约拿单一方敌对的人；在备战的军事语境中，“敌人”比“对手”更自然明确。
- source_word: ἡτοίμασται Ἰωναθὰν καὶ οἱ παρʼ αὐτοῦ
  choice: 约拿单和跟随他的人已经做好了……准备
  rationale: 完成时表达已经形成的准备就绪状态；“跟随他的人”忠实表达 οἱ παρʼ αὐτοῦ，又不额外限定其身份。
- source_word: εἰς πόλεμον
  choice: 作战
  rationale: 表示为战争或战斗做准备；“作战”符合本节军事语境，也比直译“战争”更符合现代汉语搭配。
- source_word: ἐφοβήθησαν
  choice: 害怕起来
  rationale: 自然表达不定过去时所叙述的恐惧反应。
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: 灰心丧胆
  rationale: 原文直译近于“他们的心凝固了”，在此表达因恐惧而丧失勇气；正文采用自然汉语习语，脚注保留原文意象。
- source_word: ἀνέκαυσαν πυρὰς
  choice: 点起火来
  rationale: 准确表达点燃、燃起多处火堆的动作，不额外断定其具体用途。
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: 在营中
  rationale: παρεμβολή 在军事语境中指营地；“营中”简洁庄重。
