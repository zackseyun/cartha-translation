  text: I too will write to them words of encouragement and honor and gifts,[a]
translation:
  language: zh_hans
  text: 我也要写信给他们，写些鼓励、尊荣和馈赠的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”所译的希腊词ὕψους本义为“高度、升高”；此处也可理解为“高升”或“提升地位”。“馈赠”与前面的“鼓励、尊荣”同为“话”的内容或性质，并非原文另行明说的送礼行动。
    reason: 保留ὕψους在尊荣与地位提升之间的词义开放性，并说明δομάτων的句法关系。
lexical_decisions:
- source_word: γράψω
  choice: 我要写信
  rationale: 将来时主动直陈语气表示说话者接下来要采取的行动；结合间接宾语“给他们”，译作“写信”比单说“写”更符合此处书信语境。
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ是καί与ἐγώ的缩合，带有附加和强调意味；“我也”自然保留这一语气。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 作γράψω的与格间接宾语，译作“给他们”符合现代汉语表达。
- source_word: λόγους
  choice: 话
  rationale: 此词泛指所写的信息或言辞；“话”既保留原文的宽泛性，也适合“写些……的话”的汉语结构。
- source_word: παρακλήσεως
  choice: 鼓励
  rationale: παράκλησις可表示劝勉、鼓励、安慰或恳求；在外交政治语境中，“鼓励”传达积极安抚的语气，而不作过度限定。
- source_word: ὕψους
  choice: 抬举他们
  rationale: ὕψος本义为“高度、提升”，此处可能指给予尊荣或提升地位；“抬举他们”保留动态的提升意味，也符合政治争取的语境。原文未明说“他们”为该词的宾语，因此以脚注保留较形式化的另一译法。
- source_word: δομάτων
  choice: 礼物
  rationale: δόμα指赠礼或礼品；“礼物”是直接且不额外限定其制度性质的译法。
- source_word: καὶ δομάτων
  choice: 并送上礼物
  rationale: 希腊文把“礼物”与前面的属格名词并列，表达略显压缩；汉语补出“送上”，使句意自然，同时不把礼物具体解释为赏赐、拨款或特权。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“写些……的话，并送上礼物”适度化解希腊文压缩的并列结构；脚注则保留关键词ὕψους的真实歧义。
