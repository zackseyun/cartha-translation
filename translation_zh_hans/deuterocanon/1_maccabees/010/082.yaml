base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: zh_hans
  text: 西门部署了自己的部队，迎战方阵[a]；因为骑兵[b]的阵势已经瓦解[c]。他们被西门击溃，逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “方阵”指希腊化时代密集排列作战的步兵阵形。
    reason: historical_context
  - marker: b
    text: 原文直译为“马”，这里指骑兵。
    reason: lexical_alternative
  - marker: c
    text: 或译“已经溃散”或“已经被拆散”，指骑兵失去了阵形和组织。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  choice: 部署了
  rationale: 在军事语境中，此词指把兵力调出并投入行动；“部署了”自然明确，同时避免拘泥于字面的“解开”。
- source_word: τὴν δύναμιν αὐτοῦ
  choice: 自己的部队
  rationale: δύναμις在此指一支军事力量；“部队”保留集合意义，又不把它过度具体化为完整军队。
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: 迎战方阵
  rationale: 该表达指与对方阵列接战；“迎战”符合现代汉语战事叙述，并保留交锋之意。
- source_word: φάλαγγα
  choice: 方阵
  rationale: φάλαγξ指希腊化时代特定的密集步兵阵形；“方阵”保留其历史和军事特征。
- source_word: ἡ γὰρ ἵππος
  choice: 因为骑兵
  rationale: ἵππος字面为“马”，但这里是军事集合用法，指骑兵；译作“骑兵”清楚自然。
- source_word: ἐξελύθη
  choice: 已经阵势瓦解
  rationale: 此被动形式表示骑兵失去组织和凝聚力；“阵势瓦解”既呈现溃散状态，也不提前等同于后文明确说出的逃跑。
- source_word: συνετρίβησαν
  choice: 被……击溃
  rationale: 此词表达在战斗中遭到彻底打垮；“击溃”比字面的“压碎”更符合现代汉语军事叙述。
- source_word: ἀπʼ αὐτοῦ
  choice: 被西门
  rationale: 介词短语在此可表示施事者；明确重提“西门”可避免汉语代词指向不清，同时不增加原文没有的人物。
theological_decisions:
- issue: 复数主语“他们”（συνετρίβησαν……ἔφυγαν）的所指
  choice: 保留“他们”，不明确限定为方阵或骑兵
  alternative: 译作“敌军”或明确译作“方阵部队／骑兵”
  rationale: 紧邻的“骑兵”在希腊文中为单数集合名词，而后续动词为复数；其所指可能转向作战者整体或先前提到的阵列。译文保留代词，以保存原文的指代张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以简洁的战事叙述呈现原文。用“部署”“迎战”“阵势瓦解”“击溃”等普通读者易懂的军事词汇；保留末句“他们”的指代含混，不擅自限定其对象。
