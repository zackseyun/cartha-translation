  text: Since you have kept faith with us in the treaties[a], and have remained in our friendship and have not joined our enemies, we have heard[b], and
translation:
  language: zh_hans
  text: 因为你们在条约上对我们守信[a]，一直保持同我们的友好关系，也没有投向我们的仇敌；我们已经听说了，并且——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在条约中一直对我们忠诚。”这里的“守信”也可指信实或忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: 因为
  rationale: 引出下文行动的理由；现代汉语中“因为”清楚自然。
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς συνθήκας
  choice: 你们在盟约中一直忠于我们
  rationale: 原文传本在此处句法略显生硬，并有重复的 καί；按外交语境，πίστις 表示守信、忠诚，συνθῆκαι 指正式盟约。此译保留“对我们忠诚”和“盟约”的双重信息。
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: 持守与我们的友好关系
  rationale: ἐμμένω 表示持续、坚守；φιλία 在政治书信中既可指友谊，也带有邦交或联盟意味。“友好关系”比直译“我们的友谊”更符合现代汉语外交语境。
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: 没有投靠我们的仇敌
  rationale: προσχωρέω 在此表示归附、转而站到另一方；“投靠”准确传达政治军事语境。
- source_word: ἠκούσαμεν
  choice: 这事我们已经听说了
  rationale: 补出汉语所需的宾语“这事”，指前述忠诚行为；“已经听说了”体现书信中得知消息后的现实关联。
theological_decisions:
- issue: 政治外交语境中 πίστις 的译法
  choice: 忠于我们
  alternative: 对我们守信；向我们保持忠诚
  rationale: 此处 πίστις 并非专指宗教信仰，而是盟约关系中的信实和忠诚。中文若直译为“信心”会造成误解，因此按语境译为“忠于”，并以脚注保留“守信”的可能表达。
- issue: 本节末尾未完句的处理
  choice: 保留“并且——”以显示句子延续
  alternative: 只以逗号结束，接续下一节
  rationale: 现存希腊文本以 καί 结束，本节边界处句法未完。破折号既不擅自补足内容，也让现代读者清楚看出话语接续到下一节。
translation_notes:
  register: 采用现代、庄重而易懂的书信与外交语体。“盟约”体现正式政治协议，“友好关系”传达 φιλία 的外交色彩。原文含异常重复的 καί，未在正文机械重现；但末尾实际保留的 καί 以“并且——”呈现，避免把未完句误作完整句。
