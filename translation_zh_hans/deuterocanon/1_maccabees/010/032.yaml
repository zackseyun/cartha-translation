base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: zh_hans
  text: 我也放弃对耶路撒冷卫城[a]的管辖权，将这管辖权交给大祭司，让他在其中派驻他亲自选定的人来守卫它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶路撒冷的阿克拉”；“阿克拉”是这座设防据点名称的传统音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίημι
  choice: 放弃
  rationale: 在行政权力移交的语境中，表示放弃或交出原有权利，而非“赦免”。
- source_word: ἐξουσίαν
  choice: 管辖权
  rationale: 体现对城堡实施治理和控制的合法权柄，比泛指的“权力”更符合行政语境。
- source_word: ἄκρας
  choice: 城堡
  rationale: 此处指耶路撒冷境内设防的坚固据点；“城堡”自然易懂，专名音译见脚注。
- source_word: δίδωμι
  choice: 交给
  rationale: 表达正式将城堡及其控制权移交大祭司，符合现代汉语表达。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是犹太宗教及政治语境中ἀρχιερεύς的标准译法。
- source_word: ὅπως ἂν καταστῇ
  choice: 好让他派……驻守
  rationale: καθίστημι在此指把人安置在某一岗位；结合守卫语境，“派……驻守”比单说“任命”更具体自然。
- source_word: ἄνδρας
  choice: 人
  rationale: 现代汉语“人”可自然指执行守卫任务者；原文虽为阳性复数，但此处重点在被选派的守卫人员，并无须用生硬的“男人”。
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: 自己所拣选的人
  rationale: “自己”保留αὐτός的强调，表明人选由大祭司亲自决定。
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: 驻守在那里
  rationale: 目的在守卫该城堡；汉语以“驻守在那里”简洁表达人员被安置于城堡执行守卫任务。
theological_decisions:
- issue: ἄκρα应译作普通名词还是音译为专名
  choice: 城堡
  alternative: 阿克拉堡
  rationale: 正文采用普通名词，清楚呈现这是一处设防据点；脚注保留传统专名音译及其历史特指性，不把两种理解强行合一。
translation_notes:
  register: 采用现代、庄重而易懂的行政叙事语体。“放弃……管辖权，把它交给……”清楚呈现权力移交；“派……驻守”避免逐词硬译，同时保留选派人员守卫城堡的目的关系。
