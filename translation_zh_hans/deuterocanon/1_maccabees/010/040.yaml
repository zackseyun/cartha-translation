base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/040.yaml
  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: zh_hans
  text: 我也每年拨出一万五千舍客勒银子；款项出自王的账目[a]，取自所属各地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的账目”也可译作“王的收入”或“王的财库”；希腊文直译近于“王的账目／核算”。
    reason: lexical_alternative
  - marker: b
    text: 也可直译为“从所属的各地方”。这里可能指款项所取自的地区或辖区；希腊文没有明说这些地方归属于谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: 我也
  rationale: κἀγώ由καί与ἐγώ缩合而成；“我也”既承接上文，也保留主语的强调。
- source_word: δίδωμι
  choice: 拨出
  rationale: 基本义为“给”；在王室财政拨款的语境中，“拨出”更自然，同时不把款项的具体法律性质说得过死。
- source_word: κατʼ ἐνιαυτόν
  choice: 每年
  rationale: 准确表达按年重复发生的分配，简洁自然。
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  choice: 一万五千舍客勒银子
  rationale: 保留古代重量兼货币单位“舍客勒”，并以“银子”表达ἀργυρίου。
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  choice: 列在王的账项下
  rationale: λόγος在此财政语境中可指账目、核算或款项；“列在王的账项下”保留账务含义，也符合现代汉语行政表达，不武断限定为国库或税收。
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  choice: 从所属各地支取
  rationale: τόποι可能指作为款项来源的地方或辖区，ἀνηκόντων表示归属或隶属；希腊文未明说归属于谁，正文用“所属”保留这种省略。
