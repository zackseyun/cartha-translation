base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/023.yaml
  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: zh_hans
  text: 他很忧愁，说：“我们这是做了什么，亚历山大竟先我们一步，同犹太人建立友好关系，以获得支持[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把犹太人作为支持力量。”
    reason: 原文“以作支持”可宽泛地指借这段友好关系获得助力，也可理解为将犹太人视为支持力量。
lexical_decisions:
- source_word: ἐλυπήθη
  choice: 很懊恼
  rationale: 此处表示因政治上被对手抢先而忧愁、烦恼；“懊恼”既保留情绪上的痛苦，也符合上下文中的挫败感。
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: 我们这是做了什么
  rationale: 保留原文带有自责意味的反问及对“这事”的强调，同时符合现代汉语表达。
- source_word: προέφθακεν ἡμᾶς
  choice: 抢在我们前面
  rationale: 准确表达“先于、赶在……之前”的意思，也自然呈现双方争取犹太人支持的竞争关系。
- source_word: φιλίαν
  choice: 友好关系
  rationale: 原词本义是“友谊”，在此外交语境中含有政治结交的意味；“友好关系”既不过度具体化为正式盟约，也能传达其政治色彩。
- source_word: καταλαβέσθαι
  choice: 建立
  rationale: 该中间语态不定式在这里指为自己取得或赢得友好关系；汉语以“建立友好关系”表达最为自然。
- source_word: εἰς στήριγμα
  choice: 好以此为助力
  rationale: 保留“作为支持、巩固力量”的目的意味，同时不武断限定“此”专指犹太人还是所建立的友好关系。
