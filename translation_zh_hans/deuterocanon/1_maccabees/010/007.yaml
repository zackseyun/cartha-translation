  yaml_path: translation/deuterocanon/1_maccabees/010/007.yaml
  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: zh_hans
  text: 约拿单来到耶路撒冷，把那些书信念给全体百姓和从城堡[a]来的人听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城堡”也可更具体地译作“阿克拉堡”，即耶路撒冷的一座设防要塞。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 来到
  rationale: 不定过去时在叙事中表示约拿单抵达耶路撒冷；“来到”自然简洁，也不额外强化抵达过程。
- source_word: ἀνέγνω
  choice: 念给……听
  rationale: ἀναγινώσκω本义为“读”；与εἰς τὰ ὦτα连用时明确指向公开朗读。“念给……听”既体现口头宣读，也避免重复表达。
- source_word: τὰς ἐπιστολάς
  choice: 那些书信
  rationale: ἐπιστολή通常指书信或书面函件；上下文所指明确，译作“那些书信”最为直接。
- source_word: εἰς τὰ ὦτα παντὸς τοῦ λαοῦ
  choice: 给全体百姓……听
  rationale: “进入耳中”是听觉表达的习语；汉语以“念给……听”自然传达当众宣读、众人听见的意思。
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: 从城堡来的人
  rationale: 保留ἐκ的来源意味；ἄκρα既可泛指设防城堡，也可能具体指耶路撒冷的阿克拉堡，后者在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“念给……听”自然整合了“读”与“让人听见”的希腊语结构；“从城堡来的人”保留原文ἐκ所表达的来源关系，不在正文中强行判定这些人的具体身份。
