translation:
  language: zh_hans
  text: 约拿单发觉在他后面有伏兵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: 发觉
  rationale: 此处不定过去时表示约拿单在战斗过程中察觉到情况；“发觉”自然地传达由不知到知道的动态，也比静态的“知道”更贴合语境。
- source_word: ἔνεδρον
  choice: 伏兵
  rationale: 该词可指埋伏或设伏者；在军事叙事中，“有伏兵”既简洁自然，也保留这个单数中性名词可能具有的集合意义。
- source_word: κατόπισθεν αὐτοῦ
  choice: 在他后面
  rationale: 直接表达伏兵位于约拿单后方，不额外推断距离或行动方向。
- source_word: καὶ
  choice: （承接叙事，中文不另译）
  rationale: καὶ在此主要连接连续事件。现代汉语叙事无需机械译作“而且”或“于是”；省略连接词更自然，也不增添因果或时间色彩。
- source_word: ἐστιν
  choice: 有
  rationale: 存在句“有伏兵”准确表达ἐστιν的存在意义，并符合现代汉语习惯。
