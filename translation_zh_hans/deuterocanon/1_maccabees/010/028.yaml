  text: And we will repay you with good things for what you are doing with us.
translation:
  language: zh_hans
  text: 我们也必以好处回报你们，报答你们同我们所做的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“报答你们为我们所做的事”或“报答你们对我们所做的事”。希腊文直译为“同我们”，可指同我们合作，也可指对我们有利或对待我们的作为。
    reason: 保留μεθʼ ἡμῶν的字面“同我们”及其在语境中可能指合作、为本方行事或对本方行事的关系歧义。
lexical_decisions:
- source_word: ἀνταποδώσομεν
  choice: 我们也必……回报你们
  rationale: 该词为将来时主动语态，表示作为回应而给予或偿还；“必……回报”既保留将来意味和相互回应的含义，也符合现代汉语表达。
- source_word: ὑμῖν
  choice: 你们
  rationale: 与格间接受词；汉语用“回报你们”即可自然体现其句法作用。
- source_word: ἀγαθὰ
  choice: 好处
  rationale: 中性复数形容词作名词使用，泛指各样有益之事。“好处”自然且不过度限定具体内容；汉语无需机械标示复数。
- source_word: ἀνθʼ ὧν
  choice: 以……所……的事
  rationale: 该表达表示回报的根据或交换关系；以“以……回报”传达“作为对……的回报”之意，同时保持句子简洁。
- source_word: ποιεῖτε
  choice: 所……做的
  rationale: 现在时呈现正在进行或一贯发生的行为；汉语定语结构不强制标明进行体，因此采用自然的“所做的”，不误作已经完成。
- source_word: μεθʼ ἡμῶν
  choice: 为我们
  rationale: μετά加属格通常是“与我们同在／同我们一起”；但在此回报语境中，可指对本方有利的合作或作为。正文采用自然的“为我们”，并以脚注保留较为字面的可能理解。
