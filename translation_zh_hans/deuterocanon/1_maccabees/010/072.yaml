base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
translation:
  language: zh_hans
  text: 你去打听，弄清楚我是谁，也弄清楚其余帮助我们的人是谁。他们说：“你们在我们面前站不住脚[a]，因为你的祖辈曾在自己的土地上两次被击溃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“你们在我们面前没有立足之处”。这里是说他们无法在对方面前站稳并与之抗衡。
    reason: 说明希腊文“脚的站立”这一习语及其军事语境含义。
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: 你去打听，弄清楚
  rationale: 保留两个单数命令语气及“询问—获知”的先后关系；“打听、弄清楚”符合挑战性的语境，也比生硬的“询问并学习”自然。
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: 其余帮助我们的人
  rationale: “其余”对应 λοιποί，“帮助我们”保留 βοηθοῦντες 的主动、持续含义，不擅自限定为军事盟军。
- source_word: λέγουσιν
  choice: 他们说
  rationale: 保留希腊文复数现在时及其主语指向上的含混，不改写为“他们会告诉你”或无主句。
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: 你们在我们面前站不住脚
  rationale: “站不住脚”保留 στάσις ποδός 的足部意象，并以现代汉语表达无法在对方面前立足、抗衡；“在我们面前”贴近 κατὰ πρόσωπον ἡμῶν。
- source_word: δὶς ἐτροπώθησαν
  choice: 两次被击溃
  rationale: δὶς 明确为“两次”；军事语境中的被动动词表示遭到击退或溃败，“被击溃”保留其力度。
- source_word: οἱ πατέρες σου
  choice: 你的祖辈
  rationale: 此处 πατέρες 指先人或祖先；“祖辈”在现代汉语中自然，并保留针对对方家世的羞辱语气。
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: 在自己的土地上
  rationale: 明确 αὐτῶν 的所属意味，突出他们甚至在本土也遭击溃的嘲讽。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的挑战语气。“你去”与“你的祖辈”保留希腊文单数对象，“你们……站不住脚”则保留原文在该句转用复数第二人称的变化；不将这种数的转换抹平。
