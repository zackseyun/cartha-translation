  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: zh_hans
  text: 约拿单从那里动身，在亚实基伦安营；城里的人出来迎接他，以极大的尊荣相待。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极其隆重地”；也可译为“带着极大的荣耀”。希腊文强调城中人迎接约拿单时场面的盛大和所表达的尊崇。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 动身
  rationale: 此处是不定过去时，表示约拿单离开先前所在之地并继续行程；“动身”自然简洁，不额外限定出行方式。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 该动词在军事和行旅语境中通常指扎营；“安营”保留叙事的军事色彩，也符合现代汉语表达。
- source_word: Ἀσκάλωνα
  choice: 亚实基伦
  rationale: 采用该古城在现代中文圣经及相关文献中的通行译名。
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 与“迎接他”连用时，“出来”准确体现城中人由城内向外行动。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 原文泛指来自城中的人，并未明确限定为男性；此译法自然且不缩窄所指范围。
- source_word: εἰς συνάντησιν αὐτῷ
  choice: 迎接他
  rationale: 该结构表示出去与某人相会；在公开接待的语境中，“迎接他”比单纯“去见他”更贴切。
- source_word: ἐν δόξῃ μεγάλῃ
  choice: 给他极大的尊荣
  rationale: δόξα在此可指尊荣、荣耀或盛大的排场。结合全城出迎的接待场景，“给他极大的尊荣”自然传达隆重礼遇，同时避免误读为专指神圣荣耀。
