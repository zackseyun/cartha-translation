base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: zh_hans
  text: 骑兵在平原上溃散了。他们逃到阿佐托斯，进入伯特大衮——他们的偶像庙宇[a]——以求保全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“进入伯特大衮，就是他们的偶像。”希腊文的同位结构十分紧缩；按上下文，意思是他们进入了与其偶像有关的庙宇。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: 骑兵
  rationale: 该词虽为单数形式，但在军事语境中集合性地指骑兵部队；译作“骑兵”既自然，也避免误解为一匹马。
- source_word: ἐσκορπίσθη
  choice: 溃散了
  rationale: 被动形式描写骑兵队伍在战场上被打散；“溃散”比单纯的“分散”更贴合败退语境。
- source_word: ἐν τῷ πεδίῳ
  choice: 在平原上
  rationale: πεδίον通常指平坦开阔之地；此处为军事地理场景，“平原”最为贴切。
- source_word: ἔφυγον εἰς Ἄζωτον
  choice: 他们逃到阿佐托斯
  rationale: 按希腊文本的地名形式音译Ἄζωτον，并以“逃到”自然表达逃往该地的动作。
- source_word: Βηθδαγὼν
  choice: 伯特大衮
  rationale: 将其作为处所名称音译；后面的同位语进一步说明它是与当地偶像崇拜有关的庙宇。
- source_word: τὸ εἴδωλον αὐτῶν
  choice: 他们的偶像庙宇
  rationale: 字面为“他们的偶像”，但上下文说人可以进入伯特大衮，表明所指是与该偶像相连的圣所。“偶像庙宇”保留εἴδωλον的负面评价，也使中文语义完整。
- source_word: τοῦ σωθῆναι
  choice: 求得保全
  rationale: 带冠词的不定式表达目的；“求得保全”保留被救护、脱险的含义，又不把此处狭窄地限定为属灵意义的“得救”。
theological_decisions:
- issue: 非利士宗教语境中εἴδωλον的译法
  choice: 偶像庙宇
  alternative: 偶像；他们偶像的庙宇；神龛
  rationale: 原文使用带有贬义色彩的εἴδωλον，而非中性的神祇或庙宇用词。译文保留“偶像”这一评价，同时说明伯特大衮是人能够进入避难的宗教建筑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“溃散”“求得保全”符合战败逃难的语境；破折号保留原文同位语的紧缩感，同时借脚注交代较直译形式。
