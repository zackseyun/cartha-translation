base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: zh_hans
  text: 至于我有权收取的播种所得的三分之一[a]和树上果实的一半[b]，从今天起，我一概免收，不再从犹大地以及从撒玛利亚和加利利划归犹大的三个行政区[c]征收；这项免除从今天起永远有效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “播种所得的三分之一”指与播种农作物有关的三分之一份额，也可译作“农作物的三分之一”。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的一半，是原本归王收取的份额或税收。
    reason: cultural_note
  - marker: c
    text: “行政区”译自希腊文 nomoi，指行政区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  choice: 至于……播种所得的三分之一
  rationale: 此处ἀντί引出获准免收的项目；σπορά在财政语境中指播种所得的农产。译文保留“播种”这一表达，并以“所得”说明税赋对象，避免误解为征收种子本身。
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: 树上果实的一半
  rationale: ξυλίνου在这里指树木所产的果实；“树上果实”自然清楚，也比字面的“木质果实”准确。
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: 我有权收取的
  rationale: ἐπιβάλλοντός表达归于王、应由王取得的份额；“有权收取”保留法定归属之意，不把它仅解释为已经实际征得。
- source_word: ἀφίημι
  choice: 我一概免收
  rationale: 在税赋语境中指放弃或免除应收份额。“免收”比“释放”自然，也比“赦免”更明确地体现财政含义。
- source_word: τοῦ λαβεῖν
  choice: 不再……征收
  rationale: 承接ἀφίημι，说明上述份额不再从指定地区收取；中文采用主动财政用语，使句法清楚而不改变含义。
- source_word: γῆς Ἰούδα
  choice: 犹大地
  rationale: 直接保留地理称谓及“地”的表达，不扩大解释为特定行政建制。
- source_word: τῶν τριῶν νομῶν
  choice: 三个行政区
  rationale: νομοί指行政区域。“行政区”既说明其制度性质，又避免音译术语造成理解障碍。
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: 划归犹大的
  rationale: 表示三个行政区被加给、归入犹大。“划归”符合行政语境，并明确代词αὐτῇ的所指。
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: 从撒玛利亚和加利利
  rationale: 依原文保留两个来源地区；不进一步判定三个行政区分别来自哪一地。
- source_word: ἀπὸ τῆς σήμερον ἡμέρας καὶ εἰς τὸν ἅπαντα χρόνον
  choice: 从今天起永远有效
  rationale: 自然表达该免除自当日开始并持续所有时间；“永远有效”保留敕令式正式语气。
