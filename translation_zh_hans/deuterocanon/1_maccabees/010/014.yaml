lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 表达转折和例外：其他据点虽已撤离，伯夙拉却仍有人留下。
- source_word: Βεθσούροις
  choice: 伯夙拉
  rationale: 按该地名常见的中文音译处理。
- source_word: ὑπελείφθησάν
  choice: 还留下了
  rationale: 保留被动意义的结果状态，同时使现代汉语自然；并未明确他们是主动留下。
- source_word: τῶν καταλειπόντων τὸν νόμον καὶ τὰ προστάγματα
  choice: 背弃律法和诫命的人
  rationale: καταλείπω在此指离弃或抛弃；προστάγματα指权威颁布的命令或规定，译作“诫命”符合上下文。
- source_word: φυγαδευτήριον
  choice: 避难所
  rationale: 指逃亡者藏身、获得庇护之处。
