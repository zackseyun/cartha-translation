base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: zh_hans
  text: 王叫他与自己同坐[a]，又对官员们说：“你们陪同他到城中央去，宣告任何人都不得因任何事控告他[b]，也不许任何人因任何缘故打扰他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与自己同坐”直译为王使他“同自己坐下”。原文的使动结构强调是王亲自作此安排，并含有尊荣之意。
    reason: 说明καθίζω的使动意义及μετʼ αὑτοῦ的自然译法。
  - marker: b
    text: “控告”也可译作“提出不利于他的申诉”。原文动词可指向权力机关陈情、申诉或提出控诉；这里很可能具有官方或法律意味。
    reason: 保留ἐντυγχάνειν κατὰ τούτου的词义范围，避免将其仅限为现代刑事意义的控告。
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: 王让他坐在自己身边
  rationale: 保留 καθίζω 的使动意义，也自然表达王让约拿单与自己同坐所显示的尊荣。
- source_word: τοῖς ἄρχουσιν
  choice: 官员们
  rationale: ἄρχοντες 泛指掌权者；本处是王廷语境，“官员们”准确而不过度限定其军政职衔。
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: 你们陪他到城中央去
  rationale: 表达 μετʼ αὐτοῦ 的同行含义及 εἰς μέσον τῆς πόλεως 的公开中心地点；“陪他”符合中文叙事，但不额外强化为正式护送。
- source_word: κηρύξατε
  choice: 宣告
  rationale: 体现 κηρύσσω 由传令者公开发布正式命令的色彩。
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: 任何人都不得为任何事控告他
  rationale: ἐντυγχάνειν 与 κατά 连用，在此很可能指向官府提出不利申诉或控告；“控告”清楚呈现其法律、行政意味，同时以脚注保留“提出申诉”的可能。
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω
  choice: 也不许任何人……骚扰他
  rationale: ἐνοχλέω 表示打扰、纠缠或骚扰；“骚扰”适合王命禁止他人干扰约拿单的语境。
- source_word: περὶ παντὸς λόγου
  choice: 因任何缘故
  rationale: λόγος 在此是事项、理由或缘故；这样译既保留全面禁止的范围，也避免与前面的 πρᾶγμα 重复使用“事”。
