  yaml_path: translation/deuterocanon/1_maccabees/010/027.yaml
  text: We rejoiced[a]. And now continue still to keep faith with us,
translation:
  language: zh_hans
  text: 我们很欢喜。如今，你们仍要继续保持对我们的忠诚，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保持对我们的忠诚”也可译作“对我们保持信实”或“继续忠于我们”。
    reason: 说明 πίστιν 与 συντηρῆσαι 在政治盟约语境中的可选译法。
lexical_decisions:
- source_word: ἐχάρημεν
  choice: 我们很高兴
  rationale: 该词为 χαίρω 的不及物用法，表示因前述事情而欢喜；“很高兴”符合现代汉语书信语体，也保留了简明的过去陈述。
- source_word: καὶ νῦν
  choice: 如今
  rationale: 承接前文并转入当下的劝勉；汉语用“如今”自然凝练，无须机械保留连接词“并且”。
- source_word: ἐμείνατε ἔτι
  choice: 仍要继续
  rationale: ἐμείνατε 在此按命令语气理解，ἔτι 强调持续不变；合译为“仍要继续”，保留劝告对方维持既有立场的意味。
- source_word: τοῦ συντηρῆσαι
  choice: 信守
  rationale: 此处不定式说明所要持续做的事；结合宾语 πίστιν，译作“信守”比逐字的“保存”更符合汉语外交语境。
- source_word: πρὸς ἡμᾶς
  choice: 对我们的
  rationale: πρός 表示忠诚信实所指向的关系对象；“对我们的”在现代汉语中清楚表达这种关系取向。
- source_word: πίστιν
  choice: 忠诚
  rationale: 在政治及盟约书信语境中，该词主要指信实、忠贞或忠诚，而非宗教意义上的信仰；“忠诚”最自然地传达此处含义，并以脚注保留较贴近词形结构的另一种表达。
theological_decisions:
- issue: 政治盟约语境中 πίστιν 的译法
  choice: 忠诚
  alternative: 信实；信用；信仰
  rationale: 本句谈的是对统治者或盟友持续守信，语境明确偏向关系和政治上的忠诚。译作“信仰”会在现代汉语中误导为宗教信念；脚注保留“信实”的可能表达，以呈现该词的语义幅度。
translation_notes:
  register: 采用现代、庄重的王室书信语体。“你们”承接复数主语；句末逗号保留原文尚未结束、下文续接的结构。
