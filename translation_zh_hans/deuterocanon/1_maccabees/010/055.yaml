  yaml_path: translation/deuterocanon/1_maccabees/010/055.yaml
  text: And King Ptolemy answered, saying, “A good day is this, on which you returned to the land of your fathers and sat on the throne of their kingdom.”
translation:
  language: zh_hans
  text: 托勒密王回答说：“你回到你祖先的土地，坐上他们王国的宝座的这一天，是个好日子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεκρίθη
  choice: 回答
  rationale: 按上下文取其应答、回应之义；现代汉语无需重复译出希腊语伴随表达“λέγων”。
- source_word: γῆν πατέρων σου
  choice: 你祖先的土地
  rationale: 忠实保留“父辈、祖先之地”的家族与历史含义；译作“祖先”比字面的“父亲们”自然。
- source_word: ἐκάθισας ἐπὶ θρόνου
  choice: 坐上……宝座
  rationale: 既保留登坐宝座的具体意象，也自然传达即位掌权的语境。
- source_word: βασιλείας αὐτῶν
  choice: 他们王国
  rationale: 保留代词“他们”与前文“你祖先”的照应，不将其释义扩展为“祖先所统治的王国”。
- source_word: Ἀγαθὴ ἡμέρα
  choice: 是个好日子
  rationale: 用自然现代汉语传达前置表语所带的称许语气，不额外强化为“吉日”或宗教性祝福。
