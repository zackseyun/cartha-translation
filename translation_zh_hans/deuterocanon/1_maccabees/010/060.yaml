base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: zh_hans
  text: 他带着威仪前往多利买[a]，会见了两位王。他把金银送给他们，又把许多礼物送给他们的朋友[b]，赢得了他们的好感[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带着威仪”也可译作“带着尊荣”或“以盛大排场”；希腊语 μετὰ δόξης 指他抵达时所展现的尊荣或盛大场面。
    reason: lexical_alternative
  - marker: b
    text: “朋友”在希腊化时代的宫廷语境中，也可能特指君王的亲信或廷臣。
    reason: cultural_note
  - marker: c
    text: “赢得了他们的好感”直译为“在他们面前蒙恩”，也可译作“得到他们的恩宠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 前往
  rationale: 这是叙事中表示移动的简单过去时动词；“前往”自然、庄重，也不额外限定出行方式。
- source_word: μετὰ δόξης
  choice: 威风显赫地
  rationale: 此处指到来时公开展现出的尊荣与盛大场面；该译法避免把 δόξα 误读为专指神学意义的“荣耀”。
- source_word: Πτολεμαΐδα
  choice: 多利买
  rationale: 采用中文圣经传统中对 Ptolemais 的常见地名译法。
- source_word: ἀπήντησεν
  choice: 会见了
  rationale: 该词可指迎见或相会；外交场景中的“会见”简洁自然，同时不武断规定是谁出迎。
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: 两位王
  rationale: 直接表达原文所指的两名君王。
- source_word: ἔδωκεν
  choice: 送给
  rationale: 保留“给予”的基本意义；在金银和礼物的语境中，“送给”符合现代汉语习惯。
- source_word: ἀργύριον καὶ χρυσίον
  choice: 金银
  rationale: 中文通常以“金银”这一固定并列语序表达原文的“银和金”，意义无损且更自然。
- source_word: τοῖς φίλοις αὐτῶν
  choice: 他们的朋友
  rationale: 保留 φίλοι 的基本意义；在希腊化宫廷语境中也可能特指君王的亲信或廷臣，故加注说明而不在正文中过度限定。
- source_word: δόματα πολλά
  choice: 许多礼物
  rationale: 准确而自然地表达数量多的赠礼。
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: 赢得了他们的好感
  rationale: 以现代汉语自然表达“在他们面前蒙恩、得宠”的惯用结构，并借“因而”显明上下文中的结果关系而不增加实质内容。
