base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: zh_hans
  text: 要从他们中间选派一些人，派驻在王的大堡垒中；也要从他们中间选派一些可信任的人，负责王国的事务[a]。管理他们的人和长官都要从他们中间选任。他们要遵照自己的法律生活[b]，正如王在犹大地所命令的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事务”也可译作“需要”或“公务”。原文用词范围较广，在这里指王国的行政职责。
    reason: lexical_alternative
  - marker: b
    text: 直译为“按自己的法律行走”，意思是依照这些法律行事、生活。
    reason: idiom
lexical_decisions:
- source_word: κατασταθήσεται
  choice: 选派／选任
  rationale: 在王国军事及行政语境中，这个将来时被动形式表示任命或派任；中文依宾语分别采用“选派”和“选任”，自然表达其行政含义。
- source_word: ὀχυρώμασιν τοῖς μεγάλοις
  choice: 大堡垒
  rationale: 指王所辖的重要大型防御据点；“堡垒”保留军事含义，“大”直接对应 τοῖς μεγάλοις，不额外解释为某种特定建筑。
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: 负责王国的事务
  rationale: χρεῖαι 可指需要、事务或公务；在任命可信人员的行政语境中，“事务”最自然，同时以脚注保留“需要／公务”的词义范围。
- source_word: οὖσιν εἰς πίστιν
  choice: 可信可靠的人
  rationale: 这里描述受任者适合承担王国职务，πίστις 表示可信任、可靠，并非神学意义上的“信心”。
- source_word: οἱ ἐπʼ αὐτῶν
  choice: 管理他们的人
  rationale: 原文是关系性较强的压缩表达，指在他们之上、负责管理他们的人；此译法清楚而不具体限定其官职。
- source_word: οἱ ἄρχοντες
  choice: 长官
  rationale: 在王令的行政语境中指掌权或主管的官员；“长官”比“统治者”更符合此处组织任命的语境。
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: 按自己的法律生活
  rationale: πορεύομαι 与“法律”连用，是依照法律行事、生活的惯用表达；正文采用自然中文，脚注保留“行”的字面意象。
- source_word: ἐν γῇ Ἰούδα
  choice: 在犹大地
  rationale: 直接保留“犹大之地”的原文表达，不改成较具地域解释色彩的“犹太地区”。
theological_decisions:
- issue: 非神学行政语境中的 πίστις 相关措辞
  choice: 可信可靠
  alternative: 忠信／有信心
  rationale: εἰς πίστιν 在这里说明受任者在王国公务上值得信赖；译作“有信心”会误导为宗教信仰，“忠信”虽可行，却可能带入较强的神学语感。
translation_notes:
  register: 采用现代、庄重而易懂的王令语体。“选派”“负责”“长官”体现军事行政场景；保留“这些人”的指代，不武断消除原文可能指前述群体或驻堡垒者的轻微含混。
