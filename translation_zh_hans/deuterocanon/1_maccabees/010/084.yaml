base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: zh_hans
  text: 约拿单放火焚烧阿佐托[a]和四周的城邑，夺取了它们的战利品；又把大衮的神庙和该城的神庙[b]放火焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿佐托”是希腊文地名，对应较常见的“亚实突”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里重复“神庙”一词，直译为“大衮的神庙和该城的神庙”；本译文保留了这一不寻常的重复。
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: 放火焚烧
  rationale: 该动词表示点火烧毁或使其燃烧；两次出现均译为“放火焚烧”，既准确又保留原文的重复。
- source_word: Ἄζωτον
  choice: 阿佐托
  rationale: 按希腊文地名Ἄζωτος音译；较常见的希伯来形式“亚实突”置于脚注。
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: 四周的城邑
  rationale: κύκλῳ加属格表示环绕某地；“四周的城邑”自然地表达围绕阿佐托的各城。
- source_word: τὰ σκῦλα αὐτῶν
  choice: 他们的战利品
  rationale: σκῦλα指战争中夺得的财物；“战利品”符合现代汉语历史叙事语体，且“他们的”对应αὐτῶν。
- source_word: τὸ ἱερὸν Δαγὼν
  choice: 大衮的神庙
  rationale: ἱερόν在此指供奉大衮的神庙或圣所；“神庙”清楚表明其异教祭祀场所。
- source_word: τὸ ἱερὸν αὐτῆς
  choice: 该城的神庙
  rationale: 原文再次使用单数ἱερόν；阴性代词αὐτῆς最自然地回指阴性地名Ἄζωτος，故译为“该城的神庙”，并用脚注说明原文的突兀重复。
- source_word: ἐν πυρί
  choice: 放火
  rationale: 这是表示方式或工具的表达；与ἐνεπύρισεν合译为“放火焚烧”，符合现代汉语习惯，同时保留火烧的明确意象。
