base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: zh_hans
  text: 他派人传话给大祭司约拿单，说：“唯独你一人起来与我们作对[a]，我却因你成了讥笑和羞辱的对象[b]。你为什么在山区[c]对我们掌权呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起来与我们作对”也可译作“抬高自己与我们为敌”。希腊语动词既可表示自我抬高，也可表示起来敌对某人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我因你成了笑柄和受辱的对象”。
    reason: lexical_alternative
  - marker: c
    text: “山区”也可译作“群山中”；这里可能泛指山地，而不只是高山。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς
  choice: 派人到……那里
  rationale: 此结构表示差派人或传递信息给某人；译作“派人到……那里”符合叙事语境，又不具体断定使者身份。
- source_word: τὸν ἀρχιερέα
  choice: 大祭司
  rationale: 这是犹太礼仪和政治语境中对ἀρχιερεύς的通行、准确称谓。
- source_word: μονώτατος
  choice: 唯独你一人
  rationale: 保留最高级所强调的排他意味，同时使用自然的现代汉语。
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: 起来与我们作对
  rationale: 既表达敌对行动，也尽量保留ἐπαίρω“抬高、起来”的形象；其可能含有“自高”的意味，置于脚注说明。
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: 成了笑柄，受人辱骂
  rationale: 自然呈现两个并列结果：遭人讥笑并蒙受责骂或羞辱。
- source_word: διὰ σέ
  choice: 因你
  rationale: διά加宾格在此表原因，“因你”简洁明确。
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: 对我们掌权
  rationale: 保留ἐξουσιάζω行使权力、控制的基本含义，不把语气强化为“欺压”或“统治”。
- source_word: ἐν τοῖς ὄρεσιν
  choice: 在山区
  rationale: ὄρη可指山岭，也可泛指多山地带；“山区”在本处比仅指高山的“山上”更自然且范围适当。
