  yaml_path: translation/deuterocanon/1_maccabees/010/076.yaml
  text: And those in the city[a], being afraid, opened the gates, and Jonathan took control of Joppa.
translation:
  language: zh_hans
  text: 城里的人害怕了，就打开城门[a]；约拿单于是控制了约帕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就打开了”。希腊文没有明确说所打开的是“城门”，但上下文很可能有此含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθέντες
  choice: 害怕了
  rationale: 该词为不定过去时被动形分词，在此表示进入害怕的状态，并构成后续行动的情境或原因；现代汉语以“害怕了”自然表达。
- source_word: ἤνοιξαν
  choice: 打开城门
  rationale: 希腊文仅明说“打开”，未写明宾语；但在城池与军队的语境中，所开之物很可能是城门。正文补出隐含宾语以求清楚，并用脚注保留原文的省略。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 字面为“从城里的那些人”，在此指当时身处城中的人；译作“城里的人”比“从城里的人”更符合现代汉语，也不限定性别或具体群体。
- source_word: ἐκυρίευσεν
  choice: 控制了
  rationale: κυριεύω表示取得支配权或控制权；“控制了”符合军事政治语境，又避免把含义过度缩窄为攻城意义上的“攻占”。
- source_word: Ἰόππης
  choice: 约帕
  rationale: 采用该古代港城在简体中文圣经传统中通行的译名“约帕”。
- source_word: Ἰωναθὰν
  choice: 约拿单
  rationale: 采用人名Ἰωναθάν在简体中文圣经传统中通行的译名“约拿单”。
