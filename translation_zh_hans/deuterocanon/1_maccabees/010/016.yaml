  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: zh_hans
  text: 他说：“难道我们会找到一个这样的人吗？如今，让我们使他成为我们的朋友[a]和盟友。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”在希腊化时代的宫廷政治用语中，也可能指一种受正式认可的政治身份，并不只是私人交情。
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: 难道我们还能找到……吗
  rationale: μή与将来时直陈语气构成预期否定回答的反问；“难道……还能……吗”以自然现代汉语保留“恐怕找不到”的语用力量，而不直接改写为陈述句。
- source_word: ἄνδρα τοιοῦτον ἕνα
  choice: 一个像这样的人
  rationale: 保留ἄνδρα的单数人物所指、τοιοῦτον的类别或品质指示，以及ἕνα对“一个”的强调；在此具体语境中“人”自然指这名男子，无须生硬译成“男人”。
- source_word: καὶ νῦν
  choice: 现在
  rationale: 表示由判断转入当前行动；汉语中省去机械的“而且/于是”更自然，同时保留νῦν的时间与决策推进作用。
- source_word: ποιήσωμεν αὐτὸν
  choice: 让我们使他成为
  rationale: 准确表达第一人称复数劝勉式及“使……成为”的宾补结构，不把政治行动过度限定为“任命”。
- source_word: φίλον
  choice: 朋友
  rationale: 保留与随后“盟友”不同的词义；在希腊化宫廷语境中也可能具有正式政治身份的含义，故加注说明。
- source_word: σύμμαχον
  choice: 盟友
  rationale: 清楚表达政治或军事联盟中的伙伴，与φίλον形成原文的并列组合。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 自然表达属格的所属关系，并同时修饰“朋友”和“盟友”。
