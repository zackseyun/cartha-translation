  text: And King Demetrius heard, and he gathered very many forces, and went out to meet him in battle.
translation:
  language: zh_hans
  text: 德米特里王听见了，就召集了极多的军队，出去迎战他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 直译ἀκούω的不定过去时，并保留原文没有明说所听内容的简略表达；在上下文中自然表示听到消息。
- source_word: συνήγαγεν
  choice: 召集了
  rationale: 表达“聚集、集合”的基本意义，同时适合军队语境，又不具体限定征召或点兵等程序。
- source_word: δυνάμεις
  choice: 军队
  rationale: 该词在这里指军事力量。现代汉语用“军队”最自然；虽然希腊文为复数，汉语集合名词无需机械标出复数。
- source_word: πολλὰς σφόδρα
  choice: 极多的
  rationale: 同时体现πολλάς的数量与σφόδρα的强烈程度，措辞简洁而庄重。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 保留“出去、出发”的基本含义，不额外加入“率军进发”等原文未明说的细节。
- source_word: εἰς συνάντησιν αὐτῷ εἰς πόλεμον
  choice: 迎战他
  rationale: 将“出去与他相遇，为要交战”凝练为自然的现代汉语军事表达；敌对目的由εἰς πόλεμον明确，因此“迎战”并未超出原意。
