  text: 亚历山大派使者到埃及王托勒密那里，传达以下的话：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 不定过去时叙述一次已发生的差遣行动；“派”符合现代汉语叙事习惯，并与宾语“使者”自然搭配。
- source_word: πρὸς Πτολεμαῖον βασιλέα Αἰγύπτου
  choice: 到埃及王托勒密那里
  rationale: πρός在差遣语境中表示使者前往的对象；将同位结构自然译作“埃及王托勒密”，并以“到……那里”清楚表达方向和受命对象。
- source_word: πρέσβεις
  choice: 使者
  rationale: 指奉派执行正式外交使命的代表。“使者”既保留古代王室外交语境，也比现代制度色彩较强的“大使”更合适。
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照以下的话
  rationale: 该短语引出随后所载的信息内容；因具体话语出现在下一节，“以下”在现代汉语中比“这些”更清楚。
- source_word: λέγων
  choice: 说
  rationale: 现在分词用于引出接下来的直接引语；译为“说”使句子自然承接下一节，同时不增加原文没有的解释。
