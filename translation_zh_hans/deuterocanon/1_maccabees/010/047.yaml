  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
translation:
  language: zh_hans
  text: 他们赞许亚历山大[a]，因为他成了为他们发起和平提议的人；他们始终与他并肩作战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他们发起和平提议的人”也可译作“带头说和平话语的人”或“和平建议的发起人”。希腊语的表达较为凝练，指亚历山大在和平或和解的提议中居于发起、带头的地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: 赞许亚历山大
  rationale: εὐδοκέω配合ἐν表示对某人满意、认可或怀有好感。“赞许”自然地表达正面认可，又不把它强化为正式批准。
- source_word: ἐγένετο
  choice: 为他们……了
  rationale: 此处表示亚历山大成为或充当某种角色；汉语借助“为他们率先提出了”自然表达这一已发生的情形，无须生硬直译“成为”。
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  choice: 率先提出了和平的条件
  rationale: ἀρχηγός可指发起者或带头者，λόγοι εἰρηνικοί字面为“和平的话语”，在外交语境中很可能指和谈提议或条件。正文采用自然的外交表达，同时以脚注保留原文压缩结构的其他理解。
- source_word: συνεμάχουν αὐτῷ
  choice: 与他并肩作战
  rationale: συμμαχέω明确指作为盟友共同作战；“并肩作战”保留其军事含义。
- source_word: πάσας τὰς ἡμέρας
  choice: 一直
  rationale: 该短语字面为“所有的日子”，在此表达持续不断或此后始终如此；现代汉语以“一直”最为自然。
