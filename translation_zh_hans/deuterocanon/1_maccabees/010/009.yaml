  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
translation:
  language: zh_hans
  text: 卫城[a]中的人把人质交给约拿单；他把他们送还给他们的父母。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“卫城”指耶路撒冷的一座设防堡垒，传统上称为“阿克拉堡”。
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: 交给
  rationale: 该动词表示移交、交付；“交给”在现代汉语叙事中自然准确，不额外加入法律或敌对意味。
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: 城堡里的人
  rationale: ἄκρα在此历史语境中指耶路撒冷的设防堡垒；希腊语字面为“来自城堡的人”，但上下文表达的是城堡中的人员，以“城堡里的人”更符合自然汉语，也不擅自限定性别。
- source_word: Ἰωναθὰν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中这一人名的通行译法。
- source_word: τὰ ὅμηρα
  choice: 人质
  rationale: ὅμηρα通常指人质；后句以复数代词指这些人，并说他们被送还父母，证实这里不是抽象的抵押物。
- source_word: ἀπέδωκαν
  choice: 送还
  rationale: 该动词表示把原先扣留或取得的人交还；“送还”既体现归还，也适合人作为宾语的语境。
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: 给他们的父母
  rationale: γονεῦσιν明确指父母；不扩大为“家人”或“家族”。
