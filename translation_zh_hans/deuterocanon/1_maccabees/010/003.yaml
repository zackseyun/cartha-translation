lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 送去
  rationale: 准确表达不定过去时所述的发送行动，并切合书信语境。
- source_word: ἐπιστολὰς
  choice: 几封信
  rationale: 希腊文为复数；“几封信”在现代汉语中自然地保留复数含义，但不限定具体数量。
- source_word: λόγοις εἰρηνικοῖς
  choice: 信中措辞友好
  rationale: 该与格短语说明书信言辞的性质；此译法自然传达其和平、和善的语气，同时脚注保留较直译的表达。
- source_word: ὥστε
  choice: 为要
  rationale: 结合语境，表示德米特里的意图或目的；“为要”简洁而庄重。
- source_word: μεγαλῦναι
  choice: 抬高他的地位
  rationale: 字面义为“使他为大”；在政治语境中指提升约拿单的身份、声望或待遇。“抬高他的地位”比单译“尊荣”更清楚地保留使役含义。
- source_word: Ἰωναθὰν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Δημήτριος
  choice: 德米特里
  rationale: 采用中文次经译名中自然、常见的音译形式。
