  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: zh_hans
  text: 德米特里任命了负责科埃勒叙利亚的阿波罗尼乌斯；他聚集了一大批军队[a]，在雅姆尼亚安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一支庞大的军队”。希腊语δύναμις可泛指军事力量或部队，不一定专指编制明确的军队。
    reason: 保留δύναμις在“军力、部队、军队”之间的词义宽度。
lexical_decisions:
- source_word: κατέστησεν
  choice: 任命了
  rationale: 此处指德米特里把阿波罗尼奥置于职任之中；“任命”自然地表达正式委任的行政含义。
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: 管辖科埃勒叙利亚的
  rationale: ἐπί在这里表示治理或权责关系；“管辖”既符合现代汉语，也不额外规定其具体官衔。地名采用音译，以免把古代区域名称解释性地改写。
- source_word: συνήγαγεν
  choice: 召集了
  rationale: 该动词意为把人聚集起来；在军事语境中，“召集”自然，并保留原文未明确说明征募方式的宽泛性。
- source_word: δύναμιν μεγάλην
  choice: 一支大军
  rationale: δύναμις在军事叙事中可指武装力量；“大军”是简洁自然的汉语表达，但其范围也可理解为规模庞大的军力或部队，故加注说明。
- source_word: παρενέβαλεν
  choice: 驻扎
  rationale: 该词是军事语境中安营、扎营的常用动词；“驻扎”在现代汉语叙事中庄重自然，同时传达军队设营停驻之意。
- source_word: ἐν Ἰαμνείᾳ
  choice: 在雅姆尼亚
  rationale: ἐν表示地点；“在雅姆尼亚”贴近希腊文，也符合现代汉语。
