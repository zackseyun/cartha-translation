base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: zh_hans
  text: 至于从撒玛利亚地区划归犹太地的三个行政区[a]，应把它们并入犹太地，使其被视为一体[b]，并且除大祭司的权柄外，不得服从任何其他权柄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行政区”也可按希腊化时代的行政术语音译为“诺姆”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“成为在一个之下”；此处指作为一个行政整体被看待。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: 行政区
  rationale: 此处 νόμος 是希腊化时代的行政地理术语，指辖区而非“律法”；“行政区”能清楚传达其制度背景。
- source_word: προστεθέντας / προστεθήτω
  choice: 划归／并入
  rationale: 前者描述三个区域此前已从撒玛利亚划归犹太，后者是命令其正式并入；分别译出可保留分词与命令式的差别。
- source_word: χώρας Σαμαρίας
  choice: 撒玛利亚地区
  rationale: χώρα 在这里指撒玛利亚的地域范围；“地区”自然且符合行政语境。
- source_word: πρὸς τὸ λογισθῆναι
  choice: 使它们被视为
  rationale: 保留目的结构，也体现 λογίζομαι 在行政文书中“算作、认定为”的含义。
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: 一体
  rationale: 原文凝缩，直译近于“归于一个之下”；结合上下文，指形成单一的行政或管辖整体，但不在正文中补定其具体制度形式。
- source_word: ὑπακοῦσαι
  choice: 服从
  rationale: 准确表达 obey/be subject to 的含义，也适合法令中的管辖语境。
- source_word: ἄλλης ἐξουσίας
  choice: 任何别的权柄
  rationale: ἐξουσία 可指权力、权威或管辖权；“权柄”保留其宽度，并与大祭司的管辖角色相呼应。
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: 除大祭司的权柄外
  rationale: 属格承接前面的 ἐξουσία；明确例外所指的是大祭司的权柄，而不是另加超出原文的神学解释。
theological_decisions:
- issue: 法令中大祭司权柄的性质
  choice: 按行政与政治管辖来表达，同时保留“权柄”一词的宽泛性。
  alternative: 译成全面的宗教和民事臣服，或明确限定为纯粹行政管辖。
  rationale: 上下文涉及领土合并和服从权柄；原文没有详细界定大祭司权力的范围，因此既不扩大，也不人为缩窄。
translation_notes:
  register: 采用现代、庄重而清楚的法令语体。“至于……要……”使长句在普通话中更自然；两个目的分句分别以“使……”和“不再……”呈现，避免生硬重复，同时保留其逻辑关系。
