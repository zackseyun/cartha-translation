  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: zh_hans
  text: 众人照约拿单所吩咐的，站在原地；他们的马[a]疲乏了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文只说“他们的马”。按上下文，这很可能是指敌军骑兵的马；约拿单的人则照命令留在原地时，它们疲乏了。
    reason: 保留代词所指的原文歧义，并说明语境中较可能的理解。
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: 众人
  rationale: λαός在此指约拿单所率领的众人；δέ承接上文并带轻微转折，但现代汉语在此不必硬译连接词。
- source_word: ἱστήκει
  choice: 站在原地
  rationale: 该形式表达持续站立、守住位置的状态；译作“站在原地”比单说“站着”更自然地传达奉命保持阵位的语境，同时没有扩展为过强的军事术语。
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: 照约拿单所吩咐的
  rationale: ἐπιτάσσω意为命令、吩咐；“照……所吩咐的”符合现代叙事语体，也保留行动依照先前命令而行的关系。
- source_word: ἐκοπίασαν
  choice: 都疲乏了
  rationale: κοπιάω在此表示因劳顿而变得疲倦；“疲乏了”保留结果意义，又不像“筋疲力尽”那样夸大程度。
- source_word: οἱ ἵπποι αὐτῶν
  choice: 他们的马
  rationale: 希腊文只是使用第三人称复数所有格，所指对象在语法表面上含混；正文直译为“他们的马”，不擅自明确为敌军的马。
