lexical_decisions:
- source_word: ἀπέλειπεν
  choice: 留下了
  rationale: 直译其基本意义，说明亚波罗尼把这支部队留在后方。
- source_word: χιλίαν ἵππον
  choice: 一千名骑兵
  rationale: ἵππον 在军事语境中是集合用法，指骑兵而非一千匹马。
- source_word: κρυπτῶς κατόπισθεν αὐτῶν
  choice: 暗中埋伏在他们后方
  rationale: κρυπτῶς 表示隐蔽、秘密地；结合骑兵部署的军事语境，以“暗中埋伏”自然表达其隐蔽安置，同时保留 κατόπισθεν 的方位意义。
