  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
translation:
  language: zh_hans
  text: 他授予他权力，使他可以召集军队、制造武器，并作他的盟友；他又吩咐把堡垒[a]里的人质交给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿克拉”，即耶路撒冷的坚固堡垒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ἐξουσίαν
  choice: 他授权给他
  rationale: ἐξουσία在此指政治与军事上的正式授权，而非个人固有的能力；“授权”简洁地表达授予权限之意。
- source_word: συναγαγεῖν δυνάμεις
  choice: 召集军队
  rationale: δυνάμεις在上下文中指军事力量；“召集军队”比抽象的“聚集力量”更准确自然。
- source_word: κατασκευάζειν ὅπλα
  choice: 制造武器
  rationale: κατασκευάζειν可指制备、置办或制造；与ὅπλα连用时，“制造武器”清楚表达军备生产的意思，同时不作过度引申。
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: 并成为他的盟友
  rationale: σύμμαχος意为盟友。保留希腊文代词表达，不擅自补入人名或消除原句中代词所可能产生的指代张力。
- source_word: τὰ ὅμηρα
  choice: 人质
  rationale: ὅμηρα指作为担保而扣留的人，历史语境中译作“人质”最直接准确。
- source_word: ἡ ἄκρα
  choice: 堡垒
  rationale: ἄκρα可指高处的坚固堡垒，并在《马加比一书》中常特指耶路撒冷的阿克拉；正文采用普通读者易懂的“堡垒”，专名可能性在脚注中保留。
- source_word: εἶπεν παραδοῦναι
  choice: 吩咐……交给
  rationale: εἶπεν加不定式在此具有命令或指示意味；“吩咐……交给”以自然汉语表达其指令语气。
