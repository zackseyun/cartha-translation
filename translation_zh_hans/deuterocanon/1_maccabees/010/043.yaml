  source_fidelity: 译文对逃往圣所、王室应收款与其他义务、以及君王统治境内的财物等要素把握基本准确。但“圣所和其四境之内”在中文中把并列目的地和处所结构混合，句法不顺；并且“连同……一切所有，获得豁免”会使财物也成为“豁免”的对象，未能恰当反映原文以省略动词并列“人”与“其所有物”的结构。
  naturalness: “四境”略显文言且“圣所和其四境之内”不合现代汉语搭配。改为“圣所及其全境”并以分句处理后半句，保持庄重诏令体而更清楚自然。
  terminology: “圣所”“王室款项”“其他义务”均可保留。“获释”比“获得豁免”更贴近ἀπολελύσθωσαν的“被释放／解除”，并可通过脚注说明其可能涵盖免除税赋、债务及法律追索。
