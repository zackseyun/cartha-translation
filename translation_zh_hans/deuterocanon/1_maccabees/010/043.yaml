  rationale: 修订消除“圣所和其四境之内”的中文句法问题，并把原文后半句所省略的动词以适合中文的独立分句呈现。对于财物的法律效果，正文以“解除扣押或追索”表达其随人一并获得释放的实际含义，脚注明确说明这是为补足中文而作的非限定性表达，保留原文的法律技术细节与地域范围的歧义。
