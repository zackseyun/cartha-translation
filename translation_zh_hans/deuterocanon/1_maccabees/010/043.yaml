base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: zh_hans
  text: 凡逃往耶路撒冷的圣所及其全境避难的人，无论欠有王室款项，还是负有任何其他义务，都当获释；他们在我国境内的一切所有，也当一并解除扣押或追索。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡逃到耶路撒冷圣殿及其全境寻求庇护的人。”原文用词既可较广地指圣殿范围，也可指与之相关的地域；“其全境”究竟指圣所的相关地域还是耶路撒冷的周边地域，原文并不完全明确。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“欠王室之物和任何事项的，都当获释，以及他们在我国境内的一切所有。”这句话可能包括税赋、债务或其他法律上的追索；后半句省略了重复的动词。“解除扣押或追索”是为使中文完整而作的表达，并非限定原文所指的法律措施。
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: 逃到
  rationale: 保留φέυγω所表达的逃离、奔往之意；目的地是圣所，也自然带出寻求庇护的语境，而不把该含义直接写死。
- source_word: ἱερὸν
  choice: 圣所
  rationale: ἱερόν可指圣殿整体及其神圣范围；“圣所”既符合庇护语境，也不局限于圣殿建筑本身。
- source_word: ὁρίοις
  choice: 四境
  rationale: ὅρια可指边界或所属地域。“四境”用语庄重而可懂，并保留究竟指圣所辖境还是耶路撒冷周边地域的含混性。
- source_word: βασιλικὰ
  choice: 王室款项
  rationale: 此处指应向王权缴纳之物。“王室款项”涵盖税赋及其他王室应收款，比单译“税款”稍宽。
- source_word: πᾶν πρᾶγμα
  choice: 任何其他义务
  rationale: 字面近于“任何事项”，受ὀφείλων支配时表示所负的财务或法律责任；“义务”避免将范围缩窄为纯粹债务。
- source_word: ἀπολελύσθωσαν
  choice: 获得豁免
  rationale: 完成时被动命令式表达正式解除约束或追索；在王令语境中，“获得豁免”自然地涵盖免除相关责任。
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: 他们……的一切所有
  rationale: 保留原文宽泛表达，不直接限缩为某一类财产；中文中可自然理解为其所有之物。
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: 在我国境内
  rationale: 表达君王统治领域；“我国境内”符合诏令口吻，也比“我的王国里”更自然。
theological_decisions:
- issue: 与耶路撒冷圣所相关的庇护及豁免范围
  choice: 将王令理解为：逃入圣所及其相关地域者，其王室欠款和其他义务连同其境内所有均获豁免。
  alternative: 也可把πᾶν πρᾶγμα笼统理解为“任何事项”，或把“其四境”专指耶路撒冷全境而非圣所辖境。
  rationale: ὀφείλων同时支配βασιλικὰ与πᾶν πρᾶγμα，语境最自然地指欠缴款项及其他可追索责任；但ὅρια的所指并不完全明确，因此正文不具体限定为圣殿院落、辖区或城市行政区。
translation_notes:
  register: 采用现代、庄重的王令语体。“无论……还是……”使ὀφείλων统摄两个宾语的关系清楚；“连同……获得豁免”对应原文后半句省略动词的并列结构，同时避免擅自具体化为归还、没收或撤销某一种法律措施。
