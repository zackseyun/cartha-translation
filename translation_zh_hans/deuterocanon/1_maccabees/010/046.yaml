base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: zh_hans
  text: 约拿单和百姓听见这些话[a]，却不相信，也不接受，因为他们想起那人在以色列中所行的大恶[b]，以及他怎样严厉地压迫他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不相信，也不接受”也可译作“不信任，也不接纳”。希腊文分别表达不相信这些话和不肯接纳这些话或提议。
    reason: lexical_alternative
  - marker: b
    text: “在以色列中所行的大恶”也可理解为“加害以色列的大恶”。希腊文直译为“在以色列中”，既可指恶行发生在以色列境内或民中，也可能含有针对以色列的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν
  choice: 不相信
  rationale: 在本叙事语境中，指他们不认为这些话真实可信；“不相信”自然地承接“这些话”。
- source_word: οὐδὲ ἐπεδέξαντο
  choice: 也不接受
  rationale: 此词不只表示听见，还表示接纳所传的话或提议；“接受”保留了它与“不相信”之间的区别。
- source_word: ἐμνήσθησαν
  choice: 想起
  rationale: 表示他们回想起先前发生的事，并点明拒绝这些话的原因。
- source_word: τῆς κακίας τῆς μεγάλης
  choice: 大恶
  rationale: 保留原文对严重恶行的概括性和道德分量，不把含义缩窄为单纯的伤害。
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: 那人在以色列中所行的大恶
  rationale: 按原文保留ἐν的“在……中”之意；“那人”自然体现希腊文单数主语，同时避免中文孤立的“他”指代不清。
- source_word: ἔθλιψεν
  choice: 压迫
  rationale: 在政治军事叙事中，该词表示使人遭受重大困苦或逼迫；“压迫”能体现持续而严重的侵害。
- source_word: σφόδρα
  choice: 残酷地
  rationale: 与“压迫”搭配自然，传达强烈程度；脚注说明更贴近形式的译法为“严厉地／极重地”。
theological_decisions:
- issue: 先前施行恶事并压迫百姓者的指称
  choice: 用单数“那人／他”
  alternative: 依据较广的政治背景理解为群体性的“他们”
  rationale: 希腊文ἐποίησεν和ἔθλιψεν均为第三人称单数，因此保留单数指称，不将历史背景中的群体行动引入正文。
- issue: ἐν Ἰσραήλ所表达的关系
  choice: 译作“在以色列中”
  alternative: 译作“加害以色列”或“对以色列所行”
  rationale: 原文直译为“在以色列中”，既可能指恶行发生在以色列境内或民中，也可能语用上暗含针对以色列；正文保留空间或群体内部的表达，另一理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“约拿单和百姓”紧贴原文；以“却”呈现上下文中的转折。保留“不相信／不接受”两个并列动作及“在以色列中”的歧义，不作宗派性阐释。
