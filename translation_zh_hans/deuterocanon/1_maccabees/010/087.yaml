  text: And Jonathan returned with those who were with him[a], carrying much plunder.
translation:
  language: zh_hans
  text: 约拿单和同他在一起的人回去了，带着许多战利品[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掳物”。希腊词指战斗中夺取的财物。
    reason: 词汇存在可行的替代译法；注释说明该词在本节战争语境中的含义。
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回去了
  rationale: 该简单过去时动词表示从战场返回；“回去了”符合现代汉语叙事表达，也不额外指明返回的具体地点。
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: 和跟随他的人
  rationale: 原短语直指与约拿单同在的一群人；此译自然明白，同时避免用“部下”或“士兵”增添原文未明说的身份。
- source_word: ἔχοντες
  choice: 带着
  rationale: 该分词说明他们返回时的伴随状态；“带着”适合后接具体的战利品，又不刻意强化“带回来”的方向意味。
- source_word: σκῦλα
  choice: 战利品
  rationale: 该词指战斗中夺得的财物；“战利品”在现代汉语中清楚、庄重，并保留战争语境。
- source_word: πολλά
  choice: 许多
  rationale: 保留原文对数量之多的强调，与集合意义的“战利品”搭配自然。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“和跟随他的人”保持原文措辞的概括性；逗号后的“带着”自然呈现希腊语分词所表达的伴随动作。脚注标记置于其实际解释的“战利品”之后。
