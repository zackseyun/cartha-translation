base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/056.yaml
  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: zh_hans
  text: 现在，我会照你信中所写的为你办理。不过，你要到多利买来与我会面，好让我们彼此相见；我也会照你所说的，与你结成姻亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与你缔结婚姻联盟。”希腊文动词指借婚姻建立亲属关系；上下文表明这里所指的是王室联姻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω
  choice: 我会……办理
  rationale: 表示落实对方信中所写之事；“办理”在现代汉语中自然，又不把具体行动说得过细。
- source_word: ἃ ἔγραψας
  choice: 照你信中所写的
  rationale: 既保留关系从句的内容，也借“信中”清楚表达书面往来的语境。
- source_word: ἀπάντησον
  choice: 来与我会面
  rationale: 该命令式要求对方前来相会；这样译兼顾趋向和实际会面的含义。
- source_word: εἰς Πτολεμαΐδα
  choice: 到多利买
  rationale: εἰς 表示朝向目的地；“到多利买来”符合现代汉语表达。
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: 好让我们彼此相见
  rationale: 保留原文“彼此看见”的表述，同时在汉语中自然地表达双方相见。
- source_word: ἐπιγαμβρεύσω
  choice: 与你结成姻亲
  rationale: 该动词指借婚姻建立亲属关系；此译保留姻亲含义，却不把本节未明说的具体婚配对象加入正文。
- source_word: καθὼς εἴρηκας
  choice: 照你所说的
  rationale: 自然表达对方先前提出的安排，并保留原文的回指。
