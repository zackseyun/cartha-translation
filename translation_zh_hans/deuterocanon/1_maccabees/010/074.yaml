base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: zh_hans
  text: 约拿单听见亚波罗尼乌斯的这些话，心里激动起来[a]，便选了万人，离开耶路撒冷。他的兄弟西门前来与他会合，帮助他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心里受到触动”“心里被激起”。希腊文表示内心受到搅动或激发，但没有明确指出究竟是哪一种情绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: 听见……，……便
  rationale: ὡς与不定过去时构成时间从句，δέ为轻微承接或转折。汉语以“听见……便……”自然表达叙事中的先后关系，不必生硬增译“但是”。
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: 亚波罗纽的这些话
  rationale: λόγοι指上文亚波罗纽所说的话或挑战；“这些话”既贴近原文复数，也自然承接语境。人名按希腊语Ἀπολλώνιος音译为“亚波罗纽”。
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: 心里激动起来
  rationale: κινέω的被动式配合τῇ διανοίᾳ表示内心受到触动或搅动；“激动起来”保留内在反应的强度，又不限定为愤怒、忧虑或受激励。
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: 选了万人
  rationale: ἐπέλεξεν意为挑选；δέκα χιλιάδας ἀνδρῶν直指一万人。军事语境已清楚，因此不额外加入原文没有的“士兵”。
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: 从耶路撒冷出去
  rationale: 保留ἐξῆλθεν与ἐξ的基本移动含义，不增添“出征”或“开拔”等军事色彩。
- source_word: συνήντησεν αὐτῷ
  choice: 前来与他会合
  rationale: συναντάω基本义为相遇、前来会面；结合西门带着援助而来的语境，“前来与他会合”比单说“遇见他”更符合自然汉语，同时没有把动作过度解释为长期加入。
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: 帮助他
  rationale: 该短语说明西门会合的目的，即提供援助；现代汉语用“帮助他”简洁准确。
