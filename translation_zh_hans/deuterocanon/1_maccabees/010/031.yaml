base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/031.yaml
  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
translation:
  language: zh_hans
  text: “耶路撒冷要成为圣地，并获豁免[a]；其辖境[b]、十分之一税和各项税赋[c]也在此列。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获豁免”所译的希腊词可指“被释放、被免除”。在本段王令连续论及贡赋和税项的语境中，此处不是“奉献”或“分别出来”的意思。
    reason: lexical_alternative
  - marker: b
    text: “辖境”也可译作“边界”或“地域”。希腊语既可指边界线，也可指附属于耶路撒冷的地域。
    reason: lexical_alternative
  - marker: c
    text: “十分之一税”也可译作“十分之一应纳额”；“各项税赋”也可译作“税款”“通行税”或“关税”。末段为简略并列，其具体法律效果可理解为这些项目也包括在所宣告的地位或豁免范围内。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤτω
  choice: 要……
  rationale: 这是εἰμί的第三人称命令式；在王令语境中用“要”自然表达谕令性质。
- source_word: ἁγία
  choice: 归为圣
  rationale: 保留ἅγιος的宗教和礼仪含义，也与后面的“分别出来”构成两个相关但不完全相同的表述。
- source_word: ἀφιεμένη
  choice: 分别出来
  rationale: 表达被划出、专作特定用途的被动状态；也可能理解为“奉献出来”。
- source_word: τὰ ὅρια αὐτῆς
  choice: 其境内
  rationale: ὅρια既可指边界，也可指边界以内、隶属于耶路撒冷的地域；财政行政语境较支持地域义，同时以脚注保留歧义。
- source_word: αἱ δεκάται
  choice: 其十分之一的供物
  rationale: δεκάται指按十分之一征收或奉献的份额；“十分之一的供物”比单用教会化术语更便于现代普通读者理解。
- source_word: τὰ τέλη
  choice: 税赋
  rationale: τέλη是税款、关税、通行税等财政征收项目的宽泛称呼；“税赋”能自然涵盖这些意义。
theological_decisions:
- issue: “圣”（ἁγία）与“分别出来”（ἀφιεμένη）的关系
  choice: 两个词分别译作“归为圣，分别出来”
  alternative: 合并译作“分别为圣”或把后者译作“奉献出来”
  rationale: 原文并列两个描述，分别翻译可保留圣洁身份与划归专用之间的张力，不把二者压缩成单一概念。
- issue: τὰ ὅρια αὐτῆς所指范围
  choice: 译作“其境内”
  alternative: “其边界”或“其辖境”
  rationale: 本句涉及十分之一的供物和税赋，行政财政语境较可能指附属于耶路撒冷的地域；但原词也可单指边界，故在脚注中说明。
- issue: 末尾两项与命令式的句法关系
  choice: 补出“也要如此”
  alternative: 把“十分之一的供物和税赋”视为省略谓语的名词性附加语
  rationale: 希腊文在καὶ τὰ ὅρια αὐτῆς之后以同位式列出两项，句法极为简略；中文补出“也要如此”使句子通顺，同时不具体断定它们究竟被宣告为圣、划归专用，还是享有相应豁免。
translation_notes:
  register: 采用现代、庄重而易懂的王令语体。原文后半句句法省略且存在歧义，因此以“也要如此”承接，不擅自明确为免税或献纳；脚注标记均置于正文。
