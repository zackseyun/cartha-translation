  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
translation:
  language: zh_hans
  text: 亚历山大王听见这些话后，就越发尊重约拿单。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“继续尊重约拿单。”希腊原文可表示继续给予尊荣，也可表示给予他更多尊荣。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: ……后，就……
  rationale: 这是叙事过渡套语。逐字译作“事情发生了，当……”在现代汉语中生硬；用“……后，就……”自然承接上下文，同时保留事件随即发展的语气。
- source_word: ἤκουσεν
  choice: 听见
  rationale: ἀκούω在此指听到先前所述的话或消息；“听见”直接对应原文，避免用“得知”增加解释。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: λόγοι在这里可指话语、陈述或消息；“这些话”最贴近原文，也能自然回指上文。
- source_word: προσέθετο δοξάσαι
  choice: 越发尊重
  rationale: προστίθημι加不定式含增添、继续或进一步做某事之意；结合δοξάζω在君王政治语境中的“给予尊荣”，译为“越发尊重”自然表达所加增的尊荣，同时以脚注保留“继续尊重”的可能。
- source_word: τὸν Ἰωναθάν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中Jonathan的通行译名；希腊语冠词不单独译出。
