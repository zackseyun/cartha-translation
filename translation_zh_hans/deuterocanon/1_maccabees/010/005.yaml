  yaml_path: translation/deuterocanon/1_maccabees/010/005.yaml
  text: For he will remember all the wrongs that we committed against him, and against his brothers, and against his nation.
translation:
  language: zh_hans
  text: 因为他必记得我们对他、对他的弟兄和对他的民族所做的一切恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθήσεται
  choice: 必记得
  rationale: 该将来时在语境中表达说话者确信此人不会忘记以往所受的伤害；“必记得”自然传达这一预期，又不额外明说报复。
- source_word: πάντων τῶν κακῶν
  choice: 一切恶事
  rationale: κακά的范围较广，可指恶行、伤害或错事；“恶事”较贴近希腊文，也保留其道德分量。
- source_word: συνετελέσαμεν πρὸς
  choice: 我们对……所做的
  rationale: 此处合成动词与πρός表示针对某人实施、做成的恶事；按现代汉语重组为“对……所做的”。
- source_word: ἀδελφοὺς
  choice: 弟兄
  rationale: 保留原文亲属或同族关联均可能存在的表达，不擅自限定为亲兄弟或同胞。
- source_word: ἔθνος
  choice: 民族
  rationale: 在此指他所属的民族群体；“民族”比“国家”更符合当时语境。
