base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: zh_hans
  text: “现在，我们今日立你为你民族的大祭司，并称你为‘王的朋友’[a]——他们送给他一件紫袍和一顶金冠[b]——也要你支持我们这一方[c]，与我们保持友好关系。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的朋友”也可译作“国王的朋友”；在希腊化时代，这可能是正式的宫廷称号。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在这里从王以“我们”说话，转为叙述者所说的“他们送给他”；译文保留了这一人称转换。
    reason: textual_variant
  - marker: c
    text: 原文直译近于“思想我们的事”，意思是倾向、支持或维护某一方的利益。尽管前面插入“他们送给他”的第三人称叙述，原文此处仍用“我们”，并延续对“你”的要求；译文保留这一人称张力。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: 立你为
  rationale: 该完成时在正式任职语境中表示委任、确立职位；“立……为”庄重自然，也符合王室文书语气。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是犹太宗教职分在现代汉语中的通行译名。
- source_word: τοῦ ἔθνους σου
  choice: 你本国的
  rationale: ἔθνος在此指具有民族与政治共同体意义的国民整体；“本国”比单纯的“人民”更能保留该层含义。
- source_word: φίλον βασιλέως
  choice: 王的朋友
  rationale: 直译并保留其可能具有的希腊化宫廷荣衔意味；加引号提示这不一定只是私人友谊。
- source_word: καλεῖσθαι
  choice: 称为
  rationale: 直接表达获得称号之意，并与前面的正式委任相衔接。
- source_word: πορφύραν
  choice: 一件紫袍
  rationale: 该词可指紫色衣料或紫色服装；在授予身份标志的语境中译作“紫袍”自然明确。
- source_word: στέφανον χρυσοῦν
  choice: 一顶金冠
  rationale: στέφανος可指花冠、冠冕；此处与紫袍同为授职礼物，“金冠”最切合语境。
- source_word: ἀπέστειλαν αὐτῷ
  choice: 他们又送给他
  rationale: 保留传世希腊文本由第一人称复数转为第三人称复数的突变，不擅自协调为“我们送给你”。
- source_word: φρονεῖν τὰ ἡμῶν
  choice: 支持他们这一方
  rationale: 字面为“思想我们的事”，实际是政治用语，表示倾向并维护一方利益。因主句叙述视角已转为第三人称，汉语相应采用“他们”。
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: 与他们保持友好关系
  rationale: 表达持续维系外交或政治友好；“友好关系”较单纯私人性的“友谊”更符合上下文。
theological_decisions:
- issue: φίλον βασιλέως是否为正式宫廷称号
  choice: 译作带引号的“王的朋友”
  alternative: 译作“王友”或普通的“国王的朋友”
  rationale: 原文既可按一般关系理解，也很可能指希腊化宫廷荣衔。带引号的直译兼顾可懂性与称号意味，不把可能性绝对化。
- issue: 引文内部从第一人称转为第三人称
  choice: 在正文中保留为“他们又送给他”
  alternative: 协调为“我们又送给你”
  rationale: 所给希腊文本明确为第三人称复数，且没有校勘资料支持改写；译文保留其文本张力，并用脚注说明。
- issue: 末尾两个不定式的主语与话语层次
  choice: 按叙事层处理为“并要他……他们……”
  alternative: 沿用王的直接话语译为“并要你支持我们……与我们……”
  rationale: 希腊文在ἀπέστειλαν αὐτῷ处发生人称转移，后面的不定式在句法上略显参差。译文顺着第三人称叙述使汉语可读，同时以脚注保留原文结构及另一理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。王室任命部分保留正式语气；以引号标示诏书中的直接话语，并在希腊文转为第三人称处结束引语，以自然呈现原文的人称变化。所有脚注标记均置于相关正文位置。
