base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: zh_hans
  text: 于是，遇见他的人看见他的威仪，正如所宣告的，又看见他身穿亚麻衣[a]，就全都逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文可指“身披亚麻布”或“穿着亚麻布衣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 于是
  rationale: 以自然的现代汉语叙事衔接表达希腊语的事件推进和时间关系，避免生硬直译为“事情发生了，当……”。
- source_word: οἱ ἐντυγχάνοντες
  choice: 遇见他的人
  rationale: 该分词指与他相遇、碰见他的人；宾语“他”由上下文补出。
- source_word: τὴν δόξαν αὐτοῦ
  choice: 他的威仪
  rationale: 此处语境是君王公开显出的尊荣与气派；“威仪”兼具可见的庄严和王者尊贵，同时不把 δόξα 限定为神学意义的“荣耀”。
- source_word: καθὼς ἐκήρυξεν
  choice: 正如所宣告的
  rationale: 保留公开宣告之意，也保留希腊文未明说施事者的特点；“正如”表达 καθὼς 的对应关系。
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: 又看见他身穿细麻衣
  rationale: περιβάλλω 表示穿上或披上，σινδών 指麻布或麻布衣服；按汉语句法补出“又看见”，使之与前面的宾语结构清楚衔接。
- source_word: ἔφυγον πάντες
  choice: 就全都逃跑了
  rationale: 直接传达 πάντες 的全体范围和 φεύγω 的逃离力度。
theological_decisions:
- issue: δόξα 在本节是神学性的“荣耀”还是王者外显的尊荣
  choice: 威仪
  alternative: 荣耀；荣光；华贵
  rationale: 上下文着眼于公开宣告、服饰和众人的反应，较可能指可见的王者威势；译为“威仪”不引入特定神学含义，同时保留尊荣色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是……就……”形成清楚的叙事推进；“威仪”保持历史叙事中的王者语域。正文中的“细麻衣”沿用汉语圣经传统的可懂表达，但脚注说明原词也可泛指麻布或麻布衣服。
