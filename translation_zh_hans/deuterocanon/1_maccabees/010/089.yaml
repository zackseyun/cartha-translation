base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: zh_hans
  text: 他送给他一枚金质扣饰；照惯例，这是赐给君王亲属的。他并把阿卡龙[a]及其全部辖境赐给他，作为产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿卡龙”是这一地名的希腊语形式；按希伯来语形式，这地方通常称为“以革伦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: 一枚金扣针
  rationale: πόρπη指用来扣合衣物的扣针或饰针。“金扣针”既保留具体器物及其材质，也避免过度限定其形制。
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: 这是按惯例赐给……的
  rationale: 表达宫廷中惯常的赏赐做法；中文采用自然的说明句式，并保留被动含义。
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: 国王亲族
  rationale: συγγενεύς可指亲属、亲族；此处是王室授予其亲族的惯例。“国王亲族”简洁地保留原文关系。
- source_word: Ἀκκαρὼν
  choice: 阿卡龙
  rationale: 依希腊文本的名称形式音译；其较为人熟知的希伯来语名称形式在脚注中说明。
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: 其全部辖境
  rationale: ὅρια本义为边界，复数在此引申为边界以内的领土。“全部辖境”自然表达城邑所属的整个地区。
- source_word: εἰς κληρονομίαν
  choice: 作为产业
  rationale: κληρονομία指继承所得或可传承的产业。此处为君王赐予的领地，“作为产业”保留其法律及世袭色彩，又符合中文历史叙事。
