base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: zh_hans
  text: 凡从犹大地被掳到我王国境内任何地方的犹太人，我都无偿释放，使他们重获自由；所有人也都应免除他们及其牲畜所负的税款。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 句末希腊文的句法关系不甚明确。可狭义理解为免除向其牲畜征收的税，也可较广义理解为免除加在这些人及其牲畜（或相关财产）上的税费。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: 凡……犹太人
  rationale: ψυχή在此类行政语境中指“人”，不是人的内在灵魂；“凡……犹太人”自然表达πᾶσαν的逐一涵盖之意。
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: 被掳
  rationale: 该分词表示被俘成为俘虏；“被掳”简洁、庄重，并符合历史叙事语体。
- source_word: ἀπὸ γῆς Ἰούδα
  choice: 从犹大地
  rationale: γῆ意为“地、土地”，保留“犹大”比译作较具解释性的“犹太地区”更贴近希腊文。
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: 到我国境内任何地方
  rationale: 这里表示被分散到王国范围内各处；此译法自然传达πᾶσαν在该语境中的周遍范围。
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: 我都无偿释放，使他们重获自由
  rationale: ἀφίημι与ἐλευθέραν共同表达释放、恢复自由，δωρεάν说明无需支付赎金或费用；译文保留两层信息。
- source_word: πάντες ἀφιέτωσαν
  choice: 所有人也都应免除
  rationale: 命令式要求王权之下有关各方取消财政负担；“应免除”比一般性的“释放”更适合税务语境。
- source_word: τοὺς φόρους
  choice: 税项
  rationale: φόροι指税、贡赋或征收款；“税项”是清楚而涵盖面适当的现代行政用语。
- source_word: κτηνῶν αὐτῶν
  choice: 其牲畜
  rationale: κτῆνος通常指牲畜或役畜；“牲畜”是现代汉语中最自然的对应词。
