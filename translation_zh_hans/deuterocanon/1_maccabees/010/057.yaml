base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: zh_hans
  text: 托勒密和他的女儿克娄巴特拉离开埃及，来到托勒买；时在第一百六十二年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即塞琉古纪元第一百六十二年，约为公元前151至150年。
    reason: 说明原文采用的纪年体系，并为现代读者提供大致公历对应年代。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 该词是ἐξέρχομαι的简单过去时，字面为“出去”；在旅行叙事中表示从埃及启程离开。“离开”符合现代汉语习惯。
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: 带着他的女儿克娄巴特拉
  rationale: 原文直译为“他和他的女儿克娄巴特拉”。汉语用“带着”自然表达二人同行，同时保留托勒密为主要行动者、克娄巴特拉为同行者的叙事关系。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι可依叙述视角译为“来”或“去”；此处与目的地连用，译作“来到”简洁自然。
- source_word: εἰς Πτολεμαΐδα
  choice: 来到托勒密城
  rationale: εἰς加城市名表示向目的地移动。“托勒密城”既保留专名，又以“城”表明这是地名，便于普通读者理解。
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: 当时是第一百六十二年
  rationale: 希腊文以相加方式表达纪年序数，即“第一百六十二年”。补入“当时是”使中文纪年句自然，不改变原意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的历史叙事语言。将原文两个并列动词整合为顺畅的中文行程表达；人名和地名分别译作“托勒密”“克娄巴特拉”“托勒密城”。脚注标记置于整句纪年之后。
