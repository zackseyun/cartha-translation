base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: zh_hans
  text: 第一百六十年[a]，安条克·伊皮法内斯的儿子亚历山大上来[b]，占领了托勒迈城。当地人接纳了他，他便在那里作王[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里按塞琉古纪年计算；其第一百六十年约相当于公元前153至152年。
    reason: chronology
  - marker: b
    text: “上来”也可译作“前来”或“进军”；希腊文保留了古代叙事中常用于行程或军事行动的方向说法。
    reason: lexical_alternative
  - marker: c
    text: “作王”也可理解为“开始作王”或“在那里统治”；希腊文在这里可以侧重登位，也可以侧重行使王权。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: 第一百六十年
  rationale: 按希腊文的纪年公式直译，并采用现代汉语自然的序数表达；上下文所用的是塞琉古纪年。
- source_word: ἀνέβη
  choice: 上来
  rationale: 保留ἀναβαίνω的方向性惯用语；在本段历史叙事中也可指军事进发，但正文不把这一含义明说得过满。
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: 安条克·伊皮法尼的儿子
  rationale: 属格结构在此表示父子关系；Ἐπιφανής作为安条克四世通行的王号音译，避免以“显赫者”等译法额外解释其含义。
- source_word: κατελάβετο Πτολεμαΐδα
  choice: 占领了托勒迈城
  rationale: καταλαμβάνω的中间语态在这里表示取得并控制一座城；“占领”符合军事政治语境，又比“夺取”较少预设战斗方式。
- source_word: ἐπεδέξαντο αὐτόν
  choice: 当地人接纳了他
  rationale: 希腊文主语只以复数动词表达，未明确点名；汉语补出“当地人”以使句子自然，同时保持所指的概括性。“接纳”兼容欢迎与政治承认两层可能。
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: 他便在那里作王
  rationale: “作王”既可表达登基称王，也可表达行使王权，保留不定过去时在此可能具有的起始义与一般统治义。
theological_decisions:
- issue: ἐβασίλευσεν是指开始作王还是在那里统治
  choice: 作王
  alternative: 称王；在那里统治
  rationale: 上下文容许起始义，但动词本身也可泛指执掌王权；采用较宽的“作王”，并以脚注保留两种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名与王号用易辨认的音译，“托勒迈城”加“城”以明确这是地名。将希腊文未明说的复数主语谨慎译为“当地人”，不进一步限定为居民、守军或官员。
