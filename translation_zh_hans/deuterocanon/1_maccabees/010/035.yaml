  yaml_path: translation/deuterocanon/1_maccabees/010/035.yaml
  text: And no one will have authority to act against or harass any of them in any matter.
translation:
  language: zh_hans
  text: 任何人都无权就任何事对他们中的任何人采取行动[a]或加以骚扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “采取行动”所译的希腊语含义宽泛，也可按语境理解为“处置”或“追索”；原文没有明确限定行动的具体种类。
    reason: 保留πρᾶξαι在此处的词义宽度，避免把它过度具体化为征税、处罚或司法追诉。
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν οὐδεὶς
  choice: 任何人都无权
  rationale: ἐξουσία在诏令语境中表示合法的权柄或权限；“无权”简洁自然地表达“没有人拥有这样的权限”。
- source_word: πρᾶξαι
  choice: 采取行动
  rationale: πράσσω本义宽泛，可指行事、处置或采取措施。此处与“骚扰”并列，且受保护者为共同宾语，因此中文用“对……采取行动”，保留其宽泛而带不利处置色彩的法律语境，不擅自限定为征税或惩罚。
- source_word: παρενοχλεῖν
  choice: 加以骚扰
  rationale: 该词表示造成困扰、妨碍或侵扰；“加以骚扰”符合正式诏令语体，也为现代读者所明白。
- source_word: τινα αὐτῶν
  choice: 他们中的任何人
  rationale: 准确表达受保护群体中任何一个成员，且自然承接两个并列不定式。
- source_word: περὶ παντὸς πράγματος
  choice: 因任何事
  rationale: πρᾶγμα可指事情、事务或案件；“因任何事”在中文中自然表达保护范围不受事项限制。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的诏令语体。“任何人都无权”比逐字译作“没有人将有权柄”更符合现代汉语；语序将“因任何事”前置，使全面禁止采取行动和骚扰的范围清晰。
