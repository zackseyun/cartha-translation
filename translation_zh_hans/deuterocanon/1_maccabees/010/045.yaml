base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/045.yaml
  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
translation:
  language: zh_hans
  text: 又要重建耶路撒冷的城墙，并加固四周；所需费用要从王的账上拨付[a]；也要重建犹太地区的城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“所需费用要按王的命令拨付”。希腊语“从王的λόγος”既可能具有账目、款项方面的行政含义，也可能指王的谕令；正文因上下文提到费用，采用财务方面的理解。
    reason: 保留λόγος在行政财务含义与官方命令含义之间的词义歧义。
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: 重建
  rationale: 这两个不定式本义为“建造”；在修复耶路撒冷及犹太地区防御设施的语境中，“重建”自然地表达恢复既有城墙之意，同时不作过度发挥。
- source_word: τὰ τείχη
  choice: 城墙
  rationale: τείχη通常指城市的防御墙垣；译作“城墙”比宽泛的“防御工事”更贴近原词，也比单说“墙”更清楚。
- source_word: ὀχυρῶσαι
  choice: 加固
  rationale: 该动词意为使之坚固、安全或设防；“加固”与城墙搭配自然，并保留其防御性含义。
- source_word: κυκλόθεν
  choice: 四周
  rationale: 该副词表示环绕、各面；“四周”简洁保留其空间范围。
- source_word: ἡ δαπάνη
  choice: 所需费用
  rationale: 该名词指支出、花费；加“所需”使现代汉语句意完整，但未增加具体资金类别。
- source_word: δοθήσεται
  choice: 拨付
  rationale: 字面义为“将被给予”；用于工程费用时，“拨付”准确而自然地表达行政供款。
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: 从王的账上
  rationale: λόγος既可有账目、款项方面的行政含义，也可指话语或命令。正文依费用语境采用财务含义，但以脚注保留官方命令这一可能解释；不用“国库”，因为原文并未直接使用“库藏”一词。
- source_word: Ἰουδαίᾳ
  choice: 犹太地区
  rationale: 此处指希腊化时期的地理区域Judea；“犹太地区”在现代汉语中清楚自然，并避免误解为更早时期的犹大王国。
