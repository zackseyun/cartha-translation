  yaml_path: translation/deuterocanon/1_maccabees/010/065.yaml
  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: zh_hans
  text: 王尊荣他，登记他为“首席友人”[a]之一，并任命他为将军和辖区长[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首席友人”很可能是王室宫廷中的正式品级；也可译作“首等朋友”或“首席朋友”。
    reason: 说明τῶν πρώτων φίλων很可能是技术性宫廷头衔，并保留较贴近字面的替代译法。
  - marker: b
    text: “辖区长”指管理某一地域划分的行政长官。
    reason: 解释μεριδάρχης所指的地域行政官职，避免过度确定其具体层级。
lexical_decisions:
- source_word: ἐδόξασεν
  choice: 赐给他尊荣
  rationale: 在王室政治语境中，此词表示君王授予荣誉和显位；译作“赐给他尊荣”既体现君王主动褒扬，也避免神学语境中“荣耀”的含义。
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: 把他列入“首席朋友”之中
  rationale: γράφω在这里指登记或列入正式名册；“列入……之中”自然地表达其获授宫廷等级。
- source_word: τῶν πρώτων φίλων
  choice: “首席朋友”
  rationale: 这很可能是希腊化宫廷中的正式品级。采用较贴近原文的名称并加引号提示其头衔性质，不将其泛化为普通密友。
- source_word: στρατηγὸν
  choice: 将军
  rationale: 此处主要指军事职位，且与后面的行政官职并列；“将军”能清楚区分两者。
- source_word: μεριδάρχην
  choice: 辖区长
  rationale: 该词指治理某一地域划分的官员。“辖区长”简洁表达行政职能，同时避免将具体层级过度确定为“省长”。
