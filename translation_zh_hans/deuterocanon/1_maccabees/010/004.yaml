  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: zh_hans
  text: 因为他说：“我们要抢先同约拿单讲和，在他同亚历山大联合起来反对我们以前。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: 我们要抢先
  rationale: 该词为不定过去时劝勉虚拟式，表示赶在对方采取行动以前先行动；“抢先”自然地保留了策略意味。
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  choice: 与约拿单讲和
  rationale: 带冠词的不定式说明所要抢先采取的行动；εἰρηνεύω在此指达成和平。“讲和”符合外交语境。代词所指为上下文中的约拿单，译出名字可避免连续代词造成歧义。
- source_word: πρὶν ἢ
  choice: 免得
  rationale: 原文在时间上意为“在……以前”，但语境同时表达防止某事发生的目的；汉语“免得”简洁自然地传达此处所忧虑的后果。
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: 他与亚历山大联合起来
  rationale: 字面为“把自己置于亚历山大一边”，在政治语境中表示结盟或联合；此译保留政治结盟的含义而不显生硬。
- source_word: καθʼ ἡμῶν
  choice: 对付我们
  rationale: κατά加属格表示敌对；“对付我们”符合人物直接引语的自然表达。
