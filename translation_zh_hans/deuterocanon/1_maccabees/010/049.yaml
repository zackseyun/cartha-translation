  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: zh_hans
  text: 两位王交战，德米特里的军队逃跑了；亚历山大追赶他，并胜过他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文先说亚历山大“追赶他”，随后说“胜过他们”。单数“他”很可能指作为统帅的德米特里，复数“他们”则指他的部队。此处译作“军队”的希腊文原意为“军营”，在战事语境中可借指驻营的军队。
    reason: 说明原文由单数转为复数，并交代“军营”一词在此的转喻用法。
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: 交战
  rationale: 这是表示双方投入战斗的军事惯用语；“交战”简洁自然，又不把含义扩大为长期战争。
- source_word: οἱ δύο βασιλεῖς
  choice: 两王
  rationale: 直接保留原文明确的主语，同时采用简洁庄重的现代汉语表达。
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: 德米特里的军营
  rationale: παρεμβολή本义可指营地，也可借指驻营的军队。“军营”保留原文的具体意象及其转喻空间，避免直接解释成“军队”。
- source_word: ἔφυγεν
  choice: 逃跑了
  rationale: 原动词只说明逃走；未译作“被击溃”，以免增添原文没有明说的战果。
- source_word: ἐδίωξεν αὐτόν
  choice: 追赶他
  rationale: 忠实保留阳性单数宾语；就上下文而言，“他”自然指德米特里。
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: 胜过了他们
  rationale: 表达占据优势、战胜对手的意思，同时比“彻底击败”更克制，并保留原文复数宾语。
