base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/073.yaml
  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: zh_hans
  text: 现在，你在平原上将无法抵挡骑兵[a]和如此强大的军力；那里既没有石头，也没有小石子，也没有可逃的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“马”，这里用集合单数，指骑兵或骑马作战的部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: 必……不住
  rationale: 这是将来时，表达对方将无力做到；与“抵挡”合译为自然、明确的中文。
- source_word: ὑποστῆναι
  choice: 抵挡
  rationale: 军事语境中指站住阵脚、抗击来敌；“抵挡”既保留主动抗拒之意，也符合现代汉语。
- source_word: τὴν ἵππον
  choice: 骑兵
  rationale: 希腊文直译为“马”，但这里是集合单数，指作为军种的骑兵。
- source_word: δύναμιν τοσαύτην
  choice: 如此强大的军力
  rationale: δύναμις在这里指军事力量，不是抽象能力；此译保留τοσαύτην所强调的程度，也不把范围限缩为步兵或整支军队。
- source_word: ἐν τῷ πεδίῳ
  choice: 在平原上
  rationale: πέδιον指平坦开阔的地带；“在平原上”自然呈现其与后文地形描述的联系。
- source_word: λίθος
  choice: 大石
  rationale: 基本义为石头；为保留它与κόχλας的大小对比，按语境译作“大石”。
- source_word: κόχλας
  choice: 小石
  rationale: 指较小的石子，与λίθος形成对照；“小石”比“卵石”少加形状或水磨成因方面的限定。
- source_word: τόπος τοῦ φυγεῖν
  choice: 可逃的地方
  rationale: 带冠词的不定式属格表示逃走的空间或可能；此译贴近原文而且通顺。
