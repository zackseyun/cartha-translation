  register: 采用庄重而清楚的现代标准汉语。保留原文由单数“我”转为复数“我们”的说话方式，不将其统一，以免消除原文可能具有的君王复数或代表性表达。希腊文的单数谓语与复合主语之间的不一致在汉语中无需作数的一致处理，故不设脚注。
