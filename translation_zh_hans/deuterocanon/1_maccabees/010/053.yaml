  yaml_path: translation/deuterocanon/1_maccabees/010/053.yaml
  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: zh_hans
  text: 我与他交战，他和他的军队都被我们击溃了，我们便坐上了他王国的宝座；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  choice: 我与他交战
  rationale: συνάπτω μάχην是“接战、交战”的军事习语；译作“与他交战”既准确又符合现代汉语表达。
- source_word: συνετρίβη
  choice: 都被我们击溃了
  rationale: συντρίβω在此表示彻底打垮或击溃，语气强于一般的“击败”。“都”使“他和他的军队”这一复合主语在汉语中衔接自然，并未增加新的所指。
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 他的军队
  rationale: παρεμβολή在军事语境中可指营地，也可转指驻营的军队；这里与敌方统帅并列且一同被击溃，译作“军队”最为自然。
- source_word: ὑφʼ ἡμῶν
  choice: 被我们
  rationale: 直接保留施事者以及说话者使用的第一人称复数，不扩展为“我军”。
- source_word: ἐκαθίσαμεν
  choice: 我们便坐上了
  rationale: 保留第一人称复数和“坐”的意象；“坐上宝座”在现代汉语中也自然表达登位、掌权。
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: 他王国的宝座
  rationale: 同时保留θρόνος“宝座”和βασιλεία“王国/王权”的含义，不进一步解释其政治或法统意义。
