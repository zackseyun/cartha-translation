  verdict: revise
  source_fidelity: 译文基本准确传达了这些人聚集反对某人、意图提出控告／申诉，以及王不予理会的叙事。惟“向王控告他”将申诉的直接对象明确补作“王”；虽可由下半句推知他们是在王面前提出此事，希腊文本身只说“针对他提出申诉／控告”，宜不在正文中补足。
  naturalness: 原译整体通顺，语体适合庄重叙事。“害人如瘟疫的恶徒”略带解释性地加入“害人”；改为“如瘟疫般的恶徒”更简洁，也更贴近原文的强烈比喻辱称。
  terminology: “不法之人”恰当对应παράνομοι；“王”“不理会”也自然准确。保留“控告”并以脚注说明“申诉”等可能，可反映ἐντυχεῖν κατʼ αὐτοῦ的行政／司法语义范围。
  issues:
  - severity: medium
    issue: “向王控告他”在正文补入“向王”。
    rationale: 原文的ἐντυχεῖν κατʼ αὐτοῦ表达针对某人提出申诉、控告或请愿，后文仅说明王没有听从他们。王可被视为隐含的受理者，但不是该短语明说的成分；删除该补入可避免不必要地限定句法。
  - severity: low
    issue: “害人如瘟疫”略加强了原文比喻的具体含义。
    rationale: λοιμοί以“瘟疫／灾害”作辱称，重点是其如瘟疫般令人厌恶、有害，而非明确断言其实施“害人”的行为。用“如瘟疫般”可保留修辞力度和语义开放性。
