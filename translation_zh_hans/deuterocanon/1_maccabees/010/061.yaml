  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: zh_hans
  text: 一些来自以色列、如瘟疫般的恶徒，就是不法之人，聚集起来反对他，要控告他；王却不理会他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν ἐπʼ αὐτόν
  choice: 聚集起来反对他
  rationale: συνήχθησαν表示众人聚集；结合敌对性的法律政治语境，ἐπʼ αὐτόν译作“反对他”，而不只表示朝向他。
- source_word: ἄνδρες λοιμοί
  choice: 害人如瘟疫的恶徒
  rationale: λοιμός本指瘟疫，用于人时是强烈的比喻性贬称；此译保留“瘟疫”的形象和严厉语气，同时使现代读者易懂。
- source_word: ἐξ Ἰσραήλ
  choice: 以色列中
  rationale: 表示这些人来自以色列群体；“以色列中”在本句中自然简洁，也避免让人误解为他们离开了某个地理区域。
- source_word: ἄνδρες παράνομοι
  choice: 不法之人
  rationale: παράνομοι意为违背律法或法律的人；“不法之人”保留其正式含义及道德谴责色彩。
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: 要向王控告他
  rationale: ἐντυγχάνω与κατά连用，在行政或司法语境中可指向掌权者提出针对某人的申诉或控告；依上下文补出“向王”，使行动对象清楚，但以脚注保留“申诉”等可能。
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: 王却不理会他们
  rationale: προσέχω在此指留意、听取或重视；“不理会”自然表达王拒绝听取其控告。
- source_word: ὁ βασιλεύς
  choice: 王
  rationale: 叙事中对君王称号的标准、简洁译法。
