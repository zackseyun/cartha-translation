  text: 住在巴基德所建堡垒里的外族人都逃走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 该词是不定过去时，表示逃离；“逃走了”自然简洁，保留军事撤逃之意，不额外添加是否成功脱险的含义。
- source_word: ἀλλογενεῖς
  choice: 外族人
  rationale: 原词指属于另一民族或族群的人；本节是军事历史语境，“外族人”能体现族群外来者之意，又避免“外邦人”可能带入的神学色彩。
- source_word: ὀχυρώμασιν
  choice: 堡垒
  rationale: 原词指设防的坚固据点；“堡垒”是现代汉语中自然明确的军事用语。
- source_word: οἷς οἰκοδόμησεν
  choice: 所建
  rationale: 关系从句修饰“堡垒”；汉语用“所建”简洁表达堡垒由巴基德先前建造，叙事先后可由语境自然显明。
- source_word: Βακχίδης
  choice: 巴基德
  rationale: 按希腊文人名音译，并采用中文次经译名中通行且自然的形式。
