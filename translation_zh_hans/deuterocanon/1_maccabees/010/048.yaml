  text: 亚历山大王召集了大批军队，并在德米特里对面扎营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: 召集了
  rationale: 该词在这里指把军事力量集结起来；“召集”自然准确，也保留了主动组织军队的意味。
- source_word: δυνάμεις μεγάλας
  choice: 大批军队
  rationale: δυνάμεις在军事叙事中指军队或兵力，μεγάλας表示规模庞大；“大批军队”在现代汉语中自然，并保留复数集合的意味。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: παρεμβάλλω在军事语境中指扎营、安营；“安营”简洁而庄重。
- source_word: ἐξ ἐναντίας
  choice: 在……对面
  rationale: 该短语首先表达空间上的相对位置，并不必然表示已经发动攻击；译为“在……对面”保留这一点。
- source_word: Δημητρίῳ
  choice: 底米特
  rationale: 按本项目适合现代中文读者的人名音译处理希腊名Δημήτριος。
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: 亚历山大王
  rationale: 既保留姓名与王号，也符合现代中文历史叙事的自然表达。
