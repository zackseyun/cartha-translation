  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: zh_hans
  text: 亚历山大王听说了德米特里传给约拿单的种种承诺；又有人向他讲述约拿单和他兄弟们所打过的仗、所行的英勇事迹，以及他们所受的劳苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: 种种承诺
  rationale: 该词指德米特里向约拿单作出的保证或许诺；“承诺”自然准确，“种种”体现关系代词ὅσας所涵盖的多项内容。
- source_word: διηγήσαντο
  choice: 有人向他讲述
  rationale: 该动词表示叙述、详述；希腊文主语仅由第三人称复数动词表达，并未说明具体是谁，因此用“有人”保留其不确定性。
- source_word: πολέμους
  choice: 战争
  rationale: 保留复数所表达的多次或多场军事冲突之意；汉语“战争”本身不必显式加复数标记。
- source_word: ἀνδραγαθίας
  choice: 英勇事迹
  rationale: 该词指勇武、英勇的作为；“英勇事迹”兼顾褒义力度与现代汉语的庄重自然。
- source_word: κόπους
  choice: 劳苦
  rationale: 该词可指辛劳、困苦及为此付出的代价；“劳苦”较贴近原词，并保留它既可侧重辛劳也可涵盖苦难的宽度。
- source_word: ἔσχοσαν
  choice: 所受
  rationale: 与κόπους连用表示经历、承受劳苦；“所受的劳苦”简洁自然，又不把语义过度限定为某一种忍耐方式。
- source_word: ἀδελφοὶ
  choice: 兄弟们
  rationale: 此处指约拿单在马加比家族中的亲兄弟，故直译为“兄弟们”，不泛化为亲族或同胞。
