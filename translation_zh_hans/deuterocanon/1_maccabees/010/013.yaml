  text: And each one left his place and went away to his own land.
translation:
  language: zh_hans
  text: 各人离开自己的地方，往自己的土地去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: 离开
  rationale: 此处指离开原先所在之处；“离开”自然、准确，也不至于像“抛弃”那样强化语气。
- source_word: ἕκαστος
  choice: 各自
  rationale: 强调每个人分别采取行动；“各自”符合现代汉语叙事习惯，也不额外引入性别限定。
- source_word: τὸν τόπον αὐτοῦ
  choice: 自己的地方
  rationale: τόπος基本义为“地方”。上下文虽可能隐含驻地或岗位，但原文措辞宽泛，译作“自己的地方”保留了这种开放性。
- source_word: ἀπῆλθεν
  choice: 回到
  rationale: ἀπέρχομαι本义是离去；与目的地“自己的家乡”连用时，现代汉语用“回到”自然地表达离开当前地点、返回所属地域的动作。
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: 自己的家乡
  rationale: γῆ在此指各人所属的土地或地域。“家乡”能自然表达其归属和返回之意，同时避免“国家”所带的现代民族国家色彩。
