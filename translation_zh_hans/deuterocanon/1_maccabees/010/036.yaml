  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: zh_hans
  text: 要从犹太人中登记至多三万人，编入王的军队；他们也要得到给养[a]，如同按例供给王所有军队的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“口粮”“维持费用”；希腊词 ξενιά 字面可指“款待”，在这里指供给军队的生活所需。
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: 要……征召……编入
  rationale: 该被动命令式指正式登记服役；“征召……编入”在现代汉语中自然体现军事行政语境。
- source_word: τῶν Ἰουδαίων
  choice: 从犹太人中
  rationale: 在此具有部分义，表示这些人从犹太群体中选取。
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: 编入王的军队
  rationale: δυνάμεις 在此指军事力量；此译法清楚表达纳入王军服役，又不刻意强调多支独立军队。
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: 三万人
  rationale: ἀνδρῶν 在征兵语境中明确指男性；εἰς 与数目可表示达到该数额。希腊文本本身未明确使用“至多”的限制词，因此正文不额外加入“最多”。
- source_word: δοθήσεται
  choice: 也要得到
  rationale: 保留将来被动所表达的正式承诺，同时用自然的现代汉语表述。
- source_word: ξενιά
  choice: 给养
  rationale: 该词本义可涉及接待或款待，但在军事语境中指供给军队的生活支持；“给养”准确而简洁。
- source_word: ὡς καθῆκει
  choice: 按例所得的一样
  rationale: 此处表达合宜、应当或惯常的待遇；“按例”自然体现标准军队待遇。
- source_word: πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: 王的所有军队
  rationale: 保留 πάσαις 的全称范围和 δυνάμεις 的军事含义。
