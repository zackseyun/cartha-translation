base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/029.yaml
  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: zh_hans
  text: 我们还要赐给你们许多减免[a]，并给你们礼物。现在，我释放你们，并使所有犹太人免缴赋税、盐税[b]和冠冕贡赋[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许多减免”也可译作“多项豁免”；这里的“减免”（ἀφέματα πολλά）按上下文是指财政义务方面的减免。
    reason: lexical_alternative
  - marker: b
    text: “盐税”所译的希腊语字面为“盐的价额”（τιμῆς τοῦ ἁλός）；在这份财政项目清单中，很可能指与盐有关的税款或核定费用。
    reason: cultural_note
  - marker: c
    text: “冠冕贡赋”所译的词（στεφάνων）字面意思是“冠冕”；当时可指献给君王的荣誉冠冕，或代替冠冕缴纳的钱款。
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν
  choice: 要给
  rationale: 此处以财政性减免为宾语，表达君王将要给予优惠；“给”与“减免”搭配自然，也保留授予之意。
- source_word: ἀφέματα πολλά
  choice: 许多减免
  rationale: 上下文涉及税赋和费用，指多项义务的免除或减轻，而非罪得赦免。
- source_word: δόματα
  choice: 礼物
  rationale: 泛指君王所赐之物；“礼物”简明，并不过度限定其具体形式。
- source_word: ἀπολύω ὑμᾶς
  choice: 我解除你们的负担
  rationale: 动词本义为释放、解除；结合随后免除税费的语境，补出汉语所需的“负担”，表达法律和财政上的解除，而非人身释放。
- source_word: ἀφίημι πάντας τοὺς Ἰουδαίους ἀπὸ τῶν φόρων
  choice: 免除所有犹太人的赋税
  rationale: 介词短语表明犹太人从税赋义务中获释；“免除……的赋税”符合现代汉语行政语体。
- source_word: φόρων
  choice: 赋税
  rationale: 指向国家或统治者缴纳的税款或贡赋；“赋税”既清楚又保留古代财政语境。
- source_word: τιμῆς τοῦ ἁλός
  choice: 盐税
  rationale: τιμή可指价格、估价或应缴费用；在连续列举财政负担的语境中，最可能指与盐有关的税费。脚注保留其字面与制度上的不确定性。
- source_word: στεφάνων
  choice: 冠冕贡
  rationale: 字面为“冠冕”，在希腊化时期可指献给君王的荣誉冠冕或折合成钱缴纳的贡项；“冠冕贡”兼顾原有意象和财政含义。
