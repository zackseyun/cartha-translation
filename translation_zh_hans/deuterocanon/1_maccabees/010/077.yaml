translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名按希腊文音译为“阿波罗尼乌斯”，地名Ἄζωτος采用传统圣经地名“亚实突”。正文避免重复“骑兵”时使用含混代词，末句明确回指，以符合自然汉语。
