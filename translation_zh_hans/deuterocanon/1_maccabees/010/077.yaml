base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: zh_hans
  text: 阿波罗尼乌斯听到这消息，就带着三千骑兵[a]和大批军队安营，前往亚实突，仿佛只是路过[b]；与此同时，他又向平原推进，因为他拥有众多骑兵，并且倚仗这支骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“三千马”；“马”在这里集合性地指骑兵。
    reason: cultural_note
  - marker: b
    text: 也可译作“像一个过路的人”。原文描述他表面上像是途经此地，是否明确指蓄意伪装则留有余地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听到这消息
  rationale: 希腊文未明说所听见的宾语，但上下文显然指前述消息；汉语补出“这消息”，使句子自然，同时不增加新的事件内容。
- source_word: παρενέβαλεν
  choice: 部署了
  rationale: 该动词在军事语境中可指安营或布置军队；此处后接“三千骑兵和一支大军”作宾语，“部署了”较贴合其及物结构，也保留军事行动的意味。
- source_word: τρισχιλίαν ἵππον
  choice: 三千骑兵
  rationale: ἵππος字面为“马”，此处以集合名词方式指骑兵部队；译作“骑兵”符合现代汉语军事表达。
- source_word: δύναμιν πολλήν
  choice: 一支大军
  rationale: δύναμις在这里指军队或军事力量，而非抽象的能力；“一支大军”简洁自然地表达其规模。
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: 前往亚实突
  rationale: ἐπορεύθη是一般性的“去、前往”；不额外限定为急行军。Ἄζωτος采用其圣经地名亚实突。
- source_word: ὡς διοδεύων
  choice: 仿佛只是从那里经过
  rationale: 保留ὡς所表达的表象或可能的伪装意味，但不在正文中断定这必然是蓄意欺骗。
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: 与此同时，他又向平原推进
  rationale: ἅμα表示同时发生；προσάγω在军事叙事中可表示向前推进。希腊文未明说另一个受事者，因此不补入“引诱敌人”等解释。
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: 倚仗这些骑兵
  rationale: 阴性代词αὐτήν最自然地回指阴性集合名词ἵππος所表示的骑兵；汉语明说所指对象，以避免代词含混，并体现完成时不定式所含的既定信赖。
