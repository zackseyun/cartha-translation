  naturalness: 整体为自然、庄重的现代汉语。“在第一百六十年的七月、住棚节期间”虽可理解，但将纪年、月份和节期以“在……的……，即……期间”的结构连结，时间关系更清晰顺畅。
  terminology: “圣袍”“住棚节”“军队”均合乎经文语境，且未过度界定服饰或部队性质。“住棚节”是现代中文中稳定、可识别的名称。
