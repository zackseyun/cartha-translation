base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: zh_hans
  text: 约拿单在第一百六十年的七月，即住棚节[a]期间，穿上了圣袍；他又召集军队，制造了许多武器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住棚节”原文指搭建棚屋的节期。
    reason: 说明σκηνοπηγία的字面含义，并保留通行的节期名称。
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: 穿上了
  rationale: 准确表达中间语态所指的亲自穿戴动作，现代汉语自然明确。
- source_word: τὴν ἁγίαν στολήν
  choice: 圣袍
  rationale: στολή指袍服或礼服，ἁγίαν表明其神圣、分别为圣的性质；“圣袍”简洁庄重，又不把衣服的具体形制说得过细。
- source_word: τῷ ἑβδόμῳ μηνί
  choice: 七月
  rationale: 这是时间与格结构；“七月”在中文经文语境中自然地表示历法中的第七个月。
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: 第一百六十年
  rationale: 希腊文使用序数结构，指纪年的第一百六十年。
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: 住棚节期间
  rationale: σκηνοπηγία字面涉及搭棚，是犹太节期的通行现代中文名称“住棚节”；“期间”自然表达ἐν的时间含义。
- source_word: συνήγαγεν δυνάμεις
  choice: 召集军队
  rationale: δυνάμεις在此语境指军事力量；“召集军队”比直译“聚集力量”更清楚自然，同时不必推断具体兵种或规模。
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: 置办了许多武器
  rationale: κατασκευάζω可涵盖制造、预备或配备；“置办”保留这种范围，避免武断地限定为亲自制造。
