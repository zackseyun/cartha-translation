translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以分号区分穿圣袍与随后军事行动，保持原文事件次序。所给希腊文本开头“我们的，并维持与我们的友谊”显然承接上一节，因此本节译文从“约拿单”开始，与节号及英文审校层一致。
