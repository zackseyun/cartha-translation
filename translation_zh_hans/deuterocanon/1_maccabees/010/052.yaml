base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: zh_hans
  text: 我回到自己的王国，坐上我列祖的宝座[a]，掌握政权，又击溃德米特里，控制了我们的国土以后，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我父辈的宝座”，是表示王朝承继的用语。
    reason: 说明“列祖”所对应的希腊文字面形式及其王朝语境。
lexical_decisions:
- source_word: Ἐπεὶ
  choice: ……以后
  rationale: 本句为后文提供先行情势；结合一连串已完成的行动，用置于句末的“以后”自然表达主要的时间关系，同时不排除其作为后续行动根据的意味。
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: 我回到自己的王国
  rationale: ἀναστρέφω在此指返回，βασιλεία结合介词短语指君王统治的疆域；“自己的王国”符合现代汉语，也保留说话者的王权主张。
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: 坐上我列祖的宝座
  rationale: “坐上……宝座”自然表达登临王位；“列祖”保留πατέρων的父系、王朝承继色彩，同时比“父辈”更符合庄重的君王文书语体。
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: 掌握政权
  rationale: κρατέω接属格表示取得并掌控，ἀρχή在此是统治权；“掌握政权”准确而自然，也不额外暗示其夺权是否合法。
- source_word: συνέτριψα τὸν Δημήτριον
  choice: 击溃德米特里
  rationale: συντρίβω语气强烈，处于军事政治语境；“击溃”既保留力度，也比字面“压碎”更合乎汉语。人名按希腊语音译为“德米特里”。
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: 控制了我们的国土
  rationale: ἐπικρατέω接属格表示取得支配权；χώρα在此指疆域。“国土”避免现代民族国家意味过重，并保留ἡμῶν“我们的”。
theological_decisions:
- issue: πατέρων μου的王朝承继用语
  choice: 我列祖的宝座
  alternative: 我祖先的宝座；我父辈的宝座
  rationale: 原文为复数“我的父亲们”，在君王文书中指父系先王。“列祖”既保留男性王统色彩，又是自然庄重的现代中文；脚注说明其字面形式，避免把王朝承继含义泛化。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话，保留本节作为长句前置从句的未完结构和句末逗号；避免古奥文言，也不把王权主张解释为合法或非法。
