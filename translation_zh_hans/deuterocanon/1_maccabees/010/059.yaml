  text: And King Alexander wrote to Jonathan to come and meet him.
translation:
  language: zh_hans
  text: 亚历山大王写信给约拿单，请他来与王会面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写信
  rationale: γράϕω在此以收信人作与格宾语；现代汉语若只说“写给”不完整，因此译作“写信给”，虽补出隐含的“信”，但准确自然。
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: 亚历山大王
  rationale: 保留君王称号与专名，并采用现代汉语叙事中自然、庄重的次序。
- source_word: Ἰωνάθῃ
  choice: 给约拿单
  rationale: 与格表示书信的收受者；“约拿单”采用通行的圣经人名译法。
- source_word: ἐλθεῖν
  choice: 请他来
  rationale: 不定式表达信中要求约拿单前来；汉语以“请”自然体现邀请或召见的语用关系，同时保留“来”的方向性。
- source_word: εἰς συνάντησιν αὐτῷ
  choice: 与王会面
  rationale: 该短语直指前来相会；“会面”比逐字译法自然。αὐτῷ回指亚历山大王，为避免连续两个“他”造成指代不清，译作“王”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的历史叙事语体。译文不添加原文未明说的会面地点、目的或礼仪性质；“请”表达书信中让约拿单前来的自然汉语语气，不将其强化为命令。
