base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: zh_hans
  text: 我已经把多利买和归属它的地区赐给耶路撒冷的圣民[a]，作为礼物，用于支付与圣事有关的应付开支[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归属它的地区”也可译作“与它毗邻的地区”或“附属于它的区域”。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希腊文措辞不寻常。“应付的开支”也可理解为“优先的开支”或“预先指定的开支”；末尾“圣者／圣物”可指圣民，也有人理解为与圣所、圣物或圣事有关。
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: 多利买
  rationale: 采用现代中文圣经传统中常见的地名译法，指托勒密城（Ptolemais）。
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: 归属它的地区
  rationale: 该分词短语可指与城相连、隶属于城的区域；此译法兼顾地理毗邻和行政归属，也保留一定宽度。
- source_word: δέδωκα
  choice: 我已经……赐给
  rationale: 以“已经”体现希腊语完成时所强调的现行、有效授予。
- source_word: δόμι
  choice: 赐给
  rationale: 抄本形式不寻常，语境显然属于赠予用语；中文以动词“赐给”自然表达“作为赠礼授予”，不机械重复“作为礼物”。
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: 耶路撒冷的圣民
  rationale: 语法为阳性或中性复数与格，最直接可理解为在耶路撒冷的圣者或分别为圣的人；“圣民”比“圣徒”更少带入后期基督教称谓，同时不将其未经说明地改成单数“圣所”。
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: 用来支付……首要开支
  rationale: 原文措辞生硬；προκαθήκουσαν可表达居先、预先指定或当务的意思。“首要开支”保留其优先性而不武断限定为固定或例行费用。
- source_word: τοῖς ἁγίοις
  choice: 圣务所需的
  rationale: 末尾的中性复数与格形式字面可指“圣物／圣事”，也可能再次指圣民；结合财政语境，译为“圣务所需的”表达神圣用途，但用脚注保留另一种语法可能。
theological_decisions:
- issue: 两处τοῖς ἁγίοις的所指
  choice: 首处译作“圣民”，末处按圣殿相关的神圣事务译作“圣务”
  alternative: 两处都指圣民；或末处指圣所、圣物
  rationale: 首处带有“在耶路撒冷的”限定，语法与语境均容许指人，不宜直接改作单数“圣所”。末处位于“开支”之后，按神圣用途理解较通顺，但原文确有含混，因此以脚注明示其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“多利买”沿用常见音译；“圣民”避免“圣徒”可能引发的后期教会术语联想。正文维持授予诏令的第一人称语气，并以脚注保留原文末句的真实歧义。
