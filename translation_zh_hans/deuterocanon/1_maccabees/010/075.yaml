  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: zh_hans
  text: 他在约帕城外安营；城里的人不让他进去，因为约帕驻有亚波罗尼乌斯的守军。接着，他们攻打这城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文只写“他们攻打这城”，没有明说“他们”是谁；按上下文，通常理解为约拿单一方的人。
    reason: referential_ambiguity
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: 在约帕城外安营，要攻打约帕
  rationale: παρεμβάλλω 在军事叙事中指安营，ἐπί 在此带有敌对趋向。中文若直译为“对着约帕安营”不够自然，因此以“在……城外安营，要攻打……”兼顾行动和敌对含义。
- source_word: ἀπέκλεισαν αὐτόν
  choice: 不让他进去
  rationale: ἀποκλείω 的基本意思是关在外面、拒绝进入；此译符合城市居民阻止军队入城的语境，同时不擅自加入原文没有明说的“关上城门”。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 原文直指“来自城里的人”。现代汉语用“城里的人”自然清楚，且不因希腊语语法阳性而额外限定为男性。
- source_word: φρουρὰ Ἀπολλωνίου
  choice: 亚波罗纽的守军
  rationale: φρουρά 在此指驻防部队；属格表示这支守军隶属或效忠于亚波罗纽。
- source_word: ἐπολέμησαν αὐτήν
  choice: 他们攻打这城
  rationale: πολεμέω 可指交战或攻打；阴性单数代词 αὐτήν 最自然地回指阴性名词“约帕（城）”。中文明确译作“这城”，避免“攻打它”所造成的指代含混。
