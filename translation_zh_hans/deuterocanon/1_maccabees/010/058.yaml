base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: zh_hans
  text: 亚历山大王会见了他，把自己的女儿克娄巴特拉嫁给他[a]，并在多利买为她举行了极其隆重的婚礼，按照君王惯常的方式[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己的女儿克娄巴特拉许配给他。”希腊语动词在这里明确含有婚嫁之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“按君王的礼仪”，或“照君王惯常的方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  choice: 迎接了
  rationale: 该动词可指“遇见”或“前去迎接”。此处是君王之间约定会面的叙事场景，“迎接了”自然地表达主动相会之意，又不过度补充具体礼仪。
- source_word: ἐξέδοτο
  choice: 嫁给
  rationale: 该动词在婚姻语境中明确指把女子许配、嫁给某人；中文用“把自己的女儿……嫁给他”可直接传达其婚姻含义。
- source_word: Κλεοπάτραν τὴν θυγατέρα αὐτοῦ
  choice: 自己的女儿克娄巴特拉
  rationale: 采用现代汉语自然语序，清楚表明克娄巴特拉是亚历山大的女儿。
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: 为她举行婚礼
  rationale: ποιέω与γάμος连用，表示举办或庆祝婚礼；“举行婚礼”庄重、自然，也保留事件本身的含义。
- source_word: ἐν Πτολεμαΐδι
  choice: 在多利买
  rationale: “多利买”是Ptolemais常见的中文圣经地名译法。
- source_word: καθὼς οἱ βασιλεῖς
  choice: 照君王的排场
  rationale: 该短语表示君王惯有的方式或规格；结合婚礼场景，“照君王的排场”比逐字译作“像君王们一样”更符合现代汉语。
- source_word: ἐν δόξῃ μεγάλῃ
  choice: 极其隆重
  rationale: 此处δόξα指典礼所显出的尊荣、华美和盛大，而非神学意义上的“荣耀”；“极其隆重”准确表达王室婚礼的盛大气象。
