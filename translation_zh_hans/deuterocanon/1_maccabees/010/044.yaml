base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/044.yaml
  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
translation:
  language: zh_hans
  text: 至于重建和修缮圣所工程[b]，所需费用将从王的账目中拨付[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从王的账目中拨付”也可理解为“按王的命令拨付”。希腊语“王的 λόγος”在行政语境中可指账目、核算记录，也可指命令；此处因论及费用，正文采用前一种理解。
    reason: lexical_alternative
  - marker: b
    text: “圣所”原文直译可为“圣物”或“圣地”；这里指神圣的圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  choice: 重建
  rationale: 带冠词的不定式在此名词化，指建筑工程；结合圣所修复的语境，译作“重建”比泛指“建造”更贴切。
- source_word: ἐπικαινισθῆναι
  choice: 修缮
  rationale: 该词表示使之重新、更新；与“重建”并列时主要指实际修复，而非礼仪性的重新奉献。
- source_word: τὰ ἔργα
  choice: 工程
  rationale: 复数名词涵盖与圣所重建和修缮有关的各项工作；现代汉语用“工程”自然且不作过度限定。
- source_word: τῶν ἁγίων
  choice: 圣所
  rationale: 中性复数在圣殿语境中可指神圣之处或圣殿区域；“圣所”清楚表达此处所指，同时脚注保留其字面范围。
- source_word: ἡ δαπάνη
  choice: 所需费用
  rationale: 指这些工程的财务支出；“所需费用”符合现代汉语表达，并保留单数集合意义。
- source_word: δοθήσεται
  choice: 将……拨给
  rationale: 保留将来被动的含义；在行政经费语境中，“拨给”比字面的“给予”更自然。
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: 由王命
  rationale: λόγος可指话语、命令，也可在行政语境中指账目或核算。此译文采用“王命”，但以脚注保留“王的账目/款项”这一财政性理解，避免消除原文歧义。
