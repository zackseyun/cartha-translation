base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: zh_hans
  text: “现在，你若倚仗自己的军队，就下到平原来见我们，让我们在那里彼此较量[a]，因为众城的力量与我同在[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们在那里彼此交锋。”原文在此语境中可指直接对抗。
    reason: lexical_alternative
  - marker: b
    text: 或译：“众城的兵力。”原文可能统指各城所提供的军事力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας ἐπὶ ταῖς δυνάμεσίν σου
  choice: 倚仗自己的军队
  rationale: πέποιθας表示已经形成并持续的信赖；在军事挑战的语境中，δυνάμεις具体指军队或兵力。“倚仗自己的军队”自然地表达了这种自恃。
- source_word: κατάβηθι πρὸς ἡμᾶς εἰς τὸ πεδίον
  choice: 下来，到平原上我们这里来
  rationale: 保留κατάβηθι的向下移动和πρὸς ἡμᾶς的朝向，也用“平原”表达πεδίον所指的平坦开阔地带。
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: 让我们……一较高下
  rationale: 该表达字面涉及彼此比较或匹敌，但在军事叫阵的上下文中指正面对抗。“一较高下”既保留较量意味，也不把原文过度明确化为某一种战斗方式。
- source_word: δύναμις τῶν πόλεων
  choice: 众城的力量
  rationale: 原文使用单数δύναμις和属格τῶν πόλεων，措辞较为凝缩。“众城的力量”贴近形式，并保留它可指兵力、支援或综合实力的开放性。
