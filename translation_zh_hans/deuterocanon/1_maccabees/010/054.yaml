  yaml_path: translation/deuterocanon/1_maccabees/010/054.yaml
  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: zh_hans
  text: 让我们同他建立友好关系[a]。现在，把你的女儿嫁给我；我将与你结为姻亲[b]，也要把与你身份相称的礼物送给你和她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们同他结盟。”希腊文直译为“让我们建立友谊”，在这里的王室语境中可能也包含外交结盟之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要与你家结亲。”希腊文动词指借婚姻建立姻亲关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: 我们要……建立
  rationale: 该词为劝勉式虚拟语气，表达共同采取行动的提议；“建立”自然体现关系的缔结。
- source_word: φιλίαν
  choice: 友好关系
  rationale: 基本义是“友谊”，但王室外交语境含有结盟色彩；“友好关系”既保留原词宽度，也适合政治语境。
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: 请把你的女儿嫁给我
  rationale: 用现代汉语自然表达婚嫁公式，同时保留由父亲将女儿许配给说话者的王室婚姻语气。
- source_word: ἐπιγαμβρεύσω
  choice: 我要与你结为姻亲
  rationale: 该动词指借婚姻进入姻亲关系；此译法兼顾人际亲属关系与王室联姻含义。
- source_word: δόματα
  choice: 礼物
  rationale: 原词泛指赠礼；上下文虽可能特指婚礼或聘婚赠礼，正文不作过度限定。
- source_word: ἄξιά σου
  choice: 与你身份相称的
  rationale: 表示礼物与对方的地位、尊荣相配；这样译比直译“配得上你的”更符合现代汉语。
