  text: 'so that they may be with me as help. And King Demetrius sent to the nation of the Jews, according to these words: Greetings.'
translation:
  language: zh_hans
  text: 好让他们与我同在，成为我的助力。德米特里王按以下的话致书犹太民族：“德米特里王致犹太民族：问安。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως ὦσιν σὺν ἐμοὶ εἰς βοήθειαν
  choice: 好叫他们同我一起，作我的援助
  rationale: 保留目的关系、共同站在一方的含义，以及 εἰς βοήθειαν 所表达的援助作用；用现代汉语自然表达，且不把援助具体化为原文未明说的军事支援。
- source_word: ἀπέστειλεν αὐτοῖς
  choice: 写信给犹太民族
  rationale: 结合随后所引书信的问候语，ἀποστέλλω 在此指发出书信；αὐτοῖς 的受信对象由紧接的 τῷ ἔθνει τῶν Ἰουδαίων 明确。
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος 在此指作为政治与族群共同体的犹太人；“民族”比单纯的“犹太人”更能保留原词的集体意味。
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照以下的话
  rationale: 该短语引出书信原文，汉语以“照以下的话”自然衔接后文，同时保留“这些话”的字面结构。
- source_word: χαίρειν
  choice: 问候你们
  rationale: 这是希腊书信开头的固定问候语；译为直接引语“问候你们”既传达其书信功能，也比字面“喜乐”自然。
