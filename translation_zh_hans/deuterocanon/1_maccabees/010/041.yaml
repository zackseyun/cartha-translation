translation_notes:
  register: 采用庄重而自然的现代书面语。“凡……的款项，从今以后都要……”保留法令式语气；“积余、像从前几年那样未曾缴付”尽量维持原文修饰关系，不擅自明确究竟由哪个行政主体缴付。
