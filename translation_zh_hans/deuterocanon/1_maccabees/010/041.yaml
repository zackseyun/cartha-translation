base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: zh_hans
  text: 此外，凡他们先前几年未从收入[a]中缴付的余款，从今以后都要交作圣殿[b]工程之用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “收入”所译的希腊词也可指“需要”、“用途”或“资源”；这里按财政语境理解为可供缴付的收入。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“房屋”，这里指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: πλεονάζον
  choice: 积余……的款项
  rationale: 该中性实词化分词指超出日常支用后剩余的部分；结合财政语境译为“积余……的款项”，既自然，也保留“余款、超额部分”的含义。
- source_word: ἀπέδωσαν
  choice: 未曾缴付
  rationale: 在财政行政语境中，ἀποδίδωμι表示交付、缴纳或拨付；“缴付”与后文“交作……之用”相配，又不把动作过度限定为某种现代拨款程序。
- source_word: χρειῶν
  choice: 各项经费
  rationale: χρεία通常可指需要、用途或开支；此处与余款及圣殿工程款项相连，宜按财政语境译为“经费”，同时以脚注保留“需要／开支”的词义可能。
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: 从前几年
  rationale: 这里的πρῶτος是相对于当前安排而言，指先前的若干年；“从前几年”自然地表达这一时间对比，避免误解为某一时代最初的几年。
- source_word: τὰ ἔργα
  choice: 工程
  rationale: 复数τὰ ἔργα指与圣殿有关的各项工程或项目；汉语集合名词“工程”自然简洁，也不擅自限定为修缮或重建。
- source_word: τοῦ οἴκου
  choice: 圣殿
  rationale: οἶκος字面为“房屋”，在此是对圣殿的称呼。正文译出实际所指，以现代汉语确保清楚；脚注注明原文表达。
