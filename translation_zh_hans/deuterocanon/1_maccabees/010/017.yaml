  text: 他写了几封信，并把它们送给了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写了
  rationale: γρά φ ω（γράφω）的不定过去时在此直接表示完成的叙事动作；“写了”自然准确，不额外加入“起草”等含义。
- source_word: ἐπιστολὰς
  choice: 几封信
  rationale: 该词是复数宾格，必须保留多封书信之意；汉语通常用量词表达可数复数，“几封信”比生硬的“信件们”自然，也不误作单数。
- source_word: ἀπέστειλεν
  choice: 派人送给
  rationale: 在书信语境中，汉语“派人送给”自然表达将信件遣送出去的动作；相较只说“寄给”，也避免引入现代邮政色彩。
- source_word: αὐτῷ
  choice: 他
  rationale: 原文只用第三人称单数代词，没有重述姓名，因此正文保留“他”，不擅自补明所指人物。
