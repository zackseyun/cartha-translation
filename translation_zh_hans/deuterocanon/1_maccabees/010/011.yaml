base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/011.yaml
  text: And he told those doing the work to build the walls and Mount Zion all around with squared stones for fortification, and they did so.
translation:
  language: zh_hans
  text: 他吩咐施工的人用方石修筑城墙，环绕锡安山，作为防御工事[a]；他们就照办了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作：“他吩咐施工的人用方石修筑城墙，并加固锡安山四周，作为防御工事。”
    reason: 原文中“城墙”“锡安山”和“四周”的句法关系较紧缩，存在不止一种合理理解。
lexical_decisions:
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: 施工的人
  rationale: 直指负责工程作业的人，符合现代汉语表达，也保留原文的实际施工语境。
- source_word: λίθων τετραγώνων
  choice: 方石
  rationale: τετράγωνος 指凿削成方整形状的石料；“方石”简洁、自然，且不额外限定具体加工规格。
- source_word: εἰς ὀχύρωσιν
  choice: 作为防御工事
  rationale: 表达修筑的防御用途；ὀχύρωσις 可指加固、防御设施或设防，正文采用合乎上下文的功能性表述。
- source_word: ἐποίησαν οὕτως
  choice: 他们就照办了
  rationale: 自然传达“他们就这样做了”，并清楚承接前面的吩咐。
theological_decisions:
- issue: τὸ ὄρος Σιὼν 的地名表达
  choice: 锡安山
  alternative: 锡安的山冈
  rationale: ὄρος 通常为“山”，且“锡安山”是稳定、易懂的专名表达；不将其弱化为普通山冈。
- issue: κυκλόθεν 与并列宾语的句法关系
  choice: 正文将其表达为城墙环绕锡安山
  alternative: “修筑城墙，并加固锡安山四周”
  rationale: 希腊语的并列结构较紧缩，κυκλόθεν 可理解为环绕锡安山修墙，也可能同时修饰城墙和锡安山的设防范围；用脚注保留另一种理解，避免把句法歧义完全消除。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“施工的人”“方石”“防御工事”均为普通读者容易理解的现代表达；保留“锡安山”这一传统且准确的地名形式。
