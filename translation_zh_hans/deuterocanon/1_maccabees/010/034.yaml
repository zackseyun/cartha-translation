base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: zh_hans
  text: 所有节期、安息日、朔日和指定的日子，以及节期前三日和节期后三日，都要成为免税和豁免[a]之日，惠及我全国所有的犹太人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豁免”或译“免除”“释放”；该希腊词也可有“赦免”之意。这里与“免税”并列，可能指行政上对义务、负担或其他责任的减免。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑορταὶ
  choice: 节期
  rationale: 指宗教礼庆及其日期；“节期”在现代中文圣经语境中自然庄重，也与后文单数“节期”保持一致。
- source_word: σάββατα
  choice: 安息日
  rationale: 准确表达复数所泛指的各安息日；中文无需以复数词尾标示。
- source_word: νουμηνίαι
  choice: 朔日
  rationale: 指新月开始之日及其礼仪性纪念；“朔日”简洁准确，比仅说“新月”更清楚地指向历法日。
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: 指定的日子
  rationale: ἀποδεδειγμέναι 表示已经正式指定或划定；译文保留其制度性含义，不额外限定由谁指定。
- source_word: ἔστωσαν
  choice: 都要成为
  rationale: 体现王令中的命令语气，同时保持现代中文的自然表达。
- source_word: ἀτελείας
  choice: 免税
  rationale: 在王室行政诏令中通常指免除税赋、贡赋或规费；“免税”简明易懂。
- source_word: ἀφέσεως
  choice: 免除义务
  rationale: 本词与 ἀτελείας 并列，语境是行政优待，宜理解为解除某些义务或负担；加上“义务”使中文语义完整，同时以脚注保留原词较宽的含义。
- source_word: πᾶσι τοῖς Ἰουδαίοις τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: 适用于我整个国境内的所有犹太人
  rationale: 与格表示受益者；“适用于”契合诏令语体，并清楚表达该规定覆盖王国全境的犹太人。
theological_decisions:
- issue: 王室行政语境中 ἀφέσεως 的性质
  choice: 免除义务
  alternative: 豁免；免除；赦免
  rationale: 本节论及王所授予的节期优待，并非直接讨论罪得赦免。译作行政意义上的“免除义务”，避免导入不合语境的神学限定；脚注仍保留该词可表示广义释放或赦免的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。列表结构尽量贴近希腊文；“都要成为”保留命令力度。“朔日”准确表达犹太历法中的新月日。脚注标记置于其实际解释的 ἀφέσεως 对应译语之后，而不是置于“指定的日子”之后。
