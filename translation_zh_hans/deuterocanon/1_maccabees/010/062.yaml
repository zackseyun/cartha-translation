base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: zh_hans
  text: 王吩咐他们；他脱去约拿单的衣服，给他穿上紫衣[b]。他们就这样做了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语中“脱去”和“穿上”都是单数动词，按句法最自然地承接“王”为主语；但末句“他们就这样做了”用复数。此处可能概括王及其随从执行王命，原文的单复数转换仍有张力。
    reason: textual_variant
  - marker: b
    text: 在当时的宫廷语境中，紫色衣物通常与王室或崇高身份有关。
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  choice: 吩咐
  rationale: 表示君王发出具有权威的命令；“吩咐”在现代汉语中自然，并符合宫廷语境。
- source_word: ἐξέδυσεν
  choice: 他们便脱去……的衣服
  rationale: 希腊语动词为单数，表层句法存在困难；但前文“他们”和末句复数“他们就照办了”表明，实际执行者应是奉命的侍从。正文采用自然可懂的复数表达，并以脚注保留原文现象。
- source_word: ἱμάτια
  choice: 衣服
  rationale: 该词泛指衣物；“衣服”准确、自然，不像“袍服”那样过度限定具体样式。
- source_word: ἐνέδυσεν
  choice: 给他穿上
  rationale: 自然表达为某人穿戴衣物的动作，也保留此处正式授予尊贵服饰的意味。
- source_word: πορφύραν
  choice: 紫袍
  rationale: 该名词可指紫色布料或紫色衣服；在穿戴和宫廷语境中译作“紫袍”清楚自然，同时体现身份象征。
- source_word: ἐποίησαν οὕτως
  choice: 他们就照办了
  rationale: 简洁传达复数主语依照王命执行的意思，符合现代汉语习惯。
