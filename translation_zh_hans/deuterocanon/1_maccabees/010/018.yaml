lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照这些话
  rationale: κατά与宾格连用可表示“按照、照着”；λόγοι在此可指“话、言辞”。译作“照这些话”既贴近现存希腊文，也不把残缺的书信引介语过度解释为完整句子。
- source_word: λέγων
  choice: 说
  rationale: 现在分词λέγων引出后续引文；现代汉语用“说”简洁自然，并保留其引语功能。
- source_word: Βασιλεὺς Ἀλέξανδρος
  choice: 亚历山大王
  rationale: 保留人名与王号；“亚历山大王”符合现代汉语叙事和书信抬头的自然语序。
- source_word: τῷ ἀδελφῷ
  choice: 致他的兄弟
  rationale: 与格可标示书信收件人，故用“致”；ἀδελφός既可指亲兄弟，也可能是希腊化王室外交称谓，因此正文保留“兄弟”，不具体判定关系。
