  text: 约拿单平安喜乐地回到耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回到
  rationale: 在叙事语境中与εἰς Ἱερουσαλήμ连用，表示返回耶路撒冷；“回到”自然保留了返回某地的方向含义。
- source_word: μετʼ εἰρήνης
  choice: 平安
  rationale: μετά加属格本义为“带着、伴随”；此处表示返回时安然无事的状态。汉语用“平安地”比直译“带着平安”更自然。
- source_word: εὐφροσύνης
  choice: 喜乐
  rationale: 该名词指欢乐、欢喜；“喜乐”庄重而通俗，并与“平安”形成协调并列。
- source_word: Ἰωνάθαν
  choice: 约拿单
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: Ἱερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的地名译法。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“平安喜乐地”把希腊文μετʼ εἰρήνης καὶ εὐφροσύνης的两个并列名词转化为汉语状语，既保留两项内容，也避免生硬的“带着平安和喜乐”。
