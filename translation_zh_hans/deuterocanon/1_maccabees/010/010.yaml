  text: 约拿单住在耶路撒冷，开始建造并修葺这座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾤκησεν
  choice: 住在
  rationale: 直接表达在耶路撒冷居住、定居之意，符合现代汉语习惯。
- source_word: οἰκοδομεῖν
  choice: 建造
  rationale: 保留原词“建造、兴建”的基本含义，也不将对象擅自限缩为城墙或某类建筑。
- source_word: καινίζειν
  choice: 修葺
  rationale: 此处指使城市焕新、整修；“修葺”既体现修复更新，也避免与“建造”语义重复。
- source_word: τὴν πόλιν
  choice: 这座城
  rationale: 承接耶路撒冷，以自然现代汉语明确其所指。
