  text: And Alexander the king heard, and he was greatly grieved, and he returned to Antioch.
translation:
  language: zh_hans
  text: 亚历山大王听见了，就非常忧愁，于是返回安提阿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: 亚历山大王
  rationale: 希腊文是“亚历山大—王”的同位结构；汉语用“亚历山大王”既自然，也保留其姓名与王号。
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 此处为叙事中的简单过去动作，直译为“听见了”自然，并不擅自补出希腊文未明说的消息内容。
- source_word: ἐλυπήθη σφόδρα
  choice: 非常忧愁
  rationale: ἐλυπήθη 表示陷入忧愁、悲痛或苦恼，σφόδρα 加强程度；“非常忧愁”准确而庄重，也保留情绪性质在语境中的一定宽度。
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: 返回安提阿
  rationale: ἀπέστρεψεν 在此表示转回或返回某地；“返回安提阿”是简洁自然的现代汉语表达。
- source_word: καὶ … καὶ … καὶ
  choice: ……就……于是……
  rationale: 连续的 καὶ 推进叙事。汉语不机械重复“并且”，而以“就”“于是”呈现动作的先后承接，同时不额外添加因果断言。
