  yaml_path: translation/deuterocanon/1_maccabees/010/078.yaml
  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: zh_hans
  text: 他追赶那人，一直追到亚实突；各军在他身后[a]交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各军随后交战。”希腊文在本节两次使用“在他后面／跟在他后面”这一短语；第二处既可按空间理解为“在他身后”，也可按行动次序理解为“随后”。
    reason: 保留ὀπίσω αὐτοῦ在此处可能具有的空间与次序双重含义。
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: 追赶那人
  rationale: καταδιώκω在军事语境中表示紧追、追击；其后的ὀπίσω αὐτοῦ按希腊语习惯补足追赶的对象。译作“追赶那人”既自然，又避免现代汉语中“追赶在他后面”的累赘表达。
- source_word: εἰς Ἄζωτον
  choice: 直到亚实突
  rationale: εἰς表示朝向该城的移动；结合追击语境，“直到”自然表达追赶所达到的地点。“亚实突”采用该城（Ashdod/Azotus）通行的现代中文圣经地名。
- source_word: αἱ παρεμβολαί
  choice: 各军
  rationale: παρεμβολή本义为营地、军营，也可转指驻营的军队。复数在此作为交战主体，译作“各军”保留复数和军事含义，又比字面的“各营”清楚。
- source_word: συνῆψαν … εἰς πόλεμον
  choice: 交战
  rationale: συνάπτω与εἰς πόλεμον连用，表示接战、投入战斗；“交战”简洁而符合叙事文体。
- source_word: ὀπίσω αὐτοῦ
  choice: 在他身后
  rationale: 第二次出现的短语可表达空间上的“在他身后”，也可能表示时间或行动上的“随后”。正文保留空间意象，脚注说明另一种理解，以免消除原文的含混。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代叙事语体。“各军”保留原文复数及军营转指军队的用法；两个男性代词在原文中均为αὐτοῦ，正文不擅自补明人物姓名。
