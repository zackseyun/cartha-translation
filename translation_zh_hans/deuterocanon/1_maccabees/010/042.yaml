base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: zh_hans
  text: 此外，他们过去照往年的惯例，每年从各项收入中、从圣所的账目[a]收取的五千舍客勒银子，也一并免除，因为这笔银子属于供职的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从圣所每年的账项中”或“按圣所每年的核算”。希腊文中含λόγος（账目、核算）的短语属于行政用语，表达较为压缩。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐπὶ τούτοις
  choice: 此外
  rationale: 简洁表达在前述事项之外再增加一项的意思，符合行政文告语气。
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: 五千舍客勒银子
  rationale: 保留古代重量兼货币单位“舍客勒”，不作现代币值换算；“银子”自然表达其材质和款项性质。
- source_word: οὓς ἐλάμβανον
  choice: 他们……收取的
  rationale: 未完成时表示过去惯常、反复进行的收取行为；主语在希腊文中没有明说，因此保留泛指“他们”，不擅自确定具体机构。
- source_word: ἀπὸ τῶν χρειῶν
  choice: 从各项收入中
  rationale: 在税收和财政语境中，χρεῖαι宜理解为款项来源或收入；“各项收入”比字面的“需要”更符合上下文。
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: 照往年的惯例
  rationale: 表达与早先年度惯常做法相同，而不把πρῶτοι机械译成时间序列上的“最初几年”。
- source_word: τοῦ ἁγίου ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: 每年……按圣所账目
  rationale: λόγος在行政语境中可指账目或核算依据；原短语高度压缩，正文采用自然中文，同时用脚注保留句法和词义上的其他可能。
- source_word: ἀφίεται
  choice: 也一并免除
  rationale: 财政文告中指撤销征收或免去应付款项；“免除”既清楚又保留正式语气。
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: 因为这笔银子属于
  rationale: ἀνήκειν表示该款项在权利上归于祭司；译为“属于”不额外解释其法律机制。
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: 供职的祭司
  rationale: λειτουργέω在此指祭司履行圣所职务；“供职”简洁保留礼仪服务色彩。
