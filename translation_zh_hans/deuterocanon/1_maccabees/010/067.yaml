  yaml_path: translation/deuterocanon/1_maccabees/010/067.yaml
  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: zh_hans
  text: 在第一百六十五年，德米特里的儿子德米特里从克里特来到他祖先的土地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他祖先的土地”；此处指他的祖传之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: 一百六十五年
  rationale: 希腊文以累加次序表达年份，直译为“第一百、第六十又第五年”；现代汉语自然表述为“一百六十五年”，保留塞琉古纪年的原有指称。
- source_word: ἦλθεν
  choice: 来到
  rationale: 常见叙事动词，结合表示目的地的 εἰς，译作“来到”自然，并保留向某地移动的视角。
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: 德米特里之子德米特里
  rationale: 按现代汉语简洁的谱系表达处理，同时保留父子同名的信息；人名依希腊语音译。
- source_word: ἐκ Κρήτης
  choice: 从克里特
  rationale: ἐκ 表示出发地或来源，“从克里特”是自然准确的现代汉语。
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: 来到他祖先的土地
  rationale: γῆ 保留为“土地”，既可指地域也可指国土；πατέρων 为复数，在此按祖辈意义译为“祖先”，避免现代汉语将“父辈”误解为仅指上一代。
