  text: And they were greatly afraid when they heard that the king had given them authority to gather forces[a].
translation:
  language: zh_hans
  text: 他们听说王已经准许他们召集军队时，就十分害怕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们害怕极大的害怕”，这是以同源词加强语气的希腊语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: 非常害怕
  rationale: 原文以同源名词加强动词，直译近似“害怕了极大的害怕”，表示强烈恐惧；“非常害怕”在现代汉语中自然地保留了强调语气。
- source_word: ὅτε ἤκουσαν
  choice: 听说……就
  rationale: ὅτε引出时间从句；汉语以“听说……就……”自然呈现事件次序及随即产生的反应。
- source_word: ἔδωκεν αὐτοῖς ὁ βασιλεὺς ἐξουσίαν
  choice: 王已经授权那些人
  rationale: ἐξουσία在此指君王正式授予的权限，“授权”准确而简洁；“已经”表明授权先于他们听到消息。用“那些人”避免汉语连续使用“他们”而误读为主句中的人获授权，但不进一步指明其身份。
- source_word: συναγαγεῖν δυνάμεις
  choice: 召集军队
  rationale: συναγαγεῖν意为聚集、召集；δυνάμεις在本叙事的军事语境中指武装力量。“召集军队”符合现代汉语历史叙事用语。
