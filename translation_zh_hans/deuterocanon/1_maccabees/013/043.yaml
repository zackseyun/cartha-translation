  text: In those days he encamped against Gaza and surrounded it with encampments[a], and he made a siege engine and brought it up to the city, and he struck one tower and captured it.
translation:
  language: zh_hans
  text: 那些日子，他在加沙安营，用军营包围了它。他制造了一具攻城器械，把它带到城前；他击打一座塔楼，并攻下了它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Γάζαν
  choice: 在加沙城外安营
  rationale: παρεμβάλλω在军事语境中指扎营，ἐπί加宾格表明行动针对加沙；译为“在……城外安营”自然呈现敌对驻营的场景，又不把动作扩展为原文未明说的“进军”。
- source_word: ἐκύκλωσεν αὐτὴν παρεμβολαῖς
  choice: 用营垒将城围住
  rationale: ἐκύκλωσεν直译为“围住”；παρεμβολαῖς是复数，指军营或营垒。此译分别保留“围住”及其军事手段，避免合并成单一的“围攻”。
- source_word: ἑλέπολιν
  choice: 一具攻城器
  rationale: ἑλέπολις是用于攻城的特定大型器械，但仅据本句难以确定其具体构造。“攻城器”清楚而不过度具体，量词“具”符合器械。
- source_word: προσήγαγεν τῇ πόλει
  choice: 推到城前
  rationale: προσάγω表示带到或移近；对象是大型攻城器，汉语用“推到”符合实际动作，“城前”自然表达与格所指的趋近目标。
- source_word: ἐπάταξεν πύργον ἕνα
  choice: 撞击一座塔楼
  rationale: πατάσσω基本义为击打；结合攻城器语境，“撞击”比泛化的“攻击”更具体。πύργον ἕνα按原文保留为“一座塔楼”，不增添“其中”之意。
- source_word: κατελάβετο
  choice: 并将它攻占
  rationale: καταλαμβάνομαι在此军事语境中表示夺取、占领；隐含宾语最自然地承接刚提到的塔楼，以“它”明确汉语指向，但不改换所指。
