  yaml_path: translation/deuterocanon/1_maccabees/013/012.yaml
  text: And Tryphon set out from Ptolemais with a large force to enter the land of Judah[a], and Jonathan was with him in custody;
translation:
  language: zh_hans
  text: 特利丰率领大军从多利买出发，要进入犹大地；约拿单也和他在一起，被看押着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被看押着”也可译作“在拘押中”或“被囚禁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 该动词在这里表示离开一地启程；“出发”自然准确，又不额外强化为军事进军。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 率领大军
  rationale: δύναμις在军事叙事中指武装兵力；“大军”简明传达兵力众多的意思。
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: 要进入犹大地
  rationale: 不定式表达此行目的；“进入”保留原文的中性措辞，不擅自译成“入侵”。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 贴近希腊文的地理表达，也符合现代中文圣经体叙事用语。
- source_word: ἐν φυλακῇ
  choice: 被看押着
  rationale: 该短语可指受监守、拘押或囚禁；此处约拿单随军同行，“被看押着”既表达失去自由，又不暗示关在固定监狱中。
