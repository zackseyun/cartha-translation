  text: But when he came near to Baskama, he killed Jonathan, and he was buried there.
translation:
  language: zh_hans
  text: 但特里丰接近巴斯加玛时，他杀了约拿单；约拿单被安葬在那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: 但……时
  rationale: 承接前文并带有轻微转折；现代汉语叙事中用“但……时”自然贴切，不夸大对比。
- source_word: ἤγγισεν
  choice: 临近
  rationale: 表达向某地靠近、来到近处，保留原文尚未明确进入该地的空间含义。
- source_word: τῆς Βασκαμά
  choice: 巴斯加玛
  rationale: 按希腊文 Βασκαμά 音译地名，并采用自然的简体中文音节形式。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 直接表达“杀死”的基本义，不额外暗示正式处决，也避免古雅措辞。
- source_word: τὸν Ἰωναθάν
  choice: 约拿单
  rationale: 采用中文圣经传统中 Jonathan 的通行译名。
- source_word: ἐτάφη
  choice: 葬在那里
  rationale: 准确表达 θάπτω 被动过去时“被安葬”；汉语以主动形态“葬在那里”表达受事结果更自然。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留简明的地点指示，所指自然承接巴斯加玛附近或该处。
theological_decisions:
- issue: ἐτάφη 的主语指向
  choice: 明确为约拿单
  alternative: 保留汉语代词“他”的形式歧义
  rationale: 希腊文的语法与叙事语境表明被埋葬者是刚被杀的约拿单；中文若写“他也葬在那里”，可能误指特里丰，因此重复姓名以确保自然清楚，并未增加神学解释。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语体。“特里丰”由上文语境补明 ἤγγισεν 与 ἀπέκτεινεν 的省略主语，避免中文出现不明所指；分号呈现杀害与安葬两个紧密相连的事件。
