base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/015.yaml
  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
translation:
  language: zh_hans
  text: 至于你兄弟约拿单因他所有的需要[a]而欠王室国库的银子，我们因此扣留着他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他所需之事”。希腊词可指需要；按语境也可较宽泛地指事务、职责或职务。
    reason: lexical_alternative
  - marker: b
    text: “扣留着他”所译的希腊词可表示抓住、约束或拘禁。此处的直接宾语是“他”，故保留对约拿单本人施加拘束的表述。
    reason: lexical_clarification
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: 至于……银子
  rationale: Περὶ在这里引出话题；ἀργύριον字面意为“银子”，在财政语境中指钱款。
- source_word: ὤφειλεν
  choice: 欠
  rationale: 直接表达债务关系，符合此处王库款项的语境。
- source_word: εἰς τὸ βασιλικόν
  choice: 欠王库
  rationale: τὸ βασιλικόν指王室或王家所有之物；在财政语境中以“王库”自然地表达应缴给王室财政的钱款。
- source_word: διʼ ἃς εἶχεν χρείας
  choice: 因所担任的职务
  rationale: χρεία可指需要、事务、职责或职务；这里涉及约拿单因其官方身份而欠王库的钱，译作“所担任的职务”较契合行政财政语境，同时以脚注保留较宽泛的词义。
- source_word: συνέχομεν αὐτόν
  choice: 我们正为此扣留他
  rationale: συνέχω的基本义包括抓住、约束、拘禁；结合上下文中释放约拿单和索取担保的谈判，“扣留”比“免除债务”更直接符合希腊语法和叙事处境。未把它弱化为仅仅“追究责任”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“王库”简洁表达王室财政机构；“正为此扣留他”保留原文的第一人称复数和持续控制之意。
