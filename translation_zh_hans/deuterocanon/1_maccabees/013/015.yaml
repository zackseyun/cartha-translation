revisions:
- from: 至于你兄弟约拿单因所担任的职务[a]而欠王库的银子，我们正为此扣留他[b]。
  to: 至于你兄弟约拿单因他所有的需要[a]而欠王室国库的银子，我们因此扣留着他[b]。
  rationale: 修订将 χρείας 译为不预设具体性质的“需要”，并以脚注保留其在行政语境中可涉及事务或职责的可能性。保留“扣留着他”以忠实反映 συνέχομεν αὐτόν，而不将其改写为免债或仅追究债务。
