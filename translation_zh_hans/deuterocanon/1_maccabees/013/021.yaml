  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
translation:
  language: zh_hans
  text: 但城堡里的人不断派遣使者，急切地催促他穿过旷野到他们那里去，并给他们送去粮食[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“到他那里去”；按上下文，这里应是集合意义的“到他们那里去”，指城堡里的人。
    reason: 保留原文代词单复数不一致所造成的文本歧义。
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: 但城堡里的人
  rationale: ἄκρα在《马加比一书》的耶路撒冷军事语境中指设防的城堡；ἐκ在此可表示来自或属于该处的人。译作“城堡里的人”自然明确。
- source_word: ἀπέστελλον πρεσβεύτας
  choice: 不断派使者来
  rationale: 未完成过去时ἀπέστελλον表达持续或反复的行动，故用“不断”；πρεσβεύτας指受委派的代表，“使者”兼顾正式性与现代汉语可读性。“来”按叙事视角表达使者前往西门处。
- source_word: κατεσπούδαζον
  choice: 急切地催促
  rationale: 该词表示热切而迫切地敦促；未完成过去时所含的持续意味与前文“不断”及动词“催促”的语境自然衔接。
- source_word: αὐτὸν τοῦ ἐλθεῖν ... πρὸς αὐτόν
  choice: 催促他……到他们那里去
  rationale: 印本文本后一个αὐτόν为单数，字面是“到他那里”，但语境中的请求方是城堡里的一群人，随后αὐτοῖς也是复数。正文采用合乎上下文的集合指称“他们”，同时以脚注保留希腊文本的单数形式，避免掩盖歧义。
- source_word: διὰ τῆς ἐρήμου
  choice: 从旷野
  rationale: διά加属格表示经由、穿过；“从旷野……去”在现代汉语中自然表达经旷野而行的路线，同时不把ἐρῆμος过度限定为沙漠。
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: 给他们送去粮食
  rationale: τροφαί在受困的军事语境中指维生食物或给养。“粮食”通俗、明确；“送去”保留ἀποστεῖλαι的派送方向。
