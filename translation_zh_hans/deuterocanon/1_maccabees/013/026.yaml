  text: 全以色列人为他举行了盛大的哀悼[a]，并为他哀悼了许多天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他大大哀哭。”希腊文使用同源词构成的表达，指公开的哀悼或哀哭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψαντο … κοπετὸν μέγαν
  choice: 举行了隆重的哀悼
  rationale: 这组同源词构成公开举哀的习语，表达强烈而正式的哀悼。“举行了隆重的哀悼”在现代汉语中自然庄重，又不把原文未明说的捶胸动作写入正文。
- source_word: πᾶς Ἰσραήλ
  choice: 全以色列
  rationale: 保留原文把以色列视为整体的集合说法，同时符合汉语圣经叙事的常用表达。
- source_word: ἐπένθησαν
  choice: 哀恸
  rationale: 该词指为死者悲伤、服丧；译作“哀恸”既体现深切悲痛，也与前句公开、隆重的“哀悼”略作区分。
- source_word: ἡμέρας πολλὰς
  choice: 许多天
  rationale: 这是表示持续时间的宾格；汉语以“了许多天”自然表达其延续时段。
