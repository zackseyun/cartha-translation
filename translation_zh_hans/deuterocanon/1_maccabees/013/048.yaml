base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: zh_hans
  text: 他清除了其中一切污秽[a]，让遵行律法的男子住在那里，又加固了那地方的防御[b]，并在那里为自己建造了一处住所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切不洁”或“一切玷污之物”。希腊文含义宽泛，可指礼仪、道德或宗教方面的污秽。
    reason: lexical_alternative
  - marker: b
    text: 或译“又为那地方设防”。这个复合动词可能含有进一步加强防御的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: 清除了
  rationale: 原词表示强力移除或驱逐。此处宾语是抽象的“污秽”，译作“清除”比“赶出”更符合现代汉语，同时保留彻底除去的行动意味。
- source_word: ἀκαθαρσίαν
  choice: 污秽
  rationale: 该词可涵盖礼仪、道德或宗教方面的不洁；“污秽”保留其宽泛含义，不限定具体类别。
- source_word: κατῴκισεν
  choice: 让……住在那里
  rationale: 该动词在此为使役义，表示安排或安置居民；此译自然表达他使这些男子定居其中。
- source_word: ἄνδρας
  choice: 男子
  rationale: 希腊文明确使用阳性复数名词；“男子”准确保留原文的性别指向。
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: 遵行律法的
  rationale: ποιεῖν 与 νόμος 连用表示实行、遵守律法；“遵行律法”是自然、庄重且具有持续行为意味的汉语表达。
- source_word: προσοχύρωσεν
  choice: 又加固了那地方的防御
  rationale: 该复合动词表示设防或加强防御；“加固……防御”传达其防御工事得到强化的含义，而脚注保留较简约的另一译法。
- source_word: ᾠκοδόμησεν ἑαυτῷ ... οἴκησιν
  choice: 为自己建造了一处住所
  rationale: 该结构明确表示为自己建造居住之处；“住所”简洁自然，也避免不必要地把建筑类型限定为普通房屋。
theological_decisions:
- issue: 净化语境中 ἀκαθαρσία 的范围
  choice: 一切污秽
  alternative: 一切不洁；一切玷污之物
  rationale: 原文没有说明污秽主要属于礼仪、道德还是宗教崇拜层面；采用宽泛译法，以保留历史与神学上的含混性。
- issue: ἄνδρας 的性别表达
  choice: 男子
  alternative: 人
  rationale: 原文使用明确的阳性名词，语境也不要求将其泛化为中性群体，因此保留其性别指向。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“其中”“在那里”维持原文对同一地点的连续指称；以“遵行律法”呈现自然的圣经语域，同时避免加入特定宗派解释。
