  yaml_path: translation/deuterocanon/1_maccabees/013/053.yaml
  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: zh_hans
  text: 西满看出他的儿子约翰已经成人，就任命他统领所有军队；约翰住在迦撒拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦撒拉”是希腊文地名形式，这地方更常称为“基色”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: 已经成人
  rationale: 此处表示约翰已达到成年、足以担当职责；译为“已经成人”比直译“是个男人”更符合现代汉语，也与下文受命统军相衔接，同时不额外断言其品格或能力已获证明。
- source_word: ἔθετο
  choice: 任命
  rationale: 在授予军事职务的语境中，“任命”自然准确地表达设立某人担任职位。
- source_word: ἡγούμενον
  choice: 统领
  rationale: 该词与“所有军队”连用，指军事领导职责；“统领”既保留领率之意，也符合叙事文体。
- source_word: τῶν δυνάμεων πάσων
  choice: 所有军队
  rationale: δυνάμεις在这里指军事力量或部队；“所有军队”清楚表达其统辖范围。
- source_word: ᾤκει
  choice: 住
  rationale: 未完成时表示持续居住；现代汉语用“住”简洁自然。
- source_word: ἐν Γαζάροις
  choice: 在迦撒拉
  rationale: 正文按希腊文地名Γαζάροις音译为“迦撒拉”，较常见的地点名称“基色”置于脚注说明。
