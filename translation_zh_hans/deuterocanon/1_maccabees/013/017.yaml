  yaml_path: translation/deuterocanon/1_maccabees/013/017.yaml
  text: And Simon recognized that they were speaking deceitfully to him[a], yet he sent the money and the boys[b], lest he stir up great hostility against the people.
translation:
  language: zh_hans
  text: 西门看出他们是在欺骗他，却还是把银钱[a]和男孩子们送去，免得招致百姓对他极大的怨恨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“银子”。希腊语ἀργύριον既可指金属银，也可指钱款或用于支付的银子。
    reason: lexical_alternative
  - marker: b
    text: 或译“免得在百姓中激起极大的敌意”。也可按较字面的关系方向理解为“免得对百姓怀有极大的敌意”。希腊语πρὸς τὸν λαόν在此所表达的关系方向并不完全明确。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: 看出
  rationale: 此处表示西门识破对方的意图，不只是知道某项事实；“看出”自然地传达辨明、察觉之意。
- source_word: δόλῳ
  choice: 心怀诡诈
  rationale: 与格在此表达说话的方式或手段，指蓄意欺骗；此译既自然，也保留其内在动机和欺诈性质。
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: 他们对他说话时
  rationale: 保留言语指向西门以及间接陈述中持续进行的语气。
- source_word: πέμπει
  choice: 送了去
  rationale: 希腊文采用历史现在时；现代汉语叙事通常以完成体表达。“送了去”也保留把财物和人交送给对方的方向感。
- source_word: τὸ ἀργύριον
  choice: 银钱
  rationale: ἀργύριον既可指银子，也可指作为款项的钱；“银钱”兼顾物质和支付语境，不必过度限定为现代货币。
- source_word: τὰ παιδάρια
  choice: 男孩子们
  rationale: παιδάριον在此指年幼的男性或少年；“男孩子们”保留性别与较年轻的年龄意味，又不武断限定具体年龄或亲属身份。
- source_word: μή ποτε
  choice: 免得
  rationale: 引出所要避免的结果或所担忧的可能性；“免得”符合现代汉语叙事表达。
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: 招致……极大的敌意
  rationale: 字面为“兴起极大的仇敌关系”；结合语境，“招致……敌意”自然表达西门因拒绝要求而可能引发的敌对反应。
- source_word: πρὸς τὸν λαόν
  choice: 百姓……的
  rationale: πρός在ἔχθρα的关系结构中可表达敌意所涉及或指向的对象；译作“百姓的敌意”理解为百姓对西门产生敌意，同时以脚注保留关系方向上的歧义。
