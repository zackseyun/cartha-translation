base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: zh_hans
  text: 但我们赦免你们直到今日所犯的无心之过和罪过[a]，也免除你们所欠的冠税[b]；若在耶路撒冷有任何其他税项被征收，今后不可再征收。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无心之过”也可译作“因无知而犯的过错”。
    reason: lexical_alternative
  - marker: b
    text: “冠税”原文直译为“冠冕”；此处可能指献给君王或归于王室的一种贡税。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: 免除
  rationale: 此处是君王诏令，所免的不仅包括过犯，也包括所欠税项；“免除”既能涵盖赦免过错，也自然适用于取消债务与税负。
- source_word: ἀγνοήματα
  choice: 无心之过
  rationale: 该词指因无知、疏忽或非故意而犯的错；“无心之过”通俗自然，并与后面的“罪过”形成有意义的区别。
- source_word: ἁμαρτήματα
  choice: 罪过
  rationale: 保留原词的道德分量，同时在政治诏令的语境中比单用宗教色彩较强的“罪”更自然。
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: 直到今日
  rationale: 准确表达赦免所涵盖的时间界限，也符合正式诏令的语体。
- source_word: στέφανον
  choice: 冠税
  rationale: 字面为“冠冕”，但此处与欠缴及征税并列，显然指与王冠相关的贡税；“冠税”保留原有意象并表明财政含义。
- source_word: ὠφείλετε
  choice: 你们所欠的
  rationale: 自然表达尚未清偿的义务，与免除税负的上下文相合。
- source_word: ἐτελωνεῖτο
  choice: 还征收别的税
  rationale: 该动词表示征税或收取关税；结合地点与诏令语境，译为“征收……税”清楚而自然。
- source_word: μηκέτι τελωνιζέσθω
  choice: 从今以后都不可再征收
  rationale: 体现 μηκέτι 的停止与今后禁止之意，并以现代汉语保留诏令式的命令语气。
theological_decisions:
- issue: 皇家诏令中的 ἁμαρτήματα 是否应保留明确的道德含义
  choice: 罪过
  alternative: 过犯；违法行为
  rationale: 原文把 ἁμαρτήματα 与因无知而有的 ἀγνοήματα 并列，具有道德—法律的双重色彩；“罪过”不把它缩窄为纯行政违法，也适合此处语境。
- issue: στέφανον 应按字面译为“冠冕”，还是解释为财政术语
  choice: 冠税
  alternative: 冠冕；贡税；王税
  rationale: 欠缴与征收的上下文要求财政含义；“冠税”既避免把它误解为实物冠冕，也保留希腊词的王冠意象。
translation_notes:
  register: 采用现代、庄重而清楚的诏令语体。“免除”统摄过错与财政义务；末句用“不可再征收”表达正式禁令。
