base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: zh_hans
  text: 耶路撒冷堡垒里的人被阻止出城到乡间去，也不能买卖[a]。他们饿得非常厉害，许多人因饥荒而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译作专名“阿克拉堡”。希腊文ἄκρα既可泛指堡垒，也可特指耶路撒冷的塞琉古驻军要塞。原文在“买卖”前重复了一个“和”（καὶ καὶ），意思仍然清楚，可能是抄写时的重复。
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: 堡垒
  rationale: ἄκρα既可作普通名词，指设在高处的堡垒，也可特指耶路撒冷的“阿克拉堡”。正文采用现代读者易懂的普通名词，专名可能性收入脚注。
- source_word: ἐκωλύοντο
  choice: 被阻止
  rationale: 保留未完成时被动态所表达的持续受阻状态和外在限制。
- source_word: ἐκπορεύεσθαι εἰς τὴν χώραν
  choice: 出城到乡间去
  rationale: 结合围困语境，将ἐκπορεύεσθαι的“出去”和χώρα所指城外乡野自然表达出来；“出城”是语境明确化，并未改变动作方向。
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: 买卖
  rationale: 简洁保留买与卖两方面的市场活动，不泛化为较抽象的“经商”。
- source_word: ἐπείνασαν σφόδρα
  choice: 饿得非常厉害
  rationale: 传达σφόδρα的强烈程度，并以自然现代汉语表达严重饥饿。
- source_word: ἀπώλοντο
  choice: 死
  rationale: 在饥荒语境中明确指死亡；现代汉语“死”比“灭亡”准确自然。
- source_word: ἱκανοὶ
  choice: 许多人
  rationale: 表达人数相当多但数目不确定。
- source_word: τῷ λιμῷ
  choice: 因饥荒
  rationale: λιμός在围困背景下指粮食断绝造成的饥荒，而不只是个人的饥饿感。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留围困导致断绝出行与交易、继而饥饿死亡的因果推进；不对堡垒究竟是普通称谓还是专名作无提示的定论。
