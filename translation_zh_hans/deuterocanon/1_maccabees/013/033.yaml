  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: zh_hans
  text: 西门修建了犹太地的堡垒[a]，用高塔、巨大的城墙、塔楼、城门和门闩环绕它，又在各堡垒中储备了食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在防御设施的列举中两次提到“塔”：先说“高塔”，后又说“塔楼”；译文保留了这一重复。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把粮食存放在各堡垒中。”这里的名词具体指可食用的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: 修建了
  rationale: οἰκοδομέω的基本义是建造；“修建”既适合军事建筑语境，也不把含义过度限定为单纯“加固”。
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: 犹太的堡垒
  rationale: ὀχύρωμα指设防之处或堡垒；保留原文单数以及属格关系，不擅自确定更具体的地名或所属关系。
- source_word: περιετείχισεν
  choice: 在四周筑起
  rationale: 该动词表示围绕筑墙或设置防御工事；结合后面的与格清单译为“在四周筑起”，自然呈现环绕设防之意。
- source_word: πύργοις ὑψηλοῖς
  choice: 高塔
  rationale: 直接保留防御建筑的形象及ὑψηλοῖς“高”的含义。
- source_word: τείχεσιν μεγάλοις
  choice: 宏大的城墙
  rationale: τεῖχος特指防御性城墙；“宏大”表达μεγάλοις，同时避免把原文进一步解释为“坚固”或“厚重”。
- source_word: πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: 塔楼、城门和门闩
  rationale: 保留原文第二次出现的πύργοις，不将其删去；μοχλοῖς在城门语境中指用来闩门的横木或门闩。
- source_word: ἔθετο βρώματα
  choice: 储备了食物
  rationale: βρώματα具体指食物；“储备”按军事堡垒语境自然表达ἔθετο所描述的存放行为，又不把食物扩大解释为各类军需物资。
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: 在各堡垒中
  rationale: 保留此处ὀχυρώμασιν的复数，与句首单数之间的数变化不作平滑处理；“各”使现代汉语的复数表达清楚自然。
