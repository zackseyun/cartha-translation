  text: But Tryphon was acting deceitfully with Antiochus the younger king[a], and he killed him,
translation:
  language: zh_hans
  text: 特利丰却以诡诈的手段[a]与那位较年轻的安条克王同行，并杀了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诡诈地”。希腊语与格 δόλῳ 既可表示行事的方式，也可表示所用的手段。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: 同行
  rationale: 未完成时表示过去持续进行的行动；结合 μετά 所表达的陪同关系，译作“同行”既自然，也保留了行进之意。
- source_word: δόλῳ
  choice: 诡诈地
  rationale: 与格可表示方式或手段；“诡诈地”在现代汉语中自然地表达欺骗、奸诈的方式，同时不把它限定为某一种具体计谋。
- source_word: μετὰ Ἀντιόχου
  choice: 与……安条克……同行
  rationale: μετά 加属格通常表示“与……一起”；上下文虽显出敌意，原文此处并未直接说“反对”安条克。
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: 年轻的安条克王
  rationale: νεώτερος 是比较级，可指“较年轻的”；汉语在缺少明示比较对象时用“年轻的”较自然，且保留其区别身份的作用。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 该动词直接表示“杀死”；不采用“谋杀”，以免加入原词未明说的法律或道德定性。
