  yaml_path: translation/deuterocanon/1_maccabees/013/022.yaml
  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: zh_hans
  text: 特利丰准备好他所有的骑兵前来；但那天夜里下了极大的雪，他因雪没有前来。于是他离开，来到基列地区[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“加拉阿迪提斯”，即基列地区。
    reason: 说明希腊文地区名称的形式及其所指。
lexical_decisions:
- source_word: ἡτοίμασεν
  choice: 预备好
  rationale: 直接表达军事行动前的准备，也保留简单过去时的叙事力度。
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: 他的全部骑兵
  rationale: ἵππος本义为“马”，但此处是军事集合用法，指骑兵部队；“全部骑兵”自然且准确。
- source_word: ἐλθεῖν
  choice: 要前来
  rationale: 保留动词“来”的方向性，不擅自强化为“进军”或“进攻”。
- source_word: χιών πολλὴ σφόδρα
  choice: 下了极大的雪
  rationale: 体现πολλὴ σφόδρα的强烈程度，同时使用现代汉语自然的降雪表达。
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: 他因雪没有前来
  rationale: 保留διά所表达的原因，也不把事实陈述解释性地改成“无法前来”。
- source_word: ἀπῆρεν
  choice: 拔营
  rationale: 在军事叙事中，该词可指离营启程；“拔营”比泛泛的“离开”更贴合语境。
- source_word: Γαλααδῖτιν
  choice: 基列地区
  rationale: 该希腊地名形式指基列一带；译作“基列地区”比单纯音译更便于现代读者理解。
