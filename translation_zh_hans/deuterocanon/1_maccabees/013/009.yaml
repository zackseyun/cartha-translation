  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολέμησον τὸν πόλεμον ἡμῶν
  choice: 请为我们打这一仗
  rationale: πολέμησον是直接要求采取军事行动的不定过去时命令式，与同根宾语τὸν πόλεμον连用，中文以“打这一仗”自然传达其加强语气；ἡμῶν译作“为我们”，体现他们请求对方替他们出战。加“请”符合现代汉语请求领袖出战时的自然表达，不削弱命令式的迫切性。
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: 凡你吩咐我们的
  rationale: πάντα ὅσα概括一切可能提出的事项，译作“凡……的”简洁而全面；ἐὰν加虚拟式指未来不确定的任何指示。语境中的“说”具有下达指示的实际作用，因此译作“吩咐”比机械地译作“说”更符合现代汉语。
- source_word: ποιήσομεν
  choice: 我们都必照办
  rationale: 未来时表示明确承诺。“照办”自然表达按对方所说的去做；“必”保留承诺的坚定语气，“都”呼应πάντα的全面性。
