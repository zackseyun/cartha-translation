  text: And they answered with a loud voice, saying, “You are our leader in place of Judas and Jonathan your brother.”
translation:
  language: zh_hans
  text: 众人大声回答说：“你是我们的领袖，接替犹大和你的兄弟约拿单。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 回答
  rationale: 这是ἀποκρίνομαι的简单过去时叙事用法；“回答”直接自然，也保留了对前文发言作出回应的语感。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 该与格短语表示方式；现代汉语以“大声”表达最自然，同时准确传达声音洪亮、公开响应的意思。
- source_word: ἡγούμενος
  choice: 领袖
  rationale: 该词指带领或治理群体的人。“领袖”适合此处政治与军事并存的语境，又不将其限定为君王、总督或军事统帅等特定官职。
- source_word: ἀντί
  choice: 接替
  rationale: 此处表示西门承接犹大和约拿单原有的领导位置。“接替”自然地表达替代及继任之意，但不额外引入正式继承制度。
- source_word: Ἰούδου
  choice: 犹大
  rationale: 采用现代中文圣经传统中该人名的通行译法。
- source_word: Ἰωνάθου
  choice: 约拿单
  rationale: 采用现代中文圣经传统中该人名的通行译法。
- source_word: τοῦ ἀδελφοῦ σου
  choice: 你哥哥
  rationale: ἀδελφός本身可泛指兄弟；根据本书人物关系，约拿单是西门的哥哥。正文采用自然明确的“哥哥”，并未改变此处的家族指称。
theological_decisions:
- issue: ἡγούμενος所指西门职分的性质
  choice: 领袖
  alternative: 首领、统治者、总督、统帅
  rationale: 经文表达众人承认西门继犹大和约拿单之后带领他们，但希腊文没有限定为王权、行政官职或纯军事职分；“领袖”保留其宽泛性，避免加入后来的政体或王朝含义。
- issue: ἀντί表达的替代或继任关系
  choice: 接替犹大和你哥哥约拿单
  alternative: 代替犹大和你哥哥约拿单；作犹大和你哥哥约拿单的继承人
  rationale: “接替”兼顾替代和先后承接的语义；“继承人”可能让人误解为制度化或世袭继承，超过原文所明说的范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人”将希腊语动词中未明说姓名的复数主语按上下文自然表达出来；“大声回答说”保留原文叙事结构。“你要……作”传达主语代词Σὺ的强调以及众人对西门领导地位的确认。
