translation_notes:
  register: 采用现代、庄重的外交公函语体。“又向……问安”承接上一节书信称谓的句法残段；“全面的和平”保留原文“大和平”的强调而避免不自然的直译。英文咨询层的脚注标记似有错位：其a实际解释βαΐν，b解释ἀφέματα；本稿按各自对应词正确安置。
