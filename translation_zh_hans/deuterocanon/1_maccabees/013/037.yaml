  yaml_path: translation/deuterocanon/1_maccabees/013/037.yaml
  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: zh_hans
  text: 又向犹太人的众长老和民族问安。你们送来的金冠和棕榈枝[a]，我们已经收到了。我们愿意同你们缔结深厚的和平，并致函主管政务的官员，给予你们豁免[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棕榈枝”也可译作“棕榈叶”或“树枝”；这里的希腊词指礼仪或致敬时所用的棕榈树枝。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“准许给你们各项免除”；这很可能指行政或财政方面的豁免，但原文没有说明免除的具体项目。
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβυτέροις
  choice: 众长老
  rationale: 在政治外交称呼中，指群体中公认的领袖，并非泛指年长男子。
- source_word: ἔθνει Ἰουδαίων
  choice: 犹太民族
  rationale: 保留ἔθνος所表达的整体民族或政治共同体含义，也符合正式外交语体。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是书信中的惯用问候语；译作“问安”自然且庄重，不按字面误译为“欢喜”。
- source_word: στέφανον τὸν χρυσοῦν
  choice: 金冠
  rationale: 直接表达作为外交礼物的金制冠冕，简洁而正式。
- source_word: βαΐν
  choice: 棕榈枝
  rationale: βαΐον指用于礼仪或致敬的棕榈树枝；保留原文单数。
- source_word: κεκομίσμεθα
  choice: 我们已经收到了
  rationale: 以“已经”体现完成时所强调的收讫状态。
- source_word: ἕτοιμοί ἐσμεν
  choice: 我们愿意
  rationale: 结合外交承诺语境，“愿意”比生硬的“准备好”更符合现代汉语公函表达，同时传达已具备行动意向。
- source_word: ποιεῖν ὑμῖν εἰρήνην μεγάλην
  choice: 与你们缔结全面的和平
  rationale: “缔结和平”符合外交语境；μεγάλην在此表达程度或范围，译为“全面的”比直译“大和平”自然，同时保留强调。
- source_word: τοῖς ἐπὶ τῶν χρειῶν
  choice: 主管政务的官员
  rationale: 该行政用语指负责相关公务的人；此译法交代其职能而不臆定具体官职。
- source_word: ἀφεῖναι ὑμῖν ἀφέματα
  choice: 免除你们应缴的款项
  rationale: 同源动词与名词构成免除义；上下文很可能涉及财政性豁免。正文采用自然、可理解的表达，并以脚注说明希腊文未明确限定具体项目。
