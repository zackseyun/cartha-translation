  text: And whatever we established with you stands[a], and the strongholds that you built shall remain yours.
translation:
  language: zh_hans
  text: 我们与你们所确立的一切，都继续有效[a]；你们建造的堡垒，仍归你们所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们与你们所确立的一切，都仍然成立。”希腊文没有明说“确立”的宾语；从外交文书的语境看，是指先前确立的安排或条款。
    reason: 说明原文宾语省略，并保留ἔστηκεν的另一种贴近原文的译法。
lexical_decisions:
- source_word: ὅσα
  choice: 一切
  rationale: 中性复数关系代词泛指“凡……的事／一切”。不在正文中补出“协议”，以保留希腊文宾语未明说的特点；外交语境自然表明所指是先前确立的事项。
- source_word: ἐστήσαμεν
  choice: 所确立的
  rationale: ἵστημι的简单过去时在此指把条款或安排确立下来。“确立”符合公文语体，也不把含义缩窄为双方“商定”。
- source_word: πρὸς ὑμᾶς
  choice: 与你们
  rationale: πρός加人称在这一外交语境中表达双方之间的关系，“与你们”自然且准确。
- source_word: ἔστηκεν
  choice: 继续有效
  rationale: ἵστημι的完成时强调已经确立且现仍成立。中文若直译为“站立”不自然，“继续有效”清楚表达其持续效力。
- source_word: ὀχυρώματα
  choice: 堡垒
  rationale: 该词指防御工事或设防地点。“堡垒”简明自然，同时没有过度限定具体建筑形制。
- source_word: ᾠκοδομήσατε
  choice: 建造的
  rationale: οἰκοδομέω通常意为“建造”。虽宾语是防御设施，原文并未使用专指“设防”的动词。
- source_word: ὑπαρχέτω ὑμῖν
  choice: 仍归你们所有
  rationale: 第三人称命令式在行政文书中确认所有权或占有权；“仍归你们所有”兼顾准许语气和上下文中的延续意味。
