base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: zh_hans
  text: 西门与他们达成协议，没有攻打他们[a]。他把他们赶出城，洁净了那些有偶像的房屋[b]，就这样唱着赞美诗、祝福着，进入城中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他们取得一致”。希腊文分词在这里可表示双方达成和解或安排，而非与他们交战。
    reason: lexical_alternative
  - marker: b
    text: 即存放或供奉偶像的房屋；这里的“洁净”很可能兼有宗教意义，并非仅指一般的清扫。
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  choice: 与他们达成协议
  rationale: 该分词在上下文中表示西门与城内的人达成和解或安排，从而没有交战；此译法比“赞同他们”更符合军事与政治语境。
- source_word: οὐκ ἐπολέμησεν αὐτούς
  choice: 没有攻打他们
  rationale: 动词表示发动战争或作战；“攻打”在城邑冲突的语境中自然，并保留军事含义。
- source_word: ἐξέβαλεν αὐτούς
  choice: 把他们赶出
  rationale: 原词带有强制驱逐的力度；“赶出”既自然，又避免“赶鬼”一类不相干的联想。
- source_word: ἐκαθάρισεν
  choice: 洁净了
  rationale: 由于紧接着提到偶像，这里不只是日常打扫，也含除去宗教污秽之意；“洁净”可保留这一层面。
- source_word: τὰ εἴδωλα
  choice: 偶像
  rationale: 这里指供奉或存放的异教神像；“偶像”准确表达其宗教性质。
- source_word: ὑμνῶν
  choice: 唱着赞美诗
  rationale: 现在分词说明西门进城时的方式；“唱着赞美诗”自然呈现其礼仪和庆贺色彩。
- source_word: εὐλογῶν
  choice: 颂赞上帝
  rationale: 原词可指祝福，也可在面向上帝时表示称颂。此处与“唱赞美诗”并列，语境很可能是称颂上帝；在正文中补明对象，使现代汉语自然，同时以神学决策保留较字面的可能。
theological_decisions:
- issue: 洁净有偶像之房屋的宗教含义
  choice: 译作“洁净了”，保留除去偶像所带来污秽的宗教层面。
  alternative: 清扫了；净化了
  rationale: “清扫”容易缩减为物理清洁，“净化”则可能显得过于技术化；“洁净”较好地兼顾原词与上下文。
- issue: εὐλογῶν的对象和含义
  choice: 正文译作“颂赞上帝”。
  alternative: 祝福着；说着祝福的话；称颂着
  rationale: 希腊文未明说宾语，因此字面上有一定开放性；但与“唱赞美诗”并列并处于庆贺进城的场景中，最自然是称颂上帝。译文为汉语流畅而补出对象，但不将其解释为对民众施行祝福。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“达成协议”“赶出城”符合政治军事语境；“洁净”“赞美诗”“颂赞上帝”保留经文的宗教与庆典色彩。所有脚注标记均已置于正文对应位置。
