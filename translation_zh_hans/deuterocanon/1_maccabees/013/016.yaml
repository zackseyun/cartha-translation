  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: zh_hans
  text: “现在，你送来一百他连得银子和他的两个儿子作人质，免得他获释后背叛我们；我们就会释放他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: 一百他连得银子
  rationale: 保留古代重量兼货币单位“他连得”，准确表达银子的数额。
- source_word: δύο τῶν υἱῶν αὐτοῦ ὅμηρα
  choice: 把他的两个儿子送来作人质
  rationale: ὅμηρα为宾格表语，说明两个儿子的身份；补出“送来”使汉语自然，并与ἀπόστειλον统摄的并列对象一致。
- source_word: ἀφεθεὶς
  choice: 获释后
  rationale: 不定过去时被动分词表示在背叛之前获释，译为“获释后”简明保留时间关系。
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: 背叛我们
  rationale: 表达脱离、反叛所属一方之意；在政治军事语境中“背叛我们”自然准确。
- source_word: καὶ ἀφήσομεν αὐτόν
  choice: 这样，我们就释放他
  rationale: καί在此承接所提条件及结果；“这样……就……”清楚表达交付赎金与人质后将释放他的关系。
