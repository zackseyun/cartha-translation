  text: In the one hundred seventy-first year[a], the yoke of the nations was removed from Israel.
translation:
  language: zh_hans
  text: 第一百七十一年[a]，列国的轭从以色列身上被除去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国的轭”或译“外族人的轭”。希腊语“列国”既可泛指各国，也可在犹太语境中指外族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: 第一百七十一年
  rationale: 这是纪年格式；汉语用序数年份表达，简洁自然，并保留原文的纪年方式。
- source_word: ὁ ζυγὸς
  choice: 轭
  rationale: ζυγός本义为牲畜所负的“轭”，此处比喻奴役和压迫性统治；保留这一意象比译作“重担”或“统治”更贴近原文。
- source_word: τῶν ἐθνῶν
  choice: 列国的
  rationale: ἐθνῶν既可泛指“列国”，在犹太语境中也可指“外族人”。正文采用较宽泛、较贴近词面的“列国”，并以脚注保留“外族人”这一语境性译法。
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: 从以色列身上
  rationale: ἀπό表示分离或除去；补出“身上”符合汉语中“除去……的轭”的表达习惯，同时将以色列呈现为承受辖制的群体。
theological_decisions:
- issue: τῶν ἐθνῶν应译为泛指的“列国”，还是带有犹太语境色彩的“外族人”
  choice: 列国的
  alternative: 外族人的
  rationale: 本节宣告以色列摆脱外国势力的辖制。“外族人”符合犹太语境，但“列国”更直接保留ἐθνῶν的一般含义，避免在正文中过早收窄其所指；脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“轭”保留原文鲜明的奴役意象；“从以色列身上除去”使隐喻在汉语中自然完整。
