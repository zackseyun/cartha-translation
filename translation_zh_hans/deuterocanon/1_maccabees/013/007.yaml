  text: 他的百姓听见这些话，精神就重新振奋起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: 重新振奋起来
  rationale: 该动词本有使火重新燃起、使生命或活力复苏之意；此处描述百姓内在精神恢复，以“重新振奋起来”既传达复燃之意，也符合现代汉语表达。
- source_word: τὸ πνεῦμα
  choice: 精神
  rationale: πνεῦμα在此指百姓内在的意志、勇气或士气；“精神”保留一定的语义宽度，不将其窄化为单纯的“勇气”或“士气”。
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: 他的百姓
  rationale: 保留属格及αὐτοῦ所表达的归属关系；“百姓”在叙事语境中自然、庄重。
- source_word: ἀκοῦσαι
  choice: 听见
  rationale: 不定式在此表达主句事件发生的契机或伴随情形；汉语以“听见……就……”自然呈现其时间和触发关系。
- source_word: τῶν λόγων τούτων
  choice: 这些话
  rationale: λόγοι指前文所说的话，“这些话”直接、自然，并保留指示关系。
