translation:
  language: zh_hans
  text: 说：“因为我没有把银子和孩子们[a]送给他，他就丧命了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子们”也可译作“少年人”或“年轻仆从”。希腊语παιδάρια可指儿童、少年，也可指年轻的仆役；本句本身没有明确限定其身份。
    reason: lexical_alternative
  - marker: b
    text: “丧命了”也可译作“灭亡了”或“被毁灭了”。希腊语ἀπώλετο表达毁灭或死亡，本句没有说明其具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 以简洁的引语引介语承接上文，保留希腊语复数分词的叙事功能；其复数主语须由上下文补足，不在本节片段中擅自增补。
- source_word: Ὅτι
  choice: 因为
  rationale: 在引语中引出因果解释，译作“因为”最自然地表达此处逻辑。
- source_word: οὐκ ἀπέστειλα
  choice: 我没有……送给
  rationale: 保留第一人称和否定的简单过去行为；汉语不必另行标明时态。
- source_word: τὸ ἀργύριον
  choice: 银子
  rationale: 既保留ἀργύριον的具体物质意象，也符合现代汉语中表示银钱的传统而清楚的说法。
- source_word: τὰ παιδάρια
  choice: 孩子们
  rationale: παιδάριον可指孩子、少年，也可在某些语境中指年轻仆从；本处不应在正文中无据地限定其社会身份，因此采用较直接的“孩子们”。
- source_word: ἀπώλετο
  choice: 丧命了
  rationale: 该形式在此指人遭毁灭或死亡；“丧命了”自然、庄重，并保留死亡由相关事件导致的意味，而不额外说明具体死法。
