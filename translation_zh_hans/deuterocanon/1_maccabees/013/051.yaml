base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/051.yaml
  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: zh_hans
  text: 一百七十一年二月二十三日，西门进入那堡垒；伴随着赞美、棕榈树枝、琴[a]、钹、弦乐器[b]、颂歌和歌曲，因为以色列的一个大敌已被粉碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”所译的希腊词指一种古代拨弦乐器，也可译作“里拉琴”或“竖琴”；其确切形制难以确定。
    reason: lexical_alternative
  - marker: b
    text: “弦乐器”所译的希腊词指一种特定的古代弦乐器，也有译作“竖琴”或“诗琴”的；其现代对应尚不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: 西门进入那堡垒
  rationale: 动词为简单过去时态；阴性代词承接上文所指的堡垒。汉语补出主语和所指，使单节阅读自然清楚，但不赋予地点人格化含义。
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνὸς ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: 一百七十一年二月二十三日
  rationale: 按现代汉语日期顺序表达，同时准确保留原文的年、月、日。
- source_word: μετὰ αἰνέσεως
  choice: 众人赞美欢呼
  rationale: αἴνεσις核心义为赞美；结合凯旋场景，以“赞美欢呼”自然传达伴随入城的公开庆贺，不限缩为感恩。
- source_word: βαΐων
  choice: 手持棕树枝
  rationale: 指庆典中使用的棕树枝；补出“手持”符合汉语表达及场景动作。
- source_word: κινύραις
  choice: 琴
  rationale: 该词指古代拨弦乐器，确切形制难定；“琴”简洁自然，并以脚注保留可能的具体对应。
- source_word: κυμβάλοις
  choice: 钹
  rationale: 直接对应古代击奏乐器，现代汉语读者容易理解。
- source_word: νάβλαις
  choice: 弦乐器
  rationale: 原词指一种具体弦乐器，但现代对应尚不确定；采用类别词，避免武断指定为竖琴或诗琴。
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: 颂歌和歌曲
  rationale: 保留两个并列名词及前者较鲜明的赞颂色彩，不将二者合并。
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: 一个大敌已从以色列中被除去了
  rationale: 保留被动结构和“从以色列中”的空间／群体表达；“除去”在汉语中自然表达敌对势力遭粉碎、清除的结果。
theological_decisions:
- issue: 庆典语言的性质
  choice: 按公共凯旋庆典译为赞美、乐器演奏和歌唱
  alternative: 采用更专门的祭祀或礼仪术语，如“感恩祭”或“圣诗”
  rationale: 希腊文表现带有赞美的庆贺场面，但本节本身不足以要求后期礼仪或弥赛亚式解释。
- issue: 古代乐器名称的不确定性
  choice: 正文采用现代读者可懂的“琴”和“弦乐器”，脚注说明可能对应
  alternative: 统一采用较具体或较古雅的“里拉琴”“竖琴”“诗琴”
  rationale: 原词确指不同乐器，却难与现代乐器精确等同；正文保持可读性，脚注保存词义张力，避免制造虚假的确定性。
- issue: 敌人被粉碎的表述
  choice: 译作“一个大敌已从以色列中被除去了”
  alternative: 译作“以色列粉碎了一个大敌”
  rationale: 原文使用被动语态，未明说施事者；保留被动可避免擅自指定是以色列、上帝或某位领袖完成此事。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。日期依汉语习惯排列；庆典项目以并列动词呈现，使长串介词结构自然可读。正文所有脚注标记均已对应列出。
