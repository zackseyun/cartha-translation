review_pass:
  verdict: revise
  source_fidelity: 草稿正确识别约拿单为被派遣者，且将ἐξέβαλεν和ἔμεινεν的后续单数主语理解为约拿单，基本符合希腊文。但“约拿单率领一支……军队，被派往”把原文“派约拿单，并同他（派）一支军队”的并列派遣结构改成了约拿单明确统率军队；“率领”虽在情境上可能，却不是原文所明说。宜改为“派……带着/同……一同前往”，以保留原文的表达及其限度。
  naturalness: 原文中文总体通顺、语体合宜。“派……带着一支相当可观的军队前往约帕”在现代书面汉语中自然，也比被动式“率领……被派往”更直接清楚。
  terminology: “押沙龙”“约拿单”“约帕”均为常用译名；“赶走”“城里的人”恰当保留军事驱逐及被驱逐者身份未明的含义。“相当可观的军队”可接受。“留在那里，在城中”保留双重方位表达，并可由脚注说明。
  issues:
