    issue: “率领一支相当可观的军队，被派往”将μετʼ αὐτοῦ δύναμιν ἱκανήν处理为约拿单统率该军队。
    rationale: 希腊文直述派遣约拿单，并有一支足够/可观的军力与他同去；没有明说他是该部队的统率者。改作“派……带着一支……军队前往”既自然，又不增加其指挥身份。
  - severity: low
