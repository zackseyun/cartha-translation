revisions:
- from: 押沙龙的儿子约拿单率领一支相当可观的军队，被派往约帕；他赶走了城里的人，自己就留在城中。[a]
  to: 他派押沙龙的儿子约拿单带着一支相当可观的军队前往约帕；约拿单赶走了城里的人，并留在那里，在城中。[a]
  rationale: 修订恢复原文“派约拿单，并同他有一支军队”的基本句法，避免无明示依据地称约拿单“率领”军队。后两项行动明确以约拿单为主语，以免中文在“他派……”之后产生指代歧义。其余译法保留草稿对身份未明的“在城里的人”及双重方位表达的审慎处理。
