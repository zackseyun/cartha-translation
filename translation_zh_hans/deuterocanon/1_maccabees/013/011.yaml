base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/011.yaml
  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: zh_hans
  text: 他派押沙龙的儿子约拿单带着一支相当可观的军队前往约帕；约拿单赶走了城里的人，并留在那里，在城中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“留在那里，在其中”。原文并用两个方位表达，可能强调他留在该城本身。
    reason: 说明ἐκεῖ和ἐν αὐτῇ的双重方位措辞；正文在保持自然汉语的同时将两者译出。
lexical_decisions:
- source_word: ἀπέστειλεν Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: 押沙龙的儿子约拿单……被派往
  rationale: 希腊文主句动词是“派遣”，约拿单是被派者；采用被动表达，可自然保留这一句法关系，并避免误读为约拿单派遣别人。
- source_word: καὶ μετʼ αὐτοῦ δύναμιν ἱκανὴν
  choice: 率领一支相当可观的军队
  rationale: μετʼ αὐτοῦ直译为“与他一同”，δύναμις在此指军事力量；中文以“率领……军队”自然表达同行的军力，ἱκανήν则译作“相当可观”，兼顾数量可观和足以执行任务之意。
- source_word: εἰς Ἰόππην
  choice: 往约帕
  rationale: εἰς表示朝向城市的移动；“往约帕”符合现代汉语叙事。地名采用常见圣经译名“约帕”。
- source_word: ἐξέβαλεν
  choice: 赶走
  rationale: 该动词在军事政治语境中表示驱逐；“赶走”具体自然，又不额外限定驱逐方式。
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: 城里的人
  rationale: 原文只说“在其中的人”，没有明确称其为居民、守军或敌人；“城里的人”保留这种身份上的不确定性。
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: 自己就留在城中
  rationale: 原文兼有“在那里”和“在其中”两个方位表达。正文采用自然中文“留在城中”，并以“自己”明确后半句主语仍是约拿单；原文的重复方位表达在脚注说明。
