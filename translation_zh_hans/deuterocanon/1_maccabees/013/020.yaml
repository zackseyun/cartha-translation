  yaml_path: translation/deuterocanon/1_maccabees/013/020.yaml
  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: zh_hans
  text: 此后，特里丰来到，要进入那城并将它毁灭；他围住了通往阿多拉的道路[a]。西门和他的军队在他所到的每一处都与他相对而行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围住了通往阿多拉的道路”也可译作“环绕了通往阿多拉的道路”或“封锁了通往阿多拉的道路”。希腊文的字面意思近于“他环绕了通往阿多拉的道路”；所指的具体军事行动并不确定。
    reason: lexical_alternative
  - marker: b
    text: “与他相对而行”也可译作“与他并行”或“迎着他推进”。这里的希腊动词表明西门的军队随着特里丰的动向采取相应或对抗性的行进，但未明确具体的战术位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 自然、简洁地表达叙事中的时间推进，同时保留与前事的衔接。
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: 想要攻入那城
  rationale: 属格冠词不定式表示目的；“攻入”既保留进入之意，也符合随后摧毁城池的军事语境。
- source_word: ἐκτρῖψαι αὐτήν
  choice: 将城摧毁
  rationale: ἐκτρίβω在敌对军事语境中表示彻底毁灭；重复“城”可避免汉语代词指向含混。
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: 他绕道前往阿多拉
  rationale: 该短语的句法和具体军事动作并不完全明晰；“绕道前往”按ἐκύκλωσεν的环绕、迂回意理解，并以脚注保留“包围/封锁通往阿多拉的道路”的可能。
- source_word: Ἄδωρά
  choice: 阿多拉
  rationale: 按希腊文地名Ἄδωρά音译。
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 他的军队
  rationale: παρεμβολή可指营地，也可转指驻营的军队；此处作为行进主体，译为“军队”更合乎现代汉语。
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: 一路与他相对而行
  rationale: 保留复合动词所含的对应、对向或抗衡式移动，不把它过度明确为直接攻击或单纯跟随。
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: 他到哪里，他们就跟到哪里
  rationale: 以自然汉语表达逐处配合或追随其动向的重复行动。
