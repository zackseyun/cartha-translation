  text: And now[a], far be it from me to spare my life in any time of distress; for I am not better than my brothers.
translation:
  language: zh_hans
  text: 如今，我断不可在一切患难的时候顾惜自己的性命[a]，因为我并不比我的弟兄们更强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“顾惜自己”；直译：“顾惜我的性命（或生命）”。这里的“性命”指生命本身或自身，而不是与身体相对的非物质灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: 我绝不
  rationale: 这是表达强烈否定和拒绝的希腊语愿望式惯用语；译为“我绝不”简洁自然，并保留坚决语气。
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: 顾惜自己的性命
  rationale: φείδομαι加属格表示顾惜、保全；此处ψυχή指人的性命或自身，而非与身体相对的非物质“灵魂”。
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: 在任何患难临到时
  rationale: παντί在否定语境中自然表达“任何”；θλῖψις指患难、困苦或压迫。“患难临到时”符合现代汉语表达。
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: 因为我并不……强
  rationale: κρείσσων可指更强、更优越或更好。结合上下文中弟兄们面对死亡的经历，“并不比……强”既保留词义幅度，也自然说明他没有理由独自保全性命。
- source_word: τῶν ἀδελφῶν μου
  choice: 我的弟兄们
  rationale: 此处指西门在叙事中的亲兄弟；“弟兄们”准确且具有庄重的经文语体。
