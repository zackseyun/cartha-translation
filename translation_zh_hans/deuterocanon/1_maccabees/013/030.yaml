  text: This is the tomb that he made in Modein, to this day.
translation:
  language: zh_hans
  text: 这就是他在摩得因建造的坟墓，直到今日仍然存在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是他在摩得因建造的坟墓，直到今日。”
    reason: 保留ἕως τῆς ἡμέρας ταύτης较为形式对应的译法；正文补出“仍然存在”，表达该惯用语在上下文中的含义。
lexical_decisions:
- source_word: τάφος
  choice: 坟墓
  rationale: 此词可指埋葬之处或墓葬建筑；结合上下文所述纪念性家族墓冢，“坟墓”准确、自然，也比单说“墓穴”更能涵盖建筑含义。
- source_word: ἐποίησεν
  choice: 建造
  rationale: ποιέω本义宽泛，可译“做、造”；用于坟墓建筑时译为“建造”最符合现代汉语搭配，并未超出语境。
- source_word: ἐν Μωδεεὶμ
  choice: 在摩得因
  rationale: ἐν直译为“在”；Μωδεείμ按希腊文形式音译为“摩得因”，保留古地名特征。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今日仍然存在
  rationale: 该短语表示墓在作者写作时仍存留；补出“仍然存在”使汉语语义完整，并明确原文时间表达在此语境中的含义。
- source_word: οὗτος
  choice: 这就是
  rationale: 原文是无系词的指认句；现代汉语用“这就是”可自然表达其识别、指示功能。
