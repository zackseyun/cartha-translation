  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: zh_hans
  text: 他接替那人作王，戴上了亚细亚的王冠[a]，使那地遭受重创[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王冠”原文特指君王所戴的束额冠带，是王权的标志。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在那地造成了极大的破坏。”原文直译是“在那地造成重大的击打”，表示严重的损害或灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: 接替那人作王
  rationale: 既保留ἐβασίλευσεν的君王含义，也表达ἀντʼ αὐτοῦ所含的替代、继位关系；不把动词过度限定为单纯“开始作王”或只强调统治时段。
- source_word: περιέθετο
  choice: 戴上了
  rationale: 中间语态表示给自己戴上某物；中文“戴上”自然地保留这一具体动作和即位象征。
- source_word: τὸ διάδημα
  choice: 王冠
  rationale: διάδημα特指王权标志，原可指君王束额的带状冠饰；“王冠”对现代普通读者清楚，同时保留王权意义。
- source_word: τῆς Ἀσίας
  choice: 亚细亚的
  rationale: 按希腊文直译地名，不扩展解释为“亚细亚王国”或“亚细亚地区”，以免加入原文未明说的历史界定。
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: 使……遭受重创
  rationale: 原短语直译为“造成一次重大的击打”；此处“重创”保留打击的比喻，又自然表达严重损害，不特指瘟疫。
- source_word: ἐπὶ τῆς γῆς
  choice: 那地
  rationale: γῆ可指土地、地区或大地；政治军事语境中译作“那地”较自然，同时不进一步确定具体疆域。
