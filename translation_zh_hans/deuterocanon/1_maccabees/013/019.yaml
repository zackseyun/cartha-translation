  text: And he sent the young men and the hundred talents[a], but he broke his word and did not release Jonathan.
translation:
  language: zh_hans
  text: 西门便将两个儿子和一百他连得送了去；特利丰却背信[a]，没有释放约拿单。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欺骗了他”或“行事虚假”。希腊语动词可泛指欺骗；本处特指特利丰收下款项和人质后，没有履行释放约拿单的约定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλε
  choice: 送去
  rationale: 该简单过去时在叙事中表示差派或送交；结合所送的是人质和款项，“送去”自然准确。
- source_word: τὰ παιδάρια
  choice: 孩子们
  rationale: παιδάριον可指男孩、少年或年轻仆役；上文明确说是西门的两个儿子，因此用“孩子们”保留年龄和亲属语境，避免把他们泛化为成年“青年”。
- source_word: τὰ ἑκατὸν τάλαντα
  choice: 一百他连得
  rationale: 按原文保留古代重量兼货币单位τάλαντον，并采用中文圣经传统中较易辨认的音译“他连得”。
- source_word: διεψεύσατο
  choice: 背信
  rationale: 该动词可泛指欺骗、弄虚作假；本处具体表现为收下款项和人质后不履行释放约拿单的约定，“背信”凝练地表达这一语境意义，同时以脚注保留较宽的词义。
- source_word: οὐκ ἀφῆκεν
  choice: 没有释放
  rationale: 约拿单正被拘押，ἀφίημι在此是使其获释，而非一般性的“让走”。
- source_word: τὸν Ἰωναθάν
  choice: 约拿单
  rationale: 采用该人名通行的中文圣经译名。
theological_decisions:
- issue: 两个连续动词的主语转换
  choice: 首句明示“西门”，后句明示“特利丰”
  alternative: 两处都译作“他”
  rationale: 希腊文动词本身未写出主语，但上下文表明送出孩子和银款的是西门，而背信并扣留约拿单的是特利丰。中文若连续使用“他”，会误导读者以为同一人既送出又背信；明示姓名属于语境所要求的指代澄清，不涉及教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“便……却……”清楚呈现行动与背约的转折；保留古代单位“他连得”，不擅自换算为现代币值。
