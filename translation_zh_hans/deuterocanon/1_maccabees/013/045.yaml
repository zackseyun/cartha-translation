  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
translation:
  language: zh_hans
  text: 城里的人带着妻子儿女上了城墙；他们撕裂了自己的衣服[b]，大声呼喊，请求西门向他们伸出右手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“把右手给他们”。这是表示诚信保证或达成协议的惯用说法；在这里也可理解为给予安全承诺或准许议和。
    reason: lexical_alternative
  - marker: b
    text: 撕裂衣服是当时表达悲痛、危急或迫切恳求的常见举动。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν οἱ ἐν τῇ πόλει
  choice: 城里的人……上了
  rationale: 保留向上登城墙的空间含义；“城里的人”自然表达希腊文集合性短语。
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: 带着妻子儿女
  rationale: 围城语境中，所指很可能是城中男子及其妻儿；此译简洁自然，同时不额外强化所有关系。
- source_word: ἐπὶ τὸ τεῖχος
  choice: 城墙
  rationale: 与“上了”连用，清楚表达登上城墙，而非仅仅走到墙边。
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: 他们撕裂了自己的衣服
  rationale: 表达完成分词所指的先行动作及其持续可见的结果，也保留古代哀痛、危急恳求的文化动作。
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 是现代汉语中自然有力的表达，完整传达强调性的音量描述。
- source_word: ἀξιοῦντες
  choice: 请求
  rationale: 此处表示迫切提出请求；“请求”既不弱化为一般询问，也不强化为命令。
- source_word: δεξιὰς αὐτοῖς δοῦναι
  choice: 向他们伸出右手
  rationale: 保留“右手”的具体意象，同时用自然汉语表达给予右手的动作；复数 δεξιάς 属于惯用表达，语境中可指诚信保证或和平条件，其含义在脚注说明。
theological_decisions:
- issue: 军事投降语境中“给予右手”的惯用含义
  choice: 正文保留具体意象“向他们伸出右手”
  alternative: 给他们保证；准许他们议和；给他们和平条件
  rationale: 原文惯用语可能表示作出诚信保证、给予安全承诺或同意和平条件。正文保留意象以避免把具体含义过早限定为某一种，脚注交代其语用范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“妻子儿女”符合围城场景中的关系表达；分号划分登城、撕衣与呼求三个连续动作。所有脚注标记均置于相关正文之后。
