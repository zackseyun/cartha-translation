  text: 特里丰转身回去，往自己的国土去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 转身回去
  rationale: 该词在这里表示改变行进方向、返回；“转身回去”既保留方向变化，也符合现代汉语叙事表达。
- source_word: ἀπῆλθεν
  choice: 去了
  rationale: 该词表示离开当前地点；与前面的“转身回去”连用时，译作“去了”自然流畅，也避免重复表达“离开”。
- source_word: γῆν
  choice: 国土
  rationale: γῆ可指土地、地域或国土；此处是特里丰返回其所属之地，“国土”在不具体限定政体或疆界的同时，比单说“土地”更符合目的地语境。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 反身领属表达清楚表明目的地是特里丰自己的国土，并自然对应希腊文属格代词。
- source_word: Τρύφων
  choice: 特里丰
  rationale: 采用现代中文圣经及相关历史文献中常见的人名音译。
