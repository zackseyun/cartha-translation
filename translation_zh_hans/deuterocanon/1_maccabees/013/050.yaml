  yaml_path: translation/deuterocanon/1_maccabees/013/050.yaml
  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
translation:
  language: zh_hans
  text: 他们向西门高声呼求，请他接受他们诚信的保证[a]。西门就向他们作了保证，把他们从那里赶了出去，并洁净了堡垒[b]，除去其中的种种污秽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“接受右手”；这是表示诚信或正式保证的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“阿克拉堡”，即耶路撒冷那座设防的堡垒。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: 他们向西门高声呼求
  rationale: ἐβόησαν 表示大声呼喊，也可带有急切求告的意味；“高声呼求”兼顾声音力度和当时求援、求情的语境。
- source_word: δεξιὰς λαβεῖν
  choice: 接受他们的信义保证
  rationale: 原文直译为“接受右手”，是以伸出右手表示诚信、和解或安全保证的惯用语。正文采用意译，以免现代读者误解，并用脚注保留原文意象。
- source_word: ἔδωκεν αὐτοῖς
  choice: 西门就向他们作了保证
  rationale: 原文省略了宾语，所给的是上文“右手”所代表的保证。中文补明“保证”，使句意自然，同时不过度限定保证的具体条款。
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: 把他们从那里赶了出去
  rationale: ἐξέβαλεν 含强制逐出之意；“赶了出去”保留其力度，也符合军事政治语境。
- source_word: τὴν ἄκραν
  choice: 堡垒
  rationale: ἄκρα 可指高处的城堡或要塞，在本卷语境中又可特指耶路撒冷的阿克拉堡。正文用通俗清楚的“堡垒”，脚注说明专名可能。
- source_word: ἀπὸ τῶν μιασμάτων
  choice: 除去其中种种污秽
  rationale: μίασμα 指玷污、污秽，常含礼仪或宗教意味；“种种污秽”保留复数，并避免把意义缩减为单纯的物理脏污。
theological_decisions:
- issue: δεξιὰς λαβεῖν 应按字面还是按惯用义翻译
  choice: 正文译为“接受他们的信义保证”
  alternative: 直译为“接受他们伸出的右手”
  rationale: 字面译法在现代中文中不易自然传达正式保证的含义。正文表达惯用义，脚注则保存“右手”的原文图像，不把保证进一步解释为某种特定条款。
- issue: τὴν ἄκραν 是普通名词还是专名
  choice: 正文译为普通名词“堡垒”
  alternative: 音译为专名“阿克拉堡”
  rationale: 希腊词本身可作普通名词，但在这里很可能指耶路撒冷那座特定的塞琉古堡垒。正文优先保证可读性，脚注保留其历史专名身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“信义保证”保留正式承诺的意味；“洁净”与“污秽”相配，传达原文可能具有的礼仪和宗教色彩。
