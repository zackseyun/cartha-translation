  text: And if any of you are fit to be enrolled among our people[a], let them be enrolled, and let there be peace between us.
translation:
  language: zh_hans
  text: 若你们中有人适合列入我们一方的名册，就让他们登记在册；愿我们之间和平。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: 适合
  rationale: 此词表示合宜、适任或具备相应条件；这里与登记有关，译作“适合”可保留宽泛含义，不擅自限定为特定法律资格。
- source_word: γράφηναι
  choice: 登记加入
  rationale: 后文的ἐγγραφέσθωσαν表明这里有正式登记的行政意味；加上“加入”则自然表达登记进入某一群体的方向。
- source_word: τοὺς περὶ ἡμᾶς
  choice: 我们这边的人
  rationale: 原文直译为“我们周围的人”，在政治或群体语境中可指属于说话者一方的人；“我们这边的人”既自然，又保留其阵营或群体色彩，不把它过度明确为民族共同体。
- source_word: ἐγγραφέσθωσαν
  choice: 就让他们登记
  rationale: 沿用前面的登记用语，体现正式列名或注册的行政行为，并保留第三人称命令语气。
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: 愿我们彼此和平相处
  rationale: 这是双方关系中的和平表述；该译法符合现代汉语习惯，并传达“我们之间有和平”的祈愿或命令语气。
