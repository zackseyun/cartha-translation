base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: zh_hans
  text: 但我要为我的民族、圣所[a]以及我们的妇女和孩子[b]报仇，因为列国都因仇恨[c]聚集起来，要把我们消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣之物”或“神圣之处”；希腊文直译为“神圣的〔事物／地方〕”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们的妻子和孩子”。
    reason: lexical_alternative
  - marker: c
    text: 直译“为了仇恨”或“由于敌意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 但
  rationale: 承接上文形成强烈转折；“但”简洁自然，保留其转折语气。
- source_word: ἐκδικήσω
  choice: 我要……报仇
  rationale: 该将来时动词表示为受害者施行报复或伸冤；在军事语境中，“报仇”保留了原文强烈的报复意味。
- source_word: τοῦ ἔθνους μου
  choice: 我的民族
  rationale: 这里指犹太民族共同体；“民族”比“人民”更能保留其群体和政治层面的含义。
- source_word: τῶν ἁγίων
  choice: 圣所
  rationale: 该中性复数形式直译可指“神圣之物”或“神圣之处”，但在《马加比一书》的圣殿语境中最可能统指圣所；以脚注保留原文范围。
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: 我们的妇女和孩子
  rationale: γυναῖκες既可指妇女，也可指妻子；这里列举整个民族中受威胁的群体，“妇女”较符合广泛的共同体语境，同时脚注保留另一译法。
- source_word: συνήχθησαν
  choice: 聚集起来
  rationale: 表达列国已经会合并构成当前威胁；中文以“聚集起来”自然呈现其结果状态。
- source_word: πάντα τὰ ἔθνη
  choice: 列国
  rationale: 指周围各国或各族；“列国”简洁庄重，也避免引入新约语境下较特定的“外邦人”用法。
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: 要把我们消灭
  rationale: ἐκτρίβω在此表示彻底除灭；“消灭”准确、自然，并保留生存危机的强度。
- source_word: ἔχθρας χάριν
  choice: 因仇恨
  rationale: 该短语说明列国行动的动机；“因仇恨”简洁地保留“由于敌意／为了仇恨”的因由意味。
theological_decisions:
- issue: τῶν ἁγίων所指为何
  choice: 圣所
  alternative: 神圣之物；神圣之处；圣者
  rationale: 结合《马加比一书》以圣殿为中心的语境，以及本节将民族、妇女和孩子等受威胁对象并列，最可能指圣所或圣殿区域。原文仍是实词化的中性复数，故以脚注保留其词义歧义，不作教义化限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列国”“圣所”保持经史叙事的庄重感，“聚集起来”“把我们消灭”则避免生硬古奥。脚注标记均紧随相关词语，分别保留τῶν ἁγίων、γυναικῶν及ἔχθρας χάριν的真实词义空间。
