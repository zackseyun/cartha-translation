translation:
  language: zh_hans
  text: 西门听说，特利丰正在集结大批军队，要进入犹大地，把它摧毁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地”。希腊文直译为“犹大地”，可指历史上与犹大相关的地域，而不一定采用后期的行政区名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 这里的简单过去时引出西门所得的消息；“听说”比单独的“听见”更自然地表达获知消息，同时没有增添消息来源等原文未明说的内容。
- source_word: συνῆγεν
  choice: 正在集结
  rationale: 未完成过去时表示当时仍在进行的行动；“正在集结”既保留持续体，也符合军事语境。
- source_word: δύναμιν πολλὴν
  choice: 大批军队
  rationale: δύναμις在这里指军事力量或部队；“大批军队”清楚自然，又不必断定其具体编制。
- source_word: τοῦ ἐλθεῖν
  choice: 准备进入
  rationale: 带冠词的不定式表达目的；结合集结军队的语境，“准备进入”自然传达其意图。ἐλθεῖν的移动目标是犹大地，译作“进入”比机械地译作“来”更符合现代汉语。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 直译为“犹大的土地/地方”，指与犹大相关的地域；“犹大地”保留历史地理称谓，避免直接套用后期行政区名称。
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: 将那里彻底摧毁
  rationale: 第二个带冠词的不定式继续表达目的。ἐκτρίβω语气强烈，含消灭、除尽之意；“彻底摧毁”保留其力度。代词αὐτήν在语法上回指阴性名词γῆν，汉语以“那里”回指该地域更自然。
theological_decisions: []
