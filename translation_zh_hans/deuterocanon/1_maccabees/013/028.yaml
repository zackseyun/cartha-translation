  text: And he set up seven pyramids[a], one opposite the other, for his father and mother and four brothers.
translation:
  language: zh_hans
  text: 他竖立了七座金字塔[a]，一座对着一座，为他的父亲、母亲和四个兄弟而立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金字塔”也可理解为“金字塔形的纪念碑”；原文没有进一步说明其具体形制。
    reason: 说明建筑术语可能指金字塔形的纪念性构筑物，避免读者把其形制理解得过于确定。
lexical_decisions:
- source_word: ἔστησεν
  choice: 竖立了
  rationale: 在建造纪念性建筑的语境中，“竖立”自然地表达把建筑物立起来的具体含义。
- source_word: ἑπτὰ πυραμίδας
  choice: 七座金字塔
  rationale: πυραμίς通常指金字塔；正文采用直接译法，不擅自断定其具体建筑形制，相关可能性在脚注说明。
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: 一座与一座相对
  rationale: 保留原文所表达的相对排列关系，同时采用现代汉语中清楚自然的说法。
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: 为他的父亲、母亲而建
  rationale: 与格在此表示建造或纪念的对象；“他的”依据上下文补出，使汉语指代清楚。
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: 四个兄弟
  rationale: 此处指四名男性手足，译为“兄弟”既准确又不额外限定其长幼。
