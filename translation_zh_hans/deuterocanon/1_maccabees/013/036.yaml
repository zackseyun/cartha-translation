  text: 德米特里王致大祭司西门、众王之友：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里保存的希腊文是类似书信抬头的称呼格式：“德米特里王致大祭司西门、众王之友：”句子在下一节继续。
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: 德米特里王
  rationale: 这是书信抬头中的王号与人名；现代汉语自然采用“人名＋王”，既保留称号，也符合中文表达习惯。
- source_word: Σίμωνι
  choice: 致……西门
  rationale: 与格标明收信人，汉语书信抬头用“致”清楚表达这一关系；人名采用本项目常用译名“西门”。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 准确表达西门的宗教职分；置于人名前作为身份称谓，符合现代汉语习惯。
- source_word: καὶ
  choice: 、
  rationale: 连接同一人的两个并列身份，汉语用顿号比直译为“和”更适合简洁庄重的书信抬头。
- source_word: φίλῳ βασιλέων
  choice: 众王之友
  rationale: 保留 βασιλέων 的复数和宫廷荣衔色彩；“众王之友”比“王室之友”更少解释性，也比“诸王的朋友”更庄重凝练。
