    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: 规定
  rationale: 此处指西门确立一项以后持续遵行的制度；“规定”自然地表达这种制度性设立。
- source_word: κατʼ ἐνιαυτόν
  choice: 每年都要
  rationale: 表达逐年重复，并与“庆祝”结合，清楚呈现年度纪念的惯例。
- source_word: τοῦ ἄγειν τὴν ἡμέραν ταύτην
  choice: 庆祝这一天
  rationale: ἄγω与“日子”连用可指守节或庆祝；此译简明自然，并保留ταύτην的指示意味。
- source_word: προσωχύρωσεν
  choice: 加固了
  rationale: 复合动词含进一步强化防御之意；“加固”比单纯“修筑”更能体现已有设施得到增强。
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: 圣所的山
  rationale: 贴近ὄρος与ἱερόν的基本含义，避免在正文中直接采用带有后世固定称谓色彩的“圣殿山”。
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: 城堡旁边的
  rationale: 正文将ἄκρα按普通名词译为“城堡”，同时以脚注保留其可能是耶路撒冷特定塞琉古堡垒“阿克拉”的解释。
- source_word: ᾤκει
  choice: 住在那里
  rationale: 未完成时态表示持续居住；现代汉语以“住在那里”自然传达这一状态。
- source_word: οἱ παρʼ αὐτοῦ
  choice: 跟随他的人
  rationale: 该短语可泛指与他同在、属于其随从群体的人；此译不具体限定为家属、官员或士兵。
