  text: For this reason all my brothers were destroyed for the sake of Israel, and I alone was left.
translation:
  language: zh_hans
  text: 正因如此，我的兄弟们都因以色列的缘故丧命了，只有我一人被留下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου χάριν
  choice: 正因如此
  rationale: 保留因果承接，并以自然的现代汉语表达前文所述缘由。
- source_word: ἀπώλοντο
  choice: 被杀害
  rationale: 该不及物形式本可泛指“灭亡、丧命”，但这里谈及众兄弟为以色列牺牲的历史处境，“被杀害”既体现其遭难而死，也符合上下文；不采用较含糊的“灭亡”。
- source_word: χάριν τοῦ Ἰσραήλ
  choice: 为以色列
  rationale: 简洁表达“为了以色列、因以色列的缘故”，保留其献身意味而不额外解释。
- source_word: κατελείφθην ἐγὼ μόνος
  choice: 只剩下我一个人
  rationale: 自然体现被动式“我被留下”以及 μόνος 的孤身含义；主语代词的强调通过“我一个人”传达。
theological_decisions:
- issue: 兄弟之死的措辞是否带有主动献身或神学性牺牲含义
  choice: 为以色列而被杀害
  alternative: 为以色列而牺牲了／灭亡了
  rationale: 原文说明他们因以色列而死，却没有使用专指祭献的词；译文保留其为民族而死的意义，同时避免把“牺牲”潜在的祭祀或自愿色彩强加给原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式简洁，保留原文“众兄弟尽亡、唯我独存”的强烈对比。
