  yaml_path: translation/deuterocanon/1_maccabees/013/029.yaml
  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: zh_hans
  text: 他把这些建造成构造物，四周立起高大的柱子；又在柱子上安置全副铠甲，作为永久的纪念；在铠甲旁边还雕刻了船只图案，使所有航行在海上的人都能看见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηχανήματα
  choice: 精巧的构造
  rationale: 此词可指经过设计的装置、构造或工程；结合陵墓建筑语境，译作“精巧的构造”既保留人工设计之意，也避免误解为现代机械。
- source_word: περιθεὶς
  choice: 四周立起
  rationale: 分词含围绕设置之意；“四周立起”自然呈现柱子环列于这些构造周围。
- source_word: πανοπλίας
  choice: 全副铠甲
  rationale: πανοπλία通常指全套武装或全副甲胄；此处是柱上的纪念性陈设，译作“全副铠甲”明确而自然。
- source_word: εἰς ὄνομα αἰώνιον
  choice: 作为永久的纪念
  rationale: 字面涉及“永远的名”，在纪念建筑语境中表达留名、纪念后世；此译承接原意而符合现代汉语。
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: 刻上船只
  rationale: ἐγγεγλυμμένα表示雕刻、刻入的图像；简洁译出船只浮雕或刻像，不限定具体雕刻形式。
- source_word: θεωρεῖσθαι
  choice: 能看见
  rationale: 表示供人观看、清楚可见；与航海者的远眺视角相合。
