  yaml_path: translation/deuterocanon/1_maccabees/013/042.yaml
  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
translation:
  language: zh_hans
  text: 以色列民开始在文书和契约中写道：“西满——伟大的大祭司、统帅和犹太人[a]的领袖——元年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”。希腊语这个族群名称既可泛指犹太人，也可较具体地指犹太地的人民。
    reason: 保留Ἰουδαίων在民族和地域政治含义之间的歧义。
lexical_decisions:
- source_word: ἤρξατο
  choice: 开始
  rationale: 此处表示一种新做法的开端；“开始”自然、准确。
- source_word: ὁ λαὸς Ἰσραήλ
  choice: 以色列民
  rationale: 保留群体称谓，同时符合现代汉语圣经文体。
- source_word: γράφειν ἐν ταῖς συγγραφαῖς καὶ συναλλάγμασιν
  choice: 在文书和契约上写道
  rationale: συγγραφαί指正式文书或记录，συναλλάγματα在此行政语境中指契约；汉语通常说在文书、契约“上”书写。
- source_word: Ἔτους πρώτου ἐπὶ Σίμωνος
  choice: 西满元年
  rationale: 这是纪年格式；“某某元年”以简洁自然的汉语表达由西满执政所开启的第一年。
- source_word: ἀρχιερέως μεγάλου
  choice: 大祭司
  rationale: 希腊语字面含“伟大的大祭司”，但“伟大大祭司”在现代汉语中生硬且可能被误解为两个连续修饰语；“大祭司”是该职衔的固定自然表达。
- source_word: στρατηγοῦ
  choice: 统帅
  rationale: 表示军事统领；“统帅”比现代军衔色彩较强的“将军”更适合古代政治军事语境。
- source_word: ἡγουμένου Ἰουδαίων
  choice: 犹太人领袖
  rationale: ἡγούμενος广义指领导或治理者，不强行限定为特定官职；Ἰουδαῖοι在此首先按民族共同体译为“犹太人”。
theological_decisions:
- issue: Ἰουδαίων指民族群体还是地理政治群体
  choice: 犹太人
  alternative: 犹太地人
  rationale: 此称号可指犹太民族整体，也可能突出犹太地的政治共同体。正文采用现代汉语中更自然且范围较广的“犹太人”，脚注保留地理政治性的可能。
- issue: μεγάλου是否单独译出
  choice: 以固定职衔“大祭司”表达
  alternative: 伟大的大祭司
  rationale: 原文确有μεγάλου，可能具有尊称或强化作用；然而汉语“大祭司”本身是固定职衔，机械增译“伟大的”容易产生并非原文所要求的赞誉意味。此处理不据此建立任何特殊教阶主张。
translation_notes:
  register: 采用现代、庄重而易懂的行政纪年语体。“西满元年”再现公文中的简洁纪年格式；头衔按中文习惯置于姓名前。
