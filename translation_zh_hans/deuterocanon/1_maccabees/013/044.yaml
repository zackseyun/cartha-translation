  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
translation:
  language: zh_hans
  text: 攻城塔里的人出来，进入城中；城里便发生了大骚动[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大动乱”或“大喧闹”；希腊文κίνημα可泛指扰动、骚乱或不安。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήλοντο
  choice: 出来
  rationale: 表达从攻城塔内部向外移动的方向，贴合希腊文的简单叙事语气，不额外推断其动机或行动方式。
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: 攻城塔里的人
  rationale: ἑλέπολις指攻城器械，尤可指攻城塔；此译法既符合军事语境，也便于现代普通读者理解。
- source_word: εἰς τὴν πόλιν
  choice: 进入城中
  rationale: 保留εἰς所表示的趋向与进入之意；“城中”自然表达其目的地。
- source_word: κίνημα μέγα
  choice: 大骚动
  rationale: κίνημα在此表示广义的扰动、骚乱或不安；“大骚动”保留语义宽度，不把事件过度具体化为暴动或叛乱。
- source_word: ἐγένετο
  choice: 发生了
  rationale: 符合γίνομαι在叙事中引入事件或局面的常见用法，现代汉语表达自然。
