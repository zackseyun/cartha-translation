base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/003.yaml
  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: zh_hans
  text: 他鼓励他们，对他们说：“你们自己知道，我和我的兄弟们以及我父家为律法和圣物[a]所做的一切，以及战争和困苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”或可指“圣所”。希腊文直译为“神圣之物”，也可能较广泛地包括圣所及其他神圣事务。
    reason: 保留 τῶν ἁγίων 的词义范围及“圣所”这一可能理解。
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: 鼓励
  rationale: 此处西门是在召聚并坚定众人；“鼓励”自然表达支持、振奋之意，同时不把语气过度限定为正式劝诫或安慰。
- source_word: Αὐτοὶ οἴδατε
  choice: 你们自己知道
  rationale: 保留显式代词 αὐτοὶ 所带的强调，比单说“你们知道”更贴近原文。
- source_word: οἶκος τοῦ πατρός μου
  choice: 我父家
  rationale: 这是指父系家族或家门的惯用表达；“我父家”既保留原文意象，也符合庄重的现代汉语。
- source_word: περὶ τῶν νόμων καὶ τῶν ἁγίων
  choice: 为众律法和圣物
  rationale: περί 在此表示所维护、所效力的对象；νόμων 为复数，译作“众律法”；τῶν ἁγίων 是中性复数实体化用法，保留为范围较广的“圣物”，不径自缩窄为圣所。
- source_word: ἐποιήσαμεν
  choice: 所做的一切
  rationale: ποιέω 含义宽泛；结合 ὅσα，译作“所做的一切”清楚而自然。
- source_word: τοὺς πολέμους καὶ τὰς στενοχωρίας
  choice: 我们经历的战争和困苦
  rationale: 这两个宾格名词与前面的 ὅσα 从句并列，属于众人所知道的内容；汉语补出“我们经历的”，使省略关系清楚，但不把它们误作“所做”的对象。στενοχωρία 在此指受压迫时的困苦、艰难。
theological_decisions:
- issue: τῶν ἁγίων 的所指范围
  choice: 圣物
  alternative: 圣所；神圣之事
  rationale: 希腊文使用中性复数实体化形式，可能涵盖圣所、礼仪及其他分别为圣之物。正文采用较宽泛的“圣物”，脚注说明“圣所”这一可能所指，以保留原文歧义。
- issue: “战争和困苦”与句中动词的关系
  choice: 作为“知道”的并列内容，译为“也知道我们经历的战争和困苦”
  alternative: 把它们接在“所做的一切”之后，形成“所做的一切，以及战争和困苦”
  rationale: 原文格位和省略结构允许简练并列，但现代汉语若直译容易把战争、困苦都理解为“做”的宾语。补出“也知道我们经历的”旨在显明句法意义，不赋予额外的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我父家”保留古代家族表达；“众律法”体现希腊文复数。“我们经历的”是为汉语句法清晰所作的最小补足。
