  text: And he gathered all the fighting men, and hastened to finish the walls of Jerusalem, and fortified it all around.
translation:
  language: zh_hans
  text: 他召集了所有作战的男子，加紧修完耶路撒冷的城墙，又在城的四周加以设防。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: 召集了
  rationale: 此处指为军事事务把人员集合起来；“召集”自然、准确，并保留主动组织的意味。
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: 所有能征战的男子
  rationale: 原文同时使用“男子”和表征战者的词，明确具有男性和军事含义；译文保留这两层信息，又避免较古雅的“战士”可能带来的身份固化。
- source_word: ἐτάχυνεν
  choice: 赶紧
  rationale: 表达迅速采取行动、加快完成工程的紧迫感，符合现代汉语叙事习惯。
- source_word: τοῦ τελέσαι
  choice: 修完
  rationale: τελέσαι表示完成；结合宾语“城墙”，汉语用“修完”既体现完工，也自然补足建筑语境。
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: 耶路撒冷的城墙
  rationale: 直接体现属格关系，并清楚指向城市防御工事。
- source_word: ὠχύρωσεν
  choice: 加固了
  rationale: 该动词在军事语境中指使城邑坚固、可防守；“加固”与城墙工程衔接自然，也保留防御含义。
- source_word: αὐτὴν κυκλόθεν
  choice: 城的四周
  rationale: 阴性代词回指耶路撒冷；汉语明确译为“城”可避免代词指向不清，κυκλόθεν则译作“四周”，表达环绕全城。
theological_decisions:
- issue: 军事人员的性别指称
  choice: 所有能征战的男子
  alternative: 所有战士／所有士兵
  rationale: 希腊文明确使用ἄνδρας（男子），并以πολεμιστάς说明其作战角色；译文不将其泛化为性别不明的群体。
translation_notes:
  register: 采用现代、庄重而明白的叙事语言。“赶紧”传达行动的紧迫性；“修完……城墙，又加固了城的四周”使连续的筑城与设防行动在汉语中清晰顺畅。
