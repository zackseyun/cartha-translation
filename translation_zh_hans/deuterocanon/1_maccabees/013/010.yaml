- from: 他召集了所有能征战的男子，赶紧修完耶路撒冷的城墙，又加固了城的四周。
  to: 他召集了所有作战的男子，加紧修完耶路撒冷的城墙，又在城的四周加以设防。
  rationale: 将末句改为“又在城的四周加以设防”，准确保留“使耶路撒冷城在周围得到防卫”的对象与范围，避免把“四周”误作被加固的对象；并以“加紧”取代较口语化的“赶紧”，保持现代而庄重的叙事语体。其余措辞保留原文的军事性、男性指称及完成筑城工程的意义。
