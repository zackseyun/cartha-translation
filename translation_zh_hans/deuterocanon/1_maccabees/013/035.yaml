lexical_decisions:
- source_word: ἀπέστειλεν αὐτῷ
  choice: 派人到他那里
  rationale: 希腊文直译为“差遣到他那里”，未明说所差遣的人或物；中文补出“人”，使叙事自然，同时不把该动词与后面的“答复”合并。
- source_word: Δημήτριος ὁ βασιλεύς
  choice: 德米特里王
  rationale: 采用现代中文自然的姓名加王号次序，准确保留人物身份。
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照这些话
  rationale: 贴近希腊文“按照这些话”，并保留它可能指前述话语或此次传话内容的开放性。
- source_word: ἀπεκρίθη αὐτῷ
  choice: 答复了他
  rationale: 直接对应“回答他”，不因书信语境而将其与“写信”合并。
- source_word: ἔγραψεν αὐτῷ ἐπιστολὴν τοιαύτην
  choice: 给他写了这样一封信
  rationale: 以自然中文引出下文的信件正文，并完整表达收信对象。
