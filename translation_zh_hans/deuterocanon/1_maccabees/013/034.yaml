  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: zh_hans
  text: 西满选了一些人，派他们去见德默特琉王，为这地求得减免[a]；因为特黎丰所做的一切都是掠夺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为这地求得豁免”或“使这地获得释放”。原文可指释放、豁免或减免；这里很可能涉及行政或财政事务，但没有说明具体减免什么项目。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: 选了
  rationale: 中间语态在此表示挑选；“选了”简洁自然。
- source_word: ἄνδρας
  choice: 几个人
  rationale: 原文是不定复数“男人”；汉语叙事中“几个人”自然表达一组被选出的男性使者，不把未明说的身份写入正文。
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: 派他们到德默特琉王那里
  rationale: 承接前句补出汉语所需的代词“他们”；王号与人名合并表达，符合现代汉语。
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: 请王免除这片土地的负担
  rationale: ἄφεσις可指释放、豁免或减免；此处处于政治财政语境，“免除……负担”传达行政性减免，同时不把具体项目限定为税款。
- source_word: χώρᾳ
  choice: 这片土地
  rationale: χώρα指土地、地区或疆域；“这片土地”保留地理政治含义。
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: 特律丰所做的一切
  rationale: 用自然汉语涵盖其全部行为，比逐字译作“所有行为”更流畅。
- source_word: ἦσαν ἁρπασίαι
  choice: 都是掠夺
  rationale: ἁρπασίαι指抢夺、劫掠；“都是掠夺”保留复数行为的概括性和谴责意味。
