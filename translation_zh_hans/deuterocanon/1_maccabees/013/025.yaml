  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
translation:
  language: zh_hans
  text: 西门派人去取回他兄弟约拿单的骸骨，并把他安葬在摩代因——他祖先的城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他祖先的城”直译为“他父辈的城”；也可译作“他的祖城”。
    reason: 说明原文πατέρων的字面表达，并保留αὐτοῦ的单数所属。
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派人去
  rationale: 希腊文只明说“差派”，未交代所派对象；现代汉语若单说“派去”不够自然，因此以“派人去”表达语境中隐含的执行者，但不增添其身份或人数。
- source_word: ἔλαβεν
  choice: 取回
  rationale: 基本义是“取、拿”；在此语境中，西门差人从别处取得约拿单的遗骨，“取回”最自然，也没有额外说明具体过程。
- source_word: τὰ ὀστᾶ
  choice: 骸骨
  rationale: 原文直指“骨头”；“骸骨”在安葬语境中准确、庄重，并比“遗体”更贴近原文。
- source_word: Ἰωναθὰν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: 他兄弟
  rationale: 直接保留亲属关系；现代汉语不必另加“亲”或“自己的”等原文没有的强调。
- source_word: ἔθαψεν αὐτὸν
  choice: 把他安葬
  rationale: 代词为阳性单数，回指约拿单本人，而不是中性复数的“骸骨”；中文以“把他安葬”保留这一指称转换。
- source_word: ἐν Μωδεεὶμ
  choice: 在……摩代因
  rationale: ἐν表示安葬地点；“摩代因”按希腊文地名形式音译。
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: 他们祖先的城
  rationale: πατέρων字面为“父辈”，此处指历代祖先；αὐτοῦ在上下文中可理解为约拿单所属家族。中文用“他们祖先”自然表明这也是兄弟二人的祖籍之城，避免误读为只属于约拿单个人。
