  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: zh_hans
  text: 西门在他父亲和兄弟们的坟墓上建了一座纪念碑，又把它修得高耸醒目[a]；前后都用了凿修过的石料[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它从外观看来高耸。”希腊语短语既可指视觉上显得高大，也可指建筑醒目、引人注目。
    reason: lexical_alternative
  - marker: b
    text: 或译：“磨光的石料。”原词可指经过刮削、凿修或细致加工的石头。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: 建了一座陵墓
  rationale: 该动词通常意为“建造”。原文的宾语从后续代词及上下文补出；译作“一座陵墓”能自然表达这是建在坟墓之上的纪念性建筑，同时不把它误解为另造坟穴。
- source_word: ἐπὶ τὸν τάφον
  choice: 在……的坟墓上
  rationale: ἐπί加宾格在此表示建造物位于坟墓之上；“在……上”保留其空间关系。
- source_word: ὕψωσεν αὐτόν
  choice: 把它修得高耸
  rationale: ὑψόω表示使之升高或高耸；“修得高耸”在建筑语境中自然，并保留实体高度的含义。
- source_word: τῇ ὁράσει
  choice: 醒目
  rationale: 该与格短语关乎视觉或外观；“醒目”表达建筑高耸而引人注目的效果，同时脚注保留较直译的可能。
- source_word: λίθῳ ξυστῷ
  choice: 用凿平的石料砌成
  rationale: ξυστός指经刮削、凿修而平整的石头；“凿平的石料”准确而通俗，不额外断定表面已经磨光。
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: 前后两面
  rationale: 这组对称表达指建筑的后面和前面；汉语按“前后”的自然次序表达，不改变两面均经石料修筑的意思。
