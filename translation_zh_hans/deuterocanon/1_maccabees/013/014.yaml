  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: zh_hans
  text: 特利丰得知，西门已兴起，接替了自己兄弟约拿单的位置[a]，并且将要同特利丰交战[b]；于是派使者到西门那里，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西门已兴起，代替了自己的兄弟约拿单。”希腊语可指一个人兴起，承接另一人的位置。
    reason: lexical_alternative
  - marker: b
    text: 或译：“将要向他开战”或“将要同他投入战斗”。原文是指进入武装冲突的习惯表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: 得知
  rationale: 此处不定过去时表示特利丰获知了这一情况；“得知”既体现动态含义，也符合现代汉语叙事。
- source_word: ἀνέστη
  choice: 已经起来
  rationale: 保留“起来”的源语意象；结合ἀντί短语，语境表明西门是起来承担约拿单的位置，而非单指身体起立。
- source_word: ἀντὶ Ἰωνάθου τοῦ ἀδελφοῦ αὐτοῦ
  choice: 接替了他哥哥约拿单
  rationale: ἀντί表示替代或继任；“接替”自然地表达政治、军事领导权的承接，而“他哥哥约拿单”保留亲属关系。
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: 与他交战
  rationale: 该表达是进入武装冲突的习语；“与他交战”简洁自然，并保留相互敌对的军事含义。
- source_word: μέλλει
  choice: 将要
  rationale: 表达临近或预期发生的行动，不额外断定这是已经落实的意图。
- source_word: ἀπέστειλεν πρὸς αὐτὸν πρέσβεις
  choice: 派使者到西门那里
  rationale: πρέσβεις指受派交涉的代表；“使者”在中文历史叙事中自然且庄重。为避免连续代词所指不清，将目的对象明示为“西门”。
- source_word: λέγων
  choice: 说：
  rationale: 该分词引出下一节的信息内容；以冒号保持句意向后延续。
