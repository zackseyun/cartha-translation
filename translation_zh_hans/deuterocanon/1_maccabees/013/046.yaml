  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: zh_hans
  text: 他们说：“不要按我们的恶行对待我们，却要按你的怜悯待我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: 不要……对待我们
  rationale: χράομαι在此与间接受格和κατά短语连用，表示以某种方式待人；译作“对待我们”自然、准确，也保留直接恳求的语气。
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: 按我们的恶行
  rationale: πονηρία的复数在这里指具体的邪恶行为或种种恶事；“恶行”既体现复数所含的行为层面，也符合现代汉语表达。
- source_word: κατὰ τὸ ἔλεός σου
  choice: 按你的怜悯
  rationale: ἔλεος指怜悯、慈悲；“怜悯”直接表达宽恕有罪者、不按其所当受的惩罚待他的含义，并保留经文中与“恶行”的鲜明对照。
theological_decisions:
- issue: 人的恶行与对方怜悯之间的恳求性对照
  choice: 直译为“不按我们的恶行……却按你的怜悯”
  alternative: 不照我们所做的恶事报应我们，只照你的慈悲待我们
  rationale: 原文只是恳求对方不要按其恶行处置，而要按怜悯相待；译文不增添“报应”、盟约或其他原文未明说的神学概念，也不把受话者擅自明确为上帝。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却要”清楚呈现ἀλλά的转折；后半句补出“待我们”，是汉语为避免残缺而作的必要承接，并未增加新的语义。
