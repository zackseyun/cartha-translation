  yaml_path: translation/deuterocanon/1_maccabees/008/032.yaml
  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: zh_hans
  text: 因此，如果他们仍控告你，我们必对他们施行审判，并必在海上和陆地同你交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“同你交战”。按上下文，这里可能意为“为你作战”，或反映传承文本的措辞存在疑难。
    reason: 文本疑难
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: 所以，如果……还
  rationale: ἐὰν引出条件，οὖν承接上文，ἔτι表示持续或再次发生；合译既保留逻辑衔接，也符合现代汉语表达。
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: 他们控告你
  rationale: ἐντυγχάνω与κατά连用，在此表示向权力机构提出敌对的申诉或控告，而非直接发动武力攻击。
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: 我们就要对他们施行审判
  rationale: ποιεῖν κρίσιν在此指实施司法裁断；“施行审判”保留正式、权威的语气，也不把κρίσις过窄地限定为某一种具体刑罚。
- source_word: πολεμήσομέν σε
  choice: 与你交战
  rationale: 现存希腊文本以第二人称单数宾格σε为πολεμήσομεν的对象，直译为“与你交战”；虽与上下文的援助承诺显得冲突，正文仍忠实保留该措辞。
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: 从海上和陆上
  rationale: 这是军事语境中表示海陆两方面行动的惯用搭配；“从海上和陆上”自然且保留原文的对称结构。
theological_decisions:
- issue: 末句交战对象与上下文似有冲突
  choice: 正文译作“与你交战”
  alternative: “为你作战”或“与他们交战”
  rationale: 希腊文本明确作σε（“你”），并非αὐτούς（“他们”）。上下文似乎预期罗马人承诺援助犹太人，但不宜据此无标记地改写现存文本，因此保留字面对象，并以脚注说明语境上的困难。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“施行审判”保留外交文书的正式语域；末句不擅自修正希腊文本，并用脚注呈现真实的文本与语境张力。
