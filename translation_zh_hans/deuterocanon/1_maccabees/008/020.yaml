base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: zh_hans
  text: 又称马加比的犹大、他的弟兄和犹太民众派我们到你们这里来，要与你们建立同盟与和平关系，并把我们登记为你们的盟友和朋友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “登记”也可译作“记载”或“写入名册”；希腊文很可能是指在正式外交记录中列名。
    reason: 说明 γραφῆναι 在本节外交语境中的行政含义及可保留的词义幅度。
lexical_decisions:
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用现代汉语圣经及第二圣殿时期人物常用的译名，直接对应希腊文人名。
- source_word: ὁ καὶ Μακκαβαῖος
  choice: 又称马加比的
  rationale: ὁ καὶ 加专名表示别名或称号；此译法在汉语中自然地保留其同位说明作用。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的弟兄
  rationale: 上下文指犹大的男性手足；“弟兄”庄重而易懂，不泛化为非亲属群体。
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: 犹太民众
  rationale: πλῆθος表示人数众多的群体；“民众”保留集合意义，又不把它限定为正式议会或机构。
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: 派我们到你们这里来
  rationale: 准确表达派遣、受派者和目的地，符合汉语使节陈述的自然语序。
- source_word: στῆσαι μεθ' ὑμῶν
  choice: 要与你们建立
  rationale: στῆσαι在外交语境中指确立某种关系；“建立”兼顾正式语气与现代可读性。
- source_word: συμμαχίαν καὶ εἰρήνην
  choice: 同盟与和平关系
  rationale: 分别保留“同盟”和“和平”两个概念；补出“关系”使现代汉语通顺，但不增译为原文未明说的具体条约。
- source_word: γραφῆναι ἡμᾶς
  choice: 把我们登记为
  rationale: 被动不定式在此很可能涉及正式外交名册或文书中的登记；“登记为”清楚呈现其行政性质。
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: 你们的盟友和朋友
  rationale: 保留古代外交措辞中并列的两种关系，不把 φίλους具体化为“友邦”等原文未明确表达的政治实体。
