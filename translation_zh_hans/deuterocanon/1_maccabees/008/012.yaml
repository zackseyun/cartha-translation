  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: zh_hans
  text: 但他们与自己的盟友[a]，以及那些倚靠他们的人，保持友好关系；他们掌控了远近的诸王国；凡听见他们名声[b]的，都惧怕他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盟友”或译“朋友”；希腊文 φίλοι 既可指私人朋友，也可指政治上的友邦或盟友，本段外交语境较支持“盟友”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“听见他们的名字”；这里的“名字”可指声名或威名。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: 但他们与
  rationale: δέ承接上文，同时带有轻微的转折或推进意味；“但”在本节语境中简洁自然。
- source_word: τῶν φίλων αὐτῶν
  choice: 自己的盟友
  rationale: φίλοι既可指朋友，也可指政治上的友邦或盟友；本段论述罗马对外关系，故“盟友”更合语境，同时以脚注保留另一可能。
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: 那些倚靠他们的人
  rationale: ἐπαναπαύομαι在此表示把信赖或依靠放在某人身上；“倚靠”既贴近原意，也符合现代汉语表达。
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: 保持友好关系
  rationale: συντηρέω表示维持、保全，φιλία在外交语境中指友好关系；此译自然且不把关系过度限定为正式同盟。
- source_word: κατεκράτησαν
  choice: 制伏了
  rationale: κατακρατέω表示压倒、掌控或取得支配权；“制伏”保留武力或政治压服的力度，又不暗示正式称王。
- source_word: τῶν βασιλειῶν τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: 远近各国
  rationale: 原文直指近处和远处的诸王国；“远近各国”以简洁自然的汉语保留这一涵盖全面的地理表达。
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: 凡听见他们名声的
  rationale: 字面为“凡听见他们名字的”，其中“名字”在语境中指声名或威名；正文用“名声”传达习语意义，脚注说明直译。
- source_word: ἐφοβοῦντο αὐτούς
  choice: 都惧怕他们
  rationale: φοβέομαι在此表示因罗马势力而害怕；“惧怕”直接而庄重。
