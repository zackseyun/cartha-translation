base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/011.yaml
  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: zh_hans
  text: '他们奴役那些人，直到今日[a]。至于其余的王国和海岛，凡曾反抗他们的，他们都予以摧毁[b]，使其成为自己的奴隶。


    [a] 或译：“直至今日。”原文表示这种情形一直延续到作者当时。


    [b] “摧毁”也可译作“毁坏”或“使荒废”；希腊语原词可指严重的毁灭和破坏，不一定表示彻底消灭。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直至今日。”原文表示这种情形一直延续到作者当时。
    reason: 说明时间短语ἕως τῆς ἡμέρας ταύτης的惯用和持续含义。
  - marker: b
    text: “摧毁”也可译作“毁坏”或“使荒废”；希腊语原词可指严重的毁灭和破坏，不一定表示彻底消灭。
    reason: 保留κατέφθειραν的词义范围，并说明其与后续奴役叙述之间的张力。
lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: 奴役
  rationale: καταδουλόω表示使人陷入奴隶地位或完全受制；“奴役”保留了原词强烈的奴隶含义，而没有弱化为一般的“征服”或“使臣服”。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今日
  rationale: 这是表示某种状态延续到作者所处时代的惯用语；“直到今日”自然且保留其持续意味。
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: 其余的王国
  rationale: ἐπίλοιπος意为剩余的、其余的；此处承接上文所列对象，译作“其余的王国”准确清楚。
- source_word: τὰς νήσους
  choice: 海岛
  rationale: νήσος通常指岛屿；在列举政治军事征服对象的语境中，“海岛”比单说“岛”更自然，且未扩写为原文没有明说的“岛屿领地”。
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: 凡曾反抗他们的
  rationale: ὅσοι与ποτέ共同形成不定而广泛的表述，涵盖所有曾经起来抵抗罗马的对象；此译保留了这种概括性。
- source_word: κατέφθειραν
  choice: 摧毁
  rationale: καταφθείρω在此军事语境中表示毁灭、严重破坏；“摧毁”保留其力度，同时脚注说明其未必指彻底消灭。
- source_word: ἐδούλωσαν αὐτοῖς
  choice: 使其成为自己的奴隶
  rationale: δουλόω明确涉及奴役，αὐτοῖς表明这些对象被置于他们之下；“自己的”自然呈现了这种归属于征服者的关系。
theological_decisions:
- issue: 政治军事语境中的奴隶用语
  choice: 采用“奴役”和“使其成为自己的奴隶”
  alternative: 使其臣服；征服；使其受辖制
  rationale: δουλόω词族在本节强调的并非一般政治从属，而是如奴隶般被支配的严酷状态。直译其奴隶含义可避免淡化罗马统治的暴力程度，同时不引入额外的宗派解释。
- issue: “摧毁”与随后“奴役”之间可能存在的张力
  choice: 正文保留“摧毁”，脚注说明可指严重毁坏而非必然彻底消灭
  alternative: 毁坏；使荒废；败坏
  rationale: 原文先用καταφθείρω，随后又说将其奴役；译文不应为消除两者的表面张力而擅自弱化前一动词。脚注保留该词在此处可能具有的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“至于……凡……的，他们都……”保留原文列举后再概括处理的结构；“自己的奴隶”比生硬的“奴役给他们”更符合现代汉语，同时呈现希腊语与格αὐτοῖς所表达的归属关系。
