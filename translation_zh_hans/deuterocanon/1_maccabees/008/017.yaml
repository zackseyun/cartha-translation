  yaml_path: translation/deuterocanon/1_maccabees/008/017.yaml
  text: And Judas chose Eupolemus son of John[a], the son of Accos, and Jason son of Eleazar, and sent them to Rome to establish friendship and alliance with them,
translation:
  language: zh_hans
  text: 犹大选了约翰的儿子欧波勒慕[a]和以利亚撒的儿子雅孙，派他们到罗马去，与罗马人建立友好关系和同盟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“阿科斯的约翰的儿子欧波勒慕”，即把末尾的属格直接与“约翰”相连；主文则按它继续构成父名链、即约翰为阿科斯之子来理解。
    reason: 原文τοῦ Ἀκχώς的句法归属存在真实歧义；脚注保留此歧义，避免把“阿科斯”未经依据确定为地域称谓。
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: 选了
  rationale: 直接表达选择之意，符合叙事语境，也不额外赋予正式任命的含义。
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 在使节出访的语境中，“派……去”比单纯“送”更自然准确。
- source_word: στῆσαι
  choice: 建立……，缔结……
  rationale: 不定式表示差遣的目的；按两个并列宾语分别采用现代汉语常见搭配，使外交语境自然清楚。
- source_word: φιλίαν
  choice: 友好关系
  rationale: 此处是外交语境，指群体之间正式的友好关系；比日常人际意义较强的“友谊”更贴切。
- source_word: συμμαχίαν
  choice: 同盟
  rationale: 保留政治或军事结盟的含义，但不擅自限定为军事同盟。
- source_word: τοῦ Ἀκχώς
  choice: 约翰是阿科斯的儿子
  rationale: 将其理解为继续说明家系，即欧波勒慕是约翰之子、约翰是阿科斯之子；用括注式句法使现代汉语清晰。
- source_word: αὐτοῖς
  choice: 与罗马人
  rationale: 代词所指为前文的罗马方面；在汉语中明示所指可避免歧义，“与”准确表达关系性的与格。
