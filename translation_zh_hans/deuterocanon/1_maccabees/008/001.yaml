lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说了
  rationale: 这里指犹大听到有关罗马人的消息；现代汉语用“听说”比单用“听见”更自然准确。
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  choice: 罗马人的名声
  rationale: ὄνομα字面是“名字”，此处按语境指传闻中的声望或名声；正文译出习语含义，脚注保留字面表达。
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: 实力强大
  rationale: 原文以近义词叠加强调力量；“实力强大”在现代汉语中自然，并保留强调意味。
- source_word: εὐδοκοῦσιν
  choice: 以善意相待
  rationale: 此处描述罗马人对归附者的有利态度和待遇，不仅是内心喜悦；该译法保留关系性而不预先限定具体政治制度。
- source_word: τοῖς προστεθειμένοις αὐτοῖς
  choice: 凡归附他们的人
  rationale: 分词表示加入、依附或站到罗马一方的人。“归附”适合政治语境，同时没有像“结盟”那样过度明确。
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: 凡前来投奔他们的人
  rationale: 原文是开放性的泛指，并含接近、前往之意；“前来投奔”在上下文中自然表达寻求罗马支持的动作。
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: 都能与他们结为友好
  rationale: φιλία可指友好关系，在政治语境中也可能包含正式邦交或联盟。“结为友好”保留其外交色彩及语义弹性。
