  yaml_path: translation/deuterocanon/1_maccabees/008/002.yaml
  text: and that they are mighty in strength[a]. They told him about their wars and the brave deeds they did among the Galatians[b], and that they had subdued them and brought them under tribute.
translation:
  language: zh_hans
  text: 又听说他们兵力强大。有人向他讲述了他们的战争，以及他们在加拉太人中所行的英勇事迹[a]，还说他们已经征服加拉太人，使他们纳贡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在加拉太人中”也可理解为“在加拉太地区”；原文没有明确说这些英勇事迹是“针对”加拉太人而行的。
    reason: 保留ἐν τοῖς Γαλάταις在对象与地域之间的真实歧义，避免正文作过度解释。
lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  choice: 兵力强大
  rationale: 原文以近义表达叠加强调力量；结合上下文的军事语境，译为“兵力强大”自然、明确，又保留强调意味。
- source_word: διηγήσαντο
  choice: 人们向他讲述了
  rationale: 该动词指详述、叙说；希腊文未明说主语身份，中文补出泛指的“人们”以构成自然句子，但不具体认定讲述者。
- source_word: τοὺς πολέμους αὐτῶν
  choice: 他们的战争
  rationale: 保留复数及宽泛意义，不窄化为个别战役或军事行动。
- source_word: τὰς ἀνδραγαθίας
  choice: 英勇事迹
  rationale: 该词指勇武、英勇的作为；“英勇事迹”符合现代中文庄重叙事语体，也避免照搬带有古旧性别色彩的字面表达。
- source_word: ἃς ποιοῦσιν ἐν τοῖς Γαλάταις
  choice: 他们在加拉太人中所行的
  rationale: 尽量保留介词ἐν的“在……中”及现在时形式所带的一般性表达，不擅自改译为“攻打加拉太人”或限定为加拉太地区。
- source_word: κατεκράτησαν αὐτῶν
  choice: 他们已经征服加拉太人
  rationale: 动词表示压倒、控制或制伏；“征服”切合军事政治语境。为避免中文代词连续造成指代含混，将αὐτῶν明确复现为“加拉太人”。
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: 使他们纳贡
  rationale: 该表达指使人处于贡赋之下；“使他们纳贡”简洁自然，并保留政治臣服及贡赋义。
