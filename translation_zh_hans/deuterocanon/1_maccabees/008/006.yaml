  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: zh_hans
  text: 还有亚细亚的大王安条克。他带着一百二十头战象、骑兵、战车和一支极其庞大的军队，前来与他们交战，却被他们击溃了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίοχον
  choice: 安条克
  rationale: 采用现代中文圣经及历史文献中通行的人名译法。
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: 亚细亚的大王
  rationale: 保留同位语式王号，并以“大王”自然、直接地表达 μέγαν βασιλέα；“亚细亚”保留古代地域名称的历史语境。
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: 前来与他们交战
  rationale: 表达 πορεύομαι 所指的军事行动及 ἐπʼ αὐτούς 的敌对方向，中文行文自然。
- source_word: ἔχοντα
  choice: 带着
  rationale: 在军事出征语境中，“带着”比直译“有”更自然，同时不额外断定这些兵力的具体编制。
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: 一百二十头战象
  rationale: 数字按原文直译；语境明确属于军事装备，译作“战象”比单说“大象”准确。
- source_word: ἵππον
  choice: 骑兵
  rationale: 原词虽为单数形式，但在军力清单中作集合名词，指骑兵部队。
- source_word: ἅρματα
  choice: 战车
  rationale: 采用该军事名词在现代中文中的标准译法。
- source_word: δύναμιν πολλὴν σφόδρα
  choice: 一支极其庞大的军队
  rationale: δύναμις 在此指军事力量；“极其庞大”充分体现 πολλὴν σφόδρα 的加强语气。
- source_word: συνετρίβη ἀπʼ αὐτῶν
  choice: 却被他们击溃了
  rationale: “击溃”保留 συντρίβω 强于一般“打败”的力度，并明确表达 ἀπʼ αὐτῶν 所标示的施事者。
