- from: 他们为自己设立了一个议事会；每天有三百二十人议事，不断为民众商议，好使他们秩序井然。[a]
  to: 他们为自己设立了一个议事会；每天有三百二十人议事，不断就民众的事务商议，以使自身保持良好秩序。[a]
  rationale: 修正介词 περὶ 的关系，译为“就……的事务”而非“为……”。末句以“自身”对应反身代词，并以“保持良好秩序”表达 εὐκοσμεῖν 的妥善安排、秩序良好之义；脚注保留必要的解释余地，但避免将“民众整体”说成反身代词同等直接的语法所指。
