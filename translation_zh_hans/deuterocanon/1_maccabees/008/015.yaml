  yaml_path: translation/deuterocanon/1_maccabees/008/015.yaml
  text: And they established a council for themselves, and every day three hundred and twenty would deliberate, continually taking counsel concerning the multitude, to govern themselves well.
translation:
  language: zh_hans
  text: 他们为自己设立了一个议事会；每天有三百二十人议事，不断就民众的事务商议，以使自身保持良好秩序。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保持良好秩序”也可译作“妥善安排自身”或“使自身井然有序”。原文的反身代词直接回指议事、商议的主体；在全句的政治语境中，“自身”所涵盖的群体范围可有不同理解。
    reason: 词义与指代说明
lexical_decisions:
- source_word: βουλευτήριον
  choice: 议事会
  rationale: 此词可指议事机构或其会所；上下文着重其成员每日议事，故译作现代读者易懂的“议事会”，不擅自限定为罗马元老院。
- source_word: ἐποίησαν ἑαυτοῖς
  choice: 为自己设立了
  rationale: 按字面为“为自己做了”，用于制度语境时自然表示设立一个机构。
- source_word: καθ' ἡμέραν ἐβουλεύοντο
  choice: 每天……议事
  rationale: 保留“每天”的时间意义，并以“议事”表达未完成时所呈现的惯常、反复行动。
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: 三百二十人
  rationale: 直接翻译数词，并补出汉语所需的量词。
- source_word: βουλευόμενοι διὰ παντός
  choice: 不断……商议
  rationale: 表达分词的持续性以及 διὰ παντός 的连续、经常之意，同时避免与前一“议事”完全重复。
- source_word: περὶ τοῦ πλήθους
  choice: 为民众
  rationale: πλῆθος 在此指人民整体；介词 περὶ 基本义为“关于”，但在治理语境中可自然表达为“为民众的事务”。
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: 好使他们秩序井然
  rationale: εὐκοσμεῖν 表示妥善安排、维持良好秩序；采用较贴近原词的“秩序井然”，保留反身代词可能回指民众或议事者自身的歧义，避免直接强化为“治理”。
