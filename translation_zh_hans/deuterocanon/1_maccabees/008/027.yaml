  naturalness: “同样”“犹太民族”“与他们并肩作战”均自然且适合庄重的条约语体。“全心”可用，但置于动词前略显生硬，改为“全心全意地”更符合现代汉语。“照当时的情势所指示的去做”自然清楚。
  terminology: “犹太民族”恰当对应 ἔθνος Ἰουδαίων，未误作“外邦人”。“并肩作战”在此军事同盟语境中充分表达 συμμαχήσουσιν。“全心全意地”对应 ἐκ ψυχῆς，不额外加强神学或教派含义。
