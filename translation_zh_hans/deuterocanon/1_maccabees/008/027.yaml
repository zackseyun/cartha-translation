base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/027.yaml
  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: zh_hans
  text: 同样，如果战争先临到犹太民族，罗马人必全心全意地与他们并肩作战，照当时的情势所指示的去做。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全心全意地”也可译作“尽心尽力地”或“全力以赴地”。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾也可译作“按当时情势向他们所规定的去做”或“随时势所要求的去做”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: 同样
  rationale: 这是承接上文互惠条款的过渡语；“同样”自然保留了“按同样方式”的比较意味。
- source_word: ἔθνει Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος在此指一个民族或国族共同体；此译法简洁贴近原文，又不把它误解为“外邦人”。
- source_word: συμβῇ προτέρῳ πόλεμος
  choice: 战争先临到
  rationale: ἐὰν加虚拟式表达未定条件；προτέρῳ表明时间上的优先，即战争先临到犹太民族。
- source_word: συμμαχήσουσιν
  choice: 与他们并肩作战
  rationale: 该动词表示作为盟友提供军事援助，不仅是抽象地缔结同盟；在战争语境中，“并肩作战”清楚而自然。
- source_word: ἐκ ψυχῆς
  choice: 全心
  rationale: 该短语表示全心投入、诚心尽力；“全心”保留原文以“心/生命”表达投入程度的色彩，也符合庄重的盟约语体。
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: 照时势向他们所指明的行事
  rationale: καιρός在此是适当的时机或具体情势，ὑπογράφῃ可指示、规定或勾画应做之事；此译保留了援助方式由当时情势决定的开放性。
