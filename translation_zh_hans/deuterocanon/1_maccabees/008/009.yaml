  text: and that those from Greece had planned to come and remove them,[a]
translation:
  language: zh_hans
  text: 又听说从希腊来的人曾谋划前来除掉他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“消灭他们”或“把他们铲除”；这个希腊语动词可指以武力彻底清除，正文译作“除掉”，以保留其较宽的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἑλλάδος
  choice: 从希腊来的人
  rationale: 贴近原文“出自希腊的人”，不把所指范围直接解释为所有希腊人；现代汉语中也自然清楚。
- source_word: ἐβουλεύσαντο
  choice: 曾谋划
  rationale: 表达经过商议而形成计划的含义；“谋划”符合敌对语境，但不像“密谋”那样额外强调秘密或阴险。
- source_word: ἐλθεῖν
  choice: 前来
  rationale: 直接体现不定式“来”的方向，并与后续行动自然衔接。
- source_word: ἐξᾶραι
  choice: 除掉
  rationale: 该动词基本义为移走、除去，在军事政治语境中可含消灭之意；“除掉”保留强制清除的力度，同时没有明确断定是彻底灭绝。
- source_word: αὐτούς
  choice: 他们
  rationale: 按原文使用第三人称复数宾格代词，所指由上下文确定。
