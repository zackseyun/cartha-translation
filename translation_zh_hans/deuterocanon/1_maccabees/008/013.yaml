  yaml_path: translation/deuterocanon/1_maccabees/008/013.yaml
  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: zh_hans
  text: 他们愿意帮助谁、立谁为王，就立谁为王；他们愿意废黜谁，就废黜谁；他们的权势和地位大大提高了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们被大大高举了。”这里概括他们权势和地位的大幅上升。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  choice: 他们愿意……谁
  rationale: 不定关系结构表达对象不受限定；用“谁……谁……”保留这种开放性，并符合现代汉语表达。
- source_word: βοηθεῖν
  choice: 帮助
  rationale: 该词基本义为帮助、援助；此处虽有政治军事背景，但原文未具体说明援助方式，故不作窄化。
- source_word: καὶ βασιλεύειν, βασιλεύουσιν
  choice: 让谁作王，谁就作王
  rationale: βασιλεύειν和βασιλεύουσιν本义分别为“作王”和“作王/统治”。结合关系代词和上下文，句意是罗马人的支持决定谁能作王；汉语以“让谁作王，谁就作王”清楚表达这一关系，同时避免把后一个动词误译为罗马人自己统治。
- source_word: μεθιστῶσιν
  choice: 废黜
  rationale: μεθίστημι可泛指移走、撤换；在与“作王”对举的政治语境中，指把统治者撤下王位，“废黜”准确而简洁。
- source_word: ὑψώθησαν σφόδρα
  choice: 他们的地位大大提高了
  rationale: 原文是ὑψόω的被动式，字面意象为“被大大抬高”。此译保留其地位上升的含义，不直接把它收窄为军事强大。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谁……谁就……”使希腊文不定关系结构清晰可读；“废黜”与君王语境吻合。正文中的“地位大大提高”保留ὑψώθησαν的被动提升意象，脚注给出较直译形式。
