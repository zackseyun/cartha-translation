base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: zh_hans
  text: 他们每年把统治他们、管辖全境的权柄托付给一个人；众人都听这一个人的话[a]。他们中间既没有嫉妒，也没有争竞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“众人都听这一个人”；在这里的治理语境中，也可译作“众人都服从这一个人”。
    reason: 说明ἀκούουσιν τοῦ ἑνός既保留“听”的字面意义，也可含有服从之意。
lexical_decisions:
- source_word: πιστεύουσιν
  choice: 把……权柄托付给
  rationale: 此处后接表示治理的两个不定式，含义不是单纯“相信”，而是把治理权交托给某人；中文补出“权柄”可自然表达这一政治语境。
- source_word: ἑνὶ ἀνθρώπῳ
  choice: 一个人
  rationale: 保留希腊文单数所强调的“一人”；现代汉语的“人”并不抹去原文在具体语境中的男性所指，同时比“一个男人”更符合政治叙述的自然表达。
- source_word: ἄρχειν αὐτῶν
  choice: 统治自己
  rationale: ἄρχω在这里指行使治理权；“自己”回指实施托付的群体，使中文简洁清楚。
- source_word: κατ' ἐνιαυτόν
  choice: 每年
  rationale: 表达职位按年交托、逐年更替的含义，不额外断定任期制度的具体细节。
- source_word: κυριεύειν
  choice: 管辖
  rationale: 该词表示掌权、作主；在政治语境中译作“管辖”自然庄重，也避免与前面的“统治”机械重复。
- source_word: πάσης τῆς γῆς αὐτῶν
  choice: 全境
  rationale: γῆ在此指罗马人的土地或领土；“全境”比“全地”更贴合国家治理语境。
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: 都听这一个人的话
  rationale: 保留ἀκούω“听”的基本意象，同时中文“听某人的话”在治理语境中自然含有听从、服从之意。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 表达因他人所得而产生的恶意或妒意，是该词在此负面社会语境中的常见含义。
- source_word: ζῆλος
  choice: 争竞
  rationale: ζῆλος可指热心、嫉妒或竞争；与φθόνος并列且受否定时，译作“争竞”既保留负面含义，也避免与“嫉妒”同义重复。
