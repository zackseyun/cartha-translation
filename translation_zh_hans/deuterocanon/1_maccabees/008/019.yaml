  yaml_path: translation/deuterocanon/1_maccabees/008/019.yaml
  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
translation:
  language: zh_hans
  text: 他们前往罗马——路途非常遥远[a]——进入议事厅[b]，回答说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“道路极其漫长。”希腊原文直译是道路或路途“非常大”，这里是说行程遥远。
    reason: lexical_alternative
  - marker: b
    text: 或译：“元老院议事堂。”希腊原文指议事机构开会的场所；结合罗马背景，可特指元老院的会址。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: 前往
  rationale: 该词在此叙述行程；“前往”自然、庄重，也明确表达朝罗马而去。
- source_word: εἰς Ῥώμην
  choice: 罗马
  rationale: 介词 εἰς 与地名连用表示方向，汉语以“前往罗马”自然表达。
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: 路途非常遥远
  rationale: ὁδός 字面可指“路、道路”，在此语境中指旅程或路途；πολλὴ σφόδρα 强烈表示程度，译为“非常遥远”既保留强调，也符合现代汉语。
- source_word: εἰσῆλθον
  choice: 进入
  rationale: 简洁对应“进去、进入”，符合正式叙事文体。
- source_word: τὸ βουλευτήριον
  choice: 议事厅
  rationale: 该词指议事机构开会商议的场所；“议事厅”不额外断定其正式名称，同时适合罗马政治语境。
- source_word: ἀπεκρίθησαν
  choice: 回答说
  rationale: 该动词通常意为“回答、回应”。下文承接其发言内容，汉语用“回答说”较自然，并保留希腊文的叙事衔接。
