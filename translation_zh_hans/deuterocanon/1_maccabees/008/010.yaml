  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: zh_hans
  text: 这消息传到他们耳中后，他们就派一名将领去攻打那些人，与他们交战；那些人中有许多人负伤倒下。他们掳走了那些人的妻子儿女，劫掠了他们，占领了他们的土地，拆毁了他们的堡垒，又劫掠了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在本节末尾再次说“劫掠了他们”。正文保留这一重复；它可能是有意强调，也可能源于文本传抄中的重复。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος αὐτοῖς
  choice: 这事传到他们那里
  rationale: λόγος在此指前文所述的消息或事情；译作“这事”保持中性，也符合汉语叙事习惯。被动式ἐγνώσθη以“传到……那里”自然表达“为他们所知”。
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: 派一名将领去攻打那些人
  rationale: στρατηγός在军事语境中为“将领”；保留ἕνα的“一名”。ἐπʼ αὐτούς带敌对方向，译为“去攻打那些人”比单纯“到他们那里”明确。
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: 与他们交战
  rationale: 准确保留军事行动及πρός在此的敌对含义，同时避免汉语中连续重复“攻打”。
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: 那些人中有许多人负伤倒下
  rationale: τραυματίαι指伤者或战斗中的伤亡人员；“负伤倒下”保留受伤与倒下两层意思，不武断断定他们死亡。
- source_word: ᾐχμαλώτισαν τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν
  choice: 掳走那些人的妻子儿女
  rationale: 动词指在战争中俘获；“掳走”在此简洁自然，并清楚表达被俘处境。
- source_word: ἐπρονόμευσαν αὐτούς
  choice: 抢掠他们
  rationale: 该动词表示劫掠、掠夺。原文在本节末尾重复一次，正文照样保留。
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: 占领他们的土地
  rationale: κατακρατέω接属格表示取得控制或支配；军事叙事中“占领”自然准确，但不额外引入永久合法所有权。
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: 拆毁他们的堡垒
  rationale: καθαιρέω表示拆下、摧毁；ὀχυρώματα指防御工事或坚固据点，译作“堡垒”通俗明确。
