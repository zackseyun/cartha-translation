  yaml_path: translation/deuterocanon/1_maccabees/008/014.yaml
  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: zh_hans
  text: 在这一切事上，他们中没有一个人给自己戴上王冠[a]，也没有披上紫袍[b]，借此显耀自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王室头带”；希腊词指象征王权的束额带。
    reason: lexical_alternative
  - marker: b
    text: 紫袍是王权或崇高身份的标志。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: 在这一切事上
  rationale: 承接上文对罗马政治惯例的叙述，既保留概括性，也符合现代汉语表达。
- source_word: ἐπέθετο ... διάδημα
  choice: 给自己戴上王冠
  rationale: 中间语态表明动作施于自身；διάδημα特指王权象征性的头带，正文用自然易懂的“王冠”，并以脚注补明其具体形制。
- source_word: πορφύραν
  choice: 披上紫袍
  rationale: πορφύρα可借颜色或染料指紫色衣服；汉语若只译“披上紫色”不自然，因此明示为“紫袍”，同时保留其尊贵身份象征。
- source_word: ἁδρυνθῆναι
  choice: 显耀自己
  rationale: 这里表示借王者服饰使自己显得尊大、显贵；“显耀自己”自然地传达自我抬高之意，而不把词义限定为内心骄傲。
- source_word: ἐν αὐτῇ
  choice: 借此
  rationale: 阴性代词回指πορφύρα，语境中带工具意味，即借紫袍彰显身份；“借此”在汉语中简洁自然。
