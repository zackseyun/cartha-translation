base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: zh_hans
  text: 他们又在战争中击溃并制伏了腓力、基提人的王珀尔修斯[a]，以及[b]那些起来攻击他们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基提人”直译希腊文本中的族称；在此历史语境中，可能指马其顿王国。有些译本按这一所指译作“马其顿人的”。
    reason: alternative_reading
  - marker: b
    text: 现存希腊文本在这里连续三次写了“和”（καὶ）；这看来是文本传抄上的不规则，并不实质改变句意。
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: 腓力
  rationale: 采用现代中文圣经和历史文献中通行的人名译法。
- source_word: Περσέα
  choice: 珀尔修斯
  rationale: 按希腊语人名音译，并与马其顿王珀尔修斯的现代常见译名相符。
- source_word: Κιτιέων
  choice: 基提人的
  rationale: 保留希腊语复数族称，不在正文中直接改释为“马其顿人的”；其历史所指另以脚注说明。
- source_word: βασιλέα
  choice: 王
  rationale: 准确、自然地表达君王称号；与“基提人的”组合为“基提人的王”。
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  choice: 那些起来攻击他们的人
  rationale: ἐπαίρω在此表示敌对地起来；“起来攻击”既保留动作意象，也明确表达军事语境。“他们”的所指在原文中并未进一步明说，译文保留这一点。
- source_word: συνέτριψαν
  choice: 击溃
  rationale: 表达战争中彻底打败、摧毁敌方力量的强烈含义，比一般的“打败”更贴近原词。
- source_word: πολέμῳ
  choice: 在战争中
  rationale: 按军事语境处理与格表达，中文自然，并不限定为某一场具体战役。
- source_word: κατεκράτησαν αὐτῶν
  choice: 制伏了他们
  rationale: 表达取得优势并掌控对方；既有“胜过”的意思，也保留原词所含的控制、压服色彩。
theological_decisions:
- issue: 族称 Κιτιέων 的历史所指
  choice: 基提人的
  alternative: 马其顿人的；基提城的
  rationale: 正文优先遵循现存希腊文本的族称形式，不以历史辨识取代原文措辞；同时在脚注中说明它在此可能指马其顿领域。
- issue: ἐπʼ αὐτούς 与末尾 αὐτῶν 的代词所指
  choice: 均译作“他们”，保留原文语境中的指代张力
  alternative: 明确译作“罗马人”或分别指明不同对象
  rationale: 本节单独看时，代词所指需要由上下文判断；直接补明具体对象会消除原文保留的指代空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句首补出承接上文的主语“他们”，并用“又”衔接列举；保留两个并列谓语“击溃，制伏”，以反映 συνέτριψαν 与 κατεκράτησαν 的递进力度。
