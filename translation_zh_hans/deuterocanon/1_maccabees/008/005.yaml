  rationale: 修订只改善汉语句法和脚注锚点：将“在战争中”前置，并以“击溃并制伏了”连结原文两个并列军事动词。保留“基提人”这一未释义族称及两处代词“他们”的上下文指代张力；脚注继续说明族称的可能历史所指与希腊文重复连词的文本现象。
