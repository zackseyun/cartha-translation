  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: zh_hans
  text: 并除掉他们所负的轭，因为他们看见希腊人的王国正在奴役以色列，使以色列沦为奴隶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里用同根词加强语气，直译近似“奴役以色列，使其陷入奴役”。
    reason: 说明原文奴役词语的重复强调，以及正文采用自然汉语表达这一强调的方式。
lexical_decisions:
- source_word: ἆραι
  choice: 除掉
  rationale: αἴρω在与“轭”搭配时，指除去或卸下压迫性的重担；“除掉”比单纯的“举起”更符合这里的惯用意义。
- source_word: ζυγὸν
  choice: 所负的轭
  rationale: 保留“轭”这一具体而传统的压迫隐喻；补入“所负的”使现代汉语表达自然，也明确轭是他们承受的辖制。
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: 希腊人的国
  rationale: 直译其属格结构，同时保留βασιλεία可指王国或政治统治实体的含义，不进一步限定为某一帝国。
- source_word: καταδουλουμένους
  choice: 正在奴役
  rationale: 该分词表示持续发生的使人沦为奴仆、完全受制的行动；“正在奴役”保留其进行意味和强烈程度。
- source_word: δουλίαν
  choice: 使他们沦为奴隶
  rationale: 用结果性短语体现δουλίαν，并保留原文与καταδουλόω形成的同根强调；中文若硬译为“奴役到奴役中”则不自然。
- source_word: τὸν Ἰσραὴλ
  choice: 以色列
  rationale: 按原文保留“以色列”这一整体性称呼；后文“他们”按汉语习惯指以色列民。
theological_decisions:
- issue: 如何处理原文重复的奴役语言
  choice: “正在奴役以色列，使他们沦为奴隶”
  alternative: “正在奴役以色列”或“正在使以色列屈服”
  rationale: 希腊文同时使用καταδουλόω和δουλία，形成有意的同根强调。译文不把它弱化为一般性的“压迫”或“征服”，但采用自然的中文结果结构来表达。
- issue: “希腊人的国”的政治所指
  choice: 保留较宽泛的“希腊人的国”
  alternative: “希腊帝国”或“希腊人的统治”
  rationale: βασιλεία在此可指王国、政权或统治势力；不以更具体的政治术语消除原文的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“轭”保留历史与经文语境中的压迫隐喻；“使他们沦为奴隶”既传达原文强调，也避免生硬的同词重复。
