base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
translation:
  language: zh_hans
  text: 也不得向盟友提供粮食、武器或银子[a]，按罗马所决定的办理[b]；他们应当遵守这些规定[c]，不得用诡诈的手段。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”在这里也可指钱财。
    reason: lexical_alternative
  - marker: b
    text: “按罗马所决定的办理”是正式的决议用语，也可译作“照罗马所议定的”。
    reason: cultural_note
  - marker: c
    text: “这些规定”直译近于“这些应当遵守的事项”；在条约语境中也可译作“这些条款”或“这些义务”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμάχοις
  choice: 盟友
  rationale: 本词在政治、军事条约中指结盟的各方；“盟友”是现代汉语中自然、清楚的对应词。
- source_word: δοθήσεται
  choice: 不可给
  rationale: 希腊文是将来时被动语态，带有条约禁令的效力。汉语用“不可给”保留正式规范语气，又避免生硬的被动句。
- source_word: σῖτος
  choice: 粮食
  rationale: 本词泛指谷物或粮食供应，并不限定为小麦；“粮食”符合条约所列物资的语境。
- source_word: ὅπλα
  choice: 武器
  rationale: 在军事条约语境中指兵器或军械；“武器”对现代读者最清楚。
- source_word: ἀργύριον
  choice: 银子
  rationale: 希腊文直指白银，在此也可能具有钱财或军费的功能；正文保留具体物质称谓，并以脚注说明。
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: 照罗马所议定的
  rationale: 这是正式决议用语，实际意义是按罗马作出的决定；“议定”既自然，又保留外交条约的正式色彩。
- source_word: φυλάξονται
  choice: 要遵守
  rationale: φυλάσσω在法律及条约语境中可指遵守规定；“遵守”比字面的“看守”更符合此处意义。
- source_word: τὰ φυλάγματα ταῦτα
  choice: 这些规定
  rationale: 该短语字面与“应当守住的事项”有关，在条约中指必须遵行的规定或条款；“规定”简明且不把含义过度限定为单方义务。
- source_word: οὐ μετὰ δόλου
  choice: 不可有欺诈
  rationale: 该短语否定履行条约时的诡诈或欺骗；此译法保留正式禁令语气及其行为、意图两方面的张力。
