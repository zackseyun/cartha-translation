  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: zh_hans
  text: 至于德米特里王正在加给他们的种种伤害[a]，我们曾写信给他，说：“你为什么加重你的轭，压在我们的朋友和盟友——犹太人身上？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种种恶事”或“种种苦害”。希腊语在这里可指伤人的行为或压迫性的措施，不只是抽象意义上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: 至于……种种伤害
  rationale: 此处 κακά 指具体造成的伤害或恶待，而非抽象的道德之恶。“种种伤害”既保留复数含义，也符合现代汉语表达。
- source_word: συντελεῖται εἰς αὐτούς
  choice: 加给他们
  rationale: 该短语表示德米特里王正在对犹太人施加或造成这些伤害；与前面的“种种伤害”连用，自然且保留敌对指向。
- source_word: ἐγράψαμεν αὐτῷ
  choice: 我们已经写信给他
  rationale: ἐγράψαμεν 为不定过去时；中文用“已经写信”清楚表达该行动已发生，而不强加更细的时态区分。
- source_word: Διὰ τί ἐβάρυνας τὸν ζυγόν σου
  choice: 你为什么把沉重的轭加在……身上
  rationale: 保留 ζυγός 的“轭”这一统治与压迫的比喻；ἐβάρυνας 所表达的加重、使沉重之意，以“沉重的轭”自然呈现。
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: 在我们的朋友和盟友犹太人身上
  rationale: 保留同位关系：犹太人就是罗马人的朋友和盟友；措辞简洁，并依循希腊文的次序。
