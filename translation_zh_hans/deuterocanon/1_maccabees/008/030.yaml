base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: zh_hans
  text: 但在这些条款之后，如果双方[a]商议要增添或删减内容，他们可以自行决定这样做；凡所增添或删减的，都具有法律效力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这些和这些”，指盟约的两个缔约方。
    reason: lexical_alternative
  - marker: b
    text: “具有法律效力”也可译作“具有约束力”或“正式生效”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: 条款
  rationale: 在盟约和法律语境中，此词指已经陈明的约定或条款，而不只是一般的“话语”。
- source_word: βουλεύσωνται
  choice: 商议
  rationale: 此动词表示共同筹议或谋定；译作“商议”既保留过程含义，也避免与下文“自行决定”重复。
- source_word: οὗτοι καὶ οὗτοι
  choice: 双方
  rationale: 重复的指示代词指盟约的两个缔约方；“双方”是现代汉语中自然、准确的法律表达，脚注保留其字面形式。
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: 增添或删减
  rationale: 这一对动词在修改法律条款的语境中表示增加或删除内容；“增添或删减”简洁而正式。
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: 自行决定
  rationale: αἵρεσις在此表示选择或决定，并非宗派；“自行决定”表达行动出于缔约双方自己的选择。
- source_word: κύρια
  choice: 具有法律效力
  rationale: κύρια在法律语境中表示有效、具约束力或正式生效；“具有法律效力”清楚传达其法律含义。
