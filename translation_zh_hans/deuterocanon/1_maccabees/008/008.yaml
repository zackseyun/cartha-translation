  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
translation:
  language: zh_hans
  text: 还有印度、米底亚和吕底亚，以及他们一些最优良的地区[a]；他们从他那里取得了这些地方，交给了欧迈尼斯王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他们最优良的地区中取出一些。”希腊文直译为“从他们最美的土地中”，这里“最美”指格外优良、可取的地区。
    reason: 说明καλλίστων的字面义及ἀπό所表达的部分性；保留“他们”在本节中未明说的所指。
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  choice: 印度、米底亚和吕底亚的土地
  rationale: χώρα可指土地、地区或疆域；此处与三个地名连用，译作“土地”既保留领土含义，也符合现代汉语表达。Ἰνδική、Μηδία、Λυδία分别按通行地名译为“印度、米底亚、吕底亚”。
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: 其中一些最上好的疆域
  rationale: καλλίστων字面为“最美的”，用于疆土时更自然地表示“最上好、最优越的”；ἀπό在这里带有部分性，故用“一些”明确其含义。“其中”承接前述地区，同时避免生硬照译代词αὐτῶν。
- source_word: λαβόντες αὐτὰς παρ' αὐτοῦ
  choice: 他们从他手中夺取了这些地方
  rationale: λαβόντες为不定过去时分词，在叙事中表示先发生的行动，汉语用限定动词“夺取了”更自然；παρ’ αὐτοῦ保留为“从他手中”，不擅自补明本节未重述的先行人物。
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: 把它们交给欧迈尼斯王
  rationale: ἔδωκαν直译为“给”，在领土转交的语境中译作“交给”自然准确；τῷ βασιλεῖ按现代汉语习惯置于姓名之后，译为“欧迈尼斯王”。
