  text: According to these terms[a], the Romans thus made an agreement with the people of the Jews.
translation:
  language: zh_hans
  text: 罗马人便按照这些条款，与犹太民众订立了协议。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太”或译“犹地亚”。希腊语Ἰουδαίων可指犹太人，也可指犹地亚人，须视上下文而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: 照这些条款
  rationale: κατά加宾格表示依照前述内容；λόγοι在条约语境中指已列明的条款，而非泛指“话语”。
- source_word: οὕτως
  choice: 就
  rationale: οὕτως承接上文，表示事情按上述方式落实；现代汉语用“就”自然体现这种回指与结果关系。
- source_word: ἔστησαν
  choice: 订立了协议
  rationale: ἵστημι的简单过去时在外交法律语境中表示确立或订立某项安排。原文虽省略“协议”一词，但语境明确，译出可避免生硬，同时不把它过度限定为某一特定类型的条约。
- source_word: Ῥωμαῖοι
  choice: 罗马人
  rationale: 作为民族群体名称，在句中充当订立协议的一方。
- source_word: τῷ δήμῳ
  choice: 与……的民众
  rationale: 此处与ἔστησαν连用的与格表示协议的另一方；δῆμος指作为公共共同体的人民或民众。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: Ἰουδαῖοι既可指犹太人，也可按地域理解为犹地亚人；本节外交语境主要指集体性的犹太人民，但保留脚注说明另一可能。
theological_decisions:
- issue: Ἰουδαίων的范围
  choice: 犹太人的
  alternative: 犹地亚人的
  rationale: 这里所指是作为外交共同体的一群人，“犹太人”较能涵盖其民族—宗教身份；希腊词仍可能带有地域意义，因此不在正文中排除该含义，而以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而自然的条约叙述语体。“订立了协议”传达原文省略式的法律含义；“民众”保留δῆμος作为公共共同体的色彩。
