  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: zh_hans
  text: 以下是他们誊写在铜版上、送往耶路撒冷的文书副本，为要留在他们那里，作为和平与同盟的纪念。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 指复制出来的书面文本；“副本”符合正式文书语境，也与后面的“誊写”自然呼应。
- source_word: γραφῆς
  choice: 文书
  rationale: 这里指正式的书面文件，并非“经文”；“文书”兼具准确性与庄重感。
- source_word: ἀντέγραψαν
  choice: 誊写
  rationale: 表示把文本抄录成副本；“誊写”比单纯“抄写”更适合正式条约文书的语境。
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: 在铜版上
  rationale: δέλτοι 是供书写或镌刻的版片，χαλκαῖς 表明其材质为铜或青铜；现代汉语以“铜版”简洁自然。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 指为使某事被长久记念而保存的事物；“作为……的纪念”保留其正式、纪念性的含义。
- source_word: εἰρήνης
  choice: 和平
  rationale: 原文仅用“和平”，没有明确写成“和平条约”，故不作增译。
- source_word: συμμαχίας
  choice: 同盟
  rationale: 指政治或军事上的结盟关系；“同盟”直接表达其正式关系，同时不限定具体范围。
- source_word: παρ' αὐτοῖς
  choice: 留在他们那里
  rationale: 表达副本存放于耶路撒冷群体处的意思；结合 ἐκεῖ 译为“留在他们那里”，比逐字译作“在他们中间”更自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“以下是……”承接后文将引出的文书内容；保留原句中“和平”与“同盟”并列的正式表达。原文 χαλκαῖς 可指铜质或青铜质，正文采用汉语传统文书语境中较自然的“铜版”，不另加脚注。
