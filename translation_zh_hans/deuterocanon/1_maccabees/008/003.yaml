  language: zh_hans
  text: 以及他们在西班牙地区所做的一切，为要控制那里的金银矿山[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那里的金银资源”；希腊语μέταλλα可指矿山或采矿场，也可泛指从中取得的金属资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: χώρα Σπανίας
  choice: 西班牙境内
  rationale: χώρα表示地域或疆域；译作“境内”既符合属格结构，也避免把古代地域概念过度等同于现代民族国家。Σπανία采用现代读者熟悉的地名“西班牙”。
- source_word: κατακρατῆσαι
  choice: 控制
  rationale: 该不定式由τοῦ引出目的，κατακρατέω表示取得并维持支配权；“为要控制”准确、自然，也不过度强调一次性的武力夺取。
- source_word: μέταλλα τοῦ ἀργυρίου καὶ τοῦ χρυσίου
  choice: 金银矿藏
  rationale: μέταλλα可指矿山、矿藏或金属资源。结合金银属格和罗马扩张的经济语境，“金银矿藏”兼顾矿业地点与资源含义，同时保留一定语义宽度。
- source_word: τοῦ ἐκεῖ
  choice: 那里的
  rationale: 冠词化地点副词ἐκεῖ限定前述矿藏；“那里的”简洁自然地指回西班牙境内。
- source_word: ὅσα ἐποίησαν
  choice: 他们……所做的事
  rationale: ὅσα概括罗马人在该地的一切作为；此译法保留概括性，并与上下文的列举句式衔接。
