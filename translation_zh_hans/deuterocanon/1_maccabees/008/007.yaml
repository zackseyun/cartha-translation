    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: 他们活捉了他
  rationale: ζῶντα明确表示被捉时仍然活着；“活捉”在现代汉语中简洁自然，也保留了希腊文“拿住他且是活的”这一语义。
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: 规定……要向他们缴纳／交出／割让
  rationale: ἔστησαν加不定式在此表达确立并施加义务；“规定……要”保留法律与政治安排的强制意味，同时避免添加原文未明说的执行方式。
- source_word: αὐτόν τε καὶ τοὺς βασιλεύοντας μετʼ αὐτόν
  choice: 他和在他以后作王的人都
  rationale: 用“……和……都”体现τε καὶ所连接的双方；“在他以后作王的人”贴近分词表达，并保留王位继承者的含义。
- source_word: φόρον μέγαν
  choice: 巨额贡赋
  rationale: 政治语境中的φόρος指臣服者缴纳的贡赋，不是一般国内税收；“巨额”自然表达μέγαν所指数额或负担之大。
- source_word: ὅμηρα
  choice: 人质
  rationale: 此处指政治协定中作为履约保证而交出的人，译为“人质”最准确清楚。
- source_word: διαστολήν
  choice: 割让领土
  rationale: 该词本义范围较广，可涉及分隔、划界或区分；在战败后被施加的政治条件中，很可能指领土上的划分或让与。“割让领土”适合上下文，但因词义不确定而加注说明。
