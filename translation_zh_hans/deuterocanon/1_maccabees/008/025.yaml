  naturalness: “按时势向他们所指明的，尽心尽意地与之同盟相助”句法不完整且修饰关系含混。改为“随时势为他们所指明的而行”可保留原文“他们”所指未明的特点，并使全句通顺、保持庄重的盟约文体。
  terminology: “犹太民族”适合τὸ ἔθνος τῶν Ἰουδαίων的政治共同体含义；“结盟相助”适合συμμαχήσει，且不将其限定为作战。“尽心尽意地”可传达καρδίᾳ πλήρει的全心、诚意之意。原注的“以一颗充满的心”不合汉语惯用表达，宜改为较贴近原文的“以充满的心”。
