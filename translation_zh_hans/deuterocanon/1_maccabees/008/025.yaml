  text: The nation of the Jews shall be an ally[a], as the occasion may indicate for them, with a full heart.
translation:
  language: zh_hans
  text: 犹太民族必尽心尽意地结盟相助，随时势为他们所指明的而行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以充满的心”。
    reason: 说明“尽心尽意地”所对应的希腊文形象表达。
lexical_decisions:
- source_word: συμμαχήσει
  choice: 与之同盟相助
  rationale: 该动词表示作为盟友联合行动。译作“同盟相助”既符合盟约语境，也避免把行动过度限定为实际交战；“与之”承接上下文中的盟约另一方。
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος在外交盟约中具有政治共同体的含义；“犹太民族”简明自然，并保留其集体性。
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: 按时势向他们所指明的
  rationale: ὡς ἄν加虚拟式表达随情况而定；καιρός指适当时机或现实形势，ὑπογράφῃ可表示指明、规定。“按时势向他们所指明的”保留原文略显正式且不完全明确的表达，不把它强化为强制性的“要求”。
- source_word: καρδίᾳ πλήρει
  choice: 尽心尽意地
  rationale: 此与格短语直译为“以一颗充满的心”，惯用意义是全心、诚心投入。“尽心尽意地”是现代汉语中自然而庄重的对应表达。
