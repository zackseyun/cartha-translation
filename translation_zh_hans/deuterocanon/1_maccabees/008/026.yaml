base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: zh_hans
  text: 他们不可给那些同他们交战的人粮食、武器、银子或船只，也不可向他们供应这些东西，照罗马所决定的；他们要遵守自己的约定[a]，不取得任何东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遵守自己的条款”，或“履行自己所承担的义务”。希腊文在这里使用同源词组合，直译近于“守住所当守的事”；在本段条约语境中，是指遵守约定的条款或义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: 那些与他们交战的人
  rationale: 分词作名词用，指敌对交战者；“与他们”依据条约语境补明希腊文中隐含的交战对象。
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: 不可……给……，也不可供应
  rationale: 保留两个并列的将来时禁令，分别表达直接给予和提供所需援助。
- source_word: σῖτον
  choice: 粮食
  rationale: σίτος可指谷物或谷粮；“粮食”在现代汉语条约语境中自然，也不把含义限定为小麦。
- source_word: ὅπλα
  choice: 武器
  rationale: 准确、通俗地表达军事装备之意。
- source_word: ἀργύριον
  choice: 银子
  rationale: 保留希腊文“银”的字面与古代经济背景，不径直释为较宽泛的“钱财”。
- source_word: πλοῖα
  choice: 船只
  rationale: 适合军事及外交语境，同时是自然的现代汉语。
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: 这是罗马所决定的
  rationale: ἔδοξεν加与格在法令中表示正式决议；此译法兼顾正式性与可读性。
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: 他们要遵守自己的约定
  rationale: 以“遵守……约定”表达同源动词与名词构成的法律性措辞，并按条约上下文理解为应守的条款或义务。
- source_word: οὐθὲν λαβόντες
  choice: 不收取任何东西
  rationale: 贴近“什么也不领取”的分词结构；不额外断定所收之物是报酬或来自哪一方。
