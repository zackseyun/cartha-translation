base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: zh_hans
  text: 愿罗马人和犹太民族在海上和陆地上[a]都永远安好；愿刀剑[b]和仇敌远离他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海上和陆地上”是惯用的成对表达，意指在各处、各方面。
    reason: lexical_alternative
  - marker: b
    text: “刀剑”很可能借指战争；正文保留了希腊文具体的兵器用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: 愿……安好
  rationale: γένοιτο为希求语气，表达祝愿；“愿……安好”自然、庄重，并保留祝愿的语力。
- source_word: Ῥωμαίοις
  choice: 罗马人
  rationale: 与格复数，指罗马人民；现代汉语以“罗马人”直接表达。
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος在此具有政治与族群含义；“犹太民族”简洁自然，也保留其群体性。
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: 在海上和陆地
  rationale: 保留希腊文成对列举的两个领域；此处也可作为举隅，涵盖各处和各方面。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 在盟约祝愿语境中表示持续无尽的时间；“永远”是清楚自然的现代汉语表达。
- source_word: ῥομφαία
  choice: 刀剑
  rationale: 保留原文具体的兵器意象；在此可能借指战争，但不在正文中将其抽象化。
- source_word: ἐχθρός
  choice: 仇敌
  rationale: 单数名词可作集合性或代表性表达；“仇敌”符合庄重的经文语体。
- source_word: μακρυνθείη ἀπ' αὐτῶν
  choice: 愿……远离他们
  rationale: 被动希求语气表达使刀剑和仇敌离开他们的愿望；译文保留“远离”的空间意象和祝愿语气。
