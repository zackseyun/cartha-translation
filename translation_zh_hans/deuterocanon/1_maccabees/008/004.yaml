base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: zh_hans
  text: 他们凭自己的谋略和刀剑控制了整个地区——那地区离他们非常遥远——又制伏了那些从地极来攻打他们的君王[a]，直到把他们击溃，给他们以沉重打击；其余者则年年向他们进贡。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地极”直译希腊文，意为极其遥远的地方。
    reason: lexical_alternative
  - marker: b
    text: “其余者”原文所指并不明确，可能是其余的君王或民族；他们继续每年向罗马人进贡。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκράτησαν
  choice: 控制了／制伏了
  rationale: 该动词表示以强力取得支配权。对地区译作“控制了”，对敌对君王顺应汉语搭配译作“制伏了”，同时保留同一动词统摄两个宾语的意义。
- source_word: τοῦ τόπου παντός
  choice: 整个地区
  rationale: τόπος本义为“地方”，此处处于地缘政治和军事语境，“地区”比“地方”自然，又不把范围扩大为“所有土地”。
- source_word: τῇ βουλῇ αὐτῶν
  choice: 凭谋略
  rationale: βουλή可指谋划、计策或决策；“谋略”与“刀剑”并列，自然表达政治智慧与军事力量两种手段。
- source_word: τῇ ῥομφαίᾳ
  choice: 凭刀剑
  rationale: 保留原文以刀剑代指武力和战争的修辞。
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: 离他们非常遥远
  rationale: 直接保留距离之远以及σφόδρα的加强语气。
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: 那些……而来攻击他们的君王
  rationale: ἐπέρχομαι在此表示带敌意地进逼；“而来攻击”清楚表达军事敌对，同时使其作为κατεκράτησαν的第二组宾语。
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: 从地极而来
  rationale: 紧贴希腊文单数表达，并保留表示极远之处的古代地理习语；脚注予以说明。
- source_word: συνέτριψαν
  choice: 击溃
  rationale: 该词有粉碎、摧毁之意；军事语境中“击溃”既有力度，也符合现代汉语。
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: 使他们遭受重创
  rationale: 这是表示施加重大打击的闪语式表达；“遭受重创”自然凝练，并保存严重军事打击的意义。
- source_word: οἱ ἐπίλοιποι
  choice: 其余的人
  rationale: 原文没有明确限定为幸存者、君王或民族，因此采用宽泛措辞，保留指称上的歧义。
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: 向他们进贡
  rationale: 尽管抄本中的动词形式不寻常，上下文明确表示向罗马人缴纳贡赋；“进贡”是自然的政治用语。
- source_word: κατʼ ἐνιαυτόν
  choice: 年年
  rationale: 表达每年持续、反复发生的进贡，简洁而有叙事节奏。
