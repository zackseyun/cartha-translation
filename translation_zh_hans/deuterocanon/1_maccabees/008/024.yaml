lexical_decisions:
- source_word: ἐνστῇ πόλεμος
  choice: 战争临到
  rationale: ἐνίστημι在此表示战争发生、逼近或降临；“战争临到”既保留原文的动态，又符合庄重的现代汉语。
- source_word: Ῥώμῃ
  choice: 罗马
  rationale: 与ἐνστῇ构成间接受事关系，译作“临到罗马”，不把地名改释为政治制度或罗马人。
- source_word: πᾶσι τοῖς συμμάχοις αὐτῶν
  choice: 他们任何一个盟邦
  rationale: πᾶσι在此类条件条款中可表达涵盖性，即盟友中的任何一方；“盟邦”比“盟友”更切合国家间条约语境。
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: 无论是在他们统辖的什么地方
  rationale: κυρία在这里指其支配、管辖的地域范围；采用范围性表达，保留“整个辖境中任何地方”的含义，同时避免生硬的名词堆叠。
