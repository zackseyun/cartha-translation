  text: saying[a], “A gathering has been assembled against them from Ptolemais and Tyre and Sidon and all Galilee of the foreigners, to wipe us out.”
translation:
  language: zh_hans
  text: 说：“有一支队伍从托勒密城、推罗、西顿和外族人的加利利全境[a]聚集起来，要攻击他们，把我们彻底消灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外邦人的加利利全境。”希腊文直译为“外族人的整个加利利”。
    reason: 保留ἀλλοφύλων的传统译法及其与“加利利”之间略显紧密而可能含混的修饰关系。
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 这是现在分词，引出他们所传达的话；汉语用“说”自然承接上下文。
- source_word: Ἐπισυνήχθη
  choice: 有一支队伍……聚集起来
  rationale: 该词为不定过去时被动形式，语境表明所聚集的是敌对人群。汉语若机械保留被动会显得生硬，因此用不及物式“聚集起来”表达聚集这一事件，并以“一支队伍”补明希腊文省略的集合主体，但不具体说成“军队”。
- source_word: ἐπʼ αὐτούς
  choice: 要攻击他们
  rationale: ἐπί加宾格在军事语境中表示敌对方向；“要攻击他们”比直译“针对他们”更自然，同时保留第三人称“他们”。
- source_word: Πτολεμαΐδος
  choice: 托勒密城
  rationale: 采用该古城常见的现代汉语译名，并加“城”以免与人名托勒密混淆。
- source_word: ἀλλοφύλων
  choice: 外族人
  rationale: 该词指属于另一民族或族群的人；“外族人”保留此处民族与政治层面的含义，避免在正文中直接采用可能带有较强神学色彩的“外邦人”。
- source_word: τοῦ ἐξαναλῶσαι
  choice: 把……彻底消灭
  rationale: 带冠词的不定式在此表示目的；动词含完全毁灭之意，“彻底消灭”准确传达其强度。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 保留原文由前面的“他们”转为“我们”的人称变化，不加协调或改写。
theological_decisions:
- issue: ἀλλόφυλοι在次经历史军事语境中的译法
  choice: 外族人
  alternative: 外邦人
  rationale: 上下文主要描述民族和政治上的敌对群体，而非展开神学分类；正文采用“外族人”，并在脚注保留传统译法“外邦人”。
- issue: 原文“他们”与“我们”的人称转换
  choice: 照原文保留转换
  alternative: 统一译作“我们”
  rationale: 原文先说敌军聚集攻击“他们”，随后在所引信息的目的语中说消灭“我们”。这种张力可能反映传话角度，译文不应擅自消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。地名用通行译名；保留原文连续列举的节奏。为避免生硬的希腊式被动结构，将Ἐπισυνήχθη自然化为“聚集起来”，同时不过度具体化为“军队”。
