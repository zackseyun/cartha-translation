  to: 撒迦利亚的儿子约瑟和亚撒利雅[a]，两位军队将领，听说了他们英勇的作为和所进行的战争。
  rationale: 修订以“所进行的战争”保留τοῦ πολέμου的基本意义，避免“战功”所附加的功绩含义；并将“统帅”调整为不预设具体军阶的“军队将领”。脚注继续明确保存Swete抄录与叙事传统之间的第二人名异读。
