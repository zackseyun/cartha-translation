  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
translation:
  language: zh_hans
  text: 撒迦利亚的儿子约瑟和亚撒利雅[a]，两位军队将领，听说了他们英勇的作为和所进行的战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据Swete希腊文本的抄录在第二个人名处似作“撒迦利亚”；但本段叙事语境和通行文本传统支持此处作“亚撒利雅”。
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说了
  rationale: 这里的动词表示经由听闻而得知；“听说了”能自然引出后面的事迹。希腊文虽用单数动词，但并列主语可按合意译为汉语复数语义。
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: 撒迦利亚的儿子约瑟
  rationale: 冠词加属格构成父子称谓；现代汉语以“某人的儿子某某”表达最清楚自然。
- source_word: Ζαχαρίας
  choice: 亚撒利雅[a]
  rationale: 所给Swete抄录文本此处作“撒迦利亚”，但叙事语境及通行文本传统支持第二人为“亚撒利雅”；正文采用语境所支持的名称，并以脚注保存文本差异。
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: 这两位军队的统帅
  rationale: ἄρχοντες指领袖或指挥者，τῶν δυνάμεων指军队；“统帅”体现军事领导身份，又不套用现代具体军衔。“这两位”使同位说明在汉语中更清楚。
- source_word: ἀνδραγαθήσεων
  choice: 英勇事迹
  rationale: 该词指勇敢、英武的行为；“英勇事迹”庄重而符合现代汉语，且避免古旧或带性别色彩的表达。
- source_word: τοῦ πολέμου
  choice: 战功
  rationale: 字面为“战争”，但在与“英勇事迹”并列并受οἷα ἐποίησαν统摄的结构中，所指是战争中的作为或成就；“战功”简洁自然，并保留赞许意味。
- source_word: οἷα ἐποίησαν
  choice: 他们所成就的
  rationale: 关系表达概括前述作为；“所成就的”可同时修饰“英勇事迹”和“战功”，传达已完成行动的回顾语气。
