  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: zh_hans
  text: 犹大转往外族人之地阿左托[a]。他拆毁了他们的祭坛；他们烧掉了他们众神的雕像[b]。犹大掠取了各城的战利品，然后返回犹太地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按当时的历史背景，也可更具体地理解为“非利士人之地”。希腊文直译为“外族人之地”。
    reason: alternative_reading
  - marker: b
    text: 希腊文这里的动词是复数（“他们烧掉”），而前后的动词都是单数；这里的“他们”很可能是指犹大的部众。
    reason: source_grammar
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: 转道进入
  rationale: 表达偏离原行进路线而前往某地的意思，不额外说明其动机。
- source_word: Ἄζωτον
  choice: 阿左托
  rationale: 依希腊文地名形式音译，并避免以历史对应名取代原文形式。
- source_word: γῆν ἀλλοφύλων
  choice: 外族人之地
  rationale: 保留ἀλλόφυλοι“异族、外族人”的较宽泛表述；历史上较具体的非利士人解释置于脚注。
- source_word: καθεῖλεν τοὺς βωμοὺς
  choice: 拆毁了……祭坛
  rationale: καθαιρέω在建筑物语境中有拆除、毁坏之意；βωμός明确指祭坛。
- source_word: τὰ γλυπτὰ
  choice: 雕像
  rationale: 该词指雕刻而成的形像；现代汉语用“雕像”自然明确，也保留其物质形态。
- source_word: κατέκαυσαν
  choice: 他们又放火烧掉
  rationale: 严格保留希腊文复数动词，显出此处主语数目的突然变化；“他们”很可能包括犹大的部众。
- source_word: ἐσκύλευσεν τὰ σκῦλα
  choice: 掠取了……战利品
  rationale: 以动词和同源名词的组合传达战争中劫掠、取得战利品的含义，同时保持汉语自然。
- source_word: ἐπέστρεψεν εἰς τὴν Ἰουδαίαν
  choice: 返回犹太地
  rationale: 叙事语境中“返回”最自然；“犹太地”清楚指该地区。
theological_decisions:
- issue: ἀλλόφυλοι在历史上与非利士地区相关，但原词是较宽泛的族群称谓
  choice: 外族人之地
  alternative: 非利士人之地
  rationale: 正文保留希腊文较宽泛的措辞，不把历史识别直接写成原文明确使用的族名；较具体的解释列入脚注。
- issue: κατέκαυσαν在前后单数动词之间采用复数形式
  choice: 他们又放火烧掉
  alternative: 他又放火烧掉
  rationale: 不将希腊文本中的数目变化悄然统一；复数主语可能指犹大及其军队，但正文不进一步限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分句和重复主语清楚呈现希腊文由单数转为复数、再回到单数的变化；地名依希腊文形式译为“阿左托”。
