lexical_decisions:
- source_word: ἐπισυνήγοντο
  choice: 聚集到
  rationale: 该未完成时形式在这里表示众人持续或陆续聚拢；“聚集到”既保留趋向性，也不额外推断其动机。
- source_word: πρὸς αὐτούς
  choice: 他们那里
  rationale: πρός加宾格通常表示朝向某人移动；“到他们那里”自然地保留了这一方向含义。
- source_word: εὐφημοῦντες
  choice: 称赞他们
  rationale: 该分词表示说赞许、褒扬的话；汉语“称赞他们”自然简洁，并依据上下文补明隐含的称赞对象，同时不限定为正式欢呼或礼仪性颂扬。
