  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: zh_hans
  text: 他启程前往外族人的地区[a]，途经撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非利士人的地区”。在圣经用语中，希腊语“外族人”有时专指非利士人；但本节本身没有进一步明确所指，因此正文保留较宽泛的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 启程
  rationale: 该不定过去时动词在此表示开始动身；“启程”自然、简洁地传达这一意味。
- source_word: τοῦ πορευθῆναι
  choice: 前往
  rationale: 带冠词的不定式在此表达目的；“前往”符合现代汉语叙事用语。
- source_word: γῆν ἀλλοφύλων
  choice: 外族人的地区
  rationale: ἀλλόφυλοι 字面指其他族类的人，在圣经希腊语中也可特指非利士人；正文采用较宽泛的译法，以保留本节措辞本身的含义范围。“地区”也比“土地”更自然地表达此处的地域概念。
- source_word: διεπορεύετο
  choice: 途经
  rationale: 该未完成时动词描写穿行某地区的过程；“途经”在中文中自然地表达经由、穿过。
- source_word: τὴν Σαμάριαν
  choice: 撒马利亚
  rationale: 采用该地名通行的现代中文译名。
