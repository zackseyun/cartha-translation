  yaml_path: translation/deuterocanon/1_maccabees/005/045.yaml
  text: And Judas gathered all Israel who were in Gilead[a], from the least to the greatest, along with their wives and their children and their baggage, a very great company, to come into the land of Judah.
translation:
  language: zh_hans
  text: 犹大把在基列的全体以色列人，从最小的到最大的，连同他们的妻子、儿女和行李，都聚集起来，成为一支极其庞大的队伍[a]，前往犹大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成为一个极其庞大的营队”。希腊语 παρεμβολή 常可指“营”或“军营”，尤其用于军事语境；但这里也包括妻子、儿女和行李，因此泛指聚集起来的整支队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: 聚集起来
  rationale: 表示把分散的人召集到一起；“聚集起来”自然、具体，也不额外加入军事含义。
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: 在基列的全体以色列人
  rationale: 这里指当时身在基列的全部以色列居民；此译法既保留整体范围，也符合现代汉语表达。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: 从最小的到最大的
  rationale: 原文是表示无一遗漏的固定说法，可能涵盖年龄或身份高低；直译可避免把含义限缩为“从幼到老”。
- source_word: ἀποσκευήν
  choice: 行李
  rationale: 指迁行时随身携带的物品或辎重；结合妻子儿女同行的语境，“行李”比偏军事性的“装备”更贴切。
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: 一支极其庞大的队伍
  rationale: παρεμβολή常可指军营或营队，但此处概括包括家庭和行李在内的整个迁行群体；“队伍”既自然，又保留群体行进的意味。
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: 前往犹大地
  rationale: 不定式说明聚集众人的目的；“前往”在汉语中自然表达朝犹大地行进，而“犹大地”保留地理名称的形式。
