  yaml_path: translation/deuterocanon/1_maccabees/005/013.yaml
  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
translation:
  language: zh_hans
  text: 我们所有住在托布地区的弟兄都被杀了[a]；他们掳走了弟兄们的妻子儿女和财物[b]，又在那里杀了约一千名男子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“在托比乌所属之处（或人群）”；地名形式不易确定，也可理解为“在托布”或“在托布人中”。
    reason: lexical_alternative
  - marker: b
    text: “财物”也可译作“行装”“物品”或“装备”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“毁灭了约一千名男子”；这里按战争语境译作“杀了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: 我们的弟兄
  rationale: 保留原文的亲属称谓；在本段语境中，此词指同族的以色列人，但不直接改译为解释性的“同胞”。
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: 住在托布地区的
  rationale: 该希腊语地名结构较为特殊，可能指托布这一地方或其居民所在的区域；“托布地区”自然表达其最可能的地域含义，同时以脚注保留不确定性。
- source_word: τεθανάτωνται
  choice: 都被杀了
  rationale: 完成时形式强调死亡已经发生及其结果；结合掳掠和杀戮的战争语境，译为“被杀”比中性的“死了”更贴切。
- source_word: αἰχμαλωτίκασι
  choice: 掳走了
  rationale: 该词指在战争中俘获、掳为俘虏；中文“掳走”简洁自然，并清楚传达强制俘掠之意。
- source_word: τὴν ὑποσκευήν
  choice: 财物
  rationale: 此词可指行装、装备或可搬运的财产；“财物”适合此处与妻子儿女一同被掳走的语境，又不把词义限定为军用装备。
- source_word: ἀπώλεσαν
  choice: 杀了
  rationale: 该动词本义较宽，可表示毁灭、除灭；因宾语是约一千名男子，现代汉语用“杀了”最自然，同时在脚注中说明较直译的表达。
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: 约一千名男子
  rationale: ὡς置于数目之前表示约数；“约一千名”准确自然。“男子”保留ἀνδρῶν在此处明确的男性指称。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弟兄”保留原文的群体亲属称谓；第二分句重复“弟兄们的”，避免现代汉语中“他们”连续出现而造成掳掠者与受害者之间的指代混淆。分号呈现原文各项灾情彼此紧密相连的结构。
