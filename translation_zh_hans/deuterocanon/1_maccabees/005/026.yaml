  yaml_path: translation/deuterocanon/1_maccabees/005/026.yaml
  text: and that many of them are shut up in Bosora and Bosor[a], in Alamis, Casphor, Maked, and Carnaim; all these cities are fortified and large.
translation:
  language: zh_hans
  text: 又说，他们中有许多人被困在波索拉、波索尔、阿拉迈斯、卡斯佛、马克德和卡尔纳因[a]；这些城全都坚固而且很大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些希腊文地名的辨认较为困难，不同译本的写法也不一致；这里按斯威特文本作较贴近原文的音译，没有改成其他传统中较熟悉的名称形式。
    reason: cultural_note
lexical_decisions:
- source_word: συνειλημμένοι
  choice: 被困在
  rationale: 该完成时被动分词表示人被围住或受困于这些城中；“被困在”自然传达受限制的状态，同时不武断地将其限定为正式的军事围城。
- source_word: εἰς / ἐν
  choice: 在
  rationale: 在被动分词和地名这一语境中，介词表达受困后所在的位置；现代汉语统一译作“在”最为自然。
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: 波索拉、波索尔、阿拉迈斯、卡斯佛、马克德和卡尔纳因
  rationale: 按斯威特希腊文本保守音译各地名，不与其他文本传统中较熟悉但不同的名称形式强行统一。希腊文在Ἀλάμοις前另用ἐν，但整串名称均为人被困所在之城，汉语不重复介词。
- source_word: ὀχυραὶ
  choice: 坚固
  rationale: 用于城邑时指具有防御能力、设防坚固；“坚固”既准确又符合自然汉语。
- source_word: μεγάλαι
  choice: 高大
  rationale: 这里直接描写城的规模；“高大”与“坚固”并列自然，并避免将词义扩展为政治上的“重要”。
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: 这些城全都
  rationale: 保留πᾶσαι的全称含义，并以现代汉语自然语序表达总结性陈述。
