  text: And they crossed the Jordan into the great plain opposite Baisan[a].
translation:
  language: zh_hans
  text: 他们渡过约旦河，来到拜桑[a]对面的大平原。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拜桑”是希腊语地名形式，通常认为就是“伯善”。
    reason: 交代希腊语地名与较常见历史地名的对应关系。
lexical_decisions:
- source_word: διέβησαν
  choice: 渡过
  rationale: διαβαίνω的不定过去时在行程叙事中表示从一边越到另一边；与“约旦河”搭配时，“渡过”自然准确。
- source_word: τὸν Ἰορδάνην
  choice: 约旦河
  rationale: 带冠词的专名指约旦河；现代汉语通常在河名后加“河”，表达清楚自然。
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: 来到……大平原
  rationale: πεδίον指平原或平坦地区，μέγα为“大”；介词εἰς表示进入或到达，译作“来到……大平原”符合现代汉语行程叙事。
- source_word: κατὰ πρόσωπον
  choice: 对面
  rationale: 这一地理方位短语表示与某地相对或面向某地；“对面”简洁保留原文的空间关系。
- source_word: Βαισάν
  choice: 拜桑
  rationale: 按希腊语地名Βαισάν音译，不直接以其通常对应的希伯来地名“伯善”取代；“拜桑”也较贴近希腊语形式。
