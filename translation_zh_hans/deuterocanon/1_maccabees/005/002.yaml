  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: zh_hans
  text: 他们图谋除掉在他们中间的雅各后裔[a]，并开始杀害并铲除百姓中的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅各族类”或“雅各的百姓”。希腊文γένος强调共同血统或亲族关系。
    reason: lexical_alternative
  - marker: b
    text: 希腊文ἐν τῷ λαῷ表达较为紧缩；可理解为“百姓中的人”，也可理解为“在百姓中”进行杀戮和铲除。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: 图谋
  rationale: 未完成时表达持续进行的谋划；结合其敌对目的，“图谋”既自然，也传达蓄意策划的意味。
- source_word: ἆραι
  choice: 除掉
  rationale: αἴρω在此可指拿走、移除；“除掉”保留其强烈敌意，同时不抢先把具体方式完全解释为杀害，因为下文另有明确的杀戮用语。
- source_word: τὸ γένος Ἰακώβ
  choice: 雅各后裔
  rationale: γένος侧重共同血统、宗族或族类。“雅各后裔”保留其谱系和群体身份，又避免现代“种族”一词可能带入的含义。
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: 住在他们中间的
  rationale: 分词短语限定被针对的人，即居住在那些民族中间的雅各后裔；补出“住在”符合上下文，也使现代汉语流畅。
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: 开始杀害
  rationale: ἄρχομαι与不定式表示行动的开始；θανατόω意为杀死或处死，“开始杀害”准确而自然。
- source_word: ἐν τῷ λαῷ
  choice: 百姓中的人
  rationale: 原文短语较为紧缩，可理解为在百姓中间，也可带有从该群体中取人的部分义。正文采用符合汉语习惯的部分式表达，并以脚注保留位置式理解。
- source_word: ἐξαίρειν
  choice: 铲除
  rationale: ἐξαιρέω本可指移除、除去；在“杀害”的暴力语境中，“铲除”体现进一步清除、灭绝的力度，同时与前面的“除掉”有所区分。
theological_decisions:
- issue: τὸ γένος Ἰακώβ所表达的族群—圣约历史身份
  choice: 雅各后裔
  alternative: 雅各族类／雅各的百姓
  rationale: 该称谓以出自雅各的血统来指认犹太群体。译作“雅各后裔”保存其谱系和圣约历史背景，却不引入现代种族分类。
- issue: ἆραι、θανατοῦν与ἐξαίρειν构成的暴力递进
  choice: 除掉……杀害、铲除
  alternative: 毁灭……杀死、根除
  rationale: 原文先说谋划移除，继而说实际杀戮和清除。正文保留这几个动词的区别和逐步增强的力度，不把它们压平为同一个概念。
- issue: ἐν τῷ λαῷ的句法范围和含义
  choice: 百姓中的人
  alternative: 在百姓中杀戮
  rationale: 希腊文表达紧缩，既可能是部分式地指百姓中的成员，也可能是位置式地说在百姓中间行动。正文选择较自然的部分式表达，脚注明示另一可能，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“图谋”“后裔”“铲除”保持经文的历史语感和暴力强度；句式简洁，并通过脚注保留希腊文末句的句法歧义。
