  yaml_path: translation/deuterocanon/1_maccabees/005/034.yaml
  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
translation:
  language: zh_hans
  text: 提摩太营中的人认出他是马加比，就从他面前逃走。马加比重创了他们；那一天，他们当中约有八千人[a]倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多达八千人”；希腊语表达可指约数，也可指达到这一数目。
    reason: 保留εἰς ὀκτακισχιλίους在数目精确度和上限含义上的歧义。
lexical_decisions:
- source_word: ἐπέγνω
  choice: 认出
  rationale: 表示辨认、认清某人的身份；在军事语境中，“认出”准确而自然。
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: 提摩太军营里的人
  rationale: παρεμβολή本指军营，也可借指驻营的军队。汉语若直译“军营认出”较生硬，因此明确其自然所指“军营里的人”，同时保留军营意象。
- source_word: ὁ Μακκαβαῖός
  choice: 马加比
  rationale: 采用现代简体中文中易懂且常见的音译；此处作人物称号或名称，不强行译出希腊语冠词。
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: 从他面前逃跑
  rationale: 保留原文带有闪语色彩的空间表达，同时在现代汉语中仍自然易懂。
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: 重创了他们
  rationale: 这是表示猛烈打击并造成重大伤亡的军事用语；“重创”既传达“击打”和“重大打击”，又避免生硬直译。
- source_word: ἔπεσον
  choice: 倒下
  rationale: 保留战斗语境中“阵亡、倒毙”的委婉军事表达，不将其解释得比原文更明确。
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: 约有八千人
  rationale: 介词εἰς与数词连用可表达达到某数或约数；正文用“约有”自然呈现估算色彩，并以脚注保留另一种可能。
