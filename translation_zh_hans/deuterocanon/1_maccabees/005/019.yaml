  text: And he commanded them[a], saying, “Take care of this people, and do not join battle with the nations until we return.”
translation:
  language: zh_hans
  text: 他吩咐他们说：“你们要照看这百姓[a]，在我们回来以前，不要与列国交战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看守这百姓。”希腊语命令式既可强调保护性的照料，也可表示谨慎留意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 该词表示带有权威的命令或嘱咐；“吩咐”在现代汉语中自然庄重，也保留其权威语气。
- source_word: Πρόσεχετε
  choice: 要照看
  rationale: 与属格“这百姓”连用时，语境重在留心照料和保护，而不只是一般性的注意；“照看”准确传达这一实际责任。
- source_word: τοῦ λαοῦ τούτου
  choice: 这百姓
  rationale: λαός指作为整体的群体；“这百姓”贴近原文的集合单数，同时符合经文语体。
- source_word: μὴ συνάψητε πόλεμον
  choice: 不要……交战
  rationale: συνάπτειν πόλεμον是进入或投入战争的惯用表达；“交战”简洁自然，不额外限定为主动发动战争。
- source_word: πρὸς τὰ ἔθνη
  choice: 与列国
  rationale: ἔθνη在此指周围非犹太各族或各国；“列国”保留其复数及历史语境，又避免直接采用带有较强后期宗教术语色彩的“外邦人”。
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: 在我们回来以前
  rationale: ἕως加冠词不定式表达时间界限；此译自然准确，与“直到我们回来”意义相同。
