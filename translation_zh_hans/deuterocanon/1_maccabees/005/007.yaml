lexical_decisions:
- source_word: συνῆψεν πρὸς αὐτοὺς πολέμους πολλούς
  choice: 多次与他们交战
  rationale: 该短语直译近于“同他们接连进行许多场战争”；现代汉语用“多次与他们交战”自然准确，也保留反复作战之意。
- source_word: συνετρίβησαν πρὸ προσώπου αὐτοῦ
  choice: 他们在他面前溃败
  rationale: συντρίβω在战争语境中表示被击溃、粉碎；“溃败”比字面的“被粉碎”更符合现代汉语军事叙述。“在他面前”保留πρὸ προσώπου αὐτοῦ的表达。
- source_word: ἐπάταξεν αὐτούς
  choice: 他击杀了他们
  rationale: πατάσσω在战斗语境中通常指打击并杀伤或杀死；“击杀”保留其强烈而简洁的军事含义，不弱化为一般的“击打”。
