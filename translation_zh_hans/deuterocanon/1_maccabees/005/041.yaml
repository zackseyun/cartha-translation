  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: zh_hans
  text: 但如果我们渡过去，而他在河那边扎营，我们就渡河向他进发。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到他那里去。”希腊语πρὸς αὐτόν本身可较中性地表示朝向或到某人那里；在这里的战事语境中，也可能指向他进军、与他交战。
    reason: 保留介词短语在中性趋向与敌对进军之间的词义幅度。
lexical_decisions:
- source_word: διέλθωμεν
  choice: 我们渡过去
  rationale: 这是ἐὰν之后的第一人称复数不定过去时虚拟语气，表示将来可能发生的行动；在河流和军事语境中，“渡过去”自然准确。
- source_word: παρεμβάλῃ
  choice: 他……扎营
  rationale: 该动词在军事语境中指安营，且希腊文形式为第三人称单数，因此保留与前一动词“我们”不同的主语，不依照英文咨询层将其改成“我们扎营”。
- source_word: πέραν τοῦ ποταμοῦ
  choice: 在河那边
  rationale: πέραν表示河的另一边或越过河之处；“在河那边”符合现代汉语的空间表达，又不额外限定具体方位。
- source_word: διαπεράσομεν
  choice: 我们就渡河
  rationale: 该将来时动词表示横渡、越过；译出“河”使汉语所指清楚，并与前面的渡河行动形成原文中的重复呼应。
- source_word: πρὸς αὐτόν
  choice: 向他进发
  rationale: πρός本身可表示“向着、到……那里”，战事语境则带有趋近交战的意味；“向他进发”保留方向性和军事色彩，而不把敌对含义强化成明确的“攻击他”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。尤其按希腊文动词的人称区别译作“我们渡过去，而他……扎营”，不追随英文咨询文本把两个动作都归给“我们”；脚注标记置于真正存在歧义的“向他进发”之后。
