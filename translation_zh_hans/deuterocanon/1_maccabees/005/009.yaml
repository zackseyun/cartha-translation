  yaml_path: translation/deuterocanon/1_maccabees/005/009.yaml
  text: And the nations in Gilead gathered together against the Israelites who were within their borders[a], to wipe them out; and they fled into the stronghold at Dathema.
translation:
  language: zh_hans
  text: 基列的各族聚集起来，攻击住在他们边境地区的以色列人，要把他们彻底铲除[a]；以色列人便逃进达特马这座堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要把他们消灭”或“要把他们连根拔除”。希腊文表达的是要将他们彻底除去。
    reason: 说明ἐξᾶραι的词义范围及其完全除灭的强烈语气。
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: 聚集起来
  rationale: 体现复合动词所表达的共同集结，并符合敌对行动的叙事语境。
- source_word: τὰ ἔθνη
  choice: 各族
  rationale: 指基列一带非以色列的周边族群；“各族”直接、自然，也避免把后期特定神学语感强加于此。
- source_word: Γαλααδίτιδι
  choice: 基列境内
  rationale: 以现代中文常用地名“基列”表达该地区，并用“境内”明确地点关系。
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: 攻击……以色列人
  rationale: 介词结构在此表示敌对方向；后面的复数限定成分表明所指是当地的以色列群体。
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: 住在他们境内边疆地区的
  rationale: ἐπὶ τοῖς ὁρίοις 可指边界、边疆或辖境；此译既保留边疆意味，也交代这些以色列人位于那些族群的地域之内。
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: 要把他们彻底铲除
  rationale: 表达目的及完全除灭、移除的强烈意味；“彻底铲除”在现代中文中清楚而有力度。
- source_word: ἔφυγον
  choice: 便逃进
  rationale: 准确表达因受攻击而逃亡，并以“便”自然衔接叙事结果。
- source_word: Δάθεμα
  choice: 达特马
  rationale: 按希腊文地名音译。
- source_word: τὸ ὀχύρωμα
  choice: 堡垒
  rationale: 简明表达设防的军事据点；与地名连用符合自然中文。
