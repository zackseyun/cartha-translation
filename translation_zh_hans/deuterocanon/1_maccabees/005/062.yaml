  text: But they were not from the offspring of those men through whose hand deliverance had been given to Israel[a].
translation:
  language: zh_hans
  text: 但他们并不是那些人的后裔；以色列曾借那些人的手蒙拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借那些人的手”也可译作“借着他们”或“由他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: 但他们
  rationale: δέ承接上文形成对比；“但他们”在现代汉语中清楚自然。
- source_word: ἐκ τοῦ σπέρματος τῶν ἀνδρῶν ἐκείνων
  choice: 并不是那些人的后裔
  rationale: σπέρμα在此表示血统或后代；“后裔”准确保留谱系含义。ἀνδρῶν所指为上文特定男性人物，汉语“那些人”在此并未把所指泛化。
- source_word: ἐδόθη
  choice: 曾……蒙
  rationale: 希腊文为神学被动式“被赐予”；汉语以“蒙拯救”自然表达领受拯救，同时不明说未在句中出现的施事者。“曾”体现回顾既往事件。
- source_word: σωτηρία
  choice: 拯救
  rationale: 此处指历史和军事处境中以色列获得解救；“拯救”既自然，也不必限定为抽象的教义性救恩或单纯的胜利。
- source_word: διὰ χειρὸς αὐτῶν
  choice: 借那些人的手
  rationale: 保留七十士译本常见的施事习语及“手”的具体意象；重复“那些人”可消除汉语代词可能误指本句主语“他们”的歧义。
theological_decisions:
- issue: 历史军事语境中σωτηρία的译法
  choice: 拯救
  alternative: 救恩；解救；胜利
  rationale: 经文所述是以色列在具体历史处境中获得拯救。“拯救”保留语义宽度，既不把它专门化为后世教义术语，也不缩减为军事胜利。
- issue: ἐδόθη的隐含施事者
  choice: 以“蒙拯救”保留未明说的施事者
  alternative: 上帝赐下拯救；获得拯救
  rationale: 原文使用被动语态而未明说施事者，虽可能暗示上帝，译文不宜将其显化，以保留原文的神学张力。
- issue: διὰ χειρὸς αὐτῶν的中介施事表达
  choice: 借那些人的手
  alternative: 借着他们；由他们
  rationale: 保留“手”的经文意象和中介性表达，不把神圣施事与人的参与之间的关系解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号使否定谱系陈述与解释性关系从句之间的逻辑更清楚；“借那些人的手”有意保留七十士译本的经文风格，同时通过重复名词避免代词歧义。
