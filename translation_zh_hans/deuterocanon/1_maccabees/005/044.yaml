  yaml_path: translation/deuterocanon/1_maccabees/005/044.yaml
  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: zh_hans
  text: 他们抢先占领了那城，又放火焚烧神庙的圣区，连同其中所有的人[a]。加尔纳因就此溃败，再也无法当面抵挡犹大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“连同其中所有的一切。”希腊语这句话可以泛指圣区内所有的人和物，但按这里的战事语境，较可能特指其中的人。
    reason: 保留希腊语在所指范围上的真实歧义，避免把可能的人命伤亡无声地解释为仅指物品。
lexical_decisions:
- source_word: προκατελάβοντο
  choice: 抢先占领
  rationale: 该复合动词既有夺取、占领之意，前缀 προ- 又含先行控制的意味；“抢先占领”在中文中自然地保留这两层含义。
- source_word: τὴν πόλιν
  choice: 那城
  rationale: πόλις通常指城或城市；此处承接上下文中的特定地点，用“那城”符合现代汉语叙事习惯。
- source_word: τὸ τέμενος
  choice: 神庙的圣区
  rationale: τέμενος指划归神明的神圣区域或围地，范围不一定只限于庙宇建筑；“神庙的圣区”可避免将其窄化为单一建筑。
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: 放火焚烧
  rationale: 原文以动词和“用火”构成强调性表达；“放火焚烧”既保留明确的纵火意味，也符合自然中文。
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: 连同其中所有的人
  rationale: 该短语在语法上可以广指其中一切所有，但军事叙事语境更自然地指圣区内的人；正文采用较可能的人称理解，同时以脚注保留较宽泛的读法。
- source_word: ἐτροπώθη
  choice: 溃败
  rationale: 被动形式在军事语境中表示被击溃或败退；“溃败”简洁而准确。
- source_word: ἡ Καρναῒν
  choice: 加尔纳因
  rationale: 按希腊文地名音译；句中将该城拟作行动主体，中文可直接说该城“溃败”。
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι
  choice: 再也无法……抵挡
  rationale: ὑποστῆναι在冲突语境中指站稳阵脚、抵抗或承受攻势；“无法抵挡”比直译“无法站立”更清楚。
- source_word: κατὰ πρόσωπον Ἰούδα
  choice: 当面抵挡犹大
  rationale: κατὰ πρόσωπον具有“面对面、在面前”的形象，并在此表达正面对抗；“当面抵挡”兼顾其字面色彩与军事含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神庙的圣区”保留 τέμενος 的空间范围；“当面抵挡”保留原文正面对抗的形象。脚注标记紧接实际存在歧义的短语，而非置于“那城”之后。
