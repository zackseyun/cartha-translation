base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/030.yaml
  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
translation:
  language: zh_hans
  text: 天一亮，他们举目望去，只见一大群人，多得数不清[a]，带着梯子和攻城器械[b]，要攻取这堡垒；他们正与他们交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“人数不可胜数”，也可译作“无数”或“多得数不清”。
    reason: lexical_alternative
  - marker: b
    text: “攻城器械”指攻击堡垒等防御工事时所使用的器械或装置。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: 天一亮
  rationale: 以自然的现代汉语表达清晨来到这一叙事转折，同时保留时间推进。
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν καὶ ἰδοὺ
  choice: 他们抬眼一看，只见
  rationale: “抬眼一看”保留原文的身体动作，“只见”自然传达ἰδού引人注意和场景突现的作用。
- source_word: λαὸς πολὺς οὗ οὐκ ἦν ἀριθμός
  choice: 无数的人
  rationale: 简洁传达人数众多、无法计数之意；λαός在此可指参与围攻的大群人，但原文未直接称其为军队。
- source_word: αἴροντες κλίμακας
  choice: 扛着梯子
  rationale: 描写众人携带攻城梯的持续动作；“扛着”比泛泛的“带着”更符合大型器具的情境。
- source_word: μηχανὰς
  choice: 攻城器械
  rationale: 军事语境中指用于攻击防御工事的机械装置；此译法清楚而不限定具体类型。
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: 要夺取堡垒
  rationale: “要”自然表达不定式的目的，“夺取堡垒”准确呈现攻占坚固据点之意。
- source_word: ἐπολέμουν αὐτούς
  choice: 他们正在攻打众人
  rationale: “正在攻打”保留未完成过去时的持续性；代词主语最自然地回指前述大群人，而宾语回指堡垒中的一方。为避免现代汉语连续两个“他们”造成指代不清，将宾语明示为“众人”。
theological_decisions:
- issue: 末句代词的指代关系
  choice: 将主语理解为前述无数的人，宾语理解为堡垒中的众人
  alternative: 把主语理解为先前叙事中的众人，宾语理解为围攻者
  rationale: 希腊语动词的隐含主语通常顺承最近的复数主体λαὸς πολὺς，宾格αὐτούς则指被攻打的一方；但原句仅用代词，语法上仍存在一定叙事指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬眼一看，只见”保留经文叙述的突现感；“堡垒”“攻城器械”准确体现军事场景。
