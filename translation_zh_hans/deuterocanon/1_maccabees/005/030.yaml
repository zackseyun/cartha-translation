  to: 天一亮，他们举目望去，只见一大群人，多得数不清[a]，带着梯子和攻城器械[b]，要攻取这堡垒；他们正与他们交战。
  rationale: 修订保留原文的叙事节奏、人数不可计数的强调、攻城装备及夺取堡垒的目的。末句改用两个代词对应希腊文的隐含主语和宾语αὐτούς，不将上下文尚未明确的对象擅自解释为“众人”，从而保留原文的指代张力。
