  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: zh_hans
  text: 犹大在犹太地区的亚克拉巴特尼地区同以扫的子孙[a]交战，因为他们正围困着以色列。犹大重重地击败了他们，制伏了他们，并夺取了他们的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以扫的子孙”也可译作“以扫的后裔”，所指很可能是以东人。希腊原文直译为“以扫的儿子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμει
  choice: 攻打
  rationale: 未完成时表示持续进行的军事行动；“攻打”自然简洁，也保留了πρὸς所表达的敌对方向。
- source_word: υἱοὺς Ἠσαῦ
  choice: 以扫的子孙
  rationale: 保留希腊文的族谱式称谓，同时“子孙”在现代汉语中比字面的“儿子们”更适合指后裔群体，不直接替换为解释性的“以东人”。
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: 在犹太地区的亚克拉巴特尼
  rationale: 原文句法压缩，地名可能与“犹太地区”构成地点补充说明。正文采用自然而不过度扩展的地域表达，并在脚注说明另一种理解。
- source_word: περικάθηντο
  choice: 正在围困
  rationale: 该词本义涉及环绕驻守，在这里表示持续的敌对包围。“围困”保留军事压力，但不限定为对某座城的正式围城。
- source_word: τὸν Ἰσραήλ
  choice: 以色列
  rationale: 保留原文集合性单数和圣经中的民族称谓，不改写为较分散的“以色列人”。
- source_word: ἐπάταξεν ... πληγὴν μεγάλην
  choice: 重重地击败了他们
  rationale: 这是表示重大军事打击的惯用结构；译为“重重地击败”兼顾原文力度与现代汉语的自然表达。
- source_word: συνέστειλεν αὐτούς
  choice: 制伏了他们
  rationale: 该动词在军事语境中有压制、削弱或使之屈服之意；“制伏”不暗示彻底消灭，也比“羞辱”更切合战事。
- source_word: τὰ σκῦλα
  choice: 他们的战利品
  rationale: 指战胜后取得的军中掳获物；“战利品”是现代汉语中明确、庄重的对应词。
