  text: And Judas was gathering up those who were falling behind and encouraging the people all along the way[a], until he came into the land of Judah.
translation:
  language: zh_hans
  text: 犹大一路上把落在后面的人[a]聚拢起来，又勉励众人，直到他进入犹大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落在后面的人”也可译作“队伍末后的人”或“掉队的人”。希腊文很可能指行进时落在后面的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγων
  choice: 聚拢起来
  rationale: 表达犹大在行进中持续把分散、落后的人重新集合起来；比正式的“召集”更符合旅途语境。
- source_word: τοὺς ἐσχατίζοντας
  choice: 落在后面的人
  rationale: 该分词指处在队伍末后或逐渐掉队的人；此译自然保留行进中的动态含义，而不把他们限定为正式的后卫。
- source_word: παρακαλῶν
  choice: 勉励
  rationale: παρακαλέω可表示劝勉、鼓励或安慰；在行军语境中，“勉励”兼顾鼓舞士气和敦促坚持的意味。
- source_word: τὸν λαόν
  choice: 众人
  rationale: 原文是“人民／众人”，不是明确的军事术语；“众人”符合当前队伍语境，同时避免缩窄为“军队”。
- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: 一路上
  rationale: 简洁自然地表达这些行动贯穿整个行程，保留κατά在此处的沿途、持续意味。
- source_word: γῆν Ἰούδα
  choice: 犹大地
  rationale: 贴近原文“犹大的土地”，并采用现代中文圣经地名中自然、凝练的表达。
