  text: And they gave orders to those of the force with them[a], and they marched against Jamnia.
translation:
  language: zh_hans
  text: 他们向随行部队中的人下令，然后进军雅姆尼亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向雅姆尼亚进发。”希腊语短语可以只表示朝某地行进，但在这里的军事语境中，很可能含有进攻之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  choice: 下令
  rationale: 该动词表示传达命令或指示；在军事叙事中，“下令”自然、简洁，也准确体现命令语气。
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: 向随行部队中的人
  rationale: δύναμις在此指军事力量、部队；ἀπό带有从整体中指出一部分人的意味，因此译作“部队中的人”，既保留部分关系，又符合现代汉语表达。“随行”对应μετʼ αὐτῶν。
- source_word: ἐπορεύθησαν
  choice: 进军
  rationale: 该动词本义为前往、行进；在军队行动的上下文中，“进军”比一般的“前往”更贴切，同时不超出语境所容许的含义。
- source_word: ἐπὶ Ἰαμνίαν
  choice: 进军雅姆尼亚
  rationale: ἐπί加宾格可表示朝向某地；军事语境可能带有敌对进逼之意。正文用“进军”体现军事行动，同时脚注保留单纯方向性的可能。
- source_word: Ἰαμνίαν
  choice: 雅姆尼亚
  rationale: 采用适合现代普通话的希腊地名音译。
