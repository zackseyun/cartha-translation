  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: zh_hans
  text: 他把他们从加利利和阿尔巴克提斯接走[a]，连同妇女、孩子和他们的一切所有；他们把这些人带进犹太地[b]，满怀喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在“加利利”前用“从”，在“阿尔巴克提斯”前则直译为“在”。本译文按汉语表达合并为“从加利利和阿尔巴克提斯”，但保留原文这一介词差异的说明。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在这里由单数的“他接走”转为复数的“他们带进”；译文依照传世文本保留这一变化，没有将两处统一。
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: 接走
  rationale: 此处指把受威胁的人聚集起来并带往安全之地；“接走”既体现接收、带领之意，也符合现代汉语叙事习惯。
- source_word: ἐκ τῆς Γαλιλαίας
  choice: 从加利利
  rationale: 直接表达离开该地区的来源含义，并采用通行地名“加利利”。
- source_word: ἐν Ἀρβάκτοις
  choice: 在阿尔巴克提斯的人
  rationale: 原文在此使用表示位置的ἐν，而非与前句相同的“从”；译文保留“在”的形式，避免擅自将其协调为“从阿尔巴克提斯”。地名按音译处理。
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: 连同妇女、孩子
  rationale: 原文是“妇女”和“孩子”，没有明确限定为妻子儿女，因此不缩窄其关系。
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: 他们所有的东西
  rationale: 概括其随身物品和财物，保留原文宽泛的指称，同时使用普通读者易懂的现代汉语。
- source_word: ἤγαγον
  choice: 他们把众人带进
  rationale: 忠实保留传世希腊文本由单数“他接走”转为复数“他们带进”的人称数变化，不作协调。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 带进犹太地
  rationale: “进”体现εἰς所含进入某一区域的方向性；“犹太地”为自然、明确的地理名称。
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: 大大欢喜
  rationale: 表达强烈而带有共同庆贺色彩的喜乐，语言简洁庄重。
