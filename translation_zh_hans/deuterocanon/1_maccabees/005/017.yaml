base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/017.yaml
  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
translation:
  language: zh_hans
  text: 犹大对自己的兄弟西门说：“你要为自己挑选一些人，去解救在加利利的弟兄们；我和我的兄弟约拿单则要前往基列地区[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基列”。希腊文Γαλααδῖτις采用的是指基列地区的专门地名形式。
    reason: 说明原文使用较具体的地区名称，并保留较简洁译法的可能性。
lexical_decisions:
- source_word: Ἐπίλεξον σεαυτῷ ἄνδρας
  choice: 你要为自己挑选一些人
  rationale: 保留命令语气和反身与格“为自己”的含义；ἄνδρας直译为“人”，不把上下文所暗示的作战身份明说成“士兵”。
- source_word: ῥῦσαι
  choice: 解救
  rationale: 该动词在此指从现实危险中救出人；“解救”既体现主动搭救，也适合军事威胁的语境。
- source_word: τοὺς ἀδελφούς σου
  choice: 弟兄们
  rationale: 保留原文的亲属称谓及其可能指同胞、族人的语义张力，不直接解释为“犹太同胞”。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: 在加利利
  rationale: 自然表达原文的地点关系，并明确修饰需要获救的弟兄们。
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: 我和我的兄弟约拿单则
  rationale: “则”体现δέ所标示的任务对比；“兄弟”不擅自判断约拿单的长幼。
- source_word: πορευσόμεθα
  choice: 要前往
  rationale: 清楚表达将来的行动安排，比机械直译为“将行走”更符合现代汉语。
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: 前往基列地区
  rationale: Γαλααδῖτις是由“基列”形成的地区名称；“基列地区”既自然，也保留其区域性，不简单压平为“基列”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。两处ἀδελφός/ἀδελφοί分别译为“兄弟”和“弟兄们”：前者避免擅断长幼，后者保留可能兼指同胞或族人的亲属语言。脚注标记置于实际涉及的“基列地区”之后。
