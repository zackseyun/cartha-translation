  text: And the men from the city shut them in and blocked the gates with stones.
translation:
  language: zh_hans
  text: 城里的人把他们困住[a]，又用石头堵住各城门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困住”：原文意为“封闭、隔绝”或“关住”。原文没有说明他们是在城内还是城外，因此不宜译为“挡在外面”。
    reason: 保留ἀπέκλεισαν所表达的封闭、隔绝之意及其空间关系的歧义，避免正文添加“在外面”的解释。
lexical_decisions:
- source_word: ἀπέκλεισαν
  choice: 挡在外面
  rationale: 该动词可表示封闭、隔绝或阻挡。结合下文“用石头堵住城门”，这里最自然地表示城里的人不让他们进城；脚注保留其可能表示“围困、关住”的词义空间。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 直译为“来自城里的人”或“城中的人”。希腊文没有明确限定性别或身份，因此不用“男人”或“守军”，以免过度具体化。
- source_word: ἐνέφραξαν
  choice: 堵住
  rationale: 该动词表示堵塞、封住；与工具格“用石头”及宾语“城门”搭配时，“堵住”准确而自然。
- source_word: τὰς πύλας
  choice: 城门
  rationale: πύλαι为复数，可指一座城的各处城门或整体城门设施。现代汉语通常以集合性单数“城门”自然表达，不强行写作“各城门”。
- source_word: λίθοις
  choice: 用石头
  rationale: 工具格表明石头是堵门所用的材料或手段。
