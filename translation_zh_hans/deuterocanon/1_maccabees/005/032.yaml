  text: And he said to the men of the force[b][a], “Fight today for our brothers.”
translation:
  language: zh_hans
  text: 他对军中的士兵[a]说：“今天要为我们的弟兄[b]而战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军中的男子”“勇士”；希腊文直译为“军队中的男子”。
    reason: lexical_alternative
