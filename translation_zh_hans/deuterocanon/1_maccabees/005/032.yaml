lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: 军中的男子
  rationale: ἀνδράσιν明确指男性，δυνάμεως在这里指军事力量或军队；“军中的男子”既保留原文的性别表述，也自然呈现其军事语境。
- source_word: Πολεμήσατε
  choice: 要……争战
  rationale: 该词是简单过去时命令语气，要求立即投入战斗；“争战”庄重而清楚，适合军事号召。
- source_word: σήμερον
  choice: 今天
  rationale: 直接表达当下行动的紧迫性，是现代汉语的自然对应。
- source_word: ὑπὲρ
  choice: 为
  rationale: 此处表示代表或保护某人而战；“为”简洁自然，同时保留其具体关系可由上下文判断的空间。
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: 我们的弟兄
  rationale: ἀδελφῶν是阳性复数；“弟兄”保留原文的亲属和群体团结意味，同时在此语境中可泛指同胞以色列人。
theological_decisions:
- issue: 阳性亲属称谓的指称范围
  choice: 我们的弟兄
  alternative: 我们的同胞；我们的弟兄姊妹
  rationale: 原文使用阳性复数ἀδελφῶν。正文保留其性别和亲属意象，不扩写为“弟兄姊妹”；脚注说明它在本处可能广义指以色列同胞，以保存原文可能兼具亲属和民族群体意义的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“军中的男子”略带形式对应色彩，用来保留希腊文ἀνδράσιν的男性指称及δυνάμεως的军事含义；命令句用“今天要……争战”表达即时号召。
