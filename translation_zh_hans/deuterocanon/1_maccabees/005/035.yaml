  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: zh_hans
  text: 他转道去了玛阿法，攻打那城，将城攻占，杀了城中所有的男子，夺取城里的战利品，又放火烧了那城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν
  choice: 转道去了
  rationale: 保留动词“偏离原路线、转向”的移动含义；“转道去了”符合现代汉语叙事，也不额外强化为正式进军。
- source_word: Μααφὰ
  choice: 玛阿法
  rationale: 按希腊文地名音译，采用简体中文中自然且可辨识的音节形式。
- source_word: ἐπολέμησεν αὐτήν
  choice: 攻打那城
  rationale: 在攻城语境中自然表达“与之交战”；“那城”明确阴性代词所指的地点，同时不增加原文没有的战况。
- source_word: κατελάβετο αὐτὴν
  choice: 将城攻占
  rationale: 该动词在军事上下文中表示夺取并控制；“攻占”准确承接前面的攻打。
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: 城中所有的男子
  rationale: 保留原文涵盖全部男性的严酷表述；“男子”在本句中比“雄性”自然，而不把范围擅自缩小为士兵。
- source_word: τὰ σκῦλα αὐτῆς
  choice: 城里的战利品
  rationale: σκῦλα指战争中掠取的财物；“战利品”准确、简洁，并与军事语境相称。
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: 放火烧了那城
  rationale: 自然传达动词与ἐν πυρί的明示火焚含义，避免汉语中生硬重复的“用火焚烧”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的历史叙事语体。以“那城”“城中”“城里的”自然处理希腊文连续出现的阴性代词，避免中文指代含混；保留杀尽男子、掠取战利品和焚城的完整行动次序，不淡化暴力，也不添加评价。
