lexical_decisions:
- source_word: ἐπέταξεν
  choice: 下令
  rationale: 表示权威性地发出指令；“下令”简洁自然，符合军事语境。
- source_word: κηρῦξαι
  choice: 宣告
  rationale: 此不定式说明犹大命令执行的事项，并保留由传令者公开宣布的意味。
- source_word: παρεμβολῇ
  choice: 营中
  rationale: 在军事语境中指军营；“营中”准确表达宣布所发生的范围。
- source_word: παρεμβαλεῖν
  choice: 安营
  rationale: 表示驻扎、扎营，并与前面的“营”保持希腊文同源词所形成的呼应。
- source_word: ἕκαστον
  choice: 各人
  rationale: 保留希腊文单数分配性的含义，又不额外限定性别。
- source_word: ἐν ᾧ ἐστιν τόπῳ
  choice: 在自己所在的地方
  rationale: 完整保留原文的处所表达，并让读者看出所指可能是各人当时所处的位置。
