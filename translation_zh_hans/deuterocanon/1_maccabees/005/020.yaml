translation:
  language: zh_hans
  text: 三千人被分派给西门，前往加利利；并且八千人被分派给犹大，前往基列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: 分派给
  rationale: 该动词为被动形式，本义涉及分配、划分；此处指将人员配属给两位统帅。“分派给”自然表达军事人员的调配，同时保留分配之意。
- source_word: ἄνδρες
  choice: 人
  rationale: 希腊文明确说“人”；上下文已表明他们是作战人员，因此不在正文中增译为“士兵”。
- source_word: τρισχίλιοι
  choice: 三千
  rationale: 按原文数字直接翻译。
- source_word: τοῦ πορευθῆναι
  choice: 前往
  rationale: 带冠词的不定式在此表达目的。“前往”准确而自然，不额外加入“进军”等原文未明说的军事色彩。
- source_word: Γαλιλαίαν
  choice: 加利利
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 此处是人物名，采用现代中文圣经传统中通行的译名“犹大”。
- source_word: ὀκτακισχίλιοι
  choice: 八千
  rationale: 按原文数字直接翻译。
- source_word: Γαλααδῖτιν
  choice: 基列
  rationale: 该词指基列地区；采用现代中文圣经传统中通行且简洁的地名译法。
