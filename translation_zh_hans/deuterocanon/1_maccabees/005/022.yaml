  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
translation:
  language: zh_hans
  text: 他追赶他们，直到托勒密的诸城；约有三千名外族人[b]阵亡[a]，他夺取了他们的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约有三千人”也可译作“三千人”；希腊语 εἰς τρισχιλίους ἄνδρας 既可表示约数，也可只表示人数总计。
    reason: lexical_alternative
  - marker: b
    text: “外族人”指敌军中的非以色列各族；有些译本译作“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: 追赶
  rationale: 这是军事叙事中追击败军的常用动词；“追赶”贴近原义，也符合现代汉语。
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: 直到托勒密城的各城镇
  rationale: 保留原文πόλεων的复数，理解为托勒密城所属地区或与之相关的诸城镇；“直到”表达ἕως所标明的追击范围。
- source_word: ἔπεσον
  choice: 阵亡
  rationale: 原义为“倒下”，在战斗语境中指战死；“阵亡”自然明确，而不额外说明具体死法。
- source_word: ἐκ τῶν ἐθνῶν
  choice: 外族人
  rationale: 这里指敌军中的非以色列各族；“外族人”比直译“列国中的人”更自然，也避免带入后期术语色彩。
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: 约有三千人
  rationale: εἰς与数词连用可表示数量总额，也可能带约数意味；正文采用自然的约数表达，并以脚注保留精确计数的可能。
- source_word: τὰ σκῦλα αὐτῶν
  choice: 他们的战利品
  rationale: σκῦλα指战后从敌方夺得的物品；“战利品”准确且符合军事叙事语体，αὐτῶν译作“他们的”。
