  yaml_path: translation/deuterocanon/1_maccabees/005/031.yaml
  text: And Judas saw that the battle had begun[a], and the outcry of the city went up to heaven with trumpet blasts and a great cry.
translation:
  language: zh_hans
  text: 犹大看见战斗已经开始；城中的呼喊声伴着号角声和大声的呼喊，上达于天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“城中的呼喊声随着号角声和大声的呼喊，上达于天。”这里两个希腊语与格可表示方式或手段，也可较宽泛地表示伴随的声音。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρκται
  choice: 已经开始
  rationale: 该词为完成时中被动形式，表示犹大看见时战斗已经开始并正在进行；“已经开始”自然地保留这一时态含义。
- source_word: ὁ πόλεμος
  choice: 战斗
  rationale: πόλεμος虽可指“战争”，但此处指眼前正在发生的一场交战，译作“战斗”更符合语境。
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: 城中的呼喊声
  rationale: κραυγή指响亮的呼喊；属格τῆς πόλεως在这里表示呼喊来自城中。“城中的呼喊声”比生硬的“城的呼喊”更符合现代汉语。
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: 上达于天
  rationale: 保留声音向上直达天际的形象；“上达于天”简洁、庄重，也不把这一表达过度解释为祷告或神学判断。
- source_word: σάλπιγξιν
  choice: 随着号角声
  rationale: 复数与格可表示伴随或方式；汉语补出“声”，清楚表达军用号角正在吹响，同时不改变其伴随关系。
- source_word: κραυγῇ μεγάλῃ
  choice: 和高声呐喊
  rationale: μεγάλῃ在此修饰呼喊的强烈或响亮程度；“高声呐喊”是自然的现代汉语，并保留现场声势。
theological_decisions:
- issue: “上达于天”是否暗示呼喊被上帝垂听
  choice: 保留空间性意象，不作神学说明
  alternative: 译作“传到天空”或明确说“传到上帝那里”
  rationale: 希腊文本只说声音上达οὐρανός，并未明确陈述上帝垂听；译文应保留可能的修辞与神学张力，不替原文作结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上达于天”保留原文的垂直意象；“号角声”和“高声呐喊”使军事场景在汉语中清楚自然。脚注标记放在所说明的整句声音描写之后。
