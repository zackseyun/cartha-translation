  text: And they sent letters to Judas and his brothers[a], saying, “The nations around us have gathered together against us to destroy us,”
translation:
  language: zh_hans
  text: 他们写信给犹大和他的兄弟们，说：“我们周围的各族已经聚集起来攻击我们，要把我们除灭[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把我们铲除”。
    reason: 希腊词ἐξαίρω本义可指移走、清除；在这里的敌对语境中含彻底消灭之意。
lexical_decisions:
- source_word: ἀπέστειλαν γράμματα
  choice: 写信
  rationale: 按汉语书信语境合并表达“派送书信”，比逐字译作“发送书信”更自然，同时完整保留行动含义。
- source_word: Ἰούδαν
  choice: 犹大
  rationale: 采用中文圣经传统中该人名的通行译法。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: 他的兄弟们
  rationale: 上下文所指是犹大的男性兄弟和共同领袖，不扩展为性别中性的“手足”。
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: 已经聚集起来
  rationale: 体现完成时迂回结构：聚集的行动已经发生，其结果持续到说话时。
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  choice: 我们周围的各族
  rationale: 这里主要指周边非犹太族群；“各族”自然传达历史和族群意义，又避免赋予“外邦人”较强的后期神学色彩。
- source_word: ἐφʼ ἡμᾶς
  choice: 攻击我们
  rationale: 介词短语在敌对聚集的语境中表示“针对、反对我们”；译出“攻击”使现代汉语语义明确。
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: 要把我们除灭
  rationale: 目的不定式表示敌对行动的目标；“除灭”兼具消灭和彻底清除之意，符合上下文而保持庄重。
theological_decisions:
- issue: τὰ ἔθνη在次经历史叙事中的译法
  choice: 各族
  alternative: 外邦人
  rationale: 本处强调周边族群的民族—政治身份，并非在阐述后期形成的神学范畴；“各族”较少引入额外含义。
- issue: ἀδελφοί的性别指向
  choice: 兄弟们
  alternative: 手足
  rationale: 叙事所指是犹大的男性兄弟，因此采用性别准确的表达。
- issue: ἐξᾶραι所表达的敌对目的
  choice: 除灭
  alternative: 铲除
  rationale: 保留其可指移除、清除并在此语境中引申为彻底消灭的张力，不将其弱化为一般性的“赶走”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“写信”符合当代汉语习惯；“除灭”保留经文的严肃力度。引号在本节独立呈现时闭合，句意则可由下一节继续展开。
