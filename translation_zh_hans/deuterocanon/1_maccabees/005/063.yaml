  text: And the man Judas and his brothers were greatly glorified before all Israel and all the nations, wherever their name was heard.
translation:
  language: zh_hans
  text: 犹大和他的弟兄们，在全以色列和凡听闻他们名字的各国中，都备受尊崇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“犹大”前直译为“那人犹大”（ὁ ἀνὴρ Ἰούδας），是一种与专名同位的表达；中文正文为自然起见未逐字保留。“凡听闻他们名字的各国中”也可译作“无论在何处听闻他们的名字”。
    reason: 说明原文“那人犹大”的同位表达，并交代末句地点范围的句法。
lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: 犹大这人
  rationale: 保留原文在专名“犹大”前明确使用的ἀνήρ，同时采用现代汉语中较自然的同位表达；此处指男性个人，并非泛指人类，也没有充分依据译作“勇士”。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的兄弟们
  rationale: 按上下文指犹大的男性弟兄，直译清楚自然。
- source_word: ἐδοξάζοντο σφόδρα
  choice: 备受尊崇
  rationale: 被动形式表示他们从别人那里得到荣耀、尊敬；“备受尊崇”既体现σφόδρα的强烈程度，也比汉语中的“被大大荣耀”更自然。
- source_word: ἐναντίον παντὸς Ἰσραὴλ
  choice: 在全以色列……中
  rationale: ἐναντίον在这里表示处于众人面前或众人的评价之中；中文以“在……中”表达其社会声望语境。
- source_word: τῶν ἐθνῶν πάντων
  choice: 各国人
  rationale: ἔθνη在此历史语境中指以色列之外的各国或各族人民；“各国人”避免将其过度神学化为“外邦人”。
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: 所有听闻他们名声的
  rationale: 关系副词οὗ与未完成时被动ἠκούετο表达他们的名字传到之处；汉语“听闻他们名声”传达该习语所隐含的声誉广传之意，同时没有改写成更强的“威名”。
