  yaml_path: translation/deuterocanon/1_maccabees/005/046.yaml
  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: zh_hans
  text: 他们来到以弗仑。这是一座位于入口处[a]的大城，极其坚固。人无法从城旁向右或向左绕行，只能从城中穿过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“位于隘口”或“位于进路上”。希腊语表明以弗仑控制着入口通道，因此人无法绕城而行。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: 他们来到以弗仑
  rationale: ἕως与地名连用表示抵达该处；汉语“来到以弗仑”自然表达行程达到的地点。Ἐφρών按地名音译。
- source_word: αὕτη ἡ πόλις μεγάλη
  choice: 这是一座……大城
  rationale: 明确译出αὕτη“这”，并以现代汉语判断句自然呈现对该城的描述。
- source_word: ἡ τῆς εἰσόδου
  choice: 位于入口处
  rationale: 该属格短语可能指入口、通道或进路，说明以弗仑扼守交通入口；正文采用自然且较贴近字面的“入口处”，以脚注保留其他可能。
- source_word: ἰσχυρὰ σφόδρα
  choice: 极其坚固
  rationale: ἰσχυρά用于城邑时侧重防御坚强；“极其”对应σφόδρα的加强语气。
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: 人无法从城旁向右或向左绕行
  rationale: 此无人称结构表示不可能；ἐκκλῖναι在语境中是转向避开、绕行。“从城旁”使ἀπ’ αὐτῆς所指的绕城路线在汉语中清楚。
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: 只能从城中穿过
  rationale: ἀλλ’ ἢ表达唯一选择，διὰ μέσου强调从其当中通过；译文保留路线必须穿城而行的战术含义。
