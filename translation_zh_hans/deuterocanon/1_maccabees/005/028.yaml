  yaml_path: translation/deuterocanon/1_maccabees/005/028.yaml
  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
translation:
  language: zh_hans
  text: 犹大和他的军队突然转而走旷野的路，往波索尔去。他攻下那城，用刀剑杀尽所有男性[a]，夺走他们的一切战利品，又放火烧了那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在刀剑之口”，是表示用刀剑杀死的惯用语。
    reason: 保留原文闪语式习语的字面形象，并说明其实际含义。
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: 转道
  rationale: 表示改变行进方向；“转道”符合军事行动语境，也避免“返回”所暗示的撤退之意。
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 他的军队
  rationale: παρεμβολή可指营地，也可转指驻营的部队；此处作为与犹大共同移动的主语，译作“军队”在现代汉语中更自然。
- source_word: ὁδὸν εἰς τὴν ἔρημον εἰς Βοσὸρ
  choice: 经旷野向波索尔进发
  rationale: 希腊文结构压缩，包含道路、旷野及目的地方向；此译保留行经旷野并朝波索尔前进的空间关系，而不强行断定已经抵达。
- source_word: ἄφνω
  choice: 突然
  rationale: 直接表达行动的突发与出其不意。
- source_word: κατελάβετο
  choice: 攻下
  rationale: 在夺取城市的军事语境中，“攻下”准确而自然。
- source_word: πᾶν ἀρσενικόν
  choice: 所有男性
  rationale: 原文明确是“每一个雄性／男性”，范围比“所有男人”更广；译文保留其严峻而不加淡化。
- source_word: ἐν στόματι ῥομφαίας
  choice: 用刀锋
  rationale: 原文直译为“在刀剑之口”，是七十士译本常见的闪语式表达；“用刀锋”传达以刀剑杀戮的实际含义，同时由脚注保存字面形象。
- source_word: πάντα τὰ σκῦλα αὐτῶν
  choice: 他们的一切战利品
  rationale: σκῦλα指战争中掠取的财物；“战利品”清楚、庄重，并保留πάντα的全面性。
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: 放火烧了那城
  rationale: 现代汉语以“放火烧”自然表达动词与“用火”的强调；代词所指为前述城市，明译为“那城”可避免歧义。
theological_decisions: []
