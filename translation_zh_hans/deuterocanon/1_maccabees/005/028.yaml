  to: 犹大和他的军队突然转而走旷野的路，往波索尔去。他攻下那城，用刀剑杀尽所有男性[a]，夺走他们的一切战利品，又放火烧了那城。
  rationale: 修订明确译出ὁδός“道路”，并以“转而走旷野的路，往波索尔去”保留原文紧凑而略有歧义的路线描述，不将其过度解释为已抵达波索尔。将“用刀锋杀了”调整为“用刀剑杀尽”，使中文更自然，并完整保留πᾶν ἀρσενικόν的全面范围及“刀剑之口”习语所指的杀戮方式。
