base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/018.yaml
  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
translation:
  language: zh_hans
  text: 他把撒迦利亚的儿子约瑟、民众的领袖亚撒利雅和其余的军队留在犹太地区，负责守卫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责守卫”也可译作“负责看守”或“负责保护”。希腊语εἰς τήρησιν强调警戒、守护。
    reason: 说明目的短语的词义范围，并保留“看守、保护”等合理译法。
lexical_decisions:
- source_word: κατέλιπεν
  choice: 留在
  rationale: 基本义为“留下、留在某处”；这里指他出征时把这些人和军队留在犹太，并不明确表示正式任命。
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: 撒迦利亚的儿子约瑟
  rationale: τὸν τοῦ加属格是以父名标明身份的希腊语表达；此译自然清楚。
- source_word: Ἀζαρίαν
  choice: 亚撒利雅
  rationale: 采用现代中文圣经人名中常见的音译形式。
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: 民众的领袖
  rationale: ἡγούμενος可指带领者或治理者；“领袖”保留其宽泛含义，不擅自规定为行政长官或军事统帅。希腊文为阳性单数，位置上最自然地修饰亚撒利雅，因此译文不将约瑟也明确列为领袖。
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: 和其余的军队
  rationale: ἐπίλοιπος表示“其余的、剩下的”，δύναμις在此军事语境中指军队或兵力；“其余的军队”符合现代中文表达。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太
  rationale: 采用该地名的通行中文译法，并与“留在”自然搭配。
- source_word: εἰς τήρησιν
  choice: 负责守卫
  rationale: τήρησις强调看守、守护；此处表达留下人员和兵力的目的。“守卫”比“防御”更贴近原词，同时符合军事语境。
theological_decisions:
- issue: “民众的领袖”所修饰的人物
  choice: 仅明确修饰亚撒利雅
  alternative: 将约瑟和亚撒利雅二人都译为民众的领袖
  rationale: 原文ἡγούμενον为阳性单数，且紧接亚撒利雅，因此最自然的句法关系是同位修饰亚撒利雅。译文遵从原文数与位置，不按英语咨询文本改为复数。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他把……留在……”清楚呈现原句行动与目的；人名和地名使用简体中文读者较熟悉的圣经译名。脚注标记置于所解释的“负责守卫”之后。
