translation:
  language: zh_hans
  text: 西门前往加利利，与外邦人多次交战；外邦人在他面前被击溃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 进入
  rationale: 该动词本义为“去、前往”；结合 εἰς 所表达的进入某一区域的方向，合译为“进入”，自然且不额外加入“进军”的军事含义。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 加利利
  rationale: 与“进入”搭配，准确表达前往并进入加利利地区。
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: 多次交战
  rationale: συνάπτειν πόλεμον 是投入战斗、交战的惯用表达；“多次交战”比“发动许多战争”更自然，也更贴合叙事语境。
- source_word: πρὸς τὰ ἔθνη
  choice: 与列国
  rationale: πρός 在敌对语境中表示交战对象；现代汉语通常说“与……交战”。ἔθνη 指周围非犹太族群，译作“列国”既保留群体含义，也避免直接加入神学色彩较浓的“外邦人”。
- source_word: συνετρίβη
  choice: 溃败了
  rationale: 该词字面有“被击碎、被摧毁”之意，在军事叙事中“溃败”自然传达彻底受挫的强烈语气，又避免把交战群体描写成字面上被压碎。
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: 在他面前
  rationale: 保留原文“从他面前／面对他”的闪语式表达所呈现的临阵败退意象；汉语“在他面前溃败”自然通顺。
