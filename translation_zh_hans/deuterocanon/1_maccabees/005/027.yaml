  yaml_path: translation/deuterocanon/1_maccabees/005/027.yaml
  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: zh_hans
  text: 在基列其余的城中，他们正被困住了[a]。明天，敌军将向这些堡垒扎营[b]，攻占它们，并在一天之内把他们全都除灭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被困住了”也可译作“被围住了”或“受困”。希腊文着重于他们受制、无法脱身的处境，不一定特指正式的围城行动。
    reason: lexical_alternative
  - marker: b
    text: “将”也可译作“准备”或“即将”；原文表达临近实施的意图。
    reason: lexical_alternative
  - marker: c
    text: “全都除灭”也可译作“全部消灭”或“尽数除去”；原文语气强烈，表示彻底除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν
  choice: 其余的城
  rationale: λοιπός表示“其余、剩下的”；此处承接上文，译作“其余的城”简洁自然。
- source_word: τῆς Γαλααδίτιδος
  choice: 基列
  rationale: 指基列地区；采用现代中文圣经地名的通行形式。
- source_word: συνειλημμένοι
  choice: 被困住了
  rationale: 完成时被动态表示在敌对压力下受围困、被限制而无法脱身的状态；不强行限定为正式的围城行动。
- source_word: εἰς αὔριον
  choice: 明天
  rationale: 在此为直接的时间表达。
- source_word: πάσονται
  choice: 准备
  rationale: 结合后接不定式，表达即将实行的意图或安排；译作“准备”既体现临近性，也不把它简化为单纯将来时。
- source_word: παρεμβαλεῖν ἐπὶ τὰ ὀχυρώματα
  choice: 在各堡垒外安营
  rationale: παρεμβάλλω保留军事上的扎营、列营意象，ἐπί在敌对语境中表示针对这些堡垒；中文用“在……外安营”自然传达围攻态势。
- source_word: τὰ ὀχυρώματα
  choice: 各堡垒
  rationale: ὀχύρωμα指设防之处或堡垒；复数在中文中以“各堡垒”清楚表达。
- source_word: καταλαβέσθαι
  choice: 攻占
  rationale: 此处指夺取并控制设防地点；“攻占”符合军事语境。
- source_word: ἐξᾶραι
  choice: 消灭
  rationale: 在战争语境中，以人为宾语时表示彻底除去；“消灭”保留其强烈程度，又不额外规定具体手段。
- source_word: ἅπαντας αὐτοὺς
  choice: 把他们全部
  rationale: 保留ἅπαντας所强调的全体性。
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: 在一天之内
  rationale: 强调全部行动要在短短一天内完成。
