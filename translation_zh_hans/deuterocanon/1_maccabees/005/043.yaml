  yaml_path: translation/deuterocanon/1_maccabees/005/043.yaml
  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
translation:
  language: zh_hans
  text: 他先渡过去，到他们那里[a]；他的众人都在他前面。各民族都在他面前被击溃；他们丢下所有兵器，逃进了卡尔纳因的圣所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他们进攻”。希腊语πρὸς αὐτούς既可表示“到他们那里”或“朝向他们”，在这里的军事语境中也可带有敌对含义。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣域”“神庙院区”。希腊语τέμενος指分别出来作神圣用途的区域或圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: 渡过去
  rationale: 该动词表示从一边越到另一边；“渡过去”保留越过某处的动态，但不擅自说明所跨越的是河流还是其他地形。
- source_word: πρὸς αὐτούς
  choice: 到他们那里
  rationale: πρός加宾格可表示朝向某人，在军事语境中也可能含有敌对的“向他们进攻”之意；正文保留方向性，脚注说明另一可能。
- source_word: πρότερον
  choice: 先
  rationale: 简洁表达他比其余人更早渡过去或率先行动，同时不消解随后“众人在他前面”所形成的叙事张力。
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: 他所有的人
  rationale: λαός在此指随同他的队伍，但字面范围比“军队”宽；译作“他所有的人”既自然，也避免过度收窄。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 走在他前面
  rationale: 明确表达空间位置，忠实保留众人在领袖前方这一细节。
- source_word: συνετρίβησαν
  choice: 被击溃
  rationale: 被动形式描写决定性的军事失败；“被击溃”符合现代汉语战争叙事，也保留原文的被动语态。
- source_word: πάντα τὰ ἔθνη
  choice: 各族的人
  rationale: ἔθνη可指列国、各民族，也常在本书语境中指非犹太族群；“各族的人”保留群体意义，不强行加入神学化的“外邦人”。
- source_word: ἔρριψαν πάντα τὰ ὅπλα αὐτῶν
  choice: 丢下所有兵器
  rationale: 表达败军抛弃武器的动作；“兵器”比“装备”更贴合ὅπλα在此处的军事含义。
- source_word: τέμενος
  choice: 圣所
  rationale: τέμενος指划作神圣用途的区域、圣域或圣所；“圣所”简洁自然，脚注保留“神庙院区”等较具体的可能。
- source_word: ἐν Καρναΐν
  choice: 卡尔纳因
  rationale: 按希腊地名音译，并以“的圣所”自然表达圣所位于该地。
