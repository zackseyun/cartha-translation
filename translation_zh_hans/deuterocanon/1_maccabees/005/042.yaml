  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: zh_hans
  text: 犹大走近那条季节性河道[a]时，就把民众的文书官[b]部署在河道边，吩咐他们说：“不要让任何人扎营，要让所有人都投入战斗。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“急流”“溪流”或“河床”。希腊语所指的是一条季节性水道，雨季可能有水，旱季可能干涸。
    reason: lexical_alternative
  - marker: b
    text: “民众的文书官”也可能指为军队服务的行政人员或记录员；原文的具体职务范围并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: 走近
  rationale: 自然表达向某处接近的叙事动作，对应希腊语的普通趋近动词。
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: 季节河道
  rationale: χειμάρρους指雨季有水、旱季可能干涸的急流或河床；“季节河道”兼顾水道与地貌含义。τοῦ ὕδατος在汉语中不宜机械译作“水的”，其语义已包含在“河道”中。
- source_word: ἔστησεν
  choice: 安排
  rationale: 此处指把人员布置在特定地点执行任务；“安排在”自然且保留部署之意。
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: 民众的文书官
  rationale: γραμματεῖς字面与书写、记录职务有关，但在军政语境中可能是行政人员；“文书官”既保留其文字职能，也不武断限定具体军阶。
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: 在河道边
  rationale: ἐπί加属格在这里表示位于该地或其旁；按中文地貌表达译作“在河道边”。
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: 不要让任何人扎营
  rationale: ἀφῆτε加不定式表示禁止容许某行为；παρεμβαλεῖν在军事语境中意为安营。“任何人”自然涵盖希腊语单数泛指ἄνθρωπον。
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: 要让所有人都投入战斗
  rationale: 保留命令所有人参战的意思；“投入战斗”比逐字的“来到战斗中”更符合现代汉语，同时呈现进入当前战事的动态。
