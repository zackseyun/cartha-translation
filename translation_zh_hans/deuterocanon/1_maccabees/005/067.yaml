  yaml_path: translation/deuterocanon/1_maccabees/005/067.yaml
  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: zh_hans
  text: 那一天，祭司们未经商议[b]便出战，在战斗中阵亡，因为他想表现英勇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做一件英勇的事”或“显示勇武”。这个希腊动词指表现勇武或英勇行为。
    reason: lexical_alternative
  - marker: b
    text: 或译：“未加谋划”或“贸然”。希腊文直译为“没有经过商议”，也可指没有审慎筹划。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: 倒下了
  rationale: 这是战场上死亡的常用委婉说法；译作“倒下了”既保留军事语体，也不过度直译为“被杀”。
- source_word: ἱερεῖς
  choice: 有些祭司
  rationale: 原文为不带冠词的复数，指祭司群体中的若干人；“有些祭司”在现代汉语中自然，也避免误解为全体祭司。
- source_word: πολέμῳ
  choice: 在战斗中
  rationale: 与“倒下”连用，表达死亡发生的情境，比“被战争”更符合现代汉语。
- source_word: βουλομένου αὐτοῦ
  choice: 因为他想
  rationale: 属格独立结构可表达伴随情形或原因；此处采用因果表达，同时严格保留原文第三人称单数“他”，不擅自改成复数或指定所指。
- source_word: ἀνδραγαθῆσαι
  choice: 显显英勇
  rationale: 该动词指表现勇武、做出英勇之举；此译自然地传达主动展示勇气、求取英名的意味，又避免生硬的性别化直译。
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν εἰς τὸν πόλεμον
  choice: 他们……便出战了
  rationale: 带宾格主语的冠词不定式在此说明事情发生的情形；“出战”简洁地涵盖“出去进入战斗”。
- source_word: ἀβουλεύτως
  choice: 未经商议
  rationale: 保留“没有谋议、没有经过筹划”的核心词义，不直接收窄为仅仅“鲁莽”。
theological_decisions:
- issue: βουλομένου αὐτοῦ 中 αὐτοῦ 的所指
  choice: 译作单数“他”，不点明其身份
  alternative: 按上下文意译为“他们想显显英勇”，或明确指定某位领袖
  rationale: 现有希腊文本明确使用单数属格代词，而本节自身没有交代先行词。保留单数和指代上的张力，避免按译本传统或上下文推测擅自消解。
- issue: βουλομένου 属格独立结构的逻辑关系
  choice: 译为原因“因为他想”
  alternative: 译为时间或伴随关系“当时他想”
  rationale: 该结构语义上可以表示伴随情形，也可以带原因意味；结合后面的贸然出战，因果表达较顺畅，但不在译文中补充原文没有说明的动机或责任归属。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“倒下了”保留战场语感；“显显英勇”略带主动表现勇武的意味，与上下文中的贸然行动相呼应。分号用于理清原文较为纠结的句法，同时保留单数“他”与复数“他们”之间真实存在的指代张力。
