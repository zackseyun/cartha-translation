  yaml_path: translation/deuterocanon/1_maccabees/005/011.yaml
  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
translation:
  language: zh_hans
  text: 他们正准备前来抢占[a]我们逃来避难的堡垒；提摩太率领着他们的军队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢占”也可译作“预先占领”。希腊文动词强调先发夺取或占据。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“军营”，也可转指驻营的军队。
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: 正准备
  rationale: 分词与εἰσιν构成迂回式现在时，表示准备工作正在进行；“正准备”在现代汉语中自然地传达这一持续状态。
- source_word: προκαταλαβέσθαι
  choice: 抢占
  rationale: 该复合动词含预先占取、抢先控制之意；“抢占”既体现敌对夺取，也保留先发占领的意味，而不强加一个希腊文未明说的比较对象。
- source_word: τὸ ὀχύρωμα
  choice: 堡垒
  rationale: ὀχύρωμα指设防并可据守之处；“堡垒”符合本节逃入其中避难及面临攻占的语境。
- source_word: εἰς ὃ κατεφύγομεν
  choice: 我们逃来避难的
  rationale: καταφεύγω不只是逃跑，也包含投奔某处寻求庇护之意；“逃来避难”简明保留动作与目的。
- source_word: ἡγεῖται
  choice: 率领着
  rationale: 该词表示居首带领，在军事语境中可指统率；“率领着”贴近现在时表达，又不过度限定正式军衔或指挥体制。
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: 他们的军队
  rationale: παρεμβολή本义可指军营，也可转指驻营的军队。此处作为ἡγεῖται的对象，以“军队”表达提摩太所率领的武装力量最为自然，并以脚注保留“军营”的字面可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正准备前来”保留原文正在筹备行动的语气；分号对应两个并列分句。脚注分别处理προκαταλαβέσθαι的先发意味及παρεμβολή在“军营／军队”之间的语义幅度。
