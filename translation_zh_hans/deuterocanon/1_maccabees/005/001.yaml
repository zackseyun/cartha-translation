  yaml_path: translation/deuterocanon/1_maccabees/005/001.yaml
  text: And it happened that when the surrounding nations heard that the altar had been rebuilt and the sanctuary rededicated as before, they became very angry.
translation:
  language: zh_hans
  text: 周围各国听说祭坛已经重建，圣所也照从前重新奉献，就十分愤怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ……听说……就……
  rationale: 这是带有闪语色彩的叙事承接公式。现代汉语若直译为“事情发生了，当……时”会显得生硬；以“……就……”自然表达时间推进和结果关系，同时不增加原文没有的信息。
- source_word: τὰ ἔθνη κυκλόθεν
  choice: 周围各国
  rationale: τὰ ἔθνη 指周边的非犹太民族或政治群体；κυκλόθεν 表示地理上的四周。“周围各国”简洁保留原文的空间和群体含义，又避免以“外邦人”预先强化宗教身份。
- source_word: ᾠκοδομήθη τὸ θυσιαστήριον
  choice: 祭坛已经重建
  rationale: 动词字面可指“建造”，但本段历史语境是祭坛遭毁坏后的恢复，因此译作“重建”；“已经”清楚表达这是他们听闻时已经完成的行动。
- source_word: ἐνεκαινίσθη τὸ ἁγίασμα
  choice: 圣所也……重新奉献
  rationale: ἐγκαινίζω 在圣殿语境中表示更新并举行奉献礼。“重新奉献”比泛指修复的“更新”更准确；τὸ ἁγίασμα 译作“圣所”，指神圣场所。
- source_word: ὡς τὸ πρότερον
  choice: 照从前
  rationale: 保留恢复到先前状态的比较意义，措辞简洁庄重。
- source_word: ὠργίσθη σφόδρα
  choice: 十分愤怒
  rationale: 准确传达强烈愤怒的程度；既符合现代汉语，又不过度渲染为“暴怒”等更强措辞。
theological_decisions:
- issue: τὰ ἔθνη 在犹太历史叙事中的所指
  choice: 周围各国
  alternative: 周围的外邦人；四周的各族
  rationale: 原文直称“各国／各民族”，上下文表明是犹太地周围的非犹太群体。“各国”保留政治与民族层面的开放性，不把后期宗教术语“外邦人”的色彩强加给原文。
translation_notes:
  register: 采用现代、清楚而庄重的叙事文体。省去希腊语—闪语式公式“事情发生了，当……时”的机械直译，以汉语的“听说……就……”呈现同一叙事关系；保留“祭坛”“圣所”“奉献”等礼仪用语。
