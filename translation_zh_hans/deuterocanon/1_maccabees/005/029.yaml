lexical_decisions:
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 该不定过去时动词在这里表示离开一处并启程；“出发”自然简洁，符合行军叙事。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 直接表达出发地点，符合现代汉语习惯。
- source_word: νυκτός
  choice: 夜里
  rationale: 属格作副词用，表示行动发生在夜间；“夜里”简洁自然。
- source_word: ἐπορεύετο
  choice: 一路前行
  rationale: 未完成时突出持续进行的移动；“一路前行”既体现延续性，也保持庄重流畅。
- source_word: ἕως ἐπὶ
  choice: 直到
  rationale: 在此标明行程所达到的终点；“直到”与持续性的“前行”自然衔接。
- source_word: τὸ ὀχύρωμα
  choice: 那座堡垒
  rationale: ὀχύρωμα指设防之处或坚固据点；“堡垒”保留军事语境，又不限定具体建筑形制。
