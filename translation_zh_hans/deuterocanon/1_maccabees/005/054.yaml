  yaml_path: translation/deuterocanon/1_maccabees/005/054.yaml
  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
translation:
  language: zh_hans
  text: 他们满怀欢欣和喜乐，上了锡安山；又献上全燔祭[a]，因为直到他们平安归来，他们中没有一人阵亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“燔祭”。希腊语所指的祭物要在祭坛上全部焚烧。
    reason: 说明祭祀术语的确切含义及较简洁的译法。
lexical_decisions:
- source_word: ἀνέβησαν
  choice: 上了
  rationale: 保留前往锡安山的上行含义，同时符合现代汉语表达。
- source_word: τὸ ὄρος Σιὼν
  choice: 锡安山
  rationale: 采用通行的圣经地名译法，准确而简洁。
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: 满怀欢欣和喜乐
  rationale: 分别表达两个近义的喜乐名词，不将原文的并列表达合并为一个词。
- source_word: προσήγαγον
  choice: 献上
  rationale: 在祭祀语境中指把祭物带来奉献；“献上”自然地传达礼仪行为。
- source_word: ὁλοκαυτώματα
  choice: 全燔祭
  rationale: “全”明确这种祭物完全焚烧献上的特征；“燔祭”则保留通行的祭祀术语。
- source_word: οὐκ ἔπεσεν ἐξ αὐτῶν οὐθεὶς
  choice: 他们中没有一人阵亡
  rationale: 原文“倒下”在军事语境中指战死；“阵亡”在现代汉语中清楚自然，并保留“没有一人”的强调。
- source_word: ἕως τοῦ ἐπιστρέψαι ἐν εἰρήνῃ
  choice: 直到他们平安归来
  rationale: 准确表达时间界限，并以“平安归来”保留ἐν εἰρήνῃ既有平安、也有安然无恙的语义。
theological_decisions:
- issue: ὁλοκαυτώματα的祭祀术语
  choice: 全燔祭
  alternative: 燔祭
  rationale: 经文叙述得胜归来后在圣所献祭。“全燔祭”明确祭物全部焚烧献上的特性，又不引入后世或宗派性的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“满怀欢欣和喜乐”保留原文两个近义名词的并列；以分号呈现上锡安山与献祭之间的叙事推进。
