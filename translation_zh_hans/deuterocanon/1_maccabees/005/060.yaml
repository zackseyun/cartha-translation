  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
translation:
  language: zh_hans
  text: 约瑟和亚撒利雅溃败了；他们被追赶，直到犹太地的边界。那一天，以色列民中阵亡的约有两千人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“倒下……达到两千人”；这种与数词连用的说法很可能表示约数，因此译作“约有两千人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  choice: 溃败了
  rationale: 该词在军事语境中表示被击溃、败退；“溃败”既保留战事含义，也自然衔接下文遭追赶的情形。
- source_word: ἐδιώχθησαν
  choice: 敌人追赶他们
  rationale: 希腊文为被动式，意为他们遭到敌对追击。汉语改用带泛指主语的主动句，使表达自然，又不具体指认原文未明说的追兵。
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: 直到犹太的边界
  rationale: ἕως表示所达之处，ὅρια复数指疆界或边界；译文保留其空间终点含义。
- source_word: ἔπεσον
  choice: 阵亡
  rationale: 在战事叙述中，πίπτω的“倒下”惯指战死。现代汉语用“阵亡”清楚传达语境所含之意。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 自然、准确地表达标准时间短语。
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: 以色列民中
  rationale: ἐκ在此标明死者出自以色列百姓；“……民中”符合现代汉语习惯。
- source_word: εἰς δισχιλίους ἄνδρας
  choice: 约有两千人
  rationale: εἰς与数词连用可表示达到某一总数或约数；“约有”保留这种并非严格精确计数的语感。
