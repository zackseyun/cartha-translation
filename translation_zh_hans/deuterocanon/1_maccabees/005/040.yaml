base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: zh_hans
  text: 犹大和他的部队正逼近那条溪谷[a]时，提摩太对自己军队的将领说：“如果他先渡到我们这边，我们就无法抵挡他，因为他必会胜过我们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“水的急流（或溪流）”。这里很可能指雨季有水的溪谷或季节性水道，而不是大河。
    reason: cultural_note
  - marker: b
    text: 或较直译为“他必能对付我们”。按上下文，意思是犹大会压倒他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τιμόθεος
  choice: 提摩太
  rationale: 采用现代汉语圣经传统中通行的希腊人名译法。
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: 自己军队的将领
  rationale: ἄρχοντες 在军事语境中指有指挥权的人；δύναμις 此处指武装部队。
- source_word: ἐν τῷ ἐγγίζειν
  choice: 正逼近
  rationale: 保留该结构所表达的同时发生与逐渐接近之意，并使叙事自然紧凑。
- source_word: παρεμβολὴν
  choice: 营队
  rationale: 该词既可指营地，也可转指驻营的队伍；“营队”保留两者之间的语义联系，且适合此处行军场景。
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: 溪谷
  rationale: 该短语字面涉及有水流的急流或沟谷，通常指雨季有水的季节性水道；“溪谷”比“河流”更符合地貌，又比音译“瓦迪”易懂。
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: 抢先渡到我们这边
  rationale: διαβαίνω 表示渡过水道，πρότερος 表示先于对方采取行动；“抢先”自然呈现战术上的先机。
- source_word: ὑποστῆναι
  choice: 抵挡
  rationale: 此处意为在战斗中站立抵抗对手，“抵挡”简洁而符合军事语境。
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: 必能胜过我们
  rationale: 希腊文表达较为压缩，近于“能对付我们”；上下文指犹大会占上风，但脚注保留较直译的可能。
- source_word: Ἰούδαν
  choice: 犹大
  rationale: 采用马加比人物在汉语圣经传统中的通行译名。
