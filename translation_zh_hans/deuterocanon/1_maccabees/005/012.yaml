  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
translation:
  language: zh_hans
  text: 所以现在，请你来救我们脱离他们的手[a]，因为我们中间已有许多人倒下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脱离他们的手”也可译作“脱离他们的控制”。“手”在希腊文中是表示权势或控制的常用说法。
    reason: lexical_alternative
  - marker: b
    text: “倒下”在这里可能指阵亡、战败，或兼有两者的意思；希腊文没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
  choice: 所以现在
  rationale: 同时保留 νῦν 的时间意味和 οὖν 的推论、承接意味，符合紧急求援的语气。
- source_word: ἐλθὼν
  choice: 请来
  rationale: 虽为不定过去时分词，句中与命令式 ἔξελου 连用，汉语自然表达为直接请求“请来救我们”。
- source_word: ἔξελου
  choice: 救
  rationale: ἐξαιρέω 在此指使人脱离危险或敌对控制；“救”简明自然，并与后面的“脱离”共同表达其含义。
- source_word: ἐκ χειρὸς αὐτῶν
  choice: 脱离他们的手
  rationale: 保留希腊文“手”的权势隐喻；现代汉语虽略带经文色彩，但意思仍清楚。
- source_word: πέπτωκεν
  choice: 已经倒下了
  rationale: 保留 πίπτω 完成时的结果状态和“倒下”这一原始意象，不武断限定为阵亡或战败。
- source_word: ἐξ ἡμῶν
  choice: 我们中间
  rationale: 贴近字面“从我们当中”，清楚表明倒下者属于说话群体。
- source_word: πλῆθος
  choice: 许多人
  rationale: πλῆθος 表示数目众多；“许多人”在现代汉语中自然，并保留数量强调。
theological_decisions:
- issue: πέπτωκεν 在军事语境中是否明确指死亡
  choice: 译作“已经倒下了”，不明确限定
  alternative: 译作“已经阵亡了”或“已经被打败了”
  rationale: 希腊文本可使人联想到死亡、战败或二者兼有，但本身没有进一步限定，故保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句用“请”体现求援语气；保留“他们的手”的原文隐喻，并以脚注解释。所有脚注标记均置于正文相应位置。
