  yaml_path: translation/deuterocanon/1_maccabees/005/051.yaml
  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: zh_hans
  text: 他以刀刃杀尽所有男子[a]，将那城连根拔除[b]，夺取城的战利品，又穿过那城，从被杀者的尸身上走过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在剑之口”，是指用刀刃杀戮的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“将那城彻底铲除”；原文保留了从根拔起的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: 杀尽
  rationale: 在军事语境中表示使人灭亡；与“所有男子”连用时，“杀尽”自然、明确，也保留动作的彻底性。
- source_word: πᾶν ἀρσενικόν
  choice: 所有男子
  rationale: 保留原文全面且明确指向男性的范围，不泛化或弱化。
- source_word: ἐν στόματι ῥομφαίας
  choice: 用刀刃
  rationale: 原文直译为“在刀剑之口”，是以刀剑杀戮的惯用说法；“用刀刃”在现代汉语中自然，并保留刃口意象。
- source_word: ἐξερρίζωσεν
  choice: 连根拔除
  rationale: 保留动词“从根拔起”的鲜明意象；宾语指语法上为阴性的“城”，语境中表达彻底毁除。
- source_word: αὐτήν
  choice: 那城
  rationale: 代词回指前文语境中的城市；汉语明说“那城”比单用“它”更清楚。
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: 城中的战利品
  rationale: σκῦλα指战争中夺取的财物；“战利品”庄重、清楚，并明确其军事语境。
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: 穿过那城
  rationale: 忠实表达经过、穿行城市，不额外加入“行军”等原文未明说的信息。
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: 从被杀的人身上走过
  rationale: 明确保留ἐπάνω“在……上面”和完成被动分词“被杀的人”的惨烈画面，避免较含混的“越过死者”。
theological_decisions:
- issue: 暴力措辞及毁灭范围
  choice: 直陈“杀尽所有男子”“连根拔除”，完整保留军事暴力及其范围。
  alternative: 弱化为“击败”“攻克”，或淡化“连根拔除”的毁灭意味。
  rationale: 希腊文措辞明确而严厉；译文不应减轻其残酷程度，也不应扩大到原文未提及的人群。
translation_notes:
  register: 采用现代、庄重而直白的叙事语言。用“男子”保留性别范围，用“战利品”体现军事语境；末句调整汉语语序为“从被杀的人身上走过，穿过那城”，以自然表达原文两个彼此关联的介词结构，同时不淡化尸体遍地的画面。
