  yaml_path: translation/deuterocanon/1_maccabees/005/061.yaml
  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
translation:
  language: zh_hans
  text: 众人遭遇了一场大溃败[a]，因为他们没有听从犹大和他弟兄们的话，以为自己能英勇作战[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众人遭到惨败”，也可理解为“众人惊慌溃逃”；希腊文指转身逃跑，因而有“溃败”之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“以为自己能显出英勇来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή
  choice: 大溃败
  rationale: 该词在军事语境中指转身逃溃、阵势崩溃；“大溃败”既表达败退，也保留其严重程度。
- source_word: λαός
  choice: 众人
  rationale: 原文直指“人民、众人”，在本段语境中是参战群体；不用“军队”以免过度限定。
- source_word: οὐκ ἤκουσαν
  choice: 没有听从
  rationale: ἀκούω接属格在此不只是听见，而含有听取、遵从之意；“没有听从”符合失败原因的叙事语境。
- source_word: Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: 犹大和他弟兄们
  rationale: 采用《马加比一书》人物名的通行译法“犹大”；ἀδελφοί在此指其兄弟，译为“弟兄们”自然且准确。
- source_word: οἰόμενοι
  choice: 以为
  rationale: 表达他们行动背后的主观判断或设想，不把此判断说成事实。
- source_word: ἀνδραγαθῆσαι
  choice: 英勇立功
  rationale: 该动词表示勇敢行事或以英勇表现建立功绩；此译兼顾勇武行动与自我显扬的语境。
- source_word: αὐτοί
  choice: 凭自己也能
  rationale: 用“凭自己”传达强调代词所突出的自主、自恃意味；“也能”使现代汉语表达流畅。
theological_decisions:
- issue: 溃败与未听从犹大等人之间的因果关系
  choice: 以“因为”明确表达因果
  alternative: 将ὅτι较宽泛地译为叙事说明，如“原来”
  rationale: ὅτι在此自然引出溃败的原因。译文保留叙事者的历史评价，但不进一步引申为经文未明说的教义判断。
- issue: 对众人动机的评价色彩
  choice: 译为“反以为凭自己也能英勇立功”
  alternative: 译为较中性的“以为自己会表现英勇”
  rationale: 原文的强调代词αὐτοί与上下文形成反差，显示其自恃；“反”呈现这种语篇对照，但不把他们的动机扩展为特定神学罪名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“大溃败”保留军事现场感；“没有听从”自然呈现劝告未被采纳；末句保留αὐτοί的强调和原文对众人自信的含蓄批评。
