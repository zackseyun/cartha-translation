  to: 众人遭遇了一场大溃败[a]，因为他们没有听从犹大和他弟兄们的话，以为自己能英勇作战[b]。
  rationale: 修订收敛了末句中原文未明确表达的“立功”“凭自己”和转折色彩，以“英勇作战”对应勇敢行事的基本含义，并保留αὐτοί的强调。首句微调为更自然的现代汉语，同时维持τροπή所指的大规模败退。脚注锚点及其顺序完整保留。
