  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
translation:
  language: zh_hans
  text: 城中的男子安营，并在那一整天和整整一夜攻打那城；那城就被交到他[a]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“在他手中”，其中“他”为单数。有些译本为配合前面的复数主语而译作“他们手中”。
    reason: 说明原文末句由前文复数行动者转为单数代词，并保留这一重要的指代张力。
lexical_decisions:
- source_word: παρενέβαλον
  choice: 安营
  rationale: 保留该动词“扎营、安营”的具体军事含义，不擅自扩展为列阵或进攻。
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: 城中的男子
  rationale: ἄνδρες明确指男子；直译所属关系，也保留原文中这些男子随后“攻打那城”所形成的难解张力。
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: 攻打那城
  rationale: ἐπολέμησαν加直接宾语表达与该城交战；现代汉语用“攻打”自然明确，同时不删去原文的宾语。
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: 整整一天一夜
  rationale: 以自然简洁的汉语表达持续了那一整天和整夜，并保留重复ὅλην所强调的完整时段。
- source_word: παρεδόθη
  choice: 被交到
  rationale: 保留希腊文的被动语态，不明说交城者是谁。
- source_word: ἐν χερσὶν αὐτοῦ
  choice: 他手中
  rationale: 忠实保留αὐτοῦ的第三人称单数，不因前文复数主语而改成“他们手中”。
theological_decisions:
- issue: 末句代词由复数行动者转为单数
  choice: 保留“他手中”
  alternative: 改为“他们手中”以配合前文复数主语
  rationale: 希腊文αὐτοῦ明确为单数。其所指虽未在本节内明说，译文不宜替原文消解这一指代张力。
- issue: “城中的男子”却“攻打那城”的表面张力
  choice: 按现存希腊文保留两处“城”
  alternative: 删去“那城”或将前者泛化为军队中的人
  rationale: 原文同时有οἱ ἄνδρες τῆς πόλεως与ἐπολέμησαν τὴν πόλιν。尽管表意难解，缺乏充分依据时不应在译文中静默改写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“整整一天一夜”比逐字重复“那一整天和整整一夜”更符合现代汉语，同时保留持续时间的强调；原文中难解的主语与宾语关系未被擅自修平。
