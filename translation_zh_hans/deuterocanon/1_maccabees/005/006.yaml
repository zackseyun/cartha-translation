  text: And he crossed over against the sons of Ammon[a], and found a strong force and a large people[b], with Timothy leading them.
translation:
  language: zh_hans
  text: 他越过，去攻打亚扪人[a]，遇见强大的兵力[b]和许多民众，提摩太作他们的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“亚扪的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 直译“一只有力的手”；这里指强大的兵力或武装力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: 渡河
  rationale: 该动词表示越过或横渡；本节虽未明说所越过的是河流，但军事行进语境和汉语自然表达支持“渡河”。由于具体地形在希腊文本中省略，译文不进一步指明河名。
- source_word: ἐπὶ
  choice: 去攻打
  rationale: ἐπί在此军事行动语境中表示带敌意地朝向某方；“去攻打”自然传达这一敌对方向，比单纯的“到……那里”更符合上下文。
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: 亚扪人
  rationale: 希腊文直译为“亚扪的子孙”；现代汉语通常用族名“亚扪人”，清楚而自然，直译形式另列脚注。
- source_word: χεῖρα κραταιὰν
  choice: 一支强大的军队
  rationale: 字面为“一只有力的手”，但χείρ在军事语境可指兵力或武装力量。“一支强大的军队”表达此处的实际含义，同时在脚注保留原文意象。
- source_word: λαὸν πολύν
  choice: 许多民众
  rationale: λαὸν πολύν字面指数量众多的人民；译作“许多民众”避免将其与前面的军事力量完全等同，也不擅自限定为军队。
- source_word: ἡγούμενον αὐτῶν
  choice: 由提摩太率领他们
  rationale: ἡγούμενον表示居领导地位。“率领”适合军事语境，又不比原文更具体地规定正式军衔或指挥体制。
