  text: And they said[a], “Let us also make a name for ourselves[b], and let us go to fight against the nations around us.”
translation:
  language: zh_hans
  text: 他们说：“让我们也为自己扬名[a]，并去与我们周围的各国作战[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“为自己造一个名”，意思是为自己赢得声望。
    reason: 说明希腊原文习语的字面形式和实际含义。
  - marker: b
    text: 或译“我们周围的外邦人”。希腊语这个词在此语境中可指周围的非犹太族群。
    reason: 保留 ἔθνη 在“各国”和“外邦人”之间的语义幅度。
lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  choice: 为自己扬名
  rationale: 这一短语直译是“为自己造一个名”，实际表示取得名声。“为自己扬名”既自然地表达该习语，又保留主动追求声望的意味。
- source_word: καὶ αὐτοὶ
  choice: 我们也
  rationale: 在直接引语中，αὐτοὶ 带强调意味；“我们也”简洁表达他们也想仿效别人有所作为。
- source_word: πορευθῶμεν πολεμῆσαι πρὸς
  choice: 去攻打
  rationale: πορευθῶμεν 是劝勉语气“让我们去”，πολεμῆσαι 表示交战；合译为“去攻打”符合现代汉语军事语境，也没有把行动弱化为一般冲突。
- source_word: τὰ ἔθνη
  choice: 各族
  rationale: ἔθνη 可指各国、各民族，语境中特指周围的非犹太族群。“各族”保持其历史民族含义，同时避免加入后世宗教术语色彩。
- source_word: τὰ κύκλῳ ἡμῶν
  choice: 我们周围的
  rationale: 直接表达这些族群与说话者之间的周边地理关系。
theological_decisions:
- issue: “造一个名”的习语意义
  choice: 正文译作“为自己扬名”
  alternative: 为自己造一个名；为自己赢得声望
  rationale: “扬名”在现代汉语中清楚自然，并保留追求名望的内涵；脚注说明其字面形式，以保存原文的圣经式表达。
- issue: ἔθνη 的身份含义
  choice: 各族
  alternative: 列国；外邦人
  rationale: 本节主要叙述周边族群间的军事行动。“各族”保留希腊词的宽泛意义，不把原文可能隐含的非犹太身份绝对化；脚注交代“外邦人”这一语境性理解。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。两个并列的劝勉式动词用“要……，去……”连贯表达；避免生硬重复“让我们”，同时保留共同倡议的语气。
