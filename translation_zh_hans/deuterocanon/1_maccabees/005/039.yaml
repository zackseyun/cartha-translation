  yaml_path: translation/deuterocanon/1_maccabees/005/039.yaml
  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
translation:
  language: zh_hans
  text: 阿拉伯人已经受雇来帮助他们，并在溪流对岸[a]扎营，准备前来与你交战[b]。犹大便去迎战他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“急流对岸”。希腊词可指季节性水流、急流，也可指其河床。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文的“你”是单数，反映这是向犹大转述的直接报告。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄραβες
  choice: 阿拉伯人
  rationale: 这是直接的族群称谓，也是现代汉语中自然、通行的表达。
- source_word: μεμίσθωνται
  choice: 已经受雇
  rationale: 该词为完成时中间／被动形式，表示因报酬而受雇且当时处于受雇状态；不额外明说“雇佣兵”，以免过度具体化。
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: 来帮助他们
  rationale: 自然表达受雇的目的，同时保留“向他们提供援助”的基本含义。
- source_word: παρεμβάλλουσιν
  choice: 扎营
  rationale: 该动词在军事语境中指安营；希腊文虽为现在时，这里描述报告当时的军事态势。
- source_word: πέραν τοῦ χειμάρρου
  choice: 在溪谷那边
  rationale: χείμαρρος可指季节性急流，也可指其河床或谷地；“溪谷”适合近东地貌，又避免采用现代汉语中较陌生的音译地理术语。
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: 准备前来与你交战
  rationale: 兼顾前来的动作、敌对方向和作战目的，并以单数“你”保留传话直接针对犹大的形式。
- source_word: εἰς συνάντησιν αὐτῶν
  choice: 去迎战他们
  rationale: 在明确的军事上下文中，“迎战”自然传达前去与敌军相遇并对抗的意思。
