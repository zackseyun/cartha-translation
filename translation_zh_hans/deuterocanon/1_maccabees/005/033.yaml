  yaml_path: translation/deuterocanon/1_maccabees/005/033.yaml
  text: And he went out against them in three divisions from outside them[a]; and they sounded the trumpets and cried out in prayer.
translation:
  language: zh_hans
  text: 他率领三支队伍，从外面向他们出击；他吹响号角[a]，他们在祷告中呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里是单数：“他吹响号角”；随后转为复数：“他们在祷告中呼喊。”
    reason: 说明原文由单数动词转为复数动词的语法变化；正文保留这一变化。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出战
  rationale: 该动词本义为“出去”，但在此军事叙事中指向敌方出动；“出战”自然表达语境中的敌对行动，又不增添具体战术细节。
- source_word: ἐν τρισὶν ἀρχαῖς
  choice: 率领三队人马
  rationale: ἀρχή在此可指有组织、受指挥的军事编队。“三队人马”清楚传达三支战术队伍，同时避免把该词限定为“三名指挥官”。
- source_word: ἔξωθεν αὐτῶν
  choice: 从他们外围
  rationale: 直译为“从他们外面”。“从他们外围”保留空间关系及其一定的模糊性，不擅自具体化为营地、阵地或某一方向。
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: 他吹响号角
  rationale: 按所据希腊文本保留单数动词“他吹响”，并用“号角”表达军事信号；后句则照原文转为复数主体。
- source_word: ἐβόησαν
  choice: 众人便……呼喊
  rationale: 该词表示大声呼叫；“呼喊”保留声音的强烈程度。补出“众人”是为在现代汉语中自然表达希腊文的复数动词。
- source_word: ἐν προσευχῇ
  choice: 在祷告中
  rationale: 直接保留介词结构所表达的方式或情境，既可理解为他们以呼喊祷告，也不将其窄化为特定形式的恳求。
theological_decisions:
- issue: 是否在ἐξῆλθεν的译文中明确军事行动
  choice: 出战
  alternative: 出去
  rationale: 上下文是战斗叙事，单译“出去”会弱化行动性质；“出战”使语境含义清楚，但不扩写攻击方式。
- issue: ἐσάλπισεν的单数与ἐβόησαν的复数之间的人称转换
  choice: 正文保留“他吹响……众人……呼喊”
  alternative: 将前句协调为“他们吹响号角”
  rationale: 所据希腊文本明确先用单数、继而用复数。保留这一转换可忠实呈现原文中的语法张力，不因追求表面一致而将其抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“三队人马”适合古代军事场景；“从他们外围”有意保留原文空间表达的含混，不具体化为“营外”或“阵地外”。
