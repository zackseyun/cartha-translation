  yaml_path: translation/deuterocanon/1_maccabees/005/038.yaml
  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: zh_hans
  text: 犹大派人去侦察营地；他们向他报告说：“你们周围的各族都已聚集起来，来对付他们[a]，兵力极其强大。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“对付他们”。这份报告中的人称搭配在上下文里有些出人意料（“你们周围……对付他们”）；本译文保留传世文本的措辞，没有顺改为“对付你们”或“我们周围”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派人去
  rationale: 在叙事语境中自然表达“差派”；希腊文未明说宾语，但侦察行动隐含所派的是人员。
- source_word: κατασκοπῆσαι
  choice: 侦察
  rationale: 准确传达军事侦察、探查敌方情况的含义，现代汉语自然且不显生硬。
- source_word: τὴν παρεμβολήν
  choice: 营地
  rationale: παρεμβολή在军事语境中通常指驻扎的营盘或营地。
- source_word: ἀπήγγειλαν
  choice: 回来向他报告
  rationale: 表达侦察者带回消息并呈报的动作；“回来”由侦察任务的叙事流程自然引出。
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: 都聚集起来
  rationale: 体现完成时迂回结构所表达的结果状态：已经集结，并仍处于集结状态。
- source_word: πρὸς αὐτοὺς
  choice: 要对付他们
  rationale: 军事语境下πρός表示敌对指向；保留αὐτούς的第三人称复数，不按上下文改成“你们”或“我们”。
- source_word: πάντα τὰ ἔθνη
  choice: 各族
  rationale: 此处指周边不同族群或民族政治群体；“各族”比“外邦人”较少附加神学色彩，也比“各国”更适合古代地方族群语境。
- source_word: τὰ κύκλῳ ὑμῶν
  choice: 你们周围的
  rationale: 保留原文第二人称复数ὑμῶν，不协调为“我们周围的”。
- source_word: δύναμις πολλὴ σφόδρα
  choice: 兵力极其强大
  rationale: δύναμις在军事叙事中指兵力或武装力量；σφόδρα以“极其”表达强烈程度。
theological_decisions:
- issue: 报告中人称代词的异常搭配
  choice: 保留“你们周围……对付他们”
  alternative: 按上下文顺译为“你们周围……对付你们”或“我们周围……对付我们”
  rationale: 传世希腊文本明确使用第二人称复数ὑμῶν与第三人称复数αὐτούς。虽在上下文中显得突兀，译文不应擅自协调，以保留真实的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“侦察营地”“兵力极其强大”符合军事语境；脚注说明原文代词异常，正文则不擅自消除歧义。
