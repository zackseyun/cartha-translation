  text: And they met the Nabateans[a], and they greeted them peaceably, and they told them everything that had happened to their brothers in Gilead,
translation:
  language: zh_hans
  text: 他们遇见纳巴泰人，就以和平的态度迎接这些人[a]，并把他们弟兄在基列所遭遇的一切告诉了纳巴泰人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就平安地与他们相会”或“就以和平的态度接待他们”。希腊语动词可指前去相迎、相会或接待；副词强调和平、非敌对的态度。
    reason: 保留ὑπαντάω与εἰρηνικῶς组合在具体动作和措辞上的可能性，同时不改变原文中“他们”对纳巴泰人所作行动的主宾关系。
lexical_decisions:
- source_word: συνήντησαν
  choice: 遇见了
  rationale: 直译叙事中的相遇，不暗示敌意或偶然性过强。
- source_word: Ναβαταίοις
  choice: 纳巴泰人
  rationale: 采用现代中文对该族名的通行译名。
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  choice: 纳巴泰人友好地迎接他们
  rationale: 希腊语动词可指前去相迎或迎接；副词表明和平、非敌对的态度。根据前后代词所指，明确补出主语“纳巴泰人”，使中文清楚自然。
- source_word: διηγήσαντο
  choice: 告诉了
  rationale: 表示叙述、详述；“把……都告诉了”在现代中文中自然，并由宾语保留完整陈述的意味。
- source_word: ἅπαντα τὰ συμβεβηκότα
  choice: 所遭遇的一切
  rationale: 保留ἅπαντα的周全范围，并以“遭遇”体现这些事临到他们；未具体限定事件性质。
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: 他们的弟兄
  rationale: 保留原文的亲属称谓及其群体认同意味，不直接解释为“犹太同胞”。
- source_word: ἐν τῇ Γαλααδίτιδι
  choice: 在基列
  rationale: 采用该地区名称的通行圣经译法，简洁自然。
