lexical_decisions:
- source_word: προκατελάβε
  choice: 攻占了
  rationale: 该复合动词在此军事叙事中表示夺取并控制一处地方。“攻占”自然传达武力夺取城邑之意；前缀 προ- 在本句中未必需要另译为“预先”。
- source_word: Ἰαζὴρ
  choice: 雅谢
  rationale: 采用现代中文圣经传统中易于辨识的地名音译。
- source_word: θυγατέρας
  choice: 所属的村镇
  rationale: “女儿”在古代地理表达中指隶属于中心城邑的较小聚落。正文按实际所指译为“所属的村镇”，并以脚注保留原文意象。
- source_word: ἀπέστρεψεν
  choice: 返回
  rationale: 该动词表示转回或返回；“返回”符合简洁的军事叙事语体。
- source_word: Ἰουδαίαν
  choice: 犹太地
  rationale: 此处指希腊化时期的犹太地区；“犹太地”既准确又符合中文圣经地名习惯。
