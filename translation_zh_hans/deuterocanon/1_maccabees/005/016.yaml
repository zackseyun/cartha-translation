base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: zh_hans
  text: 犹大和民众听见这些话[a]，就举行了一次大型集会，商议该为那些正处于困苦、又遭敌人攻击的弟兄[b]做些什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些话”也可译作“这些消息”或“这些事”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指同属犹太民族、正陷于困苦并遭受攻击的同胞。
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: 听见……，就
  rationale: ὡς与不定过去时在此引出时间从句；中文用“……，就……”自然呈现叙事的先后关系，但不额外强调“立刻”。
- source_word: Ἰούδας καὶ ὁ λαός
  choice: 犹大和众人
  rationale: Ἰούδας按次经中文惯例译为“犹大”；ὁ λαός在此泛指与他同在的民众，并非专指军队，故译“众人”。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: λόγους字面为“话”，在语境中也可指消息或报告；正文保留较贴近原文且自然的“这些话”，并以脚注说明其他可能。
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: 召开了一个大会
  rationale: ἐκκλησία在此指公共集会，不是后期基督教意义的“教会”；μεγάλη表示规模大。“召开了一个大会”符合现代汉语表达，并传达众人聚集成会的意思。
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: 共同商议……做些什么
  rationale: βουλεύσασθαι表示商议、谋划，τί ποιήσωσιν是间接审议问句；“商议……做些什么”保留尚待决定的语气。“共同”使大会集体商议的含义在中文中清楚。
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: 弟兄
  rationale: ἀδελφοῖς是阳性复数亲属称谓，此处指同属犹太民族的人；正文保留“弟兄”，脚注交代其群体性含义。
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: 正遭受苦难
  rationale: θλίψις可指压迫、患难或困苦；“遭受苦难”自然庄重，表达他们身处严重困境。
- source_word: πολεμουμένοις ὑπʼ αὐτῶν
  choice: 被敌人攻击
  rationale: πολεμουμένοις是被动分词，表示遭受敌对军事行动。原文ὑπʼ αὐτῶν直译“被他们”，其指代须由上文确定；中文若直译“被他们攻击”容易指向犹大和众人，故采用语境明确而不过度具体化的“被敌人攻击”。
theological_decisions:
- issue: ἐκκλησία在前基督教犹太历史语境中的译法
  choice: 大会
  alternative: 会众／集会／教会
  rationale: 此处是为商议援助同胞而召集的公共大会；译为“教会”会引入后期制度与神学含义。“大会”兼顾规模和正式议事性质。
- issue: ἀδελφοῖς的群体范围与性别表达
  choice: 弟兄
  alternative: 同胞／犹太同胞／弟兄姊妹
  rationale: 原文使用阳性复数“弟兄”，但语境指同一民族共同体成员。正文保留源语称谓，不将范围擅自扩写或缩窄；脚注说明其实际所指。
- issue: ὑπʼ αὐτῶν的代词指向
  choice: 被敌人攻击
  alternative: 被他们攻击
  rationale: 希腊文保留“他们”的回指，语境自然指前文敌对的外族。现代中文直译会产生明显误指风险，因此用“敌人”表达语境所指，同时不具体指定某一民族。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“召开大会、共同商议”适合正式公共议事场景；避免将ἐκκλησία译为带有后期基督教专门含义的“教会”。所有脚注标记均置于相应正文词语之后。
