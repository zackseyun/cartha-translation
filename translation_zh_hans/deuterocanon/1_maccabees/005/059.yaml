  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: zh_hans
  text: 哥尔吉亚和他的部下从城里出来，要迎战他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出来
  rationale: 准确表达从城内向外移动；汉语叙事中无需强行区分英语的 came out 与 went out。
- source_word: πόλεως
  choice: 城
  rationale: πόλις可指城市或城镇；“城”既自然，又保留有城防据点意味的军事场景。
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: 他的部下
  rationale: 原文直指“他的人”；结合战斗语境，“部下”自然地表达其所率人员，同时避免将原文明确化为技术性的“士兵”。
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: 迎……他们
  rationale: 该短语表示出去与对方相遇；在军事语境中用“迎”保留主动出城相接的动作。
- source_word: εἰς πόλεμον
  choice: 战
  rationale: 与前面的“迎”合成现代汉语常用的“迎战”，简洁表达为交战而出去相遇，完整保留敌对和战斗意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哥尔吉亚和他的部下”在汉语中共同作主语，清楚反映希腊文中哥尔吉亚与其人马一同出城；将两个目的性短语整合为“要迎战他们”，避免生硬重复，同时不增加原文没有的神学或军事细节。
