    text: 原文没有说明他们不肯开启什么；意思可能是既不准进入，也不准通行。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: 和平的话
  rationale: 直译该短语，同时保留外交交涉中和平、无敌意的语气；现代汉语自然易懂。
- source_word: Διελευσόμεθα
  choice: 我们要经过
  rationale: 此处指有意从对方领土通行；“经过”简洁自然，并准确表达穿越之意。
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: 好回到自己的地方
  rationale: 冠词不定式表示目的。“好”清楚表达目的；ἀπέρχομαι结合叙事情境可自然译作“回到”，但不额外增添具体地理含义。
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: 没有人会伤害你们
  rationale: κακοποιέω在军事与外交语境中表示加害或恶待；“伤害”准确、简明。
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: 我们只会徒步经过
  rationale: 保留“用脚”这一形象，以自然汉语译为“徒步”；“只会”体现πλήν所强调的单纯通行，不将其解释为技术性的骑乘对比。
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: 他们不肯向他开放
  rationale: 保留原文“开”的宾语未明这一特点，不擅自补成城门、城市或道路；脚注说明其可能涉及准入或通行。
