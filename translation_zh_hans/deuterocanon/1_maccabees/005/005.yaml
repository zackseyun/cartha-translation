  yaml_path: translation/deuterocanon/1_maccabees/005/005.yaml
  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: zh_hans
  text: 他们被他困在塔楼中；他在他们面前安营，把他们置于毁灭的禁令之下[a]；又用火将那城的塔楼连同其中所有的人一并焚烧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们列为当灭之人”。希腊语此词不只是“咒诅”，而是指把人或物置于禁令之下，归于毁灭。
    reason: 说明ἀνεθεμάτισεν含有禁令和归于毁灭的特殊语义，并提供较接近传统经文用语的替代译法。
  - marker: b
    text: 原文此处使用阴性单数代词，直译为“她的塔楼”，很可能指上下文中的那座城。
    reason: 说明αὐτῆς的单数形式及其最可能的指代对象；正文的“那城”属于上下文导向的解释性表达。
lexical_decisions:
- source_word: διεκλείσθησαν
  choice: 被他困在
  rationale: 该被动式表示他们因他的行动而被封闭、限制在塔楼内；“困在”自然地表达受围困而无法脱身的处境，同时不擅自具体化军事手段。
- source_word: πύργους
  choice: 塔楼
  rationale: 保留该词通常的建筑含义；上下文已足以显明其防御用途，无须扩译为“堡垒”。
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: 他安营攻打他们
  rationale: παρέβαλεν本指扎营，ἐπʼ αὐτούς赋予敌对指向；此译既保留安营的具体图景，也传达围攻语境。
- source_word: ἀνεθεμάτισεν
  choice: 把他们置于必遭毁灭的禁令之下
  rationale: 该词并非单指咒骂，而有置于禁令之下、归于毁灭的含义；此译保留其带有宗教色彩的战争用语，同时以脚注说明。
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: 放火焚烧
  rationale: 以自然汉语传达“使之着火”及“用火”的强调，避免生硬重复为“用火烧”。
- source_word: αὐτῆς
  choice: 那城的
  rationale: 原文为阴性单数代词，最可能指上下文中的城；明示“那城”可在汉语中保留单数所指，避免误解为“他们的塔楼”。
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: 连同里面所有的人一起烧了
  rationale: 完整表达πᾶσιν的全体范围，并以“里面”自然承接塔楼，明确其中的人也遭焚烧。
theological_decisions:
- issue: 圣战语境中ἀνεθεμάτισεν的译法
  choice: 把他们置于必遭毁灭的禁令之下
  alternative: 把他们尽行毁灭；咒诅他们；把他们列为当灭之物
  rationale: 原词兼有“置于禁令之下”和“归给毁灭”的宗教意味。所选译法不把它弱化成普通咒骂，也不径直等同于毁灭行动本身；脚注保留“当灭之物”这一较凝练但不够日常的替代说法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“塔楼”“安营攻打”“放火焚烧”保留原文具体军事图景；对较难直译的ἀνεθεμάτισεν采用正文释义加脚注的方式，既方便普通读者理解，也不抹平其宗教和战争语义。
