  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
translation:
  language: zh_hans
  text: 他想起巴延的子孙[a]所行的恶；他们在路上伏击百姓，成了百姓的网罗和绊脚石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴延”也可音译为“拜安”；希腊文专名Βαιάν有不止一种音译方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: 想起
  rationale: 这里指犹大回想起先前的敌对恶行，并由此采取行动；“想起”自然、准确。
- source_word: κακίας
  choice: 所行的恶
  rationale: κακία可指邪恶、恶意或恶行；结合叙事语境，译作“所行的恶”既保留宽广的道德含义，也表明这是针对百姓的实际侵害。
- source_word: υἱῶν Βαιάν
  choice: 巴延的子孙
  rationale: υἱοί加专名在此可指由某祖先得名的宗族或群体；“子孙”比字面的“儿子们”更符合现代汉语族群称谓，同时不把具体关系说得过细。Βαιάν按希腊语形式音译为“巴延”。
- source_word: παγίδα
  choice: 网罗
  rationale: 保留παγίς作为诱捕工具的比喻性和文学色彩，并与“绊脚石”构成并列意象。
- source_word: σκάνδαλον
  choice: 绊脚石
  rationale: 保留σκάνδαλον使人跌倒、受害的形象，不将其缩窄为单纯的“冒犯”。
- source_word: ἐν τῷ ἐνεδρεύειν
  choice: 埋伏袭击
  rationale: 该带冠词不定式说明他们怎样成为百姓的网罗和绊脚石；“埋伏袭击”自然表达设伏及其敌对目的。
- source_word: αὐτοὺς
  choice: 百姓
  rationale: 代词回指前面的τῷ λαῷ。汉语中直接复现“百姓”可避免“他们”与巴延子孙发生指代混淆。
- source_word: ἐν ταῖς ὁδοῖς
  choice: 在路上
  rationale: ὁδοί指通行的道路或路线；“在路上”符合现代汉语表达，并准确呈现设伏地点。
