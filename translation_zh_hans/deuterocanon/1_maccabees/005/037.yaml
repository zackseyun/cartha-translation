lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: 这些话说完以后
  rationale: 按上下文作自然的时间承接，并保留ῥήματα指前述话语的意思；希腊语也可能泛指“这些事”。
- source_word: συνήγαγεν
  choice: 集结了
  rationale: 在军事语境中表示召集、聚集，现代汉语用“集结”准确自然。
- source_word: παρεμβολὴν ἄλλην
  choice: 又……一支军队
  rationale: παρεμβολή可指营地，也可转指驻营的军队。因下一动词已明确说“安营”，译作“一支军队”可避免“集结营地”的生硬搭配。
- source_word: παρενέβαλεν
  choice: 安营
  rationale: 准确表达军队扎营的标准军事含义，文体简洁庄重。
- source_word: κατὰ πρόσωπον
  choice: 正对面
  rationale: 表示与某地相对、面对的位置；“正对面”清楚传达地理关系。
- source_word: Ῥαφὼν
  choice: 拉丰
  rationale: 依希腊语音形转写为现代简体中文地名。
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: 在溪谷对岸
  rationale: χειμάρρους可指季节性水道、急流或干河谷；“溪谷”兼顾水道与谷地特征，而“对岸”表达ἐκ πέραν的方位。
