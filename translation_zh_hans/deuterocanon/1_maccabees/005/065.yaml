base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: zh_hans
  text: 犹大和他的弟兄们出征，与南方地区的以扫的子孙[a]交战。犹大攻打了希伯仑及其附属城镇[b]，拆毁了那里的堡垒，又把那里的塔楼四周都焚烧了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“以东人”；原文直译为“以扫的儿子们”。
    reason: 说明该亲族称谓通常所指的群体，同时保留原文的字面称谓。
  - marker: b
    text: 原文直译为“它的女儿们”，指隶属于主城的周边小城镇。
    reason: 解释古代城市及其附属聚落的惯用说法。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出征
  rationale: 本义是“出去、出发”；上下文明确是军事行动，因此译作“出征”自然简洁，又不增添原文没有的战果信息。
- source_word: ἐπολέμουν
  choice: 交战
  rationale: 未完成时可表现持续进行的战争行动；“交战”符合现代汉语叙事，也保留了与对方作战的含义。
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: 以扫子孙
  rationale: 直译其亲族称谓，同时以“子孙”表达群体后裔之意，比“以扫的儿子们”更符合此处所指；脚注说明其民族指向。
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: 南方地区
  rationale: 贴近“朝南之地”的表达，不把原文未明确使用的专名“南地”强加进去。
- source_word: ἐπάταξεν
  choice: 攻打了
  rationale: πατάσσω在军事语境中可指打击、攻击；“攻打”保留行动本身，不擅自断定是攻占或彻底击败。单数动词则以重复“犹大”体现领袖主体。
- source_word: τὴν Χεβρὼν
  choice: 希伯仑
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: τὰς θυγατέρας αὐτῆς
  choice: 属它的城镇
  rationale: 原文直译为“它的女儿们”，是指隶属于中心城市的周边小城镇；正文采用可直接理解的功能对等表达，脚注保留文化背景。
- source_word: καθεῖλεν
  choice: 拆毁了
  rationale: 准确表达将防御建筑拆除、毁坏的动作，语体庄重而自然。
- source_word: τὸ ὀχύρωμα αὐτῆς
  choice: 那里的堡垒
  rationale: ὀχύρωμα指坚固的防御设施；“堡垒”简明自然。“那里”避免连续使用代词时指代生硬。
- source_word: τοὺς πύργους αὐτῆς ἐνεπύρισεν κυκλόθεν
  choice: 焚烧了四周的塔楼
  rationale: 将κυκλόθεν理解为塔楼位于城市四周，既保留“周围、各面”的空间意义，也符合中文语序；“焚烧”准确表达纵火烧毁。
theological_decisions:
- issue: τοὺς υἱοὺς Ἠσαῦ应保留亲族称谓还是直接译为族名
  choice: 以扫子孙
  alternative: 以东人
  rationale: 原文使用“以扫的儿子们”这一具有经文互文色彩的称谓。正文保留以扫之名及后裔关系，不把它完全改写成族名；脚注说明这里所指的是以东人，从而兼顾来源形式与现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“出征、交战、攻打、拆毁、焚烧”形成清晰的军事行动链；不把“攻打”强化为“攻占”或“毁灭”，以免超出希腊文。两个脚注标记均置于其实际解释的词语之后。
