  yaml_path: translation/deuterocanon/1_maccabees/005/014.yaml
  text: 'While the letters were still being read[a], behold, other messengers arrived from Galilee with their garments torn, reporting these words:'
translation:
  language: zh_hans
  text: 书信还在宣读的时候，看哪，另有使者从加利利来到，衣服已经撕裂，报告说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”指传递消息的人，并非天使。“衣服已经撕裂”也可译作“撕裂了衣服”；原文的完成时分词特别表明，他们来到时衣服已处于撕裂的状态。撕裂衣服是表示悲痛或惊恐的举动。
    reason: 说明ἄγγελοι在本段历史语境中的人类含义，并交代διερρηχότες的完成时状态及撕衣的文化意义。
lexical_decisions:
- source_word: Ἔτι ... ἀνεγινώσκοντο
  choice: 还在宣读的时候
  rationale: ἔτι配合未完成时被动式，表示信件尚在持续被宣读；汉语用“还在……的时候”自然体现同时发生的背景动作。
- source_word: αἱ ἐπιστολαὶ
  choice: 信
  rationale: 复数在汉语中不必强加数量标记；“信”简明自然，也符合叙事语境。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意并表现突发情势的叙事语气。
- source_word: ἄγγελοι ἕτεροι
  choice: 又有使者
  rationale: 此处指传递消息的人，并非天使；ἕτεροι承接先前来人，用“又有”比直译“另一些”更符合现代汉语叙事。
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: 从加利利赶来
  rationale: 表达他们从加利利来到现场；“赶来”贴合紧急报信的语境，又不改变基本动作。
- source_word: διερρηχότες τὰ ἱμάτια
  choice: 撕裂了衣服
  rationale: 完成时分词既可突出先行的撕裂动作，也形成到达时衣服已撕裂的状态；译文保留动作表达。
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: 照以下的话报告说
  rationale: 该短语引出随后报告的具体内容；“照以下的话”较贴近κατὰ τὰ ῥήματα ταῦτα，“报告说”自然衔接直接引语。
