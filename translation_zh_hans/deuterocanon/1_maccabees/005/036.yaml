lexical_decisions:
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 该动词在行军叙事中表示离开原地、继续上路；“出发”自然准确，也不额外加入原文未明说的“拔营”。
- source_word: προκατελάβετο
  choice: 占领了
  rationale: 该词表示抢先占据、夺取或控制；此处以“占领了”表达军事语境中的取得控制，同时避免用“攻占”断言具体攻城过程。
- source_word: Χασφώθ, Μακέδ, Βοσόρ
  choice: 哈斯弗、马刻德、波索尔
  rationale: 按希腊文地名音译，采用简明、可读的现代汉语形式。
- source_word: Γαλααδίτιδος
  choice: 基列
  rationale: 指基列地区；“基列”是现代中文圣经语境中通行且易辨识的地名。
- source_word: τὰς λοιπὰς πόλεις
  choice: 其余的城
  rationale: 忠实保留“其余”这一范围表达；“城”在此比“城市”更符合古代设防聚落的叙事语体。
