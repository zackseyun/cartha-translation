base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/029.yaml
  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: zh_hans
  text: 他看见各库房里的银钱已经用尽，境内的税收也很少，因为纷争和他为要废除自古以来已有的规例而加在这地上的灾祸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为要废除”也可译作“由于废除了”；希腊文结构可表达目的、缘由或相关情形。“规例”也可译作“法令”或“传统规矩”。
    reason: 保留τοῦ ἆραι的句法歧义，并说明τὰ νόμιμα的语义范围。
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  choice: 各库房里的银钱已经用尽
  rationale: 保留ἀργύριον的“银”这一具体意象，同时用“银钱”清楚表达国库资金；θησαυροί为复数，译作“各库房”。
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: 境内的税收也很少
  rationale: φόροι在此指征收所得；“税收”比逐字的“税项很少”更符合现代汉语财政语境，并保留ὀλίγοι所表达的不足。
- source_word: χάριν τῆς διχοστασίας
  choice: 因为纷争
  rationale: διχοστασία可指分裂、争执或内讧；“纷争”自然且不把政治性质限定得过窄。
- source_word: πληγῆς ἧς κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: 他……给这地带来的灾祸
  rationale: πληγή本义范围包括打击、创伤和灾害；在此指施加于全地的破坏性后果，“灾祸”比“击打”更自然，又保留负面冲击。
- source_word: τοῦ ἆραι τὰ νόμιμα
  choice: 为废除……规例
  rationale: ἆραι在此为除去、废止；τὰ νόμιμα指既定的法律、规章或习俗。“规例”兼顾法律性与传统规范性。
- source_word: ἀφʼ ἡμερῶν τῶν πρώτων
  choice: 自古以来
  rationale: 这是回指早先时代的惯用表达；“自古以来”在现代汉语中自然地传达其长期沿袭之意。
