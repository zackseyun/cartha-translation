base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/018.yaml
  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: zh_hans
  text: 犹大说：“许多人落在少数人手中，并不难[a]；在上天看来，借着多人或少数人施行拯救，并没有分别[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多人被少数人围困，是容易的。”原文动词本义是“关住、围住”，在这里指落入少数人的掌控。
    reason: lexical_alternative
  - marker: b
    text: “上天”很可能是对上帝的敬称；也可理解为“在上帝看来”。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν ἐστιν
  choice: 并非难事
  rationale: 这是表示“容易、易于发生”的无人称表达；译作“并非难事”自然庄重，也符合此处对战局可能逆转的陈述。
- source_word: συγκλεισθῆναι
  choice: 落在……手中
  rationale: 该被动不定式本义为“被关住、被围困”，与“在少数人手中”连用时表示陷入对方掌控；正文采用自然汉语表达，脚注保留其“被围困”的形象。
- source_word: πολλοὺς ... ἐν χερσὶν ὀλίγων
  choice: 众人落在少数人手中
  rationale: 保留“众多—少数”的鲜明对比，并用汉语惯用的“落在……手中”表达受其控制。
- source_word: διαφορὰ
  choice: 分别
  rationale: οὐκ ἔστι διαφορά意为“没有差别/分别”；“没有分别”简洁且符合庄重叙事语体。
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: 在上天看来
  rationale: 原文直称“天”，很可能是对上帝的敬称性代称；正文不直接替换为“上帝”，以保留原文措辞与含蓄性。
- source_word: σῴζειν
  choice: 施行拯救
  rationale: 该动词可指拯救、解救；在战争语境中包含救援和得胜之意，但译作“施行拯救”保留更广的神学内涵及原文未明说的宾语。
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: 借着多人或少数人
  rationale: 介词短语在此表达施救所借助的媒介；“借着”既传达工具意义，也避免暗示人数本身是拯救的主体。
theological_decisions:
- issue: ἐναντίον τοῦ οὐρανοῦ中“天”的敬称性用法
  choice: 正文保留“上天”
  alternative: 在上帝看来
  rationale: 希腊文明确使用“天”，虽很可能以此敬称上帝，仍不宜在正文中把含蓄称谓直接解释为“上帝”；脚注说明这一可能含义。
- issue: σῴζειν的施事者与宾语均为隐含
  choice: 译作“施行拯救”，不补明主语或宾语
  alternative: 使我们得胜／拯救我们
  rationale: 上下文很可能指上天拯救犹大一方，但本句希腊文没有明说宾语；保留省略可避免缩窄原文的神学张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“犹大”沿用该人物在中文经外文献中的通行译名；以分号呈现原句两项彼此关联的断言。所有脚注标记均已置于正文相应位置。
