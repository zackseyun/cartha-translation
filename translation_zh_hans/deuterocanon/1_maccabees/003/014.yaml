base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: zh_hans
  text: 他说：“我要为自己扬名，在王国中得荣耀；我要攻打犹大[a]和那些与他在一起、藐视王命的人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即马加比犹大。
    reason: 人物辨识
  - marker: b
    text: “王命”直译“王的话”，也可译作“王的谕令”。
    reason: 词义选择
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: 我要为自己扬名
  rationale: 这是取得名声、声望的惯用表达；“为自己扬名”在现代汉语中自然，也保留了ἐμαυτῷ所体现的自我抬高意味。
- source_word: δοξασθήσομαι
  choice: 得荣耀
  rationale: 保留被动式所指向的受尊崇、获荣耀含义，同时避免生硬的“被荣耀”。
- source_word: ἐν τῇ βασιλείᾳ
  choice: 在王国中
  rationale: 按βασιλεία的直接含义译为“王国”，不擅自补入原文没有明说的所属关系。
- source_word: πολεμήσω
  choice: 攻打
  rationale: 在军事语境中自然表达对某人及其同伴发动战事，比笼统的“争战”更符合现代汉语习惯。
- source_word: τὸν Ἰούδαν
  choice: 犹大
  rationale: 此处指马加比家族的领袖；“犹大”是Ἰούδας在中文圣经人名传统中的通常译法。
- source_word: τοὺς σὺν αὐτῷ
  choice: 跟随他的人
  rationale: 自然表达与他同在、站在他一方的一群人，同时不具体限定其身份。
- source_word: τοὺς ἐξουθενοῦντας
  choice: 藐视
  rationale: ἐξουθενέω含有轻看、蔑视、视为无物之意；“藐视”比仅仅“不理会”更充分保留其轻蔑色彩。
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: 王命
  rationale: λόγος字面为“话”，但在君王发令的语境中指命令或谕令；“王命”简洁自然，并以脚注保留较直译的可能。
theological_decisions:
- issue: Ἰούδαν所指人物的中文名
  choice: 译作“犹大”，指马加比犹大
  alternative: 音译作“犹达”或依部分西文传统称“犹大斯”
  rationale: 原文明确是个人名而非犹大地区或支派；采用中文圣经中Ἰούδας常见的“犹大”，脚注说明其身份，以免误解。
- issue: τὸν λόγον τοῦ βασιλέως的语义范围
  choice: 正文译作“王命”
  alternative: 译作“王的话”或“王的谕令”
  rationale: 上下文显然涉及君王权威下达的命令，但λόγος本身仍可直译为“话”；正文采用合乎语境的表达，脚注保存词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留说话者连续三个第一人称意愿句所表现的自负与野心；分号用于呈现原文后半句行动目标的推进。
