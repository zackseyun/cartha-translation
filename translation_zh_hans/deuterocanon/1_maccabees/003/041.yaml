base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: zh_hans
  text: 本地的商人听见了他们的名声[a]，就带着大量金银和奴隶[b]来到军营，要把以色列的子孙收作奴隶[b]。来自叙利亚和异族之地的军队[c]也加入了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “名声”直译为“名字”，也可理解为“关于他们的消息”。
    reason: 说明希腊习语及其语境意义。
  - marker: b
    text: 这里的“奴隶”指被当作财产取得的人。希腊文前后两处使用同一个词；该词在其他语境也可指孩子或仆役。
    reason: 交代παῖς的较宽语义范围，并明确本节的奴役语境及两处重复。
  - marker: c
    text: “异族之地”也可能特指“非利士人之地”。
    reason: 保留ἀλλόφυλοι在圣经希腊文中的较窄地域解释。
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: 本地的商人
  rationale: ἔμποροι指从事买卖的商人；τῆς χώρας可指该地、该地区或该国。译作“本地的商人”符合现代汉语，也保留其地域关系。
- source_word: τὸ ὄνομα αὐτῶν
  choice: 他们的名声
  rationale: ὄνομα字面是“名字”，但“听见某人的名字”在此指听到关于他们的消息或声名；“名声”自然传达该语用意义，脚注保留字面表达及其他可能。
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: 大量金银
  rationale: πολὺ σφόδρα强烈表示数量极多；“大量金银”在中文中简洁自然，并保留数量强调。
- source_word: παῖδας
  choice: 奴仆
  rationale: παῖς可指孩子、仆役或奴隶；此处是商人携款前来买取战俘的语境，受奴役之义明确。“奴仆”既反映人身隶属关系，也使该词前后两次出现保持一致。
- source_word: παρεμβολήν
  choice: 军营
  rationale: παρεμβολή在这里取军事营地之义，“军营”是准确且自然的现代汉语。
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: 要把以色列的子孙收作奴仆
  rationale: 属格冠词加不定式表达目的；“收作”传达λαβεῖν…εἰς的取得并使之成为某种身份的意思。“以色列的子孙”保留υἱούς的明说形式。
- source_word: προσετέθησαν πρὸς αὐτούς
  choice: 也加入了他们
  rationale: 希腊文是被动式，字面为“被加到他们那里”；现代汉语用“加入了他们”更自然，意义不变。
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: 叙利亚的军队和外族之地的军队
  rationale: δυνάμεις在军事语境中指军队或兵力。ἀλλόφυλοι字面指异族人；译作“外族之地”保留较宽泛的所指，不在正文中强行限定为某一族群。
theological_decisions:
- issue: 奴隶买卖语境中παῖδας的译法
  choice: 奴仆
  alternative: 奴隶；仆役；孩子
  rationale: 上下文显示商人带着金银，意图把以色列人当作可占有的人口取得，因此不能按“孩子”理解。选用“奴仆”并以脚注说明其人身受占有的含义，既不淡化剥削性质，也保留παῖς比专指奴隶的词更宽的词义范围。
- issue: γῆς ἀλλοφύλων所指的族群范围
  choice: 外族之地
  alternative: 非利士人之地；异邦之地
  rationale: ἀλλόφυλοι在希腊文圣经某些语境中可特指非利士人，但词形本身也可泛指异族人。本节不足以无歧义地限定族群，故正文保留宽泛表达，脚注列出较窄的传统理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大量金银”“来到军营”“加入了他们”等表达清楚易懂；保留“以色列的子孙”以反映原文形式。正文中的“奴仆”前后一致，避免把首个παῖδας误译为“锁链”等原文没有的物件。
