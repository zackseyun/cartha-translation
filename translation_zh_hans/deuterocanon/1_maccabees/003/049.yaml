  yaml_path: translation/deuterocanon/1_maccabees/003/049.yaml
  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: zh_hans
  text: 他们把祭司的服饰、初熟之物和十分之一带来，又让那些期限已满的拿细耳人上前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许愿期限已满的”。希腊文直译为“已经完成了日子”；在这里指拿细耳人规定的期限已经结束。
    reason: 说明“完成了日子”这一希腊文惯用语在拿细耳人语境中的含义，并保留正文的简洁表达。
lexical_decisions:
- source_word: ἤνεγκαν
  choice: 带来
  rationale: 此处是不定过去时，表示把礼服和供物带到聚集之处；“带来”自然、直接，也不额外加入“献上”的含义。
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: 祭司的礼服
  rationale: 指与祭司职分和礼仪服事有关的衣服；“礼服”既能体现礼仪用途，又避免采用带有特定宗派色彩的术语。
- source_word: τὰ πρωτογεννήματα
  choice: 初熟之物
  rationale: 在与十分之一并列的祭祀语境中，指首先成熟而献出的出产；这是现代中文圣经语境中清楚而准确的表达。
- source_word: τὰς δεκάτας
  choice: 十分之一
  rationale: 准确表达按十取一的宗教性奉献，并采用普通读者容易理解的现代汉语。
- source_word: ἤγειραν
  choice: 让……上前
  rationale: 字面有“使起来”之意；在此以人为宾语，较可能指使他们站出来或被带到众人面前。“让……上前”保留这一动作，又避免误解为唤醒或复活。
- source_word: τοὺς Ναζιραίους
  choice: 拿细耳人
  rationale: 这是指按照律法许拿细耳愿、分别为圣的一类人。“拿细耳人”保留了特定的历史宗教身份，胜于笼统意译。
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: 那些已经满了日期的
  rationale: 贴近希腊文“完成了那些日子”，同时以“满了日期”表达规定期限届满；具体指许愿期限，由脚注说明而不在正文中补入原文未明说的“愿”。
theological_decisions:
- issue: 如何翻译技术性称谓 Ναζιραίους
  choice: 拿细耳人
  alternative: 许了拿细耳愿的人
  rationale: 原词指律法中一种特定的奉献身份，并非泛指立愿者。采用通行音译可保留该制度的历史和神学内涵，也不把解释性内容直接写入正文。
- issue: “满了日期”是否明说为拿细耳愿期满
  choice: 正文保留“满了日期”，脚注解释其惯用含义
  alternative: 已经守满许愿期限
  rationale: 希腊文只明说“完成了日子”，其语境确实指拿细耳愿规定的期限。正文保留原文的简洁措辞，脚注提供必要说明，避免把隐含信息当作明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“初熟之物”“十分之一”“拿细耳人”保留经文的礼仪和律法语境；句式保持原文两组动作的并列结构。脚注标记置于其实际解释的“满了日期”之后。
