  yaml_path: translation/deuterocanon/1_maccabees/003/044.yaml
  text: And the assembly gathered to be ready for war[b][a], and to pray and ask for mercy and compassion.
translation:
  language: zh_hans
  text: 会众[b]聚集[a]，为要准备作战，也为要祷告，祈求怜悯和慈悲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被召集起来”；希腊语动词在形式上是被动语态，可以更形式对应地这样翻译。
    reason: lexical_alternative
  - marker: b
    text: 或译“集会”。这里的希腊词 συναγωγή 指聚集起来的共同体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροίσθη
  choice: 聚集起来
  rationale: 该词为不定过去时被动形式；在这里可自然表达群体聚集这一事件。“聚集起来”符合现代汉语习惯，同时由脚注保留形式上被动的译法。
- source_word: ἡ συναγωγή
  choice: 会众
  rationale: 此处指聚集起来的共同体，并非特指会堂建筑或后来的固定制度。“会众”既体现群体性质，也适合这里兼具作战与祷告的语境。
- source_word: τοῦ εἶναι ἑτοίμους
  choice: 为要预备
  rationale: 带冠词的不定式在此表示目的。“为要预备”清楚保留目的含义，并使汉语句式自然。
- source_word: εἰς πόλεμον
  choice: 作战
  rationale: πόλεμος指战争或战事；结合预备这一搭配，译作“作战”比直译“为战争”更自然，又不缩窄为某一场具体战斗。
- source_word: τοῦ προσεύξασθαι
  choice: 为要祷告
  rationale: 第二个带冠词的不定式与前项平行，同样表示聚集的目的。
- source_word: αἰτῆσαι
  choice: 祈求
  rationale: 该动词表示请求、求取；在祷告语境中译作“祈求”自然，但不在正文中补出希腊文未明说的受求者。
- source_word: ἔλεον
  choice: 怜悯
  rationale: 在祷告语境中，“怜悯”准确传达所求的宽宥与恩慈。
- source_word: οἰκτειρμούς
  choice: 慈悲
  rationale: 复数名词表达深切同情与慈悯；“慈悲”与“怜悯”并列，尽量保留原文两个近义而有区别的名词。
theological_decisions:
- issue: 次经历史叙事中 συναγωγή 的译法
  choice: 会众
  alternative: 集会；会堂
  rationale: 本节所指是聚集起来、准备作战并祷告的群体。译作“会众”可避免让读者误以为这里专指一座会堂建筑或后期固定制度，同时保留其共同体含义。
- issue: 祈求对象是否明说
  choice: 不补出“向上帝”
  alternative: 向上帝祈求
  rationale: 上下文显然属于祷告场景，但本节希腊文本身没有明说祈求对象；正文保留这一省略，避免把语境推断写成明文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“为要……也为要……”保留原文两个并列目的结构；正文不使用可能使人联想到建筑物的“会堂”，也不补出原文未明说的祈求对象。
