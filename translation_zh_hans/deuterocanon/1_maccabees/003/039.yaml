base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/039.yaml
  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: zh_hans
  text: 他又派四万人和七千骑兵[a]与他们同去，要进入犹大地，照王的话[b]毁灭那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“七千匹马”；这里的“马”很可能借指骑兵。
    reason: lexical_alternative
  - marker: b
    text: 或译“照王的命令”。原文直译为“照王的话”，在这里具有命令的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 此处指派出军队随领袖出征；“派”简洁自然，也符合军事语境。
- source_word: μετʼ αὐτῶν
  choice: 与他们同去
  rationale: 明确表达这些兵力随先前提到的人一同前往，同时保持现代汉语流畅。
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: 四万人
  rationale: 按原文保留“人”的表述，不额外解释为“士兵”；上下文已清楚表明是军队。
- source_word: ἑπτακισχιλίον ἵππον
  choice: 七千骑兵
  rationale: ἵππος字面为“马”，但在军事兵力的列举中可借指骑兵；译作“骑兵”能准确传达语境中的所指，并以脚注保留字面信息。
- source_word: τοῦ ἐλθεῖν
  choice: 要进入
  rationale: 带冠词的不定式在此表示目的；“要进入”自然地传达此目的关系。
- source_word: εἰς γῆν Ἰούδα
  choice: 进入犹大地
  rationale: “犹大地”贴近γῆ Ἰούδα的地理表达，避免直接改作较具地域名称色彩的“犹太”。
- source_word: καταφθεῖραι
  choice: 毁灭
  rationale: 该词表达强烈、彻底的破坏；“毁灭”保留其力度，同时不擅自限定破坏方式。
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: 照王的话
  rationale: λόγος在本语境中具有王命的效力，但字面仍是“话”；正文保留这一表达，并在脚注说明可理解为“命令”。
