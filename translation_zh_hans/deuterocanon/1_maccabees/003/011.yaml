  yaml_path: translation/deuterocanon/1_maccabees/003/011.yaml
  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: zh_hans
  text: 犹大得知此事，就出去迎战他，击打他，把他杀死了；许多人负伤倒下[a]，其余的人逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文指“许多受伤的人倒下了”，明确说他们受伤，却没有明确说他们被杀。
    reason: 保留τραυματίαι所表达的受伤者含义，避免把战场伤亡过度解释为死亡。
lexical_decisions:
- source_word: ἔγνω
  choice: 得知此事
  rationale: 此处不定过去时表示犹大获知了有关情况，而非仅仅处于“知道”的状态；“得知此事”自然承接他随即采取的行动。
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: 出去迎战他
  rationale: 该短语字面指“出去与他相遇”，但语境是军事交锋；“迎战”既符合场景，也不把动作泛化为单纯的进攻。
- source_word: ἐπάταξεν αὐτὸν
  choice: 把他击倒
  rationale: πατάσσω表示有力击打或军事打击；后文另有“杀死”，故用“击倒”保留两个连续动作的区别。
- source_word: ἀπέκτεινεν
  choice: 杀死了
  rationale: 直接、清楚地表达ἀποκτείνω的致死含义，使用现代汉语而不采用古雅措辞。
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: 许多人负伤倒下
  rationale: τραυματίαι指受伤者；此译保留“倒下”的战场意象，并避免将原文未明说的伤亡解释成死亡。
- source_word: οἱ ἐπίλοιποι
  choice: 其余的人
  rationale: 自然表达敌军中剩下的那些人，不额外断定其具体身份或状态。
- source_word: ἔφυγον
  choice: 都逃跑了
  rationale: 准确表达战场上的逃离；“都”对应将“其余的人”作为整体来陈述。
