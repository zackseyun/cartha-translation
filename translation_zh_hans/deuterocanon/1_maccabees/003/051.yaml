  yaml_path: translation/deuterocanon/1_maccabees/003/051.yaml
  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: zh_hans
  text: 你的圣物遭到践踏和亵渎[a]，你的祭司都在哀痛和屈辱之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的圣所”或“你的圣地”。希腊文为复数，字面意思是“你的神圣之物”。
    reason: 保留 τὰ ἅγιά 的复数语义及其可能指圣物、圣所范围或圣地的词义空间。
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: 你的圣物
  rationale: 希腊文为中性复数，字面指“你的神圣之物”，也可能涵盖圣所、圣地及其中分别为圣之物。“圣物”保留复数所表达的广泛范围，避免擅自限定为单一建筑。
- source_word: κατεπεπάτηται
  choice: 遭到践踏
  rationale: 完成时被动语态既描写践踏这一暴行，也呈现其造成的持续受辱状态；“遭到践踏”在现代汉语中自然，并保留原文意象。
- source_word: βεβήλωται
  choice: 亵渎
  rationale: 该词指使神圣之物成为俗常、不洁之物；“亵渎”准确表达对神圣事物的冒犯，与“圣物”形成清楚对照。
- source_word: οἱ ἱερεῖς σου
  choice: 你的祭司
  rationale: “祭司”是圣殿礼仪人员的标准现代汉语译法；物主关系按原文保留。
- source_word: ἐν πένθει
  choice: 身陷哀痛之中
  rationale: 介词短语描述祭司所处的状态。“哀痛”兼顾悲伤与哀悼语境，并以“身陷……之中”自然连接并列状态。
- source_word: ταπεινώσει
  choice: 卑微
  rationale: 此词可指卑微、受辱或被压低的处境。“卑微”保留原词在低下处境与屈辱之间的张力，不将其仅解释为内心羞耻。
theological_decisions:
- issue: τὰ ἅγιά σου 的范围
  choice: 以“你的圣物”广义指属于上帝的神圣事物，并可涵盖圣所范围
  alternative: 你的圣所；你的圣地
  rationale: 原文采用复数，范围可能同时涉及圣殿的神圣区域和分别为圣之物。正文不缩窄为单一建筑，脚注则保留合乎语境的其他理解。
- issue: ταπεινώσει 所表达的状态
  choice: 卑微
  alternative: 屈辱；困苦；卑下
  rationale: 原词可能同时涉及被压低的客观处境和受辱的社会经验。“卑微”较少替文本决定其究竟侧重外在压迫还是主观羞辱。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“遭到践踏和亵渎”保留两个并列的完成时被动动作；“身陷……之中”呈现祭司持续处于哀痛和卑微状态。脚注标记[a]已置于正文对应词组之后。
