  text: and he became afraid that he might not have enough[a], as once and twice before, for the expenses and the gifts that he had formerly given with a generous hand,
translation:
  language: zh_hans
  text: 他便担心自己没有足够的钱财，无法像从前一再所做的那样支付各项开销，并慷慨地赏赐人。[a]
