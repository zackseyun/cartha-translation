lexical_decisions:
- source_word: εὐλαβήθη
  choice: 便担心
  rationale: 此处动词表示因可能出现财政短缺而忧虑、害怕；“便担心”自然表达其起始意味，同时避免带入该词在其他语境中可能有的敬畏含义。
- source_word: μὴ οὐκ ἔχῃ
  choice: 担心自己没有足够的钱
  rationale: 原文是担忧自己会有所缺乏；下文明确涉及开销和赏赐，因此补明“足够的钱”，使隐含的财政意义在现代汉语中清楚可懂。
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: 像以往一次又一次那样
  rationale: “一次又两次”是表示先前屡次如此的习语，并非严格限定为两次；“一次又一次”保留重复意味。
- source_word: δαπάνας
  choice: 各项开销
  rationale: 准确表达财政支出，符合上下文，也属于自然的现代汉语。
- source_word: δόματα
  choice: 赏赐
  rationale: 此词指君王分发的礼物或恩赐；“赏赐”贴合王室语境，又不将其过度技术化为行政拨款。
- source_word: ἐδίδου ἔμπροσθεν
  choice: 像从前那样……颁发
  rationale: 未完成时与时间副词共同表示过去惯常的行动；“像从前那样”体现其以往常有的做法。
- source_word: δαψιλῇ χειρί
  choice: 出手大方地
  rationale: 保留“手”的比喻意象和慷慨施与的含义，同时采用现代汉语中自然、易懂的习语。
