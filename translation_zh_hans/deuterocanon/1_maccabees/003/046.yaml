base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: zh_hans
  text: 他们聚集起来，来到耶路撒冷对面的米斯巴[a]，因为从前米斯巴是供以色列人祷告的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对面”也可译作“面对”。希腊语此处表示米斯巴位于耶路撒冷对面或朝向耶路撒冷。
    reason: 说明 κατέναντι 的空间含义及其可保留的译法差异。
lexical_decisions:
- source_word: συνήχθησαν
  choice: 他们聚集起来
  rationale: 该形式在上下文中表达众人共同聚集的动作；译为“聚集起来”自然清楚，也保留集体行动的意味。
- source_word: ἦλθοσαν
  choice: 来到
  rationale: 与表示目的地的 εἰς 连用，叙事中译为“来到”最自然，并不过度强调抵达过程。
- source_word: Μασσηφά
  choice: 米斯巴
  rationale: 采用该圣经地名在现代中文中的通行译名，便于识别其与希伯来传统中米斯巴的对应。
- source_word: κατέναντι Ἰερουσαλήμ
  choice: 耶路撒冷对面的
  rationale: κατέναντι 表示处于对面或面对某处；正文采用“对面”，直接保留空间关系，脚注说明也可理解为“面对”。
- source_word: τόπος προσευχῆς
  choice: 祷告的地方
  rationale: 忠实表达一个与祷告相关的地点，同时不擅自具体化为会堂、圣所或祭坛。
- source_word: τὸ πρότερον
  choice: 从前
  rationale: 准确表达较早时期，措辞简洁自然，符合现代汉语叙事。
- source_word: τῷ Ἰσραήλ
  choice: 以色列祷告的地方
  rationale: 将与格理解为关联或受益关系；中文以“以色列祷告的地方”自然表达“供以色列祷告之处”，同时保留“以色列”作为群体称谓。
theological_decisions:
- issue: 米斯巴作为敬拜地点的性质
  choice: 译作“祷告的地方”，不进一步界定其制度或礼仪性质。
  alternative: 祷告所；敬拜的地方；会堂
  rationale: 希腊文只说明米斯巴从前是以色列祷告之处，并未明确称其为会堂、圣所或献祭地点；保持宽泛表述可避免引入原文没有的宗教制度含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“聚集起来，来到”保留原文两个连续动作；“祷告的地方”清楚易懂，并避免使用可能暗示特定宗教建筑的术语。脚注标记置于“米斯巴”之后，以说明其相对于耶路撒冷的位置表达。
