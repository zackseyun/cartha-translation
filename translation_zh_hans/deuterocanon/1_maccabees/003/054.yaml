lexical_decisions:
- source_word: ἐσάλπισαν
  choice: 吹响
  rationale: 该动词指吹奏或吹响号角；“吹响”在现代汉语中自然有力，并与后面的具体乐器相配。
- source_word: ταῖς σάλπιγξιν
  choice: 号角
  rationale: 此处为工具与格，表示用号角吹奏。结合军事场景，“号角”比泛指的“喇叭”更庄重贴切；汉语以“吹响号角”自然表达这一结构。
- source_word: ἐβόησαν
  choice: 呼喊
  rationale: 该词表示发出响亮的喊声；“呼喊”保留声音强烈的意味，又不擅自补充呼喊的具体内容。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 希腊语直译为“用大声音”，在现代汉语中以“高声”最自然，同时完整保留声音响亮这一信息。
