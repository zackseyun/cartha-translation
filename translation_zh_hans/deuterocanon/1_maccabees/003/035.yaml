base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/035.yaml
  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: zh_hans
  text: 派一支军队攻打他们，好击溃并除去以色列的力量和耶路撒冷的余民，又使人不再在这地方记念它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记念”或译“纪念”“记忆”；也可意译为“使人不再记得它”。原文“它”所指的对象并不完全明确。
    reason: 说明 μνημόσυνον 的词义范围，并保留 αὐτοῦ 的指代含混。
lexical_decisions:
- source_word: ἀποστεῖλαι
  choice: 派遣
  rationale: 不定式承接上文所作的决定；“派遣”自然、庄重，也适合军事语境。
- source_word: δύναμιν
  choice: 一支军队
  rationale: 此处指武装力量，而非抽象的“能力”；现代汉语用“一支军队”清楚自然。
- source_word: τοῦ ἐκρίψαι
  choice: 摧毁
  rationale: 表达以武力击垮、毁灭的目的，同时与后面的“除去”保持动作上的区别。
- source_word: ἐξᾶραι
  choice: 除去
  rationale: 保留拿走、清除之意，不采用更具解释性的“连根拔除”。
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: 以色列的力量
  rationale: 贴近原文属格结构，并保留 ἰσχύς 所含的力量、实力之广义。
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: 耶路撒冷的余民
  rationale: κατάλιμμα 指剩余之物或群体；“余民”保留其集体性和经文语感，但不将其限定为军事幸存者。
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: 抹去它的记念
  rationale: ἆραι 本义为拿走、除去；结合敌对语境译作“抹去”自然。μνημόσυνον 可指记念、记忆或纪念物，因此正文保留较宽泛的“记念”。
- source_word: αὐτοῦ
  choice: 它的
  rationale: 原文为阳性或中性单数属格，所指存在一定含混；“它的”保留集体或地点性先行词的可能。
- source_word: ἀπὸ τοῦ τόπου
  choice: 从这地方
  rationale: 带冠词的 τόπος 指语境中所说的地方；“这地方”在现代汉语中比生硬的“那地方”更顺畅，同时不擅自补作“它所在之地”。
theological_decisions:
- issue: “耶路撒冷的余民”的范围
  choice: 采用可指剩余群体的“余民”，不明确限定为幸存者
  alternative: 耶路撒冷所剩下的一切；耶路撒冷的幸存者
  rationale: κατάλιμμα 的范围可以较广，既可侧重剩余的人，也可泛指所剩者；正文避免只解释为人员。
- issue: αὐτοῦ 的指代
  choice: 以“它的”保留单数集体指代的含混性
  alternative: 以色列的；耶路撒冷的；他们的
  rationale: 原文单数代词可能回指以色列、耶路撒冷或前述集体概念。翻译不应无依据地固定为某一个对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摧毁并除去”保留两个并列动词的差别；“余民”延续经文常用表达。脚注标记已在正文相应位置标出。
