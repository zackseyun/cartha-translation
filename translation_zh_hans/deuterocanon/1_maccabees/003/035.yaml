  terminology: “余民”是恰当而庄重的经文用语，能保留 κατάλιμμα 的集体性与范围。“记念”可用于 μνημόσυνον；脚注宜仅说明该词的词义选项及代词未明的指向，避免将不确定性过度具体化。
