revisions:
- from: 派遣一支军队攻打他们，好摧毁并除去以色列的力量和耶路撒冷的余民，又从这地方抹去它的记念[a]。
  to: 派一支军队攻打他们，好击溃并除去以色列的力量和耶路撒冷的余民，又使人不再在这地方记念它[a]。
  rationale: 本次修订仅改善汉语表达并更清晰呈现原文句法关系：“派”与军事语境相称；“击溃并除去”保留 ἐκρίψαι 和 ἐξᾶραι 的双重动作；末句以自然汉语表达“从这地方除去其记念”，且不将单数代词的先行词固定为以色列或耶路撒冷。
