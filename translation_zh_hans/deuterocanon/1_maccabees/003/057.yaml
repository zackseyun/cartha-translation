  text: And the camp set out[a], and they encamped south of Emmaus.
translation:
  language: zh_hans
  text: 于是，军营拔营出发；他们在以马忤斯[a]南边安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文地名作“阿玛乌姆”（Ἀμμαούμ），通常译作“以马忤斯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: 拔营出发
  rationale: 此处主语为军营所代表的全军；该动词在行军语境中表示离开驻地。译作“拔营出发”既交代撤离营地，也自然衔接下文再次安营。
- source_word: ἡ παρεμβολή
  choice: 全营
  rationale: παρεμβολή可指军营，也可集合性地指驻营的军队。“全营”保留营地意象，同时在汉语中可自然充当行动主体。
- source_word: παρενεβάλοσαν
  choice: 安营
  rationale: 该动词在军事行程中指扎营、设营；“安营”简洁庄重，符合叙事语体。
- source_word: κατὰ νότον
  choice: 在……南边
  rationale: 短语表达相对于以马忤斯的方位位置，而不只是向南行进；“在……南边”清楚保留这一关系。
- source_word: Ἀμμαούμ
  choice: 以马忤斯
  rationale: 采用该古代地名在中文圣经传统中通行且易识别的译名；脚注说明希腊文形式。
