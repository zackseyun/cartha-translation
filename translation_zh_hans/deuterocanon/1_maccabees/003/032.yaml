  yaml_path: translation/deuterocanon/1_maccabees/003/032.yaml
  text: And he left Lysias, an honored man and of the royal family, over the affairs of the king, from the Euphrates River as far as the borders of Egypt,
translation:
  language: zh_hans
  text: 他留下了吕西阿，让这个备受尊崇、出身王族的人管理王的政务，管辖范围从幼发拉底河直到埃及边界。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: 留下了
  rationale: 保留其使吕西阿留守、受命负责事务的基本含义；具体委任内容由后文“管理”表达。
- source_word: ἄνθρωπον ἔνδοξον
  choice: 备受尊崇的人
  rationale: ἔνδοξος表示享有声望、受人尊崇；承接审校层所强调的“honored”，而不只描述才能出众。
- source_word: ἀπὸ γένους τῆς βασιλείας
  choice: 出身王族
  rationale: 自然表达其属于王室血统或家族，同时不进一步断定具体亲属关系。
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  choice: 管理王的政务
  rationale: ἐπὶ与属格在此表示受命掌管；πράγματα指王的事务、政务。
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  choice: 管辖范围从幼发拉底河直到埃及边界
  rationale: 将地理范围明确连接到前述管理职责，符合希腊语句法与上下文，也使现代汉语完整自然。
theological_decisions: []
