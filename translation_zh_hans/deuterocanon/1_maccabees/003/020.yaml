base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/020.yaml
  text: They are coming against us in a great mass of insolence and lawlessness, to wipe out us and our wives and our children, and to plunder us.
translation:
  language: zh_hans
  text: 他们带着极大的狂妄和不法[a]，前来攻击我们，要把我们连同妻子儿女一并除灭，并洗劫我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着众多的狂妄和不法。”希腊文 πλήθει 既可表示“众多”，也可表示“极多、充盈”；原句的搭配在中文中较不寻常。
    reason: 保留 πλήθει 在“众多”与“丰盛、极多”之间的词义张力，并交代希腊文结构。
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: 他们……前来攻击我们
  rationale: 在军事语境中，πρός表示敌对趋向；“攻击”自然明确地传达其来意，同时保留“前来”的方向感。
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  choice: 带着极大的狂妄和不法
  rationale: πλήθει可表示众多或充盈，在此修饰“狂妄和不法”。“极大的”使中文通顺，又保留程度或数量丰盛的含义；脚注说明较直译的表达。
- source_word: ὕβρεως
  choice: 狂妄
  rationale: ὕβρις不只是内心骄傲，也含放肆、凌辱和强暴的意味；“狂妄”在现代中文中兼具傲慢与肆无忌惮的色彩。
- source_word: ἀνομίας
  choice: 不法
  rationale: ἀνομία指无视法律或律法的状态与行为；“不法”比泛称“邪恶”更贴近原词。
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: 要把我们……除灭
  rationale: 带冠词不定式表示目的；ἐξαίρω在此指彻底除去。“除灭”保留消灭殆尽的强度，并符合庄重叙事语体。
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: 连同妻子儿女
  rationale: 带所属代词的 γυναῖκες在此自然指“妻子”，τέκνα指“儿女”；“连同”清楚表明他们全都在除灭的对象之内。
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: 并洗劫我们
  rationale: σκυλεύω指战胜后剥夺、掳掠财物；“洗劫”是现代中文中有力而自然的军事语境表达。
