base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: zh_hans
  text: 犹大说：“你们要束紧腰带，要成为刚强的勇士[a]；预备好，明早要同这些聚集起来对付我们、企图消灭我们和我们的圣物[b]的外邦各族交战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“成为刚强的儿子”，是指作刚强勇武的人。
    reason: 说明原文的字面措辞及其惯用意义。
  - marker: b
    text: 或译“我们的圣所”。原文是复数，也可泛指圣物、神圣区域或圣所范围。
    reason: 保留 τὰ ἅγια 所指范围的歧义。
lexical_decisions:
- source_word: Περιζώσασθε
  choice: 束紧腰带
  rationale: 保留这个表示临战整装的生动命令语气；比单译“预备好”更贴近原文意象。
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: 作刚强勇士
  rationale: 原文直译近似“成为刚强的儿子”，是带有闪语色彩的男性勇武用语；中文若照字面译作“刚强的儿子”会晦涩且易被误解，因此正文传达其惯用意义，并在脚注保留字面形式。
- source_word: εἰς τὸ πρωῒ
  choice: 明早
  rationale: 语境指即将到来的早晨；“明早”在现代汉语中自然明确。
- source_word: πολεμῆσαι
  choice: 交战
  rationale: 符合军事语境，庄重而自然。
- source_word: ἔθνεσιν
  choice: 外族人
  rationale: 此处指聚集攻击犹大众人的外邦族群；“外族人”既体现群体身份，也避免把复数机械译成现代政治意义上的“国家”。
- source_word: ἐπισυνηγμένοις
  choice: 聚集来攻打
  rationale: 表达完成分词所呈现的已聚集状态，并结合“攻打我们”的敌对方向，使中文顺畅。
- source_word: ἐξᾶραι
  choice: 消灭……并毁掉
  rationale: 该不定式统摄“我们”和“我们的圣物”；中文按不同宾语分别用“消灭”和“毁掉”，自然表达彻底除灭、清除之意。
- source_word: τὰ ἅγια ἡμῶν
  choice: 我们的圣物
  rationale: 保留中性复数的宽泛性，不将其限定为单数的“圣所”；脚注说明也可能涵盖圣所或神圣区域。
theological_decisions:
- issue: γίνεσθε εἰς υἱοὺς δυνατούς 中的阳性及闪语式表达
  choice: 正文译作“作刚强勇士”，脚注保留“成为刚强的儿子”的字面信息
  alternative: 成为刚强的儿子；作大能之子
  rationale: 参与战斗者在原文中以阳性“儿子”表述，但这一结构的实际功能是勉励他们成为勇武之人。正文采用现代汉语可理解的男性称谓，不作性别中和，也不让生硬直译遮蔽原意。
- issue: τὰ ἅγια ἡμῶν 的所指范围
  choice: 我们的圣物
  alternative: 我们的圣所；我们的神圣之地
  rationale: 原文使用复数，可指圣物、神圣区域或整个圣所范围。正文保持宽泛，不擅自缩窄为单一建筑。
translation_notes:
  register: 采用现代、庄重而易懂的军事劝勉语体。“束紧腰带”保留原文临战整装的意象；分号使敌军聚集的目的清楚，又不改变原句的逻辑关系。
