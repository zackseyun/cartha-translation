  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: zh_hans
  text: 王带上先前留下的那一半军队，于第一百四十七年[b]从安提阿——他王国的都城[a]——出发。他渡过幼发拉底河，继续行经上部地区[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从安提阿，就是他王国的城，出发。”希腊语此处可能以同位语说明安提阿是王的王城或都城。
    reason: lexical_alternative
  - marker: b
    text: 即塞琉古纪元第一百四十七年。
    reason: cultural_note
  - marker: c
    text: 或译：“内陆诸地区”或“上部诸行省”。这句话很可能指幼发拉底河以东的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: 带上
  rationale: 在军事行程的语境中，表示王把这些军队带在身边一同出发；“带上”自然地表达了随行之意，同时不限定为单纯接管指挥。
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: 那一半军队
  rationale: 表达特指的“一半”，并以现代汉语常用的“军队”传达 δυνάμεις 在此处的军事含义。
- source_word: τὰς καταλειφθείσας
  choice: 先前留下的
  rationale: 分词指这些军队此前被留下；“先前”清楚体现该动作早于本节所述的出发。
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 这是叙述行程开始的常用动词；“出发”比“离开”更贴合随后渡河、行经各地的语境。
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: 从安提阿——他王国的王城——
  rationale: 将该短语理解为对安提阿的同位说明。“王城”保留其作为君王驻地或王国中心城市的含义，但脚注注明希腊语结构尚可作较直译的理解。
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: 于第一百四十七年
  rationale: 按现代汉语数字顺序表达希腊语的纪年方式，不改变年份。
- source_word: διεπέρασεν
  choice: 渡过
  rationale: “渡过”是汉语叙述过河的自然说法，准确表达跨越幼发拉底河。
- source_word: τὸν Εὐφράτην ποταμόν
  choice: 幼发拉底河
  rationale: 采用该河名在现代简体中文中的通行译名。
- source_word: διεπορεύετο
  choice: 继续行经
  rationale: 未完成时描写持续进行的行程；“继续行经”既承接渡河，也体现他在多个地区间前行。
- source_word: τὰς ἐπάνω χώρας
  choice: 上方诸地区
  rationale: 较贴近 ἐπάνω 的空间表述，并保留其究竟指“上游”“内陆”还是行政上的“上部行省”的不确定性。
