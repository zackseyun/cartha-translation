base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: zh_hans
  text: 耶路撒冷无人居住，如同旷野；她所生的人中，没有一个进城或出城[a]。圣所遭人践踏，外族人的子孙住在堡垒[b]中，那里是列国之人的住处。雅各的欢欣被夺去了，笛声和琴声也止息了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她所生的人”直译希腊文γενημάτων；在这里可能指生在耶路撒冷的人，也就是她的居民。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作专名“阿克拉”，指耶路撒冷的设防据点。
    reason: alternative_reading
  - marker: c
    text: 这里的“琴”指一种弦乐器，也可译作“里拉琴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος
  choice: 无人居住
  rationale: 直接表达没有居民的具体含义，并与下文“如同旷野”相配，避免把两个意象都笼统译为“荒凉”。
- source_word: ὡς ἔρημος
  choice: 如同旷野
  rationale: 保留原文的明喻和荒无人烟的意象；“旷野”比“沙漠”涵盖面更广。
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: 她所生的人中
  rationale: γενημάτων字面涉及所生之物或后代；结合城市语境，指与耶路撒冷相属、由她而生的人。正文保留这一拟人化表达，而不直接改写成“居民”。
- source_word: ἁγίασμα
  choice: 圣所
  rationale: 自然、庄重地指称神圣场所，又不把范围过度限定为某一建筑部分。
- source_word: καταπατούμενον
  choice: 遭人践踏
  rationale: 保留动词实际踩踏及凌辱亵渎的双重力度，不只解释性地译成“被亵渎”。
- source_word: υἱοὶ ἀλλογενῶν
  choice: 外族人的子孙
  rationale: 保留υἱοὶ的亲属表达以及ἀλλογενῶν的异族含义，比单译“外族人”更贴近现存希腊文本。
- source_word: ἄκρα
  choice: 堡垒
  rationale: 清楚传达耶路撒冷设防据点的性质；专名“阿克拉”置于脚注。
- source_word: κατάλυμα ἐν τοῖς ἔθνεσιν
  choice: 那里成了列国之人的住处
  rationale: 把省略式名词结构自然转成汉语句子；“列国之人”保留ἔθνη的宽泛含义，避免直接限定为神学术语“外邦人”。
- source_word: ἐξῆρθη τέρψις
  choice: 不再有欢欣
  rationale: 以自然汉语表达欢悦被除去的结果，同时保留哀歌式语气。
- source_word: αὐλὸς καὶ κινύρα
  choice: 笛声和琴声
  rationale: 以声音的止息表达乐器不再奏响，符合汉语搭配；κινύρα是一种弦乐器，具体形制难以由现代乐器名精确对应。
theological_decisions:
- issue: γενημάτων αὐτῆς在城市拟人语境中的含义
  choice: 她所生的人中
  alternative: 她的居民中；从她那里
  rationale: 现存希腊文明确含有γενημάτων，不宜省略。直译式表达既保留文本的拟人化和词义张力，也可借脚注说明语境所指。
- issue: ἄκρα应作普通名词还是历史专名
  choice: 堡垒
  alternative: 阿克拉
  rationale: 正文译出含义便于普通读者理解，同时在脚注保留它可能是耶路撒冷特定塞琉古据点的专名。
- issue: ἔθνεσιν是否译作带神学色彩的“外邦人”
  choice: 列国之人
  alternative: 外邦人；各族人
  rationale: 原词可指列国或非犹太民族；此处不必在正文中过度确定其神学分类，因此采用较宽泛的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分句重现希腊文层层铺陈的荒凉景象；适度补出“进城”“那里成了”等汉语所需成分，但不删除γενημάτων，也不把ἔθνη单一化为教义性较强的称谓。
