  yaml_path: translation/deuterocanon/1_maccabees/003/008.yaml
  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
translation:
  language: zh_hans
  text: 他走遍犹大的各城，从那地除灭了不敬虔的人[a]，使忿怒离开以色列[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬虔的人”也可译作“不虔诚的人”或“恶人”。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，“忿怒”很可能指上帝的忿怒，不过本节没有明确提到上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: διῆλθεν ἐν πόλεσιν Ἰούδα
  choice: 走遍犹大的各城
  rationale: διέρχομαι在此表示经过一系列地方；“走遍”自然表达巡行各城之意。πόλεσιν可指城或城镇，“各城”简洁且符合地理语境；Ἰούδα作地域名称理解。
- source_word: ἐξωλόθρευσεν
  choice: 除灭了
  rationale: 该动词语气强烈，指藉毁灭而彻底清除。“除灭”保留其力度，又不额外限定具体手段。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: ἀσεβής主要指对上帝或神圣秩序不敬、悖逆的人；“不敬虔的人”保留其宗教与道德含义，比宽泛的“恶人”更贴近原文。
- source_word: ἐπʼ αὐτῆς
  choice: 从那地
  rationale: 阴性单数代词并不回指复数的“各城”，最自然是指犹大这片地域。“那地”在中文中明确其地域所指，同时不重复添加原文没有的专名。
- source_word: ἀπέστρεψεν ὀργὴν
  choice: 使忿怒离开
  rationale: 该表达意为使忿怒转离或被消除。“使忿怒离开”既贴近希腊文结构，也在现代中文中清楚自然；“忿怒”保留经文语体的庄重感。
- source_word: ἀπὸ Ἰσραήλ
  choice: 离开以色列
  rationale: ἀπό标明忿怒从以色列转离；“以色列”保留原文的群体性称呼，不擅自扩写为“以色列人”。
theological_decisions:
- issue: “忿怒”是否明确指上帝的忿怒
  choice: 正文只译作“忿怒”，不明说其发出者
  alternative: 译作“上帝的忿怒”
  rationale: 在犹太经文语境中，ὀργή很可能指上帝的忿怒，但本节没有直接提到上帝。正文保留这种含蓄，脚注说明语境上的可能性，避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走遍”“从那地除灭”保留叙事的行动力度；“不敬虔”和“忿怒”维持经文的宗教语义，但避免过度古雅。所有脚注标记均置于正文相应词语之后。
