  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: zh_hans
  text: 他的所有弟兄都帮助他，凡跟随他父亲的人也都帮助他；他们欢喜地为以色列争战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译作“他们带着欢喜，打以色列的战争”。“以色列的战争”可指属于以色列的战争，也可指为以色列而战。
    reason: 说明希腊语“以色列的战争”的属格关系及同源宾语结构，同时保留其归属与受益关系之间的含义张力。
lexical_decisions:
- source_word: ἐβοήθουν
  choice: 帮助
  rationale: 未完成时描写持续的支援行动；现代汉语叙事中用“帮助”自然清楚，无须生硬地标出进行体。
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的众兄弟
  rationale: 这里按上下文指玛 Mattathias 的儿子们，是实际的男性亲属；“众兄弟”兼顾全称 πάντες 和自然庄重的汉语表达。
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: 所有归附他父亲的人
  rationale: κολλάω 在此表示与某人联合、依附并站在其一方；“归附”保留结盟和忠诚的意味，又不扩展为经文未明说的正式盟约。
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: 争战
  rationale: 希腊语采用同源宾语结构，直译为“打……战争”在现代汉语中累赘；“争战”自然表达持续作战，同时保留军事含义。
- source_word: Ἰσραήλ
  choice: 为以色列
  rationale: 属格“以色列的战争”可表示这场战争属于以色列或为以色列而战；正文采用自然的“为以色列”，并以脚注保留较形式对应的表达及其歧义。
- source_word: μετʼ εὐφροσύνης
  choice: 欢欢喜喜地
  rationale: εὐφροσύνη 表示喜悦、欢欣；叠词形式符合现代汉语叙事，传达甘心而振奋的语气。
theological_decisions:
- issue: “以色列的战争”（τὸν πόλεμον Ἰσραήλ）的关系
  choice: 为以色列争战
  alternative: 欢喜地进行以色列的战争
  rationale: 该短语描述具体军事斗争与以色列之间的归属或受益关系。正文用自然汉语表达为“为以色列争战”，但不把它扩展成“圣战”等经文未明说的神学概念；脚注保留属格结构可能具有的归属意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“归附”准确传达站到玛他提亚一方的含义；分号理清两组帮助者与随后共同争战之间的关系。正文中的脚注标记与脚注完全对应。
