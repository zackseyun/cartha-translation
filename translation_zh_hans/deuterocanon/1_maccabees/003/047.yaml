lexical_decisions:
- source_word: ἐνήστευσαν
  choice: 禁食
  rationale: 准确表达宗教性禁食，也符合现代中文圣经语体。
- source_word: περιεβάλλοντο σάκκους
  choice: 身披麻布
  rationale: 保留以麻布裹身、穿戴麻衣的哀悼动作；“身披”自然且不把动作过度具体化。
- source_word: σποδὸν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: 把灰撒在头上
  rationale: 原文省略了支配“灰”的动词，但并列结构表达采取哀悼行动；补出“撒”符合这一固定习俗，也使现代汉语完整通顺。
- source_word: διέρρηξαν τὰ ἱμάτια αὐτῶν
  choice: 撕裂衣服
  rationale: 直译撕裂自己的衣服，保留公开哀恸的强烈动作。
