  text: And he was like a lion in his deeds[a], and like a lion’s cub roaring for prey.
translation:
  language: zh_hans
  text: 他在行事上像狮子，又像一头为捕食而咆哮的幼狮[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幼狮”或译“年轻的狮子”。
    reason: σκύμνος指幼小或年轻的狮子；此处保留其可译为“年轻的狮子”的词汇弹性。
lexical_decisions:
- source_word: ὡμοιώθη
  choice: 如同
  rationale: 此处被动形式表达比拟，并非形体或本质上的转变；“如同”自然地保留明喻。
- source_word: Λέοντι
  choice: 狮子
  rationale: 与ὡμοιώθη构成比较对象；汉语不需要添加不定冠词。
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: 在所行的事上
  rationale: ἔργα在此指他的行动和功绩；这一译法既贴近原文结构，也避免把它局限为抽象的“工作”。
- source_word: σκύμνος
  choice: 幼狮
  rationale: 该词指幼小或年轻的狮子；“幼狮”简洁、现代，并与前句泛指的“狮子”有所区别。
- source_word: ἐρυγόμενος
  choice: 咆哮
  rationale: 分词描写狮子捕猎时发出的吼声；“咆哮”符合汉语中的狮子意象。
- source_word: εἰς θήραν
  choice: 为猎物
  rationale: 介词短语可表达捕猎的目标或目的；“为猎物”保留原文略为凝练的捕食意象，也可理解为“为了捕猎”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代书面汉语。保留原文两个并列的狮子明喻，以及“在所行的事上”这一限定语；不把英雄叙事意象作神学化解释。
