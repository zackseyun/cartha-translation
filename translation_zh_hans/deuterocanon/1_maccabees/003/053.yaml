  text: How will we be able to stand before them[a], unless you help us?
translation:
  language: zh_hans
  text: 如果你不帮助我们，我们怎能在他们面前站立得住[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抵挡他们”或“与他们抗衡”；希腊语在这里可指面对敌手并站稳阵脚。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δυνησόμεθα
  choice: 我们怎能
  rationale: 以反问形式自然表达将来处境中的能力与可能性；上下文已清楚指向即将面对的冲突，无须生硬地另加“将能够”。
- source_word: ὑποστῆναι
  choice: 站立得住
  rationale: 既保留“站立”的形象，也表达在敌对压力下坚持、抵挡而不退却的语义。
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: 在他们面前
  rationale: 贴近希腊语的面向性表达；军事语境使其自然带有迎敌、对抗之意，同时不把多义性限定为单一解释。
- source_word: ἐὰν μὴ
  choice: 如果……不
  rationale: 准确表达否定条件；在本句中文结构中比“除非”更顺畅，并与反问句自然衔接。
- source_word: σὺ βοηθήσῃς ἡμῖν
  choice: 你不帮助我们
  rationale: 保留显明的第二人称主语和直接求助语气，不增添原文未明说的得胜或拯救概念。
theological_decisions:
- issue: 军事祈求中对上帝帮助的直接依赖
  choice: 保留“如果你不帮助我们”的直接称呼与条件关系
  alternative: 除非你援助我们，我们怎能抵挡他们呢？
  rationale: 原文承认面对敌人时对受呼求者帮助的依赖，却没有具体说明帮助的方式或保证的结果；译文不作神学扩展。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“站立得住”兼顾原文意象与冲突语境；脚注保留“抵挡”等可能译法。
