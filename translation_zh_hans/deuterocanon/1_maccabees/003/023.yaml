  yaml_path: translation/deuterocanon/1_maccabees/003/023.yaml
  text: And when he stopped speaking[a], he suddenly charged at them[b], and Seron and his camp were crushed before him.
translation:
  language: zh_hans
  text: 他一说完话，就突然向他们发动进攻；色龙和他的军队[a]在他面前被击溃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”：原文也可译作“军营”或“营中的部队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: 他一说完
  rationale: 该结构表示犹大结束讲话后，攻击随即发生；“一说完”自然简洁，也保留了紧接发生的语气。
- source_word: ἐνήλατο ἐπʼ αὐτοὺς ἄφνω
  choice: 便突然冲向他们
  rationale: ἐνήλατο描写突然扑向或冲击对方的进攻动作，ἄφνω明确表示“突然”；译文兼顾动作感和军事语境。
- source_word: συνετρίβη
  choice: 被击溃了
  rationale: 该被动动词本义有“打碎、摧毁”之意；在战事叙述中，“被击溃”既保留强烈程度，又符合现代汉语习惯。
- source_word: Σήρων
  choice: 色龙
  rationale: 按希腊文Σήρων音译，并采用现代中文圣经人名中清楚简洁的形式。
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: 他的军队
  rationale: παρεμβολή可指军营，也可转指驻营的军队；此处与色龙一同成为被击溃的对象，译作“军队”最合上下文，同时以脚注保留具体的“军营”意象。
- source_word: ἐνώπιον αὐτοῦ
  choice: 就在他面前
  rationale: 贴近原文“在他面前”，表明色龙及其部队在犹大直接进攻之下被击溃，而不额外扩展因果含义。
