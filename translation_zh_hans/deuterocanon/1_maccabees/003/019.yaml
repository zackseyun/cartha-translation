  yaml_path: translation/deuterocanon/1_maccabees/003/019.yaml
  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
translation:
  language: zh_hans
  text: 因为战争的胜利不在于兵力众多[a]，而力量来自天上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“力量众多”。这里的希腊词也可指军力；本句把人所聚集的强大兵力与来自天上的力量相对照。
    reason: 说明语境化译法，并保留原文中“力量／军力”的词义范围。
lexical_decisions:
- source_word: πλήθει δυνάμεως
  choice: 兵力众多
  rationale: πλῆθος表示数量众多，δύναμις在战争语境中可指力量或军力；合译为“兵力众多”符合现代汉语，同时保留人所聚集的军事力量这一含义。
- source_word: νίκη πολέμου
  choice: 战争的胜利
  rationale: πολέμου限定胜利的战争性质；“战争的胜利”自然、准确，且不把范围缩窄为某一场战斗。
- source_word: ἀλλʼ ἢ
  choice: 而
  rationale: 此处构成鲜明对比：胜利不取决于人的众多兵力，力量反而来自天上。“而”在中文中简洁地表达这一转折。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 来自天上
  rationale: 忠实保留希腊文“从天上”的措辞及其在犹太希腊语境中对神圣来源的含蓄指称，不直接改写为“来自上帝”。
- source_word: ἰσχύς
  choice: 力量
  rationale: ἰσχύς意为力量、强力。译作“力量”既与前句的“兵力”形成关联，也保留δύναμις与ἰσχύς并非同一个词的细微差别。
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ是否应明确译为来自上帝
  choice: 来自天上
  alternative: 来自上帝
  rationale: 原文明确使用“天上”作为神圣援助之来源的含蓄表达。正文保留这种委婉说法，不替原文消除其表达张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“兵力众多”符合战争语境；后半句保留简洁有力的“力量来自天上”，呈现原文的对照结构。
