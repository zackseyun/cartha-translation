  yaml_path: translation/deuterocanon/1_maccabees/003/055.yaml
  text: 'And after this Judas appointed leaders of the people: commanders of thousands[a], and of hundreds, and of fifties, and of tens.'
translation:
  language: zh_hans
  text: 此后，犹大任命了百姓的领袖[a]，就是千夫长、百夫长、五十夫长和十夫长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“百姓的首领”。希腊文在这里先用泛指带领者的词，随后列出具体的军职等级。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: 此后
  rationale: 自然、简洁地表达时间上的承接，保留希腊文所标明的先后次序。
- source_word: κατέστησεν
  choice: 任命了
  rationale: 这里指把人安置在军事领导职分上；“任命”符合现代汉语习惯，也准确表达授予职责之意。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用中文圣经传统中对该人名的通行译法。
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: 百姓的领袖
  rationale: ἡγουμένους 是泛指带领者的词，后面的各级军职进一步说明其具体身份；“领袖”保留这一由宽至窄的表达。
- source_word: χιλιάρχους
  choice: 千夫长
  rationale: 采用简洁且为中文读者熟悉的编制称谓，表达统领千人的军职，不引入罗马特有的官衔。
- source_word: ἑκατοντάρχους
  choice: 百夫长
  rationale: 与“千夫长、五十夫长、十夫长”构成整齐的分级军职序列。
- source_word: πεντηκοντάρχους
  choice: 五十夫长
  rationale: 直接保留数字所体现的军队层级结构。
- source_word: δεκαδάρχους
  choice: 十夫长
  rationale: 直接保留数字所体现的最低一级编制职务，并与全句其他称谓保持一致。
