  yaml_path: translation/deuterocanon/1_maccabees/003/022.yaml
  text: And he himself will crush them before us; but as for you, do not fear them.
translation:
  language: zh_hans
  text: 他必亲自把他们击溃在我们面前；你们不要怕他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: 他必亲自
  rationale: αὐτός在这里带强调意味；“亲自”自然地突出神是决定性的行动者，同时不在正文中额外补明其身份。
- source_word: συντρίψει
  choice: 把他们击溃
  rationale: συντρίβω表示猛烈打碎、粉碎；在军事语境中，“击溃”既保留强烈力度，也比字面的“压碎”更符合现代汉语表达。
- source_word: πρὸ προσώπου ἡμῶν
  choice: 在我们面前
  rationale: 这一短语字面指“在我们面前／当着我们的面”，兼具空间和临阵意味；此译保留原文措辞，不将其解释成较具体的“从我们面前赶走”。
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: 你们不要怕他们
  rationale: μή加不定过去时虚拟式构成直接禁令；“不要怕他们”简洁自然，准确传达劝勉语气。
theological_decisions:
- issue: 强调代词αὐτός所指的行动者
  choice: 译作“他必亲自”，保留强调，但不在本节正文中把“他”明说为“神”
  alternative: 译作“神必亲自”或弱化为“他必”
  rationale: 上下文表明所指为神，但本句原文使用代词。保留“他”尊重篇章衔接与原文形式；加入“亲自”则体现αὐτός的强调，突出胜利取决于他的行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“击溃”适合军事语境并保有原词的强烈力度；分号呈现前后两句之间由神的行动引出的劝勉关系。
