  naturalness: “他的名声甚至传到王那里”符合现代庄重叙事汉语。“各国都传讲有关犹大的每一场战事”比“各国都在述说犹大的每一次战阵”更自然，也明确了“传讲”的内容与“有关”的关系；“战事”在汉语中能自然涵盖原文可能指向的战阵和交战。
