  yaml_path: translation/deuterocanon/1_maccabees/003/026.yaml
  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: zh_hans
  text: 他的名声甚至传到王那里；各国都传讲有关犹大的每一场战事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关犹大的每一场战事”所对应的希腊语句法较为紧缩。“战事”所译的词也可指“战阵”或军队的列阵；介词可理解为“关于”。因此也可译为“各国都传讲犹大的各次战阵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: 甚至传到王那里
  rationale: ἤγγισεν本义为“临近、接近”，与ἕως τοῦ βασιλέως连用时，表达他的声名传到了王那里。中文用“传到”自然地保留这种传播并抵达的意象。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名声
  rationale: 字面是“他的名字”，但此处“名字”指名望、声誉；现代汉语译作“名声”更清楚自然。
- source_word: ὑπὲρ πᾶν παράταξιν Ἰούδα
  choice: 犹大的每一次战阵
  rationale: παράταξις可指列阵、战阵或交战；Ἰούδα按语境作所属关系理解。ὑπέρ在这个紧缩短语中的确切作用不明，正文采用“述说……战阵”的通顺理解，并以脚注保留疑难。
- source_word: ἐξηγεῖτο
  choice: 在述说
  rationale: 该未完成时动词可指讲述、详述；“在述说”既体现持续流传，也不过度限定讲述内容。
- source_word: πᾶν ἔθνος
  choice: 各国
  rationale: 该单数集合性短语字面为“每一个民族／国家”；“各国”符合现代汉语习惯，并保留普遍性的表达。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 此处指犹大·马加比；“犹大”是中文圣经传统中该人名的通行形式。
theological_decisions:
- issue: ὑπὲρ πᾶν παράταξιν Ἰούδα这一紧缩短语的关系
  choice: 理解为各国述说犹大的每一次战阵
  alternative: 理解为各国谈论犹大胜过一切战阵，或谈论犹大与所有军阵的关系
  rationale: 希腊语的搭配较难，ὑπέρ既可能带有“关于”的意义，也可能保留“超过／在……之上”的意味；正文选择在上下文中较自然的军事叙事理解，但用脚注明示其他可能，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“名声传到王那里”符合中文表达；分号呈现两个并列而递进的消息传播场景。
