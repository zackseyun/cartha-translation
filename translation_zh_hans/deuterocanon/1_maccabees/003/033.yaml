  text: and to provide for Antiochus his son until he returns[a].
translation:
  language: zh_hans
  text: 并供养他的儿子安条克，直到他回来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“供养他的儿子安条克，直到他返回。”原文也可较直译为“养育／扶养他的儿子安条克，直到他回来”。
    reason: 说明τρέφειν的词义范围，并保留ἐπιστρέψαι αὐτόν可用名词化或有限动词表达的可能。
lexical_decisions:
- source_word: τρέφειν
  choice: 供养
  rationale: 该词可指喂养、抚育或维持生活；在宫廷委托的语境中，“供养”自然表达在父亲离开期间照料并维持其儿子生活所需，且不过度扩展原意。
- source_word: Ἀντίοχον
  choice: 安条克
  rationale: 采用现代中文圣经及历史文献中常见的人名译法。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 他的儿子
  rationale: 直接保留希腊文明确表达的父子关系及所属关系。
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: 直到他回来
  rationale: ἕως加冠词不定式表示时间界限。中文用限定小句表达自然；代词最自然地指语境中离开的父亲，但原句仅用代词，译文也保留“他”的指代张力。
