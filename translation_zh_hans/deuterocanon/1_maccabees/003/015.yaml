base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: zh_hans
  text: 又有一支由不敬虔之人组成的强大军队[a]加入了他，随他一同上去，要帮助他，并向以色列子孙施行报复[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”也可译作“营地”或“营寨”；希腊语παρεμβολή可指营地、营寨或出征的军队。
    reason: lexical_alternative
  - marker: b
    text: 直译是“在以色列子孙中施行报复”；这里按敌对语境译为针对以色列子孙的报复行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: 加入他
  rationale: 该中间形式在这里表示一支力量增添到他一方；中文用“加入他”比直译“被加上”更自然，也不额外说明其动机。
- source_word: ἀνέβη
  choice: 上去
  rationale: 保留ἀναβαίνω常见的上行表达，不另加“进军”等原文未明说的军事细节。
- source_word: παρεμβολὴ
  choice: 军队
  rationale: 该词可指“营地”或“军队”；此处作为能加入并随行、提供援助的主体，译作“军队”在现代中文中最通顺，歧义在脚注中保留。
- source_word: ἀσεβῶν
  choice: 不敬虔之人
  rationale: 保留ἀσεβής兼具宗教与道德意味的“不敬畏神、悖逆”色彩，避免仅译作一般性的“恶人”。
- source_word: ἰσχυρὰ
  choice: 强大
  rationale: 直接修饰军事力量，现代中文自然明确。
- source_word: βοηθῆσαι αὐτῷ
  choice: 要帮助他
  rationale: 不定式表示目的；“要帮助他”简明自然。
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: 施行报复
  rationale: 保留ἐκδίκησις所表达的惩罚性报复，不弱化为一般的“惩罚”，也不预先判定这种报复是否正当。
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: 向以色列子孙
  rationale: 敌对语境表明行动以以色列人为对象；“向……施行报复”符合现代中文搭配，同时保留“以色列子孙”这一传统族群称谓。
theological_decisions:
- issue: 军事政治语境中ἀσεβῶν的宗教—道德色彩
  choice: 不敬虔之人
  alternative: 恶人；不虔诚的人；不敬神的人
  rationale: 原词不只表示一般邪恶，也含对神不敬的意味；所选译法保留这种色彩，却不引入后世特定教义标签。
- issue: υἱοῖς Ἰσραήλ的族群／盟约称谓
  choice: 以色列子孙
  alternative: 以色列人；以色列的儿子们
  rationale: 该短语是传统的整体族群称谓，并非仅指男性；“以色列子孙”既贴近原文形式，也能在中文圣经语体中自然指全体以色列民。
- issue: ἐκδίκησις的价值判断
  choice: 报复
  alternative: 惩罚；伸冤；复仇
  rationale: 叙事是在陈述敌军的目的，原文没有在该词本身中明确认可其正当性；“报复”保留强烈的惩罚性，同时避免译成“伸冤”而暗示神学上的正当裁决。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“加入他，同他一起上去”保留原文两个并列动作；“不敬虔之人”保留宗教—道德意味；脚注明示παρεμβολή及介词短语的真实语义幅度。所有脚注标记均已置于正文。
