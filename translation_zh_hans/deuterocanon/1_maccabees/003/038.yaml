  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: zh_hans
  text: 于是，吕西亚从王的“朋友”[a]中选了多利米尼的儿子托勒密、尼卡诺尔和戈尔吉亚；他们都是有权势的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王的朋友”在希腊化时代的王室用语中可能是一种宫廷头衔，并不只是指王的私人朋友。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: 选了
  rationale: 该动词表示挑选、选取；“选了”直接自然，不额外加入正式任命的含义。
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: 多利米尼的儿子托勒密
  rationale: 定冠词加人名属格在这里用来说明托勒密与多利米尼的父子关系；汉语明确译出“儿子”最为自然。
- source_word: ἄνδρας δυνατοὺς
  choice: 有权势的人
  rationale: δυνατός可表示强有力、有能力或有权势；结合这些人属于王室核心圈子的语境，“有权势的人”自然保留其能力与地位色彩。
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: 从王的“朋友”中
  rationale: 属格短语表明三人属于王的“朋友”这一群体；“从……中”清楚表达选取范围，引号提示“朋友”可能是宫廷称号，同时不在正文中把这一含义绝对化。
