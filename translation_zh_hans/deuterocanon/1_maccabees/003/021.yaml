  text: But we are fighting for our lives and our laws[a][b].
translation:
  language: zh_hans
  text: 但我们是为自己的性命和律例而战[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵魂”。希腊词ψυχή既可指“性命”，也可指“灵魂”；在这里的战事语境中，“性命”更贴切。
    reason: lexical_alternative
  - marker: b
    text: 或译“法律”、“合法的习俗”或“祖传规条”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: δέ承接上文并形成对比；显出的主语ἡμεῖς带有强调意味。“但我们”自然保留这两层作用。
- source_word: πολεμοῦμεν
  choice: 而战
  rationale: 该动词意为“作战、争战”。结合“为……”，译作“而战”简洁自然，也符合当前战事的语境。
- source_word: περὶ
  choice: 为
  rationale: 在争战语境中，περί表示争战所维护的对象或所关乎的重大利益；现代汉语用“为”最为自然。
- source_word: τῶν ψυχῶν ἡμῶν
  choice: 自己的性命
  rationale: ψυχή既可指“生命、性命”，也可指“灵魂”。这里处于军事冲突语境，首先指生命安危；“自己的”也自然表达ἡμῶν与强调主语的关系。
- source_word: τῶν νομίμων ἡμῶν
  choice: 律例
  rationale: νόμιμα可指依法确立的规条、礼制或祖传惯例，尤其涵盖犹太群体的法律与宗教生活。“律例”保留其规范性和宗教文化分量，又不把范围缩成一般习俗。
theological_decisions:
- issue: 战事语境中ψυχαί的含义
  choice: 性命
  alternative: 灵魂
  rationale: 上下文关乎武装冲突与生存，因此正文采用具体的“性命”，避免无根据地引入灵魂—身体二分；脚注保留词义上的真实可能。
- issue: νόμιμα的范围
  choice: 律例
  alternative: 法律、合法的习俗或祖传规条
  rationale: 该词不只可能指成文法律，也可涵盖依法或按传统确立的宗教礼俗。“律例”在简体中文圣经语体中庄重而易懂，能较宽地承载这些含义；脚注说明其他译法。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“为自己的性命和律例而战”结构自然，并保留原文对“我们”的强调和与上文的对比。正文中的[a][b]与脚注逐一对应。
