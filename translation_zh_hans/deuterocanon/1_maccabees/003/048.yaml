  yaml_path: translation/deuterocanon/1_maccabees/003/048.yaml
  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: zh_hans
  text: 他们展开律法书[a]；列国曾就此搜寻他们偶像的形像[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “展开”也可译作“打开”或“摊开”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处结构紧缩，意思不完全明确。“就此”也可理解为“关于这律法书”。整句也可能是说，列国为制作或求问他们偶像的形像而查考律法书。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: 展开
  rationale: 此动词有铺开、展开之意；用于书卷时，“展开”既保留具体动作，也不武断限定载体形态。
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: 律法书
  rationale: 简洁而自然地表达这部承载律法的书卷；不以书名号或专名化进一步限定。
- source_word: περὶ ὧν
  choice: 在这书中
  rationale: 希腊文关系结构紧缩且指涉不够顺畅。正文采用可理解的关系表达，同时以脚注保留“关于这书／就此而言”等可能性。
- source_word: ἐξηρεύων
  choice: 曾……搜寻
  rationale: 表达探寻、查找之意，并以“曾”呈现未完成过去时所指向的过去行为，而不强行判定是持续还是惯常。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 直接对应非以色列诸民族，保留犹太文本的群体视角，也避免“异教徒”等较强的解释性措辞。
- source_word: τὰ ὁμοιώματα
  choice: 形像
  rationale: 表示相似物、表象或摹本；“形像”与后面的“偶像”保持词义区别。
- source_word: τῶν εἰδώλων αὐτῶν
  choice: 他们偶像的
  rationale: 保留祭祀语境中的贬义与所属关系，不释为“假神”，以免加入原文没有明说的解释。
theological_decisions:
- issue: 律法书与列国偶像形像之间的关系
  choice: 正文译为列国“在这书中搜寻”偶像的形像，但用脚注明示原文关系紧缩、具体情形不确定。
  alternative: 也可能指列国为了制作或求问偶像的形像而查考律法书，或他们就与偶像有关的事进行探寻。
  rationale: 希腊文 περὶ ὧν 的先行关系及整句实践场景含混。正文须在现代汉语中成句，但不应把比较、制作或求问等任何一种重构当作唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“律法书”“列国”“偶像”保留经文语域；以分号连接两个紧密相关但原文关系含混的分句。所有脚注标记均已置于正文。
