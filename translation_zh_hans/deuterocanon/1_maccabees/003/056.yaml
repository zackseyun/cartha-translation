  to: 他吩咐那些正在盖房、已与女子订婚、正在开辟葡萄园，以及胆怯的人[b]，要各自照律法的规定回家[a]。
  rationale: 修订仅处理一处不自然的动宾搭配，并将“按律法”译得更贴近原文。四类对象、间接命令、逐一分配的“各自”，以及律法背景的脚注均予保留；脚注标记也仍紧随其所说明的词语或短语。
