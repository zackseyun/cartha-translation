base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: zh_hans
  text: 他吩咐那些正在盖房、已与女子订婚、正在开辟葡萄园，以及胆怯的人[b]，要各自照律法的规定回家[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照律法的规定”很可能是指《申命记》20:5–8所规定的出战豁免。
    reason: cross_reference
  - marker: b
    text: “胆怯”也可译作“惧怕”或“怯懦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: 正在盖房
  rationale: 保留现在分词所表达的进行状态；现代汉语通常说“盖房”，无需机械补出不定冠词。
- source_word: μνηστευομένοις γυναῖκας
  choice: 与女子订了婚
  rationale: μνηστεύω指进入婚约关系；“订了婚”自然地传达其法律和社会含义，“与女子”也保留了原文宾语。
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: 正在栽种葡萄园
  rationale: ἀμπελών指葡萄园，使用“正在栽种”与前面的进行性分词结构相呼应。
- source_word: δειλοῖς
  choice: 胆怯的人
  rationale: δειλός可指惧怕、胆怯或怯懦；“胆怯”保留其语义张力，不贸然将其定性为应受谴责的懦弱。
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: 要各自回家
  rationale: 不定式在εἶπεν之后表达间接命令；“要”传达指令语气，“各自”保留ἕκαστον的逐一分配含义，“回家”是现代汉语自然说法。
- source_word: κατὰ τὸν νόμον
  choice: 遵照律法而行
  rationale: 准确表达“按照律法”的规范性含义，同时以自然汉语连接整项命令，不把原文未明说的“摩西”增入正文。
theological_decisions:
- issue: 是否在正文明确指出申命记背景
  choice: 仅译作“遵照律法而行”
  alternative: 遵照摩西律法而行
  rationale: 希腊文只说“律法”；虽很可能指向申命记20:5–8的出战豁免规定，却不宜在正文增添“摩西”，相关背景置于脚注。
- issue: 如何处理δειλοῖς的道德色彩
  choice: 胆怯的人
  alternative: 怯懦的人
  rationale: “怯懦”较容易带入道德谴责；“胆怯”既可表示临战惧怕，也不排除原词较负面的含义，较能保留歧义。
- issue: 如何表达阳性单数的分配结构
  choice: 各自回家
  alternative: 各人回到他自己的家
  rationale: 本节语境中的对象是出战男子，但现代汉语“各自回家”已充分表达逐一分配关系，无需生硬重复阳性代词，也没有改变原文所指群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吩咐……要……”自然呈现希腊文间接命令；并列项目保持清晰，不使用古奥措辞。脚注标记分别紧随其所说明的“胆怯的人”和“遵照律法而行”。
