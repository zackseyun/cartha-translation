    issue: “正在栽种葡萄园”搭配不自然。
    rationale: 中文通常不说“栽种葡萄园”；可栽种葡萄树，或开辟／建立葡萄园。原文的“种植葡萄园”是希腊语惯用的建立葡萄园之意，译作“正在开辟葡萄园的”既自然又不缩窄为只栽种葡萄树。
  - severity: low
    issue: “遵照律法而行”略有扩展。
    rationale: κατὰ τὸν νόμον仅表示“按／照律法”。“照律法的规定”更简洁直接，并清楚修饰返回的命令。
