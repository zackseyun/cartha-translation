  yaml_path: translation/deuterocanon/1_maccabees/003/024.yaml
  text: And they pursued them down the descent of Beth-horon as far as the plain[a], and about eight hundred of them fell; but the rest fled into the land of the Philistines.
translation:
  language: zh_hans
  text: 他们沿着伯和仑的下坡追赶敌军，直到平原。敌军中约有八百人倒下[a]，其余的人逃到非利士人之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“他们中倒下的约有八百人”。希腊文明确说“人”，而εἰς与数词连用在这里可表示约数。
    reason: 说明原文的较直译表达及约数用法。
lexical_decisions:
- source_word: ἐδίωκον
  choice: 追赶
  rationale: 未完成时描写持续进行的追击；“追赶”符合现代汉语叙事，也保留主动追逐的意味。
- source_word: ἐν τῇ καταβάσει Βαιθωρὼν
  choice: 沿着伯和仑的下坡
  rationale: κατάβασις指下坡或向下的道路；“沿着……下坡”既呈现地势，也自然表达追击方向。Βαιθωρών采用中文圣经地名的通行译法“伯和仑”。
- source_word: ἕως τοῦ πεδίου
  choice: 直到平原
  rationale: 保留ἕως所表达的终点界限，并以“平原”呈现πέδιον与前文下坡地势的对照。
- source_word: ἔπεσον ἀπʼ αὐτῶν
  choice: 敌军中……倒下
  rationale: ἀπʼ αὐτῶν表示这些被追赶者当中有人伤亡；补出“敌军”可消除汉语代词混淆。“倒下”贴近ἔπεσον，同时不把原文未明说的具体死伤情形过度限定。
- source_word: εἰς ἄνδρας ὀκτακοσίους
  choice: 约有八百人
  rationale: εἰς与数词连用在此可表达约数；译出“人”，并用“约”保留其估算意味。
- source_word: οἱ δὲ λοιποὶ
  choice: 其余的人
  rationale: 清楚指明未倒下的其余敌军；上下句的对照在汉语中已自然显明，无须机械译出δέ。
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: 逃到非利士人之地
  rationale: 贴近原文“非利士人的土地”，并保持庄重、清楚的地理表达。
