  yaml_path: translation/deuterocanon/1_maccabees/003/005.yaml
  text: And he hunted down the lawless[a], searching them out[b], and he burned those who troubled his people.
translation:
  language: zh_hans
  text: 他追赶不法之徒[a]，仔细搜寻他们；又焚烧了那些扰害他百姓的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追赶……仔细搜寻”也可译作“追捕……四处搜寻”。
    reason: 说明ἐδίωξεν与ἐξερευνῶν相连时可具有更强的追捕语气。
  - marker: b
    text: “焚烧”直译为“使……燃烧起来”或“放火烧……”。
    reason: 保留ἐφλόγισεν的字面火焚含义及可译范围，同时不额外断定结果。
lexical_decisions:
- source_word: ἐδίωξεν
  choice: 追赶
  rationale: 表示积极而持续地追逐；“追赶”保留原文的行动力度，又不额外限定为司法逮捕或宗教迫害。
- source_word: ἀνόμους
  choice: 不法之徒
  rationale: 保留该词违反律法及群体秩序的道德—法律意味；比“罪犯”宽，也不像“恶人”那样淡化“无法无律”的含义。
- source_word: ἐξερευνῶν
  choice: 仔细搜寻他们
  rationale: 分词说明追赶的方式，含有彻底搜查、力求找出的意味；补出宾语“他们”使现代汉语自然清楚。
- source_word: παράσσοντας
  choice: 扰害
  rationale: 兼顾搅扰与造成伤害两层意思，不将其过度具体化为政治压迫或单纯骚扰。
- source_word: ἐφλόγισεν
  choice: 焚烧了
  rationale: 直接保留原文以火焚烧的严厉动作，不淡化为比喻性的“惩治”，也不添加原文未明说的结果。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 他百姓
  rationale: λαός指作为整体的人民；“他百姓”自然保留其群体归属意味。
theological_decisions:
- issue: ἀνόμους的道德—法律含义
  choice: 不法之徒
  alternative: 恶人；罪犯
  rationale: 原词既指违背律法，也带有道德谴责；译文保留这层张力，不把范围缩窄为一般刑事罪犯。
- issue: ἐφλόγισεν所述行动的严厉程度
  choice: 焚烧了那些扰害他百姓的人
  alternative: 使那些扰害他百姓的人燃烧起来；用火烧他们
  rationale: 原文直陈焚烧这一行动。译文不加以缓和，也不擅自说明具体方式或最终是否烧死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不法之徒”保留道德与法律双重色彩；“扰害”涵盖搅扰和伤害；分号呈现两个并列行动。所有代词指向依上下文保留，不补入原文未明说的身份说明。
