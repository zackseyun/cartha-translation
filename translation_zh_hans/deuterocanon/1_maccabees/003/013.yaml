  terminology: “叙利亚军队的统帅”“西荣”“忠信者”均可接受；“教会”未被时代错置地用于ἐκκλησίαν，处理得当。将ἐκκλησίαν译作“一群人”虽较宽泛，但在与ἄθροισμα并列的汉语表达中可行。
