  rationale: 修订以“聚集”统摄原文两个并列宾语，避免增添第二个“召集”的动作；以“与他同在”对应μεθʼ αὐτοῦ，不预设单向的追随关系；仍将“忠信者”与“出征作战的人”并列，从而保留末尾属格复数成分关系的句法空间。
