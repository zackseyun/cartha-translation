  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: zh_hans
  text: 叙利亚军队的统帅西荣听说，犹大已经聚集了一支队伍[a]和一群与他同在的忠信者[b]，以及出征作战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”也可译作“聚集起来的一群人”；希腊词ἄθροισμα指集合起来的群体，在本节语境中可能带有军事意味。
    reason: lexical_alternative
  - marker: b
    text: “忠信者”也可理解为“忠诚者”，既可强调他们忠于犹大的事业，也可能包含对盟约的忠信。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σήρων
  choice: 西荣
  rationale: 采用符合现代汉语圣经人名音译习惯的译法。
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: 叙利亚军队的统帅
  rationale: ἄρχων在军事语境中指统领者，δύναμις指武装力量；“统帅”与“军队”自然、明确，又不把职位过度具体化。
- source_word: ἤκουσεν
  choice: 听说
  rationale: 在叙事中表示听到消息；“听说”比单纯“听见”更符合汉语的信息传闻语境。
- source_word: ἤθροισεν
  choice: 已经聚集……又召集
  rationale: 表达在西荣获悉之前已经发生的聚集行动；因汉语搭配需要，对两个并列宾语分别采用“聚集”和“召集”。
- source_word: ἄθροισμα
  choice: 一支队伍
  rationale: 指聚集起来的一群人；结合随后的战争语境，“队伍”保留其可能具有的军事色彩，却不夸大为正规军。
- source_word: ἐκκλησίαν
  choice: 一群
  rationale: 此处指被召集起来的会众或群体，不采用容易带入后期基督教制度含义的“教会”；“召集了一群”在现代汉语中自然地传达集合之意。
- source_word: πιστῶν
  choice: 忠信者
  rationale: 同时保留“忠诚”和“信实”的语义空间，不限定为只忠于犹大的政治追随者，也不把它专门化为后期宗教称谓。
- source_word: μεθʼ αὐτοῦ
  choice: 跟随他的
  rationale: 在军事行动的语境中自然表达与犹大同在、同行；不只是空间上的“在他身边”。
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: 出征作战的人
  rationale: 保留“出去”参与战争的动态含义；“出征作战”符合现代汉语叙事表达。
theological_decisions:
- issue: ἐκκλησίαν在第二圣殿时期犹太军事—宗教语境中的译法
  choice: 一群（与“召集”连用）
  alternative: 会众；教会
  rationale: 避免把后期基督教制度意义倒读进文本，同时保留这是一个被召集起来的群体。
- issue: πιστῶν所表达的忠诚对象与宗教内涵
  choice: 忠信者
  alternative: 忠诚者；信徒
  rationale: 希腊词可兼有可信、忠诚和信实的意味；“忠信者”保留对犹大事业的忠诚与盟约信实之间的张力，不单方面消解其含义。
- issue: 末尾两个属格复数成分的关系
  choice: 将“跟随他的忠信者”和“出征作战的人”并列呈现
  alternative: 把“出征作战”仅作为“忠信者”的修饰语
  rationale: πιστῶν与ἐκπορευομένων在形式上均可依附于ἐκκλησίαν，καί允许并列理解；译文保留这种并列结构，避免无依据地把后者仅限于前者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“听说”“聚集”“召集”“出征作战”形成流畅的历史叙述；不用“教会”等可能造成时代错置的术语，并借脚注保留关键词的语义幅度。
