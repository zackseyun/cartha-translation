  text: And Judas[a], who was called Maccabeus, his son, rose up in his place.
translation:
  language: zh_hans
  text: 他的儿子犹大，就是人称马加比的，兴起，接替了他的位置。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: 起来
  rationale: 此处的简单过去时在父亲去世后的叙事中，表示犹大兴起并开始行动；“起来”保留叙事力度，又不把它解释成正式即位。
- source_word: ὁ καλούμενος
  choice: 就是那称为
  rationale: 该分词结构用附加的名字或称号辨明犹大的身份；“就是那称为”既贴近希腊文，也符合现代汉语表达。
- source_word: Μακκαβαῖος
  choice: 马加比
  rationale: 这是犹大的别名或称号。采用中文圣经及相关历史文献中通行的音译“马加比”，便于普通读者识别。
- source_word: υἱὸς αὐτοῦ
  choice: 他的儿子
  rationale: 直接说明犹大是上文人物的儿子；前置这一短语，可使汉语指代清楚自然。
- source_word: ἀντʼ αὐτοῦ
  choice: 接替了他
  rationale: ἀντί加属格在这里表示取代或承接其位置。“接替了他”自然传达继承关系，但不使用“即位”等更强的政治术语。
theological_decisions:
- issue: 犹大接替父亲的性质
  choice: 起来接替了他
  alternative: 起来代替他／继承了他
  rationale: 原文叙述犹大在父亲之后兴起并取代其位置，却没有使用表示正式政治继位的专门术语；译文保留这种叙事性和关系性，不额外断定其为正式即位。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来接替了他”兼顾ἀνέστη的动作感和ἀντʼ αὐτοῦ的承接含义；本节无需脚注，因为“马加比”是简体中文语境中成熟且清楚的通行译名。
