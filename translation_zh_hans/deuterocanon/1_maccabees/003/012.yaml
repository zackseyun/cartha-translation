  yaml_path: translation/deuterocanon/1_maccabees/003/012.yaml
  text: And they took their equipment[a], and Judas took the sword of Apollonius, and he fought with it all his days.
translation:
  language: zh_hans
  text: 他们夺取了那些人的装备；犹大拿了阿波罗尼乌的剑，尽其一生[a]都用这把剑作战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“所有的日子”；在这里也可理解为犹大此后所有的日子。
    reason: 保留时间短语的字面表达及其惯用含义之间的差异。
lexical_decisions:
- source_word: σκεύη
  choice: 装备
  rationale: 在军事语境中指器具、装备或军用物资；“装备”既自然，又不把原文未明确列出的物件具体化。
- source_word: μάχαιρα
  choice: 剑
  rationale: 该词可指剑、短剑或较大的刀；此处是战争叙事，“剑”是自然且不过度限定形制的译法。
- source_word: ἦν πολεμῶν
  choice: 都……作战
  rationale: ἦν加现在分词表达持续或惯常的行动；结合“尽其一生”，用“都……作战”自然呈现延续意味。
- source_word: ἐν αὐτῇ
  choice: 用这把剑
  rationale: 阴性代词最自然地回指前面的“剑”，介词短语在这里表工具，故译为“用这把剑”。
- source_word: πάσας τὰς ἡμέρας
  choice: 尽其一生
  rationale: 字面为“所有的日子”，在此可惯用地指犹大余下的一生；正文采用自然汉语，并以脚注保留字面可能性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那些人”承接上下文所指的敌方人员，避免汉语“他们夺取了他们的装备”造成两个“他们”所指混淆；分号呈现两个连续动作。
