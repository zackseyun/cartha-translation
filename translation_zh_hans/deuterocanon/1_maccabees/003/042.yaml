base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: zh_hans
  text: 犹大和他的弟兄们看见灾祸日益增多，军队正驻扎在他们境内；他们也认清了王权所下、要对百姓施行的命令[a]，以使他们毁灭和灭绝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”也可译作“王国”或“统治政权”；希腊文用的是表示王国、王权或君主统治的词，并没有直接说“君王”。
    reason: 保留βασιλεία的词义范围及其抽象表达。
  - marker: b
    text: 直译为“给百姓”或“对百姓”；下文表明这些命令意在使百姓毁灭和灭绝。
    reason: 说明希腊文与格的形式，并交代上下文所显示的敌对含义。
lexical_decisions:
- source_word: τὰ κακά
  choice: 灾祸
  rationale: 复数在本段军事、政治语境中指不断加剧的患难与灾害，不限于抽象的道德之恶。
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: 此处指实际部署的武装力量；译作“军队”比抽象的“力量”更符合上下文。
- source_word: παρεμβάλλουσιν
  choice: 正驻扎
  rationale: 保留希腊文现在时所呈现的持续状态，并自然表达军队安营驻守。
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: 在他们境内
  rationale: ὅρια既可指边界，也可指疆域；敌军已经驻扎其中，故“境内”能清楚表达威胁已经进入其领土。
- source_word: ἐπέγνωσαν
  choice: 认清了
  rationale: 该动词表示确知、辨明或充分意识到；“认清了”兼顾认识过程及其确定性。
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: 王权所下的命令
  rationale: λόγοι在此指官方指令，βασιλεία则是王国、王权或统治政权，而非直接写“王”；此译既自然，也保留抽象统治主体。
- source_word: ἐνετείλατο ποιῆσαι
  choice: 要把这些命令施行
  rationale: 该结构兼有下令与付诸实行之意；中文补出“这些命令”，使关系明确而不增加新的内容。
- source_word: τῷ λαῷ
  choice: 在百姓身上
  rationale: 保留与格较为中性的指向表达，同时由后文的毁灭目的清楚显示其敌对性质，避免在正文中先行解释为“攻击”。
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: 使他们毁灭，彻底灭绝
  rationale: 两个名词叠加强调全面、终局性的毁灭；此译保留递进力度，并符合现代汉语表达。
theological_decisions:
- issue: τῆς βασιλείας所指的发令主体
  choice: 王权
  alternative: 王国；君王；王室政权
  rationale: 原文使用抽象名词βασιλεία，并未直接说“君王”。正文用“王权”保留这一形式与统治政权的含义，避免无根据地改成个人主体。
- issue: τῷ λαῷ的敌对含义
  choice: 在百姓身上
  alternative: 对百姓；针对百姓
  rationale: 希腊文形式本身是与格，后接“使他们毁灭，彻底灭绝”才明确表明敌意。选择较贴近形式的说法，让敌对含义由原句目的语自然显出。
- issue: ἀπώλεια与συντέλεια的并列
  choice: 毁灭，彻底灭绝
  alternative: 败亡和终结；毁灭和消灭净尽
  rationale: 保留两个近义词形成的强化，而不把它们压缩成一个概念，也不赋予超出军事政治语境的末世论含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弟兄们”保留古代家族称谓；“灾祸日益增多”“正驻扎在他们境内”清楚呈现局势恶化。“王权”略具正式色彩，但能准确保留原文没有直接写“君王”的特点。
