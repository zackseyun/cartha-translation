  yaml_path: translation/deuterocanon/1_maccabees/003/010.yaml
  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: zh_hans
  text: 亚波罗尼聚集了外邦人[a]，又从撒马利亚聚集了一支大军，要攻击以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”或“各民族”。希腊语原词可以泛指列国或各民族；但在这里很可能指被聚集来攻击以色列的非以色列人。
    reason: 保留ἔθνη的一般词义及本节语境中的具体所指。
lexical_decisions:
- source_word: συνήγαγεν
  choice: 聚集了／召集了
  rationale: 该动词表示把人集合起来。对“外族人”用“聚集”，对军事力量按现代汉语习惯用“召集”，既保留重复的动作概念，又使表达自然。
- source_word: ἔθνη
  choice: 外族人
  rationale: 在本节犹太叙事的战争语境中，指与以色列相对的非以色列族群。“外族人”比“列国”更清楚地表达人物所指，又不像“异教徒”那样额外加入宗教评价。
- source_word: δύναμιν μεγάλην
  choice: 一支大军
  rationale: δύναμις在此指军事力量或部队；“一支大军”符合上下文，也比抽象的“强大力量”自然。
- source_word: τοῦ πολεμῆσαι
  choice: 要……交战
  rationale: 带冠词的不定式表达目的；“要与……交战”简明地传达有组织的军事行动及目的关系。
- source_word: πρὸς Ἰσραήλ
  choice: 与以色列交战
  rationale: πρός与πολεμέω连用表示敌对对象。现代汉语通常说“与……交战”，其敌对含义由动词明确表达。
- source_word: ἀπὸ Σαμαρίας
  choice: 从撒马利亚
  rationale: ἀπό表示来源；“从撒马利亚”准确自然。
theological_decisions:
- issue: 犹太战争语境中ἔθνη的译法
  choice: 外族人
  alternative: 列国／万民
  rationale: 上下文将这些群体与以色列对举，因此采用指非以色列族群的“外族人”；脚注保留“列国”这一较字面的可能译法，避免把词义限定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚波罗尼”“撒马利亚”使用常见中文专名形式；通过“又”清楚呈现两个并列来源。
