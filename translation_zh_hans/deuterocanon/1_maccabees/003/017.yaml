base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: zh_hans
  text: 可是，他们看见敌军正向他逼近[a]，就对犹大说：“我们人数这么少，怎能与这么多人交战呢？我们今天没有吃东西[c]，已经疲惫不堪[b]了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正前来与他相遇”。原文的“营”可指营地或驻营的军队；在这里的军事语境中，是指前来与犹大敌对相遇的军队。
    reason: lexical_alternative
  - marker: b
    text: “疲惫不堪”也可译作“浑身无力”或“精疲力尽”；原文可指身体衰弱，也可含意志消沉之意。
    reason: lexical_alternative
  - marker: c
    text: “没有吃东西”也可译作“禁食”，但原文本身不一定表示正式的宗教性禁食。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: 营伍
  rationale: 在军事语境中可指营地或驻营的军队；“营伍”既保留营地意象，也能自然指正在逼近的敌军。
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: 迎面而来
  rationale: 保留“前来相遇”的基本意义，不在正文中额外明说“攻击”，而让军事语境显出敌对性质。
- source_word: ὀλιγοστοὶ ὄντες
  choice: 人数这么少
  rationale: 自然表达人数稀少，并与后面的庞大敌军形成强调性的对比。
- source_word: πολεμῆσαι
  choice: 交战
  rationale: 准确表达军事上的战斗，语体庄重而通俗。
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: 与这么多人
  rationale: 按上下文指数量庞大的敌军；用“这么多人”保留说话者面对人数悬殊时的语气。
- source_word: ἐκλελύμεθα
  choice: 已经精疲力尽了
  rationale: 完成时被动形式表达已经陷入虚弱、疲惫的现状；此处与未进食直接相连。
- source_word: ἀσιτοῦντες
  choice: 没有吃东西
  rationale: 直接表达未进食，不把它限定为正式的宗教性禁食。
- source_word: σήμερον
  choice: 今天
  rationale: 现代汉语中最自然、准确的时间表达。
