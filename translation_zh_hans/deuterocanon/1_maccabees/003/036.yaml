  text: and to settle foreigners throughout all their territories[a], and to distribute their land by lot.
translation:
  language: zh_hans
  text: 并把外族人安置在他们全境各处[a]，又抽签分配他们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“外来的儿子们”，也可译作“异族之子”；这里指外族人。
    reason: 保留原文阳性名词短语的字面形式及较自然的语境含义。
lexical_decisions:
- source_word: κατοικίσαι
  choice: 安置……居住
  rationale: 该不定式带有使役意味，指使人定居于当地；译为“安置”在现代汉语中自然，并保留有计划地迁入人口的含义。
- source_word: υἱοὺς ἀλλοτρίους
  choice: 外族人
  rationale: 希腊语字面为“外来的儿子们”，可能带有闪语式表达色彩；在此语境中实际指被迁入当地的异族居民。正文采用自然的“外族人”，脚注保留原文形式。
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: 在他们全境各处
  rationale: ὅρια在此不只是边界线，也指疆域或地区；“全境各处”同时表达范围的完整性和遍布之意。
- source_word: κατακληρονομῆσαι
  choice: 抽签分配
  rationale: 该动词表示按阄拈定份额、分给产业；“抽签分配”清楚保留了按阄分地的含义，而不弱化为一般性的“瓜分”。
- source_word: τὴν γῆν αὐτῶν
  choice: 他们的土地
  rationale: γῆ在此指原属当地居民的土地；“他们的土地”直接、自然。
theological_decisions:
- issue: υἱοὺς ἀλλοτρίους中阳性名词υἱούς的表达
  choice: 正文译作“外族人”，脚注注明字面形式
  alternative: 外来的儿子们；异族之子
  rationale: 这里不是有关性别或教义的关键表述，而是指迁入的外来人口。若正文直译“外来的儿子们”，现代汉语容易误解为特指某些人的子嗣；采用“外族人”忠实传达语境所指，同时用脚注保存希腊文独特措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“全境各处”避免把ὅρια误解为仅沿边界地区；“抽签分配”明确表达按阄分地。
