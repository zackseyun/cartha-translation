  text: And he came near as far as the ascent of Beth-horon[a], and Judas went out to meet him with only a few men.
translation:
  language: zh_hans
  text: 他来到伯和仑的上坡路[a]；犹大带着为数不多的人出去与他相遇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“Μεθωρών”，所指是通常称为“伯和仑”的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: 走近
  rationale: 不定过去时表示向目标接近；“走近”自然地保留移动和临近之意。
- source_word: ἕως ἀναβάσεως
  choice: 直到……的上坡
  rationale: ἕως加属格表示所达到的范围，ἀνάβασις在此指向上的道路或坡道；“直到……的上坡”保留地形和界限意味。
- source_word: Μεθωρών
  choice: 伯和仑
  rationale: 希腊文本作Μεθωρών，但所指是通常称为伯和仑的地点；采用现代中文圣经地名的通行形式，并以脚注说明文本形态。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 直译为“出去”；不另加“率军”等原文未明说的军事细节。
- source_word: εἰς συνάντησιν αὐτῷ
  choice: 迎战他
  rationale: 该短语本义是出去与他相遇；在明确的军事语境中，“迎战”比单纯“迎接”自然，同时表达敌对相遇。
- source_word: ὀλίγος
  choice: 只带着少数人
  rationale: 单数形容词以表语方式说明犹大一方人数很少；中文补出“人”，并用“只”体现数量有限。
