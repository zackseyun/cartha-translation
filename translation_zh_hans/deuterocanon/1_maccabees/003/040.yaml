  text: 他们带着全部军队出发，来到平原地区，在阿毛斯附近安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆραν
  choice: 出发
  rationale: 该动词在行军语境中表示拔营启程；译作“出发”自然简明。
- source_word: σὺν πάσῃ τῇ δυνάμει αὐτῶν
  choice: 带着全部军队
  rationale: δύναμις 此处指军事力量，即军队；“全部军队”符合现代汉语军事叙事。
- source_word: παρεβάλον
  choice: 安营
  rationale: παρεμβάλλω 在此为军队扎营之意；“安营”准确而庄重。
- source_word: Ἀμμαοῦν
  choice: 阿毛斯
  rationale: 依照所据希腊文本的地名形式 Ammaous 音译，不改从较常见的 Emmaus 形式。
- source_word: ἐν τῇ γῇ τῇ πεδινῇ
  choice: 在平原地区
  rationale: 直指低平的平原地带；“平原地区”既保留地理含义，也符合现代中文表达。
