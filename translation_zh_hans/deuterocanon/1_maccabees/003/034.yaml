lexical_decisions:
- source_word: παρέδωκεν
  choice: 交给
  rationale: 表示把兵力和象转交给另一人掌管；“交给”自然地保留了移交控制权的含义，又不额外加入敌意色彩。
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: 一半兵力
  rationale: 军事语境中的 δυνάμεις 泛指武装力量；“兵力”比“军队”更能表达整体军事力量，也符合现代汉语习惯。
- source_word: τοὺς ἐλέφαντας
  choice: 象
  rationale: 原文只说“象”；军事用途由上下文表明，因此不增译为“战象”。
- source_word: ἐνετείλατο αὐτῷ
  choice: 向他下了命令
  rationale: 该动词表示发出命令或训令；“下了命令”符合军事语境，并保留命令的力度。
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: 就他想要的一切
  rationale: 紧贴原文压缩而略含开放性的表达，不擅自补出他想要做成、处置或取得的具体事项。
- source_word: τῶν κατοικούντων
  choice: 所有住……的人
  rationale: 保留分词的动作意味，同时采用普通现代汉语中自然清楚的表达。
- source_word: τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: 住在犹太和耶路撒冷
  rationale: κατοικέω 后的宾语在此表达居住地点，汉语用“在”明确其地点关系。
