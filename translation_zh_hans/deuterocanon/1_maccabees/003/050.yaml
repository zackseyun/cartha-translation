  yaml_path: translation/deuterocanon/1_maccabees/003/050.yaml
  text: And they cried out with a loud voice to heaven[a], saying, “What shall we do with these, and where shall we take them?”
translation:
  language: zh_hans
  text: 他们向天大声呼喊说：“我们该拿这些人怎么办？又该把他们带到哪里去[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又该把他们带离这里，带往何处？”这个希腊语动词可更具体地表示把人从当前所在之处带走或领走。
    reason: 词义上的可选译法
lexical_decisions:
- source_word: ἐβόησαν φωνῇ
  choice: 大声呼喊
  rationale: ἐβόησαν表示强烈、急迫的呼求；φωνῇ在这一搭配中加强发声的意味。译作“大声呼喊”既自然，也保留祷告般的迫切感。
- source_word: εἰς τὸν οὐρανόν
  choice: 向天
  rationale: 该短语表明呼喊的方向。译文保留“天”这一明说的对象，不把语境中隐含的上帝直接写入正文。
- source_word: Τί ποιήσωμεν
  choice: 我们该……怎么办
  rationale: 准确表达商议语气的虚拟式，保留说话者在危急处境中的迟疑与迫切。
- source_word: τούτοις
  choice: 这些人
  rationale: 指示代词本身较简略，但其阳性复数形式及后文αὐτούς表明所指为人；现代汉语补出“人”可避免误解，同时不进一步界定他们的身份。
- source_word: ἀπαγάγωμεν
  choice: 把他们带到哪里去
  rationale: ἀπάγω可指带领某人离开现处。正文采用自然的现代汉语表达，脚注补明其较具体的“领走、带离”意味。
theological_decisions:
- issue: 向天呼喊时隐含的受呼求者
  choice: 保留“向天”，不明说“上帝”
  alternative: 向天上的上帝呼喊；向主呼喊
  rationale: 希腊文直接写的是“天”，而非上帝或主。上下文虽显然带有祷告意味，译文仍保留原文含蓄的指向，不把隐含对象明确化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大声呼喊”体现紧迫感；两个“该”维持原文连续商议问句的语气。标点按现代中文直接引语规范处理。
