base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: zh_hans
  text: 不法之徒因惧怕他而退缩，所有行不法之事的人都陷入慌乱；拯救[a]在他手中[b]得以顺利实现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救”。希腊语σωτηρία既可指“拯救、救恩”，也可指具体的“解救”；这里的上下文侧重民族和军事上的获救。
    reason: lexical_alternative
  - marker: b
    text: “在他手中”是圣经常用的表达，意思是拯救借着他的行动或能力得以成就。
    reason: cultural_note
lexical_decisions:
- source_word: συνεστάλησαν
  choice: 退缩
  rationale: 该被动形式在此表示受到压力或震慑而收缩、退却。“退缩”既符合因惧怕而产生的反应，也保留叙事中的对抗意味。
- source_word: οἱ ἄνομοι
  choice: 不法之徒
  rationale: 保留ἄνομος所强调的“不法”特征，并与下文ἀνομία形成词根呼应。
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: 因惧怕他
  rationale: ἀπό在这里表达原因；此译简洁自然，明确指出他们的退缩源于对他的惧怕。
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: 所有行不法之事的人
  rationale: 表达“从事、施行不法之事”的具体含义，同时在现代汉语中比直译“作不法的工人”自然，并保留与“不法之徒”的词汇呼应。
- source_word: συνεταράχθησαν
  choice: 都陷入慌乱
  rationale: 该动词表示被搅扰、震动或弄得混乱；“陷入慌乱”符合被动结果及敌方阵营失序的语境。
- source_word: εὐωδώθη
  choice: 顺利成就
  rationale: 该被动动词表示进展顺利、获得成功；“顺利成就”能自然描述拯救藉其行动得以成功实现。
- source_word: σωτηρία
  choice: 拯救
  rationale: 此处主要指民族和军事处境中的解救，但原词也具有较宽的“救恩、拯救”语义。“拯救”在现代汉语中兼顾具体解救和原词的较广幅度。
- source_word: ἐν χειρὶ αὐτοῦ
  choice: 在他手中
  rationale: 保留圣经常见的“在某人手中”表达，表示事情借着他的能力和行动得以成就。
theological_decisions:
- issue: 军事历史语境中σωτηρία的译法
  choice: 拯救
  alternative: 救恩；解救；胜利
  rationale: 上下文描写犹大使敌人退缩、慌乱，并使以色列获得解救。“拯救”既切合当下的民族军事处境，也不把原词缩窄为单纯的战场胜利，或限定为后期神学意义上的“救恩”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不法之徒”与“行不法之事的人”保留原文ἀνομ-词组的反复；分号呈现前两项敌方反应与末项拯救成就之间的推进关系。
