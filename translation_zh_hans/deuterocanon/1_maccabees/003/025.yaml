  text: And the fear of Judas and of his brothers began, and downfall was falling upon the nations around them.
translation:
  language: zh_hans
  text: 人们开始惧怕犹大和他的弟兄[a]，周围各族不断遭遇败亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“对犹大和他的弟兄的惧怕开始了”；意思是人们对他们的畏惧开始传开。
    reason: lexical_alternative
  - marker: b
    text: 或译：“毁灭持续落在周围各族身上。”希腊文动词的未完成时态表示持续或反复发生。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: 开始蔓延
  rationale: 该词标明一种状态的开始；结合“惧怕”及上下文，用“开始蔓延”自然表达众人逐渐惧怕他们，但不改变其起始意义。
- source_word: ὁ φόβος
  choice: 惧怕
  rationale: φόβος可指害怕、畏惧或恐惧；“惧怕”在此庄重自然，又不像“恐怖”那样过度强化。
- source_word: Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: 对犹大和他弟兄的
  rationale: 属格与φόβος的具体关系略有含混；译为“对……的惧怕”按语境理解为别人惧怕犹大及其弟兄，同时以脚注保留较贴近形式的另一种理解。
- source_word: ἡ πτῶσις
  choice: 败亡
  rationale: πτῶσις可指跌落、倾覆或毁灭；军事语境中的“败亡”兼顾失败与覆灭，比单纯的“倒下”更合适。
- source_word: ἐπίπτεν
  choice: 不断临到
  rationale: 未完成过去时表示持续或反复发生；“不断临到”既保留进行意味，也符合πτῶσις与ἐπί的搭配。
- source_word: ἐπὶ τὰ ἔθνη
  choice: 临到……各族
  rationale: ἔθνη在本书语境中指周边非犹太族群；“各族”比“列国”更适合这些相邻群体，也避免直接加入“外邦人”的宗教色彩。
- source_word: τὰ κύκλῳ αὐτῶν
  choice: 他们周围的
  rationale: 忠实表达这些族群在犹大和他弟兄四周的地理关系。
theological_decisions:
- issue: “犹大和他弟兄的惧怕”中属格关系
  choice: 正文译为“对犹大和他弟兄的惧怕”，指周围的人惧怕他们
  alternative: “犹大和他弟兄所引起的恐惧”或形式较含混的“犹大和他弟兄的惧怕”
  rationale: 上下文最自然地指犹大一方令周围各族畏惧；但希腊文属格本身没有明确标示施事或受事关系，因此脚注保留其形式上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“开始蔓延”使汉语自然，并由脚注交代较直译的表达；“败亡不断临到”保留原文带有拟人色彩的持续动作。所有脚注标记均已置于正文相应位置。
