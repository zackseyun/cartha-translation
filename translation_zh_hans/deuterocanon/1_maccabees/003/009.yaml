  yaml_path: translation/deuterocanon/1_maccabees/003/009.yaml
  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
translation:
  language: zh_hans
  text: 他的名声传到地极[a]；他又把那些濒临灭亡的人聚集起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他被称名直到地极”；这里也可译作“他的名传到地极”或“他名扬地极”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那些正在灭亡的人”“遭毁坏的人”或“失丧的人”。原文可指已经陷入败亡、正遭毁灭或处于危亡中的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: 他的名声传到
  rationale: 该词是ὀνομάζω的不定过去时被动式，字面为“被称名／被提名”。结合“直到地极”，这里自然表示他的名字或声望远播；译为“他的名声传到”既符合现代汉语，也不过度强化为“威名”。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 到地极
  rationale: 保留原文单数表达及其“直到大地最远之处”的广远意象；“地极”简洁、庄重且为现代读者所能理解。
- source_word: συνήγαγεν
  choice: 聚集起来
  rationale: 准确表达συνάγω“不定过去时”的召集、聚拢之意；“起来”使汉语表达自然，并呈现行动的完成性。
- source_word: ἀπολλυμένους
  choice: 那些濒临灭亡的人
  rationale: 该现在时中／被动分词可指正在灭亡、遭毁坏或处于危亡中的人。“濒临灭亡”保留持续受威胁的状态，避免把它固定解释为神学意义上的“失丧者”。
theological_decisions:
- issue: ἀπολλυμένους是否译作具有特定神学含义的“失丧的人”
  choice: 那些濒临灭亡的人
  alternative: 失丧的人／正在被毁灭的人
  rationale: 本节语境可以指处于毁灭、危难或败亡状态的人；采用非术语化译法，保留军事与社会危难层面的含混性，不预设特定救恩论含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。主句以“他的名声传到地极”传达希腊语被动式所构成的声名远播惯用义；分号清楚呈现两个并列动作。脚注保留较贴近字面的译法以及ἀπολλυμένους的语义张力。
