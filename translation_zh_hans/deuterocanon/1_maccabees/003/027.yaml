  yaml_path: translation/deuterocanon/1_maccabees/003/027.yaml
  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: zh_hans
  text: 安提阿古王听见这些话，就勃然大怒；他派人召集他王国所有的军队，组成一支极其强大的军旅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军旅”或译“军营”或“驻营的军队”。希腊词παρεμβολή既可指军营本身，也可指驻扎成营的军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……就……
  rationale: 以自然的汉语承接叙事，并表达从句的时间关系。
- source_word: ἤκουσεν
  choice: 听见
  rationale: 保留动词的基本听闻义，与“这些话”搭配自然。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 贴近希腊文表层表达；上下文中也可理解为所听到的消息。
- source_word: ὠργίσθη θυμῷ
  choice: 勃然大怒
  rationale: 原文以ὀργίζομαι和θυμός叠加强调愤怒；此成语自然、庄重，并保留强烈程度。
- source_word: ἀπέστειλεν καὶ συνήγαγεν
  choice: 随即传令召集
  rationale: ἀπέστειλεν未明说所差遣的对象，语境很可能指发出命令或派人召集；如此翻译避免生硬的“派出并召集”，同时不增添具体的使者。
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: 他王国所有的军队
  rationale: 军事语境中的δυνάμεις指兵力或军队，而非抽象的能力或权势。
- source_word: παρεμβολὴν
  choice: 军旅
  rationale: 此词既可指营地，也可指驻营的军队；“军旅”在本句中可指集结成军的部队，并避免把意义单方面限定为空间性的营地。
- source_word: ἰσχυρὰν σφόδρα
  choice: 极其强大的
  rationale: 兼顾ἰσχυρά的强大与σφόδρα的高度强化语气。
