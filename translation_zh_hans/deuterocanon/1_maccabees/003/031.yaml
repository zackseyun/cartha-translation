base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: zh_hans
  text: 他心里极其困扰[a]，便决定前往波斯，征收各地的税款，并筹集大量银钱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他心里极其不知所措”，或“他内心极其苦恼”。希腊语动词既可表示困惑无措，也可表示陷入严重困境。
    reason: lexical_alternative
  - marker: b
    text: “银钱”指以银币或按重量计量的银所代表的钱财，不只是未经加工的银。
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο
  choice: 困扰
  rationale: 该动词可表示不知所措、陷入困境或苦恼；结合财政与政治压力，“困扰”自然表达其内在窘迫，同时不排除困惑之意。
- source_word: τῇ ψυχῇ αὐτοῦ
  choice: 心里
  rationale: ψυχή在此指人的内在生命或内心状态；“心里”是现代汉语中自然、庄重的表达，比直译“在他的灵魂里”更符合叙事语体，且不过度限定为理智或情绪。
- source_word: σφόδρα
  choice: 极其
  rationale: 准确保留该副词的强烈程度，并与“困扰”搭配自然。
- source_word: ἐβουλεύσατο
  choice: 决定
  rationale: 中间语态含有权衡谋划后采取行动之意；“决定”清楚自然，不额外强化为不可更改的决意。
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  choice: 前往波斯
  rationale: 简洁表达朝向波斯地区的移动，符合现代汉语地名用法。
- source_word: λαβεῖν τοὺς φόρους
  choice: 征收……税款
  rationale: φόροι可指贡赋或税款；此处是统治者从辖地获取财政收入，“征收税款”最为清楚，同时在脚注中保留“贡赋”的可能。
- source_word: τῶν χωρῶν
  choice: 各地
  rationale: χῶραι泛指辖下地域，并不必然是正式的行省单位；“各地”自然且避免过度具体化。
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: 筹集大量银钱
  rationale: ἀργύριον字面为银，也常指作为货币或财富的银；“银钱”既保留银的具体意象，也让现代读者明白其财政含义。
