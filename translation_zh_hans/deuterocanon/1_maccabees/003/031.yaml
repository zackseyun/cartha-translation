translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“心里极其困扰”保留原文对内在状态的强调；“征收各地的税款”呈现行政财政语境；“银钱”兼顾ἀργύριον的字面意象与货币含义。所有脚注标记均已置于正文对应位置。
