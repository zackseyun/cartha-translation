base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/059.yaml
  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: zh_hans
  text: 因为我们宁可战死，也不愿眼看我们的民族和圣物遭受灾祸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣所”或“圣地”；希腊文为复数，直译为“神圣之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: 宁可……也不愿……
  rationale: 希腊文以比较结构表达两种选择中何者更可取；汉语用“宁可……也不愿……”能自然、鲜明地保留这种取舍。
- source_word: ἀποθανεῖν
  choice: 战死
  rationale: ἀποθανεῖν意为“死”，与ἐν πολέμῳ合译为“战死”，简洁而符合当前军事语境。
- source_word: ἐν πολέμῳ
  choice: 战死
  rationale: 字面为“在战争／战斗中”；在此与“死”连用，译作“战死”准确自然，不将范围扩大到整场战争。
- source_word: ἐφιδεῖν ἐπὶ
  choice: 眼看
  rationale: 该表达不只是一般的“看见”，还带有亲眼目睹、在旁看着事情发生的意味；“眼看”保留这种痛苦而无可旁观的语气。
- source_word: τὰ κακά
  choice: 遭受灾祸
  rationale: κακά可指邪恶、苦难或灾害。此处用“遭受灾祸”适合民族与圣物两个受事，同时不把含义限于道德恶行。
- source_word: τοῦ ἔθνους ἡμῶν
  choice: 我们的民族
  rationale: ἔθνος指犹太民族共同体；“民族”保留其群体和民族性含义，比泛称“人民”更贴近原文。
- source_word: τῶν ἁγίων
  choice: 圣物
  rationale: 希腊文是中性复数，字面指“神圣之物”，可能涵盖圣所、圣地及其中分别为圣之物。“圣物”在正文中简洁，并以脚注保留较宽的可能范围。
theological_decisions:
- issue: τῶν ἁγίων所指为何
  choice: 圣物
  alternative: 圣所；圣地；一切神圣之物
  rationale: 中性复数不支持译成“圣徒”。正文采用“圣物”保留其复数、神圣事物的基本意义；脚注说明它也可能概指圣所或圣地，避免把所指过早限定为单一对象。
translation_notes:
  register: 采用现代、庄重而有号召力的普通话。“宁可……也不愿……”体现战前劝勉中的强烈取舍；“眼看”保留原文旁观苦难发生的意味。脚注标记置于完整句末，正文与脚注对应。
