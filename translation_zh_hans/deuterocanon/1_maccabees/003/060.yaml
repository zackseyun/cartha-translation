  text: As his will is in heaven[a], so he will do.
translation:
  language: zh_hans
  text: 天上的旨意无论是什么，他必如此行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的旨意无论是什么，他就照着这样行。”
    reason: 表达ὡς δʼ ἂν ᾖ所含的不定意味，并展示较展开的对应译法。
lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: 无论如何
  rationale: ὡς与ἄν、虚拟式ᾖ构成带不定意味的比较从句；译为“无论如何”可自然表达“无论其情形怎样”的语气，并与后面的“照样”呼应。
- source_word: θέλημα
  choice: 旨意
  rationale: θέλημα指意愿、意志或意图；“旨意”在涉及上帝时庄重自然，同时不把它缩窄为愿望或预定计划。
- source_word: ἐν οὐρανῷ
  choice: 天上
  rationale: 按希腊文单数直译为“天上”，符合现代汉语惯用表达。
- source_word: οὕτως
  choice: 照样
  rationale: οὕτως与前面的比较从句相应；“照样”清楚保留“怎样……就怎样……”的关联。
- source_word: ποιήσει
  choice: 他就必……行
  rationale: ποιήσει是主动语态、第三人称单数、将来时；译文保留隐含的男性单数主体和简洁的行动用语，不补出原文没有明说的宾语。
theological_decisions:
- issue: ποιήσει的隐含主语
  choice: 他就必照样行
  alternative: 事情就必这样成就
  rationale: 希腊文为主动语态，且语境中的隐含主语是男性单数；采用“他”保留其个人行动者身份，不改译成无人称或被动表达。
- issue: 天上的旨意与施行者的关系
  choice: 保留“天上的旨意”这一较含蓄的表述
  alternative: 译成“他在天上的旨意”
  rationale: 本节希腊文本身没有在θέλημα前明说物主代词。正文不额外补足，以保存原文的简练与潜在歧义；脚注说明可展开理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旨意”适合经文语域；“无论如何……照样……”保留希腊文的比较—对应结构。正文未补入希腊文没有明说的物主代词，以免消除原文的含蓄性。
