base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: zh_hans
  text: 他使自己的百姓声名大振[a]；他像巨人一样[b]穿上胸甲，系好自己的作战兵器；他部署战事[c]，用刀剑护卫营地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己百姓的荣耀（或尊荣）增长。”希腊文动词本义是“拓宽”，在这里比喻增添荣耀或声望。
    reason: lexical_alternative
  - marker: b
    text: “像巨人一样”按希腊文字面翻译；在这里也可理解为“像大能的勇士一样”或“像勇士一样”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“组织战斗”或“发动战争。”希腊文表达可以侧重安排、组织军事行动，而不只是亲自参战。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: 使……大振
  rationale: 原词本义为“拓宽、扩展”，在这里比喻使百姓的荣耀、声望增长；“使……大振”在现代汉语中自然地传达这一结果。
- source_word: δόξαν
  choice: 声名
  rationale: 此处指百姓在公众中的荣耀、尊荣或名望。“声名”切合军事功业带来的民族声望，同时保留注释说明“荣耀、尊荣”的可能。
- source_word: τῷ λαῷ αὐτοῦ
  choice: 自己的百姓
  rationale: λαός是作为整体的人民或民族；“自己的百姓”直接、自然，也不额外限定族群含义。
- source_word: ἐνεδύσατο θώρακα
  choice: 穿上胸甲
  rationale: 准确保留θώραξ所指的护胸甲，而不笼统译成“铠甲”或“盔甲”。
- source_word: ὡς γίγας
  choice: 像巨人一样
  rationale: γίγας字面意为“巨人”，此处形成英雄式比喻；正文保留其鲜明意象，脚注说明语境中的勇士含义。
- source_word: συνεζώσατο
  choice: 系好
  rationale: 原词表示把装备束在身上、佩带妥当；“系好”符合古代武装动作，也比“束上”更自然。
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: 自己的作战兵器
  rationale: σκεύη可泛指器具、装备，加上πολεμικά后指军用器械；结合上下文译为“作战兵器”，既清楚又保持武备含义。
- source_word: πολέμους συνεστήσατο
  choice: 部署战事
  rationale: 该表达可指组织、安排或发动战争行动；“部署战事”保留筹划和组织军事行动的意味，不把它收窄为单纯参战。
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: 护卫营地
  rationale: σκεπάζων在此具有遮护、保护之意，παρεμβολή指军营或营地；“护卫营地”符合军事语境。
- source_word: ἐν ῥομφαίᾳ
  choice: 用刀剑
  rationale: ἐν表达工具方式，ῥομφαία指大型刀剑类武器；“用刀剑”在现代汉语中自然，并保留武器意象。
