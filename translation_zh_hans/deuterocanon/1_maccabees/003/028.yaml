  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: zh_hans
  text: 他打开自己的宝库，发给军队一年的军饷，又命令他们在这一年中随时准备应付一切需要。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: 宝库
  rationale: 指储藏财物的库房；这里是统治者用来支付军饷的国库或金库，用“宝库”既贴近原词，也符合叙事语境。
- source_word: ὀψώνια
  choice: 军饷
  rationale: 该词可指口粮、给养或报酬，在军队语境中指士兵所得的薪饷；“军饷”比泛称“工资”更准确自然。
- source_word: δυνάμεσιν
  choice: 军队
  rationale: 复数在此不是抽象的“力量”，而是指武装部队。
- source_word: εἰς πᾶσαν χρείαν
  choice: 应付一切需要
  rationale: 保留χρεία的宽泛含义，不将其限缩为某一种战事或任务；汉语中“应付一切需要”表达随时可供调遣、处理各种需要。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“在这一年中随时准备”自然表达εἰς ἐνιαυτὸν εἶναι ἑτοίμους，同时保留原文两次提及一年的时间范围。
