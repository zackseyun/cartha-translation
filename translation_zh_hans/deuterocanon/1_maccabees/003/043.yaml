  terminology: 将“我们的人民”调整为“我们的民族”，更自然地表达此处作为群体的λαός，且不必将其政治化为现代国家。“圣所”可作为集合性用语保留在正文；脚注须说明也可能包括圣物／神圣之物，避免把复数τὰ ἅγια限定为单一建筑。
