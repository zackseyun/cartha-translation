  yaml_path: translation/deuterocanon/1_maccabees/003/043.yaml
  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: zh_hans
  text: 人人彼此说：“让我们使我们的民族和圣所从所遭的毁灭中重新兴起[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语将“使兴起”与“毁坏、倾覆”并置，字面搭配较不寻常，意思是使遭毁坏的得以复兴或恢复。“圣所”也可指圣物或广义的神圣之物。
    reason: 说明Ἀναστήσωμεν τὴν καθαίρεσιν的特殊搭配，并保留τῶν ἁγίων可指圣所、圣物或其他神圣事物的歧义。
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: 人人都对身边的人说
  rationale: 既保留ἕκαστος逐一、人人的分配意味，也自然表达众人相互传话的场景；“身边的人”比现代汉语中的“邻舍”更贴近πλησίον在此处的关系性含义。
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: 让我们使……从毁灭中重新兴起
  rationale: ἀναστήσωμεν有“使之起来、重新兴起”的意象，καθαίρεσιν表示拆毁、倾覆或毁灭。译文将希腊语中刻意并置的“兴起—毁灭”转化为自然汉语，同时保留从败坏状态中复兴的张力。
- source_word: τοῦ λαοῦ ἡμῶν
  choice: 我们的人民
  rationale: λαός在此指以色列这一群体；“我们的人民”直接、庄重，也不把其含义限缩为现代政治意义上的国家。
- source_word: τῶν ἁγίων
  choice: 圣所
  rationale: 中性复数τὰ ἅγια在本书圣殿遭亵渎的语境中可指神圣区域、圣所及其中的圣物。“圣所”作为集合性表达，能自然传达主要的礼仪与圣殿背景，但不排除较广的所指。
theological_decisions:
- issue: τῶν ἁγίων的所指
  choice: 圣所
  alternative: 圣物；神圣之物；各处圣地
  rationale: 上下文关乎民族与敬拜秩序在圣殿遭亵渎后的复兴，因此“圣所”最符合历史语境；脚注同时保留希腊语中性复数也可指圣物或广义神圣事物的可能。
- issue: Ἀναστήσωμεν τὴν καθαίρεσιν的反常搭配
  choice: 使……从毁灭中重新兴起
  alternative: 恢复……的废墟；挽回……的败亡
  rationale: 原文将“使兴起”与“毁灭/拆毁”结合，表达扭转毁坏、使之复兴。正文保留此意象而避免把人民本身称作“废墟”，也不将行动仅仅理解为建筑工程。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“人人都对身边的人说”保留原文逐人的表达；引语以“重新兴起”呈现复兴意象，避免生硬直译。脚注标记置于相关整句末尾。
