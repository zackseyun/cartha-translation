base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/052.yaml
  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
translation:
  language: zh_hans
  text: 看哪，列国聚集起来攻击我们，要除灭我们；你知道他们图谋要怎样加害我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们图谋要怎样加害我们”也可译作“他们所谋划要加害我们的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留希腊文指示、唤起注意的语气，也符合祷告中的急迫感。
- source_word: τὰ ἔθνη
  choice: 各国
  rationale: 此处主要指敌对以色列的周边非犹太国家；“各国”保留政治与族群含义，避免采用带有较强宗教术语色彩的“外邦人”。
- source_word: συνῆκται ἐφʼ ἡμᾶς
  choice: 已经聚集起来攻击我们
  rationale: “已经聚集起来”体现完成时所表达的现存结果；在军事语境中，“攻击我们”自然传达介词短语的敌对方向。
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: 要把我们除灭
  rationale: 目的不定式译为“要……”，而“除灭”兼顾移除与彻底消灭的语义力度，且保持庄重。
- source_word: σὺ οἶδας
  choice: 你知道
  rationale: 以简洁直接的第二人称保留向上帝祷告的语气。
- source_word: ἃ λογίζονται ἐφʼ ἡμᾶς
  choice: 他们图谋怎样对付我们
  rationale: λογίζονται 在此表示敌对的盘算、谋划；译文保留其蓄意图谋的含义。
theological_decisions:
- issue: “各国”在犹太战争祷告语境中的所指
  choice: 各国
  alternative: 外邦人；列国
  rationale: ἔθνη 既可泛指国家、民族，也可指与以色列相对的外邦人。此处军事政治含义较突出，因此不把它固定为后来的宗教技术用语。
- issue: 敌方意图的强度
  choice: 除灭
  alternative: 除去；消灭；把我们彻底铲除
  rationale: ἐξᾶραι 可表达移除，语境中也含消灭群体的威胁。“除灭”保留强烈程度，却不额外加入希腊文没有明说的修饰语。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“看哪”保留原文的急迫指示语气；句式紧凑，并用分号对应原文两个彼此紧密相连的分句。
