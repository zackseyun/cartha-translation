  yaml_path: translation/deuterocanon/1_maccabees/003/007.yaml
  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: zh_hans
  text: 他使许多君王苦恼，又以自己的作为使雅各欢喜；人们将永远怀着祝福记念他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的记念永远归于祝福。”原文使用名词性的祝福公式，意指人们将永远以祝福、称颂来记念他。
    reason: 说明τὸ μνημόσυνον αὐτοῦ εἰς εὐλογίαν的字面结构和在现代汉语中的自然表达，同时保留“记念”的核心语义。
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: 使……苦恼
  rationale: 原词本义与“使变苦”有关，此处描述犹大的行动给敌对君王带来的痛苦和困扰。“使……苦恼”在现代汉语中自然，也保留了原词的强烈意味。
- source_word: βασιλεῖς πολλούς
  choice: 许多君王
  rationale: βασιλεῖς明确指君王；译作“君王”比宽泛的“统治者”更准确。
- source_word: ηὔφρανεν
  choice: 使……欢喜
  rationale: 保留该动词使役性的喜乐含义，表达清楚而庄重。
- source_word: τὸν Ἰακώβ
  choice: 雅各
  rationale: 依照希腊文本保留“雅各”这一对以色列民的集体称呼，不以解释性的“以色列”取代。
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: 以自己的作为
  rationale: 此处ἐν可表达凭借或手段；“以自己的作为”既符合汉语习惯，也忠实表达雅各因他的行动而欢喜。
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: 他的名
  rationale: μνημόσυνον表示对某人的记念或留存的名声；在汉语祝福语境中，“他的名永远蒙福”比直译“他的记念”自然，同时传达其身后名声被称颂的含义。
- source_word: εἰς εὐλογίαν
  choice: 蒙福
  rationale: 希腊文直译为“成为祝福／归于祝福”，属于祝福公式；正文采用自然的汉语“蒙福”，脚注保留较字面的结构。
- source_word: ἕως τοῦ αἰῶνος
  choice: 永远
  rationale: 这是表达恒久延续的惯用语，“永远”简洁准确。
theological_decisions:
- issue: “雅各”的集体含义
  choice: 保留“雅各”，作为对上帝子民的盟约性集体称呼。
  alternative: 译作“以色列”。
  rationale: 原文明确使用祖先之名“雅各”。保留原称呼可维持经文语域，也避免把隐含的集体意义直接解释进正文。
- issue: 末句的祝福公式
  choice: 正文译作“他的名永远蒙福”，脚注注明更贴近原文的表达。
  alternative: 他的记念永远成为祝福。
  rationale: 原文采用名词性祝福公式，并无明确的被动动词。汉语正文作适度调整以求自然，脚注则保存原句的结构及其可能理解，避免把公式的含义限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“君王”“作为”“雅各”等词保留经文语域；末句以自然汉语表达，并用脚注呈现希腊文祝福公式的字面结构。
