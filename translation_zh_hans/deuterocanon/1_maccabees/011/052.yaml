  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: zh_hans
  text: 德米特里王坐在他王国的宝座上，国土在他面前安静下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: 坐上了
  rationale: 此处指登上王位；“坐上了”既保留坐于宝座的形象，也自然表达即位之意，而不额外强化为征服或正式加冕。
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: 他国度的宝座
  rationale: 保留原文属格结构及“国度”的明确用词；虽不如“王位”简练，却更贴近原文的具体意象。
- source_word: ἡσύχασεν
  choice: 安静下来
  rationale: 该动词表示由动荡转为平静、止息；“安静下来”保留状态变化和政治局势趋稳之意，又不夸大为全面和平。
- source_word: ἡ γῆ
  choice: 国土
  rationale: 历史语境中指王所辖的土地或疆域，并非全地；“国土”在现代汉语中比“地”更清楚。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 按原文直译，保留其可能兼含“在其临在中”及“在其统治之下”的关系意味，不直接解释为“归顺他”或“在他治下”。
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: 德米特里王
  rationale: 采用现代汉语中自然而庄重的称谓次序，准确保留姓名与王号。
