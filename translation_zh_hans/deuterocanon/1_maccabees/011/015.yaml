  yaml_path: translation/deuterocanon/1_maccabees/011/015.yaml
  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: zh_hans
  text: 亚历山大听说了，就前来与他交战；托勒密率军出战，以强大的兵力迎击他[a]，把他击溃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“以强有力的手”，这是表示凭强大力量行动的军事用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说了
  rationale: 原文没有明说所听见的内容；“听说了”自然承接上文，同时不擅自补出具体宾语。
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: 前来与他交战
  rationale: 兼顾ἐπʼ αὐτόν所表达的敌对行动和ἐν πολέμῳ的战争、交战语境，符合现代汉语表达。
- source_word: ἐξήγαγεν
  choice: 率军出战
  rationale: 该动词本义为“领出、带出”；在此军事语境中，主语所率领的军队虽未明说，却由上下文清楚暗示。“率军出战”比直译“领出来”更自然。
- source_word: ἀπήντησεν αὐτῷ
  choice: 迎击他
  rationale: ἀπαντάω可指前去迎上或相遇；战斗语境中的“迎击”既体现主动迎上，也保留敌对含义。
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: 以强大的兵力
  rationale: 字面为“以强有力的手”，在这里是表示军事力量的习语。“以强大的兵力”传达其语境意义，字面意象则在脚注中保留。
- source_word: ἐτροπώσατο αὐτόν
  choice: 把他击溃了
  rationale: 该词在战争语境中指使敌军败退、逃散；“击溃”比一般的“打败”更准确地表现这种军事结果。
