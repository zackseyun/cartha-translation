base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
translation:
  language: zh_hans
  text: 埃及的王聚集了许多兵力，多如海边的沙，以及许多船只；他企图用诡计控制[a]亚历山大的王国，把它并入自己的王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “控制”也可译作“夺取”或“制伏”。希腊语动词可表示压倒对方或取得支配权。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν
  choice: 聚集了
  rationale: 准确表达不定过去时 ἀθροίζω 的聚集、集合之意；在军事语境中自然，也不额外限定为正式征召。
- source_word: δυνάμεις πολλὰς
  choice: 许多军队
  rationale: δυνάμεις 在军事叙事中指兵力、部队；“许多军队”通俗自然，并保留复数表达。
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: 多如海边的沙
  rationale: 保留圣经中表示数量极多的传统比喻，同时符合现代汉语表达。
- source_word: πλοῖα πολλά
  choice: 许多船只
  rationale: 直接、自然地表达 πλοῖα πολλά，不擅自限定船只类型。
- source_word: ἐζήτησεν
  choice: 企图
  rationale: 此处 ζητέω 表示谋求、试图实现后续目的；“企图”适合带有欺骗手段的政治行动语境。
- source_word: κατακρατῆσαι
  choice: 控制
  rationale: 该动词可表示压倒、制伏或取得支配权；“控制”保留政治掌控的宽泛含义，避免仅理解为军事攻占。
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: 亚历山大的国
  rationale: 此处 βασιλεία 指亚历山大统治的国度或疆域，而非抽象王权；“亚历山大的国”简洁清楚。
- source_word: δόλῳ
  choice: 用诡计
  rationale: δόλος 指欺骗、诡诈或计谋；“用诡计”既传达手段的不诚实，也符合叙事语体。
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: 把它并入自己的国
  rationale: 原文直义为把它加到自己的国中；“并入”自然表达这里的政治兼并含义，而不使用现代行政色彩更强的术语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“国”避免连续使用较显书面且冗长的“王国”；第二句另起，使长串并列结构在中文中更清晰。脚注标记置于“军队”后，但脚注内容解释的是后文“控制”；为避免标记指向不清，出版时宜将标记移至“控制”之后。
