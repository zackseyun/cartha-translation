  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
translation:
  language: zh_hans
  text: 约拿单派了三千名身强力壮的男子到安提阿；他们来到王那里，王因他们的到来[a]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们临近时”或“因他们临近”。这里的希腊词可指临近、来到或进逼；按上下文，很可能是指约拿单所派的人来到王那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派了
  rationale: 在叙事语境中自然表达差遣人员前往某地；比“差遣了”更符合现代汉语行文。
- source_word: ἄνδρας τρισχιλίους
  choice: 三千名……男子
  rationale: ἄνδρας直指男子；上下文虽属军事场景，原文并未明确使用“士兵”，故不将其具体化。
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: 勇力过人的
  rationale: 保留原文对能力和力量的强调，同时避免机械直译造成的重复生硬；“勇力”也适合军事叙事的庄重语域。
- source_word: εἰς Ἀντιοχίαν
  choice: 到安提阿
  rationale: 自然表达εἰς所指向的目的地。
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: 他们来到王那里
  rationale: 直接保留向王而来的动作关系，不额外解释为觐见或报到。
- source_word: ηὐφράνθη
  choice: 欢喜
  rationale: 准确表达因事件而高兴，庄重而又是现代读者熟悉的用语。
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: 因他们的到来
  rationale: 结合前句已经说明他们来到王那里，此处最自然地指王因其到来而欢喜；脚注保留“临近”的词义可能。
