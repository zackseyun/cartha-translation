base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: zh_hans
  text: 从今以后，其余应归我们的项目——即应归我们的什一税和各项税款、盐湖[a]，以及应归我们的冠冕[b]——我们都要让给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盐田”或“制盐场”。希腊文直译为“盐的湖”，可能指产盐资源或由此所得的收入。
    reason: lexical_alternative
  - marker: b
    text: 直译为“冠冕”。在这里的财政语境中，也可能指按惯例献给君王的冠冕贡礼或礼仪性贡款。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα
  choice: 其他一切
  rationale: 这是概括尚未列明的其他王室权益或收入的宽泛表达；“其他一切”自然，也保留其开放范围。
- source_word: ἀνήκοντα ἡμῖν / τῶν ἀνηκόντων ἡμῖν / τοὺς ἀνήκοντας ἡμῖν
  choice: 应归我们的
  rationale: 在王室财政语境中，该分词不只表示一般所有关系，也表示依法应当缴给王室；“应归我们的”兼顾所属和应缴之意，并保留原文的重复。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 表明此项谕令自此时起生效，现代汉语清楚自然。
- source_word: δεκατῶν
  choice: 什一税
  rationale: 指按十分之一征收的税赋；“什一税”是通行且准确的汉语表达。
- source_word: τελῶν
  choice: 各项税款
  rationale: τέλη可泛指税、捐、关税或其他财政征收；“各项税款”不把含义不必要地限于关税。
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: 盐湖
  rationale: 直译为“盐的湖”；正文保留原文具体意象，不直接断定它指盐田、制盐设施还是相关收益，替代解释置于脚注。
- source_word: στεφάνους
  choice: 冠冕
  rationale: 原词字面义为“冠冕”；在希腊化王室财政语境中也可能指献给君王的冠冕礼或相关贡款。正文保留字面形式，脚注说明可能的制度含义。
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: 我们都将让给他们
  rationale: ἐπαρκέω本可表示供给、给予；在本节王室让渡权益和收入的语境中，“让给”清楚表达将这些项目拨归对方，同时避免把动作过度限定为单纯免税或现物供应。
