  yaml_path: translation/deuterocanon/1_maccabees/011/005.yaml
  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
translation:
  language: zh_hans
  text: 他们向王陈述了约拿单所做的事，想要控告他[a]；王却默不作声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“想要责难他”或“想要使他受非议”。希腊语动词既可表示责备、贬斥，也可表示控告。
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: 陈述
  rationale: 该词表示有条理地叙说、讲述；在向君王禀报的宫廷语境中，“陈述”自然得体，又不额外强调正式奏报。
- source_word: ἃ ἐποίησεν Ἰωνάθαν
  choice: 约拿单所做的事
  rationale: 忠实呈现关系从句所指的约拿单的行动，并符合现代汉语叙事表达。
- source_word: εἰς τὸ ψογίσαι αὐτόν
  choice: 想要控告他
  rationale: εἰς τό加不定式表达目的；ψογίζω可指责备、非难或使人受谴责。在向王陈述不利事项的政治语境中，“控告”贴切，但正文脚注保留较宽的词义范围。
- source_word: ἐσίγησεν
  choice: 默不作声
  rationale: 表达王没有回应这一叙事动作，比单纯的状态性“沉默”更自然，也不过度推断其动机。
- source_word: ὁ βασιλεύς
  choice: 王
  rationale: 历史叙事中对君王的简洁、标准称谓；承接前文所指同一位王。
