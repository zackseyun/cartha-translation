base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: zh_hans
  text: 他又送给约拿单金器和宴席用具[a][b]，并准许他用金器饮酒、身穿紫袍、佩戴金扣针[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金器”也可译作“金制物品”或“金餐具”。
    reason: lexical_alternative
  - marker: b
    text: “宴席用具”所译的希腊语也可指服侍所需的配置，或较不可能地指服侍人员。
    reason: lexical_alternative
  - marker: c
    text: “金扣针”也可译作“金别针”或“金饰扣”；其确切形制不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: 金器
  rationale: 该复数词泛指金制器物；下文说用这些器物饮酒，因此“金器”既贴近原文，也不把它过度限定为金杯。
- source_word: διακονίαν
  choice: 宴席用具
  rationale: 此词本义涉及服侍、服务或相关配置；与“金器”并列并处于宫廷赏赐语境中，较可能指宴席服务所用的器具。“宴席用具”自然明确，同时用脚注保留其他可能。
- source_word: ἐξουσίαν
  choice: 准许
  rationale: 这里指君王授予使用身份标志的许可或特权；汉语“准许”比直译“权柄”更符合这一具体语境。
- source_word: πίνειν ἐν χρυσώμασιν
  choice: 用金器饮酒
  rationale: 介词短语表达使用金制饮器；“用金器饮酒”符合现代汉语习惯，又不将器物缩窄为杯。
- source_word: εἶναι ἐν πορφύρᾳ
  choice: 身穿紫袍
  rationale: 该习语指穿着象征尊荣的紫色衣服；“紫袍”简洁、庄重，并传达宫廷服饰含义。
- source_word: πόρπην χρυσῆν
  choice: 金扣针
  rationale: πόρπη指固定衣服的扣针、别针或饰扣；“金扣针”兼顾其扣合功能和古代服饰配件的形态，而不现代化为皮带扣。
