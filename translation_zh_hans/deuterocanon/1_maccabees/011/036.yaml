  yaml_path: translation/deuterocanon/1_maccabees/011/036.yaml
  text: And none of these things shall be set aside from now on for all time.
translation:
  language: zh_hans
  text: 从今以后，直到永远，这些规定一项也不可废除。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσεται
  choice: 不可废除
  rationale: 这是ἀθετέω的将来时被动态，语境涉及前述规定的持续效力；“不可废除”自然、庄重，并保留取消其效力的含义。
- source_word: οὐδὲν τούτων
  choice: 这些规定一项也不
  rationale: τούτων回指前文所列的让步或条款；按语境译作“这些规定”，并以“一项也不”准确表达οὐδέν的全称否定。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 直接表达自当前时点起持续生效，符合现代汉语习惯。
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  choice: 直到永远
  rationale: 表达整个未来时间范围；“直到永远”自然而庄重，保留该短语所强调的永久效力。
