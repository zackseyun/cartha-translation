  yaml_path: translation/deuterocanon/1_maccabees/011/003.yaml
  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
translation:
  language: zh_hans
  text: 托勒密王进入各城，直到托勒买城；他在每座城都部署军队驻防。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“进入诸城托勒买城”。“托勒买城”是地名；原文表达较为压缩，这里理解为托勒密王经过诸城，直到托勒买城。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὡς δὲ
  choice: 每……就……
  rationale: 在叙事中引出与主句同时并反复发生的动作；结合两个未完成时，用“每……就……”自然表达逐城进行的情形。
- source_word: εἰσεπορεύετο εἰς τὰς πόλεις
  choice: 每进入一座城
  rationale: 未完成时配合复数“诸城”，表示他陆续进入各城；汉语用逐次性的单数表达更自然，也与后文“每座城”相应。
- source_word: Πτολεμαΐς
  choice: 托勒密
  rationale: 按上下文理解为后置的主语，即托勒密王；这一读法也与后续动作的执行者一致。希腊文形式及其位置存在歧义，故以脚注说明。
- source_word: ἀπετάσσε τὰς δυνάμεις
  choice: 派兵
  rationale: 军事语境中指调派、部署军队；“派兵”简洁自然，并由后面的“驻守”明确其用途。
- source_word: φρουρὰν ἐν ἑκάστῃ πόλει
  choice: 在城里派兵驻守
  rationale: φρουράν表示驻防或守备的职能；结合逐城结构，译作“驻守”避免“把军队部署为驻军”的生硬重复。
