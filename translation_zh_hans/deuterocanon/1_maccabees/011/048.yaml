lexical_decisions:
- source_word: ἐνεπύρισαν τὴν πόλιν
  choice: 放火烧城
  rationale: 既保留动词使城市起火的使动含义，也采用自然、简洁的现代汉语表达；不额外断定全城已被烧毁。
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: 夺取了许多战利品
  rationale: σκῦλα指战争中夺得的财物；“战利品”准确体现军事语境，“许多”对应πολλὰ。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 当天
  rationale: 这是该时间短语自然简明的现代汉语表达，与叙事语体相称。
- source_word: ἔσωσαν
  choice: 救出了
  rationale: σῴζω在此表示使王脱离眼前危险；“救出”比单说“救了”更自然，同时不引入神学性含义。
- source_word: τὸν βασιλέα
  choice: 王
  rationale: 上下文所指明确，现代汉语历史叙事中用“王”自然凝练，无须机械补出定冠词。
