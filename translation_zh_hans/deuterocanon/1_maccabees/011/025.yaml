  yaml_path: translation/deuterocanon/1_maccabees/011/025.yaml
  text: And some lawless men from the nation were making accusations against him[a].
translation:
  language: zh_hans
  text: 本族中有一些不守律法的人，不断控告他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不断提出针对他的申诉。”希腊语动词可指陈情、申诉或提出请求；但它与“反对他”连用时，在这里带有敌对意味，因此译作“控告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  choice: 正在向当权者控告
  rationale: 该动词可指向有权者陈情、申诉或提出请求；与 κατʼ αὐτοῦ（“反对他”）连用时带敌对意味，故译作“控告”。未完成时态以“正在”体现持续过程。“向当权者”是语境中动词所含陈情对象的明示，避免现代汉语误解为仅在私下指控。
- source_word: κατʼ αὐτοῦ
  choice: 控告他
  rationale: κατά 加属格在此表示针对、反对某人；其含义自然融入“控告他”。
- source_word: τινες
  choice: 有几个
  rationale: 表示人数未明的部分人；“有几个”符合现代汉语叙事习惯。
- source_word: ἄνομοι
  choice: 不守律法的人
  rationale: 此词称这些人为违背或漠视律法者。“不守律法的人”保留道德与法律层面的贬义，又避免用“歹徒”“不法分子”等可能过度强化刑事意味的词。
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: 本族中
  rationale: 这里的 ἔθνος 指其所属的民族群体，即犹太民族，并非“外邦人”。“本族中”自然表达这些人来自同一民族，而不必补出原文未明说的族名。
theological_decisions:
- issue: ἄνομοι 的道德—律法含义
  choice: 不守律法的人
  alternative: 邪恶的人；不法之徒
  rationale: 原词着重其无视、违背律法的性质，不宜泛化成单纯的“邪恶”，也不宜套用现代刑法色彩较强的称呼。
- issue: ἐνετύγχανον 的敌对行为
  choice: 正在向当权者控告
  alternative: 正在向当权者申诉反对他；正在控诉他
  rationale: 动词本身可指陈情或请求，但 κατʼ αὐτοῦ 明确赋予敌对方向。“控告”保留这一语境意义；脚注同时保留较宽的词义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“本族中”避免将 ἔθνος 误读为“外邦人”；“不守律法的人”保留《马加比一书》语境中的律法色彩。主文脚注标记与脚注对应。
