  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: zh_hans
  text: 王逃进院子[a]；城里的人占据了城中的通道[b]，开始交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“庭院”；这里也可能指王宫的院落。
    reason: lexical_alternative
  - marker: b
    text: “通道”也可理解为城中的出入路线或要道。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃进
  rationale: φύγω在此表示因危险而逃离；结合方向短语εἰς τὴν αὐλήν，译作“逃进”既简洁又保留仓皇退避的意味。
- source_word: αὐλήν
  choice: 院子
  rationale: αὐλή可指院子、庭院，也可指宫廷建筑的院落。正文采用现代汉语自然且不过度限定的“院子”，不擅自补出希腊文未明说的“王宫”。
- source_word: κατελάβοντο
  choice: 占据了
  rationale: 该中间语态形式在军事语境中表示取得并控制某处；“占据了”准确而自然，也比“夺取”更少暗示具体攻占过程。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 原文直译为“那些从城里来的人”。“城里的人”保留群体指称，不把原文未注明性别的人群限定为男子或士兵。
- source_word: τὰς διόδους τῆς πόλεως
  choice: 城中的通道
  rationale: δίοδος可指通路、过道或出入路线。“通道”保留其空间范围的开放性，不武断限定为城门、街道或进城道路。
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: 开始交战
  rationale: 该结构表示开始进行战斗或战争行动；“开始交战”符合军事语境，也比“发动战争”更贴近此处即时发生的冲突。
