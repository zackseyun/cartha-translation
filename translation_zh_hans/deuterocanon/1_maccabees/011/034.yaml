base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: zh_hans
  text: 因此，我们已经为他们确认了犹太的疆界和三个区[a]——亚斐利马、吕大和拉玛廷；这三个区是从撒马利亚划归犹太的。凡与这些区相连的一切[b]，也一并归给所有在耶路撒冷献祭的人，以代替王室税赋；从前君王每年都向他们征收这些税赋，取自土地的出产和树上的果实[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“区”译自希腊文νομός，指行政区；旧式研究著作有时将其音译为“诺姆”。
    reason: lexical_alternative
  - marker: b
    text: “凡与这些区相连的一切”所译的希腊文含义宽泛，可能包括附属村庄、土地或其他相关属地。
    reason: lexical_alternative
  - marker: c
    text: 或译“树木的出产”。这个希腊词可泛指树上所产的水果、坚果等。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: 已经……确认
  rationale: 该完成时在王室诏令语境中表示确立并使安排生效；“确认”既保留正式语气，也避免把它仅理解为划定实体界线。
- source_word: τὰ ὅρια
  choice: 疆界
  rationale: ὅρια指政治或地域边界；“疆界”符合正式行政语境，又为现代读者所熟悉。
- source_word: τοὺς τρεῖς νομοὺς
  choice: 三个区
  rationale: νομός在希腊化时期可指行政区；正文用“区”简明自然，并以脚注说明其行政含义。
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: 亚斐利马、吕大和拉玛廷
  rationale: 按希腊文地名音译，并采用简体中文中自然、可辨识的形式。
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: 从撒马利亚划归犹太
  rationale: 被动形式表示由撒马利亚转归犹太；“划归”清楚表达行政隶属转移，同时不额外推断具体政治程序。
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: 凡与这些区相连的一切
  rationale: 原表达范围宽泛，可涉及附属村庄、土地或其他从属物；此译法保留其概括性，不擅自缩窄。
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: 所有在耶路撒冷献祭的人
  rationale: θυσιάζω明确指献祭，不宜泛化为一般敬拜；译文保留受益者与献祭地点。
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: 以代替王室税赋
  rationale: τὰ βασιλικά在此指归王室的税赋或贡赋；“以代替”保留ἀντί的关系，而不进一步解释为免税或交换。
- source_word: ὧν ἐλάμβανεν ὁ βασιλεὺς παρʼ αὐτῶν τὸ πρότερον κατʼ ἐνιαυτόν
  choice: 从前君王每年都向他们征收这些税赋
  rationale: 未完成时配合“从前”表示过去惯常发生的征收；“每年都”自然传达反复性。
- source_word: τῶν γενημάτων τῆς γῆς
  choice: 土地的出产
  rationale: γενήματα泛指土地的农产或收成；“出产”保留宽泛范围。
- source_word: τῶν ἀκροδρύων
  choice: 树上的果实
  rationale: 该词指树木所产之物，可包括水果或坚果；正文采用自然概括语，并在脚注交代词义范围。
