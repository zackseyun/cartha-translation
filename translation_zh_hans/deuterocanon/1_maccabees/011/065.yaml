  language: zh_hans
  text: 西门在伯夙拉安营，攻打该城多日，并将该城围住[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把城封锁起来”或“将城围住”。希腊文动词意为封闭、围住；这里很可能指攻城时的包围封锁。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: 安营
  rationale: 该动词通常指扎营或安营；在这里具有军事背景，但后文已明确交战和围困，因此不提前译成“围攻”。
- source_word: Βεθσούρᾳ
  choice: 伯夙拉
  rationale: 按希腊文地名音译，采用适合现代汉语的专名形式。
- source_word: ἐπολέμει
  choice: 攻打
  rationale: 未完成时表示持续进行的军事行动；“攻打”自然简明，并能与“多日”相配。
- source_word: ἡμέρας πολλὰς
  choice: 多日
  rationale: 准确表达持续许多天的时间长度，符合现代汉语叙事习惯。
- source_word: συνέκλεισεν
  choice: 把城围困起来
  rationale: 原词表示封闭、围住；在攻城语境中译作“围困”既自然，又保留围堵使其受困的含义。
