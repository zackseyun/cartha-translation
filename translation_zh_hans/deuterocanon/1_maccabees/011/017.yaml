lexical_decisions:
- source_word: ἀφεῖλεν
  choice: 砍下
  rationale: 该动词以“头”为直接宾语，在此表示将头割下；“砍下”在现代汉语叙事中自然明确。
- source_word: Ζαβδιὴλ
  choice: 撒布迭
  rationale: 按希腊文音译人名，并采用适合中文圣经人名的音译形式。
- source_word: ὁ Ἀραβ
  choice: 阿拉伯人
  rationale: 这是说明撒布迭族属或身份的同位语；“阿拉伯人”直接、自然。
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: 亚历山大的头
  rationale: 忠实表达属格关系，中文简洁清楚。
- source_word: ἀπέστειλεν
  choice: 送给了
  rationale: 结合与格“托勒密”，表示把砍下的头送交托勒密；“送给了”符合现代汉语表达。
- source_word: τῷ Πτολεμαίῳ
  choice: 托勒密
  rationale: 原文仅有人名，没有“王”的称号，因此不增译头衔。
