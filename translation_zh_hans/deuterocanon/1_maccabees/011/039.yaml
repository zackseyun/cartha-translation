base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: zh_hans
  text: 特律丰从前是亚历山大一方的人。他见全军都在抱怨德米特里，就去见阿拉伯人西玛古厄斯；这人正在抚养年幼的安条克，就是亚历山大的孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚历山大的孩子”，这里指亚历山大的儿子。
    reason: 说明希腊文以省略结构表达亲属关系；正文保留其措辞，注释交代所指。
lexical_decisions:
- source_word: Τρύφων
  choice: 特律丰
  rationale: 按希腊语人名音译，并采用庄重、易读的现代汉语形式。
- source_word: τῶν παρὰ Ἀλεξάνδρου
  choice: 亚历山大一方的人
  rationale: παρά加人名属格在这里表示归属或阵营关系；译文不额外断定其具体官职。
- source_word: τὸ πρότερον
  choice: 从前
  rationale: 准确表达先前的时间，并符合现代汉语叙事习惯。
- source_word: πᾶσαι αἱ δυνάμεις
  choice: 全军
  rationale: δυνάμεις在军事语境中指军队或兵力；“全军”自然简洁，也不暗示多支彼此独立的军队。
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: 都在抱怨德米特里
  rationale: καταγογγύζω表示因不满而低声议论、埋怨；κατά加属格表明不满针对德米特里。
- source_word: ἐπορεύθη πρὸς
  choice: 就去见
  rationale: 既保留前往某人那里的动作，也符合汉语中拜访或接洽某人的自然说法。
- source_word: Σιμμάκουην τὸν Ἄραβα
  choice: 阿拉伯人西玛古厄斯
  rationale: 人名依希腊文音译，民族称谓作为同位说明自然前置。
- source_word: ἔτρεφεν
  choice: 正在抚养
  rationale: τρέφω在此不仅指供养，也包含照料并养育年幼王子的意思。
- source_word: τὸ παιδάριον
  choice: 年幼的
  rationale: 保留παιδάριον所强调的幼小之意，同时避免汉语中“小孩子安条克”的生硬表达。
- source_word: τὸ τοῦ Ἀλεξάνδρου
  choice: 亚历山大的孩子
  rationale: 保留希腊文省略结构所表达的亲属归属，不在正文中直接改写为更明确的“儿子”。
