  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: zh_hans
  text: 他派使臣去见德米特里王，说：“来吧，让我们彼此立约[a]。我要把我的女儿，就是亚历山大现今有的那一位，给你[b]；你将统治你父亲的王国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”也可译作“缔结盟约”。希腊语διαθήκη指正式订立的约；在这里是政治盟约。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我的女儿，亚历山大有她”。这里指亚历山大当时所娶的那位女儿；正文不将这一婚姻关系直接补入原文。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀπέστειλεν πρέσβεις
  choice: 派使臣去见
  rationale: πρέσβεις指正式的外交代表；“使臣”符合古代政治语境。“去见”自然表达πρός所指的派遣对象。
- source_word: Δημήτριον βασιλέα
  choice: 德米特里王
  rationale: 采用通行人名音译，并以“王”自然表达其君王身份。
- source_word: Δεῦρο συνθώμεθα πρὸς ἑαυτοὺς διαθήκην
  choice: 来吧，让我们彼此立约
  rationale: “来吧”保留Δεῦρο的劝请语气；“彼此”表达相互关系；“立约”兼顾διαθήκη的正式、庄重分量，同时适合外交盟约语境。
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: 我要把我的女儿……给你
  rationale: 保留婚姻结盟措辞的直接性和原文的给予结构，不额外解释为“嫁给你”。
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: 就是亚历山大现今拥有的那一位
  rationale: 保留ἔχει“拥有”的直陈措辞，并以“现今”显明当前状态；不在正文中擅自补出“妻子”。
- source_word: βασιλεύσεις τῆς βασιλείας τοῦ πατρός σου
  choice: 你必统治你父亲的国
  rationale: “统治”表达βασιλεύσεις的君王治理行动；“你父亲的国”将βασιλεία理解为父亲的王国或疆域，而不是抽象王权。
