base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/018.yaml
  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: zh_hans
  text: 托勒密王在第三天死了；那些在他的堡垒里的人，也被堡垒里的人消灭了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在前后两处都用了“在堡垒里”。这可能是要区分托勒密堡垒中的人和堡垒中转而攻击他们的人，但两群人的确切关系在原文中并不清楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 直译其死亡之意，措辞直接自然，不采用委婉表达。
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 在第三天
  rationale: 保留希腊文的时间表达，不擅自补明从哪一事件起算。
- source_word: οἱ ὄντες
  choice: 那些……里的人
  rationale: 自然表达泛指的一群人，不增添原文没有明说的性别信息。
- source_word: ὀχυρώμασιν
  choice: 堡垒
  rationale: 体现设防地点的军事含义，也适合两处重复使用。
- source_word: ἀπώλοντο
  choice: 被……消灭了
  rationale: 结合ὑπό加属格所标明的施事者采用被动表达，同时不把具体方式限定为杀死。
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: 被堡垒里的人
  rationale: 保留施事关系以及原文对“堡垒里”的重复；不擅自解释两群人的确切身份。
