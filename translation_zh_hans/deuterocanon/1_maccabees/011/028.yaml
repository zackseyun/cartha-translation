base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: zh_hans
  text: 约拿单请求王免除犹太地、三个辖区[a]和撒马利亚的赋税，并答应给王三百他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“托帕基亚”（toparchies），指一种行政区划；这里译为“辖区”。
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: 请求
  rationale: 此处接不定式，表示约拿单向王正式提出请求；“请求”自然、庄重，又不至于强化为“要求”或“逼迫”。
- source_word: ποιῆσαι
  choice: 免除……的赋税
  rationale: 希腊文直译为“使……成为免税的”；汉语用“免除……的赋税”更自然，并准确表达使这些地区取得免税地位的意思。
- source_word: ἀφορολόγητον
  choice: 免除……的赋税
  rationale: 该词指免受税赋或贡赋；此译简明易懂，同时保留古代财政语境。
- source_word: τὰς τρεῖς τοπαρχίας
  choice: 三个辖区
  rationale: τοπαρχία是行政区划术语。“辖区”既保留行政性质，又比音译更便于现代普通读者理解；脚注补充说明其技术含义。
- source_word: τὴν Σαμαρῖτιν
  choice: 撒马利亚
  rationale: 此处指撒马利亚地区；采用现代中文圣经传统中通行的地名译法。
- source_word: ἐπηγγείλατο
  choice: 答应
  rationale: 中间语态动词表示承诺或允诺；“答应”符合上下文，说明约拿单承诺给王一笔款项。
- source_word: τάλαντα τριακόσια
  choice: 三百他连得
  rationale: 保留古代重量及货币单位，不以不确定的现代币值换算；“他连得”是中文圣经语境中较通行的音译。
