base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: zh_hans
  text: 他留在那人身边[a]，为要把他交给他，好让他接替他父亲作王。他们把德米特里所做的一切，以及他的军队对他所怀的敌意[b]，报告给他；他在那里停留了许多天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处可指“留在……身边”“坐在……旁边”或“侍候在……左右”。本节连续使用“他”，各代词的具体所指及目的从句的主语在原文中并不完全明确。
    reason: 说明προσεδρεύω的语义范围，并保留原文真实的代词指代含混。
  - marker: b
    text: 希腊文使用“敌意”和同根动词重复表达，字面近似“他的军队以敌意敌对他”。这里的“他的军队”指德米特里的军队。
    reason: 说明原文的同根重复，并交代紧邻先行词所支持的军队归属。
lexical_decisions:
- source_word: προσήδρευσεν αὐτῷ
  choice: 他守在那人身边
  rationale: προσεδρεύω有坐在旁边、守候或紧随某人的意思；此处采用“守在……身边”，既保留持续贴近的图景，也不把动机过度解释为奉承或强逼。
- source_word: παραδοῖ αὐτὸν αὐτῷ
  choice: 要那人把他交给自己
  rationale: παραδίδωμι意为“交出、交给”。用“那人”和“自己”使汉语句法可读，同时保留原文连续代词所带来的指代张力。
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: 好让他接替父亲作王
  rationale: ἀντί在此表达取代或继承其父王位；“接替父亲作王”是自然、庄重的现代汉语。
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 该动词指传达消息或正式呈报，符合政治、军事叙事语境。
- source_word: ὅσα συνετέλεσεν Δημήτριος
  choice: 底米特所做的一切
  rationale: συντελέω可指完成或做成；这里用宽泛的“所做的一切”，避免暗示这些行动成功或值得肯定。
- source_word: τὴν ἔχθραν ἣν ἐχθραίνονσιν αὐτῷ
  choice: 对他所怀的敌意
  rationale: 原文以同根名词和动词重复表达敌对；汉语正文用“所怀的敌意”自然呈现实际敌对态度，并在脚注说明希腊文的重复。
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: 底米特的军队
  rationale: δυνάμεις在军事叙事中指军队或兵力。这里将物主所指明示为“底米特”，避免现代汉语中多个“他”造成不可理解的歧义；此指向由紧邻的主语底米特支持。
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: 他就在那里住了许多天
  rationale: 贴近原文的时间说明；“住了许多天”比“停留多日”略为通俗，仍保持叙事庄重。
