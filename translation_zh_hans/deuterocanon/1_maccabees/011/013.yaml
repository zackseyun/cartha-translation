base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: zh_hans
  text: 托勒密进入安提阿，戴上了亚细亚的王冠[a]；他把两顶王冠戴在头上，一顶是亚细亚的，一顶是埃及的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王带”。希腊文两处使用同一个表示君王头饰的词：先说“亚细亚的王冠”，随后说“两顶王冠”，即亚细亚和埃及的王冠。
    reason: 词义备选及原文重复用词说明
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: 这是表示进入城中的简单过去叙事；“进入安提阿”准确、自然。
- source_word: περιέθετο
  choice: 戴上了／戴在头上
  rationale: 中间语态表达把王权标志戴在自己身上。采用具体动作，不解释为较抽象的“取得王位”。
- source_word: διάδημα
  choice: 王冠
  rationale: 该词指君王所戴的束带或冠冕；“王冠”在现代汉语中清楚易懂，并在两处保持同一译法。
- source_word: τῆς Ἀσίας
  choice: 亚细亚的
  rationale: 原文只说“亚细亚的”，不在正文中扩释为塞琉古王国或小亚细亚，以保留其地理兼政治含义。
- source_word: δύο διαδήματα
  choice: 两顶王冠
  rationale: 保留数词与名词的重复，突显同时佩戴两个王权标志这一不同寻常的举动。
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: 戴在头上
  rationale: περί字面有“环绕”之意，但用于头饰时，“戴在头上”是自然且准确的现代汉语。
theological_decisions:
- issue: 佩戴两顶διάδημα所表达的王权象征
  choice: 具体译作把两顶王冠戴在头上
  alternative: 意译为宣称统治亚细亚和埃及
  rationale: 原文借具体的加冕动作表达政治主张；正文保留这一形象，不把其政治含义直接写成解释。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“托勒密”和“安提阿”沿用常见中文专名译法；“亚细亚”保留古代历史语境，也避免让读者误以为这里必然等同于现代地理概念“亚洲”。
