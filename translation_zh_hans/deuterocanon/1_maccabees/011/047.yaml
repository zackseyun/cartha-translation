  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: zh_hans
  text: 王召犹太人前来援助；他们全都一同聚集到他那里，并在城中分散开来[a]。那一天，他们在城里杀了十万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在城中被分散”；这里按作战语境译为“在城中分散开来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 召
  rationale: καλέω在此指君王召来援军；“召”简洁庄重，也符合叙事语境。
- source_word: εἰς βοήθειαν
  choice: 前来援助
  rationale: 该短语表示目的，即召犹太人来提供援助；此译自然呈现其军事语境。
- source_word: ἐπισυνήχθησαν πρὸς αὐτὸν πάντες ἅμα
  choice: 他们全都一同聚集到他那里
  rationale: “全都一同”保留πάντες ἅμα所强调的全体性与共同行动，πρὸς αὐτόν则明确译为“到他那里”。
- source_word: διεσπάρησαν
  choice: 分散到
  rationale: 该词本义为“被分散、散开”；在城内作战的语境中，“分散到城中”既保留原词意象，也能表达兵力展开。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 采用现代汉语中直接、清楚的对应词，不以古雅措辞弱化叙事的暴力内容。
- source_word: εἰς μυριάδας δέκα
  choice: 十万人
  rationale: μυριάς为“一万”，μυριάδας δέκα即“十个一万”，合计十万人；原文不是一万人。
