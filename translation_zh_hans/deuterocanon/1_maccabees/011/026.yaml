base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: zh_hans
  text: 王也照先前诸王对待他的方式对待他；又在自己所有的朋友面前抬举他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又把他提升到自己所有的朋友之上。”希腊语ἐναντίον通常可指“在……面前”；结合“抬举”，也可理解为他的地位高于他们。“朋友”可指王身边具有特定身份的朝臣。
    reason: 保留ἐναντίον在“在……面前”与比较性“高于”之间的语义歧义，并说明φίλοι在希腊化宫廷语境中的称号性用法。
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: 对待他
  rationale: ποιέω与间接宾语连用，在这里指王对约拿单所采取的行动或给予的待遇；译作“对待他”自然，也不把具体行为说得过窄。
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: 王怎样对待他，王的前任也曾怎样对待他
  rationale: οἱ πρὸ αὐτοῦ指这位王以前的诸王，即其前任。中文调整分句次序并补出“王的前任”，使比较关系清楚，同时保留原文两次ἐποίησεν/ἐποίησαν的呼应。
- source_word: ὕψωσεν
  choice: 提升
  rationale: ὑψόω在宫廷政治语境中表示提高地位或尊荣。“提升”兼顾品级晋升和受尊崇之意，又比“高举”更符合现代政治叙事。
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: 到自己所有的朋友之上
  rationale: 结合ὕψωσεν，可理解为在王的众友之上提高约拿单的地位；“朋友”保留φίλοι这一希腊化宫廷称号的字面形式。ἐναντίον也可表示“在……面前”，故以脚注保留歧义。
