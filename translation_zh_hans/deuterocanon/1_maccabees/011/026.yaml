translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王的前任”明确指历任君王；“提升”适合宫廷政治语境。主文保留“朋友”的直译，脚注提示其可能是宫廷称号及“在……面前”的另一解法。
