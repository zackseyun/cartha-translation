  - severity: low
    issue: 首句中文比较结构不够自然。
    rationale: 原文的“王怎样对待他，王的前任也曾怎样对待他”虽未改变基本意思，却使读者先接收结果、后接收比较基准。改为“王也照先前诸王……的方式”更顺畅且忠实。
