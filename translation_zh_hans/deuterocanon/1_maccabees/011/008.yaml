  rationale: 修订仅消除不必要的强转折和不够自然的搭配，并使地名限定语及持续谋划的表达更符合现代汉语。经文仍保留原文的叙事次序、地理界限、取得控制的政治含义，以及对亚历山大的敌对谋划；脚注继续保存介词短语的字面歧义。
