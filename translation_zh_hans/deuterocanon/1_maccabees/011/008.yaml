base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: zh_hans
  text: 托勒密王取得了沿海各城的控制权，直到临海的塞琉西亚；他正盘算着针对亚历山大的恶计。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他正盘算着关于亚历山大的恶计。”希腊语 περὶ Ἀλεξάνδρου 直译为“关于亚历山大”；但结合“恶计”，上下文显示这些计谋是针对他的。
    reason: 保留περὶ Ἀλεξάνδρου的字面译法，并说明正文按语境所采用的敌对指向。
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: 控制了
  rationale: 该动词表示取得并行使支配权。在军事、政治语境中，“控制了”自然准确，也不至于像“统治了”那样暗示长期、稳固的主权。
- source_word: πόλεων τῆς παραλίας
  choice: 沿海各城
  rationale: 简洁表达沿海地区的诸城，符合现代汉语地理叙述习惯，并保留复数含义。
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: 直到海滨的塞琉西亚
  rationale: τῆς παραθαλασσίας用于辨明这是临海的那座塞琉西亚；“海滨的塞琉西亚”既保留限定语，也避免擅自采用未由本节直接规定的专名形式。
- source_word: διελογίζετο
  choice: 图谋
  rationale: 未完成时态表示持续盘算；在“恶计”的搭配下，“图谋”自然体现筹划过程及敌意，但不额外添加具体阴谋内容。
- source_word: λογισμοὺς πονηρούς
  choice: 恶计
  rationale: λογισμός在此可指盘算、计谋，受πονηρός修饰而具有明确的恶意；“恶计”简洁保留其道德评价。
- source_word: περὶ Ἀλεξάνδρου
  choice: 要对付亚历山大
  rationale: περί本义是“关于”，但与“图谋恶计”连用时，语境表明这些谋划针对亚历山大。“要对付”在现代汉语中传达这种敌对指向，同时以脚注保留原文较宽泛的字面表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”承接前文转折；分号呈现攻占沿海城市与谋害亚历山大两项连续行动。人名、地名使用常见的简体中文音译形式。
