  text: Give us your right hands[a], and let the Jews stop fighting against us and the city.
translation:
  language: zh_hans
  text: “请向我们伸出右手[a]，让犹太人不再攻击我们和这座城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“把右手（复数）给我们”。伸出右手是表示和平、结盟或诚信保证的习惯表达。
    reason: cultural_note
lexical_decisions:
- source_word: Δὸς
  choice: 伸出
  rationale: 这是 δίδωμι 的不定过去时命令式，直译为“给”。与“右手”这一缔约、示好语境搭配时，现代汉语自然表达为“伸出”，同时保留具体动作意象。
- source_word: δεξιάς
  choice: 右手
  rationale: 希腊文为复数，指以右手作为和平、结盟或守信的保证。汉语以集合性单数“右手”表达更自然，不必机械保留复数；具体意象保留，并用脚注解释习语。
- source_word: παυσάσθωσαν
  choice: 让……停止
  rationale: παύω 的第三人称不定过去时命令式中间形，要求有关的人停止正在进行的行动；“让……停止”准确且符合现代汉语。
- source_word: πολεμοῦντες
  choice: 攻击
  rationale: πολεμέω 的现在分词表示持续进行敌对或作战行动。此处“攻击”简洁自然，并能同时支配“我们”和“这城”。
- source_word: ἡμᾶς καὶ τὴν πόλιν
  choice: 我们和这城
  rationale: 保留两个受攻击对象。τὴν πόλιν 只有定冠词，没有物主词，因此译为“这城”，不增添“我们的”。
