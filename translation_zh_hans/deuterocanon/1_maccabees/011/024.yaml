base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: zh_hans
  text: 他带上银子、金子、衣服和许多其他礼物，前往托勒迈斯去见王，并在王面前得了恩宠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“得到了王的恩宠”。希腊文按字面是“在他面前找到了恩惠”。
    reason: 说明希腊文惯用语的字面形式及自然汉语译法。
lexical_decisions:
- source_word: λαβὼν
  choice: 带上
  rationale: 不定过去时分词表示先于或伴随主要动作的行动；“带上”既自然，也符合携礼前往见王的语境。
- source_word: ἀργύριον καὶ χρυσίον
  choice: 银子、金子
  rationale: 保留两种贵重材质并列的基本含义；“银子”在现代中文中也自然包含作为财物的意味。
- source_word: ἱματισμόν
  choice: 衣服
  rationale: 指作为礼品的衣物；“衣服”通俗、明确，又不失庄重。
- source_word: ἕτερα ξένια πλείονα
  choice: 许多其他礼物
  rationale: ξένια在此指待客或外交往来中的馈赠；结合政治语境译作“礼物”最清楚。ἕτερα和πλείονα共同表达列举之外还有许多礼物。
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: 前往托勒迈斯去见王
  rationale: 同时保留行程目的地托勒迈斯和行动对象“王”；“去见王”比直译“到王那里”更符合现代汉语。
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: 在王面前蒙了恩
  rationale: 贴近希腊文“在他面前找到恩惠”的圣经惯用表达；将代词明确为“王”，避免现代汉语中的指代含混。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“带上……前往……去见王”使动作顺序自然；地名按希腊文 Πτολεμαΐδα 音译为“托勒迈斯”。
