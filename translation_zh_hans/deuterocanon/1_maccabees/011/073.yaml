base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/073.yaml
  text: And those who had fled from him saw it[a], and they returned to him, and with him they pursued as far as Kadesh, as far as their camp[b], and they encamped there.
translation:
  language: zh_hans
  text: 那些从他身边逃走的人看见了这事[a]，就回到他那里，和他一同追赶，直到加低斯，直追到他们的营地[b]，并在那里安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看见”；希腊文没有明说所看见的对象，是回指上文发生的事。
    reason: lexical_alternative
  - marker: b
    text: “他们的营地”最自然是指被追赶者的营地，但希腊文的代词本身没有明确说明。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  choice: 那些从他身边逃走的人
  rationale: 将名词化的过去分词译为此前已经逃走的人，并用“从他身边”表达与领袖分离的意思；不额外断定这是背叛还是单纯溃逃。
- source_word: ἴδον
  choice: 看见了这事
  rationale: 希腊文未明说宾语，汉语可省略，但补入含义宽泛的“这事”能自然回指上文，同时不具体限定他们所看见的究竟是哪一幕。
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: 回到他那里
  rationale: 既表达行动方向的逆转，也保留πρὸς αὐτόν所指向的那位人物，不强化为重新效忠。
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: 和他一同追赶
  rationale: 保留共同参与和持续追击的意思；“追赶”不擅自补出宾语，延续原文依赖语境的表达。
- source_word: ἕως Κάδης
  choice: 直到加低斯
  rationale: ἕως标明追击所到的地点界限；Κάδης按常见中文圣经地名形式音译为“加低斯”。
- source_word: ἕως τῆς παρεμβολῆς αὐτῶν
  choice: 直追到他们的营地
  rationale: παρεμβολή在军事语境中译为“营地”；保留αὐτῶν的“他们”，不在正文中武断指定所指对象。加入“直追”使第二个ἕως与追击动作的关系在汉语中清楚自然。
- source_word: παρενέβαλον ἐκεῖ
  choice: 并在那里安营
  rationale: παρεμβάλλω在此表示扎营；“安营”庄重自然，也与前面的“营地”形成原文所具有的词义呼应。
