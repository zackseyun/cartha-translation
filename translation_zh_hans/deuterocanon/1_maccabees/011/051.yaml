base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/051.yaml
  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: zh_hans
  text: 他们就丢下武器，讲和了。犹太人在王面前，也在他王国中的所有人面前，都大受尊重；随后，他们带着许多战利品返回耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: 丢下武器
  rationale: 直译“把武器扔下”，在叙事语境中自然表达停止抵抗或解除武装，同时保留原文动作的鲜明感。
- source_word: ἐποίησαν εἰρήνην
  choice: 讲和了
  rationale: 现代汉语中简洁自然地表达缔结和平；不补出原文未明说的对象。
- source_word: ἐδοξάσθησαν
  choice: 大受尊重
  rationale: 此处指犹太人在王及国人眼中获得公开的尊荣和声望，并非神学意义上的“得荣耀”。
- source_word: ἐναντίον τοῦ βασιλέως
  choice: 在王面前
  rationale: 保留原文“在……面前”的公开、关系性含义，也可涵盖“在王看来”的评价意味。
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: 在他国中所有人面前
  rationale: 贴近原文结构，并清楚呈现尊荣范围从王扩展至其国中众人。
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: 返回耶路撒冷
  rationale: 准确表达回到先前所在或所属之地的叙事含义。
- source_word: σκῦλα πολλά
  choice: 许多战利品
  rationale: σκῦλα特指战争中夺取的物品；“战利品”比泛称“掠物”更准确，也符合现代历史叙事语体。
