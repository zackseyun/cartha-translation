  source_fidelity: 译文准确传达了放下武器、缔和、犹太人获得尊荣，以及携带大量战利品返回耶路撒冷的叙事。惟“在他国中所有人面前”中的“他国”在现代汉语里通常意为“别的国家”，容易误解，未能清楚对应其王国或统治范围（τῇ βασιλείᾳ αὐτοῦ）。
