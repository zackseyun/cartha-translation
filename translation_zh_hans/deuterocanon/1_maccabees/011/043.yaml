  yaml_path: translation/deuterocanon/1_maccabees/011/043.yaml
  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
translation:
  language: zh_hans
  text: 所以现在，你派些人到我们这里来，与我并肩作战；你这样做就对了，因为我所有的军队都离弃我了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离弃我了”也可译作“弃我而去”或“脱离了我”。希腊语动词可指离弃、脱离或撤离；此处指说话者的军队已不再留在他一方。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: 所以现在
  rationale: 该短语兼有承接和推论作用；“所以现在”在现代汉语中自然，并保留由前文转入请求的语气。
- source_word: ὀρθῶς ποιήσεις
  choice: 就是做得妥当了
  rationale: 这是称许对方采取某项行动的书信惯用表达，不只是抽象判断行为正当；此译文保留委婉请求的意味。
- source_word: ἀποστείλας ἡμῖν
  choice: 派人到我们这里来
  rationale: 不定过去时分词说明怎样做才妥当；与间接受词ἡμῖν合译，表达派遣人员前来己方。
- source_word: ἄνδρας
  choice: 人
  rationale: 原文是一般名词“人、男子”，并非专门的军事术语；其军事职能由后面的关系从句说明。
- source_word: οἳ συμμαχήσουσίν μοι
  choice: 与我并肩作战
  rationale: συμμαχέω表示作为盟友共同参战；“并肩作战”自然传达军事支援，而非泛泛帮助。
- source_word: ἀπέστησαν
  choice: 背叛了我
  rationale: 在军事语境中表示离弃、倒戈或反叛；“背叛了我”突出这些军队不再效忠说话者，同时不限定其具体去向。
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: 我的军队全都
  rationale: δυνάμεις在此指军事力量；“军队”符合现代汉语，并保留复数集合体的总体含义。
