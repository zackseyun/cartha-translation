lexical_decisions:
- source_word: ἔλαβεν
  choice: 夺取了
  rationale: λαμβάνω在军事政治叙事中带直接宾语，表示取得或夺得；“夺取”比单纯“拿了”自然，又不必断定具体是俘获还是接收。
- source_word: Τρύφων
  choice: 特里丰
  rationale: 按现代汉语常见的希腊人名译法音译。
- source_word: τὰ θηρία
  choice: 那些兽
  rationale: 原文直译为“那些兽”；上下文很可能指军用战象。正文保留原词的表达及其指涉张力，并以脚注说明。
- source_word: κατεκράτησεν
  choice: 控制了
  rationale: κατακρατέω后接属格Ἀντιοχίας，表示取得并保持支配权；“控制了”符合军事政治语境，且不把动作过度具体化为攻城或占领。
- source_word: Ἀντιοχίας
  choice: 安提阿
  rationale: 采用该古城在简体中文圣经及历史文献中的通行译名。
