base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: zh_hans
  text: 加沙人向约拿单求和，约拿单便给了他们承诺[b]；他又把他们首领的儿子扣作人质，送往耶路撒冷[a]。随后，他穿过那一带，直到大马士革。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文抄本在“耶路撒冷”之后另有一个孤立的词“阿撒林”（Ἀσαλήμ）。这个词在句中难以讲通，可能是文本讹误或误入此处的地名。
    reason: textual_variant
  - marker: b
    text: 原文直译为“给了他们右手”，这是表示承诺、诚信或和好的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: 求和
  rationale: 该动词本义较宽，可指请求、恳求；在军事对峙的语境中，译作“求和”自然地表达他们向约拿单寻求有利安排，但不进一步具体化条款。
- source_word: οἱ ἀπὸ Γάζης
  choice: 加沙人
  rationale: 直译为“来自加沙的人”；“加沙人”简洁自然，也可涵盖当地派出的代表。
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: 给了他们承诺
  rationale: 字面为“给他们右手”，是以握右手表示信用或保证的习语。“给了他们承诺”传达其外交含义，同时由脚注保留原文意象。
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: 他们首领的儿子
  rationale: ἀρχόντων 指掌权者或首领；“首领”符合城邦政治与军事语境，又不把具体官职说得过死。
- source_word: εἰς ὅμηρα
  choice: 作为人质
  rationale: 明确表达这些儿子被带走的用途，符合现代汉语惯用表达。
- source_word: διῆλθεν τὴν χώραν
  choice: 穿过那一带
  rationale: χώρα 可指土地、地区或境内；“那一带”在此行军地理语境中自然，并避免误解为现代主权国家。
- source_word: ἕως Δαμασκοῦ
  choice: 直到大马士革
  rationale: 准确表达空间终点，符合现代汉语。
- source_word: Ἀσαλήμ
  choice: 正文不译，脚注说明
  rationale: 该孤立词位于“耶路撒冷”之后，不能顺畅纳入句法，可能是讹误或窜入的地名；不宜在正文中猜测性补译，但须在脚注保留见证。
