base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/067.yaml
  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
translation:
  language: zh_hans
  text: 约拿单和他的军队在革尼撒[a]水边扎营。清早，他们起来，前往拿梭平原。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文本作“革尼撒”；这个地名也常以“革尼撒勒”为人所知。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“清早起来，往拿梭平原”；原文没有另用一个表示行进的动词，前往平原的意思由方向短语体现。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: 军队
  rationale: 在军事叙事中可指营地，也可指驻营的军兵群体。此处与“约拿单”并列作主语，用“军队”在现代汉语中自然，也保留集体含义。
- source_word: παρενέβαλον
  choice: 扎营
  rationale: 直接表达安营、驻扎之意，符合军事语境。
- source_word: ἐπὶ τὸ ὕδωρ
  choice: 在……水边
  rationale: 结合扎营语境，这一介词短语自然表示临水之处；“水边”比字面的“水上”更符合场景。
- source_word: τοῦ Γεννησάρ
  choice: 革尼撒
  rationale: 按本节希腊文本Γεννησάρ音译，不径自协调为较常见的“革尼撒勒”。
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: 清早，他们起来
  rationale: ὤρθρισαν表示早起或黎明即起，τὸ πρωὶ进一步强调早晨；译文保留两者的时间意味，而不把动身之意全都归入该动词。
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: 前往拿梭平原
  rationale: εἰς指向目的地；希腊文虽没有另写行进动词，但方向短语蕴含朝平原而去的意思。补出“前往”使现代汉语完整自然，并以注释说明原文结构。
