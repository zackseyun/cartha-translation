  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: zh_hans
  text: 他从那里前往加沙；加沙人把他拒之城外。于是他在城的四周扎营[a]，放火焚烧城外周边地区[b]，并劫掠了那些地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“围困了城。”希腊原文直译是“围绕着城坐下（驻扎）”。
    reason: lexical_alternative
  - marker: b
    text: “城外周边地区”所对应的希腊语含义不很确定，也可能指加沙的外围地带或郊区。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 前往
  rationale: 这是叙事中表示移动的简单过去时；“前往”自然、庄重，也符合上下文。
- source_word: οἱ ἀπὸ Γάζης
  choice: 加沙人
  rationale: 原文直译为“那些来自加沙的人”，在这里指加沙的居民或守城者；“加沙人”简洁且不把所指过度限定为男性。
- source_word: ἀπέκλεισαν
  choice: 把他拒之城外
  rationale: 该动词表示封闭、阻挡进入；结合城市语境，“拒之城外”清楚表达加沙人不让他入城的敌对行动。
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: 在城的四周扎营
  rationale: 原文形象是“围绕着它坐下/驻扎”，在军事语境中暗含围城；译文保留具体形象，不直接压缩为“围攻”。
- source_word: τὰ περίπολα αὐτῆς
  choice: 城外周边地区
  rationale: 该词在本处含义不确定，较可能指加沙城外围、郊区或周边地带；采用较宽泛的表达，避免武断限定为“郊区”或“哨所”。
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: 放火焚烧
  rationale: 原文以动词和“用火”形成强调；“放火焚烧”在现代汉语中自然，并保留其强调力度。
- source_word: ἐσκύλευσεν
  choice: 劫掠
  rationale: 这是军事语境中夺取财物、战利品的常用词；“劫掠”准确、清楚且语体庄重。
theological_decisions: []
