base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/012.yaml
  text: And after taking his daughter away from him[a], he gave her to Demetrius; and Alexander’s attitude changed, and their hostility became evident.
translation:
  language: zh_hans
  text: 他把女儿从亚历山大那里带走，交给德米特里；亚历山大的脸色变了[a]，他们之间的敌意也显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“亚历山大的脸变了”。这句话也可能指他的神情、态度或心境发生了变化，并非只描述外貌。
    reason: 保留原文“脸”的具体意象及其可能的惯用含义，避免正文把多义表达限定为单一解释。
lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: 把女儿从亚历山大那里带走
  rationale: ἀφελόμενος表示先行的夺回或带走行动，αὐτοῦ指女儿原先所在的一方；结合本句后半明确提到亚历山大，译出其名可避免现代汉语连续代词造成的混淆，同时保留“从……那里带走”的剥离意味。
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: 交给德米特里
  rationale: 原文只说“把她给了德米特里”，婚姻关系由上下文表达，并未在本句明说“嫁给”，因此采用自然而不过度增译的“交给”。
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: 亚历山大的脸色变了
  rationale: 直译为“亚历山大的脸／面容改变了”。“脸色变了”在现代汉语中既保留面容意象，也可暗示态度或情绪的转变，避免直接把含义限定为抽象的“态度改变”。
- source_word: ἐφάνη
  choice: 显露出来
  rationale: 该词在这里表示原有的敌意变得可见、公开表现出来；“显露出来”自然地保留这种由隐而显的动态。
- source_word: ἡ ἔχθρα αὐτῶν
  choice: 他们之间的敌意
  rationale: ἔχθρα表示敌意或仇视，αὐτῶν表明涉及双方；“他们之间的敌意”比“他们的敌意”更清楚地呈现彼此关系。
