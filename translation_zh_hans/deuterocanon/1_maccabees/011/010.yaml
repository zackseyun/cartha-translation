  text: For I regret giving him my daughter[a], for he sought to kill me.
translation:
  language: zh_hans
  text: 因为我后悔把女儿嫁给了他；他曾想杀我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他曾试图杀我。”希腊语动词既可表示“想要、寻求”，也可表示“尝试”。
    reason: 保留ἐζήτησεν接不定式在意图与尝试之间的词义歧义。
lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: 我后悔
  rationale: 该完成时中间形式表达对过去行为现今仍有的懊悔。“我后悔”自然、准确，也避免赋予此处未必具有的宗教性悔改含义。
- source_word: δοὺς αὐτῷ τὴν θυγατέρα μου
  choice: 把女儿嫁给了他
  rationale: 在王室政治婚姻语境中，“把女儿给他”即把女儿嫁给他；这样译成现代汉语更自然，同时保留父亲作为婚姻安排者的表达视角。
- source_word: ἐζήτησεν
  choice: 曾想
  rationale: ζητέω接不定式既可表示寻求、意图，也可表示尝试。“曾想”在此自然表达杀害的意图，但原词也可能强调实际尝试，故以脚注保留另一可能。
- source_word: ἀποκτεῖναί με
  choice: 杀我
  rationale: 直接表达预期的致死行为，不额外加入“谋杀”等法律或道德色彩。
