base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: zh_hans
  text: 约拿单出发，行经河那边的各城。叙利亚的所有军队都聚集到他那里，与他结盟。他来到亚实基伦，城里的人隆重地出来迎接他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλεν
  choice: 出发
  rationale: 表示约拿单离开原地、开始此行；不额外加入“率军”等原文未明说的军事细节。
- source_word: διεπορεύετο πέραν τοῦ ποταμοῦ καὶ ἐν ταῖς πόλεσιν
  choice: 走遍大河那边的各城
  rationale: 未完成时态描写持续行进；结合移动语境，将ἐν ταῖς πόλεσιν自然表达为在各城之间行经。“大河那边”保留πέραν所表达的彼岸区域概念。
- source_word: τοῦ ποταμοῦ
  choice: 大河
  rationale: 希腊文只写定指的“河”，没有直接命名；汉语历史地理语境中用“大河”可表达这条作为区域界线的著名河流，同时不在正文中武断补出“幼发拉底河”。
- source_word: πᾶσαι αἱ δυνάμεις Συρίας
  choice: 叙利亚的军队全都
  rationale: δυνάμεις在本段军事语境中指武装力量；“军队”比抽象的“力量”清楚，并保留πᾶσαι的全称含义。
- source_word: ἠθροίσθησαν πρὸς αὐτὸν εἰς συμμαχίαν
  choice: 都聚集到他那里，与他结盟
  rationale: 既保留“向他聚集”的动作，也用“与他结盟”自然传达εἰς συμμαχίαν所表示的目的或结果。
- source_word: Ἀσκαλῶνα
  choice: 亚实基伦
  rationale: 采用现代中文圣经及历史地名中通行的译名。
- source_word: ἀπήντησαν αὐτῷ οἱ ἐκ τῆς πόλεως ἐνδόξως
  choice: 城里的人隆重地出来迎接他
  rationale: ἀπαντάω可指前去迎接；“隆重地”传达ἐνδόξως所含尊荣、体面的接待方式。
