    issue: “走遍”可能过度表达持续行进
    rationale: διεπορεύετο表示行进、穿行，并未明确说逐一走遍所有城邑；“行经”保留移动和经过各城的意思。
  - severity: medium
    issue: “大河”及注a不准确反映原文
    rationale: 希腊文为τοῦ ποταμοῦ（“那条河”），虽历史背景中可能指幼发拉底河，却没有“大河”一词。正文应避免增添“大”，注释也应据实说明。
  - severity: medium
    issue: 注b的“加入盟军”不当
    rationale: εἰς συμμαχίαν意为“为结盟／进入联盟关系”，并不表示加入某一支“盟军”。
  revised_text: 约拿单出发，行经河那边的各城。叙利亚的所有军队都聚集到他那里，与他结盟。他来到亚实基伦，城里的人隆重地出来迎接他。
