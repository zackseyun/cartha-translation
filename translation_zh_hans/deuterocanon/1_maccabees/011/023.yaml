base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/023.yaml
  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: zh_hans
  text: 约拿单听见了，就下令围住他们；他又从以色列的长老中选出一些人，又从祭司中选出一些人，并使自己置身于危险之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“把他交给危险”。“他”所指不甚明确；正文按上下文将此理解为约拿单使自己置身于危险之中。
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: 把他们包围起来
  rationale: 此不定式在军事语境中表示从四周围住或困住。希腊文未明说宾语；按上下文补出“他们”，同时不把行动具体化为长期围城。
- source_word: ἐπέλεξεν
  choice: 选出
  rationale: 准确表达从一个群体中挑选人员的普通意义。
- source_word: τῶν πρεσβυτέρων Ἰσραὴλ καὶ τῶν ἱερέων
  choice: 从以色列的长老和祭司中……一些人
  rationale: 两个属格在ἐπέλεξεν之后宜作部分属格理解，表示从长老和祭司当中选人，并非选取全体。
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: 使自己置身于危险之中
  rationale: 传世希腊文本直译近于“把他交给危险”，代词所指不自然。结合约拿单一直作为主语的叙事脉络，正文采用其亲自冒险的可能含义，并以脚注保留原文疑难。
theological_decisions:
- issue: ἔδωκεν αὐτὸν τῷ κινδύνῳ中单数代词αὐτόν的指向
  choice: 理解为约拿单使自己置身危险之中
  alternative: 严格按字面译作“使他置身于危险之中”
  rationale: 这属于文本和句法疑难，并非教义判断。上下文最自然的连贯理解是约拿单亲自冒险，但希腊文确实写作“他”，故不在正文中硬译不明所指的“他”，而在脚注中透明说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“置身于危险之中”略带书面色彩，适合经文语体，也保留原句的郑重感。
