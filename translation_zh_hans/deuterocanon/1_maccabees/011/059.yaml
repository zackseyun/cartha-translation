  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
translation:
  language: zh_hans
  text: 他又任命他的兄弟西门为统帅[a]，负责从推罗阶梯[b]直到埃及边境一带。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“将军”。希腊语“στρατηγός”指军事领袖，具体译法可随语境而定。
    reason: lexical_alternative
  - marker: b
    text: “推罗阶梯”是地名，可能指推罗附近的沿海隘道或陡坡，并非字面意义上的梯子。
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  choice: 任命
  rationale: 此动词在这里表示将某人置于正式职务上；“任命”自然、准确地传达授职之意。
- source_word: στρατηγὸν
  choice: 统帅
  rationale: 该词指军事领袖；“统帅”明确表达军事职务，同时避免套用后世过于精确的军衔。
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: 从推罗阶梯
  rationale: κλίμαξ本义为“梯子、阶梯”，但此处是地名；保留“推罗阶梯”可忠实呈现专名。
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: 直到埃及边界
  rationale: ὅρια可指疆界或边境；此译清楚表达其管辖范围所达到的界线。
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的兄弟西门
  rationale: 自然地保留西门与句子主语之间的兄弟关系。
