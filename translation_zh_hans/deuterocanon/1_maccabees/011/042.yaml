base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: zh_hans
  text: 德米特里乌斯派人对约拿单说：“我不但要为你和你的民族做这些事，还要大大尊荣[a]你和你的民族，如果我得到合适的机会。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“以荣耀来荣耀”，是加强语气的表达，意思是“大大尊荣”。
    reason: 说明原文同根词重复所形成的强调语气。
lexical_decisions:
- source_word: ἀπέστειλεν Δημήτριος πρὸς Ἰωνάθαν λέγων
  choice: 德米特里乌斯派人对约拿单说
  rationale: ἀπέστειλεν本义为“派遣、差派”；这里没有明说所派之人或信件，汉语用“派人对……说”自然表达传话场景，同时不把未明说的书信写入正文。
- source_word: τῷ ἔθνει σου / τὸ ἔθνος σου
  choice: 你的民族
  rationale: ἔθνος在此指作为共同体的犹太民族，兼有族群和政治意味；“民族”比泛称“人民”更能保留这一层次。
- source_word: Οὐ μόνον ταῦτα ποιήσω
  choice: 我不但要……做这些事
  rationale: 保留οὐ μόνον引出的递进结构，并以现代汉语自然语序表达将来的承诺。
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: 还要大大尊荣
  rationale: 原文以同根名词δόξῃ加强动词δοξάσω，表示郑重而强烈的尊荣；“大大尊荣”既传达强调，也避免生硬重复。
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: 只要我得到合适的机会
  rationale: τυγχάνω接属格可表示“得到、遇到”，εὐκαιρία指合宜或有利的时机；此译保留条件意味，也符合承诺语境。
