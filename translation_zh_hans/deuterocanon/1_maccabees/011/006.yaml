  text: And Jonathan met the king at Joppa with honor, and they greeted one another, and they spent the night there.
translation:
  language: zh_hans
  text: 约拿单在约帕隆重地与王会面；二人彼此问安，并在那里过夜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήντησεν
  choice: 迎接
  rationale: 此处指约拿单与王会面；结合外交行程语境，译作“迎接”自然地表达他前去与王相会，同时不增添原文没有的礼仪细节。
- source_word: εἰς Ἰόππην
  choice: 在约帕
  rationale: εἰς与会面动词连用时可表达会面的地点；现代汉语以“在约帕”最自然。
- source_word: μετὰ δόξης
  choice: 隆重地
  rationale: δόξα可指荣耀、尊荣或显赫场面；在外交会晤中，这一短语主要表示会面具有尊荣和礼仪性的排场，译作“隆重地”简洁自然。
- source_word: ἠσπάσαντο ἀλλήλους
  choice: 二人彼此问安
  rationale: ἀσπάζομαι通常表示问候或致意；“彼此问安”保留相互性，又不具体化为拥抱等原文未明说的动作。
- source_word: ἐκοιμήθησαν
  choice: 在那里过夜
  rationale: 该动词字面义为“睡下”，在旅行叙事中常指留宿过夜；“过夜”准确传达此处的叙事功能。
