base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: zh_hans
  text: 底米丢先前遣散的军队全都聚集到他那里[a]，与他交战；他便逃跑，溃败了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先前遣走”或“先前解散”。希腊语动词可指解除军队服役，也可指将人从面前遣走；上下文较支持军事上的遣散。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: 聚集到他那里
  rationale: 不定过去时被动式与πρὸς αὐτόν连用，表示众军聚拢并归向上下文所指的人；此译自然保留军事集结的含义。
- source_word: δυνάμεις
  choice: 军队
  rationale: 在军事语境中指武装力量；“军队”是现代汉语中自然且宽泛的对应，不必细化为多支“军团”。
- source_word: ἀπεκρόακεν
  choice: 先前遣散
  rationale: 该动词在此可指将部队遣走或解除服役；结合上下文采用军事色彩明确的“遣散”，并以“先前”表达此事早于本句主要事件。
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: 与他交战
  rationale: πρὸς在此具有敌对意义；现代汉语“与他交战”清楚表示对抗，而非并肩作战。
- source_word: ἔφυγεν
  choice: 逃跑
  rationale: 简洁呈现战事叙述中的逃离；用语通俗自然，同时不增添是否成功脱逃的判断。
- source_word: ἐτροπώθη
  choice: 溃败了
  rationale: 该被动式在军事语境中表示被击退、被打得败逃；“溃败”比一般的“战败”更能保留战场上败退的意味。
