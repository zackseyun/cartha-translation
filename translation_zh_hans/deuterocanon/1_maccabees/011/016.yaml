base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: zh_hans
  text: 亚历山大逃往阿拉伯，为要在那里得到庇护[a]；而托勒密王却被高举了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要在那里藏身”，或“为要在那里受到保护”。希腊文可以表示得到遮蔽、藏匿或保护。
    reason: lexical_alternative
  - marker: b
    text: 或译：“地位提高了”，或“变得强大了”。希腊文直译是“被高举了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃往
  rationale: φύγω的不定过去时在此表示因局势而逃离；“逃往”既体现逃亡，也自然衔接目的地“阿拉伯”。
- source_word: Ἀραβίαν
  choice: 阿拉伯
  rationale: 按现代汉语通行地名译法处理该专名。
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: 为要在那里得到庇护
  rationale: 带τοῦ的冠词化不定式表达目的；被动态σκεπασθῆναι可指被遮蔽、藏匿或保护。“得到庇护”在现代汉语中自然，也保留寻求安全保护的语义范围。
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: 而托勒密王却
  rationale: δέ在这里使亚历山大的逃亡与托勒密王的上升形成对照；“而……却”清楚传达这种叙事反差。
- source_word: ὑψώθη
  choice: 被高举了
  rationale: ὑψόω的被动态直译为“被高举”。此译法保留政治地位、尊荣或势力上升之间的开放性，不径直限定为“变得强大”。
theological_decisions:
- issue: 王权政治语境中ὑψώθη的含义
  choice: 被高举了
  alternative: 地位提高了；变得强大了
  rationale: 原词既可表示被提升、受尊崇，也可能在上下文中暗示权势增长。采用较形式对应的译法，保留这种张力，不将其缩减为单纯的政治实力变化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为要”略带经文叙事色彩，但普通读者容易理解；“被高举”保留原文的被动形式及其含义张力，并以脚注说明在政治语境中的其他可能译法。
