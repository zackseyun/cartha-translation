base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/045.yaml
  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: zh_hans
  text: 城里的人聚集到城中心，共有十二万名男子[a]；他们想杀死王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“十二个万的男子”，即十二万名男子。
    reason: 说明希腊文以“万”为计数单位的原文表达。
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: 聚集
  rationale: 该动词表示一同聚拢、集合；“聚集”自然、准确，也保留了群体主动会合的语气。
- source_word: οἱ ἐκ τῆς πόλεως
  choice: 城里的人
  rationale: 希腊文直译为“来自城里的人”；此处用现代汉语“城里的人”，不在原文尚未明确性别之处擅加“男子”。
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: 到城中心
  rationale: εἰς 表示趋向，τὸ μέσον 指中央或中心；“到城中心”既保留移动方向，也符合现代汉语表达。
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: 共有十二万名男子
  rationale: δώδεκα μυριάδας 即“十二个万”，合十二万；ἄνδρας 明指男子。εἰς 在此引出人数总计，译作“共有”比增添近似意味的“大约”更贴近明确数字。
- source_word: ἠβούλοντο
  choice: 他们想
  rationale: βούλομαι 的未完成过去时表达当时持续存在的意愿或打算；“想”直接自然，不强化为“决意”。
- source_word: ἀνελεῖν
  choice: 杀死
  rationale: ἀναιρέω 在此语境中指夺取性命；“杀死”直白准确，不用古雅的“杀戮”或含蓄的“除掉”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“城里的人”避免在首个群体称谓中擅加性别；“男子”则对应原文明确的 ἄνδρας。分号呈现聚集人数与杀王意图之间紧密而有层次的关系。
