  text: And on that day three thousand men of the foreigners fell[a], and Jonathan returned to Jerusalem.
translation:
  language: zh_hans
  text: 那一天，外族人中有三千人阵亡[a]；约拿单返回耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为：“约有三千人。”希腊语这一表达可能指总数达到三千，也可能带有近似的意味。
    reason: 保留εἰς ἄνδρας τρισχιλίους在确数、达到某数与近似数量之间的解释空间，而不将其中一种解释强加于正文。
lexical_decisions:
- source_word: ἔπεσον
  choice: 阵亡
  rationale: 该动词本义为“倒下”，在战争语境中惯指战死者；“阵亡”自然保留其军事含义，又不增添具体死法。
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: 外族人中
  rationale: ἀλλόφυλοι指属于其他族群的人；本处泛指非犹太的敌对者，不宜特指“非利士人”。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 符合现代汉语的自然时间表达。
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: 约有三千人
  rationale: εἰς加数量可表示达到某一数目，也可能带近似意味；正文采用自然的近似表达，并以脚注保留精确数字的可能。
- source_word: ἐπέστρεψεν
  choice: 返回
  rationale: 在行程语境中表示回到先前所在或相关地点。
- source_word: Ἰωναθάν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
