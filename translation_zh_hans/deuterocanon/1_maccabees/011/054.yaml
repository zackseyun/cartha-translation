  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
translation:
  language: zh_hans
  text: 此后，特里丰返回，安提阿同他一起回来，安提阿是一个年纪较小的孩子[a]。他作了王，戴上王冠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“很年幼的男孩”或“较年幼的孩子”。希腊文παιδάριον νεώτερον强调安提阿年纪尚幼。
    reason: lexical_alternative
  - marker: b
    text: 直译“戴上王冕”；希腊文所指的是象征王权的束额。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 此后
  rationale: 自然表达叙事中的时间推进，同时保留“这些事以后”的含义。
- source_word: ἀπέστρεψεν
  choice: 回来了
  rationale: 该动词表示转回或返回；此处按叙事语境译作“回来”简洁自然。
- source_word: παιδάριον νεώτερον
  choice: 还是个年幼的孩子
  rationale: παιδάριον指孩子或男孩，νεώτερον突出年纪尚幼；中文不强行确定具体年龄，也不生硬复制比较级。
- source_word: ἐβασίλευσεν
  choice: 作了王
  rationale: 在随即戴上王冠的语境中，这个简单过去时很可能表示登基、开始为王；“作了王”既简明，也保留“成为王／执掌王权”的语义空间。
- source_word: ἐπέθετο διάδημα
  choice: 戴上王冠
  rationale: 中间语态表示给自己戴上；διάδημα特指王权标志性的冠冕或束额，正文用现代读者易懂的“王冠”。
theological_decisions:
- issue: ἐβασίλευσεν是表示开始作王还是持续统治
  choice: 作了王
  alternative: 开始统治／执掌王权
  rationale: 上下文紧接“戴上王冠”，更像是在叙述即位；但不用“登基”这一更具体的礼仪性词语，以免超出希腊文。
- issue: διάδημα的王权用语
  choice: 王冠
  alternative: 王冕／王者束额
  rationale: 本节是历史叙述，不涉及需特别限定的教义含义；“王冠”清楚传达其君王身份，脚注保留原词更具体的形制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“安提阿”在第二分句重复一次，以免中文中的代词关系含混；将希腊文较长的并列句分为两句，保持事件次序与主语清楚。
