base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/049.yaml
  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: zh_hans
  text: 城里的人见犹太人已经如愿控制了这城，就灰心丧气，向王呼喊，恳求说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: 城里的人
  rationale: 按语境指城中的居民或一方势力，并非字面意义的“在城下的人”；此译自然且不过度限定其身份。
- source_word: κατεκράτησαν … τῆς πόλεως
  choice: 控制了全城
  rationale: κατακρατέω与属格连用，表示取得支配权、掌控；“控制”准确表达结果，又不额外加入暴力夺取的含义。中文以“全城”自然表达对该城整体的控制。
- source_word: ὡς ἠβούλοντο
  choice: 如愿
  rationale: 表示事情正如犹太人所希望或意欲的那样；“如愿”简洁地保留这一含义。
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: 灰心丧气
  rationale: 字面为“心思变得软弱”，在此指勇气和意志消沉；采用现代汉语习语传达其情绪与意志受挫。
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα
  choice: 向王……喊着说
  rationale: κράζω带有大声呼喊的力度；“喊着说”保留强烈语气，并自然引出下一节的直接引语。
- source_word: μετὰ δεήσεως
  choice: 哀求
  rationale: δέησις指恳切、迫切的请求；“哀求”在本语境中自然地表达其低声下气而急切求告的意味。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词用于引出下一节的直接话语；以“喊着说”衔接，符合现代中文叙事习惯。
