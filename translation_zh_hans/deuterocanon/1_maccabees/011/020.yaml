base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: zh_hans
  text: 那些日子，约拿单召集了来自犹太地的人，要攻打耶路撒冷的堡垒[a]；他们造了许多攻城器械来攻击它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿克拉堡”，即耶路撒冷城内设防的据点。
    reason: 保留ἄκρα既可作普通名词“堡垒”，也可近似专名“阿克拉”的词汇可能性。
lexical_decisions:
- source_word: συνήγαγεν
  choice: 召集了
  rationale: 该动词在军事语境中表示把人聚集起来；“召集”自然地传达有目的的集合，又不额外规定正式编制。
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: 来自犹太地的人
  rationale: 希腊文表达略有省略；译文保留“来自犹太地”的范围，不擅自补作“士兵”或限定为男性。
- source_word: τοῦ ἐκπολεμῆσαι
  choice: 要攻打
  rationale: 带冠词的不定式表示目的；ἐκπολεμέω在此指对堡垒采取军事行动，“攻打”符合现代汉语并保留其强烈敌对含义。
- source_word: τὴν ἄκραν
  choice: 堡垒
  rationale: ἄκρα可指设防的高地或城堡；此处特指耶路撒冷的塞琉古据点。正文用通俗的“堡垒”，专名式理解留在脚注中。
- source_word: μηχανὰς πολλάς
  choice: 许多攻城器械
  rationale: μηχανή在围攻语境中不是泛指机器，而是用于攻城的军事装置；“攻城器械”准确且易懂。
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: 造了……来攻击它
  rationale: ποιέω与器械连用表示制造，ἐπʼ αὐτήν表示针对该堡垒的敌对用途；这一译法在汉语中清楚自然。
