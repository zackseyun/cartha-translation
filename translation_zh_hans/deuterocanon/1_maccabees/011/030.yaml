  language: zh_hans
  text: 德米特里王致他的弟兄约拿单，并致犹太民族：问安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处“犹太”所指的人群也可译作“犹太地人”。希腊语Ἰουδαίων可按语境突出族群身份或地域身份。
