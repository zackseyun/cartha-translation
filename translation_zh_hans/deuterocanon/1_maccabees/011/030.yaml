lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: 德米特里王
  rationale: 按现代汉语的自然称谓次序译出王号与人名；“德米特里”采用通行的圣经人名译法。
- source_word: Ἰωνάθαν
  choice: 约拿单
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: τῷ ἀδελφῷ
  choice: 向他的弟兄
  rationale: 保留ἀδελφός的明示关系称谓；在王室书信中这很可能是外交或礼遇性的称呼，并不必然表示亲生兄弟。汉语补出“他的”，使关系清楚自然。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊化时期书信开头的惯用问候语；“问安”简洁、庄重，也符合中文书信表达。
- source_word: ἔθνει
  choice: 民族
  rationale: ἔθνος在此指作为整体和政治共同体的群体；“民族”较能保留这一集体含义。
- source_word: Ἰουδαίων
  choice: 犹太
  rationale: 在“犹太民族”中作限定语，采用最通行且易懂的译法；其词义也可依语境突出地域身份而理解为“犹太地人”。
theological_decisions:
- issue: 王室书信中ἀδελφός的含义
  choice: 正文保留“弟兄”，理解上不限定为血缘关系
  alternative: 意译为“盟友”或理解为亲生兄弟
  rationale: 原文明确使用ἀδελφός，而外交语境容许它作为表示平等、团结或尊荣的称号。保留原称谓可避免把可能的政治礼称窄化为血缘关系，也不以解释性意译取代原文。
- issue: Ἰουδαίων的族群与地域含义
  choice: 正文译为“犹太民族”
  alternative: 译为“犹太地人的民族”或“犹太人群体”
  rationale: “犹太民族”在现代汉语中自然，并保留ἔθνος的整体性；脚注说明Ἰουδαίων也可能突出地域身份。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，按中文书信习惯合并表达收信对象与问候语，同时保留王室外交称谓的含混性。
