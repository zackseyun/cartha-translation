  yaml_path: translation/deuterocanon/1_maccabees/011/021.yaml
  text: And some lawless men[a], who hated their own nation, went to the king and reported to him that Jonathan was besieging the citadel.
translation:
  language: zh_hans
  text: 有些憎恨自己民族的不法之徒来到王那里，向他报告说，约拿单正在围攻卫城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿克拉”，即耶路撒冷的设防卫城。
    reason: 保留 ἄκρα 既可作普通名词“卫城”，也可指耶路撒冷特定据点“阿克拉”的词义可能。
lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: 到……那里
  rationale: 在叙事语境中自然表达前往某人处的动作，与后接的“王”衔接顺畅。
- source_word: τινες
  choice: 有些
  rationale: 保留原文不明确指出人数和身份的复数指称。
- source_word: μισοῦντες τὸ ἔθνος αὐτῶν
  choice: 憎恨自己民族的
  rationale: 将分词结构译为定语，既符合现代汉语习惯，也保留其持续描述这些人的作用；“民族”体现此处犹太民族共同体的含义。
- source_word: ἄνδρες παράνομοι
  choice: 不法之徒
  rationale: 兼顾 παράνομοι 的法律与道德贬义；“之徒”自然表达原文对这群人的负面定性。
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 准确表达向君王呈报消息的宫廷语境，同时保持现代汉语的自然庄重。
- source_word: περικάθηται
  choice: 正在围攻
  rationale: 该词在军事语境中指包围设防地点；“正在”体现原文现在时所呈现的持续行动。
- source_word: τὴν ἄκραν
  choice: 城堡
  rationale: 直接传达设防据点之意，同时在脚注保留其可能作为专名“阿克拉”的译法。
