base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/033.yaml
  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: zh_hans
  text: 鉴于犹太民族——他们是我们的朋友，也遵守对我们应尽的义务[a]——对我们的善意，我们决定善待他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也持守对我们公正的事。”希腊语直译为“也持守那些对我们公正的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: 至于犹太民族
  rationale: ἔθνος可指“民族”或“人民”；此处与ἀγαθοποιῆσαι构成受益对象。用“至于……民族”既体现与格关系，也符合诏书语体。
- source_word: φίλοις ἡμῶν
  choice: 他们是我们的朋友
  rationale: 这是对犹太民族的同位说明；译成完整分句，在现代汉语中更清楚自然。
- source_word: συντηροῦσι
  choice: 也一直持守
  rationale: 该分词含持续保存、遵守之意；“一直持守”表达延续性的忠诚或履责，“也”反映其连接作用。
- source_word: τὰ πρὸς ἡμᾶς δίκαια
  choice: 对我们应尽的义务
  rationale: 字面为“对我们公正的事”，在政治、盟约式语境中可指应有的行为或义务；正文采用自然明确的表达，同时以脚注保留较宽泛的道德—法律含义。
- source_word: ἐκρίναμεν
  choice: 我们决定
  rationale: 在王室书信或诏令语境中表示正式作出决定；“我们决定”准确而符合现代汉语。
- source_word: ἀγαθοποιῆσαι
  choice: 施恩于他们
  rationale: 原义是“行善、使受益”。此处主语为统治者，语境涉及正式给予好处；“施恩”自然体现政治性恩惠，但不预先限定具体内容。
- source_word: χάριν
  choice: 鉴于
  rationale: 引出作出有利决定的原因；“鉴于”适合正式诏书语体。
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: 他们对我们的善意
  rationale: εὔνοια表示善意、好感或忠诚倾向；“善意”保留其关系性和政治色彩，又不将其过度限定为效忠。
