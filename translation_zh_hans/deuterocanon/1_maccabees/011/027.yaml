  register: 采用庄重而通顺的现代标准汉语。“尊荣”体现王室授予的荣誉地位；“第一等王友”保留希腊文宫廷称号的特色，并用脚注说明其性质。为避免连续代词造成歧义，按上下文明确写出“约拿单”。
