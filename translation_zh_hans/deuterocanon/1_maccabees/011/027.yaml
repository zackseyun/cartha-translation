  yaml_path: translation/deuterocanon/1_maccabees/011/027.yaml
  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
translation:
  language: zh_hans
  text: 他确认了约拿单的大祭司职分，以及约拿单先前享有的其他一切尊荣，又使他位列第一等王友[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“位列首席王友”。“第一等王友”很可能是塞琉古王廷中的正式等级。
    reason: 说明可能的译法，并交代这一短语所指的宫廷职级。
lexical_decisions:
- source_word: ἐστήρισεν
  choice: 确认了
  rationale: 这里指君王正式认可并巩固约拿单已经获得的职位，不是初次任命；“确认了”最能体现行政上的核准。
- source_word: ἀρχιερωσύνην
  choice: 大祭司职分
  rationale: 该词指大祭司的职位与尊位；“大祭司职分”在现代中文中自然、明确。
- source_word: τίμια
  choice: 尊荣
  rationale: 该词在这里作名词用，指约拿单先前享有的荣誉和尊贵待遇，而非贵重物品。
- source_word: τὸ πρότερον
  choice: 先前
  rationale: 保留原文对约拿单此前所享地位的时间指向。
- source_word: τῶν πρώτων φίλων
  choice: 第一等王友
  rationale: 这很可能是塞琉古王廷中的正式等级或头衔。“第一等”贴近 πρώτων，“王友”则使 φίλων 在宫廷语境中的专门含义清楚可辨。
- source_word: ἡγεῖσθαι
  choice: 使他位列
  rationale: 该结构表示把某人算入或置于某一等级；“使他位列”兼顾任定身份和排列等级的含义。
