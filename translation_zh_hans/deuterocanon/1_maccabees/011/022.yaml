base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: zh_hans
  text: 他听见这事，就发怒了。他一听到消息，立刻拔营，来到多利买；又写信给约拿单，叫他不要再围城[a]，而要尽快到多利买来迎见他，同他会合[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围城”所译的希腊语，字面可作“坐守在周围”或“留在周围”；在这里是指继续维持围攻。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊语句法生硬，近于“迎见他，与他会合”。也可按其大意译作“到多利买同他会谈”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: 听见这事／一听到消息
  rationale: 保留原文短距离内重复“听见”的表达，同时用自然的现代汉语略作变化；第二处突出随即采取行动。
- source_word: ὠργίσθη
  choice: 发怒了
  rationale: 直接表达不定过去时的起怒或愤怒状态，不额外强化为“暴怒”。
- source_word: εὐθέως
  choice: 立刻
  rationale: 简明表达行动的即时性，符合现代叙事语体。
- source_word: ἀναζεύξας
  choice: 拔营
  rationale: 该词在军事行程中指收营启程；“拔营”既具体又简洁。
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: 来到多利买
  rationale: 直译移动及目的地；“多利买”采用常见圣经地名译法。
- source_word: ἔγραψεν Ἰωναθὰν
  choice: 写信给约拿单
  rationale: 按上下文将写信对象自然地表达出来。
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: 不要再围城
  rationale: 字面有“不要继续坐守在周围”之意，在军事语境中指停止维持围攻；以脚注保留其字面可能性。
- source_word: ἀπαντῆσαι
  choice: 来迎见他
  rationale: 该动词可指前去迎接或会见某人；“迎见”保留主动前往相见的方向感。
- source_word: αὐτὸν αὐτῷ συνμίσγειν
  choice: 同他会合
  rationale: 传世希腊文本句法生硬，似乎累加“迎见他”和“与他会合”；正文尽量保留这两个动作而不擅自具体化为正式会谈。
- source_word: τὴν ταχίστην
  choice: 尽快
  rationale: 自然表达最高程度的急迫，即“以最快速度”。
