  text: and he reproached him because he desired his kingdom[a].
translation:
  language: zh_hans
  text: 他责备那人，因为那人想要他的王国。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那人觊觎他的王国。”希腊语动词也可表示“想要”或“渴望”；在这里可能带有较强的“觊觎”意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  choice: 责备
  rationale: ψογίζω表示责怪、非难或责备；“责备”保留了针对个人的指责意味，又不夸大为正式定罪。
- source_word: χάριν τοῦ
  choice: 因为
  rationale: χάριν与带冠词的不定式构成原因表达；译作“因为”符合现代汉语习惯。
- source_word: ἐπιθυμῆσαι
  choice: 想要夺取
  rationale: ἐπιθυμέω本可泛指“想要、渴望”，也可在语境中带有“觊觎”的负面意味。这里对象是别人的王国，译作“想要夺取”自然表达政治野心，同时以脚注保留较贴近字面的译法。
- source_word: τῆς βασιλείας
  choice: 王国
  rationale: βασιλεία可指王国、王权或统治；此处指属于另一位君王的国度，“王国”最直接。
- source_word: αὐτὸν ... αὐτοῦ
  choice: 那人……他的
  rationale: 希腊文连续使用第三人称代词；汉语若直译为“他……他”容易混淆，加入“那人”提高可读性，同时“他的”仍保留原文指代需由上下文判定的特点。
