base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/031.yaml
  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: zh_hans
  text: 拉斯特尼就你们的事写给我们的一位亲族[a]的那封信，我们也将其副本送给了你们，好让你们阅览。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲属”。希腊语“συγγενής”可指血缘亲属、亲族，也可在宫廷或外交语境中用作对受尊重的亲近人士、盟友或同胞的称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: 那封信……抄了一份
  rationale: ἀντίγραφον指文书的副本或抄本；用“抄了一份”既自然，也保留了复制书信的具体含义。
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: 拉斯特尼写……的那封信
  rationale: 关系从句修饰“信”；ἔγραψεν直译为“写”，不扩大为“送”。人名按现代汉语音译为“拉斯特尼”。
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: 给我们亲族[a]
  rationale: συγγενής通常可指有血缘关系的亲属或族人，在宫廷外交语境中也可能是对亲近同僚、盟友或同胞的尊称。“亲族”保留其核心亲缘色彩，并以脚注说明语境上的其他可能。
- source_word: περὶ ὑμῶν
  choice: 内容涉及你们
  rationale: περί加属格表示“关于、涉及”；此处采用符合正式书信语体的表达，不将其解释为较强的“为你们求情”。
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: 我们也抄了一份给你们
  rationale: 完成时表示已经完成且与当前有关的行动；καί译作“也”。结合前面的ἀντίγραφον，这里自然表达为把同一封信另抄一份给收信人。
- source_word: ὅπως ἰδῆτε
  choice: 好让你们过目
  rationale: ὅπως加虚拟式表示目的；ἰδῆτε本义为“看见、查看”，“过目”在文书语境中自然、庄重，且不改译为“知道”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的公文书信语体。“抄了一份给你们”避免生硬照搬希腊语“写给你们一份副本”；“过目”对应查看文书的目的。
