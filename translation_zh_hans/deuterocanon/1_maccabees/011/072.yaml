  text: And he turned back against them in battle[a], and routed them, and they fled.
translation:
  language: zh_hans
  text: 他转回去与他们交战[a]，击溃了他们；他们便逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语字面近似“他转回，向着他们作战”；原文将“转回”与“向他们作战”紧缩连接，这里译作“转回去与他们交战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回头
  rationale: 该动词有“转回、返回”之意；“回头”保留了重新转向敌军的动作，也符合战事叙述的语境。
- source_word: πρὸς αὐτοὺς πόλεμον
  choice: 迎战他们
  rationale: 希腊语表达较为紧缩，直译近似“向着他们转回战争”。“迎战他们”自然地表达重新转向对方作战的意思，同时保留敌对行动的方向性。
- source_word: ἐτροπώσατο
  choice: 击溃了
  rationale: 该词指使敌军败退、溃逃；“击溃”比一般的“打败”更准确，并与下文“逃跑”衔接。
- source_word: ἔφυγον
  choice: 他们就逃跑了
  rationale: 直接呈现简单过去时的叙事动作；“逃跑”清楚自然，也准确表达败军逃离。
