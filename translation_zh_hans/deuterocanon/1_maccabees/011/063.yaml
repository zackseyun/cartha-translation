  yaml_path: translation/deuterocanon/1_maccabees/011/063.yaml
  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
translation:
  language: zh_hans
  text: 约拿单听说，德米特里的将领已经率领大军来到加利利的基低斯，打算解除他的职务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他离开所担任的职任。”希腊语短语也可指免去某人的职位，或使人离开所承担的职责。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 这里的简单过去时表示约拿单得到了消息；“听说”比单纯“听见”更自然地体现传闻或情报的语境。
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: 德米特里的将领
  rationale: ἄρχοντες可指统治者、官员或领袖；下文提到大批武装力量，因此这里采用军事语境中的“将领”。
- source_word: παρῆσαν
  choice: 已经……来到
  rationale: 该动词表示到达之后身在当地；“已经来到”兼顾到达及当时已经在场的含义。
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: 加利利的基低斯
  rationale: 地点限定语用于说明是哪一座基低斯；按现代汉语地名表达自然处理。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 率领大军
  rationale: δύναμις在军事叙事中常指军队或兵力；“率领大军”自然表达将领带着强大兵力前来，但不进一步规定具体兵种。
- source_word: βουλόμενοι
  choice: 打算
  rationale: 分词在这里表达将领们前来的意图或目的。
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: 解除他的职务
  rationale: μεθίστημι可表示移开、撤换，χρεία可指职责、职任或公务；结合政治军事语境，“解除他的职务”最为清楚，同时以脚注保留原文可能侧重职任或职责的空间。
