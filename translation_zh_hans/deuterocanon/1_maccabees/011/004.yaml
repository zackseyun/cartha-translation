base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: zh_hans
  text: 德米特里临近亚实突时，人们把被焚毁的达贡庙、被摧毁的亚实突及其周围的村镇[a]、四处丢弃的尸体，以及约拿单在战争中烧死的人，都指给他看；因为他们把这些人堆成一堆堆[b]，放在德米特里行进的路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “周围的村镇”也可译作“郊外地区”或“外围聚落”。
    reason: lexical_alternative
  - marker: b
    text: 译作“一堆堆”的希腊词十分罕见，确切含义不明；也可能指“土堆”或“焚尸堆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: 临近
  rationale: 准确表达接近某地的动作，简洁自然。
- source_word: Ἄζωτον
  choice: 亚实突
  rationale: 采用该古城在现代中文圣经传统中通行的名称，而不按希腊形式音译为“阿佐托”。
- source_word: ἱερὸν Δαγὼν
  choice: 达贡庙
  rationale: ἱερόν在此指达贡的祭祀建筑或圣所；“庙”简明自然，也清楚表明异教崇拜场所。
- source_word: ἐνεπυρισμένον
  choice: 被焚毁
  rationale: 既表达遭火焚烧，也体现眼前已成废墟的结果状态。
- source_word: τὰ περιπόλια αὐτῆς
  choice: 其周围的村镇
  rationale: 该词指城邑外围的聚落或地区；“村镇”比现代意味较强的“郊区”更符合古代背景，同时保留一定范围弹性。
- source_word: καθῃρημένα
  choice: 被摧毁
  rationale: 表达被拆除、毁坏的结果，并能自然地同时修饰城和外围村镇。
- source_word: τὰ σώματα ἐρριμμένα
  choice: 四处丢弃的尸体
  rationale: 上下文表明 σώματα 是死尸；“四处丢弃”传达 ἐρριμμένα 所含粗暴抛置、散乱陈列之意。
- source_word: τοὺς ἐμπεπυρισμένους οὓς ἐνεπύρισε ἐν τῷ πολέμῳ
  choice: 他在战争中烧死的人
  rationale: 保留希腊文关系从句中明确的施事者“他”，并以现代汉语自然表达这些人已经被烧死的结果。
- source_word: βωμίας
  choice: 一堆堆
  rationale: 此罕见词语义不确定；正文采用较宽泛的“堆”，不武断限定为专门用于焚尸的柴堆。
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: 在他所经过的路上
  rationale: 清楚表达这些尸堆被置于他行进路线沿途，符合叙事语境。
