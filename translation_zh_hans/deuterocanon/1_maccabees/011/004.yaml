  to: 德米特里临近亚实突时，人们把被焚毁的达贡庙、被摧毁的亚实突及其周围的村镇[a]、四处丢弃的尸体，以及约拿单在战争中烧死的人，都指给他看；因为他们把这些人堆成一堆堆[b]，放在德米特里行进的路上。
  rationale: 修订仅消除了汉语代词无法承载的上下文指称差异：明示约拿单为焚烧者，德米特里为临近亚实突并沿路观看者。其余逐项列举、毁坏语气和βωμίας的词义歧义均予保留。
