  naturalness: “把这些人堆成一堆堆”可理解，但在紧接“烧死的人”之后略显生硬；改为“把他们堆成一堆堆，放在……沿途”更符合现代汉语，同时保持原文对βωμίας的未决含义。
  terminology: “亚实突”“达贡庙”“被焚毁”“周围的村镇”均恰当。脚注a保留词义范围；脚注b应说明该罕见词的含义不确定，而不把正文限定为“焚尸堆”。
