base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: zh_hans
  text: 德米特里王见国中在他面前安定，也没有什么抵抗他，就遣散了他所有的军队，各自回到自己的地方；只有他从列国的海岛招募来的外族军队没有遣散[a]。所有从他父辈而来的军队都与他为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族军队”也可译作“外籍雇佣军”。希腊文明确表示这些军队并非本地人，也可能暗示他们是受雇招募的外国士兵。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从父辈而来的全部军队”，可能指从先王统治时期承袭下来的传统军队，与德米特里王留下的外族军队相对。
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: 国中在他面前安定下来
  rationale: ἡ γῆ在历史语境中指其统治范围；ἡσύχασεν表示止息、安定，并不必然意味完全和平。保留“在他面前”以反映ἐνώπιον αὐτοῦ及其相对于王权的意味。
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: 没有任何势力抵抗他
  rationale: 希腊文直译可作“没有什么抵挡他”；中文补出“势力”，使军事政治语境自然，同时不限定为某一支军队。
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: 遣散了他的全部军队
  rationale: ἀπέλυσεν在军事语境中指解除服役、遣回；“遣散”比泛称“释放”准确，δυνάμεις译作“军队”符合上下文。
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: 让各自返回本地
  rationale: 原文逐一分配地表达“各自到自己的地方”；“返回本地”自然，也不武断限定为家乡或驻地。
- source_word: ξένων δυνάμεων
  choice: 外族军队
  rationale: ξένος首先表示外来的、非本地的，在军事语境中也可能含雇佣兵之意；正文采用较少过度解释的“外族军队”，可能的雇佣性质列入脚注。
- source_word: ἐξενολόγησεν
  choice: 招募来的
  rationale: 该动词指招募外族人从军；“招募”保留动作本义，不直接断定他们全是受雇佣的士兵。
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: 从列国的海岛
  rationale: 贴近原文“从诸民族／列国的岛屿”；“列国”在中文圣经历史叙事中自然，又不把地理表达简化为泛泛的“外国”。
- source_word: ἠχθρασαν αὐτῷ
  choice: 全都与他为敌
  rationale: 该动词表示产生或表现敌意；“与他为敌”准确传达关系转为敌对。
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: 他父辈传下来的军队
  rationale: 原文是压缩表达，字面为“从父辈而来的全部军队”；这里与新招募的外族军队相对，最可能指王朝承袭的传统军队。“传下来的”明确关系，但以脚注说明原文的简略性。
