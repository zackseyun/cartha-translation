base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: zh_hans
  text: 年轻的安条克写信给约拿单说：“我任命你担任大祭司，又委任你管理四个辖区，并使你成为‘王友’[a]之一。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的朋友”。这里很可能指希腊化君主宫廷中的一种正式身份或等级，而不只是国王私下的朋友。
    reason: 说明φίλων τοῦ βασιλέως可能兼具普通词义与宫廷专称义。
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写信
  rationale: 该动词本义为“写”，结合与格受信人和后接“说”，现代汉语用“写信给”自然地表达书信行为。
- source_word: ὁ νεώτερος
  choice: 年轻的
  rationale: 这是用来区别同名者的比较级称谓；“年轻的安条克”既保留区别作用，也比“小安条克”更不易被误解为固定中文名号。
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: 我立你担任大祭司
  rationale: 此处表示正式授予或确立大祭司职分；按现代汉语将抽象名词“祭司长职分”转化为“担任大祭司”，清楚而庄重。
- source_word: καθίστημί σε ἐπὶ
  choice: 委任你管理
  rationale: 在行政语境中表示把某人置于一定范围之上负责治理；“委任……管理”体现正式任命。
- source_word: τῶν τεσσάρων νομῶν
  choice: 四个辖区
  rationale: νομός在此指行政区划；“辖区”能表达其行政性质，又避免“省”可能暗示过大的单位。
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: ‘王友’
  rationale: 该词组很可能是希腊化君主宫廷中的正式等级或称号；采用简洁的“王友”并加引号，保留称号意味，注释同时说明其普通词义。
theological_decisions:
- issue: τῶν φίλων τοῦ βασιλέως是否为宫廷称号
  choice: 正文译作“‘王友’”，理解为宫廷身份或等级
  alternative: 译作“王的朋友”，理解为一般私人朋友
  rationale: 上下文是正式任命，希腊化宫廷用语也支持其称号义；但原文形式仍可按普通所有格词组理解，因此以脚注保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和行政用语。“立你担任”与“委任你管理”保留两个不同希腊动词在任职语境中的细微差别；脚注标记紧接所解释的“王友”。
