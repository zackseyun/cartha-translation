  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
translation:
  language: zh_hans
  text: 约拿单撕裂自己的衣服，将土放在头上，然后祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 把土放在头上是古代常见的悲痛、困苦或哀悼表示。原文的“土”也可按这一语境译为“尘土”。
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: διέρρηξεν
  choice: 撕裂
  rationale: 这是 διαρρήγνυμι 的不定过去时，在此指因悲痛或危急而撕裂衣服；“撕裂”准确、自然，也保留动作的强度。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 自己的衣服
  rationale: ἱμάτια 泛指衣物；“自己的衣服”符合现代汉语叙事习惯，并清楚对应反身所属。
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 把尘土撒在头上
  rationale: γῆ 本义可指地、土；在这一哀痛礼俗语境中，汉语以“尘土”最自然。“撒在头上”表达将土置于头上的动作，不额外解释其意义。
- source_word: προσηύξατο
  choice: 祷告
  rationale: προσεύχομαι 的不定过去时，直接表示向神祷告；译作“祷告”简洁准确。
- source_word: Ἰωνάθαν
  choice: 约拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 哀痛动作的呈现
  choice: 正文直接叙述撕裂衣服、把尘土撒在头上和祷告，不把礼俗含义写入正文。
  alternative: 在正文中明确说这是悲痛、哀悼或危难的表示。
  rationale: 希腊文只记述动作，并未明说约拿单当时的具体情绪或仪式解释；直译动作可保留叙事张力，文化意义放入脚注更为稳妥。
- issue: γῆ 的语境译法
  choice: 尘土
  alternative: 土；泥土
  rationale: γῆ 的字面范围较广，但在把土置于头上的哀痛动作中，“尘土”是自然且容易理解的汉语表达；脚注说明原词也可直译为“土”，避免掩盖词义范围。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以“然后”顺接末一动作，使三个连续的不定过去时在汉语中清楚流畅；不增加祷告对象或约拿单情绪的明示说明。
