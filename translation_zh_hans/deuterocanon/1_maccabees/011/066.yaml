base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/066.yaml
  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: zh_hans
  text: 他们请求他接受他们的保证[a]，他便应允了他们；随后，他把他们从那里赶出去，占领了那城，并在城中部署守军。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保证”原文直译为“右手”。当时人可借伸出或握住右手，表示和平、忠诚或彼此的保证。
    reason: 说明希腊语习语的字面意象，并保留所作保证具体性质上的含混。
lexical_decisions:
- source_word: ἠξίωσαν
  choice: 请求
  rationale: 在接不定式的结构中，此词表示提出请求；“请求”自然、庄重，也不把语气强化为“要求”。
- source_word: δεξιὰς λαβεῖν
  choice: 接受他们的信约
  rationale: 字面为“接受右手”，是以右手确认和平、忠诚或互信承诺的习语。“接受信约”传达其社会与政治含义，同时用脚注保留原文意象及具体性质上的开放性。
- source_word: ἔδωκεν αὐτοῖς
  choice: 他就答应了
  rationale: 原文承接前述习语，字面为“他给了他们”。中文若译作“给了他们”所指不清；“答应了”自然表达他向他们作出所求承诺的含义。
- source_word: ἐξέβαλεν
  choice: 赶出去
  rationale: 保留强制驱逐的力度，又符合现代汉语叙事表达。
- source_word: κατελάβετο
  choice: 占领
  rationale: 此处表示取得并控制一座城；“占领”简洁准确，不额外说明攻城方式。
- source_word: φρουράν
  choice: 守军
  rationale: 军事语境中指负责守卫并控制该城的驻军；“守军”比泛称“卫兵”更准确。
- source_word: ἔθετο ἐπʼ αὐτὴν
  choice: 在城中驻扎
  rationale: 结合“守军”译为自然的军事表述，说明将守备部队部署在该城，避免生硬直译“设在其上”。
