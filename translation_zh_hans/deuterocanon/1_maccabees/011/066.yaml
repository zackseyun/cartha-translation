revisions:
- from: 他们请求他接受他们的信约[a]，他就答应了；随后，他把他们从那里赶出去，占领了那城，并在城中驻扎守军。
  to: 他们请求他接受他们的保证[a]，他便应允了他们；随后，他把他们从那里赶出去，占领了那城，并在城中部署守军。
  rationale: 以“保证”替换带有较强契约含义的“信约”，使 δεξιάς 的习语义更自然且不作过度界定；将“答应了”调整为“应允了他们”，并将“驻扎守军”调整为“部署守军”，以更清楚呈现希腊文的指向和动作。
