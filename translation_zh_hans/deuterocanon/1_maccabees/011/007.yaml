  yaml_path: translation/deuterocanon/1_maccabees/011/007.yaml
  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: zh_hans
  text: 约拿单同王同行，直到那条名叫厄琉特洛斯的河；他就返回耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 走
  rationale: 不定过去时在此叙述一次行程；“走”自然简洁，并与范围短语连用顺畅。
- source_word: μετὰ τοῦ βασιλέως
  choice: 陪王
  rationale: μετά加属格表示同行；结合约拿单送行至某处的语境，“陪王”比机械的“与王一起”更符合现代汉语，同时未增加原文之外的身份信息。
- source_word: ἕως τοῦ ποταμοῦ
  choice: 走到……河
  rationale: ἕως表示行程所达到的界限；“走到”保留抵达该界点的含义。
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: 那条名叫厄琉特洛的
  rationale: καλουμένου意为“名叫”；Ἐλευθέρου是河流专名，按希腊语音译，不按其普通词义“自由”翻译。
- source_word: ἐπέστρεψεν
  choice: 返回
  rationale: 表示转回或归返；“返回”简洁、庄重，适合历史叙事。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: εἰς表示返回的目的地；汉语“返回耶路撒冷”无需另加介词即可清楚表达方向。
