  text: 底米丢在第一百六十七年登基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: 登基
  rationale: 此处是不定过去时，在简短的纪年句中指底米丢开始作王；结合具体年份，译作“登基”比泛指持续统治的“作王”更准确自然。
- source_word: Δημήτριος
  choice: 底米丢
  rationale: 按《马加比一书》相关人名的现代中文常见音译处理，保留希腊人名，不赋予词义。
- source_word: ἔτους ἑβδομοῦ καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: 在第一百六十七年
  rationale: 这是纪年公式，希腊文按七、六十、一百的次序组合数词；现代汉语自然表达为“第一百六十七年”。原文未明说纪年体系，译文也不补入。
