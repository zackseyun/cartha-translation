  text: And he went to meet them[a], but he left his brother Simon in the country.
translation:
  language: zh_hans
  text: 他前去迎见他们，却把他的兄弟西门留在那一带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留在那地方”或“留在那地区”。希腊语 χώρα 所指的地域范围较广，不一定是乡村或耕地。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησεν
  choice: 前去迎战
  rationale: 该动词表示前去相遇或迎上；结合上下文的军事场景，译作“前去迎战”自然地保留其趋向性，也不把它弱化为静态的“遇见”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 希腊文为与格复数，明确指向复数对象。
- source_word: κατέλιπεν
  choice: 留
  rationale: 该动词常指留下或留在后方；“留”配合地点短语，简洁自然地表达西门没有随行。
- source_word: ἐν τῇ χώρᾳ
  choice: 在那一带
  rationale: χώρα可指土地、地区或一片地域；“那一带”适合此处军事地理语境，又避免把它局限为乡村或耕地。
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: 他的兄弟西门
  rationale: 清楚保留亲属关系和专名，符合现代汉语语序。
