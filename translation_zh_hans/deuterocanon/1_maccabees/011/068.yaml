base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: zh_hans
  text: 看哪，一支外族军队在平原上迎上他；他们在山中设下伏兵对付他，自己则从对面迎着他而来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们自己则从正面迎上来。”末句较直译为“他们自己从对面相迎”。
    reason: 原文ἐξ ἐναντίας可指“从对面”或“从正面”；ἀπήντησαν意为“迎上、相遇、来迎”，未必明确表示已经交战。
lexical_decisions:
- source_word: παρεμβολὴ
  choice: 军队
  rationale: 该词可指军营，也可转指驻营的军队。此处它能“迎面而来”，译作“军队”比“营地”自然，也符合军事语境。
- source_word: ἀλλοφύλων
  choice: 外族人
  rationale: 原词泛指其他族群的人；本处不宜特指非利士人。“外族人”保留其宽泛的族群含义及敌对语境。
- source_word: ἀπήντα αὐτῷ
  choice: 迎面而来
  rationale: 动词表示迎上、相遇；结合敌军行动，译为“迎面而来”既自然，也保留双方即将交锋的意味。
- source_word: ἐν τῷ πεδίῳ
  choice: 在平原上
  rationale: πεδίον在此指开阔平坦之地，与下文的山地形成地形对照。
- source_word: ἐξέβαλον ἔνεδρον
  choice: 设下伏兵
  rationale: 这是部署埋伏的军事表达；汉语“设下伏兵”准确而自然。
- source_word: ἐπʼ αὐτόν
  choice: 要袭击他
  rationale: 介词短语在伏击语境中表示敌对目标；补出“袭击”使现代汉语清楚流畅，并未改变其敌对方向。
- source_word: ἐν τοῖς ὄρεσιν
  choice: 在山中
  rationale: 按复数地点表达翻译，保留其与平原的对照，不进一步限定为丘陵地带。
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: 自己则从正面迎战
  rationale: “自己”体现αὐτοί的强调，与山中的伏兵形成对照；ἐξ ἐναντίας可指从对面或正面而来，“从正面迎战”清楚表达夹击战术，同时以脚注保留较直译的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“看哪”保留ἰδού的突显作用；“军队”避免将会移动迎敌的παρεμβολή误解为静态营地。句子分为两句，以清楚呈现平原正面军队与山中伏兵的配合。
