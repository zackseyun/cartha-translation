  yaml_path: translation/deuterocanon/1_maccabees/011/037.yaml
  text: Now then[a], take care to make a copy of these things, and let it be given to Jonathan, and let it be placed on the holy mountain in a prominent place.
translation:
  language: zh_hans
  text: 现在，你们要留心把这些内容抄录一份，把副本交给约拿单，并安放在圣山上一处显眼的地方[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一处显著的地方。”希腊语所用的词可指公开可见、引人注意或特别标明的地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: 所以现在
  rationale: 这一组合既承接前文作出推论，又转入当前的命令；“所以现在”保留了这两层作用。
- source_word: ἐπιμελεῖσθε
  choice: 你们要留心
  rationale: 该复数命令式要求受命者认真办理此事；“留心”自然地表达谨慎负责的意味。
- source_word: τοῦ ποιῆσαι τούτων ἀντίγραφον
  choice: 把这些内容抄录一份
  rationale: ἀντίγραφον指文书的副本；τούτων保持复数所指而不擅自限定为某一诏令，“这些内容”在现代汉语中清楚自然。
- source_word: δοθήτω Ἰωνάθαν
  choice: 交给约拿单
  rationale: 希腊文是被动命令式，表达正式指令；汉语用主动式“交给”更自然，并不改变受领者及命令语气。
- source_word: τεθήτω
  choice: 放
  rationale: 该被动命令式要求正式安置这份副本；承接前面的“你们要”，用“放”简洁自然。
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: 在圣山上
  rationale: 按地形语境，ἐν可自然译为“在……上”；“圣山”保留原文称谓，不进一步明定为锡安山或圣殿山。
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: 一处显眼的地方
  rationale: ἐπίσημος在此强调地点引人注意、便于公众看见；“显眼”符合文书公开陈列的行政语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的公文命令语气；保留原文复数受命者和“圣山”的宽泛称谓。脚注标记放在其实际说明的“显眼的地方”之后，以免误指句首连接语。
