  source_fidelity: 译文总体准确传达了命令、制作副本、交予约拿单及安置于圣山显著处的内容。“这些内容”恰当地保留了τούτων的复数和未明说的指涉范围；“圣山”也没有过度限定地名。惟末段“交给约拿单，并放在……”在汉语中可暂时被理解为直接处置前述“内容”，而非明确指向所制作的副本；宜补出“副本”以使两个被动命令的对象清晰对应原文。
