  yaml_path: translation/deuterocanon/1_maccabees/011/029.yaml
  text: 'And the king approved[a], and wrote letters to Jonathan concerning all these things, having this form:'
translation:
  language: zh_hans
  text: 王同意了，便给约拿单写了几封信，论及这一切事，信的格式如下：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信的措辞如下。”希腊原文直译为“具有这样的形式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησεν
  choice: 同意了
  rationale: 此动词在上下文中表示王对先前所提事项作出赞同或允准；“同意了”自然、准确，也比偏重情感的“高兴”更符合行政语境。
- source_word: ἔγραψεν
  choice: 写了
  rationale: 直接对应希腊语简单过去时；与宾语“几封信”搭配自然。
- source_word: ἐπιστολάς
  choice: 几封信
  rationale: 保留希腊语复数；汉语若只说“信”数目不明，加入“几封”可自然体现不定复数，而不指定确切数量。
- source_word: περὶ πάντων τούτων
  choice: 为这一切事
  rationale: 指向上文所谈的各项请求或安排；“为这一切事”在汉语中简洁自然，并保留整体指涉。
- source_word: ἔχουσας τὸν τρόπον τοῦτον
  choice: 信的格式如下
  rationale: 希腊语直译为“具有这样的形式”；因下文随即引出信件内容，“信的格式如下”既保留“形式”的含义，也符合现代汉语公文引语习惯。
