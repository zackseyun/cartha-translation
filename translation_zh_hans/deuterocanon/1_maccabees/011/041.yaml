base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/041.yaml
  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: zh_hans
  text: 约拿单派人去见德米特里王，请求他把城堡里的人[a]赶出耶路撒冷，并赶走各要塞里的人，因为他们正在与以色列交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿克拉堡的人”。“阿克拉堡”特指耶路撒冷的塞琉古城堡。
    reason: ἄκρα既可作普通名词“城堡”，在《马加比一书》的历史语境中也可特指耶路撒冷的阿克拉堡；脚注保留这一专名辨识。
lexical_decisions:
- source_word: ἀπέστειλεν Ἰωνάθης πρὸς Δημήτριον τὸν βασιλέα
  choice: 约拿单派人去见德米特里王
  rationale: ἀποστέλλω在此表示差派使者；汉语补出“人”可自然表达约拿单派遣使者向王提出请求。“德米特里王”符合现代汉语称谓习惯。
- source_word: ἵνα ἐκβάλῃ
  choice: 请求他……赶出
  rationale: 差派动词后的ἵνα从句说明使者所求之事；ἐκβάλλω带有强制逐出的意味，因此译为“赶出”，不弱化为一般性的“移走”。
- source_word: τοὺς ἐκ τῆς ἄκρας ἐξ Ἱερουσαλήμ
  choice: 把城堡里的人赶出耶路撒冷
  rationale: ἄκρα在本书语境中指耶路撒冷的塞琉古城堡；结合ἐξ Ἱερουσαλήμ，整句表达把其中人员逐出耶路撒冷。正文用通俗的“城堡”，专名可能性在脚注说明。
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: 各要塞里的人
  rationale: ὀχύρωμα指设防坚固之处。“各要塞”简洁自然，也与前面的特定“城堡”保持词义区分。
- source_word: ἦσαν γὰρ πολεμοῦντες τὸν Ἰσραήλ
  choice: 因为他们正在与以色列交战
  rationale: 迂回式ἦσαν πολεμοῦντες强调持续中的军事敌对行动；“正在……交战”既保留持续性，也符合现代汉语。宾格τὸν Ἰσραήλ在此是受攻击的一方。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“派人去见……请求”理顺希腊语差派加目的从句的结构；“城堡”与“要塞”避免重复，同时保留原文两个相关但不同的军事建筑词。
