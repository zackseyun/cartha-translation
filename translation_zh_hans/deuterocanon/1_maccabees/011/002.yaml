base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
translation:
  language: zh_hans
  text: 他以和平的话语进入叙利亚。各城的人向他开门[a]，并出来迎接他，因为亚历山大王曾下令要迎接他[b]，因他是亚历山大的岳父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“向他打开”，没有明说所打开的是什么；按语境，很可能是指打开城门。
    reason: lexical_alternative
  - marker: b
    text: 意思是：亚历山大曾命令各城的人接待并迎接他；原因是他是亚历山大的岳父。
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐξῆλθεν εἰς Συρίαν
  choice: 出发前往叙利亚
  rationale: ἐξέρχομαι在叙事中表示从原处出去或启程；“出发前往”既保留移动意味，也比生硬的“出去进入叙利亚”更符合现代汉语。
- source_word: λόγοις εἰρηνικοῖς
  choice: 带着和平的言辞
  rationale: 保留λόγοι的具体“言辞”含义，并表达工具或方式意味，指以和平、友善的外交言辞前往，而不简化为仅仅“和平地”。
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: 各城的人
  rationale: 该短语指来自各城的居民或代表；现代汉语用“各城的人”自然、简明，不额外限定其正式身份。
- source_word: ἤνοιγον αὐτῷ
  choice: 都向他敞开门户
  rationale: 希腊文直译为“向他打开”，宾语省略；“敞开门户”传达最可能的城门语境，同时脚注说明原文的省略，以免把推定内容当成明说。
- source_word: συνήντων αὐτῷ
  choice: 出来迎接他
  rationale: 动词表示相会、迎接；结合各城接待来访者的场景，“出来迎接”自然呈现迎候动作。
- source_word: ἐντολὴ ἦν Ἀλεξάνδρου τοῦ βασιλέως συναντᾷν αὐτῷ
  choice: 亚历山大王曾下令要迎接他
  rationale: ἐντολή在王令语境中译为“下令”；汉语保留未明说受令对象的表达，而上下文表明命令涉及各城的人。
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: 因他是亚历山大的岳父
  rationale: πενθερός明确指岳父。为避免现代汉语连续代词造成误解，将物主所指明示为亚历山大，但不增加原文以外的身份名称。
