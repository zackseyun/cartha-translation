  text: But the ambushes rose up from their places and joined battle[a], and all those with Jonathan fled.
translation:
  language: zh_hans
  text: 伏兵[a]从各自的位置起身，投入战斗；跟随约拿单的人全都逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“埋伏（复数）”；这里借指埋伏在那里、随后起身作战的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔνεδρα
  choice: 伏兵
  rationale: 该中性复数名词可指“埋伏”这一安排，也可借指埋伏的人；此处与“起来”和“投入战斗”连用，所指显然是隐蔽待战的人员。“伏兵”自然简洁，同时保留军事语境。
- source_word: ἐξανέστησαν
  choice: 起来
  rationale: 该词在这里描写伏兵从隐蔽位置起身行动。“起来”贴近希腊文，也不额外加入“猛冲”等原文未明说的动作色彩。
- source_word: ἐκ τῶν τόπων ἑαυτῶν
  choice: 从各自的位置
  rationale: τόποι在伏击语境中可指所占据的地点或位置；“各自的位置”准确表达反身代词ἑαυτῶν，并符合现代汉语军事叙述。
- source_word: συνῆψαν πόλεμον
  choice: 投入战斗
  rationale: 这是表示接战、交锋的军事习语；“投入战斗”自然地表达战斗开始或双方接战，而不误译为长期“发动战争”。
- source_word: οἱ παρὰ Ἰωνάθαν
  choice: 约拿单身边的人
  rationale: παρά加人名在此指陪同、跟随或归附约拿单的人。“身边的人”保留这种关系的宽泛性，不强化为所有权意义较强的“约拿单的部下”。
- source_word: πάντες
  choice: 全都
  rationale: 明确保留原文的全称强调，并使“无人留下”的语气在汉语中清楚自然。
