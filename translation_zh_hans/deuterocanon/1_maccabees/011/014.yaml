  text: 当时，亚历山大王在基利家，因为来自那些地方的人[a]正在叛乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些地方的人正在叛乱。”
    reason: 说明可将οἱ ἀπὸ τῶν τόπων ἐκείνων按汉语习惯简化为指那些地方的居民；正文则保留ἀπό所强调的来源关系。
lexical_decisions:
- source_word: Ἀλέξανδρος ὁ βασιλεὺς
  choice: 亚历山大王
  rationale: 采用现代汉语中自然的称号次序，并使用该人名通行的音译。
- source_word: ἦν ἐν Κιλικίᾳ
  choice: 正在基利家
  rationale: ἐν表达地点；“正在”结合上下文体现未完成过去时的持续背景。
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: 那时
  rationale: 这是自然、简洁的现代汉语时间表达；希腊语复数在此不必机械译为“那些时期”。
- source_word: ὅτι
  choice: 因为
  rationale: 按上下文理解为引出亚历山大身在基利家的原因，保留明确的因果关系。
- source_word: ἀπεστάτουν
  choice: 正在叛乱
  rationale: 该动词表示反叛，未完成过去时呈现当时持续进行的情形；“叛乱”不额外限定为变节或脱离某一具体政权。
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: 那些地方的人
  rationale: 以自然汉语表达这一群体性指称，不在正文中生硬重复介词结构；较直译的说法收入脚注。
