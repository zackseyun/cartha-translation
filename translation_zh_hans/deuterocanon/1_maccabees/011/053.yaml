  rationale: 修改首句以直接表达主语说谎，避免不自然且偏离动词施事性的“成了虚假”。相应修订脚注，删除会误解为“向自己说谎”的表述。将“善意”调整为“恩惠”，以较准确地表达本处可受回报的具体施惠；其余句法层次、关系疏离的强度及末句的严厉压迫均予保留。
