base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: zh_hans
  text: 他所说的一切都是谎话[a]；他与约拿单疏远了，没有报答约拿单曾向他施的恩惠，并且严厉地压迫约拿单。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在所说的一切事上都行事诡诈。”希腊语动词可指说谎，也可泛指欺骗性的行事。
    reason: 保留ἐψεύσατο在言语不实与较广义欺骗行为之间的词义幅度。
lexical_decisions:
- source_word: ἐψεύσατο πάντα ὅσα εἶπεν
  choice: 他所说的一切都成了虚假
  rationale: 保留动词既可指言语说谎、又可指所言不实或行事虚假的语义空间；脚注列出更直接的译法。
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: 他与约拿单疏远了
  rationale: 表达关系上的疏离和破裂，不把词义强化为明确的敌对。
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: 没有回报……善意
  rationale: ἀνταποδίδωμι含回报、报答之意；εὔνοια在此可涵盖友好态度及由此产生的恩惠，用“善意”避免过度具体化。
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: 约拿单向他表示的
  rationale: 依据上下文明确关系从句的主语为约拿单；以自然中文表达约拿单先前给予他的善意，同时不生硬重复“回报”。
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: 大大压迫约拿单
  rationale: 政治语境中“压迫”贴合ἔθλιψεν的施压、苦待之意；重复专名以消除连续代词可能造成的歧义。
