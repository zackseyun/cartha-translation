  yaml_path: translation/deuterocanon/1_maccabees/001/045.yaml
  text: and to forbid whole burnt offerings and sacrifices and drink offerings from the sanctuary[a], and to profane Sabbaths and feasts[d][c][b],
translation:
  language: zh_hans
  text: 并禁止在圣所献全燔祭、祭物和奠祭[a]，又亵渎安息日和节期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从圣所”；这里与“禁止”连用，表示把这些祭礼排除在圣所之外，即禁止在圣所举行。
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλῦσαι
  choice: 禁止
  rationale: 此不定式承接上下文中命令的内容，表示官方禁令；“禁止”比“阻止”更准确。
- source_word: ὁλοκαυτώματα
  choice: 全燔祭
  rationale: 该词特指祭物全部焚烧的祭礼；“全燔祭”既保留“全部焚烧”的语义，也符合中文宗教语境。
- source_word: θυσίας
  choice: 祭牲
  rationale: 此处与全燔祭和奠祭并列，指一般献祭所用的祭牲；这样可保留各祭礼类别之间的区别。
- source_word: σπονδὴν
  choice: 奠祭
  rationale: 指倾倒液体作为祭物的礼仪；“奠祭”简洁而准确，也比音译或泛称“献祭”更能保留具体类别。
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: 在圣所献
  rationale: ἐκ与κωλῦσαι连用，表示把这些礼仪排除在圣所范围之外。中文直译为“从圣所禁止”不自然，故按其语用意义译为禁止“在圣所献”，同时在脚注注明原文形式。
- source_word: βεβηλῶσαι
  choice: 亵渎
  rationale: 该动词表示把神圣之物当作凡俗、不圣洁之物；“亵渎”保留其礼仪和宗教力度。
- source_word: σάββατα
  choice: 安息日
  rationale: 希腊文为复数，指安息日的制度及反复守安息日的日子；现代汉语通常用单数形式作总称。
- source_word: ἑορτάς
  choice: 节期
  rationale: 指宗教历法中的节庆日；“节期”比一般性的“节日”更能体现神圣历法语境。
theological_decisions:
- issue: 以色列圣所献祭术语的具体性
  choice: 分别译出“全燔祭、祭牲和奠祭”
  alternative: 笼统译作“祭物”或“敬拜礼仪”
  rationale: 原文逐项列举被禁止的具体圣所礼仪。保留类别差异能呈现对献祭制度的系统性压制，而不加入后来的教义解释。
- issue: ἐκ τοῦ ἁγιάσματος的空间关系
  choice: 正文自然译作“在圣所献”，脚注保留“从圣所排除”的原文意象
  alternative: 正文直译作“从圣所禁止”或“从圣所献”
  rationale: 希腊语介词ἐκ表达这些礼仪被排除出圣所范围；中文若机械保留“从”会产生来源或移动方向的歧义。正文传达实际禁令，脚注保存形式上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全燔祭”“奠祭”“亵渎”“节期”保留礼仪语域；句式承接上下文中的命令清单，因此以“并……又……”呈现。
