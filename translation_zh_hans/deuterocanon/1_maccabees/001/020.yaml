  yaml_path: translation/deuterocanon/1_maccabees/001/020.yaml
  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: zh_hans
  text: 安条克攻打埃及之后，于第一百四十三年返回；他率领大批人马[a]上来攻打以色列和耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“浩大的队伍”或“强大的军队”。希腊文直译为“沉重的人群（或队伍）”。
    reason: 说明ἐν ὄχλῳ βαρεῖ的字面意象，并给出军事语境中可行的替代译法。
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 返回
  rationale: 这里指安条克结束埃及战事后返回；“返回”符合叙事语境，也自然准确。
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: 攻打埃及之后
  rationale: μετὰ τό加不定式表示“……之后”；πατάσσω有“击打、攻打”之意。“攻打”保留军事含义，又不把原文未明说的结果强化为“击败”。
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: 于第一百四十三年
  rationale: 忠实保留原文的纪年表达，不在正文中补入原文未注明的纪元名称。
- source_word: ἀνέβη ἐπὶ
  choice: 上来攻打
  rationale: “上来”保留ἀναβαίνω的方向性表达；军事语境及ἐπί接宾格表明行动具有敌对性质，因此译作“攻打”。
- source_word: Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: 以色列和耶路撒冷
  rationale: 照原文保留两个并列名称，不擅自将“以色列”限定为人民或土地。
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: 带着一支强大的队伍
  rationale: ὄχλος可指人群、队伍或大批人马；在军事语境中，“队伍”自然且不比原文更具体。βαρύς字面为“沉重的”，此处表达规模、分量或力量，故译“强大的”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“攻打埃及”避免过度断定战果；“上来攻打”兼顾希腊文的方向性和敌对语气。脚注标记置于其实际说明的“强大的队伍”之后。
