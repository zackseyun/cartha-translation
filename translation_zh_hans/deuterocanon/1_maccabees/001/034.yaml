  yaml_path: translation/deuterocanon/1_maccabees/001/034.yaml
  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: zh_hans
  text: 他们在那里安置了一个有罪的民族，即不法之徒；他们在其中增强了自己的势力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “增强了自己的势力”直译可作“在其中使自己强盛起来”。希腊语动词未明说所增强的宾语；“其中”在上下文中指那堡垒。
    reason: 保留ἐνίσχυσαν未明示宾语的表达空间，并说明代词在段落语境中的所指，不把动词直接定为“加固防守”。
lexical_decisions:
- source_word: ἔθνος ἁμαρτωλόν
  choice: 一群有罪的外族人
  rationale: ἔθνος在此指被派驻耶路撒冷堡垒的外邦群体；译作“一群……外族人”既保留群体意义，也比抽象的“民族”更符合驻军语境。
- source_word: ἄνδρας παρανόμους
  choice: 无法无天的人
  rationale: παράνομος意为违背律法或不守法律；“无法无天”自然有力，并保留作者的道德谴责。
- source_word: ἐνίσχυσαν
  choice: 巩固了自己的势力
  rationale: 动词在这里表示使己方强盛、稳固；结合堡垒驻防的上下文，译文保留其可兼指军事防御与控制力量的含义。
- source_word: ἐν αὐτῇ
  choice: 在那堡垒里
  rationale: 阴性代词αὐτῇ最自然地回指上一节语境中的堡垒（ἄκρα）；明示所指可避免中文代词含混。
theological_decisions:
- issue: “有罪”与“无法无天”的评价性措辞
  choice: 保留原文直接的道德定性
  alternative: 弱化为“作恶的”“不守规矩的”
  rationale: 这些措辞是叙述者明确的神学及道德评价，不宜在翻译中淡化。
- issue: ἐνίσχυσαν是否明确补出主语反身意义
  choice: 译为“他们……巩固了自己的势力”
  alternative: 译为“他们加固了它”
  rationale: 原文没有宾语，较自然地表示他们在其中壮大或稳固自身；同时以脚注提示其可能兼含加固堡垒之意，不把歧义完全消除。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“外族人”贴合本段外邦驻军的历史语境；末句用“巩固了自己的势力”表达自然，同时以脚注保存希腊语的语义张力。
