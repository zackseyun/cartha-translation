base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: zh_hans
  text: 事情发生在这之后：腓力之子、马其顿人亚历山大从基提之地[a]出来，击败[b]波斯人和玛代人的王大流士，接替他作王；此前他先统治希腊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基提”是传统的圣经地名；按不同语境，它可以特指塞浦路斯，也可以泛指西方地区。
    reason: cultural_note
  - marker: b
    text: 原文直译为“击打”或“击倒”；这里按征战语境译作“击败”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 事情是这样发生的
  rationale: 保留希腊文叙事开篇的程式，同时采用自然、庄重的现代汉语表达。
- source_word: μετὰ τὸ πατάξαι
  choice: 击败……之后
  rationale: μετά加冠词化不定式表示时间先后；πατάσσω本义为击打、击倒，在军事语境中译作“击败”较自然。
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: 腓力之子、马其顿人亚历山大
  rationale: 完整保留父系身份与地域身份，并依汉语习惯调整同位语次序。
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: 从基提之地出来
  rationale: 保留ἐξέρχομαι的方向性，也保留传统圣经地名，不把它直接解释为某一确定地区。
- source_word: Χεττιείμ
  choice: 基提
  rationale: 采用该传统圣经地名的音译，避免将其过早限定为塞浦路斯、马其顿或泛指的西方地区。
- source_word: ἐπάταξεν
  choice: 击败
  rationale: 结合征战语境表达军事胜利；脚注注明原词较为具体、强烈的“击打、击倒”含义。
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: 接替他作王
  rationale: 明确表达亚历山大取代大流士而承继王权，同时保留君王统治的含义。
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: 在这以前，亚历山大已经统治希腊
  rationale: 将πρότερον理解为先前，指出亚历山大在接替大流士以前已经统治希腊；补出主语以免汉语产生歧义。
theological_decisions:
- issue: 地名Χεττιείμ的历史地理所指
  choice: 基提
  alternative: 塞浦路斯、马其顿或西方地区
  rationale: 原文使用传统圣经地名，其范围可随语境变化；正文保留音译，避免把仍有弹性的历史地理指称固定为单一解释。
translation_notes:
  register: 采用现代、清楚而庄重的历史叙事语体。“事情是这样发生的”呼应原文开篇公式；分号区分亚历山大击败大流士并继位与他此前统治希腊这两个时间层次。人名采用现代汉语中通行的“亚历山大、腓力、大流士”，族名译作“波斯人和玛代人”。
