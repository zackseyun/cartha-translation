  yaml_path: translation/deuterocanon/1_maccabees/001/032.yaml
  text: And they took the women and the children captive[a], and they took the livestock as plunder.
translation:
  language: zh_hans
  text: 他们掳走了妇女和孩子，又把牲畜据为己有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们取得了牲畜”或“他们承受了牲畜”。这个希腊动词通常指承受或取得产业；在这里的征服语境中，是指把牲畜占为己有。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: 掳走
  rationale: 该动词指在战争中俘获并带走；“掳走”自然、凝练，并保留强制押往被掳之地的意味。希腊文虽用单数动词，但主语承接上下文中的集体或领军者，中文依语境采用“他们”。
- source_word: τὰς γυναῖκας
  choice: 妇女
  rationale: γυνή 可指“女人”或“妻子”，但此处与孩子并列，泛指受害者群体，译作“妇女”较为准确，不限定为已婚者。
- source_word: τὰ τέκνα
  choice: 孩子
  rationale: τέκνα 泛指儿女或孩子，并不只指男性后代；“孩子”是现代汉语中自然且范围相称的表达。
- source_word: τὰ κτήνη
  choice: 牲畜
  rationale: κτήνη 指作为财产饲养的动物；“牲畜”比“牛群”范围更广，也比“兽类”更符合此处语境。
- source_word: ἐκληρονόμησαν
  choice: 据为己有
  rationale: 该词通常有“承受、取得产业”之义，此处以牲畜为宾语并处于征服语境，表示将其占有。“据为己有”保留取得所有权的词义色彩，同时不把原文未明说的“战利品”直接写入正文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“掳走”体现战争中的强制性；“据为己有”兼顾希腊动词通常的产业继承/占有含义与本节的掠夺语境。脚注标记置于所解释的第二分句之后。
