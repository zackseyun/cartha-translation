    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写信
  rationale: γρά́φω的基本义是“写”。这里虽是君王颁布政策的语境，但原文没有明说“颁布诏令”；译作“写信”既符合原词，也让上下文表达其行政效力。
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: 给全国
  rationale: 该短语指王权统辖的全部疆域，是文书所面向的对象或传达范围。“给全国”在现代汉语中简洁自然，并保留原文所强调的覆盖范围。
- source_word: εἶναι πάντας
  choice: 要所有人合为
  rationale: 不定式结构表达王所写命令的内容。εἶναι本义为“是”，但与εἰς连用在此具有进入统一状态的意味；“合为”自然呈现同化、归并的动态，同时以脚注保留较静态的译法。
- source_word: εἰς λαὸν ἕνα
  choice: 一个民族
  rationale: λαός在此指具有共同政治或族群身份的人民整体。“一个民族”能表达帝国要求各群体归并为同一人民共同体的政策，又不必套用现代民族国家概念。
theological_decisions:
- issue: λαός所表达的政治—族群统一
  choice: 一个民族
  alternative: 一个人民／一个国族
  rationale: 本节讲的是君王推动帝国内部同化，并非论述圣约子民。“一个民族”保留其政治社会含义；不用带有特定教义色彩的措辞，也避免将其明确化为现代民族国家。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王又写信给全国”保留原文“写”的朴素表达，不擅自强化为“颁诏”；“合为一个民族”简洁呈现强制统一的政策，同时由脚注保存“是／成为”的语义张力。
