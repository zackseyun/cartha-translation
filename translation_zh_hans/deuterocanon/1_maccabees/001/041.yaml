  language: zh_hans
  text: 王写信给全国[a]，要求所有人合为一个民族[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给他整个王国”或“传遍他整个王国”。原文强调王所统辖的全部范围都是这道命令的对象或传达范围。
    reason: lexical_alternative
  - marker: b
