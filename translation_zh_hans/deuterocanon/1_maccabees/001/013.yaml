base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/013.yaml
  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: zh_hans
  text: 民众中有些人热切地想要这样做，便去见王；他们获授权柄，可以遵行列国的规例[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”在这里指以色列以外的各民族；“列国的规例”也可译作“外邦人的习俗”。
    reason: 说明 ἐθνῶν 在犹太语境中的所指，并提示 τὰ δικαιώματα 的可行语义替代译法。
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: 热切赞同这事
  rationale: 该动词表达积极的意愿或热切倾向；宾语在希腊文中省略，依上文补出“这事”。“赞同”既自然，也保留主动认同这一层意思。
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: 民众中有些人
  rationale: 表示这个民族或群体中的一部分人；不补入原文没有明说的性别。
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: 去见王
  rationale: 自然表达前往王那里这一动作，同时符合现代汉语叙事语体。
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: 他们获准
  rationale: 希腊文动词为复数“他们给了”，与前面的单数“王”存在数的不协调。采用被动表达，保留许可来自王权一方的意思，同时避免擅自将复数改成单数。
- source_word: ποιῆσαι
  choice: 遵行
  rationale: 与 δικαιώματα 连用时，指实行或遵守既定规例，并非泛指“做”。
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: 列国的规例
  rationale: δικαιώματα 可指条例、规定或制度化惯例；“规例”兼顾规范性与实践性。ἐθνῶν 直译为“列国”，并由脚注说明在此语境中所指。
theological_decisions:
- issue: 犹太语境中 ἐθνῶν 的译法
  choice: 列国
  alternative: 外邦人
  rationale: “列国”较贴近希腊文，并保留其民族与政治层面的宽度；上下文所指为以色列以外各族，可在脚注中说明，而不直接采用较具后期术语色彩的“外邦人”。
- issue: ἔδωκαν 的复数形式与单数“王”的张力
  choice: 改用被动式“他们获准”
  alternative: 王准许他们；他们准许他们
  rationale: 源文明确使用复数动词，但紧接单数“王”。被动表达可传达获得权柄或许可的核心意义，又不无依据地消除原文的数差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王”比“国王”更贴合经文简洁风格；分号保留原句两部分之间的紧密推进关系。
