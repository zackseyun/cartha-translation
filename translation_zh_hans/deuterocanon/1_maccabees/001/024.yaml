  text: And after taking everything[a], he went away to his own land. And they committed murder[b], and spoke great arrogance.
translation:
  language: zh_hans
  text: 他拿走了这一切后，就回到自己的国土。他们犯下谋杀[a]，讲了极其狂妄的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋杀”也可译为“杀戮”“流血”或“屠杀”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“讲了极大的狂妄”，也可译为“讲了极其骄傲的话”或“讲了极其傲慢的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν πάντα
  choice: 拿走了这一切
  rationale: 不定过去时分词表示先于主句发生的动作；“拿走了”自然体现夺取后带走之意，“这一切”保留 πάντα 的总括性，并承接上下文所述财物。
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: 就回到自己的国土
  rationale: ἀπῆλθεν 表示离去，结合目的地是“他自己的国土”，现代汉语用“回到”自然表达返回本国；γῆ 在此指国家或疆土。
- source_word: ἐποίησαν φονοκτονίαν
  choice: 他们大行杀戮
  rationale: ποιεῖν 与表示杀人的名词连用，表达实施杀戮；“大行杀戮”保留强烈的道德谴责，也能涵盖谋杀、流血和屠杀的语义范围。
- source_word: ἐλάλησαν ὑπερηφανίαν μεγάλην
  choice: 口出极其狂妄的话
  rationale: 原文直译为“说出极大的狂妄”，是动词加名词宾语的结构；此译以自然现代汉语传达狂傲言语，同时保留 μεγάλην 的加强作用。
theological_decisions:
- issue: φονοκτονίαν 的道德力度与范围
  choice: 杀戮
  alternative: 谋杀；流血；屠杀
  rationale: 该词明确带有恶意杀人的负面评价。“杀戮”在中文中保持强烈谴责，又不像“谋杀”那样可能被理解为仅指个别、预谋的非法杀人，也不把场景限定为大规模“屠杀”。
- issue: 叙事主语由单数转为复数
  choice: 保留“他……他们……”的转换
  alternative: 将后一句统一译作“他……”或明确补出“他的军队……”
  rationale: 希腊文先用单数 ἀπῆλθεν，随后用复数 ἐποίησαν、ἐλάλησαν。译文不擅自消除这一转换，也不补入原文未明说的复数主体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拿走了这一切”“回到自己的国土”清楚易懂；“大行杀戮”“口出极其狂妄的话”保持叙事的强烈道德语气。保留原文从单数“他”突转复数“他们”的现象，不以解释性增补消除歧义。
