  text: And he took the plunder of the city and burned it with fire, and he tore down its houses and its walls all around.
translation:
  language: zh_hans
  text: 他夺走了城里的战利品，放火焚烧了城，又拆毁了城中的房屋和四周的城墙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: 夺走了
  rationale: λαμβάνω在掠城语境中表示取走、夺取；“夺走”自然地体现军事劫掠，却不额外说明具体方式。
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: 城里的战利品
  rationale: σκῦλα指战争或劫掠所得之物；属格τῆς πόλεως在此说明战利品来自该城。“城里的战利品”符合现代汉语表达，并保留其军事含义。
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: 放火焚烧了城
  rationale: ἐμπυρίζω表示焚烧、付之一炬，πυρί明确指出以火为手段。“放火焚烧”保留原文对火的强调，同时比“用火焚烧”更自然。
- source_word: καθεῖλεν
  choice: 拆毁了
  rationale: καθαιρέω在此表示强行拆除、毁坏建筑物；“拆毁”既贴近原义，也适合房屋和城墙两个宾语。
- source_word: τοὺς οἴκους αὐτῆς
  choice: 城中的房屋
  rationale: οἶκοι在此指城内实体建筑。“房屋”直接准确；将代词具体化为“城中”可避免现代汉语中连续使用“它的”造成生硬。
- source_word: τὰ τείχη αὐτῆς κύκλῳ
  choice: 四周的城墙
  rationale: τείχη指防御性的城墙，κύκλῳ表示环绕周围。“四周的城墙”自然表达城墙环绕全城的范围，并未过度断定每一段均被彻底夷平。
