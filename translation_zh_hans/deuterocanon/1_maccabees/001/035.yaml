base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/035.yaml
  text: And they stored up weapons and provisions[a], and after gathering the spoils of Jerusalem they deposited them there, and it became a great snare,
translation:
  language: zh_hans
  text: 他们储备了武器和粮食；收集了耶路撒冷的战利品[a]后，便将这些战利品存放在那里。那里便成了一个巨大的网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从耶路撒冷掠来的战利品”。
    reason: 希腊语属格可简洁地表示关联或来源；此处按来源理解很自然，但正文保留较含蓄的属格表达。
lexical_decisions:
- source_word: παρέθεντο
  choice: 储备了
  rationale: 结合军事据点的语境，此词表示有意将物资存放备用；“储备”比泛泛的“放置”更准确自然。
- source_word: ὅπλα
  choice: 武器
  rationale: 该词可指兵器或军械；“武器”是现代汉语中清楚而宽泛的表达。
- source_word: τροφήν
  choice: 粮食
  rationale: 本义为食物、养料；在守军储备的语境中，“粮食”自然地表达供给驻军的食物。
- source_word: συναγαγόντες
  choice: 又收集
  rationale: 分词所指行动先于ἀπέθεντο；汉语以“收集……存放”自然呈现先后关系。
- source_word: τὰ σκῦλα
  choice: 战利品
  rationale: 指以武力夺取的物品；“战利品”准确、庄重，也符合军事语境。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷的
  rationale: 保留希腊语属格在归属与来源之间的简洁表达；脚注说明明确作来源理解的译法。
- source_word: ἀπέθεντο
  choice: 存放
  rationale: 表示把收集来的战利品置于该处保存；与前面的“储备”有所区分，同时保留储藏之意。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 指回上文所述的设防地点，使用普通而明确的方位表达。
- source_word: μεγάλην παγίδα
  choice: 一个巨大的网罗
  rationale: “网罗”保留陷阱的比喻性和经文的庄重语体，不擅自说明受害者是谁。
theological_decisions:
- issue: μεγάλην παγίδα的比喻力度与对象
  choice: 它便成了一个巨大的网罗
  alternative: 它便成了一个巨大的陷阱
  rationale: “网罗”保留原文形象、险恶意味及其开放性；不把未明说的受害对象补入正文。
- issue: ἐγένετο的隐含主语
  choice: 以“它”承接上文的设防地点
  alternative: 那里便成了一个巨大的网罗
  rationale: 希腊文未重述主语，语境指向上文的据点；“它”既符合现代汉语，也避免把比喻仅限缩为地理位置。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“粮食”比“给养”更通俗；“网罗”保留圣经叙事中的比喻色彩。正文中的[a]与脚注对应。
