  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: zh_hans
  text: 以色列中有许多人赞同他的宗教礼仪[a]，向偶像献祭，并亵渎了安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“乐意接受他的宗教礼仪”或“以他的宗教礼仪为乐”。
    reason: 保留ηὐδόκησαν可表示赞同、乐意接受或喜悦，以及λατρεία所指宗教敬拜／礼仪实践的语义幅度。
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: 以色列中有许多人
  rationale: ἀπό与群体名称连用，表示来自该群体或属于其中；译文自然表达“以色列人中间有许多人”，同时贴近原文结构。
- source_word: ηὐδόκησαν
  choice: 认同
  rationale: 该动词可表示喜悦、赞同或认可；此处强调他们自愿接受王所推行的宗教礼仪。“认同”不夸大为情感上的喜爱，也保留主动赞同之意。
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: 他的敬拜方式
  rationale: λατρεία在此指宗教礼仪、崇拜或事奉体系。单译“他的敬拜”在中文里可能误解为“对他的敬拜”或“他所作的敬拜”，加“方式”可自然表示他所推行的宗教礼仪，但不把它技术化为“祭仪体系”。
- source_word: ἔθυσαν
  choice: 献祭
  rationale: 直接表达宗教性的祭献行动，简洁且符合上下文。
- source_word: τοῖς εἰδώλοις
  choice: 向偶像
  rationale: εἴδωλον在此明确指受祭拜的偶像；“向偶像献祭”是现代中文自然且准确的表达。
- source_word: ἐβεβήλωσαν
  choice: 亵渎了
  rationale: 该词表示使神圣之物沦为凡俗、加以亵渎；“亵渎”准确传达对圣日的宗教性侵犯。
- source_word: τὸ σάββατον
  choice: 安息日
  rationale: 这是犹太宗教语境中σάββατον的标准现代中文译法。
theological_decisions:
- issue: 异教王权语境中λατρεία的译法
  choice: 他的敬拜方式
  alternative: 他的礼仪；他的宗教礼仪；他的崇拜
  rationale: 上下文所指是王所推行的宗教崇拜或礼仪。“敬拜方式”保持宗教含义和所属关系，又避免“崇拜他”这一并非由本句语法必然表达的解读。
- issue: ηὐδόκησαν所表达的态度
  choice: 认同
  alternative: 喜欢；乐意接受；赞同
  rationale: 原词兼有喜悦和赞同的语义范围。本句至少表明自愿认可，但是否强调情感上的喜悦并不确定，因此正文采用中性的“认同”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“认同他的敬拜方式”比生硬的“赞同他的崇拜”更符合现代汉语，也避免误读为王本人是敬拜对象。三个并列动作以逗号连接，保持希腊文的推进节奏。
