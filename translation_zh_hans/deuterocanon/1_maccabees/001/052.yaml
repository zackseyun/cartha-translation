  text: And many from the people gathered to them, everyone who was abandoning the law; and they did evil in the land,
translation:
  language: zh_hans
  text: 民中有许多人聚集到他们那里；他们都是正在离弃律法的人，并且在这地作恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: 聚集到他们那里
  rationale: 保留被动形式所表达的聚集行动，并以自然汉语呈现方向性的πρός。
- source_word: πᾶς ὁ ἐγκαταλείπων τὸν νόμον
  choice: 都是正在离弃律法的人
  rationale: ἐγκαταλείπων为现在分词，强调当时持续或正在发生的离弃行为；“律法”保留其犹太宗教与盟约语境。
- source_word: ἐποίησαν κακὰ
  choice: 行了恶事
  rationale: 直译其复数概括表达，不把所行之恶具体化。
- source_word: ἐν τῇ γῇ
  choice: 在这地
  rationale: γῆ在此指叙事中的当地国土；“这地”比抽象的“土地上”更符合现代汉语叙事。
theological_decisions:
- issue: “律法”的所指与语气
  choice: 律法
  alternative: 法律／摩西律法
  rationale: 原文仅有τὸν νόμον；译作“律法”既保留其宗教语境，也不擅自补明为“摩西律法”。
- issue: 现在分词所表达的过程性
  choice: 正在离弃
  alternative: 离弃了／背弃
  rationale: 保留ἐγκαταλείπων的未完成、进行性意味，避免把这些人的状态只表述为一次已经完成的行动。
translation_notes:
