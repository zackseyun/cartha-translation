  text: And on the doorways of the houses and in the streets they burned incense[a][b].
translation:
  language: zh_hans
  text: 他们在各家的门口和街道上烧香[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献香。”希腊文动词既可指烧香，也可指把香作为礼仪性的祭献。
    reason: lexical_alternative
  - marker: b
    text: “街道”也可理解为“宽阔的街道”或“公共广场”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδων
  choice: 门口
  rationale: θυρίς在此可指门、开口或出入口；“门口”自然表达房屋的入口位置，又不具体限定为门框或门柱。
- source_word: οἰκιῶν
  choice: 各家
  rationale: οἰκία指房屋或家；在复数属格结构中译作“各家”符合现代汉语习惯，也清楚保留多处住宅的含义。
- source_word: πλατείαις
  choice: 街道
  rationale: πλατεῖα可指宽阔街道或公共广场；正文采用涵盖面较广且自然的“街道”，并以脚注保留“广场”的可能。
- source_word: ἐθυμίων
  choice: 烧香
  rationale: θυμιάω可指焚烧香料，也可强调以香作祭献；“烧香”简洁自然，且在本语境中能够传达礼仪行为，脚注另列“献香”。
- source_word: ἐπὶ ... καὶ ἐν
  choice: 在……门口和街道上
  rationale: 希腊文以ἐπί连接房屋入口、以ἐν连接街道。汉语按各地点的自然搭配译为“在门口”和“街道上”，保持两个地点的区别而避免生硬直译。
