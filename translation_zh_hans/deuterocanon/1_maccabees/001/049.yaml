  text: so that they might forget the law and alter all the ordinances.
translation:
  language: zh_hans
  text: 使他们忘记律法，更改一切律例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαθέσθαι
  choice: 忘记
  rationale: 准确表达不定式所指的“忘却”；与ὥστε连用，在此承接前文所述措施造成或意图造成的结果。
- source_word: νόμου
  choice: 律法
  rationale: 在犹太经文语境中指上帝所赐的律法；“律法”既准确又符合现代中文圣经用语。
- source_word: ἀλλάξαι
  choice: 更改
  rationale: 保留“改变、改动”的直接含义，不擅自强化为“废除”或“取代”。
- source_word: δικαιώματα
  choice: 律例
  rationale: 此处指律法中具有约束力的各项规条；“律例”庄重、简明，并能与较广义的“律法”区分。
theological_decisions:
- issue: ὥστε所表达的是目的还是结果
  choice: 用“使”保留目的与结果之间的张力
  alternative: 译作“以致”或“为要”
  rationale: ὥστε加不定式可表达预期或实际结果，语境中也带有统治者的意图；“使”自然承接前文，同时不把含义限定为纯目的或纯结果。
- issue: “更改一切律例”的力度
  choice: 按原文直译为“更改一切律例”
  alternative: 译作“废除一切律例”
  rationale: ἀλλάσσω意为改变或更改；译成“废除”会加入原文未明确表达的彻底取消之意。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“律法”和“律例”保留经文语域，但普通读者仍易理解；句式紧凑，与原文结构相称。
