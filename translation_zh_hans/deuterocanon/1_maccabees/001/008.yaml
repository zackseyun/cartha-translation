  text: And his sons became strong[a], each in his own place;
translation:
  language: zh_hans
  text: 他的儿子们取得了权势，各自在自己的地方[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地方”也可译作“地区”或“领地”；这里可能指每个儿子所控制的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: 掌了权
  rationale: 该动词可表示占优势、取得支配地位。结合亚历山大死后继承者分别控制各地的语境，“掌了权”自然表达他们取得实际权力，同时不补出原文未明说的统治对象。
- source_word: οἱ παῖδες αὐτοῦ
  choice: 他的众子
  rationale: παῖδες虽可指孩子或仆人，但此处是王朝继承的历史语境，所指为他的儿子们；“众子”简洁而庄重。
- source_word: ἕκαστος
  choice: 各自
  rationale: 保留逐一分配的含义，并与后面的属己表达自然衔接。
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: 在自己的地方
  rationale: τόπος直译为“地方”。此处很可能指各人控制的区域，但正文保留原文较宽泛的措辞，并用脚注说明语境中的可能含义。
