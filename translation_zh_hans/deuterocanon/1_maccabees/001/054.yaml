  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
translation:
  language: zh_hans
  text: 基斯流月十五日，第一百四十五年[a]，他们在祭坛上筑起了“荒凉的可憎之物”[b]；又在犹大各城，他们也筑起祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第一百四十五年”采用塞琉古纪元计算。希腊文本在本节的年份表达中省略了上下文可知的“第一百”。
    reason: cultural_note
  - marker: b
    text: 也可译作“使地荒凉的可憎之物”或“带来荒凉的可憎之物”。希腊文短语十分紧凑，既可视为一个固定称谓，也可视为描述其造成荒凉的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ Χασελεὺ
  choice: 基斯流月十五日
  rationale: 按现代汉语日期次序表达；“基斯流”音译希腊文所载的犹太月份名称 Χασελεὺ。
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: 第一百四十五年
  rationale: 结合本书纪年语境，理解为塞琉古纪元第一百四十五年；希腊文本在此省略了上下文可知的“第一百”。
- source_word: ᾠκοδόμησαν
  choice: 筑起
  rationale: 保留“建造”的基本意义，也适合祭祀设施；前后两处均译为“筑起”，体现原文动词的重复。
- source_word: βδέλυγμα ἐρημώσεως
  choice: 荒凉的可憎之物
  rationale: 采用紧凑而较形式对应的表达，保留属格结构可能表示性质、结果或作用的含混性，并维持其经文互文色彩。
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: 在祭坛上
  rationale: ἐπί 加宾格在这里表示置于祭坛之上；现代汉语用“在……上”自然清楚。
- source_word: ἐν πόλεσιν Ἰούδα κύκλῳ
  choice: 在犹大各城到处
  rationale: 表达这些设施遍布犹大境内各城；避免译成“犹大周围的城市”，以免误解为犹大境外。
- source_word: βωμούς
  choice: 祭坛
  rationale: βωμός 指坛或祭坛；此处语境是异教祭祀设施，译作“祭坛”准确且不额外引入“丘坛”或“神龛”等概念。
theological_decisions:
- issue: βδέλυγμα ἐρημώσεως 的经文互文意义及语法关系
  choice: 荒凉的可憎之物
  alternative: 使地荒凉的可憎之物；那行毁坏可憎的
  rationale: 正文保留希腊短语的紧凑和神学张力，不把属格关系限定为纯粹的因果关系，也不直接套用可能使现代读者误以为指人的传统措辞；脚注列出因果性理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。日期按汉语习惯排列；保留两个“筑起”以反映原文重复。引号标明“荒凉的可憎之物”是具有特殊经文色彩的称谓，但由脚注保留其描述性解释的可能。
