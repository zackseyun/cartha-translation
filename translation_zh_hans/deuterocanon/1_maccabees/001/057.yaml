base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: zh_hans
  text: 无论在谁那里发现一卷盟约之书[a]，或有人赞同律法[b]，就按王的谕令将那人处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盟约之书”直译为“约的书”；也可译为“盟约文书”或“记载律法之约的书卷”。
    reason: lexical_alternative
  - marker: b
    text: “赞同律法”可指认同、拥护或忠于犹太人的律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: 无论……那里
  rationale: 表达不定关系和遍及各处的执法语气，比单纯的“哪里”更符合上下文。
- source_word: εὑρίσκετο
  choice: 发现了
  rationale: 该未完成时被动形式在此表示反复发生的查获情形；汉语用“发现了”自然简洁。
- source_word: παρὰ τινι
  choice: 在谁那里
  rationale: 表示某人持有或保管，保留原文较宽泛的关系，不限定为法律意义上的所有权。
- source_word: βιβλίον διαθήκης
  choice: 约书
  rationale: διαθήκη在此指“约”，βιβλίον指书卷或文书；“约书”简练且保留经文措辞的庄重感，具体范围留下注说明。
- source_word: συνευδόκει
  choice: 赞同
  rationale: 表示认可、赞成并站在律法一边；“赞同”既自然，又不把含义过度收窄为公开遵守。
- source_word: τῷ νόμῳ
  choice: 律法
  rationale: 上下文特指犹太祖传律法；“律法”是现代中文圣经语境中清楚而不过度扩写的对应词。
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: 王的谕令
  rationale: 指王正式作出的具有刑罚效力的决定或命令；“谕令”符合君王政令的庄重语域。
- source_word: ἐθάνατου αὐτόν
  choice: 将他处死
  rationale: 体现按王令施行死刑，比“杀死”更有司法和官方处置的色彩，同时不额外规定具体行刑方式。
theological_decisions:
- issue: τῷ νόμῳ所指的律法
  choice: 译作“律法”，由上下文表明是犹太人的祖传律法
  alternative: 明译为“摩西律法”或泛译为“法律”
  rationale: 上下文清楚指向犹太律法，但原文没有“摩西”一词；保留“律法”既传达特定语境，也避免增添原文未明说的限定。
- issue: συνευδόκει所表达的认同程度
  choice: 译作“赞同”，脚注说明可含拥护或忠于之意
  alternative: 译作“遵守”或“忠于”
  rationale: 原词主要表达赞同、认可或同意，不宜直接缩窄成行为层面的“遵守”；同时在迫害语境中，这种赞同可能意味着立场上的忠诚，故以脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“无论……或……”保留两个可分别导致处死的条件；“谕令”“处死”体现官方迫害的司法色彩。所有脚注标记均已置于正文相应位置。
