  terminology: “律法”适切保留了 νόμος 在此处指犹太律法的语境，且没有擅加“摩西”等原文未明说的限定。“盟约之书”比“约书”更透明，既保留 διαθήκη 的盟约含义，也维持经文的庄重语体。
