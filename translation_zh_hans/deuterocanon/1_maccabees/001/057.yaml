revisions:
- from: 无论在谁那里发现了约书[a]，或有人赞同律法[b]，王的谕令就将他处死。
  to: 无论在谁那里发现一卷盟约之书[a]，或有人赞同律法[b]，就按王的谕令将那人处死。
  rationale: 修改“约书”为“盟约之书”，使 βιβλίον διαθήκης 的字面含义及其经文语域对现代中文读者更清楚；同时将末句调整为自然的汉语执行式，保留原文中王的正式判令导致死刑的含义。保留“或”以对应希腊文的析取结构，也保留“律法”而不作超出原文的限定。
