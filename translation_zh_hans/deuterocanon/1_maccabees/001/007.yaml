lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: 作王
  rationale: 这是 βασιλεύω 的简单过去时，表示行使王权。在历史叙事中，“作王”简洁自然，也比泛指性的“统治”更明确保留君王身份。
- source_word: ἔτη δώδεκα
  choice: 十二年
  rationale: 宾格表示持续时间；汉语在“作王”后直接接时段即可自然表达“在位十二年”的意思，同时贴近原文结构。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: ἀποθνῄσκω 在此直陈死亡事实；“死了”朴素直接，不采用原文没有的委婉说法。
- source_word: καὶ ... καὶ
  choice: ……，就……
  rationale: 两个 καί 顺接历史事件。现代汉语不宜机械重复“并且”；用逗号和“就”保持简洁的并列推进，并自然呈现先后次序，不额外加入因果含义。
- source_word: Ἀλέξανδρος
  choice: 亚历山大
  rationale: 采用现代汉语中该人名的通行译名。
