base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/044.yaml
  text: And the king sent letters by the hand of messengers to Jerusalem and the cities of Judah[a], that they should follow laws foreign to the land,
translation:
  language: zh_hans
  text: 王差遣使者，把文书送往耶路撒冷和犹大的各城，命令他们遵行与这地不同的律例[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例”也可译作“习俗”。希腊语νόμιμα既可指法律、规章，也可指约定俗成的做法。
    reason: 保留原词在正式律令与传统习俗之间的词义幅度。
lexical_decisions:
- source_word: βιβλία
  choice: 文书
  rationale: 在王命传达的行政语境中，指送交各地的书面文件或谕令，并非现代意义上的“书籍”；“文书”既保留其一般性，也符合正式语体。
- source_word: ἐν χειρὶ ἀγγέλων
  choice: 差遣使者，将……送到
  rationale: ἐν χειρί在这里表示经手传递或施事方式。中文不必逐字译作“在使者手中”，用“差遣使者，将……送到”自然表达使者负责递送。
- source_word: προπορεύθηναι ὀπίσω
  choice: 遵行
  rationale: 该短语字面有“跟随、随从”之意；其宾语是规范性律例，译作“遵行”能自然表达奉命采纳并实行这些规范。
- source_word: νομίμων
  choice: 律例
  rationale: νόμιμα既可指法律、规章，也可指约定俗成的习俗或惯例。“律例”体现王命语境中的规范与约束力，同时脚注保留“习俗”的可能含义。
- source_word: ἀλλοτρίων τῆς γῆς
  choice: 与这地相异的
  rationale: ἀλλότριος表示属于别处、非本地或与本地不同；“与这地相异”保留原文以“这地”为参照的表达，避免擅自明确为某一民族或地区。
theological_decisions:
- issue: 迫害语境中νομίμων的范围
  choice: 律例
  alternative: 习俗
  rationale: 这里涉及君王以正式文书推行非本地的宗教与社会规范。“律例”传达其官方约束力，但不排除该词也涵盖传统习俗，因此在脚注中注明另一译法。
- issue: 不定式短语的命令语气
  choice: 命令他们遵行
  alternative: 让他们跟随
  rationale: 原文以不定式说明文书的目的或内容，置于王所发文书的语境中具有指令性；中文补出“命令他们”使句法清楚，却不进一步说明具体执行者的身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“文书”保留行政语境而不过度具体化为“诏书”；“与这地相异”贴近原文，也避免把“这地”擅自解释为“犹大”或“他们的国土”。句末逗号保留本节与下文命令内容相连的结构。
