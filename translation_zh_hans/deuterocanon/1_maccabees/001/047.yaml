  text: to build altars and shrines and idols[a], and to sacrifice swine and unclean animals,
translation:
  language: zh_hans
  text: 建造祭坛和庙宇，制作偶像，并献祭猪和不洁净的牲畜[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“普通的牲畜”或“凡俗的牲畜”。希腊语形容词可有“普通、凡俗”之意；但在这里的犹太洁净礼仪语境中，很可能指礼仪上“不洁净的”。
    reason: 保留κοινά的词面义，同时说明正文按犹太礼仪语境所采用的含义。
lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: 建造
  rationale: 不定式表示所命令的行动；“建造”自然涵盖后接的祭坛、神庙和偶像。
- source_word: βωμούς
  choice: 祭坛
  rationale: βωμός通常指献祭用的坛；“祭坛”直接而符合礼仪语境。
- source_word: τεμένη
  choice: 神庙
  rationale: τέμενος可指划分出来的圣地、圣域或神祠；此处与异教祭坛及偶像并列，“神庙”简明易懂，同时保留异教崇拜场所的含义。
- source_word: εἴδωλα
  choice: 偶像
  rationale: 在犹太教反偶像崇拜的语境中，此词不是中性的“像”，而是供崇拜的偶像。
- source_word: θύειν
  choice: 献上
  rationale: θύω在此指把动物作为祭牲献祭；与“猪和……牲畜”搭配时，“献上”自然，并由上下文明确其献祭含义。
- source_word: ὕεια
  choice: 猪
  rationale: 指猪类；现代汉语用“猪”清楚自然，无须采用较文言的“豕”。
- source_word: κτῆνη κοινά
  choice: 不洁净的牲畜
  rationale: κτῆνη指牲畜或走兽；κοινά字面可指“凡俗的”，但在希腊化时期犹太洁净语境中常表示礼仪上不洁净。正文采用语境义，脚注保留直译可能。
theological_decisions:
- issue: 犹太洁净语境中κοινά的译法
  choice: 不洁净的牲畜
  alternative: 凡俗的牲畜（或普通的牲畜）
  rationale: κοινός本义为“共同的、普通的、凡俗的”，但在犹太礼仪用语中可指因不合洁净规范而“不洁净”。本节列举强迫犹太人违背律法的崇拜行为，因此正文采用“不洁净”，同时以脚注保存词面的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句子承接上下文的命令清单，因此保留不定式式列举的简洁节奏；“神庙”避免“圣所”可能带来的正面或以色列敬拜联想。
