  text: And after these things he fell upon his bed[a], and knew that he was dying.
translation:
  language: zh_hans
  text: 这些事以后，他倒在床上[a]，知道自己快要死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“倒向床上”；按意思也可译为“卧病在床”。希腊原文保留了较具体的动作表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 这事以后
  rationale: 作为时间承接语，既保留“这些事之后”的先后关系，又比逐字译法更符合现代汉语叙事习惯。
- source_word: ἔπεσεν
  choice: 倒
  rationale: 保留动词“落下、倒下”的具体形象；不译作“躺下”，以免把原文较强的动作弱化，也不译作“昏倒”，以免加入原文没有明说的含义。
- source_word: ἐπὶ τὴν κοίτην
  choice: 在床上
  rationale: κοίτη在此指床榻；与“倒”连用时，“倒在床上”自然且贴近原文的具象表达。原文没有所有格，因此正文不增译“他的”。
- source_word: ἔγνω
  choice: 知道
  rationale: 直接对应γινώσκω，保留陈述的简洁和庄重；“意识到”也可成立，但解释性略强。
- source_word: ἀποθνήσκει
  choice: 自己快要死了
  rationale: 在ἔγνω引出的间接陈述中，希腊语现在时可表示死亡正在逼近。现代汉语用“快要死了”自然传达临终语境，同时避免生硬的“正在死亡”。补出“自己”以明确主语同指。
