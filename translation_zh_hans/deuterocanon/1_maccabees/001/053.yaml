  text: And they drove Israel into hiding[a], into every refuge they had.
translation:
  language: zh_hans
  text: 他们使以色列人藏匿在他们各处的避难所中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把以色列安置在隐蔽之处，在他们各处的避难所中。”希腊文措辞十分简练；“他们的”可指属于或供以色列人使用的避难所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: 使……藏身
  rationale: τίθημι的不定过去时中间语态在这里表示使以色列处于某种境地；译作“使……藏身”既保留使动意味，也避免用“赶入”过度强化原文未明说的暴力程度。
- source_word: τὸν Ἰσραήλ
  choice: 以色列人
  rationale: 带冠词的单数“以色列”在此为集合用法，指以色列民；汉语译作“以色列人”自然清楚。
- source_word: ἐν κρυφίοις
  choice: 藏身
  rationale: 该复数中性形容词名词化，可指隐蔽之处；结合ἔθεντο，译作“藏身”自然表达进入隐蔽状态，同时以脚注保留较形式对应的译法。
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: 在各处避难之所
  rationale: φυγαδευτήριον指逃亡者躲避或避难的地方；“避难之所”准确而庄重，παντί在集合语境中译作“各处”。
- source_word: αὐτῶν
  choice: 其所有关系含于语境
  rationale: 代词可能表示这些避难处是他们的或供他们使用；汉语正文不硬加“他们所有的”，以免产生所有权意味，脚注保留较直译表达。
