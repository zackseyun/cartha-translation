  yaml_path: translation/deuterocanon/1_maccabees/001/014.yaml
  text: And they built a gymnasium in Jerusalem according to the customs of the nations[a].
translation:
  language: zh_hans
  text: 他们在耶路撒冷按照外邦人的习俗建了一座体育馆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“外族人”。希腊原文直译为“各族”，在犹太人的表达中通常指非犹太民族。“体育馆”指希腊化城市中兼具体育训练、教育和公共活动功能的机构，并非现代普通体育馆。
    reason: 说明ἐθνῶν在本语境中的词义及γυμνάσιον的历史文化含义；将原文未明说的“希腊式”限定保留在说明中，而不增入正文。
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: 建了
  rationale: 该不定过去时动词直接表示建造；“建了”自然简洁，并保留具体行动。
- source_word: γυμνάσιον
  choice: 希腊式体育馆
  rationale: 此词指希腊化社会中特定的体育、教育和公共机构，并非现代意义上单纯的健身房；加“希腊式”有助于普通读者识别其历史文化性质。
- source_word: ἐν Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: 按地点含义作现代汉语中自然的表达。
- source_word: κατὰ
  choice: 按照
  rationale: κατά加宾格在此表示依照某种规范或模式；“按照”准确自然。
- source_word: τὰ νόμιμα
  choice: 规矩
  rationale: 这里指群体通行的习俗、规范和制度，而不只限于成文法律；“规矩”能较自然地涵盖这些含义。
- source_word: τῶν ἐθνῶν
  choice: 外族人的
  rationale: 在犹太叙事语境中指犹太民族以外的各族；“外族人”比字面的“列国”更符合现代汉语，又不加入“异教徒”所带的额外宗教贬义。
theological_decisions:
- issue: 犹太对比语境中ἐθνῶν的译法
  choice: 外族人的
  alternative: 列国的；外邦人的；异教徒的
  rationale: “外族人”保留犹太人与非犹太各族之间的对比，也避免把原文未明说的贬义或纯宗教分类强加进去；脚注说明传统译法“外邦人”。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。语序调整为“按照……在……建了”，符合现代汉语节奏；“希腊式体育馆”兼顾历史专名的文化特征与普通读者的可理解性。
