  yaml_path: translation/deuterocanon/1_maccabees/001/023.yaml
  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
translation:
  language: zh_hans
  text: 他拿走了金银和那些贵重的器皿[a]，又拿走了他所找到的隐藏宝物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贵重的”直译可作“令人向往的”或“可喜爱的”。
    reason: lexical_alternative
  - marker: b
    text: “隐藏宝物”也可理解为“秘密宝库”；希腊语既可指隐藏的财宝，也可指隐秘的藏宝处。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἔλαβεν
  choice: 拿走了
  rationale: λαμβάνω本义为“拿、取”；在掠夺财物的语境中，“拿走”自然准确，又不像“抢走”那样额外强化暴力色彩。原文两次使用该动词，译文以“拿走了……又拿走了”保留重复。
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: 金银
  rationale: 分别指特定的银和金；汉语习惯合称“金银”，既简洁自然，也保留具体财物之意。
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: 那些贵重的器皿
  rationale: σκεύη在圣殿财物的语境中宜译为“器皿”；ἐπιθυμητά字面指“令人向往的、可喜爱的”，此处用“贵重的”表达这些器皿受珍视的语境含义，并以脚注保留字面可能。
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: 隐藏宝物
  rationale: ἀποκρύφους意为“隐藏的、隐秘的”；θησαυρούς既可指宝物，也可指藏宝之处。正文采用自然的“隐藏宝物”，脚注保留“秘密宝库”的结构性歧义。
- source_word: οὓς εὗρεν
  choice: 他所找到的
  rationale: 直接对应关系从句，清楚表达这些隐藏宝物是他找到的。
theological_decisions: []
