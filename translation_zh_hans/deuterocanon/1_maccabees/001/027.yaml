  text: Every bridegroom took up lamentation[a]; she who sat in the bridal chamber became one in mourning.
translation:
  language: zh_hans
  text: 每个新郎都发出哀叹[a]；那坐在洞房里的女子陷入了哀恸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每个新郎都哀哭；那坐在洞房里的女子在哀恸中。”希腊原文采用凝练的诗性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς νυμφίος
  choice: 每个新郎
  rationale: πᾶς 与单数名词连用，表示逐一涵盖；“每个新郎”自然地保留其分配意义和婚礼语境。
- source_word: ἀνέλαβε θρῆνον
  choice: 唱起哀歌
  rationale: ἀναλαμβάνω 与 θρῆνος 构成凝练的诗性说法，指开始或发出哀歌；“唱起”既表达状态的开始，也保留哀歌可能被吟唱的意象。
- source_word: καθημένη
  choice: 那坐着的女子
  rationale: 希腊文为阴性分词，主语没有明说；译文保留女性指称而不径直补作“新娘”，避免消除原文的含蓄。
- source_word: ἐν παστῷ
  choice: 在洞房里
  rationale: παστός 在此指婚房或洞房；“洞房”是现代汉语中清楚、庄重且符合婚礼场景的表达。
- source_word: ἐγένετο ἐν πένθει
  choice: 也陷入了哀恸
  rationale: ἐγένετο 表明进入一种新的状态，而 πένθος 指哀恸、服丧般的悲痛；“陷入了哀恸”比单说“哀恸”更能体现状态的转变。
