  text: And they poured out innocent blood around the sanctuary, and they defiled the sanctuary.
translation:
  language: zh_hans
  text: 他们在圣所周围倾流了无辜人的血，玷污了圣所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: 流了
  rationale: 该动词本义为“倾倒、流出”；与“血”连用时，现代汉语自然表达为“流了……的血”，既准确又保留鲜明意象。
- source_word: αἷμα ἀθῷον
  choice: 无辜人的血
  rationale: 希腊语直译为“无辜的血”，实际指无辜者被杀流血；译作“无辜人的血”在现代汉语中含义清楚，也保留圣经用语的庄重感。
- source_word: κύκλῳ τοῦ ἁγιάσματος
  choice: 在圣所周围
  rationale: κύκλῳ表示环绕某处的位置；“在圣所周围”简洁自然，不额外限定具体范围。
- source_word: ἁγίασμα
  choice: 圣所
  rationale: 此处指神圣的敬拜场所或区域，而非抽象的“圣洁”；“圣所”能体现礼仪语境，又不过度具体化为整座圣殿或某一内室。
- source_word: ἐμόλυναν
  choice: 玷污了
  rationale: 该词表达礼仪及道德意义上的污秽与亵渎；“玷污”比一般的“弄脏”更能传达其宗教分量。
theological_decisions:
- issue: ἁγίασμα的礼仪含义
  choice: 圣所
  alternative: 圣地；圣殿圣所
  rationale: 上下文涉及耶路撒冷敬拜场所遭亵渎。“圣所”保留了神圣空间的含义，同时不把原文未明确的范围限定为整座圣殿或特定内室。
- issue: 重复使用ἁγίασμα
  choice: 两处均译作“圣所”
  alternative: 第二处改译为“这圣地”
  rationale: 原文有意重复同一个名词，形成修辞强调；中文保留重复，更直接突出他们对圣所的亵渎。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两个并列动作及“圣所”的重复，不添加解释性称谓，也不弱化礼仪性“玷污”的含义。
