base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: zh_hans
  text: 他召来他的尊贵侍从[a]，即那些自幼与他一同长大的人，并在自己还活着的时候，把自己的王国分给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他的παῖδες”；这个词可指孩子、少年或仆役。但这里随后称他们为“尊贵的”，又说他们自幼与他一同长大，因此应指受信任的宫廷侍从，而不是他的亲生儿子。
    reason: 说明关键词παῖδες的多义性及上下文所支持的译法，避免读者误解为亲生儿子。
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 召来
  rationale: 表示叫来、召集；“召来”既自然，也符合君王召见身边人员的语境。
- source_word: τοὺς παῖδας αὐτοῦ
  choice: 自己那些……侍从
  rationale: παῖς可指孩子、少年或仆役；下文称这些人尊贵，并说明他们自幼与他一同长大，故此处不是亲生儿子，而是宫廷中受信任的侍从。脚注保留其词义范围。
- source_word: τοὺς ἐνδόξους
  choice: 尊贵的
  rationale: 该词在此表示有身份、受尊崇或显要；“尊贵的”能自然表达其宫廷地位。
- source_word: τοὺς συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  choice: 从年轻时便与他一同长大的人
  rationale: συνεκτρόφους指共同受抚养、一起长大的人；用关系从句清楚传达这一含义，同时不把他们限定为义兄弟。ἀπὸ νεότητος译作“从年轻时”，保留原文未明说是谁的青春时期这一轻微含混，但语境自然指共同成长。
- source_word: διεῖλεν αὐτοῖς
  choice: 把……分给了他们
  rationale: 准确表达将王国划分并分配给多人。
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: 王国
  rationale: βασιλεία可指王权、统治或王国；既然它被分给多人，此处以可划分的政治疆域“王国”最合适。
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: 趁自己还活着
  rationale: 表达这一分配发生在他去世以前；“趁”自然凸显他生前主动安排的时机，但不额外说明动机。
