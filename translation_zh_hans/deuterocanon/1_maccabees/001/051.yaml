  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
translation:
  language: zh_hans
  text: 他依照这一切话，写信给自己的王国；又设立督察员监管全体百姓，并命令犹大的各城一城一城地献祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: 照着这一切话
  rationale: κατά表示依照、按照，λόγοι的基本义是“话”；保留这一措辞与上文所述命令相衔接，同时不把它限定为某一种公文体裁。
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: 写给他的国
  rationale: ἔγραψεν表示“写”，与格τῇ βασιλείᾳ αὐτοῦ可理解为文书所致的对象，即“他的国”。正文不增添原文没有的“全”字，也不把所写内容明确化为“诏令”；脚注说明较自然的汉语表达。
- source_word: ἐποίησεν ἐπισκόπους
  choice: 设立督察员
  rationale: ἐπίσκοποι在此指受王权委派、负责监督执行命令的人员。“督察员”体现其行政监督职能，并避免后世教会职分的联想。
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: 监管全体百姓
  rationale: ἐπί加宾格在此表示管辖范围；结合“督察员”译作“监管”，自然地传达这些人对全体百姓的监督权责。
- source_word: ἐνετείλατο
  choice: 命令
  rationale: 该动词表示具有权威性的吩咐；“命令”准确体现王命的强制性。
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: 犹大的各城
  rationale: πόλεις是复数，指犹大境内的城邑；“各城”也与下文逐城执行的分配意义相呼应。
- source_word: θυσιάζειν
  choice: 献祭
  rationale: 该不定式指举行祭祀、献上祭物；“献祭”是现代汉语中自然且明确的宗教用语。
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: 一城一城地
  rationale: 重复的单数πόλιν构成分配表达，强调每一座城都须执行；“一城一城地”保留了这种逐一落实的语气。
theological_decisions:
- issue: ἐπισκόπους可能被误读为后世教会职分
  choice: 督察员
  alternative: 监督者；官员；主教
  rationale: 本节语境是君王设置行政人员，监督百姓执行命令，并非讨论教会职分。“督察员”保留监督含义，又避免时代错置。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留原文三个连续动作的推进；“督察员”使用行政语域，“一城一城地”则保留原文鲜明的分配意味。
