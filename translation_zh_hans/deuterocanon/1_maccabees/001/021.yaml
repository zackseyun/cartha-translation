base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/021.yaml
  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
translation:
  language: zh_hans
  text: 他狂妄地进入圣所[a]，取走了金祭坛、供照明的灯台，以及灯台的一切器具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣地”。希腊语原词指神圣的地方，并未明确限定为圣殿中的某一特定内室。
    reason: 词义存在可行的宽泛译法，需要避免对圣殿内部位置作过度具体的判定。
lexical_decisions:
- source_word: ἁγίασμα
  choice: 圣所
  rationale: 该词指神圣之地或圣所；结合圣殿语境译作“圣所”自然庄重，同时不把原文过度限定为某一特定内室。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 狂妄地
  rationale: 该介词短语说明他进入时的态度和方式；“狂妄地”自然表达ὑπερηφανία所含的傲慢与僭越意味。
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: 金祭坛
  rationale: 准确传达名词与形容词的组合，也是现代汉语中简洁自然的圣殿器物名称。
- source_word: λυχνίαν τοῦ φωτός
  choice: 供照明的灯台
  rationale: 保留τοῦ φωτός所表达的照明功能，避免生硬直译为“光的灯台”，也不将这一成分省略。
- source_word: σκεύη
  choice: 器具
  rationale: 此处泛指附属于灯台的各种用具；“器具”范围适当，也比“器皿”更不易被误解为仅指容器。
theological_decisions:
- issue: ἁγίασμα是否应译成特指圣殿某一内室的名称
  choice: 圣所
  alternative: 圣地；至圣所
  rationale: 原词表明这是神圣的场所，却未明确要求将其理解为某个特定内室。“圣所”保留圣殿语境中的神圣含义，而不采用过度具体的“至圣所”。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“狂妄地进入”保持原文的道德评价；“供照明的灯台”以自然汉语传达属格所表示的功能；末句明确重复“灯台”，使阴性代词αὐτῆς的所指在汉语中清楚。
