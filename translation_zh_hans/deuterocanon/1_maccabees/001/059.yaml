  yaml_path: translation/deuterocanon/1_maccabees/001/059.yaml
  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: zh_hans
  text: 到了该月二十五日，他们就在那座设于燔祭坛上的坛上献祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在这里使用两个不同的词：“坛”（βωμός）和“燔祭坛”（θυσιαστήριον）。经文所说的坛设在燔祭坛上。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι τοῦ μηνός
  choice: 到了当月二十五日
  rationale: 这是希腊语表达月份日期的惯用说法；译为现代汉语自然的日期格式，并用“到了”衔接叙事。
- source_word: θυσιάζοντες
  choice: 他们……献祭
  rationale: 分词在上下文中承担叙事谓语功能，故译为限定动词；“献祭”准确表达祭祀行动，汉语无需另以进行体标记强行对应其未完成体。
- source_word: ἐπὶ τὸν βωμόν
  choice: 在……坛上献祭
  rationale: ἐπί加宾格在这里指祭物献到坛面之上；“在……坛上”自然清楚。
- source_word: βωμός
  choice: 坛
  rationale: 保留其与本句θυσιαστήριον的用词差异；此处不直接加上“异教”或“亵渎”等解释性限定。
- source_word: ὃς ἦν ἐπὶ τοῦ θυσιαστηρίου
  choice: 那座设于燔祭坛上的坛
  rationale: 关系从句说明前一座坛位于另一座坛之上。“设于”符合物体安置关系，也避免将两个不同的希腊词混为同一座坛。
- source_word: θυσιαστήριον
  choice: 燔祭坛
  rationale: 在圣殿语境中，以“燔祭坛”指既有的献祭祭坛，可在中文中清楚区别于βωμός；具体词汇差异另以脚注说明。
theological_decisions:
- issue: 亵渎场景中βωμός与θυσιαστήριον的区别
  choice: 将βωμός译作“坛”，将θυσιαστήριον译作“燔祭坛”
  alternative: 两者均译作“祭坛”，或将βωμός直接译作“异教祭坛”
  rationale: 原文刻意使用两个不同的祭祀用词，呈现一座坛设在圣殿原有祭坛之上的情形。译文保留这种区别，却不把上下文虽可推知、但本节未明说的“异教”性质写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那座设于燔祭坛上的坛”略有重复，但这是为忠实保留原文两座坛及两个希腊词之间的区别。
