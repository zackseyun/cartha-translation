  yaml_path: translation/deuterocanon/1_maccabees/001/018.yaml
  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: zh_hans
  text: 他向埃及王托勒密发动战争；托勒密在他面前溃败，逃走了，许多受伤的人倒下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“许多受伤的人倒下”。这句话也可能泛指战斗中伤亡的人很多，并不一定只指受伤后仍然存活的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον πρὸς
  choice: 向……发动战争
  rationale: 该短语表示发起并进行敌对军事行动；这样译符合现代汉语习惯，也保留主动开战的力度。
- source_word: Πτολεμαῖον τὸν βασιλέα Αἰγύπτου
  choice: 埃及王托勒密
  rationale: 依照希腊语同位结构，简洁自然地表达托勒密的王号及辖地。
- source_word: ἐνετράπη
  choice: 溃败
  rationale: 该动词本可指转身、被迫退却；在战事语境中表示被击退或败退。“溃败”鲜明呈现军事含义，但不另加死亡等原文没有的信息。
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: 在他面前
  rationale: 保留原文的空间性惯用表达，指托勒密面对对手而败退。
- source_word: ἔφυγεν
  choice: 逃走了
  rationale: 直接表达从战场逃离，措辞现代而庄重。
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: 许多受伤的人倒下
  rationale: 尽量保留“倒下”与“受伤者”两个语义成分，不把这些伤员一概解释为阵亡者。
