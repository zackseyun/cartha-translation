  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
translation:
  language: zh_hans
  text: 首领和长老都呻吟；少女和青年男子变得衰弱，妇女的美貌也改变了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“被改变了”。希腊原文没有具体说明妇女的美貌发生了怎样的改变。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  choice: 呻吟
  rationale: 表达因深重悲痛而发出的声音，比“叹息”更有力度，又不像“哀号”那样增添原文未明确表达的强度。
- source_word: ἄρχοντες
  choice: 首领
  rationale: 泛指掌权或带领群体的人；“首领”符合这里的社会语境，也不暗示世袭身份。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 保留该词可能指群体中受认可的年长领袖这一社会角色，而不只解释为年纪较大的人。
- source_word: παρθένοι
  choice: 少女
  rationale: 此处指未婚的年轻女子；现代汉语叙事中“少女”自然庄重，并与后面的青年男子形成对应。
- source_word: νεανίσκοι
  choice: 青年男子
  rationale: 明确指年轻男性；此译法准确、自然，避免“青年”在现代汉语中性别不够明确。
- source_word: ἠσθένησαν
  choice: 渐渐衰弱
  rationale: 传达变得软弱、失去力量的语义；“渐渐”使状态变化在汉语中表达自然，但不把原因具体化。
- source_word: τὸ κάλλος
  choice: 美貌
  rationale: 直接表达外在的美丽与悦人之处，符合妇女这一所属语境。
- source_word: ἠλλοιώθη
  choice: 改变了
  rationale: 保留被改变这一宽泛含义，不具体断定为“消逝”“憔悴”或“褪色”。
