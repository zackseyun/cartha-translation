base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: zh_hans
  text: 那些日子，有些不法之徒[a]从以色列中出来，劝服了许多人，说：“我们去同四周的列国立约吧！因为自从我们同他们分离[b]以后，许多灾祸就临到我们了。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“不法之子”，意思是以不法为特征的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“自从我们被他们分开以后。”希腊文在形式上可以带有更明显的被动含义。
    reason: lexical_alternative
  - marker: c
    text: 直译：“许多恶事找到了我们。”这里的“恶事”指灾祸或患难。
    reason: literal_idiom
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: 从以色列中出来
  rationale: 保留原文“出来”的动态意象，同时用“中”表明这些人出自以色列内部，而非从以色列地理疆域迁出。
- source_word: υἱοὶ παράνομος
  choice: 不法之徒
  rationale: 原文按字面近于“不法之子”，此处是闪语式称谓，指以违背律法为特征的人。“不法之徒”在现代汉语中自然，并保留原文的负面评价；直译另收入脚注。
- source_word: ἀνέπεισαν πολλοὺς
  choice: 劝服了许多人
  rationale: 动词表示劝说、使人接受某种主张；“劝服”既表达劝说，也表达其取得成效，不额外加入“迷惑”等更强判断。
- source_word: Πορευθῶμεν
  choice: 我们去……吧
  rationale: 以现代汉语的提议句式表达希腊文劝勉虚拟式，语气自然明确。
- source_word: διαθώμεθα διαθήκην
  choice: 立约
  rationale: διαθήκη是重要的圣经用语；“立约”既符合汉语圣经传统，也保留此举的正式及神学分量，而不将其弱化为一般协议。
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: 四周的列国
  rationale: 此处指以色列周围的外族或诸国。“列国”简洁庄重，并保留政治与族群所指，不局限为后期语境中的专门称谓。
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: 自从我们同他们分离以后
  rationale: “同他们分离”在汉语中不明确指定分离的施事者，因而保留希腊文被动形式可能具有的被动或近似反身含义；另一种较明确的被动读法列入脚注。
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: 许多灾祸就临到我们了
  rationale: κακά在这里指患难、灾祸，而非他们实施的道德恶行。汉语以“临到”自然表达原文“找到我们”的拟人化结果；字面意象列入脚注。
theological_decisions:
- issue: 在政治与宗教张力中如何翻译διαθήκη
  choice: 立约
  alternative: 结盟／订立协议
  rationale: 原文采用圣经中具有重要分量的“约”字，而非一般政治协议的专门词。译作“立约”保留以色列与列国建立正式关系所带出的神学张力，同时不预先断定该约仅属军事或政治联盟。
- issue: 以色列与列国“分离”的施事者
  choice: 采用施事者未明的“我们同他们分离”
  alternative: “我们与他们分开”或“我们被迫同他们分开”
  rationale: ἐχωρίσθημεν在形态上是被动式，但在语境中可能按反身意义理解。正文不明确归因于以色列主动分离、上帝使其分别，或外力造成分离，以免消解原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不法之徒”“列国”“立约”保留经文的历史与宗教语域；引语用自然的提议语气。所有脚注标记均置于正文相关词句之后。
