  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: zh_hans
  text: 耶路撒冷的居民因他们而逃离；耶路撒冷成了外族人的住处；她对自己的后代[a]也成了外人，她的儿女离弃了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她对自己的出产也成了外人。”希腊语这个词既可指后代，也可指所出产的东西；紧接着的“她的儿女”较支持“后代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: 逃离
  rationale: 表达居民在压迫之下逃走的具体行动，现代、自然，也保留原文的紧迫感。
- source_word: οἱ κάτοικοι
  choice: 居民
  rationale: 准确指住在耶路撒冷的人，符合现代汉语历史叙事的常用表达。
- source_word: διʼ αὐτούς
  choice: 因他们而
  rationale: διά加宾格在此表示原因；保留“他们”而不在本节补明身份，避免添加原文未明说的信息。
- source_word: κατοικία ἀλλοτρίων
  choice: 外族人的住处
  rationale: 既保留“居所”的具体意象，也表达城市被外来者占据；“外族人”在此历史语境中比“外国人”更自然。
- source_word: ἐγένετο ἀλλοτρία
  choice: 与……疏远了
  rationale: ἀλλοτρία可表示变得陌生、疏离；此译法在现代汉语中自然，并延续本句的异化主题。
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: 自己的后代
  rationale: γενήματα既可指后代，也可指产物或出产；紧接着的“她的儿女”支持“后代”，但以脚注保留另一可能。
- source_word: τὰ τέκνα αὐτῆς
  choice: 她的儿女
  rationale: τέκνα不限定性别；“儿女”自然保留耶路撒冷作为母城的拟人意象。
- source_word: ἐγκατέλειπον
  choice: 离弃
  rationale: 表达弃置、撇下而非单纯离开，保留原句哀歌式的情感分量，同时不使用过度古奥的措辞。
theological_decisions:
- issue: 耶路撒冷的阴性拟人化
  choice: 在后半句使用“她”，并以“自己的后代”“她的儿女”延续母城意象。
  alternative: 全节反复使用“耶路撒冷”，或改用无性别的“这城”。
  rationale: 希腊文以阴性形容词和代词将耶路撒冷拟人化；汉语虽无语法性别，使用“她”能保存哀歌式的母城形象。
- issue: γενήματα的语义歧义
  choice: 正文译作“后代”。
  alternative: 译作“出产”或“物产”。
  rationale: 与下一分句“她的儿女”形成的平行关系较支持“后代”，但该词确可指所产之物，因此在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留耶路撒冷作为母城的拟人化，并以分号呈现原文三个递进分句。正文中的“他们”照原文保留其语境指向，不擅自补明。
