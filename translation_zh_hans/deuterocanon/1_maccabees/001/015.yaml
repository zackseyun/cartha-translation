  text: and they made themselves foreskins[a], and turned away from the holy covenant, and yoked themselves to the nations, and sold themselves to do evil.
translation:
  language: zh_hans
  text: 他们给自己造了包皮[a]，离弃圣约，与列国同负一轭，又卖身作恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“给自己造了包皮”，意思是他们掩盖或逆转割礼留下的外在标记，使自己看起来像没有受过割礼。
    reason: 说明原文具体说法及其惯用含义。
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: 给自己造了包皮
  rationale: 紧贴希腊文“为自己造出包皮”的具体而强烈的说法，不在正文中淡化其冲击力；脚注说明这是指掩盖或逆转割礼留下的外在标记。
- source_word: ἀπέστησαν
  choice: 离弃
  rationale: 表达离开、背弃之意；与“圣约”搭配自然，也避免使用带有后期教会术语色彩的表达。
- source_word: διαθήκης ἁγίας
  choice: 圣约
  rationale: 上下文所指是以色列人所熟知、归于神圣的约；现代汉语中“圣约”简洁而明确。
- source_word: ἐζευγίσθησαν
  choice: 同负一轭
  rationale: 保留动词所含的套轭、联结意象，同时表达他们主动与列国结盟并趋同。
- source_word: τοῖς ἔθνεσιν
  choice: 列国
  rationale: 在犹太希腊文语境中指以色列以外的各族；“列国”直接、庄重，也保留与圣约群体之间的对照。
- source_word: ἐπράθησαν
  choice: 卖身
  rationale: 以简洁的汉语圣经式表达传达自我出卖、自甘受制的意思，同时保留希腊文被动形式所带的自我弃绝色彩。
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: 作恶
  rationale: 自然、凝练地表达目的或结果，不额外限定恶行的具体种类。
theological_decisions:
- issue: 如何呈现逆转割礼标记的具体说法
  choice: 正文保留“给自己造了包皮”这一近乎直译的表达
  alternative: 直接译作“使自己看起来没有受过割礼”或“恢复包皮”
  rationale: 该具体说法是本节描绘背弃圣约的重要组成部分。正文保留原文刻意而强烈的形象，脚注则帮助现代读者理解其实际所指，避免把解释直接代入正文。
- issue: 如何表达ἐπράθησαν的被动形式与主动道德责任
  choice: 译作“卖身作恶”
  alternative: 译作“被卖去作恶”或“任凭自己作恶”
  rationale: 上下文连续描述这些人的主动行为；“卖身”能体现其自我交付和道德责任，同时不引入外在强迫者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文四个并列动作的推进感；“同负一轭”保存套轭比喻，“列国”避免使用可能带额外贬义或后期神学色彩的称谓。
