  text: and that each should abandon his own customs[b][a]. And all the nations accepted the word of the king.
translation:
  language: zh_hans
  text: 并且各人都要弃绝自己原有的习俗[a]。各民族都接受了王的命令[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的律例”或“自己祖传的习俗”。希腊文可指传统上遵守的法律、宗教礼仪和习俗。
    reason: lexical_alternative
  - marker: b
    text: 或译“王的话”或“王的谕令”。希腊文直译为“王的话”；在此语境中可指王的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: 弃绝
  rationale: 这个不定式表示离弃、舍弃既有的做法；“弃绝”体现出决定性的放弃，也符合王命所带有的强制语境。
- source_word: ἕκαστον
  choice: 各人
  rationale: 保留希腊文分配性的单数含义，强调人人分别都须如此。
- source_word: τὰ νόμιμα αὐτοῦ
  choice: 自己的规例
  rationale: νόμιμα可涵盖一个群体历来遵守的法律、礼俗及宗教规条；“规例”兼顾规范与惯例两面，又不把含义限缩为成文法律。
- source_word: ἐπεδέξαντο
  choice: 接受了
  rationale: 贴近该动词“领受、接受”的基本义，同时让上下文表达实际的顺从，而不直接增译为“服从”。
- source_word: πάντα τὰ ἔθνη
  choice: 各民族
  rationale: 此处泛指王治下的众民族；“各民族”比“列国”更少暗示彼此独立的国家，也不增添特指外邦人的宗教对立。
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: 王的话
  rationale: λόγος直译为“话”，在此语境中可指王的命令或谕令；正文保留较宽的原文表达，具体解释列入脚注。
theological_decisions: []
