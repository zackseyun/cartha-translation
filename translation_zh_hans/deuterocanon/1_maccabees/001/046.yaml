  text: and to defile the sanctuary and the holy ones;[a]
translation:
  language: zh_hans
  text: 并要玷污圣所和圣民；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣者”。希腊文直译为“圣洁的人”。
    reason: 保留ἁγίους名词化阳性复数的字面形式及其表达空间。
lexical_decisions:
- source_word: μιᾶναι
  choice: 玷污
  rationale: 该不定式表示使人或物在礼仪或道德上成为不洁；“玷污”自然、简洁，并保留此处的祭祀礼仪色彩。
- source_word: ἁγίασμα
  choice: 圣所
  rationale: 结合安条克王针对犹太敬拜所颁的命令，此词最自然地指作为神圣空间的圣殿；“圣所”准确且符合现代汉语宗教语域。
- source_word: ἁγίους
  choice: 圣民
  rationale: 该词为阳性复数、名词化使用，语法上最自然地指分别为圣的人，而非圣物。“圣民”在汉语中比“圣者们”自然，也避免“圣徒”可能带入的后期基督教专门含义。
theological_decisions:
- issue: ἁγίους所指为何
  choice: 指归于上帝、分别为圣的人，以“圣民”表达
  alternative: 圣者；圣徒；圣物
  rationale: 阳性复数形式通常指人；上下文涉及对圣殿、百姓和律法的攻击，指圣洁的百姓最合乎语法和语境，但不进一步限定为祭司等特定群体。脚注保留较直译的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“玷污圣所”保留礼仪不洁的含义；“圣民”自然表达复数群体，同时以脚注说明希腊文较字面的说法。
