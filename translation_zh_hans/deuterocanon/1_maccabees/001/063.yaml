base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: zh_hans
  text: 他们宁可死去，也不愿因那些食物[a]受玷污，也不愿亵渎神圣的约[b]；他们死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些肉食”。希腊语所用的词泛指食物；在这里特指按盟约律法食用后会使人受玷污的食物。
    reason: lexical_alternative
  - marker: b
    text: 或译“一个神圣的约”。希腊语原文没有冠词，但上下文强烈表明这是指以色列所熟知的约。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: 宁愿死去
  rationale: 该结构表示主动接受死亡这一结局。结合后面的目的从句，“宁愿死去”既保留其自愿承受的意味，也符合现代汉语表达；不译作“欣然赴死”，以免加入原文没有的情绪色彩。
- source_word: μιανθῶσιν
  choice: 玷污自己
  rationale: 该词在此指因违禁食物而陷入礼仪及盟约层面的污秽。“玷污自己”用自然汉语保留了这种被污损的含义。
- source_word: τοῖς βρώμασιν
  choice: 那些食物
  rationale: βρῶμα的复数泛指上下文所说会使人受玷污的食物，并不限定为肉类；指示词“那些”传达希腊文冠词在具体语境中的指称作用。
- source_word: βεβηλώσωσιν
  choice: 亵渎
  rationale: 该词表示把神圣之物当作凡俗之物；与ἁγίαν形成明确的神圣—凡俗对照，“亵渎”比一般的“违背”更贴近原意。
- source_word: διαθήκην ἁγίαν
  choice: 神圣的约
  rationale: διαθήκη在此是盟约意义。虽然希腊文没有冠词，但上下文指向以色列所熟知的约；正文采用自然表达，并以脚注保留形式上的不定可能。
- source_word: ἀπέθανον
  choice: 他们就这样死了
  rationale: 原文只陈述他们死了，没有明确使用“被处死”的使役或被动表达。“就这样”承接前述选择，但不额外断定死亡方式。
theological_decisions:
- issue: 食物所造成的玷污具有何种性质
  choice: 因食用违禁食物而在盟约意义上玷污自己
  alternative: 泛指因饮食行为而产生的道德败坏
  rationale: 本章语境涉及强迫犹太人违背律法饮食规定，因此既有礼仪洁净层面，也有忠于盟约的道德层面；译文不把两者缩减为单纯象征或一般道德问题。
- issue: διαθήκην ἁγίαν是否应作确定指称
  choice: 在正文中按语境理解为以色列所熟知的神圣之约
  alternative: 一个神圣的约
  rationale: 希腊文短语虽无冠词，历史和叙事语境却清楚指向以色列的约。脚注保留语法形式容许的另一种译法，避免掩盖原文的细微歧义。
- issue: 死亡是主动选择还是仅被动接受
  choice: 宁愿死去
  alternative: 接受死亡
  rationale: ἐπεδέξαντο带有自愿承担或接受的意味，而目的从句表明他们以死亡避免违约。“宁愿”自然表达这种取舍，但不渲染为热烈欢迎死亡。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宁愿……也不愿……”把希腊文的自愿承受与目的关系自然连结起来；分号保留末句简短而沉重的收束。所有脚注标记均置于相应词组之后。
