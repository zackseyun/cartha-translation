  text: And many in Israel stood firm and were strengthened among themselves so as not to eat defiled food;[a]
translation:
  language: zh_hans
  text: 以色列中有许多人刚强起来，内心坚定，决意不吃受玷污的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受玷污的食物”也可译作“不洁净的食物”；较直译为“俗物”或“普通之物”。这里的希腊词在此语境中带有礼仪含义，指按犹太律法被视为受玷污、不可食用的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: 以色列中有许多人
  rationale: 保留数量词和群体范围，不增添原文没有的身份说明。
- source_word: ἐκραταιώθησαν
  choice: 刚强起来
  rationale: 对应“变得强健、刚强”的被动形式及力量意象；在逼迫语境中也自然表达意志坚定。
- source_word: ὠχυρώθησαν
  choice: 彼此坚固
  rationale: 保留“加固、使稳固”的意象，并与前一动词形成修辞上的叠加强调；结合ἐν αὐτοῖς，将压缩的希腊语理解为群体内部彼此坚定，但不把它改写成纯粹个人内心活动。
- source_word: τοῦ μὴ φαγεῖν
  choice: 决意不吃
  rationale: 以自然汉语表达带μή的冠词不定式所含的目的或坚定意向；“决意”也承接前面的刚强、坚固。
- source_word: κοινά
  choice: 受玷污的食物
  rationale: 本语境涉及犹太饮食礼仪，κοινά不是中性的“普通之物”，而是指在礼仪上被视为俗污、受玷污之物；补出“食物”来自φαγεῖν的语境。
theological_decisions:
- issue: κοινά所表达的礼仪身份
  choice: 受玷污的食物
  alternative: 不洁净的食物；俗物
  rationale: “受玷污”较能保留κοινός在礼仪语境中的特殊含义，又不与ἀκάθαρτος完全等同；脚注列出其他可能译法。
- issue: ἐν αὐτοῖς的指向
  choice: 彼此坚固
  alternative: 内心坚定；在这些事上坚定
  rationale: 该短语十分压缩，字面近于“在他们自己里面”。主文采用群体内部彼此坚固的理解，符合“以色列中许多人”的集体语境；同时承认内在坚定等理解也有可能，不将歧义提升为教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“刚强起来，彼此坚固”刻意保留原文两个近义动词的力量与加固意象；“决意不吃”使目的关系在汉语中清楚自然。脚注标记[a]已在正文出现。
