  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: zh_hans
  text: 从他们中间兴起了一个罪恶的根[a]——安条克·伊庇法尼，是安条克王的儿子；他曾在罗马做人质。到了希腊人统治的第一百四十七年[b]，他登基为王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有罪的根”或“邪恶的根”。希腊原文直译为“根”，保留了植物的比喻。
    reason: lexical_alternative
  - marker: b
    text: 这里按塞琉古纪元计算；“希腊人统治”是原文对这一纪年体系的称法。
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: 从他们中间生出
  rationale: 表达从前述群体或谱系中兴起之意，并与下文“根”的植物隐喻自然衔接。
- source_word: ῥίζα ἁμαρτωλός
  choice: 一条有罪的根
  rationale: 保留ῥίζα“根”的原有隐喻，不将其淡化为“人”或“后裔”；“有罪的”贴近ἁμαρτωλός，同时保留其道德评价。
- source_word: Ἀντίοχος Ἐπιφανής
  choice: 安条克·伊庇法尼
  rationale: 按现代汉语音译人名及称号，不在正文中解释或翻译该称号。
- source_word: ὅμηρα
  choice: 做人质
  rationale: 这里虽使用希腊语复数形式，却单指安条克；政治语境中的“人质”比“俘虏”准确。
- source_word: ἐβασίλευσεν
  choice: 登基作王
  rationale: 此处着重说明他在该年开始执政；“登基作王”既体现王权，也明确表达即位这一事件。
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: 到了……第一百四十七年
  rationale: 以自然的现代汉语再现希腊语纪年公式。
- source_word: βασιλείας Ἑλλήνων
  choice: 希腊人统治的
  rationale: βασιλεία在此构成以希腊统治为框架的纪年表达；译作“统治”比生硬的“希腊人王国之年”更自然，同时未直接用注释性的“塞琉古纪元”取代原文。
theological_decisions:
- issue: ῥίζα ἁμαρτωλός所含的植物隐喻及道德定性
  choice: 保留为“一条有罪的根”
  alternative: 译成“一个邪恶的人”或“一株邪恶的嫩枝”
  rationale: 原文以“根”引入安条克，并明确作出负面的道德评价。直保留这一隐喻可维持叙事的文学力度，也避免用解释性改写消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“生出了一条……根”略带文学色彩，是为保留原文刻意使用的植物隐喻；分号将身份说明与其曾在罗马做人质的经历清楚分开。脚注[b]置于纪年语句之后，使标记与注释内容准确对应。
