lexical_decisions:
- source_word: ἐγένετο
  choice: 于是……陷入了
  rationale: 承接叙事并表达一种局面出现；中文不拘泥于直译“发生了”，以自然句式呈现。
- source_word: πένθος μέγα
  choice: 极大的哀痛
  rationale: πένθος可指因灾祸或死亡而有的悲痛、哀悼；“哀痛”兼顾内在悲伤与群体哀悼，μέγα译作“极大的”。
- source_word: ἐπὶ Ἰσραήλ
  choice: 以色列……陷入了
  rationale: ἐπί在这里描写哀痛临到或笼罩以色列；用“陷入”保留这种临到全体的沉重感，同时符合现代汉语表达。
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: 全境各处
  rationale: 原文直近“在他们的每一处地方”，强调哀痛遍及以色列人所属或居住的各地；“全境各处”自然保留其分布广泛的意义。
