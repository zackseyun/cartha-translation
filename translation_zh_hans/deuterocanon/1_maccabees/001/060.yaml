  text: And they put to death the women who had circumcised their children[a], according to the decree,
translation:
  language: zh_hans
  text: 他们按照命令，把那些曾给自己孩子行过割礼的妇女[a]处死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些让人给自己孩子行割礼的妇女。”希腊文使用主动分词，字面表示妇女给孩子行了割礼，也可能指她们安排别人施行割礼。
    reason: 保留原文在直接施行与安排施行之间的施事歧义。
lexical_decisions:
- source_word: περιτετμηκυίας
  choice: 给……行过割礼的
  rationale: 这是περιτέμνω的完成时主动分词，表示割礼已经完成，并在语法上把这些妇女表述为行动者；现代汉语中也可涵盖她们安排他人施行割礼的情形，相关歧义以脚注保留。
- source_word: τὰ τέκνα αὐτῶν
  choice: 自己的孩子
  rationale: τέκνα通常指“孩子”。虽然割礼的对象是男性，但原文没有使用“儿子”，故不在正文中缩窄其范围。
- source_word: ἐθανάτωσαν
  choice: 处死了
  rationale: 该动词意为使人死亡；结合后面的官方诏令，“处死”既符合语境，又不额外断定具体司法程序。
- source_word: κατὰ τὸ πρόσταγμα
  choice: 按照诏令
  rationale: πρόσταγμα可指命令、法令或诏令；在官方迫害政策的语境中，“诏令”自然地表达正式发布的命令。
theological_decisions:
- issue: 妇女在给孩子行割礼一事中的施事关系
  choice: 正文表述为妇女“给自己孩子行过割礼”。
  alternative: 妇女“让人给自己的孩子行割礼”。
  rationale: 希腊文主动分词在形式上以妇女为施事，但在实际语境中也可能包括安排他人施行。正文保留主动表达，脚注说明使役理解的可能性。
- issue: 割礼语境中τέκνα的范围
  choice: 译为“孩子”。
  alternative: 译为“儿子”或“男孩子”。
  rationale: 割礼虽只涉及男性，原文名词本身却是较宽泛的“孩子”；保留这一措辞可避免加入原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“按照诏令”前置，使汉语句序自然；“处死”体现官方命令下的杀害，但不加入原文未明确表达的司法细节。
