  text: And the books of the law that they found, they tore to pieces and burned with fire.
translation:
  language: zh_hans
  text: 他们把所找到的律法书卷撕碎，用火焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία τοῦ νόμου
  choice: 律法书卷
  rationale: βιβλία 指书籍或书写文献；在古代语境中载体很可能是卷轴，但希腊文未专门强调形制。“书卷”既符合历史背景，也自然表达这些承载律法的文献；“律法”在本语境中指犹太人的律法。
- source_word: ἃ εὗρον
  choice: 所找到的
  rationale: 忠实表达关系从句“他们所找到的”，不额外加入“凡是”等可能增强周遍意义的措辞。
- source_word: κατασχίσαντες
  choice: 撕碎
  rationale: 该分词表示撕裂、扯碎；译作“撕碎”传达蓄意毁坏的力度，并在汉语叙事中自然地作为与主要动作相连的动作。
- source_word: ἐνεπύρισαν πυρί
  choice: 用火焚烧
  rationale: 动词本身表示焚烧，πυρί 明说“用火”；“用火焚烧”保留原文略带强调的表达，同时保持庄重自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“律法书卷”避免仅译作抽象的“律法”，明确被毁的是承载律法的文献；不以“大写”等中文不存在的形式额外标示专名性质。
