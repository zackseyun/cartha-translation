  yaml_path: translation/deuterocanon/1_maccabees/001/039.yaml
  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: zh_hans
  text: 她的圣所荒凉，仿佛旷野；她的节期变为哀恸，她的安息日变为羞辱，她的尊荣变为藐视。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: 圣所
  rationale: 此处指耶路撒冷分别为圣的敬拜场所，而非抽象的“圣洁”；“圣所”准确保留宗教礼仪语境，也符合现代汉语圣经用语。
- source_word: ἠρημώθη
  choice: 荒凉
  rationale: 该被动形式表达遭受破坏后成为荒废、无人之境的结果；汉语以“荒凉”自然传达这种状态，无须机械补出被动标记。
- source_word: ὡς ἔρημος
  choice: 仿佛旷野
  rationale: ὡς明确引出比较；“旷野”兼具荒无人烟之意和经文语境中的传统意象，比“沙漠”更不过度限定地貌。
- source_word: αἱ ἑορταὶ
  choice: 节期
  rationale: 这里指以色列宗教历法中的节庆；“节期”比一般的“节日”更能体现其规定的敬拜性质。
- source_word: ἐστράφησαν εἰς πένθος
  choice: 变为哀恸
  rationale: 保留由欢庆转成哀伤的强烈反转；“哀恸”既指悲痛，也可包含公开举哀，符合 πένθος 的语义。
- source_word: τὰ σάββατα
  choice: 安息日
  rationale: 希腊文虽为复数，指反复举行的安息日；现代汉语通常用单数形式作类称，表达自然且不损失意义。
- source_word: εἰς ὀνειδισμόν
  choice: 变为羞辱
  rationale: ὀνειδισμός可指辱骂、耻辱或受人非难的处境；“羞辱”保留公开受辱的意味，同时不擅自补明施辱者。
- source_word: τιμὴ
  choice: 尊荣
  rationale: 此处表示耶路撒冷原有的尊贵地位与受尊崇的状态；“尊荣”较“荣耀”更直接对应 τιμή，也避免扩大为神圣荣光。
- source_word: εἰς ἐξουδένωσιν
  choice: 变为藐视
  rationale: 该词表示被看作毫无价值、遭人轻蔑；“藐视”保留受鄙弃的关系性含义，与前面的“尊荣”构成鲜明反差。
theological_decisions:
- issue: 阴性属格代词 αὐτῆς 的所指
  choice: 全句以“她的”保留阴性拟人表达，让所指依上下文指向耶路撒冷或锡安。
  alternative: 明确译作“耶路撒冷的”或“这城的”。
  rationale: 原文反复使用阴性代词而不重述先行词，形成哀歌式的城市拟人。现代汉语使用“她”也能自然维持这种文学效果，并避免在本节中把耶路撒冷与锡安之间的语境指向过度固定。
translation_notes:
  register: 采用庄重、凝练而现代的汉语，保留原文三个由尊贵或喜庆转向荒凉、哀恸和受辱的平行分句。分号呈现首句与后续列举之间的层次，逗号维持后三项的节奏。无脚注，因此正文不设脚注标记。
