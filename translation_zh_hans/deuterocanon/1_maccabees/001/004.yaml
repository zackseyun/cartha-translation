  yaml_path: translation/deuterocanon/1_maccabees/001/004.yaml
  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
translation:
  language: zh_hans
  text: 他集结了极其强大的兵力，统治了[a]各地、各族和僭主政权[b]；都向他纳贡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“开始统治”。这里的希腊语动词表示施行统治；其不定过去时形式在本句中也可能着重于统治的开始。
    reason: lexical_alternative
  - marker: b
    text: 原词可指由僭主统治的辖区或政体，也可译作“僭主统治的地区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν
  choice: 集结了
  rationale: 此处指调集、聚合军事力量；“集结”既保留动作的具体性，也符合现代汉语的军事语境。
- source_word: δύναμιν
  choice: 兵力
  rationale: δύναμις 在上下文中指军事力量。“兵力”比泛指能力的“力量”更准确，同时不把它限定为编制完整的一支军队。
- source_word: ἰσχυρὰν σφόδρα
  choice: 极其强大的
  rationale: 体现形容词与强化副词的强调语气，庄重而自然。
- source_word: ἦρξεν
  choice: 统治了
  rationale: ἄρχω 接属格表示统治、管辖。简单过去时本身未必明确表示“开始”，所以正文不强加起始含义，并在脚注保留“开始统治”的可能理解。
- source_word: χωρῶν
  choice: 各地
  rationale: χώρα 指土地、地域或疆域；“各地”避免套用现代民族国家概念，并与后面的政治和族群类别自然并列。
- source_word: ἐθνῶν
  choice: 各族
  rationale: ἔθνη 此处可指不同民族或人民群体。“各族”比“列国”较少引入现代国家含义，也贴合被征服群体的语境。
- source_word: τυραννιῶν
  choice: 各个政权
  rationale: 该词在此指由统治者掌控的辖区或政体，而不只是抽象的暴政。“政权”在正文中自然可懂，脚注则交代原词含有僭主统治的色彩。
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: 这些都向他纳贡
  rationale: 表达这些地域、族群和政权进入对他负有贡赋义务的状态；“向他纳贡”简洁呈现财政与政治上的臣服关系。
