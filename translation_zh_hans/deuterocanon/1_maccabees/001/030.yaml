base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: zh_hans
  text: 他诡诈地对他们说了些和平的话[a]，他们便信了他[b]。随后，他突然袭击那城，使城遭受重创，并杀害了以色列中许多人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“和平的话”；指表面上表示和平、和好或安抚的言辞，并不表示这些话是真诚的。
    reason: 说明λόγους εἰρηνικούς的较直译形式及其语义范围，避免将其限定为正式“求和”。
  - marker: b
    text: 也可译作“信任了他”或“相信了他的话”。
    reason: 保留πιστεύω在此处介于相信其保证与信任说话者之间的语义幅度。
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: 一番求和的话
  rationale: 该短语直指带有和平、和睦意味的话语；结合受话者因而相信他的叙事情境，“求和的话”自然表达安抚、示和的言辞，同时不暗示这些话出于真诚。
- source_word: ἐν δόλῳ
  choice: 诡诈地
  rationale: 介词短语表示说话的方式，说明求和言辞实为欺骗手段。“诡诈地”既保留蓄意欺骗的意味，也符合现代汉语叙事表达。
- source_word: ἐπίστευσαν αὐτῷ
  choice: 他们便信了他
  rationale: 此处是接受他的保证、对他产生实际信任，并非神学意义上的信仰。“信了他”简洁自然，也保留“相信其话”与“信任其人”之间的语义空间。
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  choice: 他突然袭击那城
  rationale: ἐπιπίπτω在此表示猛然扑向、攻击；译作“袭击”比逐字的“扑到城上”自然，并由“突然”准确表达ἐξαίφνα。
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: 使城遭受重创
  rationale: 希腊语使用同源意义相近的“击打—打击”结构，表示给那城造成重大打击。“遭受重创”在现代汉语中自然，并保留其严重程度而不把它限定为某一种破坏。
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  choice: 杀害了以色列中许多人
  rationale: ἀπόλλυμι用于人为对象且处于暴力袭城语境，具体指使人丧命；“杀害”比抽象的“毁灭”更符合汉语搭配。ἐξ Ἰσραήλ表示这些死者出自以色列民，故译“以色列中许多人”。
theological_decisions:
- issue: 非神学叙事中πιστεύω的译法
  choice: 他们便信了他
  alternative: 他们便信任他／他们便相信了他的话
  rationale: 上下文指众人接受了欺骗性的求和言辞。“信了他”不引入宗教信仰含义，同时保留相信其言辞与信任其人两层相近含义。
- issue: ἀπώλεσεν用于人的语义强度
  choice: 杀害
  alternative: 毁灭／除灭
  rationale: 在突然袭城并使城市遭受重创的语境中，该动词表示造成许多人死亡；采用现代汉语对人为对象更清楚自然的“杀害”，不另行赋予审判或灭绝等神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一番求和的话”“突然袭击”“遭受重创”符合当代普通读者的表达习惯；避免古雅的“击杀”“毁灭多人”等生硬搭配。
