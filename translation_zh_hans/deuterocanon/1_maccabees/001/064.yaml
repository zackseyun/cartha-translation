  text: And there was very great wrath against Israel[a].
translation:
  language: zh_hans
  text: 于是，极大的愤怒临到以色列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，有极大的愤怒向以色列发作。”希腊文没有说明这愤怒来自谁。
    reason: 说明ἐπί可表达“临到”或“针对”，并保留愤怒来源未明的含义。
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: 于是……临到
  rationale: 该惯用表达引出随之发生的情形或事件。“于是”承接上文，“临到”保留了事件发生的动态感，又符合现代汉语表达。
- source_word: ὀργὴ
  choice: 愤怒
  rationale: “愤怒”表达强烈怒气，适合本节作为灾祸与审判背景下的总结语，同时不擅自指明愤怒的主体。
- source_word: μεγάλη … σφόδρα
  choice: 极大的
  rationale: μεγάλη与句末σφόδρα共同加强程度；“极大的”在简洁自然的汉语中保留这一强调。
- source_word: ἐπὶ Ἰσραήλ
  choice: 临到以色列
  rationale: ἐπί在此可表达愤怒落在或指向以色列。“临到”自然地呈现其作用对象，同时避免补出原文未明说的施怒者。
theological_decisions:
- issue: 愤怒的来源或主体
  choice: 不说明愤怒来自谁
  alternative: 明确译作上帝的震怒，或敌人的暴怒与迫害
  rationale: 希腊文只说极大的愤怒临到以色列，没有明说主体。译文保留这一含混，不将其解释为特定来源。
- issue: ἐπί所表达的关系
  choice: 译为“临到”，突出愤怒落在以色列身上
  alternative: 译为“向以色列发作”或“针对以色列”
  rationale: 上下文容许“临到”与“针对”两种侧重点；正文采用较贴近“落在其上”的表达，脚注列出方向性译法，以保留原文张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“极大的愤怒临到”保留原文的强烈程度与主体未明的特点；脚注标记[a]已置于正文相应位置。
