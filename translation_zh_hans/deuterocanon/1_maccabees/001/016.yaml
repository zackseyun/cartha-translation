base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/016.yaml
  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
translation:
  language: zh_hans
  text: 王国已经为安条克稳固下来[a]，他就着手统治埃及地，为要统治这两个王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王国在安条克面前预备好了。”希腊文也可能表示，他转向埃及以前，王国已经为他预备妥当，或他的统治已经稳固。
    reason: 保留ἡτοιμάσθη及ἐνώπιον Ἀντιόχου在字面意义与上下文政治含义之间的歧义。
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: 稳固下来
  rationale: 该被动式本义为“被预备好”，在此处涉及安条克已有的统治基础。“稳固下来”自然表达其政权已经安定，同时不把原文具体解释得过满；字面意义及可能含义见脚注。
- source_word: ἡ βασιλεία
  choice: 王国
  rationale: βασιλεία既可指王权、统治，也可指王国。下文明确说“两个王国”，因此正文采用“王国”，同时保留其中所含的统治权意味。
- source_word: ἐνώπιον Ἀντιόχου
  choice: 在安条克面前
  rationale: 按原文保留ἐνώπιον的空间性表达，避免直接改译成“为安条克”，因为该短语在这里究竟强调摆在他面前，还是为他预备妥当，仍有一定歧义。
- source_word: ὑπέλαβεν
  choice: 着手
  rationale: ὑπολαμβάνω与不定式连用，在这里表示承担、开始实行某项企图。“着手”符合叙事语境，又不像“决意”那样过度强调内心决定。
- source_word: βασιλεῦσαι
  choice: 统治
  rationale: 该词表示以君王身份施行统治。“统治埃及地”是自然的现代汉语，也能与后文“统治这两个王国”保持一致。
- source_word: γῆς Αἰγύπτου
  choice: 埃及地
  rationale: 保留γῆ“地、土地”的领土意味，比单译“埃及”更贴近希腊文结构。
- source_word: ὅπως
  choice: 为要
  rationale: ὅπως在此引出目的。“为要”清楚保留目的关系，语体庄重而易懂。
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: 统治这两个王国
  rationale: ἐπί在此表示统治所及的对象。“这两个王国”明确指两个不同的政治领域，同时避免生硬直译为“在两个王国之上”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“王国”“统治”贯穿前后，以呈现原文重复的βασιλεία／βασιλεύω词根关系；“在安条克面前”有意保留略显特殊的原文措辞，并由脚注说明其可能含义。
