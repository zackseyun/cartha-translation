base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/048.yaml
  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
translation:
  language: zh_hans
  text: 并要让他们的儿子不受割礼，使他们的生命因各样不洁之物而成为可憎，又使其受亵渎[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“他们的生命”（ψυχάς；亦可指他们自身／整个人），末尾“其”回指这一短语；因此也可理解为“使他们自身……又受亵渎”。
    reason: 说明ψυχή的语义范围，并澄清末尾代词的指向。
lexical_decisions:
- source_word: ἀφεῖναι
  choice: 让……不受
  rationale: 此处表示使其维持在未受割礼的状态；译为“让……不受割礼”符合诏令语境，也比直译“留下”自然。
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: 他们的儿子
  rationale: υἱούς明确指儿子，且割礼的语境要求保留男性所指。
- source_word: ἀπεριτμήτους
  choice: 不受割礼
  rationale: 直接保留其礼仪与圣约含义；与“让”连用符合现代汉语。
- source_word: βδελύξαι
  choice: 使……成为可憎
  rationale: 该词的核心语义涉及令人憎恶、成为可憎之物；这里不宜仅以“玷污”消解其憎恶色彩。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 他们
  rationale: ψυχή在此可指生命、本人或整个人；现代汉语若译“灵魂”容易造成过窄的身心二分理解，故正文自然译作“他们”，并以脚注交代原文形式。
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: 因各样不洁之物
  rationale: ἐν在此可表达手段或所涉范围；“因……之物”传达他们借各样礼仪上不洁之物而成为可憎。
- source_word: βεβηλώσαι
  choice: 亵渎
  rationale: 保留该词侵犯神圣、使之世俗不圣的意义，并与前面的“成为可憎”有所区分。
theological_decisions:
- issue: 礼仪不洁语境中ψυχή的译法
  choice: 正文译为“他们”，脚注说明原文直译为“他们的生命／魂”
  alternative: 他们的灵魂；他们的性命；他们自身
  rationale: 原词语义范围可涵盖生命、魂或整个人。此处强行译作“灵魂”可能引入原文未必强调的身心二分；“他们”保留整全人格所指，同时脚注保存原文措辞及指代关系。
- issue: βδελύξαι的憎恶与污秽色彩
  choice: 使……成为可憎
  alternative: 玷污；使……污秽
  rationale: 上下文确有礼仪污染意味，但词根本身突出可憎、令人厌恶。采用“成为可憎”保留这一张力，不把它完全等同于ἀκάθαρτος所表达的不洁。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“让他们的儿子不受割礼”避免生硬的“使儿子留在未受割礼状态”；“各样不洁之物”“成为可憎”“亵渎”保留礼仪与圣约语境中的不同层次。
