  yaml_path: translation/deuterocanon/1_maccabees/001/033.yaml
  text: And they fortified the city of David with a great and strong wall[a], with strong towers, and it became a citadel for them.
translation:
  language: zh_hans
  text: 他们修筑大卫城，建起高大坚固的城墙和坚固的塔楼；这城就成了他们的堡垒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这城就成了他们的阿克拉。”希腊语ἄκρα既可作普通名词，意为“堡垒、要塞”，也可理解为耶路撒冷塞琉古驻军堡垒的历史名称“阿克拉”。
    reason: 保留原文在普通名词与历史专名之间的词义歧义。
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: 修筑
  rationale: οἰκοδομέω的基本义是“建造、修建”。这里所修筑的是带有城墙和塔楼的防御工程；“修筑”既保留建造之意，也自然契合军事语境，而不直接把动词解释为“加固”。
- source_word: τὴν πόλιν Δαυεὶδ
  choice: 大卫城
  rationale: 这是该地名在现代汉语圣经语境中自然、简洁的表达，保留其历史和地理指向。
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: 用高大坚固的城墙
  rationale: 与格在此说明修筑所凭借或伴随的防御设施。μέγας表达规模宏大，ὀχυρός表达防御上的坚固；“高大坚固”符合汉语对城墙的自然描述。
- source_word: πύργοις ὀχυροῖς
  choice: 和坚固的塔楼
  rationale: 保留与格所表达的伴随设施以及ὀχυρός的防御意味；“塔楼”比单说“塔”更清楚地体现城防建筑。
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: 这城就成了他们的堡垒
  rationale: ἄκρα可指城堡、堡垒或设在高处的要塞。“堡垒”是现代汉语中清楚自然的通称；以“这城”明确主语所指，同时在脚注保留其作为专名理解的可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“修筑”贴近原文的建造动作，又适合城防工程语境；分号呈现前后动作及结果的关系。脚注标记置于“堡垒”之后，明确对应ἄκρα的译法。
