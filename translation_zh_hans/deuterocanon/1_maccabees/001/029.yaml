  yaml_path: translation/deuterocanon/1_maccabees/001/029.yaml
  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
translation:
  language: zh_hans
  text: 两年后，王派了一名主管征收贡税的官员到犹大各城。他带着一大群人[a]来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着一支强大的队伍”。希腊文直译为“带着沉重的人群”；此处用语表示随行者人数众多、声势浩大，但未明确说明他们是否为武装人员。
    reason: 说明ἐν ὄχλῳ βαρεῖ的字面表达及其在此语境中可指规模庞大的随行队伍，同时避免把未明言的军事性质写入正文。
lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: 两年后
  rationale: 这是表示一段时间已经过去的惯用表达；译作“两年后”简洁自然，也准确保留时间意义。
- source_word: ἀπέστειλεν
  choice: 派了
  rationale: 在王差遣官员的语境中，“派了”比一般的“送出”更符合现代汉语习惯。
- source_word: ἄρχοντα φορολογίας
  choice: 一名主管征收贡税的官员
  rationale: ἄρχων表明此人具有官员或主管身份，φορολογία涉及贡税的征收；这一译法避免把他弱化为普通收税人。
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: 到犹大各城
  rationale: εἰς在差遣与移动语境中表示目的地；“犹大各城”是自然、明确的地理表达。
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: 带着大队人马
  rationale: ὄχλος指人群或众人，βαρύς本义为“沉重的”，此处形容随行队伍规模庞大、声势可观。“大队人马”在汉语中自然，并保留其既可指大批随从、也可能暗含武装力量的弹性。
