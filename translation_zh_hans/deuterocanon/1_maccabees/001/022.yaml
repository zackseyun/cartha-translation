  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
translation:
  language: zh_hans
  text: 还有陈设饼的桌子[a]、奠酒器、碗、金香炉、帘幕、冠饰，以及圣殿正面的金饰；他把这些全都剥取了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“陈设桌”或“供饼桌”。希腊文直译为“陈设的桌子”，在圣殿语境中指用来在上帝面前陈设饼的桌子。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“剥去”或“揭取”。原词可指剥离或剥取，可能特别暗示把圣殿正面的金箔、包金或附着的装饰拆剥下来。
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: 陈设供饼的桌子
  rationale: πρόθεσις在圣殿语境中指把饼陈设在上帝面前。译文明确桌子的礼仪用途，同时不把后来的固定传统术语直接代入正文。
- source_word: σπονδεῖα
  choice: 奠酒器
  rationale: 该词指用于浇奠礼的器具；“奠酒器”简洁地保留其礼仪含义。
- source_word: φιάλας
  choice: 碗
  rationale: φιάλη通常指宽而浅、可用于礼仪的碗；“碗”是现代读者容易理解的对应词。
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: 金香炉
  rationale: θυΐσκας指焚香器具，χρυσᾶς明确说明其为金制；“金香炉”自然、准确。
- source_word: καταπέτασμα
  choice: 帘幕
  rationale: 该词指圣所中的悬帘或幔子；“帘幕”既庄重又通俗，并避免过度限定其具体位置。
- source_word: στεφάνους
  choice: 冠饰
  rationale: στεφάνους本义可指冠冕或花冠；在圣殿物件清单中很可能是冠形装饰。“冠饰”既保留其形象，也交代其装饰性质。
- source_word: κόσμον τὸν χρυσοῦν
  choice: 金饰
  rationale: κόσμος在此指装饰或饰物，不是“世界”；“金饰”简洁符合建筑陈设语境。
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: 圣殿正面的
  rationale: 该短语字面涉及圣殿的“面前/正面”，在建筑装饰语境中最自然地指圣殿前部或正面。
- source_word: ἐλέπισεν πάντα
  choice: 他把这一切全都剥了下来
  rationale: ἐλέπισεν含剥去、揭去之意，形象地表示把金层或附着的装饰拆剥下来；πάντα保留为“这一切全都”，不擅自缩小其语法范围。
