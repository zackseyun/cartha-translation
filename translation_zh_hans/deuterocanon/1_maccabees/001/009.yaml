base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: zh_hans
  text: 他死后，他们都戴上了王冠[a]；他们的儿子接着他们也这样做，这样延续了许多年。他们使这片土地上的恶事增多了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王冠”也可译作“王权冠带”；希腊词特指君王所佩戴的王权标志。
    reason: lexical_alternative
  - marker: b
    text: “恶事”也可译作“恶行”或“灾祸”。这里的希腊词含义宽广，可以兼指道德上的恶及其带来的祸患。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: 戴上了
  rationale: 中间语态与“王冠”搭配，表示他们亲自戴上王权标志；“戴上”保留原文具体形象，也符合现代汉语习惯。
- source_word: διαδήματα
  choice: 王冠
  rationale: 该词特指君王佩戴的王权标志。“王冠”通俗自然，并清楚传达其王室含义；较精确的形制说明置于脚注。
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: 他死后
  rationale: 准确表达带 μετά 的冠词化不定式所表示的后续时间，简洁自然。
- source_word: ὀπίσω αὐτῶν
  choice: 在他们之后
  rationale: 上下文指王朝的先后承继，而非空间上的“在后面”；此译法保留原文简略表达，不额外加入“继承王位”等解释。
- source_word: ἔτη πολλά
  choice: 历时多年
  rationale: 表达时间延续，既涵盖“许多年”，又与前面的世代相承衔接自然。
- source_word: ἐπλήθυναν
  choice: 使……日益增多
  rationale: 保留及物、使动含义，并用现代汉语自然表达“使之增多”。
- source_word: κακὰ
  choice: 恶事
  rationale: 以较宽泛的词表达负面的行为与事物，同时用脚注说明希腊词也可涵盖由恶行引起的灾祸，避免在正文中过度限定。
- source_word: ἐν τῇ γῇ
  choice: 在这片土地上
  rationale: 历史叙事语境中指相关地域，而非整个世界；“这片土地”比“地上”更能体现地域含义。
theological_decisions:
- issue: κακὰ 的含义范围
  choice: 正文译作“恶事”，脚注保留“灾祸”的可能
  alternative: 恶行；祸患；灾难
  rationale: κακὰ 语义宽广，既可指道德上的恶，也可指恶所造成的祸患。正文不把它专门解释成政治灾难或道德败坏，脚注则保留两方面的张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“也同样如此”承接“戴上王冠”，保留希腊文的省略结构；分号和句号使世代承继与其后果层次清楚。
