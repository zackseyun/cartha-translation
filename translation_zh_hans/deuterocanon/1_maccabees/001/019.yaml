  text: And they captured the fortified cities in the land of Egypt, and he took the plunder of the land of Egypt.
translation:
  language: zh_hans
  text: 他们攻占了埃及境内的坚城；他又夺取了埃及地的战利品。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: 攻占
  rationale: 该词在军事叙事中表示以武力取得并控制；“攻占”自然、明确，也与所攻取的坚城相称。
- source_word: τὰς πόλεις τὰς ὀχυράς
  choice: 坚城
  rationale: πόλεις指城邑，ὀχυράς强调防御坚固；现代汉语“坚城”简洁而准确地表达“设防坚固的城”。
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: 埃及境内
  rationale: 表达这些坚城位于埃及之地；“境内”符合现代汉语地理叙述，同时不改变原文范围。
- source_word: ἔλαβεν
  choice: 夺取
  rationale: 保留第三人称单数，与前句复数主语形成原文所有的转换；在战事语境中“夺取”比泛指的“拿取”自然。
- source_word: τὰ σκῦλα
  choice: 战利品
  rationale: 该词指战争中从敌方取得的财物；“战利品”是清楚、常用且庄重的现代汉语对应词。
- source_word: γῆς Αἰγύπτου
  choice: 埃及地
  rationale: 保留属地表达，并与前句“埃及境内”在中文中形成自然但不机械重复的措辞。
theological_decisions:
- issue: 前句复数动词与后句单数动词之间的转换
  choice: 译作“他们攻占……；他又夺取……”
  alternative: 统一译成“他们……他们……”或“他……他……”
  rationale: 希腊文由复数κατελάβοντο转为单数ἔλαβεν。译文保留这一转换，使军队攻城与作为主要行动者的“他”夺取战利品之间的张力不被抹平，也不额外指明单数主语的身份。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事文体。“坚城”和“战利品”简洁传达军事语境；用分号清楚呈现两个紧密相连、主语数却不同的分句。
