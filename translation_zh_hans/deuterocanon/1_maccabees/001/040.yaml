translation_notes:
  register: 采用现代、庄重而略带诗性的汉语。前半句以“有多少……就……多少”重现希腊文的比例关系；后半句保留从尊高到哀恸的强烈逆转。全句继续使用阴性第三人称“她”，对应上下文中被人格化的城。
