  text: According to her glory[a], her dishonor was multiplied[b], and her exaltation was turned into mourning.
translation:
  language: zh_hans
  text: 她的荣耀有多大，她的羞辱就增多多少[a]；她的高位[b]转为哀恸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她的羞辱照着她的荣耀增多了”。原文可表示两者彼此对应或成比例。
    reason: lexical_alternative
  - marker: b
    text: “高位”原文直译为“高度”，在这里也可理解为“崇高”或“尊高”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: 她有多少荣耀，就……多少
  rationale: κατά加宾格在这里表示对应或比例关系。采用“有多少……就……多少”的汉语结构，清楚而自然地保留这种对应关系；δόξα译为“荣耀”，维持庄重语体，并与“羞辱”形成鲜明反差。
- source_word: ἐπληθύνθη ἀτιμασμὸς αὐτῆς
  choice: 增添了多少羞辱
  rationale: ἐπληθύνθη是简单过去时被动形式，表达数量增多；汉语用“增添了”自然传达结果。ἀτιμασμός可指不受尊重、蒙羞或受辱，译为“羞辱”既保留抽象名词结构，也与“荣耀”相对。
- source_word: τὸ ὕψος αὐτῆς
  choice: 她的尊高
  rationale: ὕψος本义为“高度”，在此诗性语境中可喻指崇高、尊贵或高位。“尊高”保留高度意象和尊贵地位两层含义，避免将其过度具体化为政治地位。
- source_word: ἐστράφη εἰς πένθος
  choice: 转为哀恸
  rationale: ἐστράφη εἰς表示转变为另一种状态。“转为”保留逆转意象；πένθος指哀伤、悲痛或哀悼，“哀恸”适合本句庄重而诗性的语体。
