  yaml_path: translation/deuterocanon/1_maccabees/001/028.yaml
  text: And the earth shook for those who dwelt on it[a], and the whole house of Jacob clothed itself with shame.
translation:
  language: zh_hans
  text: 大地在其居民中震动[a]；雅各全家都披上了羞耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“土地震动。”希腊语 γῆ 既可指“大地”，也可指“土地、国土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: 震动
  rationale: 该词是 σείω 的不定过去时被动形式，可指被摇动或震颤。译作“震动”既自然有力，也不限定这是字面的地震还是带有修辞意味的动荡。
- source_word: ἡ γῆ
  choice: 大地
  rationale: γῆ 既可指“大地”，也可指“土地、国土”。本句采用庄重的哀歌式表达，并提到“住在其上的人”，故正文译作“大地”，同时以脚注保留“土地”的可能。
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: 因住在其上的人
  rationale: ἐπί 加宾格在这里与震动的对象或缘由相关，希腊语关系略有含混。“因住在其上的人”在现代汉语中通顺，也保留大地与其居民之间的关联，避免擅自明确为敌对意义。
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: 雅各全家
  rationale: 这是指雅各后裔整体的传统群体称谓。“雅各全家”保留原文的家族意象和圣经语体，不直接解释成“全以色列”。
- source_word: ἐνεδύσατο
  choice: 披上了
  rationale: ἐνδύω 的中间语态在此有“给自己穿上、披上”之意。“披上”保留原文把羞耻比作衣服的具体意象，并符合汉语诗性表达。
- source_word: αἰσχύνην
  choice: 羞耻
  rationale: αἰσχύνη 可表示羞耻、耻辱或羞辱。“羞耻”最直接，也能兼顾内在羞愧与公开蒙羞的意味。
theological_decisions:
- issue: γῆ 应较广地译为“大地”，还是较窄地译为“土地”
  choice: 大地
  alternative: 土地
  rationale: 上下文采用高昂的哀叹语言，“住在其上的人”也容许较广的理解。正文用“大地”保留修辞范围，但脚注注明“土地”，不把歧义强行消除。
- issue: 是否保留 ἐνεδύσατο αἰσχύνην 的穿衣隐喻
  choice: 披上了羞耻
  alternative: 蒙受了耻辱
  rationale: 原文明确以穿衣描写羞耻。保留这一隐喻可维持诗歌力度，也避免将其扁平化为纯粹抽象的陈述。
- issue: ἐπί 所表达的是缘由、临到关系，还是敌对方向
  choice: 因住在其上的人
  alternative: 在住在其上的人之下／向着住在其上的人
  rationale: 该介词结构在本句中并不完全明确。译文采用自然但不过度具体化的因果式表达，不将震动明确解释成对居民的攻击或审判。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“大地”“雅各全家”“披上了羞耻”保留原文的哀歌色彩和具体意象；分号呈现两个并列分句。
