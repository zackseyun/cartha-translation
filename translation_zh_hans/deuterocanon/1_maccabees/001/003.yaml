  text: And he passed on to the ends of the earth, and took plunder from a multitude of nations; and the earth was quiet before him, and he was exalted, and his heart was lifted up.
translation:
  language: zh_hans
  text: 他一直前行，直到地极，夺取了许多民族的战利品。大地在他面前安静下来；他被尊崇，他的心也高傲起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的心被抬高了。”这是常用来表示骄傲、自高的说法。
    reason: 说明希腊语的字面表达及其惯用含义。
lexical_decisions:
- source_word: διῆλθεν
  choice: 一路进军
  rationale: 该动词表示穿行、越过；结合征服语境译作“一路进军”，自然呈现持续向前的军事行动，又不具体限定路线。
- source_word: ἕως ἄκρων τῆς γῆς
  choice: 直到地极
  rationale: 保留原文表示世界极远之处的宏大、夸张性表达；“地极”简洁庄重，符合上下文的世界征服图景。
- source_word: ἔλαβεν σκῦλα πλήθους ἐθνῶν
  choice: 夺取了许多民族的战利品
  rationale: σκῦλα指战争中夺得的战利品；πλήθους ἐθνῶν表示众多民族，以“许多民族”准确自然地传达其范围。
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: 大地在他面前安静下来
  rationale: 保留“安静”这一意象及ἐνώπιον αὐτοῦ的“在他面前”，暗示各地在其威势下归于平静或臣服，而不把这种含义完全明说。
- source_word: ὑψώθη
  choice: 他地位尊崇
  rationale: 被动形式表达他被抬高、声势或地位上升；补出“地位”可避免与下句关于内心的“高”重复，同时保持与“成为伟大”之间的含义张力。
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: 心也高傲起来
  rationale: 希腊语字面为“他的心被抬高”，常含骄傲、自高之意。现代汉语若直译为“心被抬高”不够自然，因此正文传达其惯用含义，并以脚注保留字面形象。
theological_decisions:
- issue: ἐπήρθη ἡ καρδία αὐτοῦ的道德评价
  choice: 心也高傲起来
  alternative: 他的心也被抬高了
  rationale: 该表达通常带有骄傲的负面意味，但原文是身体意象式的惯用语，并未直接使用“骄傲”这一形容词。正文采用自然且符合语境的“高傲”，脚注注明字面表达，以保留其措辞及可能的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“地极”“战利品”保留史诗性与军事语境；分号呈现原文后半句由外在尊荣转向内心高傲的递进。
