  text: And whoever does not act according to the word of the king shall die[a].
translation:
  language: zh_hans
  text: 凡不遵照王的话行事的，必死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡不遵从王命的，必死。”希腊原文作“照王的话”；在此语境中，“话”指王的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: 凡不……行的
  rationale: ὃς ἂν配合虚拟语气表达不定、概括性的条件，即“凡……的”；ποιήσῃ在这里指照命令行事，用“行”简洁自然。
- source_word: κατὰ τὸ ῥῆμα
  choice: 照……的话
  rationale: κατά表示依照、按照；ῥῆμα本义为“话、言语”，在语境中具有命令的效力。正文保留“话”，避免把原文未明说的专门法律术语直接写入正文。
- source_word: τοῦ βασιλέως
  choice: 王的
  rationale: 属格表示这话出自王；现代汉语中“王”简明、准确，也符合本书历史叙事的语体。
- source_word: ἀποθανεῖται
  choice: 必死
  rationale: 该将来时形式直指死亡，并在此表达确定的惩罚后果；“必死”保留原文未说明执行者的含混性，不径自译为“必被处死”。
