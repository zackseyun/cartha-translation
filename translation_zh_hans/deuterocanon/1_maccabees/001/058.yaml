  yaml_path: translation/deuterocanon/1_maccabees/001/058.yaml
  text: By their power they kept doing this to Israel[b][a], to those who were found in the cities month after month.
translation:
  language: zh_hans
  text: 他们仗着自己的势力[a]，月复一月[b]这样对待在各城中被发现的以色列人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用强力”；这个希腊语短语可着重表示他们借助强制性的力量行事。
    reason: lexical_alternative
  - marker: b
    text: 直译“在每月又每月”，意思是每个月反复如此。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: 仗着自己的势力
  rationale: 将介词短语理解为表示手段；“仗着自己的势力”既保留其力量与权势的意味，也能在上下文中传达胁迫色彩，而不把它限定为实际施暴。
- source_word: ἐποίουν οὕτω
  choice: 不断这样对待
  rationale: 未完成时态表示持续或反复发生的行动；“不断”体现这一体貌，“这样对待”自然表达对人的行为。
- source_word: τῷ Ἰσραήλ
  choice: 以色列人
  rationale: 希腊文直译为“以色列”，但此处后接指人的复数分词，所指显然是以色列民众；译作“以色列人”在现代汉语中更清楚，并未额外强化为“攻击”。
- source_word: τοῖς εὑρισκομένοις
  choice: 那些……被发现的人
  rationale: 保留分词的被动意味，表明这些人被当局发现或查出；不弱化为仅仅“在场的人”。
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: 月复一月
  rationale: 原文以“每月和每月”的重复形式强调反复性；“月复一月”自然地保留这种持续、逐月发生的意味。
- source_word: ἐν ταῖς πόλεσιν
  choice: 在各城中
  rationale: πόλεις可指城市或城镇；“各城”符合古代叙事语域，也表达原文复数，而不额外加入“遍及”之意。
