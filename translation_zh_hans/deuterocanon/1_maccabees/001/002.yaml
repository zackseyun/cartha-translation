lexical_decisions:
- source_word: συνεστήσατο
  choice: 发动了
  rationale: 在 συνεστήσατο πολέμους 这一搭配中，动词指发起、进行战争；“发动了”在现代汉语中自然，并保留其主动用兵的意味。
- source_word: πολέμους πολλούς
  choice: 多次战争
  rationale: πόλεμος 的复数泛指多场军事冲突；“多次战争”比“多次战役”范围更广，也较符合汉语表达。
- source_word: ἐκράτησεν
  choice: 夺取了
  rationale: κρατέω 在此指以武力取得并控制；“夺取了”准确体现军事语境中的强制占领。
- source_word: ὀχυρωμάτων
  choice: 许多要塞
  rationale: ὀχύρωμα 指设防之地或堡垒；“要塞”简洁、自然，并明确表达军事防御设施。汉语补出“许多”，按上下文概括其复数，而非主张希腊文另有数量形容词。
- source_word: ἔσφαξεν
  choice: 屠杀了
  rationale: σφάζω 是语气强烈的杀戮用词；“屠杀了”保留其血腥、严厉的力度，不弱化为一般的“杀死”。
- source_word: βασιλεῖς
  choice: 众王
  rationale: βασιλεύς 明确指君王；“众王”既保留复数，也比“统治者”更忠实于具体政治称号。
