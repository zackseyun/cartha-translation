  yaml_path: translation/deuterocanon/1_maccabees/001/036.yaml
  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
translation:
  language: zh_hans
  text: 它成了伏击圣所的伏兵，也成了不断与以色列作对的凶恶仇敌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凶恶的毁谤者”。希腊语διάβολος可指毁谤者、控告者或仇敌；本节的敌对语境较支持“仇敌”。
    reason: 保留διάβολος的词义范围，并说明正文按上下文作出的选择。
lexical_decisions:
- source_word: ἐγένετο
  choice: 成了
  rationale: 表达γίνομαι所指向的形成或结果状态，也承接上文所述对象后来发挥的敌对作用。
- source_word: εἰς ἔνεδρον
  choice: 针对……的埋伏
  rationale: ἔνεδρον可指埋伏或设伏之处；此处保留军事敌对意象，又不额外限定为具体建筑。
- source_word: τῷ ἁγιάσματι
  choice: 圣所
  rationale: ἁγίασμα指分别为圣之处；在耶路撒冷圣殿语境中，“圣所”自然准确，同时不把范围过度具体化。
- source_word: εἰς διάβολον πονηρόν
  choice: 凶恶仇敌
  rationale: διάβολος在此历史叙事中是普通名词，可指毁谤者、控告者或仇敌；与前句军事敌对语境并列时，“仇敌”最贴切。πoνηρόν译为“凶恶”，体现其邪恶且具有危害性的性质。
- source_word: τῷ Ἰσραήλ
  choice: 与以色列作对
  rationale: 以自然汉语明确表达此处与敌对谓语相连的与格关系。
- source_word: διὰ παντός
  choice: 不断
  rationale: 准确表达持续、经常发生的时间意义，并自然修饰“作对”。
theological_decisions:
- issue: διάβολον应译作带专名意味的“魔鬼”，还是普通名词
  choice: 普通名词“仇敌”
  alternative: 魔鬼；毁谤者；控告者
  rationale: 本节描述堡垒或驻军对以色列所起的敌对作用，并非指一个超自然位格。译作“魔鬼”会把后来的专名用法读入当前历史语境；脚注则保留该词“毁谤者”等词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“针对圣所的埋伏”保留原文简洁而略具张力的比喻；“不断与以色列作对”避免生硬直译与格，同时保留持续的敌对含义。
