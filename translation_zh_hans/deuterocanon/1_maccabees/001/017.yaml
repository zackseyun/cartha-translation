  text: And he entered Egypt with a heavy force, with chariots and elephants and horsemen and a great fleet.
translation:
  language: zh_hans
  text: 他率领重兵进入埃及，带着战车、战象、骑兵和一支庞大的舰队[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庞大的舰队”也可译作“庞大的军备”或“庞大的远征军”。希腊语στόλος含义较广，可指军事装备或武装远征队；在这次埃及战役的语境中，译作“舰队”较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: 直译为“进入”，既符合希腊语通常含义，也不额外加入“入侵”所带的解释性语气；军事背景已表明此行带有敌意。
- source_word: ὄχλῳ βαρεῖ
  choice: 率领重兵
  rationale: ὄχλος在此军事语境中指成群的部队，βαρύς表示力量雄厚、声势沉重；“率领重兵”是自然简洁的现代汉语，保留了其强大军力的意味。
- source_word: ἅρμασιν
  choice: 战车
  rationale: ἅρμα在军事语境中指战车；汉语若仅译“车”会含混，因此译作“战车”。
- source_word: ἐλέφανσιν
  choice: 战象
  rationale: 原词直指“大象”，在与战车、骑兵并列的军事清单中显然是用于作战的大象；“战象”自然且明确。
- source_word: ἱππεῦσιν
  choice: 骑兵
  rationale: 原词指骑马作战的人；“骑兵”是现代汉语中准确自然的军事称谓。
- source_word: στόλῳ μεγάλῳ
  choice: 一支庞大的舰队
  rationale: στόλος可指装备、武装远征队，也可指舰队；在埃及战役及海陆军力并列的语境中，“舰队”最为贴切，同时以脚注保留其较宽泛的可能含义。
