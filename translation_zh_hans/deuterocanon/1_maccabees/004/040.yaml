  text: And they fell facedown on the ground[a], and they sounded the signal trumpets, and they cried out to heaven.
translation:
  language: zh_hans
  text: 他们俯伏在地，吹响传令的号角[a]，向天呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“信号的号角”。“信号”一词也可能指“标志”或“旗帜”；这里很可能是指用来传递号令的号角。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: 面伏于地
  rationale: 原文直指脸朝地俯伏的姿态；“面伏于地”简洁、庄重，也没有将动作进一步解释为特定礼仪。
- source_word: ἐσάλπισαν
  choice: 吹响
  rationale: 该动词表示吹奏或吹响号角；“吹响”符合现代汉语搭配，并保留明确动作。
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: 号令的号角
  rationale: 属格短语很可能说明号角用于发出信号或号令；此译法较贴近原文形式，同时脚注保留“旗帜”的可能理解。
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: 向天呼求
  rationale: ἐβόησαν含大声呼喊之意，εἰς οὐρανόν表示朝向天；上下文带有求告意味，故译为“向天呼求”，不明确补出呼求对象。
theological_decisions:
- issue: “向天”是否应明确译为向上帝祈求
  choice: 保留“向天呼求”
  alternative: 向上帝呼求
  rationale: 希腊文只明说“向天”，没有直接出现“上帝”；保留原文的委婉表达，避免把隐含对象写成明示对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“面伏于地”保留经文语体但不显古奥；三个并列动作依照希腊原文顺序呈现。
