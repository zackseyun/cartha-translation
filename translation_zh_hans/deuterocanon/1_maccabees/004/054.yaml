base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: zh_hans
  text: 正是列国玷污[a]它的那个时节、那一天，它伴着歌声、里拉琴、竖琴[b]和钹，被重新奉献。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎”。这个希腊语动词在神圣事物的语境中，可指使其成为俗污或不洁。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“竖琴”的古代弦乐器（κινύραις），其确切形制不能确定，也可较宽泛地译作“弦乐器”。
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: 正值……的那个时节、那个日子
  rationale: 保留原文“时节”与“日子”的双重时间表达，同时用自然的现代汉语呈现其时间对应关系。
- source_word: ἐβεβήλωσαν
  choice: 玷污
  rationale: 该动词在圣所语境中指使神圣之物成为俗污或遭到亵渎；“玷污”通俗而庄重，脚注保留“亵渎”这一可能译法。
- source_word: αὐτό
  choice: 它
  rationale: 原文仅用代词，具体所指须由上文确定；保留代词可避免在本节中擅自明确为祭坛或圣所。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 既贴近复数名词的基本义，也符合经文历史语境，指以色列以外的各族群，避免使用带贬义或过时色彩的称呼。
- source_word: ἐν ἐκείνῃ
  choice: 就在那一天
  rationale: 保留原文重复指明同一日子的修辞强调，突出玷污与重新奉献在日期上的对应。
- source_word: ἐνεκαινίσθη
  choice: 被重新奉献
  rationale: 在敬拜与圣所语境中，该动词表示重新举行奉献礼；此译法比泛泛的“更新”更准确。
- source_word: ἐν ᾠδαῖς
  choice: 在歌声……中
  rationale: 将介词短语自然地译为举行仪式时伴随的音乐环境，不把广义的“歌”限定为某一种赞美诗。
- source_word: κιθάραις
  choice: 里拉琴
  rationale: κιθάρα属于里拉琴类弦乐器；音译兼类别名称有助于同后面的 κινύρα 区分。
- source_word: κινύραις
  choice: 竖琴
  rationale: 采用便于现代读者理解的传统近似名称，同时以脚注说明这种古代弦乐器的确切形制不能确定。
- source_word: κυμβάλοις
  choice: 钹声
  rationale: κυμβάλον指钹类打击乐器；与“歌声”并列时译作“钹声”使汉语句式自然。
theological_decisions:
- issue: 受玷污之物恢复敬拜用途的礼仪性动词
  choice: 被重新奉献
  alternative: 被更新；再次举行奉献礼
  rationale: 上下文叙述圣所敬拜在遭玷污后得到恢复。“重新奉献”保留其礼仪和历史含义，又不额外规定代词所指究竟是祭坛还是整个圣所。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。刻意保留“那个时节、那个日子……就在那一天”的重复，以传达原文强调日期完全对应的修辞；也保留代词“它”，不替上下文作过度明确的解释。
