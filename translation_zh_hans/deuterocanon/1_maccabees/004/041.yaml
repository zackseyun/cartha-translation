  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: zh_hans
  text: 于是，犹大命令人攻打堡垒[a]中的人，直到他洁净圣所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒”也可译为“阿克拉堡”，即耶路撒冷的一处设防据点。
    reason: 保留ἄκρα在本书历史语境中可能作为耶路撒冷特定要塞名称的含义。
lexical_decisions:
- source_word: ἐπέταξεν
  choice: 命令
  rationale: 该动词表示权威性地发出指令；“命令”在现代汉语中自然、准确地保留了这一力度。
- source_word: ἀνδράσιν
  choice: 一些人
  rationale: 原文直译为“人”，语境虽属军事行动，却没有明确使用“士兵”；加“一些”可自然表达犹大指派一批人执行任务，而不增添其身份。
- source_word: πολεμεῖν
  choice: 攻打
  rationale: 不定式表示受命进行的军事行动；结合明确的据点与其中之人，“攻打”比泛泛的“作战”更符合现代汉语表达。
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: 堡垒里的人
  rationale: ἄκρα可指堡垒或城堡；在《马加比一书》中很可能特指耶路撒冷的阿克拉堡。正文采用易懂的描述性译法，专名信息列入脚注。
- source_word: ἕως
  choice: 直到
  rationale: 这里标明受命作战的时间终点，即洁净圣所完成之时。
- source_word: καθαρίσῃ
  choice: 他洁净
  rationale: 单数主动虚拟式最自然地承接主语犹大；“直到他洁净”保留目的兼时间终点的关系，不改成被动表达。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 在圣殿语境中，该中性复数通常指神圣区域或圣所，而非笼统的“圣物”；“圣所”简洁且符合现代中文宗教语域。
theological_decisions:
- issue: ἄκρα所指为何
  choice: 正文译为“堡垒”，脚注说明可能特指“阿克拉堡”
  alternative: 正文直接译作“阿克拉堡”或“城堡”
  rationale: 原文形式上使用带冠词的普通名词，但在马加比时期的耶路撒冷语境中很可能指特定的阿克拉堡。描述性正文兼顾可读性，脚注则保留历史地理上的具体指向。
- issue: καθαρίσῃ的主语
  choice: 保留单数主动形式，译为“他洁净”并自然指向犹大
  alternative: 译为“圣所洁净完毕”而不明说施事者
  rationale: 希腊文动词是第三人称单数主动式，最自然的语法承接对象是犹大。保留这一点可避免把原文主动结构无根据地改成无主或被动结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式紧凑，保留叙事顺序与命令的权威语气；不把“人”擅自具体化为“士兵”，并以脚注交代历史地名的可能性。
