  text: And they tore their garments[a], and made great lamentation, and put ashes on their heads.
translation:
  language: zh_hans
  text: 他们撕裂自己的衣服[a]，大大哀哭，把灰放在头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撕裂衣服、哀哭和把灰放在头上，都是圣经文学中表达悲痛和哀悼的惯常举动。
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξαν
  choice: 撕裂
  rationale: 该动词表示撕开、扯裂；“撕裂”既准确，也符合圣经哀悼场景的庄重语体。
- source_word: τὰ ἱμάτια
  choice: 衣服
  rationale: ἱμάτια泛指衣物；“衣服”是现代汉语中自然、清楚而不过度具体的表达。
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: 大大哀哭
  rationale: 动词与同源名词连用，强调强烈而公开的哀悼。“大大哀哭”保留强度，也不额外加入捶胸等原文未明说的动作。
- source_word: σποδὸν
  choice: 灰
  rationale: σποδός指灰烬；汉语在“把灰撒在头上”这一哀悼动作中用单数集合名词“灰”最自然。
- source_word: ἐπέθεντο
  choice: 撒
  rationale: 原词基本义为放置、加在……上；结合将灰置于头上的具体动作，“撒”是自然的汉语表达，但不改变其哀悼含义。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: 在头上
  rationale: 希腊文以单数“头”配复数所有格作分配用法；现代汉语同样可自然地说“在头上”。
