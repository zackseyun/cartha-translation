  text: And the whole camp assembled, and they went up to Mount Zion.
translation:
  language: zh_hans
  text: 全军聚集起来，登上锡安山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθη
  choice: 聚集起来
  rationale: 该词为不定过去时被动形式，在这里自然表达一个群体集合到一起；现代汉语用“聚集起来”既保留集合之意，也不生硬地照译被动语态。
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: 全军
  rationale: παρεμβολή在军事语境中可指营地，也可转指驻营的军队；因其能作συνήχθη的集体主体，“全军”在汉语中最自然，并清楚表达πᾶσα所强调的整体性。
- source_word: ἀνέβησαν
  choice: 一同登上
  rationale: ἀναβαίνω表示向上行进；“登上”兼顾地势上的上行和前往锡安山的动作。“一同”承接前句的集体主体，不额外规定其行军方式。
- source_word: εἰς ὄρος Σιών
  choice: 锡安山
  rationale: εἰς在此表示移动的目的地，ὄρος Σιών按现代汉语圣经地名惯例译作“锡安山”；“登上”已包含向目的地移动的关系，无须另加“到”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“全军”比“整个营地”更符合有生命的集体主体聚集并上山的语境；“一同”使后半句的复数主语在汉语中衔接清楚。
