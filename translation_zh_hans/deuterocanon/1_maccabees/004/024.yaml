    issue: “转身回来”措辞重复
    rationale: “转身”与“回来”在此都表达返回动作；希腊文仅要求表达返回/转回，译作“回来后”更自然且不增加目的地。
  - severity: medium
    issue: “唱诗颂赞，向天献上赞美”未清晰区分两个并列动词
    rationale: “唱诗颂赞”本身已把“颂赞”纳入第一个动词短语，随后“献上赞美”造成汉语语义重复。用“唱诗并向天赞美”对应ὕμνουν与ᾐνοῦν，既保留音乐性，也保留第二个一般的赞美动作。
  - severity: low
    issue: “美善的”略不合现代汉语常用搭配
    rationale: “良善的”在现代庄重宗教语境中更通顺，并可自然表达此处礼仪公式中对神的“善”的宣告。
