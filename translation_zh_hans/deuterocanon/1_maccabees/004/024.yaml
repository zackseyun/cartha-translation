base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/024.yaml
  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: zh_hans
  text: 他们回来后，就唱诗并向天[a]赞美：“因为他是良善的[b]；他的怜悯永远长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“向天”；这里“天”是敬称性的说法，赞美实际是向上帝发出的。
    reason: cultural_note
  - marker: b
    text: 也可较直译为“因为这是好的”；希腊文没有明说主语。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: 他们转身回来
  rationale: 不定过去时分词在此表示先于主句的动作；译作“转身回来”既保留转回之意，也不补出原文未说明的目的地。
- source_word: ὕμνουν
  choice: 唱诗颂赞
  rationale: ὑμνέω指以诗歌或颂歌赞美；“唱诗颂赞”兼顾音乐性和敬拜语境。
- source_word: ᾐνοῦν
  choice: 献上赞美
  rationale: αἰνέω意为赞美。与前面的“唱诗颂赞”分开表达，以保留原文两个并列动词。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 直译为“向着天”；这里“天”是对上帝的敬称性代称，但正文不直接补入“上帝”。
- source_word: Ὅτι καλὸν
  choice: 因为他是美善的
  rationale: 希腊文省略主语，字面也可能理解为“因为这是美好的”；但后面的“他的怜悯”以及熟悉的礼仪赞美格式支持以“他”指上帝。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远长存
  rationale: 该短语在赞美公式中表示恒久不止；“永远长存”自然传达持续性。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 他的怜悯
  rationale: ἔλεος表示怜悯、慈悲或恩慈；“怜悯”直接、通俗，也避免加入希腊文本身没有明说的圣约含义。
theological_decisions:
- issue: 赞美公式中省略的主语
  choice: 正文译为“因为他是美善的”，以“他”指上帝。
  alternative: 也可较为直译作“因为这是美好的；他的怜悯永远长存”。
  rationale: “他的怜悯”以及经文所呼应的礼仪公式使人格化理解更自然；脚注保留希腊文在语法上的含混。
- issue: “天”是否直接译为“上帝”
  choice: 正文保留“向天”，并以脚注说明其敬称性用法。
  alternative: 译作“向上帝”以直接表达实际所指。
  rationale: 原文明确写的是“天”，保留这一委婉敬称可避免在正文中消除原有表达方式，同时脚注帮助现代读者理解。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“唱诗颂赞／献上赞美”保留两个赞美动词的并列；“美善”适合礼仪赞美语境，又不显古奥。脚注标记均置于正文相应位置。
