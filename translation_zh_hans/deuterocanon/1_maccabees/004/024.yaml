revisions:
- from: 他们转身回来，便唱诗颂赞，向天[a]献上赞美：“因为他是美善的；他的怜悯永远长存。”[b]
  to: 他们回来后，就唱诗并向天[a]赞美：“因为他是良善的[b]；他的怜悯永远长存。”
  rationale: 修订使汉语更自然，并更清晰地对应原文“唱诗”和“赞美”两个并列动词。正文保留“向天”的原文措辞；对于省略主语的礼仪公式，维持语境最自然的“他”指上帝，同时由脚注保留语法上的非人格可能性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:48:35Z'
