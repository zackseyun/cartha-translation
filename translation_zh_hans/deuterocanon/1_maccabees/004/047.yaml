  text: And they took whole stones according to the law[b][a], and built a new altar as before.
translation:
  language: zh_hans
  text: 他们按照律法取了完整的石头[a]，又照从前的样式筑了一座新祭坛。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未经凿削的石头”。希腊文直译为“完整的石头”；“按照律法”很可能是指律法对筑坛石头的规定。
    reason: lexical_alternative
  - marker: b
    text: “照从前的样式”也可译作“像原来的那座一样”或“像从前一样”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: 取了
  rationale: 此处指取得建筑所需的材料；“取了”直接、自然，不额外引入“收集”等源文未明说的动作。
- source_word: λίθους ὁλοκλήρους
  choice: 完整的石头
  rationale: ὁλόκληρος的基本义是完整、完好。译作“完整的石头”贴近希腊文，并避免把律法背景所暗示的“未经凿削”直接写入正文。
- source_word: κατὰ τὸν νόμον
  choice: 按照律法
  rationale: 准确表达依照律法规定而行，也保留了对妥拉中祭坛用石规定的明确指向。
- source_word: ᾠκοδόμησαν
  choice: 筑了
  rationale: 用于祭坛时，“筑”比一般性的“建造”更自然；原文只说建造，并未明确使用“重建”的词。
- source_word: θυσιαστήριον καινὸν
  choice: 一座新祭坛
  rationale: 直接表达祭坛及其新造的性质。
- source_word: κατὰ τὸ πρότερον
  choice: 照从前的样式
  rationale: 该短语可指依照先前的样式或如同从前；此译自然表达与原有祭坛或先前做法的对应，同时以脚注保留歧义。
theological_decisions:
- issue: 是否在石头的描述中明说“未经凿削”
  choice: 正文译为“完整的石头”
  alternative: 未经凿削的石头
  rationale: 希腊文形容词本身是“完整、完好”，而“按照律法”才引出未经凿削的律法背景。正文不把推论并入词义，可保留源文的措辞层次。
- issue: κατὰ τὸ πρότερον所比较的是原祭坛、原有样式，还是从前的做法
  choice: 照从前的样式
  alternative: 像原来的那座一样；像从前一样
  rationale: 希腊短语较简略，可能指先前祭坛的样式，也可能是较宽泛的“像从前一样”。正文采用自然且不过度具体的表达，并在脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“筑祭坛”为自然的经文表达；正文保留希腊文在石头性质及末尾比较短语上的含混，不作教派化阐释。
