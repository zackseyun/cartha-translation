  text: And he saw that they had been routed[a], and that they were setting the camp on fire; for the smoke that was visible made what had happened clear.
translation:
  language: zh_hans
  text: 他看见敌军已经溃退[a]，又看见他们正在放火焚烧营地；因为那看得见的烟表明了所发生的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经转身退去”或“已经被击退”；希腊文动词在这里是军事用语，可指被迫退却、逃走。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  choice: 他看见
  rationale: 采用ὁράω不定过去时的基本视觉义；后接两个ὅτι从句，表达他所观察到的情况。
- source_word: τετρόπωται
  choice: 敌军已经溃退
  rationale: τρέπω的完成时中间/被动形式在军事语境中表示被击退、转身逃走；“已经溃退”既保留完成状态，也自然传达军事败退。主语由上下文补出为“敌军”，避免汉语中“他们”与随后焚烧营地者混淆。
- source_word: ἐνπυρίζουσιν
  choice: 正在放火焚烧
  rationale: 该动词表示使燃烧、点火焚烧；现在时用“正在”呈现持续进行的动作。
- source_word: τὴν παρεμβολήν
  choice: 营地
  rationale: παρεμβολή在军事叙事中指军营或营地；“营地”简洁、自然。
- source_word: ὁ καπνὸς ὁ θεωρούμενος
  choice: 那清晰可见的烟
  rationale: 保留烟正在被观察、明显可见的含义，同时采用自然的现代汉语表达。
- source_word: ἐνεφάνιζε
  choice: 显明了
  rationale: 表达“使显露、使明显”的意思，并保留烟作为证据揭示事实的推断作用。
- source_word: τὸ γεγονός
  choice: 所发生的事
  rationale: 将完成时分词的名词化结构自然译出，指已经发生的情况。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免两个复数主体在汉语中产生歧义，首句依上下文将τετρόπωται的隐含主语明确为“敌军”，而将随后放火焚烧营地者译作“他们”。脚注保留该动词可较直译为“转身退去”或“被击退”的语义幅度。
