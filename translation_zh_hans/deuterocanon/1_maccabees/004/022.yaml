lexical_decisions:
- source_word: ἔφυγον
  choice: 逃到了
  rationale: φύγω的不定过去时在此表示从战事中逃离；“逃到了”自然地连接逃跑动作及其目的地。
- source_word: πάντες
  choice: 他们全都
  rationale: πάντες在这里作名词性用法，指前文所说的一群人；“他们全都”既补明汉语所需的主语，也保留“无一例外”的强调。
- source_word: γῆν
  choice: 地界
  rationale: γῆ在此指一个族群所居或控制的地域。“地界”符合军事—地理语境，也比“国家”少作制度性的限定。
- source_word: ἀλλοφύλων
  choice: 外族人
  rationale: ἀλλόφυλος字面指属于另一族群的人；此处宜广义理解为犹太人以外的外族，而不特指非利士人。“外族人”准确、简明，并保留族群层面的含义。
