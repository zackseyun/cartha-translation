base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: zh_hans
  text: 他们认为拆掉它是个好主意，免得它成为他们的羞辱，因为列国[a]曾玷污它；于是他们拆毁了祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外族人”。希腊语τὰ ἔθνη既可译作“列国”，在这里的犹太语境中也可指“外族人”。
    reason: 词义存在语境相关的可选译法。
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: 他们认为……是个好主意
  rationale: 按现代汉语习惯表达“有一个好主意临到他们”这一希腊语习语，同时保留共同商议并作出判断的含义。
- source_word: καθελεῖν / καθεῖλον
  choice: 拆掉 / 拆毁
  rationale: 动词表示将祭坛拆除。前者自然地表达所议之事，后者清楚说明行动已经完成，并避免中文连续重复完全相同的措辞。
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: 免得它……成为他们的羞辱
  rationale: 保留原文的防范语气，以及ὄνειδος所包含的公开羞耻、受辱之意。
- source_word: ἐμίαναν
  choice: 玷污过
  rationale: “玷污”适合祭坛受礼仪性污染的语境；“过”表明玷污先于他们当前的决定，但不过度强化时态。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 直译其复数形式，并保留它既可泛指各国、又可在犹太语境中特指外族人的含义。
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: 准确而通行地表达献祭所用的坛。
theological_decisions:
- issue: 祭坛受污染的礼仪性语言
  choice: 玷污
  alternative: 亵渎；污染
  rationale: “玷污”保留祭祀语境中的不洁含义，又不把原文进一步解释成某种特定的后期教义。
- issue: τὰ ἔθνη的群体指称
  choice: 列国
  alternative: 外族人；异教人
  rationale: “列国”保留原文在普通民族称谓与犹太语境中非犹太群体称谓之间的张力；脚注说明语境中的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“成为他们的羞辱”略带经文语体，以保留原文的公共荣辱意味；正文用“列国”并以脚注保存语境性译法。
