base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: zh_hans
  text: 求你把这营地交在你子民以色列手中[a]，使他们因自己的军力和骑兵蒙羞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”也可译作“困住”。希腊语动词的基本义是“封闭、困住”；这里指使这营地及其中的敌军落在以色列的掌控之下。
    reason: lexical_alternative
  - marker: b
    text: “因自己的军力和骑兵”也可理解为“在自己的力量和骑兵上”或“凭借自己的力量和骑兵”；“军力”原文也可泛指“力量、权势”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: 交在……手中
  rationale: 该动词的基本义是“封闭、困住”，但与“在……手中”连用，并置于求神赐下胜利的祷告语境中，表达把敌军置于以色列掌控之下。“交在……手中”既自然，也保留原文的圣经式意象。
- source_word: παρεμβολὴν
  choice: 营垒
  rationale: 该词可指营地，也可转指驻扎其中的军队。“这座营垒”保留具体的军营图景，同时可让读者理解为其中的敌军。
- source_word: εἰς χεῖρας
  choice: 在……手中
  rationale: 这是表示落入某人权下的惯用语；直译式表达在现代汉语中仍清楚、庄重。
- source_word: λαοῦ σου Ἰσραήλ
  choice: 你子民以色列
  rationale: 准确表达以色列是神的子民；汉语无需额外添加同位语标点。
- source_word: αἰσχυνθήτωσαν
  choice: 使他们……蒙羞
  rationale: 体现第三人称祈愿和被动受辱的意味；“蒙羞”比“感到羞愧”更能表达因战败而受辱。
- source_word: ἐπὶ τῇ δυνάμει
  choice: 因自己的军力
  rationale: δύναμις 可指力量、权势或军力；与“骑兵”并列时，军事力量最符合语境，但介词 ἐπί 的具体关系仍有歧义，因此以脚注说明。
- source_word: τῇ ἵππῳ αὐτῶν
  choice: 自己的……骑兵
  rationale: ἵππος 虽为单数形式，在军事语境中可作集合名词，指马队或骑兵；“骑兵”是清楚自然的现代译法。
theological_decisions:
- issue: 祷告求神把敌军交给以色列
  choice: 求你把这座营垒交在你子民以色列手中
  alternative: 求你把这座营垒困在你子民以色列手中
  rationale: 原句是在祈求神赐予军事胜利。“交在……手中”清楚保留神的主动作为和敌方落入以色列权下的含义，又不把 σύγκλεισον 的字面空间意象强行定为唯一解释。
- issue: 敌军因其力量与骑兵蒙羞的关系
  choice: 使他们因自己的军力和骑兵蒙羞
  alternative: 使他们在自己的力量和骑兵上蒙羞
  rationale: ἐπί 可表达原因、根据或相关范围；正文采用自然汉语的“因”，脚注保留“在……方面／凭借……”等可能理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补足汉语祈使句所需的自然语气；“子民”“蒙羞”保留经文风格但不过分古雅。
