  yaml_path: translation/deuterocanon/1_maccabees/004/042.yaml
  text: And he chose blameless priests[a], devoted to the law.
translation:
  language: zh_hans
  text: 他选出无可指摘、忠于律法的祭司。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他选出没有残缺、热心律法的祭司。”希腊语既可强调祭司没有缺陷，也可强调他们积极委身于律法。
    reason: 保留ἀμώμους与θελητὰς在祭司语境中的词义幅度。
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: 选出
  rationale: 该词是不定过去时，表示有意识地从众人中作出选择；“选出”自然地体现了这一动作。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 在犹太圣殿和礼仪语境中，这是ἱερεύς的标准译法。
- source_word: ἀμώμους
  choice: 无可指摘
  rationale: 该词既可指没有缺陷，也可指无可责备；在祭司资格的语境中可能兼具礼仪合宜与品行无可非议的意味。“无可指摘”保持自然庄重，并在脚注中保留“没有残缺”的礼仪性译法。
- source_word: θελητὰς
  choice: 忠于
  rationale: θελητής表示愿意、渴望或热心追求者；与νόμου连用时，表达对律法积极而坚定的委身。“忠于”符合现代汉语习惯，同时不过度强化为特定情绪。
- source_word: νόμου
  choice: 律法
  rationale: 在《马加比一书》中，该词通常指犹太祖传的律法，而非泛指法律原则；汉语“律法”已能表达这种特指意义，无须另加限定语。
theological_decisions:
- issue: νόμου应理解为泛指法律，还是特指犹太人的祖传律法
  choice: 律法
  alternative: 法律
  rationale: 本书语境中的νόμος通常指以色列的祖传律法；“律法”既传达其特指性，又不额外加入“摩西”等原文没有的限定。
- issue: ἀμώμους侧重道德上的无可责备，还是礼仪及身体上的无残缺
  choice: 正文译作“无可指摘”
  alternative: 没有残缺
  rationale: 原词本身可以涵盖无瑕疵、无缺陷和无可责备；祭司语境使礼仪资格的含义尤其可能，但原文未明确排除品行层面，因此正文采用较宽的表达，并以脚注保留礼仪色彩较强的译法。
- issue: θελητὰς表达忠诚、热心，还是单纯愿意
  choice: 忠于律法
  alternative: 热心律法
  rationale: 该词强调主动的意愿和追求。“忠于”在现代汉语中自然表达积极委身；“热心”也可能，但会更突出热情程度，故列作脚注替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无可指摘”避免过度限定ἀμώμους只指道德或身体层面；“忠于律法”简洁表达对祖传律法的积极委身。脚注标记置于整句之后，因为替代译法同时涉及两个词。
