revisions:
- from: 吕息阿看见自己的军队被击溃，又看见犹大一方生出的勇气，以及他们怎样准备好或活着、或英勇地死去，就离开那里，前往安提阿。他在那里招募外族兵士[a]，打算扩充兵力以后，再到犹太地来。
  to: 吕西亚看见自己的军队被击溃，又看见犹大一方所生出的勇气，以及他们已准备好，要么活着，要么英勇地死去，就前往安提阿，招募外籍兵士[a]，打算兵力再次增加以后，再进犹太地。
  rationale: 删除未由原文明确支持的“在那里”，以免把招募地点限定在安提阿；以“兵力再次增加”保留πάλιν；重组生死对举，使中文自然且不削弱原文的修辞平衡；将人名规范为较通行的现代译名。“外籍兵士”保留原文的外国人／外来者重点，脚注继续说明“雇佣兵”的可能解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:49:43Z'
