base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: zh_hans
  text: 吕西亚看见自己的军队被击溃，又看见犹大一方所生出的勇气，以及他们已准备好，要么活着，要么英勇地死去，就前往安提阿，招募外籍兵士[a]，打算兵力再次增加以后，再进犹太地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“招募雇佣兵。”希腊文动词直接强调招募外族人，是否特指受雇作战的人并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: 被击溃
  rationale: 在军事语境中指军阵败退、溃散；译作“被击溃”比一般的“失败”更能体现战场情形。
- source_word: σύνταξις
  choice: 军队
  rationale: 本义涉及编排整齐的军阵或部队；此处用现代汉语“军队”自然地指吕息阿麾下的作战力量。
- source_word: θάρσος
  choice: 勇气
  rationale: 表示勇气、胆量或无畏；“勇气”庄重自然，并与下文准备生死相承。
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  choice: 犹大一方生出的勇气
  rationale: 希腊文形式上可直译为“犹大的勇气”，但随后的复数主语表明所指包括犹大一方的人；“犹大一方”既交代群体所指，也保留表达的凝练。
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: 他们怎样准备好或活着、或英勇地死去
  rationale: 保留“活着/死去”的对称结构；γενναίως兼有英勇、高尚之意，此处“英勇地”最贴合战斗语境。
- source_word: ἀπῆρεν
  choice: 离开那里，前往
  rationale: 表达离去并转往安提阿；补出目的地连接，使中文叙事自然，但不把它强化为战术性“撤退”。
- source_word: ἐξενολόγει
  choice: 招募外族兵士
  rationale: 该动词直接强调招募外来者或外国人，并未明说受雇性质；因此不径译为“雇佣兵”。
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: 扩充兵力以后
  rationale: 短语表示人数或力量增加；结合军事上下文，译作“扩充兵力”简洁自然。
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: 再到犹太地来
  rationale: 保留再次前来的意思和进入该地区的方向感；“犹太地”适合古代地域名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“或活着、或英勇地死去”有意保留原文略显张力的生死对举，不改写为单纯的“战至死方休”。“犹大一方”说明后接复数“他们”的群体所指。
