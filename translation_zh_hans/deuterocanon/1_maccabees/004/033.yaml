  yaml_path: translation/deuterocanon/1_maccabees/004/033.yaml
  text: Strike them down with the sword of those who love you, and let all who know your name praise you with hymns.
translation:
  language: zh_hans
  text: 求你用爱你之人的刀剑击倒他们；愿所有认识你名的人都以颂歌赞美你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: 击倒
  rationale: 保留命令式祈求的力度，表达使敌人倒下而不额外限定具体死亡方式。
- source_word: ῥομφαίᾳ ἀγαπώντων σε
  choice: 用爱你之人的刀剑
  rationale: 按希腊语工具格及属格结构直译，刀剑属于“爱你的人”；不将其改释为抽象的能力或武力。
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: 认识你名的人
  rationale: 保留圣经语境中“认识……的名”的关系性表达，不简化为仅仅知道称呼。
- source_word: ἐν ὕμνοις
  choice: 以颂歌
  rationale: 自然表达凭借或藉着颂歌施行赞美，保留复数所表达的诗歌性赞颂。
theological_decisions:
- issue: 祈求上帝藉忠于他的人施行军事审判
  choice: 保留直接祈求及“爱你之人的刀剑”这一施行方式
  alternative: 弱化为“求你使他们败在爱你之人的刀下”
  rationale: 原文以命令式直接向上帝祈求，并明确使用工具格“用刀剑”；译文不淡化其中的战争与审判张力。
translation_notes:
  register: 采用现代、庄重且便于诵读的祷告语体。“求你……；愿……”清楚呈现两个并列的祈愿句。“你名”保留经文惯用表达。
