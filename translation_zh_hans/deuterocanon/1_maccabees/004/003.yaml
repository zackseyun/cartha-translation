  text: And Judas heard, and he and the mighty men set out to strike the king’s force that was at Emmaus,
translation:
  language: zh_hans
  text: 犹大听见了，他和勇士们就出发，要攻打在以马忤斯的王军。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 保留原文未明说所听内容的表达；在叙事语境中也可自然理解为听到消息，而不另行补足宾语。
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 表达为采取行动而离开的意思，不额外指定路线、地势或行军队形。
- source_word: οἱ δυνατοὶ
  choice: 勇士们
  rationale: 兼顾“强有力者”的字面意义和军事语境；不添加原文没有的所属代词。
- source_word: πατάξαι
  choice: 要攻打
  rationale: 表达不定式所指的行动目的，同时不预先断定战斗结果；现代汉语中比直译为“击打”更自然。
- source_word: τὴν δύναμιν
  choice: 王军
  rationale: δύναμις在此指军事力量；与τοῦ βασιλέως合译为“王军”，简洁自然，又不暗示战果。
- source_word: τοῦ βασιλέως
  choice: 王军
  rationale: 将属格关系自然地并入“王军”，即属于王的军队。
- source_word: τὴν ἐν Ἐμμαούμ
  choice: 驻在以马忤斯的
  rationale: 清楚表达该军队所在之处；“驻在”符合军事上下文，但仅表位置，不进一步说明部署性质。
