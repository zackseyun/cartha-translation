base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/023.yaml
  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: zh_hans
  text: 犹大回去收取营中的战利品；他拿了许多金银、蓝色布料、紫色布料、海洋货物[a]，以及大量财富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海蓝色布料”或“海紫色布料”。希腊文直译为“海的”，在这份贵重物品清单中确切指什么，不能确定。
    reason: 保留θαλασσίαν所指不明的词义歧义。
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: 回去
  rationale: 该动词表示返回或转回；“回去”自然地表达犹大返回营地战利品所在之处。
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: 营中的战利品
  rationale: σκυλία指从敌方夺得的物品，παρεμβολή在这里指军营；此译清楚保留二者的关系。
- source_word: ἔλαβε
  choice: 他拿了
  rationale: 希腊文动词为第三人称单数，与主语犹大一致；虽然犹大可能代表其部众行动，正文不把单数改为复数。
- source_word: ὑάκινθον
  choice: 蓝色布料
  rationale: 该词可指风信子般的蓝色或蓝紫色，也可指这种颜色的织物；在贵重物品清单中译作布料最自然。
- source_word: πορφύραν
  choice: 紫色布料
  rationale: 该词可指紫色染料或紫色织物；与前一项并列时，贵重布料的含义合乎语境。
- source_word: θαλασσίαν
  choice: 海产物
  rationale: 该阴性形容词字面义为“海的、海产的”，在此独立用作名词，确切所指不明；正文采用较宽泛的译法，并以脚注保留也可能指海蓝色或海紫色布料。
- source_word: πλοῦτον μέγαν
  choice: 大批财物
  rationale: 该短语概括所得的大量贵重物品；“大批财物”在现代汉语中自然简洁。
theological_decisions: []
