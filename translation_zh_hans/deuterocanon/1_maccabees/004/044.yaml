  yaml_path: translation/deuterocanon/1_maccabees/004/044.yaml
  text: And they deliberated concerning the defiled altar of burnt offering[a], what they should do with it.
translation:
  language: zh_hans
  text: 他们商议该怎样处置那座被玷污的燔祭坛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被亵渎的燔祭坛”或“被渎圣的燔祭坛”。
    reason: 词义替代译法：βεβηλωμένου可指礼仪上的受污，也可强调祭坛的神圣性遭到亵渎。
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: 他们商议
  rationale: 中间语态在此表示众人共同商讨，而不只是作出最后决定；“商议”自然、庄重，并保留集体斟酌之意。
- source_word: θυσιαστηρίου
  choice: 祭坛
  rationale: 该词通常指“祭坛”；其后的属格已说明祭坛的用途，汉语合译为“燔祭坛”最为简洁自然。
- source_word: ὁλοκαυτώσεως
  choice: 燔祭
  rationale: 指祭物全部焚烧献上的祭；“燔祭”是准确而通行的中文圣经术语，与“坛”组合为“燔祭坛”。
- source_word: βεβηλωμένου
  choice: 被玷污的
  rationale: 完成时被动分词表明祭坛已经遭到礼仪或神圣意义上的污染、亵渎；“被玷污”既保留祭仪语境，也不额外强化主观恶意。
- source_word: τί αὐτῷ ποιήσωσιν
  choice: 该怎样处理
  rationale: 在商议语境中，此从句询问应当如何处置该祭坛；“怎样处理”是现代汉语中自然的表达，也避免把 αὐτῷ 限定为单纯“对它做什么”。
theological_decisions:
- issue: 祭坛受损状态的礼仪性描述
  choice: 被玷污的燔祭坛
  alternative: 被亵渎的燔祭坛／遭到污损的燔祭坛
  rationale: βεβηλωμένου 表示祭坛的神圣或礼仪状态已遭破坏。“被玷污”保留这种祭仪含义；“被亵渎”更突出侵犯神圣性，也属可行译法，但语气稍强。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭坛”保留经文的祭祀语境；调整希腊语从句次序，将商议内容前置，使整句符合自然汉语表达。
