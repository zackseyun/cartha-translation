  yaml_path: translation/deuterocanon/1_maccabees/004/021.yaml
  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
translation:
  language: zh_hans
  text: 他们看见这一切，就非常害怕；又看见犹大的军队在平原上准备列阵作战，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已准备投入战斗”。希腊文的军事用语指为排成战斗队形或部署而作好准备。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: 看见
  rationale: 该分词在这里表示观察到眼前情形；译作“看见”自然清楚，也不把含义过度限定为内心的“意识到”。
- source_word: ἐδειλώθησαν σφόδρα
  choice: 就非常害怕
  rationale: 动词表示因恐惧而胆怯、丧失勇气，σφόδρα加强语气；“非常害怕”以现代汉语自然传达强烈恐惧，同时不额外添加心理或军事解释。
- source_word: παρεμβολή
  choice: 军队
  rationale: παρεμβολή可指营地、军营，也可按语境指驻扎的军队。由于下文说其在平原上已准备列阵，此处译作“军队”最符合可见且能列阵的主体。
- source_word: ἐν τῷ πεδίῳ
  choice: 在平原上
  rationale: πεδίον指平坦开阔之地；“在平原上”保留地理和战场语境。
- source_word: ἑτοίμην εἰς παράταξιν
  choice: 已经列阵待战
  rationale: ἑτοίμην表示准备就绪，παράταξις专指军队的列阵或战斗队形；“列阵待战”兼顾军事术语的具体性与现代中文的流畅度。
