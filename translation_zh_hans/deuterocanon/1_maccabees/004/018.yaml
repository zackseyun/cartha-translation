base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: zh_hans
  text: 哥尔吉亚和那支军队就在我们附近的山区[a]。但现在，你们要挺身抵挡我们的敌人，与他们交战；此后，要放胆夺取战利品[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就在我们附近的山上。”希腊语既可指某一座山，也可泛指山地地区。
    reason: lexical_alternative
  - marker: b
    text: “放胆夺取战利品”也可译作“放心地夺取战利品”或“勇敢地夺取战利品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γοργίας
  choice: 哥尔吉亚
  rationale: 按现代汉语常见的希腊人名音译方式处理，并保持专名辨识度。
- source_word: δύναμις
  choice: 军队
  rationale: 此处为军事语境，指哥尔吉亚所率领的武装力量；“军队”自然明确，又不具体限定其编制或规模。
- source_word: ἐν τῷ ὄρει
  choice: 在山区
  rationale: ὄρος 的单数形式既可指一座山，也可泛指山地；正文采用符合军事地理语境的“山区”，并以脚注保留“山上”的可能。
- source_word: ἐγγὺς ἡμῶν
  choice: 就在我们附近
  rationale: 准确表达空间上的接近；“就在”也传达敌军迫近所带来的紧迫感。
- source_word: στῆτε ἐναντίον
  choice: 挺身抵挡
  rationale: 兼顾“站立”和“面对、反抗”的军事含义，比直译“站在……面前”更符合现代汉语战斗命令的表达。
- source_word: πολεμήσατε
  choice: 与他们交战
  rationale: 直接表达投入战斗的命令，语体庄重而自然。
- source_word: σκῦλα
  choice: 战利品
  rationale: 指胜利后从敌方取得的物品；“战利品”在现代汉语中准确、清楚。
- source_word: μετὰ παρρησίας
  choice: 放胆
  rationale: παρρησία 在此表示无所畏惧、充满把握地行动；“放胆”简洁地保留其勇敢与自信意味。
