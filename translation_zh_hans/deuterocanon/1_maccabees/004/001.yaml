  yaml_path: translation/deuterocanon/1_maccabees/004/001.yaml
  text: And Gorgias took five thousand men and one thousand chosen horsemen[a], and the camp set out by night,
translation:
  language: zh_hans
  text: 哥尔基雅带领五千人和一千名精选骑兵，营中部队[a]在夜间出发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营中部队”原文直译为“营地”或“营”；该词也可集合性地指驻营的部队。
    reason: 说明ἡ παρεμβολή的字面义及其在本句中指可出发的驻营部队的集合性用法。
lexical_decisions:
- source_word: παρέλαβεν
  choice: 带领
  rationale: 此处指哥尔基雅带上或率领随后列出的军兵。“带领”符合军事叙事，且不刻意限定为接收军队或正式接掌指挥权。
- source_word: πεντακισχιλίους ἄνδρας
  choice: 五千人
  rationale: ἄνδρας直译为“人（男子）”；上下文已明确是军事人员，无须增译为“士兵”。
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: 一千名精锐骑兵
  rationale: ἵππον在这里是集合用法，指骑兵；ἐκλεκτήν表示经过挑选、优选。“精锐骑兵”自然传达这支骑兵是精选部队。
- source_word: ἀπῆρεν
  choice: 出发
  rationale: 该动词表示离开、启程；“出发”准确而自然，不额外强化为“进军”或“开拔”。
- source_word: ἡ παρεμβολή
  choice: 营队
  rationale: παρεμβολή字面可指营地，也可集合性地指驻营的部队。因静止的营地不能出发，“营队”既保留“营”的意象，也清楚表达行动主体是驻营军队。
- source_word: νυκτός
  choice: 在夜间
  rationale: 该属格在此作时间状语，表示行动发生于夜间；“在夜间”不额外加入“趁夜”所暗示的策略目的。
