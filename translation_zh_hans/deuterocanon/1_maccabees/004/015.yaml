base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: zh_hans
  text: 但敌军中所有殿后的人都倒在刀剑之下；犹太军追击他们，直到加扎拉[a]，又追到犹地亚的平原、阿佐托和雅姆尼亚[b]。敌军中约有三千人被杀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加扎拉”是希腊文地名，通常认为就是基色。
    reason: cross_reference
  - marker: b
    text: “阿佐托”是亚实突的希腊文名称；“雅姆尼亚”通常认为就是雅比聂（今称亚夫内）。
    reason: cross_reference
  - marker: c
    text: 或译：“他们中有三千人倒下。”希腊文以“人”计数，指敌军中战死者的数目。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: 但留在后面的敌军全都
  rationale: ἔσχατοι本义为“最后面的”，在此军事语境中指队伍后方的人。译作“留在后面的敌军”比“后卫”更谨慎，因为原文未明确使用专指后卫部队的术语；补出“敌军”则承接上下文并使中文指代清楚。
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: 倒在刀剑之下
  rationale: 保留“倒下”与刀剑的战斗意象，同时按汉语习惯表达战死。
- source_word: ἐδίωξαν αὐτοὺς
  choice: 他们追击敌军
  rationale: ἐδίωξαν在战事中意为“追击”；将代词宾语明示为“敌军”，避免连续代词在中文中造成施受混淆。
- source_word: ἕως Γαζήρων
  choice: 直到加扎拉
  rationale: 按希腊文本的地名形式Γαζήρων音译，不在正文中直接改用其通常对应的希伯来地名“基色”。
- source_word: τῶν πεδίων τῆς Ἰουδαίας καὶ Ἀζώτου καὶ Ἰαννείας
  choice: 犹地亚、阿佐托和雅姆尼亚的平原
  rationale: πεδίων译作“平原”；并列属格自然理解为与犹地亚、阿佐托、雅姆尼亚相关的平原地区。三个名称均依希腊形式处理。
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: 敌军约有三千人被杀
  rationale: εἰς ἄνδρας加数词是统计人数的惯用结构，可表达约数；“被杀”在中文中清楚说明这里的“倒下”指阵亡，而不是仅仅跌倒。
