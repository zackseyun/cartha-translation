revisions:
- from: 但留在后面的敌军全都倒在刀剑之下；他们追击敌军，直到加扎拉[a]，又追到犹地亚、阿佐托和雅姆尼亚[b]的平原。敌军约有三千人被杀[c]。
  to: 但敌军中所有殿后的人都倒在刀剑之下；犹太军追击他们，直到加扎拉[a]，又追到犹地亚的平原、阿佐托和雅姆尼亚[b]。敌军中约有三千人被杀[c]。
  rationale: 修订仅解决中文主语指代造成的叙事矛盾，并使地理并列关系和数词脚注更清楚。“犹太军”是从紧邻上下文所承接的追击者，并非改变本节所述事件；其余用语、地名音译和战斗意象均予保留。
