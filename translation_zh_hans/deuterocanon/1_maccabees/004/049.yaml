base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: zh_hans
  text: 他们制作了新的圣器具，把灯台、燔祭和香的祭坛[a]以及桌子带进圣所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“燔祭坛和香坛。”希腊文作单数“祭坛”，而“燔祭”和“香”都与此词相连；不过按圣殿器物的通常对应，也可理解为两个祭坛。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣所”指圣殿的主体建筑，不是整个圣殿区域。
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: 制造了
  rationale: 在本节制造替代用圣物的语境中，表示实际制成器具；“制造”清楚自然，也不额外强调工艺细节。
- source_word: τὰ σκεύη τὰ ἅγια καινά
  choice: 新的圣器具
  rationale: σκεύη在圣殿语境中泛指礼仪用品或器具；“圣器具”比单用“器皿”涵盖面更广，καινά明确表示新制的。
- source_word: εἰσήνεγκαν
  choice: 搬进
  rationale: 该动词与εἰς连用，明确表达把实物带入某处；这里所列的是大型陈设，“搬进”符合现代汉语。
- source_word: τὴν λυχνίαν
  choice: 灯台
  rationale: λυχνία在圣所陈设语境中指承放灯盏的灯台，而非单独一盏灯。
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: 献燔祭和香的祭坛
  rationale: 按现有希腊文本的句法，两个属格短语都与单数“祭坛”相连；译文保留这一表层结构及其可能产生的张力，不擅自补出第二个祭坛。
- source_word: τὴν τράπεζαν
  choice: 桌子
  rationale: 原文只说“桌子”，未明说陈设饼；正文保持简洁，不补入隐含用途。
- source_word: εἰς τὸν ναόν
  choice: 搬进圣所
  rationale: ναός在此指圣殿的圣所建筑，而不是整个圣殿范围；“圣所”在中文中准确体现这一空间区别。
theological_decisions:
- issue: 一个祭坛还是两个熟知的圣殿祭坛
  choice: 正文依照希腊文单数形式译作“献燔祭和香的祭坛”
  alternative: 按圣殿陈设的常识理解为“燔祭坛和香坛”
  rationale: 希腊文只有一个单数θυσιαστήριον，却以两个属格“燔祭”和“香”修饰它。历史语境通常使人想到两个不同祭坛，但正文不应无声地改写文本；脚注说明另一种理解。
- issue: 是否扩展“桌子”的用途
  choice: 仅译作“桌子”
  alternative: 译作“陈设饼桌”或“摆放供饼的桌子”
  rationale: 虽然具体所指可由圣殿背景辨认，原文本节并未明说其用途，故不在正文增加解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣器具、灯台、燔祭、祭坛、圣所”保留必要的礼仪术语；语序贴近希腊文，同时用“搬进”使大型陈设的移动在中文中自然。脚注标记按正文出现顺序排列。
