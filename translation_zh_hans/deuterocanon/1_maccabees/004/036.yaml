base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/036.yaml
  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: zh_hans
  text: 犹大和他的兄弟们说：“看，我们的仇敌已经被击溃了。我们上去[a]洁净圣所，并为它举行奉献礼[b]吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上去”保留了希腊原文的方向含义，可能指上到耶路撒冷及圣殿山。
    reason: cultural_note
  - marker: b
    text: 此词也可译作“启用”；根据上下文，这里是指圣所遭玷污、得到洁净之后重新举行奉献礼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: 说
  rationale: 普通叙事用语，准确自然地表达 λέγω 的简单过去时动作。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用中文圣经传统中对该人名的通行译法。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的兄弟们
  rationale: 按亲属意义直译，同时使用现代汉语中自然、明确的表达。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 保留引人注意的语气，又避免使用过于古雅的“看哪”。
- source_word: συνετρίβησαν
  choice: 已经被击溃了
  rationale: 该动词本义有打碎、粉碎之意；在军事语境中，“击溃”自然地表达决定性的败北，并保留被动形式。
- source_word: οἱ ἐχθροὶ ἡμῶν
  choice: 我们的仇敌
  rationale: 准确表达原文的所属关系；“仇敌”符合庄重的历史叙事语体。
- source_word: ἀναβῶμεν
  choice: 我们上去……吧
  rationale: 表达劝勉性虚拟语气，并保留“上去”的方向含义，可能指登上耶路撒冷及圣殿所在之处。
- source_word: καθαρίσαι
  choice: 洁净
  rationale: 在圣殿语境中具有礼仪性的洁除污秽之义，比单纯的“打扫干净”更准确。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 该中性复数短语字面也可指“圣物”或“神圣之处”，但本段圣殿修复语境明确指向圣殿的神圣区域；“圣所”简洁清楚。
- source_word: ἐγκαινίσαι
  choice: 为它举行奉献礼
  rationale: 表达该动词“奉献、启用”的核心含义，而不在正文中强行加入原词未明说的“重新”；上下文仍清楚表明这是受玷污圣所恢复后的奉献。
theological_decisions:
- issue: τὰ ἅγια 与 καθαρίσαι 在圣殿礼仪语境中的理解
  choice: 洁净圣所
  alternative: 洁净圣物；使圣所洁净
  rationale: 上下文所述是恢复耶路撒冷圣殿；“洁净圣所”既保留礼仪含义，也不把所指缩限为器物。
- issue: ἐγκαινίσαι 是否明确译成“重新奉献”
  choice: 举行奉献礼
  alternative: 重新奉献；举行启用礼
  rationale: 希腊词本身可表示奉献或启用，并未以词形明确标出“重新”。历史语境确实是圣所遭玷污后的恢复，因此脚注说明“重新奉献”的语境含义，同时正文保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看”保留现场感；“已经被击溃了”体现胜利结果；两个脚注分别说明地理方向和奉献用语的词义及语境，没有在正文中消除原文可保留的含义张力。
