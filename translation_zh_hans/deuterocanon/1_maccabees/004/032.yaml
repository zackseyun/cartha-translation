base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/032.yaml
  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: zh_hans
  text: 求你使他们胆怯，使他们仗恃力量的胆气消融；愿他们因自己的毁灭而动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他们因自己的粉碎而动摇。”末句也可理解为“愿他们在自己的毁灭中动摇”；“毁灭”可泛指败亡或破灭，不必限于军事上的击溃。
    reason: 词义与句法存在可保留的另一种理解。
lexical_decisions:
- source_word: δὸς
  choice: 使
  rationale: 在祈求句中，“使他们……”自然传达 δίδωμι 命令式“给他们、加给他们”的使役含义，同时保持直接有力。
- source_word: δειλίαν
  choice: 胆怯
  rationale: δειλία 指怯懦、畏缩，不只是一般的惧怕；“胆怯”在现代汉语中自然，也适合军事语境。
- source_word: τῆξον
  choice: 使……消融
  rationale: 保留“熔化、消解”的鲜明隐喻，表达敌方勇气的瓦解，避免弱化为单纯的“削弱”。
- source_word: θράσος
  choice: 勇气
  rationale: θράσος 可指大胆、悍勇，也可带狂妄色彩；此处译作“勇气”保留其军事上的胆量，不额外加入道德评判。
- source_word: ἰσχύος
  choice: 力量
  rationale: ἰσχύς 表示力量、强力；以“仗着力量而有的勇气”自然表达属格关系，又不把关系解释得过死。
- source_word: σαλευθήτωσαν
  choice: 使他们……惊慌
  rationale: σαλεύω 的被动命令式可表示被震动、动摇或扰乱；“惊慌”在敌军被击溃的语境中自然呈现其失稳状态。
- source_word: συντριβῇ
  choice: 被击溃
  rationale: συντριβή 可指粉碎、击破、毁灭；“被击溃”保留具体猛烈的军事意象，同时比直译“粉碎”更符合现代汉语。
- source_word: αὐτῶν
  choice: 自己
  rationale: 译出该代词与主语的关联，使末句明确指他们自身遭到击溃，而非别人的毁灭。
theological_decisions:
- issue: 咒诅式祈祷的直接性
  choice: 保留求上帝使敌人胆怯、勇气消融并因被击溃而惊慌的直接祈求。
  alternative: 弱化为泛指敌人失败或受挫。
  rationale: 希腊文明确以命令式向上帝祈求针对敌军的行动；译文不因现代读者的感受而淡化其神学张力和修辞力度。
- issue: τῇ συντριβῇ αὐτῶν 的关系
  choice: 译为“因自己被击溃”，将与格理解为原因或情境。
  alternative: 译为“在他们毁灭时”或“因他们的毁灭”。
  rationale: 原文可指在击溃中受到震动，也可指因毁灭而惊慌；正文采用自然的因果表达，脚注保留较宽泛的“毁灭”理解。
translation_notes:
  register: 采用现代、庄重而直接的祈祷语言。句式保留三个并列祈求的推进感；“消融”维持原文的熔化隐喻，“被击溃”则兼顾具体力度与普通读者的可理解性。
