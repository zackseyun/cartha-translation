lexical_decisions:
- source_word: ἐγενήθη
  choice: 获
  rationale: 这里的 γίνομαι 表示某事发生、形成结果；与“拯救”搭配译为“获”，符合现代汉语习惯，并自然表达以色列蒙受这一结果。
- source_word: σωτηρία
  choice: 拯救
  rationale: 本节处于军事历史语境，指以色列实际脱离敌军威胁。“拯救”保留了救援、解危的广度，不把含义缩窄为单纯的战场胜利。
- source_word: μεγάλη
  choice: 大
  rationale: 直接修饰并加强“拯救”的程度；“大获拯救”在现代汉语中自然、有力。
- source_word: τῷ Ἰσραήλ
  choice: 以色列
  rationale: 与“获”构成受益者兼主体的自然汉语表达，同时保留希腊文对民族共同体“以色列”的称呼。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 准确表达特定日期及指示词 ἐκείνῃ；置于句首符合汉语时间状语的常见次序。
