base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: zh_hans
  text: 他们一连八天举行祭坛奉献礼，欢欢喜喜地献上全燔祭，又献上救恩与赞美之祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩之祭”或译“平安祭”。希腊文σωτηρίου可指救恩、拯救或安康，在献祭语境中也可用作平安祭的名称。
    reason: 保留σωτηρίου在普通语义与礼仪专名之间的真实歧义。
lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  choice: 举行……奉献礼
  rationale: ἐποίησαν在此与ἐγκαινισμός构成举行礼仪的表达，不宜机械译作“做”；“奉献礼”既体现祭坛重新启用、奉献的事件，也符合现代汉语宗教语体。
- source_word: τοῦ θυσιαστηρίου
  choice: 祭坛
  rationale: θυσιαστήριον指用于献祭的坛；“祭坛”准确、简明，并保留礼仪语境。
- source_word: ἡμέρας ὀκτώ
  choice: 一连八天
  rationale: 宾格表示持续时间；“一连八天”自然地表达庆典持续八日。
- source_word: προσήνεγκαν
  choice: 献上
  rationale: 该动词在献祭语境中指把祭物呈献给上帝；“献上”是清楚而庄重的现代汉语表达。
- source_word: ὁλοκαυτώματα
  choice: 全燔祭
  rationale: 该词指祭物全部焚烧的祭；“全燔祭”保留“完全焚烧”的含义，也与一般“燔祭”有所区别。
- source_word: μετʼ εὐφροσύνης
  choice: 欢欢喜喜地
  rationale: 表达献祭时的喜乐状态；叠词形式自然、鲜明，同时不失庄重。
- source_word: ἔθυσαν
  choice: 献上
  rationale: 汉语用“献上……之祭”可自然表达献祭行为，并避免“宰献一个祭”之类生硬结构；上下文仍清楚保留献祭含义。
- source_word: θυσίαν σωτηρίου καὶ αἰνέσεως
  choice: 救恩与赞美之祭
  rationale: 按现存希腊文本直译其两个属格限定语，保留“救恩／拯救”与“赞美”的神学和礼仪内涵；同时以脚注说明σωτηρίου在献祭语境中也可能是“平安祭”的类别名称。
theological_decisions:
- issue: θυσίαν σωτηρίου的礼仪与神学含义
  choice: 救恩……之祭
  alternative: 平安祭
  rationale: σωτηρίου的字面语义涉及拯救、救恩或安康，但在七十士译本的献祭语境中也可对应平安祭。正文保留希腊措辞中的“救恩”意象，不把歧义静默限定为某一技术性祭类；脚注交代另一种合理译法。
- issue: θυσίαν后两个属格的关系
  choice: 救恩与赞美之祭
  alternative: 平安祭和赞美祭
  rationale: 希腊文只有一个θυσίαν，σωτηρίου与αἰνέσεως都可修饰这个单数名词。译为一个兼具“救恩”与“赞美”性质的祭，避免擅自拆成两种独立祭物。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“一连八天”“欢欢喜喜地”便于普通读者理解；“祭坛奉献礼”“全燔祭”“救恩与赞美之祭”则保留原文浓厚的礼仪色彩。
