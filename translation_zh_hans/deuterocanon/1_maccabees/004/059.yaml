base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: zh_hans
  text: 犹大、他的弟兄和以色列全会众议定：每年都要按期庆祝祭坛奉献的日子，从基斯流月[a]二十五日起，一连八天，欢欣喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基斯流”音译自希腊文Χασελεύ，所指为犹太历的基斯流月；中文也有其他音译写法。
    reason: 说明月份名称的音译及异写。
lexical_decisions:
- source_word: ἔστησεν
  choice: 议定
  rationale: 这里的动词后接ἵνα从句，表示共同确立一项长期实行的规例；“议定”既体现正式决定，也符合群体作主语的语境。
- source_word: ἐκκλησία
  choice: 会众
  rationale: 此处指以色列聚集的民众；“会众”保留共同体含义，又不把后来的基督教“教会”概念倒置进文本。
- source_word: ἵνα ἄγωνται
  choice: 要……庆祝
  rationale: 该结构在节期语境中表示遵守并庆贺这些日子；“庆祝”与句末的欢欣喜乐相称，也符合现代汉语习惯。
- source_word: ἡμέραι ἐγκαινισμοῦ τοῦ θυσιαστηρίου
  choice: 祭坛奉献的日子
  rationale: ἐγκαινισμός在此指礼仪性的奉献或重新奉献；译文保留“日子”的复数观念，不把它简化成未经明说的节名。
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: 按期
  rationale: 该短语指在固定或指定的时节举行；“按期”简洁保留历法上的定期含义。
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: 每年都
  rationale: 希腊语习语强调逐年重复；“每年都”在现代汉语中自然清楚。
- source_word: ἡμέρας ὀκτώ
  choice: 一连八天
  rationale: 表示庆典持续八日；“一连八天”准确表达连续时长。
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: 从……二十五日起
  rationale: ἀπό标明八日庆期的起点；加“起”使现代汉语的起始意义明确，而不改变原意。
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: 基斯流月
  rationale: 采用该犹太月份名称在现代中文圣经语境中较通行的音译，并以脚注说明希腊文形式。
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: 欢欣喜乐
  rationale: 保留两个近义名词叠加所形成的节庆强调，表达自然而庄重。
theological_decisions:
- issue: 次经犹太语境中ἐκκλησία的译法
  choice: 会众
  alternative: 集会；群体；教会
  rationale: 所指是聚集的以色列民，并非后世制度化的基督教教会；“会众”既忠于共同聚集的含义，也避免时代错置。
- issue: ἐγκαινισμός所指的礼仪行动
  choice: 奉献
  alternative: 重新奉献；祝圣；更新
  rationale: 上下文确实涉及祭坛恢复后的再次奉献，但本节所用名词本身可泛指奉献或启用；正文不额外加入“重新”，以保留原文表达的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“议定”体现正式的共同决定；冒号清楚引出决定的内容。“欢欣喜乐”保留原文近义并列的修辞力度。
