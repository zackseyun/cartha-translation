base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: zh_hans
  text: 现在，让我们向天呼求；如果他喜悦我们[a]，他就会记念与我们祖先所立的约，今天在我们面前击溃这支军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如果他愿意眷顾我们”或“如果他悦纳我们”。希腊文直译近于“如果他愿意／想要我们”，表达他对其子民的喜悦和有利意向。
    reason: 说明少见的θέλω加人称宾语结构，并保存其可能译法。
lexical_decisions:
- source_word: βοήσωμεν
  choice: 让我们……呼求
  rationale: 不定过去时虚拟语气用于劝勉；“呼求”自然表达战事危急中迫切求助，而不只强调声音响亮。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 保留希腊文向天呼求的表达，不在正文中直接释为“向上帝”，以免过度解释。
- source_word: εἰ θελήσει ἡμᾶς
  choice: 如果他喜悦我们
  rationale: θέλω在此直接以“我们”为宾语，表达上帝对其子民有意、悦纳或施恩的倾向；“喜悦我们”既保留人称宾语和条件意味，也比生硬的“愿意我们”合乎现代汉语。
- source_word: μνησθήσεται
  choice: 他就会记念
  rationale: “记念”是自然且庄重的盟约用语，并包含因记起而采取行动的语感。
- source_word: διαθήκης πατέρων
  choice: 与我们祖先所立的约
  rationale: 属格可表示与祖先相关的约；此译明确其为上帝与祖先所立的约，同时避免把约的归属说得过死。
- source_word: συντρίψει
  choice: 击溃
  rationale: 在军事语境中，“击溃”比一般的“打破”更准确自然，也传达彻底摧毁敌方力量的力度。
- source_word: τὴν παρεμβολὴν ταύτην
  choice: 这座营垒
  rationale: παρεμβολή可指军营或军队；“营垒”保留具体营地意象，并能在军事语境中指涉驻扎其中的敌军。
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: 我们面前
  rationale: 这是该短语简洁自然的现代汉语对应，保留“在我们眼前”的空间感。
theological_decisions:
- issue: 条件句之后各动词的隐含主语
  choice: 用“他”明确表示，所指为上帝
  alternative: 继续省略主语，只凭“向天”推知
  rationale: “向天”是对上帝的委婉指称，随后几个单数动词自然以上帝为主语；汉语虽可省略，但明示“他”能使条件结构清楚。
- issue: εἰ θελήσει ἡμᾶς的含义
  choice: 正文译为“如果他喜悦我们”，脚注保留“愿意眷顾我们／悦纳我们”等可能表达
  alternative: 如果他愿意眷顾我们；如果他悦纳我们
  rationale: 原文θέλω带人称宾语的说法较为特别，表示上帝有利于其子民的意愿或喜悦。“喜悦我们”保存这种个人宾语结构和条件张力，又不把它限定为某一特定教义术语。
- issue: διαθήκης πατέρων的关系
  choice: 译作“与我们祖先所立的约”
  alternative: 我们祖先的约
  rationale: 上下文中的行动者是上帝，盟约记念也以他为主体；此译在汉语中较清楚，但不进一步指定某位祖先或某一项盟约。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向天呼求”“记念……所立的约”保留经文语感；“击溃”贴合军事场景。正文只保留一处必要脚注，以说明原文中较特殊且有多种自然译法的条件短语。
