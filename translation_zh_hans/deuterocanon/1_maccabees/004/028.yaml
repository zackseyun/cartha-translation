  yaml_path: translation/deuterocanon/1_maccabees/004/028.yaml
  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: zh_hans
  text: 次年，他集结了六万名精选士兵和五千名骑兵，为要同他们交战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: 第二年
  rationale: 原文直译为“在将要来到的那一年”，在叙事语境中指接续前述事件的下一年；“第二年”是简洁自然的现代汉语表达。
- source_word: συνελόχησεν
  choice: 集结了
  rationale: 该动词在此指召集、编组军队；“集结”准确保留军事语境，又不额外限定征募方式。
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: 精兵
  rationale: 原文指经过挑选的男子或士兵；结合军事上下文译为“精兵”，自然表达其经挑选、素质优良的含义。
- source_word: ἑξήκοντα χιλιάδας
  choice: 六万名
  rationale: 直接传达原文兵员数目，并以量词“名”配合“精兵”。
- source_word: πεντακισχιλίαν ἵππον
  choice: 五千名骑兵
  rationale: ἵππος字面为“马”，但在军事语境中作集合用法，指骑兵；“五千名骑兵”是现代汉语中清楚自然的表达。
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: 要与他们交战
  rationale: ὥστε加不定式在此表达目的或预期结果；ἐκπολεμέω指对某方发动或进行战争。“要与他们交战”保留目的意味和军事力度，同时行文自然。
