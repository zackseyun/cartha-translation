  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: zh_hans
  text: 所有民族都将知道：确有一位救赎并拯救以色列者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就是那位救赎并拯救以色列者。”希腊文没有明说主语。
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσονται
  choice: 都会知道
  rationale: 将γινώσκω的将来时译为“都会知道”，自然表达将来认识到某一事实的含义。
- source_word: πάντα τὰ ἔθνη
  choice: 所有的民族
  rationale: 保留该词组普遍性的民族范围；不译作“外邦人”，以免在正文中过早收窄其指涉。
- source_word: ὅτι ἔστιν
  choice: 确有一位
  rationale: 按存在句理解无明示主语的ἔστιν；“确有”既符合现代汉语，也不擅自指明所指者。
- source_word: ὁ λυτρούμενος
  choice: 救赎
  rationale: 带冠词的现在时中间语态分词在此具有实体化和特征性用法；译作“救赎”保留其救赎语义，并与“一位”共同构成“那位施行救赎者”的意思。
- source_word: σώζων
  choice: 拯救
  rationale: 保留σῴζω的基本含义，并与“救赎”形成自然、庄重的并列。
- source_word: τὸν Ἰσραήλ
  choice: 以色列
  rationale: 直接译出专名；希腊语冠词无需在汉语中另行展开。
theological_decisions:
- issue: “救赎并拯救以色列者”的主语未明说
  choice: 正文采用存在式表达：“确有一位救赎并拯救以色列的”。
  alternative: “他就是那位救赎并拯救以色列的。”
  rationale: 希腊文在实体化分词前只有ἔστιν，没有明示主语。上下文可能指向上帝，但本句本身并未点名，因此正文保留这种含蓄，并用脚注说明另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所有的民族”较“万国”更直接，“确有一位”自然呈现存在句，同时保留原文主语未明的张力。
