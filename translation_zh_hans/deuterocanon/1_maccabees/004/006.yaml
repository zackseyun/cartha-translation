  text: And at daybreak Judas appeared in the plain with three thousand men; but they did not have armor and a sword as they wished.
translation:
  language: zh_hans
  text: 天一亮，犹大同三千人出现在平原上；只是，他们没有如自己所希望的那样的护具[a]和剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护具”直译为“遮盖物”。原文在此军事语境中的具体所指并不完全确定，可能泛指盔甲、盾牌等防护装备。
    reason: 保留 καλύμματα 的字面义及其具体军事所指的不确定性。
lexical_decisions:
- source_word: ἅμα ἡμέρᾳ
  choice: 天一亮
  rationale: 这是自然的现代汉语表达，准确传达黎明或破晓时分之意。
- source_word: ὤφθη Ἰούδας
  choice: 犹大……出现在
  rationale: 保留被动形式所表达的显现、出现之意；结合“率领三千人”使汉语通顺，但不额外说明其行动方式。
- source_word: καλύμματα
  choice: 铠甲
  rationale: 该词字面意为“遮盖物”，在此军事语境中指防护装备；“铠甲”简明自然，同时以脚注保留词义范围。
- source_word: μάχαιραν
  choice: 刀剑
  rationale: 希腊文用单数泛指这类兵器；汉语用集合性的“刀剑”可自然表达全军所需的武器，而不误解为全军只有一把剑。
- source_word: καθὼς ἠβούλοντο
  choice: 称心的
  rationale: 简洁表达“达到他们所希望的程度或配置”，保留装备不如所愿的含义。
