base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your servant David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: zh_hans
  text: 他看见敌营兵力强大，就祷告说：“以色列的救主啊，你是当受颂赞的！你曾借着你仆人[a]大卫的手，粉碎那强者的猛攻；又把外族人的军营交在扫罗的儿子约拿单和为他拿兵器的人手中。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“奴仆”；希腊语 δοῦλος 可按语境指仆人或奴仆。
    reason: lexical_alternative
  - marker: b
    text: 这段祷告暗指大卫战胜歌利亚，以及约拿单与为他拿兵器的人出战的事；希腊原文只说“那强者”和“外族人”，没有直接写出歌利亚和非利士人的名字。
    reason: cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: 敌营／营军
  rationale: 该词在军事语境中既可指营地，也可转指驻营的军队。第一次依上下文译作“敌营兵力”，自然表达所见军势强大；第二次译作“营军”，保留被交在他人手中的军事群体之意。
- source_word: ἰσχυράν
  choice: 兵力强大
  rationale: “强大”直接对应原文；补出“兵力”使现代汉语不至于把“敌营强大”误解为营地建筑坚固。
- source_word: σωτήρ
  choice: 救主
  rationale: 保留这是对上帝的直接称号及其神学分量；“拯救者”虽可行，但不如“救主”凝练庄重。
- source_word: συντρίψας
  choice: 粉碎
  rationale: 表达彻底击败的强烈动作，并适合军事语境。
- source_word: ὅρμημα
  choice: 猛攻
  rationale: 该词指猛烈冲击或进攻；“猛攻”简洁、自然，也保留动作的冲击力。
- source_word: τοῦ δυνατοῦ
  choice: 那强者
  rationale: 保留带冠词的单数人物指称，同时不在正文中直接补出歌利亚之名。
- source_word: ἐν χειρὶ
  choice: 借着……的手
  rationale: 保留圣经常见的施行者／工具性表达，又符合现代汉语。
- source_word: δούλου
  choice: 仆人
  rationale: 在对上帝的祷告中，“你仆人大卫”是自然、庄重的臣属称谓；脚注说明该词也可作更强调隶属身份的“奴仆”。
- source_word: ἀλλοφύλων
  choice: 外族人
  rationale: 紧贴“异族之人”的字面意义，不因历史典故而在正文直接改为“非利士人”。
- source_word: αἰρόντος τὰ σκεύη αὐτοῦ
  choice: 为他拿兵器的人
  rationale: 保留原文的描述性分词结构，不把它完全术语化为“拿兵器的侍从”；“兵器”在此符合军事装备的语境。
theological_decisions:
- issue: 如何表达大卫与上帝的 δοῦλος 关系
  choice: 你仆人大卫
  alternative: 你的奴仆大卫
  rationale: “仆人”在现代中文祷告语体中庄重自然，也能表达服事、归属和顺服；因原词可强调奴属身份，故在脚注保留“奴仆”这一译法。
- issue: 是否在正文点明歌利亚和非利士人
  choice: 保留“那强者”和“外族人”
  alternative: 歌利亚和非利士人
  rationale: 原文借泛称唤起相关历史叙事，却没有直呼其名；正文不补名可保存原文的含蓄和互文张力，脚注再说明所指典故。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“当受颂赞”体现 εὐλογητός 的赞颂句式；避免过度古雅。“敌营兵力强大”使首句在中文中语义明确，而“营军”保留 παρεμβολή 可指营中军队的军事色彩。
