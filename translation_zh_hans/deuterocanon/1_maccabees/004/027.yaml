  yaml_path: translation/deuterocanon/1_maccabees/004/027.yaml
  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: zh_hans
  text: 他听见这一切，就心慌意乱，灰心丧气，因为发生在以色列身上的事并非他所期望的，王吩咐他的事也没有实现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχύθη
  choice: 心慌意乱
  rationale: 该词为被动形式，表示陷入混乱和内心不安；“心慌意乱”自然地兼顾精神混乱与情绪震动。
- source_word: ἤθυμει
  choice: 灰心丧气
  rationale: 未完成时描写持续的沮丧状态；“灰心丧气”准确传达失去勇气、意志消沉之意。
- source_word: οὐχ οἷα ἤθελεν
  choice: 并非他所期望的
  rationale: 保留愿望或预期与实际结果之间的对照，不把其意图解释得过于具体。
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: 发生在以色列身上的事
  rationale: 完成时指已经发生并造成现状的事件；此译法在现代汉语中自然，也保留事件影响以色列的含义。
- source_word: οὐχ οἷα ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  choice: 王吩咐他的事
  rationale: ἐντέλλομαι 表示带权威的命令；“吩咐”符合君王对下属发令的语境，同时表达自然。
- source_word: ἐξέβη
  choice: 没有实现
  rationale: 此处指受命之事未产生预定结果；“没有实现”简洁表达事情未按命令达成。
