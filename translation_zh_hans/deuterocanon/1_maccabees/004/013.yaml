  text: 他们从营中出来作战，随同犹大的人吹响了号角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθαν
  choice: 出来
  rationale: 直接表达从营地向外移动；不增添原动词本身未明确包含的“列队出发”等军事色彩。
- source_word: παρεμβολῆς
  choice: 营
  rationale: 在此军事语境中指军营；“营”简洁、自然，并与上下文相称。
- source_word: εἰς πόλεμον
  choice: 迎战
  rationale: 此处表示出去投入眼前的战斗；“迎战”符合现代汉语军事叙事，也比宽泛的“去打仗”更贴合当下交锋。
- source_word: ἐσάλπισαν
  choice: 吹响了号角
  rationale: 该动词表示吹号或发出号声；汉语需自然补出乐器，“吹响号角”清楚体现军事信号。
- source_word: οἱ παρὰ Ἰούδου
  choice: 跟随犹大的人
  rationale: 保留该短语所表达的随同、归属关系，同时避免译成“犹大的部下”而额外断定正式的指挥结构。
- source_word: Ἰούδου
  choice: 犹大
  rationale: 依《马加比一书》人物名称在现代汉语中的通行译法，指犹大·马加比。
