  text: And they joined battle[a], and the nations were crushed, and they fled into the plain.
translation:
  language: zh_hans
  text: 双方交战，列国[a]被击溃，逃往平原。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“列国”；在这里也可指非犹太各族。
    reason: 保留τὰ ἔθνη的字面意义，并说明其在本语境中可能特指非犹太各族。
lexical_decisions:
- source_word: συνῆψαν
  choice: 双方交战
  rationale: συνάπτω在军事语境中指接战、交锋。希腊文只明说复数主语“他们”，汉语译作“双方交战”自然地表达两军接战，而不额外指定某一方发动攻击。
- source_word: συνετρίβησαν
  choice: 被击溃
  rationale: συντρίβω的被动形式本义为“被打碎、压碎”，在战事叙述中表示彻底溃败；“被击溃”既保留强烈语气，也符合现代汉语军事表达。
- source_word: τὰ ἔθνη
  choice: 列国的军队
  rationale: τὰ ἔθνη字面为“列国／各族”，本语境指与犹太军交战的非犹太各族势力。正文补出“军队”使所指在战斗场景中自然明确，同时以脚注保留较直译的表达及其可能含义。
- source_word: τὸ πεδίον
  choice: 平原
  rationale: πεδίον通常指平坦开阔之地；“平原”简洁、自然，并符合军队撤逃的地理场景。
