  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
translation:
  language: zh_hans
  text: 外族人抬眼一看，见他们正在对面列阵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在他们对面驻扎”，或“正在他们对面就位”。希腊文可指处在某个位置，也可指列队布阵；正文按军事场景译作“列阵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλόφυλοι
  choice: 外族人
  rationale: 指不同民族或族群的人；本节泛指非犹太的敌军，并非特指非利士人。“外族人”既保留族群界线，也避免过度具体化。
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: 抬眼一看
  rationale: 这是表示抬头观看的惯用语。“抬眼一看”在现代汉语中自然，同时保留原文动作的生动感。
- source_word: ἶδαν
  choice: 见
  rationale: 对应简单叙事中的“看见”；与前面的“抬眼一看”衔接简洁，避免重复累赘。
- source_word: ἐχομένους
  choice: 正在……列阵
  rationale: 该分词在军事语境中表示处于既定位置或已排开阵势。“列阵”贴合敌我对峙的场景，但原词本身也可较宽泛地表示驻扎或就位，因此附注说明。
- source_word: ἐξ ἐναντίας
  choice: 在对面
  rationale: 准确表达双方相对而立的空间位置，不额外强化原文未明说的攻击动作。
