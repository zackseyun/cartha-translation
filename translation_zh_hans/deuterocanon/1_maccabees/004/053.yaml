  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: zh_hans
  text: 他们照着律法，在他们所造的那座新燔祭坛上献了祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: 献了
  rationale: 在祭祀语境中，ἀναφέρω指把祭物献上；“献了祭”自然、庄重，并保留礼仪含义。
- source_word: θυσίαν
  choice: 祭
  rationale: θυσία可指祭物或献祭；与“献”搭配译作“祭”，简洁地保留原文的祭祀用语。
- source_word: κατὰ τὸν νόμον
  choice: 照着律法
  rationale: 表示献祭遵循律法规定；“照着律法”准确且符合现代汉语表达。
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: 燔祭坛
  rationale: 该属格结构指供献全烧祭所用的祭坛；“燔祭坛”是简洁而明确的圣殿礼仪术语。
- source_word: τὸ καινόν
  choice: 新
  rationale: 直接保留祭坛与先前祭坛相对而言是新的这一信息，不添加“新建”等原文未明说的限定。
- source_word: ὃ ἐποίησαν
  choice: 自己造的
  rationale: ἐποίησαν在此指他们制作或建造祭坛；“造的”保留较宽泛的原义，“自己”明确关系从句主语与主句主语相同。
theological_decisions:
- issue: 圣殿敬拜中的祭祀术语
  choice: 保留“献祭”和“燔祭坛”等明确的礼仪语言
  alternative: 概括为“举行敬拜”或仅说“在坛上献上供物”
  rationale: 本节强调合法圣殿献祭的恢复；泛化措辞会削弱原文的祭司礼仪和律法色彩。
- issue: τῶν ὁλοκαυτωμάτων的属格关系
  choice: 正文译作传统类别名称“燔祭坛”
  alternative: 译作“献燔祭的坛”
  rationale: 希腊语既可作为祭坛的类别名称，也可明确理解为用途关系；正文采用凝练的固定称谓，脚注保留展开式表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“律法”“燔祭坛”“献祭”保留圣殿礼仪语域；语序调整为自然汉语，同时维持原文中献祭、依法而行、新坛及建造者等全部信息。
