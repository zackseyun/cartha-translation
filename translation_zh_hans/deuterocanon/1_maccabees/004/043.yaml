  text: And they cleansed the sanctuary, and carried the stones of defilement to an unclean place.
translation:
  language: zh_hans
  text: 他们洁净了圣所，又把污秽的石头搬到不洁净的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: 洁净了
  rationale: 此动词在圣殿语境中兼有清除实际污物与礼仪上恢复洁净的含义；“洁净”比“打扫干净”更能保留祭仪色彩。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 中性复数在本段重修并重新奉献圣殿的语境中指神圣区域，即圣所，而非泛指“圣物”。
- source_word: ἦραν
  choice: 搬到
  rationale: 原词可指举起、拿走；与方向短语 εἰς τόπον 连用时，具体描写把石头移运到另一处，“搬到”自然且没有过度解释。
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: 那些沾染污秽的石头
  rationale: 属格 τοῦ μιασμοῦ 表明这些石头与亵渎所造成的礼仪污秽相关。“沾染污秽的石头”在现代汉语中比直译“污秽的石头”更清楚，同时保留祭仪污染的意义。
- source_word: εἰς τόπον ἀκάθαρτον
  choice: 到不洁净的地方
  rationale: ἀκάθαρτος 是礼仪洁净语汇；“不洁净”保留其宗教语域，避免弱化成仅指肮脏。
theological_decisions:
- issue: 圣殿复修中的礼仪洁净术语
  choice: 明确采用“洁净、污秽、不洁净”等用语
  alternative: 采用“清理、污染、肮脏的地方”等一般性表达
  rationale: 希腊文刻意使用洁净与不洁净的祭仪词汇；译文应保留圣殿受亵渎后恢复洁净的神学张力，而不将其扁平化为普通清扫。
- issue: τοὺς λίθους τοῦ μιασμοῦ 的关系
  choice: 译作“那些沾染污秽的石头”
  alternative: 译作“造成污秽的石头”或“污秽所用的石头”
  rationale: 属格本身可表达与污秽的关联，却未明确石头是污秽的来源、承载物还是亵渎后被污染之物；所选译法保留关联性，避免断定具体因果。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“圣所”符合圣殿叙事语境；“洁净／不洁净”形成原文对应关系，并保留礼仪含义。句式简洁，适合经文正文。
