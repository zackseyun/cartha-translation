  text: While Judas was still saying these things in a low voice[a], a certain part appeared, coming out from the mountain.
translation:
  language: zh_hans
  text: 犹大还在低声说这些话时，有某一部分从山上显露出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“某一部分”；原文没有说明这是哪一部分。按上下文，很可能是指对方军队的一部分从山上显露出来。
    reason: 原文 μέρος τι 的所指省略；脚注说明语境中可能的军事指涉，而不在正文补入“人”或“敌军”。
lexical_decisions:
- source_word: ἔτι
  choice: 还在……时
  rationale: 与属格独立结构共同表达两个动作在时间上的重叠，现代汉语用“还在……时”自然准确。
- source_word: ὑποφθεγγομένου
  choice: 低声说
  rationale: 该词含低声、轻声发言之意；“低声说”保留声音压低的方式，又不引入“抱怨”或“喃喃自语”的额外意味。
- source_word: Ἰούδου
  choice: 犹大
  rationale: 采用次经历史叙事中Ἰούδας的通行中文译名。
- source_word: ταῦτα
  choice: 这些话
  rationale: 所指是犹大此前所说的内容；“这些话”比字面的“这些事”更符合现代汉语语境。
- source_word: ὤφθη
  choice: 就看见
  rationale: 该被动形式在此可表达“被看见、进入视野”；“就看见”自然呈现叙事中突然出现的视觉事件，同时不明确添加观察者。
- source_word: μέρος τι
  choice: 有一部分人
  rationale: 原文直译为“某一部分”，没有明说所属对象。结合军事语境，汉语须补足量词所指，采用较克制的“一部分人”，但不明确增译为“敌军”。
- source_word: ἐκκύπτον
  choice: 探出身来
  rationale: 该分词可指从遮蔽处探出、显露；“探出身来”既符合山地中进入视野的情景，也较“出来”更贴近词的显露意味。
- source_word: ἐκ τοῦ ὄρους
  choice: 从山上
  rationale: ὄρος为单数“山”；“从山上”是自然汉语，并保留其空间来源。
