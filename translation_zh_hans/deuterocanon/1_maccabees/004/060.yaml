  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: zh_hans
  text: 那时，他们在锡安山四周修筑高墙和坚固的塔楼[a]，免得列国前来践踏那里，正如他们从前所做的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译为“外邦人”，即非犹太的各民族。希腊语τὰ ἔθνη可指“列国”或“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: 修筑
  rationale: 该动词基本义为“建造”；结合后文的高墙和塔楼，这里指防御工事的修建。“修筑”既保留建造之义，也自然适用于城墙等工程。
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: 那时
  rationale: 准确、简洁地表达叙事中的时间背景。
- source_word: τὸ ὄρος Σιὼν
  choice: 锡安山
  rationale: 采用现代汉语圣经及地名表达中通行的名称。
- source_word: κυκλόθεν
  choice: 四周
  rationale: 表达防御工事环绕锡安山的空间意义。
- source_word: τείχη ὑψηλά
  choice: 高墙
  rationale: 直接保留城墙高大的含义，符合现代汉语习惯。
- source_word: πύργους ἰσχυρούς
  choice: 坚固的塔楼
  rationale: ἰσχυρούς强调强固；“坚固的塔楼”比“强大的塔楼”更符合防御建筑语境。
- source_word: μή ποτε
  choice: 免得
  rationale: 自然表达预防或防范的目的，与希腊文虚拟语气从句相合。
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: 列国前来
  rationale: 将分词结构自然转为汉语谓语。“列国”保留τὰ ἔθνη的基本意义，同时在脚注注明“外族人”这一语境性译法。
- source_word: καταπατήσωσιν αὐτά
  choice: 践踏那里
  rationale: καταπατήσωσιν直译为“践踏”。αὐτά虽为复数，但所指可能是刚提到的防御设施或整个地点；“那里”在汉语中既自然，又不强行判定具体先行词。
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: 像从前所做的一样
  rationale: 保留对先前同类行为的回指，表达简洁而庄重。
theological_decisions:
- issue: τὰ ἔθνη在犹太历史叙事中的译法
  choice: 列国
  alternative: 外族人
  rationale: “列国”较贴近该希腊词的基本复数意义，也保留群体身份上的概括；上下文所指是敌对的非犹太民族，因此“外族人”同样可能，列入脚注以保留词义张力。
- issue: 复数代词αὐτά的所指
  choice: 那里
  alternative: 这些防御工事
  rationale: 希腊文使用中性复数代词，可能回指高墙和塔楼等设施，也可能概括指向锡安山这一设防地点。“那里”避免在正文中把不确定的指代过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“修筑”贴合建造防御工事的语境；“免得”清楚表达防范目的。正文保留“列国”的原文色彩，并以脚注交代另一种重要译法。
