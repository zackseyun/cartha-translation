  text: But as many of the foreigners as escaped, after they arrived, reported to Lysias all that had happened.
translation:
  language: zh_hans
  text: 外族人中逃脱的人抵达后，就把所发生的一切都报告给吕西阿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλων
  choice: 外族人
  rationale: 原词指异族、外族之人；此处是犹太人对敌方群体的称呼。“外族人”既贴近词义，也比“外国人”更符合古代族群语境。
- source_word: διεσώθησαν
  choice: 逃脱
  rationale: 在战败追击的上下文中表示幸存并脱险；译作“逃脱”自然体现其从战场上逃生。
- source_word: παραγενηθέντες
  choice: 到了以后
  rationale: 该分词表示他们抵达目的地后所发生的动作，保留先抵达、后报告的时间顺序，同时不擅自补明地点。
- source_word: ἀπήγγειλαν
  choice: 报告给
  rationale: 表示把消息正式告知某人；“报告给”符合向吕西阿汇报战况的语境。
- source_word: πάντα τὰ συμβεβηκότα
  choice: 所发生的一切
  rationale: 直接保留πάντα的完整范围和完成时分词所指已经发生的诸事。
