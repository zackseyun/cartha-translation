base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/046.yaml
  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: zh_hans
  text: 他们把那些石头存放在圣殿山上一个合适的地方[a]，直到有一位先知来，就这些石头的事作出答复为止。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“在殿的山上”，即圣殿山。
    reason: 说明原文的字面表达及其地点含义。
lexical_decisions:
- source_word: ἀπέθεντο
  choice: 存放
  rationale: 该中间语态表示把物件安置一旁，留待以后处理。“存放”自然地传达暂时移置并保留的含义。
- source_word: τοὺς λίθους
  choice: 那些石头
  rationale: 原文仅说“那些石头”，所指由上文说明；不在正文中增补“祭坛的”，以免超出本节明说的内容。
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: 在圣殿山上
  rationale: 字面为“在殿的山上”，是指圣殿所在的山地或圣殿山；采用现代中文清楚、自然的表达，并用脚注保留字面形式。
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: 一个合适的地方
  rationale: ἐπιτήδειος表示适宜、合用；“合适的地方”简洁并保留原文的评价意味。
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: 直到……来
  rationale: 该结构指向叙事当时所等待的未来时点；中文用“直到……来”自然传达这一前瞻意味。
- source_word: προφήτην
  choice: 有先知
  rationale: προφήτην没有冠词，原文未指明某一位已知的先知；“有先知来”保留不定性。
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: 就这些石头作出答复
  rationale: ἀποκριθῆναι本义是“回答”，περὶ αὐτῶν是“关于它们”；此译保留正式求问后获得答复的意味，不把它强化为法律裁决。
theological_decisions:
- issue: 所期待的先知承担何种角色
  choice: 等待将来有先知来，就这些石头给出具有权威性的答复
  alternative: 先知将作出正式的法律裁决；或这句话只是表示无限期搁置决定的惯用说法
  rationale: 希腊文明确说把石头存放起来，直到有先知来回答有关它们的事。译文保留对先知指引的期待，却不进一步规定其职分、时间或裁决机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“存放”体现石头被暂时保留以待后续处理；“作出答复”保持正式感，同时避免过度解释为司法裁决。脚注标记[a]已置于正文相应位置。
