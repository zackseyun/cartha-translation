  text: And he said to the people[a], “Do not desire the spoils[b], for the battle is before us,”
translation:
  language: zh_hans
  text: 他对众人说：“不要贪恋战利品，因为战事就在眼前。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαόν
  choice: 众人
  rationale: 原词意为“人民、众人”；本处指受命的作战群体，但不宜收窄为原文没有明说的“军队”或“士兵”。
- source_word: ἐπιθυμήσητε
  choice: 贪恋
  rationale: 该动词表示强烈欲求；在战利品的语境中，“贪恋”自然传达不应把心思放在掠物上的劝诫，同时不刻意套用十诫中某个固定术语。
- source_word: σκύλων
  choice: 战利品
  rationale: 复数名词指战争中夺得的财物；“战利品”在现代汉语中明确、庄重，也比“掠夺”更清楚地指所得之物。
- source_word: πόλεμος
  choice: 敌军
  rationale: πόλεμος通常可指“战争、战斗”，但ἐξ ἐναντίας ἡμῶν描绘眼前对阵的威胁。汉语若直译为“战斗在我们面前”较生硬；结合语境译作“敌军正在我们面前”，自然表达尚有对敌之战，虽对名词作了语境化处理。
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: 正在我们面前
  rationale: 该短语兼有“在对面、迎面、与我们相敌”的空间及敌对意味；“正在我们面前”保留眼前对阵和迫近感。
