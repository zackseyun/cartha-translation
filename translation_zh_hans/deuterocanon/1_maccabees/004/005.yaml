  yaml_path: translation/deuterocanon/1_maccabees/004/005.yaml
  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: zh_hans
  text: 戈尔吉亚夜间来到犹大的营地，一个人也没有找到。他在山中寻找他们，因为他说：“这些人正从我们面前逃跑。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  choice: 营地
  rationale: 在军事叙事中指驻扎的营地；译作“营地”自然且准确。
- source_word: νυκτός
  choice: 夜间
  rationale: 保留属格时间用法，简洁表达事情发生在夜里。
- source_word: ἐζήτει
  choice: 搜寻
  rationale: 未完成时表示持续进行的寻找行动；“搜寻”适合在山地追查敌军的语境。
- source_word: ἐν τοῖς ὄρεσιν
  choice: 在山中
  rationale: ὄρη为复数，但汉语通常以“山中”自然表达山区范围，不必机械译出复数。
- source_word: ἀφʼ ἡμῶν
  choice: 从我们面前
  rationale: 保留介词短语所表达的逃离、避开说话者一方之意，也维持叙事中的敌我视角。
