  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 转了回来
  rationale: 这里的简单过去时表示行动方向发生改变；“转了回来”符合军事行动的语境，也比单纯的“回来”更能体现转向之意。
- source_word: ἡ δύναμις
  choice: 军队
  rationale: δύναμις在军事叙事中可指武装部队；现代汉语以“军队”表达最自然，同时不额外暗示其组织规模或编制。
- source_word: ἀπὸ τοῦ διώκειν
  choice: 停止追赶
  rationale: ἀπό加冠词化不定式在此表示脱离或终止某项行动；译作“停止追赶”清楚传达追击行动的中止。
- source_word: ὀπίσθεν αὐτῶν
  choice: 他们
  rationale: ὀπίσθεν αὐτῶν在追赶语境中指跟在敌人后面；汉语“追赶他们”已自然包含“在他们后面追”的意思，无须重复译出“后面”。
