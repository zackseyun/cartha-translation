  yaml_path: translation/deuterocanon/1_maccabees/004/058.yaml
  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: zh_hans
  text: 百姓中有极大的欢喜，列国的羞辱也被除去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国所加的羞辱也被除去了。”
    reason: “列国的羞辱”对应ὀνειδὸς ἐθνῶν；按上下文，该属格可理解为列国加给百姓的羞辱。
lexical_decisions:
- source_word: ἐγενήθη
  choice: 有／出现（融入“百姓中大大欢喜”）
  rationale: 这是叙事中常见的存在表达；汉语无需机械译成“事情发生了”，直接陈述欢喜的出现更自然。
- source_word: εὐφροσύνη μεγάλη ... σφόδρα
  choice: 大大欢喜
  rationale: εὐφροσύνη表示喜乐、欢庆，μεγάλη与σφόδρα叠加强调程度；“大大欢喜”既保留强烈语气，也符合庄重而自然的现代汉语。
- source_word: ἐν τῷ λαῷ
  choice: 百姓中
  rationale: ἐν与集合名词连用，表示这种欢喜遍及百姓；“百姓中”简洁自然，并保留本段以色列群体的语境。
- source_word: ἀπεστράφη
  choice: 除去了
  rationale: 希腊文为不定过去时被动语态，表达羞辱被移除，却未明说施事者；汉语被动含义可由结果式“除去了”自然呈现。
- source_word: ὀνειδὸς
  choice: 羞辱
  rationale: 该词指公开的耻辱、责难或凌辱；“羞辱”兼顾外来侮辱及其造成的蒙羞。
- source_word: ἐθνῶν
  choice: 列国
  rationale: 这里指周围非以色列诸民族；“列国”保留复数及圣经历史语境，又避免使用带较强传统神学色彩的“外邦人”。
theological_decisions:
- issue: “百姓”与“列国”的所指
  choice: 按历史语境理解为犹太／以色列百姓与周围非以色列民族，但不在正文中增补名称
  alternative: 将二者泛化为普通的“人民”与“各国”
  rationale: 上下文是犹太敬拜得以恢复，因此两者具有群体对照；正文仍采用“百姓／列国”，保留原文简洁及其语境张力。
- issue: 羞辱的来源与移除者
  choice: 将ὀνειδὸς ἐθνῶν理解为列国加给百姓的羞辱，同时不指明是谁将其除去
  alternative: 译作“列国自身的羞耻被除去”，或明确说是上帝除去羞辱
  rationale: 属格可简略表达与列国有关的羞辱；上下文倾向列国所加的羞辱。被动式没有明示施事者，因此不把上帝或任何人物直接补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“大大欢喜”传达原文μεγάλη与σφόδρα的双重强调；“列国”保持经文历史语域。脚注标记置于相关句末。
