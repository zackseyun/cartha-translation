  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
translation:
  language: zh_hans
  text: 双方交战，吕西亚军营的约五千人倒下；他们倒在对手面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: 双方交战
  rationale: 军事语境中的 συμβάλλω 表示交锋、接战；“双方交战”自然简洁，也保留 ἀλλήλοις 所表达的相互性。
- source_word: ἔπεσον
  choice: 倒下
  rationale: 战事叙述中“倒下”既贴近原文，也自然暗示阵亡，而不把原文未明说的“被杀”直接加入正文。
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: 吕息雅营中
  rationale: παρεμβολή 在此指军营或驻营的军队；“吕息雅营中”在现代汉语中简明自然，并保留所属关系。
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: 约有五千人
  rationale: εἰς 与数目连用时可表示约数或达到的总数；正文采用“约有”表达较可能的近似义，同时以脚注保留确数理解。
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: 在对方面前
  rationale: 该短语表示处于他们对面或面前；“在对方面前”保留空间关系和原文重复“倒下”的句式，不额外解释为追击或溃败。
