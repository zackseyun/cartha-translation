  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: zh_hans
  text: 他们在祭坛上焚香，又点亮灯台上的灯；灯就在圣所里发光。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”或译“圣殿”；这里的希腊词通常可特指圣殿内部的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: 焚香
  rationale: θυμιάω特指焚烧香料；“焚香”简洁自然，并保留圣殿礼仪的具体含义。
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: 在祭坛上
  rationale: ἐπί接宾格在此表示香被置于祭坛之上焚烧；“在祭坛上”符合现代汉语表达。
- source_word: ἐξῆψαν
  choice: 点亮
  rationale: 该动词意为点燃；用于灯时，“点亮”自然清楚。
- source_word: τοὺς λύχνους
  choice: 灯
  rationale: λύχνος指具体的灯具，而非抽象的光；汉语“灯”准确简明。
- source_word: τῆς λυχνίας
  choice: 灯台
  rationale: λυχνία指承托灯盏的台架；“灯台”透明、庄重，也避免加入希腊文未使用的专名。
- source_word: ἐφαίνοντο
  choice: 发光
  rationale: 此处主语承接“灯”，未完成时描写灯持续发光；“发光”比按中被动形式直译为“显现”更合语境。
- source_word: ἐν τῷ ναῷ
  choice: 在圣所里
  rationale: ναός在圣殿语境中通常特指圣殿内部的圣所，而非整个圣殿建筑群；“圣所”保留这一较具体的空间含义。
theological_decisions:
- issue: 圣殿复献礼仪的具体术语
  choice: 保留“焚香、祭坛、灯台、圣所”等具体礼仪与建筑用语
  alternative: 概括为一般性的敬拜活动，或把ναός译作较宽泛的“圣殿”
  rationale: 经文叙述的是恢复圣殿敬拜时的具体行动；保留这些实体与礼仪用语，既符合希腊文，也不额外引入宗派性解释。
- issue: 末句ἐφαίνοντο的主语
  choice: 明确为前句所说的“灯”：“灯就在圣所里发光”
  alternative: 译成无人称表达“圣所里便有了光”
  rationale: 希腊文复数动词与前面的复数“灯”自然呼应；明确主语可避免汉语读者误解，同时不改变句义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又……；……就在……”保留三个并列动作及末句的结果性描写。脚注只说明ναός在“圣所”与“圣殿”之间的词义范围。
