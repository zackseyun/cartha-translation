  yaml_path: translation/deuterocanon/1_maccabees/004/009.yaml
  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
translation:
  language: zh_hans
  text: 你们要记住，我们的祖先怎样在红海中获救：当法老以武力[a]追赶他们的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凭着强力”或“率领大军”。
    reason: ἐν δυνάμει可泛指力量、威势或武力；在此军事叙事语境中，也可理解为法老带着军力追赶。
lexical_decisions:
- source_word: μνήσθητε
  choice: 你们要记住
  rationale: 不定过去时命令语气要求听众主动回想；“你们要记住”在现代汉语中直接、自然，并保留劝勉力度。
- source_word: ἐσώθησαν
  choice: 获救
  rationale: σῴζω的被动形式；“获救”既符合海边脱险的历史语境，也保留原文的拯救用语。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 字面为“我们的父辈”；这里指以色列先民这一群体。汉语“祖先”自然、准确，不必以生硬的“父辈”限定性别。
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: 在红海中
  rationale: 紧贴ἐν及《七十士译本》中ἐρυθρὰ θάλασσα的惯常称呼；保留“在……中”的空间表达。
- source_word: ἐδίωξεν
  choice: 追赶
  rationale: 符合διώκω在军事叙事中的基本含义，也适合现代汉语叙事。
- source_word: ἐν δυνάμει
  choice: 率领大军
  rationale: δύναμις可指力量，也可在军事语境中指军队；此处法老追赶以色列人的出埃及背景支持军事含义。“率领大军”比“以力量”更自然，但以脚注保留较宽泛的理解。
theological_decisions:
- issue: 历史性解救语境中的拯救用语
  choice: 获救
  alternative: 被解救／被救出
  rationale: 保留σῴζω的“救”字语义和经文互文回响，同时不把后来的系统神学含义强加于此。
- issue: οἱ πατέρες ἡμῶν的性别与群体所指
  choice: 我们的祖先
  alternative: 我们的父辈／我们的先祖
  rationale: 希腊文形式为阳性复数，但在此惯用表达中指共同体的先民。现代汉语“祖先”不抹去任何明确参与者，且比“父辈”更准确地表达久远先民。
- issue: ἐν δυνάμει的军事含义
  choice: 率领大军
  alternative: 凭着强力／以武力
  rationale: 出埃及叙事背景明显涉及法老军队，但希腊短语本身可较宽泛地表示力量；正文采用语境上自然的军事理解，脚注保存词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。冒号引出所要记念的事件，分号保持原句两层叙述的紧密关系。正文不采用“芦苇海”，因为现存希腊文本明确写作“红海”；也不以脚注引入并非该希腊见证直接表达的希伯来语词源争论。
