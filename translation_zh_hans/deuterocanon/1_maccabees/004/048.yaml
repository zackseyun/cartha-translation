  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: zh_hans
  text: 他们重建了圣所和殿内各处[a]，又使各院分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文作“房屋”，这里指圣殿建筑；“殿内各处”也可译作“殿里面的部分”。
    reason: 原文措辞及句法范围说明
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: 重建
  rationale: οἰκοδομέω本义为“建造”；结合圣殿遭亵渎后修复、重新奉献的语境，译作“重建”既体现建筑行动，也不扩大为泛指的“恢复”。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 在圣殿语境中，中性复数τὰ ἅγια可指神圣区域；“圣所”自然简洁，并保留其与后文殿内区域的区分。
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: 殿内各处
  rationale: 该短语直指“房屋里面的部分或区域”。οἶκος在此明确指圣殿建筑，现代汉语译作“殿”较为清楚；“各处”体现中性复数τὰ的空间含义，同时避免误解为殿内物品。
- source_word: τὰς αὐλάς
  choice: 各院
  rationale: αὐλαί在圣殿建筑语境中指院落；“各院”简洁庄重，也体现希腊语复数。
- source_word: ἡγίασαν
  choice: 使……分别为圣
  rationale: ἁγιάζω表示使之成为圣洁或归为神圣用途。“使……分别为圣”传达礼仪性分别和奉献的含义，又不预先限定具体仪式方式。
theological_decisions:
- issue: τὰ ἅγια所指是神圣空间还是圣物
  choice: 译作“圣所”，理解为圣殿中的神圣区域。
  alternative: 译作“圣处”或“圣物”。
  rationale: 本节依次提到圣所、殿内区域和各院，整体是建筑空间的列举；因此空间意义最合语境。“圣物”虽在词义范围内，却会削弱此处连续的空间结构。
- issue: οἶκος的圣殿称谓
  choice: 在正文中译作“殿”。
  alternative: 直译作“房屋”，并用注释说明指圣殿。
  rationale: 现代汉语中“殿”能准确、自然地指明此处的圣殿建筑；“房屋”容易造成普通住宅的误解。脚注保留原文“房屋”的表达，以呈现原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“重建—分别为圣”保留建筑修复与礼仪圣化两个连续动作；避免使用过度古雅的“内殿”“诸院”等词，以免加入原文未明确表达的建筑层级。
