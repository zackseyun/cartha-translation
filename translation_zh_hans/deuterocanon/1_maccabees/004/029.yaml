  text: And they came into Idumea and encamped at Beth-zur[a], and Judas met them with ten thousand men.
translation:
  language: zh_hans
  text: 他们来到以土买，在伯和仑安营；犹大率领一万人迎战他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον εἰς
  choice: 来到
  rationale: 这是简明的叙事性移动表达；“来到”自然传达进入该地区之意，又不额外限定观察方位。
- source_word: τὴν Ἰδουμαίαν
  choice: 以土买
  rationale: Ἰδουμαία指希腊化时期的以土买地区；采用现代中文圣经及历史文献中通行的地名。
- source_word: παρεμβάλον
  choice: 安营
  rationale: 该动词在军事语境中指扎营；“安营”简洁、庄重，并保留军事叙事色彩。
- source_word: ἐν Βηθορούς
  choice: 在伯夙尔
  rationale: 按本节军事行动的地理背景，将Βηθορούς认作伯夙尔；但希腊文地名形式存在辨识上的困难，因此以脚注保留另一种传统理解。
- source_word: συνήντησεν αὐτοῖς
  choice: 迎战他们
  rationale: 在两军相遇的上下文中，该表达不只是偶然碰面，而是前去迎击；“迎战”符合军事语境，同时不具体添加战斗结果。
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: 带着一万人
  rationale: 介词短语表示犹大随同或率领的兵力。“一万人”直接对应数目和ἀνδρῶν，不必另加原文未明说的“士兵”。
