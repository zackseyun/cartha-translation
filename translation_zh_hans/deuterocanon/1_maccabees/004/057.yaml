  yaml_path: translation/deuterocanon/1_maccabees/004/057.yaml
  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
translation:
  language: zh_hans
  text: 他们用金冠[a]和小盾牌装饰圣殿的正面，又整修了大门和旁屋，并给它们装上门扇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金制花环”；希腊语 στεφάνοις 既可指冠冕，也可指作为装饰的花环。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: 装饰
  rationale: 该动词表示用饰物加以美化；“装饰”是自然、清楚的现代汉语表达。
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: 圣殿的正面
  rationale: 原短语指圣殿朝前、位于前方的部分；“正面”准确自然，也避免使用过于专业的“立面”。
- source_word: στεφάνοις χρυσοῖς
  choice: 金冠
  rationale: στέφανος可指冠冕，也可指装饰性的花环；正文采用较直接的“金冠”，并以脚注保留语境中“金花环”的可能。
- source_word: ἀσπιδίσκαις
  choice: 小盾牌
  rationale: 该词是ἀσπίς的指小形式，表示作为装饰或奉献之物的小型盾牌；“小盾牌”通俗明确。
- source_word: ἐνεκαίνισαν
  choice: 整修
  rationale: 此处宾语为各门和旁屋，语境更可能指翻修、恢复，而非礼仪性的重新奉献；“整修”自然传达建筑修复之意。
- source_word: πύλας
  choice: 各门
  rationale: πύλαι指门或门道；下文另说装上门扇，因此这里用“各门”保留门体与门扇之间的区别。
- source_word: παστοφόρια
  choice: 旁屋
  rationale: 该词指圣所建筑群附属的房间；“旁屋”保留其附属位置，又不武断限定为库房或祭司用房。
- source_word: ἐθύρωσαν
  choice: 装上门扇
  rationale: 该动词意为给某处安设门；“装上门扇”既符合现代汉语，也与前文的“各门”形成清楚区别。
- source_word: αὐτά
  choice: 它们
  rationale: 该中性复数代词自然回指前述各门和旁屋；译作“它们”保留其集合性所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“旁屋”避免对附属房间的具体用途作超出原文的限定；“金冠”与脚注共同保留στεφάνοις的词义开放性。
