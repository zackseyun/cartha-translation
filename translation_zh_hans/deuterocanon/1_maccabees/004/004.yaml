  text: 趁军队还分散在营地外的时候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文 ἕως ἔτι 表达紧凑，也可按字面理解为“直到……仍然……”。正文按上下文将其理解为“趁……还……”，即应在军队尚分散、未集中之时采取行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι
  choice: 趁……还……的时候
  rationale: 该压缩表达在语境中指出行动的时机；译作“趁……还……的时候”既保留时间含义，也自然传达应在这一状态持续期间采取行动。
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: 在军事语境中，复数 δυνάμεις 指武装力量或部队；中文用“军队”自然明确，又不额外限定具体编制。
- source_word: ἐσκορπισμέναι
  choice: 分散
  rationale: 该分词表示兵力尚未集中；“分散”准确而适合军事语境。
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: 在营外
  rationale: παρεμβολή 在此指军营，ἀπό 表示与军营分离。结合“分散”的状态，译作“在营外”比生硬的“从营地分散”更符合现代汉语。
