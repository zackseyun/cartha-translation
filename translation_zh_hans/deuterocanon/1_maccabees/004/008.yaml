  yaml_path: translation/deuterocanon/1_maccabees/004/008.yaml
  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
translation:
  language: zh_hans
  text: 犹大对跟他在一起的人说：“不要怕他们人多；也不要因他们的进攻[a]而胆怯[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进攻”也可译作“冲击”、“猛冲”或“进袭”。
    reason: lexical_alternative
  - marker: b
    text: “胆怯”也可译作“丧胆”、“惊惶”或“失去勇气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: 不要怕
  rationale: 直接表达禁止惧怕的命令语气；现代汉语简洁自然。
- source_word: τὸ πλῆθος αὐτῶν
  choice: 他们人多
  rationale: πλῆθος在此强调敌方人数众多；译作“他们人多”比“他们的众多”更符合现代汉语，同时保留数量上的优势。
- source_word: τὸ ὅρμημα αὐτῶν
  choice: 他们的攻势
  rationale: ὅρμημα可指猛烈冲击、进攻或攻势；军事语境中“攻势”清楚自然，同时在脚注保留“冲势、猛攻”等可能。
- source_word: μὴ δειλωθῆτε
  choice: 不要……胆怯
  rationale: 该词表达变得畏缩、丧失勇气；“胆怯”保留其勇气受挫的含义，又避免译成带有强烈道德谴责意味的“不要做懦夫”。
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: 跟随他的众人
  rationale: 贴近“与他同在的人”，并在军事叙事中自然表达随同犹大的一群男子；不额外加入原文未明说的军阶或身份。
