revisions:
- from: 他们看见外族人[a]强大的军阵[b]，披挂着铠甲，又有骑兵环绕四周；这些人都受过作战训练。
  to: 他们看见一座强大的外族军营，营中士兵披着铠甲，骑兵环绕着它；这些骑兵都受过作战训练。
  rationale: 将“军阵”改为“军营”，并以“营中士兵披着铠甲”自然表达原文将营地作为其中武装人员之整体来描述的修辞。补出骑兵的受训指向，以反映οὗτοι的性数和紧邻语境。脚注保留词义范围。
