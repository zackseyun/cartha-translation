  text: And they saw a strong camp of the nations[a], armored, and cavalry surrounding it, and these were trained for war.
translation:
  language: zh_hans
  text: 他们看见一座强大的外族军营，营中士兵披着铠甲，骑兵环绕着它；这些骑兵都受过作战训练。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  choice: 军阵
  rationale: 该词可指军营，也可指扎营的军队；结合其被描述为披甲并由骑兵环绕，此处译作“军阵”较自然，同时在脚注保留“军营”的可能。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 在《马加比一书》的语境中通常指犹太人以外的各族；“外族人”符合现代汉语，并避免“列国”可能造成的国家政治含义。
- source_word: ἰσχυρὰν
  choice: 强大的
  rationale: 直接表达这支军队或军阵势力强盛、难以对付，不额外限定为防御坚固。
- source_word: τεθωρακισμένην
  choice: 披挂着铠甲
  rationale: 保留完成时被动分词所表达的已配备铠甲状态；与集合意义的“军阵”搭配，可自然理解为阵中军士披甲。
- source_word: ἵππον
  choice: 骑兵
  rationale: 该单数名词在军事语境中具有集合意义，指骑乘作战的部队，而非单独一匹马。
- source_word: κυκλοῦσαν
  choice: 环绕四周
  rationale: 表达骑兵围绕军阵部署的位置关系，也保留其正在环列的画面。
- source_word: διδακτοὶ πολέμου
  choice: 受过作战训练
  rationale: 准确传达“在战争方面受过教导、训练”的意思，不擅自加强为身经百战。
