  yaml_path: translation/deuterocanon/1_maccabees/004/051.yaml
  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
translation:
  language: zh_hans
  text: 他们把饼放在桌上[a]，又展开帷幔[b]；他们完成了自己所做的一切工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饼”：希腊原文为复数，指若干饼。
    reason: 说明原文的数，避免汉语形式掩盖复数信息。
  - marker: b
    text: “帷幔”也可译作“幔子”或“帘幕”；这个词常用于圣所中的帘幔。
    reason: 保留καταπετάσματα在圣所语境中的词义范围。
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: 放在
  rationale: ἐπιτίθημι在此指把物件放置于某物之上；“放在”自然、准确，也不额外赋予礼仪术语色彩。
- source_word: τὴν τράπεζαν
  choice: 桌上
  rationale: τράπεζα直指“桌子”；本节语境虽是圣所陈设，原文却未加专门限定语，因此不扩译为“陈设饼桌”等。
- source_word: ἄρτους
  choice: 饼
  rationale: ἄρτους是ἄρτος的复数，指一块块饼。现代汉语的“饼”在此可自然表达这一实物，同时脚注保留其复数信息。
- source_word: ἐξεπέτασαν
  choice: 展开
  rationale: 该动词表示铺开、伸展或展开；用于圣所帷幔时，“展开”既贴近词义，也不武断认定具体悬挂方式。
- source_word: τὰ καταπετάσματα
  choice: 帷幔
  rationale: καταπέτασμα可指帘幕、幔子或隔帘，常见于圣所语境。“帷幔”庄重而易懂，并保留其并非普通窗帘的语感。
- source_word: ἐτέλεσαν
  choice: 都完成了
  rationale: τελέω在这里表示完成、做完；以结果句式表达，可自然传达全部修复工作的告成。
- source_word: πάντα τὰ ἔργα ἃ ἐποίησαν
  choice: 他们所做的一切工作
  rationale: 尽量保留原文“他们所做的一切工作”的表述，不把ἐποίησαν解释性扩译为“着手进行”或“承担”。中文通过“就都完成了”的句式避免过度生硬。
theological_decisions:
- issue: 圣所陈设的礼仪术语
  choice: 正文采用普通而庄重的“桌”“饼”“帷幔”
  alternative: 扩译为“陈设饼桌”“陈设饼”或将帷幔明确译作圣所的“幔子”
  rationale: 希腊文本在本节没有附加这些专门限定。译文保留圣所语境，却不把其他经文或后世礼仪名称补入正文。
translation_notes:
  register: 采用现代标准书面汉语，句式简洁庄重。“把……放在……”与“又展开……”清楚呈现连续动作；末句改用结果式语序，使原文略显重复的“完成……所做的工作”在中文中自然可读，同时不加入“承担”“着手”等解释性含义。
