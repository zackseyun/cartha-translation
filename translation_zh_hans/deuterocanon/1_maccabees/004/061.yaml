base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: zh_hans
  text: 他们在那里派驻了一支军队守卫那地方[a]，又将它加固，以守卫贝特苏拉[b]，使百姓有一座面对以土买的堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们命令一支军队在那里守卫那地方。”希腊语动词可以表示“命令”或“指派”，在这里很可能是指派军队驻守。
    reason: lexical_alternative
  - marker: b
    text: 贝特苏拉是耶路撒冷以南的一处设防地点，战略位置朝向以土买。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  choice: 派驻
  rationale: 该动词本义可指“命令、指派”；与“军队”和“守卫”连用时，语境表明是指派军队驻守。“派驻”既自然，也保留军事行动的含义。
- source_word: δύναμιν
  choice: 一支军队
  rationale: 此词在这里指一支武装力量或部队；译作“一支军队”清楚而不过度限定其规模。
- source_word: τηρεῖν
  choice: 守卫
  rationale: 两处不定式都处于军事防御语境，表示看守、护卫某地。
- source_word: ὠχύρωσαν
  choice: 加固
  rationale: 该词表示使某地坚固、加强其防御；“加固”能自然表达这一动作，同时避免额外添加原文未明说的工事细节。
- source_word: τὴν Βαιθσουρά
  choice: 贝特苏拉
  rationale: 按希腊文地名 Βαιθσουρά 音译，以现代普通话中易辨认的形式呈现。
- source_word: τοῦ ἔχειν
  choice: 使……有
  rationale: 带 τοῦ 的冠词化不定式在这里表达目的；“使百姓有”简洁自然。
- source_word: ὀχύρωμα
  choice: 堡垒
  rationale: 该名词指防御性的坚固据点；“堡垒”符合本节的军事语境。
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: 面对以土买
  rationale: 短语字面为“在以土买面前”，这里表示地理位置朝向或正对该地区；“面对”保留其空间意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“那地方”和“那里”对应希腊文中性代词 αὐτό，避免在本节内擅自补定其所指；地名采用音译或通行历史名称。
