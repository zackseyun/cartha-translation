  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
translation:
  language: zh_hans
  text: 他们在第一百四十八年、第九个月（即基斯流月[a]）二十五日清早起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文音译作“哈瑟娄”；即犹太历的基斯流月。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: 他们清早起来
  rationale: ὤρθρισαν 表示早起或黎明即起，τὸ πρωὶ 又明确是在早晨；“清早起来”以自然简洁的现代汉语保留两者共同强调的早时含义。
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: 二十五日
  rationale: 这是希腊语表达每月第二十五日的常规方式；汉语日期采用“二十五日”。
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: 第九个月
  rationale: 直译日期结构，同时为后面的月份名称保留解释关系。
- source_word: Χασελεὺ
  choice: 基斯流月
  rationale: Χασελεὺ 是犹太历月份名称的希腊语形式；“基斯流月”是现代中文圣经及相关文献中较易识别的译名。
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: 第一百四十八年
  rationale: 忠实保留原文纪年公式，不在正文中补出原文未明说的纪元名称。
theological_decisions:
- issue: 纪年所指的纪元
  choice: 正文仅译“第一百四十八年”
  alternative: 第一百四十八年（塞琉古纪元）
  rationale: 希腊文本只明说年份，未在本节点出纪元；历史上通常理解为塞琉古纪元，因此放入脚注说明，避免正文增译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那是……二十五日”使较长的日期公式在汉语中清楚顺畅；两处脚注标记均置于所解释内容之后。
