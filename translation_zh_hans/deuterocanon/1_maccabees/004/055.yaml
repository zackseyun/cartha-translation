  yaml_path: translation/deuterocanon/1_maccabees/004/055.yaml
  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: zh_hans
  text: 众人都俯伏在地，敬拜，又向天[a]称颂使他们亨通的那一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对天”；希腊文既可表示方向，也可能以“天”敬称住在天上的上帝。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那赐他们成功的那一位。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσον ... ἐπὶ πρόσωπον
  choice: 俯伏在地
  rationale: 这是表示面伏于地、谦卑敬拜的惯用语；“俯伏在地”既自然，也保留了身体姿态。
- source_word: πᾶς ὁ λαός
  choice: 众人都
  rationale: 该短语指全体民众；“众人都”符合现代汉语表达，也不额外加入政治意义。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 本节处于祭坛重新奉献的宗教礼仪语境中，所指不只是一般行礼，而是向上帝表达崇敬。
- source_word: ηὐλόγησαν
  choice: 称颂
  rationale: 该词用于以上帝为对象时有祝颂、赞美之意；汉语“称颂”比直译为“祝福”更自然，同时保留庄重语气。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 保留介词所表达的方向性，同时不排除“天”是对天上上帝的敬称或委婉指代。
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: 那使他们亨通的那一位
  rationale: 带冠词的分词短语构成对上帝的间接称谓；“使……亨通”表达赐予顺利和成功，而不把具体成功限定为军事得胜。
theological_decisions:
- issue: “那使他们亨通的那一位”所指为何
  choice: 保留原文对上帝的间接称谓，不在正文中直接补出“上帝”。
  alternative: 明译为“使他们亨通的上帝”。
  rationale: 希腊文使用带冠词的分词短语，并在前面写“向天”，可让读者领会其所指，却没有直接写出上帝的名号；译文保留这种敬虔而含蓄的表达。
- issue: εἰς οὐρανόν的功能
  choice: 译作“向天”，保留方向含义及其可能的敬称作用。
  alternative: 译作“向天上的上帝”或把“天”直接理解为上帝。
  rationale: 原文既可突出敬拜、称颂朝向天，也可能借“天”委婉指上帝；正文不应强行排除其中一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏在地”呈现敬拜姿态；“称颂”避免现代汉语中“祝福上帝”可能造成的误解；“那一位”保留原文对上帝含蓄而敬虔的指称。
