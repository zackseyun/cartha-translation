base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: zh_hans
  text: 他们看见我们的圣所一片荒凉，祭坛遭到亵渎[a]，各门被焚毁，院落中长满草木，如同密林中或一座山上所长的草木；各房间[b]也被拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被玷污”。希腊文强调神圣之物遭到亵渎。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的“房间”是圣殿建筑群内或与之相连的房室；其确切位置和用途难以确定。
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: 圣所
  rationale: 在圣殿语境中指神圣的处所或范围；“圣所”既自然，也保留其礼仪含义。
- source_word: ἠρημωμένον
  choice: 一片荒凉
  rationale: 表达遭破坏后荒废、凄凉的状态，同时避免将其窄化为单纯无人居住。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 这是该礼仪用语在现代汉语中的标准译法。
- source_word: βεβηλωμένον
  choice: 遭到亵渎
  rationale: 该词强调神圣之物被冒犯、玷辱；“亵渎”比一般的“弄脏”更准确地保留宗教语境。
- source_word: πύλας
  choice: 各门
  rationale: 保留希腊文复数，并符合圣殿建筑群的语境。
- source_word: κατακεκαυμένας
  choice: 被焚毁
  rationale: 表达火烧已经造成毁坏这一完成后的结果。
- source_word: αὐλαῖς
  choice: 院子
  rationale: 这里指圣殿院落；“院子”是普通读者易懂的现代汉语表达。
- source_word: φυτὰ πεφυκότα
  choice: 长满草木
  rationale: 自然呈现无人料理而植物滋长的景象，不擅自限定植物种类。
- source_word: δρυμῷ
  choice: 丛林
  rationale: 传达野生、茂密的林木景象，与院落荒废后草木丛生的比喻相称。
- source_word: παστοφόρια
  choice: 房间
  rationale: 该词指圣殿建筑群内或与之相连的房室，但具体位置和用途并不确定；正文采用较宽泛的译法。
- source_word: καθῃρημένα
  choice: 被拆毁
  rationale: 准确表达建筑被拆除、毁坏的结果。
