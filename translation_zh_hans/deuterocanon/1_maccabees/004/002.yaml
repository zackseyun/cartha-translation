  text: so as to fall upon the camp of the Jews and strike them suddenly[a]; and the men of the citadel were his guides.
translation:
  language: zh_hans
  text: 以便袭击犹太人的营地，突然攻击他们；堡垒的人[a]给他带路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堡垒的人”直译为“堡垒之子”。“堡垒”也可译作专名“阿克拉”，通常指耶路撒冷一座设防坚固的城堡。
    reason: 保留οἱ υἱοὶ τῆς ἄκρας的字面形式及ἄκρα作为专名的可能性。
lexical_decisions:
- source_word: ὥστε
  choice: 好
  rationale: 承接上文的军事行动，表达预期目的；现代汉语用“好”简洁自然，也不把目的强化为已经发生的结果。
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: 袭击
  rationale: 该短语表示以武力扑向目标；“袭击”既保留军事语境中的突然进攻意味，也符合现代汉语习惯。
- source_word: παρεμβολή
  choice: 营地
  rationale: 在此军事语境中指军队驻扎之处；“营地”清楚自然。
- source_word: πατάξαι
  choice: 攻打
  rationale: πατάσσω可指击打、打击，语境中是军事攻击；“攻打”不额外断定杀死等结果。
- source_word: ἄφνω
  choice: 突然
  rationale: 直接表达动作发生得突然；不另加“出其不意”，以免超出该副词本身。
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: 堡垒里的人
  rationale: 字面为“堡垒之子”，此处是地域或政治归属的表达，并非生物学意义上的儿子；译作“堡垒里的人”在现代汉语中自然，并保留其所属关系。
- source_word: ἄκρα
  choice: 堡垒
  rationale: ἄκρα在此指耶路撒冷的设防要塞，也可能作为专名“阿克拉”；正文用通俗的“堡垒”，专名可能性见脚注。
- source_word: ὁδηγοί
  choice: 给他带路
  rationale: ὁδηγός指引路者；按汉语句法译为动词结构“给他带路”比“是他的向导”更自然。
