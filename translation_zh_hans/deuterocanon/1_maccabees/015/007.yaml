base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: zh_hans
  text: 但耶路撒冷和圣所[a]都应享有自由；你所制造的一切武器，以及你所建造并控制的堡垒，都仍归你所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“圣物”或“神圣区域”。希腊语复数τὰ ἅγια既可指神圣的地方，也可指圣物；这里的语境较可能是耶路撒冷的圣殿区域。
    reason: 保留原文的词义歧义，并说明语境所倾向的理解。
lexical_decisions:
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文通行的地名译法。
- source_word: τὰ ἅγια
  choice: 圣所
  rationale: 希腊语中性复数可指神圣区域、圣所，也可指圣物；在耶路撒冷获得自由的政治和地域语境中，“圣所”自然指向圣殿及其神圣范围，同时以脚注保留原文歧义。
- source_word: ἐλεύθερα
  choice: 享有自由
  rationale: 此处是君王正式授予不受干预或义务约束的地位；“享有自由”既保留“自由”的直接含义，也符合中文诏令语境。
- source_word: ὅπλα
  choice: 武器
  rationale: 指军事装备；“武器”是清楚、现代的中文表达。
- source_word: κατεσκεύασας
  choice: 制造
  rationale: 该动词可表示制作、预备或装备；以“武器”为宾语时，“制造”最为直接。
- source_word: ὀχυρώματα
  choice: 堡垒
  rationale: 指设防的军事据点；“堡垒”准确且通俗。
- source_word: ᾠκοδόμησας
  choice: 建造
  rationale: 直接表达修建防御工事的动作。
- source_word: ὧν κρατεῖς
  choice: 并控制的
  rationale: κρατέω在此指实际占有或掌控；“控制”比单说“持有”更符合堡垒的军事政治语境。
- source_word: μενέτω σοι
  choice: 都仍归你所有
  rationale: 原文以单数命令式统摄前面的复数项目，表达准许继续占有；中文用“都仍归你所有”自然呈现其法律授予意味。
theological_decisions:
- issue: τὰ ἅγια所指范围
  choice: 正文译作“圣所”，并用脚注保留“圣物”或更广义“神圣区域”的可能
  alternative: 圣物；神圣区域
  rationale: 原文复数本身具有词义歧义，语境倾向圣殿神圣范围，但不足以完全排除圣物，因此不在正文中武断消除张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“应享有自由”体现正式王室特许的语气；后半句重组为符合中文习惯的并列结构，同时保留武器、堡垒及持续所有权三项关键信息。
