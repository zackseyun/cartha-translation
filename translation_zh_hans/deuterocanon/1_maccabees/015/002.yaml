  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
translation:
  language: zh_hans
  text: 信上所载如下：“安条克王向大祭司兼民族领袖西门，以及向犹太民族[a]问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太民族”也可译为“犹太地人”。希腊语Ἰουδαίων既可指犹太人，也可在某些语境中偏重指犹太地居民的地域含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν περιέχουσαι τὸν τρόπον τοῦτον
  choice: 信中这样写道
  rationale: 这是引出书信正文的文书用语。按现代汉语习惯译作“信中这样写道”，既承接上文复数的书信，也自然表达其内容如下；比逐字译成“它们包含这种形式”更清楚。
- source_word: ἱερεῖ μεγάλῳ
  choice: 大祭司
  rationale: 这是犹太传统中该职分在现代汉语里的标准名称。
- source_word: ἐθνάρχῃ
  choice: 民族领袖
  rationale: 该词是政治头衔，指一个民族或族群的统治者。译作“民族领袖”既保留民族性与政治性，也比音译头衔更便于普通读者理解。
- source_word: ἔθνει Ἰουδαίων
  choice: 犹太民族
  rationale: ἔθνος表示民族、国民共同体；Ἰουδαίων在此较自然地指犹太人这一整体。合译为“犹太民族”，保留集体与政治意味。
- source_word: χαίρειν
  choice: 问安
  rationale: 在希腊书信格式中，这是惯用的致意语，并非正文中的“喜乐”命令；“问安”符合中文正式书信语体。
theological_decisions:
- issue: Ἰουδαίων指“犹太人”还是地理意义上的“犹太地人”
  choice: 犹太民族
  alternative: 犹太地的民族／犹太地人
  rationale: 王室书信同时致意于西门和整个ἔθνος，语境偏向作为整体的民族共同体；但Ἰουδαῖος本身也可能带有地理意义，因此在脚注保留另一理解。
- issue: ἐθνάρχης这一政治头衔的表达
  choice: 民族领袖
  alternative: 民族长／犹太民族的统治者
  rationale: 原文并未明确规定该头衔在中文制度中的精确对应。采用描述性而庄重的“民族领袖”，避免把它等同于某个后世官职。
translation_notes:
  register: 采用现代、庄重的文书语体。“信中这样写道”自然引出信函内容；引文中的“安条克王向……问安”保留希腊书信开头的正式结构。
