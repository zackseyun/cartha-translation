  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: zh_hans
  text: 王的朋友雅典诺比来到耶路撒冷，看见西门的显赫气派、陈列的金银器皿[a]和众多的随从；他十分惊讶，就把王的话转告给西门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈列的金银器皿”：原文κυλίκιον罕见且词义难以确定，可能更具体地指饮酒用具、杯具陈设，或摆放贵重金银器物的设施。
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος τοῦ βασιλέως
  choice: 王的朋友
  rationale: 保留希腊文的称谓形式；这可能是宫廷头衔，但不把它过度解释为某一特定官职。
- source_word: δόξαν
  choice: 显赫气派
  rationale: 这里指西门可见的尊荣、排场和威势，而非神学意义上的“荣耀”；此译符合叙事语境，也较自然。
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: 陈列的金银器皿
  rationale: κυλίκιον罕见且词义不确定，可能指饮酒器具、杯具陈设或摆放贵重器皿的设施；正文用较宽泛的表达保留其可见的奢华陈设。
- source_word: παράστασιν ἱκανήν
  choice: 声势浩大的随从
  rationale: 该短语在此很可能指人数众多、足以形成显著排场的侍从队伍；“声势浩大”同时传达规模和观感。
- source_word: ἐξίστατο
  choice: 十分惊讶
  rationale: 表达雅典诺比因所见而强烈震惊或惊叹，使用现代汉语自然措辞。
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: 把王的话转告了他
  rationale: 准确表达雅典诺比向西门传达王所说的话；“他”依上下文指西门。
