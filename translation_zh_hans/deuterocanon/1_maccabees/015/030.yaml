base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/030.yaml
  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
translation:
  language: zh_hans
  text: 所以，现在你们要交出所夺取的城邑，以及你们所控制、在犹太边界以外的那些地方的税款。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“从犹太的边界”。希腊文的边界短语较为压缩；正文按上下文译出其较可能的意思。
    reason: 保留原文边界短语的词汇和句法歧义。
lexical_decisions:
- source_word: νῦν οὖν
  choice: 因此，现在
  rationale: οὖν承接上文并引出结论，νῦν强调当前的要求；“因此，现在”在现代汉语中同时保留推论与紧迫感。
- source_word: παράδοτε
  choice: 交出
  rationale: 该命令式要求转交控制权或所有物；“交出”直接自然，又不额外加入“归还”所暗示的原有归属。
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: 你们所夺取的城邑
  rationale: καταλαμβάνω在此指以武力取得或占有；“夺取”保留其强制意味，“城邑”适合历史叙事而仍易于理解。
- source_word: τοὺς φόρους
  choice: 税款
  rationale: φόροι可指税或贡赋；“税款”是清楚、现代且不过度限定政治制度的表达。
- source_word: τῶν τόπων
  choice: 那些地方
  rationale: τόποι含义宽泛，不必解释为正式行政区；“地方”忠实保留这种概括性。
- source_word: ὧν κατεκυριεύσατε
  choice: 你们所控制的
  rationale: κατακυριεύω表示取得支配权；“控制”自然表达政治统治，不引入神学化或过强的措辞。
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: 犹太疆界以外
  rationale: 原文边界短语高度压缩；结合上下文，最可能指不在犹太本土疆界之内的地方。“疆界以外”传达其语境意义，同时以脚注保留字面结构的不确定性。
theological_decisions:
- issue: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας这一边界短语的解释
  choice: 犹太疆界以外
  alternative: 从犹太的疆界；属于犹太疆界的
  rationale: 这不是教义性问题，却是重要的句法解释。ἐκ与ὅρια构成的表达较为省略，若逐字翻译会令现代读者难以理解。上下文中的要求针对在犹太正当疆界之外所取得的城邑和税收，因此正文采用最可能的语境义，并用脚注保留原文的压缩与歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事用语。“交出”保持命令的直接性；“城邑”略具历史语体，但普通读者易懂。句末以解释性同位结构说明“那些地方”，避免中文关系从句过度堆叠。
