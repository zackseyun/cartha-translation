  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: zh_hans
  text: 所以，若有一些害群之徒[a]从他们的地方逃到我们这里，你们就要把他们交给大祭司西门，好让他按照他们的律法惩办他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为害之人”“惹事者”；直译近于“瘟疫般的人”。希腊语λοιμοί是对危险或扰乱社会之人的严厉贬称。
    reason: lexical_alternative
  - marker: b
    text: “惩办”也可译作“对他们施行公正的惩处”或“向他们施行报复”。希腊语ἐκδικέω可表示施行惩罚、伸张正义或报仇；本句“按照他们的律法”较支持司法性的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: 害群之徒
  rationale: 该词本义与“瘟疫、灾害”有关，用于人时是严厉的贬称，指危害群体、惹是生非的人。“害群之徒”既保留其敌意和危害意味，又符合现代汉语表达。
- source_word: διαπεφεύγασιν
  choice: 逃到
  rationale: 完成时表达已经逃脱并仍在收容地的结果状态；结合引渡语境，“从……逃到我们这里”自然准确。
- source_word: χώρας
  choice: 国土
  rationale: χώρα可指土地、地区或疆域；此处涉及政治实体之间移交逃亡者，“国土”恰当地表达地域政治含义，同时不过度具体化。
- source_word: παράδοτε
  choice: 交给
  rationale: 命令式要求把逃亡者移交西门管辖；“交给”在现代汉语中简洁自然，并保留命令的力度。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是犹太教最高祭司职分的标准汉语译名。
- source_word: ἐκδικήσει
  choice: 惩办
  rationale: ἐκδικέω兼有伸张正义、施行惩罚或报复之意；下文“按照他们的律法”赋予其司法语境，因此“惩办”既保留严厉性，又避免误解为私人报复。
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: 按照他们的律法
  rationale: 原文为复数所有格αὐτῶν，直译为“他们的”；保留这一指代，不擅自改为“他的律法”或明确解释为某一群体的律法。
theological_decisions:
- issue: ἐκδικήσει在法律—政治语境中的含义
  choice: 按律法惩办，即司法性的惩处
  alternative: 向他们报仇／对他们施行报复
  rationale: “按照他们的律法”使该行动带有司法执行的性质；译文不把它处理成私人复仇，同时脚注保留原词可含报复或伸冤意味的张力。
- issue: “他们的律法”中代词所指
  choice: 保留复数代词“他们的”，不明确其所指
  alternative: 西门的律法／犹太人的律法／逃亡者所属群体的律法
  rationale: 希腊文明确使用复数代词，但其具体先行对象并未在本句中完全消除歧义，因此译文不作教义或历史上的补足。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以……若……”保留οὖν与条件句结构；“你们就要”体现复数命令式的直接力度；“好让”表达目的关系。保留“他们的律法”的指代张力，不作消歧。
