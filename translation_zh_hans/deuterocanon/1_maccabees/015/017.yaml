base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/017.yaml
  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
translation:
  language: zh_hans
  text: 犹太人的使者来到我们这里，作为我们的朋友和盟友[a]，重申自起初就有的友好和联盟；他们是大祭司西门和犹太民众[b]派来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使节”；希腊词指正式的外交代表。
    reason: lexical_alternative
  - marker: b
    text: “犹太民众”也可译作“犹太人民”或“犹太人的公民团体”；这里的希腊词可指作为政治共同体的人民。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  choice: 使者
  rationale: 指受正式派遣的外交代表；“使者”自然庄重，也保留其官方性质。
- source_word: φίλοι
  choice: 朋友
  rationale: 直接保留“朋友”的字面意义；在本段外交语境中也可表达正式友好关系。
- source_word: σύμμαχοι
  choice: 盟友
  rationale: 这是政治及军事联盟语境中的常用对应词。
- source_word: ἀνανεούμενοι
  choice: 重申
  rationale: 原词意为使之重新、更新；在延续既有外交关系的语境中，“重申”较自然，同时不改变其更新旧约的含义。
- source_word: τὴν ἐξ ἀρχῆς φιλίαν καὶ συμμαχίαν
  choice: 起初所立的友好和盟约
  rationale: “起初”对应ἐξ ἀρχῆς；补出“所立”使现代汉语通顺，并表明所重申的是原先建立的关系。“友好”体现正式外交关系，“盟约”体现联盟安排。
- source_word: ἀπεσταλμένοι ἀπὸ
  choice: 是……派来的
  rationale: 按汉语习惯清楚表达被动差遣及其施事者。
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: 大祭司西门
  rationale: ἀρχιερεύς惯译为“大祭司”；姓名采用通行译名“西门”。
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: 犹太民众
  rationale: δῆμος可指人民、民众或作为政治共同体的公民群体；“民众”保留集体意义而不把它限定为特定政体或正式议会。
