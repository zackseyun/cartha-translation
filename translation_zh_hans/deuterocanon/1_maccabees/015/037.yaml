  text: 特里丰却登上一艘船，逃往奥尔托西亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τρύφων
  choice: 特利丰
  rationale: 按现代中文圣经人名音译习惯处理该希腊人名，采用清楚、易读的译名。
- source_word: δὲ
  choice: 却
  rationale: 此处δέ表示轻微的叙事转折，并与上文形成一定对照；“却”能简洁保留这一语气。
- source_word: ἐμβὰς εἰς πλοῖον
  choice: 登上一条船
  rationale: ἐμβὰς是ἐμβαίνω的不定过去时分词，与εἰς πλοῖον连用，指登船；译作“登上一条船”既自然，也保留动作的具体性。原文πλοῖον无冠词，故用“一条船”而不指定某条船。
- source_word: ἔφυγεν
  choice: 逃往
  rationale: φεύγω在此指逃离、逃走；与目的地连译为“逃往”，准确而符合现代汉语叙事表达。
- source_word: εἰς Ὀρθωσίαν
  choice: 往奥托西亚
  rationale: εἰς加地名表示移动的目的地，译作“往”；Ὀρθωσία按希腊语读音音译为“奥托西亚”。
