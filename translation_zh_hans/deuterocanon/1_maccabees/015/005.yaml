  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
translation:
  language: zh_hans
  text: 所以现在，我确认：在我以前的诸王所准予你的一切减免[b]，以及他所准予你的其他一切减免[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本末句使用单数动词“他准予你”，但前文的主语是复数“在我以前的诸王”。这可能反映斯威特文本所保存的抄传措辞；按通常语法，也可能会理解为“他们准予你”。
    reason: textual_variant
  - marker: b
    text: 这里的“减免”指君王在税赋或其他应缴款项方面给予的优惠或削减，不一定表示免除一切义务。
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: 所以现在
  rationale: 同时保留 οὖν 的承接、推论意味和 νῦν 的时间意味，符合王室宣告的语气。
- source_word: ἵστημί σοι
  choice: 我为你确认
  rationale: ἵστημι 在行政和法律语境中表示使既有特许继续有效或予以确立；“确认”比字面的“立定”更符合现代汉语。σοι 译作“为你”，保留受益者关系。
- source_word: πάντα τὰ ἀφαιρέματα
  choice: 一切减免
  rationale: ἀφαίρεμα 指被扣除、豁免或减去的款项或义务；“减免”能涵盖部分减征与免除，不武断限定为完全豁免。
- source_word: ἃ ἀφῆκάν σοι
  choice: 准予你
  rationale: ἀφίημι 在此指君王批准或给予财政性减免；“准予”简洁地体现王权授予的行政性质。
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: 我以前的诸王
  rationale: 直接表达历任先王相对于说话者的时间关系；“诸王”自然体现复数。
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: 以及……其他一切减免
  rationale: 保留 ὅσα ἄλλα 所指额外而未逐项列明的全部减免。
- source_word: ἀφῆκέν σοι
  choice: 他准予你
  rationale: 抄传希腊文本此处使用单数动词。译出“他”以保留该异常，而不擅自按前面的复数“诸王”改成“他们”。
