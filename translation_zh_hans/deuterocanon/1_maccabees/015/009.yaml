base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: zh_hans
  text: 等我们建立了我们的国度，我们必以极大的尊荣尊崇你、你的民族和圣所[b][a]，以致你们的尊荣在全地[c]显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“尊崇”“极大的尊荣”和“你们的尊荣”中连续使用同根词；也可译作“使……大得荣耀……你们的荣耀”。这里采用“尊荣”，因为上下文是王室外交和政治承诺。
    reason: lexical_alternative
  - marker: b
    text: “圣所”也可译作“圣殿”；希腊文原词可以指圣殿或其神圣区域。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可理解为“各地”或“全世界”；希腊文原词所指的地理范围须依上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  choice: 建立了
  rationale: 此处是不定过去时虚拟式，与ὡς ἂν连用，表示将来条件达成之时；“建立了”自然表达“建立并使之稳固”的政治含义，同时不把它限定为军事征服。
- source_word: βασιλείαν ἡμῶν
  choice: 自己的国度
  rationale: βασιλεία在王室书信中可指王国、王权或统治；“自己的国度”符合外交政治语境，也保留其制度性含义。
- source_word: δοξάσωμεν
  choice: 使……大得尊荣
  rationale: δοξάζω在此王室外交语境中指给予公开的尊崇和荣耀；译作“使……得尊荣”比纯神学色彩较强的“荣耀”更贴合语境。
- source_word: τὸ ἔθνος σου
  choice: 你的民族
  rationale: ἔθνος在这里将犹太人作为一个整体族群和政治共同体来指称；“民族”兼顾这两层含义。
- source_word: τὸ ἱερὸν
  choice: 圣所
  rationale: ἱερόν可指圣殿或整个神圣区域；“圣所”避免把所指范围限定得比希腊文更窄。
- source_word: δόξῃ μεγάλῃ
  choice: 大得尊荣
  rationale: 与δοξάσωμεν共同构成强调性的同根词表达；中文用“大得尊荣”简洁传达“以极大的尊荣来尊崇”的意思。
- source_word: φανερὰν γενέσθαι
  choice: 彰显
  rationale: 该表达说明前述行动所产生的结果，即使其尊荣公开可见、广为人知；“彰显”自然且庄重。
- source_word: τὴν δόξαν ὑμῶν
  choice: 你们的尊荣
  rationale: ὑμῶν为复数，涵盖受信人及其民族和圣所；“你们的尊荣”保留与前文δοξάζω/δόξῃ的词义呼应。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 于全地
  rationale: γῆ既可指土地、地区，也可广指大地或世界；“全地”保留原文地理范围上的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重的王室外交语体。“等……了……必……”表达将来条件与承诺；“从而”清楚呈现ὥστε所引出的结果。全文避免过度神学化，同时以脚注保留δόξα词组可译作“荣耀”的可能性。
