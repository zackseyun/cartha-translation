    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  choice: 来到
  rationale: 此处表示抵达某地；“来到”自然地承接叙事进程。
- source_word: Κενδεβαῖος
  choice: 肯德拜
  rationale: 按希腊文音译人名，并采用适合现代普通话的简洁形式。
- source_word: Ἰαμνείαν
  choice: 雅姆尼亚
  rationale: 按希腊地名音译，保留其专名特征。
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: 开始挑衅
  rationale: ἄρχομαι加不定式表示“开始”；ἐρεθίζω可指激怒、挑动或挑衅，此处保留敌对意味而不具体限定手段。
- source_word: τὸν λαόν
  choice: 民众
  rationale: λαός在此指受到侵扰的群体；“民众”比反复使用“人民”更符合现代叙事语体。
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: 侵入犹太地
  rationale: 该动词本可直译为“进入”，但与掳掠、杀害并列，语境明显指敌对的军事侵入。
- source_word: αἰχμαλωτίζειν
  choice: 掳走
  rationale: 该词指在战争中俘获为囚；“掳走民众”简明传达俘虏并带走的含义。
- source_word: φονεύειν
  choice: 杀害他们
  rationale: 意为杀死、杀害；希腊文末一动词未重述宾语，中文补出“他们”以明确其承接前面的民众。
