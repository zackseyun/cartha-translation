  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
translation:
  language: zh_hans
  text: 但我想出去，穿行这片国土[a]，好追究[b]那些毁坏我国、使王国内许多城邑荒废的人；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走遍这片国土”或“到这片国土各处”；希腊语κατὰ τὴν χώραν可指穿过或遍及一片地域的行动。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“追赶”“对付”或“惩办”；希腊语μετέλθω在这里可指带着敌对或惩治意图，追查并对付作恶者。
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: 我想
  rationale: 表达说话者本人的意愿或打算；“我想”自然直接，也不把意愿强化为已经确定的计划。
- source_word: ἐκβῆναι
  choice: 出发
  rationale: 基本义为“出去”；结合此处政治军事语境，“出发”既自然，又不必明确增添原文没有直说的“出兵”或“出征”。
- source_word: κατὰ τὴν χώραν
  choice: 走遍这片国土
  rationale: κατά与移动表达连用时可指穿行或遍及某地；此译保留跨越该地域行动的含义。
- source_word: ὅπως μετέλθω
  choice: 好追讨
  rationale: ὅπως引出目的；μετέρχομαι在针对作恶者时可表示追赶、追究或惩办。“追讨”兼具追击和问罪之意，不把含义限定为纯粹追赶或正式司法惩罚。
- source_word: τοὺς κατεφθαρκότας τὴν χώραν ἡμῶν
  choice: 那些毁坏我国……的人
  rationale: καταφθείρω表示使某地遭到破坏或败坏；“毁坏”力度充分，同时不必推断为彻底毁灭。χώρα在此政治语境中译作“国”。
- source_word: τοὺς ἠρημωκότας πόλεις πολλὰς
  choice: 使……许多城邑荒废的人
  rationale: ἐρημόω意为使荒凉、使无人居住；“使……荒废”清楚传达城市遭受蹂躏后的荒凉状态。“城邑”符合历史叙事的庄重语体。
- source_word: ἐν τῇ βασιλείᾳ
  choice: 王国内
  rationale: 原文为带定冠词的“王国”，没有明说“我的”；译文同样不添加所属关系。
