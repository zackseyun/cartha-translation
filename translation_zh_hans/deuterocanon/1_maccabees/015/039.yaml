  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: zh_hans
  text: 他命令他在犹太地对面安营[a]；又命令他修建基德龙[b]，加固各城，并攻打百姓。王则正在追赶特里丰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“面向犹太地”。希腊文短语表示空间位置，即在犹太地前方或与之相对。
    reason: lexical_alternative
  - marker: b
    text: “修建”也可译作“建造”或“重建”。希腊文动词本身没有说明基德龙是新建还是恢复重建。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: 命令
  rationale: 该动词表示发出具有权威性的指令；译作“命令”自然且保留其力度。
- source_word: παρεμβάλλειν
  choice: 安营
  rationale: 此词在军事语境中指扎营、设营；“安营”简洁地保留了军事意味。
- source_word: κατὰ πρόσωπον τῆς Ἰουδαίας
  choice: 在犹太对面
  rationale: 该短语主要表示空间位置，即在犹太前方或与之相对；避免在此处提前译出敌对含义。
- source_word: οἰκοδομῆσαι
  choice: 修建
  rationale: 该动词本身表示建造，但未明确区分新建与重建；“修建”在中文中可自然指对一处地点进行建设，同时保留一定开放性。
- source_word: τὴν Κεδρὼν
  choice: 基德龙
  rationale: 按希腊文地名 Κεδρών 音译，并采用适合现代普通话的形式。
- source_word: ὀχυρῶσαι
  choice: 加固
  rationale: 该动词指使城邑坚固、加强防御；“加固”与宾语“各城”搭配自然，并保留军事防御含义。
- source_word: τὰς πόλεις
  choice: 各城
  rationale: πόλις 指城或城邑；复数带冠词在此自然译为“各城”。
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: 并攻打那百姓
  rationale: ὅπως 加虚拟式表达命令所指向的目的；πολεμέω 在此指发动军事攻击。“攻打”比一般的“争战”更清楚地传达敌对行动。
- source_word: τὸν λαόν
  choice: 那百姓
  rationale: λαός 指作为整体的犹太人民；“那百姓”既保留定冠词的特指性，也避免赋予现代政治意义。
- source_word: ἐδίωκε
  choice: 正在追赶
  rationale: 未完成过去时表示当时持续进行的动作；“正在追赶”保留其进行体意味。
- source_word: Τρύφωνα
  choice: 特里丰
  rationale: 依希腊文 Τρύφων 音译为现代普通话形式。
