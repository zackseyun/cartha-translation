lexical_decisions:
- source_word: ποιῆσαι
  choice: 铸造
  rationale: 该词本义宽泛，为“制作、造出”；与钱币宾语连用时，现代汉语自然表达为“铸造”。
- source_word: κόμμα
  choice: 钱币
  rationale: 此处指铸成的钱或钱币；“钱币”既能表达实物，也适合授予货币发行权的行政语境。
- source_word: ἴδιον
  choice: 自己的
  rationale: 表示归受话者所有或特属于受话者；“自己的”自然保留其所属含义。
- source_word: νόμισμα
  choice: 通货
  rationale: 指流通使用的钱币或货币；译作“通货”可与前面的“钱币”区分，并保留钱币作为该国流通货币的意思。
- source_word: τῆς χώρας σου
  choice: 你国的
  rationale: χώρα可指土地、地区或国家；在王权授予政治特权的语境中，“你国”简洁而自然。
