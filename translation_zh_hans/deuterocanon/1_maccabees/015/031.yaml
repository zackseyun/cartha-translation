base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: zh_hans
  text: 若不然，就交出五百他连得银子来代替它们；此外，为了你们所造成的破坏和各城的贡税[b]，还要交出五百他连得。[a]若不然，他们就要前来攻打你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句法紧缩，直译近于：“为了你们所造成的破坏和各城的贡税，另五百他连得。”本译文把这理解为在前一笔款项之外，另加的一笔五百他连得，用来偿付这两项。
    reason: lexical_alternative
  - marker: b
    text: “贡税”也可译作“各城的税款”或“各城的贡赋”。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: 若不然
  rationale: 自然表达带转折意味的条件句，并在两处重复，以保留原文最后通牒式的强调结构。
- source_word: δότε
  choice: 交出
  rationale: 在索取银款的语境中，比泛指的“给”更自然，也能体现命令语气。
- source_word: ἀντʼ αὐτῶν
  choice: 来代替它们
  rationale: 保留ἀντί所表达的替代关系，并用代词维持原文指代所具有的语境依赖性，不擅自明确其所指。
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: 五百他连得银子
  rationale: 保留古代计量和货币单位，并采用中文圣经传统中较通行的音译。
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: 你们所造成的破坏
  rationale: 以自然中文表达同源名词和动词的组合，同时明确保留对受话者造成破坏的指控。
- source_word: τῶν φόρων τῶν πόλεων
  choice: 各城的贡税
  rationale: φόροι可指税款或贡赋；“贡税”兼顾两层含义，并符合统治者向城市索取款项的历史语境。
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: 还要交出五百他连得
  rationale: 原句的账目结构紧缩；此处按附加款项理解，使第二笔五百他连得与第一笔清楚区分。
- source_word: παραγενόμενοι ἐκπολεμήσουσιν ὑμᾶς
  choice: 他们就要前来攻打你们
  rationale: 将先行分词与限定动词顺译为连续动作，既自然，又保留先来到、继而开战的威胁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“若不然”保留两次重复的最后通牒语气；“它们”和复数主语“他们”均不补明具体所指，以免消除原文依赖上下文的指代。脚注标记放在实际涉及相应歧义的词句之后。
