- source_word: Ἀράθῃ
  choice: 阿里阿拉特
  rationale: 原文所指很可能是历史上的 Ariarathes，正文采用便于识别该人物的通行汉译，同时用脚注保留抄本字形带来的异读可能。
- source_word: Ἀρσάκῃ
  choice: 阿尔萨克
  rationale: 采用 Arsaces/Ἀρσάκης 的常见现代汉语历史音译。
