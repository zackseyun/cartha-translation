  yaml_path: translation/deuterocanon/1_maccabees/015/023.yaml
  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: zh_hans
  text: 又送往各地：桑普萨梅[a]、斯巴达人、提洛、明都、西库翁、卡里亚、萨摩、旁非利亚和吕基亚、哈利卡纳苏斯、科斯、西代、阿拉杜斯、罗得、法塞利斯、戈尔提那、克尼多斯、塞浦路斯和昔兰尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “桑普萨梅”所指地点不确定；这里依照希腊文形式音译。
    reason: cultural_note
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: 各地区
  rationale: χώρα可指地区、地域或领土；此处处于公文收件地名单中，译作“各地区”宽泛自然，也避免让人联想到现代民族国家。
- source_word: Σαμψάμῃ
  choice: 桑普萨梅
  rationale: 这是与格形式的地名，确切对应地点及惯用汉译不确定，因此按希腊语形式音译。
- source_word: Σπαρτιάταις
  choice: 斯巴达人
  rationale: 这是指斯巴达人的族称复数，并非单指斯巴达城；译文保留其人物群体含义。
- source_word: καὶ εἰς ...
  choice: 又送往……，并送往……
  rationale: 反复出现的εἰς在本段公文语境中表示文书送达的对象或目的地；中文用“送往”承接上文并自然统摄名单。
- source_word: τὴν Καρίδα
  choice: 卡里亚
  rationale: 指卡里亚地区，按地名直接音译，无须增添“地区”。
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: 旁非利亚和吕基亚
  rationale: 二者均为地区名，采用通行的现代中文圣经地名形式。
- source_word: Κῶ
  choice: 科斯
  rationale: 岛名Κῶς的宾格形式；“科斯”贴近希腊语，也便于现代中文读者辨读。
- source_word: Ἄραδον
  choice: 阿拉杜斯
  rationale: 按希腊化城市名Ἄραδος音译，以区别于其他可能称作“亚拉得”的地点。
- source_word: τὴν Φασηλίδα
  choice: 法塞利斯
  rationale: 对应地名Φασηλίς，采用贴近希腊语形式且易读的音译。
- source_word: Κνίδον
  choice: 克尼多斯
  rationale: 对应Κνίδος，按希腊语音译；较之从拉丁化拼写转译，更直接反映原文。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代书面汉语。原文是一连串公文送达对象，译文以“送往”明确其行政语境，同时保留长名单的并列结构。专名优先依据希腊文音译，并在存在较常见异译时加注说明。
