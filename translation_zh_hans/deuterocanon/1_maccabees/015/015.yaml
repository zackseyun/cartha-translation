  yaml_path: translation/deuterocanon/1_maccabees/015/015.yaml
  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: zh_hans
  text: 努米尼和随行的人从罗马回来了[a]，带着给各王和各国的书信，信中这样写道：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“从罗马来了”；结合上下文，这是指他出使罗马后返回。
    reason: 说明“回来了”依据上下文明确了原文动词在此处的方向。
lexical_decisions:
- source_word: ἦλθεν
  choice: 回来了
  rationale: 该词本义是“来了”；结合上文努米尼出使罗马的语境，此处指他返回，因此译作“回来了”，同时用脚注说明原文的字面表达。
- source_word: οἱ παρʼ αὐτοῦ
  choice: 随行的人
  rationale: 这一习语指与努米尼一同前来的人；“随行的人”符合现代汉语，也不进一步推定他们的身份。
- source_word: ἐκ Ῥώμης
  choice: 从罗马
  rationale: 忠实表达地点来源，即由罗马而来。
- source_word: ἔχοντες ἐπιστολάς
  choice: 带着……书信
  rationale: 分词表示伴随情形，说明他们到来时携有书信；此译自然且保留原意。
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: 给各王和各国
  rationale: 与“书信”相连，表示书信的收受者；χώρα可指国家、地方或地区，此处译作“各国”最简明自然。
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: 信中这样写道
  rationale: 这是引出书信内容的惯用表达；中文以“这样写道”自然呈现τάδε所指的下文，而不增添解释。
