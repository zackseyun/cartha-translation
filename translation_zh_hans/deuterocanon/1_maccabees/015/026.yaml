  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: zh_hans
  text: 西门派了两千名经过挑选的人去与他并肩作战[a]，又送给他银子、金子和充足的装备[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他结盟”或“帮助他”。这个希腊语动词也可较宽泛地表示作为盟友提供支援；这里的语境偏重军事援助。
    reason: lexical_alternative
  - marker: b
    text: 或译“充足的物资”。希腊语所用的词含义较宽，可按语境指装备、器具或物资。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派给；送去
  rationale: 同一动词统领人员和物资；中文按宾语性质分别用“派给”和“送去”，既自然又保留“送出、差派”的基本含义。
- source_word: διαχιλίους ἄνδρας
  choice: 两千名……的人
  rationale: 直译人数与“人”，不擅自把ἄνδρας具体化为原文未明说的“士兵”。
- source_word: ἐκλεκτούς
  choice: 选拔出来的
  rationale: 表达这些人经过挑选；比“精兵”少一层军事身份的推断，也比生硬的“被选中的”更符合现代汉语。
- source_word: συμμαχῆσαι
  choice: 与他并肩作战
  rationale: 该动词可泛指结盟或作为盟友相助；本段军事语境支持具体译作共同作战，同时以脚注保留较宽的词义。
- source_word: ἀργύριον
  choice: 银子
  rationale: 保留具体的“银”，与后面的“金子”构成并列，不收窄为“钱财”。
- source_word: χρυσίον
  choice: 金子
  rationale: 直接对应原文，并与“银子”保持自然、对称的中文表达。
- source_word: σκεύη ἱκανά
  choice: 充足的装备
  rationale: σκεύη可指器具、装备或物资；军事支援语境下“装备”最为贴切，ἱκανά译为“充足的”。
