lexical_decisions:
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 该词指文书的抄本或副本；“副本”符合现代汉语行政文书语境，也不额外限定其制作或递送方式。
- source_word: αὐτῶν
  choice: 这些文书的
  rationale: 原文为复数，回指上文所述的多份书信或文书；译作“这些文书的”既保留复数，也使中文指代清楚。
- source_word: ἔγραψεν
  choice: 写给了
  rationale: 保留动词“写”的基本意义；与间接宾语“大祭司西门”搭配时，“写给了”是自然的现代汉语表达，不擅自扩展为“寄送”。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是犹太宗教与政治语境中 ἀρχιερεύς 的标准、清楚译法。
- source_word: Σίμωνι
  choice: 西门
  rationale: 采用现代中文圣经传统中对 Σίμων 的通行译名“西门”。
