base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: zh_hans
  text: 因为有些祸害之徒夺取了我们祖先的王国[a]，而我要为这王国主张权利，好使它恢复从前的样子，所以我征募了大量兵力[b]，并整备了战船[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸害之徒”也可直译为“瘟疫”或“灾害”；希腊文 λοιμοί 在这里以比喻方式贬称危害国家的人。
    reason: lexical_alternative
  - marker: b
    text: “征募了大量兵力”也可译为“招募了许多部队”；原词可能特别指征募外籍兵或雇佣军。
    reason: lexical_alternative
  - marker: c
    text: “整备了战船”也可译为“预备了战船”“配备了战船”或“建造了战船”；希腊文动词可指预备、配备或建造。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: 因为
  rationale: 引出说话者采取行动的原因；现代汉语中“因为……所以……”能清楚自然地表达原文的因果关系。
- source_word: τινες λοιμοὶ
  choice: 有些祸害之徒
  rationale: λοιμοί本义为“瘟疫、灾害”，在这里以贬义比喻有害之人；“祸害之徒”既保留辱骂色彩，又符合现代汉语表达。
- source_word: κατεκράτησαν
  choice: 夺取了
  rationale: 该动词与属格“王国”连用，表示取得支配或控制；“夺取了”体现其强行控制的政治含义。
- source_word: τῆς βασιλείας τῶν πατέρων ἡμῶν
  choice: 我们祖先的王国
  rationale: 直接保留原文的祖传、王朝性表述；此处βασιλεία按具体政治领域译作“王国”。
- source_word: βούλομαι
  choice: 我有意
  rationale: 表达意愿和意图；“有意”比口语化的“想要”更适合君王文书的庄重语体。
- source_word: ἀντιποιήσασθαι τῆς βασιλείας
  choice: 收复这王国
  rationale: 中间态动词与属格可表示主张权利、索取或争取占有；上下文强调恢复祖先的王国，因此“收复”自然地体现重新取得之意，同时脚注不必把它绝对化为已经成功。
- source_word: ὅπως ἀποκαταστήσω αὐτὴν
  choice: 使它恢复
  rationale: ὅπως表示目的，ἀποκαταστήσω表示恢复或重建；译文保留明确的目的关系。
- source_word: ὡς ἦν τὸ πρότερον
  choice: 从前的样子
  rationale: 表示回到先前状态；这是清楚、自然的现代汉语。
- source_word: ἐξενολόγησα
  choice: 招募了
  rationale: 指征集或招募军队，可能含招募外籍兵或雇佣兵的意味；正文采用不过度限定的“招募”，并在脚注保留该词的特殊军事可能性。
- source_word: πλῆθος δυνάμεων
  choice: 大批军队
  rationale: πλῆθος强调数量众多，δυνάμεων在军事语境中指兵力或部队；“大批军队”比逐字的“众多力量”更自然。
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: 装备了战船
  rationale: κατασκευάζω可指建造、预备或配备；“装备了战船”表达使战船可供作战之意，同时保留脚注说明其语义范围。
