  yaml_path: translation/deuterocanon/1_maccabees/015/041.yaml
  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: zh_hans
  text: 他修筑了基德龙[a]，并在那里部署骑兵和军队，好让他们出动，沿着犹太地区的道路巡行[b]，正如王吩咐他的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“修建了基德龙”。这里的希腊语动词本义为“建造、修建”；上下文提到驻军，可能含有修筑防御工事的意思。
    reason: lexical_alternative
  - marker: b
    text: “巡行”也可能含有沿这些道路实施控制、袭扰或劫掠的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: 修筑
  rationale: 该动词本义是“建造、修建”。军事语境暗示设防用途，但正文采用“修筑”以保留原词的宽泛含义，不直接增添“加固防御”的解释。
- source_word: τὴν Κεδρὼν
  choice: 基德龙
  rationale: 作为地名，按希腊文 Κεδρών 音译；“基德龙”适合现代普通话表达。
- source_word: ἔταξεν
  choice: 驻扎
  rationale: 宾语是骑兵和军队，且地点由 ἐκεῖ 指明，因此军事语境中的“驻扎”自然准确。
- source_word: ἵππεις
  choice: 骑兵
  rationale: 指骑马作战的人员，现代汉语用“骑兵”简洁而符合军事语体。
- source_word: δυνάμεις
  choice: 军队
  rationale: 此处为复数军事用语，泛指武装力量；“军队”自然且不限定具体兵种或编制。
- source_word: ὅπως
  choice: 好让
  rationale: 清楚表达目的关系，同时符合现代汉语叙事习惯。
- source_word: ἐκπορευόμενοι
  choice: 出动
  rationale: 分词表示这些兵力从驻地出去执行行动；“出动”既保留行动起点，也切合军事语境。
- source_word: ἐξοδεύωσιν
  choice: 巡行
  rationale: 该罕见动词在此表示沿道路行动，可能包含巡逻、控制或袭扰之意；“巡行”保留沿路活动的核心而不过度限定目的。
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: 犹太的道路
  rationale: 直接保留属格结构，指犹太地区的道路。
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: 正如王吩咐他的
  rationale: συντάσσω 在此指权威性的命令或指示；“吩咐”符合王命语境，又不过分强化措辞。
