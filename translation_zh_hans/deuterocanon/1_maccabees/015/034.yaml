  text: But[a], since we have the opportunity[b], we are holding fast to the inheritance of us and of our fathers.
translation:
  language: zh_hans
  text: 但我们既有良机[a]，就坚守我们和我们祖先的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “良机”也可译作“合宜的机会”或“有利的时刻”。希腊语καιρός在这里不是泛指时间，而是指适当或有利的时机。
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”或“祖业”；这里可指继承而来的财产或领地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: δέ承接上文并带有对比意味；译作“但”简洁自然，也保留转折语气。
- source_word: καιρὸν ἔχοντες
  choice: 既有这样的时机
  rationale: καιρός指合宜、有利的时机，而非泛指时间；“既有这样的时机”既表达分词结构的情境意味，又不把它限定为纯粹的因果或时间关系。
- source_word: ἀντεχόμεθα
  choice: 就坚守
  rationale: 该中动态形式表示牢牢持守、不肯放弃；“坚守”兼顾持续占有和坚定维护的含义，同时避免过度法律化地译成“坚持权利主张”。
- source_word: τῆς κληρονομίας
  choice: 产业
  rationale: κληρονομία可指继承所得之物、祖业或世袭领地；本段语境涉及祖传领土，“产业”在现代汉语中较自然，并保留继承与实际占有两方面的含义。
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: 我们和我们祖先的
  rationale: 两个属格共同修饰单数的κληρονομίας，表示这是属于现今群体、也属于其祖先的同一份产业；此译法避免暗示两份彼此分开的产业。
