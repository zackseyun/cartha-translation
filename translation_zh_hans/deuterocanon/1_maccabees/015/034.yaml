  register: 采用现代、庄重而易懂的叙事语言。“这样的”使καιρός与上下文自然衔接；“我们和我们祖先的产业”明确保留单数产业由双方共有的希腊语结构。脚注标记依其实际说明对象分别置于“时机”和“产业”之后。
