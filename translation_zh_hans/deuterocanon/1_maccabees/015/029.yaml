base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: zh_hans
  text: 你们使他们的疆域[a]荒凉，给那地造成了重大的打击[b]，又控制了我王国境内的许多地方[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的边境”；希腊文可指边界、边境地区或领土。
    reason: lexical_alternative
  - marker: b
    text: 或译“给那地造成了严重损害”；译作“重大的打击”的词也可指击打、创伤或灾害，具体含义取决于上下文。
    reason: lexical_alternative
  - marker: c
    text: 或译“辖制了我王国境内的许多地方”；希腊文动词表示取得支配权或行使统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια
  choice: 他们的疆域
  rationale: ὅρια可指边界、边境或一方领土；此处是军事与领土争端，用“疆域”既自然，也能涵盖遭破坏的地区，而不只是一条边界线。
- source_word: ἠρημώσατε
  choice: 使……荒凉
  rationale: 该动词表示使某地荒废、毁坏；“使……荒凉”贴近希腊文意象，并保留破坏造成荒芜的力度。
- source_word: πληγὴν μεγάλην
  choice: 重创
  rationale: πληγή可指击打、创伤、灾害等；在军事政治语境中，“重创”自然地表达严重打击，又不误解为疾病或瘟疫。
- source_word: ἐπὶ τῆς γῆς
  choice: 那地
  rationale: γῆ在这里指受到侵害的土地或地区，并非整个大地；“那地”符合上下文，也使中文表达简洁自然。
- source_word: ἐκυριεύσατε
  choice: 控制了
  rationale: 该动词表示取得支配权或行使统治；“控制了”准确表达实际掌控，同时不额外断定正式主权已经转移。
- source_word: τόπων πολλῶν
  choice: 许多地方
  rationale: τόποι是涵义较宽的“地方、地点”；“许多地方”保持原文的概括性，不擅自具体化为行政区。
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: 我国内
  rationale: βασιλεία在此指君王的国土或王国；“我国内”简洁自然，清楚表明这些地方属于说话者的王国。
theological_decisions: []
