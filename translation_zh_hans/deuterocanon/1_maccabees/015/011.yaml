  text: And King Antiochus pursued him[a], and he came to Dora, fleeing to the seacoast.
translation:
  language: zh_hans
  text: 安条克王追赶他；他逃到海边的多拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他来到多拉，逃往海边。”此短语通常理解为说明多拉临海。
    reason: 保留该短语较直译的可能性，同时说明按地理和句法语境，主译文将其理解为修饰多拉。
lexical_decisions:
- source_word: ἐδίωξεν
  choice: 追赶
  rationale: 此处表示在军事政治冲突中的主动追击；“追赶”自然地保留了动作力度，又不额外限定具体方式。
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: 安条克王
  rationale: 按现代汉语习惯把王号置于人名之后，简洁而庄重。
- source_word: ἦλθεν εἰς Δῶρα
  choice: 逃到……多拉
  rationale: ἦλθεν εἰς 表示抵达多拉；结合同时发生的 φεύγων，汉语用“逃到”可自然表达主要移动及逃亡情境。
- source_word: φεύγων
  choice: 逃
  rationale: 现在分词表示与“到达”同时发生的逃亡动作；融入“逃到”符合现代汉语表达，同时保留其情境意义。
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: 海边的
  rationale: 该短语说明多拉临海的位置。译作“海边的多拉”比把它误解为另一个移动终点更符合希腊语句法及地理语境。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。将分词结构整合为“逃到”，避免生硬重复；用“海边的多拉”明确原文是在说明多拉的临海位置。
