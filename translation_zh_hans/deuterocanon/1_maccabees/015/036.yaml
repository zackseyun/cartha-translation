  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: zh_hans
  text: 他却怒气冲冲地回到王那里，把这些话、西门的显赫气派[a]以及自己所看见的一切都禀报给王；王便勃然大怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显赫气派”也可译作“荣耀”“尊荣”或“威仪”。希腊语δόξα在这里可能指西门的尊贵地位，也可能侧重使者亲眼看见的盛大排场。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: 回到
  rationale: 此处表示使者转身返回王那里；“回到”在现代汉语中自然清楚，也保留了返回的方向感。
- source_word: μετὰ θυμοῦ
  choice: 怒气冲冲地
  rationale: 表示返回时的情绪和姿态；这一表达自然传达强烈怒意，而不显生硬。
- source_word: ἀπήγγειλεν
  choice: 禀报
  rationale: 指使者把所听所见带回报告给王；“禀报”符合臣属向君王报告的叙事语境。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: λόγους在此直接指前文所说的具体言语，译作“这些话”保持原文的具体性。
- source_word: τὴν δόξαν Σίμωνος
  choice: 西门的威仪
  rationale: δόξα在此可能指西门可见的显赫气派、尊荣或荣耀；“威仪”既能表现使者亲眼所见的外在盛况，也不完全排除身份尊荣的含义。
- source_word: πάντα ὅσα εἶδεν
  choice: 自己所看见的一切
  rationale: 完整保留原文的周全范围，并明确所见者是返回禀报的人。
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: 王便勃然大怒
  rationale: 希腊文以同根词结构强化怒气；“勃然大怒”用自然有力的现代汉语重现这一强调。
