  text: And it seemed good to us to receive the shield from them[a].
translation:
  language: zh_hans
  text: 我们认为，从他们那里接受那面盾牌是合宜的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们认为，接受他们的盾牌是合宜的。”希腊语“盾牌”可泛指盾牌；在这一外交语境中，它也可能是荣誉性礼物，传统上被理解为一面金盾。
    reason: 说明较贴近所有关系的另一种汉语表达，并交代ἀσπίς在该外交语境中可能的所指；不将“金”加入正文。
lexical_decisions:
- source_word: ἔδοξεν
  choice: 我们认为……是合宜的
  rationale: 此无人称不定过去时形式表示某事在一个群体看来是好的、适当的；译文保留正式公函的语气，又比生硬的直译更符合现代汉语。
- source_word: ἡμῖν
  choice: 我们
  rationale: 与ἔδοξεν合译为“我们认为”，自然表达作出判断的一方。
- source_word: δέξασθαι
  choice: 接受
  rationale: δέχομαι在此可指接收或接受；在外交赠礼语境中，“接受”既自然，也保留主动认可该礼物之意。
- source_word: τὴν ἀσπίδα
  choice: 盾牌
  rationale: ἀσπίς通常指盾牌。尽管历史语境可能指作为荣誉礼物的金盾，本节希腊文本没有“金”字，因此正文不予增补。
- source_word: παρʼ αὐτῶν
  choice: 他们送来的
  rationale: παρά接属格表示来源；结合“接受”与礼物语境，译作“他们送来的”比“从他们”更符合现代汉语，同时没有改变来源关系。
