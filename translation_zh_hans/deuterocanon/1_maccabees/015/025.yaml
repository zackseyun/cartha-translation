base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/025.yaml
  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: zh_hans
  text: 安条克王第二次[a]在多拉城下扎营，不断向城发起攻击[b]，又建造攻城器械。他把特利丰围困起来，使他无法出入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为“第二天”；所修饰的名词在希腊文中省略了。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“不断把手伸向城”；在这里指持续动用武力攻城。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: 在多拉城下扎营
  rationale: παρεμβάλλω在军事语境中指安营；ἐπί配合城名表达敌对进逼。“在……城下扎营”自然体现围城态势。
- source_word: ἐν τῇ δευτέρᾳ
  choice: 第二次
  rationale: 该短语省略了所修饰的阴性名词，语法上存在歧义；结合叙事中此前已记述围攻多拉，正文采用“第二次”，同时以脚注保留“第二天”的可能。
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: 不断向城发起攻击
  rationale: διὰ παντός表示持续不断；“把手带向它”在围城语境中是施加武力或持续进攻的表达，译为“发起攻击”清楚自然，并在脚注交代原文形象。
- source_word: μηχανὰς ποιούμενος
  choice: 建造攻城器械
  rationale: μηχαναί在围城语境中特指攻城用的机械装置，而非泛指一般机器。
- source_word: συνέκλεισεν τὸν Τρύφωνα
  choice: 把特利丰围困起来
  rationale: συγκλείω表示合围、封锁或困住；“围困起来”既符合军事场景，也自然引出其无法出入的结果。
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: 使他无法出入
  rationale: 带冠词的属格不定式在此表示阻止或结果；“无法出入”简洁呈现封锁的彻底性。
