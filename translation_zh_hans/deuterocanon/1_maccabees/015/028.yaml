  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: zh_hans
  text: 他派自己的“朋友”之一雅典诺比乌斯去同西门商谈，说：“你们占据着约帕、加泽拉[a]和耶路撒冷的堡垒[b]，都是我王国的城邑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加泽拉”是希腊语地名形式；此地通常被认定为“基色”。
    reason: cross_reference
  - marker: b
    text: 或译“耶路撒冷的阿克拉”。这里的希腊词可指“堡垒”或“要塞”，也可能用作耶路撒冷塞琉古王朝据点的专名。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 这是叙事中表示差遣的常用动词；结合目的分词译作“派……去”，符合现代汉语表达。
- source_word: Ἀθηνόβιον
  choice: 雅典诺比乌斯
  rationale: 按希腊语人名音译。
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: 自己的“朋友”之一
  rationale: “朋友”在希腊化王室语境中可能是宫廷头衔，而不只是私人关系；加引号保留这一可能含义，又不把它扩译成某个未经明说的具体官职。
- source_word: κοινολογησόμενον αὐτῷ
  choice: 同他交涉
  rationale: 该词表示共同商谈、磋商；上下文涉及领土主张，“交涉”准确而自然，但不进一步限定交涉的结果。
- source_word: κατακρατεῖτε
  choice: 占据着
  rationale: 表达持续控制、据有之意，并保留说话者指责对方占有这些地方的语气。
- source_word: Ἰόππης
  choice: 约帕
  rationale: 采用现代中文圣经传统中通行的地名形式。
- source_word: Γαζάρων
  choice: 加泽拉
  rationale: 依希腊语地名形式音译；其通常被认定为基色，另以脚注说明。
- source_word: ἄκρας
  choice: 堡垒
  rationale: ἄκρα可泛指堡垒或要塞，在这里也可能是耶路撒冷塞琉古据点的专名；正文采用清楚的普通名词，脚注保留专名理解。
- source_word: πόλεις τῆς βασιλείας μου
  choice: 这些都是我王国的城邑
  rationale: 直接表达这些地点属于说话者王国的主张；“城邑”保持庄重叙事语体。
