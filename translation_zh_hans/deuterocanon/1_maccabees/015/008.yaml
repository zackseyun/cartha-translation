  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: zh_hans
  text: 一切欠王室的款项，以及今后归入王室的一切收入[a]，从今以后，直到永远，都一概豁免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今后归入王室的一切收入”也可译作“今后应缴给王室的款项”或“今后归王所有的一切”。希腊原文只说明这些项目属于王室并将在以后产生，没有明确指出具体的收入类别。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικὸν
  choice: 一切应缴王室的款项
  rationale: ὀφείλημα 的核心意思是“所欠、所应缴之物”；结合财政诏令语境，译作“应缴……的款项”比“王室债务”更能避免误解为王室欠别人的债，同时保留其财政义务含义。πᾶν 表明全部包括在内。
- source_word: τὰ ἐσόμενα βασιλικά
  choice: 今后归王室所得的一切
  rationale: 中性复数搭配将来分词，泛指将来成为王室所有或归入王室的各项收入、应缴款等；原文没有限定为某一种税，故采用概括表达并以脚注保留可能译法。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从现在
  rationale: 自然、直接地表达起始时间。
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: 直到永远
  rationale: 表达诏令所宣告的永久效力；较逐字的“直到全部时间”更符合现代汉语。
- source_word: ἀφέσθω σοι
  choice: 都给你免除
  rationale: ἀφίημι 在法律和财政语境中指免除或取消义务；“给你免除”既保留受益者 σοι，也符合现代汉语诏令语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保持财政诏令的正式语气；避免用容易被理解为王室对外负债的“王室债务”，也不把原文未明确的款项窄化为税收。脚注标记置于正文相关概括表达之后。
