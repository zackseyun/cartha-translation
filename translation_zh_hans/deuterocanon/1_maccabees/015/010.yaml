  text: In the one hundred seventy-fourth year, Antiochus went out into the land of his fathers, and all the forces gathered to him, so that only a few were left with Tryphon.
translation:
  language: zh_hans
  text: 第一百七十四年，安提阿古出发前往他祖先的土地；所有军队都聚集到他那里，以致与特利丰在一起的人很少。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: 一百七十四年
  rationale: 按希腊文纪年公式直译为简洁自然的现代汉语；不另行补入塞琉古纪年等原文未明说的信息。
- source_word: ἐξῆλθεν
  choice: 出发
  rationale: 本义是“出去”；在此历史行军语境中，“出发”自然表达启程之意，又避免把原文强化为明确的“进军”。
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: 前往他祖先的土地
  rationale: 保留 γῆ 的“土地”和 πατέρων 的祖先含义；“前往”自然承接方向介词 εἰς。
- source_word: συνῆλθον πρὸς αὐτὸν
  choice: 聚集到他那里
  rationale: 保留“共同来到、聚集”及朝向安提阿古的动态，不直接释为政治意味更强的“归附”。
- source_word: πᾶσαι αἱ δυνάμεις
  choice: 各路军队
  rationale: δυνάμεις 在军事叙事中指军力或部队；“各路军队”在现代汉语中自然表达全部相关部队纷纷汇集。
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: 以致跟随特利丰的人寥寥无几
  rationale: ὥστε 表结果；“寥寥无几”准确表达 ὀλίγους。“跟随”使 σὺν 在军事阵营语境中的关系自然可懂，但不加入“留下”等希腊文未明说的过程。
