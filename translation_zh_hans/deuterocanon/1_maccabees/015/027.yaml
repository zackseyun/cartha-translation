  text: And he was not willing to accept them[a], but rejected everything that he had previously agreed to with him[b], and became estranged from him.
translation:
  language: zh_hans
  text: 他不肯接受这些东西，却废弃了先前同他达成的一切协议，并同他疏远了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠβούλετο
  choice: 不肯
  rationale: 未完成时表达持续的意愿或态度；“不肯”在现代汉语中自然地传达不愿接受之意。
- source_word: αὐτὰ
  choice: 这些东西
  rationale: 中性复数代词回指上文所提之物；本节自身未明确其具体内容，因此不作过度限定。
- source_word: δέξασθαι
  choice: 接受
  rationale: 在所送之物或所提条件遭拒的语境中，“接受”比字面化的“收取”更自然。
- source_word: ἠθέτησεν
  choice: 废弃
  rationale: ἀθετέω可指搁置、取消或使无效；“废弃”保留对既有协议予以否定和撤销的政治意味。
- source_word: πάντα ὅσα συνέθετο αὐτῷ
  choice: 与他所达成的一切协议
  rationale: συντίθημι中间态在此表示订立或达成协议；此译法清楚表达双方先前的约定，同时以“一切”对应πάντα。
- source_word: τὸ πρότερον
  choice: 先前
  rationale: 准确表达此前的时间关系，简洁自然。
- source_word: ἠλλοτριοῦτο
  choice: 渐渐与他疏远
  rationale: 未完成时可呈现持续发展的关系破裂；“疏远”保留由亲近转为生分的含义，而不夸大为公开敌对。
- source_word: αὐτῷ
  choice: 与他
  rationale: 配合汉语“疏远”的自然结构，表达关系上的隔离。
