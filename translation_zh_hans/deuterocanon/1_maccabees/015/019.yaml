  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: zh_hans
  text: 所以，我们认为应当写信给各王和各国[a]，叫他们不要图谋加害他们，也不要向他们、他们的城邑和他们的疆土[b]发动战争，并且不要与正同他们交战的人结盟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文χῶραι既用于收信的“各国”，也用于属于犹太人的“疆土”；两处也可译作“地区”或“领土”。
    reason: lexical_alternative
  - marker: b
    text: 斯威特印本此处作“他们的A城邑”，其中字母“A”看来是版本或转录问题；按上下文应为“他们的城邑”。
    reason: textual_variant
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  choice: 所以，我们认为应当
  rationale: 这是公文中表示认可或决议的惯用表达；译文保留正式语气，同时符合现代汉语习惯。
- source_word: γράψαι τοῖς βασιλεῦσιν καὶ ταῖς χώραις
  choice: 写信给各王和各国
  rationale: γράψαι直译为“写”，语境明确指正式书信；χῶραι在这里与“王”并列，指收信的政治地域实体，译作“各国”。
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  choice: 不要谋害犹太人
  rationale: ἐκζητέω与κακά连用表示主动寻求加害；“谋害”自然凝练，又不把含义局限为公开战争。代词依上下文明确为“犹太人”，避免连续代词造成歧义。
- source_word: μὴ πολεμήσωσιν αὐτοὺς
  choice: 不要攻打他们
  rationale: πολεμέω在政治军事语境中指交战或发动战争；“攻打”比“作战”更自然，并保留敌对行动的方向。
- source_word: τὰς πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν
  choice: 他们的城邑及疆土
  rationale: πόλεις译作较庄重而易懂的“城邑”；此处χώρα指其管辖土地，译作“疆土”比重复“国家”更符合汉语并保留同一词的地域含义。
- source_word: μὴ συμμαχώσιν τοῖς πολεμοῦσιν αὐτούς
  choice: 不要与攻打他们的人结盟
  rationale: συμμαχέω表示成为军事盟友或给予盟军支持；“与……结盟”准确而自然。现在分词πολεμοῦσιν表示正在与其交战的人。
