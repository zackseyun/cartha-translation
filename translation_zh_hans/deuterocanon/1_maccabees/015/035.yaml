  text: But concerning Joppa and Gazara, you ask for them. These were inflicting great harm on the people and on our land. For these we will give one hundred talents. And he answered him not a word.
translation:
  language: zh_hans
  text: 至于你所索要的约帕和基色，它们不断给百姓和我们的土地造成极大的损害。我们将为这两座城付一百他连得。他没有回答对方一句话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰόππης
  choice: 约帕
  rationale: 采用该古代港城通行的现代中文圣经地名译法。
- source_word: Γαζαρηνῶν
  choice: 基色
  rationale: 按上下文指基色城；希腊文本的形式虽不寻常，但与本章所争议的城邑相符。
- source_word: αἰτεῖς
  choice: 索要
  rationale: 此处不是一般询问，而是在政治交涉中要求交出城邑；“索要”保留其要求意味，又不过度强化为武力威胁。
- source_word: πληγὴν μεγάλην
  choice: 重创
  rationale: 原义为“重大打击／创伤”；“重创百姓”自然凝练，并保留伤害的强度。
- source_word: τάλαντα ἑκατόν
  choice: 一百他连得
  rationale: 保留古代重量及货币单位，不擅自换算现代币值，也不补入原文未明说的金属种类。
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: 一句话也没有回答
  rationale: 符合现代汉语表达，并准确传达完全不作答的强调。
theological_decisions:
- issue: 末句两个人称代词的指向
  choice: 保留“他……回答”的代词表达
  alternative: 补出具体人物姓名
  rationale: 本节希腊文本只用代词；补名会替读者消除原文依赖上下文确定的指向。
- issue: 城邑造成伤害的时间与持续性
  choice: 译为“曾重创……祸害……”
  alternative: 译为“正在造成重大伤害”
  rationale: ἐποίουν为未完成过去时，表示过去一段时期持续或反复造成伤害；“曾”将叙述置于过去，同时不硬性断定伤害已彻底终止。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与外交交涉语体。“约帕”“基色”使用常见圣经地名；“他连得”保留古代单位。末句不补人物姓名，以保留原文的代词衔接。
