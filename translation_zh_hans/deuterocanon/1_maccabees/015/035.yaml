revisions:
- from: 至于你所索要的约帕和基色，这两座城曾重创百姓，祸害我们的土地。我们愿为此交付一百他连得。他却一句话也没有回答。
  to: 至于你所索要的约帕和基色，它们不断给百姓和我们的土地造成极大的损害。我们将为这两座城付一百他连得。他没有回答对方一句话。
  rationale: 修订仅处理时体、将来语气及末句受事指向。“不断……造成极大的损害”对应ἐποίουν πληγὴν μεγάλην，并保持原文对损害具体形式的概括；不补出两位人物的姓名，也不界定一百他连得是何种正式款项。
