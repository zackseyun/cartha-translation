  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
translation:
  language: zh_hans
  text: 因为他知道，种种祸患已经汇聚起来对付他[a]，军队也离弃了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“种种灾祸已经聚集起来攻击他。”希腊文动词含有许多事物集中聚集的意味；在这里，这些祸患是针对他而来的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“兵力也离开了他。”这里的希腊词是军事用语，指军队或武装力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 他知道
  rationale: 该形式在这里表达过去持续的认知状态；现代汉语用“知道”即可自然呈现，无须另加“早已”等原文没有明确表达的意味。
- source_word: ἐπισυνῆκται
  choice: 已经汇聚起来
  rationale: 该动词的完成时强调聚集已经形成的局面；“已经汇聚起来”既保留完成状态，也传达集中而来的意味。
- source_word: ἐπʼ αὐτόν
  choice: 对付他
  rationale: 在“祸患”及聚集这一敌对语境中，ἐπί加宾格表示针对他而来；“对付他”比直译“在他之上”自然，并保留敌对方向。
- source_word: κακά
  choice: 种种祸患
  rationale: 此处指不利处境、灾祸，而非道德意义上的“恶”；“种种祸患”既涵盖军事与政治危机，也符合复数形式。
- source_word: ἀφῆκαν
  choice: 离弃了
  rationale: ἀφίημι在此表示离开、弃置；“离弃了”体现其武装支持不再追随他的语境，同时不额外说明离弃的方式。
- source_word: αἱ δυνάμεις
  choice: 军队
  rationale: δυνάμεις在军事叙事中通常指武装力量或部队；“军队”是普通现代读者易懂的对应表达。原文没有所有格，因此不译作“他的军队”。
