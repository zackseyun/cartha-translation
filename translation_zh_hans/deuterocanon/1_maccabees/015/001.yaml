  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: zh_hans
  text: 德米特里王之子安条克从海上的诸岛寄出数封书信，送给犹太人[a]的祭司和民族长[b]西门，也送给整个民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地人”；希腊语原词可按语境指犹太民族，也可带有地域和政治含义。
    reason: lexical_alternative
  - marker: b
    text: “民族长”是正式职衔，指一个民族或族群的统治者、领袖。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 发出
  rationale: 与“书信”搭配自然，准确表达不定过去时所叙述的发送行动。
- source_word: ἐπιστολάς
  choice: 书信
  rationale: 采用可作集合表达的现代汉语名词；上下文仍容纳希腊文明确的复数，不使用带教会文体色彩的“书札”。
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: 从海中诸岛
  rationale: 保留复数岛屿和海域方位，不擅自认定具体岛群；“诸岛”也明确反映复数。
- source_word: ἱερεῖ
  choice: 祭司
  rationale: 这是西门的职衔之一；译文不加希腊文所无的定冠意味。
- source_word: ἐθνάρχῃ
  choice: 民族长
  rationale: 以简明的历史政治职衔对应“统治一个民族或族群者”，比泛化为“领袖”更能保留正式称号，又避免“总督”所暗示的特定行政体制。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 此处指西门所治理的犹太群体；“犹太人”在现代汉语中最自然，同时以脚注保留“犹太地人”的地域—政治可能性。
- source_word: παντὶ τῷ ἔθνει
  choice: 全体国民
  rationale: 保留ἔθνος在此处的共同体和政治色彩，并明确这是与西门并列的收信对象。
- source_word: τοῦ βασιλέως
  choice: 王
  rationale: 置于专名“德米特里”之后构成自然的汉语王号表达。
theological_decisions:
- issue: 政治职衔ἐθνάρχης的译法
  choice: 民族长
  alternative: 民族领袖；统治者；总督
  rationale: 采用相对正式而不过度具体化的称号，既呈现西门对一个民族共同体的治理身份，也不把希腊文强行归入后世某种宪政或行政制度。
- issue: Ἰουδαῖοι的群体指称
  choice: 犹太人
  alternative: 犹太地人
  rationale: 上下文同时具有族群、宗教和政治层面；正文选用现代汉语通行称呼，脚注保留地域—政治读法，不消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“海中诸岛”保留原文地理表达的开放性；“也送给”明确παντὶ τῷ ἔθνει与西门同为收信对象。脚注标记分别紧随所说明的“民族长”和包含“犹太人”概念的“全体国民”之后。
