lexical_decisions:
- source_word: Λεύκιος
  choice: 路求
  rationale: 按现代中文圣经人名惯例音译此罗马人名；“路求”也与常见的新约译名形式一致。
- source_word: ὕπατος
  choice: 执政官
  rationale: 指罗马共和国的 consul，用历史上准确且现代读者易懂的“执政官”。
- source_word: Ῥωμαίων
  choice: 罗马
  rationale: 原文为复数属格“罗马人的”，修饰“执政官”；中文以“罗马执政官”自然、准确地表达其官职归属。
- source_word: Πτολεμαίῳ
  choice: 普托勒密
  rationale: 该王室人名采用现代中文历史文献中的通行音译。
- source_word: βασιλεῖ
  choice: 王
  rationale: 作为普托勒密的同位称号；置于姓名之后符合自然中文称谓。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的固定问候语；“问安”传达其书信功能，避免按字面译作“欢喜”而造成误解。
