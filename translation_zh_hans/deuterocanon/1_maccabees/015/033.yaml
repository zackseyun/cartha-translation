  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: zh_hans
  text: 西门回答他说：“我们既没有夺取别人的土地，也没有占据别人的产业；我们所取得的，只是我们祖先的产业，它曾一度被我们的仇敌不公正地[a]占据。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不公正地”也可译作“无理地”或“未经适当裁断便”。希腊语既可强调不合公义，也可强调没有经过适当审断。
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: 别人的土地
  rationale: ἀλλότριος在这里首先表示属于他人，而不只是地理意义上的“外国”；此译明确表达所有权主张。
- source_word: εἴλημμεν
  choice: 夺取
  rationale: 完成时表达由取得而形成的现有占有状态；结合西门否认不当获地的语境，“夺取”自然准确。
- source_word: ἀλλοτρίων
  choice: 别人的产业
  rationale: 这是省略中心词的中性复数属格，泛指属于他人的财物或领地；“产业”既适合领土语境，也保留其范围可能宽于土地的特点。
- source_word: κεκρατήκαμεν
  choice: 占据
  rationale: κρατέω可指控制、占有或夺占；在领土争议中，“占据”保留控制之意，并与前面的“夺取”形成自然区分。
- source_word: κληρονομίας τῶν πατέρων ἡμῶν
  choice: 我们祖先的产业
  rationale: κληρονομία指承受而来的产业；“祖先”在现代汉语中自然表达πατέρων所指的先辈，又不额外扩展为神学论证。
- source_word: ἀκρίτως
  choice: 无理
  rationale: 该副词可表示未经公正裁断、缺乏正当判断或不合公义；正文用“无理”保持简洁，脚注说明其司法程序色彩。
- source_word: ἐν τινι καιρῷ
  choice: 曾一度
  rationale: 该短语表示过去某个不确定的时期；“曾一度”自然保留时间的不确定性，不强行判定持续时长。
- source_word: κατεκρατήθη
  choice: 被……霸占
  rationale: κατακρατέω的被动式表示遭强力控制或占有；“霸占”符合敌方不正当占领祖业的语境。
theological_decisions:
- issue: 如何表达祖传产业的主张而不加入经文以外的盟约或民族主义解释
  choice: 我们所得的，不过是我们祖先的产业
  alternative: 而是我们列祖的基业
  rationale: 正文保留西门以继承权为根据的申辩，却不加入神授、应许之地等原文未明说的解释。
- issue: πατέρων的性别与代际含义
  choice: 祖先
  alternative: 列祖
  rationale: 这里指作为产业来源的先辈群体；现代汉语“祖先”清楚自然，并未改变原文所指，且避免“列祖”可能带来的特定经文语体色彩。
- issue: ἀκρίτως所含公义与程序层面的张力
  choice: 正文译“无理”，脚注保留“未经公正裁断”的可能
  alternative: 不公正地；未经审判便
  rationale: 原词既可能强调不公义，也可能强调没有适当审断；不在正文中将其单一化为现代法律程序。
translation_notes:
  register: 采用庄重而现代的叙事语体。“别人的土地／别人的产业”重现原文两个ἀλλότριος词形的平行；“祖先的产业”比“列祖的基业”更易为普通现代读者理解，同时保留继承含义。
