  text: 他们还带来了一面价值五千弥那的金盾牌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“一面出自五千弥那的金盾牌。”希腊语的这个表达也可理解为“价值五千弥那”；在这里较可能是指盾牌的价值。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: 带来了
  rationale: 这是φέρω的简单过去叙事用法；在外交赠礼的语境中译作“带来”自然稳妥，不额外解读为正式“献上”。
- source_word: ἀσπίδα
  choice: 盾牌
  rationale: ἀσπίς通常指盾；“盾牌”是现代汉语中清楚自然的通称，不武断限定其具体形制。
- source_word: χρυσῆν
  choice: 金盾牌
  rationale: 形容词χρυσῆν修饰“盾牌”，可指以金制成或饰金；正文采用简洁的“金盾牌”，保留原文表达。
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: 价值五千弥那
  rationale: ἀπό与金额连用，在此赠礼语境中很可能表示价值或造价；译作“价值五千弥那”符合现代汉语，同时以脚注保留较形式对应的理解。
- source_word: μνῶν
  choice: 弥那
  rationale: 保留古代重量兼货币单位的历史特性，避免换算成并不精确的现代币值。
