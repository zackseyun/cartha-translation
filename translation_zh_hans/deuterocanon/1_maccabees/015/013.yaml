  text: And Antiochus encamped against Dora[c][b][a], and with him were twelve myriads of fighting men and eight thousand cavalry.
translation:
  language: zh_hans
  text: 安条克在多拉[a]城下扎营；与他一同的有十二万名战士[b]和八千名骑兵[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文地名作“多拉”；有些译本作“多珥”。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“十二个万”，也就是十二万。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“八千匹马”；这是军事上的集合说法，指骑兵部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: 在……城下扎营
  rationale: παρεμβάλλω指军队安营；与ἐπί连用时带有针对该地采取敌对军事部署的意味。“城下扎营”自然传达临城驻军、准备攻打的语境，又不把经文未明说的具体围城行动写入正文。
- source_word: Δῶρα
  choice: 多拉
  rationale: 按本节希腊文地名Δῶρα音译；另有依希伯来传统译作“多珥”的做法，列入脚注。
- source_word: δώδεκα μυριάδες
  choice: 十二万
  rationale: μυριάς为一万，δώδεκα μυριάδες即十二万。现代汉语直接换算清楚自然；脚注保留希腊文“十二个万”的古代计数表达。
- source_word: ἀνδρῶν πολεμιστῶν
  choice: 战士
  rationale: 该词组指参与作战的男子。“战士”在现代汉语中简洁、庄重，能准确表达军事人员，避免生硬直译为“作战的男人”。
- source_word: ὀκτακισχίλια ἵππος
  choice: 八千名骑兵
  rationale: ἵππος字面为“马”，此处在军队数量统计中作集合名词，指骑乘部队；译作“骑兵”符合现代汉语军事表达。
theological_decisions: []
