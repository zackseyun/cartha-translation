  yaml_path: translation/deuterocanon/1_maccabees/015/014.yaml
  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: zh_hans
  text: 他包围了那城[a]，海上的船只也合拢而来[b]；他从陆地和海上不断压迫那城，不准任何人出去或进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “包围”也可译作“环绕”；原文动词含有将城围住的具体形象。
    reason: lexical_alternative
  - marker: b
    text: “合拢而来”所译的原文动词可指聚拢、逼近；这里指船只从海上收紧对该城的包围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: 包围
  rationale: 该词本义是环绕、围住；“包围”在现代汉语中自然地保留了具体的军事图景，又不像“围攻”那样额外强调进攻行动。
- source_word: συνῆψαν
  choice: 逼近
  rationale: 以“船只”为主语并与“从海上”连用时，表示舰船合拢、迫近以收紧封锁；“逼近”自然传达这一动态，同时不武断地译成已经交战。
- source_word: συνέθλιβεν
  choice: 夹攻
  rationale: 该动词带有挤压、逼迫的强烈意味，未完成时表示持续行动；结合陆海两个方向，“夹攻”简洁自然地表达两面持续施压的围城态势。
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: 从陆地和海上
  rationale: 保留重复介词所呈现的两个施压方向；“陆地”与“海上”的搭配符合现代汉语习惯。
- source_word: οὐκ εἴασεν
  choice: 不准任何人
  rationale: 准确表达禁止或不许可的意思，比“不给任何人……”更自然简洁。
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: 出入
  rationale: “出入”是现代汉语中自然的成对表达，清楚表示全面封锁，涵盖出去与进入两方面。
