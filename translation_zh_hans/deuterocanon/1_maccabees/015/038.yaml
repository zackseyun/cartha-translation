  text: And the king appointed Cendebaeus commander of the coastal region, and gave him infantry and cavalry forces.
translation:
  language: zh_hans
  text: 王任命肯德拜为沿海地区的指挥官，又把步兵和骑兵部队交给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: 任命
  rationale: 此处指王将某人正式置于军政职务上；“任命”准确、自然地表达这一行政行为。
- source_word: Κενδεβαῖον
  choice: 肯德拜
  rationale: 按希腊语人名 Κενδεβαῖος 音译，并采用适合现代汉语的简洁形式。
- source_word: ἐπιστράτηγον
  choice: 统帅
  rationale: 该词指受命统辖特定地区的高级军事长官；“统帅”保留军事职权，又不额外限定具体官制。
- source_word: τῆς παραλίας
  choice: 沿海地区
  rationale: παραλία 在这里指海岸地带或沿海辖区；译作“沿海地区”能清楚表明其地域管辖范围。
- source_word: δυνάμεις
  choice: 部队
  rationale: 在军事语境中指武装力量或军队；与后面的步兵、骑兵搭配时，“部队”最自然。
- source_word: πεζικὰς
  choice: 步兵
  rationale: 指徒步作战的军队，与骑兵相对；“步兵”是现代汉语标准军事用语。
- source_word: ἱππικὰς
  choice: 骑兵
  rationale: 指骑乘作战的军队，与步兵并列；“骑兵”准确而简洁。
- source_word: ἔδωκεν αὐτῷ
  choice: 交给他
  rationale: 希腊文直义为“给了他”；在部队作为宾语的语境中，“交给他”自然表达将这些兵力置于其指挥之下，同时不过度发挥。
