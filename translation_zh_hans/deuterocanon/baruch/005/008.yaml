lexical_decisions:
- source_word: οἱ δρυμοί
  choice: 树林
  rationale: 该词在此指林木茂密之处；译作“树林”自然清楚，也与后面的单株“树木”形成合宜区别。
- source_word: πᾶν ξύλον εὐωδίας
  choice: 一切芳香的树木
  rationale: 保留原文“每一／一切”和“香气”的意义；“芳香的树木”符合现代汉语表达。
- source_word: ἐσκίασαν
  choice: 为……遮荫
  rationale: 准确表达树木投下荫影、给以色列遮蔽的动作。
- source_word: προστάγματι τοῦ θεοῦ
  choice: 照着上帝的命令
  rationale: 无介词与格可表达凭借、原因或规范；“照着”既自然，又保留一切出于上帝命令的含义。
