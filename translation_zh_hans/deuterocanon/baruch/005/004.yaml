base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/004.yaml
  text: For your name will be called by God forever[b][a], “Peace of righteousness and glory of godliness.”
translation:
  language: zh_hans
  text: 因为你的名必由上帝永远称为“公义[a]的平安和敬虔[b]的荣耀”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。
    reason: lexical_alternative
  - marker: b
    text: “敬虔”或译“敬畏上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθήσεται
  choice: 称……为
  rationale: 该词是καλέω的将来时被动形式，在起名语境中表示赋予名称；中文以主动式“上帝必……称……为”自然表达原文的施事关系。
- source_word: τὸ ὄνομα
  choice: 你的名
  rationale: 保留圣经中“名”所承载的身份与称号意味，不将其窄化为单纯的“头衔”。
- source_word: παρὰ τοῦ θεοῦ
  choice: 上帝……称
  rationale: παρά加属格在此可表示来源或施事者；结合称名用语，译文用“上帝”作主动句主语，清楚传达名称由上帝赋予。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示持续永久的惯用语，“永远”符合现代汉语，并保留应许的长久性。
- source_word: εἰρήνη
  choice: 平安
  rationale: 该词是上帝所赐名称的一部分；“平安”既自然，又涵盖和平、安宁与福祉的圣经语义。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: “公义”保留δικαιοσύνη较广的道德与关系性含义，不将其仅限于司法或社会层面的正义；“正义”作为可行异译收入脚注。
- source_word: δόξα
  choice: 荣耀
  rationale: “荣耀”保留该词在圣经语境中尊荣、光辉的共鸣，也与整句庄重的称名格式相称。
- source_word: θεοσεβείας
  choice: 敬神
  rationale: θεοσέβεια指向对上帝的敬重与虔诚；“敬神”简洁明确，并避免“敬虔”对部分现代读者可能显得较为教会化或抽象。
theological_decisions:
- issue: 所赐名称中δικαιοσύνης的译法
  choice: 公义
  alternative: 正义
  rationale: 此处作为诗性名称的一部分，语义可以兼及正直、合宜及正义。“公义”较能保持其宽广含义，而脚注保留“正义”的可能性。
- issue: 句末两个主格短语与前文的关系
  choice: 用引号标示为上帝所赐名称的内容
  alternative: 不用引号，视作同位说明
  rationale: 原文在“你的名将被称为”之后列出两个主格短语，最自然地构成所赐名称；引号只帮助现代读者识别句法关系，并未增添原文内容。
- issue: θεοσεβείας所表达的敬虔对象
  choice: 敬神
  alternative: 敬虔；敬畏上帝
  rationale: 该词本身明确涉及对神的敬重。“敬神”直白保留对象，其他可行表达列入脚注，以保存其敬虔、敬畏的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。主动句避免机械照搬希腊语被动结构；引号清楚标示新名称的内容。两个脚注标记均紧随相关短语。
