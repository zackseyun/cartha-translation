base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/009.yaml
  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: zh_hans
  text: 因为上帝必欢欢喜喜地，以自己荣耀的光引领以色列，带着从他而来的怜悯和公义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译为“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγήσεται
  choice: 必……引领
  rationale: 未来时中动态在此表示上帝将引导以色列；“引领”自然庄重，也保留出埃及与复兴的意象。
- source_word: μετʼ εὐφροσύνης
  choice: 欢欢喜喜地
  rationale: μετά加属格表示伴随情形；汉语用副词结构自然表达上帝带领时的喜乐。
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: 以自己荣耀的光照亮他们
  rationale: 与格可表工具或伴随；“以……光照亮”清楚表达这光在引领中的作用。“荣耀”保留δόξα的圣经用语。
- source_word: σὺν ἐλεημοσύνῃ καὶ δικαιοσύνῃ
  choice: 并以……怜悯和公义与他们同在
  rationale: σύν明确表达伴随；补出“与他们同在”，使汉语句法完整，同时保留怜悯与公义伴随引领的关系。
- source_word: ἐλεημοσύνῃ
  choice: 怜悯
  rationale: 此处指从上帝而来的慈悯行动或属性，不宜按其他语境译为“施舍”。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: “公义”涵盖正直与公正的行动，适合与上帝的怜悯并列；“正义”仍是可行异译。
- source_word: τῇ παρʼ αὐτοῦ
  choice: 那从他而来的
  rationale: 忠实表达παρά所指的来源；希腊语形式直接修饰δικαιοσύνῃ，但语义上可能涵盖并列的“怜悯和公义”，译文保留这种合并理解。
theological_decisions:
- issue: δικαιοσύνη在复兴语境中的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”保留该词较宽广的圣经神学含义，包括上帝正直的品格与公正的作为；“正义”较突出司法或社会公正层面。
- issue: τῇ παρʼ αὐτοῦ的修饰范围
  choice: 理解为从上帝而来的怜悯和公义
  alternative: 只修饰公义
  rationale: 就语法形式而言，阴性单数冠词短语与最近的δικαιοσύνῃ一致；但并列结构也容许它概括两项。正文采用自然的合并理解，脚注保留较严格的就近修饰读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢欢喜喜地”比“以喜乐”更自然；正文稍作显化，以“照亮他们”“与他们同在”表达两个与格及伴随结构的语义关系。
