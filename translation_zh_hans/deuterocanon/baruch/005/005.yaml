base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: zh_hans
  text: 耶路撒冷啊，起来，站在高处，向东方环顾；看你的儿女，他们从日落之处到日出之处，已经奉圣者的话[a]聚集，因“上帝的记念”[b]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭圣者的话”“由于圣者的话”。这里的与格可表示凭借，也可表示缘由或根据。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“因上帝记念了他们”或“因记念上帝”。希腊语表达简练，既可能指上帝记念他的子民，也可能指他们记念上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάστηθι
  choice: 起来
  rationale: 不定过去时命令语气发出直接召唤；“起来”符合现代汉语，也保留行动的力度。
- source_word: στῆθι ἐπὶ τοῦ ὑψηλοῦ
  choice: 站在高处
  rationale: 原文只说单数的“高处”，没有明说山；此译保留登高远望的画面而不作增补。
- source_word: περίβλεψαι πρὸς ἀνατολάς
  choice: 向东方环顾
  rationale: περίβλεψαι 含环视之意，πρὸς ἀνατολάς 指向东方；此译同时保留视线的方向和环望的动作。
- source_word: σου συνηγμένα τὰ τέκνα
  choice: 你的儿女……聚集起来
  rationale: τέκνα 不限男性，译作“儿女”；完成时被动分词表示他们已被聚集、处于聚集的状态。
- source_word: ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  choice: 从日落之处到日出之处
  rationale: 保留原文日落与日出的形象及其所表达的广阔地域范围，不简化为“从西到东”。
- source_word: τῷ ῥήματι τοῦ ἁγίου
  choice: 因着圣者的话
  rationale: “圣者”准确反映带冠词的实词化形容词；与格可表示凭借、缘由或响应，“因着”保留话语促成聚集的关系，并以脚注说明可能译法。
- source_word: χαίροντες
  choice: 欢喜
  rationale: 现在时分词描写聚集的儿女持续欢喜的状态；汉语用并列谓语表达自然。
- source_word: τῇ τοῦ θεοῦ μνείᾳ
  choice: 因上帝的记念
  rationale: μνεία 可指记念或提念，属格既可能指上帝记念他们，也可能指他们记念上帝；正文采用紧凑表达，脚注保留两种理解。
theological_decisions:
- issue: τῇ τοῦ θεοῦ μνείᾳ 中属格关系的指向
  choice: 译作“因上帝的记念”，不在正文中明定谁记念谁
  alternative: “因上帝记念了他们”或“因记念上帝”
  rationale: 希腊文结构简练，既可理解为上帝对其子民的记念，也可理解为子民对上帝的记念；经文本身未强制排除任何一项，因此保留神学张力。
- issue: τῷ ῥήματι 的与格功能
  choice: 译作“因着圣者的话”
  alternative: “奉圣者的话”或“由于圣者的话”
  rationale: 该与格可表达工具、根据或引发行动的话语；避免把它限定为单一的语法关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶路撒冷啊”保留先知式呼告；“站在高处”“向东方环顾”清楚呈现登高眺望的场景。分号与“看哪”标明由命令转入所见异象。
