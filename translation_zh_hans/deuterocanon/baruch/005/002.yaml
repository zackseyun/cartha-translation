base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
translation:
  language: zh_hans
  text: 要披上从上帝而来的公义外袍[a][b]，把永恒者的荣耀之头巾戴在头上[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外袍”也可译作“斗篷”或“披风”；希腊词指披在外面的宽大衣物。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
  - marker: c
    text: “头巾”也可译作“头饰”；传统上有译作“礼冠”的。
    reason: lexical_alternative
  - marker: d
    text: “永恒者的荣耀”也可较宽泛地理解为“永恒的荣耀”；但希腊文较可能是指“永恒者的荣耀”，即上帝的荣耀。
    reason: alternative_reading
lexical_decisions:
- source_word: περιβαλοῦ
  choice: 披上
  rationale: 这是 περιβάλλω 的命令式；“披上”自然保留穿戴外衣的意象，也切合后接外袍。
- source_word: διπλοΐδα
  choice: 外袍
  rationale: 此词指披在外面的宽大衣物，可能带有折叠或双层之意；“外袍”既明白又庄重，避免过度具体化。
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  choice: 从上帝而来的公义
  rationale: παρὰ τοῦ θεοῦ 表示来源；“从上帝而来”明确传达这一关系。δικαιοσύνη 在此衣袍意象中译作“公义”，并以脚注保留“正义”的可能。
- source_word: ἐπίθου
  choice: 戴在
  rationale: 这是 ἐπιτίθημι 的命令式；对象是头巾，现代汉语用“戴在头上”比直译“放在头上”更自然。
- source_word: μίτραν
  choice: 头巾
  rationale: μίτρα 指缠裹式头饰；“头巾”通俗准确，且避免“冠冕”或教会礼冠所带来的额外联想。
- source_word: τῆς δόξης τοῦ αἰωνίου
  choice: 永恒者荣耀的
  rationale: 将 αἰωνίου 理解为名词化形容词，指“永恒者”，即上帝；中文属格结构简洁保留“永恒者的荣耀”这一较自然的希腊文关系。
theological_decisions:
- issue: δικαιοσύνη 的含义
  choice: 公义
  alternative: 正义
  rationale: “公义”能兼顾道德、盟约及与上帝关系相关的含义，并适合诗性的穿衣比喻；“正义”作为可能译法列入脚注。
- issue: τοῦ αἰωνίου 是否为指称上帝的名词化称号
  choice: 永恒者
  alternative: 永恒的荣耀
  rationale: 希腊文更自然地可理解为“永恒者的荣耀”，其中 αἰώνιος 名词化指上帝；但语法上也可较宽泛地理解为“永恒的荣耀”，故保留于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披上……外袍”与“把……头巾戴在头上”保留原文平行的穿戴意象；“永恒者”保留名词化神圣称号的凝练感，不增添原文没有的称谓。
