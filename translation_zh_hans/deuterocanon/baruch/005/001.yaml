base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: zh_hans
  text: 耶路撒冷啊，脱下你哀恸和苦难的衣袍，披上那从上帝而来的荣耀之华美，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”也可与“从上帝而来的荣耀”连读，译作“披上从上帝而来、存到永远的荣耀之华美”。
    reason: 句法关联存在一定歧义：εἰς τὸν αἰῶνα 可修饰“披上”的持续结果，也可更紧密地限定所披上的荣耀。
lexical_decisions:
- source_word: Ἔκδυσαι
  choice: 脱下
  rationale: 准确表达脱去衣物的命令语气，并与后文“披上”形成鲜明对应。
- source_word: στολή
  choice: 衣袍
  rationale: 保留单数的衣着意象，也体现 στολή 可指袍服的较庄重色彩。
- source_word: πένθος
  choice: 哀恸
  rationale: 表达公开或群体性的悲伤、哀悼，适合耶路撒冷受苦后复兴的语境。
- source_word: κάκωσις
  choice: 苦难
  rationale: 该词可涵盖受虐待、困苦和卑微处境；“苦难”自然且不将成因限定得过窄。
- source_word: ἔνδυσαι
  choice: 披上
  rationale: 与“脱下”对应，保持换衣的比喻；用于“荣耀之华美”也自然庄重。
- source_word: εὐπρέπεια
  choice: 华美
  rationale: 兼具美丽、庄严和显赫之意，适合与“荣耀”组合，又不把两个名词合并为单一概念。
- source_word: δόξα
  choice: 荣耀
  rationale: 沿用圣经希腊语中 δόξα 的核心神学含义。
- source_word: παρὰ τοῦ θεοῦ
  choice: 从上帝而来的
  rationale: παρά 加属格表示来源；此译明确荣耀源自上帝，而非仅指“上帝的荣耀”。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 自然表达持续、永久的时间意义，同时保留原句末尾的强调位置。
theological_decisions:
- issue: 耶路撒冷的拟人化
  choice: 直接称呼“耶路撒冷”，以脱下和披上衣袍的命令维持女性化城市人格的诗性意象
  alternative: 将其意译为耶路撒冷居民或上帝子民应停止悲伤、领受荣耀
  rationale: 希腊文本直接呼唤 Ἰερουσαλήμ，并用换衣动作描绘复兴；保留拟人化可维持先知性修辞及其神学张力。
- issue: 新荣耀的来源
  choice: 译为“从上帝而来的荣耀”
  alternative: 译为“上帝的荣耀”
  rationale: παρὰ τοῦ θεοῦ 首先标明来源。直译来源关系可避免预先判定这是上帝自身的荣耀，还是上帝所赐的荣耀。
- issue: εὐπρέπεια 与 δόξα 的关系
  choice: 译为“荣耀之华美”
  alternative: 译为“华美的荣耀”或仅译“荣耀”
  rationale: 属格结构容许理解为荣耀所具有或彰显的华美；保留两个名词，避免消解原文略显凝缩的表达。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“耶路撒冷啊”保留直接呼语；“脱下／披上”维持平行的衣着意象；“哀恸和苦难的衣袍”保持原文两个属格名词的并列；“荣耀之华美”有意保留 εὐπρέπεια τῆς…δόξης 的凝缩与层次。
