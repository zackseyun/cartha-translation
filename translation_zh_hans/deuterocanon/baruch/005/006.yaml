base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
translation:
  language: zh_hans
  text: 因为他们从你那里徒步离去，被仇敌押走；神却把他们带到你这里。他们满有荣耀，被抬着，仿佛在王座上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“带着荣耀被抬着，如同王权（或王国）的宝座”。这一比喻十分凝缩；正文按其画面译为他们仿佛坐在王座上那样，在尊荣中被抬来。
    reason: 保留原文压缩比喻及“王权／王国”属格修饰的歧义，同时说明正文的自然汉语表达。
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 离去
  rationale: 直接表达从耶路撒冷／锡安那里出去的动作，不额外解释为自愿迁移。
- source_word: παρὰ σοῦ
  choice: 从你那里
  rationale: 保留对人格化锡安的第二人称称呼及分离的方向。
- source_word: πεζοὶ
  choice: 徒步
  rationale: 自然简洁，并与后文受尊荣地被抬着形成鲜明对照。
- source_word: ἀγόμενοι ὑπʼ ἐχθρῶν
  choice: 被仇敌押走
  rationale: 体现被动且受敌人控制的流亡处境；“押走”比单纯“领走”更符合敌对语境，又未过度渲染暴力。
- source_word: εἰσάγει
  choice: 带到
  rationale: 保留“带进／领入”的基本方向义；不在正文加入原文未明说的“带回”。
- source_word: αἰρομένους
  choice: 被抬着
  rationale: 保留被承载、抬起的具体形象，与“徒步”相对，也避免只译作抽象的“高举”。
- source_word: μετὰ δόξης
  choice: 满有荣耀
  rationale: 以自然汉语保留δόξα所表达的荣耀和尊荣。
- source_word: ὡς θρόνον βασιλείας
  choice: 仿佛在王座上
  rationale: 希腊语意象高度凝缩；正文采用现代汉语可理解的王者尊荣画面，同时以脚注交代更贴近字面的结构。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 采用现代汉语圣经语体中简洁、庄重的标准称呼。
theological_decisions:
- issue: 流亡与复归的反转
  choice: 保留“徒步被押走”与“满有荣耀被抬着”的对照，并译εἰσάγει为“带到你这里”。
  alternative: 可依上下文译作“带回你这里”。
  rationale: 上下文清楚呈现神使流亡者归来的复兴，但希腊动词本身只明说带进、带到；正文不把语境推论写进动词。
- issue: 受尊荣抬举的王者意象
  choice: 正文译为“被抬着，仿佛在王座上”，并用脚注保留原文压缩而含混的表达。
  alternative: 可直译为“被抬着，如同王权的宝座”。
  rationale: 直译在现代汉语中容易误解为归来者本身就是宝座；正文传达尊荣归来的画面，脚注则避免掩盖原文真实的语法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“押走”呈现被敌人控制的流亡处境；分号与短句突出昔日受辱和如今蒙神尊荣带回之间的反转。正文只设一个脚注标记[a]，用于说明末尾比喻的真实歧义。
