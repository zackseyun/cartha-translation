  text: For God will show your splendor to all under heaven[a].
translation:
  language: zh_hans
  text: 因为上帝必向普天下显明你的荣美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣美”也可译作“光辉”或“荣耀”。
    reason: 词义可涵盖明亮、华美与尊荣，中文译法可有不同侧重。
lexical_decisions:
- source_word: ὁ γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前述应许或劝勉的依据；“因为”在现代汉语中自然保留这一解释性连接。
- source_word: θεὸς
  choice: 上帝
  rationale: 此处明确指以色列的上帝；“上帝”是现代普通话中庄重而通行的称呼。
- source_word: δείξει
  choice: 要……显明
  rationale: δείκνυμι的将来时表示上帝将使耶路撒冷的荣美被众人看见；“显明”兼顾展示与使之可见的含义。
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: 向天下所有人
  rationale: 该表达字面近于“向天之下的一切”，在语境中泛指天下众人；此译保留“天下”的意象，同时用“所有人”自然表达其普遍范围。
- source_word: τὴν σὴν
  choice: 你的
  rationale: 保留第二人称单数，继续直接称呼耶路撒冷／锡安。
- source_word: λαμπρότητα
  choice: 荣美
  rationale: λαμπρότης兼有光辉、华美和尊荣之意；“荣美”既能表达显赫之美，也不过度套用通常对应δόξα的神学术语“荣耀”。
theological_decisions:
- issue: 如何表达λαμπρότητα所指耶路撒冷恢复后的光辉与尊荣
  choice: 荣美
  alternative: 光辉；荣耀；华美
  rationale: “荣美”保留可见的灿烂和受尊崇的意味，又避免把原词直接等同于更具固定神学色彩的“荣耀”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“向天下所有人”自然传达希腊语的普遍范围；以“因为”明确承接上文。
