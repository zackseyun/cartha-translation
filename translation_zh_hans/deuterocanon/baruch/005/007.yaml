base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: zh_hans
  text: 因为上帝已经命令一切高山和亘古的冈峦都要降低，峡谷都要填平，使地面平坦，好让以色列在上帝的荣耀中安然前行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在上帝的荣耀中”也可译作“靠着上帝的荣耀”或“借着上帝的荣耀”。希腊语的与格既可表示所处的领域或伴随，也可表示凭借的方式。
    reason: 保留 τῇ τοῦ θεοῦ δόξῃ 的语法歧义。
lexical_decisions:
- source_word: συνέταξεν
  choice: 已经命令
  rationale: 表达上帝权威性的命令和安排；“已经”体现希腊语不定过去时在本处所指向的既定行动。
- source_word: ταπεινοῦσθαι
  choice: 降低
  rationale: 主语是山岭，所指为地势被降低，而非道德意义上的谦卑。
- source_word: πᾶν ὄρος ὑψηλὸν
  choice: 一切高山
  rationale: 保留 πᾶν 的周遍含义，同时采用自然凝练的现代汉语。
- source_word: θῖνας αἰωνίους
  choice: 亘古的冈峦
  rationale: θῖνας 可指土丘、沙丘或山脊；在山谷被整平的地貌语境中，“冈峦”较自然，也避免过度限定为沙丘。“亘古”传达 αἰωνίους 所强调的久远恒常。
- source_word: φάραγγας
  choice: 峡谷
  rationale: 该词通常指沟壑、峡谷；这里与高山冈峦相对，并且将被填平。
- source_word: πληροῦσθαι
  choice: 填平
  rationale: 字面为“被填满”；结合后文地面平坦的结果，“填平”准确且符合汉语地貌表达。
- source_word: εἰς ὁμαλισμὸν τῆς γῆς
  choice: 使地面平坦
  rationale: 清楚表达降低山岭、填满峡谷所达到的结果，同时保留整平土地的意象。
- source_word: ἵνα βαδίσῃ
  choice: 好让……前行
  rationale: 保留目的从句；“前行”比单纯“行走”更适合以色列踏上所预备道路的语境。
- source_word: ἀσφαλῶς
  choice: 安然
  rationale: 表达安全、稳妥而无危险，并保持经文庄重流畅的语体。
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: 在上帝的荣耀中
  rationale: 以“在……中”保留与格可能表示领域或伴随的含义，不在正文中径直限定为工具意义。
theological_decisions:
- issue: τῇ τοῦ θεοῦ δόξῃ 与以色列安然前行的关系
  choice: 在上帝的荣耀中
  alternative: 靠着上帝的荣耀；借着上帝的荣耀
  rationale: 希腊语与格既可能表示领域或伴随，也可能表示凭借的方式。正文采用较开放的表达，脚注列出工具性理解，以免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亘古的冈峦”保留诗性和久远感；“降低—填平—平坦”清楚呈现整平道路的连续意象。脚注标记置于其实际所说明的“在上帝的荣耀中”所在句末。
