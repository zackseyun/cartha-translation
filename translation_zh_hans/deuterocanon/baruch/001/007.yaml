base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: zh_hans
  text: 他们送往耶路撒冷，交给祭司约雅敬——希勒家的儿子、沙龙的孙子——也交给众祭司，以及所有在耶路撒冷被找到、与他同在的百姓[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“与他同在”，其中“他”是单数；本节没有明确说明所指是谁。也有人将这里理解为泛指当时在那里的人。
    reason: 原文代词为单数且先行词不明确，需保留文本歧义，避免在正文中擅自确定所指或改成复数。
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: 送到……交给
  rationale: 该动词表示“送、派送”；原文没有明说所送之物。中文用“送到……交给”自然表达送往某地并递交给收受者，同时不补出宾语。
- source_word: εἰς Ἰερουσαλήμ
  choice: 送到耶路撒冷
  rationale: εἰς与地名连用表示朝向或进入某地；“到耶路撒冷”符合现代汉语习惯。
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: 交给祭司约雅敬——希勒家的儿子、沙龙的孙子——
  rationale: πρός在此引出收受者；ἱερεύς仅指“祭司”，原文没有“祭司长”一词，因此不作扩充。谱系按自然中文明确表达为儿子和孙子。
- source_word: τοὺς ἱερεῖς
  choice: 众祭司
  rationale: 准确表达ἱερεύς的复数，并以“众”保持庄重而自然的集体称谓。
- source_word: πάντα τὸν λαόν
  choice: 所有……百姓
  rationale: 保留原文整体性的“全体、所有”含义；“百姓”适合此处共同体语境。
- source_word: τοὺς εὑρεθέντας
  choice: 被找到
  rationale: 保留εὑρίσκω分词的字面被动意义，不直接改写成解释性的“在场”。
- source_word: μετ᾽ αὐτοῦ
  choice: 与他同在
  rationale: 希腊文本使用阳性单数αὐτοῦ，故保留“他”，不擅自改成复数“他们”；其所指不明之处用脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文未明说的受送之物，并以破折号清楚标示约雅敬的谱系；“被找到”略带原文痕迹，旨在保留其措辞及相关歧义。
