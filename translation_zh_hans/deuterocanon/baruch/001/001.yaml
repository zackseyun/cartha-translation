base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/001.yaml
  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
translation:
  language: zh_hans
  text: 以下是巴录在巴比伦所写的这卷书中的话。巴录是尼利亚的儿子，尼利亚是玛西雅的儿子，玛西雅是西底家的儿子，西底家是哈撒底亚[a]的儿子，哈撒底亚是希勒家的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文抄本此处作“亚撒底亚”；正文“哈撒底亚”采用这个闪族名字的通行圣经音译。
    reason: 说明希腊文本形式与正文所采用的闪族式人名音译之间的差异。
lexical_decisions:
- source_word: ΚΑΙ οὗτοι οἱ λόγοι τοῦ βιβλίου
  choice: 以下是……这卷书中的话
  rationale: 用“以下是”自然引出下文，同时表达希腊文开篇连接词 καί 和指示词 οὗτοι；“这卷书中的话”保留 λόγοι τοῦ βιβλίου 所指的书面内容，又符合现代汉语表达。
- source_word: οὓς ἔγραψεν
  choice: 所写的
  rationale: 以关系结构表达希腊文简单过去时，不增添“早已写成”等完成时含义。
- source_word: υἱὸς
  choice: ……的儿子
  rationale: 逐层保留家谱中反复出现的明确父子关系，不弱化为较宽泛的“后裔”。
- source_word: Βαροὺχ
  choice: 巴录
  rationale: 采用现代中文圣经语境中易识别的闪族人名音译。
- source_word: Νηρίου / Μαασαίου / Σεδεκίου / Ἀσαδίου / Χελκίου
  choice: 尼利亚／玛西雅／西底家／哈撒底亚／希勒家
  rationale: 采用相应闪族名字的通行中文圣经形式，而非照搬希腊语词尾；Ἀσαδίου 的文本形式另以脚注说明。
- source_word: ἐν Βαβυλῶνι
  choice: 在巴比伦
  rationale: 直接保留写作地点，语义和句法关系清楚。
theological_decisions:
- issue: 希腊文次经文本中的家谱人名形式
  choice: 采用反映闪族名字的通行中文圣经译名
  alternative: 按希腊语形式音译为尼里亚、玛阿赛亚、塞德基亚、亚撒底亚、赫尔基亚等
  rationale: 这些人物以闪族家谱形式出现，采用通行中文圣经译名有助于读者识别其与更广泛圣经传统的联系；此为人名转写选择，不作教义推断。
- issue: 重复的 υἱὸς 所表达的家谱关系
  choice: 逐代译为“……是……的儿子”
  alternative: 合并译作“……的后裔”
  rationale: 原文逐层明说父子关系；译文不将其泛化，也不对家谱是否存在省略另作判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免一长串属格家谱在中文中生硬难解，将原文单句拆为两句，并逐代重述“是……的儿子”；信息次序和全部亲属关系均予保留。
