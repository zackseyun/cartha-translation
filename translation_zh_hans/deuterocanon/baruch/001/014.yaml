  yaml_path: translation/deuterocanon/baruch/001/014.yaml
  text: And you shall read this book that we have sent to you[a], to proclaim in the house of the Lord on a feast day and on days of appointed time,
translation:
  language: zh_hans
  text: 你们要在主的殿中，于节期之日和规定的日子[a]，诵读并宣告我们寄给你们的这卷书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在时机的日子”；这一短语在现存希腊文本中略显生硬，也可译作“在规定的时节”。
    reason: 保留ἐν ἡμέραις καιροῦ措辞的不寻常之处，并提供较顺畅的可能译法。
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: 你们要宣读
  rationale: 该词为将来时中间形式，在此语境中带有指令意味；“宣读”自然表达在公共敬拜场合读出文本的含义，又不把它缩减为一般默读。
- source_word: τὸ βιβλίον τοῦτο
  choice: 这卷书
  rationale: βιβλίον可指书、卷册或文书；“这卷书”既符合古代文献形态，也适合此处所指的书面文本。
- source_word: ὃ ἀπεστείλαμεν πρὸς ὑμᾶς
  choice: 我们寄给你们的
  rationale: ἀπεστείλαμεν表示已经完成的发送行动；现代汉语中“寄给你们的”简洁自然，并清楚修饰“这卷书”。
- source_word: ἐξαγορεῦσαι
  choice: 公开宣告
  rationale: 该不定式表达目的，含有说出、公开宣布之意；“公开宣告”保留其正式、公开的语气，并与前面的宣读相互区分。
- source_word: ἐν οἴκῳ Κυρίου
  choice: 在主的殿中
  rationale: 字面为“在主的家中”，在此指圣殿；汉语圣经语域中“主的殿”自然、庄重，又不必另加解释。
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: 在节期的日子
  rationale: ἑορτή指宗教节期或庆典；“节期的日子”贴近原文单数结构，同时符合中文宗教历法语境。
- source_word: ἐν ἡμέραις καιροῦ
  choice: 指定的日子
  rationale: καιρός可指适当、规定或指定的时刻。原希腊语搭配略显生硬；“指定的日子”保留历法上规定时间的含义，并以脚注说明另一种贴近形式的理解。
theological_decisions:
- issue: Κυρίου的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本直接使用Κυρίου，而非希伯来四字神名；译作“主”最贴近现存原文，也避免把底本未明说的形式带入译文。
- issue: οἴκῳ Κυρίου所指
  choice: 主的殿
  alternative: 主的家
  rationale: 该表达在敬拜和节期的语境中指圣殿；“殿”传达实际所指，而“家”虽较字面，却可能使现代读者误解为普通住所。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宣读”与“公开宣告”保留公共敬拜场景中的两个动作层次；分号及末尾补出“宣读”，使希腊语目的结构和时间短语在中文中关系清楚，而不改变命令内容。
