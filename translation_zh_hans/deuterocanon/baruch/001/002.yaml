translation:
  language: zh_hans
  text: 第五年，该月初七[a]，正是迦勒底人攻占耶路撒冷并用火焚烧它的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“在该月的第七”；这里省略“日”，按常见的日期表达译为“初七”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: 第五年
  rationale: 按时间表达直译为“第五年”，简洁自然；具体纪年所指原文未明说，因此不作补充。
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: 本月初七
  rationale: 阴性序数词“第七”省略了“日”，与“月”的属格构成常见日期表达，意为该月第七日；“初七”符合现代汉语日期习惯。
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: 正是……的时候
  rationale: 保留καιρός的明确时间框架，并以自然汉语衔接后面的事件。
- source_word: ἔλαβον
  choice: 攻占
  rationale: 直接宾语为城市时，λαμβάνω在此表示军事上的夺取；“攻占”比泛泛的“取得”更清楚。
- source_word: οἱ Χαλδαῖοι
  choice: 迦勒底人
  rationale: 直接对应希腊文族名Χαλδαῖοι，不以解释性的“巴比伦人”替代。
- source_word: ἐνέπρησαν αὐτὴν ἐν πυρί
  choice: 放火焚烧城
  rationale: ἐνέπρησαν表示纵火焚烧，ἐν πυρί强化以火烧毁的方式；代词所指为耶路撒冷，汉语用“城”避免误读，也不额外断言全城彻底烧毁。
