base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: zh_hans
  text: 从主领我们的先祖出埃及地的那一天起，直到今日，我们一直不顺服主我们的上帝，在没有听从他的声音这件事上也一直疏忽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疏忽”也可译作“行事轻率”。这里的希腊动词较少见，可能着重于轻忽或漫不经心，未必特指更强烈的蓄意反抗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς ... καὶ ἕως τῆς ἡμέρας ταύτης
  choice: 从……的那一天起，直到今日
  rationale: 保留从过去某一时点延续到当下的时间跨度，同时符合现代汉语表达。
- source_word: ἐξήγαγεν
  choice: 领……出
  rationale: 表达带领出来的动作，也自然唤起出埃及事件。
- source_word: Κύριος
  choice: 主
  rationale: 直接对应希腊文 Κύριος；上下文已清楚指以色列的上帝，不另行引入希伯来文神名的排印形式。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 我们的先祖
  rationale: 在汉语中“先祖”准确指共同体的历代父辈，比直译“父亲们”自然，且不改变所指。
- source_word: ἐκ γῆς Αἰγύπτου
  choice: 出埃及地
  rationale: 保留“地”的成分及“从……出来”的方向意义，并采用自然的圣经汉语表达。
- source_word: ἤμεθα ἀπειθοῦντες
  choice: 我们一直不顺服
  rationale: “一直”体现希腊文迂回结构及从出埃及直到当下的持续、反复状态。
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: 主我们的上帝
  rationale: 作为“不顺服”的对象，译文自然清楚，同时保留“主”和“我们的上帝”两个称谓。
- source_word: ἐσχεδιάζομεν
  choice: 一直疏忽
  rationale: 该罕见动词语义不够确定；“疏忽”保留轻忽、漫不经心的意味，不强化为明确的顽梗反抗。
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: 没有听从
  rationale: “听从”在汉语中兼顾听见与服从的经文语境；以并列补语表达其与“疏忽”的关系，避免过强地判定为目的。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: 他的声音
  rationale: 保留希腊文“声音”，不解释性改译为“话语”或“命令”。
theological_decisions:
- issue: 盟约语境中 Κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 现存源文是希腊文 Κύριος；译作“主”忠于直接文本，也不妨碍读者从出埃及语境识别其所指。
- issue: 从出埃及延续至今的悖逆状态
  choice: 一直不顺服……也一直疏忽
  alternative: 曾不顺服……也曾疏忽
  rationale: “一直”保留该认罪所强调的长期持续性，而非仅指过去一次行为。
- issue: ἐσχεδιάζομεν 所表示的过失性质
  choice: 疏忽
  alternative: 顽梗／执意
  rationale: 罕见动词可能表示轻率、疏忽或不加留意；不把它收窄为更强的蓄意反抗，以保存词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出埃及地”“主我们的上帝”“听从他的声音”保留经文语感；避免生硬直译。“上帝”用于 θεός。脚注用于说明罕见动词的真实词义不确定性。
