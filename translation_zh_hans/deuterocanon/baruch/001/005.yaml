lexical_decisions:
- source_word: ἔκλαιον
  choice: 哭泣
  rationale: 未完成时表示当时持续或反复进行的动作；汉语可借并列叙述和上下文自然表达其延续性，无须机械加入“正在”。
- source_word: ἐνήστευον
  choice: 禁食
  rationale: 准确表达宗教语境中的禁食行为，并与前后的未完成时动词保持自然并列。
- source_word: ηὔχοντο
  choice: 祷告
  rationale: 在宗教语境中是 εὔχομαι 的标准而自然的译法。
- source_word: ἐναντίον
  choice: 在……面前
  rationale: 既保留处于某位面前的临在含义，也符合现代汉语敬拜语境的表达习惯。
- source_word: Κυρίου
  choice: 主
  rationale: 在七十士译本的犹太信仰语境中，此词敬称以色列的上帝；译作“主”准确、庄重，且不额外引入原文未明示的专名形式。
theological_decisions:
- issue: 七十士译本犹太语境中 Κυρίου 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本本身使用 κύριος；译作“主”直接对应现存原文，并保留其对以色列之上帝的敬称性质，不反向重构为希伯来专名，也不加入特定宗派用语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。三个动作以顿号和连词自然并列；不加“正在”，避免汉语累赘，同时由语境承载希腊语未完成时的持续意味。
