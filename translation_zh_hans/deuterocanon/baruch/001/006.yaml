  language: zh_hans
  text: 他们又募集了银子，各人都量力而出。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“照各人的手所能的。”这是指各人按照自己的能力或财力捐出。
