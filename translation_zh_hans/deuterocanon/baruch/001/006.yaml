lexical_decisions:
- source_word: συνήγαγον
  choice: 募集了
  rationale: 此处指把众人所出的财物汇集起来；“募集”自然地表达筹集款项的语境，并保留共同收集的意思。
- source_word: ἀργύριον
  choice: 银子
  rationale: 原词本义为“银”，也常指作为货币的银钱。“银子”既保留原文的物质意象，也能让现代读者明白这里指钱财。
- source_word: καθὰ ἑκάστου ἠδύνατο ἡ χείρ
  choice: 各人都量力而出
  rationale: 原文按字面说“照各人的手所能的”，其中“手”表示个人的能力或财力。“量力而出”自然、简洁地传达按各自能力捐出的比例意义。
