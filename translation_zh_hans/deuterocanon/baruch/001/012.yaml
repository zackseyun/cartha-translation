base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: zh_hans
  text: 主必赐给我们力量，使我们的眼睛明亮；我们将在巴比伦王尼布甲尼撒的荫下生活，也将在他儿子伯沙撒的荫下生活[a]。我们要服事他们许多日子，并在他们面前蒙恩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在……的庇护下”或“在……的遮蔽下”。希腊文直译为“在……的荫下”；这个比喻既可表示庇护，也可暗示处于其权势之下。
    reason: lexical_alternative
  - marker: b
    text: 或译“蒙他们恩待”。希腊文惯用语直译为“在他们面前蒙恩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: 力量
  rationale: ἰσχύς表示力量、能力；“力量”是现代汉语中自然且不缩窄语义的表达。
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: 使我们的眼睛明亮
  rationale: 保留“眼睛得光照”的意象，同时以自然汉语传达复苏、清明和恢复活力的意味。
- source_word: ζησόμεθα
  choice: 我们要活
  rationale: 直译ζάω的将来时，不把语境中可能含有的“存活”之意明确化。
- source_word: ὑπὸ τὴν σκιὰν
  choice: 在……的荫下
  rationale: 保留原文“荫影”意象及其既可表示庇护、又可暗示处于权势之下的双重意味。
- source_word: Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: Βαλτασὰρ
  choice: 伯沙撒
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: δουλεύσομεν
  choice: 我们要服事他们
  rationale: δουλεύω可指奴役或服役；“服事”保留为统治者效力和受其支配的意味，又不在正文中过度强化为制度性奴役。
- source_word: ἡμέρας πολλὰς
  choice: 许多日子
  rationale: 贴近原文的时间表达，并保留其庄重的经文语体。
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: 在他们面前蒙恩
  rationale: 保留原文常见的圣经惯用语结构；意思是在他们那里得到恩待或好感。
theological_decisions:
- issue: 在异族帝王“荫下”生活这一比喻的含义
  choice: 保留“在……的荫下”
  alternative: 在……的庇护下；在……的统治下
  rationale: 原文意象可能同时包含庇护和臣服，不宜在译文中只取其一，以免消除政治与神学上的张力。
- issue: 流亡处境中δουλεύσομεν的力度
  choice: 我们要服事他们
  alternative: 我们要作他们的奴仆；我们要臣服于他们
  rationale: 此处涉及在帝国统治下长期效力和受支配。“服事”能传达从属关系，同时不把句子单义化为对奴隶制度身份的明确陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“荫下”“许多日子”“在……面前蒙恩”等源文意象和圣经惯用语；标点略作分句，以免希腊文连串并列结构在中文中显得拖沓。
