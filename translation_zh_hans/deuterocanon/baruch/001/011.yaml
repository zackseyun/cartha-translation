base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: zh_hans
  text: 也要为巴比伦王纳布霍多诺索尔的性命祷告，也为他儿子巴尔塔萨尔的性命祷告[a]，使他们的日子如同天在地上的日子一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纳布霍多诺索尔”和“巴尔塔萨尔”依本节希腊文人名音译；较常见的中文名称分别是“尼布甲尼撒”和“伯沙撒”。
    reason: alternative_reading
  - marker: b
    text: 这句话也可按习语较通顺地理解为：“愿他们的日子长久，如天覆地的日子一样。”希腊文保留了一个描写生命长久的鲜明比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεύξασθε
  choice: 要……祷告
  rationale: 该词是复数不定过去时命令式；用“要……祷告”自然表达直接劝令，又不额外加强语气。
- source_word: περὶ τῆς ζωῆς / εἰς ζωήν
  choice: 为……的性命
  rationale: 两处介词虽不同，中心名词都是 ζωή。译作“为……的性命”既符合代祷语境，也保留对生命本身的明确指向；“福祉”则会扩大原词含义。
- source_word: Ναβουχοδονοσόρ
  choice: 纳布霍多诺索尔
  rationale: 按本节希腊文本的人名形式音译，不以源自其他语言传统的常见中文名“尼布甲尼撒”取代。
- source_word: Βαλτασάρ
  choice: 巴尔塔萨尔
  rationale: 按希腊形式直接音译，避免将其同化为较常见但来自另一文本传统的“伯沙撒”。
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: 使他们……的日子
  rationale: ἵνα 引出目的或所祈求的结果；“使”在现代汉语中简洁地保留这一关系。
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: 在地上的日子如同天的日子
  rationale: 保留原文“天的日子”这一鲜明而不寻常的长久意象，同时以“在地上”组成可理解的现代汉语表达，不直接释为“长寿”。
theological_decisions:
- issue: 末句应直译其天与地的意象，还是解释为长寿
  choice: 保留“在地上的日子如同天的日子”这一比喻
  alternative: 使他们在地上长寿，像天覆地一样长久
  rationale: 原文以“天的日子”表达持久，并带有经文式意象。正文保留其开放性和修辞张力，脚注再说明较通顺的理解，避免把比喻静默化约为“长寿”。
- issue: 王及其儿子的人名是否采用中文圣经中较熟悉的形式
  choice: 依希腊见证音译为“纳布霍多诺索尔”和“巴尔塔萨尔”
  alternative: 尼布甲尼撒和伯沙撒
  rationale: 本译文以所给希腊原文为首要依据；采用直接音译可让读者看出该见证的人名形式，而脚注提供熟悉名称供辨认。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“性命”比单用“生命”更贴合为君王存活祈求的语境；末句有意保留原文略显陌生的诗性表达，并借脚注辅助理解。
