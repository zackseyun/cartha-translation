  yaml_path: translation/deuterocanon/baruch/001/022.yaml
  text: And each of us went off in the intent of his evil heart[a], to serve other gods, to do evil in the sight of the Lord our God.
translation:
  language: zh_hans
  text: 我们各人都随从自己邪恶内心的意念[a]，去侍奉别的神，行主——我们的上帝——眼中看为恶的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按着自己邪恶内心的意念而行。”希腊语强调人内在的思想、意念或心态。
    reason: 词义与句法存在可保留的表达差异。
lexical_decisions:
- source_word: ᾠχόμεθα
  choice: 而去
  rationale: 保留 οἴχομαι 所表达的离去、走开的动态，同时与后面的内在意念及行动自然衔接。
- source_word: ἕκαστος
  choice: 我们各人
  rationale: 保留分配意义，表明共同体中的每一个人都如此行。
- source_word: ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς
  choice: 随自己邪恶内心的意念
  rationale: διάνοια 可指思想、意念或心志；καρδία 指人的内在中心。译文保留思想与内心并置所强调的内在倾向。
- source_word: ἐργάζεσθαι θεοῖς ἑτέροις
  choice: 侍奉别的神
  rationale: ἐργάζομαι 与间接受词连用时在本语境中表示为其效力；“侍奉”清楚传达拜偶像式的服事。
- source_word: ποιῆσαι τὰ κακὰ
  choice: 做……看为恶的事
  rationale: 将中性复数 τὰ κακά 自然译为“恶的事”，并与后面的“眼中”结构合并表达。
- source_word: κατʼ ὀφθαλμοὺς Κυρίου θεοῦ ἡμῶν
  choice: 主——我们的上帝——眼中
  rationale: 保留“在眼中”的圣经意象，并用插入结构清楚表明“主”就是“我们的上帝”。
- source_word: Κυρίου
  choice: 主
  rationale: 此处指以色列的上帝；“主”符合七十士译本中 κύριος 的惯常称谓。
theological_decisions:
- issue: 在次经七十士译本语境中如何译 κύριος
  choice: 主
  alternative: 主人
  rationale: 上下文所指是以色列的上帝及其圣约关系，因此“主”比“主人”恰当。
- issue: ἐργάζεσθαι θεοῖς ἑτέροις 所指的行为
  choice: 侍奉别的神
  alternative: 为别的神做事
  rationale: 本句描述背道和偶像崇拜；“侍奉”既符合语境，也不额外加入特定宗派解释。
- issue: 内在意念与外在行为的关系
  choice: 随自己邪恶内心的意念而去
  alternative: 怀着自己邪恶内心的意念离去
  rationale: 介词短语可强调行动所依据的内在意念，也可理解为行动时所怀的心态；正文采用自然且能涵盖两者的表达，并以脚注提示另一种理解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“随……而去”保留原文的动态色彩；“主——我们的上帝——”以插入说明处理同位关系，避免误读为两个不同对象。
