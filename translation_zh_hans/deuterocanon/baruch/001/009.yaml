base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: zh_hans
  text: 在巴比伦王尼布甲尼撒将耶哥尼雅、众首领、囚犯、权贵和那地的百姓从耶路撒冷掳去流放之后，他又把他带到巴比伦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作单数“他”，看来特指耶哥尼雅；也有人按上下文理解为“他们”，指前面所列整个被掳的群体。
    reason: 说明原文单数代词与上下文复数群体之间的歧义。
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: 那时……已经……掳走
  rationale: μετά加冠词不定式构成时间表达，意为“在……之后”；ἀποικίζω在这里指强制迁徙、放逐。“掳走”自然地体现被迫离开本地的语境，同时避免把动作误解为普通移民。
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: 巴比伦王尼布甲尼撒
  rationale: 采用现代中文圣经和历史叙述中通行的人名“尼布甲尼撒”，并按自然汉语语序表达王号。
- source_word: τὸν Ἰεχονίαν
  choice: 耶哥尼雅
  rationale: 按希腊文Ἰεχονίας所反映的名字形式音译，保持与“约雅斤”这一希伯来传统形式的区别。
- source_word: τοὺς ἄρχοντας
  choice: 众首领
  rationale: ἄρχοντες泛指掌权或领导的人；“首领”保留其政治、社会领导意味而不过度限定具体官职。
- source_word: τοὺς δεσμώτας
  choice: 囚犯
  rationale: δεσμώτης本义为受捆绑或被监禁的人。“囚犯”直接反映该词，并与一般被掳者有所区分。
- source_word: τοὺς δυνατοὺς
  choice: 权贵
  rationale: δυνατοί可指有力量、有地位或有势力的人；本处与首领及当地百姓并列，“权贵”较自然地表达社会上有权势的人，同时不把范围收窄为军人。
- source_word: τὸν λαὸν τῆς γῆς
  choice: 当地的百姓
  rationale: 直译是“那地的人民”。“当地的百姓”在现代汉语中自然，并保留地域所指；不进一步解释为特定社会阶层。
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: 又把他带到巴比伦
  rationale: 严格保留原文单数αὐτόν“他”，其最自然的先行词是耶哥尼雅；不在正文中擅自改为复数。
theological_decisions:
- issue: 末句代词的单复数及所指
  choice: 正文保留单数“他”，理解为最可能特指耶哥尼雅。
  alternative: 译作“他们”，把整个被掳群体视为所指。
  rationale: 现有希腊文本明确使用单数阳性αὐτόν。虽因前面列举多人，语意上可能让读者联想到整个群体，但应先忠实呈现原文的数，并用脚注说明较宽泛的理解，不静默消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那时”使本节作为依附前文的时间从句在中文中可自然诵读；“已经……又……”体现先后关系。正文保留原文末句单数代词，并以脚注交代可能的广义理解。
