base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: zh_hans
  text: 灾祸和咒诅紧紧缠住了我们；这咒诅是主在领我们的祖先出来、要把流奶与蜜之地赐给我们那日，向他的仆人摩西所颁定的。直到今日，仍是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκολλήθη εἰς ἡμᾶς
  choice: 紧紧缠住了我们
  rationale: 保留κολλάω表示黏附、紧贴的鲜明意象，并传达这些审判持续落在百姓身上的意味。
- source_word: τὰ κακὰ
  choice: 灾祸
  rationale: 本节语境是违约所招致的灾难性后果，而不是人所犯的道德之恶；“灾祸”自然且准确。
- source_word: ἡ ἀρά
  choice: 咒诅
  rationale: 指因悖逆而宣告的约之咒诅；采用庄重而通行的圣经用语，不额外加入“盟约”等解释。
- source_word: συνέταξεν Κύριος τῷ Μωυσῇ παιδὶ αὐτοῦ
  choice: 主吩咐他的仆人摩西宣告
  rationale: συντάσσω加人称与格可表达向某人下令或作出指示；中文补出“宣告”，使“吩咐摩西”与“咒诅”的关系清楚，同时不把咒诅误解为针对摩西本人。
- source_word: παιδὶ αὐτοῦ
  choice: 他的仆人
  rationale: παῖς虽也可指孩子，但用于摩西与主的关系时，语境义是“仆人”。
- source_word: ἐξήγαγεν τοὺς πατέρας ἡμῶν
  choice: 领我们的祖先出来
  rationale: 忠实保留“带领出来”的出走表达；原文此处未明说“埃及”，故正文不补入。
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  choice: 流奶与蜜之地
  rationale: 保留原文固定而富有经文回响的土地描写，现代中文读者也能理解。
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: 直到今日，仍是如此
  rationale: 自然表达从过去延续到说话者当下的现实，避免生硬直译“正如这一日”。
theological_decisions:
- issue: 咒诅与灾祸的语法关系
  choice: 将关系从句仅连接“咒诅”，并说明灾祸与咒诅同样缠住百姓
  alternative: 把“主所颁定的”同时修饰灾祸和咒诅
  rationale: 希腊文关系代词ἣν为阴性单数，直接回指阴性单数ἡ ἀρά“咒诅”，不宜无声扩大到中性复数τὰ κακά“灾祸”。
- issue: 摩西在颁布咒诅中的角色
  choice: 主吩咐摩西宣告咒诅
  alternative: 主为摩西设定咒诅
  rationale: τῷ Μωυσῇ最自然地标示受命者；译文避免暗示摩西是咒诅的承受对象，也不扩写为特定宗派性的盟约理论。
- issue: 灾祸的神学性质
  choice: 保留其与主借摩西所宣告之咒诅的紧密联系
  alternative: 泛指一般人生不幸
  rationale: 摩西、出走、赐地和咒诅共同构成明确的申命记式审判背景，但正文不额外加入“盟约制裁”等术语。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“祖先”比“列祖”更贴近日常现代汉语，同时仍保持经文语体；句式略作重组，以清楚保留希腊文中关系从句只修饰“咒诅”的语法关系。
