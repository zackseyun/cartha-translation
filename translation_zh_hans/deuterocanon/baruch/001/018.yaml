translation:
  language: zh_hans
  text: 我们悖逆了他，也没有听从主我们的上帝的声音[a]，不按主摆在我们面前的诫命[b]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有听主我们的上帝的声音”；这里的“听”也含有服从的意思。
    reason: lexical_alternative
  - marker: b
    text: “诫命”也可译作“条例”或“规定”，指主所吩咐、制定的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπειθήσαμεν
  choice: 我们悖逆了他
  rationale: ἀπειθέω在此表示不服从、抗命；“悖逆”简洁庄重，并保留认罪语境中的主动抗拒意味。
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: 不听从……的声音
  rationale: 既保留希腊文“听……的声音”这一表达，又借“听从”传达其中服从的含义，避免只译成生理上的“没有听见”。
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: 主我们上帝
  rationale: 按希腊文词序和称号译出 κύριος θεός；源文本为希腊文，故不以专名形式处理 κύριος。
- source_word: πορεύεσθαι τοῖς προστάγμασιν
  choice: 按……诫命行事
  rationale: πορεύεσθαι在伦理和律法语境中指生活行事；中文“按……行事”自然地保留遵循诫命而行的意象。
- source_word: τοῖς προστάγμασιν
  choice: 诫命
  rationale: πρόσταγμα指所吩咐、规定之事；“诫命”符合经文法律语域，也为现代读者熟悉。“条例”或“规定”亦属可能。
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: 摆在我们面前
  rationale: 直译为“给在我们面前”不合现代汉语；“摆在我们面前”自然表达这些命令已被交付、陈明给百姓。
theological_decisions:
- issue: κύριος在希腊文次经语境中的译法
  choice: 主
  alternative: 耶和华
  rationale: 现存直接来源为希腊文 κύριος，译作“主”遵循原文优先原则，也不对其背后的希伯来文形式作未经文本明示的判定。
- issue: 是否把“听声音”完全释义为“服从”
  choice: 不听从……的声音
  alternative: 不服从主我们上帝
  rationale: “听从”表达服从含义，同时保留原文的“声音”意象及其修辞张力，没有将其完全改写为抽象的“服从”。
- issue: πορεύεσθαι的行为隐喻
  choice: 按……行事
  alternative: 行在……中
  rationale: “行在诫命中”较为生硬；“按……行事”在现代汉语中清楚自然，同时没有把经文扩展为更具体的伦理解释。
translation_notes:
  register: 采用现代、庄重而易懂的认罪语体。“悖逆”保留经文力度；“听从……的声音”和“按……行事”兼顾希腊文意象与自然汉语。
