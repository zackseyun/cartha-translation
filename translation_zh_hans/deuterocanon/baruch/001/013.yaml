base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/013.yaml
  text: And pray for us to the Lord our God, because we have sinned against the Lord our God, and the anger of the Lord and his wrath has not turned away from us to this day.
translation:
  language: zh_hans
  text: 也请你们为我们向主——我们的上帝——祷告，因为我们得罪了主——我们的上帝；直到今日，主的怒气和愤怒仍没有离开我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν πρὸς Κύριον τὸν θεὸν ἡμῶν
  choice: 为我们向主我们的上帝祷告
  rationale: 保留“为我们”与祷告所朝向的对象“主我们的上帝”，同时采用自然的现代汉语语序。
- source_word: ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν
  choice: 我们得罪了主我们的上帝
  rationale: 此处与格标明犯罪所针对的对象；“得罪”比单说“犯罪”更直接保留这一关系。
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: 主的烈怒和愤怒
  rationale: 以两个近义词对应 θυμός 与 ὀργή，保留原文的并列和加强语气，不将二者合并。
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν
  choice: 仍没有离开我们
  rationale: 按汉语自然表达呈现怒气尚未从他们身上转离；“仍”结合“直到今日”体现持续状态。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今日
  rationale: 准确、简洁地保留时间终点表达。
theological_decisions:
- issue: 上帝烈怒持续未离开的陈述
  choice: 按原文直译为“主的烈怒和愤怒仍没有离开我们”
  alternative: 弱化为“我们仍在承受惩罚”
  rationale: 原文明确以拟人化方式谈论主的 θυμός 和 ὀργή，不宜改写为抽象后果或仅指惩罚。
- issue: θυμός 与 ὀργή 的语法关系
  choice: 保留为两个并列名词，共用单数谓语所表达的整体性
  alternative: 只译作一个“愤怒”，或刻意按复数处理
  rationale: 希腊文虽有两个并列主语，却使用单数 ἀπέστρεψεν；中文不标谓语数，因此可自然保留二词而不强行解释其一致关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主我们的上帝”保留原文重复出现的盟约性称谓；分号呈现因果说明后的结果陈述。无须脚注。
