  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
translation:
  language: zh_hans
  text: 巴录把这书上的话念给犹大王约雅敬的儿子耶哥尼雅[a]听，也念给所有来到这书跟前的民众听[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶哥尼雅”是这里希腊文所用的人名形式；这位君王通常也称为“约雅斤”。
    reason: alternative_reading
  - marker: b
    text: “来到这书跟前”也可能理解为“来听宣读”或“来到书卷跟前”。原文这一说法较为罕见。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγνω
  choice: 念给……听
  rationale: 该动词本义为“读”，此处是面向众人的公开诵读；“念给……听”自然表达其口头和可听见的语境，又不额外加入讲解之意。
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: 这书上的话
  rationale: 保留 λόγοι 的“话”及 βιβλίον 的“书”，同时用现代汉语自然表达二者的所属关系。
- source_word: ἐν ὠσὶν
  choice: 念给……听
  rationale: 希腊语字面为“在……耳中”，是指让有关的人听见。译文以汉语听觉表达呈现其意义，并借重复句式保留原文两次出现的结构。
- source_word: Ἰεχονίου
  choice: 耶哥尼雅
  rationale: 按希腊文本中的人名形式音译；此人通常也称为“约雅斤”，故以脚注说明。
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  choice: 来到这书跟前的
  rationale: 原短语较为罕见，直译近于“来到书那里”。正文保留“书”这一具体名词和方向含义，不径自解释为“来听宣读的人”。
