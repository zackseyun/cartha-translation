review_pass:
  verdict: revise
  source_fidelity: Greek consists of a continuing σειρά of dative recipients, each explicitly qualified by ἡμῶν (“our”). In the immediate context, the implied subject is the “shame/disgrace” of Baruch 1:15. The draft’s “归到……身上” can be read as possession or attribution rather than as the disgrace extending to these groups. “临到……身上” more clearly carries the contextual force while retaining the verse’s dependent construction.
  naturalness: The revised wording is idiomatic, solemn modern Mandarin. Repeating “我们的” preserves the Greek’s marked repetition and remains natural in this formal confessional list.
  terminology: “君王、首领、祭司、先知、先祖” accurately represent βασιλεῦσιν, ἄρχουσιν, ἱερεῦσιν, προφήταις, and πατράσιν. “先祖” is appropriate for πατράσιν in this national setting; the note preserves the more familial alternative without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: “归到……身上” is semantically imprecise for the implied continuation from the preceding verse.
    rationale: The Greek dative list depends on the prior statement concerning shame. In Mandarin, “归到……身上” may suggest that something belongs to or is assigned to the listed persons; “临到……身上” clearly conveys that the previously named disgrace applies to them.
  - severity: low
    issue: The draft does not reflect the repeated possessive pronoun in the Greek.
    rationale: A single initial “我们的” can govern the coordinated nouns in Chinese, but explicit repetition is stylistically feasible here and better preserves the source’s communal and rhetorical emphasis.
  revised_text: 也临到我们的君王、我们的首领、我们的祭司、我们的先知和我们的先祖身上。[a]
  revised_footnotes:
