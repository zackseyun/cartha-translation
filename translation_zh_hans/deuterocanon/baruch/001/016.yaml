  text: and to our kings and our rulers and our priests and our prophets and our fathers,[a]
translation:
  language: zh_hans
  text: 也临到我们的君王、我们的首领、我们的祭司、我们的先知和我们的先祖身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“父辈”。希腊文“父亲”一词在此可指民族共同体的祖辈。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦσιν
  choice: 君王
  rationale: 指掌握王权的人；“君王”自然、庄重，也准确保留其政治身份。
- source_word: ἄρχουσιν
  choice: 首领
  rationale: 泛指掌权者或领袖；“首领”既保留权柄含义，也不把所指限于某一种官职。
- source_word: ἱερεῦσιν
  choice: 祭司
  rationale: 这是宗教礼仪职分的标准称谓，直译为“祭司”。
- source_word: προφήταις
  choice: 先知
  rationale: 采用现代中文圣经语境中准确而通行的对应词“先知”。
- source_word: πατράσιν
  choice: 先祖
  rationale: 本节处于群体认罪的民族性名单中，所指更可能是历代祖辈；“先祖”自然表达这种范围，同时脚注保留较直译的可能。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 希腊文在各项前重复“我们的”，具有共同体认同和修辞强调作用；中文若逐项重复会显得笨重，因此在并列结构开头统摄各项，以自然表达同一归属关系。
- source_word: καί
  choice: 也……、……、……和……
  rationale: 句首“也”保留本节承接上文的累加关系；内部并列依照自然现代汉语用顿号及末项前的“和”表达。
theological_decisions:
- issue: 群体认罪语境中 πατράσιν 的译法
  choice: 先祖
  alternative: 父辈
  rationale: 希腊词本义可指父亲、父辈或祖先。本处与君王、首领、祭司和先知并列，涵盖共同体历代人物，译作“先祖”更清楚自然；脚注注明“父辈”这一较贴近词形的译法，以保留其家族及圣约传统色彩。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留句首承接上文的“也”和罪责“归到……身上”的语义框架；并列项按自然汉语组织，避免机械重复“我们的”，但不改变各项均属于“我们”的含义。
