    text: 或译“父辈”。希腊文“父亲”一词在此可指民族共同体的祖辈。
    reason: lexical_alternative
  revision_rationale: The revision clarifies that this verse continues the preceding reference to shame or disgrace, without supplying that implied noun in the text itself. It also retains the source’s repeated “our” and refines the footnote to state the lexical alternative plainly and neutrally.
