base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/021.yaml
  text: And we did not listen to the voice of the Lord our God[a], according to all the words of the prophets whom he sent to us,
translation:
  language: zh_hans
  text: 我们没有按照他差遣到我们这里来的众先知所说的一切话，听从主——我们上帝的声音[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”直译作“声音”。这里的“听从”保留“听”的意象，并含有留心听取、遵行的意思。
    reason: 保留φωνή的字面意象，并说明ἀκούω在此盟约悖逆语境中可含“听从、遵行”的意义，而不将其简化为单纯听觉。
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: 听从
  rationale: ἀκούω在此以属格宾语出现，并处于盟约悖逆的语境中，意思不只是听见声音，而是留心听取、接受并遵行；“听从”在现代汉语中自然地保留这种道德含义。
- source_word: τῆς φωνῆς
  choice: ……的话
  rationale: φωνή字面为“声音”，但汉语圣经语体中的“听从某人的话”能自然表达“听其声音”的习语意义；若直译为“声音”，容易被误解为单纯的听觉经验。
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: 主—我们上帝
  rationale: 按希腊文κύριος译为“主”，不另行还原为“耶和华”；破折号表明“我们上帝”与“主”同位，同时保持自然庄重。
- source_word: κατὰ πάντας τοὺς λόγους
  choice: 照着……所说的一切去行
  rationale: κατά加宾格在这里表示依照或符合。汉语若只说“照着所有话听从”较生硬，补出“去行”可清楚表达应当按全部先知信息而行的关系。
- source_word: τῶν προφητῶν
  choice: 众先知所说的
  rationale: 属格可自然理解为先知的话；译成“所说的”避免汉语中“先知的一切话”可能产生的僵硬感。
- source_word: ὧν ἀπέστειλεν πρὸς ἡμᾶς
  choice: 他差到我们这里来的
  rationale: 关系代词所指自然是复数的“先知”；πρός在此表示差遣的对象或方向，即“到我们这里来”，并非“敌对我们”。
theological_decisions:
- issue: “听主的声音”所含的盟约顺服意味
  choice: 译作“听从主—我们上帝的话”，并以脚注保留较字面的表达
  alternative: 译作“听见主—我们上帝的声音”或“顺服主—我们上帝”
  rationale: 上下文所指是有罪地不肯理会并遵行，而非未能听见声音。“听从”比“听见”更准确，又不像直接译为“顺服”那样完全消除原文“听”的意象。
- issue: κατά短语与主要动词的关系
  choice: 用“没有照着……去行”明示其规范性含义
  alternative: 译作“没有按照众先知的一切话听从主”
  rationale: 原文表达他们未依照先知全部的话听从上帝。汉语补出“去行”使关系通顺，但不增添新的神学主张，只展开语境中“听从”的实践含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听从……的话”符合自然汉语；“众先知”保持经文语体。句末逗号依照本节作为长句一部分的来源形式保留；若出版排版将本节独立呈现，可按全段标点统一处理。
