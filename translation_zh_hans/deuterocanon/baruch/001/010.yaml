base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: zh_hans
  text: 他们说：“看哪，我们已经给你们送去银钱；你们要用这些银钱购买燔祭、赎罪祭和乳香，预备素祭[a]，并把这些都献在主我们上帝的祭坛上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊词 μάννα 是祭祀用语，指谷物祭，并非旷野中的“吗哪”。
    reason: 说明此处 μάννα 指谷物祭，而不是旷野中的食物“吗哪”。
lexical_decisions:
- source_word: ἀργύριον
  choice: 银钱
  rationale: 该词本义为“银”，此处指用于购买祭物的钱款；“银钱”兼顾字面意象和交易语境。
- source_word: ἀγοράσατε
  choice: 购买
  rationale: 直接表达命令式的买入行为，庄重而自然。
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 这是祭物全部焚烧献上的祭祀术语；“燔祭”是现代中文圣经语境中明确、简洁的通行表达。
- source_word: περὶ ἁμαρτίας
  choice: 赎罪祭
  rationale: 在祭祀语境中是处理罪的专门祭类；“赎罪祭”比直译“为罪的祭”更自然明确。
- source_word: λίβανον
  choice: 乳香
  rationale: 该词特指乳香，并非泛指一切香料。
- source_word: ποιήσατε μάννα
  choice: 预备素祭
  rationale: 此处 μάννα 按祭祀语境指谷物祭，而非旷野中的吗哪；“素祭”是简洁且易识别的中文祭祀术语。
- source_word: ἀνοίσατε
  choice: 献
  rationale: 该动词在这里表示把祭物奉献到祭坛上；“献”准确传达其礼仪动作。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 祭祀场所的标准中文对应词。
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: 主我们的上帝
  rationale: 尽量保留希腊文“主—我们的上帝”的结构及称谓关系，而不改写成可能产生不同句法关系的“我们的主上帝”。
theological_decisions:
- issue: 次经希腊文本中指以色列之上帝的 κύριος 如何译出
  choice: 主
  alternative: 耶和华
  rationale: 原始证据是希腊文 Κυρίου，并未直接呈现希伯来神名；译作“主”忠实于现存希腊文本，也避免把未明示的希伯来底本形式带入正文。
- issue: περὶ ἁμαρτίας 的祭祀含义
  choice: 赎罪祭
  alternative: 为罪所献的祭
  rationale: 上下文列举具体祭物，故采用中文中明确的祭类名称；这只标明祭祀功能，不进一步界定其赎罪机制。
translation_notes:
  register: 采用现代、庄重而易懂的中文。以“看哪”保留 Ἰδού 的提示语气；用分号划分“送去银钱”和受命购买、献祭两层。正文中的脚注标记与脚注完全对应。
