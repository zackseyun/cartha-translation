- source_word: ἔναντι Κυρίου
  choice: 主
  rationale: ἔναντι本义为“在……面前”；与ἁμαρτάνω连用时表达犯罪所面对的对象。中文“得罪了主”自然传达此关系，但未另行明译“面前”。
- source_word: Κυρίου
  choice: 主
  rationale: 保留希腊文本的称谓，不反向补入未经本句直接呈现的神名。
