base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/004.yaml
  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
translation:
  language: zh_hans
  text: 也读给权贵[a]和诸王的儿子[b]听，读给长老们听，又读给全体百姓听——从最卑微的到最尊贵的——就是所有住在巴比伦苏德河[c]边的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有权势的人”。原词可指有权力或地位显赫的人。
    reason: lexical_alternative
  - marker: b
    text: 也可意译为“王子们”；希腊文直译是“诸王的儿子”。
    reason: lexical_alternative
  - marker: c
    text: “苏德”按希腊文音译；这条河的确切位置尚不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: 读给……听
  rationale: 原文直译为“在……耳中”，在此是指书卷被宣读，使这些人听见。结合上文的宣读动作，译为“读给……听”自然明确，同时保留反复句式。
- source_word: τῶν δυνατῶν
  choice: 权贵
  rationale: 该词指有权势或地位显赫的人；“权贵”适合与众王的儿子和长老并列，也不把含义误限于体力强壮。
- source_word: υἱῶν τῶν βασιλέων
  choice: 众王的儿子
  rationale: 按希腊文的关系结构直译，保留复数“王”，避免直接采用可能暗示固定宫廷头衔的“王子”。
- source_word: τῶν πρεσβυτέρων
  choice: 长老们
  rationale: 在古代犹太及公共生活语境中，此词通常指获认可的群体领袖，而不只是年长男子。
- source_word: παντὸς τοῦ λαοῦ
  choice: 全体百姓
  rationale: 简明表达原文所指整个民众群体。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: 从最卑微的到最尊贵的
  rationale: 这是涵盖整个群体的两极表达；上下文列举社会阶层，因此以地位高低表达，比容易被理解为年龄次序的“从小到大”更贴切。
- source_word: πάντων τῶν κατοικούντων
  choice: 所有住……的人
  rationale: 自然呈现希腊文分词结构的描述作用，并与前面的“全体百姓”构成解释关系。
- source_word: ἐν Βαβυλῶνι
  choice: 住在巴比伦
  rationale: 采用通行地名，并与 κατοικούντων 合译成自然汉语。
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: 苏德河边
  rationale: ἐπί加属格在此表示位于河旁或沿河；河名按希腊文音译，因其确切所指不能确定。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以三次“读给……听”保留原文的排比，并用破折号标明“从最卑微的到最尊贵的”是对全体百姓范围的补充说明；末句则进一步界定这些百姓为住在巴比伦苏德河边的人。
