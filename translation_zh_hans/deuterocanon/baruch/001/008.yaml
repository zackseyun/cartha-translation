base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/008.yaml
  text: when he received the vessels of the house of the Lord that had been carried out from the temple[a], to return them to the land of Judah, on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
translation:
  language: zh_hans
  text: 当他在西弯月初十收到从圣殿运出的主的殿中的器皿，要把它们送回犹大地时；这些银器是犹大王西底家——约西亚的儿子——所造的——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λαβεῖν
  choice: 那时，他接收了
  rationale: ἐν加冠词不定式表达与主线事件同时的时间关系；用“那时”自然引出背景，“接收”保留λαβεῖν在此处取得、领受器物之意。
- source_word: σκεύη οἴκου Κυρίου
  choice: 主殿器皿
  rationale: 在圣殿语境中，σκεύη指礼仪器具或器皿；οἶκος Κυρίου是“主的殿”。合译为“主殿器皿”，简洁而保留敬拜语域。
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  choice: 从圣殿中运出的
  rationale: 被动分词表示这些器皿此前已被移出；“运出”体现实物搬移，ναός译作现代读者熟悉的“圣殿”。
- source_word: ἀποστρέψαι εἰς γῆν Ἰούδα
  choice: 为要送回犹大地
  rationale: 不定式表达目的；ἀποστρέφω在及物用法中表示使之返回，因此译为“送回”，γῆν Ἰούδα译为“犹大地”以保留地域含义。
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  choice: 西弯月初十
  rationale: 采用中文圣经传统中较常见的月份音译“西弯月”；日期按自然汉语表达为“初十”。
- source_word: σκεύη ἀργυρᾶ
  choice: 这些银器
  rationale: 回指前述器皿，并保留材质说明；中文用“银器”比“银制器皿”更自然简洁。
- source_word: ἐποίησεν
  choice: 所造的
  rationale: 关系从句本身已清楚表明制造者；中文无需用过去完成时形态，也能在上下文中表达制造早于接收。
- source_word: Σεδεκίας υἱὸς Ἰωσεία βασιλεὺς Ἰούδα
  choice: 犹大王约西亚的儿子西底家
  rationale: 依希腊文同位关系，西底家既是约西亚之子，也是犹大王；调整语序以符合现代汉语，同时不改变修饰关系。
theological_decisions:
- issue: 圣殿称谓中的Κύριος
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文是一般希腊称谓Κύριος，并未在本节提供必须还原为特定神名形式的依据；译作“主”最直接，也避免加入宗派性表达。
- issue: ἀποστρέψαι所表达的返回关系
  choice: 器皿被送回犹大地
  alternative: 他返回犹大地
  rationale: 该不定式在语法上自然承接复数宾语“器皿”，指把器皿送回；不把返回动作误归于接收者本人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。本节在希腊文中是延续上下文的未完句，末尾保留破折号，以提示句法将在下一节继续。未设置脚注，因为正文“送回”已直接表达ἀποστρέψαι的使动返回含义；英文咨询层所列脚注属于英语措辞差异，在中文中无需另注。
