  source_fidelity: 草稿基本准确传达了器皿已被从圣殿运出、将被送回犹大地、日期及西底家的身份。不过“主殿”在现代汉语中通常可理解为建筑群的主殿或正殿，未能明确表达οἶκος Κυρίου“主的殿”；“这事发生在”也较笼统地重述日期，弱化了日期与“收到”这一动作的关联。
  naturalness: “接收”略显行政文书化；改为“收到”更合现代叙事汉语。“当……时，正值……”能自然保留原文的时间从属关系。保留破折号，反映本节在上下文中的延续性。
  terminology: 将“主殿器皿”改为“主的殿中的器皿”，明确κύριος的“主”与οἶκος的所属关系。以“犹大王西底家——约西亚的儿子——”明确“犹大王”修饰西底家，避免原稿语序可能使该头衔被理解为修饰约西亚。
