revisions:
- from: 那时，他接收了从圣殿中运出的主殿器皿，为要送回犹大地；这事发生在西弯月初十。这些银器是犹大王约西亚的儿子西底家所造的——
  to: 当他在西弯月初十收到从圣殿运出的主的殿中的器皿，要把它们送回犹大地时；这些银器是犹大王西底家——约西亚的儿子——所造的——
  rationale: 修订明确“主的殿”的所属关系，采用更自然的“收到”，并使日期直接关联收取器皿的时间。西底家的王号按希腊文同位关系明确表达。未增设脚注：英文脚注仅提示英语中“return／bring back”的措辞选择；中文“送回”已充分表达ἀποστρέψαι，且不会产生实质性歧义。
