  - severity: low
    issue: “这事发生在西弯月初十”未明确日期所附着的动作。
    rationale: τῇ δεκάτῃ τοῦ Σειουάν紧接在“收到／送回”结构中；译为“当他在……收到”更贴合原文的时间表达。
