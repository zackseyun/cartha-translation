  terminology: “公义”适合此悔罪宣认，并保留 δικαιοσύνη 的广义；附注保留“正义”这一可行的词汇替代。以“满面羞愧”恰当呈现 αἰσχύνη τῶν προσώπων 的脸面意象与公开羞辱含义。
