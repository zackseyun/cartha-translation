base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/015.yaml
  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
translation:
  language: zh_hans
  text: 你们要说：“公义属于主——我们的上帝；今日满面羞愧的却是我们，就是犹大人和耶路撒冷的居民。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译为“正义”。希腊文 δικαιοσύνη 可指公义或正义；在这里悔罪宣认的对照中，译作“公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖτε
  choice: 你们要说
  rationale: 将来时直陈语气在上下文中具有指示、吩咐意味；“要说”既自然，也保留庄重的礼仪语气。
- source_word: τῷ κυρίῳ θεῷ ἡμῶν
  choice: 主我们的上帝
  rationale: 依照希腊语词序表达归属对象，并将 κύριος 译为“主”；经文来源是希腊文《巴录书》，不直接采用代表希伯来神名的特殊排印。
- source_word: ἡ δικαιοσύνη
  choice: 公义属于
  rationale: 希腊语为省略式名词短语，中文需补出归属关系。“公义”兼顾上帝行事正直及悔罪语境中的道德含义；“正义”也有可能，但此处较窄。
- source_word: αἰσχύνη τῶν προσώπων
  choice: 满面羞愧
  rationale: 这是闪语色彩浓厚的表达，指显在脸上的羞耻或公开蒙羞；“满面羞愧”在现代中文中自然，同时保留“脸面”的意象。
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: 正如今日的光景
  rationale: 该惯用语指当下可见的处境；补出“光景”可使中文明确而不过度解释。
- source_word: ἀνθρώπῳ Ἰούδα
  choice: 犹大人
  rationale: 形式上是单数，但此处具有集合意义，并与随后复数的居民并列；“犹大人”简洁地表达群体，不额外限定性别。
- source_word: τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: 耶路撒冷的居民
  rationale: 准确、自然地表达住在耶路撒冷的人。
theological_decisions:
- issue: 悔罪宣认中 δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: 上下文将上帝的正直与百姓的羞愧相对照。“公义”较能保留其道德及关系层面的广度，而不把含义限缩为司法性的“正义”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主我们的上帝”略带经文体色彩，以贴近希腊语结构；“满面羞愧”保留原文脸面的意象，同时避免生硬的“脸面的羞耻”。
