  rationale: 修订将“在主把他们分散到那里的四围各族中”整合为地点短语，保留原文将“各族”与分散行动相连的句法关系，并保留ἐκεῖ的地点回指。将“成为受羞辱的对象，落到荒无人迹的境地”改为“受羞辱、沦于荒凉”，使并列的审判结果在现代汉语中更自然，同时以脚注呈现ἄβατον的较字面替代译法。
