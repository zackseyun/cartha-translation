base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/004.yaml
  text: And he gave them over as subjects to all the kingdoms around us[a], for reproach and desolation among all the peoples around whom the Lord scattered them there.
translation:
  language: zh_hans
  text: 他使他们受制于我们四围的一切王国，使他们在主把他们分散到那里的四围各族中受羞辱、沦于荒凉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沦于无人踏足、难以进入之地”。希腊词可指无人行走或不可进入之处；在这里也可表达荒凉、荒废的景况。
    reason: 保留ἄβατον在“荒凉”与“无人踏足、难以进入”之间的词义幅度。
lexical_decisions:
- source_word: ἔδωκεν αὐτοὺς ὑποχειρίους
  choice: 使他们受制于
  rationale: 这里不是中性的“给予”，而是把人置于别人的权势之下；“使他们受制于”自然表达了被交付、被辖制的含义。
- source_word: πάσαις ταῖς βασιλείαις ταῖς κύκλῳ ἡμῶν
  choice: 我们四围的一切王国
  rationale: 保留复数和全面范围，也准确表达这些王国环绕说话者群体。
- source_word: εἰς ὀνειδισμόν
  choice: 成为受羞辱的对象
  rationale: ὀνειδισμός指公开的羞辱、责骂或耻辱；此处用“受羞辱的对象”能与指人的宾语自然衔接。
- source_word: ἄβατον
  choice: 落到荒无人迹的境地
  rationale: 该词本义是不可进入、无人行走之处；在审判语境中可引申为荒凉。“荒无人迹的境地”兼顾本义与上下文，也避免把人直接称作“荒凉”。
- source_word: ἐν πᾶσι τοῖς λαοῖς τοῖς κύκλῳ
  choice: 在四围各族中
  rationale: λαοί泛指众族或各民族，不必限定为政治国家；“各族”简洁保留其群体复数含义。
- source_word: οὗ ... ἐκεῖ
  choice: 到了那里
  rationale: οὗ在此最自然地作地点关系副词理解，ἐκεῖ进一步指回该处；中文用“那里”保留明确的地点指向而不作生硬重复。
- source_word: διέσπειρεν
  choice: 分散
  rationale: 这是流散、被掳语境中常用的“散布”动词；“分散”清楚自然。
- source_word: Κύριος
  choice: 主
  rationale: 按其称号意义译作“主”，保留经文把分散行动归于主的表述。
theological_decisions:
- issue: 主是分散他们的行动者
  choice: 主把他们分散到了那里
  alternative: 他们在那里被分散
  rationale: 希腊文明确以Κύριος为διέσπειρεν的主语，因此不改成可能淡化行动者的被动句。
- issue: ἄβατον在审判语境中的含义
  choice: 荒无人迹的境地
  alternative: 荒凉；不可进入之地
  rationale: 原词既可表达无人踏足或难以进入，也在本语境中带有荒废、毁坏的意味。正文兼顾这两层意思，脚注列出较抽象的译法，不把语义限定为纯粹地理上的“不可通行”。
- issue: οὗ与ἐκεῖ的地点关系
  choice: 主把他们分散到了那里
  alternative: 主把他们分散在其周围的那些民族中
  rationale: οὗ可按地点副词“到哪里／在那里”理解，ἐκεῖ又明确指地点。采用“那里”保留原文略显重复的地点指示，不把关系词强解为“那些民族的周围”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“四围”保留经文语体但仍属现代常用表达；后半句适度调整语序，使希腊文中“羞辱”和“无人踏足之境”用于人的张力在中文中可理解，同时没有消除原文严厉的审判意象。
