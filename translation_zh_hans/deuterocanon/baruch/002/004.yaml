  naturalness: 现有中文总体庄重通顺，但“成为受羞辱的对象，落到荒无人迹的境地”将两个并列结果拆成较重的解释性表达；改为“受羞辱、沦于荒凉”更简洁自然，也仍保留原文严厉的意象。
  terminology: “受制于”“王国”“各族”“主”“分散”均合适。“荒无人迹的境地”可作释义，却比ἄβατον在此语境所容许的“荒凉／荒废”更具体；正文采用“荒凉”，脚注保留“无人踏足、难以进入”的词义幅度。
