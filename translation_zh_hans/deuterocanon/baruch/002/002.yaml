translation:
  language: zh_hans
  text: 在普天之下，从未有过像他在耶路撒冷所施行的事，是照着摩西律法上所记载的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐποιήθη
  choice: 从未发生过
  rationale: 该被动式直译为“未被做成”，在此语境中自然表达为“从未发生过”，并保留灾祸临到的含义。
- source_word: ὑποκάτω παντὸς τοῦ οὐρανοῦ
  choice: 在普天之下
  rationale: 采用庄重而通行的汉语表达，准确传达“整个天空之下、全天下”的范围。
- source_word: καθὰ ἐποίησεν
  choice: 他……所做的事
  rationale: 保留希腊文明确的主动表达及未明说的阳性单数主语，不擅自补作“主”或“上帝”。
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  choice: 摩西律法上
  rationale: 自然表达文本写在摩西律法中的意思，并保持专名关系。
theological_decisions:
- issue: ἐποίησεν的隐含主语身份
  choice: 译作“他”，不补明身份
  alternative: 译作“上帝”或“主”
  rationale: 原文仅以动词形态表达第三人称单数主语；虽可由上下文判断所指，正文仍应保存此处的指代形式，避免加入原文没有明说的神名。
- issue: 灾祸与施行者之间的关系
  choice: 保留“他……所做”的主动措辞
  alternative: 弱化为“在耶路撒冷发生的事”
  rationale: 希腊文ἐποίησεν是主动语态，明确将耶路撒冷之事归于该隐含主语；不应以纯粹非人格化表达消解这一神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“普天之下”保留经文语体；全句作为承接上文的内容，在独立呈现时仍保持完整顺畅。
