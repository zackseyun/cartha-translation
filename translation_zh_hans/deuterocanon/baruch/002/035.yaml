base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
translation:
  language: zh_hans
  text: 我必为他们立永约[a]，为要我作他们的上帝，他们作我的子民；我必不再使我的子民以色列离开我赐给他们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必为他们立永约，就是我作他们的上帝，他们作我的子民。”希腊文以不定式结构说明这约的目的，也可理解为其内容。
    reason: 保留τοῦ εἶναί结构在目的与内容之间的歧义。
lexical_decisions:
- source_word: στήσω
  choice: 立
  rationale: 在“约”的语境中，ἵστημι表示设立、确立；现代汉语惯用“立约”，既自然又保留庄重的盟约色彩。
- source_word: διαθήκην αἰώνιον
  choice: 永远的约
  rationale: 准确表达该约持续长久、不废止的性质；“永远的约”也是自然且易懂的圣经汉语表达。
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: 使我作他们的上帝
  rationale: τοῦ加不定式可表达约的目的或内容；“使……作……”保留这一功能，同时符合现代汉语。
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: 他们作我的子民
  rationale: 与前句构成互为对应的盟约公式；“我的子民”准确保留所属关系和群体含义。
- source_word: οὐ κινήσω ἔτι
  choice: 必不再……迁离
  rationale: κινέω本义为移动，在人与土地搭配且有ἀπό时指使其离开、迁移；“迁离”清楚表达不再使以色列离开那地，而不过度强化为“连根拔除”。
- source_word: τὸν λαόν μου Ἰσραήλ
  choice: 我的子民以色列
  rationale: 保留希腊文的同位结构及“我的”所体现的盟约归属。
- source_word: ἀπὸ τῆς γῆς
  choice: 离……土地
  rationale: 本处γῆ是赐给以色列的特定地域，译为“土地”比“地球”或泛指的“大地”准确。
- source_word: ἧς ἔδωκα αὐτοῖς
  choice: 我赐给他们的
  rationale: 保留关系从句和不定过去时所指的既往赐予；“赐给”自然表达上帝授予土地。
theological_decisions:
- issue: 盟约公式中τοῦ εἶναί的功能
  choice: 使我作他们的上帝，他们作我的子民
  alternative: 就是我要作他们的上帝，他们要作我的子民
  rationale: 希腊文以带冠词的不定式说明永约的目的或内容，两者在此难以截然区分。正文采用“使”较好保留目的色彩，脚注交代内容性译法，避免把歧义静默消除。
- issue: οὐ κινήσω ἔτι对以色列与土地关系的力度
  choice: 我必不再把我的子民以色列迁离……土地
  alternative: 我必永不再把我的子民以色列从……土地上拔除
  rationale: 原文承诺不再使其离开所赐之地。“迁离”符合κινέω与ἀπό在此的语境意义；不采用“永不”“拔除”等强化措辞，以免加入原文未明确表达的意象或末世体系。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“立约”“上帝”“子民”保留盟约语境的正式感；句法简洁，并以“迁离”清楚表达流离失地的语境。
