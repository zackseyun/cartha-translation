translation:
  language: zh_hans
  text: 因为我们在你面前祈求怜悯，并不是凭着我们祖先和君王的义行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义行”或译“正义之举”；此词也可指“律例”或“典章”，但在这里可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: 义行
  rationale: 在悔罪祷告的语境中，与“祖先和君王”搭配时，更自然地指他们可作为凭据的正义行为，而非他们所拥有的律例；“义行”简洁保留了行为及其正义性质。
- source_word: καταβάλλομεν
  choice: 陈明
  rationale: 此处与祈求怜悯及“在你面前”构成祷告用语，意为把请求呈到上帝面前；“陈明”自然庄重，也避免机械直译为“放下”。
- source_word: τὸν ἔλεον
  choice: 求怜悯的祈求
  rationale: 直译“怜悯”容易让人误以为祈祷者把怜悯献给上帝；结合祈求语境，译明为对怜悯的恳求。
- source_word: κατὰ πρόσωπόν σου
  choice: 在你面前
  rationale: 保留原文以“面”为核心的七十士译本式表达，同时在现代汉语中自然表达“在你临在之中、向着你”。
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: 主我们的上帝啊
  rationale: 保留直接呼告和祷告语气；“主”对应 κύριε，“我们的上帝”对应 ὁ θεὸς ἡμῶν。
theological_decisions:
- issue: 祈求是否以祖先和君王的功德为根据
  choice: 说话者承认，他们求上帝怜悯并不是凭祖先和君王的义行。
  alternative: 也可把 δικαιώματα 较法律化地理解为与祖先有关的正当要求、典章或律例。
  rationale: 悔罪祷告的上下文更支持否认以先祖和君王的义行作为祈求根据；译文只呈现本节的对比，不进一步引申为体系化教义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“陈明在你面前”保留原文的具象表达；句末呼告“主我们的上帝啊”依照希腊文次序保留。
