base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
translation:
  language: zh_hans
  text: 主如此说：“你们要屈下肩膀，为巴比伦王劳作[a]，住在我赐给你们列祖的土地上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屈下肩膀”是承担重负、顺服役使的形象。“为巴比伦王劳作”也可译作“服事巴比伦王”。
    reason: 说明“屈肩”的具体意象，并保留ἐργάσασθε在此语境中“劳作／服事”的词义范围，而不加入“苦役”或强制劳动的限定。
  - marker: b
    text: “住在”原文直译为“坐在”，这里指居住、定居或留在那片土地上。“列祖”也可译作“祖先”。
    reason: 说明καθίσατε的惯用含义以及πατέρες的另一种自然译法。
lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  choice: 主这样说
  rationale: 希腊文动词为过去时“说了”，但这是先知性宣告的固定引语格式；现代汉语用“主这样说”自然地保留其持续有效的权威语气。
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: 你们要屈肩
  rationale: 直译为“使你们的肩膀弯下”，描绘承担重负、顺服役使的形象；“屈肩”既保留“肩”这一具体意象，也符合庄重的现代汉语。
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: 为巴比伦王服劳役
  rationale: ἐργάζομαι本义为工作、劳作；在屈肩并臣服于巴比伦王的语境中，“服劳役”比泛泛的“工作”更准确，同时没有将其缩窄为敬拜意义的“事奉”。
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: 要住在……土地上
  rationale: καθίζω字面为“坐下”，此处与土地连用，惯用意义是居住、定居或留下；译作“住在”自然清楚。
- source_word: ἣν δέδωκα
  choice: 我赐给
  rationale: 完成时表示已经赐下且结果仍然有效；“赐给”符合神赐土地的语境，并在汉语中自然涵盖这一结果状态。
- source_word: τοῖς πατράσιν ὑμῶν
  choice: 你们列祖
  rationale: πατέρες字面为“父辈们”，在此指以色列人的历代先祖；“列祖”保留男性祖辈称谓及圣经语体，同时为普通读者所能理解。
theological_decisions:
- issue: 申命经典先知性公式中Κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文仅有希腊文Κύριος，没有可据以直接标示希伯来神名的文本形式；译为通行的“主”，既忠实又不额外引入特定译本传统。
- issue: 屈肩与为王劳作之间的关系
  choice: 保留“屈肩”的具体意象，并将劳作译为“服劳役”
  alternative: 顺服巴比伦王，服事他
  rationale: 原文将两个命令并列，前者是形象性动作，后者是实际劳作；不把两者合并为抽象的“顺服”，可保留原文的力度与张力。
- issue: πατέρες的性别与群体范围
  choice: 列祖
  alternative: 祖先
  rationale: 原文使用阳性复数“父辈”；“列祖”保留这一形式及盟约历史语境，而脚注说明可按广义理解为祖先。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“屈肩”保留原文鲜明意象；“服劳役”交代受制于巴比伦王的语境；“列祖”略具圣经语体，但在上下文中清楚自然。
