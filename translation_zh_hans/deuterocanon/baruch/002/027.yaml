base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/027.yaml
  text: And you have dealt with us[a], Lord our God, according to all your forbearance and according to all your great compassion[b],
translation:
  language: zh_hans
  text: 主我们的上帝啊，你待我们，是照着你一切的宽容[a]，也照着你一切浩大的怜悯[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽容”或译“宽厚”、“宽待”。希腊词可指仁厚、克制或从宽相待。
    reason: lexical_alternative
  - marker: b
    text: “怜悯”或译“慈悲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: 你待我们
  rationale: 按希腊语习语表达上帝怎样对待人；避免生硬直译为“向我们做了”。
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: 主我们的上帝啊
  rationale: 保留直接呼告；κύριος译为“主”，而不按希伯来神名译作“耶和华”。
- source_word: ἐπιεικίαν
  choice: 宽容
  rationale: 在此祷告语境中指宽厚、克制而不严厉相待；“宽容”自然地传达恩慈宽待的含义。
- source_word: οἰκτειρμόν
  choice: 怜悯
  rationale: 表达因同情而施恩的慈悲，并与“宽容”保持词义区别。
- source_word: τὸν μέγαν
  choice: 浩大的
  rationale: 修饰“怜悯”，以庄重而自然的现代汉语表达其广大。
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: 照着你无比的……也照着你浩大的……
  rationale: 以汉语自然的程度表达呈现两个 πᾶς 的强化作用，同时用重复的“照着……也照着……”保留原文平衡结构。
theological_decisions:
- issue: 如何区分两个相近的神圣慈悲用语
  choice: 将 ἐπιείκεια 译为“宽容”，οἰκτειρμός 译为“怜悯”
  alternative: 分别译为“宽厚”和“慈悲”，或笼统地都译为“怜悯”
  rationale: 原文刻意并列两个不同词；分别翻译可保留修辞层次，又不把二者规定为专门的神学术语。
- issue: κύριος 用于称呼上帝时的译法
  choice: 主
  alternative: 耶和华
  rationale: 现有希腊文本写的是 κύριος，并未出现希伯来神名；因此译作“主”。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主我们的上帝啊”保留直接呼告；句末用逗号，因为原文在此仍承接下文。两个脚注标记均置于相应词语之后。
