base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/014.yaml
  text: Hear, O Lord, our prayer and our plea, and deliver us for your own sake, and grant us favor before those who carried us away captive,
translation:
  language: zh_hans
  text: 主啊，求你垂听我们的祷告和恳求；求你为了你自己的缘故搭救我们，使我们在掳走我们的人面前蒙恩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσάκουσον
  choice: 求你垂听
  rationale: 该动词表示听取、俯允祈求；“垂听”符合向主祷告的庄重语体，同时自然易懂。
- source_word: τῆς προσευχῆς ἡμῶν καὶ τῆς δεήσεως ἡμῶν
  choice: 我们的祷告和恳求
  rationale: 保留两个并列名词的区别：προσευχή泛指祷告，δέησις侧重迫切的请求。
- source_word: ἐξελοῦ ἡμᾶς
  choice: 搭救我们
  rationale: ἐξαιρέω在此指从困境或掌权者手中解救；“搭救”比单纯“救”更清楚地表达脱离困境。
- source_word: ἕνεκεν σοῦ
  choice: 为了你自己的缘故
  rationale: 直译并保留祈求以上主自身为依据的含义，不进一步替文本说明究竟指名誉、信实还是其他属性。
- source_word: δὸς ἡμῖν χάριν κατὰ πρόσωπον
  choice: 使我们在……面前蒙恩
  rationale: χάρις在此语境指获得好感或恩待；“在……面前蒙恩”准确保留希腊语表达并符合中文圣经语体。
- source_word: τῶν ἀποικισάντων ἡμᾶς
  choice: 掳走我们的人
  rationale: ἀποικίζω在此指强迫迁徙、放逐；结合被掳语境译为“掳走”，自然且明确。
theological_decisions:
- issue: ἕνεκεν σοῦ所表达的祈求依据
  choice: 为了你自己的缘故
  alternative: 因你的名／因你的信实
  rationale: 原文只说“为了你的缘故”，没有明确限定为上主的名、荣耀或信实，因此不作神学性扩充。
- issue: χάριν的语境含义
  choice: 蒙恩
  alternative: 得宠／得到善待
  rationale: “蒙恩”既可表示在掌权者眼前获得好感，也保留宗教语境中的庄重感；本句并未要求将其解释为特定的救恩教义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以“主啊，求你……”呈现呼语和祈使语气；分号划分垂听与搭救、蒙恩两组请求。未添加原文没有的专名、解释或宗派性措辞。
