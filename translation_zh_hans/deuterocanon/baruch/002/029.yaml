  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: zh_hans
  text: 你们若不听从我的声音，这庞大、众多的人群必在我要把他们分散到那里的列国中只剩下少数。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人群”所对应的希腊词本义可指“嗡鸣、喧响”或“骚动”；这里因下文说“只剩下少数”，按借喻理解为人数众多的人群。原文末尾直译为“我将把他们分散到的地方，在那里”，重复地点表达以加强语气；译文以“到那里”略作保留。
    reason: 说明罕见词的语境义及原文重复的地点强调。
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: 你们若不听从我的声音
  rationale: ἀκούω在此不仅指听见，也包含听从之意；保留“我的声音”这一神圣宣告中的原文意象。
- source_word: εἰ μὴν
  choice: 必
  rationale: 表达该强调语所传达的郑重确定性，同时使现代汉语句式自然。
- source_word: ἡ βόμβησις
  choice: 群体
  rationale: 该词本义可指嗡鸣、喧响或骚动，但下文说由多变少，语境表明这里借喻人数众多的人群；译作“群体”既合上下文，也避免把隐含解释说得过满。
- source_word: ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: 这庞大而人数众多的
  rationale: 分别体现μεγάλη与πολλή的双重强调，并用自然汉语明确后者关乎人数。
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: 只剩下少数
  rationale: 原文表达较为压缩，意思是庞大群体在数量上变为很少；此译简洁地传达结果。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在……列国中
  rationale: ἔθνη在流散语境中指以色列人被分散其间的外邦各国；“列国”庄重且不额外加入教派色彩。
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: 我将他们分散到的
  rationale: 希腊文同时使用οὗ与ἐκεῖ，地点表达有重复强调；汉语关系结构不能自然逐字保留这一重复，故正文顺畅表达，并以脚注说明。
theological_decisions:
- issue: 神的警告及流散中的人数锐减
  choice: 译为不听从神声音所带来的确定后果，即这群人在列国中只剩少数
  alternative: 把ἡ βόμβησις直译为“喧响”或“轰鸣”，将句子理解为声音变小
  rationale: “变为少数”以及流散列国的上下文指向人口群体的锐减。译文只传达经文本身的警告，不添加有关审判性质或机制的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“听从我的声音”保留圣约警告的语气；“庞大而人数众多”保留原文两个形容词的强调。脚注标记置于与两个翻译问题相关的整句末尾。
