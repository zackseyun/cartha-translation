base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: zh_hans
  text: 但那因苦难深重而忧伤、弯腰乏力而行的心灵，以及逐渐衰竭的眼目和饥饿的心灵，都要将荣耀和公义归给你，主啊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχή
  choice: 心灵
  rationale: 本节两次使用该词，所指是受苦之人的内在生命乃至整个人；译作“心灵”既保留诗意，也避免把它简化为单纯的“人”。
- source_word: λυπουμένη
  choice: 忧伤
  rationale: 该现在分词表达持续的悲伤或痛苦；“忧伤”自然庄重，也不额外限定悲伤的原因。
- source_word: ἐπὶ τὸ μέγεθος
  choice: 因苦难深重
  rationale: 希腊语表达高度压缩，只明说“巨大程度”；结合弯腰、乏力、眼目衰败和饥饿等语境，补出“苦难”可使汉语通顺，同时以脚注保留原文的省略性。
- source_word: βαδίζει
  choice: 而行
  rationale: 保留行走、前行的基本意义，并与后面的状态分词自然衔接。
- source_word: κύπτον
  choice: 弯腰
  rationale: 准确呈现身体俯屈的形象，也容许受压困顿的引申意味。
- source_word: ἀσθενοῦν
  choice: 乏力
  rationale: 该词可指软弱或患病；语境强调耗尽和困顿，“乏力”不把含义过度限定为疾病。
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: 渐渐衰败的眼睛
  rationale: ἐκλείπω表示逐渐失去力量、衰竭；“渐渐衰败”保留持续耗损的图景，而不擅自限定为失明。
- source_word: πεινῶσα
  choice: 饥饿的
  rationale: 直接表达持续处于饥饿之中的状态，不作不必要的强化。
- source_word: δώσουσίν σοι δόξαν
  choice: 要将荣耀……归给你
  rationale: 以现代汉语自然表达“给予你荣耀”的直接结构，传达受苦者承认上主尊荣之意。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 在向上主祷告的语境中，该词可指上主的正直、公义；“公正”仍是可能的侧重，故收入脚注。
- source_word: Κύριε
  choice: 主啊
  rationale: 采用对上帝的常用庄重称呼，并保留呼格语气。
theological_decisions:
- issue: 祷告中 δικαιοσύνην 的译法
  choice: 公义
  alternative: 公正
  rationale: 此处是在苦难中把荣耀与 δικαιοσύνη 归给上主，可能侧重承认上主的正直与正当；“公义”能涵盖这一层面，但“公正”所强调的审判与公平意味也成立，故以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留原文由“心灵—眼睛—心灵”组成的诗性并列结构，也保留受苦者把荣耀和公义归给上主这一略显张力的表达；没有将其改写成更明确的神学陈述。
