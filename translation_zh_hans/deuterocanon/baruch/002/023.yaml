base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: zh_hans
  text: 我要使从犹大的各城和耶路撒冷城外[a]传出的欢喜之声和快乐之声、新郎之声和新娘之声止息；全地都将因其中的居民而变得无法通行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“耶路撒冷外面”。有些译本受相近的先知性表达影响，译作“耶路撒冷的街上”，但现存希腊文本所用的词意为“外面”。
    reason: alternative_reading
  - marker: b
    text: 希腊文末句较难理解，也可译作：“全地都将无法通行，不再有居民”，或“全地都将无法通行，空无居民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: 我要使……止息
  rationale: ποιέω加不定式明确表达使役，保留审判宣告中主动施行的意味。
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: 从犹大的各城和耶路撒冷城外
  rationale: ἔξωθεν通常表示“在外、从外面”；译作“城外”既贴近现存希腊文本，也比生硬的“耶路撒冷外面”更符合现代汉语。
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: 欢喜和快乐的声音
  rationale: φωνή在此指节庆中可听见的声音；两个近义名词分别译出，以保留诗性并列。
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: 新郎和新娘的声音
  rationale: 延续φωνή的重复结构，并以现代汉语婚礼语境中的自然称谓表达。
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: 全地都将……变得无法通行
  rationale: ἄβατος本义是不能踏足或不能穿越；“无法通行”保留其具体含义，不泛化为仅仅“荒凉”。
- source_word: ἀπὸ ἐνοικούντων
  choice: 因其中的居民
  rationale: 按ἀπό可能表达的原因关系直译，同时以脚注保留其也可能表示与居民分离、无人居住的语法歧义。
theological_decisions:
- issue: 是否依照相近的耶利米审判套语润色或协调本节
  choice: 保留现存希腊文本的“耶路撒冷城外”以及末句的疑难表达
  alternative: 依照平行经文译作“耶路撒冷的街上”，并把末句确定译为“无人居住”
  rationale: 以本节现存希腊见证为首要依据，不用较熟悉的平行公式取代其措辞；真正的文本与语法张力通过脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“声音……止息”的重复节奏，并以分号和句号梳理较长的希腊句；不借平行经文消除本节末句的歧义。
