base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: zh_hans
  text: 如今，主啊，以色列的上帝，你曾用大能的手，借着神迹奇事，以浩大的能力和高举的臂膀[a]，把你的子民从埃及地领出来，也为自己立了名，直到今日仍是如此，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高的臂膀”。希腊文用的是“高的／高举的臂膀”，不同于一些出埃及经文中较常见的“伸出的膀臂”。
    reason: 说明原文措辞及其与常见出埃及用语的差异。
lexical_decisions:
- source_word: Καὶ νῦν
  choice: 如今
  rationale: 承接上文并转入当前的祈求；“如今”比逐字译作“而现在”更符合现代汉语祷告语体。
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  choice: 主—以色列的上帝啊
  rationale: 保留对上帝的直接呼告和“以色列的上帝”这一称号；用破折号表明两个称谓同指一位，避免误读。
- source_word: ἐξήγαγες
  choice: 领出来
  rationale: 准确表达从埃及带领出来的出埃及行动，也保留常见的圣经叙事用语。
- source_word: ἐν χειρὶ κραταιῷ
  choice: 用大能的手
  rationale: 保留“手”的身体隐喻及彰显神力的出埃及措辞。
- source_word: σημείοις καὶ ἐν τέρασιν
  choice: 借着神迹奇事
  rationale: “神迹奇事”是清楚自然的固定搭配，分别传达 signs 与 wonders，同时避免中文中机械重复介词。
- source_word: ἐν δυνάμει μεγάλῃ
  choice: 以浩大的能力
  rationale: “浩大”体现 μεγάλῃ 的强度，“能力”直接表达 δύναμις，语体庄重而易懂。
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: 高举的臂膀
  rationale: ὑψηλῷ 本义为“高的、高举的”，此处不径自改成熟悉但用词不同的“伸出的膀臂”。
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: 为自己立了名
  rationale: 保留反身含义和“立名”的圣经式意象，表达上帝由此彰显自己的名声。
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: 直到今日仍是如此
  rationale: 以自然现代汉语表达该公式所指的持续到当下、今日仍可见的事实。
theological_decisions:
- issue: 出埃及救赎行动中神力彰显的累积描写
  choice: 保留“大能的手—神迹奇事—浩大的能力—高举的臂膀”的完整序列
  alternative: 将这些表达压缩为“以大能行神迹，把子民领出埃及”
  rationale: 原文层层累加的工具性短语呼应出埃及传统，并强调上帝公开彰显的大能；不应为求简洁而削弱其修辞和神学分量。
- issue: βραχίονι ὑψηλῷ 与常见出埃及措辞的差异
  choice: 译作“高举的臂膀”
  alternative: 译作“伸出的膀臂”
  rationale: 保留现存希腊文本“高、高举”的实际措辞，不以其他经文中较熟悉的表达取代它。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。保留原文长句及末尾逗号，以反映本节语法和祷告内容在下一节继续；适度调整介词以符合汉语表达，但不压缩神力彰显的累积结构。
