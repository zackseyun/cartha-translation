  text: And if you do not listen to the voice of the Lord[a], to serve the king of Babylon[b],
translation:
  language: zh_hans
  text: 如果你们不听从主的声音[a]，不服事巴比伦王[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听主的声音”；这里的“听”含有听从、顺服的意思。
