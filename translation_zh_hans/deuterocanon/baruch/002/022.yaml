    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε τῆς φωνῆς Κυρίου
  choice: 如果你们不听从主的声音
  rationale: ἀκούω接属格可指听见、听从；“听从……的声音”既保留原文的听觉意象，也自然表达顺服之意。
- source_word: ἐργάσασθαι
  choice: 服事
  rationale: ἐργάζομαι本义为“工作、做工”，但与表示人的与格连用时，在这里指为巴比伦王效力；“服事”比直译“为……做工”更符合政治臣服的语境。
- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: 巴比伦王
  rationale: 自然、简洁地表达属格关系，并保留明确的政治指称。
theological_decisions:
- issue: 是否把ἀκούσητε所含的顺服含义完全明说为“顺服”
  choice: 正文译作“听从主的声音”
  alternative: “顺服主”或“听主的声音”
  rationale: 原文明确使用听觉表达，同时在此语境中含有遵行之意；“听从主的声音”兼顾字面意象和惯用含义，不把二者之间的张力抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听从主的声音”保留圣经惯用意象；句末逗号反映本节在原文中是尚未完结的条件从句，语意延续至下文。
