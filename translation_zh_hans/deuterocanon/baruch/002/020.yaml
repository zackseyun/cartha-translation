base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/020.yaml
  text: because you have brought your wrath and your anger upon us[a], just as you spoke by the hand of your servants the prophets
translation:
  language: zh_hans
  text: 因为你把你的烈怒和愤怒降在了我们身上，正如你借着你仆人众先知之手所说的那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着你仆人众先知之手”也可意译为“借着你仆人众先知”。希腊文直译为“借……之手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνῆκας
  choice: 降在了……身上
  rationale: 按上下文表示使烈怒与愤怒临到人；“降在……身上”自然保留其施加、临到的方向性，又不额外具体化为某种刑罚。
- source_word: θυμόν
  choice: 烈怒
  rationale: 表示强烈的怒气；“烈怒”有庄重的经文语体，并与后面的 ὀργή 保持区别。
- source_word: ὀργήν
  choice: 愤怒
  rationale: 与 θυμός 构成近义并列；译作“愤怒”可保留双重强调，不把两词合并。
- source_word: καθάπερ
  choice: 正如
  rationale: 清楚表达当前遭遇与先前先知之言的对应关系。
- source_word: ἐλάλησας
  choice: 所说的
  rationale: 忠实表达“说、讲话”，并自然接入汉语关系结构。
- source_word: ἐν χειρί
  choice: 借……之手
  rationale: 保留希腊文及圣经传统中的中介、代理用语，同时在现代汉语中仍可理解。
- source_word: παίδων
  choice: 仆人
  rationale: 此处指受上帝差遣的先知；“仆人”符合语境，而“孩子”不合适，“奴隶”则强化了原文未必着重的身份色彩。
- source_word: προφητῶν
  choice: 众先知
  rationale: 作为同位语说明这些仆人的身份；“众先知”自然体现复数。
theological_decisions:
- issue: 如何处理 θυμός 与 ὀργή 这组表示上帝审判之怒的近义词
  choice: 分别译作“烈怒和愤怒”
  alternative: 合译为“愤怒”，或译作“怒气和震怒”
  rationale: 原文并列两个近义词以加强审判的严厉程度；分别翻译可保留修辞力度和神学张力，而不把两者压缩为一个概念。
- issue: 如何处理 ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν 的代理表达
  choice: 借你的仆人众先知之手
  alternative: 借着你的仆人众先知
  rationale: “借……之手”保留原文可见的圣经式代理意象，也清楚表达上帝通过先知发言；较顺畅的意译列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“烈怒和愤怒”保留原文近义并列；“借……之手”略带圣经语体，因此用脚注说明其自然意译。
