base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: zh_hans
  text: 我要使他们回到我曾向他们的列祖——亚伯拉罕、以撒和雅各——起誓所许的土地；他们必掌管那地[a]。我要使他们增多，他们的人数绝不减少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“占有那地”。希腊语动词可表示作主、掌管，也可在此土地语境中表示取得并占有。
    reason: 词义存在合理的语境性选择，正文采用较直接反映动词支配含义的译法。
lexical_decisions:
- source_word: ἀποστρέψω
  choice: 使……回到
  rationale: 此处为使役性的返回，表示上帝使他们重返那片土地；“使……回到”自然地保留了方向和复归之意。
- source_word: γῆν
  choice: 土地
  rationale: 上下文指与列祖之誓有关的特定土地，并非泛指全地或地球。
- source_word: ὤμοσα
  choice: 起誓所许
  rationale: “起誓”保留誓言的明确力度；加“所许”使现代汉语句法通顺，同时不把誓言的具体内容作过度扩展。
- source_word: πατράσιν
  choice: 列祖
  rationale: 后文明确列出亚伯拉罕、以撒和雅各；“列祖”既准确指向这些父祖人物，也符合庄重而易懂的圣经语体。
- source_word: κυριεύσουσιν
  choice: 掌管
  rationale: 该动词直接表达作主、施行支配的意思；“掌管”保留其强于单纯居住或取得的语义，同时以脚注注明土地语境中“占有”的可能译法。
- source_word: πληθυνῶ
  choice: 使他们增多
  rationale: 保留使役意义，并呼应关于后裔增多的盟约性语言。
- source_word: οὐ μὴ
  choice: 绝不
  rationale: 准确传达希腊语双重否定结构的强烈否定语气。
- source_word: σμικρυνθῶσιν
  choice: 人数……减少
  rationale: 与前面的“使他们增多”形成清楚对照；补出“人数”说明此处所指，符合现代汉语表达。
theological_decisions:
- issue: 复归与列祖之誓的盟约性关联
  choice: 在正文中保留“起誓”以及亚伯拉罕、以撒、雅各的名字
  alternative: 概括译为“应许给他们祖先的土地”
  rationale: 原文把复归明确建立在上帝向列祖所起的誓上。保留誓言措辞和三位列祖的名字，既呈现盟约背景，又不加入进一步的教义解释。
- issue: κυριεύσουσιν 所表达的土地关系
  choice: 译为“掌管那地”
  alternative: 译为“占有那地”
  rationale: “掌管”较直接反映动词“作主、支配”的意义；但土地语境容许理解为取得并占有，因此将该可能性保留在脚注中。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“列祖”保留经文的父祖指向；破折号清楚标明三位列祖是前项的同位说明。句末以“人数绝不减少”自然呈现强烈否定，并与“使他们增多”构成对应。
