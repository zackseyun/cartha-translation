base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/013.yaml
  text: Let your wrath turn away from us, because we have been left few among the nations where you scattered us there.
translation:
  language: zh_hans
  text: 愿你的烈怒离开我们，因为我们在你把我们分散到那里的列国中，只剩下少数人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήτω
  choice: 愿……转离
  rationale: 保留第三人称祈愿式的语气，表达祈求上帝使其烈怒离开，而非直陈命令。
- source_word: ὁ θυμός σου
  choice: 你的烈怒
  rationale: θυμός在此指强烈的忿怒；“烈怒”自然、庄重，并符合祷告语境。
- source_word: κατελείφθημεν ὀλίγοι
  choice: 我们……只剩下少数人
  rationale: 准确表达被留下后人数稀少的结果；“只剩下少数人”比逐字译法更符合现代汉语。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在……列国中
  rationale: ἔθνη在流散语境中指各外邦国家或民族；“列国”兼具经文庄重感与可懂度。
- source_word: διέσπειρας
  choice: 分散
  rationale: 保留散布于各地的核心意象，并明确行动者是“你”。
- source_word: οὗ…ἐκεῖ
  choice: 你把我们分散到的
  rationale: 希腊文同时出现关系副词οὗ与指示副词ἐκεῖ，直译会形成“在那里……那里”的冗余；用汉语关系结构自然承载地点信息，不另重复“那里”。
theological_decisions:
- issue: 上帝的烈怒与流散之间的关系
  choice: 保留“你的烈怒”以及“你把我们分散”的直接表述
  alternative: 弱化为“怒气”或用被动式“我们被分散”
  rationale: 原文直接把烈怒归于上帝，并以第二人称动词称上帝为分散他们的行动者；译文不回避这一神学张力。
- issue: ὅτι的逻辑关系
  choice: 译为“因为”
  alternative: 译为“既然”或“因为……所以求你……”
  rationale: ὅτι最自然地给出祈求的理由；保留因果关系，而不额外解释少数余民为何构成蒙怜悯的依据。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“列国”保留经文语体；句法依照现代汉语调整，避免机械复制希腊文οὗ…ἐκεῖ造成地点词重复。
