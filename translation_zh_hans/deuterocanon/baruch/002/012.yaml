base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/012.yaml
  text: We have sinned[a], we have acted ungodly, we have done wrong, O Lord our God, against all your ordinances.
translation:
  language: zh_hans
  text: 主，我们的上帝啊，我们犯了罪，行事不敬虔，行了不义，违背了你一切的律例。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违背了你一切的律例”也可译为“在你一切的律例方面”或“关于你一切的律例”。“律例”也可译为“公义的判决”或“规定”。原文介词可表示违背，也可较宽泛地表示与上帝的法令或准则有关。
    reason: 保留 ἐπί 与 δικαιώματα 在此处的词义和句法歧义，并以自然现代汉语表述替代关系。
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: 我们犯了罪
  rationale: 不定过去时用于认罪陈述；“犯了罪”在现代汉语中自然、庄重，也忠实表达犯罪之意。
- source_word: ἠσεβήσαμεν
  choice: 行事不敬虔
  rationale: 保留动词所表达的不敬神行为；比“我们是不敬虔的”更能体现行动含义，也比“行了亵渎之事”更少缩窄词义。
- source_word: ἠδικήσαμεν
  choice: 做了恶
  rationale: 此处没有明说受害对象，故采用概括性的“做了恶”，表达行不义、做错事，而不擅自限定为伤害某人。
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: 主我们的上帝啊
  rationale: 按希腊语呼格译作直接呼求；“主”对应 κύριος，“我们的上帝”对应 ὁ θεὸς ἡμῶν，语气适合祷告与认罪。
- source_word: ἐπὶ πᾶσιν τοῖς δικαιώμασίν σου
  choice: 违背了你一切的律例
  rationale: 在认罪语境中，将 ἐπί 理解为行为与上帝规定相抵触；δικαιώματα 译作“律例”，保留其法令、规范和公义要求的广泛含义。
theological_decisions:
- issue: 对上帝的 κύριος 称呼
  choice: 主
  alternative: 主宰
  rationale: 原文为 κύριος，并非直接出现希伯来神名；“主”是准确、自然且不额外引入特定传统排印方式的译法。
- issue: δικαιώματα 在认罪语境中的含义
  choice: 律例
  alternative: 公义的判决／规定／要求
  rationale: “律例”能够体现上帝规定的约束力，同时不把该词过度限定为法庭判决；脚注保留其也可指公义判决或更广泛规范的可能。
- issue: ἐπί 与 δικαιώματα 的关系
  choice: 违背
  alternative: 在……方面／对于
  rationale: 上下文是认罪，“违背”最自然地表达罪与上帝律例相抵触；但介词本身也可表示较宽泛的关联，因此以脚注保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。三个认罪动词依次译为“犯了罪、行事不敬虔、做了恶”，保留原文的并列和递进感；将呼语置于句首，使中文表达自然，同时未改变其对上帝直接认罪的功能。
