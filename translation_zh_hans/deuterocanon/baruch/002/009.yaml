base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/009.yaml
  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
translation:
  language: zh_hans
  text: 主警醒地留意这些灾祸[a]，又使它们临到我们；因为主在他所吩咐我们的一切作为中都是公义的[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“灾难”或“恶事”。这里所指很可能是审判所带来的灾祸，而不是抽象的道德邪恶。
    reason: lexical_alternative
  - marker: b
    text: “公义的”也可译作“公正的”。
    reason: lexical_alternative
  - marker: c
    text: 原文此处直译近于“他的一切作为，就是他吩咐我们的”，关系从句的表达较为压缩。也可理解为“他所吩咐我们的一切事”或“他吩咐我们去做的一切事”。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: 一直警醒，留意
  rationale: γρηγορέω本义为“醒着、警醒”。这里表示主并非被动旁观，而是警醒地关注将临的审判；译文保留“警醒”的意象，并以“留意”说明其与灾祸的关系。
- source_word: ἐπὶ τοῖς κακοῖς
  choice: 留意那些灾祸
  rationale: κακά在此结合下一分句“使它们临到我们”，所指是审判性的灾祸，而非抽象的道德邪恶。
- source_word: ἐπήγαγε … ἐφ᾽ ἡμᾶς
  choice: 使它们临到我们
  rationale: ἐπάγω表示使某事临到或加在某人身上；此译准确表达主主动施行审判，同时符合现代汉语。
- source_word: δίκαιος
  choice: 公义的
  rationale: δίκαιος在此称述主施行审判时的正直与正当；“公义”既保留经文语体，也适合本段神学语境。
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: 在他……的一切作为上
  rationale: ἐπί在这里表示所涉及的范围；“在……上”保留原文结构与全面范围，αὐτοῦ则由“他”体现。
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: 他吩咐我们的
  rationale: 原文关系从句紧接“他的一切作为”，表达压缩且略显含混。译文不补入“去做”等解释性成分，以保留这种张力。
theological_decisions:
- issue: τὰ κακά是指道德上的“恶”，还是主所施行的审判性灾祸
  choice: 灾祸
  alternative: 恶事／灾难
  rationale: 上下文明确说主使这些事临到百姓，因此主要指盟约审判带来的灾祸。这样既不淡化主主动施行审判，也避免让现代读者误解为主施行道德邪恶。
- issue: 如何表达δίκαιος对主的描述
  choice: 公义的
  alternative: 公正的
  rationale: “公义”保留δικ-词族在圣经语境中的道德与审判含义；脚注注明“公正”这一自然替代译法。
- issue: ἃ ἐνετείλατο ἡμῖν与τὰ ἔργα αὐτοῦ之间压缩而含混的关系
  choice: 保留为“他吩咐我们的一切作为”
  alternative: 他吩咐我们去做的一切事／他所吩咐我们的一切事
  rationale: 原文将“他的作为”与“他吩咐我们”直接连接，语义关系并不完全展开。正文尽量保留这一张力，脚注提示可按所吩咐之事理解，而不在正文中强行消解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“一直警醒，留意”保留原文醒着守望的意象；分号呈现两个并列动词的推进。末句刻意保留希腊文关系从句的压缩感，并用脚注交代可能理解。
