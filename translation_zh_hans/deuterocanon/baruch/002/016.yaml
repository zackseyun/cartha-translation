base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/016.yaml
  text: Lord[a], look down from your holy house and take notice of us; incline your ear, Lord, and hear.
translation:
  language: zh_hans
  text: 主啊，求你从你的圣洁居所[a]俯看，顾念我们；主啊，求你侧耳垂听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“从你的圣洁房屋”；这里也可理解为“从你的圣殿”或“从你的神圣住所”。
    reason: 说明οἶκος的字面意义，并保留其究竟指圣殿还是上帝居所的开放性。
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 呼格直接称呼上帝；“主啊”是现代汉语祷告中自然、庄重的表达，并保留原文两次呼告。
- source_word: κάτιδε
  choice: 俯看
  rationale: 该命令式带有从上往下看的意味；“俯看”既保留垂直意象，也与后面的“从……居所”自然衔接。
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: 从你的圣洁居所
  rationale: οἶκος本义为“房屋、居所”，此处指上帝的神圣住所。“圣洁居所”比直译“圣洁的房屋”自然，又不直接把含义限定为地上的圣殿。
- source_word: ἐννόησον εἰς ἡμᾶς
  choice: 顾念我们
  rationale: 该短语要求上帝留意并眷顾祈求者；“顾念”兼有留心与关怀之意，符合祷告语境。
- source_word: κλῖνον τὸ οὖς σου
  choice: 侧耳
  rationale: 保留原文“倾斜耳朵”的身体隐喻；“侧耳”在现代汉语中清楚、庄重而不生硬。
- source_word: ἄκουσον
  choice: 垂听
  rationale: 命令式意为“听”；祷告中用“垂听”自然表达恳求上帝听取，并与“侧耳”构成传统而易懂的搭配。
theological_decisions:
- issue: οἶκος在此应译为“居所”还是具体化为“圣殿”
  choice: 圣洁居所
  alternative: 圣殿
  rationale: 希腊文使用οἶκος而非专指内殿的ναός。译作“圣洁居所”保留上帝住所这一较宽泛的表达，避免把经文无根据地限定为地上的礼仪建筑；脚注说明其字面措辞及可能理解。
- issue: 是否保留“侧耳”这一拟人化祷告意象
  choice: 侧耳垂听
  alternative: 请听我们
  rationale: 原文明确说“使你的耳朵倾斜并听”。保留该意象可传达祈求上帝俯就、关注的力度，同时不把拟人语言解释成关于上帝形体的教义陈述。
translation_notes:
  register: 采用现代、庄重的祷告语体。“求你”使连续命令式在汉语中自然表达恳求；“俯看、顾念、侧耳垂听”保留原文的动作意象和诗性平行结构。
