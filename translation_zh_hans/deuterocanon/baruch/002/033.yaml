  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: zh_hans
  text: 他们必转离自己刚硬的背和自己的恶行，因为他们会想起他们那些在主面前犯罪的列祖所走的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: 将离弃
  rationale: 未来时表达将要发生的转变；与ἀπό连用，在此指离开先前顽梗的状态和恶行。“离弃”自然体现悔改性的转离。
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: 离弃自己那刚硬的背
  rationale: νώτου直指“背”，而不是常见的“颈项”；保留身体意象，以免用别处更熟悉的说法取代本句独特措辞。σκληροῦ译作“刚硬”，既保留硬度意象，也传达顽梗意味。
- source_word: πονηρῶν πραγμάτων αὐτῶν
  choice: 自己的恶行
  rationale: πράγματα在此指行为或作为，而非泛指“事物”；“恶行”简洁、自然，并具有相称的道德分量。
- source_word: μνησθήσονται
  choice: 会想起
  rationale: 该词在此意为记起、忆及；“想起”符合现代汉语，同时保留未来意义。
- source_word: τῆς ὁδοῦ
  choice: 道路
  rationale: ὁδός可比喻生活方式或行事道路；译作“道路”保留圣经中常见的道路意象，不将其直接抽象化为“行为”。
- source_word: πατέρων αὐτῶν
  choice: 他们列祖
  rationale: πατέρων为阳性复数，指先祖。“列祖”在庄重而通俗的圣经汉语中自然，并保留原文对父辈祖先的表达。
- source_word: τῶν ἁμαρτόντων
  choice: 曾……犯罪
  rationale: 不定过去主动分词表明这些列祖犯过罪；用独立关系分句清楚呈现其修饰对象。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: ἔναντι通常表示“在……面前”或“在……眼前”。此译法不把介词过度解释为“得罪/反对”，同时保留行为处于主鉴察之下的意味。
theological_decisions:
- issue: “刚硬的背”的隐喻
  choice: 保留“背”的身体意象
  alternative: 译作“硬着颈项”或直接译作“顽梗”
  rationale: 希腊文使用νώτου（背），不是“颈项”。虽然该表达指向顽梗，正文仍保留原文较罕见的意象，并以脚注说明其含义。
- issue: πατέρων αὐτῶν的指称
  choice: 他们列祖
  alternative: 他们的祖先
  rationale: “列祖”既准确反映阳性复数，也符合经文语域；不作不必要的中性化。
- issue: Κυρίου的译法
  choice: 主
  alternative: 上主或耶和华
  rationale: 直接希腊文证据为Κυρίου。译作“主”最透明，不从可能的希伯来底本反向引入本行未出现的神名形式。
- issue: “想起列祖的道路”的张力
  choice: 直译为“想起他们列祖的道路”，并随后说明列祖曾犯罪
  alternative: 解释为“想起列祖犯罪的道路”
  rationale: 原文保留了“道路”与“犯罪的列祖”之间的关系，并未明确说他们效法、拒绝或悔悟那道路；译文不替原文消解这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列祖”“在主面前”保留经文语域；以分号拆开较长的后置修饰关系，使“犯罪”的主语明确。脚注标记[a]已置于相关短语之后。
