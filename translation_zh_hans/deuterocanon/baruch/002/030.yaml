base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/030.yaml
  text: For I knew that they would certainly not listen to me[a], because they are a stiff-necked people; but in the land of their exile they will return to their heart,
translation:
  language: zh_hans
  text: 因为我早知道，他们绝不会听从我，因为他们是硬着颈项的百姓；而在他们流亡之地，他们必在心里回转。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在心里回转”原文直译为“回到（或转向）自己的心”；也可理解为“把这事放在心上”。
    reason: 说明希腊文带有闪语色彩的非常规表达，保留其字面意象及可能的理解幅度，避免将其限定为明确的“悔改”或“改变心意”。
lexical_decisions:
- source_word: ἔγνων
  choice: 我知道
  rationale: 以一般过去意义理解不定过去时；中文叙事中“知道”无须另加时态标记，也可自然表达上帝先已知道他们的反应。
- source_word: οὐ μὴ ἀκούσωσίν μου
  choice: 他们绝不会听从我
  rationale: “绝不会”体现οὐ μή加虚拟式的强烈否定；“听从我”既保留听的意象，也传达此处听命、顺从的语境含义。
- source_word: λαὸς σκληροτράχηλος
  choice: 硬着颈项的百姓
  rationale: 保留希腊复合词中的圣经性身体隐喻，同时现代读者仍可由上下文理解其顽梗之意；“百姓”契合盟约群体语境。
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: 他们必回心转意
  rationale: 希腊文直译近于“回到自己的心”；中文“回心转意”自然保留内在转回及心的意象，但不直接改译为更明确的“悔改”。
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: 在他们流亡之地
  rationale: ἀποικισμός指被迁离故土、侨居异地的处境；“流亡之地”简洁自然，也避免把含义限缩为监禁式的“被掳”。
theological_decisions:
- issue: “回到自己的心”这一惯用语的属灵含义
  choice: 正文译作“回心转意”，表达内在转回而不直接使用“悔改”这一更明确的神学术语。
  alternative: 直译作“回到自己的心”或译作“在心里回转”。
  rationale: 原文使用ἐπιστρέφω和“心”的表达，暗示悔悟与归回，却没有采用更明确的悔改术语；此译兼顾中文自然度与原文的神学张力。
- issue: καὶ在两分句之间的关系
  choice: 译作“但”，显明顽梗不听与日后内在转回之间的语义对照。
  alternative: 译作“并且”或“而”。
  rationale: καί本身常作连接词，但上下文形成明显转折；中文用“但”可自然呈现该关系，并未改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“硬着颈项”保留传统圣经意象；“回心转意”使罕见的直译表达在中文中自然，同时以脚注交代原文措辞。
