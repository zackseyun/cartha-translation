  yaml_path: translation/deuterocanon/baruch/002/032.yaml
  text: and they will praise me in the land of their exile[a], and they will remember my name[b];
translation:
  language: zh_hans
  text: 他们要在流亡之地赞美我[a]，也要记念我的名[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被迁居之地”。希腊词可指离开故土并被安置在异乡；本处按上下文译作“流亡”。
    reason: lexical_alternative
  - marker: b
    text: “我的名”保留圣经惯用语，可指上帝所启示的身份与尊荣。
    reason: theological_clarity
lexical_decisions:
- source_word: αἰνέσουσίν
  choice: 赞美
  rationale: 该词是 αἰνέω 的将来时主动语态，表示以言语颂赞；“赞美”自然、庄重，也保留敬拜意味。
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: 在流亡之地
  rationale: ἐν γῇ 表示地点；ἀποικισμοῦ 可指离开故土后被安置异乡的处境。结合本段受罚、分散异邦的语境，“流亡之地”简洁而准确；中文无须另译 αὐτῶν 的所属关系，因为“他们要在流亡之地”已自然指向他们身处的流亡地。
- source_word: μνησθήσονται
  choice: 记念
  rationale: 该词表示记起、铭记。这里以“记念”体现郑重而带有信仰意味的主动记取，比日常口语“想起”更符合经文语体。
- source_word: τοῦ ὀνόματός μου
  choice: 我的名
  rationale: 直译并保留圣经中“名”的惯用表达，使其关于上帝所启示的身份与尊荣的丰富含义不被释义取代。
theological_decisions:
- issue: 盟约语境中“我的名”的含义
  choice: 正文保留“我的名”这一表达
  alternative: 我的声誉；我是谁
  rationale: “名”可能涵盖上帝所启示的身份、尊荣与声誉，但原文采用“名”的圣经惯用语。直译可保留其神学张力，避免在正文中过度解释。
- issue: ἀποικισμός 在审判与复兴语境中的含义
  choice: 译作“流亡”
  alternative: 迁徙；被掳；放逐
  rationale: 本段涉及因审判而身处异邦及后来回转记念上帝；“流亡”既能表达离开故土、居于异地的状态，又不把该词限制为某一种具体迁移方式。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“流亡之地”对应原文地点短语；“记念”较“记得”更符合敬虔语境，但仍属现代标准汉语。两个脚注标记均已置于正文相应位置。
