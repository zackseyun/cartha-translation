base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/008.yaml
  text: And we did not entreat the favor of the Lord[b][a], that each one might turn from the thoughts of their evil heart.
translation:
  language: zh_hans
  text: 我们也没有恳求主垂顾[a]，好叫各人离弃自己邪恶之心的意念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“恳求主的面”；这是指求主恩慈地临在、眷顾或施怜悯的表达。
    reason: lexical_alternative
  - marker: b
    text: “意念”也可译作“意图”或“谋算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν
  choice: 恳求
  rationale: δέομαι表示迫切请求、恳求；这里不只是一般性的祷告，因此采用“恳求”以保留其语气。
- source_word: τοῦ προσώπου Κυρίου
  choice: 主垂顾
  rationale: 原文直译为“主的面”，是带有闪语色彩的表达；在恳求的语境中，指求主以恩慈临在并眷顾。“主垂顾”既自然庄重，也保留了关系性的含义。
- source_word: τοῦ ἀποστρέψαι
  choice: 好叫……离弃
  rationale: 带冠词的不定式表达所求的目的或结果。“好叫”在现代汉语中自然呈现这一关系，同时不把神的作用与人的转离解释得过细。
- source_word: ἕκαστον
  choice: 各人
  rationale: 保留ἕκαστον逐一、分配性的含义，比笼统的“众人”更贴近原文。
- source_word: νοημάτων
  choice: 意念
  rationale: νόημα可指思想、意图或谋算。“意念”能够涵盖内在思想和意向，并适合本节悔罪语境。
- source_word: καρδίας
  choice: 内心
  rationale: καρδία是思想、意志和道德倾向所在的“心”。“内心”在现代汉语中自然，同时保留圣经的人论意象。
- source_word: αὐτῶν
  choice: 自己
  rationale: 原文在单数分配词ἕκαστον之后使用复数所有格αὐτῶν，指群体中各人的心；汉语用“各人……自己”最自然地表达这种分配关系。
- source_word: τῆς πονηρᾶς
  choice: 邪恶
  rationale: 此处形容“心”，具有明确的道德含义；“邪恶”比一般的“坏”更准确。
theological_decisions:
- issue: “主的面”的习语含义
  choice: 正文译作“主垂顾”，脚注保留直译
  alternative: 主的面；主的恩宠；主的临在
  rationale: 逐字译为“恳求主的面”在现代汉语中不易理解；“主垂顾”传达寻求主恩慈眷顾的意思，又不把它缩减为抽象的“恩宠”。脚注让读者看到原文意象。
- issue: τοῦ ἀποστρέψαι中转离行为的施事关系
  choice: 译作“好叫各人离弃”，保留目的关系，不明确断定是神使人转离还是人自己转离
  alternative: 使各人离弃；让各人回转离开
  rationale: 希腊语不定式结构可在所求目的与结果之间留有张力。采用“好叫”既呈现祈求与悔改之间的关联，也避免在神的施行与人的回应之间作超出文本的教义性限定。
- issue: 邪恶思想的内在来源
  choice: 保留“邪恶内心的意念”这一心灵意象
  alternative: 邪恶头脑的想法；恶心所谋划的事
  rationale: 原文把νοήματα与καρδία相连，强调意念出于人的内在道德中心。保留“内心”避免将其仅仅心理化或理智化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“恳求主垂顾”符合祷告与悔罪语境；“各人……自己”自然表达希腊语单数分配词与复数所有格的组合。正文避免生硬直译，同时以脚注保留“主的面”及νόημα的词义幅度。
