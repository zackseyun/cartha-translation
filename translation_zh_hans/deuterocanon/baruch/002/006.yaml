base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/006.yaml
  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
translation:
  language: zh_hans
  text: 公义[a]归于主——我们的上帝；羞愧却归于我们和我们的祖先，正如今日所见。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希腊文δικαιοσύνη可指公义，也可指正义；此处保留“公义”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“面容的羞耻”，是指公开显露的耻辱或蒙羞。
    reason: cultural_note
lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν
  choice: 归于主我们的上帝
  rationale: 希腊文以与格表达归属，中文用“归于”保留判断句的庄重语气和归属含义；“主我们的上帝”也贴近原文词序。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: 此处既可涉及正直，也带有公正的内涵；“公义”在认罪语境中较完整地表达上帝行事正确、无可指摘，而不把意义缩窄为司法性的“正义”。
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: 但我们和我们的祖先
  rationale: 保留δέ的鲜明对比，也保留当代群体与祖先共同承担羞辱的明确表述。
- source_word: ἡ αἰσχύνη τῶν προσώπων
  choice: 满面羞愧
  rationale: 原文字面为“脸面的羞耻”，属闪语式表达；“满面羞愧”在现代汉语中自然，并保留羞耻显于人前、蒙受耻辱的形象。
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: 正如今日一样
  rationale: 保留原文指向当前可见处境的公式化表达，不增添“显而易见”等解释性内容。
theological_decisions:
- issue: δικαιοσύνη用于上帝时的含义
  choice: 以“公义”表达上帝是正直且在此事上全然正确，与百姓及其祖先的羞愧相对
  alternative: 译作“正义”，侧重上帝施行审判的公正
  rationale: 上下文是认罪，重点在承认上帝为义、百姓有罪；“公义”保留道德正直与司法公正之间的语义张力，避免只理解为惩罚性的正义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“满面羞愧”使希腊文的脸面意象在中文中自然呈现；分号体现原文中上帝的公义与人的羞愧之间的对照。
