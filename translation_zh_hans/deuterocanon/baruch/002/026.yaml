base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/026.yaml
  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
translation:
  language: zh_hans
  text: 你使那座你的名被称在其上的殿成了今天这个样子[a]，是因以色列家和犹大家的邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用闪语式表达，直译为“你的名被称在这殿之上”；这是表示归属或奉献的命名公式，也可较自然地译作“承载你名的殿”。
    reason: 说明命名公式的字面结构及较自然的译法，同时保留其归属与奉献含义。
lexical_decisions:
- source_word: ἔθηκας
  choice: 你使……成了
  rationale: τίθημι 的简单过去时在这里表示造成某种结果，后接“成了今天这个样子”，既符合希腊文句法，也比直译为“放置”自然。
- source_word: τὸν οἶκον
  choice: 殿
  rationale: οἶκος 字面是“房屋”，但本节明确指耶路撒冷圣殿；现代汉语用“殿”能清楚表达所指，同时保留宗教语境中的庄重感。
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: 那座被称为你名下的
  rationale: 希腊文保留了闪语式的“名字被称在其上”表达，表示归属、奉献或与上帝之名相联。“被称为你名下”在现代汉语中较为自然，并保留被动形式及归属含义；脚注交代其字面结构。
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: 成了今天这个样子
  rationale: 这是圣经常见表达，意为达到如今显而易见的境况。结合 ἔθηκας 译作结果句，准确而自然。
- source_word: διὰ πονηρίαν
  choice: 这是因为……的邪恶
  rationale: διά 在此表示原因；πονηρία 指道德上的恶与败坏，“邪恶”保留忏悔语境中的道德分量。
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: 以色列家和犹大家
  rationale: 保留两次“家”，呈现原文关于整个盟约群体的共同、整体性称呼，不简化为单纯的地域或族名。
theological_decisions:
- issue: “殿”与上帝之名的关系
  choice: 译为“被称为你名下的殿”，表达圣殿归于上帝并与他的名相联。
  alternative: 可译为“承载你名的殿”或“你的名被称在其上的殿”。
  rationale: 原文的命名公式可能兼有归属、奉献和临在方面的意味。正文保留较宽泛的归属表达，不把它限定为某一种关于神圣临在的理论；脚注则保存原文形式。
- issue: 圣殿现状的原因与施动者
  choice: 保留“你使……成了”与“因为……邪恶”并置。
  alternative: 可弱化为“这殿因……而成了今天这个样子”。
  rationale: 原文既直接以第二人称称上帝为施动者，也指出以色列家和犹大家的邪恶是原因。译文保留这种神的审判与人的责任并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿”明确上下文中的圣殿；“成了今天这个样子”自然呈现其当前受毁的境况。句式保留上帝作为施动者、百姓邪恶作为原因的双重强调。
