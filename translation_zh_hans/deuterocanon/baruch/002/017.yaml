base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/017.yaml
  text: 'Open your eyes and see: it is not the dead in Hades, whose breath has been taken from their inward parts, who will give glory and righteousness to the Lord;'
translation:
  language: zh_hans
  text: 求你睁开眼睛察看：那些在阴间的死者，就是气息[a]已从他们里面被取去的人，不会将荣耀和公义[b]归给主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”。
    reason: 保留πνεῦμα在生命气息与灵之间的词义歧义。
  - marker: b
    text: “公义”或译“公正”。
    reason: 保留δικαίωμα在此处可能强调主之公正的含义。
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  choice: 求你睁眼察看
  rationale: 两个单数命令式直译为“睁眼察看”；结合祷告语境，以“求你”自然表达向主恳求的语气，但不削弱命令式的迫切感。
- source_word: οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ
  choice: 在阴间的死人……不会
  rationale: “阴间”保留ᾅδης作为死者所在领域的含义，避免缩窄为坟墓；用“不会”与后面的将来时谓语衔接，形成自然汉语句式。
- source_word: ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν
  choice: 他们的气息已……被取走
  rationale: πνεῦμα在死亡语境中可指维系生命的气息，也可指灵；正文采用“气息”，并以脚注保留“灵”的可能。
- source_word: ἀπὸ τῶν σπλάγχνων αὐτῶν
  choice: 从五脏六腑中
  rationale: σπλάγχνα具体指身体内部的脏腑；“五脏六腑”是现代汉语可懂且保留具体身体意象的表达。
- source_word: δώσουσιν δόξαν καὶ δικαίωμα τῷ κυρίῳ
  choice: 不会将荣耀和公义归给主
  rationale: δώσουσιν保留将来意义；“归给”比机械的“给”更符合汉语宗教语境。δόξα译为“荣耀”；δικαίωμα在此指承认主的正直或公正，正文用“公义”，脚注保留“公正”。
theological_decisions:
- issue: 死亡语境中πνεῦμα的含义
  choice: 气息
  alternative: 灵
  rationale: 上下文强调死亡以及生命从身体内部离去，“气息”较贴合生命气息的意象；但“灵”在词义和神学上同样可能，故以脚注保留歧义。
- issue: 归给主的δικαίωμα所指
  choice: 公义
  alternative: 公正
  rationale: 该词可表示正直、公正的判定或应得之权；此处与“荣耀”并列，可能指承认主的公义。正文保留传统神学语域，脚注说明“公正”这一可行译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“求你睁眼察看”符合祷告语境；“阴间”维持经文中的死者领域概念。两个脚注标记置于相关句末，正文中的[a]对应“气息”，[b]对应“公义”。
