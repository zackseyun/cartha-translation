  text: which the Lord spoke against us—all these evils that came upon us[a].
translation:
  language: zh_hans
  text: 主所说要降在我们身上的这一切灾祸[a]，都临到我们身上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“祸患”或“恶事”。这里的希腊词指临到百姓的有害之事，即审判所带来的灾难。
    reason: 说明 κακά 的语义范围，并保留较直译的选择。
lexical_decisions:
- source_word: ἐλάλησεν
  choice: 所说
  rationale: 采用常用而庄重的表达，保留“主曾说出、宣告”的基本意义，不强化为正式颁令。
- source_word: Κύριος
  choice: 主
  rationale: 希腊文本为 Κύριος；译作“主”，既忠于现有原文，也不反向引入希伯来神名的排印形式。
- source_word: ἐφ᾽ ἡμᾶς（第一次）
  choice: 要降在我们身上
  rationale: 在审判语境中，ἐπί 与“说”连用指向针对他们所宣告的事；汉语补出“要降”，使其与后面的“临到”自然衔接，同时保留审判指向。
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: 一切灾祸
  rationale: κακά 在此指临到百姓的有害事件或审判性灾难。“灾祸”符合上下文，也避免现代汉语“一切恶事”被误解为道德恶行。
- source_word: ἦλθεν ἐφ᾽ ἡμᾶς
  choice: 如今都临到我们身上了
  rationale: “临到……身上”自然传达 ἔρχομαι 与 ἐπί 的组合；“都”对应 πάντα，“了”表明所宣告之事已经发生。“如今”明确前后时态关系，但不改变事件内容。
theological_decisions:
- issue: τὰ κακά 应按道德意义译为“恶事”，还是按审判处境译为“灾祸”
  choice: 正文译作“一切灾祸”
  alternative: 一切恶事；一切祸患
  rationale: 该词本身可指恶事，也可指造成伤害的灾难；本句所说的是主预先宣告、后来临到百姓的审判性事件。译作“灾祸”符合此处语义，但脚注保留较形式对应的可能译法，以免掩盖原词的语义张力。
- issue: 第一次 ἐφ᾽ ἡμᾶς 是“针对我们”还是“降在我们身上”
  choice: 结合后半句译作“要降在我们身上”
  alternative: 针对我们；论到我们
  rationale: “针对我们”较贴近敌对或审判色彩，但汉语中“主针对我们所说的灾祸”略显生硬；“要降在我们身上”清楚表达这是向他们宣告的审判，又与第二次 ἐφ᾽ ἡμᾶς 形成呼应。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。为使独立经节在汉语中语义完整，将希腊文的关系从句和同位结构整合为“所说要降下的……如今都临到”的句式，同时保留“主的宣告—灾祸临到”的对应关系。
