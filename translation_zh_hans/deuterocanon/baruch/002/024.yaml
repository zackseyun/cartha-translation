base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: zh_hans
  text: 我们没有听从你的声音，去服事巴比伦王[a]；你成就了你借着你仆人众先知所说的话[b]：我们君王的骸骨和我们祖先的骸骨，将从它们所在的地方被带出来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从你的声音”也可译作“听你的声音”或“顺服你的声音”。希腊文沿用“听”的表达，语境中含有服从之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“借着你仆人众先知的手所说的话”；“借着……的手”是表示媒介或代理的惯用说法。
    reason: lexical_alternative
  - marker: c
    text: “它们所在的地方”在语境中指骸骨原来安放或埋葬之处；希腊文只说“它们的地方”，没有明说“坟墓”，也没有说明以何种方式移出。
    reason: clarification
lexical_decisions:
- source_word: ἠκούσαμεν τῆς φωνῆς σου
  choice: 没有听从你的声音
  rationale: 保留希腊文“听声音”的意象，同时用“听从”自然表达语境中不肯顺服之意。
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  choice: 去服事巴比伦王
  rationale: ἐργάζομαι在此与人称间接受格连用，指向为巴比伦王效力、臣服于他；“服事”比单纯“工作”更符合历史语境。
- source_word: ἔστησας τοὺς λόγους σου
  choice: 你便使……所说的话应验了
  rationale: ἵστημι本可指使之成立、确立；在预告的审判已经实现这一语境中，“使……应验”自然传达其话得以确立并成为事实。
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  choice: 借着你的仆人众先知之手
  rationale: 保留“借……之手”的媒介性表达，并明确先知是上帝传话的仆人。
- source_word: παίδων σου
  choice: 你的仆人
  rationale: παῖς在上帝与先知的关系中是受差遣者的传统称谓；“仆人”比“孩子”合乎语境，也不额外强化为社会身份意义上的“奴隶”。
- source_word: τοῦ ἐξενεχθῆναι
  choice: 要……被挖出来
  rationale: 该被动不定式说明先知之言的内容或结果。结合对象是埋葬的骸骨，“被挖出来”在中文中比笼统的“被带出来”更清楚自然，但动作本身仍由语境推知。
- source_word: τὰ ὀστᾶ
  choice: 骸骨
  rationale: 直接保留骨骸的具体所指，不泛化为“遗体”或“遗骸”。
- source_word: ἐκ τοῦ τόπου αὐτῶν
  choice: 从原处
  rationale: 希腊文只说“从它们的地方”，上下文指骸骨原来安放或埋葬之处；正文避免直接增译为“坟墓”，并以脚注说明。
theological_decisions:
- issue: 首句是否直接译成不顺服
  choice: 没有听从你的声音
  alternative: 没有顺服你的声音／没有听你的声音
  rationale: 经文确实涉及悖逆，但希腊文保留听觉意象。“听从”既保有该意象，也自然包含遵行和顺服的语义。
- issue: 如何表达上帝与先知所预告审判的实现
  choice: 你便使……所说的话应验了
  alternative: 你确立了你的话／你实行了你的话
  rationale: 这里强调上帝使先知传达的警告成为事实。“应验”表达预言实现，不额外引入特定教派解释。
- issue: 是否把骸骨所在之处明说为坟墓
  choice: 正文作“原处”，脚注说明为安葬之处
  alternative: 从坟墓中／从安葬之处
  rationale: 上下文清楚涉及安葬，但希腊文仅用τόπος“地方”。将解释置于脚注，可保留原文措辞的概括性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听从你的声音”保留经文的听觉意象；“服事”呈现向巴比伦王效力或臣服的历史语境；“众先知”避免将多个先知误读为一个复合称谓。句中用冒号引出应验之言的内容，使长句层次清楚。所有脚注标记均置于正文对应位置。
