lexical_decisions:
- source_word: τοῦ φαγείν ἡμᾶς
  choice: 以致我们……吃
  rationale: τοῦ加不定式构成从属结构；结合此处所给片段，用“以致”保留其结果意味，而不补成独立句。ἡμᾶς明确译作“我们”，避免遗漏原文成分。
- source_word: ἄνθρωπον
  choice: 各人
  rationale: 该词在两个并列短语中均为单数，具有逐一、分配性的表达效果；“各人”既保留单数分配意味，也比重复“一个人”更符合现代汉语。
- source_word: σάρκας
  choice: 肉
  rationale: 这里指身体的肉，语义具体而惨烈；译作“肉”最直接，不作隐喻化或弱化处理。
- source_word: υἱοῦ αὐτοῦ
  choice: 自己儿子的
  rationale: αὐτοῦ表达所属关系；在“各人”的分配结构中，现代汉语用“自己”自然地指回各自的儿子，并非另加“亲生”等原文没有的限定。
- source_word: θυγατρὸς αὐτοῦ
  choice: 自己女儿的
  rationale: 与前一并列项相同，“自己”自然表达各人和各自女儿之间的所属关系，同时保留两个并列成分。
theological_decisions:
- issue: 所给希腊文是从属片段，并非完整句子
  choice: 译为以“以致”起首的从属结构，不从上下文补写主句
  alternative: 根据《巴录书》上下文重构为完整句子
  rationale: 原文优先要求只翻译所提供的希腊文证据；保留不完整结构可避免把未提供的上下文措辞带入正文。
- issue: ἄνθρωπον的分配性与性别表达
  choice: 译作“各人”
  alternative: 译作“一个男人”或泛化为“人们”
  rationale: 上下文描写父母吃各自儿女的肉；“各人”保留单数分配结构，又不把ἄνθρωπος不必要地收窄为成年男性。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。“吃……的肉”保留原文令人震骇的字面意义；两个“各人”有意对应希腊文重复的ἄνθρωπον，并呈现逐一分配的语气。
