base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/005.yaml
  text: and they became beneath and not above[b][a], because we sinned against the Lord our God by not listening to his voice.
translation:
  language: zh_hans
  text: 他们就居下不居上[a]，因为我们得罪了主我们的上帝，没有听从他的声音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在下不在上”。原文以空间上的上下对比，也表达地位低下或受辱。
    reason: lexical_alternative
  - marker: b
    text: “听从他的声音”是圣经惯用语，含有服从、遵行的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθησαν
  choice: 他们就落在
  rationale: 该不定过去时在此表示进入并处于一种结果状态；“落在”自然传达地位降低，同时保留动词的变化意味。
- source_word: ὑποκάτω καὶ οὐκ ἐπάνω
  choice: 在下面，不在上面
  rationale: 保留原文直接的空间对照及其象征的卑下地位，也呼应盟约咒诅的表达。
- source_word: ἡμάρτομεν
  choice: 我们得罪了
  rationale: 在以主我们的上帝为对象时，“得罪了”准确表达向上帝犯罪，比泛化为“做错了”更有分量。
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: 主我们的上帝
  rationale: 依照希腊语词序保留“主”与“我们的上帝”的称谓关系，并用现代汉语可理解的表达呈现。
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: 没有听从
  rationale: 该结构说明犯罪所体现的方式或方面；“听从”既保留听的意象，也自然包含服从之意。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: 他的声音
  rationale: 直译 φωνή，以保留“听从他的声音”这一圣经惯用语，而不简化成“服从他”。
theological_decisions:
- issue: “在下面，不在上面”的盟约咒诅意象
  choice: 他们就落在下面，不在上面
  alternative: 他们就居下不居上；他们就受屈辱
  rationale: 原文为第三人称复数，并使用空间方位表达地位降低。正文保留这一张力，不将其解释性改写为一般性的“受屈辱”。
- issue: “听他的声音”与“服从他”的关系
  choice: 没有听从他的声音
  alternative: 没有服从他；没有听他的声音
  rationale: “听从”在自然汉语中兼具聆听和遵行的含义，而“他的声音”保留原文明确的声音意象与盟约语言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“落在下面，不在上面”刻意保留原文略显突出的上下比喻；“主我们的上帝”保持源文称谓结构。所有脚注标记均置于正文对应短语之后。
