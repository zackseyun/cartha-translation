  text: so that all the earth may know that you[a], Lord, are our God, because your name has been called upon Israel and upon his offspring.
translation:
  language: zh_hans
  text: 好让全地都知道，主啊，你是我们的上帝，因为你的名已经被称在以色列和他的后裔身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列和他的后裔是奉你的名被称的。”希腊语这一惯用语表达他们归属上帝，并与他认同。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῷ
  choice: 好让……都知道
  rationale: ἵνα加不定过去时虚拟语气在此表达目的或结果；“好让”自然地保留其目的意味。
- source_word: πᾶσα ἡ γῆ
  choice: 全地
  rationale: γῆ可指“地”或“土地”；这里所说的是普世都认出以色列的上帝，因此采用范围较广、同时保留原文简洁表达的“全地”。
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: 主啊，你是我们的上帝
  rationale: 按句法将Κύριος理解为呼语，并以现代汉语自然表达σὺ……ὁ θεὸς ἡμῶν所强调的“你是我们的上帝”。
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: 你的名已经称在……身上
  rationale: 尽量保留“名被称在某人身上”这一希腊语圣经惯用语，使其所属、认同及公开归名于上帝的含义不被单一意译完全取代；脚注列出较明白的译法。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 采用该专名通行的现代汉语译法。
- source_word: τὸ γένος αὐτοῦ
  choice: 他的后裔
  rationale: γένος在这里指血统延续的后代；αὐτοῦ为阳性单数，最自然地回指“以色列”，故保留“他的”，不改写为复数。
theological_decisions:
- issue: 上帝的名“称在”一个群体身上的圣经惯用语
  choice: 正文保留“你的名已经称在以色列和他的后裔身上”
  alternative: “你的名已经在以色列和他的后裔之上被宣告”或“以色列和他的后裔归在你的名下”
  rationale: 这一表达兼有归属上帝、与上帝公开认同以及以上帝之名命名的意味。正文保留原文张力，不把它限定为单一解释，并用脚注帮助普通读者理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“主啊”体现原文呼语；“全地”简洁保留普世范围。“称在……身上”略带圣经惯用语色彩，相关含义由脚注说明。
