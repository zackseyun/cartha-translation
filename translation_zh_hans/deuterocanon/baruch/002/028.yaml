  text: just as you spoke by the hand of your servant Moses[a], on the day when you commanded him to write your law before the sons of Israel, saying[b],
translation:
  language: zh_hans
  text: 正如你借你的仆人摩西[a]所说的：在你吩咐他在以色列子孙[b]面前写下你的律法的那一天，你说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借……所说”原文直译为“借……的手所说”，是圣经中表示“通过某人”或“以某人为媒介”的惯用说法。
    reason: cultural_note
  - marker: b
    text: 原文直译为“以色列的儿子们”；“以色列子孙”是中文经文中相应的传统称谓，指以色列的后裔群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ
  choice: 正如
  rationale: 表达与前后所述之事的对应关系，既贴合原文，也符合现代汉语经文语体。
- source_word: ἐλάλησας
  choice: 你曾……所说的
  rationale: 传达不定过去时所指的既成言说，并以汉语关系结构自然连接后续时间说明。
- source_word: ἐν χειρὶ
  choice: 借……
  rationale: 这是表示中介施行者的圣经惯用语；汉语译作“借”自然清楚，脚注保留其字面意象。
- source_word: παιδός σου
  choice: 你的仆人
  rationale: παῖς在此指受上帝差遣的摩西；“仆人”保留尊荣性的服事身份，不误译为孩子或过度强调奴役身份。
- source_word: ἐν ἡμέρᾳ
  choice: 那一天
  rationale: 保留明确的时间表达，并自然引出上帝当日的吩咐。
- source_word: ἐντειλαμένου σου αὐτῷ
  choice: 你吩咐他
  rationale: 将属格独立结构自然译为时间背景中的完整分句。
- source_word: γράψαι
  choice: 写下
  rationale: 直接表达书写行为；“下”体现记录成文而不增添原文没有的技术含义。
- source_word: τὸν νόμον σου
  choice: 你的律法
  rationale: 在摩西之约的语境中，νόμος译为“律法”最准确，也最易识别。
- source_word: ἐναντίον
  choice: 在……面前
  rationale: 此处表示当着某些人的面、在其面前，而不是“敌对”。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列子孙
  rationale: 这是现代中文圣经语体中自然而庄重的群体称谓；既反映字面上的亲属后裔表达，也可指以色列民整体。
- source_word: λέγων
  choice: 说
  rationale: 保留引出下一节引语的分词功能，并用冒号明确句子尚未结束。
theological_decisions:
- issue: 摩西称谓παῖς的理解
  choice: 你的仆人
  alternative: 你的孩子；你的奴仆
  rationale: 语境强调摩西作为上帝所差遣、传达律法的忠仆；“仆人”保留其尊荣和委任意味，同时避免误解为亲子关系或仅强调奴役地位。
- issue: υἱῶν Ἰσραήλ的群体范围
  choice: 以色列子孙
  alternative: 以色列众子；以色列人
  rationale: 原文使用阳性复数υἱῶν，但这一固定民族称谓可指雅各（以色列）的后裔群体。“以色列子孙”保留亲属后裔意象，又不武断地把所指范围限定为成年男性。
- issue: “借手”这一中介表达
  choice: 正文译为“借你的仆人摩西”，脚注说明字面形式
  alternative: 借你的仆人摩西的手；通过你的仆人摩西
  rationale: 此处陈述上帝以摩西为传话中介，并非讨论启示方式的技术性定义；自然译出中介关系，同时保留原文字面信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正如……所说的”保留原文承接上文的比较关系；以分号和冒号梳理较长的希腊句法。正文避免生硬照译“借……的手”，但在脚注中保存该圣经惯用意象。“以色列子孙”兼顾源语形式、传统经文语感和群体所指。
