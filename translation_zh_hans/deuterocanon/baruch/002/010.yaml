  text: And we did not listen to his voice[b][a], to walk in the commandments of the Lord that he set before us.
translation:
  language: zh_hans
  text: 我们没有听从他的声音[a]，也没有行在主摆在我们面前的诫命[b]中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”原文直译为“听他的声音”；在圣经用语中可指留意并遵从。
    reason: lexical_alternative
  - marker: b
    text: 原文近于“赐在我们面前”；指主把这些诫命陈明在我们面前。
    reason: lexical_alternative
  - marker: c
    text: “行在……中”原文为“行走在……中”，指按诫命而行。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς αὐτοῦ
  choice: 没有听从他的声音
  rationale: ἀκούω在这里不只是听见，也含有听取、留意之意；后接关于遵行诫命的内容，表明重点在于未曾听从。保留“声音”则保存原文直接而具人格性的圣经表达。
- source_word: πορεύεσθαι
  choice: 遵行
  rationale: πορεύομαι本义为“行走”，在伦理和盟约语境中指按某种准则行事。现代汉语说“遵行诫命”自然清楚，并保留行为实践的含义；脚注说明其字面意象。
- source_word: τοῖς προστάγμασιν Κυρίου
  choice: 主的诫命
  rationale: πρόσταγμα指命令、训令；在此盟约语境中译作“诫命”庄重自然。Κύριος译作“主”。
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: 摆在我们面前的
  rationale: 原文近于“赐在我们面前”，表达这些诫命已被明确陈明给百姓。“摆在我们面前”保留空间意象，同时符合现代汉语。
theological_decisions:
- issue: ἠκούσαμεν是单指听见，还是含有服从之意
  choice: 没有听从他的声音
  alternative: 没有听见他的声音；没有顺服他
  rationale: 上下文指向对诫命的回应。“听从”既保留听觉意象，也传达听而接受的伦理要求，却不像“顺服”那样完全消除原文比喻。
- issue: πορεύεσθαι的道德行为意象如何表达
  choice: 遵行主……的诫命
  alternative: 行在主的诫命中；照主的诫命生活
  rationale: “遵行诫命”是自然、庄重且普通读者易懂的现代汉语。原文“行走”的意象则在脚注中保存，避免正文生硬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“听从他的声音”有意保留原文的圣经意象；“遵行诫命”避免直译成不自然的“行走在诫命中”。正文中的脚注标记按对应内容依次排列。
