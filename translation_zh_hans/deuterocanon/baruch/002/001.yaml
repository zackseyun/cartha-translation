base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: zh_hans
  text: 主使他所说的、针对我们和审判以色列的审判官、我们的君王、我们的首领，以及以色列和犹大人民的话得以应验。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人民”直译为“人”；希腊文用单数的人称名词作集合性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: 使……实现了
  rationale: ἵστημι在此表示使先前所说的话站立、生效；上下文是宣告的审判已经实施，因此“使……实现了”既保留成就之意，也避免仅理解为口头证实。
- source_word: Κύριος
  choice: 主
  rationale: 希腊文本作Κύριος，并未明写神名；“主”是自然、庄重的对应表达。
- source_word: τὸν λόγον αὐτοῦ
  choice: 他所说……的话
  rationale: λόγος指主先前宣告的警告或审判；“话”保留原词的广度，不把它过度限定为“判决”或“命令”。
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: 所说攻击我们的话
  rationale: 在惩罚已经实现的语境中，ἐπί加宾格具有不利、敌对的指向，译作“攻击我们”比单纯的“论到我们”更合适。
- source_word: δικαστάς / τοὺς δικάσαντας τὸν Ἰσραήλ
  choice: 那些审判以色列的审判官
  rationale: 保留δικαστής与δικάζω的词根呼应，并与后面的“首领”区分。
- source_word: τοὺς ἄρχοντας
  choice: 我们的首领
  rationale: ἄρχοντες泛指掌权、治理的人；“首领”自然且保持政治治理含义。
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: 以色列和犹大的人民
  rationale: 单数ἄνθρωπον在此具有集合用法，概括以色列和犹大的人。现代汉语用“人民”能自然表达集体意义；脚注保留希腊文压缩且为单数的形式特点。
theological_decisions:
- issue: 主所说之话在审判语境中的效力
  choice: 译为主“使……实现了”，表达先前宣告的审判已经生效。
  alternative: 译为“坚立了”或“证实了”他的话。
  rationale: 一连串“临到/攻击”的对象显示这里不是抽象地确认言语，而是所宣告的惩罚已经施行；同时不增添原文没有说明的具体灾祸。
- issue: ἄνθρωπον的集合意义与性别形式
  choice: 正文译作“人民”。
  alternative: 较贴形式地译作“人”或“男丁”。
  rationale: 这里的阳性单数名词处于群体名单末尾，最自然地作集合性理解；译成“男丁”会把语义不必要地限于男性，译成单数“人”则在现代汉语中容易误解。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“临到”承接希腊文反复出现的ἐπί，避免中文连续多次使用“攻击”造成累赘；分号帮助读者辨明“这话”所涉及的各组对象。
