base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/025.yaml
  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
translation:
  language: zh_hans
  text: 看哪，他们被抛在外面，暴露在白昼的炎热和黑夜的严寒中；他们在惨痛的苦难中，因饥荒、刀剑和流放[a]而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遣送”或“放逐”；希腊文直译所指的是“送走”。
    reason: 保留ἀποστολή的字面语义及其在本语境中的可译范围。
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留引人注意的感叹语气；“看哪”庄重而仍为现代汉语读者所熟悉。
- source_word: ἐξεριμμένα
  choice: 被抛在外面，暴露于
  rationale: 该词既有被抛出去的被动含义，也在本语境中形成暴露于昼夜酷烈天气的画面；合并表达可避免只译“暴露”而丢失动作意象。
- source_word: τῷ καύματι τῆς ἡμέρας
  choice: 白昼的炎热
  rationale: 贴近原文，保留与“黑夜的严寒”相对的平行结构。
- source_word: τῷ παγετῷ τῆς νυκτός
  choice: 黑夜的严寒
  rationale: παγετός可指霜冻或冰寒；此处用“严寒”自然表达其强度，并与白昼炎热形成对照。
- source_word: ἐν πόνοις πονηροῖς
  choice: 在惨痛的苦难中
  rationale: 表达痛苦的严重性，同时保留原文“苦难/痛楚”的语义，不强化为特定形式的刑罚。
- source_word: ἐν λιμῷ
  choice: 在饥荒中
  rationale: 保留灾祸类别及原文介词结构。
- source_word: ἐν ῥομφαίᾳ
  choice: 在刀剑中
  rationale: 保留刀剑这一具体意象，按汉语可理解为死于杀戮或战乱。
- source_word: ἐν ἀποστολῇ
  choice: 在流放中
  rationale: 在审判与被逐离本土的语境中，“流放”自然且准确；原词较字面的“遣送、被送走”含义另见脚注。
theological_decisions:
- issue: 审判语境中ἀποστολή的含义
  choice: 流放
  alternative: 遣送、放逐、被送走
  rationale: “流放”传达被迫离开本土的历史与神学处境，却不额外限定其具体方式；脚注保留原词较宽的字面范围。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留经文的呼告力度；分号维持原句两部分的推进。末句重复“中”以反映希腊文三个ἐν短语的并列，并避免把“流放”过度解释成直接致死手段。
