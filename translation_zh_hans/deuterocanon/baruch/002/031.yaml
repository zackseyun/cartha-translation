  yaml_path: translation/deuterocanon/baruch/002/031.yaml
  text: And they will know that I am the Lord their God[a]. And I will give them a heart and ears that hear,
translation:
  language: zh_hans
  text: 他们将知道，我是主，是他们的上帝。我要赐给他们一颗心和能听见的耳朵[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听着的耳朵。”希腊文直译为“听着的耳朵”，指能听见、留心聆听的耳朵，也可含有作出响应的意味。
    reason: 保留ἀκούοντα“听着／听见”的基本意象，并避免将其直接限定为“听从”。
lexical_decisions:
- source_word: γνώσονται
  choice: 他们就会知道
  rationale: 译出将来时，并保留“认识、确认”的宽广含义；“知道”在现代汉语中自然，也不把它局限为纯理智上的认知。
- source_word: Κύριος
  choice: 主
  rationale: 这里是指上帝的称号；“主”是简洁、庄重且通行的对应译法。
- source_word: ὁ θεὸς αὐτῶν
  choice: 他们的上帝
  rationale: 用自然的汉语所属结构表达原文，也保留上帝与他们之间的关系性语言。
- source_word: δώσω
  choice: 我要赐给
  rationale: 表达简单将来时；“赐给”适合上帝作为施予者的语境，庄重而不古奥。
- source_word: καρδίαν
  choice: 一颗心
  rationale: 保留原文具体的身体意象，不抽象改写为“心思”“悟性”或“内在性情”。
- source_word: ὦτα ἀκούοντα
  choice: 能听的耳朵
  rationale: 贴近原文“正在听／会听的耳朵”，同时以自然汉语表达耳朵被赋予真实听闻和响应能力的意象。
theological_decisions:
- issue: “一颗心和能听的耳朵”所表达的人内在更新
  choice: 保留“心”和“耳朵”的具体意象
  alternative: 译作“悟性和领受能力”或“明白的心和顺从的耳朵”
  rationale: 原文并未把这些意象明确解释为悟性、接受力或顺从；直译其身体意象，可保留内在改变、听见与响应之间的张力。
- issue: “我是主，是他们的上帝”的关系表达
  choice: 将Κύριος与ὁ θεὸς αὐτῶν译为并列说明：“我是主，是他们的上帝”
  alternative: “我是主他们的上帝”
  rationale: 补出第二个“是”符合现代汉语句法，并清楚保留“主”这一称号和“他们的上帝”这一关系性表述，而不增添额外神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“赐给”保持经文语体而不过分文言；句末逗号依原文保留，表明本句在后文继续。
