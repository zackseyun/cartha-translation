  text: After this he appeared on the earth[a], and lived among men.
translation:
  language: zh_hans
  text: 此后，在地上显现[a]，并在人间与人相处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“被看见”；“在人间与人相处”也可译作“与人交往”。
    reason: 保留ὤφθη较贴近语态的译法，以及συνανεστράφη所含“交往、相处”的词义可能。
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: 此后
  rationale: 明确表达时间上的先后次序，简洁自然，并保留原文“在这以后”的意思。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 按上下文指尘世、地上领域；“在地上”既贴近原文，也不把它限缩为某一片土地。
- source_word: ὤφθη
  choice: 显现
  rationale: 该动词形式可直译为“被看见”，也可惯用地表达为“显现”。正文采用较自然的“显现”，脚注保留形式更贴近原文的译法。
- source_word: ἐν τοῖς ἀνθρώποις
  choice: 与世人一同
  rationale: ἀνθρώποις泛指人类，并非专指男性；“世人”以自然、庄重的现代汉语表达这一普遍含义。
- source_word: συνανεστράφη
  choice: 生活
  rationale: 该词表示在一群人中共同生活、交往或活动；与“与世人一同”组合，传达持续置身人群中的意思，又避免加入原文没有明说的神学术语。
theological_decisions:
- issue: 本节省略主语，而上文所指对象与“智慧”的关系在释经传统中存在张力
  choice: 译作“他”，承接上文的阳性指称，不在正文中进一步确认其身份
  alternative: 译作“它”，使之直接指向语法上为阴性的“智慧”；或意译成明确的基督论陈述
  rationale: 本节两个希腊语动词本身不标示性别，但其省略的主语须由前文补出。用“他”承接上文，可保留篇章关联及历史上的神学张力，同时不把该句改写成超出原文的教义判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“世人”明确涵盖所有人，不沿用容易被误解为仅指男性的表达；句式简洁，并保留原文没有明说主语身份所形成的含蓄性。
