base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/026.yaml
  text: There the giants were born[a], those renowned from the beginning, great in size, skilled in war.
translation:
  language: zh_hans
  text: 在那里诞生了那些自古以来就有名的巨人[a]；他们身材高大，善于争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自古以来就有名的”也可译作“从起初就出现的有名之人”。希腊语原句结构较为紧缩。
    reason: 保留 ἀπʼ ἀρχῆς γενόμενοι 的句法与词义歧义。
lexical_decisions:
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 承接上文所指的地点，用现代汉语的处所指示语自然表达。
- source_word: ἐγεννήθησαν
  choice: 诞生了
  rationale: 保留 γεννάω 的出生意象；“诞生”庄重而不古奥，也不泛化为“出现”。
- source_word: οἱ γίγαντες
  choice: 巨人
  rationale: 直接传达 γίγαντες 的通常词义，不将其特定化为某一神话群体或《创世记》中的专名。
- source_word: οἱ ὀνομαστοὶ ἀπʼ ἀρχῆς γενόμενοι
  choice: 那些自古以来就有名的
  rationale: 原文结构紧缩；正文将 ὀνομαστοί 的“有名”与 ἀπ’ ἀρχῆς 的远古时间含义自然结合，同时以脚注保留 γενόμενοι 的另一种句法理解。
- source_word: εὐμεγέθεις
  choice: 身材高大
  rationale: 明确表达其巨大的身体尺寸，比笼统的“伟大”更符合上下文。
- source_word: ἐπιστάμενοι πόλεμον
  choice: 善于争战
  rationale: ἐπίσταμαι 在此表示懂得、擅长；“善于争战”简洁地表达作战能力，又保持经文语体。
theological_decisions:
- issue: “巨人”的身份及其经文间关联
  choice: 保留“巨人”，不进一步说明其身份
  alternative: 译作“勇士”或直接认定为“拿非利人”
  rationale: 希腊文本明确使用 γίγαντες，却没有在本节中界定其与神话人物或《创世记》6章人物的关系；直译可避免消解这种开放性。
- issue: ἀπʼ ἀρχῆς γενόμενοι 的修饰关系
  choice: 正文译为“自古以来就有名的”
  alternative: 译为“从起初就出现的有名之人”
  rationale: 希腊语表达较为紧缩，既可突出其远古声名，也可将时间短语与“出现、存在”联系起来；正文采用自然汉语，脚注保存另一理解。
translation_notes:
  register: 采用现代、庄重而清楚的书面语。“诞生”“身材高大”“善于争战”便于普通读者理解；分号呈现后三项描述与主句的关系。
