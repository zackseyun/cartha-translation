  text: This is our God[a]; no other will be reckoned beside him.
translation:
  language: zh_hans
  text: 这就是我们的上帝；没有别的会被算作与他并列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有别的能与他相提并论。”
    reason: 以较自然的汉语表达比较关系；正文则保留λογισθήσεται的将来被动含义，以及πρὸς αὐτόν所表达的相对、并列关系。
lexical_decisions:
- source_word: οὗτος
  choice: 这就是
  rationale: 指示代词在此与“我们的上帝”构成判断句；“这就是”符合现代汉语表达，也保留原文的指示意味。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝
  rationale: 直接保留所有关系和盟约语感；“我们的上帝”自然、庄重。
- source_word: οὐ λογισθήσεται
  choice: 没有……能……相提并论
  rationale: λογίζομαι的将来被动式有“被算作、被视为”之意；结合后面的比较关系，译为“能与……相提并论”自然呈现其被动评价和比较含义。
- source_word: ἕτερος
  choice: 别的
  rationale: 表达排他性，却不增补原文未明说的“神”字。
- source_word: πρὸς αὐτόν
  choice: 与他相提并论
  rationale: πρός在此表示相对于、与之比较的关系；此译法比字面的“在他旁边”更符合现代汉语，同时保留比较意味。
theological_decisions:
- issue: 比较分句中的独一神论宣告
  choice: 没有别的能与他相提并论
  alternative: 没有别的会被算作与他并列
  rationale: 不扩写为“没有别的上帝”，以保留希腊文简洁而含蓄的排他性表达；同时明确传达没有任何别者可与他相比。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“相提并论”使比较关系清楚；脚注提供更贴近希腊文形式的译法。
