  text: There is no one who knows her way, nor one who considers her path.
translation:
  language: zh_hans
  text: 没有人知道她的道路，也没有人思量她的路径。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: 没有人
  rationale: 以自然的现代汉语表达希腊文否定存在句，强调这样的人并不存在。
- source_word: ὁ γινώσκων
  choice: 知道
  rationale: 带冠词的现在分词在此指“知道的人”；译作“知道”直接、自然，并与后半句构成平行。
- source_word: τὴν ὁδὸν αὐτῆς
  choice: 她的道路
  rationale: 阴性代词承接上下文中人格化的智慧；“道路”保留ὁδός的道路意象。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 承接前一否定分句，在汉语中自然地保留两句之间平衡的否定并列。
- source_word: ὁ ἐνθυμούμενος
  choice: 思量
  rationale: ἐνθυμέομαι在这里表示内心思索、考虑；“思量”既保留思想活动的含义，又符合庄重的智慧文学语体。
- source_word: τὴν τρίβον αὐτῆς
  choice: 她的路径
  rationale: “路径”对应较具体的τρίβος，并与前句“道路”形成诗意近义变化，而不把两个希腊词合并为同一个译词。
theological_decisions:
- issue: 阴性代词αὐτῆς的所指
  choice: 译作“她的”，指上下文中人格化的智慧
  alternative: 译作“它的”，把智慧处理为抽象概念
  rationale: 希腊文使用阴性代词，且上下文把智慧人格化；保留“她”既反映语法形式，也保存本段的文学与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“道路／路径”和“知道／思量”的平行结构保留原文智慧诗歌的节奏与意象。
