base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: zh_hans
  text: 但那位洞悉万有者认识她；他凭自己的悟性探明了她。那位安设大地、使它长存直到永远的，使大地充满了四足兽类。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: 那位洞悉万有的
  rationale: 将带冠词的完成时分词理解为指称上帝的实体化表达；“洞悉万有”自然、庄重，并保留其无所不知的范围。
- source_word: γινώσκει αὐτήν
  choice: 认识她
  rationale: αὐτήν 回指上下文中被拟人化的智慧；用“她”保留希腊文的阴性指代及文学形象。
- source_word: ἐξεῦρεν αὐτήν
  choice: 探明了她
  rationale: ἐξευρίσκω 表示查明、发现；“探明”既体现复合动词的探究意味，也适合与“智慧”这一宾语搭配。
- source_word: τῇ συνέσει αὐτοῦ
  choice: 凭自己的悟性
  rationale: 将工具用法的与格译为“凭”；“悟性”表达 σύνεσις 的理解力、洞察力。
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: 那位……安设大地的
  rationale: κατασκευάζω 可指预备、建造或安置；“安设”符合此处大地被安排、建立的语境，又避免径直改译为更强的“创造”。
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: 为永远长存
  rationale: 该短语强调绵延不尽的时间；“为永远长存”保留目的或持续结果的可能性，同时用现代汉语清楚表达。
- source_word: ἐνέπλησεν αὐτὴν
  choice: 使地上充满
  rationale: 阴性代词在此回指“大地”；汉语直接重现“地上”可避免“她”与前面的智慧混淆。
- source_word: κτηνῶν τετραπόδων
  choice: 四足兽类
  rationale: 兼顾 κτῆνος 的兽类含义和 τετράπους 的四足特征；比“四足牲畜”更能避免将范围限定为家畜。
theological_decisions:
- issue: 智慧的拟人化
  choice: 以“她”指代智慧
  alternative: 以“它”指代智慧
  rationale: 上下文将智慧拟人化，希腊文也使用阴性代词；“她”保留这一文学和神学张力，却不据此断言智慧是独立神祇。
- issue: κατασκευάσας 所表达的神圣作为
  choice: 译为“安设大地”
  alternative: 译为“创造大地”或“预备大地”
  rationale: 原词并非最直接的“创造”用语，可涵盖预备、建造、安置；“安设”不额外加入特定创造论措辞。
- issue: εἰς τὸν αἰῶνα χρόνον 的关系
  choice: 译为“为永远长存”
  alternative: 译为“永远”或“直到永远”
  rationale: 希腊语可着重目的、结果或持续时段；正文保留大地被安设以长久存立的意味，脚注说明较简洁的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“洞悉万有”“凭自己的悟性”保持诗性与尊严；用“地上”明确第二个阴性代词所指的是大地，避免与拟人化的智慧混淆。
