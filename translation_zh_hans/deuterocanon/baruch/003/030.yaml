base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/030.yaml
  text: Who has crossed beyond the sea and found her[a], and will bring her for choice gold?
translation:
  language: zh_hans
  text: 谁曾渡过大海，到达彼岸，找到了她[a]，并能用上好的金子把她带来呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“找到了它……把它带来”。希腊文使用阴性代词，因为上下文中的“智慧”在语法上属阴性，并被拟人化。
    reason: 说明中文以“她”保留希腊文阴性代词及智慧拟人化的文学特征；“它”为可行但较少保留拟人化的译法。
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 保留反问形式，表达智慧无法凭人的努力取得。
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: 曾渡到海的彼岸
  rationale: διέβη 表示已经越过，πέραν τῆς θαλάσσης 指海的另一边或彼岸；此译自然地保留完成动作和空间意味。
- source_word: εὗρεν αὐτήν
  choice: 找到了她
  rationale: αὐτήν 为阴性代词，承接上下文中被拟人化的智慧；中文以“她”保留这一文学形象。
- source_word: οἴσει αὐτὴν
  choice: 把她带回来
  rationale: οἴσει 本义为“将带来／带去”；结合从海彼岸找到智慧的图景，中文“带回来”自然表达隐含的返回方向，但“回来”并非希腊文中明示的独立成分。
- source_word: χρυσίου ἐκλεκτοῦ
  choice: 用上好的金子
  rationale: ἐκλεκτοῦ 表示精选、优质；“上好的金子”庄重而通俗。无介词的属格在此关系略有含混，译作“用”可表达代价或交换手段。
theological_decisions:
- issue: 智慧在 αὐτήν 中的拟人化
  choice: 以“她”指智慧
  alternative: 以“它”指智慧
  rationale: 希腊文使用阴性代词，且上下文将智慧拟人化；“她”保存这种文学与神学张力，却不据此引入后来的教义认定。
- issue: χρυσίου ἐκλεκτοῦ 与“带来”的语义关系
  choice: 译作“用上好的金子把她带回来”
  alternative: 译作“拿上好的金子来换她”或“把她带来，胜过上好的金子”
  rationale: 该无介词属格可能表达代价或交换关系；正文采用较自然的工具／代价表达，同时不把“交换”说得过实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谁……谁又……”将希腊文并列反问在中文中清楚展开；保留智慧的女性拟人形象。
