translation:
  language: zh_hans
  text: 你若曾行在上帝的道路上，本会永远安居在平安中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ὁδῷ τοῦ θεοῦ
  choice: 行在上帝的道路上
  rationale: 保留“道路”的生活方式隐喻，也自然表达与 πορεύομαι 搭配的行动含义；不将其窄化为“律法”或“诫命”。
- source_word: εἰ ἐπορεύθης
  choice: 你若行在
  rationale: 结合带 ἄν 的后件，表达与过去事实相反的条件；现代汉语可由“若……就会……”及上下文承载这种未实现的意味。
- source_word: κατῴκεις ἂν
  choice: 就会……安居
  rationale: “安居”保留 κατοικέω 的居住、定居意味，比单说“生活”更贴近原文，同时在中文中自然。
- source_word: ἐν εἰρήνῃ
  choice: 在平安中
  rationale: 保留介词结构和 εἰρήνη 作为一种状态的名词性，不简化为副词“平安地”。
- source_word: τὸν αἰῶνα
  choice: 永远
  rationale: 此处为表示持续时间的惯用表达，“永远”准确而自然。
theological_decisions:
- issue: 与事实相反的过去条件句
  choice: 你若……就会……
  alternative: 你若曾……本会……
  rationale: 原文 εἰ 加不定过去时陈述语气，并在后件使用 ἄν，表明未实现的过去条件。正文采用自然中文表达其惋惜意味，避免“本会”略显翻译腔，但不将其改成普遍真理。
- issue: “上帝的道路”的隐喻
  choice: 保留“上帝的道路”
  alternative: 遵守上帝的律法／顺服上帝
  rationale: 原文使用“道路”这一较宽广的行为与生活方式隐喻；改成“律法”或“顺服”会加入原文没有明说的限定。
- issue: 平安的状态与居住意象
  choice: 安居在平安中
  alternative: 永远过平安的生活
  rationale: 保留 κατοικέω 的安居意象及 ἐν εἰρήνῃ 的状态表达，不把两者合并成较自由的释义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”用于 θεός；句式简洁，保留道路、安居和平安等原文意象。
