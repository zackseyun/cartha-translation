base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: zh_hans
  text: 主，全能者，以色列的上帝啊，求你垂听以色列亡者和那些在你面前犯罪的儿子的祷告；他们没有听从你的声音——你是他们的上帝——，灾祸也缠住了我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“恶”或“祸患”。希腊文直译为“恶黏住了我们”。
    reason: τὰ κακά 可泛指“恶”，在此语境中也可指灾祸或祸患；ἐκολλήθη 保留“黏住、缠住”的意象。
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: 主—全能者
  rationale: 保留呼格中的两个神圣称号；“全能者”既表达 παντοκράτωρ 的普世统治含义，也符合现代汉语圣经语体。破折号表明二者同位，避免误读为普通修饰语。
- source_word: ἄκουσον δὴ
  choice: 求你垂听
  rationale: 命令式与 δή 在祈求语境中具有恳切语气；“求你垂听”自然、庄重，并明确指向祷告。
- source_word: τῶν τεθνηκότων Ἰσραήλ
  choice: 以色列亡者
  rationale: 忠实保留完成时分词“已经死去的人”的直观含义，不将其解释为属灵死亡或濒临灭亡。
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: 那些在你面前犯罪之众子
  rationale: “众子”保留 υἱῶν 的阳性和复数；“在你面前”保留 ἐναντίον σου 可表示临在或对立的张力，不直接收窄为“得罪你”。
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου
  choice: 他们没有听从你的声音
  rationale: “听从”兼顾听见和顺服的语义，同时保留“声音”这一原文意象。
- source_word: θεοῦ αὐτῶν
  choice: 你—他们的上帝—
  rationale: 按希腊文把“他们的上帝”理解为对第二人称“你”的同位说明，并用破折号使现代汉语结构清楚。
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: 灾祸便紧紧缠住了我们
  rationale: “紧紧缠住”保留 κολλάω“粘住、依附”的鲜明意象；在此盟约惩罚语境中以“灾祸”表达 τὰ κακά 较自然，同时脚注保留更形式对应的译法。
theological_decisions:
- issue: “以色列亡者”的所指
  choice: 按字面译作“以色列亡者”
  alternative: 将其解释为如同死去的以色列人，或属灵上死去的人
  rationale: τῶν τεθνηκότων Ἰσραήλ 最直接指以色列中已经死去的人；译文不以某种神学解释替代原文刻意醒目的表达。
- issue: ἐναντίον σου 在犯罪语境中的含义
  choice: 译作“在你面前”
  alternative: 译作“得罪你”或“反抗你”
  rationale: 该短语既可表达在上帝面前，也可能含有敌对、冒犯意味；“在你面前犯罪”保留两者之间的张力。
- issue: τὰ κακά 的语义范围
  choice: 正文译作“灾祸”
  alternative: “恶事”或“种种祸患”
  rationale: 上下文更可能指犯罪所带来的患难或灾难，但原词本身范围较宽，因此以脚注交代较直译的选择。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“垂听”与“祷告”搭配自然；以破折号标示神名和同位说明。保留“亡者”“众子”“在你面前”等较贴近希腊文且具有神学张力的措辞。
