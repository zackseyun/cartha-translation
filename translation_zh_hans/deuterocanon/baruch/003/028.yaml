base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/028.yaml
  text: And they perished for lack of understanding[a]; they perished because of their own lack of counsel.
translation:
  language: zh_hans
  text: 他们因不明事理[a]而灭亡；他们因自己缺乏判断而灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不明事理”或译“缺乏明智”或“缺少审慎”。
    reason: φρόνησις可表示理解、明智或实际生活中的审慎，单一汉语词语难以涵盖其全部语义。
lexical_decisions:
- source_word: ἀπώλοντο
  choice: 灭亡
  rationale: 该词在这里表示走向毁灭或败亡；“灭亡”保留庄重语气，也不限定为被外力毁灭或单指死亡。
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: 因不……
  rationale: παρὰ τό加不定式在此表达原因；用“因不……”自然地传达其因果关系。
- source_word: φρόνησιν
  choice: 明事理
  rationale: φρόνησις兼有理解、明智和审慎处事之意；“明事理”在现代汉语中自然易懂，并保留其知性与实践性的内涵。
- source_word: διὰ τὴν ἀβουλίαν
  choice: 因……缺乏判断
  rationale: ἀβουλία指欠缺商议、谋断或审慎判断；“缺乏判断”比笼统的“愚昧”更贴近其关于思量和决断的含义。
- source_word: αὐτῶν
  choice: 自己
  rationale: “自己”明确表达希腊文所有格所指向的归属与责任，但不进一步解释这种责任的神学性质。
theological_decisions:
- issue: 灭亡的原因
  choice: 按经文表述，将灭亡归因于不明事理和自身缺乏判断
  alternative: 可将这两项直接概括为“愚昧”或“无知”
  rationale: 原文采用两个彼此相关却不完全相同的智慧语汇：φρόνησις侧重明智与实际理解，ἀβουλία侧重欠缺商议和判断。译文保留两者之间的张力，不扩展为经文本节未明说的教义判断。
translation_notes:
  register: 采用现代、庄重且易懂的表达。保留原文两次“灭亡”的重复，以呈现其平行结构和强调作用；分号体现两个紧密相连的因果分句。
