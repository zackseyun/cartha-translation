  text: because those who work in silver and are concerned[a], and there is no finding out their works.
translation:
  language: zh_hans
  text: 因为那些加工银子、操心挂虑的人，无法查明他们所做的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那些制作银制品、满心挂虑的人，无法查明他们的工作成果。”希腊文简略，句法和“他们所做的事”的具体所指都不完全明确；“所做的事”也可指他们的工作或其成果。
    reason: 保留μεριμνῶντες的“挂虑”含义，并避免将τὸ ἀργύριον固定为“银器”或将ἔργων固定为“作品”；说明本句简略难解而不把上下文中“智慧”的推论写成原文直接含义。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，引出解释性或因果性分句；“因为”保留希腊文的连接作用。
- source_word: οἱ τὸ ἀργύριον τεκταίνοντες
  choice: 那些打造银器的人
  rationale: τεκταίνοντες表示制作、打造；ἀργύριον在此更自然地指作为加工材料的银，而“打造银器”在现代汉语中清楚表达银匠的活动，避免误解为处理货币。
- source_word: μεριμνῶντες
  choice: 劳心操虑
  rationale: 兼顾该词“挂虑、忧虑”和“专心操持”的语义，在难解的上下文中不把它单一定为焦虑或勤勉。
- source_word: οὐκ ἔστιν ἐξεύρεσις
  choice: 无从探究
  rationale: 保留“不能查明、无法发现”的抽象含义，同时比逐字译作“没有发现”更符合现代汉语。
- source_word: τῶν ἔργων αὐτῶν
  choice: 他们的作品
  rationale: ἔργων既可指行为，也可指工作成果；鉴于前文谈银匠，“作品”自然形成联系，但脚注保留“所作之事”的可能。
theological_decisions:
- issue: 本句与智慧主题的关系
  choice: 不在正文中补出“他们无法找到智慧”等解释
  alternative: 译成“他们的作品也不能使他们找到智慧”
  rationale: 希腊文本身没有在本句明说“智慧”是探究的宾语；保留原文简短而难解的张力，避免将上下文推论写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“打造银器”具体自然；“劳心操虑”略具书面色彩，既符合经文语体，也保留原词介于专注操持与忧虑之间的含义。
