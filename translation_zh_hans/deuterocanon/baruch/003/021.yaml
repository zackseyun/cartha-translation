  yaml_path: translation/deuterocanon/baruch/003/021.yaml
  text: Nor did they understand its paths[a], nor did they take hold of it; their sons became far from their way,
translation:
  language: zh_hans
  text: 他们也不明白她的路径，也没有把握她；他们的儿子离他们的道路已经很远了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希腊文措辞较为生硬，且按所传文本直译为“他们的儿子离他们的道路已经很远了”。也可按上下文较顺畅地理解为：“他们的儿子远离了那条道路。”
    reason: 保留所传文本中复数代词“他们的”及“成为／处于远处”的状态，同时说明较合乎汉语习惯、但更具解释性的理解。
lexical_decisions:
- source_word: συνῆκαν
  choice: 明白
  rationale: 该动词表示理解、领会；“明白”在现代汉语中自然清楚，也适合与智慧的“路径”这一比喻搭配。
- source_word: τρίβους
  choice: 路径
  rationale: τρίβος可指小路、路径；“路径”保留原文的道路意象，并能表达智慧的行径或途径。
- source_word: ἀντελάβοντο
  choice: 抓住
  rationale: 该中动态形式可表示抓住、把握或取得。这里以智慧为宾语，“抓住”保留原文具体而开放的意象，未将其限定为单纯的理解或获得。
- source_word: οἱ υἱοὶ αὐτῶν
  choice: 他们的儿子
  rationale: 原文明确使用阳性复数“儿子”，故按原文保留，不泛化为“儿女”或“后代”。
- source_word: πόρρω ἐγενήθησαν
  choice: 变得远离
  rationale: 原文直译为“变得在远处”，表达逐渐形成的疏远或距离；“变得远离”虽略显生硬，却保留其状态变化。
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: 远离了他们的道路
  rationale: 现存希腊文使用复数属格代词αὐτῶν，最直接是“他们的道路”。鉴于末句句法不够顺畅，不在正文中擅自改作“她的道路”或“那条道路”。
theological_decisions:
- issue: 智慧的阴性代词
  choice: 她
  alternative: 它
  rationale: 本节以阴性代词指向上下文中的智慧；汉语用“她”可保留智慧被人格化的表达，但不进一步判定其本体身份。
- issue: 阳性亲属称谓
  choice: 他们的儿子
  alternative: 他们的儿女
  rationale: 希腊文明确为“儿子”，保留性别信息，且不附加额外的神学含义。
- issue: 末句在文本差异标记下的处理
  choice: 他们的儿子变得远离了他们的道路
  alternative: 他们的儿子远离了那条道路
  rationale: 依照所给希腊文本保留复数“他们的”和“变得”的语义，即使中文略显生硬；脚注提供较顺畅但解释性更强的译法，避免正文默默解决原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“路径／道路”对应原文两个不同的道路词，并保留智慧的人格化和末句的文本张力。
