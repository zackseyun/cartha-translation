revisions:
- from: 那些以天空的飞鸟取乐的人[a]，那些积存金银的人——人们曾倚靠这些财物，而他们的产业无穷无尽。
  to: 那些拿天空的飞鸟取乐、积存金银的人[a]——人们曾倚靠这些财物；他们的财物无穷无尽。
  rationale: 合并两个并列分词，使其明确同属“那些……的人”；以“财物”翻译κτῆσις，避免“产业”的现代商业联想。保留原文对财富的倚靠及其拥有之物没有穷尽的修辞表达。
