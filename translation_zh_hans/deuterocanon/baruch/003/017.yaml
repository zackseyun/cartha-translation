base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/017.yaml
  text: those who make sport with the birds of the sky[a], and who store up silver and gold, in which people trusted, and there is no end to their possessions.
translation:
  language: zh_hans
  text: 那些拿天空的飞鸟取乐、积存金银的人[a]——人们曾倚靠这些财物；他们的财物无穷无尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在天空的飞鸟间嬉戏。”希腊语可泛指嬉戏或取乐，不一定指言语上的嘲弄。
    reason: 保留ἐμπαίζοντες所表示的嬉戏、取乐活动之歧义，并反映介词短语可按地点理解。
lexical_decisions:
- source_word: ἐμπαίζοντες
  choice: 以……取乐
  rationale: 该分词可指嬉戏、取乐或拿某物作消遣；结合飞鸟，可能暗示狩猎等活动，但原文并未明确说“捕猎”，故正文保留较宽泛的表达，并以脚注说明另一种理解。
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: 忠实表达属格结构，同时符合现代汉语中庄重而自然的圣经语体。
- source_word: θησαυρίζοντες
  choice: 积存
  rationale: 准确传达不断聚积并储藏财富的意思，现代汉语自然简洁。
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: 金银
  rationale: 原文依次为“银和金”；汉语习惯说“金银”，仍清楚保留两种贵金属，且比“银子和金子”更凝练。
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: 人们曾倚靠这些财物
  rationale: 以“人们”表达泛指的ἄνθρωποι；不把关系代词仅限于紧邻的“金”，而按语义指向所积存的金银财物。“曾倚靠”体现不定过去时，并传达信赖、依靠之意。
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: 他们的产业无穷无尽
  rationale: κτῆσις可指所得、所有物或产业；“产业”兼顾财产与拥有之物。“无穷无尽”自然传达“没有尽头”，并保留对其不断占有积聚的强调。
theological_decisions:
- issue: 财富作为倚靠对象
  choice: 人们曾倚靠这些财物
  alternative: 人们曾信靠这些财物
  rationale: πιστεύω在此表示把安全感寄托于财富；“倚靠”既保留信赖意味，也避免把句子过度术语化。
- issue: κτῆσις所指的是占有过程还是所有物
  choice: 产业
  alternative: 聚敛／财产
  rationale: 希腊词可涵盖获取、拥有及所得之物；正文采用范围较宽的“产业”，不把含义单一限定为聚敛行为或某一种财产。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。用两个“那些……的人”延续上文列举人物的句法；破折号标明后半句转而评论其财富与倚靠。脚注标记[a]已置于正文相应词组之后。
