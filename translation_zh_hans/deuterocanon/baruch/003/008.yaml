base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: zh_hans
  text: 看哪，今天我们身在流亡之地，就是你把我们分散到的地方，受羞辱、受咒诅，并承担债责[a]；这一切是照着我们祖先所行的一切不义而来的，他们背离了主——我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偿债”“受罚”。希腊语可指所负的债务或偿付责任；在审判语境中，也可指应受的惩处。
    reason: 保留 ὄφλησιν 在债务、责任与惩罚之间的词义幅度，避免将其限定为“罪责被追讨”。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并强调眼前处境的语用力量，同时符合庄重而通顺的现代汉语圣经语体。
- source_word: ἀποικίᾳ
  choice: 流亡之地
  rationale: 此处指被迁离故土、散居异邦的处境及所在；“流亡之地”兼顾地点含义与历史处境。
- source_word: διέσπειρας
  choice: 分散
  rationale: 准确表达被散布在异邦各处的意思，并保留经文中常见的离散意象。
- source_word: ὀνειδισμὸν
  choice: 羞辱
  rationale: 表达公开受辱、成为他人讥诮对象的含义。
- source_word: ἀρὰν
  choice: 咒诅
  rationale: 直接保留审判语境中的“咒诅”含义。
- source_word: ὄφλησιν
  choice: 被追讨罪责
  rationale: 该词可指所欠之债、应负的责任或因此而来的惩罚；“被追讨罪责”在汉语中兼顾债责与审判语境，但以脚注保留其他可能译法。
- source_word: κατὰ πάσας τὰς ἀδικίας
  choice: 照着……所行的一切不义
  rationale: 保留 κατά 所表达的对应、相称关系，而不将其简单收窄为因果关系。
- source_word: ἀπέστησαν
  choice: 背离
  rationale: 表达离开并弃绝与主之关系的意思，又避免使用过度技术化的宗教术语。
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: 主我们的上帝
  rationale: 贴近希腊语词序并保留盟约性称谓；现代汉语中虽较“我们的主上帝”更具源语痕迹，仍清楚庄重。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 主宰；上主
  rationale: 此处在以色列与其上帝的关系语境中使用 κύριος；“主”既忠实于希腊文，也不额外引入特定宗派用语。
- issue: ὄφλησιν 在审判语境中的理解
  choice: 被追讨罪责
  alternative: 偿债；受罚；承担债责
  rationale: 原词保有欠债、责任和惩罚之间的语义张力，不宜只译成“惩罚”而消除债责意象；正文采用可理解的综合表达，脚注说明其歧义。
- issue: κατά 所表达的关系
  choice: 照着……而来
  alternative: 因为
  rationale: 原文着重当前遭遇与祖先一切不义相对应或相称；不单用“因为”，以免把较宽的对应关系限定为纯粹因果。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留原文的强调语气；“流亡之地”使地点与流亡处境同时可见。句法略作汉语化处理，但保留“羞辱—咒诅—债责”的并列结构，以及当前遭遇与祖先不义相称的神学张力。
