revisions:
- from: 看哪，今天我们身在流亡之地，就是你把我们分散到的地方，蒙受羞辱和咒诅，并被追讨罪责[a]；这一切都是照着我们祖先所行的一切不义而来的，因为他们背离了主我们的上帝。
  to: 看哪，今天我们身在流亡之地，就是你把我们分散到的地方，受羞辱、受咒诅，并承担债责[a]；这一切是照着我们祖先所行的一切不义而来的，他们背离了主——我们的上帝。
  rationale: 修订仅处理两项源文忠实度问题及一处汉语搭配问题：“承担债责”保留原词的债务／责任含义而不添加“罪责被追讨”的具体内容；删除“因为”以保留原文对祖先的说明性关系；以“主——我们的上帝”改善称谓在现代汉语中的可读性。其余并列结构、审判语境和“照着”所表达的对应关系均予保留。
