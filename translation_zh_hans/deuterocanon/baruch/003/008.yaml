  - severity: low
    issue: “因为他们背离了”加入明确因果连接。
    rationale: 原文是“我们的祖先，〔即〕那些背离了主我们上帝的人”的关系从句／分词结构；其因果意义可由上下文推知，但不必在译文中明说。
  - severity: low
    issue: “主我们的上帝”在现代汉语中略显生硬。
    rationale: 用破折号标示“主”与“我们的上帝”的同位关系，可维持源文称谓的完整性并改善可读性。
