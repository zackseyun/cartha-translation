  text: You abandoned the fountain of wisdom[a].
translation:
  language: zh_hans
  text: 你离弃了智慧的泉源[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧之泉”或“智慧的源头”。
    reason: 词义替代：πηγή既可指泉、泉源，也可强调源头。
lexical_decisions:
- source_word: ἐγκατέλιπες
  choice: 你离弃了
  rationale: 该词是ἐγκαταλείπω的不定过去时主动直陈语气第二人称单数，表示已经撇下、离弃。中文“离弃”自然、庄重，并比单纯的“离开”更能保留原词的力度。
- source_word: πηγὴν
  choice: 泉源
  rationale: πηγή指涌出水的泉、泉源，也可引申为源头。“泉源”既保留具体的水泉意象，又能自然表达智慧由此而出的源头含义。
- source_word: σοφίας
  choice: 智慧
  rationale: σοφία的标准对应词。原文只说“智慧”，虽在语境中具有神圣含义，正文不作解释性扩充。
theological_decisions:
- issue: “智慧的泉源”这一隐喻的保留
  choice: 正文直译为“智慧的泉源”
  alternative: “智慧的源头”或“智慧之泉”
  rationale: 原文πηγή使用具体的水泉意象。保留“泉源”可维持诗性和神学张力，不把隐喻提前解释为较抽象的“源头”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式简洁，保留第二人称单数责备语气及原文的水泉隐喻。
