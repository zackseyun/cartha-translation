base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: zh_hans
  text: 还有夏甲的子孙：那些在世上寻求悟性的人、梅兰[a]和提幔的商人、讲述神话的人，以及寻求悟性的人；他们却不认识智慧的道路，也没有记起她的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“梅兰”（Μερρὰν），是这一文本见证中一个罕见的地名；有些传统对它作不同的辨认或归一处理。这里保留现存希腊文的形式，不作无声校改。
    reason: textual_variant
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: 还有……夏甲之子
  rationale: 保留υἱοί的字面亲属称谓“之子”，不径自解释为“后裔”；用“还有”体现τε在上下文列举中的附加作用。
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν οἱ ἐπὶ γῆς
  choice: 在世上寻求悟性
  rationale: “寻求”自然表达ἐκζητέω的积极探求之意；“悟性”适合σύνεσις所指的理解、洞察能力，并与后文重复对应；“在世上”保留ἐπὶ γῆς的广泛范围。
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: 米兰和提幔的商人
  rationale: ἔμποροι译作现代中文自然的“商人”；Μερρὰν依现存希腊文本音译为“米兰”，Θαιμάν采用较通行的圣经地名译法“提幔”。
- source_word: οἱ μυθολόγοι
  choice: 讲述神话的人
  rationale: 直接表达从事讲说神话、传说之人，比单纯“讲故事的人”更贴近μῦθος的词义，又不额外断定其所讲内容必属虚假。
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: 寻求悟性的人
  rationale: 与前面的ἐκζητοῦντες τὴν σύνεσιν采用相同核心词，保留希腊文刻意的修辞重复。
- source_word: ὁδὸν δὲ σοφίας
  choice: 却不认识智慧的道路
  rationale: ὁδός译为“道路”，保留道路隐喻；δέ在此呈转折，以“却”表现这些人虽寻求悟性，却不认识智慧之道的张力。
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: 也不曾想起她的路径
  rationale: “想起”自然对应ἐμνήσθησαν；τρίβοι译作“路径”，与前文“道路”形成词汇变化；“她”保留智慧的女性拟人形象。
theological_decisions:
- issue: 智慧的拟人化
  choice: 用“她的路径”保留女性指代
  alternative: 译作“它的路径”或省略代词
  rationale: αὐτῆς回指阴性名词σοφία，且上下文将智慧拟人化；“她”能保留这一文学与神学张力，而不作额外解释。
- issue: 疑难地名Μερρὰν的处理
  choice: 按现存希腊文本音译为“米兰”，并加注说明
  alternative: 校改或归一为其他较熟悉的地名
  rationale: 所给希腊见证明确作Μερρὰν，虽名称罕见，也不应无声校改；音译并加脚注兼顾正文可读性与文本透明度。
- issue: 寻求悟性却不认识智慧之道的张力
  choice: 保留原文并列与转折，不把两者调和
  alternative: 把“悟性”解释为世俗知识，或明确贬斥其寻求
  rationale: 原文让“寻求悟性”和“不认识智慧的道路”并存，却未明说前者的性质；译文应保存这种张力，不导入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“悟性”与“智慧”分别对应σύνεσις和σοφία，以保留原文概念区分；破折号呈现插入式列举，同时保持长句层次清楚。
