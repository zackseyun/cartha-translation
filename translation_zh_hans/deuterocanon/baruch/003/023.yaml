revisions:
- from: 还有那些在世上寻求悟性的夏甲之子——米兰[a]和提幔的商人、讲述神话的人和寻求悟性的人——他们却不认识智慧的道路，也不曾想起她的路径。
  to: 还有夏甲的子孙：那些在世上寻求悟性的人、梅兰[a]和提幔的商人、讲述神话的人，以及寻求悟性的人；他们却不认识智慧的道路，也没有记起她的路径。
  rationale: 修订仅改善汉语句法和地名转写，未改变原文的列举关系、重复的“寻求悟性”、智慧与悟性的概念区分，或智慧的女性拟人化。
