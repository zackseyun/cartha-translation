  text: O Israel[a], how great is the house of God, and how vast is the place of his possession;
translation:
  language: zh_hans
  text: 以色列啊，上帝的居所何其宏大；他所拥有之地何其辽阔！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  choice: 以色列啊
  rationale: 用句末语气词“啊”表达希腊语呼格感叹词Ὦ的直接呼唤和庄重语气，并按通行形式音译专名。
- source_word: ὡς μέγας
  choice: 何其宏大
  rationale: ὡς与形容词连用构成感叹；“何其”保留其强烈的赞叹语气，“宏大”也适合描述空间规模。
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: 上帝的居所
  rationale: οἶκος本义为房屋、住所，也可延伸指家室；此处与后面的空间描述相应。“居所”在现代汉语中自然庄重，又避免将其限定为地上的圣殿或家庭成员。
- source_word: ἐπιμήκης
  choice: 辽阔
  rationale: 该词表示在长度上延伸、绵延甚远；结合τόπος所指的空间，“辽阔”比直译为“长”更符合现代汉语表达，同时保留广大无边的空间意象。
- source_word: ὁ τόπος
  choice: 所在之地
  rationale: τόπος直指地方、处所；与属格τῆς κτήσεως αὐτοῦ结合译成“他产业所在之地”，既自然，又保留原文的空间表达。
- source_word: τῆς κτήσεως αὐτοῦ
  choice: 他产业
  rationale: κτῆσις可指所得、所有物或产业；在“居所”和“所在之地”的空间语境中，“产业”能较好表达属于上帝的领域，同时不把词义直接限定为创造。
theological_decisions:
- issue: κτήσεως在上帝“居所”和“所在之地”语境中的含义
  choice: 正文译作“产业”
  alternative: 受造之物
  rationale: 本节着重描写上帝领域的宏大和辽阔，κτῆσις的“所有物、产业”义与这一空间语境较为贴合；但该词也可能被理解为创造或所造之物，因此以脚注保留这一真实的词义可能性。
- issue: οἶκος τοῦ θεοῦ是否特指圣殿
  choice: 译作“上帝的居所”，不限定为地上的圣殿
  alternative: 上帝的殿宇；上帝的家
  rationale: 原文οἶκος本身可表示房屋、住所或家，而上下文强调其超乎寻常的广大；译文不应无根据地将其缩窄为某一座圣殿，也不应解释成上帝的子民群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“何其……何其……”传达原文的感叹和诗性平行；“宏大”“辽阔”保留由居所扩展到广大地域的空间递进。脚注标记紧接产生词义歧义的“产业”。
