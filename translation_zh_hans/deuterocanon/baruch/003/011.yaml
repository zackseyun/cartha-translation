  text: you were counted among those in Hades,[a]
translation:
  language: zh_hans
  text: 你被算入那些下到阴间的人中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你被列在那些在阴间的人中。”希腊文作“那些〔到〕阴间的〔人〕”，此处可理解为“下到阴间的人”。
    reason: 说明εἰς ᾅδου的趋向性及其在语境中可按“在阴间的人”理解的替代译法，同时避免把省略结构误称为含有明确“进入”动词的直译。
lexical_decisions:
- source_word: προσελογίσθης
  choice: 你被算在
  rationale: 该词是不定过去时被动式，表示被计入某一群体；“被算在……中间”既保留被动语态，也符合现代汉语表达。
- source_word: μετὰ
  choice: 在……中间
  rationale: μετά与属格连用本义为“与……一起”；在“被算”这一语境中译作“在……中间”，自然表达被归入某群体。
- source_word: τῶν εἰς ᾅδου
  choice: 那些进入阴间的人
  rationale: εἰς带宾格通常表达进入或趋向；此处保留这一方向性，不把短语简化为泛指“死人”。
- source_word: ᾅδου
  choice: 阴间
  rationale: ᾅδης在七十士译本中指死者所在之境；“阴间”是现代中文圣经语境中清楚而庄重的对应词，并避免误译为特指终极刑罚的“地狱”。
theological_decisions:
- issue: ᾅδου的译法
  choice: 阴间
  alternative: 冥府；死者之境；坟墓；地狱
  rationale: “阴间”保留死者所在领域的含义，不将其缩减为坟墓，也不与终极审判意义上的地狱混同。
- issue: εἰς的方向性
  choice: 进入阴间的人
  alternative: 在阴间的人
  rationale: 原文是εἰς ᾅδου，形式上具有进入或趋向阴间的方向性；正文予以保留，同时脚注说明也可按群体所处状态理解。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“被算在……中间”保留原文被动结构；“阴间”使用常见的圣经汉语术语，但不等同于“地狱”。
