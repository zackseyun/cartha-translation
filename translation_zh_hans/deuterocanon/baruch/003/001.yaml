  text: Lord Almighty[a], God of Israel, a soul in distress and a discouraged spirit has cried out to you.
translation:
  language: zh_hans
  text: 全能的主，以色列的上帝，困苦的心灵和沮丧的灵向你呼求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: 全能的主
  rationale: 这是呼格形式的复合称呼；“主”符合犹太希腊语经文中对上帝的通常称呼，“全能”自然传达 Παντοκράτωρ 掌管万有、拥有一切权能的含义。
- source_word: ὁ θεὸς Ἰσραήλ
  choice: 以色列的上帝
  rationale: 作为同位称号接续前面的直接呼告，保留其盟约和民族历史语境。
- source_word: ψυχὴ ἐν στενοῖς
  choice: 困苦的心灵
  rationale: ψυχή 在这里指人的内在自我；ἐν στενοῖς 描述受困、受压迫的处境。“困苦的心灵”兼顾诗性与现代可懂度。
- source_word: πνεῦμα ἀκηδιῶν
  choice: 沮丧的灵
  rationale: πνεῦμα 与 ψυχή 构成平行表达，故保留为“灵”；ἀκηδιῶν 表示灰心、倦怠或意志消沉，“沮丧”不把它过度解释为临床意义的绝望。
- source_word: κέκραγεν πρὸς σέ
  choice: 向你呼求
  rationale: κράζω 在祷告语境中是迫切呼喊；希腊语完成时强调呼声已经发出并具有当前效力。汉语“向你呼求”自然表达对象和迫切性；汉语动词不强制标明时态，避免生硬增译。
theological_decisions:
- issue: ψυχή 与 πνεῦμα 的人论性并列表达
  choice: 分别译作“心灵”和“灵”
  alternative: 合并为“身心”或“内心”；或把 ψυχή 译作“人”、πνεῦμα 译作“气息”
  rationale: 原文以两个内在人性词语形成诗意平行，但未明确建立技术性的人论划分。分别保留两项，既不抹平原文，也不强加灵魂结构学说。
- issue: 两个并列表达与单数谓语的关系
  choice: 用汉语共同主语“困苦的心灵和沮丧的灵向你呼求”
  alternative: 分别处理为两个独立呼求者，或增译“一个……的人”以统一为单一主体
  rationale: 原文两个单数名词短语后接单数谓语，可能是把二者作为同一祷告者内在生命的平行描写。汉语不标动词数，能够保存这种张力而不强行判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心灵”和“灵”有意保留 ψυχή／πνεῦμα 的区分；不加注脚，因为正文已能清楚传达主要语义，而“困苦”“沮丧”也涵盖原词所含的受压与灰心色彩。
