  text: 因为你是主，我们的上帝；主啊，我们必赞美你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在祷告语境中引出前面恳求的依据；汉语用“因为”自然表达其因由关系。
- source_word: σὺ
  choice: 你
  rationale: 保留希腊文显式人称代词的强调作用。
- source_word: Κύριος
  choice: 主
  rationale: 此处为上帝的尊称，按七十士译本的通常用法译作“主”。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝
  rationale: 以现代汉语自然表达所属关系，同时保留共同体性的“我们”。
- source_word: αἰνέσομέν
  choice: 我们必赞美
  rationale: 该词为将来时主动直陈语气第一人称复数；“必赞美”保留陈述和承诺意味，不改成劝勉语气。
- source_word: σε
  choice: 你
  rationale: 直接宾语指向上帝，照常译作“你”。
- source_word: Κύριε
  choice: 主啊
  rationale: 以“啊”明确表现希腊文呼格的直接呼告。
theological_decisions:
- issue: 神圣语境中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 本节以 κύριος 作为对上帝的称号和呼告；“主”既符合七十士译本语境，也不引入额外解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”承接上文；分号呈现认信与赞美承诺之间紧密而有层次的关系。
