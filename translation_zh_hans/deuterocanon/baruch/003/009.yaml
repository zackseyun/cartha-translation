  text: Hear[a], O Israel, the commandments of life[b]; give ear to know prudence.
translation:
  language: zh_hans
  text: 以色列啊，要听生命的诫命[a]；要侧耳，为要领悟明智[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“生命的诫命”；也可理解为“赐生命的诫命”“通向生命的诫命”或“关乎生命的诫命”。
    reason: 保留 ζωῆς 属格结构的语义开放性。
  - marker: b
    text: “明智”也可译作“明悟”“洞见”或“审慎”。
    reason: φρόνησις 可指理解力、洞见及审慎的判断。
lexical_decisions:
- source_word: Ἄκουε
  choice: 要听
  rationale: 单数命令式，以以色列为一个整体来呼告；“要听”既自然，也保留庄重的劝诫语气。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 采用现代汉语圣经传统中通行的专名译法。
- source_word: ἐντολὰς
  choice: 诫命
  rationale: 表达具有权威性的命令，并保留经文语境中的庄重色彩。
- source_word: ζωῆς
  choice: 赐生命的
  rationale: 以自然汉语表达“生命的诫命”，但不排除“通向生命”或“关乎生命”的相关含义，因此加注说明原文结构。
- source_word: ἐνωτίσασθε
  choice: 要侧耳聆听
  rationale: 复数命令式；保留原词“使耳朵留意”的形象和加强语气。
- source_word: γνῶναι
  choice: 好明白
  rationale: 不定式在此表示目的；“好明白”符合现代汉语表达。
- source_word: φρόνησιν
  choice: 睿智
  rationale: 该词兼有理解力、洞见和审慎判断之意；“睿智”较凝练，也避免“明白理解”之类重复。
theological_decisions:
- issue: ἐντολὰς ζωῆς 中属格 ζωῆς 的含义
  choice: 正文译为“赐生命的诫命”，并以脚注保留其他可能
  alternative: “生命的诫命”“通向生命的诫命”“关乎生命的诫命”
  rationale: 希腊语属格关系简练而多义。现代汉语直译“生命的诫命”略显生硬，正文采用较自然的结果性理解，同时用脚注明确原文形式及其他合理解释，避免把含义绝对限定。
- issue: φρόνησις 的语义范围
  choice: 睿智
  alternative: 明悟；洞见；审慎
  rationale: 此词不仅指知识，也可包含实际判断与审慎。正文选用涵盖面较广且庄重的“睿智”，脚注提示其语义范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列啊”保留直接呼告；“侧耳聆听”再现原文形象。“赐生命的诫命”便于普通读者理解，同时通过脚注保存希腊文属格的歧义。
