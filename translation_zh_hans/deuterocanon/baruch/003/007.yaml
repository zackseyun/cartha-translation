base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: zh_hans
  text: 正因如此，你把对你的敬畏放在我们心中[a]，使我们呼求你的名；我们在流亡中[b]要赞美你，因为我们已经从心中摒弃了我们列祖的一切不义[c]；他们曾在你面前犯罪[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“你的敬畏”。这是圣经中表示人对上帝之敬畏的说法，可兼含畏惧、敬重和顺服，不只是一般的尊敬。
    reason: lexical_alternative
  - marker: b
    text: 或译“在被掳中”。希腊词可指被迁离故土后流亡或被掳的状态。
    reason: lexical_alternative
  - marker: c
    text: 或译“一切恶行”或“一切不公”。
    reason: lexical_alternative
  - marker: d
    text: 或译“得罪了你”。希腊文较直译为“在你面前犯罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 保留短语承接上文并说明原因的语气；“正”使现代汉语表达自然，但不把因果关系改成单纯的推论。
- source_word: ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν
  choice: 你把对你的敬畏放在我们心中
  rationale: ἔδωκας本义为“给了”，与“心”搭配时译作“放在”较自然；“心中”保留心作为内在意志与态度所在的意象。τὸν φόβον σου译作“对你的敬畏”，同时以脚注说明希腊文较直译的形式及其语义张力。
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: 使我们呼求你的名
  rationale: 不定式在这里表达前一行动的目的或结果；“呼求你的名”保留祷告和求告的圣经用语。
- source_word: αἰνέσομέν σε
  choice: 我们要赞美你
  rationale: 直接表达希腊文将来时，符合现代汉语的自然语序。
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: 在流亡中
  rationale: 在《巴录书》的语境中，ἀποικία指被迁离故土、处于异地的状态；“流亡”比字面上的“殖民地”更准确，也不强行限定为监禁式的“被囚”。
- source_word: ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν
  choice: 我们已经从心中摒弃了
  rationale: ἀποστρέφω在此可表达转离或除去；汉语用“从心中摒弃”既保留内在悔改的图像，也清楚交代其宾语。
- source_word: πᾶσαν ἀδικίαν
  choice: 一切不义
  rationale: ἀδικία兼有不义、不公和恶行等含义；“一切不义”保持本段悔罪祷告的道德与宗教语域。
- source_word: πατέρων ἡμῶν
  choice: 我们列祖
  rationale: πατέρων为阳性复数，指先辈；“列祖”是庄重而易懂的圣经汉语，也保留原文明确的父系称谓。
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: 他们曾在你面前犯罪
  rationale: ἐναντίον σου较直译是“在你面前”，兼含处于上帝鉴察之下并得罪上帝的意味；正文保留这一空间—关系表达。
theological_decisions:
- issue: τὸν φόβον σου所表达的敬畏、惧怕与顺服之间的张力
  choice: 正文译作“对你的敬畏”，脚注保留“你的敬畏”的直译，并说明其含义不只等于尊敬
  alternative: 译作“惧怕你”或“尊敬你”
  rationale: 悔罪语境中的φόβος可包含畏惧、敬重和由此而来的顺服。单译成“尊敬”会弱化惧怕成分，单译成“惧怕”又可能遮蔽敬虔含义，因此正文采用较宽广的“敬畏”，并以脚注保存原文形式。
- issue: πατέρων ἡμῶν的性别与祖先含义
  choice: 我们列祖
  alternative: 我们的祖先
  rationale: 原文明确使用阳性复数“父辈”；“列祖”既符合原文，也适合本段追认先辈罪恶的语境，不以中性化称谓替代。
- issue: ἐναντίον σου是“在你面前”还是“得罪你”
  choice: 在你面前犯罪
  alternative: 得罪你／冒犯你
  rationale: “在你面前”保留原文的空间和鉴察意象，同时汉语语境仍能传达罪是针对上帝而犯的，不必在正文中把这一层解释性地改写为“得罪”。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语言。“正因如此”“放在我们心中”“从心中摒弃”符合现代普通话；“呼求你的名”“列祖”“不义”保留必要的圣经语域。分号后的末句将希腊文关系分句独立为短句，以免汉语修饰链过长，同时保持其明确指向“列祖”。
