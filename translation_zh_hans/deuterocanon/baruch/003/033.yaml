  text: He sends out the light[a], and it goes; he called it, and it obeyed him with trembling.
translation:
  language: zh_hans
  text: 他差遣光，光就前行；他召唤光，光便战战兢兢地听从他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较按形式可译为：“那差遣光、光就前行的一位。”希腊语开头是带冠词的分词，作为对上帝称谓式的描述。
    reason: 说明希腊语开头名词性、称谓式分词的较形式化译法。
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  choice: 他发出
  rationale: 希腊语带冠词的现在分词作名词性用法，承接上下文所指的上帝，并表达其特征性行动。汉语以明确的代词和限定动词表达更自然。
- source_word: τὸ φῶς
  choice: 光
  rationale: 此处指受上帝支配的宇宙之光，而非比喻性的启示；现代汉语通常无需把希腊语冠词另译出来。
- source_word: πορεύεται
  choice: 前行
  rationale: 保留光被差遣后行进的动态意象，也维持原文对光的拟人化描写。
- source_word: ἐκάλεσεν αὐτό
  choice: 他召唤光
  rationale: “召唤”体现上帝发令、光作出回应的关系；重复“光”比使用可能指代不清的代词更符合现代汉语。
- source_word: ὑπήκουσεν αὐτῷ
  choice: 光便……服从他
  rationale: ὑπακούω在这里表示听命、顺从；“服从”清楚呈现受造界响应上帝命令的含义。
- source_word: τρόμῳ
  choice: 战战兢兢地
  rationale: 工具或方式意义的与格在此作副词性表达；该措辞保留原文鲜明的颤抖、敬畏意象。
theological_decisions:
- issue: 光被拟人化为前行、受召唤并服从上帝
  choice: 在正文中直接保留拟人化描写
  alternative: 改写为非人格化的自然秩序描述
  rationale: 原文明确赋予光以行动和顺服的反应，强调受造界处于上帝主权之下；不宜把这一诗性张力弱化。
- issue: 带冠词分词ὁ ἀποστέλλων的所指与句法形式
  choice: 译作“他发出”，以上下文中的上帝为主语
  alternative: 较形式化地译作“那发出光的那一位”
  rationale: 该分词虽可作为称谓式描述，但上下文已明确所指；汉语有限动词句更流畅，且没有加入原文之外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保持原文两组动作之间的平行关系，并重复“光”以避免汉语代词含混。脚注标记置于整节末尾，对应全句开头句法的形式性异译。
