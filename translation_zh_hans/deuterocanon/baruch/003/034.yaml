base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/034.yaml
  text: And the stars shone in their watches and rejoiced;[a]
translation:
  language: zh_hans
  text: 群星在各自的守望中发光，并且欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望”也可译作“值更之时”、“各自的位置”或“各自的岗位”。希腊语 φυλακαί 本义可涉及守望、值更时段或守卫岗位；这里以诗意方式指群星受命所在的位置或时段。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: 群星
  rationale: 复数名词，指天上的众星；“群星”自然凝练，也适合诗歌语体。
- source_word: ἔλαμψαν
  choice: 发光
  rationale: λάμπω 的简单过去时，表示发出光辉；“发光”准确而自然，不额外强化为“闪耀”。
- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: 在各自守望之处
  rationale: φυλακαί 可指守望、值更时段或守卫岗位。此处是诗意的宇宙图景；译作“守望之处”保留原文的守望意象和地点／时段之间的含混，且以“各自”表达 αὐτῶν 所指的分属关系。
- source_word: εὐφράνθησαν
  choice: 欢然喜乐
  rationale: 该动词表示欢喜、快乐；“欢然喜乐”保留群星拟人化的诗意，并符合庄重而易懂的现代汉语。
theological_decisions:
- issue: 群星的拟人化
  choice: 直接保留群星“欢然喜乐”的拟人表达
  alternative: 改写为纯粹的天文现象，不赋予群星喜乐
  rationale: 希腊文明确说群星喜乐，呈现受造界响应秩序的诗意图景；不应将这种文学和神学张力消解为非人格化叙述。
translation_notes:
  register: 采用现代、庄重而富有诗意的简体中文。“群星”与“欢然喜乐”保留经文的拟人色彩；“守望之处”刻意保留 φυλακαί 在地点与时段之间的语义开放性。
