  text: for you remain seated forever, and we are perishing forever.
translation:
  language: zh_hans
  text: 因为你永远安坐[a]，我们却永远走向灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远坐着。”这里也可能含有“永远坐在宝座上”的意思，但希腊文没有明说“宝座”。
    reason: 说明 καθήμενος 的直译及其可能含有、却未明确说出的王权意象。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上下文，说明祈求的理由，保留原文的因果关系。
- source_word: σὺ
  choice: 你
  rationale: 保留原文显明的主语及强调作用，与后句的“我们”形成鲜明对照。
- source_word: καθήμενος
  choice: 安坐
  rationale: 保留“坐着”的基本意象，并以自然庄重的中文表达持续、稳固的状态；不在正文中擅自补出原文没有明说的“宝座”。
- source_word: τὸν αἰῶνα
  choice: 永远
  rationale: 按表示持续时间的惯用法翻译，并在前后两句中一致处理，以保留修辞上的平行和张力。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留显明的主语，使神的恒久与群体的灭亡形成直接对照。
- source_word: ἀπολλύμενοι
  choice: 走向灭亡
  rationale: 表达现在分词所呈现的持续过程，同时保留“毁灭、丧亡、败亡”之间的语义宽度，避免限定灭亡的具体方式。
theological_decisions:
- issue: 是否把 καθήμενος 明译为坐在宝座上或掌权
  choice: 正文译作“安坐”
  alternative: “永远坐着”或“永远坐在宝座上”
  rationale: 对神而言，坐着可能含有在宝座上掌权的意味，但希腊文没有明说“宝座”。正文保留原词意象，不把隐含的王权意味提升为明确陈述。
- issue: 如何处理两次 τὸν αἰῶνα 所形成的神学张力
  choice: 两处均译作“永远”
  alternative: 第二处译作“不住地”或“长久地”
  rationale: 原文有意重复同一短语，将神的恒久与人的持续灭亡并置。统一译法保留这种尖锐而不易化解的对照，不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“安坐”比“坐着”更适合对神的称述，但仍未明确增添宝座意象；“走向灭亡”呈现持续过程，并保留原文两次“永远”造成的强烈张力。
