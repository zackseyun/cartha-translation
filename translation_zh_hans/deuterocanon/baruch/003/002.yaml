  text: Hear, Lord, and have mercy, because we have sinned against you;
translation:
  language: zh_hans
  text: 主啊，求你垂听，求你怜悯，因为我们得罪了你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄκουσον
  choice: 求你垂听
  rationale: 该词是命令式“听”，祷告语境中用“求你垂听”既准确传达恳求，也符合现代汉语庄重而自然的表达。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格称呼，以“啊”自然呈现直接呼求。
- source_word: ἐλέησον
  choice: 求你怜悯
  rationale: 准确表达命令式恳求“施怜悯”，并与前句形成平行结构。
- source_word: ὅτι
  choice: 因为
  rationale: 按此处最自然的因果用法翻译，说明恳求怜悯的缘由。
- source_word: ἡμάρτομεν ἐναντίον σου
  choice: 我们得罪了你
  rationale: ἁμαρτάνω结合ἐναντίον σου表示在对方面前或针对对方犯罪；汉语“得罪了你”简洁自然，并保留罪指向上帝的关系性含义。
theological_decisions:
- issue: 犯罪表述的对象与方向
  choice: 我们得罪了你
  alternative: 我们在你面前犯了罪
  rationale: 两种译法均可反映ἐναντίον σου；正文采用更自然直接的“得罪了你”，不额外限定罪仅是内在、礼仪或法律层面的概念。
- issue: ὅτι的逻辑关系
  choice: 因为
  alternative: 原来／既然
  rationale: 此处直接保留因果关系，不把认罪与求怜悯之间的神学张力改写为条件或结果。
translation_notes:
  register: 采用现代标准普通话的庄重祷告语体；两次“求你”使并列祈求清楚流畅。全文无须脚注。
