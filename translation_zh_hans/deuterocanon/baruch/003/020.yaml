  yaml_path: translation/deuterocanon/baruch/003/020.yaml
  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
translation:
  language: zh_hans
  text: 年轻人见了光，住在地上，却不知道知识之道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译为“较年轻的人”或“较年轻的一代”；希腊文为阳性复数。“见了光”直译为“看见光”，可能含有活着或享受生命的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  choice: 年轻人
  rationale: 该比较级形容词在此作名词用，指相对于前代而言较年轻的一代。希腊语为阳性复数，但现代汉语“年轻人”通常不标明语法性别，既自然也不排除原文可能主要指男性的语境。
- source_word: εἶδον φῶς
  choice: 见过光
  rationale: 直译原文的具体意象，同时保留它可能暗示活着或享受生命的含义，不在正文中把隐喻解释死。
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  choice: 住在地上
  rationale: κατοικέω表示居住，γῆ在这里宜取广义的“地上”，而非局部性的“土地”。
- source_word: ὁδὸν
  choice: 道
  rationale: 保留“道路、途径”的隐喻；“知识之道”在现代汉语中简洁而庄重。
- source_word: ἐπιστήμης
  choice: 知识
  rationale: ἐπιστήμη在智慧文学语境中表示知识或明悟；“知识”是最直接且不额外解释的译法。
- source_word: οὐκ ἔγνωσαν
  choice: 不知道
  rationale: 直接表达γινώσκω的基本意义，不增添“学习”或“承认”等原文未明确表达的含义。
theological_decisions:
- issue: “见光”在智慧文学语境中的习语含义
  choice: 正文保留具体意象“见过光”
  alternative: 活过；享受过生命
  rationale: 该短语可能暗指活着或经历人生，但希腊文直接使用“见光”的意象。保留意象可维护诗性及语义张力，脚注说明可能的习语含义。
- issue: νεώτεροι的性别表达
  choice: 译作“年轻人”
  alternative: 年轻男子；较年轻的一代
  rationale: 希腊语形式是阳性复数，但汉语名词通常没有语法性别。“年轻人”最自然地表达其年龄对比，不无根据地把所指限定为男性；以脚注交代原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的表达。以“知识之道”保留智慧文学中的道路隐喻；“也……却……”清楚呈现两个陈述与转折。脚注标记置于相关分句之后，并合并说明“年轻人”与“见过光”的词义问题。
