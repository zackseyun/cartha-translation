  text: nor was it heard in Canaan[a], nor was it seen in Teman;
translation:
  language: zh_hans
  text: 在迦南也没有人听说过它[a]，在提幔也没有人见过它；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上下文所谈的智慧；希腊文本节省略了主语。
    reason: 说明原文的省略以及代词在上下文中的所指。
lexical_decisions:
- source_word: οὐδὲ
  choice: 也没有
  rationale: 承接上文的否定，并连接两个并列分句；现代汉语用“也没有……也没有……”自然地保留累加否定的力量。
- source_word: ἠκούσθη
  choice: 没有人听说过
  rationale: 这是ἀκούω的不定过去时被动式。此处语境谈智慧不为当地所知，译作“没有人听说过”比单纯“没有被听见”更符合汉语表达，同时未将其进一步解释为“找到”或“认识”。
- source_word: ἐν
  choice: 在
  rationale: 这里标示地理处所，直译为“在”自然准确。
- source_word: Χαναὰν
  choice: 迦南
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: ὤφθη
  choice: 没有人见过
  rationale: 这是ὁράω的不定过去时被动式；“没有人见过”保留视觉意象，并与前句形成平行。
- source_word: Θαιμάν
  choice: 提幔
  rationale: 采用现代中文圣经传统中通行的地名译法，所指通常与以东地区相关。
theological_decisions:
- issue: 两个被动动词所隐含的主语
  choice: 正文以代词“它”承接上下文，并用脚注说明所指为智慧
  alternative: 在正文中明确补出“智慧”
  rationale: 希腊文没有在本节重述主语，而是依靠上下文承接。中文若完全省略宾语会显得突兀，因此以“它”保留指代关系，同时不把上下文中的名词直接增补进正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“没有人听说过它／没有人见过它”将希腊文被动结构转换为汉语常用的主动泛指结构，保留两句的平行关系与原文含义。
