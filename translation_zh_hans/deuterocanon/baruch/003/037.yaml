  text: He found every way of knowledge[a], and gave it to Jacob his servant and to Israel his beloved.
translation:
  language: zh_hans
  text: 他寻得了知识的一切道路，并把它赐给他的仆人雅各[a]，赐给他所爱的以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“孩子”或“儿子”；希腊语παῖς兼有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεῦρεν
  choice: 探明了
  rationale: 该复合动词含发现、查明之意；“探明”比单纯“找到”更能表达主动探知并完全知晓，同时符合本节的知识语境。
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: 知识的一切道路
  rationale: 保留ὁδός“道路”的比喻和πᾶσαν的完整范围；ἐπιστήμη直译为“知识”，不改作希腊文未使用的“智慧”。
- source_word: ἔδωκεν αὐτήν
  choice: 把这一切赐给
  rationale: “赐给”适合上帝向其子民施予的语境；“这一切”自然回指前文“知识的一切道路”，并避免汉语中以单数代词回指集合表达的生硬。
- source_word: τῷ παιδὶ αὐτοῦ
  choice: 他的仆人
  rationale: παῖς可指仆人、孩子或儿子；在雅各与上帝的盟约关系中，“仆人”最符合经文惯用语，但以脚注保留词义歧义。
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: 他所爱的
  rationale: 贴近被动分词“被他所爱者”的关系含义，现代汉语自然，也不额外界定这种爱的性质。
- source_word: Ἰακὼβ ... Ἰσραήλ
  choice: 雅各……以色列
  rationale: 完整保留原文以两个名称构成的平行结构，不将其合并或解释性改写为单一称谓。
theological_decisions:
- issue: 雅各与上帝关系中的παῖς如何译出
  choice: 仆人
  alternative: 孩子；儿子
  rationale: 盟约语境支持“仆人”，但希腊词本身也可表示孩子或儿子，因此用脚注明示真实的词义张力。
- issue: 是否合并“雅各”和“以色列”
  choice: 保留两个名称及平行结构
  alternative: 合并为“雅各（以色列）”或只译“以色列”
  rationale: 原文刻意并列两个名称；保留该形式可呈现其文学结构和拣选语言，而不预先消解二者的指称关系。
- issue: 是否把知识的“道路”解释为律法或智慧
  choice: 保留“知识的一切道路”
  alternative: 译作“全部律法”或“完整的智慧”
  rationale: 原文使用ὁδός与ἐπιστήμη，未明确说律法或使用σοφία；直保留其比喻及开放性，避免导入额外神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“探明”传达发现并查明的主动意味；“道路”保留原文隐喻；以“也赐给”呈现雅各与以色列的平行关系。
