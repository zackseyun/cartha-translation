base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/010.yaml
  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
translation:
  language: zh_hans
  text: 以色列啊，这是怎么回事？[a]你为什么身处仇敌之地？你在异乡衰老了，又与死人一同沾染了污秽。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这是怎么回事”也可译作“以色列啊，你怎么了？”原文是带有哀叹意味的问句。
    reason: lexical_alternative
  - marker: b
    text: “与死人一同沾染了污秽”既可能使人联想到因接触死人而成为礼仪上的不洁，也可能比喻以色列在流亡中仿佛与死人同列；原文容许这两层意味。
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν
  choice: 这是怎么回事
  rationale: 这是带有哀叹意味的问句。译文采用现代汉语习用表达，同时保留它与下一个明确表示“为什么”的问句之间的区别。
- source_word: ἐν γῇ τῶν ἐχθρῶν
  choice: 身处仇敌之地
  rationale: 希腊文没有明说“你的”，因此不补入物主关系；“仇敌之地”既贴近原文，又符合流亡语境。
- source_word: ἐπαλαιώθης
  choice: 渐渐衰老
  rationale: 该词表示变老、衰老；“渐渐”自然呈现长期滞留异乡所形成的状态，又不将意象改译为单纯的“疲惫”或“耗尽”。
- source_word: γῇ ἀλλοτρίᾳ
  choice: 在异乡
  rationale: ἀλλοτρίᾳ可指属于别人的或外来的地方；“异乡”是简洁、自然且庄重的现代汉语表达。
- source_word: συνεμιάνθης
  choice: 一同染了污秽
  rationale: 保留μιαίνω所含玷污、不洁的广义色彩，不限定为礼仪性或道德性的污秽。
- source_word: τοῖς νεκροῖς
  choice: 与死人
  rationale: 将与复合动词相连的与格译作关联意义的“与死人”，避免武断规定污秽究竟来自接触尸体，还是指流亡者仿佛列在死人之中。
theological_decisions:
- issue: “与死人一同染了污秽”的性质
  choice: 保留既可指礼仪性不洁、也可指在流亡中仿佛沦入死亡境地的双重回响
  alternative: 明确译作“因接触尸体而成为不洁”，或“被算在死人中”
  rationale: 希腊文允许礼仪污秽与象征性死亡两方面的联想；正文不将这种张力收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列啊”保留直接呼告；两个连续问句维持原文的哀叹节奏。正文避免补入原文未明说的“你的仇敌”，也不把“污秽”限定为某一种神学解释。
