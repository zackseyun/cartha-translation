base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/015.yaml
  text: Who found her place[a], and who entered into her treasuries?
translation:
  language: zh_hans
  text: 谁找到了她所在之处？谁又进入了她的宝库[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宝藏”。希腊文这个词既可指财宝本身，也可指收藏财宝的库房；这里因说“进入”，正文译作“宝库”。
    reason: 保留 θησαυρός 在内容义与地点义之间的词义歧义。
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 直接保留反问代词的简洁力度；第二问加“又”，自然表达希腊文 καί 的承接作用。
- source_word: εὗρεν
  choice: 找到了
  rationale: 以现代汉语完成体表达不定过去时所述的寻找结果，不强化为“发现”而引入额外意味。
- source_word: τὸν τόπον αὐτῆς
  choice: 她所在之处
  rationale: τόπος 基本义为“地方、所在”；此译既保留智慧所在何处的空间意象，也避免把它明确解释为住所。
- source_word: εἰσῆλθεν εἰς
  choice: 进入了
  rationale: 准确表达向内进入的动作，在现代汉语中简洁自然。
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: 她的宝库
  rationale: θησαυρός 既可指财宝，也可指收藏财宝的库房；因动词是“进入”，此处采用地点义“宝库”最符合句法和意象。
- source_word: αὐτῆς
  choice: 她
  rationale: 上下文将智慧人格化，使用女性第三人称代词可保留希腊文阴性形式所承载的文学形象。
theological_decisions:
- issue: 智慧的人格化
  choice: 以“她”指智慧
  alternative: 以“它”指抽象的智慧
  rationale: 希腊文使用阴性代词，且上下文把智慧人格化；“她”保留这一文学—神学表达，但不进一步界定智慧的身份。
- issue: θησαυρούς 的空间义与内容义
  choice: 译作“宝库”
  alternative: 译作“宝藏”
  rationale: “进入”更自然地以库房等空间为宾语，因此正文采用“宝库”；同时以脚注保留该词也可指财宝本身的真实歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两个反问分句分别成问，以清楚呈现原文的平行结构；“所在之处”和“宝库”保留空间意象，“她”保留智慧的人格化。
