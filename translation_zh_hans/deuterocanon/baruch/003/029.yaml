base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/029.yaml
  text: Who has gone up into heaven and taken her[a], and brought her down from the clouds?
translation:
  language: zh_hans
  text: 谁曾升到天上取得她[a]，又把她从云中带下来呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指上下文中被女性拟人化的智慧。
    reason: 说明阴性代词的所指，并保存原文对智慧的女性拟人。
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 直接引出反问，简洁自然，不增添原文没有的强调。
- source_word: ἀνέβη εἰς τὸν οὐρανὸν
  choice: 曾升到天上
  rationale: “升到天上”保留向上进入天界的空间意象；“曾”使不定过去时在汉语反问中表达得自然，但不把时态过度具体化。
- source_word: ἔλαβεν αὐτήν
  choice: 取得她
  rationale: λαμβάνω在这里可指取到、获得；“取得”兼顾动作及获得智慧之意，而“她”保留阴性代词及上下文中智慧的女性拟人。
- source_word: κατεβίβασεν αὐτὴν
  choice: 把她……带下来
  rationale: 保留使之下来的使役意义；“带下来”比单说“降下”更能体现主体施行动作。
- source_word: ἐκ τῶν νεφελῶν
  choice: 从云中
  rationale: 忠实保留复数云彩所构成的天上意象；现代汉语用“云中”比“众云之中”更自然庄重。
theological_decisions:
- issue: 指向智慧的阴性代词
  choice: 译作“她”
  alternative: 译作“它”
  rationale: 希腊文两次使用阴性代词αὐτήν，与上下文中女性拟人化的智慧相呼应；译作“她”保存原文的文学和神学张力，而不把智慧仅处理为抽象事物。
- issue: 取得智慧的动作含义
  choice: 译作“取得她”
  alternative: 译作“领受她”或“抓住她”
  rationale: “领受”可能引入赐予者的解释，“抓住”则语气过强；“取得”较中性地涵盖λαμβάνω在此处的取到或获得之意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句保留原文的平行结构；以“曾”自然承载过去动作，以“她”呈现智慧的女性拟人。
