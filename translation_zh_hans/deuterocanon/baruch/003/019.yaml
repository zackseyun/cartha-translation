base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/019.yaml
  text: They vanished and went down to Hades[a], and others rose up in their place.
translation:
  language: zh_hans
  text: 他们消逝了，下到阴间[a]；另一些人起来，取代了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冥府”或“坟墓”。希腊文为“哈得斯”，指死者所在之境。
    reason: 说明ᾅδης的词义范围，并避免将“阴间”误读为后世教义中特指的刑罚之地。
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: 消逝了
  rationale: 该词在这里表示从世上消失、不复存在；“消逝了”保留结果意味，又不武断地限定其具体死法。
- source_word: εἰς ᾅδου
  choice: 到阴间
  rationale: ᾅδης指死者所在之境。“阴间”是现代汉语圣经语境中自然且庄重的对应，也避免把它误解为后世教义中的刑罚之地。
- source_word: κατέβησαν
  choice: 下到
  rationale: 保留原文明确的向下运动，同时与“阴间”搭配自然。
- source_word: ἄλλοι
  choice: 另一些人
  rationale: 原文仅指另一些人，没有进一步说明其身份；译文不增添限定。
- source_word: ἀντανέστησαν
  choice: 起来
  rationale: 保留“起身、兴起”的动词意象；结合下句可见这里说的是继起者，并非死而复活。
- source_word: ἀντʼ αὐτῶν
  choice: 取代了他们
  rationale: ἀντί加属格表达替代或接续；此译清楚传达后来者占据前人位置的意思。
theological_decisions:
- issue: 次经智慧文学语境中ᾅδης的译法
  choice: 阴间
  alternative: 冥府；坟墓；音译“哈得斯”
  rationale: 希腊文本使用ᾅδης，指死者所在之境。“阴间”既传达这一含义，也不把它窄化为个别坟墓，或引入关于“地狱”刑罚的后期教义含义；脚注保留希腊词及其他可能译法。
- issue: ἀντανέστησαν是否带有复活含义
  choice: 起来
  alternative: 兴起；继而出现
  rationale: 保留原文“起来”的形象，同时由“取代了他们”限定为世代更替，不将此处解释为复活事件。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“消逝了……另一些人起来”保留原文简洁而富有对照的节奏；分号凸显前人消失与后人继起之间的平行关系。
