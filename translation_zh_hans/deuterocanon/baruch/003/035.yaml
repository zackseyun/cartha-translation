base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/035.yaml
  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
translation:
  language: zh_hans
  text: 他召唤它们[a]，它们说：“我们在这里。”[b] 它们欢欢喜喜地向创造它们的那一位发光。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”承接上文的天体或星辰；这里把它们描写成能回应创造者召唤的受造物。
    reason: cross_reference
  - marker: b
    text: 或译：“我们在场。”前半句也可译作：“他召唤它们，它们便回答……”
    reason: lexical_alternative
  - marker: c
    text: 也可译作“为创造它们的那一位而发光”或“在创造它们的那一位面前发光”；希腊语与格在此容许不止一种关系语气。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 召唤
  rationale: καλέω在此表示发出呼唤；“召唤”既贴近原文，也能自然引出受召者的回应。
- source_word: αὐτούς
  choice: 它们
  rationale: 阳性复数代词承接上文所说的天体或星辰；汉语用“它们”指代这些被拟人化的受造物。
- source_word: εἶπον
  choice: 就说
  rationale: 原词直译为“说”；“就”显明这是对召唤的即时回应，同时不把动词本身改译为较具解释性的“回答”。
- source_word: Πάρεσμεν
  choice: 我们在这里
  rationale: πάρεσμεν表示在场、已经来到或预备听命；“我们在这里”是现代汉语中自然的应召语。
- source_word: ἔλαμψαν
  choice: 发光
  rationale: λάμπω表示照耀或发光；“发光”清楚传达星辰的明亮行动。
- source_word: μετʼ εὐφροσύνης
  choice: 满怀喜乐
  rationale: εὐφροσύνη表示喜乐、欢欣；此译保留伴随发光之情态，并符合本段诗意语体。
- source_word: τῷ ποιήσαντι αὐτούς
  choice: 为创造它们的那一位
  rationale: 分词短语指创造这些星辰者；与格可表达受益、对象或朝向。“为”在正文中自然，却以脚注保留其他可能语气。
theological_decisions:
- issue: 天体回应创造者召唤的拟人表达
  choice: 直接保留星辰说话并喜乐发光的拟人描写
  alternative: 把经文改写为非人格化的天文现象描述
  rationale: 希腊文明确让这些天体回应召唤并发光；译文应保存其诗意和神学张力，不将其化约为单纯的自然现象。
- issue: τῷ ποιήσαντι αὐτούς中与格的关系
  choice: 正文译作“为创造它们的那一位”
  alternative: 译作“向着创造它们的那一位”或“在创造它们的那一位面前”
  rationale: 希腊语与格未精确限定此处是受益、朝向还是在场关系；正文采用流畅的可能译法，并用脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，保留原文简洁的排比和星辰拟人化的诗意。“那一位”避免增添原文没有明说的称号，同时在语境中自然指向创造者。
