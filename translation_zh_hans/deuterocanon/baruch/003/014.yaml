base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
translation:
  language: zh_hans
  text: 你要了解明智在哪里，力量在哪里，悟性在哪里，好让你同时知道长寿[a]和生命在哪里，眼目的光[b]与平安在哪里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长寿”也可译作“长久的年日”；希腊词μακροβίωσις指寿命长久。
    reason: lexical_alternative
  - marker: b
    text: “眼目的光”是按原文直译保留的比喻，可能使人联想到活力、喜乐或清明。
    reason: lexical_alternative
lexical_decisions:
- source_word: μάθε
  choice: 你要明白
  rationale: 这是μανθάνω的不定过去时命令式，要求听者学习并认识；“你要明白”在现代汉语中自然，并保留劝令语气。
- source_word: φρόνησις
  choice: 明智
  rationale: 该词侧重实际判断力和审慎的智慧；译作“明智”可与后文σύνεσις所指的“悟性”保持区别。
- source_word: ἰσχύς
  choice: 力量
  rationale: 该词表示力量、强力；“力量”含义直接，也不过度强化为权能。
- source_word: σύνεσις
  choice: 悟性
  rationale: 该词表示理解、领悟的能力；“悟性”既简明，又不与φρόνησις的“明智”混同。
- source_word: τοῦ γνῶναι
  choice: 好让你……知道
  rationale: 带冠词的不定式在此可表示目的或结果；译文采用目的表达，同时不添加原文没有的内容。
- source_word: ἅμα
  choice: 同时
  rationale: 保留这些福分一并被认识的意味。
- source_word: μακροβίωσις
  choice: 长寿
  rationale: 该词直接表示寿命长久；“长寿”是现代汉语中自然、准确的对应表达。
- source_word: ζωή
  choice: 生命
  rationale: 采用该词在此处的基本义，并与“长寿”保持并列。
- source_word: φῶς ὀφθαλμῶν
  choice: 眼目的光
  rationale: 按希腊文属格结构保留“眼目的光”这一比喻，不将其解释性地改写为活力、喜乐或清明。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”既保留εἰρήνη的和平含义，也能承载圣经语境中安稳、完好的意蕴，而不扩大为原文未明说的繁荣。
theological_decisions:
- issue: 智慧相关词语是否合并
  choice: 将φρόνησις、ἰσχύς、σύνεσις分别译为“明智”“力量”“悟性”。
  alternative: 将φρόνησις和σύνεσις都译为“智慧”或“理解”。
  rationale: 原文列举彼此相关但并不相同的善，保留词语差异可避免把经文的层次压平。
- issue: μακροβίωσις καὶ ζωή的表达
  choice: 译为“长寿和生命”。
  alternative: 译为“长久的年日和生命”或“长寿与福乐”。
  rationale: 希腊文分别说寿命长久与生命本身；“长寿和生命”准确自然，也不擅自加入“福乐”或“兴盛”。
- issue: φῶς ὀφθαλμῶν的比喻是否解释化
  choice: 保留为“眼目的光”。
  alternative: 解释为“活力”“喜乐”或“清明”。
  rationale: 这一比喻可能包含多重意蕴，正文不应限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“在哪里”以保存原文连续追问的修辞节奏；智慧词汇彼此区分，并保留“眼目的光”的开放性比喻。
