lexical_decisions:
- source_word: μέγας
  choice: 广大
  rationale: 此处是无系词的谓语形容词，描述上下文中的智慧。“广大”兼顾规模宏大与庄严感，又避免把含义限于能力上的“大能”。
- source_word: οὐκ ἔχει τελευτήν
  choice: 无穷尽
  rationale: 希腊文直译为“没有终点／尽头”。“无穷尽”自然凝练，也保留持续无尽的意思；脚注列出更贴近句法的译法。
- source_word: ὑψηλός
  choice: 高远
  rationale: 既表达“高”，又以合宜的诗体语感传达其崇高、辽远之意，而不额外加入“受尊崇”的神学评价。
- source_word: ἀμέτρητος
  choice: 不可测量
  rationale: 直接表达不能被度量，保留范围上的开放性，不将其缩窄为数量上的“不可胜数”。
theological_decisions:
- issue: 由上下文承接的所指
  choice: 保留无显明主语的诗体描述，不补出“她”或“智慧”。
  alternative: 在句首补译“她”或“智慧”。
  rationale: 希腊文本节仅有谓语形容词和短语，没有明说主语；上下文已交代所指。省略主语既忠于原文，也保留简洁有力的诗体。
translation_notes:
