translation:
  language: zh_hans
  text: 列国的统治者和统辖地上兽类[a]的人在哪里？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兽类”也可译为“野兽”。希腊文 θηρίων 可泛指兽类，或较具体指野兽。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: 在哪里
  rationale: 直接表达询问所在或现今境况的疑问词；结合本节修辞语气，用“如今在哪里”自然传达追问意味，而不改变基本含义。
- source_word: οἱ ἄρχοντες τῶν ἐθνῶν
  choice: 列国的统治者
  rationale: ἄρχοντες 指掌权者，ἐθνῶν 在这里指政治意义上的各国或各族；“列国的统治者”准确、庄重，也符合现代汉语。
- source_word: οἱ κυριεύοντες
  choice: 那些统辖……的人
  rationale: 该分词表示对某对象行使权柄或支配；“统辖”保留权力与管治意味，又比“支配”更符合经文语体。
- source_word: τῶν θηρίων
  choice: 走兽
  rationale: θηρίων 可泛指兽类，也常偏指野兽；“走兽”在现代中文圣经语体中自然，并保留一定的类别宽度。
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: 地上
  rationale: 该短语修饰兽类，具有明确的处所意义；“地上走兽”简洁自然。
