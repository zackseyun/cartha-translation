translation:
  language: zh_hans
  text: 上帝没有拣选这些人，也没有把知识之道赐给他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο ὁ θεός
  choice: 上帝没有拣选这些人
  rationale: τούτους是阳性复数指示代词，承接上文所说的特定人物；译作“这些人”既保留指示性，也符合现代汉语。ἐξελέξατο直译为“拣选”，保留经文庄重语体。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 连接两个否定分句；“也没有”在现代汉语中自然地表达并列否定，不额外增强转折意味。
- source_word: ὁδὸν ἐπιστήμης
  choice: 知识之道
  rationale: 保留属格结构“知识的道路/知识之道”的开放性，不把它明确解释为“通往知识的道路”。“之道”也符合智慧文学语境。
- source_word: ἔδωκεν αὐτοῖς
  choice: 把……赐给他们
  rationale: ἔδωκεν表示“给”；在上帝为主语的庄重经文语体中，“赐给”自然，但不引入原文没有的额外神学含义。αὐτοῖς明确译为“他们”。
theological_decisions:
- issue: τούτους应保留指示意味，还是简化为普通代词
  choice: 这些人
  alternative: 他们
  rationale: 指示代词具体指向上文所述的人物。译作“这些人”保留原文的修辞指向，同时不武断限定其身份。
- issue: ὁδὸν ἐπιστήμης是“知识之道”还是“通往知识的道路”
  choice: 知识之道
  alternative: 通往知识的道路
  rationale: 希腊文属格既可表示以知识为特征的道路，也可能在语境中含有通向知识的意味；正文采用较形式对应的表达，以保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“拣选”保留圣经语体，“知识之道”呼应智慧文学表达；全句结构简洁，并保持两个否定分句的平行。
