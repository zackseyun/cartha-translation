base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/005.yaml
  text: Do not remember the unrighteous acts of our fathers[b][a], but remember your hand and your name at this time.
translation:
  language: zh_hans
  text: 不要记念我们列祖的不义[a]，却要在此时记念你的手[b]和你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”也可译作“恶行”或“不义的行为”。
    reason: lexical_alternative
  - marker: b
    text: “你的手”是圣经惯用意象，可表示你的能力或大能作为。
    reason: cultural_note
lexical_decisions:
- source_word: μὴ μνησθῇς
  choice: 不要记念
  rationale: 保留对上帝的祈求语气，并与后面的 μνήσθητι（“记念”）形成原文刻意的反复与对照。
- source_word: ἀδικιῶν
  choice: 不义
  rationale: 概括道德和宗教层面的错误行为，不把含义限缩为社会层面的“不公”，也不直接换成更具体的“罪”。
- source_word: πατέρων ἡμῶν
  choice: 我们祖先的
  rationale: πατέρων 在此指先辈、前代之人；现代汉语用“祖先”自然清楚，也不误解为仅指各人的生父。
- source_word: μνήσθητι
  choice: 记念
  rationale: 与前句的“不要记念”使用同一动词，保存修辞对照；“记念”也符合庄重的祷告语体。
- source_word: χειρός σου
  choice: 你的手
  rationale: 直译“手”，保留圣经中可指能力或大能作为的意象，并避免在正文中将其意义单一化。
- source_word: ὀνόματός σου
  choice: 你的名
  rationale: 保留圣经惯用表达，使身份、声誉与盟约荣誉等可能含义继续并存。
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: 在此时
  rationale: 自然表达当前的时刻与处境，同时保留祷告中的紧迫感。
theological_decisions:
- issue: “记念你的手和你的名”的含义
  choice: 正文保留“手”和“名”，呈现求上帝顾念自己的大能、作为及其身份与荣誉，并据此施行拯救的祷告意涵。
  alternative: 解释性译为“彰显你的能力，维护你的名誉”。
  rationale: 希腊文使用凝练的圣经意象，未明说具体行动；直译可保留盟约含义与一般性的能力、身份含义之间的张力，避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“记念”前后重复，以保存希腊文的对照；“却”清楚呈现 ἀλλά 的转折。所有脚注标记均置于相关词语之后。
