base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/010.yaml
  text: For behold[a], the captivity of my sons and daughters[b], which the Everlasting One brought upon them.
translation:
  language: zh_hans
  text: 因为，看哪，我儿子和女儿所遭受的被掳[a]，是永恒者[b]使之临到他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被掳的处境”或“流亡”。希腊语αἰχμαλωσία可指被征服后被掳的处境，也可包括被强制迁徙、流亡。
    reason: lexical_alternative
  - marker: b
    text: 或译“永在者”。希腊语在这里使用神圣称号ὁ αἰώνιος，直译为“永恒的那一位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意的提示语；“看哪”既保留原文的郑重语气，也为现代汉语读者所理解。
- source_word: γὰρ
  choice: 因为
  rationale: 表示本句为上文提供解释或依据；“因为”保留了这一承接关系。
- source_word: τὴν αἰχμαλωσίαν
  choice: 被掳
  rationale: 该词指因征服而遭受的被俘、掳掠或流亡；译作“被掳”自然简洁，并突出强制性。
- source_word: τῶν υἱῶν μου καὶ τῶν θυγατέρων
  choice: 我的儿子和女儿
  rationale: 原文分别提到儿子与女儿，因此不概括为“儿女”或“孩子”，以保留明确的成对表达。
- source_word: ἐπήγαγεν αὐτοῖς
  choice: 使他们遭受的
  rationale: ἐπάγω在此表示使某事临到某人；“使他们遭受”保留其使动含义，也符合苦难语境。
- source_word: ὁ αἰώνιος
  choice: 永恒者
  rationale: 原文以形容词名词化构成神圣称号，直指“永恒的那一位”；“永恒者”不擅自补入“神”或改作“主”。
theological_decisions:
- issue: 神圣称号ὁ αἰώνιος的译法
  choice: 永恒者
  alternative: 永在者；永恒的那一位；永恒的神
  rationale: 保留原文独特的神圣称号，不将其归一化为“主”，也不补入希腊文没有的“神”；“永恒者”简洁、庄重，并保留其名词化形容词的形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留呼告色彩；分句处理避免为原文无动词的名词结构擅自加入“我看见”。脚注标记分别紧随其所解释的“被掳”和“永恒者”。
