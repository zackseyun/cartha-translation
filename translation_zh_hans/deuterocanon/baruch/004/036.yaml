  text: Look toward the east, Jerusalem, and see the joy that is coming to you from God.
translation:
  language: zh_hans
  text: 耶路撒冷啊，要向东方眺望，看那从上帝那里临到你的喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίβλεψαι
  choice: 要……眺望
  rationale: 该词为不定过去时中间语态命令式，在此是吩咐耶路撒冷转目观看。“眺望”自然体现朝某方向远望的动作，并保留命令语气。
- source_word: πρὸς ἀνατολάς
  choice: 向东方
  rationale: ἀνατολαί可指“升起之处”或“东方”；本句以方向意义为主，“向东方”清楚而自然。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代汉语通行的圣经地名译法。
- source_word: ἴδε
  choice: 看
  rationale: 保留不定过去时命令式的直接呼唤；“看”简洁、现代，不采用较古雅的“看哪”。
- source_word: εὐφροσύνην
  choice: 喜乐
  rationale: 该词表示欢喜、快乐；“喜乐”既符合庄重语体，也为普通读者所熟悉。
- source_word: τὴν παρὰ τοῦ θεοῦ
  choice: 那从上帝那里
  rationale: παρά接属格表示来源，“从上帝那里”明确保留喜乐的来源。
- source_word: σοι
  choice: 你的
  rationale: 与ἐρχομένην的趋向意义结合，译作“临到你的”，自然表达这喜乐正朝拟人化的耶路撒冷而来。
- source_word: ἐρχομένην
  choice: 临到
  rationale: 现在分词描写正在到来的喜乐。“临到”既表达趋近和到来，也符合本句庄重的先知性语境。
theological_decisions:
- issue: 耶路撒冷的拟人化
  choice: 保留对耶路撒冷的直接称呼，并使用第二人称“你”
  alternative: 将耶路撒冷仅作为地点，改写为较抽象的陈述
  rationale: 希腊文直接呼唤耶路撒冷，并连续使用命令式和第二人称单数。保留拟人化可呈现原文的诗性与先知性力量。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶路撒冷啊”明确直接呼语；“眺望”与“看”分别呈现两个命令词，避免合并；句序尽量贴近希腊文，同时保持汉语流畅。
