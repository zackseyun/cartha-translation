  text: Wretched are those who harmed you and rejoiced at your fall,[a]
translation:
  language: zh_hans
  text: 那些伤害你、又因你的倾覆而欢喜的人，真可悲！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些伤害你、又因你的败亡而幸灾乐祸的人，真可悲！”希腊文直译为“为你的倒下而欢喜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιοι
  choice: 有祸了
  rationale: 此词在这里表达悲惨、可怜的处境，并带有宣告祸患的语气；译作“有祸了”比“可怜”更符合本句对敌对者的严肃宣告，同时不将其过度解释为正式咒诅。
- source_word: οἱ σε κακώσαντες
  choice: 那些伤害你的人
  rationale: κακόω表示加害、虐待或使人受苦；“伤害”自然简洁，也保留了原词涵盖各种加害行为的宽度。
- source_word: ἐπιχαρέντες
  choice: 因……而欢喜
  rationale: 该分词表示因某事而高兴，语境中是对他人遭难幸灾乐祸；正文采用较直接的“欢喜”，敌意由后面的“你的倾覆”体现。
- source_word: τῇ σῇ πτώσει
  choice: 因你的倾覆
  rationale: πτῶσις本义为“倒下、坠落”，此处喻指耶路撒冷的败亡；“倾覆”既保留倒下的意象，也适合城邑衰败的语境。
