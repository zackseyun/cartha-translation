  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: zh_hans
  text: 看哪，你所送走的儿子们来了；他们奉那圣者的话，从东到西被聚集而来，以上帝的荣耀为乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉那圣者的话”也可译作“借着那圣者的话”；这里的与格可表示对其话语的响应，也可表示所凭借的方式。“以上帝的荣耀为乐”也可译作“因上帝的荣耀而欢喜”；原文的与格可表示欢喜的对象、关联或缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的语气词，“看哪”既保留宣告感，也符合庄重而易懂的现代中文。
- source_word: οἱ υἱοί σου
  choice: 你的儿子们
  rationale: 原文明确使用阳性复数“儿子们”，故不泛化为“儿女”；在本段拟人化语境中指锡安被放逐的子民。
- source_word: οὓς ἐξαπέστειλας
  choice: 你送走的
  rationale: 保留动词“送出、送走”的基本意义和第二人称主语，不擅自改成被动的“被掳走”。
- source_word: ἔρχονται
  choice: 回来了／聚集而来
  rationale: 首处按归返语境译为“回来了”，次处结合分词和来源范围译作“聚集而来”，避免中文机械重复，同时保留两次ἔρχονται的强调。
- source_word: συνηγμένοι
  choice: 聚集
  rationale: 表达完成时被动分词所描写的聚合状态；中文句法中与“而来”自然衔接。
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: 从东到西
  rationale: 自然地保留涵盖全部地域的两极表达。
- source_word: τῷ ῥήματι τοῦ ἁγίου
  choice: 听从那圣者的话
  rationale: 将与格理解为对神圣话语或命令的响应；“那圣者”保留定冠词实体化的神圣称号。另以脚注保留工具性解释。
- source_word: χαίροντες
  choice: 欢喜
  rationale: 表达他们前来时伴随的喜乐状态，现代中文自然且庄重。
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: 因上帝的荣耀而欢喜
  rationale: 把与格译作欢喜的缘由或对象，中文清楚自然；脚注保留可译为“以……为乐”的关系。
theological_decisions:
- issue: τοῦ ἁγίου的神圣称号
  choice: 那圣者
  alternative: 圣者／至圣者
  rationale: 原文以带冠词的形容词实体化来指上帝。“那圣者”既明确其称号性质，又不添加原文没有的最高级含义。
- issue: τῷ ῥήματι的与格功能
  choice: 听从那圣者的话
  alternative: 借着那圣者的话
  rationale: 原文可以表示响应命令，也可以表示工具或媒介。正文采用符合归聚场景的响应义，脚注明示工具义，避免消除歧义。
- issue: τῇ τοῦ θεοῦ δόξῃ与χαίροντες的关系
  choice: 因上帝的荣耀而欢喜
  alternative: 以上帝的荣耀为乐
  rationale: 与格可表示喜乐的缘由、对象或所处关联。正文采用自然的原因表达，脚注保留对象性译法。
translation_notes:
  register: 采用现代、庄重、可朗读的普通话。“看哪”保留先知性宣告语气；“上帝”与输入咨询层一致。正文避免把流放责任改写为原文没有的被动式，并通过脚注保存两个与格结构的真实歧义。
