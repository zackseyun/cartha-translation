base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
translation:
  language: zh_hans
  text: 谁也不要因我遭难而幸灾乐祸[a]；我成了寡妇，被许多人撇下。因我儿女的罪，我已荒凉，因为他们偏离了上帝的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因我而欢喜。”这里的希腊词特指因别人遭难而欢喜。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ἐπιχαιρέτω μοι
  choice: 谁也不要因我遭难而幸灾乐祸
  rationale: μηδεὶς 加第三人称命令式表达禁止；ἐπιχαίρω 指因别人的不幸而欢喜。“幸灾乐祸”准确传达敌意性的喜悦，补出“因我遭难”使现代汉语搭配自然，但不增加具体灾情。
- source_word: τῇ χήρᾳ
  choice: 我成了寡妇
  rationale: 与第一人称代词同位，描述说话者如今的处境。汉语分句表达比直译为“对我这寡妇”更自然，并保留阴性自述及其拟人意味。
- source_word: καὶ καταλειφθείσῃ ὑπὸ πολλῶν
  choice: 被许多人撇下
  rationale: 保留被动含义以及 πολλῶν 的不定范围，不夸大为“被所有人遗弃”。“撇下”兼具离弃和留下不顾之意。
- source_word: ἠρημώθην
  choice: 我已荒凉
  rationale: 被动形式可表示陷入荒废、凄凉的状态；“荒凉”也保留城市与丧子母亲双重意象的张力。汉语不强行补明施事者。
- source_word: διὰ τὰς ἁμαρτίας τῶν τέκνων μου
  choice: 因我儿女的罪
  rationale: διά 加宾格表示原因；τέκνα 性别不限，译为“儿女”自然且不缩窄所指。
- source_word: διότι ἐξέκλιναν
  choice: 因为他们偏离了
  rationale: διότι 引出对前述“罪”的解释；ἐκκλίνω 保留偏离道路或规范的比喻。
- source_word: ἐκ νόμου θεοῦ
  choice: 上帝的律法
  rationale: ἐκ 表示从某一规范中偏离；结合前面的“偏离”，现代汉语无需另译“从”。“律法”符合庄重的经文语域。
theological_decisions:
- issue: 耶路撒冷／锡安作为寡妇和母亲的群体拟人
  choice: 保留第一人称女性自述，不在正文中补出“耶路撒冷”或“锡安”
  alternative: 在正文中明确说话者是耶路撒冷或锡安
  rationale: 希腊文本本节没有直接点名说话者，只借“寡妇”“我的儿女”和“荒凉”呈现拟人形象；由上下文辨认身份可避免把解释写进译文。
- issue: ἠρημώθην 的城市荒废与母亲孤苦双重意象
  choice: 译作“我已荒凉”
  alternative: 译作“我已孤苦无依”或“我已被弃置荒废”
  rationale: “荒凉”能同时适用于被毁的城和失去儿女的母亲，不把原文的复合意象单向解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“幸灾乐祸”虽属常用成语，但准确承载原词的敌意色彩；“撇下”“荒凉”“律法”维持经文的肃穆感。分号划分禁止语与自述处境，随后两次“因／因为”保留原文因果递进。
