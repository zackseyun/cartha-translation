  text: My pampered ones traveled rough roads[a]; they were carried off like a flock seized by enemies.
translation:
  language: zh_hans
  text: 我那些娇嫩的人[a]走过崎岖的道路；他们被带走，如同羊群被仇敌掳去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我那些养尊处优的人”或“我那些受呵护的人”。希腊语所用的词可指娇嫩、受呵护，或从前生活安逸的人。
    reason: 说明τρυφεροί的词义范围，并避免把原文未明说的对象限定为“孩子”。
lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: 我那些娇养的孩子
  rationale: τρυφερός可指娇嫩、生活优裕或在安逸中长大的人。这里用“娇养的孩子”，既保留从前受呵护、生活舒适的意味，也与如今所受的艰苦形成鲜明对照；上下文中的母亲哀歌使“孩子”这一补足自然明确。
- source_word: ἐπορεύθησαν
  choice: 走上了
  rationale: πορεύομαι意为行走、前往；与“道路”搭配时，“走上了”符合现代汉语表达，又不额外断定旅程的具体性质。
- source_word: ὁδοὺς τραχείας
  choice: 崎岖的道路
  rationale: ὁδός是道路，τραχύς是崎岖、粗糙或艰难。“崎岖的道路”保留具体意象，并可自然传达流离途中所受的艰苦。
- source_word: ἤρθησαν
  choice: 他们被带走
  rationale: αἴρω的被动式本可表示被提起或被带走；结合下文遭仇敌掳去的羊群，“被带走”保留被动和迁离之意，同时不把本词本身译得比原文更强烈。
- source_word: ὡς ποίμνιον
  choice: 如同……羊群
  rationale: ποίμνιον指羊群，有时带小群之意；中文用“羊群”最自然，不刻意强化指小词色彩。
- source_word: ἡρπασμένον
  choice: 被……掳去
  rationale: ἁρπάζω表示强行抓住、抢夺或掳走。“掳去”与仇敌和被迫迁离的语境相合，也清楚传达暴力夺取。
- source_word: ὑπὸ ἐχθρῶν
  choice: 被仇敌
  rationale: 保留ἐχθρῶν的复数概括意义；汉语集合性的“仇敌”无需另加“众”也可表达敌对者。
theological_decisions:
- issue: 羊群比喻的指向
  choice: 保留“如同被仇敌掳去的羊群”这一明喻，以呈现孩子们脆弱并遭强行带走的处境。
  alternative: 把比喻解释性地译成百姓被掳流亡，或只泛指他们受苦。
  rationale: 希腊文给出的是羊群遭仇敌夺去的比喻，并未在本句明说流亡或赋予其进一步教义含义；直保比喻可避免把语境推论写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“娇养”比“娇生惯养”少一些责备意味，更适合哀歌语境；分号保留原句两个并列动态之间的停顿与递进。
