base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
translation:
  language: zh_hans
  text: 因为她看见从上帝而来的烈怒临到你们，就说：“锡安的邻居们[a]，请听！上帝使极大的哀痛临到我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寄居在锡安的人”或“住在锡安附近的人”。希腊语πάροικοι可指住在某地旁边或其中的人，有时含外来寄居者的意味。
    reason: 保留πάροικοι在“邻居、附近居民、寄居者”之间的词义幅度。
lexical_decisions:
- source_word: εἶδεν
  choice: 她看见
  rationale: 按上下文，主语指拟人化的耶路撒冷，因此用“她”；“看见”保留动词直接、具体的叙事意义。
- source_word: ἐπελθοῦσαν ὑμῖν ὀργὴν
  choice: 烈怒临到你们
  rationale: “临到”自然表达愤怒如事件般降临在人身上；“烈怒”传达ὀργή在神圣审判语境中的分量。
- source_word: παρὰ τοῦ θεοῦ
  choice: 从上帝而来的
  rationale: παρά加属格首先标明来源；这一译法既保留神的主动关联，也不把语法强行收窄为单一的施事表达。
- source_word: Ἀκούσατε
  choice: 请听
  rationale: 保留命令和公开呼告的语气；“请”使现代汉语表达自然，却不削弱召唤力度。
- source_word: οἱ πάροικοι Σειών
  choice: 锡安的邻居们
  rationale: πάροικοι可指住在旁边的人，也可带寄居者或外来居民的意味；正文采用自然且符合关系语境的“邻居们”，脚注保留歧义。
- source_word: ἐπήγαγέ μοι
  choice: 使我陷入
  rationale: 表达上帝使哀痛临到说话者的直接作用；比机械的“带给我”更符合现代汉语搭配。
- source_word: πένθος μέγα
  choice: 极大的哀痛
  rationale: πένθος兼有悲痛和哀悼之意；“哀痛”在此既庄重又自然，并保留公开哀伤的色彩。
theological_decisions:
- issue: 灾祸中的神圣施事
  choice: 明确说烈怒从上帝而来，并且上帝使说话者陷入哀痛。
  alternative: 将灾祸处理为较为非人格化的遭遇，弱化上帝的直接关联。
  rationale: 希腊文两次直接提及上帝，分别说明烈怒的来源和哀痛的施加者；译文不缓和这项神学张力。
- issue: εἶδεν的主语性别
  choice: 译作“她看见”。
  alternative: 译作无性别提示的“看见了”或按英文写作“他看见”。
  rationale: 本段说话者是拟人化的耶路撒冷；希腊语动词本身不标示性别，但汉语代词需依据语境确定，故用“她”。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“烈怒”“哀痛”保持经文的审判与哀悼语调；引语中用“请听”形成自然的公开呼告。脚注标记[a]已在正文相应位置出现。
