  text: Wretched are the cities to which your children were enslaved[a]; wretched is she who received your sons.
translation:
  language: zh_hans
  text: 你的儿女曾在那里作奴隶的那些城，真是可悲！[a] 接纳你儿子们的那城，也真是可悲！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的儿女曾服事的那些城。”希腊语动词也可较直译为“服事”，但这里的被掳语境更支持“作奴隶”的含义。
    reason: 词义备选
lexical_decisions:
- source_word: δείλαιαι / δείλαια
  choice: 真是可悲
  rationale: 这里是带感叹语气的表语形容词，表达哀叹并含谴责意味。“真是可悲”自然、庄重，又不把形容词过度改写成明确的咒诅语“有祸了”。
- source_word: αἱ πόλεις
  choice: 那些城
  rationale: 保留定指，指与被掳受奴役有关的特定城邑；现代汉语用“那些城”表达自然。
- source_word: αἷς ἐδούλευσαν
  choice: 曾在那里作奴隶
  rationale: δουλεύω在被掳和压迫的语境中具有受奴役、作奴隶服役的含义；关系代词的与格按汉语习惯处理为地点关系“在那里”。
- source_word: τὰ τέκνα σου
  choice: 你的儿女
  rationale: τέκνα泛指子女，不限男性；“儿女”准确而自然。
- source_word: ἡ δεξαμένη
  choice: 接纳……的那城
  rationale: 希腊语阴性单数分词承接一座被人格化的城；汉语补出“那城”可明确单数所指。“接纳”保留原词本身可中性理解的张力，不另加“掳走”等解释。
- source_word: τοὺς υἱούς σου
  choice: 你众子
  rationale: υἱούς特指男性后代；译作“众子”保留它与前句泛指“儿女”的词义变化，并符合经文的庄重语体。
theological_decisions:
- issue: 流亡与审判语境中δουλεύω的译法
  choice: 作奴隶
  alternative: 服事；受奴役
  rationale: 上下文突出锡安儿女在异邦遭受的强制性辖制，因此明确译出奴役含义；同时脚注保留较为字面的“服事”译法。
- issue: 对接纳众子的城市之人格化表达
  choice: 接纳你众子的那城
  alternative: 那接收你众子的女子；把你众子收进去的城
  rationale: 原文以阴性单数形式人格化城市。现代汉语没有相应的语法性别，用“那城”保留单数指向，避免凭语法性别引入一个实际女性角色。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面语。“真是可悲”重复两次，以保留原文平行结构和感叹力度；“儿女／众子”则保留τέκνα与υἱούς之间的词义差别。
