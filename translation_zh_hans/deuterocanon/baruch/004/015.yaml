base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/015.yaml
  text: For he brought against them a nation from far away[a], a shameless and foreign-speaking nation, which showed no respect for the old man and had no mercy on the child[b],
translation:
  language: zh_hans
  text: 因为他使一个民族从远方来攻击他们，就是一个无耻、说外邦语言的民族[a]；因为他们不敬重老人，也不怜悯孩童[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说外邦语言”也可译作“说另一种语言”或“说外国语言”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译为“老人”和“孩童”，都用单数，代表易受伤害的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ἐπʼ αὐτοὺς
  choice: 引来……攻击他们
  rationale: ἐπάγω与ἐπί连用，表示使一股敌对势力临到或攻向某人；“引来……攻击他们”既保留使役意味，也清楚表达敌对行动。
- source_word: ἔθνος μακρόθεν
  choice: 从远方……一个民族
  rationale: ἔθνος指民族或国族，μακρόθεν表示来自遥远之地；此译保留原文的地理距离和重复强调。
- source_word: ἀναιδές
  choice: 无耻
  rationale: 该词基本义为不知羞耻、肆无忌惮；“无耻”直接而有力度，没有把词义缩窄为单纯“残暴”。
- source_word: ἀλλόγλωσσον
  choice: 说异族语言
  rationale: 该复合词指说另一种或外族语言；“说异族语言”在现代汉语中自然，并保留语言陌生、族群相异的含义。
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: 不敬重老人
  rationale: 此处αἰσχύνομαι表达在老人面前有所敬畏、顾忌的社会伦理含义；译作“不敬重”比字面“不感到羞耻”更符合语境。
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: 也不怜悯孩童
  rationale: ἐλεέω表示施怜悯或同情；“怜悯”准确保留其伦理力度，παιδίον则用范围较宽的“孩童”，不限定为婴儿。
theological_decisions:
- issue: 脆弱者的代表性单数
  choice: 老人……孩童
  alternative: 老年人……孩子们；老人们……儿童
  rationale: 希腊文πρεσβύτην和παιδίον均为单数，具有代表性。中文“老人”和“孩童”不加数量词时可作泛指，既保留单数形象，也避免擅自改为复数。
- issue: ὅτι与前文的关系
  choice: 用破折号引出对“无耻”的具体说明
  alternative: 译作“因为他们不敬重……”
  rationale: ὅτι可有因果或解释作用；此处行为是在说明这个民族何以称为“无耻”。破折号保留解释关联，又避免同一句中连续重复“因为”而造成不自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“引来……攻击他们”明确敌对语境；用破折号承接解释，使句法自然，同时保留原文对侵略者无耻行为的强调。
