base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/023.yaml
  text: For I sent you out with mourning and weeping[a], but God will give you back to me with joy and gladness forever.
translation:
  language: zh_hans
  text: 因为我曾在哀痛和哭泣中送你们离去；但上帝必在喜乐和欢乐中把你们交还给我[a]，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交还给我”也可译作“使你们回到我身边”。希腊语动词可表示“交还”或“恢复”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: 送……离去
  rationale: ἐκπέμπω表示送出、送走；“送……离去”既保留分离之意，也不额外强化为正式驱逐。
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: 伴着哀痛和哭泣
  rationale: 保留两个并列名词及μετά结构；“哀痛”体现丧失之悲，“哭泣”体现外在哀哭。
- source_word: ἀποδώσει
  choice: 必……交还
  rationale: ἀποδίδωμι可表示交还、归还或恢复；结合宾语“你们”和与格μοι“给我”，此处“交还给我”最能保留母亲般的耶路撒冷与儿女之间的关系意象。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 原文为带冠词的θεός；现代汉语在此自然译为“上帝”，不引入原文没有的盟约名称。
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: 伴着喜悦和欢乐
  rationale: 两个近义词构成加强性的并列；分别译出，避免合并而损失原文的修辞力度。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 该短语在此表达持续而永久的状态；“直到永远”符合现代中文圣经语体。
theological_decisions:
- issue: 说话者及关系框架
  choice: 保留“把你们交还给我”，将第一人称说话者呈现为母亲形象的锡安／耶路撒冷。
  alternative: 译作较笼统的“使你们复兴”或“使你们归回”。
  rationale: 希腊文明确有与格μοι（“给我”），上下文又把耶路撒冷人格化为母亲。保留“给我”可维持经文的家庭和群体关系意象，而不将其淡化为泛指的复兴。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“伴着……和……”对应原文前后重复的μετά结构；分号呈现由哀哭转向永远喜乐的强烈对照。
