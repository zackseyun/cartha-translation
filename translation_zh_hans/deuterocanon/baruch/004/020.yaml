base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: zh_hans
  text: 我脱下了平安的长袍，穿上了我祈求的麻衣[b]；在我的年日中，我要向永恒者[a]呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永存者”。希腊文直译为“永恒的那一位”，在这里用作神的称号。
    reason: lexical_alternative
  - marker: b
    text: “麻衣”是粗糙的哀服，人常在悲伤、悔改或危难中穿着。
    reason: cultural_note
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: 我脱下了
  rationale: 该词是ἐκδύω的不定过去中间态，表示从自己身上脱去衣物；“脱下了”自然地保留了穿衣意象。
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: 平安的长袍
  rationale: στολή指长袍或较庄重的衣服；属格εἰρήνης修饰长袍，译作“平安的长袍”既贴近原文，又保留诗性比喻。
- source_word: ἐνεδυσάμην
  choice: 穿上了
  rationale: 与前面的“脱下了”构成清楚的反向平行，也准确表达ἐνδύω中间态的穿衣动作。
- source_word: σάκκον τῆς δεήσεώς μου
  choice: 我恳求时所披的麻衣
  rationale: σάκκος是哀恸、悔改或危难中所穿的粗布衣；δέησις强调迫切恳求。此译使希腊语属格关系在现代汉语中自然可懂，同时保留麻衣与恳求之间的联系。
- source_word: κεκράξομαι
  choice: 我要……呼求
  rationale: κράζω表示大声、迫切地呼喊；“呼求”在此兼顾向神发声和恳切祈求的语境。
- source_word: τὸν αἰώνιον
  choice: 永恒者
  rationale: 原文以形容词αἰώνιος名词化，作为神的称号；“永恒者”保留这一独特称谓，不擅自改成“神”或“主”。
- source_word: ἐν ταῖς ἡμέραις μου
  choice: 在我的年日中
  rationale: 直译为“在我的日子中”；“在我的年日中”是自然而庄重的汉语表达，也没有像“我一生”那样额外加入“所有”的含义。
theological_decisions:
- issue: 神圣称号τὸν αἰώνιον的译法
  choice: 永恒者
  alternative: 永存者；永恒的那一位
  rationale: 希腊文使用名词化形容词，意思是“永恒的那一位”。译文保留其称号形式及神学分量，不将其常规化为原文没有使用的“神”或“主”。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。以“脱下／穿上”保存原文的平行结构和衣袍意象；“平安的长袍”与“麻衣”形成鲜明对照。“在我的年日中”刻意保留原文较宽泛的时间表达，不扩译为“我一生所有的日子”。
