base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/014.yaml
  text: Let the neighboring women of Zion come, let the neighboring women come, and remember the captivity of my sons and daughters, which the Eternal One brought upon them.
translation:
  language: zh_hans
  text: 锡安的邻舍妇女，都来吧[a]！邻舍妇女，都来吧[b]！要记念永恒者加在我儿女身上的被掳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍妇女”也可译作“寄居的妇女”或“锡安附近的妇女”。希腊词 πάροικοι 可指住在附近的人，也可指寄居者；此处为阴性复数形式。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本将“邻舍妇女，都来吧”这一召唤重复两次，以加强语气。
    reason: source_repetition
lexical_decisions:
- source_word: ἐλθάτωσαν
  choice: 都来吧
  rationale: 第三人称复数不定过去时命令式；用“都来吧”自然表达召唤语气。
- source_word: αἱ πάροικοι
  choice: 邻舍妇女
  rationale: πάροικος可指邻近居民，也可指寄居者；阴性复数冠词和形态表明所召唤的是女性，因此正文译为“邻舍妇女”，其他可能义见脚注。
- source_word: Σειών
  choice: 锡安
  rationale: 采用现代汉语圣经传统中通行的地名译法。
- source_word: μνήσθητε
  choice: 你们要记住
  rationale: 不定过去时命令式，直接保留其命令和呼吁的力度。
- source_word: τὴν αἰχμαλωσίαν
  choice: 被掳之苦
  rationale: αἰχμαλωσία指战争中被掳、受囚的处境；“被掳之苦”在现代汉语中自然，并在此语境中保留其具体苦难意味。
- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: 我儿女
  rationale: 汉语“儿女”自然且准确地涵盖原文明确并列的儿子与女儿。
- source_word: ὁ αἰώνιος
  choice: 永恒者
  rationale: 原文以实体化形容词作为上帝的称号；“永恒者”保留称号性质，不擅自替换为原文未出现的神名。
- source_word: ἐπήγαγεν αὐτοῖς
  choice: 使他们遭受
  rationale: 表达“带到他们身上、使之临到他们”的意义，同时避免用“惩罚”等词预先解释其神学性质。
theological_decisions:
- issue: 神圣称号 ὁ αἰώνιος
  choice: 永恒者
  alternative: 永在者；永恒的那一位
  rationale: 保留希腊文神圣称号的实体化形式和神学分量，同时使用简洁、庄重的现代汉语。
- issue: αἱ πάροικοι 的身份
  choice: 邻舍妇女
  alternative: 寄居的妇女；锡安附近的妇女
  rationale: 阴性复数支持“妇女”，而词本身兼有邻居与寄居者之义；正文依语境采用“邻舍妇女”，脚注保留词义歧义。
- issue: 上帝与被掳事件的关系
  choice: 就是永恒者使他们遭受的
  alternative: 就是永恒者使之临到他们的
  rationale: 忠实保留原文明确陈述上帝使被掳临到他们的张力，不弱化为单纯许可，也不强化为带有特定解释的“惩罚”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都来吧”保留重复召唤的修辞力度；“我儿女”符合汉语习惯并对应原文“儿子和女儿”；“被掳之苦”使 αἰχμαλωσία 的具体处境在中文中清楚可感。
