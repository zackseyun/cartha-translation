base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/013.yaml
  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: zh_hans
  text: 他们不认识他的律例，也不行在上帝诫命的道路上，也没有在他的公义中踏上训诲[a]的路径。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”或译“管教”；希腊文也包含塑造性的教导和训练之意。
    reason: lexical_alternative
  - marker: b
    text: “在他的公义中”也可译作“在他的公正中”。
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιώματα
  choice: 律例
  rationale: 该词指具有规范力的法令、典章或规定；“律例”简洁庄重，并与下文“诫命”保持相关而不完全重复。
- source_word: ἔγνωσαν
  choice: 认识
  rationale: 保留 γινώσκω 的直接意义；在这里既可涉及认知，也可暗含实际承认和遵从，不缩减为单纯“明白”。
- source_word: ἐπορεύθησαν
  choice: 行
  rationale: 与“道路”搭配，保留圣经伦理隐喻，同时比逐字译作“走路”更自然。
- source_word: ὁδοῖς ἐντολῶν θεοῦ
  choice: 上帝诫命的道路
  rationale: 保留希腊文属格结构及“道路”的行为隐喻；“诫命”准确表达 ἐντολαί 的规范性。
- source_word: τρίβους
  choice: 路径
  rationale: 表达踩踏形成的小路，并与前面的“道路”有所区别。
- source_word: παιδίας（παιδεία）
  choice: 训诲
  rationale: παιδεία 涵盖教导、训练和管教；“训诲”在智慧文学语境中兼具塑造与劝戒意味，又不局限于惩罚。
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: 他公义中
  rationale: 贴近紧凑的希腊文介词结构，并保留 δικαιοσύνη 在道德与神学层面的开放性。
- source_word: ἐπέβησαν
  choice: 踏上
  rationale: 保留 ἐπιβαίνω“踏上、登上”的具体动作意象，与“路径”自然搭配。
theological_decisions:
- issue: δικαιοσύνη 的译法
  choice: 公义
  alternative: 公正
  rationale: “公义”既能涵盖上帝正直的属性和行动，也保留圣经语境中的神学张力；“公正”虽可能，但更容易被理解为狭义司法概念。
- issue: παιδεία 的范围
  choice: 训诲
  alternative: 管教
  rationale: 此词可兼指教导、训练和纠正；正文采用范围较宽的“训诲”，脚注保留强调纠正意味的“管教”，不把两者强行归一。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个并列否定分句保留原文递进节奏；“道路／路径”和“行／踏上”分别对应两组不同的希腊词。
