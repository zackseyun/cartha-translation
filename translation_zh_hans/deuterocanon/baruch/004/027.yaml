base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/027.yaml
  text: Take courage[a], children, and cry out to God, for you will be remembered by the one who brought this upon you.
translation:
  language: zh_hans
  text: 孩子们，要鼓起勇气，向上帝呼求；因为那位使这一切临到你们的，必会记念你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“因为必有对你们的记念，出于那使之临到你们的。”“这一切”是按上下文补出的；原文没有明说所临到的事。
    reason: 说明原文“必有……记念”的名词结构、分词称谓及其省略的宾语，避免将补足内容误作原文明说。
lexical_decisions:
- source_word: Θαρρήσατε
  choice: 要鼓起勇气
  rationale: 该词是复数命令式，表示振作、勇敢起来。“要鼓起勇气”自然地传达劝勉语气。
- source_word: τέκνα
  choice: 孩子们
  rationale: 呼格复数，指受话群体，不限定性别；“孩子们”符合现代汉语称呼方式。
- source_word: βοήσατε
  choice: 呼求
  rationale: 该动词可指大声呼喊，也常带向上帝求告的意味；“呼求”兼顾恳求和迫切性。
- source_word: πρὸς τὸν θεόν
  choice: 向上帝
  rationale: 介词短语表达呼喊所朝向的对象；“向上帝呼求”是自然且准确的汉语。
- source_word: ἔσται ... μνεία
  choice: 必会记念你们
  rationale: 原文名词结构直译为“必有对你们的记念”；转为主动表达更符合现代汉语，同时保留将来的确切应许。
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: 那使这一切临到你们的
  rationale: 带冠词的现在分词指“使之临到的人/那一位”。原文省略所临到之事的宾语，以“这一切”承接上下文，又不把它过度限定为某一种灾难。
theological_decisions:
- issue: “那使这一切临到你们的”所指是谁
  choice: 保留间接称谓，不在正文中直接改为“上帝”
  alternative: 译作“使这一切临到你们的上帝”或更含混地译作“那使之临到你们的”
  rationale: 上文刚提到上帝，且本书语境把灾祸视为上帝的审判，因此所指很可能是上帝；但希腊文没有在此重复 θεός，而用分词称谓，故译文保留其间接性及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“孩子们”保留亲切称呼；“鼓起勇气”“呼求”“记念”兼顾自然表达与经文语感。
