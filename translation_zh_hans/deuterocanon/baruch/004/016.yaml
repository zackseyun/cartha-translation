  text: And they carried away the widow’s beloved ones[a], and from among her daughters they left her desolate and alone.
translation:
  language: zh_hans
  text: 他们掳走了那寡妇所爱的人，又使她与众女儿隔绝，孤苦无依。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又使那寡妇在众女儿中成为唯一留下、孤苦无依的一个。”希腊文此处可较直译为“那唯一的一个”；其所指和句法关系略有歧义，句意是她被留下，孤身一人。
    reason: 保留τὴν μόνην“唯一的一个”的字面含义及其与ἀπὸ τῶν θυγατέρων的句法歧义，同时避免将其误解为众女儿中的一名。
lexical_decisions:
- source_word: ἀπήγαγον
  choice: 掳走了
  rationale: 该动词表示把人带走；上下文涉及敌人、流亡与丧亲，“掳走”自然传达被强行带离的意味，又不具体限定方式。
- source_word: τοὺς ἀγαπητοὺς
  choice: 所爱的人
  rationale: 形容词在此作名词使用，指寡妇所爱的一群人；此译保留复数的集合意义和情感色彩，不擅自限定为儿子或亲属。
- source_word: τῆς χήρας
  choice: 寡妇
  rationale: 属格在汉语中以“寡妇所爱的人”表达所属关系；正文保留寡妇这一拟人意象，不直接解释为耶路撒冷或锡安。
- source_word: ἀπὸ τῶν θυγατέρων
  choice: 与众女儿分离
  rationale: ἀπό加属格表达离开、隔绝；此译清楚呈现她与女儿们分离的结果，同时避免把关系过度解释为死亡或某种具体去向。
- source_word: τὴν μόνην
  choice: 独自
  rationale: 该词为阴性单数，描述一个女性对象成为孤单一人；汉语用“独自”自然表达其结果状态，同时不硬译成生涩的“唯一者”。
- source_word: ἠρήμωσαν
  choice: 使她……凄凉
  rationale: 该动词有使荒凉、使孤苦无依之意；“使她……独自凄凉”既保留强烈的荒凉感，也符合以寡妇为对象的拟人语境。
theological_decisions:
- issue: 寡妇和女儿的拟人意象
  choice: 正文直接保留“寡妇”和“女儿”的亲属意象
  alternative: 在正文中把寡妇明说为耶路撒冷或锡安
  rationale: 希腊文本以诗性拟人说话；保留原有意象可避免把解释写进正文。
- issue: τὴν μόνην所指及其句法关系
  choice: 理解为指前文的寡妇，表示她被弄得独自凄凉
  alternative: 理解为“女儿中唯一的一个”，或更直译为“那唯一者”
  rationale: 阴性单数与寡妇相应，且与ἠρήμωσαν结合可自然表示她落入孤独荒凉的境地；但希腊语序容许较贴字面的另一种切分，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“掳走”呼应被敌人带离的语境；“独自凄凉”保留诗歌的哀伤力度。脚注标记[a]已置于正文对应句末。
