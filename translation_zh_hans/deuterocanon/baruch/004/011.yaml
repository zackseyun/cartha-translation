  text: For I nourished them with gladness, but I sent them away with weeping and mourning.
translation:
  language: zh_hans
  text: 因为我曾欢欢喜喜地养育他们，却在哭泣和哀痛中把他们送走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: 养育
  rationale: τρέφω可指喂养、供养或抚育；结合说话者的母亲形象，“养育”自然地兼顾供应和亲子关怀。
- source_word: μετʼ εὐφροσύνης
  choice: 欢欢喜喜地
  rationale: εὐφροσύνη表示喜悦、欢欣；此处用叠词形式，符合现代汉语表达，也保留伴随养育过程的喜乐。
- source_word: ἐξαπέστειλα
  choice: 送他们离去
  rationale: ἐξαποστέλλω在此表示把他们送走、使其离开说话者；“送他们离去”保留分离意味，又不在正文中明说流亡。
- source_word: μετὰ κλαυθμοῦ
  choice: 在哭泣……中
  rationale: κλαυθμός指哭泣或哀哭；与介词短语结合译为“在哭泣……中”，表达送别时伴随的悲痛。
- source_word: πένθους
  choice: 哀痛
  rationale: πένθος指因失去而有的悲伤、哀悼；“哀痛”既能与“哭泣”并列，又保留内在悲恸，不把词义限于礼仪性的服丧。
theological_decisions:
- issue: 说话者的母亲口吻与流亡背景
  choice: 直译第一人称的养育与送别，不在正文中补出“流亡”或“被掳”。
  alternative: 在正文中明确译成“送他们去流亡”。
  rationale: 希腊文本以喜乐养育和哭泣送别形成鲜明对照，却没有在本节明确重述流亡；不补充背景，可保留原文的含蓄与情感张力。
- issue: ἐξαπέστειλα所表达的主动性
  choice: 译作“送他们离去”，保留语法上的第一人称主动表达。
  alternative: 译作“眼看他们被带走”，以减弱说话者的主动角色。
  rationale: 原文明确使用第一人称主动动词；即使上下文可能涉及并非出于自愿的离散，也不宜在翻译中改成被动而消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“曾……如今却……”自然呈现过去喜乐养育与当前悲痛送别的时间和情绪对照；不添加脚注，因为本节无必须另注的文本异读或不可在正文中保留的歧义。
