  yaml_path: translation/deuterocanon/baruch/004/008.yaml
  text: You forgot the eternal God who nourished you; you also grieved Jerusalem, who reared you.
translation:
  language: zh_hans
  text: 你们忘记了那位养育你们的永恒的上帝；也使那抚育你们的耶路撒冷忧伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: 你们忘记了
  rationale: 直译其责备语气；在现代汉语中自然明确，也不额外解释遗忘的方式或程度。
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: 那养育你们的
  rationale: τροφεύω兼有供养与抚养之意；“养育”保留照料和亲职意象，而不局限为喂食。
- source_word: θεὸν αἰώνιον
  choice: 永恒上帝
  rationale: 保留αἰώνιος作为上帝的属性；“永恒”在现代中文中庄重自然。
- source_word: ἐλυπήσατε
  choice: 使……忧伤
  rationale: 准确表达λυπέω“使忧愁、使悲伤”的使动含义，并保留责备的情感力度。
- source_word: δὴ καὶ
  choice: 也
  rationale: καί的追加义由“也”表达；δὴ的强调在中文句势中体现，避免生硬增译“确实”。
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: 那抚育你们的
  rationale: ἐκτρέφω指养大、抚养；“抚育”与前句“养育”相呼应，又保留耶路撒冷人格化的慈爱照料意象。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文通行专名译法。
theological_decisions:
- issue: 耶路撒冷作为女性养育者的人格化
  choice: 译作“那抚育你们的耶路撒冷”
  alternative: “你们的母亲耶路撒冷”
  rationale: 阴性分词将耶路撒冷刻画为具有母性意味的养育者，但原文并未明说“母亲”，故不增补该称谓。
- issue: 神圣称号θεὸν αἰώνιον的表达
  choice: 永恒上帝
  alternative: 永生的上帝／永远的上帝
  rationale: “永恒”直接保留αἰώνιος的时间与神性属性，同时避免“永生”可能主要被理解为生命不死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句法尽量贴近希腊文的平行结构，以“养育／抚育”区分两个相关动词，并保留上帝与人格化耶路撒冷并列受到冒犯的张力。
