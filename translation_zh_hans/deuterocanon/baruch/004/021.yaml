base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/021.yaml
  text: Take courage[a], children; cry out to God, and he will deliver you from oppression[b], from the hand of enemies.
translation:
  language: zh_hans
  text: 孩子们，要鼓起勇气！向上帝呼求吧，他必救你们脱离强权，脱离仇敌的手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仇敌的手”是圣经惯用语，指仇敌的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: 要鼓起勇气
  rationale: 复数命令式，劝勉听者坚定、勇敢；“鼓起勇气”自然地保留了直接劝勉的语气。
- source_word: τέκνα
  choice: 孩子们
  rationale: 呼格复数，指儿女或孩子，不限定性别，也保留亲切的家庭式称呼。
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: 向上帝呼求吧
  rationale: βοήσατε是带紧迫感的复数命令式；πρός表示呼求所指向的对象。“向上帝呼求”符合现代汉语祷告语境。
- source_word: ἐξελεῖται
  choice: 他必救你们
  rationale: ἐξαιρέω的将来时中间语态，表示救出、解救；“必救”简洁地表达应许的将来行动，不添加原文没有的条件。
- source_word: ἐκ δυναστείας
  choice: 脱离强权
  rationale: δυναστεία可指统治权、支配势力，语境中带有压迫意味。“强权”既保留权势支配的含义，也适合与后面的敌人之手并列。
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: 脱离仇敌的手
  rationale: 直译保留圣经中以“手”表示掌控、权势的具体意象；现代中文读者仍可理解。
theological_decisions:
- issue: 上帝施行拯救的表述
  choice: 他必救你们
  alternative: 他必搭救你们／他必解救你们
  rationale: 原文直接陈述上帝将要施行拯救；“必救”保留应许语气，同时不引入额外的教义解释。
- issue: 呼求与拯救之间的关系
  choice: 以“向上帝呼求吧，他必救你们”并列呈现
  alternative: 译成带明确因果词的“向上帝呼求，他就会救你们”
  rationale: 希腊文用καί连接命令与将来陈述，并未明确标出条件或因果关系，因此不增添“只要……就……”一类解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“孩子们”保留母亲对儿女说话的亲切口吻；两个命令句以感叹号和语气词体现劝勉与呼求的力度。“强权”比单纯的“压迫”更贴近δυναστεία所含的支配权势，同时避免生硬的抽象表达。
