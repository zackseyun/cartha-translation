  text: For the one who brought evils upon you will bring you everlasting gladness with your salvation[a][b].
translation:
  language: zh_hans
  text: 因为那位使灾祸临到你们的，必使永远的喜乐[a]与你们的拯救[b]一同临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喜乐”或译“欢欣”。
    reason: lexical_alternative
  - marker: b
    text: “拯救”或译“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἐπαγαγὼν ... ἐπάξει
  choice: 那使……临到……的，必使……临到
  rationale: 用同一结构对应同一希腊动词的过去分词和将来时，保留灾祸与喜乐之间刻意形成的平行。
- source_word: τὰ κακὰ
  choice: 灾祸
  rationale: κακά在此指临到百姓的苦难或灾难；“灾祸”自然、庄重，也不额外加入原文没有的指示词“这些”。
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: 永远的喜乐
  rationale: εὐφροσύνη表示喜乐、欢欣；“喜乐”在现代汉语中自然，并保留αἰώνιον所表达的恒久性。
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: 与拯救一同
  rationale: μετά表示伴随；σωτηρία在本段复兴语境中既可指拯救，也可指解救，因此正文采用较有整体分量的“拯救”。
theological_decisions:
- issue: 审判与复兴的施行者
  choice: 保留同一位施行者既使灾祸临到，也将使喜乐与拯救临到的表述。
  alternative: 弱化前半句的直接施事关系，把灾祸仅译作被动发生。
  rationale: 希腊文以同一动词明确并列这两项行动；译文不消解其中关于审判与拯救的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上文；以“使……临到”保持原文动词复现，并用“与……一同”清楚表达伴随关系。
