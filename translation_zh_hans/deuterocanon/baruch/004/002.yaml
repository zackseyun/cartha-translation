base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/002.yaml
  text: Turn[a], O Jacob, and take hold of her; walk toward the radiance[b], opposite her light.
translation:
  language: zh_hans
  text: 雅各啊，回转[a]，抓住她；朝着那光辉前行，面对她的光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“归回”。希腊语可表示转回来或返回。
    reason: lexical_alternative
  - marker: b
    text: 本句较直译可作：“朝着那光辉前行，在她的光对面。”“面对”所对应的希腊语也可表示“在……对面”或“在……面前”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέφου
  choice: 回转
  rationale: 该中间/被动形式的命令语气可表示“转回来”或“归回”。“回转”既保留方向转变，也容纳语境中可能具有的悔改意味，而不将其过度明确化。
- source_word: Ἰακώβ
  choice: 雅各
  rationale: 按希腊文本保留专名；此处虽可借“雅各”指以色列民，却不直接改译为“以色列”。
- source_word: ἐπιλαβοῦ
  choice: 抓住
  rationale: 该动词意为抓住、握住；“抓住”自然简洁，并保留具体的动作感。
- source_word: αὐτῆς
  choice: 她
  rationale: 阴性代词在上下文中承接被人格化的智慧或律法；用“她”保留希腊文的文学形象。
- source_word: διόδευσον
  choice: 前行
  rationale: 该动词表示行进、走过或前往；结合方向短语译作“朝着……前行”，符合现代汉语并保留运动意象。
- source_word: λάμψιν
  choice: 光辉
  rationale: λάμψις指闪耀的亮光或光辉；与后面的φῶς分别译作“光辉”和“光”，保留原文的诗性变化。
- source_word: κατέναντι
  choice: 迎向
  rationale: 该词可表示“在……对面、在……面前”或面向某物；此处用“迎向”表达朝向并置身于光前的动态关系，同时以脚注保留更形式对应的译法。
- source_word: φωτός
  choice: 光
  rationale: φῶς的基本义为“光”；简明译出，并与“光辉”形成原文已有的词汇对应。
theological_decisions:
- issue: 阴性代词αὐτῆς所指对象的人格化
  choice: 正文译作“她”，保留智慧或律法的人格化形象
  alternative: 若将其理解为非人格化的律法或诫命，可译作“它”
  rationale: 上下文把智慧与律法紧密相联并加以人格化；保留阴性称谓既符合希腊文形式，也不强行判定“她”仅指智慧还是律法。
- issue: κατέναντι与“她的光”的关系
  choice: 译作“迎向她的光”，表达面向其光而行
  alternative: 较形式对应地译作“在她的光面前”或“与她的光相对”
  rationale: 希腊语介词容许“对面、面前、面对”等空间含义。正文采用自然而仍具方向感的汉语，脚注则保留句法和空间关系上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“雅各啊”保留呼告语气；“她”维持上下文的人格化表达。“光辉／光”分别对应两个希腊词，避免合并其诗性重复。
