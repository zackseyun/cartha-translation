base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/028.yaml
  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
translation:
  language: zh_hans
  text: 因为你们的心思怎样曾倾向于离开上帝而走入迷途，如今回转，就当十倍地寻求他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今回转去寻求他时，要使之成为十倍。”希腊文直译为“要使之成为十倍，回转去寻求他”；被增为十倍的对象没有明说，语境表明是寻求上帝的行动或热切程度。
    reason: 保留δεκαπλασιάσατε宾语省略的结构，并说明“十倍地寻求”的语境性表达。
lexical_decisions:
- source_word: διάνοια
  choice: 一心
  rationale: 本词指人的心思、意念或内在取向。结合ἐγένετο与目的结构，译作“一心”既自然，也表达全句所强调的内在趋向，而不把它缩减为一个孤立的念头。
- source_word: ἐγένετο … εἰς τὸ πλανηθῆναι
  choice: 曾一心……走入迷途
  rationale: 这一结构表示心思形成了走迷路、偏离正道的趋向。“曾一心……走入迷途”以现代汉语表达这种进入某种状态或取向的含义；πλανηθῆναι的被动形式在此也可有“受迷惑”的色彩，但上下文首先强调偏离上帝这一事实。
- source_word: ἀπὸ τοῦ θεοῦ
  choice: 偏离上帝
  rationale: ἀπό表示分离；“偏离上帝”同时传达空间隐喻与关系上的疏离，符合宗教语境。
- source_word: δεκαπλασιάσατε
  choice: 要十倍地寻求他
  rationale: 该动词直译为“使之成为十倍”或“增加十倍”，宾语在希腊文中省略，并由后面的“回转寻求他”补足语境。正文明确为寻求的加强，以保证现代汉语清楚流畅，同时用脚注保留原文的省略性。
- source_word: ἐπιστρέφοντες
  choice: 如今你们回转
  rationale: 分词表示伴随命令发生的行动或情境。“回转”保留转身归回的意象，并与先前偏离上帝形成对照。
- source_word: ζητῆσαι αὐτόν
  choice: 寻求他
  rationale: ζητέω用于人与上帝的关系时，通常表示认真追求、寻求。“寻求他”庄重自然，也保留原文的宗教语义。
theological_decisions:
- issue: “增加十倍”究竟修饰什么
  choice: 正文译为“要十倍地寻求他”，把语境隐含的寻求明确出来。
  alternative: “你们回转寻求他时，要增加十倍。”
  rationale: 希腊文的命令式δεκαπλασιάσατε没有明说被增加的对象；其后的“回转寻求他”表明，被强化的是归回并寻求上帝的行动或热切程度。正文采用清楚的现代汉语，但脚注说明原文的省略，避免把解释伪装成毫无歧义的字面形式。
- issue: πλανηθῆναι的主动与被动色彩
  choice: 译为“走入迷途”，不明确指定是谁使他们迷失。
  alternative: “被引入迷途”或“受迷惑”。
  rationale: 该不定式形式上是被动，但可表达不及物意义“迷失、走入歧途”。不补出施动者，可避免引入原文未说明的神学责任归属。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一心偏离……走入迷途”呈现内在取向及其结果；“回转”保留悔改归回的核心意象。句中避免使用带有特定宗派色彩的术语。
