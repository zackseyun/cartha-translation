base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: zh_hans
  text: 因为，正如锡安周围的居民如今看见了你们被掳，他们也必很快看见从你们的上帝而来的拯救[a]；这拯救必临到你们，带着极大的荣耀和永恒者的光辉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“救恩”。希腊词 σωτηρία 可指实际的救援、解救，也可表达较广的救恩含义。
    reason: lexical_alternative
  - marker: b
    text: “永恒者”也可译作“永远长存者”。希腊文在这里用带冠词的形容词作名词，作为对上帝的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: 锡安周围的居民
  rationale: πάροικοι 可指住在近旁的人，也可指寄居者；本句侧重目睹锡安遭遇的周边人群，译为“周围的居民”自然且不引入法律身份。
- source_word: αἰχμαλωσίαν
  choice: 被掳
  rationale: 该词指遭俘及被掳的处境；“被掳”在现代中文圣经语体中简洁具体，也比单纯“流亡”更贴近敌人掳走的含义。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 表达时间上的临近；未来语境中译为“很快”自然明确。
- source_word: σωτηρίαν
  choice: 拯救
  rationale: σωτηρία 既可表示救援、解救，也具有较广的救恩含义；此处直接涉及脱离被掳处境，“拯救”兼顾具体搭救与神学分量。
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: 从你们的上帝而来的
  rationale: παρά 加属格表示来源；此译明确指出拯救源于他们的上帝。
- source_word: ἐπελεύσεται ὑμῖν
  choice: 必临到你们
  rationale: 保留 ἐπέρχομαι 向某人来到、临及某人的力度，同时符合庄重自然的中文表达。
- source_word: μετὰ δόξης μεγάλης
  choice: 带着极大的荣耀
  rationale: δόξα 在此神圣语境中宜译“荣耀”；μετά 表伴随，故用“带着”。
- source_word: λαμπρότητος
  choice: 光辉
  rationale: 该词可指明亮、光辉或辉煌；“光辉”能保留其亮光意象，并与“荣耀”有所区分。
- source_word: τοῦ αἰωνίου
  choice: 永恒者
  rationale: 带冠词的形容词在此作名词使用，构成对上帝的称号；“永恒者”保留称号性质，不补入原文未重复出现的“上帝”。
theological_decisions:
- issue: σωτηρία 在复兴与脱离被掳语境中的译法
  choice: 拯救
  alternative: 救恩；解救
  rationale: 上下文首先指上帝使子民脱离被掳的行动。“拯救”既不把意义限缩为政治解放，也不使中文读者误以为这里只谈抽象或专门术语化的“救恩”。
- issue: 将 τοῦ αἰωνίου 作为神圣称号处理
  choice: 永恒者
  alternative: 永远长存者；永恒的上帝
  rationale: 希腊文是实体化形容词，宜保留独立称号的形式；不补出“上帝”，以免抹平原文的措辞特点。
- issue: δόξης 与 λαμπρότητος τοῦ αἰωνίου 的关系
  choice: 极大的荣耀和永恒者的光辉
  alternative: 永恒者极大的荣耀和光辉
  rationale: 属格 τοῦ αἰωνίου 在语法上最直接修饰 λαμπρότητος。主译文保留这种局部连接，不将“永恒者”扩展为同时限定前面的“荣耀”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被掳”“临到”“荣耀”保持经文语体，但句法避免古奥。用分号划分对照结构，并让关系从句在中文中清晰回指“拯救”。
