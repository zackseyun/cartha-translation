  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留明示的一人称代词；结合“又”的语序，在自然汉语中体现说话者转向自身时的强调。
- source_word: δὲ
  choice: 可是……又
  rationale: δέ在这里表示温和的转折。用“可是”承接哀叹中的对比，并以“又”使反问语气自然，不把转折强化得过重。
- source_word: τί
  choice: 怎
  rationale: τί在与δυνατή及不定式连用的问句中表达“如何、怎么”的反问意义，而非询问具体的“什么”。
- source_word: δυνατὴ
  choice: 能
  rationale: 阴性形容词δυνατή与说话者相呼应，表示能力或可能性；现代汉语以“能”简洁准确地表达。
- source_word: βοηθῆσαι
  choice: 帮助
  rationale: βοηθέω意为施以援助；“帮助”是清楚、自然且不过度扩展的现代汉语对应词。
- source_word: ὑμῖν
  choice: 你们
  rationale: 明确保留希腊语第二人称复数，表明说话者面对的是多人或群体。
