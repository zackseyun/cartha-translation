  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
translation:
  language: zh_hans
  text: 因为那使这些灾祸临到你们的，必从你们仇敌的手中救出你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些灾祸”也可译作“这些患难”或“这些恶事”。希腊文τὰ κακὰ既可指恶事，也可指严重的苦难或灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: 使……临到
  rationale: 该词是ἐπάγω的简单过去主动分词，表示使某事临到某人；“使……临到”既保留使动和方向含义，也符合现代汉语表达。
- source_word: τὰ κακὰ
  choice: 这些灾祸
  rationale: κακά在这里可指恶事、患难或灾祸。上下文所指是百姓遭受的苦难，因此正文采用自然且庄重的“这些灾祸”，并以脚注保留其他词义可能。
- source_word: ἐξελεῖται
  choice: 必……救出
  rationale: ἐξαιρέω的将来时中间形式在此表示从危险或控制中搭救；“救出”清楚表达实际的解救行动。
- source_word: ἐκ χειρὸς
  choice: 从……手中
  rationale: 直译并保留圣经常用的“从某人手中”这一惯用语，表示脱离其权势或控制。
- source_word: ἐχθρῶν
  choice: 仇敌
  rationale: 准确表达ἐχθρός的一般含义；“仇敌”庄重且符合圣经语体。
theological_decisions:
- issue: 审判与拯救中的神圣施事者
  choice: 保留同一位施事者既使灾祸临到百姓、又将他们救出的表述。
  alternative: 弱化或回避灾祸由该施事者带来的因果关系。
  rationale: 希腊文以“那使这些灾祸临到你们的”为主语，并以同一主语支配“必救出你们”，明确维持审判与拯救出于同一施事者的张力；译文不加以淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那使……的”保留希腊文名词化分词结构及施事者未明说姓名的特点；“从……手中救出”兼顾原文意象与汉语可读性。
