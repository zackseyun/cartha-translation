base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: zh_hans
  text: 孩子们，要耐心忍受从上帝而来、临到你们的震怒。仇敌追赶了你，但你很快就会看见他的灭亡[a]，也必脚踏他们的颈项。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“他的灭亡……他们的颈项”，指仇敌时由单数转为复数，可能既把仇敌看作一个对手，也把它看作一股集体势力。
    reason: 说明原文中仇敌指称由单数转为复数，避免读者误以为是译文不一致。
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们
  rationale: 这是 τέκνον 的复数呼格，带有亲切的家人式称呼意味；译作“孩子们”既自然，也不添加原文没有的“我的”。
- source_word: μακροθυμήσατε
  choice: 要耐心忍受
  rationale: 该不定过去时命令式要求人在苦难中持久忍耐；“耐心忍受”兼顾耐心与承受之意。
- source_word: ὀργήν
  choice: 震怒
  rationale: 此处指从上帝而来的审判性愤怒；“震怒”庄重而有力度，又不把它解释性地改译为“惩罚”。
- source_word: ἐπελθοῦσαν ὑμῖν
  choice: 临到你们的
  rationale: 分词说明震怒已经临到受话者；这一表达自然保留其临到并造成现实处境的含义。
- source_word: κατεδίωξέν
  choice: 追赶了
  rationale: 该动词表示带有敌意的追逐；“追赶”保留军事压迫的语境而不引入较狭义的宗教术语。
- source_word: ὄψει
  choice: 你……会看见
  rationale: 按其将来时直译其应许性质，并采用现代汉语自然表达。
- source_word: ἀπώλειαν
  choice: 灭亡
  rationale: 指仇敌最终被毁灭、败亡；“灭亡”简洁有力。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 该短语在此表示事情不久即将发生；“很快”符合现代汉语习惯。
- source_word: ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ
  choice: 必脚踏他们的颈项
  rationale: 保留战胜并制服仇敌的具体身体意象；“脚踏……颈项”在中文中庄重、清楚，也没有把比喻弱化为抽象的“战胜”。
theological_decisions:
- issue: 百姓受苦与上帝震怒的关系
  choice: 明确译为“从上帝而来、临到你们的震怒”
  alternative: 临到你们的愤怒／上帝给你们的惩罚
  rationale: 希腊文明确有 παρὰ τοῦ θεοῦ，表示震怒来自上帝。译文保留这一神学张力，不淡化上帝的关联，也不将“震怒”解释性地替换成“惩罚”。
- issue: 战胜仇敌的身体性意象
  choice: 保留“脚踏他们的颈项”
  alternative: 战胜他们／制服他们
  rationale: 原文采用具体的征服图像；保留此比喻才能传达原句的力度，避免用抽象概述取代原文。
- issue: 仇敌指称由单数转为复数
  choice: 保留“他的灭亡”与“他们的颈项”的转换
  alternative: 统一译为“他的……他的”或“他们的……他们的”
  rationale: 希腊文先用单数 αὐτοῦ，随后改用复数 αὐτῶν，可能既把仇敌视为一个对手，又视为一股集体势力；译文不擅自消除这种转换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“震怒”保留审判语气；“耐心忍受”自然表达命令的持续承受意味；末句用“脚踏他们的颈项”保留原文鲜明的得胜图像。
