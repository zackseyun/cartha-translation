  text: For you provoked the one who made you by sacrificing to demons and not to God.
translation:
  language: zh_hans
  text: 因为你们向鬼魔献祭，而不向上帝献祭，惹怒了那位造你们的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρωξύνατε
  choice: 激怒了
  rationale: 该词为简单过去时主动直陈语气第二人称复数，在偶像崇拜的语境中表示招惹、触怒；“激怒了”自然传达其使对方发怒的语义，又不扩展为“惹动烈怒”等更强解释。
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: 那位创造你们的主
  rationale: 希腊文直译为“那位造你们的”。中文补出“主”，使受词指向清楚、句子庄重自然；“创造”在此准确表达上帝是他们的创造者。
- source_word: θύσαντες
  choice: 向……献祭
  rationale: 简单过去时分词说明他们以何种行为激怒创造者；中文通过前置原因分句表达其工具或方式意义。
- source_word: δαιμονίοις
  choice: 鬼魔
  rationale: 在犹太希腊文关于偶像祭祀的论述中，该词指与上帝敌对、接受祭祀的灵界存在；“鬼魔”保留其人格性和负面神学含义。
- source_word: καὶ οὐ θεῷ
  choice: 而不是向上帝献祭
  rationale: θεῷ与δαιμονίοις同为与格，均表示献祭所指向的对象；重复“献祭”符合现代汉语，并清楚保留二者的对比。
theological_decisions:
- issue: 偶像祭祀语境中δαιμονίοις的所指与力度
  choice: 鬼魔
  alternative: 邪灵；偶像背后的势力
  rationale: 原文将献给鬼魔与献给上帝直接对立，呈现的不是纯粹比喻或无生命偶像，而是敌对的灵界对象；“鬼魔”保留这一神学分量。
- issue: τὸν ποιήσαντα ὑμᾶς是否应明确称为“主”
  choice: 正文译作“那位创造你们的主”，并以脚注注明原文结构
  alternative: 那位创造你们的；你们的创造者
  rationale: 上下文清楚指上帝；补出“主”使中文宾语中心明确且具经文体庄重感，同时用脚注避免把补语误认为原文另有κύριος。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“因为”与上文的因果衔接，并把献祭行为前置，使长句自然。用“上帝”对应θεός，用“鬼魔”保留犹太经文中反偶像祭祀的鲜明力度。
