  text: Go[a], children, go[b], for I have been left desolate.
translation:
  language: zh_hans
  text: 走吧[a]，孩子们，走吧！因为我被留下，孤单凄凉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词字面可译作“行走”；在这里是催促他们离去。
    reason: lexical_alternative
  - marker: b
    text: 或译“独自一人”或“荒凉、被弃置”。原词既可描述孤单无人相伴，也可描述荒凉或被留下后的凄凉状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαδίζετε
  choice: 走吧
  rationale: 该命令式动词字面义为“行走”，在这里是催促孩子们离去；“走吧”符合现代汉语表达，并保留两次重复所传达的急切和强调。
- source_word: τέκνα
  choice: 孩子们
  rationale: τέκνα是涵盖男女的亲属称呼；“孩子们”准确保留说话者以母亲身份发出的呼唤，不限于男性。
- source_word: κατελείφθην
  choice: 我被撇下
  rationale: 保留希腊文被动语态及“被留下”的基本含义；“撇下”在现代汉语中自然地表现说话者被留在后面的处境，又不把动词本身过度强化为“彻底遗弃”。
- source_word: ἔρημος
  choice: 孤苦伶仃
  rationale: 该词可表示孤单、荒凉或无人相伴。这里由拟人化的耶路撒冷自述，“孤苦伶仃”自然传达其孤独凄凉的状态；其他可能含义在脚注中保留。
theological_decisions:
- issue: 说话者凄凉处境的情感力度
  choice: 因为我被撇下，孤苦伶仃
  alternative: 因为我被留下，独自一人／因为我被撇下，一片荒凉
  rationale: 本句属于哀叹；译文既应体现ἔρημος的悲苦力度，又不应将其单义化为主观孤独或客观荒芜。“孤苦伶仃”适合作为正文，脚注则保留原词涵盖“孤单”与“荒凉”的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“走吧”重复两次，保留原文的急切强调；“孩子们”保留拟人化耶路撒冷的母亲口吻。正文简洁有哀歌色彩，脚注说明关键希腊词的真实语义范围。
