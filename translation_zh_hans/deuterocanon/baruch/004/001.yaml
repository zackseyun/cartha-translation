base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: zh_hans
  text: 这就是上帝诫命之书，也是存到永远的律法；凡持守它的，必得生命[a]；离弃它的，必死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“凡持守它的，归于生命”，是省略式表达；也可译作“凡持守它的，必存活”。
    reason: 保留原文省略结构及其可能译法。
lexical_decisions:
- source_word: βίβλος
  choice: 书
  rationale: 指成文的书卷或文献；现代汉语用“书”最自然，也适合“诫命之书”这一表达。
- source_word: προσταγμάτων
  choice: 诫命
  rationale: 表示有权威的命令或规定；与上帝及下文“律法”的语境相称。
- source_word: νόμος
  choice: 律法
  rationale: 这里指上帝具有约束力的法度；“律法”保留其宗教和法律含义，强于泛指的“教导”。
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  choice: 存到永远
  rationale: 表达持续存在、恒久不废；措辞自然，并保留律法恒久有效的意味。
- source_word: κρατοῦντες
  choice: 持守
  rationale: κρατέω在此不是单指用手抓住，而是坚定地遵守、不放弃；“持守”简洁而庄重。
- source_word: εἰς ζωὴν
  choice: 必得生命
  rationale: 希腊文是省略式表达，直译近于“归于生命”。正文按上下文译成自然汉语，同时用脚注保留其形式上的含混和另一种理解。
- source_word: καταλείποντες
  choice: 离弃
  rationale: 表示撇下或抛弃；“离弃”能体现主动背离律法，并与“持守”形成鲜明对照。
- source_word: ἀποθανοῦνται
  choice: 必死亡
  rationale: 保留简单将来时所表达的明确后果，也维持“生命—死亡”的直接对比。
theological_decisions:
- issue: 如何处理“εἰς ζωὴν”的省略结构及生命与死亡的对比
  choice: 正文译作“必得生命”，并以脚注说明直译及“必存活”的可能译法。
  alternative: 凡持守它的，必存活；离弃它的，必死亡。
  rationale: 希腊文前半句没有明说限定动词，只说“归于／通向生命”，而后半句明确说“必死亡”。正文采用自然可懂的汉语，脚注则避免掩盖原文的省略和歧义；同时保留 ζωή 与 ἀποθανοῦνται 的生命—死亡张力。
- issue: νόμος应译作“律法”还是较宽泛的“教导”
  choice: 律法
  alternative: 教导
  rationale: 它与“上帝的诫命”并列，语境强调具有约束力的神圣规范；“律法”更准确，不把含义泛化为一般教诲。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这就是……也是……”清楚呈现两个并列的表语；分号保留原文格言式的节奏和“持守—离弃、生命—死亡”的对照。
