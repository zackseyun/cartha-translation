base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/034.yaml
  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
translation:
  language: zh_hans
  text: 我要从她那里除去因人多而有的欢喜[a]，使她的骄傲变为哀恸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除去她众人的欢喜”。希腊语可指她因人口众多而欢喜，也可指她众人的欢喜。
    reason: lexical_alternative
  - marker: b
    text: “骄傲”也可译作“傲气”或“炫耀的荣光”；原词兼有自高和夸耀性显荣的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: 我要从她那里除去
  rationale: 该词是περιαιρέω的将来时，表示拿走、除去；这样既明确神主动施行，也自然对应与αὐτῆς连用的表达。
- source_word: ἀγαλλίαμα
  choice: 欢喜
  rationale: 表示欢腾、喜悦；“欢喜”在现代汉语中自然庄重，并保留其情感力度。
- source_word: τῆς πολυοχλίας
  choice: 因人多而有的
  rationale: πολυοχλία可指人群众多或人口兴盛；属格可表示欢喜的依据或来源。正文采用通顺的原因性表达，脚注保留“众人的欢喜”这一结构性可能。
- source_word: ἀγαυρίαμα
  choice: 骄傲
  rationale: 该词可指自高、傲气或夸耀性的荣光；“骄傲”最简洁地保留其自我抬高的核心含义，脚注说明其他语义可能。
- source_word: εἰς πένθος
  choice: 变为哀恸
  rationale: εἰς在此指向结果或状态转变；“哀恸”比一般的“悲伤”更能表达πένθος所含的哀悼意味。
theological_decisions:
- issue: 第二分句省略谓语
  choice: 补出“使……变为”，同时保留两个分句的平行关系
  alternative: 按希腊文压缩形式译作“并将她的骄傲归于哀恸”或重复“除去”
  rationale: 希腊文第二分句没有明写动词，意义依靠首句和εἰς πένθος补足。现代汉语若完全照省略结构直译会生硬；补出转变义不增加神学解释，只使隐含关系清楚。
- issue: 城市的拟人化阴性代词
  choice: 译作“她”
  alternative: 译作“它”或直接重复城名
  rationale: 原文以阴性代词指向被拟人化的城市；“她”可保留诗性拟人及上下文中的女性形象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文以自然句法补明第二分句隐含的转变关系，并用脚注保留两个关键词的真实语义幅度。
