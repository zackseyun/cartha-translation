  text: Take courage[a], my people, the memorial of Israel.
translation:
  language: zh_hans
  text: 鼓起勇气吧，我的子民，以色列的纪念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纪念”也可译作“记念”。希腊词 μνημόσυνον 可指纪念这件事，也可指使人记念的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: 鼓起勇气吧
  rationale: 这是 θαρσέω 的复数命令式，直接劝勉众人振作并有勇气；“鼓起勇气吧”符合现代汉语，同时保留命令和鼓励的语气。
- source_word: λαός μου
  choice: 我的子民
  rationale: 保留第一人称所属关系及群体、盟约性的称呼；“子民”比“人民”更适合这一庄重的直接呼语。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 该名词可指纪念、记念之事或作为纪念的对象。这里与“我的子民”构成无系词的同位呼语；采用“纪念”以保留其抽象与具体之间的张力，不把隐喻解释成“余民”等。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 按现代汉语圣经传统音译专名。
theological_decisions:
- issue: 同位短语 μνημόσυνον Ἰσραήλ 的含义
  choice: 按第二个呼语式同位语处理：“我的子民，以色列的纪念”
  alternative: “我的子民，以色列的记念”或解释为“被以色列记念的人／以色列的余民”
  rationale: 希腊文没有说明“纪念”具体指什么，也没有系词；译文保留简练而含混的隐喻，不将其神学意义单向落实。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“鼓起勇气吧”自然传达复数命令式；后半句刻意保留原文突兀的同位结构和语义张力。
