  text: We are blessed[a], O Israel[b], because what is pleasing to God is known to us.
translation:
  language: zh_hans
  text: 以色列啊，我们是有福的[a]，因为上帝所喜悦的事，我们知道。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福的”也可译作“幸福的”或“有福气的”；希腊文所表达的不只是内心快乐，也包括处于蒙福、值得庆贺的境况。
    reason: lexical_alternative
  - marker: b
    text: 本句直译为：“因为上帝所喜悦的事，是我们所知道的。”
    reason: literal_rendering
lexical_decisions:
- source_word: μακάριοί
  choice: 有福的
  rationale: 表达蒙福、处于可庆贺境况的含义，不限于主观的快乐，也比“幸运”更符合经文语体。
- source_word: ἐσμεν
  choice: 我们是
  rationale: 明确保留现在时系词，并与表语“有福的”自然衔接。
- source_word: Ἰσραήλ
  choice: 以色列啊
  rationale: 用句末语气词“啊”表达希腊文的呼格和直接称呼。
- source_word: τὰ ἀρεστὰ
  choice: 所喜悦的事
  rationale: 保留中性复数实体化表达的广泛含义，指蒙悦纳、讨上帝喜悦之事，不将其缩窄为“律法”。
- source_word: τοῦ θεοῦ
  choice: 上帝所喜悦
  rationale: 结合ἀρεστά表达“令上帝喜悦”，比生硬的“上帝的悦纳之事”更符合现代汉语。
- source_word: ἡμῖν
  choice: 我们
  rationale: 汉语“我们知道”已自然表达知识归于我们的与格关系，无须机械译作“为我们所知”。
- source_word: γνωστά ἐστιν
  choice: 都知道
  rationale: 以主动式自然表达“为我们所知”；“都”呼应τὰ ἀρεστὰ的复数整体，但不增添“已经启示”等原文未明说的被动含义。
theological_decisions:
- issue: 以色列蒙福之特权的性质
  choice: 译为知道“上帝所喜悦的事”
  alternative: 明确译作知道“上帝的律法”或笼统译作拥有“圣约特权”
  rationale: 上下文可使人联想到妥拉和圣约教导，但希腊文本身用语较宽，只说蒙上帝喜悦的事为以色列所知，因此不在正文中缩窄或扩展其所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列啊”保留直接呼告；正文使用自然主动句，脚注补出希腊文较直译的谓语形态。
