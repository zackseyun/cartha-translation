base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/035.yaml
  text: For fire will come upon her from the Everlasting One for many days[a], and she will be inhabited by demons for a very long time.
translation:
  language: zh_hans
  text: 因为火必从永恒者那里临到她，持续许多日子；她必长期成为群魔的居所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῦρ
  choice: 火
  rationale: 直译审判意象，不增添不定指成分。
- source_word: ἐπελεύσεται αὐτῇ
  choice: 降到她身上
  rationale: 表达临到并施行审判的意味；以“她”延续上下文对城的拟人化。
- source_word: παρὰ τοῦ αἰωνίου
  choice: 从永恒者那里
  rationale: 原文以形容词名词化作为神圣称号，并未明说“上帝”；“永恒者”既保留形式，也清楚指向神。
- source_word: εἰς ἡμέρας μακράς
  choice: 延续多日
  rationale: 自然表达持续一段很长日子的含义，同时保留“日”的原文意象。
- source_word: κατοικηθήσεται ὑπὸ δαιμονίων
  choice: 被群魔占据
  rationale: 被动式表示这城成为魔鬼居处；“占据”在废墟受邪灵盘踞的语境中比生硬的“被居住”自然。
- source_word: τὸν πλεῖονα χρόνον
  choice: 在极长的时期内
  rationale: 保留原文与前一时间短语并列而不完全相同的措辞，表达长期荒废。
theological_decisions:
- issue: 神圣称号 τοῦ αἰωνίου 的译法
  choice: 永恒者
  alternative: 永生者；永恒的上帝
  rationale: “永恒者”保留名词化形容词的称号性质，且不添加原文未明说的“上帝”。
- issue: δαιμόνια 在审判语境中的含义
  choice: 群魔
  alternative: 邪灵
  rationale: 这里描写被毁之城长期受敌对灵界存在盘踞；“群魔”准确体现复数及负面神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号清楚呈现两个未来审判陈述；保留城市的阴性拟人化为“她”，并以“永恒者”呈现原文神圣称号。
