  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: zh_hans
  text: 你们被卖给列国，并不是为了毁灭；却因你们惹上帝发怒，被交给了敌对者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: 你们被卖给
  rationale: 保留 πιπράσκω 的被动式及“被卖”的比喻，表达落入外族权下，而不擅自说明具体交易方式。
- source_word: τοῖς ἔθνεσιν
  choice: 列国
  rationale: 在流亡与审判语境中指外邦各国；“列国”简洁庄重，也避免“外邦人”可能带入的后期宗教色彩。
- source_word: οὐκ εἰς ἀπώλειαν
  choice: 并不是要被毁灭
  rationale: εἰς ἀπώλειαν 可表示目的或结果；此译自然地保留两者之间的语义空间，并表明并非走向最终毁灭。
- source_word: διὰ δὲ τὸ παροργίσαι
  choice: 而是因为你们惹……发怒
  rationale: διά 加冠词不定式表示原因；“惹……发怒”保留 παροργίζω 的使动和激怒意味。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为 παροργίσαι 的明确宾语，按现代汉语习惯译作“上帝”。
- source_word: παρεδόθητε
  choice: 才被交在……手中
  rationale: 体现 παραδίδωμι 被动式“被交付、交出”的含义；“交在……手中”自然表达落入对方权势之下，并保留审判语气。
- source_word: τοῖς ὑπεναντίοις
  choice: 敌对你们的人
  rationale: ὑπεναντίος 强调站在对立面的人；此译比笼统的“敌人”更贴近原词，也在中文中清楚自然。
theological_decisions:
- issue: 以色列流亡与审判的性质
  choice: 被卖给列国并非要被毁灭，而是因惹上帝发怒，遂被交在敌对者手中。
  alternative: 流亡不是灭绝，而是带有管教性质的审判。
  rationale: 原文明确对照“不是要被毁灭”与“因为你们惹上帝发怒”；译文保留这一张力，不进一步把经文扩展成完整的流亡或管教教义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列国”保留经文语体；“惹上帝发怒”和“交在……手中”兼顾自然表达与原文的因果、被动结构。
