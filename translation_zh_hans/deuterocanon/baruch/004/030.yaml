translation:
  language: zh_hans
  text: 耶路撒冷啊，要鼓起勇气[a]；给你起名的那一位[b]必安慰你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要振作起来。”
    reason: lexical_alternative
  - marker: b
    text: “给你起名的那一位”在上下文中指上帝，但希腊原文在这里没有明说神名或称号。
    reason: alternative_reading
lexical_decisions:
- source_word: Θάρσει
  choice: 要鼓起勇气
  rationale: 这是单数命令式，向拟人化的耶路撒冷发出振作、勇敢起来的劝勉。“要鼓起勇气”符合现代汉语表达，也保留了原文的劝勉力度。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: παρακαλέσει
  choice: 必安慰
  rationale: 该词为将来时；在耶路撒冷受苦而将获复兴的语境中，παρακαλέω侧重安慰、抚慰。“必”自然表达将来陈述在此处所带的确定意味。
- source_word: ὁ ὀνομάσας σε
  choice: 那给你起名的
  rationale: 保留带冠词的过去时分词之实体化用法，不在正文中补出“上帝”等原文未明说的称谓；“给你起名”自然传达命名这一具体动作。
theological_decisions:
- issue: “那给你起名的”所指是谁
  choice: 正文按描述性短语翻译，不明确补出“上帝”或“主”
  alternative: 译作“给你起名的上帝”或“给你起名的主”
  rationale: 上下文所指是上帝，但本节希腊文没有直接使用神名或神圣称号。保留描述性表达，既不遮蔽语境，也避免把隐含所指改写成明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“耶路撒冷啊”保留直接呼告，以分号呈现劝勉与应许之间的紧密关系。脚注标记均置于正文相应位置。
