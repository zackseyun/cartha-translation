  text: Do not give your glory to another[b][a], nor what benefits you to a foreign nation.
translation:
  language: zh_hans
  text: 不要把你的荣耀[a]给别人，也不要把对你有益的事[b]给外族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”或译“尊荣”。希腊语δόξα在这里可有这两种含义。
    reason: lexical_alternative
  - marker: b
    text: “对你有益的事”或译“你的福祉”或“你的利益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς
  choice: 不要……给
  rationale: μή加不定过去时虚拟语气表达禁令；“不要……给”朴素自然，不额外加入“交出”或“屈服”的强烈意味。
- source_word: ἑτέρῳ
  choice: 给别人
  rationale: ἕτερος意为“另一个、别的”；“别人”在现代汉语中简洁自然，并与后半句的“外族”形成对应。
- source_word: τὴν δόξαν σου
  choice: 你的荣耀
  rationale: δόξα可指荣耀、尊荣或荣誉；保留“荣耀”较能承载原文庄重而宽广的含义，不把所指限缩为名誉或某一特定盟约权益。
- source_word: τὰ συμφέροντά σοι
  choice: 对你有益的事
  rationale: 中性复数分词与与格σοι合用，泛指对受话者有利、有益之事；此译法保留范围的宽泛性，不限定为物质利益、福祉或政治优势。
- source_word: ἔθνει ἀλλοτρίῳ
  choice: 给外族
  rationale: ἔθνος在此指一个族群或民族，ἀλλότριος表示外来的、不属己方的；“外族”自然简洁，也避免将其专门神学化为“外邦人”。
theological_decisions:
- issue: “你的荣耀”的具体所指
  choice: 保留“你的荣耀”这一宽泛表达
  alternative: 你的尊荣；上帝赐给你的荣耀；你的盟约特权
  rationale: 希腊文本没有明确限定其所指。保留“荣耀”可维持其神学张力与丰富含义，避免加入经文本身未说明的教义解释。
- issue: τὰ συμφέροντά σοι的范围
  choice: 译为“对你有益的事”
  alternative: 你的福祉；你的利益；你的优势
  rationale: 原短语语义宽泛，既可涵盖实际利益，也可带有群体或盟约层面的意味；采用一般性译法，不将其缩窄为物质繁荣或属灵福分。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。两个并列禁令都用“不要把……给……”表达，以体现希腊文结构；“荣耀”和“对你有益的事”保留原文的语义宽度。脚注标记按正文对应词语自然排列。
