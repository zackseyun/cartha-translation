base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/033.yaml
  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
translation:
  language: zh_hans
  text: 正如她[a]因你的倾覆而欢喜，因你的败亡[b]而快乐；她也必照样因自己的荒凉而悲伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”很可能指上下文中的敌对城邑或国家；传统上常理解为巴比伦。
    reason: cross_reference
  - marker: b
    text: “败亡”也可译为“毁灭”或“倾覆”。希腊文此词在这里指灾祸，并非指字面意义的尸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: 因为……怎样……也必照样
  rationale: 保留γάρ的解释语气和ὥσπερ…οὕτως的明确对比结构，同时符合现代汉语表达。
- source_word: ἐχάρη
  choice: 欢喜
  rationale: 准确表达因对方遭难而喜悦的含义，并与后面的“快乐”构成近义并列。
- source_word: πτώσει
  choice: 倾覆
  rationale: 表达πτῶσις所指的跌落、衰败或覆亡，并保持庄重语体。
- source_word: εὐφράνθη
  choice: 快乐
  rationale: 与“欢喜”有所区别，保留原文两个相近但不同的喜乐动词。
- source_word: πτώματί
  choice: 败亡
  rationale: 此处与πτῶσις平行，指灾祸或覆亡而非字面意义的尸体；“败亡”自然地体现局势崩溃。
- source_word: λυπηθήσεται
  choice: 必……悲伤
  rationale: 以自然汉语表达将来的忧伤反应，并用“必”体现未来陈述。
- source_word: ἐρημίᾳ
  choice: 荒凉
  rationale: 在审判与城邑毁坏的语境中，指荒废、凋敝的状态，而非单指旷野。
- source_word: ἑαυτῆς
  choice: 自己
  rationale: 保留反身代词的强调，清楚呈现报应反转：她将因自身的荒凉悲伤。
theological_decisions:
- issue: 阴性主语所指对象
  choice: 正文使用“她”和“自己”，不直接点明其身份
  alternative: 在正文中明确译为“巴比伦”或“敌城”
  rationale: 希腊文仅以阴性单数动词和反身代词承接上下文；保留代词既忠于原文，也避免在本节中把传统认定直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“倾覆／败亡”保留原文近义复沓，以“欢喜／快乐”对应两个不同的喜乐动词；不采用容易让人误解为字面尸体的译法。
