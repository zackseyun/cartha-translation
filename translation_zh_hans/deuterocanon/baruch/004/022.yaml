- from: 因为我仰望永恒者，盼望你们得救；喜乐也从圣者临到我，因为怜悯将从你们永恒的救主那里迅速临到你们。
  to: 因为我把你们的救恩寄望于永恒者；喜乐从圣者那里临到我，是因那将从你们永恒的救主那里迅速临到你们的怜悯。
  rationale: 修订首句以“把……寄望于……”准确且自然地表达“盼望……在于／寄于……”。后半句保留原文的来源表达、重复的“临到”、怜悯的拟人化表述，以及“迅速”的事件速度含义；未将救恩或怜悯作特定教义化限定。
