base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/022.yaml
  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: zh_hans
  text: 因为我把你们的救恩寄望于永恒者；喜乐从圣者那里临到我，是因那将从你们永恒的救主那里迅速临到你们的怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλπισα ἐπὶ τῷ αἰωνίῳ
  choice: 仰望永恒者，盼望
  rationale: 既保留ἐπί所表达的倚靠、仰望对象，也用“盼望”传达ἤλπισα；“永恒者”对应带冠词且实体化的αἰώνιος。
- source_word: τὴν σωτηρίαν ὑμῶν
  choice: 你们得救
  rationale: 以自然现代汉语表达“你们的救恩”，不额外限定为今世解救或终末救赎。
- source_word: παρὰ τοῦ ἁγίου
  choice: 从圣者
  rationale: 保留带冠词且实体化的ἅγιος作为神的称号，并准确表达παρά的来源含义。
- source_word: ἐλεημοσύνῃ
  choice: 怜悯
  rationale: 此处指由神而来的慈悲、怜恤，而非通常由人施行的“施舍”。
- source_word: ἐν τάχει
  choice: 迅速
  rationale: 表达事件将快速发生，避免把含义仅收窄为时间点上的“不久以后”。
- source_word: τοῦ αἰωνίου σωτῆρος ὑμῶν
  choice: 你们永恒的救主
  rationale: 按希腊语修饰关系直译，保留“永恒的”修饰“救主”的可能神学张力。
theological_decisions:
- issue: αἰώνιος作为神的称号
  choice: 永恒者
  alternative: 永在者
  rationale: “永恒者”直接对应αἰώνιος，并与后文“永恒的救主”形成词汇呼应；不借用可能带有特定经文传统色彩的专名。
- issue: σωτηρία的范围
  choice: 得救
  alternative: 获救／救恩
  rationale: 不明确限定为政治复归、脱离流亡或终末救赎，从而保留原文的宽广含义。
- issue: ἐλεημοσύνη的施行者
  choice: 怜悯将从……救主那里……临到
  alternative: 救主将向你们施怜悯
  rationale: 保留原文将“怜悯”作为临到之事的拟人化句法，而不改写为更明确的主动施予。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“永恒者”“圣者”两个神圣称号及原文重复的“临到”，使上下句结构呼应。
