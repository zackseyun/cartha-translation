  text: and the mercy of your promise is immeasurable and unsearchable;[a]
translation:
  language: zh_hans
  text: 你应许的怜悯无法测量，也无法探究；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你应许中的怜悯”，或“你在应许中所显明的怜悯”。希腊语的属格结构可以有几种彼此相关的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  choice: 无法测量
  rationale: 保留该词“不能被量度”的数量意象；现代汉语自然清楚，也与后面的“无法探究”形成对应。
- source_word: ἀνεξιχνίαστον
  choice: 无法探究
  rationale: 表达无法追索、查明或穷尽之意，保留希腊语的探寻意象，同时避免把含义过度限定为理智上的“不可理解”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: “怜悯”是祷告和悔罪语境中自然、庄重且通行的对应词，也保留对受苦或有罪之人施恩的意味。
- source_word: ἐπαγγελίας
  choice: 应许
  rationale: “应许”直接对应 ἐπαγγελία，并适合神向人所作承诺的语境；不额外加入盟约等原文未明说的解释。
- source_word: τε καὶ
  choice: 也
  rationale: 用“……也……”自然连接两个并列形容词的判断，体现二者紧密并列，而不机械译成“既……又……”。
theological_decisions:
- issue: τὸ ἔλεος τῆς ἐπαγγελίας σου 中“怜悯”与“应许”的属格关系
  choice: 你应许的怜悯
  alternative: 你应许中的怜悯／你应许所显明的怜悯
  rationale: 希腊语直译为“你应许的怜悯”，属格关系可表示怜悯是所应许的，也可表示怜悯属于或显明于应许之中。正文采用自然的现代汉语“你应许的怜悯”，脚注保留其他紧密相关的理解，不把关系定死。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“无法测量，也无法探究”保留两个形容词的平行结构及其不同意象；正文避免古奥的“不可测度、无法测透”，同时不削弱原文的崇高语气。
