  text: who shut up the abyss and sealed it with your fearful and glorious name,[a]
translation:
  language: zh_hans
  text: 你封闭了深渊，又以你可畏而荣耀的名将它封印。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”或译“令人敬畏”。
    reason: 词义备选：φοβερός既可强调使人畏惧，也可强调令人敬畏。
lexical_decisions:
- source_word: ὁ κλείσας
  choice: 你封闭了
  rationale: κλείω的不定过去时分词描述受祷告者已经施行的行动。译作“封闭了”既保留关闭、禁闭的具体含义，也适合宇宙性的“深渊”语境。
- source_word: τὴν ἄβυσσον
  choice: 深渊
  rationale: ἄβυσσος在圣经希腊语中可指原初的深水或不可测的深处；“深渊”自然、庄重，并保留其宇宙论意涵。
- source_word: σφραγισάμενος
  choice: 将它封印
  rationale: 该中间语态分词表示加印使之封固。“封印”保留印记与严密封住的形象；“将它”清楚回指深渊。
- source_word: τῷ ... ὀνόματί σου
  choice: 以你……的名
  rationale: 工具与格表示施行封印所凭借的手段；“以你……的名”在现代汉语中庄重自然，也准确表达凭借此名。
- source_word: φοβερῷ
  choice: 可畏
  rationale: φοβερός兼有使人惧怕与激发敬畏之意。“可畏”简洁庄重，保留两者之间的张力；脚注列出偏重敬畏意味的译法。
- source_word: ἐνδόξῳ
  choice: 荣耀
  rationale: ἐνδόξος表示有荣耀、尊荣或显赫。“荣耀”是清楚而庄重的对应词，并与“可畏”形成原文的并列修饰。
theological_decisions:
- issue: 如何表达φοβερῷ用于上帝之名时兼具惧怕与敬畏的含义
  choice: 可畏
  alternative: 令人敬畏
  rationale: “可畏”没有把词义单独收窄为恐怖或赞叹，能保留上帝之名使人畏惧而敬服的神学张力；脚注提供更明显突出敬畏意味的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“又”自然连接两个希腊语分词所表达的连续行动；保留“深渊”“封印”等宇宙性和具象性的用语。
