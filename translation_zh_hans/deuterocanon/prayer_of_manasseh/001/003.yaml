  text: 那借着你命令的话语束缚海的，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那借着你命令的话语约束海的。”希腊原文的意象更具体，直译为“束缚”或“给……加上脚镣”。
    reason: 词义备选；说明原文的具体比喻。
lexical_decisions:
- source_word: ὁ πεδήσας
  choice: 就是那……束缚……的主
  rationale: 分词 πεδήσας 带有“捆绑、加上脚镣”的具体意象；“束缚”在现代汉语中庄重自然，也保留了原文鲜明的比喻。根据祷告中对上帝的称呼语境补出“主”，使独立经节在中文中完整顺畅。
- source_word: τὴν θάλασσαν
  choice: 大海
  rationale: θάλασσα 直接指海；“大海”符合现代汉语习惯，并未泛化为“众水”。
- source_word: τῷ λόγῳ
  choice: 用……的话
  rationale: λόγος 在此指说出的话或具有权威的宣告；译作“话”保留上帝借言语施行权能的表达。
- source_word: τοῦ προστάγματός σου
  choice: 你命令的
  rationale: πρόσταγμα 指命令、吩咐。采用“你命令的话”表达属格关系，较“你命令之言”更符合现代汉语，同时保持语义力度。
theological_decisions:
- issue: 以束缚大海的比喻表达上帝对受造界的主权
  choice: 保留“束缚大海”的具体意象
  alternative: 约束大海；限制大海；为大海划定界限
  rationale: 原文采用表示捆绑或加镣的鲜明动词，而非一般性的限制或划界。直保留该意象，既呈现上帝权威制服大海的画面，也不把经文解释成原句未明说的创造界限。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“束缚”保留希腊文的具体意象；“你命令的话”避免文言化的“你命令之言”。正文脚注标记与脚注一致。
