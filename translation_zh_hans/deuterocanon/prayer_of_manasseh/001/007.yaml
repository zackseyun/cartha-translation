revisions:
- from: 因为你是至高的主，满有怜悯，恒久忍耐，慈爱丰盛，并且因世人的祸患而回心转意[a]。
  to: 因为你是至高的主，大有怜悯，恒久忍耐，慈爱丰盛，并且会对世人的祸患改变心意[a]。
  rationale: 修订将“因……而回心转意”改为“对……改变心意”，较准确地表达μετανοῶν ἐπὶ的关系，并消除“回心转意”带来的现代口语和行为改正联想。正文仍采用“世人的祸患”这一可成立的语境性理解，脚注明确保留“世人的恶行”的替代理解，未将原文争议静默抹平。
