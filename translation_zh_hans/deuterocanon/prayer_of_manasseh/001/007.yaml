base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: zh_hans
  text: 因为你是至高的主，大有怜悯，恒久忍耐，慈爱丰盛，并且会对世人的祸患改变心意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对世人的祸患改变心意”也可译作“对世人的恶行转意”。希腊语κακίαις可指邪恶、恶行或灾祸；这里“改变心意”是指上帝不施行原拟的审判，并非指他为道德过错悔罪。
    reason: 保留μετανοῶν与κακίαις的词义张力，并避免将上帝的“改变心意”误解为道德上的悔罪。
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: 至高的主
  rationale: κύριος在此是对上帝的称号，ὕψιστος是“至高者／至高的”；合译为“至高的主”，庄重自然，并保留神圣称号的力量。
- source_word: εὔσπλαγχνος
  choice: 满有怜悯
  rationale: 该词表示发自内心的深切怜悯；如此翻译清楚自然，也与后面的πολυέλεος有所区别。
- source_word: μακρόθυμος
  choice: 恒久忍耐
  rationale: 该词含长久忍耐、迟缓发怒之意；“恒久忍耐”既贴近构词含义，又比单说“忍耐”更充分。
- source_word: πολυέλεος
  choice: 慈爱丰盛
  rationale: 该复合词强调怜悯极其丰富；“慈爱丰盛”是自然、庄重的中文表达，并避免连续重复“怜悯”。
- source_word: μετανοῶν
  choice: 回心转意
  rationale: 该分词用于上帝时，表示改变原先的处置、收回将施的灾祸，而非为道德过错悔罪；“回心转意”保留了原词“改变心意”的张力。
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: 因世人的祸患
  rationale: ἐπί加与格在此可表达所针对或所关涉之事；κακίαις既可能指恶行，也可能指灾祸。结合上帝“回心转意”的圣经惯用语境，“祸患”较可能指原拟施加的灾难，但原文存在压缩和歧义，故以脚注说明。
theological_decisions:
- issue: 如何理解用于上帝的μετανοῶν
  choice: 回心转意
  alternative: 后悔；转意不降灾
  rationale: “后悔”在现代中文中容易暗示上帝先前犯错；“转意不降灾”则把上下文推论直接写入正文。选择“回心转意”既避免道德悔罪的误解，也保留上帝对人的恶与灾祸作出回应的经文张力。
- issue: κακίαις指人的恶行还是临到人的祸患
  choice: 正文作“世人的祸患”，脚注保留“世人的恶行”的可能
  alternative: 世人的恶行
  rationale: 希腊语κακία可指邪恶、恶行，也可指祸患、灾难；与上帝μετανοεῖν搭配时常有转意不降灾的背景，但本句语法并未完全消除另一种理解，因此不应静默抹平歧义。
- issue: ἀνθρώπων的中文性别表达
  choice: 世人
  alternative: 人类；男人们
  rationale: ἀνθρώπων在此泛指人类，而非仅指男性；现代汉语“世人”准确保留普遍所指，无须人为加入男性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“恒久忍耐”“慈爱丰盛”保持祷文的排比节奏；正文仅设一个脚注，并确保标记[a]出现在相应短语之后。
