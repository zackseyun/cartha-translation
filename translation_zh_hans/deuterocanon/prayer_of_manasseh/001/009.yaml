base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: zh_hans
  text: 因为我所犯的罪，比海沙的数目还多。主啊，我的不法之事增多了，我的不法之事增多了；因我不义之事众多，我不配定睛观看[a]天之高处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“抬头仰望”。希腊语动词着重于凝神注视；因所观看的是“天之高处”，在这里也可能含有向上仰望之意。
    reason: 词义与语境容许“凝神注视”和“抬头仰望”两种侧重点。
lexical_decisions:
- source_word: ἥμαρτον
  choice: 我所犯的罪
  rationale: 该不定过去时在认罪语境中概括已经犯下、如今仍须承担后果的罪；汉语用“我所犯的罪”也能自然承接后面的数量比较。
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: 比海沙的数目还多
  rationale: 保留原文超出海沙数目的比较意义，同时采用现代汉语自然的表达。
- source_word: ἐπλήθυναν
  choice: 增多了
  rationale: 表达变得众多、不断累积的数量含义，并保留原文两次重复所形成的认罪语势。
- source_word: ἀνομίαι
  choice: 不法之事
  rationale: “不法”保留违反上帝律法与秩序的道德—法律意味；加“之事”使复数行为在现代汉语中清楚自然。
- source_word: κύριε
  choice: 主啊
  rationale: 以现代汉语呼格“啊”明确直接向上帝呼求，语气庄重而不古奥。
- source_word: οὐκ εἰμὶ ἄξιος
  choice: 我不配
  rationale: 简洁自然地表达说话者自认没有资格或不堪如此行。
- source_word: ἀτενίσαι καὶ ἰδεῖν
  choice: 定睛观看
  rationale: ἀτενίζω侧重凝神、目不转睛地看，ἰδεῖν表达看见；“定睛观看”兼顾两词而不把原文未明说的向上动作写入正文。
- source_word: τὸ ὕψος τοῦ οὐρανοῦ
  choice: 天之高处
  rationale: 保留单数ὕψος所表达的高度、高处意象，并维持祷文的庄重节奏。
- source_word: ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου
  choice: 因我不义之事众多
  rationale: 按语境将ἀπό理解为原因；“不义之事”保留ἀδικία的道德含义，并与ἀνομίαι所译“不法之事”有所区别。
theological_decisions:
- issue: 同一认罪中区分ἀνομίαι与ἀδικιῶν
  choice: 分别译为“不法之事”和“不义之事”
  alternative: 两者都译为“罪”或“罪孽”
  rationale: 原文有意使用两个相关而不完全相同的道德词语；分别翻译可保留其修辞层次，避免将两者扁平化为同一个泛称。
- issue: ἀτενίσαι是否应直接译出“抬头”
  choice: 正文译“定睛观看”，脚注说明也可按语境理解为“抬头仰望”
  alternative: 正文直接译“抬头仰望”
  rationale: 该动词本身主要强调凝神注视，不专指向上看；然而宾语是“天之高处”，语境自然可能包含仰望动作。正文与脚注共同保留这层歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留“不法之事增多了”的原文重复，以呈现强烈的认罪语势；避免使用较古奥的“罪愆”“不义诸行”等表达。
