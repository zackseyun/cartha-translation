  text: And now I bend the knee of my heart[a], imploring the kindness from you[b];
translation:
  language: zh_hans
  text: 现在，我屈下心中的膝[a]，恳求那从你而来的恩慈[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我使心中的膝屈下。”希腊原文保留了内心跪下的鲜明比喻。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恳求你的恩慈。”原文直译含有“从你而来”，强调这恩慈以上帝为源头。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 用自然的现代汉语标明祷告推进到当前的恳求；上下文的衔接在中文中无需机械译出 καί。
- source_word: κλίνω
  choice: 屈下
  rationale: 保留弯屈膝盖的具体动作意象，也适合庄重的祷告语体。
- source_word: γόνυ καρδίας
  choice: 心中的膝
  rationale: 原文以单数“膝”配“心”的属格，构成内在跪拜的鲜明隐喻；译文不将其淡化为一般的谦卑。
- source_word: δεόμενος
  choice: 恳求
  rationale: 表达迫切而谦卑的祈求，强于普通的“请求”，同时保持自然、庄重。
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: 那从你而来的恩慈
  rationale: “恩慈”兼顾 χρηστότης 的良善与仁厚意味；“从你而来”明确保留 παρὰ σοῦ，强调这种恩慈源自上帝。
theological_decisions:
- issue: γόνυ καρδίας 的内在跪拜隐喻
  choice: 保留为“心中的膝”
  alternative: 将其解释性地译为“我谦卑己心”或“我俯伏在你面前”
  rationale: 原文借身体跪下描绘内心悔罪与降卑。保留其张力和形象，不在正文中加入原文未明说的解释。
- issue: παρὰ σοῦ 所表达的来源关系
  choice: 译作“从你而来的”
  alternative: 简化为“你的恩慈”或理解为单纯的祈求对象“求你的恩慈”
  rationale: 原文可自然指向来自上帝的恩慈；明译来源关系，既不省略介词短语，也不进一步界定这种恩慈如何施予。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“心中的膝”有意保留原文略显奇特的诗性隐喻；“恩慈”比日常的“好意”更符合向上帝祈求的语境，又不把 χρηστότης 专门化为“怜悯”。
