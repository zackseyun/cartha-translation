base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: zh_hans
  text: 我要在我一生的日子里不断赞美你，因为天上的众军[a]都歌颂你；荣耀永远属于你。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的一切能力”，也可理解为“天上一切有权能者”。原文可指天上的众军或众灵，也可按字面指天界的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: 我要赞美
  rationale: 将简单将来时译为“我要”，既表达将来的行动，也保留祷告者立志赞美的语气。
- source_word: διὰ παντός
  choice: 不断
  rationale: 这是表示持续或时时如此的惯用语；“不断”符合现代汉语，也不与后面的生命时段表达重复。
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: 在我一生的日子里
  rationale: 保留原文“在……日子里”的时间意象；原文没有“所有”一词，因此不另加“所有”，同时以自然汉语表达整个在世生命期间。
- source_word: ὑμνεῖ
  choice: 歌颂
  rationale: 兼顾ὑμνέω的歌唱意味与赞美含义，比单用“赞美”更能体现原词的颂歌色彩。
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: 天上的众军
  rationale: 在犹太—希腊语的天界语境中，δύναμις可指天上的军旅或众灵；“众军”保留其集合意义，又不具体限定为某一类天使。原文也可能按字面理解为天界的一切能力，故加注说明。
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: 荣耀属于你
  rationale: 清楚表达原文强调的归属关系，并保持颂赞文体的庄重。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是颂赞语中表示无尽久远的固定表达；“永远”是自然、准确的现代汉语。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代中文圣经和礼仪传统中通行的音译。
theological_decisions:
- issue: πᾶσα ἡ δύναμις τῶν οὐρανῶν所指为何
  choice: 正文译作集合性的“天上的众军”
  alternative: “天上的一切能力”或“天上一切有权能者”
  rationale: 颂赞语境及圣经希腊语用法支持把δύναμις理解为天上的众灵或军旅；但原词也保有“能力、权能”的词义空间，因此以脚注保留歧义，不进一步规定其天使论身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首“我要”保留祷告者的决意；分号划分赞美的理由与最终颂荣句，使结尾具有清晰的礼仪节奏。
