  text: I have sinned, Lord, I have sinned, and I myself know my lawless deeds;
translation:
  language: zh_hans
  text: 主啊，我犯了罪，我犯了罪；我自己知道我的不法之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不法之事”也可译作“罪孽”。希腊语指不守律法或违背法度的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  choice: 我犯了罪
  rationale: 完成时主动直陈语气表达已经犯下、并对当下仍有影响的罪；现代汉语“我犯了罪”在忏悔语境中自然地保留这种现实关联。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε是κύριος的呼格；汉语直接称呼通常加“啊”，既自然又符合祷告语体，并不额外强化原文。
- source_word: τὰς ἀνομίας μου
  choice: 我的不法之事
  rationale: ἀνομία指不守律法、违背法度，而非泛指一切错误；“不法之事”保留其与法度的语义联系，并可指具体行为。
- source_word: ἐγὼ γινώσκω
  choice: 我自己也知道
  rationale: γινώσκω取基本义“知道”；明说的ἐγώ带有强调，译作“我自己”，而“也”使汉语承接前面反复的认罪更自然，不把该词径直解释为“承认”。
theological_decisions:
- issue: 忏悔祷告中ἀνομία的译法
  choice: 不法之事
  alternative: 罪孽；过犯
  rationale: “不法之事”较直接地呈现违背律法的含义，既保留道德分量，也避免用传统神学术语替代原词较具体的语义。
- issue: 祷告中对κύριε的直接称呼
  choice: 主啊
  alternative: 主
  rationale: “主”对应κύριος；句中为直接呼语，现代汉语用“啊”表达呼格关系自然得体。
- issue: ἐγώ的强调是否明译
  choice: 我自己
  alternative: 我
  rationale: 希腊语动词已包含主语，额外出现ἐγώ具有强调作用；明译为“我自己”可保存这一强调，虽略显郑重，却符合认罪祷告语境。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留“我犯了罪”的重复，以呈现原文忏悔的力度；用分号连接认罪与自知，使汉语节奏清楚。
