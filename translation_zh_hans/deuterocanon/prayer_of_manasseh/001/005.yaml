base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/005.yaml
  text: before whom all things shudder and tremble at the presence of your power[a], for the majesty of your glory is unendurable, and the wrath of your threat against sinners is unbearable[d][c][b],
translation:
  language: zh_hans
  text: 在你面前，万物都因你大能的临在[a]而战栗颤抖；因为你荣耀的威严不可承受[b]，你向罪人所发威吓的烈怒也无法抵挡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从你大能的面前”；也可译“在你大能面前”。
    reason: 说明ἀπὸ προσώπου的字面意象及可行译法。
  - marker: b
    text: 或译“你荣耀的威严不可抵挡”。
    reason: ἄστεκτος兼有不能承受与不能抵挡之意。
  - marker: c
    text: 或译“你对罪人的威吓所带来的烈怒也无法承受”。
    reason: 原文中“烈怒”与“威吓”以属格相连，二者的确切关系可有不同理解。
lexical_decisions:
- source_word: ὃν
  choice: 在你面前
  rationale: 关系代词回指上文的上帝。汉语用“在你面前”自然表达受造万物面对上帝时的反应，同时不另行补入解释。
- source_word: πάντα
  choice: 万物
  rationale: 中性复数指向整体性的受造界；“万物”简洁、庄重，并保留其宇宙性范围。
- source_word: φρίσσει καὶ τρέμει
  choice: 战栗颤抖
  rationale: 两个近义动词并列，加强因敬畏而产生的身体性震颤；译文保留并列与递加强度。
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: 因你大能的临在
  rationale: ἀπὸ προσώπου直译为“从……面前”，在此表示面对神圣大能的临在而产生畏惧。“因……临在”兼顾因果关系与临在意象。
- source_word: ἄστεκτος
  choice: 不可承受
  rationale: 该词可指不能站立于其前、不能抵挡或不能忍受。正文采用“不可承受”，保留神圣威严压倒一切的力量，脚注注明“不可抵挡”的可能。
- source_word: μεγαλοπρεπία τῆς δόξης σου
  choice: 你荣耀的威严
  rationale: 保留μεγαλοπρεπία与δόξα的属格结构，分别译作“威严”和“荣耀”，避免将两个概念合并为单一的“荣光”。
- source_word: ἀνυπόστατος
  choice: 无法抵挡
  rationale: 此词表示不能承受、支持或抵御。与前句ἄστεκτος构成近义平行，汉语略作措辞变化，以免机械重复而仍保留强度。
- source_word: ἡ ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  choice: 你向罪人所发威吓的烈怒
  rationale: 尽量保留“烈怒”与“威吓”的属格关系及“向罪人”的指向，不把它改写成较弱的“警告”，也不扩展为完整的审判教义。
theological_decisions:
- issue: 上帝的烈怒与对罪人的威吓所采用的拟人性语言
  choice: 保留“你向罪人所发威吓的烈怒”这一强烈而具位格性的表达
  alternative: 你警告罪人时所显的愤怒；向罪人所预告的烈怒
  rationale: 原文明确使用ὀργή（烈怒）和ἀπειλή（威吓）。译文不将其淡化为非位格性的后果，也不进一步说明烈怒与威吓之间原文未明说的逻辑关系。
- issue: 两个近义形容词是否统一译法
  choice: 分别译为“不可承受”和“无法抵挡”
  alternative: 两处都译为“无法承受”
  rationale: ἄστεκτος与ἀνυπόστατος意义相近，却并非完全相同。措辞变化既呈现诗性平行，也保留“承受”和“抵挡”两方面的语义张力。
translation_notes:
  register: 采用现代、庄重而适合祷告文体的普通话。“万物”“威严”“烈怒”等词保留礼仪性与神学分量；句式避免文言化过度，同时以分号呈现原文两层因果与平行结构。
