base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: zh_hans
  text: 我被重重铁链压得弯下腰来[a]，无法抬起头来，也毫无舒缓；因为我激起了你的愤怒，在你面前行了恶，设立可憎之物[b]，又增添了许多冒犯你的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无法抬起头来”也可译作“无法恢复过来”或“无法重新仰望”；希腊语可指重新振作，也可指身体重新抬起。
    reason: lexical_alternative
  - marker: b
    text: “可憎之物”很可能指令人厌恶的事物或行为，尤其可能涉及偶像崇拜及所设立的偶像等物。
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: 被……压弯了腰
  rationale: 保留人在重压之下弯腰屈身的具体形象；用被动结构自然衔接铁链所造成的压迫。
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: 沉重的铁链
  rationale: δεσμός可指捆绑、锁链或镣铐；πολλῷ在单数短语中更自然地表达强大、深重的束缚，译作“沉重”避免生硬地复数化。
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: 无法抬起头来
  rationale: ἀνανεύω可表示重新抬起、仰视或恢复过来；上下文先说弯腰受压，因此正文保留身体动作，同时在脚注中说明其他可能。
- source_word: ἄνεσις
  choice: 解脱
  rationale: 该词可表示松弛、缓解或释放；在铁链束缚的语境中，“解脱”兼顾身体束缚与困苦不得舒缓之意。
- source_word: παρώργισα τὸν θυμόν σου
  choice: 我激起了你的烈怒
  rationale: παροργίζω具有惹动、激起愤怒的使动意味；“烈怒”体现θυμός的强烈程度与庄重语域。
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: 在你面前行了恶
  rationale: 保留圣经语体中“在你面前”的神向性，又使用现代汉语中简洁自然的“行了恶”。
- source_word: στήσας βδελύγματα
  choice: 设立可憎之物
  rationale: στήσας是设立、竖立；βδελύγματα指令人厌恶之物，语境很可能涉及偶像，但正文不把隐含所指绝对化。
- source_word: πληθύνας προσοχθίσματα
  choice: 增添了许多冒犯你的事
  rationale: 罕见名词προσοχθίσματα指招致厌恶或触怒之事；补出“你的”使汉语关系清楚，并与前文神的烈怒相连。
theological_decisions:
- issue: 神之怒的表达
  choice: 你的烈怒
  alternative: 你的愤怒／你的震怒
  rationale: 原文直接使用θυμός描述神的强烈怒气；“烈怒”保留审判语气，而不引入原文之外的教义解释。
- issue: ἀνανεῦσαί的身体或心理含义
  choice: 无法抬起头来
  alternative: 无法恢复过来／无法重新仰望
  rationale: 铁链压弯身体的近距离语境支持“抬起头来”，但该动词也可能指恢复精神或重新仰望，因此以脚注保留歧义。
- issue: βδελύγματα是否明译为偶像
  choice: 可憎之物
  alternative: 偶像／可憎的祭祀之物
  rationale: 词语常有敬拜偶像的背景，但本句本身未明说“偶像”；正文保持广度，脚注提示其很可能具有偶像崇拜含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“压弯了腰—抬起头来”保留原文连贯的身体意象；“可憎之物”避免把可能的偶像崇拜所指写成正文中唯一确定的解释。
