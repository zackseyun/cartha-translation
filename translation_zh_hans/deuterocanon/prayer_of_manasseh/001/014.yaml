base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: zh_hans
  text: 你也必在我身上[a]彰显你的恩慈[b]；因为我虽不配，你仍必照着你丰盛的怜悯拯救我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在我里面”；也可理解为“向我”或“借着我”。
    reason: lexical_alternative
  - marker: b
    text: 或译“良善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δείξεις
  choice: 彰显
  rationale: 这是 δείκνυμι 的将来主动形式，意为“显明、展示”。“彰显”既保留公开显出的意味，也符合庄重而自然的祷告语体。
- source_word: ἐν ἐμοί
  choice: 在我身上
  rationale: ἐν 的直接意义是“在……里面/身上”。此处指上帝的恩慈将在玛拿西本人及其蒙拯救的经历上显明；“在我身上”比生硬的“在我里面”更符合现代汉语，同时保留原文的表达张力。
- source_word: χρηστότητά
  choice: 恩慈
  rationale: χρηστότης 可指恩慈、仁厚或良善。“恩慈”突出上帝仁厚待人的行动，也与后文的“怜悯”有所区别；并可维持本祷文中同一词语的主题联系。
- source_word: ἀνάξιον ὄντα
  choice: 我虽不配
  rationale: 字面为“我是/身为不配的”。上下文含有让步关系，以“虽不配”自然呈现说话者的不配与上帝施行拯救之间的对照。
- source_word: σώσεις
  choice: 拯救
  rationale: σῴζω 可指救援、搭救或拯救；“拯救”保留本忏悔祷告中现实救助与救恩意涵的宽度。
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: 照着你丰盛的怜悯
  rationale: κατά 加宾格表示准则或尺度；πολύ 强调怜悯的广大充盈。“照着你丰盛的怜悯”准确表达原文结构，并符合现代汉语宗教语体。
theological_decisions:
- issue: ἐν ἐμοί 应直译为“在我身上”，还是解释为“向我”或“借着我”
  choice: 在我身上
  alternative: 向我；借着我
  rationale: 原文使用 ἐν，并未迫使译者限定为接受恩慈的对象或彰显恩慈的媒介。“在我身上”既自然，又保留上帝的恩慈在说话者本人及其经历中得到彰显的开放含义。
- issue: ἀνάξιον ὄντα 的分词结构是否明确译成让步关系
  choice: 我虽不配
  alternative: 我是不配的；身为不配的人
  rationale: 拯救不配之人与上帝丰盛怜悯之间形成明显对照。“虽……仍……”把原文隐含的让步关系化为自然汉语，但不把拯救归因于人的配得。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“恩慈”与“怜悯”分别对应 χρηστότης 和 ἔλεος，避免把两个相关但不同的词合并；“你仍必”自然呈现让步对照。
