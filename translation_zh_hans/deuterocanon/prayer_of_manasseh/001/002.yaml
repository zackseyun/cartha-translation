  text: the one who made heaven and earth[a], with all their host,
translation:
  language: zh_hans
  text: 你创造了天地，连同其中的一切秩序[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“及其一切有序的整体（或万象）”或“及其一切陈设（或装饰）”。希腊语 κόσμος 在这里可指秩序、安排或装饰性的整体；由于前文已说“天地”，它不必是再次提到“世界”。
    reason: 说明 κόσμος 的词义范围及其在此处的歧义，避免正文将其狭义化为“世界”或改写为“秩序井然的事物”。
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: 你创造了
  rationale: 带冠词的简单过去时分词在上下文中描述受呼求的上帝。汉语用第二人称完整分句承接祷告语境，比直译成残缺的“那位创造……的”更自然；“创造”准确表达此处宇宙起源语境中的 ποιέω。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: 在宇宙论性的固定搭配中，οὐρανός 与 γῆ 合指整个受造领域；“天地”是简洁、庄重且自然的现代汉语表达。
- source_word: σὺν
  choice: 以及
  rationale: 表示随同、连同，说明后面的内容也属于所创造的范围；“以及”在此比“连同”更顺畅。
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: 其中秩序井然的一切
  rationale: κόσμος 在这里较可能指天地所属的整体秩序、陈列或有序万象，而非再次指“世界”。此译法既保留“秩序”的核心含义，也用自然汉语表达其总体性的指称；αὐτῶν 则以“其中”体现其属于天地。
theological_decisions:
- issue: 创造语境中 κόσμος 的含义
  choice: 译作“其中秩序井然的一切”
  alternative: “其一切秩序”、“其一切陈设”或“其中的一切”
  rationale: 前文已经提到天地，若再译为“世界”容易造成不必要的重复。κόσμος 可表示秩序、布局、装饰，也可指按秩序排列的整体；正文兼顾“秩序”与“万象整体”两层可能，脚注则保留其他真实可行的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。为符合汉语表达，将希腊语描述受呼求者的分词结构转为第二人称完整分句；不增加原文没有的神学限定。保留句末逗号，以反映本节在祷告长句中的延续性。
