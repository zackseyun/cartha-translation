  text: αἰτοῦμαι δεόμενός σου, ἄνες μοι, κύριε, ἄνες μοι, καὶ μὴ συναπολέσῃς με ταῖς ἀνομίαις μου, μηδὲ εἰς τὸν αἰῶνα μηνίσας τηρήσῃς τὰ κακά μοι, μηδὲ καταδικάσῃς με ἐν τοῖς κατωτάτοις τῆς γῆς· ὅτι σὺ εἶ, κύριε, ὁ θεὸς τῶν μετανοούντων,
