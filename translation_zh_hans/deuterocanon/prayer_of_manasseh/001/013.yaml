base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: zh_hans
  text: 我向你祈求，恳求你：主啊，赦免我，赦免我！不要因我的不法之事使我灭亡；也不要永远怀怒，追究我的恶行[a]；也不要在大地最深之处定我的罪[b]。因为你，主啊，是悔改之人的上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“为我保留我的恶事”，意思是不要把我的恶行保留为不利于我的依据；也可译为“把我的恶行记在我的账上”。
    reason: 说明希腊语τηρήσῃς τὰ κακά μοι的字面结构及较自然的中文理解。
  - marker: b
    text: 也可理解为“定我的罪，使我落入大地最深之处”。原文既可保留处所意味，也可能暗示被定罪后的归宿。
    reason: 保留ἐν与“定罪”连用时处所和结果之间的语义张力。
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: 我向你祈求，恳求你
  rationale: 两个近义的祈求用语叠用，强化谦卑而迫切的恳求；中文保留这种重复力度，同时采用自然的祷告语言。
- source_word: ἄνες μοι
  choice: 赦免我
  rationale: ἄνες本有“释放、宽免”之意，在认罪祷告中指免除罪责；“赦免我”清楚、庄重，也保留重复出现所形成的迫切感。
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: 使我和我的不法之事一同灭亡
  rationale: “一同”体现复合动词中的συν-；“不法之事”保留ἀνομία所含违背法度的强烈意味，不将其泛化为普通的“罪”。
- source_word: εἰς τὸν αἰῶνα μηνίσας
  choice: 永远怀怒
  rationale: 简洁表达持续发怒之意，不额外限定怒气的起点或方式。
- source_word: τηρήσῃς τὰ κακά μοι
  choice: 把我的恶行记在我的账上
  rationale: 原句直译近于“为我保留我的恶事”，语义是将这些恶事保留下来而归到祈求者身上；中文用常见表达传达“记着并据此追究”的不利含义。
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: 在大地最深之处
  rationale: κατωτάτοις是最高级，表示最低、最深的区域；译文保留ἐν的处所表达，不擅自把它完全改成方向或结果。
- source_word: τῶν μετανοούντων
  choice: 悔改之人
  rationale: 现在分词指正在或以悔改为特征的人；“悔改之人”自然简明，并保留其神学分量。
- source_word: κύριε
  choice: 主啊
  rationale: 此处是对上帝的直接呼告；“主啊”符合现代中文圣经和祷告语体。
theological_decisions:
- issue: ἀνομία的道德力度
  choice: 不法之事
  alternative: 罪
  rationale: “不法之事”较完整地保留违背法度的含义，避免把原文较强的措辞弱化为范围更广的“罪”。
- issue: ἐν τοῖς κατωτάτοις τῆς γῆς与καταδικάσῃς的关系
  choice: 在大地最深之处定我的罪
  alternative: 定我的罪，使我落入大地最深之处
  rationale: ἐν通常标示处所，但在“定罪”的语境中也可能暗示定罪后的归宿。正文保留原文的处所结构，脚注说明可能的结果性理解，以免消除歧义。
- issue: 上帝与悔改者的关系
  choice: 是悔改之人的上帝
  alternative: 是使人悔改的上帝
  rationale: 属格τῶν μετανοούντων自然指“悔改之人”；不将其改写为上帝使人悔改，以免加入原句没有明说的因果主张。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留“祈求／恳求”“赦免我／赦免我”等刻意重复，以呈现原文迫切的认罪语气；避免古奥词汇，也不补入特定宗派的解释。
