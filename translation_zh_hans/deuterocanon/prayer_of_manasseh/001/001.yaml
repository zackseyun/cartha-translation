  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
translation:
  language: zh_hans
  text: 全能的主啊，我们列祖的上帝，就是亚伯拉罕、以撒、雅各和他们公义的后裔[a]的上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文也可较字面地译为“种子”；在盟约和谱系语境中，可指后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此为呼格，用作对上帝的直接称呼；“主啊”既准确，也符合现代汉语祷告语体。
- source_word: παντοκράτωρ
  choice: 全能者
  rationale: 该词是上帝的称号，兼有统管万有与全能之意；“全能者”庄重自然，并保留名词性称号的形式。
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们列祖的上帝
  rationale: “列祖”准确保留πατέρων的男性及盟约历史含义，也比逐字的“我们的父辈”更符合汉语圣经语体。
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: 就是亚伯拉罕、以撒、雅各……的上帝
  rationale: 这些属格与“上帝”相连；加入“就是”可在汉语中清楚表明列祖与三位族长之间的同位说明关系，而不改变原意。
- source_word: σπέρματος αὐτῶν
  choice: 他们……的后裔
  rationale: σπέρμα在此是集合单数，指族裔或后代。“后裔”自然表达谱系含义，同时保留盟约语境；另以脚注提示其字面意义“种子”。
- source_word: τοῦ δικαίου
  choice: 义的
  rationale: 该单数属格形容词与集合名词σπέρματος一致。“义的后裔”保留了原文修饰关系及其略显凝练、可能具有神学张力的表达，避免擅自改成“所有义人”或“义人的后裔”。
theological_decisions:
- issue: τῶν πατέρων ἡμῶν的性别与盟约性表达
  choice: 我们列祖的上帝
  alternative: 我们祖先的上帝
  rationale: 原文明确使用“父辈、列祖”，且这是盟约传统中的固定表达；“列祖”既忠实于性别信息，也符合庄重的现代汉语。
- issue: σπέρμα在盟约谱系语境中的译法
  choice: 后裔
  alternative: 种子；子孙
  rationale: “后裔”能自然表达集合性的谱系概念；脚注保留“种子”这一较字面的译法及其盟约谱系联想。
- issue: τοῦ δικαίου所修饰的对象
  choice: 他们义的后裔
  alternative: 他们的义人后裔；他们那公义的后裔
  rationale: 希腊文的形容词与集合单数“后裔”一致，最直接是修饰该后裔。采用“义的后裔”保留原文语法与可能的集合性，不把它解释为某个特定个体，也不将其展开为复数义人。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语祷告语体。“主啊，全能者”保留原文两个连续称呼；“列祖”维持圣经盟约用语，但整体句法按现代汉语稍作梳理。经文在本节末尾仍未完句，因此保留逗号。
