base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: zh_hans
  text: 所以，主啊，义人的上帝，你没有为义人——就是亚伯拉罕、以撒和雅各，他们没有得罪你——设立悔改[a]；你却为我这个罪人设立了悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设立悔改”也可译作“把悔改摆在……面前”。原文动词可表示“放置”或“设立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: 所以，你
  rationale: οὖν带有推论或承接作用；“所以”在现代汉语祷告语境中自然保留这一衔接。因后接呼语，正文调整为“所以，主啊……你”。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε是直接呼语；“主啊”既符合祷告语体，也清楚自然。
- source_word: ὁ θεὸς τῶν δικαίων
  choice: 义人的上帝
  rationale: 较直接地保留属格结构及δικαίων与后文“罪人”的修辞对照。
- source_word: οὐκ ἔθου μετάνοιαν δικαίοις
  choice: 你没有为义人设立悔改
  rationale: τίθημι在此可指“设立、安置”；“设立悔改”保留原文较不寻常的搭配和神主动安排的意味，没有扩写为“悔改的机会”。
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: 就是为亚伯拉罕、以撒和雅各
  rationale: 此短语与“义人”同位，译入“就是”明确其解释关系；重复“为”使汉语句法顺畅。
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: 他们没有得罪你
  rationale: ἁμαρτάνω加与格σοι表达以神为被冒犯者；“得罪你”比“向你犯罪”更自然，同时保留未加限定的否定。
- source_word: ἀλλ᾽ ἔθου μετάνοιαν ἐμοὶ
  choice: 你却为我设立了悔改
  rationale: “却”突出ἀλλά所标示的强烈对比，并重复“设立悔改”以保存希腊文平行结构。
- source_word: τῷ ἁμαρτωλῷ
  choice: 我这个罪人
  rationale: 该短语与ἐμοί同位；“我这个罪人”自然呈现说话者自谦认罪的语气，并与“义人”构成鲜明对照。
theological_decisions:
- issue: 经文称亚伯拉罕、以撒和雅各“没有得罪你”，与其他经文对先祖的描写可能形成张力。
  choice: 照原文直译为“他们没有得罪你”。
  alternative: 他们没有大大得罪你／他们在你面前不算罪人／他们在这件事上没有得罪你
  rationale: 希腊文οὐχ ἡμαρτηκόσιν σοι没有程度、归算或事项方面的限定。译文应保留祷文的修辞性陈述及其神学张力，不作调和。
- issue: “设立悔改”究竟指规定悔改、赐下悔改，还是把悔改摆在人面前。
  choice: 正文用“设立悔改”，不进一步解释其机制。
  alternative: 赐下悔改／给……悔改的机会／把悔改摆在……面前
  rationale: ἔθου的语义较宽；“设立”保留神主动安排的含义，也避免把含混之处具体化为机会、能力或命令。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊”体现直接呼求；破折号标明“亚伯拉罕、以撒和雅各”及其关系从句是对“义人”的具体说明。保留“义人—罪人”和两次“设立悔改”的平行对照。
