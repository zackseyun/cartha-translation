  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/022.yaml
  text: And the king killed them[a], and he gave Bel over to Daniel[b], and he destroyed him and his temple.
translation:
  language: zh_hans
  text: 王杀了他们，又把彼勒交给但以理处置[a]；他摧毁了它[b]和它的庙宇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交给……处置”直译为“把彼勒作为被交出者交给但以理”；这个希腊语结构表示将其交出，任由但以理处置。
    reason: lexical_alternative
  - marker: b
    text: 希腊语这里用阳性代词，与“彼勒”的语法性别一致，因此也可译作“他”。正文用“它”，是因为这里所说的是被摧毁的彼勒偶像。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 准确表达使人死亡的意思；现代汉语自然直接，也不额外强化司法处决的意味。
- source_word: ἔδωκεν ... ἔκδοτον
  choice: 交给……处置
  rationale: 这一结构表示将某人或某物交出，使其受另一人支配或处置；译文既体现“交出”，也自然表达 ἔκδοτον 所含的任人处置之意。
- source_word: τὸν Βὴλ
  choice: 彼勒
  rationale: 按专名音译处理，指巴比伦神祇及其偶像。
- source_word: κατέστρεψεν
  choice: 摧毁了
  rationale: 可同时适用于彼勒偶像和其庙宇，涵盖毁坏、拆毁的语义，而不必为两个宾语分别换词。
- source_word: τὸ ἱερὸν
  choice: 庙宇
  rationale: 此处指供奉彼勒的宗教建筑；“庙宇”在现代汉语中自然明确，也适合异教崇拜场所。
- source_word: αὐτὸν
  choice: 它
  rationale: 希腊语代词因 Βήλ 为阳性而用阳性形式，但在现代汉语中，叙事所毁的是彼勒偶像，用“它”较自然；脚注保留按语法形式译作“他”的可能。
theological_decisions:
- issue: 指称彼勒的阳性代词应译作“他”还是“它”
  choice: 正文用“它”
  alternative: 译作“他”，以贴近希腊语阳性代词的形式
  rationale: 希腊语的阳性形式与 Βήλ 的语法性别一致，本身不足以确定作者是否意在赋予彼勒人格地位。汉语以“它”指被摧毁的偶像更自然，同时借脚注保留原文形式及另一译法，避免把语法性别直接转化为神学判断。
- issue: κατέστρεψεν 的隐含主语是谁
  choice: 保留为“他”，不在正文中明确补作“但以理”
  alternative: 明确译作“但以理摧毁了……”
  rationale: 希腊语仅以第三人称单数动词表达主语；上下文很可能指但以理，但正文保留代词可避免把语境推断写成原文明确说出的名字。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又……；他……”保留原文连续叙事的节奏；分号帮助读者区分王的处决和随后摧毁彼勒及其庙宇的行动，同时不把后一句未明说的主语直接改写为“但以理”。所有脚注标记均置于相关词语之后。
