  text: But you[a], O king, give me authority, and I will kill the dragon without sword or staff. And the king said, “I give it to you.”
translation:
  language: zh_hans
  text: “王啊，请给我权柄；我将不用刀和杖杀死这条龙。”王说：“我把这权柄给你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ δέ, βασιλεῦ
  choice: 王啊，请你
  rationale: 保留对王的直接呼告，并以“你”体现显明主语所带的强调；δέ在此承接并转折，汉语不必机械译出，以免句式生硬。
- source_word: δός μοι ἐξουσίαν
  choice: 请你授予我权柄
  rationale: ἐξουσία在王权语境中指获授的权柄或行动授权；“授予我权柄”既保留正式含义，也避免“给我能力”所可能暗示的内在本领。
- source_word: ἀποκτενῶ
  choice: 我……就能杀死
  rationale: 未来时表示但以理在获准后将采取的行动；汉语用条件关系中的“就能”自然表达其承诺，并未把动词弱化为仅有能力而无行动意图。
- source_word: τὸν δράκοντα
  choice: 这条龙
  rationale: δράκων在本叙事中指巴比伦人敬奉的那只生物；“龙”是直接对应，“这条”符合现代汉语对前文已知动物的指称方式。
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: 不用刀，也不用杖
  rationale: ἄνευ同时支配两个名词，表示不借助这些器具；μάχαιρα译“刀”，ῥάβδος保留较宽泛的“杖”，不武断限定为棍棒或手杖。
- source_word: Δίδωμί σοι
  choice: 我准你
  rationale: 原文直译为“我给你”，宾语承接先前所求的ἐξουσία。汉语以“我准你”自然表达王授予行动权，同时由脚注保留较形式对应的译法。
