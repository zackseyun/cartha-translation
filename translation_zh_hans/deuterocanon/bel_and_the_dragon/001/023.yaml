  choice: 译为明确带有宗教含义的“敬拜”
  alternative: 尊崇、敬奉
  rationale: ἐσέβοντο 在此语境中很可能具有祭祀崇拜的含义；正文采用“敬拜”，同时以脚注保留词义上较宽泛的可能。
