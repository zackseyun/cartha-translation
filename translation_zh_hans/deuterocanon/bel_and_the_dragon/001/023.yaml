lexical_decisions:
- source_word: δράκων
  choice: 巨龙
  rationale: 该词可指龙或巨大的蛇；“巨龙”既保留传统书名和叙事形象，也与 μέγας 所表达的巨大相合。
- source_word: μέγας
  choice: 巨
  rationale: 在“巨龙”中自然表达体形巨大，同时保持简洁而庄重的叙事语气。
- source_word: ἐσέβοντο
  choice: 敬拜
  rationale: 该动词可表示敬畏、尊崇或宗教性崇拜；在巴比伦人把这生物当作祭祀对象的语境中，“敬拜”最清楚地传达其宗教含义。
- source_word: οἱ Βαβυλώνιοι
  choice: 巴比伦人
  rationale: 直接、自然地表达这一族群称谓。
theological_decisions:
