  text: 亚斯提阿格王归到他列祖那里，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“被加到他列祖那里”，是表示他去世的经文惯用语。
    reason: 说明原文较直译法及该惯用语的含义。
lexical_decisions:
- source_word: ΚΑΙ
  choice: （不单独译出）
  rationale: 句首 καί 承接叙事。此处若机械译作“并且”或“于是”，现代汉语会显生硬或增添原文未明示的时间意味；用直接起句自然体现其叙事衔接功能。
- source_word: ὁ βασιλεὺς Ἀστυάγης
  choice: 亚斯提阿格王
  rationale: 按现代汉语习惯将王号置于音译人名之后；定冠词所表达的特指无须另译。Ἀστυάγης 采用贴近希腊语形式的音译“亚斯提阿格”。
- source_word: προσετέθη
  choice: 归到
  rationale: 该词本义为“被加上、被归入”；与“列祖”连用时是表示死亡的经文惯用语。“归到”既保留归入先祖之列的意象，也比直译“被加到”更符合现代汉语。
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: 他列祖那里
  rationale: πατέρες 在此指先祖。“列祖”保留传统经文语感和原文意象；加“那里”使“归到他列祖那里”在汉语中完整自然。
theological_decisions:
- issue: 如何处理 προσετέθη πρὸς τοὺς πατέρας αὐτοῦ 这一死亡惯用语
  choice: 归到他列祖那里
  alternative: 死了；被加到他列祖那里
  rationale: 正文不直接释作“死了”，以免抹去原文关于归入先祖之列的经文意象；同时避免生硬的逐字直译。脚注说明字面意义和惯用含义，不对死亡后的状态作超出原文的教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖”略带经文色彩，但在此能准确保留原文的固定意象。正文中的脚注标记与脚注项目一致。
