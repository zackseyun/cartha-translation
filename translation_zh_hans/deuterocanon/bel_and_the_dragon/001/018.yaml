  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: zh_hans
  text: 门一打开，王看向桌子，就高声喊道：“贝尔啊，你真伟大！你毫无诡诈。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: （不单独译出）
  rationale: 这是叙事衔接公式；本句用“门一打开”自然推进情节，避免生硬的“事情发生了”。
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  choice: 门一打开
  rationale: 表达开门之时动作随即发生，简洁自然；“门”准确对应θύρας。
- source_word: ἐπιβλέψας ὁ βασιλεὺς ἐπὶ τὴν τράπεζαν
  choice: 王看见桌子
  rationale: ἐπιβλέψας表示把目光投向；结合叙事情境译作“看见”自然，又不增加“仔细察看”等原文没有的含义。τράπεζαν直译为“桌子”，不擅加“供桌”。
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: 高声喊道
  rationale: 同时传达呼喊动作和声音洪亮，在现代汉语中简洁有力。
- source_word: Μέγας εἶ, Βήλ
  choice: 贝尔啊，你真伟大
  rationale: 保留直接呼语和感叹语气；Βήλ按名称音译为“贝尔”。
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: 你那里毫无诡诈
  rationale: “你那里”贴近παρὰ σοὶ，δόλος译作“诡诈”，既可指欺骗行为，也保留其品格层面的意味。
theological_decisions:
- issue: 王对贝尔的赞颂是否构成叙述者的神学认可
  choice: 原样保留为王的直接引语，不加评判
  alternative: 添加“王以为”等措辞，弱化或限定这句话
  rationale: 希腊文直接记录王的呼喊；保留其原话能够维持上下文的戏剧性反讽，而不把王的判断变成叙述者的认可。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“贝尔啊，你真伟大！”比倒装式“伟大的是你”更符合现代口语中的郑重感叹；全句保持紧凑的叙事节奏。
