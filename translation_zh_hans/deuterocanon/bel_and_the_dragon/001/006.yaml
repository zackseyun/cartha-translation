  naturalness: “大地，并掌管一切有血肉的”在现代汉语中连接关系不够清楚，“有血肉的”名词化也略显生硬。改为“和大地，并拥有统管一切血肉之躯的权柄”可保留承接前文的宾语性残句，同时更通顺。结尾用“又……”明确保留未完成的连接结构。
