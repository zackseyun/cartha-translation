    text: 所提供的希腊文经文片段在“又”（καὶ）处中断，句子尚未结束。因此译文保留未完的形式，不依据其他文本或译本补出下文。
    reason: textual_variant
lexical_decisions:
- source_word: γῆν
  choice: 大地
  rationale: 此处是对真神所造之物的描述，指世界或大地，不是某一特定地域。
- source_word: ἔχοντα πάσης σαρκὸς κυρίαν
  choice: 掌管一切有血肉的
  rationale: 用自然的现代汉语表达拥有统治权之意，同时保留“凡有血肉的”这一范围未完全限定的圣经式说法。
- source_word: πάσης σαρκὸς
  choice: 一切有血肉的
  rationale: 原文可涵盖全人类，也可能广指一切血肉之躯；译文不将其范围缩窄为其中一种。
- source_word: δοκεῖ
  choice: 认为
  rationale: 在王向但以理提出的反问中，δοκεῖ表达“在你看来、你认为”；汉语用“认为”比直译为“显得”更自然。
- source_word: Βὴλ
  choice: 贝勒
  rationale: 按该专名的希腊文形式音译，并与普通名词“神”区分。
- source_word: ζῶν θεός
  choice: 活神
  rationale: 保留“活着的神”之意；不译作带有以色列信仰告白色彩的“永生神”，因为说话者指的是贝勒。
- source_word: ὁρᾷς
  choice: 看见
  rationale: 直接保留反问“难道你没看见”的感知与举证语气。
- source_word: ὅσα ἐσθίει
  choice: 他吃了多少
  rationale: ὅσα在这里强调所吃之物的数量，以此作为贝勒活着的表面证据；“吃了多少”最符合汉语语境。
- source_word: καὶ
  choice: 而且……
  rationale: 原文片段止于连接词καὶ，译文以省略号保留尚未说完、继续向后的结构，不擅自补足。
theological_decisions:
- issue: πάσης σαρκὸς所指范围
  choice: 一切有血肉的
  alternative: 全人类；一切生物
  rationale: 保留原文既可偏指人类、也可广指有血肉生命的幅度，不在译文中消除其语义张力。
- issue: 异教君王称贝勒为ζῶν θεός
  choice: 活神
  alternative: 永生神；一位活着的神
  rationale: 避免采用容易被理解为以色列对独一真神之固定称号的“永生神”；同时让王所宣称的“贝勒是有生命的神”这一意思清楚自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。开头本身承接上一节，所以保留片段式句法；结尾以“而且……”明确呈现底本摘录在连接词处中断。
