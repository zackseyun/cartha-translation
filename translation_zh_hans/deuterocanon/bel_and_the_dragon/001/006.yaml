translation:
  language: zh_hans
  text: 和大地，并拥有统管一切血肉之躯的权柄。王对他说：“在你看来，彼勒不是一位活着的神吗？难道你没有看见他吃多少，又……”[a]
  philosophy: optimal-equivalence
