lexical_decisions:
- source_word: προσκυνεῖς
  choice: 向……下拜
  rationale: 既保留俯伏致敬的外在动作，也自然表达本段敬拜神像的宗教语境，而不把含义仅限于内心崇拜。
- source_word: σέβομαι
  choice: 敬奉
  rationale: 表达宗教性的尊敬和事奉，并与前面的“下拜”有所区分；中文也能自然地同时用于否定敬奉偶像和肯定敬奉上帝。
- source_word: εἴδωλα χειροποίητα
  choice: 人手所造的偶像
  rationale: “偶像”保留犹太反偶像崇拜语境中的贬义力量，“人手所造”则突出受造之物与创造主之间的对比。
- source_word: τὸν ζῶντα θεόν
  choice: 永活的上帝
  rationale: 定冠词在语境中指向与偶像相对的真神；“永活的上帝”是庄重自然的现代中文，也鲜明呈现其与无生命偶像的对照。
- source_word: τὸν κτίσαντα
  choice: 就是那位创造……的
  rationale: 分词说明上帝的身份和作为；“创造”比一般的“制造”更适合此处的创造主语境。
- source_word: τὸν οὐρανὸν
  choice: 天
  rationale: 单数名词在创造语境中自然译作“天”，既简洁，也符合现代中文圣经文体。
theological_decisions:
- issue: 所提供希腊文本在本节末尾残缺，止于καί（“和”）
  choice: 保留未完成的句子，以“和”结尾
  alternative: 根据上下文补出“地”等宾语，或从后续文本补全句子
  rationale: 原文证据优先；所提供的希腊文本确实在连接词καί处中断，因此不应无标记地加入该证据中不存在的文字。脚注说明这一文本状况。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼勒”作为Βὴλ的音译，避免与普通名词混淆；“下拜—敬奉”分别呈现προσκυνέω与σέβομαι的语义差别。主句刻意以“和”收尾，以忠实反映所给原文的残缺状态。
