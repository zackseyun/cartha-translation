  choice: 正文补入通行狄奥多提翁形式中“上帝给但以理送来饭食”的续文，并明确加注
  alternative: 只翻译现存可见部分：“哈巴谷高声呼喊：‘但以理！但以理！……’”
  rationale: 现有引文显然不完整，以孤立字母结束。补入该叙事在狄奥多提翁形式中的标准续文，可形成可读的完整经节；脚注则避免掩盖源文本证据的不完整性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拿去吃吧”按通行续文的命令语气意译，使动作明确；“饭食”比“膳食”更易为普通读者理解，又不失经文语体。
