lexical_decisions:
- source_word: ἐβόησεν
  choice: 高声呼喊
  rationale: 该动词表示大声发出呼声；“高声呼喊”既保留语势，也符合现代汉语叙事表达。
- source_word: Ἀμβακοὺμ
  choice: 哈巴谷
  rationale: 采用现代中文圣经传统中通行的先知名译法，不按希腊语形式机械音译。
- source_word: λέγων
  choice: （以冒号引出直接引语）
  rationale: 希腊语分词用于引出直接话语；汉语中以冒号自然表达，无须生硬译作“说着”。
- source_word: Δανιὴλ Δανιήλ
  choice: 但以理！但以理！
  rationale: 保留两次呼名，传达直接呼唤和急切语气。
- source_word: Β
  choice: 拿去吃吧，这是上帝给你送来的饭食
  rationale: 所给希腊语在重复呼名后截断，仅余孤立字母Β；此处依《彼勒与大龙》狄奥多提翁文本的通行续文补译，同时用脚注明确说明文本状况。
theological_decisions:
