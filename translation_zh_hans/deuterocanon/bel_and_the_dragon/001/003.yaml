  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: zh_hans
  text: 巴比伦人有一尊偶像，名叫彼勒；每天为它耗用十二阿尔塔巴的细面粉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿尔塔巴”是古代容量单位，具体容量因时代和地区而异。
    reason: 原文使用古代容量单位，现代精确换算并不确定，故保留音译并加说明。
lexical_decisions:
- source_word: εἴδωλον
  choice: 偶像
  rationale: 直接表达受敬拜的神像，并保留原文带有贬义的宗教判断。
- source_word: τοῖς Βαβυλωνίοις
  choice: 巴比伦人中
  rationale: 自然对应与格领属／范围表达，说明这偶像存在于巴比伦人当中。
- source_word: Βὴλ
  choice: 彼勒
  rationale: 按希腊文专名音译，并与常见中文次经译名相协调。
- source_word: ἐδαπανῶντο εἰς αὐτὸν
  choice: 为它耗用
  rationale: 保留被动式所表达的持续消耗以及 εἰς αὐτόν 的用途关系；以“它”照应偶像。
- source_word: σεμιδάλεως
  choice: 细面粉
  rationale: 指精制的小麦粉；采用现代读者易懂且符合祭物语境的表达。
- source_word: ἀρτάβαι δώδεκα
  choice: 十二阿尔塔巴
  rationale: 保留古代容量单位，避免用不确定的现代换算值取代原文。
theological_decisions:
- issue: 对彼勒的指称
  choice: 它
  alternative: 他
  rationale: 原文 αὐτόν 为阳性，受 εἴδωλον 的语法性影响；中文以“它”照应“偶像”，保留叙述者不承认其神格的语气。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“巴比伦人中有一个偶像”贴近希腊文句序；分号使两个并列陈述在中文中更流畅。
