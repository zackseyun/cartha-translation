lexical_decisions:
- source_word: Γινέσθω κατὰ τὸ ῥῆμά σου
  choice: 就照你的话办吧
  rationale: 第三人称命令式与介词短语合起来表示但以理接受王所提出的安排；此译自然保留允诺语气，也不把ῥῆμα强化为“命令”。
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: 贝尔的祭司
  rationale: 直译所属关系；“祭司”准确表达敬拜活动中的职分，无须增译“神庙”。
- source_word: ἑβδομήκοντα
  choice: 七十人
  rationale: 直接表达人数；补出量词“人”符合现代汉语。
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: 妇女和孩子不计在内
  rationale: ἐκτός表示这些人未计入前述七十之数；此译比“此外”更明确地保留计数关系。
- source_word: καὶ ἦλθεν
  choice: 随后他进去了
  rationale: ἦλθεν本义为“来、去”，结合叙事语境可理解为进入；但本节未明说进入何处，因此不补出地点，并以脚注提示原文的简略性。
