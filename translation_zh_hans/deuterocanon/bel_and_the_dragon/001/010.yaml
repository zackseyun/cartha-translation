  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
translation:
  language: zh_hans
  text: 但以理对王说：“就照你的话办吧。”贝尔的祭司有七十人，妇女和孩子不计在内；他来了。[a]
  philosophy: optimal-equivalence
  footnotes:
