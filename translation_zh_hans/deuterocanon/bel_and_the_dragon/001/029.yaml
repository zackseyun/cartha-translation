  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
translation:
  language: zh_hans
  text: 他们来到王面前，说：“把但以理交给我们；不然，我们就杀死你和你一家人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你一家人”原文直译为“你的家”；这里可指家人、家眷或整个家室。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τὸν βασιλέα
  choice: 来到王面前
  rationale: 将希腊语分词结构自然转为汉语顺承表达，保留他们前往王那里并提出要求的动作次序。
- source_word: Παράδος ἡμῖν τὸν Δανιήλ
  choice: 把但以理交给我们
  rationale: Παράδος是παραδίδωμι的简过去时命令式，表示将人交出、置于对方权下；“交给我们”在现代汉语中自然直接，也保留命令语气。
- source_word: εἰ δὲ μή
  choice: 不然
  rationale: 以简洁自然的汉语表达条件性最后通牒，相当于“若不这样”。
- source_word: ἀποκτενοῦμέν σε
  choice: 我们就杀了你
  rationale: ἀποκτενοῦμεν为将来时，直指杀死；“就”承接前面的条件，清楚表达威胁的后果。
- source_word: τὸν οἶκόν σου
  choice: 你全家
  rationale: οἶκος可指房屋，也可转指家属、家眷或整个家室；在杀戮威胁中显然主要涉及人，“全家”是普通现代汉语中自然的对应表达。
theological_decisions:
- issue: 威胁中οἶκος的范围
  choice: 你全家
  alternative: 你的家；你的家室；你的家人
  rationale: 上下文是要杀害王及其οἶκος，故此处主要指属于王家的人，而非建筑物。“全家”保留集体范围，但不额外限定为血亲。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“把……交给我们”符合群众向王发出强硬命令的语势；“杀了你和你全家”保留原文威胁的尖锐性。
