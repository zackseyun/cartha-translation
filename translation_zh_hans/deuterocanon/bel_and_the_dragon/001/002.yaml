  text: And Cyrus the Persian received his kingdom[a], and Daniel was a companion of the king and honored above all his friends.
translation:
  language: zh_hans
  text: 波斯人居鲁士接掌了王国[a]。但以理是与王亲近的同伴，比王所有的朋友都更受尊崇。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王国”也可译作“王权”或“统治权”。
    reason: lexical_alternative
  - marker: b
    text: “朋友”在王室语境中也可指王的近臣、侍臣或亲信。
    reason: court_title_nuance
lexical_decisions:
- source_word: παρέλαβεν
  choice: 承受了
  rationale: 表示取得并承接王权；“承受”贴近原文，又不限定居鲁士是以继承、征服或其他方式取得。
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: 他的国
  rationale: βασιλεία可指王权、统治或国度；“他的国”保留原文代词及“国”的空间，同时以脚注说明“王权”的可能含义。
- source_word: συνβιωτής
  choice: 亲近同伴
  rationale: 这个罕见词本义与共同生活有关，在宫廷语境中表示关系密切的同伴；译作“亲近同伴”既传达亲密关联，又避免生硬地暗示同住。
- source_word: ἔνδοξος
  choice: 最受尊崇
  rationale: ἔνδοξος在此指有声望、受敬重；结合ὑπὲρ πάντας表达的比较意义，译为“最受尊崇”自然清楚。
- source_word: ὑπὲρ πάντας τοὺς φίλους αὐτοῦ
  choice: 在王所有的朋友中
  rationale: 保留φίλοι的基本义“朋友”，同时用“王的”明确代词所指；其宫廷称谓色彩另见脚注。
theological_decisions:
- issue: φίλοι是否作为宫廷称谓
  choice: 朋友
  alternative: 近臣；侍臣；亲信
  rationale: 原文基本义是“朋友”，但在希腊化王室语境中也可指王身边的宫廷亲信。正文保留字面张力，脚注交代制度性含义。
- issue: βασιλεία指国度还是王权
  choice: 国
  alternative: 王权；统治权
  rationale: 上下文可理解为接掌国家，也可强调承接王权。正文采用自然且传统的“国”，脚注保留语义范围，不把取得王位的方式具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“波斯人居鲁士”紧贴Κῦρος ὁ Πέρσης；“亲近同伴”避免把罕见词συνβιωτής机械译成“同住者”。正文中的[a]、[b]与脚注一一对应。
