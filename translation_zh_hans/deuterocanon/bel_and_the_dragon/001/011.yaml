  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: zh_hans
  text: 王和但以理一同进了彼勒的殿[a]。彼勒的祭司说：“看，我们这就出去；王啊，你把食物摆好，把酒调好后也摆上，再把门关上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“彼勒的房屋”，这里指彼勒的神殿。
    reason: 说明οἶκος的字面意义及其在祭祀语境中的所指。
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ
  choice: 王和但以理一同
  rationale: μετά加属格表示陪同；用“一同”自然表达同行关系。Δανιήλ按现代中文圣经通行形式译作“但以理”。
- source_word: εἰς τὸν οἶκον τοῦ Βήλ
  choice: 进了彼勒的殿
  rationale: οἶκος字面为“房屋”，但在此祭祀语境中指神祇的殿宇；正文用“殿”既自然又明确，并以脚注保留字面表达。Βήλ译作“彼勒”。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 保留引起听者注意的语用功能，符合现代汉语口吻。
- source_word: ἡμεῖς ἀποτρέχομεν ἔξω
  choice: 我们这就出去
  rationale: ἀποτρέχομεν可含跑开或离开的意味；语境重点是祭司离开殿内，“这就出去”自然表达即时离去而不过分强调奔跑。
- source_word: σύ δέ, βασιλεῦ
  choice: 王啊，你
  rationale: δέ标示双方行动的对照；用“王啊”保留呼格和正式直呼的语气。
- source_word: παράθες τὰ βρώματα
  choice: 把食物摆好
  rationale: παράθες是命令式，意为摆在面前或陈设；“摆好”符合供物场景，也保持动作指令的自然性。
- source_word: τὸν οἶνον κεράσας θές
  choice: 把酒调好后也摆上
  rationale: κεράσας是先于主要命令θές的分词动作，指古代饮酒前调兑酒；“调好后也摆上”保留先调酒、后陈设的动作关系。
- source_word: ἀπόκλεισον τὴν θύραν
  choice: 把门关严
  rationale: ἀποκλείω指关住、封闭；“关严”比单纯“关上”更能体现隔绝出入，但不增译为原文没有明说的“锁门”。
theological_decisions:
- issue: οἶκος τοῦ Βήλ所指的祭祀场所
  choice: 彼勒的殿
  alternative: 彼勒的房屋／彼勒之家
  rationale: 这里显然是彼勒受祭祀的建筑。“殿”在现代中文中清楚自然；脚注说明希腊文直译，以免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。祭司的话保持直接命令语气；避免古奥的“看哪”和容易误解为加水稀释的“兑酒”，以“调好”概括古代调制酒的动作。
