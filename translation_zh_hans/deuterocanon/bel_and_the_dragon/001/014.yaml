revisions:
- from: 把那些食物全都吃光。那些人出去后，国王把食物摆在贝勒面前。达尼尔吩咐他的少年仆役拿来灰，把灰撒遍整座神殿；当时只有国王在场[a]。随后，他们出去，关上门，用国王的印戒封好，就离开了。
  to: 他们把那些食物全都吃光了。那些人出去后，国王把食物摆在贝耳面前。达尼尔吩咐他的少年仆役拿来灰，并把灰撒遍整座神殿；当时只有国王在场[a]。随后，他们出去，关上门，用国王的印戒把门封好，就离开了。
  rationale: 修正神名“贝勒”为“贝耳”，并补出首句的复数主语。其余仅作必要的中文句法整合：把仆役拿灰和撒灰连为连续动作，同时保留撒灰范围、国王单独在场、出门封印及离开的全部信息。
