  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
translation:
  language: zh_hans
  text: 他们把那些食物全都吃光了。那些人出去后，国王把食物摆在贝耳面前。达尼尔吩咐他的少年仆役拿来灰，并把灰撒遍整座神殿；当时只有国王在场[a]。随后，他们出去，关上门，用国王的印戒把门封好，就离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只当着国王的面。”希腊文强调撒灰时只有国王在场，没有其他人在场观看。
    reason: lexical_alternative
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: 把那些食物全都吃光
  rationale: διόλου强调彻底、全部，ἀνήλουν在供食语境中指耗尽或吃光；译文承接上文，以现代汉语自然表达其持续而彻底的动作。
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: 把食物摆在贝勒面前
  rationale: παρέθηκεν表示把食物摆放在某者面前，既保留献供场景，又不额外加入祭祀术语。
- source_word: παιδαρίοις αὐτοῦ
  choice: 他的少年仆役
  rationale: παιδαρίοις可指少年或年轻侍从；此处他们听从达尼尔差遣，译作“少年仆役”兼顾年龄与职分。
- source_word: τέφραν
  choice: 灰
  rationale: 汉语将此类可撒布的残灰自然视为物质名词，用“灰”简明准确。
- source_word: κατέσποραν ὅλον τὸν ναόν
  choice: 把灰撒遍整座神殿
  rationale: κατέσποραν表示散布、撒开，ὅλον强调全部范围；“撒遍”准确传达灰覆盖整座建筑内部的意思。
- source_word: ναόν
  choice: 神殿
  rationale: 此处指贝勒的圣所建筑；“神殿”在汉语中既清楚又能避免让读者误以为是以色列圣殿。
- source_word: ἐνώπιον τοῦ βασιλέως μόνου
  choice: 当时只有国王在场
  rationale: 该短语强调撒灰时只有国王亲眼在场；此译法自然，并保留μόνου所表达的排他性。
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: 用国王的印戒封好
  rationale: δακτύλιον在此是用于加盖官方封印的戒指；“印戒”明确其功能，“封好”符合中文叙事表达。
