lexical_decisions:
- source_word: σε
  choice: 你
  rationale: 第二人称单数代词，是上一节话语的句末成分；保留片段式开头，不擅自补出前文。
- source_word: ἀναστὰς
  choice: 起来
  rationale: ἀνίστημι 的不定过去主动分词，表示在主要动作“吃”之前起身；“起来”符合现代汉语叙事。
- source_word: ἔφαγεν
  choice: 吃了
  rationale: ἐσθίω 的不定过去陈述式，直述已经发生的进食动作。
- source_word: ἄγγελος
  choice: 天使
  rationale: 上下文所指是奉上帝差遣、具有超自然行动的使者；译作“天使”最符合叙事语境。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 属格修饰“天使”；采用自然且直接的汉语领属结构。
- source_word: ἀπε-
  choice: 离——
  rationale: 希腊文抽取到词首 ἀπε- 即中断，语境显然指离去，但现有字形并不完整；以“离——”和破折号如实保留残缺状态。
theological_decisions:
- issue: 在具有超自然行动的次经叙事中如何翻译 ἄγγελος
  choice: 天使
  alternative: 使者
  rationale: 叙事明确呈现一位代表上帝行动的超自然存在；“天使”保留原文的神学分量，而不将其淡化为普通人类使者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“你”保留本节承接上一节的残句形态；用分号理清连续动作。末尾以残词和破折号体现底本摘录不完整，不据后续传统文本擅自补全。
