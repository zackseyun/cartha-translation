lexical_decisions:
- source_word: πίνει καθʼ ἑκάστην ἡμέραν
  choice: 它每天都喝吗
  rationale: πίνει意为“喝”，καθʼ ἑκάστην ἡμέραν是“每天”的分配性表达；按上下文译作自然的反问句。
- source_word: γελάσας
  choice: 笑着
  rationale: 不定过去时分词说明但以理说话时的动作或神态；“笑着说”自然、清楚，也不弱化为仅仅“微笑”。
- source_word: Μὴ πλανῶ
  choice: 不要受骗
  rationale: 原文形式在这个截取片段中略显突兀，但语义是劝阻王不要被误导；“不要受骗”符合揭穿偶像骗局的语境。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留呼格的直接称呼，并维持庄重的叙事语体。
- source_word: οὗτος
  choice: 这一个
  rationale: 原文仅用指示代词，没有明说“神”或“偶像”；直译可避免增添原文未表达的称谓。
- source_word: ἔσωθέν ἐστι πηλός
  choice: 里面是泥
  rationale: 保留偶像内部材质的直接描述；πηλός可指泥或黏土，此处用普通读者易懂的“泥”。
- source_word: ἔξωθεν δὲ χαλκός
  choice: 外面是青铜
  rationale: 与“里面”形成明确对照；χαλκός在此指铜或青铜材质，用“青铜”最符合古代器物语境。
- source_word: καὶ οὐ
  choice: 而且从不——
  rationale: 现有希腊文在否定语后截断；“而且从不——”既呈现否定方向，也用破折号明确保留未完句。
theological_decisions:
- issue: 所提供希腊文见证的结尾残缺
  choice: 只翻译现存文字，并以破折号标明句子中断
  alternative: 依据其他版本或上下文补出“从来没有吃过或喝过”等内容
  rationale: 所给原文止于καὶ οὐ，后面的谓语或补语缺失。补全虽可能符合上下文，却会把本片段未见证的文字写入正文，因此保留残缺状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王啊”保留正式呼语；“这一个”刻意不补成“这神”或“这偶像”；结尾以破折号如实呈现来源文本的断裂。
