  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: zh_hans
  text: “它每天喝吗？”但以理笑着说：“王啊，不要受骗；这个里面是黏土，外面是青铜，而且并不——”[a]
  philosophy: optimal-equivalence
  footnotes:
