lexical_decisions:
- source_word: οἱ δὲ ἱερεῖς
  choice: 但祭司们
  rationale: δέ在此承接叙事并带轻微转折，用“但”自然表达；ἱερεῖς译为“祭司们”。
- source_word: ἦλθον τὴν νύκτα
  choice: 夜里来了
  rationale: ἦλθον是ἔρχομαι的简单过去时；τὴν νύκτα是表示时间的宾格。“夜里来了”符合现代汉语叙事习惯。
- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: 照他们的惯例
  rationale: ἔθος指惯常做法；“照他们的惯例”贴近原文，也简洁自然。
- source_word: καὶ αἱ γυναῖκες
  choice: 女人们也来了
  rationale: γυναῖκες既可指“女人们”，也可指“妻子们”。本句本身未明确婚姻关系，因此正文采用不作额外解释的“女人们”；汉语补出共享的谓语“来了”，使并列结构完整自然。
