translation:
  language: zh_hans
  text: 哈巴谷说：“主啊，我没有见过巴比伦，也不知道那个坑[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洞穴”或“蓄水池”。希腊语λάκκος泛指坑穴一类的地方；这里指但以理被囚禁之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: 哈巴谷
  rationale: 采用该先知姓名在现代中文圣经传统中的通行译名。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος为呼格，且此处直接称呼上帝；“主啊”准确、自然，并保留庄重语气。
- source_word: Βαβυλῶνα
  choice: 巴比伦
  rationale: 采用该地名在现代标准汉语中的通行译法。
- source_word: οὐχ ἑώρακα
  choice: 没有见过
  rationale: 完成时表达截至说话时仍无亲眼见过的经历；“没有见过”自然保留这一时体含义，不强化为原文未明说的“从未”。
- source_word: τὸν λάκκον
  choice: 那个坑
  rationale: λάκκος泛指坑、窖或穴状处所；“坑”最直接且解释性最少。“那个”承接语境中但以理被囚禁的特定地点。
- source_word: οὐ γινώσκω
  choice: 也不认得
  rationale: γινώσκω在此可表达不知道或不熟悉；“不认得”在中文中自然体现哈巴谷对该地点不熟悉，同时避免增添“在哪里”等原文未明说的内容。
theological_decisions:
- issue: 直接称呼上帝时κύριος的译法
  choice: 主啊
  alternative: 主人啊
  rationale: 此处称呼对象是上帝，“主啊”是现代中文圣经语境中庄重而通行的译法；“主人啊”容易使现代读者误解为一般人际主从关系。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“我没有见过巴比伦，也不认得那个坑”保留两个并列否定句及原文对“看见”与“认识”的区分。
