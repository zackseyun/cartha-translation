  text: and forty sheep and six measures of wine. And the king revered him and went every day to bow down to him[a], but Daniel bowed down to his God. And the king said to him,
translation:
  language: zh_hans
  text: 又有四十只羊和六量的酒。王敬奉他，天天都去向他下拜[a]；但以理却向自己的上帝下拜。王对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”两处或译“敬拜”。希腊语προσκυνέω可指俯伏、下拜，也可指敬拜，须按语境理解。
    reason: 说明原词的语义范围，并保留两处相同希腊动词之间的对应关系。
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: 四十只羊
  rationale: πρόβατα泛指羊或小型牲畜；“羊”在现代汉语中宽泛自然，不擅自限定为羔羊。
- source_word: οἴνου μετρηταὶ ἕξ
  choice: 六量器的酒
  rationale: μετρητής是液体容量单位；采用“量器”保留计量单位的含义，同时避免换算成不确定的现代容量。
- source_word: ἐσέβετο αὐτόν
  choice: 敬奉他
  rationale: σέβομαι可表示尊崇或宗教性的敬奉；“敬奉”既显出祭祀语境，也与后文προσκυνέω所指的下拜动作有所区别。
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: 天天都去
  rationale: 未完成时表达惯常、反复的行动；“天天都去”自然传达每日如此。
- source_word: προσκυνεῖν αὐτῷ / προσεκύνει τῷ θεῷ αὐτοῦ
  choice: 向他下拜 / 向自己的上帝下拜
  rationale: 两处使用同一动词προσκυνέω，统一译为“下拜”，保留王对彼勒与但以理对上帝之间刻意形成的叙事对照；脚注说明也可译为“敬拜”。
- source_word: Δανιὴλ
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: βασιλεύς在本叙事中自然译为“王”；上下文已明确其身份，无须重复“国王”。
theological_decisions:
- issue: 是否将敬拜偶像和敬拜上帝的相关动词都明确译作“敬拜”
  choice: 将σέβομαι译作“敬奉”，将两处προσκυνέω统一译作“下拜”
  alternative: 将这些动词均按宗教语境译作“敬拜”
  rationale: 希腊文先以σέβομαι描述王对彼勒的敬奉，再以προσκυνέω分别描述王与但以理的动作。区分前两个动词、统一后两处同一动词，既保留原文用词结构和文学对照，也不替原文过早判定προσκυνέω在每处究竟偏重身体下拜还是宗教敬拜。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留本节开头承接上文的列举结构和结尾引出下文话语的冒号；“他”依原文保留指代，不在正文中补入名称。
