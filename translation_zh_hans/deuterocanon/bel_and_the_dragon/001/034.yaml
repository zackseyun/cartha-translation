  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: zh_hans
  text: 主的一位天使对哈巴谷说：“把你有的那份饭食带到巴比伦去，送给在狮子坑里的但以理。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: ἄγγελος前无冠词，译作“一位天使”较能保留其不定性；Κυρίου在此指以色列的上帝，按项目惯例译作“主”。
- source_word: Ἀμβακοὺμ
  choice: 哈巴谷
  rationale: 采用该先知姓名在现代中文圣经中的通行译名。
- source_word: Ἀπένεγκε
  choice: 带……去
  rationale: 该命令式表示把饭食从哈巴谷所在之处送往巴比伦；“带……去”自然表达了方向与运送动作。
- source_word: τὸ ἄριστον
  choice: 饭食
  rationale: ἄριστον指一顿饭，具体可因时代和语境指早餐、午餐等；“饭食”不武断限定用餐时间，并适合所携带的食物这一语境。
- source_word: ὃ ἔχεις
  choice: 你所有的
  rationale: 直译关系从句“你有的”，在中文中以“你所有的饭食”自然表达，不额外添加数量含义。
- source_word: εἰς Βαβυλῶνα
  choice: 到巴比伦去
  rationale: εἰς加地名表示方向，中文自然译作“到……去”。
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: 给狮子坑里的但以理
  rationale: λάκκος本义为“坑”；该短语说明但以理的位置。中文调整语序，以“狮子坑里的但以理”清楚表达其所在之处，同时保留具体意象。
theological_decisions:
- issue: 次经希腊叙事中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这里的“主”在“主的天使”这一表达中指以色列的上帝；译作“主”既符合上下文，也遵循项目对κύριος的通常处理。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“主的一位天使”保留希腊文无冠词所体现的不定性；“饭食”避免把ἄριστον过度限定为某一时段的餐食；“狮子坑”比传统的“狮子洞”更贴近λάκκος的具体含义。
