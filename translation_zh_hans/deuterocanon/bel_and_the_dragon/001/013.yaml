  text: But they were unconcerned[a], because they had made a hidden entrance under the table, and through it they would go in
translation:
  language: zh_hans
  text: 他们却不以为意[a]，因为他们早已在桌子下面造了一个隐蔽的入口，常从那里进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们轻视这事”，或“他们根本不放在心上”。原文可表示轻视、藐视或不以为意。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεφρόνουν
  choice: 不以为意
  rationale: 该动词可表示轻视、藐视或不把某事放在心上。此处没有明说其宾语；结合叙事，祭司因确信暗道不会被发现而轻忽当前的防范措施。“不以为意”自然地保留了这种轻忽态度，而不强行补出具体对象。
- source_word: πεποιήκεσαν
  choice: 早已……造了
  rationale: 以“早已”配合“造了”，体现希腊语过去完成时所表达的先行动作：隐蔽入口在他们轻忽此事以前就已建成。
- source_word: ὑπὸ τὴν τράπεζαν κεκρυμμένην εἴσοδον
  choice: 在桌子下面造了一个隐蔽的入口
  rationale: 忠实保留入口位于桌子下面且被隐藏的空间信息；“桌子”避免把原文未明确说明的祭坛性质带入译文。
- source_word: διʼ αὐτῆς
  choice: 从那里
  rationale: 阴性代词所指最自然是前述入口。汉语用“从那里”承接入口，较“通过它”更自然。
- source_word: εἰσεπορεύοντο
  choice: 常从那里进去
  rationale: 以“常”表达未完成过去时的惯常、反复动作，而不是一次性的进入。
