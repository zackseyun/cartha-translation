  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: zh_hans
  text: “但以理[a]，除你以外，再没有别人了。”于是王把他拉了上来；却把那些对他的毁灭负有责任的人扔进坑里[b]。他们立刻在王面前被吞吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头突兀地说：“但以理，除你以外，再没有别人了。”这句话可能承接上一节的话。有些译本为使语意顺畅，会补上“王说”等字样。
    reason: textual_variant
  - marker: b
    text: 或译“狮子坑”。希腊文直译为“坑”，但上下文所指是狮子所在的坑。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: 除你以外，再没有别人了
  rationale: 保留排他性的赞叹语气，措辞自然，也不补明原文未明说的比较范围。
- source_word: ἀνέσπασεν αὐτόν
  choice: 王把他拉了上来
  rationale: ἀνασπάω表示从低处向上拉；结合坑中的场景译为“拉了上来”。希腊文主语省略，按上下文以“王”明示，避免现代汉语中指代不清。
- source_word: τοὺς δὲ αἰτίους τῆς ἀπωλείας αὐτοῦ
  choice: 那些企图毁灭他的人
  rationale: αἴτιος表示负有责任或造成某事者，ἀπώλεια为毁灭、丧亡。此处所指是导致但以理遭此毁灭之险的人；“企图”体现行动未遂，但不把ἀπώλεια窄化为“死亡”。
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: 扔进坑里
  rationale: ἐμβάλλω有投入、扔入之意；λάκκος字面是“坑”，不直接以语境中的“狮子坑”取代原词。
- source_word: κατεβρώθησαν παραχρῆμα
  choice: 当场……被吞吃了
  rationale: κατεσθίω的被动式表达被吞吃；παραχρῆμα强调立即发生，“当场”兼顾即时性和在场场景。
- source_word: ἐνώπιον αὐτοῦ
  choice: 就在王面前
  rationale: 直译为“在他面前”。按上下文所指为王，为避免汉语代词歧义而明示。
theological_decisions:
- issue: 本节开头在斯威特见证中的突兀句法
  choice: 保留为直接称呼但以理的赞叹，不在正文补入“王说”等引导语
  alternative: 补作“王说：‘但以理……’”或以其他方式明确说话者
  rationale: 希腊文以“但以理，除你以外再没有别人”突兀开篇，很可能承接上一节的话。正文不补原文没有的引导动词，以保留见证的句法状态，并用脚注说明。
- issue: “除你以外，再没有别人”的赞叹范围
  choice: 不补出“敬拜上帝”或“能救人”等具体限定
  alternative: 依据叙事语境把话扩写为“没有别的神能像你所敬拜的神这样救人”等
  rationale: 现存希腊文本将第二人称单数直接指向但以理，却未说明比较的具体方面。为避免引入神学解释，保留这一张力与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保留原文突兀感；叙事部分适度明示“王”，以消除现代汉语连续第三人称造成的歧义。所有脚注标记均已置于正文相应位置。
