  text: And the king saw that they were pressing him very hard, and being compelled, he handed Daniel over to them.
translation:
  language: zh_hans
  text: 王见他们极力向他施压，就迫不得已把但以理交给他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: 逼迫
  rationale: 该动词在此表示持续而强烈地施压，不只是请求或劝说；“逼迫”自然地体现这种压力。
- source_word: σφόδρα
  choice: 极力
  rationale: 该副词加强施压的程度；“极力”与“逼迫”搭配，简洁保留其强烈语气。
- source_word: ἀναγκασθείς
  choice: 迫不得已
  rationale: 被动分词表明王是在外在压力之下行动；“迫不得已”保留非自愿性，又不擅自解释为身体上的强迫。
- source_word: παρέδωκεν
  choice: 交给
  rationale: 该动词表示将某人交入他人掌控；“把但以理交给了他们”符合现代汉语，也保留移交之意。
- source_word: Δανιήλ
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 王受强迫的程度
  choice: 王因强烈的社会或政治压力而迫不得已地行动，并非主动自愿。
  alternative: 王只是被说服，或王受到身体上的强制。
  rationale: ἐπείγουσιν…σφόδρα与ἀναγκασθείς共同表达强烈施压及由此造成的被迫行动；译文不进一步断定压力的具体形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“极力逼迫”表达持续且强烈的压力，“迫不得已”保留王的非自愿性；句式清楚，适合普通读者。
