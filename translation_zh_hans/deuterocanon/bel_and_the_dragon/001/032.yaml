base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/032.yaml
  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: zh_hans
  text: 坑里有七只狮子，每天有人给它们两具尸体[a]和两只羊。但那时什么也没有给它们，好让它们吞吃但以理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸体”原文直译为“身体”；在这里是给狮子作食物的，因而也可理解为“死尸”。
    reason: 说明σώματα的字面意义及语境所指，保留词义层面的幅度。
lexical_decisions:
- source_word: λάκκῳ
  choice: 坑
  rationale: 该词本义为坑穴，也可指蓄水池一类的深坑；“坑”比解释性的“狮子坑”更贴近原文。
- source_word: ἑπτὰ λέοντες
  choice: 七只狮子
  rationale: 直接保留数目和名词。
- source_word: ἐδίδοτο αὐτοῖς τὴν ἡμέραν
  choice: 每天有人给它们
  rationale: 未完成时表达惯常供应；用汉语主动泛指结构自然呈现原文被动句，而不指定施事者。
- source_word: δύο σώματα
  choice: 两具尸体
  rationale: σώματα字面为“身体”，但在作为狮子食物的语境中指死尸；“两具尸体”在现代汉语中自然清楚，脚注保留较字面的可能译法。
- source_word: δύο πρόβατα
  choice: 两只羊
  rationale: πρόβατα在此通常指羊，量词按现代汉语表达。
- source_word: οὐκ ἐδόθη αὐτοῖς
  choice: 没有给它们食物
  rationale: 原文省略所给之物，承接前句显然指食物；汉语补出“食物”可避免误读，同时不改变指向。
- source_word: ἵνα καταφάγωσιν
  choice: 好让它们吞吃
  rationale: 保留ἵνα的目的意味；“吞吃”体现καταφάγωσιν吃尽、吞噬的强烈语气。
- source_word: τὸν Δανιήλ
  choice: 但以理
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 不给狮子食物与吞吃但以理之间的目的关系
  choice: 好让它们吞吃但以理
  alternative: 结果它们可以吞吃但以理
  rationale: ἵνα在此自然表达目的；直译保留叙事中蓄意使狮子饥饿的意味，不弱化为单纯结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“每天有人给它们”自然表达惯常被动供应；“但那时”对应τότε δέ，与平日供应形成转折。脚注标记紧随相关词语。
