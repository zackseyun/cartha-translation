  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
translation:
  language: zh_hans
  text: 但以理取了沥青、脂肪和毛发，把它们一同煮了，做成饼，放进那龙的嘴里；那龙吃了以后，就裂开了。但以理说：“看哪，你们所敬拜的东西[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所敬拜的东西”也可译作“圣物”或“所尊崇的东西”；希腊语指受到尊崇或敬拜之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: 沥青
  rationale: πίσσα指沥青或焦油状物质；“沥青”在现代汉语中准确、自然，也符合这里作为混合材料的语境。
- source_word: στῖρ
  choice: 脂油
  rationale: στῖρ指动物脂肪；“脂油”既保留物质性的含义，又比单说“油”准确，且不贸然限定为牛羊脂或板油。
- source_word: τρίχας
  choice: 毛发
  rationale: τρίχας是“毛、发”的复数；“毛发”保留原文的宽泛性，不擅自指定为人发或兽毛。
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: 把它们一起煮了
  rationale: ἕψω表示煮或熬，ἐπὶ τὸ αὐτό表达聚在一起、混合处理；此译清楚呈现共同烹煮的动作。
- source_word: μάζας
  choice: 团块
  rationale: μᾶζα可指揉成的饼或块状物。由于材料并非常规食物，“团块”比“饼”更中性，也保留其形态而不增加可食性的暗示。
- source_word: δράκοντος
  choice: 龙
  rationale: δράκων在本篇叙事中所指的受崇拜生物传统上称为“龙”；译作“龙”与篇名及上下文一致，而“蛇”会削弱这一文学指称。
- source_word: φαγὼν
  choice: 那龙吃下去
  rationale: 不定过去主动分词在这里表示先于主句结果发生的动作；用顺承表达自然呈现“吃下—胀裂”的次序。
- source_word: διερράγη
  choice: 胀裂了
  rationale: διαρρήγνυμι表示破裂、爆裂；在吞食混合物的语境中，“胀裂”自然传达由内而外裂开的结果，同时不额外描绘原文未明说的细节。
- source_word: τὰ σεβάσματα ὑμῶν
  choice: 你们所敬拜的东西
  rationale: σέβασμα指受尊崇或敬拜之物。“所敬拜的东西”保留其宽泛所指及讽刺语气，不直接强化为“偶像”。
theological_decisions:
- issue: 反偶像语境中τὰ σεβάσματα ὑμῶν的译法
  choice: 你们所敬拜的东西
  alternative: 你们的偶像；你们的圣物；你们所尊崇的东西
  rationale: 原词本身泛指受尊崇或敬拜之物，并未直接使用通常译作“偶像”的词。正文采用较贴近词义的表达，让叙事本身承担讽刺和批判力度；脚注提示可能的语义范围。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“拿来……一起煮了，做成……”保持动作推进；末句用“看看……吧”再现命令语气及讽刺力度。脚注标记[a]置于相关引语之后。
