  text: And Daniel said[a], “I will bow down to the Lord my God, because he is the living God.”
translation:
  language: zh_hans
  text: 但以理说：“我要向主、我的上帝俯伏敬拜[a]，因为他是活着的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯伏”或“敬拜”。希腊语动词可指俯伏行礼，也可指敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: 俯伏敬拜
  rationale: 该动词兼有俯伏行礼与敬拜之意；“俯伏敬拜”在现代汉语中同时保留身体动作和宗教敬拜的含义，避免只取其中一面。
- source_word: Κυρίῳ
  choice: 向主
  rationale: κύριος在这里指以色列的上帝，译作“主”；介词“向”体现与动词相连的与格关系。
- source_word: τῷ θεῷ μου
  choice: 我的上帝
  rationale: 该短语与“主”同位，共同指明敬拜的对象；“主我的上帝”保留原文紧密的称谓结构。
- source_word: θεὸς ζῶν
  choice: 永活的上帝
  rationale: 此处强调上帝真实地活着，并与无生命的偶像形成对照；“永活的上帝”是自然且庄重的现代中文圣经用语。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出但以理俯伏敬拜的理由，译作“因为”清楚表达因果关系。
theological_decisions:
- issue: 对κύριος的处理
  choice: 主
  alternative: 主宰
  rationale: 在“我的上帝”这一称谓中，κύριος指向以色列的上帝；“主”忠实、自然，也不额外引入解释。
- issue: προσκυνέω是否明确译为敬拜
  choice: 俯伏敬拜
  alternative: 俯伏；敬拜
  rationale: 原词可同时表示俯伏动作及由此表达的敬拜。“俯伏敬拜”保留两层含义，脚注列出较简约的可译方式，不把词义限定为单纯身体动作或抽象敬拜。
- issue: θεὸς ζῶν的定指与含义
  choice: 永活的上帝
  alternative: 活着的上帝；一位活神
  rationale: 谓语性无冠词结构并不要求译成不定称；上下文明指但以理的上帝。“永活”表达其生命真实性及与偶像的对比，而不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主我的上帝”略带经文称谓色彩，但准确保留原文“主”与“我的上帝”的同位结构；“俯伏敬拜”兼顾具体动作和敬拜含义。
