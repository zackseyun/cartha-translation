lexical_decisions:
- source_word: ἐπελάβετο
  choice: 抓住
  rationale: 表达突然且有力地抓住，力度比“握住”更符合叙事情境。
- source_word: ἄγγελος Κυρίου
  choice: 主的天使
  rationale: 此处指超自然使者；Κυρίου按希腊文本译作“主”，不另行引入希伯来神名的排印形式。
- source_word: κορυφή
  choice: 头顶
  rationale: 用于人体时指头的顶部；现代汉语中“头顶”准确自然。
- source_word: βαστάσας τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: 提着他的头发
  rationale: 保留天使以头发提起并运送他的具体动作，避免增添“长发”等原文未必要求的细节。
- source_word: ἔθηκεν αὐτὸν εἰς Βαβυλῶνα ἐπάνω τοῦ λάκκου
  choice: 把他带到巴比伦，放在坑的上方
  rationale: 兼顾εἰς所含的趋向和ἔθηκεν的安置动作，并保留ἐπάνω所表示的空间关系，不具体断定是在坑口还是其他位置。
- source_word: ῥοίζος
  choice: 呼啸声
  rationale: 该词表示疾速运动造成的呼呼、呼啸或嗖嗖声；“呼啸声”在现代汉语中清楚而有叙事力度。
theological_decisions:
- issue: ἄγγελος Κυρίου中Κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 现有希腊见证只写Κυρίου；译作“主”忠实于所给文本，也避免自行补入未明载的希伯来神名。
- issue: 所提供希腊文本在属格冠词τοῦ之后中断
  choice: 以省略号显明残缺，只翻译现存文字
  alternative: 依据其他版本或上下文补出缺失内容
  rationale: 原文摘录止于未完成的短语ἐν τῷ ῥοίζῳ τοῦ。正文用“那……的呼啸声中”呈现未完成关系，不把推测内容写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抓住—提着—带到—放在”保持动作推进；结尾用省略号明确显示源文本残缺，脚注标记置于相关句末。
