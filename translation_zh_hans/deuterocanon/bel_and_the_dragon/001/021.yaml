  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/021.yaml
  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: zh_hans
  text: 那时，王发怒了，就拘捕了祭司们和他们的妻子[a]和儿女。于是他们把隐蔽的门[b]指给王看；他们一向从这些门进去，吃掉桌上的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妻子”也可译作“妇女”。
    reason: lexical_alternative
  - marker: b
    text: “隐蔽的门”也可译作“暗门”或“秘密的门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: 发怒了
  rationale: 表达不定过去时分词在叙事中的起始性结果，语气自然，不额外强化为“暴怒”。
- source_word: συνέλαβεν
  choice: 拘捕了
  rationale: 此处是王揭穿欺骗后采取的惩处性行动；“拘捕”既保留强制扣押之意，也符合司法语境。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: ἱερεύς的常规对应词；上下文已说明是彼勒的祭司，无须另加限定。
- source_word: γυναῖκας
  choice: 妻子
  rationale: γυνή可指“妇女”或“妻子”，但与“他们的儿女”组成家庭并列，关系义“妻子”更合语境；以脚注保留另一可能。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα泛指子女，不限男性；“儿女”是自然且性别准确的现代汉语。
- source_word: κρυπτὰς θύρας
  choice: 隐蔽的门
  rationale: 保留门被遮蔽、用于秘密出入的具体含义，避免把它解释性地改写为一般的“入口”。
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: 一向从这些门进去
  rationale: 用“一向”体现未完成时所表达的过去惯常行为。
- source_word: ἐδαπάνων
  choice: 吃光
  rationale: δαπανάω本义有耗用、消耗之意；在桌上供物的语境中，“吃光”自然呈现将其消耗殆尽的意思。
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: 桌上的东西
  rationale: 紧贴中性复数结构，不明加原文没有直说的“食物”或“供物”，同时保持中文自然。
theological_decisions:
- issue: γυναῖκας在家庭成员并列中的关系义
  choice: 妻子
  alternative: 妇女
  rationale: 所有格“他们的”以及随后并列的“儿女”支持配偶义，但词本身仍可泛指妇女，故以脚注保留歧义。
- issue: συνέλαβεν所表达的王权行动
  choice: 拘捕了
  alternative: 捉住了
  rationale: 情节是欺骗败露后由王施行的强制处置，“拘捕”较能体现其司法和惩处色彩，又不引入额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一向”简洁呈现过去反复发生的行为；“桌上的东西”避免超出原文明确范围。脚注标记均置于对应词语之后。
