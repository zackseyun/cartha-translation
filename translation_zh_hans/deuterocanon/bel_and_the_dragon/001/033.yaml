  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/033.yaml
  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: zh_hans
  text: 先知哈巴谷当时在犹太地[a]。他煮了一道菜[b]，又把饼[c]掰碎放进一个盆里，正往田间去，要把这些食物送给收割的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大”。希腊语Ἰουδαία通常指“犹太地”，在某些语境中也可指“犹大”。
    reason: lexical_alternative
  - marker: b
    text: 原文指煮成的食物，也可译作“煮食”。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文为复数，直译“几个饼”或“几张饼”；中文在这里用集合性的“饼”较自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: 哈巴谷
  rationale: 采用现代中文圣经传统中该先知姓名的通行译名。
- source_word: ὁ προφήτης
  choice: 先知
  rationale: 定冠词表明这是已知的先知哈巴谷；中文用“先知哈巴谷”即可自然表达。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地
  rationale: Ἰουδαία通常指犹太地区；“犹太地”既符合希腊化时期地理用法，也避免与人物或族群混淆。
- source_word: ἥψησεν ἕψεμα
  choice: 煮了炖食
  rationale: 动词表示煮或烹煮，名词表示煮成的食物；“炖食”自然保留其烹煮性质，又不擅自指定食材。
- source_word: ἐνέθρυψεν
  choice: 掰碎
  rationale: 该词表示弄碎成小块；用于饼时，“掰碎”比“捏碎”或“碾碎”更自然。
- source_word: ἄρτους
  choice: 饼
  rationale: 原文是复数，指一个或多个饼；中文以集合性名词“饼”表达自然，并在脚注说明复数形式。
- source_word: σκάφην
  choice: 一个盆
  rationale: 该词指一种容器，也可用于较大的盆或槽；此处盛放并携带食物，译作“盆”比“小碗”更少限定其形制。
- source_word: τὸ πεδίον
  choice: 田间
  rationale: 该词可指平地、原野；因下文提到收割的人，“田间”最贴合语境。
- source_word: ἀπενέγκαι
  choice: 要把这些食物送给
  rationale: 目的不定式表示前往的目的；“送给”自然呈现将所备食物带给收割者的意思。“这些食物”是根据前述炖食和饼作出的中文指代。
- source_word: τοῖς θερισταῖς
  choice: 收割的人
  rationale: 准确表达从事收割者，且比书面色彩较强的“收割者”更易为普通读者理解。
