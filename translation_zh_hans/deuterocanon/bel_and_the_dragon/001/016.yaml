  text: And their children too[a], and they ate up everything and drank it all. Then the king rose early in the morning, and Daniel with him.
translation:
  language: zh_hans
  text: 他们和他们的孩子把一切都吃光喝尽了。清早[a]，王早早起来，丹尼尔也和他一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近似“清早，王早早起来”，重复表达清早之意，以加强时间上的强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: 他们的孩子
  rationale: τέκνα是泛指“孩子”的词，并非专指儿子；前面的καί承接上文累加列举，中文用“还有”自然表达。
- source_word: κατέφαγον πάντα
  choice: 把一切都吃光
  rationale: κατέφαγον比一般的“吃”语气更强，表示彻底吃掉；πάντα表示全部。
- source_word: ἐξέπιον
  choice: 喝尽
  rationale: 该动词表示喝光、喝尽；与“吃光”并列，简洁地传达彻底耗尽之意。
- source_word: ὤρθρισεν
  choice: 早早起来
  rationale: 该动词表示很早起身，常指黎明时分；“早早起来”保留其时间强调。
- source_word: πρωί
  choice: 清早
  rationale: πρωί再次点明早晨，与ὤρθρισεν形成原文有意的重复强调。
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: 丹尼尔也同他一起
  rationale: 原文此处省略谓语，简洁说明丹尼尔与王同行；中文补出“也……一起”以自然承接叙事，而不增添具体动作。
