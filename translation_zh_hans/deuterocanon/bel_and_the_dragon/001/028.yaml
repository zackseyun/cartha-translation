base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: zh_hans
  text: 巴比伦人听见这事，就愤愤不平，聚集起来反对王，说：“王成了犹太人[a]！他拆毁了彼勒，杀死了那条龙，又屠杀了祭司们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大人”。希腊语“Ἰουδαῖος”既可指民族和宗教身份的“犹太人”，也可指地域和政治身份的“犹大人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσαν
  choice: 听见这事，就
  rationale: 这是叙事过渡句式；现代汉语无需机械译出“事情发生了”，用“听见这事，就”既自然，也不把时间关系强化为“刚一听见”。原文未明说宾语，汉语补出“这事”以承接上文。
- source_word: οἱ Βαβυλώνιοι
  choice: 巴比伦人
  rationale: 直接表达当地群体的族群或公民身份，符合现代汉语习惯。
- source_word: ἠγανάκτησαν
  choice: 愤愤不平
  rationale: 表达强烈的不满和愤慨，同时没有提前加入后文敌对行动所显示的更强烈暴怒。
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: 聚集起来反对王
  rationale: 兼顾 συνεστράφησαν 的聚集、联合含义和 ἐπί 所表达的敌对指向，不将其具体化为秘密“密谋”。
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: 王成了犹太人
  rationale: 此处控诉王转而认同但以理所属的民族和信仰群体；“犹太人”最能传达叙事语境，同时以脚注保留“犹大人”的地域—政治含义。
- source_word: τὸν Βὴλ κατέσπασεν
  choice: 他拆毁了彼勒
  rationale: κατασπάω 在此表示拉倒、拆毁；保留“彼勒”为直接宾语，不擅自限定所毁的是神像还是相关祭祀设施。
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: 杀死了那条龙
  rationale: 清楚直译普通的“杀死”；加“那条”自然指回前文特定的龙。
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: 屠杀了祭司们
  rationale: κατασφάζω 比一般“杀死”更强烈，“屠杀”保留其暴力色彩。
theological_decisions:
- issue: Ἰουδαῖος 的身份含义
  choice: 犹太人
  alternative: 犹大人
  rationale: 该词既可指民族—宗教身份，也可指地域—政治身份。上下文的指控涉及王对但以理及其信仰立场的认同，因此正文采用“犹太人”，脚注保留“犹大人”，不抹去原词的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”较“国王”更贴近本书上下文的简洁称谓；直接引语用感叹号体现群众控诉的强烈语气。正文脚注标记 [a] 已与脚注对应。
