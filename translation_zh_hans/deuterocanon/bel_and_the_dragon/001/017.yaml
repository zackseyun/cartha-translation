  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
translation:
  language: zh_hans
  text: 他问：“但以理，封印都完好无损吗？”但以理回答：“王啊，都完好无损。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σῶοι
  choice: 完好无损
  rationale: 该词本义为“安全、完好”，在这里形容用于封闭入口的封印，重点是封印未遭破坏或动过；“完好无损”自然传达这一语境含义。
- source_word: αἱ σφραγῖδες
  choice: 封印
  rationale: 指用来封闭并显示是否有人擅动入口的印记；现代汉语用“封印”简洁明确。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留希腊语呼格的直接称呼，不添加原文没有的所属含义。
- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: 他问……但以理回答
  rationale: 原文两处都用“说”，但前句语法上是问句，后句是回应；按现代汉语叙事习惯译作“问／回答”，不改变言语行为，并明确第二位说话者是但以理。
