lexical_decisions:
- source_word: ἀναβοήσας
  choice: 呼喊
  rationale: 该不定过去时分词表示用力发声；“呼喊”保留力度，又不额外限定其情绪。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 这是表达音量之大的常用说法；译作“高声”符合现代汉语习惯，并与“呼喊”自然搭配。
- source_word: Μέγας εἶ
  choice: 你真伟大
  rationale: 前置的谓语形容词带有强调和赞叹意味；“真”自然传达这种强调。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在这里是对上帝的直接称呼；“主啊”是自然、庄重的呼格表达。
- source_word: ὁ θεὸς
  choice: 你是……的上帝
  rationale: ὁ θεός与“主”构成同位说明。汉语补出“你是”，使同位关系清楚自然，而不改变所指。
- source_word: τοῦ
  choice: ……的
  rationale: 现有希腊文本止于属格冠词τοῦ，表明后文缺失或跨入下一行；以省略号加“的”保留句子的未完状态，不从上下文擅自补足。
theological_decisions:
- issue: 神圣称呼κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处称呼的是以色列的上帝，“主”既符合神圣称号的语境，也符合现代中文圣经语体。
- issue: ὁ θεός与Κύριε的关系
  choice: 译为“主啊……你是……的上帝”
  alternative: 译为“主上帝啊”
  rationale: 定冠词与名词构成对“主”的同位说明；分译能较清楚地保存“主”与“上帝”两个表达，同时避免把它们压缩为一个复合称号。
- issue: 如何处理止于τοῦ的不完整原文
  choice: 以“……的”保留未完句
  alternative: 依上下文补出所缺名词
  rationale: 所提供的原文证据在属格冠词处中断；不补写未经本节原文直接支持的内容，以维持文本透明度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声呼喊”紧凑自然；直接称呼用“主啊”；用省略号明确显示原文在“……的”处中断。
