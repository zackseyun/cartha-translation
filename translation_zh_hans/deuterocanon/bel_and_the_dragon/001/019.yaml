  text: Not even one. And Daniel laughed[a], and held the king back from going inside, and said, “Now look at the floor, and take notice.”
translation:
  language: zh_hans
  text: 一个也没有。于是但以理笑了，拦住王，不让他进去，说：“现在看看这地面，仔细察看。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: 一个也没有
  rationale: 保留原文省略所指对象的突兀表达和强调否定，不擅自补出“人”。
- source_word: ἐγέλασεν
  choice: 笑了
  rationale: 按动词基本义翻译；“嘲笑”会过度限定但以理的语气，“微笑”则语义过弱。
- source_word: ἐκράτησεν
  choice: 拉住
  rationale: 结合后面的否定不定式，表达但以理以实际动作阻止王进入；措辞自然，同时不额外渲染暴力。
- source_word: τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  choice: 不让他进去
  rationale: 这一带冠词的不定式结构表示阻止，现代汉语以“不让他进去”简洁自然地呈现。
- source_word: Ἴδε δὴ
  choice: 你看
  rationale: ἴδε是引人注意的命令式，δή加强当下、直接的语气；汉语“你看”在此情境中自然传达二者。
- source_word: τὸ ἔδαφος
  choice: 这地面
  rationale: 在殿内房间的语境中，“地面”比宽泛的“地”更准确，也比“地板”更少预设材质。
- source_word: γνῶθι
  choice: 要看清楚
  rationale: γινώσκω的命令式本义可为“知道、认出”；在勘察地面的语境中，指通过观察而辨明，“看清楚”兼顾动作与认知结果。
