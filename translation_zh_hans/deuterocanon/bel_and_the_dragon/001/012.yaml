  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
translation:
  language: zh_hans
  text: “用你的指环封上。早晨你来时，如果没有发现所有东西都被彼勒吃掉，我们就得死；不然，那个针对我们说谎的但以理就得死[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那诬陷我们的但以理就得死。”希腊语“针对我们说谎”可指针对他们说谎，也可含虚假指控他们的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον
  choice: 封好
  rationale: 这是命令式，指加盖印记以封住并确保现场未被开启；“封好”简洁自然，也符合上下文的验证作用。
- source_word: τῷ δακτυλίῳ σου
  choice: 用你的戒指
  rationale: δάκτυλιος是戒指，在封印语境中实际指带印章的戒指；正文用“戒指”忠实保留原词，而“封好”已显明其印戒用途。
- source_word: ἐλθὼν πρωὶ
  choice: 早晨你来时
  rationale: 将分词结构自然处理为时间从句，完整保留“来到”和“早晨”两层意思。
- source_word: πάντα βεβρωμένα
  choice: 一切都……吃光了
  rationale: 完成时被动分词表示所有预备之物届时已被吃掉；“吃光了”在汉语中自然表达全部耗尽的结果。
- source_word: ὑπὸ τοῦ Βήλ
  choice: 被彼勒
  rationale: 按原文直接使用神名，不额外补入“神”；采用现代汉语音译“彼勒”。
- source_word: ἀποθανούμεθα
  choice: 我们就死
  rationale: 直译未来时所表达的后果；在条件句中，“就死”比“将要死”更自然有力。
- source_word: ἢ Δανιὴλ ὁ ψευδόμενος καθʼ ἡμῶν
  choice: 不然，就是但以理在说谎诬陷我们
  rationale: ἤ在此引出二选一的另一结果；ψεύδομαι与κατά连用既有说谎也有针对他人作虚假指控的意味，“说谎诬陷我们”在现代汉语中保留这两层关联含义。
theological_decisions:
- issue: 祭司对但以理之行为的指控应如何表达
  choice: 在说谎诬陷我们
  alternative: 在说谎攻击我们／在诬告我们
  rationale: 原短语ψευδόμενος καθ’ ἡμῶν可能泛指针对他们说谎，也可能带有虚假指控的意味。正文以“说谎诬陷”兼顾两者，并用脚注提示较贴近表层结构的译法，避免将其限定为正式司法控告。
translation_notes:
  register: 采用现代、庄重而口语流畅的叙事语言。“再用……封好”“早晨你来时”“我们就死”便于普通读者理解；保留原文的二选一结构和对但以理指控的语义张力。
