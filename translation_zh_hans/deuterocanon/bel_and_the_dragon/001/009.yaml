  text: for this expense[a], you will die; but if you show that Bel eats them, Daniel will die, because he has blasphemed against Bel. And
translation:
  language: zh_hans
  text: 为这笔开销，你们必死；但如果你们能证明彼勒吃那些供物，达尼尔就必死，因为他亵渎了彼勒。并且[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文末尾为“并且”；句子在下一节继续。
    reason: 说明本节以连接词收尾，源文本的句法跨越节界。
lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: 这笔开销
  rationale: δαπάνη指费用、开支；结合上下文，是为彼勒每日供物所付的开销。“这笔开销”既保留原词含义，也避免把它过度具体化为供物本身。句首承接上一节未完的结构，译文以“为”使本节片段在现代汉语中较为顺畅。
- source_word: ἀποθανεῖσθε
  choice: 你们就必死
  rationale: 将来时在这里表达司法性的威胁或判决。“必死”保留其确定、严厉的语气。
- source_word: δείξητε
  choice: 能证明
  rationale: δείκνυμι可指展示、表明；在这场检验真伪的挑战中，“证明”最符合语境，其中“能”对应条件句的实际语气，并未改变命题内容。
- source_word: κατεσθίει
  choice: 吃了
  rationale: 该复合动词可带有“吃尽、吞吃”的意味，但此处重点是彼勒是否吃供物；简洁的“吃了”自然且不夸大语气。
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: 他亵渎了彼勒
  rationale: βλασφημέω在此表示针对被视为神明者的亵渎或辱骂；“亵渎”保留宗教指控的性质，而不等于译者承认彼勒为真神。
- source_word: καὶ
  choice: 于是
  rationale: 本节末尾的καὶ连接下一节叙事。“于是”在现代汉语中自然体现承接关系；脚注说明原文句子尚未结束。
theological_decisions:
- issue: 异教神明语境中βλασφημέω的译法
  choice: 亵渎了彼勒
  alternative: 辱骂了彼勒／说了冒犯彼勒的话
  rationale: 说话者把彼勒视为神，因此提出的是宗教性的亵渎指控。“亵渎”忠实保留该指控的力度，却不替叙述者认定彼勒具有真实神性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“彼勒”与“达尼尔”按本项目对本书专名的音译处理。保留节首承接上文、节末连接下文的片段性质，并以脚注提示后者。
