  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: zh_hans
  text: “请收下上帝给你送来的饭食[a]。”但以理说：“上帝啊，你果然记念我，没有离弃爱你的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饭食”也可译作“上好的食物”或“最好的那一份”；希腊语 τὸ ἄριστον 可指主要的一餐或上好的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε
  choice: 请收下
  rationale: 这是 λαμβάνω 的不定过去时命令式；“收下”自然表达接过送到面前之物的意思，“请”使现代汉语中的直接引语自然庄重，并不削弱命令的含义。
- source_word: τὸ ἄριστον
  choice: 饭食
  rationale: ἄριστον 可指主要的一餐，也可指上好的食物；上下文明确是送来的食物，因此正文用宽泛自然的“饭食”，并在脚注保留“上好的食物”等词义可能。
- source_word: ἀπέστειλέν
  choice: 给你送来的
  rationale: 关系从句 ὃ ἀπέστειλέν σοι 直译为“他给你送来的”；汉语定语结构清楚表达已经完成且当前送达的行动。
- source_word: Ἐμνήσθης
  choice: 记念我
  rationale: 该动词在向上帝祷告的语境中不只是想起，也含顾念之意；“记念”保留其经文语体和关系性分量。
- source_word: γάρ
  choice: 果然
  rationale: γάρ 在此可作解释或确认。若硬译为句首“因为”，现代汉语会显得缺少主句；“果然”自然表达但以理从获救行动确认上帝顾念他的语气。
- source_word: ἐγκατέλιπες
  choice: 没有离弃
  rationale: 该词表示撇下、遗弃；“离弃”自然庄重，也保留其情感和神学力度。
- source_word: τοὺς ἀγαπῶντάς
  choice: 爱你的人
  rationale: 希腊语分词本身没有明写宾语，但直接呼告上帝的语境自然补足“你”；现代汉语需要明示这一对象。
theological_decisions:
- issue: “爱”的隐含宾语
  choice: 爱你的人
  alternative: 爱上帝的人；爱的人
  rationale: 但以理正在直接呼告“上帝啊”，所以 τοὺς ἀγαπῶντάς 最自然地指“爱你的人”。补出“你”是汉语句法与语境所需，并非增加教义内容。
- issue: γάρ 的解释关系
  choice: 果然
  alternative: 因为；的确
  rationale: γάρ 可引出理由，也可加强对刚刚显明之事实的确认。此处不把它处理成严密的因果命题，而以“果然”保留但以理因蒙拯救而确认上帝顾念人的语气。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祷告语体。“上帝啊”保留直接呼告；“记念”“离弃”承载原文的关系性和情感力度，但整体句式避免古奥。
