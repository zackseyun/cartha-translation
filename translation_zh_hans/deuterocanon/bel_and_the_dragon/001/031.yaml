lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们却
  rationale: δέ在上下文中表示推进并带轻微转折；“却”自然地保留这一语气，不过度强化。
- source_word: ἔβαλον
  choice: 扔进
  rationale: βάλλω在此表示用力投入；“扔进”比“放进”更能体现动作力度，也符合现代汉语。
- source_word: λάκκον τῶν λεόντων
  choice: 狮子坑
  rationale: λάκκος本义为坑、穴；“狮子坑”既贴近希腊文，也清楚说明这是关狮子的坑，无须沿用较不直译的“狮子洞”。
- source_word: ἦν ἐκεῖ
  choice: 在那里待了
  rationale: 字面为“在那里”；结合持续六天的时间表达，汉语用“在那里待了”更完整自然，未增加实质信息。
- source_word: ἡμέρας ἕξ
  choice: 六天
  rationale: 宾格表示时间延续；“待了六天”自然明确地表达持续时长。
