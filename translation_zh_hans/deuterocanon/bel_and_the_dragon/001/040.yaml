base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: zh_hans
  text: 他立刻把哈巴谷安置在原来的地方。第七天，王来为但以理哀悼。他来到坑边，往里一看，只见但以理正坐在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“穴”。希腊原文 λάκκος 是泛指坑穴的词，并非专指“狮子坑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: 安置
  rationale: 此处指使哈巴谷回到并处于原来的地方；“安置”自然地表达这一使役与归位动作，不额外引入“恢复职分”等含义。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确保留副词所表达的即时性，且符合现代汉语叙事习惯。
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: 在原来的地方
  rationale: 上下文表明这是哈巴谷被带走前所在之处；“原来的地方”比“自己的地方”在现代汉语中更清楚自然，同时不进一步指定地点。
- source_word: πενθῆσαι
  choice: 为……哀悼
  rationale: 保留王以为但以理已经死亡而前来哀悼的目的和情感力度。
- source_word: λάκκον
  choice: 坑
  rationale: λάκκος是泛指坑穴的词，并非专指狮子窝；正文采用较贴近原文的“坑”。
- source_word: ἐνέβλεψεν
  choice: 往里一看
  rationale: 结合王来到坑边的场景，表达他朝坑内观看；措辞简洁而自然。
- source_word: ἰδοὺ
  choice: 只见
  rationale: 在现代汉语叙事中自然保留突然发现和画面转换的效果，避免使用较古奥的“看哪”。
- source_word: καθήμενος
  choice: 正坐在那里
  rationale: 忠实表达但以理被看见时的姿态，并以“正”呈现当时正在持续的状态。
theological_decisions:
- issue: 王为但以理哀悼的含义
  choice: 来为但以理哀悼
  alternative: 来哀悼但以理／来为但以理悲伤
  rationale: 译文呈现王以为但以理已经死去而前来哀悼的叙事情境，但不把这一判断写成客观事实，也不加入额外的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只见”保留 ἰδοὺ 的叙事突显作用；将较长的希腊并列句分成数句，以提高普通读者的可读性。脚注标记置于相关句末。
