  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/024.yaml
  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: zh_hans
  text: 王对但以理说：“你不能说这不是一位活着的神；要向他下拜[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜他”。希腊语这个动词既可指俯伏下拜、表示尊崇，也可指敬拜，尤其当对象被视为神明时。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: 你不能说
  rationale: 直译否定的 δύναμαι 加不定式，保留王所发出的挑战，不额外判定这是指能力、许可还是修辞上的不可能。
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: 这不是一位活着的神
  rationale: θεὸς ζῶν 在此指王所认定的异教神祇；用“一位活着的神”既符合现代汉语，也避免误作指向以色列之神的专称“永生神”。
- source_word: προσκύνησον αὐτῷ
  choice: 要向他下拜
  rationale: προσκυνέω 可指俯伏致敬，也可指敬拜。正文采用具体而自然的“下拜”，保留动作及语义空间；宗教含义由上下文呈现。
- source_word: βασιλεὺς
  choice: 王
  rationale: 汉语叙事中已知人物称“王”自然简洁，无须机械体现希腊语冠词。
- source_word: τῷ Δανιὴλ
  choice: 对但以理
  rationale: 将与格间接宾语自然译为“对但以理”；人名采用通行圣经译名。
- source_word: καὶ
  choice: ；要
  rationale: 分号承接王的判断与命令，未加入“所以”等原文没有的明确因果关系；汉语命令句省略机械的“并且”更自然。
theological_decisions:
- issue: θεὸς ζῶν 是否应译成专指真神的称号
  choice: 一位活着的神
  alternative: 永生神／那位活着的上帝
  rationale: 说话者是把彼勒视为神祇的异教君王。采用不定的“一位”及普通名词“神”，可保留说话者视角和叙事反讽，不把他的说法误译成以色列对独一真神的信认。
- issue: προσκύνησον 是否应明确译为宗教性的“敬拜”
  choice: 向他下拜
  alternative: 敬拜他
  rationale: 该动词兼有俯伏致敬和敬拜之义。对象虽是被奉为神的彼勒，使宗教含义十分明显，但正文保留较具体的身体动作，脚注说明另一译法，以免消除原词的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“活着的神”比传统称号“永生神”更贴近此处字面和异教君王的口吻；“向他下拜”自然表达命令，同时借脚注保留“敬拜”的可能。正文中的脚注标记与脚注完全对应。
