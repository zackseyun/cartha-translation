- source_word: βέβρωκεν οὐδέποτε
  choice: 从来没有吃过
  rationale: 完成时配合 οὐδέποτε，表示截至当前从未发生过吃食之事；“从来没有吃过”自然保留其完成状态与否定力度。
- source_word: θυμωθεὶς
  choice: 就发怒
  rationale: 不定过去时分词交代随后行动的情境或起因；“就发怒”简洁表达怒气生发，又不强化为“勃然大怒”。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 现代中文叙事中自然、庄重地对应 βασιλεύς；上下文已明确其身份，无须重复量词或增添称谓。
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 在此表示把祭司召到面前；“叫来”比单说“叫”更清楚，也比“召见”少一层原文未明说的宫廷色彩。
- source_word: τοὺς ἱερεῖς αὐτοῦ
  choice: 他的祭司
  rationale: 直接保留 ἱερεῖς 与属格代词 αὐτοῦ，不额外限定为某座庙宇的祭司。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 对应常见的希腊语言说公式，符合现代汉语表达。
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: 你们若不告诉我
  rationale: 保留 ἐὰν μή 加虚拟式的条件结构；“若不”庄重而清楚。
- source_word: τίς ὁ κατεσθίων
  choice: 是谁在吃
  rationale: 用进行表达对应现在分词 κατεσθίων，并让未完的宾语自然延续到下一节。
- source_word: τὴν
  choice: 这
  rationale: 原文在阴性单数宾格冠词 τὴν 处中断。中文无法孤立翻译定冠词，故以未完成的指示限定语“这”保留句法悬置，不擅自补出下一节的名词。
