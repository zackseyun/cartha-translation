  text: Whose footprints are these? And the king said, “I see the footprints of men and women and children.”
translation:
  language: zh_hans
  text: “这些是谁的脚印？”王说：“我看见了男人、女人和孩子的脚印。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος
  choice: 谁的
  rationale: 这是询问归属或身份的疑问属格；“谁的”既准确又符合现代汉语的直接问法。
- source_word: ἴχνη
  choice: 脚印
  rationale: 本词指脚留下的痕迹；叙事场景中译作“脚印”最具体自然。
- source_word: ταῦτα
  choice: 这些
  rationale: 指向说话者眼前可见的痕迹，保留了原文的指示意味。
- source_word: ὁρῶ
  choice: 我看见了
  rationale: 表达直接的视觉辨认；加“了”自然呈现王看到证据后作出的即时判断。
- source_word: ἀνδρῶν
  choice: 男人
  rationale: ἀνήρ在此明确指成年男性，并非泛指人类；“男人”与后面的“女人、孩子”构成自然并列。
- source_word: γυναικῶν
  choice: 女人
  rationale: 在按脚印辨认不同人群的列举中，应取一般意义“女人”，而非关系意义“妻子”。
- source_word: παιδίων
  choice: 孩子
  rationale: 指儿童；“孩子”清楚自然，也不额外限定年龄大小。
