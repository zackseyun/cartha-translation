  text: Sound the trumpet in Zion with the trumpet of the holy signal[b][a],
translation:
  language: zh_hans
  text: 你们要在锡安吹响作为圣者信号的号角[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要在锡安吹响号角，作为给圣者的信号。”
    reason: 将ἁγίων理解为信号所指向的对象；这一理解与聚集、归回的语境相合。
  - marker: b
    text: 原文结构紧缩，亦可译为：“你们要在锡安吹响圣者的信号号角。”这里“圣者”所指的具体群体及其与“信号”的属格关系未明。
    reason: 保留 σημασίας ἁγίων 的属格关系及“圣者”所指范围的歧义，避免在正文中将其限定为特定群体或单一属格关系。
lexical_decisions:
- source_word: Σαλπίσατε
  choice: 吹响号角
  rationale: 这是 σαλπίζω 的简单过去时命令语气复数，要求众人公开吹号；“吹响号角”自然地保留了命令语气和号角声响起的意味。
- source_word: ἐν Σιὼν
  choice: 在锡安
  rationale: 按 ἐν 的地点用法译作“在”，保留以锡安为公开、礼仪性行动场所的含义。
- source_word: ἐν σάλπιγγι
  choice: 号角／号声
  rationale: ἐν 加与格在此表示凭借的器具。汉语若机械重复“用号角吹号角”较生硬，因此以“吹响号角，发出……号声”表达同一器具关系。
- source_word: σημασίας
  choice: 召集……的号声
  rationale: σημασία 指传递信号或示意；结合吹号语境，“号声”保留信号功能，而“召集”表达这里很可能具有的召唤作用，但不把它解释成军事警报。
- source_word: ἁγίων
  choice: 圣者
  rationale: 该复数属格可指“圣者”，具体是分别为圣的敬拜者、祭司，还是更广义的圣民，原文没有明确限定；“圣者”较“圣徒”少一些宗派性联想。
theological_decisions:
- issue: ἁγίων 所指的人群及其与 σημασίας 的关系
  choice: 正文译为“召集圣者的”，将 ἁγίων 理解为意义上的受事属格，同时用宽泛的“圣者”保留其所指范围的不确定性。
  alternative: 也可按较形式对应的方式译为“圣者的信号”，或理解为“神圣信号”。
  rationale: 后文归回、聚集的语境支持把号声理解为向圣者发出的召集信号；但单凭这个紧缩的希腊语结构，属格关系仍可有不同分析，因此在脚注中保留其他读法，不把“圣者”进一步限定为祭司、圣徒或某一特定群体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文避免生硬重复“用号角吹号角”，以“吹响号角，发出……号声”重组表达；保留复数命令所含的群体呼吁，并以“圣者”避免过早锁定具体宗教群体。句末逗号依照所给单节文本，表明呼吁在下文延续。
