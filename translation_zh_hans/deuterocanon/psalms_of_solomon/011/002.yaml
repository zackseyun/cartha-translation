  yaml_path: translation/deuterocanon/psalms_of_solomon/011/002.yaml
  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
translation:
  language: zh_hans
  text: 你们要在耶路撒冷宣告报好消息者的声音[a]：因为上帝在眷顾他们[b]时，怜悯了以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“传报好消息之人的声响”。
    reason: lexical_alternative
  - marker: b
    text: “眷顾”所译的希腊词也可指“察看”“看顾”或“介入”；这里也可译作“在对他们的眷顾中”或“借着眷顾他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξατε
  choice: 你们要……宣告
  rationale: 这是复数命令式，表示公开传扬；“宣告”保留其庄重、公开的传令意味，并以“你们要”体现复数命令。
- source_word: φωνὴν
  choice: 声音
  rationale: 保留希腊文具体的声音意象，不将其简化为“消息”或“内容”。
- source_word: εὐαγγελιζομένου
  choice: 报好消息者
  rationale: 分词指传报喜讯的人；此译法忠实表达一般性的“报好消息”，避免把它预先限定为后来的基督教术语。
- source_word: ἠλέησεν
  choice: 怜悯了
  rationale: 直接对应表示怜悯的动词，简洁地突出上帝已经施行的行动。
- source_word: ἐπισκοπῇ
  choice: 眷顾
  rationale: 该词可表示察看、看顾或介入；上下文谈到好消息与怜悯，因此“眷顾”自然表达带着恩慈的临到和照看，同时不把含义缩窄为行政性的“监督”。
- source_word: αὐτῶν
  choice: 他们
  rationale: 复数代词回指作为群体的以色列；在“眷顾他们”中按受事理解，清楚表达上帝眷顾以色列。
theological_decisions:
- issue: ἐν τῇ ἐπισκοπῇ αὐτῶν 的含义和关系
  choice: 在上帝眷顾以色列之时施怜悯
  alternative: 借着对以色列的察看、看顾或介入而施怜悯
  rationale: 好消息和怜悯的语境支持积极、恩慈的神圣眷顾。正文用“在眷顾他们时”明确代词是眷顾的对象，但脚注保留名词可能包含“察看、看顾、介入”的较宽语义，也不强行判定 ἐν 只表示时间还是方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要”明确复数命令；“报好消息者的声音”有意保留原文较凝练的诗歌意象。末句用“眷顾他们时”避免“他们的眷顾”在中文中产生施事归属不清，同时以脚注保留原文名词结构以及时间、方式两种可能关系。
