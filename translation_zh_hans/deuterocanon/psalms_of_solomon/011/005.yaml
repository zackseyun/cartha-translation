  text: 他为他们把高山削平，化为平地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为他们使高山降低，成为平坦之地。”
    reason: 保留ἐταπείνωσεν可译作“使……降低”以及ὁμαλισμός指平坦、平整之地的词义选择。
lexical_decisions:
- source_word: ὄρη
  choice: 山
  rationale: 该名词通常指山或较大的丘陵；此处与“高”连用，“高山”最自然地保留了意象的规模。
- source_word: ὑψηλὰ
  choice: 高
  rationale: 采用直接的定语译法“高山”，保留具体的高度意象，语言自然明白。
- source_word: ἐταπείνωσεν
  choice: 削平
  rationale: 该动词可指“使卑微、压低”；以山为宾语并与结果短语“化为平地”连用时，主要表达物理上的降低。“削平”在现代汉语中准确传达这一动作。
- source_word: εἰς ὁμαλισμὸν
  choice: 化为平地
  rationale: εἰς在此表示结果，ὁμαλισμός表示平坦、平整；“化为平地”清楚自然地表达山被降至平坦的结果。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 此处与格最适合理解为利益与格，表示这一行动是为了他们的益处。
