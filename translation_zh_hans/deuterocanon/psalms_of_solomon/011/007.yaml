base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/007.yaml
  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: zh_hans
  text: 上帝使各种芳香的树木为他们生长起来，好让以色列在他们上帝荣耀的眷临中[a]经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们上帝荣耀的看顾中。”
    reason: ἐπισκοπή可表示眷临、察看、看顾或监管；此处究竟侧重上帝荣耀的临到，还是其荣耀的看顾，存在词义上的开放性。
lexical_decisions:
- source_word: πᾶν
  choice: 各种
  rationale: πᾶν与单数ξύλον连用，具有分配或总括意义；“各种”自然表达各类芳香树木均包括在内。
- source_word: ξύλον
  choice: 树木
  rationale: 结合ἀνέτειλεν所表达的萌发、生长意象，此处指树木，而非木材。
- source_word: εὐωδίας
  choice: 芳香的
  rationale: 属格在此具有修饰作用；“芳香的”自然保留悦人香气的含义。
- source_word: ἀνέτειλεν
  choice: 使……生长起来
  rationale: 该动词可指植物萌发或长出；此译明确保留上帝使其生长的主动作为。
- source_word: παρέλθῃ
  choice: 经过
  rationale: 动词表示越过、通过或经过；上下文并未充分限定具体路径，“经过”保留其宽泛的移动含义。
- source_word: ἐπισκοπῇ
  choice: 眷临
  rationale: 该词可指临到、察看、看顾或监管；“眷临”兼具上帝亲自临到并眷顾其民的意味，同时保持诗体的庄重感。
- source_word: δόξης
  choice: 荣耀
  rationale: “荣耀”是神圣语境中δόξα的通行译法，也保留上帝显赫荣美的含义。
theological_decisions:
- issue: ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν的含义
  choice: 在他们上帝荣耀的眷临中
  alternative: 在他们上帝荣耀的看顾中
  rationale: ἐπισκοπή既可强调临到、察看，也可强调持续的看顾或监管。正文采用“眷临”，不把上帝的行动缩减为行政性的监管；脚注保留“看顾”这一真实可能。
translation_notes:
  register: 采用现代、庄重而可理解的书面普通话。“眷临”略带经文诗体色彩，用以保存原文ἐπισκοπή的神学张力；其较日常的可能译法在脚注中说明。
