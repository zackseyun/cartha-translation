  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
translation:
  language: zh_hans
  text: 丘陵因他们来临，便从他们面前逃去[a]；树林在他们经过时为他们遮荫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“丘陵从他们的来临前逃去。”原文短语可指他们进入、来到或临近；介词与“逃去”连用，也带有从他们面前躲开的意思。
    reason: lexical_alternative
  - marker: b
    text: “树林”也可译作“林地”或“灌木丛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ βουνοὶ
  choice: 丘陵
  rationale: βουνός通常指小山、丘陵，而非高山；“丘陵”既符合尺度，也保留原文的诗歌意象。
- source_word: ἔφυγον
  choice: 逃去
  rationale: 采用φεύγω的通常含义“逃走”，保留丘陵被人格化的鲜明画面，不改写为较弱的“退让”或“移开”。
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: 一见他们来到，就从他们面前
  rationale: ἀπό与“逃去”结合，表达逃离、躲开之意；εἴσοδος在这里是来到、进入或临近。此译既保留“从……逃去”的空间关系，也用自然汉语表达他们来临时发生的情景。
- source_word: οἱ δρυμοὶ
  choice: 树林
  rationale: δρυμός可指林地、树林或灌木丛。“树林”在现代汉语中自然，并适合与遮荫的动作搭配；具体林木形态在脚注中保留开放性。
- source_word: ἐσκίασαν αὐτοῖς
  choice: 为他们遮荫
  rationale: “为他们”体现与格αὐτοῖς的受益意味，“遮荫”直接传达动词的动作。
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: 在他们经过的路上
  rationale: πάροδος可指经过、通行或所走的道路；此译保留“经过”与“路途”两层联系，同时符合现代汉语表达。
