base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/009.yaml
  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: zh_hans
  text: 愿主成就他论到以色列和耶路撒冷所说的话[a]；愿主以他荣耀之名[b]兴起以色列[c]。愿主的怜悯临到以色列，直到永远，永无止境[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿主实行他论到以色列和耶路撒冷所说的。”
    reason: 保留ποιήσαι较宽泛的“做、实行”之义，说明正文“成就”是符合语境的自然表达，而非唯一可能。
  - marker: b
    text: 原文结构凝练，直译近于“在他荣耀的名中”；也可理解为“凭他荣耀的名”。
    reason: 提示ἐν ὀνόματι δόξης αὐτοῦ在关系和表达上的真实歧义。
  - marker: c
    text: “兴起”也可译作“恢复”或“重新建立”。
    reason: 说明ἀναστήσαι的语义范围，避免把正文限定为身体复活或单纯政治复国。
  - marker: d
    text: 末语直译近于“直到永远，并且还要延续”。
    reason: 展示εἰς τὸν αἰῶνα καὶ ἔτι中καὶ ἔτι所带出的追加和延续意味。
lexical_decisions:
- source_word: ποιήσαι
  choice: 成就
  rationale: 该不定过去时祈愿式表达愿望。ποιέω本义宽泛，可指“做、实行”；结合“所说的话”，现代汉语用“成就”较自然，但不把内容具体限定为某一种预言实现。
- source_word: ἐλάλησεν ἐπὶ
  choice: 论到……所说的话
  rationale: ἐπί加宾格在此表示言说所关涉的对象。“论到”自然地传达与以色列和耶路撒冷有关的意思，同时不强化为“向……宣告”或特定的预言术语。
- source_word: ἀναστήσαι
  choice: 兴起
  rationale: 保留“使之起来”的动词意象，并让复兴、恢复、重新建立或得以振起等含义保持开放，不将其限定为政治复国或身体复活。
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: 以他荣耀之名
  rationale: 原文结构凝练，直译近于“在他荣耀的名中”。“以他荣耀之名”兼顾现代汉语的庄重和可读性，并保留“名”与“荣耀”两个要素，不简化成“以他荣耀的名义”或“为了他荣耀的名”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 这是ἔλεος在祈愿语境中的清楚、常用译法；不额外加入原文未明说的盟约性限定。
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: 直到永远，永无止境
  rationale: εἰς τὸν αἰῶνα表示“直到永远”，καὶ ἔτι又加上“仍然、还要延续”的强调。“永无止境”以自然汉语再现这种递进延续，也适合作为诗篇结句。
theological_decisions:
- issue: 以色列被“兴起”的含义
  choice: 保留“兴起”，不具体说明其方式
  alternative: 恢复以色列；重新建立以色列；使以色列复起
  rationale: ἀναστήσαι可涵盖振起、恢复和重新建立等意思，原文没有把它限定为复活、政治复国或某种特定末世方案；译文因此保留其神学张力。
- issue: “以他荣耀之名”的语义关系
  choice: 采用较形式对应的表达，不明确限定为凭借、名义或目的
  alternative: 凭他荣耀的名；奉他荣耀的名；为了他荣耀的名
  rationale: ἐν可容纳领域、凭借或关联等语感，而“荣耀之名”本身也高度凝练。译文不擅自确定唯一关系。
- issue: 末句的祈愿性质
  choice: 补出“愿”，译为“愿主的怜悯临到”
  alternative: 主的怜悯在以色列之上
  rationale: 希腊文末句没有明写动词，但承接前两句祈愿式，最自然地理解为祝愿。补出“愿……临到”是汉语所需，并未改变祈愿语气。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿体。“论到”“兴起”“怜悯临到”适合诗歌和礼仪语境，又不显陈旧；分号保留前两项平行祈愿，末句独立收束全诗。
