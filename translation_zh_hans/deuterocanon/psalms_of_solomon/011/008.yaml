base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/008.yaml
  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: zh_hans
  text: 耶路撒冷啊，要穿上你荣耀的衣裳；预备好你那分别为圣的礼服[a]，因为上帝已经向以色列说了美善的话，直到永永远远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣的礼服”也可译作“你圣洁的礼服”；若将“圣所”理解为此词的意思，也可理解为“属于你圣所的礼服”。
    reason: ἁγίασμα 可指圣洁、被奉献为圣之物或圣所；此处属格关系及具体所指不能完全确定。
  - marker: b
    text: 希腊文直译为“直到永远，并且还要更多／进一步”。这一短语也可作为加强永恒持续的表达，译作“永永远远”。
    reason: 保留 εἰς τὸν αἰῶνα καὶ ἔτι 中 καὶ ἔτι 的附加成分，并说明其在上下文中的惯用永恒性理解。
lexical_decisions:
- source_word: ἔνδυσαι
  choice: 要穿上
  rationale: 中间语态命令式，呼召耶路撒冷为自己穿戴；“要穿上”自然地保留命令语气。
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: 你荣耀的衣裳
  rationale: 保留“衣裳”这一复数衣着意象及 δόξα 的圣经性用语“荣耀”。
- source_word: ἑτοίμασον τὴν στολήν
  choice: 预备好……礼服
  rationale: ἑτοίμασον 是明确的命令；στολή 指较庄重的长衣或礼服，用“礼服”符合耶路撒冷受装扮的诗歌语境。
- source_word: τοῦ ἁγιάσματός σου
  choice: 你那分别为圣的
  rationale: ἁγίασμα 可指圣洁、被分别为圣之物或圣所；正文采用形容性表达，传达奉献归圣之义，同时不把它限定为建筑性的“圣所”。
- source_word: ἐλάλησεν ἀγαθὰ
  choice: 已经向以色列说了美善的话
  rationale: 贴近希腊文“说了美善之事/话”，不径自解释为“应许”或“赐福”。
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: 直到永远，且仍要延续
  rationale: 既保留 εἰς τὸν αἰῶνα 的永久性，也明确呈现 καὶ ἔτι 所增加的“并且还、仍进一步”之力，避免仅用惯用永恒表达而抹平其形式张力。
theological_decisions:
- issue: τοῦ ἁγιάσματός σου 所指的是圣洁、圣物还是圣所
  choice: 理解为耶路撒冷分别为圣的礼服
  alternative: “你圣洁的礼服”或“你圣所的礼服”
  rationale: 属格结构本身有歧义。穿衣意象较支持与耶路撒冷圣洁身份相称的礼服，但“圣所”这一词义不能排除，故列入脚注。
- issue: 上帝“说了美善的话”是否应解释为应许或祝福
  choice: 保留“说了美善的话”
  alternative: “应许了美福”或“宣告了祝福”
  rationale: 原文使用一般性的“说”与中性复数“美善之事”，不宜在正文中将其神学功能限定为应许或祝福。
- issue: εἰς τὸν αἰῶνα καὶ ἔτι 的持续范围
  choice: 直到永远，且仍要延续
  alternative: “永永远远”
  rationale: 惯用译法“永永远远”流畅，却可能遮蔽 καὶ ἔτι 独立增加的延续意味；正文保留这种略带张力的叠加。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语体。以“耶路撒冷啊”呈现直接呼语，以分号保持两项命令的平衡；避免古奥词汇，也不将原文的圣所/圣洁歧义和时间表达中的张力静默消解。
