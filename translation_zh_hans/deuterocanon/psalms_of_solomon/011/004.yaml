  text: They come from the north in the joy of their God[a]; from distant islands God has gathered them.
translation:
  language: zh_hans
  text: 他们从北方而来，在他们的上帝的喜乐中；上帝从遥远的海岛[a]聚集了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海岛”也可译作“沿海地区”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: 从北方
  rationale: ἀπό加属格表示来源，βορρᾶ指北方；“从北方”自然保留了方向和来源之意。
- source_word: ἔρχονται
  choice: 而来
  rationale: 以现在时描写正在呈现的行动；“而来”在诗体语境中简洁自然，并保留其鲜明感。
- source_word: τῇ εὐφροσύνῃ
  choice: 满怀……喜乐
  rationale: 与格表示方式或伴随状态；此译保留εὐφροσύνη的名词性，同时符合现代汉语表达。
- source_word: τοῦ θεοῦ αὐτῶν
  choice: 他们上帝的
  rationale: 按属格结构直译，不把它明确解释成“来自上帝的”或“在上帝面前的”，从而保留原文可能存在的关系张力。
- source_word: ἐκ νήσων μακρόθεν
  choice: 从遥远的海岛
  rationale: ἐκ表示来源，μακρόθεν表示距离遥远；νῆσος通常指岛屿，但在圣经希腊语中也可能涵盖沿海地区，故正文采用“海岛”并以脚注说明。
- source_word: συνήγαγεν
  choice: 聚集了
  rationale: 以“了”表达不定过去时所呈现的完成行动，既自然，也突出上帝已经施行的聚集。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 保留明确主语和神圣行动者；采用现代简体中文中通行、庄重的称谓。
theological_decisions:
- issue: τοῦ θεοῦ αὐτῶν与“喜乐”的关系
  choice: 他们上帝的喜乐
  alternative: 来自他们上帝的喜乐／在他们上帝面前欢喜
  rationale: 希腊文仅以属格连接“喜乐”和“他们的上帝”，未明确标示来源或场景；译文不补入因果或礼仪性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“满怀……喜乐”使方式与格在汉语中流畅可读；分号保留两个对应分句，并让后句突出上帝聚集的行动。
