lexical_decisions:
- source_word: στῆθι
  choice: 要站
  rationale: 不定过去时命令语气要求耶路撒冷站立、就位；“要站”直接承接随后“看看”的命令，也比“兴起”少一层原文未明说的动作含义。
- source_word: ἐφʼ ὑψηλοῦ
  choice: 在高处
  rationale: 指可供眺望的较高位置。“在高处”是自然的现代汉语，保留空间意义，又不把它具体化为某一座山或建筑。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα泛指子女或后裔，并不限于男性；“儿女”既符合对耶路撒冷的拟人称呼，也自然涵盖其全体人民。
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: 从东方和西方
  rationale: 两个复数名词在此表示方位或地域；汉语以“东方和西方”简洁表达，不必机械保留复数形式。
- source_word: συνηγμένα
  choice: 被……聚集
  rationale: 完成时被动分词描述儿女已经被聚拢的状态；采用被动结构，以主为施事者，忠实保留原句关系。
- source_word: εἰς ἅπαξ
  choice: 在一起
  rationale: 这个凝缩短语在语境中可表达共同汇聚或同时汇聚。“在一起”自然突出合一聚集，又避免“突然间”或“一劳永逸”等过强含义；其可能的同时性另见脚注。
- source_word: Κυρίου
  choice: 主
  rationale: 前置词ἀπό在被动结构中可表示施事者或来源；译作“被主……聚集”清楚呈现主是聚集者，同时不添加原文没有的专名。
