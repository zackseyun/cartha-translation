  text: 耶路撒冷啊，站在高处，看你的儿女从东方和西方被主聚集在一起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集在一起”也可译作“一同聚集”或“同时聚集”。原文短语可侧重共同汇聚，也可侧重同时发生。
