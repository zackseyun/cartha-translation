  text: Do not lay your hand heavily upon us, so that we may not sin under compulsion.
translation:
  language: zh_hans
  text: 求你不要把你的手重重地压在我们身上，免得我们迫于无奈而犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你不要使你的手沉重地压在我们身上，免得我们出于不得已而犯罪。”
    reason: 保留βαρύνῃς较直译的使役表达，以及δι’ ἀνάγκην“由于必要、出于不得已”的词义可能。
lexical_decisions:
- source_word: βαρύνῃς
  choice: 重重压
  rationale: 该动词有“使沉重、加重”之意；与“手”连用时译作“重重压”既保留原文的重量意象，也自然表达沉重施压。
- source_word: χεῖρά
  choice: 手
  rationale: 保留原文具体的“手”这一形象；在经文语境中也可使人联想到施加的力量或管教，但不在正文中将其窄化。
- source_word: ἐφʼ ἡμᾶς
  choice: 在我们身上
  rationale: 与“手重重压”构成自然的汉语搭配，并保留介词短语所表达的落在说话者身上的压力。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达否定目的或预期结果，同时保留前后两句的依存关系。
- source_word: διʼ ἀνάγκην
  choice: 迫于无奈
  rationale: ἀνάγκη可指必要、强制或无法避免的压力；“迫于无奈”在现代汉语中自然地表达受情势逼迫，却不主张犯罪因此失去责任。
- source_word: ἁμάρτωμεν
  choice: 我们……犯罪
  rationale: 准确表达第一人称复数及其在ἵνα μή之后的否定目的或结果含义。
theological_decisions:
- issue: 沉重压力与犯罪之间的关系
  choice: 译作“免得我们迫于无奈而犯罪”
  alternative: “免得我们因势所迫，非犯罪不可”
  rationale: 原文承认ἀνάγκη所带来的逼迫或必要性，却没有明确断言人的责任被完全取消；所选译法保留这种张力，避免把经文解释为绝对决定论。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“求你”补出希腊语否定祈使在汉语中的恳求色彩；“手”与“重压”保留原文意象。脚注标记已置于正文句末。
