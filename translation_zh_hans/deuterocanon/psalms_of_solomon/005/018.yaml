  text: Blessed is the one whom God remembers with measured sufficiency[a][b].
translation:
  language: zh_hans
  text: 蒙上帝按适当的分量眷念的人有福了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝在适度的充足中所记念的人有福了。”原文的介词短语结构凝练，其修饰关系可有不同理解。
    reason: 保留 ἐν συμμετρίᾳ αὐταρκίας 的较形式表达及其句法含混。
  - marker: b
    text: “充足”所译的希腊词也可指“知足”，或更直译为“自足”。
    reason: 说明 αὐτάρκεια 的词义范围，而不在正文中加入原文未明说的施予或使役意思。
lexical_decisions:
- source_word: μακάριος
  choice: 有福了
  rationale: 这是诗篇和祝福宣告中惯用的表达，既保留宗教语域，也比“快乐”或“幸运”更贴合原文。
- source_word: οὗ
  choice: ……的人
  rationale: 属格关系代词受 μνημονεύει 支配；汉语采用关系分句后接“的人”，自然地保留所指对象。
- source_word: μνημονεύει
  choice: 眷念
  rationale: 该词可表示“记念、顾念”。此处上帝是主语，“眷念”既包含记得，也自然传达关怀之意，而不把具体施予内容说得过满。
- source_word: ἐν συμμετρίᾳ
  choice: 按合宜的分量
  rationale: συμμετρία 表示相称、适度或适当的尺度；此译保留“合乎尺度”的含义，避免仅译作笼统的“适量”。
- source_word: αὐταρκίας
  choice: 使他知足
  rationale: αὐτάρκεια 可指充足、自足或知足。结合上帝的眷念，“使他知足”以自然汉语表达从上帝而来的够用状态，并避免暗示人不依赖上帝。
theological_decisions:
- issue: αὐταρκίας 与上帝作为 μνημονεύει 主语之间的关系
  choice: 理解为上帝按合宜分量使人处于够用、知足的状态
  alternative: 理解为人的内在知足，或更直译为“自足”
  rationale: 原文短语结构凝练，未明说“赐予”，因此正文以“使他知足”表达语境所暗示的结果，同时用脚注保留较贴近形式、也更含混的译法；避免“自足”被误解为脱离上帝的独立自主。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。正文适度展开高度凝练的希腊语结构，使祝福宣告易懂；脚注保留原句较直译的结构以及 αὐταρκία 在“知足、充足、自足”之间的语义张力。
