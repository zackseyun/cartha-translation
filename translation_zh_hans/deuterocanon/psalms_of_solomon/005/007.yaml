  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
translation:
  language: zh_hans
  text: 我们遭受患难时[a]，必呼求援助；你不会拒绝我们的恳求[b]，因为你是我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们在患难中，必呼求你帮助我们。”
    reason: lexical_alternative
  - marker: b
    text: “恳求”也可译为“祈求”或“请求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: 我们遭受苦难时
  rationale: ἐν 加带冠词的不定式在此表示时间；θλίβεσθαι 是被动式，表达遭受患难或压迫。译为“遭受苦难时”既保留被动意味，也不把苦难限定为某一种迫害。
- source_word: ἐπικαλεσόμεθα
  choice: 必呼求
  rationale: 将来时表达诗人群体在患难中的确信或决意；“呼求”自然呈现向上帝求告的祷告语境。
- source_word: εἰς βοήθειαν
  choice: 帮助
  rationale: εἰς βοήθειαν 表明呼求所指向的援助；与“呼求”组合为“呼求帮助”，简洁且符合现代汉语。
- source_word: οὐκ ἀποστρέψῃ
  choice: 不会拒绝
  rationale: ἀποστρέφω 本有“转开、使离开”之意，在宾语为恳求时指不予理会或拒绝。汉语“不会拒绝”清楚表达语境中的关系性含义。
- source_word: τὴν δέησιν ἡμῶν
  choice: 我们的恳求
  rationale: δέησις 指出于需要而发出的迫切请求；“恳求”既有祈求的迫切感，又比泛称“祷告”更准确。
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: 因为你是我们的上帝
  rationale: ὅτι 在此说明确信上帝垂听的根据；“因为”明确保留因果关系，σὺ 的强调意味由直接称呼“你”自然体现。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必呼求”保留希腊文将来时所含的确信或决意；分号呈现呼求与上帝回应之间紧密而有层次的关系。所有代词依普通现代汉语写作习惯处理，不以特殊字形加入原文没有明示的敬称。
