  yaml_path: translation/deuterocanon/psalms_of_solomon/005/009.yaml
  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: zh_hans
  text: 如果你不使我们回转[a]，我们不会远离[b]，反而要到你那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我们回转”也可译作“恢复我们”或“把我们带回来”。
    reason: lexical_alternative
  - marker: b
    text: “不会远离”也可译作“不会退避”或“不会保持距离”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: 即使……不
  rationale: 此处若机械译作“如果……不”，与后句“我们也不会远离，反而要到你那里去”的让步意味衔接不够自然；“即使……不”保留条件形式，并清楚呈现说话者无论如何都要归向神的语气。
- source_word: ἐπιστρέψῃς ἡμᾶς
  choice: 使我们回转
  rationale: ἐπιστρέφω以“我们”为宾语，可指使人转回、带回或复兴。“使我们回转”保留方向性的核心意象，也避免把它限定为地理上的带回或特定教义意义上的归信。
- source_word: οὐκ ἀφεξόμεθα
  choice: 我们也不会远离
  rationale: ἀπέχομαι在此表示保持距离、离开或退避；“不会远离”与随后“到你那里去”形成直接而自然的对照。
- source_word: ἀλλʼ
  choice: 反而
  rationale: ἀλλά在此引出强烈转折；“反而”比单纯的“但”更清楚地表达前后行动的对照。
- source_word: ἐπὶ σὲ ἥξομεν
  choice: 要到你那里去
  rationale: ἥκω表示来到、抵达；ἐπί加宾格在此指向对象。“到你那里去”保留趋向神的关系性和方向性，同时符合现代汉语表达。
theological_decisions:
- issue: ἐπιστρέψῃς是否应译成带有明确归信教义色彩的措辞
  choice: 使我们回转
  alternative: 使我们复兴；使我们归信；把我们带回来
  rationale: 希腊文本表达的是神使人转回，却未明确规定这是属灵复兴、悔改归信还是处境上的恢复。因此采用较开放的“使我们回转”，保留诗句本身的神学张力。
- issue: 条件句与后句之间的逻辑关系
  choice: 译作让步意味的“即使……不”
  alternative: 如果你不……；除非你……
  rationale: 后句不是说在神不使他们回转时便拒绝靠近，反而宣告仍不远离并要来到神面前。“即使”在中文中较准确地传达这种逆势坚持，同时不改变原文否定条件的内容。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祈祷语体。句式简洁，保留“回转—远离—到你那里去”的方向意象和内在张力；不加入原文未明说的悔改、归信或地理归返等限定。
