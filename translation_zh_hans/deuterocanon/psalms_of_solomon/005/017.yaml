  text: 主啊，你的怜悯以恩慈临到全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  choice: 怜悯
  rationale: ἔλεος指向对困苦者所施的怜恤与慈悲；“怜悯”在现代汉语中自然庄重，也不额外加入其他词汇才明确表达的圣约含义。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 遍及全地
  rationale: ἐπί接宾格在这里表达延展至整个大地的范围；“遍及全地”既保留普遍范围，也比直译为“在全地之上”更符合现代汉语。
- source_word: Κύριε
  choice: 主啊
  rationale: Κύριε是直接呼语；“主啊”自然保留呼告语气，并符合庄重的诗歌体。
- source_word: ἐν χρηστότητι
  choice: 以恩慈
  rationale: χρηστότης可指恩慈、良善或仁厚；“以恩慈”保留其关系性和施惠色彩，并让介词短语表达怜悯遍及全地的方式或特质。
- source_word: '[implied copula / verbal relation]'
  choice: 遍及
  rationale: 希腊文为无显式动词句。汉语用“遍及”自然表达ἐπί加宾格所含的延展关系，避免生硬补入“是”。
theological_decisions:
- issue: 怜悯覆盖范围的普遍性
  choice: 保留“全地”
  alternative: 弱化为“各地”或“世上许多人”
  rationale: πᾶσαν τὴν γῆν明确指整个大地；译文保留这一广阔范围，不对其神学含义作进一步限定。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“主啊”前置，使汉语呼告自然；“以恩慈”保留原文末尾介词短语与“怜悯”及其施行方式之间可能存在的语义张力。
