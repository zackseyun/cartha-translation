  text: But if I cry out to you[a], do not be silent to me.
translation:
  language: zh_hans
  text: 但我若向你呼求[a]，求你不要对我缄默。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“但我若已经向你呼求，求你不要默然略过我。”
    reason: 保留κεκραγέναι的完成时形式，以及παρασιωπήσῃς可能含有“默然略过”的词义。
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 但……若
  rationale: 保留ἐὰν的条件意味和δέ轻微的转折、承接作用；现代汉语中“但我若”简洁而庄重。
- source_word: κεκραγέναι με
  choice: 我……呼求
  rationale: κεκραγέναι形式上是κράζω的完成时不定式，με是不定式的逻辑主语；此处希腊文结构凝练，汉语用限定式“我呼求”较自然，而脚注保留其完成体的字面可能。
- source_word: πρὸς σέ
  choice: 向你
  rationale: 祷告语境中πρός加人称宾语表示呼求的指向，译作“向你”自然准确。
- source_word: μὴ παρασιωπήσῃς
  choice: 求你不要……缄默
  rationale: παρασιωπάω可指保持沉默或默然略过；“缄默”保留沉默这一核心意象，“求你”则自然呈现希腊语否定祈使/禁止式的祷告语气。
- source_word: ἀπʼ ἐμοῦ
  choice: 对我
  rationale: 字面为“从我”，但与παρασιωπάω连用时所表达的是相对于祈祷者保持沉默；“对我”符合现代汉语搭配，又不过度解释为“忽视我”。
