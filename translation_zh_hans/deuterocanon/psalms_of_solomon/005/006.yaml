base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/006.yaml
  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: zh_hans
  text: 因为人和他从你所得的份额都在天平上[a]；他不会有所加添，以致超过你的裁定[b]，上帝啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都受衡量。”
    reason: ἐν σταθμῷ可保留为具体的天平图像，也可概括为处于受衡量的状态。
  - marker: b
    text: 或译：“他不会加添什么，以致超过你的判决。”
    reason: προσθήσει可译为“加添”，κρίμα可译为“判决”；“什么”仅使汉语中未明说的宾语自然显出，并不限定其内容。
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 人
  rationale: 原文为单数，并由后面的单数代词呼应；中文“人”既保留个体性的表达，也可自然承担代表全人类的泛指意义。
- source_word: ἡ μερὶς αὐτοῦ
  choice: 他的份额
  rationale: μερίς指分得或获派的一份；“份额”既保留分配之意，也适合本句称量与限度的意象。
- source_word: παρὰ σοῦ
  choice: 从你所得的
  rationale: παρά与属格σοῦ连用，基本意义是“从你而来”，不是“在你面前”；此处将其自然地连于人的份额，同时不否认整个人及其所得皆受上帝支配的语境。
- source_word: ἐν σταθμῷ
  choice: 在天平上
  rationale: σταθμός在此唤起称量的具体图像；“在天平上”比抽象的“按重量”更忠实保留隐喻。
- source_word: οὐ προσθήσει
  choice: 他不会加添
  rationale: προστίθημι本义为“添加、加添”；不擅自补出希腊文未明说的宾语。将来式在格言语境中译作“不会”，表达受限的结果。
- source_word: τοῦ πλεονάσαι
  choice: 以致超过
  rationale: 属格不定式说明加添所趋向的结果或目的；“以致超过”保留其与限量、裁定相关的意义。
- source_word: τὸ κρίμα σου
  choice: 你的裁定
  rationale: κρίμα可指审判、判决或裁定；此处与天平和不可逾越的限度相连，“裁定”自然表达上帝所定的分量，同时避免把含义缩窄为定罪。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 形式虽为主格，但在祷告结尾作呼语；现代汉语用“上帝啊”明确表达直接称呼。
theological_decisions:
- issue: ἄνθρωπος的单数与泛指作用
  choice: 译作单数形式的“人”，并以“他”呼应
  alternative: 译作“人类”或“一个人”
  rationale: “人类”会抹去原文的单数构造，“一个人”又可能过度强调某个不特定个体；“人……他”较好地保留代表性单数及其神学张力。
- issue: 人是否能够越过上帝的κρίμα
  choice: 保留“不会加添，以致超过”的陈述方式
  alternative: 译作“不能增加，超过你的裁定”
  rationale: 原文使用将来陈述οὐ προσθήσει，而非明确的能力动词；因此不将其解释性强化为绝对能力上的“不可能”，让读者保留对结果、限度或命定之意的判断空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“天平”“份额”“裁定”共同维持原文的称量、分配和审断意象；不把将来陈述改写为能力判断，也不把代表性的单数“人”改成抽象的“人类”。
