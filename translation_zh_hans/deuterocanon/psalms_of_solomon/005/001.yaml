  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
translation:
  language: zh_hans
  text: 主啊，上帝！我要欢欣地赞美你的名，在那些明白你公义的审判的人中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: 主上帝啊
  rationale: 将呼格 Κύριε 与同位称号 ὁ θεός 合并为自然、庄重的中文直接称呼；“啊”明确祷告中的呼语。
- source_word: αἰνέσω
  choice: 我要……赞美
  rationale: 保留希腊语将来时所表达的意愿或宣告，同时符合现代汉语习惯。
- source_word: τῷ ὀνόματί σου
  choice: 你的名
  rationale: 保留圣经中“名”的表达，不将其解释性展开为声誉或所启示的品格。
- source_word: ἐν ἀγαλλιάσει
  choice: 欢然
  rationale: 表达喜乐、雀跃地赞美的方式；用词简洁而庄重，避免过度书面化的“以欢腾”。
- source_word: ἐν μέσῳ
  choice: 在……中间
  rationale: 贴近原文的空间与群体性表达，也自然呈现公开共同赞美的场景。
- source_word: ἐπισταμένων
  choice: 明白……的人
  rationale: ἐπίσταμαι 可指知道、理解或熟悉；此处“明白”适合以神的判决为宾语，并保留认知层面的含义。
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: 你公义的判决
  rationale: κρίματα 指司法性的裁断、判决或审判行动；δίκαια 强调这些判决的公正与合乎正义。“公义的判决”保留其法律与神学色彩。
