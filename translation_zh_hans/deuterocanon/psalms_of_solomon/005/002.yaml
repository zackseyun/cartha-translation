  text: For you are kind and merciful[a], the refuge of the poor.
translation:
  language: zh_hans
  text: 因为你[a]仁慈、满有怜悯，是穷人的避难所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特印本此处作“σὺ χρηστός”（“你仁慈”）；所给电子转录作ἐχρηστὸς，应为转录异常。
    reason: 说明译文中“你”的依据，并交代所给数字希腊文本与斯威特印本之间的转录差异。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出前文陈述的理由；“因为”在现代汉语中自然地保留其解释、因果作用。
- source_word: χρηστός
  choice: 仁慈
  rationale: 这里描述上帝以善意恩待人的品格；“仁慈”既保留道德上的良善，也传达待人的温厚，比宽泛的“良善”更贴合语境。
- source_word: ἐλεήμων
  choice: 怜悯
  rationale: 该词指向有需要者施以怜恤；“怜悯”直接、庄重，也保留其神学分量。
- source_word: καταφυγή
  choice: 避难所
  rationale: 原词表示逃避危险、寻求庇护之处；“避难所”保留原有地点隐喻，不将其解释性地改写为“保护者”。
- source_word: τοῦ πτωχοῦ
  choice: 穷人的
  rationale: πτωχός指贫穷、困乏的人。希腊文为单数，但此处具有泛指意味；汉语“穷人的”可以自然表达这一集合性含义。
theological_decisions:
- issue: “避难所”与前面形容词的句法关系
  choice: 将“你”视为“仁慈又怜悯”的主语，并将“穷人的避难所”译为同位性表述
  alternative: 将“穷人的避难所”视为主语，即“穷人的避难所仁慈又怜悯”
  rationale: χρηστός和ἐλεήμων为阳性，而καταφυγή为阴性，因此两个形容词并不与“避难所”构成语法一致；斯威特印本所读σὺ也明确指出第二人称“你”是主语。此译法保留“避难所”作为对“你”的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“仁慈又怜悯”保持两个并列品格词的区分；“避难所”保留诗篇式庇护隐喻。
