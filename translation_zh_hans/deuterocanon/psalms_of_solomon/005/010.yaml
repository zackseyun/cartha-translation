  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: zh_hans
  text: 因为我若饿了，便会向你呼求，神啊；你必赐给我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“你必给我”；原文没有说明所给的是什么。
    reason: 说明原文宾语缺省，并保留其语义开放性。
lexical_decisions:
- source_word: πεινάσω
  choice: 我若饿了
  rationale: ἐὰν加不定过去时虚拟语气表达将来可能发生的情况。“我若饿了”是自然的现代汉语，也不强行把该动词解释为明确的起始义“开始饥饿”。
- source_word: κεκράξομαι
  choice: 就要向你呼求
  rationale: κράζω含有高声呼喊、迫切求告的意味；“呼求”既保留其强度，也符合诗歌中向神祈求的语境。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 该形式虽带冠词并采用主格形态，在圣经希腊语中却发挥呼格作用；“神啊”明确表达直接称呼。
- source_word: δώσεις μοι
  choice: 你必赐给我
  rationale: 直译为“你将给我”，但原文没有说明所赐之物。“赐给我”保留动词“给予”的基本意义和宾语缺省，不把它扩展解释为“供应我的需要”。
theological_decisions:
- issue: 神所赐之物是否明确为食物
  choice: 正文保留未说明的受事，只译作“赐给我”
  alternative: 译作“赐食物给我”或“供应我”
  rationale: 饥饿的上下文暗示所需可能是食物，但希腊原文没有明说宾语；保留省略可避免把语境推断写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“呼求”保持诗歌祈祷的语体；“神啊”体现直接称呼。分号呈现条件句后的回应，并使末句中原文未说明的宾语保持醒目。
