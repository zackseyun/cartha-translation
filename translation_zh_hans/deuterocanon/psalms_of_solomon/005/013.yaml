  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: zh_hans
  text: 上帝啊，你养活君王、掌权者和众民；穷人和贫寒人的盼望若不是你，主啊，还能是谁呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: 养活
  rationale: 该词在此指供给食物、维持生存；“养活”自然明确，也保留上帝供应各阶层之人的含义。
- source_word: ἄρχοντας
  choice: 掌权者
  rationale: 泛指执政或居领导地位的人；“掌权者”比限定于某种官职的译法更贴近原文范围。
- source_word: λαοὺς
  choice: 众民
  rationale: 复数形式泛指各群体、各民族或民众；“众民”简洁保留其集合性与复数意味。
- source_word: πτωχοῦ καὶ πένητος
  choice: 穷人和贫寒人
  rationale: 用两个相近而不完全相同的称呼保留原文并列：πτωχός侧重贫穷匮乏，πένης常指生活拮据、必须劳作维生的人。
- source_word: ἡ ἐλπὶς
  choice: 盼望
  rationale: 既可表达所怀的希望，也可指所倚靠、所盼望的对象，保留原句的神学张力。
theological_decisions:
- issue: 反问句中上帝作为穷人盼望的唯一对象
  choice: “若不是你……还能是谁呢？”
  alternative: “除了你以外，还有谁呢？”
  rationale: 保留希腊文 εἰ μὴ σύ 的排他性反问，同时用现代汉语自然表达，不额外扩展为“救主”或“供应者”等解释。
- issue: 英语咨询文本重复“君王、统治者和众民”并增添“sustain”
  choice: 不保留重复，仅译一次 τρέφεις
  alternative: 按英语文本重复一次并译作“维持”
  rationale: 现存希腊原文只有一个谓语 τρέφεις 和一组宾语；重复及第二个谓语没有原文依据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号连接陈述与反问，保留诗句推进。称呼语“上帝啊”“主啊”依原文位置呈现，不使用宗派化专名。
