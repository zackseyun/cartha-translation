  yaml_path: translation/deuterocanon/psalms_of_solomon/005/022.yaml
  text: Blessed be the glory of the Lord, for he himself is our king.
translation:
  language: zh_hans
  text: 愿主的荣耀蒙颂赞，因为他亲自是我们的王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένη
  choice: 愿……蒙颂赞
  rationale: 阴性形容词与“荣耀”一致，在此构成省略系词的颂赞公式；译作“愿……蒙颂赞”既表达祝颂语气，也比静态的“有福”更符合现代汉语对神圣荣耀的颂赞表达。
- source_word: δόξα
  choice: 荣耀
  rationale: 直接保留该词关于神圣荣光、尊荣及受赞美之显荣的语义，也是现代汉语宗教文体中自然稳妥的对应。
- source_word: Κυρίου
  choice: 主的
  rationale: 原文为希腊语 κύριος 的属格，并非直接出现希伯来神名；因此译作“主”，不作“耶和华”。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后句对前句颂赞的原因说明，在现代汉语中自然清楚。
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 保留强势代词的强调作用，表明作我们君王的正是主本人；不增添“唯独”的排他含义。
- source_word: βασιλεὺς
  choice: 王
  rationale: 这是该名词最直接的王权称谓；“我们的王”简洁庄重，也忠实呈现表语结构。
theological_decisions:
- issue: αὐτὸς 的强调是否含有排他性
  choice: 他亲自
  alternative: 唯独他
  rationale: 希腊语强调主本人，却未明说“唯独”；译文保留强调而不额外加入排他性的神学断言。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句式保留原文先颂赞、后说明理由的结构；“蒙颂赞”用于荣耀这一抽象主语，避免把 εὐλογημένη 误解成通常用于人的“有福”。
