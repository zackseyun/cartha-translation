  text: And if they are hungry[a], they will lift up their faces to you.
translation:
  language: zh_hans
  text: 他们若饥饿，就必向你仰起脸来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向你仰起脸来”是指转向神求告、仰望并倚靠他。
    reason: cultural_note
lexical_decisions:
- source_word: πεινάσωσιν
  choice: 饥饿
  rationale: 不定过去时虚拟语气与ἐὰν构成条件句，表达一般性的未来条件；“饥饿”自然准确，不额外强化为“饿极了”。
- source_word: ἀροῦσιν
  choice: 必……仰起
  rationale: ἀροῦσιν是αἴρω的将来时，基本义为“举起、抬起”；结合“脸”和朝向神的语境，“仰起”既保留具体动作，也符合现代汉语表达。
- source_word: πρόσωπον αὐτῶν
  choice: 脸
  rationale: 希腊文用单数πρόσωπον配复数所属代词，表示他们各人的脸；汉语用集合性的单数“脸”自然，并贴近原文形式。
- source_word: πρὸς σέ
  choice: 向你
  rationale: πρός在此表达方向；“向你”清楚保留面向、求告的方向感，而不把隐含意义直接写入正文。
theological_decisions:
- issue: “仰起脸”是否应直接解释为向神求告或倚靠
  choice: 正文保留“向你仰起脸来”的形象表达，并用脚注说明其语用含义
  alternative: 正文译作“就必转向你求助”
  rationale: 原文以具体动作表达求告或倚靠；保留意象可避免把可能包含的祈求、仰望和依赖过早限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“若……就必……”清楚呈现ἐὰν条件结构与将来时；“仰起脸”保留原文的身体意象。脚注标记置于完整句末，说明整项表达的含义。
