  text: And who will take from all that you have made, unless you give it?
translation:
  language: zh_hans
  text: 你若不赐予，谁能从你所造的万物中取得什么呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λήψεται
  choice: 能……取得
  rationale: 保留动词“取、得到”的基本意义；配合反问语气加入“能”，使现代汉语自然表达其隐含的不能之意。
- source_word: ἀπὸ πάντων ὧν ἐποίησας
  choice: 从你所造的万物中
  rationale: πάντων ὧν 指神所造的一切；译为“万物”简洁庄重，并以“从……中”对应 ἀπό。
- source_word: ἐὰν μὴ σὺ δῷς
  choice: 你若不赐予
  rationale: 保留条件结构及强调的主语 σύ；“赐予”符合向神说话的语域，同时不补出希腊文未明说的宾语。
theological_decisions:
- issue: 受造物所得与神赐予之间的关系
  choice: 以反问保留经文所表达的绝对依赖：“你若不赐予，谁能……？”
  alternative: 直陈为“若非你赐予，无人能取得任何东西”
  rationale: 原文采用反问，宜保留其修辞力度，也不把经文扩展成解释性陈述。
- issue: δῷς 的省略宾语
  choice: 不补明宾语，仅译“赐予”
  alternative: 译为“赐下它”或“把什么赐给他”
  rationale: 希腊文没有明示所赐之物；不补宾语可保存原文的开放性，并避免把 πάντων 或不定代词强行指定为直接宾语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将条件从句前置，使中文反问自然；“取得什么”传达 τίς 与上下文所隐含的不定所得，同时不将其解释为所有权、供应或恩典等更具体的神学概念。
