  text: If a man has an abundance[a], he sins.
translation:
  language: zh_hans
  text: 人若过于富足[a]，就犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人若拥有过多，就犯罪。”
    reason: 词义备选；ὑπερπλεονάσῃ可指富足超过适当限度，也可表达拥有多于所需。
lexical_decisions:
- source_word: ἐὰν
  choice: 若
  rationale: 引出条件句；“若”简洁自然，不额外加入反复发生的意味。
- source_word: ὑπερπλεονάσῃ
  choice: 富足过度
  rationale: 该动词表示超过适当限度、拥有多于所需；“富足过度”既保留“丰足”之意，也明确呈现前缀所含的过量意味，而不将其解释为贪婪等内在动机。
- source_word: ὁ ἄνθρωπος
  choice: 人
  rationale: 在格言式条件句中作泛指，现代汉语以“人”自然地涵盖一般的人，不必机械体现希腊语冠词。
- source_word: ἐξαμαρτάνει
  choice: 就犯罪
  rationale: 表达明确的道德过犯；“就”自然衔接条件与结果，同时不夸大该动词可能具有的强化色彩。
theological_decisions:
- issue: 是否把“超过限度的富足”进一步解释为贪婪或贪财
  choice: 保留关于拥有过量财富与犯罪之间的直接陈述
  alternative: 人若贪得无厌，就犯罪。
  rationale: 希腊文陈述的是超过限度或拥有过多，并未明确把罪限定为内心的贪婪；译文保留原句的道德张力，不替作者缩窄含义。
translation_notes:
  register: 采用简洁、格言式的现代标准汉语。“富足过度”略带庄重感，并保留原文对“丰足超过限度”的强调；脚注提供更口语而直接的译法。
