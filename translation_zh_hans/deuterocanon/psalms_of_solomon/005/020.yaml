  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: zh_hans
  text: 在公义中，有适量的一份就够了；其中有主的赐福，使人在公义中得以饱足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: 就够了
  rationale: 表达“足够、充足”的判断，符合现代汉语习惯，也保留原文知足的语气。
- source_word: τὸ μέτριον
  choice: 适量的一份
  rationale: μέτριον 指适度、不多不少之物；“一份”使名词化表达在汉语中自然，同时不把它具体限定为钱财或食物。
- source_word: ἐν δικαιοσύνῃ
  choice: 在公义中
  rationale: 原文两次使用同一短语，译文相应保留，以维持其伦理与神学张力，不擅自窄化为“正当所得”或“正直生活”。
- source_word: ἡ εὐλογία Κυρίου
  choice: 主的赐福
  rationale: 自然表达属主而来的祝福；Κυρίου 无冠词，语境中仍明确指主。
- source_word: εἰς πλησμονὴν
  choice: 使……得以饱足
  rationale: εἰς 表结果或趋向，πλησμονή 可指满足、饱足；此译避免误作物质“丰盛”，并在汉语中清楚连接前句。
theological_decisions:
- issue: “公义”与物质份量、满足之间的关系
  choice: 保留两次“在公义中”，并把末句译为“使人在公义中得以饱足”
  alternative: 将其解释为“以正当方式所得虽少，也胜过不义的丰盛”
  rationale: 原文并未明说比较对象，也未明确限定为财富来源；保留重复和开放性，避免加入经文没有陈述的伦理推论。
- issue: εἰς πλησμονὴν 的语义
  choice: 得以饱足
  alternative: 达到丰盛／丰裕
  rationale: “饱足”既可表示充分满足，又不必承诺物质富足，较能保存本句中“适量”与“充足”并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文分号式推进及“在公义中”的重复；不沿用英语咨询文本中明显的机械重复。
