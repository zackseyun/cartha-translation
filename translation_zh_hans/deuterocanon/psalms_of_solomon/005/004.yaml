translation:
  language: zh_hans
  text: 因为没有人会从强者那里夺取战利品。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”或译“掠物”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“因为他不会从强者那里夺取战利品。”希腊文没有明说主语。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: λήψεται
  choice: 能……夺取
  rationale: 这是 λαμβάνω 的将来时；在夺取战利品的语境中译作“夺取”自然明确。汉语加入“能”表达这句格言式陈述所含的实际不可能性，同时不改变否定范围。
- source_word: σκῦλα
  choice: 战利品
  rationale: 该词指从敌人处取得的掠夺物；“战利品”是现代汉语中清楚、庄重且符合语境的说法。“掠物”可作为较贴近词形的备选。
- source_word: παρὰ
  choice: 从……那里
  rationale: παρά 与属格连用表示来源；“从……那里”准确传达战利品取自何人。
- source_word: ἀνδρὸς δυνατοῦ
  choice: 强者
  rationale: 短语字面为“强有力的男人”。此处用于格言式类比，“强者”简洁自然，并保留力量或能力的重点；若强调阳性单数，也可译“强壮的人”。
theological_decisions:
- issue: λήψεται 没有明说的主语
  choice: 没有人能……
  alternative: 他不会……
  rationale: 希腊文第三人称单数动词没有明示主语，在此可作不定人称理解。译作“没有人”避免引入缺少先行词的“他”，但脚注保留按明示第三人称理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强者”适合格言式表达；正文保留两个脚注标记，以呈现词义选择和无明示主语所造成的歧义。
