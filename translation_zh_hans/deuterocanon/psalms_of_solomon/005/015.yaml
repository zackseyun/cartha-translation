  yaml_path: translation/deuterocanon/psalms_of_solomon/005/015.yaml
  text: A man's kindness is sparing and for tomorrow; and if he repeats it without grumbling[a], even at this you will marvel.
translation:
  language: zh_hans
  text: 人施恩惠总是有所保留，还拖到明天[a]；他若再次施予而不抱怨，连这事你也会惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人施恩惠总是有所保留，并且是‘明天’。”希腊文此处仅简略地出现“明天”，句法有所省略；它可能暗示把施予拖延到明天，但原文没有明确说出这一点。
    reason: 说明αὔριον附近的省略结构，并保留“明天”是否明确表示延后的歧义。
lexical_decisions:
- source_word: χρηστότης
  choice: 恩惠
  rationale: 该词可指良善、仁厚或待人的善意；本句着眼于向人施予的善举，译作“恩惠”既自然，也能与后文“再次施予”衔接。
- source_word: ἀνθρώπου
  choice: 人的
  rationale: 保留希腊文单数属格的泛指用法；现代汉语以“人的”表达普遍的人性对照，无须额外标明性别。
- source_word: ἐν φειδῷ
  choice: 给得有限
  rationale: 此短语表示节省、克制或施予不多；“给得有限”传达分量受限的意思，又避免直接强化为“吝啬”。
- source_word: αὔριον
  choice: 留到明天
  rationale: 原文仅有“明天”，结构简略。正文以自然汉语补出可能暗含的延宕之意，同时用脚注说明原文的省略性。
- source_word: δευτερώσῃ
  choice: 再次施予
  rationale: 该动词意为第二次做同一件事；上下文所省略的行为是施惠，译文予以适度补明。
- source_word: γογγυσμοῦ
  choice: 抱怨
  rationale: “抱怨”是现代汉语中自然清楚的表达，可涵盖低声埋怨、不情愿地发牢骚等语义。
- source_word: θαυμάσεις
  choice: 你也会惊奇
  rationale: 直接保留第二人称单数和将来语气，并维持箴言式的反讽意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原句对人施惠有限、延迟且不情愿的尖锐观察。正文适度补足汉语必需的动词关系，但以脚注保留希腊文的简略和歧义。
