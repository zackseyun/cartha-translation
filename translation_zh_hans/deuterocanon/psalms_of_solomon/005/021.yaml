base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/021.yaml
  text: Those who fear the Lord rejoiced in good things[a], and your goodness is upon Israel[c][b], your kingdom.
translation:
  language: zh_hans
  text: 敬畏主的人因各样美好之事而欢喜[a]；你的美善临到以色列，在你的国度中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在各样美好之事中得了喜乐”或“因福乐而欢喜”。
    reason: lexical_alternative
  - marker: b
    text: “在你的国度中”对应原文的与格短语，其关系并不完全确定；也可理解为“借着你的统治”。另有解释将该短语与“以色列”相连，译作“以色列，你的国度”。
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: 欢喜
  rationale: 该不定过去时被动形式可表示“得以欢喜、被使之喜乐”；现代汉语用“欢喜”自然表达其结果，同时保留庆悦之意。
- source_word: οἱ φοβούμενοι Κύριον
  choice: 敬畏主的人
  rationale: 名词化分词指一群以敬畏上主为特征的人；“敬畏”兼具畏惧与尊崇的含义。
- source_word: ἐν ἀγαθοῖς
  choice: 因种种美好之物
  rationale: 中性复数形容词名词化，泛指各样美好的事物；ἐν在这里可表达处境或缘由，正文采用自然的因果表达，脚注保留另一种理解。
- source_word: ἡ χρηστότης σου
  choice: 你的美善
  rationale: χρηστότης可指良善、仁慈或恩惠；“美善”保留其较宽泛的道德与施惠含义，不把它限定为单纯的亲切。
- source_word: ἐπʼ Ἰσραήλ
  choice: 临到以色列
  rationale: ἐπί加宾格在此表达美善落在或施及以色列；“临到”符合现代汉语宗教诗歌的庄重语体。
- source_word: τῇ βασιλείᾳ σου
  choice: 在你的统治下
  rationale: 该短语为与格，不能在格上直接同Ἰσραήλ构成同位语；将其理解为范围与格，并把βασιλεία译作“统治”，既合语法，也比“在你的国度中”更自然。
theological_decisions:
- issue: τῇ βασιλείᾳ σου与前文的句法关系
  choice: 理解为范围：在你的统治下
  alternative: 理解为手段：“借着你的统治”；或较生硬地译作“在你的国度中”
  rationale: 希腊文使用与格，而Ἰσραήλ受ἐπί支配，故不宜直接将二者视为同位语“以色列——你的国度”。与格可表示范围，也可能表示手段；正文采用较自然的范围义，脚注保留句法上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“种种美好之物”刻意保留ἀγαθά的宽泛含义；末句调整语序，使汉语顺畅，同时以脚注说明希腊文与格短语的歧义。
