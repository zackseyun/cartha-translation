  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: zh_hans
  text: 你喂养飞鸟和鱼类；你赐雨给荒凉之地，使青草萌生，为要在旷野给一切生灵预备食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πετεινὰ
  choice: 飞鸟
  rationale: πετεινά泛指有翼的鸟类；“飞鸟”自然凝练，也保留其与飞行相关的词义色彩。
- source_word: τοὺς ἰχθύας
  choice: 鱼类
  rationale: ἰχθύας是“鱼”的复数；“鱼类”在与飞鸟并列并概括受造生物时较自然。
- source_word: τρέφεις
  choice: 喂养
  rationale: τρέφω指供给养分、养活；“喂养”既直接又符合本节具体的供应图景。
- source_word: ἐν τῷ διδόναι σὲ
  choice: 你降雨
  rationale: 该带冠词不定式可表示时间或方式。中文采用并列承接，让降雨具体说明上文的喂养方式，同时不把语法关系限定得过死。
- source_word: ὑετὸν ἐρήμοις
  choice: 降雨在荒凉之地
  rationale: ὑετός是雨，ἐρήμοις指荒芜、无人或干旱之处；译文保留其荒凉意象。
- source_word: εἰς ἀνατολὴν χλόης
  choice: 使青草萌生
  rationale: ἀνατολή本义为升起、长出，与χλόη连用指嫩草萌发；“使青草萌生”自然表达雨水带来的生长。
- source_word: ἑτοιμάσαι χορτάσματα
  choice: 为要……预备食物
  rationale: ἑτοιμάσαι是不定式，在此表达目的或预期结果；χορτάσματα指供食用、使之饱足之物。“食物”适合其供应“一切生灵”的广泛对象，也比仅用于牲畜的“饲料”更自然。
- source_word: ἐν ἐρήμῳ παντὶ ζῶντι
  choice: 在旷野给一切生灵
  rationale: ἐρήμῳ在此为单数，译作“旷野”；παντὶ ζῶντι范围广泛，“一切生灵”准确而庄重。
theological_decisions:
- issue: ἐν τῷ διδόναι的方式或时间关系
  choice: 以中文并列承接：“你喂养……；你降雨……”
  alternative: “你借着降雨……喂养……”或“当你降雨……”
  rationale: 希腊语结构可有方式或时间色彩；并列承接既让降雨解释神如何供应，又避免排除时间性的理解。
- issue: ἑτοιμάσαι表示目的还是结果
  choice: “为要……预备”
  alternative: “从而……预备”
  rationale: 不定式较自然地表达目的，但也可能带预期结果色彩；正文采用目的表达，不额外引入神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号呈现“喂养”与“降雨”的紧密逻辑关系；“荒凉之地”与“旷野”分别对应复数和单数的ἐρημος形式，避免不必要的机械重复。
