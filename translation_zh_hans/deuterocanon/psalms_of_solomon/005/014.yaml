base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
translation:
  language: zh_hans
  text: 而你必垂听[a]，因为除了你，谁会仁慈温和地在怜悯中张开手[b]，使卑微之人的心灵欢喜[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你必留心垂听”或“你必应允”；这个动词在祷告语境中可以含有垂听并回应的意思。
    reason: lexical_alternative
  - marker: b
    text: “张开手”是慷慨赐予、供应所需的形象说法。
    reason: cultural_note
  - marker: c
    text: 所给希腊文本的“卑微”在词形上与“心灵”不一致；这里按可能的原意译作“卑微之人的心灵”。若按它直接修饰“心灵”理解，也可译作“使卑微的心灵欢喜”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: 必垂听
  rationale: 该动词不只是听见，也常含留心听取、作出回应的意味；“垂听”适合祷告语境，并保留是否明确指“应允”的余地。
- source_word: χρηστός
  choice: 仁慈
  rationale: 在颂赞上帝的语境中，表达主动施恩、善待人的品格，比抽象的“良善”更贴近此处。
- source_word: ἐπιεικής
  choice: 温和
  rationale: 表达宽厚、克制而体恤人的态度，与“仁慈”并列自然，同时不把词义限定为司法上的宽免。
- source_word: εὐφρᾶναι
  choice: 使……欢喜
  rationale: 以目的或特征性行动表达不定式的作用，保持“仁慈又温和，能……使……欢喜”的句法联系。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 此处指人的内在生命；“心灵”在现代汉语诗歌与祷告语体中自然，也避免“灵魂”可能带入的后期体系化含义。
- source_word: ταπεινὸν
  choice: 卑微之人的
  rationale: 结合上下文及该处可能反映的属格读法，译为处境低微或谦卑者的心灵；脚注说明所给希腊文本在词形上的不规则，以免掩盖原文问题。
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: 张开你的手
  rationale: 保留形象鲜明的施予惯用语；中文也能自然理解为慷慨供应。
- source_word: ἐν ἐλέει
  choice: 在怜悯中
  rationale: 贴近希腊文介词结构，表达上帝张手施予是在怜悯中而行，并保持诗体庄重感。
theological_decisions:
- issue: ἐπακούω是否明确译成“应允”
  choice: 译作“垂听”
  alternative: 应允
  rationale: 祷告语境确有回应之意，但该动词仍以“听”为基本意象；不把经文所保留的语义幅度缩窄为必然采取某种具体行动。
- issue: ταπεινός所指是道德上的谦卑还是处境上的卑微
  choice: 采用兼具处境与身份意味的“卑微之人”
  alternative: 谦卑的人；受苦的人
  rationale: 该词可指低微、卑下，也可发展出谦卑之意；“卑微之人”比“谦卑的人”少作道德定性，又不擅自限定为受苦。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告诗体。“垂听”“怜悯”保留经文语感，但句法按现代汉语重组为一个连贯的反问句；不把回应祷告、谦卑或上帝施予的神学含义解释得超出希腊文。
