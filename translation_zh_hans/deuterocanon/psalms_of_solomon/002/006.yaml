  yaml_path: translation/deuterocanon/psalms_of_solomon/002/006.yaml
  text: Sons and daughters were in evil captivity[a], their necks in a seal[b], with a mark among the nations.
translation:
  language: zh_hans
  text: 儿女陷在残酷的囚禁中[a]；他们的颈项上有印记，在列国中带着标记[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残酷的”也可译作“悲惨的”“恶劣的”或“苦难的”。原词在这里形容被掳囚禁的严酷、痛苦境况，不一定专指道德上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“他们的颈项在印记中，在列国中处于有标记的状态。”希腊文意象十分压缩；前后两个有关标记的短语之间的具体关系并不明确，可能描绘俘虏或奴隶被公开盖印、烙记，或因某种标记而格外醒目。
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: 儿女
  rationale: 保留原文明确并列男性与女性后代的表达；现代汉语“儿女”自然、凝练，也没有泛化为不分性别的“孩子们”。
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: 陷于苦难的囚禁中
  rationale: αἰχμαλωσία表示被俘、受囚的境况；ποντηρά在此可指恶劣、悲惨或残酷。译作“苦难的”保留严重负面含义，同时避免把它限定为道德意义上的“邪恶”。
- source_word: ἐν σφραγῖδι
  choice: 有印封
  rationale: σφραγίς可指印、印章或盖印留下的印记。原文介词结构高度压缩，译文保留“印封”意象，而不武断确定具体是烙印、奴隶标记还是别种封记。
- source_word: ὁ τράχηλος αὐτῶν
  choice: 他们的颈项
  rationale: 按汉语集体表达保留“颈项”的单数形式，既贴近希腊文，也符合庄重的诗体语域。
- source_word: ἐν ἐπισήμῳ
  choice: 带着显眼的标记
  rationale: ἐπίσημος可表示有标记、醒目或显著；结合俘虏颈项上的印封，译作“显眼的标记”传达公开可辨与羞辱性的可能含义，但不直接收窄为“烙印”。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在列国中
  rationale: 直译为“在列国中”，符合流散、被掳及公开受辱的语境；不特定译作宗教术语“外邦人”。
