  text: She removed the headdress of glory that God had placed on her[a][b].
translation:
  language: zh_hans
  text: 她摘下了上帝给她戴上的荣耀头饰[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀的冠冕”。
    reason: 词义也可侧重王者或尊贵者所戴的冠饰。
  - marker: b
    text: 或译：“荣耀的头巾”。
    reason: μίτρα也可指缠裹或覆盖头部的头巾。
lexical_decisions:
- source_word: περιείλατο
  choice: 摘下了
  rationale: 该不定过去时中间语态自然表示她亲自把所戴之物取下；“摘下”符合头饰的搭配，也不额外加入强迫或暴力意味。
- source_word: μίτραν
  choice: 头饰
  rationale: μίτρα可指包头巾、头带或冠饰；这里所指是女性化的耶路撒冷所戴、象征尊荣的饰物。“头饰”既保留具体形象，也避免把较宽的词义限定为某一种式样。
- source_word: δόξης
  choice: 荣耀
  rationale: 保留属格表达所承载的尊荣与光彩意味；“荣耀头饰”在中文中简洁而庄重。
- source_word: περιέθηκεν αὐτῇ
  choice: 给她戴上的
  rationale: 原词表示放置在周围或戴在身上；对头饰而言，“给她戴上”是自然准确的中文，并表明这是上帝所赐的尊荣。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代标准普通话中清楚、庄重的常用译名。
theological_decisions: []
