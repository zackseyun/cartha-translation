  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: zh_hans
  text: 上帝啊，我必以正直的心称你为义[a]；因为在你的审判中有你的公义，上帝啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告你为义”，或“证明你是公正的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: 称你为义
  rationale: 该词为将来时主动语态第一人称单数，以“上帝”为宾语。译作“称你为义”既保留司法性语义，也避免让人误以为说话者使上帝成为义。
- source_word: ἐν εὐθύτητι καρδίας
  choice: 以正直的心
  rationale: 保留“心”和道德正直的意象，同时符合现代汉语表达。
- source_word: κρίμασιν
  choice: 审判
  rationale: 复数形式可指上帝各项审断或施行审判的作为；汉语集合性名词“审判”简洁自然，并保留司法语境。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: 此处指上帝在审判中体现的正直与公正；“公义”兼顾道德和司法含义，“正义”亦为可行译法。
theological_decisions:
- issue: 人“称上帝为义”的含义
  choice: 理解为承认或宣认上帝是义的
  alternative: 理解为使上帝成为义，或替上帝伸冤
  rationale: δικαιόω以“上帝”为宾语，在此不宜理解为说话者赋予上帝义；上下文强调上帝的公义本已存在于他的审判中。译文仍保留“称……为义”的司法色彩。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。重复保留两处“上帝啊”，以反映原文的呼语结构；“就在”呈现原文“在你的审判中有你的公义”的强调关系，而不把它过度解释为单纯的结果或彰显。
