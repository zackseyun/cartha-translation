  yaml_path: translation/deuterocanon/psalms_of_solomon/002/034.yaml
  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: zh_hans
  text: 他亲自作王，统管诸天，并审判君王和掌权者[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌权者”或译“首领”。
    reason: ἀρχάς在此可指执政者、首领或掌权者；正文采用较宽泛且能体现权柄的译法。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 明确保留强调代词的力度，突出作王者是他自己，而不弱化为普通的“他”。
- source_word: βασιλεὺς
  choice: 作王
  rationale: 此处名词无冠词，作表语使用；译为“作王”符合现代汉语表达，并保留其君王身份与统治含义。
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: 统管诸天
  rationale: ἐπί加属格在此表达管辖与权柄，而不只是所在位置；“诸天”保留希腊文复数。
- source_word: κρίνων
  choice: 并审判
  rationale: 将现在分词按汉语习惯译为并列谓语，保留其施行审判的含义，同时不额外限定时间或方式。
- source_word: ἀρχάς
  choice: 掌权者
  rationale: 与“君王”并列时，指具有统治权柄者；“掌权者”既清楚自然，也保留该词可能侧重权位或权柄的语义。
theological_decisions:
- issue: ἐπὶ τῶν οὐρανῶν所表达的统治范围
  choice: 表明他统管诸天
  alternative: 将其理解为“在天上作王”
  rationale: ἐπί加属格更自然地表达凌驾、管辖；如此翻译保留超越性的王权，也与下句审判地上统治者相呼应。
- issue: κρίνων与前句的语法和神学关系
  choice: 译作并列谓语“并审判”
  alternative: 译作附属分词“审判着”或“同时审判”
  rationale: 希腊文分词可描述这位王正在履行的职能；汉语用并列谓语较自然，同时不把它解释成与作王分离的行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他亲自”保留原文强调，“作王，统管诸天”以自然汉语表达王权所及的范围；句末分号对应原文未完的语势。
