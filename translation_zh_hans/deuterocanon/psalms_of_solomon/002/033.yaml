  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: zh_hans
  text: 他说：“我要作陆地和海洋的主。”他却不知道，神是伟大的，凭着自己强大的力量显为大能。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神是伟大的，在他自己强大的力量中是强有力的。”
    reason: “在……中”较贴近ἐν的字面表达；正文以“凭着……显为大能”使汉语更自然，同时保留原文对神能力的重复强化。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 这里是人的夸口，并非对神的称号；“主”自然保留了统治权的宣称。
- source_word: γῆς καὶ θαλάσσης
  choice: 陆地和海洋
  rationale: 这一对词构成陆地与海洋的全面对照；“陆地”比“地”更清楚地与“海洋”相对。
- source_word: οὐκ ἔγνω
  choice: 却不知道
  rationale: 直译其不知或未认识到的状态，并以“却”显出他夸口与神真实大能之间的反差。
- source_word: κραταιὸς
  choice: 施展大能
  rationale: κραταιός在此与后面的ἐν ἰσχύϊ相连，表达神凭其力量而强大有能；这样译成自然汉语，同时避免生硬重复“伟大、大能、大力”。
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: 凭他的大力
  rationale: ἐν可表达所凭借或体现的力量；“他的大力”保留代词、形容词“伟大”和ἰσχύς的力量含义。
theological_decisions:
- issue: ὁ θεὸς是否应译为带称号色彩的表述
  choice: 神是伟大的，凭他的大力施展大能
  alternative: 神是那位伟大而大能者
  rationale: 希腊文更自然地是在断言神的伟大和能力，与说话者的狂妄形成对照；不必增添称号式含义。
- issue: κραταιὸς ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ的句法关系
  choice: 将κραταιός理解为在神自己的大力中显为大能
  alternative: 神是伟大、有能力的，他的力量也是伟大的
  rationale: 所选译法保留κραταιός与ἐν ἰσχύϊ之间的紧密联系，也保留神以其大力为能力根基的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“作……的主”保留人物自称统辖陆海的夸口；后半句用“却”明确原文καί在语境中的转折效果。脚注标记置于相关末句之后。
