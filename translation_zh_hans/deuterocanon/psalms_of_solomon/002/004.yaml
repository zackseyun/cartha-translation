  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: zh_hans
  text: 因这些事，他说：“把它们丢到远离我的地方去；他荣耀的华美并没有使他们亨通。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他荣耀的华美”也可译作“它荣耀的华美”或“其荣耀的华美”；希腊语αὐτοῦ在这里可作“他的”或“它的”，其所指并不完全明确。
    reason: referential_ambiguity
  - marker: b
    text: 也可在“远离我的地方去”后结束引语，译作：“把它们丢到远离我的地方去。”他荣耀的华美并没有使他们亨通。另有抄本作“她的荣耀的华美”。
    reason: punctuation_and_textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: 因这些事
  rationale: 保留短语对上文所述之事的明确回指，不擅自把所指限定为某一种行为。
- source_word: εἶπεν
  choice: 他说
  rationale: 原文只用普通的说话动词及第三人称主语，没有明说说话者身份，译文同样保持克制。
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ’ ἐμοῦ
  choice: 把它们远远扔开，离开我
  rationale: “扔开”保留ἀπορρίπτω所含抛弃、拒绝的鲜明动作感；“远远……离开我”则传达μακρὰν ἀπ’ ἐμοῦ的空间力度。
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: 并没有使他们亨通
  rationale: εὐοδόω可表示使人顺利、兴盛或得益；“使他们亨通”较贴近其字面语义，并保留原句可能指外在兴盛的意味。
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: 他荣耀的华美
  rationale: “荣耀的华美”同时保留κάλλος与δόξα两个名词的审美和尊荣意味；主文将αὐτοῦ译作“他”，并以脚注说明其所指可能有歧义。
theological_decisions:
- issue: αὐτοῦ的指代
  choice: 他荣耀的华美
  alternative: 它荣耀的华美／其荣耀的华美
  rationale: 希腊语属格形式αὐτοῦ本身可对应阳性或中性，单凭本节不能完全消除指代歧义。主文采用自然的“他”，但不把可能回指上文中性事物的理解排除掉。
- issue: 直接引语的结束位置
  choice: 把全句后半也置于引号内
  alternative: 在“离开我”后结束引语，将“他荣耀的华美……”视为诗人的叙述
  rationale: Swete所示句法把命令及随后分句连在同一话语中；然而第一人称“我”后转为第三人称“他”显得突兀，因此以脚注保留另一种合理断句。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“扔开”比“抛掷”自然，又保留命令的力度；“亨通”略具经文语体色彩，但仍为现代读者所熟悉。主文不消解人称转换和代词指向所造成的真实歧义。
