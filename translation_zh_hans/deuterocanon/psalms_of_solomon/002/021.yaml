  text: She wrapped herself in sackcloth instead of splendid clothing[c][b][a], and a cord around her head instead of a wreath.
translation:
  language: zh_hans
  text: 她以粗麻布裹身，代替华美的衣裳[b]；又以绳子缠头，代替花冠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “花冠”也可译作“冠冕”或“花环”。
    reason: lexical_alternative
  - marker: b
    text: “华美的衣裳”也可译作“美丽的衣服”或“盛装”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέζωσατο
  choice: 裹住自己／缠在
  rationale: 该中间语态动词表示主体把麻布和绳子束在自己身上。汉语按两个部位分别用“裹住自己”和“缠在头上”，既自然，也保留同一动作统摄两个宾语的结构。
- source_word: σάκκον
  choice: 麻布
  rationale: 这是哀悼时所穿粗布的常用表达；“麻布”在现代汉语中简明，并保留其哀恸服饰的文化含义。
- source_word: ἐνδύματος εὐπρεπείας
  choice: 华美的衣裳
  rationale: 该词组指美观、体面或华贵的衣着，与哀悼用的麻布形成鲜明对照；“华美的衣裳”自然且庄重。
- source_word: σχοινίον
  choice: 绳子
  rationale: 原词可指细绳或绳索；此处是缠头之物，“绳子”比“绳索”更符合实际语境，也不过度限定粗细。
- source_word: στεφάνου
  choice: 花冠
  rationale: 在装饰头部的语境中，“花冠”能表达花环或装饰性冠饰，同时避免直接引入王权意味；“冠冕”作为可能译法收入脚注。
