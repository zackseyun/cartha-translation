  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: zh_hans
  text: 那使我高升得荣耀、把狂傲之人带到永远的灭亡中，置于羞辱里的那一位[a][b]，因为他们不认识他。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远的灭亡”或译“永恒的灭亡”；较直译为“时代的灭亡”。
    reason: lexical_alternative
  - marker: b
    text: “置于羞辱里”或译“在不光彩中”。
    reason: lexical_alternative
  - marker: c
    text: “不认识他”也可译作“没有认出他”或“不承认他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνιστῶν ἐμέ
  choice: 那使我升入……的那一位
  rationale: ἀνίστημι表示使人起来、兴起；与εἰς δόξαν连用时译作“使我升入荣耀”，保留上升动态，而不径直解释为单纯的尊荣提升。
- source_word: εἰς δόξαν
  choice: 升入荣耀
  rationale: εἰς表示方向、目标或结果；“入荣耀”既自然，也保留希腊语的趋向意义。
- source_word: κομίζων
  choice: 使……走向
  rationale: 所给原文明确作κομίζων，而非κοιμίζων。κομίζω的基本义为带来、带到；结合后面的εἰς ἀπωλίαν，中文以“使……走向”表达带到某一结局，且不擅自引入“使睡去”的意象。
- source_word: ὑπερηφάνους
  choice: 狂傲之人
  rationale: 该词指高傲、傲慢的人；“狂傲之人”在诗歌语体中庄重自然，并保留其道德贬义而不限定性别。
- source_word: ἀπωλίαν αἰῶνος
  choice: 永远灭亡
  rationale: αἰῶνος在此最自然地表达持久、无尽的性质；“永远灭亡”清楚而简洁，同时以脚注保留较字面的结构。
- source_word: ἐν ἀτιμίᾳ
  choice: 在羞辱中
  rationale: ἀτιμία可指不光彩、耻辱或失去尊荣；“在羞辱中”保留介词结构及公开受辱的意味。
- source_word: οὐκ ἔγνωσαν αὐτόν
  choice: 他们不认识他
  rationale: γινώσκω可涵盖认识、认出或承认；正文采用范围最宽的“不认识”，不消除其关系性和道德层面的可能含义。
theological_decisions:
- issue: αἰῶνος所表达的灭亡性质
  choice: 永远灭亡
  alternative: 世代的灭亡／永恒的灭亡
  rationale: 上下文较支持持续不止的结局，但属格短语本身可有较字面的理解，因此正文采用自然译法并以脚注保存歧义。
- issue: ἔγνωσαν所指的认识
  choice: 不认识他
  alternative: 没有认出他／不承认他
  rationale: 原词可同时涉及认知、辨认和承认；正文不将其限定为某一种神学含义。
translation_notes:
  register: 采用现代、庄重的诗歌语体。“使我升入荣耀”与“使狂傲之人……走向灭亡”形成对照。严格依照用户所给并经标注为Swete直接核验的κομίζων翻译；虽有修订记录主张实际读作κοιμίζων，但该异文并未出现在所提供的原文中，因此不纳入正文。
