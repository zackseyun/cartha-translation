base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/015.yaml
  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: zh_hans
  text: 因为她们自己在不正当混杂[b]的污秽[c]中，玷污了纯洁之物[a]。我的肚腹和肺腑都因这些事而疼痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯洁之物”也可译作“圣洁之物”。
    reason: lexical_alternative
  - marker: b
    text: “混杂”直译希腊语“混合”；本处很可能含有道德上受谴责、甚至涉及性行为的意味。
    reason: cultural_note
  - marker: c
    text: 这里按 ῥύπῳ 译为“污秽”。所给文本作 ῥύμῳ，若据此可理解为“在街巷中”，但这很可能是文本传抄或识别造成的误读。
    reason: textual_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: 因为
  rationale: 承接上文并说明哀痛的缘由；用现代汉语“因为”自然表达其因果作用，又不过度强化逻辑关系。
- source_word: αὐταὶ
  choice: 她们自己
  rationale: 保留希腊语阴性复数代词及其强调作用，同时不擅自补出本节未明说的名词。
- source_word: ἐμίαναν（所给文本作 ἐμίαυσαν）
  choice: 玷污了
  rationale: 表达道德及礼仪层面的污染，语体庄重；所给形式很可能是传抄或识别错误。
- source_word: ἁγνά
  choice: 纯洁之物
  rationale: 将中性复数形容词按名词用法处理，既保留“纯洁”的基本意义，也避免擅自限定具体对象。
- source_word: ἐν ῥύπῳ（所给文本作 ἐν ῥύμῳ）
  choice: 在……的污秽中
  rationale: 依据词形、语法及玷污语境采用“污秽”；若读作 ῥύμη“街道”，其与格通常应为 ῥύμῃ。
- source_word: ἀναμίξεως
  choice: 不正当混杂
  rationale: 保留“混合、混杂”的原始意象，并以“不正当”传达本处明显的道德贬义，而不把可能的性含义断定得过窄。
- source_word: τὴν κοιλίαν μου καὶ τὰ σπλάγχνα μου
  choice: 我的肚腹和肺腑
  rationale: 保留两组身体内部意象及哀痛的切身感；“肺腑”在现代庄重汉语中自然，又没有简化为单纯的“心”。
- source_word: πονῶ ἐπὶ τούτοις
  choice: 都因这些事而疼痛
  rationale: 保留现在进行的切身痛楚，并清楚表达这些事是疼痛的缘由。
theological_decisions:
- issue: ἁγνά 可指“纯洁之物”或带有敬虔色彩的“圣洁之物”
  choice: 正文采用“纯洁之物”
  alternative: 圣洁之物
  rationale: “纯洁”更直接对应词的常见意义；“圣洁”可能强化礼仪或宗教所指，故列作脚注备选。
- issue: ἀναμίξεως 的道德及性含义
  choice: 不正当混杂
  alternative: 淫乱交合
  rationale: 上下文显然带有道德谴责，但该词字面仍是“混合、混杂”；正文保存意象与张力，不把具体行为解释得超过原文。
translation_notes:
  register: 采用现代、庄重而可读的普通话。“她们自己”保留阴性与强调；“肚腹和肺腑”保存原文强烈的身体性哀痛意象。脚注标记均置于相关短语之后，并保留词义与文本层面的真实不确定性。
