  yaml_path: translation/deuterocanon/psalms_of_solomon/002/032.yaml
  text: because he despised him with dishonor[a]; he did not consider that he was a man[b], and afterward he did not consider.
translation:
  language: zh_hans
  text: 因为他以羞辱藐视他[a]；他没有考虑到自己是人，也没有考虑到后来的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“藐视”的主体；本句两个“他”所指不同。
    reason: 代词指称需由上下文判断，现代汉语容易误读为同一主体。
  - marker: b
    text: “后来的事”也可译作“结局”或“后果”。
    reason: τὸ ὕστερον可指以后发生的事，也可侧重最终结局或后果。
lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: 藐视
  rationale: 该动词表示把某人看作无足轻重、以轻蔑相待；“藐视”简洁而有力度，也保留与上下文相关词语的呼应。
- source_word: ἐν ἀτιμίᾳ
  choice: 以羞辱
  rationale: 介词短语表达藐视的方式或伴随的失尊状态；“以羞辱”较贴近原文结构，不将其弱化为单纯的情绪。
- source_word: ἐλογίσατο
  choice: 想到
  rationale: 该动词两次出现，含认真思量、将某事计入考虑之意；“想到”在此自然通顺，并在两处保持重复。
- source_word: ἄνθρωπός ἐστιν
  choice: 自己是人
  rationale: 原文直译为“他是人”。按希腊语句法，嵌句省略的主体自然回指思量者；用“自己”使现代汉语清楚，但不扩展为“凡人”或“必死的人”。
- source_word: τὸ ὕστερον
  choice: 后来的事
  rationale: 该名词化短语可指后来之事、结局或后果。“后来的事”保留时间性及原文未明确说明具体所指的含混性。
theological_decisions:
- issue: ἐξουδένωσεν与ἐλογίσατο的省略主语
  choice: 正文保留“他……他”的代词表达，并以脚注提示可能的指称转换
  alternative: 把前一主语明确译作“上帝”，把后一主语明确译作受藐视者
  rationale: 本节希腊文本没有明说前一动词的主语；上下文可能支持不同动词各有不同指称，但正文不宜把上下文推断直接写成原文明示的信息。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。保留原文“藐视／羞辱”的双重表达及末句的语义开放性；除为汉语回指清楚而用“自己”外，不补入原文未明说的人名或神名。
