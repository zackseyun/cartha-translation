lexical_decisions:
- source_word: διαστεῖλαι
  choice: 作出分别
  rationale: 此处指在审判中清楚区分两类人。“作出分别”既自然，也保留了“辨别”与“分开”之间的语义空间。
- source_word: ἀνὰ μέσον
  choice: 在……之间
  rationale: 该短语标明区分所涉及的双方；译作“在……之间”直接而合乎现代汉语。
- source_word: δικαίου
  choice: 义人
  rationale: 单数在此具有类别代表性；“义人”是简洁、庄重且通行的对应语。
- source_word: ἁμαρτωλοῦ
  choice: 罪人
  rationale: 与“义人”构成道德上的对应类别，并保留希腊文单数的类称用法。
- source_word: ἀποδοῦναι
  choice: 报应
  rationale: 在审判语境中表示按行为给予相应回报；“报应”准确传达其惩罚性含义。
- source_word: ἁμαρτωλοῖς
  choice: 罪人……他们
  rationale: 原文为复数与格。汉语先以“罪人”指出受报者，再用“他们”承接，使句法自然并保留复数所指。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 字面涉及“直到那世代／永世”，在此审判语境中最自然地表示持续不止；脚注保留较直译的可能。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 照着罪人所行的
  rationale: 表达报应与行为相称。“所行的”较“行为”更具动态感，且“罪人”补明代词所指。
theological_decisions:
- issue: 单数道德类别的类称用法
  choice: 译为“义人和罪人”，按类别理解，不限定为两个特定个体。
  alternative: 译为“一个义人和一个罪人”或“义者和罪者”。
  rationale: δικαίου与ἁμαρτωλοῦ虽为单数，却在审判语境中代表两类人；不加“一个”可避免误读为特定个人。
- issue: εἰς τὸν αἰῶνα所表达的持续时间
  choice: 正文译为“永远”，脚注说明其字面形式。
  alternative: 译为“直到永世”或“在那世代中”。
  rationale: 该短语可有“直到永世／永远”的惯用意义，但αἰών的字面范围仍有语义张力，因此不在脚注中抹去这一点。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“为要”承接本节在上下文中的不定式目的结构；“作出分别”避免将διαστεῖλαι仅限于空间上的分开。所有脚注标记均已置于正文相应位置。
