translation:
  language: zh_hans
  text: 为要在义人与罪人之间作出分别[a]，并按他们所行的，永远报应罪人[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把义人与罪人分开。”
    reason: lexical_alternative
  - marker: b
