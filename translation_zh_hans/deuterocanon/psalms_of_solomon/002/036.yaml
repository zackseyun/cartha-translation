  text: καὶ νῦν ἴδετε, οἱ μεγιστᾶνες τῆς γῆς, τὸ κρίμα τοῦ κυρίου ὅτι μέγας βασιλεὺς καὶ δίκαιος, κρίνων τὴν ὑπʼ οὐρανόν.
