base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/036.yaml
  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: zh_hans
  text: 现在，世上的权贵啊，你们要看主的审判：他是伟大而公义的王，审判天之下的世界。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天之下的世界”原文直译近于“天之下的〔领域〕”，中心词被省略；也可理解为“天之下的大地”或“普天之下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: 你们要看
  rationale: 保留复数命令式的直接呼告，现代汉语自然，也传达要求听众留意主审判的语气。
- source_word: μεγιστᾶνες
  choice: 权贵
  rationale: 该词指地位显赫、拥有社会或政治权势的人；“权贵”比“贵族”范围略宽，也符合本句面对地上掌权阶层的公开呼告。
- source_word: κρίμα
  choice: 审判
  rationale: 可涵盖司法裁决、判决及施行审判的行动，不把语义过度收窄为单一的“判决”。
- source_word: κυρίου
  choice: 主
  rationale: 作为指称上帝的称号译为“主”，符合庄重而通行的现代汉语圣经文体。
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: 伟大而公义的王
  rationale: 将两个形容词都理解为修饰“王”，既保留君王的威严，也表达其审判的正直。
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: 审判天之下的世界
  rationale: 原文“τὴν ὑπʼ οὐρανόν”省略了阴性中心词，可能指大地、世界或天之下的领域；正文用自然汉语补出“世界”，并以脚注保留其省略和歧义。
theological_decisions:
- issue: ὅτι在“主的审判”之后所表达的关系
  choice: 以冒号引出“他是伟大而公义的王”
  alternative: 译作“因为他是伟大而公义的王”或“看明主的审判，知道他是伟大而公义的王”
  rationale: ὅτι在此可作原因或内容解；冒号既自然衔接，也避免过早限定为单一逻辑关系，从而保留原文可能的张力。
- issue: κρίνων的主语与功能
  choice: 将“审判天之下的世界”作为描述这位王的分词性陈述
  alternative: 译作独立谓语“他审判天之下的世界”
  rationale: 原文现在分词与“王”相连，既可描写其持续施行审判的身份，也可带有谓语力量；汉译保留紧凑的连续结构。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“世上的权贵啊”保留公开呼告的诗体色彩；避免使用古雅的“看哪”以及可能把μεγιστᾶνες限定为世袭阶层的“贵族”。脚注标记置于相关短语之后。
