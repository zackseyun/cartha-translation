base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: zh_hans
  text: 我看见了，便在主面前恳求[a]说：“主啊，够了！[b]不要再让你的双手在列国的侵袭之中重重压在以色列身上了。[c][d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“恳求主的面”；这是闪语式表达，可理解为“在主面前恳求”或“求主垂顾”。
    reason: literal_idiom
  - marker: b
    text: 也可译作“主啊，愿这足够了”或“主啊，就到这里吧”。希腊文命令式Ἱκάνωσον含有“使之足够、让它到此为止”的意思。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“借着列国的侵袭”或“借着引来列国”。ἐπαγωγή可指引来、带来，也可指袭击或入侵；此处介词短语与神的手重压以色列之间的关系可以理解为处境性或工具性。
    reason: alternative_reading
  - marker: d
    text: 直译较近于“你的双手重重压在以色列身上”。希腊文“手”为复数，并保留了神施压或施行审判的圣经意象。
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ἐγὼ εἶδον
  choice: 我看见了
  rationale: 保留第一人称代词所带的强调，也保留叙事中“看见”这一直接陈述；随后用“便”自然衔接祈求。
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: 在主面前恳求
  rationale: δέομαι表示迫切祈求；τοῦ προσώπου Κυρίου直译涉及“主的面”，带有闪语式“在主面前／求主垂顾”的意味。正文采用现代汉语中自然而庄重的表达，直译信息收入脚注。
- source_word: Ἱκάνωσον
  choice: 够了
  rationale: 该命令式表达“使之足够、让它到此为止”的请求。结合下文苦难语境，“够了”简洁有力，同时不把它扩展成更具体的神学解释。
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: 你的双手不要再……重压以色列了
  rationale: 希腊文χеῖράς为复数，故用“双手”；βαρύνεσθαι保留“沉重压在……之上”的审判意象。“不要再……了”在汉语中自然表达Ἱκάνωσον要求停止现有重压的语用含义。
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: 借着列国的侵袭
  rationale: ἐπαγωγή既可指带来、引来，也可指袭击或入侵；ἐν在此可表手段或处境。正文采用符合上下文的工具性表达，脚注保留其他可能。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是向以色列的神直接呼求；“主啊”是现代中文圣经语体中自然、庄重且不过度解释的称呼。
theological_decisions:
- issue: 神的手重压以色列与列国侵袭之间的关系
  choice: 将列国的侵袭表达为神重压以色列所借用的手段
  alternative: 将其理解为列国入侵时神的双手重压以色列，或理解为神引来列国
  rationale: ἐν可有工具性或情境性，ἐπαγωγή也兼有“引来”与“侵袭”的语义范围。正文采用较合语境的工具性读法，但用脚注明确保留歧义，避免把神的主权与列国行动之间的张力完全消解。
- issue: Ἱκάνωσον是否表示神应当“满足”
  choice: 译为“够了”，表达求神停止当前重压
  alternative: “主啊，愿这足够了”或“主啊，求你满足吧”
  rationale: 命令式的基本观念是“使之足够／认为足够”，而祈祷语境明显指向苦难的止息。“够了”保留其突然而迫切的呼求，也不主张神因受报偿而“满足”。
- issue: κύριος用于直接称呼神
  choice: 主
  alternative: 主人
  rationale: “主”既符合该词在敬拜和祈祷语境中的通常用法，也避免“主人”在现代汉语中过强的主仆色彩。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“主啊，够了！”保留原文呼求的急迫感；后句为符合现代汉语而显明其停止之意。正文不用生硬的“恳求主的面”，但在脚注中保存原文的闪语式意象。
