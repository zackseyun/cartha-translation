lexical_decisions:
- source_word: ἀπέδωκας
  choice: 报应
  rationale: 此动词表示按所当得的归还或偿还；在本节审判语境中，“报应”自然地传达按行为施以相称后果的司法含义。
- source_word: τοῖς ἁμαρτωλοῖς
  choice: 那些罪人
  rationale: “罪人”直接对应名词；“那些”体现希腊语定冠词所指向的特定群体，同时避免仅译成泛指的道德类别。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 照着他们的行为
  rationale: κατά在此表达衡量或对应的准则；“行为”比“工作”更自然，并保留按其所行受报的含义。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 直接保留原文的宗教与道德用语，并与前面的“罪人”形成词义呼应。
- source_word: πονηρὰς σφόδρα
  choice: 极其邪恶
  rationale: “邪恶”表达πονηράς的强烈道德评价，“极其”准确保留σφόδρα的强化作用。
theological_decisions:
- issue: τοῖς ἁμαρτωλοῖς是否指特定群体
  choice: 译作“那些罪人”以保留特指性
  alternative: 译作泛指的“罪人”
  rationale: 希腊语定冠词支持特指，但本节自身没有明确命名该群体，因此只保留指称特征，不把具体历史身份写入正文。
- issue: 第二个κατά短语是否补出谓语
  choice: 补出“报应他们”
  alternative: 按原文省略谓语，译作“也照着他们极其邪恶的罪”
  rationale: 希腊语第二分句承前省略谓语；中文若不补出会显得悬空。补出同一谓语使句意清楚，不增添新的神学判断。
translation_notes:
  register: 采用庄重而现代的叙述语体。“照着”保留原文两个κατά短语的平行结构；“那些罪人”保留定冠词的特指色彩。为使中文完整，在第二分句补出省略的谓语，并以脚注说明。
