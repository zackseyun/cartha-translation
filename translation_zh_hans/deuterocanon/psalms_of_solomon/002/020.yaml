base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: zh_hans
  text: 因为列国在耶路撒冷遭践踏时羞辱她[a]；有人把她的荣美[b]从荣耀的宝座[c]上拉了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文写作συνείδισαν，形式不寻常；很可能是ὠνείδισαν（“羞辱、讥诮”）的异写或讹误。若按另一种理解，也可译作：“因为列国看见耶路撒冷遭践踏。”
    reason: textual_and_lexical_alternative
  - marker: b
    text: “荣美”也可译作“美丽”或“华美”。
    reason: lexical_alternative
  - marker: c
    text: “荣耀的宝座”也可理解为“华美的宝座”。
    reason: grammatical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: 嘲辱
  rationale: 按此处很可能反映的ὠνείδισαν（“辱骂、嘲弄”）来译；现存拼写若直接按通常的“看见”类动词解释，在形态上有困难。正文采用符合语境与文本传承的读法，同时以脚注保留字面异读的可能。
- source_word: ἐν καταπατήσει
  choice: 在……遭践踏时
  rationale: 将抽象名词καταπάτησις所表达的“践踏、被踩在脚下”自然转化为汉语时间情境，又保留耶路撒冷受辱的具体意象。
- source_word: κατέσπασεν
  choice: 拉了下来
  rationale: 该动词表示有力地向下拉或拖；译文保留从高位被拉下的动态画面。希腊文为第三人称单数，因此正文用“他”，不随前句复数“列国”改成“他们”。
- source_word: τὸ κάλλος αὐτῆς
  choice: 她的荣美
  rationale: κάλλος既可指美丽，也可指显赫的华美；“荣美”兼顾耶路撒冷的美与尊荣，并与宝座意象相称。
- source_word: ἀπὸ θρόνου δόξης
  choice: 从荣耀的宝座上
  rationale: 保留属格结构“荣耀的宝座”，不强行判定为性质属格“华美的宝座”；汉语表达自然且维持原文的庄严意象。
theological_decisions:
- issue: κατέσπασεν的未明单数主语
  choice: 他
  alternative: 他们／有人
  rationale: 原文动词为单数，主语没有明说。正文保留这一突变和未决性，避免把前面的复数“列国”擅自设为主语；“他”可能承接上下文中的某位践踏者，但本节本身不予指明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“耶路撒冷”以阴性代词“她”承接，保留城市人格化。“嘲辱”比“责备”更能表达公开羞辱，也较“侮辱”更带有嘲弄意味。分号对应两幅紧密相连的受辱图景；后半句刻意保留原文单数主语造成的张力。
