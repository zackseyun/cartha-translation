  text: and to show mercy to the righteous from the humiliation of the sinner[c][b][a], and to repay the sinner for what he did to the righteous.
translation:
  language: zh_hans
  text: 并怜悯义人，使他脱离罪人的凌辱[a][b]；又照罪人向义人所做的，报应罪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他脱离罪人的凌辱”直译可作“从罪人的凌辱中怜悯义人”。希腊文表达紧缩，正文补出“使他脱离”，以表达其中可能隐含的解救之意。
    reason: lexical_alternative
  - marker: b
    text: “凌辱”也可译作“苦难”“卑抑”或“压迫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: 怜悯
  rationale: 此不定式指实际施行怜悯，而不只是内心同情；结合ἀπό，语境含有使义人脱离困境的意味。
- source_word: δίκαιον / δικαίῳ
  choice: 义人
  rationale: 两处均为单数，泛指一个公义的人；译作“义人”简洁自然，并保持前后对应。
- source_word: ἀπὸ ταπεινώσεως
  choice: 使他脱离……凌辱
  rationale: 希腊文结构紧缩；ἀπό表达从某种低微、受辱状态中脱离，中文补出“使他脱离”以传达句法所蕴含的解救意味。
- source_word: ταπεινώσεως
  choice: 凌辱
  rationale: 该词可指被压低、受羞辱或受苦的状态；此处与罪人的加害相连，“凌辱”能保留其社会与道德层面的受辱意味。
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: 罪人
  rationale: 两处都以单数指同一类具体人物，与“义人”构成鲜明对照；直译为“罪人”。
- source_word: ἀποδοῦναι
  choice: 报应
  rationale: 表示按其行为回报；此处语境明显带有惩罚性的回报，“报应”准确而凝练。
- source_word: ἀνθʼ ὧν
  choice: 照……所做的
  rationale: 该短语说明回报的根据与对应关系；“照……所做的”在中文中自然表达按行为施以相应回报。
- source_word: ἐποίησεν δικαίῳ
  choice: 向义人所做的
  rationale: 与格标示行为所指向的对象；译文不额外加入“伤害”等词，以免超出原文。
theological_decisions:
- issue: 怜悯与报应的并列关系
  choice: 保留两项平行的神圣行动：解救义人，并按罪人的行为报应他
  alternative: 将后半句弱化为一般性的“回报”
  rationale: ἀποδοῦναι在此与罪人对义人的行为相对应，具有司法性和惩罚性；译文应保留怜悯义人与报应罪人之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代书面汉语。以分号呈现两个平行的不定式分句；正文适度补足紧缩的希腊语结构，但用脚注保留较直译的可能。
