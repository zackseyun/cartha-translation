translation:
  language: zh_hans
  text: 你揭露了他们的罪，好使你的审判得以显明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: 揭露了
  rationale: 该动词本义为揭开、揭露；此处以“揭露”自然表达使隐藏的罪显现出来，也与英语审校层的 exposed 相符。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 他们的罪
  rationale: 直接保留复数形式所指的整体罪行；现代汉语用“罪”可自然涵盖集合性复数。
- source_word: ἵνα φανῇ
  choice: 好让……显明
  rationale: 保留 ἵνα 所表达的目的或结果关系，并用“显明”表达被动虚拟式“得以显现”。
- source_word: τὸ κρίμα σου
  choice: 你的审判
  rationale: κρίμα 可指判决、审判或刑罚；此处保留较宽的“审判”，不把含义限定为判决或惩罚。
theological_decisions:
- issue: 罪被揭露与上帝审判显现之间的关系
  choice: 用“好让”保留目的／结果关系
  alternative: 译为“因此你的审判显明”或“为要显出你的判决”
  rationale: 原文 ἵνα 可承载目的或预期结果；“好让”既贴近句法，也不额外断定具体因果机制。
- issue: κρίμα 的语义范围
  choice: 审判
  alternative: 判决；刑罚
  rationale: “审判”保留原词可能涵盖司法裁断及其施行的张力，避免过度收窄。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；句式紧贴希腊文的两分结构，不添加原文没有的神学说明。
