translation:
  language: zh_hans
  text: 使那龙的狂傲蒙受羞辱[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“把那龙的狂傲置于羞辱之中。”
    reason: lexical_alternative
  - marker: b
    text: “龙”在上下文中很可能比喻敌对的统治者或权势；正文保留了希腊文的形象，没有明确指定所指。
    reason: cross_reference
  - marker: c
    text: 也可译作：“使那龙的骄傲受辱。”
    reason: previous_rendering
lexical_decisions:
- source_word: τοῦ ἐπιθεῖναι
  choice: 使……蒙受
  rationale: 带冠词的不定式承接上文所求的报应或审判。这里与 ἐν ἀτιμίᾳ 合起来表达使某事落入羞辱境地；“使……蒙受”在现代汉语中自然，也没有把动作具体化为原文未明说的方式。
- source_word: τὴν ὑπερηφανίαν
  choice: 狂傲
  rationale: 该词指自高自大的骄傲。“狂傲”明确保留其负面、自我高举的语义，比中性的“自豪”准确，也比单用“骄傲”更符合此处审判语境。
- source_word: τοῦ δράκοντος
  choice: 那龙的
  rationale: 按希腊文保留“龙”的鲜明比喻，不在正文中直接认定它是某一位历史统治者或敌对势力。定冠词译作“那”，使所指形象在汉语中较为明确。
- source_word: ἐν ἀτιμίᾳ
  choice: 蒙受羞辱
  rationale: ἀτιμία 表示失去尊荣、陷于耻辱或不名誉。“蒙受羞辱”既自然，又保留公开受辱、尊荣被夺的意味；不只笼统译成“失败”或“降卑”。
theological_decisions:
- issue: “龙”的身份
  choice: 正文保留“那龙”这一比喻
  alternative: 在正文中明确译作某位外国统治者、压迫者或敌对权势
  rationale: 本节本身没有点名比喻所指。保留原有意象，既忠于希腊文，也避免在翻译中替读者解决历史和神学上的辨认问题。
- issue: 狂傲与羞辱之间的关系
  choice: 译为“使……狂傲蒙受羞辱”
  alternative: 译为“把……狂傲变成羞辱”或“使……降卑”
  rationale: 希腊语结构较凝练，可能表示把狂傲置于羞辱之中，也可能强调使其受辱。正文采用自然汉语表达审判结果，同时由脚注保留较形式对应的读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“狂傲”传达负面的自高，“蒙受羞辱”保留 ἀτιμία 所含失去尊荣、陷入耻辱的分量。句子作为承接上文的不定式分句，依所给单节形式译出，未擅自补入主语。
