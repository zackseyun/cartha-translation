  yaml_path: translation/deuterocanon/psalms_of_solomon/002/030.yaml
  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: zh_hans
  text: 我没有等多久，神就让我看见他的狂妄[a]：他在埃及的群山上被刺穿[b]，在陆地和海上比最微不足道的人更受轻蔑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄”也可译作“傲慢”或“暴横”；希腊词ὕβρις既可指骄横的心态，也可指由此而来的凌辱行为。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在埃及的群山上被刺穿”；“被刺穿”在希腊语中指那名男子，并不指他的“狂妄”。
    reason: grammar_clarification
  - marker: c
    text: 希腊原文的比较结构十分简略，近于“被轻蔑得超过最微小者”；正文补出“人”和比较关系，以便理解。
    reason: source_ambiguity
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: 我没有等多久
  rationale: ἐχρόνισα在此结合ἕως，较自然地表示说话者不久便看见神的回应，而不是说他本人没有耽搁去做某事。
- source_word: τὴν ὕβριν αὐτοῦ
  choice: 他的狂妄
  rationale: ὕβρις兼有傲慢、狂妄及由此产生的凌辱行为之意；“狂妄”在现代汉语中简明有力，也保留道德谴责的色彩。
- source_word: ἐκκενεκεντημένον
  choice: 他……被刺透
  rationale: 该阳性单数宾格分词指向那名男子，而非阴性名词“狂妄”；补出“他”可避免汉语误读，并保留遭暴力刺穿的具体意象。
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: 在埃及的群山上
  rationale: 直接保留ὄρη“群山”的意象，不因地理表述显得出人意料而将其改写为较含混的“山区”。
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  choice: 受人蔑视，甚至比最微不足道的人更甚
  rationale: 原文是压缩的比较结构；补出比较关系，使汉语可懂，同时保留其被贬抑至极的意味。
- source_word: ἐπὶ γῆς καὶ θαλάσσης
  choice: 在陆地和海上
  rationale: 按原文保留覆盖陆海的范围表达，不将其限缩为某一具体地点或群体。
theological_decisions:
- issue: “被刺透”所指的对象
  choice: 以“他”明确指向狂妄之人
  alternative: 让“被刺透”紧接“狂妄”，不补明主语
  rationale: 希腊语ἐκκενεκεντημένον为阳性宾格单数，不能修饰阴性的ὕβριν；补出代词是语法所要求的澄清，不是额外的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我没有等多久”传达叙述者很快见到神回应的语境；冒号明确区分神使他看见的“狂妄”与随后临到那人的结局。保留“埃及的群山”“陆地和海上”等原文鲜明而略显突兀的意象。
