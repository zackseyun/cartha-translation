  text: And the earth will know all your righteous judgments[a], O God.
translation:
  language: zh_hans
  text: 上帝啊，大地必知道你一切公义的审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你一切公正的审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώσεται
  choice: 必知道
  rationale: 这是 γινώσκω 的将来时中间语态形式；“必知道”直接表达将来的认识或承认，同时不把语义收窄为单纯的学习或辨认。
- source_word: ἡ γῆ
  choice: 大地
  rationale: γῆ 可指土地、地域或大地；本句与上帝“一切公义的审判”相连，语境较适合范围广泛的“大地”，而非某一特定地域。
- source_word: τὰ κρίματά σου
  choice: 你的审判
  rationale: κρίματα 指判决、审判或司法裁断；“审判”保留其法庭与裁决色彩，又不作不必要的扩展。
- source_word: πάντα
  choice: 一切
  rationale: πάντα 修饰整个宾语短语，表示上帝公义的审判无一例外。
- source_word: τὰ δίκαια
  choice: 公义的
  rationale: δίκαια 在此作定语，描述 κρίματα；“公义的”兼具道德正直和司法正当的意味。“公正的”也是可行译法。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 带冠词的主格在此作呼语；置于句首并加“啊”，自然呈现祷告中的直接称呼。
