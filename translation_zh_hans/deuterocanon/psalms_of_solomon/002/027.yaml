  text: For they did not act out of zeal[a], but out of the desire of their soul[b],
translation:
  language: zh_hans
  text: 因为他们行事并非出于热忱，而是出于他们心灵的欲望[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出于他们自己的欲望”；原文直译为“出于心灵的欲望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: 行事
  rationale: 该动词本义为“做、行”，但本句只说明行为动机，未明说宾语；译作“行事”既符合现代汉语，也不擅自补出具体行为。
- source_word: ζήλῳ
  choice: 热忱
  rationale: 此处与自我驱动的欲望相对，指一种看似正当而热切的动机；“热忱”保留其积极或宗教性的色彩，而不武断译成“嫉妒”。
- source_word: ἐπιθυμίᾳ
  choice: 欲望
  rationale: 该词可指强烈的渴求，但上下文并未限定为性欲；“欲望”保留其强度及可疑的道德色彩，又避免过度窄化。
- source_word: ψυχῆς
  choice: 他们心灵的
  rationale: ψυχή可指心灵、生命或自身。译作“他们心灵的”保留原文的心理与诗歌意象，也比生硬的“灵魂之欲”更符合现代汉语；“他们”由复数主语和语境补出。
