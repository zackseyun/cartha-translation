translation:
  language: zh_hans
  text: 因为地上[a]没有一个人[b]做过他们所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阴性代词，字面为“在她上面”；该代词回指上文在希腊语中为阴性的“地”。
    reason: 说明代词的语法形式及所指。
  - marker: b
    text: “没有一个人”也可按词面译作“不是每一个人”；本译文依语境将否定理解为全称否定。
    reason: 保留否定范围在形式上可能产生的歧义。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出本句作为前文陈述的理由或解释；“因为”自然保留因果关系。
- source_word: οὐκ ... πᾶς ἄνθρωπος
  choice: 没有一个人
  rationale: 在此语境中，否定词与泛指的“每一个人”合起来，最自然地表达为全称否定；同时保留单数泛指的语气。
- source_word: ἐποίησεν
  choice: 做过
  rationale: 不定过去时指已经发生的行为；汉语“做过”简洁表达既成经历及其比较意味。
- source_word: ἐπ' αὐτῆς
  choice: 地上
  rationale: 阴性代词回指上文的“地”（ἡ γῆ），介词短语表示空间位置；译作“地上”比机械译出代词更自然准确。
- source_word: ὅσα ἐποίησαν
  choice: 他们所做的事
  rationale: 保留关系结构以及与复数主语“他们”的比较，不额外说明其具体行为。
theological_decisions:
- issue: ἐπ' αὐτῆς 的所指及含义
  choice: 理解为回指“地”，表示“地上”
  alternative: 理解为指向某座城或女性化对象，表示“对她／攻击她”
  rationale: 其直接先行词是上文阴性名词 ἡ γῆ；耶路撒冷要到后文才出现，因此不宜在本节引入敌对含义。
translation_notes:
  register: 采用简洁、庄重的现代汉语。“地上没有一个人”符合普通读者的自然表达；“他们所做的事”保留原文未明说的复数对象与行为内容。
