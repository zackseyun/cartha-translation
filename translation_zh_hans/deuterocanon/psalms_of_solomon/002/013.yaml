  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: zh_hans
  text: 他们使耶路撒冷的众子沦为笑柄，像城中的妓女一样[a]；凡路过的人都在光天化日之下进城[b]；他们以自己的不法行为戏弄他们。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像……一样”原文较直译为“代替城中的妓女”；这里也可能译作“被当作城中的妓女”。
    reason: 保留ἀντὶ πορνῶν的字面结构及其比较、替代两种可能。
  - marker: b
    text: “在光天化日之下”原文直译为“在太阳面前”，意为公开、毫不遮掩。
    reason: 说明源语意象及正文所采用的惯用表达。
  - marker: c
    text: 原文末句没有明说“戏弄”的对象。“自己的”也可理解为“他们的”，因而末句或可译作：“他们拿那些人的不法行为取笑。”
    reason: 保留宾语省略及代词αὐτῶν的指代歧义。
lexical_decisions:
- source_word: ἔστησαν ... εἰς ἐμπαιγμόν
  choice: 使……沦为笑柄
  rationale: ἵστημι本义为“使站立、安置”，与εἰς ἐμπαιγμόν连用表示使人成为嘲弄的对象；“使……沦为笑柄”自然传达结果及受辱意味。
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: 耶路撒冷的众子
  rationale: 保留原文阳性复数“众子”及其亲属隐喻，不泛化为“居民”或“百姓”。
- source_word: ἀντὶ πορνῶν ἐν αὐτῇ
  choice: 像城中的妓女一样
  rationale: ἀντί通常可指“代替”，但此处语境呈现羞辱性的类比；正文采用通顺的比较表达，同时以脚注保留较严格的字面可能。ἐν αὐτῇ中的阴性代词回指耶路撒冷，汉语以“城中”自然表达。
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: 凡路过的人都……进去
  rationale: 两个行走动词及未完成时描写反复发生的来往；“凡路过的人都……进去”保留普遍、持续而无所顾忌的意味。
- source_word: κατέναντι τοῦ ἡλίου
  choice: 在光天化日之下
  rationale: 字面为“在太阳面前”，指公开可见、毫不遮掩；“在光天化日之下”既自然又保留日光意象。
- source_word: ἐνέπαιζον
  choice: 戏弄
  rationale: 该动词与前面的ἐμπαιγμόν呼应，表达带有侮辱意味的嘲弄；“戏弄”比单纯“嘲笑”更能容纳以行为凌辱人的语气。
- source_word: ταῖς ἀνομίαις αὐτῶν
  choice: 以自己的不法行为
  rationale: 将与格理解为手段，ἀνομία译作具有道德意味的“不法行为”。“自己的”按近接主语理解，但原文代词所指仍有一定歧义，故以脚注说明。
theological_decisions:
- issue: ταῖς ἀνομίαις αὐτῶν中αὐτῶν的指代及与格功能
  choice: 正文理解为施害者“以自己的不法行为”戏弄耶路撒冷众子
  alternative: 也可理解为“拿他们的不法行为取笑”，即αὐτῶν指耶路撒冷众子，与格表示嘲弄所针对的内容
  rationale: 上下文以公开进入和羞辱为主线，将“不法行为”归于施害者较为连贯；但希腊文并未明示宾语，αὐτῶν也可能另有所指，因此不把另一种理解排除在外。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“众子”刻意保留原文的男性复数和耶路撒冷母城意象；“沦为笑柄”“光天化日之下”使句子自然有力，同时脚注交代较直译的表达。
