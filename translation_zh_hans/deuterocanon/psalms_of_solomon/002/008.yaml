  yaml_path: translation/deuterocanon/psalms_of_solomon/002/008.yaml
  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
translation:
  language: zh_hans
  text: 因为他转脸，不再怜悯他们——无论年轻人、老年人，还是他们的孩子，都一概如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: 转……不再
  rationale: 该动词与“脸”搭配，表示转开、撤回；用“转脸不再”既保留原文动作意象，也自然表达其结果。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: 脸
  rationale: 直译“脸”可保留圣经语言中具体而具关系性的拟人意象，不抽象化为“同在”。
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: 不再怜悯他们
  rationale: 希腊语结构简缩，字面近于“离开对他们的怜悯”；此译在现代汉语中自然，并保留ἔλεος所表达的怜悯。
- source_word: νέον καὶ πρεσβύτην
  choice: 无论年轻人、老年人
  rationale: 两个希腊语名词虽为单数形式，却作集合和分配性用法，泛指各年龄层的人。
- source_word: τέκνα αὐτῶν
  choice: 他们的孩子
  rationale: τέκνα泛指儿女或孩子，并不限于男性后代。
- source_word: εἰς ἅπαξ
  choice: 全都同时遭殃
  rationale: 该短语兼有整体性与同时性；结合审判语境补出“遭殃”，使汉语句意完整，但不具体限定所受审判的形式。
theological_decisions:
- issue: 主体转脸的拟人化语言
  choice: 保留“转脸”的具体意象
  alternative: 撤回怜悯／不再施怜悯
  rationale: 原文以身体动作表达关系性的拒绝；保留这一意象，避免把神学张力化约为抽象陈述。
- issue: εἰς ἅπαξ所指的审判结果未明说
  choice: 以“全都同时遭殃”表达其整体、同时受审判的含义
  alternative: 一并／同时
  rationale: 若只译副词，现代汉语中缺少它所修饰的明确动作；“遭殃”依据上下文补足结果，同时不指定死亡或某种具体刑罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“转脸”保留原文的圣经式具体意象；破折号展开受审判的人群。“全都同时遭殃”使末尾短语在汉语中有所着落。
