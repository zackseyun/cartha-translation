  text: to pour out their wrath on us in plundering[a]. And do not delay, O God, to repay them on their own heads[b],
translation:
  language: zh_hans
  text: 他们在抢掠中把烈怒倾倒在我们身上[a]。上帝啊，求你不要迟延，使报应落在他们自己头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以抢掠的方式”。希腊语表达紧凑，可能指他们在暴力掠夺时倾倒烈怒。
    reason: lexical_alternative
  - marker: b
    text: 直译：“偿还给他们，归到头上。”这是报应归回作恶者自身的惯用表达。
    reason: idiom_clarification
lexical_decisions:
- source_word: ἐκχέαι
  choice: 倾倒
  rationale: 保留希腊文“倒出、倾注”的鲜明意象，也能自然地与“烈怒”搭配。
- source_word: ὀργὴν
  choice: 烈怒
  rationale: 体现此处强烈且带惩罚意味的愤怒，比一般的“怒气”更有力度。
- source_word: ἐν ἁρπάγματι
  choice: 肆意抢掠
  rationale: 该短语紧凑且含义略有不确定；此译表达伴随烈怒而来的暴力劫掠，同时以脚注保留结构上的其他理解。
- source_word: χρονίσῃς
  choice: 不要迟延
  rationale: 用现代而庄重的汉语表达祈求上帝不要延后行动。
- source_word: ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: 把报应归到他们自己头上
  rationale: 保留报应回到作恶者头上的希腊语意象，并使中文自然明白。
theological_decisions:
- issue: 报应归头的惯用表达
  choice: 译作祈求上帝“把报应归到他们自己头上”
  alternative: 较直译为“偿还给他们，落在头上”
  rationale: 原文表达恶人承受与其行为相称的回报；译文保留“头上”的意象，不淡化审判语气，也不进一步界定报应的具体形式。
translation_notes:
  register: 采用现代、庄重且适合祷告诗体的表达。“上帝啊，求你”自然呈现呼告；保留“倾倒烈怒”和“归到头上”两个原文意象。
