base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: zh_hans
  text: 因为主恩待那些恒忍呼求他的人[a]；他照着自己的怜悯对待他的虔诚人[b]，使他们常常刚强地侍立在他面前。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恒忍”也可译作“忍耐”或“坚忍”。
    reason: lexical_alternative
  - marker: b
    text: “虔诚人”也可译作“忠信的人”；此词有时译作“圣民”，但原词着重虔诚、忠贞。
    reason: lexical_alternative
  - marker: c
    text: 原文后半句由两个不定式构成，关系较为压缩；也可较直译为：“照他的怜悯向他的虔诚人施行，常常刚强地侍立在他面前。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: χρηστὸς
  choice: 恩待
  rationale: χρηστός可指良善、仁慈、厚道；“恩待”在此自然表达主对呼求者仁慈相待的关系性含义，又与后文的“怜悯”相呼应。
- source_word: τοῖς ἐπικαλουμένοις αὐτὸν
  choice: 那些……呼求他的人
  rationale: ἐπικαλέομαι在此表示向上帝祈求、求告；“呼求”既是现代汉语，也保留祷告与敬拜语境。
- source_word: ἐν ὑπομονῇ
  choice: 恒忍
  rationale: ὑπομονή不只是静候，也包含在压力下持续坚持；“恒忍”简洁地兼顾忍耐和持守。
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: 他照着自己的怜悯对待
  rationale: ποιῆσαι的表达较为压缩，直译“去行”在汉语中不完整；“对待”保留主按照怜悯向其子民采取行动的含义，同时避免过度具体化。
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: 他的虔诚人
  rationale: ὅσιος在《所罗门诗篇》中侧重对上帝虔诚、忠贞的人，并不等同于通常译作“圣”的ἅγιος；“虔诚人”保留其宗教和群体身份色彩。
- source_word: διὰ παντὸς
  choice: 常常
  rationale: 表达持续、始终的时间含义，行文自然，并符合诗歌敬虔语体。
- source_word: παρεστᾶναι ἐνώπιον αὐτοῦ ἐν ἰσχύι
  choice: 刚强地侍立在他面前
  rationale: “侍立在……面前”保留παρίστημι所呈现的站立、在场与服事意象；“刚强地”表达ἐν ἰσχύι，同时不明说力量的来源。
theological_decisions:
- issue: χρηστὸς之后两个不定式的压缩句法及παρεστᾶναι的隐含主语
  choice: 将ποιῆσαι展开为“他……对待”，并将末一不定式理解为主怜悯虔诚人的结果：“使他们……侍立”。
  alternative: 更形式对应的译法可作：“因为主恩待那些恒忍呼求他的人，照他的怜悯向他的虔诚人施行，使之常常刚强地侍立在他面前。”也可保留两个不定式之间更松散的关系，不明确标出结果。
  rationale: 希腊文连续使用不定式，结构高度压缩；若把παρεστᾶναι的主语直接理解为“主”，便会产生主侍立在自己面前的不自然意思。按语义将其隐含主语理解为“虔诚人”，并以“使”表达结果，在现代汉语中最清楚；脚注则保留原文句法关系未完全明说这一点。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“恩待”“呼求”“侍立”保留敬虔语境的分量，但避免过度古雅。“虔诚人”有意区别于通常对应ἅγιος的“圣徒/圣民”。
