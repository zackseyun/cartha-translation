base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: zh_hans
  text: 敬畏主、带着明悟[a]的人哪，你们要称颂上帝！因为主的怜悯临到敬畏他的人，并带着审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着知识”或“带着辨识力”。
    reason: lexical_alternative
  - marker: b
    text: 或译“带着公义”；希腊文将怜悯与审判的关系表述得十分简缩。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 要称颂
  rationale: 保留复数命令语气和敬拜语境中的祝颂含义；“称颂”比泛指的“赞美”更贴近该动词的圣经用法。
- source_word: οἱ φοβούμενοι
  choice: 你们这些……敬畏……的人哪
  rationale: 该分词短语在这里具有呼语功能，译作直接称呼，既忠实又符合现代汉语表达。
- source_word: κύριον / Κυρίου
  choice: 主
  rationale: 符合κύριος作为神圣称号的通常译法，并保留两处用词的一致性。
- source_word: ἐν ἐπιστήμῃ
  choice: 以明悟
  rationale: “在知识中”不合自然汉语；“以明悟”表达一种有认识、有辨识力的敬畏，同时不把含义限定为单纯的知识积累。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接传达ἔλεος的核心含义，也符合本句庄重、敬虔的语域。
- source_word: μετὰ κρίματος
  choice: 并有审判
  rationale: 保留原文简缩的并置关系，不擅自明确怜悯与审判之间究竟是伴随、衡量还是司法公义的关系。
theological_decisions:
- issue: μετὰ κρίματος中怜悯与审判的关系
  choice: 主的怜悯临到敬畏他的人，并有审判
  alternative: 主的怜悯临到敬畏他的人，伴随着公义
  rationale: 希腊文没有明确说明κρίμα侧重审判、公义还是司法裁断，也没有充分展开它与怜悯的句法关系；正文保留简缩并置，注释说明可能含义，以免消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“你们这些……的人哪”体现原文的直接呼告；句末“并有审判”有意保留原文略显突兀的简缩结构和神学张力。
