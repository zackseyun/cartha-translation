- from: 你们这些以明悟[a]敬畏主的人哪，要称颂上帝！因为主的怜悯临到敬畏他的人，并有审判[b]。
  to: 敬畏主、带着明悟[a]的人哪，你们要称颂上帝！因为主的怜悯临到敬畏他的人，并带着审判[b]。
  rationale: 修订将μετὰ κρίματος译为“并带着审判”，使其作为与“主的怜悯”相连的伴随短语，同时保留原文对于审判／公义及其与怜悯之关系的压缩和未展开性。呼语的调整提升现代标准汉语的自然度，不改变原文的直接称呼、命令语气或意义。
