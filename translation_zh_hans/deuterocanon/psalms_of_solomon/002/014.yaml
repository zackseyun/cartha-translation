base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/014.yaml
  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
translation:
  language: zh_hans
  text: 正如他们自己所行的，他们把自己的罪孽公然展示在太阳面前[a]；耶路撒冷的女子照你的判决是不圣洁的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在太阳面前”直译原文，指公开地、当众地。
    reason: 说明ἀπέναντι τοῦ ἡλίου的字面意象及其语用含义。
  - marker: b
    text: “不圣洁的”也可译作“被玷污的”或“凡俗的”。原文形容词着重其与圣洁相反的状态，并未明确说明这种状态是由她们的行为造成，还是由判决所宣告。
    reason: 保留βέβηλοι的状态性及其与圣洁相对的语义范围，避免把它限定为主动亵渎。
lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: 正如他们自己所行的
  rationale: καθά引出比较，αὐτοί带强调意味；此译保留“他们自己”以及原文未明确说明比较对象的含混性，不增补“素来”等时间含义。
- source_word: παρεδειγμάτισαν
  choice: 公然展示
  rationale: 该动词含公开陈列、示众之意；结合“在日光之下”，译为“公然展示”既自然，也保留公开暴露的语气。
- source_word: ἀδικίας
  choice: 罪孽
  rationale: 复数指具体的不义恶行；“罪孽”在本诗的审判语境中兼具道德和宗教分量，避免把含义缩窄为现代社会意义上的“不公”。
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: 在日光之下
  rationale: 原义为“在太阳面前”；“在日光之下”保留原有意象，同时在现代汉语中自然表达公开而为。
- source_word: βέβηλοι
  choice: 不圣洁的人
  rationale: βέβηλος表示与圣洁相反、属于凡俗或被亵渎的状态；此译保留圣洁与非圣洁的对照，又不擅自判定是主动亵渎还是被动玷污。
- source_word: κατὰ τὸ κρίμα σου
  choice: 照你的判决
  rationale: 直陈其状态与上帝判决的关系，不把κατά进一步解释为判决的手段或结果。
theological_decisions:
- issue: βέβηλοι是主动亵渎还是处于不圣洁、被玷污的状态
  choice: 不圣洁的人
  alternative: 被玷污的人；亵渎圣洁的人
  rationale: 原文形容词本身没有明确主动或被动关系；正文采用状态性表达，并在脚注列出可能译法，以保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“正如他们自己所行的”刻意保留原文比较关系的未明之处；分号呈现两个紧密相连、但各自完整的审判陈述。
