  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: zh_hans
  text: 罪人狂妄自大时，他用攻城槌拆毁坚固的城墙；你却没有拦阻他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: 狂妄自大时
  rationale: ἐν τῷ 加不定式在这里表示时间；ὑπερηφανεύεσθαι含有骄傲自高、狂妄行事的贬义。“狂妄自大时”既保留道德色彩，也符合现代汉语表达。
- source_word: τὸν ἁμαρτωλόν
  choice: 罪人
  rationale: 保留原文单数和直接称谓，不扩大解释为泛指的“恶人”。
- source_word: ἐν κριοῖς
  choice: 用攻城槌
  rationale: κριός本义为“公羊”，也指形似公羊冲撞的攻城器械；拆毁城墙的语境明确支持“攻城槌”。介词ἐν在此表达手段，译作“用”。
- source_word: κατέβαλλε
  choice: 正……拆毁
  rationale: 未完成过去时描写正在持续进行的行动；“正……拆毁”在汉语中自然体现这一体貌。
- source_word: τείχη ὀχυρά
  choice: 坚固的城墙
  rationale: τείχη指城墙，ὀχυρά强调坚固、设防；“坚固的城墙”自然且不额外限定其构造。
- source_word: οὐκ ἐκώλυας
  choice: 你却没有拦阻他
  rationale: 原文第二人称单数的对象未明说，依上下文补出“他”；“却”传达叙述中对未加阻止的突出和张力，但不解释其原因。
theological_decisions:
- issue: “你”没有阻止罪人的神学张力
  choice: 直译为“你却没有拦阻他”，不说明允许此事发生的原因
  alternative: 扩译为“你任凭他这样做”或“你没有阻止他，因为……”
  rationale: 原文只陈述未加拦阻，并未解释动机；保留这一张力可避免把特定的神意论解释加入经文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“狂妄自大”“攻城槌”“坚固的城墙”“拦阻”兼顾原文力度和普通读者的可懂度；不补明第二人称所指，也不解释其为何未加阻止。
