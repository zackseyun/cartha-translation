  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: zh_hans
  text: 因为耶路撒冷的子民[a]玷污了主的圣物，又以不法之事亵渎了献给上帝的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“耶路撒冷的儿子们”；此处可能指耶路撒冷的居民或百姓。
    reason: lexical_alternative
  - marker: b
    text: 直译“上帝的礼物”；在这里很可能特指献给上帝的祭礼供物。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ' ὧν
  choice: 因为
  rationale: 此处承接上下文，说明审判临到的缘由；“因为”自然清楚地表达因果关系。
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: 耶路撒冷的子民
  rationale: 希腊文直译为“耶路撒冷的儿子们”，是带有群体归属意味的闪语式表达；现代汉语用“子民”既保留其关系意象，也避免误解为耶路撒冷这座城实际生育的儿子。
- source_word: ἐμίαναν
  choice: 玷污了
  rationale: “玷污”能表达使圣物受到礼仪性污染的含义，并保持庄重而易懂的语体。
- source_word: τὰ ἅγια Κυρίου
  choice: 主的圣物
  rationale: 中性复数 τὰ ἅγια 在这里宜理解为属于主的神圣之物；“圣物”保留复数集合意义，且不擅自限定为圣所建筑。
- source_word: ἐβεβήλωσαν
  choice: 亵渎了
  rationale: 该动词指把神圣之物当作凡俗之物；“亵渎”准确保留其祭仪和宗教意味。
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: 献给上帝的供物
  rationale: δῶρα 字面为“礼物”，但在圣殿语境中指奉献给上帝的祭礼供物；补出“献给”可澄清 τοῦ θεοῦ 的关系，避免理解成上帝赐给人的礼物。
- source_word: ἐν ἀνομίαις
  choice: 以种种不法之事
  rationale: 介词短语可表达方式或伴随情形；复数“种种不法之事”既反映 ἀνομίαις 的复数，也表明亵渎是借着具体的违法行为发生的。
theological_decisions:
- issue: τὰ ἅγια 是圣物还是圣所
  choice: 主的圣物
  alternative: 主的圣所
  rationale: 希腊文为中性复数，语法上更自然地指各样神圣之物；不将其窄化为单一圣所，可保留原文范围。
- issue: τὰ δῶρα τοῦ θεοῦ 中属格的方向
  choice: 献给上帝的供物
  alternative: 上帝的礼物
  rationale: 圣殿与亵渎的语境支持将其理解为归给或献给上帝的供物，但脚注保留较字面的另一种译法，以承认属格形式本身的简约性。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“主”“圣物”“亵渎”“供物”保留祭仪语境；以“又”连接两个并列动词，使句子符合自然汉语节奏。
