  text: For they did evil once for all[c][b][a], not listening.
translation:
  language: zh_hans
  text: 因为他们一同作恶，不肯听从。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同”也可译作“一次而尽”或“彻底”；末句直译为“为要不听”或“以致不听”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὰ
  choice: 恶
  rationale: 这是宽泛而有分量的道德用语；“作恶”自然对应希腊语“行恶事”，不把罪恶限定为某一种行为。
- source_word: ἐποίησαν
  choice: 作
  rationale: 保留常用动词的简洁性；“作恶”是现代汉语中自然、庄重的搭配。
- source_word: εἰς ἅπαξ
  choice: 一同
  rationale: ἅπαξ通常可表示“一次、一次而尽”，但εἰς ἅπαξ在紧邻的2:8中指各类人一同遭遇灾祸；本节很可能延续群体性的语境，表示他们全都参与作恶。鉴于短语本身仍可能强调彻底或一次而尽，另在脚注保留歧义。
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: 不肯听从
  rationale: 字面为“为要不听／不去听”。这里的属格冠词不定式可表达目的、结果或说明性的关系；“不肯听从”以自然汉语传达带有意志色彩的不听，同时脚注保留较字面的可能。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“听从”比单纯“听见”更能表达语境中的拒绝听取，但不在正文中明确补出所拒绝听从的对象。
