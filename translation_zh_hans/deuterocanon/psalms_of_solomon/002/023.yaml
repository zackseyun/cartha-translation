  text: Her beauty was cast to the ground in disgrace[a][b][c].
translation:
  language: zh_hans
  text: 她的美丽蒙羞，被抛在地上[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙羞”也可译作“受辱”或“蒙受耻辱”。
    reason: lexical_alternative
  - marker: b
    text: 原文作阴性“她的”；按上下文，这很可能指被拟人化的城。
    reason: cross_reference
  - marker: c
    text: 或译：“她的美丽蒙羞，被摔在地上。”
    reason: translation_alternative
lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: 蒙羞
  rationale: 该词表示失去尊荣、受辱或陷于羞耻；“蒙羞”简洁自然，也保留公开受辱的意味。
- source_word: τὸ κάλλος αὐτῆς
  choice: 她的美丽
  rationale: κάλλος的基本义是“美丽、美”；采用“美丽”紧贴原词，同时不排除上下文中拟人化城邑之荣美。αὐτῆς按原文保留阴性第三人称“她的”。
- source_word: ἀπερρίφη
  choice: 被抛
  rationale: 该不定过去时被动动词表示被扔出、抛弃或抛下；“被抛”既体现被动语态，也与后面的“在地上”构成自然汉语。
- source_word: ἐπὶ τὴν γῆν
  choice: 在地上
  rationale: ἐπί接宾格在此表示朝向并落到某一表面；汉语“被抛在地上”自然传达这一落地意象。
theological_decisions:
- issue: 阴性代词αὐτῆς的所指
  choice: 正文保留“她的”，不直接点明所指
  alternative: 译作“城的”或“这城的”
  rationale: 希腊文仅使用阴性代词；上下文很可能指拟人化的城，但本节本身没有明说，因此保留原文的指代空间，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而简明的诗体表达。“蒙羞，被抛在地上”保留原文羞辱与坠落并置的意象；不将阴性代词的所指直接解释进正文。
