    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμα
  choice: 尸身
  rationale: σῶμα通常指“身体”；上下文明确所指之人已经死亡，且随即提到无人埋葬，因此用庄重而自然的“尸身”，既保留具体所指，也符合汉语语境。
- source_word: διαφερόμενον
  choice: 被浪涛卷来卷去
  rationale: 该被动分词表示受外力带动、四处漂移；“卷来卷去”保留被动与反复飘荡之感，比单说“漂流”更能呈现浪涛的作用。
- source_word: ἐπὶ κυμάτων
  choice: 被浪涛
  rationale: 希腊文直译为“在波浪上”；汉语将其与被动动作合译为“被浪涛卷来卷去”，自然表达尸身随浪而动。
- source_word: ἐν ὕβρει πολλῇ
  choice: 受尽凌辱
  rationale: ὕβρις可指傲慢施加的侮辱、暴虐或羞辱性对待。此处“受尽凌辱”传达尸身遭受严重侮慢的意味，同时不把词义过度限定为某一种具体暴行。
- source_word: οὐκ ἦν ὁ θάπτων
  choice: 也没有人埋葬他
  rationale: 这一结构惯常表示没有人执行埋葬之事；译文直接、自然，并保留无人为死者安葬的悲惨意味。
