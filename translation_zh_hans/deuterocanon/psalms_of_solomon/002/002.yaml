  yaml_path: translation/deuterocanon/psalms_of_solomon/002/002.yaml
  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
translation:
  language: zh_hans
  text: 外来的列国[a][b]登上了你的祭坛；他们穿着凉鞋，狂傲地践踏了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译作“外邦人”；ἔθνη既可泛指各国，也可在犹太敬拜语境中特指非以色列人。
    reason: lexical_alternative
  - marker: b
    text: “外来的”也可译作“异族的”或“陌生的”；ἀλλότρια强调这些列国并非本属此处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: 登上了
  rationale: 保留动词“上去、登上”的具体空间动作；与表示趋向的ἐπὶ及宾格连用时，此处自然指登上祭坛，不额外加入军事攻击的含义。
- source_word: τὸ θυσιαστήριόν σου
  choice: 你的祭坛
  rationale: “祭坛”是θυσιαστήριον准确、通行且自然的现代汉语对应词；“你的”保留第二人称所属关系。
- source_word: ἔθνη ἀλλότρια
  choice: 外邦列国
  rationale: “列国”对应ἔθνη，“外邦”体现ἀλλότρια所含的外来、非本属之意，也符合犹太敬拜语境；脚注保留“异族列国”等可能表达及ἔθνη本身的歧义。
- source_word: κατεπάτησαν
  choice: 践踏
  rationale: 准确传达用脚踩踏以及由此产生的凌辱、亵渎色彩，语言庄重而有力度。
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: 脚穿凉鞋
  rationale: ὑπόδημα指绑在脚上的鞋履，历史语境中译作“凉鞋”较贴切；“脚穿”自然表达ἐν在此所示的伴随状态或方式。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 狂傲地
  rationale: 把介词短语自然转化为方式副词，传达ὑπερηφανία在亵渎行为中所含的高傲、骄横意味。
theological_decisions:
- issue: ἔθνη在圣殿语境中是泛指“列国”还是特指非以色列的“外邦人”
  choice: 正文译作“外邦列国”，同时保留民族复数与非本族的语境色彩
  alternative: 异族列国；外族人；列国
  rationale: ἔθνη可泛指各国，也可在犹太宗教语境中特指外邦人；ἀλλότρια又明确增加“外来的、异属的”意义。正文兼顾两层，脚注说明歧义，避免把它收窄为后期固定神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“登上了”保留具体动作，“脚穿凉鞋”凸显对祭坛的冒犯，“狂傲地践踏”保持原句强烈的道德谴责。脚注标记紧随存在词义歧义的“外邦列国”。
