lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出前文所述之事的原因或根据；现代汉语中用“因为”自然明确。
- source_word: ἐνέπαιξαν
  choice: 嘲弄人
  rationale: 表达带有轻蔑和敌意的讥嘲；补出泛指宾语“人”，使汉语表达完整，但不限定具体对象。
- source_word: οὐκ ἐφείσαντο
  choice: 毫不留情
  rationale: φείδομαι可指饶恕、顾惜或克制不加害；“毫不留情”简洁保留其严酷意味，也符合现代汉语习惯。
- source_word: ἐν ὀργῇ καὶ θυμῷ
  choice: 带着怒气、暴怒
  rationale: 分别呈现ὀργή与θυμός这一近义叠加，并以“暴怒”体现后者较强烈、爆发性的语气。
- source_word: μετὰ μηνίσεως
  choice: 和深深的愤恨
  rationale: μήνισις表示强烈且可能持久的愤怒、怨愤；“深深的愤恨”保留强度与积蓄感，同时避免擅自加入明确的报复意图。
