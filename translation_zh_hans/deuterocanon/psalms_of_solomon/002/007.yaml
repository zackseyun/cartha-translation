  yaml_path: translation/deuterocanon/psalms_of_solomon/002/007.yaml
  text: He dealt with them according to their sins[b][a], because he abandoned them into the hands of those who prevailed over them.
translation:
  language: zh_hans
  text: 他照着他们的罪行对待他们，因为[a]他撇弃他们，任他们落在那些胜过他们的人手中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可理解为“就是”或“因为这表现在”，即下半句说明他怎样照着他们的罪行对待他们。
    reason: 原文ὅτι既可表示原因，也可能在这里引出解释或具体表现。
  - marker: b
    text: “那些胜过他们的人”也可译作“那些制伏他们的人”或“比他们强的人”。
    reason: κατισχυόντων可强调实际占上风、制伏的行动，也可突出力量上的优势。
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: 照着他们的罪行
  rationale: κατά表示相称或依照；“照着”保留审判与其罪相应的含义。ἁμαρτίαι在此采用普通而明确的“罪行”。
- source_word: ἐποίησεν αὐτοῖς
  choice: 对待他们
  rationale: 希腊文直译为“向他们做了”；“对待他们”是自然的现代汉语，也保留了施行相应处置的意思。
- source_word: ἐγκατέλειπεν αὐτούς
  choice: 撇弃他们
  rationale: 该动词表示离弃，使人处于无援、暴露的境地；“撇弃”既保留其力度，也符合庄重的经文语体。
- source_word: εἰς χεῖρας
  choice: 任他们落在……手中
  rationale: 原文保留“手中”这一表示落入他人权势的意象；补出“任……落在”使“撇弃……进入手中”的希腊结构成为自然汉语，而没有把它弱化为抽象的“权势之下”。
- source_word: κατισχυόντων
  choice: 那些胜过他们的人
  rationale: 现在分词指正在占上风、制伏或战胜他们的人。“胜过他们”既反映动态行动，也不把词义限定为单纯体力更强。
theological_decisions:
- issue: ὅτι与前句的逻辑关系
  choice: 因为
  alternative: 就是；因为这表现在
  rationale: ὅτι通常可表原因，故正文采用最直接的“因为”；但在本句中也可能引出前句审判的具体表现或说明。脚注保留这种句法与神学张力，避免断定上帝撇弃他们只是前一行动的外在原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“照着……对待”“撇弃”“落在……手中”保留原文的审判语气和手的意象；通过脚注呈现ὅτι和κατισχυόντων的真实歧义。
