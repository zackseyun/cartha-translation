  text: 主在他仆人面前永远当受称颂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受称颂
  rationale: 此形容词在颂赞句中作表语，宣告主配受称颂；“当受称颂”符合现代汉语颂赞语体，也不把原文强行处理成祈愿句。
- source_word: Κύριος
  choice: 主
  rationale: 作为神圣称号，译作“主”简洁、庄重，并符合现代中文圣经语体。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这一惯用语表示无尽、恒久的时间，“永远”自然准确。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 保留“在某人面前／临在之处”的空间与关系含义，不额外解释为仅仅“被看见”或“被承认”。
- source_word: δούλων αὐτοῦ
  choice: 他的仆人
  rationale: 在敬拜与归属的语境中，δοῦλος译作“仆人”自然，并保留服事和隶属关系；“奴隶”虽属可能词义，但在本句中容易使社会身份含义压过颂赞语境。
theological_decisions: []
translation_notes:
