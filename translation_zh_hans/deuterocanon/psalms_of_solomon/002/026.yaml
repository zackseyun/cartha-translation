  text: And they will be brought to an end[a], unless you, Lord[b], rebuke them in your wrath.
translation:
  language: zh_hans
  text: 他们将被除灭[a]，除非你——主啊——在你的烈怒中斥责他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被除灭”也可译作“被终结”或“被毁灭”（συντελεσθήσονται）。
    reason: lexical_alternative
  - marker: b
    text: 希腊文前一句的复数主语未明说；后一句用复数代词“他们”。按上下文，前者可能指以色列，后者可能指敌对的列国；也可理解为二者指同一群体。
    reason: referential_ambiguity
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不另译）
  rationale: 此处καὶ承接前文推进论述；现代汉语句首若直译为“并且”较显生硬，省去连接词仍能保留上下文的连续性。
- source_word: συντελεσθήσονται
  choice: 将被除灭
  rationale: 该词是συντελέω的将来被动式，可指被带到终局、被彻底终止；“被除灭”保留被动和敌对语境中的毁灭意味，同时脚注列出较宽泛的译法。
- source_word: ἐὰν μὴ
  choice: 除非
  rationale: 自然表达条件性例外，不额外补充因果关系。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格的直接祈求语气；“主啊”是现代汉语庄重而自然的称呼。
- source_word: ἐπιτιμήσεις
  choice: 斥责
  rationale: 表达ἐπιτιμάω所含的严厉、权威性责令意味，又不擅自把具体惩罚方式写入正文。
- source_word: ἐν ὀργῇ σου
  choice: 在你的烈怒中
  rationale: 贴近介词结构，并以“烈怒”传达ὀργή在审判语境中的强烈程度。
theological_decisions:
- issue: 省略主语与αὐτοῖς所指对象是否相同
  choice: 正文两处均译作“他们”，以脚注说明指代歧义
  alternative: 把前一处明确译作“以色列”，后一处译作“那些人／列国”
  rationale: 希腊文没有明说被除灭者是谁，αὐτοῖς也只写作“他们”。上下文可能支持二者指向不同群体，但直接补入“以色列”会消除原文真实存在的语法歧义，因此保留代词，并在脚注中交代上下文解释。
translation_notes:
  register: 采用现代、庄重的祈祷语体。“主啊”保留直接呼告；破折号标明插入的呼语，帮助读者把握“除非你……斥责他们”的句法。正文不擅自补出“以色列”或“列国”，以保存希腊文的指代张力。
