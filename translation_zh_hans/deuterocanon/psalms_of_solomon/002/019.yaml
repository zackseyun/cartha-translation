base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/019.yaml
  text: You made their memorial perish from the earth[a]. God is a righteous judge[d][c][b], and he will not show partiality.
translation:
  language: zh_hans
  text: 你使他们的纪念从地上显明出来[a][b]。上帝是公义的审判者，必不偏待人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明出来”所译的希腊语动词通常意为“使人知道、揭示”或“使显明”。它在这里与“他们的纪念从地上”搭配得很不寻常；有些译法依上下文译作“使他们的纪念消失”，但这不是该动词通常的词义。
    reason: lexical_alternative
  - marker: b
    text: “地上”也可译作“那地”。
    reason: lexical_alternative
  - marker: c
    text: 希腊语字面意思是“不惊叹面孔”，是指审判时不因人的身份、地位或外表而偏袒。
    reason: idiom
lexical_decisions:
- source_word: ἐδήλωσας
  choice: 使……显明出来
  rationale: 该动词通常意为“使人知道、显明、揭示”。虽然它与本句其余部分的搭配不寻常，仍按现存希腊文本翻译，不以“除灭、消失”等未经文本支持的意思取代。
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: 他们的纪念
  rationale: μνημόσυνον可指纪念、记念或留在人心中的记忆；“他们的纪念”既保留名词性质，也不预先断定是主观记忆还是客观纪念物。
- source_word: ἀπὸ τῆς γῆς
  choice: 从地上
  rationale: ἀπό表示“从”，γῆ可指大地或土地。“从地上”保留原文介词关系及较广泛的空间含义，尽管整句表达较为费解。
- source_word: κριτὴς δίκαιος
  choice: 公义的审判者
  rationale: 兼顾司法语境和道德上的正直，是该短语自然且庄重的对应表达。
- source_word: οὐ θαυμάσει πρόσωπον
  choice: 必不偏待人
  rationale: 字面为“不惊叹面孔”，实际是审判语境中不因人的身份、外表或地位而徇私的习语；“不偏待人”清楚传达其含义。
theological_decisions:
- issue: 如何处理首句中词义清楚而整体搭配异常的表达
  choice: 按现存希腊文本译为“使他们的纪念从地上显明出来”，并用脚注说明其异常之处
  alternative: 你使他们的纪念从地上消失／你从地上除灭了对他们的记念
  rationale: “消失”或“除灭”较符合某些人对上下文的理解，却与ἐδήλωσας通常的词义相反，等同于无抄本依据地修正文句。正文因此保留原文的张力，不擅自解决其难点。
- issue: 如何表达上帝审判时不看人的情面
  choice: 必不偏待人
  alternative: 必不看人的情面／必不以貌取人
  rationale: 选择现代读者容易理解且适合司法语境的说法，不把经文扩展成某一特定教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句有意保留现存希腊文本的异常表达，不以更顺畅却缺乏词汇依据的“除灭”或“消失”代替；次句则以自然汉语翻译司法习语。
