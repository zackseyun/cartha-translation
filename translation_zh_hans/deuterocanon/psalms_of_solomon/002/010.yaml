lexical_decisions:
- source_word: οὐρανός
  choice: 天
  rationale: 与γῆ“地”构成“天—地”的宇宙性对应；“天”既自然，也保留可指天空或诸天的语义幅度。
- source_word: ἐβαρύνθησεν
  choice: 沉重不堪
  rationale: 保留βαρύνω所表达的沉重、受压意象，同时避免把它具体解释为天色阴沉或暴雨将至。
- source_word: γῆ
  choice: 地
  rationale: 在与“天”并列的结构中指整个大地，而非某一局部地区。
- source_word: ἐβδελύξατο
  choice: 憎恶
  rationale: 表达强烈的厌弃与反感，并保持庄重的诗体语域。
- source_word: αὐτούς
  choice: 他们
  rationale: 如实译出阳性复数宾格代词，所指由上下文确定。
