lexical_decisions:
- source_word: ἐξουδενώθη
  choice: 被藐视
  rationale: 该被动动词表示被视为无足轻重、被轻蔑；“被藐视”自然凝练，也保留羞辱意味。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 贴近希腊语空间兼评价性的表达，既可指处于上帝面前，也可含在上帝看来之意。
- source_word: ἠτιμώθη
  choice: 蒙羞
  rationale: 该词表示失去尊荣、受到羞辱；“蒙羞”符合庄重诗体，并与前句形成平行。
- source_word: ἕως εἰς τέλος
  choice: 到底
  rationale: 直译其“直到终局/尽头”的表达，保留其可能表示时间持续或程度彻底的歧义，不径直改写为“彻底”。
theological_decisions:
- issue: 未明说的中性单数主语
  choice: 它
  alternative: 他
  rationale: 两个动词本身不明示主语性别，但上下文所承接的对象宜用中性指代；译作“它”避免误指前文的人物。
- issue: ἕως εἰς τέλος 的范围
  choice: 蒙羞到底
  alternative: 彻底蒙羞
  rationale: “到底”保留时间终点与程度极致之间的张力；“彻底”只保留程度解释。
translation_notes:
  register: 采用现代、庄重而简洁的诗体。主句保持希腊文两个被动分句的平行结构；“上帝”用于 θεός。
