  text: And you set your name upon us, O Lord; and you will never remove it.
translation:
  language: zh_hans
  text: 主啊，你将你的名放在我们身上；你必不使它止息，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθου τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: 你把你的名加在我们身上
  rationale: 直译“你将你的名放在我们之上/身上”，表达归属与认定；“加在……身上”在现代汉语中较自然，也保留原文意象。
- source_word: οὐ καταπαύσεις
  choice: 你必不将它除去
  rationale: καταπαύω基本义为“使停止、使止息”；在“名加在我们身上”的语境中，以“除去”传达不使这一名分终止，并与主语第二人称一致。
- source_word: τὸν αἰῶνα
  choice: 永远
  rationale: 此处作时间副词性用法，表示“直到永远/永不”，译为“永远”简洁自然。
theological_decisions:
- issue: “你的名”所表达的关系
  choice: 保留“把你的名加在我们身上”的具象说法
  alternative: 译作“使我们归在你名下”
  rationale: 原文没有明说这是所有权、盟约身份、保护还是称名；保留意象可避免把其神学含义限定为单一解释。
- issue: οὐ καταπαύσεις的宾语与语义补足
  choice: 补出“它”，指代上文的“你的名”
  alternative: 译作“这必永不止息”
  rationale: 希腊文动词为第二人称单数，明确以主为施事者；译成“你必不将它除去”保留这一点，同时按上下文补明省略的宾语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留直接呼告“主啊”，分号对应原文两个紧密相连的分句。
