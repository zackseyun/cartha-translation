base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: zh_hans
  text: 如今，你是上帝；我们是你所爱的子民。以色列的上帝啊，求你垂顾、怜悯，因为我们属于你。求你不要从我们收回你的怜悯，免得他们攻击我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: 如今
  rationale: 既保留时间与承接意味，也符合现代汉语祷告语体。
- source_word: λαὸς σοῦ ὃν ἠγάπησας
  choice: 你所爱的子民
  rationale: 忠实表达关系从句及过去时动词，不额外限定所指时期。
- source_word: ἴδε
  choice: 求你垂顾
  rationale: 字面为“看”，在向上帝祈求的语境中，“垂顾”自然庄重，并保留求上帝察看的含义。
- source_word: οἰκτείρησον
  choice: 怜悯
  rationale: 直接表达带同情、怜恤之意的命令式祈求。
- source_word: ὅτι σοί ἐσμεν
  choice: 因为我们属于你
  rationale: 自然表达与格所有结构，同时保留归属关系。
- source_word: ἔλεός σου
  choice: 你的慈爱
  rationale: “慈爱”兼顾怜悯、恩慈与持续眷顾的语义，适合盟约群体祷告语境。
- source_word: μὴ ἀποστῇς
  choice: 不要……收回
  rationale: 表达使某物离开、撤去之意；汉语中与“慈爱”搭配自然。
- source_word: ἐπιθῶνται ἡμῖν
  choice: 他们攻击我们
  rationale: 该中间语态动词在此表示敌对地扑向、进攻；“攻击”保留明确威胁而不添加敌人的身份。
theological_decisions:
- issue: “你是上帝”是否增补排他性或称号解释
  choice: 你是上帝
  alternative: 唯有你是上帝
  rationale: 原文没有“唯有”；保留简洁陈述，避免将可能隐含的强调明文化。
- issue: “你所爱的”之时间与持续性
  choice: 你所爱的
  alternative: 你所爱着的／你曾爱过的
  rationale: 希腊语使用不定过去时，但此处不必推断爱已经终止，也不应强行改为持续体；汉语“所爱的”可自然保留这种张力。
- issue: 末句主语“他们”的身份
  choice: 他们
  alternative: 仇敌／列国
  rationale: 原文只以第三人称复数动词标示未明说的主语；不擅自确定其身份。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以“求你”自然承载希腊语命令式在祈祷中的恳求功能。保留末句“他们”指代不明的状态，不作解释性增补。
