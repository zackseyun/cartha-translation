base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/015.yaml
  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: zh_hans
  text: 你必赐福给义人，也不因他们所犯的罪追究他们；你的恩慈也临到犯罪而悔悟的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔悟”也可译作“心有悔意”或“懊悔”；原词既可侧重后悔，也可包含转意悔改的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: 义人
  rationale: 该形容词在此作名词使用，指具有正义或正直特征的人；“义人”简洁、庄重，也符合本节宗教伦理语境。
- source_word: εὐλογήσεις
  choice: 必赐福给
  rationale: 保留希腊语将来时；“赐福”准确传达 εὐλογέω 在宗教语境中的含义，“必”自然体现其将来指向。
- source_word: οὐκ εὐθύνεις
  choice: 不……追究
  rationale: 按现有文本的重音，εὐθύνεις 是现在时，而非将来时；“追究”保留要求人为过犯负责的司法意味，同时符合现代汉语表达。
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: 因他们所犯的罪
  rationale: 希腊语直指他们曾犯罪的事项；汉语以“所犯的罪”表达最自然，并保留不追究既往过犯的含义。
- source_word: χρηστότης
  choice: 恩慈
  rationale: 该词兼有良善、仁厚与善待之意；“恩慈”既体现品格，也保留上帝向人施予善意的关系性。
- source_word: ἁμαρτάνοντας
  choice: 犯罪……的人
  rationale: 采用动词性表达，不把有关的人固定标签化为“罪人”，并与后面的悔悟状态自然衔接。
- source_word: ἐν μεταμελείᾳ
  choice: 而悔悟
  rationale: 原短语表示处于后悔、悔悟或悔改之中；译作“而悔悟”可避免产生“在悔改的同时犯罪”的误解，同时以脚注保留其词义幅度。
theological_decisions:
- issue: “义人”仍曾犯罪所形成的张力
  choice: 保留“义人”与“他们所犯的罪”并列
  alternative: 将“义人”解释为完全无罪的人，或把后半句改指另一群人
  rationale: 希腊文中的复数代词由动词隐含，最自然地回指“义人”；经文同时称他们为义人并承认他们曾犯罪，不宜在译文中消除这一张力。
- issue: 悔悟与上帝恩慈之间的关系
  choice: 译为“恩慈也临到犯罪而悔悟的人”
  alternative: 明确译成“因他们悔改，所以施恩”
  rationale: 原文说明恩慈所临到的对象，却没有明说悔改是赚取恩慈的原因；译文不额外建立因果或功德关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必赐福给”与“不……追究”保留原文由将来时转为现在时的变化；分号对应两个紧密相关但句法上相对独立的陈述。
