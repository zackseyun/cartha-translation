  text: For you are a righteous judge over all the peoples of the earth[a].
translation:
  language: zh_hans
  text: 因为你是全地万民之上的公义审判者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上所有的族群”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出前文陈述的理由；“因为”自然保留了希腊文的因果作用。
- source_word: κριτὴς δίκαιος
  choice: 公义的审判者
  rationale: κριτής指施行审判者，δίκαιος兼有正直、公正和合乎义的意味；此译保留对上帝品格及审判公正性的强调。
- source_word: ἐπὶ πάντας τοὺς λαοὺς
  choice: 审判……万民
  rationale: ἐπί在此表示审判权所及的对象或范围；中文补出“审判”可自然表达审判者对万民行使权柄的含义。“万民”简洁保留λαοί复数所指的各族群。
- source_word: τῆς γῆς
  choice: 地上的
  rationale: 在涵盖所有族群的普世性陈述中，γῆς宜理解为全地，而非某一局部地域。
theological_decisions:
- issue: “公义”是否仅指司法公正
  choice: 公义的审判者
  alternative: 公正的审判者
  rationale: “公义”既包含判决公正，也保留δίκαιος描述上帝道德品格的较宽含义，不将其缩减为纯司法概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万民”符合经文语域；为避免“在万民之上”在现代中文中只被理解为空间或地位关系，正文自然补出“审判”，明确ἐπί在此所表达的审判范围。
