  text: And to whom will he forgive sins, if not to those who have sinned?
translation:
  language: zh_hans
  text: 除了那些犯过罪的人，他还会赦免谁的罪呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  choice: 会赦免
  rationale: ἀφίημι在“罪”的语境中表示“赦免”。用“赦免”既符合现代汉语的圣经语体，也保留其人际与宗教含义；未来时在反问句中自然译作“会赦免”。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 复数ἁμαρτίας直接指各种罪；汉语通常以集合性的“罪”表达，不必机械加上复数标记。
- source_word: τοῖς ἡμαρτηκόσι
  choice: 那些犯过罪的人
  rationale: 完成时主动分词强调这些人确实犯过罪。译为“那些犯过罪的人”保留其动词性，避免把人固定标签化为“罪人”。
- source_word: τίνι
  choice: 谁
  rationale: 希腊语与格在ἀφίημι结构中标示获赦免者；汉语采用“赦免谁的罪”的自然结构，无须另译介词。
- source_word: εἰ μὴ
  choice: 若不是……呢
  rationale: 在反问中表示“如果不是……还能是谁”，译文通过“若不是……还会……谁……呢”保留排他意味和反问力度。
theological_decisions:
- issue: 神赦罪的对象范围
  choice: 保留反问，表明赦免所面对的正是实际犯过罪的人。
  alternative: 理解为赦免仅特别指向已经自觉有罪的人。
  rationale: 原文只明说获赦者是犯过罪的人，并未加入他们是否已经认罪或自觉有罪等条件，因此不在译文中扩展其教义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“若不是……还会……谁……呢”重现希腊文反问结构；“犯过罪的人”准确保留完成时分词的动词性。无需脚注。
