  text: For everyone who does unjust deeds will not be hidden from your knowledge[b][a],
translation:
  language: zh_hans
  text: 因为凡行不义之事的人，都不能在你所知之外隐藏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为凡行不义之事的人，都不能瞒过你。”
    reason: 提供较自然的汉语表达；正文保留原文“隐藏”与“知识”的意象。
lexical_decisions:
- source_word: κρυβήσεται
  choice: 隐藏
  rationale: 保留未来被动式所表达的“被隐藏”意象，而不把它完全意译为“逃过察看”。汉语借助“不能”自然表达 οὐ 与未来式结合的否定含义。
- source_word: γνώσεώς σου
  choice: 你的知悉
  rationale: γνῶσις 的基本义是“知识、知悉”。这里采用“知悉”，既保留认知含义，又比“你的知识”更自然地指没有任何事能处于上帝所知之外。
- source_word: πᾶς ποιῶν ἄδικα
  choice: 凡行不义之事的
  rationale: “凡……的”直接保留 πᾶς 的周遍范围；“行……之事”反映 ποιῶν 与中性复数 ἄδικα，而不改写为“没有人”。
- source_word: ἄδικα
  choice: 不义之事
  rationale: “不义”保留 ἄδικος 词族与本诗“义／不义”主题的联系，也比笼统的“错事”更能传达其伦理和审判色彩。
theological_decisions:
- issue: 上帝的全知与人的行为无法隐藏
  choice: 都不能在你的知悉之外隐藏
  alternative: 没有一个行不义的人能逃过你的察看
  rationale: 正文维持原文“隐藏／知识”的措辞和意象，不将其进一步解释为系统性的全知教义，也不把行为主体改写成人本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的，都……”保留希腊文的普遍陈述；“不义之事”与全诗义／不义的神学词汇链相呼应。
