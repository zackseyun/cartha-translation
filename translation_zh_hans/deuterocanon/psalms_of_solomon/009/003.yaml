  yaml_path: translation/deuterocanon/psalms_of_solomon/009/003.yaml
  text: So that you may be vindicated[a], O God, in your righteousness amid our lawless deeds[c][b];
translation:
  language: zh_hans
  text: 好使你在我们的不法之事中，在你的公义中得显为义，上帝啊。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得显为义”或译“被称为义”、“被证实为义”。
    reason: lexical_alternative
  - marker: b
    text: “在你的公义中”也可译“按你的公义”或“凭你的公义”；全句后半也可理解为：“就我们的不法之事而言，在你的公义中得显为义。”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好使
  rationale: 保留目的或结果意味，并与这一诗句承接上文的句法功能相称。
- source_word: δικαιωθῇς
  choice: 显为正直
  rationale: 这是不定过去时被动虚拟语气；以上帝为主语时，重点不是上帝变得正直，而是他的正直得到显明或承认。此译也比直接译作“被称义”更符合现代汉语。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 希腊文虽为主格形式，在此作呼语；句末加“啊”自然表达祷告中的直接称呼。
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: 按你的公义
  rationale: ἐν可表达所凭借的根据或领域；“按”在中文中自然呈现上帝的公义是其显为正直的准则，同时脚注保留较形式对应的译法。
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: 在我们的不法之事中
  rationale: 尽量直接保留第二个ἐν的空间／处境意象，也保留它可能表示“就……而言”的歧义；“不法之事”反映ἀνομία所含违背律法、悖逆的力度。
theological_decisions:
- issue: 以上帝为主语时如何翻译δικαιωθῇς
  choice: 显为正直
  alternative: 被判为正直；被证实为正义
  rationale: 避免暗示上帝原先不正直、后来才获得正直，同时保留被动式所表达的公开判明或承认。
- issue: δικαιοσύνη应译作“公义”还是“公正”
  choice: 公义
  alternative: 公正
  rationale: “公义”能涵盖道德正直与审判公正，是圣经语域中自然且较宽的对应词；“公正”作为司法语境下的可能理解收入脚注。
- issue: 两个ἐν短语之间的关系
  choice: “在我们的不法之事中，按你的公义”
  alternative: “就我们的不法之事而言，在你的公义中”
  rationale: 主文贴近介词的表层结构，不把第二个ἐν明确解释成因果或论题关系，从而保留原文的紧缩与歧义。
translation_notes:
  register: 采用庄重而现代的祷告语体。“好使”表明本节在句法上承接上文；呼语“上帝啊”置于句末，使中文顺畅，并未改变希腊文的称呼功能。
