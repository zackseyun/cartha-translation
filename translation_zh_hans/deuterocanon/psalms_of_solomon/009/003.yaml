  terminology: “上帝”“公义”“不法之事”均合适。对于δικαιωθῇς，采用“得显为义”能表达被动式中上帝的义被显明／证实，避免“被判为正直”所带来的不必要司法裁定色彩；脚注保留“被称为义”“被证实为义”等可行替代。
