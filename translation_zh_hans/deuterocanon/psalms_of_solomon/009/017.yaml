    reason: alternative_reading
lexical_decisions:
- source_word: ἡρέτισω
  choice: 拣选了
  rationale: 该动词表示选择、选定；“拣选”在庄重的现代汉语中清楚表达主动选择，也保留本句的神学分量，而不额外引入后世教义。
- source_word: σπέρμα
  choice: 后裔
  rationale: 原词字面为“种子”，此处是集合性用法，指亚伯拉罕的后代。“后裔”自然且庄重，并比“子孙”更能保留其整体性。
- source_word: παρὰ
  choice: 过于
  rationale: παρά后接宾格，在这里具有比较或优先之意。“过于万国”保留了选择上的优先意味，同时不把它解释成地位或权力上的高低。
- source_word: ἔθνη
  choice: 万国
  rationale: ἔθνη在此泛指所有国家或民族。“万国”简洁庄重，也避免用“外邦人”加入原文未必要求的宗教群体对立。
theological_decisions:
- issue: 亚伯拉罕后裔与万国之间的拣选关系
  choice: 直译为上帝拣选亚伯拉罕的后裔“过于万国”
  alternative: 上帝从万国中分别出亚伯拉罕的后裔
  rationale: 原句明确表达选择及比较性的优先，但παρά的关系仍可有不同理解。正文保留优先于万国的力度，不将其弱化为单纯分别出来，也不扩展为后世的系统教义。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“拣选”保留经文语体，“后裔”和“万国”均易于普通读者理解；句法尽量贴近希腊文，同时以脚注保留παρά的解释空间。
