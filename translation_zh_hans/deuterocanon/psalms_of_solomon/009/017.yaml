translation:
  language: zh_hans
  text: 因为你拣选了亚伯拉罕的后裔[a]，过于万国[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“亚伯拉罕的种子”，也可译“亚伯拉罕的子孙”。
    reason: lexical_alternative
  - marker: b
