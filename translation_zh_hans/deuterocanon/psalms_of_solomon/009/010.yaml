lexical_decisions:
- source_word: κρίματα
  choice: 判决
  rationale: 指司法性的裁断或审判行动；“判决”保留法律与道德意味，又不局限于口头命令。
- source_word: Κυρίου
  choice: 主
  rationale: κύριος在此按通常用法译为“主”，上下文没有要求采用其他称谓。
- source_word: ἐν δικαιοσύνῃ
  choice: 按公义
  rationale: 保留δικαιοσύνη的名词形式及其与上下文可能形成的词汇呼应，同时以自然汉语表达这些判决的公义性质或施行方式。
- source_word: κατʼ ἄνδρα
  choice: 临到各人
  rationale: κατά加宾格在这里很可能具有逐一分配的意义；“各人”表达按个人分别施行，“临到”使全句在汉语中自然，并保留其对象指向。
- source_word: οἶκον
  choice: 各家
  rationale: οἶκος字面为“房屋”，也常指家庭或家户；“各家”在汉语中简洁表达其社会群体意义，并与“各人”构成分配关系。
theological_decisions:
- issue: ἐν δικαιοσύνῃ说明判决的性质还是施行方式
  choice: 译为“按公义”，不明确限定为系表结构或方式状语
  alternative: “是公义的”或“在公义中”
  rationale: 希腊文介词短语可强调判决具有公义，也可强调判决按公义施行；“按公义”在自然汉语中保留这层张力，并维持δικαιοσύνη的名词意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“各人和各家”简洁体现个人与家户两个层面；“按公义临到”避免生硬照译“在公义中”，同时保留原文名词δικαιοσύνη及介词短语的表达特点。
