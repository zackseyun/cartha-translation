  text: 因为主的判决按公义，分别针对各人和各家[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“按着人和家”；这里很可能具有分配意义，指分别针对每一个人和每一个家。
    reason: lexical_alternative
