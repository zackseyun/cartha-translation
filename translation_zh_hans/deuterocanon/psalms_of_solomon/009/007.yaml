  rationale: 修订以“在……范围之内”对应ἐν，避免将原文的范围性表述强化为决定论式因果关系；以“选择和权能”对应ἐκλογῇ καὶ ἐξουσίᾳ；并以“公义／不义”保留原文道德对举。脚注继续标示τοῦ ποιῆσαι的语法关系并未定于单一解释。
