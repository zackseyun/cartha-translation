  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: zh_hans
  text: 我们的行为，在我们心灵的选择和权能范围之内；我们能借着双手所做的事行公义，也行不义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们能……行”也可译作“为要……行”或“以……行”；原文不定式可表示能力的内容，也可表示行动的目的。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: 我们的行为
  rationale: “行为”自然表达具有道德意义的行动，同时保留 ἔργα 的实际作为之意。
- source_word: ἐν ἐκλογῇ
  choice: 取决于……选择
  rationale: 此处指人的选择或道德抉择，不是神学意义上的“拣选”；用“取决于”表达 ἐν 在此所示的范围与归属关系。
- source_word: ἐξουσίᾳ
  choice: 支配能力
  rationale: ἐξουσία 可指权柄、支配权或行使行动的能力；“支配能力”在现代汉语中既避免制度性“权柄”的误解，也保留人能自主采取行动的含义。
- source_word: τῆς ψυχῆς ἡμῶν
  choice: 我们心灵的
  rationale: ψυχή 在这里指内在作出道德选择的主体；“心灵”比“灵魂”更自然，也不额外引入灵魂本体论。
- source_word: τοῦ ποιῆσαι
  choice: 使我们能……行
  rationale: 希腊语属格不定式可表达结果、目的或能力范围；此译法与前面的选择和支配能力衔接，同时不将其缩减为单纯许可。
- source_word: δικαιοσύνην
  choice: 正义
  rationale: δικαιοσύνη 在此与 ἀδικία 构成直接的道德对举；“正义／不义”简明、庄重，并能涵盖行为的正当性。
- source_word: ἀδικίαν
  choice: 不义
  rationale: 与“正义”形成词形和意义上的鲜明对照，并避免仅限于司法或社会层面的“非正义”。
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: 以双手所做的事
  rationale: 保留“我们的手所做之工”的具体身体意象，同时使中文通顺；工具格用“以”表达。
theological_decisions:
- issue: 本节强烈肯定人的道德能动性与责任。
  choice: 译作行为取决于心灵的“选择和支配能力”，并明确可行正义或不义。
  alternative: 我们的行为在我们心灵的选择和权柄之中。
  rationale: 原文将正义和不义两种行为都置于人的选择与 ἐξουσία 范围内。译文保留这一张力，不把它弱化为抽象自由，也不据此引入后世关于自由意志的特定教义体系。
- issue: τοῦ ποιῆσαι 的逻辑关系可理解为目的、结果或能力内容。
  choice: 使我们能……行
  alternative: 为要行……；以行……
  rationale: “使我们能”顺应 ἐξουσία 所含的实际行动能力，但脚注注明原文结构也可作目的性理解，以保留语法上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心灵”表达内在道德主体；“双手所做的事”保留原文具体意象。脚注标记置于整句末尾，对应 τοῦ ποιῆσαι 的语法歧义。
