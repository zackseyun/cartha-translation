  naturalness: 原译总体通顺，但“使我们能以双手所做的事行正义或行不义”中“使我们能”使句法关系显得较绕。改为“在……范围之内；我们能借着……”更符合现代庄重汉语，也清晰呈现后面不定式的能力／目的开放性。
  terminology: “公义／不义”在此比“正义／不义”更适合保留δικαιοσύνη／ἀδικία作为广义道德对举的宗教文本语域，且不将“正义”主要理解为社会或司法正义。“心灵”可保留；“权能”对应ἐξουσία，避免把它窄化为“支配能力”。
