  text: To whom will you show kindness[a], O God[b], if not to those who call on the Lord?
translation:
  language: zh_hans
  text: 上帝啊，除了那些求告主的人，你还会向谁施恩呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνι
  choice: 向谁
  rationale: 与施予善意的动词自然搭配，并保留反问所追问的受惠对象。
- source_word: χρηστεύσῃ
  choice: 施恩
  rationale: 表达以仁慈善待人的行动；“施恩”庄重自然，又不将词义过度限定为特定的圣约恩惠。第二人称单数形式译为“你……会”。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 带冠词的主格名词在此作称呼语，与第二人称动词呼应；“啊”清楚标明直接呼告。
- source_word: ἐπικαλουμένοις
  choice: 那些求告……的人
  rationale: 该分词指向主呼求、祈求的人；“求告”既自然，也保留宗教语境中的祈求含义。
- source_word: κύριον
  choice: 主
  rationale: 在宗教语境中按其通常称号译作“主”，作为求告的对象。
theological_decisions:
- issue: “上帝”在句中的语法身份
  choice: 按称呼语处理：“上帝啊”
  alternative: 按主语处理：“上帝会……”
  rationale: χρηστεύσῃ为第二人称单数，ὁ θεός则是希腊化时期常见的主格代称呼语用法；上下文也是直接向上帝说话。
- issue: 反问的力度
  choice: 以“除了……还会向谁……呢？”保留反问
  alternative: 改写为陈述句：“你只向……施恩”
  rationale: 原文以εἰ μή构成排除性的反问；不应将其直接化为逻辑更绝对的陈述，以免消除原有修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句序顺应汉语表达，将呼语置于句首；保留原文的直接呼告和排除性反问。
