  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: zh_hans
  text: 他们被赶离了主赐给他们的产业；以色列的流散遍及各国[a]，正如上帝所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列流散在各国。”
    reason: 词汇与句法上的另一种译法；希腊文用“流散”这一名词，中文也可自然地改写为动词句。
lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: 被赶离
  rationale: 该不定过去时被动形式表达遭受强制排斥、驱逐；结合离开所得产业的语境，“被赶离”比单纯的“被拒绝”更准确，也比“被抛弃”更明确地体现迁离。
- source_word: κληρονομίας
  choice: 产业
  rationale: 此处指主赐给以色列的承受之地或盟约性份额。“产业”是现代中文圣经语体中自然且有神学分量的对应，也不把所指范围限死为土地。
- source_word: Κύριος
  choice: 主
  rationale: 此处指以色列的上帝；“主”保留 κύριος 的常规称谓及盟约语境。
- source_word: διασπορὰ
  choice: 流散
  rationale: 保留希腊文名词形式，并表达以色列人散居列国的状态；“流散”兼具被迫离散与分布各地的含义。
- source_word: ῥῆμα
  choice: 所说的
  rationale: ῥῆμα 可指话语、宣告或谕令。此处采用自然中文表达“正如上帝所说的”，保留神圣话语已经宣告此事的含义，而不窄化为“命令”或“判决”。
theological_decisions:
- issue: 是否把名词短语“以色列的流散”改写为动词句“以色列流散在各国”
  choice: 正文保留名词概念，以“以色列的流散遍及各国”表达
  alternative: 以色列流散在各国
  rationale: 希腊文 διασπορά 是名词；正文尽量保留这一结构，同时用“遍及”使现代中文通顺。脚注列出动词式译法，以呈现自然的另一种理解。
- issue: κατὰ τὸ ῥῆμα τοῦ θεοῦ 所表达的是符合话语还是依照命令
  choice: 正如上帝所说的
  alternative: 按照上帝的话
  rationale: κατά 可表示依照、符合；ῥῆμα 可指话语或宣告。选择“正如上帝所说的”在中文中较自然，并避免将其专门解释为上帝下令造成流散。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“产业”“主”“上帝”保持经文语域；分号保留两分句之间紧密的因果与陈述联系。
