translation:
  language: zh_hans
  text: 你以自己的公义察看世人[a][b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”直译为“人的儿子们”，是指人类。
    reason: lexical_alternative
  - marker: b
    text: “察看”也可译为“探访”或“眷顾”；在本段审判语境中，也可理解为“鉴察”或上帝临到世人。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 这里指上帝行事所依循的正直、公正属性；“公义”既符合上下文的审判语境，也保留该词的神学内涵。
- source_word: ἐπεσκέπτῃ
  choice: 察看
  rationale: 该动词可表示探访、查看、鉴察或眷顾。上下文强调上帝公义的审察，但本节动词本身仍有一定幅度；“察看”既能承载审视意味，又不过度限定为惩罚性的“审问”。
- source_word: υἱοὺς ἀνθρώπων
  choice: 世人
  rationale: 这是闪语色彩浓厚的惯用语，整体指全人类。现代汉语以“世人”自然表达其集体、普遍所指，避免生硬直译为“人的儿子们”。
theological_decisions:
- issue: ἐπισκέπτομαι在公义审判语境中的含义
  choice: 察看
  alternative: 眷顾；鉴察；临到
  rationale: 邻近经文突出上帝的审判和人无法逃避其审视，因此译文应保留司法性的察验意味；但原词也可指探访或关怀，故脚注保留其他可能，不把含义缩窄为单纯惩罚。
- issue: υἱοὺς ἀνθρώπων的性别与范围
  choice: 世人
  alternative: 人的众子；人类
  rationale: 该短语是指全体人类的传统表达，并非只指男性。汉语“世人”准确传达其普遍范围，同时保持庄重、简洁。
translation_notes:
  register: 采用现代、庄重而简洁的经文体。“你在你的公义中”保留希腊文介词结构及其强调；“察看”兼顾原词的探访与审察语义，并借脚注保存歧义。
