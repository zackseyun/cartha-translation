translation:
  language: zh_hans
  text: 主啊，你敬虔之人的义行都在你面前；上帝啊，人能躲到哪里，不被你知晓呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύναι
  choice: 义行
  rationale: 该词为复数，在此指虔诚之人所行的正义之事；译作“义行”既体现具体行为，也比生硬的“诸义”更符合现代汉语。
- source_word: ὁσίων
  choice: 虔诚之人
  rationale: ὅσιος强调对上帝忠诚、敬虔的人；译作“虔诚之人”可避免把它与一般表示“圣洁”的词完全等同。
- source_word: ἐνώπιόν σου
  choice: 在你面前
  rationale: 保留希腊文空间意象，同时自然表达这些义行显明于上帝眼前。
- source_word: κρυβήσεται
  choice: 躲过
  rationale: 原文为将来时、被动形式但具有不及物意义“隐藏自己”；结合ἀπὸ τῆς γνώσεώς σου，现代汉语用“躲过”自然表达无法逃避上帝知晓。
- source_word: γνώσεώς σου
  choice: 你的知晓
  rationale: γνῶσις可指知识或认识；此处是上帝无所不知、无人能隐藏的语境。“知晓”保留认知含义，又适合动态句式。
- source_word: Κύριε / ὁ θεός
  choice: 主啊 / 上帝啊
  rationale: 分别对应两个呼格称谓；ὁ θεός虽带冠词，但在呼格用法中自然译为“上帝啊”。
theological_decisions:
- issue: δικαιοσύναι是抽象的“义”还是具体的“义行”
  choice: 义行
  alternative: 诸般公义／义
  rationale: 复数形式和属格“你虔诚之人的”更可能指他们所行的正义行为；译文不据此宣称这些行为具有任何特定的救恩功效。
- issue: “在你面前”的含义
  choice: 保留原有表述，不增补“蒙悦纳”或“被记念”
  alternative: 蒙你悦纳／被你记念
  rationale: 原文只陈述这些义行在上帝面前，未明确说明悦纳、奖赏或记功，因此不作神学性增译。
- issue: 无人能躲避上帝的γνῶσις
  choice: 谁能躲过你的知晓呢
  alternative: 人在哪里能躲开你的知识呢
  rationale: 以反问保留原文张力，表达无人能逃避上帝的认知，却不额外界定其为某一套系统神学意义上的全知论述。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。纠正英语咨询层中的明显重复损坏，直接依据希腊文翻译。两个神称呼分别置于分句开头，以符合自然汉语呼语习惯；全节不需脚注。
