  text: 主的怜悯临到以色列家，直到永远，仍不止息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到永远，而且仍要继续。”希腊语在“直到永远”之后又加上“还、仍然”，进一步加强其延续不止的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 以现代汉语所有格自然表达属格关系；“主”保留 κύριος 的庄重称谓。
- source_word: ἐλεημοσύνη
  choice: 怜悯
  rationale: 此处指主向以色列所施的慈悲与恩待；“怜悯”既简洁自然，也保留其宗教语境中的分量。
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: 临到以色列家
  rationale: ἐπί 加宾格表达指向或施及的对象；“临到”保留恩慈施于以色列的动态意象，“以色列家”保留 οἶκος 的群体称谓。
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: 直到永远，永无止境
  rationale: “直到永远”对应 εἰς τὸν αἰῶνα，“永无止境”传达 καὶ ἔτι 在“永远”之外继续加强延续性的语气，同时避免生硬直译。
