  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
translation:
  language: zh_hans
  text: 以色列被掳流放到异乡时；他们离弃[a]那位救赎他们的主时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开”“背离”或“背叛”主。
    reason: ἀποστῆναι 可泛指离开，也可指宗教或盟约意义上的背离、叛离。
lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: 被掳
  rationale: 该被动不定式表示被带走；在以色列遭放逐的语境中，“被掳”自然地传达非自愿的迁移，又不额外限定施行者。
- source_word: ἀποικεσίᾳ
  choice: 流放
  rationale: 此词在本句中指离开故土、居于异地的放逐处境；“流放”能与“被掳”配合，清楚表达这一历史处境。
- source_word: γῆν ἀλλοτρίαν
  choice: 异乡
  rationale: 原短语指不属于以色列本土的外地；“异乡”是现代汉语中自然、庄重而简洁的表达。
- source_word: ἀποστῆναι
  choice: 离弃
  rationale: 该动词既可表示离开，也可表示背离或叛离。“离弃”在关系和盟约语境中表达方向性的疏离；脚注保留较中性和较强烈的其他理解。
- source_word: Κυρίου
  choice: 主
  rationale: “主”是 κύριος 在此神圣、盟约语境中的标准汉语译法。
- source_word: τοῦ λυτρωσαμένου
  choice: 那位救赎……的
  rationale: 该分词将主描述为已经施行救赎的那一位；“救赎”保留了解救、赎回及盟约性的内涵。
theological_decisions:
- issue: ἀποστῆναι 所表达的是一般离开还是信仰上的背叛
  choice: 正文译作“离弃”
  alternative: “离开”“背离”或“背叛”
  rationale: “离弃”既符合从主而去的方向性，也能传达关系破裂，却不像“背叛”那样完全锁定为最强烈的叛教含义；脚注明确保留原词的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“被掳，流放到异乡”保留原文被动迁移与放逐处境；两个“……时”对应原文重复的 ἐν τῷ 结构。句末保留逗号，以反映本节在原文中尚未完结的句法。
