  text: For shame is upon us and upon our faces because of all this[a][b].
translation:
  language: zh_hans
  text: 因为这一切，羞耻落在我们身上，也落在我们的脸上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为这一切”也可译作“关于这一切”或“因一切的事”。希腊语短语既可表示所涉及的事情，也可按语境表示羞耻的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出羞耻的缘由；现代汉语用“因为”自然地保留解释或因果作用。
- source_word: αἰσχύνη
  choice: 羞耻
  rationale: 直接保留原词所含的羞愧与失去颜面的意义，不强化为更重的“耻辱”。
- source_word: ἡμῖν καὶ τοῖς προσώποις ἡμῶν
  choice: 落在我们身上，也落在我们的脸上
  rationale: 把两个并列与格都置于同一个主语“羞耻”之下，保留希腊文的平行结构和“脸”的具体意象；“落在……身上”在现代汉语中也较为自然。
- source_word: περὶ ἁπάντων
  choice: 因为这一切
  rationale: 结合本句羞耻的语境，将 περὶ 表达为缘由；“这一切”以汉语自然方式概括前文所述全部事情，同时在脚注中保留“关于一切”的形式可能。
