base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/009.yaml
  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
translation:
  language: zh_hans
  text: 行义的人，为自己在主那里积存生命[a][b]；行不义的人，自己要为灵魂在灭亡中负责[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“正义”或“公义”。
    reason: lexical_alternative
  - marker: b
    text: “在主那里”也可译作“在主面前”或“从主那里”。
    reason: lexical_alternative
  - marker: c
    text: “灵魂”也可理解为“生命”或“自己”。
    reason: lexical_alternative
  - marker: d
    text: 末句原文十分凝练；也可译作：“自己要对灵魂的灭亡负责”、“自己要为自己在灭亡中负责”，或“自己因灵魂处于灭亡中而有罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: 行……的人
  rationale: 名词化现在分词表达泛指的行为者；中文用“行……的人”自然简洁，也不额外强化为持续性的“惯行”。
- source_word: δικαιοσύνην
  choice: 正义
  rationale: 在与ἀδικίαν的伦理对照中，“正义”兼顾正直与公义行为；脚注说明“义”也是可行译法。
- source_word: θησαυρίζει
  choice: 积存
  rationale: 保留储藏财宝的意象，同时符合现代汉语表达。
- source_word: ζωὴν
  choice: 生命
  rationale: 直译该无冠词名词，并保留其在智慧传统中可能包含今生与终极生命的宽度。
- source_word: αὐτῷ
  choice: 为自己
  rationale: 此处与行为者形成反身关系，也与后半句个人承担后果相呼应。
- source_word: παρὰ Κυρίῳ
  choice: 在主那里
  rationale: παρά加与格可表示在某人身边、面前或与其相关；“在主那里”自然保留空间及关系含义，而不武断译成来源性的“从主而来”。
- source_word: ἀδικίαν
  choice: 不义
  rationale: 与“正义”构成紧密反义对照，且比泛化的“作恶”更贴近原词。
- source_word: αἴτιος
  choice: 负责
  rationale: 表达行为者应承担责任或罪责；中文“负责”清楚而不过度限定为法律定罪。
- source_word: τῆς ψυχῆς
  choice: 灵魂
  rationale: 保留ψυχή在宗教伦理语境中的分量；其也可指生命或自身，列入脚注。
- source_word: ἐν ἀπωλείᾳ
  choice: 陷入灭亡
  rationale: 原文结构凝练且略显生硬；“陷入灭亡”在中文中可读，同时仍保留ἐν可能表达状态或结果的张力，没有直接改写成“毁灭自己的灵魂”。
theological_decisions:
- issue: 后半句中的个人责任与灭亡之间的关系
  choice: 译作“自己要为灵魂陷入灭亡负责”
  alternative: “自己要对灵魂的灭亡负责”或“自己因灵魂处于灭亡中而有罪”
  rationale: 原文αὐτὸς αἴτιος强调本人负有责任，但τῆς ψυχῆς ἐν ἀπωλείᾳ的关系较含混。正文表达个人承担后果，又避免把原文明确化为主动毁灭灵魂。
- issue: ψυχή的含义
  choice: 正文译作“灵魂”
  alternative: “生命”或“自己”
  rationale: 宗教和道德警告的语境使“灵魂”较能保留原文分量，但脚注承认该词更宽的语义范围。
- issue: παρὰ Κυρίῳ所表达的关系
  choice: 译作“在主那里”
  alternative: “在主面前”或“从主那里”
  rationale: 保留生命被积存在主那里或主面前的意象，不将其单一定为来源关系。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。两句保持“行正义／行不义”的平行对照；“积存生命”保留原文隐喻。末句略作必要的汉语顺化，同时以脚注保存希腊文句法的真实含混。
