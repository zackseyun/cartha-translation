  yaml_path: translation/deuterocanon/psalms_of_solomon/009/019.yaml
  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
translation:
  language: zh_hans
  text: 你曾与我们的列祖立下关乎我们的约；我们的心灵回转时[a]，我们必仰望你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们悔改时”；希腊语直译为“在我们心灵的回转中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  choice: 立下……的约
  rationale: 这是立约语境中的同源式表达；译作“立下……的约”既符合现代汉语，也保留“约”的圣经互文意义，而不机械照搬希腊语介词结构。
- source_word: τοῖς πατράσιν ἡμῶν
  choice: 与我们的列祖
  rationale: “列祖”准确指向群体的先祖，符合此处立约背景；“与”体现汉语“立约”通常要求的关系对象。
- source_word: περὶ ἡμῶν
  choice: 关乎我们
  rationale: 保留περί加属格的“关于、关乎”义，不把它解释性地改成“为了我们”。
- source_word: ἐλπιοῦμεν ἐπὶ σέ
  choice: 我们必仰望你
  rationale: “必”体现将来时，“仰望你”是自然庄重的汉语表达，可传达把盼望寄托于对方的含义。
- source_word: ἐν ἐπιστροφῇ ψυχῆς ἡμῶν
  choice: 我们的心灵回转时
  rationale: 保留“回转”的方向性意象及集体单数“心灵”，同时用“……时”自然表达ἐν在此处的时间情境。
theological_decisions:
- issue: 是否把ἐπιστροφῇ ψυχῆς ἡμῶν直接译成“我们悔改”
  choice: 我们的心灵回转时
  alternative: 我们悔改时
  rationale: 原文很可能含有悔改的宗教伦理意味，但字面表达是“心灵的回转”。正文保留这一意象及其神学张力，脚注说明较明确的可能译法。
- issue: περὶ ἡμῶν是否表达受益关系
  choice: 关乎我们
  alternative: 为了我们
  rationale: “为了我们”会明确加入受益含义；“关乎我们”更贴近原文，并保留这约如何涉及说话群体的开放性。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“列祖”“立约”“仰望”保留圣经语域，但句法按自然现代汉语组织；分号呈现两分句之间紧密而未被原文明确界定的逻辑关系。
