  yaml_path: translation/deuterocanon/psalms_of_solomon/009/012.yaml
  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: zh_hans
  text: 他必借着认罪，借着公开承认，洁净陷在罪中的灵魂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσει
  choice: 他必……洁净
  rationale: 保留直陈语气将来时，并以自然的汉语语序安排动词。
- source_word: ἐν ἁμαρτίαις ψυχὴν
  choice: 陷在罪中的灵魂
  rationale: 希腊文直译为“在罪中的灵魂”；译作“陷在罪中的”既保留 ἐν 所表达的处境，也避免擅自改成“脱离罪”或“除去罪”。
- source_word: ἐν ἐξομολογήσει
  choice: 借着认罪
  rationale: ἐξομολόγησις 在此表示承认、 confess；结合“罪”的语境，译为“认罪”最自然。介词 ἐν 在这里按方式或途径译为“借着”。
- source_word: ἐν ἐξαγορίαις
  choice: 借着公开承认
  rationale: ἐξαγορία 是罕见词，此处指公开说出或承认；保留其与前一短语近义而有所加强的表达。希腊文复数在汉语中无需机械标明。
theological_decisions:
- issue: 洁净与罪的关系
  choice: 洁净“陷在罪中的灵魂”
  alternative: 洁净灵魂，使它脱离罪／洁净灵魂的罪
  rationale: 原文是 ἐν ἁμαρτίαις，而非明确表示来源或分离的 ἀπό／ἐκ；因此不把含义限定为“从罪中洁净出来”或“除去灵魂的罪”，保留原文的张力。
- issue: 认罪在洁净中的作用
  choice: 以“借着”表达方式或途径
  alternative: 因为认罪／以认罪为功德条件
  rationale: 原文的 ἐν 可表达方式或媒介，但没有进一步界定因果机制或功德性质，译文不作教义性扩展。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“陷在罪中的灵魂”比生硬的“在罪里的灵魂”自然，同时忠实保留原文 ἐν ἁμαρτίαις 的状态性表达；两个“借着”再现希腊文平行结构。
