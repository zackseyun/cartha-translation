  yaml_path: translation/deuterocanon/psalms_of_solomon/017/017.yaml
  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: zh_hans
  text: 盟约之子在混杂的列国中胜过他们[a]；在他们中间，在耶路撒冷，没有一人践行怜悯和诚实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过他们”也可译作“压过他们”或“一直占他们的上风”；上下文可能指在恶行上超过他们。
    reason: 说明ἐπεκρατοῦσαν的语义范围、未完成体可能带出的持续意味，以及上下文可能隐含的比较方面。
  - marker: b
    text: “诚实”也可译作“信实”或“真实”。
    reason: 保留ἀλήθεια在伦理真实与可靠、信实之间的词义张力。
lexical_decisions:
- source_word: ἐπεκρατοῦσαν αὐτῶν
  choice: 胜过了他们
  rationale: ἐπικρατέω加属格可表示“胜过、压过”。这里保留比较或占上风的语义，不擅自补出上下文所暗示的“在恶行上”，也避免限定为政治统治或军事征服。希腊语未完成时所含的持续背景意味，在汉语叙事中由上下文承载。
- source_word: υἱοὶ τῆς διαθήκης
  choice: 盟约之子
  rationale: 直译这一带有身份标记作用的阳性复数短语，既保留“子”的原文意象，也不将其泛化为“盟约之民”。
- source_word: ἐν μέσῳ ἐθνῶν συμμίκτων
  choice: 在混杂的列国中
  rationale: ἐθνῶν保留为“列国”，συμμίκτων译作“混杂的”，表达各族或各国彼此混合的状态，同时避免添加原文没有的具体历史解释。
- source_word: ὁ ποιῶν
  choice: 践行
  rationale: ποιέω在伦理表达中指实际去行。“践行”比机械的“做”自然，又保留行为层面的指控。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接表达同情、宽仁和施恩的伦理含义，不把它过度限定为某一种神学术语。
- source_word: ἀλήθειαν
  choice: 诚实
  rationale: 此词既可指真实、真理，也可带有可靠或信实之意；在“践行”之后，“诚实”是自然且保持开放性的汉语表达，其他可能含义收入脚注。
theological_decisions:
- issue: 是否弱化υἱοὶ τῆς διαθήκης的男性及亲属意象
  choice: 盟约之子
  alternative: 盟约的儿女；盟约之民
  rationale: 原文明确使用“众子”，且该表达承担群体身份功能，因此正文保留其意象，不以中性群体称谓取代。
- issue: ἐπεκρατοῦσαν是否应按上下文明确译成“在恶行上超过”
  choice: 胜过了他们
  alternative: 压过了他们；在恶行上超过了他们
  rationale: 上下文或可说明所比较的具体方面，但本节本身没有明说。正文保留动词的比较与压倒意味，不把解释性宾语写入经文。
- issue: ἔλεος καὶ ἀλήθειαν这一闪语式伦理词组如何表达
  choice: 怜悯和诚实
  alternative: 怜悯和信实；慈爱和真实
  rationale: 正文采用可理解而较贴近字面的词组，并以脚注保留ἀλήθεια偏向“信实”或“真实”的可能，避免消除其伦理与盟约语境之间的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“盟约之子”有意保留原文的身份性意象；重复“在……中间，在耶路撒冷”则保留希腊语的强调和略显突兀的句法层次。所有脚注标记均置于其所说明的正文词语之后。
