  yaml_path: translation/deuterocanon/psalms_of_solomon/017/003.yaml
  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: zh_hans
  text: 但我们要把盼望寄托在上帝——我们的救主身上，因为我们上帝的权能永远长存，与怜悯相伴；我们上帝的国度永远统管列国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: 仰望
  rationale: 表达把盼望寄托于上帝，符合现代汉语宗教语境，同时保留介词结构所含的信靠指向。
- source_word: θεὸν σωτῆρα ἡμῶν
  choice: 我们的救主上帝
  rationale: 将σωτήρ保留为明确称号“救主”，并自然表达其与θεός的同位关系。
- source_word: κράτος
  choice: 权能
  rationale: 此词可指力量、主权或统治威势；“权能”既保留力量意味，也适合上帝掌权的语境，避免与后句“国度”重复。
- source_word: μετʼ ἐλέους
  choice: 带着怜悯
  rationale: 贴近μετά加属格的伴随意义，不把怜悯改释为权能存续的原因。
- source_word: βασιλεία
  choice: 国度
  rationale: 保留王权与国度的语义范围，并与常见圣经汉语用法一致。
- source_word: ἐπὶ τὰ ἔθνη
  choice: 统管列国
  rationale: ἐπί在此结合“国度”表示对列国的管辖；补出动词“统管”使汉语完整，同时保留范围关系。
theological_decisions:
- issue: μετʼ ἐλέους与“权能”的关系
  choice: 译作“权能永远存留，带着怜悯”
  alternative: “上帝的权能因怜悯而永存”
  rationale: 原文表达伴随而非明确因果，故不将怜悯解释为权能永存的原因。
- issue: 上帝国度与列国的关系
  choice: “永远统管列国”
  alternative: “永远在列国之上”
  rationale: βασιλεία与ἐπί的组合在语境中自然指王权对列国的统治；此译法不额外限定这种统治实现的方式或时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“但……因为……并且……”的论证推进，以分号协调两个并列的永恒宣告。
