base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/047.yaml
  text: 'This is the splendor of the king of Israel[a], which God knew: to raise him up over the house of Israel[c][b], to discipline him.'
translation:
  language: zh_hans
  text: 这就是以色列王的荣美，是上帝所知道的[a]：要兴起他治理以色列家[b]，管教他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “知道”也可理解为“预先知道”或“认可”。
    reason: lexical_alternative
  - marker: b
    text: “治理以色列家”直译为“在以色列家之上”。本句也可理解为：“这是以色列王的荣美，是上帝在兴起他治理以色列家并训练他时所认可的。”
    reason: syntax_and_previous_rendering
  - marker: c
    text: “管教”也可译作“训练”或“教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐπρέπεια
  choice: 荣美
  rationale: 该词表示美好、庄严而合宜的外在风采；“荣美”兼顾君王的尊荣与美好，又保持庄重自然。
- source_word: ἔγνω
  choice: 知道
  rationale: 直译其宽泛含义，并保留希腊语在此可能带有“预知”或“认可”的神学分量，不在正文中替读者作单一判定。
- source_word: ἀναστῆσαι
  choice: 兴起
  rationale: 保留“使之起来”的动词意象，也符合上帝设立君王的语境；没有直接收窄为“任命”。
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: 治理以色列家
  rationale: ἐπί加宾格在君王语境中自然表示居于以色列家之上掌权；中文补出“治理”以清楚表达关系，脚注保留更贴近字面的译法。
- source_word: παιδεῦσαι
  choice: 管教
  rationale: 该词可指教育、训练或惩戒性的管束；“管教”较完整地保留塑造与约束两方面的含义。
theological_decisions:
- issue: 上帝“知道”以色列王之荣美是否应明确译成预知、拣选或认可
  choice: 知道
  alternative: 预知；认可
  rationale: ἔγνω本身语义宽广，并可能承载受希伯来表达影响的拣选或预定意味；正文采用直译“知道”，让这种神学张力保持开放，脚注列出可能语感。
- issue: 两个不定式与“知道”的句法关系
  choice: 用冒号引出“要兴起……管教……”，理解为上帝所知之事或旨意的展开
  alternative: 理解为“上帝在兴起他……并训练他时所认可的荣美”
  rationale: 不定式可作解释或目的性展开，但原句连接较为压缩。正文保留不定式的目的／内容力量，同时在脚注说明另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“荣美”“兴起”“以色列家”保留诗歌及圣经传统语域；以冒号呈现希腊原句压缩的解释关系，避免中文句法晦涩。
