base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: zh_hans
  text: 他在世的日子里，倚靠他的上帝，必不衰弱；因为上帝使他在圣灵里[a]大有能力，在明达的谋略中有智慧，并有力量和公义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在圣灵里”或译“借着圣灵”；也可理解为“在圣洁的灵里”。
    reason: 希腊语ἐν可表示范围或媒介，而无冠词的πνεύματι ἁγίῳ也可作性质性理解。
  - marker: b
    text: “公义”或译“正义”。
    reason: δικαιοσύνη既可指合乎上帝旨意的公义，也可侧重公正、正义。
lexical_decisions:
- source_word: ἀσθενήσει
  choice: 衰弱
  rationale: 该将来时动词表示变得软弱或力量衰退；“衰弱”既保留动态意味，也不夸大为彻底失败。
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: 在世的日子里
  rationale: 按希腊语直义为“在他的日子里”，结合语境自然表达为他一生在世期间。
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: 倚靠他的上帝
  rationale: ἐπί加与格在此最自然地表示以其上帝为依靠；此译比生硬的“在他的上帝里”更符合现代汉语，同时保留信靠关系。
- source_word: κατηργάσατο
  choice: 使
  rationale: 该动词在这里用法较特殊，语境指上帝使他成为有能力、有智慧的人；“使”简洁地表达结果性作用。
- source_word: δυνατὸν
  choice: 大有能力
  rationale: 表示强而有能力；“大有能力”在庄重的现代汉语中自然，并与后文“力量”避免机械重复。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里
  rationale: 保留ἐν所表达的范围或媒介关系。希腊语无冠词本身不足以排除特指；中文“圣灵”也不像英文大小写那样必须额外裁定专名问题。脚注保留工具性及性质性读法。
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: 在明达的谋略上有智慧
  rationale: συνέσεως为属格，限定βουλῇ，指以理解力或明达为特征的谋略；此译保留结构关系而又便于现代读者理解。
- source_word: ἰσχύος
  choice: 力量
  rationale: 直接表达强健、能力，与末尾并列的“公义”搭配清楚。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: 此词可指公义或正义；“公义”保留较宽的伦理与宗教含义，脚注列出“正义”这一可行译法。
theological_decisions:
- issue: πνεύματι ἁγίῳ是否应明确理解为专指圣灵，以及ἐν表示范围还是媒介
  choice: 正文译作“在圣灵里”
  alternative: “借着圣灵”或“在圣洁的灵里”
  rationale: 介词短语可表达所在范围，也可表达凭借的媒介；无冠词形式还容许一定的性质性理解。正文采用最贴近结构且符合上下文的译法，脚注保留其他真实可能，避免把语法歧义完全消除。
- issue: δικαιοσύνης侧重公义还是司法意义上的正义
  choice: 公义
  alternative: 正义
  rationale: 上下文描述受上帝所立者的品格与治理能力，“公义”覆盖面较广；但“正义”也可能突出公正施政，故列入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倚靠他的上帝”明确表达ἐπὶ θεῷ αὐτοῦ的依赖关系；整体句式保留原文因果链和并列结构，但通过标点与汉语语序提升可读性。
