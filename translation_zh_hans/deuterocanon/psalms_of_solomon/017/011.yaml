base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/011.yaml
  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: zh_hans
  text: 上帝没有怜悯他们。他查遍了他们的后裔[a]，连一个也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他们的种子”；也可译作“他们的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλέησεν
  choice: 怜悯
  rationale: ἐλεέω直接表达施怜悯、同情之意；译作“怜悯”既贴近希腊文，也保留本节审判语境中“上帝不施怜悯”的力度，并避免与17:14中表示“宽免、不放过”的φείδομαι混同。
- source_word: ἐξερεύνησεν
  choice: 查遍了
  rationale: 该动词表示彻底搜寻、追查。“查遍了”在现代汉语中自然地传达搜查周全、无一遗漏的含义，并与下句的彻底性相呼应。
- source_word: σπέρμα
  choice: 后裔
  rationale: σπέρμα本义为“种子”，用于人时可指其子孙或后代；此处“后裔”清楚、庄重，符合上下文。
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: 连一个也没有留下
  rationale: 此译保留希腊文强调全无剩余的结构和语气，同时符合现代汉语表达习惯。
theological_decisions:
- issue: ἐλεέω在审判语境中的表达
  choice: 没有怜悯他们
  alternative: 没有放过他们
  rationale: “没有放过”虽能表达审判结果，却会淡化ἐλεέω明确的“怜悯”概念；正文保留原词的神学张力，不把怜悯直接等同于宽免。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“查遍了”与“连一个也没有留下”形成紧密推进，呈现原文简短而严厉的审判语气。
