  yaml_path: translation/deuterocanon/psalms_of_solomon/017/048.yaml
  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
translation:
  language: zh_hans
  text: 他的话炼得比最上等的黄金更纯净[a]；在各会众中，他必审判百姓，就是成圣之民的各支派[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的话经过火炼，比最上等的黄金更纯净。”
    reason: 保留πεπυρωμένα所含“经火炼而净化或检验”的字面意象。
  - marker: b
    text: “审判”也可译作“辨别”或“分别”。
    reason: διακρινεῖ兼有判断、辨明和分开的语义范围。
  - marker: c
    text: “成圣之民的各支派”原文结构紧缩。ἡγιασμένου为属格单数分词，较可能集合性地指成圣的百姓；也可按其单数形式理解为“成圣者的各支派”。
    reason: 说明原文压缩句法，并保留单数分词所造成的解析空间，而不把集合性所指误导为特定个人。
lexical_decisions:
- source_word: ῥήματα
  choice: 话
  rationale: 指说出的话或言语；“话”在现代汉语中简洁自然，也保留原文的概括性。
- source_word: πεπυρωμένα
  choice: 炼得……更纯净
  rationale: 该分词带有经火冶炼、净化或检验的金属冶炼意象；结合下文的金子，这一译法既显明比喻，又符合现代汉语表达。
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: 比最上等的精金更纯净
  rationale: ὑπέρ表达超越性的比较，τὸ πρῶτον τίμιον强调金子的上等与珍贵；“最上等的精金”自然传达其加强语气。
- source_word: συναγωγαῖς
  choice: 各会众
  rationale: 此处指群体聚集的场合或共同体，不必限定为后世制度化的“会堂”；“各会众”兼顾群体和聚会语境。
- source_word: διακρινεῖ
  choice: 审断
  rationale: 该动词可表示判断、辨别或分开；在君王施行治理的语境中，“审断”较能体现司法意味，同时不完全排除辨明、区分的含义。
- source_word: λαὸν φυλὰς ἡγιασμένου
  choice: 这民，就是成圣之民的各支派
  rationale: 原文结构紧缩。将单数属格分词ἡγιασμένου按集合意义理解为成圣的人民，可避免误导为某一个人；用“就是”表现“民”与“各支派”之间可能的同位关系，并以脚注保留其他解析。
theological_decisions:
- issue: ἡγιασμένου所指是集体还是单一个体
  choice: 按集合意义译作“成圣之民”
  alternative: “那成圣者”或“那位圣者”
  rationale: 上下文和“这民／各支派”支持集合性所指；但希腊文使用属格单数分词，语法结构又较紧缩，因此不把个体性解析视为绝无可能，并在脚注中说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“精金”“审断”“成圣”保留经文语域，但句法尽量清楚；破折式同位关系改用“就是”，使普通读者易于理解，同时借脚注呈现原文的词义和句法张力。
