  yaml_path: translation/deuterocanon/psalms_of_solomon/017/018.yaml
  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: zh_hans
  text: 那些喜爱敬虔者的聚会的人逃离了他们；他们像麻雀一样飞离自己的巢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巢”原文也可指“躺卧之处”或“栖身处”。
    reason: 说明 κοίτη 的字面语义范围，并交代正文在鸟类比喻中采用“巢”这一自然译法。
lexical_decisions:
- source_word: οἱ ἀγαπῶντες
  choice: 那些喜爱……的人
  rationale: 保留现在分词的定语性质及其持续性意味，中文表达自然。
- source_word: συναγωγὰς ὁσίων
  choice: 圣民聚会
  rationale: συναγωγάς 在此指聚集或会众的集会；ὁσίων 可指忠于上帝、敬虔圣洁之人。译作“圣民”简洁庄重，也避免将其误读为特定制度名称。
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  choice: 逃离了他们
  rationale: 忠实保留复数代词 αὐτῶν 的指向含混，不擅自指定其所指。
- source_word: ὡς στρουθία
  choice: 如麻雀般
  rationale: στρουθία 是 στρουθίον 的复数，可泛指小鸟；依通常词义及英语审校层译作“麻雀”。
- source_word: ἐξεπετάσθησαν
  choice: 飞散
  rationale: 该动词表达飞出去、飞离；“飞散”既体现离开原处，也呼应群体因危难四散的语境。
- source_word: κοίτης αὐτῶν
  choice: 自己的巢
  rationale: κοίτη 基本义为躺卧之处、床榻或栖身处；在麻雀比喻中，“巢”是自然的语境化表达。加脚注保留其较宽泛的字面范围。
theological_decisions:
- issue: ὅσιοι 的身份
  choice: 圣民
  alternative: 敬虔者／圣者
  rationale: 原文没有进一步界定这些人的群体身份。“圣民”保留其宗教伦理色彩，而不把它限定为某一教派、职分或特殊阶层。
- issue: αὐτῶν 的所指
  choice: 保留为“他们”
  alternative: 明确译作“敌人”或某个前文群体
  rationale: 本节自身未明说代词所指，故不在正文中替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。前半句保留代词指向的含混；后半句用“巢”和“飞散”使鸟群比喻在中文中清晰自然。
