  yaml_path: translation/deuterocanon/psalms_of_solomon/017/006.yaml
  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: zh_hans
  text: 因我们的罪孽，罪人起来反对我们；他们袭击我们，把我们赶了出去。你未曾向这些人作出应许，他们却强行夺走了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明他们强行夺走的是什么；这里保留这一省略。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: 在我们的罪恶中
  rationale: 保留介词短语较宽泛的语义，不擅自断定这是严格的因果关系（“因为我们的罪”）还是处境描述。
- source_word: ἐπανέστησαν ἡμῖν
  choice: 起来与我们作对
  rationale: 表达该动词在此处敌对、反抗的意味，同时避免与下一动词同译为“攻击”而抹平动作层次。
- source_word: ἐπέθεντο ἡμῖν
  choice: 他们袭击我们
  rationale: 结合随后被逐出的暴力语境，采用现代汉语中自然且明确的敌对动作表达。
- source_word: ἐξώσαντο ἡμᾶς
  choice: 把我们赶了出去
  rationale: 体现强制驱逐的动作和结果，语气生动而不夸张。
- source_word: οἷς οὐκ ἐπηγγείλω
  choice: 你未曾向这些人作出应许
  rationale: ἐπηγγείλω是第二人称单数，承接对上帝的直接称呼；οἷς为阳性复数与格，指前述罪人。此译法保留这两项语法信息，也不补出应许的具体内容。
- source_word: μετὰ βίας ἀφείλαντο
  choice: 他们却强行夺走了
  rationale: “强行”准确传达μετὰ βίας的强制、暴力意味；不补出ἀφείλαντο在原文中省略的宾语。
theological_decisions:
- issue: ἐπηγγείλω的人称及说话对象
  choice: 译为“你未曾……作出应许”，保留第二人称单数，并让“你”继续指向上文受呼告者。
  alternative: 译作“我未曾应许”或改成无人称的“未曾应许给他们”。
  rationale: 希腊文形态是第二人称单数，不是第一人称；改成人称或无人称会消除原文直接呼告的结构。
- issue: “夺走”所指的对象
  choice: 不在正文补明宾语。
  alternative: 补作“国度”“产业”或“所应许之物”。
  rationale: 希腊文没有明说被夺走的对象；具体补入任何对象都会把语境推断写进正文，削弱原有的省略和张力。
- issue: “在我们的罪恶中”的逻辑关系
  choice: 保留较开放的处境性表达。
  alternative: 明确译为“因为我们的罪恶”。
  rationale: ἐν可在语境中带有因由意味，但形式上仍是“在……中”；正文不把可能的因果解释定死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来与我们作对—袭击—赶出去”保留三个连续动作的递进；末句以“却”突出这些人未蒙应许却强夺的反差。
