base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: zh_hans
  text: 愿上帝快快向以色列施怜悯[a]。他必救我们脱离不敬虔仇敌的污秽[b][c]。主亲自永永远远作我们的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文开头采用不定式“加快”，这里按祈愿语气译作“愿上帝快快……”。
    reason: alternative_reading
  - marker: b
    text: “污秽”也可译作“不洁”或“玷污”。“不敬虔仇敌的污秽”在希腊文中可表示仇敌的污秽，也可指与仇敌有关或由其造成的污秽。
    reason: lexical_alternative
  - marker: c
    text: “不敬虔”也可译作“不圣”或“亵渎神圣的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: 愿……快快
  rationale: 句首不定式具有呼求或愿望语气；用“愿……快快”既保留迫切感，也符合现代汉语祈愿表达。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接表达上帝向以色列所施的慈悲恩待，不额外加入原句未明说的盟约含义。
- source_word: ῥύσεται
  choice: 必救……脱离
  rationale: 保留将来时所表达的确信，也自然呈现从敌人造成的污秽中获得解救。
- source_word: ἀκαθαρσίας
  choice: 污秽
  rationale: 兼具不洁与玷污意味，并能保留该词可能具有的礼仪及道德色彩。
- source_word: βεβήλων
  choice: 不敬虔
  rationale: 表达不圣、不敬神的性质；用于修饰“仇敌”比生硬的“亵俗”更符合现代汉语。
- source_word: Κύριος
  choice: 主
  rationale: 在此指上帝，并突出他是以色列真正的君王。
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: 直到永永远远
  rationale: 体现“直到永远，并且还要继续”的强化延续意味，同时采用庄重自然的汉语表达。
theological_decisions:
- issue: 句首 ταχύναι 的语气
  choice: 按祈愿解释：“愿上帝快快……”
  alternative: 可较机械地译作“上帝要快快……”或“让上帝快快……”
  rationale: 孤立置于句首的不定式在这里最自然地传达祷告式愿望；译文保留这一语气，同时以脚注提示希腊文形式。
- issue: ἀκαθαρσίας ἐχθρῶν βεβήλων 的关系
  choice: 译作“不敬虔仇敌所带来的污秽”
  alternative: 可理解为“脱离不敬虔仇敌的污秽”，或较宽泛地理解为“脱离不敬虔仇敌造成的玷污”
  rationale: 属格短语可表示污秽的来源或归属。正文采用自然且符合上下文的来源性表达，但脚注保留结构上的歧义，不把责任关系绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……快快”保留诗歌祈求的迫切感；“主亲自作我们的王”突出 αὐτός 的强调作用；末句用“直到永永远远”承载强化的永恒表达。
