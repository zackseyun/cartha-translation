  text: And everything that he did in Jerusalem was just as the nations do to their gods in their cities[a][b].
translation:
  language: zh_hans
  text: 他在耶路撒冷所做的一切，正如列国在城中对他们的神所做的那样[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的比较结构有所省略；也可补足理解为：“正如列国在城中对他们的神所做的那样。”
    reason: lexical_alternative
  - marker: b
    text: “列国”或译“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: 所做的一切
  rationale: 保留该短语涵盖全部行为的概括性；现代汉语中与后面的动词搭配自然。
- source_word: ἐποίησεν
  choice: 所做
  rationale: ποιέω 在此意义宽泛，译作“做”不擅自限定具体行为的性质。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 按其地点含义直接翻译。
- source_word: καθὼς καὶ
  choice: 正如……那样
  rationale: 清楚表达比较关系，同时以汉语必要的对应结构补足希腊文省略的成分。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 既保留复数民族群体的含义，也避免在正文中把犹太人与外邦人的对立置于原句并未特别强调的位置。
- source_word: ἐν ταῖς πόλεσι
  choice: 在各自城中
  rationale: 希腊文直译为“在城中”；依比较语境补出“各自”，使汉语所指清楚，但不改变地点关系。
- source_word: τοὺς θεοὺς αὐτῶν
  choice: 自己的神
  rationale: 忠实保留“他们的神”，不以带有解释性的“偶像”代替；“自己”与主语“列国”自然照应。
