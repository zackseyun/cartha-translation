  yaml_path: translation/deuterocanon/psalms_of_solomon/017/044.yaml
  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: zh_hans
  text: 他对主的盼望必不衰弱；谁能与他抗衡呢？他行事有力，在敬畏上帝的事上刚强，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: 必不衰弱
  rationale: 该将来时动词表示变得软弱或失去力量；以“盼望”为主语时，“衰弱”保留了原文的力量隐喻，也没有直接解释成“落空”。
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: 他对主的盼望
  rationale: ἐπί在这里表达盼望所指向并倚靠的对象；“对主的盼望”在现代汉语中自然，也保留这一方向性。
- source_word: Κύριον
  choice: 主
  rationale: κύριος按其宗教语境译为“主”，既符合原文称谓，也避免改写成解释性的“主人”或其他称呼。
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: 谁能与他抗衡呢？
  rationale: 原文表达简练，πρός在此具有对抗意味；“与他抗衡”传达无人有能力敌挡他的反问语气，而不额外说明结果。
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: 他所行的事大有力量
  rationale: ἰσχυρός表示强而有力，ἔργα指行动或作为；此译法比生硬的“在他的行为中强壮”更符合现代汉语，同时贴近原义。
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: 因敬畏上帝而刚强
  rationale: κραταιός表示强健、刚强；φόβος θεοῦ保留为传统而清楚的“敬畏上帝”。ἐν的关系可理解为其刚强所在的领域或根基，汉语以“因……而”自然表达，但不把“敬畏”弱化为一般尊重。
- source_word: '[implied copula]'
  choice: 他……大有力量，也……刚强
  rationale: 希腊语末句省略系词；汉语可借谓语结构自然补足，不必另加明显的“是”。
theological_decisions:
- issue: ἐν φόβῳ θεοῦ中ἐν的语义关系
  choice: 因敬畏上帝而刚强
  alternative: 在敬畏上帝的事上刚强
  rationale: ἐν既可表示领域，也可带有处境或根基色彩。正文采用较自然的现代汉语，表达其刚强与敬畏上帝密切相关；不进一步断定具体的因果机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“主”“敬畏上帝”等圣经语域用语；反问句保持原文力度。经文末尾沿原文以逗号收束，表明句意可能接续下文。
