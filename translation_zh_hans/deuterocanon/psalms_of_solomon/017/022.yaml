  yaml_path: translation/deuterocanon/psalms_of_solomon/017/022.yaml
  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
translation:
  language: zh_hans
  text: 君王曾陷于不法[a]，审判官陷于悖逆[b]，百姓陷于罪中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文是没有系词的并列句，直译近于“君王在不法中，审判官在悖逆中，百姓在罪中”。根据上文的叙事语境，这里描述的是过去的情形；“曾”统摄全句。
    reason: grammar_and_lexical_alternative
  - marker: b
    text: “悖逆”也可译作“不顺服”或“反叛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεὺς
  choice: 君王
  rationale: 直接表达政治身份，并采用庄重而自然的现代汉语称谓。
- source_word: ἐν
  choice: 陷于／处于（按汉语语境表达）
  rationale: 三个ἐν都表示主体所处的道德状态；首项用“陷于”，后两项以紧凑谓语表达，既保留三重平行，也避免生硬重复“在……之中”。
- source_word: παρανομίᾳ
  choice: 无法无天
  rationale: 保留违背律法、蔑视法纪的道德—法律意味；比泛称“邪恶”更贴近παρανομία。
- source_word: κριτὴς
  choice: 审判官
  rationale: 准确指称负责司法审判者，比单称“官长”更具体。
- source_word: ἀπειθείᾳ
  choice: 悖逆
  rationale: 表达拒不顺服的状态，并保留可指不服从或反叛的语义张力，不窄化为“不信”。
- source_word: λαὸς
  choice: 百姓
  rationale: 自然表达集体民众，与“君王、审判官”构成社会整体的三层排列。
- source_word: ἁμαρτίᾳ
  choice: 犯罪
  rationale: 以自然汉语表达“处于罪中”的状态，保留明确的罪之概念。
theological_decisions:
- issue: 希腊文无系词，时态需由上下文补足
  choice: 采用过去处境的理解，但在汉语正文中不显加“曾经”或“了”
  alternative: 译作明确现在时“君王正无法无天……”或显加过去时“君王曾陷于……”
  rationale: 本句本身没有系词；前文叙事支持过去时间。现代汉语可由篇章语境承担时态，因此不必添加可能过度强调的时间副词，同时脚注说明这一点。
- issue: ἀπείθεια的语义范围
  choice: 悖逆
  alternative: 不顺服／反叛
  rationale: “悖逆”既可涵盖不服从，也保留较强的反叛意味，不将其解释为特定教义意义上的“不信”。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。三项指控保持递进而平行的节奏；避免逐项重复“在……之中”所造成的翻译腔，同时用脚注保留希腊文结构及其无系词所产生的时态含混。
