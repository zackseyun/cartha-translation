  yaml_path: translation/deuterocanon/psalms_of_solomon/017/007.yaml
  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
translation:
  language: zh_hans
  text: 他们没有归荣耀给你那尊贵的名；他们在荣华中设立了一个王国来取代他们的高位[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取代他们的高位”原文含义不甚明确；也可理解为“为了抬高自己”。若按可能的希伯来语背景解释，则可译作“因为他们的骄傲”。
    reason: 保留ἀντί与ὕψος的语义张力，并记录基于假定底本而产生的主要异译。
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: 没有荣耀
  rationale: 保留 δοξάζω“使得荣耀、归荣耀”的主动语义，也自然适合以神的名为宾语的语境。
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: 你那尊贵的名
  rationale: ἔντιμος 指受尊重、贵重或尊贵；“尊贵的名”庄重自然，并未过度解释为“圣名”。
- source_word: ἐν δόξῃ
  choice: 在荣华中
  rationale: δόξα 在此可指荣耀、显赫或外在荣华；“荣华”既保留与前句“荣耀”的词根呼应，又较自然地表现王权的显赫。
- source_word: ἔθεντο βασίλειον
  choice: 建立了王国
  rationale: τίθημι 在此有设立、置立之意；βασίλειον 可指王国、王权或王室建制。“建立了王国”直白而不过度限定。
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: 以此取代他们的高位
  rationale: 按现存希腊文，ἀντί + 属格通常表达“代替、取代”，ὕψος 为“高度、高位、崇高”。正文保留这一紧缩且含混的结构，不依据推测的希伯来底本改写成因果性的“因为他们骄傲”。
theological_decisions:
- issue: ἀντὶ ὕψους αὐτῶν 的关系与含义
  choice: 以此取代他们的高位
  alternative: 因为他们的骄傲／为了抬高自己
  rationale: 现存希腊文本最直接支持“取代”义，而“高位”可指地位、尊荣或被高举的状态。因果性的“因为”及“骄傲”需要诉诸假定的希伯来原文，故不放入正文；以脚注提示其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荣耀／荣华”保留原文 ἐδόξασαν／δόξῃ 的修辞呼应；句末依篇章连续性保留分号后的未完语势。
