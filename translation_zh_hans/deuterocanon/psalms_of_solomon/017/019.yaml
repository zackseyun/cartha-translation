base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: zh_hans
  text: 他们在荒野中漂泊[a]，好叫他们的性命[b]得以脱离恶害，蒙保全；在寄居异乡的群体[c]眼中，他们中有一条获救的性命，是宝贵的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒野”也可译作“荒凉之地”；希腊文用复数，指一处或多处无人、荒僻的地方。
    reason: lexical_alternative
  - marker: b
    text: 希腊文 ψυχή 可指“性命”或“灵魂”；这里的逃难求生语境较适合译作“性命”。
    reason: lexical_alternative
  - marker: c
    text: “寄居异乡的群体”也可理解为“流亡者群体”或“散居群体”；希腊文 παροικία 指离开故土寄居的处境，也可指处于这种处境的共同体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: 漂泊
  rationale: 这里与“在荒野中”连用，首先描写人在各处流离、漂泊，而不是在道德或信仰上“受迷惑”。未完成时所含的持续意味由语境自然体现。
- source_word: ἐν ἐρήμοις
  choice: 在荒野中
  rationale: ἐρήμοις为复数，可指多处荒凉、无人居住之地；汉语集合性表达“荒野中”自然，也不把地貌限缩为沙漠。
- source_word: σωθῆναι ψυχὰς αὐτῶν
  choice: 为使自己的性命……得以保全
  rationale: 保留不定式的目的意味及被动态，不把施行拯救的主体说成漂泊者自己。ψυχή在逃避危险的语境中指具体的生命、性命。
- source_word: ἀπὸ κακοῦ
  choice: 脱离恶害
  rationale: κακόν既可指邪恶，也可指伤害、祸患；“恶害”在此兼顾道德之恶与实际灾害，不擅自限定其一。
- source_word: τίμιον
  choice: 宝贵
  rationale: 表达一条获保全的性命在群体眼中具有极高价值，符合 τίμιος 在本句中的评价意味。
- source_word: παροικίας
  choice: 寄居异乡的群体
  rationale: παροικία可表示离开故土而寄居的处境，也可指处于这种境况的共同体；此译文使“在……眼中”的群体所指在现代汉语中清楚可读。
- source_word: ψυχὴ σεσωμένη
  choice: 一条蒙了保全的性命
  rationale: 再次把 ψυχή理解为“性命”，并以“蒙了保全”体现完成时被动分词所表示的已获救、现仍存留的状态。
- source_word: ἐξ αὐτῶν
  choice: 他们中间
  rationale: 直译其从一群人当中出来或获救的关系，同时保留代词“他们”在上下文中的指向。
theological_decisions:
- issue: 两处 ψυχή 应译为“灵魂”还是“性命”
  choice: 两处均译为“性命”
  alternative: 两处译为“灵魂”
  rationale: 全句语境是人在荒野漂泊、脱离恶害并存活下来，重点是生命获得保全；译作“性命”避免把这里扩展成希腊文未必意指的灵魂论陈述。
- issue: σωθῆναι 的施事者是否应明确
  choice: 采用“得以保全”的被动表达，不明说施事者
  alternative: 译作“为保全自己的性命”，使漂泊者成为主动施事者
  rationale: 希腊文使用被动不定式；不补出上帝、环境或漂泊者为施事者，既忠于句法，也保留可能的神学含蓄。
- issue: ἀπὸ κακοῦ 指道德之恶还是灾祸伤害
  choice: 译作“恶害”，保留两方面的张力
  alternative: 单译“邪恶”或“灾祸”
  rationale: κακόν语义可涵盖邪恶、伤害与灾难；上下文虽突出求生，却不足以排除道德意味。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体散文。“漂泊”“得以保全”“在……眼中”“宝贵”保持经文语域，但避免生硬古语。分号划分目的从句与群体评价句；不补出原文未说明的拯救施事者。
