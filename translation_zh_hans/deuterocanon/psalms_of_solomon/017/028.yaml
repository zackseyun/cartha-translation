  yaml_path: translation/deuterocanon/psalms_of_solomon/017/028.yaml
  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: zh_hans
  text: 他要召集圣洁的子民，并以公义引领他们[a]；他要审判被主——即他的上帝——分别为圣的子民的各支派[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以公义”也可译作“按正义”。
    reason: lexical_alternative
  - marker: b
    text: “审判”在这里也可有“治理”或“统治”的较广含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάξει
  choice: 要召集
  rationale: 表达把众人聚集起来的将来行动；“召集”自然、庄重，也适合群体语境。
- source_word: λαὸν ἅγιον
  choice: 一群圣洁的子民
  rationale: 保留ἅγιος的宗教与群体含义；“子民”较“人民”更能体现此处归属上帝的群体，同时不额外限定民族身份。
- source_word: ἀφήγήσεται
  choice: 引领他们
  rationale: 此动词在这里表示带领、引导；“引领”适合公义治理的语境。
- source_word: ἐν δικαιοσύνῃ
  choice: 以公义
  rationale: ἐν可表达行动的方式；“以公义”在现代汉语中自然，并保留δικαιοσύνη兼具正直与正义的含义。
- source_word: κρινεῖ
  choice: 要审判
  rationale: 保留κρίνω的基本司法含义，同时由脚注说明其在君王语境中也可有治理之意。
- source_word: φυλὰς λαοῦ ἡγιασμένου
  choice: 那些被分别为圣之民的各支派
  rationale: 属格单数ἡγιασμένου修饰λαοῦ而非复数φυλάς；译文明确“被分别为圣”的是“民”，并以“各支派”表达复数。
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: 被主——他的上帝——
  rationale: ὑπό加属格标明使其成圣的施事者；破折号清楚保留“主”与“他的上帝”指同一位的同位关系。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”保留该词在宗教伦理语境中的广度；本节的君王及司法语境也容许理解为“正义”，故列入脚注。
- issue: κρίνω在君王语境中的范围
  choice: 审判
  alternative: 治理／统治
  rationale: 正文保留基本司法意义，不把较宽的王权含义直接写入正文；脚注保存语境可能性。
- issue: ἡγιασμένου的被动完成含义
  choice: 被分别为圣
  alternative: 被圣化／成为圣洁
  rationale: “被分别为圣”清楚体现上帝施行该行动以及结果持续存在，同时避免生硬的术语。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。以分号对应希腊文两个并列分句；用破折号处理“主——他的上帝”的同位关系。正文中的脚注标记均紧随相关语句。
