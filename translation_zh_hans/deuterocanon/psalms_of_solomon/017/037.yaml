source:
  edition: lxx-swete-1909
  text: οὐ γὰρ ἐλπιεῖ ἐπὶ ἵππον καὶ ἀναβάτην καὶ τόξον, οὐδὲ πληθυνεῖ αὐτῷ χρυσίον οὐδὲ ἀργύριον εἰς πόλεμον, καὶ πολλοῖς οὐ συνάξει ἐλπίδας εἰς ἡμέραν πολέμου.
  language: Greek
  pages:
  - 808
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/037.yaml
  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
translation:
  language: zh_hans
  text: 因为他不会把希望寄托在马匹、骑手和弓上，也不会为战争给自己积聚金子或银子，也不会凭人多，为交战之日积聚希望[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭人多”所译的希腊文表达很简略，也可理解为“借着许多人”或“与许多人一起”；这里大概是指倚仗人数众多或兵力庞大。
    reason: 原文πολλοῖς的与格关系及其具体所指存在歧义。
lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: 把希望寄托在……上
  rationale: 保留ἐλπίζω“盼望、寄望”的词义，同时在军事语境中自然表达“倚赖”的含义。
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: 马匹、骑手和弓
  rationale: 逐一保留原文所列的具体军事资源，不把ἵππον增译为“战马”，也不把τόξον泛化为“武器”。
- source_word: πληθυνεῖ αὐτῷ
  choice: 给自己积聚
  rationale: πληθύνω表示增多、使之丰盛；αὐτῷ按利益与格处理。“积聚”符合金银语境，又保留为自己增加储备之意。
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: 金子或银子
  rationale: 在否定结构中以“或”体现οὐδὲ的析取关系，并保留两种贵金属的具体所指。
- source_word: εἰς πόλεμον
  choice: 为战争
  rationale: εἰς在这里表达目的；译文不把范围缩窄为某一场战斗。
- source_word: πολλοῖς
  choice: 凭人多
  rationale: 该与格表达方式较压缩，语境很可能指依赖人数或庞大兵力；“凭人多”避免擅自明确为军队、盟友或支持者。
- source_word: συνάξει ἐλπίδας
  choice: 积聚希望
  rationale: 保留συνάγω“聚集”和ἐλπίδες复数形成的鲜明而略显特殊的表达，不以“信心”取代原文的“希望”。
- source_word: ἡμέραν πολέμου
  choice: 交战之日
  rationale: 既保留“日”的具体意象，也用现代汉语可懂的方式表达临到战事的那一天。
theological_decisions:
- issue: 军事资源与盼望之间的关系
  choice: 保留“把希望寄托在”以及末句“积聚希望”的重复词根联系
  alternative: 首句译作“倚靠”，末句译作“建立信心”
  rationale: 原文两次使用同一希望词族（ἐλπιεῖ／ἐλπίδας），形成刻意呼应；保留这一联系，不把经文改写成更明确的神学结论。
- issue: πολλοῖς所指对象
  choice: 译为不明确的“人多”，并加注说明
  alternative: 明确译为“庞大军队”或“众多盟友”
  rationale: 希腊文仅用与格复数πολλοῖς，没有明说军队、盟友或支持者；正文应保存其压缩性和歧义。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的书面汉语。“马匹、骑手和弓”保持具体意象；“积聚希望”略带陌生感，但有意保存原文的聚集隐喻及“希望”词族的呼应。脚注标记[a]置于相关歧义所在的末句。
