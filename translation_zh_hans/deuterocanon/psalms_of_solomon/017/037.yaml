  naturalness: 整体为自然、庄重的现代书面汉语。末句“积聚希望”在汉语中略具陌生感，但这是为保留原文συνάξει ἐλπίδας的聚集隐喻、复数形式和与首句“希望”的呼应所作的适当形式保留；脚注和上下文足以帮助理解。“凭人多”简洁且不强加“军队”或“盟友”等原文未明说的对象。
  terminology: “马匹、骑手和弓”“金子或银子”“战争”“交战之日”等军事语汇具体、准确。“金子或银子”正确反映否定句中οὐδὲ的连结方式；未将ἵππον增释为“战马”，也未将τόξον泛化为武器。没有引入教派性解释。
