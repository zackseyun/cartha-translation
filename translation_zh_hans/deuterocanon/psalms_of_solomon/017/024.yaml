  text: And exalt him in strength to shatter unjust rulers[a][b].
translation:
  language: zh_hans
  text: 求你以大能高举他[a]，使他击碎不义的统治者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大有能力地高举他”或“以力量使他升高”。原文简略，既可侧重高举他的方式，也可能含有使他得着力量的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑψώσον
  choice: 高举
  rationale: 该命令式动词具有使之升高、尊崇之意；“高举”既保留向上提升的意象，也适合此处受膏者被兴起执行使命的语境。
- source_word: ἰσχὺν
  choice: 以大能
  rationale: 原文以宾格简洁表达方式、状态或所赋予的力量；“以大能”在现代汉语中自然，同时不过度断定它究竟修饰“高举”的方式，还是暗示使他得着力量。
- source_word: θραῦσαι
  choice: 击碎
  rationale: 不定式表示目的；“击碎”保留动词强烈的破坏性力度，比“打破”更有力，又不额外加入原文没有的政治解释。
- source_word: ἄρχοντας
  choice: 统治者
  rationale: 该词泛指掌权、治理的人；“统治者”清楚表达其政治权柄，范围也比“君王”更宽。
- source_word: ἀδίκους
  choice: 不义的
  rationale: 该形容词兼有道德败坏与行事不公的含义；“不义的”保留其道德和司法层面的张力，不把意思缩限为单纯“不公正”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“求你”明确表达希腊文命令式在祈祷中的恳求语气；保留“高举—击碎”的强烈诗歌意象，并以脚注呈现ἰσχὺν与主要动词之间的语法歧义。
