base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/008.yaml
  text: They laid waste the throne of David in arrogant usurpation[a]. But you, O God, will cast them down and remove their offspring from the earth[b],
translation:
  language: zh_hans
  text: 他们以狂傲的篡位，毁坏了大卫的宝座[a]。但你，神啊，必将他们推倒，把他们的后裔从地上除去[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在替换所表现的狂傲中。”希腊语短语十分凝练；正文“狂傲的篡位”表达了此处很可能具有的政治性非法替换之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必将他们推倒，又除去他们的后裔。”
    reason: previous_rendering
lexical_decisions:
- source_word: ἠρήμωσαν
  choice: 使……荒废
  rationale: 该动词表示使某物荒凉、废弃或毁坏；“使……荒废”保留其使役力量，也适合以“宝座”喻指王朝统治的语境。
- source_word: τὸν θρόνον Δαυὶδ
  choice: 大卫的宝座
  rationale: 直接保留王权与大卫王朝的含义，现代汉语也自然。
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: 狂傲地篡夺王位
  rationale: ὑπερηφανία明确表示狂傲；ἀλλάγματος字面可指更换、替代或交换。结合王朝政治语境，“篡夺王位”表达很可能的非法取代之意，但脚注保留字面歧义。
- source_word: καταβαλεῖς
  choice: 必将……推倒
  rationale: 未来时动词表达神决定性的贬抑或倾覆；“推倒”保留原文的形象与力度。
- source_word: ἀρεῖς
  choice: 把……除去
  rationale: αἴρω在此可指拿走、除掉；“除去”不额外规定审判的具体方式。
- source_word: σπέρμα αὐτῶν
  choice: 他们的后裔
  rationale: σπέρμα字面为“种子”，此处具有世代、子孙之义；“后裔”庄重清楚。
- source_word: ἀπὸ τῆς γῆς
  choice: 从地上
  rationale: γῆ既可指全地，也可指特定土地；此处“地上”保留较宽的范围，不擅自限定为某一地区。
theological_decisions:
- issue: καταβαλεῖς与ἀρεῖς的时态
  choice: 按希腊语形态译为未来：“必将……推倒……除去”
  alternative: 按所指历史事件及后文叙事译为过去：“推倒了……除去了”
  rationale: 两词在现存希腊文本中明确为将来时。尽管可能受闪语表达影响，且上下文或可支持回顾历史事件，正文优先保留直接来源文本的语法形态，不以历史重构取代原文张力。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“神啊”对应呼格ὁ θεός；用“但”表达καί在语境中的转折衔接。句末逗号保留本节与下节连续成句的形式。
