  text: Look, Lord, and raise up for them their king, Look, Lord, and raise up for them their king, the son of David, at the time you chose, O God, for him to reign over Israel your servant., at the time Look, Lord, and raise up for them their king, a son of David, at the time you chose, O God, for him to reign over Israel your servant., O God, for him to reign over Israel your servant.
translation:
  language: zh_hans
  text: 主啊，求你垂看，为他们兴起他们的王——大卫之子；上帝啊，在你所看定的时刻，使你的仆人作王统治以色列。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所看定的”直译为“你所看见的”；这里可理解为上帝所认定或选定的。
    reason: 保留原文ἴδες的字面意象及其可能的语用含义。
  - marker: b
    text: “仆人”所译的希腊词也可指“孩子”或“儿子”；按本句语境，它指将要统治以色列的大卫之子。
    reason: 说明παῖς的词义范围，并交代本译文采用的句法理解。
lexical_decisions:
- source_word: ἴδε
  choice: 求你垂看
  rationale: 保留“看”的基本意象，同时用现代汉语祈求语气自然表达希腊文命令式。
- source_word: ἀνάστησον
  choice: 兴起
  rationale: 此处指上帝使所应许的君王出现并就位；“兴起”既贴近原词，也保留其庄重的经文语域。
- source_word: υἱὸν Δαυίδ
  choice: 大卫之子
  rationale: 按同位语理解，说明“他们的王”的身份；采用传统而清楚的称谓，不擅自加入不定或定指。
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: 在你所看定的时刻
  rationale: ἴδες字面为“你看见了”；“看定”保留视觉意象，也传达此处上帝认定、选定时机的语用含义。
- source_word: παῖδά σου
  choice: 你的仆人
  rationale: παῖς可指孩子、儿子或仆人；在君王受上帝差遣统治的语境中，“仆人”最为合适，但以脚注保留词义歧义。
theological_decisions:
- issue: “大卫之子”的定指程度
  choice: 大卫之子
  alternative: 大卫的一个后裔／那位大卫之子
  rationale: 希腊文υἱὸν Δαυίδ无冠词，但作为“他们的王”的同位语，中文不宜强行加入“一个”或“那位”，以免过度确定其弥赛亚称号或不定性。
- issue: “你的仆人”所指对象
  choice: 理解为将要作王的“大卫之子”
  alternative: 理解为以色列，即“你的仆人以色列”
  rationale: παῖδά σου为宾格，最自然地充当βασιλεῦσαι的逻辑主语；ἐπ’ Ἰσραήλ则表示其统治对象。因此译为“使你的仆人作王统治以色列”，同时脚注说明句法。
translation_notes:
  register: 采用现代、庄重而可诵读的祈祷语体。“主啊，求你垂看”自然呈现呼求；破折号标明“大卫之子”是“他们的王”的同位说明。避免照搬受损且重复的英文咨询文本，直接依据所给希腊文校勘本翻译。
