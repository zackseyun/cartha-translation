  text: And the blessing of the Lord is with him in strength,[a]
translation:
  language: zh_hans
  text: 主的祝福以大能与他同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在力量中”；也可译“以能力”或“在强盛中”。此短语可说明祝福与他同在的方式，或概括全句的状态。
    reason: 保留ἐν ἰσχύϊ的词义范围及其修饰关系上的弹性。
lexical_decisions:
- source_word: εὐλογία
  choice: 赐福
  rationale: 此处指主所赐的福；“赐福”既自然，也比单用“福”更清楚地表达其来源。
- source_word: Κυρίου
  choice: 主的
  rationale: 属格表示赐福来自主；译作“主的”简洁而忠实。
- source_word: μετʼ αὐτοῦ
  choice: 与他同在
  rationale: μετά加属格通常表示“与……同在”；此译保留陪伴、同在的关系含义，不额外解释。
- source_word: ἐν ἰσχύϊ
  choice: 大有能力
  rationale: ἰσχύς可指力量、能力或威力。结合现代汉语表达，译作“大有能力”较自然；其修饰范围在省略系词的短句中略有弹性。
- source_word: '[implied copula]'
  choice: 同在
  rationale: 希腊文省略系词；汉语以“与他同在”自然补足谓语结构。
theological_decisions:
- issue: ἐν ἰσχύϊ的修饰关系
  choice: 将其理解为说明主的赐福以大能与他同在
  alternative: 理解为“主的赐福与处于强盛中的他同在”
  rationale: 词序上ἐν ἰσχύϊ位于句末，可与整句或“同在”的状态相连。正文采用较自然且符合上下文的表达，但脚注保留更贴近形式的译法与潜在歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大有能力”避免生硬的“在力量中”，脚注则保存原文形式与可行替代译法。
