  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: zh_hans
  text: 因为他必认出他们：他们全都是他们的上帝的儿子[a]；他必按他们的支派，将他们分派在那地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的上帝的儿女”；希腊文直译为“儿子”。
    reason: lexical_alternative
  - marker: b
    text: “那地”也可译作“大地”；希腊词既可指特定土地，也可指全地。
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: 必认出
  rationale: 此处不是单指获得知识，而是认出、确认他们的身份；“认出”保留了关系性语气。
- source_word: υἱοὶ θεοῦ εἰσιν αὐτῶν
  choice: 都是他们上帝的儿子
  rationale: 按现有希腊文本的词序，αὐτῶν最自然地修饰θεοῦ，即“他们的上帝”；υἱοί直译为“儿子”，保留其阳性复数及可能具有的群体身份含义。
- source_word: καταμερίσει
  choice: 分配
  rationale: 该动词表示按份划分或配置；结合支派与土地的语境，“分配”自然地传达有秩序的划分。
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: 按他们的支派
  rationale: 这里可表达依支派进行分配，而不只是置于各支派之中；“按”较清楚地呈现其分配性。
- source_word: ἐπὶ τῆς γῆς
  choice: 在那地上
  rationale: γῆ既可指“大地”，也可指特定的“土地”；本节支派分地的语境倾向后者，而“那地”保留领土性的指向。
theological_decisions:
- issue: υἱοὶ θεοῦ的身份称谓
  choice: 他们上帝的儿子
  alternative: 他们上帝的儿女
  rationale: 正文保留希腊文明确的“儿子”，避免将原文的群体身份语言中性化；脚注说明现代汉语中可按泛指理解为“儿女”。
- issue: γῆ的范围
  choice: 那地
  alternative: 大地
  rationale: 支派性的分配语境更支持特定土地，但希腊词本身仍可有较广范围，因此在脚注保留“大地”的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必”体现将来语气；分号划分身份确认与支派分配两个紧密相关的动作。所有脚注标记均置于正文相应位置。
