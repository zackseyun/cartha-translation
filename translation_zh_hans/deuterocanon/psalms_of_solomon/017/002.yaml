  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: zh_hans
  text: 人在地上的寿命有多久呢？对他的指望也与他的寿命相称。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的指望也寄托在这寿命上。”希腊文末尾的代词既可指“人”，也可指“寿命（时日）”。
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς ἀνθρώπου
  choice: 人的寿命
  rationale: χρόνος受ζωῆς限定，指一个人在世生命的有限时长；“寿命”在现代汉语中准确、自然。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 直接表达人的生命所处的尘世范围，简洁而庄重。
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: 与他的寿命相称
  rationale: κατά在这里表达对应或相称关系，而不只是“在……期间”；此译保留指望受人的有限寿命所衡量的含义。
- source_word: ἡ ἐλπὶς αὐτοῦ
  choice: 对他的指望
  rationale: ἐλπίς可指“指望、期望”；结合后文以神为指望的对比，主文将属格和末尾代词理解为以人为对象的指望。
- source_word: ἐπʼ αὐτόν
  choice: 对他
  rationale: 主文把阳性单数代词理解为回指“人”，即指望寄托在有限的人身上；希腊文也容许回指阳性名词χρόνος，故另加脚注保留歧义。
theological_decisions:
- issue: ἐπʼ αὐτόν所指为何
  choice: 指向“人”：对他的指望
  alternative: 指向“寿命/时日”：指望寄托在这寿命上
  rationale: 阳性代词在语法上两解皆有可能。主文取“人”，较能呈现本节对倚靠有限之人的反思，并与下节对神的指望形成对照；脚注保存另一种语法可能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“有多久呢”保留原文问句；“相称”呈现κατά所表达的对应关系，避免把它弱化为单纯的持续时间。
