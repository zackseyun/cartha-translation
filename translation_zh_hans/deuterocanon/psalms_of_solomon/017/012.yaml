  text: The Lord is faithful in all his judgments that he carries out on the earth[a].
translation:
  language: zh_hans
  text: 主在他在地上施行的一切审判中都是信实的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”也可译作“这地”或“境内”。
    reason: γῆ 可泛指全地，也可按语境指特定土地；正文保留较宽泛的译法。
lexical_decisions:
- source_word: πιστός
  choice: 信实的
  rationale: 作谓语描述主可靠、始终如一的品格；“信实”既贴近原词，也保留其神学分量，不另行引入“公义”的词义。
- source_word: κύριος
  choice: 主
  rationale: 按七十士译本传统将此尊称译为“主”，语言庄重自然。
- source_word: κρίμασιν
  choice: 审判
  rationale: 此处指主具体作出的或施行的司法判断；“审判”既可涵盖裁决，也可涵盖审判行动。
- source_word: ποιεῖ
  choice: 施行
  rationale: ποιέω本义宽泛，但与“审判”搭配时，“施行”自然表达审判付诸实施的含义。
- source_word: ἐπὶ τὴν γῆν
  choice: 于地上
  rationale: 保留主施行审判的范围；不把 γῆ 限定解释为某一特定地域。
- source_word: αὐτοῦ
  choice: 他……所施行的一切审判
  rationale: 现代汉语以领属兼关系从句的结构自然表达“他的一切审判，就是他所施行的”；避免生硬重复“他的……他所施行的”，同时不遗漏原文的领属关系。
theological_decisions:
- issue: 本节侧重主的品格，还是审判本身的正确性
  choice: 以“主……是信实的”明确让“信实”述说主的品格，同时用“在……一切审判中”说明这种信实彰显于他的审判行动。
  alternative: 主的一切审判都是公义的。
  rationale: 原文 πιστός 直接作 κύριος 的谓语，并非以“公义”形容审判；现译保留主的品格与其审判行动之间的张力。
- issue: γῆ 指全地还是特定土地
  choice: 正文译“地上”，保持广义。
  alternative: 在这地／境内。
  rationale: 单凭本句无法排除 γῆ 的地域性含义，因此在脚注注明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在……中，都是信实的”保留希腊语谓语结构；“他于地上所施行的一切审判”则以自然汉语整合领属代词与关系从句。
