  yaml_path: translation/deuterocanon/psalms_of_solomon/017/010.yaml
  text: According to their sins you will repay them[a], O God; may they be found according to their works.
translation:
  language: zh_hans
  text: 上帝啊，你必照他们的罪报应他们；愿他们所得的与他们的行为相称。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“愿它照他们的行为为他们被找到”；“它”所指的内容没有明说。
    reason: 说明εὑρεθείη的单数被动形式、缺省主语及原文保留的含混性。
lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  choice: 照他们的罪
  rationale: κατά加宾格表示衡量或对应的标准；“照”简洁保留按其罪行施行报应的比例关系。“罪”对应复数ἁμαρτήματα，不额外限定罪的类别。
- source_word: ἀποδώσεις αὐτοῖς
  choice: 你必……报应他们
  rationale: 将来时ἀποδώσεις表示上帝将按所行的回报；在审判语境中，“报应”自然明确，同时保留回报善恶行为这一词本身的司法色彩。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 形式上虽为主格，但在此作呼语；“啊”清楚传达祷告中的直接称呼。
- source_word: εὑρεθείη αὐτοῖς
  choice: 愿他们所得的
  rationale: εὑρεθείη为单数被动祈愿式，句中没有明说主语，字面近于“愿它为他们被找到”。中文以“愿他们所得的”保留祈愿语气和未明说之报偿，同时避免误译成复数的“愿他们被发现”。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 与他们的行为相称
  rationale: 第二个κατά同样表示衡量标准；“相称”自然表达所得与所行相对应。ἔργα译为“行为”，在现代汉语中比“工作”准确，也不预先判定这些行为的性质。
theological_decisions:
- issue: 第二分句中未明说的主语及报偿性质
  choice: 愿他们所得的与他们的行为相称
  alternative: 愿临到他们的照着他们的行为而定
  rationale: 希腊文εὑρεθείη为单数，主语省略，并未明确所临到的是刑罚、报偿还是结果。译文不补入“惩罚”等神学判断，只把上下文所含的对应关系自然表达出来；脚注交代原文较为含混的字面结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝啊”保留祷告语气；分号呈现两个紧密相连的平行分句。第二分句避免照英语表层译成“愿他们被发现”，因希腊动词为单数，且αὐτοῖς是与格。
