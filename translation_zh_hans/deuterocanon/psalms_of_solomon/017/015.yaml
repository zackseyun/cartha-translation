  text: The enemy acted in estrangement[a], in pride[c][b]; and his heart was estranged from our God.
translation:
  language: zh_hans
  text: 仇敌像外人一样行事[a]，狂妄自大；他的心也与我们的上帝疏远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仇敌在疏离中行事”，或“仇敌以异族人的身份行事”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的心对我们的上帝是陌生的”，或“他的心与我们的上帝隔绝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: 像外人一样
  rationale: ἀλλοτριότης可表示外来、异属或疏离。译作“像外人一样”既自然，又保留仇敌以局外人或异族人姿态行事的可能含义，并与后面的ἀλλοτρία形成呼应。
- source_word: ὁ ἐχθρός
  choice: 仇敌
  rationale: 这是圣经语体中自然、明确的对应，也保留定冠词所指的特定敌对者。
- source_word: ἐποίησεν
  choice: 行事
  rationale: 此处动词没有明说宾语，表示行为或作为；“行事”比单独的“做了”更符合现代汉语。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 狂妄自大
  rationale: ὑπερηφανία表示傲慢、自高；“狂妄自大”清楚传达其负面道德意味，并在汉语中读来自然。
- source_word: ἡ καρδία αὐτοῦ ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: 他的心也与我们的上帝疏远
  rationale: ἀλλοτρία表示陌生、异属或隔离；“疏远”保留关系上的距离，同时避免过度断定这是由先前关系破裂所致。
- source_word: καρδία
  choice: 心
  rationale: “心”是标准的圣经用语，在这里指人的内在意志、思想与倾向。
theological_decisions:
- issue: ἀλλοτριότης与ἀλλοτρία究竟强调异族身份，还是强调与上帝关系上的疏离
  choice: 正文采用“像外人一样”与“疏远”，分别保留身份性和关系性的表达
  alternative: 两处都译成“异族/外邦”，或两处都译成“疏离/隔绝”
  rationale: 希腊词根相同，却可涵盖外来、异属和疏离等意思；经文本身没有完全消除这种张力，因此正文不把两处都限定为单一解释，并用脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“仇敌”“上帝”保持圣经语体；分号保留原文前后两小句的紧密平行。正文中的两个“也/一样”式联系体现ἀλλοτριότης与ἀλλοτρία的词根呼应，但不过度强求生硬的字面对称。
