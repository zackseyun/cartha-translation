  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
translation:
  language: zh_hans
  text: 把罪人从产业中赶出去[a]；像打碎陶匠的器皿那样，除灭那罪人的骄傲[b]；用铁杖打碎他们的一切根基[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“基业”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文“罪人”是单数，也可能是代表一类人的单数用法。
    reason: lexical_alternative
  - marker: c
    text: “一切根基”也可理解为“所有财物”“赖以立足的一切”或“全部实力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῶσαι
  choice: 赶出去
  rationale: 表达强制驱逐之意，现代汉语自然有力。
- source_word: κληρονομίας
  choice: 产业
  rationale: 既可指承受所得之物，也能保留土地或群体所承受基业的语境意味。
- source_word: ἐκτρῖψαι
  choice: 除灭
  rationale: 该动词可表示彻底毁灭或抹除；“除灭”适用于抽象宾语“骄傲”，同时保持审判语气。
- source_word: ὑπερηφανίαν ἁμαρτωλοῦ
  choice: 罪人的骄傲
  rationale: 保留希腊文单数形式及其可作代表性单数的开放性。
- source_word: σκεύη κεραμέως
  choice: 陶匠的器皿
  rationale: 准确保留陶制器皿易被打碎的具体意象及其经文呼应。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 用铁杖
  rationale: 简洁自然，并保留“铁杖”这一鲜明的审判意象。
- source_word: συντρίψαι
  choice: 打碎
  rationale: 传达猛烈击破、粉碎的含义，也与陶器意象相呼应。
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: 他们的一切根基
  rationale: ὑπόστασις可涉及使其立足的基础、实质或财产；“一切根基”保留其宽泛性，避免限定为物质财富。
theological_decisions:
- issue: “罪人”单数的指称范围
  choice: 正文保留单数“罪人”，脚注说明可作代表性单数
  alternative: 译作复数“罪人们的骄傲”
  rationale: 希腊文ἁμαρτωλοῦ为单数；不应在正文中无依据地消除单复数张力。
- issue: ὑπόστασις的范围
  choice: 译作“一切根基”，并在脚注列出“所有财物”与“立足之处”等可能
  alternative: 直接限定为“全部财产”
  rationale: 原词在此可能指财产、实力基础或整体立足状态，需保留语义开放性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，以三个连续动作呈现审判场景。保留“产业”“陶匠的器皿”“铁杖”等传统经文意象，同时用脚注交代单数形式及ὑπόστασις的词义张力。
