  yaml_path: translation/deuterocanon/psalms_of_solomon/017/031.yaml
  text: And no sojourner or foreigner shall sojourn among them any longer[a]; he will judge peoples and nations in the wisdom of his righteousness[d][c][b]. Selah.
translation:
  language: zh_hans
  text: 寄居者和外族人都不再寄居在他们中间[a]；他必以自己公义的智慧审判众民和列国[b]。细拉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“侨居者”；本句也可译作“寄居者和外族人都不再住在他们中间”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”。
    reason: lexical_alternative
  - marker: c
    text: “细拉”可能是礼仪或音乐上的停顿标记，确切含义不明。
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  choice: 寄居者
  rationale: 指住在一族群中却不具本地人身份的人；“寄居者”既自然庄重，也能与同根动词 παροικήσει 的“寄居”形成呼应。
- source_word: ἀλλογενής
  choice: 外族人
  rationale: 强调出身于另一族群；“外族人”与“寄居者”有所区别，又不把含义限定为现代国籍概念。
- source_word: παροικήσει
  choice: 寄居在他们中间
  rationale: 保留与 πάροικος 的词根联系，并表达以非本地人身份居住于其中的意思。
- source_word: λαούς
  choice: 众民
  rationale: 用“众民”表达复数集合意义，并与后面的 ἔθνη“列国”保持区分。
- source_word: ἔθνη
  choice: 列国
  rationale: 在王权和审判语境中，“列国”自然庄重，也保留与“众民”的并列表达。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: 此处指施行审判时的明智与洞察；“智慧”最能保留原词的宽广含义。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: “公义”既涵盖统治者的道德正直，也适合审判语境；“公正”作为较偏司法层面的译法列于脚注。
- source_word: διάψαλμα
  choice: 细拉
  rationale: 沿用传统音译，以保留这一礼仪或音乐标记确切功能的不确定性。
theological_decisions:
- issue: 王者审判语境中 δικαιοσύνη 的译法
  choice: 他的公义
  alternative: 他的公正
  rationale: 上下文虽关乎审判，因而“公正”可取，但“公义”保留了支撑其审判的整体道德品格，不将含义缩窄为司法程序。
- issue: σοφίᾳ δικαιοσύνης αὐτοῦ 的属格关系
  choice: 以自己公义的智慧
  alternative: 以智慧和公义；以关于自己公义的智慧
  rationale: 按希腊语表面结构保留“公义的智慧”这一略带张力的表达，不擅自改写为两个并列品格。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇体中文。“寄居者……寄居”有意保留希腊文名词与动词的同根呼应；分号体现原文两个主要分句的推进。“必”表达未来性的宣告，不额外加入时间或方式上的解释。
