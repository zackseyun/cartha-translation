  text: καὶ πάροικος καὶ ἀλλογενὴς οὐ παροικήσει αὐτοῖς ἔτι· κρινεῖ λαοὺς καὶ ἔθνη ἐν σοφίᾳ δικαιοσύνης αὐτοῦ. διάψαλμα.
