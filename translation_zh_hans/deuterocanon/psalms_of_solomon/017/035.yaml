  text: and to see the glory of the Lord with which God glorified her[a]; and he himself will be a righteous king over them, taught by God[c][b],
translation:
  language: zh_hans
  text: 并看见主的荣耀，就是上帝使她得荣耀的那荣耀[a]；他自己必作治理他们的公义君王，受上帝教导[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“主的荣耀，就是上帝用来荣耀她的荣耀。”
    reason: lexical_alternative
  - marker: b
    text: “受上帝教导”也可译作“蒙上帝训诲”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他自己必作受上帝教导、治理他们的公义君王。”希腊原文此分句没有明示动词。
    reason: previous_rendering
lexical_decisions:
- source_word: δόξαν Κυρίου
  choice: 主的荣耀
  rationale: “荣耀”既可表达显明的尊荣与光辉，也保留圣经语体；属格结构按自然读法译为“主的荣耀”。
- source_word: ἐδόξασεν αὐτήν
  choice: 使她得荣耀
  rationale: 保留δόξα与δοξάζω的同根呼应；阴性代词“她”照应上下文中人格化的城（耶路撒冷），不擅自改成中性指代。
- source_word: βασιλεὺς δίκαιος
  choice: 公义君王
  rationale: “公义”贴合δικ-词族在圣经语境中的道德和神学内涵，“君王”则保持庄重而自然。
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: 受上帝教导
  rationale: 直接表达该形容词的被动意义，同时避免生硬的“上帝所教的”。
- source_word: ἐπ’ αὐτούς
  choice: 治理他们
  rationale: 在君王语境中表示其统治所及的对象；译为“治理他们”比直译“在他们之上”更符合现代汉语。
theological_decisions:
- issue: 第二分句没有明示系词
  choice: 补出“必作”
  alternative: “他自己——受上帝教导的公义君王——治理他们”
  rationale: 希腊文本此处为无动词结构；结合诗篇的未来盼望语境，“必作”以最少增补使汉语句子完整，同时不把身份、统治与受教之间的关系解释得过细。
- issue: διδακτὸς ὑπὸ θεοῦ与ἐπ’ αὐτούς的修饰关系
  choice: 将“治理他们”紧接“公义君王”，并把“受上帝教导”置后
  alternative: “他自己必作受上帝教导、治理他们的公义君王”
  rationale: 此安排使ἐπ’ αὐτούς清楚地与王权相连，同时保留“受上帝教导”既可描述君王身份、也可说明其作王方式的张力。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“使她得荣耀的那荣耀”有意保留希腊文名词与动词的同根反复；“她”保留人格化城市的阴性指代。标点将两个并列片段连接起来，并在第二分句补出汉语所需的谓语。
