base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/034.yaml
  text: for nations to come from the end of the earth to see his glory[a], bringing her weakened sons as gifts[b],
translation:
  language: zh_hans
  text: 使列国从地极前来瞻仰他的荣耀，把她衰弱的儿子作为礼物带来，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把她那些已经变得衰弱（或：疲惫不堪）的儿子作为礼物带来。”
    reason: 说明完成时分词 ἐξησθενηκότας 也可突出变弱的过程或疲惫状态。
lexical_decisions:
- source_word: ἔθνη
  choice: 列国
  rationale: 指以色列以外的各民族；“列国”既符合诗体语域，也避免把经文的对比强化为专门的族群术语。
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: 从地极
  rationale: 保留希腊文单数表达所指的极远之地；“地极”在现代中文圣经语体中自然凝练。
- source_word: ἰδεῖν
  choice: 瞻仰
  rationale: 这里是表示目的的不定式；“瞻仰”既包含观看之意，又适合以荣耀为宾语的庄重语境，但不额外规定敬拜行为。
- source_word: δόξαν
  choice: 荣耀
  rationale: “荣耀”是 δόξα 的标准对应，保留其宗教和君王语境中的分量，而不缩减为外在的华美。
- source_word: φέροντες δῶρα
  choice: 作为礼物带来
  rationale: δῶρα 与宾语“儿子”形成说明关系，表明这些儿子本身被作为礼物带来；此译法使句法关系清楚。
- source_word: τοὺς ἐξησθενηκότας
  choice: 衰弱的
  rationale: 完成时分词表示已经陷入并仍处于软弱状态；“衰弱的”保留结果状态，同时不限定为疾病、疲惫或受压迫所致。
- source_word: υἱοὺς αὐτῆς
  choice: 她的儿子
  rationale: 保留原文阳性复数“儿子”以及阴性单数所有格“她的”；“她”按上下文回指耶路撒冷。
theological_decisions:
- issue: ἔρχεσθαι 与上文的句法联系
  choice: 译为“使列国……前来”，作为承接上文的目的或结果结构
  alternative: 译为独立陈述“列国将……前来”
  rationale: ἔρχεσθαι 是不定式，并非将来时直陈式；本节应继续依附上文的谓语。中文补出“使”以维持该依附关系，但目的与结果之间的细微张力仍由上下文决定。
- issue: “她衰弱的儿子”被带来的身份
  choice: 明确译为儿子被“作为礼物”带来
  alternative: 译作“带着礼物和她衰弱的儿子前来”
  rationale: 希腊文中 δῶρα 与 τοὺς…υἱοὺς 的关系最自然地表明儿子本身是礼物；不将“礼物”另解为未明说的物品。
translation_notes:
  register: 采用现代、庄重而清楚的诗体经文语域。“地极”“荣耀”保留传统圣经措辞；“前来瞻仰”比直译“来看”更符合对象和语境。逗号表明本节语法上延续前文，句末不作完整收束。
