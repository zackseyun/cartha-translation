  text: His words are like the words of holy ones in the midst of sanctified peoples.
translation:
  language: zh_hans
  text: 他的话如同圣者在被分别为圣的众民中间所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: 他的话
  rationale: λόγοι 指言语、话语；译作“他的话”简明自然，也保留本节 λόγοι 的重复。
- source_word: ὡς
  choice: 如同
  rationale: ὡς 在此引出比较；“如同”明确保留相似而非等同的语义。
- source_word: λόγοι ἁγίων
  choice: 圣者的话
  rationale: ἁγίων 最自然地按名词性用法理解，指圣洁的人；“圣者”保留人称所指，又避免将其误解为修饰 λόγοι 的“圣言”。
- source_word: ἐν μέσῳ
  choice: 中间
  rationale: 该短语表示处于某群体之中；结合“发于……中间”既保留空间意象，也符合现代汉语表达。
- source_word: λαῶν ἡγιασμένων
  choice: 被分别为圣的众民
  rationale: λαῶν 是复数，故用“众民”；ἡγιασμένων 是完成时被动分词，译作“被分别为圣的”保留已经蒙受成圣或奉献之行动的被动意味。
theological_decisions:
- issue: ἁγίων 与 ἡγιασμένων 的区分
  choice: 分别译作“圣者”与“被分别为圣的”
  alternative: 均译作“圣洁的”
  rationale: 前者是名词性形容词，指圣洁之人；后者是被动分词，表达被使成圣或被奉献的状态。区别翻译可保存原文的语法与神学张力。
- issue: λαῶν 的复数
  choice: 众民
  alternative: 人民／一个圣洁的民族
  rationale: 原文明确使用复数，译文不将其归并为单数，也不预设这些群体的具体身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“发于”是为避免“他的话如同……的话……中间”结构生硬而作的最小显化，表达这些话在众民中被说出；不添加说话者身份或群体身份。
