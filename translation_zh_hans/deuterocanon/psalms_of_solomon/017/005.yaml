  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: zh_hans
  text: 主啊，你拣选了大卫作以色列的王；你也曾向他起誓，论到他的后裔[a]，直到永远：他的王权在你面前必不废去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“种子”，这里指他的子孙后代。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的王朝在你面前必不断绝。”
    reason: alternative_reading
lexical_decisions:
- source_word: ᾑρέτισω
  choice: 拣选了
  rationale: 该动词表示上帝选择大卫承担王权；“拣选”既保留神主动选择的含义，也不额外加入正式册立仪式的意思。
- source_word: Κύριε
  choice: 主啊
  rationale: 此处是对上帝的直接呼告；“主啊”符合现代汉语圣经文体，庄重而自然。
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: 作以色列的王
  rationale: 介词结构表达大卫对以色列施行王权；此译符合现代汉语习惯，并忠实传达其职分。
- source_word: περὶ τοῦ σπέρματος
  choice: 论到他的后裔
  rationale: σπέρμα在这里指大卫的血脉和后代；“后裔”清楚自然，字面意义“种子”收入脚注。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 在盟约和应许语境中，该短语表达持久无尽的延续；“直到永远”既自然又保留方向性和持续性。
- source_word: τοῦ μὴ ἐκλείπειν
  choice: 必不止息
  rationale: 该不定式结构说明誓言的内容，表示不消失、不终止；“必不止息”适合王权延续的语境，也保留誓言所带出的确定语气。
- source_word: ἀπέναντί σου
  choice: 在你面前
  rationale: 此短语表示在上帝面前、在其鉴察与认可之中；直译“在你面前”保留原文的盟约色彩。
- source_word: βασίλειον αὐτοῦ
  choice: 他的王国
  rationale: βασίλειον可指王国、王权或王朝；正文采用较直接的“王国”，同时以脚注保留“王朝”的宗族延续含义。
theological_decisions:
- issue: 大卫之约中后裔与王权的关系
  choice: 将誓言表述为关乎大卫后裔的永久应许，并译作“他的王国在你面前必不止息”。
  alternative: 可译作“他的王朝在你面前必不断绝”或“他的王权在你面前必不止息”。
  rationale: 原文同时使用血脉词语σπέρμα和王权词语βασίλειον。正文保留“后裔”与“王国”的并置，不把含义单一限定为领土、王权或王朝；脚注提示其王朝含义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“主啊”保留祷告式呼告；分号和冒号呈现原句由拣选转入誓言、再说明誓言内容的层次。正文尽量贴近希腊文，同时用脚注保留σπέρμα的字面形象及βασίλειον可能具有的王朝含义。
