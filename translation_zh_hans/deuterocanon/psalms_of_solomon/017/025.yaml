  text: In wisdom and righteousness[c][b][a], cleanse Jerusalem from nations trampling her in destruction.
translation:
  language: zh_hans
  text: 求你以智慧和公义[c][b]洁净耶路撒冷，除去那些践踏她、使她毁灭的列国[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”也可译作“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”。
    reason: lexical_alternative
  - marker: c
    text: 原文将“以智慧、以公义”置于句末；这两个短语与前文的修饰关系略有含混。
    reason: source_ambiguity
lexical_decisions:
- source_word: καθάρισον
  choice: 洁净
  rationale: 保留命令式所表达的坚决行动，也兼顾除去污秽与清除败坏势力的含义。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及通行译名。
- source_word: ἐθνῶν
  choice: 列国
  rationale: 这里指压迫耶路撒冷的外族势力；“列国”既自然，也避免把词义过早限定为宗教身份上的“外邦人”。
- source_word: καταπατούντων
  choice: 践踏
  rationale: 保留该分词所描绘的粗暴压迫与凌辱意味。
- source_word: ἐν ἀπωλείᾳ
  choice: 使她毁灭
  rationale: 将紧接“践踏”的介词短语理解为破坏性的结果；中文用使动表达较为清楚，同时不把其具体性质说得过细。
- source_word: ἐν σοφίᾳ
  choice: 以智慧
  rationale: 置于句首并与“洁净”相连，表达行动的方式或凭借；“以”在现代中文中自然且保留工具、方式两方面的弹性。
- source_word: ἐν δικαιοσύνῃ
  choice: 以公义
  rationale: 与“以智慧”平行，保留 δικαιοσύνη 的道德正直含义；语境也容许“公正”这一司法色彩较强的译法。
theological_decisions:
- issue: ἐθνῶν 应译为“列国”还是“外邦人”
  choice: 列国
  alternative: 外邦人
  rationale: 经文直接描写压迫耶路撒冷的外族群体。“列国”保留民族、政治层面的广度，不额外强化犹太人与外邦人的宗教分类。
- issue: ἐν σοφίᾳ、ἐν δικαιοσύνῃ 修饰何者
  choice: 理解为修饰命令“洁净”，即求上帝以智慧和公义洁净耶路撒冷
  alternative: 可理解为说明列国受审判或被除去的准则；若依原词序置于句末，修饰关系仍较含混
  rationale: 希腊语结构简练，存在一定附着歧义。中文把短语前置，可避免误读为列国“以智慧和公义”践踏耶路撒冷，同时用脚注保留原词序所容许的张力。
- issue: ἐν ἀπωλείᾳ 表达践踏的方式、处境还是结果
  choice: 译作“使她毁灭”，按破坏性结果理解
  alternative: 在毁灭中；以毁灭的方式
  rationale: 此处介词短语意义压缩。“使她毁灭”符合上下文，也比生硬的“在毁灭中践踏她”更容易理解，但不进一步界定毁灭究竟是军事、政治还是宗教性的。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“求你”补出祈求语气中的隐含对象，不为神命名；“使她脱离”是中文为表达 καθάρισον…ἀπὸ 的自然句法补足。脚注标记全部置于相关主文成分之后。
