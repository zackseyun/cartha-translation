  yaml_path: translation/deuterocanon/psalms_of_solomon/017/046.yaml
  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
translation:
  language: zh_hans
  text: 他必以公正引领他们众人；他们中间必没有傲慢，以致有人在他们中间受欺压。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译近于“他们中间必没有‘在他们中间受欺压’的傲慢”。其中不定式为被动形式，且与“傲慢”的搭配在句法和语义上都较生硬。正文按其可能表达的结果来译，保留“受欺压”的被动含义；也可按上下文意译为“他们中间必没有傲慢，以致彼此欺压”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: 以公正
  rationale: ἰσότης可指平等或公平、公正的对待；在君王治理的语境中，“以公正”自然表达不偏不倚的领导，同时不把含义局限为抽象的“平等”。
- source_word: πάντας αὐτοὺς
  choice: 他们众人
  rationale: 保留πάντας的周全、强调意味，又符合庄重的现代汉语表达。
- source_word: ἄξει
  choice: 必……引领
  rationale: ἄγω的基本义是带领、引导；“引领”既贴合词义，也与上下文的牧养意象协调。
- source_word: ὑπερηφανία
  choice: 傲慢
  rationale: 该词表示自高和凌人的态度；“傲慢”在现代汉语中清楚而庄重，并能体现其社会性的压人意味。
- source_word: τοῦ καταδυναστευθῆναι
  choice: 以致有人……受欺压
  rationale: 传世希腊文本使用被动不定式，直指“受欺压”。将τοῦ加不定式理解为结果，既保留被动态，也使汉语通顺；不擅自改成主动的“彼此欺压”。
- source_word: ἐν αὐτοῖς
  choice: 在他们中间
  rationale: 此短语以复数人物群体为指称，译作“在他们中间”最自然；末次出现也予以保留，以反映原文重复。
theological_decisions:
- issue: 君王统治下群体的社会特征
  choice: 经文描写君王以公正引领全体，并且群体内部无人因傲慢而受欺压。
  alternative: 把末句主动化为“没有人傲慢地欺压别人”或“彼此欺压”。
  rationale: 原文确实呈现公正治理与免受内部压迫的伦理图景，但καταδυναστευθῆναι在形式上是被动语态。正文保留这一点，不进一步指定欺压者，也不导入经文未明说的制度性主张。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必”体现两个将来时动词的确定语气；分号呈现原文两个并列分句。正文刻意保留末句的被动形式及两次“他们中间”的重复所表达的群体范围，同时用“以致有人”疏通汉语句法。
