base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/041.yaml
  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: zh_hans
  text: 他自己也纯洁无罪，为要统治各大民族，斥责掌权者，并以自己话语的力量除掉罪人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”或译“赶走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: 纯洁无罪
  rationale: καθαρός表达道德上的纯洁，ἀπὸ ἁμαρτίας说明这种纯洁与罪相隔绝。“纯洁无罪”在现代汉语中自然庄重，也保留原文对其道德纯全的直接陈述。
- source_word: ἄρχειν
  choice: 统治
  rationale: 该词指行使权柄；“统治”简洁地传达王权语境，又不额外限定为某种具体政体。
- source_word: λαοὺς μεγάλους
  choice: 各大民族
  rationale: λαοί为复数，指不同的民族或民众群体；μεγάλους意为“大、强盛”。“各大民族”保留其复数及政治—族群范围。
- source_word: ἐλέγξαι
  choice: 斥责
  rationale: 该动词可指揭露、责备或判明有罪；面对掌权者时，“斥责”自然表达带权威的谴责，同时不将司法含义过度具体化。
- source_word: ἄρχοντας
  choice: 掌权者
  rationale: 此词泛指执政、统治的人。“掌权者”比特定官衔更能保留原文的宽泛所指。
- source_word: ἐξᾶραι
  choice: 除掉
  rationale: 该词表示移去、除去；“除掉”保留其强烈而宽泛的作用，正文不擅自断定是驱逐还是杀灭。
- source_word: ἐν ἰσχύϊ λόγου
  choice: 以自己话语的力量
  rationale: 该短语说明其行动借着有能力的话语实现。汉语补出与主语一致的“自己”，使所属关系清楚而不改变原意。
theological_decisions:
- issue: 这位人物被描述为与罪无涉
  choice: 纯洁无罪
  alternative: 远离罪恶／没有罪
  rationale: 原文以“纯洁”这一道德隐喻直接描述该人物；译文保留这一强陈述，不把它弱化为仅仅避免某些罪行，也不引入文本未明说的后期教义术语。
- issue: 除掉罪人的具体方式
  choice: 保留为宽泛的“除掉”
  alternative: 赶走罪人
  rationale: ἐξᾶραι本身可表示移除或带走，未必明确指处死；正文保留范围较宽的表达，脚注列出驱逐性的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他自己也”保留καὶ αὐτός的强调；一连串不定式按目的关系译作“为要……”，使句法自然，同时维持统治、斥责和除掉三项行动的并列结构。
