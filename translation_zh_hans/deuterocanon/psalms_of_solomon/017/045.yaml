base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/045.yaml
  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
translation:
  language: zh_hans
  text: 他以忠信[a]和公义[b]牧养主的羊群，也不容他们中有谁在他们的草场上衰弱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信心”；希腊语 πίστει 既可指信心，也可指忠信。这里更自然地描述牧养者行事的方式。
    reason: lexical_alternative
  - marker: b
    text: “公义”或译“正义”。
    reason: lexical_alternative
  - marker: c
    text: “在他们的草场上衰弱”也可译为“在他们放牧之处变得软弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμαίνων
  choice: 牧养
  rationale: 保留牧人与羊群的统治隐喻；结合后面的将来时谓语，汉语用“他……牧养……也不容……”自然表达两个彼此协调的行动，同时不把分词另行解释为时间或原因从句。
- source_word: τὸ ποίμνιον
  choice: 羊群
  rationale: 准确指作为整体的群羊，并与“牧养”和“草场”的连续意象自然衔接。
- source_word: Κυρίου
  choice: 主的
  rationale: 将属格自然译为所有关系，并按本项目惯例将 κύριος 译作“主”。
- source_word: πίστει
  choice: 忠信
  rationale: 此处更可能描述牧养者行事可靠、信实的品格；“忠信”既自然又保留其与“信”的词义联系。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 保留该词广泛的道德与治理含义；“正义”也是可能的语境译法，但范围略窄。
- source_word: ἀφήσει
  choice: 不容
  rationale: 与后接不定式搭配时表示不允许某事发生；“不容”简洁而庄重。
- source_word: ἀσθενῆσαι
  choice: 衰弱
  rationale: 表达进入软弱、虚弱状态，适合羊群在牧养之下不致衰败的语境。
- source_word: ἐν αὐτοῖς
  choice: 他们中有谁
  rationale: 按复数群体中的分配意义处理，使汉语清楚表达羊群之中无人衰弱，而不生硬直译为“在他们里面”。
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: 在他们的草场上
  rationale: 延续牧养意象，并保留 αὐτῶν 所表达的“他们的”；“草场”是现代汉语中自然、具体的说法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“牧养—羊群—草场”的连续意象；主句用“也”承接希腊语 καὶ，并避免将开头分词明确解释为时间、原因或条件关系。
