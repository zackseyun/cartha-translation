  text: to destroy lawless nations with the word of his mouth[a], to make nations flee from before him at his threat[c][b], and to convict sinners by the word of their heart.
translation:
  language: zh_hans
  text: 用他口中的话毁灭不法的列国，以他的威吓使列国从他面前逃跑[a]，并借罪人心里的话定罪罪人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国因他的威吓从他面前逃跑。”希腊文以不定式表达列国逃跑；中文正文采用使动表达，以显明前后动作的联系。
    reason: syntactic_ambiguity
  - marker: b
    text: 或译：“借罪人心里的话揭露他们。”希腊文表述凝练，可能是说他们因自己内心的话或意图而显出罪来；“心”在希腊文中为单数，具有集合或分配意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: 毁灭
  rationale: 保留动词强烈的毁坏、除灭含义，又不加上原文没有明确表达的“彻底消灭”等强化成分。
- source_word: ἔθνη παράνομα
  choice: 不法的列国
  rationale: “不法”保留 παράνομα 与“律法”的道德—法律关联；ἔθνη 在此泛指列国，不限定为后来的宗教术语“外邦人”。
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: 用他口中的话
  rationale: 贴近原文具体的“口”与“话”之意象，表达审判借言语施行。
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: 以他的威吓
  rationale: ἀπειλή 可指威吓、警告或严厉斥责；“威吓”保留其强烈语气和工具性。
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: 使列国从他面前逃跑
  rationale: 中文用使动结构自然表达他的威吓导致列国逃跑；“从他面前”保留 προσώπου 的具体意象和圣经式司法场景。
- source_word: ἐλέγξαι
  choice: 定罪
  rationale: 该词可表示揭露、责备或判明有罪；在弥赛亚施行审判的语境中，“定罪”体现其司法力度，同时以脚注保留其他可能。
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: 借罪人心里的话
  rationale: 保留 λόγος 的“话”以及心中言语的凝练意象；中文以“罪人心里”自然表达希腊文复数所有者搭配单数 καρδίας 的分配性用法。
theological_decisions:
- issue: 受膏君王以言语施行审判
  choice: 保留“口中的话”“威吓”和“心里的话”等言语意象，不说明其施行审判的具体机制。
  alternative: 把这些表达完全意译为君王凭主权施行审判。
  rationale: 原文反复强调 λόγος、στόμα 和 ἀπειλή；译文应保留这种张力，不引入后来的教义解释。
- issue: ἐλέγξαι 的司法力度
  choice: 译为“定罪”。
  alternative: 译为“揭露”或“责备”。
  rationale: 上下文是王者审判不法列国与罪人，“定罪”较能传达司法语境；但该词语义范围较宽，因此在脚注中注明另一译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国”“从他面前”保留经文语体；避免使用生僻文言。正文维持三个并列动作，并以脚注交代使动句法及末句的真实歧义。
