translation:
  language: zh_hans
  text: 当一个不属于我们族群的人起来反对他们时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当一个外族人起来反对他们时。”
    reason: 词汇替代译法；ἀλλότριον γένους ἡμῶν可简洁地译为“不属于我们族群的”或“外族的”。
lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: 当……起来……时
  rationale: ἐν加冠词不定式在这里构成时间从句；译为“当……时”符合现代汉语表达，“起来”保留动词的动态意味。
- source_word: αὐτοῖς
  choice: 攻击他们
  rationale: ἐπανίστημι所支配的与格通常表示所反对的一方；“攻击他们”自然表达敌对含义。
- source_word: ἄνθρωπον
  choice: 一个……人
  rationale: 原文为阳性单数；“一个……人”保留其单数人物指称，同时符合自然汉语。
- source_word: ἀλλότριον
  choice: 不同
  rationale: 该词在此表示不属于己方、外来的身份；与“族类”结合译作“与……不同”，避免“陌生”可能产生的仅指不熟悉之义。
- source_word: γένους ἡμῶν
  choice: 与我们族类
  rationale: γένος表示出身、族裔或共同体归属；“族类”较贴近原词，又不将意义过早限定为现代民族国家或现代种族概念。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文稍偏形式对应，以“与我们族类不同”保留希腊文ἀλλότριον与属格γένους ἡμῶν的结构和族群归属含义；脚注提供更自然凝练的“外族人”。
