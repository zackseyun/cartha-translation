base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/032.yaml
  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
translation:
  language: zh_hans
  text: 他必有列国的众民在他的轭下为他服役[a]；他也必在全地瞩目之处荣耀主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他必使列国的众民在他的轭下为他服役”，或“他必有列国的众民在他的轭下作臣民”。
    reason: 原文“有”加宾语和不定式，可侧重掌有这些民，也可传达他们受辖制而服役的意思。
  - marker: b
    text: 也可译作“在全地闻名之处”或“在全地显著之处”。
    reason: 希腊语ἐπίσημος可表示引人注目、显著或著名；原文并未明确说出该地点的名称。
lexical_decisions:
- source_word: ἕξει
  choice: 必有
  rationale: 这是ἔχω的将来时；译作“必有”既保留“拥有、掌有”的基本含义，也可自然衔接宾语与不定式，避免把原文明确改写成单纯的使役结构。
- source_word: λαοὺς ἐθνῶν
  choice: 列国的众民
  rationale: 分别体现λαοί的复数群体含义和ἐθνῶν的“列国”含义，不预先简化为单一的“外邦人”。
- source_word: δουλεύειν
  choice: 服事
  rationale: 该词可指服役、臣服或作奴仆般事奉；上下文已有“在他的轭下”，足以显出受辖制的意味，因此正文不径直译作“作奴隶”。
- source_word: ζυγὸν
  choice: 轭
  rationale: 保留原文具体的轭之比喻，以及其所表达的管辖与臣服。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此作为称号，按现代中文圣经文体译为“主”。
- source_word: δοξάσει
  choice: 荣耀
  rationale: 直接保留δοξάζω的神学分量，表示使主得荣耀或彰显主的荣耀。
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: 在全地瞩目之处
  rationale: ἐπίσημος在这里作实词性用法，指显著、引人注目之处；此译法不把πάσης τῆς γῆς误解成比较意义的“高过全地”。
theological_decisions:
- issue: “有……服事”是否表达使役或所有关系
  choice: 保留“他必有……服事他”的结构
  alternative: “他必使……服事他”或“他必拥有……作臣民”
  rationale: 原文ἔχω加宾语和不定式兼有掌有与随从服事的语感；正文不把它单一定义为强使役，也不把政治臣属解释得过满。
- issue: ἐν ἐπισήμῳ所指地点的身份
  choice: 不点明具体地点，仅译作“全地瞩目之处”
  alternative: 明确解释为耶路撒冷或圣殿
  rationale: 原文没有直接命名地点；保留其显著却未指明的状态，避免导入文本之外的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国的众民”保留群体复数；“轭”保留原文意象；分号呈现两个并列的将来行动。
