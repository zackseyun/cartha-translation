  yaml_path: translation/deuterocanon/psalms_of_solomon/017/020.yaml
  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: zh_hans
  text: 喜爱虔诚人聚会[a]的人，都从他们那里逃走了；他们遭不法之徒驱散，离散遍及全地，因为天止住了，不再向地上降雨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚会”也可译作“集会”或“会众”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“不再向地上滴下雨水。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγοσαν
  choice: 逃离
  rationale: 该动词表示因危险而逃走；“逃离”简洁自然，也保留了离开某些人的方向含义。
- source_word: συναγωγὰς
  choice: 聚会
  rationale: 此词指人们聚集的群体或集会；“聚会”符合现代汉语，且避免过度引入后来的制度性含义。
- source_word: ὁσίων
  choice: 虔诚人
  rationale: ὅσιος在此侧重对上帝的虔敬与忠信；“虔诚人”比“圣徒”更贴合本书语境，也不引入后来的教会称谓。
- source_word: σκορπισμὸς
  choice: 被驱散
  rationale: 该名词表示四散、离散；结合ὑπὸ ἀνόμων所表达的施事者，汉语用被动表达更自然，并清楚呈现不法之徒造成的驱散。
- source_word: ἀνόμων
  choice: 不法之徒
  rationale: 保留ἄνομος兼具违背律法与邪恶的含义；“不法之徒”自然且带有应有的道德、法律色彩。
- source_word: ἀνέσχεν
  choice: 止住了，不再
  rationale: 此处表示天抑制或停止降雨；这一表达清楚传达持续不降雨的意思。
- source_word: στάξαι ὑετόν
  choice: 降雨
  rationale: στάζω本义为滴下，但与“雨”搭配时，现代汉语译作“降雨”自然庄重；脚注保留原文的具体滴落意象。
theological_decisions:
- issue: ὅσιοι所指群体的称谓
  choice: 虔诚人
  alternative: 圣洁的人／圣徒
  rationale: 原词强调虔敬而非使用ἅγιοι通常表达的“圣”；因此避免把该群体直接套入后来的“圣徒”称谓，同时保留其宗教身份。
- issue: 旱灾与离散之间的因果关系
  choice: 保留“因为”所表达的直接因果连接
  alternative: 将ὅτι弱化为说明或另起一句
  rationale: 原文明确使用ὅτι；译文不替作者解释这场旱灾为何与前述离散相连，也不消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号保留原文两个相关陈述的推进，并保留“因为”带出的因果张力。所有代词均按原文保留；“他们”在首句中的具体所指仍具有一定语境歧义，未擅自明确化。
