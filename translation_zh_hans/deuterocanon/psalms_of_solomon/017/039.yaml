lexical_decisions:
- source_word: κατάξει
  choice: 必……粉碎
  rationale: 按斯威特本所印的 κατάξει 翻译；该形式可由 κατάγνυμι 而来，表示“打碎、粉碎”。这样既保留动作的强烈和审判意味，也不以《以赛亚书》11:4 的措辞取代本版原文。
- source_word: γῆν
  choice: 大地
  rationale: γῆ 既可指“大地”，也可指“土地、国土”。上下文具有广阔的君王审判视野，故正文采用“大地”，并以脚注保留“土地”的可能。
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: 以口中的话
  rationale: 贴近原文的工具格表达，保留君王借权威话语施行审判、而非依靠兵器的鲜明意象。
- source_word: εἰς αἰῶνα
  choice: 直到永远
  rationale: 这是自然、庄重的现代汉语表达，传达持续无尽的时间意义。
theological_decisions:
- issue: 本句可能呼应《以赛亚书》11:4，描写理想君王以口中之言施行审判
  choice: 保留“以口中的话粉碎大地”的直接而强烈的意象
  alternative: 意译为“以命令统治大地”或按《以赛亚书》措辞译作“击打大地”
  rationale: 原文将权威话语与强力审判并置；正文不将其弱化为一般治理，也不因可能的经文呼应而改动斯威特本实际刊印的希腊词。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“以口中的话”有意保留原文诗性的身体意象；“粉碎”忠实反映斯威特本所印 κατάξει 的强烈语义。
