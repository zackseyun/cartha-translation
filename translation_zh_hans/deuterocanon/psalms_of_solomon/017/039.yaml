  text: 因为他必以口中的话粉碎[a]大地[b]，直到永远。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特本希腊文作 κατάξει，意为“粉碎、打碎”。若按可能受《以赛亚书》11:4 支持的校读 πατάξει，则可译作“击打”。
    reason: textual_and_lexical_alternative
  - marker: b
