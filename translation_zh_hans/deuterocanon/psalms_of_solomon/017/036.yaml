  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: zh_hans
  text: 在他的日子里，他们中间必不会有不义[a]，因为众人都是圣洁的；他们的王是主弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有不义。”希腊文动词在形式上是现在时；正文依上下文译作将来意义。
    reason: 原文时态与上下文时间框架之间存在张力。
  - marker: b
    text: 或译：“他们的王是弥赛亚，就是主”；也可理解为：“他们的王是主的弥赛亚。”
    reason: χριστὸς κύριος的两个称号如何相互关联，在句法和神学表达上存在不止一种理解。
lexical_decisions:
- source_word: ἀδικία
  choice: 不义
  rationale: 既涵盖道德上的邪恶，也可表达群体中的不公与错行；比单用“不公”更能保留原词的伦理广度。
- source_word: ἡμέραις αὐτοῦ
  choice: 在他的日子
  rationale: 保留希腊文的时间惯用语及其指向这位王之时代的含义，不直接解释为较窄的“在位期间”。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 他们中间
  rationale: 自然表达不义不会存在于这个群体之中，也贴近原文的空间与群体意象。
- source_word: ἅγιοι
  choice: 圣洁的
  rationale: 直接保留形容词含义，避免用“圣徒”引入可能属于后期传统的固定身份称谓。
- source_word: χριστός
  choice: 弥赛亚
  rationale: 此处是受膏君王的称号；译作“弥赛亚”可保留其犹太王权语境。
- source_word: κύριος
  choice: 主
  rationale: 采用κύριος通常而庄重的对应词，并在称号组合中保留该词，不以解释性改写取代。
theological_decisions:
- issue: 如何翻译χριστὸς κύριος这一称号组合
  choice: 主弥赛亚
  alternative: “弥赛亚，就是主”；或“主的弥赛亚”
  rationale: 希腊文本为两个主格形式，并没有明示所有格。“主弥赛亚”保留两个称号且尽量少作句法判定；其他可能理解列入脚注，以免消除原文的张力。
- issue: 如何处理ἔστιν的时态
  choice: 必没有
  alternative: “没有”
  rationale: ἔστιν在形态上是现在时，但上下文描述将来的弥赛亚统治，“在他的日子”也把陈述置于那一时代；正文以“必没有”传达语境中的将来指向，同时在脚注保留直译。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在他的日子”有意保留原文惯用语；分号用于清楚区分圣洁群体的陈述与王的身份陈述。
