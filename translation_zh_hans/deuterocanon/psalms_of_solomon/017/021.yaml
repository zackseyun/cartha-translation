  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: zh_hans
  text: 从深渊和高山而来的长存的泉源[a]都被阻住了，因为他们当中没有一人施行公义和公平；从他们的统治者到百姓中最卑微的人，全都陷在各样罪中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长存的”也可译为“亘古的”或“古老的”。
    reason: 希腊词 αἰώνιοι 可指长久持续、长存，也可指久远或古老；正文保留其时间含义的开放性。
lexical_decisions:
- source_word: πηγαὶ
  choice: 泉源
  rationale: 指天然涌流的水源；“泉源”既清楚自然，也保留诗歌语体。
- source_word: συνεσχέθησαν
  choice: 被截住了
  rationale: 该被动形式表示受阻、被制止；“被截住”适合水流意象，同时保留审判临到的力度。
- source_word: αἰώνιοι
  choice: 亘古
  rationale: 此词可表示历久、古老或长存；“亘古”符合诗篇语体，并保留时间久远的含义，而不把它限定为哲学意义上的绝对永恒。
- source_word: ἐξ ἀβύσσων
  choice: 从深渊涌出
  rationale: 复数名词表示地下极深之处；在中文中用“深渊”可自然传达其诗意，并以“涌出”明确它修饰泉源的来处。
- source_word: ἀπὸ ὀρέων ὑψηλῶν
  choice: 从高山涌出
  rationale: 直译其地理来源；与“从深渊”并列，并避免误读为泉源被阻止前往高山。
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: 施行公义和公平
  rationale: 保留两个伦理与司法色彩相连的概念，也体现分词所表达的实际行动。
- source_word: ἄρχοντος
  choice: 统治者
  rationale: 泛指掌权治理的人，与后文百姓中地位最低者形成社会层级上的对照。
- source_word: ἐλαχίστου
  choice: 最微小的人
  rationale: 表达百姓中地位最低、最不起眼者，适合与“统治者”构成首尾涵盖。
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: 陷在各样罪中
  rationale: 传达罪恶无所不包的概括意义；中文自然，同时不增添具体罪行。
theological_decisions:
- issue: 非保罗书信语境中 δικαιοσύνη 与 κρίμα 的搭配
  choice: 公义和公平
  alternative: 正义和审判
  rationale: δικαιοσύνη 在此指合乎正道的伦理行为，κρίμα 则带有公正裁断或公平行事的意味；分别译作“公义”和“公平”，可保留二者的关联与区别，不将其合并成单一概念。
translation_notes:
  register: 采用现代、庄重的诗歌语言。“从深渊和高山涌出的”前置修饰“泉源”，使两个介词短语明确表示泉源的来源；后半句用“从……到……”自然表达由统治者至最低微百姓的全面涵盖。
