  terminology: “泉源”“公义和公平”“统治者”均可取。“长存的”比正文的“亘古”更直接保留αἰώνιοι可指持久、常存的含义，同时不预断其究竟指永恒还是古老。脚注保留“亘古的／古老的”作为替代可能。
