  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: zh_hans
  text: 主亲自作他们的王[a][d]；大能者的盼望在于上帝[b]，他必怜悯万国；万国在他面前心存畏惧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“他的王”，不是“他们的王”；这样便会更直接地表明大卫后裔的君王服在主的权下。
    reason: textual_variant
  - marker: b
    text: 斯威特所载的希腊文在这里形式不规则，句法也不确定；可理解为“大能者的盼望在于上帝”，也可能与前句相连。
    reason: textual_variant
  - marker: c
    text: “心存畏惧”也可译作“心存敬畏”；原词既可指惧怕，也可指肃然敬畏。
    reason: lexical_alternative
  - marker: d
    text: 也可把后面的困难短语与前句连读，理解为：“主亲自作他们的王——大能者在上帝里的盼望——并且……”。
    reason: previous_rendering
lexical_decisions:
- source_word: Κύριος
  choice: 主
  rationale: 这里指上帝是终极的君王；“主”既符合希腊词义，也保持庄重而通行的圣经用语。
- source_word: βασιλεὺς αὐτῶν
  choice: 作他们的王
  rationale: 依照斯威特正文保留复数代词 αὐτῶν；“作……的王”是自然的现代汉语表达。
- source_word: ἐλπὶς
  choice: 盼望
  rationale: 保留本诗反复出现的盼望语汇，也不把它先行解释为较抽象的“信心”或“倚靠”。
- source_word: τοῦ δυνατοῦ
  choice: 大能者的
  rationale: 将单数属格保留为指人的称谓，而不抽象化为“力量”；“大能者”兼具清晰度与庄重感。
- source_word: ἐλπὶθ θεοῦ
  choice: 在于上帝
  rationale: 传抄下来的希腊语形式不规则且句法不明；此译与前面的“盼望”组成可读的名词句，同时保留其指向上帝的基本关系，并以脚注说明不确定性。
- source_word: ἐλεήσει
  choice: 必怜悯
  rationale: 准确传达将来时的施怜悯行动，且是自然、庄重的现代汉语。
- source_word: πάντα τὰ ἔθνη
  choice: 列国
  rationale: 在君王语境中泛指所有民族或国家；“列国”简洁地保留其集体和国际范围。
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: 在他面前心存畏惧
  rationale: 保留“在他面前”的关系性表达，并以“心存畏惧”呈现 ἐν φόβῳ；脚注说明它也可含敬畏之意。
theological_decisions:
- issue: 主的王权与上下文中大卫后裔君王的关系
  choice: 主亲自作他们的王
  alternative: 主亲自作他的王
  rationale: 依照斯威特正文的复数代词，表明即使上下文谈到大卫家的统治者，主仍是百姓终极的王；异文的单数读法则以脚注保留，不在正文中替读者解决这一神学张力。
- issue: “大能者的盼望”这一困难短语的句法关系
  choice: 作为独立名词句译为“大能者的盼望在于上帝”
  alternative: 作为同位语连接上句：“主亲自作他们的王，就是那盼望上帝的大能者所盼望的”
  rationale: 原文在 αὐτῶν 后有明显停顿，而后续传本文字本身不规则。正文采用较直接的陈述句，但以脚注明确其不确定性，避免把困难句法强行化为确定的弥赛亚称谓或同位结构。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主亲自作他们的王”保留强调语气；分号和句号体现 αὐτῶν 后的显著停顿，并避免用流畅改写掩盖后一句传本文字的困难。“列国”适合诗体和王权语境，但不引入“外邦人”可能带来的额外宗教分类。
