base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/029.yaml
  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
translation:
  language: zh_hans
  text: 他必不再容许不义存留在他们中间[a]；熟知邪恶的人，也必不与他们同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个抄本的希腊文在“在他们中间”附近语句不整，但整体意思清楚：不义将不再存留于这个共同体中。
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  choice: 容许
  rationale: 此处支配不定式 μεῖναι，表示不准某种状态继续存在；“容许”准确而自然。
- source_word: ἀδικίαν
  choice: 不义
  rationale: 兼具不公与道德邪恶的含义，符合诗篇的道德—宗教语域，又不将含义限缩为司法上的“不公”。
- source_word: ἔτι
  choice: 再
  rationale: 在否定将来表达中表示原有状态不再持续，汉语用“不再”最自然。
- source_word: μεῖναι
  choice: 存留
  rationale: 保留“继续存在”的意义，并具有适度庄重的经文语体。
- source_word: ἐν αὐτῶν
  choice: 在他们中间
  rationale: 抄本此处语法不整，但上下文显然指群体范围；此译保留共同体层面的含义。
- source_word: κατοικήσει
  choice: 同住
  rationale: 表达在共同体中定居、生活的意思，并与 μετ’ αὐτῶν 的“与他们”自然结合。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此单数为泛指；在否定句中译作“……的人，也必不……”符合现代汉语，且不限定性别。
- source_word: εἰδὼς κακίαν
  choice: 熟知邪恶
  rationale: 分词结构不只是抽象地知道邪恶，更可表达与邪恶相熟；“熟知”保留这一较强而仍有歧义的关系，不直接解释为“作恶”。
- source_word: κακίαν
  choice: 邪恶
  rationale: 此处泛指道德上的恶，并非专指恶意；“邪恶”范围与庄重程度相称。
theological_decisions:
- issue: 复兴共同体对不义及熟知邪恶者的排除
  choice: 译文同时表明“不义”不再存留，以及“熟知邪恶的人”不得与群体同住。
  alternative: 可将 ἀδικία 译为“不公”，并将 εἰδὼς κακίαν 意译为“作恶的人”。
  rationale: 原文描绘公义治理下共同体的洁净，但并未明确界定“熟知邪恶”是否等同持续作恶；因此保留其措辞与神学张力，不引入后来的教义分类。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“存留”“不义”保持诗歌和宗教语域；“同住”比“居住”更清楚体现 μετ’ αὐτῶν 的共同生活关系。脚注标记已置于相关短语之后。
