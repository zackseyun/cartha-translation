  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: zh_hans
  text: 那不法之人使我们的土地荒凉，使其中不再有居民；他们[a]把年轻人、老年人和他们的儿女一并除灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文先用单数“那不法之人”，随后转用复数动词“他们……除灭”。译文保留这一转换，没有将其统一。
    reason: textual_variant
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: 使……荒凉
  rationale: 直接表达使土地沦为荒芜之地的结果，既贴近希腊文，也符合庄重的现代汉语。
- source_word: ὁ ἄνομος
  choice: 那不法之人
  rationale: 保留带冠词的单数指称，并以“不法”准确体现ἄνομος所强调的违背律法，而不泛化为一般的“恶人”。
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: 使其中的居民尽都消失
  rationale: 希腊文结构简略，字面近于“使之离开住在其中的人”；此译自然呈现土地因居民被除去而荒凉的含义，并与下句的毁灭相衔接。
- source_word: ἠφάνισαν
  choice: 除灭
  rationale: 体现使人消失、不复存在的强烈含义；用语庄重，适合经文语体。
- source_word: νέον καὶ πρεσβύτην
  choice: 年轻人、老年人
  rationale: 保留两个单数类称所涵盖的年龄两端，在现代汉语中清楚自然。
- source_word: τέκνα αὐτῶν ἅμα
  choice: 他们的儿女一并
  rationale: “儿女”自然表达τέκνα，“一并”保留ἅμα所强调的共同遭灭。
theological_decisions:
- issue: 施事者由单数转为复数
  choice: 前句译“那不法之人”，后句译“他们”
  alternative: 将两句都统一为单数或复数
  rationale: 原文先用单数ὁ ἄνομος及单数动词ἠρήμωσεν，随后转为复数动词ἠφάνισαν。译文不擅自把这处语法张力解释为同一人、其军队或某一群体，而予以保留。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“不法之人”“荒凉”“除灭”兼顾原文力度与汉语可读性；分号保留两项行动之间紧密但有层次的关系。
