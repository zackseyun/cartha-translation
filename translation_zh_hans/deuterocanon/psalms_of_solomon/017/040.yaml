translation:
  language: zh_hans
  text: 他必以智慧[a]、带着喜乐[b]，赐福主的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在智慧中”。
    reason: ἐν σοφίᾳ 可表示行事的方式，也可表示所处的范围或特质。
  - marker: b
    text: 或译：“伴随着欢喜”。原文没有明确说明这喜乐是谁的感受。
    reason: μετʼ εὐφροσύνης 表示喜乐相伴，但没有明说其体验者。
lexical_decisions:
- source_word: εὐλογήσει
  choice: 他必……赐福
  rationale: 该词是 εὐλογέω 的将来时主动语态；“赐福”自然表达向人施予福分的意思，并保留将来指向。
- source_word: λαὸν Κυρίου
  choice: 主的子民
  rationale: λαός 在此指属于主的群体；“子民”比单纯的“人民”更能体现群体归属，同时不额外限定其民族身份。Κυρίου 作为属格按领属关系译为“主的”。
- source_word: ἐν σοφίᾳ
  choice: 在智慧中
  rationale: ἐν 可表示方式，也可表示所处的范围或特质；“在智慧中”保留这种幅度，脚注另列更自然、偏方式性的“以智慧”。
- source_word: μετʼ εὐφροσύνης
  choice: 带着喜乐
  rationale: μετά 加属格表示伴随，εὐφροσύνη 指喜乐、欢欣；“带着喜乐”既表达伴随关系，也避免擅自把喜乐解释成赐福的结果。
theological_decisions:
- issue: 智慧与喜乐如何修饰“赐福”
  choice: 保留为两个伴随或方式性的短语，不说明喜乐属于谁，也不改写成赐福所产生的结果
  alternative: 译作“他必以智慧赐福主的子民，使他们欢喜”
  rationale: 希腊文只说赐福是在智慧中、伴随着喜乐，并未明确说喜乐是子民所得的结果；因此不应补出因果关系。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“在智慧中”略带经文语体，用来保留希腊文 ἐν 的范围与方式两种可能；整体语序适度调整，使中文流畅，同时不增加原文未明说的结果关系。
