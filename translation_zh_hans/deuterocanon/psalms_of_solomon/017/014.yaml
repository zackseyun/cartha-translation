  yaml_path: translation/deuterocanon/psalms_of_solomon/017/014.yaml
  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: zh_hans
  text: 他在自己美貌的烈怒中[a]，把他们远远遣送到西方[b]，又把这地的统治者送去受人嘲弄[c]；他并不留情。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他美貌的烈怒中。”这一希腊文表达本身很不寻常；“美貌”也可译作“美丽”，不宜擅自改释为“威荣”。
    reason: lexical_alternative
  - marker: b
    text: “西方”原文所用的词也有“日落之处”的字面含义。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“又把这地的统治者送去，成为笑柄。”原文的“遣送”同时支配“他们”和“这地的统治者”这两个并列成分。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: 在自己美貌的烈怒中
  rationale: ὀργή表示强烈、带惩罚意味的愤怒，译作“烈怒”；κάλλος通常指美、美貌。这里的属格结构不寻常，仍保留“美貌”及其张力，不因上下文而改释为神圣“荣美”或“威荣”。
- source_word: ἐξαπέστειλεν αὐτὰ
  choice: 把他们远远遣送
  rationale: ἐξαποστέλλω是加强式的“遣送出去”；“远远遣送”兼顾动词的逐出意味与随后ἕως所表达的遥远终点。中性复数代词αὐτά按上下文以汉语通用人称“他们”表达。
- source_word: ἕως ἐπὶ δυσμῶν
  choice: 到西方
  rationale: δυσμαί本指日落，进而指西方；“到西方”自然保留方向意义，ἕως的界限或远达意味由“远远”传达。
- source_word: τοὺς ἄρχοντας τῆς γῆς
  choice: 这地的统治者
  rationale: ἄρχοντες指掌权者或统治者；γῆ在此可指特定土地，译作“这地”而不武断扩大为全世界。
- source_word: εἰς ἐμπαιγμόν
  choice: 送去受人嘲弄
  rationale: ἐμπαιγμός表示嘲弄、讥笑。原文承接ἐξαπέστειλεν，省略了第二个动词；中文补出“送去”以清楚呈现同一动词支配两个宾语，而不另添“使成为”的因果解释。
- source_word: οὐκ ἐφείσατο
  choice: 他并不留情
  rationale: φείδομαι意为顾惜、宽免或不加伤害。原文未明说宾语，因此用绝对表达“并不留情”，不补入“他们”。
theological_decisions:
- issue: 行动者身份是否应被理解为上帝
  choice: 只译作“他”，不加入神圣称谓，也不把κάλλος神学化为“荣美”
  alternative: 按神圣行动者理解，译作“他在自己荣美的震怒中”
  rationale: 本节希腊文本身仅使用第三人称，且上下文所指应由篇章决定；译文不应仅凭“烈怒”等措辞将行动者预先认定为上帝。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“美貌的烈怒”刻意保留希腊文的不寻常搭配，并以脚注说明；其余部分适度调整语序，使省略结构在现代汉语中清楚，但不补足原文未明说的宾语。
