  yaml_path: translation/deuterocanon/psalms_of_solomon/017/050.yaml
  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: zh_hans
  text: 有福的是那些活在那些日子的人[a]，得以在众支派的聚会中看见以色列的福祉。愿上帝成就这事[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些生在那些日子的人”。
    reason: γενόμενοι 可按字面理解为“出生、出现”，也可在语境中泛指活在那一时期的人。
  - marker: b
    text: 末句希腊文十分简略，也可与前文相连，理解为：“由上帝成就的（事）”。
    reason: ποιῆσαι ὁ θεός 可作祈愿性的独立呼语，也可能被理解为说明前述福祉由上帝成就；脚注保留这一句法歧义，且不额外指定未来时。
lexical_decisions:
- source_word: μακάριοι
  choice: 有福的是
  rationale: 采用现代中文圣经祝福语的惯用表达，既保留庄重的末世盼望色彩，也不将其淡化为单纯的快乐或幸运。
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些活在那些日子的人
  rationale: γενόμενοι 本义为“成为、出现”，此处指身处未来那些日子、得以亲见其事的人；译作“活在”自然通顺，同时以脚注保留“生在”的可能。
- source_word: ἰδεῖν
  choice: 将得以……看见
  rationale: 不定式说明这些人蒙福之处，即能够亲身看见所盼望的景象；“得以”传达这一层关系，而“看见”保持朴素直接。
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: 以色列的福祉
  rationale: ἀγαθά 指美善之事、益处或福祉；“以色列的福祉”简洁自然，并保留属格关系的一定开放性，未明确限定为以色列所拥有或为以色列预备。
- source_word: ἐν συναγωγῇ φυλῶν
  choice: 在众支派聚集之时
  rationale: συναγωγή 在此表示聚集、会合；动态表达“聚集之时”自然呈现以色列众支派共同汇聚的场景。
- source_word: ποιῆσαι ὁ θεός
  choice: 愿上帝成就这事
  rationale: 依据希腊文句读及与下一节祈愿句的平行关系，将这个压缩短语理解为独立的祈愿性呼语，保留作者突然转向祷愿的语气。
theological_decisions:
- issue: 末句 ποιῆσαι ὁ θεός 的句法功能
  choice: 作为独立祈愿句：“愿上帝成就这事！”
  alternative: 作为修饰前文的从属成分：“就是上帝将要成就的”
  rationale: 原文在此前有高点号，且该短语很可能是愿望式用法或带愿望意味的不定式；独立成句更能保留祈祷性的感叹语气。不过希腊文形式简略，故在脚注中保留另一种连接方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“有福的是”保持诗篇式祝福语体；将较长的希腊语句分为两句，使中文层次清楚，同时用感叹号保留首句的称福语气和末句的祈愿力度。
