  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: zh_hans
  text: 主啊，你是我们永永远远[a]的王；因为我们的心灵必因你——我们的上帝——而夸耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到永远，甚至更久”；直译近于“直到永世，并且更远”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必以你为夸耀”或“必因你欢欣自豪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此为呼格，直接称呼上帝；“主啊”既准确表达称呼语气，也符合现代汉语敬虔而庄重的表达。
- source_word: Βασιλεὺς
  choice: 王
  rationale: Βασιλεύς的基本义是“王”；此译保留对上帝君王身份与统治权的直接宣认。
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: 永永远远
  rationale: 原短语直译近于“直到永世，并且更久”，强调无尽且延续不止的时间；“永永远远”自然地传达这种加强语气。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝啊
  rationale: 该名词短语在句中可作为对“你”的同位称呼；加“啊”使中文中的直接呼告关系清楚，同时不改变其所指。
- source_word: καυχήσεται
  choice: 必以……为荣
  rationale: καυχάομαι可表示夸耀、引以为荣或欢然自豪；“以你为荣”在现代汉语中自然，并保留以神为夸耀对象的含义。
- source_word: ἡ ψυχὴ ἡμῶν
  choice: 我们的心
  rationale: 希腊文用单数ψυχή配复数领属语，呈现群体共同的内在生命；“我们的心”保留集体单数意象，也比“我们的灵魂”更自然地承接“以你为荣”。
