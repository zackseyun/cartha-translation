  text: The Lord’s salvation be upon Israel[a], his servant[b], forever.
translation:
  language: zh_hans
  text: 愿[a]主的救恩永远临到以色列，就是他的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文没有明说“愿”或“是”；结合上下文的祈祷语气，也可译作陈述句：“主的救恩永远临到以色列……”。
    reason: grammatical_ambiguity
  - marker: b
    text: 或译“他的孩子”或“他的儿子”。希腊词παῖς既可指“仆人”，也可指“孩子／儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 属格与“救恩”相连，表达救恩属于主并从主而来；“主”符合现代中文圣经语体。
- source_word: ἡ σωτηρία
  choice: 救恩
  rationale: σωτηρία可指拯救、解救；“救恩”既保留其宽广的神学含义，也适合本句庄重的祈愿语气。
- source_word: ἐπὶ Ἰσραήλ
  choice: 临到以色列
  rationale: ἐπί在此表示救恩落在或施及以色列；“临到”自然保留了这一空间意象。
- source_word: παῖδα αὐτοῦ
  choice: 他的仆人
  rationale: παῖς可指仆人，也可指孩子或儿子；在上帝与以色列的圣约关系语境中，“仆人”较贴切，同时以脚注保留词义歧义。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该固定表达表示无尽、恒久的时间；“永远”简洁自然。
theological_decisions:
- issue: 无显式动词的分句应理解为陈述还是祈愿
  choice: 以“愿”表达祈愿
  alternative: 主的救恩永远临到／在以色列身上
  rationale: 本节希腊文没有明说限定动词；但上下文连续使用祈愿式，因此将本句理解为祝愿最符合篇章语气，同时用脚注说明原文形式。
- issue: παῖς描述以色列的身份
  choice: 仆人
  alternative: 孩子／儿子
  rationale: “仆人”符合圣经中以色列事奉并隶属于上帝的关系表达；不过原词确有亲子义，故不把另一可能性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句。“就是他的仆人”清楚表明“他的仆人”与“以色列”同位，避免误解为两个对象；同时保留原文在省略动词和παῖς词义上的真实歧义。
