base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/004.yaml
  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: zh_hans
  text: 愿上帝借低声毁谤的嘴唇[a]，使不法之人的家[b]在战争中陷入混乱；愿上帝使不法之人的嘴唇在困境中[c]远离无辜者；愿毁谤者的骸骨从敬畏主的人身边四散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低声毁谤”也可译作“窃窃私语”。希腊语ψιθυρ-词族常指暗中传播的恶意言语，并非单指小声说话。
    reason: lexical_alternative
  - marker: b
    text: “家”也可指家室、家庭或家业，不一定只指房屋。
    reason: lexical_alternative
  - marker: c
    text: “在困境中”在希腊语中的修饰关系不完全明确；可理解为与“不法之人的嘴唇”相关，也可能指无辜者所处的困境，或描述这一行动的情状。
    reason: source_ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: 使……陷入混乱
  rationale: 不定过去时祈愿语气表达咒愿；此译既保留强烈扰乱之意，也符合现代汉语的祈愿句式。
- source_word: οἴκους
  choice: 家
  rationale: οἶκος既可指房屋，也可指家庭、家室或家业；“家”保留这种具体而兼具群体含义的意象。
- source_word: παρανόμους / παρανόμων
  choice: 不法之人
  rationale: 贴近“违背律法”的核心含义，避免笼统译成“恶人”而丢失律法层面的色彩。
- source_word: χείλεσι ψιθυροῖς
  choice: 借低声毁谤的嘴唇
  rationale: χείλεσι为工具与格，故译“借”；ψιθυρ-词族可指暗中、低声的恶意言语，“低声毁谤”兼顾说话方式和敌意。
- source_word: μακρύναι
  choice: 使……远离
  rationale: 祈愿语气表达愿望；“使……远离”保留原词“拉远、置于远处”的空间意象。
- source_word: ἀκάκων
  choice: 无辜者
  rationale: 此词表示无恶意、纯良或未害人的人；“无辜者”在本段受恶言侵害的语境中自然清楚。
- source_word: ἐν ἀπορίᾳ
  choice: 在困境中
  rationale: ἀπορία可指困惑、无计可施或窘迫处境；采用较宽泛的“困境”，不把具体情形说死。
- source_word: ψιθύρων
  choice: 毁谤者
  rationale: 与前面的ψιθυρ-词族保持语义呼应，并在汉语中表达其暗中恶意言说的含义；脚注保留较字面的另一种理解。
- source_word: φοβουμένων Κύριον
  choice: 敬畏主的人
  rationale: 采用圣经汉语中表达虔敬与尊崇的惯用说法。
theological_decisions:
- issue: ἐν ἀπορίᾳ所修饰的对象或范围
  choice: 译作“在困境中”，放在“使……远离”之前，使其主要描述整个行动发生的处境，同时保留一定开放性
  alternative: 理解为特指“陷入困境的不法之人”或“身处困境的无辜者”
  rationale: 希腊语短语的位置不能彻底排除不同附着关系；正文不明确指定哪一方处于困境，脚注说明歧义。
translation_notes:
  register: 采用现代、庄重的祈愿体，以两个“愿上帝”和末句“愿……”重现连续咒愿。保留“嘴唇”“骸骨”等鲜明诗歌意象，不弱化原文的审判语气；用“不法之人”体现παράνομος与律法的关系。
