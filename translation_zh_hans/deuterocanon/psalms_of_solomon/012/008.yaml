  to: 愿那些罪人[c]从主面前彻底灭亡[b]；愿主的虔诚之人[a]承受诸应许。
  rationale: 修订仅收紧两处词义：“彻底”表达该灭亡祈愿所可能具有的终局性，却不把ἅπαξ扩展成“永远”的时间断言；“诸应许”直接对应复数ἐπαγγελίας。其余保留原译的愿望语气、特指的可能性及脚注锚点。
