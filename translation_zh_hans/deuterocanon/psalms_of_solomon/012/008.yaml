base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: zh_hans
  text: 愿那些罪人[c]从主面前彻底灭亡[b]；愿主的虔诚之人[a]承受诸应许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的圣洁之民”或“主的忠信之人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“一次”；希腊语既可能强调只发生一次，也可能强调其最终性。
    reason: lexical_alternative
  - marker: c
    text: 或译“愿罪人灭亡”。
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: 愿……灭亡
  rationale: 希腊语为愿望式，表达祈愿；用“愿……灭亡”保留其意愿语气，又不把动作过度具体化为“被毁灭”。
- source_word: οἱ ἁμαρτωλοὶ
  choice: 那些罪人
  rationale: 定冠词提示这里可能指向一类特定的人；现代汉语不使用冠词，加入“那些”可自然地保留这种特指意味。
- source_word: ἀπὸ προσώπου Κυρίου
  choice: 从主面前
  rationale: 贴近“从主的面前”这一原文意象，同时是自然、庄重的现代汉语，也可涵盖离开主临在或受主审判的意味。
- source_word: ἅπαξ
  choice: 永远
  rationale: 结合灭亡的语境表达一次而终、最终性的可能含义；脚注保留原词也可能仅指“一次”的歧义。
- source_word: ὅσιοι Κυρίου
  choice: 主的虔诚人
  rationale: ὅσιοι表示以敬虔、忠贞为特征的人；“虔诚人”自然且不预先限定为礼仪性的“圣者”或只强调可信性的“忠信者”。
- source_word: κληρονομήσαισαν
  choice: 愿……承受
  rationale: 第二个愿望式继续表达祈愿；“承受”保留获得产业的继承意象。
- source_word: ἐπαγγελίας
  choice: 所应许的一切
  rationale: 希腊语为复数“应许”；汉语用“所应许的一切”既自然，又保留多个应许及其内容的集合意味。
theological_decisions:
- issue: οἱ ἁμαρτωλοὶ是否指特定群体
  choice: 译作“那些罪人”，保留特指可能
  alternative: 译作“罪人”，作为一般道德类别
  rationale: 原文有定冠词，但仅凭本节不宜在正文中明确指定某一历史派别；“那些”既反映语法上的特指，又避免导入未经正文说明的历史鉴定。
- issue: ἅπαξ所强调的是单次发生还是终局性
  choice: 正文采用“永远”，侧重终局性
  alternative: 译作“一次”
  rationale: 灭亡祈愿的语境较支持最终、彻底的含义，但原词本身也可仅表示一次发生，因此以脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而可诵读的祈愿语体。两个“愿”对应原文两个愿望式；分号呈现两项对举的祈愿。正文中的[a]、[b]、[c]均紧随各自所解释的词语。
