  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: zh_hans
  text: 愿主保护那宁静而恨恶不义之人的心灵[a]；愿主引导[b]那在家中[c]促成和睦的男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵”或译“生命”或“自身”。
    reason: lexical_alternative
  - marker: b
    text: “引导”或译“导正”。
    reason: lexical_alternative
  - marker: c
    text: “家中”或译“屋里”或“家庭中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαι
  choice: 保护
  rationale: 不定过去时愿望式在此表达祈愿；“愿主保护”既传达护卫、保守之意，也符合现代汉语祷愿语体。
- source_word: Κύριος
  choice: 主
  rationale: 此处是对上帝的称号；译作“主”符合汉语圣经传统，也自然庄重。
- source_word: ψυχὴν
  choice: 心灵
  rationale: ψυχή可指心灵、生命或人自身；本节描写内在品格，“心灵”较能保留这一层面，同时以脚注注明其他可能。
- source_word: ἡσύχιον
  choice: 宁静
  rationale: 该词表示安静、平静的状态或品格；“宁静”用于修饰“心灵”自然且庄重。
- source_word: μισοῦσαν ἀδίκους
  choice: 恨恶不义之人
  rationale: 分词修饰ψυχή，表示其鲜明的道德立场；ἀδίκους是阳性复数形容词名词化，译作“不义之人”而不泛化为抽象的“不义”。
- source_word: κατευθύναι
  choice: 引导
  rationale: 此动词可表示指引、导正或使道路正直；“引导”在现代汉语中自然，并保留上帝为人指明正路的含义。
- source_word: ἄνδρα
  choice: 男子
  rationale: 原文为阳性单数名词，明确指一名男子；“男子”准确保留其性别与单数语义。
- source_word: ποιοῦντα εἰρήνην
  choice: 促成和睦
  rationale: 直译为“制造和平”在此不够自然；“促成和睦”表达主动建立和平关系的行动，适合家庭语境。
- source_word: ἐν οἴκῳ
  choice: 在家中
  rationale: οἶκος既可指房屋，也可指家庭或家户；“家中”自然保留其空间与家庭关系两方面的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祈愿语体，以两个“愿主”对应原文两个并列的愿望式动词。用“宁静而恨恶不义之人”共同修饰“心灵”，保留原文分词结构所呈现的品格张力；分号清楚呈现两个平行祈愿。
