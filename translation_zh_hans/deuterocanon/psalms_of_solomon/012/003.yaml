  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: zh_hans
  text: 他的寄居[a]，是要以说谎的舌头充斥各家，并砍倒喜乐之树[b]——那喜乐使不法之人燃烧起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译作“居留”或“侨居”；希腊词常指像外来者一样住在某处。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“喜乐之树”；这可能比喻使一家兴旺、欢喜的人或事物，但原文没有明说。
    reason: cultural_note
  - marker: c
    text: 希腊文末语十分凝缩。“使……燃烧起来”在语法上最自然地修饰“喜乐”；也有人将它联系于前面的“舌头”。这里的燃烧究竟指煽动、燃起欲望，还是毁灭，原文并未明确。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: 他的寄居
  rationale: παροικία指居住、寄居，常含身为外来者暂居的意味；采用名词结构，以保留希腊文“他的寄居”及其后不定式所作说明的句法。
- source_word: ἐμπλῆσαι οἴκους
  choice: 充满各家
  rationale: ἐμπλῆσαι意为“使充满”，οἴκους可指房屋，也可兼指其中的家户；“各家”在现代汉语中较自然，同时保留具体的家庭空间意象。
- source_word: ἐν γλώσσῃ ψεύδει
  choice: 用说谎的舌头
  rationale: 保留γλώσσῃ“舌头”的身体意象，并将ψεύδει所表达的虚假、欺骗性质自然译出。
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: 砍倒喜乐之树
  rationale: ἐκκόψαι是强烈的砍除动作，δένδρα是“树”；不把比喻提前抽象化，以保存原文鲜明而含混的意象。
- source_word: φλογίζούσης παρανόμους
  choice: 那喜乐使不法之人燃烧起来
  rationale: φλογιζούσης为阴性属格单数，语法上最自然地依附同为阴性属格的εὐφροσύνης，并以παρανόμους为宾语；因此不将其误作此人另一个并列动作。译文保留“使燃烧”的火焰意象，不擅自限定为煽动、焚毁或敌对攻击。
theological_decisions:
- issue: 末句中使不法之人燃烧的主体
  choice: 按语法关联理解为“喜乐”
  alternative: 理解为说谎的舌头，或理解为此人在煽动/焚烧不法之人
  rationale: φλογιζούσης的阴性属格单数形式最直接呼应εὐφροσύνης；将其作为此人的并列动作会忽略形态上的依附关系。因句意仍高度凝缩，脚注保留其他可能联系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“寄居”“说谎的舌头”“喜乐之树”和“燃烧”等原文意象，并用破折号呈现末尾分词与“喜乐”的语法联系，同时以脚注交代传本文句的压缩与歧义。
