  yaml_path: translation/deuterocanon/psalms_of_solomon/012/001.yaml
  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
translation:
  language: zh_hans
  text: 主啊，求你救我的性命[a]脱离不守律法、邪恶的人，脱离那不守律法、窃窃私语、说虚假和诡诈话的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的性命”也可译作“我的灵魂”或“我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 这是对上帝的直接呼求；“主啊”符合现代汉语祷告语体，也不额外引入古雅措辞。
- source_word: ῥῦσαι
  choice: 求你救……脱离
  rationale: 该命令式表达迫切求援；汉语以“求你救……脱离”自然呈现祷告中的请求和摆脱危险之意。
- source_word: τὴν ψυχήν μου
  choice: 我的性命
  rationale: ψυχή在此可指生命、自我或灵魂。“我的性命”适合受到恶人和恶言威胁的语境；其他可能译法保留在脚注中。
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: 不守律法、邪恶的人
  rationale: 保留两个并列的道德描述：παράνομος指违背或不受律法约束，πονηρός指邪恶。汉语无需机械保留ἀνήρ的男性形式，语境所指的个人仍清楚。
- source_word: γλώσσης
  choice: 舌头
  rationale: 保留原文以具体器官指代言语的诗性形象，而不抽象化为“言论”。
- source_word: παρανόμου καὶ ψιθυροῦ
  choice: 不守律法、暗中毁谤
  rationale: 两个词均作定语修饰“舌头”，译文维持这一并列句法。ψίθυρος含低声私语、背后中伤之意；结合下文虚假诡诈的内容，译作“暗中毁谤”，同时以脚注保留较字面的译法。
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: 说虚假诡诈之言
  rationale: 分词修饰“舌头”，说明其言语行为。“虚假诡诈之言”同时保留ψευδῆ与δόλια两个成分，并符合庄重而自然的汉语表达。
theological_decisions:
- issue: παράνομος所指的“律法”是否特指上帝的律法
  choice: 不守律法
  alternative: 无法无天／违法
  rationale: “不守律法”保留其宗教伦理语境，同时不把范围武断限定为某条具体律例；“无法无天”语气较强且更习语化，“违法”则容易被理解为仅指世俗法律。
translation_notes:
  register: 采用现代、庄重的祷告语体。“主啊，求你……”自然传达呼求；保留“舌头”的诗性转喻，并明确维持希腊文中两个形容词共同修饰“舌头”的句法。
