  text: The words on the tongue of an evil man are full of twisted turns; his charm is like The words on the tongue of an evil man are full of twisted turns; his charm is like a fire kindling among a people. among a people.
translation:
  language: zh_hans
  text: 恶人的舌头所说的话，百般曲折[a]；他的美丽[b]如同在人群中正燃起来的火[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有多样的转折”；希腊文描绘言语不断变换、迂回曲折。
    reason: lexical_alternative
  - marker: b
    text: 或译：“美貌”或“魅力”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文为现在主动分词，指正在燃起的火；也可理解为正在点燃、蔓延的火。
    reason: grammar_clarification
lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: 百般曲折
  rationale: 该短语直指多样、反复的转折；“百般曲折”既保留多变和转折的意象，也自然表达其言语迂回诡诈的语境含义。
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: 口舌上的话语
  rationale: 保留希腊文“舌头—话语”的具体意象，同时用现代汉语较自然的“口舌”表达言语器官及其所发之言。
- source_word: ἀνδρὸς πονηροῦ
  choice: 恶人
  rationale: 在汉语经文语体中，“恶人”准确表达该阳性单数名词短语的道德贬义；此处无需生硬译作“邪恶的男人”。
- source_word: καλλονὴ
  choice: 美态
  rationale: καλλονή的基本义是美、美丽或美好的外观；“美态”保留外在吸引力，又避免直接把原词解释为心理或社交意义上的“魅力”。
- source_word: πῦρ ἀνάπτον
  choice: 燃起的火
  rationale: ἀνάπτον是现在主动分词，描绘火正在点燃、燃起；此译避免误作已经被点燃的被动状态。
- source_word: ἐν λαῷ
  choice: 在人群中
  rationale: λαός在此为无冠词集合名词；“人群”自然传达火在众人当中蔓延并造成影响的图景，同时不限定为某一特定民族。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。前半句保留“口舌”这一具体意象；后半句不把καλλονή过度解释为单纯的“魅力”，并以“燃起”体现现在主动分词的动态意义。
