  text: May the tongue of whisperers perish in flaming fire[c][b][a], away from the devout.
translation:
  language: zh_hans
  text: 愿窃窃私语者的舌头[a]在熊熊烈火中灭亡，远离虔诚人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “窃窃私语者”直译“低声耳语者”；也可按语境译为“暗中毁谤者”或“搬弄是非者”。
    reason: lexical_alternative
  - marker: b
    text: “虔诚人”也可译“敬虔的人”或“忠信的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶττα
  choice: 舌头
  rationale: 保留原文单数、具体而鲜明的“舌头”意象，不抽象化为“言语”；这里可作为集合性的表达，指这类人的毁谤之言。
- source_word: ψιθύρων
  choice: 暗中毁谤者
  rationale: 该词本指暗中低语的人，在此语境中带有背后中伤、毁谤的负面含义。“暗中毁谤者”兼顾其隐秘方式与道德含义；较直译的说法收入脚注。
- source_word: ἀπόλοιτο
  choice: 愿……灭亡
  rationale: 希腊语表达祈愿或审判性的愿望；“愿……灭亡”保持庄重语气，又不额外限定毁灭的具体方式。
- source_word: ἐν πυρὶ φλογός
  choice: 在熊熊烈火中
  rationale: 原文直译近于“在火焰之火中”，是加强性的火焰意象；“熊熊烈火”用自然中文保留诗句的强烈力度。
- source_word: ὁσίων
  choice: 虔诚人
  rationale: ὅσιος在此更侧重敬虔、忠信于上帝的人，而非通常由ἅγιος表达的“圣者”；“虔诚人”也符合本书所指敬虔群体的语境。
- source_word: ἀπὸ ὁσίων
  choice: 从虔诚人中消失
  rationale: ἀπό表达与虔诚人的分离。“从……中消失”使中文自然，并保留愿这种毁谤之舌远离该群体的意思，而不把关系解释得过细。
