  yaml_path: translation/deuterocanon/psalms_of_solomon/013/006.yaml
  text: For the discipline of the righteous in ignorance is not like the destruction of the sinner[c][b][a];
translation:
  language: zh_hans
  text: 因为义人在无知中所受的管教，与罪人的毁灭并不相同。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在无知中”也可理解为“因无意中所犯的罪”。
    reason: lexical_alternative
  - marker: b
    text: 有异文作“罪人的管教”，而不是“义人的管教”。
    reason: textual_variant
lexical_decisions:
- source_word: οὐχ ὁμοία
  choice: 并不相同
  rationale: 表达两者在性质和结局上的对比；现代汉语自然明确，同时保留比较结构。
- source_word: ἡ παιδεία
  choice: 所受的管教
  rationale: 此处指带有纠正性质的管教，与罪人的毁灭形成对照；“所受的”明确义人是承受管教者。
- source_word: τῶν δικαίων
  choice: 义人
  rationale: 保留属格所指的群体，并采用现代中文圣经语体中简洁通行的称谓。
- source_word: ἐν ἀγνοίᾳ
  choice: 在无知中
  rationale: 按希腊文本保留短语本身的含混性，不擅自补入原文未明说的“罪”；它可指在不知情或无意中。
- source_word: ἡ καταστροφὴ
  choice: 毁灭
  rationale: 传达灾难性的覆亡，力度与管教形成鲜明对比。
- source_word: τοῦ ἁμαρτωλοῦ
  choice: 罪人
  rationale: 保留单数类别性称谓，指作为一类代表的罪人。
theological_decisions:
- issue: 义人受苦的性质
  choice: 将义人所受的经历译为纠正性的“管教”，并与罪人的“毁灭”对照。
  alternative: 可把 παιδεία 译为“惩戒”或“训诲”，但前者容易被理解为纯粹刑罚，后者又可能弱化受苦与纠正的意味。
  rationale: 上下文支持管教与毁灭的性质差异，但本节没有进一步界定管教的具体缘由，因此不补入额外教义解释。
- issue: ἐν ἀγνοίᾳ 的所指
  choice: 正文保留“在无知中”的结构。
  alternative: 可理解为“因无意中所犯的罪”或“在不知情时”，但这些译法都会明确原文没有明说的受管教原因或行为。
  rationale: 希腊语短语修饰关系和语义范围略有含混；直译能保存这种张力，脚注说明可能含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“管教”保留 παιδεία 的纠正意味；句式尽量贴近希腊文的对照结构。脚注标记均置于正文相关句末。
