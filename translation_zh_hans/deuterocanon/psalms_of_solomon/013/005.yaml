  yaml_path: translation/deuterocanon/psalms_of_solomon/013/005.yaml
  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: zh_hans
  text: 因为罪人的毁灭十分可怕；这一切灾祸，没有一样会临到义人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: 十分可怕
  rationale: 传达该形容词所含严重、骇人的意味，并自然地修饰“毁灭”，不把意义缩窄为程度上的“严厉”。
- source_word: καταστροφή
  choice: 毁灭
  rationale: 既可表达倾覆、败亡，也适合本节审判与灾祸的语境；比单纯的“倒塌”更为宽广。
- source_word: ἁμαρτωλοῦ
  choice: 罪人
  rationale: 按实词化的单数属格直译为类别性的“罪人”，保留明确的道德含义而不添加性别。
- source_word: ἅψεται
  choice: 会临到
  rationale: 原义为“触及、抓住”；在灾祸作主语的语境中，“临到”是自然中文，同时保留灾祸不能触及义人的核心意象。
- source_word: δικαίου
  choice: 义人
  rationale: 以类别性的单数“义人”对应希腊文，简洁自然，也符合庄重的圣经文学语体。
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: 这一切灾祸，没有一样
  rationale: 明确保留 πάντων 的总体强调，并以“没有一样”表达 οὐδὲν；“灾祸”承接上文所列之事，使中文指代清楚，但不逐项解释。
theological_decisions:
- issue: 义人是否绝不会遭遇任何苦难
  choice: 限定为前文所指的“这一切灾祸”不会临到义人
  alternative: 泛化为义人不会遭遇任何灾难
  rationale: ἐκ πάντων τούτων 明确回指前述诸事；译文不应将本节扩大为关于义人一切苦难的普遍命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“十分可怕”避免古奥措辞；分号呈现两个并列而相互对照的判断。“这一切灾祸，没有一样”在自然中文中保留希腊文的全称强调。
