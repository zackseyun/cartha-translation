  text: But sinners will be taken away to destruction[b][a], and no remembrance of them will be found any longer.
translation:
  language: zh_hans
  text: 然而，罪人必被除去，归于毁灭[a]；再也寻不见他们的记念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被除去”也可译作“被带走”；“归于毁灭”直译“进入毁灭”。
    reason: lexical_alternative
  - marker: b
    text: “记念”也可译作“纪念物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 直接表达那些以犯罪为特征的人，保留希腊语名词的朴素含义，不扩大解释为更宽泛的“恶人”。
- source_word: ἀρθήσονται
  choice: 必被除去
  rationale: αἴρω的将来时被动形式在此表示被移走、除去；“必被除去”既保留被动语态，也符合审判语境。
- source_word: εἰς ἀπώλειαν
  choice: 归于毁灭
  rationale: ἀπώλεια表示毁灭、败亡；“归于毁灭”自然表达εἰς所指的结局，同时避免加入特定教义色彩。
- source_word: μνημόσυνον
  choice: 记念
  rationale: 该词可指记忆、记念或使人留名的纪念物；“对他们的记念”在本句中保留其抽象与具体之间的语义空间。
- source_word: ἔτι
  choice: 再也
  rationale: 与否定和将来语境结合，清楚表达此后不再发生。
