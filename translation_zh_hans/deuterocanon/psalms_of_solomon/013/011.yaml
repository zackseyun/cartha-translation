  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
translation:
  language: zh_hans
  text: 但主的怜悯临到敬虔的人[a]；他的怜悯也临到敬畏他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔的人”也可译作“虔诚的人”或“忠信的人”。
    reason: lexical_alternative
  - marker: b
    text: “敬畏他的人”也可译作“惧怕他的人”；“敬畏”保留了原文圣经语境中既含畏惧、又含尊崇的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσίους
  choice: 敬虔的人
  rationale: ὅσιος在《所罗门诗篇》中指以虔敬、忠信为特征的人群；“敬虔的人”自然明确，也避免把它与通常表示“圣者”的ἅγιοι混同。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接对应两处ἔλεος，保留原文的重复以及上主施恩眷顾的意味。
- source_word: Κυρίου
  choice: 主
  rationale: 按圣经汉语惯例译κύριος为“主”，语体庄重而自然。
- source_word: φοβουμένους
  choice: 敬畏他的人
  rationale: “敬畏”保留了φοβέομαι所含的畏惧与尊崇，不把它弱化为单纯的“尊敬”，同时符合现代圣经汉语习惯。
theological_decisions:
- issue: 是否将对上帝的“惧怕”弱化为一般性的尊崇
  choice: 敬畏他的人
  alternative: 尊崇他的人
  rationale: 原文采用φοβέομαι的强烈圣经用语；“敬畏”既自然，又保留畏惧与尊崇之间的神学张力。
- issue: 是否把ὁσίους译作“圣徒”或“圣洁的人”
  choice: 敬虔的人
  alternative: 圣洁的人；圣徒
  rationale: 本书中ὅσιοι具有虔敬群体称谓的色彩，译作“敬虔的人”可避免引入后世教会制度意味，也不与ἅγιοι的常见表达混同。
translation_notes:
  register: 采用现代、庄重、易懂的汉语。保留两次“怜悯”及平行句式；第二句加“也”以自然呈现希腊文καί的并列递进。
