base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/007.yaml
  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: zh_hans
  text: 义人在隐秘中受管教[a]，免得罪人因义人而幸灾乐祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人在约束中受管教”，也可理解为“义人所受的管教是有节制的”。
    reason: lexical_alternative
  - marker: b
    text: “幸灾乐祸”也可译作“因……欢喜”或“向……夸胜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν περιστολῇ
  choice: 在隐秘中
  rationale: περιστολή可指遮掩、隐蔽；结合目的从句，重点很可能是义人所受的管教不显露在罪人眼前，因此译作“在隐秘中”。不过，该词也可表示限制或节制，故在脚注保留另一种译法。
- source_word: παιδεύεται
  choice: 受管教
  rationale: παιδεύω涵盖教导、训练和纠正；本节语境涉及义人遭受的纠治，现代汉语“受管教”既保留教育意味，也能表达惩戒意味。
- source_word: δίκαιος
  choice: 义人
  rationale: 阳性单数在此作类别性、代表性用法；“义人”是自然、庄重且符合智慧文学语体的表达。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 准确表达否定目的从句，即管教以这种方式施行，是为了不让罪人有幸灾乐祸的机会。
- source_word: ἐπιχαρῇ
  choice: 幸灾乐祸
  rationale: 该动词在这里表示因他人的处境而欢喜，含敌意或恶意；“幸灾乐祸”比普通的“欢喜”更准确地传达这一语用色彩。
- source_word: ὁ ἁμαρτωλός
  choice: 罪人
  rationale: 带冠词的单数在此代表一类人，并与“义人”形成道德对照。
- source_word: τῷ δικαίῳ
  choice: 因义人
  rationale: 与ἐπιχαίρω连用的与格表示罪人幸灾乐祸所针对的对象；译作“因义人”保留原文重复，并避免代词指向不清。
theological_decisions:
- issue: 义人受管教的方式
  choice: 在隐秘中受管教
  alternative: 在约束中受管教／受有节制的管教
  rationale: 原文περιστολή存在“隐蔽”与“限制、节制”的词义张力。目的从句较支持“不让罪人看见而夸胜”的隐秘含义，但不能完全排除管教受到限制的理解，因此正文采用前者，脚注保留后者。
- issue: δίκαιος的阳性单数与代表性
  choice: 义人
  alternative: 一个义人／那义人
  rationale: 希腊语形式虽为阳性单数，此处主要表达类别性对照。汉语“义人”无需增添性别信息，也没有把经文改写为特定个人。
translation_notes:
  register: 采用简洁庄重的智慧文学语体。“受管教”兼顾纠正与训练；“幸灾乐祸”是通行现代成语，清楚传达敌意的欢喜。正文保留“义人”一词的重复，以呈现希腊原文δίκαιος……τῷ δικαίῳ的首尾呼应。
