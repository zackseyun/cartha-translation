  yaml_path: translation/deuterocanon/psalms_of_solomon/013/002.yaml
  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: zh_hans
  text: 主的膀臂救我们脱离了横扫而过的刀剑[a]，脱离了饥荒和罪人的死亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穿行而过的刀剑。”
    reason: lexical_alternative
  - marker: b
    text: 也可能指“临到罪人的死亡”或“罪人带来的死亡”。
    reason: alternative_reading
lexical_decisions:
- source_word: βραχίων
  choice: 膀臂
  rationale: 保留具体的身体意象，表达主施行拯救的大能；“膀臂”在现代中文中庄重，并有合宜的经文语体。
- source_word: Κυρίου
  choice: 主
  rationale: 按希腊文的神圣称号直译为“主”，不额外引入原文未明示的希伯来神名形式。
- source_word: ἔσωσεν
  choice: 救……脱离
  rationale: 结合其后的ἀπό结构译为“救……脱离”，自然表达从灾祸中蒙拯救的意思，并保留动词的宗教分量。
- source_word: ῥομφαίας
  choice: 刀剑
  rationale: “刀剑”是中文中自然、庄重的灾祸与战争意象；希腊文此处没有冠词，中文也无需强行标出定指。
- source_word: διαπορευομένης
  choice: 横扫而过的
  rationale: 分词表示穿行、经过；结合刀剑所象征的毁灭性威胁，“横扫而过”兼顾运动方向和灾难力度。较字面的译法列入脚注。
- source_word: λιμοῦ
  choice: 饥荒
  rationale: 本句列举群体性灾祸，与刀剑和死亡并列，“饥荒”比“饥饿”更贴合语境。
- source_word: θανάτου
  choice: 死亡
  rationale: 直接对应希腊文名词，不泛化为“毁灭”。
- source_word: ἁμαρτωλῶν
  choice: 罪人的
  rationale: 以中文属格结构保留希腊文裸属格的简洁和关系上的歧义，不在正文中擅自判定是临到罪人的死亡，还是罪人带来的死亡。
theological_decisions:
- issue: θανάτου ἁμαρτωλῶν中属格的关系
  choice: 罪人的死亡
  alternative: 临到罪人的死亡；罪人带来的死亡
  rationale: 希腊文属格关系简略而有真实歧义。正文采用形式最贴近的表达，脚注列出可能解释，不把神学或因果关系强加给原文。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“主的膀臂”保留经文的具体意象；重复“脱离了”使三个ἀπό所引出的灾祸层次清楚。正文保留“罪人的死亡”的属格歧义，并以脚注说明主要可能读法。
