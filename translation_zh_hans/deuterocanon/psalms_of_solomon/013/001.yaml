  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
translation:
  language: zh_hans
  text: 主的右手庇护了我[a]；主的右手顾惜了我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庇护”或译“遮盖”。
    reason: lexical_alternative
  - marker: b
    text: “顾惜了我们”或译“饶过了我们”、“保全了我们”；也可带有“怜悯了我们”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  choice: 右手
  rationale: 阴性形容词在此作名词用，省略了“手”；译作“右手”既符合圣经希腊语习惯，也保留能力与保护的意象。
- source_word: Κυρίου
  choice: 主的
  rationale: 属格修饰“右手”，现代汉语用领属结构“主的”最自然。
- source_word: ἐσκέπασέν
  choice: 遮护了
  rationale: 该动词本义为遮盖，此处具有因遮盖而保护的含义；“遮护”兼顾字面意象与保护意味。
- source_word: με
  choice: 我
  rationale: 第一人称单数宾格，直接译为“我”。
- source_word: ἐφείσατο
  choice: 饶恕了
  rationale: 该动词支配属格，表示顾惜、放过或不加毁灭；“饶恕”保留慈悲地不施毁灭的语义，同时脚注列出“保全”这一偏重存留性命的译法。
- source_word: ἡμῶν
  choice: 我们
  rationale: 形式上为第一人称复数属格，但受 φείδομαι 支配，语义上是被饶恕或保全的对象；汉语用“我们”。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处是对上帝的称谓；“主”是自然、庄重且符合经文传统的译法，无须改作强调社会身份关系的“主人”。
- issue: ἐφείσατο 所表达的神圣行动
  choice: 饶恕了我们
  alternative: 保全了我们
  rationale: 原词可指顾惜而不伤害或不毁灭，也可在语境中带有怜悯意味。正文采用“饶恕”表达不施惩毁，脚注保留“保全”，不把原文的语义范围限定为赦罪或单纯的身体存活。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达；重复“主的右手”，保留原文的平行结构。脚注标记按相关词语紧随正文出现，并以正常字母顺序排列。
