base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/004.yaml
  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
translation:
  language: zh_hans
  text: 不敬虔的人因自己的过犯而惊惶，唯恐与罪人一同被带走[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并非在他与罪人一同被带走时。”希腊语 μὴ ὅτε συμπαραληφθῇ 的句法较难确定；正文把它理解为“唯恐……”。
    reason: alternative_reading
  - marker: b
    text: “被带走”也可译作“被卷走”或“被一并带去”，突出他与罪人共同遭受审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: 惊惶
  rationale: 该被动形式可表达内心受震动、惶恐不安；“惊惶”自然凝练，又不把原因过度限定为单纯情绪或外在遭遇。
- source_word: ὁ ἀσεβής
  choice: 不敬虔的人
  rationale: ἀσεβής突出对上帝缺乏敬畏的宗教—伦理含义；“不敬虔的人”比泛指道德败坏的“恶人”更贴近原词。
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: 因自己的过犯
  rationale: διά加宾格在此表原因；παραπτώματα指具体的越轨、违犯行为，“过犯”既准确又符合庄重的经文语体。
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: 唯恐……一同被带走
  rationale: 希腊语结构简缩且句法困难。正文将μή理解为防范或畏惧意义，以“唯恐”连接前文；συμπαραληφθῇ保留与他人一同被带走、共同遭受审判的意味。
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: 与罪人
  rationale: 该短语表示在共同结局中的相伴关系；动词中的共同前缀已由“一同”体现，因此“与罪人”简洁自然。
theological_decisions:
- issue: μὴ ὅτε συμπαραληφθῇ的句法关系
  choice: 按防范或畏惧意义译作“唯恐……被带走”
  alternative: “并非在他与罪人一同被带走时”
  rationale: 原文句法确有歧义。正文采用上下文较连贯的畏惧意义，但以脚注保留按μή ὅτε直译所产生的另一种理解，不把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不敬虔的人”保留原文的宗教伦理色彩；“惊惶”表现内在震动；正文维持简洁诗体，并用脚注呈现真实的句法与词义选择。
