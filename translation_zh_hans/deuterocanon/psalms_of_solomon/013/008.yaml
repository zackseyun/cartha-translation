  text: For he will admonish a righteous man as a beloved son[c][b][a], and his discipline is like that of a firstborn.
translation:
  language: zh_hans
  text: 因为他必劝诫义人，如同劝诫爱子[a]；他的管教[b]，也如同长子的管教。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“爱的儿子”；也可译“蒙爱的儿子”。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可译作“教导”或“训练”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νουθετήσει
  choice: 必劝诫
  rationale: 该将来时动词指以劝告、提醒来纠正人。“劝诫”既保留言语教导的意味，也符合下半句管教的语境；“必”自然表达将来陈述的确定性。
- source_word: δίκαιον
  choice: 义人
  rationale: 这是单数、无冠词、名词化使用的形容词。现代汉语“义人”可自然表示一个有义的人，并与后面的“爱子”和“长子”保持单数对应，无须额外加入性别词语。
- source_word: υἱὸν ἀγαπήσεως
  choice: 爱子
  rationale: 该属格短语直译为“爱的儿子”，可理解为带定性意味的“蒙爱的儿子”。“爱子”在现代中文中简洁自然，并保留父子意象。
- source_word: παιδεία
  choice: 管教
  rationale: 此词可涵盖教导、训练和惩戒性的塑造。本节以父亲对儿子的劝诫为比喻，“管教”最能呈现这种以培育和纠正为目的的行动。
- source_word: πρωτοτόκου
  choice: 长子
  rationale: 该词名词化使用，指头生的儿子。“长子”是中文中自然且贴合此处家庭意象的表达。
theological_decisions:
- issue: αὐτοῦ所指及παιδεία的施受关系
  choice: 译作“对他的管教”，其中“他”指前句的义人
  alternative: 可译作“他的管教”，但可能被理解为他施行的管教；也可译作“他所受的管教”，但会更明确地补出受事关系
  rationale: 希腊文仅说“他的管教”，语法形式本身未明说施受方向；上下文与“长子”的平行表明义人是受管教者。“对他的管教”既使中文通顺，又尽量不作超出原文的展开。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“劝诫—管教”保留原文两个相关但不相同的词；两个“如同”呈现平行结构。未把“义人”处理为集合复数，也未补入原文未明说的神学身份称谓。
