  text: Savage beasts rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us. rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us.
translation:
  language: zh_hans
  text: 凶恶的野兽扑向他们；它们用牙齿撕扯他们的肉，用臼齿碾碎他们的骨头；主救我们脱离了这一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία ... πονηρά
  choice: 凶猛的野兽
  rationale: θηρία指野兽；后置的πονηρά在此描述其凶恶、伤人的性质，译作“凶猛”比泛称“邪恶”更符合捕食语境。
- source_word: ἐπέδραμοσαν
  choice: 向他们扑来
  rationale: 该动词表示冲上、袭来；“扑来”自然传达野兽突然攻击的动态。
- source_word: ἔτιλλον
  choice: 撕扯
  rationale: τίλλω可指拔、扯、撕；与牙齿及肉连用时，“撕扯”保留持续撕咬的画面。
- source_word: μυλαῖς
  choice: 臼齿
  rationale: 字面指用于磨碎的磨牙，译作现代汉语明确的解剖名称“臼齿”。
- source_word: ἔθλων
  choice: 碾碎
  rationale: θλάω表示压碎、碾碎，与臼齿和骨头搭配，突出强力粉碎。
- source_word: ἐρρύσατο
  choice: 救……脱离
  rationale: ῥύομαι表示从危险或困境中搭救、解救；“救我们脱离”准确保留其脱险含义。
theological_decisions:
- issue: 受袭者“他们”与蒙救者“我们”的人称转换
  choice: 按希腊文保留“他们”与“我们”的转换
  alternative: 将两者统一为同一人称
  rationale: 原文先以第三人称复数描述受袭对象，末句转为第一人称复数；不擅自消除这一可能具有修辞或语篇意义的张力。
- issue: Κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 希腊文本使用Κύριος而非希伯来神名的直接形式；译作“主”既对应现存来源，也避免在无额外文本证据时回译神名。
translation_notes:
  register: 采用现代、庄重而具画面感的普通话。分号保留前后强烈转折，并以“但”明确末句从暴力场景转向主的拯救。
