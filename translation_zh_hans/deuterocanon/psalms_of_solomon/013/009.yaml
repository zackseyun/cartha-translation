base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: zh_hans
  text: 因为主必顾惜属他的忠信者[a]，并借着管教[b]抹去他们的过犯；因为义人的生命存到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信者”或译“敬虔者”；较直译为“属他的虔诚者”。
    reason: lexical_alternative
  - marker: b
    text: “借着管教”或译“在管教中”或“以惩戒”。原文既可强调管教是抹去过犯的途径，也可强调其发生的处境。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: φείσεται
  choice: 必顾惜
  rationale: 保留“饶过、不施以完全惩罚”的具体意味，同时与下文仍有管教相协调；“顾惜”也避免把本词泛化为单纯的“怜悯”.
- source_word: Κύριος
  choice: 主
  rationale: 作为指称上帝的称号，译为现代中文圣经语体中自然、庄重的“主”.
- source_word: τῶν ὁσίων αὐτοῦ
  choice: 属他的忠信者
  rationale: ὅσιοι在《所罗门诗篇》中侧重对上帝忠诚、敬虔的群体。“忠信者”比“圣者”更能体现这一含义，也避免与ἅγιοι混同；“属他的”表达αὐτοῦ所指的归属关系.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: 他们的过犯
  rationale: “过犯”体现道德上的失足或冒犯，比宽泛的“罪”更贴近παραπτώματα，也符合庄重而通顺的现代中文.
- source_word: ἐξαλείψει
  choice: 必……抹去
  rationale: 保留原词“擦除、涂抹而除掉”的形象；中文“抹去”自然，并能表达彻底除去过犯.
- source_word: ἐν παιδείᾳ
  choice: 借着管教
  rationale: ἐν在此可表达手段或处境；“借着”保留工具性理解，“管教”兼具纠正、训练与惩戒意味，不把它缩减为纯粹刑罚.
- source_word: ἡ ζωὴ τῶν δικαίων
  choice: 义人的生命
  rationale: “义人”是δικαίων直接且通行的对应语；所有格结构照原文保留为“义人的生命”.
- source_word: εἰς τὸν αἰῶνα
  choice: 存到永远
  rationale: 此处表达生命永久延续；“存到永远”既清楚自然，也保留原文的持续性表达，而不额外界定其形而上性质.
theological_decisions:
- issue: 主的顾惜与管教之间的关系
  choice: 把“借着管教”与抹去过犯紧密相连，呈现主的顾惜通过纠正性的管教施行。
  alternative: 也可把管教理解为抹去过犯时所处的范围，或主要理解为惩罚性的责打。
  rationale: 原文ἐν παιδείᾳ可有工具性或处境性，正文采用自然的工具性表达，但注释保留其他可能；这样既不把怜悯理解为免除一切管教，也不把管教化约为纯粹惩罚。
- issue: ὅσιοι所指群体的性质
  choice: 译为“忠信者”，突出他们对上帝的忠诚与敬虔。
  alternative: 可译为“敬虔者”或较直译地译为“圣洁者”。
  rationale: 在本书语境中，该词是对忠于上帝之群体的称呼；“忠信者”能保留其盟约忠诚色彩，同时不与通常对应ἅγιοι的“圣者”混同。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“顾惜—管教—抹去”保留经文中怜悯与纠正并存的张力；分号对应两个因果分句之间的推进关系。
