  yaml_path: translation/deuterocanon/psalms_of_solomon/018/001.yaml
  text: Lord[a], your mercy is upon the works of your hands forever[b];
translation:
  language: zh_hans
  text: 主啊，你的怜悯临到[a]你双手所做的一切[b]，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到”或译“覆庇”或“在……之上”。
    reason: lexical_alternative
  - marker: b
    text: “你双手所做的一切”直译“你双手的作品”，也可译“你的手工”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 的通常译法“主”，并用现代汉语呼语助词“啊”明确表达希腊语呼格。
- source_word: τὸ ἔλεός σου
  choice: 你的怜悯
  rationale: ἔλεος 表示怜悯、慈悲或仁慈；“怜悯”简洁庄重，也适合描述上帝向受造之物施予的慈爱。
- source_word: ἐπὶ
  choice: 临到
  rationale: ἐπί 在这里表达怜悯施及、落在所述对象之上；“临到”既自然，又保留其动态及空间意象，没有将关系窄化为单纯的态度。
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: 你双手所做的一切
  rationale: 直译意象为“你双手的作品”；此处用“你双手所做的一切”保留“手”的拟人化形象，同时以自然汉语涵盖复数 τὰ ἔργα。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 这是表示无限延续时间的惯用语；“直到永远”自然、庄重，并与全句的持续含义相合。
theological_decisions:
- issue: 是否把 τὰ ἔργα τῶν χειρῶν σου 明确解释为“受造物”
  choice: 你双手所做的一切
  alternative: 你的创造物；你的手工作成的
  rationale: 上下文很可能涉及创造，但希腊文本本身说的是“你双手的作品”。保留具体的“双手”意象，避免把经文未明说的创造论解释直接写入正文。
- issue: ἐπὶ 所表达的怜悯与上帝手中工作之间的关系
  choice: 临到
  alternative: 覆庇；在……之上；施于
  rationale: “临到”保留怜悯施及这些对象的含义，而不进一步断定这是静态的覆盖、保护，还是特定形式的施恩。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“主啊”体现直接呼告；“双手所做的一切”保留原文拟人化意象，并避免生硬的名词叠加。
