  text: Great and glorious is our God[a], dwelling in the heights;
translation:
  language: zh_hans
  text: 我们的上帝伟大而荣耀，居住在至高之处[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“居住在最高之处”，或“居住在至高天上”。
    reason: 词义可能有不同理解；ἐν ὑψίστοις可泛指最高之处，也可按语境理解为至高诸天。
lexical_decisions:
- source_word: μέγας
  choice: 伟大
  rationale: 保留该词表示崇高、卓越的基本含义，适合颂赞语境，也不把语义缩限为能力上的“大能”。
- source_word: ἔνδοξος
  choice: 荣耀
  rationale: 在颂赞上帝的语境中，“荣耀”自然庄重，直接表达享有荣光、满有尊荣之意。
- source_word: ἐν ὑψίστοις
  choice: 在至高之处
  rationale: 希腊语为复数中性形式，可指最高的地方或高天；译作“在至高之处”既保留空间意象，也不擅自明确为“诸天”。
- source_word: κατοικῶν
  choice: 居住
  rationale: 现在分词表示持续的居住状态；“居住”通俗自然，同时忠实于原文。
theological_decisions:
- issue: ἐν ὑψίστοις所指的范围
  choice: 至高之处
  alternative: 最高之处；至高诸天
  rationale: 原文没有明确写出“天”，因此正文保留其空间指向的开放性，不将其限定为特定宇宙论概念。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。按希腊语强调结构，先陈述“我们的上帝伟大而荣耀”，再以分词短语说明其居所；句末保留诗行的延续感。
