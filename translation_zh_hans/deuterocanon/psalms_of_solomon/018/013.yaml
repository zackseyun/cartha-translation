  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
translation:
  language: zh_hans
  text: 他们每天的行事为人都出于对上帝的敬畏；自上帝创造他们的那一天起，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  choice: 敬畏上帝
  rationale: “敬畏”既保留 φόβος 的畏惧分量，也能在现代汉语中表达对上帝虔敬、尊崇的态度；与“而行”结合，使介词短语在汉语中自然地修饰生活道路。
- source_word: ἡ ὁδὸς αὐτῶν
  choice: 他们……而行
  rationale: ὁδός 字面是“道路”，此处比喻人的生活方式或行为。正文用动词化的“而行”表达这一比喻的实际含义，同时以脚注保留较形式对应的译法。
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: 天天
  rationale: “天天”自然、简洁，准确表达每日持续如此的习惯性意义。
- source_word: ἀφʼ ἧς ἡμέρας
  choice: 从……的那一天起
  rationale: 明确标示起点，并自然衔接后面的“创造他们”。
- source_word: ἔκτισεν
  choice: 创造
  rationale: κτίζω 通常指创造；“创造”保留上帝作为创造者的神学力度，不弱化为一般的“造了”或“形成”。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 表达延续至无尽将来的意思，也保留 ἕως 所体现的终点结构。
