lexical_decisions:
- source_word: κατευθῦναι
  choice: 引导
  rationale: 表达使人走上正确道路的主动指引，既自然，也保留此不定式所含的道德方向性。
- source_word: ἄνδρας
  choice: 众男子
  rationale: 原文为阳性复数，明确使用表示成年男性的词；译文保留其性别形式，不擅自泛化为“众人”。
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: 行公义的事
  rationale: 兼顾现代汉语的自然表达与原文“行为/作为”及“公义”两个概念；脚注保留较形式对应及“正义”义项。
- source_word: φόβῳ θεοῦ
  choice: 在敬畏上帝中
  rationale: 将与格理解为行动所处的范围或方式，保留圣经语言中“敬畏上帝”的伦理宗教含义。
- source_word: καταστῆσαι
  choice: 使……站
  rationale: 保留该动词“使站立、安置”的具体意象，同时避免过早限定为“任命”或制度性的“设立”。
- source_word: ἐνώπιον Κυρίου
  choice: 在主面前
  rationale: 直接对应原文，既可表达位置，也可含处于主临在和鉴察之下的意味。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 公义
  alternative: 正义
  rationale: 此处兼有伦理与宗教含义，“公义”能承接这一广度；“正义”仍是可能的语义侧重，故列入脚注。
- issue: φόβῳ θεοῦ与前句的关系
  choice: 在敬畏上帝中
  alternative: 因敬畏上帝而
  rationale: 原文与格可表示范围、方式或动因；正文采用不把它单一定为因果关系的译法，以保留语法张力。
- issue: καταστῆσαι的意象
  choice: 使他们全都站在主面前
  alternative: 把他们全都安置在主面前
  rationale: “使……站”贴近使役动词的具体意义，也保留可能含有使人被呈到主前、在主前立定等多重意味。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“众男子”保留原文阳性复数；“行公义的事”避免生硬直译，同时以脚注呈现较形式对应的译法。正文中的脚注依相关词组顺序排列。
