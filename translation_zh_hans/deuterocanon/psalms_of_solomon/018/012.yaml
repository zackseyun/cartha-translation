    reason: lexical_alternative
lexical_decisions:
- source_word: διατάξας
  choice: 使……运行／定下
  rationale: 该分词有安排、规定之意；结合两个目的／范围短语，汉语分译为“使……按行程运行，为……定下”，自然表达有意的秩序安排。
- source_word: φωστῆρας
  choice: 众天体
  rationale: 这里指按固定路径标示时间的发光天体。“众天体”比“众光体”更符合现代汉语，又不限定为某一种星体。
- source_word: ἐν πορείᾳ
  choice: 按行程运行
  rationale: πορεία可指行进、行程；此译保留有秩序的运动意象，不引入现代科学用语“轨道”。
- source_word: καιροὺς ὡρῶν
  choice: 时序定下节期
  rationale: καιροί表示规定或合宜的时节，ὧραι在天体语境中可指时序、季节。译文保留二者叠加形成的固定时间秩序，并用脚注提示原文结构。
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: 日复一日
  rationale: 自然表达持续而规律的重复，并对应原文“从日到日”的惯用结构。
- source_word: παρέβησαν
  choice: 从未偏离
  rationale: 在“路径”的空间意象中，动词表示越过或偏离；否定完成性陈述在汉语中用“从未偏离”可体现直到当前始终如此。
- source_word: ὁδοῦ
  choice: 路径
  rationale: 保留天体沿规定路线运行的意象。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 表达权威性的命令；“吩咐它们走的路径”符合汉语搭配，也保留天体服从命令的诗性拟人。
