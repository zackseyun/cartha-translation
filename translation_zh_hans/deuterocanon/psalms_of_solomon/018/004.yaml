  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: zh_hans
  text: 你的爱临到亚伯拉罕的后裔，就是以色列的众子；你的管教[a]临到我们，如同对待长子、独子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“训育”或“教导”。原词包含纠正、教导和塑造的意思。
    reason: 提示该词不仅指惩罚，也有教育和养育的含义。
  - marker: b
    text: 原文并列使用“长子”和“独子”（或译“独生子”“独一之子”）两个称呼。
    reason: 说明译文保留原文两个并列修饰语及其表面张力，不作协调性解释。
lexical_decisions:
- source_word: ἀγάπη σου
  choice: 你的爱
  rationale: 直接保留“爱”的基本含义，也自然传达本句所含的盟约温情，不弱化为一般的喜爱。
- source_word: σπέρμα Ἀβραάμ
  choice: 亚伯拉罕的后裔
  rationale: σπέρμα在此为单数集合名词；“后裔”既符合现代汉语，也保留其群体意义和亚伯拉罕传统的关联。
- source_word: υἱοὺς Ἰσραήλ
  choice: 以色列的众子
  rationale: 保留原文明确的“众子”，并与后半句单数的“子”意象形成词义呼应；“众”使复数在汉语中清楚可见。
- source_word: ἡ παιδία σου
  choice: 你的管教
  rationale: 此词在语境中指带有纠正和塑造作用的训育；“管教”兼顾纠正与培育，不局限于惩罚。传本文字为παιδία，此处按παιδεία一类的意义理解。
- source_word: ἐφʼ ἡμᾶς
  choice: 临到我们
  rationale: “临到”自然表达ἐπί所表示的施及关系，并与前句“临到”构成诗体平行。
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: 如同临到独生的长子
  rationale: 同时保留πρωτότοκος“长子”和μονογενής“独生、独一之子”两个并列修饰语，不将其中任何一个解释性消解；补出第二个“临到”，使省略结构在现代汉语中明晰。
theological_decisions:
- issue: “长子”与“独生子”意象的并置
  choice: 独生的长子
  alternative: 独一的长子／长子，就是独生子
  rationale: 原文刻意叠加πρωτότοκον与μονογενῆ，兼有长子身份和独一珍爱之意。译文保留这种张力，不把它改写成单一神学概念。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。前后两次使用“临到”，保留原文ἐπί结构的诗体平行；“后裔，就是以色列的众子”以同位语方式呈现原句关系。
