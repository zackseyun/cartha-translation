  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his servants.
translation:
  language: zh_hans
  text: 自从他创造他们的那一天起，他们就未曾偏离正轨[a]。自古以来，他们从未离开自己的道路[b]，除非上帝照着他奴仆的命令吩咐他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未曾偏离正轨”也可译作“未曾走迷”或“未曾迷失方向”。
    reason: lexical_alternative
  - marker: b
    text: “自己的道路”也可能指他们受命遵循的路线、轨道或运行规律。
    reason: lexical_alternative
  - marker: c
    text: 直译可作“以他奴仆的命令”。此结构也可能被理解为上帝借着他的奴仆发令；后一理解较具解释性。
    reason: ambiguity
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: 偏离
  rationale: 此处表示离开既定方向或路线；“偏离”既适合受造物运行的语境，也不把可能的道德含义完全排除。
- source_word: ἔκτισεν
  choice: 创造
  rationale: κτίζω通常指创造；“创造”直接、自然，并符合本节论及受造秩序的语境。
- source_word: ἀφʼ ἧς ἡμέρας
  choice: 自从……的那一天起
  rationale: 准确表达从某一天延续至今的时间起点。
- source_word: ἀπὸ γενεῶν ἀρχαίων
  choice: 自古以来
  rationale: 以自然的现代汉语表达从远古世代开始的长久持续，避免生硬直译“从古老的世代”。
- source_word: ἀπέστησαν
  choice: 离开
  rationale: 表示脱离原有位置或既定进程，与后面的“道路”搭配自然。
- source_word: ὁδῶν αὐτῶν
  choice: 自己的道路
  rationale: 保留ὁδός既可指道路、也可指既定运行路线或模式的宽泛含义，不直接限定为天体“轨道”。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 表达权威性的命令，同时符合上帝向受造物发令的庄重汉语语体。
- source_word: ἐν ἐπιταγῇ
  choice: 以……的命令
  rationale: 保留ἐν在此可能具有的方式或工具意义，并呈现ἐπιταγή的权威命令含义。
- source_word: δούλων αὐτοῦ
  choice: 他奴仆的
  rationale: “奴仆”保留δοῦλος所含的隶属关系，也符合中文宗教文献的庄重语域；不弱化为仅指一般服务人员的“仆人”。
theological_decisions:
- issue: “他们”的所指
  choice: 保留代词“他们”，不在正文中补明所指
  alternative: 译作天体、星辰或一般受造物
  rationale: 本节希腊文本本身没有明说先行词；补出具体对象会消除上下文仍保留的指代空间。
- issue: ἐν ἐπιταγῇ δούλων αὐτοῦ中属格的关系
  choice: 正文按“以他奴仆的命令”呈现属格结构
  alternative: 理解为“借着他的奴仆”或“为他的奴仆颁令”
  rationale: 希腊语结构简略，属格与ἐπιταγή的语义关系存在解释空间；正文尽量贴近形式，脚注提示较通顺但解释性更强的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前两句保留希腊文的平行结构；不擅自补出“他们”是星辰或其他受造物。末句刻意保留原文属格结构的张力，并用脚注说明另一种可能理解。
