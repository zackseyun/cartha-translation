base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: zh_hans
  text: 你的恩慈如丰厚的礼物[a]临到以色列；你的眼目垂看他们[b]，他们中没有一个会有所缺乏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文结构凝练，也可译作“你的恩慈借着丰厚的礼物临到以色列”。这里的希腊词意为“礼物”，不是“屋顶”或“房屋”。
    reason: lexical_alternative
  - marker: b
    text: “他们”原文为中性复数代词，所指略显含蓄；按本句理解为以色列群体中的人。
    reason: referent_ambiguity
  - marker: c
    text: 或译：“他们中间必无缺乏。”末句在希腊文中有所省略。
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: 恩慈
  rationale: 该词表示以善意待人、施惠于人的品性与行动。“恩慈”既保留其人格性的善意，也符合庄重的诗歌语体。
- source_word: δόματος πλουσίου
  choice: 丰厚的礼物
  rationale: δόμα（短音 ο）意为“礼物、赠与”，并非 δῶμα“房屋、屋顶”。πλούσιος 在这里形容礼物丰厚、丰富；因此不可译作“华美的屋顶”或“丰盛的遮蔽”。
- source_word: ἐπὶ Ἰσραήλ
  choice: 临到以色列
  rationale: ἐπί 加宾格可表达朝向并延及某对象；“临到”自然地传达恩慈施及以色列，同时保留诗体的庄重感。
- source_word: ἐπιβλέποντες
  choice: 垂看
  rationale: 该分词表达眼目注视、察看。“垂看”保留视觉意象和神向下察看的诗歌语感，又不直接扩译为“保护”。
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: 他们中没有一个会有所缺乏
  rationale: ὑστερέω 可指缺乏、短少或未能得到；ἐξ αὐτῶν 表示“他们中间”。此译法按最自然的省略结构理解为“其中没有一个”，但不具体补出所缺之物。
theological_decisions:
- issue: 恩慈与“丰厚的礼物”的关系
  choice: 译作比拟：“恩慈如丰厚的礼物临到以色列”
  alternative: 可理解为恩慈“借着丰厚的礼物”或“以丰厚的赠与”临到以色列
  rationale: 原文连续使用两个 ἐπί，结构凝练，比较关系不是由明确的比较词标出。正文采用最符合诗意和上下文的比拟表达，脚注保留工具或表现方式的可能性。
- issue: 末句的主语与含义
  choice: 理解为以色列群体中没有一个人会有所缺乏
  alternative: 可较非人格化地译作“他们中间必无缺乏”；较不可能理解为隐含上帝作主语，即“他不会亏待他们中的任何一个”
  rationale: 希腊文动词为第三人称单数，句子略有省略；ἐξ αὐτῶν 最自然地支持“他们中没有一个”的理解。译文不补出具体供应内容，以免过度限定“缺乏”的范围。
- issue: αὐτά／αὐτῶν 的指代
  choice: 依上下文译为以色列群体中的人，即“他们”
  alternative: 语法上为中性复数，也可能回指上下文中未在本节明说的复数事物或群体单位
  rationale: 本节最近的明确对象是以色列，因此人物性复数在汉语中最易理解；脚注说明原文的中性复数及其压缩性，避免把指代问题说成毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“恩慈”“垂看”保持经文风格但不陈旧；用分号呈现原文从恩慈临到以色列转向上帝眼目察看的平行推进。
