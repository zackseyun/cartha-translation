  text: ἡ χρηστότης σου ἐπὶ δόματος πλουσίου ἐπὶ Ἰσραήλ· οἱ ὀφθαλμοί σου ἐπιβλέποντες ἐπʼ αὐτά, καὶ οὐχ ὑστερήσει ἐξ αὐτῶν,
