translation:
  language: zh_hans
  text: 使愿意受教的心灵[a]转离无知状态下的愚昧[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿意受教的心灵”也可译作“乐意听从的心灵”或“顺服的心灵”。
    reason: lexical_alternative
  - marker: b
    text: 原文用两个不同的词：ἀμαθία侧重未受教或欠缺见识的愚昧，ἀγνοία较直接地指无知；本句并非简单重复同一个概念。
    reason: lexical_alternative
  - marker: c
    text: “无知状态下的”也可理解为“因无知而有的”；或可看作说明转离愚昧时所处的状态。原文中这一短语与前文的关系简略，未完全确定。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀποστρέψαι
  choice: 使……转离
  rationale: 保留不定式的使动意味以及ἀπό所表达的离开方向；“转离”也符合庄重的劝诫语体。
- source_word: ψυχὴν
  choice: 心灵
  rationale: 这里指人的内在生命与道德主体；“心灵”在现代汉语中自然，同时不把词义缩减为情绪。
- source_word: εὔκοον
  choice: 愿意受教的
  rationale: 该词由“善于、乐于”与“听”相关的成分构成，可指肯听从、顺服或易于教导；“愿意受教”突出了智慧教诲语境中的可教性，又不把它限定为正式服从。
- source_word: ἀμαθίας
  choice: 愚昧
  rationale: 此词侧重未受教、欠缺学识或见识所造成的愚昧；译作“愚昧”可与后面的ἀγνοίᾳ“无知”保持词义区别。
- source_word: ἐν ἀγνοίᾳ
  choice: 无知中的
  rationale: 直译介词短语，保留它与“愚昧”之间关系的含混性，避免擅自确定为原因（“因无知”）或方式。
theological_decisions:
- issue: ἐν ἀγνοίᾳ与ἀμαθίας的关系
  choice: 译作“无知中的愚昧”
  alternative: “因无知而有的愚昧”或“在无知中转离愚昧”
  rationale: 希腊语ἐν可表达处境、范围或方式，而本句结构没有完全排除不同修饰关系；正文采用紧贴词序的表达，脚注说明这种开放性，不作额外的神学或道德归因。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“愿意受教”比单说“顺服”更贴合智慧与教导语境；“心灵”比“灵魂”在本句中更自然。正文保留希腊语两个近义词之间的区别，并以脚注交代介词短语的句法含混。
