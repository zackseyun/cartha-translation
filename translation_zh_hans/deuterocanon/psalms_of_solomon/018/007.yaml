  yaml_path: translation/deuterocanon/psalms_of_solomon/018/007.yaml
  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
translation:
  language: zh_hans
  text: 有福的是那些身处那些日子[a]、得见主将为来临的世代成就的美好之事[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那些日子出生（或生活）的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“主的福分”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福的是
  rationale: 采用现代中文中自然、庄重的祝福语式，保留原文类似“福哉”的宣告意味，又避免过度古雅。
- source_word: οἱ γενόμενοι ἐν ἡμέραις ἐκείναις
  choice: 那些身处那些日子的人
  rationale: γενόμενοι 可指来到世上、出生或届时生活的人；“身处”在正文中保留较宽的指向，不将其限定为“出生”。
- source_word: ἰδεῖν
  choice: 得见
  rationale: 既表达“看见”，也自然呈现此不定式与“有福”之间的结果或际遇关系；用语庄重而仍易懂。
- source_word: τὰ ἀγαθὰ Κυρίου
  choice: 主……成就的美好之事
  rationale: “美好之事”保留 τὰ ἀγαθὰ 的宽泛含义，不预先将其缩窄为属灵或物质的“福分”；所有关系结合后续 ἃ ποιήσει 表达。
- source_word: ἃ ποιήσει
  choice: 将……成就的
  rationale: “成就”比直译“做”更符合中文搭配，并保留主亲自使这些美好之事实现的施事意义。
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: 为来临的世代
  rationale: 保留“正在来到”的未来指向和单数“世代”，不擅自限定为紧接着的“下一代”。
