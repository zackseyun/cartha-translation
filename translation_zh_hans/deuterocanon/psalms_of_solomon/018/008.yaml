base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/008.yaml
  text: under the rod of discipline of the Lord's Messiah[a], in the fear of his God, in wisdom of spirit and righteousness and strength[d][c][b];
translation:
  language: zh_hans
  text: 在主的受膏者管教之杖下[a]，敬畏他的上帝，具有灵的智慧[b]、公义[c]和力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的受膏者”也可能理解为“受膏的主”；这里几个属格紧密相连，关系较为含混。
    reason: alternative_reading
  - marker: b
    text: “灵”也可能特指上帝的灵。原文还可能理解为“灵、公义和力量的智慧”。
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥάβδον
  choice: 杖
  rationale: ῥάβδος可指杖、棍或权杖；与“管教”连用时，“杖”既保留纠正惩戒的意象，也不过度突出王权含义。
- source_word: παιδείας
  choice: 管教
  rationale: παιδεία兼有教育、训练和纠正之意；在“杖”的搭配中，纠正性的“管教”最贴合语境。
- source_word: χριστοῦ
  choice: 受膏者
  rationale: 此处Χριστός处于犹太弥赛亚语境中，用“受膏者”保留其称号本义，避免把它仅当作专名。
- source_word: κυρίου
  choice: 主的
  rationale: 将属格κυρίου理解为限定χριστοῦ，译作“主的受膏者”；紧密排列的属格仍存在其他分析可能，另以脚注说明。
- source_word: φόβῳ
  choice: 敬畏
  rationale: φόβος用于人对上帝的态度时兼具惧怕与尊崇；“敬畏”在现代中文中自然地承载这种宗教语义。
- source_word: θεοῦ αὐτοῦ
  choice: 他的上帝
  rationale: 明确保留αὐτοῦ的所有关系，不将其泛化为单独的“上帝”。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: σοφία通常意为“智慧”，本处没有理由缩窄为技能或聪明。
- source_word: πνεύματος
  choice: 灵的
  rationale: 无冠词的πνεύματος既可能指人的灵，也可能指上帝的灵；正文用不加专名号的“灵”保持克制，并以脚注保存另一可能。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: δικαιοσύνη在此与智慧、力量并列，较像德性用语；“公义”比单纯司法性的“正义”更能保留其广度。
- source_word: ἰσχύος
  choice: 力量
  rationale: ἰσχύς表示力量、强健或能力；“力量”自然且不夸大语气。
theological_decisions:
- issue: χριστοῦ κυρίου的关系
  choice: 主的受膏者
  alternative: 受膏的主；主所膏立的那一位
  rationale: 两个属格紧密相连，句法表达有压缩性。正文采用最符合本书弥赛亚语境、也最自然的关系表达，但不把其他分析从脚注中排除。
- issue: πνεύματος所指
  choice: 灵
  alternative: 圣灵（上帝的灵）
  rationale: 原文没有冠词，且本句未明确指定圣灵。正文避免加入原文没有确定表达的神学指称。
- issue: σοφίᾳ与后三个属格的关系
  choice: 具有灵的智慧、公义和力量
  alternative: 具有由灵、公义和力量构成或体现的智慧
  rationale: 希腊文可自然理解为“智慧、公义、力量”三项并列，而πνεύματος直接修饰“智慧”；但紧凑结构也可能使后三个属格都与σοφίᾳ相关。正文选择较自然的中文并保留结构上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“管教之杖”保留诗性和经文意象；后半句用“敬畏……具有……”避免机械重复三个“在……中”，同时不补入具体动作或主语。
