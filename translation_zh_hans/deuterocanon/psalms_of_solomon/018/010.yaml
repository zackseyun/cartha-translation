  yaml_path: translation/deuterocanon/psalms_of_solomon/018/010.yaml
  text: A good generation in the fear of God[a], in days of mercy[c][b]. Interlude.
translation:
  language: zh_hans
  text: '敬畏上帝的良善世代，在怜悯的日子里。[a]


    间奏。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“良善的世代，在对上帝的敬畏中，在怜悯的日子里。”希腊文没有明说动词。也可理解为：“良善的世代在怜悯的日子里敬畏上帝。”
    reason: 保留原文无动词短语的诗体形式及句法上的开放性。
  - marker: b
    text: “间奏”译自 διάψαλμα，可能是礼仪或音乐标记；传统上也译作“细拉”。
    reason: 该术语的确切功能不能确定，列出传统译法供读者参考。
lexical_decisions:
- source_word: γενεὰ
  choice: 世代
  rationale: 该词在这里指具有共同特征的一群人；“世代”保留其集体性和诗歌意味，不将其过度解释为“后裔”或泛化为“人民”。
- source_word: ἀγαθὴ
  choice: 良善
  rationale: 这是对“世代”的直接修饰。“良善”既自然庄重，又保留原词较宽泛的道德含义，不收窄为“正直”或“高尚”。
- source_word: ἐν φόβῳ θεοῦ
  choice: 敬畏上帝
  rationale: “敬畏上帝”是现代中文中清楚而有圣经色彩的表达，涵盖畏惧、尊崇和顺服，不把 φόβος 简化为单纯的“尊敬”。
- source_word: ἐν ἡμέραις ἐλέους
  choice: 在怜悯的日子里
  rationale: 按原文保留复数“日子”及介词结构；“怜悯”直接传达 ἔλεος，并容许这些日子是蒙上帝怜悯所标志的时期。
- source_word: διάψαλμα
  choice: 间奏
  rationale: 该词很可能是礼仪或音乐标记，但确切功能不明。“间奏”以易懂中文提示其功能，同时不声称超出证据的精确含义。
- source_word: '[implied copula / verbless clause]'
  choice: 不补出动词
  rationale: 希腊文是无动词的诗体短语。中文也能自然保留这种凝练、感叹式结构，因此不补“生活”或“处于”，避免把诗句变成解释性的陈述句。
theological_decisions:
- issue: 如何翻译 φόβος θεοῦ
  choice: 敬畏上帝
  alternative: 对上帝的尊崇
  rationale: “敬畏”保留该圣经用语中畏惧、崇敬与顺服并存的张力；“尊崇”容易削弱 φόβος 的力度。
- issue: 无动词短语中两组介词结构的关系
  choice: 正文采用自然的诗体悬置结构，不补明具体谓语
  alternative: 良善的世代在怜悯的日子里敬畏上帝／良善的世代生活在对上帝的敬畏中
  rationale: 原文没有明说“生活”或其他谓语，也未完全消除介词短语在句法上的开放性；保留无动词结构可避免替作者确定关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留原文无动词诗句的凝练感；“敬畏上帝”维持圣经语体及其神学张力。“间奏”另起一行，以显示其作为礼仪或音乐标记的性质。
