  text: Your ears heed the plea of the poor in hope[d][c][b][a]; your judgments are over all the earth with mercy.
translation:
  language: zh_hans
  text: 你的双耳垂听穷人怀着盼望所发的恳求[a]；你的审判遍及全地[b]，并带着怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“祈求”或“祷告”。
    reason: lexical_alternative
  - marker: b
    text: “遍及全地”也可译作“临到全地”或“在全地之上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὦτά σου ἐπακούει
  choice: 你的双耳垂听
  rationale: 保留“耳朵”这一具体意象；ἐπακούει不只是听见，也含有回应、应允的意味。“垂听”在现代汉语中庄重自然，并能表达这种带回应意味的聆听。
- source_word: δέησιν
  choice: 恳求
  rationale: 该词指迫切的请求，也可指祈求。“恳求”既保留迫切感，又不预先限定为礼仪性的祷告。
- source_word: πτωχοῦ
  choice: 穷人
  rationale: 希腊文为阳性单数属格，所指是一个贫穷者；汉语“穷人”无需额外标明性别，也没有把它抽象化为群体。
- source_word: ἐν ἐλπίδι
  choice: 怀着盼望
  rationale: 表达信赖中的期待，并按紧邻关系与穷人的恳求相连；同时不增添盼望对象。
- source_word: κρίματά σου
  choice: 你的审判
  rationale: κρίματα可指判决、裁断或施行审判的作为。“审判”在此兼顾上帝的裁断与治理行动，且不把含义收窄为成文法令。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 遍及全地
  rationale: ἐπί在这里可表达范围或延伸所及。“遍及全地”自然地传达其普世范围，同时以脚注保留较贴近字面的另一理解。
- source_word: μετὰ ἐλέους
  choice: 并带着怜悯
  rationale: 保留“审判”与“怜悯”并置的神学张力，不将其弱化为单纯温和，也不解释二者如何相合。
theological_decisions:
- issue: 审判与怜悯的关系
  choice: 你的审判……并带着怜悯
  alternative: 你以怜悯审判全地
  rationale: 原文只是以μετά把怜悯与审判相联，并未明确说明怜悯是方式、伴随情形还是审判的特质；正文保留这种简洁而有张力的并置。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“垂听”略带经文语体，但仍为当代读者熟悉；全句保持诗歌式的两个平行分句，并避免加入原文没有说明的因果或教义解释。
