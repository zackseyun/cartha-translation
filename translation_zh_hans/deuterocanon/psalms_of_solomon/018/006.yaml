  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
translation:
  language: zh_hans
  text: 愿上帝洁净以色列，为使它在福分中迎接怜悯之日，也在他的弥赛亚被兴起时[a]迎接拣选之日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被兴起”也可译作“被高举”。
    reason: lexical_alternative
  - marker: b
    text: “拣选之日”也可译作“选择之日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι
  choice: 愿……洁净
  rationale: 该形式是 καθαρίζω 的不定过去时主动愿望式第三人称单数，表达愿望或祈求；“愿……洁净”既准确反映语气，也符合现代汉语祷愿体。
- source_word: ὁ θεὸς Ἰσραήλ
  choice: 上帝洁净以色列
  rationale: ὁ θεός 是主语，未变格的 Ἰσραήλ 在此最自然地作及物动词的宾语；因此不译作“以色列的上帝”，也无须补出“我们”。
- source_word: εἰς ἡμέραν ἐλέους ἐν εὐλογίᾳ
  choice: 使它在福分中迎接怜悯之日
  rationale: εἰς 表示面向将来的目标或预备；汉语用“迎接”自然表达这种前瞻关系。“在福分中”保留 ἐν εὐλογίᾳ 的方式或伴随情形。
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: 迎接拣选之日
  rationale: ἐκλογή 指选择、拣选；“拣选”在圣经语境中清楚而庄重，并保留名词结构。
- source_word: ἐν ἀνάξει χριστοῦ αὐτοῦ
  choice: 在他的弥赛亚被兴起时
  rationale: ἀνάξει 表达举起、兴起或高举；被动表达保留“他的弥赛亚之兴起”这一属格结构，不擅自明确施事者。χριστός 在这里是称号，译作“弥赛亚”。
theological_decisions:
- issue: Ἰσραήλ 在句中的句法功能
  choice: 将其理解为“洁净”的直接宾语：上帝洁净以色列
  alternative: 理解为属格意义：“以色列的上帝洁净（我们）”
  rationale: καθαρίσαι 是有限动词形式，ὁ θεός 已明确作主语，而未变格的 Ἰσραήλ 可作宾语；这种分析句法完整，不必补出原文没有的“我们”。
- issue: ἀνάξει 所表达的弥赛亚行动或地位
  choice: 译作“弥赛亚被兴起”
  alternative: 译作“弥赛亚被高举”
  rationale: “兴起”保留向上举起及使之出现的动态含义；脚注列出“高举”，以保留其可能具有的尊荣、登位色彩，而不在正文中提前限定。
- issue: ἐκλογῆς 的神学含义
  choice: 译作“拣选”
  alternative: 译作“选择”
  rationale: “拣选”能表达神圣选择的语境，同时原文没有说明拣选的具体对象或方式，正文也不加以限定。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“愿……”体现希腊文愿望式；以“使它……迎接”自然呈现两个 εἰς 短语面向未来、为某日预备的关系。代词“它”指以色列这一群体。
