base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: zh_hans
  text: 义人的真实[a]来自上帝——他们的救主；罪上加罪，不在义人的家中留宿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真实”也可译作“忠信”“真诚”或“真理”。这里可能侧重义人的真实品格，但原词的含义较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: 真实
  rationale: 该词可指“真理”，也可指人的真实、真诚或忠信。此处以义人的品格与累积的罪相对，“真实”既保留与“真”的直接联系，也不把含义限定为言语诚实或特定的盟约概念；其他可能译法列入脚注。
- source_word: παρὰ θεοῦ
  choice: 来自上帝
  rationale: παρά加属格在此表示来源；“来自上帝”准确而自然。
- source_word: σωτῆρος αὐτῶν
  choice: 他们的救主
  rationale: 将该同位语直接保留为名词结构，既反映σωτήρ“救主、拯救者”的含义，也不额外说明上帝施救的方式。
- source_word: αὐλίζεται
  choice: 留宿
  rationale: 该动词有住宿、过夜或扎营之意；“留宿”保留了罪不能在义人家中找到住处的具体意象。
- source_word: ἐν οἴκῳ δικαίου
  choice: 在义人的家中
  rationale: 保留δικαίου的单数泛指和οἶκος的家庭、居所意象；现代汉语无需另加性别词。
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: 罪上加罪
  rationale: 保留原文重复和层层累加的修辞力量，同时符合现代汉语表达。
theological_decisions:
- issue: ἀλήθεια所表达的是抽象真理，还是义人的伦理品格
  choice: 正文译“真实”，保留两方面的开放性
  alternative: 可译“忠信”“真诚”或“真理”
  rationale: 上下文倾向伦理品格，但希腊词本身范围较宽；不应在正文中擅自限定为言语诚实、盟约忠诚或命题真理。
- issue: 义人的真实与上帝的关系
  choice: 直译为“来自上帝”
  alternative: 可译“由上帝赐下”
  rationale: 原文明确表达来源，却没有明说赐予的具体方式；因此避免补入“赐下”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝——他们的救主”保留希腊文同位语；“留宿”延续原文具体比喻；分号呈现两个诗行之间的对照。
