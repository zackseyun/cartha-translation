  text: and he will certainly not be remembered when he visits the righteous[a][b][c].
translation:
  language: zh_hans
  text: 而在眷顾义人的时候，他必不被记念[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指上文的罪人。希腊文也可能理解为：“它必不被记念”，其中“它”指上文所说的“灭亡”。
    reason: alternative_reading
  - marker: b
    text: “眷顾”也可译作“探访”或“照看”。希腊文在这里没有明说是谁眷顾义人。
    reason: lexical_and_subject_ambiguity
lexical_decisions:
- source_word: οὐ μὴ
  choice: 必不
  rationale: 双重否定具有强烈的强调作用；“必不”在现代汉语中简洁、庄重，也保留了确定语气。
- source_word: μνησθήσεται
  choice: 被记念
  rationale: 忠实表达被动语态，并保留究竟是谁不被记念的语境歧义；“记念”也符合本段的宗教—道德语域。
- source_word: ἐπισκέπτηται
  choice: 眷顾
  rationale: 该词既可指探访，也可指带着关注照看。“眷顾”能传达带有照料意味的临到，同时不在正文中指定行动者。
- source_word: δικαίους
  choice: 义人
  rationale: 这是该道德与宗教语境中直接、自然且通行的对应表达。
- source_word: implicit subject of μνησθήσεται
  choice: 他
  rationale: 按上文连续描述罪人结局的语流，将省略的主语理解为罪人最为连贯；但希腊文此处没有明说主语，故以脚注保留另一种可能。
- source_word: ὅταν ἐπισκέπτηται δικαίους
  choice: 到了眷顾义人的时候
  rationale: 采用名词化时间结构，不擅自补出“眷顾”的主语，从而保留希腊文在行动者上的含混。
theological_decisions:
- issue: 谁不被记念
  choice: 正文以“他”指上文的罪人
  alternative: 也可将主语理解为上文所说的“灭亡”，译作“它必不被记念”
  rationale: 上文动词链以罪人为中心，且恶人不再被记念是合乎语境的表达；然而希腊文主语省略，邻近语境中的“灭亡”也可能被视为先行项，因此不应抹去这一歧义。
- issue: 谁眷顾义人
  choice: 正文不明说行动者
  alternative: 可理解为上帝眷顾义人，也可按语法连续性理解为与前句相同的主语
  rationale: 希腊文没有显式主语；直接补作“上帝”会作出原文未明确作出的神学判定，而让“他”明确兼任该动词主语又会造成语义上的突兀。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“到了……的时候”保留时间从句，同时避免补出希腊文未明说的眷顾者；“必不”传达强调否定。
