  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
translation:
  language: zh_hans
  text: 义人常常察看自己的家[b]，以除去他过犯中的不义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他有过犯时”，或“因为他的过犯”。
    reason: lexical_alternative
  - marker: b
    text: 本节描写义人主动察看并照管自己的家，并处理与其过犯有关的不义，而不是对罪恶漫不经心。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέπτεται
  choice: 察看
  rationale: 在“自己的家”这一语境中，表示主动查看、督察和照管，而非一般性的“探访”；“察看”既保留审视意味，也符合现代汉语表达。
- source_word: διὰ παντός
  choice: 常常
  rationale: 表达持续或惯常的行动；“常常”自然清楚，并保留其反复、恒常的意味。
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 希腊文是阳性单数，用“义人”可自然指称这一具体的道德典范，同时避免在中文中不必要地增添“男人”。
- source_word: τὸν οἶκον αὐτοῦ
  choice: 自己的家
  rationale: 反身化处理明确房屋或家室属于主语；“家”既可指住所，也可涵盖家中成员，保留原文可能的范围。
- source_word: τοῦ ἐξᾶραι
  choice: 为要除掉
  rationale: 带冠词的不定式表示目的；“为要”明确目的关系，“除掉”保留清除罪恶的力度。
- source_word: ἀδικίαν
  choice: 不义
  rationale: 此处指广义的道德错误，而不只限于社会层面的不公；“不义”贴近原词，也保持经文庄重语体。
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: 他过犯中的
  rationale: 贴近介词ἐν的形式与原文含混性，不强行判定为时间“当他犯罪时”或因果“因为他的过犯”；物主代词自然回指义人。
theological_decisions:
- issue: 经文是否暗示义人也会有过犯
  choice: 保留“他的过犯”对义人的自然回指，使经文容许义人犯罪后主动除去不义。
  alternative: 将过犯理解为家中他人的过犯，或译得含混以暗示义人无罪。
  rationale: παραπτώματι αὐτοῦ中的物主代词最自然地回指主语“义人”；译文不以教义预设消除义人与过犯并置所形成的张力。
- issue: ἐν παραπτώματι所表达的关系
  choice: 正文采用较形式对应的“在……中”，以保留处境、时间或关联等可能性。
  alternative: 译作“当他有过犯时”或“因为他的过犯”。
  rationale: 希腊文介词短语本身可容许不同关系；正文不替读者确定唯一解释，其他自然理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“察看自己的家”体现主动审视与照管；末句略带原文的紧缩感，以保存ἐν παραπτώματι αὐτοῦ在语义和神学上的真实含混。脚注标记均置于正文相应位置。
