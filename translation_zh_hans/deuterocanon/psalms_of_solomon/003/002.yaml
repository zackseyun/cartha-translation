  yaml_path: translation/deuterocanon/psalms_of_solomon/003/002.yaml
  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: zh_hans
  text: 要向那位配受赞美的上帝唱颂歌，献上赞美[a]。要歌唱，也要为他的警醒而警醒[b]；因为一首出于良善的心、献给上帝的诗歌是美好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “配受赞美的”也可译作“受赞美的”或“可赞美的”。
    reason: lexical_alternative
  - marker: b
    text: “为他的警醒而警醒”原文措辞不同寻常，也可理解为“面对他的警醒，要保持警醒”或类似意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  choice: 颂歌和赞美诗
  rationale: 分别表达ὕμνος与αἶνος的赞颂含义，又使两个名词都能自然地作“歌唱”的宾语，避免把并列结构误读为两个动词。
- source_word: ψάλλετε / ψάλλε
  choice: 歌唱
  rationale: 在敬拜语境中指向上帝歌唱或奏唱；“歌唱”自然庄重，并保留命令语气。
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: 上帝……他是配受赞美的那一位
  rationale: αἰνετός既可表示“受赞美的”，也可表示“配受赞美的”；正文采用现代汉语中较清楚自然的后者，同时以脚注保留歧义。
- source_word: γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: 为他的警醒而警醒
  rationale: 保留动词与同根名词的刻意重复，以及介词短语本身的不寻常表达，不将“他的警醒”具体解释为护佑、鉴察或别的神学概念。
- source_word: ψαλμός
  choice: 诗歌
  rationale: 此处指献给上帝的宗教歌曲；“诗歌”在现代中文中比音译色彩较强的“诗篇”更适合作普通名词，同时保留敬拜语境。
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: 出于善心
  rationale: 直译ἀγαθή为“善”，不加强为“纯洁”或“真诚”；“出于善心”是自然的现代汉语。
- source_word: ἀγαθὸς ... ἀγαθῆς
  choice: 美好的……善心
  rationale: 同一希腊词在两个位置分别修饰诗歌与内心；中文依搭配译为“美好的”和“善心”，保留共同的正面价值色彩而避免生硬重复。
theological_decisions:
- issue: αἰνετός的被动或价值含义
  choice: 正文译作“配受赞美的那一位”
  alternative: “受赞美的那一位”或“可赞美的那一位”
  rationale: 该形容词可表达实际受到赞美，也可表达值得赞美；正文选择语义清楚的价值含义，但脚注明示其他可能，不把歧义隐藏起来。
- issue: “他的警醒”所指为何
  choice: 保留为“他的警醒”
  alternative: 解释为上帝的看顾、鉴察或守望
  rationale: 原文没有明确说明这一警醒如何发挥作用；为避免导入特定神学解释，保留其开放性和不寻常措辞。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。首句保持赞美用语的并列，第二句刻意保留希腊文同根词重复所造成的张力；末句使用“善心”和“美好的”以符合中文搭配，同时反映ἀγαθός的重复。
