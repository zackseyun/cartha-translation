base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: zh_hans
  text: 他倒下了，因为他这一跌是惨重的[a]，再也站不起来。罪人的灭亡直到永远[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他这一跌是惨重的”也可译作“他的跌倒是邪恶的”，或“他的尸体是污秽的”。
    reason: πτῶμα 可指“跌倒、败亡”，也可指“尸体”；πονηρόν 可表示“邪恶的”，在描述状况时也可表示“惨重的、凶险的”。
  - marker: b
    text: “直到永远”较字面可译作“直到那世代”。
    reason: εἰς τὸν αἰῶνα 通常是表示永久的惯用语，但 αἰών 本身也可指一个世代或时代。
lexical_decisions:
- source_word: ἔπεσεν
  choice: 他倒下了
  rationale: 用简洁的完成性表达呈现已发生的倒下，并与下文 πτῶμα 的“这一跌”形成词义呼应。
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: 他这一跌是惨重的
  rationale: πτῶμα 在此与 ἔπεσεν、ἀνιστήσεται 相连，优先理解为严重而无法恢复的跌倒；πονηρόν 在描述遭遇或状况时可指惨重、凶险，而不必限定为道德上的邪恶。脚注保留“邪恶”及“尸体”两种词义可能。
- source_word: οὐκ ἀνιστήσεται
  choice: 再也站不起来
  rationale: 自然表达其不可逆的结局；“再也”在汉语中由前文已经倒下的语境自然引出，并未另加复活教义判断。
- source_word: ἡ ἀπώλεια τοῦ ἁμαρτωλοῦ
  choice: 罪人的灭亡
  rationale: “灭亡”兼具毁灭与最终败亡的分量，且不使用过于宗教化或带特定教派色彩的术语。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 在审判与不可恢复的语境中，这一固定表达最自然地表示永久持续；脚注注明较字面的另一译法。
theological_decisions:
- issue: οὐκ ἀνιστήσεται 是否明确指末日复活
  choice: 按上下文译作“再也站不起来”
  alternative: “不会复活”
  rationale: 原句可描写倒下后不能重新起来，并未明确限定为末日身体复活；正文保留这一较宽的意象，避免过度神学化。
- issue: εἰς τὸν αἰῶνα 的持续范围
  choice: 直到永远
  alternative: 直到那世代
  rationale: 此处有关罪人最终灭亡的语境支持永久性理解，但以脚注保留 αἰών 较字面的“世代”可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒下—这一跌—站不起来”保留希腊文的词义连贯；末尾逗号保留原文此句尚与下文衔接的标点走势。
