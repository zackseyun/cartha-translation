base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/003.yaml
  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: zh_hans
  text: 义人必不断记念主，心怀感恩[a]，并宣明主的判决是公正的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩”或译“赞美”或“承认”。希腊词ἐξομολόγησις可按语境表示感恩、赞美或承认。
    reason: lexical_alternative
  - marker: b
    text: 直译：“主的判决的称义（或辩明）。”这里可理解为承认或宣明主的判决是公正的。
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: 义人
  rationale: 这是形容词作名词，指以公义为特征的人；“义人”简洁、自然，也符合诗篇体裁的惯用表达。
- source_word: μνημονεύσουσιν
  choice: 必……记念
  rationale: 该将来时动词表达此处义人持续而坚定的行动；“记念”既可指心中牢记，也保留在敬拜中提说的可能性。
- source_word: διὰ παντός
  choice: 常常
  rationale: 该习语表示持续不断或在一切时候；“常常”是自然的现代汉语表达。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: κύριος在七十士译本及相关犹太宗教文献中通常作为对上帝的称谓；译作“主”保留其神学分量。
- source_word: ἐν ἐξομολογήσει
  choice: 以感恩称颂
  rationale: ἐξομολόγησις在希腊文圣经的诗歌语境中可指感恩、赞美或承认；此处采用“感恩称颂”，突出感恩之意，同时避免将其缩减为纯粹的内心情感。
- source_word: δικαιώσει
  choice: 申明……公正
  rationale: 该名词表示称义、证实为正或辩明。其所关联的是“主的判决”，故用动词化表达“申明……公正”，自然传达义人承认并维护这些判决为正的含义。
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: 主的判决
  rationale: κρίματα指司法性的裁断或判决；“主的判决”简洁保留其审判和裁定意味。
theological_decisions:
- issue: 义人对主之判决的“称义／辩明”
  choice: 申明主的判决公正
  alternative: 为主的判决辩护／称主的判决为义
  rationale: 译文表达义人承认并见证主的判决是公正的，而不是暗示这些判决本身原来有罪、需要被赋予正当性；同时保留δικαίωσις所含的证实、辩明之张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“必……记念”保留希腊文将来时的确定语气；将两个抽象名词结构适度动词化为“以感恩称颂，并申明……公正”，以避免生硬，同时保留原文的司法意象和词义张力。
