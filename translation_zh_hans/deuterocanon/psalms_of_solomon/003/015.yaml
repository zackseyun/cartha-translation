lexical_decisions:
- source_word: αὕτη
  choice: 这就是
  rationale: 指回上文所描述的结局，并保留希腊语指示代词在判断句中的确认、强调作用。
- source_word: ἡ μερὶς
  choice: 分
  rationale: 表示某人所得或被分定的一份，也可引申为命运、结局；“分”简洁自然，并避免把隐含意义过度明说。
- source_word: τῶν ἁμαρτωλῶν
  choice: 罪人的
  rationale: 属格复数表示这一分属于那些以犯罪为特征的人；“罪人”是现代汉语中清楚而庄重的对应。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这一固定表达在此表示持续不止、永久如此；“永远”准确且符合现代汉语习惯。
