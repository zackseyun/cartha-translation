  text: He makes atonement for unintentional sin by fasting and humbling his soul[c][b][a];
translation:
  language: zh_hans
  text: 他为无意中犯的罪[a]赎罪[c]，以禁食和刻苦己身[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为无知（或因无知而犯的过失）赎罪。”希腊文直说“无知”，在这里可指因不知而犯的过错。
    reason: lexical_alternative
  - marker: b
    text: “刻苦己身”直译为“使自己降卑”（字面上说“使自己的生命／己身降卑”），是圣经惯用语，可指克己或使自己受苦。
    reason: cultural_note
  - marker: c
    text: “赎罪”也可按希腊文普通过去时译作“赎了罪”；这里依上下文理解为对惯常行为的概括。
    reason: textual_or_grammatical_note
lexical_decisions:
- source_word: ἐξιλάσατο
  choice: 赎罪
  rationale: 保留动词在祭祀与修复关系语境中的分量；中文“赎罪”简洁自然，也不额外限定赎罪机制。结合上下文对义人惯常敬虔行为的描述，将不定过去时理解为概括性用法，译成现在时。
- source_word: περὶ ἀγνοίας
  choice: 为无意中犯的罪
  rationale: ἄγνοια本义涉及“不知、无知”，但与ἐξιλάσατο连用时具有礼仪语境下“因不知而犯的过错／无意之罪”的含义；正文采用自然明确的表达，脚注保留较直译的可能。
- source_word: ἐν νηστείᾳ
  choice: 以禁食
  rationale: ἐν在此表示方式或手段；“以禁食”既自然，又保留庄重语体。
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  choice: 和谦卑己心
  rationale: 保留“使自己的魂降卑”这一闪语式圣经表达的核心意象，同时用现代中文较自然的“己心”表达整个人内在生命的自抑与刻苦。
theological_decisions:
- issue: ἐξιλάσατο的不定过去时是一次性过去动作，还是概括性／习惯性描述
  choice: 按概括性不定过去时译为“他……赎罪”
  alternative: “他……赎了罪”
  rationale: 本句处于对义人惯常行为的连续描述中，概括性理解更能保持篇章连贯；脚注说明也保留按普通过去时理解的可能。
- issue: ἀγνοία是否应明说为“罪”
  choice: 正文译作“无意中犯的罪”
  alternative: “无知／过失”
  rationale: 赎罪语境使该词指向因不知而犯的过错，但希腊文并未直接出现“罪”字，因此以脚注保留形式上的含混，避免将词义范围完全封闭。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“以禁食和谦卑己心”保留原文并列的方式结构及圣经语感；脚注顺序按正文首次关联位置排列。
