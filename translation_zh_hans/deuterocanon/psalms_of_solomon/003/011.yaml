base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/011.yaml
  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
translation:
  language: zh_hans
  text: 罪人跌倒了[a]，便咒诅自己的生命、自己的出生之日和母亲生产时的阵痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遭了祸患”。希腊语动词既可表示实际跌倒，也可比喻落入灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέκοψεν
  choice: 跌倒了
  rationale: προσκόπτω可指碰撞、绊跌，也可比喻陷入灾祸。“跌倒了”保留原文鲜明的动作意象，同时不把它限定为彻底毁灭。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 该名词直接指犯罪或有罪的人；“罪人”简洁自然，也符合本句庄重的语体。
- source_word: καταρᾶται
  choice: 咒诅
  rationale: 该动词表示诅咒；“咒诅”准确保留原文强烈而郑重的语气。
- source_word: ζωὴν αὐτοῦ
  choice: 自己的生命
  rationale: 原文以他的生命本身为咒诅的对象；“自己的生命”既清楚指回主语，也避免误解为他人的生命。
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: 自己的出生之日
  rationale: 该短语指他出生的那一天；“出生之日”贴近希腊文，并保持诗歌的庄重感。
- source_word: ὠδῖνας μητρός
  choice: 母亲生产时的阵痛
  rationale: ὠδῖνες指分娩的疼痛。“生产时的阵痛”是现代汉语中清楚自然的表达，并保留生育意象；原文未明说“他的”，汉语语境已足以表明所指。
