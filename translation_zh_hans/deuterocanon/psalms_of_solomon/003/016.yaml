  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: zh_hans
  text: 但敬畏主的人必复活，进入永生；他们的生命在主的光中永不止息。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενοι
  choice: 敬畏……的人
  rationale: 该现在分词作名词用，指以持续敬畏主为特征的一群人。“敬畏”既保留对上帝之畏惧与尊崇的圣经语义，也符合现代汉语宗教语境。
- source_word: κύριον / Κυρίου
  choice: 主 / 主的
  rationale: 两处均指上帝；译作“主”准确、自然，并保持前后一致。希腊文本本身不要求采用希伯来文神名的特殊排印形式。
- source_word: ἀναστήσονται
  choice: 必复起
  rationale: 该将来时中间形式表示起来、复起；结合“进入永生”的末世语境，“复起”自然传达复活含义，同时不改译为希腊文未明示的被动式“被复活”。“必”体现将来陈述的确定性。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 进入永生
  rationale: εἰς在此表达趋向或结果。“进入永生”在现代汉语中自然，也保留原文的动态方向感与末世意味。
- source_word: ἐν φωτὶ Κυρίου
  choice: 在主的光中
  rationale: 按介词结构直译，保留“光”的意象以及生命处于主之光中的空间性表达，不将其收窄为工具性的“靠主的光”。
- source_word: οὐκ ἐκλείψει ἔτι
  choice: 永不止息
  rationale: ἐκλείπω可表示衰竭、停止或终结；以“生命”为主语时，“止息”最为自然。οὐκ…ἔτι在此表达从此不再终止，译作“永不”简洁而准确。
theological_decisions:
- issue: ἀναστήσονται εἰς ζωὴν αἰώνιον中的复活含义
  choice: 译作“必复起，进入永生”，直接呈现未来复活及其归向。
  alternative: 译作“必起来，进入永生”，较少明确复活意味。
  rationale: ἀναστήσονται结合末世性的“进入永生”，最自然地指向复活生命；不过采用主动意味的“复起”，避免加入原文没有明说的施动者。
- issue: “他们的生命”与“在主的光中”的句法关系
  choice: 译作“他们在主的光中，生命永不止息”，让“在主的光中”修饰其生命持续的处境。
  alternative: 译作“他们的生命在主的光中永不止息”。
  rationale: 两种语序语义相同；所选表达更符合现代汉语节奏，同时不把“主的光”解释为生命的原因或手段。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敬畏主”“永生”“主的光”保留经文核心术语和意象；分号对应希腊文两个并列而紧密相关的分句。无须脚注。
