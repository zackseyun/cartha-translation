lexical_decisions:
- source_word: ἀποσκοπεύει
  choice: 警醒等候，看
  rationale: 该动词表示专注而持续地观望；“警醒等候，看”在现代汉语中自然地传达期待与留意的意味。
- source_word: ὅθεν
  choice: 从何处
  rationale: 保留该副词所表达的来源或起点，不将其泛化为“怎样”。
- source_word: ἥξει
  choice: 将……临到
  rationale: 该将来时动词表示来到；与“救恩”和间接受词搭配时，“临到他”既自然，也保留来到某人那里的方向感。
- source_word: σωτηρία
  choice: 救恩
  rationale: “救恩”能涵盖宗教语境中的拯救意义，又不把词义限缩为某一次具体脱险；“解救”亦为可能译法。
- source_word: αὐτῷ
  choice: 临到他
  rationale: 与ἥξει合译，用“临到他”表达希腊语与格所具有的趋向或受益关系。
