lexical_decisions:
- source_word: Ἵνα τί
  choice: 为什么
  rationale: 自然表达带有责问和唤醒意味的原因问句，保留原文的直接力度。
- source_word: ὑπνοῖς
  choice: 沉睡
  rationale: 对应第二人称单数现在时；“沉睡”既可指实际睡眠，也能保留诗歌语境中的属灵迟钝意味，而不将其明说。
- source_word: ψυχή
  choice: 心灵啊
  rationale: 保留原文对 ψυχή 的直接呼语；不增添原文没有的“我的”。“心灵”在现代汉语中比单用“灵魂”更适合作为诗歌中的自我呼唤。
- source_word: εὐλογεῖς
  choice: 称颂
  rationale: 在以神为对象的敬拜语境中，εὐλογέω 表示颂赞、宣扬其美善；“称颂”自然庄重，也保留圣经用语色彩。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在敬拜语境中将 κύριος 译为“主”，符合其通常的神圣称谓用法；汉语不需要对应希腊语冠词。
