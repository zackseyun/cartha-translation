  yaml_path: translation/deuterocanon/psalms_of_solomon/003/004.yaml
  text: The righteous man will not disdain being disciplined by the Lord[c][b][a]; his delight is continually before the Lord.
translation:
  language: zh_hans
  text: 义人受主管教时，并不轻看这管教；他的喜悦常在主面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文转录作δίκαιας παιδευόμενους；两词虽都呈宾格形式，却在性别和数上不一致。据Swete版页面及校订记录，此处应作单数主格δίκαιος παιδευόμενος，即“受管教的义人”。正文采用这一读法。
    reason: textual_variant
  - marker: b
    text: 若依所提供转录中异常的宾格形式作另一种处理，也可理解为：“他的恩意不会忽略那些受主管教的义人；这恩意常在主面前。”此理解因该转录的形态不协调而不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλιγωρήσει
  choice: 并不轻忽
  rationale: ὀλιγωρέω表示把某事看得无关紧要，因而不予重视；“轻忽”既保留“轻看”的词义，又自然适用于“管教”。未来时在格言式陈述中译作一般性的“并不”，更符合现代汉语。
- source_word: δίκαιος παιδευόμενος
  choice: 义人受……管教时
  rationale: 依据所标明的Swete版页面及修订记录所确认的单数主格读法，δίκαιος是主语，παιδευόμενος描述义人正在受管教。汉语用时间从句清楚表达二者关系。
- source_word: παιδευόμενος
  choice: 受……管教
  rationale: παιδεύω在此指带有纠正作用的训练；“管教”兼有教导与纠正之意，也与本句所呼应的《箴言》3:11语境相称。
- source_word: εὐδοκία αὐτοῦ
  choice: 他的喜悦
  rationale: εὐδοκία可指喜悦、悦纳或美意。这里保留“他的”所指对象可能是义人的自然衔接，不将其改释为上主的恩宠。
- source_word: διὰ παντός
  choice: 始终
  rationale: 该短语表示持续不断；“始终”简洁、庄重，并能自然修饰“在主面前”。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: 保留希腊文的空间—关系意象，不扩展解释为蒙悦纳或处于主的同在中。
- source_word: κυρίου / Κυρίου
  choice: 主
  rationale: 两处κύριος均指上帝；译作“主”符合经书用语，并保留原文的重复。
theological_decisions:
- issue: εὐδοκία αὐτοῦ所指及含义
  choice: 他的喜悦
  alternative: 他的美意／他的恩意
  rationale: 按校正后的句法，αὐτοῦ最自然地回指“义人”；“喜悦”保留εὐδοκία的正面意愿和欣悦色彩，同时不把它神学化为上主赐下的恩宠。
- issue: 首句的主语
  choice: 义人
  alternative: 他的恩意
  rationale: 所提供的连续转录含有互不协调的宾格形式δίκαιας παιδευόμενους，但修订记录指出Swete印本实际作单数主格δίκαιος παιδευόμενος；此读法也形成完整句法，并与《箴言》3:11的措辞呼应。因此正文采用“义人”为主语，同时以脚注保存所提供转录所产生的另一种理解。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 本节的κύριος指上帝；“主”保持圣经语体和神学连续性，不额外引入解释。
translation_notes:
  register: 采用现代、庄重而易懂的经书语体。“轻忽这管教”补出汉语所需的宾语，使首句自然清楚；分号保留希腊文两个分句之间既并列又紧密相连的关系。正文不消解“他的喜悦”究竟具体指义人的内在心意、所喜悦之事或蒙悦纳状态的语义张力。
