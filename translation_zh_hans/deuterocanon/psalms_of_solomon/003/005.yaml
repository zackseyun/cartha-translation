base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/005.yaml
  text: The righteous man is attentive and will declare the Lord just; The righteous man is attentive and will vindicate the Lord; he falls, and he looks to see what God will do for him., and he looks to see what God will do for him.
translation:
  language: zh_hans
  text: 义人留心警醒，也必称主为义[a]；他跌倒，便注目看上帝要为他做什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“证明主是公义的。”
    reason: δικαιώσει 既可较形式地译为“称……为义”，也可按语境表达为“证明……是公义的”。
  - marker: b
    text: 或译：“上帝要怎样待他。”
    reason: 与格 αὐτῷ 可表示受益的“为他”，也可较中性地表示“对他、怎样待他”。
lexical_decisions:
- source_word: προσέχων
  choice: 留心警醒
  rationale: 该现在分词描写义人持续留意、警觉的状态。“留心警醒”既保留注意与警觉之意，也不把它局限为单纯的观看动作。
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 这是阳性单数的名词化形容词，指具有代表性的正直之人；“义人”是现代汉语宗教文献中自然、简洁且可作泛指的对应表达。
- source_word: δικαιώσει
  choice: 必称……为义
  rationale: 动词以“主”为宾语，并非表示人使主成为公义，而是承认并宣告主是对的、公义的。“称主为义”保留 δικαιόω 的词汇联系及原文略显强烈的表达。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在这里敬称上帝；译作“主”符合上下文和汉语传统用法。
- source_word: ἔπεσεν
  choice: 他跌倒
  rationale: 不带完成体标记的汉语表达适合此处格言式、概括性的用法，并可与后面的现在时动作自然衔接，避免误解为某次特定的历史事件。
- source_word: ἀποβλέπει
  choice: 便注目看
  rationale: 该动词表示把目光集中于某处，并含有所期待地察看的意味；“注目看”保留视觉指向性，而不强化为原文未明说的“等候”。
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: 上帝要为他做什么
  rationale: ποιέω 后的间接宾语 αὐτῷ 可表示“为他”，也可较中性地表示“对他”。结合后文盼望拯救的语境，正文采用受益含义，同时用脚注保留另一可能。
theological_decisions:
- issue: 义人“称主为义”是承认上帝公义，还是为上帝辩护
  choice: 称主为义
  alternative: 证明主是公义的
  rationale: 正文尽量保留 δικαιόω 与“义”的词根联系，也保留人对主作出正面判断这一神学张力；脚注提供较解释性的自然说法，避免暗示人的宣告使上帝才成为公义。
- issue: 上帝将为义人做事，还是对义人采取行动
  choice: 为他做什么
  alternative: 要怎样待他
  rationale: 与相邻语境中的获救盼望相合，受益性理解略占优势；但与格 αὐτῷ 本身容许较中性甚至不利的理解，因此不在正文中消除这一歧义，而以脚注注明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“义人”“称……为义”“上帝”等词保持经文语域；句式简洁，分号对应原文两组紧密相连的陈述。正文中的“他跌倒”按格言式情境处理，不加“已经”，以免限定为一次特定事件。
