translation:
  language: zh_hans
  text: 他给自己的一生添上一桩又一桩罪[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在自己的一生中，一罪又添一罪。”
    reason: τῇ ζωῇ αὐτοῦ也可理解为罪恶累积发生的范围，而非“添加”的对象。
  - marker: b
    text: 另一种较简练的译法是：“他在一生中罪上加罪。”
    reason: 保留原文重复、累积的表达；正文则较清楚地显出两处名词均为复数。
lexical_decisions:
- source_word: προσεθήκεν
  choice: 加
  rationale: 采用“加”保留 προστίθημι 的基本意象，也让后面的反复结构自然表达罪恶不断累积。
- source_word: ἁμαρτίας ἐφʼ ἁμαρτίαις
  choice: 一桩又一桩罪
  rationale: 原文两处均用复数，表示多项罪恶层层累积；“一桩又一桩罪”既明确保留复数和强化意味，也符合现代汉语表达。
- source_word: τῇ ζωῇ αὐτοῦ
  choice: 在自己的一生上
  rationale: 按与 προσεθήκεν 相连的间接对象理解为“加在他的一生上”，并保留它也可能表示行为发生范围的语法张力；“自己”清楚回指主语。
