  text: And the Lord cleanses every devout man and his house[a][b][c].
translation:
  language: zh_hans
  text: 主洁净每一个虔敬的人，也洁净他的家[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬的人”也可译作“圣洁的人”或“敬虔的人”。
    reason: lexical_alternative
  - marker: b
    text: “家”也可理解为“家室”或“家人”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 希腊文带定冠词，指作为称号的“主”；中文圣经语体中以“主”自然、庄重地表达。
- source_word: καθαρίζει
  choice: 洁净
  rationale: 保留现在时的一般性陈述，并传达 καθαρίζω 兼具礼仪与道德色彩的“使洁净”之意。
- source_word: πᾶν ἄνδρα
  choice: 每一个……的人
  rationale: πᾶν 与单数 ἄνδρα 构成逐一分配的意义；中文用“每一个……的人”表达，不将范围改成集体概念。
- source_word: ὅσιον
  choice: 虔敬
  rationale: ὅσιος 在此侧重对神忠诚、敬虔的品格；“虔敬”比单纯的“圣洁”更自然地体现这一层意思，同时不把它限定为礼仪身份。
- source_word: οἶκον αὐτοῦ
  choice: 他的家
  rationale: “家”既可指住所，也可涵盖家中成员，保留 οἶκος 在此的语义开放性，并有利于维持上下文中同一词语的呼应。
theological_decisions:
- issue: 主所洁净的“家”究竟指房屋还是家人
  choice: 正文保留“他的家”
  alternative: “他的家人”或“他的家室”
  rationale: οἶκος 可指房屋、家庭或家户；原文未明确限定，故不在正文中把它收窄为物质建筑或家庭成员。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主洁净……也洁净……”补出第二个谓语，使希腊文中并列宾语的关系在中文里清楚自然；“家”保留原文可能兼指住所与家户的含义。
