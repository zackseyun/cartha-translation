  text: May your mercy, O Lord, be upon all who love you.
translation:
  language: zh_hans
  text: 愿你的怜悯临到所有爱你的人，主啊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: 愿……临到
  rationale: γίνομαι的不定过去时祈愿语气在这里表达祈求；“愿……临到”既自然传达愿望语气，也与后面的介词ἐπί相配。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格，在此直接称呼上帝；“主啊”符合现代汉语祷告语体，也保留其神圣称谓。
- source_word: τὸ ἔλεός σου
  choice: 你的怜悯
  rationale: ἔλεος指向有需要者所施的怜悯或慈悲；“怜悯”在此直接、庄重，且不额外加入原文未明说的盟约含义。
- source_word: ἐπὶ
  choice: 临到
  rationale: ἐπί接宾格，在祈愿表达中表示朝向并施及某些人；汉语以“临到”自然呈现这种方向和降临之意。
- source_word: πάντας τοὺς ἀγαπῶντάς σε
  choice: 所有爱你的人
  rationale: 带冠词的现在时分词指以爱上帝为特征的一类人；“所有爱你的人”忠实且符合现代汉语习惯。
theological_decisions:
- issue: 直接称呼上帝时κύριος的译法
  choice: 主啊
  alternative: 主人啊
  rationale: 本句是对上帝的祷告；“主啊”保留圣经传统中的称谓及原文语义，而“主人啊”在现代汉语中容易使语域偏向世俗的人身隶属关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。将呼语“主啊”置于句末，既贴近希腊原文次序，也使汉语祈愿句流畅自然。
