  to: 他的手率先伸向那人，要对付他，仿佛出于热心[a]；可是他自己却在各样罪恶的行为和放纵无度的事上有罪[b]。
  rationale: 修订仅改善汉语的自然度和原文关系的明晰度：以“率先”表达ἐν πρώτοις的优先行动，以“要对付他”明确ἐπʼ αὐτόν在此语境中的敌对含义，以“在……和……上有罪”对应两个并列的ἐν短语。保留“仿佛”所体现的ὡς的距离感，也在脚注中保留ἁμαρτωλῶν可作阳性复数的语法歧义。
