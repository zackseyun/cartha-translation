  source_fidelity: 译文总体准确呈现了此人急于针对别人、却自己有罪的对照，也恰当保留了ὡς所带来的表象性。“各样罪恶的行为”可成立地反映ἁμαρτωλῶν作为中性复数实体的理解。为更直接体现ἐν πρώτοις的优先行动含义，并使末尾两个ἐν短语在汉语中更清晰地并列，建议小幅调整。
  naturalness: 原译庄重通顺。“他的手首先伸向那人”略显生硬，且“首先”容易仅被理解为时间顺序；“率先向那人伸手”更符合现代汉语，但须由“对付”明确其敌对方向，避免“伸手”被理解为援助。“因……、因……而有罪”重复且不如“在……和……上有罪”自然。
  terminology: “热心”“有罪”均合适。“放纵之事”可以保留，但“放纵无度的事”更清楚表达ἀκρασίαις所指的无自制、过度放纵，而不限定为某一特定形式。脚注应继续保留ἁμαρτωλῶν的阳性复数可能性，不将有争议的语法可能性排除。
