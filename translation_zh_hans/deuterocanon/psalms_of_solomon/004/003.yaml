  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
translation:
  language: zh_hans
  text: 他的手率先伸向那人，要对付他，仿佛出于热心[a]；可是他自己却在各样罪恶的行为和放纵无度的事上有罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “率先”也可按时间理解为“起初”；“仿佛出于热心”也可译作“像是带着热心”。原文可能指外在表现或自称的热心。
    reason: alternative_reading
  - marker: b
    text: “罪恶的行为”原文也可按阳性复数理解为“罪人”；整句因而可译作“在罪人的种种行径和放纵无度的事上有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χείρ
  choice: 手
  rationale: 保留原文鲜明的身体意象；与“伸向那人”连用，在上下文中表达针对或出手对付之意。
- source_word: ἐν πρώτοις
  choice: 首先
  rationale: 主要按行动上的优先和急切理解，同时以脚注保留作时间性“起初”解的可能。
- source_word: ἐπʼ αὐτόν
  choice: 伸向那人
  rationale: 以现代汉语自然表达“手在/临到他身上”的意象，并在谴责伪善者的语境中保留敌对行动的意味。
- source_word: ὡς ἐν ζήλει
  choice: 仿佛出于热心
  rationale: ὡς使这种热心带有表象或姿态的意味，但不武断认定必为虚假。
- source_word: ἔνοχος
  choice: 有罪
  rationale: 准确保留原文司法和道德上的罪责含义。
- source_word: ποικιλίᾳ
  choice: 各样
  rationale: 自然传达多样、多种的意思，修饰后面按中性复数理解的罪恶行为。
- source_word: ἁμαρτωλῶν
  choice: 罪恶的行为
  rationale: 将两性形容词的属格复数在此理解为中性实体用法，即“罪恶之事/行为”；这与随后“放纵之事”在句法和语义上平行。
- source_word: ἀκρασίαις
  choice: 放纵之事
  rationale: 表达缺乏自制而陷入过度或纵欲的具体表现，同时保持复数意味。
theological_decisions:
- issue: ὡς ἐν ζήλει所指热心的真实性
  choice: 译作“仿佛出于热心”
  alternative: “出于热心似的”或“好像满有热心”
  rationale: 保留原文ὡς所形成的距离感以及对伪善的暗示，却不把文本明确化为纯粹假装。
- issue: ἁμαρτωλῶν的语法身份
  choice: 按中性复数实体化形容词理解为“罪恶的行为”
  alternative: 按阳性复数理解为“罪人”，译作“罪人的种种行径”
  rationale: 中性解释更直接地描述此人自身所犯的多种罪恶，并与复数ἀκρασίαις平行；但希腊词形本身容许阳性分析，故在脚注说明。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“他的手首先伸向那人”保留原文意象，也让普通读者能理解其急于出手针对别人的含义；后半句用“各样罪恶的行为、放纵之事”呈现压缩的希腊结构，并保留道德与司法语气。
