translation:
  language: zh_hans
  text: 他的话语是诡辩，用来实现不义之人的欲望[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诡辩”或译“谬误的推理”或“欺骗性的推理”。
    reason: lexical_alternative
  - marker: b
    text: “不义之人的欲望”也可译作“对不义之事的欲望”；希腊语“不义的”在此可指人，也可指事。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: λόγοι
  choice: 话
  rationale: 直译为“话”，具体指此人所说的言语；比“言论”更自然，也不额外限定为正式演说。
- source_word: παραλογισμοί
  choice: 诡辩
  rationale: 该词可指错误、欺骗性的推理。“诡辩”简洁地保留其推理层面和欺骗色彩；“谬论”则较侧重错误结论。
- source_word: εἰς πρᾶξιν
  choice: 为要……付诸实行
  rationale: εἰς在此表达目的或趋向，πρᾶξις指实行、行动；这一译法自然地表明这些话服务于实际施行。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: 该词泛指强烈愿望或欲求，语境中带负面意味，但不必收窄为性方面的“情欲”。
- source_word: ἀδίκων
  choice: 不义之人的
  rationale: 将复数属格形容词按阳性实词化理解，指“不义的人”；此读法与英语审校层一致，同时以脚注保留中性复数“对不义之事”的语法可能。
theological_decisions:
- issue: ἀδίκων是指不义的人，还是不义的事
  choice: 正文采用“不义之人的”，即把ἀδίκων理解为阳性复数属格。
  alternative: 也可理解为中性复数属格，译作“对不义之事的欲望”。
  rationale: 希腊词形本身可作阳性或中性复数属格，单凭本句不能完全消除歧义。正文采用有古译审校支持且语义通顺的人称读法，但不把另一种读法静默排除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“付诸实行”保留原文从言语、推理走向行动的目的关系；不用过度技术化的逻辑术语。
