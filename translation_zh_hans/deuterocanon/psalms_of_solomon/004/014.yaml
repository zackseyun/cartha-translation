  text: He reasoned falsely in words[a], “There is no one who sees and judges.”
translation:
  language: zh_hans
  text: 他用言语作出错误的推断[a]：“没有人看见并审判。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他用言语自欺。”
    reason: παρελογίσατο可侧重错误推理，也可表达自欺；脚注保留其可能的反身含义。
lexical_decisions:
- source_word: παρελογίσατο
  choice: 作了错误的推断
  rationale: 该动词可指错误、虚妄或带欺骗性的推理。“作了错误的推断”保留其认知层面的含义，同时不擅自断定他是在自欺还是欺骗别人。
- source_word: ἐν λόγοις
  choice: 用言语
  rationale: 介词短语说明这种错误推断借着言语表达或形成；“用言语”在现代汉语中自然，也保留原文对言语的强调。
- source_word: ὁρῶν
  choice: 察看
  rationale: 现在分词在此作名词性用法，与κρίνων共享未明说的主体；“察看”既表达持续关注，也适合潜在的道德监督语境。
- source_word: κρίνων
  choice: 审判
  rationale: 该词与“察看”并列，具有判断、裁断的意味；“审判”保留其道德及司法分量。
theological_decisions:
- issue: 分词ὁρῶν和κρίνων的隐含主体
  choice: 没有谁察看并审判
  alternative: 他不察看，也不审判
  rationale: 希腊文最自然地否认有任何察看者和审判者，却没有直接点明上帝。译文保留这种含蓄，不把未明说的神圣主体添加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“察看并审判”保持两个现在分词的并列关系；引号呈现ὅτι所引出的思想或说法。
