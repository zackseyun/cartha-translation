lexical_decisions:
- source_word: ἐκκόψαισαν
  choice: 愿……啄出
  rationale: 不定过去时祈愿语气表达愿望或咒诅；“愿”自然传达其语气，“啄出”既符合乌鸦的动作，也保留原文强烈的暴力意象。
- source_word: κόρακες
  choice: 乌鸦
  rationale: κόραξ通常指渡鸦；现代汉语日常用语中“乌鸦”是自然且易懂的对应，也保留食腐鸟类的鲜明意象。
- source_word: ὀφθαλμοὺς
  choice: 眼睛
  rationale: 采用该词的常规义；不译作更具血腥感的“眼珠”，以免强化原文。
- source_word: ὑποκρινομένων
  choice: 伪善者
  rationale: 该分词指装假、佯装或掩饰真实意图的人；“伪善者”简洁自然，但原词也可宽泛地理解为“装假者”。
