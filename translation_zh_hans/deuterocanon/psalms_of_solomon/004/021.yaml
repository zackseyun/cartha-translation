  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: zh_hans
  text: 愿讨好人的人的肉被野兽撕得四散；愿不法之人的骨头在日光之下受辱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: 愿……被……撕散
  rationale: 不定过去时被动祈愿式在此表达咒愿；“愿”保留祈愿语气，“撕散”结合野兽施事，传达肢体被扯碎散落的具体意象。
- source_word: σάρκες
  choice: 肉
  rationale: 直译身体的血肉，保留原文粗粝而具体的刑罚图景，不泛化为“身体”。
- source_word: ἀνθρωπαρέσκων
  choice: 讨人喜欢之人
  rationale: 该复合词指以取悦人为导向的人；此译自然、庄重，也保留属格复数的泛指意义。
- source_word: ὑπὸ θηρίων
  choice: 被野兽
  rationale: θηρία在此指会吞噬尸身的凶猛野生动物，“野兽”简洁而准确。
- source_word: ὀστᾶ（所给电子文本作 οὐτὰ）
  choice: 尸骨
  rationale: 据Swete版面实际读文及平行结构，应为ὀστᾶ“骨头”；“尸骨”在汉语中明确承接曝尸受辱的语境。
- source_word: παρανόμων
  choice: 不法之人
  rationale: 保留παράνομος违反律法、越法而行的道德—法律含义，避免仅泛化为“恶人”。
- source_word: κατέναντι τοῦ ἡλίου
  choice: 在日光之下
  rationale: 原短语字面为“在太阳面前”，语境强调尸骨公开暴露；现代汉语以“在日光之下”自然传达这一意象。
- source_word: ἐν ἀτιμίᾳ
  choice: 蒙受羞辱
  rationale: ἀτιμία表示失去尊荣、陷于耻辱；“蒙受羞辱”适合尸骨被公开曝露的结果状态。
