review_pass:
  verdict: revise
  source_fidelity: 需修订。现译前半的咒愿语气及“肉／野兽”意象基本可取，但“讨人喜欢之人”在现代汉语通常意为“惹人喜爱的人”，方向与ἀνθρωπαρέσκων（取悦、讨好他人者）相反或至少严重含混。更重要的是，后半的“他们的尸骨”将“骨头”误指回前半的讨好人者；希腊文明确为“非法之人／不法之人”的骨头。
  naturalness: “愿……被……”适合咒愿体。“讨好人的人”比“讨人喜欢之人”准确自然。后半改为“愿不法之人的骨头在日光之下受辱”，既保留原文省略的系词结构与诗体，也使主语和属格关系明确。
  terminology: “不法之人”恰当表达παράνομος的违法、悖法含义；“骨头”直接对应ὀστᾶ，不以“尸骨”额外强化为遗骸。“日光之下”自然传达κατέναντι τοῦ ἡλίου所强调的公开曝露；“受辱”对应ἐν ἀτιμίᾳ。
  issues:
  - severity: high
    issue: “讨人喜欢之人”误导ἀνθρωπαρέσκων的语义方向。
    rationale: 现代汉语“讨人喜欢”通常是“令人喜欢、惹人喜爱”，不是“试图取悦人”。原文指讨好、取悦他人的人。
  - severity: high
    issue: “他们的尸骨”错误地将后半主语归属给前半的“讨人喜欢之人”。
    rationale: παρανόμων是ὀστᾶ的属格修饰语，原文说的是“不法之人的骨头”，并非前句所述之人的尸骨。
  revised_text: 愿讨好人的人的肉被野兽撕得四散；愿不法之人的骨头在日光之下受辱。
