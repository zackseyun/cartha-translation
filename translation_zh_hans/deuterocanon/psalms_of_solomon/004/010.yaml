base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/010.yaml
  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
translation:
  language: zh_hans
  text: 他们的眼睛盯着一个安稳富足[a]之人的家[b]，如同蛇一般，要用不法之人的言语破坏彼此的智慧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安稳富足”也可译作“安定”“稳固”或“安康”；原词主要表示稳定、稳妥的状态，在这里也可能包含境况兴旺之意。
    reason: lexical_alternative
  - marker: b
    text: “家”也可指“家室”“家业”或“宅第”，不一定只指房屋建筑。
    reason: lexical_alternative
  - marker: c
    text: “破坏”也可译作“瓦解”“拆散”或“推翻”；“智慧”也可理解为“见识”或“谋略”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 他们的眼睛
  rationale: 保留原文鲜明的身体意象和指控语气；“盯着”自然表达目光落在目标上的含义。
- source_word: ἐπʼ οἶκον ἀνδρὸς
  choice: 盯着一个……之人的家
  rationale: 贴近原文，同时让现代汉语句式自然；“家”仍可兼指家庭、家业或宅第。
- source_word: ἐν εὐσταθείᾳ
  choice: 安稳富足
  rationale: εὐστάθεια首先含稳固、安定之意，语境中也可涉及境况良好、兴旺；并列译法避免只取“富足”而丢失稳固的基本语义。
- source_word: ὡς ὄφις
  choice: 如同蛇一般
  rationale: 保留原文的蛇之比喻及其潜伏、伺机侵害的形象，不额外解释其象征意义。
- source_word: διαλῦσαι
  choice: 要……破坏
  rationale: 不定式表示目的；“破坏”可涵盖拆散、瓦解或推翻，又不必断言彻底毁灭。
- source_word: σοφίαν ἀλλήλων
  choice: 彼此的智慧
  rationale: 保留σοφία的“智慧”以及ἀλλήλων的相互性，不将其具体化为某一种谋略或判断力。
- source_word: ἐν λόγοις παρανόμων
  choice: 用不法之人的言语
  rationale: παρανόμων是属格复数的名词性用法，意为“不法之人的”，并非与λόγοις同格的形容词；此译准确反映希腊语法。
theological_decisions:
- issue: “彼此”所指对象并不明确
  choice: 保留“彼此的智慧”
  alternative: 他们相互间的谋略／别人的智慧
  rationale: 原文ἀλλήλων明确具有相互性，但本节本身没有充分说明参与者范围；直译可保留这种含混，避免擅自指定对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“眼睛”“蛇”“彼此的智慧”等原文意象和张力；将属格复数παρανόμων准确译为“不法之人的”，不沿用语法上不确切的“不法的言语”。
