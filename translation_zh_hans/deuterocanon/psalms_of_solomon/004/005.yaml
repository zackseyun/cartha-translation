  yaml_path: translation/deuterocanon/psalms_of_solomon/004/005.yaml
  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
translation:
  language: zh_hans
  text: 夜间，他在隐秘之处[a]犯罪，仿佛无人看见；他用眼睛向每个女人说话[b]，图谋恶事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在隐藏之地”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他用眼睛说话”，形容不用言语而以眼神暗示。
    reason: cultural_note
  - marker: c
    text: 也可译：“在邪恶的计谋中”或“参与邪恶的密谋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νυκτί
  choice: 夜间
  rationale: 自然表达时间，也保留借黑夜遮掩行事的语感。
- source_word: ἐν ἀποκρύφοις
  choice: 在隐秘之处
  rationale: 希腊文为复数名词性结构，较可能指隐蔽的地点，而不只是抽象地表示“暗中”。
- source_word: ἁμαρτάνει
  choice: 犯罪
  rationale: 直接保留该动词的道德与宗教分量；在此语境中，“犯罪”比“做错事”更准确有力。
- source_word: ὡς οὐχ ὁρώμενος
  choice: 仿佛无人看见
  rationale: 保留ὡς的比较语气，同时用自然中文表达此人自以为不被察觉。
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: 他用眼睛……说话
  rationale: 保留原文鲜明的身体意象，不直接将其解释为眨眼、示意或调情。
- source_word: πάσῃ γυναικί
  choice: 向每个女人
  rationale: 保留πάσῃ的逐一、无一例外之意，并按中文“说话”的自然搭配补出“向”。
- source_word: ἐν συνταγῇ κακίας
  choice: 图谋恶事
  rationale: συνταγή可指安排、筹划或计谋；此译以自然中文传达蓄意策划邪恶之事的含义，同时在脚注保留结构和其他词义可能。
