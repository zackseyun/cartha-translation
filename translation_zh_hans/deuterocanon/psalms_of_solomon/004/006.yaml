translation:
  language: zh_hans
  text: 他迅速进入每一家，带着欢喜，仿佛无辜的人一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺς εἰσόδῳ
  choice: 急忙进到
  rationale: 该表达直指迅速进入；用“急忙进到”保留动作的快捷，也符合现代汉语表达。
- source_word: εἰς πᾶσαν οἰκίαν
  choice: 每一家
  rationale: πᾶσαν 表示“每一个/所有”，οἰκίαν 在此指住宅或人家；“每一家”自然简洁。
- source_word: ἱλαρότητι
  choice: 满面欢喜
  rationale: 该词表示愉快、欢悦的神态；结合进入人家的场景，译作“满面欢喜”比抽象的“带着欢快”更自然，同时未增添善意等未明说的含义。
- source_word: ὡς ἄκακος
  choice: 仿佛清白无辜
  rationale: ὡς 在此呈现外在表现与真实身份之间的比较张力，宜译“仿佛”；ἄκακος 可指无恶意、无害或无辜，语境中“清白无辜”准确传达其伪装出来的形象。
theological_decisions:
- issue: ὡς 是否断言此人确实无辜
  choice: 仿佛清白无辜
  alternative: 像清白无辜的人一样
  rationale: 上下文语气将其刻画为表现得无辜，而非确认其本质无辜；“仿佛”保留这种表象与实情之间的张力，不把明喻误作事实判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；主语依上下文补作“他”，使汉语句子完整。无脚注标记。
