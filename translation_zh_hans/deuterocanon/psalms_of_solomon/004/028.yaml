  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: zh_hans
  text: 愿上帝除掉那些狂傲地行一切不义的人[a][b]，因为主我们的上帝是伟大而有能力的审判者，按公义施行审判[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切不义”也可译作“各种不义”或“一切不公之事”。
    reason: lexical_alternative
  - marker: b
    text: 开头的希腊语形式直译近于“上帝除掉……”，在这里表达愿望或祈求，所以译作“愿上帝除掉……”。
    reason: alternative_reading
  - marker: c
    text: “按公义施行审判”也可译作“按公正审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  choice: 愿……除掉
  rationale: 虽为不定式，但在祈愿语境中表达愿望或咒诅式祈求；“愿……除掉”自然保留其语气，又不把动作强化为“毁灭”。
- source_word: τοὺς ποιοῦντας
  choice: 那些……行……的人
  rationale: 分词指以此为持续或典型行为的人；此译简洁自然。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 狂傲地
  rationale: 以现代汉语副词结构自然表达行为的方式，同时保留其强烈的负面道德意味。
- source_word: πᾶσαν ἀδικίαν
  choice: 一切不义
  rationale: “不义”保留ἀδικία宽广的道德与司法内涵；“一切”直接对应πᾶσαν，并保留其可能指总体或各种表现的空间。
- source_word: κριτὴς
  choice: 审判者
  rationale: 此处司法含义明显，并与上帝按公义审判的下文相合。
- source_word: μέγας καὶ κραταιὸς
  choice: 伟大而有能力的
  rationale: “伟大”对应μέγας；“有能力”清楚表达κραταιός的强有力，不使用生硬或可能偏向体力的措辞。
- source_word: Κύριος
  choice: 主
  rationale: 作为上帝的称号，采用现代中文圣经语体中通行而庄重的译法。
- source_word: ἐν δικαιοσύνῃ
  choice: 按公义施行审判
  rationale: 结合κριτής补出汉语所需的谓语关系，表明上帝的审判以公义为准则，同时保留δικαιοσύνη的道德广度。
theological_decisions:
- issue: 司法语境中δικαιοσύνη的译法
  choice: 公义
  alternative: 正义；公正
  rationale: “公义”既适合上帝审判的语境，也保留该词超出司法程序的道德广度；脚注说明“按公正”这一较窄的司法性理解。
- issue: ἐξᾶραι所表达的祈愿或咒诅语气
  choice: 愿上帝除掉
  alternative: 上帝除掉；求上帝剪除
  rationale: “愿”清楚表达上下文中的祈愿力量，却不把“除去”过度具体化为暴力毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与审判语体。“狂傲地”比名词式“在狂傲中”更符合自然汉语；末句适度补出“施行审判”，使ἐν δικαιοσύνῃ与“审判者”的关系在中文中清晰，但不缩窄其神学含义。
