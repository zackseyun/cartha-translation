base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/009.yaml
  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: zh_hans
  text: 愿虔诚人宣明他们的上帝所作的判决是公正的：当罪人从义人面前被除去时——就是那说使人喜欢的话、只带着诡诈的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文先用复数“罪人”，随后却转为单数“那……的人”；这可能是用单数概括罪人的特征。现存文本的句法较为拗口。
    reason: alternative_reading
  - marker: b
    text: “从义人面前”也可译作“从那位义者面前”或“离开义人的所在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: 虔诚人
  rationale: 此处指敬虔的人，并非圣物或天使；“虔诚人”自然地保留其宗教与道德含义。
- source_word: δικαιώσαισαν
  choice: 愿……宣明……是公正的
  rationale: 不定过去时祈愿式表达愿望；以 κρίμα 为宾语时，意思是承认、表明上帝的判决公正，而非使其成为公义。
- source_word: κρίμα
  choice: 判决
  rationale: 突出司法语境，并与“宣明……是公正的”自然搭配。
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: 当……被除去时
  rationale: 将带冠词的不定式结构理解为时间关系，同时保留被动、事件性的含义。
- source_word: ἀπὸ προσώπου δικαίου
  choice: 从义人面前
  rationale: 保留 ἀπὸ προσώπου 的临在性表达，并将单数 δικαίου 译作代表性单数“义人”。
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: 讨人喜欢之话
  rationale: 将中性单数 ἀρέσκον 理解为 λαλοῦντα 所说的内容，即“使人喜欢的事/话”；中文以“讨人喜欢之话”清楚表达。
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: 那只用诡诈说……的人
  rationale: 保留单数分词对前述复数“罪人”的概括性刻画，并让 μόνον 与 μετὰ δόλου 相联，表达“只以诡诈的方式”。
theological_decisions:
- issue: 义人是个体还是称号
  choice: 义人
  alternative: 那位义者
  rationale: 希腊文 δικαίου 可指一名义人，也可作较抽象或称号式表达；正文采用普通的代表性单数，不将其特定化为某一位人物。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“宣明……是公正的”展开司法含义，避免“称义判决”等可能产生歧义的表达；破折号保留希腊文末尾单数描述与复数“罪人”之间突兀但重要的衔接。
