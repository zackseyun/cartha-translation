revisions:
- from: 愿虔诚人宣明他们上帝的判决是公正的：当罪人从义人面前被除去时——就是那只用诡诈说讨人喜欢之话的人。[a][b]
  to: 愿虔诚人宣明他们的上帝所作的判决是公正的：当罪人从义人面前被除去时——就是那说使人喜欢的话、只带着诡诈的人。[a][b]
  rationale: 修订仅改善中文的属格表达和末句的修饰关系。“说使人喜欢的话”按中性分词ἀρέσκον理解为所说的内容；“只带着诡诈”反映μόνον与μετὰ δόλου的关联。保留破折号和脚注，以标示“罪人”（复数）与末尾单数分词之间的传承文本歧异。
