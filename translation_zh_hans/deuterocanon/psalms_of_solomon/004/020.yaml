lexical_decisions:
- source_word: μονίᾳ
  choice: 孤苦伶仃
  rationale: 该词表示独处、孤立的境况；在咒诅语境中，“孤苦伶仃”自然传达晚年无人相伴的凄凉，同时不把它误解为空间上的独居。
- source_word: ἀτεκνίας
  choice: 无儿无女
  rationale: 该词特指没有子女；“无儿无女”比抽象的“无子女状态”更符合现代汉语，也贴合家庭受审判的语境。
- source_word: γῆρας
  choice: 晚年
  rationale: 指年老这一人生阶段；“晚年”在本句中比“老年”更自然庄重。
- source_word: εἰς ἀνάλημψιν
  choice: 直到被取去
  rationale: ἀνάλημψις表示被取走、移去。介词短语本身可理解为指向被取去的结局；译作“直到被取去”使汉语通顺，但不明说所指必然是死亡。
- source_word: '[implicit imprecatory force]'
  choice: 愿……
  rationale: 希腊文本为无动词名词句，但上下文延续祈求审判的咒诅语气，因此以“愿”补出隐含的祈愿力量。
theological_decisions:
- issue: 无动词分句应译为祈愿还是陈述
  choice: 译作咒诅性的祈愿：“愿他……”
  alternative: 译作中性描述：“他的晚年……”
  rationale: 上下文是一连串求审判的祈愿；补出“愿”可忠实保留本句承接而来的祈使／祈愿语力。
- issue: εἰς ἀνάλημψιν是否明确指死亡
  choice: 保留“被取去”的含蓄表达
  alternative: 明确译作“直到死去”或较字面的“为了被移去”
  rationale: 原词可暗指死亡，却没有明说；因此不在正文中消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无儿无女，孤苦伶仃”以自然汉语重现ἐν μονίᾳ ἀτεκνίας的整体处境；保留咒诅语气及末语的语义张力。
