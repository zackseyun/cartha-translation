  yaml_path: translation/deuterocanon/psalms_of_solomon/004/023.yaml
  text: For he has laid waste many people’s households in disgrace[b][a], and scattered them by lust.
translation:
  language: zh_hans
  text: 因为他使许多人的家户蒙羞而荒凉[b]，又因私欲使他们四散[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “私欲”也可译作“欲望”或“情欲”。
    reason: lexical_alternative
  - marker: b
    text: “家户”原文直译为“房屋”，这里也可能包括整个家庭或家户。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: 使……荒凉
  rationale: 保留动词“使荒废、使凄凉”的强烈意味，不弱化为一般性的损害。
- source_word: οἴκους
  choice: 家室
  rationale: οἴκους字面可指房屋，也可延伸指家庭或家户；“家室”兼顾居所与家庭群体的含义。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: 采用泛指表达，不无根据地限定为男性。
- source_word: ἐν ἀτιμίᾳ
  choice: 蒙羞
  rationale: 传达不名誉、受羞辱的社会与道德意味，并与中文句法自然结合。
- source_word: ἐσκόρπισεν
  choice: 使他们四散
  rationale: 保留“驱散、使分散”的核心图像；补出“他们”以使中文宾语明确，同时按上下文指向许多人的家室。
- source_word: ἐπιθυμίᾳ
  choice: 因私欲
  rationale: ἐπιθυμία本可泛指欲望，但此处与羞辱、毁坏并列，负面意味较强；“私欲”保留道德贬义，又不把含义收窄到纯粹性欲。
theological_decisions:
- issue: ἐπιθυμίᾳ的道德范围
  choice: 私欲
  alternative: 欲望；情欲
  rationale: 原词可以宽泛地表示欲望，也可在负面语境中表示贪欲或情欲。“私欲”适合本节负面语境，却不武断限定为性方面的欲望；脚注保留较宽译法。
- issue: 两个动词的主语及第二分句的受事者
  choice: 沿用阳性单数“他”为主语，并以“他们”承接前述受害群体
  alternative: 不补第二分句宾语，译作“又因私欲驱散”
  rationale: 希腊文两个动词均为第三人称单数，主语承接上下文；第二动词未明示宾语。中文补出“他们”有助理解，但不进一步界定究竟是家庭成员还是家户整体。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“蒙羞荒凉”紧凑呈现ἐν ἀτιμίᾳ与ἠρήμωσεν的关系；脚注标记均置于正文相关词语之后。
