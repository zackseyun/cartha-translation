  yaml_path: translation/deuterocanon/psalms_of_solomon/004/016.yaml
  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
translation:
  language: zh_hans
  text: 主啊，愿他所分得的份[a]在你面前受羞辱，出去时哀叹，进来时受咒诅[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所分得的份”也可译作“命分”或“份额”。
    reason: lexical_alternative
  - marker: b
    text: “受咒诅”直译为“在咒诅中”。
    reason: lexical_alternative
  - marker: c
    text: “出去”和“进来”构成一组圣经式对语，可能概括一个人的一切行动或整个生活历程。
    reason: cultural_note
lexical_decisions:
- source_word: γένοιτο
  choice: 愿……
  rationale: 以“愿”表达希腊语祈愿式的祷告和咒愿语气，而非将其弱化为对未来的陈述。为使汉语自然，在后两个并列成分前补出一次“愿”，仍视为同一祈愿统摄全句。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是对上主的直接呼告；“主啊”符合现代汉语祷告语体。
- source_word: μερὶς
  choice: 所得的份
  rationale: 既保留“份额”的基本意义，也可承载所分得的际遇或结局之意；脚注注明“命分”这一可能表达。
- source_word: ἀτιμίᾳ
  choice: 羞辱
  rationale: 保留抽象名词的道德和公开受辱色彩；“尽是”自然表达处于羞辱中的状态。
- source_word: ἔξοδος
  choice: 出去时
  rationale: 与“进来时”构成有意的对举，保留圣经式“出入”表达，而不收窄为某一次离开。
- source_word: στεναγμοῖς
  choice: 唉声叹息
  rationale: 自然表达复数 στεναγμοῖς 所指反复或持续的呻吟、叹息。
- source_word: εἴσοδος
  choice: 进来时
  rationale: 与“出去时”形成直接对照，不擅自解释为归家或最终结局。
- source_word: ἀρᾷ
  choice: 落在咒诅之下
  rationale: 自然表达 ἐν ἀρᾷ 所描述的受咒诅状态；脚注保留较贴近字面的“在咒诅中”。
theological_decisions:
- issue: 咒愿式祷告的语力
  choice: 译为直接向主发出的祈愿，求恶人受羞辱、叹息和咒诅。
  alternative: 译为对恶人结局的平直预言。
  rationale: 祈愿式 γένοιτο 与呼格 Κύριε 共同表明这是祷告中的愿望，而不只是预告；译文不淡化原文的审判张力。
- issue: “出去／进来”的涵盖范围
  choice: 正文保留具体对举，并以脚注说明它可能概括整个人的行动或生活历程。
  alternative: 正文直接意译为“他一生的一切行动”。
  rationale: 原文保留具象而可能具有惯用含义的两极表达；不在正文中排除其字面意义。
translation_notes:
  register: 采用庄重但可直接理解的现代标准汉语。“主啊，愿……”保留祷告语体；“唉声叹息”和“落在咒诅之下”避免生硬的希腊语介词结构。分号显示单一祈愿之下三个并列结果，同时不把后两项误读为独立陈述。
