  text: His eyes are on every woman without distinction[c][b][a]; his tongue is deceitful in a transaction with an oath.
translation:
  language: zh_hans
  text: 他的眼目盯着每一个女人，不加分别[a]；在交易中，他的舌头满是虚假，还带着誓言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毫无节制”。希腊语也可能强调他的目光不受约束，而非单指他对所有女人不加区别。
    reason: 保留ἄνευ διαστολῆς在“不加分别”与“毫无节制”之间的词义和语境歧义。
  - marker: b
    text: “交易”也可译作“协议”或“契约”。
    reason: συνάλλαγμα可涵盖一般交易和较正式的协议；正文不宜过度限定。
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: 他的眼目盯着每一个女人
  rationale: 希腊文是省略系词的身体部位主语表达，描写他的目光朝向所有女人。“眼目盯着”保留具体意象，并以自然中文传达持续注视的意味；“每一个”保留 πᾶσαν 的周遍范围。
- source_word: ἄνευ διαστολῆς
  choice: 毫无分别
  rationale: διαστολή 的基本义涉及区分、分别；此处可指他不加分辨地看所有女人。正文采用较贴近词义且不预先判定具体心理状态的译法，另将语境上可能的“毫无节制”列入脚注。
- source_word: ἡ γλῶσσα ψευδὴς
  choice: 他的舌头满是虚假
  rationale: 保留希腊文以“舌头”指言语的具体比喻；“满是虚假”自然表达谓语形容词 ψευδής 所描述的欺假性质，而不把它窄化为一次具体谎言。
- source_word: ἐν συναλλάγματι
  choice: 在……交易中
  rationale: συνάλλαγμα 可指交易、协议或契约。正文用范围较宽且现代读者易懂的“交易”，避免无充分依据地限定为正式法律合同。
- source_word: μεθʼ ὅρκου
  choice: 有誓言为证的
  rationale: μετά 与属格表示伴随，说明该交易伴有誓言。“有誓言为证”在中文中自然地传达誓言参与并加强交易承诺的情形，同时不误解为法庭上的宣誓作证。
