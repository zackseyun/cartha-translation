  yaml_path: translation/deuterocanon/psalms_of_solomon/004/002.yaml
  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: zh_hans
  text: 言语过多，在外在炫示上胜过众人；他言辞严厉，要在审判中定罪罪人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要在审判中定罪”也可译作“以严厉言辞在审判中定罪”；希腊文不定式与前文的具体关系并不完全明确。
    reason: 保留κατακρῖναι与ὁ σκληρὸς ἐν λόγοις之间的句法歧义，避免正文过度解释。
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: 言语过多
  rationale: 保留περισσός所含“过度、超出常度”之意；“言语”自然对应λόγοις，也延续本句对说话方式的批评。
- source_word: περισσὸς ἐν σημειώσει
  choice: 外在的炫示
  rationale: σημείωσις在此语境中较可能指引人注目的外在表现或炫示；加“外在的”使现代汉语读者明白这不是单纯的记号，同时不把它具体化为某一种宗教行为。
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: 他言辞严厉
  rationale: σκληρός本义为“硬、严厉”，在言语语境中译作“言辞严厉”自然，并保留人物对他人苛刻的语气。
- source_word: κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει
  choice: 要在审判中定罪罪人
  rationale: κατακρῖναι明确含定罪、判罪之意；ἐν κρίσει直译为“在审判中”，不预先判定这是人的审判还是末后的审判。
theological_decisions:
- issue: ἐν κρίσει所指的审判性质
  choice: 在审判中
  alternative: 在末日审判中／凭判断
  rationale: 原文没有明确限定审判的主体或时间；采用宽泛表达，保留其可能指司法判断、道德论断或终末审判的张力。
- issue: κατακρῖναι不定式与ὁ σκληρός的关系
  choice: 他言辞严厉，要……定罪
  alternative: 他以严厉言辞……定罪
  rationale: “要”保留不定式可能表达倾向或目的的结构，而不把严厉言辞直接解释成定罪的工具。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现前两项对人物外在表现的描写与后半句定罪行为之间的推进关系；避免使用带特定宗派色彩的术语。
