base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: zh_hans
  text: 他们惹上帝发怒，又激怒他，使他把他们从那地除去[a]；因为他们以欺诈的手段装作无辜的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那地”也可译作“大地”或“地上”；“除去”在这里也可能含有彻底铲除的意味。
    reason: lexical_alternative
  - marker: b
    text: “无辜的人”直译为“无辜者的灵魂”，也可理解为“无辜的生命”或“无辜者”；“装作”也可译作“扮演无辜者的角色”。
    reason: alternative_reading
lexical_decisions:
- source_word: παρώργυσαν
  choice: 惹……发怒
  rationale: 该动词表示触怒、激起怒气；“惹上帝发怒”自然明确，也保留其道德分量。
- source_word: παρώξυναν
  choice: 激怒
  rationale: 该词承接并加强前一动词，后接不定式ἐξᾶραι，表达他们激怒上帝，以致他采取审判行动。
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: 把他们从那地除去
  rationale: ἐξαίρω可指移走、除去，在审判语境中可含毁灭意味；“除去”保留力度而不把含义限定为杀灭。“那地”按上下文处理定冠词，同时脚注保留“大地／地上”的可能。
- source_word: ψυχὰς ἀκάκων
  choice: 无辜的人
  rationale: ψυχή的复数可转指人或生命；ἀκάκων表示无恶意、无害或无辜者。正文采用现代汉语自然表达，脚注保留直译及其他可能。
- source_word: παραλογισμῷ
  choice: 以欺诈的手段
  rationale: 此处名词表示欺骗、诡计；该译法清楚呈现其方式意义。
- source_word: ὑπεκρίνοντο
  choice: 装作
  rationale: 该中间语态动词可表示扮演角色、假装或冒充；“装作”简明地传达虚假扮演的意味，并不额外引入后世对“假冒为善”的固定理解。
theological_decisions:
- issue: 上帝被激怒并采取除去人的行动
  choice: 保留两个递进的触怒动词及其与审判行动的因果联系
  alternative: 弱化为“他们得罪上帝，结果被赶走”
  rationale: 原文先后使用παροργίζω和παροξύνω，并以ἐξᾶραι说明所激起的行动；译文不应消解上帝发怒与审判之间的张力。
- issue: “从地除去”的范围与结果
  choice: 正文译作“从那地除去”，脚注说明也可指“从大地／地上除去”
  alternative: 明确译成“杀死他们”或“把他们逐出国土”
  rationale: γῆ既可指特定土地，也可指大地；ἐξαίρω虽可能暗含毁灭性审判，却未明确限定为死亡或流放，因此保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“惹……发怒，又激怒……”有意保留原文近义动词的递进重复；末句用“以欺诈的手段装作”呈现虚假扮演，同时避免生硬直译“灵魂”。
