  text: Blessed are those who fear the Lord in their innocence[a][b].
translation:
  language: zh_hans
  text: 以纯真[a]敬畏[b]主的人有福了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以无邪”，或“以纯正”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“敬畏”包含对主的尊崇和肃然之心，并非仅指害怕。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 采用汉语圣经智慧文学和祝福宣告中自然庄重的表达，保留原文祝福句式的宗教与伦理分量，而不弱化为单纯的快乐或幸运。
- source_word: φοβούμενοι
  choice: 敬畏
  rationale: “敬畏”既保留 φόβος 词族所含的畏惧意味，也自然表达人在主面前的尊崇与肃然态度，避免将其理解为单纯的惊恐。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在此是神圣称号；译作“主”符合上下文及现代汉语宗教文本的通行表达。
- source_word: ἐν ἀκακίᾳ αὐτῶν
  choice: 以纯真
  rationale: ἀκακία 指没有恶意、诡诈或邪念的状态。“以纯真”用简洁自然的汉语保留这种内在品格，并避免把原文限定为严格意义上的无罪或绝对无过。αὐτῶν 所表达的主体归属由汉语句法自然体现。
