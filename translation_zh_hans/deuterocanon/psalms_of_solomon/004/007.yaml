  yaml_path: translation/deuterocanon/psalms_of_solomon/004/007.yaml
  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: zh_hans
  text: 愿上帝除掉那些在虔诚人中间过着虚伪生活的人[a]；愿他在那人的肉体败坏和贫困中，取去他的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”也可译作“拔除”或“取去”；“虔诚人”也可译作“敬虔的人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在复数的“那些人”之后转用单数“他的”，并把“他的性命”列为“除掉／取去”的另一个宾语；原句结构紧缩，也可理解为描述他们在肉体朽坏和生活贫困中的处境。
    reason: grammar_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: 除掉／取去
  rationale: 此动词表示移走、除去。前半句译作“除掉”符合谴责语境，后半句因宾语是“性命”而译作“取去”，既自然又不擅自强化为具体的处决方式。
- source_word: ὑποκρίσει
  choice: 虚伪
  rationale: 表达假装、伪善的生活方式；“过着虚伪生活”在现代汉语中清楚自然，并保留道德宗教语域。
- source_word: ὁσίων
  choice: 虔诚人
  rationale: ὅσιοι在本书语境中指以敬虔为特征的一群人。“虔诚人”比“圣徒”更少带入后期教会称谓，也比泛称“圣洁的人”更能体现群体特征。
- source_word: ἐν φθορᾷ σαρκός αὐτοῦ
  choice: 在那人的肉体败坏……中
  rationale: φθορά可指败坏、朽坏；与σάρξ连用时保留身体层面的含义。“肉体”贴近原词，单数“那人的”保留希腊文由复数群体转回单数个体的突变。
- source_word: πενίᾳ
  choice: 贫困
  rationale: 直接表达缺乏、穷困，保持原文简短而严厉的语气。
- source_word: τὴν ζωὴν αὐτοῦ
  choice: 取去他的性命
  rationale: 该短语为宾格，可视作ἐξάραι的第二个宾语。译文补出动词以使汉语句法清楚，并保留原文单数代词，而不顺化为“他们的生命”。
theological_decisions:
- issue: 开头不定式ἐξάραι的语气
  choice: 译为祈愿：“愿上帝除掉……”
  alternative: 可理解为陈述“上帝除掉……”或依附上下文的目的／结果不定式
  rationale: 本节谴责性的上下文最自然地支持祈愿或咒诅式表达；译文用“愿”呈现其功能，同时不把它改成确定事实陈述。
- issue: 末句τὴν ζωὴν αὐτοῦ的句法关系
  choice: 视为ἐξάραι的第二个直接宾语：“取去他的性命”
  alternative: 也可把整段理解为仅描述这类人在肉体败坏和生活贫困中的处境
  rationale: 宾格τὴν ζωὴν支持第二宾语的分析；保留这一较生硬、严厉的结构，也符合近期源文审校意见。
- issue: 复数群体后转用单数αὐτοῦ
  choice: 保留为“那人／他的”
  alternative: 按集合或分配意义顺化为“他们／他们的”
  rationale: 原文两次明确使用单数属格，可能重新聚焦于这类人中的典型个体。译文不抹平这一有意或至少真实存在的数变化。
translation_notes:
  register: 采用庄重而现代的祈愿语体。“过着虚伪生活”避免文言化，“虔诚人”避免把ὅσιοι术语化为后期教会称号。分号和第二个“愿”用于展开希腊文紧缩句法；单数“那人／他的”则刻意保留源文从复数转为单数的张力。
