base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/001.yaml
  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: zh_hans
  text: 你这亵渎者，为何坐在虔敬的议会[a]中，而你的心已经远离了主，还用格言[b]激怒以色列的神？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁的议会”或“神圣的议会”。
    reason: ὅσιος可指敬虔、圣洁或神圣；此处修饰“议会”，原文未说明议会成员的身份。
  - marker: b
    text: 或译：“用箴言式的话”、“用譬喻”或“用讥诮之言”。
    reason: παροιμία通常指格言、箴言式或隐晦的话；在本句语境中也可能带有讥刺意味。
lexical_decisions:
- source_word: βέβηλε
  choice: 亵渎者
  rationale: 该呼格直斥此人为不敬、沾染世俗而与神圣相悖的人；“亵渎者”保留了它与“虔敬的议会”之间的强烈反差。
- source_word: συνεδρίῳ ὁσίῳ
  choice: 虔敬的议会
  rationale: συνέδριον指共同就座议事的会众或议会；ὅσιος侧重对神虔敬、合乎敬虔，而不与通常译作“圣”的ἅγιος混同。
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: 你的心却已经远离了
  rationale: ἀφίστημι的完成时表达离开后持续处于疏远状态；“已经远离”兼顾动作及其现存结果。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 此处κύριος明确指神，按现代中文圣经惯用语译作“主”。
- source_word: ἐν παροιμίαις
  choice: 用俗语
  rationale: παροιμία可指俗谚、格言、譬喻或带讥刺意味的话；正文采用较直接且宽泛的“俗语”，不把语境中的讥诮意味确定为唯一解释。
- source_word: παροργίζων
  choice: 激怒
  rationale: 该分词表示招致愤怒；“激怒”在中文中简洁明确，并自然承接宾语“以色列的神”。
theological_decisions:
- issue: ὅσιος是否译为通常意义的“圣”
  choice: 虔敬的
  alternative: 圣洁的
  rationale: ὅσιος在此更突出敬虔、忠于神的性质；译作“虔敬的”既避免与ἅγιος的常见译法混同，也不额外引入特定群体身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。全句保留希腊文反问结构，以“却”和“还”呈现外在坐席与内心远离之间的张力，以及随后持续激怒神的行为。
