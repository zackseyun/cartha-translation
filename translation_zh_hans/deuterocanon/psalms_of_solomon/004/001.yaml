  text: Ἵνα τί σύ, βέβηλε, κάθησαι ἐν συνεδρίῳ ὁσίῳ, καὶ ἡ καρδία σου μακρὰν ἀφέστηκεν ἀπὸ τοῦ κυρίου, ἐν παροιμίαις παροργίζων τὸν θεὸν Ἰσραήλ;
