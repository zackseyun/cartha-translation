  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: zh_hans
  text: 他被这种不法充满；他的眼目盯着另一家[a]，要用毫不迟疑的话[b]毁灭那一家。他的心在这一切事上仍不满足，如同阴间[c]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一家”也可译作“另一所房子”或“另一个家庭”。希腊词οἶκος可指房屋，也可指一家人及其家庭领域。
    reason: lexical_alternative
  - marker: b
    text: “毫不迟疑的话”所对应的希腊短语较难确定，也可能意为“毫不耽搁的话”、“不容推延的话”或“不肯收敛的话”。
    reason: alternative_reading
  - marker: c
    text: “阴间”译自ᾅδης；也可译作“死者之境”或音译为“哈得斯”。这里的比较突出其不能满足的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ
  choice: 他充满了这种不法
  rationale: 保留被动语态所表达的“被充满、充斥”之意，并以“不法”对应 παρανομία，体现违背律法或正当秩序，而不泛化为一般的邪恶。
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: 他的眼睛盯着
  rationale: 原文直译为“他的眼睛在……上”，语境含有注视并图谋的意味；“盯着”在现代汉语中自然地保留这种定向而持续的目光。
- source_word: οἶκον ἕτερον
  choice: 另一家
  rationale: οἶκος 可指房屋，也可指一家人或家庭领域；“另一家”在中文中兼具家庭与居所的可能含义，避免过早限定。
- source_word: ὀλοθρεύσαι
  choice: 要……毁掉它
  rationale: 不定式表达敌意目的；“毁掉”保留该动词强烈的毁灭意味。
- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: 用毫不迟疑的话
  rationale: ἀνυπέρθεσις 所构成的罕见短语可能表示不推延、不迟疑或不容缓期；正文采用较贴近构词意义且通顺的“毫不迟疑”，并以脚注保留其他可能。
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: 他的心……仍不满足
  rationale: ἐμπίπλαμαι 表示吃饱、得到满足；ψυχή 在此指人的内在欲求。“心”比“灵魂”更符合现代汉语，同时没有把它具体解释成某一种欲望。
- source_word: ὡς ᾅδης
  choice: 如同阴间一样
  rationale: ᾅδης 指死者所在之境；“阴间”是现代中文清楚而非专名化的对应，也保留其在比喻中永不满足的形象。
theological_decisions:
- issue: ᾅδης 的译法及比喻所指
  choice: 阴间
  alternative: 坟墓；哈得斯
  rationale: 原文使用希腊词 ᾅδης，而非单指一座坟墓；“阴间”既保留死者之境的概念，也不把经文导向某一特定宗派的来世体系。正文不明说“永不满足”，让比较本身保留原文的含蓄张力。
- issue: ψυχή 的语境意义
  choice: 心
  alternative: 灵魂；欲望
  rationale: “灵魂”在现代中文容易引入较固定的神学或哲学含义，“欲望”则会把语义解释得过窄；“心”自然地指向此人的内在生命与欲求。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号保留前两项恶行之间的紧密联系，句号则突出末句关于永不满足的总结。正文尽量贴近希腊文，同时用脚注说明 οἶκος、ἀνυπέρθεσις 短语及 ᾅδης 的真实歧义。
