  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
translation:
  language: zh_hans
  text: 他不停手，直到成功把他们驱散，使他们如同孤儿一般[a]；他因不法的欲望，使一家荒凉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们如同孤儿一般”也可译作“仿佛使他们陷于丧亲之痛”或“如同在无父者当中”。希腊原文的表达较为罕见。
    reason: lexical_alternative
  - marker: b
    text: “一家”所译的词也可指“一所房屋”；结合上下文，这里很可能兼指整个家庭或家室。
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: 他不停手
  rationale: 此处描述其持续作恶，并非空间上的离开；“不停手”既自然，也保留不肯止息的语气。
- source_word: ἕως ἐνίκησεν σκορπίσαι
  choice: 直到得逞，把他们驱散
  rationale: ἐνίκησεν 后接不定式，表达成功达到目的；“得逞”在此负面语境中贴切。σκορπίσαι 本身没有明说宾语，中文补出依上下文可知的“他们”，却不提前引入下句的“一家”。
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: 仿佛使他们成了孤儿
  rationale: 原短语罕见而含蓄，涉及失怙、丧亲或孤儿般无依的状态；正文以自然中文呈现其具体意象，并用脚注保留歧义。
- source_word: ἠρήμωσεν οἶκον
  choice: 使一家荒凉
  rationale: ἠρήμωσεν 表示使之荒废、凄凉；οἶκον 可指房屋，也可指家庭或家室。上下文关乎家庭被毁，故用“一家”，同时以“荒凉”保留原词的荒废意象。
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: 因不法的欲望
  rationale: παράνομος 指违背律法或法度；“不法的欲望”保留其道德与律法色彩，而不把 ἐπιθυμία 限定为某一种欲望。
