  text: And may his house lack everything that would fill his soul.
translation:
  language: zh_hans
  text: 愿他的家缺乏一切能使他心满意足的东西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: 缺少
  rationale: 该词本为“缺乏、不足”的形容词；原句没有明示系词，但处于咒诅愿望的语境中，因此用“愿……缺少”自然表达其祈愿语气。
- source_word: ὁ οἶκος αὐτοῦ
  choice: 他家中
  rationale: οἶκος既可指房屋，也可指家庭或家中所有；“他家中”保留这种范围上的弹性，并符合涉及生活供应的语境。
- source_word: ἀπὸ παντὸς
  choice: 一切……的东西
  rationale: 该短语与表示缺乏的词连用，意为在某一类事物上一无所有；汉语以“缺少一切……”表达较为自然。
- source_word: οὗ ἐμπλήσει
  choice: 能使……满意足的
  rationale: ἐμπλήσει字面涉及“充满、填满”；译作“使……满意足”既保留充盈的意象，也自然传达这些东西能够满足人的含义。
- source_word: ψυχὴν αὐτοῦ
  choice: 他的心
  rationale: ψυχή在此可涉及内在欲望、胃口或整个人；“心”在现代汉语中可自然指内在欲求，同时避免把语义限定为肉体食欲。
theological_decisions:
- issue: ψυχή在咒诅语境中的所指
  choice: 译作“心”，表达人的内在欲求而不作教义化界定
  alternative: “灵魂”或“胃口”
  rationale: 原文可涵盖灵魂、生命、自我或欲望；“灵魂”可能引入过强的实体性神学含义，“胃口”又过于狭窄，因此采用较开放的“心”。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。“愿”承接上下文中的咒诅语气；“心满意足”使“充满其ψυχή”的希腊表达在汉语中自然可懂，同时保留满足内在欲求的含义。
