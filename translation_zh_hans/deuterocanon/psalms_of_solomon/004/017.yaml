base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/017.yaml
  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
translation:
  language: zh_hans
  text: 愿他一生充满痛苦、贫穷和困顿[a]，主啊；愿他睡时满是愁苦，醒来时也陷于种种困顿。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困顿”所译的希腊词也可表示“穷乏”“无助”或“困境”；本节后半再次使用同一词的复数形式。
    reason: lexical_alternative
  - marker: b
    text: 原文这些分句没有明写动词；结合上下文连续的祈愿语气，译作“愿……”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὀδύναις
  choice: 痛苦
  rationale: 该词可涵盖身体与内心的疼痛；“痛苦”在现代汉语中自然，也不至于强化为“折磨”。
- source_word: πενίᾳ
  choice: 贫穷
  rationale: 直接表达物质上的贫乏，并与“痛苦、困顿”组成连续的苦况。
- source_word: ἀπορίᾳ / ἀπορίαις
  choice: 困顿 / 种种困顿
  rationale: 同一词根在本节出现两次，故用同一核心译词保持呼应；后一次为复数，以“种种”体现。此处主要指缺乏出路、无助和艰难处境，而非单纯思想上的困惑。
- source_word: ζωὴ
  choice: 一生
  rationale: 此处概括此人的整个生活状况；“一生”比机械的“生命”更符合汉语表达。
- source_word: λύπαις
  choice: 种种愁苦
  rationale: 保留复数所表达的反复或多方面忧伤；“愁苦”兼有悲伤与困苦之意。
- source_word: ὕπνος
  choice: 睡去
  rationale: 原文为名词“睡眠”，但与后面的“醒来”对举时，汉语用动词表达更自然。
- source_word: ἐξέγερσις
  choice: 醒来
  rationale: 指从睡眠中苏醒或起身；“醒来”与“睡去”形成清楚自然的对举。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留希腊文呼格所表达的直接祈求语气。
theological_decisions:
- issue: 无动词分句的语气
  choice: 按上下文译为祈愿式“愿……”
  alternative: 陈述式“他一生都在……”
  rationale: 本节各分句本身省略系词，但处于前后连续的咒诅性祈愿之中，因此补出“愿”最符合语篇语气；脚注仍保留形式上的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“睡去／醒来”形成自然对举；重复“困顿”以显明原文同词复现，并用“种种”适度呈现复数。
