  rationale: 修订保留原译的祈愿语气、核心词汇及脚注a，同时将“睡去／醒来”的动作性表达调整为“睡时／醒来时”的状态和时间对举，更准确地对应“他的睡眠……他的醒来……”。脚注b改为说明实际的语篇依据，避免把脱离上下文的陈述式当作等值替代。
