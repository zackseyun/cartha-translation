  naturalness: “愿他在种种愁苦中睡去”虽可理解，但在现代汉语中较容易指临终或一次入睡的动作，未充分对应“他的睡眠”。改为“愿他睡时满是愁苦，醒来时也陷于种种困顿”更自然，也更清楚地表达昼夜皆受苦的平行。
