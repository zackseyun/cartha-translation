  yaml_path: translation/deuterocanon/psalms_of_solomon/004/027.yaml
  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: zh_hans
  text: 主必救他们脱离诡诈的人和罪人[a]，也必救我们脱离一切不法的绊脚石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诡诈而有罪的人”。
    reason: 原文两个复数词可理解为并列指称“诡诈的人”和“罪人”，也可理解为共同描述同一群人。
  - marker: b
    text: “不法的绊脚石”也可译作“使人跌倒的不法诱因”或“不法的网罗”。
    reason: σκά­νδαλον指使人跌倒的障碍、诱因，也可在语境中指陷阱；παρανόμου最直接修饰该名词。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 这里是指上帝的神圣称号；“主”既符合原文，也保持庄重自然。
- source_word: ῥύσεται
  choice: 必救……脱离
  rationale: 体现从危险或恶人手中施行解救的含义，并保留将来语气。
- source_word: ἀνθρώπων δολίων καὶ ἁμαρτωλῶν
  choice: 诡诈的人和罪人
  rationale: “诡诈的人”准确表达 δόλιος 的欺骗、奸诈之意；将 ἁμαρτωλῶν 译为“罪人”，保留《所罗门诗篇》中可能具有群体称谓色彩的表达，同时不排除两项共同描述同一群人的语法可能。
- source_word: σκανδάλου
  choice: 网罗
  rationale: 此处指使人陷入罪恶或败亡的诱因、陷阱；“网罗”在本句中比直译“绊脚石”更自然，也保留设陷致跌倒的比喻意味。
- source_word: παρανόμου
  choice: 不法的
  rationale: 按与 σκανδάλου 一致的形容词理解，表示这种网罗具有违背律法的性质；另见脚注所列属格式理解。
theological_decisions:
- issue: ἁμαρτωλῶν 是独立的群体称谓，还是与 δολίων 一同修饰 ἀνθρώπων
  choice: 正文译作“诡诈的人和罪人”
  alternative: “诡诈而有罪的人”
  rationale: 原文可以自然地把两个复数形容词理解为并列描述，但 ἁμαρτωλοί 在本书中也可能指被称为“罪人”的特定敌对群体。正文保留较明显的并列形式，脚注说明另一种读法。
- issue: παρανόμου 修饰 σκανδάλου，还是表示网罗的来源或设置者
  choice: 正文译作“一切不法的网罗”
  alternative: “不法之人所设的一切绊脚石”
  rationale: 形容词与名词的性、数、格一致，最直接的理解是修饰“网罗”；但属格形式在语义上也可能被理解为与不法之人有关，因此在脚注保留这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必救……脱离”维持两分句的平行结构；“诡诈的人和罪人”保留原文潜在的群体区分，“网罗”则以自然汉语传达导致陷落的形象。
