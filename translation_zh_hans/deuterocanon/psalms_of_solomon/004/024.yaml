  text: And they did not remember God, and they did not fear God amid all these things.
translation:
  language: zh_hans
  text: 他们在这一切事上没有记念上帝，也不敬畏上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: 记念
  rationale: 该不定过去时中动形态在此表示把上帝放在心上、想起上帝。“记念”既贴近原文，又是现代中文读者能够理解的庄重表达。
- source_word: ἐφοβήθησαν
  choice: 敬畏
  rationale: φοβέομαι以上帝为宾语时兼有惧怕、尊崇与肃然敬重之意。“敬畏”保留其宗教与道德分量，且不把含义缩减为一般性的害怕。
- source_word: ἐν πᾶσι τούτοις
  choice: 在这一切事上
  rationale: 介词短语涵盖前文所述全部情形，并指出他们在这些事中的表现。“在这一切事上”较自然地保留了ἐν的宽泛关系含义。
theological_decisions:
- issue: 对上帝的“惧怕”与“尊崇”之间的语义张力
  choice: 敬畏上帝
  alternative: 惧怕上帝
  rationale: “敬畏”在现代汉语宗教语境中可同时承载畏惧与尊崇，避免将原文单方面解释为恐惧，同时没有淡化其道德严肃性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原文两个并列否定分句及“上帝”的重复，以呈现其强调和节奏。
