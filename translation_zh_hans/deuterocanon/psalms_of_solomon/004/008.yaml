  yaml_path: translation/deuterocanon/psalms_of_solomon/004/008.yaml
  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
translation:
  language: zh_hans
  text: 愿上帝揭露那讨好他人者[a]的作为，使他的作为在嗤笑和讥讽中揭露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语的句法不规则；也可理解为“讨人喜欢的作为”。
    reason: 保留传抄文本中ἀνθρώπων ἀρεσκόν与τὰ ἔργα之间真实存在的句法和修饰关系歧义。
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: 愿上帝揭露
  rationale: ἀνακαλύψαι形式上是不定式，但在本段祈愿、咒诅式语境中表达愿望；“愿上帝……”自然保留祈求语气。“揭露”兼有使隐秘之事显明并公开暴露的意味。
- source_word: τὰ ἔργα
  choice: 作为
  rationale: ἔργα指此人在实际行为上所做的事；“作为”在现代汉语中庄重自然，也适合道德审判与公开揭露的语境。原文前后重复该词，译文也保留重复。
- source_word: ἀνθρώπων ἀρεσκόν
  choice: 那讨好人的人
  rationale: 传抄文本的句法不规则，但结合上下文，最自然地指以取悦人为特征的人。“讨好人的人”保留其负面伦理意味，又比生造复合名词更符合现代汉语。
- source_word: ἐν καταγέλωτι
  choice: 遭受嗤笑
  rationale: καταγέλως表示带有羞辱意味的嘲笑；“嗤笑”简洁地传达公开轻蔑和羞辱。ἐν在此按伴随的处境或方式处理。
- source_word: μυκτηρισμῷ
  choice: 讥讽
  rationale: μυκτηρισμός指轻蔑性的嘲弄；“讥讽”与“嗤笑”相配，同时保留两个希腊词之间的细微差别。
theological_decisions:
- issue: “讨好人的人”是一般描述还是特定伦理类别
  choice: 译作“那讨好人的人”
  alternative: “取悦人的人”或“讨人喜欢者”
  rationale: 这里不是单说一个受人喜爱的人，而是谴责为了迎合人而行事的人；“讨好”保留这种负面伦理张力，但不额外引入“而不讨上帝喜悦”等原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿式诗歌语言。“愿上帝”呈现咒诅祷告的语气；后半句以“使……遭受……”补足汉语句法，同时保留“作为”的重复及“嗤笑／讥讽”两个近义词。
