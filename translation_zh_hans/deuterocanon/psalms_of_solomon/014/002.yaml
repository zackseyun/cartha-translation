base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
translation:
  language: zh_hans
  text: 主的虔诚人必在他里面活到永远[a]；主的乐园——那些生命树[b]——就是他的虔诚人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他里面”也可译作“靠它而活”，把“它”理解为上一节所说的律法。希腊语代词在语法上可回指“主”或“律法”。
    reason: 所指歧义
  - marker: b
    text: 希腊原文“生命树”为复数。
    reason: 词形说明
lexical_decisions:
- source_word: ὅσιοι / ὅσιοι αὐτοῦ
  choice: 虔诚人 / 他的虔诚人
  rationale: ὅσιος侧重敬虔、忠于神的圣洁品格。“虔诚人”既保留宗教含义，也避免“圣徒”可能带入的后期教会称谓；前后两处采用同一译法，以显明诗句的呼应。
- source_word: Κυρίου / τοῦ κυρίου
  choice: 主的
  rationale: κύριος在此按本项目惯例译为“主”，两处保持一致。
- source_word: ζήσονται
  choice: 必……活
  rationale: 直译ζάω的将来时；“必”自然表达其将来和确定语气。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留ἐν的空间—关系性表达，并将αὐτῷ按本节最近的显性所指“主”处理；但它也可能回指上一节的“律法”，故以脚注保留另一读法。
- source_word: εἰς τὸν αἰῶνα
  choice: 到永远
  rationale: 这是该希腊惯用语自然、庄重的现代汉语表达。
- source_word: παράδεισος
  choice: 乐园
  rationale: “乐园”兼具园林意象与末世性的崇高色彩，比普通的“园子”更贴近παράδεισος。
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: 那些生命树
  rationale: τὰ ξύλα为复数；“那些生命树”明确保留复数，并避免受《创世记》惯用单数“生命树”的影响。
theological_decisions:
- issue: ἐν αὐτῷ的所指
  choice: 正文译作“在他里面”，指向主
  alternative: “靠它而活”，即靠上一节所说的律法而活
  rationale: 本节中“主”是最近出现且语法上可作所指者，因此正文采用“在他里面”；然而上一节的“律法”同样是阳性名词，也符合第二圣殿时期“靠律法而活”的语境，原文不能彻底排除这一回指，故不在译文体系中抹去此歧义。
- issue: 后半句三个主格短语的关系
  choice: 将其译为无明示系词的同一性判断：“主的乐园——那些生命树——就是他的虔诚人”
  alternative: 主的乐园属于他的虔诚人；他的虔诚人在主的乐园中
  rationale: 原文以三个主格表达并置，没有所有关系或位置关系的明示标记。采用同一性判断最能保存“虔诚人就是乐园中的生命树”这一强烈诗性隐喻，而不替原文消解其张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“虔诚人”适合普通读者，又不引入特定宗派对“圣徒”的技术性理解；破折号表现原文并置结构，并让后半句的诗性认同关系清楚可读。
