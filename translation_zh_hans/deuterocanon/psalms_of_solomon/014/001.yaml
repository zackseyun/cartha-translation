base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: zh_hans
  text: 主对那些在真理中爱他的人、忍耐承受他管教[a]的人，以及按他的诫命而行在义[b]中、遵行他为使我们得生命所吩咐我们的律法的人，都是信实的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教导”。希腊语 παιδεία 可包括训练、纠正和教导。
    reason: lexical_alternative
  - marker: b
    text: “义”也可译作“公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς
  choice: 信实
  rationale: 作为表语描述主对属他之人的可靠与始终不渝；“信实”既贴合原义，也符合现代汉语的经文语体。
- source_word: Κύριος
  choice: 主
  rationale: 这里是犹太希腊语敬虔语境中的神圣称号，译作“主”最为准确自然。
- source_word: ἀγαπῶσιν
  choice: 爱
  rationale: 直接保留动词的简明表达及其关系与盟约意味。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 保留介词结构及其可能兼有的真理、真实和诚挚意味，不单一化为“真诚地”。
- source_word: ὑπομένουσιν
  choice: 忍受
  rationale: 表达在管教之下坚持承受；相较“接受”，更充分体现持续忍耐的语义。
- source_word: παιδείαν
  choice: 管教
  rationale: 在顺服上帝的语境中，此词涵盖训练、纠正和教导；正文采用能体现纠正性塑造的“管教”。
- source_word: πορευομένοις
  choice: 行
  rationale: 保留以行走喻生活行为的圣经意象，同时在现代汉语中仍可理解。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: 此处指按上帝诫命而有的正直、公正状态或行为；“义”简洁地保留其神学与伦理张力。
- source_word: προσταγμάτων
  choice: 诫命
  rationale: 指具有权威的命令，与后文“律法”相称，也符合庄重的经文语体。
- source_word: νόμῳ
  choice: 律法
  rationale: 此处与上帝的吩咐相连，“律法”是清楚且惯常的对应词。
- source_word: εἰς ζωὴν ἡμῶν
  choice: 为使我们得生命
  rationale: 以自然汉语表达律法面向群体生命的目的或结果，同时保留“生命”的单数集合意义。
theological_decisions:
- issue: ἐν ἀληθείᾳ 的含义
  choice: 在真理中
  alternative: 真诚地
  rationale: 原文可指在真实、真理或诚挚中；采用较形式对应的表达，以免只保留主观诚意这一层意思。
- issue: δικαιοσύνη 的伦理范围
  choice: 义
  alternative: 公正
  rationale: 上下文强调依照上帝诫命而行，但并未排除公正的含义；正文用范围较广的“义”，脚注提示另一译法。
- issue: εἰς ζωὴν ἡμῶν 的关系
  choice: 为使我们得生命
  alternative: 为着我们的生命
  rationale: εἰς 可表达目的或趋向；正文采用自然的目的表达，但不将其扩展为特定的救恩机制。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留“在真理中”“行在……中”等源语意象和结构；末尾补出“也是如此”，使开头的表语“信实”能自然统摄三个并列对象，而不改变原文逻辑。
