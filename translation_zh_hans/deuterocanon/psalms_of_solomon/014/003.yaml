  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: zh_hans
  text: 他们的栽种永远扎根；在天的一切日子里[b]，他们必不消逝[a]，因为以色列是上帝的分和产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消逝”也可译作“止息”“终结”或“不复存在”。原文动词较罕见，重点在于他们不会停止存留。
    reason: lexical_alternative
  - marker: b
    text: “天的一切日子”直译原文的表达，指天尚存期间的全部时日。
    reason: cultural_note
lexical_decisions:
- source_word: φυτεία
  choice: 所栽种的
  rationale: 保留栽种的农业意象，同时不把所指过早限定为人民、植物或定居之地。
- source_word: ἐρριζωμένη
  choice: 扎根
  rationale: 保留与“栽种”相连的植物意象；完成时被动分词表达已经确立并持续的状态。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 此处表达持久不变，现代汉语以“永远”自然且准确。
- source_word: ἐκλήξουσιν
  choice: 绝迹
  rationale: 罕见动词在此指停止、终结或不复存在；“不会绝迹”符合复数群体语境，也避免现代汉语“失败”的误导含义。
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: 在天长存的一切日子里
  rationale: 保留“天的日子”这一高雅意象，并以“天长存”使汉语关系清楚，不径直释为“永远”。
- source_word: μερὶς
  choice: 分
  rationale: 保留分配、所得之分的圣经语汇，并与“产业”并列。
- source_word: κληρονομία
  choice: 产业
  rationale: “产业”在中文圣经语境中可表达承受所得及归属之物，适合此处上帝拥有以色列的语义。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 按属有关系直接翻译，不额外添加神学解释。
theological_decisions:
- issue: 以色列作为上帝所得之分和产业的群体性身份
  choice: 以色列是上帝的分和产业
  alternative: 上帝的分和产业是以色列
  rationale: 希腊文系词句可容许两种汉语次序；所选表达自然，并保留以色列归属上帝这一盟约性陈述，不作教派化扩展。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语；保留“栽种—扎根”的连续意象，以及“分和产业”的圣经式并列。用“绝迹”表达群体不至终结，避免将该罕见动词误解为一般意义上的“失败”。
