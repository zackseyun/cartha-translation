revisions:
- from: 他们所栽种的永远扎根；在天长存的一切日子里，他们都不会绝迹[a]，因为以色列是上帝的分和产业。[b]
  to: 他们的栽种永远扎根；在天的一切日子里[b]，他们必不消逝[a]，因为以色列是上帝的分和产业。
  rationale: 修订避免将“他们的栽种”限定成“他们所栽种的对象”，并以“消逝”替换语义较强且较专门的“绝迹”。时间表达不在正文加入“长存”，而由脚注说明其指天尚存的全部时日；脚注锚点也移至对应短语之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:33:33Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了“栽种—扎根”的意象、持久的时间表达，以及以色列为上帝之分和产业的谓词结构。但“他们所栽种的”将 φυτεία αὐτῶν 较具体地理解为“他们所栽的对象”，而原文仍可指“他们的栽种／栽培物”；“绝迹”带有种类或踪迹完全消失的较强现代含义，不是此处“停止、终结”的最稳妥对应。
  naturalness: “在天长存的一切日子里”虽可理解，却把“长存”加入正文，且修饰关系略显生硬。改为“在天的一切日子里”，并以脚注说明其习语性时间含义，较贴近原文，也较自然。
  terminology: “上帝”“以色列”“分和产业”均合适；“分”保留 allotment/portion 的语义，并与“产业”形成适宜的圣经式并列。
  issues:
  - severity: medium
    issue: φυτεία αὐτῶν 被表述为“他们所栽种的”。
    rationale: 该译法将属格具体化为施事关系，较原文更窄。以“他们的栽种”保留其可指栽种物或栽种之事的含混，并维持植物意象。
  - severity: medium
    issue: ἐκλήξουσιν 译为“绝迹”。
    rationale: “绝迹”常指某物种、现象或踪迹完全消失，语体及语义均比“停止／终结”更专门、更强。用“消逝”可自然表达不至终结，且不引入被消灭的施事。
  - severity: low
