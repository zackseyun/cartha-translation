base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: zh_hans
  text: 因此，阴间[a]、黑暗和毁灭是他们的产业；在怜悯义人的日子，他们必不得寻见[b]。但主的虔敬者[c]必在喜乐中承受生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在之境，不一定等同于后来“地狱”一词常包含的完整含义。
    reason: cultural_note
  - marker: b
    text: 或译：“在义人施怜悯的日子。”希腊文的属格结构可以有不止一种理解。
    reason: alternative_reading
  - marker: c
    text: 或译：“主的忠信者”或“主的圣洁之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 表达承接上文的推论或结果，简洁自然。
- source_word: κληρονομία
  choice: 产业
  rationale: 保留继承所得之份的意象，也适合与后半句“承受生命”相呼应。
- source_word: ᾅδης
  choice: 阴间
  rationale: 指死者所在之境，避免用“地狱”带入原词未必包含的后期完整观念。
- source_word: σκότος
  choice: 黑暗
  rationale: 直接呈现词义，并保持“阴间、黑暗和毁灭”三项并列的力度。
- source_word: ἀπώλεια
  choice: 毁灭
  rationale: 现代汉语中直接、庄重，也保留终局性意味。
- source_word: οὐχ εὑρεθήσονται
  choice: 他们必不被寻见
  rationale: 保留希腊文将来时被动语态及其审判、排除的含义，不擅自解释为消失或灭绝。
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: 在怜悯义人的日子
  rationale: 将义人理解为怜悯的领受者，符合上下文对比；同时以脚注保留属格结构的另一种真实可能。
- source_word: ὅσιοι
  choice: 虔诚人
  rationale: 突出敬虔、忠于神的性质，并与通常译作“圣徒”的 ἅγιοι 保持适当区别。
- source_word: Κυρίου
  choice: 主的
  rationale: 直接保留属格关系，说明这些虔诚人属于主。
- source_word: κληρονομήσουσιν ζωὴν
  choice: 必……承受生命
  rationale: 延续本节的继承意象，与恶人所得的“产业”形成鲜明对照。
- source_word: ἐν εὐφροσύνῃ
  choice: 在喜乐中
  rationale: 自然而庄重地表达伴随承受生命而有的欢欣状态。
theological_decisions:
- issue: ᾅδης 的含义
  choice: 译作“阴间”
  alternative: 地狱；坟墓；死者之境
  rationale: 原词首先指死者所在之境，不必然等同于后期神学语境中“地狱”的全部含义。
- issue: ἐν ἡμέρᾳ ἐλέους δικαίων 中 δικαίων 的关系
  choice: 理解为义人是怜悯的领受者：“怜悯义人的日子”
  alternative: 义人施怜悯的日子
  rationale: 这较符合本节恶人与主的虔诚人之间的对比，但希腊文属格存在歧义，因此在脚注中保留另一读法。
- issue: ὅσιοι 的群体称谓
  choice: 译作“虔诚人”
  alternative: 忠信者；圣洁的人
  rationale: ὅσιοι 强调对神的敬虔与忠诚；“虔诚人”既保留宗教伦理色彩，也不把它与 ἅγιοι 的常见称谓完全混同。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。前后两处继承意象分别用“产业”和“承受”连贯呈现；对“阴间”、属格歧义和 ὅσιοι 的语义范围用简短脚注说明，不在正文中消解其张力。
