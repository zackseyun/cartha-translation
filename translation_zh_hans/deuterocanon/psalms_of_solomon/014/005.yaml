base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: zh_hans
  text: 他们没有把上帝放在心上[a]：世人的道路始终都在他眼前，他全都知道；内心的隐秘[b]尚未形成，他就已经知道了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有记念上帝”或“没有想起上帝”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“内心的内室”，即内心深藏之事。
    reason: lexical_alternative
  - marker: c
    text: 或译“在它们产生以前”或“在它们发生以前”。希腊文的表达较宽泛。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν τοῦ θεοῦ
  choice: 把上帝放在心上
  rationale: 这里不是单指一时想起，而是指没有记念、没有持续把上帝放在心中。此译法自然表达其道德意味；脚注保留较贴字面的译法。
- source_word: ὁδοὶ ἀνθρώπων
  choice: 世人的道路
  rationale: 保留“道路”的圣经性隐喻，使其既可指人的路径，也可指人的行为和生活方式，而不将含义缩窄为“行为”。
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός
  choice: 始终都为他所知
  rationale: 用自然的现代汉语表达“在他面前一直是已知的”，同时保留上帝持续而完全知晓人的道路这一含义。
- source_word: ταμεῖα καρδίας
  choice: 内心的隐秘
  rationale: ταμεῖα本指内室或储藏室，此处转喻内心深藏之事。译作“内心的隐秘”既符合语境，也避免把后面的“尚未形成”误接到实体房间上。
- source_word: ἐπίσταται
  choice: 他就已经知道了
  rationale: 该动词表示确知、熟知；“知道”清楚自然，“已经”配合前置的“尚未”，突出先于其形成的知晓。
- source_word: πρὸ τοῦ γενέσθαι
  choice: 尚未形成
  rationale: γενέσθαι含义宽泛，可指产生、形成或发生。“尚未形成”适合修饰内心的隐秘，同时不把所指限定为外在事件。
theological_decisions:
- issue: 末句所表达的上帝预知范围
  choice: 上帝在内心的隐秘尚未形成时就已知道
  alternative: 上帝在内心隐藏的意念表现为行动之前就知道；或上帝在内心的谋算产生之前就知道
  rationale: 希腊文陈述先于“形成／产生”的神圣知识，却没有界定所指仅为行动、思想或谋算。译文保留这种宽度，不将其纳入某一特定教义体系。
- issue: ὅτι与前句的关系
  choice: 用“没有想到：”引出其未曾记念的内容
  alternative: 译作原因性的“因为”，或只用冒号并保留较生硬的并置
  rationale: ὅτι在此可引出他们没有放在心上的事实。汉语补出“没有想到”可清楚连接后文，但不把它解释为“因为”所引出的因果关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“世人的道路”保留原文隐喻；“内心的隐秘”用自然表达传达ταμεῖα的转喻意义。标点将ὅτι所引内容明确呈现，同时避免增添特定宗派术语。
