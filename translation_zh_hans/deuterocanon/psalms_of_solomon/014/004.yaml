base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: zh_hans
  text: 但罪人和不法之人却不是这样；他们喜爱在自己的罪中有分的那一日；他们所贪恋的，是朽坏的短暂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “短暂”原文直译为“小、微小”，也可理解为“卑微”；本句也可译作：“他们所贪恋的，在于朽坏的微小（或卑微）。”
    reason: μικρότης 可表示大小、卑微或短促；上下文支持“短暂”，但词义与句法仍有真实歧义。
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: 但……却不是这样
  rationale: 承接上文形成鲜明对照；用现代汉语的“但……却”自然表达希腊语的转折力度。
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: 罪人和无法无天的人
  rationale: 分别保留“犯罪者”与“违背律法者”两个称谓，不将二者合并；“无法无天”在现代汉语中能传达 παράνομοι 的法律—道德色彩。
- source_word: οἱ ἠγάπησαν ἡμέραν
  choice: 他们爱那……一日
  rationale: 保留原文突出的单数“日”，不把它泛化为一段时期；“那”使压缩而异常的希腊语结构在中文中较易理解，同时不消除其诗意含混。
- source_word: ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: 在自己的罪中有分
  rationale: “有分”准确传达 μετοχή 的参与、分享之意；αὐτῶν 在此按反身关系译作“自己的”。
- source_word: ἐν μικρότητι σαπρίας
  choice: 短暂的朽坏
  rationale: σαπρία 译作“朽坏”，保留腐败、衰朽的意象；结合上文“一日”及前文永恒语境，正文将 μικρότης 理解为时间上的短暂，同时以脚注保留“微小、卑微”的词义可能。
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: 他们所贪恋的
  rationale: ἐπιθυμία 在此指强烈欲求而非特指情欲；“贪恋”与前面的“爱”相呼应，并表达负面的道德语气。
theological_decisions:
- issue: “一日”与“短暂的朽坏”之间的关系
  choice: 保留原文两个压缩意象，不解释为特定审判日、节期或某种具体罪行
  alternative: 将其释义为罪人享乐的短暂一生或某个特定犯罪时刻
  rationale: 希腊文本没有明确界定这一“日”，也没有说明所参与之罪的具体性质；译文应保存这种诗性张力，避免加入经文未明说的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“一日”“有分”“朽坏”等诗性和经文性表达，但避免文言化；分号对应原文两个紧密相连而各有重心的分句。
