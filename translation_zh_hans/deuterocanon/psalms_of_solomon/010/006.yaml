  yaml_path: translation/deuterocanon/psalms_of_solomon/010/006.yaml
  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: zh_hans
  text: 我们的主在他的审判中永远公义、圣洁；以色列必欢喜地赞美主的名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: 公义
  rationale: 表示主在道德和审判上的正直；“公义”保留其神学与伦理内涵，不局限于司法上的公平。
- source_word: ὅσιος
  choice: 圣洁
  rationale: 此词用来描述神，兼有圣善、虔圣之意；“圣洁”在现代中文中最自然，也与“公义”形成原文的双重表述。
- source_word: Κύριος ἡμῶν
  choice: 我们的主
  rationale: κύριος在此是对神的称号，译作“主”；所属关系按原文译为“我们的”。
- source_word: κρίμασιν αὐτοῦ
  choice: 在他的审判中
  rationale: 与格复数可表示主施行审判或作出判决的领域、表现；此译法自然地表达主的公义和圣洁显明于他的审判之中。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该固定表达表示持续无尽；置于谓语形容词之前，保留它修饰主恒常属性的主要理解。
- source_word: αἰνέσει
  choice: 必……赞美
  rationale: 保留希腊语将来时；“必”兼具诗歌中的确定语气，且中文简洁自然。
- source_word: τῷ ὀνόματι Κυρίου
  choice: 主的名
  rationale: 保留“名”所承载的敬畏和神学意义，同时采用自然的现代汉语所属结构。
- source_word: ἐν εὐφροσύνῃ
  choice: 欢喜地
  rationale: 表示赞美的方式和喜乐情绪；“欢喜地”清楚、庄重，也符合诗歌语境。
theological_decisions:
- issue: δίκαιος与ὅσιος这一对属性是否作解释性合并
  choice: 公义、圣洁
  alternative: 公正、信实
  rationale: 原文并列司法—伦理与圣善两个层面的属性；分别译出可避免把二者压缩成单一概念。
- issue: εἰς τὸν αἰῶνα的修饰范围
  choice: 修饰主在其审判中恒常为公义、圣洁
  alternative: 修饰“他的审判”，理解为审判永远长存
  rationale: 原文中“公义、圣洁”是主的谓语，κρίμασιν为与格，“永远”最自然地说明这些属性的恒常性；同时译文让“在他的审判中”紧邻谓语，不排除其与审判密切相连的语义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。希腊文将“公义、圣洁”前置以突出主的属性；中文若机械倒装会显得生硬，因此用“我们的主……永远公义、圣洁”保持自然，并借“永远”与并列谓语维持强调。后半句以“必”表达将来时的确定性。
