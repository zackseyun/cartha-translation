  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: zh_hans
  text: 因为他修直了义人的道路[a]，在管教中[b]也不使这些道路弯曲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”也可译作“路径”，在这里可比喻义人的行事为人。
    reason: lexical_alternative
  - marker: b
    text: “在管教中”也可译作“借着管教”或“在纠正中”。原文也可能强调：他不会借管教使义人偏离。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ὤρθωσε
  choice: 修直了
  rationale: 该动词表示使之笔直、端正；“修直了”保留道路的具体意象，也与下句“不使……弯曲”形成鲜明对照。希腊语不定过去时在此陈述已成之事，不额外强化为特定时态神学。
- source_word: ὁδοὺς
  choice: 道路
  rationale: 既可指实际道路，也可比喻人的行事为人；“道路”在现代汉语中自然，并保留原文的伦理路径意象。
- source_word: δικαίων
  choice: 义人
  rationale: 属格复数名词化形容词，指公义的人；“义人”简洁、庄重，符合经文语域。
- source_word: διαστρέψει
  choice: 不使这些道路弯曲
  rationale: 该词可表示扭曲、使偏离或败坏。结合前文“修直”与“道路”，采用“使……弯曲”以保留空间性对照；补出“这些道路”是为使汉语指代清楚。
- source_word: ἐν παιδείᾳ
  choice: 在管教中
  rationale: παιδεία可指管教、纠正或训练；ἐν首先直译为“在……中”，同时通过脚注保留工具性“借着”的可能。
theological_decisions:
- issue: 管教与义人道路之间的关系
  choice: 上帝使义人的道路笔直，即使在管教过程中也不使这些道路弯曲。
  alternative: 上帝不会借管教使义人偏离；或上帝施行管教时不会行事不正。
  rationale: 前句的“道路”和“修直”构成持续的道路意象，因此把διαστρέψει省略的宾语理解为前述“道路”最贴近句法与修辞；但ἐν παιδείᾳ的关系仍有一定歧义，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“修直—弯曲”保留原文内部的道路对照；避免用过度抽象的“败坏”或带特定宗派色彩的神学措辞。
