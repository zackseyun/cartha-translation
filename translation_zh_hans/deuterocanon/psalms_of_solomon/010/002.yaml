base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/002.yaml
  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
translation:
  language: zh_hans
  text: 那预备好自己的背脊来承受鞭打[b]的人，必得洁净[a]；因为主对忍受管教[c]的人是良善的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得洁净”也可译作“得以纯净”。
    reason: lexical_alternative
  - marker: b
    text: “鞭打”也可译作“鞭笞”；原文用复数名词，字面为“鞭子”。
    reason: lexical_alternative
  - marker: c
    text: “管教”也可译作“责教”或“惩戒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  choice: 那预备……的人
  rationale: 带冠词的现在分词泛指具有这种预备态度的人；此译保留其概括性，又符合现代汉语表达。
- source_word: νῶτον
  choice: 脊背
  rationale: νῶτον指人的背部；“脊背”能清楚呈现承受鞭打的身体意象。
- source_word: εἰς μάστιγας
  choice: 承受鞭打
  rationale: 介词短语表示为即将临到的鞭击作好准备。“鞭打”自然易懂，也保留μάστιξ所表达的惩戒意象，并可与上节同词保持呼应。
- source_word: καθαρισθήσεται
  choice: 必得洁净
  rationale: 将来时被动语态表示此人将受到洁净；“得洁净”保留道德、宗教或更宽泛的洁净含义，不限定为礼仪洁净。
- source_word: χρηστὸς
  choice: 是良善的
  rationale: χρηστός可指良善、仁慈或厚道；“良善”保留宽广含义，并维持原文的表语结构。
- source_word: κύριος
  choice: 主
  rationale: κύριος在此按通常的神圣称谓译作“主”。
- source_word: τοῖς ὑπομένουσιν
  choice: 对忍受……的人
  rationale: ὑπομένω在此表示坚持承受管教；“忍受”直接呈现处于管教之下而不退避的意思。
- source_word: παιδείαν
  choice: 管教
  rationale: παιδεία在此不是单指知识教育，而是具有纠正和训练作用的管束；“管教”最贴合上下文。
theological_decisions:
- issue: 接受责打之后“得洁净”的性质
  choice: 保留为宽泛的洁净结果，不明确限定其机制或领域
  alternative: 可专指道德净化、礼仪洁净，或借苦难而得伸冤
  rationale: καθαρισθήσεται本身只说明将得洁净；与παιδεία相连时很可能侧重管教所带来的纠正，但原文并未排除更广的洁净意象，因此不在正文中加以限定。
- issue: 主的良善与忍受管教之人的关系
  choice: 译作“主对……的人是良善的”
  alternative: 可译作“主善待……”或“主恩待……”
  rationale: 此译保留χρηστός的形容词陈述，避免把它过度具体化为某一种施恩行动。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“预备脊背承受鞭打”保留原文鲜明的身体意象；“良善”维持智慧文学式的概括陈述。
