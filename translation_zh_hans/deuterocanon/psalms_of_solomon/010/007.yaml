  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: zh_hans
  text: 敬虔的人[a]要在百姓的集会中称谢；上帝要在以色列的喜乐中[b]怜悯穷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信的人”；也有人译“圣洁的人”。
    reason: 词义包括敬虔与盟约忠诚；“圣洁的人”是可能的传统译法，但容易与希腊语 ἅγιοι 混同。
  - marker: b
    text: 或译“伴随着以色列的欢喜”。
    reason: 介词短语可表示所处情境，也可表示伴随情形；原文容许这种细微差异。
lexical_decisions:
- source_word: ὅσιοι
  choice: 敬虔的人
  rationale: 该词指以敬虔和盟约忠诚为特征的人群；“敬虔的人”既区别于通常表示“圣者”的用语，也比单译“忠信的人”少一层解释。
- source_word: ἐξομολογήσονται
  choice: 要……称谢
  rationale: 在《七十士译本》的敬拜语境中，该动词常指公开称谢或赞美；“称谢”保留宗教语体，也符合在集会中的公开行动。
- source_word: ἐκκλησίᾳ λαοῦ
  choice: 百姓的集会中
  rationale: 直指百姓聚集形成的公共会合；“集会”清楚自然，不预先赋予后世制度性的教会含义。
- source_word: πτωχοὺς
  choice: 穷人
  rationale: 直接保留其贫穷、困乏的社会含义，不以较宽泛的“有需要的人”弱化原词。
- source_word: ἐλεήσει
  choice: 怜悯
  rationale: 表达上帝向穷人施行慈悲，保留该动词在宗教语境中的神学分量。
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: 在以色列的喜乐中
  rationale: 贴近希腊语介词结构，并保留“喜乐”这一名词表达；该短语具体描述场景、伴随情形或方式，原文没有完全限定。
theological_decisions:
- issue: ἐν εὐφροσύνῃ Ἰσραήλ 与前句的关系
  choice: 按希腊语次序将其理解为修饰上帝怜悯穷人的情境，但用“在……中”保留语义开放性
  alternative: 译作“伴随着以色列的欢喜”或将其较宽泛地理解为全句的共同背景
  rationale: 短语位于第二分句末尾，最自然地与“怜悯”相连；然而 ἐν 可表达处境或伴随方式，不宜将二者之间的神学关系解释得过细。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“称谢”保留诗篇敬拜语言的色彩；“百姓的集会”避免把古代公共聚会直接制度化为后世意义上的“教会”。
