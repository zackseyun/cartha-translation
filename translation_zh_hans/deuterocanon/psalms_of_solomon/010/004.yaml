base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: zh_hans
  text: 主的怜悯临到那些真诚地爱他的人[a]；主必以怜悯记念他的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真诚地”或译“在真理中”或“忠诚地”。
    reason: lexical_alternative
  - marker: b
    text: “仆人”或译“奴仆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: 怜悯 / 以怜悯
  rationale: “怜悯”既可表达慈悲眷顾，也保留此处带有行动意味的恩慈；前后重复同一词根，以对应希腊文。
- source_word: Κυρίου / Κύριος
  choice: 主
  rationale: 在犹太祷告和礼仪语境中，“主”自然、庄重地表达神圣称号。
- source_word: ἐπὶ
  choice: 临到
  rationale: “临到”自然表达主的怜悯施及这些人，同时保留原文介词所呈现的指向关系。
- source_word: ἀγαπῶντας
  choice: 那些……爱……的人
  rationale: 将分词作名词用的结构译成自然汉语，并保留持续的关系性含义。
- source_word: ἐν ἀληθείᾳ
  choice: 真诚
  rationale: 此处可表示真实、诚挚或忠信地爱主；正文用“真诚”较符合现代汉语，脚注保留“在真理中”和“忠诚地”等可能。
- source_word: μνήσεται
  choice: 必……记念
  rationale: “记念”在圣经语体中通常不只是回想，也可包含眷顾并采取有利行动；“必”表达将来时的确定性。
- source_word: δούλων
  choice: 仆人
  rationale: “仆人”适合祷告语境，也保留服事和隶属关系；脚注注明字面较强的“奴仆”。
- source_word: ἐν ἐλέει
  choice: 以怜悯
  rationale: 自然表达主记念仆人时所带的怜悯方式或态度，并对应原文介词短语。
theological_decisions:
- issue: ἐν ἀληθείᾳ 的范围
  choice: 真诚爱他
  alternative: 在真理中爱他；忠诚地爱他
  rationale: 希腊语既可能强调真实诚挚，也可能带有忠信或合乎真理的意味；正文采用流畅而不过度限定的表达，并以脚注保留歧义。
- issue: δοῦλος 的身份含义
  choice: 仆人
  alternative: 奴仆
  rationale: 本节重点在主怜悯地记念属他的人，而非突出其法律身份；“仆人”适合现代中文经文语体，但脚注保留更强的隶属意味。
- issue: 神的“记念”
  choice: 记念
  alternative: 顾念
  rationale: “记念”保留圣经传统中神主动眷顾的含义，不将其弱化为单纯心理记忆，也不在正文中明说具体行动。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“临到”比直译“在……之上”更符合现代汉语；“记念”保留圣经语感及神主动眷顾的内涵。所有脚注标记均置于其所说明的词语之后。
