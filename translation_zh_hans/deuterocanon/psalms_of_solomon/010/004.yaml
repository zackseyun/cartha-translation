  text: καὶ τὸ ἔλεος Κυρίου ἐπὶ τοὺς ἀγαπῶντας αὐτὸν ἐν ἀληθείᾳ, καὶ μνήσεται Κύριος τῶν δούλων αὐτοῦ ἐν ἐλέει·
