  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: zh_hans
  text: 因为那见证在永约的律法中；主的见证在察访之时，关乎世人的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察访”也可译作“鉴察”或“巡视”；原词有时也含神施行审判或眷顾的意味。另有一种句法理解是：“因为永约律法中的见证，就是主在察访时论及世人道路的见证。”
    reason: 说明ἐπισκοπή的语义幅度，并保存两个平行分句与单一系词句之间的句法歧义。
lexical_decisions:
- source_word: μαρτυρία
  choice: 见证
  rationale: 保留该词在律法与盟约语境中的庄严、法理色彩，也对应原文两次重复所形成的平行结构。
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: 在永约的律法中
  rationale: 贴近希腊语介词与属格结构；“永约”是自然凝练的现代中文圣经语体。
- source_word: Κυρίου
  choice: 主
  rationale: 在盟约语境中作为神圣称号，译作“主”最为恰当。
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: 临到世人的道路
  rationale: ἐπί与宾格可表达指向或临及；此译保留“见证”与人所行道路之间关系的形象性，不将其过早限定为单纯“关于”。
- source_word: ἐν ἐπισκοπῇ
  choice: 在他察访之时
  rationale: ἐπισκοπή可指察看、鉴察或带审判意味的临到；“察访”既保留神察验人的含义，又比抽象名词“察访中”更符合现代汉语。
- source_word: '[implied copula]'
  choice: 在／临到
  rationale: 希腊文两分句均无明示系词；中文按各分句语义自然补足，同时保留诗体的平行关系。
theological_decisions:
- issue: ἐπισκοπή所指的神圣行动
  choice: 在他察访之时
  alternative: 在鉴察中／在降罚之时
  rationale: 原词可能涵盖眷顾、巡视、鉴察乃至审判，不能无依据地仅限定为恩惠或惩罚；正文采用较宽的“察访”，脚注说明其语义范围。
- issue: 两次ἡ μαρτυρία之间的句法关系
  choice: 译为两个平行分句
  alternative: 合并为“永约律法中的见证，就是主察访时论及世人道路的见证”
  rationale: 冠词加名词的重复以及原文标点更自然地支持诗歌式并列；合并会替原文消解真实存在的句法歧义。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“永约”“律法”“见证”维持盟约和法理语域；分号保留原文二行式平行。脚注标记已在正文中出现。
