  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: zh_hans
  text: 主以责备记念的人有福了！他借着鞭子被阻挡，离开恶道[a]，为要从罪中得洁净，免得罪恶增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被阻挡”直译为“被围住”；意思可能是他借着鞭子受到限制或围堵，不能继续走恶道。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为“免得他增添罪恶”。原文省略了“不增多”的主语或宾语。
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος
  choice: 有福了
  rationale: 保留祝福宣告的庄重语气，不把含义缩减为主观的“快乐”。
- source_word: ἀνὴρ
  choice: 人
  rationale: 希腊文为阳性单数，但本句强调受主管教者的处境；现代汉语用“人”自然，也不损失单数所指。
- source_word: ἐμνήσθη
  choice: 记念
  rationale: 保留动词“记得、记念”的原始意象；“记念”在此表达主主动顾念并施行管教。
- source_word: ἐν ἐλεγμῷ
  choice: 在责备中
  rationale: 贴近介词结构，并保留责备、纠正的双重管教意味。
- source_word: ἐκυκλώθη ἀπὸ ὁδοῦ πονηρᾶς
  choice: 被拦阻离开恶道
  rationale: ἐκυκλώθη直译为“被围住”，语境中表示受到限制、不能继续走恶道；正文采用自然汉语，脚注保存具体意象。
- source_word: ἐν μάστιγι
  choice: 受鞭打
  rationale: 保留μάστιξ所指的具体鞭打意象，不抽象化为一般的“惩戒”。
- source_word: καθαρισθῆναι ἀπὸ ἁμαρτίας
  choice: 从罪中得洁净
  rationale: 保留被动不定式与“从……中”脱离、洁净的结构。
- source_word: τοῦ μὴ πληθῦναι
  choice: 免得罪恶增多
  rationale: 该省略结构的主语或宾语并不明说；正文按最近的ἁμαρτίας理解为罪增多，同时在脚注交代另一种可能。
theological_decisions:
- issue: τοῦ μὴ πληθῦναι中省略成分的指向
  choice: 免得罪恶增多
  alternative: 免得他增添罪恶
  rationale: 希腊文没有明示不定式的主语或宾语。将“罪”理解为增多之物，衔接最近的ἁμαρτίας且汉语顺畅；脚注保留以“他”为行为主体的解释，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有福了”保留诗体祝福宣告；“记念”“恶道”“得洁净”承载经文语域但不显陈旧。正文按希腊语语序和逻辑分成祝福宣告与管教目的两层，并以脚注保留关键歧义。
