    text: “良善”也可译作“仁慈”。
    reason: lexical_alternative
  - marker: b
    text: “会众”也可译作“集会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出对上下文所述内容的原因或根据，保留原文的因果衔接。
- source_word: χρηστός
  choice: 良善
  rationale: 此词可表达“良善、仁慈”；与“怜悯”并列时，“良善”既保留较宽的品格含义，也不与后一词重叠。
- source_word: ἐλεήμων
  choice: 怜悯
  rationale: 直接表达上帝富有怜悯的属性，并与“良善”自然并列。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示恒久持续的惯用语，“永远”在现代汉语中清楚自然。
- source_word: συναγωγαὶ
  choice: 各会众
  rationale: 复数形式指以色列中聚集的群体；“各会众”自然体现复数，又避免过度限定为后世的制度性会堂。
- source_word: δοξάσουσιν
  choice: 必荣耀
  rationale: 保留将来时和颂赞意味；“必”表达预告的确定性，“荣耀”对应其强烈的尊荣含义。
- source_word: Κυρίου
  choice: 主
  rationale: 在“主的名”这一所有格结构中，译作“主”符合汉语圣经语体，也保留称号的分量。
theological_decisions:
- issue: 在希腊文次经语境中翻译 κύριος
  choice: 主
  alternative: 上主
  rationale: 译作“主”忠实保留称号，并与“主的名”这一固定而自然的汉语表达相合，不额外判定其背后的神名形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”明确 θεός；“各会众”体现 συναγωγαί 的复数。脚注紧随各自所说明的词语，未沿用英文咨询层中次序错置的标记。
