translation:
  language: zh_hans
  text: 主的救恩临到以色列家，带来永远的节制。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句也可译作：“愿主的救恩临到以色列家，带来永远的节制。”原文没有明写动词，因此可理解为陈述，也可带有祝愿的意味。
    reason: alternative_reading
  - marker: b
    text: “节制”也可译作“自制”“清醒自守”或“明智”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου ἡ σωτηρία
  choice: 主的拯救
  rationale: 将属格理解为所属关系；“拯救”既可指救援，也保留诗歌中的宗教含义。
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: 临到以色列家
  rationale: 原文是无动词句；补出“临到”能自然表达 ἐπί 的“在……之上／临到”之意，并保留 οἶκον“家”。
- source_word: εἰς
  choice: 使他们
  rationale: 这里可表示目的或结果。正文采用自然汉语表达其结果意味，但不把两者严格区分。
- source_word: εὐφροσύνην
  choice: 欢喜
  rationale: 据所标明的 Swete 1909 印本及校勘信息，此处实际读作 εὐφροσύνην，意为“欢喜、喜乐”；所提供的转录文本 σωφροσύνην 应属转录错误。
- source_word: αἰώνιον
  choice: 永远
  rationale: 表达持续不止的性质，与“欢喜”搭配自然。
theological_decisions:
- issue: κύριος 在希腊文礼仪诗歌中的译法
  choice: 主
  alternative: 主人
  rationale: “主”符合本项目惯例及诗篇语体；本节没有理由改译为“主人”。
- issue: 无动词句的陈述或祝愿语气
  choice: 按陈述句处理：“临到”
  alternative: 按祝愿句处理：“愿……临到”
  rationale: 上下文未在所给材料中完整呈现，希腊文本身也未明示语气；正文采用较直接的陈述理解，同时以脚注保留祝愿式可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“以色列家”保留原文的群体称谓；“使他们永远欢喜”以自然汉语表达 εἰς 所含的目的或结果关系。
