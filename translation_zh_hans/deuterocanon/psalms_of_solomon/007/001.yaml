base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: zh_hans
  text: 神啊，求你不要拔营离开我们[a]，免得那些无故恨我们的人[b]攻击我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拔营离开”所译的希腊语动词，字面上与迁走帐篷、撤营有关；这里形象地表达神从他的子民中间离去。
    reason: cultural_note
  - marker: b
    text: “无故”也可能修饰“攻击”，即“免得那些恨我们的人无缘无故地攻击我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: 拔营离开
  rationale: 该动词本义与迁移帐篷、拔营有关，在这里也表示离去。“拔营离开”既保留原文鲜明的帐幕意象，也让现代汉语读者自然理解为上帝撤回同在。
- source_word: ἀφʼ ἡμῶν
  choice: 离开我们
  rationale: 介词短语表达与群体分离；将其与动词合译为“离开我们”，简明而自然。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 这里引出祈求所要避免的结果；“免得”符合现代汉语祷告语体。
- source_word: ἐπιθῶνται ἡμῖν
  choice: 攻击我们
  rationale: 该表达在敌对语境中指扑向、袭击或攻击某人；“攻击我们”准确清楚。
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: 恨我们的人
  rationale: 以关系分句表达带冠词的分词结构，符合自然汉语。
- source_word: δωρεάν
  choice: 无故
  rationale: 此副词可表示无缘无故、没有正当理由；按较自然的句法理解，将其与“恨我们”相连，同时用脚注保留它也可能修饰“攻击”的歧义。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 这是直接呼告；前置为“神啊”符合现代汉语祷告的自然语序，也不改变原文意义。
theological_decisions:
- issue: ἀποσκηνώσῃς中的帐幕/驻营意象
  choice: 在正文中译作“拔营离开”，保留上帝驻留其子民中间而可能撤营离去的形象
  alternative: 仅译作“离开”或“撤去你的居所”
  rationale: 仅译“离开”会淡化原词的具体意象，而“撤去你的居所”又把原文未明说的宾语实体化；“拔营离开”兼顾词源图像、上下文张力与汉语可读性，并不额外规定其为圣殿或某种特定教义。
translation_notes:
  register: 采用自然、庄重的现代汉语祷告语体。“求你”补出汉语否定祈使句常有的恳求语气；“拔营离开”刻意保留希腊文的帐幕意象，但避免生硬的逐词翻译。
