base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: zh_hans
  text: 因为你必永远怜悯以色列民，不会弃绝他们；我们也必永远在你的轭下，在你管教的鞭下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ γένος Ἰσραήλ
  choice: 以色列民
  rationale: γένος可指族类、民族或后裔；此处指作为整体的以色列群体。“以色列民”符合现代汉语，也不额外限定为血统或政治实体。
- source_word: οἰκτειρήσεις
  choice: 必……怜悯
  rationale: 保留将来时语气，并准确表达οἰκτείρω所含的怜恤、同情之意。
- source_word: οὐκ ἀπώσεις
  choice: 不会弃绝他们
  rationale: ἀπωθέω在此表示推开、拒绝或弃绝；补出汉语所需的宾语“他们”，其所指仍是前面的以色列民。
- source_word: ὑπὸ ζυγόν σου
  choice: 在你的轭下
  rationale: 保留“轭”的具体比喻及其顺服、受约束之张力，不将其解释性改写为“统治”或“权柄”。
- source_word: μάστιγα παιδίας σου
  choice: 在你管教的鞭下
  rationale: μάστιξ是鞭、鞭打或责罚；παιδεία是管教、训育。译文保留严厉惩戒的形象，同时以“管教”呈现其训育性质。
theological_decisions:
- issue: 神的怜悯与管教并置
  choice: 同时保留“永远怜悯”与“在你管教的鞭下”
  alternative: 将后半句弱化为一般性的引导或教导
  rationale: 原文有意并列持续的怜悯、永不弃绝、负轭与受管教；不应消解其中恩慈与严厉并存的神学张力。
- issue: “轭”所表达的关系
  choice: 直译为“你的轭”
  alternative: 解释为“你的统治”或“你的律法”
  rationale: 原文没有明确限定“轭”具体指统治、律法或盟约责任，因此保留比喻及其真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”承接上文的ὅτι；两个“永远”分别对应原文εἰς τὸν αἰῶνα和τὸν αἰῶνα。后半句补出“必”与第二个“在”，使省略结构在汉语中清晰，同时不改变原意。
