  yaml_path: translation/deuterocanon/psalms_of_solomon/007/003.yaml
  text: Discipline us according to your will[c][b][a], and do not give us over to the nations.
translation:
  language: zh_hans
  text: 求你按你的旨意管教我们[a][b]，不要把我们[c]交给列国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“责罚”或“训练”；原词兼有纠正与教养塑造的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文以强调性的“你”开头，也可译作：“你要按你的旨意管教我们。”
    reason: source_emphasis
  - marker: c
    text: 原文直译为“不要交给列国”；“我们”由上下文补出。
    reason: implied_object
lexical_decisions:
- source_word: σὺ
  choice: 你（含于“求你”）
  rationale: 原文以强调性的第二人称代词开头，祷告语体用“求你”既明确以神为恳求对象，也自然表达命令式的祈求语气；不另加“亲自”，以免过度阐释其强调作用。
- source_word: ἐν θελήματί σου
  choice: 按你的旨意
  rationale: 介词短语在此自然表示依照神的意愿；“按你的旨意”比直译“在你的旨意中”更符合现代汉语，同时保留原文的开放性。
- source_word: παιδεύσον
  choice: 管教
  rationale: παιδεύω兼有纠正、训练和教导的含义。“管教”在现代汉语中可涵盖带有塑造目的的纠正，比单纯“惩罚”更完整。
- source_word: μὴ δῷς ἔθνεσιν
  choice: 不要把我们交给列国
  rationale: δῷς字面为“给”，在此语境指交到列国手中或权下；宾语“我们”承接前句，在希腊文中省略，在汉语中补出才清楚自然。
- source_word: ἔθνεσιν
  choice: 列国
  rationale: ἔθνη在这篇犹太祷告的语境中指外邦各国。“列国”保留群体与政治性的广度，不将含义收窄为单纯宗教身份称谓。
