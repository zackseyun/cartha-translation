base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
translation:
  language: zh_hans
  text: 你必在你施助之时引导我们[a]，好怜悯雅各家，为着你应许给他们的那一日。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“指引我们”，也可理解为“使我们的道路正直”。希腊语动词兼有指明方向和使道路正直之意。
    reason: lexical_alternative
  - marker: b
    text: 末尾的希腊语动词词形有文本上的困难。正文依上下文理解为“你应许给他们”；若较按现存词形直译，也可能是“我应许给他们”。
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  choice: 你必……引导我们
  rationale: 该动词可指使道路正直、指引方向；在向上帝祈求的语境中，“引导”自然地保留神带领人行路的含义。
- source_word: ἐν καιρῷ ἀντιλήψεως σου
  choice: 在你施助的时候
  rationale: καιρός表示特定的时机或时期，ἀντίληψις表示帮助、扶助；“施助”既清楚又不过度收窄为“拯救”。
- source_word: τοῦ ἐλεῆσαι
  choice: 怜悯
  rationale: 属格不定式在此表达目的；汉语可直接用“怜悯”承接前句，而不必机械补出“为了”。
- source_word: τὸν οἶκον Ἰακώβ
  choice: 雅各家
  rationale: 保留原文的群体性盟约称谓及其经文色彩，不解释性地改写为“以色列”。
- source_word: εἰς ἡμέραν ἐν ᾗ
  choice: 直到……的那日
  rationale: εἰς带有朝向某个日子的前瞻意味；结合关系从句，译作“直到……的那日”比生硬的“为着那日，在其中”更符合现代汉语，同时保留目标日期的指向。
- source_word: ἐπηγγείλω αὐτοῖς
  choice: 你应许他们
  rationale: 传世词形有困难；上下文持续直接称呼上帝，故正文按第二人称理解，同时以脚注保留词形也可能被直读为第一人称的张力。
theological_decisions:
- issue: 是否将“雅各家”解释为“以色列”或“以色列民”
  choice: 正文保留“雅各家”
  alternative: 以色列；以色列民
  rationale: 希腊文明确使用“雅各家”，保留这一表达可维持原文的盟约和文学意象，避免加入解释性扩展。
- issue: 末尾动词的人称
  choice: 按语境译为“你应许他们”
  alternative: 我应许他们
  rationale: 祷告全句以第二人称称呼上帝，语境支持“你”；但现存希腊词形难解，故不掩盖另一种较字面的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“施助”保留原文一般性的帮助含义；“雅各家”维持圣经式集体称谓。脚注标记均置于正文相应位置。
