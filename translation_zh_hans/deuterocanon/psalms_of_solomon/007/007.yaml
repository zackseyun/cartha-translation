lexical_decisions:
- source_word: ἐπικαλεσόμεθαί
  choice: 要呼求
  rationale: ἐπικαλέω在祷告语境中表示向某位呼求或求告；“呼求”自然、庄重，并保留直接向上帝祈求的含义。
- source_word: σε
  choice: 你
  rationale: 按原文保留直接的第二人称宾语。
- source_word: ἐπακούσει
  choice: 必垂听
  rationale: ἐπακούω可指听见、听取或有利地听从祈求。“垂听”符合现代汉语的祷告语体，也保留了原词含有回应性聆听而未明确说“应允”的张力。
- source_word: ἡμῶν
  choice: 我们
  rationale: 原文在ἐπακούω之后使用属格；汉语自然表达为“垂听我们”，不增补“声音”或“祷告”等原文未明说的内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祷告用语。“也”对应καί，并与上文保持衔接；两个将来式分别译作“要”和“必”，体现人的行动与对上帝垂听的确信。脚注标记置于全句之后，说明“垂听”的词义选择。
