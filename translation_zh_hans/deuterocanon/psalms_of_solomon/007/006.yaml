  text: and no nation will prevail against us, because you are our defender.
translation:
  language: zh_hans
  text: 任何一国都不能胜过我们，因为你是我们的护卫者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: 不能胜过
  rationale: ἰσχύω 表示有力量或有能力；与 πρὸς ἡμᾶς 连用时带有对抗意味，译为“不能胜过”既自然，也准确表达无法在对抗中占上风。
- source_word: πρὸς ἡμᾶς
  choice: 胜过我们
  rationale: πρός 加宾格在表示力量或对抗的语境中可表达敌对关系；中文将其融入“胜过我们”，比直译为“向着我们”更符合原意。
- source_word: ἔθνος
  choice: 任何一国
  rationale: ἔθνος 是单数，可指一个国家或民族；在否定句中自然译作“任何一国”，传达没有一国能够胜过我们的普遍含义，同时不额外限定为“外邦”。
- source_word: ὑπερασπιστής
  choice: 护卫者
  rationale: 此名词指站出来保护、捍卫他人的人。“护卫者”保留名词性称号和保护意味，也符合诗歌中对上帝的庄重称呼。
theological_decisions:
- issue: 上帝保护的称谓
  choice: 因为你是我们的护卫者
  alternative: 因为你保护我们
  rationale: 原文用名词 ὑπερασπιστής 作为对上帝的称谓，而非单纯使用动词。“我们的护卫者”保留了原句凝练的宣认语气，不把称号改写为一般行动陈述。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句式紧凑，保留原文因果关系与对上帝直接称呼的第二人称形式；不将 ἔθνος 神学化为“外邦”。
