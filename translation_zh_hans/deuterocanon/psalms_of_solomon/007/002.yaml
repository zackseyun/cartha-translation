base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/002.yaml
  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: zh_hans
  text: 因为你已经弃绝了他们[a]，上帝啊；不要让他们的脚践踏你圣所的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经弃绝了”所译的希腊文形式较特殊；也有人把它理解为“你必击退他们”或祈求式的“求你击退他们”。
    reason: alternative_reading
  - marker: b
    text: “你圣所的产业”也可译作“你的圣洁产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσω
  choice: 已经弃绝了
  rationale: 按七十士译本常见的希腊化用法，视为未加增音的第二人称单数不定过去时中间语态直陈式，表达已经发生的行动；“弃绝”保留其排斥、推开的语义，同时不把它误作祈使句。
- source_word: μὴ πατήσαι
  choice: 不要让……践踏
  rationale: 将不定过去时愿望式理解为独立的否定愿望或祈求，而非表示目的的“免得”；“践踏”体现敌意侵犯和亵渎的力度。
- source_word: ὁ ποὺς αὐτῶν
  choice: 他们的脚
  rationale: 希腊文以单数“脚”作集合性表达；现代汉语“他们的脚”自然，也保留原文的单数形式。
- source_word: κληρονομίαν
  choice: 产业
  rationale: “产业”在圣经汉语中能够承载承受之业、归属和圣约背景，比单纯的“财产”更合适。
- source_word: ἁγιάσματός σου
  choice: 你圣所的
  rationale: 在遭受践踏的语境中取礼仪空间意义“圣所”；属格结构直译为“你圣所的”，保留与“产业”的关系。
theological_decisions:
- issue: ἀπώσω的语气和时态
  choice: 你已经弃绝了他们
  alternative: 求你击退他们／你必击退他们
  rationale: 该形式虽在拼写上可能引起歧义，但七十士译本的希腊化用法支持把它视为未加增音的不定过去时直陈式；因此正文不随祷告语境改写为祈使或将来。
- issue: κληρονομίαν ἁγιάσματός σου的关系
  choice: 你圣所的产业
  alternative: 你的圣洁产业
  rationale: 属格可理解为“圣所的产业”，也可能偏属性性地表达“圣洁的产业”；正文采用与亵渎圣所语境更契合的前者，并以脚注保存另一可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“上帝啊”保留直接呼告；分号区分原因陈述与随后独立的祈求。正文所有脚注标记均与脚注对应。
