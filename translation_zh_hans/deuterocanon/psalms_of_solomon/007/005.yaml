  text: When your name dwells in our midst[a], we will be shown mercy,
translation:
  language: zh_hans
  text: 当你的名住在我们中间时[a]，我们必蒙怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更贴近字面译作：“当你的名在我们中间搭起帐幕时。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατασκηνοῦν
  choice: 当……居住……时
  rationale: 将ἐν加冠词不定式理解为时间结构，表达“当……时”或“在……之际”；这样既符合希腊语句法，也使现代汉语自然清楚。
- source_word: κατασκηνοῦν
  choice: 居住
  rationale: 该动词可指搭帐篷、安营或居住。正文采用自然庄重的“居住”，脚注保留“支搭帐幕”的具体意象。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 按原文保留“名”，因为在圣经语境中它可承载上帝显现的临在、权柄和声誉等含义；不直接译成“你”或“你的临在”，以免消解隐喻及其张力。
- source_word: ἐν μέσῳ ἡμῶν
  choice: 在我们中间
  rationale: 这是自然、庄重的现代汉语，也准确保留共同体内部神圣临近的空间表达。
- source_word: ἐλεηθησόμεθα
  choice: 我们必蒙怜悯
  rationale: “蒙怜悯”自然体现将来被动语态，表明怜悯是被领受的；“必”表达将来陈述的确定语气，而不额外说明施动者。
theological_decisions:
- issue: “你的名”与上帝临在的关系
  choice: 正文直译为“你的名”，不改写为“你的临在”
  alternative: 当你临在我们中间时
  rationale: 原文以“名”为主语，可能指向上帝彰显的临在，但并未简单等同于“临在”；保留原有表达可避免过度解释。
- issue: 怜悯的施动者
  choice: 保留无明确施动者的被动式“蒙怜悯”
  alternative: 你必怜悯我们
  rationale: 希腊文使用将来被动式，语境很可能暗示上帝为施动者，但原句没有明说；不将其主动化，以保存原文形式和神学含蓄性。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“居住”适合作为正文用语；“支搭帐幕”置于脚注，以保存κατασκηνόω所带的帐幕意象。句末用“必蒙怜悯”保持诗体的凝练和礼仪感。
