  source_fidelity: “即使”把 ἐὰν 的普通条件句误作让步条件，且“也会”弱化了主句将来的确定性。“以致”在否定的“不会发怒”之后略显逻辑不顺。其余方面，正文将 θάνατον 译为“死亡”而未擅自具体化为“瘟疫”，是合乎原文的；用“它”处理阳性代词也符合现代汉语，脚注可说明其拟人化效果。
  naturalness: “你若差遣死亡，你必吩咐它如何对待我们”在现代庄重汉语中清楚自然，并保留死亡受命于上帝的图像。“不会发怒到把我们灭尽”自然表达原文发怒不至于造成彻底毁灭的含义。
  terminology: “差遣”“吩咐”“怜悯”“发怒”“灭尽”均适合经文语体。保留“死亡”优于将 θάνατος 解释性地译作“瘟疫”。
  issues:
