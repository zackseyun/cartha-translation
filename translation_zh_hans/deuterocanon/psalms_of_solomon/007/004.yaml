revisions:
- from: 因为即使你差来死亡[a]，也会吩咐它怎样对待我们；因为你有怜悯，不会发怒，以致将我们灭尽。
  to: 因为你若差遣死亡[a]，你必吩咐它如何对待我们；因为你有怜悯，不会发怒到把我们灭尽。
  rationale: 将让步性的“即使”改为条件性的“你若”，并以“你必”对应主句将来式。以“不会发怒到把我们灭尽”替代“不会发怒，以致将我们灭尽”，使否定句在现代汉语中更自然，同时保留发怒不至于导致彻底灭绝的意思。脚注删除非本句明示的瘟疫互文联想，集中说明阳性代词与拟人化。
