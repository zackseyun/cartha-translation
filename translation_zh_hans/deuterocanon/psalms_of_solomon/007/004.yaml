    rationale: ἐὰν γὰρ ἀποστείλῃς 是“因为你若/如果差遣”的开放条件，不是“即使你差来”的让步条件。
  - severity: low
    issue: 主句的将来确定性和末句汉语衔接可改善
    rationale: ἐντελῇ 为将来式，宜译“你必吩咐”；“不会发怒，以致……”在汉语中不如“不会发怒到……”顺畅，后者也保留原文所表达的程度/结果关系。
  - severity: low
