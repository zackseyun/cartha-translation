  yaml_path: translation/deuterocanon/psalms_of_solomon/007/004.yaml
  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
translation:
  language: zh_hans
  text: 因为你若差遣死亡[a]，你必吩咐它如何对待我们；因为你有怜悯，不会发怒到把我们灭尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡”在希腊文中为阳性名词，后文以阳性代词指代它；这可使死亡呈现为受命行事的拟人形象。
    reason: cultural_and_grammatical_note
lexical_decisions:
- source_word: ἐὰν γὰρ ἀποστείλῃς
  choice: 因为即使你差来
  rationale: ἐάν加虚拟语气表达条件；结合上下文，译作“即使”自然呈现假设意味。ἀποστέλλω直译为“差来”，保留死亡受上帝差遣的图景。
- source_word: θάνατον
  choice: 死亡
  rationale: θάνατος本义是“死亡”。虽可能令人联想到瘟疫性审判，但本句自身没有足够词汇依据将其限定为“瘟疫”。
- source_word: ἐντελῇ αὐτῷ περὶ ἡμῶν
  choice: 也会吩咐它怎样对待我们
  rationale: ἐντέλλομαι表示吩咐、下令；περὶ ἡμῶν字面为“关于我们”。汉语补出“怎样对待”，清楚表达死亡仍受上帝命令约束，同时不具体断定命令内容。
- source_word: ἐλεήμων
  choice: 有怜悯
  rationale: 直接表达上帝怜悯的属性，语体庄重而通顺。
- source_word: οὐκ ὀργισθήσῃ τοῦ συντελέσαι ἡμᾶς
  choice: 不会发怒，以致将我们灭尽
  rationale: 保留“发怒”与随后毁灭结果之间的张力；συντελέω在此指彻底终结、消灭，“灭尽”简洁地传达其完全性。
theological_decisions:
- issue: 死亡是否应具体译为瘟疫
  choice: 正文译“死亡”
  alternative: “瘟疫”
  rationale: θάνατος通常意为死亡；即使经文背景可能呼应由瘟疫带来的审判，也不宜把可能的互文解释直接写入正文。
- issue: 死亡的拟人化程度
  choice: 使用中性代词“它”，并在脚注说明希腊文形式
  alternative: 使用人格化的“他”
  rationale: 希腊文αὐτῷ为阳性，与阳性名词θάνατος一致，可能形成拟人效果，但也可能只是语法配合。现代汉语正文用“它”较自然，脚注保留原文现象。
translation_notes:
  register: 采用现代、庄重、易懂的经文语体。“差来死亡”保留原文鲜明意象；“吩咐它怎样对待我们”避免生硬的“就我们的事吩咐它”。脚注标记[a]已置于正文对应词后。
