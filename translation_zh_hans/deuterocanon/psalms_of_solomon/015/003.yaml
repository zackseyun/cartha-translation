translation:
  language: zh_hans
  text: 神啊，除了真诚地向你称谢的人，谁有力量呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἰσχύει
  choice: 因为……谁有力量
  rationale: 保留 γὰρ 的承接说明作用，也保留 ἰσχύω 所表达的力量或能力；中文采用反问句式，符合诗歌祷告语气。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 在此按直接呼语理解；“神啊”自然体现诗人向神祷告的语气。
- source_word: ἐξομολογήσασθαί σοι
  choice: 向你称谢
  rationale: 在七十士译本及犹太祷告语境中，ἐξομολογέομαι 接与格对象常指向神称谢、颂赞；这里不译作容易被狭义理解为认罪的“向你忏悔”。
- source_word: ἐν ἀληθείᾳ
  choice: 真实地
  rationale: 尽量保留 ἀλήθεια 的“真实、真诚”幅度，同时使现代汉语通顺；不把它限定为单纯的主观诚意。
- source_word: εἰ μὴ
  choice: 不是为了……呢
  rationale: 体现排除式反问“若非/除了”，并让不定式与 ἰσχύει 的能力含义在中文中保持关联。
theological_decisions:
- issue: ἐξομολογήσασθαι 在敬拜语境中的含义
  choice: 向你称谢
  alternative: 向你承认；向你颂赞
  rationale: 该词在圣经希腊文中可指公开承认、称谢或颂赞；本句以神为与格对象，且处在诗歌敬拜语境中，“称谢”最为合适，同时用脚注保留其他可能色彩。
- issue: ἐν ἀληθείᾳ 的范围
  choice: 真实地
  alternative: 真诚地；按真理
  rationale: 原文既可能强调真实无伪，也可能带有合乎真理的意味；正文用较开放的“真实地”，避免只解释成内心诚恳或客观教义。
- issue: ἰσχύει 与不定式之间的句法关系
  choice: 谁有力量……不是为了……呢
  alternative: 谁能……呢；谁是刚强的……呢
  rationale: 保留“力量”这一词汇意象及原句略显凝练的神学张力，不把它完全平化为普通的“能够”。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告诗体。“神啊”明确呼语；反问结构保留原文的凝练与张力。正文不将“称谢”缩窄为认罪，也不将“真实地”单一定义为主观真诚。
