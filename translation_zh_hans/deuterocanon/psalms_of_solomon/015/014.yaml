translation:
  language: zh_hans
  text: 当上帝以自己的审判临到大地时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。
    reason: 词义备选：γῆ可指普世的大地，也可指特定的土地或地域。
lexical_decisions:
- source_word: ὅταν
  choice: 当……时
  rationale: 与虚拟式动词构成时间从句；“当……时”自然地表达这里简洁而前瞻的语气，不必强化为反复发生的“每当”。
- source_word: ἐπισκέπτηται
  choice: 察看
  rationale: 该动词可指带着目的的探访、眷顾或鉴察。“察看”保留上帝亲自临到并采取行动的含义，又不预先把行动限定为恩惠或惩罚；其审判性质由后面的短语说明。
- source_word: τὴν γῆν
  choice: 大地
  rationale: γῆ既可指“地、土地”，也可指“大地”。此处没有明确限定某一地域，故正文采用范围较广的“大地”，并以脚注保留“这片土地”的可能。
- source_word: ἐν κρίματι αὐτοῦ
  choice: 在审判中
  rationale: 贴近希腊语介词结构，表达上帝察看大地时所处的司法性情境，同时避免擅自改写成目的性更强的“为了审判”。
theological_decisions:
- issue: 上帝“察看”的性质
  choice: 不把ἐπισκέπτηται明确译成“惩罚”或“眷顾”
  alternative: 惩罚／眷顾
  rationale: 该词本身可表示带目的的临到与介入，善恶方向需由语境决定；“在审判中”已提供司法色彩，正文不再额外收窄其神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子依原文保留为时间从句片段，以对应其与上下文相连的诗体结构；“察看”兼顾圣经语域和现代可懂度。
