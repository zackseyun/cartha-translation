  yaml_path: translation/deuterocanon/psalms_of_solomon/015/001.yaml
  text: When I was in distress[a], I called on the name of the Lord; I hoped for help from the God of Jacob[b], and I was saved.
translation:
  language: zh_hans
  text: 我遭受患难时[a]，求告了主的名；我仰望雅各之上帝的帮助[b]，我得了拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我受苦时”。
    reason: lexical_alternative
  - marker: b
    text: 也可较意译为：“我盼望雅各的上帝施以帮助。”
    reason: syntax_clarification
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: 我遭受患难时
  rationale: ἐν加带冠词的不定式在这里表达时间关系；θλίβεσθαι指身处压迫、苦难或困境。译文兼顾时间结构和患难处境。
- source_word: ἐπεκαλεσάμην
  choice: 求告了
  rationale: 该中间语态形式表示呼求、求告或祈求；“求告”自然保留了向上帝祷告求助的含义。
- source_word: τὸ ὄνομα Κυρίου
  choice: 主的名
  rationale: 直译这一固定的圣经表达；“求告主的名”指向对主自己的呼求，但不在正文中展开解释。
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: 我仰望雅各之上帝的帮助
  rationale: εἰς βοήθειαν是ἤλπισα所指向的对象，τοῦ θεοῦ Ἰακώβ修饰“帮助”，即“雅各之上帝的帮助”。此译法保留希腊文的句法关系，同时用“仰望”自然表达寄予盼望和信赖。
- source_word: ἐσώθην
  choice: 得了拯救
  rationale: 被动形式可表示获救、被救出或得拯救。“得了拯救”既能涵盖当下困境中的解救，也不把词义限定为某一种神学意义。
theological_decisions:
- issue: ἐσώθην所指拯救的范围
  choice: 得了拯救
  alternative: 被救了／得了解救
  rationale: 上下文可能着重于从患难中获救，但原词本身较宽泛；因此保留“拯救”的宽度，不明确限定为暂时性解困或终末性救恩。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“雅各之上帝”保留传统圣经称谓的凝练感；全句按希腊文的三个动作推进，并以“就”自然呈现求告、仰望与获救之间的叙事联系。
