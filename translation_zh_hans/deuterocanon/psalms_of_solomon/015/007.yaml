  text: when it goes out against sinners from the presence of the Lord[a], to destroy every possession of sinners.
translation:
  language: zh_hans
  text: 当它从主面前出来攻击罪人，为要毁灭罪人的一切财物时。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: 当……时
  rationale: 引出时间从句；既自然，也保留原文面向将来而未明确强调反复发生的语气。
- source_word: ἐξέλθῃ
  choice: 它……出来
  rationale: 希腊文的单数主语承接上文，本节没有明说；用“它”维持这种上下文衔接，不擅自指明具体所指。
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: 攻击罪人
  rationale: ἐπί与表示移动的动词连用，在此带有敌对、施行审判的方向；“攻击”比直译“临到”更清楚地传达语境。
- source_word: ἀπὸ προσώπου Κυρίου
  choice: 从主面前
  rationale: 贴近“从主的面/临在之前”的闪语式表达，同时符合庄重自然的现代汉语。
- source_word: ὀλεθρεύσαι
  choice: 要毁灭
  rationale: 不定式表示目的或结果；“要毁灭”保留句法联系和强烈的审判含义。
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: 罪人的一切产业
  rationale: ὑπόστασις在希腊化犹太文献中可指财产、所有物或赖以存立之物；“产业”在此自然地表达可被毁灭的全部财物，同时以脚注保留较宽的语义可能。
theological_decisions:
- issue: ἐξέλθῃ的隐含主语
  choice: 用中性代词“它”承接上文，不在本节中具体命名
  alternative: 补作“灾祸”“审判”或人格化为“他”
  rationale: 原文只以动词形态标示单数主语，其具体所指依赖上文；不应在本节擅自作神学或人格化判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“从主面前”保留原文的圣经式空间意象；句末“时”统摄整个时间从句，使本节作为承接上下文的从句保持原有未完结感。
