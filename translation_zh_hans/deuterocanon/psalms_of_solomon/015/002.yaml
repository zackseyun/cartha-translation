lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出前后文所述内容的理由或根据；“因为”直接保留希腊语的因果关系。
- source_word: ἐλπὶς
  choice: 盼望
  rationale: 该名词直接表示所寄托的希望；“盼望”在诗歌和信仰语境中自然庄重。
- source_word: καταφυγὴ
  choice: 避难所
  rationale: 表示逃往以求保护的庇护之处；“避难所”准确保留其地点及保护意象。
- source_word: τῶν πτωχῶν
  choice: 贫穷人的
  rationale: 属格表明“盼望和避难所”属于或惠及谁；“贫穷人”比宽泛的“困苦人”更直接保留社会经济层面的含义。
- source_word: σύ
  choice: 你是
  rationale: 强调第二人称主语；汉语名词谓语句在此加入“是”更清楚自然。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 带冠词的称谓在语境中作直接呼语；以“神啊”自然呈现呼告语气。
