  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: zh_hans
  text: 行这些事的人，永远不会因邪恶[a]或火的烈焰[b]而动摇；针对不义之人的震怒[c]也不会触及他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因邪恶”也可译作“因伤害”或“不受邪恶侵害”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译为“火的烈焰”；“火焰”在语法上承接前面的“因”，不是后半句的主语。
    reason: syntax_and_lexical_alternative
  - marker: c
    text: 或译“不义之人的愤怒”。希腊语属格既可能表示震怒所针对的对象，也可能表示发怒的人。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: 行这些事的人
  rationale: 以现代汉语的泛指单数表达名词化分词，并明确保留 ταῦτα 所回指的“这些事”。
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: 永远不会……动摇
  rationale: σαλεύω 的被动式表示被摇撼、失去稳固；εἰς τὸν αἰῶνα 加强否定的持久性。
- source_word: ἀπὸ κακοῦ
  choice: 因邪恶
  rationale: 将 ἀπό 理解为造成动摇的来源或原因；κακόν 保留其道德与毁灭性的宽广含义。
- source_word: φλογὸς πυρός
  choice: 熊熊烈火
  rationale: 以自然而有力度的汉语传达“火的烈焰”这一强调性表达；φλογός 的属格形式表明它承接前面的 ἀπό，而不是后句动词的主语。
- source_word: ὀργὴ ἀδίκων
  choice: 向不义之人发出的震怒
  rationale: 将 ἀδίκων 取作客观属格，即震怒所针对的人；这一理解也符合紧接下文所描述的审判语境，同时以脚注保留主观属格的可能性。
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: 也不会触及他
  rationale: ἅπτομαι 在此直译为“触及”，既自然，又保留灾祸无法临到此人的保护意象。
theological_decisions:
- issue: ἀπὸ κακοῦ 是指道德意义的“邪恶”，还是一般性的“伤害、灾祸”
  choice: 邪恶
  alternative: 伤害；灾祸
  rationale: κακόν 可兼有道德邪恶与有害之事的含义；正文采用较宽且保留伦理分量的“邪恶”，脚注注明其他可能。
- issue: ὀργὴ ἀδίκων 中属格 ἀδίκων 是主观属格还是客观属格
  choice: 向不义之人发出的震怒
  alternative: 不义之人的愤怒
  rationale: 希腊语形式本身容许两种关系；下一节将震怒与主面前针对罪人的审判相连，因此正文采用客观属格，但不消除另一种语法可能。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“行这些事的人”保持泛指；“熊熊烈火”避免生硬的“火的火焰”，同时由脚注交代原文形式。分号呈现两个并列的保护宣告。
