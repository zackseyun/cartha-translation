  text: Their inheritance will not be found for their children,[a]
translation:
  language: zh_hans
  text: 他们的产业必不为他们的儿女所得。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的产业必不在他们的儿女中找到”，意思是这产业不会传给他们的后代。
    reason: 希腊语与格 τοῖς τέκνοις 可表达归属、受益或承传关系，而“被找到”的措辞也可较为直译地保留。
lexical_decisions:
- source_word: κληρονομία
  choice: 产业
  rationale: 该词指承受而来的产业或继承物；“产业”在庄重的现代汉语中既保留财产与家族承传的含义，也适合本句语境。
- source_word: οὐχ εὑρεθήσεται
  choice: 必不……所得
  rationale: 这是 εὑρίσκω 的将来时被动形式，字面为“将不被找到”。汉语若直译为“不被找到”容易只表达搜寻未果；“不得”保留被动结果，并自然传达儿女最终不能得到这份产业。
- source_word: τοῖς τέκνοις αὐτῶν
  choice: 为他们的儿女
  rationale: 与“所得”组合为“为他们的儿女所得”，保留与格关系的宽度，可涵盖归属、受益或承传，而不把它限定为单纯的主动寻找。
