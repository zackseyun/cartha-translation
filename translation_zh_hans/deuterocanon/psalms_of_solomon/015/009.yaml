base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: zh_hans
  text: 因为他们必逃离虔诚人[a]，像被战事驱赶的人一样[b]；但他们必追赶罪人，将他们赶上。行不法之事的人必逃不过主的审判；他们必仿佛被老练的敌人擒获。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔诚人”或译“忠信的人”。
    reason: lexical_alternative
  - marker: b
    text: 这句希腊语较为紧缩，也可译作“像被战争追赶的人一样”。
    reason: alternative_reading
lexical_decisions:
- source_word: φεύξονται
  choice: 必逃离
  rationale: 表达将来的逃跑、退避，并与介词ἀπό所引出的对象自然衔接。
- source_word: ὡς διωκόμενοι πολέμου
  choice: 像被战事驱赶的人一样
  rationale: 希腊语结构紧缩；此译保留战争造成追逼、驱散的意象，同时避免把πολέμου过度具体化为某一支军队。
- source_word: ἀπὸ ὁσίων
  choice: 逃离虔诚人
  rationale: ὅσιος在本书中侧重敬虔、忠信的人；“虔诚人”既自然，也有别于通常表示“圣者”的ἅγιοι。
- source_word: καταδιώξονται
  choice: 必追赶
  rationale: 保留加强式动词的持续追逼意味，并与下文“赶上”形成顺畅的动作次序。
- source_word: καταλήψονται
  choice: 将他们赶上
  rationale: 在“追赶”之后，καταλαμβάνω最自然地表示追上、赶上，也与末句的被动形式有所区分。
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: 作恶不法的人
  rationale: 保留分词结构所表达的惯常行为；“作恶不法”兼顾ἀνομία的违法、悖逆意味和现代汉语可读性。
- source_word: τὸ κρίμα Κυρίου
  choice: 主的审判
  rationale: κρίμα可指审判或判决；“审判”在此涵盖司法行动与结果，不额外限定含义。
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: 他们必被擒获，如同落在久经战阵的敌人手中
  rationale: 被动的καταλαμβάνω在军事语境中自然译为“被擒获”；ἐμπείρων指有经验、老练，以“久经战阵”传达其军事经验。
theological_decisions:
- issue: τὸ κρίμα Κυρίου中κύριος的译法
  choice: 主的审判
  alternative: 上主的审判
  rationale: 希腊文本只有κύριος，并未明确出现神名；译作“主”既贴近原文，也不引入特定宗派的神名惯例。
- issue: ὅσιοι所指群体的称谓
  choice: 虔诚人
  alternative: 圣洁的人
  rationale: “虔诚人”突出ὅσιος的敬虔、忠信内涵，并避免与ἅγιοι常见的“圣者”用语混同，但不对该群体作宗派化界定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留连续的军事意象以及前两组复数主语在上下文中的指代，不擅自补明其具体对象；用分号和句号梳理较长的希腊语复句。
