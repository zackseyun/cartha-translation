  yaml_path: translation/deuterocanon/psalms_of_solomon/015/011.yaml
  text: And the inheritance of sinners is destruction and darkness, and their lawlessness will pursue them down to Hades.
translation:
  language: zh_hans
  text: 罪人的产业是灭亡和黑暗；他们的不法必一路追赶他们下到阴间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的不法必追赶他们，直到下方的阴间。”
    reason: 原文ἕως ᾅδου κάτω可按汉语方向结构译作“追赶他们下到阴间”，也可较字面地将κάτω理解为修饰“阴间”的“下方”。
lexical_decisions:
- source_word: κληρονομία
  choice: 产业
  rationale: 保留原词关于承受所得之份的具体意象；此处指罪人最终所得的结局。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 自然、直接地表达名词化的复数形式，不作不必要的扩充。
- source_word: ἀπώλεια
  choice: 灭亡
  rationale: 表达毁坏、丧亡的灾难性结局，在现代汉语中简洁而庄重。
- source_word: σκότος
  choice: 黑暗
  rationale: 保留原文的直接意象及其道德和末世意味。
- source_word: ἀνομία
  choice: 不法
  rationale: 保留该词违反律法、无视法度的含义，避免泛化为笼统的“邪恶”。
- source_word: διώξεται
  choice: 必追赶
  rationale: 体现将来时语气和持续追逐的拟人化意象，同时不误解为较狭义的“迫害”。
- source_word: ἕως ᾅδου κάτω
  choice: 一直追到下面的阴间
  rationale: “一直追到”体现ἕως的界限意义，“下面的”反映κάτω；“阴间”指死者所在之境，避免把ᾅδης直接等同于“地狱”。
theological_decisions:
- issue: ᾅδης应译为“阴间”还是“地狱”
  choice: 阴间
  alternative: 地狱
  rationale: 原文使用ᾅδης，所指首先是死者之境；“地狱”容易引入更特定的刑罚观念，并与γέεννα混同。
- issue: 是否把ἀνομία泛译为“罪恶”
  choice: 不法
  alternative: 罪恶
  rationale: “不法”保留原词与律法、法度的直接关联，也保留“罪人”与其“不法”之间的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现两个并列判断；“产业”保留承受所得的意象，“下面的阴间”刻意保留原文κάτω的向下空间感。
