  rationale: 本次仅作语言和脚注准确性修订：“永远”前置以自然、明确地限定“灭亡”，不改变其在原文中修饰该结果的理解；脚注b改正对εἰς τὸν αἰῶνα的字面说明；并删除“因为”后的不当逗号。
