  yaml_path: translation/deuterocanon/psalms_of_solomon/015/013.yaml
  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: zh_hans
  text: 因为罪行必使罪人的房屋荒凉[a]；罪人必在主审判的日子永远灭亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毁坏”或“使……荒废”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“直到永世”；此处译作“永远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: 罪行
  rationale: 复数在此指具体或累积的犯罪行为；译作“罪行”既保留复数的具体感，也能自然地作为“使……荒凉”的主语。
- source_word: ἐξερημώσουσιν
  choice: 必使……荒凉
  rationale: 该动词表示使某处荒废、无人居住或遭到毁坏；“使……荒凉”保留原文的强烈程度和庄重语气。
- source_word: οἴκους
  choice: 房屋
  rationale: 采用该词的基本意义，不擅自扩大为“家族”或“家室”；上下文并未要求转义。
- source_word: ἁμαρτωλῶν / ἁμαρτωλοὶ
  choice: 罪人的／罪人
  rationale: 前后使用同一词根，译文重复“罪人”，以保留原文的修辞呼应。
- source_word: ἀπολοῦνται
  choice: 必……灭亡
  rationale: 中间语态形式在此表达遭遇毁灭或归于灭亡；“灭亡”保留审判语境中的庄严与终局感，又不额外说明毁灭的方式。
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: 在主审判的日子
  rationale: 按自然汉语表达时间，并保留“主”与“审判”之间的属格关系，不改写为带有额外神学术语的固定称谓。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 这一惯用语在审判语境中表达持续而终局的结果；“直到永远”既自然，也较贴近原文置于句末的结构。
theological_decisions:
- issue: εἰς τὸν αἰῶνα（直到永远）的修饰范围
  choice: 将其置于句末，理解为修饰罪人的“灭亡”。
  alternative: 也可较宽泛地理解为加强整项审判陈述；更逐字可译作“直到那世代”。
  rationale: 该短语紧随罪人灭亡的分句，最自然地说明灭亡结果的持续性，而不是说“主审判的日子”本身永远延续。句末位置也保留了原文一定程度的结构张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“罪行”保留原文复数的具体意味；分号呈现两个并列而递进的审判陈述。所有脚注标记均紧随所说明的词语或短语。
