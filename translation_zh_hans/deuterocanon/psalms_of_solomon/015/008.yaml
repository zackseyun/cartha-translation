  text: ὅτι τὸ σημεῖον τοῦ θεοῦ ἐπὶ δικαίους εἰς σωτηρίαν· λιμὸς καὶ ῥομφαία καὶ θάνατος ἀπὸ δικαίων μακράν.
  language: Greek
