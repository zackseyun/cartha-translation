base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/008.yaml
  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
translation:
  language: zh_hans
  text: 因为上帝的记号[a]在义人身上，使他们得救；饥荒、刀剑和死亡[b]都远离义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”也可译作“标记”。
    reason: lexical_alternative
  - marker: b
    text: “死亡”在这类审判灾祸的并列语中，有时可指“瘟疫”。
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  choice: 记号
  rationale: “记号”既可指可辨认的标志，也保留其具体含义和开放性，并能与本诗后文同一词形成呼应。
- source_word: δικαίους / δικαίων
  choice: 义人
  rationale: 这里泛指公义的人；“义人”是现代中文圣经语体中自然、简洁的类别称呼。
- source_word: εἰς σωτηρίαν
  choice: 使他们得救
  rationale: 表达εἰς所指向的拯救结果；补出“他们”使中文自然，其所指由“义人”明确限定。
- source_word: λιμός
  choice: 饥荒
  rationale: 在与刀剑、死亡并列的灾祸清单中，“饥荒”比“饥饿”更准确。
- source_word: ῥομφαία
  choice: 刀剑
  rationale: “刀剑”是中文圣经语体中表示战争杀戮之剑的自然译法，也适合灾祸清单。
- source_word: θάνατος
  choice: 死亡
  rationale: 保留希腊词最直接、最宽泛的意义；虽然在审判灾祸清单中可能特指瘟疫，但本节自身不足以排除一般的“死亡”。
- source_word: μακράν
  choice: 远离
  rationale: 自然表达这些灾祸与义人相隔甚远的状态。
theological_decisions:
- issue: 上帝的记号与拯救之间的关系
  choice: 使他们得救
  alternative: 为要拯救他们／作为得救的记号
  rationale: 译文保留记号指向拯救的目的或结果，不进一步断定该记号本身具有何种机制或礼仪性质。
- issue: θάνατος在灾祸清单中的含义
  choice: 死亡
  alternative: 瘟疫
  rationale: “瘟疫”可能呼应犹太经典中的固定灾祸三联语，但现存希腊文本写的是通常表示“死亡”的θάνατος；正文采用宽义，脚注保留特指瘟疫的可能。
translation_notes:
  register: 采用现代、庄重而易懂的中文；保留原文前后两分句的对照结构。用分号连接“得救”与灾祸远离义人的陈述，并避免将“记号”解释成特定宗派性的礼仪或教义概念。
