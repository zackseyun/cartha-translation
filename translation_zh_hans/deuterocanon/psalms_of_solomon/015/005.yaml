  yaml_path: translation/deuterocanon/psalms_of_solomon/015/005.yaml
  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
translation:
  language: zh_hans
  text: 一篇新的诗篇，伴着歌唱，带着心中的喜乐；嘴唇的果实，配以与舌头相配、调和得宜的乐器[a]；嘴唇的初熟之果[b]，出自圣洁而公义的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在与舌头相关、调和得宜的器具中”。希腊语结构紧凑，γλώσσης（“舌头的”）与“器具”的关系可以理解为“与舌头相配的器具”，也可理解为“以舌头为调和得宜的器具”。
    reason: lexical_alternative
  - marker: b
    text: “嘴唇的果实”和“嘴唇的初熟之果”保留了原诗的收成与奉献意象，并非仅指一般言语。
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινὸν
  choice: 一首新诗
  rationale: ψαλμός在此指宗教诗歌或诗篇；“新诗”既自然，也保留其诗篇体裁和καινός“新的”之义。
- source_word: μετὰ ᾠδῆς
  choice: 伴着歌唱
  rationale: μετά表示伴随，ᾠδή意为歌或歌唱；此译比音译式的“颂歌”更符合现代汉语。
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: 满怀内心的喜乐
  rationale: εὐφροσύνη表示欢喜、喜乐，καρδίας指出这种喜乐发自内心；译文以自然汉语保留其内在来源。
- source_word: καρπὸν χειλέων
  choice: 嘴唇的果实
  rationale: 直译并保留圣经诗歌中以“果实”比喻口中言语或赞美的意象，不将其简化为“话语”。
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  choice: 配以舌头这调和得宜的乐器
  rationale: ὄργανον是器具或乐器，ἤρμοσμένῳ可指配合、调和或调音得宜；希腊语结构紧凑，此译保留“舌头—乐器”的诗性关联，同时使中文可懂。
- source_word: ἀπαρχὴν χειλέων
  choice: 嘴唇的初熟之果
  rationale: ἀπαρχή指初熟之物或初献之物；“初熟之果”保留献祭与奉献的背景意象。
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: 出自圣洁公义的心
  rationale: ἀπό表示来源；ὁσία兼有圣洁、虔敬之意，δικαία意为公义、正直。“圣洁公义”保留原文并列的宗教和伦理意味。
theological_decisions:
- issue: “嘴唇的果实”和“初熟之果”的奉献意象
  choice: 保留果实与初熟之果的比喻
  alternative: 意译为“口中的赞美”或“嘴唇献上的赞美”
  rationale: 原文将口中发出的言语描绘为果实和初献之物；直接保留意象，避免把其含义限定为某一种敬拜行为。
- issue: γλώσσης与ὀργάνῳ的关系
  choice: 译为“舌头这……乐器”
  alternative: 译为“舌头的乐器”或“适合舌头的器具”
  rationale: 原文属格结构存在压缩性，可能表达舌头本身如同调和得宜的乐器，也可能是属于或适配舌头的器具。正文采用中文中最易理解的诗性表达，脚注说明其字面结构，未据此引申特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留原文分号串联的名词性短语及“果实—初熟之果”的平行意象。为避免生硬，ἐν εὐφροσύνῃ καρδίας译作“满怀内心的喜乐”，紧凑而多义的乐器短语则在正文中作适度显明，并以脚注保存较字面的可能译法。
