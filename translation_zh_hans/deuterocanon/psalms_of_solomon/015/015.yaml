  text: οἱ δὲ φοβούμενοι τὸν κύριον ἐλεηθήσονται ἐν αὐτῇ, καὶ ζήσονται ἐν τῇ ἐλεημοσύνῃ τοῦ θεοῦ αὐτῶν καὶ ἁμαρτωλοὶ ἀπολοῦνται εἰς τὸν αἰῶνα χρόνον.
