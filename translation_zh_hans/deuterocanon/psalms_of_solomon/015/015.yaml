  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: zh_hans
  text: 但敬畏主的人必在其中蒙怜悯[a]；他们必靠着他们的上帝的怜悯存活，罪人却必永远灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在其中”。这很可能指前文提到的主施行审判之日，但也可能回指上一行的地或大地。
    reason: 保留代词先行词的歧义。
lexical_decisions:
- source_word: φοβούμενοι
  choice: 敬畏……的人
  rationale: 该分词在此作名词用，指以敬畏主为特征的一群人；“敬畏”兼顾畏惧与虔敬，符合诗篇体裁中的宗教含义。
- source_word: κύριον
  choice: 主
  rationale: “主”是 κύριος 在敬拜和神学语境中的自然、庄重译法。
- source_word: ἐλεηθήσονται
  choice: 必……蒙怜悯
  rationale: 保留将来被动语态，表明怜悯是他们所领受的，而非自己取得的。
- source_word: ἐν αὐτῇ
  choice: 在其中
  rationale: 希腊文只用阴性代词，并未在本节明说所指；直译“在其中”可避免在正文中把歧义限定为“那日”或“地上”。
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: 靠着……的怜悯
  rationale: 此处 ἐλεημοσύνη 指上帝的怜悯或施怜悯的行动，而非周济；“靠着”自然表达这种怜悯是他们存活的凭借。
- source_word: ἀπολοῦνται
  choice: 必……灭亡
  rationale: “灭亡”庄重而清楚，适合审判语境，也不额外规定灭亡的具体方式。
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: 永远
  rationale: 该短语强调持续无尽的时间；“永远”是现代汉语中简洁自然的对应表达。
theological_decisions:
- issue: αὐτῇ 的先行词
  choice: 正文保留“在其中”，不明确指定先行词。
  alternative: 可理解为前文所说主审判的“日”，译作“在那日”；也可能回指上一行的“地／大地”。
  rationale: 阴性代词本身没有重述先行词，而两个理解在语法和上下文上皆有依据。保留代词并以脚注说明，可避免消除原文真实存在的歧义。
- issue: ἐν τῇ ἐλεημοσύνῃ 所表达的关系
  choice: 译作“靠着他们上帝的怜悯存活”，理解为使他们得以存活的凭借。
  alternative: 也可较形式化地译作“在他们上帝的怜悯中活着”，将其理解为所处的领域或境况。
  rationale: 介词 ἐν 可表达凭借或范围；中文“靠着”在此更通顺，同时没有把上帝的怜悯解释为人的功德。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“必……蒙怜悯／必……存活／必……灭亡”保持将来审判的力度；分号呈现敬畏主者与罪人的鲜明对照。
