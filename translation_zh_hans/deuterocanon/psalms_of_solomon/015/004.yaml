  text: 人除了称谢[a]你的名以外，还能做什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宣认”或“赞美”。希腊文动词可按语境表达宣认、赞美或感谢。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: 什么
  rationale: 用作疑问代词，所问的是人有能力做什么，而不是某人的身份。
- source_word: δυνατὸς
  choice: 能做
  rationale: 此处表达能力或可能性，并非身体强壮；补出“做”符合现代汉语习惯，也保留原文隐含的行动意味。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 保留希腊文泛指人的单数形式；现代汉语的“人”可自然涵盖所有人。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 在这个反问句中构成例外关系，意思是人所能做的唯有下文所说的事。
- source_word: ἐξομολογήσασθαι
  choice: 称谢
  rationale: 该动词可表示宣认、赞美或感谢；与上帝的名连用时，“称谢”自然体现带着感恩的颂赞，同时以脚注保留其词义幅度。
- source_word: τῷ ὀνόματί σου
  choice: 你的名
  rationale: “称谢你的名”是自然且庄重的汉语圣经表达，也保留行动以神的名为指向的原文意象。
