base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/007.yaml
  text: Restrain me[a], O God, from evil sin and from every evil woman who causes a foolish man to stumble.
translation:
  language: zh_hans
  text: 上帝啊，求你约束我[a]，使我远离邪恶的罪，也远离一切使愚昧的男人跌倒的邪恶妇人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你掌管我，使我远离”。
    reason: 保留ἐπικρατέω“掌控、支配”的较字面意义，以及它与ἀπό连接方式的歧义。
lexical_decisions:
- source_word: ἐπικράτησόν μου ... ἀπό
  choice: 求你约束我，使我远离
  rationale: ἐπικρατέω本义涉及掌控、辖制或取得支配；与ἀπό连用时，此处祈求上帝管束诗人，使他远离随后的罪与诱惑。这样既表达动词的支配力，也符合自然汉语。
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  choice: 远离邪恶的罪
  rationale: ἀπό表示分离；πονηρά在此具有明确的道德恶义。“邪恶的罪”保留原文的强烈修饰，且不把单数无冠词结构过度限定为某一项特定罪行。
- source_word: καὶ ἀπὸ πάσης γυναικὸς πονηρᾶς
  choice: 也远离一切……恶妇
  rationale: πάσης加单数名词表达周遍意义，译作“一切”。“恶妇”简洁保留γυνή的女性所指和πονηρά的道德评价。
- source_word: σκανδαλιζούσης
  choice: 使……跌倒的
  rationale: σκανδαλίζω带有使人绊跌、陷入罪中的意象；“使……跌倒”在现代汉语中仍可自然承载其伦理含义。
- source_word: ἄφρονα
  choice: 愚昧人
  rationale: ἄφρων指缺乏理智或智慧的人。希腊语形式为阳性单数，但在宾格中可作实体化形容词；“愚昧人”保留其智慧伦理色彩，并避免无根据地增添原文没有的ἀνήρ。
theological_decisions:
- issue: ἐπικράτησόν μου与ἀπό的关系
  choice: 约束我，使我远离
  alternative: 掌管我，使我离开
  rationale: 主译文采用符合语境的约束义，同时用脚注保留较形式对应的“掌管”理解，不把可能的希伯来式表达完全单义化。
- issue: ἄφρονα的性别表达
  choice: 愚昧人
  alternative: 愚昧的男人
  rationale: 阳性形式可能泛指一名愚昧者；原文未使用专指成年男性的名词。译作“愚昧人”保留人物所指而不作超出文本的性别强化。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“上帝啊，求你……”自然对应呼格与命令式祈求；句式保留原文两次ἀπό所形成的并列层次。
