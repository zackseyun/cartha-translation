  yaml_path: translation/deuterocanon/psalms_of_solomon/016/010.yaml
  text: Clothe my tongue and my lips with words of truth[c][b][a]; keep anger and senseless wrath far from me.
translation:
  language: zh_hans
  text: 求你用真实的话语包裹我的舌头和嘴唇[a]；使怒气和无理的暴怒远离我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “包裹”或译“围住”、“护住”或“约束”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περίστειλον
  choice: 包裹
  rationale: 该动词具有围绕、裹住或披覆之意。“包裹”保留具体而诗意的形象，也没有把祷告的含义过早限定为单纯“约束”言语。
- source_word: γλῶσσάν μου καὶ τὰ χείλη μου
  choice: 我的舌头和嘴唇
  rationale: 直译两个身体部位，保留原文的并列意象和诗歌表达，不笼统改写为“我的言语”。
- source_word: ἐν λόγοις ἀληθείας
  choice: 用真实的话语
  rationale: 保留λόγοις的复数意义，并以自然的现代汉语表达工具或环绕内容；“真实”既可指真实无伪，也避免把ἀληθεία只限定为抽象教义意义上的“真理”。
- source_word: ὀργὴν
  choice: 怒气
  rationale: 采用常用而清楚的对应词，并与后面的θυμός保持近义而不完全重合。
- source_word: θυμὸν ἄλογον
  choice: 无理的暴怒
  rationale: “暴怒”表现θυμός较强烈的情绪力度；“无理”传达ἄλογος所含不合道理、缺乏理性的意思。
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: 使……远离我
  rationale: 贴近原文“使之离我甚远”的结构，同时符合现代汉语祷告语体。
