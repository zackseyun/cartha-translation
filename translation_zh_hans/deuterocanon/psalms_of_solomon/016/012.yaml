  text: εὐδοκία δὲ μετὰ ἱλαρότητος στήρισον τὴν ψυχήν μου· ἐν τῷ ἐνισχῦσαί σε τὴν ψυχήν μου ἀρκέσει μοι τὸ δοθέν.
