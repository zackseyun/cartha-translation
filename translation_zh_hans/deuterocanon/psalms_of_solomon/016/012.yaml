  yaml_path: translation/deuterocanon/psalms_of_solomon/016/012.yaml
  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: zh_hans
  text: 但求你以恩惠[a]和喜乐坚固我的心灵；当你使我的心灵刚强时，所赐的便足够我了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“善意”或“美意”。
    reason: lexical_alternative
  - marker: b
    text: “足够我了”也可译作“于我必够用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: 恩惠
  rationale: 该词可指善意、悦纳或恩宠。在祈祷语境中，“恩惠”自然地表达施恩的厚意，同时不把词义限定为某种专门神学概念。
- source_word: ἱλαρότητος
  choice: 喜乐
  rationale: 该词表达欢欣、明朗愉悦的状态；“喜乐”庄重、易懂，也适合祷告语体。
- source_word: στήρισον
  choice: 使……坚定
  rationale: 该动词有使稳固、坚立之意；译作“使……坚定”保留稳定、坚固的意味，并与后句ἐνισχύω的“使……刚强”有所区分。
- source_word: ψυχήν
  choice: 心
  rationale: ψυχή在此指人的内在生命或自我。现代汉语祷告语境中，“心”比直译“灵魂”更自然，同时能表达内在之人的含义。
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: 你使……刚强时
  rationale: ἐν加冠词不定式可表达时间或伴随情形；“……时”清楚保留其时间性，也不过度排除伴随意味。
- source_word: ἀρκέσει μοι
  choice: 就足够我了
  rationale: 未来时动词表示将能满足或够用；此译法符合现代汉语，也保留对说话者而言已经充足的含义。
- source_word: τὸ δοθέν
  choice: 所得的
  rationale: 中性单数实词化分词泛指“所赐予的（事物）”。“所得的”保持对象未明的开放性，避免擅自明确为某一种“恩赐”。
theological_decisions:
- issue: εὐδοκία的施事与关系
  choice: 译为“求你以恩惠……”，按祷告语境理解为来自上帝的恩惠
  alternative: 译为“以善意”或“以美意”，不明确其为恩惠
  rationale: 原句向第二人称发出祈求，工具或伴随意义的表达自然指向受祈求者所施的善意；“恩惠”符合语境，但脚注保留“善意／美意”的词义可能。
- issue: τὸ δοθέν所指为何
  choice: 保持为未明确的“所得的”
  alternative: 解释为“所得的恩赐”或特指上帝所赐之物
  rationale: 原文只用实词化的被动分词，并未说明所赐之物的性质；因此不在正文中作神学性具体化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。用“心”表达ψυχή的内在之人含义；分别以“坚定”和“刚强”呈现στήρισον与ἐνισχῦσαί的词义差别。脚注标记均置于正文相应位置。
