  yaml_path: translation/deuterocanon/psalms_of_solomon/016/005.yaml
  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: zh_hans
  text: 上帝啊，我要称谢你，因为你扶助我，使我得救；你没有把我与那些罪人一同算作要灭亡的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: 我要称谢
  rationale: 在向上帝祷告的语境中，此词表达感恩和颂赞，而非认罪；“称谢”既庄重又符合现代中文圣经语体。
- source_word: ἀντελάβου μου
  choice: 你扶助我
  rationale: ἀντιλαμβάνομαι在此表示伸手援助、扶持；“扶助”保留一定的具体意象，也清楚表达神的帮助，并与上下文中的“帮助者”语义相连。
- source_word: εἰς σωτηρίαν
  choice: 使我得救
  rationale: 该介词短语可表示援助的目的或结果；译成“使我得救”比生硬的“为了救恩”更自然，同时保留σωτηρία的拯救含义。
- source_word: οὐκ ἐλογίσω με
  choice: 你没有把我列在
  rationale: λογίζομαι在这里有计算、归入或视为某类成员之意；“列在……中”自然呈现被归入某一群体的司法性或评断性色彩。
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: 那些罪人中
  rationale: 冠词τῶν可指语境中可识别的一群罪人；“那些罪人”保留这种特指可能性，而不把它弱化为泛指所有犯罪的人。
- source_word: εἰς ἀπώλειαν
  choice: 使我灭亡
  rationale: 此短语指出被列入罪人之列所趋向的结局；“使我灭亡”自然表达目的或结果，同时保留ἀπώλεια的强烈语义。
theological_decisions:
- issue: “罪人”是泛指道德类别，还是特指诗篇语境中的某一群体
  choice: 那些罪人
  alternative: 罪人
  rationale: 希腊文有定冠词，且本书语境可能把“罪人”作为特定群体称谓；译文保留特指性，但不在正文中进一步认定其具体历史身份。
- issue: εἰς短语表达目的还是结果
  choice: 分别译为“使我得救”和“使我灭亡”，允许兼具目的与结果意味
  alternative: 为了得救；走向灭亡
  rationale: 希腊文两处εἰς均可能涵盖目的、趋向或结果；中文采用自然表达，不把语义严格限定为单一逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“上帝啊”直接对应呼格；全句保持前后对称：“扶助我，使我得救”与“没有把我列在……中，使我灭亡”形成鲜明对照。
