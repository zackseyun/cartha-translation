  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: zh_hans
  text: 他像用赶马的刺棒那样刺了我一下，为使他警醒〔a〕；我的救主和扶助者在一切时候救了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνυξέν
  choice: 刺醒
  rationale: 该动词本义为“刺、扎”；结合后面的警醒目的，以“刺醒”既保留鲜明动作，也符合现代汉语表达。
- source_word: ὡς κέντρον ἵππου
  choice: 像用赶马刺一样
  rationale: κέντρον 可指刺棒、赶牲口的刺；属格 ἵππου 表明用于马，译作“赶马刺”避免误解为马自身的刺。
- source_word: ἐπὶ τὴν ἐγρήγορσίν αὐτοῦ
  choice: 使我警醒
  rationale: ἐγρήγορσις 表示警醒、醒觉。αὐτοῦ 的指向或属格关系在此不够明确，不宜按英文修订层强行译为“为他”；正文采用自然且不过度解释的目的表达。
- source_word: ἀντιλήμπτωρ
  choice: 扶助者
  rationale: 表示扶持、援助之人；“扶助者”庄重且贴近原词的施助含义。
- source_word: ἐν παντὶ καιρῷ
  choice: 时时
  rationale: 直指“在一切时候”，用“时时”自然凝练，并保留持续、普遍的时间范围。
theological_decisions:
- issue: ὁ σωτὴρ καὶ ἀντιλήμπτωρ μου 的身份与关系
  choice: 我的救主、我的扶助者
  alternative: 那位救我、扶助我的
  rationale: 保留两个带冠词的称谓及其并列关系，不将其改写为动作，也不额外明示原文没有写出的神名。
- issue: αὐτοῦ 的解释
  choice: 正文不明示其所指
  alternative: 使我为他警醒／使我因他的警醒而醒悟
  rationale: 希腊语形式允许不同理解，且上下文所指不够明确；避免把咨询层的“为他”提升为唯一释义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“刺醒”传达赶马刺带来的突然警觉；分号保留两分句之间由经历转向认信的结构。
