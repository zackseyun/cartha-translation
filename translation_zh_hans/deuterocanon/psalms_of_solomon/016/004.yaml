  rationale: 修订恢复了原文 αὐτοῦ 所表达的第三人称成分，并以脚注透明说明其所指与构式的困难，而不把某一种解释当作定论。同时将 κέντρον 译为“赶马的刺棒”，避免“马刺”的现代器物歧义；保留救主与扶助者两个并列称谓及“在一切时候”的时间范围。
