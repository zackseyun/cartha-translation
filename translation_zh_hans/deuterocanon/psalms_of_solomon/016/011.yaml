review_pass:
  verdict: revise
  source_fidelity: 正文将条件语气译为“若”较合ἐάν；但原稿把εἰς ἐπιστροφήν处理为并列的“使我回转”，略弱化其作为管教目的的关系。修订以“为使我回转而管教我”明确保留该目的关系。对于现存ἁμαρτήσῃς的第二人称，正文仍采用上下文所要求的第一人称理解，但脚注须以更中性的文本说明保留这一争议，避免将推断表述为定论。
  naturalness: 原稿总体庄重自然。修订调整为“在我犯罪、你为使我回转而管教我时”，使条件、管教和目的在普通话中关系更清楚；“患难中的抱怨和灰心”保留原文处境限定。
  terminology: “抱怨”“灰心”“患难”“管教”“回转”均符合现代庄重祷告语体。“回转”保留ἐπιστροφή可指转回／悔改的较宽含义，未强加术语化解释。
  issues:
  - severity: medium
    issue: εἰς ἐπιστροφήν的目的关系未充分显明
    rationale: “在你管教我、使我回转的时候”可被读成两个同等的时间性动作；εἰς更明确地表明管教所指向的目的，应译出“为使我回转而管教我”或等值表达。
  - severity: low
    issue: 脚注以“文本讹误”和“神学疑难”表述过于断定且带解释性
    rationale: 现存第二人称形式确实造成上下文困难，但仅凭此节不能确定其为讹误。脚注宜说明传世读法及正文的上下文性处理，不把文本判断或神学判断说成既定事实。
  revised_text: 求你在我犯罪、你为使我回转而管教我时，使患难中的抱怨和灰心远离我。[a]
  revised_footnotes:
  - marker: a
    text: 现存希腊文作第二人称：“你若犯罪”；ἁμαρτάνω也可按较宽词义理解为“犯错”或“失误”。这一读法在本句祷告语境中难以解释；正文依上下文按“我若犯罪”译出。
    reason: 保留传世希腊文第二人称形式及其文本困难，同时明确正文采用第一人称理解是基于上下文，而非将该判断当作确定的校勘结论。
  revision_rationale: 修订保留原文祷告的命令式、患难处境、两个并列的消极状态、条件性犯罪和管教的回转目的。正文对疑难第二人称采取上下文性理解，脚注如实保留传世读法及其不确定性；并将εἰς ἐπιστροφήν明确译为管教所指向的目的。
