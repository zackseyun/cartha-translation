review_pass:
  verdict: revise
  source_fidelity: 现存希腊文的ἁμαρτήσῃς是第二人称单数，正文将其改作“我若犯罪”属于未经明示的校改。即使第一人称在上下文中较为顺畅，传世文本的困难读法应在正文中保留，或至少不应以正文确定地消除。其余部分准确反映了祈使语气、患难中的两种心态、以及管教导向回转的含义。
  naturalness: 原译中文自然、庄重；修订后虽保留了原文造成的不寻常表达，仍采用“犯错”而非“犯罪”以使句子可读，并由脚注说明其文本困难。
  terminology: “抱怨”“灰心”“患难”“管教”“回转”均恰当。“使我回转”可表达εἰς ἐπιστροφήν的目的/趋向；将其置于“管教我、使我回转”中自然清楚。
  issues:
  - severity: high
    issue: 正文将第二人称ἁμαρτήσῃς译为第一人称“我若犯罪”。
    rationale: 这不是单纯的语序或词义选择，而是改变了传世希腊文本的人称。脚注虽披露问题，但正文仍以推定的校改取代了现存文本；面对有争议的文本，应保留其歧义和困难，并在脚注说明可能的第一人称原意。
  revised_text: 若你在管教我、使我回转时犯错[a]，求你使患难中的抱怨和灰心远离我。
  revised_footnotes:
  - marker: a
    text: 现存希腊文为第二人称：“若你……犯错”（也可译“若你犯罪”）。这在祷告语境中颇为困难；有些解释认为原文可能曾为第一人称，意为“我若犯罪”。
    reason: 保留传世文本的第二人称及其歧义，同时说明上下文较顺的第一人称理解，不将推定校改当作确定正文。
  revision_rationale: 修订仅恢复现存希腊文第二人称所造成的真实文本困难，并以脚注呈现第一人称的可能解释。保留“犯错”以对应ἁμαρτάνω可有的“失误”义，避免在正文中不必要地把该困难预先定性为特定神学结论。
