base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: zh_hans
  text: 我若犯罪[a]，在你管教我、使我回转的时候，求你使患难中的抱怨和灰心远离我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文直译为“你若犯罪”，也可按ἁμαρτάνω的较宽词义译作“你若犯错”。这里可能存在文本讹误；正文依上下文译作“我若犯罪”。
    reason: 保留传世希腊文第二人称动词形式所造成的真实文本与神学疑难，同时说明正文采用第一人称读法的依据。
lexical_decisions:
- source_word: γογγυσμόν
  choice: 抱怨
  rationale: 指低声埋怨或心怀不满；“抱怨”是现代汉语中自然清楚的表达，也保留了消极抗拒的意味。
- source_word: ὀλιγοψυχίαν
  choice: 灰心
  rationale: 该词本义近于“心志狭小、勇气不足”，在此指受苦时丧失勇气；“灰心”简明自然，又不把它过度解释为严重绝望。
- source_word: ἐν θλίψει
  choice: 患难中
  rationale: θλῖψις表示压迫、困苦或患难；“患难中”符合祷告语体，并自然修饰抱怨和灰心出现的处境。
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: 使……远离我
  rationale: 贴近原文“使之与我相距遥远”的祈使表达，在汉语中庄重而自然。
- source_word: ἐὰν ἁμαρτήσῃς
  choice: 我若犯罪[a]
  rationale: 现存希腊文动词形式是第二人称“你若犯罪”，但这会把犯罪归于受祷告者，并与上下文所期待的说话者犯罪、受管教的意思冲突。正文采用上下文顺畅且很可能反映原意的第一人称读法，同时以脚注保留传世文本的真实疑难。
- source_word: ἐν τῷ σε παιδεύειν
  choice: 在你管教我的时候
  rationale: ἐν τῷ加不定式表达时间关系，σε明确是不定式的主语“你”；宾语依祷告上下文补作“我”。
- source_word: εἰς ἐπιστροφήν
  choice: 使我回转
  rationale: ἐπιστροφή可指转回、归回或悔改；结合εἰς的目的或方向含义，译为“使我回转”既具体自然，也不把含义限缩为一种术语化的悔改观。
theological_decisions:
- issue: 现存文本似乎说受祷告者“犯罪”
  choice: 正文按上下文译作“我若犯罪”，并用脚注注明希腊文的第二人称形式
  alternative: 你若犯罪（或：你若犯错）
  rationale: 不应把神学困难静默消除，也不宜在正文中直接说受祷告者犯罪而使祷告难以理解。正文采用很可能源于抄写讹误的第一人称意义，脚注则公开保留传世希腊文的歧义与张力。
- issue: εἰς ἐπιστροφήν所表达的管教目的
  choice: 管教我、使我回转
  alternative: 为悔改而管教我
  rationale: “回转”保留ἐπιστροφή的动作意象和较宽语义，不额外引入特定宗派对悔改的定义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“患难中的抱怨和灰心”保持两个并列心理状态与患难处境的联系；语序略作调整，使条件和时间成分在普通话中清楚自然。
