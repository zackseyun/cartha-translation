  yaml_path: translation/deuterocanon/psalms_of_solomon/016/008.yaml
  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: zh_hans
  text: 不要让不法女子的美貌欺骗我；也不要让受无益之罪支配的一切事物的美欺骗我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受……支配”译自希腊文ὑποκειμένου，字面可指“在……之下”或“受……管辖”。此处的压缩结构也可理解为“由无益之罪而来的、摆在面前的一切事物之美”；原文没有明说是摆在谁面前。
    reason: 说明ὑποκειμένου及其与ἀπὸ ἁμαρτίας ἀνωφελοῦς的关系存在的语义压缩，同时避免添加原文没有的“我面前”或把罪确定为“摆放”的施事。
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: 不要让……欺骗我
  rationale: 以“不要让……欺骗我”自然表达希腊语否定命令／祈愿语气，并保留第一人称祷告的口吻。
- source_word: κάλλος γυναικὸς παρανόμου
  choice: 不法女子的美色
  rationale: κάλλος指美貌；παράνομος带有违背律法和道德规范的意味。“不法”保留其宗教伦理分量，“美色”则符合本处诱惑语境。
- source_word: παντὸς ὑποκειμένου
  choice: 摆在我面前的任何事物之美
  rationale: παντός为属格，最可能与γυναικός并列，同受κάλλος支配；译文补出“之美”，以呈现这一语法关系。ὑποκειμένου在此按“摆在面前”理解，但原文结构压缩，故另加脚注保存另一种可能。
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: 毫无益处的罪
  rationale: ἀνώφελος意为无益、无用；“毫无益处”贴近原义而又自然。ἀπό按来源理解，即所摆在面前之物源于罪。
theological_decisions:
- issue: 第二分句是否仍由“美色／美”统摄
  choice: 把παντὸς ὑποκειμένου视为属格，与γυναικὸς παρανόμου并列，并补出“之美”
  alternative: 把παντὸς ὑποκειμένου视为另一个使“我”受骗的对象，即“任何摆在我面前的事物”
  rationale: 希腊文的属格形式支持其依附于κάλλος，但省略结构造成真实歧义；正文保留较严格的句法分析，脚注列出另一读法，不据此作额外的神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“不法女子”保留原文的律法与道德色彩；第二分句为忠实呈现属格关系而略带凝练，并用脚注说明语法歧义。
