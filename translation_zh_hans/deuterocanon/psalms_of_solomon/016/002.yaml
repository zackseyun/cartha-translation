  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
translation:
  language: zh_hans
  text: 我远离上帝时，我的魂[a]几乎倾泻而出，归于死亡；我已与一个罪人[c]一同，十分接近阴间[b]的门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的魂”也可译作“我的性命”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“哈得斯”，即死者所在的阴间；也可译作“坟墓”或“死者的领域”。
    reason: lexical_alternative
  - marker: c
    text: “一个罪人”也可能是类指用法，指罪恶之人这一类，而非某个特定的同伴。
    reason: source_ambiguity
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: 我远离上帝时
  rationale: 希腊语开头高度压缩，按上下文宜理解为伴随或时间情境。“我远离上帝时”在现代汉语中自然，也不增添原文以外的因果关系。
- source_word: παρʼ ὀλίγον
  choice: 几乎
  rationale: 这是表示“差一点、几乎”的惯用语；“几乎”简明而自然。
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: 我的魂几乎倾泻而出，归于死亡
  rationale: 保留ἐκχέω“倾泻”的鲜明意象及被动含义；ψυχή译作“魂”，呈现祷告者自身濒临死亡的表达，同时以脚注保留“性命”的可能解释。
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: 临近阴间的门
  rationale: “临近”表达σύνεγγυς所指的切近状态；“阴间”是现代中文圣经语域中对ᾅδης较自然的对应，并保留“门”的空间意象。
- source_word: μετὰ ἁμαρτωλοῦ
  choice: 和一个罪人一同
  rationale: 依照希腊语无冠词单数直译为“一个罪人”，不擅自将其确定为某个特定人物；脚注说明它也可能具有类指意义。
theological_decisions:
- issue: ψυχή的译法
  choice: 魂
  alternative: 性命
  rationale: ψυχή既可指人的魂或自身，也可指生命。正文保留“魂”的祷告语言和原文张力，脚注列出在濒死语境中同样可行的“性命”。
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 坟墓；死者的领域
  rationale: 原文明说ᾅδης。“阴间”既能保留死者领域的意象，也避免将其窄化为物质坟墓或导入后来的特定地狱观。
- issue: ἁμαρτωλοῦ的单数所指
  choice: 一个罪人
  alternative: 罪人（泛指罪恶之人这一类）
  rationale: 希腊语是无冠词单数，既可理解为不特定个体，也可能受闪语表达影响而具有类指意义。正文保留单数形式，脚注不强行排除泛指读法。
translation_notes:
  register: 采用现代、庄重而可懂的祷告语体。“倾泻而出，归于死亡”有意保留原文不寻常的生命流逝意象；“阴间的门”保留古代死亡领域的空间隐喻。
