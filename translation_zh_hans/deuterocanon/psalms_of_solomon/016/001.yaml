review_pass:
  verdict: revise
  source_fidelity: 草稿将开头难解的 συστάξαι 直接译为“离开”，而该意义实际只来自 ἀπὸ Κυρίου，未能交代开头动词。结合所列修订记录所指出的《斯威特》本应为 νυστάξαι（“打盹、昏睡”）以及其与下半句“睡眠”的平行关系，正文应恢复“昏睡”意象；同时用脚注透明说明所提供的希腊文本作 συστάξαι 所造成的异文／转录问题。
  naturalness: “睡眠的沉坠”虽可理解，但现代汉语中略显生硬；“睡眠的昏沉”自然，且保留 καταφορά 所含的困倦、下沉意味。“当我的心远离主而昏睡时”庄重、简洁，也使两个危险意象的关联清楚。
  terminology: κύριος译“主”恰当。ψυχή译“心”在诗歌语境中可接受，无须强加特定灵魂论；“远离主”恰当地表达 ἀπὸ Κυρίου 的分离意味。
  issues:
  - severity: high
    issue: 正文遗漏开头动词所表达的昏睡意象。
    rationale: 草稿的“当我的心离开主时”只译出了 ἀπὸ Κυρίου，却没有在正文中反映开头动词；修订记录已说明应有读法 νυστάξαι 与“睡眠”形成平行。
  - severity: medium
    issue: 所提供希腊文本的 συστάξαι 与据称《斯威特》本的 νυστάξαι 不一致。
    rationale: 若按 συστάξαι 直译，语义和句法均不稳定，不能无说明地把它译成“昏睡”。脚注应保留这一文本问题，避免掩盖不确定性。
  - severity: low
    issue: “睡眠的沉坠”不够自然。
    rationale: “睡眠的昏沉”更符合现代标准汉语，并仍可涵盖 καταφορά 的“昏沉、下沉”语义范围。
  revised_text: 当我的心远离主而昏睡时[a]，我差一点在睡眠的昏沉中滑倒。[b]
  revised_footnotes:
  - marker: a
    text: 所提供的希腊文本作“聚拢／整合”（συστάξαι），语义和句法均难确定；据修订记录所指的《斯威特》本读法为“昏睡、打盹”（νυστάξαι），与下文“睡眠”相呼应。若保留所提供的读法，本句开头也可理解为“当我的心聚拢起来时”。
    reason: textual_variant
  - marker: b
    text: “睡眠的昏沉”也可译作“睡眠的沉重”或“睡眠的下沉”。
    reason: lexical_alternative
  revision_rationale: 修订恢复开头与“睡眠”平行的“昏睡”意象，将“远离主”限定为 ἀπὸ Κυρίου 所表达的关系性分离，并以脚注公开所提供文本与修订记录所称《斯威特》读法之间的差异。下半句改为较自然的现代汉语，同时保留“滑倒”与下沉／昏沉的诗歌意象。
