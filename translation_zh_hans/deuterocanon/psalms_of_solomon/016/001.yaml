base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/001.yaml
  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
translation:
  language: zh_hans
  text: 当我的心离开主时[a]，我几乎在睡眠的沉坠中滑倒。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头的希腊文用词难解；也可理解为“当我的心与主分离时”，或“当我的心聚拢起来时”。
    reason: alternative_reading
  - marker: b
    text: “睡眠的沉坠”也可译作“睡眠的昏沉”或“睡眠的沉重”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ συστάξαι
  choice: 当……离开……时
  rationale: ἐν τῷ加不定式表示时间，可自然译为“当……时”。所给希腊文本中的συστάξαι词义和句法均较难确定；结合ἀπὸ Κυρίου所表达的分离关系，正文采用“离开”，同时以脚注保留其他理解的可能。
- source_word: ψυχήν μου
  choice: 我的心
  rationale: ψυχή可指灵魂、生命或内在自我。现代汉语诗体中，“我的心”较自然地表达人的内在生命，又不把此处限定为一套特定的灵魂论。
- source_word: ἀπὸ Κυρίου
  choice: 离开主
  rationale: ἀπό在此可表达与主分离或远离；“离开主”保留关系上的疏离及其警戒意味。
- source_word: παρὰ μικρόν
  choice: 几乎
  rationale: 这是表示“差一点、几乎”的惯用表达。
- source_word: ὠλίσθησα
  choice: 我……滑倒
  rationale: 动词表示失足、滑倒；“滑倒”保留原文鲜明的身体意象。
- source_word: ἐν καταφορᾷ ὕπνου
  choice: 在睡眠的沉坠中
  rationale: καταφορά可指向下沉落，也可指困倦、昏沉。此译与前面的“滑倒”形成连贯意象，同时保留睡眠使人下沉的感觉。
- source_word: Κυρίου
  choice: 主
  rationale: κύριος在这一敬虔语境中译为“主”，简洁并符合现代中文圣经文体。
theological_decisions:
- issue: ἀπὸ Κυρίου是仅表示来源，还是表示与主分离
  choice: 按关系上的分离译作“离开主”
  alternative: “与主分离”或“从主那里”
  rationale: ἀπό本身允许分离含义，而本句的危险意象支持“离开主”；但不进一步说明这种离开在教义上具体指什么。
- issue: ψυχή是否应作实体性的“灵魂”
  choice: 译作“心”
  alternative: “灵魂”或“生命”
  rationale: “心”在现代汉语中能自然指人的内在自我，并保留敬虔诗歌的语气，避免将ψυχή的语义过早限定为某种人论。
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。“沉坠”稍具文学色彩，用来维持“滑倒—下沉”的连续意象；脚注明确保留所给希腊文本开头用词的真实不确定性。
