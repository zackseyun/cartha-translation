review_pass:
  verdict: revise
  source_fidelity: 草稿将“συστάξαι”直接译为“离开”，并以“ἀπὸ Κυρίου”补足该动作；这并不反映所提供希腊文本的词义或句法。“离开主”的理解来自英文审校轨迹中彼此冲突的处理，不能凌驾于当前所给原文。συστάξαι及其与ψυχήν μου、ἀπὸ Κυρίου的搭配确有困难，应在正文采用较克制的“聚集”，并在脚注说明不确定性。
  naturalness: “在睡眠的沉坠中滑倒”虽略具文学性，但在诗歌语体中可通；改为“在睡眠的沉落中，我几乎滑倒”使语序更自然，也保留下沉和昏沉的双重意象。
  terminology: 将ψυχή译为“心灵”较“心”更接近其“内在自我／灵魂”的范围，同时仍是现代中文中自然、非技术化的敬虔诗歌表达。“主”可保留。
  issues:
  - severity: high
    issue: “当我的心离开主时”没有忠实翻译所给的συστάξαι。
    rationale: συστάξαι与“离开”在词义上不符；ἀπὸ Κυρίου可表达来源或分离，但不能单独把前一动词改写为“离开”。所列英文资料对该处的“departing／gathered／slumbered”亦互相矛盾，因此应以原文优先并保留难点。
  - severity: medium
    issue: 脚注a把“与主分离”列为替代释义，却没有说明正文“离开主”本身是基于有争议的句法重构。
    rationale: 应明确该希腊短语整体难解，并将“由主聚集”“心灵聚拢”等作为谨慎的可能理解，避免把未受原文支持的“离开”确立为正文。
  revised_text: 当我的心灵由主聚集时[a]，我在睡眠的沉落中几乎滑倒。[b]
  revised_footnotes:
  - marker: a
    text: 本句开头的希腊文短语（尤其是“聚集”一词与“从主／由主”的搭配）句法和含义均有困难。也可理解为“当我的心灵从主那里聚拢时”或“当我的心灵被整合时”。
    reason: alternative_reading
  - marker: b
    text: “睡眠的沉落”也可译作“睡眠的昏沉”或“睡眠的沉重”。
    reason: lexical_alternative
  revision_rationale: 修订撤除“离开主”这一无法由所给συστάξαι直接支持的解释性译法，改以“由主聚集”谨慎对应该困难短语，并在脚注保留句法与词义的不确定性。后半句保留“滑倒”与睡眠下沉的连贯意象，同时使中文表达更顺畅。
