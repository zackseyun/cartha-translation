  text: Direct the works of my hands in your place, and guard my steps in the remembrance of you.
translation:
  language: zh_hans
  text: 求你使我手所做的在你所在之处[a]得以正直；并在我对你的记念中[b]保守我的脚步。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你面前”。τόπος 的基本义是“地方、所在”；在祷告语境中也可能指处于上帝面前、在其临在中。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在对你的记念中”。形式上也可理解为“在你的记念中”，即“在你记念我时”；但本篇第6节支持正文所采用的理解。
    reason: grammatical_ambiguity_and_context
lexical_decisions:
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: 我手所做的
  rationale: 保留“手”的具体意象，同时用现代汉语自然表达人的工作与行动。
- source_word: κατεύθυνον
  choice: 使……行得正
  rationale: 该动词有使之笔直、正确行进或引导之意；这里是求上帝使诗人的行为合宜正直。
- source_word: ἐν τόπῳ σου
  choice: 在你所在之处
  rationale: 贴近 τόπος 的基本义“地方、所在”，又避免生硬的“在你的地方”；不直接把它限定解释为“在你面前”。
- source_word: τὰ διαβήματά μου
  choice: 我的脚步
  rationale: 保留原文以脚步指人的行程与生活道路的形象。
- source_word: ἐν τῇ μνήμῃ σου
  choice: 在我记念你时
  rationale: 结合本篇第6节的平行表述，将 σου 理解为受事属格，即诗人记念上帝；汉语明确表达这一关系，避免“在你的记念中”所产生的方向歧义。
- source_word: διαφύλαξον
  choice: 保守
  rationale: 表达严密看守、保存安稳之意；“保守我的脚步”符合庄重的祷告语体。
theological_decisions:
- issue: ἐν τῇ μνήμῃ σου 中属格 σου 的方向
  choice: 诗人记念上帝（“在我记念你时”）
  alternative: 上帝记念诗人（“在你记念我时”）
  rationale: 属格形式本身可有不同关系，但本篇第6节“对你的记念……离开我的心”提供直接语境，支持把上帝理解为“记念”的对象。脚注保留另一种形式上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我手所做的”“我的脚步”保留原文的具体意象；以“求你”统领两个祈使句，使汉语句法自然。
