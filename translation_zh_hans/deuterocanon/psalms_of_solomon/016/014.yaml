  yaml_path: translation/deuterocanon/psalms_of_solomon/016/014.yaml
  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: zh_hans
  text: 若有人因自己的毁灭而受责备[a]，你的试炼就在他的肉身和贫困中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文难解。也可较直译为：“若灵魂在他毁灭的手中受责备。”ψυχή 也可译作“性命”，ἐν χειρί 也可理解为“在……手中”或“在……权势下”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέγχηται (ἐλέγχω)
  choice: 受责备
  rationale: 保留动词揭露过错并加以纠正的语气，不将其限定为法律意义上的定罪。
- source_word: ψυχήν (ψυχή)
  choice: 有人
  rationale: 此处按闪语背景中“人、个人”的用法处理，也使后面的阳性代词 αὐτοῦ 所指自然；“灵魂/性命”的可能性收入脚注。
- source_word: ἐν χειρὶ
  choice: 因
  rationale: 按可能的闪语习语表达手段或媒介，译为现代汉语自然的“因”；原文“在……手中”的形象及不确定性收入脚注。
- source_word: ἀπωλίας
  choice: 毁灭
  rationale: 直接表达毁坏、灭亡或败亡之义，同时不把它弱化为一般困难。
- source_word: δοκιμασία
  choice: 试炼
  rationale: 兼顾受考验以及品质经检验显明的含义；在向上帝说话的语境中，“你的试炼”保留施行者关系。
- source_word: σαρκὶ (σάρξ)
  choice: 肉身
  rationale: 此处与物质上的贫困并列，身体层面的意义最合适；“肉身”也保留原词的具体措辞。
- source_word: πενίᾳς (πενία)
  choice: 贫困
  rationale: 所给形式虽略不规则，语义仍清楚指贫穷或匮乏；“贫困”简明而庄重。
theological_decisions:
- issue: 如何处理难解短语 ἐὰν ἐλέγχηται ψυχήν ἐν χειρὶ ἀπωλίας αὐτοῦ
  choice: 若有人因自己的毁灭而受责备
  alternative: 若灵魂在他毁灭的手中受责备
  rationale: 正文采用 ψυχή 表示“人”以及 ἐν χειρί 表示媒介的可能闪语用法，以形成可懂的现代汉语；但希腊文的格、代词关系和短语结构均显得生硬，因此用脚注明示较直译的另一种理解，不消除原文的不确定性。
- issue: “你的试炼”所指的施事者
  choice: 保留第二人称所有关系，不补明为上帝的管教、惩罚或考验
  alternative: 你对他的管教就在……中
  rationale: δοκιμασία 可指试验、考验或检验；原文未明确界定其性质，故避免加入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“试炼”“肉身”保留诗歌与宗教语域；脚注承载原文首句的真实歧义，正文不擅自把它解释成某种特定的惩罚或教义。
