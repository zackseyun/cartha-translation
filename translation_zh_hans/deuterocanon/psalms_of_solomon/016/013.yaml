  text: For if you do not strengthen[b][a], who will endure discipline in poverty?
translation:
  language: zh_hans
  text: 因为你若不赐力量[a]，谁能在贫困中忍受管教[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明说“赐力量”的对象。
    reason: cultural_note
  - marker: b
    text: “管教”也可译作“教导”或“训练”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: 赐力量
  rationale: 该动词表示使之有力量或给予扶助。译作“赐力量”自然地保留了希腊文未明说受词这一特点，避免擅自补出“赐给谁”。
- source_word: ὑφέξεται
  choice: 能忍受
  rationale: 此处将来时动词表达承受、坚持经受之意；在反问句中译作“谁能……忍受”符合现代汉语，也传达了承受重压的语气。
- source_word: παιδείαν
  choice: 管教
  rationale: παιδεία可指教导、训练或带纠正性质的管教。上下文把它呈现为人在困苦中所承受的塑造过程，因此“管教”较能兼顾纠正与训练的含义。
- source_word: ἐν πενίᾳ
  choice: 在贫困中
  rationale: πενία直接指贫穷、缺乏；“在贫困中”保留了原文鲜明的经济困境含义及介词结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“因为……若……谁能……呢”保留原文的因果关系与反问力度；不补出ἐνισχύσῃς未明说的受词，并以脚注保留παιδεία的词义幅度。
