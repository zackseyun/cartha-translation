  text: When the righteous one endures in these things[b][a], he will be shown mercy by the Lord.
translation:
  language: zh_hans
  text: 义人[b]在这些事中忍耐时[a]，必蒙主怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人在这些事中忍耐，就必蒙主怜悯。”原文结构既可表示时间，也可带有方式意味。
    reason: 保留ἐν τῷ ὑπομεῖναι在时间性与方式性之间的语法可能。
  - marker: b
    text: “义人”原文为单数阳性形式，可作代表性称呼；也可译作“公义的人”。
    reason: 说明δίκαιον的语法性别和名词化用法，同时保留词汇替代译法。
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: 忍耐时
  rationale: ἐν加冠词不定式可表达时间或方式；结合上文所述的试炼与困苦，此处正文采用自然的时间表达，同时在脚注保留方式性的可能。
- source_word: δίκαιον
  choice: 义人
  rationale: 该宾格形式很可能是不定式ὑπομεῖναι的逻辑主语。中文“义人”保留名词化和单数意义，也不必额外添入原文未明说的身份。
- source_word: ἐν τούτοις
  choice: 在这些事上
  rationale: 直指上文提到的处境和苦难；“在这些事上”保留指代的开放性，不把具体内容过度明说。
- source_word: ἐλεηθήσεται
  choice: 必蒙……怜悯
  rationale: 未来被动式表示将受到怜悯；“必蒙……怜悯”以自然庄重的中文保留被动意义和怜悯用语。
- source_word: ὑπὸ Κυρίου
  choice: 蒙主
  rationale: ὑπό加属格标示被动动作的施事者；中文“蒙主怜悯”准确而自然地表达“被主怜悯”。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处κύριος用于敬虔语境，指神；“主”符合中文圣经传统和现代宗教语体，也不额外引入特定宗派解释。
- issue: 忍耐与蒙怜悯之间的关系
  choice: 正文采用时间关系：“忍耐时”
  alternative: 方式或条件色彩：“借着忍耐这些事”
  rationale: ἐν τῷ加不定式既可作时间理解，也可能带方式意味。正文依上下文采用时间表达，脚注保留另一可能，避免把蒙怜悯明确解释为凭行为换取。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“在这些事上忍耐”承接上文且不擅自具体化所指；“必蒙主怜悯”简洁地再现未来被动结构。脚注标记均置于相关短语之后。
