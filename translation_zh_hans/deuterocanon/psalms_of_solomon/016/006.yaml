  text: μὴ ἀποστήσῃς τὸ ἔλεός σου ἀπʼ ἐμοῦ, ὁ θεός, μηδὲ τὴν μνήμην περὶ σοῦ ἀπὸ καρδίας ἕως θανάτου.
