base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/006.yaml
  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
translation:
  language: zh_hans
  text: 上帝啊，求你不要使你的怜悯[a]离开我，也不要使对你的记念离开我的心，直到我死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜悯”也可译作“怜恤”；若侧重持续不变的恩慈，也可译作“慈爱”。
    reason: lexical_alternative
  - marker: b
    text: “直到我死”直译为“直到死亡”。
    reason: literal_rendering
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: 使……离开
  rationale: 此处为使某物从某人或某处离去、移开的意思；“使……离开”既贴近希腊文，也能让同一动词自然支配“怜悯”和“记念”两个并列宾语。
- source_word: ἔλεός
  choice: 怜悯
  rationale: ἔλεος常指怜悯、怜恤；“怜悯”在现代汉语祷告语境中清楚自然，又不把词义限定为更具解释性的“信实之爱”。
- source_word: μνήμην περὶ σοῦ
  choice: 对你的记念
  rationale: μνήμη表示记忆或记念，περὶ σοῦ说明其对象是上帝；“对你的记念”保留名词结构及对象关系，避免译成“思念”而引入想念不在场者的意味。
- source_word: καρδίας
  choice: 我的心
  rationale: 希腊文直译为“心”，在上下文中所指自然是祈祷者自己的心；汉语补出“我的”可消除生硬和歧义。
- source_word: ἕως θανάτου
  choice: 直到我死
  rationale: 原文直译为“直到死亡”；汉语译作“直到我死”更自然，并保留持续至生命终点的时间意义。
theological_decisions:
- issue: ἔλεος是否译为带盟约色彩的“慈爱”
  choice: 怜悯
  alternative: 慈爱／信实之爱
  rationale: 本句本身不足以要求加入特定的盟约神学含义；采用较直接的“怜悯”，同时在脚注保留其他可能译法。
- issue: 第二分句省略动词的处理
  choice: 重复“使……离开”
  alternative: 用“也不要把……从我的心中拿走”另起动词
  rationale: 希腊文由同一个ἀποστήσῃς支配两个并列宾语。汉语重复同一结构可明确句法关系，并避免引入不同动作。
translation_notes:
  register: 采用现代、庄重的祷告语体。“求你”虽无独立对应词，却自然表达希腊文否定祈使的恳求语气。两个分句重复“使……离开”，既适合现代汉语，也显明原文由同一动词统领的平行结构。
