base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/003.yaml
  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
translation:
  language: zh_hans
  text: 当我的灵魂正被从主——以色列的上帝——那里夺去时[a]，若不是主以他的怜悯扶助我[b]，直到永远[c]。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我的灵魂正被带离主——以色列的上帝——时。”
    reason: lexical_alternative
  - marker: b
    text: “扶助我”也可译作“伸手扶住我”或“前来帮助我”。
    reason: lexical_alternative
  - marker: c
    text: “直到永远”可能修饰“他的怜悯”，也可能修饰整个扶助行动。
    reason: alternative_reading
  - marker: d
    text: “若不是……”承接上一节所说的危境；本节没有另行重述条件句的结果。
    reason: syntax_context
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: 当……正被……夺去时
  rationale: ἐν 加冠词不定式表达时间；被动式 διενεχθῆναι 有被带走、被夺离之意。“正被……夺去”既保留被动和危急感，也符合现代汉语。
- source_word: ψυχήν μου
  choice: 我的灵魂
  rationale: ψυχή 在祷告语境中兼具人的生命与内在自我之意；“灵魂”保留其宗教和人格分量，不把含义限缩为肉身性命。
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: 从主——以色列的上帝——那里
  rationale: θεοῦ Ἰσραήλ 是对 Κυρίου 的同位说明；破折号清楚呈现“主”即“以色列的上帝”，并保留 ἀπό 所表达的离开。
- source_word: εἰ μὴ
  choice: 若不是
  rationale: 此处引出与上节相接的反事实条件。“若不是”保留条件性，也不擅自补出原文未在本节重述的结果句。
- source_word: ἀντελάβετό μου
  choice: 扶助我
  rationale: 该动词有伸手扶住、给予支援之意。“扶助”比泛泛的“帮助”更能保留其具体形象，同时不过度强化为必然的“拯救”。
- source_word: τῷ ἐλέει αὐτοῦ
  choice: 以他的怜悯
  rationale: 与格在此表示凭借或方式；“以”简洁地表达主的怜悯是扶助的凭借。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 这是该短语自然而庄重的汉语表达。置于句末，可尽量保留它既可能修饰怜悯、也可能涉及整个扶助行动的范围歧义。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 上主；主宰
  rationale: “主”是 κύριος 在此祷告语境中的直接、通行译法；经文随后以“以色列的上帝”作同位说明，无须另加专名或宗派性措辞。
- issue: εἰς τὸν αἰῶνα 的修饰范围
  choice: 保留在句末，译作“直到永远”
  alternative: 译作“以他永远的怜悯”，使其仅修饰“怜悯”；或明确译作“永远扶助我”，使其仅修饰行动
  rationale: 希腊语词序容许该短语指向“他的怜悯”或更广泛地指向扶助行动。句末表达并加注，不替原文消解这种神学与句法张力。
- issue: 本节与上节的条件关系
  choice: 保留“若不是……”这一承接式结构
  alternative: 补足为独立句，如“若不是主……，我早已灭亡”
  rationale: 本节的 εἰ μὴ 从句承接前文；补出结果虽能使单节更完整，却会加入本节原文没有明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“夺去”传达危急的被动处境，“扶助”保留原动词伸手支持的形象。以破折号标明“以色列的上帝”是“主”的同位语；保留承接上节的未完条件结构，不擅自补足结果。
