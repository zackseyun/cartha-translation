    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: 修平
  rationale: 该动词意为使平坦、修整；“修平”自然简洁，并保留预备道路的具体画面。
- source_word: ὁδοὺς τραχείας
  choice: 崎岖的道路
  rationale: 准确表达道路粗糙难行之意；“崎岖”符合现代汉语表达。
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: 在他进入之前
  rationale: ἀπό直译为“从”在此搭配生硬；结合可能的希伯来语底层表达，理解为在他到来或进入以前，同时以脚注保留原文措辞的不确定性。
- source_word: ἤνοιξαν πύλας
  choice: 他们打开……城门
  rationale: 直接保留动作；希腊语虽无冠词，汉语以“城门”表达最自然。
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: 朝向耶路撒冷
  rationale: ἐπί在此可作方向性理解；这一译法尽量保留原文的空间关系，而不改写为目的性的“为耶路撒冷”。
- source_word: ἐστεφάνωσαν
  choice: 加冕
  rationale: 保留动词“戴上冠冕”的字面意象及其凯旋、庆贺色彩；脚注列出“用花环装饰”这一可能译法。
- source_word: τείχη αὐτῆς
  choice: 她的城墙
  rationale: 阴性代词指耶路撒冷；用“她”保留城市人格化的修辞。
