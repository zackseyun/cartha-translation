  yaml_path: translation/deuterocanon/psalms_of_solomon/008/033.yaml
  text: Turn your mercy toward us[a], O God[b], and have compassion on us.
translation:
  language: zh_hans
  text: 神啊，求你使你的怜悯转向我们[a]，怜恤我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让你的怜悯临到我们。”
    reason: 词义与汉语表达可兼有“转向”和“临到”的意味；正文保留原文较鲜明的方向性意象。
  - marker: b
    text: 或译：“同情我们。”
    reason: 原词侧重因恻隐而怜悯；“同情”较直白，“怜恤”则更符合本句庄重的祷告语体。
lexical_decisions:
- source_word: ἐπίστρεψον
  choice: 使……转向
  rationale: 该命令式表达使某物改变朝向、转到某人这里；“使……转向”保留原文的动态意象，同时符合汉语祈求语气。
- source_word: ἔλεός
  choice: 怜悯
  rationale: ἔλεος指向有需要者所施的慈悲和恩待；“怜悯”直接、庄重，也与下句相关而不完全重复。
- source_word: ἐφʼ ἡμᾶς
  choice: 向我们
  rationale: ἐπί加宾格在这里表示方向；与“转向”连用，可自然表达朝向祈求者的意思。
- source_word: οἰκτείρησον
  choice: 怜恤
  rationale: 该动词表示因同情而顾念、施怜悯；“怜恤”既保留其恻隐意味，也适合祷告文体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“神啊”保留呼格，“求你”补出汉语中命令式祈求通常需要的礼貌语气；两个并列祈求均予保留。
