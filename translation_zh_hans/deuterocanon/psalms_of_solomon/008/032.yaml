  text: For you are the God of righteousness[b][a], judging Israel with discipline.
translation:
  language: zh_hans
  text: 因为你是公义的上帝，以管教[a]审判以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以管教”也可译作“在管教中”或“借着惩戒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此连词引出前文祈求或认信的根据；“因为”自然保留其因由作用。
- source_word: ὁ θεὸς τῆς δικαιοσύνης
  choice: 公义的上帝
  rationale: 属格短语描述上帝的属性；“公义”兼含道德正直与公正施行审判的意义，现代汉语也较自然。
- source_word: κρίνων
  choice: 审判
  rationale: 现在分词表达上帝持续施行的行动；汉语以谓语“审判”自然承接主句。
- source_word: τὸν Ἰσραήλ
  choice: 以色列
  rationale: 采用该专名的标准中文译法，并保留其作为审判对象的语法关系。
- source_word: ἐν παιδείᾳ
  choice: 以管教
  rationale: παιδεία在此指带有纠正意味的管教，而不只是教导；ἐν可表达方式或手段，故译作“以管教”。
theological_decisions:
- issue: 上帝的公义与管教性审判之间的关系
  choice: 保留“公义的上帝”与“以管教审判”的并置
  alternative: 将经文解释性改写为“上帝公正地惩罚以色列”
  rationale: 原文既陈明上帝的公义，也将审判描述为带有παιδεία性质的行动；译文不把这种管教预先限定为纯惩罚或纯教育，以保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以管教审判”略具经文语体，同时清楚保留ἐν παιδείᾳ所表达的方式、手段及纠正意味。
