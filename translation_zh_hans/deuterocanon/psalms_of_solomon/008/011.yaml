  text: Each one was committing adultery with his neighbor’s wife[a]; they made covenants with one another under oath about these things.
translation:
  language: zh_hans
  text: 各人都与自己邻人的妻子通奸；他们就这些事彼此[a]立约，并以誓言为证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与他们”。希腊语与格代词 αὐτοῖς 可较直译为“与他们”；按上下文也可理解为作恶者之间“彼此”立约。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοιχῶντο
  choice: 不断……通奸
  rationale: 该动词意为犯奸淫；未完成时表示持续或反复发生，译作“不断”以保留这一语气。
- source_word: ἕκαστος
  choice: 各自
  rationale: 保留分配性的单数含义，表明指控逐一落在群体中的每个人身上。
- source_word: τὴν γυναῖκα τοῦ πλησίον αὐτοῦ
  choice: 邻人的妻子
  rationale: 自然、清楚地表达属格关系，并保持通奸语境。
- source_word: συνέθεντο
  choice: 立
  rationale: 与“约”搭配，表达订立或达成约定，符合现代汉语习惯。
- source_word: συνθήκας
  choice: 约
  rationale: 该词可指约、协议或盟约；“约”既保留较正式的语体，也不过度引入特定神学含义。
- source_word: αὐτοῖς
  choice: 彼此
  rationale: 按上下文理解为作恶者之间相互订约；希腊语与格代词较为压缩，字面也可能理解为“与他们”。
- source_word: μετὰ ὅρκου
  choice: 起誓
  rationale: 自然地传达以誓言确认约定的郑重意味。
- source_word: περὶ τούτων
  choice: 为这些事
  rationale: 指回前述通奸行为，并以简洁自然的汉语表达“关于这些事”。
