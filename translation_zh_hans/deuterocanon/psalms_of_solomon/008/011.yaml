    issue: “不断”对未完成体的表达偏强。
    rationale: 希腊语未完成体可表示进行、习惯或反复，但不必然表示毫无间断的持续；改为“都……通奸”保留控诉的概括性，避免过度限定。
  - severity: medium
    issue: 脚注所说明的 αὐτοῖς 未紧邻其对应译词。
    rationale: 原脚注置于句末，可能被读者理解为说明整句或“这些事”；应置于“彼此”之后，以明确其词汇替代关系。
  - severity: low
    issue: “起誓立约”略有结构歧义。
    rationale: 可被理解为先起誓后立约，未充分显出誓言是约定的确认方式；“立约，并以誓言为证”更明确。
