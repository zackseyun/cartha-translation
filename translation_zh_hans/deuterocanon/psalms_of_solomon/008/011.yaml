  source_fidelity: 首句准确传达了 ἐμοιχῶντο 的未完成体所暗示的进行性／反复性以及 ἕκαστος 的逐一分配意义。不过，“不断”将语义收窄为不间断，较原文未完成体所要求的程度更强。后句“为这些事彼此起誓立约”虽可理解，但“起誓立约”的修饰关系和“彼此”所对应的 αὐτοῖς 不够清晰。
  naturalness: 原译总体庄重通顺，但“各自不断与邻人的妻子通奸”略显生硬。“各人都与自己邻人的妻子通奸”更自然，且明确 αὐτοῦ 随“各人”分配。“就这些事彼此立约，并以誓言为证”在现代汉语中清楚表达正式约定及其以誓言确认的方式。
  terminology: “通奸”符合原文及庄重经文语体。“立约”可译 συνθήκας，未不当引入教义性含义；“以誓言为证”准确表达 μετὰ ὅρκου。保留对 αὐτοῖς 的“彼此／与他们”歧义脚注，并将锚点紧邻“彼此”。
  issues:
