  yaml_path: translation/deuterocanon/psalms_of_solomon/008/027.yaml
  text: God was vindicated in his judgments among the nations of the earth,[a]
translation:
  language: zh_hans
  text: 神在他于地上列国中所施行的审判中，显明为公义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神在他于地上列国中所施行的审判中，被证实为正当。”
    reason: 保留 ἐδικαιώθη 可表达“被证实为正当、公义”的词义选择，并凸显原文的被动形式。
lexical_decisions:
- source_word: ἐδικαίωθη
  choice: 显明为公义
  rationale: 此处为 δικαιόω 的被动形式，用于神时不是说神变得公义，而是说他借着自己的审判被显明为公义、被证明站在正义的一方。“显明为公义”既保留被动含义，也比“被称义”更符合现代汉语，避免引入后来的称义术语。
- source_word: κρίμασιν
  choice: 审判
  rationale: κρίμα 指司法裁决或审判；结合复数形式和语境，此处可理解为神施行的各项审判。汉语用集合性的“审判”自然简洁，并保留法律与道德意味。
- source_word: ἔθνεσι
  choice: 列国
  rationale: 这里泛指世上的各民族或国家，而非特指与犹太人相对的“外邦人”。“列国”适合诗歌体，也准确表达复数范围。
- source_word: τῆς γῆς
  choice: 地上
  rationale: γῆ 可指“土地”或“大地”；与“列国”连用时具有普世范围。“地上列国”是自然、庄重的现代汉语表达。
theological_decisions:
- issue: 用于神的 δικαιόω 应译作传统的“被称义”，还是表达其公义得到公开证实
  choice: 显明为公义
  alternative: 被证明为正直；被判定为公义；被称义
  rationale: 经文并非暗示神先前不义而后成为公义，而是说他的审判彰显了他的公义。“显明为公义”传达这一点，同时不把句子改写成单纯主动陈述“神是公义的”，因而保留原文被动式所含的公开证实意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“地上列国”保留诗歌语感；“在……审判中”对应两个 ἐν 短语的结构关系。
