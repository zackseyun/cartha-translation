  terminology: “审判”对应 κρίμασιν，保留司法与道德判断的意义；“列国”对应 ἔθνεσι，适合此处广义的各国、各民族；“地上”表达 τῆς γῆς 的普世范围。脚注以“被证实为正当”提供 δικαιόω 的可行译法，避免技术性“称义”在此处造成误解。
