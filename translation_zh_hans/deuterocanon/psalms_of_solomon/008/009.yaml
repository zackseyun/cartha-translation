  text: Their lawless deeds were in secret chambers[a], in provocation.
translation:
  language: zh_hans
  text: 他们的不法之事是在隐秘处作的[a]，带着挑衅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在隐蔽的住处（或落脚处）”。
    reason: καταγώγαις可指住处、落脚处或其他处所；原文未精确说明建筑或场所性质。
  - marker: b
    text: 或译：“带着惹怒人的意味”。此词可指挑衅或激起愤怒；原文没有说明被激怒者是谁。
    reason: παροργισμός含挑衅、激起怒气的语义；不宜补出受事者，也不宜断定为行为者处于愤怒状态。
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: 在隐秘的房间里
  rationale: καταγώγιον可指住处、落脚处或房间；与κρυφίοις连用，重点在这些场所隐蔽、不为人知。“隐秘的房间”自然地保留了可能的室内场景，又不具体限定其建筑性质。
- source_word: αἱ παρανομίαι αὐτῶν
  choice: 他们的违法之事
  rationale: παρανομίαι指违背律法或正道的行为。“违法之事”兼顾其法律—道德意味，也保留复数所表达的一系列行为。
- source_word: ἐν παροργισμῷ
  choice: 惹动愤怒
  rationale: παροργισμός可表示激怒、招惹愤怒或由此产生的恼怒。此处没有明说谁被激怒，因此译文保留宾语未明的张力，不擅自补出“神”。
- source_word: '[implied copula]'
  choice: 发生
  rationale: 希腊文为无系词结构。中文补入“发生”使句子完整，并把地点短语自然地连接到“违法之事”，不额外增添行为细节。
theological_decisions:
- issue: ἐν παροργισμῷ是否明确指激怒神
  choice: 译作“惹动愤怒”，不明说对象
  alternative: “惹神发怒”或“出于挑衅”
  rationale: 上下文可能暗示神的愤怒，但本节希腊文本没有明示对象；直接补“神”会消除原文的含混，而“出于挑衅”又会削弱词中与愤怒相关的语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“违法之事”保留原文的律法与道德色彩；“惹动愤怒”略带经文语体，但普通读者易懂，并避免擅自补足原文未明说的对象。
