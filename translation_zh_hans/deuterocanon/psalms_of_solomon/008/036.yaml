base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: zh_hans
  text: 我们的上帝啊，求你不要漠视我们，免得列国吞灭我们，仿佛无人施行救赎。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛没有救赎者”，或“仿佛无人搭救”。
    reason: 原文 λυτρουμένου 是分词，可着重于施行救赎的人，也可着重于解救的行动；正文不将其固定解释为正式头衔，也不补出原文未明说的受益对象。
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: 求你不要漠视
  rationale: 该动词有“看过去而不顾、忽视”之意。“漠视”保留责切而恳求的语气；加“求你”使现代汉语祈祷句自然，并未增添新的命题内容。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 在主句中作“漠视”的宾语，在后句中作“吞灭”的宾语，按第一人称复数直译。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝啊
  rationale: 原文虽为主格形式，在句中具有呼语作用；“啊”清楚传达直接呼求的语气。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 此处表达祈求者所惧怕的结果；“免得”简洁自然，也保留目的与结果之间未完全限定的关系。
- source_word: καταπίωσιν
  choice: 吞灭
  rationale: 原词意为“吞下、吞噬”。“吞灭”保留鲜明的吞噬意象，同时符合列国毁灭群体的语境。
- source_word: ἔθνη
  choice: 列国
  rationale: 在这篇犹太祷文中指外邦各国或外国势力。“列国”比“外邦人”少带后期宗教术语色彩，又能自然表达复数群体。
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: 仿佛无人来救赎我们
  rationale: 原文以属格分词结构表达“仿佛没有正在施行救赎者”。采用动词性译法，保留行动者未明说的特点；补出由上下文明确的宾语“我们”，使现代汉语完整自然。
theological_decisions:
- issue: λυτρουμένου 的译法
  choice: 无人来救赎我们
  alternative: 没有救赎者；无人搭救我们
  rationale: 该词兼有付代价释放、救赎和解救的语义。原文使用分词，并非明确的头衔，因此正文采用动词性表达，不把它定格为特定的弥赛亚称号；脚注保留名词性和一般解救义的可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我们的上帝啊”体现呼语，“列国”“吞灭”保留诗歌的群体视角和强烈意象。唯一脚注标记 [a] 已置于正文相应短语之后。
