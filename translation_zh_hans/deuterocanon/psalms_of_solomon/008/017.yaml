  text: 他裁定向耶路撒冷及其土地开战[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其疆域”。
    reason: lexical_alternative
  - marker: b
    text: “裁定”也可译为“判定”或“审判”；原文此处指对针对耶路撒冷及其土地的战争作出决定。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔκρινεν
  choice: 裁定
  rationale: κρίνω在这里表示作出权威性的判断或决定；“裁定”既保留司法色彩，也能与后面的战争语境自然衔接，避免把意思过度具体化为“发动”或“带来”。
- source_word: τὸν πόλεμον
  choice: 开战
  rationale: πόλεμος指战争；与“裁定向……开战”搭配，可在现代汉语中自然表达“决定战争临到某对象”的含义，同时保留战争的严重性。
- source_word: ἐπὶ
  choice: 向
  rationale: 在战争语境中，ἐπί表示敌对行动所指向的对象；汉语“向……开战”清楚、自然地传达这种敌对方向。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: γῆν
  choice: 土地
  rationale: γῆ可指土地、国土或疆域；“土地”保留较宽泛的地理含义，不把它限定为技术性的行政区域。
- source_word: αὐτῆς
  choice: 她的
  rationale: 该阴性代词回指耶路撒冷；用“她”保留圣经语言中将城市人格化的表达。
