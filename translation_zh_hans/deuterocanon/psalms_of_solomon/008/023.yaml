  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: zh_hans
  text: 他毁灭了他们的统治者和所有善于谋划的智者[a]；他把耶路撒冷居民的血倾倒出来，如同不洁之水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一位有智慧的谋士”，或“所有在谋略上有智慧的人”。希腊语表达简约，并带集合意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如同污秽之水”。希腊语此处为“不洁／污秽”这一状态的名词属格；该用语可能带礼仪不洁的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: 毁灭了
  rationale: 保留动词“使之灭亡、摧毁”的宽泛力度，不把含义限缩为单指处死；下句的流血意象则进一步说明暴力后果。
- source_word: ἄρχοντας αὐτῶν
  choice: 他们的统治者
  rationale: ἄρχοντες指掌权者；“统治者”保留政治权力色彩，并自然对应属格αὐτῶν。
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: 所有善于谋划的智者
  rationale: 原文结构简约而带集合意味，指在商议、谋划方面有智慧的人；此译既保留“智者”，又自然表达ἐν βουλῇ的限定作用。
- source_word: ἐξέχεεν
  choice: 倾倒出来
  rationale: 保留“倒出”的具体而强烈的图像；与“血”连用虽较“流了”更突兀，却忠实呈现原文刻意的惨烈表达。
- source_word: τὸ αἷμα τῶν οἰκούντων Ἰερουσαλήμ
  choice: 耶路撒冷居民的血
  rationale: 以自然现代汉语表达“住在耶路撒冷之人的血”，不损失所指群体。
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: 如同污秽之水
  rationale: 直译属格结构“污秽之水”，既保留水的意象，也保留ἀκαθαρσία可能具有的一般污秽与礼仪不洁色彩，避免仅译成形容词后完全抹平结构。
theological_decisions:
- issue: ἀκαθαρσίας是否应明确译为礼仪性的“不洁”
  choice: 正文采用“污秽之水”，脚注说明也可译“不洁之水”
  alternative: 如同不洁之水
  rationale: ἀκαθαρσία可指污秽、不洁，并可能带礼仪意味，但本句本身不足以要求把该意味唯一化；正文保留较宽含义，脚注呈现可能的礼仪色彩。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“毁灭”“倾倒出来”保留诗句强烈的审判与流血意象；以两个脚注交代压缩短语和“污秽／不洁”的真实语义张力。
