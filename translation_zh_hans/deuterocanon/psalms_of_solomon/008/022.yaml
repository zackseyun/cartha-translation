translation:
  language: zh_hans
  text: 因为上帝在他们的迷误中安然地引领他。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迷误”也可译作“错误”“迷惑”或“迷失”。
    reason: 保留πλάνησις所涵盖的偏离、错误及受迷惑的语义范围，避免将其限定为单一含义。
  - marker: b
    text: “在他们的迷误中”首先指所处的情境；按上下文，也可能暗示上帝借他们的迷误使他安然前行。
    reason: 说明ἐν的处境性基本含义，并谨慎保留可能由上下文产生的途径性含意。
lexical_decisions:
- source_word: ἤγαγεν
  choice: 领……前来
  rationale: ἄγω的简单过去时表示“带领、领来”。结合上下文，“领他前来”既保留上帝引导其行程的意象，也自然表达人物被带到此处的方向感。
- source_word: μετὰ ἀσφαλείας
  choice: 安然
  rationale: 该短语表示“安全地、稳妥地”；译作“安然”简洁自然，并保留其修饰“领……前来”的副词作用。
- source_word: πλανήσει
  choice: 迷误
  rationale: πλάνησις可指偏离、错误、迷惑或受骗。上下文侧重众人的错误判断，而非实际四处游荡；“迷误”兼顾认知与道德上的偏差，又不限定为主动欺骗。
- source_word: αὐτὸν
  choice: 他
  rationale: 这是阳性单数代词，直译为“他”，不擅自补明所指人物。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 属格复数自然译为“他们的”，保留被引领的单数人物与陷入迷误的复数群体之间的对照。
- source_word: ἐν
  choice: 在……中
  rationale: ἐν首先译作处境性的“在……中”，同时不排除这里带有工具意味，即上帝借着他们的迷误使他安然前来；另一理解在脚注中说明。
