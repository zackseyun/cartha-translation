  text: Praised be the Lord[b][a], who judges the whole earth in his righteousness.
translation:
  language: zh_hans
  text: 当受赞美的是主；他以自己的公义审判全地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以自己的公义”也可译为“按自己的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνετὸς
  choice: 当受赞美的是
  rationale: 该形容词意为“受赞美的、配受赞美的”，与“有福的”不同；此译既保留谓语性赞颂公式，也符合现代汉语的庄重表达。
- source_word: Κύριος
  choice: 主
  rationale: 按其作为特指神圣称号的用法译为“主”；汉语无需另行体现希腊语定冠词。
- source_word: ὁ κρίνων
  choice: 他……审判
  rationale: 带冠词的现在分词描述主持续或特有的作为；拆作分句在汉语中自然，同时不把现在时态过度限定为某一时刻。
- source_word: πᾶσαν τὴν γῆν
  choice: 全地
  rationale: 保留πᾶσαν的普遍范围；此处γῆ最自然地指整个大地，而非某一特定地域。
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: 以自己的公义
  rationale: ἐν可表达审判的方式或所依循的准则；“公义”保留δικαιοσύνη的道德与神学广度，“自己的”清楚反映αὐτοῦ回指主。
theological_decisions:
- issue: δικαιοσύνη在审判语境中的含义
  choice: 公义
  alternative: 正义／公正
  rationale: “公义”能同时涵盖正直品格与公正施行，避免把原词收窄为纯司法意义；脚注注明语境上可译为“公正”。
translation_notes:
  register: 采用现代、庄重而易懂的赞颂语体。“当受赞美的是主”刻意区别于表示蒙福的“主是有福的”；分号使赞颂与说明主之作为的分句衔接清楚。
