  text: My heart was afraid[c][b][a]; my bones were shaken like flax.
translation:
  language: zh_hans
  text: 我的心惧怕[a]；我的骨头如亚麻一般震颤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惧怕”也可译作“害怕起来”。
    reason: lexical_alternative
  - marker: b
    text: “震颤”也可译作“受扰动”；“亚麻”也可指“亚麻布”。原文这一比喻的具体含义并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθη
  choice: 惧怕
  rationale: 该不定过去时被动形（在此作不及物或中动意义）表达恐惧的状态或发生；“惧怕”简洁庄重，又不额外说明恐惧的对象。
- source_word: καρδία
  choice: 心
  rationale: 保留原文具体的人体与内在生命意象，不抽象改译为“内心”或“心灵”。
- source_word: ἐταράχθη
  choice: 震颤
  rationale: 该词可表示受扰动、摇动；用于“骨头”并接“如亚麻”的物质性比喻时，“震颤”自然地传达身体受到撼动的感觉，同时未强化为猛烈震动。
- source_word: ὀστᾶ
  choice: 骨头
  rationale: 直译复数所表达的骨骼意象；现代汉语集合意义的“骨头”自然清楚，也保留哀歌的身体感。
- source_word: ὡς
  choice: 如……一般
  rationale: 明确引出比喻，符合庄重而自然的现代汉语表达。
- source_word: λίνον
  choice: 亚麻
  rationale: 该词可指亚麻或亚麻布；正文采用基本的原料义“亚麻”，以免擅自把它限定为成品布料，并保留原文难解的比喻。
theological_decisions: []
translation_notes:
