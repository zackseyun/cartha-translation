  text: And we will not turn away from you[b][a], because your judgments toward us are good.
translation:
  language: zh_hans
  text: 我们也必不离开你[a]，因为你对我们的审判是美善的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“远离你”或“不与你疏远”。
    reason: lexical_alternative
  - marker: b
    text: “美善的”也可译为“仁慈的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  choice: 必不离开
  rationale: 该词为将来时中间语态，与属格代词连用，表达使自己远离某人。“必不离开”自然地保留了关系层面的含义，也体现将来时的坚定语气。
- source_word: χρηστὰ
  choice: 美善的
  rationale: χρηστός可表示良善、仁慈、有益。“美善”既保持宽广的正面含义，也容纳仁厚、恩慈的语义色彩。
- source_word: κρίματά
  choice: 审判
  rationale: κρίματα指判决、裁断或施行审判的作为。“审判”保留庄重的司法与神学语域，同时不把含义限缩为法令。
- source_word: εἰς ἡμᾶς
  choice: 对我们
  rationale: εἰς在此表示方向或关系。“对我们”是现代汉语中自然的表达，说明这些审判以群体为对象，而不预先限定其为惩罚或赐福。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“必不离开你”保留原文关系性的承诺；“对我们的审判是美善的”保存神圣审判与良善并置的张力，不将其解释性改写为单纯的恩惠或惩罚。
