  text: He defiled Jerusalem and the things sanctified in the name of God[a][b].
translation:
  language: zh_hans
  text: 他玷污了耶路撒冷，也玷污了奉上帝之名分别为圣之物[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣之物”也可译作“圣物”或“奉献之物”。
    reason: lexical_alternative
  - marker: b
    text: “奉上帝之名分别为圣”也可理解为“分别为圣、归于上帝之名”或“借上帝之名分别为圣”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐμίανεν
  choice: 玷污了
  rationale: μίανω表示使某物在礼仪或道德意义上成为不洁；“玷污”保留了不洁与亵渎的语义，也适合同时支配城市和圣物。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代简体中文通行地名译法。
- source_word: τὰ ἡγιασμένα
  choice: 分别为圣之物
  rationale: 这是ἁγιάζω的完成时被动分词中性复数实体化用法，指已被分别、奉献为圣的物件；该译法保留被动结果状态。
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: 奉上帝之名
  rationale: 与“分别为圣”连用，表达这些物件因上帝之名、归于上帝之名而被奉献的关系；中文“奉……之名”既自然，也不把希腊语与格短语过度限定为单纯工具用法。
theological_decisions:
- issue: τῷ ὀνόματι τοῦ θεοῦ与ἡγιασμένα的关系
  choice: 奉上帝之名分别为圣
  alternative: 分别为圣、归于上帝之名；借上帝之名分别为圣
  rationale: 与格可能表达关联、奉献对象或凭借。正文采用较自然且仍保留关联弹性的表达，脚注列出主要理解，避免断定唯一语法功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“玷污”呼应礼仪与道德上的不洁；第二个“玷污了”在中文中补出，以清楚连接并列宾语。用“上帝”对应θεός。
