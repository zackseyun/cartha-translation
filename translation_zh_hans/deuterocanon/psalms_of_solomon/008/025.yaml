  text: They acted according to their uncleannesses[a], just as their fathers did.
translation:
  language: zh_hans
  text: 他们照着自己的污秽[a]而行，正如他们的先祖一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种种不洁”。
    reason: 保留ἀκαθαρσίας复数形式及“不洁／污秽”的词义选择。
lexical_decisions:
- source_word: ἐποίησαν
  choice: 而行
  rationale: ἐποίησαν本义宽泛，可指“做、行”；在κατὰ引出的行为准则之后，译作“而行”自然地表达其行事方式，并保留道德行为的语感。
- source_word: κατὰ
  choice: 照着
  rationale: κατὰ在此表示行为依循或符合某种标准；“照着”准确而自然，也保留原文略显尖锐的表达。
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: 自己的污秽
  rationale: ἀκαθαρσίαι为复数，可指不洁、污秽的状态或表现。汉语“污秽”通常用集合性形式，无须机械标出复数，并能兼顾礼仪与道德层面的含义；“自己的”清楚回指主语。
- source_word: καθὼς
  choice: 正如
  rationale: “正如”明确表达比较关系，并体现他们与前代行为相同的修辞力度。
- source_word: οἱ πατέρες αὐτῶν
  choice: 他们的先祖
  rationale: πατέρες直译可作“父辈”，在此语境中指此前世代；“先祖”是自然、庄重的现代汉语表达，同时不把范围限定为亲生父亲。
