  text: He led away their sons and their daughters[a], whom they had begotten in defilement.
translation:
  language: zh_hans
  text: 他把他们的儿子和女儿带走了；这些儿女是他们在污秽[a]中所生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎”。希腊语名词可指亵渎或污秽。
    reason: 词义存在可保留的译法差异：该词既可突出神圣之物遭亵渎，也可突出由此产生的污秽状态。
lexical_decisions:
- source_word: ἀπήγαγεν
  choice: 带走了
  rationale: 该词在这里表示把人从原处带离，也可用于押解或掳去。“带走了”保留其具体的移送含义，同时不额外限定所用的暴力程度。
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας
  choice: 儿子和女儿
  rationale: 原文分别明确提到男性和女性后代，因此保留成对表达，不笼统译作“儿女”或“孩子”。
- source_word: ἃ
  choice: 这些儿女
  rationale: 希腊语关系代词为中性复数，统指前面的儿子和女儿。汉语用“这些儿女”重新点明先行词，使关系清楚自然。
- source_word: ἐγέννησαν
  choice: 所生的
  rationale: γεννάω可指生育、产生后代；“所生的”在现代汉语中自然，并且不像“所怀的”那样把行动仅限于母亲。
- source_word: ἐν βεβηλώσει
  choice: 在污秽中
  rationale: βεβήλωσις带有玷污、亵渎神圣之物的道德—宗教意味。“在污秽中”可读性较强，同时借脚注保留“亵渎”的词义可能。
theological_decisions:
- issue: ἐν βεβηλώσει的道德—宗教评价
  choice: 在污秽中
  alternative: 在亵渎中
  rationale: 原文不只是陈述生育事实，也对这些生育所处的状态作出负面评价。“污秽”保留这种评价而不补入原文未说明的具体罪行；“亵渎”则作为脚注中的可能译法，呈现该词与神圣领域受侵犯相关的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这些儿女”避免关系从句指代含混；分号体现后半句对前述儿女的补充说明。
