  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: zh_hans
  text: 神在太阳面前揭露了他们的罪；全地都知道了神公义的审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公正的审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: 揭露了
  rationale: 该动词指揭开原本隐藏之事，使其显明；“揭露”既自然，也保留公开显出罪恶的力度。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 他们的罪
  rationale: “罪”是ἁμαρτία在此处最直接、清楚的译法，无须弱化为“过犯”。
- source_word: ἐναντίον τοῦ ἡλίου
  choice: 在日光之下
  rationale: 该短语直译近于“在太阳面前”，语境强调公开显露；现代汉语“在日光之下”保留太阳的意象，又表达众目昭彰之意。
- source_word: ἔγνω
  choice: 都知道了
  rationale: 不定过去时在这里表示因神公开揭露而产生的认识；“知道了”自然体现这一结果。
- source_word: πᾶσα ἡ γῆ
  choice: 全地
  rationale: 保留原文广泛、普世性的范围，且符合庄重的经文语体。
- source_word: τὰ κρίματα τοῦ θεοῦ
  choice: 神……的审判
  rationale: κρίματα在此指神所作的司法判断或审判行动；“审判”直接且具有圣经语境中的连贯性。
- source_word: τὰ δίκαια
  choice: 公义的
  rationale: δίκαια修饰“审判”，既可强调道德上的正直，也可强调司法上的公正；正文采用“公义”，脚注保留“公正”这一可能。
theological_decisions:
- issue: δίκαια修饰神的κρίματα时如何表达
  choice: 公义的审判
  alternative: 公正的审判
  rationale: “公义”兼顾神本身的正直与其审判的正当性，并保留圣经语言的庄重感；“公正”更突出司法层面，作为真实可行的另一译法列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“在日光之下”保留原文太阳意象及公开揭露的含义；语序略作汉语化处理，同时不消解“公义／公正”的词义张力。
