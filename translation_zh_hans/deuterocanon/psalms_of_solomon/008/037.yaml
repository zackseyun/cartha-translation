  language: zh_hans
  text: 你从起初就是我们的上帝；主啊，我们的盼望寄托在你身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπʼ ἀρχῆς
  choice: 从起初
  rationale: 保留希腊语的时间表达及其简洁性；原文没有冠词，不宜擅自具体化为某一个特定开端。
- source_word: ἐπὶ σὲ ἡ ἐλπὶς ἡμῶν
  choice: 我们的盼望寄托在你身上
  rationale: ἐπί加宾格在此表达盼望所指向、倚靠的对象；这一译法既保留“在你身上”的意象，又符合现代汉语。
- source_word: Κύριε
  choice: 主啊
  rationale: 采用呼格语气，准确传达诗人直接向上帝呼求的表达。
theological_decisions:
- issue: “从起初”所修饰的关系
  choice: 你从起初就是我们的上帝
  alternative: 你是我们起初的上帝
  rationale: ἀπʼ ἀρχῆς自然修饰“你是我们的上帝”这一完整判断，表示这关系自起初以来成立；备选译法容易被理解为“最初的一位上帝”，产生原文没有的歧义。
- issue: 盼望与上帝的关系
  choice: 我们的盼望寄托在你身上
  alternative: 你是我们的盼望
  rationale: 保留原文ἐπὶ σέ所表达的指向和倚靠关系，不将其改写为身份等同命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以分号呈现两个并列分句，并把“主啊”置于第二句开头，使呼告清楚流畅。
