base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/001.yaml
  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
translation:
  language: zh_hans
  text: 我的耳朵听见了患难[a]和战争的声音，又听见号角鸣响着杀戮与毁灭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“困苦”或“苦难”。
    reason: lexical_alternative
  - marker: b
    text: “号角鸣响着杀戮与毁灭”也可理解为“号角发出杀戮与毁灭的声响”，或“号角宣告杀戮与毁灭”。
    reason: source_ambiguity
lexical_decisions:
- source_word: Θλίψιν
  choice: 患难
  rationale: 该词指重压之下的困苦、患难或苦楚。“患难”庄重而通俗，并保留原文把“患难”列为所听见之事的突兀意象。
- source_word: φωνὴν
  choice: 声音
  rationale: 此处所指是战争与号角的可听声响，不是说话者的“声音”；译作“声音”最自然，也保留原文的重复。
- source_word: πολέμου
  choice: 战争
  rationale: 这是该词宽泛而直接的对应，比“战斗”更能涵盖整体战争景象。
- source_word: τὸ οὖς μου
  choice: 我的耳朵
  rationale: 保留原文以身体器官作主语的具体意象，而不简化成“我听见”。
- source_word: σάλπιγγος
  choice: 号角
  rationale: 在军事语境中，“号角”能自然表达用于传递战事信号的吹奏乐器，同时不武断限定其材质。
- source_word: ἠχούσης
  choice: 鸣响着
  rationale: 该分词描写号角发声；“鸣响着”避免与前面的“声音”形成生硬的同词重复，并未完全解释成“宣告”或“预示”。
- source_word: σφαγὴν
  choice: 杀戮
  rationale: 保留该词所含大规模暴力杀害的严厉程度。
- source_word: ὄλεθρον
  choice: 毁灭
  rationale: 直接表达彻底败亡、摧毁的含义，并与“杀戮”构成有力并列。
theological_decisions:
- issue: 号角与“杀戮、毁灭”的语义关系
  choice: 号角鸣响着杀戮与毁灭
  alternative: 号角宣告（或预示）杀戮与毁灭
  rationale: 希腊文ἠχούσης后接宾格“杀戮与毁灭”，可带有鸣响出、传出或宣示的意味。正文采用较贴近声音意象且略具诗性的表达，不将其明确收窄为预言性“宣告”。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。保留“我的耳朵听见”这一具体而略显突兀的身体意象，也保留“患难”可被听见的诗性张力；分句以“又听见”理清汉语结构，但不消除原文军事声响逐层加剧的效果。
