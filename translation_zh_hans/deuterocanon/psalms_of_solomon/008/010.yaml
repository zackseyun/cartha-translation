lexical_decisions:
- source_word: υἱὸς
  choice: 儿子
  rationale: 采用代表性的单数亲属称谓，保持原文简峻、概括性的列罪语气，不添入特定人物。
- source_word: μετὰ
  choice: 与
  rationale: μετά加属格在此表示伴随或关联；“与”自然、凝练，并保留两组关系的对称。
- source_word: μητρὸς
  choice: 母亲
  rationale: 直接保留亲属称谓，使所描述的家庭伦理越界清楚可辨。
- source_word: πατὴρ
  choice: 父亲
  rationale: 按原文采用单数亲属称谓，并与“儿子”形成平行结构。
- source_word: θυγατρὸς
  choice: 女儿
  rationale: 直接保留亲属称谓，维持“儿子—母亲／父亲—女儿”的对称关系。
- source_word: συνεφύροντο
  choice: 混在了一起
  rationale: 该未完成时中间／被动形式表达持续或反复的混合、厮混，在本句亲属配对中含有乱伦结合的委婉意味。“混在了一起”保留原词的混合意象，又不把正文改写成原词未明说的露骨性行为措辞。
theological_decisions:
- issue: 是否在正文中明说乱伦或性关系
  choice: 保留委婉而形象的“混在了一起”
  alternative: “发生了性关系”或“乱伦苟合”
  rationale: 上下文中的亲属配对强烈指向乱伦行为，但动词本身使用“混合”的委婉表达。正文保留这一含蓄性，注释再说明语境所指，以免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句法保留原文两组亲属关系的平行结构；“混在了一起”作为委婉语，既传达道德震撼，也避免在正文中增添原文没有明说的露骨细节。
