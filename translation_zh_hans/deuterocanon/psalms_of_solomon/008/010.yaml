  text: 儿子同母亲、父亲同女儿苟合[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“混杂在一起。”原词本指混合；在此亲属配对的语境中，指不正当的结合，暗示乱伦。
