base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/031.yaml
  text: Our eyes have seen your judgments[a], O God; we have justified your honored name forever[b],
translation:
  language: zh_hans
  text: 我们的眼睛看见了你的审判[a]，上帝啊；我们称你那受尊崇的名为义，直到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处难解，按字面是“我们的眼睛给了你的审判”。本译文依上下文所显示的可能含义译作“我们的眼睛看见了你的审判”。
    reason: textual_variant
  - marker: b
    text: “受尊崇的”也可译作“尊贵的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοσαν
  choice: 看见了
  rationale: 传世希腊文本按字面是“给了”，但以“我们的眼睛”为主语、以“你的审判”为宾语，句法和语义都很困难。结合上文上帝显明审判的语境，“看见了”最能表达可能的本意，同时以脚注保留原文疑难。
- source_word: τὰ κρίματά σου
  choice: 你的审判
  rationale: κρίματα在此可指上帝的判决或施行审判的作为；“审判”简洁、庄重，也与上下文相合。
- source_word: ἐδικαιώσαμεν
  choice: 我们称……为义
  rationale: 该动词在这里以“你的名”为宾语，直译涉及“判为义、宣告为义”。“称……为义”保留人的回应与承认之意，又避免暗示人使上帝成为公义。
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: 你那受尊崇的名
  rationale: ἔντιμος表示受尊重、被看为尊贵；“受尊崇的”自然地保留其敬虔和尊荣色彩。
- source_word: εἰς αἰῶνας
  choice: 直到永远
  rationale: 该短语表示延续不息的时间，“直到永远”是现代中文圣经语体中清楚而自然的表达。
theological_decisions:
- issue: 如何翻译以“上帝的名”为宾语的ἐδικαιώσαμεν
  choice: 我们称你那受尊崇的名为义
  alternative: 我们为你那受尊崇的名申明正义；我们宣告你那受尊崇的名为义
  rationale: 此句描述人目睹上帝的审判后承认其公义。“称……为义”较贴近希腊动词，又不表示人赋予上帝公义，而是承认并宣认其公义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称……为义”略带经文语体，以保留ἐδικαιώσαμεν的法律与评价意味；原文首句的传抄或措辞疑难不在正文中强行修正，而由脚注明确说明。
