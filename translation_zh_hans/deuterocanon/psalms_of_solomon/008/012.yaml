base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/012.yaml
  text: The holy things of God were being plundered[b][a], as though there were no heir to redeem them.
translation:
  language: zh_hans
  text: 上帝的圣物不断遭到抢掠[b]，仿佛没有继承人来赎回它们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛没有正在赎回它们的继承人。”希腊语分词可以这样较直接地翻译。
    reason: alternative_reading
  - marker: b
    text: “圣物”也可理解为较宽泛的“神圣之物”，在此处较不可能指“圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγια τοῦ θεοῦ
  choice: 上帝的圣物
  rationale: 中性复数 τὰ ἅγια 最自然地指归上帝为圣之物；“圣物”既保留具体而宽泛的含义，也不武断限定为“圣所”。
- source_word: διηρπάζοντο
  choice: 不断遭到抢掠
  rationale: 未完成时态配合被动形式，描写持续进行的强暴掠夺；“不断遭到抢掠”在现代汉语中自然地表达其持续性和亵渎性的侵占。
- source_word: ὡς μὴ ὄντος
  choice: 仿佛没有
  rationale: 保留该结构所表达的反事实式比较与震惊语气，而不把它解释成事实陈述。
- source_word: κληρονόμου
  choice: 继承人
  rationale: 按名词通常意义直译为“继承人”，不在正文中擅自扩展成“保护者”或“救赎者”。
- source_word: λυτρουμένου
  choice: 来赎回它们
  rationale: 分词表达施行解救、赎回的动作；“赎回”兼有救出和重新取回之意，并以“来”自然连接“继承人”与其行动。
theological_decisions:
- issue: 继承人与赎回行动之间的关系
  choice: 仿佛没有继承人来赎回它们
  alternative: 仿佛没有正在赎回它们的继承人
  rationale: 希腊语属格分词 λυτρουμένου 修饰 κληρονόμου，可较直接地理解为“正在赎回的继承人”，也可在汉语中自然表达为继承人应当承担的行动。正文采用较顺畅的目的／功能式表达，脚注保留更贴近分词形式的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不断遭到抢掠”传达希腊语未完成时的持续状态；保留“继承人”与“赎回”的并置，不消解原文中其角色关系所具有的张力。
