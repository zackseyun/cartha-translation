base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/015.yaml
  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: zh_hans
  text: 因此，上帝把迷惑之灵掺在他们中间[a]，又使他们喝下一杯未掺水的酒，以致醉酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本作“εὕρε πλανήσεως”，语意不通；本句显然引用七十士译本《以赛亚书》19:14，故按该处读作“πνεῦμα πλανήσεως”，即“迷惑之灵”。
    reason: 说明底本文字疑有讹误，并交代引文所支持的校正读法。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文所列罪状，引出审判结果；“因此”自然保留推论关系。
- source_word: ἐκέρασεν
  choice: 调和了
  rationale: 该词通常指调制、混合饮品；此处保留具体的饮酒意象，并与后半句的“酒”相呼应。
- source_word: πνεῦμα πλανήσεως（据《以赛亚书》19:14的引文校正传本所见 εὕρε πλανήσεως）
  choice: 迷惑之灵
  rationale: 现有底本文字 εὕρε 很可能是 πνεῦμα 的严重讹误；本句明显呼应七十士译本《以赛亚书》19:14，因此按“迷惑之灵”翻译，同时以脚注交代文本问题。
- source_word: ἐπότισεν αὐτοὺς
  choice: 使他们喝下
  rationale: 表达使人饮用或给人喝的使役含义，也保留审判临到他们的力度。
- source_word: ποτήριον οἴνου ἀκράτου
  choice: 未掺水的酒
  rationale: ἀκράτου 指没有兑水的酒；译法准确、自然，并传达酒力浓烈的意象。
- source_word: εἰς μέθην
  choice: 直至酩酊大醉
  rationale: 将介词短语理解为结果或终点；“直至”保留其趋向，“酩酊大醉”自然表达 μέθη。
theological_decisions:
- issue: 上帝在审判中与“迷惑之灵”的关系
  choice: 上帝给他们调和了迷惑之灵
  alternative: 上帝容许迷惑之灵临到他们
  rationale: 原文直接以上帝为 ἐκέρασεν 的主语，表达主动的审判作为；不以“容许”弱化原文，同时不进一步解释其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“调和”保留首句与后半句之间连续的饮酒比喻；“未掺水的酒”避免生硬的“未混合之酒”。
