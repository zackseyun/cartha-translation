translation:
  language: zh_hans
  text: 求你以怜悯和恩慈聚集流散的以色列人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的流散”，这里指散居各处的以色列民。
