    reason: lexical_alternative
lexical_decisions:
- source_word: συνάγαγε
  choice: 求你……聚集
  rationale: 这是简短祈求中的不定过去时命令式；“聚集”准确表达使分散者重新会合，而“求你”使祷告语气在现代汉语中自然明确。
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: 流散的以色列人
  rationale: διασπορά在形式上是“流散、散居”的名词，在这里具有集合意义，指流散各处的以色列民。正文采用自然清楚的人称表达，同时以脚注保留原文的名词形式及其历史含义。
- source_word: μετὰ ἐλέους
  choice: 以怜悯
  rationale: μετά加属格在这里表示伴随的态度或施行行动的方式；“以怜悯”既简洁又符合祈祷文体。
- source_word: χρηστότητος
  choice: 恩慈
  rationale: χρηστότης可指良善、仁厚或慈惠；“恩慈”在此能自然表达向流散之民施予的仁厚善意，并与“怜悯”形成协调而不重复的搭配。
theological_decisions:
- issue: διασπορά的集合性与历史神学含义
  choice: 正文译作“流散的以色列人”
  alternative: “以色列的流散群体”或“以色列的流散”
  rationale: 原词可作为具有历史分量的集合名词，但直译成抽象名词在现代汉语中不够自然，也可能让读者误以为所聚集的是一种状态。正文明确人的所指，脚注则保留原文形式及“散居群体”的可能理解。
translation_notes:
  register: 采用庄重而通顺的现代祷告语言。“求你”体现命令式在祈求语境中的功能；句式简洁，适合诗篇体裁。
