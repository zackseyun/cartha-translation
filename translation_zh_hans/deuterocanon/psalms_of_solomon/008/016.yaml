lexical_decisions:
- source_word: ἤγαγεν
  choice: 带来
  rationale: ἄγω的不定过去时在这里表示把某人引入当前场景；“带来”自然地保留了使其来到的动作，且不额外说明主语身份。
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: 那从地极来的人
  rationale: 该宾格短语指明被带来者；“地极”是现代汉语中庄重而通行的地理极远处表达，也保留了ἐσχάτου的边界意象。
- source_word: παίοντα
  choice: 击打的人
  rationale: παίω的现在分词表示击打或猛击；译作“击打的人”直接、现代，并保留其持续性人物特征。
- source_word: κραταιῶς
  choice: 大力
  rationale: 该副词表示以强大力量施行动作；“大力”自然地修饰“击打”，避免使用生硬或过度解释性的措辞。
