  yaml_path: translation/deuterocanon/psalms_of_solomon/008/039.yaml
  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: zh_hans
  text: 愿恩惠永远临到我们和我们的儿女[a]；主啊，我们的救主[b]，我们必永远不再动摇[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”所译的希腊词也可译作“善意”或“美意”。本句原文没有动词，也可译作：“恩惠永远归于我们和我们的儿女。”
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: “救主”也可译作“拯救者”。
    reason: lexical_alternative
  - marker: c
    text: 原文可直译为“我们必不再动摇，直到永恒的岁月”，是对长久稳固的强调表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: 恩惠
  rationale: 此处指临到祈祷群体的善意、悦纳或恩宠。“恩惠”在现代汉语中自然，也不把原文未明说的施予者直接补成“你的”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 的呼格用于直接称呼上帝；“主啊”保留呼告语气，庄重而自然。
- source_word: σωτήρ
  choice: 救主
  rationale: σωτήρ 指施行拯救者；“救主”保留称号性质，并与“我们的”自然搭配。
- source_word: σαλευθησόμεθα
  choice: 动摇
  rationale: 将来被动式表示被震动、被撼动或失去稳固；汉语“动摇”既可表达被动结果，也符合诗歌语境。
- source_word: ἔτι τὸν αἰῶνα χρόνον
  choice: 永远不再
  rationale: ἔτι 与否定词表示“不再”，τὸν αἰῶνα χρόνον 强调持续到永远；“永远不再”以自然汉语保留两重语义。
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  choice: 临到我们和我们的儿女
  rationale: 与格指出受益者；τέκνα 是涵盖性的“儿女/孩子”，并非专指儿子。补出“临到”使无系词句在汉语中通顺。
theological_decisions:
- issue: 无动词首句应理解为祈愿还是陈述
  choice: 译作祈愿：“愿恩惠……临到”
  alternative: 可译作陈述：“恩惠永远属于我们和我们的儿女”
  rationale: 希腊文 ἡμῖν…ἡ εὐδοκία 是无动词结构，既可在祷告语境中作祈愿，也可表达确信。正文采用自然的诗篇式祈愿，脚注保留陈述读法。
- issue: 恩惠的施予者是否明说为上帝
  choice: 不补“你的”
  alternative: “愿你的恩惠……”
  rationale: 语境很可能指上帝的恩惠，但希腊文没有物主代词；不补出可避免把语境推论写成明文。
translation_notes:
  register: 采用现代、庄重的祷告体。“主啊”保留呼告语气；“儿女”兼顾普遍可懂性与经文语体。正文避免加入原文没有的“你的”，并以脚注呈现首句无动词结构的真实歧义。
