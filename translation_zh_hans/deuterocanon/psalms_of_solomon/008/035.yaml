base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/035.yaml
  text: For your faithfulness is with us[a], and we have stiffened our neck[c][b], and you are our disciplinarian.
translation:
  language: zh_hans
  text: 因为你的信实与我们同在[a]，我们却硬起了颈项[b]；而你是管教我们的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的信心与我们同在。”
    reason: lexical_alternative
  - marker: b
    text: “硬起颈项”是指顽梗、不肯顺服。
    reason: cultural_note
lexical_decisions:
- source_word: πίστις σου
  choice: 你的信实
  rationale: 在对上帝的直接称呼中，πίστις 更自然地指他的可靠、忠诚；“你的信心”作为形式上的可能译法保留在脚注中。
- source_word: μεθʼ ἡμῶν
  choice: 与我们同在
  rationale: 直接表达 μετὰ 的伴随、同在关系，也符合现代汉语的庄重语体。
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: 我们却硬着颈项
  rationale: 保留希腊文集体单数“颈项”的圣经性隐喻；现代读者可能不熟悉其含义，故以脚注说明这是顽梗不顺服之意。根据上下文，καὶ 在此译作“却”，突出上帝信实与百姓顽梗之间的反差。
- source_word: παιδευτὴς ἡμῶν
  choice: 管教我们的那一位
  rationale: παιδευτής兼有教导、训练和纠正之意；此译避免“惩罚者”过于严厉，也比单纯“教师”更完整。
theological_decisions:
- issue: πίστις σου 用于上帝时的含义
  choice: 你的信实
  alternative: 你的信心
  rationale: 此处最可能指上帝对其子民坚定可靠的信实，而不是上帝自身所持有的信心；但希腊词本身容许“信心”这一词义，故在脚注中保留。
- issue: 两个 καὶ 所表达的逻辑关系
  choice: 首个译为“却”，末个译为“而”
  alternative: 两处均译为“并且”
  rationale: 希腊文 καὶ 可按语境承载对比或承接关系。强调代词 ἡμεῖς 与 σὺ 形成上帝、百姓之间的鲜明对照；采用“却……而……”既保存张力，又不额外加入教义解释。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“硬着颈项”刻意保留原文隐喻，并借脚注释义；“管教我们的那一位”兼顾教导与纠正的含义。
