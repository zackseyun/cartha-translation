  text: And I said in my heart[a], “Where then will God judge him?”
translation:
  language: zh_hans
  text: 我在心里说[a]：“那么，神要在哪里审判他呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我对我的心说。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: 我心里说
  rationale: 希腊文直译为“我对我的心说”；现代汉语用“我心里说”更自然，同时保留“心”的意象和内在自语的含义。
- source_word: Ποῦ ἄρα
  choice: 那么……在哪里
  rationale: Ποῦ表示“在哪里”，ἄρα带有推论或沉思语气；以“那么”体现其承接和思索意味。
- source_word: κρινεῖ
  choice: 要……审判
  rationale: κρίνω的基本义为“审判、判断”。上下文或可暗示惩罚，但此动词本身不必然等于“定罪”，故不作强化。
- source_word: αὐτόν
  choice: 他
  rationale: 该词为阳性单数宾格代词，直接译作“他”，不增补原文未明说的身份。
- source_word: ὁ θεός
  choice: 神
  rationale: 在此为对θεός的标准译法，定冠词不需在中文中另行体现。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。问句保留原文对审判地点的疑问，不将其解释为审判方式或结果。
