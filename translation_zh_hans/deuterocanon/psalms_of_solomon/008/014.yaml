  text: They omitted no sin that they did not commit[a], beyond the nations.
translation:
  language: zh_hans
  text: 他们没有一种罪不犯，在罪恶上甚至超过列国。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他们没有一种罪不犯，超过列国。”末尾“超过列国”可概括他们犯罪的程度，也可较紧密地与“犯”相连理解。
    reason: 原文末尾比较短语的句法关联凝练；脚注保留其可修饰整体犯罪情形或较紧接“犯”的可能性。
lexical_decisions:
- source_word: παρέλειπον
  choice: 漏掉
  rationale: 这里指遗漏、留下不做；与后面的否定关系从句合起来，表达“一样罪也没有不犯”的完整语气。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: 直接保留希腊词的道德与宗教含义，也符合本段庄重语体。
- source_word: ἐποίησαν
  choice: 去犯
  rationale: 原义是“做”，但现代汉语通常说“犯罪”；在此用“去犯”既自然，也保留关系从句的动作性。
- source_word: ὑπὲρ τὰ ἔθνη
  choice: 甚至超过了列国
  rationale: ὑπέρ带有超越、胜过的比较意味；“列国”指其他民族，“甚至”使末尾短语与前句的递进关系在汉语中更清楚，同时不限定具体比较维度。
theological_decisions:
- issue: ὑπὲρ τὰ ἔθνη与前句的句法关系
  choice: 理解为他们犯罪的程度甚至超过列国
  alternative: 把它紧接于“去犯”，理解为“他们所犯的每一样罪都比列国更甚”
  rationale: 希腊语末尾短语较为凝练，可表示总体上的超越，也可能具体修饰“做／犯”。正文保留概括性的比较，脚注说明另一种连接方式，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“没有漏掉一样罪而不去犯”有意保留原文双重否定式的力度；“列国”较“外邦人”更贴近 τὰ ἔθνη 在此泛指其他民族的含义。
