  text: And the holy ones of God were like lambs in innocence in their midst[a][b][c][d].
translation:
  language: zh_hans
  text: 而上帝的虔诚者[a]在他们中间[b]，如羔羊般纯真无邪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔诚者”也可译作“忠信者”。
    reason: lexical_alternative
  - marker: b
    text: “他们”所指的对象由上下文确定；原文没有进一步说明。
    reason: referential_ambiguity
  - marker: c
    text: 原文直译为“如同羔羊，在纯真无邪中”。
    reason: literal_rendering
lexical_decisions:
- source_word: ὅσιοι
  choice: 虔诚人
  rationale: 此词指以敬虔和对上帝忠贞为特征的人；“虔诚人”可与通常译作“圣者”的 ἅγιοι 保持区别，也不带入后期教会称号的意味。
- source_word: ἀρνία
  choice: 羔羊
  rationale: 原词明确指幼羊；“羔羊”保留其柔弱、无害的意象。
- source_word: ἐν ἀκακίᾳ
  choice: 纯真无邪
  rationale: ἀκακία 表示无恶意、无诡诈的纯真状态。正文用自然的汉语并列描述，同时由脚注保留原文介词结构。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 在他们中间
  rationale: 贴近原文的空间表达，并保留“他们”所指对象须由上下文判断的开放性。
theological_decisions:
- issue: ὅσιοι 的群体称谓
  choice: 虔诚人
  alternative: 忠信者；圣者
  rationale: “虔诚人”较准确地表达该词的敬虔和盟约忠贞色彩，同时避免把它等同于更常表示“圣者”的 ἅγιοι，或把“忠信”这一层含义强调得过于单一。
- issue: 无动词句的时态
  choice: 汉语正文不另补系词及时态
  alternative: 当时如同；曾如同
  rationale: 希腊文此句没有明说动词。现代汉语允许名词性比喻句不补“是”，因此可保留原文的省略，并由上下文提供过去叙事背景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“而”承接前文并呈现对照；不在无动词的希腊文分句中强行补入时态。
