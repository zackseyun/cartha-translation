  text: They trampled the altar of the Lord with every uncleanness[a], and with menstrual blood they defiled the sacrifices like profane meat[c][b];
translation:
  language: zh_hans
  text: 他们用各样污秽践踏主的祭坛[a]，又用经血玷污祭物[b]，使祭物如同不圣洁的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的希腊词形难解；有密切支持的异文可译作“他们践踏主的祭坛”。
    reason: textual_variant
  - marker: b
    text: 或较直译作“在月经的血污中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίπουσαν
  choice: 践踏
  rationale: 传世希腊词形难解，但有密切支持的异文及上下文均指向对祭坛的粗暴亵渎；“践踏”自然有力，并以脚注保留文本疑难。
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: 主的祭坛
  rationale: 采用现代汉语中自然、庄重的圣所用语，准确表达祭坛及其属于主的关系。
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: 用各样污秽
  rationale: “污秽”保留礼仪洁净语境；介词短语在此按手段或来源理解，以“用”顺畅表达亵渎方式。
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: 用经血
  rationale: ἄφεδρος在七十士译本礼仪语境中特指月经及其不洁；“经血”简洁明确，也保留令人震惊的具体亵渎行为。
- source_word: ἐμίανιν
  choice: 玷污
  rationale: 适合祭物与礼仪污染的语境，现代汉语自然且庄重。
- source_word: τὰς θυσίας
  choice: 祭物
  rationale: 此处指献上的祭牲或供物；“祭物”比“祭祀”更明确地指被玷污的对象。
- source_word: ὡς κρέα βέβηλα
  choice: 把它们当作凡俗的肉
  rationale: βέβηλα与神圣、分别为圣相对；“凡俗”保留圣俗对立，“把它们当作”自然表达ὡς在此的比较或视同含义。
theological_decisions:
- issue: 经血与礼仪不洁的具体性
  choice: 正文明确译为“经血”
  alternative: 血漏；带血的排泄物；月经所致的血污
  rationale: 词语在七十士译本礼仪法规中具有月经含义。明确翻译呈现作者所指的具体圣所亵渎，不将古代礼仪范畴泛化，也不延伸为对女性或身体本身的价值判断。
- issue: βέβηλα所表达的圣俗对立
  choice: 凡俗的肉
  alternative: 亵渎的肉；不洁的肉
  rationale: 该词重点是不属神圣范围，而非再次陈述礼仪污染；“凡俗”较好保留神圣与普通之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留祭坛、污秽、玷污等礼仪语汇；以“经血”明确原文的具体所指，并用“凡俗的肉”呈现神圣与普通之间的对比。
