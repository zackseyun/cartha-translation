  yaml_path: translation/deuterocanon/psalms_of_solomon/008/018.yaml
  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: zh_hans
  text: 当地的统治者欢喜地迎接他，对他说：“你的来临真受欢迎[a]。来吧，平安地进来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的道路是所期盼的”或“愿你的道路蒙福”。希腊词可指所盼望的、受欢迎的或所祈求的；“道路”也可指行程或所走的路。
    reason: 保留Εὐκτή及ὁδός的词义范围，避免在正文中扩展为“我们所期盼的”。
lexical_decisions:
- source_word: ἠπάντησαν
  choice: 迎接
  rationale: 该动词表示与人相遇，也常含出去接应、接待之意；本节是欢迎来者的场景，因此“迎接”比单纯“遇见”更自然。
- source_word: οἱ ἄρχοντες
  choice: 统治者
  rationale: 指掌权者或地方上的政治领袖；“统治者”保留其政治权力色彩。
- source_word: τῆς γῆς
  choice: 当地的
  rationale: γῆ可指土地、地区或全地；结合地方政治语境，用“当地的”自然表达“这地的”，但不将其扩大为全世界。
- source_word: μετὰ χαρᾶς
  choice: 欢欢喜喜地
  rationale: 准确表达带着喜乐、欣然相迎的方式，且符合现代汉语叙事。
- source_word: Εὐκτὴ
  choice: 正是我们所期盼的
  rationale: εὐκτός的核心意义是“所祈求的、所盼望的、合人心愿的”，并非通常意义上的“兴旺”；这样译能清楚表达欢迎和称许，同时保留愿望得到实现的意味。
- source_word: ἡ ὁδός σου
  choice: 你的道路
  rationale: ὁδός既可指实际道路、行程，也可指所走的路线或行动进程；“道路”保留这种语义宽度。
- source_word: δεῦτε
  choice: 来吧
  rationale: 这是邀请性的命令语；“来吧”既自然，也传达欢迎的语气。
- source_word: εἰσέλθατε
  choice: 进来
  rationale: 表示进入；在说话者欢迎对方进入的场景中，“进来”比书面化的“进入”更符合汉语直接引语。
- source_word: μετʼ εἰρήνης
  choice: 平安地
  rationale: 直译为“带着平安”，在此表示平安无事地进入；“平安地进来”是自然且贴近原意的汉语。
theological_decisions: []
