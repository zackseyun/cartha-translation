  text: He entered like a father into the house of his sons in peace[b][a]; he set his feet with great security.
translation:
  language: zh_hans
  text: 他像父亲一样，平安地走进他儿子们的家[a]；他十分安稳地立定双脚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他儿子们的房屋”。希腊语也可按较自然的所属关系理解为“他儿子们的家”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他以极大的安稳使双脚站定”。这句话可表示稳固立足，也可强调安全、稳妥而不受阻碍。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 走进
  rationale: 表达进入某处的完成动作，符合现代汉语叙事习惯，也保留了具体的移动意象。
- source_word: ὡς πατὴρ
  choice: 像父亲一样
  rationale: ὡς在此引出明喻；这样译不把比较关系强化为身份断言。
- source_word: οἶκον υἱῶν αὐτοῦ
  choice: 他众子的家
  rationale: 保留οἶκος的具体“家／房屋”意象以及复数υἱῶν；“众子”在庄重文体中自然且清楚。
- source_word: μετʼ εἰρήνης
  choice: 平安地
  rationale: 以自然的汉语方式表达“在平安中／带着和平”的状态或方式，同时不限定为内心安宁、无冲突或人身安全中的某一种。
- source_word: ἔστησεν τοὺς πόδας αὐτοῦ
  choice: 站稳了脚跟
  rationale: 保留双脚站定的身体意象，并以现代汉语惯用表达传达稳固立足；脚注补出更贴近形式的译法。
- source_word: μετὰ ἀσφαλείας πολλῆς
  choice: 十分安稳地
  rationale: ἀσφάλεια表示安全、稳妥或稳固，πολλῆς加强程度；副词化处理使汉语流畅，并与“站稳脚跟”自然搭配。
