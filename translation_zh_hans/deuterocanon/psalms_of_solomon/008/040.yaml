base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/040.yaml
  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: zh_hans
  text: 主因他的审判[a]而在虔诚人的口中受赞美[b]；以色列蒙主赐福，直到永远[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他的审判”或译“在他的审判中”。
    reason: 保留ἐν τοῖς κρίμασιν αὐτοῦ在原因、方面或处境关系上的语义弹性。
  - marker: b
    text: “虔诚人”或译“忠信者”。
    reason: ὁσίων可突出敬虔，也可突出对神忠信；两者在此均有根据。
  - marker: c
    text: 也可理解为祝愿：“愿以色列蒙主赐福，直到永远。”
    reason: 无系词的εὐλογημένος既可作陈述，也可能带有祝颂或祈愿色彩。
lexical_decisions:
- source_word: αἰνετὸς
  choice: 受赞美
  rationale: 这是表语形容词，表达耶和华是受人赞美的；“受赞美”在现代汉语中自然，也避免把陈述句过度处理成祈愿句。
- source_word: Κύριος
  choice: 耶和华
  rationale: 此处是以色列之神的称号；结合诗篇体裁与上下文，采用现代中文圣经读者熟悉的“耶和华”。
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: 因他的审判
  rationale: 介词ἐν在此可表达赞美所基于或涉及的方面；译作“因他的审判”使中文关系清楚，同时以脚注保留“在他的审判中”的较形式对应译法。
- source_word: ἐν στόματι
  choice: 在……口中
  rationale: 保留希腊文“口”的具体意象，指公开说出的赞美；比单纯译作“借着”更贴近原文。
- source_word: ὁσίων
  choice: 虔诚人
  rationale: ὅσιος着重对神虔敬、忠诚的人，不宜与通常对应ἅγιος的“圣者”完全混同；“虔诚人”自然且较少带入特定宗派用语。
- source_word: εὐλογημένος
  choice: 蒙……赐福
  rationale: 结合ὑπὸ Κυρίου所标明的施事者，译作“蒙耶和华赐福”准确表达被动含义，并与现代汉语搭配自然。
- source_word: Ἰσραὴλ
  choice: 以色列
  rationale: 按现代标准汉语的通行译名处理专名。
- source_word: ὑπὸ Κυρίου
  choice: 蒙耶和华
  rationale: ὑπό加属格标明施事者，即赐福者是耶和华；与“赐福”合译为“蒙耶和华赐福”。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 这是表达持续无穷的惯用语；“直到永远”符合庄重诗体，也为普通读者清楚易懂。
theological_decisions:
- issue: ὅσιοι所指群体的称谓
  choice: 虔诚人
  alternative: 忠信者／圣者
  rationale: “虔诚人”保留其对神敬虔、忠贞的语义重点，又不把该词直接等同于ἅγιοι，也不预设后世教会对“圣徒”的特定理解。
- issue: εὐλογημένος Ἰσραήλ的语气
  choice: 以色列蒙耶和华赐福
  alternative: 愿以色列蒙耶和华赐福
  rationale: 无系词的形容词结构首先可读作陈述，与前半句αἰνετός的表语结构平行；但祝颂语境也容许祈愿理解，因此在脚注中保留该可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留诗歌的两行平行结构。主句不机械复制两个ἐν，却通过正文和脚注兼顾原文意象与介词关系的歧义；避免使用可能把ὅσιοι与ἅγιοι混同的“圣者”。
