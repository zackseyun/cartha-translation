revisions:
- from: 大群百姓的声响[a]如同极其猛烈的风，又像一场风暴，卷着熊熊烈火穿过旷野。[b]
  to: 大群百姓的声响[a]如同极其猛烈的风，又像一场大火被卷过旷野的风暴。[b]
  rationale: 修订后保留原文独立陈述及连续比喻。“大火被卷过旷野的风暴”尽可能反映φερομένου与πυρός的语法关联和被动运动，不把风暴定为主动卷带火焰；“大火”也比“熊熊烈火”更贴近πυρὸς πολλοῦ的数量／强度表达。
  reviewer_model: gpt-5.6-terra
