    issue: 后半句“风暴，卷着熊熊烈火穿过旷野”将φερομένου的被动分词改为风暴主动卷带火焰。
    rationale: φερομένου为单数属格中性，语法上修饰πυρός，表达火被带动／卷行穿过旷野；中文应尽量保留这一动态与关系，且不将其明确解释成风暴携火。
  - severity: low
    issue: 脚注b的“又像大量的火被卷过旷野时的风暴”语序不自然，且“时的”使修饰关系不够清晰。
    rationale: 应以自然中文明确该风暴与被卷过旷野的“大火”之间的属格关系，同时保留原文可感知的歧义。
  revised_text: 大群百姓的声响[a]如同极其猛烈的风，又像一场大火被卷过旷野的风暴。[b]
