  text: The sound of a great multitude was like a very strong wind[c][b][a], like a storm of great fire sweeping through the wilderness.
translation:
  language: zh_hans
  text: 大群百姓的声响[a]如同极其猛烈的风，又像一场大火被卷过旷野的风暴。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声响”或译“声音”；“大群百姓”也可译“许多人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又像一场许多火被带过旷野的风暴。”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: 声响
  rationale: 这里指一大群人所发出的整体声响，并非某一个人的话语；“声响”既保留听觉意象，也符合现代汉语表达。
- source_word: λαοῦ πολλοῦ
  choice: 大群百姓
  rationale: λαός是集合意义的“百姓、民众”，πολλοῦ强调人数众多；“大群百姓”兼顾群体性和规模。
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: 极其猛烈的风
  rationale: πολλοῦ与σφόδρα叠加强调风势；“极其猛烈”自然地传达双重加强的语气。
- source_word: καταιγὶς
  choice: 一场风暴
  rationale: “风暴”是清楚、现代且有力度的对应词；量词“一场”使汉语自然。
- source_word: πυρὸς πολλοῦ
  choice: 熊熊烈火
  rationale: 原文直义为“大量的火”；“熊熊烈火”以自然汉语表现火势之盛，又不额外引入新的解释。
- source_word: φερομένου διʼ ἐρήμου
  choice: 卷着……穿过旷野
  rationale: 分词φερομένου在语法上与πυρός呼应，描写烈火受力而向前移动；译文用“风暴，卷着……穿过”自然呈现这一动态意象。“旷野”符合ἔρημος的经文语域。
