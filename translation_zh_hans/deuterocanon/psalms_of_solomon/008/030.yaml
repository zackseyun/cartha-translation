  yaml_path: translation/deuterocanon/psalms_of_solomon/008/030.yaml
  text: Behold now[a], O God, you have shown us your judgment in your righteousness,
translation:
  language: zh_hans
  text: 看哪，上帝啊，你已经在你的公义中向我们显明了你的审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你的公义中”也可译作“凭着你的公义”，或“在你的正义中”。
    reason: 保留ἐν的关系以及δικαιοσύνη在道德与司法语境中的词义可能。
lexical_decisions:
- source_word: ἰδοὺ δή
  choice: 看哪
  rationale: 该组合是加强语气的提示语，引人注意下文。“看哪”保留了庄重、祷告式的强调；δή的加强作用由整体语气体现，避免生硬译作“现在”。
- source_word: ὁ θεός
  choice: 上帝啊
  rationale: 结合语境按直接呼告处理；“啊”自然体现希腊语在祷告中的呼格功能。
- source_word: ἔδειξας
  choice: 你已经……显明了
  rationale: 不定过去时指已经完成的行动；“已经……了”在现代汉语中也表达其当下关联。“显明”比“启示”少一层术语化色彩，同时比单纯“显示”更符合庄重语体。
- source_word: τὸ κρῖμά σου
  choice: 你的审判
  rationale: κρῖμα在此主要指上帝司法性的判断、裁决或审判行动。“审判”保留法庭性分量，又不把意义限定为某一道具体判决。
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: 在你的公义中
  rationale: ἐν可表达行动所在的领域或方式；直译为“在……中”保留这种语义开放性。δικαιοσύνη按主要对应译作“公义”，并以脚注保留司法语境中的“正义”可能。
theological_decisions:
- issue: 在上帝审判的语境中如何翻译 δικαιοσύνη
  choice: 公义
  alternative: 正义
  rationale: “公义”可同时承载上帝道德上的正直与司法上的公正；“正义”则更突出司法维度。正文采用涵盖面较广且符合经文语体的“公义”，脚注保留“正义”，不消除原文在道德与司法含义之间的张力。
- issue: ἐν在“ἐν τῇ δικαιοσύνῃ σου”中的关系
  choice: 在你的公义中
  alternative: 凭着你的公义
  rationale: 该介词短语既可理解为审判显明于上帝公义的领域中，也可理解为上帝按其公义行事的方式。正文采用较形式对应的表达，以免只确定为工具或依据关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“看哪”保留原文强调；“上帝啊”体现直接呼告。句末脚注标记与正文对应。
