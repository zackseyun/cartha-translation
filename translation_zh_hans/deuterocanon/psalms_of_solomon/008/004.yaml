  text: I heard a voice in Jerusalem[b][a], the holy city.
translation:
  language: zh_hans
  text: 我听见耶路撒冷这座圣洁之城中有响声[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “响声”也可译作“声音”。原文在本诗前几节反复使用同一个词，指战争、号角和人群的声响。
    reason: lexical_alternative
  - marker: b
    text: “城中”：原文所用介词通常也可表示“进入”或“朝向”；这里按地点意义翻译。
    reason: source_ambiguity
lexical_decisions:
- source_word: φωνήν
  choice: 响声
  rationale: φωνή既可指“声音、嗓音”，也可泛指可听见的响声。结合本诗前几节重复使用该词描述战争、号角和人群的声响，此处译作“响声”既符合语境，也保留这一修辞呼应。
- source_word: ἤκουσα
  choice: 我听见
  rationale: 不定过去时ἤκουσα在此直接陈述听觉感知，现代汉语以“我听见”表达自然、准确。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷……中
  rationale: εἰς通常表示“进入、朝向”，但在较晚期希腊语中也可作地点用法；此处按语境译作地点性的“在耶路撒冷城中”。
- source_word: πόλιν ἁγιάσματος
  choice: 这座圣洁之城
  rationale: 该短语直译为“一座圣洁之城”或“圣洁的城”。它与专名“耶路撒冷”构成同位关系，因此用“耶路撒冷这座圣洁之城”既自然，也保留原文的称谓。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。调整希腊语语序，将地点和同位说明置于“有响声”之前，使句子符合汉语习惯；同时以“响声”维持上下文中φωνή的重复效果。
