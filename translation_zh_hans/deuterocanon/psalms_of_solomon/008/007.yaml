  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: zh_hans
  text: 我说：“他们以公义使自己的道路正直。”我思量了上帝自创造天地以来的审判[a]；我宣告[b]上帝在他自古以来[c]的审判中是公义的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自创造天地以来”也可理解为修饰“我思量了”，即“自从创造天地以来，我思量上帝的审判”。
    reason: alternative_reading
  - marker: b
    text: 或译：“我称上帝为义。”
    reason: lexical_alternative
  - marker: c
    text: 也可译：“自永恒以来的”。
    reason: alternative_reading
  - marker: d
    text: 或译：“我为上帝申明公义。”
    reason: previous_rendering
lexical_decisions:
- source_word: Κατευθύνουσιν
  choice: 引导
  rationale: 该动词可指使道路笔直，也可指引导、导正。这里以“引导自己的道路”保留道路意象，同时符合现代汉语表达。
- source_word: ὁδοὺς
  choice: 道路
  rationale: “道路”既保留复数路径意象，也可自然承载行为方式的道德含义。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 此处描述行路或行事所遵循的道德准则；“公义”既保留宗教诗歌语域，也与后文“是公义的”形成原文 δίκαι- 词根的呼应。
- source_word: ἀνελογισάμην
  choice: 思想了
  rationale: 该中间语态动词表示经过思量、反省或衡量；“思想了”简明地保留其审慎思考的意味。
- source_word: κρίματα
  choice: 审判
  rationale: 该词可涵盖上帝的判决及施行判断的作为；“审判”能够保留司法和神学两方面的含义。
- source_word: ἐδικαίωσα
  choice: 宣告……是公义的
  rationale: 这一表达既传达说话者承认上帝为义的意思，又在汉语中避免“使上帝称义”所可能造成的误解，并与 δικαιοσύνῃ 的“公义”保持词义呼应。
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: 自古以来的
  rationale: ἀπʼ αἰῶνος 可表示自远古以来，也可带有自永恒以来的意味；正文采用较少过度限定的“自古以来”，并以脚注保留另一可能。
theological_decisions:
- issue: 如何翻译 ἐδικαίωσα τὸν θεόν
  choice: 我宣告上帝……是公义的
  alternative: 我以上帝为义；我为上帝申明公义
  rationale: 原句是说话者承认或宣明上帝在其审判中为义，并非赋予上帝公义。正文保留宣告性质以及与前句“公义”的词根联系，脚注则呈现更贴近希腊语形式和“申明无误”色彩的译法。
- issue: τοῖς ἀπʼ αἰῶνος 所表达的时间范围
  choice: 自古以来的审判
  alternative: 自永恒以来的审判
  rationale: 希腊语既可指久远的古时，也可能指永恒。创造天地的上下文不能完全排除任何一种，故正文不作形而上的定论，并在脚注保留较强读法。
- issue: ἀπὸ κτίσεως οὐρανοῦ καὶ γῆς 的修饰关系
  choice: 上帝自创造天地以来的审判
  alternative: 自从天地受造以来，我就思想上帝的审判
  rationale: 希腊语允许时间短语与“审判”紧密结合，也可理解为限定“思想”的时间。正文依照最自然的邻近关系处理，但不把另一种句法理解提升为教义结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“公义—是公义的”有意保留原文 δικαιοσύνη／δικαιόω 的词根呼应；句式略带诗歌和司法语域，但避免古奥表达。
