lexical_decisions:
- source_word: κατελάβετο
  choice: 夺取了
  rationale: 此处表示取得并控制防御设施；“夺取”既保留军事语境，也不把具体攻取方式说得过细。
- source_word: τὰς πυργοβάρεις
  choice: 坚固塔楼
  rationale: 这是罕见词，指防御性建筑；“坚固塔楼”贴近该复合词的构词含义，并与下文“城墙”自然并列。
- source_word: αὐτῆς
  choice: 她的
  rationale: 阴性代词回指人格化的耶路撒冷；保留“她”可传达诗歌中将城视为女性的意象。
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: 耶路撒冷的城墙
  rationale: 保留希腊文单数集合意义，并明确说出城名。
