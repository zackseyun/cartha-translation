translation:
  language: zh_hans
  text: 因所听见的消息，我的腰被压碎了；我的膝盖也瘫软了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因听闻这消息，我的腰被压碎了；我的膝盖失去了力气（或：垮下了）。”
    reason: 原文首句为名词结构，省略系词；ἀπὸ ἀκοῆς可译为“因听闻”或“因所听见的消息”。παρελύθη可指瘫痪、失力或垮下。
lexical_decisions:
- source_word: συντριβὴ
  choice: 像被压碎了
  rationale: 该名词表示压碎、破碎或崩溃；按上下文补出谓语，并以“像被压碎了”自然表达强烈的身体反应，同时避免把名词结构误作明确的被动动词。
- source_word: ἡ ὀσφύς μου
  choice: 我的腰
  rationale: ὀσφύς可指腰、腰部或髋部；现代汉语以“腰”最自然，也保留原文身体意象。
- source_word: ἀπὸ ἀκοῆς
  choice: 一听见这消息
  rationale: 该短语可表示“因听见”“由于所听到的消息”；此译法清楚表达原因，也符合现代汉语叙述习惯。
- source_word: παρελύθη
  choice: 瘫软了
  rationale: 该不定过去时被动形式可指瘫痪、无力或松垮；以膝盖为主语时，“瘫软了”兼顾身体失力的意象和汉语自然度，不将其限定为医学意义上的瘫痪。
- source_word: γόνατά μου
  choice: 我的膝盖
  rationale: 直接对应原文，指说话者的双膝；汉语通常无需显式标示复数。
