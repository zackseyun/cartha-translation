  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: zh_hans
  text: 他的道路蒙主引导；他手所做的，也蒙主、他的上帝看守。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: 他的道路
  rationale: 保留“道路”的具体意象，同时在上下文中自然涵盖一个人的行事方式和人生进程，不作过度限定。
- source_word: κατευθύνονται
  choice: 蒙……引导
  rationale: 希腊语为被动形式，表示道路因主的作为而被导向正途；“蒙……引导”既保留神为施事者，也符合现代汉语表达。
- source_word: πεφυλαγμένα
  choice: 蒙……看守
  rationale: 完成时被动分词强调处于被守护的状态；“看守”保留持续照管和保护的意味，又不过度解释为必然免受一切伤害。
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: 他手所做的
  rationale: 保留“手”的具体意象，并以自然汉语表达其行为、劳作或成果。
- source_word: Κυρίου
  choice: 主
  rationale: 按词义及经文语域译为“主”；两个ὑπό短语均明确指出主是被动动作的施事者。
- source_word: Κυρίου θεοῦ αὐτοῦ
  choice: 主他的上帝
  rationale: 尽量保留原文“主—他的上帝”的同位关系及所属意味；虽略带庄重的书面色彩，但避免把其中任一称谓省略。
theological_decisions:
- issue: 两个被动结构中的神圣施事
  choice: 明确译出人的道路蒙主引导，所做的蒙主看守
  alternative: 弱化为人在主面前顺利，或仅笼统说得到祝福
  rationale: 原文两次用ὑπό明确指出主为施事者，因此保留强烈的神圣引导与护佑陈述，不将其削弱为一般性的顺遂。
- issue: “看守”所表达的护佑范围
  choice: 保留为受主看守的状态
  alternative: 解释为所有成果必然成功或绝不受损
  rationale: πεφυλαγμένα表达被守护、被保全的状态，但本节没有进一步界定这种护佑在现实中的具体表现，故不作教义性扩充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙……引导／看守”形成平行结构，保留原文两句被动式及神为施事者的重点；“主他的上帝”有意保存原文称谓结构。
