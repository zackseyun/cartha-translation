translation:
  language: zh_hans
  text: 心已准备好求告[a]主名的人[b]有福了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求告”也可译作“呼求”或“援引”。
    reason: lexical_alternative
  - marker: b
    text: 原文“人”采用阳性单数形式，在这里具有代表性、泛指的意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριος
  choice: 有福了
  rationale: 这是智慧文学中祝福宣告式的用语；“有福了”庄重自然，也比“快乐”更能保留其圣经语体。
- source_word: ἀνὴρ
  choice: 人
  rationale: 希腊文为阳性单数，但在此用于代表性、泛指意义；现代汉语用“人”即可自然涵盖原文所指，同时脚注说明其语法形式。
- source_word: καρδία
  choice: 心里
  rationale: 保留圣经中“心”指内在意向和性情的惯用意象；在句法中译为“心里”较符合现代汉语表达。
- source_word: ἑτοίμη
  choice: 预备好
  rationale: 表达已经准备妥当的状态，并保留既可指内在意愿、也可指实际准备的语义范围。
- source_word: ἐπικαλέσασθαι
  choice: 求告
  rationale: 该词在宗教语境中表示呼求、祈求或援引主名；“求告”是自然而庄重的汉语圣经用语。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 保留“名”这一具有丰富圣经含义的原文表达，不将其解释性地改写为“权柄”或“声誉”。
- source_word: Κυρίου
  choice: 主
  rationale: κύριος在此按项目惯例译为“主”；“主名”是简洁、自然且庄重的汉语搭配。
theological_decisions:
- issue: “求告主名”是否应解释为祈祷、援引权柄或敬拜
  choice: 保留“求告主名”
  alternative: 向主祷告／援引主的名
  rationale: 原文措辞具有宗教性且语义丰富；直译式表达可保留其神学张力，不把含义限定为某一种行为。
translation_notes:
  register: 采用现代、庄重而易懂的祝福宣告句式。“心里预备好”贴近原文结构；将“有福了”置于句末，使汉语表达更自然。
