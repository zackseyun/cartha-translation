base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/007.yaml
  text: With gladness in his heart he sang praise to the name of God[b][a], and he entreated the Lord for all his household.
translation:
  language: zh_hans
  text: 他心里欢喜，歌颂上帝的名，并为自己的全家恳求主施恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“恳求主的面”，这是求主眷顾、施恩的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: 他心里欢喜
  rationale: 保留“欢喜”与“心”的圣经性表达，同时用自然的现代汉语呈现“在他心中的欢喜里”这一结构。
- source_word: ἐξύμνησεν
  choice: 歌颂
  rationale: 该动词带有以诗歌或赞歌颂赞的意味；“歌颂”比单纯的“赞美”更能体现这一色彩，又不显生硬。
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: 上帝的名
  rationale: 原文明确提到上帝的“名”；保留这一表达，可传达敬虔呼求与尊崇的圣经意象。
- source_word: ἐδεήθη
  choice: 恳求
  rationale: 该词表示迫切、谦卑地求告，不只是泛指祷告；“恳求”准确而自然。
- source_word: τοῦ προσώπου Κυρίου
  choice: 求主施恩
  rationale: 从希腊语句法看，该属格短语是ἐδεήθη所求告的对象；“主的面”又反映“求主的面、求主恩待”的希伯来式习语。正文以“求主施恩”传达其功能意义，脚注保留字面形式。
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: 为自己的全家
  rationale: οἶκος在此指家庭或家中众人，而非房屋；“全家”简洁地保留了整体范围，περί则译为代求意义的“为”。
theological_decisions:
- issue: τοῦ προσώπου Κυρίου这一神人关系习语的译法
  choice: 恳求主施恩
  alternative: 恳求主的面／求主眷顾
  rationale: 直译“恳求主的面”在现代汉语中难以理解，而仅译“在主面前恳求”会把希腊语的属格宾语误解为处所状语。“求主施恩”既保留向主恳求的句法关系，也表达该希伯来式习语所指的寻求主恩待；脚注说明字面形式，以免隐藏原文意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里欢喜”“歌颂上帝的名”“全家”均便于普通读者理解，同时保留原文的敬虔语域与核心意象。
