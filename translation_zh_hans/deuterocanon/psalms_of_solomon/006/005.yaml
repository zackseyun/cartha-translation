    reason: lexical_alternative
  - marker: c
    text: “必不惊惶”也可译作“不会惊恐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: 心
  rationale: ψυχή可指人的内在生命、性命或整个自我。此处译作“心”，既保留诗歌中内在之人的意味，也比直译“灵魂”更符合现代汉语表达；其他可能含义列入脚注。
- source_word: διάβασις
  choice: 渡过
  rationale: διάβασις表示穿越、通行或渡口；在ποταμῶν（江河）的语境中，动词化译为“渡过”自然清楚，并保留涉险渡河的意象。
- source_word: σάλος
  choice: 波涛翻腾
  rationale: σάλος表示海水的动荡、颠簸或汹涌。“波涛翻腾”以自然的汉语呈现海面剧烈起伏的动态意象。
- source_word: πτοηθήσεται
  choice: 不会惊惶
  rationale: πτοέω的被动式表示受到惊吓、陷入惊恐或惊慌。“不会惊惶”比一般的“不害怕”力度更强，同时保持庄重而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。为避免生硬的名词堆叠，将διάβασις和σάλος所构成的希腊语介词结构适度动词化为“渡过……、遭遇……时”，同时保留江河与海涛两幅并列的险境意象。
