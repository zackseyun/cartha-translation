  text: His soul will not be terrified at the crossing of rivers and the tossing of seas[a][b][c].
translation:
  language: zh_hans
  text: 在渡河和海上波涛翻腾时，他的心[a]必不惊惶[c]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”也可译作“生命”或“他自己”。
    reason: lexical_alternative
  - marker: b
