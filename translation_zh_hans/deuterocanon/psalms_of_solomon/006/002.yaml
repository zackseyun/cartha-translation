  text: When he remembers the name of the Lord[a], he will be saved.
translation:
  language: zh_hans
  text: 当他记念主的名时，他必蒙拯救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必蒙解救。”
    reason: 词义备选；σωθήσεται可表示获救，也可特指从困境或危险中被解救。
lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: 当……记念……时
  rationale: ἐν τῷ 加不定式在此自然表达时间关系；译作“当……时”符合现代汉语，也保留原文的时间含义。
- source_word: αὐτὸν
  choice: 他
  rationale: 此处将 αὐτόν 理解为带冠词不定式 μνημονεύειν 的宾格逻辑主语，而非其直接宾语，因此译为“当他记念”，不是“当记念他”。
- source_word: τὸ ὄνομα Κυρίου
  choice: 主的名
  rationale: 贴近希腊原文，并保留圣经语境中“主的名”这一表达所承载的分量。
- source_word: σωθήσεται
  choice: 必得拯救
  rationale: σῴζω 的将来时被动态可指“被拯救”或“获救、脱险”；“必得拯救”既表达将来被动意义，也保留其较宽的救助含义。
theological_decisions:
- issue: σωθήσεται 的含义范围
  choice: 必得拯救
  alternative: 必获救；必蒙解救
  rationale: 原词既可能泛指从危险中蒙解救，也可带有更广的救恩意味；正文采用“得拯救”，不把语义限定为某一种神学意义，并以脚注提示另一种自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”保留圣经文体中不仅是想起、也带有郑重记取意味的表达；“主的名”保持简洁和传统辨识度。
