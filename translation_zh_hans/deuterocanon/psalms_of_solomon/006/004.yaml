  text: 他不会因自己恶梦中的景象而不安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασις
  choice: 景象
  rationale: 在ἐνύπνια（梦）的语境中，指梦里所见的景象；译作“景象”比带有特定启示意味的“异象”更自然，也保留视觉含义。
- source_word: πονηρῶν ἐνυπνίων
  choice: 恶梦
  rationale: πονηρός在此修饰“梦”，可指坏的、令人不安的梦；“恶梦”既贴近原文措辞，也避免把含义过度收窄为现代词“噩梦”的强烈恐怖感。
- source_word: ταραχθήσεται
  choice: 惊慌
  rationale: 该被动形式表示受到搅扰、陷入不安；“惊慌”符合恶梦语境，并保留主体受扰动的意味。
- source_word: ἀπό
  choice: 因
  rationale: 此处表示引发惊慌的原因或来源，汉语用“因”表达自然准确。
