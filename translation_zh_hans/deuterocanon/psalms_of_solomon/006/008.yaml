base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/008.yaml
  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: zh_hans
  text: 主垂听所有心存敬畏神之人[a]的祷告；每一个仰望他的心灵[b]所求的一切，主都成全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“每一个在敬畏神之中的人。”也可译作：“每一个敬畏神的人。”
    reason: 保留παντὸς ἐν φόβῳ θεοῦ的凝缩介词结构及其可译空间。
  - marker: b
    text: “心灵”也可译作“人”；希腊文作ψυχή（“心灵”）。
    reason: ψυχή在这里可保留为“心灵”，也可作为整个人的代称。
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: 主
  rationale: 按圣经汉语的通行用法译作“主”，并在两个分句中都予以保留，以再现希腊文的重复和强调。
- source_word: εἰσήκουσεν
  choice: 垂听
  rationale: 该不定过去时在此与后句现在时ἐπιτελεῖ构成箴言式平行，宜按恒常真理译为现在性的“垂听”；“垂听”也自然适用于祷告语境。
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: 所有心存敬畏神之人
  rationale: 保留“敬畏神”的核心含义，同时把希腊文较凝缩的介词结构化为自然、庄重的现代汉语。
- source_word: αἴτημα
  choice: 所求的一切
  rationale: 在祷告语境中，“所求”比逐字的“请求”更自然；“一切”对应πᾶν。
- source_word: ψυχῆς
  choice: 心灵
  rationale: 保留ψυχή的内在人格与灵性意味，同时避免“灵魂”在现代汉语中可能显得过于实体化；语境中也可泛指“人”。
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: 仰望他
  rationale: “仰望”自然表达盼望朝向并倚靠某位对象的含义，保留πρὸς所体现的指向性。
- source_word: ἐπιτελεῖ
  choice: 成全
  rationale: “成全所求”能表达使请求实现、完成之意，也符合庄重的祷告语体。
theological_decisions:
- issue: εἰσήκουσεν应表达一次已完成的行动，还是恒常性的真理
  choice: 译作现在性的“垂听”
  alternative: “已经垂听”或“曾垂听”
  rationale: 不定过去时在此具有箴言式、概括性的用法，并与后句现在时“成全”平行；译成恒常现在时可避免误解为仅指某一次过去事件。
- issue: παντὸς ἐν φόβῳ θεοῦ的凝缩表达
  choice: “所有心存敬畏神之人”
  alternative: 较直译为“所有在敬畏神之中的人”
  rationale: 希腊文可理解为处于敬畏神状态中的每一个人；正文采用自然汉语，脚注保留较贴近形式的表达，避免把“敬畏”弱化为一般恐惧。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌祷告语体。“垂听”“仰望”“成全”是当代读者熟悉的圣经汉语，但不刻意仿古。分号呈现两个平行分句；第二句调整语序，以自然汉语凸显“主”成全一切所求。
