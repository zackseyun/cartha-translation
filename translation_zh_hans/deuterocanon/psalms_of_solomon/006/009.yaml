  text: Blessed is the Lord[a], who shows mercy to those who love him in truth.
translation:
  language: zh_hans
  text: 主当受颂赞；他向那些以真诚爱他的人施怜悯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以真诚”也可译作“真实地”或“忠诚地”。
    reason: ἐν ἀληθείᾳ兼有真实、真诚和忠信等可能含义，不能仅凭本句完全限定。
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受颂赞
  rationale: 这是颂赞语境中的表语形容词；译为“当受颂赞”既保留赞美公式，也比直译为“有福的”更符合现代汉语对上帝的称颂用语。
- source_word: Κύριος
  choice: 主
  rationale: 作为神圣称号，采用现代汉语圣经传统中清楚而自然的“主”。
- source_word: ὁ ποιῶν
  choice: 施
  rationale: ποιέω与ἔλεος构成惯用搭配；“施怜悯”自然准确，避免生硬的“做怜悯”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: “怜悯”直接表达慈悲与恩待之意，并保留该词在宗教语境中的厚度。
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: 向那些爱他的人
  rationale: 将希腊语名词化分词自然地译成汉语关系结构，不增减其意义。
- source_word: ἐν ἀληθείᾳ
  choice: 以真诚
  rationale: 介词短语在此可能修饰“爱”，可指真诚、真实或忠信；正文用自然的“以真诚”，脚注保留其他合理理解。
theological_decisions: []
