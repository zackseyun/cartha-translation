lexical_decisions:
- source_word: ἐξανέστη ἐξ ὕπνου αὐτοῦ
  choice: 他从睡梦中醒来
  rationale: ἐξανέστη 字面可指“起来”，但与“从睡眠中”连用时自然表达醒来；如此既符合希腊语境，也避免现代汉语“从睡梦中起来”的生硬。
- source_word: ἐυλόγησεν
  choice: 称颂
  rationale: 在以神为对象的语境中，εὐλογέω 表示赞美、颂扬；“称颂”庄重自然，并保留敬拜含义。
- source_word: τῷ ὀνόματι Κυρίου
  choice: 主的名
  rationale: 原文与通行英语层均理解为对“主的名”的称颂。希腊语与格形式虽不寻常，但不改变这里的基本指向。
theological_decisions:
- issue: “主”的称谓
  choice: 主
  alternative: 上主
  rationale: Κύριος 直接译作“主”，符合现代中文圣经语体；原文未提供足以要求展开为特定神名的依据。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“就”连接醒来与称颂两个连续动作，行文简洁流畅。
