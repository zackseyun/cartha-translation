  yaml_path: translation/deuterocanon/psalms_of_solomon/001/003.yaml
  text: I thought in my heart that I was filled with righteousness when I prospered and became great in children[a][b][c].
translation:
  language: zh_hans
  text: 我心里想：我兴盛、儿女众多的时候，满有公义[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。这里更可能指说话者所认为的道德或宗教上的正直。
    reason: lexical_alternative
  - marker: b
    text: “儿女众多”直译近于“在儿女方面变得多（或大）”。
    reason: literal_rendering
lexical_decisions:
- source_word: ἐλογισάμην ἐν καρδίᾳ μου
  choice: 我心里想
  rationale: 保留“在心里”的圣经式内在省思意象，同时用现代汉语自然表达第一人称的自我判断。
- source_word: ἐπλήσθην δικαιοσύνης
  choice: 自以为满有公义
  rationale: “满有公义”对应被动形式ἐπλήσθην及属格δικαιοσύνης；结合“我心里想”的引述框架，补出“自以为”以自然呈现这是说话者对自身的判断，而非叙述者的认可。
- source_word: ἐν τῷ εὐθηνῆσαί με
  choice: 我兴盛……的时候
  rationale: ἐν加冠词不定式在此具有时间意义；“兴盛”涵盖εὐθηνέω所表达的昌盛、顺遂。
- source_word: πολλὴν γενέσθαι ἐν τέκνοις
  choice: 儿女众多
  rationale: 希腊语直译近于“在儿女方面变得多/大”；现代汉语以“儿女众多”清楚表达后代增多而不造成生硬歧义。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 公义
  alternative: 正义
  rationale: 这里涉及说话者对自己道德或宗教状况的自我评价，“公义”比偏重社会公平秩序的“正义”更合语境；脚注保留另一词义。
- issue: 繁荣与公义之间的关系
  choice: 以“……的时候，就自以为……”保留主观关联
  alternative: 把兴盛和多子女直接说成公义的证据
  rationale: 原文只陈述说话者在兴盛、多子女之际认为自己满有公义，并未由叙述者确认财富或子女必然证明公义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我心里想”保留原文内省语气；“自以为”明确这是人物自身的判断，并未替原文解决其公义自评与外在兴盛之间的神学张力。
