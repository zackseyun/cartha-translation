  text: They were exalted to the stars[a]; they said[d][c][b], “We will certainly not fall.”
translation:
  language: zh_hans
  text: 他们被高举，直达星辰[a]；他们说：“他们绝不会坠落。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“高升直到众星。”这里以达到星辰的高度作夸张描写。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他们绝不会坠落”，动词是第三人称复数。有些译本按说话者似乎是在谈论自己，译作“我们绝不会坠落”。
    reason: textual_grammar_ambiguity
lexical_decisions:
- source_word: ὑψώθησαν
  choice: 被高举
  rationale: 保留不定过去时被动语态，并兼顾向上升高与受到尊崇的双重意味；上下文容许骄傲自高的色彩，但本句本身没有明说施事者。
- source_word: ἕως τῶν ἄστρων
  choice: 直达星辰
  rationale: ἕως加属格表示所达到的界限；“直达星辰”保留诗歌中的夸张高度意象，也比解释性的表达更贴近希腊文。
- source_word: εἶπαν
  choice: 他们说
  rationale: 采用不带额外解释的普通叙事用语。
- source_word: Οὐ μὴ πέσωσιν
  choice: 他们绝不会坠落
  rationale: οὐ μή表达强烈否定，故译作“绝不会”；πέσωσιν在现存希腊文本中是第三人称复数，因此正文保留“他们”，不擅自改成第一人称“我们”。“坠落”与前面的高举、星辰意象相呼应。
theological_decisions:
- issue: 这句话应呈现为狂妄自信，还是中性的稳定陈述
  choice: 以“绝不会坠落”呈现强烈而自信的断言，但不在正文中添加“狂妄”等评价词。
  alternative: 译为较中性的“他们不会坠落”。
  rationale: οὐ μή本身要求加强否定；语境可使这话带有自负意味，但道德评语不应被直接添入经文。
- issue: 直接引语中的第三人称复数是否应按所指改译为第一人称
  choice: 正文保留第三人称：“他们绝不会坠落。”
  alternative: 按可能的预期意义译作：“我们绝不会坠落。”
  rationale: 现存希腊文πέσωσιν明确是第三人称复数。虽然在直接引语中显得突兀，也可能涉及传抄、引述视角或未明说的指代对象，但不宜静默修正这一真实的语法张力。
translation_notes:
  register: 采用庄重而自然的现代普通话。“被高举”保留被动形式及空间、尊荣两方面的含义；“直达星辰”维持诗体夸张；正文保留希腊文直接引语中突兀的第三人称，并用脚注说明常见的第一人称理解。
