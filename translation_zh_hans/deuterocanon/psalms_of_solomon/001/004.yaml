  yaml_path: translation/deuterocanon/psalms_of_solomon/001/004.yaml
  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
translation:
  language: zh_hans
  text: 他们的财富遍及全地[a]，他们的荣耀[b]远达地极[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“整个大地”。希腊语γῆ既可指一片土地或疆域，也可指大地。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”也可译作“声名”。希腊语δόξα既可指荣耀、光彩，也可指荣誉或声望。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们的荣耀直到地极。”希腊文在第二分句省略了谓语，由前句的动词意念承接。
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ πλοῦτος
  choice: 财富
  rationale: πλοῦτος通常指财富或资财；“财富”是现代汉语中自然、庄重的集合性表达。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 直接表达复数所有关系，所指承接上文人物。
- source_word: διεδόθη
  choice: 遍及
  rationale: διαδίδωμι的被动式在这里表示广泛散布。“遍及”既传达扩展至各处的结果，又比“被分配”更符合诗句语境。
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: 遍及全地
  rationale: γῆ既可指一片土地，也可指大地；“全地”保留这种范围上的开放性，并与下句“地极”形成递进。
- source_word: ἡ δόξα
  choice: 荣耀
  rationale: δόξα可指荣耀、光彩或声誉。“荣耀”保持庄重诗体，也不把含义限定为名声。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 远达地极
  rationale: 该短语表示直到大地最遥远之处。“地极”凝练而庄重；补出“远达”使现代汉语句子自然，同时传达第二分句承接的延伸意义。
theological_decisions:
- issue: 两处分句中γῆ的范围
  choice: 第一处译作“全地”，第二处译作“地极”
  alternative: 第一处明确译作“整个大地”，或把两处都理解为同一地域范围
  rationale: 第一处的γῆ可指全境，也可指全世界；第二处“直到地极”则是表示最远范围的惯用说法。正文保留第一处的含混，并呈现诗句由广布到远达地极的推进。
- issue: 第二分句省略谓语
  choice: 补出“远达”
  alternative: 直译为“他们的荣耀直到地极”以保留原文省略
  rationale: 希腊文第二分句承接前句而省略动词。现代汉语补出“远达”可使句法自然，且不额外限定荣耀扩展的方式；脚注保留省略式译法。
translation_notes:
  register: 采用自然、庄重而凝练的现代书面汉语。“全地—地极”保留诗体平行与范围递进；正文为汉语流畅性补出“远达”，脚注则呈现原文的谓语省略。
