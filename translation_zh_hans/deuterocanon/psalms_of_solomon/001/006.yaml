  text: and they were insolent in their prosperity[c][b][a], and they did not endure.
translation:
  language: zh_hans
  text: 他们在自己的富足中[a]骄横，也没有坚持下去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己的富足中”也可译作“在他们的福分中”或“在他们的财物中”。希腊原文泛指他们所拥有的好处、财物或福分。
    reason: lexical_alternative
  - marker: b
    text: “没有坚持下去”也可译作“没有忍受下去”或“没有承受住”。希腊原文没有说明所承受的具体对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξύβρισαν
  choice: 骄横
  rationale: 该动词表示傲慢、蛮横而逾越分寸的行为。“骄横”简洁地保留其强烈的道德贬义，又符合现代汉语表达。
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: 在顺境中
  rationale: 复数名词 ἀγαθά 可指财物、福分或有利境况；结合介词短语，此处自然表示他们身处富足安好的境况。“顺境”通顺，但不把含义严格限定为物质财富；其他可能译法列入脚注。
- source_word: οὐκ ἤνεγκαν
  choice: 没有坚持住
  rationale: φέρω 在这里可表示承受、忍耐或坚持。原文未明说承受的对象；“没有坚持住”在汉语中可不带宾语，既自然，也保留原句的简短与对象未明。
