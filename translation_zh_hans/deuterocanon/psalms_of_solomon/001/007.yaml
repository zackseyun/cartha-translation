translation:
  language: zh_hans
  text: 他们的罪是在暗中犯的[a][b]，而我并不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译“他们的罪在隐秘的事中”。希腊文措辞简略，也可泛指隐秘、未显露的情状，不必限于具体地点。
    reason: lexical_alternative
  - marker: b
    text: 或译“在隐秘之处”。
    reason: previous_rendering
lexical_decisions:
- source_word: αἱ ἁμαρτίαι
  choice: 罪
  rationale: 复数名词指他们所犯的具体罪恶；汉语“罪”简洁自然，也不必机械标出复数。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 按其属格领属关系直译，不扩充所指对象。
- source_word: ἐν ἀποκρύφοις
  choice: 在暗中
  rationale: 该短语由复数中性形容词名词化或省略中心词而成，在此可作副词性表达。“在暗中”保留隐秘、隐而不显的意思，又避免限定为具体的隐秘地点。
- source_word: καὶ ἐγώ
  choice: 而我
  rationale: καί基本义为“和、而”；此处“而”自然呈现前后轻微对照，但不像“我却”那样强化转折。
- source_word: οὐκ ᾔδειν
  choice: 并不知道
  rationale: ᾔδειν表示处于知道或知悉的状态；“并不知道”清楚表达说话者当时不知情。
theological_decisions:
- issue: ἐν ἀποκρύφοις所指的隐秘性质
  choice: 译作“在暗中”，不说明这些罪是向谁隐藏，也不限定为具体地点。
  alternative: 可理解为“在隐秘之处”“涉及隐秘的事”，或“是暗中犯的”。
  rationale: 希腊文表达简略且有省略性；下句“而我并不知道”与隐秘性相关，却不足以断定这些罪专门向说话者、向上帝或向众人隐藏。译文因此保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。主句保留原文的简短结构；“都”使复数主语与无显式系词的汉语句式更自然，并不表示每一种罪都无例外。脚注标记紧随存在歧义的短语。
