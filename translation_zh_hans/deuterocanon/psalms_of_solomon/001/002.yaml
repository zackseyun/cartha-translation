  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: zh_hans
  text: 忽然，战争的呼喊[a]在我面前响起；他必垂听我[b]，因为我满有公义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战争的呼喊”也可译为“战斗的呐喊”。所给希腊字符串中的 κωφωθὴ 与经核定的 Swete 本文 ἠκούσθη 不同；后者意为“被听见”，故本句译为“响起”。
    reason: lexical_alternative_and_textual_correction
  - marker: b
    text: “垂听”也可译为“听见”或“留心听”；原文没有明说主语，按祷告语境通常理解为上帝。
    reason: implicit_subject_and_lexical_range
  - marker: c
    text: “公义”也可译为“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξάπινα
  choice: 忽然
  rationale: 准确表达事情骤然发生，简洁自然。
- source_word: κωφωθὴ
  choice: 静默吧
  rationale: 按所给希腊文本，将其理解为 κωφόω 的第二人称单数不定过去时被动命令式；与后面的“呼喊”构成呼语，表达“被止息、归于沉寂”的命令。
- source_word: κραυγὴ πολέμου
  choice: 战争的呼喊
  rationale: 保留属格结构及其宽泛含义；既可指战争中发出的呼喊，也可能指战斗的呐喊。
- source_word: ἐνώπιόν μου
  choice: 在我面前
  rationale: 保留原文的空间和临在意味，同时符合现代汉语表达。
- source_word: ἐπακούσεταί μου
  choice: 他必垂听我
  rationale: ἐπακούω 常指留意并应允人的呼求；“垂听”既自然地体现有利的聆听，又不直接补出原文省略的主语。
- source_word: ἐπλήσθην
  choice: 我满有
  rationale: 不定过去时可表示已经达到的充满状态；此处用状态性汉语表达，使因果从句自然，同时不把时态解释得过死。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: 在宗教和道德语境中，δικαιοσύνη 首选“公义”；原词也可有“正义”的司法或社会层面。
theological_decisions:
- issue: ἐπακούσεταί μου 的隐含主语
  choice: 用“他”保留隐含主语，由祷告语境自然指向上帝
  alternative: 明确译作“上帝必垂听我”，或用无主句“我必蒙垂听”
  rationale: 希腊文没有明说主语。译文不擅自补入“上帝”，但以“他”保留上下文中最自然的所指。
- issue: “满有公义”是否表示说话者自称完全无罪
  choice: 保留原文直接而强烈的自述，不加解释或弱化
  alternative: 解释为“我的诉求是正义的”或“我行事正直”
  rationale: 原文的神学张力在于说话者以自己“充满公义”作为蒙垂听的理由；翻译不应替文本消解这一张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“战争的呼喊啊”以呼语呈现命令式句法；后半句保持祷告语气，并保留原文隐含主语和“满有公义”的强烈神学表述。
