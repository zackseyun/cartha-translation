  yaml_path: translation/deuterocanon/psalms_of_solomon/001/008.yaml
  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: zh_hans
  text: 他们的不法之举比在他们以前的列国所行的更甚；他们以亵渎之举亵渎了主的圣物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的圣物”也可译作“主的圣所”或“主的圣地”。希腊文为复数，可泛指属于主的神圣事物，也可指圣所或圣域。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: 他们的不法行为
  rationale: 复数名词ἀνομίαι既指违背律法的性质，也可指具体恶行；“不法行为”在现代汉语中自然，并保留其复数行为意涵。
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: 超过了在他们以前的列国
  rationale: ὑπέρ接宾格表达比较和超越；πρὸ αὐτῶν表示时间上先于他们，译文保留这两层关系。
- source_word: ἐβεβήλωσαν
  choice: 亵渎了
  rationale: βεβηλόω指把神圣之物当作凡俗之物，核心义是“亵渎”，不同于一般的玷污或污染。
- source_word: τὰ ἅγια Κυρίου
  choice: 主的圣物
  rationale: 中性复数τὰ ἅγια可泛指属主的神圣之物，也可在礼仪语境中指圣所或圣地；正文用“圣物”保留复数和较宽泛的指涉，脚注注明空间性译法。
- source_word: ἐν βεβηλώσει
  choice: 以亵渎的行径
  rationale: 介词短语以同源名词βεβήλωσις强化前面的动词。直译“以亵渎”在汉语中生硬，加入“行径”既保留同源重复，也清楚表达方式和程度。
theological_decisions:
- issue: τὰ ἅγια Κυρίου应具体译为“主的圣所”，还是较宽泛地译为“主的圣物”
  choice: 主的圣物
  alternative: 主的圣所／主的圣地
  rationale: 希腊文为中性复数，虽在《七十士译本》和第二圣殿时期文献中常可指圣所，但本节措辞本身也容许神圣物件或圣域等较广指涉。正文避免把所指无提示地限定为单数建筑，脚注保留常见的圣所解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国”保留诗体和古代民族语境；“以亵渎的行径亵渎”刻意保留原文动词与同源名词的强调性重复。
