  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
translation:
  language: zh_hans
  text: 我在受苦、直到尽头时[a]，向主呼求；罪人来袭时[b]，向上帝呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到尽头”直译希腊语 εἰς τέλος；也可能意为“到了极处”“完全地”，或表示持续不断。
    reason: lexical_alternative
  - marker: b
    text: “罪人来袭”所据的希腊语表达较难确定；也可能有“罪人临到”等意思。这里按哀歌中的敌对处境译出。
    reason: alternative_reading
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: 呼求
  rationale: 该词是 βοάω 的简单过去时第一人称单数，表示迫切地发声求告；“呼求”自然地体现祷告语境，也保留声音与急切感。
- source_word: πρὸς Κύριον
  choice: 向主
  rationale: πρός 加宾格表示呼求所朝向的对象；κύριος 依其在向以色列之上帝祷告的语境译为“主”。
- source_word: ἐν τῷ θλίβεσθαί με
  choice: 我受苦……时
  rationale: ἐν 加冠词不定式在此具有时间或处境意义；θλίβεσθαι 是被动式，“受苦”保留承受压迫或患难的意味，而不把它抽象化为单纯的“苦难”。
- source_word: εἰς τέλος
  choice: 直到尽头
  rationale: 这是该短语较为直译的表达，保留它可能指持续至终点、达到极处，或作为加强语的开放性，不在正文中武断限定。
- source_word: πρὸς τὸν θεὸν
  choice: 向上帝
  rationale: 与“向主”构成平行的呼求对象；保留原文对神圣称谓的重复，不合并处理。
- source_word: ἐν τῷ ἐπιδέσθαι
  choice: 袭击时
  rationale: 此处动词的形态和具体语义较难确定；在哀歌语境中，“袭击”能表达罪人对说话者采取的敌对行动，但以脚注保留“临到”等可能。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 直译指犯罪或有罪的人；“罪人”比“恶人”更贴近词形本身，也不额外强化其道德类别。
theological_decisions:
- issue: 祷告语境中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: “主”符合现代汉语圣经语体，也适合称呼以色列的上帝；“主人”会带入不必要的主仆色彩。
- issue: 是否合并“向主”与“向上帝”两个称谓
  choice: 保留平行的两个称谓
  alternative: 合并为一次对上帝的称呼
  rationale: 希腊文有意使用两个平行的 πρός 短语；保留二者可呈现诗句结构及呼求的加强效果。
- issue: 是否将 εἰς τέλος 明确定为程度或时间
  choice: 在正文保留“直到尽头”的歧义
  alternative: 译为“极其”或“不断地”
  rationale: 原短语可能表示终点、完全程度或惯用的加强意义；直译并加注能避免把尚不确定的解释写入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。为呈现原文的诗性平行，将两个时间从句前置，并保留“向主……向上帝……”的对应结构；第二分句补出汉语所需的“呼求”，表达希腊文省略而承接的谓语。
