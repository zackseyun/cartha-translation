base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: zh_hans
  text: 祭司和利未人穿戴整齐，按班次站好，为以色列的主上帝的工作服事，遵照摩西的书而行[b]；守门人则站在各门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “按班次”直译可作“按支派”。这里可能是指祭司和利未人履职时所编排的组别。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: 站好
  rationale: 表示站立并就位；与后文有秩序的职务安排相配，也不把被动的“被安置”强加给原文。
- source_word: ἐστολισμένοι
  choice: 穿戴整齐
  rationale: 表达为礼仪职务而适当穿着、整备的状态，同时避免把原文未明说的特定祭司礼服写入正文。
- source_word: κατὰ φυλάς
  choice: 按班次
  rationale: φυλή字面可指“支派”，但在祭司和利未人履职的语境中，更自然地指有秩序的分组；脚注保留字面可能。
- source_word: ἐπὶ τῶν ἔργων
  choice: 负责……的事工
  rationale: ἐπί加属格在此可表示职责范围；“负责……的事工”既体现受派管理或履职，也保留ἔργα的工作含义。
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: 以色列的主上帝
  rationale: 紧贴希腊文神圣称谓的次序和关系；κύριος译为“主”，不从平行希伯来文本反向引入“耶和华”。
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: 遵照摩西的书而行
  rationale: 表达依从摩西书面指示的规范性含义，现代汉语自然清楚。
- source_word: θυρωροί
  choice: 守门人
  rationale: 现代汉语中对负责圣殿出入口人员最直接、清楚的称呼。
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: 各守一门
  rationale: 用简洁自然的汉语表达每一门口均有守门人就位的地点与分派关系。
theological_decisions:
- issue: 在希腊次经叙事中，κύριος与平行希伯来材料中的神名之间如何处理
  choice: 主
  alternative: 耶和华
  rationale: 本节以希腊文本为首要翻译依据，其中作Κυρίου；因此正文译“主”，不以近似且内容不同的马所拉平行材料替换希腊见证。
- issue: “主上帝的事工”是否明确限定为圣殿职事
  choice: 保留较宽的“事工”
  alternative: 圣殿的职事
  rationale: 祭司、利未人和守门人的语境明显指向礼仪或圣殿服事，但希腊文只说ἔργα，没有明写“圣殿”；故不在正文中补足，以免消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“穿戴整齐”“按班次站好”“各守一门”使场景清楚自然，同时不超出希腊文所明说的内容。所有脚注标记均已置于正文。
