base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: zh_hans
  text: 因为他使亚述王的心意转向他们[a]，为要使他们有力量从事主——以色列的上帝的各项工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文和希伯来文平行经文都作“亚述王”；不过，《以斯拉记》较广的上下文涉及波斯统治者。这里按原文保留，不作协调。
    reason: 说明原文称号与历史上下文之间的张力，避免读者误以为译文无意混淆。
lexical_decisions:
- source_word: μετέστρεψεν
  choice: 使……转向
  rationale: 该不定过去时动词表示转变或扭转；结合方向短语 ἐπʼ αὐτούς，译为“使……转向他们”既贴近希腊文，也自然表达态度的改变。
- source_word: τὴν βουλὴν
  choice: 心意
  rationale: βουλή 可指谋划、意向或主意。此处描述君王对众人的取向，用现代汉语“心意”较自然，同时保留一定宽度，不把它限定为具体政令或计划。
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: 亚述王的
  rationale: 希腊文直指“亚述人的王／亚述王”，希伯来文平行经文亦作“亚述王”；虽上下文涉及波斯统治者，正文不作历史协调。
- source_word: ἐπʼ αὐτούς
  choice: 转向他们
  rationale: ἐπί 加宾格在此表示朝向；正面的结果说明这种转向有利于他们，但正文不额外明说“恩待”或“支持”，以免过度解释。
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: 使他们……得力
  rationale: 原文直译为“使他们的手强壮”，与希伯来文平行经文的惯用语一致。现代汉语以“使他们得力”传达获得力量、能够投入工作的含义，避免生硬的肢体字面表达。
- source_word: ἐπὶ τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: 在以色列的上帝——主的工程上
  rationale: 希腊文为复数“工程／工作”，并称“主，以色列的上帝”。译文保留希腊文本身的称谓关系与复数所涵盖的整体工程感，不采用希伯来平行经文所增明的“上帝殿的工程”。
theological_decisions:
- issue: Κυρίου 的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要底本是希腊文，原词为 κύριος，故译作“主”；希伯来平行经文虽有神名 YHWH，也不据此替换希腊正文。
- issue: “亚述王”与历史上下文的张力
  choice: 正文保留“亚述王”
  alternative: 波斯王
  rationale: 希腊底本和希伯来平行经文均作“亚述王”。改成“波斯王”会把历史协调直接写入正文，掩盖文本见证本身的措辞。
- issue: βουλή 的语义宽度
  choice: 心意
  alternative: 谋略／计划
  rationale: 此处既可理解为君王的意向，也可理解为其谋划。选“心意”使句子自然，却不明确断定这是正式计划或政策。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“使……得力”自然传达“使他们的手强壮”这一圣经惯用语；“上帝——主”用破折号明确“主”与“以色列的上帝”为同位称谓。
