    issue: 将一个限定性人群结构拆成两个并列分句
    rationale: 希腊文为“从被掳而出的以色列子孙，所有与……分别出来、寻求主的人，吃了”。“πάντες”所引出的短语说明／限定同一参与者群体；草稿的分号及“也都吃了”会暗示另有第二群人。
  - severity: low
    issue: “归来的”较原文多补出方向性动作
    rationale: ἐκ τῆς αἰχμαλωσίας表示“出自／从被掳中”，本节未明说“归来”；虽由上下文可推知，正文宜不必补入。
  revised_text: 那些从被掳中出来的以色列子孙，就是所有与这地各族的可憎之事分别出来、寻求主的人，都吃了[a]。
