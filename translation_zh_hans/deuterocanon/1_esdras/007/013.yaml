base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: zh_hans
  text: 那些从被掳中出来的以色列子孙，就是所有与这地各族的可憎之事分别出来、寻求主的人，都吃了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即吃逾越节的筵席；希腊文在本节省略了宾语，须由上文得知。
    reason: cross_reference
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: 吃了
  rationale: 希腊文只明说“吃”，宾语须由上文补足；正文不擅自加入“逾越节筵席”，以脚注说明。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留希腊文的宗族与盟约性表达，同时符合现代中文圣经语体。
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: 那些从被掳之地归来的
  rationale: 该短语指从被掳处而来的人；中文若仅作“来自被掳”不自然，按语境译出其归来，但不使用较抽象的“流亡者”。
- source_word: χωρισθέντες
  choice: 与……分别出来
  rationale: 以反身意义表达主动脱离污秽之事，也保留原文的分别意象。
- source_word: βδελυγμάτων
  choice: 可憎之事
  rationale: 保持该词在宗教和道德层面的强烈贬义，又比“可憎之物”更能涵盖习俗、行为及相关污秽。
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: 当地各族
  rationale: 自然表达居住在这地的周边族群；不把 ἔθνη 技术化为后世意义上的“外邦人”。
- source_word: ζητοῦντες τὸν κύριον
  choice: 寻求主
  rationale: 保留分词所表达的持续宗教取向，并依项目惯例将 κύριος 译为“主”。
theological_decisions:
- issue: 是否在正文补明所吃的是逾越节筵席
  choice: 正文只译“吃了”，以脚注交代隐含宾语
  alternative: 吃了逾越节的筵席
  rationale: 上文清楚提供所指，但本节希腊文本身没有宾语；正文保留原文省略，避免过度释义。
- issue: 如何表达与当地各族可憎之事的分别
  choice: 与当地各族可憎之事分别出来
  alternative: 离弃当地各族的污秽习俗
  rationale: 所分别的是与这些族群相关的可憎之事，而不是单纯进行族群隔离；译文保留道德—礼仪张力，不将范围缩限为“习俗”。
- issue: ζητοῦντες 与前句人群的关系
  choice: 将其表达为这些参与者的共同特征“寻求主的人”
  alternative: 为了寻求主
  rationale: 希腊分词可描述其持续身份或行动，不必强定为目的关系；名词化处理在中文中较清楚，并保留关系上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免希腊文连续修饰成分在中文中产生歧义，将句子分为两个并列部分，并用“也都吃了”回指谓语；脚注标记已在正文中出现。
