base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/008.yaml
  text: twelve goats for the sin of all Israel[a], according to the number of the twelve tribal leaders of Israel.
translation:
  language: zh_hans
  text: 献十二只公山羊，作全以色列的赎罪祭[a]；数目照以色列十二位支派首领的数目。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为全以色列赎罪。”
    reason: 说明ὑπὲρ ἁμαρτίας可按较贴近字面的祭祀惯用语译为“为……赎罪”；正文采用“赎罪祭”以明确其祭礼功能。
lexical_decisions:
- source_word: χιμάρους
  choice: 公山羊
  rationale: χίμαρος指公山羊；译出性别比泛称“山羊”更准确，也符合献祭语境。
- source_word: ὑπὲρ ἁμαρτίας
  choice: 为……赎罪
  rationale: 该短语字面涉及“为罪”，在献祭语境中具有赎罪祭的惯用含义。“为……赎罪”在中文中自然，并保留原文简练的表达；更明确的祭礼译法置于脚注。
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: 全以色列
  rationale: 保留πᾶς所表达的整体范围，指全体以色列。
- source_word: πρὸς ἀριθμόν
  choice: 这数目与……相合
  rationale: 表达数量上的对应关系，符合现代汉语习惯。
- source_word: φυλάρχων
  choice: 族长
  rationale: φυλάρχης指部族或支派的首领；“族长”简洁庄重，并保留其领导身份。
theological_decisions:
- issue: 是否将ὑπὲρ ἁμαρτίας明确译作“赎罪祭”
  choice: 正文译为“为全以色列赎罪”
  alternative: “作为全以色列的赎罪祭”
  rationale: 原文用简短的祭祀惯用语，并未出现通常表示“祭物”的名词。正文既传达献祭功用，又不把隐含成分完全写入；脚注提供更明确的祭礼表达。
- issue: παντὸς τοῦ Ἰσραήλ所表示的范围
  choice: 全以色列
  alternative: 以色列全体
  rationale: 两者都可表达整体和代表性范围；“全以色列”更简洁，也符合经文语体。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。原文是献祭清单中的片段，中文补出“献上”以形成完整通顺的句子；分号保留两部分之间的数量对应关系。
