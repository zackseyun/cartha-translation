base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: zh_hans
  text: 至亚达月二十三日[b]，这殿[a]竣工；时值大流士王在位第六年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“房屋”，这里指圣殿。
    reason: 保留原文用词，并说明其上下文所指。
  - marker: b
    text: 原文较直译为“直到亚达月第二十三日”。
    reason: 说明ἕως及原文数词表达的较字面译法，保留完工是在该日还是截至该日的轻微语义张力。
lexical_decisions:
- source_word: συνετελέσθη
  choice: 竣工
  rationale: 该词为简单过去时被动语态，表示工程达到完成；“竣工”自然、庄重，且符合建筑语境。
- source_word: ὁ οἶκος
  choice: 这殿
  rationale: 希腊文直译为“房屋”，上下文所指是圣殿；正文译作“这殿”可使现代读者立即明白所指，脚注保留原文较字面的表达。
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: 到……二十三日
  rationale: 原文直译为“直到第三和第二十”，即二十三日；“到……二十三日竣工”保留ἕως的时间界限含义，但不武断地改成“在该日”。
- source_word: μηνὸς Ἀδὰρ
  choice: 亚达月
  rationale: 按犹太历月份名称音译，采用现代中文圣经语境中通行且易懂的“亚达月”。
- source_word: τοῦ ἕκτου ἔτους βασιλέως Δαρείου
  choice: 时值大流士王在位第六年
  rationale: 这是君王纪年格式；补出“在位”符合现代汉语习惯，也准确表达属格结构的纪年关系。
