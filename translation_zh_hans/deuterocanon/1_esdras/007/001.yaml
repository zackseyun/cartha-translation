base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
translation:
  language: zh_hans
  text: 那时，柯勒叙利亚[a]和腓尼基的总督西辛尼斯、萨特拉布扎尼斯以及他们的同僚[b]，遵照大流士王所下的命令，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柯勒叙利亚”是正式地域名称，并非泛指“低洼的叙利亚”。
    reason: cultural_note
  - marker: b
    text: “同僚”也可译作“同伴”或“合作者”。原文也可理解为“那些同僚”，不明确表示他们属于哪一位具名官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为叙事中的时间承接语，简洁自然，也保留原文由此前事件转入下一行动的作用。
- source_word: Σισίννης
  choice: 西辛尼斯
  rationale: 按希腊文人名音译，不赋予额外含义。
- source_word: ἔπαρχος
  choice: 总督
  rationale: 该词指区域行政长官；“总督”既符合上下文中的辖区范围，也不引入特定于罗马时代的官衔细节。
- source_word: κοίλης Συρίας
  choice: 柯勒叙利亚
  rationale: 在这里是正式地域名称，不宜按字面译成“凹陷的叙利亚”；采用音译以表明专名性质。
- source_word: Φοινίκης
  choice: 腓尼基
  rationale: 采用现代中文通行地名。
- source_word: Σαθραβούζανης
  choice: 萨特拉布扎尼斯
  rationale: 依希腊文形式音译此人名。
- source_word: οἱ συνέταιροι
  choice: 他们的同僚
  rationale: συνέταιροι可指同伴、合作者或同僚；行政语境中“同僚”自然贴切。“他们的”是依据并列结构补出的关系表达。
- source_word: κατακολουθήσαντες
  choice: 遵照
  rationale: 表达依从并按命令行事，同时以中文自然方式连接后续行动。
- source_word: τοῖς ὑπὸ τοῦ βασιλέως Δαρείου προσταγεῖσιν
  choice: 大流士王所下的命令
  rationale: 保留命令来自大流士王以及原文被动结构所表达的内容，中文简洁顺畅。
