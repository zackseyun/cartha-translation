base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: zh_hans
  text: 他们更用心地监督神圣的工程[a]，同犹太人的长老和圣殿主管合作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣工”或“圣殿工程”。希腊文直译为“神圣的工程”；希伯来文平行经文说“上帝殿的工程”。
    reason: 说明希腊文较宽的字面措辞，并交代由希伯来文平行经文所印证的圣殿语境。
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: 监督
  rationale: 未完成时表示持续进行的督管；“监督”既体现管理职责，也符合现代汉语表达。
- source_word: τῶν ἱερῶν ἔργων
  choice: 圣所的工程
  rationale: 希腊文直译可作“神圣的工程”，语境则指与上帝殿宇有关的工程；译作“圣所的工程”既明确语境，又不照搬希伯来平行经文。
- source_word: ἐπιμελέστερον
  choice: 更加尽心地
  rationale: 比较级副词表示比先前更用心、更审慎；“更加尽心地”自然保留其比较意味。
- source_word: συνεργοῦντες
  choice: 一同做工
  rationale: 分词表达与后列两组人积极协作；“一同做工”简明自然，并贴合工程语境。
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: 与犹太人的长老
  rationale: 保留希腊文属格结构，指犹太群体中获承认的长老领袖。
- source_word: ἱεροστάταις
  choice: 圣所的主管
  rationale: 该词指负责神圣场所或圣所事务的人；“主管”体现其管理职能，又避免把他们具体认定为祭司。
theological_decisions:
- issue: 希腊文本与《以斯拉记》6:22希伯来平行经文的关系
  choice: 依照希腊文保留与犹太长老及圣所主管协作的明确表述，并用“圣所的工程”体现圣殿语境。
  alternative: 按希伯来平行经文意译为“使他们有力量办理以色列上帝殿的工程”。
  rationale: 本书应以希腊文本为首要依据。希伯来平行经文可印证工程与上帝的殿有关，却不应取代希腊文独有的人员与协作信息。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“更加尽心地”保留比较级；“圣所的主管”避免将其身份过度具体化。
