base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: zh_hans
  text: 先知哈该和撒迦利亚说预言的时候，圣工进展顺利。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣工”也可译作“神圣的工程”；这里指圣殿的工程。
    reason: 说明词义替代译法及上下文所指，同时避免在正文中添加原文未明说的“圣殿”。
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: 进展顺利
  rationale: 该表达表示事情进展良好、顺遂成功；“进展顺利”自然地传达未完成时所描写的持续进展。
- source_word: τὰ ἱερὰ ἔργα
  choice: 圣工
  rationale: 原文直指神圣、圣所相关的工程。“圣工”简洁庄重，并保留原文没有明说“圣殿”的宽度；脚注说明其语境所指。
- source_word: προφητευόντων
  choice: 说预言的时候
  rationale: 属格独立结构表示与主句同时发生的持续行动；此译法明确表达两位先知正在履行说预言的职分。
- source_word: Ἁγγαίου
  choice: 哈该
  rationale: 采用现代中文圣经中通行的先知名译法。
- source_word: Ζαχαρίου
  choice: 撒迦利亚
  rationale: 采用现代中文圣经中通行的先知名译法。
- source_word: τῶν προφητῶν
  choice: 先知哈该和撒迦利亚
  rationale: 将同位说明“先知”前置，使中文自然，同时明确两人的先知身份。
theological_decisions:
- issue: 是否在正文中明确“圣工”就是建造圣殿的工程
  choice: 正文保留较宽泛的“圣工”
  alternative: 圣殿工程；建造上帝殿的工程
  rationale: 希腊文只说“神圣的工程”，本节未直接出现“圣殿”。上下文虽表明所指是圣殿工程，但不宜在正文中缩窄原文；以脚注交代语境即可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“进展顺利”比“兴旺”更直接体现工程推进；调整属格独立结构的语序，使中文流畅，并保留同时性。
