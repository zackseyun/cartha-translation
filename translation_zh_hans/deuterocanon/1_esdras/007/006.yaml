base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: zh_hans
  text: 以色列人、祭司、利未人，以及其余从被掳中被带回的人，都照着摩西书上所记的去做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 这是现代汉语中自然、庄重的族群称谓，准确表达希腊语字面为“以色列的众子”的固定圣经用语，避免“以色列的儿子们”可能造成的亲生子嗣误解。
- source_word: οἱ λοιποί
  choice: 其余……的人
  rationale: 承接前列的祭司和利未人，表示除此之外的其余群体，符合该实词化形容词的用法。
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: 从被掳之地
  rationale: αἰχμαλωσία可指被掳状态、被掳群体或流亡处境；结合ἐκ，译作“从被掳之地”既保留被掳背景，也使中文句法清楚。
- source_word: οἱ προσενεχθέντες
  choice: 被带回来的人
  rationale: 保留不定过去时被动分词的受动意味；在复兴归回语境中，προσφέρω表达被带来或带回，比单纯译为主动的“归回”更贴近希腊文。
- source_word: ἀκολούθως
  choice: 照着……去做
  rationale: 该副词表示依循某一规范；与后接与格短语合译为自然汉语“照着……去做”。
- source_word: τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: 摩西书上所记的
  rationale: 保留βίβλος的“书”而不擅自具体化为“律法”；“所记的”自然表达原文“书中的那些事”。
theological_decisions:
- issue: 归回者在οἱ προσενεχθέντες中的行动主体性
  choice: 被带回来的人
  alternative: 归回来的人
  rationale: 希腊文使用被动分词，明确保留了他们被带回的受动意味。译文不进一步指明施动者，因原文也没有明说，从而避免添加神学解释。
- issue: “摩西书”的范围
  choice: 摩西书
  alternative: 摩西律法书
  rationale: 原文仅用βίβλος（书），没有νόμος（律法）；因此不把所指范围收窄为“律法书”，保留文本本身的表达。
translation_notes:
  register: 采用现代标准普通话，句式简洁而庄重。省去希腊文多次重复的冠词与连词，以符合自然中文列举方式，同时保留各群体及被动归回的关键意义。
