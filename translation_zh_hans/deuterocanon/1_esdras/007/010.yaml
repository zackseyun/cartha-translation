base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: zh_hans
  text: 被掳归回的以色列子孙，在正月十四日守逾越节；那时，祭司和利未人已一同洁净自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“洁净”指祭司和利未人为守逾越节而按礼仪洁净自己。
    reason: cultural_note
lexical_decisions:
- source_word: ἤγαγον ... τὸ πάσχα
  choice: 守逾越节
  rationale: ἄγω本义为“带领、举行”，在以逾越节为宾语的礼仪语境中，指遵守或举行逾越节；“守逾越节”是自然且庄重的汉语表达。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留这一传统的群体和祖源称谓，同时符合现代汉语圣经语体。
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  choice: 从被掳之地归来的
  rationale: 希腊文直译近于“来自被掳状态/被掳之地的”；结合回归语境补出“归来”，使所指清楚，但不把它泛化为所有以色列人。
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: 在正月十四日
  rationale: 准确保留日期；“正月”在现代汉语宗教历法语境中自然地表达“第一个月”。
- source_word: ὅτε
  choice: 那时
  rationale: 保留时间关系，不强化为原因或严格的先后关系。
- source_word: ἡγνίσθησαν
  choice: 已……洁净自己
  rationale: 表达为礼仪预备而完成的洁净行动；“已”体现相对于守节已经完成，而不把它解释成抽象的道德净化。
- source_word: οἱ ἱερεῖς καὶ οἱ λευεῖται ἅμα
  choice: 祭司和利未人已一同
  rationale: 采用两个圣殿职分群体的标准名称；“一同”保留ἅμα所表达的共同或同时进行。
theological_decisions:
- issue: 洁净的性质
  choice: 洁净自己
  alternative: 得了洁净／使自己成圣
  rationale: 本节语境指守逾越节前的礼仪洁净。“洁净自己”既保留其礼仪含义，也避免加入经文未明说的道德或教义解释。
- issue: 被掳者群体的界定
  choice: 从被掳之地归来的以色列子孙
  alternative: 被掳的以色列子孙／从流亡中归来的以色列人
  rationale: 该属格短语可理解为与被掳经历有关、从那里出来的一群人。正文采用符合回归背景的自然表达，同时保留“以色列子孙”的祖源性群体称谓。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“守逾越节”“以色列子孙”“祭司和利未人”等保留经文传统语感；分号清楚呈现守节与洁净之间的时间关系。希腊文为主要依据；所给马所拉文本对应别处内容，未用于改写本节。
