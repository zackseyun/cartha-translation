base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: zh_hans
  text: 他们为所有被掳归回的人[a]、为他们的弟兄——众祭司，也为自己宰献了逾越节的祭牲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“所有被掳之子”，是对被掳后归回群体的称呼。
    reason: lexical_alternative
  - marker: b
    text: 希腊文可直译为“宰献了逾越节”；这里指逾越节的祭牲，但原文没有明确说是“羊羔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: 宰献
  rationale: θύω表示宰杀并献上祭物；“宰献”兼顾宰杀与献祭，比笼统的“献上”更准确，也符合逾越节语境。
- source_word: τὸ πάσχα
  choice: 逾越节的祭牲
  rationale: πάσχα可指逾越节、逾越节礼仪或逾越节祭物；它在此作ἔθυσαν的宾语，祭牲之义最为突出。译作“逾越节的祭牲”既自然，又不擅自限定为羊羔。
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: 所有被掳归回的人
  rationale: 希腊文直译为“所有被掳之子”，是指被掳后归回的群体。现代汉语用“被掳归回的人”清楚传达其群体身份；脚注保留原文的表达方式。
- source_word: ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν
  choice: 他们的弟兄——众祭司
  rationale: 保留ἀδελφοῖς的亲族、群体色彩，并以破折号表明“众祭司”与“弟兄”构成同位关系。
- source_word: ἑαυτοῖς
  choice: 为自己
  rationale: 准确表达反身代词的与格受益关系，并与前两个“为”构成清晰并列。
theological_decisions:
- issue: “被掳之子”和“弟兄”的阳性群体用语
  choice: 正文将前者译为自然的群体称谓“被掳归回的人”，后者保留为“弟兄”
  alternative: 直译为“被掳之子”；或将两者都中性化为“被掳归回者”和“同胞”
  rationale: “被掳之子”在现代汉语中容易被误解为被掳者的儿子，因此正文传达其历史共同体含义，并由脚注注明字面形式；“弟兄”在祭司群体的语境中自然且保留原文的男性亲属称谓。
- issue: πάσχα所指的是节期还是祭物
  choice: 译为“逾越节的祭牲”
  alternative: 译为“逾越节”或“逾越节羊羔”
  rationale: 因其直接受“宰献”支配，此处祭物含义明确；但希腊文没有明说“羊羔”，故不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“宰献”保留礼仪动作的具体性；破折号清楚表示“众祭司”是“他们的弟兄”的同位说明。
