  terminology: “居鲁士、大流士、亚达薛西”可保留。“命令”在现代标准汉语中足以表达πρόταγμα的正式性；“同意”自然表达此处γνώμη的行政性赞同，并可由脚注保留“意旨／决定”等可能性。
