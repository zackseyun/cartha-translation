base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: zh_hans
  text: 他们藉着主——以色列的上帝——的命令，又在居鲁士、大流士和亚达薛西——波斯人的王[a]——的同意[b]下，完成了这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“波斯人的王”，其中“王”为单数，形式上紧随并修饰“亚达薛西”；其意义也可能概括前述三位君王，即他们都是波斯王。
    reason: 说明单数称号的句法附着及其可能的统摄性含义，不在正文中消除歧义。
  - marker: b
    text: “同意”也可译作“意旨”或“决定”。
    reason: 保留γνώμη在此行政语境中可指赞同、意向或决定的词义幅度。
lexical_decisions:
- source_word: συνετέλεσαν
  choice: 完成了
  rationale: 表示把事情做到底、使其完成；“完成了”自然且不额外限定具体工程范围。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留希腊文复数指示词的宽泛所指，避免解释性地缩窄为“这些工程”。
- source_word: διὰ προτάγματος
  choice: 照着……的谕令
  rationale: πρόταγμα指正式命令或谕令；结合διά，译作“照着……的谕令”兼顾依据和促成之意。
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: 主以色列之上帝
  rationale: 忠实保留κύριος与“以色列之上帝”的称谓关系，同时采用庄重、易懂的现代汉语表达。
- source_word: μετὰ τῆς γνώμης
  choice: 得到……的认可
  rationale: γνώμη可指意见、意向、决定或同意；在王室行政语境中，“认可”最自然地表达官方赞同，同时以脚注保留词义弹性。
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: 居鲁士、大流士和亚达薛西
  rationale: 采用现代中文圣经及历史文献中通行的波斯君王译名。
- source_word: βασιλέως Περσῶν
  choice: 这亚达薛西是波斯人的王
  rationale: 希腊文“王”为单数，形式上最直接修饰最后一个名字亚达薛西；拆为短句可在中文中保留这一语法，同时脚注说明也可能统摄三王。
theological_decisions:
- issue: 上帝的谕令与帝王认可之间的关系
  choice: 将完成之事同时表述为照着主的谕令并得到波斯诸王认可
  alternative: 把帝王认可仅视为上帝谕令的从属说明
  rationale: 希腊文用καὶ连接两个介词结构，形成并列；译文保留神圣旨意与帝国授权并置的张力，不把两者合并或预先规定其因果层级。
- issue: “波斯人的王”的修饰范围
  choice: 正文按单数形式使称号直接指向亚达薛西
  alternative: 把称号分配给居鲁士、大流士和亚达薛西三人，译为“波斯诸王”
  rationale: βασιλέως是单数且紧随亚达薛西之后，形式上直接修饰最后一名君王；但语义上可能概括三位波斯统治者，因此以脚注保留另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谕令”体现正式王令式语域；“这些事”保持所指开放。为忠实保留βασιλέως的单数及其附着歧义，将末尾称号独立成句，并以脚注交代可能统摄三王。
