  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
translation:
  language: zh_hans
  text: 他们在主面前欢欢喜喜地守了七天无酵节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: 守了
  rationale: ἄγω用于节期语境时表示举行、守节；“守了”符合现代汉语宗教节期的惯用表达，也与希伯来文平行经文的ויעשו相合。
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: 无酵节
  rationale: 这是该犹太节期在中文中的通行名称，准确表达“无酵饼的节期”。
- source_word: ἑπτὰ ἡμέρας
  choice: 七天
  rationale: 直接表达希腊文宾格所表示的持续时间。
- source_word: εὐφραινόμενοι
  choice: 欢欢喜喜地
  rationale: 该现在分词说明守节时伴随的喜乐状态；叠词表达自然、清楚，同时保留其动态意味。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: 保留ἔναντι所表达的临在关系，并按希腊文本将Κύριος译为“主”。
theological_decisions:
- issue: 在希腊文本为Κυρίου、希伯来文平行经文为神名YHWH时如何翻译
  choice: 主
  alternative: 耶和华／上主
  rationale: 本节的首要依据是希腊文，故直接按Κυρίου译作“主”；不以平行经文中的神名取代希腊文本，也不额外引入特定传统的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“欢欢喜喜地”自然传达节庆喜乐；调整语序，把“在主面前”和喜乐状态置于谓语之前，使中文流畅而不改变修饰关系。
