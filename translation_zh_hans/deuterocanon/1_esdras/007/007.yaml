base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/007.yaml
  text: And they offered for the dedication of the house of the Lord one hundred bulls, two hundred rams, and four hundred lambs,
translation:
  language: zh_hans
  text: 他们为主的圣殿举行奉献礼，献上公牛一百头、公绵羊二百只、羊羔四百只。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκαν
  choice: 献上
  rationale: 准确表达把牲畜作为祭物奉献的动作，符合现代汉语宗教语境。
- source_word: ἐγκαινισμὸν
  choice: 奉献礼
  rationale: 此处指圣殿建成后的奉献典礼；译为“奉献礼”比单纯“落成”更能保留礼仪含义。
- source_word: ἱεροῦ τοῦ κυρίου
  choice: 主殿
  rationale: ἱερόν指圣殿；采用简洁自然的“主殿”，保留其属于主的含义，同时避免把“殿”误解为普通房屋。
- source_word: ταύρους
  choice: 公牛
  rationale: 准确对应成年雄牛，并以量词“头”符合现代汉语习惯。
- source_word: κριοὺς
  choice: 公绵羊
  rationale: 明确区别于泛称的羊和后面的羊羔，准确表达成年雄羊。
- source_word: ἄρνας
  choice: 羊羔
  rationale: 保留幼羊之义；希腊文在此未明确性别，不额外限定。
