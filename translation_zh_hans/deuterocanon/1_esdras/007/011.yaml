base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: zh_hans
  text: 以及所有被掳者的子孙[a]，因为他们已经洁净了自己。原来所有利未人都一同洁净了自己，全都如此[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“被掳之子的子孙”；也可译作“流亡者的子孙”，或按意思译作“被掳者”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在此语意未完，似乎接续下文。“洁净了自己”也可译作“得了洁净”。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: 被掳之人的子孙
  rationale: 保留希腊文“被掳者之子”的群体身份用语，同时用现代汉语较自然的“子孙”表达；不擅自增添“归回”的含义。
- source_word: ἡγνίσθησαν
  choice: 洁净了自己
  rationale: ἁγνίζω在此指礼仪性的洁净；其形态可作反身或被动理解，正文采用符合敬拜预备语境的反身表达，并在脚注保留被动可能。
- source_word: λευεῖται
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群名称。
- source_word: ἅμα πάντες
  choice: 全都一同……无一例外
  rationale: 兼顾ἅμα的共同、同时意味和πάντες的全体意味，并保留希腊文重复强调全体利未人的力度。
theological_decisions:
- issue: 礼仪洁净用语
  choice: 洁净了自己
  alternative: 得了洁净
  rationale: 上下文所指是参与敬拜前的礼仪预备，不宜抽象化为一般道德或内在更新；同时该动词形式确有被动理解的可能，故用脚注说明。
- issue: 句意未完结
  choice: 以逗号收束本节
  alternative: 以句号结束并补足含义
  rationale: 希腊文此处语意呈片段状，似乎接续下一分句；不在本节内擅自补出宾语或结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“洁净”及对利未人全体性的重复强调；以逗号反映本节与后文尚未结束的句法关系。
