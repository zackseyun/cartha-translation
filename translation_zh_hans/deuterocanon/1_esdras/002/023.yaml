base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: zh_hans
  text: 城中的人进行叛乱和战争[a]；又有强大而严酷的君王在耶路撒冷掌权，向科埃叙利亚和腓尼基征收贡税。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》4:20的亚兰文平行经文说，耶路撒冷是一座悖逆的城，曾损害君王和各省，并且自古以来其中就有人进行反叛。《以斯德拉一书》在这里扩展了这一描述，提到“叛乱和战争”，以及向科埃叙利亚和腓尼基征收贡税。
    reason: 说明希腊文本与《以斯拉记》4:20亚兰文平行经文之间的扩展和差异。
lexical_decisions:
- source_word: ἀποστάσεις
  choice: 叛乱
  rationale: 指政治性的反叛或起事；用“叛乱”既符合语境，也保留希腊文复数所表达的反复或多起事件，汉语中无需机械标出复数。
- source_word: πολέμους
  choice: 战争
  rationale: 直接表达战争或战事，不缩窄为个别战役。
- source_word: συντελοῦντες
  choice: 发动
  rationale: 此分词表示积极促成或实施叛乱和战争；“发动”在现代汉语政治语境中自然，并体现行为主体的主动性。
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: 强大而严酷
  rationale: 分别保留君王的权势与严厉、苛酷两个特征；“严酷”比字面的“坚硬”更符合人物统治语境。
- source_word: κυριεύοντες
  choice: 掌权
  rationale: 表示行使统治权；“在耶路撒冷掌权”简洁自然，同时保留支配意味。
- source_word: φορολογοῦντες
  choice: 征收贡税
  rationale: 该词表示征税或索取贡赋；“贡税”适合古代君王对辖地征敛的政治背景，也避免把它理解为现代常规税制。
- source_word: κοίλην Συρίαν
  choice: 叙利亚谷地
  rationale: Κοίλη Συρία是希腊化时代的地名，传统音译亦可作“科埃叙利亚”；采用较易懂的意译“叙利亚谷地”，并在地名层面保持其专名性质。
- source_word: Φοινίκην
  choice: 腓尼基
  rationale: 采用该古代地区在现代简体中文中的通行名称。
- source_word: ἐν αὐτῇ
  choice: 城里
  rationale: 代词承接上下文中的城，即耶路撒冷；译成“城里”比“在其中”更自然，同时不另行添加城名。
theological_decisions:
- issue: 希腊文本与《以斯拉记》4:20亚兰文平行经文的关系
  choice: 正文完整保留希腊文所述的叛乱、战争，以及向叙利亚谷地和腓尼基征收贡税。
  alternative: 依照《以斯拉记》4:20的平行经文，译为这城素来悖逆、损害君王和各省，其中自古常有反叛之事。
  rationale: 本段翻译以《以斯德拉一书》的希腊文本为首要依据。亚兰文平行经文可用于参照，却不能取代希腊文较完整且经过改写的表述；因此将差异置于脚注，不在正文中加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城里的人”承接前文所指的耶路撒冷；分号呈现希腊文中两组并列陈述。“叙利亚谷地”用于兼顾古地名的含义和普通读者的可理解性。
