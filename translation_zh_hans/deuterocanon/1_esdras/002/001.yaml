base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: zh_hans
  text: 波斯王居鲁士元年，为要成就主[a]借耶利米之口所说的话，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文作“耶和华”。
    reason: 说明主要希腊文本的Κυρίου与希伯来文平行经文יהוה之间的差异。
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: 波斯王居鲁士元年
  rationale: 希腊文以独立属格配合“第一年”标示时间，直译近于“居鲁士统治时的第一年”；汉语用“波斯王居鲁士元年”简洁自然，也与希伯来文平行经文相符。
- source_word: εἰς συντέλειαν
  choice: 为要成就
  rationale: 表达目的或结果，即使后述之话达到完成、应验；“成就”保留经文语体，同时不限定其具体实现方式。
- source_word: ῥήματος Κυρίου
  choice: 主的话
  rationale: ῥῆμα在此指主所发出的言语；按希腊文主文本将Κύριος译作“主”。汉语句法中与后文合为“主借耶利米之口所说的话”。
- source_word: ἐν στόματι Ἰερεμίου
  choice: 借耶利米之口所说
  rationale: 保留“口”的具体意象及先知传言公式；“借……之口所说”是自然、庄重且易懂的现代汉语。
theological_decisions:
- issue: Κυρίου与希伯来文平行经文中יהוה的译法
  choice: 主
  alternative: 耶和华
  rationale: 本书翻译以希腊文为主要依据，希腊文作Κυρίου，故正文译“主”；希伯来文平行经文明确使用神名יהוה，其对应译法列入脚注，以保留文本见证之间的差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“元年”为普通读者熟悉的纪年表达；全句按原文保留未完句式，以逗号承接下一节内容。
