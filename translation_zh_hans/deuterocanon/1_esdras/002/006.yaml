base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: zh_hans
  text: 所以，凡住在各地的人，他所在之地的人都当用金银、礼物、马匹和牲畜[a]帮助他，连同其他按所许的愿、为耶路撒冷主的圣殿另加的供物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“马匹和牲畜”。《以斯拉记》1:4、1:6的希伯来平行文本在此有异，所用词语指财物和牲畜，而非“马匹”；正文依从《以斯德拉一书》的希腊文本。
    reason: alternative_reading
  - marker: b
    text: “圣殿”所译的希腊词也可译作“圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: 所以，凡住在各地的人
  rationale: οὖν承接上文，译作“所以”；ὅσοι引出不定范围，译作“凡……的人”；κατὰ τοὺς τόπους具有分布意味，以“各地”自然表达。
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: 当由他当地的人帮助他
  rationale: 保留命令语气和单数αὐτῷ所指的每一位返乡者；“他当地的人”表达该人所居之地的居民，同时避免限定性别。
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: 给他金银、礼物
  rationale: 此处ἐν表示帮助所采用的物资；现代汉语用“给他”比逐字译为“用”更清楚。δόσεις是所赠之物，译作宽泛的“礼物”，不预先赋予礼仪性质。
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: 马匹和牲畜
  rationale: ἵπποι直译为“马匹”；κτήνη指家畜，译作“牲畜”。主文本依从《以斯德拉一书》的希腊文本，不以平行希伯来文本改写。
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: 以及其他为还愿而增添的供物
  rationale: προστεθειμένοις表达另外加上的物品；κατʼ εὐχάς在此指与所许之愿有关的奉献，以“为还愿”表达其履行誓愿的含义。“供物”由献给圣殿的语境明确。
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: 献给耶路撒冷的主的圣殿
  rationale: εἰς在此表达奉献的归向，以“献给”显明；ἱερόν译作“圣殿”，准确指耶路撒冷的宗教建筑；κύριος按希腊源文译作“主”。
theological_decisions:
- issue: 圣殿语境中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 主源文本为希腊文κυρίου，并非直接出现四字神名，因此正文依希腊形式译作“主”；希伯来平行文本仅作参照，不取代主文本。
- issue: ἱερόν的译法
  choice: 圣殿
  alternative: 圣所
  rationale: ἱερόν可指圣殿或圣所；本节明确提到耶路撒冷，所指为整体圣殿，故正文用“圣殿”，并以脚注保留词义范围。
- issue: κατʼ εὐχάς所表达的许愿关系
  choice: 为还愿而
  alternative: 作为许愿的供物
  rationale: 该短语可概括与誓愿相关的奉献；“为还愿而”自然表达履行所许之愿，但不进一步规定誓愿内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“所以……当……”保留诏令式承接和命令语气；避免生硬复制希腊介词结构，同时保留逐项列举和单数代词所形成的分配性表达。
