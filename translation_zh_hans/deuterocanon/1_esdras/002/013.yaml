base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/013.yaml
  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
translation:
  language: zh_hans
  text: 所有金器和银器都被运上来[a]，共五千四百六十九件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“被运上来”，可能是指这些圣殿器皿被运回耶路撒冷；也可译作“被运来”。
    reason: lexical_alternative
  - marker: b
    text: 《以斯拉记》1:9—10的希伯来文平行记载在项目和数目上有所不同；本译文此处依据《以斯拉一书》的希腊文本。
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ... πάντα σκεύη
  choice: 所有器皿
  rationale: σκεύη在圣殿财物的语境中指各类器具；“器皿”既自然，也能保留其礼仪和财物语境，而不将范围缩窄为某一种用具。
- source_word: ἐκομίσθη
  choice: 运了上来
  rationale: 该词为不定过去时被动形式，表示被搬运、带来；“运了上来”保留了希腊文可能暗含的往耶路撒冷或圣殿上行之意，同时不把它明确解释为“归还”。
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: 有金的，也有银的
  rationale: 两个形容词承接前面的“器皿”。汉语用省略中心语的并列结构，简洁而清楚地表达金器和银器。
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  choice: 五千四百六十九件
  rationale: 按希腊文直接译出明确的基数总额，并加量词“件”以符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“器皿”延续圣殿语境中的常用称谓；数字写作汉字，与经文体例协调。脚注保留“运上来”的方向含义及平行文本的数字差异，不在正文中消解文本张力。
