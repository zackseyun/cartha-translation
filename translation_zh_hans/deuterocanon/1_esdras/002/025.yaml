base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: zh_hans
  text: 那时，亚达薛西王所写的文书宣读之后，拉提穆斯和书记员撒梅利乌斯[a]，以及与他们站在一边的人，便带着骑兵和一群列成战阵的人，急忙赶往耶路撒冷。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文人名为“拉提穆斯”和“撒梅利乌斯”；希伯来文平行记载通常将二人对应为“利宏”和“伸帅”。
    reason: alternative_reading
  - marker: b
    text: “带着骑兵和一群列成战阵的人”也可译作“带着马队和一大群列阵的人”。希腊文措辞较为紧缩，可能指武装护卫队或强行动员的队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθέντων τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: 亚达薛西王所写的文书宣读之后
  rationale: 以时间从句表达属格独立结构，并保留被动的“宣读”；“文书”自然概括希腊文中较宽泛的“所写之物”，不限定为单封书信。
- source_word: Ῥάθυμος
  choice: 拉提穆斯
  rationale: 按主要希腊文本音译人名；不以平行希伯来文本的“利宏”取代。
- source_word: Σαμέλλιος
  choice: 撒梅利乌斯
  rationale: 按主要希腊文本音译人名；平行希伯来文本可能对应“伸帅”。
- source_word: ὁ γραμματεὺς
  choice: 书记员
  rationale: 此处是行政语境，既可指书记，也可指文书官；“书记员”在现代汉语中清楚而不过度规定官阶。
- source_word: οἱ τούτοις συντασσόμενοι
  choice: 与他们站在一边的人
  rationale: 表达这些人与前述官员联合、同一阵营的含义，同时避免加入正式结盟等原文未明说的细节。
- source_word: ἀναζεύξαντες κατὰ σπουδὴν
  choice: 急忙赶往
  rationale: 结合动身前往与迅速急切两层意思；耶路撒冷的方向性在汉语“赶往”中自然表达。
- source_word: μεθʼ ἵππου
  choice: 带着骑兵
  rationale: ἵππος虽为单数，语境中很可能作集合或惯用表达；译为“骑兵”比字面的“马”更符合武装行动场景。
- source_word: ὄχλου παρατάξεως
  choice: 列成战阵的一群人
  rationale: 同时保留ὄχλος的群体含义和παράταξις的战斗队列含义，不将这个压缩而略显生硬的短语过度顺平为正规军队。
