base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: zh_hans
  text: 于是，王回信给负责记录呈报事项的拉提穆斯[a]、贝尔特特穆斯、书记萨梅利乌斯，以及其余同他们一起办事、住在撒马利亚、叙利亚和腓尼基的人[b]，内容如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “负责记录呈报事项的”也可理解为某种行政官衔。希腊语原文较为含蓄，直指负责记录被提交事项的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本称这些收信人住在撒马利亚、叙利亚和腓尼基；《以斯拉记》的平行亚兰文传统在人名和措辞上有所不同。此处以《以斯得拉一书》的希腊文本为准。
    reason: textual_variant
lexical_decisions:
- source_word: ἀντέγραψεν
  choice: 回信
  rationale: 该复合动词表示以书面形式作答；“回信”自然、准确地保留了书信往来的含义。
- source_word: Ῥαθύμῳ
  choice: 拉提穆斯
  rationale: 按《以斯得拉一书》的希腊文本音译人名，不以平行亚兰文传统中的名称替换。
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  choice: 负责记录呈报事项的
  rationale: γράϕοντι表示书写或记录，τὰ προσπίπτοντα指被提交到面前的事项；译文保留其行政职能，同时不武断限定为“控告”或某一确定官衔。
- source_word: Βεελτέθμῳ
  choice: 贝尔特特穆斯
  rationale: 依希腊文本音译，不与平行传统中的不同人名强行协调。
- source_word: Σαμελλίῳ γραμματεῖ
  choice: 书记萨梅利乌斯
  rationale: γραμματεύς在行政语境中可指书记或文书；“书记”简明且符合上下文。
- source_word: τοῖς λοιποῖς τοῖς συντασσομένοις
  choice: 其余同他们一起办事……的人
  rationale: 该分词表示与上述人员同列、协作或共同参与者；此译法不额外断定其具体官阶。
- source_word: οἰκοῦσιν
  choice: 住在
  rationale: 以自然的现代汉语表达“居住、居留”的分词含义。
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  choice: 在撒马利亚、叙利亚和腓尼基
  rationale: 完整保留希腊文本明确列出的三个地区。
- source_word: τὰ ὑπογεγραμμένα
  choice: 内容如下
  rationale: 这是引出下文信件内容的惯用格式；“内容如下”在现代汉语中自然得体。
