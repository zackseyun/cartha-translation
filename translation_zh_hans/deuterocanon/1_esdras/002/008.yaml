base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: zh_hans
  text: 他们周围的人在各方面帮助他们，用银子、金子、马匹[a]、牲畜，以及许多心意受到激发的人[c]所作的祈祷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文（《以斯拉记》1:6）这里不是“马匹”，而是较宽泛的“财物”。本节正文依希腊文翻译。
    reason: alternative_reading
  - marker: b
    text: “祈祷”：希腊文此词也可译为“祈愿”或“所许的愿”；希伯来文平行经文则作“贵重礼物”。
    reason: textual_variant
  - marker: c
    text: “心意受到激发”：或译“心灵受到感动”。希腊文直译为“心意被激起”，希伯来文平行经文则使用“灵”的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: 他们周围的人
  rationale: 紧扣希腊文“在他们周围的人”，同时保持现代汉语自然；不直接译作“邻舍”，以免加入原文未明说的社会关系。
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: 在各方面帮助他们
  rationale: 表达全面援助的意思，并按汉语需要补出受事者“他们”。
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: 给他们银子、金子
  rationale: 介词在此表示提供援助所用的财物；用“给他们”使汉语关系清楚。
- source_word: ἵπποις
  choice: 马匹
  rationale: 希腊文明确指马；尽管希伯来文平行经文所用词较广，仍以本书希腊文为主。
- source_word: κτήνεσιν
  choice: 牲畜
  rationale: 该词泛指家养牲口，“牲畜”准确而不局限于牛。
- source_word: εὐχαῖς ὡς πλείσταις
  choice: 大量许愿献上的礼物
  rationale: εὐχή可指祷告或所许的愿；在一系列物质援助中，译作因许愿而献的礼物较合语境，但在注脚保留其词义及异文上的不确定性。
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: 来自许多心思受到激发的人
  rationale: 保留νοῦς的“心思、思想”含义和ἠγέρθη的被动意象，不改译为希伯来平行经文的“灵受感动”。
theological_decisions:
- issue: 希腊文所列援助物品与《以斯拉记》1:6的希伯来文平行经文不同
  choice: 正文依希腊文译出“马匹”和“许愿献上的礼物”，并用注脚说明希伯来文读法
  alternative: 按希伯来文协调为“财物”和“贵重礼物”
  rationale: 《以斯得拉一书》应以现存希腊文为主要翻译依据；但平行经文的差异具有文本意义，不应隐去。
- issue: νοῦς与希伯来平行经文所呈现的“灵”之习语
  choice: 译作“心思受到激发”
  alternative: 译作“心灵受到感动”或“灵受到激发”
  rationale: “心思”较直接反映希腊文νοῦς；“心灵”更自然，却可能掩盖希腊文与希伯来文措辞的差别，因此将替代译法收入注脚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“给他们”与“这些都来自”属于为明确希腊文关系所作的轻度显化；注脚完整保留希腊词义及希伯来平行经文造成的歧义。
