base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: zh_hans
  text: 他指示我在位于犹太地区的耶路撒冷，为他建造一座房屋[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指示”也可译作“委派”或“吩咐”；希腊词可表示“使人知道”，在这里也可能含有授命的意思。
    reason: lexical_alternative
  - marker: b
    text: “房屋”在此指为上帝建造的圣所；也可译作“殿宇”或“圣殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν
  choice: 指示
  rationale: σημαίνω的基本语义是“表明、指示、使人知道”；与不定式连用时可带有交付使命的意味。“指示”既保留希腊文的表达，又不把语气过度强化为明确的“命令”。
- source_word: οἰκοδομῆσαι
  choice: 建造
  rationale: 希腊文仅说“建造”，没有明确表达“重建”的前缀；虽然后文背景涉及复兴，正文仍按原词译为“建造”。
- source_word: αὐτῷ
  choice: 为他
  rationale: 与οἶκον和οἰκοδομῆσαι连用的与格自然表示受益或奉献对象，即为上帝建造。
- source_word: οἶκον
  choice: 一座殿宇
  rationale: οἶκος字面为“房屋”，在此语境中指上帝的圣所。“殿宇”能让现代读者自然理解所指，同时脚注保留其字面措辞。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太的
  rationale: 该短语以同位说明限定耶路撒冷的位置；“在犹太的耶路撒冷”简洁保留了希腊文的地理说明。
theological_decisions:
- issue: οἶκον应译为一般的“房屋”还是明确指向圣所的“殿宇”
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 希腊词本身是“房屋”，但在为上帝建造且地点为耶路撒冷的语境中显然指圣所。“殿宇”避免现代读者误解为普通住宅，又不如“圣殿”那样完全替换原文意象；字面译法列入脚注。
- issue: ἐσήμανέν是否表达直接命令
  choice: 指示
  alternative: 命令；委派
  rationale: 希腊动词可表示使人知道，也可在此语境中含有授命之意，但本身不必然等同于“命令”。“指示”保留神圣授权与语义张力，不把表达强化为明确命令。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要我”使“指示”与希腊文不定式之间的关系清楚；保留“在犹太的耶路撒冷”这一略带说明性的地理表达。
