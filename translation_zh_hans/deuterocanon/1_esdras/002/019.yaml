base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: zh_hans
  text: 你会在档案中找到有关这些事的记载，并会知道那座城曾是叛逆的，常常扰乱诸王和各城；城中的犹太人也是叛乱者，自古以来就在其中组织围攻[a]。因此，这城被毁成荒凉之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围攻”也可译作“封锁”；希腊语可泛指围城行动。
    reason: 保留πολιορκίας的词义范围及该短语在具体军事行动上的不确定性。
lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: 档案
  rationale: 在王室行政语境中指可供查考的正式记录；“档案”自然、明确，也符合文书背景。
- source_word: τὰ γεγραμμένα περὶ τούτων
  choice: 关于这些事的记载
  rationale: 保留已经写成并留存可查的含义，同时符合现代汉语表达。
- source_word: ἀποστάτις
  choice: 一向反叛
  rationale: 此处指城邑对帝国权威的政治反叛，而非宗教意义上的背道。
- source_word: ὀχλοῦσα
  choice: 使……不得安宁
  rationale: 表达持续造成骚扰、动荡和困扰的含义，比生硬的“困扰”更自然。
- source_word: ἀποστᾶται
  choice: 叛乱者
  rationale: 上下文所指是政治叛乱，因此避免使用带宗教含义的“背道者”。
- source_word: πολιορκίας συνεσταμένοι
  choice: 组织围攻
  rationale: πολιορκίας可泛指围城或围攻行动，συνεσταμένοι含组织、结成或设立之意；此译保留动作性质及搭配上的张力。
- source_word: ἔτι ἐξ αἰῶνος
  choice: 自古以来
  rationale: 表达这种活动由来已久，语体庄重而符合现代汉语。
- source_word: ἠρημώθη
  choice: 沦为荒凉
  rationale: 保留被动结果和城邑遭毁而荒废的沉重语气。
theological_decisions:
- issue: 对城和犹太人的指控性质
  choice: 政治上的反叛与敌对活动
  alternative: 宗教上的背道
  rationale: ἀποστάτις和ἀποστᾶται虽可在其他语境中涉及背道，但本节处于波斯王室行政指控的语境，重点是对王权的叛乱及造成动荡。
- issue: πολιορκίας συνεσταμένοι的具体所指
  choice: 组织围攻
  alternative: 设立封锁线
  rationale: 希腊语可涵盖较广的围城活动，且与“组织、结成”连用时不宜过度限定为某一种战术，因此正文采用较宽的“围攻”，脚注保留“封锁”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的行政控诉语体。“那城”对应前述被查考的城，“这城”对应结论中的近指表达；句法适度拆分，以免希腊语长句在中文中显得滞重。
