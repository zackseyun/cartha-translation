review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实呈现行政控诉的语境：将ἀποστάτις、ἀποστᾶται译为政治性的“叛逆／叛乱者”，并将ὑπομνηματισμοῖς译为“档案”，均恰当。惟“一向反叛”把持续性较强地加在ἦν ἐκείνη ἀποστάτις上；原文明确的“自古以来”（ἔτι ἐξ αἰῶνος）紧接并修饰犹太人在城中“组织围攻／围城行动”一事。宜调整，使时间范围不致前移。结句ἠρημώθη为被动的荒凉／毁灭结果，宜在中文中较清楚地保留这一结果性。
  naturalness: 原译庄重、通顺，脚注位置正确。“在城中组织围攻”虽保留原文较为棘手的搭配，但“其中的犹太人……在城中”稍显重复；改为“城中的犹太人……在其中”更紧凑。以“围城行动”说明“围攻”的军事语义，现代汉语更明确，同时不将其限定为“封锁”。
  terminology: “档案”“叛逆”“叛乱者”符合本段波斯行政指控的政治语境，不应译作带宗教色彩的“背道”。πολιορκίας可指围攻、围城或更广义的围城行动；正文保留“围攻”，并以脚注给出“封锁”的可行替代，处理适当。
  issues:
  - severity: low
    issue: “一向反叛”可能使“自古以来”的时间范围前移。
    rationale: ἔτι ἐξ αἰῶνος在句中与συνεσταμένοι相连，直接限定所组织的πολιορκίας，而非明确限定该城“是叛逆的”。改用“曾是叛逆的”避免无必要地扩大时间修饰范围。
  - severity: low
    issue: 结句“沦为荒凉”对被动毁坏结果表达稍弱。
    rationale: ἠρημώθη是被动式，指该城遭致荒凉。译为“被毁成荒凉之地”以自然汉语明确保留这一结果，不额外断定具体毁坏方式。
