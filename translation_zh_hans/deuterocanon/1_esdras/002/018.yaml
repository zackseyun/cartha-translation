base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: zh_hans
  text: 所以，这城若重建，城墙若修完，他们就决不肯继续纳贡[a]，甚至还会反抗诸王。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们决不肯忍受纳贡。”希腊文直译近于“决不忍受去缴纳”，可能着重表示他们不愿继续处在帝国贡赋的重压之下，而不只是无力缴纳。
    reason: lexical_alternative
  - marker: b
    text: 本节以希腊文为主要依据。所提供的马所拉文本平行材料与本节措辞并不密切对应，因此正文直接依照希腊文翻译。
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以……若
  rationale: οὖν承接上文作出推论；用“所以”保留论证关系，“若”自然表达条件。
- source_word: ἡ πόλις αὕτη
  choice: 这城
  rationale: 保留近指代词αὕτη，也符合书信中指称该城的自然汉语。
- source_word: οἰκοδομηθῇ
  choice: 重建
  rationale: 动词本可指建造；鉴于语境是恢复耶路撒冷，译作“重建”准确而自然。
- source_word: τὰ τείχη συντελεσθῇ
  choice: 城墙若修完
  rationale: συντελέω强调完成；“修完”既体现竣工之意，也与前面的重建语境协调。
- source_word: φορολογίαν
  choice: 纳贡
  rationale: 该词指向统治者承担的贡税义务；“纳贡”比一般的“纳税”更贴合帝国政治语境。
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: 决不肯继续纳贡
  rationale: οὐ μή加强否定；ὑπομένω有承受、坚持或继续之意。此处用“决不肯继续”自然表达他们拒绝继续承担贡赋，同时不将其弱化为无力缴纳。
- source_word: ἀλλὰ καὶ
  choice: 甚至还会
  rationale: 体现指控的递进力度：不但拒绝纳贡，而且进一步反抗王权。
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: 反抗诸王
  rationale: ἀνθίστημι意为抵抗、反对；“反抗”保留政治叛逆指控的力度。复数βασιλεῦσιν译作“诸王”。
