  source_fidelity: 正文准确反映希腊文的条件结构、强调否定、贡赋义务及进一步反抗君王的指控。“所以，这城若重建，城墙若修完”对应ἐὰν οὖν、οἰκοδομηθῇ及τὰ τείχη συντελεσθῇ；“决不肯继续纳贡”以自然汉语表达οὐ μὴ ὑπομείνωσιν δοῦναι，并借脚注保留“忍受/继续承担”的词义张力。
