base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: zh_hans
  text: 于是，波斯王居鲁士把它们[a]取出来，交给自己的司库[b]米特里达梯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指上一节所说的圣殿器皿。
    reason: cross_reference
  - marker: b
    text: 也可译为“看守库藏的官员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: 取出来
  rationale: 表示把物品从存放之处带出；“取出来”符合现代汉语，也与希伯来文平行经文的 הוֹצִיא 相符。
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: 波斯王居鲁士
  rationale: 准确表达“波斯人的王”，同时采用自然、庄重的现代汉语称谓。
- source_word: παρέδωκεν
  choice: 交给
  rationale: 这里指正式把器物转交给官员保管；“交给”简明自然，并保留移交之意。
- source_word: Μιθριδάτῃ
  choice: 米特里达梯
  rationale: 按希腊文人名 Μιθριδάτης 音译，并采用该古代人名常见的汉语形式。
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: 自己的司库
  rationale: γαζοφύλαξ 指掌管或看守库藏的官员；“司库”简洁地表达其职务，ἑαυτοῦ 则译为“自己的”，明确此人隶属居鲁士。
- source_word: αὐτά
  choice: 它们
  rationale: 代词回指上一节所说的圣殿器皿；正文保留代词形式，并以脚注说明所指。
- source_word: δὲ
  choice: 于是
  rationale: 承接上文叙事并推进事件；“于是”比机械译作“但”更符合此处的篇章功能。
