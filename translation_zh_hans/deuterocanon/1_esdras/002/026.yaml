base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: zh_hans
  text: 他们开始阻挠那些正在建造的人；耶路撒冷圣殿的建造工程停了下来[a]，直到波斯王大流士在位的第二年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“停工”或“闲置”；希腊文动词表明圣殿建造工程已经停顿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  choice: 开始阻挠
  rationale: ἤρξαντο与不定式连用，表示行动的开始；κωλύειν表示主动妨碍或阻挠。译为“开始阻挠”既保留起始含义，也不提前把结果说成完全制止。
- source_word: τοὺς οἰκοδομοῦντας
  choice: 那些建造的人
  rationale: 现在分词突出正在从事建造的人；此译保留其动词性，而不单纯名词化为“工匠”。
- source_word: ἤργει
  choice: 停了下来
  rationale: 该动词在此表示工程停止运作、处于闲置状态。“停了下来”自然清楚，并与前句的阻挠形成结果关系。
- source_word: ἡ οἰκοδομὴ τοῦ ἱεροῦ
  choice: 圣殿的建造工程
  rationale: οἰκοδομή在此指建造活动或工程，而非已经建成的建筑；ἱερόν指圣殿或圣殿建筑群。
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: 耶路撒冷圣殿
  rationale: 希腊语结构用于限定圣殿所在之处；汉语将地名置于“圣殿”之前最为自然。
- source_word: μέχρι τοῦ δευτέρου ἔτους τῆς βασιλείας Δαρείου
  choice: 直到……大流士在位第二年
  rationale: μέχρι标明停工持续的终点；βασιλεία在这里是君王统治、在位之意。
- source_word: τοῦ Περσῶν βασιλέως
  choice: 波斯王
  rationale: 直义为“波斯人的王”。现代汉语以“波斯王”简洁自然地表达同一身份。
