translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“建造工程”明确所停的是施工活动；分号保留原文两个紧密相连分句的推进关系。未添加原文没有的主语身份，也未依据近似的马所拉平行经文改写希腊文本。
