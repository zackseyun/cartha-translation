base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: zh_hans
  text: 现在，所以我们禀告你，君王，我主：如果这城建成，城墙筑起，你将不再有前往叙利亚谷地和腓尼基的通路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “通路”也可译作“通道”或“通行之路”。希腊文直译为“你将不再有出口通往叙利亚谷地和腓尼基”；这里可指失去实际通行的路径，也可能含有势力不再能伸展至该地区的意味。“叙利亚谷地”（Κοίλη Συρία）是古代地区名称。
    reason: 说明ἔξοδος在此语境中的词义范围，并说明“叙利亚谷地”为古代地理名称。
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: 我们禀告
  rationale: 此动词在这里引出臣民向君王呈交的正式报告；“禀告”既符合宫廷行政语境，也自然传达“使你知道”的意思。
- source_word: κύριε βασιλεῦ
  choice: 主上君王
  rationale: 保留两个呼格成分及其敬称色彩；“主上君王”比生硬的“主君王”更符合庄重、自然的现代汉语。
- source_word: οἰκοδομηθῇ
  choice: 建成
  rationale: 希腊文只表达城被建造，并未明确含有“重建”的重复义；译作“建成”也契合条件句所关注的完成结果。
- source_word: τὰ ταύτης τείχη
  choice: 城墙
  rationale: 依汉语习惯直接译为“城墙”，所指自然承接前面的“这城”，无需重复所有格。
- source_word: ἀνασταθῇ
  choice: 竖立起来
  rationale: 保留动词“立起、兴起”的建筑意象，不擅自具体化为“重建”。
- source_word: ἔξοδός
  choice: 通道
  rationale: 此处不是单指门口或出口，而是君王通往相关地区的路径或行动空间；“通道”可保留这种范围，并以脚注说明其也可能涉及通行权或势力伸展。
- source_word: κοίλην Συρίαν
  choice: 叙利亚谷地
  rationale: Κοίλη Συρία是古代地理名称；“叙利亚谷地”既反映κοίλη的地形含义，也较便于普通中文读者理解。
- source_word: Φοινίκην
  choice: 腓尼基
  rationale: 采用该古代地区通行的现代中文译名。
