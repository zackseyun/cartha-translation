translation_notes:
  register: 采用庄重而自然的奏报语体。“所以，现在”对应νῦν οὖν；两个“若”保持原文并列条件的结构。地名使用现代中文通行形式，并将Κοίλη Συρία译为“叙利亚谷地”。
