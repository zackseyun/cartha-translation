base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: zh_hans
  text: 波斯王亚达薛西在位的时候，贝勒摩、米特拉达梯、塔贝利乌、拉提摩、贝尔特提摩、书记撒梅利乌，以及与他们联合的其余人，住在撒马利亚和其他地方；他们写了下面这封信[a]，控告住在犹太地和耶路撒冷的人[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“写在下面的信”或“附在下文的信”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文中“写……控告住在犹太地和耶路撒冷的人”这一部分结构较为紧缩，其中还有一个指代不甚明确的代词；这里按其明显的书面控诉之意译出。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου τοῦ Περσῶν βασιλέως χρόνοις
  choice: 波斯王亚达薛西在位的时候
  rationale: χρόνοις直译为“时期”；结合“波斯人的王”这一称号，译作“在位的时候”自然地交代历史背景。δέ在此仅承接叙事，不另加“如今”等词。
- source_word: κατέγραψεν
  choice: 写了
  rationale: 该动词可指写下、登记或书面提出；因其宾语是“下面这封信”，译作“写了”最自然，敌对或控告的意味由κατά另行表达。
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: 控告住在犹太和耶路撒冷的人
  rationale: κατά与属格在这里表示针对或敌对，语境是书面控诉。αὐτῶν在希腊文句法中较为突兀，不宜机械重复为“他们的”，故保留句子的明显指向而以脚注说明原文紧缩。
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: 贝勒摩、米特拉达梯、塔贝利乌、拉提摩、贝尔特提摩、撒梅利乌
  rationale: 依斯威特版希腊文形式音译各人名，不以近似但未必同一的其他传统姓名替代。
- source_word: ὁ γραμματεύς
  choice: 书记
  rationale: γραμματεύς可指文士或行政书记；此处处于写信控告的官方语境，“书记”自然且不过度限定其宗教身份。
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: 与他们联合的其余人
  rationale: συντασσόμενοι表示与他们站在一起、联合或结成一方；“联合”保留群体结盟之意，又不强加军事色彩。
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: 住在撒马利亚和其他地方
  rationale: 忠实表达οἰκοῦντες“居住”和τοῖς ἄλλοις τόποις“其他地方”，不把范围具体化为原文未明说的地区。
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: 下面这封信
  rationale: ὑπογεγραμμένην字面意为“写在下面的”或“附在下文的”；“下面这封信”既保留空间性表达，也符合现代中文篇章习惯。
