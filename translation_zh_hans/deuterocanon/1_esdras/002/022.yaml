base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: zh_hans
  text: “你们寄给我的信，我已经读了。因此，我下令调查；结果发现，那座城自古以来一直与众王对抗，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一直反对诸王。”希腊语可指站在对立面、列阵相抗；“对抗”保留了较强的敌对意味，却没有直接断定为公开叛乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέγνων
  choice: 我已经读了
  rationale: 不定过去时第一人称单数；在王室回函语境中译为“我已经读了”自然地表明来信已阅。
- source_word: ἐπιστολήν
  choice: 信
  rationale: 该词通常指书信；“信”简明、自然，符合现代汉语。
- source_word: πέμψατε
  choice: 你们寄给我的
  rationale: πέμπω表示发送；用于书信时，“寄给”比泛称“送给”更贴合语境。
- source_word: ἐπέταξα
  choice: 我下令
  rationale: 表示发出命令，保留王室行政文书的语气。
- source_word: ἐπισκέψασθαι
  choice: 查验
  rationale: 此处指奉命进行调查、核查；“查验”兼具官方调查与核实之意。
- source_word: εὑρέθη
  choice: 结果发现
  rationale: 被动式用于调查结论的报告；汉语以“结果发现”自然表达这一非人称报告结构。
- source_word: ἐξ αἰῶνος
  choice: 自古以来
  rationale: 此处指久远的历史时期，并非形而上的永恒；“自古以来”准确而自然。
- source_word: ἀντιπαρατάσσουσα
  choice: 一直与……对抗
  rationale: 现在分词表达该城持续采取敌对立场；“对抗”保留敌对相持的力度，又不擅自强化为正式叛乱。
- source_word: βασιλεῦσιν
  choice: 众王
  rationale: 与格复数泛指历代君王；“众王”既保留复数，也符合庄重的历史叙述语体。
