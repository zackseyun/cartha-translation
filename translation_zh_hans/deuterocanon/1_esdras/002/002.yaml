base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: zh_hans
  text: 主激动了波斯人之王居鲁士的心[a]；他便在他全国各地宣告，也以书面颁布，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“波斯人的王”；《以斯拉记》1:1的希伯来文作“波斯王”。
    reason: 说明主要希腊文本与希伯来平行经文措辞的差异。
lexical_decisions:
- source_word: ἤγειρεν
  choice: 激动了
  rationale: ἐγείρω以“心灵/灵”为宾语时，表示唤起、促动内在意愿；“激动”是中文圣经叙事中自然而庄重的表达，也保留上帝主动促使居鲁士行动的含义。
- source_word: Κύριος
  choice: 主
  rationale: 希腊文为Κύριος，指以色列的上帝；译作“主”，不把希腊文本直接改写为四字神名。
- source_word: τὸ πνεῦμα Κύρου
  choice: 居鲁士的心
  rationale: πνεῦμα在这里指人的内在意愿、心志或精神状态。现代汉语用“心”最自然；上下文明确这是居鲁士的心，虽希腊文没有独立的物主代词。
- source_word: Κύρου
  choice: 居鲁士
  rationale: 采用现代中文中通行的波斯王名译法。
- source_word: βασιλέως Περσῶν
  choice: 波斯人之王
  rationale: 希腊文Περσῶν是复数属格，直指“波斯人的王”，故不在正文中与《以斯拉记》希伯来文本的“波斯王”完全调和。
- source_word: ἐκήρυξεν
  choice: 宣告
  rationale: 该动词表示公开传告或颁布；“宣告”简洁自然，并与随后书面形式相衔接。
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: 在全国
  rationale: 指宣告遍及居鲁士统治的整个国度；“在全国”符合现代汉语，且不改变范围。
- source_word: ἅμα διὰ γραπτῶν
  choice: 并且写成文告
  rationale: ἅμα在此带有附加或同时的意味，διὰ γραπτῶν表示借书面文字传达。“并且写成文告”清楚表达公开宣告也以书面颁布，且不限定为书信。
- source_word: λέγων
  choice: 说：
  rationale: 该分词引出下一节诏令内容；中文用“说：”自然承接。
theological_decisions:
- issue: 上帝在居鲁士颁诏中的主动作用
  choice: 主激动了居鲁士的心
  alternative: 主只是容许居鲁士行动；或居鲁士纯粹出于政治动机
  rationale: 希腊文明确以“主”为主动者，以居鲁士的πνεῦμα为受作用对象。译文保留直接的神圣推动，同时不进一步解释这种推动如何与居鲁士自身意志并存。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“激动……的心”保留经文的神学力度；“波斯人之王”略带正式色彩，用于忠实呈现希腊文复数形式。正文以冒号承接下一节诏令。
