base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: zh_hans
  text: 这些器皿的数目如下：金奠酒碗一千只，银奠酒碗一千只，银香炉二十九个，金碗三十只，银碗二百一十只[a]，其他器皿一千件。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文在此所呈现的银碗数字记法较难确定；本译文按“二百一十”处理，但流传下来的形式并不十分清楚。
    reason: textual_variant
  - marker: b
    text: 《以斯拉记》1:9的希伯来文平行记载在此列出的器物和数目不同；《以斯德拉一书》似乎保存了一份经过重排或扩充的希腊文清单，并非希伯来文逐字对应的文本。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: 这些器皿的数目如下
  rationale: 按现代汉语自然表达清单的引介语；补出“器皿”承接下文所列物件，并保留原文计数公式的意思。
- source_word: σπονδεῖα
  choice: 奠酒碗
  rationale: 该词与奠酒、浇奠有关；译作“奠酒碗”既显明礼仪用途，也比泛称“碗”更准确。
- source_word: χρυσᾶ / ἀργυρᾶ
  choice: 金 / 银
  rationale: 以现代汉语常用的材料定语表达器物由金或银制成。
- source_word: θυίσκαι ἀργυραῖ
  choice: 银香炉
  rationale: θυίσκη指与焚香或祭祀有关的器具；在圣殿器物清单中，“香炉”清楚、自然，同时不作过度细化。
- source_word: φιάλαι
  choice: 碗
  rationale: φιάλη通常指较宽浅的器皿；“碗”通俗而符合清单语境，避免使用古奥音译。
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: 银碗二百一十只
  rationale: 依所提供的希腊文校勘呈现及审校层将数目译为二百一十；因数字传抄形式不够清楚，以脚注说明不确定性。
- source_word: ἄλλα σκεύη
  choice: 其他器皿
  rationale: σκεύη在圣殿财物清单中泛指各种器具或容器；“器皿”准确且文体庄重。
theological_decisions: []
