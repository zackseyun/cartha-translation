base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/014.yaml
  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: zh_hans
  text: 这物件[b]由设巴萨[a]和那些从被掳之地归回的人一起，从巴比伦带到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“萨玛纳撒尔”；这里根据希伯来文对应经文及以斯拉记的相关语境译作“设巴萨”，两者指同一位官员。
    reason: alternative_reading
  - marker: b
    text: 希腊文没有在本句重述主语；单数动词表明所带上去的是单数事物，可能是上文提到的一件圣殿器物或物品。
    reason: cross_reference
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: 带上
  rationale: 这是ἀναφέρω的不定过去时被动语态；“带上”既保留被动事件的含义，也自然体现前往耶路撒冷常用的“上去”方向观念。中文采用“由……带上”的被动结构。
- source_word: ὑπὸ Σαμανασσάρου
  choice: 由设巴萨
  rationale: 希腊文作Σαμανασσάρος（可音译为“萨玛纳撒尔”），但以斯拉记对应语境表明所指是设巴萨；正文采用现代中文圣经读者较熟悉的名称，脚注保留希腊文形式。
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: 和那些被掳归回的人一起
  rationale: ἅμα加与格表示“与……一起”；“被掳归回的人”以自然中文表达从被掳之地出来的人，未把他们笼统改称为另一特定群体。
- source_word: ἐκ Βαβυλῶνος
  choice: 从巴比伦
  rationale: 直接表达出发地。
- source_word: εἰς Ἱερουσαλήμ
  choice: 上耶路撒冷
  rationale: εἰς表达目的地；与ἀνηνέχθη合译为“带上耶路撒冷”，保留前往耶路撒冷为“上去”的经文习语，同时符合现代汉语。
theological_decisions:
- issue: Σαμανασσάρου与以斯拉记对应人物名称的认定
  choice: 正文译作“设巴萨”
  alternative: 按希腊文形式音译作“萨玛纳撒尔”
  rationale: 这属于文本与专名对应问题，并非教义判断。希腊文形式与以斯拉记语境中的设巴萨指向同一人物；正文使用通行名称便于辨认，脚注则透明呈现希腊文读法。
- issue: ἀνηνέχθη的单数隐含主语
  choice: 以“这物件”补明，并加脚注说明
  alternative: 不补主语，译作“又由……带上去”
  rationale: 希腊文动词为单数，主语须由上文补出，可能指前文的一件器物或物品。现代汉语若完全省略主语容易含混，因此以概括性的“这物件”补明，但不进一步断定具体为何物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被掳归回的人”保留流亡与归回的背景；“带上耶路撒冷”保留原文的方向色彩。正文中的[a]、[b]均与脚注对应。
