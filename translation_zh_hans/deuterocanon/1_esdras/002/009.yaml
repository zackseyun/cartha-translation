base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: zh_hans
  text: 居鲁士王取出了属于主的圣器皿；这些器皿是尼布甲尼撒从耶路撒冷运走，安放在他自己的偶像庙里的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“偶像庙”也可理解为“偶像祠”；希伯来文平行经文作“他神的殿”。
    reason: 说明希腊词的可能译法，并保留希腊文本与希伯来文平行经文之间的措辞差异。
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: 取了出来
  rationale: 表示从存放或保管之处取出；“取了出来”符合叙事语境，也自然体现动词的方向性。
- source_word: τὰ ἅγια σκεύη
  choice: 圣器皿
  rationale: σκεύη可指器具或器皿，ἅγια表明其礼仪上的神圣性质；“圣器皿”简洁且符合圣殿语境。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 按希腊文本将κύριος译作“主”；属格在此表示这些器皿属于主。
- source_word: μετήγαγεν
  choice: 运走
  rationale: 该动词表示把事物从一地转移到另一地；在征服耶路撒冷的背景中，“运走”自然表达被迁移的含义。
- source_word: ἀπηρείσατο
  choice: 安放
  rationale: 此处指把掳来的器皿放置在宗教场所中；“安放”既能表达正式放置，也不过度推断其储藏方式。
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: 在自己的偶像庙里
  rationale: 以希腊文为首要依据，保留εἰδώλιον所带的“偶像庙、偶像祠”色彩；αὐτοῦ在本句中自然指尼布甲尼撒。希伯来文平行经文较中性，另在脚注注明。
theological_decisions:
- issue: 次经圣殿语境中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 首要底本是希腊文，其用词为κύριος而非希伯来神名；译作“主”既忠于希腊文本，也避免把平行经文的形式直接代入正文。
- issue: εἰδώλιον与希伯来文平行经文之间的差异
  choice: 正文译作“偶像庙”
  alternative: 他神的殿
  rationale: 希腊文措辞比希伯来文平行经文“他神的殿”更鲜明。正文依从希腊文，同时用脚注保留平行传统，避免消除文本间真实存在的语气差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“居鲁士”“尼布甲尼撒”“耶路撒冷”沿用现代中文圣经中通行的专名形式；用分号清楚连接取出器皿与其先前被掳走、安放的背景。
