  rationale: 修订仅澄清两个中文表达：以“属于主的”明确器皿的领属关系，并使“他自己的”紧随“尼布甲尼撒”，从而使其回指与原文关系从句一致。正文保留“偶像庙”，脚注继续呈现希腊文词义范围及希伯来文平行传统。
