base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: zh_hans
  text: 现在，愿我主我王知悉：那些从你那里上到我们这里来的犹大人[a]，已经到了耶路撒冷，住在那座叛逆而邪恶的城里；他们正在修整城中的集市[b]和城墙，并为一座圣殿奠基[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太人”。希腊语Ἰουδαῖοι既可按地域、族群指“犹大人”，也可较广泛地指“犹太人”。
    reason: lexical_alternative
  - marker: b
    text: “集市”也可译作“公共广场”。以斯拉记的某些平行传统着重说修建城本身，并不特指市场区域。
    reason: alternative_reading
  - marker: c
    text: 或译“正在着手建造圣殿”或“正在重建圣殿”。希腊语短语较为压缩，可能指开始圣殿工程，尤其是铺设其基础或下部结构；这里的“一座圣殿”在上下文中指耶路撒冷的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: 愿……知悉
  rationale: 这是公文书信中正式的告知套语；“愿……知悉”既保留祈使式语气，也符合中文臣下上奏的庄重表达。
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: 我主我王
  rationale: κύριος在此是对人间君王的敬称，并非神圣称号；“我主我王”保留原文的宫廷尊称和臣属语气。
- source_word: Ἰουδαῖοι
  choice: 犹大人
  rationale: 波斯时期的语境首先具有地域和族群含义，指犹大地区及其人民；“犹大人”较能保留这一历史色彩，同时脚注注明“犹太人”这一可行译法。
- source_word: ἀναβάντες παρ' ὑμῶν πρὸς ἡμᾶς
  choice: 从你那里上到我们这里来
  rationale: 保留ἀναβαίνω“上去、上来”的方向意味，通常与前往耶路撒冷有关；παρ’ ὑμῶν πρὸς ἡμᾶς直译为“从你那里……到我们这里”。
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηρὰν
  choice: 那座叛逆而邪恶的城
  rationale: ἀποστάτις在这封政治控诉中指反叛，而非特指宗教上的背道；πονηρά保留控告者带有敌意的道德评价。
- source_word: οἰκοῦσιν
  choice: 住在
  rationale: 自然表达持续居住、定居的现在时意义。
- source_word: ἀγοράς
  choice: 集市
  rationale: ἀγορά通常指市场或公共广场；正文采用简洁的“集市”，并在脚注保留“公共广场”的语义范围及平行传统的差异。
- source_word: θεραπεύουσιν
  choice: 正在修整
  rationale: 该词可指照料、整治或修复；与集市和城墙连用时，“修整”表达实际修缮工程，又不武断地扩大为彻底重建。
- source_word: ναὸν ὑποβάλλονται
  choice: 为一座圣殿奠基
  rationale: 这一压缩的建筑用语可能指着手建殿，尤其是铺设基础或下部结构；正文保留“一座”以反映ναόν无冠词的形式，脚注说明语义和语境。
theological_decisions:
- issue: κύριος在此应译为人间君王的敬称，还是神的称号
  choice: 我主我王
  alternative: 主王；主——王
  rationale: 上下文明确是臣下向君王呈文。将κύριος译作宫廷敬称，可避免让读者误以为这里称君王具有神性。
- issue: ναὸν ὑποβάλλονται是否明确指重建耶路撒冷圣殿
  choice: 为一座圣殿奠基，并以脚注保留语义弹性
  alternative: 正在重建圣殿；正在着手建造圣殿
  rationale: 原文短语含义较为压缩，无冠词ναόν在上下文中显然涉及耶路撒冷圣殿工程，但不宜仅凭语境抹去形式和动作范围上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的公文陈述语体。“愿我主我王知悉”体现臣下向君王呈文的礼貌和正式感；后半句用自然的现代汉语叙述正在进行的修建行动。正文不替控告者背书，而是保留其“叛逆而邪恶”的敌对措辞。
