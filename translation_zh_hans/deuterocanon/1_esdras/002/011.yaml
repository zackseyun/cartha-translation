base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: zh_hans
  text: 这些物件借着他转交给了犹太地[b]的长官撒拿玛撒尔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒拿玛撒尔”是希腊文中的姓名形式；希伯来语平行经文（以斯拉记1:8）称此人为“设巴萨”。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“犹太地”；希伯来语平行经文作“犹大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: 经由他
  rationale: 此短语直译为“借着这人”，在上下文中表示转交所经由的中介或经办人；“经由他”自然地保留了工具、代理意味，也与希伯来语平行经文“经……的手”相呼应。δέ在这里主要起承接作用，汉语无须机械译出。
- source_word: παρεδόθησαν
  choice: 这些物件……转交给了
  rationale: παραδίδωμι的被动式表示被交付、转交。根据上文，主语是圣殿器皿；汉语补出“这些物件”以清楚承接语境，并用“转交”体现保管权或经手权的移交。
- source_word: Σαναμασσάρῳ
  choice: 撒拿玛撒
  rationale: 按希腊文Σαναμασσάρ音译，不以希伯来平行经文中的“设巴萨”取代主要希腊文本的姓名形式；两者关系在脚注说明。
- source_word: προστάτῃ
  choice: 长官
  rationale: 该词可指居首位者、领袖、保护者或官员。此处是行政语境，但希腊词本身未精确指定现代官阶；“长官”既表达其官方领导身份，又避免把“总督”等更具体职衔强加给原文。
- source_word: τῆς Ἰουδαίας
  choice: 犹太地的
  rationale: 按希腊文Ἰουδαία译为“犹太地”，指该地区；希伯来语平行经文作“犹大”，其差异收入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“这些物件”承接上文所说的器皿；“长官”保留προστάτης较宽泛的行政含义。所有脚注标记均置于正文相关词语之后。
