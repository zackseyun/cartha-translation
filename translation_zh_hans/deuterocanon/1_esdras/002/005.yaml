base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: zh_hans
  text: 所以，若你们中有人是他子民的一员，愿他的主与他同在；让他上到犹太地的耶路撒冷去，让他们[a]建造以色列之主的殿。他就是那位曾住在耶路撒冷的主。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文前面用单数（“有人……他”），到“建造”却转为复数。译文保留了这一转换。
    reason: textual_variant
  - marker: b
    text: “曾住在”也可译作“设立居所”。这里的希腊语带有住下或设立居所的意味。
    reason: lexical_alternative
  - marker: c
    text: 希伯来平行文本在本节内容显著不同，讲的是当地人用金银、财物、牲畜，并连同甘心献的礼物，资助仍留在当地的人；《以斯德拉一书》此处遵循的是不同的希腊文本传统。
    reason: alternative_reading
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν
  choice: 所以，你们中若有人
  rationale: 以“所以”表达 οὖν 的承接和推论意味；其余按现代汉语自然表达。
- source_word: ἐκ τοῦ ἔθνους αὐτοῦ
  choice: 属于他的子民
  rationale: ἔθνος 在归回的语境中指所属的族群或人民；“子民”比现代政治意义上的“国家”更贴切。
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: 愿他的主与他同在
  rationale: 保留 αὐτοῦ 的“他的”，不从平行传统增添“神”；“愿……同在”传达 ἔστω 的祈愿语气。
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: 上到犹太地的耶路撒冷去
  rationale: 保留 ἀναβαίνω 前往耶路撒冷时“上去”的传统空间表达，并将分词顺畅地译入劝令句。
- source_word: οἰκοδομείτωσαν
  choice: 让他们建造
  rationale: 原文为第三人称复数命令式；即使前文是单数，也保留这一数的转换，不擅自整齐化。
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: 以色列之主的殿
  rationale: 原文没有 θεός，不增译“神”；“以色列之主的殿”在忠实保留修饰关系的同时较合乎现代汉语。
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: 他就是那位在耶路撒冷安居的主
  rationale: κατασκηνόω 含住下、安营或设立居所之意；“安居”保留居住意象而不把它弱化为单纯的“在”。
theological_decisions:
- issue: 神圣称谓 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文本使用 κύριος，故译作“主”；不凭希伯来平行传统把它改写成专名。
- issue: 是否按《以斯拉记》的希伯来平行文本协调本节
  choice: 保留希腊文本关于上耶路撒冷、建殿及主在当地安居的表述
  alternative: 改译为当地人用金银、财物、牲畜和甘心祭支持余民
  rationale: 希伯来平行文本在此差异显著；本译文以《以斯德拉一书》的希腊文本为首要依据，不把另一传统的内容混入正文。
- issue: 前后单复数不一致
  choice: 保留“有人／他”转为“他们建造”
  alternative: 统一译成“让他……建造”
  rationale: 原文确由单数结构转为复数命令式。保留张力，并用脚注提示，避免默默修正传本文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“殿”符合耶路撒冷圣殿语境；“上到”保留前往耶路撒冷的传统方向表达。正文避免古奥句法，同时刻意保留原文单数转复数的异常。
