  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: zh_hans
  text: 波斯人之王居鲁士如此说：“以色列的主[a]、至高的主，已立我为天下之王，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》1:2的希伯来文平行经文作“耶和华，天上的上帝”，而不是“以色列的主、至高的主”。本节正文依照《以斯拉一书》的希腊文本。
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 保留正式诏告的引语格式，同时符合现代汉语习惯。
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: 波斯人的王居鲁士
  rationale: 依从希腊文复数属格 Περσῶν，指波斯民族，而非直接改作“波斯王”；语序略作汉语化。
- source_word: Ἐμὲ ἀνέδειξεν βασιλέα
  choice: 已经立我作……王
  rationale: ἀναδείκνυμι 在此表示选立、任立为王；“立我作王”兼具正式感与自然度。
- source_word: τῆς οἰκουμένης
  choice: 天下
  rationale: οἰκουμένη 指有人居住的世界或帝国视野下的全世界；“天下”自然、凝练，并保留广泛统治范围的宣称。
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: 以色列的主
  rationale: 严格保留希腊文“以色列的主”，不以希伯来平行经文的“天上的上帝”取代。
- source_word: Κύριος ὁ ὕψιστος
  choice: 至高的主
  rationale: 将 κύριος 与 ὕψιστος 均明确译出，并按同位称号理解，与前一神圣称号并列。
theological_decisions:
- issue: 希腊文《以斯拉一书》与《以斯拉记》1:2希伯来文平行经文的神圣称号不同
  choice: 以色列的主，至高的主
  alternative: 耶和华天上的上帝
  rationale: 本节以希腊文为主要翻译依据，正文保留其独特称号；脚注说明希伯来平行经文的异文，以免消除文本见证之间的差异。
translation_notes:
  register: 采用现代、庄重的诏告语体。“波斯人的王”有意反映希腊文的复数民族名称；“天下”表达 οἰκουμένη 的广阔范围。本句在所给原文末尾尚未完结，因此保留逗号。
