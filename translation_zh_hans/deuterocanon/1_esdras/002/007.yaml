base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: zh_hans
  text: 于是，犹大和便雅悯支派各宗族的首领、祭司和利未人，以及所有心灵受主感动的人，都起来上耶路撒冷，建造主的殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》1:5的希伯来文平行经文作“所有心灵受神感动的人”；《以斯得拉一书》此处的希腊文作“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες
  choice: 起来
  rationale: 传世希腊文此词在语境中较为拗口；希伯来文平行经文作“起来”。结合后续表示行动和目的的不定式，译作“起来”最合语境，也避免误解为“被任命”。
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  choice: 各宗族的首领
  rationale: 指以祖系为纽带的扩展家族单位之领袖。“宗族”在现代汉语中既自然，也能保留其亲族组织含义。
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: 犹大和便雅悯支派
  rationale: 希腊文表达紧缩，数上也略显含混；按所指对象及希伯来文平行经文，以两个支派来理解，同时在汉语中明确保留“支派”。
- source_word: ἤγειρεν ... τὸ πνεῦμα
  choice: 心灵受……感动
  rationale: 这是神激发人内在意愿的圣经惯用语。译作“心灵受……感动”自然易懂，并保留内在推动之意。
- source_word: Κύριος
  choice: 主
  rationale: 遵从希腊文主要见证 Κύριος。希伯来文平行经文在此作“神”，其差异收入脚注。
- source_word: ἀναβῆναι
  choice: 上耶路撒冷
  rationale: 保留前往耶路撒冷常用的“上去”观念；在汉语中直接说“上耶路撒冷”简洁自然。
- source_word: οἰκοδομῆσαι οἶκον
  choice: 建造……殿
  rationale: 希腊文只说“建造”而未明说“重建”，故不增添“重”。此处 οἶκος 指耶路撒冷的圣殿，译作“殿”比普通的“房屋”更准确。
- source_word: τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: 建造主的殿
  rationale: 将该短语理解为位于耶路撒冷、属于主的殿；地点信息与 ἀναβῆναι 合并译为“上耶路撒冷”，使现代汉语流畅而不损失信息。
theological_decisions:
- issue: 本句神圣称谓在希腊文主要见证与希伯来文平行经文之间不同
  choice: 心灵受主感动
  alternative: 心灵受神感动
  rationale: 《以斯得拉一书》以希腊文为主要翻译依据，原文作 Κύριος，故正文译“主”；《以斯拉记》1:5 的希伯来文平行经文作“神”，以脚注保存这一异文。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“各宗族的首领”兼顾古代亲族结构与现代可读性；句序略作汉语化处理，把地点“耶路撒冷”与“上”连用，同时完整保留人物范围、神的感动、行动及建殿目的。
