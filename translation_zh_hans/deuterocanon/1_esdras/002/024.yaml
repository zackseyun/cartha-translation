base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: zh_hans
  text: 所以，现在我已下令，制止那些人建造这城[a]；也要谨慎，不可再有任何超出这些事项的事发生[b]，并且不可让这恶事进一步发展，以致侵扰众王[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可译作“重建这城”；希腊文直译为“建造这城”。
    reason: lexical_alternative
  - marker: b
    text: “超出这些事项”也可译作“违反这些规定”。希腊语措辞可表达超出所述事项的范围，也可表达违背相关规定。
    reason: lexical_alternative
  - marker: c
    text: “侵扰众王”也可译作“危害众王”或“给众王造成麻烦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν ἐπέταξα
  choice: 所以现在我已下令
  rationale: 保留推论连接词和君王命令的公文语气；用“已下令”表达已经作出的有效命令。
- source_word: ἀποκωλῦσαι τοὺς ἀνθρώπους ἐκείνους
  choice: 制止那些人
  rationale: ἀποκωλύω表示阻止、禁止某人继续行动；“那些人”自然对应特指的群体，且不额外限定性别。
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: 建造这城
  rationale: 希腊文只说“建造这城”，没有明说“重建”；上下文可能指重建，故在脚注说明。
- source_word: προνοηθῆναι
  choice: 要谨慎防范，确保
  rationale: 该被动不定式表达采取预防措施、留意使某事不发生；此译法兼顾行政语气与现代汉语清晰度。
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: 确保不发生任何越过此令的事
  rationale: παρὰ ταῦτα可表示越过、超出这些规定，也可能表示违反这些规定；正文采用前一层意思，并以脚注保留另一可能。
- source_word: τὰ τῆς κακίας
  choice: 这恶事
  rationale: 该习语指眼下有害或邪恶的事态；“这恶事”在中文中简洁自然，并保持其具体事态感。
- source_word: μὴ προβῇ ἐπὶ πλεῖον
  choice: 免得……进一步发展
  rationale: 该短语表示继续推进或扩大；“进一步发展”贴合事态升级的语境。
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: 危害众王
  rationale: ἐνοχλέω可指打扰、侵扰或造成损害；在王室行政语境中，“危害”体现其政治后果，脚注保留较直译的选择。
