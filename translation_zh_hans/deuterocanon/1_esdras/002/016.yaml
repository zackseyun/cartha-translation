revisions:
- from: “致我们的主亚达薛西王：你的臣仆拉提摩斯和撒美利乌斯[a]——前者主管呈报的事务[b]，后者是书记——以及他们议会中其余的人和住在谷叙利亚[c]、腓尼基的人。”
  to: “呈给我们的主亚达薛西王：你的臣仆，拉提摩斯——负责处理呈报事务的官员——和书记撒美利乌斯，以及他们议会中其余的人，并科埃勒叙利亚和腓尼基的人。”
  rationale: 将固定历史地名改为现代汉语较通行的“科埃勒叙利亚”，并保留其字面含义于脚注。微调不确定行政职衔的表述，使其既自然又不越过原文证据；重整同位语标点，清楚对应拉提摩斯的职衔和撒美利乌斯的“书记”职衔。脚注锚点应分别置于“撒美利乌斯[a]”“呈报事务的官员[b]”和“科埃勒叙利亚[c]”之后。
