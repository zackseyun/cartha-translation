  register: 采用庄重而清楚的公函语体。“臣仆”体现对君王的礼敬；用破折号交代两人的不同职衔，以消除中文串读时的歧义。保留原文作为书信题头、尚未构成完整陈述的特点，同时以引号标示所引公函内容。
