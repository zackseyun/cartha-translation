    rationale: 该短语字面指“那些被呈到面前的事”；其实际行政职称不确定。用“负责处理呈报事务的官员”较自然，仍保留其职务性质，并由脚注交代不确定性。
  - severity: low
    issue: 以“前者……后者……”展开职衔，略增加原文没有的对举性解释。
    rationale: 两项职衔可用同位语和分号清楚标示，无须显性引入“前者／后者”。
