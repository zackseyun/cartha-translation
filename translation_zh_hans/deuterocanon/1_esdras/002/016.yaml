base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: zh_hans
  text: “呈给我们的主亚达薛西王：你的臣仆，拉提摩斯——负责处理呈报事务的官员——和书记撒美利乌斯，以及他们议会中其余的人，并科埃勒叙利亚和腓尼基的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: 致我们的主亚达薛西王
  rationale: 与格结构是书信开头的收信人称谓；κυρίῳ在此是对君王的尊称。“我们的”虽未明说，却由后文“你的臣仆”及近东书信语境自然引出。
- source_word: οἱ παῖδές σου
  choice: 你的臣仆
  rationale: παῖς虽也可指孩子或奴仆，但在致君王的公函中表示隶属其下、为其效力的人；“臣仆”既体现礼敬和从属关系，也不武断强调奴隶身份。
- source_word: Ῥάθυμος
  choice: 拉提摩斯
  rationale: 以《以斯德拉一书》的希腊文本为首要依据，按希腊名字形式音译；马所拉文本平行记载中的“利宏”置于脚注说明。
- source_word: ὁ τὰ προσπίπτοντα
  choice: 主管呈报的事务
  rationale: 原文近于“负责那些被呈到面前之事的人”，是含义不完全确定的行政称号。此译比笼统的“档案官”更贴近措辞，同时在中文中尚属自然。
- source_word: Σαμέλλιος
  choice: 撒美利乌斯
  rationale: 依希腊文本的名字形式音译；马所拉文本平行记载中的“伸帅”作为对应名字保留在脚注。
- source_word: ὁ γραμματεὺς
  choice: 书记
  rationale: γραμματεύς在行政语境中可指书记或秘书；“书记”保留其与书写、公文职务的直接联系。
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: 他们议会中其余的人
  rationale: βουλή指议事或咨询机构；这样翻译明确表达“其余成员”的集合意义，也保留αὐτῶν的所属关系。
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: 住在谷叙利亚、腓尼基的人
  rationale: κοίλη Συρία是历史地区名Coele-Syria；“谷叙利亚”传达名称本义，并以脚注说明其历史地名性质，避免将它泛化为整个叙利亚。
