base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: zh_hans
  text: 守门人守在各门口；谁也不能离开自己当值的职守，因为他们的弟兄，就是利未人，已经替他们预备好了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“利未人已经为自己预备好了”。这里也可能是指利未人替守门人预备好所需之物，使他们可以留在各自的岗位上。
    reason: 保留反身代词ἑαυτοῖς的字面读法及其语境性解释。
lexical_decisions:
- source_word: θυρωροὶ
  choice: 守门人
  rationale: 指看守门或门户的人；在圣殿服事的语境中，“守门人”自然、明确。
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: 守在各门口
  rationale: 表达守门人分别驻守各门的分配含义；补出“守在”使现代汉语完整顺畅。
- source_word: οὐκ ἔστιν παραβῆναι
  choice: 不可离开
  rationale: παραβαίνω本义可指走开、越出；此处结合当班服事，意为不可擅离职守。
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: 谁也不可离开自己当班的职守
  rationale: ἐφημερία指按次序安排的当值或班次；“当班的职守”兼顾制度性和现代可读性。
- source_word: οἱ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: 他们的弟兄利未人
  rationale: 保留“弟兄”的群体亲属称谓，并把同位语“利未人”自然地接在其后。
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: 已经替他们预备好了
  rationale: 希腊文代词形式上是反身的“为自己”，但句意很可能是利未人替守门人完成所需预备，使其不必离岗；正文采用语境所指，脚注保留字面歧义。
theological_decisions:
- issue: ἡτοίμασαν ἑαυτοῖς中反身代词的所指
  choice: 正文理解为利未人替守门人预备
  alternative: 利未人为自己预备
  rationale: 严格按反身形式可译“为自己”，但这不能清楚说明守门人为何不必离开岗位。上下文更自然地表明利未人代他们办理预备工作；因原文形式确有张力，脚注明示字面读法，不将歧义隐藏。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“当班的职守”既体现轮值服事，也避免“班次”等词显得过于行政化；分号保留原句前后解释关系。
