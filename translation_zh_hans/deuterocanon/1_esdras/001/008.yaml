base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: zh_hans
  text: 这些是照着所作的承诺[b]，从王室财物中给百姓、祭司和利未人的。圣所的主管赫尔基亚、撒迦利亚和埃叙埃洛斯[a]又给祭司二千六百只羊[c]，供逾越节使用，另有三百头牛犊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文《历代志下》35:8中的相应名字通常译作“希勒家……耶歇”；本节希腊文作“赫尔基亚……埃叙埃洛斯”。
    reason: alternative_reading
  - marker: b
    text: 或译“按照承诺”。希腊文没有说明是谁作出这项承诺。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文平行经文具体提到绵羊、羊羔和山羊羔；本节希腊文使用含义较宽的“羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些
  rationale: 承接上文所提到的牲畜或物资；不增补希腊文没有明说的“祭物”。
- source_word: ἐκ τῶν βασιλικῶν
  choice: 从王室财物中
  rationale: 指属于君王或王室的财产；既贴近希腊文，也与希伯来文平行经文“王的财产”相符。
- source_word: ἐδόθη
  choice: 赐给
  rationale: 保留被给予、拨给受益者的含义；在君王供应的语境中，“赐给”自然庄重。
- source_word: κατʼ ἐπαγγελίαν
  choice: 照着所许的
  rationale: 保留“按照承诺”的名词性观念，同时不擅自指明是谁作出承诺。
- source_word: τῷ λαῷ καὶ τοῖς ἱερεῦσιν καὶ Λευίταις
  choice: 给百姓、祭司和利未人
  rationale: 按与格受领者直译，并采用现代中文圣经中通行的群体名称。
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: 圣所的主管
  rationale: ἐπιστάται 指受命管理、监督的人；ἱερόν 在此译为“圣所”，保留其神圣场所的意味。
- source_word: εἰς πάσχα
  choice: 供逾越节使用
  rationale: 表达牲畜为逾越节而供应的目的，而不额外断定其具体礼仪用途。
- source_word: πρόβατα
  choice: 羊
  rationale: 希腊词在此概括指小型羊畜；正文不把希伯来文平行经文更具体的分类直接并入。
- source_word: δισχίλια ἐξακόσια
  choice: 二千六百
  rationale: 直接翻译数目。
- source_word: μόσχους
  choice: 牛犊
  rationale: μόσχος 指幼牛；“牛犊”比笼统的“牛”更贴近原词，也不限定为公牛。
- source_word: τριακοσίους
  choice: 三百
  rationale: 直接翻译数目。
