base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/050.yaml
  text: These men killed their young men with the sword around the holy temple[a], and they showed no mercy to young man or virgin, old man or youth[b],
translation:
  language: zh_hans
  text: 这些人用刀在圣殿四周杀死了他们的年轻男子；无论年轻男子、少女、老人还是较年轻的人，他们一个也不饶恕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所附的希伯来文平行经文只是近似对应，措辞和内容均不同；这里的希腊文明确说，他们在圣殿四周杀人。
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 指回上文所说的入侵者；补出“人”使现代汉语所指清楚，不增加新的内容。
- source_word: ἀπέκτειναν
  choice: 杀死了
  rationale: 直接表达叙事中的杀戮行为，比古雅或委婉的说法更自然。
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: 他们的青年
  rationale: 保留αὐτῶν的领属关系，并以“青年”表达νεανίσκους所指的年轻男子；汉语在此可由语境体现男性复数。
- source_word: ἐν ῥομφαίᾳ
  choice: 用刀
  rationale: 表达工具格意义；ῥομφαία在此是杀戮所用的刀剑，现代汉语“用刀”简洁自然。
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  choice: 就在圣殿四周
  rationale: περικύκλῳ表示环绕周围，ἱερόν指圣殿或其院区；“就在”使地点关系清楚，却不把杀戮错误地限定为殿内。
- source_word: οὐκ ἐφείσαντο
  choice: 一个也不饶恕
  rationale: 准确传达“不放过、不加以保全”的含义；与后面的分类列举自然衔接。
- source_word: νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου
  choice: 无论青年、少女、老人还是年幼的
  rationale: 按年龄与性别类别保留列举。παρθένος本义可为“处女”，但在屠杀对象的社会分类中，“少女”较自然；νεώτερος是比较级实体化用法，译为“年幼的”以保留其相对、较宽泛的意义。
theological_decisions:
- issue: 希腊文本与所附马所拉文本平行经文内容不同
  choice: 直接翻译希腊文所述圣殿四周的杀戮
  alternative: 按所附希伯来文改写为首领和百姓犯罪并玷污耶和华的殿
  rationale: 本条目的首要文本依据是希腊文；所附希伯来文仅为近似平行材料，内容属于不同语境，不能用来取代本节明确的杀戮叙述。
- issue: παρθένος的表达
  choice: 少女
  alternative: 处女
  rationale: 这里列举遭杀害的人群类别，并非讨论贞洁或任何教义性称号；“少女”在现代汉语中更自然，同时仍保留年轻女性这一明确所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号划分杀戮地点与“不饶恕任何人”的概括；避免古雅的“少男、处女、长老”等可能造成文体或身份误解的词。所有脚注标记均已置于正文。
