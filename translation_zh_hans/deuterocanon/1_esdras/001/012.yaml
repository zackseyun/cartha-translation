base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: zh_hans
  text: 此后，他们为自己，也为祭司——他们的弟兄，即亚伦的子孙——预备好了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志下》35:10的希伯来文平行经文在此差异很大，记述祭司各站其位、利未人各按班次；本节按《以斯拉一书》的希腊文本翻译，记述他们为自己和祭司预备。
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: 此后
  rationale: 自然、简洁地表达时间承接关系，符合现代汉语叙事习惯。
- source_word: ἡτοίμασαν
  choice: 预备好了
  rationale: 保留动词“预备、备妥”的及物含义；宾语可由上下文补足，避免擅自增添“祭肉”或“份”。
- source_word: ἑαυτοῖς
  choice: 为自己
  rationale: 直接表达反身与格所指的受益者。
- source_word: τε καὶ
  choice: 也为
  rationale: 清楚连接两个受益对象，即他们自己和祭司，同时符合汉语表达。
- source_word: τοῖς ἱερεῦσιν
  choice: 作祭司的
  rationale: 与后面的“弟兄”连读，使三个同格成分在汉语中关系清晰，又不加入原文没有的关系从句。
- source_word: ἀδελφοῖς αὐτῶν
  choice: 弟兄
  rationale: 保留希腊文明确的男性亲属或同族称谓；“他们的”在汉语主语明确时可自然省略，以免句子拗口。
- source_word: υἱοῖς Ἀαρών
  choice: 亚伦的子孙
  rationale: 这里指亚伦后裔的祭司群体；“子孙”在现代汉语中比“儿子们”更准确地传达世系身份。
theological_decisions:
- issue: “弟兄”与“亚伦的子孙”的句法关系
  choice: 译作“作祭司的弟兄，就是亚伦的子孙”
  alternative: “祭司、他们的弟兄、亚伦的子孙”
  rationale: 希腊文将“祭司”“他们的弟兄”“亚伦的子孙”连续并列为同格说明。正文用“就是”明确自然的汉语同格关系，但不把“弟兄”解释成另一群人。
- issue: 是否依据《历代志下》35:10的希伯来文平行经文改写
  choice: 以《以斯拉一书》的希腊文为准，保留“为自己和祭司预备”的表述
  alternative: 按希伯来文平行经文译为祭司和利未人各站其位、各按班次
  rationale: 所给希伯来文平行段落与本节希腊文差异显著；它只能用于参照，不能取代本节的主要希腊文本证据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“预备好了”保留原文未明说宾语的表达；“就是”帮助普通读者辨明同格关系。
