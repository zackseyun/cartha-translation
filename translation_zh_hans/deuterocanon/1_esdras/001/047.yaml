base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: zh_hans
  text: 民众和祭司中的领袖也多行不敬与不法之事，所行的比列国一切的污秽更甚[a]；他们还玷污了主的圣所[b]，就是那在耶路撒冷被分别为圣的圣所[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比列国一切的污秽更甚”也可译作“甚至超过列国一切的污秽”。希腊文的比较结构表达超越、过甚之意；“污秽”也可译作“不洁”或“污秽之事”。
    reason: 保留ὑπέρ的比较、超越含义以及ἀκαθαρσίαι在礼仪和道德语境中的词义范围。
  - marker: b
    text: “圣所”也可译作“圣殿”；希腊词ἱερόν可指圣殿，也可较广地指圣殿区域。
    reason: 说明该建筑与神圣空间术语的语义范围。
  - marker: c
    text: 原文直译为“主的圣所，那在耶路撒冷被分别为圣的”。这里的分词说明该圣所受祝圣的性质，也可理解为“那已经在耶路撒冷被分别为圣的圣所”。
    reason: 保留τὸ ἁγιαζόμενον的分词结构及其时态解释空间。
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: 领袖
  rationale: 该词指带领或治理的人；“领袖”是现代汉语中自然、庄重而又不过度限定正式官职的表达。
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: 民众和祭司中的
  rationale: 保留两个群体都受牵连的意思，同时用“……中的领袖”使汉语关系清楚。
- source_word: πολλὰ ἠσέβησαν καὶ ἠνόμησαν
  choice: 多行不敬与不法之事
  rationale: “多行”体现 πολλά 所表达的多次、多方面；“不敬”保留 ἀσεβέω 对上帝与神圣之事不虔敬的宗教意味，“不法”对应违背律法的行为。
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: 甚至超过列国一切的污秽
  rationale: ὑπέρ 在此表达超越、过甚；“污秽”兼具礼仪和道德色彩，“列国”适合本节的历史语境。
- source_word: ἐμίαναν
  choice: 玷污了
  rationale: 准确传达 μιαίνω 在圣殿礼仪语境中使圣物或圣地不洁、受污染的含义。
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: 主的圣所
  rationale: ἱερόν 可指圣所或较广义的圣殿范围；“圣所”突出此处神圣空间遭玷污的语境，κύριος 译为“主”。
- source_word: τὸ ἁγιαζόμενον
  choice: 就是那……被分别为圣的地方
  rationale: 保留现在被动分词对圣所的补充说明及被动意义；“分别为圣”准确表达 ἁγιάζω 的奉献、使之归圣之义。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 按其地点用法直译，并采用通行地名。
theological_decisions:
- issue: κύριος 在以色列圣所语境中的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊原文写 κύριος；译作“主”既忠于现存希腊文本，也避免未经原文直接改换为某一希伯来神名形式。
- issue: ἀκαθαρσίαι 的礼仪与道德双重色彩
  choice: 污秽
  alternative: 不洁；污秽之事
  rationale: “污秽”能与后文“玷污圣所”形成词义呼应，同时不把该词仅限于礼仪不洁或仅限于道德败坏。
- issue: τὸ ἁγιαζόμενον 的时态及功能
  choice: 那……被分别为圣的地方
  alternative: 那正在被分别为圣的地方；那已经被分别为圣的地方
  rationale: 希腊语现在被动分词可刻画圣所作为受祝圣之地的性质，未必强调动作正在进行；正文不强加明确的完成或进行时态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“多行不敬与不法之事”保留原文成对的宗教与律法控诉；分号呈现前后罪行的递进关系。所有脚注标记均置于正文相应词句之后。
