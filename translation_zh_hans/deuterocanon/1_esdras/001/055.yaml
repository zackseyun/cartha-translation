base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: zh_hans
  text: 直到这地享足了自己的安息[a]；在它荒凉的整个时期，它都守安息，为要补足七十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“直到这地以自己的安息为喜悦。”原文把土地拟人化；“安息”在此土地荒凉的语境中可关联土地应有的安息期。
    reason: 说明εὐδοκέω的较直译表达，并说明“安息”保留原文用语而不在主文中具体限定为“安息年”。
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: 直到……享足了
  rationale: ἕως加冠词不定式表示延续至某一目标；εὐδοκέω本义为“喜悦、满意”，这里把土地拟人化。“享足”既保留享受、满足之意，也自然表达土地补享先前未得的安息。
- source_word: τὴν γῆν
  choice: 这地
  rationale: 语境所指是犹大之地，而非全世界；“这地”也符合中文叙事中承接前文的表达。
- source_word: τὰ σάββατα αὐτῆς
  choice: 它的安息年
  rationale: 复数σάββατα用于土地时指土地应得的安息期，背景是安息年的规定。“安息年”比“安息日”更能准确传达土地休耕的语境，同时保留安息这一关键词。
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: 在它荒凉的整个时期
  rationale: 完整表达土地处于荒废状态的全部时段，并保留原文庄重的语气。
- source_word: σαββατιεῖ
  choice: 它都守安息
  rationale: 该动词与σάββατα同根，特指安息而非一般休息；“守安息”保留原文有意重复的安息词汇和土地拟人化。
- source_word: εἰς συμπλήρωσιν ἐτῶν ἑβδομήκοντα
  choice: 直至满了七十年
  rationale: εἰς συμπλήρωσιν表示达到完满或足数的结果；“直至满了”在中文中清楚表达荒凉与安息持续到七十年足数。
theological_decisions:
- issue: 流亡期间把安息用语用于土地
  choice: 保留“安息年”和“守安息”的重复
  alternative: 译作“休耕”或“休息”
  rationale: 希腊文刻意重复安息词根，呼应土地在荒凉期间补得安息的经文传统；若一概译为普通“休息”，会削弱这一互文和神学张力。
- issue: 土地的拟人化
  choice: 保留土地“享足”并“守安息”的拟人表达
  alternative: 改写为无人耕种，使土地得到休养
  rationale: 原文明确以土地为相关动作的主体；保留拟人化，不把经文所呈现的诗性与神学意象解释性地化平。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“直到”保留本节承接上文的句法关系；代词“它”继续维持土地的拟人化。
