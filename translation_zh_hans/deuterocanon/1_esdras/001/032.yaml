base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: zh_hans
  text: 本国的民众拥立约西亚的儿子耶哥尼雅[a]，立他作王，接替他父亲约西亚；那时他二十三岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“耶哥尼雅”；《历代志下》36:1的平行记载称他为“约哈斯”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: 拥立
  rationale: 此处该分词与后面的“立他作王”共同描述民众扶立新王的行动；译作“拥立”比字面的“带上、接过”更符合现代汉语历史叙事，同时不暗示武力夺取。
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: 国中有人
  rationale: 希腊文直译为“来自这民族的人”。“国中有人”自然保留其不定范围，避免把它具体化为希伯来传统中的专门表达“国民”。
- source_word: ἀνέδειξαν βασιλέα
  choice: 立他作王
  rationale: 准确表达任命、确立君王身份的意思，符合庄重而通顺的中文用语，又不额外指定是否举行了宣告或加冕仪式。
- source_word: ἀντί
  choice: 接替
  rationale: 这里表示儿子取代父亲成为君王；“接替”在王位承继语境中自然，并保留替代关系。
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: 那时他二十三岁
  rationale: 将希腊文分词年龄短语转换为自然的现代汉语分句，清楚说明登基时的年龄。
- source_word: Ἰεχονίαν
  choice: 耶哥尼雅
  rationale: 主文本依从希腊文明确记载的人名，不以《历代志下》36:1的平行记载“约哈斯”加以协调；差异置于脚注说明。
theological_decisions:
- issue: 希腊文本人名与希伯来历史平行记载不一致
  choice: 正文按希腊文译作“耶哥尼雅”
  alternative: 约哈斯
  rationale: 《以斯拉一书》的希腊文是本节的首要文本依据，因此保留其真实读法；脚注交代平行记载的差异，避免静默协调文本。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“拥立……立他作王”略有语义呼应，但分别承载 ἀναλαβόντες 与 ἀνέδειξαν βασιλέα 的动作层次；分号使年龄说明清晰自然。
