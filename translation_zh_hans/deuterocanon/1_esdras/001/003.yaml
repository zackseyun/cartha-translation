  to: 他对利未人，就是以色列的圣役说：“你们要在主的圣约柜安放之处，在大卫之子所罗门王所建造的殿中，把他们分别为圣，归给主。[a]”
  rationale: 作了三项轻微而安全的文字修订：以较自然且较少后世职分联想的“圣役”表达 ἱεροδούλοις；以“安放之处”表达约柜的 θέσις；调整所罗门王称号的中文语序。正文仍严格保留 αὐτούς 的不明所指，并以脚注呈现希伯来文平行经文，未作文本调和。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:22Z'
