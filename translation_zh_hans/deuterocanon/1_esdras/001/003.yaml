base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: zh_hans
  text: 他对利未人，就是以色列的圣役说：“你们要在主的圣约柜安放之处，在大卫之子所罗门王所建造的殿中，把他们分别为圣，归给主。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“把他们分别为圣，归给主”，但“他们”指谁并不清楚。希伯来文平行经文则作：“把圣约柜安放在大卫之子、以色列王所罗门建造的殿中。”
    reason: 说明希腊文代词所指不明，并列出希伯来文平行经文的显著异文。
lexical_decisions:
- source_word: Λευείταις
  choice: 利未人
  rationale: 采用现代中文圣经传统中这一族群及礼仪职分群体的标准译名，也与希伯来文平行经文相符。
- source_word: ἱεροδούλοις
  choice: 圣职仆役
  rationale: 该复合词指从事或献身于神圣事务的仆役；“圣职仆役”既保留礼仪色彩，又避免把他们过度限定为另一类专称的“殿役”。
- source_word: ἁγιάσατε αὐτοὺς
  choice: 把他们分别为圣
  rationale: 严格保留希腊文阳性复数宾格“他们”，不将其无声改作反身代词“自己”；“分别为圣”自然表达礼仪性的奉献含义。
- source_word: τῷ κυρίῳ
  choice: 归给主
  rationale: 与“分别为圣”连用时，“归给主”清楚表达献与、归属之意，同时按希腊文 κύριος 译作“主”。
- source_word: ἐν τῇ θέσει τῆς ἁγίας κιβωτοῦ τοῦ κυρίου
  choice: 在主的圣约柜所在之处
  rationale: θέσις 表示位置或所在之处；κιβωτός 在此礼仪语境中指约柜，中文用“约柜”比孤立的“柜”更清楚。
- source_word: ἐν τῷ οἴκῳ
  choice: 在……殿中
  rationale: οἶκος 字面为“房屋”，但此处明确指所罗门建造的圣殿；译作“殿”在中文中自然明确，又未增添宗派性解释。
- source_word: Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: 大卫之子所罗门王
  rationale: 保留所罗门与大卫的父子称谓及其王的身份，同时调整为自然庄重的中文语序。
theological_decisions:
- issue: αὐτούς 的所指是否应解释为利未人自己
  choice: 正文保留“他们”
  alternative: 你们自己
  rationale: 现存希腊文是阳性复数宾格“他们”，并非反身代词，其所指不明。源文优先要求保留这一真实歧义，不宜根据上下文或平行经文直接改成“自己”。
- issue: 是否按希伯来文平行经文改译为安放约柜
  choice: 正文依照希腊文，译为“把他们分别为圣，归给主”
  alternative: 把圣约柜安放在大卫之子以色列王所罗门建造的殿中
  rationale: 希伯来文平行经文较清楚，却与本节希腊文本显著不同；因此不在正文中调和两者，而以脚注透明说明。
- issue: κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节直接翻译依据是希腊文 κύριος；虽希伯来文平行经文对应神名，正文仍按希腊文译为“主”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别为圣”保留礼仪语域；“圣职仆役”表达 ἱεροδούλοις 的神圣服役含义；脚注明示文本歧义，不在正文中强行调和希腊文与希伯来文。
