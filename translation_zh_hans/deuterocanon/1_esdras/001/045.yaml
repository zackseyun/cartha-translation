base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: zh_hans
  text: 他行了主眼中看为恶的事，也不因先知耶利米从主口中所说的话而感到羞愧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文意为“不感羞愧”或“不觉惭愧”。《历代志下》36:12的希伯来文平行经文则说他“没有在先知耶利米面前自卑”；本译文以本节希腊文为准。
    reason: 说明本节希腊文“羞愧”与希伯来平行经文“自卑”在措辞上的差异，并保留相关文本传统信息。
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: 行了……看为恶的事
  rationale: 这是圣经中描述恶行的惯用表达；结合ἐνώπιον Κυρίου译成“行了主眼中看为恶的事”，既保留道德判断，也符合现代汉语习惯。
- source_word: ἐνώπιον Κυρίου
  choice: 主眼中
  rationale: ἐνώπιον可指“在……面前”或“在……眼中”。此处与行恶搭配，译作“主眼中”自然地保留神圣鉴察与审判的意味。
- source_word: οὐκ ἐνετράπη
  choice: 也不觉羞愧
  rationale: ἐντρέπω的中间或被动形式在此表示感到羞愧、惭愧或局促不安；“不觉羞愧”清楚表达他对先知警告毫无惭愧反应。
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: 面对……所说……的话
  rationale: ἀπό在此可表示引发羞愧的缘由或场合。汉语用“面对”既自然，也避免把其因果意味表达得过强。
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: 先知耶利米所说
  rationale: 保留被动结构中的施事者及“先知”称号，同时调整为自然的汉语定语结构。
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: 出自主口
  rationale: 直译并保留“从主口中出来”这一鲜明的先知性发言公式，表明话语最终源自主，而非仅仅源于耶利米。
theological_decisions:
- issue: 次经希腊文本中κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 主要文本是希腊文κυρίου，并未直接书写希伯来神名；译作“主”忠实于希腊见证，也避免依据平行传统擅自恢复专名。
- issue: οὐκ ἐνετράπη与希伯来平行经文之间的差异
  choice: 不觉羞愧
  alternative: 不自卑；不谦卑
  rationale: 本节希腊文明确使用表达羞愧或惭愧的ἐντρέπω；希伯来平行经文所表达的“不自卑”可帮助理解叙事背景，却不应取代此处希腊文本的具体措辞。
- issue: 耶利米与主在话语来源上的关系
  choice: 先知耶利米所说、出自主口的话
  alternative: 主借先知耶利米所说的话
  rationale: 此译同时保留ὑπό所标明的说话者耶利米和ἐκ στόματος τοῦ κυρίου所标明的话语来源，不将两者之间的张力简化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行了主眼中看为恶的事”保留圣经叙事的惯用语感；后半句用“面对”疏通希腊介词结构，并以“所说、出自主口”清楚区分先知的宣告行为与主作为话语源头的地位。
