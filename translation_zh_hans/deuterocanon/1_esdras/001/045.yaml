  to: 他行了主眼中看为恶的事，也不因先知耶利米从主口中所说的话而感到羞愧[a]。
  rationale: 仅作低风险的汉语句法修订。修订保留“行恶”“主”“羞愧”、耶利米作为发言者，以及话语“从主口中”而出的来源；未以《历代志下》的“不自卑”取代本节希腊文的羞愧语义。
