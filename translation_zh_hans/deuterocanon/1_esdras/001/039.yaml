base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: zh_hans
  text: 尼布甲尼撒从主的圣器中取了一些[a]，把它们带走，安放在他位于巴比伦的神庙里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从主的圣器中取走。”希腊文此处可按字面理解为“从……中”，但很可能带有部分义，即他取走了其中一些，而非全部。
    reason: 保留ἀπό加属格可作较直译理解的可能，同时说明正文“取了一些”所表达的部分义。
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: 从主的圣器中取了一些
  rationale: ἀπό加属格在此自然表达从一组器物中取出一部分；“一些”明确其部分义，而脚注保留较为直译的可能。“圣器”简洁表达分别为圣、用于敬拜的器具。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 以“主”对应希腊文κύριος；属格表示这些圣器属于主。
- source_word: λαβὼν
  choice: 取了
  rationale: 将分词按汉语叙事习惯译为限定动词，并与后续动作形成顺序。
- source_word: ἀπενέγκας
  choice: 掳走
  rationale: 该词表示把所取之物带离原处；“掳走”在战败与圣器被夺的语境中自然体现强制移走，同时不增添目的地信息。
- source_word: ἀπηνείσατο
  choice: 存放
  rationale: 表达将圣器移入神庙并安置、保存之意，比单纯“放置”更符合战利品被置于庙中的语境。
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: 在他的神庙里
  rationale: ναός指尼布甲尼撒在巴比伦的庙宇；用“神庙”可避免读者误解为耶路撒冷圣殿。αὐτοῦ保留为“他的”，不擅自确定所供奉的神。
- source_word: ἐν Βαβυλῶνι
  choice: 位于巴比伦
  rationale: 采用通行地名“巴比伦”，并将地点短语自然地修饰“神庙”。
theological_decisions:
- issue: 次经历史叙事中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要文本证据是希腊文κύριος，而非本节明确出现的希伯来文神名；译作“主”既忠于希腊文本，也避免将神名形式反向补入。
- issue: αὐτοῦ所指的庙宇归属
  choice: 他的神庙
  alternative: 他所敬奉之神的庙
  rationale: 希腊文本只说“他的”，可指与尼布甲尼撒相关或属于他的庙；不补明具体神祇，以保留原文表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。“圣器”保留礼仪性，“神庙”与耶路撒冷“圣殿”作清楚区分；连续分词改写为自然的汉语动作顺序。
