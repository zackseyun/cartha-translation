  yaml_path: translation/deuterocanon/1_esdras/001/024.yaml
  text: Josiah met him[a]. And the king of Egypt sent word to him, saying, “What is there between me and you[b], O king of Judea?”
translation:
  language: zh_hans
  text: 约西亚与他相遇[a]。埃及王派人传话给他，说：“我与你有什么相干[b]，犹太地的王啊[c]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此句极为简略；也可译作“约西亚去见他”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“我和你有什么关系？”这是表示彼此无涉或质问对方为何介入的惯用语。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“犹太地的王”；《历代志》的历史平行记载所对应的称呼是“犹大王”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: 约西亚迎上去见他
  rationale: 原文是极简短的相遇表述；汉语用动词性说法补足句法。“迎上去见”既保留主动前往相遇的意味，也不擅自加入“迎战”等上下文推断。
- source_word: διεπέμψατο
  choice: 派人传话
  rationale: 该动词表示借着所差派的人传送信息。译作“派人传话”符合现代汉语，又不把原文未明说的使者人数具体化。
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: 我与你有什么相干
  rationale: 这是带有闪语色彩的疏离或质问用语。此译在现代汉语中自然，并保留其可能较克制、也可能带挑战意味的语气。
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: 犹太地的王啊
  rationale: Ἰουδαία是希腊文地域名称，直指“犹太地”；加“啊”体现呼格称呼，同时避免依照《历代志》的平行记载径改为“犹大”。
theological_decisions:
- issue: 质问套语 Τί ἐμοὶ καὶ σοὶ ἐστίν 的语气强度
  choice: 我与你有什么相干
  alternative: 我和你有什么关系？
  rationale: 选文既表达双方无涉或要求对方不要介入，又没有把语气强化成明确敌意，保留原文在疏离与挑战之间的张力。
- issue: 地域及政治称号 Ἰουδαίας
  choice: 犹太地
  alternative: 犹大
  rationale: 以当前希腊文本为先，保留其地域名称；脚注说明《历代志》平行记载所对应的传统称法，以免混淆而不改写正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“派人传话”清楚自然；“王啊”保留希腊文呼格的直接称呼。正文不把相遇解释成迎战，也不以平行经文的“犹大”取代本处希腊文的“犹太地”。
