base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: zh_hans
  text: 约雅敬捆绑了权贵们[a]；他又抓住自己的兄弟撒利乌[b]，把他从埃及带上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文中“约雅敬”最自然地是“捆绑了”的主语；“权贵们”指显要人物或大臣。
    reason: 说明本节容易因英语审计轨迹而被误解的主谓宾关系，并交代“权贵们”的词义范围。
  - marker: b
    text: 希腊文作“他的兄弟”；“撒利乌”也可音译为“撒利翁”。
    reason: 说明原文使用代词，并交代罕见专名的另一种音译。
lexical_decisions:
- source_word: ἔδησεν
  choice: 捆绑了
  rationale: 保留δέω“捆绑、束缚”的具体含义，不进一步断定是正式监禁还是戴上锁链。
- source_word: Ἰωακεὶμ
  choice: 约雅敬
  rationale: 采用现代中文圣经中这一人物的通行译名，以对应希腊文Ἰωακείμ。
- source_word: τοὺς μεγιστᾶνας
  choice: 权贵们
  rationale: μεγιστᾶνες指居于高位、有权势的显要人物；“权贵们”在现代汉语中自然，也不把他们过度限定为世袭贵族或正式官员。
- source_word: Ζάριον
  choice: 撒利乌
  rationale: 按希腊文宾格Ζάριον所反映的专名转写，并用“乌”自然体现重建主格末尾的-us音形。
- source_word: συλλαβών
  choice: 抓住
  rationale: συλλαμβάνω在此表示抓获、拘拿；“抓住”保留动作力度，又不额外加入正式司法程序的含义。
- source_word: ἀνήγαγεν
  choice: 带了上来
  rationale: 保留ἀνάγω所含“带上去、领上来”的方向意味；从埃及往犹大地在圣经地理叙述中常说“上来”。
- source_word: ἐξ Αἰγύπτου
  choice: 从埃及
  rationale: 直接表达出发地，符合现代汉语习惯。
theological_decisions:
- issue: 省略主语的历史叙述中，施事者是谁
  choice: 在正文补明“埃及王”
  alternative: 照希腊文只译“他”；或将约雅敬误作施事者
  rationale: 希腊文此处省略主语，但上下文表明承接的施事者是埃及王。中文若只写“他”，容易造成指代不清；补出上下文已经给出的主语，不改变事件内容。
- issue: Ἰωακεὶμ τοὺς μεγιστᾶνας的压缩结构
  choice: 译为“约雅敬和权贵们”
  alternative: 译为“约雅敬的权贵们”；或仅译“约雅敬这位权贵”
  rationale: Ἰωακείμ与τοὺς μεγιστᾶνας都处于ἔδησεν支配的宾语位置，而后者是复数，不能自然地与单数专名构成同位关系；希腊文虽未写连接词，却最可能列举约雅敬与权贵们为共同受事者。脚注保留原文结构的压缩性。
- issue: αὐτοῦ所指
  choice: 在正文明确为“约雅敬的兄弟”
  alternative: 保留“他的兄弟”，让代词所指维持形式上的含混
  rationale: 从句法和叙事人物关系看，αὐτοῦ回指约雅敬最为自然；中文直接重复名字可避免把“他”误解为埃及王。脚注说明希腊文原为代词。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文补明省略的施事者，并用分号呈现两个连续动作；专名使用熟悉的“约雅敬”，罕见专名则按希腊文音译。所有脚注标记均已置于正文相应位置。
