  source_fidelity: 希腊文中Ἰωακεὶμ紧随单数动词ἔδησεν，最自然是该动词的主语：“约雅敬捆绑了权贵们”。本节本身并未出现“埃及王”作为主语，亦未将约雅敬列为“捆绑”的受事者。后面的主语仍是约雅敬；τὸν ἀδελφὸν αὐτοῦ意为“他的兄弟”，就近且连贯地指约雅敬。
  naturalness: 修订后使用清楚、庄重而现代的汉语。“自己的兄弟”在中文中既自然，也恰当地表达希腊文属格代词与持续主语的关系；“从埃及带上来”保留ἀνάγω的“上来”方向色彩，不虚构目的地。
  terminology: “约雅敬”是通行圣经人名；“权贵们”可对应μεγιστᾶνας；“撒利乌”可作为Ζάριον的中文音译。保留“捆绑”以免将δέω过度具体化为监禁或上镣。
