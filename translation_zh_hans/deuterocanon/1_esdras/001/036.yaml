  rationale: 本次修订恢复希腊文本的直接句法：约雅敬是两个连续动作的施事者，权贵们和撒利乌分别是受事者。删除无本节明文依据的“埃及王”，不采用英语审计轨迹中与希腊文冲突的压缩句法解释。
