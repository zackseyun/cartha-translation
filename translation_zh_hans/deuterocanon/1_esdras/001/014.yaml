base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: zh_hans
  text: 圣殿歌唱者，就是亚萨的子孙，都各按自己的班次供职，照着大卫所规定的；亚萨、撒迦利亚和以底努斯，都是王那里的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都是王所委派的人。”希腊语直译近于“王那里的人”，也可能表示他们受王委派或隶属于王。
    reason: alternative_reading
  - marker: b
    text: 此处的措辞与《历代志下》35:12的近似希伯来文本不同；后者在这一段记述分发燔祭，第一以斯拉书则保留了关于歌唱者和这些具名人物的扩展记载。
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: 圣殿歌唱者
  rationale: 该复合词指参与圣殿敬拜的歌唱者；“圣殿歌唱者”自然清楚，也保留其礼仪场景。
- source_word: υἱοὶ Ἀσὰφ
  choice: 亚萨的子孙
  rationale: 这是兼具宗族与职事群体含义的表达；译作“子孙”比仅指亲生儿子的“儿子”更符合此处组织性语境。
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: 都各按自己的班次供职
  rationale: τάξις在此表示礼仪事奉中的编组、次序或岗位；“按自己的班次供职”兼顾秩序与实际职能。
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: 照着大卫所规定的
  rationale: 保留完成时被动分词所表达的既定安排，并明确大卫是规定者。
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: 都是王那里的人
  rationale: 希腊语短语简略，παρά加属格可表示来自王、代表王或与王有隶属关系；正文采用较贴近原文而不强行判定具体关系的译法。
- source_word: Ἐδδεινοὺς
  choice: 以底努斯
  rationale: 依Swete所载希腊名称音译；此名的对应形式并不稳定，故不擅自与其他名称统一。
theological_decisions:
- issue: 王与亚萨、撒迦利亚、以底努斯三人的关系
  choice: 都是王那里的人
  alternative: 都是王所委派的人
  rationale: 原文οἱ παρὰ τοῦ βασιλέως含义压缩，可指来自王、代表王或受王委派；正文保留这种关系上的含混，注释说明较顺畅的另一种理解。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“供职”体现圣殿礼仪中的实际职责；“王那里的人”有意保留原希腊语的简略和歧义，并以脚注补充可能的委派含义。所有脚注标记均置于相关句末。
