base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/021.yaml
  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: zh_hans
  text: 约西亚所行的事，在他的主面前得以端正[a]，他的心充满虔敬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是正直的”“被确立为正直”。
    reason: 希腊文ὠρθώθη是被动形式；可强调“得以端正”的被动或结果含义，也可按状态理解为“是正直的”。
  - marker: b
    text: “虔敬”也可译作“敬虔”或“虔诚”。
    reason: 希腊文εὐσέβεια指向上帝的虔诚、敬重与敬奉。
lexical_decisions:
- source_word: ὠρθώθη
  choice: 都是正直的
  rationale: 这里是ὀρθόω的被动形式，可表示“被纠正、得以端正”或“被确立为正直”。正文采用自然的汉语状态表达“都是正直的”，并以脚注保留其被动及动态含义。
- source_word: τὰ ἔργα
  choice: 所行的事
  rationale: 指约西亚的行为与作为；“所行的事”比抽象的“工作”更符合此处的道德评价语境。
- source_word: Ἰωσείου
  choice: 约西亚
  rationale: 采用现代中文圣经传统中通行的人名译法，也与希伯来文对应名字相符。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 直接保留在主面前受察看、受评价的关系含义。
- source_word: τοῦ κυρίου αὐτοῦ
  choice: 他的主
  rationale: 严格依照希腊文“他的主”，不受近似的希伯来文平行材料影响而增添“上帝”或改作“耶和华”。
- source_word: ἐν καρδίᾳ πλήρει
  choice: 有一颗充满……的心
  rationale: 以自然现代汉语表达伴随约西亚行为的内在心志，同时保留“心”和“充满”的意象。
- source_word: εὐσεβείας
  choice: 虔敬
  rationale: 表达对上帝的敬畏、虔诚和敬奉；“虔敬”庄重而易懂，也避免将词义局限为外在宗教礼仪。
theological_decisions:
- issue: 是否受希伯来文平行材料影响，将τοῦ κυρίου αὐτοῦ扩译为“耶和华”或“他的主上帝”
  choice: 他的主
  alternative: 耶和华；他的主上帝
  rationale: 本书以现存希腊文为主要翻译依据，而该处仅作“他的主”，没有θεός。因此不增补希腊文本没有的称谓。
- issue: 如何表达εὐσέβεια的宗教含义
  choice: 虔敬
  alternative: 敬虔；虔诚；敬畏
  rationale: “虔敬”能兼顾对上帝的敬重与虔诚，且不把含义单独收窄为情感、行为或恐惧。
translation_notes:
  register: 采用现代、庄重而通顺的中文。“他的主”在汉语中略显特别，但为忠实保留希腊文限定表达；分号使外在行为与内在心志之间的关系清楚，同时不强行判定后半句只修饰哪一部分。
