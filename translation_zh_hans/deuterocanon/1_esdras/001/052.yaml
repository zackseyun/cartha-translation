base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: zh_hans
  text: 他们焚烧了主的殿[a]，拆毁了耶路撒冷的城墙，又用火焚烧了城的塔楼[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的殿”指耶路撒冷的圣殿；希腊文直译为“主的房屋”。
    reason: 说明语境所指，并保留οἶκος的字面意义。
  - marker: b
    text: 希腊文前后两处使用同一个“焚烧”动词；也可译作“放火烧了主的殿……又放火烧了城的塔楼”。
    reason: 说明原文重复使用同一焚烧动词，并保留可行的现代汉语表达。
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: 焚烧
  rationale: 该动词意为焚烧或放火烧；两处采用同一译词，以保留希腊文的重复，同时不额外断定建筑已被彻底烧毁。
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: 主的殿
  rationale: οἶκος本义为“房屋”，此处明确指耶路撒冷圣殿；现代汉语以“主的殿”自然、庄重，也保留“属于主的居所”这一表达。
- source_word: κατέλυσαν
  choice: 拆毁
  rationale: 此处指使建筑结构倒塌、被拆除；“拆毁”与城墙搭配自然，并比泛称“毁灭”更具体。
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: 耶路撒冷的城墙
  rationale: 按希腊文直接表达所属关系，清楚自然。
- source_word: τοὺς πύργους αὐτῆς
  choice: 城中的塔楼
  rationale: αὐτῆς回指耶路撒冷；汉语用“城中的”避免生硬的“她的”，πύργοι译作具体的“塔楼”，不扩大为全部防御工事。
- source_word: ἐν πυρί
  choice: 用火
  rationale: 保留短语的工具性含义；虽与“焚烧”语义有所重复，但这种重复也存在于希腊原文中。
theological_decisions:
- issue: 圣殿称谓中κύριος的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 主要文本是希腊文，其用词为κυρίου；译作“主”既忠于希腊文本，也不根据其他传统反向补入神名。
- issue: οἶκος应直译为“家/房屋”还是按语境译为“殿”
  choice: 殿
  alternative: 主的家／主的殿宇
  rationale: 语境所指为耶路撒冷圣殿。“殿”在现代汉语中准确而庄重；脚注说明这一指称，以免掩盖原词本义为“房屋”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“焚烧”较“烧”更适合经文语体，但不过分古雅；“城中的塔楼”使代词所指明确。保留句末逗号，以反映本节在现有分句中的连续性。
