base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: zh_hans
  text: 他们列祖的王，就是他们列祖的上帝[b]，借着他的天使[a]去眷顾他们的百姓，召他们回来；因为他怜惜他们，也怜惜自己的居所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”；希腊语ἄγγελος既可指“天使”，也可指“使者”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本开头的措辞不寻常，直译为“他们列祖的王、他们列祖的上帝”。这里保留了这两个称号，没有将其删减或校顺。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 差遣
  rationale: 准确表达主动派出的叙事动作，也与后面的“他的天使”自然搭配。
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν
  choice: 他们列祖的王
  rationale: 保留现存希腊文本中不寻常但仍可理解的神圣称号，不擅自删去或改写。
- source_word: ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: 他们列祖的上帝
  rationale: “列祖的上帝”是自然、庄重的现代汉语圣经表达，并保留其祖先与盟约色彩。
- source_word: ἐπισκέψασθαι
  choice: 去眷顾
  rationale: 此处不仅指探访，也含关怀和介入之意；“眷顾”简洁地保留这种正面意味。
- source_word: τὸν λαὸν αὐτῶν
  choice: 他们的百姓
  rationale: 严格保留希腊文的复数属格“他们的”，不按上下文改成“他的百姓”。
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: 借着他的天使
  rationale: ἄγγελος在上帝差遣的语境中通常可译为“天使”；其也可泛指“使者”，故在脚注注明。正文按汉语语序表达为“差遣他的天使去”。
- source_word: μετακαλέσαι αὐτούς
  choice: 召他们回来
  rationale: μετακαλέομαι含召来、召回之意；“召他们回来”保留恢复与回转的方向感。
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: 因为他怜惜他们
  rationale: φείδομαι可指顾惜、怜悯或不忍伤害；此处说明上帝施恩行动的原因，“怜惜”也能自然与人和居所搭配。
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: 自己的居所
  rationale: σκῆνωμα本义为居处、住所；此处指上帝的神圣居所，但不必具体化为“会幕”或“圣殿”。反身代词“自己”清楚指回主语上帝。
theological_decisions:
- issue: 如何处理开头对上帝的双重称谓
  choice: 将“他们列祖的王”和“他们列祖的上帝”并列保留为指向同一位上帝的称号
  alternative: 删去“他们列祖的王”，或按推测校改为“王和他们列祖的上帝”
  rationale: 现存希腊文本连续出现两个带冠词的称谓。虽然措辞异常，但仍可作为同位称号理解；保留二者最能忠实呈现原文及其文本张力。
- issue: ἄγγελος应译为“天使”还是“使者”
  choice: 正文译“天使”
  alternative: 使者
  rationale: 在上帝差遣其代理者的经文语境中，“天使”是合理的默认理解；但希腊词本身也可指一般的使者，因此以脚注保留另一可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“列祖”“眷顾”保留经文语体，但仍为普通现代读者所理解；句法按汉语习惯调整，同时保留希腊文中“他们的百姓”和双重神圣称号等不寻常之处。
