  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: zh_hans
  text: 在约西亚这一切作为之后，发生了这样的事：埃及王法老来到幼发拉底河畔的迦基米施挑起战争；于是约西亚出去……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文本在“出去”之后止于介词εἰς，句子并不完整；因此正文以省略号标明残缺，没有按上下文补作“迎战他”。
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ πᾶσαν τὴν πρᾶξιν ταύτην Ἰωσείου
  choice: 约西亚完成这一切事以后
  rationale: πρᾶξις在此回指约西亚先前所行的一整套事务；译为“完成这一切事”既符合现代汉语叙事，也不过度限定为某一项行动。
- source_word: συνέβη
  choice: 事情是这样发生的
  rationale: 保留事件发生的叙事公式，同时避免文言式“事就成了”。
- source_word: Φαραὼ βασιλέα Αἰγύπτου
  choice: 埃及王法老
  rationale: 按希腊语保留王号与国别，采用现代中文圣经及历史叙述中通行的称呼。
- source_word: ἐλθόντα πόλεμον ἐγείραι
  choice: 来到……挑起战争
  rationale: ἐγείρω与πόλεμος搭配有“兴起、挑起战争”之意；“挑起”保留主动发动的意象。
- source_word: ἐν Χαρκαμυς ἐπὶ τοῦ Εὐφράτου
  choice: 幼发拉底河畔的迦基米施
  rationale: 将地点与河流修饰关系自然地整合为现代汉语地名表达。
- source_word: καὶ ἐξῆλθεν εἰς
  choice: 约西亚就出迎……
  rationale: 所给Swete文本止于介词εἰς，句子未完。补明上下文主语“约西亚”，但不擅自补出介词宾语；以省略号显明残缺。
theological_decisions:
- issue: 希腊形式的王名Ἰωσείου如何处理
  choice: 约西亚
  alternative: 按希腊音形另译为“约西亚斯”
  rationale: “约西亚”是现代中文读者熟悉且对应明确的专名形式；采用通行中文名并不改变人物身份，也不引入教派性解释。
- issue: 残缺短语εἰς的补足
  choice: 不补宾语，以省略号保留残缺
  alternative: 按叙事语境译作“出去迎战他”
  rationale: 现有原文在εἰς之后截断，无法仅凭所提供的文本确定宾语。为保存真实的文本不确定性，不把合理推断写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“迦基米施”和“幼发拉底河”用中文通行地名；句末明确保留底本文本的残缺状态。
