base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: zh_hans
  text: 王对他的侍从[a]说：“把我带离战场，因为我已经非常虚弱了。”他的侍从立刻把他带离了战阵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“臣仆”。希腊文παῖδες可指“仆人”、“侍从”或“年轻人”；希伯来文平行经文作“他的臣仆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: 侍从
  rationale: 在王室和军事语境中，这个词指随侍君王的人，并非孩童；译作“侍从”自然准确，也与希伯来文平行经文“他的臣仆”相符。
- source_word: Ἀποστήσατέ με
  choice: 把我带离
  rationale: 这里是命令随从将王从交战之处撤走；“把我带离”既表达使其离开的使役含义，也符合现代汉语。
- source_word: ἀπὸ τῆς μάχης
  choice: 离战场
  rationale: μάχη指战斗或交战；结合王要求被移走的情境，“离战场”简洁自然。
- source_word: ἠσθένησα
  choice: 我已经非常虚弱了
  rationale: 动词本身表示变得软弱或身体不支，并未明确说受伤；“已经……虚弱了”保留其状态形成的意味，不额外补入伤势。
- source_word: λίαν
  choice: 非常
  rationale: 准确传达加强程度的副词含义，且是自然的现代汉语。
- source_word: εὐθέως
  choice: 立刻
  rationale: 传达随从毫不迟延地执行命令。
- source_word: παράταξις
  choice: 战阵
  rationale: 该词指排列好的军队阵势或战线；“战阵”比再次译作“战场”更准确地保留原文后一句的词义区别。
