base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: zh_hans
  text: 他的儿子约雅敬接替他作王；因为他被任命时八岁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文说，他被任命时“八岁”。其他圣经文本传统对即位君王的身份或年龄有不同记载；本译文保留《以斯德拉一书》的希腊文措辞。
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: 作王
  rationale: 在历史叙事中自然表达登位并执掌王权，且不把含义局限于登基这一刻。
- source_word: ἀντ᾽ αὐτοῦ
  choice: 接替他
  rationale: 此处表示王位继承；现代汉语“接替他作王”自然清楚，也保留取代前任的含义。
- source_word: Ἰωακεὶμ
  choice: 约雅敬
  rationale: 采用该希腊名字所对应的通行中文圣经人名，便于与相关王室人物对应。
- source_word: ὁ υἱὸς αὐτοῦ
  choice: 他的儿子
  rationale: 直接保留亲子关系，不作增释。
- source_word: ἀνεδείχθη
  choice: 被任命
  rationale: 保留被动语态以及正式指定任职的意味，不额外补入希腊文未明说的“为王”。
- source_word: ἐτῶν ὀκτώ
  choice: 年仅八岁
  rationale: 符合现代汉语年龄表达；“仅”自然凸显原文所载年龄之幼，但不改变数值。
theological_decisions:
- issue: 本节所述君王身份或即位年龄与其他圣经传统存在差异。
  choice: 正文依希腊文保留“他被任命时年仅八岁”。
  alternative: 按照其他传统改换君王身份或即位年龄。
  rationale: 本项目以《以斯德拉一书》的希腊文本为主要翻译依据；原文在此措辞明确，不应为求协调而改写。脚注透明说明传统之间的差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“接替他作王”适合历史叙事；正文保留希腊文本清楚却存在历史比较难题的年龄记载，并以脚注说明异文传统。
