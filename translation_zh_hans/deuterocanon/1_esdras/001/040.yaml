base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: zh_hans
  text: 至于关于他的种种记述[a]、他的污秽和不敬虔，都记载在《列王年鉴》中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关于他的种种记述”也可译作“关于他所传述的事”。希腊语分词既可指被叙述的事，也可指记录在案的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱστορηθέντα
  choice: 有关他的记载
  rationale: 该中性复数分词指关于他的、已经叙述或记录下来的事；译作“记载”兼顾叙事与文献记录的含义，并保持现代汉语自然。
- source_word: ἀκαθαρσίας
  choice: 污秽
  rationale: 保留该词在道德和宗教层面的不洁含义，又不把它限定为礼仪性不洁。
- source_word: δυσσεβείας
  choice: 不敬虔
  rationale: 该词特指对上帝缺乏敬畏与虔诚；“不敬虔”比笼统的“邪恶”更准确，并与“污秽”构成两个彼此有别的指控。
- source_word: ἀναγέγραπται
  choice: 都写在
  rationale: 希腊语完成时被动态表示这些事已经写下并仍存于记录中；“都写在”在现代汉语中简洁自然。
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: 《列王年鉴》
  rationale: 这是王室编年档案的惯用表达；“列王年鉴”准确传达书卷与王室年代记录的性质。
theological_decisions:
- issue: ἀκαθαρσίας καὶ δυσσεβείας 对这位王的道德—宗教评价
  choice: 分别译为“污秽和不敬虔”
  alternative: “不洁和邪恶”或“玷污和不虔”
  rationale: 原文并列两个不同的贬义名词；译文保留双重指控，不把它们合并成一般性的“恶行”，也不把“污秽”仅限于礼仪范畴。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于”对应希腊语 δὲ 的轻微转折或话题推进作用，不添加时间性的“现在”。书名用《列王年鉴》，便于普通读者理解其王室档案性质。
