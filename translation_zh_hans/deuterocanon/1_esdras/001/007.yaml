base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/007.yaml
  text: And Josiah gave to the people who were present thirty thousand lambs and young goats[b][a], and three thousand calves.
translation:
  language: zh_hans
  text: 约西亚赐给在场的百姓[a]三万只羊羔和幼山羊，以及三千头牛犊。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“给百姓，就是那些被找到的人”；这里大概指当时在场或聚集的人。
    reason: lexical_alternative
  - marker: b
    text: 资料所附的希伯来文平行经文与本节希腊文并不密切对应，因此正文以希腊文为准。
    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  choice: 赐给
  rationale: 该中间语态动词表示作为礼物赠予；“赐给”既体现君王供给百姓的语境，也保持自然庄重。
- source_word: τῷ λαῷ
  choice: 百姓
  rationale: 与格表示受赠者；“百姓”是此处指参加节期民众的自然译法。
- source_word: τοῖς εὑρεθέντι
  choice: 在场的
  rationale: 原文形式有语法上的不协调，字面涉及“被找到”；结合语境，指当时在场或聚集的人。“在场的”传达其语用意义，脚注保留字面信息。
- source_word: ἀρνῶν καὶ ἐρίφων
  choice: 羊羔和山羊羔
  rationale: ἀρνῶν指幼羊，ἐρίφων特指幼山羊；分别译出可保留原文的动物类别和年龄含义。
- source_word: τριακοντα χιλιάδας
  choice: 三万只
  rationale: 直译数目，并按汉语习惯为两类小牲畜使用量词“只”；该数字按希腊语句法指前述两类合计。
- source_word: μόσχους τρισχιλίους
  choice: 三千头牛犊
  rationale: μόσχος指幼牛，不限定性别；“牛犊”比“公牛犊”更忠实，量词“头”符合现代汉语习惯。
theological_decisions:
- issue: 希腊文本与所附马所拉文本平行材料严重不符
  choice: 正文以希腊文为准，译作约西亚把牲畜赐给在场的百姓
  alternative: 受所附希伯来文影响，译入宰逾越节羊羔、使自己成圣并为弟兄预备等行动
  rationale: 本书的主要原文依据是希腊文；所附希伯来文属于近似平行材料，内容实际对应另一行动次序，不能用来改写本节。脚注说明这一文本情况，而不在正文中调和。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“赐给”适合君王赠予的场景，但不增添宗教或政治含义；数字和牲畜类别均紧随希腊文。脚注标记紧接其所解释的内容。
