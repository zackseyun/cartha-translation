base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: zh_hans
  text: 要按次序[a]献逾越节祭牲，为你们的弟兄[b]预备祭物，并要照主赐给摩西的命令守逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按适当的次序”或“按班次”；这句话指依照安排有序地行事。相关的希伯来文平行文本强调分班、分组。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指同族、同属这民的人，不一定只是男性亲兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: 按着次序
  rationale: 该短语在希腊文中作副词用，表示依照适当的安排或班次行事；这样译既简洁自然，也保留与平行希伯来文本中分班、分组观念的联系。
- source_word: θύσατε τὸ πάσχα
  choice: 献逾越节的祭牲
  rationale: θύω 在祭祀语境中指宰杀并献祭；πάσχα 此处很可能具体指逾越节祭牲。译出“祭牲”可与后文“守逾越节”所指的节期礼仪相区别。
- source_word: τὰς θυσίας
  choice: 各样祭物
  rationale: 复数 θυσίας 指祭祀中所献的祭物；“各样祭物”符合现代汉语礼仪语境，也体现复数。
- source_word: ἑτοιμάσατε
  choice: 预备
  rationale: 准确表达使祭物准备妥当的含义，并保持庄重、自然的经文语体。
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: 为你们的弟兄
  rationale: 保留原文阳性亲属称谓；上下文所指是同族、同属民众的成员，不限于亲生兄弟，故以脚注说明。
- source_word: ποιήσατε τὸ πάσχα
  choice: 守逾越节
  rationale: ποιέω 与 πάσχα 连用是举行、遵守逾越节礼仪的惯用表达；“守逾越节”是现代中文圣经语体中自然且准确的说法。
- source_word: κατὰ τὸ πρόσταγμα
  choice: 照着……命令
  rationale: πρόσταγμα 表示具有权威的命令；“照着……命令”清楚表达遵行的规范依据。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 直接依据希腊文 κυρίου 翻译为“主”，不从推测的希伯来底本逆推为特殊排印的神名。
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: 赐给摩西的
  rationale: 该分词短语修饰“命令”；“赐给”既准确表达被动的“给予”，也符合命令来自主的语境。
theological_decisions:
- issue: ἀδελφοῖς 在群体语境中的范围
  choice: 弟兄
  alternative: 同胞；以色列同胞；弟兄姊妹
  rationale: 原文使用阳性复数亲属词，故正文保留“弟兄”；同时不把它限制为男性手足，而以脚注说明其群体性所指。
- issue: 七十士译本语境中 κυρίου 的译法
  choice: 主
  alternative: 耶和华
  rationale: 直接翻译现存希腊文本的 κύριος，避免在没有明确文本依据时逆译为神名。
- issue: πάσχα 两次出现时的不同语境含义
  choice: 首次译“逾越节的祭牲”，后次译“守逾越节”
  alternative: 两处都译“逾越节”
  rationale: 首次是 θύω 的直接宾语，语义偏向被宰献的逾越节祭牲；后次与 ποιέω 构成遵守节期的惯用表达。这样处理呈现同一词在相邻语境中的具体与礼仪性用法，而非消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献逾越节的祭牲”明确祭祀动作，“守逾越节”表达节期礼仪；句式保持原文三个并列命令的推进关系。
