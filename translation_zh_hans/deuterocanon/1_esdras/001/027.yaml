    rationale: κατέβησαν明确含有“下来／下到”的运动；πρός加宾格在此可以带敌对色彩，但基本仍可表示“到、向”。“进逼”既没有译出下行，也将原文未明说的直接威胁定死。译为“下到约西亚王那里”能保留歧义，不妨碍读者从战争语境领会冲突。
  - severity: low
