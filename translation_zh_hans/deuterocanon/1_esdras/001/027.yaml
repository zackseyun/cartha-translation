base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: zh_hans
  text: 但他在米吉多平原摆开战阵，要与他交战[a]；众将领下到约西亚王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志下》35:22的希伯来文平行经文作“乔装，要与他交战”，而这里的希腊文本作“摆开战阵，要与他交战”。
    reason: 说明希腊主要文本与希伯来文平行经文在约西亚行动描述上的差异。
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: 摆开战阵，与那人交战
  rationale: 中间语态表达约西亚亲自采取迎战行动；此译既保留备战、列阵的色彩，也用现代汉语自然交代其敌对对象。αὐτόν在本节没有重述姓名，因此译作“那人”，不擅自补名。
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: 在米吉多平原
  rationale: πεδίον意为平原或开阔地；地名按《历代志下》35:22的希伯来文平行经文规范为通行译名“米吉多”。
- source_word: οἱ ἄρχοντες
  choice: 众将领
  rationale: ἄρχοντες本可泛指首领或官长，但此处是战争场景，译作“将领”最符合语境。
- source_word: κατέβησαν ... πρὸς βασιλέα Ἰωσίαν
  choice: 向约西亚王进逼
  rationale: κατέβησαν保留“下行、下来”的运动概念不易在汉语中自然直译；πρός本身表示朝向，而战事语境又带敌对色彩，“向……进逼”兼顾方向与语境，避免将其淡化为普通的“来到”。
theological_decisions:
- issue: 希腊文本与希伯来文平行经文在约西亚行动上的差异
  choice: 正文依希腊文译为“摆开战阵，与那人交战”
  alternative: 依《历代志下》35:22希伯来文译为“改装，要与他交战”
  rationale: 本书以指定的希腊文本为主要翻译依据；希伯来文平行经文可用于核对地名，却不应在动词读法实质不同之处取代希腊文。脚注保留此文本差异。
- issue: πρὸς βασιλέα Ἰωσίαν所表达的关系
  choice: 译为“向约西亚王进逼”
  alternative: 译为“下到约西亚王那里”或“下来攻击约西亚王”
  rationale: 希腊介词首先表达朝向，但战争上下文暗示敌对行动；所选译法保留这两方面，而不把介词本身过度明确化为直接攻击。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“摆开战阵”比生硬的“为战争列置自己”自然，同时保留希腊文中主动迎战的意味；分号呈现两个连续的战场行动。
