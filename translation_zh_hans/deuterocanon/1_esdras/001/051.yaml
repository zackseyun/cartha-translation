base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: zh_hans
  text: 但他把一切都交在他们手中。他们拿走了主的一切圣器，无论大小，又拿走了主的箱柜和王室的库房，把这些都运到巴比伦去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: 把一切都交在他们手中
  rationale: 保留希腊语“交在……手中”的惯用表达及其支配、处置之意，同时使现代汉语自然。
- source_word: τὰ ἱερὰ σκεύη τοῦ κυρίου
  choice: 主的一切圣器
  rationale: σκεύη指用于圣所的器具；“圣器”简洁、庄重，也没有擅自限定具体种类。
- source_word: τὰ μεγάλα καὶ τὰ μικρά
  choice: 无论大小
  rationale: 自然表达原文对大小器物的全面涵盖。
- source_word: τὰς κιβωτοὺς τοῦ κυρίου
  choice: 主的箱柜
  rationale: κιβωτοί为复数，可指箱、柜或匣；“箱柜”保留其宽泛性，也避免误译为单数的约柜。
- source_word: τὰς βασιλικὰς ἀποθήκας
  choice: 王室的库房
  rationale: ἀποθήκη意为储藏处、库房；βασιλικάς表明其属于王室。
- source_word: ἀπήνεγκαν εἰς Βαβυλῶνα
  choice: 运到巴比伦去了
  rationale: 体现将物品带走并运往巴比伦的动作方向。
theological_decisions:
- issue: παρέδωκεν的主语在本节内部未明说
  choice: 保留“他”而不补明身份
  alternative: 明确译为“主/上帝把一切交给他们”
  rationale: 希腊文本仅有第三人称单数动词；为保留篇章所承接的指代和原文张力，不在本节擅自补明。
- issue: κιβωτοί是否指约柜
  choice: 译作复数的“箱柜”
  alternative: 译作“约柜”或“主的宝库”
  rationale: 原文是普通名词复数，不能自然等同于单数、特指的约柜；也不应与后面的库房混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“圣器”“王室的库房”保持经文语域；通过“又拿走了”清楚呈现并列宾语关系。未设置脚注，因此正文无脚注标记。
