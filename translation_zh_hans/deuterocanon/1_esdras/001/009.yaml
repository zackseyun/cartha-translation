base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: zh_hans
  text: 耶哥尼雅、撒玛雅、他的兄弟拿但业，以及撒比雅、俄基业和约兰这些千夫长，给了利未人一千只羊和七百头牛犊，供逾越节使用。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《历代志下》35:9的希伯来文平行记载列出的是不同的官员和数目：供逾越节使用的牲畜二千六百只，另有牛三百头。本书以希腊文本为翻译依据，因此正文保留希腊文中的人名和数目。
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: 千夫长
  rationale: 该词本义是统领一千人的首领；“千夫长”简洁保留其正式职衔，也避免引入罗马军制中特定的称谓。
- source_word: εἰς πάσχα
  choice: 供逾越节使用
  rationale: 表示这些牲畜是为逾越节而预备或指定的；此译自然清楚，同时不把希腊文未明说的献祭细节过度具体化。
- source_word: πρόβατα
  choice: 羊
  rationale: 该词通常指羊，也可较宽泛地指小型群畜；本处译作“羊”最直接，并符合逾越节语境。
- source_word: μόσχους
  choice: 牛犊
  rationale: μόσχος常指幼牛；“牛犊”既准确又符合现代汉语表达，且不额外限定公母。
- source_word: ὁ ἀδελφὸς
  choice: 他的兄弟
  rationale: 定冠词加“兄弟”在此最自然地说明拿但业与前一位人物的关系；希腊文没有明确写出所属者，因此中文采用最顺畅但仍保留一定语境依赖的表达。
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: 给了利未人
  rationale: 按动词与间接受词的直白句法翻译，不将其行政意义扩译为“供应”或“配给”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名按希腊文形式音译；句序略作汉语化处理，把“供逾越节使用”置于数量宾语之后。正文中的[a]与文本差异脚注相对应。
