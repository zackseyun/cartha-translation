base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: zh_hans
  text: 因为祭司们一直把脂油〔a〕献上，直到晚上；利未人也为自己和他们的弟兄——亚伦的子孙、祭司们——作了预备。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέφερον
  choice: 献上
  rationale: 在献祭语境中，ἀναφέρω指把祭物献在坛上。汉语“献上”自然体现祭祀含义；句中的持续过程由“直到晚上”充分表达。
- source_word: τὰ στέατα
  choice: 脂油
  rationale: στέαρ在此指献在坛上的祭牲脂肪。“脂油”是现代汉语圣经祭祀语境中清楚而庄重的表达。
- source_word: ἕως ὀψίας
  choice: 直到晚上
  rationale: 直接保留时间界限，不增添“夜幕降临”或“很晚”等原文未明说的意味。
- source_word: ἡτοίμασαν
  choice: 预备好了
  rationale: 原文未明说所预备之物，故不擅自补出“食物”或“份”；“预备好了”在汉语中可自然使用绝对宾语省略。
- source_word: ἑαυτοῖς
  choice: 为自己
  rationale: 直接表达反身与格，说明利未人也为自身预备。
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: 他们的弟兄，就是……祭司
  rationale: 保留ἀδελφοῖς的男性亲属／同族称谓，并以“就是”清楚表达“弟兄”与“祭司”的同位关系。
- source_word: υἱοῖς Ἀαρών
  choice: 亚伦子孙中的
  rationale: “亚伦子孙”保留传统祭司谱系称谓；加“中的”使汉语明确表达这些弟兄是亚伦子孙中的祭司，而不是把所有亚伦子孙逐一等同于眼前所指人员。
theological_decisions:
- issue: 祭司与利未人的弟兄关系（ἀδελφοῖς）
  choice: 他们的弟兄
  alternative: 他们的同族人／同胞
  rationale: 希腊文明确使用阳性复数“弟兄”。译作“弟兄”既保留男性祭司群体的表述，也不把其具体关系过度解释为现代意义的亲兄弟。
- issue: “亚伦子孙”与“祭司”的句法关系
  choice: 就是亚伦子孙中的祭司
  alternative: 祭司——他们的弟兄、亚伦的子孙
  rationale: 希腊文将“亚伦的儿子们／子孙”作为对祭司的进一步界定。中文以同位结构表达，避免误读为利未人和祭司之外的第三类对象。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“脂油”“亚伦子孙”保留献祭与祭司谱系的传统语域；不补出原文省略的预备对象，也不根据近似的马所拉平行经文改写希腊文本。
