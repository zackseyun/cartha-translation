revisions:
- from: 因为祭司们把脂油献上，直到晚上；利未人也为自己和他们的弟兄，就是亚伦子孙中的祭司，预备好了。
  to: 因为祭司们一直把脂油〔a〕献上，直到晚上；利未人也为自己和他们的弟兄——亚伦的子孙、祭司们——作了预备。
  rationale: 修订以“一直”对应献祭动词的未完成时，并将“预备好了”调整为不额外强调结果状态的“作了预备”。末句按希腊文的同位结构，将祭司称为利未人的弟兄，并进一步标明他们是亚伦的子孙。新增脚注保留στέατα可译为“脂肪部分”的词义信息及其献祭语境。
