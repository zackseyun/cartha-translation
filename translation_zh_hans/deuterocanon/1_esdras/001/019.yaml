revisions:
- from: 以色列所有的王都没有守过像约西亚[a]所守的这样一个逾越节；祭司、利未人、犹大人[b]，以及当时住在耶路撒冷的全体以色列人，也都一同守了这个节。[c]
  to: 以色列所有的王都没有守过像约西亚[a]以及祭司、利未人、犹大人[b]和在耶路撒冷被找到的全体以色列人一同所守的这样一个逾越节。
  rationale: 修订保留希腊文“所有以色列的王”及“这样的……像……”的比较力度，并将后列群体与约西亚共同守节的关系自然纳入中文定语结构。以“在耶路撒冷被找到的”保留εὑρεθέντες的措辞与其语义余地，不将其定死为“当时住在”；脚注说明可行的语境理解。脚注c仍予保留以交代礼仪动词及末尾短语，故在正文中未设锚点。
