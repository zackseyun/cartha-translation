base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: zh_hans
  text: 以色列所有的王都没有守过像约西亚[a]以及祭司、利未人、犹大人[b]和在耶路撒冷被找到的全体以色列人一同所守的这样一个逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“约西阿斯”（Ἰωσείας）；希伯来文平行经文中的同一位君王名为“约西亚”。
    reason: cross_reference
  - marker: b
    text: “犹大人”也可译作“犹太人”；这里较可能强调他们与犹大地区及族群的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον πάσχα
  choice: 守逾越节
  rationale: ἄγω本义为“带领、带来”，但与πάσχα连用时是举行、遵守逾越节的习惯表达；汉语“守逾越节”自然且符合礼仪语境。
- source_word: τοιοῦτον οἷον
  choice: 像……这样的一个
  rationale: 保留希腊文关联比较结构，强调历代诸王所守的逾越节没有一个与约西亚所守的相同。
- source_word: Ἰωσείας
  choice: 约西亚
  rationale: 采用现代中文圣经读者熟悉的同一人物名称；脚注说明希腊文使用希腊化形式，避免误以为是另一人物。
- source_word: Ἰουδαῖοι
  choice: 犹大人
  rationale: 在这一历史语境中主要指与犹大地区及族群相关的人；“犹大人”比“犹太人”更能保留其地理—族群色彩。
- source_word: πᾶς Ἰσραὴλ
  choice: 全体以色列人
  rationale: 保留集合性和范围广泛的说法，不将其缩限为犹大国居民。
- source_word: οἱ εὑρεθέντες ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: 当时住在耶路撒冷的
  rationale: 希腊文直译近于“被发现住在耶路撒冷的”；在本语境中指当时在耶路撒冷居住或在场的人。加入“当时”自然表达εὑρεθέντες的情境意味。
theological_decisions:
- issue: “以色列所有的王”的范围
  choice: 照希腊文保留宽泛的历史性陈述，不缩限为犹大诸王
  alternative: 以色列和犹大的历代君王／从前的诸王
  rationale: 希腊文明确作πάντες οἱ βασιλεῖς τοῦ Ἰσραήλ。译文不以《历代志》的平行叙述来收窄或协调其范围。
- issue: 后列群体与约西亚之间的句法关系
  choice: 按语义理解为祭司、利未人、犹大人及全体以色列人与约西亚共同守节，并用分号和“一同”使中文句子完整
  alternative: 机械保留“约西亚守了，祭司、利未人……”的并列悬置结构
  rationale: 希腊文以连续καί连接约西亚和各群体，第二个ἤγαγεν可统摄后续并列主语。中文若完全照搬会形成残句；补出“一同守了这个节”明确隐含谓语，却不改变参与者范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“守逾越节”沿用自然的宗教历史表达；以“犹大人”保留时代性的族群—地域含义。主句使用分号化解希腊文连续并列在中文中的歧义，并以脚注保留其句法紧凑性及另一种较直译读法。
