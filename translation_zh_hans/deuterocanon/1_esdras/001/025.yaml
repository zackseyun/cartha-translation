base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: zh_hans
  text: 难道主上帝不是差我来攻打你的吗？因为我的战事在幼发拉底河一带[a]。现在主与我同在，主与我同在，催促我前进[b]。你退开吧，不要与主作对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在幼发拉底河那里”或“幼发拉底河边”。希腊文说明尼哥出征的地点；希伯来文平行经文具体说是幼发拉底河畔的迦基米施。
    reason: lexical_alternative
  - marker: b
    text: 或译“催我加速前进”或“使我加速前进”。希腊文分词表示主正在催促、推动这次军事行动加快进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  choice: 难道……不是差我来攻打你的吗
  rationale: 保留希腊文反问句式及 πρός 在军事语境中的敌对意味，也不消解它与下句“战事是在幼发拉底河一带”之间的张力。
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: 主上帝
  rationale: 自然表达希腊文“主、上帝”，不增添“我的”等原文没有的限定。
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου
  choice: 是在幼发拉底河一带
  rationale: ἐπί 加属格在这里标明战事所在区域；“一带”符合现代汉语的军事地理表达，同时避免过度限定为河面或某个具体地点。
- source_word: ὁ πόλεμός μού ἐστιν
  choice: 我的战事是
  rationale: 保留第一人称所属强调；“战事”比“战争”更适合指当前军事行动。
- source_word: μετʼ ἐμοῦ
  choice: 与我同在
  rationale: 保留原文两次重复的神圣支持公式，不解释为较强的“站在我这一边”。
- source_word: ἐπισπεύδων
  choice: 催我赶快前进
  rationale: 表达该分词所含催促、加速行动的意思，并贴合行军语境。
- source_word: ἀπόστηθι
  choice: 你退开吧
  rationale: 命令对方退出、停止干预；“退开”自然且不把动作过度具体化为撤军。
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: 不要与主作对
  rationale: 简洁保留敌对含义，并维持尼哥声称阻挡他就是抵挡主的神学张力。
theological_decisions:
- issue: 尼哥话语中 κύριος 的所指
  choice: 各处均译作“主”，呈现尼哥宣称自己受主差遣并有主同在。
  alternative: 译作泛称的“神明”，或明确解释为尼哥自己的神。
  rationale: 希腊文使用 Κυρίου τοῦ θεοῦ 和 Κύριος；译文应保留这一神圣授权的宣称，而不替叙述者判定该宣称的最终性质。
- issue: 反问句与幼发拉底河战事之间的张力
  choice: 按希腊文保留“难道……不是差我来攻打你的吗”及随后“我的战事是在幼发拉底河一带”。
  alternative: 顺应上下文改译为“主上帝并没有差我来攻打你”。
  rationale: 现有希腊文本的 οὐχί 通常构成期待肯定回答的反问。即使语境似乎支持否定陈述，也不宜无文本依据地消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主与我同在”按原文完整重复，以保留修辞力度；不将尼哥关于神圣授权的宣称改写成叙述者的认定。
