base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: zh_hans
  text: 尼布甲尼撒王曾使他奉主的名起誓[a]，他却背弃誓言，反叛了[b]；他又使自己的颈项和心刚硬，违背了主、以色列的上帝的律例[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“由尼布甲尼撒王使其起誓”或“尼布甲尼撒王令其起誓”。这里指他所立的誓言与对王的效忠有关。
    reason: 说明被动分词ὁρκισθείς及介词ἀπό所表达的来源／施事关系，同时避免把原文未明说的具体方式限定为“命令”。
  - marker: b
    text: “反叛”很可能是指反叛尼布甲尼撒王，但希腊文没有再次明说对象。
    reason: 保留原文宾语省略所形成的语义空间。
  - marker: c
    text: “律例”也可译作“法规”或“典章”。
    reason: 说明νόμιμα的主要词义范围。
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: 照尼布甲尼撒王的要求起誓
  rationale: ὁρκισθείς是被动形式，ἀπό通常标明来源或施事者。译文保留“王使他起誓”的方向，同时用自然汉语表达；不直接改成“向王起誓”，以免抹去希腊文的被动结构。
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: 奉主的名
  rationale: 与起誓语境相合，表示以主的名作为誓言的庄严凭据；“奉……的名”是自然且庄重的现代汉语。
- source_word: ἐφιορκήσας
  choice: 背弃誓言
  rationale: 该词指违背已经立下的誓言。“背弃誓言”比“作伪誓”更准确地表达先立誓、后毁约的次序。
- source_word: ἀπέστη
  choice: 反叛了
  rationale: 在君王与宗主权的语境中指背叛或反抗；不在正文补出宾语，以保留希腊文的省略。
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: 硬着颈项和心
  rationale: 保留圣经中表示顽梗抗拒的身体隐喻，并让同一分词同时支配“颈项”和“心”，贴近原文结构。
- source_word: παρέβη
  choice: 违背了
  rationale: 表达越过、触犯神所规定界限的法律与盟约意味，现代汉语清楚自然。
- source_word: τὰ νόμιμα
  choice: 律例
  rationale: 该复数名词指既定的法规、典章或条例。“律例”兼具法律色彩和圣经语体，又不局限于单一形式的法律。
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: 以色列的主上帝
  rationale: 按希腊文紧密的属格称号处理，保留“主”和“上帝”两个神圣称谓及其与以色列的关系。
theological_decisions:
- issue: 起誓关系中尼布甲尼撒王的角色
  choice: 照尼布甲尼撒王的要求起誓
  alternative: 向尼布甲尼撒王起誓
  rationale: 希腊文的被动分词和ἀπό较自然地指王是使其起誓的一方；但誓言实际涉及对王的效忠。正文保留施事方向，脚注说明语义关系。
- issue: 反叛的对象是否明说
  choice: 反叛了
  alternative: 反叛尼布甲尼撒王
  rationale: 上下文很可能以尼布甲尼撒为对象，但ἀπέστη没有明说宾语；不在正文补足，以保存原文的含蓄。
- issue: κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 翻译所据文本是希腊文，κύριος本身是称号“主”；不把希伯来神名形式直接引入正文。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“背弃誓言”“反叛”“律例”保留叙事的法律—盟约语气；“硬着颈项和心”保留原文鲜明的圣经隐喻。所有脚注标记均在正文按出现顺序列出。
