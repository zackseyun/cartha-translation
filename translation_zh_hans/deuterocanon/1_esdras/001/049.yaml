base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: zh_hans
  text: 但他们嘲弄上帝的使者[a]；每逢主说话，他们总拿他的先知取笑。直到上帝因自己民族的不敬虔行为向他们发怒，下令派迦勒底诸王[b]上来攻击他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”；这里与“他的先知”并列，较可能指上帝差遣的人间使者。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作“迦勒底诸王”（复数）；《历代志下》36章的希伯来文平行记载则着重提到巴比伦王尼布甲尼撒。正文依从《以斯拉一书》的希腊文本。
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: 嘲弄
  rationale: 该动词表示带着轻蔑的讥笑；“嘲弄”既准确又符合现代汉语书面表达。
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: 上帝的使者
  rationale: ἄγγελος本义为受差遣传信者；此处与后文“他的先知”并列，语境较支持人间使者，而“天使”这一可能译法保留在脚注中。补出“上帝”以明确希腊文代词所指。
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: 每逢主说话
  rationale: 按语境将时间表达理解为反复发生的情形，比直译“在主说话的那一天”更自然，也与持续式ἦσαν ἐκπαίζοντες相配。
- source_word: ἦσαν ἐκπαίζοντες
  choice: 总拿……取笑
  rationale: 迂回未完成时表达持续或惯常行为；“拿……取笑”保留把先知当作戏弄对象的意味，并避免与前句“嘲弄”机械重复。
- source_word: θυμῶντα αὐτὸν ἐπὶ τῷ ἔθνει αὐτοῦ
  choice: 上帝因自己国民……而发怒
  rationale: 将希腊文分词结构转成自然汉语；ἔθνος在此指属于上帝的民族共同体，“国民”比泛称“人们”更贴近原词。
- source_word: δυσσεβήματα
  choice: 不敬虔行为
  rationale: 该词特指对上帝不虔不敬的行为；此译保留宗教含义，而不泛化为一般的“恶行”。
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: 下令调遣……来攻打他们
  rationale: ἀναβιβάσαι为及物不定式，字面是使军队上来；“调遣……来攻打”保留使役和军事进犯的语境，不把命令对象强行认定为诸王本人。
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: 迦勒底诸王
  rationale: 忠实保留希腊文本的复数“诸王”，不按《历代志下》的希伯来文平行记载改成单数。
theological_decisions:
- issue: ἀγγέλοις在审判叙事中指人间使者还是天使
  choice: 正文译作“使者”，理解为上帝差遣的人间传信者
  alternative: 天使
  rationale: 紧接着的平行成分是“他的先知”，因此人间使者更合语境；脚注保留词义上的另一可能，不对天使论作额外推断。
- issue: 是否按希伯来文平行传统把“迦勒底诸王”协调为单数
  choice: 保留希腊文复数“迦勒底诸王”
  alternative: 迦勒底王／巴比伦王尼布甲尼撒
  rationale: 本段以《以斯拉一书》的希腊文本为首要依据；平行的希伯来传统可供比较，却不应覆盖现存希腊文的复数形式。
- issue: 上帝发怒与百姓不敬虔行为之间的关系
  choice: 保留明确的因果关系
  alternative: 仅作时间上的先后叙述
  rationale: διὰ τὰ δυσσεβήματα明确说明发怒的缘由；译文不弱化审判与行为之间的联系，也不添加原文未说明的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每逢……总……”呈现反复、持续的讥嘲；将较拗口的希腊文分词与不定式链拆成两句，以清楚表达罪行、上帝发怒和外敌进犯之间的推进关系。称谓“主”依原文Κύριος保留；代词容易含混处补出“上帝”。
