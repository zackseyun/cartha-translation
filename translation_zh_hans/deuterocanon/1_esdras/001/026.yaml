    rationale: 该说法虽试图表达希腊文的趋向和军事语境，但现代汉语搭配略显别扭。“转身退回自己的战车”更通顺，脚注可保留原文方向及动作关系的歧义。
  - severity: low
    issue: “从主口中所传的话”修饰关系不够清晰。
    rationale: “所传”不是原文明确出现的动词，且该结构可能使读者停顿于“谁从谁口中传话”的关系。改为“所说、出于主口的话”可清楚表达耶利米的话具有出于主的来源。
  revised_text: 约西亚没有转身退回自己的战车[a]，反而试图与他交战，不理会先知耶利米所说、出于主口的话。
