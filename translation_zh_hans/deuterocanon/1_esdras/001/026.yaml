revisions:
- from: 约西亚却没有转身退向自己的战车[a]，反而试图与他交战，不听从先知耶利米从主口中所传的话。
  to: 约西亚没有转身退回自己的战车[a]，反而试图与他交战，不理会先知耶利米所说、出于主口的话。
  rationale: 修订使汉语更自然，并将“οὐ προσέχων”译为“不理会”，避免把留意或听取的话语限定为服从命令。以“所说、出于主口的话”明确保留耶利米话语与主的口之间的双重归属，且不添加“传达”等原文未明说的机制。脚注保留“转向／撤退到或撤向”这一压缩希腊表达的开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:04Z'
