base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: zh_hans
  text: 约西亚没有转身退回自己的战车[a]，反而试图与他交战，不理会先知耶利米所说、出于主口的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有转向自己的战车。”希腊文表达较为紧缩，可能指他没有撤退到或撤向自己的战车。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: 没有转身退向
  rationale: 反身结构表示使自己转回或撤退；“转身退向”兼顾动作方向与军事语境，又不把动机说得过满。
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: 向自己的战车
  rationale: ἐπί加宾格在此表示趋向；希腊文表达较压缩，因此正文保留“向”，脚注说明也可能理解为退回战车。
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: 试图与他交战
  rationale: ἐπιχειρέω加不定式表示尝试或着手做某事；“与他交战”自然表达 πολεμεῖν αὐτόν。
- source_word: οὐ προσέχων
  choice: 不听从
  rationale: προσέχω与间接受格连用可表示留意、听从；此处涉及对先知话语的回应，“不听从”符合语境，同时保留抗拒劝告的力度。
- source_word: ῥήμασιν
  choice: 所传的话
  rationale: ῥήματα指说出的话语；加“所传”使现代汉语句法自然，并明确耶利米是传达者而非话语源头。
- source_word: Ἰερεμίου προφήτου
  choice: 先知耶利米
  rationale: 采用现代汉语自然的称谓次序，意义与希腊文一致。
- source_word: ἐκ στόματος Κυρίου
  choice: 从主口中所传
  rationale: 保留“从口中”这一明确的源语意象，彰显话语源自主，同时以“所传”连接耶利米的先知角色。
- source_word: Κυρίου
  choice: 主
  rationale: 在此神圣称谓语境中将 κύριος 译作“主”，简洁、庄重，并符合中文圣经传统用语。
theological_decisions:
- issue: “从主口中”所表达的先知权威
  choice: 保留“从主口中”的明确意象，表明耶利米所传的话被叙述为源自主。
  alternative: 简化为“从主而来的话”。
  rationale: 原文明确使用“口”这一隐喻；保留它可避免削弱经文对神圣话语来源的强调。
- issue: οὐ προσέχων 所表达的约西亚回应
  choice: 译为“不听从”。
  alternative: 译为“不留意”或“不听”。
  rationale: “不听从”较清楚地呈现他没有接受并照着先知话语行事，但不进一步推断他的内在动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却……反而……”呈现 οὐκ…ἀλλά 的鲜明转折；保留“从主口中”这一源语意象。正文中的脚注标记与脚注完全对应。
