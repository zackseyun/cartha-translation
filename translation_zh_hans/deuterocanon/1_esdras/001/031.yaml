base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: zh_hans
  text: 为以色列全族。这些事都记在《犹大诸王史》[a]中。约西亚所行的每一件事、他的荣耀、他对主的律法的领悟，以及他所做的事和如今所记述的事，都记在《以色列和犹大列王记》中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大诸王史”直译为“记述犹大诸王之事的书”，可能指王室史籍或档案；也可译作“犹大诸王记录册”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: 全族
  rationale: 在εἰς πᾶν τὸ γένος Ἰσραήλ中指以色列整个血缘共同体或民族；“全族”既保留亲族含义，也符合现代汉语的经文语体。
- source_word: ἀναγέγραπται
  choice: 都记在……上
  rationale: 完成时被动态表示已经写下并留存于记录中；此译自然地体现文献记载的含义。
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: 《犹大诸王史》
  rationale: 该短语指记述犹大诸王事迹的史书或档案；以书名号呈现来源文献，同时在脚注保留“记录册”的可能理解。
- source_word: τὸ καθʼ ἓν πραχθὲν
  choice: 一件件事迹
  rationale: καθʼ ἕν有逐一、每一项之意，与πραχθέν合用时译作“一件件事迹”简洁自然，并保留逐项记述的意味。
- source_word: δόξης
  choice: 荣耀
  rationale: 这里可指约西亚显赫的声望或尊荣；“荣耀”直接对应原词，也符合庄重的圣经语体。
- source_word: συνέσεως
  choice: 领悟
  rationale: 该词在“主的律法”这一范围中表示理解力或洞察；“领悟”比抽象的“聪明”更明确地表达他对律法的理解。
- source_word: νόμῳ Κυρίου
  choice: 主的律法
  rationale: 按希腊文本将κύριος译为“主”，并采用现代汉语中自然、通行的所属结构。
- source_word: τά τε πραχθέντα ὑπʼ αὐτοῦ
  choice: 他所做的事
  rationale: 保留被动分词所表达的“由他做成之事”，同时避免汉语过度生硬。
- source_word: τὰ νῦν ἱστόρηται
  choice: 刚才叙述的
  rationale: 原文末段结构不顺；此译保留“如今正在叙述／现已叙述”的指向，不擅自消除其含混。
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: 《以色列和犹大列王记》
  rationale: 将其作为所引来源书名处理，保留希腊文中“以色列和犹大诸王”的措辞。
theological_decisions:
- issue: νόμῳ Κυρίου中κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 底本是希腊文Κυρίου，并未直接出现希伯来神名；译作“主”最贴近希腊文本，也避免加入特定宗派用语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用书名号标示两部来源文献；破折号帮助读者把握末段较复杂且略显拗口的希腊句法。开头“为以色列全族”保留本节承接上文的残句性质，不补入原文没有的谓语。
