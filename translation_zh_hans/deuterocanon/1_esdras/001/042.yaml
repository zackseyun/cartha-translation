base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: zh_hans
  text: 他在耶路撒冷作王三个月零十天，并在主面前行了恶事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行了主眼中看为恶的事。”
    reason: 说明 ἔναντι Κυρίου 在此可按神的察看和评判来表达。
lexical_decisions:
- source_word: βασιλεύει
  choice: 作王
  rationale: 该动词表示执掌王权；结合叙事语境，汉语用“作王”自然地表达其在位经历。希腊文使用历史现在时，译文依上下文采用过去叙事语气。
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: 三个月零十天
  rationale: 准确表达在位时长；“零”符合现代汉语连接月份与额外天数的习惯。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 保留地点含义，表明其作王的所在地或王权中心。
- source_word: ἐποίησεν τὸ πονηρόν
  choice: 行了恶事
  rationale: 希腊文冠词化中性形容词 τὸ πονηρόν 指道德上的恶；“行了恶事”简洁、庄重，并保留圣经表达方式。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: 直译其处于主面前、受主评判的含义，不将这一表达仅限缩为视觉层面的“主眼中”。
- source_word: δὲ
  choice: 并
  rationale: 此处用于衔接在位时长与道德评价；汉语以“并”自然连接两个叙述分句。
theological_decisions:
- issue: Κυρίου 的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要底本是希腊文，原文作 Κυρίου；因此按希腊文本译为“主”，不根据近似的希伯来文平行材料反向引入神名。
- issue: ἔναντι Κυρίου 所表达的神圣评判
  choice: 在主面前
  alternative: 主眼中看为
  rationale: “在主面前”保留原文空间性与评判性的双重意味；“主眼中看为”是合乎语境的解释性译法，列入脚注而不取代正文。
translation_notes:
  register: 采用现代、简明而庄重的叙事语体。“作王”“行了恶事”“在主面前”均为普通读者易懂且保留经文风格的表达；脚注标记紧随其所说明的整段措辞。
