translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“离世”保留原文委婉语气，“祖坟”兼顾πατρικός的祖先含义和τάφος的单数形式。分号呈现原文两个相继阶段，避免过度拆分叙事。
