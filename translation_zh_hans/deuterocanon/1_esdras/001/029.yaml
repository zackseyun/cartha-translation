base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: zh_hans
  text: 他上了自己的第二辆战车；被送回耶路撒冷后，他便离世[a]，葬在祖坟里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离世”所译的希腊语短语，字面近于“改变／结束了他的一生”，是死亡的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: 《历代志下》35:24的希伯来文平行记载说“他自己的第二辆车”，并补充犹大全地和耶路撒冷都为约西亚哀悼；本节希腊文较短，并使用单数“坟墓”。
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη
  choice: 上了
  rationale: 该动词本义为“上去、登上”；与战车连用时，现代汉语自然表达为“上了……战车”，同时保留原文所写的登车动作。
- source_word: τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: 自己的第二辆战车
  rationale: ἅρμα指“战车”，第二辆在此指属于他的另一辆、备用或次一级战车；译文保留明确的序数“第二辆”，不将其泛化为“另一辆”。
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: 被送回耶路撒冷后
  rationale: 被动分词表明他是被带回或送回，而非单纯自行返回；“送回”符合上下文，也自然传达恢复至原处的含义。
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: 离世
  rationale: 该短语字面涉及“改变／结束生命”，实际是表示死亡的希腊语委婉说法。“离世”在现代汉语中庄重自然，且避免“结束自己的一生”可能引出的自杀歧义；脚注保留其字面特色。
- source_word: ἐτάφη
  choice: 葬在
  rationale: 准确表达被动的安葬事件；汉语可通过上下文自然呈现被动含义，无须机械加入“被”。
- source_word: ἐν τῷ πατρικῷ τάφῳ
  choice: 祖坟里
  rationale: πατρικός表示祖先或父辈所有，τάφος在希腊文中为单数。“祖坟”既自然表达家族先祖的墓地，也保留单一祖墓的整体概念。
