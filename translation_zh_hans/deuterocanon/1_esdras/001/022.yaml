base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: zh_hans
  text: 有关他的事，在早先的时代也已有记载，论到那些犯罪、行恶、得罪主的人；他们的罪恶超过任何国家和王国[a]，并使他深感忧伤[b]；主的话起来攻击以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比任何国家和王国更甚。”这里的希腊文表达比较，意思是他们的罪恶超过任何国家和王国。
    reason: lexical_alternative
  - marker: b
    text: “深感忧伤”处的希腊文本有疑难：在“使他忧伤”之后，传本文字为ἔστω（通常意为“愿……如此”或“让……如此”），在这里很突兀。正文按加强语气处理；也可能是文本在流传中发生了轻微讹误。
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: 有关他的事
  rationale: 保留该短语宽泛的概括性，不把它限定为“事迹”或“行为”。
- source_word: ἀναγέγραπται
  choice: 已经记载
  rationale: 体现完成时被动语态，表示这些事已形成书面记录，并仍可查考。
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: 在先前的时代
  rationale: 按希腊文保留时间表达，不擅自补出原文未明说的“史册”。
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: 涉及那些犯罪、行恶……的人
  rationale: 分别表达ἁμαρτάνω与ἀσεβέω的道德及敬虔层面，同时采用现代汉语易懂的说法。
- source_word: εἰς τὸν κύριον
  choice: 得罪主
  rationale: 在敌对和道德过犯的语境中，εἰς具有针对之意；“得罪主”比直译“向着主”自然。
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: 罪恶超过各国各邦
  rationale: παρά加宾格在此表达比较或超越；补出“罪恶”使中文比较对象清楚，同时以脚注保留另一种表达可能。
- source_word: ἐλύπησαν αὐτόν
  choice: 使他深感忧伤
  rationale: 保留经文将忧伤归于主的拟人性语言，不弱化为单纯的“激怒”。
- source_word: ἔστω
  choice: 深
  rationale: 传本文字在此语境中十分突兀；正文依上下文将其作为加强语气处理，并在脚注说明文本疑难。
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: 主的话便起来攻击以色列
  rationale: 保留ἀνέστησαν的动态意象，以及ἐπί在审判语境中的敌对含义。
theological_decisions:
- issue: κύριος在希腊文次经历史叙事中的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 原文为κύριος，译作“主”既直接，也不把希腊文本未明示的专名形式引入正文。
- issue: ἐλύπησαν αὐτόν对上帝忧伤的描述
  choice: 使他深感忧伤
  alternative: 激怒了他；使他愤慨
  rationale: 希腊文明确使用“使忧伤”的动词；译文保留这种神学张力，不将其改释为另一种情感。
- issue: 主的话在审判中的行动性
  choice: 主的话便起来攻击以色列
  alternative: 主的话临到以色列；主的话指控以色列
  rationale: 保留希腊文将“主的话”人格化并主动施行审判的鲜明表达，不预先限定为预言临到或法庭指控。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各国各邦”兼顾ἔθνος与βασιλεία的区别；分号保留末句转入审判宣告的力度。脚注标记均置于对应疑难词句之后。
