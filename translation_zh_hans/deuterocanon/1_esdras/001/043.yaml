base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: zh_hans
  text: 一年后，尼布甲尼撒派人把他连同主的圣器皿一起带到巴比伦[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掳到巴比伦”。希腊文动词可表示转移，也可表示放逐。
    reason: 保留μετήγαγεν在一般转移与强制迁徙之间的语义幅度。
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: 一年后
  rationale: μετά加宾格表示经过一段时间；“一年后”自然、简洁，并忠实表达时间推移。
- source_word: ἀποστείλας
  choice: 派人
  rationale: 分词字面为“派出”；希腊文未明说所派何人，汉语用“派人”可自然表达其使者执行后续行动，而不具体限定其身份。
- source_word: μετήγαγεν
  choice: 带到
  rationale: 该动词表示将人从一处转移到另一处；“带到”保留移动和目的地，至于是否强调强制放逐，则留在脚注中说明。
- source_word: αὐτόν
  choice: 他
  rationale: 依照希腊文使用代词，承接上文所指的人，不在本节中补入姓名或身份。
- source_word: ἅμα τοῖς ἱεροῖς σκεύεσιν
  choice: 连同……圣器皿一起
  rationale: ἅμα在此表示伴随；这一表达清楚说明此人与圣器皿一同被运往巴比伦。ἱερά σκεύη直译为分别为圣的器具，故译“圣器皿”。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 以希腊文κύριος为主要依据，译作“主”；属格在此表达器皿归属于主。
theological_decisions:
- issue: 次经历史叙事中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要文本见证是希腊文κυρίου，本身没有拼写神名；因此译为“主”，不根据平行传统反向补入“耶和华”。
- issue: 是否把器皿明确译成圣殿器皿
  choice: 圣器皿
  alternative: 圣殿的器皿
  rationale: 希腊文只说“主的圣器皿”，虽从语境可知与圣殿有关，但正文不补入原文没有的“圣殿”，以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“派人把他……带到”符合现代汉语表达，并保留执行者未明的特点。句末保留逗号，以对应原文此处句意尚未完结。
