base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: zh_hans
  text: 他们作他和他儿子们的仆役，直到波斯人掌权，以应验主借耶利米之口所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: 仆役
  rationale: 这里描述的是受制于君王及其后代、为他们服役的人，并非年幼者或亲生儿女。“仆役”既符合政治臣服的语境，也不把其法律身份过度限定为奴隶。
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: 直到波斯人掌权
  rationale: 此结构指向波斯统治的开始。“掌权”自然表达从先前王朝到波斯统治的历史转折，同时保留“波斯人”为复数群体的形式。
- source_word: εἰς ἀναπλήρωσιν
  choice: 以应验
  rationale: 该短语表达历史事件与先知之言得到成全之间的目的或结果关系。“以应验”简洁，并符合现代中文的圣经叙事语体。
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: 主……所说的话
  rationale: ῥῆμα在此指主所发出的先知性话语；采用“所说的话”使中文句法完整清楚，又保留其具体言说的意味。
- source_word: ἐν στόματι Ἰερεμίου
  choice: 借耶利米之口
  rationale: 保留原文“在耶利米口中”的先知传言公式，同时用“借”清楚表达主通过耶利米传达话语。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节的直接翻译依据是希腊文κύριος；译作“主”忠实反映该希腊见证，不依据可能的希伯来语背景反向改写为神名。
- issue: 本节与所给马所拉文本平行材料的关系
  choice: 按希腊文本译为服役持续到波斯掌权，并使先知之言应验
  alternative: 依所给希伯来平行材料改写为圣殿器皿被带到巴比伦
  rationale: 所给希伯来材料与本节希腊文内容并不对应，且已注明仅为近似平行；因此不以它覆盖《以斯拉一书》的现存希腊文本。
- issue: 应验关系的性质
  choice: 以应验
  alternative: 结果就应验了
  rationale: εἰς ἀναπλήρωσιν可包含目的与结果的张力；“以应验”不强行将其限定为纯粹目的或纯粹结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“仆役”避免把παῖδες过度具体化为“奴隶”；“借耶利米之口”保留先知传言的圣经惯用表达。
