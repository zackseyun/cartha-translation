base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/034.yaml
  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: zh_hans
  text: 他罚[a]这国的人民缴纳一百他连得[b]银子和一他连得金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使这国的人民蒙受损失。”原文动词可指使人受损或处以罚款；这里列出银子和金子的数额，语境表明涉及惩罚性缴款。
    reason: lexical_alternative
  - marker: b
    text: “他连得”是古代的重量兼价值单位，实际重量因时代和地区而异。
    reason: historical_measure
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: 罚……缴纳
  rationale: 该动词可指使人遭受损失或处以惩罚；这里紧接银、金的数额，因此译出惩罚性缴款的含义，同时避免将其弱化为一般征税。
- source_word: τὸ ἔθνος
  choice: 这国民
  rationale: ἔθνος在此集体指受辖制的民众；“国民”兼顾其群体和政治含义，并比“国家”更适合作为缴纳罚款的对象。
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: 一百他连得银子
  rationale: 保留古代重量兼价值单位“他连得”，并按现代汉语自然语序表达金属与数额。
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: 一他连得金子
  rationale: 准确保留原文银子一百他连得与金子一他连得之间的数量对比。
