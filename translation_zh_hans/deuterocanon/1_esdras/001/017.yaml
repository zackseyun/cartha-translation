base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: zh_hans
  text: 当时在场的以色列人守了逾越节，又守了七天的无酵节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在场的”直译为“被找到的”，指当时在场的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: 守了
  rationale: 该动词本义为“带领、举行”，但以“逾越节”和“无酵节”为宾语时，表示遵守或举行节期；“守了”符合现代汉语的经文语体。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对以色列群体的惯用称呼；译作“以色列人”自然、准确，且不把所指范围无依据地限于男性。
- source_word: οἱ εὑρεθέντες ἐν τῷ καιρῷ τούτῳ
  choice: 当时在场的
  rationale: εὑρεθέντες 字面是“被找到的”，结合时间短语在此指当时在场或可参与的人；正文采用自然汉语，脚注保留字面信息。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: 这是该犹太节期在现代中文圣经语境中的标准名称。
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: 无酵节
  rationale: 准确对应“无酵饼的节期”，采用现代中文通行节名。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 宾格表示持续时间；将“七天”紧接“守”表达节期持续七日。
