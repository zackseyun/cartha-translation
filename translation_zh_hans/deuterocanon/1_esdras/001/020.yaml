  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: zh_hans
  text: 约西亚在位第十八年，这次逾越节举行了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这次逾越节被带领（或办理）”；这里指逾越节得以举行。
    reason: lexical_alternative
  - marker: b
    text: 《历代志下》35章的希伯来文平行记载说，当时以色列人守了逾越节；这里的希腊文是对那次礼仪的简要概述。
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: 第十八年
  rationale: 与表示执政的属格独立结构合译为“在位第十八年”，自然表达时间背景。
- source_word: βασιλεύοντος Ἰωσείου
  choice: 约西亚在位
  rationale: 属格独立结构直指约西亚作王期间；采用现代汉语通行的圣经人名“约西亚”，既清楚又便于读者识别其与平行记载中的同一人物。
- source_word: ἤχθη
  choice: 举行了
  rationale: 该词本义为“被带领、被带来”，与“逾越节”连用时表示礼仪得以办理、遵守；“举行了”自然且不过度增添欢庆意味。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: 这是该犹太节期在现代汉语中的标准名称，希伯来语平行文本也支持这一理解。
- source_word: τοῦτο
  choice: 这一次
  rationale: 保留指示词对上文所述那次特定逾越节的回指；“这一次”比单说“这”更符合现代汉语。
