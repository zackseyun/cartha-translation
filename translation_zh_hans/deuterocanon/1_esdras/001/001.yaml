base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: zh_hans
  text: 约西亚在耶路撒冷向他的主守逾越节[a]；他们在正月十四日宰杀了逾越节的祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“向他的主”；《历代志下》35:1的希伯来文平行经文作“向耶和华”。
    reason: 说明希腊文主要底本与希伯来文平行经文之间的措辞差异。
lexical_decisions:
- source_word: ἤγαγεν
  choice: 守
  rationale: 该动词本义为“带领、带来”，但与逾越节连用时表达举行、遵守节期；“守逾越节”既符合现代汉语的经文用语，也得到希伯来文平行经文 ויעשׂ 的语境支持。
- source_word: τὸ πάσχα（第一次）
  choice: 逾越节
  rationale: 第一次指整个节期及其礼仪，而非特指祭牲。
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: 向他的主
  rationale: 希腊文明确含有物主代词 αὐτοῦ，故保留“他的”；与格在此表示礼仪行动所归向的对象，译作“向”较自然。
- source_word: ἔθυσαν
  choice: 宰杀
  rationale: 此词在献祭语境中指杀祭牲；“宰杀”保留具体动作，也与希伯来文平行经文 וישחטו 相符。
- source_word: τὸ πάσχα（第二次）
  choice: 逾越节的祭牲
  rationale: 与“宰杀”连用时，πάσχα 转指逾越节祭牲。原文未明确说明是羊，故不缩窄为“逾越节羊羔”。
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου
  choice: 在正月十四日
  rationale: 时间与格译作“在……日”；“第一个月”按现代标准汉语的历法表达自然译为“正月”，不增添月份名称。
theological_decisions:
- issue: 次经希腊文本中的 κύριος 与希伯来文平行经文的神名
  choice: 主
  alternative: 耶和华
  rationale: 主要底本为希腊文，其用词是 κύριος，并且带有 αὐτοῦ（“他的”）；因此正文按希腊文译作“他的主”，不以希伯来文平行经文中的 יהוה 替换。
- issue: τῷ κυρίῳ αὐτοῦ 是否解释为“主他的神”
  choice: 他的主
  alternative: 主他的神／他的主上帝
  rationale: 希腊文没有 θεός（“神”）一词。为避免把解释写入正文，采用形式与意义均较贴近的“他的主”，并用脚注说明平行经文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“守逾越节”保留礼仪语境中的固定表达；用分号连接两个紧密相关的动作。脚注标记已置于其所说明的短语之后。
