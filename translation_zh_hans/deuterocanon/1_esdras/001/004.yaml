base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: zh_hans
  text: 你们不必把它扛在肩上[a]。现在，你们要事奉主你们的上帝，服事他的子民以色列，并按你们的宗族和支派做好准备[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指约柜；本节希腊文只用代词，所指由上文得知。
    reason: 说明隐含指代，避免在正文中把上下文信息改写成明说的名词。
  - marker: b
    text: 希腊文作“支派”；《历代志下》35:4的希伯来平行文作“班次”。
    reason: 保留希腊文本的直接词义，同时提示平行传统所反映的礼仪编组含义。
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  choice: 你们不必再把它扛在肩上
  rationale: 未来式 εἰμί 加与格在此表示不再有此需要；“扛在肩上”自然保留具体动作。αὐτήν 所指的约柜由上下文补明，正文仍以“它”保留本节的隐含指代。“再”体现当前安排改变后的语境含义。
- source_word: λατρεύετε
  choice: 事奉
  rationale: 该词在这里指向上帝的敬拜性、礼仪性服事；“事奉”既庄重又能与下文对以色列的服事区别开来。
- source_word: τῷ κυρίῳ θεῷ ὑμῶν
  choice: 主你们的上帝
  rationale: 贴近希腊语词序，也保留盟约称谓的庄重感。
- source_word: θεραπεύετε
  choice: 服事
  rationale: 此处表示照料、服务，与专用于上帝的“事奉”相区分，同时符合现代汉语用法。
- source_word: τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: 他的子民以色列
  rationale: ἔθνος 可指民族或国民；在“他的”这一关系性表达中译作“子民”较自然，且不增加宗派性解释。
- source_word: ἑτοιμάσατε
  choice: 做好准备
  rationale: 该命令在希腊文中未明说宾语；译作“做好准备”保留开放性，避免擅自限定准备的具体内容。
- source_word: κατὰ τὰς πατριὰς καὶ τὰς φυλὰς ὑμῶν
  choice: 按你们的宗族和支派
  rationale: πατριά 指父系宗族或家族群体，φυλή 的直接词义是支派。以希腊文为首要依据，正文保留“支派”；平行希伯来文本的“班次”另在脚注交代。
theological_decisions:
- issue: 如何区分对上帝与对以色列的两种服事
  choice: 将 λατρεύετε 译为“事奉”，将 θεραπεύετε 译为“服事”
  alternative: 两处都译为“服事”
  rationale: 希腊文刻意使用两个不同动词。中文用字上的区别既保留对上帝之敬拜性事奉与对其子民之服务的张力，也不把两者解释成互不相关的领域。
- issue: φυλάς 应按直接词义还是按希伯来平行文理解
  choice: 正文译作“支派”
  alternative: 依据《历代志下》35:4 的希伯来平行文译作“班次”
  rationale: 本项目以现存希腊文为首要翻译依据，而 φυλή 的通常含义是“支派”。平行希伯来文本可能反映礼仪编组的语境，但不足以在正文中取代希腊词的明确形式，故以脚注保存这一异文性线索。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“事奉／服事”保留两个希腊动词的差别；“宗族和支派”避免古奥的“父家”，也不让希伯来平行文覆盖希腊原文。末尾保留逗号，以反映本节句法尚未结束。
