  yaml_path: translation/deuterocanon/1_esdras/001/018.yaml
  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: zh_hans
  text: 从先知撒母耳的时代以来，以色列中从未举行过这样的逾越节。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: 举行过
  rationale: ἄγω的被动式在节期语境中表示礼仪被办理、举行；“举行过”是自然的现代汉语，并能配合完成性比较句。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα在此指以色列的逾越节庆典；“逾越节”是标准且清楚的译法。
- source_word: τοιοῦτο
  choice: 这样的
  rationale: τοιοῦτο表达同类比较，指像本次这样规模或性质的逾越节；“这样的”保留原文未具体说明比较层面的概括性。
- source_word: ἐν τῷ Ἰσραήλ
  choice: 以色列中
  rationale: 该短语指事件发生的群体或范围；“以色列中”简洁而略具经文庄重感。
- source_word: ἀπὸ τῶν χρόνων
  choice: 从……的时代以来
  rationale: 准确传达ἀπό的时间起点及持续至叙事当时的比较范围。
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: 先知撒母耳
  rationale: 原文明确称撒母耳为προφήτης；汉语自然语序为“先知撒母耳”。
theological_decisions:
- issue: 与希伯来平行经文不同的历史比较语
  choice: 从先知撒母耳的时代以来
  alternative: 从撒母耳先知的日子以来
  rationale: 希腊文明确以先知撒母耳的时代为比较起点，因此按主要原文直译；所给马所拉平行文本内容并不对应本句，不能据此删改希腊文的比较语。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“从……以来……从未……”自然呈现原文的历史比较；不补出原文没有说明的规模、隆重程度或礼仪细节。
