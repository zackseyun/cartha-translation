base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: zh_hans
  text: 他立西底家作犹太和耶路撒冷[a]的王。西底家二十一岁登基，在位十一年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“犹太和耶路撒冷”；这一处的希伯来平行传统通常作“犹大和耶路撒冷”。正文依《以斯拉一书》的希腊文本，没有按希伯来平行经文改写。
    reason: 说明希腊底本与希伯来平行传统在地名形式上的差异。
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: 立……作……王
  rationale: 该动词在此表示正式任命或拥立某人担任王职；“立……作……王”自然、庄重，也贴合王权语境。
- source_word: Σεδεκίαν
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的王名译法。
- source_word: βασιλέα τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: 作犹太和耶路撒冷的王
  rationale: 依希腊文本直译其统治范围，并保留“犹太和耶路撒冷”这一并列表达，不按希伯来平行传统改成“犹大和耶路撒冷”。
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: 二十一岁登基
  rationale: 按中文叙述君王年龄的习惯表达；结合前句受立为王的语境，“登基”明确体现这是即位年龄。
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  choice: 在位十一年
  rationale: “在位”是现代中文表达君王统治年数的标准说法，简洁而准确。
