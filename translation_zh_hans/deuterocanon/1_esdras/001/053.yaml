base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: zh_hans
  text: 他们把她一切华美之物全都毁坏了；他又在刀剑之下，把剩下的人[a][b]掳到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剩下的人”也可译作“幸存者”或“余下的人”。
    reason: lexical_alternative
  - marker: b
    text: “在刀剑之下”原文直译近于“带着刀剑”。这句话也可能把刀剑与前述毁灭联系得更紧，表示其余的人是在暴力征服之后被掳走；希伯来文平行经文着重描述用刀剑杀戮。
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν ... ἀχρειῶσαι
  choice: 全都毁坏了
  rationale: συντελέω与表示结果的ἀχρειόω不定式合用，表达彻底使之无用、毁坏殆尽。译为“全都毁坏了”既体现行动的完成，也比生硬的“使之成为无用”更符合现代汉语。
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: 她一切华美之物
  rationale: ἔνδοξα在这里指一切显赫、华美或珍贵之物；保留“她”，承接上下文中被拟人化的城，而不擅自把所指限定为圣殿器物。
- source_word: τοὺς ἐπιλοίπους
  choice: 剩下的人
  rationale: 指毁灭之后仍留下的人。“剩下的人”自然清楚，也避免“余民”可能附带的特定神学含义。
- source_word: ἀπήγαγεν
  choice: 掳到
  rationale: 该动词表示强行带走；“掳到”准确传达战败后被带往异地的处境，同时保持叙事语言的庄重。
- source_word: μετὰ ῥομφαίας
  choice: 在刀剑之下
  rationale: 希腊语直译近于“带着刀剑／伴随刀剑”。“在刀剑之下”保留暴力征服的意味，也不武断判定刀剑究竟直接修饰掳走，还是与前述毁灭关系更密切。
- source_word: εἰς Βαβυλῶνα
  choice: 到巴比伦
  rationale: 按方向意义自然译出，巴比伦可指城或其统治中心；本句无需进一步限定。
theological_decisions:
- issue: 复数“他们毁坏”之后转为单数“他掳走”的主语变化
  choice: 正文保留“他们……他……”的转换
  alternative: 将两处都统称为敌军，或明确补出“迦勒底王”
  rationale: 希腊原文确有复数到单数的转换。上下文可使“他”指巴比伦君王，但本节没有明说其身份，因此不在正文中补足，以免消除原文的叙事张力。
- issue: τοὺς ἐπιλοίπους是否译作带有神学色彩的“余民”
  choice: 剩下的人
  alternative: 余民；幸存者
  rationale: 本处首先描写战乱之后留下并被掳的人，并未明确发展“余民”神学主题；采用中性表达更贴近语境。
- issue: μετὰ ῥομφαίας与上下文的句法关系
  choice: 在刀剑之下
  alternative: 用刀剑；带着刀剑；其余的人则被掳到巴比伦，而刀剑用于前述毁灭
  rationale: 短语紧接ἀπήγαγεν，形式上可与掳走相连，但语义压缩，且希伯来平行经文强调刀剑杀戮。正文保留开放表达，脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“华美之物”保留复数实物含义，避免把πάντα τὰ ἔνδοξα抽象化为单纯的“荣耀”；分号清楚呈现希腊文由复数主语转为单数主语的变化。
