base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: zh_hans
  text: 约雅敬二十五岁登基，作犹太地[a]和耶路撒冷的王；他行了主眼中看为恶的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大和耶路撒冷。”希腊文本作“犹太地和耶路撒冷”，平行的希伯来传统通常作“犹大和耶路撒冷”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: 年二十五岁
  rationale: 这是希腊文常见的年龄表达；译文简洁庄重，也符合现代汉语叙事习惯。
- source_word: Ἰωακεὶμ
  choice: 约雅敬
  rationale: 采用现代中文圣经传统中对这位犹大王的通行译名；平行的希伯来传统也支持此人物认定。
- source_word: ὅτε ἐβασίλευσεν
  choice: 登基作……的王时
  rationale: 此处不定过去时与登基年龄公式连用，所指自然是开始作王，而非整个统治时期。
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: 犹太地和耶路撒冷的王
  rationale: 以希腊文Ἰουδαίας为主要依据，译作“犹太地”；属格结合ἐβασίλευσεν，在汉语中自然表达为“作……的王”。
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: 行了……看为恶的事
  rationale: 保留圣经叙事中对道德恶行的惯用表达，同时避免生硬直译为“做了那恶”。
- source_word: ἐνώπιον Κυρίου
  choice: 主眼中
  rationale: ἐνώπιον表示“在……面前／眼中”；结合汉语圣经惯用语，译为“主眼中”自然清楚。
theological_decisions:
- issue: Κυρίου的译法
  choice: 主
  alternative: 耶和华／上主
  rationale: 主要底本是希腊文，原词为κύριος；译作“主”既直接反映希腊文本，也不把底层可能对应的神名形式强行带入正文。
- issue: 地理及政治称谓Ἰουδαίας
  choice: 犹太地
  alternative: 犹大
  rationale: 正文优先遵循希腊文Ἰουδαίας；鉴于平行的希伯来叙事传统通常称“犹大”，将其保留为脚注异译，不在正文中消除文本传统间的差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“登基作……的王时，年二十五岁”保留古代史书式的简洁节奏；正文中的[a]与脚注对应。
