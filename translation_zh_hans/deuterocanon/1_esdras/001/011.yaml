base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: zh_hans
  text: 他们照着规矩用火烤了逾越节祭物，又把祭物放在铜锅和大釜里煮，香气四溢[a]，然后送给百姓中的众人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香气四溢”直译为“带着芳香”或“带着悦人的气味”；在祭祀语境中，这也可能令人联想到祭物所发出的馨香。
    reason: lexical_alternative
  - marker: b
    text: 直译为“所有出自百姓的人”，可能特指有别于祭司和利未人的普通民众。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: 烤
  rationale: 该动词特指用火烤制；与后文表示“煮”的ἥψησαν区分，保留两种不同的礼仪烹调方式。
- source_word: τὸ πάσχα
  choice: 逾越节祭物
  rationale: 该短语可指逾越节的祭牲、祭物或筵席；“逾越节祭物”在中文中自然，也避免把所指过度限定为羔羊。
- source_word: ἐν πυρί
  choice: 用火
  rationale: 表达烹调方式，直接而符合现代汉语。
- source_word: ὡς καθήκει
  choice: 照着规矩
  rationale: 既表达合宜、合乎规定的规范性，又不武断限定为成文律法或习俗。
- source_word: τὰς θυσίας
  choice: 其他祭物
  rationale: θυσίας是广义的祭物；依上下文加“其他”，清楚区分前述逾越节祭物而不改变其祭祀性质。
- source_word: ἥψησαν
  choice: 煮
  rationale: 该动词通常指在液体中煮；随后列出锅釜，也支持这一具体含义。
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: 放在铜锅和大釜里
  rationale: 用“铜锅”和“大釜”保留两类炊具的区别，同时采用普通读者容易理解的现代用语。
- source_word: μετʼ εὐωδίας
  choice: 散发着馨香
  rationale: 保留εὐωδία的芳香、悦人气味这一词义，也让祭祀语境中的馨香联想自然呈现，而不明说这是上帝悦纳的香气。
- source_word: ἀπήνεγκαν
  choice: 送给
  rationale: 该动词表示带去、送去；这里的间接宾语表明祭物被送到人们那里，分发之意可由语境理解。
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: 民众中的所有人
  rationale: 比简单的“全体百姓”更贴近“所有出自民众的人”，并保留这些人可能与祭司、利未人有别的语感。
theological_decisions:
- issue: 逾越节祭物与其他祭物的烹调方式
  choice: 分别译作“烤”和“煮”
  alternative: 两处都笼统译作“烹调”
  rationale: 希腊文刻意使用不同动词，可能反映不同的礼仪要求；保留差别可避免抹平祭祀细节。
- issue: “民众”所指的范围
  choice: 正文译作“民众中的所有人”，脚注说明可能特指祭司和利未人以外的普通民众
  alternative: 直接译作“所有普通民众”或“全体百姓”
  rationale: 原文措辞可能含有身份区分，但没有明说“非祭司”；正文保留较宽泛的表达，脚注呈现较具体的可能含义。
- issue: 馨香的祭祀含义
  choice: 译作“散发着馨香”，不增添上帝悦纳的明示
  alternative: 译作“成为蒙悦纳的馨香”
  rationale: 原文明确涉及香气，却没有明确说明悦纳者或神学判断；译文保留祭祀联想而不补入原文未明说的内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“照着规矩”保留规范意味而不过度法律化；“铜锅和大釜”兼顾器具差别与可读性；句式按事件顺序展开，适合普通读者朗读和理解。
