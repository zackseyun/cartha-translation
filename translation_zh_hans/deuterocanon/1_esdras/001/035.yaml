base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/035.yaml
  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: zh_hans
  text: 埃及王立他的兄弟约阿金为犹大和耶路撒冷的王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约阿金”按希腊文作Ἰωακεὶμ；希伯来文平行传统通常称他为“约雅敬”。
    reason: 说明希腊文名形与希伯来文平行传统的通行名称不同。
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: 立……作王
  rationale: 此处表示君王使某人取得王位；“立……作王”自然、庄重，并保留使役含义。
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: 埃及王
  rationale: 准确表达属格结构，也是现代中文历史叙事中自然简洁的称谓。
- source_word: Ἰωακεὶμ
  choice: 约雅敬
  rationale: 采用现代中文圣经读者熟悉的对应人名形式；脚注说明希腊文名形，避免掩盖原文证据。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 他的兄弟
  rationale: 直译亲属关系与代词指向，不额外判定具体是哪一种兄弟关系。
- source_word: βασιλέα
  choice: 王
  rationale: 原词明确指王位，不弱化为泛称“统治者”。
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: 犹大和耶路撒冷的王
  rationale: 按中文习惯将领属成分置于“王”之前，保留原文并列的两个地域名称。
