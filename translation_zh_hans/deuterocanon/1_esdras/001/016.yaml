base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: zh_hans
  text: 在那一天，献给主的祭祀事宜都完成了：逾越节祭牲被献上[a]，祭物也按照约西亚王[b]的命令奉到主的祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译作“逾越节被带来”。希腊文在这里使用祭祀用语，也可译为“被呈上”或“被献上”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文这里的名字是与Josias相对应的名形；中文通常译为“约西亚”。希伯来文平行记载也称他为约西亚。
    reason: source_name_form
lexical_decisions:
- source_word: συνετελέσθη
  choice: 全都办完了
  rationale: 该词为不定过去时被动语态，表示相关事务已经完成；“办完了”既保留完成之意，也符合现代汉语对礼仪筹办与执行的表达。
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: 献给主的祭祀事宜
  rationale: 希腊文是宽泛的惯用结构，指与祭献有关的一切事务或程序；“祭祀事宜”避免将其过度限定为某一种礼仪。“献给主”清楚表达属主、向主献祭的关系。
- source_word: ἀχθῆναι τὸ πάσχα
  choice: 逾越节祭牲被献上
  rationale: ἄγω的基本义是“带来”，但在此祭祀语境中带有呈献之意。πάσχα在这里可指逾越节祭牲；正文采用自然明确的祭祀表达，同时以脚注保留“带来”的字面可能。
- source_word: προσαχθῆναι τὰς θυσίας
  choice: 各样祭物也……送到
  rationale: προσάγω可指带到、呈到或献上；因下文明确提到祭坛，“送到”保留了朝祭坛移动的方向感，并避免与前句重复。复数用“各样祭物”自然呈现。
- source_word: ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  choice: 主的祭坛上
  rationale: ἐπί接宾格表达朝向并到达其上的动作；“送到……祭坛上”兼顾方向和落点。
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: 按照……的命令
  rationale: ἐπιταγή指权威性的指令；在王权语境中译作“命令”清楚自然。
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: 约西亚王
  rationale: 采用现代中文圣经传统中通行且易辨认的姓名“约西亚”；“王”置于姓名之后，符合自然汉语。
theological_decisions:
- issue: 祭祀语境中 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要底本是希腊文，其用词为 κύριος；译作“主”忠实保留希腊文本的表达，不借助平行希伯来文本把神名补入正文。
- issue: πάσχα 在本句中指节期还是祭牲
  choice: 逾越节祭牲
  alternative: 逾越节／逾越节祭
  rationale: 被“带来／献上”的对象在当前祭祀语境中最自然地指逾越节祭牲，但πάσχα本身具有节期与祭物之间的转喻张力，因此脚注说明原文较直译的表达。
- issue: Ἰωσείου 的中文姓名形式
  choice: 约西亚
  alternative: 按希腊语音另作音译
  rationale: 希腊名形与希伯来传统中的该王相对应；中文通行译名“约西亚”既便于识别，也不引入额外的身份判断。脚注交代底本名形。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“祭祀事宜”保留原文宽泛范围，“办完了”“送到”则避免过分书面或生硬。正文所有脚注标记均已对应列出。
