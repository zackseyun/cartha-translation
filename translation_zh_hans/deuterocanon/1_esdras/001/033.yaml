base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: zh_hans
  text: 他在以色列和耶路撒冷作王三个月[a]；埃及王废黜了他，使他不再在耶路撒冷作王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在以色列和耶路撒冷作王”。这里依照希腊文本保留“以色列和耶路撒冷”的说法。
    reason: source_wording
  - marker: b
    text: 译作“废黜”的希腊语动词在别处也可表示“恢复”或“使复位”；但按本句及其叙事背景，此处是指埃及王将他废黜，使他不再作王。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: 作王
  rationale: 该不定过去时动词表示实际执掌王权；“作王”自然、庄重，也不局限于登基这一刻。
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  choice: 在以色列和耶路撒冷
  rationale: 保留希腊文本的地点表达和“以色列、耶路撒冷”两个名称，不按历史平行记载改成“犹大”。现代汉语“在……作王”自然通顺。
- source_word: μῆνας τρεῖς
  choice: 三个月
  rationale: 简明准确地表达在位时长。
- source_word: ἀπεκατέστησεν
  choice: 废了他
  rationale: 该动词通常可指“恢复、使复原”，但结合本句和叙事背景，此处表示埃及王终止他的王位；“废了他”准确表达废黜，同时以脚注保留词汇上的另一可能。
- source_word: βασιλεὺς Αἰγύπτου
  choice: 埃及王
  rationale: 符合现代汉语对古代君王称号的常用简洁表达。
- source_word: βασιλεύειν ἐν Ἰερουσαλήμ
  choice: 不许他继续在耶路撒冷作王
  rationale: 按上下文将不定式理解为其王权被终止；“不许……继续作王”清楚呈现希腊句法在此处所表达的结果。
theological_decisions:
- issue: ἀπεκατέστησεν 与 βασιλεύειν 连用时的叙事含义
  choice: 埃及王废黜他，使他不能继续在耶路撒冷作王
  alternative: 埃及王恢复或任命他在耶路撒冷作王
  rationale: ἀποκαθίστημι 在其他语境中可以表示“恢复”或“使复位”，因此孤立来看存在张力；然而本节先说他仅作王三个月，且相关历史叙事表明埃及王随后将他废黜，所以正文采用废黜义，同时用脚注明确记录词汇上的另一可能，不将歧义隐去。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“作王”“埃及王”“废了他”符合普通读者的表达习惯；正文保留希腊文本“以色列和耶路撒冷”的措辞，并以脚注交代关键动词的词义张力。
