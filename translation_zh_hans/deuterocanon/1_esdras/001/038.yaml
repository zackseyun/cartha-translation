base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
translation:
  language: zh_hans
  text: 在他之后，巴比伦王尼布甲尼撒上来[a]，用铜链捆住他，把他押往巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上去”。希腊语动词既可按叙述视角译作“上来”，也可译作“上去”；这里可能含有君王向一地进发的意味。
    reason: 保留方向视角上的词义选择，以及原文可能具有但未明确展开的进军语感。
lexical_decisions:
- source_word: μετʼ αὐτὸν
  choice: 在他之后
  rationale: 保留原文对前述人物的直接指称，同时表达叙事中的时间先后，不抽象化为单纯的“后来”。
- source_word: ἀνέβη
  choice: 上来
  rationale: 保留希腊语“上去／上来”的方向性意象；上下文可暗示君王进军，但原词本身未明说“攻打”，因此不作过度解释。
- source_word: Ναβουχοδονόσορ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行、易于辨认的王名译法。
- source_word: βασιλεὺς Βαβυλῶνος
  choice: 巴比伦王
  rationale: 简洁自然地表达所属地与王号，符合现代汉语习惯。
- source_word: ἔδησεν αὐτὸν ἐν χαλκεῖς δεσμοῖς
  choice: 用铜链捆住他
  rationale: “捆住”对应动作，“铜链”交代金属拘束物；“铜”可自然涵盖古代语境中 χαλκός 所指的铜或青铜制品，避免生硬的“在铜的捆绑中”。
- source_word: ἀπήγαγεν
  choice: 押往
  rationale: 该动词表示把被拘禁者带走；“押往”自然体现强制带离，又不额外加入原文没有明说的流放细节。
- source_word: εἰς Βαβυλῶνα
  choice: 往巴比伦
  rationale: 准确表达目的地，并与“押往”构成自然的现代汉语搭配。
theological_decisions:
- issue: 希腊文《以斯拉一书》的叙事与近似的马所拉文本平行经文并不一致
  choice: 依照希腊文，译出尼布甲尼撒上来、捆住前述人物并将他押往巴比伦的次序
  alternative: 按希伯来平行传统的周边叙事、人物或次序加以协调
  rationale: 本节的主要文本依据是现存希腊文，其句意清楚；希伯来文本仅供核对，不应取代或改写本书自身的叙述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在他之后”与重复的“他”保留原文指代，不擅自补出姓名；“上来”配脚注呈现方向性歧义；整体句式简明，适合普通读者朗读和理解。
