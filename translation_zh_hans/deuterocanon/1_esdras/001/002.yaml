translation:
  language: zh_hans
  text: 他把身着盛装[b]的祭司按班次[a]安置在主的圣殿里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按各自轮值的班组”；这里指祭司有秩序地分班轮值。
    reason: lexical_alternative
  - marker: b
    text: 或译“装束华美”或“穿着礼服”；希腊文表示他们已盛装，但没有明确说是祭司圣服。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“在主的圣殿（或圣殿区域）里”；希伯来文平行经文作“为耶和华殿中的事奉”。
    reason: alternative_reading
lexical_decisions:
- source_word: στήσας
  choice: 安置
  rationale: 这是ἵστημι的不定过去时主动分词，在这里表示使祭司站在指定的位置或承担指定职分。“安置”既保留使役和安排之意，也不额外加入希腊文没有明说的“供职”。
- source_word: τοὺς ἱερεῖς
  choice: 祭司
  rationale: 按通常意义直译，符合本段礼仪和圣殿语境。
- source_word: κατʼ ἐφημερίας
  choice: 按班次
  rationale: ἐφημερία可指固定的值班期或祭司班组；“按班次”是现代汉语中自然、简明的制度性表达，也与希伯来文平行经文的“班次”相合。
- source_word: ἐστολισμένους
  choice: 穿戴整齐
  rationale: στολίζω表示装束、穿戴或盛装。此处所指很可能是祭司服饰，但希腊文没有明确使用“圣服”一词，因此采用较宽泛而庄重的表达。
- source_word: ἐν τῷ ἱερῷ
  choice: 在……圣殿里
  rationale: ἱερόν在这里指主的圣殿或神圣建筑范围。“圣殿”比“殿”更明确，也比依希伯来文平行经文译作“殿宇”更直接遵循希腊文。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 主要底本为希腊文，κύριος通常译作“主”。希伯来文平行经文虽有神名יהוה，但不取代本节希腊文的措辞。
theological_decisions:
- issue: 希腊文κύριος与希伯来文平行经文יהוה之间的处理
  choice: 主
  alternative: 耶和华
  rationale: 本译文以希腊文为首要依据，因此将κυρίου译为“主的”；“耶和华”反映希伯来文平行经文，但若放入正文会越过希腊文底本所呈现的形式。
- issue: 是否明确译为祭司穿着圣服
  choice: 穿戴整齐
  alternative: 穿着圣服
  rationale: 上下文确实使祭司礼服成为合理理解，但ἐστολισμένους本身只说明他们已经装束妥当或穿戴整齐。正文不把合理推断写成明说的信息。
- issue: 是否补出祭司在圣殿中“供职”
  choice: 不补出“供职”
  alternative: 在主的圣殿里供职
  rationale: 希伯来文平行经文明确提到“耶和华殿中的事奉”，但现存希腊文只说安置祭司、按班次、穿戴妥当以及在圣殿里。为维护希腊文的首要地位，正文不补入动词“供职”。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。把希腊文多个分词和介词短语整合为一个自然汉语句子，同时让“穿戴整齐”明确修饰祭司，并避免把希伯来文平行经文中的“供职”无标记地加入正文。
