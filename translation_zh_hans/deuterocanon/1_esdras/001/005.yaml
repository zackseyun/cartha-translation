base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: zh_hans
  text: 要照以色列王大卫的书面指示，也照他儿子所罗门的宏伟[a]；你们利未人要按祖传的班次[c]站在圣所[b]里，在你们的弟兄，就是以色列的子孙面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宏伟”所译的希腊文也可指“伟大”“威仪”或“显赫”。按上下文，这可能与所罗门所定制度安排的规模或尊严有关；原文并未明说“安排”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“在圣的〔地方〕”，也可译作“在圣地”或“在圣所”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文此处措辞简缩；希伯来文平行经文较完整地表达为“按你们的父家，照你们的班次”。
    reason: alternative_reading
lexical_decisions:
- source_word: γραφήν
  choice: 书面指示
  rationale: 这里指与大卫相关的成文规定，而非后期术语意义上的“圣经”；译作“书面指示”既保留书写性质，也符合上下文中的规范作用。
- source_word: μεγαλειότητα
  choice: 宏大安排
  rationale: 该词本义涉及伟大、宏伟或威仪；结合利未人班次的语境，“宏大安排”表达所罗门所定制度的规模与尊严，但以脚注保留较直译的可能。
- source_word: στᾶντες
  choice: 要……站
  rationale: 希腊文为分词，但在本段劝令语境中具有命令意味；用“要……站”较符合现代汉语，同时不改变其行动要求。
- source_word: ἐν τῷ ἁγίῳ
  choice: 在圣所里
  rationale: 原文直译为“在圣的〔地方〕”；“圣所”自然地指圣殿神圣区域，又不限定具体建筑空间。
- source_word: μεριδαρχίαν
  choice: 班次
  rationale: 该罕见词表示按份额划分的组织次序；在利未人职务语境中，“班次”简洁自然。
- source_word: πατρικήν
  choice: 祖传的
  rationale: 该形容词指父系家族或祖先传下的归属；“祖传的”保留按宗族编组的含义。
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: 在你们的弟兄……面前
  rationale: 保留ἔμπροσθεν的空间或临在意义，也保留“弟兄”的亲族称谓。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 原文明确为“以色列的儿子们”；“以色列众子”保留其男性亲族表达和盟约民族称谓。
theological_decisions:
- issue: υἱῶν Ἰσραήλ的性别与亲族表达
  choice: 以色列众子
  alternative: 以色列人；以色列子民
  rationale: 原文采用男性亲族称谓，主文予以保留，不将其无提示地泛化为一般民族名称。
- issue: 是否借助马所拉文本展开压缩的希腊语
  choice: 按祖传的班次
  alternative: 按你们的父家、照你们的班次
  rationale: 以希腊文πατρικὴν μεριδαρχίαν为主，译成紧凑的“祖传的班次”；脚注说明希伯来平行经文有较完整的表达，但不把其全部措辞直接并入主文。
- issue: μεγαλειότητα在制度语境中的含义
  choice: 宏大安排
  alternative: 伟大；威仪；宏伟
  rationale: 原词可指伟大、宏伟或威仪，语境可能指所罗门安排的权威与规模。主文采用自然而合乎语境的表达，脚注保留字面张力，避免断言其唯一含义。
translation_notes:
  register: 采用现代、庄重而清楚的圣经叙事语体。以“书面指示”“班次”传达制度性语境；用破折号标明“以色列众子”是“你们的弟兄”的同位说明。脚注标记均紧随其所解释的词组。
