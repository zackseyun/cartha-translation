base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: zh_hans
  text: 犹大全地都为约西亚哀悼；耶利米先知为约西亚作了哀歌，众首领也和妇女们一同为他哀哭，直到今日[b]；这事被定为永远遵行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事被规定要不断举行”，或“这事被确立为永久的惯例”。希腊文表示这项做法受到正式确立，但所用动词具体带有怎样的行政含义，并不完全明确。
    reason: lexical_alternative
  - marker: b
    text: 《历代志下》35:24—25的希伯来文本提到，犹大众人和耶路撒冷人为约西亚哀悼，耶利米也为他作哀歌；本节进一步提到众首领和妇女为他哀哭，“直到今日”。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: 犹大全地
  rationale: 保留ὅλῃ的全面范围，并以现代汉语自然表达地点范围。
- source_word: ἐπένθησαν
  choice: 哀悼
  rationale: πενθέω指为死者悲哀、服丧；“哀悼”贴合丧葬语境。
- source_word: ἐθρήνησεν
  choice: 作了哀歌
  rationale: θρηνέω比一般哀悼更具体，可指发出挽歌或哀歌；此译也与前面的“哀悼”有所区分。
- source_word: ὑπὲρ Ἰωσείου
  choice: 为约西亚
  rationale: 在哀悼语境中，ὑπέρ可表示“为、因着”；中文“为约西亚”自然且不额外限定形式。
- source_word: οἱ προκαθήμενοι
  choice: 众首领
  rationale: 该词指居于人前、掌权或有地位者；“首领”清楚而不强行指定为长老或官员。
- source_word: σὺν γυναιξὶν
  choice: 和妇女们一同
  rationale: 忠实体现σύν的共同参与关系。
- source_word: ἐθρηνοῦσαν
  choice: 哀哭
  rationale: 未完成时态呈现持续或惯常的哀悼行动；结合“直到今日”即可自然表达其延续性。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今日
  rationale: 这是延续至叙述者当时的惯用表达。
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: 这事被定为永远遵行
  rationale: ἐξεδόθη可有颁布、规定之意，而γενέσθαι ἀεί表明持续实行；译文保留正式确立与长久延续的含义，同时不说明未明示的制定者。
theological_decisions:
- issue: 末句纪念性哀悼的正式性与永久性
  choice: 这事被定为永远遵行
  alternative: 这事被规定要不断举行／这事被确立为永久的惯例
  rationale: 希腊文表明这项做法受到某种正式确立，却没有说明由谁制定，也没有明确其法律或礼仪性质；译文保留这种未决性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作了哀歌”与“哀悼／哀哭”区分一般丧悼和较具体的挽歌行为；末句使用被动式，不补出希腊文没有说明的制定者。所有脚注标记均已置于正文相应位置。
