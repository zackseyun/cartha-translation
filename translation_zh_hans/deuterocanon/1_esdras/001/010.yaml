base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: zh_hans
  text: 这些事发生以后[a]，祭司和利未人手拿无酵饼，按各支派和父系宗族的组别，在百姓面前合宜地站立，为要照摩西书上所记的献给主；早晨也如此。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事成了以后”。
    reason: καὶ ταῦτα τὰ γενόμενα是简略的承接语，指前述事情发生或成了；不明确表示这些事被人“办妥”。
  - marker: b
    text: 这里的希腊文与《历代志下》35:10的希伯来文近似平行记载有显著差异；本译文依从《以斯拉一书》的希腊文。
    reason: 说明重要文本差异，避免按《历代志下》的平行记载调和本节希腊文。
lexical_decisions:
- source_word: καὶ ταῦτα τὰ γενόμενα
  choice: 这些事办妥以后
  rationale: 以自然汉语表达事情已经发生、安排就绪的承接关系；希腊语短语较为简略，亦可直译为“这些事成就以后”。
- source_word: εὐπρεπῶς ἔστησαν
  choice: 按合宜的次序站好
  rationale: εὐπρεπῶς兼有合宜、端整之意；在礼仪场景中译作“按合宜的次序”可传达有序而得体的站位。ἔστησαν保留为“站好”，不扩展为被动的“被安排”。
- source_word: τὰ ἄζυμα
  choice: 无酵饼
  rationale: 字面为“无酵之物”，逾越节语境中自然指无酵饼；采用现代中文圣经语域中清楚而简洁的表达。
- source_word: κατὰ τὰς φυλὰς
  choice: 照各支派
  rationale: φυλή在以色列社会结构中通常指支派；“照各支派”保留原文按群体编排的意思。
- source_word: κατὰ τὰς μεριδαρχίας τῶν πατέρων
  choice: 照各父系家族的班次
  rationale: μεριδαρχία表示划分出的组别或班次，τῶν πατέρων指祖先或父家体系。此译法兼顾组织性与父系家族背景，同时以脚注保留另一种理解。
- source_word: προσενεγκεῖν τῷ κυρίῳ
  choice: 要献给主
  rationale: προσφέρω在祭祀语境中指献上；κύριος按希腊文本译为“主”，不改写为文本未直接出现的专名形式。
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: 按照《摩西书》上所记的
  rationale: 忠实保留对成文摩西权威的诉诸，并以现代中文书名号使表达清楚自然。
- source_word: καὶ οὕτω τὸ πρωϊνόν
  choice: 早晨也是这样
  rationale: 原文极为简略，可能只是时间说明，也可能暗示早晨的礼仪行动。译文保留其含混，不明确增补“早祭”等原文未说出的对象。
theological_decisions:
- issue: 希腊文本与《历代志下》35:10附近的希伯来文平行材料显著不同
  choice: 正文依从《以斯拉一书》的希腊文，保留祭司和利未人有序站立、拿着无酵饼并献给主的场景
  alternative: 按照希伯来文平行材料改写为利未人的首领供应逾越节牲畜
  rationale: 本书的首要文本依据是现存希腊文；希伯来文材料仅为近似平行见证，不应据此调和或替换本节希腊文的独特内容。
- issue: τῶν πατέρων所表达的父系家族语言
  choice: 译作“父系家族”，并与μεριδαρχίας合译为“父系家族的班次”
  alternative: 译作“祖先家族”或“父家”
  rationale: 原文含明确的父系祖先措辞；正文既保留这一社会结构，又避免生硬的“众父亲的划分”。脚注提供较贴近传统宗族术语的替代译法。
- issue: 末句τὸ πρωϊνόν的指涉
  choice: 译作“早晨也是这样”，不补足具体礼仪对象
  alternative: 译作“早祭也是这样”或“他们早晨就这样做”
  rationale: 希腊语名词化表达简短且指涉不完全明确。为保存文本张力，不把它专门解释成早祭，也不强行补出明确主语和动作。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“按合宜的次序站好”保留礼仪秩序感；“无酵饼”“支派”“献给主”沿用清楚的经文语汇。末句刻意保持简约，以反映希腊文的省略和含混。所有脚注标记均已置于正文。
