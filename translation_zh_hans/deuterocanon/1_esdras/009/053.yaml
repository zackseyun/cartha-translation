base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: zh_hans
  text: 利未人不断劝导众百姓说：“今天是圣日，不要悲伤。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: 利未人
  rationale: 采用现代中文圣经传统中对这一族群及礼仪职分群体的标准称呼。
- source_word: ἐκέλευον
  choice: 不断劝导
  rationale: 未完成时体现持续或反复的行动；动词本可表示命令、吩咐，此处是安抚并引导百姓，译作“不断劝导”既保留持续性，也避免无根据地强化严厉语气。
- source_word: τῷ δήμῳ πάντα
  choice: 众百姓
  rationale: δήμῳ指百姓或会众；πάντα在此表达整体、遍及全体的意思。“众百姓”简洁自然，并保留全面性。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出后面的直接引语。
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: 今天是圣日
  rationale: 以现代汉语自然表达“这一天是圣的”；“圣日”保留ἁγία的宗教分别为圣含义。
- source_word: μὴ λυπεῖσθε
  choice: 不要悲伤
  rationale: λυπέω在此指陷入忧伤、悲痛；“不要悲伤”准确、自然，不把语义限定为礼仪性的哀悼。
