base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: zh_hans
  text: 于是，在犹大全地和耶路撒冷发布了通告，通知所有被掳归来的人[a]到耶路撒冷集合。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“所有从被掳而来的人”；也可译作“所有被掳者”或“所有流亡归来的人”。“归来”合乎上下文，但原文并未明说。
    reason: 保留 πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας 的字面结构，并说明正文为使现代汉语自然而作的有限语境性表达。
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: 发出通告
  rationale: 原文直译为“有宣告发生”。“发出通告”自然地表达公开传达消息的行动，同时不把 κήρυγμα 过度强化为正式法令。
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: 犹大全地和耶路撒冷都
  rationale: ἐν 配合整个地区的说法，表示通告传播的范围；“全地……都”在现代汉语中自然体现遍及该地区和城邑。
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: 所有从被掳之地回来的人
  rationale: ἐκ 表示“从……出来”，αἰχμαλωσία 可指被掳、流亡或被掳之境况。“从被掳之地回来的人”兼顾字面结构与上下文，避免仅译作“被掳者”而掩盖其已经身处犹大、可被召集的语境；脚注保留更贴近字面的可能。
- source_word: συναχθῆναι
  choice: 集合
  rationale: 不定式说明通告的内容或目的。虽为被动形式，但希腊语可表达众人聚集；汉语用“集合”简洁自然，不必机械译成“被聚集”。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: εἰς 明确带有趋向性；与“集合”连用时，“到耶路撒冷集合”既自然，也比“在耶路撒冷集合”更直接保留目的地含义。
