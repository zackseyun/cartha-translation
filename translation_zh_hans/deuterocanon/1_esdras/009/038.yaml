base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: zh_hans
  text: 众人都同心聚集在圣殿东门的宽阔空地上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人都同心聚集到圣殿东门的宽阔地方。”希腊语ἐπὶ τὸ εὐρύχωρον较直译为“到那宽阔的地方”；该短语可指与圣殿东门相关的开阔处。
    reason: 保留介词短语的趋向意味，并避免将该开阔处与东门的关系限定为“门旁”。
lexical_decisions:
- source_word: συνήχθη
  choice: 聚集
  rationale: 该词为不定过去时被动形式，在这里描述众人集合起来；中文用“聚集”自然简洁，也保留集体汇合之意。
- source_word: πᾶν τὸ πλῆθος
  choice: 众人都
  rationale: πλῆθος指人数众多的群体，πᾶν强调全体；“众人都”符合现代汉语习惯，并完整表达全体性。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 该副词不仅表示一同在场，也含有意向一致、齐心行动之意；“同心”保留了这种联合行动的意味。
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: 在……宽阔空地上
  rationale: εὐρύχωρον指宽广、开阔的地方；“宽阔空地”比特指城市形态的“广场”更谨慎，也保留原文空间性质。
- source_word: τοῦ πρὸς ἀνατολὰς
  choice: 东门
  rationale: 原文直译为“朝东的”；汉语以“东门”自然表达该门的方位属性。
- source_word: ἱεροῦ πυλῶνος
  choice: 圣殿……门
  rationale: ἱερόν在此指圣殿区域，πυλών指门或门楼；“圣殿东门”简明地表达其所属和方位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“同心聚集”体现ὁμοθυμαδόν的共同意向；脚注说明ἐπὶ τὸ εὐρύχωρον以及该空地与东门之间关系的表达余地。
