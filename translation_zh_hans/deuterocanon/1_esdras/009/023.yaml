base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: zh_hans
  text: 利未人中有：约撒拔、西内、哥诺（就是迦利泰）[a]、帕泰俄斯[b][c]，还有犹大和约拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“这位是迦利泰”；这里很可能是用另一个名字说明哥诺的身份。
    reason: alternative_reading
  - marker: b
    text: 有些名字在平行传统中可能有相应的希伯来语形式；例如“约拿”，以及“帕泰俄斯”背后可能对应的闪族名字。本节正文仍以《以斯得拉一书》的希腊文为准。
    reason: lexical_alternative
  - marker: c
    text: 所据原文的转录被标注为有轻微不一致，因此个别罕见人名的确切拼写可能略有不确定。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: 利未人中有
  rationale: ἐκ 带有从群体中列举成员的部分含义；此译自然地引出名单。
- source_word: Ἰωζάβαδος
  choice: 约撒拔
  rationale: 按希腊语形式音译，并采用现代中文圣经人名常见的音节形式。
- source_word: Σενεεὶς
  choice: 西内
  rationale: 依据希腊语读音音译；该罕见人名的准确拼写略有不确定。
- source_word: Κῶνος
  choice: 哥诺
  rationale: 直接按希腊语人名音译，不借用拉丁化形式。
- source_word: οὗτος Καλιταίς
  choice: 就是迦利泰
  rationale: οὗτος 在此作同位说明，看来是用另一名字辨明前述的哥诺；“就是”既自然，又保留其识别作用。
- source_word: Παθαῖος
  choice: 帕泰乌斯
  rationale: 以希腊文本为主直接音译，不以平行传统中可能对应的闪族名字取代。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用中文圣经传统中对希腊人名 Ἰούδας 的通行译名；上下文清楚表明这是个人名。
- source_word: Ἰωνάς
  choice: 约拿
  rationale: 采用中文圣经传统中对该名字的通行形式，同时与希腊语 Ἰωνάς 所代表的人名相符。
