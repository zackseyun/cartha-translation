base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: zh_hans
  text: 犹大和便雅悯支派的人[a]在三天之内聚集到耶路撒冷；那时是第九个月的二十日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“犹大和便雅悯”之前使用单数“支派”；这里指属于犹大和便雅悯的人。希伯来文平行经文《以斯拉记》10:9作“犹大和便雅悯的所有男子”。
    reason: 说明希腊文不寻常的单数形式，并交代平行经文的相关措辞。
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: 都聚集到了
  rationale: 该词为被动形式，表示众人被聚集或集合起来；现代汉语用不标明施事者的“聚集”更自然，同时不擅自指定召集者。“都”表达这群人共同到齐的整体意义。
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: 来自犹大和便雅悯支派的人[a]
  rationale: 按希腊文保留不明说性别的“人”，不增译为“男子”。原文以单数“支派”连接犹大和便雅悯，正文采用自然中文表达，并以脚注说明这一不寻常形式。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三天之内
  rationale: 在本段召集语境中，该短语最自然地表示在三天期限以内，而不是三天之后。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到了耶路撒冷
  rationale: εἰς带有朝向目的地的动态含义；“聚集到了耶路撒冷”既符合现代汉语，也保留前往耶路撒冷的方向性。
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: 那时是九月
  rationale: 该分句交代事件发生的月份；“那时是九月”是自然、清楚的现代汉语。
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: 二十日
  rationale: εἰκάς指一个月的第二十日；与“九月”合译为“九月二十日”，简洁明确。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“聚集到了”避免生硬的被动句，同时不补出原文未说明的施事者；日期合并为现代读者容易理解的“九月二十日”。
