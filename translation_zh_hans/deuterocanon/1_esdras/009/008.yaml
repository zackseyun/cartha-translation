  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
translation:
  language: zh_hans
  text: 现在，你们要向主、我们列祖的上帝认罪[a]，并将荣耀归给他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认罪”也可译作“承认”。希腊词ὁμολογία在这里可表示认罪或承认；鉴于上下文带有悔罪意味，正文采用“认罪”。
    reason: lexical_alternative
  - marker: b
    text: 本句按现存希腊文本翻译。希腊文较《以斯拉记》的希伯来文平行段落简短；译文不根据该平行段落增补或改写本句。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 承接前文并引出当下的劝令；现代汉语中无需机械加入“并且”，即可保留话语推进。
- source_word: δότε
  choice: 献上
  rationale: 这是δίδωμι的复数命令式。此处受词为宗教语境中的“认罪”和“荣耀”，“献上”比单纯的“给”更自然庄重，同时保留奉呈给上帝的方向。
- source_word: ὁμολογίαν
  choice: 认罪
  rationale: ὁμολογία可指承认、认信或认罪；上下文带有悔罪意味，因此采用“认罪”，并以脚注保留“承认”这一真实可能。
- source_word: δόξαν
  choice: 荣耀
  rationale: 保留“将荣耀归给上帝”的圣经惯用观念；“尊荣”亦可，但“荣耀”更贴近δόξα并适合本句礼仪性语域。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: 在犹太经文语境中，κύριος指以色列的上帝，译作“主”；“向”明确δότε的接受对象。
- source_word: θεῷ τῶν πατέρων ἡμῶν
  choice: 我们列祖的上帝
  rationale: “列祖”准确保留πατέρων的阳性复数和圣约公式色彩，也比现代口语中的“父亲们”自然。
theological_decisions:
- issue: 悔罪语境中ὁμολογίαν的含义
  choice: 认罪
  alternative: 承认
  rationale: 上下文涉及承认对圣约的不忠，“认罪”保留其悔改力度；脚注同时避免把该词本身可能具有的较广义“承认”完全排除。
- issue: “献上荣耀”的表达
  choice: 将δόξαν直译为“荣耀”，与“认罪”并列作δότε的受词
  alternative: 译作“尊荣”或重组为“将荣耀归给他”
  rationale: 希腊文直接把ὁμολογίαν和δόξαν并列置于δότε之后。正文保留这一结构及其神学张力，不把它解释性改写为两个不同动作。
- issue: πατέρων的性别与圣约公式
  choice: 列祖
  alternative: 祖先
  rationale: 原文明确使用阳性名词，且属于“我们列祖的上帝”这一固定圣经表达；“列祖”既准确又庄重。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“主—我们列祖的上帝—”以同位结构清楚呈现τῷ κυρίῳ θεῷ τῶν πατέρων ἡμῶν；“献上认罪和荣耀”有意保留希腊文两个并列受词的凝练表达。
