base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: zh_hans
  text: 耶书亚、安纽特、示利比雅[a]、雅底努、雅尔苏波、亚比泰、奥泰雅、迈安纳和基利他、亚撒利雅、卡特扎布多、安纳、法利雅——这些利未人——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊抄本所保存的若干人名并不确定，其中一些可能对应《尼希米记》8:7的利未人名单，如沙比太、荷第雅、玛西雅等。正文通常按希腊文音译；只有对应关系较为明确时，才采用希伯来形式的惯用译名。
    reason: 文本异文与专名对应不确定
lexical_decisions:
- source_word: Ἰησοῦς
  choice: 耶书亚
  rationale: 希腊文形式也可译作“耶稣”或“约书亚”，但在以斯拉—尼希米的历史语境中，此名对应希伯来名יֵשׁוּעַ；采用旧约人物惯用译名“耶书亚”。
- source_word: Σαραβίας
  choice: 示利比雅
  rationale: 此名可与以斯拉—尼希米传统中的希伯来名שֵׁרֵבְיָה相对应，因此采用可辨认的闪语名称形式，而不机械音译希腊语词尾。
- source_word: Ἀννιοὺθ, Ἰάδεινος, Ἰαρσούβοος, Ἀβταῖος, Αὐταίας, Μαιάννας
  choice: 安纽特、雅底努、雅尔苏波、亚比泰、奥泰雅、迈安纳
  rationale: 这些专名在本节希腊文本中对应关系不够确定；为避免凭推测与希伯来名单强行协调，正文采取接近希腊读音的保守音译。
- source_word: Καλείτας
  choice: 基利他
  rationale: 很可能对应以斯拉—尼希米传统中的基利他；采用现代中文圣经读者较易辨认的名称形式，不保留希腊语阳性词尾。
- source_word: Ἀζαρίας
  choice: 亚撒利雅
  rationale: 采用该希伯来人名在中文圣经传统中的通行形式。
- source_word: Κατέθζαβδος
  choice: 卡特扎布多
  rationale: 传世希腊形式可能已经讹变，也可能与“约撒拔”一名有关；鉴于无法由本节本身确定，正文保留希腊见证的近似音译。
- source_word: Ἄννας, Φαλίας
  choice: 安纳、法利雅
  rationale: 虽可能与《尼希米记》平行名单中的其他希伯来名字有关，但现有希腊形式并不支持确定还原，故按希腊文音译。
- source_word: οἱ Λευεῖται
  choice: 这些利未人
  rationale: 该短语回指并标明前列众人的身份；“这些利未人”在中文中能自然表达希腊文定冠词的指认作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易读的名单体。中文列举以顿号和逗号组织，保留原文末尾未完句式的破折号，以表明本节语法延续到下文。专名优先依据希腊文本；对可较有把握还原的传统名字采用中文惯用形式，其余保守音译。
