base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/013.yaml
  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: zh_hans
  text: 各地的长老和审判官[b]，直到使主因这事[a]向我们发的怒气消除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主对这事所发的怒气。”
    reason: 希腊文 τοῦ πράγματος τούτου 是压缩的属格结构，既可自然理解为发怒的缘由，也可较形式化地理解为怒气所针对或关乎的事。
  - marker: b
    text: 希腊原文在这里是承接上一节的句子片段；中文据上文补足“使……消除”这一相关行动。
    reason: 说明本节开头没有明说谓语，且“使……消除”所表达的行动承接自上文，并非原文在本节独立明说。
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: 各地的
  rationale: 保留分配性的“每一地方”，又不把 τόπος 过度限定为城镇、地区或村落。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 此处指地方上受承认的资深权威，并非泛指年长男子；“长老”符合行政与司法语境。
- source_word: κριτάς
  choice: 审判官
  rationale: 法律语境支持此译，比泛称“官员”更直接，也比单用“法官”稍具古代公共职分的色彩。
- source_word: ἕως τοῦ λῦσαι
  choice: 直到……消除
  rationale: 该结构表示所期待的终点；λῦσαι 与“怒气”连用时，译为“消除”比直译“解开”自然，并保留怒气被解除的含义。
- source_word: ὀργὴν Κυρίου
  choice: 主……发的怒气
  rationale: ὀργή 可指怒气或震怒；“怒气”现代、清楚而不减弱神圣审判的严肃性。κύριος 按本项目惯例译为“主”。
- source_word: ἀφʼ ἡμῶν
  choice: 从我们身上
  rationale: 明确表达怒气与群体分离，比仅译“离开我们”更符合现代汉语搭配。
- source_word: τοῦ πράγματος τούτου
  choice: 因这事
  rationale: 此压缩的属格最自然地表示主发怒的缘由；正文采用通顺的因果表达，脚注保留“针对／关于这事”的可能理解。
theological_decisions:
- issue: 次经希腊文语境中 κύριος 的译法
  choice: 主
  alternative: 上主；主宰
  rationale: 本节显然敬称以色列的神；“主”既符合项目惯例，也不额外引入特定宗派用语。
- issue: 神圣不悦中 ὀργή 的强度
  choice: 怒气
  alternative: 震怒
  rationale: “怒气”忠实涵盖该词的基本意义，现代读者容易理解；上下文已清楚表达审判的严肃性，无须用更强烈的词预先限定语气。
- issue: τοῦ πράγματος τούτου 与“怒气”的关系
  choice: 因这事
  alternative: 对这事；关于这事
  rationale: 上下文很可能表达这事是主发怒的缘由，但希腊文属格较为压缩，因此以脚注保留较形式化的另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“各地”避免过度界定行政单位；“审判官”体现司法职分。正文保留原文承接上节的片段性质，不擅自补入具体谓语，并用脚注说明。
