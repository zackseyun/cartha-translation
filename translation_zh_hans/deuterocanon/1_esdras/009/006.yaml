base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: zh_hans
  text: 全体会众一同坐在圣殿内宽阔的空地[a]，因当时的恶劣天气[b]而瑟瑟发抖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿的宽阔处”“圣殿的空旷处”或“圣所的宽敞区域”。希腊语 εὐρυχώρῳ 较为少见，可能指圣殿范围内一处开阔的地方，如院落。
    reason: lexical_alternative
  - marker: b
    text: 或译“因当时的冬寒”“因当时的风暴”或“因当时临到的暴风雨”。希腊语 χειμών 可指冬季、风暴或恶劣天气；本处语境较倾向于当时正在发生的恶劣天气。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: 一同坐在
  rationale: 保留复合动词所表达的众人聚集而坐这一具体画面，也符合现代汉语表达。
- source_word: πᾶν τὸ πλῆθος
  choice: 全体会众
  rationale: πλῆθος指聚集起来的全体人群；“会众”适合正式的共同体场景，又不显生硬。
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: 在……的宽阔处
  rationale: εὐρύχωρος在此作名词性用法，指宽敞、开阔的地方。希腊文本未明确写“院”，正文避免把可能的建筑含义定死。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿的
  rationale: ἱερόν通常可指圣殿建筑群或圣域，而不专指内殿；“圣殿”清楚自然，范围上的可能性由上下文及脚注说明。
- source_word: τρέμοντες
  choice: 瑟瑟发抖
  rationale: 保留身体颤抖的具体含义；直接宾语指向当时的恶劣天气，因此此处主要是受寒或受风雨所致，但不排除处境中的惧怕。
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: 因当时的风雨
  rationale: χειμών可指冬季、风暴或恶劣天气；ἐνεστῶτα表示正在临到或当前存在。结合聚会时众人发抖的场景，“当时的风雨”自然表达正在发生的恶劣天气，同时不过度限定为单一风暴。
