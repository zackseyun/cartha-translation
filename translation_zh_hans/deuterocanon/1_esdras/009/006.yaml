translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宽阔处”有意保留原文在具体建筑位置上的含混；“风雨”则兼顾 χειμών 的恶劣天气义，并以脚注保留“冬寒”和“暴风雨”等可能译法。脚注标记按正文出现顺序排列。
