  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: zh_hans
  text: 你们要遵行他的旨意[a]，与这地的各族和外族人分别开来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》10章的希伯来文平行段落更具体地提到外族女子／妻子；但《以斯拉续篇上》此处的希腊文采用较广的说法“外族人”。
    reason: 说明希腊正文与马所拉文本平行段落在范围上的差异，防止读者误以为正文遗漏了女性或婚姻语境。
lexical_decisions:
- source_word: ποιήσατε
  choice: 要遵行
  rationale: 这是不定过去时命令式；与“旨意”搭配时，现代汉语以“遵行”比直译“做”更自然，同时保留明确的命令语气。
- source_word: τὸ θέλημα αὐτοῦ
  choice: 他的旨意
  rationale: “旨意”是现代汉语圣经语体中自然、庄重且清楚的表达；代词所指在本节片段中未明说，因此不擅自补成“上帝的”。
- source_word: χωρίσθητε
  choice: 分别开来
  rationale: 该中间／被动形式在语境中表达主动使自己脱离、分开的命令；“分别开来”既保留反身意味，也避免“隔绝”所带来的额外强化。
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: 与这地的各族
  rationale: γῆ在历史语境中指当地地域，故译“这地”；ἔθνη在此指当地非以色列群体，译“各族”比“列国”更贴合本地群体，也避免套用后期的“外邦人”术语。
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: 和外族人
  rationale: ἀλλογενῶν泛指异族出身的人，希腊文本并未限定为女性；“外族人”保留其族群层面的广义，不据平行经文缩窄为“外族女子／妻子”。
theological_decisions:
- issue: 希腊文本的广义措辞与《以斯拉记》10章马所拉文本平行段落所强调的外族女子／妻子之间的关系
  choice: 正文依希腊文译为“这地的各族和外族人”，不限定为女性。
  alternative: “这地的各族和外族女子（或外族妻子）”
  rationale: 本书以希腊文为首要文本依据；ἀλλογενῶν本身并未说明性别。希伯来文平行语境虽更具体地涉及外族女子／妻子，但不应据此改窄希腊正文的范围，故将差异记入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵行他的旨意”保持经文语体但不过分古雅；“分别开来”传达命令的反身性。“各族”和“外族人”有意避免“外邦人”等可能引入后期神学语感的词，并保留希腊文两组对象之间略显重叠的表达。
