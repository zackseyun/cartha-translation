translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文明确表达父子关系；行政—司法语境中的罕见动词译为“一起作出裁断”，并以脚注保留其词义不确定性。人名总体以希腊见证为锚点，但对已有稳定中文形式的约拿单、亚撒业、希西家和利未采用熟悉译名。
