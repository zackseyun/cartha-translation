base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: zh_hans
  text: 亚撒业的儿子约拿单和托迦努斯的儿子希西家照此接受了这项安排[c]；莫索拉穆斯、利未和撒巴泰乌斯[a]也同他们一起作出裁断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊人名与《以斯拉记》第10章中近似的希伯来文本并不相同；例如，莫索拉穆斯可与米书兰相比较，撒巴泰乌斯可与沙比太相比较。
    reason: alternative_reading
  - marker: b
    text: 译作“同他们一起作出裁断”的希腊语动词较为罕见，也可能表示这些人与他们一同担任评议者，或附议他们的判断。
    reason: lexical_alternative
  - marker: c
    text: 《以斯得拉一书》此处的希腊文本与马所拉文本中的近似平行经文在措辞上并不十分吻合，因此正文的人名和表达主要以希腊文本为依据。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξαντο
  choice: 接受了这项安排
  rationale: 该动词的中间语态在这里最自然地表示接受或承担先前提出的安排；此译法符合行政处置的语境，也不把含义限定为单纯“赞同”。
- source_word: κατὰ ταῦτα
  choice: 照此
  rationale: 该短语表示依照前述事项或安排。“照此接受了这项安排”既保留其承接关系，也符合现代汉语表达。
- source_word: συνεβράβευσαν αὐτοῖς
  choice: 也同他们一起作出裁断
  rationale: συμβραβεύω较为罕见，含有共同评断、裁决或参与仲裁的意味。此译法传达其共同参与判断的性质，同时不武断地认定某种正式职衔。
- source_word: Ἰωνάθας Ἀζαήλου
  choice: 亚撒业的儿子约拿单
  rationale: 将希腊语属格按父名关系译为“……的儿子”，并采用中文读者较熟悉的圣经人名形式。
- source_word: Ἐξειας Θοκάνου
  choice: 托迦努斯的儿子希西家
  rationale: Ἐξειας采用通行的闪语人名形式“希西家”；Θοκάνου缺乏可由希腊文本独立确认的固定对应名，故按希腊语音译为“托迦努斯”。
- source_word: Μοσόλλαμος
  choice: 莫索拉穆斯
  rationale: 本节以《以斯得拉一书》的希腊文本为首要依据，因此按希腊形式音译；近似希伯来平行经文中的名字只在脚注说明。
- source_word: Λευεὶς
  choice: 利未
  rationale: 此处为单数，并处于人名列表中，应理解为个人名字“利未”，而非群体称谓“利未人”。
- source_word: Σαββαταῖος
  choice: 撒巴泰乌斯
  rationale: 依希腊文本音译该人名，不以近似希伯来平行经文中的“沙比太”取代正文所见形式。
