base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: zh_hans
  text: 他们承诺要遣走自己的妻子[a]，又献上公绵羊，为自己的无知赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承诺要遣走”原文直译近似“把手放上去”，这里是指他们承担并决定这样做。
    reason: lexical_alternative
  - marker: b
    text: “无知”也可指“过错”或“无意中所犯的罪”；这里处于献祭赎罪的语境中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: 承诺
  rationale: 原文直译近似“把手放上”，在接不定式时表达着手承担、立意实行或约束自己去做；译作“承诺”可自然传达其承担义，避免误解为实际按手。
- source_word: ἐκβαλεῖν
  choice: 休掉
  rationale: 此处宾语是妻子，指解除婚姻并将其遣离；“休掉”在现代汉语中清楚表达婚姻语境，同时保留原动词较强的遣离意味。
- source_word: τὰς γυναῖκας αὐτῶν
  choice: 自己的妻子
  rationale: γυναῖκες 在此指配偶，而非泛指女人；希伯来文平行材料也支持妻子的含义。
- source_word: εἰς ἐξιλασμόν
  choice: 献上……作赎罪祭
  rationale: ἐξιλασμός 表示除罪、赎罪；结合后面的公绵羊，中文补出原文省略但语境明确的献祭动作，使句意完整，又不改变祭牲的目的。
- source_word: κριούς
  choice: 公绵羊
  rationale: 准确保留祭牲的性别与复数类别；汉语中“公绵羊”比单用“公羊”更明确。
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: 为自己的无知之过赎罪
  rationale: ἀγνοία 本义为无知、不知情，在献祭语境中可指因无知而犯的过错；“无知之过”兼顾字面意义与祭祀语境，不径直限定为某一技术性罪类。
theological_decisions:
- issue: 献祭语境中 ἀγνοία 的含义
  choice: 无知之过
  alternative: 误犯的罪；无意中所犯的罪；过失
  rationale: 该词在此很可能带有因不知情而犯罪的祭祀含义，但希腊文仍用“无知”一词。“无知之过”保留其词面与伦理张力，并借“赎罪”显出祭祀语境。
- issue: ἐπέβαλον τὰς χεῖρας 的惯用意义
  choice: 承诺
  alternative: 伸手着手去做；立誓；按手
  rationale: 逐字译作“按手”会让中文读者误以为发生了身体接触；其后所接的不定式表明这是承担并决定实行遣妻之举。
- issue: 希腊文后半句的省略结构
  choice: 补出“献上……作赎罪祭”
  alternative: 并为赎罪，为他们的无知献公绵羊
  rationale: 原文在“公绵羊”前省略献祭动词。中文若完全照搬会生硬难解；补出语境明确的动作，不增加祭物、对象或神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“休掉”明确婚姻解除语境；后半句补足希腊文省略的献祭动作，使中文通顺。所有解释性标记均在正文出现。
