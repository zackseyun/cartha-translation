base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: zh_hans
  text: 这一天是归主为圣的[a]；众人听见律法时，都在哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》8章的希伯来文平行经文作“归我们的主为圣”，随后还劝众人吃、喝、分送食物，并且不要忧愁；《以斯拉一书》此处保存的是较短的希腊文本。
    reason: 交代平行经文的文本差异，避免把希伯来文较长内容并入希腊正文。
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: 这一天
  rationale: 直接保留指示语气，符合现代汉语表达。
- source_word: ἁγία τῷ κυρίῳ
  choice: 归主为圣
  rationale: 既表达ἁγία的“圣洁、分别为圣”，也自然呈现与格τῷ κυρίῳ所表示的归属关系；不加入希腊文没有的“我们的”。
- source_word: πάντες
  choice: 众人……都
  rationale: 保留“所有人”的集体含义，同时避免增添原文未明说的“百姓”。
- source_word: ἔκλαιον
  choice: 在哭泣
  rationale: 以进行性表达对应未完成时，体现哭泣正在持续。
- source_word: ἐν τῷ ἀκοῦσαι
  choice: 听见……时
  rationale: 将ἐν加冠词不定式自然译为时间从句。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 此处指公开宣读的律法；“律法”在中文圣经语境中明确而自然，并保持希腊语νόμος的宗教含义。
theological_decisions:
- issue: 是否把尼希米记8章希伯来文平行经文中的“我们的主”及吃喝、分享、不要忧愁等内容纳入正文
  choice: 正文只翻译现存希腊文，采用“归主为圣”，不加入“我们的”或后续劝勉。
  alternative: 按希伯来文平行经文扩写为“归我们的主为圣”，并补入吃喝、分享及不要忧愁的劝勉。
  rationale: 《以斯拉一书》此处的希腊文本较短，且叙述形式不同。希伯来文可印证背景，却不应取代或调和主要的希腊文本；脚注说明差异即可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归主为圣”兼顾原文的神圣含义与中文自然度；分号保留前后两句既紧密相连又各自完整的结构。
