base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: zh_hans
  text: 亚他拉提[a]对身为大祭司和宣读者的以斯拉，以及教导众人的利未人，对他们众人说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来平行经文在这里作“尼希米，即提尔沙他（省长）”；“亚他拉提”可能与“提尔沙他”这一称号有关。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: ……说
  rationale: 用现代汉语叙事句式表达；本节是承接上文的残句，汉语无需机械译出句首“καί”。
- source_word: Ἀτταρατὴ
  choice: 亚他拉提
  rationale: 按希腊文保留其专名或称号形式，不以希伯来平行经文中的“尼希米”直接替换。
- source_word: τῷ ἀρχιερεῖ
  choice: 大祭司
  rationale: ἀρχιερεύς通常指“大祭司”；这一译法自然、明确，并忠实反映希腊文本强于希伯来平行经文“祭司”的称谓。
- source_word: καὶ ἀναγνώστῃ
  choice: 兼宣读者
  rationale: ἀναγνώστης指朗读、宣读文本的人；“宣读者”比单纯“读者”更能表达在会众前公开宣读的职分。καί在此连接以斯拉的两个身份，故译“兼”。
- source_word: τοῖς Λευείταις τοῖς διδάσκουσι τὸ πλῆθος
  choice: 那些教导会众的利未人
  rationale: 保留现在分词的描述性作用；πλῆθος在此指聚集的人群，译作“会众”较符合敬拜聚会语境，同时仍是普通现代汉语。
- source_word: ἐπὶ πάντας
  choice: ——对他们所有人——
  rationale: 原短语在现存希腊句法中较突兀。按其可能强调受话者全体的作用，以插入语呈现，既不删除，也不将其过度改写为希伯来平行经文的“对全体百姓”。
theological_decisions:
- issue: Ἀτταρατὴ与希伯来平行经文人物的关系
  choice: 正文保留希腊形式“亚他拉提”，脚注说明希伯来平行经文作“省长尼希米”。
  alternative: 正文直接译作“省长尼希米”或“提尔沙他”。
  rationale: 《以斯得拉一书》以希腊文本为主要依据；两种传统在此确有差异，不应以平行经文无声取代希腊读法。
- issue: 以斯拉的称谓
  choice: 按希腊文译作“大祭司兼宣读者”。
  alternative: 依希伯来平行经文译作“祭司兼文士”。
  rationale: 希腊文与希伯来平行经文对以斯拉的称谓略有不同。正文忠实呈现希腊文，差异则置于脚注，避免抹平文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“宣读者”突出公开诵读经文的角色；用破折号保留ἐπὶ πάντας在希腊句中的强调和句法突兀感，而不擅自把它改成希伯来平行经文的完整措辞。
