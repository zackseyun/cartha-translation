revisions:
- from: 亚他拉提[a]对大祭司兼宣读者[b]以斯拉，以及那些教导会众的利未人——对他们所有人——说：
  to: 亚他拉提[a]对身为大祭司和宣读者的以斯拉，以及教导众人的利未人，对他们众人说：
  rationale: 修订仅改善现代汉语表达并收紧平行经文脚注的表述：保留希腊文本的专名、以斯拉的双重称谓、利未人的教学角色，以及末尾面向全体受话者的短语。脚注b的锚点仍附于“宣读者”，并完整保留。
