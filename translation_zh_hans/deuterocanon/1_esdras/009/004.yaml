base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: zh_hans
  text: 凡不在两三天内前来报到的，照主持的长老们所作的裁决，他们的牲畜都要归为圣用[a]，本人也要从被掳者的会众中除名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归为圣用”在这里可能意味着被没收或充公。
    reason: 说明ἀνιερωθήσονται在司法语境中的处罚性含义，同时保留其奉献、归圣的字面色彩。
  - marker: b
    text: “被掳者的会众”也可译作“流亡者的群体”。
    reason: 提供ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας较自然的另一种译法。
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: 前来报到
  rationale: 此处是回应召集、按期到场，不只是一般意义上的“相遇”；“前来报到”自然表达其召集与法律语境。
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: 在两三天内
  rationale: 表达获准到场的期限；“两三天”保留希腊文“二或三天”的范围，而“内”体现截止时限。
- source_word: κατὰ τὸ κρῖμα
  choice: 照……所作的裁决
  rationale: κρῖμα在此指具有权威的司法性决定；“裁决”保留正式的法律语气。
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: 主持事务的长老们
  rationale: προκαθημένων表示居首、主持或领导；此译既保留分词含义，也符合现代汉语表达。
- source_word: ἀνιερωθήσονται
  choice: 归为圣有
  rationale: 该动词本义涉及奉献、归为神圣所有，在本案司法语境中可能实际意味着没收；正文保留其宗教—法律张力，脚注说明其处罚性含义。
- source_word: τὰ κτήνη αὐτῶν
  choice: 他们的牲畜
  rationale: κτήνη通常指牲畜或役畜。尽管平行传统涉及更广义的财产，希腊文本在此明确使用牲畜一词，故不将其泛化。
- source_word: ἀλλοτριωθήσεται
  choice: 除名
  rationale: 该被动式表示使某人与所属群体疏离、隔绝；在共同体处分语境中，“除名”清楚传达其成员身份被剥夺的结果。
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: 从被掳者的会众中
  rationale: πλῆθος可指众人、群体或会众，αἰχμαλωσία指被掳或被掳群体；此译贴近希腊文，同时避免擅自加入“归回”等文本未明说的信息。
theological_decisions:
- issue: 不服从召集者的牲畜所受处分的性质
  choice: 译作“归为圣有”，并在脚注说明在此可能具有没收、充公的实际效力。
  alternative: 直接译作“没收”或“充公”，将其视为纯粹的财产处罚。
  rationale: ἀνιερωθήσονται带有奉献或归为神圣所有的词义色彩，但司法语境显示其同时具有惩罚性、没收性的实际后果。正文不消除这种宗教与法律之间的张力。
- issue: 被处分者与被掳群体的关系
  choice: 译作“从被掳者的会众中除名”。
  alternative: 译作“与流亡者群体隔绝”或“从归回者的共同体中排除”。
  rationale: 译文表达共同体成员资格被剥夺，但不把“被掳”解释性改写成“归回”，也不赋予超出本文的宗派性含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“前来报到”体现正式召集，“裁决”“除名”维持法律语域；“归为圣有”刻意保留希腊文中宗教奉献与处罚性没收并存的张力，并以脚注辅助普通读者理解。
