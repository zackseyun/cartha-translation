base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: zh_hans
  text: 宣读律法时[a]，众人都挺身站立；阿扎利亚斯[b]颂赞至高的上帝、万军之上帝[c]、全能者，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“展开（或打开）律法书时。”希腊语动词本义是“解开”，在这里可指展开卷轴以便公开宣读。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“阿扎利亚斯”；希伯来文平行经文的名字形式是“亚撒利雅”。
    reason: alternative_reading
  - marker: c
    text: “万军”译自希腊文σαβαώθ（萨巴奥特），这是一个传统的神圣称号；也可保留音译。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ λῦσαι τὸν νόμον
  choice: 宣读律法时
  rationale: 该带冠词不定式结构表示时间。λύω本义为“解开”，在卷轴语境中可指展开、打开；结合公开聚会的上下文，“宣读律法”自然传达其实际动作与目的，同时以脚注保留字面可能性。
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: 众人都挺身站立
  rationale: ὀρθοί强调直立、挺身的姿态；“挺身站立”比单说“站立”更完整地保留这一含义。
- source_word: εὐλόγησεν
  choice: 颂赞
  rationale: 当εὐλογέω以神为对象时，意为称颂、赞美；现代汉语用“颂赞”比“祝福上帝”更自然，也不消除其祝颂色彩。
- source_word: Ἀζαρίας
  choice: 阿扎里亚斯
  rationale: 按本书主要希腊文本的名字形式音译，并以脚注说明希伯来文平行经文的名字形式。
- source_word: τῷ ὑψίστῳ θεῷ
  choice: 至高的上帝
  rationale: 保留ὕψιστος作为神圣称号的最高级含义，措辞庄重且为现代读者易懂。
- source_word: σαβαὼθ
  choice: 万军之上帝
  rationale: σαβαώθ是音译进入希腊文的传统神圣称号，语义为“万军”；译出其意义而非再次音译，并避免在正文中无依据地增添希腊文没有的κύριος“主”。
- source_word: Παντοκράτορι
  choice: 全能者
  rationale: παντοκράτωρ表示掌管一切、拥有全权者；“全能者”是自然、庄重且通行的神圣称号。
theological_decisions:
- issue: 如何处理τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι这一连串神圣称号
  choice: 至高的上帝、万军之上帝、全能者
  alternative: 至高的上帝、万军之主、全能者；至高的上帝萨巴奥特、全能者
  rationale: 希腊文并列累加称号，未明确标示各称号之间更细的句法关系。正文以并列结构保留这种张力；将σαβαώθ译出语义，但不添加原文没有的“主”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挺身站立”保留原文姿态意味；神圣称号连续并列，以免把希腊文含混的关系解释得过死。句末保留逗号，反映原希腊文本此处语句仍接续下文。
