base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: zh_hans
  text: 比拜的子孙中，有约安尼斯、亚拿尼亚、扎布多斯和以马提斯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些名字在大致对应的马所拉文本中可能有不同的希伯来文形式；本书此处依据希腊文见证翻译，保留其所载的约安尼斯、亚拿尼亚、扎布多斯和以马提斯。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: 比拜的子孙中，有
  rationale: ἐκ表示从较大群体中列出成员；υἱῶν在家族名册中可泛指后代。译作“子孙”比字面的“儿子”更符合现代汉语名册语境，同时保留家族归属关系。
- source_word: Ἰωάννης
  choice: 约安尼斯
  rationale: 依据作为主要底本的希腊文音译，不以可能对应的希伯来名字替换。
- source_word: Ἁνανίας
  choice: 亚拿尼亚
  rationale: 采用现代中文圣经语境中自然且可辨识的希腊名字音译，同时以本节希腊文本为依据。
- source_word: Ζάβδος
  choice: 撒布多斯
  rationale: 按希腊文Ζάβδος保守音译，不用近似马所拉传统可能提示的其他名字取代。
- source_word: Ἐμαθίς
  choice: 以马提斯
  rationale: 按Swete希腊文本中的少见专名作直接、保守的中文音译。
