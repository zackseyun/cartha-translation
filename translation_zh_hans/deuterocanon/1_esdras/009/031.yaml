base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: zh_hans
  text: 亚丁的子孙中有：拉托斯、摩西亚斯[a]、拉库诺斯、奈多斯、贝斯卡斯帕斯莫斯、塞斯特尔、巴尔努斯和玛拿西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本是一串人名，其中数名的文本并不确定，或与近似的希伯来文平行记载不同。因此，本译文主要依照希腊文形式音译，没有使其与马所拉文本一致。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: 亚丁的子孙中有
  rationale: ἐκ加属格在名单中表示某家族成员中的一部分。“子孙”自然传达υἱοί在宗族名单中的广义用法，同时保留家族归属关系。
- source_word: Λάθος καὶ Μοοσσείας
  choice: 拉托斯、摩西亚斯
  rationale: 两者均按希腊文人名音译，不据近似的希伯来平行文本改写。
- source_word: Λακκοῦνος καὶ Νάιδος
  choice: 拉库诺斯、奈多斯
  rationale: 依希腊文形式音译；中文采用便于朗读且能较清楚对应原音的写法。
- source_word: Βεσκασπασμὸς καὶ Σεσθὴλ καὶ Βαλνοῦς
  choice: 贝斯卡斯帕斯莫斯、塞斯特尔、巴尔努斯
  rationale: 这些疑难人名紧随现存希腊文音译，不以推测的希伯来名字替代，以保留文本的不确定性。
- source_word: Μανασσῆς
  choice: 玛拿西
  rationale: 采用现代中文圣经传统中广为人知的人名形式，既自然易认，也对应希腊文Μανασσῆς。
