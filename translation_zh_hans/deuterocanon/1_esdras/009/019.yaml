base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: zh_hans
  text: 在约萨达的儿子耶书亚的子孙和他的弟兄中，有玛伊拉斯[a]、以利亚撒、约里布斯和约阿达努斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里列出“玛伊拉斯、约里布斯、约阿达努斯”。《以斯拉记》10:18、20—21的近似希伯来平行段所载名字不同；这反映《以斯得拉一书》与马所拉文本在这些名单上的对应关系较为自由。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: ……的儿子们……中，有
  rationale: ἐκ引出较大群体中的若干人；用“中，有”既保留分组选列的作用，也符合现代汉语名单句式。
- source_word: Ἰησοῦ τοῦ Ἰωσεδὲκ
  choice: 耶书亚
  rationale: 按希腊语语法，τοῦ Ἰωσεδὲκ与前面的Ἰησοῦ同为受ἐκ支配的属格，并非明确的父子结构；因此不把Ἰωσεδὲκ译作“约萨达的儿子”。这里将两个群体理解为“耶书亚的儿子们”和“他的弟兄”。
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: 以及他的弟兄中
  rationale: αὐτοῦ是单数属格，最自然地回指耶书亚；“弟兄”适合这里男性祭司家族名单的语境。
- source_word: Μαεήλας
  choice: 玛伊拉
  rationale: 依Swete希腊正文音译，不用以斯拉记马所拉文本近似平行处的不同名字来协调。
- source_word: Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 采用此圣经人名在现代中文译本中通行且易识别的形式。
- source_word: Ἰώριβος
  choice: 约里布
  rationale: 依希腊形式音译，并保留其与近似希伯来平行名单可能存在的差异。
- source_word: Ἰωάδανος
  choice: 约阿达努
  rationale: 直接反映希腊正文的人名形式，不以近似平行经文中的名字替代。
