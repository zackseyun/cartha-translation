base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: zh_hans
  text: 撒摩特的子孙中，有以利亚达[a]、以利亚西慕、俄托尼亚、雅利摩特、撒巴多[b]和泽拉利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节若干人名所呈现的希腊文形式，可能与希伯来文平行传统不同；本译依照《以斯拉一书》的希腊文本，不将这份名单强行协调为《以斯拉记》或《尼希米记》的形式。
    reason: alternative_reading
  - marker: b
    text: 所据原文转录被标注为有轻微不一致，因此个别人名的拼写仍略有不确定；这里按所提供的希腊文见证作保守音译。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: ……的子孙中，有……
  rationale: ἐκ表示从某一家族群体中列出成员；这一表达既贴近希腊文，又符合现代汉语名单体例。
- source_word: Ζαμόθ
  choice: 撒摩特
  rationale: 按希腊文名称作保守音译，不以希伯来文平行传统中的可能对应名加以协调。
- source_word: Ἐλιάδας
  choice: 以利亚达
  rationale: 依据希腊文音译，并采用汉语圣经人名中较自然的形式，不强行恢复其可能的希伯来文原名。
- source_word: Ἐλειάσειμος
  choice: 以利亚西慕
  rationale: 按所提供希腊文字母顺序作保守音译；此名罕见，不作过度规范化。
- source_word: Ὀθονίας
  choice: 俄托尼亚
  rationale: 直接反映希腊文名称的读音，同时采用自然可读的现代汉语音译。
- source_word: Ἰαριμώθ
  choice: 雅利摩
  rationale: 按圣经人名常见汉语音译习惯处理词首Ἰ，并保留希腊文名称的基本音形。
- source_word: Σάβαδος
  choice: 撒巴多
  rationale: 依希腊文见证音译；不因可能相关的希伯来名而改译为“撒拔”等形式。
- source_word: Ζεραλίας
  choice: 泽拉利亚
  rationale: 直接音译希腊文名称，不静默协调为平行传统中可能不同的人名。
