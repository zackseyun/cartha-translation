base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: zh_hans
  text: 他对祭司和宣读者[a]以斯拉说：“把以色列的上帝所赐下的摩西律法取来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣读者”也可译作“朗读者”，指向众人朗读或宣读的人；有人译作“文士”，但这里的希腊词更直接指朗读或宣读的人。
    reason: lexical_alternative
  - marker: b
    text: “所赐下的”也可译作“所交付的”或“所传下的”；希腊词既可强调给予，也可强调传递。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 吩咐
  rationale: 该动词本义为“说”，但后接表示所要求行动的不定式 κομίσαι；“吩咐……把……取来”在现代汉语中自然表达此结构，同时不强化为正式命令。
- source_word: Ἔσρᾳ
  choice: 以斯拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τῷ ἱερεῖ καὶ ἀναγνώστῃ
  choice: 祭司兼宣读者
  rationale: 两个带定冠词语境的同格身份均指以斯拉；“兼”自然表明一人兼具两种身份。ἀναγνώστης 直接指朗读、宣读的人，不按近似平行经文协调为“文士”。
- source_word: κομίσαι
  choice: 取来
  rationale: 语境指将律法带到现场；“取来”比单纯“带来”更贴合奉命去取得并带来的动作。
- source_word: τὸν νόμον Μωυσέως
  choice: 摩西律法
  rationale: 简明而自然地表达属格结构“摩西的律法”，并保留律法与摩西的明确关联。
- source_word: τὸν παραδοθέντα
  choice: 赐下的
  rationale: παραδίδωμι 可表示交付、传下或给予；在上帝为施动者的语境中，“赐下”庄重自然，但其“传交”意味通过脚注保留。
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: 上帝赐下的
  rationale: ὑπό 与被动分词标明施动者；中文将“以色列的上帝”前置到“赐下”之前更自然，并完整保留神圣称谓。
theological_decisions:
- issue: 律法与摩西及上帝的关系
  choice: 上帝赐下的摩西律法
  alternative: 以色列的上帝借摩西赐下的律法
  rationale: 希腊文将律法与摩西相联，并以上帝为传授律法的施动者，却没有明说“借摩西”；译文因此保留两层关系而不补入传递方式。
- issue: παραδοθέντα 所表达的神圣传授
  choice: 赐下的
  alternative: 传下来的／交付的
  rationale: “赐下”符合上帝作为施动者的语境；脚注同时保留原词可侧重交付、传承的真实语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“祭司兼宣读者”清楚呈现以斯拉的双重身份；“取来”符合叙事动作。“上帝赐下的摩西律法”避免生硬的多重“的”字结构，也不加入原文未明说的“借摩西”。
