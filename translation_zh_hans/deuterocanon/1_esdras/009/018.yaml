base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/018.yaml
  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: zh_hans
  text: 在祭司中，查出了一些被召集在一起、娶了外族女子的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于：“那些被召集在一起、拥有外族女子的人。”传抄下来的句式略显生硬；希伯来文平行经文支持这里是指“娶了外族女子”。
    reason: textual_variant
lexical_decisions:
- source_word: εὑρέθησαν
  choice: 查出
  rationale: 保留不定过去时被动态所表达的调查后发现、列出的意味；现代汉语用“查出”比机械译作“被发现”更自然。
- source_word: τῶν ἱερέων
  choice: 在祭司中
  rationale: 将属格理解为部分属格，说明被查出的人属于祭司群体。
- source_word: οἱ ἐπισυναχθέντες
  choice: 有些聚集起来的人
  rationale: 不删除传抄希腊文本中明确存在的被动分词“聚集起来”，同时以“有些……的人”表达带冠词分词所指的群体；承认原文句法略显生硬。
- source_word: ἀλλογενεῖς γυναῖκας
  choice: 外族女子
  rationale: ἀλλογενής 指属于另一族群或民族；“外族女子”准确而不带“陌生女子”等可能的误解。
- source_word: ἔχοντες
  choice: 娶了
  rationale: 希腊文直译为“有”，但以女子为宾语的上下文及希伯来文平行经文 נָשְׂאוּ 表明这里具有婚娶含义；“娶了”是自然且明确的现代汉语。
theological_decisions:
- issue: 如何处理希腊文“有外族女子”与希伯来文平行经文所表明的婚娶含义
  choice: 译作“娶了外族女子”
  alternative: 较直译作“有外族女子”
  rationale: 以希腊文为主要依据，同时用希伯来文平行见证澄清婚姻语境；这避免把“有”误解为一般交往或占有，并未加入经文之外的教派性解释。
- issue: 是否保留ἐπισυναχθέντες
  choice: 正文保留为“聚集起来的人”，并加注说明文本生硬
  alternative: 省略该词，仅译作“有些人”
  rationale: 该词见于所给主要希腊文本；虽然句法可能受传抄问题影响，仍不宜在正文中无声删除，应以脚注保存文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“查出”体现正式调查或核实名单的语境；脚注交代希腊文本的生硬之处及希伯来文平行见证，正文则保留主要希腊文本中的“聚集起来”。
