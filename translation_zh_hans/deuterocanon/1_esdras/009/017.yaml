base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: zh_hans
  text: 到正月初一，有关那些娶外族女子之人的案件都已处理完毕。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本较难理解：有关的分词更直译为“被聚集起来的”。希伯来平行文本支持正文按上下文译为“娶外族女子的”。
    reason: alternative_reading
  - marker: b
    text: “正月初一”指该历法中第一个月的第一日，也就是新月之日。
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: 处理完毕了
  rationale: 该被动惯用语表示事情被带到终点、办结。结合司法审查的语境，“处理完毕”自然地表达案件审结，同时避免生硬直译。
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: 那些人的案件
  rationale: 中性复数与κατά构成惯用表达，指与这些人有关的事项；上下文涉及逐案调查，因此译作“案件”简洁而准确。
- source_word: τοὺς ἐπισυναχθέντας
  choice: 娶……的
  rationale: 现存希腊词形通常意为“被聚集的”，但在此与“外族女子”直接相接，语义困难；平行希伯来文本明确说这些人娶了外族女子。正文依上下文采用“娶”，并以脚注保留希腊文本的疑难。
- source_word: γυναῖκας ἀλλογενεῖς
  choice: 外族女子
  rationale: ἀλλογενής指属于另一民族或族群的人；“外族女子”既贴近原义，也符合以斯拉记语境，并避免把古代群体界限现代化为国籍概念。
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: 到正月初一
  rationale: νουμηνία本指新月之日，即阴历每月初一；在完成事项的表达中，ἕως表示截至该日。“正月初一”是现代汉语中清楚自然的日期表达，脚注说明这里是历法中的第一个月，并非现代公历元旦或中国农历春节。
theological_decisions:
- issue: 希腊文本疑难与希伯来平行文本的关系
  choice: 正文按语境译作“娶外族女子”，脚注注明希腊文可直译为“被聚集起来的人”
  alternative: 正文直译为“被聚集起来、涉及外族女子的那些人”
  rationale: 希腊原文的分词按现存词形与宾语搭配不顺，而希伯来平行文本及全段语境明确涉及娶外族女子的人。此处理不掩盖文本张力：正文提供连贯意义，脚注保留主要原文证据与异读可能。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“案件”体现上下文逐案审查的性质；“处理完毕”比“被带到终点”更符合现代汉语。正文中的[a][b]与脚注标记完全对应。
