base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: zh_hans
  text: 全体会众都呼喊说：“阿们，阿们！”他们举起双手，俯伏在地，敬拜上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: 齐声高呼
  rationale: 该动词表示发出有力而清楚的声音；主语是全体会众，译作“齐声高呼”自然地传达公开、共同且强烈的回应。
- source_word: πᾶν τὸ πλῆθος
  choice: 全体会众
  rationale: πλῆθος本指众人或人群；此处处于集体敬拜场景，“会众”符合语境，“全体”保留πᾶν的完整范围。
- source_word: Ἀμήν, ἀμήν
  choice: 阿们！阿们！
  rationale: 这是会众的礼仪性回应，并非一般意义的“实实在在”；沿用现代中文宗教语境中通行的音译，同时以感叹号表现回应的力度。
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: 举起双手
  rationale: 简洁保留举手向上的敬拜动作；中文“举起”已自然包含向上的方向，无须重复译出ἄνω。
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: 俯伏在地
  rationale: 该短语描述伏倒于地的身体姿态；“俯伏在地”比“倒在地上”更准确传达此处主动而敬虔的动作。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 在明确以上帝为对象的语境中，该词不仅指身体下拜，也表达宗教性的崇敬；前文已译出俯伏姿态，因此此处用“敬拜”保留其神学分量。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 与现代标准普通话圣经文体相符，清楚标示敬拜的对象；希腊语与格在中文中直接作为动词宾语表达。
theological_decisions:
- issue: 俯伏动作与προσκυνέω的关系
  choice: 分别译为“俯伏在地”和“敬拜上帝”
  alternative: 合并译为“俯伏在地向上帝下拜”
  rationale: 原文先描述身体伏地，再陈明对上帝的敬拜。分别翻译可避免将προσκυνέω缩减为姿势，也保留身体行动与宗教意义两层表达。
- issue: 希腊文本与所附马所拉文本平行材料的关系
  choice: 以希腊文的会众回应场景为正文依据
  alternative: 引入所附希伯来文中诵读律法及讲解的内容
  rationale: 所附希伯来文内容与本节希腊文并不对应，且已注明仅为近似平行材料；因此不将其措辞或内容导入本节。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“全体会众齐声高呼”体现集体回应；“俯伏在地，敬拜上帝”保留原文连续动作及敬拜的神学力度。无需脚注。
