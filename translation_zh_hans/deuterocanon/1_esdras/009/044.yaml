base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: zh_hans
  text: 在左边的是：法拉代奥斯[a]、迈撒勒、麦勒基亚斯、罗塔苏博斯、拿巴雷亚斯[b]和撒迦利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从左边起”。希腊语这一短语表示这些人在会众或队列中的位置。
    reason: lexical_alternative
  - marker: b
    text: 这里若干姓名采用《以斯得拉一书》的希腊文形式；它们可能对应近似的马所拉文本平行记载中一些较熟悉的希伯来姓名，但正文以希腊文本为准。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: 在左边的是
  rationale: 该短语表示空间上的左侧；结合名单语境，译为“在左边的是”自然地说明这些人在队列或会众中的位置。
- source_word: Φαλαδαῖος
  choice: 法拉代奥斯
  rationale: 依希腊文姓名形式音译，不以不确定的希伯来对应名替换。
- source_word: Μεισαήλ
  choice: 迈撒勒
  rationale: 以现代汉语较顺畅的音节反映希腊文 Μεισαήλ，同时避免仅凭近似平行经文改成其他姓名。
- source_word: Μελχείας
  choice: 麦勒基亚斯
  rationale: 按希腊文形式音译；虽可能与较熟悉的希伯来姓名有关，正文仍以希腊见证为准。
- source_word: Λωθάσουβος
  choice: 罗塔苏博斯
  rationale: 保留《以斯得拉一书》希腊文本中的特殊姓名形式，不与近似的马所拉文本名单强行协调。
- source_word: Ναβαρείας
  choice: 拿巴雷亚斯
  rationale: 直接依希腊文音译；可能的希伯来对应关系并不确定，故不在正文中替换。
- source_word: Ζαχαρίας
  choice: 撒迦利亚
  rationale: 采用现代中文圣经中该常见人名的惯用译法，清楚易懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的名单句式。专名原则上依希腊文音译；仅“撒迦利亚”采用中文圣经中广为通行的传统译名。脚注保留方位短语的另一种理解，并交代希腊姓名形式与近似希伯来平行资料之间的不确定关系。
