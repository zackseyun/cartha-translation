  naturalness: “带到全体会众面前，就是男人、女人和所有祭司面前”在现代汉语中结构重复，且“就是”后的“面前”容易使“男人、女人和所有祭司”被误解为另一地点。改为“带给全体会众，包括男人、女人和所有祭司”，更自然清楚。“在七月新月那天”也比“那天是七月的新月日”更顺畅。
