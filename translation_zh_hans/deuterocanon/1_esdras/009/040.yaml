base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: zh_hans
  text: 大祭司以斯拉把律法带给全体会众，包括男人、女人和所有祭司，好让他们听律法；在七月新月那天。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》8:2–3的希伯来文平行经文在这里有所不同：其中说听众包括男人、女人和所有能明白的人，而不是“所有祭司”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόμισεν
  choice: 带到……面前
  rationale: 该动词有“带来、拿来”之意；结合公开宣读律法的场景，译作“带到……面前”自然，也不额外加入礼仪性的含义。
- source_word: ὁ ἀρχιερεύς
  choice: 大祭司
  rationale: 这是现代汉语圣经语境中对该祭司职衔最自然、明确的表达，也直接对应“首要的祭司”。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 希腊文仅作“律法”，没有“书”字；因此不依照平行经文增译“律法书”。
- source_word: παντὶ τῷ πλήθει
  choice: 全体会众
  rationale: πλῆθος指聚集起来的一大群人；“全体会众”既保留群体与聚集的意味，也比“群众”更符合庄重的公共宣读场景。
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: 男人、女人
  rationale: 希腊文采用从男人到女人的概括性表达。汉语若直译为“从男人到女人”容易被误解为范围或次序，故用并列形式自然表达两者都包括在内，同时保留原文的性别指称。
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: 所有祭司
  rationale: 严格依照本书的希腊文主要见证；《尼希米记》8:2–3的希伯来文平行经文在此不同，差异另列脚注。
- source_word: ἀκοῦσαι τὸν νόμον
  choice: 让他们听律法
  rationale: 不定式在此表达目的。“让他们听律法”符合现代汉语，又不把上下文所暗示的“宣读”直接增入正文。
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: 七月的新月日
  rationale: νουμηνία指新月或新月之日；译作“新月日”比单说“新月”更清楚地表明日期，同时未扩充为“新月节”。
theological_decisions:
- issue: 会众的性别表述
  choice: 男人、女人
  alternative: 从男人到女人；男女众人
  rationale: 保留希腊文明确提及男人和女人的内容，但采用自然现代汉语，避免将其含义中性化或把“从……到……”误作空间范围。
- issue: 希腊文本与《尼希米记》希伯来文平行经文对听众构成的不同记载
  choice: 所有祭司
  alternative: 凡能听明白的人
  rationale: 《以斯得拉一书》的翻译以现存希腊文为主要依据，因此正文保留“所有祭司”；希伯来文平行经文的重要差异在脚注中说明，不将两种见证混合。
- issue: ἀρχιερεύς的职衔
  choice: 大祭司
  alternative: 祭司长；首席祭司
  rationale: “大祭司”是现代汉语中清楚且通行的职衔，并不要求读者接受任何额外的宗派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“就是”用来展开说明“全体会众”的构成；分号划分日期说明，使长句清晰。脚注标记置于整节末尾，对应希腊文与希伯来文平行见证的差异。
