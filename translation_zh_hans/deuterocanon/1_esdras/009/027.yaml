base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/027.yaml
  text: 'From the sons of Elah: Mattan and Zechariah[a], Jezrikilus and Obadiah and Jeremoth and Aedeias.'
translation:
  language: zh_hans
  text: 以拉的子孙中，有玛坦、撒迦利亚[a]、耶兹里基洛斯、俄阿布迪奥斯、耶利末和阿埃德亚斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节有几个人名依希腊文近音译出，因为《以斯拉一书》与希伯来文平行名单在人名拼写和次序上时有差异；其中一些名字也可能采用较熟悉的希伯来文形式。
    reason: 说明罕见人名采用希腊文本近音译，并保留其与希伯来平行材料之间的不确定性。
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: ……的子孙中，有……
  rationale: ἐκ表示从某一宗族或群体中列举成员；采用现代汉语名单句式，既保留宗族结构，也避免生硬直译为“从……的众子”。
- source_word: Ἠλά
  choice: 以拉
  rationale: 按希腊文人名音译，并采用符合汉语圣经人名习惯的简洁形式。
- source_word: Ματαν
  choice: 玛坦
  rationale: 依希腊文 Ματαν 音译，不擅自改成其他希伯来传统形式。
- source_word: Ζαχαρίας
  choice: 撒迦利亚
  rationale: 采用现代中文读者熟悉的圣经人名形式；其与希腊文 Ζαχαρίας 对应明确。
- source_word: Ἰεζρίκιλος
  choice: 耶兹里基洛斯
  rationale: 此名罕见且对应关系不确定，因此贴近希腊文音译，不据平行经文推测性归并为另一个熟悉人名。
- source_word: Ὠαβδίος
  choice: 俄阿布迪奥斯
  rationale: 贴近所传希腊文本的音形；虽然此名可能与“俄巴底亚”等闪语名字有关，但不以推测性的希伯来对应取代希腊见证。
- source_word: Ἱερεμὼθ
  choice: 耶利末
  rationale: 采用较自然且符合中文圣经人名传统的形式，仍反映希腊文 Ἱερεμὼθ。
- source_word: Ἀηδείας
  choice: 阿埃德亚斯
  rationale: 按希腊文近音音译；因其与希伯来平行名单中人名的确切对应不明，不作协调性改写。
- source_word: καί
  choice: 、……和……
  rationale: 希腊文反复使用 καί 串联名单；中文以顿号列举，并在末项前用“和”，自然呈现同等并列关系。
theological_decisions: []
translation_notes:
  register: 使用庄重而自然的现代标准汉语。名单以“……的子孙中，有……”引出，符合当代中文表达；熟悉且对应明确的人名采用通行译法，罕见人名则以希腊文为首要依据作近音音译。
