    rationale: 原文是“份额／分份”，在此语境很可能是食物份额，但希腊语本身没有在该名词处明确说“食物”。应以“份额”保留原文表达，相关语境可置脚注。
  - severity: medium
    issue: 脚注b的中文表述不完整
    rationale: “给没有为他预备的人”缺少“预备什么”的宾语，且不符合自然汉语。应译作“给那些没有为他们预备食物的人”，以准确表达希伯来语平行经文。
