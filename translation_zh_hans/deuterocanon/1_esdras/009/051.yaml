base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: zh_hans
  text: 所以，你们去吧，吃丰盛的食物[a]，并把份额送给一无所有的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“肥厚之物”，指节庆时享用的肥美或上好的食物。
    reason: lexical_alternative
  - marker: b
    text: 《尼希米记》8:10的希伯来语平行经文更具体地说：“给那些没有为他们预备食物的人。”这里的“份额”在语境中很可能指食物的份额。
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: 去
  rationale: 该分词字面意为“走去”或“去了以后”，在这里与命令式连用，具有催促行动的作用；译作“去”简洁自然，并保留行动方向。
- source_word: οὖν
  choice: 所以
  rationale: 表示承接前文而得出的行动要求；“所以”准确传达推论关系，也符合现代汉语表达。
- source_word: φάγετε
  choice: 吃
  rationale: 第二人称复数命令式，直译为“吃”，无需增饰。
- source_word: λιπάσματα
  choice: 肥美的食物
  rationale: 指油脂丰厚、上好的节庆食物；“肥美的食物”既保留“肥厚”的词义，又避免生硬的“肥物”。希伯来语平行经文的 מַשְׁמַנִּים 也支持这一理解。
- source_word: ἀποστείλατε
  choice: 分送
  rationale: 原义为“送出”；结合所送的是供人享用的份额，“分送”在汉语中更清楚地表达将食物送给他人，同时未改变命令语气。
- source_word: ἀποστολάς
  choice: 食物
  rationale: 该词在本语境中指送出的份额；希伯来语平行经文 מָנוֹת 明确支持“份、份额”。为使汉语清楚衔接前句，正文译为“把食物分送”，脚注说明其字面为“份”。
- source_word: τοῖς μὴ ἔχουσιν
  choice: 给一无所有的人
  rationale: 希腊文简略地说“给那些没有的人”。译作“一无所有的人”保留其宽泛含义，不把希伯来语平行经文中“没有预备”的限定直接加入正文。
theological_decisions:
- issue: 是否借助尼希米记8:10的希伯来语平行经文限定受赠者
  choice: 正文依希腊文译为“一无所有的人”，脚注列出希伯来语较具体的表达
  alternative: 正文译为“没有预备食物的人”
  rationale: 希腊文是本节的首要依据，只说“那些没有的人”；希伯来语平行经文则说“没有为他预备的”。将较具体的读法置于脚注，既保存希腊文的概括性，也向读者交代平行传统所呈现的社会与节庆语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以”承接上下文；“去吃”保留希腊文的行动催促。“把食物分送”使ἀποστολάς在节庆共享的语境中清楚可懂，同时以脚注保留其“份额”的字面背景。所有脚注标记均置于所解释的相应短语之后。
