revisions:
- from: 所以，你们去吃肥美的食物[a]，也要把食物分送给一无所有的人[b]。
  to: 所以，你们去吧，吃丰盛的食物[a]，并把份额送给一无所有的人[b]。
  rationale: 修订以“去吧”清楚表达 βαδίσαντες 的催促性行动意味；以“丰盛的食物”自然对应 λιπάσματα；以“份额”保留 ἀποστολάς 的较宽泛原义，同时在脚注说明其节庆食物语境。保留“一无所有的人”以维持希腊文 τοῖς μὴ ἔχουσιν 的省略和概括性，不将希伯来语平行经文的“没有预备食物”直接纳入正文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:24:48Z'
