  source_fidelity: 译文总体准确传达了命令语气、丰盛食物及向缺乏者分享的意思。不过，ἀποστολάς 的核心含义是“份额／分份”，正文直接译为“食物”略有具体化；而 τοῖς μὴ ἔχουσιν 的省略宾语应尽量保留其概括性。
  naturalness: “你们去吃”在现代汉语中容易被理解为“前往某处吃”，未能清楚表达 βαδίσαντες 所带的“去吧／出发吧”式催促。“去吧，吃……”更自然。原脚注b“给没有为他预备的人”语法不完整，且未明确所预备的内容。
  terminology: “丰盛的食物”自然表达 λιπάσματα 的节庆性“肥美、上好”之意。“份额”对应 ἀποστολάς，避免把希腊文本未明说的“食物”直接固化进正文；脚注可说明语境所指通常为食物份额。
