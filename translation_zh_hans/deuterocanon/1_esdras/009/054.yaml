base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: zh_hans
  text: 于是众人都离去，去吃喝、欢喜，并把食物分送给那些缺乏的人[a]，并且大大欢乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缺乏的人”直译为“没有的人”；希腊文未说明所缺何物。也可理解为“没有预备好食物份额的人”；希伯来文平行经文明说要把食物份额送给没有预备的人。
    reason: 说明希腊文隐含的宾语，以及希伯来文平行经文所支持的具体语境。
lexical_decisions:
- source_word: ᾤχοντο
  choice: 都离去
  rationale: οἴχομαι常指“离去、走开”；这里描写众人从聚会处散去，开始庆祝。
- source_word: φαγεῖν καὶ πιεῖν
  choice: 去吃喝
  rationale: 直接保留两个目的不定式，并采用现代汉语自然的固定搭配“吃喝”。
- source_word: εὐφραίνεσθαι
  choice: 欢喜
  rationale: 此词兼有喜乐和节庆欢庆之意；“欢喜”既自然，也不把含义限定为外在庆祝活动。
- source_word: δοῦναι ἀποστολὰς
  choice: 把食物分送给
  rationale: ἀποστολάς本身可指送出的东西；结合希伯来文平行经文的“份”，此处指节庆中分送的食物。译文用“食物”交代语境所含的对象，用“分送”表达按份分享。
- source_word: τοῖς μὴ ἔχουσιν
  choice: 一无所有的人
  rationale: 希腊文直义为“那些没有的人”，所缺的对象并未明说。“一无所有的人”保留其概括性，脚注则说明希伯来文平行经文所提示的较具体理解。
- source_word: εὐφρανθῆναι μεγάλως
  choice: 大大欢乐
  rationale: 保留μεγάλως的加强语气，也保留本句先后两次表达欢喜的修辞重复；后一次用“欢乐”，使中文流畅而不抹去重复。
theological_decisions:
- issue: 是否依据希伯来文平行经文补明τοῖς μὴ ἔχουσιν所缺少的对象
  choice: 正文保留宽泛的“一无所有的人”，脚注说明可能特指没有预备食物份额的人
  alternative: 正文直接译作“没有预备食物份额的人”
  rationale: 希腊文是主要翻译依据，其宾语保持隐含；希伯来文平行经文可帮助确定节庆分享食物的语境，却不宜在正文中完全消除希腊文原有的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文；“都离去，去……”清楚表达众人从聚会处散去的动作与目的。保留“欢喜／大大欢乐”的重复，以反映希腊文的修辞饱满度。
