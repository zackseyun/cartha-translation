base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: zh_hans
  text: 他在那里留宿时[a]，一点饼也没有尝，一口水也没有喝[b]，为众人所行的严重不法之事哀痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那里过夜”“在那里宿营”。希腊语分词表示在该处留宿或度过一夜，并未说明具体住宿方式。
    reason: lexical_alternative
  - marker: b
    text: 《以斯拉记》希伯来文的平行叙事把具体过犯说成娶外族女子；这里的希腊文则概括地称为“不法之事”。
    reason: parallel_source
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: 在那里过夜
  rationale: 该分词表示在某处留宿、度过一夜；“过夜”自然明确，又不额外限定是在营地或屋内。
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: 一点饼也没有尝
  rationale: 保留ἄρτον“饼”和γεύομαι“尝”的具体措辞；加“一点……也”使汉语否定表达自然，并传达完全禁食。
- source_word: ὕδωρ ἔπιεν
  choice: 一口水也没有喝
  rationale: 按原文保留“水”，与前句形成自然的汉语对偶，并清楚表达滴水未进。
- source_word: πενθῶν
  choice: 哀痛
  rationale: πενθέω表示因重大事情深切悲伤或哀恸；“哀痛”既庄重，又适合这里带有悔罪意味的语境。
- source_word: τῶν ἀνομιῶν τῶν μεγάλων
  choice: 严重不法之事
  rationale: ἀνομία指违背律法或正当秩序的行为，不只是泛称坏事；τῶν μεγάλων在此强调情节重大，译作“严重”比字面的“巨大”更符合现代汉语。
- source_word: τοῦ πλήθους
  choice: 众人
  rationale: πλῆθος指群体或大批人；“众人”简洁自然，保留集体意义，而不把它具体化为某个制度性的会众组织。
theological_decisions:
- issue: ἀνομία的道德与律法含义
  choice: 不法之事
  alternative: 罪孽；过犯；违法行为
  rationale: “不法之事”保留违背律法的含义，同时避免把原文泛化为一般性的罪，也不采用容易令人只联想到现代世俗法规的“违法行为”。
- issue: 与《以斯拉记》希伯来文平行材料的关系
  choice: 正文按希腊文概括为“严重不法之事”
  alternative: 在正文中具体译为“娶外族女子”
  rationale: 现存希腊文在本节使用概括性的ἀνομίαι，并未明说具体行为；即使希伯来文平行叙事提供了具体背景，也不应据此替换希腊正文，以免消除其概括性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一点饼也没有尝，一口水也没有喝”以自然对偶重现原文禁食禁水的强调；“不法之事”保留律法层面的力度，但不引入特定宗派术语。
