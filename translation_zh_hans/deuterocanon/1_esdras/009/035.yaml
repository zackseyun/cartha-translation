base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: zh_hans
  text: 属奥玛家族的有：泽提亚[a]、扎巴迪亚、埃多、乌埃勒[b]和巴奈亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本逐一列出这些名字；《以斯拉记》第10章的马所拉文本平行段落在相应位置以总结语结束，没有保留同一份名单。
    reason: cross_reference
  - marker: b
    text: 希腊文这里列的是人名。“属奥玛家族的”把“从奥玛一族中”这一省略式结构所含的家族归属表达出来。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν Ὀομά
  choice: 属奥玛家族的有
  rationale: ἐκ引出名单中的一个分组；定冠词加专名在此为省略式家族称谓。译为“属……家族的有”既表达从属关系，也避免把原文未明说的“儿子”绝对化。
- source_word: Ζειτιάς
  choice: 泽提亚
  rationale: 依希腊文读音音译，并以现代汉语常用的人名音译形式呈现。
- source_word: Ζαβαδαίας
  choice: 扎巴迪亚
  rationale: 依据希腊文形式音译，不强行归并为某个较熟悉的希伯来名字。
- source_word: Ἠδός
  choice: 以多
  rationale: 按希腊文形式作简洁、易读的汉语音译。
- source_word: Οὐὴλ
  choice: 乌埃勒
  rationale: 保留希腊文Οὐ-开头及后续元音的辨识度，避免擅自改作可能对应的希伯来名字。
- source_word: Βαναίας
  choice: 巴奈亚
  rationale: 直接依据希腊文形式音译，不按推定的希伯来对应名标准化。
