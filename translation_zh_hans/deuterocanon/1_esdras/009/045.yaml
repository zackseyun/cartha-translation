base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: zh_hans
  text: 以斯拉在会众[a]面前拿起那书[b]；原来他坐在众人面前显要的位置上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“众人”或“人群”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“书”；按当时的形制，也可指卷轴。
    reason: cultural_note
  - marker: c
    text: 也可译作“坐得很显要”或“受尊崇地坐着”；希腊文表示他的座位在众人面前显得突出而受尊重。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβών
  choice: 拿起
  rationale: 表示把某物拿到手中；“拿起”自然传达以斯拉取持书卷的动作，又不额外赋予礼仪性的“高举”含义。
- source_word: τὸ βιβλίον
  choice: 那书卷
  rationale: βιβλίον可指书或卷轴；此处采用符合古代实物形态的“书卷”，同时以脚注说明希腊文直称“书”。
- source_word: τοῦ πλήθους
  choice: 会众
  rationale: πλῆθος指聚集的一大群人；上下文是公开聚会，“会众”兼顾群体规模与集会语境，但也可译作“众人”或“人群”。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 原文两次使用ἐνώπιον，均译为“在……面前”，保留公开、可见的场景及重复结构。
- source_word: προεκάθητο
  choice: 坐在……面前
  rationale: 该未完成时形式描写以斯拉当时所处的坐席位置；“坐在众人面前”比单译“坐着”更完整地表达关系。
- source_word: ἐπιδόξως
  choice: 一个显要的位置
  rationale: 该副词表示公开而受尊重、引人注目的地位或位置；转译为“一个显要的位置”符合现代汉语，同时保留其可见与尊荣的双重意味。
- source_word: πάντων
  choice: 众人
  rationale: 指在场的全体；译为“众人”自然承接前面的“会众”，不额外限定身份。
theological_decisions: []
