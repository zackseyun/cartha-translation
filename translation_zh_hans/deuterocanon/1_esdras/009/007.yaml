base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: zh_hans
  text: 以斯拉起来，对他们说：“你们违背了律法，与外族女子同住[a]，使以色列的罪加增了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同住”也可按本段语境理解为“娶了外族女子为妻”或“与外族女子结为夫妻”。希腊文动词的字面意思是“一同居住”，在这里可指与其他族群的女子形成婚姻结合。
    reason: 说明原文动词的字面范围及其在上下文中的婚姻含义。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 该不定过去时分词引出以斯拉的发言；“站起来”自然地保留了叙事动作。
- source_word: ἠνομήσατε
  choice: 违背了律法
  rationale: ἀνομέω指行事违反律法；此译比笼统的“犯罪”更能保留原词的律法色彩，同时符合现代汉语表达。
- source_word: συνῳκίσατε
  choice: 同住
  rationale: 该动词的字面意思是共同居住或同居；在本段语境中所指涉及与外族女子形成婚姻结合，但正文保留希腊文措辞的宽度，脚注说明其语境含义。
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: 外族女子
  rationale: ἀλλογενής指属于另一民族或族群；“外族女子”简明、自然，并保留当时的族群含义。
- source_word: προσθεῖναι
  choice: 增添
  rationale: 不定式表达前述行为造成的结果；“增添”保留了使以色列的罪加重这一意象。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: “罪”是ἁμαρτία在此处最直接清楚的对应词。
- source_word: τῷ Ἰσραήλ
  choice: 给以色列
  rationale: 与“增添”搭配，清楚表达这些行为使以色列整体的罪增加。
theological_decisions:
- issue: 是否在正文中把συνῳκίσατε明确译为婚娶
  choice: 译作“与外族女子同住”，并在脚注说明语境中的婚姻含义
  alternative: “娶了外族女子为妻”或“与外族女子结为夫妻”
  rationale: 希腊文动词本身着重共同生活，相关上下文则指向婚姻结合。保留较宽的正文措辞，可避免把语境推断直接写成原词唯一含义。
- issue: 责备所具有的以色列整体层面
  choice: “给以色列增添了罪”
  alternative: “使以色列的罪加重”或“使以色列蒙受罪责”
  rationale: 原文把这些人的行为与以色列整体相连；此译保留集体性的罪责表达，不将其缩减为纯粹个人过犯。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“违背了律法”保留法律性的责备；“外族女子”体现族群含义，避免古奥或带有现代国籍色彩的措辞。
