base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/012.yaml
  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
translation:
  language: zh_hans
  text: 两天也不够[a]，因为我们在这些事上犯了大罪。会众的领袖应当站出来；我们各聚居地[b]中所有有外族妻子的人，都应按约定的时间[c]前来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“连两个也不”；时间单位由上下文补出。意思是这件事无法在两天内办完。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“居住地”“社区”或“城镇”。希腊文在这里指百姓所居住的各个聚居社区，而非个别房屋。
    reason: lexical_alternative
  - marker: c
    text: 希腊文末句表达简略，字面近于“领受时间”。此处可能指各人获分配或指定时段后前来。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  choice: 两天之内也办不完
  rationale: 原文省略了时间单位及“办完”之意；上下文表明这件事不能在两天内完成。译文补出必要成分，同时以“也”保留οὐδέ承接前文的语气。
- source_word: ἐπὶ πλεῖον ἡμάρτομεν
  choice: 我们……犯了大罪
  rationale: ἡμάρτομεν明确表达犯罪；ἐπὶ πλεῖον强调程度严重。合译为“犯了大罪”，既自然，也保留道德与宗教意味。
- source_word: ἐν τούτοις
  choice: 在这些事上
  rationale: 指当前所议的外族婚姻问题；此译简洁，并不把指代范围解释得过窄。
- source_word: στήτωσαν δὲ οἱ προηγούμενοι τοῦ πλήθους
  choice: 应当让会众的领袖留下主持
  rationale: στήτωσαν字面为“让他们站立”，在行政处置语境中指领袖留任、站出来办理此事。“留下主持”使现代汉语读者易懂，同时保留其职务性含义。
- source_word: οἱ ἐκ τῶν κατοικιῶν ἡμῶν
  choice: 我们各住处中……的人
  rationale: κατοικίαι可指居住地、聚居点或城镇。“各住处”不把其规模限定为城镇，并由脚注说明可能译法。
- source_word: γυναῖκας ἀλλογενεῖς
  choice: 娶了外族女子为妻
  rationale: ἀλλογενεῖς指属于其他民族或族群的人；结合ἔχουσιν γυναῖκας，译成“娶了外族女子为妻”比“有外族妻子”更符合自然汉语。
- source_word: παραγενηθήτωσαν
  choice: 前来
  rationale: 该词意为来到、到场；在此行政性召集语境中，“前来”简明而得体。
- source_word: λαβόντες χρόνου
  choice: 按指定的时间
  rationale: 希腊文是压缩表达，字面近于“领受了时间”。语境所指应是获分配或指定时段后前来，因此译为“按指定的时间”，并以脚注保留原文表达特点。
theological_decisions:
- issue: 对行为的道德定性
  choice: 犯了大罪
  alternative: 犯了严重的过错
  rationale: ἁμαρτάνω在此处具有明确的罪责意味；译作“犯了大罪”不将其淡化为一般行政过失，也不额外加入特定宗派解释。
- issue: “外族”所指的范围
  choice: 外族女子
  alternative: 外国女子
  rationale: ἀλλογενής着重族群或人民归属不同，不一定等同现代国籍意义上的“外国”。“外族”更贴近古代语境，并避免现代政治含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“办不完”补明希腊文省略但由语境要求的意思；“留下主持”传达领袖站出来并持续办理事务的行政含义。经文以逗号收尾，以反映所给原文句子尚未结束。
