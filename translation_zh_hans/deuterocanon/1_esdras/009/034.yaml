base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: zh_hans
  text: '巴阿内的子孙中有：耶利米亚斯[a]、莫姆德伊奥斯、马埃罗斯、尤纳、马姆代、佩迪亚斯、阿诺斯、卡拉巴西翁、埃纳塞伊博斯、马姆恩塔奈莫斯、埃利亚塞伊斯、班努斯、埃迪亚莱伊斯、索梅伊斯、塞勒米亚斯、纳塔尼亚斯；埃克索拉的子孙中有：塞塞伊斯、埃兹雷伊尔、阿扎埃洛斯、萨马托斯、赞布雷伊[b]、佛塞波斯。


    [a] 本节有若干名字按希腊文本的形式音译，未与平行传统中较熟悉的希伯来名字统一，因为本译本以《以斯拉一书》的希腊文本为主要依据。


    [b] 此处的马所拉文本平行段落（参《以斯拉记》第10章的相关上下文）只是大致对应，并未以相同形式保留这一完整的名字次序；因此，本节依从希腊文本的名单。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节有若干名字按希腊文本的形式音译，未与平行传统中较熟悉的希伯来名字统一，因为本译本以《以斯拉一书》的希腊文本为主要依据。
    reason: 说明专名以主要希腊见证为准的翻译原则。
  - marker: b
    text: 此处的马所拉文本平行段落（参《以斯拉记》第10章的相关上下文）只是大致对应，并未以相同形式保留这一完整的名字次序；因此，本节依从希腊文本的名单。
    reason: 交代平行文本的对应有限，以及本节名单采用希腊文本的原因。
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: ……的子孙中有
  rationale: 保留希腊文以宗族关系引出名单的结构，同时采用现代汉语名单中自然、清楚的表达。
- source_word: Βαανεί
  choice: 巴阿内
  rationale: 依据希腊文 Βαανεί 音译，不擅自统一为平行希伯来传统中可能相关的名字。
- source_word: Ἰερεμίας
  choice: 耶利米亚
  rationale: 按希腊形式音译；保留词尾形式，以免在这份希腊名字名单中直接替换为较熟悉的希伯来形式“耶利米”。
- source_word: Μομδείοσ
  choice: 莫姆迪奥斯
  rationale: 该名字的希腊拼写较为生僻；译名尽量保留其辅音和音节轮廓，而不作无根据的校正。
- source_word: Μάηρος
  choice: 马埃罗斯
  rationale: 直接依希腊名字音译，没有充分依据将其规范为其他常见圣经人名。
- source_word: Μαμντάναιμος
  choice: 马姆恩塔奈莫斯
  rationale: 这是希腊见证中形态特殊且难解的专名；译名尽可能反映原文形式，不将其平滑化。
- source_word: Ἐξορά
  choice: 埃克索拉
  rationale: 按希腊文音节音译，并保留其作为宗族先祖名字的功能。
- source_word: Ζαμβρεί
  choice: 赞布雷伊
  rationale: 依据希腊文本音译；近似的马所拉文本没有以同样形式和次序保存这份完整名单。
