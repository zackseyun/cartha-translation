base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: zh_hans
  text: 以色列人中[a]，法罗斯的子孙中有：耶尔玛、耶泽亚斯、梅尔凯亚斯、米埃洛斯、以利亚撒、阿塞贝亚斯和班奈亚斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节若干名字可能对应《以斯拉记》第10章平行名单中的希伯来语名形，例如“法罗斯”可能对应“巴录”，“班奈亚斯”可能对应“比拿雅”。本书正文以希腊文本为翻译依据，因此保留希腊语名形的音译。
    reason: 说明平行文本中的异名，并交代正文音译所依据的文本见证。
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: 以色列人中
  rationale: 重复使用的ἐκ表示从较大的群体中列出成员；译作“以色列人中”符合现代汉语名单体表达。
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: 法罗斯的子孙中有
  rationale: υἱοί本义为“儿子”，在宗族名单中也可指后裔或家族成员；“子孙”既保留谱系含义，又避免误解为亲生儿子。
- source_word: Φορός
  choice: 法罗斯
  rationale: 按本书主要希腊文本Φορός音译，不以《以斯拉记》平行名单中的希伯来语名形取代。
- source_word: Ἰερμὰ
  choice: 耶尔玛
  rationale: 依希腊语名形作保守音译。
- source_word: Ἰεζείας
  choice: 耶泽亚斯
  rationale: 依希腊语Ἰεζείας音译，保留其与希伯来语规范化名形之间的区别。
- source_word: Μελχείας
  choice: 梅尔凯亚斯
  rationale: 依希腊语名形音译，不擅自还原为可能的希伯来语形式。
- source_word: Μίηλος
  choice: 米埃洛斯
  rationale: 此名少见，故紧贴希腊语形式音译。
- source_word: Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中通行且可识别的译名。
- source_word: Ἀσεβείας
  choice: 阿塞贝亚斯
  rationale: 按希腊语名形音译，避免依据推测改成另一希伯来人名。
- source_word: Βανναίας
  choice: 班奈亚斯
  rationale: 按希腊语Βανναίας音译；虽可能对应希伯来名“比拿雅”，正文仍以希腊见证为准。
