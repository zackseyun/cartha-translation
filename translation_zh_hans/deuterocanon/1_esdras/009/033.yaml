base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: zh_hans
  text: 阿索姆[a]的子孙中有：玛勒坦奈、玛他提亚、撒班奈乌斯、以利法拉特、玛拿西[b]和示每。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“阿索姆”；希伯来文平行传统中可能对应“哈顺”。
    reason: alternative_reading
  - marker: b
    text: 本名单中有几个名字的希腊文形式与希伯来文平行传统并不完全对应；正文依照《以斯得拉一书》的希腊文见证。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: 亚朔的子孙中有
  rationale: 此短语在名单中引出另一个家族群体；用“……的子孙中有”自然表达希腊文 ἐκ τῶν υἱῶν，同时保留其谱系色彩。
- source_word: Ἀσόμ
  choice: 亚朔
  rationale: 主文本依据希腊文 Ἀσόμ 音译，不直接改成希伯来平行传统所对应的“哈顺”；差异交由脚注说明。
- source_word: Μαλτανναῖος
  choice: 玛勒坦奈
  rationale: 按希腊名称音译，避免未经充分把握便与希伯来平行名单中的名字合并。
- source_word: Ματταθίας
  choice: 玛他提亚
  rationale: 采用现代中文圣经语境中自然且接近希腊读音的音译。
- source_word: Σαβανναιούς
  choice: 撒班奈乌斯
  rationale: 保留希腊文本中较长且独特的姓名形式，不擅自协调为希伯来传统中的可能对应名。
- source_word: Ἐλειφαλὰτ
  choice: 以利法拉特
  rationale: 按希腊文形式音译；不直接规范化为可能的希伯来名称形式。
- source_word: Μανασση
  choice: 玛拿西
  rationale: 采用中文读者较熟悉的圣经人名形式，同时准确对应希腊文 Μανασση。
- source_word: Σεμεεί
  choice: 示每
  rationale: 希腊文 Σεμεεί 与闪语人名“示每”相合；采用通行中文形式，便于辨认。
