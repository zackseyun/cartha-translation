base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: zh_hans
  text: 亚难的子孙中有：以利阿达斯[a]、亚赛亚、麦基亚、撒拜亚和西门·哥撒毛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本名单中的若干名字，在《以斯拉记—尼希米记》的希伯来文本传统中有相应形式（例如“亚难”可能对应“哈难”，“撒拜亚”可能对应“沙比太”）。正文依《以斯得拉一书》的希腊文本音译，希伯来平行文本仅供参照。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: 亚难的子孙中有
  rationale: 本节承接名单；ἐκ 在家族名录中表示成员出自某一宗族。汉语用“……的子孙中有”既自然，也保留其列举关系。
- source_word: Ἀννὰν
  choice: 亚难
  rationale: 按希腊文本的读音音译；不以平行传统中的希伯来形式“哈难”取代主文本。
- source_word: Ἐλιωδὰς
  choice: 以利阿达
  rationale: 依希腊形式音译，同时采用现代中文圣经人名常见的分节方式。
- source_word: Ἀσαίας
  choice: 亚赛亚
  rationale: 依希腊 Ἀσαίας 音译，不擅自等同于其他传统中某个特定的希伯来名字。
- source_word: Μελχείας
  choice: 麦基亚
  rationale: 以希腊读音为准，并用中文常见的闪族人名结尾“亚”表达 -ίας。
- source_word: Σαββαίας
  choice: 撒拜亚
  rationale: 直接反映希腊形式；平行传统可能对应“沙比太”等形式，但不足以取代希腊主文本。
- source_word: Σίμων
  choice: 西门
  rationale: 采用该希腊人名在现代中文圣经中的通行译法。
- source_word: Χοσάμαος
  choice: 哥撒毛
  rationale: 此名缺少可靠的外部对应，故谨慎按希腊形式音译；词首 Χ 在此专名中以“哥”近似表达传统音译效果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体。以冒号引出人名，并用间隔号连接“西门·哥撒毛”，使读者看出希腊文本可能将 Σίμων Χοσάμαος 作为一个带附加名或双名的条目；不将其武断拆成两个人。
