base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/021.yaml
  text: 'And from the sons of Emer: Ananias, Zabdaios, Manes, Thamaios, Jerel, and Azarias.'
translation:
  language: zh_hans
  text: 以默的子孙中有：亚拿尼亚、撒巴代、玛尼斯、塔迈、耶列和亚撒利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἐμὴρ
  choice: 以默的子孙中有
  rationale: υἱοί在族谱名单中指家族后裔，译作“子孙”比逐字的“儿子”更符合现代汉语；Ἐμήρ按常见圣经人名形式音译为“以默”。
- source_word: Ἀνανίας
  choice: 亚拿尼亚
  rationale: 按希腊语人名音译，并采用现代中文圣经人名的常见形式。
- source_word: Ζαβδαῖος
  choice: 撒巴代
  rationale: 依希腊语形式音译，不擅自等同或还原为未在本节希腊文本中出现的其他名字。
- source_word: Μάνης
  choice: 玛内
  rationale: 依希腊语读音音译，保留本节名单的文本形态。
- source_word: Θαμαῖος
  choice: 塔迈
  rationale: 依希腊语形式作简洁音译。
- source_word: Ἰερεὴλ
  choice: 耶勒
  rationale: 依希腊语文本音译；不凭近似名字补入额外音节。
- source_word: Ἀζαρίας
  choice: 亚撒利亚
  rationale: 采用该希腊人名在中文圣经传统中的常见译形。
