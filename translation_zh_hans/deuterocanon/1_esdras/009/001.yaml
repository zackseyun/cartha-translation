base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/001.yaml
  text: Then Ezra rose up from the court of the temple and went into the chamber of Jona son of Naseib[b][a],
translation:
  language: zh_hans
  text: 以斯拉从圣殿的院子里起身，前往拿西布的儿子约拿的房间。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“拿西布的儿子约拿的房间”。《以斯拉记》10:6的希伯来文平行记载则作“以利亚实的儿子约哈难的房间”。
    reason: alternative_reading
  - marker: b
    text: 本节希腊文本中的人名与希伯来文平行记载并不一致；本译文正文保留希腊文本的人名。
    reason: textual_variant
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起身
  rationale: 这是ἀνίστημι的不定过去时分词，用来引出随后发生的行动；“起身”自然地保留了叙事次序，也符合庄重语境。
- source_word: αὐλῆς
  choice: 院子
  rationale: αὐλή在此指圣殿建筑群中的院落；“院子”是现代汉语中清楚自然的表达。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿的
  rationale: ἱερόν通常指整个圣殿范围，而非专指内殿；译作“圣殿”准确且符合中文圣经语体。
- source_word: ἐπορεύθη
  choice: 到……去
  rationale: 这是常见的叙事移动动词；结合目的地译为“到……去”，简洁而自然。
- source_word: παστοφόριον
  choice: 房间
  rationale: 该词指圣殿或建筑群内的房室，具体用途在本句中没有说明；“房间”既清楚，又避免擅自限定为库房或住室。
- source_word: Ἰωνᾶ τοῦ Νασείβου
  choice: 拿西布的儿子约拿
  rationale: 主文本依照所给希腊文音译专名，不以希伯来平行经文中的不同名字取代；相关异文在脚注中交代。
