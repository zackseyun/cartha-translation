translation_notes:
  register: 采用自然、庄重的现代标准汉语。“从……起身，到……去”保持原文连续动作的叙事结构；“房间”保留建筑空间用途上的不确定性。专名按希腊文主证据处理，并用脚注呈现希伯来平行文本的差异。
