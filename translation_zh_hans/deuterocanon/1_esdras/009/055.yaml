base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
translation:
  language: zh_hans
  text: 因为他们也因所受教导的话语而受到启发[a][b]，并且被召集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“受到启发”的希腊动词在这里很少见，较直译可理解为“被灌注”或“受感发”；希伯来文平行经文则支持“领悟这些话”的意思。
    reason: lexical_alternative
  - marker: b
    text: 《尼希米记》8:13的希伯来文平行经文更直接地说，全体百姓的宗族首领、祭司和利未人聚集到文士以斯拉那里，“要留心领会律法上的话”。《以斯得拉一书》在这里采用了较为浓缩的希腊文表述。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出解释性分句；在缺少更大上下文的情况下保留其通常的因果或说明作用。
- source_word: καὶ
  choice: 也
  rationale: 表达相对于前文的附加意义，比在句首机械译作“并且”更自然。
- source_word: ἐνεφυσιώθησαν
  choice: 得到启发
  rationale: 该动词在此处罕见，可能带有“被灌注、受感发”的意味；结合《尼希米记》8:13的希伯来文平行经文，“得到启发”既可表示受到话语影响，也可涵盖获得领悟，同时避免把词义过度限定为单纯的课堂式教导。
- source_word: ἐν τοῖς ῥήμασιν
  choice: 从……话中
  rationale: 以自然汉语表达在这些话语之中或借着这些话语受到启发；ῥήματα在此按研读律法的语境译为“话”。
- source_word: οἷς ἐδιδάχθησαν
  choice: 所受教导的
  rationale: 保留被动意义，并将关系从句自然地置于“话”之前，说明这些话是他们先前受教的内容。
- source_word: ἐπισυνήχθησαν
  choice: 被召集起来
  rationale: 保留希腊文的被动形式及“聚集到一处”的含义；“召集起来”在现代汉语中比“被聚集”更自然。
theological_decisions:
- issue: ἐνεφυσιώθησαν是否表示属灵默感、一般启发，或获得理解
  choice: 译作“得到启发”，并在脚注说明词义范围
  alternative: “受到默感”“领会了”“受了教导”
  rationale: 希腊词本身罕见，而希伯来文平行经文强调领悟律法的话。正文采用不预设特殊神学机制的表达，既不把它专门化为神圣默感，也不抹去其受感发或被灌注的色彩。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所受教导的话”略带书面色彩，以保留原文关系从句和被动结构；第二分句保留希腊文被动语态。脚注承担罕见动词及希伯来文平行经文的说明，不在正文中消除其词义张力。
