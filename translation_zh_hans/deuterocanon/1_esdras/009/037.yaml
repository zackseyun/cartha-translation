base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: zh_hans
  text: 祭司、利未人和以色列中的人住在[a]耶路撒冷和乡间；在七月朔日[b]，以色列子孙住在各自的居住地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在”也可译作“居住”或“定居”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“第七个月的新月（之日）”。尼希米记8:1的希伯来文近似平行段落在此处差异很大；正文依照《以斯得拉一书》的希腊文本翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  choice: 住在
  rationale: κατοικέω表示在某地居住；“住在”是自然、庄重的现代汉语，也不把一次过去时过度限定为“定居下来”。
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: 以色列中的人
  rationale: 保留该短语与后文“以色列子孙”的措辞差别，并在祭司、利未人之后自然指向以色列民中的其他人。
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: 在耶路撒冷和乡间
  rationale: χώρα在这里与耶路撒冷相对，指城外地区；“乡间”比“国家”或笼统的“土地”更符合此处地理语境。
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: 七月初一
  rationale: νουμηνία指新月之日，也就是按月朔计算的月初一；正文采用现代读者清楚易懂的表达，脚注说明希腊文的字面措辞。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留盟约群体称谓的家族性表达，并与前面的“以色列中的人”保持原文所具有的措辞区别。
- source_word: κατοικίαις
  choice: 居住地
  rationale: κατοικία指居住之处；复数语境下“各自的居住地”既可涵盖聚落，也不武断限定为村庄或个人房屋。
theological_decisions:
- issue: 希腊文本与尼希米记8:1的近似希伯来文平行经文之间的关系
  choice: 依照《以斯得拉一书》的希腊文本，保留祭司、利未人、以色列人居住以及七月朔日的叙述。
  alternative: 按尼希米记8:1改写为众民如同一人聚集在水门前的广场。
  rationale: 本书的首要翻译依据是现存希腊文；所列马所拉文本只是内容次序并不对应的近似平行经文，不能用来取代或调和这里的希腊措辞。
- issue: 七月朔日这一时间语的修饰范围
  choice: 将“七月初一”置于全句开头，使其自然构成整句叙述的时间背景。
  alternative: 只把该时间语接在“住在耶路撒冷和乡间”之后，限定前半句。
  rationale: 希腊文时间与格短语位于前一地点短语之后、后一个并列成分之前，修饰范围存在一定句法张力；汉语前置可保留它作为整体时间框架的自然读法，而不额外制造教义性结论。
translation_notes:
  register: 采用现代、清楚而庄重的书面普通话。“七月初一”比“七月的新月”更符合现代汉语日期表达，脚注保留原文的月朔意象；全句保持并列叙述，不以解释性词语消除希腊文在时间修饰范围上的张力。
