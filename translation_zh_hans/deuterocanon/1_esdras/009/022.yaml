base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: zh_hans
  text: 帕伊苏尔的子孙中有：埃利奥奈斯[a]、阿塞亚斯、伊斯马埃洛斯、纳塔纳埃洛斯、奥凯莱多斯[b][c]和萨尔塔斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帕伊苏尔”按希腊文音译；近似的希伯来文平行传统对应“巴施户珥”。
    reason: alternative_reading
  - marker: b
    text: “奥凯莱多斯”反映此处的希腊文见证；近似的希伯来文平行传统可能指向另一个底本名字，有时被对应为“约撒拔”。
    reason: textual_variant
  - marker: c
    text: 本节若干名字的希腊文形式与近似的希伯来文平行传统并不完全相同；由于本书在此以《七十士译本》的希腊文见证为翻译依据，正文保留希腊文形式。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: ……的子孙中有
  rationale: ἐκ表示从某一家族群体中列出若干人；此译保留名单的宗族结构，同时符合现代汉语表达。
- source_word: Φαισούρ
  choice: 帕伊苏尔
  rationale: 按希腊文Φαισούρ音译，不在正文中改用近似希伯来平行传统的名字。
- source_word: Ἐλιωναίς
  choice: 埃利奥奈斯
  rationale: 依据希腊文名字直接音译，保留其希腊语形式。
- source_word: Ἀσσείας
  choice: 阿塞亚斯
  rationale: 依据希腊文音译，并以自然的现代汉语音节呈现。
- source_word: Ἰσμαήλος
  choice: 伊斯马埃洛斯
  rationale: 保留希腊文Ἰσμαήλος的形式，不径自规范为较熟悉的希伯来语名字形式。
- source_word: Ναθανάηλος
  choice: 纳塔纳埃洛斯
  rationale: 按希腊文形式音译，不以近似希伯来平行传统替换。
- source_word: Ὠκαιληδός
  choice: 奥凯莱多斯
  rationale: 该名在文本传承中较难确定；正文忠实音译Swete希腊文本，异文问题置于脚注。
- source_word: Σάλθας
  choice: 萨尔塔斯
  rationale: 直接依希腊文音译，不与可能的希伯来名字强行协调。
