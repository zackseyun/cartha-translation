  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: zh_hans
  text: 祭司、律法诵读者以斯拉，站在那座已经建成的木制高台上；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》8:4的希伯来文平行经文称以斯拉为“文士”，并说这座木制建筑是“为这事”或“为这场合”建造的；《以斯拉一书》的希腊文则称他为“祭司、律法诵读者”，只说这座木制高台已经建成。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: 站在
  rationale: 这是ἵστημι的简单过去时叙事用法，表示以斯拉站上或站在木台上；现代汉语用“站在”自然清楚，也与希伯来文平行经文相符。
- source_word: Ἔσρας
  choice: 以斯拉
  rationale: 采用现代中文圣经传统中该人名的通行译法。
- source_word: ὁ ἱερεύς
  choice: 祭司
  rationale: 希腊文明确称以斯拉为祭司，应在正文保留，不按希伯来文平行经文的“文士”作协调。
- source_word: ἀναγνώστης τοῦ νόμου
  choice: 宣读律法的人
  rationale: ἀναγνώστης指读者，尤其可指公开宣读者；“宣读律法的人”既体现公开诵读的角色，又避免把希伯来文的“文士”引入希腊文本。
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: 在那座……木台上
  rationale: βῆμα在此指供公开宣读使用的高台；“木台”简明自然，并与希伯来文平行经文的木制高台相合。
- source_word: τοῦ κατασκευασθέντος
  choice: 搭建好的
  rationale: 被动过去分词表示木台已经预先建成或备妥；“搭建好的”符合木台这一实物，也自然体现动作先于以斯拉站上去。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祭司以斯拉，就是宣读律法的人”保留希腊文两个并列身份说明之间的张力；“木台”比“讲坛”更少带入后世宗教建筑含义。分号承接下文语境，并与所给经文片段的未完句式相应。
