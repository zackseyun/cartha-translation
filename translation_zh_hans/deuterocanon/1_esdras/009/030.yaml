base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: zh_hans
  text: 玛尼的子孙中有：奥拉摩斯[a]、玛穆科斯、耶代奥斯、雅苏博斯、亚撒埃尔[b]和耶利摩特。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“玛尼”；《以斯拉记》的希伯来文平行名单通常被认为对应“巴尼”。
    reason: alternative_reading
  - marker: b
    text: 这里若干名字可能对应《以斯拉记》平行名单中的希伯来名字；正文以《以斯得拉一书》的希腊形式为准。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不单独译出）
  rationale: 本节处于连续名单中，希腊语 καὶ 起连接、增列作用；现代汉语可借句式自然承接，无须机械译作“又”。
- source_word: ἐκ τῶν υἱῶν
  choice: ……的子孙中有
  rationale: 此处表示某一家族或宗族中的成员；译为“子孙中有”既保留名单关系，也符合现代汉语表达。
- source_word: Μανί
  choice: 玛尼
  rationale: 依主要希腊文本音译，不在正文中按《以斯拉记》的希伯来平行名单改作“巴尼”。
- source_word: Ὤλαμος
  choice: 奥拉摩斯
  rationale: 按希腊形式音译，并保留其可辨识的完整形态，避免无文本依据地希伯来化。
- source_word: Μάμουχος
  choice: 玛穆科斯
  rationale: 按希腊形式音译；不以可能对应的希伯来名字取代正文读法。
- source_word: Ἰεδαῖος
  choice: 耶代奥斯
  rationale: 按希腊专名音译，保留《以斯得拉一书》本文的名单传统。
- source_word: Ἰάσουβος
  choice: 雅苏博斯
  rationale: 按希腊形式音译，不据平行名单缩写或改造成希伯来形式。
- source_word: Ἀσάηλος
  choice: 亚撒埃尔
  rationale: 采用自然、易读且贴近希腊读音的中文音译。
- source_word: Ἰερεμώθ
  choice: 耶利摩特
  rationale: 直接依据希腊专名音译，并采用适合现代汉语的字形组合。
