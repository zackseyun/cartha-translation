base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: zh_hans
  text: 因为这日是归主为圣的[a]，不要忧伤；因为主必使你们得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》8:10的希伯来文平行经文在此处有所不同，大意为：“因为耶和华的喜乐是你们的力量。”《以斯得拉一书》的希腊文则作：“因为主必使你们得荣耀。”
    reason: 说明希腊原文与希伯来文平行经文之间的实质差异，避免在正文中将二者调和。
lexical_decisions:
- source_word: ἁγία
  choice: 为圣
  rationale: 表达分别、奉献的性质；与“归主”连用，自然呈现此日是为主分别出来的。
- source_word: ἡ ἡμέρα
  choice: 这日
  rationale: 希腊文直译为“这/该日”；中文语境中“这日”比孤立的“日子”更自然庄重。
- source_word: τῷ κυρίῳ
  choice: 归主
  rationale: 与形容词“圣”相连的与格可表示关系或归属、奉献；“归主为圣”既自然，也保留献归主的含义。
- source_word: μὴ λυπεῖσθε
  choice: 不要忧伤
  rationale: 准确表达经历悲痛、愁苦的意思，语气庄重而符合现代汉语。
- source_word: δοξάσει
  choice: 必使……得荣耀
  rationale: 保留 δοξάζω 的荣耀语义及将来时，不以希伯来平行经文中的“力量”来调和。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确呈现第二人称复数。
theological_decisions:
- issue: 次经希腊文本中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 本处指向上帝，“主”是准确、自然且通行的圣经用语。
- issue: 末句是否与尼希米记8:10的马所拉文本平行经文调和
  choice: 按希腊文译为“主必使你们得荣耀”
  alternative: “耶和华的喜乐是你们的力量”等按希伯来平行经文翻译的措辞
  rationale: 《以斯得拉一书》以现存希腊文为首要文本依据；此处差异具有实质意义，应保留希腊读法，并在脚注说明平行经文的异文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“归主为圣”保留献归与分别为圣的含义；“必使你们得荣耀”忠实呈现希腊文，同时避免过度解释荣耀如何实现。
