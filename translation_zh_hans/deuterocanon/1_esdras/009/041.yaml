base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: zh_hans
  text: 他在圣殿门前的宽阔空地上，从黎明直到正午，在男人和女人面前诵读；众人都全神贯注地留意律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众人都全神贯注地留意律法”直译为“他们把全部心思都放在律法上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: 诵读
  rationale: 未完成时态表示从黎明到正午持续进行的动作；公共场合中的ἀναγινώσκω指读出文本，“诵读”自然体现公开朗读，但不额外强化仪式意味。
- source_word: ἐν τῷ πρὸ τοῦ ἱεροῦ πυλῶνος εὐρυχώρῳ
  choice: 在圣殿门前的宽阔空地上
  rationale: εὐρύχωρος指宽广、开阔之处；“宽阔空地”保留空间性质，又不把它限定为广场或院落。πρὸ τοῦ ἱεροῦ πυλῶνος译为“圣殿门前”，符合其位置关系与宗教建筑语境。
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: 从黎明直到正午
  rationale: 准确对应从破晓时分至中午的时间跨度，简洁庄重。
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: 当着男人和女人
  rationale: 明确保留原文分别提及的两类听众；“当着”自然表达ἐνώπιον的“在……面前、在…… حضور之中”。
- source_word: ἐπέδωκαν πάντα τὸν νοῦν εἰς τὸν νόμον
  choice: 众人都专心听从律法
  rationale: 该短语直译近于“把全部心思放在律法上”。结合正在公开诵读的语境，“专心听从”既表达全神贯注，也保留注意力指向律法的含义；脚注提示更贴近字面的译法。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 定冠词与上下文表明所指是公开宣读的神圣律法；现代中文圣经语域中“律法”比一般性的“法律”准确，同时不擅自增译“摩西的”或“律法书”。
theological_decisions:
- issue: νόμος是否明确译作带正式书名意味的“律法”
  choice: 律法
  alternative: 法律；律法书
  rationale: “律法”符合犹太圣经语境，但不加“书”或“摩西的”，避免把原文未明说的标题或载体加入正文。
- issue: ἐπέδωκαν πάντα τὸν νοῦν是否包含顺服含义
  choice: 专心听从
  alternative: 全心留意；把全部心思放在律法上
  rationale: 上下文首先强调听众专注于所读律法。“听从”在中文可兼具聆听与认真接受之意，但不应解释为原文明确陈述他们已经遵行；脚注保留其字面空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“宽阔空地”避免将地点过度具体化为广场、院子或台子；所给马所拉文本平行材料对应另一节场景，不能据此改写本节希腊文。
