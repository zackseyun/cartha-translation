  text: 'From the temple singers: Eliasib[a], Bacchurus.'
translation:
  language: zh_hans
  text: 圣殿歌唱者中有以利亚西布[a]、巴古鲁斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以利亚西布”：希伯来文平行传统中的对应名字作“以利亚实”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν
  choice: ……中有
  rationale: 此短语从较大的名单中引出一个类别及其成员；译作“……中有”符合现代汉语列名方式。
- source_word: ἱεροψαλτῶν
  choice: 圣殿歌唱者
  rationale: 该词兼具圣所职分与歌唱之意；“圣殿歌唱者”比泛称“歌唱者”更清楚地保留其礼仪背景。
- source_word: Ἐλιάσεβος
  choice: 以利亚西布
  rationale: 按希腊文形式音译，保留其与希伯来平行传统“以利亚实”之形式差异，并以脚注说明。
- source_word: Βάκχουρος
  choice: 巴古鲁斯
  rationale: 按希腊文专名音译；因缺乏可靠依据，不推测性地还原为某个希伯来名字。
