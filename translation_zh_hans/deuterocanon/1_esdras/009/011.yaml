base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: zh_hans
  text: 可是，人数众多[a]，又正值冬季[b]，我们不能站在露天；而且这事不是一天能办完的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里另有一句难解的话，直译是“而且我们没有找到”（καὶ οὐχ εὕρομεν）；它在本句中的确切意思不明。
    reason: textual_variant
  - marker: b
    text: 较直译：“又正值冬季。”这里所指的冬令天气，使人难以久站露天。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: 人数众多
  rationale: 指聚集的人很多；现代汉语简洁自然，也保留了集合性含义。
- source_word: ὥρα χειμερινή
  choice: 正值寒冷多雨的季节
  rationale: χειμερινή本义为冬季的、寒冷恶劣的；结合不能久站露天的语境，以“寒冷多雨”表达季节及恶劣天气的实际影响，同时用脚注保留较直译的可能。
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: 我们不能站在露天
  rationale: ἰσχύω在此表示有能力或承受得住，αἴθριοι表示处于露天、暴露在天气中；译文自然表达无法在户外继续站立。
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: 这事不是一天能办完的
  rationale: ἔργον在此为要处理的事务；汉语用结果式表达清楚传达此事无法在一天之内完成。
- source_word: καὶ οὐχ εὕρομεν
  choice: 正文不强行译出，以脚注说明
  rationale: 现存希腊文直译为“而且我们没有找到”，在上下文中句法和意义均不明；不以猜测补足正文，并透明注明文本困难。
theological_decisions:
- issue: 疑难希腊短语καὶ οὐχ εὕρομεν的处理
  choice: 不把不确定的短语强行纳入正文，而在脚注中保留其存在及直译
  alternative: 逐字译作“而且我们没有找到”，或依据《以斯拉记》10:13的平行经文重构句意
  rationale: 希腊文是首要依据，但该短语在本句中明显难解。正文呈现其余希腊文所确定的意思，脚注保存歧义；希伯来平行经文只用于核对整体语境，不用来替换希腊文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是……又……；而且……”保留原文的论述推进；“站在露天”和“不是一天能办完的”符合自然现代汉语。所有脚注标记均已置于正文。
