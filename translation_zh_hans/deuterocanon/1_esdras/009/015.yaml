  text: And those from the captivity did all these things[a].
translation:
  language: zh_hans
  text: 那些被掳归回的人，都照着这一切行了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些从被掳中出来的人，照着这一切行了。”希腊文直译为“那些从被掳中出来的人”，指被掳后归回的群体。
    reason: 说明οἱ ἐκ τῆς αἰχμαλωσίας较贴近字面的措辞，以及其在上下文中的所指。
lexical_decisions:
- source_word: ἐποίησαν
  choice: 行了
  rationale: ποιέω与κατὰ πάντα ταῦτα连用，表示实行、照办前述各事，而非“制造”；“行了”自然且庄重。
- source_word: κατὰ πάντα ταῦτα
  choice: 照这一切
  rationale: κατά在此表达依照、符合，πάντα ταῦτα总括前文所述事项；译作“照这一切”保留其遵照而行的意味。
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: 那些从被掳之地归来的人
  rationale: 希腊文直指“从被掳中/被掳之地出来的人”。上下文所指是归回的被掳群体；补出“归来”使现代汉语清楚，同时脚注保留较直译的表达。
theological_decisions: []
