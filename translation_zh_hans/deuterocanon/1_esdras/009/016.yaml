base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: zh_hans
  text: 祭司以斯拉亲自选定了一批男子，都是他们各宗族的首领，全都逐一按名指定；十月初一[a]，他们聚集在一起，查验这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“十月的新月之日”，即这个月的第一日。
    reason: 保留νουμηνία的字面历法表达。
lexical_decisions:
- source_word: ἐπελέξατο αὐτῷ
  choice: 为自己拣选了
  rationale: 保留中间语态以及 αὐτῷ 所表达的切身参与或为自身目的作出选择的意味，同时符合现代汉语习惯。
- source_word: ἄνδρας ἡγουμένους
  choice: 一些男子，就是……首领
  rationale: ἄνδρας 明指男性，译作“男子”；ἡγουμένους 在此行政与宗族语境中指担任领导者的人，译作“首领”。
- source_word: τῶν πατριῶν αὐτῶν
  choice: 他们各宗族的
  rationale: πατριά 指按父系或祖先划分的家族群体；“宗族”自然简洁，也保留族系组织的含义。
- source_word: πάντας κατ’ ὄνομα
  choice: 这些人全都逐一具名
  rationale: 表达所有入选者均按姓名明确登记或指定；“逐一具名”保留正式的行政语气。
- source_word: συνεκλείσθησαν
  choice: 他们聚集在一起
  rationale: 该动词字面可含“一同关在里面”之意，但在审查事务的程序性语境中，主要表示众人集中会合；此译法自然且不无根据地强化禁闭意味。
- source_word: τῇ νουμηνίᾳ τοῦ μηνὸς τοῦ δεκάτου
  choice: 十月初一
  rationale: νουμηνία 指新月之日，也就是月份的第一日；正文采用现代汉语清楚自然的日期表达，字面形式收入脚注。
- source_word: ἐτάσαι τὸ πρᾶγμα
  choice: 查验这事
  rationale: ἐτάσαι 表示审查、查究；πρᾶγμα 泛指所处理的事情。“查验这事”保留正式调查的语气，又不把它限定为诉讼案件。
theological_decisions:
- issue: 男性与父系宗族的行政用语
  choice: 男子，就是他们各宗族的首领
  alternative: 各家族的领袖
  rationale: 希腊文明确使用 ἄνδρας，并以 πατριά 指宗族单位；正文保留男性所指及宗族结构，不改写为性别中性的泛称。
- issue: νουμηνία 的历法含义
  choice: 十月初一
  alternative: 十月的新月之日
  rationale: 此处重点是调查开始的日期，并未凸显礼仪意义；正文采用清楚的日期表达，同时以脚注保存“新月”的字面信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“拣选”“宗族”“首领”“查验”符合经文行政场景，又避免古奥句式；分为两句，以清楚呈现选任人员与正式审查两个动作。
