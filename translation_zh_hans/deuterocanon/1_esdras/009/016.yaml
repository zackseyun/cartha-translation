revisions:
- from: 以斯拉祭司为自己拣选了一些男子，就是他们各宗族的首领；这些人全都逐一具名。十月初一[a]，他们聚集在一起，查验这事。
  to: 祭司以斯拉亲自选定了一批男子，都是他们各宗族的首领，全都逐一按名指定；十月初一[a]，他们聚集在一起，查验这事。
  rationale: 修订消除了无原文根据的“一些”，以“亲自选定”自然传达中间语态的主体参与，并改善称谓和按名指定的中文表达；其余句义、历法信息与脚注锚点均予保留。
