  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: zh_hans
  text: 这些人都曾与外族女子共同生活[a]，后来把她们连同孩子一起送走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文更明确地表达为“娶了外族女子”，也可理解为“娶外族女子为妻”。
    reason: 说明希腊文较宽泛的“共同生活”在平行经文中的明确婚姻含义。
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: 这些人都
  rationale: 自然表达“所有这些人”；希腊文没有明说“男人”，中文用“人”承接名单语境，不额外强化性别。
- source_word: συνῴκησαν
  choice: 曾与……共同生活
  rationale: 保留该动词“同住、共同生活”的基本意义，同时不把婚姻含义直接写入正文；上下文仍可使读者理解其伴侣关系。
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: 外族女子
  rationale: ἀλλογενής侧重属于另一族群或民族；“外族”比泛指国籍的“外国”更贴合此处语境，γυναῖξιν译为“女子”，不直接改作“妻子”。
- source_word: ἀπέλυσαν
  choice: 送走
  rationale: 表达释放、遣离的语义，符合此处关系解除的语境，又避免把它处理成明确的法律术语“休妻”。
- source_word: αὐτὰς σὺν τέκνοις
  choice: 把她们连同孩子一起
  rationale: αὐτάς回指外族女子；σὺν τέκνοις直译为“同孩子一起”，不加入原文未明说的所属代词。
theological_decisions:
- issue: 是否把共同生活的关系明确译为婚姻
  choice: 正文译作“与外族女子共同生活”
  alternative: “娶了外族女子”或“与外族妻子生活”
  rationale: 希腊文συνῴκησαν的字面范围是同住、共同生活，虽在语境中明显带有婚姻意味，希伯来文平行经文也更明确地说“娶”，但本节以希腊文为首要依据，故正文保留其措辞张力，并在脚注说明婚姻含义。
- issue: 是否明确孩子属于这些女子或这些结合
  choice: 译作“孩子”，不加所属词
  alternative: “她们的孩子”或“他们的孩子”
  rationale: 希腊文仅作σὺν τέκνοις，没有所属代词；中性表达可避免超出文本确认孩子的具体归属。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“共同生活”较“同居”更中性，也避免现代汉语中后者可能带有的非婚关系暗示；“连同……一起送走”清楚表达女子和孩子一并被遣离。
