  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: zh_hans
  text: 守门人中有沙路母斯和多巴尼斯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“守门人中有沙路母斯和多巴尼斯。”这一段所对应的希伯来文本在此处与希腊文并不密切吻合，也没有以相同形式保存这两个名字。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν θυρωρῶν
  choice: 守门人中有
  rationale: ἐκ在名单语境中表示所列之人属于这一群体。译为“守门人中有”比生硬的“从守门人中”更符合现代汉语，同时保留其分组作用。θυρωρός指负责看守门或城门的人，在此译作职务性的“守门人”。
- source_word: Σάλλουμος
  choice: 沙路摩
  rationale: 按希腊文人名形式音译，不擅自与可能相关的希伯来名字协调；“沙路摩”以自然的汉语音节近似Σάλλουμος。
- source_word: καὶ
  choice: 和
  rationale: 普通并列连词，连接两个人名。
- source_word: Τοβάνης
  choice: 多巴内
  rationale: 依希腊文Τοβάνης直接音译，避免改成熟悉但无充分依据的希伯来式人名。
