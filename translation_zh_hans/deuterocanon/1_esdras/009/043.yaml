base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: zh_hans
  text: 玛他提亚[a]、撒慕、亚拿尼亚、亚撒利亚、乌利亚、希西家和巴力撒摩站在他的右边，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文人名与《尼希米记》8:4的近似希伯来文平行经文不同；那里所列站在以斯拉右边的人并不完全相同。本译文以《以斯德拉一书》的希腊文本为准，保留其人名形式。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: 站在
  rationale: 该形式在形态上可作及物用法，意为“使……站立”或“安置”，但这里随后列出多人，并有方位短语“在他的右边”；按场景和汉语习惯，译为这些人“站在”那里最自然。单数动词置于一连串人名前，在希腊语中并不要求汉语照搬为单数表达。
- source_word: αὐτῷ
  choice: 他的
  rationale: 与站立或安置及方位表达连用时，此处的与格代词自然指向以斯拉；汉语用领属形式“他的右边”清楚表达相对位置。
- source_word: ἐκ δεξιῶν
  choice: 在他的右边
  rationale: 这是表示方位的惯用表达，译文保留具体的空间意义，同时符合现代汉语。
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: 玛他提亚、撒慕、亚拿尼亚、亚撒利亚、乌利亚、希西家、巴力撒摩
  rationale: 人名以《以斯德拉一书》的希腊文本为依据音译，不强行改成《尼希米记》8:4近似平行经文中的希伯来名字。对已有通行汉译形式的人名，采用自然且易辨认的现代中文写法。
