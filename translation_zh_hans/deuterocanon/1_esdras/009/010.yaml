base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: zh_hans
  text: 全体会众都高声回应说[a]：“正如你所说的，我们会这样做[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全体会众”也可译作“全体群众”或“整群人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“正如你所说的，我们将做”；“会这样做”在汉语中自然表达其将来行动的承诺。
    reason: translation_clarity
lexical_decisions:
- source_word: ἐφώνησαν
  choice: 呼喊
  rationale: 该动词表示扬声发言；在全体共同响应的场景中，“呼喊”既保留声音强度，也比“喊叫”更庄重。
- source_word: πᾶν τὸ πλῆθος
  choice: 全体会众
  rationale: 原意为“全部群众”。这里是正式聚集并共同回应的群体，“全体会众”比“所有群众”或“整群人”更符合语境，同时不预设宗派性含义。
- source_word: μεγάλῃ τῇ φωνῇ
  choice: 高声
  rationale: 自然表达“以大声”，保留公开而响亮的集体回应。
- source_word: Οὕτως
  choice: 就照
  rationale: 在此引出对前述提议的赞同与执行；与后面的“你所说的”连用，现代汉语自然流畅。
- source_word: ὡς εἴρηκας
  choice: 你所说的
  rationale: 希腊语完成时强调刚才所说之话仍具效力；汉语“你所说的”自然保留这一指向，而不强行标明时态。
- source_word: ποιήσομεν
  choice: 我们一定照办
  rationale: 表达将来行动与明确决心。“照办”承接前面的“照你所说的”；“一定”传达群体郑重承诺的语气，但不改变命题内容。
theological_decisions:
- issue: 如何呈现公众共同回应的群体性质
  choice: 全体会众
  alternative: 所有群众／整群人
  rationale: πλῆθος本可泛指群众，但上下文是一个正式聚集、共同作出承诺的群体。“会众”能自然呈现场景的公共性，又不将其技术化为特定宗教制度。
- issue: 是否把群体回应解释为礼仪公式或单纯赞同
  choice: 保留为对所说之事的明确行动承诺
  alternative: 译作“是的”或扩译为礼仪性的盟约宣誓
  rationale: Οὕτως与ποιήσομεν共同表达赞同并承诺实行；原文未明确规定礼仪公式，因此既不弱化为口头同意，也不加入原文没有的盟约术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子保留希腊文先叙述全体高声回应、再直接引语的结构；避免仿古表达，也不依据不相符的马所拉文本平行经文改写本节。
