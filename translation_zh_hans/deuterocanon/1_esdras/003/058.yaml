  text: and again it runs back to its own place in one day[a].
translation:
  language: zh_hans
  text: 又在一天之内跑回自己的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又在一日之内返回自己的地方。”原文动词带有迅速移动的意味，因此正文译作“跑回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示再次发生或返回；与“跑回”搭配时，“又”简洁自然，并保留重复之意。
- source_word: ἀποτρέχει
  choice: 跑回
  rationale: 该动词含迅速移动、离去或返回的动态意味；结合目的地“自己的地方”，译作“跑回”既符合语境，也保留原文的生动感。
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: 自己的地方
  rationale: 保留ἑαυτοῦ的反身所属意味，同时采用现代汉语自然表达。
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: 在一天之内
  rationale: 表达行动在一日的时限内完成，比单说“在一天”更清楚自然。
