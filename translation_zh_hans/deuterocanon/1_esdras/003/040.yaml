  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: zh_hans
  text: 她们为男人制作衣裳，她们也使男人得荣耀；男人不能没有女人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“男人不能脱离女人而存在”。希腊文不定式εἶναι本义是“是”或“存在”。
    reason: 说明εἶναι的字面意义，并保留较贴近原文的“存在”与正文较自然的“不能没有”之间的译法差异。
lexical_decisions:
- source_word: αὗται
  choice: 她们
  rationale: 阴性指示代词回指上文的女人；现代汉语用“她们”自然清楚，同时以两句共用同一主语保留原文的强调。
- source_word: ποιοῦσιν τὰς στολὰς
  choice: 制作衣裳
  rationale: ποιεῖν在此表示制作；στολαί泛指衣服或袍服，“衣裳”既具体又不局限于礼服。
- source_word: ποιοῦσιν δόξαν
  choice: 带来荣耀
  rationale: 直译“制造荣耀”在汉语中生硬；“带来荣耀”保留δόξα所含的荣耀、尊荣或光彩之意，也维持女人使男人得荣耀的论述。
- source_word: οἱ ἄνθρωποι
  choice: 男人
  rationale: 虽然ἄνθρωποι可泛指人，但本句与τῶν γυναικῶν“女人”明确对举，因此译作“男人”更符合语境。
- source_word: οὐ δύνανται εἶναι χωρὶς τῶν γυναικῶν
  choice: 不能没有女人
  rationale: 这是自然的现代汉语，保留χωρίς所表达的缺少或离开；εἶναι本义为“存在、是”，其较直译形式在脚注说明。
theological_decisions:
- issue: οἱ ἄνθρωποι在与“女人”对举时是泛指人类还是特指男人
  choice: 男人
  alternative: 人、人类
  rationale: 紧邻的性别对举使男性所指更为突出；译作“男人”避免把原文的论证关系泛化。
- issue: “不能没有女人”是表达生存依赖还是一般关系上的不可缺少
  choice: 正文保留较宽泛的“不能没有女人”
  alternative: 离开女人便无法生存
  rationale: 希腊文εἶναι可指“是、存在”，但本句未进一步界定这种依赖的性质；正文不把它收窄为生物性生存，脚注提供较直译的可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“制作衣裳”保持具体，“带来荣耀”兼顾原文修辞与汉语自然度；分号呈现末句的总结推进。
