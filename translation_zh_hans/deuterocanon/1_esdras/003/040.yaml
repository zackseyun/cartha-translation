  terminology: “衣裳”适合στολάς的宽泛衣物含义；“荣耀”保留δόξα的庄重修辞色彩。“不能没有”恰当地保留χωρίς与εἶναι所表达的宽泛、未具体限定的依存关系。脚注以“脱离……而存在”说明较贴近原文的表达，避免将其限定为单纯生物性生存。
