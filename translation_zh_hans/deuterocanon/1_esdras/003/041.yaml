  text: But if they gather gold and silver and every beautiful thing[a], and see one woman beautiful in appearance and beauty,
translation:
  language: zh_hans
  text: 但如果他们聚集了金银和各样美好的东西，又看见一个容貌美丽、姿色出众的女子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 但如果
  rationale: 既保留ἐάν的条件意义，也体现δέ承接上文时的转折语气。
- source_word: συναγάγωσιν
  choice: 他们聚集了
  rationale: 表示把东西收集到一起；“聚集”保留具体动作，不额外解释为购买或积攒。
- source_word: χρυσίον καὶ ἀργύριον
  choice: 金银
  rationale: 采用现代汉语中自然凝练的并列说法，准确对应两种贵金属。
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: 各样美好的东西
  rationale: πρᾶγμα含义宽泛，不宜窄化为财物；“各样”自然传达πᾶν在此概括所有此类对象的意义。
- source_word: ἴδωσιν
  choice: 又看见
  rationale: “看见”直接对应视觉动作；“又”使两个条件动作在汉语中衔接自然，并未增加时间先后意义。
- source_word: γυναῖκα μίαν
  choice: 一个……女子
  rationale: 明确译出μίαν，以突出一个女子与前面众多贵重美物之间的对照。
- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: 容貌美丽、姿色出众
  rationale: 原文以καλήν及“形貌和美丽”叠加形容外在吸引力。汉语用两个并列短语保留强调效果，同时避免生硬重复。
