  yaml_path: translation/deuterocanon/1_esdras/003/007.yaml
  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: zh_hans
  text: 他必因自己的智慧，坐在仅次于大流士的位置上[a]，并被称为大流士的亲属[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被安置在仅次于大流士的地位上。”希腊文动词既可指就座，也可指被安置在某一等级或职位上。
    reason: lexical_alternative
  - marker: b
    text: “亲属”既可能指实际有亲属关系的人，也可能是宫廷中的荣誉称号，表示受到君王特别亲近和优待。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: 第二位
  rationale: 该词在此表示次序或地位；结合宫廷语境，指地位仅次于大流士。
- source_word: καθιεῖται
  choice: 被安排坐在
  rationale: 保留希腊文“就座”的具体形象，同时传达获授职位或等级的含义。
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: 因自己的智慧
  rationale: διά加宾格在此表示原因；“因”简洁、自然地保留这一因果关系。
- source_word: συγγενής
  choice: 亲族
  rationale: 该词通常指有亲属关系的人，但在王廷语境中也可能是荣誉身份；“亲族”保留亲缘用语而不排除宫廷称号的可能。
- source_word: κληθήσεται
  choice: 被称为
  rationale: 直接对应καλέω的将来时被动形式，表达将获得这一称谓。
