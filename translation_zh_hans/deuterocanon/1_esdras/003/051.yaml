base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: zh_hans
  text: 如今你们却不信我的话。王的权势岂不很大吗？各地的人岂不都害怕触碰他吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “触碰他”也可按语境译作“向他动手”。希腊原文的字面意思是“触碰他”。
    reason: 说明ἅψασθαι的字面义，并保留其在君王威权语境中可指不敢加害或冒犯的惯用含义。
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: 信我的话
  rationale: πιστεύω 加与格可表示“相信某人、信某人所说的”。现代汉语用“信我的话”比单说“信我”更清楚地表达此处听众不接受说话者论证的意思。
- source_word: μέγας
  choice: 很大
  rationale: μέγας 在这里描述君王权势之强盛；与“权势”搭配译作“很大”，既自然，也保留原文反问的力度。
- source_word: ἐξουσίᾳ
  choice: 权势
  rationale: ἐξουσία兼有权柄、权力和支配能力之意。此处强调君王令人不敢冒犯的统治力量，“权势”比单纯“权柄”更符合现代汉语语境。
- source_word: χῶραι
  choice: 各地的人
  rationale: χῶραι字面是“各地、各区域”，原文以地域代指其中的居民。译文明确补出“人”，避免现代汉语中“地方害怕”造成生硬，同时不把它限定为现代民族国家。
- source_word: εὐλαβοῦνται
  choice: 害怕
  rationale: 该动词可表达畏惧、戒慎或因顾忌而不敢行动。上下文说无人敢碰君王，因此“害怕”最直接地表现这种实际威慑。
- source_word: ἅψασθαι
  choice: 碰
  rationale: ἅπτομαι的直接义是“触碰、接触”。主文保留这一具体表达，同时通过脚注说明在语境中也可理解为“向他动手”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。首句按希腊文陈述句处理，以“却”体现论证中的反诘意味；后两句保留连续反问。
