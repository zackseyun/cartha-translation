base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: zh_hans
  text: 他们说：“王起身的时候，他们就把文书交给他；王和波斯的三位权贵判定谁的话更有智慧，胜利就赐给谁，正如所写的那样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθῇ
  choice: 起身
  rationale: 在此指王起来，可能是睡醒或从卧榻上起来；“起身”自然且不作过度限定。
- source_word: τὸ γράμμα
  choice: 文书
  rationale: γράμμα在此指参赛者写下并提交的文字材料；“文书”既保留书面文件之意，也不误导为私人书信。
- source_word: κρίνῃ
  choice: 判定
  rationale: 该动词表示经过评断而作出决定；“判定”符合竞赛裁决的语境。
- source_word: μεγιστᾶνες
  choice: 权贵
  rationale: 该词指波斯宫廷中地位显赫的人；“权贵”在现代汉语中自然地兼顾其高位与权势。
- source_word: Περσίδος
  choice: 波斯的
  rationale: 属格在这里指波斯国或波斯宫廷；译作“波斯的”简洁自然。
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: 谁的话更有智慧
  rationale: 保留λόγος可指言论、陈述或论说的宽度，也直接呈现原文的比较级“更有智慧”，不收窄为“论点”。
- source_word: τὸ νῖκος
  choice: 胜利
  rationale: νῖκος的直接意义是“胜利”；虽在竞赛中也可连带指获胜所得的奖赏，此处不将两者混同。
- source_word: καθὼς γέγραπται
  choice: 正如所写的
  rationale: 保留完成时被动态所表达的“已经写定并仍具效力”的意味，同时避免将其误解为经文引语公式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文“谁的话更有智慧”略带直译色彩，但可理解，并能保留λόγος的语义开放性以及比较结构。原文主语由复数“他们”转为不定复数“人”，中文用“人就把文书交给他”自然呈现，而不擅自指明执行者。
