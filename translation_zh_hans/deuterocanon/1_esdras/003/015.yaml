  text: 他坐在议事厅里[a]，那封信在他们面前被宣读。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公堂”“审判厅”或“法庭”；希腊词指办理议事、行政或司法事务的正式场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: 坐在
  rationale: 叙事中的不定过去时直接表示他坐下或入座；“坐在”自然简洁，不额外加入礼仪性意味。
- source_word: χρηματιστηρίῳ
  choice: 议事厅
  rationale: 该词指办理议事、行政或司法事务的正式场所。“议事厅”在现代汉语中清楚自然，同时不把场所限定为纯粹的法庭；其他可能含义保留于脚注。
- source_word: ἀνεγνώσθη
  choice: 宣读了
  rationale: 被动不定过去时意为“被读”。此处是在众人面前正式读信，汉语用“宣读”自然表达公开读出的语境，而不增加正文未有的内容。
- source_word: γράμμα
  choice: 信
  rationale: 此处指书面的通信或文书；结合叙事语境，“信”最自然。
- source_word: ἐνώπιον αὐτῶν
  choice: 在他们面前
  rationale: 贴近原文并符合现代汉语表达，保留当众、在场的意味。
