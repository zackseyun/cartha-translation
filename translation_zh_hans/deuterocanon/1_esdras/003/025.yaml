  text: 诸位啊，难道人类不占上风吗？他们掌管着大地、海洋和其中的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按较贴近原文分词结构的语序译作：“诸位啊，难道人类不占上风吗？他们掌管着大地、海洋和其中的一切。”希腊原文是预期肯定回答的反问句。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: 诸位啊
  rationale: 这是阳性复数呼格，用于直接称呼在场的男子；中文以“诸位啊”自然保留郑重的呼告语气，而不生硬重复性别信息。
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: 人类岂不是更有力量吗
  rationale: οὐχ引出的反问预期肯定回答；ὑπερισχύω含“更强、占优势”之意，“更有力量”既保留比较意味，也契合下文关于统治万物的论证。ἄνθρωποι在此泛指人类。
- source_word: κατακρατοῦντες
  choice: 他们掌管
  rationale: 该分词说明人类何以显得强大，表达支配、控制之意；“掌管”自然庄重，又不过度限定为政治统治。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: 大地、海洋
  rationale: γῆ与θάλασσα构成涵盖陆地与海域的并举；“大地、海洋”符合现代汉语并保留宏观范围。
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: 其中的一切
  rationale: 概括大地与海洋内所有事物，简洁保留πάντα的全称范围。
