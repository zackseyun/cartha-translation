  yaml_path: translation/deuterocanon/1_esdras/003/053.yaml
  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
translation:
  language: zh_hans
  text: 她会从王的头上取下王冠[a]，戴在自己头上，又用左手打国王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王冕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: 取下
  rationale: 分词与上下文的叙述性动作相连；汉语用“取下”自然表达从王头上拿走之意，不强加时态信息。
- source_word: τὸ διάδημα
  choice: 王冠
  rationale: διάδημα指君王佩戴、象征王权的冠饰；“王冠”现代、清楚，也保留其王室含义。
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: 戴在自己头上
  rationale: αὐτῇ在此回指该女子；结合王冠的通常佩戴部位，汉语明说“头上”可避免“戴在自己身上”的含混。
- source_word: ἐράπιζεν
  choice: 打
  rationale: ῥαπίζω可指用手掌击打或掌掴；“打”保留较宽泛的动作范围，而“用左手”已表明其手击方式。
- source_word: τῇ ἀριστερᾷ
  choice: 用左手
  rationale: 阴性单数与格省略了“手”，作工具用法；汉语补出“手”最自然。
- source_word: καὶ ... καὶ
  choice: ……，又……
  rationale: 以“又”承接并列动作，符合现代汉语叙事节奏，同时保留希腊文连续协调关系。
