  text: And when the king awoke, they took the letter and gave it to him, and he read it.
translation:
  language: zh_hans
  text: 王醒来后，他们取了那封信，交给王，王就读了那封信。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγέρθη
  choice: 醒来
  rationale: 此处是不及物用法，叙述王从睡眠中醒来；“醒来”自然准确，不必译成被动式“被唤醒”。
- source_word: λαβόντες
  choice: 他们拿起
  rationale: 将希腊语过去时分词转为汉语顺承动作，使叙事流畅，同时保留先拿信、后交给王的次序。
- source_word: τὸ γράμμα
  choice: 那封信
  rationale: γράμμα指上文写成、要呈交给王的文字；量词“封”符合现代汉语习惯，“那”体现其为语境中已知的特定书信。
- source_word: ἔδωκαν αὐτῷ
  choice: 交给王
  rationale: “交给”比直译“给了他”更贴合呈递书信的动作；重复“王”可避免代词指代含混。
- source_word: ἀνέγνω
  choice: 王就读了
  rationale: 希腊文的宾语由上下文补足，汉语可自然省略；“就”表达动作顺承，不额外增加因果含义。
