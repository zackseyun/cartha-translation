base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: zh_hans
  text: 各位男士，王不是很伟大吗？男子不是很多吗？酒不是很有力量吗？那么，谁统管他们？谁又支配他们呢？不就是女人吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: 诸位
  rationale: 这是阳性复数呼格，用来称呼在场的男子；现代汉语以“诸位”作公开讲话中的呼语最自然，而本节后文的“男人／女人”仍保留性别对照。
- source_word: μέγας
  choice: 伟大
  rationale: 在王权语境中表示显赫、强大；“伟大”保留原文简洁而宽泛的表述。
- source_word: ἄνθρωποι
  choice: 男人
  rationale: 该词通常也可泛指“人”，但下文明确以 γυναῖκες“女人”作对照，故此处译作“男人”更能呈现论证结构。
- source_word: οἶνος
  choice: 酒
  rationale: 普通名词，指酒；汉语无需在此进一步限定种类。
- source_word: ἰσχύει
  choice: 很有力量
  rationale: 该动词表示强健、有能力或有势力；这里译作“有力量”，既贴近词义，又与王的伟大和男人众多构成并列问句。
- source_word: δεσπόζων
  choice: 统管
  rationale: 表示居于主位并管辖；“统管”自然呈现其支配、治理之意。
- source_word: κυριεύων
  choice: 支配
  rationale: 表示行使主权或控制；与“统管”略作区分，以保留两个近义分词的并列强调。
- source_word: γυναῖκες
  choice: 女人
  rationale: 复数通常指女人；上下文没有把范围限定为已婚妇女，因此不译作“妻子”。
theological_decisions:
- issue: 男人与女人的修辞性对照
  choice: 将 ἄνθρωποι 译为“男人”，并将 γυναῖκες 译为“女人”
  alternative: 将 ἄνθρωποι 译为泛称的“人们”
  rationale: 原词本可泛指人类，但本句的论证落在男女对照上；保留这一对照可避免削弱原文的修辞逻辑，并不额外引申其神学含义。
- issue: δεσπόζων 与 κυριεύων 两个近义词的关系
  choice: 分别译作“统管”与“支配”
  alternative: 两者都译作“掌管”
  rationale: 原文使用两个近义分词加强语势。略加区分可保留平行结构，但不把二者解释成两种截然不同的权柄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以连续的反问句重现希腊文的演说节奏；“诸位”作为自然呼语，不在此重复标明性别，而后文“男人／女人”清楚保留原文的性别对照。
