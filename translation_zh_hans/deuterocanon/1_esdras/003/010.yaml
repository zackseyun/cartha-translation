lexical_decisions:
- source_word: ὁ εἷς
  choice: 其中一人
  rationale: 字面为“那一个”，在上下文中指参赛者中的一人；“其中一人”既自然，也明确保留其群体关系。
- source_word: ἔγραψεν
  choice: 写道
  rationale: 不定过去时在叙事中表示一次完成的动作；“写道”符合现代汉语引出所写内容的习惯。
- source_word: Ὑπερισχύει
  choice: 更强盛
  rationale: 该动词表示力量更强、胜过或占上风。希腊文并非明确的最高级，因此正文用比较性表达“更强盛”，并以脚注保留“占上风”的可能译法。
- source_word: ὁ οἶνος
  choice: 酒
  rationale: 定冠词在此可表类别的泛指；汉语用“酒”即可自然表达酒这一类事物，无须另译冠词。
