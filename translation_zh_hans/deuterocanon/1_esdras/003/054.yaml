  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: zh_hans
  text: 除此以外，王张着嘴凝视着她；她若对他发笑[a]，他也笑；她若向他动怒，他就奉承她，好让她与他和好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她若同他一起笑。”希腊文中“笑”后所用的与格可以表示不止一种关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: 除此以外
  rationale: 作为承接上文、增添论点的连接语，保留其累加语气，同时符合现代汉语表达。
- source_word: χάσκων τὸ στόμα
  choice: 张着嘴
  rationale: 直接保留原文鲜明而具体的身体姿态，与后面的凝视动作自然衔接。
- source_word: ἐθεώρει
  choice: 凝视着
  rationale: 表达持续、专注地观看，比普通的“看”更能体现语境中君王被吸引的状态。
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: 她若对他发笑，他也笑
  rationale: 保留γελάω前后重复所形成的平行句式；“对他发笑”保留与格αὐτῷ的关系，同时用脚注说明另一种合理理解。
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: 向他动怒
  rationale: 以自然、简洁的现代汉语表达她对他产生恼怒或不悦，保留ἐπʼ αὐτόν所指的针对关系。
- source_word: κολακεύει
  choice: 奉承她
  rationale: 直接表达以讨好言行争取对方欢心的含义，不将其弱化为一般性的安慰。
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: 好让她与他和好
  rationale: 清楚表达关系恢复的目的；“和好”比生硬的“与他和解”更符合此处人际语境，又不额外规定和好的方式。
