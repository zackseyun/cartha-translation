  yaml_path: translation/deuterocanon/1_esdras/003/046.yaml
  text: And a man takes his sword and goes out to campaign and to plunder and to steal[a], and to sail on the sea and rivers,
translation:
  language: zh_hans
  text: 人拿起自己的剑，出去出征[a]、抢掠、偷窃，又航行于海上和江河中，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出征”所译的希腊词也可译作“出外行军”；广义上也可理解为“作战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνει
  choice: 拿起
  rationale: 表示取用并持有武器；“拿起”符合此处具体行动，也比“接受”自然。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 希腊文为泛指的单数人称；现代汉语用“人”可自然保留其代表性表述，无须额外标明性别。
- source_word: τὴν ῥομφαίαν αὐτοῦ
  choice: 自己的刀
  rationale: ῥομφαία指刀剑类大型利器；“刀”简洁自然，αὐτοῦ译为“自己的”以明确所属。
- source_word: ἐκπορεύεται
  choice: 出去
  rationale: 保留“从某处出去、出发”的基本空间意义，并自然引出后续目的性不定式。
- source_word: ἐξοδεύειν
  choice: 远征
  rationale: 该词在此可指外出征战或出征；“远征”兼顾出行与军事行动的意味，同时不直接强化为一般性的“作战”。
- source_word: λῃστεύειν
  choice: 抢掠
  rationale: 指以强暴方式劫夺；“抢掠”适合与远征的语境相连，并与后面的暗中“偷窃”形成区别。
- source_word: κλέπτειν
  choice: 偷窃
  rationale: 准确表达秘密或非法窃取，与λῃστεύειν所指的强力抢夺相区别。
- source_word: εἰς τὴν θάλασσαν πλεῖν καὶ ποταμούς
  choice: 在海上和江河中航行
  rationale: πλεῖν表示乘船航行；εἰς在航行表达中可自然译作“在……上/中”，而“江河”比单用“河流”更适合与“海上航行”并列。
