  text: And then the king and the nobles looked at one another, and he began to speak about the truth.
translation:
  language: zh_hans
  text: 那时，王和权贵们彼此对望；他便开始谈论真理。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: 权贵们
  rationale: 该词指宫廷中位高权重的人或显贵。“权贵们”符合王室语境，在现代汉语中也比“贵族”更能涵盖不一定具有世袭身份的高官显要。
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: 彼此对望
  rationale: 希腊文形式近于“望向另一个人”，但复数主语在这里表达相互注视。“彼此对望”自然地传达众人交换目光的情景。
- source_word: ἤρξατο λαλεῖν
  choice: 开始谈论
  rationale: ἤρξατο加不定式表示动作开始；结合περὶ τῆς ἀληθείας，译为“开始谈论真理”比“开始说关于真理的话”更自然。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 此处带定冠词，并且是比赛中将要讨论的特定主题。汉语通常无需用对应冠词，译作“真理”既自然，也保留其作为主题和抽象概念的分量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的叙事语言。“王”延续古代宫廷语境；分号连接众人对望与随后发言两个紧密相承的动作。希腊文未明说“他”是谁，正文保留代词，不擅自指明人物。
