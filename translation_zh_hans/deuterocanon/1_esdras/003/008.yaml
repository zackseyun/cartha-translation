  yaml_path: translation/deuterocanon/1_esdras/003/008.yaml
  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: zh_hans
  text: 于是，他们各自写下自己的陈述，把它们封好，放在大流士王的枕头[a]下面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“头枕”。希腊语προσκεφάλαιον可指枕头或用来承托头部的头枕。
    reason: 词义存在可成立的不同译法；正文选用较通行的“枕头”，脚注保留“头枕”。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中的下一步；“于是”比直译为“那时”更自然地承接前文。
- source_word: γράψαντες ἕκαστος
  choice: 他们各自写下
  rationale: 保留ἕκαστος的逐一分配意义，并用先行动作“写下”体现不定过去分词相对于后面主要动词的先行关系。
- source_word: τὸν ἑαυτοῦ λόγον
  choice: 自己的陈述
  rationale: λόγος在此指各人写下的主张或说法；“陈述”既符合竞赛语境，又避免“论点”所带来的过度解释。
- source_word: ἐσφραγίσαντο
  choice: 把它们封好
  rationale: 根据上下文补出隐含宾语，指各人写下的陈述；“封好”自然表达加封使内容不被预先查看的动作。
- source_word: ἔθηκαν
  choice: 放在
  rationale: 以简洁、自然的叙事用语表达“放置”。
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: 枕头下面
  rationale: προσκεφάλαιον可指枕头或头枕；正文采用现代汉语最清楚常用的“枕头”，并在脚注保留另一译法。
- source_word: Δαρείου τοῦ βασιλέως
  choice: 大流士王的
  rationale: 按现代汉语习惯将头衔置于姓名之后，清楚表达属格关系。
