  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: zh_hans
  text: 他们从酒中起来时[a]，就不记得自己做过什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他们从酒中起来时”。这句话是指他们在酒的影响之下或之后起身，并不一定是在明确说他们已经酒醒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出一般性的时间从句；现代汉语用“……时”自然简洁，也不排除“每当”的概括意味。
- source_word: ἀπὸ τοῦ οἴνου
  choice: 从酒中
  rationale: 保留希腊文“从酒中”的具体意象，不直接解释为“酒醒”或“从醉态中恢复”。
- source_word: ἐγερθῶσιν
  choice: 起来
  rationale: 对应“起来、起身”的基本义；避免译成“清醒过来”，以免把原文隐含的状态变化解释得过于确定。
- source_word: οὐ μέμνηται
  choice: 就不记得
  rationale: 原文动词形式为单数，但前文所指为复数群体；汉语按整体语义自然处理，不显明数的不一致。“就”顺畅连接时间从句与结果，不额外强化因果。
- source_word: ἃ ἔπραξαν
  choice: 自己做过什么
  rationale: 自然表达“他们所做的事”；“自己”明确回指主语，“做过”体现已发生的行为。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从酒中起来”略带陌生感，是为保留原文具体而含混的表达；以脚注说明其语境含义，避免正文过度诠释。
