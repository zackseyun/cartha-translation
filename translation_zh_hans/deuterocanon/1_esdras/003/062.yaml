  yaml_path: translation/deuterocanon/1_esdras/003/062.yaml
  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
translation:
  language: zh_hans
  text: 真理长存，永远刚强；真理活着，永永远远得胜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永永远远”直译为“直到世代的世代”，是表示永久的加强说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 保留抽象名词及其拟人化色彩，不额外限定为某种具体教义概念。
- source_word: μένει
  choice: 长存
  rationale: 表达持续存在和不消逝，比“停留”更符合这段颂赞式语境，也较“常在”更自然明白。
- source_word: ἰσχύει
  choice: 刚强
  rationale: 保留其“有力量、强盛”的意义，并与后面的 κρατεῖ“得胜”有所区别。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该希腊语时间表达在现代汉语中的自然对应。
- source_word: ζῇ
  choice: 活着
  rationale: 直接保留真理被拟人化为有生命者的鲜明表达。
- source_word: κρατεῖ
  choice: 得胜
  rationale: 在真理之力量的语境中表达占优势、最终胜过；避免与前面的“刚强”重复。
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: 永永远远
  rationale: 用汉语中自然且庄重的加强式表达原文“直到世代之世代”的永久意义。
theological_decisions:
- issue: 真理的拟人化
  choice: 保留“长存、刚强、活着、得胜”等以真理为主语的谓语
  alternative: 将整句抽象化，如“真理永恒而有力量”
  rationale: 原文连续使用限定动词描述真理，形成强烈的拟人化和颂赞语气；译文保留这种张力，不将其解释成额外的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真理”重复一次以避免汉语中后半句主语含混，并强化原文的颂赞节奏；分号呈现两组并列谓语。
