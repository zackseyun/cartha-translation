  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
translation:
  language: zh_hans
  text: 他们喝酒时，便不记得要以亲爱相待朋友和弟兄[a]；过不多久，就拔出刀剑来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以亲爱相待”也可译为“亲爱地对待”或“亲吻”；这里原文并不一定专指亲吻。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: 他们……就不记得
  rationale: 希腊文动词为单数，但与复数的 πίνωσιν 并列，在上下文中泛指饮酒的人；汉语用“他们”自然承接这一类人。
- source_word: ὅταν πίνωσιν
  choice: 他们喝酒时
  rationale: ὅταν 加虚拟式表达一般或反复发生的时间情形；“喝酒时”简洁自然，并保留泛指意味。
- source_word: φιλάζειν
  choice: 表示亲爱
  rationale: 此词指以亲爱、友好的态度相待，不必限定为实际亲吻；“表示亲爱”保留其关系性含义。
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: 朋友和弟兄
  rationale: 忠实保留原文的两个并列群体；ἀδελφοῖς 在此为阳性复数，译作“弟兄”符合语境。
- source_word: μετʼ οὐ πολὺ
  choice: 过不多久
  rationale: 准确表达“短时间之后”，同时符合庄重而自然的现代汉语。
- source_word: σπῶνται μαχαίρας
  choice: 拔出刀剑来
  rationale: σπάω 在此指拔出武器；“拔出刀剑”清楚呈现由亲爱骤转为暴力的动作。
