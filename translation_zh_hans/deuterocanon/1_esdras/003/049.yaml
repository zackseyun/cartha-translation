  yaml_path: translation/deuterocanon/1_esdras/003/049.yaml
  text: And many lost their senses because of women[a], and became servants because of them;
translation:
  language: zh_hans
  text: 许多人因女人而失去了理智[a]，又因她们成了奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多人因女人而在自己的心思中迷失。”希腊语的说法较为特殊，把“失去理智”的动词与“自己的心思”连在一起。
    reason: 保留希腊语特殊表达及较贴近字面的另一种译法。
lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: 失去了理智
  rationale: ἀπενοήθησαν 表示失去正常判断、变得不理智；与 ταῖς ἰδίαις διανοίαις（字面为“在自己的心思中”）合用，构成较为特殊的表达。译作“失去了理智”自然传达整体意义，同时以脚注保留更贴近字面的可能译法。
- source_word: διὰ τὰς γυναῖκας
  choice: 因女人
  rationale: διά 加宾格在此表示原因；“因女人”简洁、自然，并保留原文的因果关系。
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 该词指受支配的奴隶身份；此处强调人成为受辖制者，“奴隶”比“仆人”更准确地保留其力度。
- source_word: ἐγένοντο
  choice: 成了
  rationale: 表示状态发生改变；“成了”符合现代汉语表达。
- source_word: διʼ αὐτάς
  choice: 因她们
  rationale: αὐτάς 回指前面的“女人”，διά 加宾格仍表原因；保留原文重复的因果措辞。
theological_decisions:
- issue: δοῦλοι 的身份强度
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文所表达的是实际的受制与从属，而不只是一般服侍关系；因此采用“奴隶”，避免弱化原词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“失去了理智”传达希腊语整体习语意义；“奴隶”保留 δοῦλοι 所含的受辖制力度。
