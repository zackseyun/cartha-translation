  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
translation:
  language: zh_hans
  text: 他与那女人[b]在一起，竟连自己的性命[a]也舍弃，也不顾念父亲、母亲或故土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或可译作“灵魂”或“自己”。希腊语ψυχή在这里含义较宽，可指性命、自身或灵魂。
    reason: lexical_alternative
  - marker: b
    text: “女人”也可译作“妻子”；希腊语γυνή可有这两种含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: 与那女人在一起
  rationale: μετά加属格通常表示“与……一起”，这里保留伴随或关联之意，不将其解释性地改为“为了”或“因为”。
- source_word: γυνή
  choice: 女人
  rationale: γυνή既可指“女人”，也可指“妻子”；本句上下文并未明确限定婚姻关系，因此正文采用较宽泛的“女人”，并以脚注保留另一可能。
- source_word: ἀφίησι τὴν ψυχήν
  choice: 连自己的性命也舍弃了
  rationale: ἀφίημι可表示放开、离弃或舍弃，ψυχή可指性命、生命、自身或灵魂。此处“舍弃性命”自然传达极端的自我放弃，同时避免把ψυχή狭义化为与身体相对的“灵魂”。
- source_word: μέμνηται
  choice: 顾念
  rationale: 该词表示记得、想到或放在心上；在列举父母和故土的语境中，“顾念”比单纯的“记得”更自然地表达不再挂念。
- source_word: χώραν
  choice: 故土
  rationale: χώρα可指土地、地区或国家；与父亲、母亲并列时，指向个人所属和眷恋的本乡本土，“故土”简洁而贴切。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“连……也”表现此句的递进力度；“不再顾念”自然承接希腊语连续否定结构。正文保留γυνή和ψυχή的语义张力，并以脚注说明主要译法选择。
