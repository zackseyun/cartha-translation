base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/052.yaml
  text: I saw him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: zh_hans
  text: 我看见[a]他，也看见亚帕米——那位令人赞叹的[b]巴尔塔科斯的女儿、王的妾——坐在王的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我看见”所译的希腊语形式既可解析为“我一直观看”，也可解析为“他们一直观看”；此处按上下文译作第一人称单数。
    reason: textual_ambiguity
  - marker: b
    text: “令人赞叹的”也可译作“显赫的”“著名的”或“非凡的”。原文未明确说明这是描述语还是称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεώρουν
  choice: 我看见
  rationale: 该未完成过去时形式按上下文取第一人称单数，表达说话者亲眼观看；汉语叙事用“我看见”自然简明，而脚注保留其形态上的歧义及持续意味。
- source_word: αὐτόν
  choice: 他
  rationale: 保留阳性单数宾格代词，不擅自补明其所指对象。
- source_word: Ἀπάμην
  choice: 亚帕米
  rationale: 按希腊人名Ἀπάμη的词干音译；原文此处为宾格形式，不把格尾误作姓名的一部分。
- source_word: θυγατέρα
  choice: 女儿
  rationale: 直接保留亲属关系。
- source_word: Βαρτάκου
  choice: 巴尔塔科斯
  rationale: 按主格Βαρτάκος还原并音译人名，而不是照属格词尾音译。
- source_word: τοῦ θαυμαστοῦ
  choice: 令人赞叹的
  rationale: θαυμαστός可指令人惊叹、受人称赞或显赫；正文采用较贴近其基本描述意义、又不强定为正式头衔的表达。
- source_word: παλλακήν
  choice: 妃嫔
  rationale: 该词指地位有别于正妻的王室伴侣；“妃嫔”在现代中文中比“情妇”更符合宫廷语境，同时保留其非王后身份。
- source_word: καθημένην
  choice: 坐
  rationale: 该阴性宾格分词与“亚帕米”一致，说明她当时所处的姿势。
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: 在王的右边
  rationale: 直接表达空间位置，也保留该位置可能含有的尊荣意味而不加解释。
