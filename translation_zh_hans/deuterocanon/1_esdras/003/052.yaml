translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以破折号标出同位说明，使“女儿”和“王的妃嫔”都清楚修饰亚帕米；不补明代词“他”的所指，也不把巴尔塔科斯的修饰语强定为正式称号。
