base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: zh_hans
  text: 那些不服兵役、也不打仗，只耕种土地的人，每逢播种，收割之后，也把贡物献给王[a]；他们还彼此强迫[b]，把税款交给王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“献给王”，没有明说所献的是什么；按上下文，这里指向王缴纳贡物。
    reason: 说明原文宾语省略及译文补足
  - marker: b
    text: 直译为“一个强迫另一个”，即“彼此强迫”；原文没有说明这种强迫的具体方式。
    reason: 保留相互强制这一含混表达
lexical_decisions:
- source_word: στρατεύονται
  choice: 服兵役
  rationale: 该动词指从军或参加军事行动；“服兵役”是现代汉语中简洁自然的表达，并与下文“打仗”有所区别。
- source_word: πολεμοῦσιν
  choice: 打仗
  rationale: 直接表达作战之意，与“服兵役”构成自然并列。
- source_word: γεωργοῦσιν τὴν γῆν
  choice: 耕种土地
  rationale: 贴近原文的农业劳动含义，同时符合现代汉语的庄重叙述语体。
- source_word: ὅταν σπείρωσιν, θερίσαντες
  choice: 每逢播种之后，收割了
  rationale: ὅταν加虚拟式表达反复发生的情形，译作“每逢”；不定过去时分词θερίσαντες表示在缴纳之前完成收割。
- source_word: πάλιν
  choice: 也
  rationale: 此处承接上下文，表示这些农耕者同样受王权支配；汉语用“也”比机械译作“再次”自然。
- source_word: ἀναφέρουσιν τῷ βασιλεῖ
  choice: 把贡物献给王
  rationale: 动词在此有向上呈交、缴纳给统治者之意；原文第一次未明说宾语，译文按财政语境补出“贡物”，并以脚注说明。
- source_word: ἀναγκάζοντες ἕτερος τὸν ἕτερον
  choice: 彼此强迫
  rationale: 保留ἀναγκάζω的强制意味和ἕτερος τὸν ἕτερον的相互关系，不把具体执行机制解释得过细。
- source_word: τοὺς φόρους
  choice: 税款
  rationale: φόροι指应向统治者缴纳的贡税或赋税；“税款”清楚表达此处明确的财政义务。
- source_word: ἀναφέρουσι τοὺς φόρους τῷ βασιλεῖ
  choice: 把税款交给王
  rationale: 第二次ἀναφέρω仍表示向王呈交；汉语用“交给”避免与前句机械重复，同时保留接受者。
theological_decisions:
- issue: 第一次ἀναφέρουσιν没有明说所呈交之物
  choice: 正文补作“贡物”，并加脚注说明原文省略宾语
  alternative: 只译作“献给王”或将两处都译作“缴税给王”
  rationale: 上下文及第二句明确的φόρους表明这是向王缴纳财物，但原文从笼统的呈交推进到明确的税款。译作“贡物”可使汉语完整，又不把两处完全等同。
- issue: ἀναγκάζοντες ἕτερος τὸν ἕτερον所指的相互强制
  choice: 保留为“彼此强迫”
  alternative: 解释为“互相催促缴税”或“官员强迫百姓”
  rationale: 原文明确表达相互关系，却没有说明由谁执行、如何执行；直译保留这种含混和强制色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“服兵役、打仗、耕种土地、税款”均为普通读者熟悉的用语；句法尽量保留原文两分句的递进关系，并避免把“彼此强迫”的主体和机制解释得超出希腊文本。
