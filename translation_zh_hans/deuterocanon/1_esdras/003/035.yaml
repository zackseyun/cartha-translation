  yaml_path: translation/deuterocanon/1_esdras/003/035.yaml
  text: O men[a], how does the king not prevail, since he is so obeyed? And he was silent.
translation:
  language: zh_hans
  text: “诸位男士，君王既然如此受人听从[a]，怎么会不占上风呢？”他便不作声了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人们如此留意他”或“如此听取他的话”。希腊语此词可指“被听从”，也可指“被留意／被听取”；鉴于主语是君王且上下文论及权威，正文译作“受人听从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: 诸位
  rationale: 表示对在场众人的直接呼告；现代汉语用“诸位”自然庄重，也不额外加入原文没有的身份称谓。
- source_word: πῶς οὐχ
  choice: 怎么会不……呢
  rationale: 保留反问语气，表达惊讶与论辩性的挑战，符合现代汉语习惯。
- source_word: ὑπερισχύει
  choice: 占上风
  rationale: 该词表示更强、胜过或占优势；此处是关于何者力量更大的辩论，“占上风”既自然又不局限于武力压制。
- source_word: ὁ βασιλεύς
  choice: 君王
  rationale: 直接对应 βασιλεύς，并采用庄重而通行的圣经叙事用语。
- source_word: ὅτι
  choice: 既然
  rationale: 在反问中引出作为依据的原因，比“因为”更自然地呈现论证关系。
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: 如此受人听从
  rationale: ἐπάκουστος 可指被聆听、被理会或被服从；“受人听从”保留听从与服从之间的语义张力，同时契合君王权威的语境。
- source_word: καὶ ἐσίγησεν
  choice: 说完，他便不再作声
  rationale: 以自然汉语表达不定过去时所述的停止说话；“说完”承接前述发言，“不再作声”避免误解为持续性的沉默状态。
