  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: zh_hans
  text: 她若叫他们彼此交战，他们就照办；她若派他们出去迎敌，他们就前去，摧毁山岭、城墙和塔楼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摧毁”所译的希腊词也可译作“毁坏”或“攻克”；这里表示对地形和防御工事采取强力行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ αὐτοῖς
  choice: 她若叫他们
  rationale: 条件式表达一般性的情形；“叫”自然地传达说话者发出指示，又不把 εἴπῃ 过度强化为正式命令。
- source_word: ποιῆσαι πόλεμον ἕτερος πρὸς τὸν ἕτερον
  choice: 彼此交战
  rationale: 简洁表达“一个对另一个发动战争”的相互敌对关系，符合现代汉语习惯。
- source_word: ποιοῦσιν
  choice: 他们就照办
  rationale: 该动词概括回应前述指示；“照办”清楚传达他们将她所说的付诸实行。
- source_word: ἐξαποστείλῃ αὐτοὺς πρὸς τοὺς πολεμίους
  choice: 派他们出去迎敌
  rationale: “派……出去”保留复合动词的遣出意味；军事语境中的“迎敌”自然表达 πρὸς τοὺς πολεμίους 的敌对方向。
- source_word: βαδίζουσιν
  choice: 他们就前去
  rationale: 保留“行走、前往”的宽泛意义，不额外加入原文未明说的列队行军色彩。
- source_word: κατεργάζονται
  choice: 摧毁
  rationale: 此处宾语包括山岭与防御工事，动词表示强力作用并造成破坏；“摧毁”既自然，也保留其作用范围的宽度。
- source_word: τὰ ὄρη καὶ τὰ τείχη καὶ τοὺς πύργους
  choice: 山岭、城墙和塔楼
  rationale: 依次保留三个具体名词；τείχη 在军事语境中自然译为“城墙”，πύργους 译为“塔楼”，不泛化为堡垒。
theological_decisions:
- issue: 本节阴性单数主语的所指
  choice: 以“她”承接上下文中的女人
  alternative: 重复译作“那女人”
  rationale: 本节希腊文没有明写主语，但动词为第三人称单数，直接上下文所论的是女人的力量；用“她”既保留上下文衔接，也不加入额外解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“彼此交战”“派……出去迎敌”“前去”保持原句紧凑的条件—回应结构；保留“山岭”这一较难理解却明确存在于原文的意象，不擅自改作“堡垒”。
