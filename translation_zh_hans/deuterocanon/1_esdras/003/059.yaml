  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: zh_hans
  text: 做这些事的那一位岂不伟大？真理也是伟大的，并且比一切都更有力量[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做这些事的他。”希腊文没有明说所指的是谁；较广的上下文可能暗示上帝，但本句本身并未称名。
    reason: alternative_reading
  - marker: b
    text: 或译：“比万物更强。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: 岂不是……吗
  rationale: 引出预期肯定回答的反问，既保留希腊文的修辞力量，也符合现代汉语的庄重表达。
- source_word: μέγας
  choice: 伟大
  rationale: 表达身份、地位或意义上的卓越，并与下句对真理的评价相呼应。
- source_word: ὃς
  choice: ……的那一位
  rationale: 关系代词在此作名词性用法，指单数行动者；译文不擅自将其明确为上帝。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示，回指上文所述的诸般作为。
- source_word: ποιεῖ
  choice: 做
  rationale: 在此表示施行前述事情；“做”是自然、宽泛且贴合原文的对应词。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 在这一智慧宣言中表示真理或真实，而非主要指人的忠信。
- source_word: ἰσχυροτέρα
  choice: 更有力量
  rationale: 保留比较级所表达的力量优势；相较“更强”，用于抽象的“真理”更自然庄重。
- source_word: παρὰ πάντα
  choice: 比一切都
  rationale: 清楚表达与所有事物相比的普遍范围，同时保持自然的现代汉语语序。
theological_decisions:
- issue: “做这些事的那一位”所指为何
  choice: 正文保留未明确的单数行动者，不直接译为“上帝”
  alternative: 将其理解并明确译作上帝
  rationale: ὃς 本身没有点明所指。上下文可能暗示上帝，但本句并未直接称名，因此译文保留原有含蓄和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“岂不是……吗”保留反问语气；“那一位”维持单数人称指向而不擅自补出上帝；后半句保留原文两个并列判断的推进感。
