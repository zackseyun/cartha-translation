lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为叙事中的时间与次序连接语，自然承接上文。
- source_word: οἱ τρεῖς νεανίσκοι
  choice: 三个年轻人
  rationale: νεανίσκοι指年轻男子；“年轻人”是现代汉语中清楚自然的表达。
- source_word: οἱ σωματοφύλακες
  choice: 侍卫
  rationale: 该复合词指贴身护卫；结合王宫语境，“侍卫”简洁自然，并由后面的说明明确其职责。
- source_word: οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως
  choice: 守护王本人
  rationale: 保留“守护”的持续职责含义；σῶμα字面为“身体”，但此处是指王本人，即保护其人身安全。
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: 彼此说道
  rationale: 准确表达相互交谈的结构，也保留εἶπαν的“说”义；冒号提示下文将引出话语。
