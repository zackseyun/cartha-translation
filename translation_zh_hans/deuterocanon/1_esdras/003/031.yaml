  text: He said to strike, and they strike; he said to lay waste, and they lay waste; he said to build, and they build.
translation:
  language: zh_hans
  text: 他说要击打，他们就击打；他说要使之荒凉，他们就使之荒凉；他说要建造，他们就建造。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: 他说要
  rationale: εἶπε是λέγω的简单过去时，在三个并列分句中引出所要求的行动。译作“他说要”既保留“说”的字面意义，也以自然汉语表达其后不定式所含的指令意味，避免每次都强化为“命令”。
- source_word: πατάξαι
  choice: 攻打
  rationale: πατάξαι表示击打或攻击；此处处于君王发令、众人执行的政治军事语境中，“攻打”比单纯“击打”更自然，同时不明确添加原文未说明的对象。
- source_word: τύπτουσιν
  choice: 他们就攻打
  rationale: τύπτουσιν为现在时，紧接所说的行动，呈现命令立即奏效的鲜明场景。“就”自然体现前后响应关系，“攻打”与前项保持修辞上的对应。
- source_word: ἐρημῶσαι
  choice: 毁坏
  rationale: 该词意为使之荒废、成为废墟。“毁坏”是现代汉语中简洁有力的表达，保留破坏性含义而不额外指定对象或程度。
- source_word: ἐρημοῦσιν
  choice: 他们就毁坏
  rationale: 与ἐρημῶσαι形成指令与执行的对应；重复“毁坏”保存原文简短、排比的节奏。
- source_word: οἰκοδομῆσαι
  choice: 建造
  rationale: 基本义为建造。上下文虽可能让人想到重建，但希腊文本本身没有明确要求译出“重”，因此采用较克制的“建造”。
- source_word: οἰκοδομοῦσιν
  choice: 他们就建造
  rationale: 对应前面的οἰκοδομῆσαι，以相同词语保持‘说—执行’的排比结构和简洁节奏。
theological_decisions:
- issue: 反复使用εἶπε加不定式所体现的王权程度
  choice: 译为“他说要……他们就……”，不强化为“他命令……他们便服从”。
  alternative: “他命令攻打，他们就攻打”；或“他一声令下，他们便攻打”。
  rationale: 经文借重复结构凸显此人的话立刻产生效力。“他说要……他们就……”既传达实际的指令作用，也不把原文进一步解释成明确的‘命令’或‘服从’，从而保留措辞的克制与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个分句严格平行，以分号保存希腊文的并列推进；反复使用“他说要……他们就……”再现原文简洁有力的节奏。经文无需脚注。
