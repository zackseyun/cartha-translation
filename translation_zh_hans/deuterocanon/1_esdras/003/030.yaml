  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
translation:
  language: zh_hans
  text: 即使他独自一人，若他下令杀人，他们就杀人；若他下令释放，他们就释放。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “释放”也可译作“放走”或“赦免”；希腊语动词可随语境表达这些意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς εἰ μόνος ἐστίν
  choice: 他即使独自一人
  rationale: 将强调代词αὐτός与“若是独自一人”合并自然表达，突出即便君王单独一人，其命令仍有绝对效力；不把μόνος过度解释为“唯一掌权者”。
- source_word: ἐὰν εἴπῃ ἀποκτεῖναι
  choice: 只要他说杀谁
  rationale: ἐάν加虚拟式在此表达一般条件；“只要”符合上下文所强调的命令效力。希腊文未明说宾语，中文补出泛指的“谁”以使句意自然。
- source_word: ἀποκτέννουσιν
  choice: 人们就杀谁
  rationale: 直译其现在时和简洁有力的语气；以“人们”表达希腊文第三人称复数的不定施事者。
- source_word: ἀφεῖναι / ἀφίουσιν
  choice: 释放谁／就释放谁
  rationale: ἀφίημι可指释放、放走或赦免；本处与杀人命令对举，“释放”较宽泛，不限定为司法赦免。
