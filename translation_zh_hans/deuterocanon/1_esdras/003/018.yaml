  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich;
translation:
  language: zh_hans
  text: 它使君王和孤儿的心思一致，也使奴隶[a]和自由人的心思一致，使穷人和富人的心思一致；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家仆”或“仆人”。希腊文οἰκέτης可指家仆或奴隶；这里与“自由人”相对，较可能强调其非自由身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: 使……一致
  rationale: 这是表示造成某种状态的现在时动词；与宾语“心思”和表语“一个”结合，汉语译作“使……一致”自然且保留主动的致使含义。
- source_word: διάνοιαν
  choice: 心思
  rationale: 该词在此指人的思想、心态或内在意向；“心思”既自然，又不把含义限定为理智或理解力。
- source_word: μίαν
  choice: 一致
  rationale: 希腊文直译为“一个”，在此表示身份悬殊的人具有同样的心思；汉语用“一致”清楚表达其归于同一状态的作用。
- source_word: βασιλέως
  choice: 君王
  rationale: 保留该词通常的王权含义；“君王”庄重而为现代读者熟悉。
- source_word: ὀρφανοῦ
  choice: 孤儿
  rationale: 准确表达失去父母或庇护者的弱势身份，并与“君王”构成鲜明对照。
- source_word: οἰκέτου
  choice: 奴仆
  rationale: οἰκέτης可指家仆，也可指受奴役的家内奴隶；因其与“自由人”对举，“奴仆”较能保留非自由身份，同时符合中文历史语境。
- source_word: ἐλευθέρου
  choice: 自由人
  rationale: 这里明确表示与受奴役者相对的法律或社会身份；“自由人”比单说“自由的”更自然明确。
- source_word: πένητος
  choice: 穷人
  rationale: 直接表达经济贫困的社会身份，并与“富人”形成对举。
- source_word: πλουσίου
  choice: 富人
  rationale: 直接而自然地表达富有者，与“穷人”对应。
theological_decisions:
- issue: οἰκέτου在社会身份对举中的译法
  choice: 奴仆
  alternative: 仆人；家仆；奴隶
  rationale: 该词本身可涵盖家仆与奴隶，但本节以ἐλευθέρου“自由人”与之对举，说明非自由身份是重点。“奴仆”既保留受役使的意味，也不把词义不必要地收窄为某一种奴隶制度；脚注交代可译“仆人”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文只在首组明说“心思”，后两组有所省略；译文补出“心思一致”，使三个平行对举在汉语中清楚连贯。保留分号，以衔接上下文尚未结束的句子。
