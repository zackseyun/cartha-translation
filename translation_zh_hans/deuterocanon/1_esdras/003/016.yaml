  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
translation:
  language: zh_hans
  text: 他说：“叫那些年轻人来；他们会陈述各自的话[a]。”他们被叫来，便进去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各自的话”也可译作“各自的陈述”或“各自的论点”。希腊语 λόγους 含义较宽，可指话语、陈述或论点。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: 叫来
  rationale: 这是 καλέω 的不定过去时主动命令式复数；“叫来”自然直接，也符合召人入内的宫廷叙事场景。
- source_word: τοὺς νεανίσκους
  choice: 那些年轻人
  rationale: νεανίσκος 通常指年轻男子；上下文已明确人物身份，现代汉语用“年轻人”自然且不失原意。
- source_word: δηλώσουσιν
  choice: 会陈明
  rationale: δηλόω 有使人明白、表明、宣明之意；“陈明”兼顾公开陈述的正式语气与内容尚未完全限定的特点。
- source_word: τοὺς λόγους αὐτῶν
  choice: 自己的话
  rationale: λόγοι 语义宽泛，可指话、陈述或论点；“自己的话”贴近原文，并保留此处究竟侧重陈述还是论辩的含混性。
- source_word: ἐκλήθησαν
  choice: 被叫来
  rationale: 这是 καλέω 的不定过去时被动形式；与前面的“叫来”重复用词，以保留希腊文的呼应。
- source_word: εἰσήλθοσαν
  choice: 进去了
  rationale: εἰσέρχομαι 表示进入；“进去了”是自然的现代叙事表达，并清楚呈现他们受召后入内的动作。
