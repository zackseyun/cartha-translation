  text: He said[a], ‘Cut it down,’ and they cut it down; he said, ‘Plant it,’ and they plant it.
translation:
  language: zh_hans
  text: 他说：“砍掉”，他们就砍掉；他说：“栽种”，他们就栽种。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“砍掉”和“栽种”两处都没有明说宾语。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 他说
  rationale: 采用 λέγω 不定过去时的普通含义，并保留原文简短、重复的句式；上下文已显出命令意味，无须直接译成“他命令”。
- source_word: ἐκκόψαι
  choice: 砍掉
  rationale: 这是 ἐκκόπτω 的不定过去时不定式，在 εἶπεν 后表达所说的指令；“砍掉”自然地传达砍除之意，同时不擅自明确被砍之物。
- source_word: ἐκκόπτουσιν
  choice: 他们就砍掉
  rationale: 现在时复数动词描述众人照话执行；加“就”使命令与执行的衔接符合现代汉语，但仍不补出原文省略的宾语。
- source_word: φυτεῦσαι
  choice: 栽种
  rationale: φυτεύω 的不定过去时不定式，与 ἐκκόψαι 平行；“栽种”兼具自然与庄重，且不限定具体所栽之物。
- source_word: φυτεύουσιν
  choice: 他们就栽种
  rationale: 现在时复数动词与 ἐκκόπτουσιν 平行，表现听命而行；译文保留宾语未明说的特点。
