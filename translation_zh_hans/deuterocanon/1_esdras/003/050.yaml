  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: zh_hans
  text: 许多人因女人[a]而灭亡、误入歧途，并犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妻子”。希腊语 γυναῖκες 可按语境指“女人”或“妻子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: 丧亡
  rationale: 此处表示走向毁灭或败亡。“丧亡”简洁庄重，保留原文的严重程度，又不额外指定施动者。
- source_word: ἐσφάλησαν
  choice: 跌倒
  rationale: σφάλλω 的被动形式可指失足、跌倒或误入歧途。在这一道德语境中，“跌倒”既保留原词的形象，也可自然表达道德上的失足，避免把因果方向具体化为“被引入歧途”。
- source_word: ἡμάρτοσαν
  choice: 犯罪
  rationale: 在道德和宗教语境中，ἁμαρτάνω 通常表示犯罪；此译法保留原文明确的道德分量。
- source_word: διὰ τὰς γυναῖκας
  choice: 因女人
  rationale: διά 加宾格在此表示原因。γυναῖκες 可指“女人”或“妻子”；正文采用范围较宽、较不限定语境的“女人”，并以脚注保留另一可能。
theological_decisions:
- issue: γυναῖκες 可能构成对女性的笼统负面表述
  choice: 女人
  alternative: 妻子
  rationale: 希腊语复数 γυναῖκες 在词义上可兼指“女人”和“妻子”，本句本身不足以把所指限定为配偶。正文保留较宽泛的原文措辞，不加以淡化或缩窄；脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个并列动词依照希腊语次序呈现；“跌倒”保留原词的形象及道德失足的含义。
