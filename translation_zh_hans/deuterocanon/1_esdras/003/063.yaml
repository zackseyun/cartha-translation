  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: zh_hans
  text: 在她那里，既不看情面[a]，也不区别对待；她行公义，远离一切不义和邪恶的事[b]；众人都赞许她所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看情面”直译为“接纳面孔”，是指偏袒、徇私。
    reason: lexical_alternative
  - marker: b
    text: 或译：“远离一切不义和邪恶的人。”希腊语既可指不义邪恶的事，也可指不义邪恶的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: 在她那里
  rationale: 表达某种情形在这位被拟人化为女性的主体那里并不存在，保留关系性和拟人手法，不过度限定为空间意义。
- source_word: λαμβάνειν πρόσωπα
  choice: 看情面
  rationale: 这是字面为“接纳面孔”的惯用语，实际指因人而异、偏袒某人；“看情面”自然易懂，并适合与下句并列。
- source_word: διαφορά
  choice: 区别对待
  rationale: 本词可指差别或区分；在否定偏袒的伦理语境中，“区别对待”比单说“差别”更清楚，同时不加入具体的歧视类别。
- source_word: τὰ δίκαια ποιεῖ
  choice: 她行公义
  rationale: 中性复数形容词实体化，指公正、正义之事；“行公义”简洁庄重，保留行为层面的含义。
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: 远离一切不义和邪恶的事
  rationale: ἀπό表达分离；带冠词的复数形容词可指不义邪恶的事，也可能指不义邪恶的人。正文依照与“行公义”的对照采用事物性理解，同时用脚注保留另一可能。
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: 都赞许她所做的
  rationale: εὐδοκέω在此表示赞同、认可或以之为美；“赞许”兼具认可和满意之意，“她所做的”自然传达ἔργοις。
theological_decisions:
- issue: 女性拟人化主体
  choice: 以“她”承接上下文中被拟人化的女性主体
  alternative: 改用“它”，或在本节明确补出“真理”或“智慧”
  rationale: 希腊文以阴性代词及相关形式承接前文主体。保留“她”可维持原文的拟人修辞；本节本身没有重述主体名称，因此不擅自判定应补作“真理”还是“智慧”。
- issue: 不义和邪恶所指的是事还是人
  choice: 正文译作“不义和邪恶的事”
  alternative: 译作“不义和邪恶的人”
  rationale: 希腊文带冠词的复数形容词在形式上容许两种理解。与前面的“公义之事”形成行为层面的对照，较支持事物性理解；脚注保留人物性解释，以免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“看情面”传达惯用语含义；“行公义”保持经文语体但仍易懂；标点将三个并列分句清楚分开。
