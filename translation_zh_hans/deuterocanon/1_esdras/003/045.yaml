base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/045.yaml
  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: zh_hans
  text: 由此你们应当知道，女人[a]统治你们。难道你们不是辛苦劳碌，把一切都交给女人、带给女人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妻子”。希腊语γυναῖκες可指“女人”或“妻子”；本句作泛称，正文译为“女人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: 由此
  rationale: 承接上文的例证，表示从这些事得出认识；“由此”既保留指示意味，也不过度改写成单纯的逻辑连接词。
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: 你们应当知道
  rationale: δεῖ表达必要性，和不定式γνῶναι合译为自然庄重的现代汉语；“应当”保留论证中的必然要求，同时避免生硬。
- source_word: αἱ γυναῖκες
  choice: 女人
  rationale: γυναῖκες在这里是泛称复数，通常指女人；上下文虽可能涉及妻子或伴侣，本句措辞本身并未限定为妻子。
- source_word: κυριεύουσιν ὑμῶν
  choice: 辖制你们
  rationale: κυριεύω带有行使主权、支配之意；“辖制”保留原文强烈的支配意味和演说语气。
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: 辛苦劳碌
  rationale: 两个近义动词叠用，强调艰苦劳动；“辛苦劳碌”在现代汉语中自然，并保留修辞上的累加强调。
- source_word: πάντα
  choice: 一切
  rationale: 保留原文涵盖全部的概括力度，且符合汉语表达。
- source_word: δίδοτε καὶ φέρετε
  choice: 都给女人，又带到她们那里
  rationale: 分别译出“给”和“带来／带去”两个动作，不将原文的动词并列压缩为一个动作；补出“那里”使φέρετε在汉语中完整自然。
theological_decisions:
- issue: γυναῖκες是泛指“女人”还是特指“妻子”
  choice: 正文译作“女人”
  alternative: 妻子
  rationale: 希腊语复数本身可依语境指女人或妻子，但本句提出普遍性主张，未用其他成分将范围限定为婚姻关系，因此正文保留较宽泛的含义。
translation_notes:
  register: 采用现代、庄重而易懂的演说语体。保留反问句和两个劳动动词、两个给予／搬运动词的累加结构；不添加原文没有的性别评价或神学解释。
