review_pass:
  verdict: revise
  source_fidelity: 译文基本准确地保留了“杀／被杀”、不违背王命、得胜后将所得带给王等主要内容。不过“却”把原文连续的καί（“并且”）处理成对比，加入了原文未明示的转折；“被人杀”也增添了被动式中未出现的施事者。末句应以较清楚的并列方式保留希腊文“所抢掠的”与“其他一切”的累加范围。
  naturalness: 整体为自然、庄重的现代汉语。“他们杀人，也被杀”既自然又避免补出施事者。“把一切……都带给王”顺畅；用破折号标明末句的说明性并列，可避免“包括……以及……”搭配略显生硬。
  terminology: “王的命令”“违背”“得胜”“带给”“抢掠”均适切。此处没有需要固定为特定宗派术语的词。
  issues:
  - severity: medium
    issue: “却不违背”将原文的连接关系译成转折。
    rationale: 原文为καὶ……οὐ，直陈士兵杀人与被杀、仍不违抗王命，并没有明确的对立连词。应译作“也不违背”以避免附加解释。
  - severity: low
    issue: “被人杀”补出了施事者。
    rationale: φονεύονται是被动式，只说“被杀”；虽语境中施事者可以推知，但中文可不补出“人”，从而更贴近原文。
  - severity: low
    issue: 脚注a的替代译法“遭杀戮”不够精确，且不是理解正文所必需。
    rationale: 原文单数动词的被动义是“被杀”，并非特指遭受一场“杀戮”。删除该非必要脚注可避免语义扩大。
