  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: zh_hans
  text: 他们杀人，也被杀，也不违背王的命令；他们若得胜，就把一切——他们所抢掠的和其他一切——都带给王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: 他们杀人，也被人杀
  rationale: 保留希腊文主动与被动的对称结构；军事语境中“杀人”自然直接，而“互相残杀”会增添原文未明说的相互性。
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: 王的命令
  rationale: λόγος 字面可作“话”，但与 παραβαίνω 连用时在此指王所下的命令；中文“王的话”虽可理解，却不如“王的命令”准确自然。
- source_word: οὐ παραβαίνουσιν
  choice: 不违背
  rationale: 表达不越过、不违反王命的意思，同时保留原文较正式的语气。
- source_word: νικήσωσιν
  choice: 得胜
  rationale: 准确表达在战事中获胜，语体庄重而仍为现代汉语常用表达。
- source_word: κομίζουσιν
  choice: 带给
  rationale: 宽泛保留将所得之物送到王那里之意，不额外限定为“运回”或正式“献交”。
- source_word: προνομεύσωσιν
  choice: 抢掠来的
  rationale: 该动词指战争中掠取战利品；此处以关系性表达接续前面的“一切”，使中文通顺。
- source_word: τὰ ἄλλα πάντα
  choice: 其他所有东西
  rationale: 保留 ἄλλα 的“其他”与 πάντα 的全面涵盖；不把它并入“抢掠来的”而抹去并列成分。
