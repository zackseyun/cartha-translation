revisions:
- from: 他们杀人，也被人杀[a]，却不违背王的命令；他们若得胜，就把一切都带给王，包括他们抢掠来的，以及其他所有东西。
  to: 他们杀人，也被杀，也不违背王的命令；他们若得胜，就把一切——他们所抢掠的和其他一切——都带给王。
  rationale: 将“却”改为“也”，如实反映原文的并列陈述；将“被人杀”收为“被杀”，不补出原文未说的施事者。末句以“他们所抢掠的和其他一切”保留καὶ ἐὰν προνομεύσωσιν, καὶ τὰ ἄλλα πάντα所呈现的累加、略显粗粝的表达，而不把“其他一切”限定为掠物。删除不够精确且非必要的脚注。
