translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。三个盗取动词依次译为“偷窃、抢夺、潜入人家行窃”，保留并列与语义差别；不把 θεωρεῖ 的语境目的确定为“提防”，以保存原文歧义。所有脚注标记均已置于正文相应位置。
