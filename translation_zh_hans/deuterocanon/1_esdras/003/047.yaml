  yaml_path: translation/deuterocanon/1_esdras/003/047.yaml
  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: zh_hans
  text: 他注视着狮子[a]，在黑暗中行走；每当他偷窃、抢夺、潜入人家行窃[b]，就把所得的带给他所爱的女人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“观看狮子”。希腊文动词可指专注地观看或观察；这里没有明说他是在观望、提防，还是单纯注视。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文是一个罕见动词，特指暗中潜入偷窃，尤其可指入室盗窃。
    reason: lexical_clarification
  - marker: c
    text: 或译“他的爱人”。希腊文指恋爱意义上所爱的女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: 注视着
  rationale: 该词表示专注地观看、观察；“注视着”保留其有意而持续观看的意味，又不把原文未明说的目的具体化为“提防”。
- source_word: τὸν λέοντα
  choice: 狮子
  rationale: 希腊文使用定冠词；现代汉语通常无需以“那只”机械对应，直译为“狮子”既自然，也保留鲜明意象。
- source_word: ἐν σκότει βαδίζει
  choice: 在黑暗中行走
  rationale: 直接保留“黑暗”与“行走”的原文意象，语言庄重且清楚。
- source_word: κλέψῃ
  choice: 偷窃
  rationale: 概括性地表达秘密取走他人财物，与后面两个更具体或更强烈的盗取动作形成递进并列。
- source_word: ἁρπάσῃ
  choice: 抢夺
  rationale: 该词含强行攫取、夺走之意；“抢夺”比“抢走”稍庄重，也不限定规模。
- source_word: κλωποδυτήσῃ
  choice: 潜入人家行窃
  rationale: 这个罕见动词特指暗中潜入、尤其入室盗窃；此译明确呈现其区别于一般偷窃的具体含义。
- source_word: τῇ ἐρωμένῃ
  choice: 他所爱的女人
  rationale: 阴性分词指恋爱意义上的女性爱人；此译明确性别与情爱关系，同时避免“情妇”等可能附加婚外关系判断的词。
- source_word: ἀποφέρει
  choice: 把所得的带给
  rationale: 动词表示带去、送到某人那里；宾语在希腊文中省略，依据前文盗取行为补出“所得的”，使现代汉语通顺，并以措辞表明这是语境补足。
