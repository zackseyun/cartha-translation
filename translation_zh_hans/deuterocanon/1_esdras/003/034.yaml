  yaml_path: translation/deuterocanon/1_esdras/003/034.yaml
  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: zh_hans
  text: 他们却在他周围守卫，谁也不能离开去做自己的事，也不违抗他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν κύκλῳ περὶ αὐτόν
  choice: 在他周围守卫
  rationale: τηρέω 在此结合环绕君王的语境，表示守候、护卫；“在他周围守卫”既保留 κύκλῳ περὶ αὐτόν 的空间意象，也符合现代汉语表达。
- source_word: ἕκαστος
  choice: 谁也
  rationale: 希腊文在否定能力结构中逐一指向每个人；汉语用“谁也不能”自然传达“每一个人都不能”的全称否定。
- source_word: ἀπελθεῖν καὶ ποιεῖν τὰ ἔργα αὐτοῦ
  choice: 离开去做自己的事
  rationale: 保留两个不定式所表达的连续行动，并将 τὰ ἔργα αὐτοῦ 译为自然且不加解释的“自己的事”。
- source_word: οὐδὲ παρακούουσιν αὐτοῦ
  choice: 也不违抗他
  rationale: παρακούω 可指不听从、拒绝服从；此处描述臣属对王的服从，“违抗”准确传达其关系含义。
