lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: 第三个人
  rationale: δέ在此承接并推进叙事，汉语不必机械译出；补出“个人”可使序数称谓自然清楚，并未改变所指。
- source_word: ὁ εἴπας
  choice: 就是那谈论……的
  rationale: 带冠词的简单过去时分词用于按先前所说的话识别此人；“就是那……的”在现代汉语中自然地保留其指认作用。
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: 谈论女人和真理
  rationale: περί加属格表示“关于、谈论”；“女人”和“真理”保留为两个并列主题。
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: 他是所罗巴伯
  rationale: 按希腊文现在时直译为“是”，以插入语明确第三人的身份；中文叙事中使用现在时作身份说明也自然。
- source_word: Ζοροβαβέλ
  choice: 所罗巴伯
  rationale: 采用现代中文圣经读者较熟悉的人名形式；脚注说明希腊文音形，以免掩盖源文本证据。
- source_word: ἤρξατο λαλεῖν
  choice: 开始发言
  rationale: 准确表达ἄρχομαι加不定式的起始意义；上下文是正式陈说或竞答，“发言”比泛泛的“说话”更自然。
