  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: zh_hans
  text: 它使众人的心都富足；它既不记得君王，也不记得波斯总督；它还使一切都借着塔连得说话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔连得”是当时的一种重量和货币单位。末句也可意译为“它还使人人开口谈钱”。希腊文直译是“它使一切都借着塔连得说话”；其中“一切”也可能在语境中泛指所有人。
    reason: 说明古代货币单位，并保留 πάντα（“一切／人人”）及 διὰ ταλάντων 的不寻常表达和歧义。
lexical_decisions:
- source_word: πάσας καρδίας
  choice: 众人的心
  rationale: 保留“心”作为人的内在生命与意念的比喻；“众人的心”在现代汉语中比逐字译作“每一颗心”更自然。
- source_word: ποιεῖ πλουσίας
  choice: 使……都富足
  rationale: 贴近希腊文“使……富有”的简单结构，并保留本节与金钱相关的意象。
- source_word: οὐ μέμνηται
  choice: 既不记得……也不记得
  rationale: 保留动词“记得、放在心上”的字面形象，不径直解释为“不尊重”或“不顾忌”。
- source_word: βασιλέα οὐδὲ σατράπην
  choice: 君王……总督
  rationale: “君王”符合庄重语体；“总督”以普通读者能够理解的历史行政称谓表达波斯的 σατράπης。
- source_word: πάντα
  choice: 一切
  rationale: 该词形式上是中性复数，可指“一切”或泛指所有人；正文保留其形式上的宽泛与拟人张力，不擅自限定为“人人”。
- source_word: διὰ ταλάντων
  choice: 借着塔连得
  rationale: 保留 διά 的媒介表达及 τάλαντον 这一重量和货币单位，避免在正文中直接释义为泛称的“钱”。
- source_word: λαλεῖν
  choice: 说话
  rationale: 直接表达普通的“说、讲话”，并与“一切”形成原文所有意保留的拟人化说法。
