  yaml_path: translation/deuterocanon/1_esdras/003/012.yaml
  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: zh_hans
  text: 第三个人写道[a]：“女人更强，但真理胜过一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第三个人写道：‘女人占优势，但真理战胜一切。’”
    reason: Ὑπερισχύουσιν 可译为“占优势”，νικᾷ 可译为“战胜”；此译更直接呈现两个动词的动态含义。
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 第三个人
  rationale: 定冠词加序数词在此作名词用，指参加比赛的第三名侍卫；译作“第三个人”在现代汉语中清楚自然。
- source_word: ἔγραψεν
  choice: 写道
  rationale: γρά​φω 的简单过去时，直接表示“写”；“写道”适合引出所写的内容。
- source_word: Ὑπερισχύουσιν
  choice: 更强
  rationale: 该动词表示力量更大、占优势或胜过。译作“更强”既简洁，也避免与后文 νικᾷ 的“胜过”完全合并。
- source_word: αἱ γυναῖκες
  choice: 女人
  rationale: γυναῖκες 可指女人或妻子；这里是概括性的命题，并不限于已婚女性，因此译作“女人”。
- source_word: ὑπὲρ δὲ πάντα
  choice: 但……胜过一切
  rationale: ὑπὲρ 与宾格可表达超越、胜过；πάντα 指一切事物。汉语把它与谓语合译为“但真理胜过一切”，自然地保留递进转折。
- source_word: νικᾷ
  choice: 胜过
  rationale: νικάω 表示战胜、克服、取胜；以“真理”为主语时，“胜过”既自然又保留征服性的语义。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 此处指具有普遍性的真理。现代汉语抽象名词不需另译希腊语冠词，译作“真理”最符合格言语体。
theological_decisions:
- issue: ἡ ἀλήθεια 是否应理解为特指的“那真理”
  choice: 真理
  alternative: 那真理；真实
  rationale: 上下文是普遍性的格言，并未明确指向某一特定命题或神学称号；译作“真理”可保留其普遍性，而不加入原文没有明说的特指解释。
- issue: ὑπὲρ δὲ πάντα νικᾷ 的句法表达
  choice: 但真理胜过一切
  alternative: 但最重要的是，真理必胜；但真理在万物之上得胜
  rationale: 将 ὑπὲρ πάντα 理解为 νικᾷ 所涉及的范围或对象，译为“胜过一切”，既贴近希腊语，也保留“真理”战胜万有的张力；不把它弱化为仅表示重要性的“最重要的是”。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“第三个人”明确其为参赛者；“女人更强”与“真理胜过一切”形成递进对照。脚注标记已置于正文“写道”之后。
