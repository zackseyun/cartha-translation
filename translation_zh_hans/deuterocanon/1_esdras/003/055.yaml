  text: O men, how are women not strong, since they do such things?
translation:
  language: zh_hans
  text: 诸位男子，女人既然做这样的事，怎么会不强大呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: 诸位男子
  rationale: 保留呼语及明确的男性指称；“诸位”比直译“哦，男人们”更符合现代汉语庄重而自然的表达。
- source_word: πῶς οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: 女人……怎么能说她们不强大呢？
  rationale: 将希腊文反问自然地转化为汉语反问，同时保留ἰσχυραί的宽泛含义“强大”，不擅自限定为体力、权势或影响力。
- source_word: ὅτι οὕτως πράσσουσιν
  choice: 既然能做这样的事
  rationale: 此处ὅτι说明反问的根据，译作“既然”；οὕτως πράσσουσιν指前文所述行为，译作“做这样的事”。“能”顺应汉语语势，表达其实际展现出的能力。
