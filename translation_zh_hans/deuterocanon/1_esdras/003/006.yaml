translation:
  language: zh_hans
  text: 又可以穿上紫衣，用金器饮酒，睡在黄金上[a]，拥有一辆配金辔[b]的马车、一顶细麻布头巾和一条挂在颈上的项链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡在黄金上”原文表达简略，可能是指睡在饰金的床或榻上；正文保留原文未明说家具的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“金辔马车”。此复合词可能指配有金制马衔、缰辔或相关挽具的车。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: 穿上紫袍
  rationale: πορφύρα可指紫色衣料，并可转指以此制成的衣服；结合“穿上”，译作“紫袍”自然明确，也保留其尊贵奢华的色彩。
- source_word: ἐν χρυσώμασιν πίνειν
  choice: 从金器中饮酒
  rationale: χρυσώματα泛指金制物件，在饮用语境中当指金制器皿，但原文未明确限定为杯；“金器”避免过度具体化。
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: 在金子上安睡
  rationale: 原文表达简略，字面为“在金子上睡”；可能指饰金的床榻，但正文保留其压缩而夸张的表达，不擅自补出“床”。
- source_word: ἅρμα χρυσοχάλινον
  choice: 一辆配金辔的战车
  rationale: 复合形容词χρυσοχάλινος表示带有金制马衔或缰辔；“配金辔”简洁地呈现战车装备的奢华。
- source_word: κίδαριν βυσσίνην
  choice: 一顶细麻布头巾
  rationale: κίδαρις指包头巾或头饰，βύσσινος指优质细麻布；此译法准确且适合现代普通读者。
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: 一条戴在颈项上的项链
  rationale: μανιάκης指佩于颈部的链饰或环饰；“项链”自然易懂，而“戴在颈项上”保留原文位置短语。
