  yaml_path: translation/deuterocanon/1_esdras/003/043.yaml
  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: zh_hans
  text: 人离开养育自己的父亲[a]和自己的故乡，与自己的妻子紧紧结合，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”也可译作“撇下”或“离弃”。希腊语动词的语气可以更强；但本句很可能是说一个人离开父亲和故乡，转而与妻子结合。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处以单数泛指婚姻情境中的男子；汉语“人”在后文“妻子”的限定下自然指向男人，又保留格言式表达。
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: 自己的父亲
  rationale: “自己的”体现ἑαυτοῦ所带的反身和强调意味。
- source_word: ἐγκαταλείπει
  choice: 离开
  rationale: 该动词可有“撇弃、遗弃”的较强含义，但本句描述离开父亲和故乡、与妻子结合；“离开”避免无根据地加入道德谴责，同时以脚注保留较强译法。
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: 养育自己的
  rationale: ἐκτρέφω在此指父亲将他抚养成人；转换为前置定语，符合现代汉语语序。
- source_word: τὴν ἰδίαν χώραν
  choice: 自己的故乡
  rationale: χώρα可指地方、土地或国土；在离开亲属与本土的语境中，“故乡”自然表达其所属之地，但不必限定为现代民族国家。
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: 与自己的妻子
  rationale: γυνή可指女人或妻子；婚姻语境明确要求译作“妻子”。πρός与κολλᾶται合译为“与……结合”，符合汉语搭配。
- source_word: κολλᾶται
  choice: 紧紧结合
  rationale: 该词表达黏合、依附和牢固联结；“紧紧结合”保留关系亲密而牢固的力度，比单说“结合”更充分。
theological_decisions:
- issue: 婚姻格言中的泛指男性
  choice: 人
  alternative: 男人；一个人
  rationale: ἄνθρωπος本身可泛指人，但后接“自己的妻子”，使所述婚姻角色明确为男性。汉语“人”既忠实于词面，也不会消除上下文中的性别指向。
translation_notes:
  register: 采用现代、庄重而易懂的格言式汉语。保留原句末尾逗号，以反映这节在上下文中尚未完结。
