  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: zh_hans
  text: 但王比他们强盛，统治他们，作他们的主人；无论他对他们说什么，他们都必听从。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερισχύει
  choice: 胜过
  rationale: 表达力量或权势上占据优势，保留其与后续“统治”不同的语义层次。
- source_word: κυριεύει
  choice: 统治
  rationale: 自然表达对人行使权柄，同时区别于后面的 δεσπόζει。
- source_word: δεσπόζει
  choice: 作……的主人
  rationale: 保留“主人、主宰”的支配意味，也对应原文三个递进或并列的权势表述。
- source_word: ἐνακούσουσιν
  choice: 听从
  rationale: 此处不仅指听见，更指服从王所说或吩咐的事。
- source_word: πᾶν ὃ ἐὰν εἴπῃ
  choice: 无论……吩咐……什么
  rationale: 体现泛指条件结构；在君王与臣民的语境中，“吩咐”自然传达其话语所具有的命令性质。
