  text: And King Dareios made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia[b],
translation:
  language: zh_hans
  text: 大流士王为所有归他管辖的人[a]、他家中的所有人，以及米底亚和波斯的所有权贵，设下盛大的宴席，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他之下的人”，指归他管辖或受他权柄管辖的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχὴν
  choice: 宴席
  rationale: 该词指设宴款待或正式筵席；“宴席”自然、庄重，也符合王室场景。
- source_word: τοῖς ὑπʼ αὐτόν
  choice: 臣服于他的人
  rationale: 原文直指“在他之下的人”，含有等级与统属关系；“臣服于他的人”保留这一层次，又不把所指过度限定为某种法定臣民。
- source_word: οἰκογενέσιν
  choice: 家中的人
  rationale: 该词涵盖同属一家的成员，可能包括家属与仆役；“家中的人”比单说“家人”范围更宽。
- source_word: μεγιστᾶσιν
  choice: 权贵
  rationale: 该词指居高位、有权势的显要人物；“权贵”在现代汉语中简洁自然，并能表达其地位。
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: 米底亚和波斯
  rationale: 希腊文所指是两个地域，而非两个族群，因此按地域名称翻译。
- source_word: βασιλεὺς Δαρεῖος
  choice: 大流士王
  rationale: 采用现代中文中通行且易于辨认的圣经历史人名“大流士”，并按自然汉语语序表达王号。
