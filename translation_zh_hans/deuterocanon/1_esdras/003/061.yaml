base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: zh_hans
  text: 酒是不义的，王是不义的，女人是不义的，世人[a]全都是不义的；他们一切的行为，以及所有这类事，都是不义的。其中没有真理；他们必在自己的不义中灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的众子”，是指世人的习语。
    reason: cultural_note
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: 不义的
  rationale: 以同一表达贯穿酒、王、女人、世人、行为和事物，并与后文ἀδικίᾳ“不义”保持词根与概念上的呼应；“不义”也比“邪恶”更贴近缺乏公正、正直的语义。
- source_word: οἶνος
  choice: 酒
  rationale: 直接表达作为论证对象并被拟人化的酒。
- source_word: ὁ βασιλεύς
  choice: 王
  rationale: 保留定冠词所指的代表性单数；现代汉语在这种概括式陈述中用“王”比“那个王”自然，也不误指某一特定君王。
- source_word: γυναῖκες
  choice: 女人
  rationale: 上下文没有把所指限定为已婚妇女，因此不用“妻子”。
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: 世人
  rationale: 这是指全人类的希腊语习语；“世人”在现代中文中简洁自然，并以脚注说明原文的字面形象。
- source_word: ἔργα
  choice: 行为
  rationale: 在道德论述中，“行为”比“工作”更自然，涵盖人所行的一切。
- source_word: πάντα τὰ τοιαῦτα
  choice: 这一类事
  rationale: 保留τοιαῦτα的类别性含义，即“诸如此类的事”，而不把它仅仅处理为指示性的“这些事”。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 直接保留“真理／真实”的宽广含义及其与“不义”的对照，不缩窄为个人品格上的“诚实”。
- source_word: ἀδικίᾳ
  choice: 不义
  rationale: 与本节反复出现的ἄδικος形成清楚的词汇呼应。
- source_word: ἀπολοῦνται
  choice: 必……灭亡
  rationale: 准确表达将来时的“他们将灭亡”，且不额外指定使其灭亡的外在施事者。
theological_decisions:
- issue: 性别化的人类称谓
  choice: 世人，并以脚注注明原文字面为“人的众子”
  alternative: 人的众子／人类
  rationale: 该短语是指全人类的习语。正文采用自然、易懂的现代汉语，同时用脚注保存原文明确的男性复数意象，避免让读者误以为只指男性。
- issue: “他们”所指范围
  choice: 保留可回指前述诸项的复数表达
  alternative: 明确限定为世人
  rationale: ἐν αὐτοῖς在语法上可回指前述复数集合或相关诸项；不在译文中擅自把范围缩窄为人类，以保留原文的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。通过连续重复“不义的”保留原文强烈的排比；后半句继续使用“不义”，再现ἄδικος与ἀδικία的词汇呼应。正文仅设一个确有需要的脚注，标记[a]已出现在正文中。
