  text: and to all the satraps and generals and governors under him[a], from India to Ethiopia, in the one hundred twenty-seven satrapies.
translation:
  language: zh_hans
  text: 又给他辖下、从印度直到埃塞俄比亚的一百二十七个总督辖区[a]中的所有总督、将领和地方长官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总督辖区”原文采用波斯行政用语，指由总督管辖的行政区；也可译作“行省”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: 总督
  rationale: 这是波斯帝国的行政官衔，指辖区的最高长官；现代汉语用“总督”既简明自然，也能体现其高于地方长官的层级。
- source_word: στρατηγοῖς
  choice: 将领
  rationale: 该词通常指军事统帅；“将领”符合现代汉语表达，并保留其军事职能。
- source_word: τοπάρχαις
  choice: 地方长官
  rationale: 该词指地方或地区的统治者；“地方长官”比音译官衔更易懂，又能与“总督”有所区分。
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: 他手下
  rationale: 表示这些官员处于王的权下；“他手下”自然、简洁地传达从属关系。
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: 从印度直到埃塞俄比亚
  rationale: 保留原文表示帝国疆域范围的地理公式；“直到”准确表达 μέχρι 所强调的界限。
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: 遍布一百二十七个行省
  rationale: σατραπεία 指总督管辖的行政区。汉语“行省”清楚表达行政辖区；“遍布”顺畅地说明这些官员分布于各行省。
