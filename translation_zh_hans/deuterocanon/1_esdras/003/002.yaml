  naturalness: “又传给他手下所有的……”在本节孤立呈现时宾语缺失；虽然可承接上文，仍不如“又给……”自然。“就是从……遍布……的人”句法生硬，也不符合庄重叙事文体。
  terminology: “总督、将领、地方长官”可分别对应 σατράπαις、στρατηγοῖς、τοπάρχαις。“总督辖区”比“行省”更直接保留 σατραπεία 与“总督”的词汇关联；脚注说明可译“行省”，兼顾可读性与历史行政色彩。
  issues:
