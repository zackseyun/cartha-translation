  text: And the second began to speak[a], the one who had spoken about the strength of the king,
translation:
  language: zh_hans
  text: 于是，第二个人，就是那位谈论王的力量[a]的人，开始发言：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”也可译作“权势”或“威力”。希腊语ἰσχύς可表达力量、威力或权势。
    reason: 保留ἰσχύς在此处的词义范围，避免把王的体力与统治权势之间的可能张力单一化。
lexical_decisions:
- source_word: ἤρξατο…λαλεῖν
  choice: 开始发言
  rationale: 该结构表示开始说话；“开始发言”自然地体现公开陈述的语境。
- source_word: ὁ δεύτερος
  choice: 第二个人
  rationale: 带冠词的序数词指参与者中的第二位；补出“个人”符合现代汉语表达，又不额外限定其身份。
- source_word: ὁ εἴπας
  choice: 就是那位……的人
  rationale: 冠词化的过去时分词回指先前已经陈述过论点的第二位参与者；这一结构在汉语中清楚自然。
- source_word: περὶ τῆς ἰσχύος
  choice: 谈论……的力量
  rationale: περί加属格表示话题；ἰσχύς在此可指力量、威力或权势，正文采用直接而宽泛的“力量”。
- source_word: τοῦ βασιλέως
  choice: 王的
  rationale: βασιλεύς在宫廷叙事中明确指“王”，无需泛化为“统治者”。
