base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: zh_hans
  text: 全地都呼求真理[a]，天也称颂她；万物都震动战栗，而在她那里毫无不义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求真理”也可译作“呼唤真理”或“称扬真理”；原文动词在这里可表示向拟人化的真理呼告，或对她欢呼称颂。
    reason: lexical_alternative
  - marker: b
    text: 末句原文直作“与他（或它）同在”，所用代词为阳性或中性，与前文指真理的阴性形式不一致；正文按上下文译作“在她那里”。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: 全地
  rationale: γῆ 可指“地”或“土地”；这里与“天”相对，具有宇宙性的范围，因此译作“全地”。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: ἀλήθεια 在上下文中被拟人化；“真理”既保留其抽象含义，也适合承载拟人表达。
- source_word: καλεῖ
  choice: 呼求
  rationale: καλέω 带直接宾语的结构可理解为呼唤、求告或称扬。正文采用“呼求”，保留向拟人化真理发出呼声的意味，同时以脚注注明歧义。
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: 天也称颂她
  rationale: εὐλογεῖ 字面可译“祝福”，也可指称颂、赞美；在天对真理作出回应的语境中，“称颂”更自然。女性代词 αὐτήν 用“她”保留拟人手法。
- source_word: πάντα τὰ ἔργα
  choice: 一切造物
  rationale: ἔργα 字面为“作品、作为”；在天地并举的宇宙性语境中，较可能泛指受造之物。“一切造物”在现代汉语中清楚自然，但不排除“所有作为”的可能。
- source_word: σείεται καὶ τρέμει
  choice: 震动战兢
  rationale: 两个现在时动词形成加强语势的并列；“震动战兢”保留其鲜明而庄重的表达。
- source_word: μετʼ αὐτοῦ
  choice: 在她那里
  rationale: 传世希腊文本用阳性或中性属格代词 αὐτοῦ，与此前阴性的“真理”不一致。正文按语意承接拟人化的真理，并用脚注透明说明语法异常。
- source_word: ἄδικον οὐδέν
  choice: 毫无不义
  rationale: ἄδικον 指不公、不义之事；“毫无不义”简洁庄重，也贴近原文。
theological_decisions:
- issue: 真理的拟人化
  choice: 以“她”指代真理
  alternative: 采用非人格化的“它”或省略代词
  rationale: 原文 αὐτήν 明确使用阴性代词承接阴性名词 ἀλήθεια，并让天地对真理作出回应；“她”能在中文中清楚保留这一文学拟人，不将其进一步解释为特定神学位格。
- issue: 末句代词的性别不一致
  choice: 正文按语意译作“在她那里”，脚注注明原文形式
  alternative: 直译为“在他/它那里”，或不加说明地校正为阴性
  rationale: μετʼ αὐτοῦ 的形式确为阳性或中性，但上下文最自然的所指仍是真理。正文维持连贯语意，脚注则保留传世文本的真实张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“呼求”“称颂”“战兢”“不义”保留经文语体的力度；以“她”延续真理的拟人化。脚注标记均置于相关正文处：词义歧义标在“真理”后，代词异常标在末句后。
