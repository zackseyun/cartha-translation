  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
translation:
  language: zh_hans
  text: 他们对他们说：“向我们讲述所写的内容[a]。”于是，第一个人，就是先前论及酒的力量[b]的那位，开始这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向我们讲述那些写成的文字”。希腊语可统指已经写成、提交评议的文字材料；原文未说明是谁写的。
    reason: lexical_alternative
  - marker: b
    text: 或译“酒的威力”或“酒的能力”。此词可指力量、能力或威力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατε
  choice: 讲给我们听
  rationale: 该复数命令式表示报告、宣告；在要求参赛者陈述其书面论点的场景中，“讲给我们听”自然清楚，也保留正式陈述的意味。
- source_word: περὶ τῶν γεγραμμένων
  choice: 所写的内容
  rationale: 中性复数完成时被动分词指已经写成的事项或文字；此译保留结果状态和未明说作者的被动含义，不额外限定为谁所写。
- source_word: ἤρξατο
  choice: 开始
  rationale: 直接对应ἄρχομαι，符合现代汉语叙事表达。
- source_word: ὁ πρῶτος
  choice: 第一个人
  rationale: 将名词化的序数词自然译出，指三位发言者中的第一位。
- source_word: ὁ εἴπας
  choice: 就是那位……的人
  rationale: 以同位说明重现希腊语分词结构，标明此人先前提出的论题。
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: 论酒之力量
  rationale: ἰσχύς可指力量、强度或威力；“力量”保留其宽泛语义及论题式表达，不把它缩窄为酒精浓度。
- source_word: ἔφη οὕτως
  choice: 这样说
  rationale: 自然对应引出下文直接引语的固定表达，并明确保留οὕτως“这样、如下”的指向。
