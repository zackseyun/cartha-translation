  yaml_path: translation/deuterocanon/1_esdras/003/003.yaml
  text: And they ate and drank[a], and when they were filled, they departed. But Darius the king went into his bedchamber and slept[b], and then awoke.
translation:
  language: zh_hans
  text: 他们吃喝，饱足[a]以后便散去[b]。大流士王则退入寝室，睡了，随后醒来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吃饱喝足”。希腊语ἐμπλησθέντες具体指吃喝之后已经饱足。
    reason: lexical_alternative
  - marker: b
    text: 或译“离席而去”。这里的ἀνέλυσαν指聚会的人在席后离开；下一句用同一动词的单数形式叙述王退入寝室。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: 吃喝
  rationale: 两个简单过去时动词并列，直述席间的进食与饮酒；汉语用“吃喝”简洁自然，不增添“宴饮”等原文未明说的喜庆色彩。
- source_word: ἐμπλησθέντες
  choice: 饱足以后
  rationale: 该分词具体表示吃喝之后已经饱足，并带有先于“散去”的时间关系；“饱足以后”兼顾形象与叙事次序。
- source_word: ἀνέλυσαν
  choice: 散去
  rationale: 此处指聚集的人用餐后离席而去；“散去”比字面化的译法自然，也符合复数主语所呈现的场景。
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: 退入寝室
  rationale: 同一动词转用于王，表示他离席进入睡房；“退入”保留与前句“散去”之间的词语呼应，又符合王室叙事语境。
- source_word: κοιτῶνα
  choice: 寝室
  rationale: 该词指供睡眠的房间；“寝室”庄重而仍为现代读者易懂，比“卧房”略能保持王室语体。
- source_word: ἐκοιμήθη
  choice: 睡了
  rationale: 在进入寝室之后，该动词自然表示睡去或睡了一段时间；简译“睡了”不额外规定是“躺下”还是“入睡”。
- source_word: ἔξυπνος ἐγένετο
  choice: 随后醒来
  rationale: 原意为“成为醒着的”，在叙事中即“醒来”；“随后”顺畅表达动作次序。
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεύς
  choice: 大流士王则
  rationale: δέ在这里从众人转到大流士个人，是轻微转折或话题转换；“则”比“但”更准确地避免夸大对立。
