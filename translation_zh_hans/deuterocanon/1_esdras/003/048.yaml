  text: And a man loves his own wife more than his father and mother.
translation:
  language: zh_hans
  text: 并且，男人爱自己的妻子，胜过爱父亲和母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον ... μᾶλλον ἢ
  choice: 胜过
  rationale: 原文以叠加强调的比较表达说明爱的程度更深；现代汉语用“胜过”自然、凝练地保留比较意义，而不理解为完全排斥后者。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 直接对应“爱”的常用意义，简洁自然，不增添“珍爱”等原文未明确表达的感情色彩。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 该词本身可泛指人；本句随后以“自己的妻子”限定具体情境。译作“人”既贴近词义，也符合现代汉语的一般陈述方式。
- source_word: τὴν ἰδίαν γυναῖκα
  choice: 自己的妻子
  rationale: γυνή在父母与婚姻关系的对照中明确指“妻子”，ἰδίαν的所属和强调意味由“自己的”保留。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父亲和母亲
  rationale: 逐项保留原文的“父亲”和“母亲”，不概括为“父母”；所属关系由句意自然显明。
