  yaml_path: translation/deuterocanon/1_esdras/003/033.yaml
  text: and all his people and his forces obey him[a]. Besides this, he himself reclines and eats and drinks and sleeps[b];
translation:
  language: zh_hans
  text: 他所有的百姓和军队都听从他[a]。此外，他本人斜倚在席上，吃喝睡觉[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”或译“兵力”；希腊语δυνάμεις在君王语境中可指军事力量。
    reason: lexical_alternative
  - marker: b
    text: “斜倚在席上”也可译作“躺卧”或“歇息”；因下文提到“吃喝”，这里很可能指当时用餐时斜倚的姿势。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: 他的全体百姓
  rationale: λαός通常指人民或民众；“百姓”在君王语境中自然庄重，又不把其政治身份过度限定为“臣民”。
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: 他的军队
  rationale: δυνάμεις在君王语境中最自然地指军事力量；现代汉语以“军队”表达清楚，同时脚注保留“兵力”的宽泛可能。
- source_word: ἐνακούουσιν
  choice: 都听从他
  rationale: 该词虽与“听”有关，此处表达听命、服从权威；“听从”兼顾词源色彩和语境含义。
- source_word: πρὸς δὲ τούτοις
  choice: 此外
  rationale: 此短语引入另一项论据；“此外”简洁自然地保留其递加作用。
- source_word: ἀνάκειται
  choice: 斜倚席上
  rationale: ἀνάκειμαι可泛指躺卧或歇息，也常指宴席上斜倚而坐；紧接着的“吃喝”支持席间姿势这一理解，但以脚注保留较宽泛的可能。
- source_word: ἐσθίει καὶ πίνει καὶ καθεύδει
  choice: 吃喝睡觉
  rationale: 三个现在时动词依次描述日常行为；汉语用紧凑的并列结构，流畅地再现其连续列举。
