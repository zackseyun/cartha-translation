  yaml_path: translation/deuterocanon/1_esdras/003/039.yaml
  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
translation:
  language: zh_hans
  text: 他们是由她们而生的[a]；这些妇女[b]养育了正是那些栽植葡萄园的人，酒从这些葡萄园中产出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们是从她们而来的。”希腊文更直译为“他们从她们而产生／成为”，措辞本身较“出生”宽泛。
    reason: lexical_alternative
  - marker: b
    text: 希腊文的阴性指示代词特指“这些妇女”，不只是泛指“这些”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν ἐγένοντο
  choice: 他们也都是由她们而生的
  rationale: ἐξ加属格表示来源，ἐγένοντο在此可指“产生、出生”。中文用“由她们而生”自然表达上下文中男人源于女人的意思；脚注保留较宽泛的直译可能。
- source_word: αὗται
  choice: 这些妇女
  rationale: 阴性复数指示代词在上下文中特指妇女。明确补出“妇女”，可保持论证对象及其修辞重点。
- source_word: ἐξέθρεψαν
  choice: 养育了
  rationale: 该动词兼有喂养和抚育成人之意；“养育”在现代中文中自然涵盖两者。
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: 正是那些栽种……的人
  rationale: 代词与带冠词分词并用带有强调色彩；“正是那些……的人”传达这种修辞强调，同时不额外限定其性别。
- source_word: τοὺς ἀμπελῶνας
  choice: 葡萄园
  rationale: ἀμπελών的标准、自然对应词。
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: 酒就是从这些葡萄园而来的
  rationale: 保留ἐξ所表达的来源和γίνεται较宽泛的“产生、形成”含义，避免将过程具体化为某一种酿造表述。
theological_decisions:
- issue: 阴性指示代词αὗται的所指及修辞作用
  choice: 正文明确译作“这些妇女”
  alternative: 只译作“这些”或“她们”
  rationale: 本句论证妇女的力量和先在性；明确其阴性所指可保留希腊文的论证逻辑，又不引入宗派性解释。
- issue: ἐγένοντο在来源语境中的具体程度
  choice: 正文按语境译作“由她们而生”，并以脚注说明更宽泛的直译
  alternative: 译作“由她们而有”或“从她们而来”
  rationale: 语境明显涉及人的出生与养育，但γίνομαι本身语义较宽；正文求自然，脚注则保存原文措辞的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现两个紧密相连的论断；用“正是”保留原句代词加分词结构的强调作用。
