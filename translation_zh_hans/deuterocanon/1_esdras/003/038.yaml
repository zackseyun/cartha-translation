  yaml_path: translation/deuterocanon/1_esdras/003/038.yaml
  text: Women gave birth to the king and to all the people who rule over sea and land;
translation:
  language: zh_hans
  text: 妇女生下了君王，也生下了所有统管海洋和陆地的人民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ γυναῖκες
  choice: 妇女
  rationale: 保留复数泛指，符合本段论述妇女力量的语境。
- source_word: ἐγέννησαν
  choice: 生下了
  rationale: 直接表达生育之意，并使同一动词自然地同时支配“君王”和“人民”。
- source_word: τὸν βασιλέα
  choice: 君王
  rationale: 准确对应带定冠词的单数 βασιλεύς，在庄重而现代的汉语中自然。
- source_word: πάντα τὸν λαὸν
  choice: 所有……的人民
  rationale: 将集合性单数 λαός 译作“人民”，πάντα 表达为“所有”，不改成逐一性的“每一个人”。
- source_word: κυριεύει
  choice: 统管
  rationale: 体现 κυριεύω 的掌权、治理含义；其单数形式与集合名词“人民”相应。
- source_word: τῆς θαλάσσης καὶ τῆς γῆς
  choice: 海洋和陆地
  rationale: 保留两个带定冠词名词所指的整体领域；中文无需重复定冠词。
theological_decisions:
- issue: 关系从句的先行词与数的一致
  choice: 理解为修饰集合名词“人民”：‘统管……的人民’
  alternative: 将单数动词理解为仅指君王，或按意义改译为复数的‘那些统治者’
  rationale: 希腊文关系代词 ὃς 与动词 κυριεύει 均为单数，可与集合性单数 λαός 配合；按紧邻关系修饰“人民”最自然，同时保留集合主语在形式上的单数。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“也生下了”补出汉语并列结构所需成分，不增加原文命题；句末用句号，使单节中文可独立成句。
