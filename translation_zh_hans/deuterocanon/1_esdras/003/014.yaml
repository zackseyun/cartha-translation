  yaml_path: translation/deuterocanon/1_esdras/003/014.yaml
  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
translation:
  language: zh_hans
  text: 于是，他派遣之后，召集了波斯和米底亚所有的权贵[a]，以及总督、将领、地方长官和高级官员[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他派出之后，召集了……”。希腊文没有明说所派出的是什么；在语境中可能指使者或命令。
    reason: lexical_alternative
  - marker: b
    text: 这里依次列出波斯帝国体系中的多种官职；“地方长官”和“高级官员”也可较形式化地译作“辖区统治者”和“最高官员”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: 派人
  rationale: 这是先于主句动词的过去时分词，字面为“派出”。上下文没有明说所派的是使者还是命令；“派人召集”自然表达行动次序，同时不具体增添使者身份。
- source_word: ἐκάλεσεν
  choice: 召集了
  rationale: 在君王向官员发令的语境中，“召集”比一般的“叫来”庄重，也不像“邀请”那样削弱命令意味。
- source_word: μεγιστᾶνας
  choice: 权贵
  rationale: 指国中地位显赫、有权势的人；“权贵”简洁自然，并保留其精英阶层意味。
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: 波斯和米底亚
  rationale: 采用这两个古代地区名称的通行汉译。
- source_word: σατράπας
  choice: 总督
  rationale: 指波斯帝国辖区的高级行政长官；“总督”是现代中文中清楚而常见的历史职衔译法。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 该词通常指军事统帅；“将领”比限定具体军阶的“将军”更稳妥。
- source_word: τοπάρχας
  choice: 地方长官
  rationale: 指治理某一地区的人；功能性翻译比生僻音译更便于普通读者理解。
- source_word: ὑπάτους
  choice: 高级官员
  rationale: 此词可表示地位最高者，也可在罗马语境中指“执政官”。这里列举的是波斯帝国官职，因此用较宽泛的“高级官员”，避免误引特定的罗马制度。
