  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: zh_hans
  text: “让我们每个人都说一句能胜出的话[a]；谁的陈述显得比另一个人的更有智慧，大流士王就要赐给他丰厚的礼物和重大的胜利荣誉[b]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句能胜出的话”也可译作“一番将占优势的论说”或“一个将胜出的说法”；希腊语 λόγος 在这里可指话语、陈述或论说。
    reason: lexical_alternative
  - marker: b
    text: “胜利荣誉”所译的希腊语 ἐπινίκια，指因获胜而颁给的荣誉或奖赏，与前面的“礼物”用词不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: 我们每个人都来说
  rationale: 以“来”表达第一人称复数劝勉虚拟式的提议语气，并保留ἕκαστος ἡμῶν逐一分配的意味。
- source_word: ἕνα λόγον
  choice: 一句……的话
  rationale: λόγος在此可指一句话、陈述或论说；“一句话”既自然，也保留ἕνα所强调的单一发言。
- source_word: ὃς ὑπερισχύσει
  choice: 能胜过其他人的
  rationale: ὑπερισχύω意为占优势、胜过；结合竞赛语境补出比较对象，使现代汉语意思完整而不把它缩窄为单纯“获胜”。
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ
  choice: 谁的话显得
  rationale: 不定关系结构译为“谁……”，φανῇ译作“显得”，保留经比较而被看出或认定的语气。
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: 比别人的更有智慧
  rationale: 保留σοφώτερον的比较级及τοῦ ἑτέρου的比较对象；“别人的”在多人竞赛的汉语语境中自然。
- source_word: δωρεὰς μεγάλας
  choice: 丰厚的礼物
  rationale: δωρεά指赠礼；μεγάλας在奖赏语境中用“丰厚”比字面“大”更自然。
- source_word: ἐπινίκια μεγάλα
  choice: 隆重的凯旋奖赏
  rationale: ἐπινίκια指因胜利而给予的奖赏或荣誉；“凯旋奖赏”保留胜利含义，并与前面的物质赠礼有所区分。
