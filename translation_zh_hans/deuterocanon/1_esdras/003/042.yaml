  yaml_path: translation/deuterocanon/1_esdras/003/042.yaml
  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: zh_hans
  text: 他们撇下这一切，看她看得目瞪口呆，又张着嘴注视她；所有人都宁可选择她，也不选择金银和一切美好的东西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: 撇下
  rationale: 此处表示把先前提到的一切搁在一旁或舍下；“撇下”既保留分词所表达的伴随动作，也符合现代汉语表达。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 中性复数回指上文所说的各种事物；“这一切”简洁自然，并保留其概括性。
- source_word: εἰς αὐτὴν κέχηναν
  choice: 看她看得目瞪口呆
  rationale: κέχηναν描写因惊叹或迷恋而张口发愣的状态，εἰς αὐτήν表明这一反应朝向她；此译在自然汉语中保留了强烈的身体反应。
- source_word: χάσκοντες τὸ στόμα
  choice: 又张着嘴
  rationale: 原文紧接前句再次明确描写张嘴，形成刻意而生动的重复；译文用“又”保留这种强化。
- source_word: θεωροῦσιν αὐτήν
  choice: 注视她
  rationale: θεωρέω在此不是随意一看，而是持续观看；“注视”符合上下文中被吸引而凝望的语气。
- source_word: αἱρετίζουσιν
  choice: 选择
  rationale: 该动词可表示选择，也可在比较结构中带有偏爱之意；正文采用较直接的“选择”，不把词义过度限定为主观评价。
- source_word: μᾶλλον ἢ
  choice: 胜过
  rationale: 此比较结构表达选择她而不选后列事物；“胜过”保留比较关系，同时与“选择”搭配自然。
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: 一切美好的东西
  rationale: πρᾶγμα含义宽泛，ὡραῖον表示美好、美丽或悦人；此译不擅自把范围缩小为财物。
