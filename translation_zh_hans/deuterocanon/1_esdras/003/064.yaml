  naturalness: “她的判断中没有任何不公”比“她的判断毫无不公”更完整自然。“威严”是现代庄重汉语中对μεγαλειότης更常用、清晰的对应语。修订后的第二句既保留颂赞体，也避免生硬的属格堆叠。
  terminology: 保留“国度、权柄”和“当受称颂”，分别对应βασίλειον、ἐξουσία和εὐλογητός。以“威严”译μεγαλειότης。保留“真理的上帝”的属格结构，不改作“真实的上帝”。“直到万世”在此将“所有世代”的延续性以自然汉语表达，脚注保留字面译法。
