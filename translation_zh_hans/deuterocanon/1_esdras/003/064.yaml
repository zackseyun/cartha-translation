base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: zh_hans
  text: 她的判断中没有任何不公[a]。力量、国度、权柄和威严都归于她，直到万世[b]。真理的上帝是当受称颂的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的判断中没有任何不公。”若不将“真理”人格化，可用“它”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“所有世代（时代）的”；也可意译为“直到永永远远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: 判断
  rationale: 保留司法性和裁断之意，又适合将“真理”人格化的语境；不径直译成较抽象的“公义”。
- source_word: αὐτῆς
  choice: 她的
  rationale: 其先行词是阴性名词ἀλήθεια（真理），上下文又将真理人格化，因此用“她”保留原文的文学表现；脚注说明也可理解为非人格化的“它”。
- source_word: ἄδικον
  choice: 不公
  rationale: 与“判断”自然搭配，表达其中没有任何不公正之处，并保留司法语义。
- source_word: ἰσχύς
  choice: 力量
  rationale: 直译其力量、强力之义，并与后面的统治性词语构成庄重的并列。
- source_word: βασίλειον
  choice: 国度
  rationale: 此处指王权或王国；“国度”简洁地保留原文名词形式，同时不将其过度解释为抽象的主权。
- source_word: ἐξουσία
  choice: 权柄
  rationale: 强调合法的权力和支配权，区别于单纯的力量；在庄重宗教语体中自然。
- source_word: μεγαλειότης
  choice: 威荣
  rationale: 表达宏伟、尊荣和威严，适合颂赞语境，也比单用“伟大”更贴近原文的崇高语气。
- source_word: τῶν πάντων αἰώνων
  choice: 万世的
  rationale: 紧贴“所有世代／时代”的原文表达；正文采用自然简练的“万世”，脚注保留其字面意义及惯用译法。
- source_word: εὐλογητός
  choice: 是当受称颂的
  rationale: 作为颂赞谓语，译为“当受称颂”比现代汉语中的“有福”更准确，也保留祝颂语气。
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: 真理的上帝
  rationale: 保留原文属格结构，不改写成“真实的上帝”，以免改变句法关系和可能的意义。
theological_decisions:
- issue: 真理的阴性人格化
  choice: 正文采用“她的判断”
  alternative: 采用非人格化的“它的判断”
  rationale: 希腊文以阴性代词回指ἀλήθεια，且上下文将真理人格化。“她”保留这一文学与神学张力，脚注同时交代现代汉语可作非人格化理解。
- issue: 颂赞语中αἰώνων的表达
  choice: 译作“万世的”
  alternative: 译作“直到永永远远”或“永恒的”
  rationale: “万世”较自然地保留复数“诸世代／诸时代”的形式，避免直接把原文化约为传统的永恒公式。
- issue: 力量、国度、权柄和威荣的归属
  choice: 按原文保留“这就是……”的指示性陈述
  alternative: 明确补出“这一切都属于真理”
  rationale: 原文αὕτη的确切所指带有一定张力；不补明所有关系，可避免将上下文中的“真理”与这些属性的关系解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“她”有意保留希腊文对“真理”的人格化；“权柄”“威荣”“当受称颂”维持颂赞语体，但避免过度古雅。所有脚注标记均已置于正文。
