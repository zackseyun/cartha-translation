  register: 采用现代、清楚而庄重的叙述语体。“宴乐和欢喜”保留原文中宴饮活动与喜悦心情的并列；后半句重复“不再记得”，使两个宾语的结构清楚，并保留原文对愁苦与债务的并列强调。
