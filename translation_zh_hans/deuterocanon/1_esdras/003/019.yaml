  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: zh_hans
  text: 它使每个人的心思都转向宴饮和欢喜，[a]人便不记得任何愁苦和任何债务。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “每个人的心思”或译“每一个念头”。
    reason: lexical_alternative
  - marker: b
    text: “任何债务”也可理解为“任何所欠之物”或“任何义务”。希腊语ὀφείλημα字面意思是“所欠之物、债务”，语义也可能延伸至一般义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: 每个人的心思
  rationale: διάνοια可指心思、思想或意念；结合πᾶσαν的概括性用法，译作“每个人的心思”自然地表达酒对人的普遍影响，同时不把它缩窄为某一个念头。
- source_word: μεταστρέφει
  choice: 使……转向
  rationale: 该动词表示转变或转向；“使……转向”保留原文方向性的比喻，也不夸大为彻底改造。
- source_word: εἰς εὐωχίαν
  choice: 转向宴乐
  rationale: εὐωχία指宴饮、欢宴及其乐趣；“宴乐”兼顾宴席和欢乐，比单译“享乐”更具体，也避免“狂欢”的负面色彩。
- source_word: καὶ εὐφροσύνην
  choice: 和欢喜
  rationale: εὐφροσύνη表示喜乐、愉快；“欢喜”是现代汉语中自然而庄重的对应词，并与“宴乐”构成既相关又有区别的并列。
- source_word: οὐ μέμνηται
  choice: 人就不再记得
  rationale: 希腊文使用单数动词而主语承接概括性陈述；汉语以泛指的“人”表达最自然。“不再记得”在语境中传达饮酒后暂时忘却的结果。
- source_word: πᾶσαν λύπην
  choice: 任何愁苦
  rationale: λύπη涵盖忧愁、悲伤和痛苦；“愁苦”较宽广，适合此处所说被忘却的情绪负担。πᾶσαν在否定句中自然译为“任何”。
- source_word: πᾶν ὀφείλημα
  choice: 任何债务
  rationale: ὀφείλημα直指所欠之物或债务，也可能泛指应尽的义务；正文采用直接、具体的“债务”，较宽的语义范围置于脚注说明。
theological_decisions: []
