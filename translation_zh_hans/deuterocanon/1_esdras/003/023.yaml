  text: Men[a], does not wine prevail, since it compels one to act this way? And he became silent after saying this.
translation:
  language: zh_hans
  text: “诸位男士，酒岂不是占了上风吗？因为它迫使人这样做。”他说完这话，就不再作声了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: 诸位
  rationale: 这是对在场男性听众的直接称呼；汉语“诸位”自然、庄重，也不必生硬地重复性别信息。
- source_word: οὐχ ὑπερισχύει
  choice: 岂不是占了上风吗
  rationale: ὑπερισχύει表示力量更强、胜过或占优势；“占了上风”保留修辞问句及酒具有支配力的论旨。
- source_word: ὁ οἶνος
  choice: 酒
  rationale: 直接对应οἶνος；此处泛指酒及其作用。
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: 因为它竟迫使人做出这样的事
  rationale: ἀναγκάζει强调强迫，ποιεῖν语义宽泛；补出泛指的“人”符合汉语表达，“这样的事”回指上文所述行为。
- source_word: καὶ ἐσίγησεν
  choice: 就不再作声了
  rationale: 不定过去时叙事动词表示讲话终止；“不再作声”自然呈现由说话转入沉默。
- source_word: οὕτως εἴπας
  choice: 他说完这话
  rationale: 不定过去分词表示先于主句发生的动作；该译法清楚保留“说完之后沉默”的时间关系。
