  text: The other wrote, “The king is stronger.”
translation:
  language: zh_hans
  text: 另一个写道：“王更强大[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王占上风。”
    reason: ὑπερισχύει既可强调力量更强，也可表示胜过、占优势；脚注保留其动态含义。
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: 另一个
  rationale: 带冠词的ἕτερος指已提到的人中与前一位相对的另一位；“另一个”简洁自然，也不把顺序明确限定为“第二个”。
- source_word: ἔγραψεν
  choice: 写道
  rationale: γράϕω的不定过去时在这里表示写下文字；“写道”自然引出所写的内容，无须增添“铭刻”等更专门的含义。
- source_word: Ὑπερισχύει
  choice: 更强大
  rationale: ὑπερισχύω表达力量上的超越或占优势。这里是竞赛中的论题陈述，“更强大”保留比较意味，而不擅自把它强化为明确的最高级“最强大”。
- source_word: ὁ βασιλεύς
  choice: 王
  rationale: βασιλεύς通常指“王”；简体中文圣经文体中“王”准确、自然，也比宽泛的“统治者”更贴近原文。
