base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: zh_hans
  text: 又在我们主的殿中显露我们的灯光[a]，在我们受奴役的时候赐给我们食物；即使在我们受奴役时，我们也没有被撇弃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“显露我们的一盏灯”或“为我们显露一盏灯”。希腊文直译近于“揭开我们的灯／光”；“灯光”保留其具体发光之物及光明的意象。
    reason: 说明ἀνακαλύψαι与φωστῆρα ἡμῶν的字面意象，并标示属格可有的汉语表达。
  - marker: b
    text: 或译：“当我们服役时”。这里与上句“受奴役”采用同一希腊词族，分别为δουλεία和δουλεύειν。
    reason: 保留原文词族重复，并说明第二处可译为“服役”。
lexical_decisions:
- source_word: ἀνακαλύψαι
  choice: 显出
  rationale: 原义是揭开、使显露；与“灯”搭配时，“显出”在现代汉语中自然，也保留使原被遮蔽之物显现的意象，避免直接解释为“恢复”。
- source_word: φωστῆρα
  choice: 一盏灯
  rationale: 此词可指发光体或灯；殿宇语境中译作具体的“一盏灯”自然，并保留光明重现的比喻。
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: 在我们主的殿中
  rationale: οἶκος直译为“家、房屋”，但在“主的殿”这一固定圣殿语境中，中文“殿”既保留神之居所的表达，也清楚指向圣殿。
- source_word: τροφὴν
  choice: 食物
  rationale: 该词指食物或滋养；“食物”具体、清楚，不把经文抽象化为“供应”。
- source_word: δουλείας / δουλεύειν
  choice: 受奴役／受奴役
  rationale: 同一词族在相邻两句中反复出现，译文相应重复，以保留原文强调的受支配状态；“受奴役”比“服事”更符合此处外族辖制的语境。
- source_word: ἐγκατελείφθημεν
  choice: 没有被撇弃
  rationale: 该动词意为离弃、抛弃；“撇弃”庄重而通顺，并保留上帝没有离弃其民的圣经语感。
theological_decisions:
- issue: δουλεία／δουλεύειν所表达的受辖制状态
  choice: 受奴役／受奴役
  alternative: 服役／服事；被奴役／作奴隶
  rationale: 原文以名词和动词重复同一词族，重点在百姓处于受外权辖制的境况。中文采用同一措辞重复，既不淡化其严厉程度，也不额外界定具体法律身份。
- issue: οἶκος τοῦ κυρίου是否在正文中明确为圣殿
  choice: 我们主的殿
  alternative: 我们主的家；我们主的殿宇
  rationale: 所指确为圣殿。现代汉语圣经语境中“主的殿”自然且明确，同时没有增添原文之外的宗派性解释。
- issue: “灯”的意象是否解释为复兴或盼望
  choice: 保留“一盏灯”的具体意象
  alternative: 一道光；复兴之光
  rationale: 原文没有明说灯所象征的具体内容，因此正文不把它限定为政治复兴、敬拜恢复或某一种神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号保留两组施恩内容与“不被撇弃”的转折关系；重复“受奴役”以再现希腊文词族呼应。
