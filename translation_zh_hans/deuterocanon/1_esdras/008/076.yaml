  to: 又在我们主的殿中显露我们的灯光[a]，在我们受奴役的时候赐给我们食物；即使在我们受奴役时，我们也没有被撇弃[b]。
  rationale: 修订仅为更直接对应希腊文φωστῆρα ἡμῶν的“我们的灯／光”，并将末句调为较贴近ἐν τῷ δουλεύειν的时间性表达；其余措辞、术语和庄重现代的语体均予保留。
