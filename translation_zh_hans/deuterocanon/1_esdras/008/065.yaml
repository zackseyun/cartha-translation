  yaml_path: translation/deuterocanon/1_esdras/008/065.yaml
  text: And when these things had been completed, the leaders came to me, saying,
translation:
  language: zh_hans
  text: 这些事办完以后，首领们来到我这里，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: 这些事办完以后
  rationale: 这是属格独立结构，表示先于主句发生并已完成的行动。“办完以后”符合现代汉语表达，也保留 τελέω 所含的完成之意。
- source_word: προσηλθόσαν μοι
  choice: 来到我这里
  rationale: προσέρχομαι 在此表示来到或走近某人；结合与格 μοι，译作“来到我这里”自然清楚。
- source_word: οἱ ἡγούμενοι
  choice: 首领们
  rationale: 该词指居于领导地位的人，但上下文没有在本节明确限定具体官职。“首领们”既体现其权威身份，也避免过度具体化。
- source_word: λέγοντες
  choice: 说
  rationale: 现在分词引出下一节的直接引语。汉语以“说：”自然承接后文，同时保留句子尚未完结的结构。
