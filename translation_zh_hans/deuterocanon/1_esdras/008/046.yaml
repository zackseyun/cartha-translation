base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
translation:
  language: zh_hans
  text: 又吩咐他们去同洛代奥斯[a]、他的弟兄以及那地方的司库商谈，请他们给我们派来[b]一些在我们主[d]的殿中担任祭司的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“洛代奥斯”；《以斯拉记》8:17的希伯来文平行经文作“易多”。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“派来”；希伯来文平行经文作“带到我们这里”。
    reason: alternative_reading
  - marker: c
    text: 希腊文明确指“担任祭司的人”；希伯来文平行经文较笼统，作“服事的人”或“服务人员”。
    reason: lexical_alternative
  - marker: d
    text: 希腊文作“我们主”；希伯来文平行经文作“我们的上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: 又吩咐
  rationale: 原文为分词，承接上文叙事；中文用“又吩咐”自然表达连续动作，同时保留命令意味，避免在本节片段中生硬悬置。
- source_word: διαλεχθῆναι
  choice: 去同……商谈
  rationale: 该词可指交谈、商议；此处涉及请求派遣人员，“商谈”既符合语境，也不把含义强化为正式谈判。
- source_word: Λοδαίῳ
  choice: 洛代奥斯
  rationale: 依从希腊文音译，不与《以斯拉记》8:17希伯来文平行经文的“易多”强行协调。
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: 他的弟兄
  rationale: 保留ἀδελφοί通常的亲属称谓；上下文不足以确定应泛化为族人或同伴。
- source_word: γαζοφύλαξιν
  choice: 司库
  rationale: 简洁表达负责库房或财库的人员，符合行政职务语境。
- source_word: ἀποστεῖλαι ἡμῖν
  choice: 给我们派来
  rationale: 忠实表达ἀποστέλλω“差派、派遣”的方向性；不按希伯来文平行经文改成“带到我们这里”。
- source_word: τοὺς ἱερατεύσαντας
  choice: 一些……担任祭司的人
  rationale: ἱερατεύω明确指履行祭司职分；中文以“担任祭司”自然表达，且不弱化为笼统的“服事人员”。“一些”在中文中使不定指复数更自然，并不限定人数。
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: 在我们主的殿中
  rationale: 按圣殿语境将οἶκος译为“殿”，并依希腊文保留“我们主”，不与希伯来文平行经文的“我们的上帝”协调。
theological_decisions:
- issue: κύριος与希伯来文平行经文אֱלֹהֵינוּ的差异
  choice: 我们主
  alternative: 我们的上帝
  rationale: 本书以现存希腊文本为主要依据；κυρίου ἡμῶν直译为“我们主”。平行经文的不同读法列入脚注，不在正文中消除文本差异。
- issue: ἱερατεύω与希伯来文平行经文מְשָׁרְתִים范围不同
  choice: 担任祭司的人
  alternative: 服事的人／服务人员
  rationale: 希腊词明确带有祭司职分含义，正文应予保留；希伯来文平行经文的用词较宽泛，作为异文信息注明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿”明确圣殿语境；“司库”“担任祭司”兼顾准确与可读性。句首“又吩咐”体现该分词与上文的衔接，因此本节作为连续叙事片段理解。脚注标记依相关短语的正文顺序排列。
