base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: zh_hans
  text: 这位以斯拉从巴比伦上来，是一位精通摩西律法的文士[a]；这律法是以色列的上帝所赐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精通”所译的希腊词也可表示有天资、聪慧或熟练胜任。
    reason: 保留εὐφυής在天赋、悟性和实际能力之间的词义幅度。
lexical_decisions:
- source_word: ἀνέβη
  choice: 上来
  rationale: 保留前往耶路撒冷或以色列地常用的方向性表达；中文叙事中“从巴比伦上来”自然且贴近原文。
- source_word: γραμματεὺς
  choice: 经学家
  rationale: 此处指熟习圣典及律法的人，不只是抄写员或行政书记；“经学家”在现代中文中较准确地传达其身份。
- source_word: εὐφυὴς
  choice: 精通
  rationale: 该词可表示天资、悟性或熟练能力；结合ἐν τῷ…νόμῳ，译作“精通”自然表达他在摩西律法方面的才干与胜任。
- source_word: νόμῳ
  choice: 律法
  rationale: “摩西律法”是现代中文圣经语境中清楚而通行的表达，也保持该词在此处的法律与宗教训诲含义。
- source_word: ἐκδεδομένῳ
  choice: 赐下
  rationale: 表达律法由上帝交付、授予的被动意义；比“颁布”少带现代行政色彩，也比单纯“给”更庄重。
- source_word: θεοῦ τοῦ Ἰσραήλ
  choice: 以色列的上帝
  rationale: 直接保留原文对赐律法者的身份界定，中文自然明确。
theological_decisions:
- issue: 以斯拉的身份、才干与摩西律法之间的关系
  choice: 他是精通摩西律法的经学家
  alternative: 他是摩西律法方面一位才干出众的经学家
  rationale: 原文以γραμματεύς表明身份，以εὐφυής表明才干，并用ἐν加与格指出其才干所在的领域；所选译法保留这三层关系，同时不额外断言他受过何种正式训练。
- issue: 摩西律法的神圣来源
  choice: 这律法是以色列的上帝赐下的
  alternative: 这律法是由以色列的上帝交付的
  rationale: 保留被动分词的意义，并明确表达律法源自以色列的上帝，不进一步引入文本未说明的启示方式或传递过程。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“经学家”避免把γραμματεύς误解为一般抄写员；分号使人物行动与资格说明层次清楚。原文句末仍与后文衔接，中文以句号收束仅为当前单节呈现。
