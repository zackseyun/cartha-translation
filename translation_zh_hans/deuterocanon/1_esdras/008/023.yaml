base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: zh_hans
  text: 以斯拉，你要照着你上帝的智慧，委任审判官和司法官员，使他们在叙利亚和腓尼基全境[a]审判所有明白你上帝律法的人；至于不明白这律法的人，你要教导他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“叙利亚和腓尼基”；《以斯拉一书》此处采用这一地域表述，而希伯来文本的平行记载使用不同的行政区划用语。
    reason: 说明本节希腊文本的地域称谓与希伯来文本平行传统的行政用语不同。
lexical_decisions:
- source_word: κατὰ τὴν σοφίαν τοῦ θεοῦ
  choice: 照着你上帝所赐的智慧
  rationale: κατά表示行事所依据的准则；属格短语在语境中可自然理解为来自上帝的智慧。译文保留“你上帝”，又以“所赐的”使现代汉语表达清楚，但不把智慧等同于律法。
- source_word: ἀνάδειξον
  choice: 委任
  rationale: 这是命令式，指正式选立并授予职分。“委任”比“设立”更明确体现任命官员的行政行为。
- source_word: κριτὰς καὶ δικαστάς
  choice: 审判官和司法官员
  rationale: 两个近义司法称谓在原文中并列，不宜合并为一个职分。“审判官”对应κριταί，“司法官员”保留δικασταί较宽的司法行政色彩，同时避免强行规定两者精确的等级关系。
- source_word: ὅπως δικάζωσιν
  choice: 使他们……审判
  rationale: ὅπως引出目的，δικάζωσιν与前面的司法职分形成词义呼应。“使他们……审判”保留目的关系及司法语气。
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: 在叙利亚和腓尼基全境
  rationale: 直接保留希腊文本的两个地域名称；“全境”自然表达ὅλῃ所指的完整管辖范围。
- source_word: πάντας τοὺς ἐπισταμένους τὸν νόμον τοῦ θεοῦ σου
  choice: 所有明白你上帝律法的人
  rationale: ἐπίσταμαι在此指具备认识或通晓；“明白”比单纯“知道”更适合法律知识的语境，同时没有提升为专门精通。
- source_word: τοὺς μὴ ἐπισταμένους διδάξεις
  choice: 至于不明白这律法的人，你要教导他们
  rationale: 补出上文隐含的宾语“这律法”，使汉语指代清楚；将未来直陈式按诏令语体译作“你要”，保留命令效力。
theological_decisions:
- issue: 是否以《以斯拉记》的希伯来文本平行材料取代希腊文本的地域称谓
  choice: 正文保留“叙利亚和腓尼基”
  alternative: 按希伯来文本的行政区划用语作协调性翻译
  rationale: 本节的首要文本依据是希腊文，且希腊文明确写作Συρίᾳ καὶ Φοινίκῃ。平行传统不能取代本书现存希腊文本的实际措辞，因此不作和谐化处理。
- issue: “上帝的智慧”是否指上帝本身的智慧或上帝赐给以斯拉的智慧
  choice: 译作“你上帝所赐的智慧”
  alternative: 译作“你上帝的智慧”
  rationale: 在任命官员的命令语境中，这智慧是以斯拉行事所依据、从上帝而来的智慧。译出“所赐的”符合自然汉语和语境，但不进一步界定其获得方式或神学性质。
translation_notes:
  register: 采用现代、庄重的诏令语体。“以斯拉啊”体现直接称呼，“你要”传达命令效力。保留两个司法职称及“审判……人”的原文张力，不擅自改写为较宽泛的行政治理。脚注标记紧接地域称谓，明确对应注释内容。
