base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: zh_hans
  text: 亚斯达的子孙中，阿卡坦[a]的儿子约阿尼斯；与他同来的有一百一十人[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可能只是把“约阿尼斯、阿卡坦”两个名字并列，并没有明说“儿子”；但家族名录的语境较支持把后一个名字理解为父名。
    reason: alternative_reading
  - marker: b
    text: 《以斯拉记》8:10的希伯来文平行记载在家族和人名次序上与此处明显不同，人数也作一百六十名男子。本书以希腊文见证为翻译依据，因此正文保留希腊文的人名和人数。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ Ἀστάδ
  choice: 亚斯达的子孙中
  rationale: υἱοί在家族名录中指某人的后裔或宗族成员；加“中”使其与随后列出的带领者自然衔接。专名按主要希腊见证音译。
- source_word: Ἰωάνης
  choice: 约亚尼斯
  rationale: 依希腊形式音译，并采用现代中文较易辨读的形式；不以差异显著的希伯来平行经文替换。
- source_word: Ἀκατάν
  choice: 亚加坦
  rationale: 按希腊专名音译。上下文可能把它作为父名，正文据名录结构补出“的儿子”，同时用脚注保留两个名字并列的可能。
- source_word: μετʼ αὐτοῦ
  choice: 跟随他
  rationale: 直译为“与他同在”；在回归者名录中自然表示随同该领袖的人，且保留αὐτοῦ的单数所指。
- source_word: ἄνδρες ἑκατὸν δέκα
  choice: 一百一十人
  rationale: ἄνδρες在这里指同行的男子；现代中文名录用“人”计数最自然。人数严格保留希腊文本的一百一十。
