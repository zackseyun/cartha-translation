base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: zh_hans
  text: 因为阿普萨拉斯学识渊博[a]，以至于他对出于主的律法和诫命的一切，没有遗漏任何一项；他把律例和典章教导全以色列人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“阿普萨拉斯”。平行的希伯来文本背景对应以斯拉，但这里依照主要希腊见证保留其人名形式。
    reason: alternative_reading
  - marker: b
    text: 本节末尾的希腊文句法十分压缩；按词序大意为：“……不遗漏出于主的律法和诫命的任何事物，全以色列，律例和典章。”正文补出“教导”，表达一种可能的连贯理解。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: 阿普萨拉斯
  rationale: 按主要希腊见证音译该人名，不依平行希伯来语背景改作“以斯拉”。
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: 学识渊博
  rationale: ἐπιστήμη表示知识、理解或学问；此译自然凝练，并表达其具备深厚学识。
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: 以致……没有一样被他遗漏
  rationale: 保留该结构可表示目的或结果的弹性；παραλείπειν在此为遗漏、省略之意。
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: 主的律法和诫命中
  rationale: 译出两个ἐκ所表达的来源或范围关系，同时采用现代汉语较自然的合并结构。
- source_word: πάντα τὸν Ἰσραήλ
  choice: 全以色列人
  rationale: 准确表达整体性的以色列群体，在现代汉语中比“全以色列”用于受教对象更自然。
- source_word: δικαιώματα καὶ κρίματα
  choice: 律例和判例
  rationale: 两词均属法律语汇；“律例”表达成文规定，“判例”保留κρίματα与裁断、判决相关的语义，避免把两者合并为同义词。
theological_decisions:
- issue: 句末希腊文句法压缩，πάντα τὸν Ἰσραήλ与δικαιώματα καὶ κρίματα的关系不完全明晰
  choice: 将其理解为阿普萨拉斯把律例和判例教导全以色列人，并在正文中明确补出“教导”
  alternative: 不补动词，直译为“……没有遗漏……全以色列、律例和判例”
  rationale: 传世希腊文本句末语法突兀；补出“教导”能形成连贯语义，也符合人物精通并传授律法的上下文，但以脚注如实标明补足和歧义。
- issue: 目的与结果关系
  choice: 译作“以致”
  alternative: 译作“为要”或“因此能够”
  rationale: εἰς τό加不定式可表达目的或结果；“以致”在此顺应由渊博学识带来的结果，但不赋予额外教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名依希腊文本音译；法律词汇保持适度正式。“教导”为处理残缺压缩句法所作的最小显明补足，并由脚注说明。
