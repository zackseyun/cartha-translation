revisions:
- from: 因为阿普萨拉斯学识渊博[a]，以致主的律法和诫命中没有一样被他遗漏；他将律例和判例教导全以色列人[b]。
  to: 因为阿普萨拉斯学识渊博[a]，以至于他对出于主的律法和诫命的一切，没有遗漏任何一项；他把律例和典章教导全以色列人[b]。
  rationale: 修订仅校正法律术语“判例”为“典章”，并以“出于……的一切”更贴近两个ἐκ的来源关系。保留“以至于”所涵盖的目的／结果弹性，并保留经脚注说明的“教导”这一句法补足；不将希腊文人名协调为“以斯拉”。
