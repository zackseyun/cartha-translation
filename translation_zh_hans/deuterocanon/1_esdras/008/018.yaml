base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: zh_hans
  text: 此外，凡为你上帝的圣殿[a]所需而临时出现的其他事项，你都要从王室府库中供给。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行的亚兰文见证在为“你上帝的殿”服事的语境中使用“你上帝的殿”这一措辞；希腊文作“你上帝的圣殿”，也可译为“圣所”。
    reason: 说明主要希腊文本与近似的亚兰文平行见证在相关措辞上的差异，并保留ἱερόν的另一可能译法。
lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: 此外……还有什么
  rationale: 表达此前所列项目以外的其余需要；现代汉语用“此外……还有”比直译“其余的东西”更自然。
- source_word: ὅσα ἂν ὑποπίπτῃ σοι
  choice: 若还有什么需要
  rationale: ὑποπίπτῃ σοι表示临时出现、摆在受命者面前的事项，ἂν保留不确定和可能发生的语气；以“若还有什么”自然传达。
- source_word: εἰς τὴν χρείαν
  choice: 需要
  rationale: χρεία在此指圣殿实际所需，简洁译为“需要”，不擅自限定为物品或费用。
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: 你上帝的圣殿
  rationale: 以希腊文为首要依据；ἱερόν在此直接指圣殿或圣所建筑群。“圣殿”准确、自然，也符合行政供给语境。
- source_word: δώσεις
  choice: 你都要……供给
  rationale: 未来直陈式在王令中具有指令作用；“要”体现命令语气，“供给”与圣殿所需相配。
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: 从王室府库中
  rationale: γαζοφυλάκιον指储存财物的府库；“王室府库”保留正式的王家行政色彩。
theological_decisions:
- issue: τοῦ ἱεροῦ τοῦ θεοῦ σου应译为“你上帝的圣殿”还是“你上帝的殿”
  choice: 你上帝的圣殿
  alternative: 你上帝的殿
  rationale: 主要希腊文本明确使用ἱερόν，通常指圣殿或圣所范围，因此正文按希腊文译作“圣殿”。平行的亚兰文见证使用“你上帝的殿”，作为异文层面的措辞差异收入脚注，不用它取代主要文本。
translation_notes:
  register: 采用现代、庄重而清楚的王令语体。“此外……若还有什么需要”避免生硬照搬希腊语序；“你都要”保留命令力度。正文以希腊文为准，脚注交代平行亚兰文见证。
