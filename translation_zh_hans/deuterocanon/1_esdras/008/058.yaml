base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: zh_hans
  text: 我对他们说：“你们也是归主为圣的；器皿也是圣的；金银是献给主——我们列祖的主[b]——的许愿供物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许愿供物”：希腊文可指因许愿而献上的供物，也可泛指“供物”；希伯来语平行文本作“甘心献的供物”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“我们列祖的主”；希伯来语平行文本则作“你们列祖的神”。
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί / ἅγια
  choice: 归主为圣 / 是圣的
  rationale: ἅγιος表示分别归于神的神圣身份。用于人时译作“归主为圣”较自然，也显明与主的关系；用于器皿时保留简洁的“是圣的”，维持原文重复。
- source_word: τῷ κυρίῳ
  choice: 归主
  rationale: 与ἅγιοί连用的与格表达归属或奉献关系；“归主为圣”既符合现代汉语，也与希伯来语平行文本לַיהוָה相合。
- source_word: τὰ σκεύη
  choice: 这些器皿
  rationale: 在圣殿语境中指礼仪所用的器具；“器皿”保留传统祭祀语境中的明确含义。定冠词依汉语语境译为“这些”。
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: 这些金银
  rationale: 此处指作为奉献之物的银和金；汉语以“金银”表达自然简洁，且不误解为一般货币。
- source_word: εὐχή
  choice: 许愿祭
  rationale: 希腊语εὐχή首先可指“愿”或因许愿而献的礼物；在此奉献语境中译作“许愿祭”保留希腊文本的直接语义。希伯来语平行文本的“甘心祭”作为异文信息列入脚注，不以其取代主要希腊文本。
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: 他是我们列祖的主
  rationale: 严格保留希腊文本“我们列祖的主”，不从希伯来语平行文本补入“神”，也不把“我们”改成“你们”。为避免汉语中连续两个“主”生硬，以独立分句表达。
theological_decisions:
- issue: εὐχή与希伯来语平行文本נְדָבָה之间的差异
  choice: 正文译“许愿祭”
  alternative: 甘心祭；供物
  rationale: 本项目以所给希腊文本为主要锚点，因此正文保留εὐχή的许愿含义；脚注说明希伯来语平行文本作“甘心祭”，不暗中消解两种见证之间的张力。
- issue: 末尾神圣称号在希腊文与希伯来文平行文本中的差异
  choice: 我们列祖的主
  alternative: 主——你们列祖的神；主——我们列祖的神
  rationale: 希腊文明确作κυρίῳ τῶν πατέρων ἡμῶν，即“我们列祖的主”。希伯来语平行文本则有“你们列祖的神”。正文遵从主要希腊见证，脚注如实保留差异，不将二者合成一个未经任何单一见证支持的表述。
translation_notes:
  register: 采用现代、庄重而清楚的经文体。“归主为圣”显明奉献关系而不过度解释；“列祖”保留圣经历史语域，普通读者仍易理解。标点和分句按现代汉语调整，同时保留原文三重陈述的节奏。
