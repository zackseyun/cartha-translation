base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: zh_hans
  text: 好让他们查察犹太地和耶路撒冷[a]，以他所持有的主的律法为准[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查察”也可译作“巡视”“考察”或“调查”；希腊语动词可指正式的察看、访问或审查。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文较为压缩，直译近于“按照他所持有的主的律法”。以斯拉记7章的平行经文作“在你手中的律法”，意思可能是交托给你或由你掌管的律法。
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的，保留希腊语的目的语气，并采用自然的现代汉语表达。
- source_word: ἐπισκέψωνται
  choice: 他们查察
  rationale: 此动词在王室公文语境中可指正式察看、考察或调查；“查察”既保留公务性质，也不把含义限定为单纯探访。
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: 犹太和耶路撒冷
  rationale: 重复的κατά标明查察所涉及的地域或事务范围；汉语无需机械重复介词。Ἰουδαία译作通行地名“犹太”。
- source_word: ἀκολούθως
  choice: 以……为准
  rationale: 表达依照某一规范行事的意义，在此比直译“跟随地”自然，也清楚表明律法是查察的准则。
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: 他所持有的主的律法
  rationale: 希腊语措辞压缩且略显生硬；关系代词与“律法”呼应，ἔχει为第三人称单数，故保留“他所持有”而不直接采用希伯来平行经文的“在你手中”。
- source_word: Κυρίου
  choice: 主
  rationale: 在犹太经文语境中按七十士译本惯例译作“主”，不额外加入特定宗派解释。
theological_decisions:
- issue: Κυρίου在犹太经文语境中的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本仅作Κυρίου；“主”最直接对应原文，并避免在正文中反向重构希伯来神名。
- issue: 律法与持有者的关系
  choice: 他所持有的主的律法
  alternative: 在你手中的主的律法／主的律法所规定的
  rationale: 本节希腊文使用第三人称单数ἔχει，并没有“手”一词。正文据希腊文保留“持有”的关系，同时用脚注说明以斯拉记7章平行经文的第二人称“在你手中”，不将平行文本无标记地并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的公文叙述语体。“好让……”“以……为准”自然呈现目的与规范关系。正文严格以所给希腊文为锚，不把希伯来平行经文中的“你手中”直接补入正文；原文的压缩与平行文本差异通过脚注保留。
