  yaml_path: translation/deuterocanon/1_esdras/008/041.yaml
  text: 'From the sons of Banai: Outu son of Istakalkou, and with him seventy men.'
translation:
  language: zh_hans
  text: 巴拿伊的子孙中，有伊斯塔卡尔库的儿子乌图；与他同行的有七十名男子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναὶ
  choice: 巴拿伊的子孙中
  rationale: ἐκ 表示从某一宗族群体中而出；υἱοί 在家谱名单中宜译为“子孙”。Βαναί 按希腊文音译。
- source_word: Οὐτοῦ Ἰστακάλκου
  choice: 伊斯塔卡尔库的儿子乌图
  rationale: 希腊文为两个连续属格形式；依名单的惯常结构及英语校订层，将后名理解为父名，并用现代汉语明确表达从属关系。两名均以希腊文为主要依据音译。
- source_word: καὶ μετʼ αὐτοῦ ἄνδρες ἑβδομήκοντα
  choice: 与他同来的有七十人
  rationale: 自然表达“和他一起的七十名男子”；在迁返名单语境中，“同来的”准确传达同行含义，且“人”避免生硬重复性别信息。
theological_decisions: []
