base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: zh_hans
  text: 凡临到我们身上的这一切，都是因我们的恶行和大罪而发生的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡发生在我们身上的这一切，都是由于我们的恶行和大罪。”
    reason: 提供συμβαίνω及διά因果结构的另一种自然表达。
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα ἡμῖν
  choice: 凡临到我们身上的这一切
  rationale: συμβαίνω在此指发生或临到人的事；用“临到我们身上”自然表达ἡμῖν所标明的承受者，同时保留πάντα的全面范围。
- source_word: γίνεται
  choice: 发生
  rationale: γίνεται语义宽泛，此处承接前面的事件并连于其原因。译作“发生”清楚自然；虽与“临到”意义相近，但中文并不显累赘。
- source_word: διὰ
  choice: 因
  rationale: διά接宾格明确表示原因；“因”简洁而直接地保留因果关系。
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: 我们的恶行
  rationale: ἔργα指行为或所做之事，πονηρά表明其道德上的邪恶；“恶行”准确、凝练且符合现代中文。
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: 大罪
  rationale: μεγάλας直译为“大”，强调罪的严重或重大；“大罪”保留原文措辞，不改释为数量众多。
theological_decisions:
- issue: 群体遭遇与罪恶之间的因果归属
  choice: 明确译出这一切遭遇是因群体自身的恶行和大罪而发生
  alternative: 弱化为仅仅与恶行和罪有关，或将因果关系表达得较含蓄
  rationale: 希腊文διά接宾格明确标示原因。译文应保留认罪话语中的责任归属，但不据此扩展为本节未陈述的普遍苦难论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“凡……这一切”保留原文的总括语气；“临到我们身上”比单说“发生”更清楚地表现群体是事件的承受者。脚注标记已置于正文句末。
