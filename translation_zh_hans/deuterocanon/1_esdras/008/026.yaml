translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文的第三人称“他”；本节单独呈现时其所指需由上下文确定。句序略作汉语化调整，将“在……面前”置于谓语前，同时保留“众王—朋友—权贵”的原文次序。
