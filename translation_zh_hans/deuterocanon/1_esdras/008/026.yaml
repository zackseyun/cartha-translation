base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/026.yaml
  text: and he honored me before the kings and all his friends and nobles[a][b].
translation:
  language: zh_hans
  text: 他又使我在众王[a]和他所有的朋友[b]、权贵面前受到尊重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些作王的人”；希腊文用的是分词，并非普通名词“王”。
    reason: lexical_alternative
  - marker: b
    text: “朋友”在王室语境中也可指君王的亲信或廷臣，不一定只是私交亲密的朋友。
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίμησεν
  choice: 使我……受到尊重
  rationale: τιμάω表示给予尊荣或敬重。此处用使动式表达希腊语主动动词对“我”的施为，中文自然，也不把它过度解释为物质赏赐。
- source_word: ἔναντι
  choice: 在……面前
  rationale: ἔναντι在这里表示公开的场合或在场者，译为“在……面前”准确而自然。
- source_word: τῶν βασιλευόντων
  choice: 众王
  rationale: 该词是βασιλεύω的现在分词复数，字面意为“那些作王的”。正文采用简洁自然的“众王”，并以脚注保留分词形式的细微差别。
- source_word: φίλων
  choice: 朋友
  rationale: 保留φίλος的基本意义；王室语境下也可能指君王的亲信或廷臣，因此用脚注提示其宫廷含义。
- source_word: μεγιστάνων
  choice: 权贵
  rationale: μεγιστάνες指地位显赫、掌有权势的人。“权贵”比直译“伟人”更符合现代汉语，也不把其身份限定为某一具体官职。
