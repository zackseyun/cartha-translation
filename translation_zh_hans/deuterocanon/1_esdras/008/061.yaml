base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: zh_hans
  text: 他们在第一月十二日从特拉这地方启程[a]，借着我们主在我们身上所显的大能之手，到了耶路撒冷；他救我们免受一切仇敌的侵害[b]；他们到了耶路撒冷[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文称出发地为“特拉”；《以斯拉记》8:31的希伯来平行经文则作“亚哈瓦河”。本书正文以希腊文为准，故保留“特拉”。
    reason: alternative_reading
  - marker: b
    text: 这里的希腊文按字面近似“从每一个仇敌的接近／来临中救我们脱离”，语义和句法在上下文中都较难确定。希伯来平行经文作“脱离仇敌和路上的埋伏”，支持其所指为旅途中遭遇的敌害；正文因此作较宽泛的表达。
    reason: textual_variant
  - marker: c
    text: 希腊文末句作“他们到了耶路撒冷”，与前文“我们的主”“我们”所形成的叙事人称不完全协调；希伯来平行经文则用第一人称。正文按希腊文保留“他们”，也保留重复的到达句。
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: 启程
  rationale: 该分词表示拔营上路；“启程”自然简洁，并保留旅程开始的含义。
- source_word: τοῦ τόπου Θερὰ
  choice: 特拉这地方
  rationale: 希腊文本明确以Θερὰ为出发地名称；虽与《以斯拉记》8:31希伯来平行经文的“亚哈瓦河”不同，正文仍以希腊文为准，差异收入脚注。
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: 在一月十二日
  rationale: 直译历法表达；“一月”在此指第一月，并不必然等同现代公历一月。
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: 因我们的主大能的手扶助我们
  rationale: “手在我们身上”是表示神施展能力并眷顾的圣经惯用语；用“扶助”使现代汉语通顺，同时保留“大能的手”这一意象。
- source_word: ἐρύσατο
  choice: 救我们脱离
  rationale: 表达从实际危险中搭救，不额外引入更广泛的救恩含义。
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: 脱离了沿途遇到的一切仇敌
  rationale: 传世希腊语序和搭配较难理解；结合希伯来平行经文所说的路上仇敌与埋伏，此译表达旅途中蒙保护的语境意义，同时以脚注说明字面困难。
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: 我们到了耶路撒冷
  rationale: 希腊文末句动词为第三人称复数“他们到了”，但同句此前为第一人称“我们”；依叙事人称及希伯来平行经文译作“我们”，并在脚注保留异文现象。
theological_decisions:
- issue: κύριος作为对以色列之神的称呼
  choice: 主
  alternative: 主人
  rationale: 此处指神以大能保护旅人；“主”是庄重自然且符合圣经语境的称呼，不添加宗派性解释。
- issue: “大能的手”所表达的神人关系
  choice: 大能的手扶助我们
  alternative: 大能的手在我们身上
  rationale: 保留神主动施力和眷顾的意象，同时避免把希腊习语机械直译成不自然的现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“一月”沿用古代历法措辞；保留“主大能的手”这一圣经意象。正文没有消除原文重复的抵达句，并用脚注交代地名差异、困难短语及人称转换。
