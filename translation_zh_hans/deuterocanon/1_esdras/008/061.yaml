revisions:
- from: 我们在一月十二日从特拉这地方启程[a]，因我们的主大能的手扶助我们，便到了耶路撒冷。他救我们脱离了沿途遇到的一切仇敌[b]；我们到了耶路撒冷。[c]
  to: 他们在第一月十二日从特拉这地方启程[a]，借着我们主在我们身上所显的大能之手，到了耶路撒冷；他救我们免受一切仇敌的侵害[b]；他们到了耶路撒冷[c]。
  rationale: 修订以希腊文为首要依据：保留其两次第三人称复数的到达表述及末句重复，不以希伯来平行文本协调人称。对语义困难的“ἀπὸ τῆς εἰσόδου”避免译成明确的“沿途遇到”，改用不限定地点或方式的“免受……侵害”，并在脚注中呈现其字面歧义和希伯来平行文本所提供的语境。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:27Z'
