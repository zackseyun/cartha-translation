base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: zh_hans
  text: 从福罗斯的子孙中[a]，塔罗索托莫斯；从伊耶他玛的子孙中，迦米洛斯；从大卫的子孙中[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊人名与《以斯拉记》8:2的近似马所拉文本平行经文明显不同；后者作：“非尼哈的子孙中有革顺；以他玛的子孙中有但以理；大卫的子孙中有哈突。”由于《以斯得拉一书》以希腊文本为翻译依据，正文保留希腊形式，不按希伯来平行经文加以协调。
    reason: alternative_reading
  - marker: b
    text: “从大卫的子孙中”这一短语在本节末没有列出人名，因为希腊文的名单在下一节继续。
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: 从……的子孙中
  rationale: 这是家族名单中的惯用结构，既保留“从……中”的选取含义，也比直译为“从……的儿子们”更符合现代汉语谱系表达。
- source_word: Φορός
  choice: 福罗斯
  rationale: 按主要希腊文本音译，不以《以斯拉记》8:2的近似希伯来平行经文所载名字替换。
- source_word: Ταροσότομος
  choice: 塔罗索托莫斯
  rationale: 该名与马所拉文本平行经文差异明显，因此依希腊文本保留音译，不默默协调为希伯来传统中的名字。
- source_word: Ἰεταμάρου
  choice: 伊耶他玛
  rationale: 依希腊形式音译，同时采用适合汉语读者辨读的写法；此名对应广为人知的祭司家族名以他玛，但正文仍贴近本处希腊拼写。
- source_word: Γάμηλος
  choice: 迦米洛斯
  rationale: 依希腊文本音译；虽然近似的马所拉文本平行经文作“但以理”，但不据此改写希腊见证。
- source_word: τῶν υἱῶν Δαυείδ
  choice: 从大卫的子孙中
  rationale: 希腊语此处虽未再次明写ἐκ，但名单结构延续前文；汉语补出“从”可使并列关系清楚，同时保留未完句式，接续下一节。
