base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: zh_hans
  text: 你不是向我们发怒，要毁灭我们，以致不留下我们的根、种子和名吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种子”在此可指后裔。“根、种子和名”这一三联意象描绘一个群体的根基、延续和身份都不复存在。
    reason: 保留σπέρμα的字面意象，同时简要说明其在上下文中的谱系含义；不以解释性词语取代正文。
lexical_decisions:
- source_word: οὐχὶ
  choice: 不是……吗
  rationale: 该疑问词引出预期肯定回答的反问；“不是……吗”自然保留其反问语气。
- source_word: ὠργίσθης ἡμῖν
  choice: 向我们发怒
  rationale: 准确表达动词与间接宾语的关系，兼具情感和审判意味，又不过度强化为“震怒”。
- source_word: ἀπολέσαι ἡμᾶς
  choice: 要毁灭我们
  rationale: 不定式在此说明发怒所趋向的行动或结果；“毁灭”直接而庄重。
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: 直到不留下
  rationale: 保留原文所表达的极限或终点，不将其仅改写成一般结果，以维持毁灭达到彻底地步的张力。
- source_word: ῥίζαν
  choice: 根
  rationale: 保留原文具体的植物意象，并可自然指向家族或群体得以延续的根基。
- source_word: σπέρμα
  choice: 后裔
  rationale: σπέρμα字面为“种子”，在此语境指延续血脉的人；译作“后裔”使现代读者易懂，脚注保留字面信息。
- source_word: ὄνομα
  choice: 名号
  rationale: 既保留“名”的直接意义，也传达群体身份和存续记号；比单用“名字”更符合庄重语境。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 置于并列三项之前，使其自然统摄“根、后裔和名号”，对应希腊文中修饰整个三联词的属格。
theological_decisions:
- issue: 悔罪祷告中毁灭程度与余民存续的张力
  choice: 按反问表达上帝曾发怒，要毁灭他们，直至连根、后裔和名号都不留下。
  alternative: 可解释性地译为“直到不留下任何余民、子孙或名声”。
  rationale: 原文没有使用抽象的“余民”一词，而以“根、种、名”这一具体三联意象描述群体延续被断绝的极限。正文保留其核心意象，不预先化解有关彻底审判与群体存续之间的神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语言。“不是……吗”保留反问语气；“直到不留下”贴近希腊文的极限结构。正文以“后裔”避免“种子”在现代汉语中产生不必要的生硬感，同时借脚注保存原文意象。
