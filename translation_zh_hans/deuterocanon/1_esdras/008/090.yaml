base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: zh_hans
  text: 耶伊路的儿子耶哥尼雅，是以色列子孙中的一员。他高声对以斯拉说：“我们得罪了主；有来自这地各族的异族女子住在我们中间[a]。不过如今，以色列众人仍有指望[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文说异族女子“住”在他们中间；对应传统更明确地说他们娶了当地各族的女子为妻。
    reason: alternative_reading
  - marker: b
    text: 本句的希腊文十分晦涩，逐字近似“如今，以色列众人之上有……”。这里按语境译为“仍有指望”；对应传统也表达以色列仍有指望。
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσας
  choice: 高声……说
  rationale: 该分词有出声呼喊、提高声音之意；“高声……说”既保留公开而迫切的语气，也符合现代汉语叙事习惯。
- source_word: Ἰεχονίας Ἰεήλου
  choice: 耶伊路的儿子耶哥尼雅
  rationale: Ἰεήλου 是属格，最自然地表示父子关系；人名按希腊文本音译，不以其他传统中的对应名字取代。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙中的一员
  rationale: 保留“以色列子孙”的盟约与族群色彩，同时用“中的一员”清楚表达所属关系。
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: 我们得罪了主
  rationale: εἰς 加宾格在此表达犯罪所针对的对象；“得罪了主”自然、庄重，并保留认罪语气。
- source_word: γυναῖκες ἀλλογενεῖς
  choice: 异族女子
  rationale: ἀλλογενής 指属于另一族群的人；“异族”比带有现代国籍意味的“外国”更贴合古代语境。
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: 来自这地各族的
  rationale: ἔθνη 在此宜译为“各族”；“这地”自然表达定冠词所指的当地地域，也避免引入后期“外邦人”的神学含义。
- source_word: κατῴκησαν
  choice: 住在我们中间
  rationale: 按现存希腊文直译其“居住、定居”之意；“在我们中间”是由语境补出的汉语关系成分，并未把希腊文直接改写为“娶为妻”。
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: 不过如今，以色列众人仍有指望
  rationale: 现存希腊语句法和语义均不顺；结合该段语境及对应传统，采用“仍有指望”这一最可能的意思，但以脚注注明文本困难，不把推断伪装成确定直译。
theological_decisions:
- issue: κύριον 的译法
  choice: 主
  alternative: 耶和华
  rationale: 直接翻译的希腊文本使用 κύριος，并未在本句提供希伯来神名的形式；译作“主”忠于当前主要文本，也不额外引入特定神名译法。
- issue: 异族女子居住一语是否直接解释为通婚
  choice: 按希腊文译作“住在我们中间”
  alternative: 我们娶了异族女子为妻
  rationale: 上下文很可能涉及通婚，但现存希腊文实际使用“居住”的动词。正文保留这一见证，脚注说明对应传统较明确的通婚含义，避免静默消除文本差异。
- issue: 困难末句是否译出“指望”
  choice: 以色列众人仍有指望
  alternative: 以色列众人都在上面／以色列众人之上仍有什么
  rationale: 逐词硬译现存希腊文会产生不可理解的汉语，也难以形成连贯意义。“仍有指望”最符合语境和对应传统；脚注同时保存希腊文本的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与直接引语。“异族女子”保留古代族群语境；“得罪了主”“仍有指望”具有适度经文庄重感，但不使用生硬古语。正文以希腊文为首要依据，对“居住”与困难末句的处理均用脚注明示，不静默改写文本。
