base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: zh_hans
  text: 我吩咐他们去见拉代乌[a]；他是在财库那地方作首领的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里仅提到拉代乌；《以斯拉记》8:16的希伯来文平行记载则列出多名受差遣的人。本书此处似乎压缩或改写了平行记载。
    reason: alternative_reading
  - marker: b
    text: 或译：“在财库所在地作首领的”，也可理解为“主管财库的人”。希腊语表达十分紧凑，末尾短语与“首领”的关系可有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα αὐτοῖς ἐλθεῖν
  choice: 我吩咐他们去
  rationale: λέγω后接不定式，在这里表达命令或指示；译作“吩咐……去”比直译“对他们说来”更符合现代汉语，同时不过度强化为正式命令。
- source_word: πρὸς Λαδδαῖον
  choice: 去见拉代乌
  rationale: πρός与表示移动的ἐλθεῖν连用，表示前往某人那里；“去见”自然传达目标人物。Λαδδαῖον是希腊语人名的宾格，按其形式音译为“拉代乌”。
- source_word: τὸν ἡγούμενον
  choice: 首领
  rationale: ἡγούμενος泛指带领者或负责人；“首领”保留其领导地位，又不把它限定为“总督”等特定官职。
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: 在库房所在地的
  rationale: 该短语结构紧凑，可表示此首领位于或主管“库房之处”。正文采用较贴近词序且通顺的表达，并以脚注保留其他句法理解。
- source_word: γαζοφυλακίου
  choice: 库房
  rationale: γαζοφυλάκιον可指财库、库房或储藏财物的房间；“库房”在此自然且不预设其为国家财政机构。
