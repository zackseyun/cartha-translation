base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: zh_hans
  text: 以色列的主啊，你是真实的；因为我们直到今日仍被留下，成为一根。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: 以色列的主啊
  rationale: 保留属格结构及呼格语气；原文是“以色列的主”，并非“主以色列的神”。
- source_word: ἀληθινὸς
  choice: 真实的
  rationale: 对应“真实、真诚、信实”的语义范围；此处采用较贴近原词且不替文本消解神学张力的“真实的”。
- source_word: κατελείφθημεν
  choice: 我们还被留下
  rationale: 保留被动语态，也以“还”表达存留至今的结果状态。
- source_word: ῥίζα
  choice: 一条根
  rationale: 直译“根”，不改写为“余民”；量词“一条”符合现代汉语对根的自然搭配，同时保留原文意象。
- source_word: ἐν τῇ σήμερον
  choice: 直到今日
  rationale: 该表达意为“在今天／到今日”；结合存留的结果状态，译为自然的时间表达“直到今日”。
theological_decisions:
- issue: ῥίζα是否解释为“余民”
  choice: 根
  alternative: 余民
  rationale: 希腊文明确使用ῥίζα（根）。虽然语境可能具有余民含义，正文仍保留植物意象，不以解释性术语替代。
- issue: ἀληθινός的神学语义
  choice: 真实的
  alternative: 信实的
  rationale: “信实”可能是语境中的含义，但会收窄ἀληθινός的语义范围；采用“真实的”以保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。句式尽量贴近希腊文；“成为一条根”略具意象性，但在现代汉语中仍可理解，并忠实保留原文比喻。
