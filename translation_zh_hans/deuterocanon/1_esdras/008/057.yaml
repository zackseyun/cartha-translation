base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: zh_hans
  text: 他称量后，交给他们[a]：银子六百五十他连得，银器一百他连得，金子一百他连得，金碗二十个[b]，以及优质闪亮的青铜器皿十件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本与《以斯拉记》8:27的希伯来文平行经文明显不同；后者列的是两件上等铜器，并注明金碗的价值。本译文以希腊文本为准，照其清单翻译。
    reason: textual_variant
  - marker: b
    text: “金碗”也可能译作“金器”。这里的希腊词十分罕见，但希伯来文平行经文支持将其理解为碗或盆一类的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: 交给
  rationale: 在移交圣殿财物的语境中，直译为“交给”自然、准确，也保留正式交付之意。
- source_word: στήσας
  choice: 称好后
  rationale: 在按重量列举贵重物品的清单语境中，此分词最可能指称量；“称好后”简洁表达先称量、后交付的动作关系。
- source_word: τάλαντα ἀργυρίου ἑξακόσια πεντήκοντα
  choice: 银子六百五十他连得
  rationale: 保留古代重量单位“他连得”，不作不确定的现代换算，并保持清单体裁。
- source_word: σκεύη ἀργυρᾶ ταλάντων ἑκατόν
  choice: 价值一百他连得的银器
  rationale: 希腊文以一百他连得说明这些银器的计量或价值；中文用“价值”自然地区别器物与散装银子。
- source_word: χρυσίου ταλάντων ἑκατόν
  choice: 金子一百他连得
  rationale: 直接保留原文的重量和清单结构。
- source_word: χρυσώματα
  choice: 金碗
  rationale: 此词罕见，确切所指不明；希伯来文平行经文支持理解为碗或盆一类的金器，正文采用“金碗”，并以脚注保留较宽泛的可能。
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  choice: 用上等光亮的铜制成的器皿
  rationale: 既表达材质，也保留 χρηστοῦ 与 στίλβοντα 所强调的优良品质和光泽，同时避免中文中生硬重复“铜器……铜”。
- source_word: δέκα
  choice: 十件
  rationale: 按器皿类物品采用自然量词“件”，准确呈现数字十。
