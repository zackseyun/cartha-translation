base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: zh_hans
  text: 出自巴珥宗族的，有比买的儿子撒迦利亚[a]；随同他的有二十八名男丁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文所载的人名和人数，与《以斯拉记》8:9大致对应的希伯来文平行经文差异显著；后者作：“约押的子孙中，有耶歇的儿子俄巴底亚；随同他的有男丁二百一十八人。”本译以希腊文为主要依据，因此正文保留希腊文所载的人名和人数。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: 出自巴珥宗族的
  rationale: 希腊文直译近于“从巴珥的……中”，在名单语境中表示家族或宗族。为使现代汉语自然清楚，补出“宗族”，同时仍以希腊文本的名字为准。
- source_word: Ζαχαρίαι
  choice: 撒迦利亚
  rationale: 采用现代中文圣经传统中对该常见旧约人名的标准译法。
- source_word: Βημαί
  choice: 比买的儿子
  rationale: 希腊文仅列专名，未明说亲属关系；但名单结构表明此名很可能是父名。正文按家谱名单的自然表达补出“的儿子”，并以“比买”音译该希腊名字。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 另有……人与他同行
  rationale: 表达这些人与撒迦利亚一同前往；“另有……人与他同行”比逐字译为“和他一起”更符合现代汉语名单体。
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: 二十八人
  rationale: ἄνδρες在登记名单中指男性成员；中文“二十八人”自然简洁，语境已足以表明这是随行人员，无须生硬译作“二十八个男人”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留名单体裁。专名依中文圣经常用音译习惯处理；对希腊文中隐含的宗族和父子关系作最低限度的明示，并用脚注交代希腊文与希伯来平行文本的显著差异。
