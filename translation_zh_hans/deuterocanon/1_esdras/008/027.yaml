base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: zh_hans
  text: 我也靠着我主上帝的帮助鼓起勇气，并从以色列人中召集男子[a]，好与我一同上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》7:28的希伯来文平行经文作“首领”或“领袖”，而不是“男子”；本节正文依照希腊文本。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: 鼓起勇气
  rationale: 该短语表示变得勇敢、自信或受到鼓舞。“鼓起勇气”是自然的现代汉语，也与希伯来文平行经文中“使自己刚强”的语义相呼应。
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: 靠着……的帮助
  rationale: ἀντίλημψις在此指帮助、扶助或支持。译作“靠着……的帮助”既传达神所赐的扶助，也比生硬直译“按照帮助”更符合现代汉语。
- source_word: Κυρίου θεοῦ μου
  choice: 主我的上帝
  rationale: 紧贴希腊文“主—我的上帝”的称谓结构，不把希伯来文平行经文中的神名反向引入以替代希腊文κύριος。
- source_word: συνήγαγον
  choice: 召集
  rationale: 动词指把人聚集起来；在组织同行者的语境中，“召集”比泛称“聚集”更自然准确。
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: 从以色列人中
  rationale: 这里表示从以色列群体当中选召同行者；补出“人中”可避免现代读者把“以色列”误解为纯粹的地理来源。
- source_word: ἄνδρας
  choice: 一些男子
  rationale: 希腊文明确使用ἄνδρας，指成年男性。译文保留性别信息，不以希伯来文平行经文的“首领”取代希腊文本。汉语补出“一些”使宾语表达自然，但不限定具体人数。
- source_word: ὥστε συναναβῆναί μοι
  choice: 与我一同上去
  rationale: 该结构表达目的或结果；“一同上去”保留前往耶路撒冷的上行表达，并准确呈现同行之意。
theological_decisions:
- issue: 所召集之人的身份或地位：希腊文本与马所拉文本平行经文有异文
  choice: 男子
  alternative: 首领／领袖
  rationale: 《以斯拉一书》的主要文本依据是希腊文，所读为ἄνδρας（“男子”）；《以斯拉记》7:28的希伯来文平行经文则为רָאשִׁים（“首领”）。正文遵从希腊文本，并在脚注保存希伯来文的不同读法，避免无声调和两种见证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“靠着……的帮助鼓起勇气”自然呈现神的扶助与叙述者受到鼓舞之间的关系；“男子”保留希腊原文的性别信息及其与希伯来文平行经文之间的张力。
