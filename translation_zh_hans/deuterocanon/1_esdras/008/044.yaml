base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: zh_hans
  text: 我派人去请以利亚撒[a]、伊杜埃尔、玛斯曼、埃纳阿坦、示玛雅、约里布、拿单、恩纳坦、撒迦利亚和米所拉本；他们都是领袖和有见识的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节有几个人名以希腊文形式保存，很难与《以斯拉记》的希伯来文平行记载逐一准确对应；这里依照希腊文本音译，不强行统一。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  choice: 我派人去请
  rationale: ἀποστέλλω本义是“差派、派遣”；与πρός及一列人名连用时，语境表明是派人到他们那里请他们来。译为“派人去请”既体现差遣动作，也符合现代汉语叙事习惯。
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: 以利亚撒、伊杜埃尔、玛斯曼、埃纳阿坦、示玛雅、约里布、拿单、恩纳坦、撒迦利亚和米所拉本
  rationale: 以Swete希腊文本为主要依据音译人名；已有稳定中文圣经形式的名字采用通行译名，其余按希腊形式作可读音译。埃纳阿坦与恩纳坦分别反映Ἐναατάν和Ἐννατάν，不将两者擅自合并。
- source_word: τοὺς ἡγουμένους
  choice: 领袖
  rationale: 该实词化分词指带领者或居领导地位的人。“领袖”简洁、庄重，也不额外限定其具体官职。
- source_word: ἐπιστήμονας
  choice: 有见识的人
  rationale: 此词指有知识、明达或具备才识的人。“有见识的人”保留其人物特质，且比“专家”少一层现代职业化含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们都是”将希腊文同位语关系自然地表达出来；分号体现本节仍可能接续下文，同时使中文句法完整清楚。
