base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: zh_hans
  text: 以下是亚达薛西王给祭司、主的律法宣读者以斯拉的文书副本：[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“主的律法宣读者”；《以斯拉记》7:11的希伯来文平行经文则作“文士”。
    reason: alternative_reading
  - marker: b
    text: 这一标题的希腊文措辞较为生硬；大意是下文抄录亚达薛西王给以斯拉的文书副本。
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: 交给
  rationale: 此处希腊文表达生硬，可能带有公文标题的特点；结合上下文的“副本”和“如下”，可理解为王的文书交付或发给以斯拉。“交给”保留正式的传递关系，又不过度限定为颁布、呈递等更具体动作。
- source_word: παρὰ Ἀρταξέρξου βασιλέως
  choice: 亚达薛西王
  rationale: παρά加属格表示来源；中文以“亚达薛西王交给”自然表达文书来自王。
- source_word: πρὸς Ἔσραν
  choice: 交给……以斯拉
  rationale: πρός在公文语境中表示指向或收件对象，即文书是给以斯拉的。
- source_word: τὸν ἱερέα
  choice: 祭司
  rationale: 直接保留以斯拉的职衔。
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: 主律法的宣读者
  rationale: ἀναγνώστης本义为读者、宣读者。选“宣读者”比现代汉语中的普通“读者”更能体现公开诵读或职分意味，同时不按希伯来平行经文改作“文士”。
- source_word: Κυρίου
  choice: 主
  rationale: 在指以色列的上帝并构成经文职衔短语时，译作“主”。
- source_word: ἀντίγραφον
  choice: 副本
  rationale: 常见公文术语，指抄本或复制件；“副本”在现代汉语中清楚而正式。
- source_word: τὸ ὑποκείμενον
  choice: 如下
  rationale: 字面为“置于下方的”，在引出随后文书的标题中，汉语惯用“如下”。
theological_decisions:
- issue: 希腊文本与《以斯拉记》7:11希伯来平行经文对以斯拉职衔的不同表述
  choice: 正文依希腊文译作“主律法的宣读者”
  alternative: “主律法的文士”或“天上上帝律法的文士”
  rationale: 本节直接源文本为希腊文，故保留ἀναγνώστης的含义，不与希伯来平行经文的“文士”协调；差异在脚注中说明，以保存文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的公文引介语。“宣读者”保留希腊文本特色；“其副本如下”简洁地重现标题功能。
