base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/033.yaml
  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
translation:
  language: zh_hans
  text: 兰的子孙中，有哥多利亚的儿子以西亚[a]，与他同来的有七十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》8:3的马所拉文本近似平行经文在人名和人数上不同，作“示迦尼的子孙中，有雅哈悉的儿子……男丁三百人”。本书以希腊文见证为主要翻译依据，因此正文保留希腊文的人名和“七十人”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Λάμ
  choice: 兰的子孙中
  rationale: 名单中用于引出宗族成员；“……的子孙中”既保留希腊文结构，也符合现代汉语表达。专名Λάμ按希腊文音译为“兰”，不按近似的马所拉文本调整。
- source_word: Ἐσίας
  choice: 以西亚
  rationale: 按希腊文专名音译，并采用适合中文圣经人名的形式。
- source_word: Γοθολίου
  choice: 哥多利亚的儿子
  rationale: 该属格在家谱名单中表示父子关系；在汉语中明确译出“……的儿子”，可自然传达原文隐含关系。人名按希腊文音译，不与近似的马所拉文本协调。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 与他同来的有
  rationale: 表达随同关系，并补出汉语名单句式所需的谓语，使译文自然清楚。
- source_word: ἄνδρες ἑβδομήκοντα
  choice: 七十人
  rationale: ἄνδρες在此指随行的成年男子；汉语名单语境中的“七十人”自然简洁，并未改变其所指群体。
