base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: zh_hans
  text: 此外，还有他们弟兄中的十个人与他们在一起。我把银子、金子和我们主的殿中的圣器称量后交给他们[a]；这些都是王、他的谋士、权贵和全体以色列人所献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本直译作“我把……放在他们面前”或“安置在他们面前”；希伯来文平行文本作“我把……称出，交在他们手中”。后者更符合这里托付银子、金子和器皿的语境。
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: 又有十个人，是从他们的弟兄中选出来与他们同去的
  rationale: 希腊文句式简略，直译近于“并同他们，从他们的弟兄中，十个人”。中文补出“选出来”和“同去”，使其自然连贯，同时保留十人出自其弟兄群体这一含义；“弟兄”可能指同族或同职群体，不进一步限定。
- source_word: ἔστησα αὐτοῖς
  choice: 我把……称出，交给他们
  rationale: 现存希腊文通常表示“放置、摆在他们面前”，但相关闪语平行文本作“称出，交在他们手中”，且银、金、器皿的语境也支持正式称量并托付；正文采用语境与平行证据支持的表达，并以脚注注明希腊文本面。
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: 银子、金子
  rationale: 这里所指是作为贵重材料称量并托付的银与金，不泛化为钱财。
- source_word: τὰ ἱερὰ σκεύη
  choice: 圣器
  rationale: 指用于圣殿的神圣器具；“圣器”简洁、庄重，也保留其礼仪属性。
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: 我们主殿里的
  rationale: οἶκος在此是圣殿；κυρίου ἡμῶν明确为“我们的主”。中文以“我们主殿里的”自然表达所属与地点关系，不改作“耶和华”或增添“神”。
- source_word: οὕτως ἐδωρήσατο
  choice: 这些都是……捐献的
  rationale: 动词表达作为礼物献出。结合圣殿财物，中文“捐献”比泛泛的“赠送”更贴切；希腊文单数动词与复合主语的搭配不影响整体施予者的理解。
- source_word: οἱ σύμβουλοι αὐτοῦ καὶ οἱ μεγιστᾶνες
  choice: 他的谋士、权贵
  rationale: σύμβουλοι是王室参谋或顾问；μεγιστᾶνες指地位显赫的高官贵族。“谋士、权贵”在现代中文中清楚自然，并保留宫廷身份与社会等级。
theological_decisions:
- issue: 圣殿语境中 κύριος 的译法
  choice: 我们的主
  alternative: 耶和华；我们的主人
  rationale: 希腊文是κυρίου ἡμῶν，并非本节直接呈现的希伯来神名；译作“我们的主”既忠于希腊文本，也避免把底本没有明说的形式带入正文。
- issue: ἔστησα 与闪语平行文本“称出”的差异
  choice: 正文译作“称出，交给他们”，脚注保留希腊文本面的“放在他们面前”
  alternative: 我把……放在他们面前；我把……交给他们
  rationale: 主要锚点仍是希腊文，但此处文本与上下文存在明显张力。平行文本明确是称量贵金属，语境也显示正式托付财物；采用“称出，交给”可传达最可能的实际动作，同时用脚注公开文本差异，不掩盖证据。
- issue: “弟兄”的群体身份
  choice: 保留“弟兄”，不明确限定为利未人、亲属或同胞
  alternative: 族人；同工；亲兄弟
  rationale: ἀδελφοί在这里可能有广义群体含义，但本节本身没有充分限定。保留“弟兄”可维持原文的语义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“圣器”“谋士”“权贵”保持经文语域，但避免生僻古奥。“于是”衔接前后两个简略希腊分句；不在正文中消解“弟兄”的具体身份。脚注标记[a]已置于相关动词短语之后。
