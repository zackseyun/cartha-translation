base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: zh_hans
  text: 看哪，我们带着自己的不法之事[a]在你面前；因这些事，我们再也不能站立在你面前。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着自己的罪孽”。“不法之事”所对应的希腊词既可指违法的行为，也可指这些行为所造成的罪责状态。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文平行经文（以斯拉记9:14）以不同措辞表达同一危机，着重上帝的忿怒以及余民可能灭绝；本节希腊文则说，他们因这些罪不能站立在上帝面前。
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引出高潮性认罪的指示和强调作用；“看哪”庄重而仍为现代读者所理解。
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: 我们……来到你面前
  rationale: 表达众人如今处于上帝面前的状态。汉语用“带着……来到你面前”自然呈现 ἐν 与罪责相伴的意味，同时避免与后文明确的 στῆναι 重复译作“站立”。
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: 带着自己的不法之事
  rationale: ἀνομίαι 可指违背律法的行为，也可涵盖由此形成的罪责状态；正文采用清楚具体的“不法之事”，脚注保留“罪孽”的可能译法。
- source_word: οὐ γάρ ἐστιν στῆναι ἔτι
  choice: 我们再也不能站立
  rationale: 以自然汉语表达无人称结构 οὐ ἔστιν 加不定式的“不可能”，并保留 στῆναι 在上帝面前经受审断的形象。
- source_word: ἔμπροσθέν σου
  choice: 在你面前
  rationale: 保留原文重复的面向上帝之表达及其司法、敬拜语境。
- source_word: ἐπὶ τούτοις
  choice: 因为这些事
  rationale: 结合语境取原因义，指上述所承认的罪；不把希腊文本改写为平行希伯来文本中的毁灭表述。
theological_decisions:
- issue: 认罪语境中 ἀνομίαι 的译法
  choice: 不法之事
  alternative: 罪孽；不法；罪责
  rationale: “不法之事”既保留违反上帝法度的道德—律法分量，也让普通现代读者容易明白；脚注说明该词也可能着重罪孽或罪责状态，避免将其意义收窄。
- issue: 末句是否依照以斯拉记9:14的希伯来平行文本扩写
  choice: 严格保留希腊文“不能站立在你面前”的认罪表达
  alternative: 译成上帝发怒、灭绝余民的意思
  rationale: 本节的主要文本依据是希腊文。希伯来平行经文以不同措辞强调上帝的忿怒和余民可能灭绝，不应取代或改写本节希腊文本。
- issue: “站立在你面前”的神学意象
  choice: 保留“站立”
  alternative: 仅译为“留在你面前”或“出现在你面前”
  rationale: “站立”保留人在上帝面前接受察验或审断而无法立足的张力，不进一步界定为某一特定教义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留认罪高潮中的强调；句中分号呈现原文因果推进。“站立在你面前”刻意保留司法与敬拜语境中的张力。所有脚注标记均已置于正文。
