base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: zh_hans
  text: 凡你想与弟兄们用这些金银做什么，就照你上帝的旨意去办。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》7:18的希伯来文平行经文说得更具体，提到用“剩下的金银”做你和你的弟兄们看为好的事；《以斯德拉一书》此处的希腊文表述较为宽泛。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: 凡……想……的事，都
  rationale: πάντα ὅσα 配合 ἄν 和虚拟式构成开放式关系从句，表示“无论什么”或“凡……的”；此译自然保留意愿语气。
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: 你和你的弟兄
  rationale: μετά 表示共同参与；译出“你和”可使汉语主语清楚。“弟兄”保留阳性复数，也不限定为亲生兄弟。
- source_word: ποιῆσαι
  choice: 做的事
  rationale: ποιέω 在这里含义宽泛，不宜具体化为购买、献祭等行动。
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  choice: 用这些金银
  rationale: 两个与格在此最自然地表示所使用或处置的财物；“这些”体现上下文中特指的款项，而“金银”符合现代汉语习惯。
- source_word: ἐπιτέλει
  choice: 办妥
  rationale: ἐπιτελέω 表示将事情实行并完成；“办妥”兼顾执行与完成之意，又避免与前面的“做”重复。
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: 照你上帝的旨意
  rationale: 直接保留该短语所表达的规范：一切处置均受其上帝旨意约束。
theological_decisions:
- issue: 本节希腊文与《以斯拉记》7:18的马所拉文本平行经文范围不同
  choice: 按希腊文译为对金银用途的宽泛授权，并保留“照你上帝的旨意”这一限制
  alternative: 依平行经文收窄为“剩下的金银，你和你的弟兄看怎样好，就怎样处理”
  rationale: 《以斯德拉一书》以希腊文为主要翻译依据；本节希腊文没有“剩下的”或“看为好”等明确措辞，因此不将平行经文的限定并入正文，但以脚注说明差异。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“凡……都……”清楚呈现希腊文开放式关系结构；“弟兄”保留原文用词可能涵盖同族或同工者的宽度；“办妥”传达执行至完成的意味。
