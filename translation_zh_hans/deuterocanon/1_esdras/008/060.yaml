base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: zh_hans
  text: 那些领受了银子、金子和器皿的祭司和利未人，在耶路撒冷把这些物品送进主的圣殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文作：“带到耶路撒冷，送到我们上帝的殿。”《以斯拉一书》的希腊文则作：“在耶路撒冷送进主的圣殿。”
    reason: 保留希腊文主要文本与希伯来文平行经文在耶路撒冷的句法关系、神圣称号及措辞上的差异。
lexical_decisions:
- source_word: παραλαβόντες
  choice: 领受了
  rationale: 不定过去时分词表示祭司与利未人先接收受托之物，随后运送；“领受了”自然体现这一先后关系，也与希伯来文平行经文的“接收”相符。
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: 祭司与利未人
  rationale: 直接呈现两个各自明确的圣殿职事群体。
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: 银子、金子
  rationale: 原文指银与金这两种贵重金属；译作“银子、金子”符合现代中文圣经语体，且不擅自限定其形态。
- source_word: τὰ σκεύη
  choice: 器皿
  rationale: 在圣殿语境中可泛指礼仪用的容器和器具；“器皿”保留其敬拜用途的色彩。
- source_word: ἤνεγκαν
  choice: 把这些东西带到……送进
  rationale: 原动词表示携带、运送。中文补出宾语“这些东西”，并以“带到……送进”自然表达朝向耶路撒冷及进入圣殿的连续动作。
- source_word: ἐν Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: 希腊文表面形式为“在耶路撒冷”，但所在句的运动语境及希伯来文平行经文均支持将耶路撒冷理解为目的地；译文保留“到耶路撒冷”的行程表达。
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: 送进主的圣殿
  rationale: εἰς 明示进入的方向，ἱερόν 指圣殿或圣殿范围；“送进主的圣殿”清楚保留这一动态含义。
theological_decisions:
- issue: 神圣称号 κυρίου
  choice: 主
  alternative: 我们的上帝
  rationale: 作为主要依据的希腊文读作“主的圣殿”；希伯来文平行经文则作“我们上帝的殿”。正文依希腊文译作“主”，差异收入脚注，不作调和。
- issue: 耶路撒冷与圣殿短语的关系
  choice: 带到耶路撒冷，送进主的圣殿
  alternative: 带进耶路撒冷的主的圣殿
  rationale: 希腊文的词序和结构存在一定张力，且希伯来文平行经文明说“带到耶路撒冷”。正文采用自然中文表达连续目的地，同时不把“在耶路撒冷”静态化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“领受”体现受托接收之意；“器皿”“圣殿”保留礼仪语境。句中补出“这些东西”以避免中文悬空，并用“带到……送进……”清楚表达运输路线。
