base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/013.yaml
  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that may be found in the land of Babylonia for the Lord in Jerusalem[b],
translation:
  language: zh_hans
  text: 并把我和我的朋友向主许愿要献的礼物[a]带到耶路撒冷；又把巴比伦地区所能找到的一切金银，都带到耶路撒冷归给主[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“供物”；在这里，这个希腊词带有献给上帝的敬拜意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文末句十分简略，直译近似“给主、到耶路撒冷”。意思是这些金银要送往耶路撒冷，归主使用。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: 带到
  rationale: 该不定式表示把物品带往某一目的地；“带到”自然保留了朝向耶路撒冷的方向。
- source_word: δῶρα
  choice: 礼物
  rationale: 基本义为“礼物”；上下文具有献给上帝的敬拜意味，但正文不先将其限定为特定祭物，脚注说明“供物”这一可能译法。
- source_word: τῷ κυρίῳ
  choice: 向主／归给主
  rationale: 此处κύριος指以色列的上帝。第一次与“许愿”相连，译作“向主”；末次表示金银的归属和用途，译作“归给主”。
- source_word: ἃ ηὔξαμην
  choice: 许愿要献的
  rationale: εὔχομαι在礼物语境中有“许愿奉献”之意；补出“要献”使现代汉语清楚，同时保留宗教性承诺。
- source_word: οἱ φίλοι
  choice: 我的朋友
  rationale: 按希腊文通常词义直译，不擅自将其具体化为臣僚或同僚。
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: 一切金银
  rationale: 简洁表达贵金属的集合意义，并保留πᾶν的周全范围。
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: 所能找到的
  rationale: 保留ἐὰν加虚拟式所表达的不确定、开放范围；不暗示这些金银已经找到。
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: 在巴比伦地区
  rationale: χώρα表示土地或区域；“地区”避免过度指定为正式行政省份。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: εἰς通常表示朝向和目的地；这里保留运送至耶路撒冷的动态意义。
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: 带到耶路撒冷归给主
  rationale: 原文末语高度压缩，直译近似“给主、到／在耶路撒冷”。此译保留金银归主及耶路撒冷为目的地这两层关系，并以脚注交代歧义。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在这段犹太经文语境中，κύριος指以色列的上帝，而非一般人间主人。
- issue: δῶρα与ηὔξαμην的敬拜含义
  choice: 礼物……许愿要献的
  alternative: 许愿所献的供物
  rationale: 正文既表达这些物品是许愿献给上帝的，又不把δῶρα过早限定为某种特定礼仪祭物。
- issue: 末尾τῷ κυρίῳ εἰς Ἰερουσαλήμ的关系
  choice: 带到耶路撒冷归给主
  alternative: 给在耶路撒冷的主
  rationale: 希腊文可压缩地关联归主和耶路撒冷这一地点。所选译法避免暗示上帝只位于耶路撒冷，也保留物资送往当地用于敬拜的意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“许愿要献”明确宗教承诺，“巴比伦地区”保持地理称谓的宽泛性。分号呈现两个并列运送事项；末尾逗号保留本节在原句中的延续感。
