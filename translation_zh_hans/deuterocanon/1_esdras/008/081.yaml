base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: zh_hans
  text: 现在，不要把你们的女儿嫁给他们的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要使你们的女儿与他们的儿子结为夫妻。”
    reason: 说明συνοικίζω在此指使人结成婚配关系的较贴近表达。
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 在现代汉语中自然承接上文；不增添希腊文未明确表达的强因果意味。
- source_word: τὰς θυγατέρας ὑμῶν
  choice: 你们的女儿
  rationale: 直接保留复数和第二人称复数所有关系。
- source_word: μὴ συνοικίσητε
  choice: 不要把……嫁给
  rationale: συνοικίζω在此指使男女结为夫妻；按父母或群体安排婚姻的语境，译为“把女儿嫁给”既自然又准确。
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: 他们的儿子
  rationale: 与“嫁给”搭配，准确表达希腊文与格所指的婚配对象；“他们”仍由上下文确定。
theological_decisions:
- issue: 婚配禁令的措辞
  choice: 不要把你们的女儿嫁给他们的儿子
  alternative: 不要使你们的女儿与他们的儿子结为夫妻
  rationale: 正文采用自然的社会法律性表达，保留禁令的直接力度，同时不加入原文没有明说的理由或教义解释。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“嫁给”符合本句从女儿一方及家长安排婚姻的叙述视角；脚注保留希腊动词较具体的共同生活意象。
