translation:
  language: zh_hans
  text: 亚达薛西王致祭司以斯拉——主律法的宣读者：问安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεὺς Ἀρταξέρξης
  choice: 亚达薛西王
  rationale: 按现代中文书信抬头的自然语序，将无冠词的王号与人名合译；“亚达薛西”采用通行圣经译名。
- source_word: Ἔσρᾳ
  choice: 以斯拉
  rationale: 采用该人物在现代中文圣经传统中的通行名称。
- source_word: τῷ ἱερεῖ
  choice: 祭司
  rationale: 保留与以斯拉同位的职分称谓；中文在此不需另加定冠词。
- source_word: ἀναγνώστῃ
  choice: 宣读者
  rationale: 该词直接指读出或宣读的人；译作“宣读者”既忠于希腊文，也避免受希伯来文平行经文“文士”影响而同化。
- source_word: τοῦ νόμου Κυρίου
  choice: 主的律法
  rationale: 按自然中文表达所属关系，同时保留“律法”与“主”的明确关联。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的惯用问候语；“问安”在中文中庄重自然，并传达其书信功能，而非机械译为“欢喜”。
theological_decisions:
- issue: 希腊文 ἀναγνώστῃ 与《以斯拉记》7:12 希伯来文平行传统“文士”的差异
  choice: 宣读者
  alternative: 文士
  rationale: 本节以《七十士译本》希腊文为首要文本依据，明确使用表示读者或宣读者的词，不应以平行希伯来传统加以协调；脚注说明差异，以保留文本传统之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文书信体。“致……：问安”清楚呈现发信人、收信人及问候语；“宣读者”虽略带职衔色彩，但准确保留希腊文本的独特措辞。
