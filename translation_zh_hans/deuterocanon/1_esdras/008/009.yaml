    rationale: 《以斯拉记》7:12位于该书的亚兰文段落；应称“亚兰文平行经文”，以免造成原文语言资料错误。
  - severity: low
    issue: 收信人身份的中文语序略显拥挤。
    rationale: “祭司、主的律法宣读者以斯拉”可读，但不如“祭司以斯拉——主律法的宣读者”清晰地呈现两个同位身份。
  revised_text: 亚达薛西王致祭司以斯拉——主律法的宣读者：问安。
  revised_footnotes:
  - marker: a
    text: 希腊文作“主律法的宣读者”；《以斯拉记》7:12的亚兰文平行经文作“天上之神律法的文士”。
    reason: 说明希腊文本与《以斯拉记》7:12的亚兰文平行传统之间的措辞差异，避免将“宣读者”默默协调为“文士”。
