    reason: textual_variant
  - marker: b
    text: 本句希腊文先用单数“他……出发”，随后转用复数“他们……到了”。希伯来文平行经文则以以斯拉为单数主语。正文保留希腊文的数目转换。
    reason: alternative_reading
