base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: zh_hans
  text: 亚达薛西在位第七年五月[a]，他们到了耶路撒冷。原来，他在正月朔日从巴比伦出发，而他们照着主所赐的旅途顺利，来到了耶路撒冷；这顺利临到他们，是因主眷顾他。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文在此还有一句：“这一年是王的第二年。”这句话与前面的“在位第七年”不相合，希伯来文平行经文（以斯拉记7:6–9）也没有这句话，可能是抄传中讹误或错置的文字，因此正文未予译入。
    reason: textual_variant
  - marker: b
    text: 本句希腊文先用单数“他……出发”，随后转用复数“他们……来到”。希伯来文平行经文则以以斯拉为单数主语。正文保留希腊文的数目转换。
    reason: alternative_reading
  - marker: c
    text: “因主眷顾他”直译是“在他身上”。这里的关系略有含混；希伯来文平行经文说：“耶和华他神的手帮助他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου ἐν τῷ πέμπτῳ μηνί
  choice: 亚达薛西在位第七年五月
  rationale: 将属格独立结构自然地译为王朝纪年；“在位第七年五月”简洁、庄重，并保留月份信息。
- source_word: ἐξελθόντος ... ἐκ Βαβυλῶνος
  choice: 他……从巴比伦出发
  rationale: 希腊文分词为单数，主语虽未明说，语境指向以斯拉；正文保留“他”，不以希伯来平行经文补出名字。
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: 在正月朔日
  rationale: νουμηνία明确指新月之日；“朔日”准确表达该历法概念，“正月”则是现代汉语中自然的第一月表述。
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: 他们到了／来到了耶路撒冷
  rationale: 动词为复数，故保留希腊文本的复数主语；重复译出到达动作，以反映现存希腊文的句法与叙事重复。
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  choice: 照着主所赐的旅途顺利
  rationale: εὐοδία既可指顺利、成功，也带有行程顺遂的含义；“旅途顺利”比抽象的“亨通”更贴合旅行语境。
- source_word: παρὰ τοῦ κυρίου
  choice: 主所赐
  rationale: παρά加属格表示来源；与δοθεῖσαν结合，译作“主所赐”自然准确。
- source_word: ἐπʼ αὐτῷ
  choice: 因主眷顾他
  rationale: 原文直译为“在他身上”，所指关系不够明确。结合语境及希伯来平行经文中“耶和华的手帮助他”，正文以自然汉语表达神的恩助，同时在脚注保留字面形式及歧义。
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: 正文不译，置于脚注
  rationale: 现存希腊文为“这一年是王的第二年”，与紧邻的“在位第七年”冲突，且句法、历史语境均有困难；希伯来平行经文也无此句，因此不强行纳入正文，但完整记录于脚注。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要底本是希腊文，原词为κύριος；虽然希伯来平行经文有יהוה，正文仍按希腊见证译作“主”，不以平行经文替换。
- issue: ἐπʼ αὐτῷ所表达的神人关系
  choice: 因主眷顾他
  alternative: 在他身上／主的手帮助他
  rationale: “眷顾”表达神所赐的恩助，又不直接把希伯来平行经文的“手”增补进希腊正文；脚注说明字面形式，保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“朔日”虽略带书面色彩，却是表达新月日的准确常用历法词。正文保留希腊文单复数转换和重复到达的现象；对明显冲突的传本文字不强作调和，而以脚注交代。
