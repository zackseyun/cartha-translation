  yaml_path: translation/deuterocanon/1_esdras/008/043.yaml
  text: And from the priests and from the Levites I found no one there[a].
translation:
  language: zh_hans
  text: 我在那里没有找到一个祭司或利未人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本处所附的希伯来文马所拉文本平行材料与希腊文并不密切对应，因此正文以希腊文为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: 在祭司中
  rationale: ἐκ在此表示从某一群体中寻找；现代汉语用“在……中”比直译“从祭司中”更自然。
- source_word: ἐκ τῶν Λευειτῶν
  choice: 在利未人中
  rationale: 与前一短语保持平行；“利未人”是Λευεῖται的通行中文译法。
- source_word: οὐχ εὗρον
  choice: 我……一个也没有找到
  rationale: εὗρον为第一人称单数，保留“我”；希腊文未明说宾语，中文以“一个”自然表达所指之人，同时不增添具体身份。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点副词，指上下文中聚集或察看的地方。
theological_decisions:
- issue: 希腊文本与所附马所拉文本平行材料严重不一致
  choice: 以希腊文为正文依据，译作“我在那里，无论在祭司中还是在利未人中，一个也没有找到”
  alternative: 依所附马所拉文本译出比革瓦伊后裔及人数的名单内容
  rationale: 本处指定的主要原文见证是希腊文；所附希伯来文显然属于不同的名单条目，不能用来改写现存希腊语句。脚注如实提示这种文本不对应现象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无论……还是……”体现两个并列群体，并以“一个也没有找到”自然传达希腊文省略宾语的否定表达。
