base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
translation:
  language: zh_hans
  text: 向他祈求，使我们、我们的儿女和牲畜一路顺利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“旅途顺遂”“路上亨通”或“旅途平安”。希腊语意指行程进展顺利；希伯来语平行经文的上下文也提到在路上蒙助、免受仇敌侵害。
    reason: 说明εὐοδίαν在旅途语境中的词义范围，并保留“顺遂”“成功”与“安全”等可能侧重。
lexical_decisions:
- source_word: ζητῆσαι
  choice: 祈求
  rationale: 该不定式可指“寻求”或“求取”；此处所求的对象来自上帝，用“祈求”自然表达向他求取，却不增添具体仪式。
- source_word: παρʼ αὐτοῦ
  choice: 向他
  rationale: παρά加属格表示所求之物的来源；汉语与“祈求”搭配时，“向他”比直译为“从他”更自然。
- source_word: εὐοδίαν
  choice: 一路顺利
  rationale: 该名词表示道路或旅程进展顺遂、成功。上下文是出行，“一路顺利”兼顾旅途顺遂与蒙眷顾之意，又不把含义收窄为单纯的人身安全。
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: 使我们、我们的儿女和牲畜
  rationale: τέκνα泛指儿女，不限于儿子；κτήνη指家养或作为财产的动物，“牲畜”符合迁行队伍的语境。汉语加入“使”以自然承接所求的旅途顺遂。
theological_decisions:
- issue: 向上帝求旅途福祉的含义范围
  choice: 一路顺利
  alternative: 旅途平安；路上亨通
  rationale: 希腊文本强调旅程进展良好，并未明说免受仇敌伤害；平行的希伯来语上下文则提到路上蒙助。因此正文保留较宽泛的“顺利”，不把它限定为安全，也不额外引入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“儿女”较“孩子”稍显庄重且不限定性别；“牲畜”准确体现κτήνη所指的家养动物。“一路顺利”是自然现代表达，同时保留希腊语在旅途进展与蒙福之间的语义张力。
