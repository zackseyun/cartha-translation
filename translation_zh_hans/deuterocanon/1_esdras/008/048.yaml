  yaml_path: translation/deuterocanon/1_esdras/008/048.yaml
  text: from the sons of Hanunai and their sons[a], twenty men;
translation:
  language: zh_hans
  text: 哈努奈的子孙和他们的儿子，共二十人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文作：“哈努奈的子孙和他们的儿子，共二十人。”近似的希伯来文平行段落则列出哈沙比雅和米拉利子孙中的耶沙雅，以及他的弟兄和他们的儿子，共二十人（不同传统对《以斯拉记—尼希米记》的章节编号有所不同）。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: 哈努奈的子孙
  rationale: οἱ ἐκ 加属格表示出自某一家族的人。译作“哈努奈的子孙”符合现代汉语族谱名单的表达，并保留家族归属；专名 Χανουναίου 音译为“哈努奈”。
- source_word: οἱ υἱοὶ αὐτῶν
  choice: 和他们的儿子
  rationale: αὐτῶν 是复数，直译为“他们的”；不依照近似的希伯来文本改成“他的弟兄和他们的儿子”，以免调和两个不同见证。
- source_word: εἴκοσι ἄνδρες
  choice: 共二十人
  rationale: ἄνδρες 在这类男性人员名册中指成年男子；汉语以“二十人”自然计数，而上下文已表明所列为男性。“共”清楚表达总数。
theological_decisions:
- issue: 希腊文本与马所拉文本平行段落中的人员名单不同
  choice: 正文依现存希腊文，译为“哈努奈的子孙和他们的儿子，共二十人”。
  alternative: 近似的马所拉文本平行段落记载：“哈沙比雅，以及同他一起、米拉利子孙中的耶沙雅，还有他的弟兄和他们的儿子，共二十人。”
  rationale: 《以斯拉一书》应以希腊文为主要翻译依据。本节希腊文与希伯来文平行段落在姓名和分组上有实质差异，因此正文保留希腊文读法，并在脚注中注明另一见证，不作调和。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持人员名册的紧凑句式。正文忠实保留希腊文中复数“他们”的指向，不借平行文本消除其可能显得突兀之处。
