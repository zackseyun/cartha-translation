base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
translation:
  language: zh_hans
  text: 所以，凡有此意的人，都当一同启程[a]，正如我和七位身任谋士的朋友[b]所决定的；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有此意”也可译作“打算这样做”；“一同启程”更直译为“一同出发”。
    reason: 说明ἐνθυμοῦνται与συνεξορμάσθωσαν的词义范围。
  - marker: b
    text: 这里的“朋友”可能是王室宫廷中的正式称号，并不只是指私人朋友。
    reason: 交代希腊化宫廷用语的文化背景。
lexical_decisions:
- source_word: ὅσοι οὖν ἐνθυμοῦνται
  choice: 所以，凡有此意的人
  rationale: ὅσοι涵盖所有符合条件的人；οὖν承接上文，译为“所以”；ἐνθυμοῦνται表示心中有此打算或意向，“有此意”保留其意向性，不缩减为单纯“愿意”。
- source_word: συνεξορμάσθωσαν
  choice: 都可以一同启程
  rationale: 该命令式在诏令语境中表达准许或号召；“启程”体现出发之意，“一同”保留συν-所含的共同行动。
- source_word: καθάπερ δέδοκται
  choice: 正如……所议定的
  rationale: καθάπερ表示依照或正如；δέδοκται是诏令及行政语体中表示已作决定的完成时形式。“所议定的”既体现共同商议，也保留决定已经形成的语气。
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: 我和七位担任谋士的朋友
  rationale: 与格短语指出作出决定者。φίλοι既可指朋友，也可能是宫廷头衔；συμβουλευταῖς说明其谋士身份。正文保留“朋友”并交代其职分，避免只译作私人友人。
