lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: 给你们的儿子
  rationale: 与格短语可表示“给你们的儿子”或“归你们的儿子”。鉴于现存希腊文只是残句，采用自然的中文表达，同时保留“儿子”的阳性复数含义，不扩展为“儿女”。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 该惯用语表示延续至永久；“直到永远”既贴近其字面结构，也符合庄重、自然的现代汉语。
theological_decisions:
- issue: 残缺文本及主要见证不相符
  choice: 只翻译现存希腊文，并保留残句性质
  alternative: 根据所附马所拉文本平行段落补写完整句子
  rationale: 本节所提供的主要希腊文见证仅存τοῖς υἱοῖς ὑμῶν ἕως αἰῶνος这一短语；所附希伯来文属于不同且更长的上下文，不能据此覆盖或重构希腊文本。译文因此不补入原文没有的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。由于希腊文仅为残句，中文也刻意保留其不完整性；语序略作调整，使“直到永远”自然修饰隐含的前文动作。
