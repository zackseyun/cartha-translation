  source_fidelity: 译文准确列出希腊文中的六类圣殿人员，并保留赋税与另一类强加负担的双重禁令。惟“不得向所有祭司”在汉语中可能被误解为仅禁止对全体集体征收；改为“不得向任何祭司”更明确传达否定句中πᾶσι的逐一、全面范围。末句“强征这些”将ἐπιβαλεῖν过度限于征收，未能自然涵盖“其他摊派”；改为“施加这些”较贴合原文。
  naturalness: 整体为自然庄重的诏令语体。“又谕令你们”比“也通知你们”更能体现此处行政法令的正式宣告性质；“谁也无权向他们施加这些”清楚而顺畅。
  terminology: “利未人”“圣殿歌唱者”“守门人”“殿役”及“办理这殿事务的人”均合适。“赋税”与“其他摊派”能在行政财政语境中对应φορολογία和ἄλλη ἐπιβουλή；脚注适当地保留后者的词义张力。
