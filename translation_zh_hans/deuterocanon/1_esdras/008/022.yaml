base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: zh_hans
  text: 又谕令你们：不得向任何祭司、利未人、圣殿歌唱者、守门人、殿役，或办理这殿事务的人[b]征收任何赋税或其他摊派[a]；谁也无权向他们施加这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其他摊派”也可译作“其他负担”或“其他强加之物”。这个希腊词在别处可指图谋或加害，但这里紧接“赋税”，行政财政语境较支持此译。
    reason: lexical_alternative
  - marker: b
    text: “办理这殿事务的人”所译的希腊词可指从事某项事务或业务的人；也可译作“这殿的办事人员”，但“办事人员”可能使范围显得过窄。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: 通知
  rationale: 此处处于王室诏令的行政语境，被动式带有正式告知、宣示的意味；“通知”自然且保留公文语气，不将其强化为“命令”。
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: 所有祭司
  rationale: πᾶσι 表明范围完整；与否定性的征收禁令结合，中文用“不得向所有祭司……征收”可表达全体均获豁免。
- source_word: Λευείταις
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群及圣殿职分名称。
- source_word: ἱεροψάλταις
  choice: 圣殿歌唱者
  rationale: 复合词明确指承担圣所歌唱职务的人；“圣殿歌唱者”比单说“歌唱者”更完整。
- source_word: θυρωροῖς
  choice: 守门人
  rationale: 指看守圣殿入口的人员；“守门人”是自然、明确的现代中文表达。
- source_word: ἱεροδούλοις
  choice: 殿役
  rationale: 该词字面涉及为圣所服役者；“殿役”简洁地表达其圣殿服务身份，同时不武断强调奴隶身分。
- source_word: πραγματικοῖς τοῦ ἱεροῦ τούτου
  choice: 办理这殿事务的人
  rationale: πραγματικός 可指从事事务或业务者；此译保留职能范围的宽泛性，避免过窄地限定为“官员”。
- source_word: μηδεμία φορολογία
  choice: 不得……征收任何赋税
  rationale: φορολογία 指税赋或贡税义务；用“征收任何赋税”符合行政语境，也自然承接后文 ἐπιβαλεῖν。
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: 或其他摊派
  rationale: ἐπιβουλή 通常可含敌意图谋或加害之意，但在 φορολογία 之后及征收禁令中，更可能指额外强加的负担；“摊派”保留行政经济语境，脚注说明其语义弹性。
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: 任何人都无权向他们强征这些
  rationale: ἐξουσία 表示合法权限，ἐπιβαλεῖν 表示施加或加在其上；“无权……强征”清楚表达法律禁止，并回指前述赋税和摊派。
