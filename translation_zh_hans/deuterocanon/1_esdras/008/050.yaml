  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: zh_hans
  text: 我便在那里，在我们的主面前，为年轻人宣告禁食[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作：“我在那里，在我们的主面前，为年轻人祈祷（或许下禁食的愿）。”希伯来文平行经文则作：“我在那里……在我们的上帝面前宣告禁食”；正文的“宣告”据此表达上下文中的意思。
    reason: alternative_reading
  - marker: b
    text: 《以斯拉记》8:21的希伯来文平行经文还包含本句希腊文没有的细节：地点是在亚哈瓦河边；禁食的目的是在上帝面前谦卑自己，为他们自己、儿女和一切财物祈求一条正直的路。
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  choice: 宣告
  rationale: εὔχομαι通常意为“祈祷”或“许愿”，但在这里与“禁食”搭配较生硬；希伯来文平行经文用 וָאֶקְרָא（“我宣告／召集”）。正文据上下文译作“宣告”，并在脚注保留希腊文的字面可能性。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点副词，并维持叙事衔接。
- source_word: νηστείαν
  choice: 禁食
  rationale: 在“宣告”之后用“禁食”自然简洁，也与希伯来文平行经文的 צוֹם 相符。
- source_word: τοῖς νεανίσκοις
  choice: 为年轻人
  rationale: 保留希腊文本中特有的成分；νεανίσκοι通常指年轻男子。介词意义由与格表达，译作“为”同时保留其关系上的一定含混。
- source_word: ἔναντι
  choice: 在……面前
  rationale: 自然表达“在场／面前”的含义，保持庄重而符合现代汉语。
- source_word: κυρίου ἡμῶν
  choice: 我们的主
  rationale: 忠实保留希腊文的神圣称谓和第一人称复数所属关系；不以希伯来文平行经文的“我们的上帝”替换正文。
theological_decisions:
- issue: 希腊文与希伯来文平行经文在主要动词上的差异
  choice: 正文译作“宣告禁食”
  alternative: “祈求禁食”或“许下禁食的愿”
  rationale: 希腊文动词本身通常支持“祈祷／许愿”，但上下文中的禁食公式以及希伯来文平行经文支持“宣告”。正文采用语境中较通顺的意义，脚注则明示文本张力，不将差异隐藏。
- issue: 神圣称谓的文本差异
  choice: 我们的主
  alternative: 我们的上帝
  rationale: 《以斯得拉一书》的主要翻译依据是希腊文，其中作 κυρίου ἡμῶν；希伯来文平行经文的“我们的上帝”仅在脚注中说明。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“宣告禁食”符合宗教叙事语境；以逗号分隔“在那里”“在我们的主面前”和“为年轻人”，既使句子清楚，也避免过度限定各短语的句法附着关系。
