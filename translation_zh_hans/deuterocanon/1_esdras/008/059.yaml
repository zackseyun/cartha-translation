base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: zh_hans
  text: 你们要警醒[a]，看守好这些物品，直到你们在耶路撒冷、我们主的殿宇的房间[b]里，把它们交给祭司和利未人的首领，以及以色列各宗族的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “警醒”也可译作“保持警觉”。原文开头两个动词共同强调必须警觉而谨慎地看守。
    reason: lexical_alternative
  - marker: b
    text: “房间”指圣殿建筑群内的房室；希伯来语平行文本也作“房间”。
    reason: cross_reference
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: 要警醒
  rationale: 原词有保持清醒、警觉守望之意；“警醒”既保留具体的警觉意味，也与随后“看守”形成自然的双重命令。
- source_word: φυλάσσετε
  choice: 看守好这些物品
  rationale: 语境涉及受托保管圣殿财物，重点是保护和妥善保管；补出“这些物品”使现代汉语指代清楚，但未改变所指对象。
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: 直到……把它们交给
  rationale: 表达警醒看守持续到保管责任正式移交之时；“交给”符合现代汉语的托付转交语境。
- source_word: φυλάρχοις τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: 祭司和利未人的首领
  rationale: φυλάρχοις在此泛指群体中的首领；不译为“支派长”，以免在祭司和利未人的语境中造成过度限定。
- source_word: ἡγουμένοις τῶν πατριῶν τοῦ Ἰσραήλ
  choice: 以色列各宗族的首领
  rationale: πατριαί指以父系祖先为纽带的家族或宗族单位；“各宗族”比直译“父家”更符合现代普通话，同时保留其正式社会结构。
- source_word: παστοφορίοις
  choice: 房间
  rationale: 指圣殿建筑群中的房室；希伯来语平行文本הלשכות也支持“房间/厢房”，而“库房”会不必要地限定用途。
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: 我们主的殿宇
  rationale: οἶκος在这里是圣殿用语；“殿宇”自然表达圣殿所指，同时保留希腊文“我们主”的明确领属关系。
theological_decisions:
- issue: τοῦ οἴκου τοῦ κυρίου ἡμῶν中的圣殿称谓
  choice: 我们主的殿宇
  alternative: 我们主的家；主我们上帝的殿
  rationale: 希腊文本明确说“我们主”，并未出现“上帝”；译文以希腊文为主，不用希伯来语平行文本中的神名扩充正文。“殿宇”则清楚传达此处οἶκος所指的圣殿。
- issue: τῶν πατριῶν所表达的亲族结构
  choice: 各宗族
  alternative: 各父家；各家族
  rationale: 该词不是泛指任意家庭，而是以祖先和父系家系组织的群体。“各宗族”在现代汉语中较自然，也避免“父家”可能造成的生硬或误解。
- issue: 地点短语ἐν Ἰερουσαλήμ ἐν τοῖς παστοφορίοις的关系
  choice: 把交接地点表述为“在耶路撒冷我们主殿宇的房间里”
  alternative: 把“在耶路撒冷”仅理解为修饰以色列各宗族的首领
  rationale: 希腊语短语连续出现，希伯来语平行文本也把耶路撒冷与圣殿房室置于交接场景中。译文采用最自然的地点理解，但不额外说明房间的具体用途。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“警醒”“看守好”保留双重命令的力度；用“殿宇”明确圣殿语境，用“宗族”表达古代以色列的祖系群体而避免生硬直译。所有脚注标记均已置入正文。
