base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/025.yaml
  text: Blessed be the Lord alone[a], who put these things into the heart of the king,
translation:
  language: zh_hans
  text: 唯有主当受称颂！他把这些事放在王的心里[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文语法很难理解；在“心”之后，字面上近似接着“我的、王的”。依上下文，意思很可能是上帝把这些事放在王的心里；也有人尝试理解为“我这王的心里”或“我主君王的心里”。
    reason: 原文μου τοῦ βασιλέως的语法关系不明；脚注保留文本与解释上的不确定性。
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受称颂
  rationale: 这是祝颂语中的表语形容词；译为“当受称颂”既自然庄重，也保留赞美、祝颂的语气。
- source_word: μόνος ὁ κύριος
  choice: 唯有主
  rationale: μόνος表达排他性；将其与“主”连译为“唯有主”，比逐字译成“主独自”更符合现代汉语，同时不消解希腊文的强调。
- source_word: ὁ δοὺς
  choice: 他把……放在
  rationale: δίδωμι与εἰς τὴν καρδίαν连用，表达把意念或决心放入心中的意思；“放在”保留原文意象且通顺。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留希腊文复数指示代词的宽泛所指，不擅自限定具体内容。
- source_word: εἰς τὴν καρδίαν
  choice: 放在……心里
  rationale: 以自然汉语表达“进入心中”的内在推动，同时保留“心”这一原文意象。
- source_word: μου τοῦ βασιλέως
  choice: 王心里
  rationale: 传世希腊文语序和格关系困难；上下文最可能指神把这些事放在王心里。正文采用可理解的可能意义，异文困难在脚注中明确说明。
theological_decisions:
- issue: 祝颂语中κύριος的译法
  choice: 主
  alternative: 上主
  rationale: “主”是κύριος直接、通行且不额外引入宗派色彩的译法。
- issue: μόνος所表达的排他性
  choice: 唯有主当受称颂
  alternative: 主独自当受称颂
  rationale: “唯有”准确表达μόνος的排他强调；不进一步断定它只修饰“主”还是兼指主是这一行动的唯一施行者。
- issue: 困难短语μου τοῦ βασιλέως的处理
  choice: 王心里
  alternative: 我这王的心里；我主君王的心里
  rationale: 希腊文本身语法突兀，不能稳妥支持“我主君王”这一补释。正文依语境采用最可能的“王心里”，并用脚注保存文本歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“唯有主当受称颂”保留祝颂公式及排他强调；后半句保持未完句式，以对应原文末尾逗号。
