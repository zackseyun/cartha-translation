lexical_decisions:
- source_word: ὑπό
  choice: 出于
  rationale: ὑπό与属格连用通常表示施事者，可译“被”或“由”；但所存希腊文只是一个缺乏谓语的片段。译作“出于”既保留来源或施事关系，也避免擅自补出未见于原文的动作。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: κύριος在这里采用庄重而通行的“主”；不译作“主人”，以符合祷告或认罪语境中的通常称谓。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 明确保留第一人称复数属格所表达的归属关系。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”既忠实于κύριος，又符合现代汉语宗教文本中的通行表达；本片段没有理由改用较偏日常主仆关系的“主人”。
- issue: 如何处理残缺且不匹配的来源材料
  choice: 仅保守翻译现存希腊文片段
  alternative: 依据所给马所拉文本平行经文重构完整句子
  rationale: 所给希腊文只有ὑπὸ τοῦ κυρίου ἡμῶν，且所附希伯来文并不与这一短语直接对应。为坚持希腊文的一手优先地位，并如实保留文本不确定性，不补写未见于该希腊文见证的内容。
- issue: ὑπό所表达的关系
  choice: 用“出于”保留来源与施事之间的开放性
  alternative: 译作“由我们的主”或补成被动结构
  rationale: 由于缺少ὑπό所修饰的谓语或名词，无法确定汉语中最自然的完整被动结构。“出于”不强行解决残片中真实存在的句法悬缺。
