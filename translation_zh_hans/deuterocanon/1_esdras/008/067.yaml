base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: zh_hans
  text: 他们自己和他们的儿子都娶了那些人的一些女儿，圣洁的种子[a]就与这地的外族混杂了；首领和权贵从这事一开始就有分于这种不法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“圣洁的种子”，也可译作“圣洁的后裔”或“圣洁的种裔”；这是指上帝所分别出来之群体及其延续的隐喻。
    reason: 说明σπέρμα的字面意象和可行译法，而不在正文扩展其含义。
  - marker: b
    text: “不法”也可译作“过犯”；希腊文强调这是违背律法的行为。
    reason: 交代ἀνομία的词义范围及其鲜明的道德定性。
lexical_decisions:
- source_word: συνῴκισαν
  choice: 娶了
  rationale: 该动词本义涉及共同居住，在这里的异族通婚语境中指建立婚姻关系；“娶了”自然明确，又不额外解释婚姻的具体安排。
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: 那些人的一些女儿
  rationale: 保留部分结构“其中一些”；“那些人”承接上下文所指群体，避免把代词擅自具体化。
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: 给自己和儿子
  rationale: 希腊文将这些人本人及其儿子并列为婚姻参与者；按现代汉语习惯补出“给”，使关系清楚。
- source_word: ἐπεμίγη
  choice: 混杂在一起
  rationale: 保留原文的混合意象，不直接改写成解释性的“通婚”或“失去纯洁”。
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: 圣洁的后裔
  rationale: σπέρμα直译为“种子”，在这里转喻群体及其延续的后裔；正文采用自然而庄重的“后裔”，脚注保留原有意象及可译选择。
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: 与这地的异族
  rationale: ἀλλογενής强调不同族属；“异族”比“外国人”更贴近此义。“这地的”自然表达τῆς γῆς所限定的当地群体。
- source_word: μετεῖχον
  choice: 参与了
  rationale: 准确表达“有份于、参与”的意义，现代汉语简洁清楚。
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: 首领和权贵
  rationale: 前者指居领导地位的人，后者指显贵人物；该搭配保留职分与社会地位之间的区别。
- source_word: τῆς ἀνομίας ταύτης
  choice: 这种不法之事
  rationale: 保留ἀνομία违反律法、秩序的鲜明谴责意味，又比单用抽象名词“不法”更符合汉语句法。
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: 从这事一开始
  rationale: 贴近“从此事的开端”，同时采用自然的现代汉语表达。
theological_decisions:
- issue: 异族通婚语境中“圣洁的种子”的含义
  choice: 正文译为“圣洁的后裔”，并在脚注说明希腊文直译及其群体延续意象
  alternative: 圣洁的种子；圣洁的种裔
  rationale: 既让普通读者自然理解所指群体，又不把“圣洁”扩展解释为特定的族裔理论或教义；脚注保留原文隐喻及其张力。
- issue: 对该行为的道德定性
  choice: 这种不法之事
  alternative: 这种过犯；这种罪孽
  rationale: ἀνομία明确带有违背律法的谴责意味。“不法之事”保留其法律—盟约色彩，不将其弱化为一般错误，也不增加原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句子保留原文从通婚、混杂到领袖参与的推进关系；不用古奥的“种类”，也不以解释性措辞消解“圣洁”与“混杂”之间的神学张力。
