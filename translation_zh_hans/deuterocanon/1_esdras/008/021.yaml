  terminology: “上帝”“律法”“至高的上帝”“震怒”前后一致，且适合庄重经文语体。“众子”准确反映复数υἱῶν，但现代汉语中“儿子们”更直接自然；为保留正式语感，可用“儿子们”。脚注a的“执行到底”略带口语和持续至终的含义，较“完成/办妥”更强，宜改作“执行或完成”。
