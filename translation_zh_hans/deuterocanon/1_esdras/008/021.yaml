base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: zh_hans
  text: 要照着上帝的律法，为至高的上帝把这事办妥[a][b]，免得震怒临到王的国和他的儿子们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要照着上帝的律法，为至高的上帝执行或完成这事。”希腊语动词可侧重执行或完成。
    reason: lexical_alternative
  - marker: b
    text: 《以斯拉记》7:23的希伯来语平行经文在此处差异很大，着重列出为圣殿事务供应的具体数额；《以斯得拉一书》保存的是较短的希腊语表述。本译文以希腊文本为准。
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: 照着上帝的律法
  rationale: κατά在此表示以某项规范为准；“照着”自然地保留这种依照关系。νόμος指具有约束力的神圣律法，译为“律法”符合上下文。
- source_word: ἐπιτελεσθήτω
  choice: 要……办妥
  rationale: 这是被动命令式，要求把所规定的事执行完成。“办妥”兼顾实际办理与完成之意，但不额外加入“精确地”之类原文没有的强调。
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: 为至高的上帝
  rationale: 与格在此可表示行动所归向或服务的对象；“为”符合汉语中的祭祀—行政语境。“至高的上帝”保留称号及其庄重感。
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: 免得……临到
  rationale: 该结构表达防止某种结果发生的目的；“免得”简洁保留预防性的语气。
- source_word: ὀργή
  choice: 震怒
  rationale: 此处指可能临到王室的严厉愤怒或审判性忿怒。“震怒”保留其庄重和严重程度，同时不在正文中展开原文未明说的审判细节。
- source_word: εἰς τὴν βασιλείαν τοῦ βασιλέως
  choice: 临到王的国
  rationale: εἰς与发生动词结合表示愤怒所及的对象；βασιλεία可指王国或统治领域，“王的国”贴近原文结构。
- source_word: καὶ τῶν υἱῶν
  choice: 和他的众子
  rationale: υἱῶν明确为复数“儿子”；补出汉语所需的领属代词“他的”，指向前面的王，不泛化为后裔。
theological_decisions:
- issue: 所警告之震怒的性质
  choice: 保留为可能临到王国和王众子的“震怒”，让上下文暗示其来自上帝。
  alternative: 明译为“上帝的震怒”，或弱化为一般灾祸、政治危险。
  rationale: 原文没有在ὀργή前明说“上帝的”，但前文以遵行上帝律法为避免震怒的条件，神圣震怒是自然理解。正文不补出所有者，以保存原文的含蓄性。
- issue: 行动与至高上帝的关系
  choice: 译为“为至高的上帝办妥”。
  alternative: 译为“向至高的上帝办妥”或“给至高的上帝完成”。
  rationale: 与格容许归向、利益或服事对象等理解；“为”在现代汉语中最自然，也不把句意限定为某一更细的礼仪关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“办妥”适合王令中的行政语境；“震怒”保持经文的严肃语气。脚注标记均置于正文对应位置。
