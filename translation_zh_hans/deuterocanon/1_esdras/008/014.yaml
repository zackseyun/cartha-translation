    rationale: εἰς ταύρους……表明金银的用途或目的，但没有明示“购买”这一动作。虽然由金银与牲畜的关系可推测购置，正文应保留原文较宽的表达。
  - severity: low
    issue: “他们主”不符合现代普通话通常的属格表达。
    rationale: αὐτῶν应自然译为“他们的”；补出“的”不增添语义，能改善可读性。
  - severity: low
    issue: 首个分句的中心名词省略，且与后面的“并将金银汇集起来”并列不够平衡。
    rationale: τῷ δεδωρημένῳ是“所赠予之物”；译出“礼物”，并把金银处理为“为……而汇集的金银”，可使汉语句法明确，同时更贴近被动不定式的语义。
  revised_text: 连同百姓为他们的主——在耶路撒冷的圣殿——所奉献的礼物，以及为公牛、公绵羊、羊羔和随同这些的物品而汇集的金银，
