revisions:
- from: 连同百姓为他们主在耶路撒冷的圣殿所自愿奉献的[a]，并将金银汇集起来，用来购买公牛、公绵羊、羊羔，以及与这些祭牲相配的一切[b]，
  to: 连同百姓为他们的主——在耶路撒冷的圣殿——所奉献的礼物，以及为公牛、公绵羊、羊羔和随同这些的物品而汇集的金银，
  rationale: 修订仅消除“购买”这一未在希腊文中明说的具体动作，调整属格和句法以符合现代汉语，并以“随同这些的物品”保持ἀκόλουθα的概括性。脚注保留希腊文本与《以斯拉记》7:16亚兰文平行经文之间的重要差异，也继续把对附属祭物的说明限定为可能解释。
