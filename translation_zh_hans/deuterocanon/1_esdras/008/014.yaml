base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/014.yaml
  text: together with what was freely given by the nation for the temple of their Lord in Jerusalem[a], and the gold and silver to be gathered for bulls and rams and lambs and what goes with them[b],
translation:
  language: zh_hans
  text: 连同百姓为他们的主——在耶路撒冷的圣殿——所奉献的礼物，以及为公牛、公绵羊、羊羔和随同这些的物品而汇集的金银，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους
  choice: 连同百姓……所自愿奉献的
  rationale: σύν表达附加关系；δεδωρημένῳ指作为礼物奉献之物，译为“所自愿奉献的”保留赠献意味。ἔθνος在此指集体性的民众，用现代汉语“百姓”比“国族”更自然，且不按马所拉文本改成君王和谋士。
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν Ἰερουσαλήμ
  choice: 为他们主在耶路撒冷的圣殿
  rationale: εἰς在奉献语境中表用途，译作“为”；ἱερόν译“圣殿”。保留αὐτῶν的“他们”和κύριος的“主”，不从平行文本补入“上帝”。
- source_word: συναχθῆναι, τό τε χρυσίον καὶ ἀργύριον
  choice: 并将金银汇集起来
  rationale: συναχθῆναι为不定式被动形式，语义是金银被聚集；汉语改用处置式以保持自然，同时不指定未明说的执行者。τε…καί自然合译为“金银”。
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: 用来购买公牛、公绵羊、羊羔
  rationale: εἰς表示金银的用途；在此语境中是用金银取得献祭牲畜，译出“购买”使汉语关系清楚，但不改变三类祭牲。κριούς明确为公羊，译“公绵羊”以区别泛称的羊。
- source_word: τὰ τούτοις ἀκόλουθα
  choice: 与这些祭牲相配的一切
  rationale: ἀκόλουθα字面为随同、相伴之物，所指可能是献祭所需的附属物品。译文保持概括性，不具体断定为素祭、奠祭等。
theological_decisions:
- issue: 本节希腊文本与《以斯拉记》7:16马所拉文本平行经文的显著差异
  choice: 依希腊文本译作“百姓为他们主……的圣殿所自愿奉献的”
  alternative: 按马所拉平行文本协调为“王和谋士甘心献给以色列上帝的金银；他的居所在耶路撒冷”
  rationale: 《以斯得拉一书》以希腊文本为主要依据；此处不应默默按平行的亚兰文文本改写。脚注说明差异，以保存文本见证的张力。
- issue: τὰ τούτοις ἀκόλουθα所指的祭祀用品
  choice: 保留为“与这些祭牲相配的一切”
  alternative: 明确译成“配套的供物”或具体列出素祭、奠祭
  rationale: 上下文很可能涉及配套祭物，但希腊语本身并未逐项说明，故不把推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。本节是较长句子的一部分，故结尾保留逗号。正文中的“主”严格对应希腊文κύριος；“百姓”传达ἔθνος在这里的集体含义。
