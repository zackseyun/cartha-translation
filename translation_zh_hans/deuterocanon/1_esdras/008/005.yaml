base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
translation:
  language: zh_hans
  text: '以色列子孙[a]、祭司、利未人、圣殿歌者、守门人和圣殿仆役[b]中，也有人一同上到耶路撒冷。


    [a] 或译“以色列人”。希腊文直译为“以色列的众子”。


    [b] 或译“圣殿奴仆”。这个希腊词可指受役于神圣事务的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希腊文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣殿奴仆”。这个希腊词可指受役于神圣事务的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανέβησαν
  choice: 一同上
  rationale: 保留复合动词中“共同、随同”与“上行”的含义；在圣经地理叙述中，前往耶路撒冷惯用“上”来表达。
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙中，也有人
  rationale: ἐκ 表明是从该群体中出来的一部分人；“以色列子孙”保留希腊文的亲属性集体称谓，同时用“中，也有人”使现代汉语自然。
- source_word: ἱερέων
  choice: 祭司
  rationale: 该祭司群体的标准汉语译法。
- source_word: Λευειτῶν
  choice: 利未人
  rationale: 该群体名称的通行汉语译法。
- source_word: ἱεροψαλτῶν
  choice: 圣殿歌者
  rationale: 该复合词指从事神圣礼仪歌唱的人；“圣殿歌者”清楚表达其圣殿职分，又避免增添原文没有的细节。
- source_word: θυρωρῶν
  choice: 守门人
  rationale: 自然、通行地表达负责看守或管理圣殿门户的人。
- source_word: ἱεροδούλων
  choice: 圣殿仆役
  rationale: 既表达其隶属圣殿事务的制度性角色，也保留服役意味；词中可能含有更强的奴役或受束缚色彩，故在脚注列出“圣殿奴仆”。
- source_word: εἰς Ἰερουσαλήμ
  choice: 上耶路撒冷
  rationale: 准确表达目的地；“上耶路撒冷”符合圣经叙事及现代汉语中的传统地理表达。
theological_decisions:
- issue: 如何翻译名单中的 υἱῶν Ἰσραήλ
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 主文保留原文直陈的亲属性集体称谓，不把其中的形式差异抹平；脚注提供现代汉语更简洁的功能对等译法。
- issue: 如何翻译 ἱερόδουλοι
  choice: 圣殿仆役
  alternative: 圣殿奴仆
  rationale: 在圣殿人员名单中，“圣殿仆役”最清楚地传达其制度性职分，同时不武断断定其确切法律身份；原词可能具有受奴役或受束缚服役的意味，故以脚注保留较强译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“中，也有人”明确表达 ἐκ 所指的部分成员；“一同上”保留 συν- 的共同上行意味。脚注标记紧随各自所解释的词语，避免把关于“圣殿仆役”的脚注误接到“耶路撒冷”之后。
