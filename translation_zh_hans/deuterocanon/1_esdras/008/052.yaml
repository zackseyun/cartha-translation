base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: zh_hans
  text: 因为我因羞愧，不敢请求骑兵和步兵作护卫，以保障我们免受那些敌对我们之人的侵害。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骑兵和步兵”也可译为“骑马的兵士和徒步的兵士”。
    reason: 保留ἵππεις与πεζούς的较直译性军事用语替代译法。
lexical_decisions:
- source_word: ἐνετράπην
  choice: 我不好意思
  rationale: 表达因羞愧而不愿开口请求的意味；比“我尴尬”庄重自然，也不把语气强化为道德羞耻。
- source_word: αἰτῆσαι
  choice: 请求派
  rationale: 结合所求的是军事人员，用“请求派”自然体现向掌权者请求差遣护卫之意。
- source_word: ἵππεις
  choice: 骑兵
  rationale: 准确表达骑马作战或护卫的人员，并与“步兵”形成清楚对举。
- source_word: πεζοὺς
  choice: 步兵
  rationale: 指徒步军士；现代汉语简洁明确。
- source_word: προπομπὴν
  choice: 护送我们
  rationale: 该词在此指随行保障旅程的护卫；译为动词结构更符合现代汉语。
- source_word: ἕνεκεν ἀσφαλείας
  choice: 使我们免受……的威胁
  rationale: 按目的关系表达获得安全保护，避免生硬直译“为了安全”。
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: 敌对者的威胁
  rationale: 保留ἐναντίους“与我们敌对的人”这一较宽泛含义，不武断限定为正式交战的敌军。
theological_decisions:
- issue: 与所提供的马所拉文本平行经文内容不一致
  choice: 直接翻译希腊文关于请求军事护送的陈述
  alternative: 依所附希伯来文改译为禁食祈求并蒙应允
  rationale: 本节的主要文本依据是《七十士译本》希腊文；所附希伯来文实质上对应另一节内容，不能据此取代或协调希腊文本。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“不好意思”传达因羞愧而不愿请求的语气；“免受敌对者的威胁”自然呈现护送所要达到的安全目的。
