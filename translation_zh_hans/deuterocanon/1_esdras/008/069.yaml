base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: zh_hans
  text: 凡因以色列之主的话[a]而受到触动的人，在我为这不法之事哀恸时，都聚集到我这里；我满心忧伤地坐着，直到献晚祭的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“因以色列之主的话”。这句话也可能是压缩的称号，意为“因主——以色列的上帝——的话”。
    reason: 保留希腊文神圣称号结构的歧义，并交代另一种有平行传统支持的理解。
lexical_decisions:
- source_word: ἐπισυνήχθησαν πρὸς μέ
  choice: 都聚集到我这里
  rationale: 表达众人一同来到叙述者身边；中文自然，也保留了聚集的群体性。
- source_word: ὅσοι ποτὲ ἐπεκινοῦντο
  choice: 凡……受到触动的人
  rationale: ἐπεκινοῦντο表示内心被激动、促动；“受到触动”既保留被动意味，也不把反应具体化为恐惧或顺服。ποτέ在这里加强涵盖范围，以“凡……的人”自然表达。
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: 因以色列之主的话
  rationale: 紧贴现存希腊文的压缩结构，不在正文中补入希腊文没有明说的“上帝”；可能的完整称号在脚注说明。
- source_word: ἐμοῦ πενθοῦντος ἐπὶ τῇ ἀνομίᾳ
  choice: 我为这不法之事哀恸
  rationale: 以时间上同时发生的中文叙述表达属格绝对结构；“不法之事”直接反映ἀνομία所含违背律法的意味。
- source_word: ἐκαθήμην περίλυπος
  choice: 满心忧伤地坐着
  rationale: 同时保留坐着的姿态与深重悲痛；“满心忧伤”比单纯“难过”更符合περίλυπος的强度。
- source_word: ἕως τῆς δειλινῆς θυσίας
  choice: 直到献晚祭的时候
  rationale: 指傍晚例常献祭的时刻；加入“献……的时候”使现代中文清楚自然，同时保留祭祀背景。
theological_decisions:
- issue: Κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: “主”符合七十士译本中κύριος的直接表达，也不把希伯来神名反向补入希腊正文。
- issue: Κυρίου τοῦ Ἰσραήλ这一神圣称号的压缩结构
  choice: 正文译作“以色列之主”，脚注说明也可能意指“主——以色列的上帝”
  alternative: 主——以色列的上帝
  rationale: 现存希腊文字面为“以色列之主”，但同类圣经称号及平行传统支持将其理解为“以色列的上帝”。把另一理解置于脚注，可避免在正文中无声消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“受到触动”避免过度限定人物的内在反应；“不法之事”“晚祭”保留律法与敬拜语境。脚注标记[a]已置于相关短语所在句末。
