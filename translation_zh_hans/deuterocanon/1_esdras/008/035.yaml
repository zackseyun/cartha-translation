base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: zh_hans
  text: 约押的子孙中，有耶泽路的儿子阿巴底亚[a]，与他同来的有二百一十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》8:12的希伯来文平行经文在此处记载不同，所列的是以拦的后裔，并说有七十名男子。本译文以《以斯德拉一书》的希腊文见证为依据，不将其改成与希伯来文平行经文一致。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: 约押的子孙中
  rationale: υἱοί在家谱和名单语境中可指后裔或宗族成员；译作“子孙”比字面的“儿子们”更符合现代汉语，同时保留其谱系含义。
- source_word: Ἀβαδίας
  choice: 阿巴底亚
  rationale: 按希腊文名形音译，不以其可能对应的希伯来名字替代。
- source_word: Ἰεζήλου
  choice: 耶泽路
  rationale: 按希腊文属格形式所指的人名音译；正文依从希腊见证，不与希伯来平行经文协调。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 与他同来的
  rationale: 在同行人员名单中自然表达“和他一起”的意思；“来的”由上下文补出，使汉语通顺。
- source_word: ἄνδρες
  choice: 人
  rationale: 此处是在列举随行者人数；译作“人”自然且不额外强化生理性别。希腊文用ἄνδρες，而非希伯来平行经文中的“男性”。
- source_word: διακόσιοι δέκα δύο
  choice: 二百一十二
  rationale: 准确表达希腊文数字212。
