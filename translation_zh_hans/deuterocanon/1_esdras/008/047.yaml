base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/047.yaml
  text: a man of understanding[a], from the sons of Mooli, son of Levi, son of Israel—Asebebias, and his sons and brothers, ten[c][b];
translation:
  language: zh_hans
  text: 一位有见识的男子，出自以色列的儿子利未的儿子摩利[a]的子孙，即亚舍比比亚[b]，连同他的儿子和弟兄，共十人[c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文作“玛利”，而不是希腊文这里的“摩利”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文平行经文中，这人的名字是“示利比雅”；希腊文这里作“亚舍比比亚”。
    reason: alternative_reading
  - marker: c
    text: 希伯来文平行经文作“十八人”，而不是“十人”。
    reason: textual_variant
lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: 一个有见识的人
  rationale: ἄνδρα明确指一名男子；ἐπιστήμονα表示有知识、判断力或才干。“有见识”既自然，也与希伯来文平行经文的שֶׂכֶל（悟性、见识）相符。
- source_word: τῶν υἱῶν Μοολὶ
  choice: 出自……摩利的子孙
  rationale: υἱοί在谱系语境中可泛指后裔；译作“子孙”比逐字译作“儿子们”更符合现代汉语，同时依照主要希腊文本音译Μοολί为“摩利”。
- source_word: τοῦ Λευὶ τοῦ Ἰσραὴλ
  choice: 以色列的儿子利未的儿子
  rationale: 希腊文连续属格表达谱系关系；补出“儿子”使世系链条在汉语中清楚，并保留原文从以色列到利未、再到摩利的关系。
- source_word: Ἀσεβηβίαν
  choice: 亚舍比比亚
  rationale: 依主要希腊见证音译该专名，不以希伯来文平行经文的“示利比雅”取代；异文另见脚注。
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφοὺς
  choice: 他的儿子和弟兄
  rationale: 此短语紧接人名，最自然地理解为亚舍比比亚的儿子和弟兄；“儿子”保留希腊文阳性、谱系性的表达。
- source_word: δέκα
  choice: 十人
  rationale: 主要希腊文本明确作“十”；汉语补出量词“人”以表达人数。希伯来文平行经文作“十八人”，在脚注中说明。
