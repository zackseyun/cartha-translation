base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: zh_hans
  text: 我禁食之后起身，身上的衣服和圣服[a]都已撕裂。我屈膝，向主伸出双手，说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的衣袍”。原文没有明确称它为“祭司袍”。
    reason: lexical_alternative
  - marker: b
    text: “说”所译的希腊词，其词形既可解作“我当时说”，也可解作“他们当时说”；这里的上下文指向以斯拉开始祷告。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: 我禁食之后起身
  rationale: 分词结构表示从禁食转入祷告的动作次序；用“禁食之后起身”自然传达这一过渡，也保留第一人称语境。
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: 身上的衣服……都已撕裂
  rationale: 完成时分词强调衣服处于撕裂后的状态；“都已撕裂”简洁而庄重。
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: 圣服
  rationale: ἱερά明确表示神圣、分别为圣，ἐσθής指衣服或袍服；“圣服”保留其宗教用途，但不擅自限定为祭司服。
- source_word: κάμψας τὰ γόνατα
  choice: 我屈膝
  rationale: 贴近希腊文“弯曲双膝”的祷告姿态，同时符合现代汉语表达。
- source_word: ἐκτείνας τὰς χεῖρας
  choice: 向主伸出双手
  rationale: 准确呈现祷告时伸手的动作，并与πρὸς τὸν κύριον自然结合。
- source_word: πρὸς τὸν κύριον
  choice: 向主
  rationale: κύριος在此是对上帝的敬称；“主”符合本项目惯例和祷告语境。
- source_word: ἔλεγον
  choice: 说
  rationale: 该形态可作第一人称单数或第三人称复数；上下文以以斯拉的祷告为中心，汉语用不标明时态和数的“说”可自然引出下文，并避免过度解释形态上的歧义。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 祷告语境表明这是对上帝的尊称；“主”既准确又符合现代中文圣经语体。
- issue: 是否把ἱερὰν ἐσθῆτα明确译为祭司服
  choice: 圣服
  alternative: 祭司袍
  rationale: 原文只明确说这衣服是神圣的，并未在该词组中直接说明其为祭司服；译文不加入更强的身份限定。
- issue: ἔλεγον的人称与数
  choice: 按上下文以第一人称叙述，并用中性的“说”引出祷告
  alternative: 他们说／我当时说
  rationale: 希腊词形本身容许第一人称单数或第三人称复数；句中阳性单数分词及随后以斯拉的祷告支持第一人称语境，但脚注保留形态歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“我”顺应希腊文主句可能的第一人称及祷告上下文；保留“圣服”与动词词形的真实歧义，并将脚注标记放在对应词语之后。
