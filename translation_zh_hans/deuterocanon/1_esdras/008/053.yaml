base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: zh_hans
  text: 因为我们曾告诉王，我们主的力量必与寻求他的人同在，为着一切的恢复[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语这一短语较为罕见，也可译作“为了一切的恢复”；有些解释者较宽泛地理解为“为使凡事顺利”或“为得到美好的结果”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来平行经文明显不同，所说的是禁食并寻求上帝，而不是提到先前对王所说的话。本译文以《以斯拉一书》的希腊文本为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: 曾告诉
  rationale: 该动词表示过去发生的言说；上下文表明这是先前对王说过的话。“告诉”比单用“说”更自然地体现对明确对象讲话。
- source_word: Ἰσχὺς
  choice: 力量
  rationale: ἰσχύς表示力量、能力或大能。“力量”清楚自然，也避免将其过度抽象化。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主的
  rationale: 在这一犹太希腊语语境中，κύριος敬称以色列的上帝；译作“主”既庄重，也符合七十士译本的常见表达。
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: 与寻求他的人同在
  rationale: ἐπιζητέω可含殷切寻求之意，但此处用现代汉语的“寻求”已经自然传达核心意义；μετά译作“与……同在”。
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: 为使一切恢复正常
  rationale: ἐπανόρθωσις指恢复、纠正或重新建立。此处希腊语搭配罕见；正文用“使一切恢复正常”表达其目的或结果方向，同时由脚注保留较贴字面的其他理解。
theological_decisions:
- issue: 指称上帝的κύριος如何翻译
  choice: 主
  alternative: 主人
  rationale: 此处所指为以色列的上帝。“主”保留敬称和七十士译本传统，又不引入特定宗派解释。
- issue: 如何处理εἰς πᾶσαν ἐπανόρθωσιν这一含义不寻常的短语
  choice: 为使一切恢复正常
  alternative: 为着一切的恢复；为使凡事顺利
  rationale: 正文保留ἐπανόρθωσις的“恢复、纠正”语义，不按希伯来平行经文加以协调；脚注说明该短语也可能泛指成功或良好结果。
- issue: 希腊文本与希伯来平行文本的明显差异
  choice: 以《以斯拉一书》的希腊文本为正文依据
  alternative: 按希伯来平行文本译为禁食并祈求上帝
  rationale: 本段翻译对象是希腊文《以斯拉一书》；希伯来文本仅作平行见证，不能取代这里差异显著的主要文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我们主的力量”保留希腊语的名词结构；“为使一切恢复正常”使不寻常的末尾短语在汉语中可读，同时不把其含义限定为宗教复兴或物质兴盛。脚注标记均置于相关句末。
