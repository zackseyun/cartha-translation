base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: zh_hans
  text: 撒托厄[a]的子孙中，有耶哥尼雅，就是耶特勒的儿子，同他一起的有二百名男子；亚丁的子孙中，有乌本[b]，就是约拿单的儿子，同他一起的有二百五十名男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文中的家族名为“撒托厄”；近似的马所拉文本平行经文所载名字不同。
    reason: alternative_reading
  - marker: b
    text: “乌本”音译自形式不完全确定的希腊名字 Οὐβὴν；也可音译为“欧本”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: ……的子孙中
  rationale: 此短语表示从某一家族或宗族中列出成员；这样译既保留名单结构，也符合现代汉语表达。
- source_word: Ζαθόης
  choice: 撒托厄
  rationale: 以《七十士译本》的希腊形式为主要依据音译，不用近似的马所拉文本平行经文来统一人名。
- source_word: Εἰεχονίας
  choice: 耶哥尼雅
  rationale: 按希腊名字的语音并兼顾普通中文读者较易辨认的圣经人名形式音译。
- source_word: Ἰεθήλου
  choice: 就是耶特勒的儿子
  rationale: 希腊文以属格人名表达父子关系；中文明确补出“儿子”，使名单中的父名关系清楚。
- source_word: μετʼ αὐτοῦ
  choice: 同他一起的
  rationale: 直接保留随同领队之人的名单公式，表达自然而不作额外解释。
- source_word: ἄνδρες
  choice: 男子
  rationale: 希腊词明确指男性，而非泛指所有人，因此译作“男子”。
- source_word: Ἀδείν
  choice: 亚丁
  rationale: 按希腊形式音译为现代中文人名。
- source_word: Οὐβὴν
  choice: 乌本
  rationale: 紧贴所传希腊形式 Οὐβὴν 音译；该名字的具体还原并不确定，故在脚注保留其他可能。
- source_word: Ἰωνάθου
  choice: 就是约拿单的儿子
  rationale: 此属格人名在名单中作父名，补出“儿子”以符合清楚自然的现代汉语。
- source_word: διακόσιοι / διακόσιοι πεντήκοντα
  choice: 二百 / 二百五十
  rationale: 忠实直译基数词，并采用简洁的中文数字表达。
