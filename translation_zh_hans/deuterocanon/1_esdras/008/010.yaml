base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: zh_hans
  text: 我既决定采取仁厚之举，便下令：犹太民族中凡自愿并自行选择[a]的人，以及祭司、利未人和我国境内的这些人，都应当与你一同前往耶路撒冷。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里有两个与意愿或选择有关的词；后一个词形罕见，可能进一步强调出于自愿的选择。也可译作“愿意自行作出选择的人”。
    reason: lexical_alternative
  - marker: b
    text: 所附的希伯来文平行材料在这里内容大不相同，讲的是以斯拉立志考究、遵行并教导耶和华的律法；本译文依照《以斯得拉一书》的希腊文本。
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: 合乎仁厚
  rationale: 该带冠词的中性复数作名词性用法，指仁慈、宽厚而合乎人道的处置；译为“合乎仁厚”既保留道德色彩，也适合王室诏令语体。
- source_word: κρίνας
  choice: 认为
  rationale: 此处是不定过去时分词，表示君王经过衡量后作出判断；“认为”与后面的“下令”衔接自然，同时不把它弱化为单纯感觉。
- source_word: προσέταξα
  choice: 便下令
  rationale: 该动词表示权威性的命令或指示；“下令”符合王室行政语境。
- source_word: τοὺς βουλομένους
  choice: 凡自愿……的人
  rationale: 分词明确表达当事人的意愿；“自愿”在现代汉语中简洁自然。
- source_word: αἱρετίζοντας
  choice: 并自行选择
  rationale: 这是罕见且解释有困难的形式，语境中很可能进一步强调自主选择；直译式表达保留它与“自愿”的并列和重复强调。
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: 犹太民族中
  rationale: ἔθνος在此指族群；“犹太民族中”自然地表达来源范围，不误解为外邦人。
- source_word: τῶν ἱερέων
  choice: 祭司
  rationale: 采用该宗教职分的标准现代汉语译名。
- source_word: τῶν Λευειτῶν
  choice: 利未人
  rationale: 采用该族群及圣职群体的标准汉语名称。
- source_word: τῶνδε
  choice: 这些人
  rationale: 希腊文的指示代词在此较突兀，所指也不完全清楚；译为“这些人”保留其指示性和原文的省略感，不擅自补出“其他人”。
- source_word: συμπορεύεσθαί σοι
  choice: 与你一同前往
  rationale: 准确表达同行、结伴前往之意，并符合现代庄重汉语。
theological_decisions:
- issue: 希腊文本与所附马所拉文本平行材料严重不一致
  choice: 正文依照《以斯得拉一书》的现存希腊文，译出王命准许人员随以斯拉前往耶路撒冷。
  alternative: 采用希伯来文所述以斯拉立志考究、遵行并教导耶和华律法的内容。
  rationale: 本条目的首要原文依据是希腊文；希伯来材料显然对应另一处或不同编排，不能取代本节希腊正文。脚注说明差异，以免暗中调和。
- issue: αἱρετίζοντας与τοὺς βουλομένους的关系
  choice: 译为“凡自愿并自行选择的人”，保留两项并列及对自愿性的重复强调。
  alternative: 把罕见形式理解为使役或选择他人，或将两词合并只译作“愿意的人”。
  rationale: 该形式罕见，句法存在真实歧义；正文采用最符合上下文的自主选择义，同时在脚注保留另一种可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“我既认为……便下令”体现王室行政口吻；保留“自愿并自行选择”的轻微重复，以反映希腊文对自愿性的强调。
