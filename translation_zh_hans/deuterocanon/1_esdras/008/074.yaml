base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: zh_hans
  text: 因我们和我们祖先的罪，我们同我们的弟兄、君王和祭司一起，都被交在地上的君王[a]手中，遭受刀剑、被掳和劫掠，蒙受羞辱，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上的君王”也可译作“土地的君王”。希腊文 γῆ 既可指“大地”，也可指“土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: 因为我们和我们祖先的罪
  rationale: διά加宾格表示原因；这样译清楚自然，并保留当代群体与先祖之罪并列的结构。πατέρες在此指历代祖先，译作“祖先”比字面的“父辈”更符合现代汉语的群体哀告语境。
- source_word: παρεδόθημεν
  choice: 都被交在……手中
  rationale: 保留被动含义，表达落入他人权下；补出汉语惯用的“手中”，使句意明确而不改变原意。
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν
  choice: 连同弟兄
  rationale: 保留ἀδελφοί的直译“弟兄”；在民族共同体语境中可泛指同胞，但正文不替原文消解这一语义范围。
- source_word: σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: 君王和祭司
  rationale: 与“我们”共享领属关系；汉语在前文已有“我们”时省略重复的“我们的”，仍清楚指本族的君王和祭司。
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: 地上的君王
  rationale: γῆ可指“地”或“土地”；“地上的君王”保留较宽的圣经表达，同时脚注说明另一可能。
- source_word: εἰς ῥομφαίαν
  choice: 遭受刀剑
  rationale: “刀剑”在审判和战争语境中转指杀戮；加“遭受”使三个灾祸在现代汉语中顺畅并列。
- source_word: αἰχμαλωσίαν
  choice: 被掳
  rationale: 表达被俘、陷入囚禁的事件，较名词“囚禁”更自然，也保留战争与流亡背景。
- source_word: προνομὴν
  choice: 劫掠
  rationale: 该词表示抢掠或成为掠物；“劫掠”清楚传达遭人掠夺的灾祸。
- source_word: μετὰ αἰσχύνης
  choice: 蒙受羞辱
  rationale: αἰσχύνη涵盖羞耻与耻辱；“蒙受羞辱”自然表达灾难伴随的社会性屈辱。
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: 直到今日
  rationale: 准确表达这种受审判的处境延续到说话者当下，且符合庄重的现代汉语。
theological_decisions:
- issue: 跨世代的群体罪责
  choice: 保留“我们和我们祖先的罪”
  alternative: 弱化为“我们民族历来的罪”或仅说“我们的罪”
  rationale: 希腊文明确并列当代群体与祖先的罪，并将受罚原因归于两者；译文保留这种群体认同和跨世代责任的张力，不加以淡化或系统化解释。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。用“弟兄、君王、祭司、刀剑、被掳”等常见圣经词汇保持历史和礼仪语感；调整为汉语自然语序，但保留原文的因果关系、被动结构、灾祸三联项及末尾的时间延续语。
