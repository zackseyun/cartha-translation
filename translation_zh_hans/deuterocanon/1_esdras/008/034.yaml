base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: zh_hans
  text: 梭佛提的子孙中，有米迦勒的儿子撒赖亚[a]；与他同来的有七十名男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希腊文的人名和人数与《以斯拉记》8:6的近似希伯来文平行经文不同；后者作“亚丁的子孙中，有约拿单的儿子俄别；与他同来的男丁有五十人”。本译文以希腊文为据，保留其人名和人数。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Σοφοτίου
  choice: 梭佛提的子孙中
  rationale: ἐκ加属格表示从一个群体中选出；“子孙中”自然保留谱系名单的表达。Σοφοτίου按希腊文音译为“梭佛提”，不依近似的希伯来文平行经文改名。
- source_word: Ζαραίας
  choice: 撒赖亚
  rationale: 按希腊文人名音译，避免与以斯拉记8:6的近似希伯来文平行经文协调。
- source_word: Μειχαήλου
  choice: 米迦勒的儿子
  rationale: 此处无冠词属格在谱系名单中最自然地表示父子关系；中文补出“的儿子”以明确关系。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 与他同来的有
  rationale: μετά加属格表示随同；在回归人员名单的语境中，“与他同来的有”比逐字译法更自然。
- source_word: ἄνδρες
  choice: 人
  rationale: 原词指男性，但现代中文在此类人员计数中用“人”即可自然表达；不额外加入原文没有的年龄限定。
- source_word: ἑβδομήκοντα
  choice: 七十
  rationale: 直接译出基数词。
