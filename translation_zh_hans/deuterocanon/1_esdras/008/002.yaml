base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: zh_hans
  text: 撒杜卢库[a]的儿子，亚希托伯的儿子，亚马提乌的儿子，乌西雅的儿子，博卡的儿子，亚贝赛的儿子，非尼士[b]的儿子，以利亚撒的儿子，亚伦——第一位祭司[c]——的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本所列谱系比现存的简短希伯来语平行文本更长；后者作：“沙龙的儿子，撒督的儿子，亚希突的儿子。”
    reason: alternative_reading
  - marker: b
    text: 这里几个名字采用希腊语形式音译；在相关希伯来谱系中，亚希托伯、乌西雅、博卡、亚贝赛、非尼士通常分别对应亚希突、乌西、布基、亚比书、非尼哈。
    reason: lexical_alternative
  - marker: c
    text: “第一位祭司”也可理解为“首要的祭司”。原文只说“祭司”，并未使用专指“大祭司”的希腊词。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 谱系中反复出现的属格省略了亲属关系；平行的希伯来语谱系明确使用“儿子”（בֶּן־）。译作“……的儿子”既交代关系，也符合现代汉语谱系表达。
- source_word: Σαδδουλούκου
  choice: 撒杜卢库
  rationale: 按希腊语专名音译，不以较短的希伯来语平行文本中的“沙龙”取代，避免把两个不同的文本传统强行调和。
- source_word: Ἀχειτὼβ
  choice: 亚希托
  rationale: 依希腊语形式音译；其较熟悉的希伯来语对应形式“亚希突”在脚注说明。
- source_word: Ἀμαρθείου
  choice: 亚马提乌
  rationale: 保留希腊文本所列的祖先，并依希腊语形式音译，不因所引希伯来语平行文本较短而删去。
- source_word: Ὀζείου
  choice: 乌西雅
  rationale: 采用自然的汉语音译；此名在相关希伯来谱系中通常对应“乌西”，故在脚注交代。
- source_word: Βοκκὰ
  choice: 博卡
  rationale: 依希腊语形式音译；不在正文中改成希伯来语传统下较熟悉的“布基”。
- source_word: Ἀβεισαὶ
  choice: 亚贝赛
  rationale: 依希腊语形式音译；其希伯来语对应名“亚比书”列于脚注。
- source_word: Φεινεὲς
  choice: 非尼士
  rationale: 采用贴近希腊语形式且在汉语中顺畅的音译；其希伯来语传统下的常见译名“非尼哈”列于脚注。
- source_word: Ἐλεαζὰρ
  choice: 以利亚撒
  rationale: 采用此圣经人物在现代中文中的通行译名，准确对应希腊语名字。
- source_word: Ἀαρὼν
  choice: 亚伦
  rationale: 采用此圣经人物在现代中文中的通行译名。
- source_word: τοῦ πρώτου ἱερέως
  choice: 第一位祭司
  rationale: πρῶτος直译为“第一位”，ἱερεύς为“祭司”。正文不擅自加入原文没有的“大祭司”（ἀρχιερεύς）称号，同时以脚注保留“首要的祭司”这一可能理解。
theological_decisions:
- issue: 应保留希腊文本较长的谱系，还是按较短的希伯来语平行文本调和
  choice: 正文完整保留希腊谱系
  alternative: 按希伯来语平行文本缩写为“沙龙的儿子，撒督的儿子，亚希突的儿子”
  rationale: 《以斯得拉一书》以希腊文本为主要依据；希腊文明确列出较长的祖先序列，因此不应在正文中删减或重排。较短的希伯来语平行读法在脚注中说明。
- issue: τοῦ πρώτου ἱερέως应译作“第一位祭司”、“首要的祭司”还是“大祭司”
  choice: 第一位祭司
  alternative: 首要的祭司；第一位大祭司
  rationale: 原文用πρῶτος和ἱερεύς，字面是“第一位祭司”。“首要的”在语义上可能成立，故以脚注保留；“大祭司”则通常对应ἀρχιερεύς，正文不补入该专门称号。
translation_notes:
  register: 采用现代、庄重而易懂的谱系体。专名以希腊文本为锚点音译，但对亚伦、以利亚撒等已有稳定中文传统的名字采用通行译名。句子本身承接上一节，属于谱系片段；重复“……的儿子”以清楚呈现每一代关系。
