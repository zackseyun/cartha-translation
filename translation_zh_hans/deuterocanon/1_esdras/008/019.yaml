base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: zh_hans
  text: “看哪，我，亚达薛西王，已经下令给叙利亚和腓尼基的司库：无论祭司、至高上帝律法的宣读者[b]以斯拉索取什么[a]，他们都要仔细地供给他，最多一百他连得银子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索取”：希腊文动词字面意思是“派遣”或“发送”；在这里的供应语境中，很可能指派遣请求或传达所需物资。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“律法的宣读者”。平行的以斯拉传统常称他为“文士”，但这里的希腊文本明确使用“宣读者”。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξα
  choice: 已经下令
  rationale: 表达不定过去时所指的权威性王令；“下令”自然、简洁，也保留君王命令的力度。
- source_word: γαζοφύλαξι
  choice: 司库
  rationale: 指负责保管和支取库银的官员；“司库”庄重而简明。
- source_word: Συρίας καὶ Φοινίκης
  choice: 叙利亚和腓尼基
  rationale: 采用现代中文通行的历史地名译法。
- source_word: ἀποστείλῃ
  choice: 派人来索取
  rationale: 该动词字面为“派遣、发送”；在物资供应的语境中，意指以斯拉派人传达需求或领取物资。正文保留“派人”的字面成分，同时明确语境中的索取含义。
- source_word: ἀναγνώστης
  choice: 宣读者
  rationale: 希腊文明确称以斯拉为律法的“读者、宣读者”，不以平行传统中的“文士”替换本见证的措辞。
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高上帝律法的
  rationale: 将属格关系自然地表达为“至高上帝律法的宣读者”，保留“至高”这一神圣称号。
- source_word: ἐπιμελῶς
  choice: 尽心
  rationale: 表达认真、周到地执行供给命令，不额外限定为迅速或精确。
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: 银子最多一百他连得
  rationale: ἕως表示获准支取的上限；“最多”在现代中文中清楚表达这一限额。“他连得”保留古代重量兼货币单位。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留希腊文的提示与强调语气；在王令体裁中具有庄重效果。
theological_decisions:
- issue: 神圣称号 τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高上帝
  alternative: 至高者上帝；至高的上帝
  rationale: “至高上帝”是自然且庄重的现代中文称号，保留原文对上帝至高地位的强调，不引入额外教义解释。
- issue: 以斯拉的身份 ἀναγνώστης
  choice: 宣读者
  alternative: 读者；文士
  rationale: 本希腊见证使用“宣读者”而非“文士”。保留这一差异，避免借平行传统消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的王令语体。“看哪”保留原文的强调；“司库”“宣读者”准确反映官职与身份。“尽心供给”避免生硬直译，同时不把 ἐπιμελῶς 过度解释为“立即”或“如数”。脚注标记均置于正文对应词语之后。
