base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/017.yaml
  text: And concerning your holy vessels that are being given for the use of the house of your God in Jerusalem,[a]
translation:
  language: zh_hans
  text: 至于你那些为供你上帝在耶路撒冷的圣殿使用而交付的圣器，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在原文中承接上文，语意尚未完结。“圣殿”也可译作“圣所”。
    reason: 说明句法承接关系及ἱερόν的词义范围。
lexical_decisions:
- source_word: κατὰ
  choice: 至于
  rationale: 在行政文书的延续语境中，此介词短语引出所论事项；“至于”既自然，也保留本句作为未完句段的承接性质。
- source_word: ἱερὰ σκεύη
  choice: 圣器
  rationale: σκεύη 指器具或器皿，ἱερὰ 表明其已分别为圣；“圣器”简洁保留礼仪用途，又不武断限定具体器型。
- source_word: τὰ διδόμενα
  choice: 所交付的
  rationale: 现在时被动分词修饰“圣器”，表示这些器物正被给予或移交；中文以“所交付的”自然表达其被动与行政语气。
- source_word: εἰς τὴν χρείαν
  choice: 为供……使用
  rationale: χρεία 在此指实际用途或需要；结合圣殿器具的语境，“为供……使用”比直译“为……的需要”更清楚。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν 直接指圣殿或圣所。以希腊文为首要依据，译作“圣殿”，不以闪语平行文本中的“殿/房屋”取代原词。
- source_word: τοῦ θεοῦ σου
  choice: 你上帝的
  rationale: 保留第二人称单数所属关系及原文直接称呼的语气。
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: 耶路撒冷……的
  rationale: 此定冠词结构标明圣殿所在地；在中文中前置地点，形成自然的“耶路撒冷你上帝的圣殿”。
theological_decisions:
- issue: τοῦ ἱεροῦ 应译为“圣殿”还是依闪语平行文本译为“你上帝的殿”
  choice: 圣殿
  alternative: 你上帝的殿
  rationale: 主要翻译锚点是希腊文，ἱερόν 明确表示圣殿或圣所；平行文本只作参照，不应覆盖希腊文本身的措辞。两种表达所指相同，并无必要借此引入额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文作为连续行政文书中未完句段的形式，以逗号收束；“为供……使用而交付”兼顾希腊语修饰层次与中文可读性。
