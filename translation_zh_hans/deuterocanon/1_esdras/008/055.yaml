base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/055.yaml
  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
translation:
  language: zh_hans
  text: 我从祭司首领中选出十二个人，以及埃塞雷比亚[a]和阿索阿米亚[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃塞雷比亚”可能对应《以斯拉记》8:24希伯来文本中的“示利比雅”。
    reason: alternative_reading
  - marker: b
    text: “阿索阿米亚”可能对应《以斯拉记》8:24希伯来文本中的“哈沙比雅”。
    reason: alternative_reading
  - marker: c
    text: 这里的希腊文本比《以斯拉记》8:24的希伯来平行经文简短；后者在两个人名之后还提到“他们弟兄中的十个人”，并在8:25接着记述称量银、金和器皿。
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: 分别出
  rationale: 保留“使之与群体分开、选定出来”的基本意义，也符合此处委派人员的语境；第二处补出同一动词，使汉语句意完整。
- source_word: φυλάρχων τῶν ἱερέων
  choice: 祭司的族长
  rationale: φυλάρχων指支派、宗族或家族的首领；这里受“祭司的”限定。译作“族长”比笼统的“首领”更能保留原词的群体结构含义，同时不把具体制度解释得过死。
- source_word: ἄνδρας δέκα δύο
  choice: 十二个人
  rationale: ἄνδρας在此指成年男性；中文语境已由祭司领袖明确身份，“十二个人”自然且准确。
- source_word: Ἐσερεβίαν
  choice: 埃塞勒比亚
  rationale: 以希腊文本的姓名形式为翻译依据作音译；与希伯来平行经文中的“示利比雅”之对应关系留在脚注说明。
- source_word: Ἀσοαμίαν
  choice: 阿索阿米亚
  rationale: 依希腊文本音译，不以希伯来平行经文的姓名形式取代主文本读法；可能对应“哈沙比雅”，在脚注交代。
- source_word: καὶ
  choice: 又
  rationale: 按通常并列意义处理，呈现十二人之外又列出两个人名的表面句法；不将其擅自改释为“即”。
theological_decisions:
- issue: 十二人与随后两个人名之间的关系
  choice: 以“又”保留希腊文的并列结构，使两个人名在表面句法上另列于十二人之后
  alternative: 将两个人名理解为十二人中的成员，译作“就是”或“其中有”
  rationale: 希腊文καὶ通常表示并列，而且原句没有明确的同位说明。希伯来平行经文的结构与此不同，因此不宜借平行经文在正文中消除希腊文自身的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文紧贴希腊文本，保留其未完展开的简短并列结构；专名依希腊形式音译，希伯来平行经文中的对应姓名及内容差异放入脚注。
