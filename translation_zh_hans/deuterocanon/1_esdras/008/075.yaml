base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: zh_hans
  text: 如今，主——主暂时向我们施怜悯，为要在这圣地给我们留下根和名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: 一点
  rationale: 原语表示有限的程度或分量；译作“一点”保留其含蓄性，不强行判定为时间上的“片刻”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 准确表达在困境中从主而来的慈悲与恩待。
- source_word: τοῦ κυρίου Κυρίου
  choice: 主——主
  rationale: 保留希腊文本中称号的重复，并用破折号使现代汉语读者能够自然读出这一强调。
- source_word: ῥίζαν καὶ ὄνομα
  choice: 根和名
  rationale: 按原文保留两个具体意象，不把“根”解释性改写为“余民”，也不淡化“名”所表达的存续与身份。
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: 在这圣所之地
  rationale: 将属格结构自然译出，指向分别为圣、与圣所相关的地方，同时避免增添原文没有的限定。
theological_decisions:
- issue: 神圣称号 κύριος Κυρίου 的重复
  choice: 主——主
  alternative: 主上帝／主耶和华
  rationale: 希腊文本本身重复“主”；不借平行经文消除重复，也不把第二个称号改成希腊文未明写的专名。
- issue: ῥίζαν 的群体性含义
  choice: 根
  alternative: 余民
  rationale: “根”是原文明确使用的隐喻；保留它可避免将意象预先解释成某一特定群体概念。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“施了一点怜悯”符合汉语表达；“得以留下根和名”保留原文鲜明意象及神学张力。
