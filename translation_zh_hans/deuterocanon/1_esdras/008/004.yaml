  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
translation:
  language: zh_hans
  text: 王赐给他尊荣[a]，因为他在王面前、在他一切请求上都蒙恩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“荣耀”；这里指君王所赐的尊崇、显扬或声望。
    reason: lexical_alternative
  - marker: b
    text: 原文此处较为简略。“请求”译自一个也可指“职任”“尊位”或“资格”的词；本句也可理解为他在王面前，就自己的一切职任或尊位而蒙恩。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ὁ βασιλεὺς δόξαν
  choice: 王赐给他尊荣
  rationale: δόξα在君王奖掖臣属的宫廷语境中指尊荣、声望或显扬；译作“尊荣”自然庄重，也避免使读者误以为专指神性的“荣耀”。
- source_word: εὑρόντος χάριν ἐναντίον αὐτοῦ
  choice: 因为他在王面前蒙恩
  rationale: 属格独立结构在此说明君王赐予尊荣的缘由。“在……面前蒙恩”保留了原文的圣经式关系用语；代词按语境明确为“王”，以免中文指代含混。
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: 凡他所求的都蒙允准
  rationale: ἀξίωμα可指要求、请求，也可指身份、尊位或职任。结合ἐπί及君王施恩的宫廷语境，“所求的”较通顺，并可对应君王对请求的准许；“蒙允准”把希腊语中压缩的关系用自然中文表达出来，同时以脚注保留另一种词义可能。
theological_decisions:
- issue: δόξα是否应译为具有强烈神学色彩的“荣耀”
  choice: 尊荣
  alternative: 荣耀
  rationale: 此处施予者是人间君王，对象也是臣属，语境首先指公开的尊崇与礼遇；译作“尊荣”不否认δόξα的宽广语义，也不额外赋予神性含义。
- issue: ἀξιώματα指请求还是官职、尊位
  choice: 所求的
  alternative: 所有职任／一切尊位
  rationale: 该词本身确有多义，原句也较为压缩；宫廷施恩的语境更适合解释为向王提出的请求，但不应抹去“职任、尊位”的可能，故在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在王面前蒙恩”保留经文惯用语感；末句以“凡……都……”呈现希腊语的总括意味，并用脚注保留ἀξιώματα的词义张力。
