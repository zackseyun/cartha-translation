base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/015.yaml
  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: zh_hans
  text: 为要把祭物献在他们的主的祭坛上，就是在耶路撒冷的那座祭坛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: 为要
  rationale: 此处引出目的或预期结果；在行政与敬拜语境中，“为要”自然地表达目的，同时不完全排除结果意味。
- source_word: προσενεγκεῖν
  choice: 献
  rationale: 该动词与祭物及祭坛连用时具有礼仪性的奉献含义；现代汉语用“献”比逐字译作“带来”更自然准确。
- source_word: θυσίας
  choice: 祭物
  rationale: 指献在祭坛上的祭祀供物；“祭物”简明庄重，也与动词“献”自然搭配。
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: 在……祭坛上
  rationale: ἐπί加宾格在这里指向祭坛并涉及献到其上；汉语“献在祭坛上”准确而自然。
- source_word: τοῦ κυρίου αὐτῶν
  choice: 他们主的
  rationale: 忠实保留希腊文的κύριος及复数领属代词，不把平行希伯来文本中的“上帝”补入正文；“主”在此为对以色列之上帝的尊称。
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: 就是在耶路撒冷的那座祭坛
  rationale: 带冠词的介词短语回指并限定前述祭坛。汉语补出“那座祭坛”，可消除悬垂感，并保留限定作用。
theological_decisions:
- issue: 圣殿礼仪语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 上下文所指是以色列的上帝，而非人间主人；“主”既符合敬称用法，也不在正文中增添希腊文没有的“上帝”。
- issue: 希腊正文与马所拉平行文本之间的重大差异
  choice: 正文依希腊文译作“他们主的祭坛”
  alternative: 他们上帝在耶路撒冷的殿
  rationale: 希腊文是本节的首要文本依据，明确说“他们主的祭坛”；平行亚兰文说“他们上帝在耶路撒冷的殿”。两者不能无声合并，因此正文保留希腊措辞，脚注交代平行文本。
- issue: προσενεγκεῖν在祭祀语境中的动作含义
  choice: 献
  alternative: 带来
  rationale: “带来”较贴近一般动作义，但与祭物和祭坛同现时，动词具有献祭的礼仪含义；“献”在现代汉语中更准确自然，且没有额外规定具体祭仪方式。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“为要”承接上文并标示目的；“献在……祭坛上”符合中文祭祀语境。后半句重复“祭坛”，虽比代词略长，却清楚保留希腊文冠词短语对前述祭坛的限定。
