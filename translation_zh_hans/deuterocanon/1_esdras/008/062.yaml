base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: zh_hans
  text: 他们在那里到了第三天，银子和金子都称过了，就在主的殿中交给乌利亚的儿子、祭司玛摩提；非尼哈的儿子以利亚撒也和他在一起。与他们同在的还有利未人：耶稣的儿子约撒比和撒班努的儿子莫厄特。[a]一切都按数目和重量核对；当时就把全部重量记录下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文中的人名与马所拉文本的平行传统不同。后者有“乌利亚的儿子米利末”“非尼哈的儿子以利亚撒”，以及相当于“耶书亚的儿子约拿单”和“宾内的儿子挪亚底”的利未人等形式。正文依从《以斯得拉一书》的希腊文见证。
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: 到了那里的第三天
  rationale: 以自然的现代汉语表达属格独立结构所表示的时间背景，同时保留αὐτόθι“那里”的地点信息，以及“第三天来到”的叙事推进。
- source_word: σταθὲν τὸ ἀργύριον καὶ τὸ χρυσίον παρεδόθη
  choice: 银子和金子都称过，便……交给
  rationale: 保留先称量、后正式移交的动作次序；“称过”不额外加入“分发”等原文没有的含义。
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: 在主的殿中
  rationale: οἶκος Κυρίου直译为“主的家/殿”；在圣殿语境中，“主的殿”既保留圣经表达，也比“主的家”更清楚自然。
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: 祭司乌利亚的儿子玛摩提
  rationale: 按上下文将连续与格姓名理解为受领者及其父系身份，并依希腊文本转写姓名；“祭司”修饰玛摩提。
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: 把一切都按数目、按重量点交
  rationale: 保留数点与称量两方面的行政核验；“点交”在中文中自然表达清点后正式交付，但不改变前文已陈述的移交。
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: 当时就把全部重量记录下来
  rationale: “当时就”传达αὐτῇ τῇ ὥρᾳ所强调的即时性，“记录下来”明确ἐγράφη指书面登记。
theological_decisions:
- issue: 圣殿称谓中κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊正文使用κύριος而非直接呈现神名；译作“主”保留源文本形式，也避免无文本依据地补入特定神名形式。
- issue: 希腊姓名与马所拉传统平行姓名不一致
  choice: 正文按《以斯得拉一书》的希腊见证音译
  alternative: 按马所拉传统规范为米利末、乌利亚、约拿单、耶书亚、挪亚底、宾内等形式
  rationale: 本节以希腊文为首要翻译依据；差异通过脚注公开说明，不在正文中静默协调不同文本传统。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主的殿”“按数目、按重量”“记录下来”保留圣经及行政交接语体。专名按希腊文本音译，不以较熟悉的马所拉文本形式替换；脚注标记置于整节末，涵盖本节全部姓名差异。
