review_pass:
  verdict: revise
  source_fidelity: 需修订。“摩押”是通常对应 Moab 的地名/人名形式，并不合希腊文 Μωὲθ（Moeth）；应以不同的音译呈现。另“祭司乌利亚的儿子玛摩提”在现代汉语中容易读成乌利亚是祭司，未清楚反映希腊文中玛摩提为祭司的同位说明。末句前的“点交”则把原文的按数目和重量的核计方式表达成又一次移交，较不准确。
  naturalness: 整体庄重通顺。改为“他们在那里到了第三天”可更直接表达 αὐτόθι 的地点持续；“一切都按数目和重量核对”自然且不重复前面的交付动作。
  terminology: “主的殿”“非尼哈”“以利亚撒”“利未人”均合适。专名仍依希腊文音译：玛摩提、乌利亚、约撒比、耶稣、莫厄特、撒班努。脚注保留马所拉平行传统的差异说明。
  issues:
  - severity: high
    issue: “摩押”误作 Μωὲθ 的音译。
    rationale: “摩押”对应的是 Moab 一类形式；希腊文 Μωὲθ 是人名 Moeth，须用不与“摩押”混同的音译，如“莫厄特”。
  - severity: medium
    issue: “祭司乌利亚的儿子玛摩提”修饰关系不清。
    rationale: 原文将 ἱερεῖ 与玛摩提同位，意为“乌利亚的儿子、祭司玛摩提”；现有中文容易理解为乌利亚是祭司。
  - severity: medium
    issue: “按数目、按重量点交”把核计短语表述为另一交付动作。
    rationale: παρεδόθη 已表达交付；πρὸς ἀριθμὸν καὶ ὁλκὴν 描述全部物品按数目和重量办理/核计。改作“核对”可保留行政精确性，避免重复移交。
  revised_text: 他们在那里到了第三天，银子和金子都称过了，就在主的殿中交给乌利亚的儿子、祭司玛摩提；非尼哈的儿子以利亚撒也和他在一起。与他们同在的还有利未人：耶稣的儿子约撒比和撒班努的儿子莫厄特。[a]一切都按数目和重量核对；当时就把全部重量记录下来。
  revised_footnotes:
  - marker: a
    text: 本节希腊文中的人名与马所拉文本的平行传统不同。后者有“乌利亚的儿子米利末”“非尼哈的儿子以利亚撒”，以及相当于“耶书亚的儿子约拿单”和“宾内的儿子挪亚底”的利未人等形式。正文依从《以斯得拉一书》的希腊文见证。
    reason: alternative_reading
  revision_rationale: 修正 Μωὲθ 的中文音译，消除“祭司”所属对象的歧义，并将“按数目和重量”译为核计方式而非重复交接。其余内容保持希腊文的叙事次序、圣殿称谓及姓名传统；脚注锚点移至希腊文姓名组之后，使其指向明确。
