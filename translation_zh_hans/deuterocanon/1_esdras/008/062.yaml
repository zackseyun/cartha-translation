revisions:
- from: 到了那里的第三天，银子和金子都称过，便在主的殿中交给祭司乌利亚的儿子玛摩提；非尼哈的儿子以利亚撒也和他在一起。与他们同在的还有利未人，就是耶稣的儿子约撒比和撒班努的儿子摩押。他们把一切都按数目、按重量点交；当时就把全部重量记录下来。[a]
  to: 他们在那里到了第三天，银子和金子都称过了，就在主的殿中交给乌利亚的儿子、祭司玛摩提；非尼哈的儿子以利亚撒也和他在一起。与他们同在的还有利未人：耶稣的儿子约撒比和撒班努的儿子莫厄特。[a]一切都按数目和重量核对；当时就把全部重量记录下来。
  rationale: 修正 Μωὲθ 的中文音译，消除“祭司”所属对象的歧义，并将“按数目和重量”译为核计方式而非重复交接。其余内容保持希腊文的叙事次序、圣殿称谓及姓名传统；脚注锚点移至希腊文姓名组之后，使其指向明确。
