base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
translation:
  language: zh_hans
  text: 我把他们召集到那条名叫“河”的河旁[a]后，我们在那里扎营三天[b]；我仔细察看了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“到那条称为‘河’的河”。这里的“河”很可能是地点名称，而不只是普通描述。
    reason: lexical_alternative
  - marker: b
    text: 希腊文先说“我们扎营”，随后转为“我仔细察看”。有些译法会统一人称，但原文区分了众人的行动和叙述者个人的察看。
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγών
  choice: 我把他们召集到
  rationale: 不定过去时主动分词表示先于后续叙事的动作，隐含主语为第一人称单数；汉语用连动结构自然表达，不必另加“之后”。
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: 到那条称为“河”的河边
  rationale: λεγόμενον意为“称为、名叫”；Ποταμόν字面为“河”，此处似兼具地名性质。译文保留希腊文看似重复的措辞，并以“河边”自然表达扎营地点。
- source_word: παρενεβάλομεν
  choice: 我们……扎营
  rationale: 该动词为第一人称复数，意为安营、扎营；“扎营”是现代汉语中自然且庄重的说法。
- source_word: αὐτόθι
  choice: 在那里
  rationale: 直接表达地点副词“在那里”。
- source_word: ἡμέρας τρεῖς
  choice: 三天
  rationale: 宾格表示持续时间；汉语无需另加介词即可清楚表达。
- source_word: κατέμαθον αὐτούς
  choice: 我仔细察看了他们
  rationale: καταμανθάνω在此表示仔细观察、查验；“仔细察看”既保留审视之意，也不把具体目的过度限定为点名或清点。动词形态为第一人称单数。
theological_decisions:
- issue: 叙事人称在同一节中转换
  choice: 保留“我们……扎营”到“我……察看”的转换
  alternative: 为行文整齐统一译作“我们察看了他们”
  rationale: 希腊文本先用第一人称复数παρενεβάλομεν，随后用第一人称单数κατέμαθον。译文不将这一真实的叙事张力擅自协调。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“称为‘河’的河边”刻意保留原文的地名式重复；分号帮助读者看清召集、共同扎营和个人察看三个连续动作。
