base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: zh_hans
  text: 那些从被掳之中来到的人，向以色列的上帝，就是主，献上祭物：九十六[a]，七十六只羊羔，以及十二只公山羊作平安祭[b]；这一切都作为祭物献给主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文本在“九十六”这里没有写明所计动物的种类。
    reason: 原文存在名词省略或文本缺失，不宜在正文中无依据地补定。
  - marker: b
    text: 或译“为福祉”“为拯救”或“为解救”。希腊原文直译为“为了拯救／解救”，这里处于献祭语境中。
    reason: 保留ὑπὲρ σωτηρίου的字面语义范围及其祭祀语境中的解释张力。
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: 那些从被掳之地回来的人
  rationale: παραγενόμενοι表示来到、抵达；αἰχμαλωσία着重被掳处境。译文采用现代汉语中自然且符合圣经语境的“从被掳之地回来”。
- source_word: προσήνεγκαν θυσίας
  choice: 献上祭物
  rationale: προσφέρω在献祭语境中指献上；θυσίας为祭献之物，译作“祭物”自然明确。
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: 向以色列的上帝——主
  rationale: 保留“以色列的上帝”与“主”之间的同位关系，不将其中一个称谓省去。
- source_word: ἐνενήκοντα ἕξ
  choice: 九十六只
  rationale: 原文在该数字前后未见所计动物的名词，因此不据后来的译本擅自补定种类，并以脚注说明文本状况。
- source_word: ἄρνας
  choice: 羊羔
  rationale: ἀρήν的宾格复数指羊羔或幼羊；原词本身并不明确要求译成成年公绵羊，故采用较直接的“羊羔”。
- source_word: τράγους
  choice: 公山羊
  rationale: τράγος明确指雄性山羊，译作现代常用的“公山羊”。
- source_word: ὑπὲρ σωτηρίου
  choice: 作平安祭
  rationale: 在祭牲清单中，该短语具有礼仪献祭含义；“平安祭”便于普通读者理解，同时以脚注保留σωτήριον所含福祉、拯救或解救的语义范围。
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: 这一切都作为祭物献给主
  rationale: ἅπαντα总括此前所列各项；汉语补出“献给”以自然表达省略的献祭关系。
theological_decisions:
- issue: ὑπὲρ σωτηρίου的祭祀含义
  choice: 作平安祭
  alternative: 为福祉／为拯救／为解救
  rationale: 上下文是祭牲清单，宜表达其礼仪性用途；但σωτήριον并非只能对应单一的祭类术语，因此脚注保留较直译的不同可能。
- issue: 九十六所计数的对象
  choice: 不在正文中擅补动物种类
  alternative: 九十六只公绵羊／公牛
  rationale: 所提供的希腊原文在ἐνενήκοντα ἕξ附近没有相应动物名词；为避免依据咨询译文或推测改写主文本，正文保留省略，并在脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“被掳之地”“献上祭物”“平安祭”延续常见圣经语域，但避免过度古雅。破折号明确“主”与“以色列的上帝”的同位关系。
