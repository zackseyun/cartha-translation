base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: zh_hans
  text: 说：“你们正要进去承受为业的那地，是被当地外族人[a]的污秽所玷污的地；他们使那地充满了自己的不洁[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那地各族”。希腊文更明确地称他们为“外族人”。
    reason: alternative_reading
  - marker: b
    text: “不洁”在这里既可能具有礼仪层面的含义，也可能具有道德层面的含义；原文不要求只取其中一种。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  choice: 那地
  rationale: 这里指以色列人将要进入并承受为业的特定地域，并非泛指全地或世界。
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: 你们正要进去……的
  rationale: 保留 εἰς 的方向性，并以“正要”自然表达当下即将进入的语境。
- source_word: κληρονομῆσαι
  choice: 承受为业
  rationale: 保留 κληρονομέω 的产业和继承含义；比单说“占有”更能传达其约与产业色彩。
- source_word: μεμολυσμένη μολυσμῷ
  choice: 被……的污秽所玷污
  rationale: 以“污秽—玷污”重现希腊文同根词的强调，同时保留礼仪与道德两方面的含义。
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: 当地外族人
  rationale: ἀλλογενής 明确表示异族或外族之人；“当地外族人”既自然，也保留 τῆς γῆς 的地域限定。
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: 自己的不洁
  rationale: ἀκαθαρσία 可兼有礼仪不洁与道德污秽之意；“不洁”不把含义限缩为其中一面。
- source_word: ἐνέπλησαν αὐτήν
  choice: 他们使那地充满了
  rationale: 直接表达“使……充满”，并明确代词所指为“那地”，符合现代汉语表达。
theological_decisions:
- issue: 应将污秽理解为单纯的礼仪不洁，还是同时保留礼仪与道德含义
  choice: 采用“污秽”“玷污”“不洁”等宽广用语，不限定为单一层面
  alternative: 译作“礼仪上的不洁”或“道德败坏”
  rationale: μολυσμός 与 ἀκαθαρσία 都可能兼具礼仪和道德意味；正文应保留这种张力，不作排他性解释。
- issue: 如何处理 ἀλλογενῶν 所表达的族群区别
  choice: 译为“外族人”
  alternative: 译为“那地各族”或“当地居民”
  rationale: 希腊文明确凸显其异族身份；较宽泛的译法会淡化原文的外来或异族意味，但可在脚注列为替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“承受为业”保留经文的产业语汇；“污秽所玷污”有意重现希腊文同根词的强调。引语承接上一节的“说”，因此以“说”起句。
