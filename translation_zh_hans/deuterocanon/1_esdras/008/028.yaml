base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: zh_hans
  text: 以下是按他们的父系家族和分组列出的首领[a][b]；他们是在亚达薛西王在位期间同我从巴比伦上来的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“领头的人”。希腊词可指居于首位或领导地位的人；希伯来文平行经文则明确说是父系家族的首领。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“他们的分组”（也可译作“分队”）；希伯来文平行经文则用家谱用语，意为“他们的谱系登记”。本译文以希腊文为主要依据。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ προηγούμενοι
  choice: 首领
  rationale: 该词在此表示居于领导地位的人；希伯来文平行经文的“父系家族的首领”也支持这一理解。“首领”自然简洁，又不把它限定为某种特定官职。
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: 按他们父系家族
  rationale: πατριά指以共同父系祖先为纽带的宗族或家族单位。“父系家族”比泛称“家庭”更能保留其谱系和群体含义。
- source_word: καὶ τὰς μεριδαρχίας
  choice: 和分队排列
  rationale: μεριδαρχία在这里涉及分组或编制。译作“分队排列”保留希腊文本的组织性含义，同时避免误译成希伯来文平行经文中的家谱登记。
- source_word: οἱ ἀναβάντες
  choice: 上来的人
  rationale: 保留从巴比伦前往耶路撒冷时惯用的“上来”表达，也符合地理和圣经叙事习惯。
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: 在亚达薛西王在位期间
  rationale: 此处 βασιλεία 表示君王统治的时期；“在位期间”是现代汉语中自然、明确的时间表达。
