lexical_decisions:
- source_word: μετʼ αὐτῶν
  choice: 和他们一起的
  rationale: μετά接属格表示陪同、同在；此处用“和他们一起的”自然承接名单语境，并保留希腊文简洁的伴随关系。
- source_word: ἄνδρες
  choice: 男子
  rationale: ἄνδρες在这里指男性，而非泛指众人；“男子”准确表达性别，也适合统计名单的语体。
- source_word: ἑβδομήκοντα
  choice: 七十
  rationale: 希腊文明确作“七十”。虽然《以斯拉记》8:12的希伯来文近似平行经文作“一百一十名男丁”，本译文仍以《以斯得拉一书》的希腊文本为主要依据。
