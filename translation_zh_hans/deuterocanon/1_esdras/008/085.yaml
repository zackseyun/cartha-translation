base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: zh_hans
  text: 因为主啊，你减轻了我们的罪，赐给我们这样的根；我们竟又回头去违犯你的律法，同这地各族的污秽相混。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κουφίσας τὰς ἁμαρτίας ἡμῶν
  choice: 减轻了我们的罪
  rationale: κουφίζω的基本义是“使轻、减轻”；保留原文较不寻常的说法，不擅自解释为赦免或减轻刑罚。
- source_word: τοιαύτην ῥίζαν
  choice: 这样的根
  rationale: 直译ῥίζα为“根”，与所给希腊本文及审定后的英语咨询层一致；不改释为“余民”。
- source_word: πάλιν ἀνεκάμψαμεν
  choice: 我们竟又转回去
  rationale: ἀνακάμπτω表示回转、折返；“竟”体现祷告语境中的反差和自责，但不改变命题内容。
- source_word: παραβῆναι τὸν νόμον σου
  choice: 违犯你的律法
  rationale: παραβαίνω在此指越过、违反律法，“违犯”符合现代汉语宗教与法律语域。
- source_word: ἐπιμιγῆναι τῇ ἀκαθαρσίᾳ
  choice: 与……的污秽混杂
  rationale: ἐπιμίγνυμι表示混合、交杂；保留其与“污秽”搭配所形成的强烈修辞，不将污秽直接等同于各族人民本身。
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: 这地各族
  rationale: ἔθνη在此为各民族、各族；“这地各族”自然表达属格关系，并避免现代“国家”的误解。
theological_decisions:
- issue: “减轻我们的罪”的含义
  choice: 保持“罪”被减轻这一原文表述
  alternative: 译作“减轻了我们罪的惩罚”或“赦免了我们的罪”
  rationale: 希腊文直接以“我们的罪”为宾语，具体指罪责、刑罚还是罪的重担并未明说，故不替原文消除歧义。
- issue: “根”的指涉
  choice: 保留比喻“这样的根”
  alternative: 解释为“余民”“根基”或“生机”
  rationale: ῥίζα本身是“根”，其在上下文中可能关联存留、延续或重新扎根；直译可保存比喻及神学张力。
- issue: “污秽”与各族的关系
  choice: 译为“与这地各族的污秽混杂”
  alternative: 译为“与这地污秽的各族通婚”
  rationale: 原文的语法将“污秽”置于核心位置，并未在本句明确说“通婚”；保持这一结构，避免把伦理评价扩大为对族群本身的本体性定性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留祷告中的呼语“主啊”和自责性的转折。“因为”承接上文论证；分号呈现神恩与再次违律之间的强烈反差。
