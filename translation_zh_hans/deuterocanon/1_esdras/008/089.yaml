base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: zh_hans
  text: 以斯拉祷告、认罪[a]，俯伏在圣殿前哭泣的时候，有一大群人从耶路撒冷聚集到他那里，包括男人、女人和青年男子[b]；因为人群中有极大的痛哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“感谢”。这个希腊词可有这样的含义，但这里的悔罪语境更支持“认罪”。
    reason: 保留ἀνθωμολογεῖτο真实存在的词义选择。
  - marker: b
    text: 希腊原文作“青年男子”；这个词为阳性，并非泛指不分性别的青年人。
    reason: 说明原文明确的性别所指，避免读者将其理解为性别中性的群体。
lexical_decisions:
- source_word: προσευχόμενος
  choice: 祷告
  rationale: 用进行中的动作表达与认罪、哭泣同时发生的祷告，符合希腊语现在分词在叙事中的作用。
- source_word: ἀνθωμολογεῖτο
  choice: 认罪
  rationale: 该词也可指感谢或颂赞，但本节的哭泣、俯伏及悔罪语境更支持公开承认罪过的含义。
- source_word: κλαίων
  choice: 哭泣
  rationale: 保持庄重的悔罪语气，也与后文的κλαυθμός形成有意的重复。
- source_word: χαμαιπετής
  choice: 俯伏
  rationale: 自然表达伏在地上的卑微姿态；中文无需另加“在地上”也能清楚传达身体姿势。
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: 在圣殿前
  rationale: ἱερόν通常指圣殿建筑群或范围，不专指内殿；“圣殿”是现代中文圣经语体中清楚而不过度限定的表达。
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: 聚集到他那里
  rationale: 保留πρός所表达的朝向以斯拉聚集之意，同时采用自然的现代汉语措辞。
- source_word: ὄχλος πολὺς σφόδρα
  choice: 极多的人
  rationale: 同时体现πολύς和加强词σφόδρα，又避免“极大的群众”一类生硬表达。
- source_word: νεανίαι
  choice: 青年男子
  rationale: 该词为阳性，明确指年轻男性；“青年男子”避免将其泛化为不分性别的“青年人”。
- source_word: κλαυθμός
  choice: 痛哭
  rationale: 该名词表示可闻的哀哭；“痛哭”比一般的“哭泣”更能传达群体强烈哀恸的程度。
- source_word: ἐν τῷ πλήθει
  choice: 人群中
  rationale: 准确保留集体范围，且符合现代汉语自然表达。
theological_decisions:
- issue: 悔罪语境中ἀνθωμολογεῖτο的含义
  choice: 认罪
  alternative: 感谢或颂赞
  rationale: 此词本身可有感谢、颂赞之意，但祷告、哭泣、俯伏等上下文，以及以斯拉悔罪祷告的主题，都较强地支持“认罪”；脚注保留另一种词义，以免抹去原词的语义张力。
- issue: νεανίαι所指的性别
  choice: 青年男子
  alternative: 青年人
  rationale: 希腊词明确为阳性，并与男人、女人并列列举群体，因此不将其性别中性化。
- issue: ἱερόν的圣殿用语
  choice: 圣殿
  alternative: 圣所
  rationale: ἱερόν通常涵盖圣殿范围，而“圣所”容易被理解为较狭义的内殿；“圣殿”较准确地保留其广义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一片痛哭”传达群体中强烈而普遍的哀恸；整体保留原文两次哭泣用语的呼应。脚注标记均置于相应词语之后。
