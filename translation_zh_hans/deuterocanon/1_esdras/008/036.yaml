base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: zh_hans
  text: 巴尼的子孙中，有约萨非雅的儿子撒利末[a]，同他一起的有一百六十名男子；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》8:8的希伯来文平行经文在此差异很大，所列的家族、领队和人数都不同。本译文以希腊文《以斯得拉一书》为依据，因此正文采用“巴尼……约萨非雅的儿子撒利末……一百六十名男子”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: 巴尼的子孙中
  rationale: υἱοί在家谱和名单语境中可指后裔或宗族成员；译作“子孙”比直译“儿子们”更符合现代汉语名单体，同时保留家系含义。Βανίας按希腊形式音译为“巴尼”。
- source_word: Σαλειμὼθ
  choice: 撒利末
  rationale: 按主要希腊见证中的姓名形式音译，不以差异显著的希伯来平行经文替换。
- source_word: Ἰωσαφίου
  choice: 约萨非雅的儿子
  rationale: 属格姓名在家谱名单中自然表示父子关系；汉语明确补出“的儿子”，以传达希腊文隐含的关系。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 同他一起的有
  rationale: 保持“与他同在、随同他”的意思，并补出汉语名单句式所需的“有”，使表达自然而不增加实质信息。
- source_word: ἄνδρες
  choice: 男子
  rationale: ἄνδρες明确指男性；在登记人数的语境中，“男子”比泛称“人”更准确。
- source_word: ἑκατὸν ἑξήκοντα
  choice: 一百六十名
  rationale: 按希腊文数字直译，并以量词“名”构成自然的现代汉语。
