base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: zh_hans
  text: 凡违犯你上帝的律法和王法的人，都必受到严厉惩处[a]：或处死，或施以刑罚，或处以罚金，或押走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文与所供的马所拉文本平行段落内容明显不同；这里以希腊文为主要依据。“严厉”也可理解为“切实地”或“严格地”，强调刑罚得到认真执行。
    reason: 文本差异与词义选择
  - marker: b
    text: “押走”所译的希腊词可指带走或押解；在司法语境中，也可能指拘押、监禁或放逐。现存措辞不足以确定为“没收财产”。此外，罚金前有一个意义突兀的否定词 μὴ，可能反映文本讹误；本译按刑罚项目连续列举来理解。
    reason: 词义歧义与文本疑难
lexical_decisions:
- source_word: παραβαίνωσι
  choice: 违犯
  rationale: 该动词指越过或违反法律规范；“违犯”既保留司法语气，也比“触犯”或“破坏”更自然地同时搭配上帝的律法和王法。
- source_word: νόμον τοῦ θεοῦ σου καὶ τοῦ βασιλικοῦ
  choice: 你上帝的律法和王法
  rationale: τοῦ βασιλικοῦ 为省略中心名词的形容词用法，与前面的 νόμον 平行；补出“法”，可自然表达“王的律法”。两个 καί 保留双重法律责任。
- source_word: ἐπιμελῶς
  choice: 严厉
  rationale: 该副词可表示认真、切实或严格地执行。司法命令中“严厉惩处”较符合现代汉语习惯；其也可能侧重迅速切实执行，故在脚注中保留这一可能。
- source_word: κολασθήσονται
  choice: 必受到……惩处
  rationale: 未来被动式表示司法惩罚将被执行；“必受到惩处”清楚保留其被动和确定语气。
- source_word: θανάτῳ
  choice: 处死
  rationale: 与格在刑罚清单中表示惩处方式；“处死”比直译“以死亡”更符合现代汉语法律表达。
- source_word: τιμωρίᾳ
  choice: 施以刑罚
  rationale: 该词泛指惩罚或刑罚；不将其擅自限定为体罚、酷刑或某一种具体刑罚。
- source_word: ἀργυρίῳ ζημίᾳ
  choice: 处以罚金
  rationale: 短语表示金钱上的处罚或损失；“罚金”自然传达银钱处罚，无须机械译成“银子的罚款”。
- source_word: ἀπαγωγῇ
  choice: 押走
  rationale: 该词基本义是带走、押走，可在司法语境中延伸为拘押、监禁或放逐。正文采用较少解释性的“押走”，避免在“没收”和“放逐”之间武断定案。
theological_decisions:
- issue: 上帝律法与王法的关系
  choice: 你上帝的律法和王法
  alternative: 你上帝的律法或王法
  rationale: 希腊文 καὶ…καὶ 自然表达两者并列；译文保留双重法律责任，不把它改成二选一。
- issue: 希腊文本与所供马所拉文本平行段落不相符
  choice: 以希腊文为正文依据
  alternative: 按所供马所拉文本改写为任命审判官的命令
  rationale: 所供 WLC 内容实际属于不同上下文，与本节希腊文的刑罚清单有实质差异；因此不作调和，仅在脚注说明。
- issue: 刑罚清单的具体分类
  choice: 保留 τιμωρίᾳ 的宽泛含义，并将 ἀπαγωγῇ 译为“押走”
  alternative: 分别具体化为“体罚”和“没收财产”或“放逐”
  rationale: 希腊词本身没有充分限定这些具体类别；较宽的译法保留原文的法律含混性，避免借平行传统补足正文。
translation_notes:
  register: 采用现代、庄重而易懂的司法语体。“王法”简洁对应王的律法；刑罚清单使用“或……或……”保持条列节奏。正文不借不对应的马所拉文本消解希腊文中的歧义。
