review_pass:
  verdict: revise
  source_fidelity: 草案正确以希腊文为主，并恰当地不把不相应的马所拉平行段落调和进正文。然而，正文把 μὴ 完全按作刑罚清单中的连词处理，未呈现其通常的否定作用；这无根据地消除了原文的主要语法疑难。另，“严厉”将 ἐπιμελῶς 所表达的认真、周密执行强化为刑罚的严酷程度。
  naturalness: “你上帝的律法和王法”“处死”“刑罚”均自然且符合庄重司法语体。“受到严厉惩处”虽顺畅，但需随原文词义改为较中性的“受到认真惩处”。在保留 μὴ 后，末项的表述必然显得不寻常；这正应由脚注说明，而不宜藉译文抹平。
  terminology: “违犯”“上帝的律法”“王法”准确。“银钱罚款”保留 ἀργυρίῳ ζημίᾳ 的金钱损失/罚款含义。ἀπαγωγῇ 基本是带走、押解；不宜在无文本依据时定译为“没收财产”，也不应把其固定为拘禁或放逐。
  issues:
  - severity: high
    issue: 正文遗漏了 μὴ 的否定功能。
    rationale: 现有“或处以罚金，或押走”将 μὴ 当作不存在，虽脚注提及疑难，却没有在译文中保留该词所造成的排除性语义。依据所给希腊本文，应译出“而不是/非……或……”，并以注释说明句法在刑罚清单中不寻常、可能涉及文本问题。
  - severity: medium
    issue: “严厉”过度限定 ἐπιμελῶς。
    rationale: 该副词主要指认真、仔细、周到地执行，并不必然说明刑罚本身严酷。“认真惩处”较能保留其执行方式的含义。
  - severity: low
    issue: 脚注称“按刑罚项目连续列举来理解”，与希腊文 μὴ 的通常意义不一致。
    rationale: 注释可以报告该理解作为可能的文本整合，但不应以此取代正文对现存希腊词形的翻译。
  revised_text: 凡违犯你上帝的律法和王法的人，都必受到认真惩处[a]：或处死，或施以刑罚，却不是处以银钱罚款或押解[b]。
  revised_footnotes:
  - marker: a
    text: 本节希腊文与所供的马所拉文本平行段落内容明显不同；这里以希腊文为主要依据。“认真”也可译为“周密地”或“严格地”，强调惩处得到认真执行。
    reason: 文本差异与词义选择
  - marker: b
    text: 希腊文在“银钱罚款或押解”前有否定词 μὴ，按通常用法应作“不是”，使这处刑罚列举的句法显得不寻常，可能反映文本问题；本译保留现存文字的否定。ἀπαγωγῇ 基本指带走或押解，在司法语境中也可能涉及拘禁或放逐，现有措辞不足以确定为“没收财产”。
    reason: 词义歧义与文本疑难
  revision_rationale: 修订以所给希腊文为准，恢复 μὴ 的否定作用而不擅自校改或依英语审计轨迹的“confiscation”定案；同时将 ἐπιμελῶς 从“严厉”调整为强调认真执行的中性表述。译文保留原文在末项的突兀和不确定性，并由脚注作必要说明。
