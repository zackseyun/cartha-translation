review_pass:
  verdict: revise
  source_fidelity: 正文正确以希腊文为首要依据，保留了违犯上帝律法和王法、受惩处及刑罚列举的基本结构。但“严厉”把ἐπιμελῶς所强调的认真、周密或严格执行，较强地具体化为刑罚的严酷程度；“押走”虽试图保留ἀπαγωγῇ的歧义，却不够像现代汉语中一项独立的司法处分。希腊文在ἀργυρίῳ ζημίᾳ之前的μὴ确属疑难，不能在正文中当作无问题的并列连词处理，宜在脚注明确说明。
  naturalness: “凡……的人，都必……”和“或……或……”的法律条列自然庄重。将“严厉惩处”改为“严格惩处”更贴近原文且仍合乎现代司法语体；将末项改为“予以带离”可避免“押走”的口语化和程序性，同时由脚注说明其法律含义未定。
  terminology: “上帝”“律法”“王法”“违犯”“罚金”均恰当。“刑罚”对应τιμωρίᾳ可保留其宽泛性。ἀπαγωγῇ不宜未经说明定为“没收财产”，也不宜在正文断定为放逐或监禁；需保留该法律术语的开放性。
  issues:
  - severity: medium
    issue: “严厉惩处”将ἐπιμελῶς译得过强。
    rationale: ἐπιμελῶς主要指认真、周密、严格地施行，并不直接说明刑罚本身严酷。“严格惩处”较好地保留执行方式的含义。
  - severity: medium
    issue: “押走”不适合作为现代法律刑罚清单中的稳定表述。
    rationale: ἀπαγωγῇ字面有带离、移走之义，在此可能涉及拘禁、放逐或财产的移除；原文不足以在正文中确定具体法律后果。用“予以带离”并以脚注交代歧义，较为自然且不强加解释。
  - severity: medium
    issue: 需更清楚交代μὴ的文本疑难。
    rationale: μὴ置于“金钱罚损”前在现有希腊文中不易解释；正文可依刑罚清单的句法作连列翻译，但脚注应明言此处可能有文本问题，而不应把其意义视为确定。
  revised_text: 凡违犯你上帝的律法和王法的人，都必受到严格惩处[a]：或处死，或施以刑罚，或处以罚金，或予以带离[b]。
  revised_footnotes:
  - marker: a
    text: 本节希腊文与所供的马所拉文本平行段落内容明显不同；这里以希腊文为主要依据。“严格”也可译为“认真地”或“周密地”，强调刑罚得到切实执行，不必然指刑罚格外严酷。
    reason: 文本差异与词义选择
  - marker: b
    text: “带离”所译的希腊词可指带走或移除；在司法语境中，可能指拘禁、放逐，或财产的移除／没收，原文不足以确定。又，“罚金”前的希腊文有一个难解的否定词 μὴ，可能反映文本问题；本译按上下文将其理解为刑罚项目的连续列举。
    reason: 词义歧义与文本疑难
  revision_rationale: 修订仅收窄两处超出希腊文的解释性措辞：以“严格”对应ἐπιμελῶς，避免把执行上的认真直接说成刑罚的严酷；以“予以带离”暂译ἀπαγωγῇ，并在脚注完整保留拘禁、放逐及财产移除等可能。保留对希腊文与所供MT平行段落不对应的说明，也明确μὴ造成的文本疑难。
