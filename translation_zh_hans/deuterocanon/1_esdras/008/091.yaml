base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: zh_hans
  text: 在这件事上，让我们向主起誓：把我们所有出自外族的妻子，连同她们的儿女，全都遣走[a]，照你所判定的，也照所有将要遵从主律法之人所赞同的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遣走”也可译作“逐出”或“赶出去”；原词语气较强。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本句末的句法较为压缩，直译近于：“照你所判定的，以及所有将要遵从主律法的人。”译文补出“所赞同的”，使隐含的关系在汉语中完整。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 在这件事上
  rationale: 这是引出当前议题的惯用表达；译法自然，也保留了原文对特定事项的指向。
- source_word: γενέσθω ἡμῖν ὁρκωμοσία
  choice: 让我们……起誓
  rationale: 希腊文直译近于“让我们有一个誓言”；汉语用“让我们起誓”更自然，并准确表达共同作出誓约的意思。
- source_word: πρὸς τὸν κύριον
  choice: 向主
  rationale: 在起誓语境中，πρός表示誓言所指向的对象；“向主起誓”符合现代汉语习惯。
- source_word: ἐκβαλεῖν
  choice: 遣走
  rationale: 该词本有赶出、逐出的力度；此处涉及妻子和儿女，译作“遣走”既保留离开的明确含义，又避免无根据地加强暴力色彩。
- source_word: πάσας τὰς γυναῖκας ἡμῶν τὰς ἐκ τῶν ἀλλογενῶν
  choice: 我们所有出自外族的妻子
  rationale: 婚姻语境表明 γυναῖκας 指“妻子”；ἀλλογενῶν 指不同族属的人，不宜套用较晚形成的“外邦人”神学范畴。
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: 连同她们的儿女
  rationale: “连同”明确表达 σύν 所表示的一并伴随；“儿女”是自然、庄重的集合称呼。
- source_word: ὡς ἐκρίθη σοι
  choice: 照你所判定的
  rationale: 保留 κρίνω 的裁断、判定意味；被动形式与间接格 σοι 在汉语中自然转为“你所判定的”。
- source_word: καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου
  choice: 也照所有愿意遵从主律法之人所赞同的
  rationale: 传世希腊文在 καί 之后句法压缩，缺少与前项清楚衔接的谓语。“所赞同的”是为汉语成句而补出的最小含义，并用脚注说明。πειθαρχήσουσιν 的将来形式在这里带意愿、承诺色彩，故译“愿意遵从”。
theological_decisions:
- issue: κύριος在犹太圣约与律法语境中的称呼
  choice: 主
  alternative: 主人
  rationale: 此处指以色列的上帝，并与起誓及律法相连；“主”最能保持经文的宗教语域，又不额外加入专名。
- issue: ἀλλογενῶν的族群称谓
  choice: 外族
  alternative: 外邦人
  rationale: 原词强调不同族属，并不必然承载后世“犹太人—外邦人”的完整神学分类；“外族”较少时代错置。
- issue: 压缩句法中遵从律法者与决定的关系
  choice: 将他们理解为赞同该判定的人，但以脚注标明补足
  alternative: 直译为“照你所判定的，以及所有愿意遵从主律法的人”
  rationale: 直译在汉语中句法断裂；补入“所赞同的”可呈现最可能的逻辑联系，同时不把这一补足伪装成毫无歧义的原文。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“起誓”“判定”“遵从律法”保持法律与圣约场景的严肃性；避免使用过度古雅的“休妻”或带有后世神学定型色彩的“外邦妻子”。
