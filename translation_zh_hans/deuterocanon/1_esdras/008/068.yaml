base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: zh_hans
  text: 我一听见这些事，就撕裂了衣服和圣服[a]，又拔下头上的头发和胡须；我坐下，惊愕万分[b]，悲痛不已。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的衣服”；可能指某种正式的祭司服饰，但希腊文没有明确说明。
    reason: lexical_alternative
  - marker: b
    text: “惊愕万分”也可译作“震惊”或“惶惑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με
  choice: 我一听见
  rationale: 该结构表示听见之后立即作出反应；“一听见……就……”自然地保留了这种紧接发生的意味。
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: 撕裂了衣服
  rationale: ἔρρηξα 指因悲痛而撕裂衣服；现代汉语用“撕裂”既清楚又保留庄重语气。
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: 圣服
  rationale: ἱεράν 明确表示这件服装具有神圣性质；“圣服”简洁而不把它进一步限定为祭司礼服。
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: 拔下了一些头发和胡须
  rationale: 属格在此带有部分意味，表示从头发和胡须中拔下一些；译文既表现动作的强烈，也符合现代汉语习惯。
- source_word: σύννους
  choice: 惊愕万分
  rationale: 该词描写人因震惊、骇然而神思凝滞；“惊愕万分”突出了负面的强烈冲击，避免把它理解为中性的惊奇。
- source_word: περίλυπος
  choice: 悲痛不已
  rationale: 该词表示极深的忧伤；“悲痛不已”自然地传达其强烈程度。
theological_decisions:
- issue: τὴν ἱερὰν ἐσθῆτα 所指服装的性质
  choice: 圣服
  alternative: 祭司服
  rationale: 希腊文明确称这件服装为神圣的，却没有明说它是某一种祭司礼服；因此保留较宽泛的表达，不引入原文未明示的职分细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一听见……就……”保留行动的即时性；句末依照希腊文次序落在“坐了下来”，并以“惊愕万分，悲痛不已”表现其坐下时的精神与情绪状态。
