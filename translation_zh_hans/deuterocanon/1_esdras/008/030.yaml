base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: zh_hans
  text: 法勒斯的子孙中，有撒迦利亚[a]；同他一起的，按名册所载，共有一百五十名男子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来平行经文此处作“巴录”，不是“法勒斯”；正文依照《以斯德拉一书》的希腊文本。
    reason: alternative_reading
  - marker: b
    text: 或译“按书面记录”或“根据名册”；这里指按登记册所载的人数。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  choice: 法勒斯
  rationale: 按《以斯德拉一书》希腊文本音译该人名；希伯来平行经文作“巴录”，差异留在脚注中说明。
- source_word: Ζαχαρίας
  choice: 撒迦利亚
  rationale: 采用现代中文圣经语境中这一人名的通行译法，也与希伯来平行经文相符。
- source_word: μετʼ αὐτοῦ
  choice: 与他同来的
  rationale: 表达随同撒迦利亚而来的人员，符合名单叙述的自然汉语。
- source_word: ἀπὸ γραφῆς
  choice: 按名册登记
  rationale: γραφή在此指书面记录或名册；希伯来平行经文所用的家谱登记动词支持登记语境，但正文不把含义限缩为家谱。
- source_word: ἄνδρες
  choice: 男子
  rationale: 保留希腊文明确的阳性指称；希伯来平行经文也明确说男性。
- source_word: ἑκατὸν πεντήκοντα
  choice: 一百五十
  rationale: 直接、自然地表达原文基数。
