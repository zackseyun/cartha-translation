  naturalness: 原译整体通顺，名单体裁也自然。改为“同他一起的，按名册所载”既保留简洁的列名风格，也避免不必要的时间性补足。
  terminology: “法勒斯”是对希腊文Φαρές的合宜音译；“撒迦利亚”通行。“男子”保留ἄνδρες及希伯来平行经文所显示的男性限定。脚注中“巴录”符合该希伯来平行经文在中文圣经传统中的译名，虽与另一人物巴录同形，仍须保留其为平行文本异读的说明。
