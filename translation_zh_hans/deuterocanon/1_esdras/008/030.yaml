revisions:
- from: 法勒斯的子孙中，有撒迦利亚[a]；与他同来的，按名册登记[b]，共有一百五十名男子。
  to: 法勒斯的子孙中，有撒迦利亚[a]；同他一起的，按名册所载，共有一百五十名男子[b]。
  rationale: 修订只消除“同来”的额外时间性含义，并将“按名册登记”调整为更直接对应ἀπὸ γραφῆς的“按名册所载”。脚注a保留希腊文本与希伯来平行经文之间的专名差异；脚注b随正文调整，说明该短语的书面登记册含义。
