base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: zh_hans
  text: 主啊，我在你面前[a]羞愧，深感耻辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“面对着你”或“在你跟前”。希腊文直译为“在你的面前”，保留了人直接站在上帝面前的具体意象。
    reason: 说明κατὰ πρόσωπόν σου的字面意象及可行译法。
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格，表示直接向上帝呼求；“主啊”在现代汉语中自然、庄重，并保留呼语语气。
- source_word: ᾔσχυμμαι
  choice: 羞愧
  rationale: 该完成时被动形式表达因羞耻而处于持续状态；“羞愧”简洁自然，准确传达说话者当下的内在处境。
- source_word: ἐντέτραμμαι
  choice: 深感耻辱
  rationale: 该完成时中间／被动形式在此与ᾔσχυμμαι并列，加强羞耻、受辱和无颜面对的意味；“深感耻辱”既与“羞愧”有所区分，也保留原文的强化作用。
- source_word: κατὰ πρόσωπόν σου
  choice: 在你面前
  rationale: 原文具体地说“在你的面前”，指直接处于上帝面前；汉语“在你面前”自然保留了这一带有闪语色彩的临在表达。
theological_decisions:
- issue: 神圣称呼Κύριε的译法
  choice: 主啊
  alternative: 上主啊
  rationale: 希腊文只有κύριος的呼格，并未明示更强的圣名对应形式；“主啊”既忠于直接祷告的语境，也不额外引入宗派性称谓。
- issue: κατὰ πρόσωπόν σου中上帝临在意象的处理
  choice: 在你面前
  alternative: 在你跟前／面对着你
  rationale: “在你面前”保留原文“面”的具体意象和人在上帝直接临在中认罪的张力，同时符合现代汉语表达。
- issue: 两个近义羞耻动词的并列
  choice: 羞愧，深感耻辱
  alternative: 羞愧，惭惧／羞愧难当
  rationale: 原文连续使用两个近义动词，意在强化而非提出两种截然不同的经验；译文保留并列，不把两者压缩成一个词，也不把第二词限定为纯粹公开受辱。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“主啊”保留呼告语气；两个羞耻表达维持原文简短而递进的力度。
