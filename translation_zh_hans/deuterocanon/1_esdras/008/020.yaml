  text: Likewise[b][a], up to one hundred cors of wheat and one hundred measures of wine.
translation:
  language: zh_hans
  text: 同样，小麦最多一百歌珥，酒最多一百米特列特。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “歌珥”是古代的大型干量单位；“米特列特”是希腊文所指的液体容量单位。
    reason: cultural_note
  - marker: b
    text: 参《以斯拉记》7:22；该平行经文把这些数目视为行政供应的最高限额，并将酒的单位称为“罢特”。本节希腊文则使用“米特列特”。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 承接前文并增列同类供应项目，保留其简洁的附加意味。
- source_word: ἕως
  choice: 最多
  rationale: 在行政供应限额的语境中表示数量上限，而非时间终点。
- source_word: πυροῦ
  choice: 小麦
  rationale: πυρός特指小麦，不宜泛译为“粮食”。
- source_word: κόρων ἑκατόν
  choice: 一百歌珥
  rationale: κόρος是特定的古代干量单位；采用音译，避免弱化为泛称“量器”。
- source_word: οἴνου
  choice: 酒
  rationale: 自然、准确地表达οἶνος；本语境无须另作限定。
- source_word: μετρητῶν ἑκατόν
  choice: 一百量器
  rationale: μετρητής在希腊文本中是液体容量单位的泛称。译作“量器”紧扣主要希腊证据，不把《以斯拉记》7:22平行经文中的具体单位“罢特”直接写入正文。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的行政用语。“最多”清楚表达限额；正文保留“歌珥”这一明确单位，却不以平行经文的“罢特”取代希腊文较宽泛的μετρητής。脚注标记均置于正文句末，避免打断数量清单。
