base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: zh_hans
  text: 他们把王的谕令交给王室总管和叙利亚、腓尼基的总督，并尊崇这民族和主的圣所。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊崇”也可译作“使……得尊荣”，或较直译为“荣耀了”。希腊文动词在这里可指给予尊荣或显扬。
    reason: 保留 ἐδόξασαν 的词义范围，并说明正文的语境化译法。
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: 交给
  rationale: 此处指把王的正式谕令递交给有关官员；“交给”自然清楚，并保留行政移交的含义。
- source_word: τὰ προστάγματα τοῦ βασιλέως
  choice: 王的谕令
  rationale: πρόσταγμα 指官方命令或指令；“谕令”既体现君王权威，也符合现代中文的正式语体。
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: 王室总管
  rationale: οἰκονόμος 本指管理家务或产业的人，在王室行政语境中可指管理官员；“王室总管”保留其管理职能，不把职务窄化为财务官。
- source_word: τοῖς ἐπάρχοις
  choice: 总督
  rationale: ἐπάρχος 指辖区长官或省级官员；“总督”简洁地表达其地方治理身份。
- source_word: ἐδόξασαν
  choice: 尊重
  rationale: δοξάζω 可指使之得荣耀、尊荣或给予优待。因宾语是民族和圣所，“尊重”避免误导为敬拜，同时保留公开尊崇的意思；较直译的可能性列入脚注。
- source_word: τὸ ἔθνος
  choice: 这民族
  rationale: ἔθνος 在此把犹太人视为一个整体民族；“这民族”承接叙事所指，并保留群体与政治层面的含义。
- source_word: τὸ ἱερὸν
  choice: 圣所
  rationale: ἱερόν 可指神圣处所或圣殿范围；“圣所”保留神圣性，又不将其范围限定为某一建筑部分。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 主要文本见证为希腊文 κύριος，译作“主”，不反向重构为希伯来文神名。
theological_decisions:
- issue: 非神性宾语前 ἐδόξασαν 的含义
  choice: 这些人便尊重这民族和主的圣所
  alternative: 这些人便使这民族和主的圣所得尊荣／荣耀了这民族和主的圣所
  rationale: 中文“荣耀”作动词容易带出专用于神的敬拜色彩，而原文在行政语境中也可表示给予尊荣或优待。因此正文用“尊重”，脚注保留更贴近词面的译法。
- issue: 希腊文 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节的主要翻译依据是希腊文，原文写 κύριος；译作“主”忠实于现存文本，也不根据并不对应本节内容的希伯来文平行材料擅自恢复神名。
- issue: ἐδόξασαν 的主语指代
  choice: 这些人
  alternative: 他们
  rationale: 希腊文动词主语可按语法理解为前文交付谕令的人，也可在语境中关联刚提到的官员。为使行政因果关系自然，正文将其理解为接到谕令的官员；此处存在轻微指代张力，不作教义化处理。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谕令”“王室总管”“总督”体现行政语境；分号呈现交付命令与随后尊荣之间的推进关系。脚注标记 [a] 已置于正文对应句末。
