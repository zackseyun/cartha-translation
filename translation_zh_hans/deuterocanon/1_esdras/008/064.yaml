  naturalness: “王室总管”“叙利亚、腓尼基的总督”及整体行政语体自然。“尊崇”比“尊重”更能表达 ἐδόξασαν 所含的公开尊荣／提高声望之意；以“并”连接可清楚保留同一主语的并列行动。
  terminology: “王的谕令”可对应 τὰ προστάγματα τοῦ βασιλέως；“主的圣所”忠实对应 τοῦ κυρίου 与 τὸ ἱερόν。保留“民族”以表达 ἔθνος 的群体性。“尊崇”不暗示敬拜，且脚注保留“荣耀”的较直译可能。
