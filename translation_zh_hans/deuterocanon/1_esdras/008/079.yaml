base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: zh_hans
  text: 如今，主啊，我们有这些[a]，还能说什么呢？他们违背了你的命令；这些命令是你借你仆人众先知的手[b]赐下的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”在希腊文中所指较为含蓄，可能回指这段祷告上文提到的恩惠或处境。
    reason: 保留指代歧义，避免在正文中过度明确。
  - marker: b
    text: “借……的手”是圣经中的惯用表达，意思是“借着”或“经由”。
    reason: 说明原文中介表达的字面形式与实际用法。
lexical_decisions:
- source_word: καὶ νῦν
  choice: 如今
  rationale: 保留承接上文并转入当前恳诉的语篇功能；“如今”自然、庄重。
- source_word: τί ἐροῦμεν
  choice: 我们……还能说什么呢
  rationale: 以反问表达将来时形式所带的斟酌与无可辩解之意，同时不把其具体含义解释得过满。
- source_word: Κύριε
  choice: 主啊
  rationale: 准确表达 κύριος 的呼格；“啊”是现代汉语祷告中自然的呼语标志。
- source_word: ἔχοντες αὐτά
  choice: 我们既有了这些
  rationale: 保留希腊文简略而指向不完全明确的复数代词 αὐτά，不擅自将其限定为恩惠、处境或某项具体事物。
- source_word: παρέβησαν
  choice: 他们违背了
  rationale: 第三人称复数按语法译作“他们”，并以“违背”体现逾越命令的道德和律法含义。
- source_word: τὰ προστάγματά σου
  choice: 你的命令
  rationale: πρόσταγμα 指命令、训令；“命令”清楚自然，也适合此处的盟约语境。
- source_word: ἃ ἔδωκας
  choice: 就是你……赐下的
  rationale: 保留 δίδωμι“给予”的基本意义；“赐下”符合上帝颁赐命令的庄重语域。
- source_word: ἐν χειρὶ
  choice: 藉着……之手
  rationale: 保留圣经中表示经由中介传达的“借……之手”表达，并用脚注说明其惯用含义。
- source_word: τῶν παίδων σου τῶν προφητῶν
  choice: 你的仆人众先知
  rationale: παῖς 在先知奉差遣的语境中指“仆人”；“众先知”保留复数，并维持“仆人”与“先知”的同位关系。
theological_decisions:
- issue: παρέβησαν 的隐含主语
  choice: 他们违背了
  alternative: 我们违背了
  rationale: 希腊文动词是第三人称复数，故不改成第一人称。即使祷告者在上下文中认同群体的罪，本句语法仍以“他们”陈述。
- issue: ἔχοντες αὐτά 所指为何
  choice: 既有了这些
  alternative: 既蒙受这些恩惠／处在这样的境况中
  rationale: 原文所指压缩且有歧义；译文保留“这些”，不借平行经文或上下文推断来排除其他可能。
- issue: ἐν χειρὶ 的中介表达
  choice: 藉着你的仆人众先知之手
  alternative: 藉着你的仆人众先知
  rationale: 正文保留原文“手”的圣经惯用语和中介性，不据此添加有关启示机制的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊”体现直接呼告；反问句保持认罪祷告中的肃穆张力。正文保留“这些”和第三人称“他们”，以尊重希腊文的指代含蓄与语法形式。
