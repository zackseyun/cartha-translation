base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: zh_hans
  text: 起来，把这事办成[a]；因为这事由你负责，我们也与你同在。你要刚强，去做吧[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把这事办成”也可译作“把这事完成”。
    reason: 说明ἐπίτελει可指完成、贯彻到底。
  - marker: b
    text: 末句的希腊语十分简练，可理解为“要刚强”或“刚强地行动”；参照《以斯拉记》10:4的希伯来文，也可译作“你要刚强，去做吧”。
    reason: 保留ἰσχὺν ποιεῖν的真实歧义，并说明希伯来文平行经文对该劝勉式理解的支持。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起来
  rationale: 该不定过去时分词在此具有命令语气；“起来”自然保留了催促对方立即行动的力度。
- source_word: ἐπίτελει
  choice: 把这事办成
  rationale: ἐπιτελέω意为完成、贯彻到底；结合上下文补出“这事”，使现代汉语自然，并保留完成任务的含义。
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: 因为这事由你负责
  rationale: 字面为“这事向着你”，在此表示此事归对方承担或处理；“由你负责”清楚表达责任归属，而不暗示私人所有权。
- source_word: ἡμεῖς μετὰ σοῦ
  choice: 我们也与你同在
  rationale: 直接表达支持与同心，不额外加入原文没有明说的帮助方式。
- source_word: ἰσχὺν ποιεῖν
  choice: 你要刚强，行动吧
  rationale: 希腊语表达简短且不寻常，可能指刚强地行动，也可能相当于“要刚强，去做”；此译文以自然的劝勉语保留力量与行动两层意思。
