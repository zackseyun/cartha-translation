base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: zh_hans
  text: 这些事以后，在波斯人的王[a]亚达薛西在位的时候，以斯拉上来了；他是亚撒利雅的儿子，亚撒利雅是撒迦利的儿子，撒迦利是凯勒基雅[b]的儿子，凯勒基雅是沙龙的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“波斯人的王”；《以斯拉记》7:1的希伯来语平行文本作“波斯王”。正文依《以斯得拉一书》的希腊文本。
    reason: alternative_reading
  - marker: b
    text: 希腊文本的人名形式在此译作“凯勒基雅”；希伯来语平行文本中的对应名字通常译作“希勒家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: 这些事以后
  rationale: 希腊语表达较为凝缩，作用是引入后续时段；《以斯拉记》7:1的希伯来语平行文本也支持这一自然的时间过渡表达。
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: 亚达薛西在位期间
  rationale: 属格独立结构交代时间背景；“在位期间”准确而符合现代汉语叙事习惯。
- source_word: τοῦ βασιλέως Περσῶν
  choice: 波斯人的王
  rationale: 希腊语明确使用复数“波斯人”，因此不按希伯来语平行文本改成“波斯王”。
- source_word: προσέβη
  choice: 上来了
  rationale: 保留前往耶路撒冷时常见的“上去”方向含义；“上来了”也反映叙述视角，但不在正文中补出原文未明说的目的地。
- source_word: Ἔσρας
  choice: 以斯拉
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἀζαραίου
  choice: 亚撒利雅
  rationale: 依希伯来语平行传统辨认该名，并采用通行中文形式。
- source_word: Ζεχρίου
  choice: 撒迦利亚
  rationale: 采用该圣经人名的通行中文形式。
- source_word: Χελκείου
  choice: 凯勒基雅
  rationale: 正文优先反映希腊文本的人名形式，不直接与希伯来语平行文本的“希勒家”调和。
- source_word: Σαλήμου
  choice: 沙龙
  rationale: 结合平行家谱传统，将希腊语形式辨认为希伯来名שַׁלּוּם，并采用通行中文译名。
