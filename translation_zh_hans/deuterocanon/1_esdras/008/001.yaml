  source_fidelity: 需修订。希腊文Ζεχρίου是人名“撒迦利／Zechri”（属格），并非“撒迦利亚”（Ζαχαρίου一类形式）。正文将其译为“撒迦利亚”改变了源文所载家谱人名。其余时间框架、波斯人复数表达及“上来”的方向性均基本忠实于希腊文。
  naturalness: 修订后采用“在波斯人的王亚达薛西在位的时候”较自然、庄重；以分句展开家谱，避免连续定语造成歧义。
  terminology: “以斯拉、亚撒利雅、沙龙”可保留。“凯勒基雅”用以区分希腊文形式，并以脚注说明其对应的常见希伯来语形式“希勒家”，做法可接受。须将“撒迦利亚”改为“撒迦利”，以保留希腊文的人名区别。
