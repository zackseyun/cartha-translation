base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: zh_hans
  text: 首领、祭司和利未人都没有使自己与这地的外族及其种种污秽分别开来[a]——就是迦南人、赫人、比利洗人、耶布斯人、摩押人、埃及人和以东人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“分别”后接“这地的外族”和“他们的污秽”，句法紧缩；也可理解为：“没有使自己与这地的外族及其污秽隔离。”
    reason: 说明原文紧缩的宾语结构，并保留语境所支持的反身理解，避免将其作为无歧义的明示成分。
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: 没有……分别开来
  rationale: χωρίζω表示分开、隔离；结合本句语境，以“同……分别开来”表达隐含的反身意义，同时不把时态过度具体化。
- source_word: οἱ ἄρχοντες
  choice: 首领
  rationale: 指掌权或居领导地位的人；“首领”既保留其正式身份，又符合圣经叙事的庄重语体。
- source_word: οἱ ἱερεῖς
  choice: 祭司
  rationale: 这是该宗教职分的标准现代汉语译法。
- source_word: οἱ Λευεῖται
  choice: 利未人
  rationale: 采用该族群及圣职群体的通行译名。
- source_word: ἀλλογενῆ ἔθνη τῆς γῆς
  choice: 当地的外族
  rationale: ἀλλογενής指非本族、外来的族群，γῆ在此指当地地域；“当地的外族”自然地传达其民族与地域含义，避免现代种族化措辞。
- source_word: ἀκαθαρσίας αὐτῶν
  choice: 他们种种污秽的事
  rationale: ἀκαθαρσίας可按复数宾格理解，指这些族群多方面使人沾染污秽的行为或状况；“污秽的事”保留礼仪与道德交叠的含义。
- source_word: Χαναναίων καὶ Χετταίων καὶ Φερεζαίων καὶ Ἰεβουσαίων καὶ Μωαβειτῶν καὶ Αἰγυπτίων καὶ Ἰδουμαίων
  choice: 迦南人、赫人、比利洗人、耶布斯人、摩押人、埃及人和以东人
  rationale: 采用现代简体中文圣经中较通行的族名；Ἰδουμαῖοι对应以东人。
theological_decisions:
- issue: “污秽”所指的性质
  choice: 保留“污秽”的礼仪—道德复合语义，不具体解释为某一种罪行
  alternative: 译作“可憎之事”或仅解释为社会交往
  rationale: 希腊文使用ἀκαθαρσία，而非明确表示“可憎之事”的词；保留“污秽”可避免削弱圣洁语境，也不把经文本身未说明的具体内容强加进去。
- issue: “分别”与外族的关系
  choice: 译为没有同外族及其污秽分别开来
  alternative: 译为没有把外族及其污秽分开
  rationale: 希腊句式紧缩，字面结构可能显得像以“外族”和“污秽”为宾语，但上下文所表达的是首领、祭司和利未人未能保持分别；正文传达此意义，脚注保留句法上的压缩与另一种表述可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别开来”保留本节圣洁语境中的关键动作；族名使用通行译名。正文以破折号引出对“外族”的具体列举。
