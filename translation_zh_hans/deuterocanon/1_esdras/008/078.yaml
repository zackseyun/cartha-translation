base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: zh_hans
  text: 但他使我们在波斯诸王面前蒙恩，赐给我们食物，使我们的圣所得荣耀，使荒凉的锡安重新兴起，又使我们在犹太地和耶路撒冷有稳固的立足之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稳固的立足之地”也可译作“保障”或“坚固之处”。
    reason: στερέωμα可表示稳固、保障或坚固之物；上下文不能完全确定其具体或抽象程度。
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  choice: 使我们……面前蒙恩
  rationale: 按希腊语习语表达“使某人在他人眼前处于恩宠之中”；“蒙恩”自然、庄重，也保留关系性的含义。
- source_word: τῶν βασιλέων Περσῶν
  choice: 波斯诸王
  rationale: 忠实反映复数 βασιλέων，并采用现代汉语中简洁自然的历史称谓。
- source_word: δοῦναι ἡμῖν τροφήν
  choice: 赐给我们供养
  rationale: τροφή可指食物、滋养或维生所需；结合王室支持与复兴的语境，“供养”比单指“食物”更合适，同时未泛化为抽象的“供应一切”。
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: 使我们的圣所得荣耀
  rationale: δοξάζω在此可指使之尊荣、增添荣美；ἱερόν指圣所或圣殿范围。“得荣耀”贴近原文，又不把含义限定为装饰或修缮。
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: 使荒凉的锡安重新兴起
  rationale: ἐγείρω本义为使起来，也可含恢复之意；加入“重新”使现代汉语通顺，而“兴起”保留比“重建”更宽的意象。
- source_word: στερέωμα
  choice: 稳固的立足之地
  rationale: 该词可表示坚固、支撑、稳固之处或保障。此处用“稳固的立足之地”保留获准安顿、建立并得安全保障的开放含义，避免“堡垒”可能造成的军事化过度限定。
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: 在犹太和耶路撒冷
  rationale: Ἰουδαία在波斯时期地理语境中译为“犹太”自然；耶路撒冷沿用标准中文译名。
theological_decisions:
- issue: Σειών的译名
  choice: 锡安
  alternative: 熙雍／西雍
  rationale: “锡安”是现代简体中文圣经语境中最通行的音译，不额外解释其神学象征。
- issue: 复兴语境中στερέωμα的含义
  choice: 稳固的立足之地
  alternative: 保障；坚固之处；堡垒
  rationale: 原词语义具有弹性，既可能偏向稳固地位，也可能指安全保障或坚固之处。正文保留形象而避免把它确定为军事堡垒，其他可能性列入脚注。
- issue: δοξάσαι用于圣所
  choice: 使……得荣耀
  alternative: 使……得尊荣；使……恢复荣美
  rationale: 保留δοξάζω的荣耀／尊荣语言及其可能包含的恢复荣美之意，不将其缩减为物质装饰。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以希腊文本为首要依据；所给MT平行文本实际对应相邻内容，与本节有明显错位，因此不用于改写本节。保留一连串不定式所表达的恩惠结果，但以汉语连接词使句法清楚。
