base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: zh_hans
  text: 从大卫和众首领拨给利未人服役的圣殿仆役[a]中，有二百二十人；他们全都按名登记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿仆役”也可音译为“尼提宁”，是源自希伯来文的专称。希腊文作“圣殿仆役”（ἱερόδουλοι），希伯来文平行经文作 נְתִינִים。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: 圣殿仆役
  rationale: 该词指隶属圣所、承担圣殿事务的人。译作“圣殿仆役”既体现其宗教职能，也避免仅按词源译成“圣奴”而过度强调身份性质；希伯来文平行经文的 נְתִינִים 也指这一类被拨作圣殿服役的人。
- source_word: ἔδωκεν
  choice: 拨给
  rationale: 字面义为“给”，此处指大卫和首领将这些人配置给利未人承担工作；“拨给”保留给予的意象，并自然表达行政安排。
- source_word: οἱ ἡγούμενοι
  choice: 众首领
  rationale: 泛指与大卫一同作出安排的领导者或官长；“众首领”符合古代行政语境，又不把其具体官职说得过死。
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: 给利未人服役
  rationale: ἐργασία 可指工作、劳作或服役。结合圣殿职务语境，此译自然表达这些人被安排辅助利未人的意思。
- source_word: διακόσιοι εἴκοσι
  choice: 二百二十人
  rationale: 按原文准确译出人数，并补出汉语计数所需的“人”。
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: 他们全都按名登记
  rationale: 原短语表示所有人的姓名被正式记载或造册；“按名登记”简洁地保留行政记录的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“拨给”保留原文“给予”的表达，同时传达人员配置之意；末句用“按名登记”体现正式造册。脚注标记置于人数之后，以免割裂“圣殿仆役”与总数之间的句法联系。
