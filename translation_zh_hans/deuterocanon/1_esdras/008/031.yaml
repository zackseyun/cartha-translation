base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: zh_hans
  text: 巴哈·摩押的子孙中，有扎赖乌的儿子埃利亚洛尼亚[a]，随同他的有二百名男子；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“扎赖乌的儿子埃利亚洛尼亚”；《以斯拉记》8:4的希伯来文平行经文作“西拉希雅的儿子以利约乃”。
    reason: 说明希腊文主要见证与希伯来文平行经文在人名形式上的差异。
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: 巴哈·摩押的子孙中
  rationale: 希腊文的 Μααθμωάβ 是家族名称；参照《以斯拉记》8:4的希伯来文平行经文，可辨认为“巴哈·摩押”家族。以“子孙中”自然表达名单中的家族归属。
- source_word: Ἐλιαλωνίας
  choice: 埃利亚洛尼亚
  rationale: 按主要希腊文本音译该人名，不以希伯来文平行经文中的对应名字取代。
- source_word: Ζαραιου
  choice: 扎赖乌
  rationale: 按希腊文本音译；其属格形式在名单句式中表示父子关系，因此译作“扎赖乌的儿子”。
- source_word: καὶ μετʼ αὐτοῦ
  choice: 随同他的
  rationale: 贴合名单语境，简洁表达与此人同行或归在其名下的人。
- source_word: ἄνδρες διακόσιοι
  choice: 有二百人
  rationale: ἄνδρες 在此指成年男子；中文名单语境中译作“人”自然，也不必受希伯来文平行经文“男丁”的措辞支配。
