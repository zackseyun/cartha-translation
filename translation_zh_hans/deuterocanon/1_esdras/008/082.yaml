base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: zh_hans
  text: 也不可让你们的儿子娶他们的女儿；始终不可寻求与他们和睦[a]，使你们强盛起来，得以吃那地的美物，并承受那地为业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按《以斯拉记》的平行传统作较完整理解：“谋求他们的平安和福祉。”
    reason: 希腊语“寻求与他们和睦”的措辞较浓缩；平行传统支持“平安和福祉”的较完整语义，但正文仍按希腊文本翻译。
lexical_decisions:
- source_word: λάβητε
  choice: 娶
  rationale: 该动词本义为“取、领受”，但“为你们的儿子……他们的女儿”明确构成婚姻语境；汉语用“娶”既自然，又准确表达这里的含义。
- source_word: ζητήσετε
  choice: 寻求
  rationale: 保留动词“寻求、谋求”的主动含义，也维持禁令较宽泛的表达。
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: 寻求与他们和睦
  rationale: 希腊语表达较为浓缩，意思可指与他们维持和平关系；译文不把它扩大为特定政治或宗教政策，脚注则保留平行传统所支持的“平安或福祉”含义。
- source_word: τὸν ἅπαντα χρόνον
  choice: 永远
  rationale: 该短语直指全部时日、始终如此；在这项持续性禁令中，“永远”比逐字译作“整个时间”更自然。
- source_word: ἵνα ἰσχύσαντες
  choice: 好使你们强盛起来
  rationale: 用目的结构表达ἵνα，并以“强盛起来”体现不定过去时分词所含的变得强健、强盛之意。
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: 吃那地的美物
  rationale: 保留“吃”这一具体动词及“那地的美物”的宽泛含义，不将其限缩为农作物或抽象的繁荣。
- source_word: κατακληρονομήσητε
  choice: 承受那地为业
  rationale: 该复合动词带有承受产业的含义；希腊文未明说宾语，但上下文自然指向“那地”，故在汉语中补出，以形成完整而清楚的句子。
theological_decisions:
- issue: 如何处理希腊文“寻求与他们和睦”与《以斯拉记》平行传统中“寻求他们的平安和福祉”之间的关系
  choice: 正文依现存希腊文译作“寻求与他们和睦”，脚注说明平行传统所支持的较完整含义。
  alternative: 正文直接扩译为“谋求他们的平安或福祉”。
  rationale: 《以斯德拉一书》应以希腊文本为首要依据；但此处希腊语较浓缩，平行传统有助于显示“和睦”也可能涵盖为对方谋求福祉。把扩展含义放入脚注，可同时保存希腊文表层表达及其真实的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“娶他们的女儿”“吃那地的美物”“承受那地为业”保留经文的具体意象和产业语言，同时避免生硬逐字翻译。
