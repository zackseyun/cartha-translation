base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: zh_hans
  text: 阿多尼亚金的子孙中，末后的那些人如下：以利法拉（革乌珥的儿子）和示玛雅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“末后的（人）”。这可能指该家族最后一个分组，也可能指家系中较晚的后裔；原文的确切含义并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἀδωνιακαὶμ
  choice: 阿多尼亚金的子孙中
  rationale: ἐκ 表示从某群体中选出，υἱοί 在族谱名单中可泛指子孙。专名按希腊文 Ἀδωνιακαὶμ 音译，不以近似的马所拉文本替换。
- source_word: οἱ ἔσχατοι
  choice: 末后的一批
  rationale: ἔσχατοι 意为“最后的、末后的”。在名单语境中可能指最后一个分组，也可能指家系中较晚的后裔；译文保留其含混性，并用脚注说明。
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: 他们的名字是
  rationale: 这是引出名单的惯用表达；采用自然的现代汉语，同时保留原文的陈述功能。
- source_word: Ἐλειφάλα τοῦ Γεουὴλ
  choice: 革乌珥的儿子以利法拉
  rationale: 人名依希腊文音译；人名后的属格在族谱名单中表示父子关系，故明确译为“革乌珥的儿子”。
- source_word: Σαμαίας
  choice: 示玛雅
  rationale: 采用此闪族人名在中文圣经传统中易识别的通行形式；它与希腊文 Σαμαίας 所代表的名字相符。
