base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: zh_hans
  text: 从我们祖先的时代起[a]，直到今天，我们一直处在深重的罪中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“从我们父辈的时代起”；这里的“父辈”是指祖先。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到今天，我们仍处在深重的罪中。”希腊文动词是现在时，但整句表达从过去延续至今的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων τῶν πατέρων ἡμῶν
  choice: 从我们祖先的时代起
  rationale: ἀπό与属格标明时间起点；χρόνοι指时期、时代。πατέρες在祖辈语境中自然指祖先，现代汉语译作“祖先”既准确又避免把“父亲们”误解为直系父辈。
- source_word: ἐσμεν
  choice: 我们一直处在
  rationale: ἐσμεν形式上是现在时“我们处在”，但与“从……起”和“直到今天”连用，表示始于过去并延续至今的状态；“一直处在”自然传达这种持续性。
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: 处在深重的罪中
  rationale: ἁμαρτία通常指“罪”，μεγάλη在此强调罪的严重程度。“深重的罪”符合现代汉语宗教与道德语境，同时不把含义收窄为司法性的“罪责”。
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: 直到今天
  rationale: 这是表示延续至说话当下的时间短语；“直到今天”清楚、自然，并保留终点意味。
theological_decisions:
- issue: 父系用语与祖先统称
  choice: 我们祖先
  alternative: 我们的先祖（较直译的形式可作“我们的父辈”）
  rationale: πατέρων字面为阳性复数“父亲们”，但在这里是惯用的祖先称谓。汉语“祖先”忠实传达所指，不暗示经文只谈直系父亲，也不引入特定宗派立场。
- issue: 罪的状态还是罪责
  choice: 处在深重的罪中
  alternative: 负有深重的罪责
  rationale: ἁμαρτία首先是“罪”；上下文虽可能包含罪责含义，却没有要求改译成偏司法性的“罪责”，因此保留原文的道德—宗教范畴。
- issue: 现在时的持续意义
  choice: 我们一直处在
  alternative: 我们处在
  rationale: 保留状态延续至今的张力：希腊文动词是现在时，而整个“从……直到……”结构又明确涵盖过去至现在。正文用“一直”表达持续，脚注提示形式上较直译的读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“深重的罪”比生硬的“大罪中”自然，并保留原文对罪之严重性的强调。两个脚注标记均已置于正文相应位置。
