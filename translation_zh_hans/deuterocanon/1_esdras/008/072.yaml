base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: zh_hans
  text: 因为我们的罪恶已经多到漫过我们的头顶，我们因无知所犯的过错[a]已经上达于天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的无知”“我们的无心之过”。希腊文在这里所用的词与前句的“罪恶”不同。
    reason: 说明ἄγνοιαι的词义范围，并保留原文两个罪错用语之间的区别。
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: 罪恶
  rationale: 指道德上的罪与过犯；“罪恶”在现代汉语中自然庄重，并保留复数所表达的累积感。
- source_word: ἐπλεόνασαν
  choice: 已经多得
  rationale: 该动词表示数量增多；与“没过了头”连用，可自然呈现罪恶不断累积的图景。
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: 没过了头
  rationale: 直译为“超过我们的头”；“没过了头”既保留具体的垂直意象，也传达罪恶已将人淹没的压迫感。
- source_word: ἄγνοιαι
  choice: 因无知所犯的过错
  rationale: ἄγνοια可指无知，也可指因无知而犯的错；此译法在汉语中清楚自然，并避免与前句的“罪恶”完全合并。
- source_word: ὑπερήνεγκαν
  choice: 已经上达
  rationale: 该词在这里表达向上延伸；“上达”保留垂直动态，又符合庄重的经文语体。
- source_word: ἕως τοῦ οὐρανοῦ
  choice: 于天
  rationale: 与“上达”组成自然的“上达于天”，准确保留直到天上的意象。
theological_decisions:
- issue: 是否将ἁμαρτίαι与ἄγνοιαι都译为同一类“罪”
  choice: 分别译为“罪恶”和“因无知所犯的过错”
  alternative: 两者均笼统译作“罪”或“罪孽”
  rationale: 希腊文本刻意使用两个不同名词。分别翻译既保留修辞层次，也不武断断言后者必然全属无意之罪；脚注说明其词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“没过了头”保留原文强烈的水位式意象；“上达于天”则维持与前句相呼应的垂直空间图景。
