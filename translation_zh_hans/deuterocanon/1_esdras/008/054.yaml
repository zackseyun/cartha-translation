base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/054.yaml
  text: And again we prayed to our Lord about all these things[b][a], and we found him favorable.
translation:
  language: zh_hans
  text: 我们又为这一切向我们的主祈求[a]，也蒙他恩待[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据希腊文是“我们又为这一切向我们的主祈求，也蒙他恩待”。所附的希伯来文马所拉文本平行材料与此处内容不符，似乎属于另一语境，因此正文依照指定为主要见证的希腊文翻译。
    reason: textual_variant
  - marker: b
    text: “恩待”也可译作“善待”或“向我们施恩”；希腊词表示和善、宽厚或有利的态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示动作再次发生；“又”简洁自然，也与句首连接词相配。
- source_word: ἐδεήθημεν
  choice: 祈求
  rationale: δέομαι 表示恳切求告；“祈求”既保留祷告语境，也体现请求的力度。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 向我们的主
  rationale: δέομαι 后的属格指求告的对象；汉语用“向”明确表达这一关系。κύριος 在对上帝祷告的语境中译作“主”。
- source_word: πάντα ταῦτα
  choice: 为这一切
  rationale: 概括前述全部事项；现代汉语以“这一切”自然表达希腊语复数短语的总体含义。
- source_word: ἐτύχομεν εὐιλάτου
  choice: 蒙他恩待
  rationale: 该结构表示得到对方善意、宽厚的回应。“蒙他恩待”是自然且庄重的汉语，同时保留结果性的含义。
- source_word: εὐιλάτου
  choice: 恩待
  rationale: εὐίλατος 可指和善、宽厚或有利的态度；“恩待”适合以上帝为所指的语境，但不把词义限定为“怜悯”。
theological_decisions:
- issue: 祷告语境中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处祈求对象是上帝，“主”符合希腊文及现代汉语圣经语体；“主人”会造成不适当的人际或所有权色彩。
- issue: 希腊文本与所附马所拉文本平行材料严重不符
  choice: 正文依照指定的希腊文本，译为祈求并蒙恩待
  alternative: 依所附希伯来文译为分别祭司首领等内容
  rationale: 本条明确指定希腊文为主要翻译依据；所附希伯来文属于另一语境，不能据此改写希腊正文。脚注如实说明文本层面的不匹配。
- issue: εὐίλατος 的神学语气
  choice: 蒙他恩待
  alternative: 发现他是有利的／蒙他怜悯
  rationale: “恩待”表达上帝以善意回应，却不强行加入“赦罪”或特定救恩教义；“怜悯”则可能收窄原词较宽的善意、宽厚含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祈求”保持祷告与恳求的双重意味；“蒙他恩待”比直译为“发现他有利”更符合汉语表达，同时避免过度解释。所有脚注标记均已置于正文相关位置。
