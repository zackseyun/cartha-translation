base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: zh_hans
  text: 你们是奉谁的授权[a]建造这座房屋[b]，完成这个屋顶及其余一切工程的？执行这些工程的建造者又是谁？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉谁的命令”。希腊文分词可侧重工程背后的命令或指示。
    reason: lexical_alternative
  - marker: b
    text: 这里的“房屋”指圣殿；译文保留希腊文所用的普通词语，没有直接意译为“圣殿”。
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: 奉谁的授权
  rationale: 该属格疑问代词与不定过去时分词连用，询问是谁在背后发出指示或给予正式许可；“奉谁的授权”既体现行政查问的语境，也不把含义局限为某一道具体命令。
- source_word: οἰκοδομεῖτε
  choice: 建造
  rationale: 保留动词的一般意义，不依上下文擅自增译为“重建”；“是……建造……的”在汉语中自然地表达正在进行的工程。
- source_word: οἶκον
  choice: 房屋
  rationale: 希腊文使用普通名词“房屋”；上下文所指虽是圣殿，正文仍保留源词的普通表达，并以脚注说明。
- source_word: στέγην
  choice: 屋顶
  rationale: 该词指建筑物的顶盖，“屋顶”准确而自然。
- source_word: τἄλλα πάντα
  choice: 其余一切工程
  rationale: 原文泛指其余所有事项；按建筑语境补出“工程”，使现代汉语清楚流畅，同时保持范围的广泛性。
- source_word: ἐπιτελεῖτε
  choice: 完成
  rationale: 该动词强调把工作贯彻到底、使之完工；“完成”符合建筑语境。
- source_word: οἰκοδόμοι
  choice: 建造者
  rationale: 采用不限定具体工种的通称，避免缩窄为泥瓦匠或其他专门工匠。
- source_word: τελοῦντες
  choice: 做这些事
  rationale: 表达实际执行上述工程的人，并避免与前句“完成”生硬重复。
theological_decisions: []
