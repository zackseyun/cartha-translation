base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: zh_hans
  text: 犹太人的长老蒙了主的恩待；他们负责照管被掳的境况[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文十分紧缩。也可译作：“他们受命照管被掳的境况”，或将“被掳”理解为“被掳者（群体）”。“照管”所译的词也可含监督、察看或职分之意。
    reason: 保留γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν与ἐπισκοπῆς之间不甚明确的句法关系，并保留αἰχμαλωσία可指被掳状态、流亡，或相关被掳群体的歧义。
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: 蒙了……的恩待
  rationale: 这是“得到恩惠、蒙恩”的惯用表达；“蒙了主的恩待”既自然，也清楚表明恩惠来自主。
- source_word: ἐπισκοπῆς
  choice: 监管
  rationale: ἐπισκοπή可指察看、照管或监督；本句语境较适合行政性的“监管”，但其确切句法关系仍有歧义。
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: 他们负责……被掳之民
  rationale: γενόμενοι ἐπί可表示进入某种职责或地位；αἰχμαλωσία字面可指“被掳、被掳状态”，也可转指被掳的人。正文采用自然的群体指称，并以脚注保留另一种理解。
- source_word: παρὰ τοῦ κυρίου
  choice: 主的
  rationale: παρά加属格表示来源；中文用“蒙了主的恩待”自然表达恩待来自主。
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: 犹太人的长老
  rationale: 贴近希腊文结构，也清楚指明这些长老所属的群体。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文作κύριος，正文直译为“主”，不根据近似但不直接对应本句的马所拉平行文本补入神名。
- issue: αἰχμαλωσία所指
  choice: 被掳之民
  alternative: 被掳的境况／流亡
  rationale: 该名词本可表示被掳或流亡的状态，这里与监管职责相连，较可能转指被掳群体；脚注保留句法及指称上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“蒙了主的恩待”符合当代圣经汉语习惯；以分号拆开紧缩的希腊结构，使中文清晰，同时不把“负责”过度解释为明确的正式任命。
