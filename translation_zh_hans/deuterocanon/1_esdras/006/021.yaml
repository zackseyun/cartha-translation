base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: zh_hans
  text: 如果查明，耶路撒冷主的殿宇建造工程是经居鲁士王批准进行的，并且我主君王认为合宜，愿他就这些事答复我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在耶路撒冷的主的建造”。原文未明说受建造之物；本处根据上下文补作“主的殿宇建造工程”。
    reason: 说明原文在“建造”所指对象上的省略，以及正文为使汉语语义明确所作的语境补足。
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: 如果查明
  rationale: 保留条件式被动所表达的正式查验语气，也符合查考官方档案的行政语境。
- source_word: μετὰ τῆς γνώμης Κύρου τοῦ βασιλέως
  choice: 经居鲁士王批准
  rationale: γνώμη 可指意见、决定或授权；在王室行政语境中，“批准”最能表达建造得到君王许可，同时不把它弱化为私人意见。
- source_word: γενομένην τὴν οἰκοδομήν
  choice: 建造是……的
  rationale: 表达该建造工程得以进行；不增添希腊文未明说的“重建”。
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: 耶路撒冷主殿的
  rationale: 希腊文直译近于“在耶路撒冷之主的建造”，语法上省略了受建造之物；根据圣殿建造的上下文，以“主殿”补足意义，并用脚注交代原文形式。
- source_word: κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: 我们的主君王认为合宜
  rationale: κρίνηται 在恭敬的奏请语体中表示某事被君王判断为适当；“认为合宜”保留审断意味和宫廷敬语。
- source_word: προσφωνησάτω ἡμῖν
  choice: 就请他……告知我们
  rationale: 该动词本义是向人说话或致辞，在行政书信中指正式传达回复；中文用“告知我们”自然明确。
- source_word: περὶ τούτων
  choice: 这些事
  rationale: 忠实保留复数所指的相关事项，适合正式书信语境。
theological_decisions:
- issue: 同一节中 κύριος 分别指上帝和君王
  choice: 指上帝时译作“主”，指君王的敬称时译作“主君王”
  alternative: 将君王处译作“君王陛下”或“我们的君王”
  rationale: 希腊文两处使用同一词，但所指不同。“主殿”保留对上帝的称谓；“主君王”则保留波斯宫廷中的臣属敬称，避免把君王的 κύριος 误认作神圣称号。
- issue: 希腊文中圣殿名词的省略
  choice: 正文补出“殿”，脚注说明希腊文的字面结构
  alternative: 直译为“耶路撒冷之主的建造”
  rationale: 上下文明确谈论圣殿工程，而直译在现代汉语中容易被理解为“建造主本身”。补出“殿”使语义清楚，同时脚注保留原文的省略和可能的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的行政书信语体。“查明”“批准”“认为合宜”“告知”体现官方查验和奏请口吻；“主君王”保留古代宫廷敬称，但与指上帝的“主”在搭配上有所区分。脚注标记置于整句末尾，说明正文中补出的“殿”。
