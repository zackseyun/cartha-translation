base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: zh_hans
  text: 他又下令，要叙利亚和腓尼基的总督西西尼斯、撒特拉布扎尼斯及其同僚，以及受委派在叙利亚和腓尼基任职的长官，不要靠近那地方，却要任凭主的仆人、犹太地的省长所罗巴伯和犹太人的长老[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却要让主的仆人、犹太地的省长所罗巴伯和犹太人的长老。”希腊文直译为“却要让／任凭……”，在这里指官员不得干涉。
    reason: 保留ἐᾶσαι的许可、任凭之义及原文对获准行动内容的省略，不补出具体事务。
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: 他又下令，要
  rationale: 将发令动词及其不定式结构合并为自然的现代汉语，同时保留权威命令的语气。
- source_word: ἐπάρχῳ
  choice: 总督
  rationale: 指管辖叙利亚和腓尼基这一较大行政区域的官员；用“总督”既通俗，也可与后文所罗巴伯的ὕπαρχος有所区分。
- source_word: συνεταίροις
  choice: 同僚
  rationale: 此处是行政语境，所指更可能是共同任职者，而不是私人伙伴。
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: 受委派……任职的长官
  rationale: 兼顾ἀποτεταγμένοις的受命、委派含义和ἡγεμόσιν的官长含义，避免把不同层级的官衔一概译成“总督”。
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: 不要靠近那地方
  rationale: 保留希腊文的空间性表达；在这道行政命令中，也自然含有不得介入该地事务的意思。
- source_word: ἐᾶσαι
  choice: 让……自行办理
  rationale: ἐάω可表示任凭、准许。结合前文官员不得靠近，这里表达不加干涉、准其继续办理事务；脚注保留更直译的可能。
- source_word: παῖδα Κυρίου
  choice: 主的仆人
  rationale: παῖς虽可指孩子，但在此尊称和经文语境中指事奉者更为合适；“仆人”保留其荣誉性圣经用语。
- source_word: ὕπαρχον ... τῆς Ἰουδαίας
  choice: 犹太地的省长
  rationale: 指所罗巴伯在犹太地的行政身份。“省长”自然明确，并与管辖叙利亚和腓尼基的ἐπάρχος“总督”形成适度区分。
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: 犹太人的长老
  rationale: 此处指犹太群体中获承认的领袖，“长老”是准确且通行的译法。
theological_decisions:
- issue: παῖδα Κυρίου中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在犹太经文语境中，此词带有敬称和信仰含义；译作“主”较能保留这种分量，而“主人”会把意思限缩为世俗主仆关系。
- issue: 所罗巴伯被称为παῖς的含义
  choice: 仆人
  alternative: 孩子
  rationale: 这里是对所罗巴伯与主之关系的荣誉性称谓，并非生物学亲子说明；“仆人”不额外引入经文本身没有明说的弥赛亚解释。
- issue: ἐᾶσαι所表达的不干涉程度
  choice: 让……自行办理
  alternative: 任凭……／准许……继续进行
  rationale: 原文并未明说具体办理什么，且句子在所给文本处结束；正文传达官方不干涉的实际含义，脚注则保留原词较宽泛的“任凭、准许”语义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和行政用语。人名依希腊文音译；以“总督”“省长”“长官”体现原文不同官职词，同时不对古代官阶作过度精细化处理。正文脚注标记[a]已与脚注对应。
