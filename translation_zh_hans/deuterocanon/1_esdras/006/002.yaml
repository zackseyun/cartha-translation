base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: zh_hans
  text: 那时，撒拉铁的儿子所罗巴伯和约瑟德的儿子耶书亚[b]起来[a]，开始建造耶路撒冷主的殿；主的众先知[c]与他们同在，帮助他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“起身”。希腊文这个分词既可指实际站起来，也可表示起来采取行动。
    reason: lexical_alternative
  - marker: b
    text: 希腊文“耶书亚”与通常译作“耶稣”的名字形式相同；这里指被掳归回时期的耶书亚，并非拿撒勒人耶稣。
    reason: lexical_alternative
  - marker: c
    text: 平行的希伯来文传统在相关语境中提到先知哈该和撒迦利亚；本节希腊文只泛称“主的众先知”。
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为自然的叙事连接语，表明事件承接上文发生。
- source_word: στάς
  choice: 起来
  rationale: 既保留“起身”的具体形象，也可自然表达采取行动；不把其含义简化并吞入“开始”。
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 采用现代中文圣经读者较熟悉的人名形式，同时依照希腊文明确表达父子关系。
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: 约瑟德的儿子耶书亚
  rationale: 此处人物是被掳归回时期的耶书亚；用“耶书亚”避免与拿撒勒人耶稣混淆。“约瑟德”按本节希腊文形式音译，不以平行传统的名字形式取代。
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: 开始建造
  rationale: 直接呈现起始动词加不定式的结构和动作进程。
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: 主殿
  rationale: “殿”是现代汉语中对上帝居所及圣殿语境自然、庄重的表达，也保留“主的殿”这一传统意象。
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: 耶路撒冷的
  rationale: 以自然汉语定语结构标明主殿的位置。
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου
  choice: 主的众先知与他们同在
  rationale: 把属格独立结构译为伴随情形，保留先知亲自同在并支持建造者的含义。
- source_word: βοηθούντων αὐτοῖς
  choice: 帮助他们
  rationale: 清楚表达持续给予协助的分词含义，不额外限定帮助的具体方式。
theological_decisions:
- issue: 圣殿语境中 κυρίου 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文原文为 κυρίου，故在正文中直译为“主”，不根据平行闪语传统把神名补入希腊文本。
- issue: 如何使用与本节并非逐字对应的马所拉文本平行材料
  choice: 保留希腊文泛称“主的众先知”
  alternative: 在正文中补出哈该和撒迦利亚的名字
  rationale: 希腊文是本书本节的主要文本依据。平行传统可说明这些先知所处的历史背景，却不足以支持把希腊文本没有写出的名字加入正文。
- issue: Ἰησοῦς 在本节历史语境中的人名表达
  choice: 耶书亚
  alternative: 耶稣；约书亚
  rationale: 同一希腊名字在不同语境可有不同中文惯用译法；本节指归回时期的人物，译作“耶书亚”既符合其身份，也避免造成基督论上的误认。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句子前半保持叙事推进，后半用“与他们同在，帮助他们”自然呈现两个伴随分词。人名兼顾希腊文本形式与现代中文圣经读者的辨识度；正文不加入平行文本才有的专名。
