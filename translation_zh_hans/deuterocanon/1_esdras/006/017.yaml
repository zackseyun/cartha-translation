base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: zh_hans
  text: 那些金器和银器的圣器皿，尼布甲尼撒曾从耶路撒冷的殿中搬出，安放在自己的庙中；居鲁士王又再次把它们从巴比伦的庙中搬出，交给所罗巴伯和那位省长撒巴拿撒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“撒巴拿撒”；这个名字很可能对应《以斯拉记》中通常译作“设巴萨”的名字。
    reason: 保留希腊文本的人名形式，同时提示与闪语平行传统中较常见名称的可能对应关系。
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: 圣器皿
  rationale: 既保留ἱερά所表达的分别为圣、用于敬拜的性质，也以现代中文常见的“器皿”概括各类圣殿用具。
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: 就是金器和银器
  rationale: 两个形容词名词化并回指器皿；译成“金器和银器”自然清楚，也保留两类物件的并列强调。
- source_word: ἐξήνεγκεν
  choice: 搬出
  rationale: 该动词指从某处带出或运出；“搬出”适合具体器物，并可在前后两处重复，以反映希腊文用词。
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: 耶路撒冷的殿
  rationale: οἶκος字面为“房屋”，但此处明确指耶路撒冷圣殿；现代中文单说“殿”既自然，也与后文异教的“庙”形成适当区别。
- source_word: ἀπηρείσατο
  choice: 安放
  rationale: 表达有意把器皿置于庙中；“安放”庄重自然，不额外断定是储藏或陈列。
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: 在自己庙里
  rationale: ναός指尼布甲尼撒所属的异教神庙；中文用“庙”可避免读者误认为是耶路撒冷圣殿，并保留“自己”的强调。
- source_word: πάλιν
  choice: 又
  rationale: 此处表示再次或继而搬出，并含有逆转先前处置的意味；中文“又”最符合叙事语流。
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: 巴比伦的庙
  rationale: Βαβυλωνία可指巴比伦地区；此处按叙事地点译为“巴比伦”，并以“庙”对应ναός。
- source_word: παρεδόθη
  choice: 交给了
  rationale: 被动形式表示正式移交保管；中文改用自然的处置式表达，语义仍是器皿被移交给相关官员。
- source_word: Ζοροβαβὲλ
  choice: 所罗巴伯
  rationale: 采用现代中文圣经传统中广为人知、由闪语名称而来的标准译名，便于人物辨识。
- source_word: Σαβανασσάρῳ
  choice: 撒巴拿撒
  rationale: 按本书希腊文Σαβανασσάρ音译，不在正文中直接协调为《以斯拉记》较熟悉的“设巴萨”；后者列入脚注。
- source_word: τῷ ἐπάρχῳ
  choice: 省长
  rationale: ἔπαρχος指地方行政长官；“省长”在现代中文圣经历史叙事中清楚而简洁。
theological_decisions:
- issue: 耶路撒冷敬拜建筑与巴比伦异教建筑的术语区别
  choice: 将οἶκος译为“殿”，将ναός译为“庙”
  alternative: 两者都译为“殿”或“圣殿”
  rationale: 希腊文刻意使用不同名词；中文以“殿／庙”区分，既符合语境，又避免把巴比伦的庙称为“圣殿”，同时不对其具体宗教归属作超出原文的说明。
- issue: 人名Σαβανασσάρ的呈现
  choice: 正文按希腊文译作“撒巴拿撒”，脚注说明常与“设巴萨”对应
  alternative: 正文直接译作“设巴萨”
  rationale: 《以斯得拉一书》以希腊文本为主要依据，不应无提示地将其独特人名形式协调到马所拉传统；脚注则帮助读者辨认平行传统中的人物。
- issue: παρεδόθη的语态表达
  choice: 自然地译为“交给了”，以上文的居鲁士王为隐含施事
  alternative: 严格保留被动，译为“它们被交给了”
  rationale: 希腊文为单数被动式，与集合性的器皿相应；中文主动处置式更自然，且不改变正式移交的事件关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“圣器皿—金器和银器”明确所指；“搬出—安放—又搬出—交给”保持原句的动作链。正文脚注标记[a]已置于相关人名之后。
