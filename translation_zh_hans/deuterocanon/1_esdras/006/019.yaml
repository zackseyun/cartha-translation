base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: zh_hans
  text: 那时，撒拿巴萨来到后，就为在耶路撒冷的主的殿奠了根基[a]。从那时直到如今，这殿一直在建造，却还没有完工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒拿巴萨”通常被认为就是《以斯拉记》传统中的“设巴萨”。
    reason: 说明希腊人名形式与以斯拉传统中常见名称之间的对应关系，同时不在正文中取代希腊文本的人名。
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: 撒拿巴萨
  rationale: 按希腊文本中的人名音译，不在正文中直接改用以斯拉传统中的另一名称；相关认同关系收入脚注。
- source_word: παραγενόμενος
  choice: 来到
  rationale: 表达此人先抵达、继而奠基的动作次序，符合现代汉语叙事。
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: 奠了根基
  rationale: 这是建筑语境中自然、庄重的汉语表达；避免机械直译为“投入根基”。希腊语形式虽可带过程意味，但这里与后续持续建造形成自然衔接。
- source_word: τοῦ οἴκου Κυρίου
  choice: 主的殿
  rationale: οἶκος字面为“房屋”，在此明确指耶路撒冷的圣殿；“主的殿”既自然清楚，也保留圣经语体。
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: 来到耶路撒冷，为主的殿
  rationale: 希腊语修饰的是“主的殿”，即“在耶路撒冷的主的殿”。汉语中将地点与“来到”结合，可避免“耶路撒冷主的殿”的拗口，同时不改变地点关系。
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: 从那时直到如今
  rationale: 直接保留原文所强调的时间延续。
- source_word: οἰκοδομουμένου
  choice: 一直在建造
  rationale: 表达被动建造过程从当时延续至叙述时点；汉语无须生硬标明被动。
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: 却还没有完工
  rationale: 自然呈现“尚未达到完成”的结果意义，并以“却”传达持续施工与未告完成之间的张力。
theological_decisions:
- issue: 圣殿语境中 Κυρίου 的译法
  choice: 主
  alternative: 耶和华
  rationale: 主要底本为希腊语，原文使用 Κυρίου 而非直接呈现希伯来神名，因此译作“主”，不从相关闪语传统反向补入“耶和华”。
- issue: οἶκος 在此处的译法
  choice: 殿
  alternative: 房屋／主的家
  rationale: 上下文所指为耶路撒冷圣殿。“殿”清楚且符合现代汉语圣经语域；译作“房屋”虽较形式对应，却容易模糊实际所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“奠了根基”“从那时直到如今”“还没有完工”兼顾原文结构与自然汉语。脚注标记[a]置于与撒拿巴萨及其奠基行动相关的句末，正文与脚注对应完整。
