base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: zh_hans
  text: 愿我主君王悉知一切：我们到了犹太地区和耶路撒冷城后，发现犹太被掳者的长老正在耶路撒冷城为主建造一座宏大的新房屋[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”在此指为主建造的圣殿；希腊原文为“房屋”，并以“宏大”“新”修饰。
    reason: 说明οἶκος的字面意义及其在语境中的所指，避免正文将其直接具体化为“圣殿”。
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: 请让……全面知悉
  rationale: 这是书信或奏报中的告知套语；既保留ἔστω的命令语气，也以“全面”表达πάντα的范围。
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: 我们的主君王
  rationale: 此处κύριος是对君王的尊称，不指上帝；“主君王”保留两个称谓及恭敬语气。
- source_word: παραγενόμενοι
  choice: 来到……后
  rationale: 分词在语境中表示时间背景，现代汉语用“来到……后”自然清楚。
- source_word: τὴν χώραν τῆς Ἰουδαίας
  choice: 犹太地区
  rationale: χώρα可指土地、区域或辖地；“地区”不额外断定其行政地位。
- source_word: Ἰερουσαλὴμ τὴν πόλιν
  choice: 耶路撒冷城
  rationale: 将同位结构自然合并，同时保留πόλις所表达的“城”。
- source_word: κατελάβομεν
  choice: 看见
  rationale: 此处意为抵达后发现或遇见某些正在行动的人，并非“抓住”或“占领”；“看见”适合后接“正在建造”。
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: 被掳之犹太人的长老们
  rationale: 希腊语属格关系紧缩而略显含混；此译尽量保留“被掳—犹太人—长老”的表层关系，不直接将其解释为“归回者群体的领袖”。
- source_word: οἰκοδομοῦντας οἶκον τῷ κυρίῳ
  choice: 正在……为主建造……殿宇
  rationale: οἶκος字面为“房屋”，在“为主”及重建圣所的语境中指圣殿；“殿宇”既能传达所指，又比直接译作“圣殿”稍保留原词意象。
- source_word: μέγαν καινόν
  choice: 宏伟的新
  rationale: 保留两个形容词；“宏伟”在建筑语境中自然表达μέγαν，但不强化为奢华或壮丽。
theological_decisions:
- issue: 同一节中κύριος分别指波斯君王和以色列的上帝
  choice: 对君王译作“主君王”，对上帝译作“主”
  alternative: 对君王译作“主人”或“陛下”，对上帝译作“主”
  rationale: 保留希腊语相同词项在不同语境中的呼应，同时靠搭配清楚区分所指；不把对君王的尊称误作神性称号。
- issue: οἶκος是否明译为圣殿
  choice: 正文译“殿宇”，脚注说明即圣殿
  alternative: 正文直译“房屋”或明确译“圣殿”
  rationale: “殿宇”兼顾现代可懂性与οἶκος的“房屋”意象，避免正文过度解释，同时使宗教建筑的所指清楚。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话，保留奏报式敬语。希腊原句在本节末以逗号延续，中文也以逗号收束，以表明句意尚未完结。
