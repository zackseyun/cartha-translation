base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: zh_hans
  text: 因此，愿主[a]——他的名在那地方被呼求——消灭一切伸手阻挠或损害在耶路撒冷的那座主的殿的君王和邦国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的名在那地方被呼求”也可较直译为“他的名在那里被称”。
    reason: 原文ἐπικέκληται为被动完成式，可指名字在该处被称或被呼求；正文按圣殿敬拜语境译为“被呼求”，脚注保留较字面的表达。
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: 因此
  rationale: 承接上文，引出诏令中的结果与咒诅，保留推论语气。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处指以色列的上帝；按圣经常用称谓译为“主”。
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: 他的名在那地方被称颂
  rationale: ἐπικέκληται可指名字在那里被称说、呼求；“被称颂”在圣殿敬拜语境中较自然，同时用脚注保留更直译的可能。
- source_word: ἀφανίσαι
  choice: 愿……消灭
  rationale: 不定式在诏令中具有祈愿或咒诅语气；“愿……消灭”避免误译为单纯将来陈述。
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: 一切……君王和国家
  rationale: 保留πάντα的周遍意义及“君王和国家”的并列结构。
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: 伸手
  rationale: 保留原文采取敌对行动的圣经惯用语；中文无需补出易造成指代不顺的物主代词。
- source_word: κωλῦσαι ἢ κακοποιῆσαι
  choice: 阻挠或损害
  rationale: 分别表达妨碍行动与施加伤害，保留两动词间的强度差异。
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: 耶路撒冷那座主殿
  rationale: “主殿”自然表达“主的殿”，而“那座”保留ἐκεῖνον的指示强调；地点修饰语按现代汉语语序前置。
theological_decisions:
- issue: 上帝之名与圣殿的关系
  choice: 他的名在那地方被称颂
  alternative: 他的名在那地方被称为名号／他的名在那里被呼求
  rationale: 原文说明上帝的名在该处被称说或呼求，表达其名与耶路撒冷圣殿的敬拜关联；不扩写为“使他的名居住”，以免越过希腊文本。
- issue: ἀφανίσαι在诏令中的语气
  choice: 愿主……消灭
  alternative: 主必消灭
  rationale: 将其处理为祈愿、咒诅式语气，保留不定式在上下文中的功能，不把它强化成明确的将来预言。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主殿”保留“主的殿”这一圣经圣殿称谓；整体句法稍作汉语化，同时保留诏令中的祈愿咒诅语气和“伸手”的原文意象。
