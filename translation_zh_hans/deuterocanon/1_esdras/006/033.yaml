base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/033.yaml
  text: I, King Darius, have decreed that this be done carefully according to these instructions.
translation:
  language: zh_hans
  text: 我，大流士王，已经下令：务要照这些规定[a]认真办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“照这些事”。这句话是指大流士诏令中前述的各项规定。
    reason: 保留 κατὰ ταῦτα 的字面表达及其语境所指。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留希腊文中明确出现的第一人称代词，体现王命公式中带强调意味的自称。
- source_word: βασιλεὺς Δαρεῖος
  choice: 大流士王
  rationale: 按现代汉语对君王姓名和称号的自然次序表达，同时保留正式身份。
- source_word: δεδογμάτικα
  choice: 已经下令
  rationale: 该完成时形式表示正式决定已经作出并持续有效；“已经下令”自然、明确，也符合行政诏令语境。
- source_word: ἐπιμελῶς
  choice: 认真
  rationale: 表达执行时应当审慎、尽责；“认真办理”是现代汉语公文语境中自然且不过度解释的说法。
- source_word: κατὰ ταῦτα
  choice: 照这些规定
  rationale: 原义为“照这些事”，在本段诏令语境中回指前述各项规定；正文采用自然明确的表达，并以脚注保留较直译的可能。
- source_word: γίνεσθαι
  choice: 办理
  rationale: 此处不定式指命令所述事项得到实行；结合诏令语体译作“办理”，比“发生”更符合上下文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“我，大流士王”保留希腊文自称与王号的强调结构；冒号和“务要……办理”使王命关系清楚，但不增添原文之外的具体内容。
