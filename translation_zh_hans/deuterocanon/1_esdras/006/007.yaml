revisions:
- from: 以下是西西讷[a]——叙利亚和腓尼基的总督——与撒特拉布赞及其同僚，就是叙利亚和腓尼基的官长，写给并送呈大流士王的书信副本：“愿你安好！”
  to: 以下是西西讷[a]——叙利亚和腓尼基的总督——、撒特拉布赞和他们的同僚，即叙利亚和腓尼基的官长，写给并送呈大流士王的书信副本：“问安。”
  rationale: 修订仅消除“其同僚”可能只指向撒特拉布赞的汉语歧义，并将书信问候语调整为更简洁自然的“问安”。保留原有脚注，以说明希腊文单数“写”与复数“送出”的语法转换；不对该处存在的文本／句法不整齐作超出证据的解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了这是一封呈给大流士王的书信副本、发信官员及其辖区和问安语。然“其同僚”在汉语中通常只回指紧邻的“撒特拉布赞”，而希腊文的οἱ συνέταιροι在此作为具名官员一方的同僚／同事，宜避免不必要地缩窄其所指。原文在ἔγραφεν（单数）与ἀπέστειλαν（复数）之间的语法转换应继续以脚注说明；正文可作符合中文公文叙述的集体表述。
  naturalness: 原译语体庄重通顺。“以下是”与“书信副本”搭配自然；但“与撒特拉布赞及其同僚”有轻微指代歧义。改为“撒特拉布赞和他们的同僚”更清晰。“问安”是现代中文中简洁且适合古代书信格式的对应语。
  terminology: “总督”“官长”“书信副本”均可接受，且能区分ἔπαρχος与ἡγεμόνες。专名“西西讷”“撒特拉布赞”、地名“叙利亚”“腓尼基”可保留。
  issues:
  - severity: medium
    issue: “其同僚”的回指范围可能被理解为仅指撒特拉布赞。
    rationale: 希腊文将Σισίννης、Σαθραβουζάνης及οἱ συνέταιροι并列为送信者；中文“其”紧接单数人名，易造成不必要的狭义回指。以“他们的同僚”消除此歧义，且不改变原文的概括性。
  - severity: low
    issue: 问安语可更贴近中文书信格式。
    rationale: χαίρειν是书信套语；“问安”简洁自然，也不会把原文泛称的致意过度扩展为祈愿式措辞。
  revised_text: 以下是西西讷[a]——叙利亚和腓尼基的总督——、撒特拉布赞和他们的同僚，即叙利亚和腓尼基的官长，写给并送呈大流士王的书信副本：“问安。”
  revised_footnotes:
