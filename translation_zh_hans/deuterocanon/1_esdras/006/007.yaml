base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: zh_hans
  text: 以下是西西讷[a]——叙利亚和腓尼基的总督——、撒特拉布赞和他们的同僚，即叙利亚和腓尼基的官长，写给并送呈大流士王的书信副本：“问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在这里由单数“写”转为复数“送出”。译文按具名官员共同发函的意思顺译。
    reason: 原文语法说明
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: 书信副本
  rationale: Ἀντίγραφον指文件的抄本或副本，ἐπιστολῆς说明其为书信；“书信副本”简洁自然，也符合公文语境。
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: 写给并送呈
  rationale: 原文由单数ἔγραφεν转为复数ἀπέστειλαν，存在轻微语法转换；中文以并列谓语顺畅表达具名官员共同署写、递送的整体行动，同时用脚注保留这一现象。
- source_word: Σισίννης
  choice: 西西讷
  rationale: 依希腊文音译人名，并采用适合现代普通话的简体中文形式。
- source_word: ὁ ἔπαρχος
  choice: 总督
  rationale: ἔπαρχος在此指管辖地区的高级行政长官；“总督”能清楚体现其辖区性职务。
- source_word: Συρίας καὶ Φοινίκης
  choice: 叙利亚和腓尼基
  rationale: 属格表明总督的管辖范围，也限定后文官长所在地区。
- source_word: Σαθραβουζάνης
  choice: 撒特拉布赞
  rationale: 按照希腊文形式音译，力求兼顾辨识度与现代汉语读音。
- source_word: οἱ συνέταιροι
  choice: 其同僚
  rationale: 在官方书信语境中指共同任职或共事者；“同僚”比“伙伴”更准确地体现行政关系。
- source_word: ἡγεμόνες
  choice: 官长
  rationale: 该词泛指掌权的领袖或官员；“官长”既保留其权力身份，也避免与前面的“总督”混同。
- source_word: Βασιλεῖ Δαρείῳ
  choice: 大流士王
  rationale: 与“写给并送呈”搭配，清楚表达与格所标示的收信人。
- source_word: χαίρειν
  choice: 愿你安好
  rationale: 这是希腊书信常用的问候格式；译为“愿你安好”比字面“欢喜”更符合现代中文书信表达，又保留致意语气。
