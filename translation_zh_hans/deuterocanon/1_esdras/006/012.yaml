base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: zh_hans
  text: 他们回答我们说：“我们是创造天地之主的仆人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“儿女”。希腊词既可指“仆人”，也可指“孩子”；这里的语境较倾向于“仆人”。
    reason: 保留παῖδες的真实词义歧义，避免把其与上帝的关系仅限定为服事或儿女身份。
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν λέγοντες
  choice: 他们回答我们说
  rationale: 直接保留叙事中的回答动作、受话者和引语引介；现代汉语自然通顺。
- source_word: παῖδες
  choice: 仆人
  rationale: 该词可指“孩子”或“仆人”；在向官员说明身份与工程权柄的语境中，“仆人”更能体现归属和服事，同时以脚注保留另一可能。
- source_word: τοῦ κυρίου
  choice: 之主
  rationale: κύριος在此指上帝，译作“主”符合经文传统并保留其主权含义；“创造天地之主”是自然而庄重的汉语结构。
- source_word: τοῦ κτίσαντος
  choice: 创造
  rationale: 分词修饰“主”，表明其创造者身份；汉语用“创造天地之主”简洁地保留这一关系。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: “天地”是现代汉语中自然且具有经文色彩的整体表达，准确传达“天和地”。
theological_decisions:
- issue: παῖδες表示人与上帝的关系
  choice: 仆人
  alternative: 儿女
  rationale: 语境侧重说话者作为上帝服事者的身份，而非明确宣称儿女身份；不过希腊词本身确有两义，因此用脚注保留歧义。
- issue: κύριος用于上帝
  choice: 主
  alternative: 主人
  rationale: “主”既表达上帝的主权，也符合犹太—希腊经文用语；“主人”在此过于日常，并可能缩窄神学内涵。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“创造天地之主”比逐字式的“那创造天和地的主”更符合汉语习惯，同时不损失原文信息。
