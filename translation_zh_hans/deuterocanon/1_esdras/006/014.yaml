base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: zh_hans
  text: 因为我们的祖先曾惹他发怒，得罪了以色列的主——那位属天者[a]，所以他把他们交在巴比伦王、迦勒底人的王尼布甲尼撒手中；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的上帝”。希腊文直译为“那位属天者”；与《以斯拉记》相关的传统常使用较完整的称号“天上的上帝”。
    reason: 说明主要希腊文本的独特称号，并保留相关传统所支持的另一种理解。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 因为
  rationale: 在此引出被掳的原因，译作“因为”自然且准确。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 指共同体历史上的先辈；现代汉语用“祖先”比直译“父辈”更清楚自然。
- source_word: παραπικράναντες
  choice: 悖逆
  rationale: 该分词表达以反叛行为触怒上帝；“悖逆”简洁保留宗教与盟约语境，也不必补出原文未明说的宾语。
- source_word: ἥμαρτον εἰς
  choice: 得罪了
  rationale: 在此表示向某位犯罪，汉语“得罪了”兼顾罪与针对对象的含义。
- source_word: τὸν κύριον τοῦ Ἰσραὴλ
  choice: 以色列的主
  rationale: 严格保留希腊文“以色列的主”，不从相关传统补入“上帝”。
- source_word: τὸν οὐράνιον
  choice: 那位属天者
  rationale: 形容词在此作名词并与“以色列的主”同位；此译保留希腊文较为独特而含蓄的称号。
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: 把他们交在……手中
  rationale: 保留圣经中表示交付在敌方权势之下的惯用形象。
- source_word: Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及历史称谓中通行的人名译法。
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: 巴比伦王、迦勒底人的王
  rationale: 保留希腊文重复的两个王号及其同位关系，不予合并省略。
theological_decisions:
- issue: τὸν οὐράνιον 作为“以色列的主”的同位称号
  choice: 那位属天者
  alternative: 天上的上帝
  rationale: 主要希腊文本只有名词化的形容词“属天者”，没有明确出现“上帝”；正文保留这一措辞及其张力，脚注说明相关传统中的扩展称号。
- issue: κύριος 的译法
  choice: 主
  alternative: 上主
  rationale: “主”直接对应 κύριος，庄重而为现代普通读者熟悉；此处不使用全大写等汉语中不自然的区分方式。
- issue: 被掳事件中的神圣主体
  choice: 他就把他们交在……手中
  alternative: 他们就被交在……手中
  rationale: 希腊文 παρέδωκεν 明确以先行的神圣称号所指者为主语，因此保留主动表达，不淡化审判行动。
translation_notes:
  register: 采用现代、庄重且可朗读的书面普通话。“祖先”“悖逆”“交在……手中”兼顾清晰度与圣经叙事语感；两个王号均按原文保留。脚注标记置于其所解释的“那位属天者”之后。
