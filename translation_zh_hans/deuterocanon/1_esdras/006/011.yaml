base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: zh_hans
  text: 因此，我们查问了他们，为要让你知晓，并把那些领头的人的姓名写给你；我们又向他们索要那些为首的人的名册。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领头的人”所对应的希腊语也可理解为“负责说明或陈述的人”；此处的确切侧重不完全确定。
    reason: lexical_alternative
  - marker: b
    text: “名册”指那些为首的人的姓名记录。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: 盘问了
  rationale: 此动词可指询问或查问；在官员呈报的行政语境中，“盘问”保留了正式调查的意味。
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  choice: 好把情况告知你
  rationale: 以自然的现代汉语表达目的结构，同时不把所告知的具体内容限定得超过希腊文。
- source_word: γράψαι σοι
  choice: 写给你
  rationale: 忠实保留书面呈报的动作，中文简洁自然。
- source_word: τοὺς ἀνθρώπους τοὺς ἀφηγουμένους
  choice: 那些带头之人
  rationale: ἀφηγουμένους 在此较难确定，可含引领、带头或出面陈述之意；正文采用合乎行政语境的“带头”，脚注保留另一可能。
- source_word: ὀνοματογραφίαν
  choice: 名册
  rationale: 此罕见词指写成的姓名记录；“名册”准确、简明，并具有行政文书色彩。
- source_word: τῶν προκαθηγουμένων
  choice: 主持者
  rationale: 该分词指居首、主管或主持的人；“主持者”既表达其位置和职责，又避免与前一分词完全重复。
