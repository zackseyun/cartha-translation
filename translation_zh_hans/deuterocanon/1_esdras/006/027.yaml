base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: zh_hans
  text: 我也下令，要把它彻底建成，并且认真督办[a]，好让他们同那些从犹太被掳的人[b]一起做工，直到主的殿建成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认真督办”所译的希腊词，字面意思是“专注察看”；在这里指认真看顾并确保事情落实。
    reason: 说明该词由字面视觉动作引申出的行政监督含义。
  - marker: b
    text: 原文直译近于“那些出自犹太的被掳（或流放）的人”。“犹太”与“被掳／流放”之间的属格关系在希腊文中较为压缩。
    reason: 保留原文对犹太被掳者的表述及“被掳／流放”的词汇范围，不将上下文所推知的归回情况写入正文或词义说明。
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: 我也
  rationale: 承接前文并保留君王第一人称命令中的递加意味；现代汉语中无需机械译出δέ。
- source_word: ἐπέταξα
  choice: 下令
  rationale: 准确表达ἐπιτάσσω所含的权威命令语气，又不将其过度具体化为正式诏书。
- source_word: ὁλοσχερῶς οἰκοδομῆσαι
  choice: 把它完全建造起来
  rationale: ὁλοσχερῶς强调工程须完整完成；οἰκοδομῆσαι本义为建造，故正文不擅自强化为“重建”，宾语则按上下文以“它”承接。
- source_word: ἀτενίσαι
  choice: 切实督办
  rationale: 该词本义是专注察看；在行政命令语境中指认真看顾、确保事情落实。“切实督办”传达这一功能，同时以脚注保留其字面意象。
- source_word: ἵνα συνποιῶσιν
  choice: 使他们……一同做工
  rationale: 保留ἵνα的目的意味、第三人称复数主语以及συνποιέω所表达的共同参与；不擅自明确“他们”具体指谁。
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: 与那些从犹太被掳的人
  rationale: 尽量保留希腊语“出自犹太的被掳/流亡”这一略显压缩的表达，不在正文中明加“归来”，以免消除原文的措辞张力。
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: 直到……建成
  rationale: 自然表达持续到工程完成为止的界限，并保留被动完成的含义。
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: 主的殿
  rationale: “殿”在现代汉语圣经语体中自然指神的居所与圣殿，既保留οἶκος的建筑意象，也避免较生硬的“主的房屋”。
theological_decisions:
- issue: 圣殿语境中κυρίου的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文本为普通称号κυρίου，并未直接出现希伯来神名；译作“主”既忠于希腊语，也不把神名读法倒灌进正文。
- issue: “他们”的所指
  choice: 保留未明确的第三人称复数“他们”
  alternative: 明确译为官员、地方长官或工匠
  rationale: 本节希腊文没有在句内明说主语身份；保留代词可避免依据上下文作出超过原文的身份判定。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“完全建造起来”紧贴希腊文，避免仅因历史背景而直接改成“重建”；“主的殿”比“主的房屋”更符合自然汉语宗教语境。脚注标记均放在其实际说明的词组之后。
