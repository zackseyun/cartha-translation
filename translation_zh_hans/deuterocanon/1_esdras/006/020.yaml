base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: zh_hans
  text: 那么[a]，王啊，请作裁定；请在我主君王位于巴比伦的王室档案中查核，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以现在，王啊，请作决定；请在我主君王位于巴比伦的王室档案中查验。”
    reason: 保留 κρίνεται、ἐπισκεπτήτω 及 βασιλικοῖς βιβλιοφυλακίοις 的词汇替代可能，并与英文审校轨迹的脚注锚点对应。
lexical_decisions:
- source_word: νῦν οὖν
  choice: 那么
  rationale: 兼顾承接和推论语气；现代汉语中比直译“所以现在”更自然。
- source_word: κρίνεται
  choice: 请作裁定
  rationale: 此处为非人称、行政性的裁断请求；“作裁定”保留正式语气，不把它过度限定为司法审判。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留呼格的直接称呼和正式请愿语气。
- source_word: ἐπισκεπτήτω
  choice: 请查考
  rationale: 表示对文献记录进行正式检查或查核；“查考”既贴合档案语境，也保持庄重。
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: 王室档案
  rationale: 该词指收藏书卷、文书之处；在行政语境中译为“王室档案”比“王室图书馆”更准确自然。
- source_word: τοῦ κυρίου βασιλέως
  choice: 我主王
  rationale: 按宫廷敬语处理，指受尊称的君王，并非神圣称号；补出“我”使现代汉语的臣属敬称自然。
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: 在巴比伦的
  rationale: 明确修饰王室档案，忠实表达其所在地而不添加不必要的指示语。
theological_decisions:
- issue: 宫廷用语 τοῦ κυρίου βασιλέως 中 κύριος 的译法
  choice: 我主王
  alternative: 主王；君王陛下
  rationale: 这里的 κύριος 是对世俗君王的尊称，并非对上帝的称号；“我主王”保留原文结构与臣属语气，避免产生神学误解。
translation_notes:
  register: 采用现代、庄重的请愿文体。“请作裁定；请查考”呈现两个相连的正式请求。句末保留逗号，因原文在此尚未完句。
