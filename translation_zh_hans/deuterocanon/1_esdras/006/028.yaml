base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: zh_hans
  text: 并且要从柯里叙利亚[a]和腓尼基的税收中，仔细地拨给这些人款项或供应[b]，作为献给主的祭祀之用；给总督所罗巴伯[c]，用于购置公牛、公绵羊和羊羔，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柯里叙利亚”是希腊化时期沿用的地区名称；希腊文按字面可理解为“低洼叙利亚”或“谷地叙利亚”。
    reason: cultural_note
  - marker: b
    text: “款项或供应”也可译作“拨给款项”或“提供所需物资”。希腊文指从省区收入中作出的官方拨付，但未明确限定拨付的具体形式。
    reason: lexical_alternative
  - marker: c
    text: 希腊文在“给总督所罗巴伯”一处句法紧缩；所罗巴伯可能是这项供给的领取者或经管者，也可能是在诏令中附带标明身份的人。
    reason: alternative_reading
lexical_decisions:
- source_word: φορολογίας
  choice: 税收
  rationale: 这里指省区征税所得的官方收入；“税收”比“贡赋”更直接地表达资金来源，同时适合现代汉语。
- source_word: κοίλης Συρίας
  choice: 柯里叙利亚
  rationale: 这是希腊化时期固定的地区名称 Coele-Syria，不宜按字面译成“低洼的叙利亚”；采用音译并以脚注说明。
- source_word: ἐπιμελῶς
  choice: 认真
  rationale: 表达办理拨款时应当尽责、审慎；“认真”自然清楚，又保留行政命令的语气。
- source_word: σύνταξιν δίδοσθαι
  choice: 拨出供给
  rationale: σύνταξις 在这里指从官方收入中拨出的定额、款项或供应；“拨出供给”既体现财政拨付，也不把具体形式限定为现金。
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: 这些人
  rationale: 所指对象在上下文中是特定群体；现代汉语“这些人”自然，并未增添原文没有的职务身份。
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: 用来向主献祭
  rationale: εἰς 表目的，θυσία 指祭献；“向主献祭”准确表达圣殿祭祀用途。
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: 给总督所罗巴伯
  rationale: 保留希腊文与格结构及其紧缩语序，不明确断定所罗巴伯究竟是款项的领取者、经管者，还是诏令中对相关人物的附加说明。
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: 公牛、公绵羊和羊羔
  rationale: 分别对应三类祭牲；“公绵羊”明确 κριούς 的性别和种类，“羊羔”符合 ἄρνας 的祭祀语境。
theological_decisions:
- issue: 祭祀语境中 κυρίῳ 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本写作 κυρίῳ，并未在本句直接呈现神名；译作“主”忠于主要底本，也不额外引入对希伯来神名的复原。
- issue: “总督所罗巴伯”在句中的句法关系
  choice: 保留“给总督所罗巴伯”的紧缩表达，并加脚注说明
  alternative: 由总督所罗巴伯经管／交给总督所罗巴伯
  rationale: 希腊文 Ζοροβάβελ ἐπάρχῳ 的位置和与格关系较紧缩，可指接受或管理供给的人，也可能是诏令中的附加身份说明；正文不宜替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“并要”承接上下文中的命令；句末保留逗号，以反映所给经文片段尚未结束。地名采用通行希腊名称的汉语音译；祭牲名称具体而不古奥。
