base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: zh_hans
  text: 并要下令：凡违犯所写的规定中任何一项，并使其无效的人，都要从他自己的产业中取出一根木梁，把他挂在上面[a]；他的财产要归王室所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将他刺在其上”或“将他悬在其上”。希腊文直译为“挂”，但这里所说的古代刑罚可能包括刺刑，或把人公开悬挂在木梁上。
    reason: 保留κρεμασθῆναι在古代刑罚语境中可能具有的多种理解，并将标记锚定于相应的刑罚动词。
lexical_decisions:
- source_word: προστάξαι
  choice: 要下令
  rationale: 承接上下文中的行政命令语气，简洁地表达正式颁令。
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: 违犯上述任何一项
  rationale: τι加部分属格表示所写事项中的任何一项；“上述”自然指向成文命令，又不增加原文没有的细节。
- source_word: ἀκυρώσωσιν
  choice: 使之失效
  rationale: 准确表达使规定无效、作废的法律含义，并保留其正式语体。
- source_word: λημφθῆναι ξύλον
  choice: 取出一根木梁
  rationale: ξύλον可指木材、木头或木梁；在此刑罚语境中，“木梁”最贴切，同时未将其具体化为十字架等器具。
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: 从他自己的产业中
  rationale: 原文泛指属于他本人的东西或产业，并未明确限定为房屋，因此采用较宽泛的译法。
- source_word: κρεμασθῆναι
  choice: 把他挂在上面
  rationale: 直接保留希腊文“悬挂”的基本意义；具体可能涉及刺刑或公开悬尸，留在脚注说明。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 他的财产
  rationale: 概括其拥有的物质资产，符合现代汉语法律语体。
- source_word: βασιλικά
  choice: 归王室所有
  rationale: 表达财产转归君王或王室产业的法律后果，比单说“成为王家的”更自然明确。
theological_decisions:
- issue: κρεμασθῆναι在波斯时期刑罚语境中的具体方式
  choice: 把他挂在上面
  alternative: 把他刺在上面；把他悬在上面
  rationale: 希腊文直接表达悬挂，却未精确说明处刑技术；正文保留较宽泛的词义，脚注呈现历史语境中可能的具体方式，避免替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而清楚的行政法律语体。“产业”与后文“财产”略作区分：前者对应可从其所有之物中取木梁，后者概括全部资产被没收。脚注标记紧跟具有歧义的刑罚表述相关分句。
