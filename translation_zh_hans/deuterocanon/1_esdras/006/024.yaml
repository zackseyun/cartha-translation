base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: zh_hans
  text: 让他们用常燃的火献祭；其高度为六十肘，宽度为六十肘，用三层凿光的石头和一层本地的新木料建造；所需费用要由居鲁士王的王室支付。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσιν διὰ πυρὸς ἐνδελεχοῦς
  choice: 让他们用常燃的火献祭
  rationale: θύουσιν指献祭；διὰ πυρὸς ἐνδελεχοῦς直指持续燃烧的火。依敕令语境用“让他们”，同时不把“常燃”解释成特定礼仪术语。
- source_word: δόμων λιθίνων ξυστῶν τριῶν
  choice: 三层凿光的石头
  rationale: δόμος在建筑语境中指一层或一排建材；ξυστός指经凿削、修整而光整的石料。
- source_word: δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  choice: 一层本地的新木料
  rationale: 保留ἐγχωρίου“本地的”和καινοῦ“新的”两个修饰成分，并将δόμος按建筑层次处理。
- source_word: τὸ δαπάνημα δοθῆναι ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: 所需费用要由居鲁士王的府库支付
  rationale: δαπάνημα是费用；ἐκ τοῦ οἴκου在王室财政语境中自然表达为“由王的府库”，比字面的“从王的家中”更符合现代汉语。
theological_decisions:
- issue: “常燃的火”是否特指某一祭坛礼制
  choice: 保留为“常燃的火”
  alternative: 译作“常献的燔祭”或加入祭坛说明
  rationale: 希腊文明确提到持续的火，却未在本句说明具体祭种或祭坛；不补入经文没有明说的礼仪解释。
- issue: 高度和宽度的所属对象
  choice: 用“其”保留承接关系
  alternative: 明确补作“圣殿的高度和宽度”
  rationale: 现存希腊文本以关系代词承接对象，本句自身的先行词并不清楚；用“其”既符合中文，也避免擅自消除文本的句法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。建筑用语力求普通读者可懂；计量单位“肘”保留古代尺度，不擅自换算。分号呈现原文中献祭、尺寸结构和费用来源之间略显突兀的并列关系。
