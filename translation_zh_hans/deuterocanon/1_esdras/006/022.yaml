base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/022.yaml
  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: zh_hans
  text: 于是，大流士王下令查阅存放在巴比伦的档案。后来，在米底地区的埃克巴坦纳堡垒中，找到了一处地方[a]，那里记有如下内容：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“找到一个地方，其中记载着这些事。”这里可能指档案中存放这份备忘记录的一个位置；原文没有明确说找到的是一卷文书。
    reason: 保留τόπος的字面含义及其在档案语境中的歧义，不无依据地具体译为“记录”或“卷轴”。
lexical_decisions:
- source_word: προσέταξεν
  choice: 下令
  rationale: 表达君王发布权威命令的语气，简洁而自然。
- source_word: ἐπισκέψασθαι
  choice: 搜查
  rationale: 在王室档案的语境中，指为寻找文书而进行正式查检。
- source_word: βιβλιοφυλακίοις
  choice: 档案库
  rationale: 这里存放的是官方文书，而非一般书籍；“档案库”符合行政语境。
- source_word: τοῖς κειμένοις
  choice: 存放
  rationale: 表示档案库设于或档案存置于巴比伦，采用自然的现代汉语表达。
- source_word: Ἐκβατάνοις
  choice: 埃克巴坦纳
  rationale: 按希腊地名作现代汉语音译。
- source_word: τῇ βάρει
  choice: 城堡
  rationale: βάρις在此指设防的行政中心或堡垒；“城堡”通俗且保留防御性含义。
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: 在米底地区
  rationale: χώρα可指地域或地区；不强行限定为正式行政省份。
- source_word: τόπος
  choice: 一处记录
  rationale: 希腊文直译为“一处/一个地方”；结合档案检索语境，以“一处记录”表达所找到的记载位置，同时在脚注保留字面歧义。
- source_word: ὑπομνημάτιστο
  choice: 记录
  rationale: 表示以下内容作为正式备忘或文书而被记载。
- source_word: τάδε
  choice: 以下内容
  rationale: 自然引出下一节所载文书的正文。
