  verdict: revise
  source_fidelity: 草稿将τόπος译为“一处记录”，虽有脚注说明字面意义，却在正文中把“地方／位置”具体化为“记录”，超出了希腊文的表述。原文在巴比伦档案中下令查检，随后在米底的埃克巴坦纳堡垒中发现一处载有下文备忘记录的地方；应保留这一略显不寻常但有意的地点／存放位置表述。
  naturalness: “后来”可用于交代后续发现；“找到一处地方，那里记有如下内容”在现代书面汉语中尚自然，并比“一处记录，上面写着”更忠实地维持原文的歧义。
  terminology: “大流士王”“档案”“米底地区”“埃克巴坦纳”“堡垒”均合适。“堡垒”比“城堡”更能体现βάρις所指的设防行政中心，且不引入欧洲中世纪城堡的联想。
