  - severity: low
    issue: “埃克巴坦纳城堡”可能使人理解为一个专名化的城堡。
    rationale: 希腊文分别说明埃克巴坦纳、堡垒和米底地区的地点关系；改为“在米底地区的埃克巴坦纳堡垒中”较清楚。
