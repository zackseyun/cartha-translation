review_pass:
  verdict: revise
  source_fidelity: 译文大体反映希腊文所列的材料、施工、工程顺利推进及完成品质。可是“凿石”在现代汉语中不够明确，宜表明是经凿制的石料；“各建筑”无原文“各”的依据；末句的“极尽华美、精心完成”句法上也未清楚呈现工程被完成及两项并列方式。
  naturalness: “那些工程都在殷勤赶办”搭配生硬；“殷勤赶办”也把勤勉与赶工两种可能含义不必要地合并为一个确定说法。改为“殷勤地进行”较自然，并将“赶办”保留为脚注中的可选理解。
  terminology: “贵重的凿制石料”准确表达λίθων ξυστῶν πολυτελῶν的加工性与昂贵性。“建筑物中”对应ἐν τοῖς οἴκοις，避免将其限定为私人住宅或无根据地加上“各”。“华美”和“细致”可恰当地传达此建筑语境中δόξα和ἐπιμέλεια。
  issues:
  - severity: medium
    issue: “凿石”含义不够清楚，且“各建筑”添加了原文未明示的分配意义。
    rationale: ξυστῶν指经加工、凿制的石材；οἴκοις为复数，但并不要求译作“各建筑”。
  - severity: medium
    issue: “那些工程都在殷勤赶办”不合现代汉语惯常搭配，并过度合并σπουδή的语义可能。
    rationale: ἐπὶ σπουδῆς可表示勤勉、热切，也可能带有赶急之意；正文宜选择“殷勤地进行”，将另一可能保留在脚注。
  - severity: medium
    issue: 末句未清楚表达“以华美和细致完成”的修饰关系。
    rationale: συντελούμενα表达完成；ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ并列说明完成所具的华美/辉煌与细致。
  revised_text: 用贵重的凿制石料，木料安放在建筑物中；那些工程都殷勤地进行，工程在他们手中顺利推进，并以极其华美和细致的方式完成。
  revised_footnotes:
  - marker: a
    text: “殷勤地进行”也可译作“赶紧办理”；希腊语ἐπὶ σπουδῆς既可强调殷勤认真，也可强调急切迅速。
    reason: lexical_alternative
  - marker: b
    text: 这里的“华美”译自δόξα，主要指工程所呈现的辉煌、壮丽，而不只是抽象意义上的“荣耀”。
    reason: cultural_note
