  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: zh_hans
  text: 用贵重的凿制石料，木料安放在建筑物中；那些工程都殷勤地进行，工程在他们手中顺利推进，并以极其华美和细致的方式完成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: 昂贵的凿石
  rationale: ξυστός指经过凿削、加工的建筑石料，πολυτελής说明其价值高昂；“昂贵的凿石”既保留建筑语境，也自然易懂。
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: 木料安放在各建筑中
  rationale: ξύλα在此指建筑用木料，τιθεμένων表示被放置、铺设；οἶκοι在施工语境中宜理解为建筑物或其中的房舍，而不限定为私人住宅。
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: 那些工程都在殷勤赶办
  rationale: σπουδή兼有殷勤、热切和迅速办理之意；“殷勤赶办”同时传达认真投入与进度紧迫，保留原词的语义张力。
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: 工程在他们手中顺利进展
  rationale: εὐοδόω表示顺利、成功或兴旺；保留“在他们手中”的施事意象，同时用“顺利进展”符合现代汉语工程语境。
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: 极尽华美、精心完成
  rationale: 建筑语境中的δόξα侧重华美、辉煌，ἐπιμέλεια指用心照料和周密施工；συντελέω表示完成。此译文保留两项并列品质，且语气庄重自然。
