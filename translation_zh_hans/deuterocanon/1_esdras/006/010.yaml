base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
translation:
  language: zh_hans
  text: 那时，我们询问这些长老说：“是谁吩咐你们建造这座殿[b]，并且——”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特所收的希腊文本在“并且”处突然中断，表明这句话接续到下一节。这里保留未完的形式，没有补写其内容。
    reason: textual_variant
  - marker: b
    text: “这座殿”指耶路撒冷的圣殿；希腊文所用的词字面意思是“房屋”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: 我们询问
  rationale: 该未完成时中间形表示为获取信息而查问；“询问”既自然，也符合官员调查的语境。
- source_word: τῶν πρεσβυτέρων τούτων
  choice: 这些长老
  rationale: πρεσβύτεροι在此指群体中受认可的长老或领袖，并非仅指年长者。
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: 是谁吩咐你们
  rationale: 这一属格独立结构追问行动所依据的权威；“是谁吩咐你们”直接保留了命令与授权之意。
- source_word: οἰκοδομεῖτε
  choice: 建造
  rationale: 希腊文只说“建造”，没有明确采用“重建”一词，因此不把上下文含义写进正文。
- source_word: τὸν οἶκον τοῦτον
  choice: 这座殿
  rationale: οἶκος字面为“房屋”，但在本语境明确指耶路撒冷圣殿；汉语称“这座殿”自然简洁，同时由脚注说明所指。
- source_word: καὶ
  choice: 又——
  rationale: 现存希腊文本在连接词καὶ处戛然而止；用“又——”和破折号保留未完句式，而不擅自补足下文。
