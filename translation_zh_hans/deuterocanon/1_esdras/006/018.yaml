base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: zh_hans
  text: 又有命令传给他，要他把这一切器皿带回，安放在耶路撒冷的圣殿里，并在原址建造主的殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在原址”也可译作“在那地方”或“在原来的地方”；“建造”按语境也可理解为“重建”。
    reason: 保留 ἐπὶ τοῦ τόπου 的指代宽度，以及 οἰκοδομηθῆναι 在词面“建造”与语境“重建”之间的张力。
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: 有命令吩咐他
  rationale: 保留希腊文被动式所表达的正式命令语气，同时明确 αὐτῷ 所指的命令承受者，不擅自补出发令者。
- source_word: ἀπήνεγκεν
  choice: 带回
  rationale: 该动词在本段语境中指将先前移走的圣殿器皿送回耶路撒冷；“带回”自然表达移动与归还之意。
- source_word: πάντα τὰ σκεύη ταῦτα
  choice: 这一切器皿
  rationale: “器皿”是现代中文圣殿语境中自然且庄重的对应词，也不把所指范围过度限定为某一类用具。
- source_word: ἀποθεῖναι
  choice: 安放
  rationale: 表达把器皿放置、存放于圣殿中的动作；“安放”比单纯“放”更符合礼仪器物的语境，但不额外加入奉献等含义。
- source_word: τῷ ναῷ τῷ ἐν Ἰερουσαλήμ
  choice: 耶路撒冷的圣殿
  rationale: 自然表达定语关系；此处 ναός 依上下文译作“圣殿”，清楚指向耶路撒冷敬拜场所。
- source_word: τὸν ναὸν τοῦ κυρίου
  choice: 主的殿
  rationale: κύριος 译作“主”；此处用“主的殿”既庄重又避免连续重复“圣殿”造成中文生硬。
- source_word: οἰκοδομηθῆναι
  choice: 建造
  rationale: 希腊文直接说“被建造”，并未在词形上明确“重建”；中文以命令结构中的“建造”传达其意义，不把语境上的恢复含义写死。
- source_word: ἐπὶ τοῦ τόπου
  choice: 在原址
  rationale: 该短语直译可为“在那地方／在其地点”；上下文很可能指圣殿原有地址。“原址”是自然中文，但以脚注保留较宽的字面可能。
theological_decisions:
- issue: κύριος 在七十士译本圣殿语境中的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文仅作 κύριος；译为“主”忠实保留其称谓形式，不反向补写希伯来神名，也不引入特定宗派惯用称呼。
- issue: οἰκοδομηθῆναι 是否明确译为“重建”
  choice: 建造
  alternative: 重建
  rationale: 历史语境支持“重建”，但希腊词本身只明确表示建造。正文保留原文措辞的开放度，不以语境推论取代词面表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。开头用“有命令吩咐他”保留正式诏令的被动语气；句中采用并列命令结构，使中文流畅，同时不补出希腊文未说明的发令者。
