base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: zh_hans
  text: 同样，麦子、盐、酒和油，也要年年不断供应；要照耶路撒冷祭司所规定的，每日耗用，不得异议。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“务必照办”或“毫无争议”。原文副词既可强调不得反对，也可强调必须确实执行。
    reason: 词义存在语境歧义，可能侧重无异议，也可能侧重执行无误。
lexical_decisions:
- source_word: πυρὸν
  choice: 麦子
  rationale: 此处是πυρός的宾格单数，通常特指麦子；译作“麦子”保留供物清单中的具体品类。
- source_word: ἅλα
  choice: 盐
  rationale: 这是祭祀供应品，按通常词义译为“盐”。
- source_word: οἶνον
  choice: 酒
  rationale: 在祭祀供应清单中按标准词义译为“酒”。
- source_word: ἔλαιον
  choice: 油
  rationale: 语境所指为橄榄油，但现代汉语圣经语体中“油”自然简洁，且已足够清楚。
- source_word: ἐνδελεχῶς κατʼ ἐνιαυτόν
  choice: 年年持续供应
  rationale: 将持续、定期之意与逐年之意合并为自然的行政命令用语；“供应”为中文句法所需的语境补足。
- source_word: ὑπαγορεύσωσιν
  choice: 所吩咐的
  rationale: 表示祭司指示或规定每日所需；“吩咐”既自然，也保留权威性的行政语气。
- source_word: ἀναλίσκεσθαι
  choice: 使用
  rationale: 指这些物资在日常敬拜中被耗用；“使用”避免误解为仅供食用，同时在中文中比“用尽”更自然。
- source_word: καθʼ ἡμέραν
  choice: 每日
  rationale: 简洁表达逐日、日常的分配意义。
- source_word: ἀναμφισβητήτως
  choice: 不得异议
  rationale: 保留该词“不可争议、不得反对”的字面行政语气，不将其无声地限定为“不得中断”。
