base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: zh_hans
  text: 大流士在位第二年，先知哈该和易多的儿子撒迦利亚，奉主、以色列的上帝的名，向住在犹太地和耶路撒冷的犹太人说预言[a]，论到他们[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“犹太地和耶路撒冷”；与之平行的亚兰文经文可直译为“犹大和耶路撒冷”。
    reason: lexical_alternative
  - marker: b
    text: 原文末尾短语较为简略，直译近于“在他们之上”，也可理解为“向他们”。正文译作“论到他们”，以保留其所指关系而不作进一步解释。
    reason: alternative_reading
  - marker: c
    text: 希腊文本在“先知”前重复了冠词，可能是抄写或流传过程中形成的讹误；正文按其显然的复数同位语意思翻译。
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: 大流士在位第二年
  rationale: δέ仅作轻微承接，不必另译；把属格结构自然地译为现代汉语的纪年表达。
- source_word: ἐπροφήτευσεν
  choice: 说预言
  rationale: 准确表达先知宣讲的活动，又比生硬的“预言了”更符合现代汉语。
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: 哈该和易多的儿子撒迦利亚
  rationale: 单数父名结构修饰撒迦利亚；“易多”采用现代中文圣经中常见的人名形式。
- source_word: οἱ οἱ προφῆται
  choice: 先知哈该和……撒迦利亚
  rationale: 将同位语自然前置；原文重复冠词不在正文机械重现，而以脚注说明。
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: 向……犹太人
  rationale: 在说预言的语境中，ἐπί表示言语所指向的听众，并无必要译成敌对意味的“攻击”。
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: 住在犹太地和耶路撒冷的
  rationale: 以“犹太地”表达希腊文Ἰουδαία所指地区，并保留与耶路撒冷并列的结构。
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραὴλ
  choice: 奉以色列的上帝——主的名
  rationale: “奉……的名”自然表达先知受权宣讲；破折号保留“主”与“以色列的上帝”之间可能的同位关系。
- source_word: ἐπ’ αὐτούς
  choice: 这预言临到他们
  rationale: 保留末尾短语的重复强调，同时避免汉语中含义不明的“在他们之上”；该短语仍有“论到他们”等可能，故附注。
theological_decisions:
- issue: 犹太经文语境中κύριος的译法
  choice: 主
  alternative: 耶和华；上主
  rationale: 主要底本是希腊文，所用词为κύριος；译作“主”既忠于希腊文，也不把希伯来底本的神名形式直接引入正文。
- issue: 两次ἐπί所表达的先知与群体的关系
  choice: 第一次译“向”，末次译“临到”
  alternative: “攻击……论到他们”；“向……向他们”
  rationale: 第一次清楚标出宣讲对象；末次原文表述压缩且语义开放，用“临到”保留先知信息指向并避免断定为谴责，同时以脚注列出其他理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句法按汉语信息顺序重组，以“先知”前置标明哈该和撒迦利亚的身份；对末尾压缩短语不作过度神学解释，并用脚注保存其歧义。所有脚注标记均已置于正文。
