base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: zh_hans
  text: 他们拆毁了那殿[a]，又放火烧了它，并把百姓掳到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指上帝的殿，也就是圣殿。
    reason: 说明 οἶκον 在本段历史语境中的具体所指，同时保留正文较贴近原文的表达。
lexical_decisions:
- source_word: οἶκον
  choice: 那殿
  rationale: 原义为“房屋”，在本段历史语境中特指上帝的殿。“那殿”既自然明确，也保留了原文未直接采用专门“圣殿”用语的特点。
- source_word: καθελόντες
  choice: 拆毁
  rationale: 该分词表示拆下、摧毁；“拆毁”简洁地传达建筑遭破坏的动作。
- source_word: ἐνεπύρισαν
  choice: 放火焚烧
  rationale: 该动词表示使之燃烧、付之一炬；“放火焚烧”在现代汉语中准确传达主动纵火的含义。
- source_word: λαὸν
  choice: 百姓
  rationale: 这是对当地民众的集合称谓；“百姓”符合圣经叙事语体，也为普通读者所熟悉。
- source_word: ᾐχμαλώτευσαν
  choice: 掳
  rationale: 该动词表示俘获并带走；“掳到”保留被俘迁移的意象，不将其仅仅解释为一般性的流放。
- source_word: εἰς Βαβυλῶνα
  choice: 到巴比伦
  rationale: εἰς 表示方向或目的地；“到巴比伦”是自然准确的现代汉语表达。
theological_decisions:
- issue: “殿”（οἶκον）的所指
  choice: 正文译作“那殿”，脚注说明是上帝的殿，即圣殿
  alternative: 译作“那房屋”或直接译作“圣殿”
  rationale: 希腊文使用通常意为“房屋、殿宇”的 οἶκος，而非更专门的圣殿词语；单译“房屋”在现代汉语中容易误解，直接译“圣殿”又会略微明确化原文，因此采用“那殿”并以脚注交代所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拆毁……放火焚烧”呈现希腊文两个连续的破坏动作；“掳到巴比伦”保留俘虏并带往异地的叙事形象。
