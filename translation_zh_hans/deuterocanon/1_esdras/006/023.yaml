base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: zh_hans
  text: 居鲁士王在位第一年，他下令建造耶路撒冷的主的殿；在那里，人们以持续燃烧的火献祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊文十分凝练，也可理解为“在那里，人们不断献上火祭”。
    reason: 保留 διὰ πυρὸς ἐνδελεχοῦς 在“持续燃烧的火”与“持续的火祭”之间的表达张力。
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: 居鲁士执政第一年
  rationale: 按王在位年份纪年的表达；译文简洁自然，同时保留“第一年”和居鲁士掌权的时间含义。
- source_word: βασιλεὺς Κῦρος
  choice: 居鲁士王
  rationale: 明确保留原文的王号，并采用现代汉语常见的“名字＋王”语序。
- source_word: προσέταξεν
  choice: 下令
  rationale: 表达权威性的命令，不额外限定为正式颁布的诏书。
- source_word: τὸν οἶκον τοῦ κυρίου τὸν ἐν Ἰερουσαλὴμ
  choice: 耶路撒冷的主殿
  rationale: οἶκος 字面为“殿／房屋”，此处明确指敬拜场所；“主殿”既保留“主的殿”之意，又避免误解为普通住宅。κύριος 依希腊文本译作“主”。
- source_word: οἰκοδομῆσαι
  choice: 建造
  rationale: 作为命令的内容，汉语用主动形式“下令建造”自然，并不指定实际施工者。
- source_word: ὅπου ἐπιθύουσιν
  choice: 在那里，人们……献祭
  rationale: ὅπου 引出地点说明；ἐπιθύουσιν 在此为祭祀语境中的献祭行为。原文未明说主语，故以泛指“人们”表达。
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: 用常燃的火
  rationale: 按语法，ἐνδελεχοῦς 修饰 πυρός，较直接地表示持续不断或经常维持的火；译文保留借火献祭的图景，不擅自限定为某一种祭。
theological_decisions:
- issue: 圣殿语境中 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 源文本身使用希腊语 κύριος，并未直接出现希伯来神名；译作“主”最贴近现有希腊证据，也不引入特定宗派用语。
- issue: διὰ πυρὸς ἐνδελεχοῦς 所表达的是常燃之火还是持续的火祭
  choice: 正文译作“用常燃的火献祭”
  alternative: 不断献上火祭
  rationale: 形容词在语法上直接修饰“火”，故正文保留“常燃的火”；但整个短语高度凝练，也可能从功能上描述持续进行的火祭，因此以脚注保留另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号衔接建殿命令与地点说明；避免古奥祭祀术语，也不把紧凑的希腊短语过度解释为特定祭类。
