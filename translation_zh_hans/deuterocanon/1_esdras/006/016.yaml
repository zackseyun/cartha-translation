base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: zh_hans
  text: 居鲁士统治巴比伦尼亚的第一年，居鲁士王写道[a]，要建造这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“居鲁士王下令建造这殿。”希腊文直译为“写……建造这殿”；按上下文，这是王以书面形式发出的命令。
    reason: 说明ἔγραψεν与不定式在行政语境中的译法。
  - marker: b
    text: “这殿”指耶路撒冷的圣殿。
    reason: 说明指代对象。
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει
  choice: 第一年
  rationale: ἐν加与格表示时间；δέ在此仅作轻微承接，现代汉语无须另加带强烈转折色彩的连词。
- source_word: βασιλεύοντος Κύρου χώρας Βαβυλωνίας
  choice: 居鲁士统治巴比伦尼亚地区
  rationale: 用时间背景从句表达属格独立结构；χώρα指地区、疆域，不限于巴比伦城，故译作“巴比伦尼亚地区”。
- source_word: ἔγραψεν βασιλεὺς Κῦρος
  choice: 居鲁士王写道
  rationale: 保留ἔγραψεν“写”的直接含义，同时“写道”自然引出书面内容，不在正文中径自强化为“颁布诏令”。
- source_word: οἰκοδομῆσαι
  choice: 要建造
  rationale: 不定式在行政语境中表达书面指示的内容；“要建造”既自然，也避免添加希腊文没有明说的情态程度。
- source_word: τὸν οἶκον τοῦτον
  choice: 这殿
  rationale: οἶκος本义为“房屋”，在本段明确指耶路撒冷的圣殿；“殿”保留宗教建筑语境，而不额外加入“圣”字。
theological_decisions:
- issue: “这殿”的所指
  choice: 正文译作“这殿”，指耶路撒冷的圣殿
  alternative: 这座房屋；这座圣殿
  rationale: 直译“房屋”在现代汉语中容易误解，译作“圣殿”则把语境说明完全写入正文；“这殿”兼顾原文的οἶκος和本段所指。
- issue: 王室文书的效力
  choice: 写道，要建造
  alternative: 下令建造；颁旨建造
  rationale: 上下文确有王室命令的效力，但希腊文仅明确使用“写”，因此正文保留其措辞，并在脚注交代行政含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“巴比伦尼亚地区”体现χώρα的地域含义；保留“写”的原文措辞，并用脚注说明其王命性质。
