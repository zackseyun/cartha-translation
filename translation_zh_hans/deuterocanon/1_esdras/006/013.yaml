base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: zh_hans
  text: 这座殿[a]早在许多年前由以色列一位伟大而有权势的王兴建，最后建成了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”，这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 这句希腊文的措辞较为压缩，尤其“在许多年前”和“借着／由一位……王”之间的关系不甚明确。后者也可按时间关系理解，而非指该王为建造的施事。
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: 兴建
  rationale: 该词为未完成时被动式，带有进行中的建造过程之意；“兴建”在中文中既自然庄重，也可表达工程的展开，而末句“建成了”则对应其完成。
- source_word: ὁ οἶκος
  choice: 这座殿
  rationale: 原词直译为“房屋”，但在本段明确指圣殿；译作“这座殿”既保留“建筑物”的表达，又避免现代读者误解为普通住宅。
- source_word: ἔμπροσθεν ἐτῶν πλειόνων
  choice: 早在许多年前
  rationale: 希腊文表达较为压缩，最自然可理解为“许多年前”或“早在多年前”，表示建殿发生在久远的过去。
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: 由以色列一位伟大而有权势的王
  rationale: διά加属格通常可表示施事或媒介，故译作“由”；“有权势”自然表达ἰσχυροῦ在君王语境中的强盛、有力之意。
- source_word: ἐπετέλεσθη
  choice: 建成了
  rationale: 该被动式表示工程达到完成状态；“建成了”与前面的“兴建”呼应，清楚而自然。
theological_decisions:
- issue: “殿”的指称
  choice: 正文译作“这座殿”，脚注说明原文直译为“房屋”
  alternative: 正文直译作“这座房屋”或明确译作“圣殿”
  rationale: 上下文所指是圣殿，但本节没有使用专门表示“圣殿”的词；“殿”既让现代读者明白所指，也不过度增添原文没有的限定。
- issue: 涉及以色列王的分句如何连接
  choice: 将διά理解为施事，译作“由……王兴建”
  alternative: 将整个压缩短语理解为时间关系，译作“在以色列一位伟大而有权势的王以前，历经多年兴建”
  rationale: 希腊文语序和句法较压缩，存在不同理解；不过διά加属格最直接的意义是“借着、由”，而“早在许多年前”也可自然修饰整件往事。脚注保留另一种时间性读法，不把传本文本的困难隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“早在许多年前”交代久远时间，“兴建……建成”保留建造过程与最终完成之间的体貌对照。正文按希腊文较直接的施事读法翻译，同时用脚注呈现英语审校层所保留的时间性解释。
