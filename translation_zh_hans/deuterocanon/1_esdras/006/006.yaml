base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
translation:
  language: zh_hans
  text: 他们没有被阻止建造，直到有关他们的事呈报给大流士，并得到答复为止[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并有人向他们传话。”希腊语动词可指有人向其说话，也可指得到正式答复；这里的行政语境较支持后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  choice: 没有被阻止
  rationale: 保留 κωλύω 被动式“受阻、被制止”的意义，也符合现代汉语表达。
- source_word: τῆς οἰκοδομῆς
  choice: 继续建造
  rationale: 该属格说明他们未被阻止从事之事；上下文涉及正在进行的工程，译作“继续建造”自然清楚。
- source_word: μέχρις οὗ
  choice: 直到
  rationale: 准确表达时间界限，同时不预先断定答复之后工程是否受阻。
- source_word: ὑποσημανθῆναι
  choice: 呈报
  rationale: 该词可指示意、通报或报告；在向君王传递事务的行政语境中，“呈报”简洁而贴切。
- source_word: Δαρείῳ
  choice: 给大流士
  rationale: 采用现代中文圣经及历史文献中通行的人名译法。
- source_word: περὶ αὐτῶν
  choice: 有关他们的事
  rationale: 保留指向相关人员及其建造事务的概括性，不把对象过度限定为某一份报告或某项指控。
- source_word: προσφωνηθῆναι
  choice: 得到答复
  rationale: 该被动不定式本可表示“被讲话、被答复”；结合呈报大流士的行政语境，译作“得到答复”最自然，同时以脚注保留词义上的另一种可能。
