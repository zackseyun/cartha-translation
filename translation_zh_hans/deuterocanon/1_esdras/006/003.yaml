base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: zh_hans
  text: 当时，叙利亚和腓尼基的总督西辛尼斯[a]，与萨特拉布扎尼斯及其随员一同在他们那里；西辛尼斯对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“对他们说”使用单数动词，最自然地指西辛尼斯为主要发言者；前文虽同时提到萨特拉布扎尼斯及随员，但“在他们那里”也使用单数动词，句法关系并不完全明确。
    reason: 说明两个单数动词及其与并列人物、随员之间的句法张力，避免将存在争议的关联关系确定化。
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: 就在那时
  rationale: 自然表达叙事中的时间衔接，也适度体现 αὐτῷ 所带的强调意味。
- source_word: παρῆν πρὸς αὐτούς
  choice: 在他们那里
  rationale: παρῆν 首先表示“在场”，而非明确表示来到；“在他们那里”自然保留了与该群体同处的含义。
- source_word: Σισίννης
  choice: 西辛尼斯
  rationale: 按希腊文人名音译，并采用适合现代普通话的形式。
- source_word: ὁ ἔπαρχος
  choice: 总督
  rationale: 表示治理一片地区的高级官员；“总督”在此行政语境中清楚、简洁。
- source_word: Συρίας καὶ Φοινίκης
  choice: 叙利亚和腓尼基的
  rationale: 属格说明其管辖区域，置于“总督”之前符合现代汉语表达。
- source_word: Σαθραβουζάνης
  choice: 萨特拉布扎尼斯
  rationale: 依希腊文形式音译。
- source_word: οἱ συνέταιροι
  choice: 同僚
  rationale: 该词可指伙伴或同伴；行政场景中“同僚”比“伙伴”更贴切。希腊文没有明示其所属关系，因此译文用“及其”自然连接，同时不将范围限定得过死。
- source_word: καὶ εἶπεν αὐτοῖς
  choice: 西辛尼斯对他们说
  rationale: εἶπεν 是单数，表明一人发言。为避免汉语中“他”因多个男性人物并列而指代不清，重述西辛尼斯之名；此人作为首要官员，是最自然的所指。
theological_decisions:
- issue: 单数动词 εἶπεν 的发言者
  choice: 正文明确为西辛尼斯，并加脚注说明
  alternative: 译作“他对他们说”或“他们对他们说”
  rationale: 希腊文明确使用单数动词，不能改为复数；但因前面并列两个人名，汉语代词会产生不必要的指代含混。西辛尼斯作为句中主导人物和总督，是最自然的发言者，同时脚注保留句法层面的说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“就在那时”衔接上下文；用“总督”“同僚”体现行政语境。正文重述“西辛尼斯”以消除汉语代词歧义，脚注标记 [a] 已置于主文。
