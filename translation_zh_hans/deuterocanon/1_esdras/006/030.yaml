base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: zh_hans
  text: 好让人为了王和他的儿子们[a]，向至高的上帝献上奠祭[b]，并为他们祷告[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子们”或译“孩子们”。
    reason: παῖδες可指儿子，也可泛指孩子；王室语境使“儿子们”更可能，但不能完全排除较宽泛的意思。
  - marker: b
    text: “奠祭”指浇奠的祭，也可译作“奠酒”。
    reason: 说明σπονδαί所指的液体祭，并提供较直白的词汇选择。
  - marker: c
    text: 所给希腊文本此处的表达有所省略，较直译可作“关于他们”；上下文也可理解为“为他们”。
    reason: 保留περὶ τῆς αὐτῶν的省略性和语义张力，不把未明说的“福祉”或“性命”补入正文。
lexical_decisions:
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的从句；“好让”在现代汉语中自然地保留目的意味。
- source_word: προσφέρωνται
  choice: 献上
  rationale: 该词在祭祀语境中表示呈献祭物；“献上”既自然，也保留礼仪色彩。
- source_word: σπονδαὶ
  choice: 奠祭
  rationale: 指以酒等液体浇奠的祭；“奠祭”简洁庄重，脚注保留较直白的译法。
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: 向至高的上帝
  rationale: 明确保留θεός和ὕψιστος这一称号，不加入后来的教义性解释。
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: 为了王和他的儿子们
  rationale: ὑπέρ表示为了其益处或代表其献祭；παῖδες在王室语境中很可能指儿子，但本身也可泛指孩子，故以脚注保留歧义。
- source_word: προσεύχωνται
  choice: 祷告
  rationale: 直接表达与前一虚拟式并列的目的行为。
- source_word: περὶ τῆς αὐτῶν
  choice: 为他们
  rationale: 所给希腊文本的短语省略而不完整；αὐτῶν回指王和他的儿子们。正文采用语境上自然的受益表达，同时在脚注说明也可较直译为“关于他们”，不擅自补出“福祉”或“性命”等名词。
theological_decisions:
- issue: 神圣称号ὁ ὕψιστος的译法
  choice: 至高的上帝
  alternative: 上帝——至高者
  rationale: 所选译法在现代汉语中自然、庄重，并同时保留“上帝”和“至高”两个要素，不附加宗派性含义。
- issue: 为王室成员献祭并祷告的受益含义
  choice: 为了王和他的儿子们……为他们祷告
  alternative: 为王和他的孩子们……关于他们祷告
  rationale: ὑπέρ清楚表达受益或代表关系；περί短语则较含混。正文按上下文采用自然表达，脚注保留其字面可能性，避免把祷告内容具体化为健康、福祉或寿命。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“好让”承接上文并标明目的；“王”比“国王”更贴合经文叙事语体。“奠祭”保留礼仪准确性，并借脚注帮助普通读者理解。
