revisions:
- from: 至于主殿里的圣器[a]，无论金的银的，就是尼布甲尼撒从耶路撒冷的殿里搬出、带到巴比伦的，都要归还耶路撒冷的殿，放回原来安置的地方[b]。
  to: 至于主的殿中的圣器[a]，无论金器银器，就是尼布甲尼撒从耶路撒冷的殿中取出并带到巴比伦的，都要归还到耶路撒冷的殿中，就是它们原先放置之处[b]，好安放在那里。
  rationale: 将“主殿”改为“主的殿”，消除现代汉语中“主殿”可指正殿的歧义，并更直接对应 οἴκου Κυρίου。恢复原文“归还至殿中”与“在那里安放”的层次；脚注b也修正为准确反映第二处“在耶路撒冷的殿”，并保留末句单数动词所造成的集合性歧义。
