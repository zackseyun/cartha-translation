base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: zh_hans
  text: 至于主的殿中的圣器[a]，无论金器银器，就是尼布甲尼撒从耶路撒冷的殿中取出并带到巴比伦的，都要归还到耶路撒冷的殿中，就是它们原先放置之处[b]，好安放在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣器”指分别出来、专供圣殿礼仪使用的器具。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译可作“归还到在耶路撒冷的殿中，就是它们原先放置之处，好使它安放在那里”。末句动词为单数，可能把这些器物视为一个整体。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: 圣器
  rationale: 指分别用于圣殿礼仪的器具；“圣器”简洁、庄重，也不把器物的具体种类说得过细。
- source_word: οἴκου Κυρίου
  choice: 主殿
  rationale: οἶκος直译为“家、殿”，此处明确指圣殿；“主殿”既保留“主”的称谓，也自然表达语境中的建筑与宗教功能。
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: 无论金的银的
  rationale: 两个形容词名词化并回指“圣器”；汉语无需重复“器”，仍能清楚表达金器和银器两类。
- source_word: ἐξήνεγκεν
  choice: 搬出
  rationale: 保留从殿内向外移出的方向性，也符合器物被运走的具体语境。
- source_word: ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: 带到巴比伦
  rationale: 自然表达器物从耶路撒冷转移至巴比伦的完成动作。
- source_word: ἀποκατασταθῆναι
  choice: 归还
  rationale: 表达把器物送回其原属之处；后接“放回”进一步体现恢复原位和用途的含义。
- source_word: οὗ ἦν κείμενα
  choice: 原来安置的地方
  rationale: κείμενα可指“放着、安置”；结合未完成过去时，用“原来”表达先前持续所在之处，而不生硬直译为“躺着”。
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: 放回……地方
  rationale: 以汉语合并目的和安置结果，避免重复“在那里放置”；希腊文单数形式在上下文中仍以器物整体为所指。
- source_word: Ναβουχοδονοσόρ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 圣殿语境中 Κυρίου 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文本为 Κυρίου，并未直接出现希伯来神名；译作“主”忠于希腊语来源，也避免加入特定传统的神名形式。
- issue: οἶκος 在本节的表达
  choice: 殿
  alternative: 家；主的殿宇
  rationale: 上下文所指明确为耶路撒冷圣殿；“殿”在现代汉语中自然清楚，同时脚注保留其字面为“家”的信息。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至于”承接法令条款语气；将希腊文较长的关系从句整理为汉语顺序，但保留器物被搬出、带往巴比伦、归还并重新安置的动作链。所有脚注标记均已置于正文。
