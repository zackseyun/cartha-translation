  yaml_path: translation/deuterocanon/1_esdras/004/007.yaml
  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: zh_hans
  text: 第二位要因自己的智慧坐在大流士身旁[a]，并要被称为大流士的亲属[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将就座”或“将坐下”。希腊文主要指就座；在王室语境中，坐在大流士身旁所含的尊荣或接近程度是由上下文推知的。
    reason: lexical_alternative
  - marker: b
    text: “亲属”可指有血缘关系的亲人，也可能是表示与大流士关系亲近的荣誉称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: 位居第二
  rationale: 这里的阳性单数形式与同一人的称谓相配，表达他在大流士之下居第二位；译作“位居第二”比把它实体化为“第二个人”更符合宫廷语境。
- source_word: καθιεῖται
  choice: 坐在……身旁
  rationale: 该动词表示就座或坐下；结合大流士的宫廷背景，译文自然表达受尊荣、靠近君王而坐，同时不把推断强化为正式任命。
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: 因自己的智慧
  rationale: διά加宾格在此表示原因；“因自己的智慧”简洁保留这一因果关系，并明确反身所属。
- source_word: συγγενής
  choice: 亲族
  rationale: 该词可指有血缘关系的人，也可作宫廷中的亲近荣衔；“亲族”保持庄重，并容纳这两种可能。
- source_word: κληθήσεται
  choice: 要被称为
  rationale: 保留未来被动语态，也不预断这是正式头衔、荣誉称号还是对实际亲属关系的陈述。
