base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/001.yaml
  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: zh_hans
  text: 大流士王为所有属他管辖的人、他家中的所有人，以及米底和波斯的所有权贵，摆设了盛大的宴席[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盛宴”。希腊文指正式的筵席或款待。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχή
  choice: 宴席
  rationale: 该词指设宴款待或正式筵席；“宴席”符合王室场景，也比“招待会”更准确自然。
- source_word: μεγάλην
  choice: 盛大的
  rationale: 既表达宴席规模宏大，也体现其隆重程度，符合现代汉语搭配。
- source_word: τοῖς ὑπʼ αὐτόν
  choice: 臣服于他的人
  rationale: 保留原文“在他之下”的等级和统属意味，同时不把范围过度限定为某一类官员或臣民。
- source_word: οἰκογενέσιν
  choice: 他全家的人
  rationale: 原词所指可宽于直系亲属，涵盖家中或王室家族成员；此处避免仅译作现代意义较窄的“家人”。
- source_word: μεγιστᾶσιν
  choice: 权贵
  rationale: 指身居高位、权势显赫的人；“权贵”在宫廷语境中简洁自然，不把他们仅仅解释为行政官员。
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: 米底和波斯
  rationale: 按原文属格结构，指米底和波斯两地或两国的权贵，采用通行地名。
