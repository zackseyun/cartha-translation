base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/028.yaml
  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: zh_hans
  text: 如今，你们不相信我吗？王的权柄不是很大吗？各地岂不都惧怕碰他吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各地岂不都惧怕碰他吗？”也可译作“各国岂不都惧怕触碰他吗？”希腊语χῶραι可指“土地”“地区”或“国家”；εὐλαβοῦνται含有畏惧而谨慎的意思；ἅψασθαι意为“触碰”。
    reason: 说明χῶραι的地域范围，以及末句“畏惧”与“触碰”的可能表达，避免把语境上的“不可冒犯”解释写入正文。
lexical_decisions:
- source_word: πιστεύετέ
  choice: 相信
  rationale: 此处动词以说话者为宾语，指听众是否接受他所说的话；“相信我”自然、准确，也保留了反问语气。
- source_word: μέγας
  choice: 很大
  rationale: μέγας在这里描述王权的强大与显赫。“权柄很大”符合现代汉语习惯，又不额外引入“伟大”等人格评价。
- source_word: ἐξουσίᾳ
  choice: 权柄
  rationale: 该词可指权力、权威或统治权；“权柄”适合王的统治语境，也保留其合法支配权的意味。
- source_word: χῶραι
  choice: 各地
  rationale: χῶραι可指土地、地区或国家。此处为泛指王统治或影响所及的各个地域；“各地”避免把古代地域概念现代化为民族国家。
- source_word: εὐλαβοῦνται
  choice: 畏惧，不敢
  rationale: 该动词含敬畏、戒惧和谨慎防范之意。结合后面的不定式，“畏惧，不敢碰他”以自然汉语表达因恐惧而避免行动的含义。
- source_word: ἅψασθαι
  choice: 碰他
  rationale: ἅπτομαι本义是触碰或抓住。“碰他”保留具体意象；上下文也可暗示对王动手，但正文不将这一含义说死。
