translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个连续反问对应希腊文结构；首句用“你们”体现πιστεύετέ的复数形式。末句保留“碰他”的具体形象，同时以脚注交代“动他”的语境可能性。
