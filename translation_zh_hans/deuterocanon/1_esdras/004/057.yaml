  yaml_path: translation/deuterocanon/1_esdras/004/057.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: zh_hans
  text: 他把居鲁士从巴比伦分别出来的所有器皿都送了回去[a]；居鲁士所吩咐的一切[b]，他也亲自下令照办，并送往耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“送了出去”。原词可泛指“送出、派送”；但本段恢复圣殿器皿的语境支持译作“送了回去”。
    reason: 说明ἐξαπέστειλεν的字面范围及上下文所支持的复归含义。
  - marker: b
    text: 原文在“居鲁士所吩咐的一切”之后接“下令照办并送往耶路撒冷”，表达较为压缩；“送往”的具体对象由上下文领会。
    reason: 保留并说明希腊文并列不定式及其省略式关联，不把泛义的ποιέω误限为“制作”。
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: 送了出去
  rationale: 该复合动词的基本意思是“送出、派出”。上下文可能含有归还圣殿器皿之意，但希腊文本本身未明说“送回”，因此正文保留较宽泛的方向含义。
- source_word: τὰ σκεύη
  choice: 器皿
  rationale: 在圣殿物件的语境中，σκεύη通常指器皿或用具；“器皿”庄重、自然，也不额外限定具体种类。
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: 居鲁士从巴比伦分出来的
  rationale: χωρίζω表示分开、分别出来；此译保留动作本身及ἀπό所表达的来源，不把它过度解释为挑选、奉献或归还。
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: 居鲁士吩咐制作的一切
  rationale: ποιέω既可表示“做、办理”，也可表示“制作”。紧接器皿语境时，“制作”较为连贯，但以脚注保留“办理”这一语法上可行的理解。
- source_word: καὶ αὐτὸς
  choice: 他也亲自
  rationale: αὐτός带强调作用，καί又有附加意味；“也亲自”同时传达二者。
- source_word: ἐπέταξεν
  choice: 下令
  rationale: 准确表达行政性命令的力度，符合君王颁令的语境。
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: 制作，并送往耶路撒冷
  rationale: 两个不定式并列，均受“下令”支配；中文省去重复的“下令”，仍清楚表达两项受命行动。
theological_decisions:
- issue: 器皿是否明确为归还之物
  choice: 正文译作“送了出去”
  alternative: “送了回去”
  rationale: 归还圣殿器皿符合上下文，但ἐξαπέστειλεν本身只明确表示送出；不在正文中加入原句未明说的恢复或归还方向。
- issue: ποιῆσαι指办理事务还是制作物件
  choice: 正文采用“制作”
  alternative: “办理”或“照办”
  rationale: 器皿语境支持制作物件，但希腊语形式仍可作较宽泛的“做”；脚注保留这一真实歧义，避免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“器皿”“下令”“送往”符合历史叙事语体；避免使用过度古雅的“悉数”“遣送”等词。分号保留希腊文两部分之间的结构关系。
