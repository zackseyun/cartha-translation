  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: zh_hans
  text: 并且，为建造圣殿，每年要拨出二十他连得[a]，直到建成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代一种很大的重量单位，常用于贵金属及货币价值的核算。
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομήν
  choice: 建造
  rationale: 该名词在此指建造的行动或工程；译作“建造”自然简洁，并与后文表示完工的被动式呼应。
- source_word: ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν在此重建语境中指神圣的殿宇或圣殿范围；“圣殿”是现代汉语中清楚而庄重的对应表达。
- source_word: δοθῆναι
  choice: 要拨出
  rationale: 被动不定式表示款项应被给予；结合行政拨款语境，“要拨出”比直译“要给”更自然，同时不具体限定资金来源或支付方式。
- source_word: κατʼ ἐνιαυτόν
  choice: 每年
  rationale: 准确表达逐年、按年度反复给予的意思。
- source_word: τάλαντα εἴκοσι
  choice: 二十他连得
  rationale: 保留古代重量及货币核算单位的传统音译，并以脚注说明，避免擅自折算为现代币值。
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: 直到建成
  rationale: μέχρι τοῦ加不定式表示期限延续至工程完成；“直到建成”保留被动完成含义，所指自然承接圣殿建造工程。
