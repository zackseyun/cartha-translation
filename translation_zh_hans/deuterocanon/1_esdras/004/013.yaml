  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: zh_hans
  text: 王醒来后，他们拿起那份文书[a]交给他，他就读了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文书”或译“文字”“文件”。希腊文γράμμα在这里指书面的材料，未必专指书信。
    reason: lexical_alternative
  - marker: b
    text: “读了”也可能指“宣读了”；希腊文本身在这里没有明确说明是否出声。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη ὁ βασιλεύς
  choice: 王醒来后
  rationale: ἐξηγέρθη虽为被动形式，却常有不及物的“醒来、起来”之意；结合上下文，译作“醒来”最自然，也不额外断定王是自行醒来还是被唤醒。ὅτε在叙事中引出随后发生的动作，汉语用“……后”表达顺畅。
- source_word: λαβόντες
  choice: 他们拿起
  rationale: 该不定过去时分词表示在“交给”之前或与之相伴的动作。改用汉语并列谓语，既保留动作次序，又避免生硬直译为分词结构。
- source_word: τὸ γράμμα
  choice: 那份文书
  rationale: γράμμα在此指呈交给王的书面材料；“文书”比“信”更能保留其可能是文字、文件或书面陈述的语义范围，并符合宫廷叙事语境。
- source_word: ἔδωκαν αὐτῷ
  choice: 交给他
  rationale: 直接表达给予的动作；“交给”在递交文书的语境中自然，同时忠实于ἔδωκαν αὐτῷ。
- source_word: ἀνέγνω
  choice: 他就读了
  rationale: ἀναγινώσκω可指阅读，也可在某些语境中指宣读；本句没有明确说明是否出声，因此正文采用中性的“读了”，并以“就”自然承接动作。宾语由前文“文书”明确，无须再次补出。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那份文书”承接上下文中的特定书面材料；句式按汉语习惯串联“拿起—交给—读”的动作。脚注标记已放在各自所解释的词语之后，纠正了咨询层中标记与注释内容错位的问题。
