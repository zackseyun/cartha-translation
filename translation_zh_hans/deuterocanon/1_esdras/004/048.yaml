base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: zh_hans
  text: 他写信给叙利亚谷地[b]和腓尼基的所有地方官长[a]，也写给在黎巴嫩的人，叫他们把香柏木材从黎巴嫩运到耶路撒冷，好让他们与他一同建造那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地方官长”也可译作“地区统治者”。希腊文指治理某一地区的人。
    reason: lexical_alternative
  - marker: b
    text: “叙利亚谷地”是希腊文中的历史地域名称，也常音译作“科埃勒叙利亚”。
    reason: cultural_note
lexical_decisions:
- source_word: τοπάρχαις
  choice: 地方官长
  rationale: 指治理某一地区的官员或统治者；“地方官长”既体现辖区性质，也比音译称号更便于现代读者理解。
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: 叙利亚谷地
  rationale: 这是历史地域名称 Coele-Syria；采用可理解的中文名称，并以脚注说明其性质，避免笼统译成“叙利亚”。
- source_word: Φοινίκῃ
  choice: 腓尼基
  rationale: 采用该古代地区通行的现代中文名称。
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: 黎巴嫩的人
  rationale: 原文只说“在黎巴嫩的那些人”，没有重复官职名称；此译保留指称上的宽泛性，不擅自限定为官员。
- source_word: μεταφέρειν
  choice: 运到
  rationale: 在建筑材料从黎巴嫩送往耶路撒冷的语境中，“运到”自然地表达搬运和目的地。
- source_word: ξύλα κέδρινα
  choice: 香柏木材
  rationale: 表达作为建筑材料使用的香柏木，较“香柏树”更准确，也不擅自限定为原木。
- source_word: ὅπως οἰκοδομήσωσιν
  choice: 好让他们……建造
  rationale: 保留 ὅπως 加虚拟语气所表达的目的意味，同时使用自然的现代汉语。
- source_word: μετʼ αὐτοῦ
  choice: 与他一同
  rationale: 直接保留共同参与工程的含义，不进一步解释“他”所指的身份。
- source_word: τὴν πόλιν
  choice: 那城
  rationale: 原文明确说“城”，语境中指耶路撒冷；“那城”自然承接前文已提到的耶路撒冷。
theological_decisions:
- issue: 建造工程的对象
  choice: 那城
  alternative: 圣殿／上帝的殿
  rationale: 希腊文明确为 τὴν πόλιν（“那城”），因此不按其他以斯拉传统中的相关经文协调成“圣殿”。
- issue: 黎巴嫩收信人的身份
  choice: 黎巴嫩的人
  alternative: 黎巴嫩的地方官长
  rationale: τοῖς ἐν τῷ Λιβάνῳ 本身没有明说官职；译文保留原文可能指官员、居民或有关人员的宽泛性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他又写信……也写给……”理顺希腊文句序，同时保留两组收信对象；不把“黎巴嫩的人”过度具体化，也不将“那城”协调为“圣殿”。
