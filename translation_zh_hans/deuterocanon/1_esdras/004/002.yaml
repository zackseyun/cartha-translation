  text: and to all the satraps and generals and local rulers under him[a], from India to Ethiopia, throughout the one hundred twenty-seven satrapies.
translation:
  language: zh_hans
  text: 也给他属下的所有总督、将领和地方长官，从印度直到埃塞俄比亚，遍及一百二十七个总督辖区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总督辖区”也可译作“行省”。这里的希腊文用词与前文“总督”同源，反映波斯行政制度的术语。
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: 总督
  rationale: 这是波斯帝国的行政官衔；“总督”既自然易懂，也能与后文“总督辖区”保留同源词之间的联系。
- source_word: στρατηγοῖς
  choice: 将领
  rationale: 此词基本指军事统帅；“将领”符合现代汉语，也与行政性的“总督”和“地方长官”有清楚区别。
- source_word: τοπάρχαις
  choice: 地方长官
  rationale: 指治理较小地区的人；“地方长官”通顺明白，并保留其地方行政层级的含义。
- source_word: τοῖς ὑπʼ αὐτόν
  choice: 他属下
  rationale: 表达这些官员从属于君王、在其权下；“他属下”简洁自然。
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: 从印度直到埃塞俄比亚
  rationale: 忠实保留表示帝国地理范围的起讫结构；“直到”体现 μέχρι 的延伸终点意味。
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: 遍及一百二十七个总督辖区
  rationale: “遍及”自然表达此处 ἐν 在分布范围中的意义；“总督辖区”与前文“总督”对应，并保留波斯行政制度的具体色彩。
