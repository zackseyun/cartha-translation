    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: 坐在
  rationale: 以简明的叙事表达对应不定过去时主动语态，不额外加入正式就座等原文未明说的礼仪意味。
- source_word: χρηματιστηρίῳ
  choice: 议事厅
  rationale: 该词指正式议事或审理的场所；“议事厅”符合王廷审议的语境，同时不把它过度限定为现代法庭。
- source_word: ἀνεγνώσθη
  choice: 宣读了
  rationale: 被动形式表示文书被读；在众人面前的公开场景中，“宣读”自然传达出声诵读，但不增添内容。
- source_word: γράμμα
  choice: 文书
  rationale: 本处指参赛者提交并当众宣读的书面文字；“文书”比“信”更适合正式审议场景，也保留其具体体裁不完全确定的空间。
- source_word: νεανίσκους
  choice: 青年人
  rationale: 指故事中的几名年轻男子；现代汉语中“青年人”清楚自然，且不生硬强调原文已由上下文限定的性别。
- source_word: δηλώσουσιν
  choice: 会说明
  rationale: δηλόω在此意为使其清楚、加以解释；“说明”适合其宾语“自己所说的话”。
- source_word: λόγους
  choice: 自己所说的话
  rationale: λόγοι基本义为言语、陈述；结合物主代词，以自然汉语表达为“自己所说的话”，不提前解释为论点或辩辞。
- source_word: εἰσῆλθοσαν
  choice: 走了进去
  rationale: 直接表达进入该正式场所的动作，比单用“进入”更符合现代汉语连续叙事。
