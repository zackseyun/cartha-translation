  text: And many were destroyed and were led astray and sinned because of women[a].
translation:
  language: zh_hans
  text: 许多人因女人[a]而丧亡、失足、犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妻子”。希腊语γυναῖκες可按上下文指“女人”或“妻子”。
    reason: 保留γυναῖκες在此处真实存在的词义歧义。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 直接表达数量众多，符合现代汉语习惯。
- source_word: ἀπώλοντο
  choice: 丧亡
  rationale: 保留ἀπόλλυμι所表达的严重毁灭或灭亡含义，同时不把意义限定为某一种死亡方式。
- source_word: ἐσφάλησαν
  choice: 失足
  rationale: 该词可指跌倒、受挫或犯错；“失足”既保留跌倒意象，也适合这里的道德语境，不额外加入“受人迷惑”的含义。
- source_word: ἡμάρτοσαν
  choice: 犯罪
  rationale: 在道德和宗教语境中准确表达ἁμαρτάνω，且为普通现代读者熟悉。
- source_word: διὰ τὰς γυναῖκας
  choice: 因女人而
  rationale: διά加宾格在此表示原因；“因……而”直接保留原文的因果关系。γυναῖκας采用较宽泛的“女人”，其“妻子”义另以脚注说明。
theological_decisions:
- issue: 原文将女人表述为丧亡、失足和犯罪的原因，可能显得贬抑女性
  choice: 保留“因女人而”的直接因果表述
  alternative: 译作较弱的“在女人的事上”或改写为不明确归因的表达
  rationale: 希腊文明确使用διά加宾格表达原因。译文应保存原文的修辞张力，不通过弱化或改写来消除其令人不适之处。
- issue: γυναῖκας应理解为一般的女人还是妻子
  choice: 正文译为“女人”
  alternative: 妻子
  rationale: 上下文中的复数表达较为泛指，没有明确限定为婚姻关系；但该希腊词确可表示“妻子”，所以保留为脚注异译。
translation_notes:
  register: 采用现代、庄重而简洁的书面汉语。“丧亡、失足、犯罪”保留原文三个并列动词及其递进式力度；将原因短语前置，使中文自然流畅，同时不改变其对三个动词的共同修饰关系。
