  yaml_path: translation/deuterocanon/1_esdras/004/061.yaml
  text: And he took the letters and went out to Babylon[a], and reported to all his brothers.
translation:
  language: zh_hans
  text: 他拿了那些信，动身前往巴比伦，向他所有的弟兄[a]作了报告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可按语境理解为“同胞”或“族人”；希腊原文直译为“他所有的弟兄”。
    reason: 说明ἀδελφοῖς既可保持字面意义，也可能在此泛指同族或同一群体的人。
lexical_decisions:
- source_word: ἔλαβεν
  choice: 拿了
  rationale: λαμβάνω在此叙事语境中表示取得或接过那些信件；“拿了”简明自然，也保留了动作顺序。
- source_word: τὰς ἐπιστολάς
  choice: 那些信
  rationale: ἐπιστολή通常指书信或正式信函；复数定冠词在上下文中用“那些”自然表达。
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: 动身前往巴比伦
  rationale: ἐξέρχομαι带有离开、出发的动态含义；“动身前往”既体现这一层意思，也符合现代汉语叙事表达。
- source_word: ἀπήγγειλεν
  choice: 作了报告
  rationale: ἀπαγγέλλω可指报告、通报或宣告。原文未明说所报告的宾语，因此采用不补出具体内容的“作了报告”。
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: 向他所有的弟兄
  rationale: 直译其与格结构及πᾶσιν“所有”；“弟兄”保留ἀδελφοῖς的阳性复数形式，同时以脚注说明其语境范围可能更广。
theological_decisions:
- issue: ἀδελφοῖς是否按群体或族群意义展开翻译
  choice: 弟兄
  alternative: 同胞；族人
  rationale: 原文使用阳性复数“弟兄”。正文保留这一源语措辞，不把可能的群体含义强行限定为血缘兄弟，也不擅自扩写为其他群体称谓；脚注提示语境上的可能理解。
- issue: ἀπήγγειλεν隐含内容是否补出
  choice: 作了报告
  alternative: 把这事告诉了他们；向他们宣告
  rationale: 希腊文没有明示直接宾语。正文采用汉语中可不带具体宾语的表达，以免把“信件内容”或“这一切”等解释性内容写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“动身前往”比生硬的“出去到”更符合现代汉语；“作了报告”保留原文未说明报告内容的特点。
