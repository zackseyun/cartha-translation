base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: zh_hans
  text: 它使所有人的心都富足；它不记得君王，也不记得萨特拉普[a]；它又使人人都按塔连得[b]来谈论。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “萨特拉普”指波斯帝国的行省总督。
    reason: 保留 σατράπης 的特定历史行政称号，并为现代读者说明。
  - marker: b
    text: “塔连得”是古代的重量单位，也用来表示金额，往往指一大笔钱财。这里不是指现代所说的“天赋才能”。本句可理解为使人人谈论按塔连得计算的钱财，或谈话总以大笔金额为尺度。希腊语 πάντα 形式上也可指“一切”，但在“谈论”的语境中实际指人。
    reason: 说明 τάλαντον 的货币意义，并交代 διὰ ταλάντων 和 πάντα 的语义范围。
lexical_decisions:
- source_word: πάσας καρδίας
  choice: 所有人的心
  rationale: 保留希腊语以“心”指人的内在思想、愿望和感受的表达，同时“所有人的心”符合现代汉语习惯。
- source_word: ποιεῖ πλουσίας
  choice: 使……都富足
  rationale: 对应 ποιέω 加形容词的使役结构，并与后文重复的 ποιεῖ 保持呼应；“富足”也保留了此处既可关乎财富、又可描述内心感受的张力。
- source_word: οὐ μέμνηται
  choice: 也不记得
  rationale: 按字面保留“记得”的意象，不直接解释为“不把……放在眼里”或“不顾忌”；汉语省略主语，也可保留希腊文此处指代上的不明说。
- source_word: βασιλέα οὐδὲ σατράπην
  choice: 君王或总督
  rationale: “君王”体现 βασιλεύς 的尊严语体；“总督”以普通读者可懂的称谓表达波斯帝国的 σατράπης，而不采用较生僻的音译。
- source_word: πάντα
  choice: 人人
  rationale: 虽然形式上是中性复数“万物/一切”，但 λαλεῖν“说话”通常以人为施事者；译作“人人”能自然表达语境中的实际所指，脚注同时说明其形式上的宽泛性。
- source_word: διὰ ταλάντων
  choice: 说到“塔连得”
  rationale: τάλαντον 在这里是重量兼货币计量单位，不是现代汉语所说的才干。“说到”避免把介词 διά 的具体关系限定得过死，脚注补明可表达以大笔金额谈论或计算。
- source_word: ποιεῖ λαλεῖν
  choice: 使……开口都说到
  rationale: 保留使役结构和“说话”的动作，并以“开口”形成自然、鲜明的现代汉语。
theological_decisions:
- issue: 本节连续动词的隐含主语
  choice: 首句用“它”承接上文所谈的酒，后续分句按汉语习惯省略主语
  alternative: 在每个分句明确补出“酒”，或把“不记得”的主语明确改为“人”
  rationale: 希腊文在本节没有重述名词主语，而由上文承接。仅用“它”既使汉语可读，又避免反复补入原文未明说的“酒”；后文省略主语则保留 οὐ μέμνηται 在句法和语义上的张力。
- issue: πάντα 是“万物”还是“人人”
  choice: 正文采用“人人”
  alternative: 译为“一切”或“万物”
  rationale: 说话这一动作在此语境中指向人，故“人人”最符合实际意义；但希腊语形式本身较宽泛，因此在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“所有人的心都富足”保留原文的内心意象；“君王或总督”兼顾历史色彩与可读性；“塔连得”以引号和脚注提示其为古代计量及货币术语。
