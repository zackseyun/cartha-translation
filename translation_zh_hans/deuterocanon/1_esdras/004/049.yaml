  naturalness: 整体庄重、清楚，行政称谓也便于理解。但“从王国上犹太地去的犹太人”不合现代标准汉语的表达习惯；改为“从王国前往犹太地的犹太人”自然明确。以“到他们家门前滋扰”表达禁止上门侵扰，既保留“门前”意象，也符合汉语。
  terminology: “自由”“有权势的人”“地方长官”“管事”均可接受。“总督”可作为σατράπης的功能性译法；不宜在本节无依据地增添具体行政制度解释。
