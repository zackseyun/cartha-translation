revisions:
- from: 他又写信给所有从王国上犹太地去的犹太人，论到自由一事，并规定任何有权势的人[a]、总督、地方长官[b]或管事，都不得到他们门前侵扰他们[c]。
  to: 他又写信给所有从王国前往犹太地的犹太人，论到自由一事，规定任何有权势的人[a]、总督、地方长官[b]或管事，都不得到他们家门前滋扰[c]。
  rationale: 修正不合现代汉语语序的地点和方向表达，并收紧脚注c，使其不把原文未明说的“攻击他们”当作直译。其余措辞保留原稿对行政称谓、自由及禁止上门侵扰这一含义的处理。
