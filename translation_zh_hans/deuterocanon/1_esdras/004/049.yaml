  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
translation:
  language: zh_hans
  text: 他又写信给所有从王国前往犹太地的犹太人，论到自由一事，规定任何有权势的人[a]、总督、地方长官[b]或管事，都不得到他们家门前滋扰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权势的人”也可译作“掌权者”。这里的希腊语短语句法较难，可能泛指任何拥有权力的人。
    reason: lexical_alternative
  - marker: b
    text: “地方长官”指治理某一地区或城镇的官员。
    reason: cultural_note
  - marker: c
    text: “到他们家门前滋扰”中的“到他们家门前”直译为“来到他们的门前”。这句话可能指不得上门干涉、骚扰或追索。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写信
  rationale: 该动词直指“写”；因后接收信对象，译作“写信”自然，同时不擅自把它限定为某种特定法令。
- source_word: τοῖς ἀναβαίνουσιν
  choice: 上……去的
  rationale: 保留ἀναβαίνω“上去”的方向性和犹太地语境中的传统表达，不直接释为“归回”。
- source_word: ἀπὸ τῆς βασιλείας
  choice: 从王国
  rationale: 按βασιλεία的直接含义翻译；虽语境可能指波斯疆域，但“帝国”更具解释性。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 犹太地
  rationale: 准确对应地名Ἰουδαία，采用现代中文圣经语体中清楚而庄重的称法。
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: 论到自由一事
  rationale: ὑπέρ在此引出文书所涉及的事项；不添加希腊文没有明说的“他们的”，以保留所指范围。
- source_word: πάντα δυνατὸν
  choice: 任何有权势的人
  rationale: 该短语句法较困难，字面指每一个有能力或权势者；此译保留宽泛指称，不强行限定为正式官职。
- source_word: σατράπην
  choice: 总督
  rationale: 指波斯行政体系中的高级地方长官；“总督”在现代中文中清楚简洁。
- source_word: τοπάρχην
  choice: 地方长官
  rationale: 指一地或一区的统治者；采用可直接理解的功能性译法，并以脚注说明。
- source_word: οἰκονόμον
  choice: 管事
  rationale: οἰκονόμος可指管理事务或财产的人；“管事”既自然又不把职责过度具体化。
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: 不得到他们门前侵扰他们
  rationale: 保留“门前”的原文意象，并用“侵扰”表达ἐπέρχομαι在此可能具有的敌对、逼迫或上门索取意味。
