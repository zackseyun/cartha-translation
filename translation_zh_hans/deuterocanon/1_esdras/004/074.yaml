  yaml_path: translation/deuterocanon/1_esdras/004/074.yaml
  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: zh_hans
  text: 并要每天在祭坛上献燔祭[a]，照着他们所领受的命令献上十七[b]，每年另献十他连得[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“献”的希腊文动词用法较为特殊，也可能更直译为“供应”或“供给”燔祭。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“十七”所数的对象；按上下文看，很可能是每日规定中要献上的祭物。
    reason: alternative_reading
  - marker: c
    text: “他连得”是古代一种很大的重量单位，常用于称量贵金属；这里没有说明是哪一种金属。
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 这是献祭用祭坛的标准礼仪用语；“祭坛”在现代汉语中准确而无须增添解释。
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 沿用汉语圣经传统中通行的祭祀术语，指祭物全然焚烧的祭。
- source_word: καρποῦσθαι
  choice: 献
  rationale: 此动词在这里用法特殊，字面可有供给、供应之意；正文按献祭语境译作“献”，并用脚注保留其词义上的不确定性。
- source_word: καθ’ ἡμέραν
  choice: 每天
  rationale: 自然、明确地表达逐日进行。
- source_word: καθὰ ἔχουσιν ἐντολήν
  choice: 照着他们所领受的命令
  rationale: 表达他们须遵照已经存在、持续有效的命令，同时保持现代汉语的庄重与自然。
- source_word: ἑπτὰ καὶ δέκα
  choice: 十七
  rationale: 按现代汉语数字习惯表达；原文没有明说所数的对象，因此正文不擅自补出名词。
- source_word: προσφέρειν
  choice: 献上
  rationale: 准确表达把祭物或供物带来呈献的礼仪行为。
- source_word: ἄλλα τάλαντα δέκα
  choice: 另献十他连得
  rationale: “另”保留附加之意；“他连得”采用传统音译，不擅自指定所称量的金属。
- source_word: κατ’ ἐνιαυτόν
  choice: 每年
  rationale: 简洁自然地表达年度性的要求。
theological_decisions:
- issue: “十七”所指对象
  choice: 正文只译“献上十七”，不补明对象
  alternative: 译作“献上十七份祭物”
  rationale: 希腊文没有重复或明确写出“十七”的计数对象；补作祭物虽可能合乎语境，却会消除原文真实存在的省略与含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文作为句子片段的承接语气，并对“十七”的省略不作未经明示的补足；祭祀术语使用通行的“祭坛”“燔祭”。
