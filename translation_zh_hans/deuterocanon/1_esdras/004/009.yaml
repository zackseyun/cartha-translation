  naturalness: 原文通顺庄重。修订后以“无论……判定谁”明确对应“whomever”，并使“胜利归给谁”的指代更紧凑自然。
  terminology: “文书”“权贵”“论述”“胜利”均适合正式叙事和竞赛裁断语境。脚注a中的“文字”容易被理解为一般字符或文字内容，不是此处τὸ γράμμα所指的一份书面材料；改为“书信”或“文件”更准确。脚注b将替代译法调整为更自然的现代汉语。
