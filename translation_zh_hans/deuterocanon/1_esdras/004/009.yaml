base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: zh_hans
  text: 他们说：“王起身时，人就把那份文书[a]交给他；无论王和波斯的三位权贵判定谁的论述更有智慧，胜利就归给谁[b]，正如所写的那样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文书”也可译作“书信”或“文件”（τὸ γράμμα）。
    reason: lexical_alternative
  - marker: b
    text: “论述更有智慧”也可译作“他的言辞更有智慧”或“他的主张更高明”（ὁ λόγος αὐτοῦ σοφώτερος）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: 起身
  rationale: 在此表示王起来，可能是从睡眠中醒来或从所在之处站起；“起身”自然且不过度具体化。
- source_word: τὸ γράμμα
  choice: 那份文书
  rationale: γράμμα在此指交给王审阅的书面材料；“文书”既符合正式语境，也避免误解为私人书信。
- source_word: κρίνῃ
  choice: 判定
  rationale: 该动词表示经过评断而作出决定；“判定”适合裁决竞赛的正式场景。
- source_word: μεγιστᾶνες
  choice: 权贵
  rationale: 指波斯地位显赫的高级人物；“权贵”在现代汉语中简洁地兼顾其身份与权势。
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: 谁的论述更有智慧
  rationale: λόγος在这场竞赛中指参赛者提出的一番陈述或论证；“论述”保留其话语与论理两方面，并以“更有智慧”直译比较级 σοφώτερος。
- source_word: τὸ νῖκος
  choice: 胜利
  rationale: νῖκος意为胜利；此处指智慧竞赛中被判获胜。
- source_word: καθὼς γέγραπται
  choice: 正如所写的那样
  rationale: 保留完成时被动式所表达的“已经写明并仍具效力”，在本语境中指文书所载的规则。
