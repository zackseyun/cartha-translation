  yaml_path: translation/deuterocanon/1_esdras/004/024.yaml
  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
translation:
  language: zh_hans
  text: 那第二位，就是先前谈论王的力量的那一位，开始说道：“各位男士，人岂不是占优势吗？他们掌管着大地、海洋和其中的一切。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用期待肯定回答的反问语气，即答案应是“是的”。
    reason: 说明希腊语否定疑问句的语用功能，避免中文读者误解为真正存疑。
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: 开始说道
  rationale: 贴近“开始说”的希腊语结构，同时符合现代汉语叙事表达。
- source_word: ὁ δεύτερος
  choice: 那第二个人
  rationale: 指参与较量的第二位发言者；补出“人”使中文指称清楚，不额外限定其身份。
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: 就是先前谈论王的力量的那一位
  rationale: 保留分词短语对第二位发言者的辨识作用；“先前”体现其发言发生在此刻之前，ἰσχύς译作“力量”以呼应本段关于强弱的讨论。
- source_word: Ὦ ἄνδρες
  choice: 诸位
  rationale: 以庄重而自然的现代汉语表达对在场男性的直接称呼，避免生硬的“男人们”或带额外礼仪色彩的称谓。
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: 人……难道不是更占优势吗
  rationale: οὐχ引导期待肯定回答的反问；“更占优势”保留ὑπερισχύω所含胜过、占上风之意，同时不擅自补明比较对象。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: 掌控着大地、海洋
  rationale: “掌控”表达κατακρατέω的支配、控制含义；“着”使其保持为伴随性分词概念，不强行解释为明确的因果关系。
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: 和其中的一切
  rationale: 概括大地与海洋之中的万物，简洁保留原文的全面范围。
