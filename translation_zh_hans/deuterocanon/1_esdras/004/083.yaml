  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: zh_hans
  text: 他拿了那些书信，便动身前往巴比伦，向他的众弟兄报告了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: 拿了
  rationale: 不定过去时叙事用法；“拿了”直接自然，也不额外强调是领取或接受。
- source_word: τὰς ἐπιστολάς
  choice: 那些信
  rationale: ἐπιστολή通常指书信；定冠词在此以“那些”自然指回上下文中的特定信件。
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: 出发前往巴比伦
  rationale: 兼顾ἐξέρχομαι所含的离开、出去之意和εἰς所指的目的地，比生硬的“出去到”更符合现代汉语。
- source_word: ἀπήγγειλεν
  choice: 把消息告诉了
  rationale: 该动词可表示报告、传告；希腊文未明说直接宾语，中文以“消息”表达语境中隐含的内容，同时用脚注保留原文省略。
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: 他所有的弟兄
  rationale: 保留ἀδελφοί的男性亲属或群体称谓，不擅自限定为同胞、族人或一般同伴。
