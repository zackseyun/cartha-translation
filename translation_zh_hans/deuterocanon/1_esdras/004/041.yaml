  yaml_path: translation/deuterocanon/1_esdras/004/041.yaml
  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
translation:
  language: zh_hans
  text: 他停止说话。随后，全体民众都高呼起来，说：“真理伟大，且占上风。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真理伟大，且最为强大”或“真理伟大，且得胜”。希腊文动词可表示“占上风、最为强大”或“得胜”；原文没有明说所比较或胜过的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: 不再说话
  rationale: 这一结构表示停止说话；译作“不再说话”自然、清楚，并保留动作终止的含义。
- source_word: πᾶς ὁ λαός
  choice: 所有民众
  rationale: λαός在此指在场的全体民众；“所有民众”既贴近原文，也符合现代汉语。
- source_word: ἐφώνησεν
  choice: 高声呼喊
  rationale: 该动词表示发声呼喊；主语虽为集合名词，所指是全体民众。
- source_word: τότε εἶπον
  choice: 齐声说
  rationale: 原文直译为“然后他们说”；结合全体民众共同欢呼的语境，“齐声说”自然表达复数主体，但不改变话语内容。
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: 真理是伟大的
  rationale: 保留定冠词所指向的“真理”这一被确认的现实或原则，并传达谓语形容词的庄重感叹语气。
- source_word: ὑπερισχύει
  choice: 胜过一切
  rationale: 该动词表示占优势、胜过或更为强大；“胜过一切”在汉语中有力而自然，但“一切”是为补足隐含比较关系，故以脚注说明其他可能译法。
theological_decisions:
- issue: 智慧式欢呼中ἡ ἀλήθεια的表达
  choice: 真理
  alternative: 真实；真相
  rationale: 此处将ἀλήθεια人格化般地宣告为伟大且得胜的原则。“真理”最能保留其广义、庄重和神学开放性，不把它限缩为某一事实或“真相”。
- issue: ὑπερισχύει是否明确比较对象
  choice: 正文译为“胜过一切”，脚注保留较少补足的译法
  alternative: 占优势；最为强大；得胜
  rationale: 希腊语动词本身表达超越、占上风或得胜，但本节未明说比较对象。正文采用自然有力的汉语，脚注提示原文的语义范围与未明说对象的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“便”“于是”呈现事件推进，避免古奥表达；引语保持格言式、宣告式力度。
