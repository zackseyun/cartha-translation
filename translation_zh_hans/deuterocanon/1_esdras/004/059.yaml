  text: saying[a], “From you are victory, and from you is wisdom, and yours is the glory, and I am your servant.”
translation:
  language: zh_hans
  text: 说：“胜利从你而来，智慧也从你而来；荣耀属于你，我是你的仆人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“家仆”；这个希腊词还可能有较强的“奴仆”之意。
    reason: 保留οἰκέτης在家内服役与奴属身份方面的词义幅度。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出直接引语；汉语用“说”自然承接上下文，又不增添原文没有的主语。
- source_word: Παρὰ σοῦ
  choice: 从你而来
  rationale: παρά接属格在此表示来源；重复译出，以保留原文对胜利与智慧的平行强调。
- source_word: νίκη
  choice: 胜利
  rationale: 直接表达获胜、胜利之意，符合此处颂赞语境。
- source_word: σοφία
  choice: 智慧
  rationale: σοφία在此取通常意义“智慧”，上下文没有必要将其收窄为技巧或才干。
- source_word: σὴ ἡ δόξα
  choice: 荣耀属于你
  rationale: 以自然现代汉语保留所有格形容词的强调，表明荣耀归于受话者。
- source_word: οἰκέτης
  choice: 仆人
  rationale: 该词可指家仆，也可能带奴仆意味；正文用庄重而通顺的“仆人”，较强的身份含义在脚注中保留。
theological_decisions:
- issue: 顺服宣认中οἰκέτης的译法
  choice: 仆人
  alternative: 家仆；奴仆
  rationale: 此处表达说话者自谦并归属于受话者。“仆人”符合颂赞和臣服的语气，同时不把原词可能具有的家内身份或奴属意味强行确定下来；这些可能性由脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“从你而来”呈现来源关系，并保留两次重复；分号划分颂赞的两个层次。脚注标记已置于正文相应词后。
