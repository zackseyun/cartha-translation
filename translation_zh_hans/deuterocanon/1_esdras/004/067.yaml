  yaml_path: translation/deuterocanon/1_esdras/004/067.yaml
  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: zh_hans
  text: 你曾起誓要重建那座圣殿，就是犹太地被迦勒底人毁为荒凉时犹太人所焚烧的。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“犹太人所焚烧的”。根据平行的历史传统，有些读者可能以为这里应是“迦勒底人（巴比伦人）所焚烧的”，但现存希腊文本明确写的是“犹太人”。
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: 曾起誓
  rationale: 此处 εὔχομαι 表示立誓或郑重许愿；“曾起誓”既体现郑重承诺，也符合对君王先前誓言的追述。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 该词本义为“建造”，但宾语是已遭焚烧的圣殿，因此按语境译作“重建”自然准确。
- source_word: τὸν ναὸν
  choice: 圣殿
  rationale: ναός 在这里指耶路撒冷的圣殿建筑；“圣殿”是现代中文圣经历史语境中的清楚、庄重表达。
- source_word: ἐνεπύρισαν
  choice: 焚烧
  rationale: 该动词表示放火烧或焚烧；“焚烧”保留动作力度，又不额外断定建筑被彻底烧毁。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 希腊文明确以 οἱ Ἰουδαῖοι 为焚烧行为的主语。在中文中，“犹太人”是该民族—地域群体最自然通行的名称；历史张力另以脚注说明。
- source_word: ἐρημώθη
  choice: 被摧毁了
  rationale: 该被动词表示变为荒凉、遭到毁坏；“被摧毁了”在现代中文中自然传达土地遭严重破坏的意思。
- source_word: Χαλδαίων
  choice: 迦勒底人
  rationale: 原文具体使用“迦勒底人”，故保留这一历史族称，不解释性地改成“巴比伦人”。
theological_decisions:
- issue: “犹太人所焚烧的圣殿”的历史归属
  choice: 按现存希腊文本保留“犹太人”为焚烧者
  alternative: 译成不说明行为主体的“被焚烧的圣殿”，或依平行历史传统改为“迦勒底人／巴比伦人所焚烧的圣殿”
  rationale: 希腊文 οἱ Ἰουδαῖοι 明确是 ἐνεπύρισαν 的主语。即使这与读者熟悉的历史叙述形成张力，译文也不应暗中校正原文，而应在正文保留并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“曾起誓”体现郑重承诺；“圣殿”“迦勒底人”沿用清楚通行的历史表达。分号帮助读者辨明关系从句与时间从句。
