revisions:
- from: 你也曾起誓，要重建犹太人所焚烧的圣殿；当时，犹太地被迦勒底人摧毁了。[a]
  to: 你曾起誓要重建那座圣殿，就是犹太地被迦勒底人毁为荒凉时犹太人所焚烧的。 [a]
  rationale: 修订仅澄清原文关系从句中时间从句的修饰范围，并将对ἐρημώθη的译法调整为“毁为荒凉”。正文及脚注继续严格保留现存希腊文本将焚烧归于“犹太人”的表述，不依其他历史传统作协调性改写。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了希腊文中“犹太人”作为焚烧者以及“迦勒底人”使犹太地荒凉这一令人意外的历史归属，脚注也恰当说明了与平行传统的张力。但原译以分号分开“当时”从句，容易使其松散地修饰全句，而非清楚地修饰“焚烧”；且“摧毁犹太地”较原文“使其荒凉／荒废”更强。
  naturalness: “曾起誓”“重建”“圣殿”“迦勒底人”均自然且合乎庄重的经文语体。将时间从句纳入关系从句，并用“毁为荒凉”表达，可使现代汉语句法关系更明确。
  terminology: “圣殿”“犹太人”“犹太地”“迦勒底人”均可保留。“毁为荒凉”较准确对应ἐρημώθη，避免将土地本身直接译作被彻底摧毁。
  issues:
  - severity: medium
    issue: 时间从句的句法归属不够明确
    rationale: 希腊文ὅτε ἐρημώθη…紧接“犹太人所焚烧的”，说明焚烧发生于犹太地被迦勒底人毁为荒凉之时。原文以分号及“当时”另起分句，可能使读者将其理解为泛指立誓或重建的时间背景。
  - severity: low
    issue: “被迦勒底人摧毁了”略强于原文
    rationale: ἐρημώθη意为“变得荒凉、被毁为荒凉、遭荒废”。“摧毁”可以涉及破坏，但“毁为荒凉”更完整保留土地遭致荒凉的语义。
  revised_text: 你曾起誓要重建那座圣殿，就是犹太地被迦勒底人毁为荒凉时犹太人所焚烧的。 [a]
