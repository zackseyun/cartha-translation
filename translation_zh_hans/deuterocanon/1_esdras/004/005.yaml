base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever’s statement appears wiser than the other’s, Darius the king will give him great gifts and great honors of victory[b],
translation:
  language: zh_hans
  text: 我们每个人都来说一句会胜出的主张[a]；谁的话显得比别人的更有智慧，大流士王就要赐给他丰厚的礼物和重大的胜利褒奖[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句主张”也可译作“一句话”或“一个论点”；希腊语 λόγον 用词简练，在这里可指竞赛中提出的主张或论证。
    reason: lexical_alternative
  - marker: b
    text: “胜利褒奖”所译的希腊语 ἐπινίκια，可指因获胜而授予的荣誉或奖赏。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν
  choice: 都来说
  rationale: 第一人称复数劝勉虚拟式；“都来说”自然表达共同提议的语气。
- source_word: ἕκαστος ἡμῶν
  choice: 我们每个人
  rationale: 直接表达分配意义，并符合现代汉语语序。
- source_word: ἕνα λόγον
  choice: 一句……论说
  rationale: λόγος在这里可指话语、命题或论点；“一句论说”既保留“一”的形式，又提示这是竞赛中的主张，而非孤立的单词。
- source_word: ὃς ὑπερισχύσει
  choice: 能够胜出的
  rationale: ὑπερισχύω表示占优势、胜过；结合竞赛语境译作“胜出”，简洁自然。
- source_word: φανῇ
  choice: 显得
  rationale: 保留评价结果“看来、显为”的意味，不将其强化为客观证明。
- source_word: τὸ ῥῆμα αὐτοῦ
  choice: 他的言论
  rationale: ῥῆμα在此指参赛者所说的内容；“言论”清楚且适合正式叙事。
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: 比其他人的更有智慧
  rationale: 保留比较结构；τοῦ ἑτέρου在多人语境中可作“其余人、别人”理解，中文补足所属关系而不重复“言论”。
- source_word: δώσει αὐτῷ
  choice: 就要赐给他
  rationale: δίδωμι为简单将来时；对君王施予奖赏，用“赐给”符合庄重叙事语域。
- source_word: δωρεὰς μεγάλας
  choice: 丰厚的礼物
  rationale: δωρεά指礼物或馈赠；μέγας在奖赏语境中用“丰厚”比直译“大的”自然。
- source_word: ἐπινίκια μεγάλα
  choice: 盛大的胜利奖赏
  rationale: ἐπινίκια指因获胜而得的荣誉或奖赏；此译保留“胜利”含义，同时不限定其必为物质奖品。
