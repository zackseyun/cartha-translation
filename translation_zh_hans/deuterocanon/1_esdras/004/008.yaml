  yaml_path: translation/deuterocanon/1_esdras/004/008.yaml
  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: zh_hans
  text: 于是，他们各自写下自己的陈述，封好以后，放在大流士王的枕头[a]下面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“头枕”。希腊词 προσκεφάλαιον 可指枕头或供头部倚靠的物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中的紧接次序；“于是”自然地承接前文并推进事件。
- source_word: γράψαντες ἕκαστος
  choice: 他们各自写下……以后
  rationale: ἕκαστος具有逐一分配义；不定过去时分词表示相对于主要动词先发生的动作，故译出“以后”。
- source_word: τὸν ἑαυτοῦ λόγον
  choice: 自己的陈述
  rationale: λόγος在此指竞赛参与者写下的主张或说法；“陈述”既符合书面语境，又避免过度限定为正式论证。
- source_word: ἐσφραγίσαντο
  choice: 封好
  rationale: 结合书面陈述的语境，指将各自所写的内容封缄；中文以“封好”自然表达完成动作，宾语可由上文明确得知。
- source_word: ἔθηκαν
  choice: 放在
  rationale: 朴素准确地表达“放置”，符合现代汉语叙事。
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: 在……枕头下面
  rationale: προσκεφάλαιον指供头部倚靠之物，通常可译为“枕头”，同时以脚注保留“头枕”的词义可能。
- source_word: Δαρείου τοῦ βασιλέως
  choice: 大流士王的
  rationale: 属格修饰枕头；按现代汉语习惯译作“大流士王的”，清楚而庄重。
