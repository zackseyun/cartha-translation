  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: zh_hans
  text: 又披上紫衣，用金器饮用[a]，睡在金子上[b]，一辆配有金制辔具的战车[c]、一顶细麻布头巾，以及一条戴在颈项上的项链，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文指用金制物件饮用，并未说明具体是杯还是其他器皿。
    reason: lexical_alternative
  - marker: b
    text: 直译“睡在金子上”；可能指睡在以黄金装饰的床或榻上，但希腊文没有明说“床”或“榻”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“配金辔的战车”或“配有黄金马具的战车”；希腊词可能具体指辔、衔铁，也可能较宽泛地指马具。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: 披上紫袍
  rationale: πορφύρα可指紫色布料或紫色衣服，περιβάλλομαι在此指穿戴在身；“披上紫袍”既体现动作，也传达奢华、尊贵的服饰意象，而不额外加入“王室”等原文未明说的限定。
- source_word: ἐν χρυσώμασιν πίνειν
  choice: 用金器喝酒
  rationale: χρύσωμα在此指用于饮用的金制物件，但未明确是杯、碗还是其他器皿；“金器”保留这种不确定性。“喝酒”按上下文自然表达宴饮，但希腊语πίνειν本身仅为“喝”，故以脚注说明器皿层面的含混，不将具体器型写入正文。
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: 睡在金子上
  rationale: 希腊文直说“睡在金子上”，没有出现床或榻的名词。正文保留这一凝练而夸张的说法，不擅自补成“金床”。
- source_word: ἅρμα χρυσοχάλινον
  choice: 配金制辔具的战车
  rationale: χρυσοχάλινος由“金”和“辔、衔铁”相关成分构成，可指带金辔、金衔或更广义的金制马具；“辔具”比单说“缰绳”或“衔铁”更能保留范围上的不确定性。
- source_word: κίδαριν βυσσίνην
  choice: 细麻布制的头巾
  rationale: κίδαρις指包头巾或头饰，βύσσινος指优质细麻布制成；“细麻布制的头巾”用现代读者易懂的方式保留材质与物件类别。
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: 戴在颈项上的项链
  rationale: μανιάκη指环绕颈部的饰物，可理解为项链、颈圈或环状项饰；“项链”最自然易懂，且“戴在颈项上”保留原文明确写出的部位。
