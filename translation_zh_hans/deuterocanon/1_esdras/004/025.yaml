  yaml_path: translation/deuterocanon/1_esdras/004/025.yaml
  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
translation:
  language: zh_hans
  text: 但王胜过他们，统治他们，作他们的主人；无论王向他们说什么，他们都听从[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们都听他的话”或“他们都服从”。希腊语所用的词本义与“听”有关，但在这里指听从王的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: 但王
  rationale: δέ在本段论证中带轻微转折或承接意味，译作“但”；βασιλεύς直译为“王”自然庄重。
- source_word: ὑπερισχύει
  choice: 胜过他们
  rationale: 该动词表示力量更强、占上风；“胜过”保留其比较和压倒性的含义。
- source_word: κυριεύει αὐτῶν
  choice: 统治他们
  rationale: κυριεύω指行使主权或管辖；“统治”清楚自然，也与下文更强的δεσπόζει有所区分。
- source_word: δεσπόζει αὐτῶν
  choice: 作他们的主
  rationale: δεσπόζω强调主人般的支配权；此译保留其比“统治”更强的主宰意味，而不把两个动词合并。
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: 无论王向他们说什么
  rationale: 该结构表达不确定的全称范围，即“无论……什么”；补出“王”使现代汉语指代清晰。
- source_word: ἐνακούουσιν
  choice: 他们都听从
  rationale: 该词本义与听见、听取相关，在王命语境中含有顺从、服从之意；“听从”兼顾听取和遵命两层语感。
