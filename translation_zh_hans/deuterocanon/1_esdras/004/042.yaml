base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: zh_hans
  text: 于是，王对他说：“在已经写下的之外，你还想要什么，尽管求吧[a]，我们必赐给你。既然你被认定为更有智慧，你必坐在我身旁[b]，并要被称为我的亲属[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“你想要什么比已经写下的更多的，就求吧。”这里“已经写下的”很可能指先前以文字记下或颁定的赏赐。
    reason: 说明原文的比较结构，并将“赏赐”的上下文理解保留在脚注中。
  - marker: b
    text: “坐在我身旁”表示在宫廷中与王亲近并享有尊荣。
    reason: 说明宫廷语境中的含义。
  - marker: c
    text: “亲属”也可译作“亲族”；这里可能是君王赐予的尊荣称号，并不一定表示实际血缘关系。
    reason: 保留亲属词义及身份称号的可能性。
lexical_decisions:
- source_word: Αἴτησαι
  choice: 只管求吧
  rationale: 该词是带命令意味的邀请；“只管求吧”自然表达君王准许并鼓励对方提出请求的语气。
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: 除了已经写明的奖赏以外，你还想要什么
  rationale: 保留πλείω的“更多、另外”以及τῶν γεγραμμένων的“已经写下之事”；结合上下文补出“奖赏”，并以脚注说明原文较简略。
- source_word: δώσομέν σοι
  choice: 我们必赐给你
  rationale: 未来时表示明确承诺；王者语境中“赐给”比一般的“给”更合乎庄重语域。
- source_word: ὃν τρόπον
  choice: 因为
  rationale: 此处引出君王作出承诺的理由，译为“因为”清楚自然。
- source_word: εὑρέθης σοφώτερος
  choice: 你显得更有智慧
  rationale: 表达经评判而被认定更有智慧，并保留比较级；不擅自补明比较对象。
- source_word: ἐχόμενός μου καθήσῃ
  choice: 你必坐在我身旁
  rationale: ἐχόμενος接属格可表示紧邻；在宫廷语境中指在君王身旁就座，象征亲近与尊荣。
- source_word: συγγενής μου κληθήσῃ
  choice: 并要被称为我的亲族
  rationale: 保留κληθήσῃ的被动形式和συγγενής的亲属性措辞，同时避免断言真实血缘关系。
theological_decisions:
- issue: συγγενής所表达的宫廷身份与亲属称谓
  choice: 我的亲族
  alternative: 我的亲属；我的亲信
  rationale: “亲族”保留原文的家族性和尊荣意味；“亲信”会将其解释为政治职位，而原文没有明确这样说。
- issue: εὑρέθης σοφώτερος的比较对象
  choice: 你显得更有智慧
  alternative: 你被证明比众人更有智慧
  rationale: 原文使用比较级，却未在本节明说比较对象；正文不补入“众人”，以保留原有省略和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。君王的话保留正式承诺和宫廷尊荣色彩；对原文省略的比较对象不作补充，对“已经写下的”仅作最低限度的上下文显化，并以脚注交代。
