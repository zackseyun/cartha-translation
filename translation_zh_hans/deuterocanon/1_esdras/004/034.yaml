base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: zh_hans
  text: 各位男子，女人岂不强大吗？大地广大，天高，太阳[b]运行迅疾[a]；因为它在天的圆周中转动，并在一天之内又奔回自己的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “运行迅疾”也可译作“在赛程上飞快”；希腊文把太阳描绘成沿着路程疾行。
    reason: lexical_alternative
  - marker: b
    text: 本节采用日常观察性的语言，描述太阳每天在天空中的运动。
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: 诸位
  rationale: 这是阳性复数呼语，直接称呼在场的男子；汉语用“诸位”可自然保留公开演说的呼告语气，而不生硬译作“男人们”。
- source_word: ἰσχυραὶ
  choice: 很有力量
  rationale: 表达强健、有力或强大；在“女人不是……吗”的反问中，“很有力量”自然且保留比较何者最强的论证语境。
- source_word: γυναῖκες
  choice: 女人
  rationale: 通常指女人；本句没有充分依据把范围缩窄为“妻子”。
- source_word: μεγάλη ἡ γῆ
  choice: 大地广阔
  rationale: γῆ与苍天、太阳并列，指整体的大地；μεγάλη在此兼有广大之意，译作“广阔”比单说“大”更符合现代汉语。
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: 苍天高远
  rationale: 保留“天是高的”这一宇宙性描述，并以庄重自然的现代汉语表达；“苍天”在此不强加神学含义。
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: 太阳运行迅速
  rationale: δρόμος可指奔跑、赛程或行程；“运行迅速”保留太阳沿路径快速移动的图景，同时符合现代汉语。
- source_word: στρέφεται
  choice: 转动
  rationale: 采用宽泛而直观的动作词，不把原文具体化为现代天文学意义上的“公转”。
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: 在天穹的环道上
  rationale: κύκλος可指圆圈或环行的路线；结合运动语境译作“环道”，既保留环行意象，也避免汉语“在圆圈里转”所产生的含混。
- source_word: ἀποτρέχει
  choice: 奔回
  rationale: 该复合动词兼有跑动与返回之意；“奔回”保留原文鲜明的动态表达。
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: 回自己的所在
  rationale: τόπος是宽泛的“地方、位置”；“自己的所在”保留其非技术性，不擅自解释为天文学上的固定站位。
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: 一天之内
  rationale: 准确表达动作在一日内完成的时间范围。
theological_decisions:
- issue: 太阳每日运动的宇宙论表述
  choice: 保留“转动”“奔回”等观察性语言
  alternative: 改写为太阳在天空中的“视运动”或按现代科学加以重述
  rationale: 希腊文按日常观察描述太阳的运行。译文不把这种表达改造成现代科学术语，也不据此断定作者意在提出一套技术性的天文学理论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。开头以“诸位”呈现公开辩论中的呼告；整体保留原文连续铺陈和拟人化运动意象。所有脚注标记均置于相关正文之后。
