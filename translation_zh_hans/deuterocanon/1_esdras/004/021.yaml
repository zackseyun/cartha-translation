  text: and they do not remember[a], while they are drinking, to show affection to friends and brothers, and before long they draw swords.
translation:
  language: zh_hans
  text: 他们喝酒时，忘了要与朋友和弟兄亲爱相待；不久，他们就拔出刀来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: 他们……不记得
  rationale: 希腊文动词形式为单数，但后面的 πίνωσιν 和 σπῶνται 均为复数；结合上下文，宜按泛指受酒影响之人处理。现代汉语用复数“他们”自然，也保留“不记得”的基本词义。
- source_word: ὅταν πίνωσιν
  choice: 喝酒时
  rationale: ὅταν 加虚拟式表达不特定或反复出现的情形；“喝酒时”简洁自然，并可涵盖“每逢喝酒”的意味。
- source_word: φιλιάζειν
  choice: 表示亲爱
  rationale: 该动词可指以朋友般亲爱、友善的方式相待，并不必然专指亲吻。“表示亲爱”保留其情感与关系层面的宽度。
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: 向朋友和弟兄
  rationale: 分别直译为“朋友”和“弟兄”；后者保留希腊文阳性复数的表达，不扩展为原文未明确说出的“弟兄姐妹”。
- source_word: μετʼ οὐ πολὺ
  choice: 过不了多久
  rationale: 这是表示短暂间隔的惯用语；“过不了多久”符合现代汉语，并凸显亲爱表现与随后暴力之间的迅速转折。
- source_word: σπῶνται μαχαίρας
  choice: 拔刀相向
  rationale: σπάω 与 μάχαιρα 连用表示把刀剑拔出。“拔刀相向”是自然、凝练的汉语，既传达拔刀动作，也依语境显明其敌对转变；μάχαιρα 可泛指刀或短剑，译作“刀”避免过度限定器物形制。
