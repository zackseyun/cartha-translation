base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
translation:
  language: zh_hans
  text: 他写信给所有从王国前往犹太的犹太人，论到他们的自由[a]，规定任何有权势的人、萨特拉普、地方长官或管事，都不得来到他们的门前[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由”也可译作“豁免”或“自主权”。希腊词通常指自由；但在这里的行政语境中，可能指依法授予的特权或免除。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不得来到／进逼他们的门前。”这可能指官员不得登门侵扰他们，或在其住所向他们提出要求；原文没有说明具体行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写下……命令
  rationale: γράَφω本义是“写”；上下文表明所写内容具有行政命令的效力。译文保留“写”的动作，并以“命令”自然承接后面的间接命令。
- source_word: τοῖς ἀναβαίνουσιν
  choice: 上……去的
  rationale: ἀναβαίνω意为“上去”。这里指从王国辖境前往犹太，保留原文的上行表达，不直接释作“返回”。
- source_word: τῆς βασιλείας
  choice: 王国
  rationale: βασιλεία在此指君王统治的疆域；“王国”直接对应原词，也不把具体帝国名称补入正文。
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: 有关他们自由的
  rationale: ὑπέρ加属格在此可表示“有关”；ἐλευθερία通常意为“自由”，但行政语境中也可能指豁免或特权，故正文保留基本词义，脚注说明。
- source_word: πάντα δυνατὸν
  choice: 任何权贵
  rationale: 该短语字面为“每一个有权势者”，在官职名单中泛指掌权者。“权贵”既保留权势含义，也符合行政语境。
- source_word: σατράπην
  choice: 总督
  rationale: σατράπης是波斯帝国的行省长官。现代汉语以“总督”表达其行政层级，清楚而自然。
- source_word: τοπάρχην
  choice: 地方长官
  rationale: τοπάρχης指一地或一区的统治者；“地方长官”准确而易懂。
- source_word: οἰκονόμον
  choice: 管事
  rationale: οἰκονόμος本指管理家业、财产或事务的人；在行政名单中，“管事”保留其管理职能，又不把职责范围说得过死。
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: 都不可到他们门前刁难他们
  rationale: 字面是“不可来到/进逼他们的门”。单译“到门前”不能显出ἐπέρχομαι在此可能含有侵扰或追索之意；加入“刁难”传达禁令的实际方向，同时以脚注保留字面图像和具体行政含义的不确定性。
theological_decisions:
- issue: 王令中ἐλευθερία所指的自由性质
  choice: 有关他们自由的
  alternative: 有关他们所获豁免的；为了他们的自由
  rationale: 本节所述是王权给予归返犹太人的行政保护，并非关于属灵自由的教义陈述。译文保留“自由”的基本意义，同时不武断限定为税务或其他某一种豁免。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和行政用语。“上犹太去”保留古代前往犹太的上行说法；官职按层级译成普通读者可理解的称谓。句末保留逗号，以配合该节在原段落中尚未完结的句法。
