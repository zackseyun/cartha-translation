  text: And they blessed the God of their fathers, because he had given them relief and release.
translation:
  language: zh_hans
  text: 他们称颂他们列祖的上帝，因为他赐给他们安舒和释放。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησαν
  choice: 称颂
  rationale: 在以上帝为宾语时，表达赞美、颂赞之意；比直译“祝福”更符合现代汉语习惯。
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: 他们列祖的上帝
  rationale: 保留属格关系及以色列传统语境；“列祖”庄重自然，也对应复数 πατέρων。
- source_word: ἄνεσιν
  choice: 安歇
  rationale: 该词可指松缓、舒解或歇息；此处用“安歇”保留从困苦中得舒缓的含义。
- source_word: ἄφεσιν
  choice: 释放
  rationale: 该词可指释放、豁免或赦免；上下文证据不足以限定为罪得赦免，因此采用范围较宽的“释放”。
theological_decisions:
- issue: ἄφεσις 是否应译为宗教意义上的“赦免”
  choice: 释放
  alternative: 赦免
  rationale: 希腊词本身语义较宽，本句与 ἄνεσις 并列，更自然地表示获得纾解与自由；不把含义未经上下文支持地限定为罪的赦免。
translation_notes:
  register: 采用现代、庄重而通顺的经文语体。“称颂”避免现代读者误解为人给上帝赐福；“安歇和释放”保留两个并列名词及其语义张力。
