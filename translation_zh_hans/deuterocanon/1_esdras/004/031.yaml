base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/031.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: zh_hans
  text: 此外，王张着嘴注视着她[a]；她若对他感到恼怒，他就奉承她，好让她同他和好。她若对他笑，他也笑[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“王张着嘴看着她。”
    reason: 保留原文生动而略带夸张的形象。
  - marker: b
    text: “对他笑”也可理解为“同他一起笑”，或“向他发笑”；希腊语的与格在这里容许不止一种理解。
    reason: 说明 ἐὰν γελάσῃ αὐτῷ 中与格关系的真实歧义，避免把它限定为嘲笑。
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: 此外
  rationale: 保留承接上文并增添一项论据的语气，现代汉语简洁自然。
- source_word: χάσκων τὸ στόμα
  choice: 张着嘴
  rationale: 直接保留原文生动的张口凝视形象，不把它弱化为单纯的惊讶。
- source_word: ἐθεώρει
  choice: 注视着
  rationale: 表达持续观看；与“张着嘴”连用，足以呈现王被吸引而凝望的情态，又不额外加入“目不转睛”等原文未明说的程度。
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: 她若对他笑，他也笑
  rationale: 重复使用“笑”对应重复的 γελάω；“对他笑”保留动作指向，同时不武断判定是嘲笑还是与他一同发笑。
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: 她若恼怒他
  rationale: 在关系语境中自然表达因他而不悦、向他发怒的意思，同时保留其针对性。
- source_word: κολακεύει αὐτὴν
  choice: 他就奉承她
  rationale: “奉承”准确传达 κολακεύω 的讨好、谄媚意味，并呈现王反过来取悦她的反差。
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: 好让她同他和好
  rationale: 以现代汉语表达恢复关系的目的；“同他和好”比宗教语域较强的“与他和解”更贴近日常人际场景。
