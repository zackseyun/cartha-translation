lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出一般性的时间从句；汉语用“……时”自然简洁，也不排除反复发生的含义。
- source_word: ἀπὸ τοῦ οἴνου
  choice: 从酒中
  rationale: 保留希腊文“从酒”的具体表达，避免直接解释成“从醉酒中”，其语境含义由脚注说明。
- source_word: ἐγερθῶσιν
  choice: 醒来
  rationale: 此处所描写的是人在酒力作用之后恢复清醒；“醒来”比直译为“起来”更符合汉语语境，同时仍在该动词的语义范围内。
- source_word: οὐ μέμνηται
  choice: 不记得
  rationale: 希腊文本的动词形式为单数，但前文主语为复数，语义上宜按集合或分配关系译作复数主语的“不记得”。
- source_word: ἃ ἔπραξαν
  choice: 自己做过什么
  rationale: 自然表达关系从句，并用“自己”明确其所忘记的是他们本人先前的行为；“做过”体现行为先于醒来。
