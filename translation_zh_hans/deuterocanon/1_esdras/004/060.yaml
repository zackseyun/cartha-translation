  yaml_path: translation/deuterocanon/1_esdras/004/060.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
translation:
  language: zh_hans
  text: 你是当受称颂的，你赐给了我智慧；我也向你称谢[a]，列祖的主宰[b]啊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承认你”“宣认你”或“颂赞你”。希腊语这个动词可指公开承认或宣认；在这里的祷告语境中，很可能含有感谢之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“列祖的主人”。希腊语用的是 δέσποτα，强调拥有权柄的主宰，与通常译作“主”的 κύριος 不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受称颂的
  rationale: 这是对上帝直接使用的颂赞用语；“当受称颂的”既保留其形容词形式和颂赞语气，也比单说“有福的”更符合现代汉语中对上帝的称颂。
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: 是你赐给了我智慧
  rationale: 保留关系从句对受称颂者的说明，并以“是你”自然承接直接称呼；“赐给了”表达已完成、而其意义延续至当前祷告的行动。
- source_word: σοφίαν
  choice: 智慧
  rationale: “智慧”是 σοφία 的常规对应词，语境没有要求收窄为“聪明”或“悟性”。
- source_word: ὁμολογῶ
  choice: 称谢
  rationale: ὁμολογέω 基本上可表示公开承认、宣认；在此祷告语境中，接与格 σοὶ，带有向上帝感谢、颂赞的意味。“称谢”既自然庄重，也较“感谢”更能保留公开承认与颂赞的色彩。
- source_word: δέσποτα
  choice: 主宰
  rationale: δέσποτα 强调拥有权柄者，与 κύριος 有词汇区别。“主宰”在现代汉语中能表达至高权柄，同时避免直接混同于通常译作“主”的 κύριος。
- source_word: τῶν πατέρων
  choice: 列祖的
  rationale: 原文为阳性复数且没有“我们的”；“列祖”自然地指向先祖或族长们，同时不擅自补入领属代词。
theological_decisions:
- issue: 对上帝称呼 δέσποτα 的译法
  choice: 主宰
  alternative: 主人；主
  rationale: 采用“主宰”以保留该词所强调的权柄，并与 κύριος 通常对应的“主”保持区别；“主人”虽较字面，却容易使现代读者想到日常主仆关系。
- issue: πατέρων 的性别与所指
  choice: 列祖
  alternative: 祖先
  rationale: “列祖”保留原文阳性复数以及族长、先祖的传统语感；“祖先”较中性，会弱化原文明确的男性表述。
- issue: ὁμολογῶ 在祷告中的语义张力
  choice: 称谢，并加注说明
  alternative: 承认；宣认；颂赞
  rationale: 正文采用符合祷告语境的“称谢”，但借脚注保留该动词“公开承认、宣认”的基本语义范围，避免把多义性完全压平。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“当受称颂的”“称谢”“列祖”具有适度经文风格，但仍为普通现代读者所理解。分号保留原文两部分颂祷结构；末尾“啊”明确其为直接呼告。
