  yaml_path: translation/deuterocanon/1_esdras/004/058.yaml
  text: And when the young man went out[a], lifting up his face toward heaven, in the direction of Jerusalem, he blessed the King of heaven[b],
translation:
  language: zh_hans
  text: 那年轻人出去后，便朝着耶路撒冷的方向，仰脸望天，称颂天上的王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祝颂天上的王。”
    reason: εὐλόγησεν 在以上帝为对象时，既可表达祝颂，也可表达赞美。
lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: 出去后
  rationale: 以自然的现代汉语表达时间从句及叙事先后；原文是“当……出去时”，这里不改变事件次序。
- source_word: ὁ νεανίσκος
  choice: 那年轻人
  rationale: 准确表达 νεανίσκος，既自然，也不额外赋予“仆人”等身份。
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  choice: 仰脸望天
  rationale: 保留举脸向天的身体动作，同时采用简洁、自然且庄重的汉语表达。
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: 朝着耶路撒冷的方向
  rationale: 此处表示空间朝向；该译法保留方向含义，又不将其强化为特定礼仪术语。
- source_word: εὐλόγησεν
  choice: 称颂
  rationale: 当对象为上帝时，εὐλογέω兼有祝颂、赞美之意；“称颂”符合现代汉语宗教语境，也保留圣经式表达。
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 天上的王
  rationale: 紧扣希腊语属格结构，作为对上帝的尊称，表达庄重而清楚。
theological_decisions:
- issue: 对上帝使用 εὐλογέω 的译法
  choice: 称颂天上的王
  alternative: 祝颂天上的王；赞美天上的王
  rationale: “称颂”能兼顾“祝福/祝颂”与“赞美”的语义范围，不把原文的敬拜用语单一化；脚注保留较贴近词形的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“朝着耶路撒冷的方向，仰脸望天”使两个空间指向在汉语中关系清楚，并避免英语咨询文本中脚注位置与内容不相符的问题。
