translation_notes:
  register: 采用现代、清楚而庄重的简体中文。“宴乐”比“宴饮作乐”更凝练，并能涵盖欢宴享乐之意；后半句重复“不记得”，使并列关系清晰，也避免把希腊文的泛指主语误解为酒本身。
