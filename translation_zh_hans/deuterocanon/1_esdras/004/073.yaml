  yaml_path: translation/deuterocanon/1_esdras/004/073.yaml
  text: and for the building of the temple[a], that twenty talents be given each year until it is built[b];
translation:
  language: zh_hans
  text: 并且，为建造圣殿[a]，每年要拨给二十他连得，直到建成[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为建造圣所”。希腊语ἱερόν通常指圣殿，也可涵盖整个圣殿区域。
    reason: lexical_alternative
  - marker: b
    text: “他连得”是古代很大的重量单位，在这里也用作钱财的计量单位。
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομή
  choice: 建造
  rationale: 此处指用于圣殿建造工程的款项；“建造”自然地表达工程过程，又不过度具体化。
- source_word: ἱερόν
  choice: 圣殿
  rationale: ἱερόν可指圣所或整个殿宇范围；在重建语境中，“圣殿”是现代汉语最清楚、最通行的译法。
- source_word: δοθῆναι
  choice: 要拨给
  rationale: 被动不定式处于政令和经费语境中，表示款项应被给予或划拨；“要拨给”既保留规定语气，也明确财政用途。
- source_word: κατ’ ἐνιαυτόν
  choice: 每年
  rationale: 准确表达逐年、按年度反复给予的分配意义。
- source_word: τάλαντα εἴκοσι
  choice: 二十他连得
  rationale: 保留古代重量兼货币计量单位的传统名称，避免用不确定的现代币值替换。
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: 直到建成
  rationale: 表达拨款持续至建造完成；汉语中可自然承接前文的“圣殿”，同时保留原文未重复主语的简洁结构。
