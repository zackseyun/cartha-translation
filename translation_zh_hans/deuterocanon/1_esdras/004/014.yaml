  yaml_path: translation/deuterocanon/1_esdras/004/014.yaml
  text: And he sent out and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[c][b],
translation:
  language: zh_hans
  text: 他派人去召集波斯和米底的所有权贵、行省总督、将领、地方统治者[b]和高级官员[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“派出后，他就召集了……”。该分词可能指先派遣使者传达召集令。
    reason: lexical_alternative
  - marker: b
    text: 指管辖某一地方或地区的统治者。
    reason: cultural_note
  - marker: c
    text: 原词也可译作“最高官员”，在某些语境中则特指“执政官”；这里按波斯的行政背景译为“高级官员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: 派人
  rationale: 该不定过去时分词本义为“派出之后”；结合后面的“召集”，中文用“派人传召”自然表达先派出使者、继而召集的动作，同时不把原文未明说的“使者”写得过重。
- source_word: ἐκάλεσεν
  choice: 传召
  rationale: 在君王召集臣属的语境中，“传召”比一般的“叫来”庄重，也比“邀请”更符合权威性的召集。
- source_word: μεγιστᾶνας
  choice: 权贵
  rationale: 指地位显赫的高级人物或显贵；“权贵”简明、现代，并保留其社会政治地位，不误限定为王族。
- source_word: Περσίδος
  choice: 波斯
  rationale: 该地名在现代汉语中的标准译法。
- source_word: Μηδείας
  choice: 米底
  rationale: 该地区名称在中文圣经及古代史语境中的通行译法。
- source_word: σατράπας
  choice: 行省总督
  rationale: 这是波斯行政体系中特定的省级长官称号；译为“行省总督”既交代职级，又比音译更便于普通读者理解。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 在这一官员名单中指军事统帅；“将领”自然且不把具体军阶说得过细。
- source_word: τοπάρχας
  choice: 地方统治者
  rationale: 指管辖某一地方或地区的人；此译保留统治职能，也避免采用普通读者陌生的音译官名。
- source_word: ὑπάτους
  choice: 高级官员
  rationale: 该词可指最高层级的官员，也可在罗马语境中专指“执政官”；此处是波斯官员名单，采用较宽泛的“高级官员”可避免误植罗马官制。
