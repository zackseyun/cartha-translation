  text: And to all who guarded the city[a], he wrote that allotments and wages should be given to them.
translation:
  language: zh_hans
  text: 他写道，要给所有守卫那城的人分配份额[a]和薪饷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “份额”或译“签”；原词可指抽签所得或分配给人的一份。
    reason: 保留κλήρους可指“签”及“所分份额”的词义空间，避免将其限定为土地。
lexical_decisions:
- source_word: φρουροῦσι
  choice: 守卫
  rationale: 该分词表示守护、警戒；“守卫”自然保留了军事或防卫意味。
- source_word: τὴν πόλιν
  choice: 那城
  rationale: 原文有定冠词，所指为上下文中已明确的城；中文用“那城”体现其特指性。
- source_word: ἔγραψε
  choice: 写信，吩咐
  rationale: ἔγραψε直译为“写了”；结合后接不定式的行政语境，译作“写信，吩咐”既保留书面行为，也自然表达书面指令的内容。
- source_word: δοῦναι
  choice: 给
  rationale: 该不定式依附于ἔγραψε，表达书面指令的内容；中文用“吩咐给……”自然呈现其行政命令意味。
- source_word: κλήρους
  choice: 分地
  rationale: κλῆρος可指签、份额或分配所得；在城市守卫获给待遇的行政语境中，“分地”是可能且具体的理解，但原词仍有较宽泛的“份额”之义，故加注说明。
- source_word: ὀψώνια
  choice: 薪饷
  rationale: 该词常指军人或公职人员的给养、报酬；“薪饷”兼具军事语境和报酬含义，比一般的“工资”更贴切。
