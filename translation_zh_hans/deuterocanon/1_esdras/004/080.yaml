  yaml_path: translation/deuterocanon/1_esdras/004/080.yaml
  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: zh_hans
  text: 那青年出去以后，就面向耶路撒冷，仰脸望天，称颂天上的王，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: 那青年
  rationale: 自然对应“青年人”，并以“那”承接上文已知人物。
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  choice: 仰脸望天
  rationale: 保留“抬起脸朝向天空”的具体动作，同时符合现代汉语表达。
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: 面向耶路撒冷
  rationale: ἔναντιον在此表达朝向、面对；避免按现代汉语误解为“反对”或单纯的空间“对面”。
- source_word: εὐλόγησεν
  choice: 称颂
  rationale: 在以神为宾语时表示赞美、颂赞；“称颂”庄重而清楚。
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 天上的王
  rationale: 保留属格结构可表达的称号含义，与源文及英语咨询层一致，不改写为更具解释性的神名。
theological_decisions:
- issue: “天上的王”的所指
  choice: 保留称号“天上的王”
  alternative: 明确译作“上帝，天上的王”
  rationale: 上下文虽显然指向神，源文却只使用该称号；不额外补出“上帝”，以免消除原文表达方式。
- issue: 朝向耶路撒冷的动作关系
  choice: 译为“面向耶路撒冷，仰脸望天”
  alternative: 译为“仰脸望天，正对着耶路撒冷”
  rationale: 保留祷告者既朝向耶路撒冷又仰望天空的双重方位，不赋予额外礼仪或神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“出去以后”顺畅表达ὅτε ἐξῆλθεν的时间关系；句末用冒号引出下一节的话语。
