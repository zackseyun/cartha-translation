  to: 于是，大流士王站起身来，亲吻了他；又为他写了信，给所有的总管、地方长官、将领和总督，吩咐他们护送他和所有与他一同上去重建耶路撒冷的人。
  rationale: 仅作句法与行文层面的安全修订：明确“他”和“所有与他同去的人”都是“护送”的对象，并以更自然的中文表达原文复数“书信”。官职、上行和重建等关键译法维持不变。
