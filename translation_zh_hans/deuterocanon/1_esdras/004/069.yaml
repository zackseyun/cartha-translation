base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: zh_hans
  text: 于是，大流士王站起身来，亲吻了他；又为他写了信，给所有的总管、地方长官、将领和总督，吩咐他们护送他和所有与他一同上去重建耶路撒冷的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν
  choice: 亲吻了
  rationale: 该动词表示亲吻；按叙事语境自然直译，不额外解释其礼仪或情感含义。
- source_word: οἰκονόμους
  choice: 总管
  rationale: 指承担行政或财务管理职责的人；“总管”既保留管理职能，也适合古代官职语境。
- source_word: τοπάρχας
  choice: 地方长官
  rationale: 指辖管某一地区的官员；采用普通读者容易理解的功能性译名。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 保留其军事统领含义，避免过度限定具体军阶。
- source_word: σατράπας
  choice: 总督
  rationale: 指波斯帝国的行省长官；“总督”是现代中文中清楚而常见的对应词。
- source_word: προπέμψωσιν
  choice: 护送
  rationale: 该词在此表示协助并护送某人启程前行；“护送”凝练表达官方沿途支持。
- source_word: ἀναβαίνοντας
  choice: 上去
  rationale: 保留前往耶路撒冷惯用的上行表达，不将其弱化为一般的“前往”。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 动词本身可指建造，但在耶路撒冷遭毁后的叙事背景中指恢复建造；译作“重建”自然准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。官职名称以功能清楚为先，同时区分行政、地方、军事与行省层级；保留“上去”这一具有地理及传统色彩的表达。
