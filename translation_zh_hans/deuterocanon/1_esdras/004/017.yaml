  text: 各位男士，酒何等强大！它使所有喝它的人的心思迷乱，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: 诸位
  rationale: 这是阳性复数呼格，直接称呼在场的男子。现代汉语用“诸位”自然庄重，保留当面呼告的语气；语境已表明听众身份，无须生硬重复“男人们”。
- source_word: πῶς ὑπερισχύει
  choice: 力量何等强大
  rationale: πῶς在感叹句中表示程度；ὑπερισχύει指强盛、占优势。此译保留感叹力度，又不擅自补出一个明确的受事。
- source_word: ὁ οἶνος
  choice: 酒
  rationale: 直接对应οἶνος；本句泛论酒的作用，中文用“酒”比限定为某一杯或某种酒自然。
- source_word: πάντας τοὺς ἀνθρώπους τοὺς πίοντας αὐτόν
  choice: 凡喝酒的人
  rationale: ἀνθρώπους在此可泛指人，限定分词说明“喝它的人”。“凡喝酒的人”简洁地保留全称范围和一般性动作。
- source_word: πλανᾷ
  choice: 使……迷乱
  rationale: 该词有使偏离、引入歧途之意；与“心思”搭配时，“使……迷乱”自然表达认知受到扰乱，而不额外强化为道德背叛。
- source_word: τὴν διάνοιαν
  choice: 心思
  rationale: διάνοια指思想、理解或思维能力。“心思”在现代汉语中自然且范围适中，避免把含义收窄为纯粹理性。
