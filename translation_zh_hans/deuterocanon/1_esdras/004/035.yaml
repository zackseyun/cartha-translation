  text: Is not the one who does these things great? And truth is great, and stronger than everything.
translation:
  language: zh_hans
  text: 做这些事的人，岂不伟大吗？真理也是伟大的，比一切都更有力量。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέγας
  choice: 伟大
  rationale: 保留该词在本节两次出现时的对应关系，也自然表达行事者与真理的卓越。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 定冠词加抽象名词指向作为整体或原则的真理，译作“真理”简明庄重。
- source_word: ἰσχυροτέρα
  choice: 更有力量
  rationale: 准确表达比较级，且比单译“更强”更适合以“真理”为主语的现代汉语。
- source_word: παρὰ πάντα
  choice: 比一切都
  rationale: παρά与比较级连用表示比较；πάντα为中性复数，范围宽泛，保留“一切”的概括性。
theological_decisions:
- issue: “真理”与前一句行动者之间的关系
  choice: 以“也”连接两个并列判断，不明确行动者身份
  alternative: 将行动者解释为君王、女人或真理本身
  rationale: 希腊文本只说“做这些事的”，并未在本句明确所指；译文保留其篇章指代与修辞张力。
- issue: πάντα的范围
  choice: 译为“一切”
  alternative: 译为“万物”或“所有事物”
  rationale: “一切”既可涵盖人物、权势与事物，也不把比较范围限缩为受造物。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；首句保留希腊语反问语气，后句保留“伟大”一词的重复以及比较结构。
