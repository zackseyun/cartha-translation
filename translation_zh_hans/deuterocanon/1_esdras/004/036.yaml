base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: zh_hans
  text: 全地都呼求真理，天也称颂她；一切造物都震动战栗[a]，在她那里毫无不义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切造物”直译可作“一切作品”或“一切所作之物”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处的代词是阳性或中性形式（“他／它”），与前面指“真理”的阴性形式不一致；按上下文，这里最自然仍是指真理。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: 全地
  rationale: 与后面的“天”构成宇宙性的对应；“全地”既贴近原文，也符合现代汉语的经文语体。
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: 呼求真理
  rationale: καλέω接宾格可表达呼唤、召请或求告。原文没有“为有福”的补语，因此不译作“称真理为有福”；“呼求”保留此处可能含有求告意味的诗性表达。
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: 天也称颂她
  rationale: εὐλογέω可指祝福或称颂；当天对真理施行动作时，“称颂”在汉语中较自然。用“她”承接阴性名词ἀλήθεια，保留原文对真理的拟人化。
- source_word: πάντα τὰ ἔργα
  choice: 一切造物
  rationale: ἔργα直译为“作品”或“所作之物”；在“地、天”的宇宙性语境中，所指更可能是所有被造之物。“造物”自然地表达这一范围，但不把它缩限为人的行为。
- source_word: σείεται καὶ τρέμει
  choice: 震动战栗
  rationale: 保留两个并列动词的加强效果；“震动”可用于自然界和万物，“战栗”表现敬畏或惊惧。
- source_word: μετʼ αὐτοῦ
  choice: 在她那里
  rationale: μετά加属格可表达“与……同在”或“在……一边”。此处按上下文理解为真理那里或与真理同在；中文用“她”延续拟人化，但以脚注说明希腊文代词形式的不协调。
- source_word: ἄδικον οὐθέν
  choice: 毫无不义
  rationale: 原意为“没有任何不公正／不义之物”。“毫无不义”简洁保留道德与公正层面的含义，而不额外引入教派性解释。
theological_decisions:
- issue: 真理的拟人化
  choice: 用“她”指真理
  alternative: 用“它”或重复“真理”
  rationale: 希腊文先用阴性代词αὐτήν承接阴性名词ἀλήθεια，形成明确的修辞性拟人。译作“她”保留这一特征，但不据此断言真理是独立的位格。
- issue: 末句代词的性别不一致
  choice: 正文按上下文译为“她”，脚注保留形式上的异常
  alternative: 正文译为“他／它”
  rationale: 传世文本的αὐτοῦ是阳性或中性形式，与此前指向“真理”的阴性形式不一致。上下文最自然的所指仍是真理；正文保持连贯，脚注则不掩盖原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“全地”“天”“毫无不义”保持经文的凝练感；“呼求”“称颂”“震动战栗”再现原句的诗性和递进节奏。所有脚注标记均已置于正文相应位置。
