base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: zh_hans
  text: 她的判断中毫无不公。力量、国度、权柄和威严都属于她，直到万世万代[a]。真理的上帝当受称颂！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“所有世代的”。也可按中文惯用语表达为“直到万世万代”。
    reason: 说明τῶν πάντων αἰώνων的字面形式及正文所采用的自然中文表达。
lexical_decisions:
- source_word: κρίσις
  choice: 判断
  rationale: 在ἐν τῇ κρίσει αὐτῆς中指她所作的判断或裁断；“判断”保留司法意味，也比“审判”更适合此处对人格化真理的陈述。
- source_word: ἄδικον
  choice: 不公
  rationale: 表示不合公义、不公正之事；与“判断”搭配自然，并避免赋予原文没有明说的更重神学色彩。
- source_word: ἰσχύς
  choice: 力量
  rationale: 直接表达强力、能力，并与后面的ἐξουσία“权柄”保持区别。
- source_word: βασίλειον
  choice: 国度
  rationale: 保留该词有关王国、王权领域的意象；“王权”亦可，但会与ἐξουσία在中文中部分重叠。
- source_word: ἐξουσία
  choice: 权柄
  rationale: 表达有正当依据的权力或管辖权，并区别于ἰσχύς所表示的力量。
- source_word: μεγαλειότης
  choice: 威严
  rationale: 在颂赞语境中自然表达崇高、伟大和尊荣。
- source_word: τῶν πάντων αἰώνων
  choice: 万世万代
  rationale: 这是符合现代中文颂赞语体的表达，对应“所有的世代／时代”，并传达历世无尽之意；脚注保留更贴近字面的形式。
- source_word: εὐλογητός
  choice: 当受称颂
  rationale: 按颂赞公式处理，传达宣告和赞美的语气，比静态的“是有福的”更符合此处。
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: 真理的上帝
  rationale: 保留属格结构，使上帝与“真理”的关系维持原文的开放性；不改写为句法和重心不同的“真实的上帝”。
theological_decisions:
- issue: 阴性代词αὐτῆς与αὕτη的所指
  choice: 用“她”指代上下文中被人格化的真理
  alternative: 重复“真理”，或用非人格化的“它”
  rationale: 希腊文以阴性代词延续上下文对真理的拟人化颂赞；中文“她”能保留这一文学特征，不把原文的形象压平为纯抽象概念。
- issue: αὕτη与后列名词的句法关系
  choice: 译作“她就是……力量、国度、权柄和威严”
  alternative: 译作“力量、国度、权柄和威严都属于她”
  rationale: 无系词句最直接可理解为以αὕτη作主语、后列名词作表语。“都属于她”更顺畅，却增添了原文没有明示的所属关系，因此正文采用较贴近希腊文结构的表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“她”延续真理的人格化形象；并列使用“力量、国度、权柄和威严”，尽量保存原文各名词之间的区别。脚注标记置于其实际说明的“万世万代”之后。
