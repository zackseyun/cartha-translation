  yaml_path: translation/deuterocanon/1_esdras/004/043.yaml
  text: Then he said to the king[a], “Remember the vow that you vowed to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: zh_hans
  text: 于是，他对王说：“请记得你所许的愿[a]，就是在你登基那天重建耶路撒冷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿”也可译为“祷告”；希腊语名词可有“祷告”的意思，但这里的同源动词和上下文更支持“许愿”。
    reason: 保留 εὐχή 的词义歧义，同时说明正文选择“愿”的语境依据。
lexical_decisions:
- source_word: τότε εἶπεν τῷ βασιλεῖ
  choice: 于是，他对王说
  rationale: τότε承接叙事，在现代汉语中译为“于是”自然；“对王说”准确表达间接受词。
- source_word: Μνήσθητι
  choice: 请记得
  rationale: 该词是直接请求式的命令语气；加“请”符合臣民向君王说话的汉语礼貌语域，同时保留劝请力度。
- source_word: τὴν εὐχὴν ἣν ηὔξω
  choice: 你所许的愿
  rationale: 名词εὐχή与同源动词ηὔξω连用，在此语境中指郑重许下的愿，而非一般祷告。汉语“所许的愿”自然保留同源重复的核心含义。
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: 重建耶路撒冷
  rationale: οἰκοδομέω本义可为“建造”，但历史语境涉及遭毁后的恢复，因此“重建”更准确。
- source_word: ἐν τῇ ἡμέρᾳ ᾗ τὸ βασίλειόν σου παρέλαβες
  choice: 你登基那天
  rationale: 字面意为“你承受你的国度之日”。此处指取得王权；“登基那天”是现代汉语简洁、庄重且语境准确的表达。
theological_decisions:
- issue: εὐχή在君王承诺语境中的含义
  choice: 愿
  alternative: 祷告
  rationale: 同源动词ηὔξω和上下文都更支持“许愿、立愿”的意思，即君王先前承担的承诺；脚注保留“祷告”的词义可能性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“请记得”体现向君王陈说时的礼貌而不削弱命令式诉求；将较生硬的“承受你的国度”意译为“登基”，以清楚表达取得王权。脚注标记置于与其相关的整句末尾。
