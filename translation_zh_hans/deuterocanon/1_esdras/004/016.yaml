  yaml_path: translation/deuterocanon/1_esdras/004/016.yaml
  text: 'And they said to them[a], “Report to us about what has been written.” And the first, the one who had spoken about the strength of wine, began and said thus:'
translation:
  language: zh_hans
  text: 他们对他们说：“把所写的内容告诉我们。”第一个发言的，就是那位谈论酒的力量[a]的人，开始这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量”也可译作“威力”或“强力”。希腊词可指力量、强力或威能。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατέ
  choice: 告诉
  rationale: 这是复数命令式，表示把事情陈述、报告出来；“告诉我们”在现代汉语中自然清楚，也适合此处公开作答的场景。
- source_word: περὶ τῶν γεγραμμένων
  choice: 把所写的内容
  rationale: 保留περί所指的论题范围以及γεγραμμένων的完成被动含义，不明确添加“你们”，以免超出希腊文本。汉语用“把……告诉我们”自然表达原文“就……向我们报告”。
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: 第一个人，就是那位说……的人
  rationale: 保留两个带冠词结构所形成的同位说明，明确指参赛者中的第一位及其先前提出的论题。
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: 说酒有力量
  rationale: ἰσχύς可指力量、能力或威力；“酒有力量”既贴近原文，也自然引出下文对酒之支配力的论述。
- source_word: καὶ ἔφη οὕτως
  choice: 开始这样说道
  rationale: “这样说道”保留οὕτως引出下文直接陈述的功能；与ἤρξατο合译为自然而庄重的叙事表达。
theological_decisions: []
