  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: zh_hans
  text: 他还写明，要供给利未人所需，直到那殿完工、耶路撒冷建成的那一天。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给……所需”也可译作“供应”“给养”“补助”或“供给”。
    reason: lexical_alternative
  - marker: b
    text: “那殿”原文直译为“那房屋”；在这里指圣殿。
    reason: cross_reference
  - marker: c
    text: “耶路撒冷建成”也可按复兴的语境译作“耶路撒冷重建”。希腊文在“直到……的那一天”之后的句法略显生硬，可能反映传抄状态；整体意思是，供应要持续到圣殿完工和耶路撒冷建成。
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: 下书
  rationale: 这里指以书面形式发出命令。“下书”简洁地表达正式书面指令，同时不增添希腊文未说明的收件人。
- source_word: δοῦναι
  choice: 要给
  rationale: 不定式承接“下书”，表示命令的内容；译作“要给”符合现代汉语的命令语气。
- source_word: τὴν χορηγίαν
  choice: 供应
  rationale: 该词表示为维持需要而提供的钱财或物资；“供应”保留其范围，不限定为薪俸或某一种具体给养。
- source_word: τοῖς Λευείταις
  choice: 给利未人
  rationale: 与格表示接受者；“利未人”采用通行的圣经专名译法。
- source_word: ἕως τῆς ἡμέρας
  choice: 直到……的那一天
  rationale: 保留原文所表达的时间终点，并使汉语句式自然。
- source_word: ᾖ ἐπιτελεσθῇ
  choice: 完工
  rationale: 传抄下来的希腊语句法略显生硬，但所指是殿宇将来完成；“完工”准确而自然。
- source_word: ὁ οἶκος
  choice: 殿宇
  rationale: 字面为“房屋”，但本语境明确指耶路撒冷的圣殿。“殿宇”既传达所指，也保留庄重语体。
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: 耶路撒冷建成
  rationale: 原文只说“被建造”，并未在动词中明确加入“再”；正文因此译作“建成”，把“重建”的语境含义留作脚注说明。
theological_decisions:
- issue: ὁ οἶκος所指为何
  choice: 在正文译为“殿宇”，指耶路撒冷圣殿
  alternative: 直译为“房屋”或“那殿”
  rationale: 以斯拉复兴叙事中，该词在此明确指圣殿。“殿宇”让普通现代读者无需猜测，同时没有引入宗派性解释。
- issue: οἰκοδομηθῆναι是否译出“重建”
  choice: 正文译为“建成”
  alternative: 译为“重建”
  rationale: 历史语境确为恢复与重建，但希腊动词本身只表达建造。保留“建成”可避免把语境推论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“下书”体现王命的正式性；“殿宇”比“房屋”更清楚地传达语境所指。句中保留两个并列的完成目标，并以脚注说明原文措辞及传抄句法的张力。
