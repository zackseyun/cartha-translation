  text: They were watching him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: zh_hans
  text: 我看着他，也看着阿帕梅——那位令人赞叹的巴尔塔科斯的女儿、王的妃妾——正坐在王的右边，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεώρουν
  choice: 我曾看见
  rationale: 该未完成时形式在形态上既可作第一人称单数，也可作第三人称复数；依据讲话者在上下文中的亲历陈述，正文采用“我”，并以“曾看见”表达过去持续观察的叙事背景，同时在脚注保留形态歧义。
- source_word: αὐτὸν καὶ Ἀπάμην
  choice: 他和阿帕梅
  rationale: 两个词同为宾格，共同作“看见”的宾语；人名按希腊语形式音译。
- source_word: θυγατέρα
  choice: 女儿
  rationale: 忠实表达通常的亲属称谓。
- source_word: Βαρτάκου
  choice: 巴尔塔科斯
  rationale: 由希腊语属格形式还原并音译其人名；音译可能有不同处理，故加脚注。
- source_word: τοῦ θαυμαστοῦ
  choice: 令人赞叹的
  rationale: 保留该形容词对巴尔塔科斯的描述作用，不擅自视为正式头衔；脚注列出“卓著的”“闻名的”等语义可能。
- source_word: τὴν παλλακὴν τοῦ βασιλέως
  choice: 王的妃妾
  rationale: παλλακή指地位次于正妻的女性伴侣；“妃妾”比现代语境中的“情妇”更符合王室历史叙事，也不掩盖其较低的婚配地位。
- source_word: καθημένην ἐν δεξιᾷ τοῦ βασιλέως
  choice: 正坐在王的右边
  rationale: 以自然现代汉语保留现在分词所描写的姿态和位置。
theological_decisions:
- issue: ἐθεώρουν的叙事主语
  choice: 正文译作第一人称单数“我曾看见”，并以脚注保留形态歧义
  alternative: 他们曾看见
  rationale: 该希腊语动词形式可同时对应第一人称单数和第三人称复数。上下文是讲话者叙述自己的观察，因此第一人称较合语境；但原文单独看并不能排除第三人称，故不应隐去这一歧义。
- issue: τοῦ θαυμαστοῦ是否为正式称号
  choice: 按描述性修饰语译作“令人赞叹的”
  alternative: 卓著的；闻名的；将其理解为称号
  rationale: 希腊文明确保留这一形容词，却没有足够证据证明它是官衔或固定称号；采用描述性译法可避免引入原文未明示的身份信息。
- issue: παλλακή所表达的关系
  choice: 妃妾
  alternative: 妾；情妇；次妻
  rationale: 原词表示非正妻的女性伴侣。“妃妾”在王室语境中清楚而庄重，既不将其提升为王后，也避免“情妇”在现代汉语中可能造成的时代错置。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。经文在本节末仍与下文相连，因此保留句末逗号；用分号梳理“他和阿帕梅”之后对阿帕梅身份的同位说明，避免中文连续多层修饰造成误读。
