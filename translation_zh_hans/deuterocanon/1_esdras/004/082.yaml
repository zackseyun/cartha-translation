  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: zh_hans
  text: 赐我智慧的你是当受称颂的；列祖的主宰啊，我也向你称谢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称谢”也可译作“承认”或“宣认”。希腊语动词可指公开承认、宣认或颂赞；这里因上下文是在领受智慧后向上帝祝颂，故译作“称谢”。
    reason: 词义存在多种可能，需保留原文中公开承认与感谢、颂赞之间的语义幅度。
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: 你是当受称颂的
  rationale: 保留颂赞祷文中的谓语结构；“当受称颂”比单说“有福”更自然地表达这里对上帝的颂赞，同时不过度改写为命令式。
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: 赐我智慧的
  rationale: 按希腊文关系从句修饰受称颂者；“赐我智慧”简洁表达已经完成且仍具现实意义的赐予。
- source_word: σοὶ ὁμολογῶ
  choice: 我也向你称谢
  rationale: ὁμολογέω可表示承认、公开宣认，也可在敬拜语境中表达称颂或感谢。此处承接上句的颂赞，“称谢”既符合祷告语境，也保留公开承认并感谢的意味。
- source_word: δέσποτα
  choice: 主宰啊
  rationale: 该词强调权柄与统治，且有别于通常译作“主”的κύριος；“主宰”在现代汉语中庄重自然，并保留词义区别。
- source_word: τῶν πατέρων
  choice: 列祖的
  rationale: 原文没有明说“我们的”；“列祖”符合圣经语体，也比笼统的“祖先”更贴近πατέρων的传统指称。
theological_decisions:
- issue: 神圣称谓δέσποτα的译法
  choice: 主宰啊
  alternative: 主啊；至高掌权者啊
  rationale: “主宰”保留δέσποτα所强调的绝对权柄，又避免与κύριος通常对应的“主”混同；原文并没有“至高”一词，因此不予增添。
- issue: 祷告中ὁμολογῶ的含义
  choice: 称谢
  alternative: 承认；宣认；赞美
  rationale: 现代汉语的“承认”容易显得抽象，“认罪”更会误导为承认过犯。这里说话者因领受智慧而颂赞上帝，“称谢”最符合上下文；脚注保留该动词较宽的承认、宣认义，避免消除原文的语义张力。
- issue: τῶν πατέρων是否补出领属代词
  choice: 列祖的
  alternative: 我们列祖的
  rationale: 希腊文没有显式的“我们”，故正文不补入；“列祖”本身已能让现代读者理解其群体传统背景。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“当受称颂”“列祖”“主宰”“称谢”具有适度的经文风格，但不陈旧；语序尽量贴近希腊文，先以关系结构说明上帝赐下智慧，再转为直接呼告。
