  yaml_path: translation/deuterocanon/1_esdras/004/077.yaml
  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
translation:
  language: zh_hans
  text: 他又写下命令，要供给利未人所需，直到圣殿[a]竣工、耶路撒冷建成[b]的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房屋”，在这里通常指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶路撒冷重建完成。”上下文讲的是复兴，但希腊文动词本身只说“建造”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: 下书
  rationale: 该动词在这里引出书面指令；“下书”简洁地表达正式写下命令的含义。
- source_word: δοῦναι
  choice: 要供给
  rationale: 不定式承接ἔγραψεν，表示书面指令的内容；“要”体现指令语气。
- source_word: τὴν χορηγίαν
  choice: 所需
  rationale: χορηγία指供应、给养或维持所需之物；“供给……所需”自然且不限定具体形式。
- source_word: τοῖς Λευείταις
  choice: 利未人
  rationale: 与“供给”搭配，清楚标明供应的接受者。
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: 直到……的那一天
  rationale: 保留原文明确的时间界限与“日”这一表达。
- source_word: ἐπιτελεσθῇ
  choice: 竣工
  rationale: 被动虚拟式表示工程达到完成；“竣工”适合建筑语境，并以汉语自然表达完成之意。
- source_word: ὁ οἶκος
  choice: 圣殿
  rationale: 字面为“房屋”，但在此处按上下文惯指圣殿；正文采用清楚的所指，脚注保留字面形式。
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: 耶路撒冷建成
  rationale: 忠实保留οἰκοδομηθῆναι“被建造”的基本意义；虽处于复兴语境，却不在正文中擅自增添“重”字。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“下书”体现正式的书面命令；“供给利未人所需”避免把供应内容过度具体化。正文按语境译出“圣殿”，并用脚注交代原文“房屋”；对于耶路撒冷则保留“建成”，不消除“建造／重建”的语义张力。
