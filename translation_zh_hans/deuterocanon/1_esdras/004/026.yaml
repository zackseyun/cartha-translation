  language: zh_hans
  text: 许多人因妇女而丧失了自己的判断力[a]，又因她们成了奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“昏了头”，或“在自己的心思上受了迷惑”。希腊文指人的心智或健全判断力受到破坏，并不一定指临床意义上的精神失常。
    reason: 说明ἀπενοήθησαν与ταῖς ἰδίαις διανοίαις合用时的词义范围，并保留原文可能表达的不同程度。
lexical_decisions:
- source_word: ἀπενοήθησαν
  choice: 失去了理智
  rationale: 该词表示健全判断或理解能力受到破坏、变得不理智；此译法保留其强烈程度，同时避免把它限定为临床意义上的精神失常。
- source_word: ταῖς ἰδίαις διανοίαις
  choice: 理智（与ἀπενοήθησαν合译）
  rationale: 这一短语与动词紧密相连，指向他们自身的思想、判断或心智活动。中文将两者合译为“失去了理智”，较为自然，也保留心智判断崩溃的含义。
- source_word: διὰ τὰς γυναῖκας
  choice: 因女人
  rationale: διά接宾格在此表示原因；“因女人”简洁而直接。
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 这里强调受制于人的身份和处境，“奴隶”比“仆人”更准确地表达δοῦλοι的力度。
- source_word: ἐγένοντο
  choice: 成了
  rationale: 用于表语结构，直接表达状态或身份的转变。
- source_word: διʼ αὐτάς
  choice: 因她们
  rationale: 代词回指前文的“女人”，并再次表达原因，保留原文的平行结构。
