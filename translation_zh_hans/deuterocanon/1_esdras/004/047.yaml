base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/047.yaml
  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: zh_hans
  text: 那时，大流士王站起身来，亲吻了他，又为他的事写信给所有的管事、地方长官、将领和行省总督，吩咐他们护送[a]他和所有同他一起上去建造耶路撒冷[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护送”也可理解为“送他们上路，并为旅程提供协助”；希腊语动词除送行外，也可包括供应或支持旅程所需。
    reason: lexical_alternative
  - marker: b
    text: 有些译本依据上下文译作“重建耶路撒冷”，但这里的希腊语动词本身只是“建造”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 作为叙事中的时间承接语，自然引出接下来的行动。
- source_word: ἀναστὰς
  choice: 站起身来
  rationale: 保留大流士起身这一具体动作，也符合现代汉语叙事习惯。
- source_word: κατεφίλησεν
  choice: 亲吻了
  rationale: 该复合动词可带有热切或亲昵意味；正文用中性的“亲吻”保留动作而不过度限定情感程度。
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: 为他写信
  rationale: 将与格理解为受益与格，表明这些信是为他、为支持其行程而写。
- source_word: οἰκονόμους
  choice: 管事
  rationale: 指管理财物、产业或行政事务的人员；“管事”比仅限财务职能的“司库”涵盖面更合适。
- source_word: τοπάρχας
  choice: 地方长官
  rationale: 该称谓指辖管某一地区的官员，采用功能性译名，清楚而不生硬。
- source_word: στρατηγοὺς
  choice: 将领
  rationale: 准确表达军事统帅或指挥官的通常含义。
- source_word: σατράπας
  choice: 行省总督
  rationale: 表达波斯帝国特定的行省行政长官，同时与前面的“地方长官”作出层级和职务上的区分。
- source_word: ἵνα προπέμψωσιν
  choice: 吩咐他们护送
  rationale: προπέμπω在此可指护送上路，也可能包含为旅程提供协助；正文采用简明的“护送”，脚注保留较宽的语义。
- source_word: τοὺς μετʼ αὐτοῦ πάντας
  choice: 所有同他一起……的人
  rationale: 保留“所有”所表达的全体性，并以自然汉语连接后面的分词。
- source_word: ἀναβαίνοντας
  choice: 上去
  rationale: 保留前往耶路撒冷常用的“上去”这一方向性表达。
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: 建造耶路撒冷
  rationale: 原文动词是“建造”，并未显式使用“重建”；正文从严保留原文措辞。
