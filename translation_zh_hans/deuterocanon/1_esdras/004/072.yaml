  yaml_path: translation/deuterocanon/1_esdras/004/072.yaml
  text: and that all the land they possess should be tax-free for them[b][a]; and that the Chaldeans should leave the villages of the Jews that they hold.
translation:
  language: zh_hans
  text: 他们所占有的一切土地都应免税[a]；迦勒底人[b]也要交出他们所占据的犹太人村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所占有的一切地区，都应免除贡赋。”
    reason: “土地”也可译作“地区”；ἀφορολόγητον既可泛指免税，也可在王权行政语境中指免除贡赋。
  - marker: b
    text: 希腊文作“迦勒底人”；这里也可较宽泛地理解为巴比伦人。
    reason: 保留原文族称，同时说明其可能的历史性宽泛理解。
lexical_decisions:
- source_word: χώραν
  choice: 土地
  rationale: 该词泛指一片地域；这里处于王令的土地与税赋语境中，“土地”自然且不过度限定其政治性质。
- source_word: κρατήσουσιν
  choice: 将占有
  rationale: κρατέω在此表示对土地实行持有或控制；保留将来时，以对应希腊文所指他们将持有的土地。
- source_word: ἀφορολόγητον
  choice: 免税
  rationale: 该形容词表示免受税款或贡赋征收；“免税”是现代汉语中简洁清楚的行政用语。
- source_word: ὑπάρχειν
  choice: 要为他们
  rationale: 与ἀφορολόγητον连用，表达王令规定该土地对他们处于免税状态；用“要”传达法令条款的规定性，不另行加入所有权含义。
- source_word: Χαλδαῖοι
  choice: 迦勒底人
  rationale: 忠实保留希腊文的族称，不在正文中改释为较宽泛的“巴比伦人”。
- source_word: ἀφίουσι
  choice: 要交出
  rationale: ἀφίημι在此指放弃所控制的村庄；“交出”比字面的“离开”更清楚地表达解除占有。
- source_word: κώμας
  choice: 村庄
  rationale: κώμη通常指村庄或乡村聚落，“村庄”是最直接自然的对应词。
- source_word: διακρατοῦσιν
  choice: 所占据
  rationale: 该复合动词强调持续掌握、控制；“占据”适合描述迦勒底人控制犹太人的村庄，同时避免与前句措辞完全重复。
theological_decisions:
- issue: 王令语境中不定式及ἵνα分句的法律—行政效力
  choice: 用“都要……；……也要……”表达法令规定
  alternative: 较形式化地译为“使……免税；并使……放弃……”
  rationale: 上下文是在列举王令条款。“要”既保留规定性，也符合现代汉语行文；不把条款强化为神学命令或绝对应许。
- issue: 免税条款是否同时明说土地所有权
  choice: 只译为土地“为他们免税”
  alternative: 译为土地“免税归他们所有”
  rationale: ἀφορολόγητον是句中的明确述语，而ὑπάρχειν可表示处于某种状态；不额外加入“归他们所有”，以免消除原文在法律状态与所有权之间的潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的王令条款语体。两个并列分句以分号衔接；避免古奥的“赋税蠲免”等词，也不将原文未明说的土地所有权加入正文。
