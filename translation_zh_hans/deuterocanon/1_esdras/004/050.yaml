  yaml_path: translation/deuterocanon/1_esdras/004/050.yaml
  text: and that all the land that they hold should be tax-free for them[a]; and that the Chaldeans should leave the villages of the Jews that they occupy;
translation:
  language: zh_hans
  text: 他们所持有的一切土地，均应享有免税待遇[a]；迦勒底人应当离开他们所占据的犹太人村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所拥有的一切地域，都应免除贡赋。”
    reason: 保留χώρα可译为“地域”、κρατέω可译为“拥有”，以及ἀφορολόγητος所含“免除贡赋”的词义选择。
lexical_decisions:
- source_word: χώραν
  choice: 土地
  rationale: χώρα在这里指一定范围的土地或地域；“土地”符合行政与占有语境，同时不把它限定为政治意义上的国家或地区。
- source_word: κρατήσουσιν
  choice: 所持有的
  rationale: κρατέω在这里表示持有、掌控土地；“持有”保留占有或控制的含义，又不暗示其占有必然非法。
- source_word: ἀφορολόγητον
  choice: 免税
  rationale: 该词明确表示不被征税或免除贡赋；“免税”是清楚自然的现代汉语表达。
- source_word: ὑπάρχειν
  choice: 要……
  rationale: 在诏令式的不定式结构中，ὑπάρχειν表示处于某种状态；用“要……免税”自然体现规定或命令的语气。
- source_word: Χαλδαῖοι
  choice: 迦勒底人
  rationale: 直接对应希腊文Χαλδαῖοι，避免解释性地扩大为“巴比伦人”。
- source_word: ἀφίουσι
  choice: 要交出
  rationale: ἀφίημι在此指放弃或解除对村庄的占有；“交出”比单纯“离开”更清楚地表达 relinquish possession 的意思。
- source_word: κώμας
  choice: 村庄
  rationale: κώμη通常指村庄或乡村聚落；“村庄”准确而通俗。
- source_word: διακρατοῦσιν
  choice: 所占有的
  rationale: διακρατέω强调持续持有或控制；“占有”保留控制权含义，但不像“占领”那样必然带入军事色彩。
