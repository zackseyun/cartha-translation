base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: zh_hans
  text: “如今，王啊，这就是我所求的，也是我向你所请求的；这就是出于你的宏恩[a]。所以我恳求你：请你成全我向天上的王所许的愿[b]，由你亲口成全[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宏恩”直译可作“伟大”或“宏大之举”；这里在向君王陈情的语境中，指王所施予的非凡恩惠或宏大作为。
    reason: lexical_alternative
  - marker: b
    text: “愿”也可译作“祷告”；但这里的名词与“许愿”这一同根动词连用，因此较可能指所许的愿。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从你的口”。在君王语境中，可指王亲口所发的命令或授权。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ / αἰτοῦμαί
  choice: 我所求的／我向你所请求的
  rationale: 两个动词都表示郑重求请。译文保留原文的修辞复沓，同时以略有差别的汉语表达体现第二个动词明确以国王为请求对象。
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: 出于你的厚恩
  rationale: μεγαλωσύνη 本义涉及“伟大、宏大”，但在向君王陈情的语境中，παρὰ σοῦ 指君王所施予的宏大恩惠；译作“厚恩”较自然，并以脚注保留较直译的可能。
- source_word: δέομαι
  choice: 我恳求你
  rationale: 该词比一般的“求、请求”语气更强，体现说话者在君王面前迫切而恭敬的请求。
- source_word: ποιήσῃς τὴν εὐχὴν / ηὐξάμην
  choice: 成全……所许的愿
  rationale: εὐχή 与同根动词 ηὐξάμην 连用，较强地指向许愿和履行所许之愿，而非一般祷告。“成全”自然表达希腊语“实行这愿”的习语。
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 天上的王
  rationale: 按希腊语结构直译这一对上帝的尊称，并与正在受称呼的人间君王形成对照。
- source_word: ἐκ στόματός σου
  choice: 由你亲口下令
  rationale: 字面义是“出于你的口”；结合君王语境，指经君王口头命令或授权而实施。译文保留“亲口”的具体意象，并明示其实际功能为下令。
theological_decisions:
- issue: “天上的王”所指
  choice: 作为指上帝的尊称
  alternative: 泛指一位天界君王
  rationale: 犹太宫廷叙事的语境以及它与地上君王的对照，都支持这是对上帝的敬称；译文不另加具体神名。
- issue: εὐχή / ηὐξάμην 的含义
  choice: 许愿用语
  alternative: 祷告或祈求用语
  rationale: 名词和同根动词形成“所许的愿”这一组合，许愿义最符合句法关系；脚注仍交代该词可有“祷告”义，以保存词义张力。
- issue: 谁使所许的愿实现
  choice: 请求地上的王以亲口命令促成其实现
  alternative: 说话者自己履行向上帝所许的愿，只需国王授权
  rationale: 原文把 ποιήσῃς 直接用于地上的王，又以 ἐκ στόματός σου 强调“从你的口”；译文不把国王说成许愿者，而以“下令使它实现”保留国王促成此事的角色。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“王啊”保留宫廷陈情的呼语；整体维持原文层层递进的请求语气，并用分号避免长句显得生硬。
