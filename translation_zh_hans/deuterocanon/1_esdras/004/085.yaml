  text: to go up and rebuild Jerusalem and the temple on which his name had been called; and they celebrated with music and joy for seven days.
translation:
  language: zh_hans
  text: 上去重建耶路撒冷和他的名被称在其上的圣殿[a]；他们伴着音乐和欢乐欢庆了七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在其上求告他的名”或“以他的名命名的”。原文沿用带有闪语色彩的圣殿用语，表示这圣殿归属于他，并与他的名相联。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: 上去
  rationale: 保留“上行、上去”的基本意义；在前往耶路撒冷的语境中也自然成立，不把其中可能含有的归回意味直接写入正文。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 动词基本义为“建造”，但这里涉及耶路撒冷和圣殿在毁坏后的恢复，译作“重建”准确体现上下文。
- source_word: ἱερὸν
  choice: 圣殿
  rationale: 此处指耶路撒冷的圣殿；“圣殿”是现代汉语圣经语境中清楚而自然的对应词。
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: 那座称为他名下的
  rationale: 这是带有闪语色彩的圣殿表达，表示圣殿归属于他并与他的名相联。此译保留“名”的意象，同时避免生硬的逐词翻译。
- source_word: ἐκωθωνίζοντο
  choice: 庆祝
  rationale: 这个罕见动词表示欢宴或节庆性的欢乐活动；“庆祝”清楚、现代，也与后面的音乐和欢乐相配。
- source_word: μουσικῶν
  choice: 音乐
  rationale: 其复数属格可能指音乐、乐事或乐师；正文采用不作过度限定的“音乐”。
- source_word: χαρᾶς
  choice: 欢乐
  rationale: 直接表达喜乐、欢欣，并与节庆语境相称。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 按现代汉语表达时段的自然方式翻译。
theological_decisions:
- issue: 圣殿与神之名的公式化表达
  choice: 称为他名下的
  alternative: 他的名被称在其上的；以他的名命名的
  rationale: 原文既可被理解为他的名被宣告或求告在圣殿之上，也可表达圣殿归于并代表他的名。正文保留归属及关联的圣经式意象，脚注说明其他可能译法，不将其简化为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“上去”保留前往耶路撒冷的上行表达；“在音乐和欢乐中庆祝”自然呈现节庆场景。代词“他”依原文保留，不在本节片段中擅自补明所指。
