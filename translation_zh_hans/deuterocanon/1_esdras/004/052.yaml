lexical_decisions:
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 这是献祭语境中的标准用词，自然对应祭牲焚献之处。
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 指祭物完全焚烧的祭，采用现代中文圣经语体中准确而简洁的通行译法。
- source_word: καρποῦσθαι
  choice: 献
  rationale: 该动词在此语境中用法异常，直译为“结果”或“收获”会造成误导；结合祭坛和燔祭，译为“献”最能传达现存希腊文的大意，同时以脚注说明文本困难。
- source_word: καθʼ ἡμέραν
  choice: 每天
  rationale: 清楚保留逐日进行的分配意义，符合现代汉语表达。
- source_word: ἐντολήν
  choice: 命令
  rationale: 表达具有权威性的指示；“所领受的命令”使中文衔接自然，又不额外指定颁令者。
- source_word: ἑπτὰ καὶ δέκα
  choice: 十七
  rationale: 按现代汉语习惯表达原文数字“七和十”。原文未明说所数之物，译文也不擅自补足。
- source_word: προσφέρειν
  choice: 献上
  rationale: 保留献祭或呈献语境中的动作含义，并与前面的“献燔祭”形成自然呼应。
- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: 另外每年献十他连得
  rationale: 将ἄλλα理解为追加性的“另外”，τάλαντα保留为古代重量或货币单位“他连得”；不擅自说明其具体物质或用途。
