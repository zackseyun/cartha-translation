  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
translation:
  language: zh_hans
  text: 他又写道，要把份额[a]和粮饷[b]给所有守卫这城的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “份额”或译“阄份”“配额”。希腊词κλήρους可指经抽签或分配所得的份。
    reason: lexical_alternative
  - marker: b
    text: “粮饷”或译“薪饷”“给养”。希腊词ὀψώνια可指服役所得的供应或报酬。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: 守卫
  rationale: 该分词表示看守、护卫；“守卫这城的人”自然清楚，并保留其持续执行警戒任务的含义。
- source_word: πόλιν
  choice: 这城
  rationale: πόλις通常指“城”或“城市”；此处有特指意味，汉语用“这城”衔接语境较自然。
- source_word: ἔγραψε
  choice: 下令
  rationale: 字面是“写了”，但与表示命令内容的不定式δοῦναι连用，在王室行政语境中指发出书面指令；正文用“下令”传达其语用功能，避免生硬的“写信要给”。
- source_word: δοῦναι
  choice: 要给
  rationale: 该不定式表达书面指令的内容；译作“要给”保持主动结构，并明确受领者是守城的人。
- source_word: κλήρους
  choice: 分得的份
  rationale: κλῆρος可指通过抽签或分配所得的份额；“分得的份”保留分配所得之物的宽泛含义，不限定为土地或实际抽签。
- source_word: ὀψώνια
  choice: 粮饷
  rationale: ὀψώνια可指服役所得的给养、薪饷或报酬；对守城人员而言，“粮饷”能自然涵盖供给与薪酬两方面。
