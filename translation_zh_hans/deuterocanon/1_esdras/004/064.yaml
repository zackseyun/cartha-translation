  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: zh_hans
  text: 于是，王对他说：“凡是超过所写明的，你想要什么，只管求，我们必赐给你；因为你已显明更有智慧。你要坐在我身边，也要被称为我的亲族。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείω τῶν γεγραμμένων
  choice: 除了已经写明的赏赐以外
  rationale: 直译为“超过所写的”，语境指先前书面列明的奖赏；补出“赏赐”使现代汉语自然，同时保留其书面规定的含义。
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: 因为你已显明比众人更有智慧
  rationale: εὑρέθης 表示经考验后“被发现、显明”；σοφώτερος 是比较级，汉语补出隐含的比较对象“众人”。
- source_word: ἐχόμενός μου
  choice: 坐在我身旁
  rationale: ἐχόμενος 表示紧邻、挨着，结合 καθήσῃ，译作“坐在我身旁”准确自然。
- source_word: συγγενής μου
  choice: 我的亲族
  rationale: συγγενής 可指亲属、同族之人；“亲族”保留关系性质及宫廷荣誉称号的空间，不具体化为某种亲属身份。
