  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: zh_hans
  text: 他还写信给所有在科勒叙利亚和腓尼基的地方长官[a]，以及在黎巴嫩的人，叫他们把黎巴嫩的香柏木运到耶路撒冷，好让他们与他一同建造这城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地方长官”也可译作“辖区统治者”；希腊文指治理某一地方或辖区的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: 地方长官
  rationale: τοπάρχης指治理某一地方或辖区的人。“地方长官”既表达行政职能，也比音译名称更便于现代读者理解。
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: 叙利亚谷地
  rationale: κοίλη Συρία是希腊化时期的地域名称；“叙利亚谷地”保留其专名性质及κοίλη所含的地形意味。
- source_word: ἔγραψεν ἐπιστολάς
  choice: 写信
  rationale: 原文明确陈述“写了书信”，因此不改译为仅强调递送动作的“送信”。
- source_word: μεταφέρειν
  choice: 运到
  rationale: 此处指将建筑木料从黎巴嫩转运至耶路撒冷；“运到”自然地表达运输及目的地。
- source_word: ξύλα κέδρινα
  choice: 香柏木
  rationale: 该短语指供建筑使用的香柏木材；现代汉语中“香柏木”已能自然表达其材料性质。
- source_word: ὅπως οἰκοδομήσωσιν
  choice: 好让他们……建造
  rationale: ὅπως加虚拟式表示目的；“好让”清楚保留这一目的关系。
- source_word: μετ’ αὐτοῦ
  choice: 与他一同
  rationale: μετά接属格通常表示伴随；译文保留共同参与之意，不将其解释为“为他”。
- source_word: τὴν πόλιν
  choice: 这城
  rationale: πόλις在此指耶路撒冷城；“这城”承接前文所提耶路撒冷，并保留原文所说的是城而非圣殿。
theological_decisions:
- issue: 建造工程的对象
  choice: 这城
  alternative: 圣殿
  rationale: 原文明确使用τὴν πόλιν（“这城”），虽黎巴嫩香柏木在圣经语境中可能使人联想到建殿，译文仍不把原文协调或限定为圣殿。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“叙利亚谷地”作为历史地域名称处理；重复“长官”以明确“黎巴嫩的那些人”与前述官员同类，并使汉语指代清晰。
