  yaml_path: translation/deuterocanon/1_esdras/004/081.yaml
  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
translation:
  language: zh_hans
  text: 胜利和智慧都从你而来，荣耀也属于你；我是你的家仆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是你的仆人。”希腊语οἰκέτης特指家中的仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρά σοῦ
  choice: 从你而来
  rationale: παρά加属格在这里表示来源；重复结构共同支配“胜利”和“智慧”。
- source_word: νίκη
  choice: 胜利
  rationale: 直接表达获得胜利、得胜之意，符合颂赞语境。
- source_word: ἡ σοφία
  choice: 智慧
  rationale: σοφία的常规对应词，语境没有要求缩窄为“技巧”或“审慎”。
- source_word: σὴ ἡ δόξα
  choice: 荣耀也属于你
  rationale: 保留所有关系和强调意味，同时以自然现代汉语表达。
- source_word: οἰκέτης
  choice: 家仆
  rationale: 该词特指家中的仆役；“家仆”既保留其范围，又比单称“仆人”更准确。
theological_decisions:
- issue: 第二人称“你”的所指
  choice: 保留直接称呼，不在译文中指明“你”是谁
  alternative: 明确译作对上帝或对君王的称呼
  rationale: 本句希腊文本仅使用第二人称代词，没有明说所指；译文不替原文消除这种开放性。
- issue: οἰκέτης所表达的身份
  choice: 译为“家仆”，突出属于某一家庭并在其中服侍
  alternative: 译为“仆人”或“奴仆”
  rationale: 原词比一般“仆人”更具体，但本句本身并未要求将其法律身份强化为“奴隶”；“家仆”较好地保留词义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句合并重复的来源结构，以“都从你而来”保持流畅；分号保留颂赞与自我陈述之间的节奏。
