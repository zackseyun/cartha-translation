- source_word: ὁ εἷς
  choice: 一个人
  rationale: 字面为“那一个”，在竞赛参与者中指其中一人；译作“一个人”自然地保留不定、分指的语气。
- source_word: ἔγραψεν
  choice: 写道
  rationale: γράϕω 的简单过去时形式，在叙事中直接表示“写”；“写道”也自然引出所写内容。
- source_word: Ὑπερισχύει
  choice: 更强
  rationale: 该动词表示力量上占优势或胜过；上下文讨论何者最强，译作“更强”可保持比较意味，而不擅自补出比较对象或改成最高级。
- source_word: ὁ οἶνος
  choice: 酒
  rationale: 定冠词在此用于泛指酒这一事物；现代汉语通常不另译冠词。
