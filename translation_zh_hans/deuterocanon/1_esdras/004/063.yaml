  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
translation:
  language: zh_hans
  text: 上去重建耶路撒冷和他的名被称在其上的圣殿[a]；他们伴着音乐和喜乐，欢庆了[b]七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承载他名的圣殿。”
    reason: lexical_alternative
  - marker: b
    text: 这里的动词很罕见，也可理解为“举行节庆”或“庆贺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: 上去
  rationale: 保留“上到耶路撒冷去”的圣经地理习语，不将其窄化为单纯的“返回”。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 动词本义可作“建造”，但上下文涉及毁坏后的恢复，因此译作“重建”更准确自然。
- source_word: ἱερὸν
  choice: 圣殿
  rationale: 此处指耶路撒冷的圣殿建筑群；“圣殿”是现代汉语圣经语境中自然且庄重的对应词。
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: 那座称为他名下的圣殿
  rationale: 保留原文闪语式的“名被称在其上”表达所传达的归属与关联，同时使汉语可读；较顺畅的意译列入脚注。
- source_word: ἐκωθωνίζοντο
  choice: 庆祝
  rationale: 这是罕见动词，表示节庆性的欢乐活动；“庆祝”不加入“狂欢”等可能带有的负面色彩，其词义不确定性以脚注说明。
- source_word: μετὰ μουσικῶν
  choice: 伴着乐声
  rationale: 原词可泛指音乐、乐师或乐器；“伴着乐声”保持概括性，不作过度限定。
- source_word: χαρᾶς
  choice: 欢欢喜喜地
  rationale: 以自然汉语表达“喜乐”的伴随状态，并与节庆语境相合。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 置于动词及完成体标记“了”之后，自然表达持续时间。
theological_decisions:
- issue: 圣殿所用的神圣之名公式
  choice: 称为他名下的圣殿
  alternative: 承载他名的圣殿；他的名被称在其上的圣殿
  rationale: 原文使用圣经中表示上帝之名与圣殿相联、圣殿归属于他的固定表达。译文保留这一公式的张力，不把它解释成上帝实际居住于建筑之内，也不只译成一般性的命名。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“称为他名下”有意保留原文的圣经式命名公式；其较自然的表达放入脚注。分号保留原文从重建许可转入七日庆典的结构。
