  text: and taking the crown from the king’s head and putting it on herself[a]; and she struck the king with her left hand.
translation:
  language: zh_hans
  text: 她从王的头上摘下王冠，戴在自己头上；又用左手打国王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用左手掌掴国王。”希腊语动词可指掌掴，也可泛指击打。
    reason: 保留ἐράπιζεν在具体击打方式上的词义幅度。
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: 摘下
  rationale: 该分词表示把王冠从王头上取走；“摘下”符合汉语对头饰的自然表达，也保留移除之意。
- source_word: διάδημα
  choice: 王冠
  rationale: 此词指君王所戴的冠冕；“王冠”现代、清楚，并明确保留其王权含义。
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: 戴在自己头上
  rationale: 上下文表明αὐτῇ具有反身意义，即女子把从王头上摘下的王冠戴到自己头上；补出“头上”使汉语自然清楚。
- source_word: ἐράπιζεν
  choice: 打
  rationale: 该动词表示用手击打，常可特指掌掴；正文用较宽泛的“打”保留动作而不把具体方式定死，另一可能收入脚注。
- source_word: τῇ ἀριστερᾷ
  choice: 用左手
  rationale: 工具格表达以左手实施动作；汉语补出“手”自然且准确。
