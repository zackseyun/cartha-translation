lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: 诸位
  rationale: 这是对在场众人的直接呼语；现代汉语用“诸位”自然庄重，也避免把本句误读为泛指所有男性的命题。
- source_word: πῶς οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: 你们看，女人……怎会不强大呢
  rationale: 保留希腊文反问语气及“女人”为主语；补入“你们看”承接呼语，使现代汉语反问自然，但不改变命题内容。
- source_word: ὅτι
  choice: 既
  rationale: 此处引出支持前述判断的理由，采用因果性的“既……”，对应“因为／既然”，不按结果义处理。
- source_word: οὕτως πράσσουσιν
  choice: 能做出这样的事
  rationale: οὕτως回指上文所述行为；πράσσουσιν用概括性的“做出这样的事”表达，并以“能”贴合本句关于力量或能力的论证语境。
