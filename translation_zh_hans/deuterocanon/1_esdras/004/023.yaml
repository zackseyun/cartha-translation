  yaml_path: translation/deuterocanon/1_esdras/004/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act thus? And he fell silent after speaking in this way.
translation:
  language: zh_hans
  text: “诸位，酒岂不是更强吗？因为它迫使人这样行事。”他说完这话，就不再作声了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: 诸位
  rationale: 这是对在场众人的阳性复数呼语；“诸位”在现代汉语中自然庄重，又不必生硬地译成“男人们”。
- source_word: οὐχ ὑπερισχύει ὁ οἶνος
  choice: 酒岂不是更强吗
  rationale: ὑπερισχύει表示力量更强、占优势；“岂不是……吗”保留原文期待肯定回答的反问语气。原文未明说比较对象，因此译文也不补出“胜过一切”等对象。
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: 因为它能迫使人这样行事
  rationale: ἀναγκάζει强调强迫、驱使；ποιεῖν没有明说宾语，汉语补入泛指的“人”以使句子完整。“这样行事”承接上文所列酒所造成的行为。
- source_word: καὶ ἐσίγησεν
  choice: 就不再作声了
  rationale: ἐσίγησεν是不定过去时，表示说话者随即停止发言；此译法符合汉语叙事习惯。
- source_word: οὕτως εἴπας
  choice: 他说完这话
  rationale: 该分词结构表示说了上述话之后；“说完这话”简洁自然，并清楚标示先后关系。
