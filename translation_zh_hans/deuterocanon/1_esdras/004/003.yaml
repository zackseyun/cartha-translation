  yaml_path: translation/deuterocanon/1_esdras/004/003.yaml
  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
translation:
  language: zh_hans
  text: 他们吃了，喝了；吃饱喝足后便离去了。大流士王却进了卧房，睡了，后来醒来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: 吃了
  rationale: 这是ἐσθίω的简单过去叙事形式，直指进食；“吃了”自然、简洁。
- source_word: ἐπίοσαν
  choice: 喝了
  rationale: 这是πίνω的简单过去叙事形式；与“吃了”并列，保留原文两个动作的节奏。
- source_word: ἐμπλησθέντες
  choice: 饱足
  rationale: 该分词表示吃喝之后已经饱满、满足；“饱足”既保留“充满”的意象，也适合庄重的现代叙事。
- source_word: ἀνέλυσαν
  choice: 离去了
  rationale: 此处指宴饮结束后离开或散去；“离去了”不额外指定他们是各自散开还是一同退出。
- source_word: ἀνέλυσεν
  choice: 回到
  rationale: 同一动词用于大流士时，后接“到寝宫”，语境表示退席前往或返回寝宫；汉语用“回到”较自然，但不强化具体路线。
- source_word: κοιτῶνα
  choice: 寝宫
  rationale: κοιτών指睡眠用的内室；在王室语境中，“寝宫”比“卧室”更符合身份和叙事语体。
- source_word: ἐκοιμήθη
  choice: 睡了一觉
  rationale: 动词表示睡眠；“睡了一觉”与后文醒来衔接自然，并保持完整的先后过程。
- source_word: ἔξυπνος ἐγένετο
  choice: 随后醒来
  rationale: 希腊语字面为“成为醒着的”；现代汉语以“醒来”自然表达状态转变，“随后”呈现叙事次序。
