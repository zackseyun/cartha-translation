  to: 他们吃了，喝了；吃饱喝足后便离去了。大流士王却进了卧房，睡了，后来醒来。
  rationale: 修订移除“回到”所添加的返回含义，以“进了卧房”对应εἰς τὸν κοιτῶνα的方向和κοιτών的睡眠内室含义；将“睡了一觉”简化为“睡了”，保持原文简洁的叙述。主文采用自然的“吃饱喝足后”，脚注保留较贴近希腊语“被充满/饱足”意象的替代译法，并避免不必要地将吃喝界定为宴饮。
