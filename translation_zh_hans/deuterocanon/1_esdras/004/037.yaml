base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: zh_hans
  text: 酒是不义的，君王是不义的，女人是不义的，所有世人[a]和他们一切的作为都是不义的；这一切都是如此。其中没有真理；这一切必在不义中灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“所有人的众子”，是以男性形式泛指全人类的习语。
    reason: 说明原文男性形式的字面表达及其泛指意义。
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: 不义的
  rationale: 以同一措辞反复译出原文的修辞主线；“不义”既可形容酒、君王、女人、世人和作为，也能与后文“真理”形成道德上的对照，而不额外限定为司法意义的“不公正”。
- source_word: οἶνος
  choice: 酒
  rationale: 直接、自然地对应原文，语境无须特指某一类酒。
- source_word: ὁ βασιλεύς
  choice: 君王
  rationale: 保留定冠词所支持的特指或典型化表达；“君王”符合庄重的经文语体。
- source_word: αἱ γυναῖκες
  choice: 女人
  rationale: 按通常词义译为“女人”，不擅自收窄为“妻子”。
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: 所有世人[a]
  rationale: 这是闪语色彩浓厚的男性形式泛指全人类；正文采用现代汉语自然表达，脚注保留字面形态。
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: 他们的一切作为
  rationale: “作为”比“工作”更能涵盖人的行为及所做之事，并保留 πάντα 的周遍性。
- source_word: πάντα τὰ τοιαῦτα
  choice: 这一切诸如此类的事
  rationale: 保留总结并推广前述清单的作用，不把所指范围过度具体化。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 直接译出原文，并保留它与“不义”之间宽广的道德张力；不缩窄为仅指“诚实”。
- source_word: ἀπολοῦνται
  choice: 必……灭亡
  rationale: 准确表达将来结果，同时不强加外在施动者，保留中间／被动形式在此处的开放性。
theological_decisions:
- issue: 带男性字面的泛指人类表达
  choice: 正文译“所有世人”，并以脚注说明字面为“所有人的众子”
  alternative: 所有人的众子
  rationale: 现代汉语若直译会生硬且易被误解为仅指男性后代；正文传达泛指全人类的语义，脚注则保存原文明确的男性习语形式。
- issue: 反复出现的 ἄδικος 系列词
  choice: 始终译作“不义的／不义”
  alternative: 不公正的；邪恶的；虚假的
  rationale: 统一译法保留原文强烈的排比和重复，也避免把宽泛的道德判断收窄为司法不公、一般邪恶或虚假。
- issue: 末句复数代词的指向
  choice: 译作“这一切”，保留对前述整体的概括
  alternative: 他们；它们
  rationale: 原文 αὐτοῖς／αὐτῶν 可回指前述复数整体；汉语若用“他们”或“它们”都会过早限定其指向。“这一切”既可涵盖人和事物，也保留原句概括性的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以重复的“是不义的”保留原文排比；末句用“这一切”避免在混合的人与事物之间强行选择人称代词。
