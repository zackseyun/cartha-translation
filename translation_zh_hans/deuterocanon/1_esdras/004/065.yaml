  yaml_path: translation/deuterocanon/1_esdras/004/065.yaml
  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: zh_hans
  text: 于是，他对王说：“请记得我所许的愿：在你承受王权的那一天重建耶路撒冷。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请记得我所作的祷告：在你承受王权的那一天重建耶路撒冷。”希腊文εὐχή／ηὐξάμην既可指许愿，也可指祷告；这里的上下文较支持许愿的意思。
    reason: 保留原文名词与动词在“许愿”和“祷告”之间的真实词义歧义。
lexical_decisions:
- source_word: Μνήσθητι
  choice: 请记得
  rationale: 这是直接向王发出的不定过去时命令语气；“请记得”既自然，也符合向君王陈情的语境。
- source_word: τὴν εὐχὴν ἣν ηὐξάμην
  choice: 我所许的愿……我许愿
  rationale: εὐχή与εὔχομαι的组合既可涉及许愿，也可涉及祷告；此处不定式说明具体承诺的行动，正文采用“许愿”，并以脚注保留“祷告”的可能。中文适度重复“愿／许愿”，可清楚反映原文名词与动词的呼应。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 该词本义为“建造”，但对象是遭毁后的耶路撒冷，叙事语境明确指恢复建造，因此译作“重建”。
- source_word: παρέλαβες
  choice: 承受
  rationale: 这里指取得或接掌王权；“承受”可表达领受王位，避免暗示武力夺取。
- source_word: τὸ βασίλειόν σου
  choice: 王位
  rationale: βασίλειον在此可指王国、王权或君王地位。结合登基之日的语境，“王位”比字面的“你的王国”更符合现代汉语，同时保留接掌统治权的含义。
theological_decisions:
- issue: εὐχή／ηὐξάμην的含义
  choice: 正文理解为说话者所作的许愿
  alternative: 理解为说话者所作的祷告
  rationale: 该名词与动词既可用于许愿，也可用于祷告。因其内容是“重建耶路撒冷”这一具体行动，许愿义在本语境中较合适；但原文的祷告义不能排除，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“承受王位”体现登基语境；“请记得”保持对君王陈情时应有的礼貌。脚注标记置于相关引文句末。
