lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为叙事中的时间承接语，自然地引出接下来的行动。
- source_word: οἱ τρεῖς νεανίσκοι
  choice: 三个年轻人
  rationale: νεανίσκοι指年轻男子；“年轻人”符合现代汉语，也保留了年龄含义。
- source_word: οἱ σωματοφύλακες
  choice: 侍卫
  rationale: 该词指负责护卫人身安全的卫士；结合王宫语境，“侍卫”比直译“身体护卫”自然。
- source_word: οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως
  choice: 守护王本人
  rationale: 分词表达持续承担的职责；σῶμα字面为“身体”，此处在宫廷护卫语境中指王本人。
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: 彼此说道
  rationale: 保留原文的相互表达，并以简洁自然的现代汉语呈现。
