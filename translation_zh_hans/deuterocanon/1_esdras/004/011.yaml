lexical_decisions:
- source_word: ὁ ἕτερος
  choice: 另一个人
  rationale: 带冠词的ἕτερος指参与者中的另一位，即序列中的第二人；“另一个人”符合现代汉语叙事，也不作超出原文的编号限定。
- source_word: ἔγραψεν
  choice: 写道
  rationale: γρά­φω的不定过去时在此陈述连续发生的动作；“写道”自然引出所写内容，且不擅自限定书写载体或方式。
- source_word: Ὑπερισχύει
  choice: 更强
  rationale: ὑπερισχύω可指较强、占优势或胜过；在这句简短的比较性宣言中，“更强”直接保留其力量与优势的语义，也避免把未完成体武断译成某次已经取胜。
- source_word: ὁ βασιλεύς
  choice: 君王
  rationale: βασιλεύς明确指王；“君王”在现代中文中庄重而易懂，并适合此处竞辩命题的措辞。
