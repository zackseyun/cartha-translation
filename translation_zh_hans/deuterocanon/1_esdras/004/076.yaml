  text: He also wrote out the provision and the priestly robe[a]—specifying in what they are to minister in it.
translation:
  language: zh_hans
  text: 他也写下了供给和祭司礼服[a]，注明他们要在其中以什么方式事奉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他也写下了供给和祭司礼服，注明他们要在其中凭什么事奉。”希腊原文在“在什么／以什么……在其中”的表达上十分压缩；“其中”最自然地指祭司礼服，但两个介词短语之间的确切关系不完全明确。
    reason: 保留 χορηγία 和 ἱερατικὴ στολή 的宽泛词义，并说明 ἐν τίνι…ἐν αὐτῇ 的压缩句法及其未决关系，避免将其误解为“穿什么礼服”。
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写了下来
  rationale: 表示正式记录成文，既保留 γράφω 的基本意义，也符合行政文书语境。
- source_word: χορηγίαν
  choice: 供给
  rationale: χορηγία 指为特定用途提供的物资或经费；“供给”保持宽泛，不限定为金钱。
- source_word: ἱερατικὴν στολήν
  choice: 祭司的礼服
  rationale: στολή 指袍服或正式服装；“礼服”自然体现祭司职务场合，又避免套用现代教会术语。
- source_word: ἐν τίνι
  choice: 注明他们要穿什么礼服
  rationale: 希腊语表达压缩；结合服装语境，以现代汉语补出“注明”和“礼服”，使句意可懂，但不进一步限定具体服饰。
- source_word: λατρεύσουσιν
  choice: 事奉
  rationale: λατρεύω 在圣殿语境中指宗教礼仪性的服事；“事奉”兼顾敬拜和祭司职务含义。
- source_word: ἐν αὐτῇ
  choice: 穿……礼服事奉
  rationale: 阴性代词最自然地回指 στολή；汉语用“穿……礼服事奉”表达身着该服装履职，避免生硬直译“在它里面”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供给”不把支持方式窄化为经费；“祭司的礼服”比“祭服”略具解释性，但更便于普通读者理解。正文适度展开压缩句法，脚注保留原文的生硬和歧义。
