base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: zh_hans
  text: “我主，我王啊，如今这就是我所求的、我向你请求的；这就是出于你的宽宏。因此，我恳求你成全我向天上的王所许的愿：愿这事由你亲口下令办成。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“从你口中办成”。这里指借君王亲口所发的命令或谕令使这事成就。
    reason: 说明希腊语 ἐκ στόματός σου 的字面意象及其在君王诏令语境中的含义，避免误解为君王履行自己先前所说的话。
lexical_decisions:
- source_word: ἀξιῶ
  choice: 我所求的
  rationale: 此处是宫廷请愿语境，表示提出请求，而不是主张权利；与后面的 αἰτοῦμαί 构成近义复沓。
- source_word: κύριε βασιλεῦ
  choice: 王啊，我主
  rationale: 保留对人间君王的双重尊称和呼格语气，同时避免与后文神的称号混淆。
- source_word: αἰτοῦμαί σε
  choice: 我向你请求的
  rationale: 与前面的“我所求的”略作区分，保留原文两个请愿动词的修辞重复。
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: 你所施的厚恩
  rationale: μεγαλωσύνη 本义涉及伟大、尊荣或宽宏；在此请愿语境中指君王所显的宽宏厚意。“厚恩”使现代汉语自然，同时不把它具体化为某项赏赐。
- source_word: δέομαι
  choice: 我恳求你
  rationale: 表现该动词比前两个请愿动词更强烈、更谦卑的恳求语气。
- source_word: ποιήσῃς τὴν εὐχήν
  choice: 履行……许下的愿
  rationale: εὐχή 可指祷告或誓愿；与同源动词 ηὔξω 连用时，以“许愿、还愿”的含义更合适。
- source_word: ἣν ηὔξω
  choice: 你曾……许下的愿
  rationale: ηὔξω 是第二人称单数，明确指君王“你”所许的愿；据此纠正咨询层将其读作“I vowed”的错配。
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 向天上的王
  rationale: 直译神的称号，并保留它与本节受称呼的人间君王之间的对照。
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: 照你亲口所说的把它办成
  rationale: 原文直译近于“从你口中做成”，指君王以亲口所发的话或命令使所许之愿实现；正文采用自然汉语，脚注交代原有意象。
theological_decisions:
- issue: “天上的王”所指
  choice: 作为神的称号，与本节受称呼的人间君王相区别
  alternative: 将其泛化为“天上的君王”或与人间君王的称号合并
  rationale: 原文刻意并置人间的 βασιλεύς 与“天上的王”；译文保留两者，不额外加入宗派性解释。
- issue: 许愿者的人称
  choice: 君王“你”曾许愿
  alternative: 说话者“我”曾许愿
  rationale: 希腊文 ηὔξω 为第二人称单数，故许愿者是受话的君王；这项语法证据优先于存在重大错配的英文咨询层。
- issue: εὐχή 的含义
  choice: 愿、誓愿
  alternative: 祷告
  rationale: 同源动词“许下”及“履行”的语境支持誓愿义，但不进一步说明誓愿的神学性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“王啊，我主”呈现宫廷敬语，以“恳求”“履行”“许下的愿”维持请愿场景的正式语体；没有沿用英文咨询层在人称上的误读。
