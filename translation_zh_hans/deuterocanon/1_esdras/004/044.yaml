  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: zh_hans
  text: 并要把从耶路撒冷取走的一切器皿送回去[a]，就是居鲁士在起誓要毁灭巴比伦、又起誓要把它们送到那里[b]时所分别出来的那些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “送回去”按上下文译出方向；希腊文ἐκπέμψαι字面是“送出、遣送”。
    reason: lexical_alternative
  - marker: b
    text: “那里”很可能指耶路撒冷；原文只作简略指称。希腊文把居鲁士“分别出来”这些器皿的动作与两次“起誓”的分句紧缩在一起，句法略显生硬。
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: 器皿
  rationale: 在圣殿语境中指器具、用具；“器皿”既符合敬拜场景，也不过度具体化。
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: 从耶路撒冷取走的
  rationale: 被动分词表示这些器皿先前被人从耶路撒冷带走；“取走”自然且不额外断定其具体方式。
- source_word: ἐκπέμψαι
  choice: 送回去
  rationale: 该词本义为“送出”；结合器皿由耶路撒冷被取走、如今要送往那里的语境，“送回去”清楚表达恢复原处的方向。
- source_word: ἐχώρισεν
  choice: 分别存放
  rationale: 基本义为“分开、分别出来”；“分别存放”能自然表示居鲁士把这些器皿另行留置，又不把动作过度解释为正式指定。
- source_word: ηὔξατο
  choice: 起誓
  rationale: 此词通常可指祈求或许愿；与不定式连用并重复出现时，表示郑重承诺。“起誓”保留原文不寻常而庄重的措辞。
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: 毁灭巴比伦
  rationale: ἐκκόπτω字面为“砍掉、剪除”；以巴比伦为宾语时，“毁灭”是现代汉语中自然且能传达其破坏性含义的表达。
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: 把它们送到那里
  rationale: 原文省略宾语，按语境补出“它们”指器皿；“那里”保留希腊文简略的地点指称。
theological_decisions:
- issue: ηὔξατο所表达的是许愿、起誓，还是决意
  choice: 起誓
  alternative: 决意
  rationale: 本节难点主要是词义和句法，不涉及重大教义争议。“起誓”较直接保留希腊文的郑重承诺色彩，而脚注说明也承认原句重复且生硬，避免静默抹平张力。
- issue: “那里”的所指
  choice: 正文保留“那里”
  alternative: 明确译作“耶路撒冷”
  rationale: 语境很可能指耶路撒冷，但希腊文只写ἐκεῖ。正文保留其简略和潜在歧义，脚注交代最可能的所指。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号和分句缓解希腊文压缩句法，同时保留两次“起誓”以及“那里”的简略表达；不按后期历史叙述加以协调或补充。
