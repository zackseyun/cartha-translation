  yaml_path: translation/deuterocanon/1_esdras/004/053.yaml
  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: zh_hans
  text: 凡从巴比伦尼亚上去建造那城的人，他们和他们的儿女，以及所有上去的祭司，都应享有自由[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由”在这项王令的语境中，可能包括法律上的特权，或免除某些义务；但希腊文没有具体说明其范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: 上去
  rationale: 在被掳者归回并前往耶路撒冷的语境中，“上去”既符合希腊文，也保留了前往耶路撒冷的地理和宗教表达习惯。
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: 从巴比伦尼亚
  rationale: Βαβυλωνία指巴比伦尼亚地区，而不只是巴比伦城，因此按地区名称直译。
- source_word: κτίσαι τὴν πόλιν
  choice: 建造那城
  rationale: κτίζω可指建立或建造；虽然语境涉及复建，原文没有明确使用“重建”，故不加以限定。定冠词译作“那城”，自然指向上下文已知的城。
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: 应享有自由
  rationale: 不定式结构属于王令内容，表达所授予的权利；“应享有”在现代汉语中自然体现法令效力。
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: 该词宽泛表示自由；在行政语境中可能包括法律特权或义务豁免，但原文未规定具体范围，因此正文保留宽泛措辞，并以脚注说明。
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: 他们和他们的儿女
  rationale: τέκνα最直接指“儿女”；不扩大译为范围更广的“后代”。
- source_word: πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: 所有上去的祭司
  rationale: 保留原文再次使用“上去”的表达，并清楚表明这项授予也适用于祭司。
