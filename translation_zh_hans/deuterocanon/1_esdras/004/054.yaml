translation:
  language: zh_hans
  text: 他也写明了供给和祭司的礼服；他们穿着这礼服事奉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处句法拗口，直译近似：“供给和祭司的礼服；他们在何物（或某物）中、在它里面事奉。”后一个阴性代词很可能指“礼服”；前一个词的形式却使指代不明。此句可能保存了压缩或不稳定的文本形式。
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: 写明了
  rationale: γράϕω在此指将有关事项写下；结合诏令语境，“写明”比单纯“写了”更自然，但不额外限定为颁布命令。
- source_word: χορηγίαν
  choice: 供给
  rationale: χορηγία表示为特定用途提供的供应或资助；“供给”保留其广义，不具体化为俸禄、口粮或津贴。
- source_word: ἱερατικὴν στολήν
  choice: 祭司的礼服
  rationale: στολή为袍服或正式服装；“礼服”既保留单数，也符合祭司礼仪服装的语境。
- source_word: ἐν τίνι
  choice: 穿着这礼服
  rationale: 字面为“在其中”。其先行词最可能是阴性名词στολή；汉语以“穿着”自然表达人在衣服之中的含义。
- source_word: λατρεύουσιν
  choice: 事奉
  rationale: λατρεύω在圣殿和祭司语境中指礼仪性的服事；“事奉”兼具服事与敬拜色彩，而不将其缩窄为一般服务。
- source_word: ἐν αὐτῇ
  choice: 这礼服
  rationale: 阴性代词最自然地回指στολή。原文与ἐν τίνι形成重复；正文用明确名词呈现可能的指代，并以脚注保留其句法异常。
theological_decisions:
- issue: 祭司礼仪服事的术语
  choice: 将λατρεύουσιν译为“事奉”
  alternative: “敬拜”或“服事”
  rationale: 本节涉及祭司服装和圣殿职分，“事奉”最能涵盖礼仪性的侍奉而不加入特定宗派解释。
- issue: 两个介词短语的关系
  choice: 正文理解二者都回指祭司礼服，并作自然汉语表达
  alternative: 逐字译作“他们在其中在它里面事奉”
  rationale: 希腊文ἐν τίνι…ἐν αὐτῇ重复而拗口，可能是压缩或不稳定的文本形式。正文不制造难懂的汉语重复，脚注则明确说明原文形态和不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“写明了”贴合行政文书语境；“供给”“祭司的礼服”“事奉”保持礼仪背景。正文适度理顺希腊文的重复句法，同时以[a]脚注完整披露原文的拗口与歧义。
