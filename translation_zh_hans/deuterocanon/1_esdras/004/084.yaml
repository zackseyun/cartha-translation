  yaml_path: translation/deuterocanon/1_esdras/004/084.yaml
  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: zh_hans
  text: 他们颂赞他们列祖的上帝，因为他赐给了他们安舒和自由[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安息和释放。”这两个希腊词可指困苦得到缓解以及获释、得自由。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  choice: 颂赞
  rationale: 上帝作宾语时，此词在圣经语境中表示称颂、赞美；“颂赞”既保留庄重语体，也比现代汉语中的“祝福上帝”自然。
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: 他们列祖的上帝
  rationale: 保留圣经中连接当代群体与祖先信仰传统的固定表达；“列祖”简洁、庄重且易于理解。
- source_word: ἔδωκεν
  choice: 赐给了
  rationale: 动词是简单过去时，表示上帝已经给予的恩惠；“赐给”符合以上帝为施予者的中文圣经语体，而“了”自然交代其完成性。
- source_word: ἄνεσιν
  choice: 安舒
  rationale: 此词指压力或困苦得到缓解，也可表示安息、宽舒；“安舒”能同时传达困境缓解和获得喘息的意味。
- source_word: ἄφεσιν
  choice: 自由
  rationale: 在此历史性解救语境中，此词宜理解为获释、得自由，而不是罪得赦免；“自由”与“安舒”并列自然，并突出脱离辖制的结果。
theological_decisions:
- issue: 非礼仪性历史语境中ἄφεσιν的含义
  choice: 自由
  alternative: 释放；赦免
  rationale: ἄφεσις虽可表示赦免，但本句谈的是上帝使群体脱离困厄，并未明确涉及罪的赦免。译作“自由”避免引入经文未陈明的赎罪含义，同时保留解放、获释的意思。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颂赞”“列祖的上帝”保留圣经语体；“安舒和自由”在自然汉语中重现两个近义而有区别的希腊名词，并以脚注保留“安息”“释放”等可能译法。
