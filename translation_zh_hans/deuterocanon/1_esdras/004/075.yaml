base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: zh_hans
  text: 凡从巴比伦尼亚[a]上来建造这城的人，他们和他们的儿女，以及所有上来的祭司，都应享有自由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴比伦尼亚”指巴比伦地区；希腊文用的是地区名称，而不是巴比伦城的名称。
    reason: lexical_alternative
  - marker: b
    text: “自由”也可译作“豁免权”；希腊文直译为“自由归他们所有”，但这里没有说明这项自由具体包括哪些权利或豁免。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: 所有……上来……的人
  rationale: πᾶσιν与分词连用，表示“所有……的人”；在从流亡地返回耶路撒冷的语境中，“上来”既自然，也保留了前往耶路撒冷的地理与经文惯用表达。
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: 从巴比伦尼亚
  rationale: 希腊文Βαβυλωνία指巴比伦地区，而不是专指巴比伦城；译作“巴比伦尼亚”较为准确。
- source_word: κτίσαι τὴν πόλιν
  choice: 建造这城
  rationale: κτίζω可指建立、建造；虽按历史背景可理解为“重建”，原文在此并未明说“重新”，故不增添这一层解释。定冠词按中文语境译为“这城”。
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: 应享有自由
  rationale: 不定式结构表达诏令的内容，即自由应归这些人所有。“应享有自由”既传达这种授予关系，也符合现代汉语表达。
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: ἐλευθερία通常表示自由或自主；在帝国诏令中可能包含某种法定豁免，但本节没有界定具体范围，因此采用含义较宽的“自由”。
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: 他们和他们的儿女
  rationale: 两个与格成分都是获授自由的对象；τέκνα自然译作不限定性别的“儿女”。
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: 所有上来的祭司也都应享有自由
  rationale: 末句把同一项自由授予所有上来的祭司。中文补出前文的谓语“应享有自由”，使所指清楚，同时保留“上来”的重复。
theological_decisions:
- issue: 所授予的ἐλευθερία具体指什么
  choice: 宽泛译作“自由”，不限定其具体法律内容
  alternative: 译作“豁免权”，或明确解释为免税、免役等公民特权
  rationale: 本节只说授予ἐλευθερία，并未说明其行政或法律范围。采用“自由”可保留原文的开放性，避免把某一种技术性含义写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上来”保留返回耶路撒冷的经文地理表达；分号呈现诏令中受益对象的两组结构。为避免中文末句悬空，重复“应享有自由”，但没有增加新的内容。
