  yaml_path: translation/deuterocanon/1_esdras/004/038.yaml
  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: zh_hans
  text: 真理永远长存，并且强盛；它永远活着，永永远远得胜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 以现代汉语自然表达带冠词的抽象名词，并保留它在本句中被凸显、拟人化的地位。
- source_word: μένει
  choice: 长存
  rationale: 表达持续存在、恒久不变之意；比“停留”更符合此处永恒性的语境。
- source_word: ἰσχύει
  choice: 强盛
  rationale: 突出真理本身具有力量，同时与后面的 κρατεῖ 区分，避免将两个动词都译成“得胜”。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该希腊语时间短语在现代汉语中的自然对应。
- source_word: ζῇ
  choice: 活着
  rationale: 直接保留原文把真理描写为有生命的鲜明拟人手法。
- source_word: κρατεῖ
  choice: 掌权
  rationale: 表达 κρατέω 在此处所含的占优势、施行权能之意，并与 ἰσχύει 的“强盛”保持词义层次。
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: 直到永永远远
  rationale: 以庄重而通行的汉语表达原文强化的永恒时间公式，并呈现句末递进。
theological_decisions:
- issue: 真理的拟人化
  choice: 保留“活着”和“掌权”等人格化谓语
  alternative: 弱化为抽象表述，如“真理恒久而有力量”
  rationale: 原文明确以 ζῇ 和 κρατεῖ 描写真理；保留拟人修辞最忠实于文本，同时不进一步把“真理”认定为某一特定神学位格。
- issue: κρατεῖ 的语义力度
  choice: 译为“掌权”
  alternative: 译为“得胜”或“占优势”
  rationale: “掌权”保留主动支配的力度，也维持与前文“强盛”的区别；但不添加其掌权对象，以免补足原文没有明说的内容。
translation_notes:
  register: 采用现代、庄重、便于朗读的标准普通话。分号呈现两个并列而递进的分句；第二句以“它”承接“真理”，使拟人关系在汉语中清楚自然。
