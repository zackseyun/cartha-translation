  yaml_path: translation/deuterocanon/1_esdras/004/066.yaml
  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
translation:
  language: zh_hans
  text: 也要把从耶路撒冷取走的一切器皿送回那里[c]。这些器皿是居鲁士在立誓[b]铲除巴比伦[a]时划分出来的；他也立誓要把它们送到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铲除”直译可作“砍除”或“剪除”，也可译为“消灭”。
    reason: lexical_alternative
  - marker: b
    text: “立誓”也可译作“祈求”。本节该词出现两次。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“送到那里”；“回”是根据这些器皿先前从耶路撒冷被取走的上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: 器皿
  rationale: 在圣殿语境中指礼仪器具或圣殿用品；“器皿”是庄重而通行的译法，又不作过度限定。
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: 从耶路撒冷掳走的
  rationale: 分词表示这些器皿曾被人从耶路撒冷取走；结合圣殿遭劫的语境，“掳走”比中性的“拿走”更准确。
- source_word: ἐκπέμψαι
  choice: 送回
  rationale: 该词本义为“送出、遣送”；器皿原从耶路撒冷被掳走，因此上下文蕴含归还之意。译文补出“回”，并以脚注说明原文未明说。
- source_word: ἃ ἐχώρισεν
  choice: 分别出来
  rationale: χωρίζω表示分开或划出；“分别出来”保留了居鲁士将这些器皿另行划定的含义，不强加具体行政或宗教用途。
- source_word: ηὔξατο
  choice: 立誓
  rationale: 该动词可指许愿或祈祷；后接不定式时，“立誓”较自然地表达郑重承诺，同时在脚注保留“祈求”的可能。
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: 铲除巴比伦
  rationale: ἐκκόπτω字面含“砍除、剪除”，在此可表示消灭。“铲除”既自然表达毁灭之意，也保留原文的动作意象。
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: 送到那里
  rationale: 直译为“遣送到那里”；“送到那里”简洁自然，并保留ἐκεῖ所指地点须由语境确定的特点。
theological_decisions:
- issue: 居鲁士的ηὔξατο应理解为立誓还是祈求
  choice: 立誓
  alternative: 祈求
  rationale: 与后接不定式的结构相配时，可理解为许愿或郑重承诺；但“祈求”在词义上仍有可能，故不在正文中混同二义，而以脚注保留。
- issue: 是否明说器皿是“送回”耶路撒冷
  choice: 送回那里
  alternative: 送到那里
  rationale: 器皿先前从耶路撒冷被掳走，语境清楚指向归还；“回”使现代汉语通顺，但原文动词本身未明说返回，因此附注说明。
- issue: ἐκκόψαι Βαβυλῶνα的毁灭程度
  choice: 铲除巴比伦
  alternative: 砍除巴比伦／消灭巴比伦
  rationale: “铲除”兼顾现代汉语自然度与原文“砍除”的形象，不把该表述缩减为仅指政治征服，也不额外赋予神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“器皿”“立誓”符合经文语体；“铲除”保留希腊文的动作意象，同时避免生硬的“砍除巴比伦”。句子虽承接上文而带有命令内容，仍整理为完整自然的现代汉语句式。
