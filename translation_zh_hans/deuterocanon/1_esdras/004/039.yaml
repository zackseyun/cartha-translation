base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/039.yaml
  text: and with her there is no partiality or favoritism[a], but she does what is just rather than all that is unjust and wicked; and all approve of her works[b],
translation:
  language: zh_hans
  text: 在她那里，既不偏待人[a]，也不差别相待[b]；她行公正的事，远离一切不义和邪恶；众人都赞许她的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“接受面孔”，是指偏待人的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不作区别。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνειν πρόσωπα
  choice: 偏待人
  rationale: 这是字面为“接受面孔”的希腊语习语，指按人的身份或情面给予偏袒；译为“偏待人”既清楚自然，也保留判断语境。
- source_word: διάφορα
  choice: 差别相待
  rationale: 该词在此与“偏待人”并列，可指区别、差异或有所偏好；“差别相待”保留其与前一习语相近但不完全重合的含义。
- source_word: τὰ δίκαια
  choice: 公正的事
  rationale: 中性复数名词化结构指合乎公正之事；“公正的事”保留司法与伦理色彩。
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: 远离一切不义和邪恶
  rationale: ἀπό主要表达分离或远离。此译不把它过度确定为单纯比较性的“而不是”，并保留“不义和邪恶”可能泛指事物、行为或相关对象的宽度。
- source_word: εὐδοκοῦσι
  choice: 赞许
  rationale: 该动词可表示喜悦、满意或认可；以“她的作为”为宾语时，“赞许”自然地表达道德认可。
- source_word: αὐτὴν / αὐτῆς
  choice: 她／她的
  rationale: 前文所指的ἀλήθεια（真理）在希腊文中为阴性，并在本段被人格化；汉语用“她”保留这种修辞效果。
theological_decisions:
- issue: 真理的人格化
  choice: 用阴性人称“她”指真理
  alternative: 用中性代词“它”
  rationale: 原文以阴性代词延续对真理的人格化描写；保留“她”忠实呈现文学和神学张力，而不进一步将其等同于某一特定神学位格。
- issue: ἀπό所表达的关系
  choice: 译作“远离”，保留分离义
  alternative: 译作“胜过／而不是一切不义和邪恶”
  rationale: ἀπό通常标示来源、离开或分隔；此处句法较凝缩。“远离”比比较式译法更贴近其基本语义，同时不排除上下文中的对照意味。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。以分号呈现原句的递进结构；“偏待人／差别相待”保留两个相邻表达的并列强调，并将脚注[b]放在其实际对应的διάφορα之后。
