base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich.
translation:
  language: zh_hans
  text: 它使君王和孤儿心思相同[a]，也使奴隶和自由人、穷人和富人心思相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使君王和孤儿的心思成为一个”；也可译作“使君王和孤儿想法一样”。
    reason: 说明原文“心思成为一个”的表达，并提供较口语化的对应译法。
lexical_decisions:
- source_word: ποιεῖ
  choice: 使
  rationale: 表达该动词使某种状态产生的普通现在时含义，不额外说明其作用机制。
- source_word: τὴν διάνοιαν μίαν
  choice: 心思相同
  rationale: διάνοια可指心思、思想或意向；μίαν表示成为一或相同。译作“心思相同”符合现代汉语，同时保留不同社会身份者在思想状态上被拉平的含义。
- source_word: βασιλέως
  choice: 君王
  rationale: 该词通常指王；“君王”庄重自然，也不泛化为一般统治者。
- source_word: ὀρφανοῦ
  choice: 孤儿
  rationale: ὀρφανός通常指孤儿或丧父者；“孤儿”是现代汉语中最自然且范围适当的对应词。
- source_word: οἰκέτου
  choice: 奴隶
  rationale: οἰκέτης可指家仆或家奴；此处与ἐλευθέρου构成法律及社会身份上的鲜明对比，因此译作“奴隶”。
- source_word: ἐλευθέρου
  choice: 自由人
  rationale: 指与奴隶相对、具有自由身份的人；“自由人”清楚保留身份对举。
- source_word: πένητος
  choice: 穷人
  rationale: 指贫穷或生活拮据的人；“穷人”自然并与“富人”形成简洁对举。
- source_word: πλουσίου
  choice: 富人
  rationale: 该词指富有者；“富人”与“穷人”保持原文的平行修辞。
theological_decisions:
- issue: 本节以相反的社会身份成对排列，并说它使他们的心思成为一；经文本身没有解释这一作用的神学机制。
  choice: 直译各组身份对比，并以“心思相同”表达其共同状态。
  alternative: 译为“使他们同心”或加入使他们平等的解释。
  rationale: “心思相同”既传达διάνοια与μίαν的组合，又不把思想相同扩展成属灵合一、社会平等或其他原文未明说的教义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留三组社会身份的平行结构，并按所给经文保留中性代词“它”，不在本节中补出原文未明说的先行对象。
