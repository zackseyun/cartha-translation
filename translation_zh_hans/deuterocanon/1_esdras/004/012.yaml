  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: zh_hans
  text: 第三个人写道[a]：“女人占优势，但真理胜过一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第三个人写道：‘女人更有力量，但真理胜过一切。’”
    reason: “Ὑπερισχύουσιν”可表示占优势、胜过，也可强调力量更强。
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 第三个人
  rationale: 定冠词加序数词在此作名词使用，指比赛中的第三位参与者；译作“第三个人”自然，也不擅自补出“青年”等原文未明说的信息。
- source_word: ἔγραψεν
  choice: 写道
  rationale: 直接表达“写下”的动作，并自然引出其所写的论题。
- source_word: Ὑπερισχύουσιν
  choice: 更有力量
  rationale: 该动词表示力量上占优势或胜过；“更有力量”保留比较意味，同时适合格言式陈述。
- source_word: αἱ γυναῖκες
  choice: 女人
  rationale: γυναῖκες 可指女人或妻子；此处是概括性的论题，范围不限于已婚女性，因此译作“女人”。
- source_word: ὑπὲρ δὲ πάντα
  choice: 但……胜过一切
  rationale: ὑπέρ 与宾格表达超越、胜过；在汉语中与动词合译为“胜过一切”，比生硬的“在一切之上”更自然。
- source_word: νικᾷ
  choice: 胜过
  rationale: νικάω 有得胜、战胜之意；“胜过”既保留胜利意象，又能与比较对象“一切”自然搭配。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 此处将抽象的“真理”人格化为最终得胜者；汉语无需另加指示或限定成分。
theological_decisions:
- issue: 真理最终得胜的格言应如何表达
  choice: 真理胜过一切
  alternative: 真理在一切之上得胜
  rationale: 所选译法保留真理作为 νικᾷ 主语的得胜意象，也明确呈现 ὑπὲρ πάντα 的比较范围；不把“真理”具体化为某一宗派性教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“第三个人”明确其名词性用法；正文以简洁格言体呈现。
