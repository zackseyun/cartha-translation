  yaml_path: translation/deuterocanon/1_esdras/004/045.yaml
  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: zh_hans
  text: 你也曾许愿，要重建那座圣殿，就是当迦勒底人使犹大变为荒凉时犹大人所焚烧的那座。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“犹大人所焚烧的”。这是一个难解的读法，与较为人熟知的记载不同；后者说焚烧圣殿的是迦勒底人（巴比伦人）。
    reason: 说明原文将“犹大人”明列为焚烧圣殿者的困难读法，并提示其与常见历史记载的差异，避免误以为译文误置施事者。
lexical_decisions:
- source_word: εὔξω
  choice: 曾许愿
  rationale: 该词源自 εὔχομαι；这里支配表示行动的动词不定式 οἰκοδομῆσαι，语境所指是承担重建之事，因此译作“许愿”比“祈求”更合适。“曾”使现代汉语时态关系自然，但不额外界定具体时间。
- source_word: οἰκοδομῆσαι
  choice: 重建
  rationale: 该词本义可作“建造”；鉴于圣殿已经被焚毁，语境明确是恢复建造，译作“重建”自然且没有超出文意。
- source_word: ναόν
  choice: 圣殿
  rationale: 在耶路撒冷敬拜建筑的语境中，“圣殿”是现代汉语最通行且庄重的对应词。
- source_word: ἐνεπύρισαν
  choice: 焚烧
  rationale: 该动词表示放火烧或使之燃烧；“焚烧”准确传达动作，又不进一步断定整座建筑完全烧毁。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹大人
  rationale: 此处处于犹大地区的历史地理语境，“犹大人”保留 Ἰουδαῖοι 的地域—族群含义，也与后文“犹大”相呼应。
- source_word: ἐρημώθη
  choice: 被摧毁
  rationale: 该被动式表示荒废、毁坏。“被摧毁”是清楚自然的现代汉语表达，传达犹大遭到严重破坏；其施事者由 ὑπὸ τῶν Χαλδαίων 明示。
- source_word: Χαλδαίων
  choice: 迦勒底人
  rationale: 希腊文明确使用“迦勒底人”，故正文保留这一名称，不以相关但并非字面相同的“巴比伦人”替换。
theological_decisions:
- issue: 圣殿焚烧者被写作“犹大人”的困难历史表述
  choice: 照希腊文本保留“由犹大人焚烧”
  alternative: 译作“由迦勒底人焚烧”或“由巴比伦人焚烧”
  rationale: 所据希腊文本明确以 οἱ Ἰουδαῖοι 作 ἐνεπύρισαν 的主语。虽然这与较为人熟知的圣殿由迦勒底人／巴比伦人焚毁的记载不同，翻译仍应忠实呈现该文本，不以平行传统暗中校正；同时用脚注向读者说明困难。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你也曾许愿”承接上下文中的直接称呼；分号帮助读者辨明主句与关系从句。“犹大人”与“迦勒底人”保留历史地理称谓，脚注明示原文难点而不在正文中调和。
