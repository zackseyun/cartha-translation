  yaml_path: translation/deuterocanon/1_esdras/004/079.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: zh_hans
  text: 他把居鲁士从巴比伦分出的[a]所有器皿都送回去了；凡是居鲁士说要办的事，他也亲自下令照办，并把这些器皿送往耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“移出巴比伦的”。这里的希腊语动词可指分开、分出或移开；本处所说的是为送还而从巴比伦分出的圣殿器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: 送了回去
  rationale: 该动词本身可指“送出、派送”；结合这些器皿原属耶路撒冷圣殿、现由巴比伦送回的叙事背景，译作“送了回去”自然地表达回归方向，同时不增添具体运输方式。
- source_word: τὰ σκεύη
  choice: 器皿
  rationale: σκεῦος 在圣殿财物语境中常指礼仪所用的器皿或用具；“器皿”既简洁庄重，也符合本段的圣殿物件语境。
- source_word: ἃ ἐχώρισεν
  choice: 分别出来的
  rationale: χωρίζω 的核心义是分开、分出，也可在语境中表示挑出或移出。“分别出来”保留其基本语义，而不武断限定为行政上的指定或实际搬离。
- source_word: ἀπὸ Βαβυλῶνος
  choice: 从巴比伦
  rationale: 直接保留表示来源或分离起点的介词短语，并让其与“分别出来”连用，以保存原文可能指从巴比伦分出或移出的含义。
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: 凡居鲁士说要办的事
  rationale: 自然表达 εἶπεν 加不定式所表示的指示内容；“说要办”不把 εἶπεν 过度强化为正式命令，因为随后另有明确的 ἐπέταξεν。
- source_word: καὶ αὐτὸς
  choice: 他自己也
  rationale: 同时保留 αὐτός 的强调作用和 καί 的附加意义。
- source_word: ἐπέταξεν
  choice: 下令
  rationale: 准确表达君王发出权威命令的行政语气，且符合现代汉语叙事习惯。
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: 照办，并送往耶路撒冷
  rationale: 保留两个并列不定式“办理”和“发送”。后一个不定式的受事在希腊文中未再次明说，中文也不强行补定，以保存句法上的省略与一定程度的歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“器皿”“下令”等词符合王室诏令及圣殿财物的语境。脚注标记紧接其实际说明的“分别出来的”，而不是置于后文“要办的事”之后。末句不补出希腊文省略的宾语，以免过度消解原文结构上的含混。
