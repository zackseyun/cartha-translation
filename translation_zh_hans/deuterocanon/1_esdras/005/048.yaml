base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: zh_hans
  text: 在坛上献燔祭[a]，遵照神人摩西的书中所规定的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》3:2的希伯来文平行经文作：“照神人摩西律法上所写的。”本节希腊文则说“摩西的书中所规定的”，基本意思相同，措辞有所不同。
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: 献
  rationale: 与“燔祭”连用时表示献上祭物；现代汉语圣经语体中“献燔祭”准确而自然。
- source_word: ἐπ’ αὐτοῦ
  choice: 在坛上
  rationale: 代词承接上文的祭坛。中文若直译为“在它上面”不够自然，明示“坛”可清楚表达所指而不增加新信息。
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 这是全然焚烧之祭的通行汉语圣经术语，也与希伯来文平行经文中的 עֹלוֹת 相符。
- source_word: ἀκολούθως τοῖς ... διηγορευμένοις
  choice: 遵照……所规定的
  rationale: 表达按权威规范行事的意思，既保留法律与礼仪语境，也符合现代汉语表达。
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: 摩西的书中
  rationale: 希腊文明确说“摩西的书”，故不改从希伯来文平行经文的“摩西的律法”。
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: 神人
  rationale: 此称号修饰摩西；“神人摩西”是简洁、庄重且为汉语圣经传统所熟悉的表达。
theological_decisions:
- issue: 希腊文本与《以斯拉记》3:2希伯来文平行经文的措辞关系
  choice: 保留希腊文“摩西的书”和“所规定的”
  alternative: 按希伯来文译作“照神人摩西律法上所写的”
  rationale: 本节以希腊文本为首要依据。希伯来文可印证其礼仪法规含义，却不应取代希腊文特有的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在坛上”自然补明代词所指；“神人摩西”保留称号的分量。
