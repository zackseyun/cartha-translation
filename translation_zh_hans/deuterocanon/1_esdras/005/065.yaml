base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: zh_hans
  text: 他们来到所罗巴伯、耶书亚和各宗族的首领那里，对他们说：“我们要和你们一起建造。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们要加入你们，一同建造。”原文动词强调与对方共同参与建造，不只是提供一般性的帮助。
    reason: 说明希腊文复合动词的共同参与含义，并提供自然的另一译法。
lexical_decisions:
- source_word: προσελθόντες
  choice: 来到……那里
  rationale: 该不定过去时分词表示他们先走近这些领袖，随后开口说话；此译自然地保留了动作的先后和趋向。
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: 所罗巴伯、耶书
  rationale: 采用中文圣经传统中适合被掳归回时期人物的名称；此处的Ἰησοῦ指当时的耶书，不译作新约语境常见的“耶稣”，以免造成误解。
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: 各宗族的首领
  rationale: ἡγούμενοι指居领导地位的人，πατριαί指按祖系组成的家族或宗族；“各宗族的首领”既符合当时社会结构，也比直译“父家之首”更便于现代读者理解。
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: 我们要和你们一起建造
  rationale: 复合动词συνοικοδομέω含有“与……共同建造”的意思；译文保留共同参与建造的语义，而没有弱化为泛泛的帮助。
theological_decisions:
- issue: 被掳归回时期人名Ἰησοῦ的译法
  choice: 耶书
  alternative: 耶稣；约书亚
  rationale: 希腊文形式虽与新约中的“耶稣”相同，但本节所指是归回时期的耶书。采用“耶书”可准确标明历史人物，并避免引入并非本节所表达的基督论联想。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各宗族的首领”清楚表达古代祖系家族结构；引语保留原文未明说建造对象的简洁表达。
