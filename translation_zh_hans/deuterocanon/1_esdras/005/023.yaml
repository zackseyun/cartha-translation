  text: the sons of Sama[a], three thousand three hundred and one.
translation:
  language: zh_hans
  text: 萨玛的子孙[a]，三千三百零一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“萨玛”，人数为三千三百零一。近似的马所拉文本平行经文《以斯拉记》2:29作“尼波的子孙”，五十二人。由于本译文以希腊文本为主要依据，正文虽与该平行经文有重大差异，仍遵从希腊文本。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在归回者名册的谱系、宗族语境中，υἱοὶ表示某人的后裔或宗族成员；译作“子孙”比字面的“儿子们”更符合现代汉语名册表达。
- source_word: Σαμά
  choice: 萨玛
  rationale: 按主要希腊文本Σαμά音译。近似的马所拉文本平行经文作“尼波”，差异很大，因此正文遵从希腊文本，并在脚注说明。
- source_word: τρισχίλιοι τρακόσιοι εἷς
  choice: 三千三百零一人
  rationale: 依希腊文本直译人数；补出量词“人”，使现代汉语自然清楚，同时保留名册的简洁体例。
