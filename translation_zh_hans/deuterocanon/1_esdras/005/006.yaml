base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/006.yaml
  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: zh_hans
  text: 他是犹大支派的人；在波斯王大利乌面前[a]，他曾说过明智的话。那时是大利乌在位第二年，尼散月，也就是第一个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对波斯王大利乌”。希腊语ἐπὶ Δαρείου在这里可以表示“在大利乌面前”，也可能表达向大利乌说话。
    reason: 保留介词短语在宫廷语境中的细微歧义。
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: 他是犹大支派的人
  rationale: φυλή在此指以色列的支派。希腊文承接上文，字面为“而（属）犹大支派”；汉语补出承上所指的“他是……的人”，使本节独立可读，又不另加身份信息。
- source_word: ἐλάλησεν
  choice: 曾说出
  rationale: λαλέω表示说话或发言；“曾说出”自然表达过去发生的言语行动，不把它限定为演说、宣告等更具体行为。
- source_word: ἐπὶ Δαρείου τοῦ βασιλέως Περσῶν
  choice: 在波斯王大利乌面前
  rationale: ἐπί加属格在宫廷语境中可表示在某人面前或当着某人；此译法保留觐见场景，同时用脚注说明也可能理解为“对……说”。
- source_word: λόγους σοφοὺς
  choice: 智慧的话
  rationale: 保留λόγους的“话、言语”和σοφούς的性质描述，不将其扩展解释为格言或谋略。
- source_word: ἐν τῷ δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: 大利乌在位第二年
  rationale: βασιλεία在时间公式中指君王的统治时期；明确重复“大利乌”可避免汉语代词指向不清。
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: 尼散月，也就是正月
  rationale: 将同位说明τοῦ πρώτου μηνός译为“也就是正月”，表明尼散月是历法中的第一个月；“正月”是现代汉语对第一月的自然称呼，并非指中国农历月份。
