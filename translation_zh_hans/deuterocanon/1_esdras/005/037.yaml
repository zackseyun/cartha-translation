base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: zh_hans
  text: 他们无法申明自己的宗族和世系，说明自己是出自以色列的：巴伊南之子之子亚散的子孙[b]，尼哥但的子孙[a]，共六百五十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希腊文本所列的人名是“亚散……巴伊南”和“尼哥但”；《尼希米记》7章的近似马所拉平行文本在相应位置列出不同的人名。本译以希腊文本为准，故在正文中保留这些希腊文人名。
    reason: alternative_reading
  - marker: b
    text: 希腊原文在亚散与巴伊南之间含有连续的“儿子”关系，直译近似“巴伊南之子之子亚散的子孙”。这一亲属关系的表达较为拗口，可能是压缩或不规则的族谱说法；正文保留了这一结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: 无法报明
  rationale: 既保留“不能”的能力含义，也以适合族谱登记语境的“报明”表达陈述、申报之意。
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: 自己的宗族和世系
  rationale: “宗族”表达父系家族群体，“世系”表达祖先传承，既区分两个并列词，也符合现代汉语族谱语境。
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: 以证明自己出自以色列
  rationale: 按上下文表达他们无法凭家族和世系确立以色列出身；不把“以色列”窄化为现代地理概念。
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在族谱名单中，此词可泛指某祖先名下的后裔；“子孙”比逐字译作“儿子”更符合六百余人的群体语境。
- source_word: Ἀσὰν
  choice: 亚散
  rationale: 按希腊文人名音译。
- source_word: τοῦ υἱοῦ τοῦ Βαενάν
  choice: 巴伊南之子的
  rationale: 保留传世希腊文中重复的亲子关系结构，不擅自简化为“巴伊南的儿子亚散”。
- source_word: Νεκωδάν
  choice: 尼哥但
  rationale: 按希腊文 Νεκωδάν 音译，并以希腊文本而非近似的马所拉平行经文为准。
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: 共六百五十二人
  rationale: 准确保留人数，并补出汉语名单中自然的量词“人”。
theological_decisions:
- issue: “出自以色列”是断言还是待证身份
  choice: 译为“以证明自己出自以色列”
  alternative: “说明他们是出自以色列的”
  rationale: 句意重点是这些人无法凭宗族和世系证实其以色列出身；此译保留身份主张与证据不足之间的张力，不替文本判定其真实血统。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留族谱名单的正式语气。人名依据希腊文音译；对不规则的亲属结构不作未经文本支持的修整，并以脚注说明。
