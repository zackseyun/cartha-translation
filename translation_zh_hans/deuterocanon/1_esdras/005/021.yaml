base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/021.yaml
  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
translation:
  language: zh_hans
  text: 马卡隆人[a]一百二十二名；伯多利奥人五十二名；尼斐斯人一百五十六名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文平行经文《尼希米记》7:25作：“拉玛和迦巴的子孙，六百二十一名。”《以斯得拉一书》此处所保存的名称和人数与之有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: 来自……的
  rationale: 此希腊语结构按籍贯或地方来源界定一群人；译作“来自……的”自然清楚，也避免从希伯来文平行经文引入原文此处没有的“子孙”。
- source_word: Μακαλών
  choice: 马卡隆
  rationale: 按希腊语形式音译。其确切所指不明，且希伯来文平行经文所载地名不同，因此不作推测性协调。
- source_word: Βετολιώ
  choice: 伯多利奥
  rationale: 按希腊语形式音译；名单在不同文本传统中差异显著，故保留希腊文本的名称形式。
- source_word: Νειφείς
  choice: 尼斐斯人
  rationale: 按希腊语形式音译，并依名单语境补出“人”，使现代汉语表达完整；不将其强行对应到希伯来文平行经文的地名。
- source_word: ἑκατὸν εἴκοσι δύο
  choice: 一百二十二人
  rationale: 按现代汉语通常方式表达基数，并补出量词“人”。
- source_word: πεντήκοντα δύο
  choice: 五十二人
  rationale: 按现代汉语通常方式表达基数，并补出量词“人”。
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: 一百五十六人
  rationale: 按现代汉语通常方式表达基数，并补出量词“人”。
theological_decisions:
- issue: 希腊文本与希伯来文平行经文中的名称及人数存在重大差异
  choice: 正文照希腊文本翻译，并在脚注中说明希伯来文平行经文的异文。
  alternative: 按《尼希米记》7:25协调为“拉玛和迦巴的子孙，共六百二十一人”。
  rationale: 《以斯得拉一书》的主要翻译依据是希腊文本；此处两个传统的差异过大，不宜无据协调。将希腊文本保留在正文、把希伯来文平行传统列入脚注，既忠于主要来源，也公开文本张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。三个名称依希腊文音译，不以希伯来文平行经文加以协调；分号保留名单的节奏和层次。
