base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: zh_hans
  text: 以致百姓因百姓的哭声，听不见号角声[a]；因为人群正高声吹号[b]，那声音从远处也能听见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》3:11的希伯来文平行记载说，百姓大声呼喊，赞美耶和华；本节《以斯得拉一书》的希腊文本则以较扩展的方式突出号角声和哭声。
    reason: cross_reference
  - marker: b
    text: 或译“号角声大作”。希腊文直译为“人群正在高声吹号”；其表达较为压缩，所吹的号角可由前文补足。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 引出实际结果，简洁保留希腊文的结果意味。
- source_word: τὸν λαὸν μὴ ἀκούειν
  choice: 百姓……听不见
  rationale: 按汉语习惯表达因声响遮盖而无法听见，并保留 λαός 的群体含义。
- source_word: τῶν σαλπίγγων
  choice: 号角声
  rationale: 希腊文直译为“号角”，但在“听见”的语境中指号角发出的声音；译出“声”较自然。
- source_word: διὰ τὸν κλαυθμὸν τοῦ λαοῦ
  choice: 因众人的哭声
  rationale: κλαυθμός 指可听见的哭泣；此处将重复的 λαός 译作“众人”，使现代汉语自然，同时不改变所指群体。
- source_word: ὁ γὰρ ὄχλος
  choice: 因为人群
  rationale: ὄχλος 指聚集的大群人；“人群”符合公开集会场景。
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: 正大声吹号
  rationale: 压缩的希腊文结构表明人群在高声吹奏；结合前文补出“号”，但不进一步限定是谁持号。
- source_word: μακρόθεν ἀκούεσθαι
  choice: 声音远处都能听见
  rationale: 将希腊文被动结构自然转为汉语表达，并明确其听觉所指是前述巨大声响。
theological_decisions: []
