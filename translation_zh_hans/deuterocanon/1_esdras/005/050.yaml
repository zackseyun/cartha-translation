base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: zh_hans
  text: 他们照律法所吩咐的，守住棚节[a]，并且照所当行的，天天献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帐棚节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: 守
  rationale: ἄγω与节期连用时表示举行、庆守；“守……节”是现代汉语中自然且庄重的表达。
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: 住棚节
  rationale: σκηνοπηγία指搭棚居住的节期；“住棚节”既保留具体意象，也是现代中文常用名称。
- source_word: ὡς ἐπιτέτακται ἐν τῷ νόμῳ
  choice: 照律法所吩咐的
  rationale: 完成时被动态表达持续有效的规定；此译法自然地表明吩咐载于律法之中。
- source_word: θυσίας καθ’ ἡμέραν
  choice: 天天献上……祭
  rationale: θυσίας是祭物或祭祀，καθ’ ἡμέραν具有逐日反复之意；“天天献上……祭”保留该分配性语气。
- source_word: ὡς προσῆκον ἦν
  choice: 应献的
  rationale: προσήκω表示合宜、适当或应当；结合献祭语境译作“应献的”，简洁自然，同时不把它强化为另一项明确法令。
theological_decisions:
- issue: 节期名称 σκηνοπηγία
  choice: 住棚节
  alternative: 帐棚节
  rationale: “住棚节”准确呈现节期与棚屋相关的含义，也符合现代中文圣经及一般读者较熟悉的用语；脚注保留另一种直译名称。
- issue: ὡς προσῆκον ἦν 的规范力度
  choice: 应献的
  alternative: 按合宜的方式
  rationale: 原文表达合宜或应当，没有再次明确说是律法命令；“应献的”保留规范意味而不将其过度法律化。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“照律法所吩咐的”前置，清楚修饰守节；末句稍作汉语化整合，避免生硬直译“照所合宜的”。
