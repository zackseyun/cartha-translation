base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: zh_hans
  text: 他们把银子给凿石匠和木匠，又把饮料、食物和给养[a]给西顿人和推罗人，好让他们从黎巴嫩运来香柏木，用木筏运到约帕港；这一切都是照波斯王居鲁士给他们的书面谕令办理的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“给养”的希腊词含义不确定；《以斯拉记》3:7的希伯来文平行经文作“油”。
    reason: 说明疑难词及平行文本中的具体异读，避免正文过度确定。
lexical_decisions:
- source_word: ἀργύριον
  choice: 银子
  rationale: 保留希腊文“银”的字面表达；在此付款语境中也自然表示钱财。
- source_word: λατόμοις
  choice: 凿石匠
  rationale: 明确指切凿石料的工人，避免“石匠”可能泛指砌筑工。
- source_word: τέκτοσι
  choice: 木匠
  rationale: 在圣殿建造及与凿石匠并列的语境中，最自然地指木作工匠。
- source_word: ποτὰ καὶ βρωτὰ
  choice: 饮料、食物
  rationale: 直接而自然地表达可饮用和可食用之物。
- source_word: χάρα
  choice: 给养
  rationale: 传抄下来的希腊词形在此语境中含义困难；“给养”符合物资清单的上下文，同时不武断指定为希伯来平行经文中的“油”。
- source_word: ξύλα κέδρινα
  choice: 香柏木
  rationale: 现代中文圣经语体中自然、明确；后文木筏运输已足以显出其为建筑木料，无须增译“原木”。
- source_word: διαφέρειν σχεδίαις
  choice: 用木筏运
  rationale: 准确表达以木筏为运输方式，中文简洁自然。
- source_word: Ἰόππης λιμένα
  choice: 约帕港
  rationale: 简明表达约帕的港口，并采用通行地名译法。
- source_word: πρόσταγμα τὸ γραφὲν
  choice: 书面谕令
  rationale: 同时体现王命的正式性质及其写成文字这一限定。
- source_word: Κύρου τοῦ Περσῶν βασιλέως
  choice: 波斯王居鲁士
  rationale: 依原文身份与人名次序作自然中文表达，并采用通行译名。
theological_decisions:
- issue: 希腊主文本与《以斯拉记》希伯来平行经文的关系
  choice: 以希腊文为主，将含义困难的 χάρα 审慎译作“给养”，并加注说明。
  alternative: 按《以斯拉记》3:7的希伯来文具体译作“油”，或按现存希腊词形直译为不合语境的“喜乐”。
  rationale: 本书应以希腊文本为首要依据；平行经文可帮助辨明这里是一项实用物资，却不足以把希腊正文无明文指明的具体物品直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“好让”清楚表达两个不定式所表示的目的；末句以“这一切……办理的”自然承接希腊文略显松散的并列结构，同时保留书面王令是行动依据的含义。
