base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: zh_hans
  text: 地上其他民族中有人聚集到他们那里[a]；他们在原处立起了祭坛[d]，因为那些民族与他们为敌。地上的各民族都压过了他们；他们按规定的时间献上祭物，并在早晚向主献上全燔祭[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人从地上其他民族中来归附他们。”这里的希腊语动词可以含有加入某一群体的意思。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文比《以斯拉记》3:2的近似希伯来文平行经文更长，增添了地上各民族的敌意、他们压过这群人，以及早晚按时献祭等内容。
    reason: cross_reference
  - marker: c
    text: 或译：“完全焚烧的祭物。”该希腊语词专指祭物全部被火烧尽的一种祭。
    reason: lexical_alternative
  - marker: d
    text: 这里译作“立起了”的希腊语在本句中含义不易确定，也可理解为“被坚立”或“得以安置”。译文依照它与“祭坛”和“原处”的关联，表达在原处设立祭坛的意思。
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: 也有人聚集到他们那里
  rationale: 该动词形式可表达被聚集，也可带有主动靠拢、加入群体的意味。“聚集到他们那里”保留这种空间与群体归附的含义；汉语补出泛指的“有人”，避免误把未明说的主语当成全体民族。
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: 地上其他民族中
  rationale: ἔθνη可指民族或列国；这里用“民族”较自然，也不把原文没有明说的地理关系解释成“周围列国”。
- source_word: κατωρθώθησαν
  choice: 站稳了
  rationale: 该词在此语境含义困难，可指被扶正、坚立、成功立定。“站稳了”既表达在祭坛处得以稳固，也不把它限定为建造或正式设立祭坛。
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: 在原处的祭坛那里
  rationale: 原文重复使用ἐπί，并强调祭坛及其所在之处。汉语以“原处的祭坛那里”自然表达祭坛位于原有地点，同时避免生硬照搬介词结构。
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: 这些民族与他们为敌
  rationale: 保留ἔχθρα所表达的敌对关系，不额外赋予这些民族宗教或族群身份。
- source_word: κατίσχυσαν αὐτοὺς
  choice: 都胜过了他们
  rationale: κατισχύω表示强过、压倒或胜过。“胜过了”保留敌对力量占上风的意思，又不把程度强化为彻底击败。
- source_word: κατὰ τὸν καιρὸν
  choice: 按规定的时间
  rationale: 此处指献祭应遵守的适当或指定时刻；“按规定的时间”清楚传达礼仪上的规律性。
- source_word: ὁλοκαυτώματα
  choice: 全燔祭
  rationale: 该词特指祭物全部焚烧的祭；“全燔祭”简洁保留“完全烧尽”的含义，并与一般祭物相区别。
- source_word: Κυρίῳ
  choice: 向主
  rationale: 按现代汉语宗教文本的自然用法，将κύριος译作“主”；介词“向”体现献祭的对象。
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: 在早晚
  rationale: 简洁表达每日早晨和傍晚的固定献祭时段。
theological_decisions:
- issue: 本节希腊文与《以斯拉记》3:2的近似希伯来文平行经文长短不同
  choice: 以《以斯得拉一书》的希腊文为主要依据，完整保留民族敌视、胜过他们及早晚献祭等内容
  alternative: 按较短的希伯来文平行经文协调或删减这些分句
  rationale: 此处的希腊文见证明确包含这些张力较强的内容；翻译不应以近似平行经文抹平或删去它们。
- issue: 如何称呼敌对的周边人群
  choice: 使用“其他民族”和“为敌”，只表达希腊文明确陈述的身份与关系
  alternative: 译作“外邦人”“异教徒”或直接称为“仇敌”
  rationale: 原文只使用ἔθνη和ἔχθρα，并未进一步作神学或道德分类，因此不加入额外的宗派性或族群判断。
- issue: 民族胜过他们与他们继续献祭之间的叙事张力
  choice: 以分号并列两项陈述，不补出“然而”“仍然”等转折词
  alternative: 加入“然而他们仍然献祭”来解释二者关系
  rationale: 希腊文使用καί连接，并未明确标示转折；保留并列结构可避免替原文消解张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“全燔祭”保留礼仪术语的精确性；其余句式尽量避免文言化。原文的代词衔接和κατωρθώθησαν的语义均较困难，正文作最低限度的自然化，并用脚注保留可译空间。
