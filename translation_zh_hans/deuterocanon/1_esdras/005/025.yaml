  text: 法朔的子孙[a]，一千二百四十七人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》7:37的希伯来文平行经文则作：“罗德、哈第和阿挪的子孙，共七百二十五人。”《以斯得拉一书》此处的希腊传统在名单位置和内容上均有所不同。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在人口登记和家族名单中，υἱοὶ通常指某一家族或宗族的成员；译作“子孙”比字面的“儿子们”更符合现代汉语，同时保留谱系含义。
- source_word: Φασσόρου
  choice: 法朔
  rationale: 按希腊文Φασσόρου的主格形式Φασσόρ音译，不以近似的希伯来文本所列地名取代希腊见证中的专名。
- source_word: χίλιοι διακόσιοι τεσσεράκοντα ἑπτά
  choice: 一千二百四十七人
  rationale: 希腊文数词明确为1,247；加“人”使中文名单表达自然，也明确这是人数统计。
