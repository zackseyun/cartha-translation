  text: And these are the names of the men who were going up according to their ancestral houses[a], into their tribes[b], each to his own administrative division.
translation:
  language: zh_hans
  text: 以下是那些上去的男子的名字；他们按各自的宗族[a]，进入各自的支派，前往各自的分区[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按各自的父系家族”。希腊语 πατριά 指循祖先世系划分的亲属群体。
    reason: lexical_alternative
  - marker: b
    text: “分区”所译的希腊语 μεριδαρχία 十分罕见，也可能指区域、所分得的地界，或其他正式划分的行政单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ταῦτα τὰ ὀνόματα
  choice: 以下是……的名字
  rationale: 用自然的现代汉语引出下文名册，同时保留连接上下文并向后指示的作用。
- source_word: τῶν ἀνδρῶν
  choice: 那些……之人
  rationale: 此处指名册中的男性成员或代表；“之人”在名册语境中庄重自然，又不把词义误缩为一般人群。
- source_word: τῶν ἀναβαινόντων
  choice: 上去之人
  rationale: 保留ἀναβαίνω在归回语境中的方向性；不擅自补出原文未明说的目的地。
- source_word: κατὰ πατριὰς αὐτῶν
  choice: 按各自的宗族
  rationale: πατριά指按祖系形成的亲属群体；“宗族”比“家庭”更能表达谱系和群体层级。
- source_word: εἰς τὰς φυλὰς
  choice: 归入各自的支派
  rationale: “归入”体现εἰς的趋向性，“支派”是以色列谱系和群体语境中清楚而常用的表达。
- source_word: ἐπὶ τὴν μεριδαρχίαν αὐτῶν
  choice: 各归自己的辖区
  rationale: μεριδαρχία是罕见的行政地域用语；“辖区”简洁地传达划分出来并受治理的区域，同时以脚注保留其不确定范围。
