base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: zh_hans
  text: 祭司穿着礼服站立，有乐师和号角相伴[a]；利未人，就是亚萨的子孙，拿着钹，赞美主，称颂他，照以色列王大卫的方式[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐师”或译“乐器”或“音乐伴奏”；希腊文可作较宽泛的理解。
    reason: lexical_alternative
  - marker: b
    text: “照以色列王大卫的方式”也可译作“按照以色列王大卫的做法”或“照以色列王大卫的规定”；希腊文没有明确限定是指规定、先例，还是礼仪方式。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: 站立
  rationale: 在礼仪场景中表示站定或列位；“站立”简洁自然，也不额外引入“被安排”等被动意味。
- source_word: ἐστολισμένοι
  choice: 穿着礼服
  rationale: 表达为礼仪而正式装束的状态；“礼服”保留庄重感，同时避免把希腊文未明说的特定祭司服饰细节写入正文。
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: 有乐师和号角相伴
  rationale: μουσικῶν 可指乐师，也可泛指音乐或乐器；正文采用合乎场景且自然的“乐师”，并以脚注保留“乐器”的可能。
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: 利未人，就是亚萨的子孙
  rationale: 清楚保留利未人的身份和亚萨家族或群体的归属关系。
- source_word: ἔχοντες τὰ κύμβαλα
  choice: 拿着钹
  rationale: 直接表达持有这些礼仪乐器，并符合现代汉语的自然说法。
- source_word: ὑμνοῦντες τῷ κυρίῳ
  choice: 赞美主
  rationale: ὑμνοῦντες 在此指以诗歌颂赞；“赞美”通顺易懂，κύριος 在圣殿敬拜语境中译为“主”。
- source_word: εὐλογοῦντες
  choice: 称颂他
  rationale: 在以上帝为对象时，“称颂”比现代汉语中的“祝福他”更自然，也保留赞颂、说美言的核心含义；宾语“他”由上下文补明。
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: 照以色列王大卫所定的方式
  rationale: κατά 表示依照大卫的规范、先例或方式；正文以自然汉语传达遵循大卫模式的意思，脚注保留其具体语力的开放性。
theological_decisions:
- issue: 圣殿敬拜语境中 κύριος 的译法
  choice: 主
  alternative: 上主
  rationale: 此处所指是以色列的上帝；采用现代中文圣经中简明通行的“主”，不进一步引入原文未呈现的专名形式。
- issue: κατὰ Δαυεὶδ 的确切语力
  choice: 照以色列王大卫所定的方式
  alternative: 按照以色列王大卫的做法
  rationale: 该短语可以侧重大卫所定的规制，也可以侧重大卫所示范的方式。正文表达依循大卫的礼仪模式，脚注明确保留这层歧义。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。“穿着礼服站立”“拿着钹”保持画面具体；“称颂他”避免“祝福上帝”在现代汉语中可能产生的误解。正文及脚注标记完整对应。
