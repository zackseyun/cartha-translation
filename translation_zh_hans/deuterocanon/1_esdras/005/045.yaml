base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: zh_hans
  text: 祭司、利未人和从他百姓中来的人[a]在耶路撒冷和乡间定居；圣殿歌者、守门人以及全体以色列人都住在自己的村庄里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“从他百姓中来的人”。“他”所指不明确；这句话可能指该群体中不属于祭司或利未人的成员。
    reason: 说明αὐτοῦ的指向及该群体范围在原文中的歧义。
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: 定居
  rationale: 该不定过去时被动形式表示被安置而居住或安顿下来；“定居”在现代汉语中自然，并符合归回后重新安居的语境，同时不过度强调外在施事者。
- source_word: οἱ ἱερεῖς
  choice: 祭司
  rationale: 犹太礼仪语境中的标准译法。
- source_word: οἱ Λευεῖται
  choice: 利未人
  rationale: 准确保留这一特定群体的传统名称。
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: 他百姓中的人
  rationale: 贴近希腊文“从他的百姓中出来的人”。αὐτοῦ（“他的”）所指不明，因此正文保留这一含混性，并用脚注说明；不直接译成“一些百姓”或“其余百姓”，以免替原文作出范围判断。
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: 在耶路撒冷和那地区
  rationale: χώρα可指土地、乡间或地区；“那地区”保持一般地域含义，不擅自加入“周围”等原文未明说的关系。
- source_word: οἵ τε ἱεροψάλται
  choice: 圣殿歌者
  rationale: ἱεροψάλται指承担神圣礼仪歌唱职分的人；“圣殿歌者”比泛称“歌唱的人”更准确，也便于现代读者理解。
- source_word: οἱ θυρωροὶ
  choice: 守门人
  rationale: 这是圣殿及群体职分语境中清楚而惯常的译法。
- source_word: πᾶς Ἰσραήλ
  choice: 全以色列
  rationale: 保留原文的群体性称谓，不将其解释为逐一无例外的数学式全称。
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: 住在自己的村庄里
  rationale: κώμη通常指村庄或较小的聚落；“自己的”自然表达αὐτῶν，并保留各群体所属居所之意。
theological_decisions:
- issue: πᾶς Ἰσραήλ的范围
  choice: 译作“全以色列”，作为复兴群体的整体称谓
  alternative: 理解为每一个以色列人，无一例外
  rationale: 原文在列举归回后安居的群体，πᾶς Ἰσραήλ自然可作共同体整体称谓；译文保留原有表达，不进一步界定其逻辑范围。
- issue: οἱ ἐκ τοῦ λαοῦ αὐτοῦ中αὐτοῦ的指向
  choice: 正文保留“他百姓中的人”，并以脚注说明指代不明
  alternative: 译作“一些百姓”“其余百姓”或“这个群体中的平民”
  rationale: 希腊文代词的先行对象并不清楚。较顺畅的意译会消除这一真实含混，甚至把该群体限定为非祭司、非利未人；故正文从形式上保留，脚注提供可能理解而不作定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“定居”“圣殿歌者”“守门人”适合普通读者；以分号区分耶路撒冷及该地区与各自村庄两组居住信息，使较长的希腊语并列句在中文中清楚，同时不改变群体清单。
