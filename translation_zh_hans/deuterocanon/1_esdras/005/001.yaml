  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
translation:
  language: zh_hans
  text: 这些事以后，按各自支派归属的宗族首领，连同他们的妻子、儿子、女儿、男仆、女仆[a]和牲畜，都被选中上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男仆、女仆”也可译作“男奴、女奴”。希腊语这两个词既可指家仆，也可指奴隶；本节本身不足以确定他们确切的法律身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语和承接上文的时间关系，同时符合现代汉语叙事表达。
- source_word: ἐξελέγησαν
  choice: 被选定
  rationale: 忠实表达被动语态，且不额外赋予正式任职或委任的含义。
- source_word: ἀναβῆναι
  choice: 上去
  rationale: 保留“上行”的圣经叙事习语，不擅自补出本节未明说的目的地。
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: 宗族首领
  rationale: ἀρχηγοί指首领，οἴκος πατριῶν指以祖先和父系家族为纽带的宗族单位；“宗族首领”简洁自然，并传达其社会结构。
- source_word: κατὰ φυλὰς αὐτῶν
  choice: 各支派的
  rationale: 将κατά的分类、分配意义自然表达为按各支派归属。
- source_word: αἱ γυναῖκες αὐτῶν
  choice: 他们的妻子
  rationale: 在家庭成员清单中，γυναῖκες最自然地指妻子。
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: 儿子、女儿
  rationale: 保留原文分别列举男女后代的表达，不笼统合并为“儿女”。
- source_word: οἱ παῖδες αὐτῶν
  choice: 男仆
  rationale: 前文已列出儿子和女儿，因此此处παῖδες更可能指男性家仆或奴仆；“男仆”也与后面的阴性形式构成对应。
- source_word: αἱ παιδίσκαι
  choice: 女仆
  rationale: 作为παῖδες的阴性对应词，此处指女性家仆或女奴；“女仆”现代、清楚，又不武断限定其法律身份。
- source_word: τὰ κτήνη αὐτῶν
  choice: 牲畜
  rationale: κτήνη在迁徙清单中指家养动物或役畜；“牲畜”比“牛群”更宽泛，也比“财物”更具体。
