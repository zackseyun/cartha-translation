  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
translation:
  language: zh_hans
  text: 本族人及其首领的人数如下：福罗斯的子孙[a]，七万二千人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“福罗斯”。平行的希伯来名册传统在此处的名字和人数都不同；《以斯拉一书》的希腊文本可能保存了另一种名册形式。
    reason: alternative_reading
  - marker: b
    text: 希腊文本作“七万二千人”。这个数字在本段语境中异常庞大，与近似的马所拉文本平行经文差异悬殊，可能反映文本问题，也可能反映不同的名册传统。
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  choice: 人数如下
  rationale: 这是名册中引出统计数字的标题性用语；译作“人数如下”既保留“数目”的含义，也符合现代汉语名册体例。
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: 从本族而来的人
  rationale: ἔθνος可指“民族、国民、族群”；此处希腊文表达简略，采用“本族”保留其群体含义，不擅自明确为某个特定民族。
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: 其首领
  rationale: προηγούμενοι字面为“走在前面的人”，在行政或宗族名册语境中指带头者、首领。
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在宗族名册中，υἱοί往往泛指某位祖先的后裔或该家族成员；“子孙”比仅指亲生儿子的“儿子”更符合此处功能。
- source_word: Φορὸς
  choice: 福罗斯
  rationale: 按主要希腊文本Φορός音译，不以近似的希伯来平行传统替换该专名。
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: 七万二千人
  rationale: 如实翻译现存希腊文本的数字；虽与平行名册差异悬殊，仍不在正文中校改。
