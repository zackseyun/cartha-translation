base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: zh_hans
  text: 第二年二月，他们来到耶路撒冷上帝的殿[a]以后，撒拉铁的儿子所罗巴伯和约萨达的儿子耶书亚，连同他们的弟兄、祭司、利未人，以及所有从被掳之地来到耶路撒冷的人[b]，开始，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的圣殿”或“上帝的圣所”。希腊词可指圣殿建筑，也可泛指整个圣殿范围。
    reason: lexical_alternative
  - marker: b
    text: 或译“所有从流亡中返回耶路撒冷的人”。希腊文更直译为“所有从被掳中来到耶路撒冷的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει ... μηνὸς δευτέρου
  choice: 到了第二年二月
  rationale: 将分置于句中的两个时间短语合并为现代汉语自然的时间表达，同时保留“第二年”和“二月”两项信息。
- source_word: παραγενόμενοι εἰς τὸ ἱερὸν τοῦ θεοῦ εἰς Ἰερουσαλήμ
  choice: 他们来到耶路撒冷上帝的殿以后
  rationale: 分词表示相对于“开始”较早发生的动作；“以后”清楚呈现先后关系，而不额外说明来殿的目的。
- source_word: τὸ ἱερὸν τοῦ θεοῦ
  choice: 上帝的殿
  rationale: ἱερόν可指圣所或整个圣殿范围；“殿”在中文中自然、庄重，也保留其范围上的一定弹性。
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: 撒拉铁的儿子所罗巴伯
  rationale: 采用中文圣经传统中较为通行的人名形式，并明确表达希腊文中的父子关系。
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: 约萨达的儿子耶书亚
  rationale: 在以斯拉复归语境中采用“耶书亚”，以区别于新约中的“耶稣”；“约萨达”对应此人物父名的通行形式。
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: 他们的弟兄
  rationale: 保留希腊文阳性亲属称谓，不将其解释性扩大为同胞或族人。
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: 祭司、利未人
  rationale: 按列举结构呈现两个群体，不合并为带解释性的复合称号。
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας εἰς Ἰερουσαλήμ
  choice: 所有从被掳之地来到耶路撒冷的人
  rationale: “被掳之地”保留αἰχμαλωσία的具体被掳含义，同时用自然中文表达归来者。
- source_word: ἤρξαντο
  choice: 开始
  rationale: 原节在“开始”之后悬而未完，内容由后文承接；不擅自补入“建造”或“动工”等宾语。
theological_decisions:
- issue: τὸ ἱερὸν τοῦ θεοῦ所指的敬拜场所范围
  choice: 上帝的殿
  alternative: 上帝的圣殿；上帝的圣所
  rationale: “殿”既符合复归时期的圣殿语境，又不把ἱερόν过度限定为内殿或某一建筑部分。
- issue: ἀδελφοί的群体范围
  choice: 弟兄
  alternative: 同胞；亲族
  rationale: 原文使用阳性亲属词，译文保留这一称谓，不主动将其神学化或泛化。
- issue: ἤρξαντο之后省略的行动内容
  choice: 不补出宾语，以逗号承接下节
  alternative: 开始动工；开始建造
  rationale: 本节希腊文本没有明说所开始的具体行动；保留未完成句式可避免根据后文提前解释。
