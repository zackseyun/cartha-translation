base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
translation:
  language: zh_hans
  text: 利未人：耶稣伊斯[a]、科德卢、班努和苏迪乌的子孙，共七十四人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节有几个名字与较为人熟知的《以斯拉记—尼希米记》平行经文不同；这里依照《以斯得拉一书》的希腊文本翻译，不将其协调为希伯来传统中的名字。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: 利未人
  rationale: 这是人口名册中的主格标题；译为“利未人”简洁自然，也不增添希腊文没有的连词。
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在族谱和人口名册中，υἱοὶ可表示家族归属或后裔。“子孙”比仅指亲生儿子的“儿子”更符合现代汉语名册语境，同时保留血统含义。
- source_word: Ἰησουείς
  choice: 耶稣伊斯
  rationale: 依现存希腊文名称音译，不按较为人熟知的《以斯拉记—尼希米记》平行传统改写。
- source_word: Κοδδηλοῦ
  choice: 科德卢
  rationale: 按希腊文形式音译；不将其协调为希伯来传统中可能对应的名字。
- source_word: Βάννου
  choice: 班努
  rationale: 按希腊文名称音译，避免据平行传统改作“巴尼”等形式。
- source_word: Σουδίου
  choice: 苏迪乌
  rationale: 保留现存希腊文中的特殊名称形式，不依据推测的底本复原为其他名字。
- source_word: ἑβδομήκοντα τέσσαρες
  choice: 共七十四人
  rationale: 准确表达基数；补出“共”和量词“人”，使中文名册句式完整自然。
