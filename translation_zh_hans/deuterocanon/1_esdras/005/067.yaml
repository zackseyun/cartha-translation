base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: zh_hans
  text: 所罗巴伯、耶书[a]和以色列各宗族的首领对他们说：“不该由你们为主我们的上帝建造圣殿[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书”也可译作“约书亚”；此处指被掳归回时期的大祭司。
    reason: lexical_alternative
  - marker: b
    text: “圣殿”原文直译为“房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβὲλ
  choice: 所罗巴伯
  rationale: 采用现代中文圣经传统中对这位被掳归回时期领袖的通行译名，并与希伯来传统所指人物一致。
- source_word: Ἰησοῦς
  choice: 耶书
  rationale: 此处指被掳归回时期的大祭司；用“耶书”可明确人物身份，避免按希腊形式译作“耶稣”而引起误解。“约书亚”亦为可能译法，故加注。
- source_word: οἱ ἡγούμενοι τῶν πατριῶν τοῦ Ἰσραήλ
  choice: 以色列各宗族的首领
  rationale: ἡγούμενοι 指居领导地位者；πατριαί 在此指父系家族或宗族。译作“各宗族的首领”既保留社会结构，也比直译“父家”更符合现代汉语。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 直接呈现常见的叙事引语格式。
- source_word: Οὐχ ὑμῖν τοῦ οἰκοδομῆσαι
  choice: 你们不可……建造
  rationale: 希腊文是省略式结构，表示这项建造之事不属于对方的权限或责任；“不可”自然地表达排除之意，同时不引入平行经文中更完整的措辞。
- source_word: τὸν οἶκον
  choice: 这殿
  rationale: οἶκος 字面为“房屋”，但本处明确指圣殿；中文用“殿”自然清楚，脚注保留字面信息。
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: 为主我们的上帝
  rationale: 与“建造”搭配时，希腊文与格自然译为“为……建造”。保留“主我们的上帝”的原有词序和称谓关系，不把希腊文 κύριος 改写为专名形式。
theological_decisions:
- issue: 在圣殿建造语境中如何翻译 κύριος
  choice: 主
  alternative: 耶和华
  rationale: 主要文本依据是希腊文 Κυρίῳ，故译作“主”；虽相关希伯来传统以神名指称上帝，但不据此改写希腊文本。
- issue: Οὐχ ὑμῖν 所表达的排除程度
  choice: 你们不可
  alternative: 你们与我们无分
  rationale: 原句只表明建造之事不属于受话者，并未包含“与我们无分”等平行经文的扩展措辞，因此不将其补入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各宗族的首领”清楚表达古代父系家族的领导结构；引语简洁有力。正文中的脚注标记均与脚注对应。
