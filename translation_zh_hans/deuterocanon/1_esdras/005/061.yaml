  text: and many with trumpets[a], and great joy with the voice[b];
translation:
  language: zh_hans
  text: 又有许多人吹号[a]，又有极大的喜乐之声[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处极为省略，近似清单式的并列短语；可直译为“又有许多人借着号，又有极大的喜乐伴随着声音”。原文没有说明吹号者的身份。
    reason: 说明原文的省略结构、器乐用语及未明说的参与者身份。
  - marker: b
    text: 希伯来文平行经文《以斯拉记》3:10较完整地描述祭司吹号、亚萨的子孙利未人敲钹赞美耶和华；本节希腊文则以压缩的方式呈现这一场景。
    reason: 提供平行经文背景，并说明希腊文本的压缩形式。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该词在此作名词性用法，指人数众多的参与者。译出“人”符合现代汉语，同时保留希腊文未说明其具体身份的含混性。
- source_word: διὰ σαλπίγγων
  choice: 吹号
  rationale: διά加属格在这里表示凭借乐器发声。直译“用号”在汉语中不自然；“吹号”简洁表达其工具和行动意义，但不据平行经文擅自补出祭司身份。
- source_word: χαρὰ μεγάλη
  choice: 欢呼
  rationale: 原义为“极大的喜乐”。结合后面的“声音”，这里译作可听见的“欢呼”，使压缩而残缺的希腊语句式在现代汉语中可懂；“极大的”所表达的强度由欢庆语境和声音体现。
- source_word: τῇ φωνῇ
  choice: 声音
  rationale: 原文有定冠词而没有“大声”等形容词，故不增译“响亮”。与“欢呼”组合为“欢呼的声音”，保留其听觉表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又有……并有……”略微保留原文并列、片段式的节奏；不补入希腊文未明说的祭司、利未人或赞美对象。
