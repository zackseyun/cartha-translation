base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: zh_hans
  text: 他也以他的名字被称呼[a]。这些人的家谱记录曾在登记名册中被查找，却没有找到；于是他们被排除，不得执行祭司职务[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他也按他的名字得名。”希腊文这个短句很简略，单看本节不能完全确定代词具体指谁。
    reason: lexical_alternative
  - marker: b
    text: 意思是：他们的家谱记录未能在正式登记名册中查到，因此不得执行祭司职务。经文没有说明这种排除是否永久。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: 按他的名字被称呼
  rationale: καλέω的被动式在ὄνομα的语境中表示称名或命名，而不是召唤。此译法贴近希腊文，并保留代词所指不完全明确的特点。
- source_word: τούτων
  choice: 这些人当中
  rationale: 表达所述群体中的一部分，比生硬的“从这些人”更符合现代汉语，同时不改变其范围。
- source_word: ἐζητήθησαν
  choice: 有人……查找他们
  rationale: 以汉语的泛指施事结构保留希腊文被动语义：被查找的是这些人，并未改成他们主动寻找记录。
- source_word: τῆς γενικῆς γραφῆς
  choice: 族谱记录
  rationale: 结合祭司资格审核的语境，指用来证明家系的书面记录；“族谱记录”兼顾文书性质与现代可读性。
- source_word: ἐν τῷ καταλοχισμῷ
  choice: 在登记名册中
  rationale: καταλοχισμός指按名单登记或编列；“登记名册”自然传达行政核验的背景，且不引入军事意味。
- source_word: μὴ εὑρεθείσης
  choice: 却没有找到
  rationale: 用自然汉语表达未能在名册记录中找到相关人员或其谱系证明的结果，同时不擅自补足希腊文省略的明确主语。
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: 被排除，不得担任祭司
  rationale: χωρίζω在此表示从祭司职务中排除；动词ἱερατεύειν强调履行祭司职分，而不只是抽象身份。
theological_decisions:
- issue: 被排除于祭司职分的性质
  choice: 表述为因未查到谱系记录而不得担任祭司
  alternative: 表述为永远或绝对地被逐出祭司阶层
  rationale: 经文叙述的是基于家系文书的资格审核，并没有说明这种排除是否永久，也没有提出关于祭司制度的一般教义，因此不补入绝对性或永久性的判断。
- issue: 开头称名短句的所指
  choice: 保留“他／他的”所指含混
  alternative: 明确补出某个人名或解释为以另一人之名命名
  rationale: 本节希腊文措辞压缩，单凭本句无法完全确定代词关系；正文不应代替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“有人……查找他们”既避免僵硬的被动句，又保留ἐζητήθησαν的被动关系；分号清楚呈现查验失败与排除结果之间的联系。所有解释性补充均置于脚注，正文保留原文的省略与含混。
