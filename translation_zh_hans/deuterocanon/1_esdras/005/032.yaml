base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/032.yaml
  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
translation:
  language: zh_hans
  text: 底大的子孙[a]，巴库斯的子孙，塞拉尔的子孙，托姆泰伊的子孙，拿西的子孙[b]，哈提法的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里列出六个家族名：底大、巴库斯、塞拉尔、托姆泰伊、拿西和哈提法；近似对应的希伯来文本则列出三个不同的名字：利巴拿、哈甲巴和亚谷。这里以希腊文本为翻译依据，因此保留希腊文中的名字，不按希伯来平行经文改写。
    reason: alternative_reading
  - marker: b
    text: 本节若干名字十分罕见，可能反映文本传抄或音译传统上的不稳定；本译文谨慎地依照所提供的希腊文本音译。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在这类归回者名册中，该词指以某位祖先或家名为标志的宗族成员，不限于亲生儿子；译作“子孙”既保留谱系关系，也符合现代汉语名册体例。
- source_word: Δεδδά
  choice: 底大
  rationale: 按希腊文主见证音译，不以近似的希伯来平行经文“利巴拿”替换。
- source_word: Βαχούς
  choice: 巴库斯
  rationale: 依希腊文 Βαχούς 保守音译；不与希伯来平行经文中的不同名字“哈甲巴”协调。
- source_word: Σεράρ
  choice: 塞拉尔
  rationale: 按希腊文本音译，保留其与近似希伯来平行名单的差异。
- source_word: Θόμθει
  choice: 通泰
  rationale: 依希腊语音值作较自然的现代汉语音译；此名罕见，不作推测性校改。
- source_word: Νασεί
  choice: 拿西
  rationale: 直接依据所给希腊文音译，没有充分文本依据加以修订。
- source_word: Ἁτεφά
  choice: 哈提法
  rationale: 按希腊文音译，并以“哈”体现词首粗气符；不采用可能较顺但较少反映原文形式的替代音译。
