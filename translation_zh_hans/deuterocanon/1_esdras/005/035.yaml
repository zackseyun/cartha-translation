  text: 'All the temple servants and the sons of Solomon’s servants: three hundred seventy-two[a].'
translation:
  language: zh_hans
  text: 所有圣殿仆役和所罗门仆役的儿子，共三百七十二人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿仆役”和“所罗门仆役的儿子”也可译作“圣殿奴隶”和“所罗门奴隶的儿子”；希腊语称谓指依附性的服役，也可能带有奴役意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 所有……共
  rationale: πάντες统摄两个群体，并在名册语境中引出总数；汉语用“所有……共”既表达全体，也自然衔接人数。
- source_word: ἱερόδουλοι
  choice: 殿役
  rationale: 该复合词指隶属圣殿、承担殿中服役的人。“殿役”简洁地保留其制度性身份；其可能含有奴役性质，另见脚注。
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: 所罗门仆役的子孙
  rationale: υἱοί在族谱和名册中可泛指后裔，译作“子孙”比字面的“儿子”更符合此处群体名称；παῖδες可指仆役或奴仆，正文采用较不武断的“仆役”。
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: 三百七十二人
  rationale: 按原文准确译出人数，并补“人”以符合现代汉语名册表达。
theological_decisions:
- issue: 如何翻译名册中带有依附或奴役色彩的服役称谓
  choice: 正文采用“殿役”和“所罗门仆役”
  alternative: “殿奴”和“所罗门奴仆”
  rationale: 本节是在统计特定群体，并未着重论述其法律身份。正文使用自然且不过度限定的称谓，同时以脚注保留希腊词可能包含的奴役意味，避免消除原文的社会张力。
translation_notes:
  register: 采用现代、庄重而简明的名册体。“殿役”比“圣殿服务人员”凝练，也比“殿奴”少作身份上的过度判定；“子孙”符合群体谱系语境。
