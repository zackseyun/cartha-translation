  to: 他们都返回耶路撒冷和犹太其余各地，各归自己的城；他们就是那些跟随所罗巴伯、耶书亚、尼希米、撒莱亚、利撒亚、以尼纽斯、末底改、比勒撒鲁、亚斯法拉苏、波罗利乌斯、罗伊穆和巴拿等首领一同前来的。 [a]
  rationale: 修订恢复原文的句法关系：归回者返回耶路撒冷及犹太其余地区，并各归自己的城。随后将具名人物作为归回群体所随同的首领表达，保留希腊文的领袖功能而避免不必要地断言更具体的组织结构。姓名总体依希腊文本，且保留说明性脚注。
