  naturalness: 修订后以“都返回……，各归自己的城”清楚、自然地保留叙事关系；“跟随……等首领一同前来的”也符合现代汉语而不增添原文没有的历史细节。
  terminology: “耶路撒冷”“犹太”“所罗巴伯”“耶书亚”“尼希米”“末底改”等通行名称可保留。其余姓名依希腊文本音译；将“波罗利乌”补为“波罗利乌斯”，较完整对应希腊名 Βορολείου 及英语审校轨迹中的 Boroelius。脚注应继续说明姓名形式依据希腊文而非近似的希伯来文平行记载。
