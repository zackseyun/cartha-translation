base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: zh_hans
  text: 他们都返回耶路撒冷和犹太其余各地，各归自己的城；他们就是那些跟随所罗巴伯、耶书亚、尼希米、撒莱亚、利撒亚、以尼纽斯、末底改、比勒撒鲁、亚斯法拉苏、波罗利乌斯、罗伊穆和巴拿等首领一同前来的。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本名单中有几个名字的形式与《以斯拉记》和《尼希米记》中近似的希伯来文平行记载不同。这里依照《以斯得拉一书》的希腊文本翻译，没有把这些名字统一改成希伯来文形式。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回到
  rationale: 此动词在这里表示返回先前居住之地；“回到”符合现代汉语的迁返语境。希腊文虽用单数动词，但主语是随后由复数分词指明的群体，汉语自然表达为“他们各自回到”。
- source_word: τὴν λοιπὴν Ἰουδαίαν
  choice: 犹太其余各地
  rationale: λοιπή表示“其余、剩下的”；此处与耶路撒冷相对，译作“犹太其余各地”既保留范围关系，也比“其余的犹太”自然。
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: 各自回到自己的城
  rationale: 保留ἕκαστος的逐一分配含义，并以“城”对应πόλις。
- source_word: οἱ ἐλθόντες μετὰ
  choice: 这些人是同……一起来的
  rationale: 将带冠词的分词结构明确表达为前述返乡群体，并保留μετά所表示的同行关系。
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: 所罗巴伯、耶书亚
  rationale: 采用现代中文圣经语境中对这两位被掳归回时期人物的通行名称；“耶书亚”也避免与新约中的耶稣混淆。
- source_word: τῶν προηγουμένων αὐτῶν
  choice: 所列的这些人是他们的领袖
  rationale: προηγουμένων字面指走在前面或带领的人，在此最自然地表示领袖。补出“所列的这些人”，使希腊文后置属格结构在汉语中指向清楚。
- source_word: proper-name list
  choice: 尼希米、撒莱亚、利撒亚、以尼纽斯、末底改、比勒撒鲁、亚斯法拉苏、波罗利乌、罗伊穆和巴拿
  rationale: 以希腊文本的姓名次序和形式为主要依据；已有稳定中文形式者采用通行译名，其余按希腊语音译，不按《以斯拉记》或《尼希米记》的近似希伯来平行文本统一。
