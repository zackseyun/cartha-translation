base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: zh_hans
  text: 祭司、利未人和各宗族的首领中，那些见过从前殿宇[a]的长者也都来了；这座殿兴建时，他们放声呼喊，大大哭泣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文作“房屋”；这里是以“房屋”称圣殿，并将从前的殿与正在兴建的这座殿相对照。
    reason: cultural_note
  - marker: b
    text: 原文同时提到大声呼喊和强烈哭泣；这里没有进一步断定呼喊本身只是在哀号，还是包含更复杂的公众情绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαθημένων
  choice: 首领
  rationale: 该词指居于前位、主持事务的人；结合后面的宗族结构，译作“首领”自然且准确。
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: 各宗族
  rationale: 表示按父系家族或宗族编组；“各宗族”符合现代汉语，也保留群体谱系的含义。
- source_word: οἱ πρεσβύτεροι
  choice: 长者
  rationale: 语境侧重这些人年长到足以见过从前的殿，同时也可能含有群体地位；“长者”兼顾年龄与尊位。
- source_word: ἑωρακότες
  choice: 那些见过
  rationale: 希腊文完成时分词表示他们过去亲眼见过，且这一经历与当下反应相关。
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: 从前殿宇
  rationale: οἶκος字面为“房屋”，在此指从前的圣殿；“殿宇”保留建筑性称谓，又让现代读者明白所指。
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: 这座殿兴建时
  rationale: 原文表达较为紧缩，意为他们在这座新殿的建造过程中作出反应；此译法自然地保留新旧对照。
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: 放声呼喊，大大哭泣
  rationale: 原文明确并列呼喊与哭泣，不能只保留其中一种；该译法也传达强烈的公开情绪。
theological_decisions:
- issue: οἶκος在圣殿语境中的译法
  choice: 正文译“殿宇”，脚注说明字面为“房屋”
  alternative: 直译“房屋”或明确译“圣殿”
  rationale: “殿宇”既表明这里是圣所建筑，又不过度添加原文没有明说的专名；脚注保留原文以“房屋”指圣殿的惯用表达。
- issue: 呼喊所表达的是哀痛还是混合情绪
  choice: 不界定呼喊的情感性质，只并列“呼喊”与“哭泣”
  alternative: 译成“哀号”或解释为悲喜交集
  rationale: 哭泣显出哀伤，但κραυγή本身仅指大声呼喊；正文不把全部呼喊预先解释为哀号，也不擅自断定其中包含喜乐。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“长者”避免把πρεσβύτεροι仅限于正式职分；“大大哭泣”略带经文式庄重感，同时清楚传达μεγάλου所强调的强烈程度。
