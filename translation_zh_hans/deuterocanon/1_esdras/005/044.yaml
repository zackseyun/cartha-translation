base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: zh_hans
  text: 又为工程交入圣所的库房：黄金一千弥那[a]，白银五千弥那，以及一百件祭司礼服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥那”是古代的重量单位，也可据此表示价值；各时期、各地区的实际重量可能不同。
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: 献入
  rationale: 此不定式承接上下文中的奉献行为；“献入”既保留“给予”的基本意思，也自然表达财物交入圣所库房，且不额外规定正式捐献制度。
- source_word: ἱερὸν γαζοφυλάκιον
  choice: 圣所的库房
  rationale: γαζοφυλάκιον 指存放财物的库房或府库，ἱερόν 表明其属于圣所；译作“圣所的库房”比“圣库”更清楚，也避免把形容词机械译成“神圣的”。
- source_word: τῶν ἔργων
  choice: 为工程
  rationale: 属格在此最自然地表示用途或关联，所指很可能是修建、修复圣所的工程；中文用单数集合名词“工程”自然，并保留范围上的宽泛性。
- source_word: χρυσίου μνᾶς χιλίας
  choice: 黄金一千弥那
  rationale: 保留古代重量兼价值单位 μνᾶ，不换算为不确定的现代重量；按中文清单语序表达材质和数量。
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: 白银五千弥那
  rationale: 与黄金项目保持平行；“白银”是现代汉语中清楚、庄重的库存表述。
- source_word: στολὰς ἱερατικὰς
  choice: 祭司礼服
  rationale: στολή 指衣袍、服装，ἱερατικός 指祭司用途；“祭司礼服”准确而通俗，较“祭服”更直观，也不引入特定宗派术语。
- source_word: ἑκατόν
  choice: 一百套
  rationale: 数字直译；中文为成套服装补出量词“套”，使表达自然，但不改变数量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。冒号呈现库房所收财物，保留原文三个并列项目。“圣所的库房”忠实表达 ἱερὸν γαζοφυλάκιον；不采用较生硬的“神圣库房”，也不把 τῶν ἔργων 过度限定为某一项具体建筑工作。
