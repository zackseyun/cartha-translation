base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: zh_hans
  text: 此后，献上例常的供物[a]，以及为安息日、朔日和一切分别为圣的节期所献的祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“持续献上的供物”。这里的希腊词既可指持续不断，也可指按固定周期反复献上。
    reason: lexical_alternative
  - marker: b
    text: 《以斯拉记》的希伯来文平行经文强调“每日按着每日所定的数目”献燔祭；本节希腊文则较概括地列出圣历中例常的献祭。
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 这是自然的时间承接语；中文无需机械保留复数指示词，也能指向前述各事。
- source_word: προσφορὰς
  choice: 供物
  rationale: 采用宽泛的礼仪用语，表达献到上帝面前之物，并与后面的“祭”保持词义区别。
- source_word: ἐνδελεχισμοῦ
  choice: 常献的
  rationale: 该词可表示持续不断或按固定周期反复进行；“常献的”既符合祭祀语境，也不把含义限定为每日。
- source_word: θυσίας
  choice: 祭
  rationale: 此词比 προσφορά 更明确地指祭祀；译作“祭”简洁自然，并保留两词之间的区别。
- source_word: σαββάτων
  choice: 安息日
  rationale: 希腊文为复数，表示周期性出现的安息日；现代汉语以单数形式作类别名称更自然。
- source_word: νουμηνιῶν
  choice: 朔日
  rationale: 指每月新月时的宗教礼仪。“朔日”是简洁且合乎圣经礼仪语境的表达。
- source_word: ἑορτῶν
  choice: 节期
  rationale: 在祭祀历法语境中，“节期”比一般性的“节日”更准确，也符合现代中文圣经用语。
- source_word: πασῶν ἡγιασμένων
  choice: 一切分别为圣的
  rationale: 保留分词所表达的“被分别、被奉为圣”之意，而不简化为泛指性质的“神圣”。
theological_decisions:
- issue: 希腊文本的祭祀历法概述与《以斯拉记》希伯来文平行经文并不完全相同
  choice: 依照希腊文译为常献的供物，以及安息日、朔日和各圣节期所献的祭
  alternative: 按照希伯来文平行经文具体译成每日按数目献燔祭
  rationale: 本节以希腊文为主要文本依据；希伯来文平行经文只用于参照，不应据此缩窄或改写希腊文较概括的礼仪清单。
- issue: ἐνδελεχισμοῦ 所表达的是持续还是定期重复
  choice: 常献的
  alternative: 持续不断的；每日的
  rationale: “常献的”容纳持续性与固定周期性两种可能，不把原文含义过早限定为不间断或每日一次。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“朔日”“分别为圣”“供物”等词保留礼仪语境，但避免过度古雅。希腊文原句省略了谓语；中文补出“献上”，使句子完整，并依上下文表达其隐含动作。
