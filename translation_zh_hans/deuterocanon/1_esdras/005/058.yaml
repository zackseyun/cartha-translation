base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: zh_hans
  text: 他们用颂歌高声呼喊[a]，称颂主，因为他的美善和荣耀永远归于全以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们以颂歌扬声称颂主，因为他的美善和荣耀为全以色列存到永远。”希腊原文末句为凝练的礼仪性省略结构，未明说谓语；“永远归于”和“为全以色列存到永远”都是可行的自然展开。
    reason: 保留原文末句未明说谓语所带来的句法弹性，避免将其限定为持续‘临到’的动作。
lexical_decisions:
- source_word: ἐφώνησαν
  choice: 高声呼喊
  rationale: 保留动词“扬声、出声呼喊”的公开而强烈的听觉色彩；不直接译作“歌唱”，以免把上下文所暗示的方式写入动词本身。
- source_word: δι’ ὕμνων
  choice: 用颂歌
  rationale: 表达 διά 加属格的工具或方式意义；“颂歌”在现代中文敬拜语境中自然、庄重。
- source_word: εὐλογοῦντες
  choice: 称颂
  rationale: 在以人为主语、主为对象的礼仪语境中，“称颂”既贴近 εὐλογέω，也比直译“祝福主”更符合现代汉语习惯。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 希腊文本为 κύριος；此处按希腊语来源译作“主”，不反向引入希伯来神名的排印形式。
- source_word: χρηστότης
  choice: 美善
  rationale: 兼顾“良善、恩慈”的语义范围；“美善”可指主有益于人的良善品格，又不缩窄为单一的“仁慈”。
- source_word: δόξα
  choice: 荣耀
  rationale: 这是圣经语境中 δόξα 的常用对应，也适合与“美善”并列的颂赞语式。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 以简洁的时间副词表达惯用的持续意义；原文没有明说“长存”的动词，因此正文不额外强化。
- source_word: παντὶ Ἰσραήλ
  choice: 临到全以色列
  rationale: 原句为压缩的无动词结构，且 παντὶ Ἰσραήλ 为与格；“临到”自然表达主的美善与荣耀关乎并施及整个以色列，同时脚注保留其他句法展开。
theological_decisions:
- issue: 礼仪语境中的 κύριος 如何译出
  choice: 主
  alternative: 上主；耶和华
  rationale: 以现存希腊文 κύριος 为翻译锚点。“主”最直接且不把未见于该希腊文本的希伯来神名形式带入正文。
- issue: 如何展开末尾无动词的压缩句
  choice: 因为他的美善和荣耀永远临到全以色列
  alternative: 因为他的美善和荣耀为全以色列存到永远
  rationale: 原文未明确给出谓语，εἰς τοὺς αἰῶνας 与 παντὶ Ἰσραήλ 的关系也较压缩。正文采用自然且克制的中文展开，脚注保留可将“永远”理解为“长存”的另一种读法，避免把一种解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“高声呼喊”保留现场声音的力度，“称颂主”符合自然汉语。正文避免古奥虚词，也不以教派性术语解释“美善”“荣耀”或“主”。
