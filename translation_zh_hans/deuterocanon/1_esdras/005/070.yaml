base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: zh_hans
  text: 他们又设下阴谋，煽动民众，结成党派，以致建造工程在居鲁士王有生之年始终无法完工[a]；建造者被迫停工两年[b]，直到大流士作王的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“居鲁士王生命的全部期间”；也可译作“居鲁士王一生之中”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可较非人称地理解为：“建造工程停顿了两年，直到大流士作王的时候。”
    reason: alternative_reading
lexical_decisions:
- source_word: βουλάς
  choice: 设下阴谋
  rationale: 在敌对、阻挠建造的语境中，此复数名词指带有恶意的谋划；“设下阴谋”比中性的“计划”更贴合上下文。
- source_word: δημαγωγοῦντες
  choice: 煽动民众
  rationale: 该分词表示操纵、鼓动民众；此译自然地保留其负面的群众煽动含义。
- source_word: συστάσεις ποιούμενοι
  choice: 结成党派
  rationale: 该短语表示形成联合或派系；“结成党派”既体现有组织的联合，也符合这里协力反对建造工程的语境。
- source_word: ἀπεκώλυσαν τοῦ ἀποτελεσθῆναι
  choice: 以致……无法完工
  rationale: 译出主动阻挠所造成的结果，同时保留ἀποτελεσθῆναι所强调的“达到完成”之意。
- source_word: οἰκοδομήν
  choice: 建造工程
  rationale: 此处名词主要指建造这一工程或工作，而非已经建成的建筑物；“建造工程”在现代汉语中清楚自然。
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: 在居鲁士王有生之年始终
  rationale: 忠实表达“居鲁士王生命的全部期间”，并以自然汉语呈现持续阻挠的时间范围。
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: 建造的人被迫停工
  rationale: 希腊文为复数被动形式，字面指一些人被拦阻、不得继续建造；正文以“建造的人”补明语境中的所指，另以脚注保留非人称理解。
- source_word: ἔτη δύο
  choice: 两年
  rationale: 与“停工”搭配即可自然表达持续时间，无须另加繁复措辞。
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: 直到大流士作王的时候
  rationale: βασιλεία在此表示大流士的统治时期；此译是清楚、自然的现代汉语。
theological_decisions:
- issue: 末句被动形式的主语与施事
  choice: 正文按复数被动形式理解为建造的人被迫停止施工。
  alternative: 也可较非人称地理解为建造工程停顿了两年。
  rationale: εἰρχθησαν是复数被动形式，较直接地指人受到限制；但希腊文没有明说主语，因而不应掩盖把焦点放在工程停顿上的另一种理解。
- issue: “居鲁士王有生之年”的时间范围
  choice: 保留希腊文所说的居鲁士王“生命的全部期间”。
  alternative: 可按叙事语境概括为“居鲁士王在位期间”。
  rationale: 原文使用ζωή（生命）而不是βασιλεία（统治、王权；后句才使用此词），故正文不将二者等同。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“设下阴谋、煽动民众、结成党派”保留原文连续列举的力度；“有生之年始终”避免把“生命”悄然改成“在位”。末句正文贴近希腊文复数被动形式，并用脚注交代另一种自然理解。
