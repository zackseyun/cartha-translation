base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/033.yaml
  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: zh_hans
  text: 所罗门仆役的子孙[a]，亚萨斐约特的子孙，法利达的子孙，耶以利的子孙，罗宗的子孙，伊斯达埃尔的子孙，撒腓韦的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希腊文列出的几个家族名，与大致对应的马所拉文本差异显著；后者的名单较短，作：“吉德的子孙、迦哈的子孙、利亚雅的子孙。”
    reason: 说明平行文本的异文，避免将希腊文名单与较短的马所拉名单暗中协调。
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 这是家族名册中反复出现的谱系格式；译作“子孙”比逐字译作“儿子”更能自然表达某一家族或祖先的后裔。
- source_word: παίδων Σαλωμών
  choice: 所罗门仆役的子孙
  rationale: παῖς 在此行政与谱系语境中指仆役；整个短语承接 υἱοὶ，指称“所罗门仆役”的后裔。
- source_word: Σαλωμών
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的王名译法。
- source_word: Ἀσσαφειώθ
  choice: 亚萨斐约特
  rationale: 此名与马所拉平行经文没有明确对应，故依希腊文音译，不作协调。
- source_word: Φαρειδά
  choice: 法利达
  rationale: 依希腊文 Φαρειδά 音译，保留其与其他文本传统不同的形式。
- source_word: Ἰεηλεί
  choice: 耶以利
  rationale: 依希腊文音节音译，并采用符合现代中文圣经人名习惯的形式。
- source_word: Λοζών
  choice: 罗宗
  rationale: 依希腊文读音作简洁音译。
- source_word: Ἰσδαήλ
  choice: 伊斯达埃尔
  rationale: 紧贴希腊文形式音译，不擅自归并为较熟悉的希伯来名字。
- source_word: Σαφυεί
  choice: 撒腓韦
  rationale: 此罕见名字依希腊文近似音译，以保持文本可核查性。
theological_decisions:
- issue: 希腊文名单与《尼希米记》7:57马所拉平行经文的关系
  choice: 按希腊文完整翻译七个家族称谓，并用脚注说明平行经文的差异。
  alternative: 依马所拉文本协调为较短的名单：“吉德、迦哈、利亚的子孙”。
  rationale: 《以斯拉一书》应以所给希腊文为主要依据；此处差异属于文本传统问题，不应在正文中默默消除。
translation_notes:
  register: 采用现代、庄重而易懂的名册体。各家族统一译作“……的子孙”，专名以希腊文为主音译；标点以逗号连接名单，末尾用句号。
