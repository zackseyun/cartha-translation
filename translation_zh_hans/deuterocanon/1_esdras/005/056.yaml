  source_fidelity: 首句及专名处理总体忠于希腊文，并恰当地以脚注交代达马迭勒和赫马达本与平行传统的对应。不过，第二句把“都站出来”施于整串人物，弱化了希腊文单数谓语“耶书亚站出来”的句法焦点；末段“推进”也比原文“从事／做工程”略加强了推动进展的含义。
  naturalness: 原译整体通顺庄重，但姓名串后接“都站出来”，再另起句说“所有利未人”，在汉语中容易使“站出来”的范围和后面的职任关系不够清楚。将“耶书亚同……站出来”与全体利未人的共同督导职分分开，可更自然清晰。
  terminology: “利未人”“主”“圣殿”“甲篾”“希拿达”及“工程的督导”均可保留。“主的殿”对应οἶκος，“主的圣殿”对应ναός，能够保留原文的用词区别。
