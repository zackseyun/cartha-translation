base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: zh_hans
  text: 他们委派二十岁及以上的利未人负责主的各项工程[d]。于是，耶书亚同他的儿子和弟兄站出来；他的弟兄甲篾[a]，以及希拿达[b]的儿子耶书亚的众子、以利亚顿的儿子犹大的众子，也同他们的儿子和弟兄一起。所有利未人都同心协力，作工程的督导[c]，在主的殿中从事各项工程。建造的人建造了主的圣殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“达马迭勒”（Δαμαδιήλ）；平行的《以斯拉记》传统把这位利未人称为“甲篾”。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“赫马达本”（Ἡμαδαβούν），很可能对应平行希伯来传统中的人名“希拿达”。
    reason: alternative_reading
  - marker: c
    text: “工程的督导”所译的希腊词十分罕见，指督促、指导或监管劳作的人。
    reason: lexical_alternative
  - marker: d
    text: 本节希腊文两处都用“工程／工作”的复数；有些译本按语意译成单数“工程”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: 委派
  rationale: 结合“负责主的各项工程”的语境，此词指把利未人安置在职责岗位上，而不只是让他们站立。
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: 二十岁以上
  rationale: 自然表达服役年龄的下限，也保留“从二十岁起”的门槛含义。
- source_word: ἐπὶ τῶν ἔργων τοῦ κυρίου
  choice: 负责主的各项工程
  rationale: ἐπί加属格在此表示管理或负责；“各项工程”保留ἔργων的复数，并点明圣殿营建事务。
- source_word: ἔστη Ἰησοῦς
  choice: 耶书亚……都站出来
  rationale: 保留“站立、出面承担任务”的形象，同时按汉语长串主语的结构把谓语置后。
- source_word: Δαμαδιὴλ
  choice: 甲篾
  rationale: 希腊文作Δαμαδιήλ，但以斯拉传统所对应的人名是甲篾；正文采用现代中文圣经中较熟悉的形式，并以脚注交代希腊异文。
- source_word: Ἡμαδαβούν
  choice: 希拿达
  rationale: 此希腊形式很可能对应平行传统中的希拿达；采用可辨识的闪语人名形式，并注明原文形态。
- source_word: Ἰούδα τοῦ Εἰλιαδοὺν
  choice: 以利亚顿的儿子犹大
  rationale: τοῦ在姓名串中自然表示父子关系；对较不确定的以利亚顿则贴近希腊音译，不作进一步重构。
- source_word: ὁμοθυμαδόν
  choice: 同心协力
  rationale: 表达众人意志一致、协调行动，符合现代汉语且不显古奥。
- source_word: ἐργοδιῶκται
  choice: 工程的督导
  rationale: 这个罕见复合词指推动、监管工程的人；“督导”既体现监督职责，也避免“工头”等词可能带出的贬义。
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: 推进主殿里的各项工程
  rationale: 希腊语表达略显生硬，语义是积极从事并推动殿中工程；译文保留复数概念。
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: 建造的人就建造
  rationale: 保留原文同根名词与动词的重复和强调，汉语虽有重复但仍清楚庄重。
- source_word: ναὸν τοῦ κυρίου
  choice: 主的圣殿
  rationale: ναός专指圣殿或圣所；与前文οἶκος所译“主殿”稍作区别。
theological_decisions:
- issue: 在七十士译本圣殿营建语境中如何译κύριος
  choice: 主
  alternative: 耶和华
  rationale: 直接翻译依据是希腊文κύριος；译作“主”既忠于希腊见证，也不凭平行希伯来传统把神名形式直接带入正文。
- issue: 希腊人名疑有讹变时是否按平行闪语传统规范化
  choice: 对甲篾、希拿达采用平行传统支持的通行人名，对较不确定的名字贴近希腊文
  alternative: 所有名字都严格按Swete希腊形式音译为达马迭勒、赫马达本等
  rationale: 明确对应者采用通行形式有助于辨认人物，但正文脚注保留希腊见证；对应不稳的名字则避免过度重构。
- issue: “希拿达的儿子耶书亚的众子”这一姓名链的关系
  choice: 按平行传统把耶书亚理解为希拿达之子，并让“众子”隶属耶书亚
  alternative: 译作“耶书亚·希拿达本的众子”或把希拿达本作为另一个名字
  rationale: 希腊姓名链本身压缩且略含歧义；平行传统支持“希拿达的儿子耶书亚”。译文采用这一最可能的关系，但脚注提醒希腊实际形式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。长姓名串按汉语语序调整，把“都站出来”置于主语列举之后；保留“建造的人就建造”的同根重复，以反映希腊原文的强调。所有异文和罕见词说明均以[a]—[d]标入正文。
