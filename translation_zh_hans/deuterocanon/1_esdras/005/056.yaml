- from: 他们委派二十岁以上的利未人负责主的各项工程[d]。于是，耶书亚和他的儿子、弟兄，连同他的弟兄甲篾[a]，以及希拿达[b]的儿子耶书亚的众子、以利亚顿的儿子犹大的众子，和他们的儿子、弟兄，都站出来。所有利未人同心协力，作工程的督导[c]，推进主殿里的各项工程。建造的人就建造主的圣殿。
  to: 他们委派二十岁及以上的利未人负责主的各项工程[d]。于是，耶书亚同他的儿子和弟兄站出来；他的弟兄甲篾[a]，以及希拿达[b]的儿子耶书亚的众子、以利亚顿的儿子犹大的众子，也同他们的儿子和弟兄一起。所有利未人都同心协力，作工程的督导[c]，在主的殿中从事各项工程。建造的人建造了主的圣殿。
  rationale: 修订保留既有的专名规范化及全部脚注锚点，同时使“站出来”以耶书亚为明确主语，避免扩大单数ἔστη的施事范围；并将“推进”改为“从事”，较贴近ποιοῦντες εἰς τὰ ἔργα的宽泛工作义。末句改作完成式“建造了”，对应希腊文不定过去时οἰκοδόμησαν。
