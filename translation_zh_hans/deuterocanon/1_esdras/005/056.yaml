    rationale: 希腊文为单数ἔστη，直接主语是Ἰησοῦς（耶书亚）；其后的姓名串可随同于他，但不宜在中文中明确断言所有人都作“站出来”的动作。
  - severity: low
    issue: “推进主殿里的各项工程”略带原文未明说的进展、促成意味。
    rationale: ποιοῦντες εἰς τὰ ἔργα的基本意思是从事／做这些工程；前面的罕见词已表达督导、带领工作，无须再以“推进”强化。
