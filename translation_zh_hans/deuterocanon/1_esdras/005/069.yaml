base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: zh_hans
  text: 可是，当地各族缠扰犹太地的人[a]，又围困他们，阻挠他们建造[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缠扰”所译的希腊词较难确定，也可能有“依附于”“住在……中间”或“逼近压迫”的意思；下文的“围困”表明这里是敌对行动。
    reason: lexical_alternative
  - marker: b
    text: 希腊文只说“建造”，没有明说所建造的对象；从上下文看，是指重建圣殿。
    reason: contextual_clarification
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: 当地各族的人
  rationale: ἔθνη为复数，指当地周边的各族群；此译法自然地表达其族群含义，又避免采用可能带有后期特定语感的“外邦人”。
- source_word: ἐπικοιμώμενα
  choice: 纠缠住
  rationale: 该分词罕见且语义有疑难，可表示依附、住在其中或压迫逼近；结合随后“围困”所表明的敌对语境，“纠缠住”保留其紧贴、施压的关系意味，但不把具体方式说死。
- source_word: τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: 那些在犹太地的人
  rationale: 忠实保留原文宽泛的名词化表达，不额外限定为某一具体群体。
- source_word: πολιορκοῦντες
  choice: 围困他们
  rationale: πολιορκέω的基本义是围城、围困；如此翻译保留原文强烈的军事性意象。
- source_word: εἶργον
  choice: 阻挠
  rationale: 未完成时表示持续性的妨碍；“阻挠”既表达不断干扰，也不必然断言工程已被彻底制止。
- source_word: τοῦ οἰκοδομεῖν
  choice: 建造
  rationale: 希腊文只说“建造”，没有明示宾语；正文不补入“圣殿”或“殿宇”，以保留原文省略，具体对象可由上下文判断。
theological_decisions:
- issue: “建造”的隐含宾语
  choice: 正文译为“建造”，不补宾语
  alternative: 建造殿宇／建造圣殿
  rationale: 上下文明显涉及重建圣殿，但本节希腊文本身没有宾语。保留省略既忠于原文，也避免把上下文解释直接写入正文；脚注说明其所指。
- issue: ἐπικοιμώμενα所表达的敌对方式
  choice: 纠缠住
  alternative: 依附于／住在……中间／逼近压迫
  rationale: 该词在此处难解，且下一个分词“围困”明确了敌对性质。译文保留其语义张力，不将其限定为定居、结盟或单纯军事压迫。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”承接原文转折；两个分词依次处理为持续的敌对行动。正文保留“建造”的无宾语结构，并以脚注交代上下文所指。
