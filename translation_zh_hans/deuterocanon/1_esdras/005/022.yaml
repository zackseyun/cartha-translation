base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/022.yaml
  text: the sons of Kalamokalos and Onous[a], seven hundred twenty-five; the sons of Jericho, two hundred forty-five;
translation:
  language: zh_hans
  text: 卡拉摩卡洛和奥努斯的子孙[a]，七百二十五人；耶利哥的子孙，二百四十五人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 以斯拉—尼希米传统中的希伯来文平行记载与此处差异显著，大意为“伯特利和艾城的人，共二百二十三人”。《以斯得拉一书》的希腊文本在这里保存了不同的名称和人数。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在户籍式名单中，这是表示家族或群体归属的固定说法，不限于亲生儿子；译作“子孙”既保留谱系色彩，也符合现代汉语。
- source_word: Καλαμωκάλου
  choice: 加拉摩加洛
  rationale: 按希腊文专名音译，不用近似的希伯来文本地名来替换，以忠实呈现本节希腊见证。
- source_word: Ὠνούς
  choice: 奥努斯
  rationale: 按希腊文形式音译，并保留其与“加拉摩加洛”并列的结构；不擅自协调为其他地名。
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: 七百二十五人
  rationale: 直接表达希腊文基数词；补出量词“人”，使名单数字在现代汉语中自然明确。
- source_word: Ἰερήχου
  choice: 耶利哥
  rationale: 采用该著名地名在现代中文圣经传统中通行且易懂的译名。
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: 二百四十五人
  rationale: 忠实表达希腊文数字，并以“人”明确这是人口统计。
theological_decisions:
- issue: 本节希腊文本与以斯拉—尼希米传统中近似的希伯来平行文本在名称和人数上的关系
  choice: 依希腊文本译出“加拉摩加洛和奥努斯……七百二十五人；耶利哥……二百四十五人”
  alternative: 按希伯来平行文本协调为大意“伯特利和艾城的人，共二百二十三人”
  rationale: 《以斯得拉一书》的直接原文依据是希腊文本；希伯来平行材料仅供比较。本处差异显著，若加以协调，就会掩盖希腊见证本身保存的名称和数字。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。户籍名单中的 υἱοὶ 译作“子孙”，避免让读者误以为只指直接的男性子女；专名依据希腊文音译，数字后补“人”以符合汉语表达。
