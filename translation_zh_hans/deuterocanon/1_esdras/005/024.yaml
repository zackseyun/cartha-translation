base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: zh_hans
  text: 祭司中：耶书亚的儿子耶杜的子孙，归入撒拿比斯子孙之列[a]，共八百七十二人；埃米鲁斯的子孙[b][c]，共二百五十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“进入／归入撒拿比斯的子孙”；这种结构在这份户籍名单中并不寻常，可能表示家族归属。
    reason: lexical_alternative
  - marker: b
    text: 希腊名“埃米鲁斯”可能与希伯来传统中另见的祭司家族“音麦”相对应。正文直接依照希腊文本。
    reason: alternative_reading
  - marker: c
    text: 此处所提供的《马所拉文本》平行经文与这行希腊文并不紧密对应，反映《以斯得拉一书》材料次序和编排上的差异；因此正文以希腊文为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: 祭司有
  rationale: 直译为“祭司”，并用“有”自然引出户籍名单中的人数条目。
- source_word: οἱ υἱοὶ Ἰέδδου
  choice: 耶杜的子孙
  rationale: υἱοί在族谱和户籍语境中可指后裔；“子孙”比字面的“儿子们”更符合现代汉语，同时保留家族关系。
- source_word: τοῦ υἱοῦ Ἰησοῦ
  choice: 耶书亚的儿子
  rationale: 此处Ἰησοῦ是被译作“耶书亚”的犹太人名；属格关系按“耶书亚的儿子耶杜”处理。
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: 归在撒拿比斯的子孙中
  rationale: εἰς在这份名单中的用法不寻常，似乎表示家族归属；“归在……中”既通顺，又不把它过度解释为移动或目的。
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: 八百七十二人
  rationale: 按希腊文基数词直译，并补“人”以符合中文点数名单的表达。
- source_word: υἱοὶ Ἐρμήρου
  choice: 埃米鲁斯的子孙
  rationale: 以希腊文Ἐρμήρου为主要依据音译专名，不用近似的希伯来传统形式取代正文读法。
- source_word: διακόσιοι πεντήκοντα δύο
  choice: 二百五十二人
  rationale: 按希腊文基数词直接翻译，并补“人”。
