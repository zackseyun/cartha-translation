base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/031.yaml
  text: the sons of Iaeir[a], the sons of Daisan, the sons of Noeba, the sons of Chaseba, the sons of Kazera, the sons of Ozeiou, the sons of Phinoe, the sons of Asara, the sons of Basthai, the sons of Assana, the sons of Manei, the sons of Napheisei, the sons of Akouph, the sons of Acheiba, the sons of Asour, the sons of Pharakem,
translation:
  language: zh_hans
  text: 雅伊尔的子孙[a]，戴桑的子孙，诺埃巴的子孙，哈塞巴的子孙，卡泽拉的子孙，奥泽尤的子孙，菲诺埃的子孙，阿萨拉的子孙，巴斯泰的子孙，阿萨纳的子孙，马内伊的子孙，纳斐塞伊的子孙，阿库夫的子孙，阿海巴的子孙，阿苏尔的子孙，法拉肯的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》7:46的希伯来文平行经文在这里列出不同的名字：“殿役：西哈的子孙、哈苏巴的子孙、答巴俄的子孙。”《以斯拉一书》在此保存了一份差异很大的希腊文名单，因此正文依从希腊文原文，没有与希伯来文平行经文协调。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在此家族名录中，该词指以某位祖先为名的家族群体；“子孙”既保留谱系关系，也比逐项使用“儿子”更符合现代汉语名录表达。
- source_word: Ἰαείρου
  choice: 雅伊尔
  rationale: 依希腊语形式音译，不以仅属近似平行经文的希伯来名单取代。
- source_word: Δαισάν
  choice: 戴桑
  rationale: 按希腊语读音音译，避免与差异显著的希伯来平行名单强行协调。
- source_word: Νοεβά
  choice: 诺埃巴
  rationale: 直接依据希腊语形式音译。
- source_word: Χασεβά
  choice: 哈塞巴
  rationale: 按通行现代汉语方式转写希腊语专名；词首Χ以“哈”近似表达。
- source_word: Καζηρά
  choice: 卡泽拉
  rationale: 保守地依希腊语形式音译，不作未经证实的希伯来化归并。
- source_word: Ὀζείου
  choice: 奥泽尤
  rationale: 将希腊语属格形式还原为名单中的人名并音译，不擅自规范为其他熟知名字。
- source_word: Φινόε
  choice: 菲诺埃
  rationale: 依据希腊语形式音译。
- source_word: Ἀσαρά
  choice: 阿萨拉
  rationale: 依据希腊语形式音译。
- source_word: Βασθαί
  choice: 巴斯泰
  rationale: 依据希腊语形式音译，并以“泰”反映末尾双元音。
- source_word: Ἀσσανά
  choice: 阿萨纳
  rationale: 依据希腊语形式音译；汉字音译不另行表现双写辅音。
- source_word: Μανεί
  choice: 马内伊
  rationale: 依据希腊语形式音译，保留末尾元音组合。
- source_word: Ναφεισεί
  choice: 纳斐塞伊
  rationale: 依据希腊语形式音译，不根据不对应的希伯来名单推定别名。
- source_word: Ἀκούφ
  choice: 阿库夫
  rationale: 依据希腊语形式音译。
- source_word: Ἀχειβά
  choice: 阿海巴
  rationale: 依据希腊语形式音译。
- source_word: Ἀσούρ
  choice: 阿苏尔
  rationale: 依据希腊语形式音译，不擅自等同于其他常见专名。
- source_word: Φαρακέμ
  choice: 法拉肯
  rationale: 依据希腊语形式音译；末尾μ按汉语音节习惯以“肯”近似转写。
