base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: zh_hans
  text: 凡向上帝许过愿的人，都从正月的月朔起开始向上帝献祭；上帝的殿还没有建成。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正月的月朔”也可译作“正月初一”。“月朔”指新月日，即一个月的第一日。
    reason: lexical_alternative
  - marker: b
    text: 《以斯拉记》的希伯来文平行段落在这里有所不同，讲的是守住棚节，并按规定每日献燔祭。正文依从《以斯得拉一书》独有的希腊文措辞。
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: 凡……的人，都
  rationale: 表达不定关系代词的广泛、包括性范围，在现代汉语中自然清楚。
- source_word: εὔξαντο εὐχήν
  choice: 许过愿
  rationale: 该同源动词与宾语结构指向上帝许愿，而非一般祷告；汉语用“许愿”即可自然传达其意义，无须生硬重复。
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: 从正月初一
  rationale: νουμηνία指月朔，即一个月的第一日；结合“第一个月”，译作“正月初一”既保留历法意义，也便于现代读者理解。
- source_word: ἤρξαντο προσφέρειν θυσίας τῷ θεῷ
  choice: 开始向上帝献祭
  rationale: 保留动作起始的意味，并以“献祭”准确表达祭祀性供献。
- source_word: ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο
  choice: 上帝的殿还没有建成
  rationale: 按希腊文译作“建成”，不擅自补入历史语境所暗示的“重建”。
theological_decisions:
- issue: 末句由καί连接时，与前句是并列还是让步关系
  choice: 用分号并加“那时”呈现并列事实，同时让语境自然显出张力
  alternative: 译为“尽管上帝的殿还没有建成”
  rationale: 希腊文形式上是简单并列。中文若直接采用“尽管”，会明确化其虽可能但并非语法明说的让步关系；当前译法保留祭祀已经开始而圣殿尚未建成的神学与叙事张力。
- issue: 与《以斯拉记》希伯来文平行材料的差异
  choice: 正文严格依从《以斯得拉一书》的希腊文，保留许愿者、正月初一献祭及圣殿尚未建成的陈述
  alternative: 依照希伯来文平行材料改写为住棚节和每日规定的燔祭
  rationale: 希腊文是本节的首要文本依据；平行希伯来文内容差异明显，不应据此协调或取代希腊文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“正月初一”自然表达第一月的月朔；“上帝的殿”保持原文重复。“那时”仅作时间衔接，不将καί强行解释为明确的让步连词。所有脚注标记均置于正文。
