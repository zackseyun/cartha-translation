  text: the sons of Bebai[a], six hundred thirty-three; the sons of Argai, one thousand three hundred twenty-two.
translation:
  language: zh_hans
  text: 比拜的子孙，共六百三十三人；亚尔该[a]的子孙，共一千三百二十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“亚尔该”，人数为一千三百二十二；近似的马所拉文本平行名单作“押甲”，人数为一千二百二十二。这表明《以斯得拉一书》此处与希伯来文名单并不完全一致。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在户籍式名单中，该词表示由某位先祖而出的家族或宗族成员；译作“子孙”既保留谱系含义，也符合现代中文名单的表达习惯。
- source_word: Βηβαί
  choice: 比拜
  rationale: 按希腊文 Βηβαί 音译，并采用简洁、自然的中文圣经人名形式。
- source_word: ἑξακόσιοι τριάκοντα τρεῖς
  choice: 六百三十三人
  rationale: 准确表达希腊文基数词；补出量词“人”，使中文户籍名单自然清楚。
- source_word: Ἀργαί
  choice: 亚该
  rationale: 正文依据主要希腊文本 Ἀργαί 音译，不以近似的马所拉平行经文“押甲”替换。
- source_word: χίλιοι τριακόσιοι εἴκοσι δύο
  choice: 一千三百二十二人
  rationale: 直接依照希腊文本的数字翻译；虽与近似的马所拉平行经文不同，仍保留主要文本的读法。
