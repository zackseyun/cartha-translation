base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/012.yaml
  text: the sons of Iolamus[a], two; the sons of Zatou, nine hundred seventy; the sons of Chorbe, seven hundred five; the sons of Banei, six hundred forty-eight[c][b];
translation:
  language: zh_hans
  text: 约拉摩的子孙二人；扎图[a]的子孙九百七十人；霍尔贝[b]的子孙七百零五人；巴内[c]的子孙六百四十八人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“扎图”；希伯来并行传统作“扎突”。
    reason: alternative_reading
  - marker: b
    text: 希腊文“霍尔贝”与希伯来并行名单的对应关系不能确定；有些并行名单在此处记载另一个家族名。
    reason: textual_variant
  - marker: c
    text: 希腊文作“巴内”；希伯来并行传统作“巴尼”，所记人数也不同。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在这份按宗族统计的名单中，该词表示某位祖先或家族的后裔；译作“子孙”比逐字译作“儿子”更符合现代汉语，也保留谱系含义。
- source_word: Ἰωλάμου
  choice: 约拉摩
  rationale: 依希腊文专名音译，不以并行名单中的其他名称替换。
- source_word: δύο
  choice: 二人
  rationale: 准确表达人数，并补出汉语计数所需的量词。
- source_word: Ζατοῦ
  choice: 扎图
  rationale: 正文以希腊文形式为准音译；与希伯来传统常见的“扎突”形式之关系在脚注说明。
- source_word: ἐννακόσιοι ἑβδομήκοντα
  choice: 九百七十人
  rationale: 按希腊文准确翻译人数。
- source_word: Χορβέ
  choice: 霍尔贝
  rationale: 按现存希腊文音译；因其与希伯来并行名单难以确切对应，不在正文中擅自协调。
- source_word: ἑπτακόσιοι πέντε
  choice: 七百零五人
  rationale: 按希腊文准确翻译人数，采用自然的现代汉语数字表达。
- source_word: Βανεί
  choice: 巴内
  rationale: 正文依希腊文形式音译；希伯来并行传统的名称形式及人数差异留在脚注中。
- source_word: ἑξακόσιοι τεσσεράκοντα ὀκτώ
  choice: 六百四十八人
  rationale: 按希腊文准确翻译人数。
