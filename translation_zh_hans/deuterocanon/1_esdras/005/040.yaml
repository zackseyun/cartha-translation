base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: zh_hans
  text: 尼希米和阿他利亚斯吩咐他们，不可享用圣物，直到有一位披戴“显明”和“真理”的祭司兴起[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明”和“真理”传统上指祭司所用的乌陵和土明。
    reason: 说明希腊语义译法与希伯来传统术语之间的关系。
  - marker: b
    text: 这里的意思是：在能借此作出明确裁决的祭司兴起以前，他们不可吃祭司所得的神圣供物。
    reason: 解释“享用圣物”在祭司礼仪和叙事语境中的具体含义，而不把“合资格”作为正文以外的定义。
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: 吩咐他们
  rationale: 在“不可以……”这一间接命令的语境中，“吩咐他们”自然传达了话语的指令作用，比直译为“对他们说”更清楚。
- source_word: Ναιμίας
  choice: 尼希米
  rationale: 采用该人物在中文圣经传统中的通行译名，并与相关平行叙事相衔接。
- source_word: Ἀθαρίας
  choice: 亚他利亚
  rationale: 按希腊文人名音译，不径自改成可能的闪语对应名，以维持希腊文本的优先地位。
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: 不可享用圣物
  rationale: μετέχω表示分享、取用或有分；结合祭司礼仪语境，“享用圣物”既可指食用分别为圣的祭司供物，也不把希腊文所保留的范围缩得过窄。
- source_word: ἕως ἀναστῇ ἱερεὺς
  choice: 直到有一位……祭司兴起
  rationale: 保留ἕως加虚拟式所表达的未来未定情形；“兴起”也对应ἀνίστημι，而不把它弱化为单纯“出现”。
- source_word: ἐνδεδυμένος
  choice: 披戴
  rationale: 体现完成时中间语态分词所表达的穿戴状态，并保留礼仪性的庄重语域。
- source_word: τὴν δήλωσιν
  choice: “显明”
  rationale: δήλωσις指使某事清楚、显露或宣明；“显明”紧扣希腊词义。加引号表明它在这里与“真理”共同构成专门的祭司礼仪用语。
- source_word: τὴν ἀλήθειαν
  choice: “真理”
  rationale: 按ἀλήθεια的通常含义翻译，同时借引号显示它在这一配对表达中具有专门指称，而不直接以希伯来传统名称取代希腊措辞。
theological_decisions:
- issue: δήλωσις καὶ ἀλήθεια应按希腊词义翻译，还是直接采用希伯来传统名称“乌陵和土明”
  choice: 正文译作“显明”和“真理”，脚注说明通常所指的祭司物件是乌陵和土明。
  alternative: 正文直接译作“乌陵和土明”
  rationale: 《以斯得拉一书》以希腊文本为首要依据；希腊文在此使用具有语义的对应词，而不是音译希伯来名称。正文保留希腊表达，可避免无声地与希伯来平行经文协调；脚注则交代极可能的传统所指。
- issue: τῶν ἁγίων具体指一切圣物，还是祭司可食用的神圣供物
  choice: 正文保留较宽的“圣物”，脚注说明在本语境中尤其指祭司享用的神圣供物。
  alternative: 正文明确译作“祭司的圣食”
  rationale: 希腊复数表达本身较宽；上下文支持祭司供物的解释，但不宜在正文中抹去原文的概括性。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“吩咐”“圣物”“祭司兴起”“披戴”等措辞维持经文的礼仪语域；“显明”和“真理”加引号，以帮助普通读者辨认这是一组专门称谓，同时由脚注补充传统名称。
