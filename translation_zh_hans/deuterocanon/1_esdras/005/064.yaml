base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: zh_hans
  text: 他们得知，那些被掳归来的人正在为以色列的主上帝建造圣殿[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些被掳归来的人”也可译作“那些出自被掳之中的人”或“被掳者”。
    reason: lexical_alternative
  - marker: b
    text: “为以色列的主上帝建造圣殿”也可译作“建造献给以色列的主上帝的圣殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: 得知
  rationale: 此处不定过去时表示他们获知或确知了正在发生的事。“得知”符合叙事语境，也不把含义过度强化为深入理解。
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: 那些从被掳之地归来的人
  rationale: ἐκ 表示从某种处境或地方出来；结合重建圣殿的语境，译文明确表达这些人是从被掳之地归来的，同时用脚注保留较简短的译法。
- source_word: οἰκοδομοῦσιν
  choice: 正在……建造
  rationale: 现在时在间接陈述中表示当时持续进行的行动，中文用“正在”清楚呈现这一进行状态。
- source_word: τὸν ναόν
  choice: 圣殿
  rationale: ναός 在这里指为以色列的上帝重建的殿宇；“圣殿”是现代中文圣经语境中清楚而自然的对应词。
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: 为以色列的主上帝
  rationale: 与建造动词连用的与格可表达对象、归属或目的。“为……建造”在中文中自然，并保留圣殿是为以色列的主上帝而建之意。
theological_decisions:
- issue: κύριος 在“以色列的主上帝”这一称号中的译法
  choice: 主
  alternative: 主人
  rationale: “主上帝”符合该固定圣经称号的语境，也维持七十士译本中 κύριος 指以色列上帝时的传统关联，不引入额外教派解释。
- issue: 建造圣殿所用与格的关系
  choice: 为以色列的主上帝建造
  alternative: 建造献给以色列的主上帝的圣殿
  rationale: 希腊语与格可理解为受益、目的或归属关系；正文采用自然的“为”，脚注保留强调奉献或归属的译法，不排除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得知”适合叙事推进；“从被掳之地归来的人”让普通读者容易理解 οἱ ἐκ τῆς αἰχμαλωσίας 的所指；“主上帝”和“圣殿”保留经文语体而不过分古雅。
