base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: zh_hans
  text: 他们来到犹大和耶路撒冷后的第二年，二月初一[a]，为上帝的圣殿奠了根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“第二个月的新月日”，即该月初一。
    reason: 保留νουμηνία兼具月朔日期与新月含义的语义。
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: 奠了根基
  rationale: 该动词表示奠基或建立；与圣殿搭配时，“奠了根基”既准确又符合现代汉语习惯。
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: 上帝的圣殿
  rationale: ναός在此直接指敬拜上帝的圣殿建筑；“圣殿”比“上帝的殿”更自然明确，也不改变所指。
- source_word: τῇ νουμηνίᾳ τοῦ δευτέρου μηνὸς
  choice: 二月初一
  rationale: νουμηνία指新月之日，也就是一个月的第一日；译为“二月初一”清楚表达此处的历法日期，并以脚注保留“新月日”的字面表达。
- source_word: τοῦ δευτέρου ἔτους
  choice: 第二年
  rationale: 忠实保留希腊文的年代标记。
- source_word: ἐν τῷ ἐλθεῖν
  choice: 来到……后
  rationale: 带ἐν的冠词化不定式在此表达时间关系；上下文中“来到……后”自然显示奠基发生于抵达之后。
- source_word: εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: 来到犹太和耶路撒冷
  rationale: εἰς表达朝向并进入；现代汉语用“来到”简洁涵盖抵达该地区和城市之意。
theological_decisions:
- issue: ναός在重建圣殿语境中的译法
  choice: 上帝的圣殿
  alternative: 上帝的殿
  rationale: 希腊文明确使用通常指圣所或圣殿的ναός；“圣殿”准确、庄重，不引入额外教派含义。
- issue: νουμηνία的历法与礼仪含义
  choice: 正文译“初一”，脚注注明“新月日”
  alternative: 正文直译“新月日”
  rationale: 该词既是新月，也指月朔之日。“初一”让现代读者立即明白日期，脚注则保留原文的月相及礼仪色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。调整希腊语语序，将抵达时间置于句首，使“第二年二月初一”的日期关系清楚；不采用所给英文脚注中与其正文不相符的说明，而按希腊原文设置脚注。
