  text: the gatekeepers[a], four hundred; the sons of Ishmael, sons of Lakubath[b], one thousand.
translation:
  language: zh_hans
  text: 守门人四百名；以实玛利的子孙、拉古巴特的子孙[a]，一千名。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉古巴特”也可能是平行归回者名册中较常见的“亚谷”或“拉谷”的另一种名字形式。
    reason: lexical_alternative
  - marker: b
    text: 本节的希腊文本列出“以实玛利的子孙、拉古巴特的子孙，一千名”。《尼希米记》第7章的希伯来文平行名册在此处与它不一致，因此正文依照希腊文本，不与马所拉文本的名册强行统一。
    reason: textual_variant
lexical_decisions:
- source_word: οἱ θυρωροί
  choice: 守门人
  rationale: θυρωρός指看守门或城门的人；在圣殿或群体名册的语境中，“守门人”自然、清楚，也能体现其职分。
- source_word: τετρακόσιοι
  choice: 四百名
  rationale: 直译基数词，并以量词“名”配合人员统计。
- source_word: οἱ Ἰσμαήλου
  choice: 以实玛利的子孙
  rationale: 希腊文是属格家族称谓，字面近于“属以实玛利的人”；名册语体中译作“以实玛利的子孙”最为明确。
- source_word: υἱοὶ Λακουβάτου
  choice: 就是拉古巴特的子孙
  rationale: υἱοί明确意为“儿子／子孙”；Λακουβάτου依本节希腊文本音译为“拉古巴特”。加入“就是”表达其与前一属格家族称谓之间可能的同位关系，同时不按平行名册改名。
- source_word: χίλιοι
  choice: 一千名
  rationale: 直译基数词；按希腊文紧接前述家族称谓，作为该组人数。
