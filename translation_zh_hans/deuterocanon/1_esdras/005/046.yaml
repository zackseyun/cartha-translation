base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: zh_hans
  text: 到了第七个月，以色列子孙[a]各人都在自己的地方[b]，他们便同心聚集在东边第一道门的宽阔空地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”。希腊文直译为“以色列的儿子们”，是表示全体以色列民的家族性称呼。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文平行记载强调以色列人已经住在各自的城里；这里的希腊文则说各人在“自己的地方”，没有进一步指明是家中还是城中。
    reason: cross_reference
  - marker: c
    text: “宽阔空地”也可译作“宽阔处”或“广场”；希腊文指一处宽敞的开放空间。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνστάντος
  choice: 到了
  rationale: 该词在属格独立结构中表示第七个月来到或开始；“到了”是自然、简洁的现代汉语表达。
- source_word: τοῦ ἑβδόμου μηνός
  choice: 第七个月
  rationale: 保留原文明确的历法序数，不另行推定月份名称。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留希腊文的家族性、盟约性表达，同时符合现代中文圣经语体；也可按集合意义译作“以色列人”。
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: 各人都在自己的地方
  rationale: 贴近原文不明确具体地点的措辞，不擅自补成“家中”或“城里”；复数中性形式表示各自所属之处。
- source_word: συνήχθησαν
  choice: 聚集
  rationale: 自然呈现共同集合的叙事动作。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 不仅表示一同在场，也传达意向一致、齐心合意的含义。
- source_word: εἰς τὸ εὐρύχωρον
  choice: 宽阔空地
  rationale: 兼顾空间宽广与开放的含义，不把场所过度限定为正式的广场。
- source_word: τοῦ πρώτου πυλῶνος
  choice: 第一道门
  rationale: 按希腊文直译，保留建筑指称可能存在的不确定性，不解释为“正门”或“前门”。
- source_word: τοῦ πρὸς τῇ ἀνατολῇ
  choice: 东边
  rationale: 简洁表达该门的东方位置或朝向，不强行判定更细的建筑关系。
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ 的家族性男性表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文的亲属与群体身份意象；脚注说明其集合意义，避免读者误以为只包括男性，也不抹平原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“同心聚集”保留 ὁμοθυμαδόν 的共同意向；“自己的地方”和“第一道门”则刻意保留原文在地点与建筑细节上的不确定性。脚注标记均置于对应词语之后。
