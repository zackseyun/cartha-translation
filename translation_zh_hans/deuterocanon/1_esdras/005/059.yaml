base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: zh_hans
  text: 全体百姓都吹响号角，高声欢呼，因主的殿得以建立[a]而赞美主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以建立”也可译作“得以重建”。希腊文意为“兴起、竖立”，可泛指主的殿被建造或恢复。
    reason: 说明ἐγέρσις的词义范围，保留其可指兴建或恢复的含义，而不将其限定为某一施工阶段。
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: 全体百姓
  rationale: 保留集合名词及 πᾶς 所表达的整体性；“全体百姓”庄重而自然。
- source_word: ἐσάλπισαν
  choice: 吹响号角
  rationale: 该动词本身表示吹奏号角；中文补出宾语可清楚传达其含义，又不额外限定号角数量。
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: 高声欢呼
  rationale: 兼顾 βοάω 的呼喊义与 φωνῇ μεγάλῃ 的“大声”含义；结合庆典语境译为“欢呼”自然贴切。
- source_word: ὑμνοῦντες
  choice: 赞美
  rationale: 保留向上主颂赞的含义，但不把该分词过度限定为歌唱。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 希腊文为 κύριος；在敬拜语境中按希腊文本直译为“主”。
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: 因为……被建立起来了
  rationale: ἐγέρσις 的基本意象是“使之起来、建立”；此处用自然中文表达原因，同时保留可指建造或重建的宽度。
- source_word: τοῦ οἴκου Κυρίου
  choice: 主的殿
  rationale: οἶκος 字面为“房屋”，但在此明确指敬拜建筑；“主的殿”既自然，也保留圣经传统表达。
theological_decisions:
- issue: 圣殿语境中 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 主要文本是希腊文 κύριος，并未直接写出希伯来神名；译为“主”既忠实于文本，也不额外引入特定译名传统。
- issue: ἐγέρσει 所指的建造阶段
  choice: 被建立起来
  alternative: 重建；兴建；奠基
  rationale: 希腊词可描绘殿被竖立、建起，在历史语境中也可能包含重建之意；正文不将其缩窄为单一施工阶段，脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声欢呼”符合庆典场景；“主的殿”比“主的房屋”更自然，同时准确标明此处所指为圣殿。脚注标记已置于正文对应句末。
