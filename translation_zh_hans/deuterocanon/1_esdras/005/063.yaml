base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: zh_hans
  text: 犹大和便雅悯支派的敌人[a]听见后，就来弄清那号角声[b]是怎么回事，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“支派”是单数，后面却并列“犹大和便雅悯”；也可按意义译作“犹大和便雅悯两个支派的敌人”。
    reason: alternative_reading
  - marker: b
    text: 直译：“号角的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见后
  rationale: 不定过去时分词交代主句动作发生的情境和先后关系；译作“听见后”自然地表达“他们听见以后”。
- source_word: οἱ ἐχθροὶ
  choice: 敌人
  rationale: 原文是带冠词的名词，指与犹大和便雅悯为敌的人；不额外添加原文没有的物主成分。
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: 犹大和便雅悯支派的
  rationale: φυλή在希腊文中为单数，却同时连接“犹大”和“便雅悯”；正文保留较贴近原文的单数形式，并用脚注说明汉语中也可按意义理解为两个支派。
- source_word: ἦλθοσαν
  choice: 就来
  rationale: 直陈式叙事动词表示他们来到现场；“就来”也自然承接前面的分词情境。
- source_word: ἐπιγνῶναι
  choice: 弄清
  rationale: 不定式表示目的，在此指前来查明、了解号角声的缘由；“弄清”符合现代汉语叙事。
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: 那号角声是怎么回事
  rationale: φωνή与号角连用时自然译为“声”；τίς在此询问声音的性质或缘由，译作“是怎么回事”既通顺，也不武断限定为某一种具体含义。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“弄清……是怎么回事”较口语化但不轻佻，能准确表达前来查明的目的。句末保留逗号，以反映所给希腊文本在此处仍与下文相连。
