base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
translation:
  language: zh_hans
  text: 哈吉亚的子孙[a]，法卡列特·萨贝耶的子孙，萨罗泰的子孙，梅赛亚斯的子孙，加斯的子孙，阿杜斯的子孙，苏巴斯的子孙，阿斐拉的子孙，巴罗泰斯的子孙，萨法格的子孙，阿隆的子孙；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》7:51的希伯来文平行经文在这里短得多，只作：“乌撒的子孙、巴西亚的子孙、比赛的子孙。”《以斯拉一书》保存的是一份扩展的希腊文名单，因此本译文依从希腊文中的名字，不与希伯来文协调一致。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在这份家族名册中，该词是表示某一家族成员或后裔的惯用格式；“子孙”既符合现代汉语，也避免把名单中的人严格限定为亲生儿子。
- source_word: Ἁγιά
  choice: 哈吉亚
  rationale: 依希腊文形式音译，不与较短的希伯来文平行经文强行协调。
- source_word: Φακαρὲθ Σαβειή
  choice: 法卡列特·萨贝耶
  rationale: 按希腊文音译，并用间隔号表明原文中两个紧密相连的名称成分，同时不武断判定其必为单一复合名。
- source_word: Σαρωθεί
  choice: 萨罗泰
  rationale: 保守地依希腊文音译，保留其与其他文本传统对应关系的不确定性。
- source_word: Μεισαίας
  choice: 迈赛亚斯
  rationale: 依希腊文形式音译专名。
- source_word: Γάς
  choice: 加斯
  rationale: 直接按简短的希腊文形式音译，不据其他传统改名。
- source_word: Ἀδδούς
  choice: 阿杜斯
  rationale: 依希腊文形式音译专名。
- source_word: Σουβάς
  choice: 苏巴斯
  rationale: 依希腊文形式音译，反映 ου 的读音。
- source_word: Ἀφερρά
  choice: 阿斐拉
  rationale: 依希腊文形式作适合现代普通话的音译。
- source_word: Βαρωθείς
  choice: 巴罗泰斯
  rationale: 依希腊文形式音译，不根据近似的希伯来文平行材料归并。
- source_word: Σαφάγ
  choice: 萨法格
  rationale: 依希腊文的辅音与元音形式音译。
- source_word: Ἀλλών
  choice: 阿隆
  rationale: 依希腊文形式音译；不以希伯来文平行经文中的“比赛”替换。
