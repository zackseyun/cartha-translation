base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: zh_hans
  text: 祭司[a]，非尼哈的子孙、亚伦的子孙：耶书亚[b]，约萨达的儿子，西莱雅的后裔；还有约雅金，所罗巴伯的儿子，撒拉铁的后裔，出自大卫家，出自法勒斯的家系。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表示“儿子”的词在家谱中也可泛指“子孙、后裔”，不一定都是直接的父子关系。
    reason: lexical_alternative
  - marker: b
    text: “耶书亚”所对应的希腊文名字也可译作“约书亚”；在其他语境中，同一希腊文名字通常译作“耶稣”。此处按被掳归回时期祭司的姓名译作“耶书亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: 祭司
  rationale: 带冠词的复数名词在这里引出祭司谱系；汉语以集合性的“祭司”自然表达复数。
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: 亚伦的子孙、非尼哈的子孙
  rationale: υἱοί在家谱中可指跨越数代的后裔，因此译作“子孙”；汉语按由远及近的谱系顺序排列，使关系清楚，同时保留两个并列的血统称谓。
- source_word: Ἰησοῦς
  choice: 耶书亚
  rationale: 此处指被掳归回时期的祭司人物；“耶书亚”符合旧约人物的通行汉语名称，也避免与新约中的“耶稣”混淆。
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: 约萨达的儿子，西莱雅的后裔
  rationale: 冠词加属格构成谱系链。第一层用“儿子”，第二层用较宽泛的“后裔”，既使汉语自然，也不武断断定家谱没有省略世代。
- source_word: Ἰωακεὶμ
  choice: 约雅金
  rationale: 采用现代汉语圣经姓名的常见形式，并与希腊文Ἰωακείμ相称。
- source_word: ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: 所罗巴伯的儿子，撒拉铁的后裔
  rationale: 以汉语清楚呈现属格谱系链；第二层保留可能跨代的开放性。
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: 出自大卫家
  rationale: οἶκος在此表示家族或王朝谱系，“大卫家”是准确而自然的固定表达。
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: 属于法勒斯的宗族
  rationale: γενεά在此指血统、宗族，而非同时代的“一代人”；“宗族”适合家谱语境。
theological_decisions:
- issue: 谱系中的“儿子”是否必指直接父子关系
  choice: 近层关系译作“儿子”，较远层译作“后裔”，并以脚注说明家谱用语的范围
  alternative: 各层一律译作“儿子”或一律译作“后裔”
  rationale: 原文υἱοί及省略名词的属格谱系结构可以涵盖广义后裔关系。译文既保留明确的谱系结构，也不把可能有世代省略的家谱强行解释为每层都是直接父子。
- issue: 祭司谱系与大卫谱系的并置
  choice: 保留原文并列及其标点张力，不增补“其中一位是祭司”或其他解释
  alternative: 重组句子，明确限定哪一人物属于祭司或大卫家
  rationale: 希腊文以并列方式罗列人物和谱系，句法衔接略显压缩；不应凭译者推断消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的谱系表达。人名使用简体中文圣经传统中较常见的形式；保留原文名单式、未完句式的特点，以句号收束当前经节。
