    rationale: 冒号后的内容看似是“未能查到”的对象，但该内容正是被列举出来的人。原文的οὐχ εὑρέθησαν省略了所未找到的对象；结合上下文，最可能是家谱或资格登记。正文宜以“他们的记录未能查到”作必要的最小补足，脚注继续说明原文省略。
