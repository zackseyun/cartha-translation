translation_notes:
  register: 采用现代、庄重而易懂的简体中文。名单中的υἱοί译作“子孙”，避免让读者误以为只指亲生儿子；“未能查到”保留原文省略，不在正文中补定为族谱或名册。所有专名以希腊文主要见证为准。
