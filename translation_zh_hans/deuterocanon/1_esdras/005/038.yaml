revisions:
- from: 祭司中[a]，有些人声称自己有祭司的身份，却未能查到：俄备雅的子孙、亚革波斯的子孙，以及雅多斯的子孙；雅多斯娶了法海色勒代众女儿中的奥吉雅为妻[b]。
  to: 祭司中，那些自称有祭司资格、但他们的记录未能查到的人是：俄备雅的子孙、亚革波斯的子孙和雅多斯的子孙；雅多斯娶了法海色勒代的一个女儿奥吉雅为妻[a]。
  rationale: 为避免汉语中“未能查到”与随后所列人名直接相连而造成歧义，正文以“他们的记录”作语境所要求的最小补足；脚注明确说明希腊文原句本身省略该对象。将资格表述简化为“自称有祭司资格”，并重组名单与雅多斯婚配从句，使其对应希腊文的句法关系。两条原脚注均保留，但因修订文本只有一个适当锚点而合并为同一脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:22:24Z'
review_pass:
  verdict: revise
  source_fidelity: 译文大体忠于希腊文的祭司资格与家族名单，但“却未能查到：……子孙”的句法会使“未能查到”直接指向随后列出的人名，造成逻辑不顺。希腊文的被动式虽省略对象，语境中所未查到的应是其谱系或资格登记；在汉语中须以最小限度补足“记录”，并保留脚注对省略现象的说明。
  naturalness: “有些人声称自己有祭司的身份”略显冗长且“身份”不如“祭司资格”准确。将名单关系改为“……是……”并将雅多斯的婚姻关系紧接其家族名称，可使现代汉语更清楚、庄重。
  terminology: “祭司资格”准确传达ἱερωσύνη在本句中作为所主张之资格的含义；“子孙”适合族谱名单。专名继续依希腊文主要文本音译，不与马所拉文本的近似平行记载调和。
