base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: zh_hans
  text: 祭司中，那些自称有祭司资格、但他们的记录未能查到的人是：俄备雅的子孙、亚革波斯的子孙和雅多斯的子孙；雅多斯娶了法海色勒代的一个女儿奥吉雅为妻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“未能查到”处采用省略说法；很可能是指未查到他们的族谱或祭司名册记录，可参照《以斯拉记》的平行记载。这里的人名与马所拉文本中的近似平行记载不同；本译文依照《以斯拉一书》的希腊文本音译，不据《以斯拉记》或《尼希米记》加以统一。
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: 祭司中
  rationale: ἐκ加属格在此表示这一组人属于祭司群体；“祭司中”符合现代汉语名单体表达。
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: 有些人声称自己有祭司的身份
  rationale: ἐμποιούμενοι表示提出或主张权利；这里涉及祭司资格，译文保留“声称”的意味，不预先判定其主张真伪。
- source_word: οὐχ εὑρέθησαν
  choice: 却未能查到
  rationale: 希腊文没有明说未查到的具体对象。汉语采用略带省略色彩的“未能查到”，正文不擅自补入族谱或登记记录，脚注说明其可能含义。
- source_word: υἱοὶ Ὀββειά / Ἀκβώς / Ἰαδδοὺς
  choice: 俄备雅／亚革波斯／雅多斯的子孙
  rationale: υἱοί在族谱名单中可泛指后裔；“子孙”比逐字的“儿子”更能自然表达家族群体。专名依七十士译本希腊文音译，不与近似的马所拉平行经文调和。
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: 雅多斯娶了……奥吉雅为妻
  rationale: λαμβάνω加γυναῖκα是“娶妻”的惯用表达。属格单数分词τοῦ λαβόντος最自然地回指紧邻的单数专名Ἰαδδοὺς，故明确译出主语。
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: 法海色勒代众女儿中的
  rationale: 表示奥吉雅出自法海色勒代的女儿群体。专名按希腊文本音译；其底层闪语形式不能确定。
