    reason: alternative_reading
  - marker: b
    text: 希腊文中的“阿尔塞弗雷伊特”这一名字不确定；近似的希伯来平行文本可能指向“哈里弗”。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在归回者名册中指以某位祖先或家族首领为名的宗族成员；译作“子孙”比字面的“儿子们”更符合现代汉语名册语境。
- source_word: Ἀννείς
  choice: 亚内斯
  rationale: 按希腊文音译，不以近似的希伯来平行文本校改正文；其与平行名单的差异另以脚注说明。
- source_word: ἑκατὸν εἷς
  choice: 一百零一人
  rationale: 准确表达基数，并补出量词“人”，使中文名单自然清楚。
- source_word: Ἀρόμ
  choice: 亚龙
  rationale: 依希腊文 Ἀρόμ 音译；不因平行传统存在重大差异而擅自协调。
- source_word: Βασσαί
  choice: 巴赛
  rationale: 依希腊文 Βασσαί 音译。近似的希伯来平行文本作“比萨伊”，但希腊文是本节正文的主要依据。
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: 共三百二十三人
  rationale: 数词本义明确；“共”表明该人数在希腊句法中跟在“亚龙的子孙、巴赛的子孙”之后，最自然地可理解为合计，同时不改动名单结构。
- source_word: Ἀρσειφουρείθ
  choice: 亚西弗雷特
  rationale: 对疑难希腊专名作较贴近原文的汉语音译；不在正文中采用可能来自希伯来平行传统的“哈列弗”。
