  text: the sons of Anneis[a], one hundred one; the sons of Arom, the sons of Bassai, three hundred twenty-three; the sons of Arseiphoureith[b],
translation:
  language: zh_hans
  text: 安内伊斯的子孙[a]，一百零一人；阿罗姆的子孙、巴赛的子孙，三百二十三人；阿尔塞弗雷伊特的子孙[b]；
  philosophy: optimal-equivalence
