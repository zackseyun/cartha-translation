translation:
  language: zh_hans
  text: 伴着手鼓和管乐器[a]。他们的弟兄都在奏乐；他让他们同那些人一起上去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管乐器”也可译作“笛子”或“管子”；希腊词可泛指簧管一类的吹奏乐器。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里语意突兀，并依赖上下文。“那些人”对应原文的远指代词，但具体所指须从前后叙事判断。
    reason: alternative_reading
lexical_decisions:
- source_word: τυμπάνων
  choice: 手鼓
  rationale: τύμπανον指手持击打的鼓或类似铃鼓的乐器；“手鼓”是现代中文中自然、清楚且符合节庆场景的表达。
- source_word: αὐλῶν
  choice: 笛子
  rationale: αὐλός泛指吹奏的管乐器，常为簧管；正文用通俗的“笛子”，脚注保留“管乐器”的较宽泛可能。
- source_word: ἀδελφοὶ
  choice: 弟兄
  rationale: 希腊文为明确的阳性复数；“弟兄”保留其性别形式，也可依上下文表示同族或同群体的男性成员。
- source_word: παίζοντες
  choice: 在奏乐
  rationale: παίζω可指玩耍、欢庆、舞蹈或演奏；紧接乐器描写时，“奏乐”最符合语境，同时不具体限定所奏乐器。
- source_word: ἐποίησεν
  choice: 让
  rationale: ποιέω接不定式在此具有使役意义；“让……上去”自然保留这一使役关系，而不额外强化为强迫。
- source_word: συναναβῆναι
  choice: 一起上去
  rationale: 该复合动词兼有“上去”和“与……一同”的含义；“同……一起上去”保留方向及共同动作。
- source_word: μετʼ ἐκείνων
  choice: 同那些人
  rationale: ἐκείνων是远指代词；“那些人”自然保留远指意味，其中“人”由中文表达和叙事语境补出。
