base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: zh_hans
  text: 这些人全是以色列人，年龄从十二岁起；不包括男女仆役[a]，共四万二千三百六十人。他们的男女仆役共有七千三百三十七人；男歌手和女歌手[b]共有二百四十五人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男女奴仆”。这里的希腊词也可指处于从属地位的家内奴仆；本节重在点算人数，并未特别说明其法律身份。
    reason: lexical_alternative
  - marker: b
    text: 也可概括译作“歌手”。希腊原文分别使用两个词称呼这两组歌唱者。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ πάντες
  choice: 这些人全是
  rationale: 承接上文所列归回者并作总括；中文用“这些人全是”自然表达 πάντες 的总体含义，不机械译出 δέ。
- source_word: ἦσαν Ἰσραήλ
  choice: 是以色列人
  rationale: 希腊文直译近于“是以色列”，此处指受点算群体的身份；“以色列人”符合现代汉语习惯，同时保留其族群与圣约共同体含义。
- source_word: ἀπὸ δωδεκαετοῦς
  choice: 年龄从十二岁起
  rationale: 表示点算的年龄起点；“从十二岁起”保留含十二岁的门槛意义，又不添加原文未明说的上限。
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: 不包括男女仆役
  rationale: παῖδες 与 παιδίσκαι 本可指男孩女孩，也可指男女仆役或奴仆；上下文随后另列其人数，较支持附属于各家的男女仆役。正文采用中性的“仆役”，脚注保留“奴仆”这一可能。
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: 四万二千三百六十人
  rationale: 按希腊文数字直接译出，并补量词“人”以合中文点算语境。
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: 他们的男女仆役
  rationale: τούτων 表示“他们的”；与前句用词保持一致，将成对词语译作“男女仆役”。
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: 七千三百三十七人
  rationale: 按原文数字直接译出。
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: 男歌手和女歌手
  rationale: 原文以两个词区分两组歌唱者，至少呈现性别或称谓上的区别；此译法清楚保留该区别，不合并为笼统的“歌手”。
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: 二百四十五人
  rationale: 按原文数字直接译出。
theological_decisions:
- issue: ἦσαν Ἰσραήλ 的共同体身份表达
  choice: 是以色列人
  alternative: 是以色列
  rationale: “是以色列”较贴近字面，却在现代汉语中生硬且容易被理解为地名判断；“是以色列人”自然表达这里的群体身份，不额外界定其神学范围。
- issue: παῖδες / παιδίσκαι 所指的社会身份
  choice: 男女仆役
  alternative: 男女奴仆；男孩女孩
  rationale: 这些词的语义范围确有张力。点算语境以及随后单列的人数支持仆役或奴仆之义；正文不武断强调法律上的奴隶身份，脚注则保留“奴仆”这一更强的可能译法。
- issue: ψάλται / ψαλτῳδοί 的区分
  choice: 男歌手和女歌手
  alternative: 歌手；歌唱者
  rationale: 采用区分性译法以保留希腊文使用两个不同称谓的现象，不进一步推断其礼仪职分或神学地位。
translation_notes:
  register: 采用现代、庄重而易懂的点算体表达。数字以汉字写出；以分号分隔总人数、仆役人数和歌手人数，使层次清楚。脚注标记均置于相关词语之后，避免把词义说明误接到数字或身份称谓上。
