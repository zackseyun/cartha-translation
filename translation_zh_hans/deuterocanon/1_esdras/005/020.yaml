base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/020.yaml
  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
translation:
  language: zh_hans
  text: 哈迪亚赛和阿米迪奥伊的子孙[a]，四百二十二人；来自凯拉玛斯·卡贝斯的人，六百二十一人[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文直译为“哈迪亚赛和阿米迪奥伊那些人”；按本段家族名册的表达方式，正文补出“子孙”。
    reason: translation_clarity
  - marker: b
    text: 希腊文作“来自凯拉玛斯·卡贝斯的人”。《以斯拉记—尼希米记》的希伯来文平行名单在这里的名称和人数均有显著差异；本译文以希腊文为准，不作协调。
    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: 哈迪亚赛和阿米迪奥伊的子孙
  rationale: 冠词 οἱ 在这份人口名册中省略了群体称谓；按上下文补出“子孙”，自然表达家族条目的含义。两个专名依希腊文音译，不以差异显著的马所拉平行经文校改。
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: 四百二十二人
  rationale: 按希腊文直译人数，并补“人”以符合现代汉语名册表达。
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: 来自凯拉玛斯·卡贝斯的人
  rationale: 保留 ἐκ 的来源义“来自”，也保留希腊文中 Κειράμας 与 Κάββης 之间没有连接词的结构；以间隔号呈现可能构成复合地名或紧密名称单位的开放性，不擅自改成两个并列家族。
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: 六百二十一人
  rationale: 按希腊文直译人数，并采用自然的现代汉语计数格式。
