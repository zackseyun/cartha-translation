  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: zh_hans
  text: 亚多尼干的子孙三十七人[a]；波赛的子孙二千六百零六人；亚底利翁的子孙四百五十四人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“三十七人”；《以斯拉记》2:13的马所拉文本平行经文作“六百六十六人”。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在归回者名册中，这是表示某一家族成员或后裔的惯用格式。“子孙”既自然，也避免把名单成员限定为某人的亲生儿子。
- source_word: Ἀδωνεικάμ
  choice: 亚多尼甘
  rationale: 按希腊文音译，并参考闪语平行经文中的专名形式；不翻译名字含义。
- source_word: τριάκοντα ἑπτά
  choice: 三十七人
  rationale: 准确保留希腊文本的数字；加“人”符合现代汉语人口名册的表达。
- source_word: Βοσαί
  choice: 波赛
  rationale: 直接依希腊文音译，不因平行传统的差异而改造专名。
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: 二千六百零六人
  rationale: 完整保留希腊文的名册数字，并采用自然的现代汉语数词形式。
- source_word: Ἀδειλίου
  choice: 亚底利翁
  rationale: 依希腊文属格所代表的专名音译，作为家族名称处理，不擅自还原为未经证实的希伯来文形式。
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: 四百五十四人
  rationale: 准确表达希腊文数字，保持名单体例一致。
theological_decisions:
- issue: 归回者人数与马所拉文本平行传统显著不同
  choice: 按《以斯得拉一书》的希腊文本译为“三十七人”
  alternative: 依《以斯拉记／尼希米记》的马所拉文本平行传统改作“六百六十六人”
  rationale: 本书以希腊文为主要文本依据；平行的希伯来文传统可供参照，却不应覆盖希腊文本。重要异文以脚注说明，避免暗中调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“……的子孙……人”呈现古代家族名册格式；专名按希腊文音译，数字依主要希腊文本保留。
