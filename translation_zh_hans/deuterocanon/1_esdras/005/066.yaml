base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: zh_hans
  text: 因为我们也和你们一样聆听你们的主；自亚述王阿斯巴卡法特[a]的日子起，我们将向他献祭[b]。这位王把我们迁到了这里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿斯巴卡法特”是本节希腊文中的名字；《以斯拉记》4:2的希伯来文平行经文称这位王为“以撒哈顿”。
    reason: 说明希腊专名与希伯来文平行经文的差异。
  - marker: b
    text: 希腊文直译为“我们将向他献祭”，动词特指献祭。它与“自……的日子起”连用，在时间表达上有张力；有些译法按语境理解为“从那时起一直献祭”。
    reason: 保留并解释希腊文将来时及其语境张力，同时提供可能的语境性理解。
  - marker: c
    text: “迁到了这里”可能指亚述统治下的强制迁徙或重新安置，但这个动词本身并未明确说明是否出于强迫。
    reason: 交代帝国迁徙背景，同时避免把语境推论写成词义本身。
lexical_decisions:
- source_word: ὁμοίως
  choice: 也像你们一样
  rationale: 表达说话者声称自己与对方相同；“也像你们一样”在现代汉语中自然，并明确保留比较关系。
- source_word: ἀκούομεν
  choice: 听从
  rationale: ἀκούω可指听见、聆听或听从。此处涉及对主的宗教性回应，“听从”保留了听取并响应的意味，但不额外加入“敬拜”或完整的盟约忠诚概念。
- source_word: τοῦ κυρίου ὑμῶν
  choice: 你们的主
  rationale: 严格保留希腊文的第二人称复数物主结构；不增补本节希腊文没有的“神”。
- source_word: ἐπιθύσομεν
  choice: 我们就要向他献祭
  rationale: 该词是将来时，专指献上祭物。主文保留将来时，即使它与“自……的日子起”之间存在时间上的张力；不擅自改成完成或持续时态。
- source_word: ἀπὸ ἡμερῶν
  choice: 自……的日子起
  rationale: 保留起始时间的表达，同时尽量采用可理解的现代汉语。
- source_word: Ἀσβακαφὰθ
  choice: 阿斯巴卡法特
  rationale: 按本节希腊文专名音译；与《以斯拉记》4:2平行经文中的“以撒哈顿”之对应关系放入脚注。
- source_word: βασιλέως Ἀσσυρίων
  choice: 亚述王
  rationale: 希腊文字面为“亚述人的王”；“亚述王”是简洁自然的现代汉语称谓，意义相同。
- source_word: μετήγαγεν
  choice: 迁到了
  rationale: 该动词表示将人从一处带往另一处；“迁到”既自然，又保留帝国迁徙或安置的可能含义，而不在主文中明确断定是否出于强迫。
- source_word: ἐνταῦθα
  choice: 这里
  rationale: 直接对应地点副词，简明自然。
theological_decisions:
- issue: 说话者是否宣称自己与犹大归回者敬奉同一位神
  choice: 按其自我陈述直译为“我们也像你们一样听从你们的主”，不判断其宣称是否真诚或有效。
  alternative: 译为“我们也顺服你们的神”，从而强化共同信仰或盟约忠诚的含义。
  rationale: 希腊文仅说“你们的主”，并以说话者的口吻提出相似性。译文应保留这一宣称及其潜在争议，不替叙事作神学裁决。
- issue: 将来时“我们要献祭”与“自……的日子起”的时间张力
  choice: 保留希腊文将来时，并以脚注说明其与起始时间短语之间的张力。
  alternative: 按上下文改译为“我们从……的日子起一直向他献祭”。
  rationale: ἐπιθύσομεν在现存希腊文本中是将来直陈式。改成过去持续至今虽更符合常规语境，却会消除原文真实存在的语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“听从”比单纯“听见”更适合此处对主的回应语境；“亚述王”避免生硬的“亚述人的王”。主文刻意保留将来时与“自……起”之间略显突兀的时间关系，并由脚注解释，不在翻译中暗自校正。
