base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/036.yaml
  text: These were the ones who came up from Thermeleth and Thelersas, with Charaathalan and Allar leading them.
translation:
  language: zh_hans
  text: 这些人从特尔梅列特和特勒萨斯上来，由哈拉阿塔兰和阿拉尔带领。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβάντες
  choice: 上来
  rationale: 保留圣经叙事中从异地前往犹大和耶路撒冷常用的方位表达，也贴合希腊文分词的基本含义。
- source_word: ἡγούμενος αὐτῶν
  choice: 由……带领
  rationale: 按语境将单数分词ἡγούμενος自然译为带领这群人的领头者；不强行添加原文没有明说的职位称谓。
- source_word: Θερμέλεθ καὶ Θελερσάς
  choice: 特米列和特勒萨
  rationale: 依希腊文地名音译；平行马所拉文本并无这两个地名，不能据其改写。
- source_word: Χαρααθαλὰν καὶ Ἀλλάρ
  choice: 哈拉亚塔兰和阿拉尔
  rationale: 依现存希腊文本音译人名，并保留两个并列名字。
theological_decisions:
- issue: ἡγούμενος为语法单数，却接两个并列人名
  choice: 采用中文不标数的“由哈拉亚塔兰和阿拉尔带领”
  alternative: 译作“他们的领袖是哈拉亚塔兰和阿拉尔”或只把第一人视为领袖
  rationale: 希腊文在数的一致上存在张力；中文“带领”不必明确单复数，既保留两个人名，也避免擅自消解文本难点。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。专名以希腊文为首要依据音译；本节不需脚注。
