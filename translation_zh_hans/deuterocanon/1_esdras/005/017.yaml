  yaml_path: translation/deuterocanon/1_esdras/005/017.yaml
  text: the sons of Baiterous[a], three thousand five; the sons of Ragethlomon, one hundred twenty-three;
translation:
  language: zh_hans
  text: 拜特鲁斯的子孙[a]，三千零五人；出自拉革特洛蒙的子孙，一百二十三人；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文专名与近似的希伯来文马所拉文本平行传统不同；后者在相应位置作“哈顺的子孙二百二十三人”。正文依照《以斯德拉一书》的希腊文，没有按马所拉文本加以协调。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在宗族名册中，此词指某一家族或宗族的成员；“子孙”比字面化的“儿子”更符合现代汉语名册用语，同时保留谱系关系。
- source_word: Βαιτηρούς
  choice: 拜特鲁斯
  rationale: 按希腊文形式音译此专名，不以近似的马所拉文本平行经文来协调或替换。
- source_word: τρισχίλιοι πέντε
  choice: 三千零五人
  rationale: 准确表达基数三千零五；补出量词“人”，使中文人口名册表述自然清楚。
- source_word: ἐκ
  choice: 出自
  rationale: 明确表达希腊文介词所含的来源或归属关系，同时避免生硬直译为“从”。
- source_word: Ῥαγεθλωμῶν
  choice: 拉革特洛蒙
  rationale: 依据希腊文词形音译；不强行与此处不能清楚对应的希伯来平行传统统一。
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: 一百二十三人
  rationale: 直接表达原文数目，并补出名册语境中自然的量词“人”。
theological_decisions:
- issue: 本节希腊文中的专名和人数与近似的马所拉文本平行传统明显不同
  choice: 正文保留希腊文的“拜特鲁斯”“拉革特洛蒙”及其人数
  alternative: 按马所拉文本平行传统改作“哈顺的子孙二百二十三人”
  rationale: 《以斯德拉一书》应以现存希腊文为主要翻译依据；希伯来平行经文仅供核对，且此处对应关系并不明确，因此不应将正文协调为马所拉文本。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语名册体。“子孙”表达宗族成员，“出自”保留第二项中ἐκ的来源含义；人数写成中文汉字，并以“人”标明计数对象。
