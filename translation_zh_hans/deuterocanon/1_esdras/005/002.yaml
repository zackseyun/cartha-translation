lexical_decisions:
- source_word: συναπέστειλεν
  choice: 派……与他们同行
  rationale: 该复合动词含有“连同、随同派遣”的意味；此译法自然表达骑兵受派陪同这一行人。
- source_word: ἱππεῖς χιλίους
  choice: 一千名骑兵
  rationale: ἱππεῖς在此指骑乘作战或护送的人员；“骑兵”比泛指的“骑手”更符合语境。
- source_word: ἕως τοῦ ἀποκαταστῆσαι αὐτοὺς
  choice: 直到把他们……送回
  rationale: 该结构表示护送持续到返回行动完成；ἀποκαθίστημι在这里是使人回到原处，而“送回”比生硬的“恢复”更符合现代汉语。
- source_word: μετʼ εἰρήνης
  choice: 平安
  rationale: 既可表达和平状态，也含安全无恙抵达之意；“平安送回”简洁保留这层宽泛含义。
- source_word: μετὰ μουσικῶν
  choice: 有音乐相伴
  rationale: μουσικῶν可理解为音乐或从事音乐的人；正文采用较宽泛、自然的“音乐”，并在脚注保留“乐师”的可能。
