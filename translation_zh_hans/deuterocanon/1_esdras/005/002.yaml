  text: And Darius sent with them a thousand horsemen[a], until they had brought them back to Jerusalem in peace and with music,
translation:
  language: zh_hans
  text: 大流士又派了一千名骑兵与他们同行，直到把他们平安送回耶路撒冷，并有音乐[a]相伴，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“并有乐师相伴”。希腊语μουσικῶν既可指音乐，也可指演奏音乐的人。
