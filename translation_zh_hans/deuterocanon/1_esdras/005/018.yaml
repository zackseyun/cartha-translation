    reason: textual_variant
  - marker: b
    text: 希腊文最后这个地名在文本上难以确定，可能是复合地名，也可能因传抄而发生讹变；正文因此保留音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ
  choice: 来自……的
  rationale: 在这份名单中表示按来源地归类的人群；译为“来自……的”既自然，也保留其地点含义，不借用近似希伯来平行经文中的“子孙”。
- source_word: Νετέβας
  choice: 尼特巴斯
  rationale: 按希腊文本音译此专名。由于马所拉文本的近似平行经文与本节差异显著，不推测性地归并为希伯来地名。
- source_word: πεντήκοντα πέντε
  choice: 五十五人
  rationale: 准确表达基数，并按中文人口名单的习惯补出量词“人”。
- source_word: Ἐνάτου
  choice: 埃纳托斯
  rationale: 将希腊语属格形式还原为便于中文阅读的专名形式后音译。
- source_word: ἑκατὸν πεντήκοντα ὀκτώ
  choice: 一百五十八人
  rationale: 准确表达基数，并以现代中文名单常用的方式补出“人”。
- source_word: Βαιτασμῶν Ζαμμώθ
  choice: 拜塔斯蒙·撒摩特
  rationale: 该希腊名称在文本上难以确定，可能是复合地名或传抄讹变；因此采用贴近原文的音译，不作未经证实的规范化或拆分。
