base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: zh_hans
  text: 约萨达的儿子耶书亚[a]起来；他的弟兄，就是众祭司，和撒拉铁的儿子所罗巴伯及他的弟兄，一同预备了以色列的上帝的祭坛[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书亚”指被掳归回时期的祭司人物，并非指拿撒勒人耶稣。
    reason: cross_reference
  - marker: b
    text: “预备”也可译为“使……准备妥当”。原文没有明确说明这是新建、重建，还是设立祭坛。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: 起来
  rationale: 该不定过去时分词在叙事中表示起身并开始采取行动；“起来”自然简洁，也保留“站起来”的字面意象。
- source_word: Ἰησοῦς
  choice: 耶书亚
  rationale: 此处指被掳归回时期的祭司人物，对应闪语传统中的耶书亚，并非拿撒勒人耶稣；采用“耶书亚”可避免混淆。
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: 约撒达的儿子
  rationale: 希腊文以属格表达父子关系；“约撒达”采用现代中文圣经传统中该人名的常见形式。
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: 他的弟兄众祭司
  rationale: 保留“弟兄”和“祭司”两层信息，并以中文同位结构表明这些弟兄是祭司。
- source_word: Ζοροβαβὲλ
  choice: 所罗巴伯
  rationale: 采用现代中文圣经中这一被掳归回时期人物的通行译名。
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: 撒拉铁的儿子
  rationale: 按希腊文属格父名结构直译，并采用中文圣经通行人名。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 准确表达“使之就绪、预备”的意义，不额外断定祭坛是新建、重建还是仅被设置妥当。
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: θυσιαστήριον的标准礼仪用语；“祭坛”已包含献祭用途，无须增译。
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: 以色列上帝的
  rationale: 保留希腊文属格所表达的归属或关联关系，不改译成目的关系“为以色列的上帝”。
theological_decisions:
- issue: Ἰησοῦς所指人物的中文名称
  choice: 耶书亚
  alternative: 约书亚／耶稣
  rationale: 上下文及父名约撒达表明这是归回时期的祭司人物。“耶书亚”既反映相应的闪语名字形式，也避免读者误认作拿撒勒人耶稣；“约书亚”虽可指同一名字，但在此历史语境中辨识度较低。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文并列人物结构与句末逗号所显示的未完句性质；“弟兄众祭司”明确这些弟兄为男性祭司群体。
