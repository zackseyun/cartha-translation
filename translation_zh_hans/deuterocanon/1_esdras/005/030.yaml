base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: zh_hans
  text: 阿库德的子孙[a]，乌塔的子孙，凯塔布的子孙，阿卡巴的子孙，西巴伊的子孙，阿南的子孙，库阿的子孙，凯杜尔的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《尼希米记》7:45的希伯来文平行经文列出的是另一份守门人家族名单，其中包括沙龙、亚特、达们、亚谷、哈底大和朔拜。本节保存了不同的希腊文名单，因此正文依照希腊文翻译，不与希伯来文协调。
    reason: 说明平行经文中的异文，并交代正文为何保留希腊文名单。
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在家族名册中，该词指以某位祖先为名的家族或宗族成员。“子孙”既保留亲属谱系含义，也比逐项译作“儿子”更符合现代汉语名册语境；各项重复这一结构，以体现希腊文的排比格式。
- source_word: Ἀκούδ
  choice: 阿库德
  rationale: 按希腊文读音音译，不以《尼希米记》平行经文中的不同名字替换。
- source_word: Οὐτά
  choice: 乌塔
  rationale: 依希腊文 Οὐτά 音译；“乌”自然对应起首的 ου 音。
- source_word: Κητάβ
  choice: 凯塔布
  rationale: 依现存希腊文形式音译，并保留词末辅音所反映的名字形态，不与希伯来文平行名单协调。
- source_word: Ἀκκαβά
  choice: 阿卡巴
  rationale: 按希腊文音译；现代汉语音译无法自然标示双写 κ，故不人为增加字音。
- source_word: Συβαεί
  choice: 西巴伊
  rationale: 按希腊文 Συβαεί 的音节音译，保留其与希伯来文平行名单不同的形式。
- source_word: Ἀνάν
  choice: 阿南
  rationale: 直接按希腊文音译，采用简明自然的现代汉语人名形式。
- source_word: Κουά
  choice: 库阿
  rationale: 按希腊文 Κουά 音译，以两个汉字体现其元音结构。
- source_word: Κεδδούρ
  choice: 凯杜尔
  rationale: 依希腊文形式音译；汉语不另行标示双写 δ，并用“杜尔”表达 δούρ 的近似读音。
theological_decisions:
- issue: 本节希腊文名单与《尼希米记》7:45希伯来文平行名单的关系
  choice: 照《以斯拉一书》的希腊文逐项翻译，不将其中名字改成希伯来文平行经文的名单。
  alternative: 按《尼希米记》7:45，将部分或全部名字协调为沙龙、亚特、达们、亚谷、哈底大、朔拜等。
  rationale: 本书以现存希腊文为主要原文依据，而希伯来文平行经文的名单在名称、数目和结构上均有差异。为保留真实的文本差异，不进行无明文依据的协调。
translation_notes:
  register: 采用现代、庄重而易懂的名册体。重复“……的子孙”以再现希腊文连续八次使用 υἱοὶ 的句法排比；专名以希腊文为直接依据作汉语音译。
