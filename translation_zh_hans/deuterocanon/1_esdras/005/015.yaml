base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: zh_hans
  text: 亚泽尔·以西家的子孙[a]，基兰和亚泽塔的子孙，共六十七人；亚扎罗的子孙，共四百三十二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文本与马所拉文本中大致对应的名单差异显著；后者在相应位置作“亚丁的子孙四百五十四人”。《以斯得拉一书》的归回者名单有时会重新排列或改写相关材料，因此这里依从希腊文本，不据希伯来平行经文加以统一。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在归回者名册中，这是表示宗族或后裔的固定用语；译作“子孙”既保留谱系含义，也比逐字译为“儿子们”更符合现代汉语名册体例。
- source_word: Ἀζὴρ Ἐζεκίου
  choice: 亚泽尔·以西家
  rationale: 按希腊文本音译这组专名，不依据近似的马所拉平行经文改成其他希伯来名字。中点保留希腊语中两个相邻专名之间的界限，同时不强行判定二者的具体句法关系。
- source_word: Κειλὰν
  choice: 基兰
  rationale: 依希腊语形式音译为现代汉语专名；不在证据不足时归并为较熟悉的地名或宗族名。
- source_word: Ἀζητάς
  choice: 亚泽塔
  rationale: 直接依据希腊见证音译；鉴于平行文本差异显著，不作协调性改名。
- source_word: ἐξήκοντα ἑπτά
  choice: 六十七人
  rationale: 准确译出人数；补出量词“人”，使现代汉语名单表达自然清楚。
- source_word: Ἀζάρου
  choice: 亚扎罗
  rationale: 按希腊语属格形式所代表的专名音译，不以近似的马所拉名单替换。
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: 四百三十二人
  rationale: 准确译出人数，并按现代汉语习惯补出“人”。
theological_decisions:
- issue: Ἀζὴρ Ἐζεκίου 的句法与姓名划分
  choice: 译作“亚泽尔·以西家”，保留两个专名并以中点连接
  alternative: 译作“以西家的亚泽尔”或把两词合成一个复合姓名
  rationale: 希腊文本只是并列两个属格形式，具体是父子关系、复名还是抄传形成的姓名组合并不完全明确；正文不应无证据地消除这种含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留名册式的分号结构。以“子孙”表达宗族名单中的 υἱοὶ，以“共……人”增强中文可读性；专名主要依希腊语音译，并通过脚注说明与马所拉平行文本的重大差异。
