  text: those from Kartatheireios[a], twenty-five; those from Peiras and Berog, seven hundred.
translation:
  language: zh_hans
  text: 来自卡尔塔泰雷奥斯[a]的有二十五人；来自佩拉斯和贝罗格的有七百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来平行传统在此不同，约作“尼陀法人五十六名”。《以斯德拉一书》这里似乎保存了另一种希腊名单形式，而不是这一希伯来文本的措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: 来自……的
  rationale: 这是名单中省略中心语的固定表达，指来自某地的人。中文补出量词“人”承接数字，既自然，也不在地名短语中额外限定性别。
- source_word: Καρταθειαρειός
  choice: 卡尔塔泰雷奥斯
  rationale: 这是形态和对应关系均较困难的希腊专名；按希腊语音译，不强行与希伯来平行文本的“尼陀法”协调。
- source_word: εἴκοσι πέντε
  choice: 二十五人
  rationale: 准确表达基数，并按中文人口名单习惯补出“人”。
- source_word: Πείρας
  choice: 佩拉斯
  rationale: 按希腊语形式音译该地名，避免依据差异显著的平行传统作推测性认定。
- source_word: Βηρόγ
  choice: 贝罗格
  rationale: 按希腊语形式音译，保留词尾γ所代表的辅音。
- source_word: ἑπτακόσιοι
  choice: 七百人
  rationale: 准确表达基数，并使中文名单句式完整自然。
theological_decisions:
- issue: 希腊名单与马所拉文本平行传统显著不同
  choice: 依斯威特版希腊文本翻译地名和人数，并以脚注说明希伯来平行传统的异文。
  alternative: 按希伯来平行传统译作“尼陀法人五十六名”。
  rationale: 《以斯德拉一书》以现存希腊文本为主要翻译依据。本节的地名、分组和人数均与所给希伯来平行文本明显不同，不宜暗中协调；但该差异具有重要的文本批判价值，故在脚注中透明保留。
translation_notes:
  register: 采用现代、庄重而简洁的名单体。地名依希腊文本音译；重复使用“来自……的，……人”以保留原文的列举节奏。脚注标记[a]已置于相关专名之后。
