base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple servants: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: zh_hans
  text: 多贝伊斯的子孙，共一百三十九人；圣殿奴隶[a]有：以扫的子孙、塔西法的子孙、塔巴俄特的子孙、基拉斯的子孙、苏阿的子孙、法莱乌的子孙、拉巴拿的子孙，[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿奴隶”所译的希腊词也可译作“圣殿仆役”；这里采用“奴隶”，以保留该词所含的隶属、受役意味。
    reason: lexical_alternative
  - marker: b
    text: 原文在此处以逗号结束；下一节继续列举圣殿奴隶的宗族。
    reason: cross_reference
  - marker: c
    text: 所提供的《尼希米记》7章平行材料在这里并非逐字对应，而是记载利未人的另一段名单；本节依《以斯拉一书》的希腊文本翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ……的子孙
  rationale: 在人口名册和宗族名单中，此词是常见的谱系公式；译作“子孙”既保留血缘、宗族关系，又避免让现代读者误以为只指亲生儿子。
- source_word: Τωβείς
  choice: 多贝伊斯
  rationale: 按斯威特希腊文本音译这一罕见专名，不擅自改成更熟悉但并非本节希腊形式的名字。
- source_word: πάντες
  choice: 共
  rationale: 简洁自然地表达名单统计中的总计含义。
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: 一百三十九人
  rationale: 准确保留人数；补出量词“人”，符合现代汉语人口名单的表达习惯。
- source_word: οἱ ἱερόδουλοι
  choice: 圣殿奴隶
  rationale: ἱερόδουλοι指隶属于神圣场所、承担圣殿事务而具有奴役身份的人；“圣殿奴隶”同时保留其服事场所和受役社会身份，不以较温和的“仆役”掩盖后者。
- source_word: Ἠσαύ
  choice: 以扫
  rationale: 采用现代中文圣经传统中已广为人知的对应名称。
- source_word: Τασειφά
  choice: 塔西法
  rationale: 依希腊形式音译罕见专名，不以不确定的闪语重构取代原文。
- source_word: Ταβαώθ
  choice: 塔巴俄特
  rationale: 按希腊语音节音译，尽量保留末尾辅音。
- source_word: Κηράς
  choice: 基拉斯
  rationale: 直接按希腊形式音译这一专名。
- source_word: Σουά
  choice: 苏阿
  rationale: 紧贴希腊形式音译，不擅自采用推测性的闪语读法。
- source_word: Φαλαίου
  choice: 法莱乌
  rationale: 此名罕见且对应形式不确定，因此采用可核查的希腊语音译。
- source_word: Λαβανά
  choice: 拉巴拿
  rationale: 保留希腊词尾的音节，不将其简化为更熟悉但形式不同的“拉班”。
theological_decisions:
- issue: 圣殿人员称谓ἱερόδουλοι的社会身份
  choice: 圣殿奴隶
  alternative: 圣殿仆役／圣殿侍役
  rationale: 该复合词不仅说明他们服务于圣所，也包含受奴役或隶属的身份色彩。正文保留这种不舒适但真实的社会含义，脚注列出较宽和的可能译法。
- issue: 希腊名单与所提供的马所拉文本平行材料不一致
  choice: 按希腊人口名单原文翻译
  alternative: 以所提供的希伯来平行材料中利未人的名单替换本节
  rationale: 本书以现存希腊文本为直接翻译依据；所附希伯来材料内容明显不同，只能用作有限的参照，不能覆盖或改写希腊见证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。宗族公式统一译为“……的子孙”，使名册结构清楚；专名以希腊文本为主音译，只有“以扫”采用已固定的中文传统译名。末尾保留逗号，并以脚注说明本节在句法和名单结构上延续至下一节。
