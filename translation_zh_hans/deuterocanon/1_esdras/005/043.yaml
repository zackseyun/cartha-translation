base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: zh_hans
  text: 一些家族首领来到耶路撒冷上帝的圣殿时，承诺[a]要按自己的能力，在原址重建这殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承诺”也可译作“许愿”。希腊语动词可以表示许愿；“这殿”在这里指圣殿。
    reason: 保留εὔξαντο可指许愿或郑重承诺的词义幅度，并说明οἶκος在此处的所指。
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: 家族首领
  rationale: ἡγουμένων指居领导地位的人，κατὰ τὰς πατριὰς将其限定在宗族、家族体系中；“家族首领”自然简明，也保留其社会结构含义。
- source_word: παραγίνεσθαι
  choice: 来到
  rationale: 此处表示他们抵达耶路撒冷上帝圣殿所在之处；“来到”符合现代汉语叙事习惯。
- source_word: ἱερὸν τοῦ θεοῦ
  choice: 上帝圣殿
  rationale: ἱερόν通常指圣殿或圣殿区域；“上帝圣殿”清楚、庄重，并与后文οἶκον所指的殿相呼应。
- source_word: εὔξαντο
  choice: 承诺
  rationale: 该词可有“许愿”之意，但与不定式ἐγεῖραι连用时也可表达郑重承担某事；“承诺”保留郑重性而不把正式宗教誓愿定为唯一解释。
- source_word: ἐγεῖραι
  choice: 建起
  rationale: 原义为“使之起来、建起”；上下文隐含重建，但正文采用“建起”以保留希腊文意象。
- source_word: τὸν οἶκον
  choice: 这殿
  rationale: οἶκος直译为“房屋、殿宇”，此处指上帝的殿；前文已明确是上帝圣殿，因此译作“这殿”既清楚又避免生硬。
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: 在原址
  rationale: 该短语表示在它所属或原有的地点恢复建造；“在原址”最符合此处重建语境。
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: 量力
  rationale: 表示按照他们自身的能力或财力；“量力”简洁自然，并保留能力与资源两方面的开放性。
theological_decisions:
- issue: εὔξαντο是正式宗教许愿，还是较广义的郑重承诺
  choice: 正文译作“承诺”
  alternative: “许愿”或“立愿”
  rationale: 圣殿语境使“许愿”成为真实可能，但该动词后接建殿的不定式，也可着重表达承担工程的郑重决心；正文不将其技术性地限定为礼仪誓愿，脚注保留另一读法。
- issue: ἐγεῖραι τὸν οἶκον是否明确译成“重建圣殿”
  choice: “建起这殿”
  alternative: “重建圣殿”
  rationale: 原址这一信息清楚暗示重建；保留“建起”和“殿”的措辞，既忠于希腊文，又不失现代汉语可读性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“量力”凝练表达按自身能力或财力而行；句末不用逗号，以适合作为独立经节刊载。
