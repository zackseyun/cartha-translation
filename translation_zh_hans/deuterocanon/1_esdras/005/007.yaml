base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: zh_hans
  text: 以下是从被掳流亡之地上来、原属犹太地的人[a]；巴比伦王尼布甲尼撒曾把他们掳到巴比伦[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《以斯拉记》2:1的希伯来文平行经文作“本省的人”，而不是“原属犹太地的人”。这里以《以斯德拉一书》的希腊文本为主要依据。
    reason: alternative_reading
  - marker: b
    text: 原文也可译作“曾把他们迁移并安置到巴比伦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: 以下是
  rationale: δὲ在此为轻微承接；中文用“以下是”自然引出后续名单，不额外加入时间意义。
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: 那些从犹太地……的人
  rationale: 希腊文明确作Ἰουδαία，故按主要文本译为“犹太地”，不以希伯来平行经文的“本省的人”替换。
- source_word: οἱ ἀναβάντες
  choice: 上来
  rationale: 保留ἀναβαίνω在返回犹大地语境中的“上去／上来”表达；叙述以目的地一方为视角，译作“上来”。
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: 脱离寄居之地的被掳生活
  rationale: αἰχμαλωσία指被掳或被掳状态，παροικία可指寄居、异乡居留；此译保留两者关系及流亡寄居的意味，避免把表达压缩成单一概念。
- source_word: οὓς μετῴκισεν
  choice: 迁徙……的人
  rationale: μετοικίζω表示使人迁居，语境中是强制迁徙；正文采用较贴近词形且庄重的“迁徙”，脚注说明“掳走”的语境性译法。
- source_word: Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名形式。
- source_word: βασιλεὺς Βαβυλῶνος
  choice: 巴比伦王
  rationale: 符合现代中文称谓习惯，并准确表达所属关系。
- source_word: εἰς Βαβυλῶνα
  choice: 到巴比伦
  rationale: 表达迁徙的目的地，简洁自然。
