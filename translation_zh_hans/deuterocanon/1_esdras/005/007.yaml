revisions:
- from: 以下是那些从犹太地上来、脱离寄居之地的被掳生活的人[a]，就是巴比伦王尼布甲尼撒迁徙到巴比伦的人[b]：
  to: 以下是从被掳流亡之地上来、原属犹太地的人[a]；巴比伦王尼布甲尼撒曾把他们掳到巴比伦[b]：
  rationale: 重组中文句法，使“原属犹太地”“从被掳流亡之地上来”以及尼布甲尼撒将他们掳往巴比伦这三层信息明确相连。修订不把希伯来文平行经文的“本省”纳入正文，并以脚注说明文本差异；保留末尾冒号，以衔接下文名单。
