    issue: “脱离寄居之地的被掳生活”增添“脱离”并造成语义关系不清。
    rationale: ἐκ表示“从……出来／上来”，但原文并未以“脱离……生活”表达；αἰχμαλωσίας τῆς παροικίας应整体指被掳的流亡处境。
  - severity: medium
    issue: “巴比伦王尼布甲尼撒迁徙到巴比伦的人”句法不完整且弱化强制性。
    rationale: μετῴκισεν是及物动词，需明确王把这些人迁移／掳往巴比伦；在被掳语境中“掳到”最自然。
  - severity: low
