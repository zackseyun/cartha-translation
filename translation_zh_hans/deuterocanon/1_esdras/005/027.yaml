  text: the sons of the temple singers[a], the sons of Asaph, one hundred twenty-eight.
translation:
  language: zh_hans
  text: 圣殿歌唱者的子孙，即亚萨的子孙，共一百二十八人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ ἱεροψάλται
  choice: 圣殿歌唱者
  rationale: ἱεροψάλται指参与神圣礼仪、隶属圣殿敬拜的歌唱者；译作“圣殿歌唱者”自然明确。此处前置的υἱοὶ按名单句式理解为群体成员，不机械译成语义不通的“歌唱者的儿子”。
- source_word: υἱοὶ Ἀσάφ
  choice: 亚萨的子孙
  rationale: 名单中的υἱοὶ可表示家族或谱系后裔；“子孙”既保留祖系关系，又符合现代汉语人口名册的表达。Ἀσάφ按通行圣经人名译作“亚萨”。
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: 一百二十八人
  rationale: 按现代汉语数字表达翻译，并补出量词“人”，使名单中的人数表述完整自然。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的名册体。保留“亚萨的子孙”这一谱系称谓，同时以“圣殿歌唱者”清楚表达其敬拜职分。所给马所拉文本平行材料与本节内容不对应，因此不据其改动希腊文所呈现的名单。
