base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: zh_hans
  text: 法他勒摩押的子孙[a]，归在耶书亚和罗波押的子孙之列[b]，共二千八百零二人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“法他勒摩押”；希伯来文平行传统通常作“巴哈·摩押”。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“耶书亚和罗波押”；《以斯拉记》《尼希米记》的平行名单通常对应为“耶书亚和约押”。《以斯拉续篇上》有时会重新排列或改写其资料，因此这里保留希腊文形式。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在归回者名册中，这是家族或宗族称谓；“子孙”比字面的“儿子们”更符合现代汉语，同时保留谱系含义。
- source_word: Φθαλεμωάβ
  choice: 法勒摩押
  rationale: 按主要希腊见证 Φθαλεμωάβ 音译，不以平行希伯来传统的名称取代正文读法。
- source_word: εἰς τοὺς υἱοὺς
  choice: 即……的子孙
  rationale: 此处 εἰς 在名册格式中说明归属或支系关系，并非表示移动；“即”自然地引出所列支系，但希腊句法本身略显特殊。
- source_word: Ἰησοῦ
  choice: 耶书亚
  rationale: 这是被掳归回时期的人名，采用旧约语境中通行的“耶书亚”，避免与新约中的“耶稣”混同。
- source_word: Ῥοβοάβ
  choice: 罗波押
  rationale: 正文依希腊读法音译，而不按以斯拉记、尼希米记的平行名单改作“约押”；差异保留在脚注中。
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: 二千八百零二人
  rationale: 直译人数总计；补出量词“人”符合现代汉语名册表达。
theological_decisions:
- issue: 希腊正文与以斯拉记、尼希米记平行名单的人名差异
  choice: 正文保留希腊见证“罗波押”
  alternative: 按平行传统译作“约押”
  rationale: 该差异属于文本与名单传承问题，并无必要以较熟悉的平行传统校正希腊正文；脚注同时说明另一传统。
translation_notes:
  register: 采用现代、庄重而简洁的名册体。人名以希腊正文为主，避免让差异较大的马所拉平行经文支配本节；两个脚注标记均已置于正文相应名称之后。
