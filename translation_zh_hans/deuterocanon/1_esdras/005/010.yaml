  text: the sons of Ares[a], seven hundred fifty-six.
translation:
  language: zh_hans
  text: 阿瑞斯的子孙，共七百五十六人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“阿瑞斯”，人数为七百五十六；此处马所拉文本的近似平行经文在家族称谓和总人数上均不相同。
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: 子孙
  rationale: 在家族名册的语境中，这一词组表示属于某位祖先的后裔群体；译作“子孙”既自然，也避免把名单成员狭义理解为其亲生儿子。
- source_word: Ἀρές
  choice: 阿瑞斯
  rationale: 按主要希腊文本中的专名 Ἀρές 音译，不以差异显著的马所拉文本平行经文取代。
- source_word: ἑπτακόσιοι πεντήκοντα ἕξ
  choice: 七百五十六人
  rationale: 准确保留希腊文本的总数；补出量词“人”，符合现代汉语名册表达。
theological_decisions:
- issue: 希腊文本与马所拉文本平行经文在家族名称和人数上的差异
  choice: 依希腊文本译作“阿瑞斯的子孙，共七百五十六人”
  alternative: 依马所拉文本的近似平行经文采用另一家族称谓及二千八百一十二人的总数
  rationale: 《以斯德拉一书》以现存希腊文本为主要翻译依据；此处希伯来文平行经文与之有实质差异，只宜在脚注中说明，不应据此调和或改写希腊正文。
translation_notes:
  register: 采用简洁、庄重的现代汉语名册体。“共……人”使孤立条目读来完整自然；专名按希腊语音译，并保留文本差异脚注。
