base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: zh_hans
  text: 因为惟有我们要为以色列的主建造，照着波斯人的王居鲁士吩咐我们的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: 因为惟有我们
  rationale: γὰρ承接上下文说明拒绝的理由，译为“因为”；显明的代词ἡμεῖς与μόνοι共同强调排他性，译为“惟有我们”。
- source_word: οἰκοδομήσομεν
  choice: 要……建造
  rationale: 这是οἰκοδομέω的将来时；原文只说“建造”，没有明示“重建”，因此不补入恢复性的含义。
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: 为以色列的主
  rationale: 与建造动词连用的与格表达建造对象或归属，译作“为”；κύριος在此是神圣称号，译为“主”。
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: 照着……所吩咐我们的
  rationale: 保留ἀκολούθως“依照、按照”的意义，并以自然的现代汉语表达关系结构。
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: 波斯人的王居鲁士
  rationale: Περσῶν是复数属格，直指“波斯人”；此译保留希腊文的族称形式，而不改写成地名“波斯”。
theological_decisions:
- issue: 次经七十士译本语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: τῷ κυρίῳ τοῦ Ἰσραήλ在此是指以色列之神的称号；“主”既符合经文语域，也避免把神圣称号弱化为一般社会关系中的“主人”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“惟有”突出排他性；句法略带经文庄重感，但不使用艰涩古语。希腊文并未明确说所建的是圣殿，故正文不擅自补出宾语。
