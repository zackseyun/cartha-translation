  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: zh_hans
  text: 于是，约萨达的儿子耶书亚[a]起身后，他的弟兄，就是众祭司，和撒拉铁[b]的儿子所罗巴伯及他的弟兄，一同预备了以色列上帝的祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶书亚”所对应的希腊文姓名，也可按不同语境译作“约书亚”或“耶稣”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“撒拉铁”（Σαλαθιήλ）；这是该姓名的希腊文形式。
    reason: source_form
lexical_decisions:
- source_word: καταστὰς
  choice: 起来
  rationale: 这是 καθίστημι 的不定过去时分词，在此引出耶书亚采取行动；“起来”自然保留了叙事中的行动感，又不加入原文未明说的“就位”或“站定”等含义。
- source_word: Ἰησοῦς
  choice: 耶书亚
  rationale: 在被掳归回后的祭司语境中，此名通常对应“耶书亚”；这样既符合人物的历史身份，也避免读者误以为这里指新约中的耶稣。
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: 约萨达的儿子
  rationale: 希腊文以“某某的”表示父子关系；现代汉语明确译为“约萨达的儿子”最为自然。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 他的弟兄
  rationale: ἀδελφοί 是阳性复数亲属称谓；“弟兄”保留其家族性和男性所指，不将其泛化为“同胞”或“同工”。
- source_word: οἱ ἱερεῖς
  choice: 众祭司
  rationale: 该同位语说明耶书亚的弟兄是祭司；“众祭司”在汉语中简洁而清楚。
- source_word: Ζοροβαβὲλ
  choice: 所罗巴伯
  rationale: 采用现代中文圣经传统中对这位归回时期领袖的通行译名。
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: 撒拉铁的儿子
  rationale: 将希腊文父子结构明确译出，并采用中文中通行的姓名形式“撒拉铁”。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 该动词核心义为“预备、使之就绪”；“预备了”保留其宽泛含义，不擅自具体化为“建造”或“竖立”。
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: 这是 θυσιαστήριον 的标准对应词，语境已表明其献祭用途，无须增译为“献祭的坛”。
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: 以色列上帝的
  rationale: 保留希腊文属格的归属或关联关系，修饰“祭坛”，不将其解释性地改译为“为以色列的上帝”。
theological_decisions:
- issue: 群体领袖语境中 ἀδελφοί 的含义
  choice: 弟兄
  alternative: 亲族、同胞、同伴
  rationale: 原文明确使用阳性亲属称谓，且分别与祭司群体和所罗巴伯的家族相连；译作“弟兄”既保留原文家族语言，也不武断限定为同胞兄弟。
- issue: 被掳归回时期人物 Ἰησοῦς 的姓名形式
  choice: 耶书亚
  alternative: 约书亚、耶稣
  rationale: 希腊拼写本身与可译作“约书亚”或“耶稣”的形式相同，但这里所指是归回时期的祭司领袖；采用“耶书亚”可准确标识历史人物，同时以脚注保留姓名形式上的关联。
- issue: τοῦ θεοῦ Ἰσραήλ 中属格关系
  choice: 以色列上帝的祭坛
  alternative: 为以色列上帝预备祭坛
  rationale: 原文属格可表达归属或密切关联；直译为“以色列上帝的祭坛”保留这种关系，不把它收窄为目的关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式以“起来”保留希腊文分词所带出的叙事推进，并用“与……以及……一同”清楚呈现共同参与预备祭坛的各组人物。
