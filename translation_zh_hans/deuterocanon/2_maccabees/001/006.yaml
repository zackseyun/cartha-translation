lexical_decisions:
- source_word: Καὶ νῦν
  choice: 如今
  rationale: 承接上文并表达当前时点；现代汉语中“如今”自然凝练，也保留了转入现状的语气。句首不另译“而”，以免中文显得生硬，其承接作用由语序体现。
- source_word: ὧδε
  choice: 在这里
  rationale: 按地点副词理解为“这里”，而非方式义“这样”；与系词合译为自然的汉语“在这里”。
- source_word: ἐσμεν
  choice: 我们在
  rationale: 希腊语为简单系词，不扩充为“仍然”或“身处”；汉语用“我们在这里”直接表达。
- source_word: προσευχόμενοι
  choice: 祷告
  rationale: 现在分词表示与“我们在这里”同时并持续进行的行动；汉语无需另加进行体标记即可自然表达。
- source_word: περὶ ὑμῶν
  choice: 为你们
  rationale: 在祷告语境中，περί加属格表示祷告所关切、代求的对象；“为你们”准确自然，且不额外强化为更具体的礼仪性表述。
