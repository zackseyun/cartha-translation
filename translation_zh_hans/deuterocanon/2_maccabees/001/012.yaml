  yaml_path: translation/deuterocanon/2_maccabees/001/012.yaml
  text: For he himself drove those arrayed for battle in the holy city out into Persia[a][b].
translation:
  language: zh_hans
  text: 因为他亲自把那些在圣城列阵备战的人[b]驱逐[a]到波斯去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驱逐”也可译作“赶出去”或“强行逐出”；希腊语动词语气强烈，描写果断而有力的清除。
    reason: lexical_alternative
  - marker: b
    text: “列阵备战的人”也可译作“排成战阵的人”；希腊语分词是军事用语，指为战斗而列队的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: 是他亲自
  rationale: 重读代词强调行动者本人；“是他亲自”在现代汉语中自然地保留这一强调，又不越过上下文明确其身份。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文所作的解释或说明关系。
- source_word: ἐξέβρασεν
  choice: 驱逐
  rationale: 该动词带有强力赶出、彻底清除的意味；“驱逐”庄重简明，并保留行动的强制性。
- source_word: τοὺς παρατασσομένους
  choice: 那些……列阵作战的人
  rationale: 分词源自军事用语 παρατάσσω，指排成战斗阵势；此译法避免泛化为“敌人”或“士兵”。
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: 在圣城
  rationale: 按地点义直译，保留“圣城”这一神圣称谓。
- source_word: εἰς τὴν Περσίδα
  choice: 到了波斯
  rationale: εἰς 表示朝向或进入波斯的移动；与“驱逐”搭配时，“驱逐到了波斯”自然表达被赶离原处并到达该方向或地点。
theological_decisions:
- issue: 拯救或击败行动中的主体强调
  choice: 译作“是他亲自”，保留行动者直接施行此事的强调，但不在本节内补明其身份。
  alternative: 仅译作“他”，或依据上下文直接补作“上帝”。
  rationale: 原文以强调代词突出主体本人，却在本句中没有重复名号；保留代词可避免把上下文解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“是他亲自”保留原文强调；“列阵作战”准确传达军事含义。两个脚注标记均置于相关句末，正文不擅自把代词所指明说为上帝。
