  yaml_path: translation/deuterocanon/2_maccabees/001/028.yaml
  text: Torment those who oppress and insolently abuse us in their pride;[a]
translation:
  language: zh_hans
  text: 求你严惩那些压迫我们、狂傲地凌辱我们的人；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严惩”或译“使……受苦”“惩罚”；“狂傲地凌辱”也可译“以傲慢欺辱”。
    reason: 保留 βάσανισον 与 ἐξυβρίζω ἐν ὑπερηφανίᾳ 的词义范围及可行译法。
lexical_decisions:
- source_word: βάσανισον
  choice: 严惩
  rationale: 这是 βασανίζω 的不定过去时命令式；在祷告语境中，是求上帝使恶人遭受严厉痛苦或刑罚。“严惩”保留其强烈程度，同时避免“折磨”在现代汉语中可能过度突出施虐手段的意味。
- source_word: τοὺς καταδυναστεύοντας
  choice: 那些压迫我们……的人
  rationale: 该分词表示倚仗权势压制、欺压。现代汉语用“压迫”自然准确；结合群体祷告的语境，补出共同隐含的宾语“我们”。
- source_word: ἐξυβρίζοντας
  choice: 凌辱我们
  rationale: ἐξυβρίζω 表示以蛮横、傲慢的方式侮辱或虐待。“凌辱”兼具侮辱与欺凌的力度，且在现代庄重汉语中通顺；补出语境隐含的宾语“我们”。
- source_word: ἐν ὑπερηφανίᾳ
  choice: 狂傲地
  rationale: 该介词短语表达行为的傲慢态度或方式。“狂傲地”自然地修饰“凌辱”，并保留 ὑπερηφανία 强烈的负面道德色彩。
theological_decisions:
- issue: 两个并列分词的隐含宾语
  choice: 将“我们”明确表达，并理解为同时受“压迫”和“凌辱”的群体
  alternative: 不补宾语，或只在“凌辱”后补“我们”
  rationale: 希腊文两个分词均未明说宾语，但本节处于共同体向上帝发出的祷告中，敌对行为显然指向祈祷者。汉语若完全省略宾语会显得含混；一次补出“我们”即可自然地统摄两个并列动作，不增添新的神学主张。
- issue: βάσανισον 所指刑罚的具体性质
  choice: 译为“严惩”，不具体说明惩罚方式
  alternative: 译为“折磨”或“使……受苦”
  rationale: 原词可涵盖严厉折磨、苦害或惩罚；语境是向上帝求审判，但未规定实施方式。“严惩”既保留强度，又不把含义窄化为某一种肉体酷刑。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”明确呈现希腊文命令式在祈求语境中的功能；“压迫”“凌辱”“狂傲”保留原文强烈的道德与情感力度。
