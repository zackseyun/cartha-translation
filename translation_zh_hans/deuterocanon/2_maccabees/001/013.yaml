base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: zh_hans
  text: 原来，当那首领来到时，他和身边那支看似无人能挡的军队就在娜娜雅神庙里被砍杀了；这是由于侍奉娜娜雅的祭司使了诡计[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使了诡计”也可译作“施行欺骗”。原文的属格独立结构既可着重说明手段，也可说明原因。
    reason: 保留παραλογισμῷ χρησαμένων在手段与原因之间的语义张力。
lexical_decisions:
- source_word: γενόμενος
  choice: 来到以后
  rationale: 该分词字面义较宽泛，可表示“到了、出现、处于某处”。结合众人在神庙中被杀的叙事场景，译作“来到以后”自然地交代到达，却不把原文未明说的“进入”写得过实。
- source_word: ὁ ἡγεμών
  choice: 那首领
  rationale: ἡγεμών可指领袖、统治者或指挥者；这里没有必要限定为正式官职，“首领”较为稳妥。
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: 他身边……的军队
  rationale: δύναμις在此为军事力量，περὶ αὐτόν指随同、围绕他的人；“他身边的军队”符合现代汉语表达。
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: 看似无人能挡
  rationale: 保留δοκοῦσα的“看似”，不把这种印象说成事实；“无人能挡”传达ἀνυπόστατος所含“无法抵挡”的意思。
- source_word: κατεκόπησαν
  choice: 被砍杀了
  rationale: κατακόπτω表示以砍击方式杀死；“砍杀”保留动作的猛烈程度，又不增添原文没有的细节。
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: 在娜娜雅神庙里
  rationale: ἱερόν在此指供奉娜娜雅的神庙；神名按音译处理。
- source_word: παραλογισμῷ χρησαμένων
  choice: 使了诡计
  rationale: 该属格独立结构说明事件得以发生的手段或原因；παραλογισμός指欺骗、诡计，χράομαι指采用或使用。
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: 侍奉娜娜雅的祭司
  rationale: περὶ τὴν Ναναίαν表示与娜娜雅有关、服事她的祭司；“侍奉”比直译为空间性的“围绕”更符合汉语和语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看似无人能挡”保留军队只是给人不可抵挡之感；分号清楚呈现后半句对被杀原因或手段的说明。
