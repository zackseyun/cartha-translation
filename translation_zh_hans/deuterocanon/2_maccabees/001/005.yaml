  text: and may he hear your prayers[a], and be reconciled to you[c][b], and not abandon you in an evil time.
translation:
  language: zh_hans
  text: 愿他垂听你们的祈求[a]，与你们和好[b]，在患难之时[c]不离弃你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留意你们的恳求。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“重新恩待你们”，或“向你们息怒”。
    reason: alternative_reading
  - marker: c
    text: 直译：“在邪恶之时”；也可译：“在险恶之时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: 愿他垂听
  rationale: 此处是不定过去主动祈愿式，承接对上帝的祝愿；ὑπακούω在祷告语境中可指听取、留意并垂允。“垂听”是现代汉语宗教语境中自然而庄重的表达，又不至于明确译成“应允”而过度解释。
- source_word: τῶν δεήσεων
  choice: 你们的祈求
  rationale: δέησις强调因需要而发出的恳求或祈求；“祈求”比宽泛的“祷告”更贴近其迫切请求的语义。
- source_word: καταλλαγείη
  choice: 与你们和好
  rationale: 该祈愿式表达关系或恩宠的恢复。“与你们和好”保留关系性的张力，不将其缩减为情绪上的息怒，也不说明和好的机制。
- source_word: ἐγκαταλίποι
  choice: 不离弃你们
  rationale: ἐγκαταλείπω意为抛下、遗弃；“离弃”庄重而仍为现代读者熟悉，适合上帝与群体关系的语境。
- source_word: ἐν καιρῷ πονηρῷ
  choice: 在患难之时
  rationale: καιρός指特定时机或时期，πονηρός在此既可指邪恶，也可指艰难、险恶。“患难之时”在语境中自然地表达不利时期；脚注保留更贴近字面的“邪恶之时”。
theological_decisions:
- issue: καταλλαγείη应侧重上帝息怒，还是关系与恩宠的恢复
  choice: 与你们和好
  alternative: 向你们息怒／重新恩待你们
  rationale: 原文容许“和好、恢复恩待、平息不悦”等理解。“与你们和好”保存上帝与百姓之间曾有疏离而今求恢复的神学张力，同时不限定为上帝情绪变化，也不引入和好如何实现的特定教义。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。三个“愿”所统摄的希腊语祈愿式在汉语中以句首“愿他”统一表达，后续并列谓语不重复“愿他”，使句子流畅。脚注标记均置于对应措辞之后，并按正文出现顺序排列。
