  text: And the men around Nehemiah called this Nephthar[a], which is translated “Purification”; but by most people it is called Nephi.
translation:
  language: zh_hans
  text: 尼希米一行人把这称为“尼弗塔尔”，其意为“洁净”；但多数人称它为“尼弗提”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσηγόρευσαν
  choice: 称为
  rationale: 此处表示给某物命名或加以称呼；“称为”自然、简洁，并与后句的 καλεῖται 相呼应。
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: 尼希米和他身边的人
  rationale: 希腊语习语指以尼希米为中心的一群同伴；此译保留其群体结构，也比生硬直译更符合现代汉语。
- source_word: τοῦτο
  choice: 这
  rationale: 指向上文提到的事物或物质；保留原文简洁的指示关系，不擅自明确其具体所指。
- source_word: Νεφθάρ
  choice: 尼弗塔尔
  rationale: 按希腊语 Νεφθάρ 音译，并用引号表明这是一个名称。
- source_word: διερμηνεύεται
  choice: 翻译出来就是
  rationale: 表示将该外来名称解释为希腊语含义；此表达既传达“翻译”，也符合现代汉语行文。
- source_word: Καθαρισμός
  choice: 洁净
  rationale: 该名词可指清洁、洁净或洁净礼；“洁净”保留可能具有的礼仪色彩，同时不额外限定为某种具体仪式。
- source_word: καλεῖται
  choice: 称它为
  rationale: 直截了当地表达被动命名关系，并在汉语中明确承接前文所指之物。
- source_word: παρὰ τοῖς πολλοῖς
  choice: 多数人
  rationale: 表示在大众或多数人的通常用法中；“多数人”简明自然。
- source_word: Νεφθί
  choice: 尼弗提
  rationale: 依希腊语 Νεφθί 音译，保留其中的 φθ 音组与末尾长元音，不与前面的 Νεφθάρ 混同。
