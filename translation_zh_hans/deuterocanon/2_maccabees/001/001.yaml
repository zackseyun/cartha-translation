base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/001.yaml
  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: zh_hans
  text: 1 致在埃及的犹太弟兄：在耶路撒冷的犹太弟兄和在犹太地的人，向你们问安，并愿你们得美好的平安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“问安，［并致］美好的平安。”希腊文以书信中惯常的问候语χαίρειν（“问安”）开头，随后接“美好的平安”。
    reason: 说明原文紧凑的书信问候结构，以及中文为使祝愿对象明确而补足“向你们”和“愿你们得”。
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: 致在埃及的犹太弟兄
  rationale: 按书信收信人格式处理与格短语；保留ἀδελφοῖς的男性亲属称谓及群体团契意味，并以“犹太”在汉语中自然修饰“弟兄”。
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: 在耶路撒冷的犹太弟兄
  rationale: 明确发信者身份，并保留原文再次使用“弟兄”所强调的同族情谊。
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: 和犹太地区的人
  rationale: χώρα在此指地域、地区；“犹太地区”比“犹太地的土地”更符合现代普通话，同时不将其缩减为城市。
- source_word: χαίρειν
  choice: 向你们问安
  rationale: χαίρειν在希腊书信中是惯用问候语；“问安”自然体现其书信功能，补出“向你们”以使汉语句法清楚。
- source_word: εἰρήνην ἀγαθήν
  choice: 愿你们平安顺遂
  rationale: 直译“美好的平安”在现代汉语中生硬；“平安顺遂”保留εἰρήνη的核心含义，并以“顺遂”表达ἀγαθήν所修饰的良好状态，但不扩展为物质繁荣。
theological_decisions:
- issue: ἀδελφοῖς/ἀδελφοί在书信称呼中的性别表达
  choice: 弟兄
  alternative: 弟兄姊妹；同胞
  rationale: 原文重复使用阳性亲属称谓。“弟兄”既忠实保留形式，也传达犹太群体之间的亲属式团结；不据未经明说的包容范围扩写为“弟兄姊妹”。
- issue: εἰρήνην ἀγαθήν的祝愿性质
  choice: 愿你们平安顺遂
  alternative: 美好的平安；问安并祝平安
  rationale: 该短语接在惯用问候语之后，可能带有受闪语影响的书信祝愿色彩。译文保留其祝愿语气，不把“平安”神学化，也不解释为单纯政治安定。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“致”标明收信人；冒号后列出发信者及问候。保留“弟兄”的重复以再现原文的群体亲情；脚注记录χαίρειν与εἰρήνην ἀγαθήν并列所形成的独特措辞。
