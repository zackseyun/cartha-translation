base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/033.yaml
  text: But when the matter became known and it was reported to the king of the Persians that[a], in the place where the priests who had been taken away had hidden the fire, water had appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: zh_hans
  text: 这事显明后，有人向波斯王禀报说：在被迁走的祭司藏火的地方，出现了水；尼希米一行也用这水洁净了祭物[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用这水”原文直译为“从／由此”，最自然地指刚出现的水，表示以这水为媒介；也可较宽泛地理解为“在这事之后”。
    reason: 说明ἀφ’ οὗ最自然的指代和功能，同时保留较宽泛的可能理解。
  - marker: b
    text: 本节在希腊原文中句意尚未完结，接续下一节。
    reason: 说明句末逗号及跨节延续的句法。
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: 这事传开以后
  rationale: 表达此事由隐而显、为人所知的意思；现代汉语自然，也适合随后向王禀报的语境。
- source_word: διηγήθη τῷ βασιλεῖ τῶν Περσῶν
  choice: 有人禀报波斯王说
  rationale: 希腊文使用被动式，未说明报告者；汉语以不定主语“有人”保持这一点。“禀报”符合向君王正式陈述的语境。
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: 被迁走的祭司
  rationale: 保留分词的被动迁移意义，不直接限定为某种特定形式的流放。
- source_word: εἰς τὸν τόπον οὗ ... ἔκρυψαν τὸ πῦρ τὸ ὕδωρ ἐφάνη
  choice: 曾把火藏在一个地方，后来那里出现了水
  rationale: 清楚呈现先藏火、后见水的叙事次序和鲜明对照。
- source_word: ἀφ' οὗ
  choice: 用这水
  rationale: 将关系代词理解为指向最近的中性先行词“水”，并以自然汉语表达水是洁净行为所用的媒介。
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: 尼希米和同伴
  rationale: 这是表示领袖及其随从群体的希腊语习语；如此翻译比直译“尼希米周围的人”更自然。
- source_word: ἥγνισαν τὰς θυσίας
  choice: 洁净了祭物
  rationale: 保留礼仪洁净的含义；“祭物”准确而简洁，不额外引入“奉献”或“祝圣”的概念。
theological_decisions:
- issue: ἥγνισαν τὰς θυσίας 的祭仪含义
  choice: 洁净了祭物
  alternative: 使祭物成圣／洁净了祭品
  rationale: “洁净”保留动词的礼仪性，又不把经文收窄为更专门的神学术语。
- issue: ἀφ' οὗ 的指代
  choice: 理解为指水，即“用这水”
  alternative: 理解为较宽泛的“此后”，指整件事发生以后
  rationale: 最近的语法先行词是“水”，上下文也自然表明这水被用于洁净祭物；脚注说明这一解释，以保存另一种语法可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被迁走”避免过度指定历史处境；“尼希米和同伴”自然传达希腊语群体习语。句末保留逗号，因为原文句法延续至下一节。
