  yaml_path: translation/deuterocanon/2_maccabees/001/022.yaml
  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: zh_hans
  text: 这事发生后，过了一段时间，太阳虽被云遮蔽，却放出光来[a]，于是燃起了熊熊大火，众人无不惊叹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“太阳被云遮蔽时，仍放出光来。”希腊语分词短语 ἐπινεφὴς ὤν 描写阴云遮蔽的状态；正文根据上下文将它理解为让步关系，即太阳虽被云遮蔽，仍放出光来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: 这事发生后
  rationale: 这是引出后续事件的时间表达；如此译法自然简洁，不把 ἐγένετο 生硬地译成“成为”。
- source_word: χρόνος διῆλθεν
  choice: 过了一段时间
  rationale: 表达时间有所流逝，同时保留 χρόνος 对时长未作明确限定的特点。
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: 太阳……放出光来
  rationale: ἀναλάμπω 表示发出或显出光辉；“放出光来”既自然，也能体现阳光从云层中透出的动态感。
- source_word: ἐπινεφὴς ὤν
  choice: 虽被云遮蔽
  rationale: 该分词短语描写阴云遮蔽的状态；结合“放出光来”，正文采用让步理解，同时以脚注保留伴随状态的可能。
- source_word: ἀνήφθη
  choice: 燃起了
  rationale: 被动形式表示火被点燃或燃起；汉语以不明说施事者的“燃起了”自然传达其被动含义。
- source_word: πυρὰ μεγάλη
  choice: 熊熊大火
  rationale: πυρά 指火堆或火焰；“熊熊大火”自然传达 μεγάλη 所强调的规模和火势，又符合本段叙事语境。
- source_word: ὥστε θαυμάσαι πάντας
  choice: 众人无不惊叹
  rationale: 保留结果关系和 πάντας 的全体范围；“无不惊叹”庄重而符合现代汉语表达。
