base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: zh_hans
  text: 祷告是这样的：“主上帝，万物的创造者，令人敬畏[a]、大有能力、公义、怜悯的那一位，独一的君王和良善的那一位[b]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人敬畏”也可译作“可畏”；希腊语指使人产生畏惧或敬畏。
    reason: lexical_alternative
  - marker: b
    text: “良善”也可译作“仁善”或“仁慈”；希腊语 χρηστός 可表达良善、仁慈或恩厚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: 祷告是这样的
  rationale: 自然呈现希腊语“祷告具有以下形式”的引语导语，简洁而庄重。
- source_word: Κύριε ὁ θεός
  choice: 主上帝
  rationale: 按祷告中的直接称呼处理；“主上帝”在现代汉语中自然，也保留 κύριος 与 θεός 的双重称谓。
- source_word: ὁ πάντων κτίστης
  choice: 万物的创造者
  rationale: πάντων 表明范围涵盖一切，κτίστης 指创造者；译文清楚保留普遍范围。
- source_word: ὁ φοβερὸς
  choice: 令人敬畏
  rationale: φοβερός 在此指使人产生畏惧或敬畏者；“令人敬畏”避免现代汉语“可怕”可能带来的负面偏义。
- source_word: ὁ ἰσχυρὸς
  choice: 大有能力
  rationale: 表达 ἰσχυρός 的强大、有力之义，在赞颂上帝的语境中自然庄重。
- source_word: δίκαιος
  choice: 公义
  rationale: 保留描述上帝品格合乎正义的宗教与伦理含义，也不把它缩限为司法意义上的“公正”。
- source_word: ἐλεήμων
  choice: 怜悯
  rationale: 直接传达施怜悯、富有慈悲的品格。
- source_word: ὁ μόνος βασιλεὺς
  choice: 唯一的君王
  rationale: 明确保留 μόνος 所表达的排他性，并以“君王”呈现 βασιλεύς 的王权含义。
- source_word: χρηστός
  choice: 仁善
  rationale: 兼顾 χρηστός 的良善、仁慈和厚道含义；比单用“好”更庄重，也不把词义仅限于“仁慈”。
theological_decisions:
- issue: 犹太祷告中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: “主上帝”是现代汉语宗教文本中自然的直接称呼，既保留尊称，也不额外引入专名解释。
- issue: μόνος βασιλεὺς 的独一王权宣认
  choice: 唯一的君王
  alternative: 独一的君王
  rationale: “唯一”直接保留 μόνος 的排他性，不扩展或削弱原文的神学力度。
- issue: χρηστός 所指的上帝品格
  choice: 仁善
  alternative: 良善；仁慈
  rationale: 原词可涵盖良善、仁慈与恩厚；“仁善”保留较宽的语义范围，脚注列出可行译法而不强行消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。通过“那一位”的重复保留希腊语定冠词加形容词的赞颂节奏；末尾逗号表明祷告在下一节继续。
