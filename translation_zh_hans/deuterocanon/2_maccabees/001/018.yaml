base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: zh_hans
  text: 我们即将在哈色娄月二十五日举行圣殿洁净礼，认为有必要向你们说明这事，好让你们也庆祝住棚节和火的节期[a]；当尼希米建成圣殿和祭坛以后献上祭物时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“和火的”，措辞简略。这里可能指“火的节期”，并可能暗指下文所叙述、与尼希米献祭有关的火；原文并未明确说明其确切含义。
    reason: “火的节期”为使汉语句法完整所作的最小补足；脚注保留καὶ τοῦ πυρός的词汇和所指含混。
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: 我们即将……举行
  rationale: μέλλω加不定式表示即将进行或有意举行；ἄγειν在节庆语境中指举行、庆祝。
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: 在哈色娄月二十五日
  rationale: 按希腊文本音译月份名Χασελεύ为“哈色娄”，并以自然的现代汉语表达日期。
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: 圣殿洁净礼
  rationale: καθαρισμός指洁净或洁净行动；此处是要举行的纪念礼仪，用“洁净礼”既保留词义，也符合汉语节庆语境。ἱερόν译作“圣殿”。
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: 因此认为有必要向你们说明这事
  rationale: 保留δέον所表达的必要性、ἡγησάμεθα的判断意味，以及διασαφῆσαι的清楚说明之意。
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: 好让你们也庆祝
  rationale: ἵνα表达目的；καὶ αὐτοί在此自然译为“你们也”；ἄγητε按节庆语境译作“庆祝”。
- source_word: σκηνοπηγίας
  choice: 住棚节
  rationale: 这是该犹太节期在现代中文圣经及一般中文中的通行名称，也保留搭棚居住的文化意象。
- source_word: καὶ τοῦ πυρός
  choice: 和那火
  rationale: 希腊文仅作属格“和火的／和那火”，表达简略且所指含蓄。正文不用“火节”等解释性扩充，以免消除原文张力；定指“那”与随后叙事所追述的火相衔接。
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: 尼希米建成圣殿和祭坛以后
  rationale: 不定过去时分词可自然表示先于主句动作发生的行动；“建成……以后”清楚表达其与献祭的先后关系。
- source_word: ἀνήνεγκεν θυσίας
  choice: 献上了祭物
  rationale: ἀναφέρω在祭祀语境中意为献上；θυσίαι可指所献的祭物。“献上了祭物”自然且准确。
theological_decisions:
- issue: σκηνοπηγίας的节期名称
  choice: 住棚节
  alternative: 搭棚节／帐棚节
  rationale: 采用现代中文中清楚而通行的名称，不引入任何宗派性解释。
- issue: καὶ τοῦ πυρός的含义与句法
  choice: 和那火
  alternative: 和火的节庆／火节
  rationale: 原文是高度压缩的属格结构，可能指与下文之火有关的纪念活动，但没有明说“节庆”。正文保留其含蓄和语义张力，脚注给出解释性译法。
- issue: 建殿、筑坛与献祭的时间关系
  choice: 建成圣殿和祭坛以后，献上了祭物
  alternative: 建造圣殿和祭坛的尼希米献上了祭物
  rationale: 不定过去时分词通常表示先行动作，故正文表达先后关系；另一种同位性理解仍有语法可能，但不影响核心叙事。
translation_notes:
  register: 采用庄重、自然、易懂的现代标准汉语。“哈色娄”按希腊文月份名音译；“住棚节”采用通行中文名称。正文尽量保持原句的书信语气与“那火”的含蓄表达，不把下文叙事预先写入本节。
