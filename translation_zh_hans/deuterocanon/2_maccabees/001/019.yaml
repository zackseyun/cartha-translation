base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: zh_hans
  text: 因为当我们的祖先被带往波斯[a]时，那些虔诚的祭司从祭坛的火中取了一些，暗中把它藏在一口无水的井坑中，并把它妥善安置好，使人人都不知道那地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被带到波斯”或“被掳到波斯”。希腊文动词可指被带走，也可在此语境中指被带往流亡。
    reason: 词义备选
lexical_decisions:
- source_word: ἤγοντο
  choice: 被押往
  rationale: 未完成时被动态在此描述祖先被带离并前往波斯的过程。“被押往”自然地保留被动、强制迁移和行进的含义，又不把具体方式说得过细。
- source_word: Περσικὴν
  choice: 波斯
  rationale: 阴性形容词名词化，指波斯之地；现代汉语以地名“波斯”表达最自然。
- source_word: εὐσεβεῖς
  choice: 虔诚
  rationale: 表达祭司对上帝和宗教职责的敬虔忠诚，现代、庄重，也避免“敬虔”在部分读者中可能带有的特定宗派语感。
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: 从祭坛的火中取了一些
  rationale: ἀπό表明来源；补出“一些”符合部分取火的语义，也避免误解为取走全部祭坛之火。
- source_word: λαθραίως
  choice: 暗中
  rationale: 准确传达行动隐秘、不为人知，且与后文藏匿地点的目的相呼应。
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: 一口枯井的空穴里
  rationale: κοιλώματι指凹处、空穴，φρέαρ指井或井状坑穴；ἀνύδρου说明无水。“枯井的空穴”既保留具体意象，也符合现代汉语。
- source_word: κατησφαλίσαντο
  choice: 将其封存妥当
  rationale: 该词表示使之安全、稳妥保存；结合藏火的语境，“封存妥当”比单纯“使它安全”更自然，但不额外指定封闭方式。
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: 使人人都不知道那地方
  rationale: 以自然汉语表达ὥστε所引出的结果或目的，同时保持原文在目的与结果之间的轻微开放性。
theological_decisions:
- issue: 流亡背景的措辞
  choice: 被押往波斯
  alternative: 被掳到波斯／被迁往波斯
  rationale: 原文ἤγοντο表示被带走，其历史语境涉及强制流亡，但并未使用专门表示“掳掠”或行政“迁徙”的术语。“被押往”保留历史沉重感和被动性，而不加入原文未明说的机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“祖先”较“列祖”更符合普通现代读者习惯；“祭坛”沿用通行宗教与古代礼仪用语。主句保持原文因果承接，以“因为”开头。
