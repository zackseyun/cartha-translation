lexical_decisions:
- source_word: Οἱ δὲ
  choice: 则
  rationale: δέ在这里是轻微的叙事连接词，并非强烈转折；“则”自然承接前文，同时标明祭司们接续进行的动作。
- source_word: ἱερεῖς
  choice: 祭司们
  rationale: 准确表达带定冠词的特定祭司群体；汉语以“们”自然体现复数。
- source_word: ἐπέψαλλον
  choice: 唱着
  rationale: 未完成过去时描写当时正在持续的动作；“唱着”在现代汉语中自然保留这一进行状态。动词 ψάλλω 在此可指唱诵，但不必限定为纯粹的吟诵。
- source_word: τοὺς ὕμνους
  choice: 赞美诗
  rationale: ὕμνος指颂赞性的诗歌；“赞美诗”简洁、庄重，并符合礼仪语境。汉语不需机械表达希腊语定冠词。
