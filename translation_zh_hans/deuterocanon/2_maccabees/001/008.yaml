  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: zh_hans
  text: 他们放火烧了门楼，流了无辜人的血；我们祈求主，蒙了垂听。我们献上祭物和细面，取出灯盏[a]，摆上饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“点亮灯盏”。原文动词通常意为“带出”或“取出”；在这里，也可能是指预备灯盏供圣殿礼仪使用。
    reason: 说明原文字面意义与礼仪语境所提示的另一种理解。
lexical_decisions:
- source_word: ἐνέπυραν
  choice: 放火烧了
  rationale: 保留使某物着火的使动含义，也符合现代汉语的自然表达。
- source_word: τὸν πυλῶνα
  choice: 门楼
  rationale: πυλών可指大门及其建筑结构；“门楼”既体现建筑性，又不限定为塔楼或门廊。
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: 流了无辜人的血
  rationale: 贴近原文“倾流无辜之血”的意象，同时采用现代汉语中自然、庄重的说法。
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: 我们便祈求主
  rationale: ἐδέομαι表示恳切祈求；“祈求”兼顾祷告语境与恳求意味。
- source_word: εἰσηκούσθημεν
  choice: 蒙了垂听
  rationale: 保留被动形式和上帝回应祷告的重点；“蒙了垂听”庄重而清楚。
- source_word: προσηνέγκαμεν θυσίαν
  choice: 我们献上祭物
  rationale: 准确表达礼仪性的献祭行动，同时避免把无冠词单数过度限定为某一种祭。
- source_word: σεμίδαλιν
  choice: 细面
  rationale: 指献祭所用的精细小麦粉；“细面”是简洁且适合祭祀语境的标准表达。
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: 取出灯盏
  rationale: 优先保留ἐξάγω“带出、取出”的字面动作，不将语境中可能有的“点灯”含义直接写入正文；以脚注说明另一理解。
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: 摆上饼
  rationale: προτίθημι表示把物品摆出、陈列；译文自然地呈现圣所礼仪中的陈设动作，而不增添原文未明说的对象。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 此处κύριος指以色列的上帝，但现存文本为希腊文，未直接出现四字神名；译作“主”既忠于希腊文，也避免无根据地回译。
- issue: 后半节圣殿礼仪次序中ἐξηγάγομεν的理解
  choice: 正文译作“取出灯盏”，脚注列出“点亮灯盏”的语境性理解
  alternative: 正文直接译作“点亮灯盏”
  rationale: 献祭、灯盏和摆饼显然属于恢复圣殿礼仪的行动，但ἐξάγω本身通常表示带出或取出，并不直接表示点燃。正文保留词义张力，脚注说明可能的功能性含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“门楼”“祭物”“细面”“灯盏”等词保持圣殿礼仪语境，但避免过度古雅。分号承接迫害与祷告回应，后一句按原文顺序列出恢复敬拜的行动。
