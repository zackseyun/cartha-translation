  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: zh_hans
  text: 我们的上帝在各方面都当受颂赞；他把那些行事不虔的人交付了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把那些行事不虔的人交了出去。”希腊文也可更直译为“他给了那些行事不虔的人”，但没有明说把他们给谁。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντα
  choice: 在一切事上都
  rationale: 按副词性短语处理，修饰“当受颂赞”，保留其全面、加强的语气，同时符合现代汉语表达。
- source_word: εὐλογητὸς
  choice: 当受颂赞
  rationale: 用于上帝时兼顾礼仪性的称颂语气和谓语形容词的价值判断，比单纯“被称颂”更自然，也不把意思弱化为一般赞美。
- source_word: ἡμῶν ὁ θεός
  choice: 我们的上帝
  rationale: 自然体现希腊文所属结构，并保留群体与上帝之间的关系意味。
- source_word: ἔδωκεν
  choice: 交了出去
  rationale: 基本义是“给”，此处以人为宾语并处于敌对、审判语境，可能指交付于他者权下；译文保留隐含的承受者，不擅自补明交给谁。
- source_word: τοὺς ἀσεβήσαντας
  choice: 那些行事不虔的人
  rationale: 不定过去时分词着重已经发生的不敬虔行为；“行事不虔”保留其宗教与道德色彩，又避免把它静态化为一种固定身份。
theological_decisions:
- issue: ἔδωκεν接敌对人物宾语时所表达的上帝行动
  choice: 译作“把……交了出去”，理解为上帝将行事不虔的人交付于审判或败亡，却不明说承受者。
  alternative: 直译为“把那些行事不虔的人给了”，或解释性地译为“把他们交在我们手中”。
  rationale: 上下文支持交付敌人的含义，但希腊文本身没有说明交给谁；主文既表达最可能的语义，又保留原文的省略和张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“当受颂赞”保留犹太希腊文称颂上帝的礼仪语域；分号使称颂与其理由之间的关系清楚。
