base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/003.yaml
  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
translation:
  language: zh_hans
  text: 愿他赐给你们一颗忠信的心，使你们敬拜他，遵行他的旨意，怀着宽广的心和甘愿的灵魂；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信的心”也可译作“有信心的心”或“信靠的心”。希腊语短语可着重信心，也可着重忠信；正文依敬拜和遵行上帝旨意的语境采用“忠信”。
    reason: 保留 καρδίαν πίστιν 在“信心”与“忠信”之间的词义空间。
lexical_decisions:
- source_word: δοίη
  choice: 愿他赐给
  rationale: 该词为表达愿望或祈求的希腊语祈愿式；用“愿”保留祝祷语气，并依上下文保留代词“他”，不在本节擅自补出主语名称。
- source_word: καρδίαν πίστιν
  choice: 一颗忠信的心
  rationale: 这一短语可强调信心，也可强调忠贞可靠；下文紧接敬拜与遵行旨意，因此“忠信”既符合语境，也不把含义缩减为单纯的认知相信。
- source_word: σέβεσθαι
  choice: 敬拜
  rationale: 该动词在这里表示对上帝虔敬、敬畏的宗教行为；“敬拜”是现代汉语中清楚自然的对应表达。
- source_word: τὰ θελήματα
  choice: 他的旨意
  rationale: 希腊语使用复数，字面可作“他所愿的一切事”；汉语通常以集合性的单数“旨意”表达上帝所意欲之事。
- source_word: καρδίᾳ μεγάλῃ
  choice: 怀着宽广的心
  rationale: 较贴近原文“大的心”的意象，同时避免以“全心”替换成另一种惯用概念；“宽广”可表达心志开阔、慷慨而不畏缩。
- source_word: ψυχῇ βουλομένῃ
  choice: 甘愿的灵魂
  rationale: βουλομένῃ表达主动愿意或乐意，ψυχή则保留人的“灵魂/生命”层面；此处采用“灵魂”以保存原文与“心”并列的人论意象。
theological_decisions:
- issue: 非保罗书信的敬虔语境中 πίστις 词族的译法
  choice: 忠信的心
  alternative: 有信心的心；信靠的心
  rationale: 敬拜上帝并遵行其旨意的直接语境偏向忠贞、坚定的委身，但原短语也可以理解为信心或相信，因此正文采用“忠信”，脚注保留其他合理读法。
- issue: καρδίᾳ μεγάλῃ 的具体含义
  choice: 宽广的心
  alternative: 伟大的心；刚强的心；全心
  rationale: “大的心”可能表示宽宏、崇高或刚毅；正文保留较开放的“宽广”，不将其明确化为某一种德性，也不以“全心”引入原文没有直接使用的完整性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的祝祷语体。“怀着宽广的心和甘愿的灵魂”略带原文色彩，旨在保存“心”与“灵魂”的并列及其真实张力；分号承接上下文，因为本节在希腊文中并非整段祝祷的终点。
