  yaml_path: translation/deuterocanon/2_maccabees/001/009.yaml
  text: And now[b][a], celebrate the days of the Festival of Booths in the month of Chislev.
translation:
  language: zh_hans
  text: 现在，请你们在基斯流月[b]庆祝住棚节[a]的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帐棚节”；希腊文名称有“搭棚”的意思。
    reason: lexical_alternative
  - marker: b
    text: 基斯流月是犹太历的一个月份，大致相当于公历十一月至十二月。
    reason: cultural_note
lexical_decisions:
- source_word: ἄγητε
  choice: 庆祝
  rationale: ἄγω与表示日子的宾语连用时，意为守节、庆祝，并非字面上的“带领”；“庆祝”符合现代汉语，也保留节庆语气。
- source_word: τὰς ἡμέρας
  choice: 日子
  rationale: 直译希腊文的复数表达，保留该节期持续数日的时间重点。
- source_word: τῆς σκηνοπηγίας
  choice: 住棚节
  rationale: 该词指犹太人的住棚节；“住棚节”是现代汉语中清楚而通行的名称，也传达搭棚居住的含义。
- source_word: τοῦ Χασελεὺ μηνός
  choice: 在基斯流月
  rationale: 用现代汉语的时间状语自然表达希腊文属格关系；“基斯流”贴近Χασελεύ所指的犹太历月份，并采用通行中文译名。
- source_word: καὶ νῦν ἵνα
  choice: 现在，请你们
  rationale: ἵνα在此引出劝请或目的性要求；结合书信语境，译作礼貌而明确的劝请，比机械译成“为了使”更自然，同时不加强为严厉命令。
theological_decisions:
- issue: σκηνοπηγία这一节期名称的译法
  choice: 住棚节
  alternative: 帐棚节／搭棚节
  rationale: 采用中文圣经与犹太节期语境中通行且易懂的名称，不额外引入任何宗派解释；脚注保留更贴近构词的译法。
- issue: ἵνα所表达的语气
  choice: 请你们
  alternative: 使你们可以／你们要
  rationale: 原句的ἵνα在上下文中可带目的或劝请色彩。正文以自然的书信劝请表达，不把它过度定为纯粹目的从句或强命令。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“庆祝……的日子”保留原文复数“日子”的表达；“请你们”体现书信中的劝请语气。
