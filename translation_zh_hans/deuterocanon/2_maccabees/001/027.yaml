base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: zh_hans
  text: 求你聚集我们流散的同胞[a]，释放那些在列国中为奴的人，垂顾那些受人轻视、遭人憎恶的人；愿列国知道，你是我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“聚集我们的流散”；这里的“流散”指流散各地的群体。
    reason: 说明转喻性表达及正文为使所指清楚而作的显化。
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: 聚集
  rationale: 这是命令式，祈求上帝把流散者重新聚拢；“聚集”自然简洁，也保留了集合、团聚的核心语义。
- source_word: τὴν διασπορὰν ἡμῶν
  choice: 我们流散的同胞
  rationale: 字面为“我们的流散”，这里以转喻指流散的群体。译为“我们流散的同胞”明确其人的所指，同时以脚注保留字面形式。
- source_word: ἐλευθέρωσον
  choice: 释放
  rationale: 该命令式表示使人获得自由；“释放”准确传达解放之意，并与下文“为奴”自然搭配。
- source_word: τοὺς δουλεύοντας
  choice: 为奴的人
  rationale: δουλεύω在此突出受奴役、处于不自由状态，而非一般性的服事；“为奴的人”保留了这一强度。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在列国中
  rationale: ἔθνη在此指周围各民族或国家；“列国”符合经文语域，又避免把它限定解释为宗教身份上的“外邦人”。
- source_word: τοὺς ἐξουθενημένους
  choice: 受人轻视的人
  rationale: 完成时被动分词表示遭到蔑视、被视为无足轻重的人；“受人轻视”清楚保留被动含义。
- source_word: καὶ βδελυκτοὺς
  choice: 遭人憎恶的人
  rationale: βδελυκτός表达强烈的厌恶。译文保留其社会性的被排斥意味，而不把它专门化为礼仪上的“不洁”。
- source_word: ἔφιδε
  choice: 垂顾
  rationale: 祈祷语境中的命令式，意为观看、留意。“垂顾”既忠实于“看顾、顾念”的语义，又符合现代庄重祷告语言；不直接增译为“施恩”。
- source_word: γνώτωσαν
  choice: 愿……知道
  rationale: 第三人称命令式在祷告中具有祈愿语气；“愿列国知道”自然表达这一祈求，而不把它改成事实陈述。
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: 你是我们的上帝
  rationale: 直接保留谓语关系；独立的σύ带有强调，但汉语语境已能体现，无需增添“唯有”等原文没有的排他词。
theological_decisions:
- issue: “我们的流散”的所指
  choice: 译作流散群体本身，即“我们流散的同胞”
  alternative: 我们的流散；我们的离散
  rationale: 动词“聚集”以人为自然宾语，διασπορά可借转喻指流散的共同体。不过脚注说明其字面形式，以免掩盖原文的名词性表达。
- issue: δουλεύοντας的奴役含义
  choice: 译作“为奴的人”
  alternative: 服事的人；受辖制的人
  rationale: 上下文是散居列国、受压迫和获得释放，奴役或不自由的含义显著，不宜弱化为中性的“服事”。
- issue: ἔφιδε是否包含施恩含义
  choice: 译作“垂顾”
  alternative: 眷顾；施恩给
  rationale: 原词明确表达观看、留意；祷告语境可含求上帝关怀之意，但不应把未明说的“施恩”直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”明确连续命令式的祈求性质；“列国”“垂顾”保持经文庄重感，但避免艰涩古语。分号保留后半句目的或结果祈愿与前三项请求之间的结构转折。
