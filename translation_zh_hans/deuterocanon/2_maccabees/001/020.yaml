  yaml_path: translation/deuterocanon/2_maccabees/001/020.yaml
  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
translation:
  language: zh_hans
  text: 许多年过去以后，到了上帝认为合宜的时候，尼希米奉波斯王差遣，便派那些曾把火藏起来的祭司的后代去取火。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“派……到火那里去”或“为着火而派去”。希腊文十分简略；根据上下文，这里是说尼希米派祭司的后代去寻取先前藏起的火。
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: 许多年过去以后
  rationale: 属格独立结构交代时间背景；ἱκανῶν在这里表示“许多、相当多”，译文采用自然的现代汉语表达。
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: 到了上帝认为合宜的时候
  rationale: 保留ἔδοξεν加与格所表达的“认为合宜、看为好”，既体现上帝的决定，也不强化为情感上的“喜悦”。
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: 尼希米奉波斯王差遣
  rationale: 简洁表达被动分词及施事者，表明尼希米此前受波斯王派遣。
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: 那些……祭司的后代
  rationale: ἐκγόνους泛指后代，不限于直接儿子或男性子孙。
- source_word: τῶν ἀποκρυψάντων
  choice: 曾把火藏起来的
  rationale: 分词修饰祭司；根据紧邻语境补出宾语“火”，使汉语指代清楚。
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: 便派……去取火
  rationale: 原文表达简约，ἐπί加宾格可表示趋向或目的；结合上下文，指派祭司的后代前去寻取先前藏起的火。脚注保留其字面结构可能具有的含混。
theological_decisions:
- issue: ὅτε ἔδοξεν τῷ θεῷ所表达的神圣意旨
  choice: 到了上帝认为合宜的时候
  alternative: 到了上帝所喜悦的时候；上帝看为合宜时
  rationale: 译法保留上帝判断和决定的意味，同时避免把该短语限定为情感上的喜悦。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“奉波斯王差遣”简明表达分词结构；“去取火”按上下文补明目的，并以脚注保留希腊原文的简约与可能歧义。
