  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: zh_hans
  text: 他们打开烟室的暗门[a]，向那首领投掷石头，将他击倒[b]；随后把他肢解，又把那些头颅抛给外面的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“炉房”或“烟雾（香烟）之处”。这里的希腊词十分罕见，确切所指不能确定。
    reason: lexical_alternative
  - marker: b
    text: “击倒”所译的希腊词带有雷霆击打的意味，可能是形容他们猛烈地将他击倒，并不一定表示真有雷电从天而降。
    reason: lexical_alternative
  - marker: c
    text: 原文作复数“头颅”；这里没有改成单数。
    reason: textual_clarity
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: 打开
  rationale: 不定过去时分词表示先于主要动作发生；汉语按动作顺序铺陈即可自然表达。
- source_word: τὴν τοῦ φατινώματος κρυπτὴν θύραν
  choice: 烟熏室的暗门
  rationale: κρυπτήν指隐藏、隐蔽；φατίνωμα罕见且所指不确定，译作“烟熏室”既保留与烟气相关的含义，也避免断定具体设施。
- source_word: βάλλοντες πέτρους
  choice: 投石猛击
  rationale: 准确表达投掷石头的动作，并与后面的强烈动词连贯结合。
- source_word: συνεκεραύνωσαν
  choice: 将……击倒
  rationale: 该词带有雷霆般猛击的强烈色彩；正文以自然汉语表达结果，脚注保留其形象意味，不断言真有雷电降下。
- source_word: τὸν ἡγεμόνα
  choice: 那首领
  rationale: ἡγεμών可指首领、统领或长官；“首领”不把具体官职强加于原文。
- source_word: μέλη ποιήσαντες
  choice: 把他肢解
  rationale: 这是把人分割成肢体的惯用表达；“肢解”简洁而准确地传达其惨烈含义。
- source_word: τὰς κεφαλὰς
  choice: 那些头颅
  rationale: 原文使用复数，译文予以保留，不擅自改为单数。
- source_word: τοῖς ἔξω παρρίψαντες
  choice: 抛给外面的人
  rationale: τοῖς ἔξω自然指“外面的人”，而不只是地点；παρρίψαντες表示抛掷。
theological_decisions:
- issue: συνεκεραύνωσαν是指神迹性的雷击，还是形容猛烈击打
  choice: 正文译作“猛击……击倒”，脚注说明其雷霆意象
  alternative: 译作“用雷电击杀”或“如雷霆般击倒”
  rationale: 紧接的施事动作是投石，因此不宜断言有一道来自天上的真实雷电；同时借脚注保留原词鲜明而强烈的雷霆意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“投石猛击”保持动作紧凑有力；“肢解”直陈原文的暴力程度而不加渲染。对罕见地点名词、雷霆意象及“头颅”的复数分别加注，以保存原文的不确定性和异常表达。
