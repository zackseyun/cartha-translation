  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: zh_hans
  text: 因为安条克和与他同来的朋友来到那里，要娶她[a]，为要取得许多钱财，以嫁妆的名义，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要与她同住。”希腊词可指共同生活，也可指结婚；鉴于下文提到嫁妆，正文采用“娶她”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: 佯装要与她成婚
  rationale: συνοικέω可指共同生活，也可指结婚。此处与“嫁妆”相应，婚姻义最合语境；“佯装”表达叙事中的借口性质，但不把对象具体化为正文未明说的“女神”。
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: 来到那地方
  rationale: 保留普通叙事动词“来到”和原文对地点的概括表达，不擅自补为圣殿。
- source_word: ὅ τε Ἀντίοχος καὶ οἱ σὺν αὐτῷ φίλοι
  choice: 安条克和跟随他的朋友
  rationale: 保留Ἀντίοχος与φίλοι的并列，也体现σὺν αὐτῷ；“朋友”保持原词的直译，不径自解释为官员或侍从。
- source_word: χάριν τοῦ λαβεῖν
  choice: 为要取得
  rationale: 清楚表达目的结构；“取得”自然且符合其意图夺取钱财的语境。
- source_word: τὰ χρήματα πλείονα
  choice: 大笔钱财
  rationale: πλείονα有更多、较多之意；在缺少明确比较对象时，以“大笔”表达数量很大，同时避免生硬的“更多的钱”。
- source_word: εἰς φερνῆς λόγον
  choice: 算作嫁妆
  rationale: φερνή是嫁妆，εἰς…λόγον表示按某种名目或账目归类；“算作”兼顾名目与核算的语气。
theological_decisions:
- issue: “她”的身份及所谓婚姻是否真实
  choice: 正文保留代词“她”，并以“佯装”表达婚姻安排的借口性质
  alternative: 明确译作“佯装迎娶那位女神”
  rationale: 本节希腊文只写αὐτῇ“她”，身份由上下文提供；不在正文增添“女神”，可避免超出本节明文，同时“嫁妆”与叙事情境支持这里是婚姻借口。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“佯装要与她成婚”比“与她同居”更贴合嫁妆语境；句末保留原文未完的承接感，但中文仍可独立诵读。
