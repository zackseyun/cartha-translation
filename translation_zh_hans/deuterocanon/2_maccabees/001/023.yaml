base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/023.yaml
  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: zh_hans
  text: 祭物焚烧之际，祭司和众人献上祷告；约拿单起头，其余的人回应，如同尼希米所作的那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如尼希米时的做法。”本节结尾的希腊文十分简略；这里与尼希米的比较，可能指尼希米本人所作的事，也可能泛指与尼希米有关的做法。
    reason: 保留ὡς Νεεμίου这一省略结构的多重可能，避免正文将其限定为尼希米的时代。
lexical_decisions:
- source_word: προσευχὴν δὲ ἐποιήσαντο
  choice: 献上祷告
  rationale: 直译为“作了祷告”；“献上祷告”符合现代汉语的庄重礼仪语体，又不增添原文没有的具体仪式内容。
- source_word: δαπανωμένης τῆς θυσίας
  choice: 祭物焚烧之际
  rationale: δαπανωμένης是现在时被动分词，表示祭物正被耗尽或烧尽的过程；“焚烧之际”比“已经烧尽以后”更准确地保留其同时性，也符合献祭语境。
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: 祭司和众人
  rationale: πάντες泛指所有在场者；“众人”自然涵盖祭司以外的其余参与者，同时避免过度限定其身份。
- source_word: καταρχομένου Ἰωνάθον
  choice: 约拿单起头
  rationale: κατάρχομαι在此表示开始或带头进行礼仪行动；“起头”保留原文措辞，也与下文众人回应相配。
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: 其余的人应声回应
  rationale: ἐπιφωνέω在此指随之发声或作出回应；“应声回应”明确呈现轮流或呼应的祷告场景，而不擅自规定为吟唱。
- source_word: ὡς Νεεμίου
  choice: 正如尼希米那时一样
  rationale: 希腊文结尾高度省略，可能比较尼希米时期的做法，也可能指尼希米本人如何行；正文采用易懂而不过度具体化的历史性比较，另以脚注保留歧义。
theological_decisions:
- issue: ὡς Νεεμίου所指的礼仪比较
  choice: 正如尼希米那时一样
  alternative: 正如尼希米所做的一样
  rationale: 原文只用ὡς加属格人名，省略了比较关系中的成分，无法确定是指尼希米时代还是尼希米本人的行动。正文采用自然的历史性表达，脚注列出另一种可能，不把含混之处解释成确定事实。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙事语体。“祭物焚烧之际”按希腊文现在时分词表达动作同时发生；分号划分集体祷告与领祷、回应的方式。脚注标记[a]已置于正文相应句末。
