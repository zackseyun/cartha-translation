base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: zh_hans
  text: 德米特里在位的第一百六十九年，我们犹太人在伊阿宋和跟随他的人背离圣地和王国以来的这些年间，当患难和危急关头[a]临到我们时，曾写信给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “危急关头”也可译作“苦难最严重的时候”；原词有达到顶点或极点的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: 德米特里在位的
  rationale: 将属格独立结构按纪年用语处理，清楚表达事情发生在德米特里统治期间；原文没有进一步说明是哪一位德米特里，译文也不擅自补明。
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: 第一百六十九年
  rationale: 保留原文正式的纪年表达，不在正文中加入原文未明说的纪元体系。
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: 我们犹太人
  rationale: 自然呈现代词与族群称谓的同位结构，也符合书信中群体自称的语境。
- source_word: γεγράφαμεν
  choice: 写过信给你们
  rationale: 希腊语完成时强调已经发生的写信行为；“写过信”在现代汉语中自然，也不必强行判定为纯粹的书信体过去时。
- source_word: ἐν τῇ θλίψει
  choice: 在患难中
  rationale: θλῖψις表示压迫、困苦或严重苦难；“患难”庄重而通俗，且不过度技术化。
- source_word: ἐν τῇ ἀκμῇ τῇ ἐπελθούσῃ ἡμῖν
  choice: 在……临到我们的危急关头
  rationale: ἀκμή本指顶点、极盛点，在苦难语境中指情势达到尖锐或危急阶段；“危急关头”兼顾其顶峰感和处境含义。
- source_word: ἐν τοῖς ἔτεσιν τούτοις
  choice: 在这些年
  rationale: 按指示词τούτοις直译为“这些”，保留写信者自身的时间视角。
- source_word: ἀφʼ οὗ
  choice: 自从……以来
  rationale: 表达一个持续处境的起始点，比单纯的“在……之后”更能体现希腊语短语的时间延续关系。
- source_word: ἀπέστη
  choice: 背离
  rationale: ἀφίστημι可表示离开、脱离、叛离或背叛；“背离”保留其政治与宗教两方面的潜在意味，又不把含义限定为纯政治叛乱或纯宗教叛教。
- source_word: τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: 圣地和王国
  rationale: 忠实保留两个并列对象及“圣”的修饰；βασιλεία在这里可指王国、王权或统治，正文采用最直接的“王国”。
theological_decisions:
- issue: ἀπέστη所表达的是离去、政治叛离，还是宗教背道
  choice: 背离
  alternative: 离开；叛离；背道
  rationale: 原词及上下文容许政治与宗教意味并存。“离开”可能过弱，“叛离”偏重政治反叛，“背道”则过度限定为宗教叛教；“背离”较能保存原文张力。
- issue: βασιλεία在“圣地和王国”中的含义
  choice: 王国
  alternative: 王权；统治
  rationale: 原文可涉及政治实体或王权秩序。正文选较直接的“王国”，不进一步判定具体所指。
translation_notes:
  register: 采用现代、庄重而易懂的书信叙事语体。正文保留原文较长的时间状语链，但通过“也”和分句安排减轻汉语阅读负担；末句补入“便是如此”以承接前述患难处境，避免“自从……以来”在现代汉语中悬空，同时不增添新的事件内容。
