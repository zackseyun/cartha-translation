base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/011.yaml
  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: zh_hans
  text: 我们蒙上帝从重重危险中拯救出来，就万分感谢他，仿佛将要列阵对抗一位君王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同那些被部署与一位君王交战的人。”希腊原文的比较语句十分紧缩，并带有军事列阵的意象。
    reason: 保留ὡς ἂν与παρατασσόμενοι在比较语气及中间／被动语态上的歧义。
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: 从重重危险中
  rationale: 保留介词所表达的脱离之意、复数“危险”及形容词的加强语气；“重重危险”符合现代汉语表达。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 蒙上帝……拯救
  rationale: ὑπό加属格明确表示施事者；汉语用“蒙上帝”自然地保留上帝是拯救者这一信息。
- source_word: σεσωσμένοι
  choice: 拯救出来
  rationale: 该词为σῴζω的完成时被动分词，表示拯救已经发生并产生当前结果；“蒙……拯救出来”兼顾被动意义和脱离险境的结果。
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: 就万分感谢他
  rationale: “万分”体现μεγάλως的强烈程度，“感谢他”保留明确的间接宾语αὐτῷ。
- source_word: ὡς ἂν
  choice: 仿佛
  rationale: 表达压缩的比较或设想语气，同时不把其与后接分词的具体关系解释得过死。
- source_word: πρὸς βασιλέα
  choice: 迎战一位君王
  rationale: 在παρατάσσω的军事语境中，πρός表示敌对方向；“迎战”自然传达“针对、对抗”的含义。
- source_word: παρατασσόμενοι
  choice: 正列阵迎战
  rationale: 保留παρατάσσω的军事列阵意象；中间/被动形式在此可理解为主体列阵或被列入阵势，中文正文采用自然而简洁的“列阵”，歧义在脚注说明。
theological_decisions:
- issue: 拯救的施事者
  choice: 明确说是上帝拯救了写信者
  alternative: 弱化为写信者只是脱离危险
  rationale: 原文ὑπὸ τοῦ θεοῦ明确以上帝为完成拯救的施事者，译文不应将此改成含混的天意或一般性的脱险。
- issue: 末句比较的指向
  choice: 保留“仿佛正列阵迎战一位君王”的压缩军事比喻
  alternative: 将其解释为因战胜君王而感谢，或将“君王”直接认定为某一历史人物
  rationale: 希腊文本本身句法紧缩，未明说比较的全部逻辑，也未在本节点名君王；译文保留其张力，不作神学或历史上的额外判定。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“重重危险”“万分感谢”传达原文两处加强语气；末句保持军事意象和原文的压缩感，并以脚注提示可替代的被动理解。
