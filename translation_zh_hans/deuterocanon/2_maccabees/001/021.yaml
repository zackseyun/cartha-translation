base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: zh_hans
  text: 他们向我们说明，他们没有找到火[a]，却找到了浓稠的水。尼希米便吩咐他们舀出一些来带来。献祭所用的物品被搬来以后[b]，尼希米吩咐祭司把那水洒在木柴和放在木柴上面的东西上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浓稠的水”也可译作“稠厚的水”或“浓稠的液体”。希腊文的说法不同寻常；这里采用较为直译的表达，因为这种物质出人意料的特性是下文叙事的关键。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“献祭的东西”，是一个省略式说法，指与献祭有关的物品或材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: 向我们说明
  rationale: 该动词有“说明清楚、明确报告”之意；“向我们说明”在现代汉语叙事中自然，也保留了使事情明白的语气。
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: 没有找到火，只找到浓稠的水
  rationale: 保留“不……而是……”的对比，并将不同寻常的ὕδωρ παχύ较直译为“浓稠的水”，不预先把它解释成油或其他物质。
- source_word: ἀποβλίψαντας
  choice: 舀一些
  rationale: 结合前文从坑中取出液体的语境，此分词指舀取或汲取其中一部分；“舀一些”简洁自然。
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: 祭物都搬来以后
  rationale: 希腊文是“祭祀的东西被带上来”的省略表达。“祭物”在中文中可概括献祭所需或所献之物，同时以脚注提示原文的宽泛性。
- source_word: ἐπιρᾶναι
  choice: 把那水洒在
  rationale: 该动词表示将液体施于其上；“洒在”符合祭坛场景，又不把动作限定为大量倾倒。
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: 木柴和放在上面的东西
  rationale: 保留τὰ ἐπικείμενα的概括性，不擅自明确为肉块、祭牲或某种特定祭物。
theological_decisions:
- issue: Νεεμίας的姓名形式
  choice: 尼希米
  alternative: 乃赫米雅；尼赫米亚
  rationale: 采用现代中文圣经读者较熟悉的传统译名；这是专名一致性选择，不涉及对人物身份作额外神学判断。
- issue: 浓稠液体的性质
  choice: 不解释其具体物质，仅译作“浓稠的水”
  alternative: 译作油、石脑油或其他可燃液体
  rationale: 原文只称ὕδωρ παχύ，且叙事刻意保留其异常性质；不应把后文或解释传统中的辨认提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“浓稠的水”和“放在上面的东西”有意保留原文的异常性与宽泛性；句法适度拆分，使普通读者易于理解，同时不补入原文未明说的祭物种类或液体身份。
