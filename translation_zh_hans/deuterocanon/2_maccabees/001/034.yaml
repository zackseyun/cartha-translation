  text: Then the king enclosed it and made it sacred[a], after testing the matter.
translation:
  language: zh_hans
  text: 王把那里围起来；查验了这事后，就使那里成为神圣之处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就把那里设为圣所。”希腊语ἱερόν可作表语，意为“使那里成为神圣”；也可作名词，意为“设为圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  choice: 围起来
  rationale: 该词表示在四周设置围护、圈围起来；此译自然且不具体限定是篱笆还是墙。
- source_word: ἱερὸν
  choice: 使其成为圣地
  rationale: ἱερόν在此既可理解为表语性的“成为神圣”，也可理解为名词性的“成为圣所”。正文采用“圣地”，既适合被围起的地点语境，也保留其奉为神圣之处的含义；另一种理解列入脚注。
- source_word: ἐποίησεν
  choice: 使其成为
  rationale: 对应“使、造成”的基本意义，并与ἱερόν构成自然的现代汉语表达。
- source_word: δοκιμάσας
  choice: 在查验了……以后
  rationale: 不定过去时分词表示先于主要动作发生的查验或验证；“查验”比单纯“测试”更适合对一件事情加以核实的语境。
- source_word: τὸ πρᾶγμα
  choice: 这事
  rationale: πρᾶγμα泛指所涉及的事或情形；“这事”简明自然，并指向上文所述现象。
theological_decisions:
- issue: ἱερὸν描述该地点时的句法和含义
  choice: 正文译作“使其成为圣地”
  alternative: “使其成为神圣之地”或“把它设为圣所”
  rationale: 希腊文无冠词的ἱερόν可作表语形容词理解，也可作实体名词理解。译作“圣地”不必暗示建造了一座完整的殿宇，同时仍保留把该处分别为圣、设为圣所的可能，脚注明确说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“围起来”避免臆定围护结构；调整分词次序为“在查验了这事以后”，清楚表达查验先于围起并奉为圣地这一整体行动。
