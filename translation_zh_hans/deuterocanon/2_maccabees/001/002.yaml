  text: and may God do good to you[a], and remember his covenant with Abraham, Isaac, and Jacob, his faithful servants.
translation:
  language: zh_hans
  text: 愿上帝善待你们，并记念他同他忠信的奴仆亚伯拉罕、以撒和雅各所立的约[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“奴隶”，强调他们属于上帝；也可译作“仆人”。
    reason: 说明 δοῦλος 的字面含义及可接受的传统译法。
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: 善待
  rationale: 这里的不定式用于书信中的祝愿，表示祈求上帝向收信人施行益处。“善待”自然地保留了动词含义，又不具体限定上帝赐福的方式。
- source_word: μνησθῆναι
  choice: 记念
  rationale: 在盟约语境中，这不只是想起，也含有顾念并按约行动的意味。“记念”保留了这种圣经语境中的丰富含义。
- source_word: διαθήκης
  choice: 约
  rationale: 因下文明确提到亚伯拉罕、以撒和雅各，这里指上帝的盟约；“约”是简洁而惯用的译法。
- source_word: δούλων
  choice: 奴仆
  rationale: 该词本义为奴隶，强调这些先祖属于上帝并服事他。“奴仆”既保留这种归属关系，也符合中文宗教文本的庄重语体。
- source_word: πιστῶν
  choice: 忠信的
  rationale: 该形容词修饰“奴仆”，描述他们对上帝忠诚可靠；“忠信”同时保留忠诚与可信的语义。
theological_decisions:
- issue: 如何翻译用来称呼列祖的 δοῦλοι
  choice: 忠信的奴仆
  alternative: 忠信的仆人；忠信的奴隶
  rationale: “奴仆”保留了他们归属于上帝的关系，同时避免“奴隶”在现代汉语中可能只让人联想到社会制度；脚注说明其字面力度，不将这种关系弱化为一般性的服役。
- issue: 如何表达上帝“记念”盟约
  choice: 记念他与……所立的约
  alternative: 想起他与……所立的约；顾念他与……所立的约
  rationale: “记念”保留盟约语境中的张力：既可指牢记，也常暗含上帝信实地采取行动；正文不把后者明说，以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……并……”保留书信祝愿的句式；以分号澄清末尾同位说明所指的是亚伯拉罕、以撒和雅各。
