  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: zh_hans
  text: 这事发生后，火焰被点燃了；祭坛发出的光照耀时，随即便耗尽了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照耀”所译的希腊词也可表示“反照”“相向闪耀”或“回应似地发光”。希腊文末句只说“便耗尽了”，没有明说什么被耗尽；可理解为火焰，也有人理解为燃料、祭物，或结合上下文理解为先前浇下的液体。
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: 这事一发生
  rationale: ὡς与不定过去时在此引出时间从句；“一发生”自然地表现事件的紧接次序，又不过度强调绝对的即时性。
- source_word: φλὸξ ἀνήφθη
  choice: 火焰就燃了起来
  rationale: φλόξ是“火焰”，ἀνήφθη在此为被动形式，表示被点燃、燃起。汉语用“燃了起来”自然简洁；“就”承接前面的时间从句。
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: 祭坛发出的
  rationale: 介词短语修饰“光”，表示光来自祭坛；“祭坛发出的”符合现代汉语表达。
- source_word: ἀντιλάμψαντος φωτός
  choice: 光一照耀起来
  rationale: 属格独立结构表示伴随或时间情形。ἀντιλάμπω可指照耀、闪耀，也可能带有相向或回应发光的意味；正文采用自然且不过度解释的“照耀起来”，并以脚注保留词义色彩。
- source_word: ἐδαπανήθη
  choice: 便被耗尽了
  rationale: δαπανάω的被动式意为“被耗尽、消耗掉”。原文没有明说主语，汉语同样省略主语，以保留所指的不确定性。
theological_decisions:
- issue: 末句“便被耗尽了”的所指
  choice: 正文不补出主语，按希腊文保留含混
  alternative: 明确译为“火焰便耗尽了”，或理解为燃料、祭物或先前浇下的液体被耗尽
  rationale: ἐδαπανήθη在该分句中没有明说主语。就近可承接前文的“火焰”，但较广的叙事语境也容许其他理解；不应在正文中武断消除这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燃了起来”“照耀起来”清楚易懂；末句保留无主语的被动结构，既贴近原文，也保存其真实歧义。
