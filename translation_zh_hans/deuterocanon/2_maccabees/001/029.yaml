  text: Plant your people in your holy place[a], just as Moses said.
translation:
  language: zh_hans
  text: 求你把你的子民栽种在你圣洁之地[a]，正如摩西所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的子民安居在你圣洁之地。”希腊文动词字面意思是“栽种”，以此比喻使人稳固定居。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: 栽种
  rationale: 这是 καταφυτεύω 的不定过去时命令式，字面意为“栽种、种下”。译作“栽种”保留了使百姓安稳定居的鲜明比喻；“安置”虽符合语境，却会淡化原文意象。
- source_word: τὸν λαόν σου
  choice: 你的子民
  rationale: λαός 在此指作为整体、归属于上帝的群体。现代汉语圣经语境中“你的子民”自然庄重，也比“你的民族”更贴合祷告中的关系含义。
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: 在你的圣地
  rationale: εἰς 与带有安置方向的“栽种”连用，可自然译为“在”；τόπος 是“地方、地点”，ἅγιός σου 表明它是属于上帝的圣洁之地。“圣地”简洁自然，同时不把所指限定为圣殿或圣所。
- source_word: καθὼς εἶπεν Μωσῆς
  choice: 正如摩西所说的
  rationale: καθώς 表示符合或比较，εἶπεν 是“说了”。“正如摩西所说的”准确、自然，并保留了祷告对摩西之言的援引。
theological_decisions:
- issue: “你的圣地”具体指什么
  choice: 保留较宽泛的“你的圣地”，不明确限定为圣殿、圣所或某一片土地。
  alternative: 你的圣所；你的圣洁之地；你的圣土
  rationale: 希腊文仅用 τόπος（地方、地点），没有明确说明其具体所指。译文不应加入原文未明说的神学或地理限定。
- issue: “栽种”的比喻是否保留
  choice: 保留“栽种”这一意象。
  alternative: 安置；使……安居
  rationale: 原文以农业意象表达稳固安顿。直译在现代汉语中仍然可懂，也能保存原文的诗性与可能的经文回响。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”补出希腊语命令式在祈求语境中的礼貌语气；“栽种”刻意保留原文比喻。脚注说明较抽象的语境译法，但正文不消解原文意象。
