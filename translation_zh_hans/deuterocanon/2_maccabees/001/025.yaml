base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/025.yaml
  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
translation:
  language: zh_hans
  text: 惟有你是供给者[a]，惟有你是公义的；你是全能而永恒的，从一切祸患中拯救以色列，使列祖蒙拣选[b]，又使他们成圣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给者”也可译作“供应者”或“施惠者”；原词强调上帝供应人所需要的一切。
    reason: lexical_alternative
  - marker: b
    text: “使列祖蒙拣选”也可译作“使列祖成为被拣选的”或“使列祖成为蒙拣选的人”。
    reason: lexical_alternative
  - marker: c
    text: “使他们成圣”也可译作“将他们分别为圣”或“使他们成为圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: 惟有你
  rationale: 希腊文重复 μόνος，强调排他性；汉语补出祷告中隐含的第二人称，使称颂自然清楚，并以重复保留原文强调。
- source_word: χορηγός
  choice: 供应者
  rationale: 指供应、提供所需之物者；“供应者”保留核心语义，也适合对上帝的祷告称谓。
- source_word: δίκαιος
  choice: 公义的
  rationale: 在此作上帝的称号；“公义的”保留其道德与审判层面的广度，且符合现代圣经语体。
- source_word: παντοκράτωρ
  choice: 全能
  rationale: 准确表达掌有一切权能的神圣称号，简洁而通行。
- source_word: αἰώνιος
  choice: 永恒
  rationale: 称述上帝不受时间限制、永远长存；“永恒”适合本节庄重的祷告语域。
- source_word: διασώζων
  choice: 拯救
  rationale: 分词表达持续展现的救援行动；“拯救”兼具脱离危难和救助的含义。
- source_word: ἐκ παντὸς κακοῦ
  choice: 从一切祸患中
  rationale: κακόν 可指邪恶、灾祸或伤害；语境侧重以色列获救脱离危难，“祸患”保留灾害层面而不必将其限于道德之恶。
- source_word: τοὺς πατέρας
  choice: 列祖
  rationale: 指以色列盟约历史中的先祖；“列祖”不添加原文没有的“我们的”，同时保留庄重的经文语感。
- source_word: ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: 使列祖成为蒙拣选的人
  rationale: 保留 ποιέω 加宾语补语的使成结构；“蒙拣选”清楚表达他们是上帝拣选的对象。
- source_word: ἡγίασας
  choice: 使他们成圣
  rationale: 既可表示使之圣洁，也可表示分别为圣；正文采用凝练且具有祷告语域的“成圣”，以脚注提示另一可行理解。
theological_decisions:
- issue: τοὺς πατέρας 的盟约历史指向
  choice: 列祖
  alternative: 祖先；我们的列祖
  rationale: “列祖”能指向以色列的先祖并保留经文语域；希腊文没有物主词，因此不增添“我们的”。
- issue: ἐκλεκτούς 的神学措辞
  choice: 蒙拣选的人
  alternative: 被选中的人；选民
  rationale: “蒙拣选”保留上帝主动选择的含义，但不使用可能把此处直接等同于后世系统神学范畴的“选民”。
- issue: ἡγίασας 的语义范围
  choice: 使他们成圣
  alternative: 将他们分别为圣；使他们成为圣洁
  rationale: 原词兼有使圣洁与归为神圣用途的含义；正文不强行判定两者，以脚注保存其语义张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。以“惟有你”重现 μόνος 的重复和排他强调；分号划分神圣属性与施行拯救、拣选、成圣的作为。正文所有脚注标记均与脚注对应。
