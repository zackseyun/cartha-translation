    rationale: 该译法虽力图区分 τέμενος 与 περίβολος，但“范围内的围院”不够凝练；“圣域的围院”同样保留层次且更自然。
  revised_text: 娜娜亚的祭司把那些东西陈列出来后，安条克带着几个人来到圣域的围院；安条克一进去，他们就关闭了神庙。
