  yaml_path: translation/deuterocanon/2_maccabees/001/015.yaml
  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
translation:
  language: zh_hans
  text: 娜娜亚的祭司把那些东西陈列出来后，安条克带着几个人来到圣域的围院；安条克一进去，他们就关闭了神庙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθεμένων
  choice: 陈列出来
  rationale: 表示把物品摆出或呈上；“陈列出来”保留具体动作，又不进一步断定物品的性质。
- source_word: αὐτά
  choice: 那些东西
  rationale: 原文代词在本节没有明说所指，译文保留这种指代上的开放性。
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: 娜娜亚的祭司
  rationale: 按属格结构直译，并以“娜娜亚”音译神名 Ναναίου。
- source_word: προσελθόντος
  choice: 来到
  rationale: 结合随后进入的叙述，表示安条克已经来到该范围，而不只是从远处接近。
- source_word: μετʼ ὀλίγων
  choice: 带着几个人
  rationale: 原文省略所指名词；按叙事语境补出“人”，符合现代汉语表达。
- source_word: περίβολον
  choice: 围院
  rationale: 指围起来的区域；“围院”既表达其封闭性，也避免过度限定具体建筑形制。
- source_word: τέμενος
  choice: 圣所范围
  rationale: τέμενος 指划定为神圣用途的区域；如此译法可与后面的 ἱερόν 区分。
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: 把殿门关上
  rationale: 原文直义为“关闭殿宇”；汉语说“把殿门关上”自然地表达封闭建筑的动作，且符合设局困住安条克的语境。
- source_word: ὡς εἰσῆλθεν
  choice: 一进去……就
  rationale: 表达 ὡς 加不定过去时在此处的时间意义和动作的紧接性。
- source_word: Ἀντίοχος
  choice: 安条克
  rationale: 采用现代中文圣经及古典史语境中通行的人名译法。
