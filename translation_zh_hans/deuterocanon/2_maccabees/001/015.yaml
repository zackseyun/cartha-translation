  - severity: medium
    issue: “殿门”增加原文未明示的对象
    rationale: συγκλείσαντες τὸ ἱερόν 的宾语是“神庙／圣所”，不是“门”。虽可推知以关闭入口实现封闭，但正文不宜补定为“殿门”。
  - severity: low
