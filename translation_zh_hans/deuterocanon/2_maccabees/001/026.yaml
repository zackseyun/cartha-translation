  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: zh_hans
  text: 求你悦纳为你所有的子民以色列献上的祭，并保全你那一份[a]，使它成圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你那一份”很可能指以色列，即归属上帝的子民；也可能被理解为土地或圣所。
    reason: 说明“你那一份”的比喻含义及其所指存在的真实歧义，不在正文中预先限定其指向。
lexical_decisions:
- source_word: πρόσδεξαι
  choice: 求你悦纳
  rationale: 这是祷告中的不定过去时命令式，所求的不只是接收祭物，更是蒙上帝欣然接纳；“求你悦纳”自然地表达恳求语气。
- source_word: τὴν θυσίαν
  choice: 所献的祭
  rationale: θυσία在此指敬拜礼仪中的祭物或献祭；“祭”保留具体的献祭含义，并与前面的关系从句自然衔接。
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: 为你全体子民以色列
  rationale: ὑπέρ表示为某人的益处或代表某人；“为”简洁保留这一含义，“全体子民以色列”也保留原文中“以色列”对“你的子民”的同位说明。
- source_word: διαφύλαξον
  choice: 保全
  rationale: 该词意为看守、保护而使之安然存留；“保全”兼顾保护与保存的含义，符合祷告语体。
- source_word: τὴν μερίδα σου
  choice: 属于你的那一份
  rationale: μερίδα本义是所分得的一份。“属于你的那一份”保留原文的份额比喻，不直接改译为较具解释性的“产业”或“子民”，从而保存所指对象的开放性。
- source_word: καθαγίασον
  choice: 使其成圣
  rationale: 该动词表示使某物成为圣洁或分别为圣；“使其成圣”简洁、庄重，并以“其”承接前面的单数宾语。
theological_decisions:
- issue: “属于你的那一份”所指为何
  choice: 正文保留“那一份”的比喻，不明确指定其所指；就近理解很可能是上帝的子民以色列。
  alternative: 也可能指土地、圣所，或其他属于上帝的份。
  rationale: 前一句刚提到“你的子民以色列”，圣经传统也常把以色列称为上帝的份；但希腊文本本身只说“你的那一份”，没有明说所指，因此不应在正文中排除其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你悦纳”“保全”“使其成圣”保持礼仪语境的肃穆感；“属于你的那一份”则尽量贴近希腊文并保留其含义张力。
