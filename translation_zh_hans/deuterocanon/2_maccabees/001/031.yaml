  text: And when the things of the sacrifice had been consumed[a], Nehemiah ordered the remaining water to be poured on larger stones.
translation:
  language: zh_hans
  text: 献祭所用的物品都烧尽后，尼希米吩咐人把剩下的水浇在较大的石头上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνηλώθη
  choice: 烧尽
  rationale: 此处为不定过去时被动语态，结合献祭及前文火焚烧的语境，表示祭物已被火消耗完；“烧尽”在中文叙事中自然明确，同时没有超出语境。
- source_word: τὰ τῆς θυσίας
  choice: 祭物
  rationale: 中性复数加属格指属于献祭之事的各样物品，而非单指献祭这一事件。“祭物”简洁自然，并以脚注说明原文范围较宽。
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: 剩下的水
  rationale: 准确表达分词所指先前行动之后余下的水，符合现代汉语习惯。
- source_word: ἐκέλευσεν
  choice: 吩咐人
  rationale: 该动词表示权威性的指示；汉语补出泛指受命者“人”，使“吩咐……把……”结构自然，但不指定原文未说明的对象。
- source_word: λίθους μείζονας
  choice: 较大的石头
  rationale: 保留比较级 μείζονας 的形式，不将其弱化为单纯的“大石头”。
- source_word: καταχεῖν
  choice: 浇在……上
  rationale: 表达从上往下倾倒液体的动作；“浇在石头上”是自然、准确的现代汉语。
