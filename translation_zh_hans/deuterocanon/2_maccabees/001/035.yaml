  text: And from those men the king received many different gifts[a], and distributed them.
translation:
  language: zh_hans
  text: 王从那些人那里收下许多不同的礼物[a]，又把它们分送出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“许多各样的东西”。希腊文没有明说所收的是什么；“礼物”是根据上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: 从那些人那里
  rationale: 该关系代词承接上文提到的人；结合ἐλάμβανεν，按来源关系译为“从那些人那里”，使现代汉语自然清楚。
- source_word: πολλὰ διάφορα
  choice: 许多不同的礼物
  rationale: πολλά διάφορα意为“许多不同的／各样的（东西）”。原文未明说中心名词，正文依上下文补出“礼物”，并以脚注保留这一省略和其他译法。
- source_word: ἐλάμβανεν
  choice: 收下
  rationale: λαμβάνω在这里表示接受别人所给之物；“收下”比“拿走”更符合语境。未将希腊文未完成过去时机械译出，以保持汉语叙事自然。
- source_word: μετεδίδου
  choice: 把它们分送出去
  rationale: μεταδίδωμι表示把所得之物分给他人或使他人有份；“分送出去”既表达分配，也不擅自指明受领者。
