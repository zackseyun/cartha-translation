  yaml_path: translation/deuterocanon/2_maccabees/001/004.yaml
  text: and open your heart in his law and in the commandments[a], and bring about peace;
translation:
  language: zh_hans
  text: 又愿他使你们的心向他的律法和诫命敞开[a]，并带来和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“在他的律法中并在诫命中开启你们的心”。“开启”和“带来”在原文中都是不定式，承接上一节的祈愿，可译为“愿他……”。
    reason: 说明介词的直译以及本节与上一节相连的句法关系。
lexical_decisions:
- source_word: διανοίξαι
  choice: 使……敞开
  rationale: 保留“开启、打开”的比喻，并以现代汉语的使动结构表达上文祈愿中上帝的作为；不将其窄化为单纯的理性理解。
- source_word: καρδίαν
  choice: 心
  rationale: “心”保留圣经语言中内在之人的整体含义，可包括意志、领悟和态度，比“思想”更能保存原文意象。
- source_word: ἐν τῷ νόμῳ αὐτοῦ καὶ ἐν τοῖς προστάγμασιν
  choice: 向他的律法和诫命
  rationale: 原文两次使用ἐν，直译是“在他的律法中，并在诫命中”。现代汉语说“心向……敞开”更自然，也传达心对律法和诫命开放、领受的关系；脚注保留原文介词表达的空间或范围意味。
- source_word: προστάγμασιν
  choice: 诫命
  rationale: 指所颁布、所规定的命令；“诫命”在宗教伦理语境中准确、通俗，并与“律法”自然搭配。
- source_word: εἰρήνην
  choice: 和平
  rationale: 保留εἰρήνη的群体性与关系性含义，不将其缩减为个人内心的平静；本段书信祈愿的背景也支持“和平”。
- source_word: ποιῆσαι
  choice: 带来
  rationale: ποιέω在此为使和平得以实现；“带来和平”在现代汉语中自然，并保留其致使含义，避免“制造和平”的生硬表达。
theological_decisions:
- issue: 不定式所承接的主语和祈愿语气
  choice: 补出“又愿他”，明确本节两个不定式承接上节以神为主语的祈愿。
  alternative: 不补主语，译作“并使你们的心……敞开，并带来和平”。
  rationale: διανοίξαι和ποιῆσαι是不定式，其主语与祈愿语气来自上一节。汉语若完全省略，单独成节时容易被误读为命令读者采取行动；补出“愿他”不是另立神学解释，而是显明希腊句法中承接的关系。
- issue: “心被开启”与律法、诫命的关系
  choice: 译作“心向他的律法和诫命敞开”，保留内在接受与回应的宽泛含义。
  alternative: 译作“使你们明白他的律法和诫命”。
  rationale: 原文没有将“开启心”明确限定为认知上的明白，也可能包括意志与顺服，因此不把其神学张力缩减为知识理解。
- issue: εἰρήνη的范围
  choice: 使用“和平”，不限定为内心平安、政治安定或与神和好中的任何单一层面。
  alternative: 译作“赐你们平安”或“使你们和睦”。
  rationale: 原文只说“成就/带来和平”，未明说受益对象或和平的具体范围；译文保存这种开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心向……敞开”既保留原文的心灵开启意象，也避免“在律法中开启心”的生硬；“带来和平”保持祈愿语气和因果作用，同时不擅自限定和平的性质。脚注标记[a]已置于相关短语之后。
