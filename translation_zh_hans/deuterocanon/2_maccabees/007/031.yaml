base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/031.yaml
  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: zh_hans
  text: 但你成了一切加害希伯来人的恶事的策划者[a]，绝不能逃脱上帝的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “策划者”或译“设计者”或“始作俑者”。
    reason: 原文εὑρετής可指发现、设计或创始某事的人；这些译法保留其谋划、构想或开创恶事的不同侧面。
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你
  rationale: δέ承接上文并形成对比；“但你”保留直接而严厉的转向与称呼。
- source_word: πάσης κακίας
  choice: 一切恶事
  rationale: κακία泛指邪恶、恶行或恶意；“一切恶事”既保留概括性的谴责，也符合现代汉语表达。
- source_word: εὑρετὴς γενόμενος
  choice: 成了……的策划者
  rationale: εὑρετής可指发现者、创制者或谋划者；在控诉迫害的语境中，“策划者”自然表达其主动设计恶事，同时“成了”对应γενόμενος。
- source_word: εἰς τοὺς Ἑβραίους
  choice: 加害希伯来人
  rationale: 敌对语境中的εἰς表示恶事所针对的对象；“加害”自然呈现“针对、反对”的含义，并保留Ἑβραίους的族群称谓“希伯来人”。
- source_word: οὐ μὴ διαφύγῃς
  choice: 绝不能逃脱
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不能”准确传达必定无法逃脱的语气。
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: 上帝的手
  rationale: 保留原文具体的拟人化意象，不将其抽象化为“上帝的权能”或“审判”；汉语集合性单数“手”自然表达掌握与惩治。
theological_decisions:
- issue: 对上帝审判的拟人化表达
  choice: 上帝的手
  alternative: 上帝的权能；上帝的审判
  rationale: 原文使用具体的“手”这一意象，保留它能维持经文的形象性和审判力度，而不把含义预先解释成抽象概念。
- issue: 族群称谓Ἑβραίους
  choice: 希伯来人
  alternative: 犹太人
  rationale: 原文明确使用“希伯来人”，故不以较熟悉但并不相同的“犹太人”替换。
- issue: εὑρετής所表达的责任程度
  choice: 策划者
  alternative: 创始者；始作俑者；发明者
  rationale: 该词可能强调发现、设计或创始。正文采用语境自然的“策划者”，脚注保留“创始者”等可能，以免武断断定他是所有恶事最初的起源。
translation_notes:
  register: 采用现代、庄重而直接的控诉语气。“加害希伯来人的一切恶事”保留原文修饰关系；“绝不能”呈现希腊文强烈否定。脚注标记[a]紧随存在词义选择的“策划者”。
