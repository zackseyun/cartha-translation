base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: zh_hans
  text: 但那年轻人根本不理会[a]。王便把母亲叫来，劝她为那少年出主意，好保全他的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“根本不听从。”希腊文强调他完全拒绝听进去。
    reason: lexical_alternative
  - marker: b
    text: “保全他的性命”也可译作“使他安全”“使他获救”或“使他得救”。希腊文σωτηρία可指安全、保全或拯救；这里的直接语境侧重保住性命。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ νεανίου
  choice: 但那年轻人
  rationale: νεανίου指年轻男子；译作“年轻人”自然准确。δέ承接并转折前文，译作“但”。
- source_word: μηδαμῶς προσέχοντος
  choice: 根本不理会
  rationale: προσέχω在此指留心、听从；μηδαμῶς加强否定。“根本不理会”既保留完全拒绝听从的强调，也符合现代汉语叙事表达。
- source_word: προσκαλεσάμενος ὁ βασιλεὺς τὴν μητέρα
  choice: 王便把母亲叫来
  rationale: 中间语态分词表示王把母亲召到跟前；“把……叫来”自然传达这一动作。“便”体现分词动作与主句的顺接。
- source_word: παρῄνει
  choice: 劝
  rationale: παραινέω可指劝告、敦促；此处王试图借母亲说服少年，“劝”简洁自然，并未减去其施压意味。
- source_word: γενέσθαι τοῦ μειρακίου σύμβουλον
  choice: 为那少年出主意
  rationale: 字面为“成为那少年的顾问”。汉语若译“成为顾问”显得制度化；“为……出主意”自然表达充当劝告者的作用，同时保留νεανίου与μειρακίου之间“年轻人／少年”的措辞变化。
- source_word: ἐπὶ σωτηρία
  choice: 好保全他的性命
  rationale: σωτηρία语义可涵盖安全、拯救、保全。语境是王要少年屈服以免被处死，因此译出即时的生命保全含义；脚注保留较宽的词义范围。
theological_decisions:
- issue: 殉道语境中σωτηρία的译法
  choice: 好保全他的性命
  alternative: 使他安全／使他得救
  rationale: 当前语境首先指免遭处死、保存生命，并非明确陈述属灵救恩。正文采用语境上最直接的意思，同时用脚注保存原词可有的较宽语义，避免消除其潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“根本不理会”传达强烈拒绝；“出主意”比“担任顾问”更符合自然汉语。“王”依次经叙语体处理，不额外补入原句未明说的“她儿子”。
