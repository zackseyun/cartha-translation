  text: And when this one also had died[a], they were torturing the fourth in the same way, abusing him.
translation:
  language: zh_hans
  text: 当这人也死后[a]，他们照样折磨第四个兄弟，并残酷虐待他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“当这人也离世后”。这里的希腊语动词可作为对死亡的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: 死了
  rationale: 此处为属格独立结构；μεταλλάσσω在殉难叙事中委婉指离世。正文采用现代汉语最清楚自然的“死了”，脚注保留其委婉表达的可能。
- source_word: τοῦτον δὲ
  choice: 这人也
  rationale: τοῦτον回指刚才提到的兄弟；καί与δέ在这里带有递进、追加意味。“这人也”既保留指示性，也衔接接连受难的叙事。
- source_word: τὸν τέταρτον
  choice: 第四个
  rationale: 原文只说“第四个”，所指为第四个兄弟，可由上下文明确得知；不在正文中补入原文没有的“兄弟”。
- source_word: ὡσαύτως
  choice: 照样
  rationale: 表示第四个人受到与先前众人相同的处置；“照样”简洁、自然，并保留比较关系。
- source_word: ἐβασάνιζον
  choice: 折磨
  rationale: 此处指持续施加肉体酷刑。希腊语未完成时呈现持续过程；汉语通过上下文和句式自然传达这一进行性。
- source_word: αἰκιζόμενοι
  choice: 对他肆意凌辱
  rationale: 该分词表示在折磨过程中施以残酷、侮辱性的虐待。“肆意凌辱”区别于一般的“折磨”，并体现暴虐与羞辱色彩；“对他”为汉语自然补出的受事。
