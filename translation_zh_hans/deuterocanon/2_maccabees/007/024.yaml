base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: zh_hans
  text: 安提阿古以为自己受了轻视，又察觉他话语中带着侮辱的意味[a]。当最小的儿子还活着时，他不但用言语劝说，还起誓向他保证：只要他背弃祖先的传统，就要使他富有，并使他受人称羡；还要把他当作朋友[b]，委以职任[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话语中带着侮辱的意味”直译为“责难的声音”，也可译作“带着侮辱的话音”或“斥责的话”。
    reason: lexical_alternative
  - marker: b
    text: “朋友”也可能是王廷中的称号，指君王的亲信、受宠者或王廷近臣。
    reason: cultural_note
  - marker: c
    text: “委以职任”也可译作“把事务托付给他”或“委以重任”；原文可指君王交托的职责或职位。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος καταφρονεῖσθαι
  choice: 以为自己受了轻视
  rationale: 保留安提阿古的主观判断，并准确表达被动意义；“受了轻视”符合君王感到尊严受损的语境。
- source_word: τὴν ὀνειδίζουσαν ὑφορώμενος φωνήν
  choice: 又察觉那话音带着责骂
  rationale: φωνήν直指声音或话音，ὀνειδίζουσαν表示责骂、斥责或侮辱；译文既保留声音意象，也用自然汉语表达安提阿古所感受到的冒犯。
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: 趁最小的儿子还活着
  rationale: 属格独立结构表示当时的处境；在前面诸子已经殉难的上下文中，περιόντος指仍然活着。νεωτέρου在兄弟次序中指最年幼者，依上下文明确为“最小的儿子”。
- source_word: τὴν παράκλησιν ἐποιεῖτο
  choice: 用言语劝说
  rationale: 该短语指提出劝告或恳劝；这里是君王试图诱使少年改变立场，“劝说”自然且不削弱其施压意味。
- source_word: διʼ ὅρκων ἐπίστου
  choice: 起誓向他保证
  rationale: 兼顾ὅρκων的誓言和ἐπίστου使人确信、作出保证的作用，表明这不只是口头劝诱，也是郑重许诺。
- source_word: πλουτιεῖν καὶ μακαριστὸν ποιήσειν
  choice: 使他富有、令人称羡
  rationale: πλουτιεῖν指使人富有；μακαριστόν在王室利诱的世俗语境中指处境优越、被人视为有福，因此译作“令人称羡”，避免无根据地限定为属灵福分。
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: 只要他背弃祖传的规矩
  rationale: 分词在这里带条件意味；πατρίων概括祖先传下的宗教生活方式和习俗。“祖传的规矩”保留其范围，不额外加入原文没有明说的具体律例。
- source_word: φίλον ἕξειν
  choice: 把他当作朋友
  rationale: 直译核心关系，同时以脚注说明“朋友”在希腊化王廷中可能具有受宠近臣或王室属员的身份含义。
- source_word: χρείας ἐμπιστεύσειν
  choice: 委以职任
  rationale: χρείας可指受托办理的事务、职责或职位；“委以职任”兼顾行政责任和王廷任用的语境，又不过度指定某个官职。
theological_decisions:
- issue: πατρίων在背教压力语境中的范围
  choice: 祖传的规矩
  alternative: 祖先的传统；祖传的习俗
  rationale: 原文所指包括犹太人从祖先承受的信仰实践和生活规范，但没有在本句逐项界定；此译保留宗教与族群传承的张力，不缩减为一般民俗，也不扩写成特定教义术语。
- issue: μακαριστόν在君王世俗许诺中的含义
  choice: 令人称羡
  alternative: 有福；幸运
  rationale: 财富、王室友谊和职任构成此处的语境，因此该词主要描写被人视为幸福优越的处境。“令人称羡”保留评价意味，同时避免把安提阿古的利诱误读为神所赐的福。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“最小的儿子”承接本章母亲与七子的上下文；用“起誓向他保证”呈现利诱的郑重程度。分号区分财富与声望的许诺和王廷身份、职任的许诺，使长句清晰，同时保留原文连续堆叠条件与奖赏的修辞。
