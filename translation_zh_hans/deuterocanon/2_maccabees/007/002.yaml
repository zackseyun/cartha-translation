base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: zh_hans
  text: 他们中有一人出面代表众人，说：“你是要盘问我们、从我们这里了解吗？因为我们准备好了，宁可死，也不违犯祖传的律法[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖传的律法”也可译作“先祖的律法”。
    reason: 保留πατρῷα既可强调历代传承、也可直接指向先祖的词义幅度。
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: 他们中有一人
  rationale: 保留部分属格所表达的“他们当中的一个人”；上下文中的转折在汉语叙事里无需生硬译出“但”。
- source_word: γενόμενος προήγορος
  choice: 出面代表众人
  rationale: προήγορος在这里指率先发言并代表其余众人的人；“出面代表众人”比直译为“成为发言人”更自然，也不暗示正式职衔。
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: 你还想盘问我们，从我们这里知道什么？
  rationale: μέλλεις表达意图或将要采取的行动；ἐρωτᾷν在受审和逼迫的语境中译为“盘问”较为贴切。希腊文没有明写“什么”，但汉语以“知道什么”自然传达此反问的挑战意味。
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: 因为我们已经准备好，宁可死
  rationale: 保留γάρ的解释关系以及“准备好去死”的主动表达；结合后面的ἢ，用“宁可……也不……”呈现两者之间的明确取舍。
- source_word: τὰ πατρῷα νόμους
  choice: 祖传的律法
  rationale: πατρῷα强调从先辈承受而来的传统；“祖传的”在现代汉语中自然保留其传承意味，而“律法”体现νόμους在犹太信仰与群体生活中的规范性质。
- source_word: παραβαίνειν
  choice: 违犯
  rationale: 准确表达越过、违反律法规范的含义，语气庄重而不古奥。
theological_decisions:
- issue: πατρῷα νόμους所体现的犹太群体传承与律法身份
  choice: 祖传的律法
  alternative: 先祖的律法
  rationale: “祖传的律法”既保留律法由先辈传承而来的群体意义，也不额外限定其神学范围；脚注列出较贴近πατρῷα字面构词的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。直接引语保持受逼迫者坚定、挑战性的语气；避免使用过度古典的“干犯”或带有正式组织职衔色彩的“发言人”。
