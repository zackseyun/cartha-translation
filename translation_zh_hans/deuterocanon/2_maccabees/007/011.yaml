  yaml_path: translation/deuterocanon/2_maccabees/007/011.yaml
  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: zh_hans
  text: 他勇敢地说：“这些肢体是我从天上得来的；为了他的律法，我也不顾惜它们，并且盼望从他那里再次得回它们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: 勇敢地
  rationale: 表达在酷刑面前英勇无畏的方式，符合副词用法，现代汉语自然庄重。
- source_word: Ἐξ οὐρανοῦ
  choice: 从天上
  rationale: 保留原文“从天上”的表达，不擅自改明为“从上帝”。
- source_word: ταῦτα
  choice: 这些肢体／它们
  rationale: 三个复数指示代词均承接上下文中被割除的身体部位；首次明示“肢体”以便中文读者理解，后两处用代词保持连贯。
- source_word: κέκτημαι
  choice: 得来的
  rationale: 该完成时表达已经获得并现今拥有；结合“从天上”译为“得来的”简洁自然。
- source_word: διὰ τοὺς αὐτοῦ νόμους
  choice: 为了他的律法
  rationale: διά加宾格在此表示缘故或目的；“为了”保留他因忠于上帝律法而舍弃肢体的含义。
- source_word: ὑπερορῶ
  choice: 不惜舍弃
  rationale: 原词可指轻看、不顾；在肢体正遭割除的语境中，“不惜舍弃”自然表达不把它们看得比律法更重，又不暗示对身体本身的蔑视。
- source_word: πάλιν ἐλπίζω κομίσεσθαι
  choice: 盼望……再次得回
  rationale: 准确传达对将来重新领受所失肢体的盼望，并保留复活语境中的含蓄表达。
theological_decisions:
- issue: “从天上”的施予者是否明译为上帝
  choice: 保留“从天上”，随后依原文译“他的／他”
  alternative: 译作“从上帝那里”
  rationale: 原文以“天上”及第三人称代词间接指向上帝；保留这种措辞可避免把文本的含蓄指称过度明说。
- issue: “再次得回”是否明译为身体复活
  choice: 保留对肢体再次得回的盼望
  alternative: 译作“在复活时重新得到这些肢体”
  rationale: 上下文确有复活盼望，但本节并未直接出现“复活”一词；不把隐含神学内容扩写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“律法”承接犹太经卷语境；引语节奏简洁有力，表现殉道者的勇气与盼望。
