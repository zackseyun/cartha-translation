    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ δὲ τῶν υἱῶν
  choice: 最后……也在众子之后
  rationale: 该短语以与格形式作副词性用法，表示叙事次序。译作“最后”自然简洁，并用“在众子之后”保留属格 τῶν υἱῶν 所表达的相对次序；“众子”准确反映 υἱῶν，而不泛化为“孩子们”。
- source_word: ἡ μήτηρ
  choice: 母亲
  rationale: 定冠词加名词指上下文中的那位母亲。汉语无需补出原文没有的所有格，也能清楚辨认其身份。
- source_word: ἐτελεύτησεν
  choice: 死了
  rationale: τελευτάω 在此直接表示死亡；“死了”朴素、庄重，符合希腊文简短有力的叙述，避免使用委婉语。
