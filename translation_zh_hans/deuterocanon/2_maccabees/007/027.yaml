base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: zh_hans
  text: 她俯身向他，嘲弄那残暴的暴君，然后用本族语言[a]这样说：“儿子啊，可怜可怜我吧！我在腹中怀了你九个月，哺乳你三年，把你养大，使你长到如今这个年纪，并照料你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用祖传的语言”或“用母语”。原文指从父辈或本族承传的语言。
    reason: 说明τῇ πατρίᾳ φωνῇ可指本族、祖传或母语，且不擅自认定具体语种。
lexical_decisions:
- source_word: προσκύψασα αὐτῷ
  choice: 她俯身向他
  rationale: προσκυνέω可表示俯身、俯伏或下拜；这里的对象是儿子，语境是母亲贴近儿子说话。“俯身向他”保留具体动作，又不把它解释成敬拜。
- source_word: χλενάσασα
  choice: 嘲弄
  rationale: 该词表示带有轻蔑意味的讥笑或奚落；“嘲弄”简洁地传达母亲对暴君的蔑视。
- source_word: τὸν ὠμὸν τύραννον
  choice: 那残暴的暴君
  rationale: ὠμός在这里强调凶狠、残酷；“残暴”比单纯的“严酷”更符合上下文，而“暴君”直接对应τύραννος。
- source_word: τῇ πατρίᾳ φωνῇ
  choice: 用本族的语言
  rationale: πατρίᾳ兼有父辈传承、本族或本乡所有之意。“本族的语言”在现代汉语中自然，并保留其族群与家族传承色彩。
- source_word: Υἱέ
  choice: 儿子啊
  rationale: 保留明确的母子称谓和呼语语气，现代读者也容易理解。
- source_word: ἐλέησόν με
  choice: 可怜可怜我吧
  rationale: 这是母亲向儿子发出的强烈恳求。“可怜可怜我吧”比宗教语域较强的“怜悯我”更符合亲情场景，同时保留命令式恳求的力度。
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε μῆνας ἐννέα
  choice: 我曾在腹中怀你九个月
  rationale: 贴近原文“在腹中带着你九个月”，不额外加入原文未明说的“生下你”。
- source_word: θηλάσασάν σε ἔτη τρία
  choice: 哺乳你三年
  rationale: θηλάζω明确指以乳喂养；“哺乳”准确、庄重，也不显得过于临床化。
- source_word: ἐκθρέψασάν σε
  choice: 把你养大
  rationale: 该动词兼有喂养和抚育长大的意思；“养大”自然地概括长期的母亲养育。
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: 使你长到如今这个年纪
  rationale: 保留原文“带到这个年龄”的表达重点，并用自然汉语呈现。
- source_word: τροφοφορήσασαν
  choice: 一直照料你
  rationale: 此词表示持续供养、养护或照顾。“一直照料你”传达持续的母亲照护，又避免把含义限于物质供给。
theological_decisions:
- issue: 母亲所说ἐλέησόν με的语域
  choice: 可怜可怜我吧
  alternative: 怜悯我吧／体恤我吧
  rationale: 此处不是固定的神学公式，而是母亲对儿子的情感恳求。所选译法保留强烈而直接的请求，也符合现代汉语亲情语境。
- issue: τῇ πατρίᾳ φωνῇ所指的身份语言
  choice: 用本族的语言
  alternative: 用母语／用祖传的语言
  rationale: 原文强调从父辈、本族传承而来的语言，但未具体说明是哪一种语言。“本族的语言”保留这一身份含义，不擅自确定具体语种。
- issue: προσκύψασα αὐτῷ是否带有敬拜含义
  choice: 她俯身向他
  alternative: 她向他俯伏／她向他下拜
  rationale: 该动词本可表示俯伏或下拜，但在母亲向儿子说话的语境中，具体姿态与礼仪意味之间存在张力。正文采用较中性的身体动作，并以脚注保留更强的可能译法。
translation_notes:
  register: 采用自然、庄重而富有情感的现代标准汉语。母亲的话使用清楚的口语化恳求，但避免俚俗；叙述部分保持经文所需的凝练与尊严。所有脚注标记均置于相应正文词语之后。
