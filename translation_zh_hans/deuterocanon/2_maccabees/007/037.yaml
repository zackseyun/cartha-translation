base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: zh_hans
  text: 我却要像我的兄弟们一样，为了祖传的律法，交出自己的身体和性命[a]；我呼求上帝快快怜悯本族，也使你在严刑拷问和鞭打中公开承认[b]，唯有他是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”所译的希腊词也可指“命运”“际遇”或一个人所得的“份”；本处说的是殉难者所交出的生命。
    reason: lexical_alternative
  - marker: b
    text: “公开承认”也可译作“宣认”或“坦白承认”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οἱ ἀδελφοί
  choice: 像我的兄弟们一样
  rationale: 保留说话者以先前殉难的兄弟为榜样的比较关系，表达自然清楚。
- source_word: σῶμα καὶ τύχην
  choice: 身体和性命
  rationale: σῶμα直指肉身；τύχη通常可指际遇、命运或所得的份，但在舍身殉难的语境中具体指所交出的性命。脚注保留其较宽的词义范围。
- source_word: προδίδωμι
  choice: 交出
  rationale: 此处指说话者甘愿舍弃身体和性命，而非负面意义的“背叛”；“交出”既贴近字面，也能表达主动献出的意思。
- source_word: περὶ τῶν πατρίων νόμων
  choice: 为了祖传的律法
  rationale: περί在此表达“为了、为……缘故”，πατρίων指从先祖承受的传统；“祖传”在现代汉语中自然，并保留家族与传统色彩。
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: 我呼求上帝
  rationale: 该短语表示向上帝祈求、求告。希腊文分词为复数形式，与句首单数主语在语法上不完全协调；译文按当前说话者的祈求来表达，不额外引入新的复数主语。
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: 快快怜悯本族
  rationale: ἵλεως表示转为恩慈、施怜悯；ταχύ强调尽快。“本族”在上下文中指犹太民族，避免把ἔθνος误解为现代国家体制。
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: 经过严刑拷问和鞭打
  rationale: ἐτασμός在此不是普通查问，而是伴随刑罚的拷问；μάστιγες指鞭打。“经过”表达这些苦刑成为君王被迫认识真神的过程或手段。
- source_word: ἐξομολογήσασθαι
  choice: 公开承认
  rationale: 该动词可表示承认、宣认或公开表白；这里是君王在刑罚下承认真相，译作“公开承认”兼顾公开宣认的语气。
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: 唯有他是上帝
  rationale: αὐτός回指前面所提的上帝，μόνος突出排他性；译文保留原文简洁而强烈的独一神宣认。
theological_decisions:
- issue: 末句的独一神宣认
  choice: 唯有他是上帝
  alternative: 他是唯一的上帝
  rationale: “唯有他是上帝”更直接保留μόνος αὐτός的强调次序，并清楚回指前文所呼求的上帝，不作额外神学扩展。
- issue: πατρίων的传统与家族色彩
  choice: 祖传的律法
  alternative: 我们祖先的律法
  rationale: “祖传”保留律法由先祖传承而来的含义，同时比直译为“父辈的”更符合现代汉语，不把其意义抽象化为一般文化习俗。
- issue: 祈求的两个内容
  choice: 呼求上帝怜悯本族，并使君王承认唯有他是上帝
  alternative: 把君王的承认理解为与祈求无关的独立预言
  rationale: 两个不定式γενέσθαι与ἐξομολογήσασθαι都自然受ἐπικαλούμενοι支配，因此译文保留为同一次呼求中的两项祈愿。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“本族”指上下文中的犹太民族；“严刑拷问和鞭打”保持原文的暴力强度而不过度古雅。正文中的两个脚注标记分别紧随其所解释的词语。
