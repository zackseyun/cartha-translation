base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: zh_hans
  text: 我不知道你们是怎样出现在我腹中的；赐给你们灵[a]和生命的不是我，你们每个人的构造也不是我安排的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“气息”。希腊语这个词可指“灵”“气息”或“风”；这里指使人有生命的本原。
    reason: 保留πνεῦμα的词义范围及上下文中的另一种合理译法。
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: 我不知道……是怎样
  rationale: 自然传达母亲对儿子如何形成这一过程的无知，同时保留原文直白的陈述语气。
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: 你们是怎样出现在我腹中的
  rationale: ἐφάνητε本义为“出现、显现”；保留“出现”可体现其起源对母亲而言的奥秘，而“在我腹中”符合现代汉语表达。
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: 赐给你们灵和生命
  rationale: ἐχαρισάμην含慷慨赐予之意，译作“赐给”；πνεῦμα可指灵、气息或风，此处译作“灵”，以免与其后的“生命”合并为同一概念，并用脚注保留另一种可能。
- source_word: τὴν ἑκάστου στοιχείωσιν
  choice: 你们每个人的构造
  rationale: στοιχείωσις指各组成部分的构成、形成或组织；“构造”既保留其结构性含义，也不引入原文未明说的具体生理过程。
- source_word: οὐκ ἐγὼ διερρύθμισα
  choice: 也不是我安排的
  rationale: διερρύθμισα表示有秩序地安排或组织；此译法保留母亲对自身并非生命和形体终极创制者的强调。
theological_decisions:
- issue: πνεῦμα在论及人的起源时所指为何
  choice: 灵
  alternative: 气息
  rationale: πνεῦμα与ζωή并列，可能指与生命相关却不完全等同的层面。“灵”保留原词较宽的语义和神学张力；脚注说明“气息”这一可能译法。
- issue: 母亲否认自身作用的力度
  choice: 保留“不是我”的强调，表达她并非儿子生命和构造的终极赐予者与安排者
  alternative: 理解为她否认自己在生育中具有任何作用
  rationale: 原文连续强调“不是我”，但并未否定她真实的母亲身份。译文不替经文消解这一张力，也不将其扩大成对一般母性作用的全面否认。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号呈现原文三个递进并列的分句，并重复“不是我”，保留母亲否认自己是生命与人体构造终极来源的强调。
