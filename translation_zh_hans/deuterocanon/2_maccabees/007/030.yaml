base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: zh_hans
  text: 她的话还没有说完，那青年就说：“你们还等什么？我不听从王的命令，却听从律法的命令；这律法是借着摩西赐给我们先祖的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: 她的话还没有说完
  rationale: 属格独立结构表示与青年开口同时发生的动作；καταλήγω在这里指母亲的话接近结束。译文自然表达两者在时间上的重叠，同时不把原文明确化为她已经停止说话。
- source_word: ὁ νεανίας
  choice: 那青年
  rationale: νεανίας指年轻男性；“那青年”符合现代叙事语体，也承接上下文中特定的儿子。
- source_word: Τίνα μένετε;
  choice: 你们还等什么？
  rationale: 希腊语问句较为省略，直译近于“你们等什么”；中文“你们还等什么？”自然地保留了对行刑者或王的臣仆的诘问语气。
- source_word: οὐχ ὑπακούω τοῦ προστάγματος τοῦ βασιλέως
  choice: 我不听从王的命令
  rationale: 现在时表达当下明确而原则性的拒绝；“听从”既贴合ὑπακούω，也便于与下句ἀκούω形成修辞呼应。
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: 却听从律法的命令
  rationale: ἀκούω接属格在此有听从、服从之意；重复“命令”保留两个πρόσταγμα之间的鲜明对比。
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: 这律法是……赐给我们先祖的
  rationale: 分词短语修饰“律法”。πατέρες在此是祖辈、列祖之意；“先祖”在现代中文中自然，并保留祖传盟约背景。
- source_word: διὰ Μωσῆ
  choice: 借着摩西
  rationale: διά接属格表示媒介或中介；“借着摩西”准确保留律法经由摩西赐下的关系。
theological_decisions:
- issue: πατράσιν的祖传盟约用语
  choice: 我们先祖
  alternative: 我们的父辈／我们的列祖
  rationale: 原词为阳性复数，但在此指承受律法的祖辈群体。“先祖”既不抹去历史祖传含义，也比直译“父亲们”更符合现代汉语；经文并未进一步界定具体世代。
- issue: 王命与律法之命的对照
  choice: 两处均译为“命令”
  alternative: 将后一处译为“律法的规定”
  rationale: 原文两次使用πρόσταγμα，刻意把王的命令与律法的命令并置；保留同词有助于呈现青年所宣告的忠诚冲突，而不替经文化解其张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她的话还没有说完”自然呈现动作重叠；引语保持简洁有力。“听从”在两句中呼应，保留希腊文服从王命与服从律法之命的对照。
