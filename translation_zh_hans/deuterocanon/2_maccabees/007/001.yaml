base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: zh_hans
  text: 又有一次，七兄弟和他们的母亲一同被捕；王强迫他们吃法律所禁止的猪肉[a]，他们同时遭受鞭子和绳索[b]的折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吃”也可译作“取用”或“尝”；原词字面可指“触碰”，但这里在食物语境中是指把猪肉当作食物来吃。
    reason: lexical_alternative
  - marker: b
    text: “绳索”也可译作“皮条”或更字面的“筋索”，指用来施刑的索带。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: 又有一次
  rationale: 自然表达叙事承接及 καὶ 的附加意味，表明这是接续发生的另一件事。
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς
  choice: 七兄弟和他们的母亲一同
  rationale: ἀδελφούς 在本段明确指七名男性手足；“一同”自然传达 μετά。
- source_word: συλλημφθέντας
  choice: 被捕
  rationale: 符合王权胁迫的语境，并保留被动意义；“被抓住”虽较直译，但现代汉语中不如“被捕”准确自然。
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: 王强迫他们
  rationale: 将希腊语被动结构转为自然的汉语主动句，同时明确保留施事者与强迫关系。
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν ἐφάπτεσθαι
  choice: 吃法律所禁止的猪肉
  rationale: ἐφάπτεσθαι 字面可指“触碰”，在食物语境中指取用、食用；“吃”清楚自然。ἀθεμίτων 表示不合法、受禁止，译文不另行加入原文未明说的“不洁”。
- source_word: μάστιξιν καὶ νευραῖς
  choice: 用鞭子和皮索
  rationale: μάστιξιν 指鞭打工具；νευραῖς 可指以筋腱或皮条制成的索带。“皮索”既易懂，也保留其作为刑具的具体性。
- source_word: αἰκιζομένους
  choice: 折磨他们
  rationale: 该词表示凌辱、虐待或施以酷刑；结合前述刑具，“折磨”准确表达其严重程度而不过度具体化。
theological_decisions:
- issue: 犹太饮食禁令的表述
  choice: 法律所禁止的猪肉
  alternative: 不洁净的猪肉
  rationale: ἀθέμιτος 的直接意义是“不合法的、受禁止的”，并非本身就是“不洁净”一词；因此保留律法禁令的含义，而不以相关神学术语替代。
- issue: ἐφάπτεσθαι 在食物语境中的力度
  choice: 吃
  alternative: 尝／取用／触碰
  rationale: 此处王所强迫的是违反饮食禁令的行为。“触碰”会在现代汉语中造成误解；“尝”可能让人以为只需浅尝，“吃”则以自然方式传达取食之意，同时不规定食用量。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。把希腊语较长的句子分成两句，以符合现代汉语节奏；不减损被捕、强迫及受刑之间的逻辑联系。
