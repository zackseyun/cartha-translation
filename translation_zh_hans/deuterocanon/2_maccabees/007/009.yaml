base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: zh_hans
  text: 当他气息将绝时，他说：“你这受咒诅的恶人，使我们离开现今的生命；但世界之王必使我们这些为他的律法而死的人复活，进入永远的复生[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复生”指重新活过来、恢复生命。希腊原文将“永远的”与一个罕见的名词连用；该名词意为“再次得生”或“复活”。也可译作“进入永远的生命复兴”或“进入永远的复活生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: 临到最后一口气时
  rationale: 保留“最后一口气”的具体意象，也以自然汉语表达临死时刻。
- source_word: ἀλάστωρ
  choice: 恶徒
  rationale: 此处是强烈斥责语；“恶徒”传达邪恶、可憎之意，又避免引入“复仇者”等神话性专门含义。
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: 使我们离开今世的生命
  rationale: 原文直近“使我们从现今的活着中离开”；此译保留现世生命与将来生命的对照，并维持ἀπολύεις所含的“放离”意味。
- source_word: ὁ τοῦ κόσμου βασιλεὺς
  choice: 世界之王
  rationale: 直接对应κόσμος与βασιλεύς，庄重简洁，并与受话者这位地上统治者形成对照。
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: 我们这些为他的律法而死的人
  rationale: 清楚保留死因或委身关系：他们因忠于他的律法而死；“为”不强行限定为纯粹原因或代表关系。
- source_word: ἀναστήσει
  choice: 使……复起
  rationale: 保留使之起来、从死里复起的复活语义，同时不以单一教义术语吞并随后罕见的ἀναβίωσις。
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: 进入永远的再生
  rationale: ἀναβίωσις是罕见名词，意为重新活过来或恢复生命；“再生”在此取再次得生之义，既保留其词汇特色，也避免与ἀναστήσει完全重复。
theological_decisions:
- issue: 殉道者死后的复起与永远生命
  choice: 译作“必使……复起，进入永远的再生”
  alternative: “必使……复活，得着永远的生命”或“复活进入永生”
  rationale: 原文同时使用ἀναστήσει和罕见短语εἰς αἰώνιον ἀναβίωσιν ζωῆς。正文保留“复起”与“再生”两层表达，明确死后蒙神恢复生命，却不把二者压缩为一个后世定型的教义公式。
- issue: ὑπὲρ τῶν αὐτοῦ νόμων的关系
  choice: 为他的律法而死
  alternative: 因他的律法而死；为了维护他的律法而死
  rationale: ὑπέρ可表达缘故、为了或代表关系；“为……而死”在汉语中保留这一区间，不额外断定其精确逻辑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与直语体。“只能”是由前后强烈对照所表达的限制意味，用来凸显暴君只能终止今世生命，而世界之王能使死者复起。正文脚注标记[a]与脚注相对应。
