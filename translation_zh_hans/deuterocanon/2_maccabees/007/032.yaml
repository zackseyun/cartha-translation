  text: For we are suffering because of our own sins;
translation:
  language: zh_hans
  text: 因为我们受苦，是由于自己的罪；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留原文明确出现的第一人称复数代词，并借助“我们是……”体现主语的强调。
- source_word: γὰρ
  choice: 因为
  rationale: 表达本句对上文的解释作用，符合现代汉语的自然衔接方式。
- source_word: διὰ
  choice: 因
  rationale: διά后接宾格，在这里表示原因；译作“因”准确而简洁。
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: 自己的罪
  rationale: “自己”保留ἑαυτῶν的反身强调，明确这些罪属于受苦者自身；“罪”对应ἁμαρτίας的复数概念，汉语无需强行标明复数。
- source_word: πάσχομεν
  choice: 受苦
  rationale: 准确表达πάσχω在语境中的受苦之意；与“是……而……”结构结合，也自然呈现当前正在承受的境况。
theological_decisions:
- issue: 说话者受苦的原因
  choice: 明确说他们因自己的罪而受苦
  alternative: 较宽泛地译为“我们为罪受苦”，不明说反身归属
  rationale: 原文以διά加宾格明确表示原因，并以ἑαυτῶν强调是他们自己的罪；译文保留这一悔罪性的陈述，不加以淡化或扩展。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为……是因……而……”虽有意重复因果词，却分别承载γὰρ的篇章解释功能与διά的句内原因关系，可清楚保留原文结构和强调。句末分号承接原段未完的语势。
