base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: zh_hans
  text: 当他对其余的人已毫无用处时，他便下令，趁那人还活着[a]，把他送到火上，用锅煎烤他。锅里大量冒出蒸气[b]时，兄弟们和母亲彼此勉励，要英勇地死去，说道：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“趁那人还有气息”。原文强调他尚未死，酷刑便继续进行。
    reason: lexical_alternative
  - marker: b
    text: “蒸气”也可译作“烟气”或“热气”；原词可指从锅中升起的蒸气或烟雾。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς
  choice: 对其余的人已经毫无用处
  rationale: 保留原文冷酷、物化人的措辞，也不把“其余的人”具体限定为兄弟或施刑者。
- source_word: ἔτινουν
  choice: 趁那人还有气息
  rationale: 表达受刑者尚未死亡、酷刑仍在继续；“还有气息”比单说“活着”更具原文语境中的残酷力度。
- source_word: τῇ πυρᾷ προσάγειν
  choice: 把他带到火堆旁
  rationale: πυρά在此指用于施刑的火堆，而不是丧葬意义上的柴堆。
- source_word: τηγανίζειν
  choice: 放在锅里煎烤
  rationale: 动词与τηγάνιον一类的平锅、煎锅意象相关；“煎烤”既保留具体刑具和加热方式，也比现代烹饪语境中的“油炸”更准确。
- source_word: τῆς ... ἀτμίδος ... τοῦ τηγάνου
  choice: 锅里不断冒出蒸气
  rationale: ἀτμίς可指蒸气、烟气或热气；正文采用较宽泛的“蒸气”，脚注保留其他可能。
- source_word: ἐφʼ ἱκανὸν διδούσης
  choice: 持续了好一阵子
  rationale: 该短语可表示达到相当程度或延续相当时间；结合δίδωμι所表达的不断散发，用自然汉语呈现其持续性，同时不夸大具体时长。
- source_word: ἀλλήλους παρεκάλουν σὺν τῇ μητρὶ
  choice: 兄弟们便同母亲彼此勉励
  rationale: 保留相互鼓励的含义，并明确母亲也参与其中；“兄弟们”由上下文确定，但不在前半句的τοῖς λοιποῖς中提前锁定指称。
- source_word: γενναίως τελευτᾷν
  choice: 英勇地死去
  rationale: γενναίως兼有勇敢和高尚、可敬的色彩；“英勇地死去”在现代中文中自然庄重，且不引入后来的殉道教义术语。
theological_decisions:
- issue: 如何评价兄弟们面对死亡的态度
  choice: 英勇地死去
  alternative: 勇敢地死去；壮烈地死去
  rationale: “英勇”保留γενναίως兼具勇气与荣誉的正面评价，却不把这段死亡预先归入特定教派的殉道神学；“壮烈”在中文里可能增添原文没有明说的英雄主义色彩。
- issue: τοῖς λοιποῖς所指为何
  choice: 其余的人
  alternative: 其余的兄弟；旁人
  rationale: 原文只说“其余的人”，语境虽可能指其余兄弟，却仍保留一定指称空间；正文不擅自消除这种含混。
translation_notes:
  register: 采用现代、庄重而直白的叙事语言。保留原文对受刑者“毫无用处”的冷酷物化措辞，不加缓和；对酷刑的描写具体但不额外渲染。句末冒号承接下一节的话语。
