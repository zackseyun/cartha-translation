base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/019.yaml
  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
translation:
  language: zh_hans
  text: 但你不要以为，自己既企图与上帝争战[a]，还能无罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敌对上帝”。希腊语动词的字面意思是“与上帝争战”。
    reason: 提供较宽泛的词义替代，同时说明正文所保留的希腊语字面意象。
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你
  rationale: 以转折词“但”表达δέ，并用明示的第二人称“你”保留σὺ的强调和直接斥责语气。
- source_word: μὴ νομίσῃς
  choice: 不要以为
  rationale: 自然表达禁止形成错误判断的语气，符合νομίζω在此处“以为、认为”的含义。
- source_word: ἀθῷος
  choice: 无罪
  rationale: 保留该词“不负罪责、无罪”的核心意义，不把它推论性地改译为“不受惩罚”。
- source_word: ἔσεσθαι
  choice: 还能无罪
  rationale: 用“还能”在汉语中自然表达从属间接陈述中的将来结果，同时凸显这种期待的不可能性。
- source_word: θεομαχεῖν
  choice: 与上帝争战
  rationale: 保留复合动词“与神争战”的鲜明力度，而不弱化为一般性的“反对”。
- source_word: ἐπιχειρήσας
  choice: 既企图
  rationale: 表达不定过去时分词所指的已着手之举；“既”使其作为警告依据的因果意味在现代汉语中清楚自然。
theological_decisions:
- issue: θεομαχεῖν的译法
  choice: 与上帝争战
  alternative: 敌对上帝
  rationale: 原文把迫害行为定性为对上帝本人的争战；直译保留这一神学指控的力度，又不增添原文没有的解释。
- issue: ἀθῷος的含义
  choice: 无罪
  alternative: 不受惩罚
  rationale: 原词首先涉及罪责或责任，而非直接陈述刑罚结果；正文保留“无罪”，避免把隐含后果当作明说内容。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“但你”保留尖锐的对比和当面警告；句序略作汉语化处理，以“既……还……”清楚呈现企图与上帝争战是不能自以为无罪的依据。
