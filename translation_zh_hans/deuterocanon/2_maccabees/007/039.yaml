  text: But the king became furious and treated this one more cruelly than the others[a], taking the mockery bitterly.
translation:
  language: zh_hans
  text: 王却勃然大怒，对他比对其他人更加残酷，因为他对所受的嘲讽深感愤恨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他对所受的羞辱愤愤不平。”希腊语 πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ 可着重表达王因受嘲讽而苦涩、愤恨的反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκθύμως γενόμενος
  choice: 勃然大怒
  rationale: 该短语表示情绪骤然变得极其愤怒；“勃然大怒”既传达强烈程度，也符合现代汉语叙事表达。
- source_word: τούτῳ παρὰ τοὺς ἄλλους χειρίστως ἀπήντησεν
  choice: 对待他比对待其他人更加残酷
  rationale: παρὰ τοὺς ἄλλους明确构成比较，χειρίστως表示极恶劣、极严酷的方式；结合处刑语境，“更加残酷”比单纯的“更坏”更清楚。ἀπήντησεν在此指王如何处置、对待这个人，而不只是言语回应。
- source_word: πικρῶς φέρων
  choice: 深感愤恨
  rationale: 该表达描写王对嘲讽的苦涩、恼恨反应；“深感愤恨”自然传达其内在反应，同时不额外规定具体行动。
- source_word: μυκτηρισμός
  choice: 嘲讽
  rationale: 该词指带有轻蔑意味的讥笑或嘲弄；“嘲讽”是现代读者易懂且符合上下文的表达。
