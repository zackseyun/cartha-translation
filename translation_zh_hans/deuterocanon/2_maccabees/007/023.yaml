base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: zh_hans
  text: 所以，世界的创造者——他塑造了人的生成，又创定了万物的起源——必出于怜悯，把气息和生命重新赐还给你们，因为你们如今为了他的律法而不顾惜自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: 世界的创造者
  rationale: 直接表达创造世界的那一位，庄重自然，并保留定冠结构所强调的身份。
- source_word: ὁ πλάσας ἀνθρώπου γένεσιν
  choice: 他塑造了人类的起源
  rationale: πλάσας 有塑造、形成之意；γένεσις 在此指人类的生成或起源。译作“人类”可自然涵盖集合意义的 ἀνθρώπου。
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: 创设了万物的起源
  rationale: ἐξευρίσκω 可指设计、创制或构想；“创设”避免把它误解为在既有事物中“发现”，同时保留与前句不同的动词。
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: 气息和生命
  rationale: πνεῦμα 在此与 ζωή 并列，并处于受难者将失去、日后由创造者归还的语境，译作“气息”较能保留生命气息之义，也避免无根据地限定为人的灵性实体。
- source_word: πάλιν ἀποδώσει
  choice: 重新赐给
  rationale: 表达“再次归还、交还”的意义；“赐给”符合创造者施予生命的语境，“重新”明确 πάλιν。
- source_word: ὑπερορᾶτε ἑαυτούς
  choice: 不顾惜自己
  rationale: 此处不是轻蔑自己，而是为了律法把自身性命置于次要地位；“不顾惜自己”在中文中自然且贴合殉道语境。
theological_decisions:
- issue: πνεῦμα 是否应译为“灵”
  choice: 气息
  alternative: 灵
  rationale: 上下文强调创造者将受难者所失去的生命重新归还，πνεῦμα 与 ζωή 并列可自然理解为气息与生命。译作“气息”保留具体生命意义，不把经文预先导向特定的人论区分。
- issue: 本句是否明确表述身体复活
  choice: 保留“重新赐给气息和生命”的原文说法
  alternative: 译成“使你们复活”
  rationale: 经文确有恢复生命的盼望，但本句采用归还气息与生命的表达；不将其改写成更明确的教义术语，以保存原文措辞及其张力。
- issue: διὰ τοὺς αὐτοῦ νόμους 的关系
  choice: 为了他的律法
  alternative: 因为他的律法
  rationale: 这里表示他们因忠于上帝的律法而不顾惜自身；“为了”更清楚呈现行动目的与缘由，又不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。以破折号框出两个关系分句，帮助读者把握较长的希腊句式；整体尽量保留原文的重复结构“人类的起源／万物的起源”，不为追求中文简练而消除其修辞呼应。
