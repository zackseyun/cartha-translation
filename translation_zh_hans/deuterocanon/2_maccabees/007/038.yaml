base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/038.yaml
  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: zh_hans
  text: 愿全能者向我们全族公正地燃起的烈怒，在我和我的兄弟们身上止息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随着我和我的兄弟们而止息。”希腊文直译为“在我和我的兄弟们里面”，表示这烈怒在他们身上达到止息之处。
    reason: 说明介词ἐν的字面表达及其可能的中文译法。
lexical_decisions:
- source_word: στῆσαι
  choice: 止息
  rationale: 此处是不定过去时主动不定式，具有使动语义，与“烈怒”搭配表示使其停止。“止息”在现代汉语中庄重自然，并保留终止的含义。
- source_word: παντοκράτορος
  choice: 全能者
  rationale: 作为上帝的称号，准确传达其统御万有、无所不能的含义，也符合现代中文圣经语体。
- source_word: ὀργήν
  choice: 烈怒
  rationale: “烈怒”既保留神圣审判的严肃性，也呼应后文“燃起”的火焰意象；比一般的“怒气”力度更强。
- source_word: σύμπαν
  choice: 全
  rationale: 修饰“族”，表示整体、无一例外；“全族”简洁自然。
- source_word: γένος
  choice: 族
  rationale: 在本段语境中指犹太民族整体。“全族”比“种族”自然，也比现代政治意义较强的“国家”更贴近族群含义。
- source_word: δικαίως
  choice: 公正
  rationale: 作为状语修饰烈怒被燃起，表明这怒气有正当、公义的根据；“公正”保留其审判意味。
- source_word: ἐπημμένην
  choice: 燃起
  rationale: 完成时被动分词描绘烈怒已经点燃且仍在持续。“燃起”保留原文的火焰隐喻；中文由“向……燃起”自然表达其被动结果。
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: 在我和我的兄弟们身上
  rationale: 保留ἐν所表达的落点意象，即烈怒在他们身上达到停止之处；同时比直译“在我和我的兄弟们里面”自然。
theological_decisions:
- issue: 神的烈怒与殉道者受难构成审判止息之处
  choice: 译为祈愿全能者的烈怒“在我和我的兄弟们身上止息”
  alternative: 可译为“随着我和我的兄弟们而止息”，或理解为烈怒停留、落在他们身上
  rationale: στῆσαι与ὀργήν在语境中最自然地表示使烈怒停止，而ἐν指出其停止的落点。译文保留他们的受难与全族所受审判之间的张力，不进一步引入后世关于赎罪机制的技术性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“愿”补出希腊语不定式在上下文中的祈愿功能；“全族”保持族群整体之意；句式尽量保留原文把“在我和我的兄弟们身上”置于烈怒止息点的重点。
