  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: zh_hans
  text: 她用父祖的语言[a]劝勉每一个儿子。她满怀高尚而勇毅的心志，以男子的勇气激发自己女性的思虑，便对他们说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用祖先的语言”或“用本族的语言”。希腊文直指父辈或祖先传下来的言语。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里刻意使用性别对照，直译为“以男性的勇气（或精神）激发女性的思虑”。这是古代修辞性的表达。
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον τῶν ἀνθρώπων
  choice: 每一个儿子
  rationale: ἕκαστον 是分配性单数；结合上下文，τῶν ἀνθρώπων 指她的每一个儿子。译出“儿子”可使现代汉语自然清楚，同时不改变所指。
- source_word: παρεκάλει
  choice: 劝勉
  rationale: 在殉道叙事中，此词侧重鼓励并敦促他们坚守，不只是安慰；“劝勉”兼具勉励和劝说之意。
- source_word: τῇ πατρίῳ φωνῇ
  choice: 用祖传的语言
  rationale: πατρίῳ 表示父辈或祖先传下来的，φωνῇ 在此指语言；“祖传的语言”保留其祖辈传承色彩，也符合现代汉语。
- source_word: γενναίῳ πεπληρωμένη φρονήματι
  choice: 她心志高尚
  rationale: φρόνημα 可指心志、意念或精神状态，γενναῖος 表示高贵、勇毅；“心志高尚”简洁保留道德与勇毅色彩。
- source_word: τὸν θῆλυν λογισμὸν
  choice: 女性的思虑
  rationale: λογισμός 指思考、思虑，θῆλυς 明确标为女性；译文保留原文刻意的性别措辞，不将其淡化为一般的情感或软弱。
- source_word: ἄρσενι θυμῷ
  choice: 以刚勇之气
  rationale: ἄρσην 字面为男性的，θυμός 在此为勇气、刚强的精神。“刚勇之气”自然地传达古代语境中被视为男性特质的勇毅，性别对照则由脚注明确说明。
- source_word: διεγείρασα
  choice: 激发
  rationale: 该不定过去时分词表示唤起、振奋；“激发”适合与“思虑”及“刚勇之气”搭配。
- source_word: λέγουσα πρὸς αὐτούς
  choice: 便对他们说
  rationale: 将希腊语分词结构按现代汉语叙事习惯译成承接性的限定动词，并以冒号引出下一节的话。
theological_decisions:
- issue: 对母亲的性别化修辞对照
  choice: 正文保留“女性的思虑”，将 ἄρσενι θυμῷ 译为“刚勇之气”，并在脚注说明原文直译为男性的勇气或精神。
  alternative: 直译为“以男性的勇气激发女性的思虑”；或中性化为“以勇气激发自己的思绪”。
  rationale: 原文有意并置 θῆλυς 与 ἄρσην，不宜消除这一古代性别修辞；但汉语正文若用“男性的勇气”较生硬，也可能被误读为叙述者的一般命题，因此以自然措辞呈现意义，并由脚注保存明确对照。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“劝勉”“心志高尚”“刚勇之气”适合殉道叙事，又不显文言。正文拆为两句以避免希腊语长句在汉语中累赘；保留脚注标记 [a]、[b]，并用冒号衔接下一节直接引语。
