  text: But looking at him[a], he said, “Though you have authority among men, being mortal, you do what you want[b];
translation:
  language: zh_hans
  text: 他望着王，说：“你在人间有权柄，虽是必死的人，却随心所欲而行；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν
  choice: 他却直视着王
  rationale: 保留分词所表达的注视动作和当面对抗的语气；以“王”明确希腊语代词在上下文中的指称，使现代汉语自然清楚。δέ译为“却”，承接叙事并突出回应。
- source_word: Ἐξουσίαν
  choice: 权柄
  rationale: 此词指在社会政治领域中掌有的权力或权威；“权柄”兼顾统治权的含义和庄重语体。
- source_word: ἐν ἀνθρώποις
  choice: 在人中
  rationale: 按ἐν加与格保留“在人类社会范围之内”的意思，不擅自改成直接支配人的“统治众人”。“人”在现代汉语中可自然泛指人类。
- source_word: ἔχων
  choice: 掌有
  rationale: 将分词与直接称呼自然结合为“你虽……掌有”，并依语境呈现让步意味。
- source_word: ὃ θέλεις ποιεῖς
  choice: 任意而行
  rationale: 简洁表达“做你所想做的”，保留对君王恣意行事的指责；不引入哲学意义上的“意志”。
- source_word: φθαρτὸς ὤν
  choice: 却是必朽的人
  rationale: φθαρτός强调会败坏、会灭亡的有限状态；“必朽”既保留“可朽坏”的词义，又清楚表达此处针对世上君王必死性的讽刺。
theological_decisions:
- issue: φθαρτὸς ὤν对人之有限性的表达
  choice: 却是必朽的人
  alternative: 虽是会死的人／本是会朽坏的
  rationale: 经文把君王在人间的权柄与其可朽、必死的本质并置。“必朽”保留死亡与衰败两层可能，不将其收窄为某种后期有关败坏的教义术语。
- issue: ἔχων与φθαρτὸς ὤν的句法关系
  choice: 你虽在人中掌有权柄，却是必朽的人，只能任意而行
  alternative: 你在人中掌有权柄，是必朽坏的，便任意而行
  rationale: 希腊语两个分词的逻辑关系未由连接词完全明说。译文依据责备语境用“虽……却……”呈现权柄与必朽性的张力，同时避免把君王的行为解释为受神学意义上的许可。
translation_notes:
  register: 采用现代、庄重而可懂的叙事语言。“直视”增强原文πρὸς αὐτὸν ἰδών的当面对视感；“权柄”“必朽”略带经文语体但仍为普通读者可理解。句末分号表明本节语句在后续经文中继续。
