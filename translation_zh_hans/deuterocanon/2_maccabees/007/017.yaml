base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: zh_hans
  text: 但不要以为我们的民族已经被上帝抛弃。至于你，要坚持下去，且看他的大能将怎样折磨你和你的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“且看他将怎样以大能折磨你和你的后裔。”这里可把上帝而非前文的“大能”理解为动词的隐含主语。
    reason: 保留βασανιεῖ主语指向的语法与神学歧义。
lexical_decisions:
- source_word: μὴ δόκει
  choice: 不要以为
  rationale: μή加现在时命令语气构成直接禁令；“不要以为”自然、明确。
- source_word: τὸ γένος ἡμῶν
  choice: 我们的民族
  rationale: γένος在此指犹太群体，而非仅指一家血脉；“民族”保留其共同体范围。
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: 已经被上帝抛弃
  rationale: 完成时不定式表达被离弃后所处的状态；“已经被上帝抛弃”兼顾时态与神学力度。
- source_word: σὺ δὲ καρτέρει
  choice: 至于你，要坚持下去
  rationale: καρτέρει表示坚忍、撑住；在对暴君的挑战中也带有“你且撑着看”的讽刺意味。“坚持下去”保留核心词义而不把它弱化为单纯等待。
- source_word: θεώρει
  choice: 且看
  rationale: 命令式意为观看、察看；与前句连用时，“且看”自然地传达挑战语气。
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: 他的大能
  rationale: μεγαλεῖον强化κράτος的宏大与威力；“大能”简洁庄重，并自然指向上帝显出的强大力量。
- source_word: σὲ καὶ τὸ σπέρμα σου
  choice: 你和你的后裔
  rationale: σπέρμα字面为“种子”，用于人时指后代；“后裔”符合庄重的现代汉语。
- source_word: βασανιεῖ
  choice: 折磨
  rationale: βασανίζω在此有使受痛苦、施以严厉惩罚之意；“折磨”保留其强烈程度。
theological_decisions:
- issue: βασανιεῖ的主语所指
  choice: 正文采用汉语零主语结构“他的大能怎样折磨……”，使紧邻的“大能”可自然充当施事
  alternative: 把上帝本人理解为隐含主语：“他怎样折磨你和你的后裔”
  rationale: 希腊语中，前面的中性单数短语τὸ μεγαλεῖον αὐτοῦ κράτος可作为单数动词βασανιεῖ的主语；同时也可能把上帝理解为借其大能施行审判者。正文尽量贴近表层句法，脚注保留另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于你……且看”保留当面对暴君发出的挑战语气；避免古奥措辞，也不额外引入宗派性解释。
