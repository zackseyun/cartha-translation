  yaml_path: translation/deuterocanon/2_maccabees/007/035.yaml
  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: zh_hans
  text: 因为这样一来，你并没有逃脱全能、鉴察的上帝的审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Swete所收的希腊文本直译为：“因为这样一来，你已经逃脱了全能、鉴察的上帝的审判。”但上下文强烈支持否定意义：“并没有逃脱”。
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: 这样
  rationale: 承接上文所述情形，保留方式和推论色彩；现代汉语中简洁自然。
- source_word: γὰρ
  choice: 因为
  rationale: 明确表达本句对上文的解释关系。
- source_word: κρίσιν
  choice: 审判
  rationale: 符合此处上帝施行司法判断及惩罚的语境，同时不把含义限缩为正式判决或抽象公义。
- source_word: ἐκπέφευγας
  choice: 你并没有逃脱
  rationale: 完成时表达企图逃避后所处的结果状态。传世希腊文本形式上是肯定式，但上下文强烈要求否定意义；正文按语境译出，并以脚注交代文本问题。
- source_word: παντοκράτορος
  choice: 全能
  rationale: 表达上帝拥有不受限制的权能；用语庄重、清楚，也避免过度展开为解释性短语。
- source_word: ἐπόπτου
  choice: 鉴察一切
  rationale: 该词指监察、注视者；译作“鉴察一切”自然表达上帝无所遗漏的察看，同时保留本段无人能躲避其审判的重点。
- source_word: θεοῦ
  choice: 上帝
  rationale: 作为κρίσιν所支配的属格，并由παντοκράτορος与ἐπόπτου修饰；“上帝”符合现代庄重中文圣经语体。
theological_decisions:
- issue: 如何翻译神圣称号παντοκράτορος ἐπόπτου θεοῦ
  choice: 那位鉴察一切、全能之上帝
  alternative: 全能的监察者上帝；鉴察万有的全能上帝
  rationale: 希腊文将两个修饰称号叠加于“上帝”。此译明确保留其全能与监察两方面，又以自然中文呈现，不引入后期教义术语或特定宗派解释。
- issue: 如何处理传世文本中没有显式否定词的ἐκπέφευγας
  choice: 你并没有逃脱
  alternative: 你已经逃脱
  rationale: Swete所传希腊文在语法形式上是肯定的“你已经逃脱”，但本章直接语境是在警告迫害者不能躲过上帝的审判，因此否定意义极为强烈，可能反映传抄时否定词脱落。正文采用语境所要求的否定读法，同时在脚注中透明保留传世形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“鉴察一切”比生硬的“监察者”更自然，并凸显无人能躲避上帝察看与审判的语境。脚注标记置于完整句末，清楚说明正文否定读法与传世希腊形式之间的重大差异。
