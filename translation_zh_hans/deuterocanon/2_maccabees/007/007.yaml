base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: zh_hans
  text: 第一个这样死去以后，他们把第二个带来受辱。他们剥下他连着头发的头皮[a]，问他[b]：“在他们逐肢刑罚你的身体以前，你肯吃吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头皮”也可较直译为“头部的皮肤”。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的“吃”，按上下文是指吃祖传律法所禁止的食物。
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: 死去以后
  rationale: 该词本可指离去或改变，但在此前酷刑致死的叙事语境中，是死亡的委婉说法；译为“死去以后”准确而自然。
- source_word: τοῦ πρώτου
  choice: 第一个
  rationale: 原文只说“第一个”，没有明说“兄弟”；中文在上下文中同样可以保留这一省略。
- source_word: τὸν τρόπον τοῦτον
  choice: 这样
  rationale: 回指第一个人方才受刑而死的方式，简洁保留原文的指示意义。
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: 押来凌辱
  rationale: ἐμπαιγμός兼有嘲弄、羞辱以及把人当作戏弄对象之意；此处伴随酷刑，“凌辱”比单纯“嘲笑”更切合，“押来”也符合被强制带到施刑者面前的情境。
- source_word: τὸ τῆς κεφαλῆς δέρμα
  choice: 头皮
  rationale: 字面为“头部的皮肤”；现代汉语“头皮”简洁明确，并未增添原文没有的内容。
- source_word: σὺν ταῖς θριξὶν
  choice: 连着头发的
  rationale: 表达头皮与头发一并被剥下，保持原文对暴力动作的具体描写。
- source_word: περισύραντες
  choice: 剥下
  rationale: 该词表示以拖扯、剥除的方式除去；“剥下”在中文中准确呈现对头皮的暴力剥离。
- source_word: ἐπηρώτων
  choice: 问
  rationale: 希腊文未完成时可表示持续或反复发问，但中文叙事用“问”最自然；不强行加入“不断”等未必确定的语气。
- source_word: Εἰ φάγεσαι
  choice: 你肯吃吗
  rationale: 问题不仅询问将来的动作，也是在逼迫他是否愿意顺从而吃；“肯”自然传达这一意志层面，而所吃之物由上下文说明。
- source_word: πρὸ τοῦ τιμωρηθῆναι κατὰ μέλος τὸ σῶμα
  choice: 在你的身体一肢一肢受刑以前
  rationale: τιμωρέω可泛指惩罚，此处具体是肉体酷刑；“受刑”既保留惩罚含义，也符合场景。“一肢一肢”保留κατὰ μέλος的逐一、分肢意味。
theological_decisions:
- issue: 所吃之物是否在正文中明说为律法禁止的食物
  choice: 正文只译“吃”，不补出对象
  alternative: 译作“吃那禁物”或“吃猪肉”
  rationale: 本节希腊文没有明说食物对象；上下文虽清楚涉及祖传律法所禁之食物，正文仍应保留原文的省略，以免把语境解释写入经文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“押来凌辱”呈现强制与羞辱性，“剥下他连着头发的头皮”保留原文的残酷具体性；问句保持直接威胁的语气，同时不补写原文省略的食物名称。
