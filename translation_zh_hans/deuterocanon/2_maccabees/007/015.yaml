lexical_decisions:
- source_word: Ἐχομένως
  choice: 接着
  rationale: 表示叙事按次序推进；“接着”简洁自然。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是承接性虚词，汉语用“接着”已自然表达语篇推进，无须另加“而”或“但”。
- source_word: τὸν πέμπτον
  choice: 第五个
  rationale: 原文仅作“第五个”，没有明说“兄弟”；译文保留这一省略，并以脚注说明上下文所指。
- source_word: προσάγοντες
  choice: 带上来
  rationale: 表示把人带到在场者面前；“带上来”符合行刑场景，也保持动作先于主要动词的关系。
- source_word: ᾐκίζοντο
  choice: 折磨他
  rationale: 该词指残酷虐待或施加酷刑；结合上下文，“折磨”准确传达其严重程度。宾语“他”由“第五个”自然补出。
