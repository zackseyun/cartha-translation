  text: So then, let this be enough about the mother’s compassion and the extraordinary tortures.
translation:
  language: zh_hans
  text: 至于母亲的慈爱和极其残酷的酷刑，叙述到此为止。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于深切的情感和极端的虐待，就陈述到这个程度。”
    reason: 保留σπλαγχνισμούς较宽泛的“深切情感”含义，以及ἐπὶ τοσούτου δεδηλώσθω的较形式化表达；“虐待”呈现αἰκίαι的另一可行译法。
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: 关于这些深切的情感
  rationale: σπλαγχνισμούς是复数，字面涉及由内心深处而发的强烈情感，也可指怜爱、慈爱。译作“这些深切的情感”既保留复数和一定的语义开放性，又结合上文自然指向母亲的慈爱与内心感受，而不把原文未明说的“母亲”直接补入正文。
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: 异乎寻常的酷刑
  rationale: αἰκίαι在本段殉难叙事中指残酷虐待或酷刑；ὑπερβαλλούσας表示超乎常度。“异乎寻常的酷刑”自然传达其极端程度与具体暴力。
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: 就说到这里
  rationale: 这一组合是结束叙述的正式表达，直译近于“就陈述到这个程度”。“就说到这里”在现代汉语中简洁自然，也保留作者为本段收束划界的语气。
- source_word: μὲν οὖν
  choice: 那么
  rationale: 此处兼具承接与总结作用。“那么”自然引出全段的收束，不机械逐词翻译μὲν。
