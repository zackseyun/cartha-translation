base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: zh_hans
  text: 在他之后，他们又把第六个儿子带来。他快要死的时候说：“不要再受迷惑了[a]。我们受这些苦，是我们自己招致的，因为我们得罪了自己的上帝。令人惊异的事已经发生了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要再走迷了”，或“不要受骗”。希腊文表达凝缩，可指受误导、判断错误或继续走入迷途。
    reason: lexical_alternative
  - marker: b
    text: 直译：“配得惊异的事已经发生了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: 在他之后，他们又把第六个带来
  rationale: 按叙事次序译出“在他之后”；ἤγον虽为未完成时，在中文叙事中用“带来”更自然。“第六个”依上下文指第六个兄弟，不在正文增添原文未明说的“兄弟”。
- source_word: μέλλον ἀποθνήσκειν
  choice: 他临死时
  rationale: 简洁自然地表达μέλλω加不定式所表示的死亡迫近；也可译作“快要死的时候”。
- source_word: Μὴ πλανῶ μάλλον
  choice: 不要再受迷惑了
  rationale: πλανάω可指受误导、受欺骗或走入迷途；μάλλον在此可有“更进一步、再”的意味。希腊文表达凝缩，因此用脚注保留其他可能。
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: 我们遭受这一切，原是我们自己造成的
  rationale: διʼ ἑαυτούς在这里表示原因和自身责任，而不是“为了我们自己”；此译法以自然中文保留他们应为苦难负责的意思。
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: 因为我们得罪了自己的上帝
  rationale: 将原因性分词用明确而自然的因果从句表达；“得罪……上帝”准确传达犯罪所指向的对象，并保留ἑαυτῶν的“自己的”。
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: 令人惊异的事已经发生了
  rationale: 保留完成时的结果意味，并忠实表达“配得惊异之事”；不添加原文没有明示的“因此”。
theological_decisions:
- issue: 兄弟们受苦的原因
  choice: 说话者把他们所受的苦归因于自身犯罪、得罪上帝
  alternative: 可较弱地译成“我们是为自己的缘故受这些苦”，不突出责任
  rationale: πάσχομεν与ἁμαρτόντες及διʼ ἑαυτούς共同表明自身罪责与苦难之间的关系；译文应保留这一审判性的神学张力，不将其淡化为一般遭遇。
- issue: 末句与前文的逻辑关系
  choice: 不增译“因此”
  alternative: 译作“因此，令人惊异的事发生了”
  rationale: 末句前没有明示因果连接词；即使语境可能暗含承接或结果关系，也应保留原文的简短并置，不替读者确定其逻辑力度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“临死时”简洁传达死亡迫近；“自己造成的”突出διʼ ἑαυτούς所含的自身责任，同时由下一句明确说明这是因得罪上帝。脚注标记均放在其实际解释的词句之后。
