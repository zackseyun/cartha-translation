base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: zh_hans
  text: 孩子，我恳求你，举目看看天地，看看其中的一切，并且要知道：上帝造出这一切，并不是用已经存在的事物[a]；人类也同样如此形成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较解释性地译作“从无有中创造”。希腊文直译为“不是用已经存在的事物”。
    reason: 说明原文否定“从既存事物而造”的措辞与常见解释性神学简语之间的关系，而不以该简语取代正文。
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: 我恳求你
  rationale: 在母亲劝勉即将殉难的儿子这一语境中，此语带有真挚而迫切的请求意味；“我恳求你”既传达情感力度，也符合现代汉语表达。
- source_word: τέκνον
  choice: 孩子
  rationale: 原词泛指所生的儿女；虽然此处对象是儿子，但“孩子”更贴近希腊文，也自然保留母亲的称呼语气。
- source_word: ἀναβλέψαντα
  choice: 举目看看
  rationale: 该分词含抬头观看的意味。“举目看看”保留这一动作，又能自然地同时引出“天地”两个对象。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: “天地”是现代汉语中自然、庄重的宇宙整体表达，准确对应希腊文的配对结构，而不把 οὐρανός 狭义化为可见的天空。
- source_word: τὰ ἐν αὐτοῖς πάντα
  choice: 其中的一切
  rationale: 保留 πάντα 的全面范围，并以简洁自然的现代汉语表达“在天地之中的一切”。
- source_word: γνῶναι
  choice: 要知道
  rationale: 不把认知意义解释性地改成“明白”或“承认”；“要知道”也能自然承接前面的观看动作。
- source_word: οὐκ ἐξ ὄντων
  choice: 不是从已有之物
  rationale: 直译其“并非出自存在着的事物”之意，避免在正文中直接换用后期神学术语“从无中”，同时清楚表达并非以预先存在之物为来源。
- source_word: ἐποίησεν
  choice: 造出
  rationale: 原词是常用的“做、造”；“造出”在创造语境中自然，并与表示来源的“从”搭配顺畅，同时没有把普通动词过度术语化。
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: 人类
  rationale: 简洁准确地表达整个人类这一集合概念，比“人的种族”更符合现代标准汉语。
- source_word: οὕτω γίγνεται
  choice: 也是这样产生的
  rationale: γίγνεται 表示进入存在、产生，不只表示出生；“也是这样”保留 οὕτω 对前述上帝创造方式的回指，而不进一步解释其具体机制。
theological_decisions:
- issue: 是否把 οὐκ ἐξ ὄντων 直接译成教义术语“从无中创造”
  choice: 不是从已有之物造出它们的
  alternative: 从无中造了它们
  rationale: 希腊文直说“不是出于已有之物”。这句话有力支持创造并不以预存之物为材料，但正文应保留原文的否定式措辞，不以较晚形成的神学简语取代它；脚注可说明通常的解释性表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孩子，我恳求你”保留母亲恳切劝勉的语气；“天地”使宇宙性配对自然凝练；分号保留后半句与创造陈述之间紧密但不完全等同的关系。
