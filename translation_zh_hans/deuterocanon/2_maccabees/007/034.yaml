  rationale: 修订使呼语、禁止语和分词结构在现代标准汉语中更自然，同时避免把“不敬神圣”直接限定为“不敬神”。“既已……举手攻击”保留ἐπαράμενος的完成性/先行动作及其敌对指向；脚注继续保留“属天”与“天的”之间的释义张力。
