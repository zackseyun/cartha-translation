    rationale: ἀνόσιος主要指不敬神圣、亵慢或不敬虔；本节虽有宗教语境，但该词本身并未直接出现“神”。
  - severity: medium
    issue: “不要被无定的指望煽动，徒然自高”的搭配与句法关系不够自然。
    rationale: φρυττόμενος是与主语相关的分词，表示其因不确定盼望而激动；改为“不要因……而激动，徒然自高”更清楚地保留原文关系。
  - severity: low
    issue: “在所有人中最污秽的”呼语表达生硬。
    rationale: 将其整合为“你这……的人”更合现代汉语庄重斥责语体。
  revised_text: 可是你这不敬虔、在众人中最污秽的人，不要因不明朗的盼望而激动，徒然自高；你既已向属天的儿女[a]举手攻击。
