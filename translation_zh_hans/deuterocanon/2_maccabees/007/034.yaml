  source_fidelity: 草稿大体传达了对君王的严厉斥责、其因不确定的盼望而自高，以及其敌对“属天/天的儿女”的行为。但“被无定的指望煽动，徒然自高”的语序和搭配不够贴合希腊文的分词关系；“不敬神的人”将ἀνόσιε所指的对神圣事物的不敬明确化为“神”，略有增译。
  naturalness: “在所有人中最污秽的”作为呼语成分较生硬；“无定的指望”及“被……煽动”也不如现代庄重汉语自然。改为“你这不敬虔、在众人中最污秽的人”和“因不明朗的盼望而激动，徒然自高”，语气更连贯。
  terminology: 以“不敬虔”表达ἀνόσιος的亵慢、不敬神圣之意，避免在原文未明说θεός处直接补出“神”。“属天的儿女”保留οὐρανίους的性质性理解；脚注以“天的儿女”保留其可按归属理解的歧义。
