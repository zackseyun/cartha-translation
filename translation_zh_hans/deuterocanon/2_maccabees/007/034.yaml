base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: zh_hans
  text: 可是你这不敬虔、在众人中最污秽的人，不要因不明朗的盼望而激动，徒然自高；你既已向属天的儿女[a]举手攻击。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天的儿女。”希腊语可把这些儿女描述为“属天的”，也可表示他们属于天。
    reason: 保留οὐρανίους修饰παῖδας时在性质描述与归属表达之间的歧义。
lexical_decisions:
- source_word: ἀνόσιε
  choice: 不敬神的人
  rationale: 这是呼格形式的直接斥责，指违背神圣秩序、缺乏敬虔；“不敬神的人”在现代汉语中自然明确，并保留宗教意味。
- source_word: μιαρώτατε
  choice: 在所有人中最污秽的
  rationale: 最高级 μιαρώτατε 带有道德和礼仪上的玷污意味；“最污秽”保留其强烈的污秽意象，而不弱化为一般性的“卑劣”。
- source_word: μὴ μάτην μετεωρίζου
  choice: 不要……徒然自高
  rationale: μετεωρίζου 可表达被抬高、自高或心神浮动；在斥责语境中，“徒然自高”既保留高举意象，也表达 μάτην 所指的徒劳。
- source_word: φρυττόμενος
  choice: 被……煽动
  rationale: 该分词有燃起、激动之意；“煽动”在汉语中自然地表现希望使人情绪高涨的动态，同时避免把热力隐喻译得生硬。
- source_word: ἀδήλοις ἐλπίσιν
  choice: 无定的指望
  rationale: ἀδήλοις 指不明朗、不确定；“无定的指望”保留其不可靠和不确定性，却不擅自解释为虚假或欺骗性的希望。
- source_word: οὐρανίους παῖδας
  choice: 属天的孩子
  rationale: οὐρανίους 可形容其为“属天的”，也可能表达与天的归属关系；“属天的孩子”在正文中自然、庄重，并以脚注保留“天上的孩子”这一可能读法。παῖδας 译为“孩子”，不擅自限定性别。
- source_word: ἐπαράμενος χεῖρας
  choice: 举手攻击
  rationale: 该分词配合 ἐπί 加宾格表示带敌意地把手伸向某人；“举手攻击”保留身体动作，也清楚表达敌对行为。
theological_decisions:
- issue: οὐρανίους παῖδας 中 οὐρανίους 的含义
  choice: 属天的孩子
  alternative: 天上的孩子
  rationale: 希腊语既可描述这些孩子具有“属天的”性质，也可表示他们属于天或与天相连。正文采用自然且保留神学意涵的“属天的孩子”，脚注列出另一读法，不加入原文没有明说的神名。
translation_notes:
  register: 采用现代、庄重而易懂的斥责语气。“可是你这个……”体现直接呼语；以分号分开禁止自高与举手攻击两层内容，使较长的希腊语句在中文中清晰有力。
