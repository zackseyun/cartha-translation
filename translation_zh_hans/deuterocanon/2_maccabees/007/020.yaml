base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: zh_hans
  text: 但这位母亲格外令人敬佩，也值得人美好地怀念[a]。她看着七个儿子在同一天丧命[b]，却因她寄托在主身上的盼望，仍勇敢地承受了这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“值得人美好地怀念。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“灭亡”或“被毁灭”；希腊文用词较宽泛，在这里的处决语境中指丧命。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: 尤其
  rationale: 强化随后对母亲的赞许；“尤其”自然简洁，保留突出的语气。
- source_word: ἡ μήτηρ ἀγαθὴ
  choice: 这位母亲……令人敬佩
  rationale: ἀγαθή字面为“好”，此处赞扬其品格与勇气，译作“令人敬佩”更符合现代汉语语境。
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: 配得美好的纪念
  rationale: 保留“美好/良善”与“纪念”的基本词义，同时避免引入“圣者”“福者”等后期固定称谓。
- source_word: ἀπολλυμένους
  choice: 相继丧命
  rationale: 该现在分词宽泛地表示走向毁灭或死亡；上下文明确是处决。“丧命”自然但略具体，故以脚注说明原词范围；“相继”表达她目睹整个过程，但不把希腊文误解为同一瞬间。
- source_word: συνορῶσα
  choice: 亲眼看着
  rationale: 表示她目睹并综观整个场面；“亲眼看着”体现持续见证的痛苦。
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: 在一天之内
  rationale: 突出七个儿子的死亡集中发生在同一天，表达自然且不额外界定具体时辰。
- source_word: εὐψύχως ἔφερεν
  choice: 仍勇敢地承受了这一切
  rationale: εὐψύχως表示以勇气或坚毅面对，ἔφερεν表示承担、忍受；补出“一切”使汉语完整。
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: 因寄望于主的种种盼望
  rationale: 保留ἐλπίδας的复数意味和盼望指向主的关系；“种种”不具体规定盼望的内容。
- source_word: Κύριον
  choice: 主
  rationale: 此处指上帝；“主”是简体中文圣经语体中自然、庄重且不增添解释的对应词。
theological_decisions:
- issue: ἐλπίδας的复数及其内容
  choice: 主的种种盼望
  alternative: 对主的盼望
  rationale: 原文使用复数，译文保留其多重或丰富的意味，不将其压缩为单一抽象概念，也不擅自说明具体是复活、报偿或别的盼望。
- issue: Κύριον的译法
  choice: 主
  alternative: 上主；主宰
  rationale: “主”准确对应κύριος在此处对上帝的称呼，并保持简洁、通行的现代圣经语体。
- issue: 母亲承受苦难的表达
  choice: 仍勇敢地承受了这一切
  alternative: 坦然忍受
  rationale: 原文赞扬的是勇气与坚毅，并非没有悲痛；避免用“坦然”暗示她情感平静或不受痛苦。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“亲眼看着”“承受了这一切”使句意符合自然汉语；保留“主”和复数盼望所具有的神学开放性。所有脚注标记均已置于正文。
