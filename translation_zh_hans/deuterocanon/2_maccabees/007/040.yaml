  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: zh_hans
  text: 于是，他也清白地离世了[a]，全然信靠主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纯洁地死去”，即以纯洁、无玷污的方式死去。希腊文副词很可能含有道德或宗教意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经把全部信心寄托在主身上。”希腊文可强调这种信靠已经确立，并持续到他离世之时。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: 就这样，他也
  rationale: 兼顾καί与οὖν的承接、总结作用，并保留οὗτος对当前人物的指示；中文用“他”比“这个人”更自然。
- source_word: καθαρῶς
  choice: 清白地
  rationale: 该副词修饰离世的方式，在殉道和忠于律法的语境中很可能带有道德或宗教上的纯洁、无玷污之意；“清白地”保留这种含义，又不把它限定为礼仪洁净。
- source_word: μετήλλαξεν
  choice: 离世了
  rationale: 此处是表示死亡的委婉说法；“离世”既保持庄重语气，也不额外加入死后去向的解释。
- source_word: παντελῶς
  choice: 全然
  rationale: 作为副词加强信靠的程度，表示完全、毫无保留；“全然”简洁而庄重。
- source_word: ἐπὶ τῷ κυρίῳ
  choice: 信靠着主
  rationale: ἐπί加与格在πεποιθώς之后表示信心所倚靠的对象；汉语“信靠主”自然表达这种倚赖关系。
- source_word: πεποιθώς
  choice: 信靠着
  rationale: 完成时分词表示已经形成并持续存在的信靠状态；“信靠着”在自然中文中保留临终时仍处于这种状态的意味。
- source_word: κύριος
  choice: 主
  rationale: 在这一犹太希腊文语境中指至高的主；采用中文圣经传统且通行的“主”，不作超出原文的具体化。
theological_decisions:
- issue: καθαρῶς描述殉道者死亡时的道德或宗教含义
  choice: 译为“清白地”，表达他在纯洁、无玷污的状态或方式中离世。
  alternative: 可理解为“纯洁地”“无玷污地”，或较弱地理解为“无可指责地”。
  rationale: 上下文强调为忠于上帝律法而殉道，因此该词很可能具有道德或宗教分量；“清白地”保留这种意味，同时避免擅自将其解释为特定的礼仪洁净概念。
- issue: 完成时分词πεποιθώς所表达的信靠状态
  choice: 译为“信靠着”，呈现已经确立并持续到离世之时的信靠。
  alternative: 可译为“已经把全部信心寄托在主身上”，更明显地表达完成时结果状态。
  rationale: 简洁译法更符合现代汉语经文体，同时脚注保留完成时所强调的既成而持续的状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离世”对应原文委婉的死亡表达；“清白地”保留道德和宗教上的纯洁意味而不限定为礼仪范畴。句式简洁，适合叙事性经文朗读。
