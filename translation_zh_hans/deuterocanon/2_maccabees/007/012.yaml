  text: so that the king himself and those with him were astonished at the young man's spirit, because he regarded the sufferings as nothing.
translation:
  language: zh_hans
  text: 连王本人和随从他的人都对这少年的心志惊叹不已，因为他全然不把这些痛苦当一回事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχήν
  choice: 心志
  rationale: 此处指少年面对酷刑时所显出的内在精神与坚毅态度；“心志”比单说“灵魂”更符合现代汉语语境，同时避免把原文窄化为纯粹的“勇气”。
- source_word: ἀλγηδόνας
  choice: 这些痛苦
  rationale: 该复数名词指少年正在承受的各种肉体苦楚；译为“这些痛苦”自然且保留复数语境。
- source_word: ἐνʼ οὐδενὶ … ἐτίθετο
  choice: 全然不把……当一回事
  rationale: 这是表示视若无物、毫不在意的惯用表达；该译法清楚传达他不把痛苦看在眼里的意思，而非声称痛苦并不存在。
- source_word: ἐκπλήσσεσθαι
  choice: 惊叹不已
  rationale: 原词表达强烈的震惊、诧异；结合其对象是少年的心志，“惊叹不已”兼具震惊与赞叹的语气。
theological_decisions:
- issue: ψυχήν是否译作具有实体性意味的“灵魂”
  choice: 心志
  alternative: 灵魂／精神／勇气
  rationale: 上下文重点在少年承受苦刑时表现出的内在态度，而非对灵魂本体作教义陈述。“心志”保留较宽的心理与精神含义，也不如“勇气”那样过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连……都……”体现ὥστε所引出的结果；“随从他的人”对应τοὺς σὺν αὐτῷ，不擅自限定为官员或侍从。
