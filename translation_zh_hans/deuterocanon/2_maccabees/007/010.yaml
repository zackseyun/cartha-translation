base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/010.yaml
  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: zh_hans
  text: 在他之后，第三个人也遭到戏弄。当有人向他索要他的舌头时[a]，他立刻把舌头伸了出来，又勇敢地伸出双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他被要求交出舌头时。”希腊文使用被动分词，没有明说是谁提出要求。
    reason: 保留原文被动结构及施事者未明的特点，同时提供更贴近字面结构的译法。
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: 这人之后
  rationale: 表示叙事中的先后次序，并保留对前一个人的指称；现代汉语中简洁自然。
- source_word: ὁ τρίτος
  choice: 第三个
  rationale: 序数词在希腊文中作名词使用；上下文已表明是第三个兄弟，无须在正文中补出“兄弟”。
- source_word: ἐνεπαίζετο
  choice: 也遭到戏弄
  rationale: 保留动词所表达的嘲弄和羞辱，不把更广的酷刑背景强行纳入该词；“也”承接前两人的遭遇。
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: 当人向他索要舌头时
  rationale: αἰτηθεὶς是被动分词，语境中的要求带有强制意味。“索要舌头”保留原文简练而骇人的说法；正文用泛指施事者使汉语自然，脚注说明原文未明说施事者。
- source_word: ταχέως προέβαλλεν
  choice: 立刻把舌头伸了出来
  rationale: προβάλλω意为向前伸出；结合“舌头”译为“伸了出来”最符合现代汉语习惯。“立刻”体现ταχέως的迅速和毫不迟疑。
- source_word: τὰς χεῖρας εὐθαρσῶς προέτεινεν
  choice: 又勇敢地伸出双手
  rationale: εὐθαρσῶς表达勇气和无畏，προτείνω表达向前伸展；“双手”自然对应复数并符合汉语身体部位表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“索要舌头”刻意保留原文的凝练和暴烈感，不淡化为一般性的“叫他伸舌头”，也不额外加入割除等原文未明说的动作。
