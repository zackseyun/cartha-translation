  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
translation:
  language: zh_hans
  text: 他却用祖先的语言回答说[a]：“不！”因此，他也像第一个人一样，受了接下来的酷刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用本族的语言”或“用母语”。希腊文直译指父辈或祖先的言语。
    reason: 说明τῇ πατρίῳ φωνῇ的父祖／祖先关联，以及“本族的语言”“母语”等可行的自然译法。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答
  rationale: 该不定过去时被动分词在此按中动义使用，表示对命令作出回答；“回答”简洁自然。
- source_word: τῇ πατρίῳ φωνῇ
  choice: 用祖传的语言
  rationale: πατρίος 有祖传、祖辈所有之义，φωνή 在此指语言或言语；此译保留祖先传承和族群身份的意味，又不擅自判定具体是哪一种语言。
- source_word: προσεῖπεν
  choice: 说
  rationale: 该动词在此引出直接引语；译作“说”符合现代汉语习惯，不额外加入“对谁说”等原文未明示的信息。
- source_word: Οὐχί
  choice: 不！
  rationale: 这是直接而有力的否定答复；“不”准确简洁，叹号体现语境中的坚决语气。
- source_word: διόπερ
  choice: 因此
  rationale: 明确表达其拒绝与随后受刑之间的结果关系。
- source_word: οὗτος
  choice: 他
  rationale: 希腊文指示代词指刚提到的这位兄弟；现代汉语用“他”最自然，所指仍清楚。
- source_word: τὴν ἑξῆς βάσανον
  choice: 接下来的酷刑
  rationale: ἑξῆς 表示次序上的随后，βάσανος 在本段残酷处刑的语境中指折磨或酷刑；“接下来的酷刑”兼顾顺序与强度。
- source_word: ὡς ὁ πρῶτος
  choice: 像第一个人一样
  rationale: 保留与第一位兄弟所受遭遇的直接比较；“第一个人”在汉语中清楚而不增补“兄弟”这一隐含信息。
theological_decisions:
- issue: τῇ πατρίῳ φωνῇ 所承载的祖传身份意味
  choice: 用祖传的语言
  alternative: 用本族的语言／用母语
  rationale: 原文强调与父辈、祖传传统相关的言语，可能同时涉及语言和族群身份。“祖传的语言”保留这一张力，也避免把原文直接限定为“母语”或某一具体语言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“酷刑”符合殉道叙事的残酷语境；整体句式保留原文先拒绝、后受刑的因果推进。
