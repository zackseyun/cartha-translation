base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/033.yaml
  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own servants.
translation:
  language: zh_hans
  text: 但我们永活的主若为了责备和管教，暂时发了怒，他必再与自己的仆人和好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与自己的仆人和好”也可译作“重新向自己的奴仆息怒施恩”。“仆人”所译的希腊词也可指“奴仆”；这里的动词可侧重怒气过后重新恢复恩待。
    reason: 保留δοῦλοι的词义范围及καταλλαγήσεται可表示恢复恩待的另一种理解。
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若
  rationale: 保留条件关系以及与上文的轻微转折，符合现代汉语语序。
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: 为了责备和管教
  rationale: χάριν与两个属格连用，表示目的或缘由；“责备”和“管教”分别体现申斥与纠正训练的含义。
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: 我们的永生之主
  rationale: “永生之主”以自然、庄重的汉语表达ζῶν所强调的活着、具有生命的主，并保留ἡμῶν“我们的”。
- source_word: βραχέως
  choice: 暂时
  rationale: 简洁表达持续时间短，符合此处神怒并非长久的语境。
- source_word: ἐπωργίσται
  choice: 发了怒
  rationale: 表达完成时所呈现的既成发怒状态，同时避免生硬直译。
- source_word: καὶ πάλιν
  choice: 之后还会
  rationale: 表达πάλιν所指的状态恢复；“之后”使短暂发怒与后续和好之间的时间转折清楚。
- source_word: καταλλαγήσεται
  choice: 与……和好
  rationale: 保留关系恢复的意义，不额外说明和好的机制；在神与人关系中也是自然汉语。
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: 自己的仆人
  rationale: δοῦλοι可指奴仆或仆人；在对主的归属关系中，“自己的仆人”既保留归属含义，又符合庄重自然的中文圣经语域。
theological_decisions:
- issue: δοῦλοι在人与主的关系中的译法
  choice: 仆人
  alternative: 奴仆
  rationale: “仆人”在现代汉语宗教语境中自然地表达服事和归属；“奴仆”更突出受奴役身份，属于可行的较强译法，故列入脚注。
- issue: καταλλαγήσεται用于神人关系时的含义
  choice: 还会与自己的仆人和好
  alternative: 还会重新向自己的仆人息怒施恩
  rationale: “和好”保留希腊文关于关系恢复的张力，也不把被动／中间形式只解释为神被安抚或单方面息怒。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“永生之主”保持经文语域；“暂时发了怒”自然表达短暂的神怒；脚注保留“奴仆”及“息怒施恩”等可能译法。
