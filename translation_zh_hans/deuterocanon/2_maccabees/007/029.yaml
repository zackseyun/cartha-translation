base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: zh_hans
  text: 不要怕这个刽子手[a]；你要配得上你的兄弟们，接受死亡，好叫我能在怜悯中[b]把你和你的兄弟们一同接回来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个施刑者”。希腊词 δήμιος 更确切地指刽子手，不过上下文也包括酷刑。
    reason: lexical_alternative
  - marker: b
    text: “在怜悯中”很可能是指上帝的怜悯，但本句希腊文没有明确提到上帝。
    reason: alternative_reading
  - marker: c
    text: 或译“重新得到你”或“领回你”。这里表达母亲盼望将来能与这个儿子及他的兄弟们重聚。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: 不要怕
  rationale: 以自然、直接的现代汉语表达带 μή 的禁止性劝告，保留母亲劝勉的语气。
- source_word: τὸν δήμιον τοῦτον
  choice: 这个刽子手
  rationale: δήμιος主要指执行死刑的人；“刽子手”贴合当前殉道处境，也比“施刑者”更准确地指向其处死职能。
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: 你要配得上你的哥哥们
  rationale: γενόμενος含“成为”之意，但汉语用“要配得上”更自然，并保留以哥哥们为榜样、与他们相称的含义。上下文表明这些手足是他先受难的哥哥。
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: 接受死亡
  rationale: ἐπιδέχομαι可指接受、承受；此处表达自愿面对殉道之死，不增添“求死”或其他原文没有的意思。
- source_word: ἐν τῷ ἐλέει
  choice: 在怜悯中
  rationale: 直译其介词结构，并且不把未明说的施怜悯者补成“上帝”，从而保留原文的含蓄。
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: 和你的哥哥们一同
  rationale: 清楚表达 σύν 的伴随意义以及母亲盼望母子兄弟重聚的语境。
- source_word: κομίσωμαί σε
  choice: 我……能把你……接回来
  rationale: κομίζω可指领回、收回或接回；“接回来”保留恢复所得和重聚的意味，却不把复活的方式说得比原文更明确。
theological_decisions:
- issue: ἐν τῷ ἐλέει中的怜悯是否应明确归于上帝
  choice: 译作“在怜悯中”，不补出“上帝的”
  alternative: “在上帝的怜悯中”或“靠着上帝的怜悯”
  rationale: 全章语境使人自然联想到上帝的怜悯，但本句希腊文并未明说上帝；正文因此保留这一神学含蓄。
- issue: κομίσωμαί σε所含的复活与重聚意味
  choice: 译作“把你接回来”
  alternative: “重新得到你”或“领回你”
  rationale: 该词在此暗含死后恢复与家人重聚的盼望；“接回来”传达这种盼望，同时不额外规定复活的具体机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“刽子手”“接受死亡”“接回来”分别保留处决、甘愿承受死亡及重聚盼望的语义；句式保持母亲直接劝勉儿子的力度，同时不把隐含的神学内容明说得超过希腊原文。
