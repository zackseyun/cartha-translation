base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: zh_hans
  text: 因为我们的弟兄如今忍受了短暂的痛苦，已经在上帝的永恒生命之约下倒下了[a]；但你却必在上帝的审判之下，承受你狂傲所应受的惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文句法紧凑，也可译作：“已经在上帝的约下死去，得享永恒的生命。”这里“倒下”是原文动词的直译；在本段语境中可指死亡。
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν
  choice: 短暂的
  rationale: 表达痛苦持续时间很短，并保留它与永恒生命之间的鲜明对比。
- source_word: ἐπενέγκαντες πόνον
  choice: 忍受了……痛苦
  rationale: 自然表达承担、经受苦难之意，又不把殉道背景中未明说的细节加入正文。
- source_word: ἀενάου ζωῆς
  choice: 永恒生命
  rationale: ἀέναος有持续不息、永久之意；“永恒生命”庄重、清楚，也符合现代汉语宗教语境。
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: 在上帝……的约下
  rationale: 保留ὑπό所表达的处于某种约的范围或权下，以及διαθήκη明确的立约含义，避免弱化为笼统的“应许”。
- source_word: πεπτώκασιν
  choice: 已经……倒下了
  rationale: 保留πίπτω的原始意象；在本段殉道语境中可指死亡，但正文不直接替换为“死了”，以免消除原文的表达张力。
- source_word: κρίσει
  choice: 审判
  rationale: 直接体现上帝作出裁决的司法语境。
- source_word: δίκαια τὰ πρόστιμα
  choice: 所应得的惩罚
  rationale: δίκαια表明惩罚是公正、相称的；πρόστιμα在此不是狭义罚金，而是因罪行所承受的惩处。
- source_word: ὑπερηφανίας
  choice: 狂傲
  rationale: 既传达高傲自大的道德含义，也贴合君王盛气凌人的语境，语气比一般的“骄傲”更强。
theological_decisions:
- issue: 如何表达ἀενάου ζωῆς、ὑπὸ διαθήκην θεοῦ与πεπτώκασιν之间压缩而含混的关系
  choice: 译作“在上帝永恒生命的约下倒下了”，使“永恒生命”修饰“约”，同时保留“倒下”的意象。
  alternative: 可译作“为得永恒生命，在上帝的约下死了”或“在上帝的约下倒下，进入永恒生命”。
  rationale: 希腊语结构紧凑，可将“永恒生命”理解为与上帝之约相连，也可理解为殉道者倒下后所得的生命。正文尽量贴近词序和约的框架，不明确加入“进入”或“得享”，脚注则提示另一种通顺理解。
- issue: 是否将πεπτώκασιν明译为殉道或死亡
  choice: 保留“倒下了”。
  alternative: 译作“死了”或“殉难了”。
  rationale: 上下文足以使读者理解这是死亡；保留比喻可避免加入“殉难”这一解释性称谓，并忠实呈现原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”保留同胞兄弟和共同受难者的语感；“狂傲”体现原文强烈的谴责色彩。句式维持前后对照：弟兄短暂受苦却与永恒生命相连，暴君则将承受公正惩罚。
