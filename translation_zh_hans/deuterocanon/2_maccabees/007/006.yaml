base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his servants.”
translation:
  language: zh_hans
  text: 主上帝正在察看；他确实正因我们而生出怜悯之心[a]。正如摩西在那首当面作见证的歌中清楚说明的：“他也必因自己的仆人而生出怜悯之心。”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生出怜悯之心”也可理解为“回心转意”或“得到安慰”。希腊动词可表示安慰、劝勉，或因怜悯而有所转变；这里的上下文和随后引用的摩西之歌较支持怜恤之意。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《申命记》32:36，其中说主必因自己的仆人而生出怜悯之心。
    reason: cross_reference
  - marker: c
    text: “仆人”所译的希腊词也可译作“奴仆”或“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφορᾷ
  choice: 正在察看
  rationale: 保留现在时所表达的持续、主动观看，同时不额外加入“保护看顾”的含义。
- source_word: ταῖς ἀληθείαις
  choice: 实在
  rationale: 此处与格复数具有副词性作用；译作“实在”符合现代汉语，也保留强调真实、确切的语气。
- source_word: παρακαλεῖται / παρακληθήσεται
  choice: 动了怜悯之心 / 必……动怜悯之心
  rationale: 结合紧随其后的《摩西之歌》引文，这两个被动态形式在此指上帝因其子民而生怜悯或回心转意。中文采用同一表达以显明前后呼应，并以“因”保留希腊文所呈现的关系。
- source_word: διεσάφησεν
  choice: 清楚说明
  rationale: 准确表达“阐明、使之清楚”的意义，语言自然庄重。
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: 公开作证的
  rationale: κατὰ πρόσωπον 表示当面、公开的直接性；ἀντιμαρτυρούσης 保留“作证”的核心意象，其可能含有的反面见证意味不在正文中过度限定。
- source_word: ᾠδῆς
  choice: 歌
  rationale: 自然对应摩西的诗歌，并与申命记背景相合。
- source_word: δούλοις
  choice: 仆人
  rationale: 在经文引语和上帝与其子民的关系中，“仆人”比现代汉语“奴隶”更自然；脚注说明希腊词也可直指奴仆身份，避免遮蔽其社会含义。
theological_decisions:
- issue: παρακαλεῖται / παρακληθήσεται 所表达的上帝之反应
  choice: 译为上帝“动了怜悯之心”
  alternative: “得到安慰”或“回心转意”
  rationale: 动词本身语义范围较广，但这里引用申命记32:36，语境指向上帝对其仆人的怜恤。正文采用“动怜悯之心”，脚注保留其他可能语感，不将神学张力完全抹平。
- issue: δούλοις 的身份用语
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: “仆人”适合正式的经文引语，也能表达归属和服事关系；脚注明示原词可含奴仆身份，防止过度弱化。
- issue: 摩西之歌的见证性质
  choice: 公开作证
  alternative: 当面作反证／当面指证
  rationale: 正文保留见证意象和公开直接性，但不强行判定复合动词的敌对或控告色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“主上帝”对应 Ὁ Κύριος ὁ θεός；“正在察看”保持叙述的现场感。全句拆为两句以避免希腊长句在汉语中过重，同时保留因果、比较和引文结构。
