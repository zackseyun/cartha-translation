  text: Then the king became furious and ordered frying pans and cauldrons to be heated[a].
translation:
  language: zh_hans
  text: 于是，王勃然大怒，下令把煎锅和大锅烧热[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“烧得通红”；希腊语动词表示用火烧热，可能含有猛烈加热的意思。
    reason: 保留ἐκπυροῦν在加热强度上的词义可能性，避免正文把并未完全明说的程度定死。
lexical_decisions:
- source_word: Ἐκθύμως
  choice: 勃然大怒
  rationale: 该词表达强烈、猛烈的愤怒；“勃然大怒”自然地传达王突然进入盛怒状态，也保留原文的情绪强度。
- source_word: γενόμενος
  choice: 勃然大怒
  rationale: 该分词与Ἐκθύμως连用，表示王进入愤怒状态；中文以“勃然”体现状态的骤然转变，无须生硬直译为“变得”。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 忠实对应原文称号，简洁自然，不加入原文未明说的政治身份。
- source_word: προσέταξεν
  choice: 下令
  rationale: 准确表达权威性的命令，符合现代汉语叙事用语。
- source_word: τήγανα
  choice: 煎锅
  rationale: 指用于煎烤的锅具；“煎锅”清楚、现代，也适合本节的刑罚语境。
- source_word: λέβητας
  choice: 大锅
  rationale: 该词指较大的金属容器；“大锅”通俗清楚，避免“鼎”或“锅炉”等可能带来的古雅或工业化联想。
- source_word: ἐκπυροῦν
  choice: 烧热
  rationale: 该动词表示用火加热或彻底烧热；正文采用自然且不过度诠释的“烧热”，更强的“烧得通红”作为脚注中的可能译法保留。
