base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: zh_hans
  text: 他临终时[a]这样说：“宁可被人杀害而死，仍盼望上帝使人再次复活。至于你，却不会有通向生命的复活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临终时”也可译作“到了生命尽头时”或“在将要死的时候”。
    reason: lexical_alternative
  - marker: b
    text: “不会有通向生命的复活”可能是说他无分于蒙福、得生命的复活，而不一定是在明确否认任何形式的复活。
    reason: alternative_reading
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: 到了临死的时候
  rationale: πρὸς τῷ 加不定式表达事情即将发生；此译自然地保留“濒临死亡”的时间含义。
- source_word: οὕτως ἔφη
  choice: 这样说
  rationale: 保留 οὕτως 的指示作用，同时符合现代汉语叙事习惯。
- source_word: Αἱρετὸν
  choice: 宁可
  rationale: 原词表示“值得选择、较为可取”；结合后文处境，用“宁可”能自然表达面对两种结局时的选择意味。
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: 死在人手中
  rationale: μεταλλάσσω 在此指离世，ἀπὸ ἀνθρώπων 在殉难语境中表明人的施害作用；此译简明而不淡化暴力处境。
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: 期待上帝所赐的盼望
  rationale: 保留复数“盼望”的概括性，并将 ὑπὸ τοῦ θεοῦ 所表达的来源关系译为“上帝所赐”，避免添加原文未明说的“应许”。
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: 将来由他使我们再次复活
  rationale: 明确保留被动意义、上帝的施动作用及 πάλιν“再次”的含义；上下文和复数分词支持用“我们”表达受难者一方。
- source_word: ἀνάστασις εἰς ζωὴν
  choice: 通向生命的复活
  rationale: 保留 εἰς ζωὴν 对“复活”的限定，不把它简化为笼统的“复活”，从而维持原文的神学张力。
theological_decisions:
- issue: 殉难者复活的盼望与迫害者无分于“通向生命的复活”之间的对比
  choice: 宣告上帝将使殉难者再次复活，同时说受话者不会有“通向生命的复活”。
  alternative: 将后半句理解为受话者根本不会以任何方式复活。
  rationale: εἰς ζωὴν 明确限定 ἀνάστασις，因此译文保留“通向生命”，既不否认审判性的复活，也不擅自断言此处必然暗示另一种复活。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宁可死在人手中”贴合殉难语境；“通向生命的复活”略带正式色彩，以保存原文介词短语的限定作用和神学上的开放性。
