  source_fidelity: 译文大体传达了临终殉难者盼望上帝施行复活、并否定迫害者得“复活进入生命”的对比。可是“由他使我们再次复活”将希腊文不定式的泛指/与前面复数分词相连的受难者指涉，收窄并改为第一人称复数；原文并未明确说“我们”。此外，“将来”虽与将来时相符，但并非必要，删去可使中文更简洁。
  naturalness: “他临终时这样说”比“他到了临死的时候，这样说”自然。“宁可死在人手中”可理解，但“宁可被人杀害而死”更清楚地表达殉难语境中的人施害；后文采用“使人再次复活”可避免无根据地补出“我们”。
  terminology: 保留“上帝”“盼望”“复活”和“通向生命的复活”。“通向生命的复活”恰当保留 εἰς ζωὴν 对 ἀνάστασις 的限定，避免断言受话者绝无任何形式的复活。
