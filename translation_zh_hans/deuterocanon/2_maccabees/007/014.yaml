  to: 他临终时[a]这样说：“宁可被人杀害而死，仍盼望上帝使人再次复活。至于你，却不会有通向生命的复活[b]。”
  rationale: 修订消除了原文未明示的“我们”，以泛指的“人”保留复数分词在此类格言式表述中的开放指涉；同时使叙述和殉难处境的中文更自然。保留“通向生命的复活”及其注释，以维持原文对受话者结局所留下的解释空间。
