  text: And after he had urged her much[a], she agreed to persuade her son.
translation:
  language: zh_hans
  text: 他再三劝说她之后，她答应去说服自己的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: 再三
  rationale: 此处作副词性宾格，修饰“劝说”，表示劝说的程度或反复性；“再三”符合现代汉语叙事习惯，也保留持续劝说之意。
- source_word: παραινέσαντος
  choice: 劝说
  rationale: 该词为属格独立结构中的分词；在本语境中指对母亲加以劝促，希望她影响儿子，“劝说”比“劝告”更能体现其目的。
- source_word: ἐπεδέξατο
  choice: 答应
  rationale: 中间语态表示接受所提要求并愿意承担此事；“答应”自然地衔接后面的不定式。
- source_word: πεῖσειν
  choice: 去说服
  rationale: πείθω 的将来不定式说明她答应要做的事；“说服”直接保留使对方接受某种行动的含义。
- source_word: τὸν υἱόν
  choice: 自己的儿子
  rationale: 希腊文直译为“那儿子”，但上下文明确是这位母亲的儿子；现代汉语用“自己的儿子”可清楚表达所指而不造成主语归属歧义。
