  yaml_path: translation/deuterocanon/2_maccabees/015/033.yaml
  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
translation:
  language: zh_hans
  text: 他割下不敬神的尼加挪的舌头，说要把舌头切成一块一块，丢给飞鸟，又要把他愚妄所招致的报应[a]悬挂在圣殿对面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他愚妄应得的惩罚。”希腊语“报应”可指人因自己所行而得到的回报或报偿。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: 舌头
  rationale: 上下文描述将其割下并分块丢给飞鸟，明确指身体器官，而非“言语”或“语言”。
- source_word: δυσσεβοῦς
  choice: 不敬神的
  rationale: 保留该词对神不虔不敬的宗教含义，同时采用现代汉语中清楚自然的表达。
- source_word: ἐκτεμών
  choice: 割下
  rationale: 分词所述动作先于“说”，且指把舌头从身体上割除；“割下”简洁自然。
- source_word: ἔφη
  choice: 说要
  rationale: 后接两个不定式，表明他说出的处置意图；汉语用“说要”能自然体现这一句法关系。
- source_word: μετὰ μέρος
  choice: 切成一块一块
  rationale: 该短语表示分成若干部分；结合舌头和飞鸟的语境，如此表达比单说“逐块”更清楚。
- source_word: τοῖς ὄρνεσιν
  choice: 丢给飞鸟
  rationale: 与前文动作构成接受对象；“飞鸟”符合庄重叙事语体，也避免把范围局限为某一种鸟。
- source_word: τὰ ἐπίχειρα
  choice: 所得的报应
  rationale: 该表达可指因行为而得到的回报或报偿；本处显然带惩罚意味，“报应”自然传达这种反讽性的回报，同时以脚注保留词义幅度。
- source_word: τῆς ἀνοίας
  choice: 愚妄
  rationale: ἀνοία表示愚昧、无知或失去理智；“愚妄”兼具道德评判和庄重色彩，但不把它收窄为临床意义的疯狂。
- source_word: κατέναντι τοῦ ναοῦ
  choice: 在圣殿对面
  rationale: κατέναντι可表示“对面”或“面前”；正文采用较直接的空间义“对面”，不进一步推断精确位置。
- source_word: κρεμιάσαι
  choice: 悬挂
  rationale: 该不定式指把某物吊起公开陈列；“悬挂”准确而庄重。
theological_decisions:
- issue: δυσσεβοῦς对尼加挪的道德—宗教定性
  choice: 不敬神的
  alternative: 不虔敬的；亵渎神的
  rationale: 原词强调对神缺乏敬畏。“不敬神的”清楚保留宗教维度；“亵渎神的”可能过度强化为特定的亵渎行为。
- issue: τὰ ἐπίχειρα τῆς ἀνοίας所表达的因果报偿
  choice: 他愚妄所得的报应
  alternative: 他愚妄的工价；他愚妄应得的惩罚
  rationale: 原文可指行为所得的回报，在本处是惩罚性的。“报应”保留行为与后果之间的道德关联；脚注说明也可理解为应得的惩罚，避免把词义限定得过窄。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“尼加挪”按常见音译处理；“圣殿”对应 ναός。正文保留原文暴力场景的直陈，不弱化，也不增添解释。代词“他”补出所属关系，使“愚妄所得的报应”在汉语中自然；其具体所指仍由上下文判断。
