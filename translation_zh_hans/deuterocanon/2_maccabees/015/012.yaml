base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: zh_hans
  text: 他所见的异象是这样的：成为大祭司的敖尼雅，是个高尚善良的人，举止谦恭，性情温和，谈吐得体；他从小就用心培养一切属于德行的品格。异象中，他伸出双手，为全体犹太人[a]祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为犹太人的整个共同体”。原文把犹太人表述为一个完整的群体。
    reason: 说明σύστημα的集体、整体含义，并保留另一种较形式对应的译法。
lexical_decisions:
- source_word: θεωρία
  choice: 异象
  rationale: 上下文所介绍的是梦中所见的场景；“异象”自然传达所见内容，而不是抽象的“观看”或外在“景象”。
- source_word: γενόμενον ἀρχιερέα
  choice: 曾任大祭司
  rationale: γενόμενον直译为“成为过”；在人物回顾性介绍中，“曾任大祭司”符合现代汉语，也不把他描述成当时仍在任。
- source_word: καλὸν καὶ ἀγαθόν
  choice: 高尚善良
  rationale: 此处是道德品格的称赞，καλός并非着重外貌；“高尚善良”保留两个并列的褒义形容。
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν
  choice: 举止庄重
  rationale: αἰδήμων含谦恭、知礼和令人敬重之意；该短语较为习语化，“举止庄重”传达外在仪态而不过度限定为与人相见时的礼节。
- source_word: πρᾶον δὲ τὸν τρόπον
  choice: 性情温和
  rationale: πρᾶος表示温和、柔和；“性情温和”准确对应对其为人方式的描述。
- source_word: λαλιάν προειμένον πρεπόντως
  choice: 谈吐得体
  rationale: 原短语有一定难度，但πρεπόντως明确表达合宜、得体；此译简洁自然，并保留对其言谈的赞许。
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: 从小就用心养成
  rationale: 完成时分词表示自幼经过持续操练而形成的品格；“用心养成”兼顾勤勉实践与长期培养。
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: 德行所应有的一切品格
  rationale: ἴδια指属于德行、为德行所特有的事物；此译清楚表达其品格属性，同时避免列出原文没有明说的具体美德。
- source_word: κατεύχεσθαι
  choice: 祷告
  rationale: 该动词在此明确表示向神祈求；与“为全体犹太人”相连，自然呈现代求含义，无须另加解释。
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: 为全体犹太人
  rationale: σύστημα表示构成一个整体的群体；“全体犹太人”在中文主文中自然明晰，脚注补明原文的整体性表达。
theological_decisions:
- issue: 异象中敖尼雅为犹太群体代祷
  choice: 直接译为他伸出双手，为全体犹太人祷告
  alternative: 弱化为他祝愿犹太人安好
  rationale: κατεύχεσθαι明确指祷告，且伸手的动作强化了祈祷场景。译文保留经文本身呈现的代祷角色，不进一步推论其教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希腊文较长的同位修饰结构拆为两句，以免中文句子壅塞；第二句补出“异象中”，清楚标示后续动作仍属所见场景。人名采用常见的次经中文形式“敖尼雅”。
