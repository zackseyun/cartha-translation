base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/013.yaml
  text: Then in this way there appeared a man distinguished by his gray hair and glory[b][a], and the majesty surrounding him was in some way marvelous and most splendid.
translation:
  language: zh_hans
  text: 随后，有一个人这样显现出来；他在白发和荣光上卓然出众[a]，环绕着他的非凡气象[b]奇妙而极其壮丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个在白发与荣光上超群出众的人。”希腊文用一个分词短语紧凑地描写此人。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他周围的超越之处（或崇高）。”这里译作“环绕着他的非凡气象”，以表达与此人相随的卓越、崇高和外显的壮丽。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθ᾽ οὕτως
  choice: 随后，就这样
  rationale: 兼顾时间上的承接与方式上的指示；“就这样”也保留异象叙述的现场感。
- source_word: ἐπιφανῆναι
  choice: 显现出……来
  rationale: 表达人物进入可见状态，符合异象语境，同时不加上“启示”等更强的神学解释。
- source_word: ἄνδρα
  choice: 一个人
  rationale: 直接对应ἀνήρ，在本节中不提前指明此人的身份。
- source_word: πολιᾷ
  choice: 白发
  rationale: 具体呈现年长者灰白头发的形象；现代汉语以“白发”比“灰发”更自然，也能传达年龄与尊荣的意味。
- source_word: δόξῃ
  choice: 荣光
  rationale: 既保留圣经语体，又可表达可见的光彩和尊荣，不将其仅仅抽象化为“名誉”。
- source_word: διαφέροντα
  choice: 卓然出众
  rationale: 体现该分词所含的卓越、显著之意，并自然统摄“白发和荣光”两个与格成分。
- source_word: θαυμαστὴν δέ τινα
  choice: 奇妙非凡
  rationale: 传达令人惊异的性质；不定代词τινα的弱化语气通过整体较为含蓄的描述体现，而不生硬译成“某种”。
- source_word: μεγαλοπρεπεστάτην
  choice: 极其威严
  rationale: 保留最高级的加强语气，并以适合人物异象的庄严措辞表达宏伟壮丽。
- source_word: τὴν περὶ αὐτὸν ὑπεροχήν
  choice: 周身的尊贵气象
  rationale: “周身”对应περὶ αὐτόν，“尊贵气象”以自然汉语表达环绕此人的卓越、崇高与外显威仪，同时用脚注保留较直译的可能。
theological_decisions:
- issue: 异象中人物的身份与性质
  choice: 只译作显现的“一个人”，描写其白发、荣光和威严，不在本节指明身份。
  alternative: 明确译成天上的人物、荣耀者或特定历史人物。
  rationale: 本节希腊文本只描写其显现与非凡仪态，并未在本句内直接命名；译文因此保留文本的克制及上下文逐步辨认身份的空间。
- issue: δόξῃ所指的荣光是否具有神性
  choice: 译作“荣光”，保留可见光彩、尊荣和圣经神学语汇之间的张力。
  alternative: 译作纯视觉性的“光辉”，或直接解释为神圣荣耀。
  rationale: 原词可涵盖荣耀、尊荣和光彩；本节不足以单独判定其性质，故不将其限定为神性或普通名望。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“白发”“荣光”“尊贵气象”“极其威严”共同维持异象场景的崇高感；分号使人物出现与外貌描写层次清楚。主文脚注标记[a]、[b]均已对应列出。
