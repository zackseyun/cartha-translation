  yaml_path: translation/deuterocanon/2_maccabees/015/032.yaml
  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
translation:
  language: zh_hans
  text: 他向众人展示可憎的尼加诺尔的头颅，以及那亵渎者[b]的手；尼加诺尔曾用这只手攻击全能者的圣殿，并大肆夸口，
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“辱骂者”或“毁谤者”。希腊词可泛指以恶言毁谤、辱骂的人；这里因所冒犯的是全能者的圣殿，译作“亵渎者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: 展示给众人看
  rationale: 该词为不定过去时中动分词，在叙事中表示先行或伴随动作；译文保留公开展示的意味，并以未完句式衔接下一节的主句。
- source_word: μιεροῦ
  choice: 可憎的
  rationale: 该形容词带有强烈的宗教与道德贬斥色彩，可指污秽、玷污或令人憎恶；用于亵渎圣殿的尼加诺尔时，“可憎的”既自然，也不把含义局限于礼仪性不洁。
- source_word: δυσφήμου
  choice: 亵渎者
  rationale: 该词可泛指恶言毁谤或辱骂者；上下文明确涉及对全能者圣殿的狂妄冒犯，因此“亵渎者”较能传达此处的宗教语境，同时用脚注保留较宽的词义。
- source_word: ἐκτείνας
  choice: 曾伸向
  rationale: 分词所指动作早于当下公开展示；“曾”自然标明先前发生的动作。“伸向”保留肢体姿态本身。
- source_word: ἐπὶ τὸν ἅγιον ... οἶκον
  choice: 伸向全能者的圣殿
  rationale: ἐπί加宾格本身可表达朝向，而上下文使这一动作具有敌意；正文保留方向性措辞，避免在介词层面过度消解其可容纳的语义张力，敌意则由“亵渎者”和上下文显明。
- source_word: παντοκράτορος
  choice: 全能者
  rationale: 这是指上帝的尊称；“全能者”是现代汉语中庄重、清楚且通行的译法。
- source_word: ἐμεγαλαύχησεν
  choice: 大肆夸口
  rationale: 该动词表示自高而狂妄地夸耀；“大肆夸口”自然传达其强烈和傲慢意味。
theological_decisions:
- issue: παντοκράτωρ作为上帝称号的译法
  choice: 全能者
  alternative: 万有的主宰
  rationale: 正文将称号意译而非音译；“全能者”简洁庄重，并保留该称号所表达的神圣权能。
- issue: ἐπί加宾格在敌对语境中的表达
  choice: 伸向……圣殿
  alternative: 伸手攻击……圣殿
  rationale: 原文介词可兼具方向与敌对语感。正文保留“伸向”这一可见动作，不额外加入原文未明说的“攻击”，同时由上下文保留其威胁和亵渎意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“圣殿”按语境表达“圣屋”所指的耶路撒冷圣所。原句是以分词开头、主句延续到下一节的长句，因此本节末保留逗号，不擅自补成独立句。
