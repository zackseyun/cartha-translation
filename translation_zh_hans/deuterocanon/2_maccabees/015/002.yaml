base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: zh_hans
  text: 但那些被迫随同他的犹太人说：“千万不要这样残暴、野蛮地杀害他们[a]；倒要把尊荣归给那位鉴察万有者以圣洁特别尊崇的日子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀害”也可译作“毁灭”。希腊语动词既可表示杀害，也可表示毁灭。
    reason: lexical_alternative
  - marker: b
    text: 直译：“要把尊荣分给那位鉴察万有者以圣洁特别尊崇的日子。”原文的表达可指这日以圣洁的方式受到特别尊崇，或其特别受尊崇与其神圣地位有关；意思是应当给予这个神圣日子相称的敬重。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: 犹太人
  rationale: 此处指作为宗教与民族群体的犹太人，而不只是犹太地区的居民。
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: 被迫随同他的
  rationale: κατὰ ἀνάγκην 表明他们并非自愿同行；συνεπομένων 表示随同、结伴而行。
- source_word: Μηδαμῶς
  choice: 千万不要
  rationale: 表达强烈的禁止语气，现代汉语中自然且有力度。
- source_word: ἀγρίως καὶ βαρβάρως
  choice: 残暴、野蛮地
  rationale: 保留两个并列副词的强化效果，传达行动的凶残与不文明。
- source_word: ἀπολέσῃς
  choice: 毁灭他们
  rationale: ἀπόλλυμι 可指毁灭或杀死；正文采用范围较宽的“毁灭”，并在脚注保留“杀死”的可能。宾语依上下文补出。
- source_word: δόξαν δὲ ἀπομέρισον
  choice: 倒要把尊荣归给
  rationale: ἀπομερίζω 有分配、划给之意，δόξα 在此指给予圣日的尊荣；此译既保留原文意象，也符合汉语表达。
- source_word: τῇ προτετιμημένῃ ... ἡμέρᾳ
  choice: 已……格外尊崇了那日
  rationale: 完成时分词表明这日已经获得优先或特殊的尊崇；“格外尊崇”比单纯“拣选”更贴近 τιμάω 的荣誉语义。
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: 鉴察万有的那一位
  rationale: 保留原文对上帝含蓄而敬虔的称谓；ἐφοράω 可表示察看、监临或看顾，“鉴察”兼具看见与监督之意。
- source_word: μεθʼ ἁγιότητος
  choice: 在圣洁中
  rationale: 贴近介词短语的形式，保留它与“格外尊崇”之间略显凝练的关系，不把它扩写为原文未明说的“使之成圣”。
theological_decisions:
- issue: τοῦ πάντα ἐφορῶντος 对上帝的含蓄指称
  choice: 鉴察万有的那一位
  alternative: 看顾万有者／洞察一切的那一位
  rationale: 原文没有直接使用“上帝”一词，而以带冠词的分词敬称他；译文保留这种含蓄指称及其神圣语气。
- issue: 圣日获得特殊地位的表述
  choice: 已在圣洁中格外尊崇了那日
  alternative: 已使那日分别为圣／已拣选那圣日
  rationale: 原文强调这日已经被特别尊崇，并含有圣洁层面，却没有直接使用“分别为圣”的动词；故不将其明确化为某一特定神学术语。
- issue: μεθʼ ἁγιότητος 的修饰关系
  choice: 保留“在圣洁中”这一凝练表达
  alternative: 把那日当作圣日格外尊崇／以圣洁格外尊崇
  rationale: 希腊语表达简练，其确切语义关系可理解为尊崇的方式或圣日的神圣地位；译文不将这种张力完全消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“千万不要”传达恳求中的强烈禁止语气；“倒要把尊荣归给”保留原文“分配尊荣”的修辞，又避免过度生硬。将希腊语较长的定语结构拆为因果分句，以提高普通读者的可读性，同时保留“在圣洁中”的原文张力。
