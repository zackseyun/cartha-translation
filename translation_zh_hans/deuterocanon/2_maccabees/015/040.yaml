base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: zh_hans
  text: 正如单喝酒不适口，单喝水也一样；但酒与水调和以后，就变得可口，令人愉悦。同样，文章的编排也使读到这篇文章的人听来愉悦。到这里就是结尾了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: 单喝酒
  rationale: κατὰ μόνας意为“单独、只”，这里直指酒不与水调和而单独饮用；译文保持原有对比，不额外加入“未稀释”等解释。
- source_word: ὕδωρ πάλιν πολέμιον
  choice: 反过来只喝水，都不适口
  rationale: πάλιν在并列比较中表示“反过来、同样”；πολέμιον字面为“敌对的”，在饮用语境中表达不合口、令人不悦。中文以“不适口”传达语境义，并用脚注保留字面张力。
- source_word: συγκερασθεὶς
  choice: 调和
  rationale: 指酒与水混合；“调和”既准确表达混合，也符合古代调酒语境和本句文雅的修辞风格。
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: 就变得可口，令人愉悦
  rationale: 该短语强调调和后产生悦人的效果；译为两个相承的表达，保留味觉上的宜人与由此而来的愉悦。
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: 这篇叙事的编排
  rationale: κατασκευή在此指文学材料的组织、安排，λόγος指本书所写的叙事或文字作品；“叙事的编排”比单指“文风”更贴近原文。
- source_word: τέρπει τὰς ἀκοὰς
  choice: 使……听来愉悦
  rationale: 原文直译为“使耳朵愉悦”，反映文本诵读和聆听的背景；中文保留听觉意象，同时避免生硬的“愉悦耳朵”。
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: 读者
  rationale: ἐντυγχάνω用于书面作品时可指阅读或接触文本，σύνταξις指编成的作品；“读者”简洁自然，并与前面的听觉修辞形成原文已有的张力。
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: 到这里，全书就结束了
  rationale: 保留作者正式而简洁的收束语气；补出“全书”是中文中明确本句所指的自然表达。
