  text: And for those shut up in the city, the anxiety also was no small matter, as they were troubled about the attack in the open country.
translation:
  language: zh_hans
  text: 城中那些受困的人也焦虑不已，因为他们为城外野地的进攻[a]而不安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城外野地的进攻”或译“露天之地的袭击”。希腊原文借此将城中受困的人与城外露天之地发生的战斗相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: 受困
  rationale: 该词为完成时被动分词，在这里表示城里的人因当时的局势而被困其中；“受困”既保留被动意味，也自然传达围困压力。
- source_word: οὐ πάρεργος
  choice: 十分
  rationale: 该表达直译为“并非次要的／不足道的”，用于加强“焦虑”的程度；译作“十分焦虑”符合现代汉语表达，并保留其强调作用。
- source_word: ἀγωνία
  choice: 焦虑
  rationale: 该词表示强烈的内心挣扎、不安或忧惧；上下文关乎城外战事，因此“焦虑”准确而通顺。
- source_word: ταρασσομένοις
  choice: 令他们心神不安
  rationale: 该分词说明他们焦虑的缘由和状态，含有被搅扰、惊惶不安之意；“心神不安”自然传达其情绪波动。
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: 郊野发生的进攻
  rationale: προσβολή在军事语境中指“进攻、袭击”；ἐν ὑπαίθρῳ意为露天、野外，与“城里”形成对照。“郊野发生的进攻”在汉语中自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受困”保留希腊文的被动状态；将否定式强调“并非不足道”自然转换为“十分焦虑”。脚注保留ἐν ὑπαίθρῳ在“郊野／旷野”之间的表达空间，并说明其与城内场景的对照。
