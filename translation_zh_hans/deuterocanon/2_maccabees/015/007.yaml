  text: But Maccabeus was continually confident, with every hope, that he would obtain help from the Lord.
translation:
  language: zh_hans
  text: 但马加比始终满怀希望，深信自己必从主那里得到帮助。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Μακκαβαῖος
  choice: 但马加比
  rationale: δὲ 表转折或承接，此处译作“但”；专名按中文通行形式译为“马加比”。
- source_word: ἦν ἀδιαλείπτως πεποιθώς
  choice: 始终……深信
  rationale: 以“始终”表达 ἀδιαλείπτως 的持续性，以“深信”表达 πεποιθώς 的坚定信赖。
- source_word: μετὰ πάσης ἐλπίδος
  choice: 满怀希望
  rationale: 直译“带着全部的希望”在现代汉语中生硬；“满怀希望”自然传达 πάσης 所强调的充分、完全之意。
- source_word: ἀντιλήμψεως τεύξεσθαι
  choice: 得到帮助
  rationale: τεύξομαι 加属格表示“获得、得到”，ἀντίλημψις 在此指援助或扶助。
- source_word: παρὰ τοῦ κυρίου
  choice: 从主那里
  rationale: 保留 παρά 与属格所表达的来源关系，并将 κύριος 译作“主”。
theological_decisions:
- issue: 帮助的来源与确信程度
  choice: “深信自己必从主那里得到帮助”
  alternative: “相信自己可能会得到主的帮助”
  rationale: 希腊文 πεποιθώς 与将来不定式 τεύξεσθαι 表达坚定期待，不宜弱化为可能性；同时不增添帮助的具体方式。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“满怀希望，深信”保留原文“希望”与“信赖”两个相邻概念，句式清晰，适合普通读者。
