  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: zh_hans
  text: 众人都向天称颂那显赫的主，说：“那保守自己的地方[a]不受玷污的，当受称颂！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的地方”也可译作“自己的圣所”或“自己的圣殿”。希腊文直译为“地方”，但上下文很可能是指那未受玷污的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: 向天
  rationale: εἰς加宾格在此表示称颂的方向；“向天”保留了原文向上的取向，又不额外把它解释成固定的称呼方式。
- source_word: εὐλόγησαν / Εὐλογητός
  choice: 称颂 / 当受称颂
  rationale: 用同一词根相应表达动词与形容词，保留原文的词语呼应；现代汉语中“称颂”用于人对上帝的颂赞较自然。
- source_word: τὸν ἐπιφανῆ κύριον
  choice: 那彰显自己的主
  rationale: ἐπιφανής可指显明、显现或赫然可见；这里很可能指主借决定性的作为显明自己。“彰显自己的”比生硬的“显明的”更自然，同时避免仅译成审美意义上的“荣耀”。
- source_word: διατηρήσας
  choice: 保守
  rationale: 该词表示持续保存、使其维持某种状态；“保守……不受玷污”简洁地传达这一含义。
- source_word: τὸν ἑαυτοῦ τόπον
  choice: 自己的地方
  rationale: τόπος本义宽泛，为“地方”。上下文很可能指上帝的圣所或圣殿，但正文保留原词的宽度，具体语境义置于脚注。
- source_word: ἀμίαντον
  choice: 不受玷污
  rationale: ἀμίαντος兼有礼仪洁净和一般未被污染之意；“不受玷污”自然，也适合圣所语境。
theological_decisions:
- issue: 是否在正文中把τὸν ἑαυτοῦ τόπον明确译为上帝的圣所或圣殿
  choice: 正文保留较宽泛的“自己的地方”
  alternative: 自己的圣所；自己的圣殿
  rationale: 上下文强烈指向圣殿，但希腊文使用宽泛的τόπος，而非更具体的ναός或ἱερόν。正文不增加原文没有明说的具体性，脚注则说明可能所指。
- issue: 如何理解ἐπιφανής所描述的主
  choice: 那彰显自己的主
  alternative: 显现的主；荣耀的主
  rationale: 此处可指主在得胜中公开显明自己，也可较静态地表示“显著、赫赫的”。译文采用动作性表达以符合语境，但不把它限定为一次可见的显现。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“当受称颂”保留与前句“称颂”的词语呼应；脚注标记置于整句引语之后，且正文已出现[a]。
