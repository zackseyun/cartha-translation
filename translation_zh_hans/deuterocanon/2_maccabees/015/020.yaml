base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/020.yaml
  text: And when all were already expecting the coming judgment[a], and the enemies had already joined battle, and the army had been drawn up, and the beasts had been suitably stationed in one part, and the cavalry posted on the flanks[b],
translation:
  language: zh_hans
  text: 众人都已在等候那即将临到的裁决[a]；敌军也已经接战，军队已经列阵，战象[b]已妥善部署在阵地的一处，骑兵则排列在两翼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裁决”也可译作“审判”“决定”，或“决定性的关头”。
    reason: 保留κρίσις在战斗语境中的多重可能含义。
  - marker: b
    text: “战象”原文直译为“兽类”；这里按战阵语境指军用的大象。
    reason: 说明语境性明确翻译及原文字面意义。
lexical_decisions:
- source_word: προσδοκώντων
  choice: 在等候
  rationale: 该分词表示带着期待或紧张的等候；“在等候”自然传达战事将决时的迫切感。
- source_word: τὴν ἐσομένην κρίσιν
  choice: 那即将临到的裁决
  rationale: κρίσις可指审判、裁决或决定性的关头。这里首先指即将由战局作出的决定性结果；“裁决”兼顾军事语境的自然含义与原词庄重、可能带有神学意味的张力。
- source_word: προσμιξάντων τῶν πολεμίων
  choice: 敌军也已交战
  rationale: προσμίγνυμι在军事语境中指双方接触并投入战斗；“交战”简明自然。
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: 军队已经列阵
  rationale: 被动分词表示军队已按战斗次序排开；“列阵”准确而凝练。
- source_word: τῶν θηρίων
  choice: 战象
  rationale: θηρία字面为“兽类”，但在本书直接军事语境中所指为投入战阵的大象。中文主文直译“野兽”容易造成不必要的误解，因此采用语境明确的“战象”，并用脚注说明原文字面。
- source_word: ἐπὶ μέρος
  choice: 在阵地的一处
  rationale: 该短语表示部署在某一部分或区段，不足以确定具体在左、右或中央；此译保留空间上的不确定性。
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: 已妥善部署
  rationale: εὐκαίρως含适宜、得当之意，ἀποκαθίστημι在此表示安置到位；合译为“妥善部署”符合现代军事表达。
- source_word: τῆς δὲ ἵππου
  choice: 骑兵
  rationale: ἵππος字面为“马”，这里是集合性的军事用语，指骑兵部队。
- source_word: κατὰ κέρας τεταγμένης
  choice: 排列在两翼
  rationale: κέρας在军阵术语中指翼部；单数可作集合或阵形术语理解。“两翼”是现代中文清晰自然的战术表达。
theological_decisions:
- issue: 战斗语境中κρίσις的翻译及其可能的神学意味
  choice: 裁决
  alternative: 审判；决定；决战关头
  rationale: 上下文着眼于战斗即将产生的决定性结果，但κρίσις本身具有审断、判定的庄重色彩。“裁决”不把经文限定为纯粹的军事“结果”，也不像“审判”那样在中文中强烈预设直接的神圣审判，从而保留原文张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以连续的战场部署画面呈现原文多个属格绝对结构。分号承接本节作为后续叙事背景的未完句式，同时避免中文句子过度拖长。
