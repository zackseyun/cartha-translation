  yaml_path: translation/deuterocanon/2_maccabees/015/010.yaml
  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: zh_hans
  text: 他激发了他们的斗志，劝勉他们，同时指出列国的不敬虔和违背誓言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: 振奋了众人的心志
  rationale: θυμός可指情绪、勇气、斗志或内在心志；在战前劝勉的语境中，此处重在激发众人的勇气和决心。“振奋……心志”既自然，也不把含义收窄为愤怒。
- source_word: παρήγγειλεν
  choice: 勉励他们奋勇向前
  rationale: παραγγέλλω可表示吩咐、命令或郑重劝勉；结合军队受鼓舞的语境，译为“勉励他们奋勇向前”兼顾指令性与激励意味。
- source_word: ἅμα παρειδείκνυς
  choice: 同时指出
  rationale: 保留分词所表达的伴随动作，并以简洁自然的现代汉语呈现。
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: 外族人对上帝的不敬
  rationale: 在本书的犹太历史叙事中，ἔθνη指以色列以外的民族；ἀθεσία在此是对上帝不敬、缺乏敬虔，而非现代哲学意义上的无神论。
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: 背弃誓言的行径
  rationale: παράβασις指违犯、越界；“背弃誓言”准确传达违背所起之誓的含义。希腊文未明说誓言的归属，因此正文不增添“他们的”。
theological_decisions:
- issue: ἐθνῶν的译法
  choice: 外族人
  alternative: 列国；异邦人
  rationale: “外族人”符合马加比时代犹太群体与周边民族相对的历史语境，也避免“异邦人”可能带入的后期宗教术语色彩；脚注保留“列国”这一较贴近字面的译法。
- issue: ἀθεσία的译法
  choice: 对上帝的不敬
  alternative: 不敬虔；目中无神
  rationale: 该词带有宗教和道德谴责，但未必断言对方否认上帝存在；“对上帝的不敬”保留其语境意义，避免套用现代“无神论”概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心志”“奋勇向前”“背弃誓言”等措辞适合战前劝勉的叙事语境，同时避免过度古雅。
