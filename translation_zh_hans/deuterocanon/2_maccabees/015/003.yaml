  yaml_path: translation/deuterocanon/2_maccabees/015/003.yaml
  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
translation:
  language: zh_hans
  text: 但那个该受三重咒诅的人问道：“天上是否有一位掌权者，曾吩咐人守安息日[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位吩咐人守安息日的掌权者是否在天上？”希腊文既可理解为不定的描述（“天上是否有一位掌权者……”），也可理解为对以色列之神较明确的指称。
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: 该受三重咒诅的人
  rationale: 这个罕见的强烈贬称带有 τρις- 的强化意味；译作“该受三重咒诅”既保留修辞力度和咒诅色彩，也避免较生硬的逐字表达。
- source_word: ἐπηρώτησεν
  choice: 问道
  rationale: 此动词引出带敌意的问话；“问道”在现代汉语中自然，敌意则由上下文及贬称体现。
- source_word: δυνάστης
  choice: 掌权者
  rationale: 该词指拥有权力或统治权的人；“掌权者”庄重而清楚，又不把它直接处理成特定的神圣称号。
- source_word: προστατάξας
  choice: 曾吩咐
  rationale: 分词表示发出有权威的命令；“吩咐”保留命令意味，同时符合中文引语的自然表达。“曾”标明该命令先于当前问话。
- source_word: ἄγειν
  choice: 守
  rationale: 与“日”连用时，指遵守或守某一节日；汉语“守安息日”简洁、自然且准确。
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: 安息日
  rationale: 这一短语虽可直译为较复杂的“安息之日”，实际指每周的安息日；“安息日”是现代汉语清楚而通行的表达。
theological_decisions:
- issue: 天上权威者的所指及定指程度
  choice: 天上是否有一位掌权者
  alternative: 那位吩咐人守安息日的掌权者是否在天上
  rationale: 希腊文 ὁ δυνάστης 带冠词，但句法既可理解为不定的存在问句，也可理解为对以色列之神较明确的指称。正文采用自然的不定表达，脚注保留较定指的另一种理解，不把敌对说话者的措辞预先神学化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。引语重现原文的讥讽性提问；“该受三重咒诅”保留强烈谴责，“掌权者”则避免额外引入固定神名或宗派性称号。
