base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: zh_hans
  text: 马加比看见大批人马在场[a]，武器装备各式各样，猛兽部署在有利的位置，且十分凶猛，便向天伸出双手，呼求施行奇事的主；他知道，胜利不是靠武器得来的；主照自己的判断，把胜利赐给配得的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“大批人马在场”直译为“众人的在场”，指敌军大批聚集在战场。下文的“猛兽”在本书语境中很可能是战象，但希腊原文此处只说“猛兽”。
    reason: 说明 παρουσία 与 πλήθη 的措辞，并交代“猛兽”的可能历史指涉，避免在正文中将其限定为战象。
  - marker: b
    text: “主照自己的判断”也可译作“主认为合宜时”。希腊文此处的表达较为压缩，强调胜利由主按其裁断赐下。“施行奇事的主”也可译作“施行神迹的主”。
    reason: 保留原文有关主之判断／合宜时机的句法张力，并列出 τερατοποιός 的合理译法。
lexical_decisions:
- source_word: συνιδών
  choice: 看见
  rationale: 既自然表达眼见战场情势，也可涵盖审视、察觉整体局势的意味。
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: 大队人马已经到场
  rationale: παρουσίαν 表示在场或来到，πλήθων 指聚集的大群人；此译符合军事语境，又不把原文窄化为单纯的“人数”。
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: 武器装备各式各样
  rationale: παρασκευήν 在这里可指预备或装备；与“武器”连用时，译作装备较自然，并保留 ποικίλην 所强调的多样性。
- source_word: τῶν θηρίων
  choice: 猛兽
  rationale: 原文只称“兽类／猛兽”，上下文很可能指战象，但正文不直接补明，以保存原文措辞。
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: 部署在有利的位置
  rationale: 表达被安排在适宜、具有战术优势之处的含义。
- source_word: ἀγριότητα
  choice: 凶猛异常
  rationale: 突出这些猛兽具有威胁性的凶猛程度，符合战场语境。
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: 向天伸出双手
  rationale: 忠实保留祷告时向天伸手的具体姿态。
- source_word: τερατοποιὸν
  choice: 施行奇事的
  rationale: 表达主施行非凡、令人惊奇之事；比直接限定为某类“神迹”稍宽，也保留庄重语气。
- source_word: κύριον
  choice: 主
  rationale: 在祷告语境中是对上帝的尊称，按统一译法译为“主”。
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: 而在于主按自己的判断
  rationale: 原文带有“无论怎样由他判定／照他所认为合宜”的意味；此译保留决定权属于主，而不额外说明其判定标准。
- source_word: περιποιεῖται τὴν νίκην
  choice: 把胜利赐给
  rationale: 此处动词表示为人取得、成就或给予胜利；“赐给”自然呈现神主动授予胜利。
- source_word: τοῖς ἀξίοις
  choice: 配得的人
  rationale: 保留原文对人的价值判断，但不进一步界定他们为何配得或是否凭功劳赚取胜利。
theological_decisions:
- issue: 胜利中的神圣主权与军事手段
  choice: 胜利不在于武器，而由主按自己的判断赐下
  alternative: 胜利完全不使用任何军事手段，只借超自然干预临到
  rationale: 原文明确对比武器与主的判定和赐予，强调决定性因素是主，却没有在本节系统否定一切人的手段。
- issue: “配得的人”与功德观
  choice: 直译为“配得的人”
  alternative: 解释为凭功劳赚得胜利的人，或改写为蒙恩的人
  rationale: 原文确有 ἄξιος 的评价含义，但没有说明配得的基础；保留措辞及其神学张力，不导入特定功德论或恩典论解释。
- issue: 主作出判断的表述
  choice: 主按自己的判断
  alternative: 主认为合宜时／主判定他们配得时
  rationale: 希腊文表达略为压缩，既可强调主所判定的方式，也可理解为他认为合宜之时；正文采取自然且较开放的表述，脚注说明另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“大队人马”“部署在有利的位置”贴合军事场景；“向天伸出双手”“施行奇事的主”保留祷告叙事的肃穆感。正文中的脚注标记 [a]、[b] 均已对应列出。
