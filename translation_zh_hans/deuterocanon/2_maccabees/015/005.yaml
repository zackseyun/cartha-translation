base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: zh_hans
  text: 另一个说：“我也是地上的掌权者，命令人拿起武器[a]，办理君王的事务[b]。”然而，他没能实现自己残暴的图谋[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿起武器”也可译作“携带武器”或“从军作战”；希腊文直译为“举起／拿起武器”，是军事行动的表达。
    reason: lexical_alternative
  - marker: b
    text: “君王的事务”也可译作“王的差事”或“王家的公务”。
    reason: lexical_alternative
  - marker: c
    text: “残暴的图谋”也可译作“残酷的意图”或“骇人的决意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: 掌权者
  rationale: 指拥有权力或统治地位的人；“掌权者”既保留权势含义，又不把此人过度明确为“君王”。
- source_word: προστατάσσων
  choice: 命令
  rationale: 该分词表示以权威发号施令；中文用“命令”自然地保留其支配性语气。
- source_word: αἴρειν τὰ ὅπλα
  choice: 拿起武器
  rationale: 直译为“举起／拿起武器”，在上下文中是采取军事行动的表达；译文保留原有意象。
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: 办理王室事务
  rationale: χρείας 可指需要、差事或事务，βασιλικάς 表明其属于君王或王室；此译法保持语义宽度，不限定为某一种具体职责。
- source_word: ὅμως
  choice: 然而
  rationale: 清楚表达前述权势宣称与最终失败之间的强烈转折。
- source_word: οὐ κατέσχεν ἐπιτελέσαι
  choice: 终究没能实现
  rationale: 在此表示未能成功完成所企图之事；“终究”强化上下文中的结果性转折，但不另加失败原因。
- source_word: σχέτλιον
  choice: 残暴的
  rationale: 该词带强烈贬义，可表示凶狠、残酷或骇人；“残暴的”符合其敌对意图的语境。
- source_word: βούλημα
  choice: 图谋
  rationale: 指经过意志决定的打算、意图或谋划；结合贬义形容词译为“图谋”，自然传达敌意，同时仍保留计划与意向之间的语义空间。
theological_decisions:
- issue: 异象语境中说话者作为地上权势者的身份
  choice: 按其自述译为“我也是地上的掌权者”
  alternative: “我也是地上的君王”或“我在地上也有权柄”
  rationale: 原文只陈述其在地上的权势，并未要求译者进一步界定其具体身份或神学意义；“掌权者”保留这种克制与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“掌权者”避免古奥的“权贵”或过度明确的“君王”；“办理王室事务”保持官方差事的广义；全句保留说话者自夸权势却未能得逞的鲜明反差。
