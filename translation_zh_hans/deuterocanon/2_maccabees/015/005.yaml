revisions:
- from: 另一个却说：“我也是地上的掌权者，命令人拿起武器[a]，办理王室事务[b]。”然而，他终究没能实现自己残暴的图谋[c]。
  to: 另一个说：“我也是地上的掌权者，命令人拿起武器[a]，办理君王的事务[b]。”然而，他没能实现自己残暴的图谋[c]。
  rationale: 修订将“王室事务”改为“君王的事务”，以准确保留原文所指的王命或王权相关职责之广义，避免“王室”在现代汉语中的家族化联想；同时删去“终究”并简化首句转折，使语气更贴近原文且更流畅。脚注 a 将不自然的“执掌武器”替换为可成立的“携带武器”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:03:58Z'
