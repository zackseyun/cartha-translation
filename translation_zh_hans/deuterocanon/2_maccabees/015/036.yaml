  yaml_path: translation/deuterocanon/2_maccabees/015/036.yaml
  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
translation:
  language: zh_hans
  text: 众人便共同表决，决定绝不可让这一天不加纪念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绝不可让这一天不被遵守”，或“绝不可让这一天没有纪念”。希腊语ἀπαρασήμαντον直译为“没有显著标记”，这里指公开纪念或遵守这一天。
    reason: 说明原词既有“加以标明”的字面意象，也可在语境中表示纪念或遵守，避免正文将含义限定得过窄。
lexical_decisions:
- source_word: ἐδογμάτισαν
  choice: 决定
  rationale: 该动词表示作出具有正式、公共性质的决定；与后面的“共同表决”连用时，“决定”自然且避免重复译作“颁令”。
- source_word: πάντες
  choice: 众人
  rationale: 保留全体参与者的集体范围；结合“共同表决”可自然传达众人共同作出决定。
- source_word: μετὰ κοινοῦ ψηφίσματος
  choice: 共同表决
  rationale: κοινός表明共同参与，ψήφισμα指经投票形成的决议；“共同表决”保留其公共议决色彩，但不额外断定具体程序。
- source_word: μηδαμῶς
  choice: 绝不可
  rationale: 传达该强烈否定副词“无论如何都不”的强调语气。
- source_word: ἐᾶσαι
  choice: 让
  rationale: 保留“容许、任由”的基本意义，并与后接的状态表达自然衔接。
- source_word: ἀπαρασήμαντον
  choice: 不加纪念
  rationale: 该词本义为“没有标记或显著标志”；在特定日子的语境中指不让这日未经纪念或遵守。“不加纪念”适合现代汉语，同时在脚注中保留“标明、遵守”等语义可能。
- source_word: τήνδε τὴν ἡμέραν
  choice: 这一天
  rationale: 自然表达指示词所强调的特定日子。
