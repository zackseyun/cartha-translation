base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
translation:
  language: zh_hans
  text: 他便这样呼求说：“主宰啊，是你在犹太地的王希西家在位的时候差遣了你的天使；那天使在西拿基立的营中击杀了十八万五千人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ ἐπικαλούμενος τόνδε τὸν τρόπον
  choice: 他便这样呼求说
  rationale: 将未完成时动词与同时发生的分词合并为自然的汉语祷告引语格式；“呼求”保留ἐπικαλούμενος向上帝祈求、呼告的含义。
- source_word: Σύ, δέσποτα
  choice: 主宰啊，是你
  rationale: “主宰”体现δέσποτα所表达的绝对权柄，并与κύριος常见译法相区别；“是你”保留显式代词Σύ的强调语气。
- source_word: ἀπέστειλας τὸν ἄγγελόν σου
  choice: 差遣了你的天使
  rationale: “差遣”符合奉命而出的语境；在此历史典故中，ἄγγελος宜译为“天使”，而非泛指“使者”。
- source_word: ἐπὶ Ἐζεκίου τοῦ βασιλέως τῆς Ἰουδαίας
  choice: 在希西家作犹太地王的时候
  rationale: ἐπί加属格在此按历史时期理解，避免误译成天使奉差攻击希西家；“犹太地”直接反映希腊文Ἰουδαίας，同时以脚注说明历史名称“犹大”。
- source_word: ἀνεῖλεν
  choice: 击杀了
  rationale: 准确表达杀死、除掉之意，语气庄重且符合战争叙事。
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: 在西拿基立的营中
  rationale: 按汉语习惯表达被击杀者所在的营地；该语境中的ἐκ指向从营中除去这些人，直译为“从营中击杀”在现代汉语中不自然。
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: 十八万五千人
  rationale: 按现代汉语数字表达准确呈现总数。
theological_decisions:
- issue: δέσποτα与κύριος的词汇区别
  choice: 主宰
  alternative: 主、主人
  rationale: “主宰”既能表达上帝拥有绝对权柄，也不把δέσποτα与κύριος惯常对应的称谓完全混同。
- issue: ἐπὶ Ἐζεκίου的关系
  choice: 在希西家作王的时候
  alternative: 针对希西家、临到希西家
  rationale: 上下文回顾的是上帝在希西家时期救援的事件；译为“针对希西家”会造成天使受差攻击希西家的误解。
- issue: ἀνεῖλεν的隐含主语
  choice: 那天使
  alternative: 他
  rationale: 希腊文省略主语，语法上自然承接“你的天使”；汉语补出“那天使”可消除代词可能指向上帝的歧义，而不改变事件关系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。“主宰啊，是你”保留原文呼语及强调；分号帮助读者辨明差遣者与执行击杀的天使。
