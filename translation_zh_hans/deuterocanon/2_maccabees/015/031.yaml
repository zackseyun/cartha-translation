base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/031.yaml
  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: zh_hans
  text: 他到了那里，便召集同胞和祭司，让他们站在祭坛前，又派人去把城堡里的人[a]召来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自阿克拉堡的人”；阿克拉堡是耶路撒冷的一座设防堡垒。
    reason: 说明ἄκρα在本处可能具有专名性质的历史地理所指，并保留“来自”的原文关系。
lexical_decisions:
- source_word: παραγενόμενος
  choice: 到了那里
  rationale: 不定过去时分词表示先于主要动作发生的抵达；这样译符合现代汉语的叙事顺序。
- source_word: συγκαλεσάμενος
  choice: 召集
  rationale: 保留该中动分词所表达的召来众人聚集之意，同时避免生硬直译。
- source_word: τοὺς ὁμοεθνεῖς
  choice: 同胞
  rationale: ὁμοεθνής指同一民族或族群的人；“同胞”简洁自然，也不在词面之外径直限定为“犹太人”。
- source_word: τοὺς ἱερεῖς
  choice: 祭司
  rationale: 直接对应复数名词，符合本书宗教语境中的通行称谓。
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: 让他们站在祭坛前
  rationale: 将στῆσας按及物用法理解，以先前召集的同胞和祭司为省略的宾语；“让他们站在”自然呈现这一句法关系。
- source_word: μετεπέμψατο
  choice: 派人去召……来
  rationale: 该动词表示派人召某人前来；此译比单说“召见”更明确保留“派人去”的动作。
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: 城堡里的人
  rationale: ἄκρα可指城堡或要塞，在此很可能特指耶路撒冷的阿克拉堡；正文采用普通读者易懂的通称，专名识别置于脚注。
theological_decisions:
- issue: ἄκρα在马加比时代耶路撒冷语境中的所指
  choice: 城堡
  alternative: 阿克拉堡
  rationale: 这是历史地理上的识别，并非教义判断。正文保留普通名词的可读性，脚注说明其很可能是特定要塞。
- issue: στῆσας的及物或不及物理解
  choice: 让他们站在祭坛前
  alternative: 他站在祭坛前
  rationale: 该形式本身可作及物或不及物使用；就此句连续结构而言，把已经召集的同胞和祭司理解为省略宾语，衔接更顺畅，但另一种句法理解仍属可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便……又……”呈现各动作的先后与推进；避免文言化表达。脚注标记紧随其实际说明的“城堡里的人”，不置于无关的“那里”之后。
