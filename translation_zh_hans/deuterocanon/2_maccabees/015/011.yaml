  naturalness: 原译总体庄重、通顺。“装备他们每一个人”比“把他们每个人都武装起来”更适合紧接比较结构；“美好言辞所带来的鼓励”自然明确。
  terminology: “盾牌和长矛”“可信的梦”均准确。“可信的梦”保留叙述者的正面评价，不把梦的来源解释为神圣启示。
