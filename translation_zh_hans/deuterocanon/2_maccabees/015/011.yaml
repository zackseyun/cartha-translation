base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: zh_hans
  text: 他装备他们每一个人[a]，与其说是靠盾牌和长矛的保障，不如说是靠美好言辞所带来的鼓励；他又向他们讲述了一个可信的梦[b]，使他们都极其欢欣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他装备他们每一个人，与其说是以盾牌和长矛的保障，不如说是以美好言辞中的鼓励。”
    reason: 原文将盾牌和长矛的保障与出自美好言辞的鼓励相比较；“装备”可涵盖实际军备及言语上的鼓舞。
  - marker: b
    text: 或译：“一个值得相信的梦。”原文形容这个梦是可信、值得信赖的。
    reason: 说明ἀξιόπιστος的直译含义，同时避免将其明确解释为来自神的启示。
lexical_decisions:
- source_word: καθοπλίσας
  choice: 把……武装起来
  rationale: 该词为不定过去时分词，意为“全副武装、装备”；这里用顺承句式自然表达其先于主句动作发生，又不刻意夸大前缀的语气。
- source_word: οὐ τὴν ... ἀσφάλειαν, ὡς τὴν ... παράκλησιν
  choice: 与其说是靠……安全，不如说是靠……鼓励
  rationale: 保留 οὐ...ὡς 的比较性对照：重点并非绝对否认武器的作用，而是突出言辞带来的激励。
- source_word: ἀσπίδων καὶ λογχῶν
  choice: 盾牌和长矛
  rationale: 采用现代汉语中自然且准确的军械名称。
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  choice: 美好言辞所给予的
  rationale: ἀγαθός 在此具有正面、高尚的评价色彩；“美好言辞”兼顾可懂度与庄重感，整句将 ἐν 表达为鼓励借这些言辞而来。
- source_word: προσηγησάμενος
  choice: 向他们讲述了
  rationale: 中间语态分词表示向听众陈述、讲说；“向他们讲述”保留隐含的受话者。
- source_word: ὄνειρον ἀξιόπιστον
  choice: 一个可信的梦
  rationale: ἀξιόπιστος 意为“值得相信的、可信的”；不进一步断言这梦的神圣来源。
- source_word: ὑπὲρ τὰ πάντα
  choice: 无不
  rationale: 此处与使役动词连用，具有加强和广泛效果的意味；“无不欢欣”自然表达全体受到强烈鼓舞，但未机械译作“超过一切”。
- source_word: ηὔφραινεν
  choice: 使他们无不欢欣
  rationale: 保留 εὐφραίνω 的使役义“使欢喜”；“欢欣”符合庄重叙事语体。
theological_decisions:
- issue: 梦的性质
  choice: 译为“可信的梦”
  alternative: “可靠的梦”或“受默示的梦”
  rationale: 原文只评价这个梦值得相信，并未在本节明确说明其来源；因此保留积极评价而不加入“受默示”等神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“与其说……不如说……”保存原文比较结构的细微张力；分号区分装备、讲梦与使众人欢欣的动作层次。
