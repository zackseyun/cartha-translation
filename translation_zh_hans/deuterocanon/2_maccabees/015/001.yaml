  terminology: “尼迦挪”“犹大”“撒马利亚”及“袭击”均合乎现代中文圣经叙事用语。“犹大一行人”可表达与犹大在一起的一群人，予以保留。正文宜保留“歇息之日”的描述性表达，脚注再提示其很可能是安息日。
