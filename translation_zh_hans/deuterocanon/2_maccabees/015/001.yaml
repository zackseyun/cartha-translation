base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/001.yaml
  text: But Nicanor[a], having learned that those with Judas were in the regions of Samaria, resolved to attack them on the day of rest with complete security.
translation:
  language: zh_hans
  text: 尼迦挪得知犹大一行人在撒马利亚一带，便决定在歇息之日[a]，自以为可以安然无虞地袭击他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“歇息之日”；这里很可能指安息日。
    reason: 保留原文使用描述性说法而非通常“安息日”一词的措辞特点，同时说明其可能所指。
lexical_decisions:
- source_word: μεταλαβών
  choice: 得知
  rationale: 这里带宾语及分词结构，表示获悉情况；“得知”准确、自然，并不误解为“带上”。
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  choice: 犹大一行人
  rationale: οἱ περὶ加人名指与该人同行或归属其群体的人；“一行人”简洁地表达这一集体含义。
- source_word: ἐν τοῖς κατὰ Σαμάρειαν τόποις
  choice: 在撒马利亚一带
  rationale: κατὰ Σαμάρειαν泛指与撒马利亚相关的地区，并非必须指某个行政区；“一带”自然且不过度限定。
- source_word: ἐβουλεύσατο
  choice: 决定
  rationale: 该中间态表示经过谋划而作出决定；现代汉语以“决定”最自然，也保留行动计划已经确定的意味。
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  choice: 安息日
  rationale: 字面为“歇息之日”，在本叙事的犹太语境中所指为安息日；正文采用现代中文通行而明确的称呼，脚注注明希腊文的字面措辞。
- source_word: μετὰ πάσης ἀσφαλείας
  choice: 万无一失地
  rationale: 短语表达尼迦挪认为行动会完全安全、没有风险；“万无一失地”在中文中自然呈现其主观把握。
- source_word: ἐπιβαλεῖν
  choice: 袭击
  rationale: 军事语境中指扑向、攻击；“袭击”也契合其选择休息日以求安全出击的情境。
theological_decisions:
- issue: “歇息之日”的具体所指
  choice: 正文译作“安息日”，脚注保留字面形式
  alternative: 正文译作“歇息之日”
  rationale: 希腊文未用通常的σάββατον，而用“歇息之日”这一描述语；不过在犹太叙事情境中指向安息日十分清楚。采用“安息日”使现代读者立即明白所指，同时借脚注避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而流畅的叙事体。“尼迦挪”“犹大”“撒马利亚”沿用简体中文圣经人名地名惯例；句式保留原文“得知—决定袭击”的逻辑推进。
