  text: But those around Nikanor advanced with trumpets and battle songs[a].
translation:
  language: zh_hans
  text: 尼加诺身边的人却吹着号角，唱着战歌[a]，向前逼近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凯歌”，即庆祝胜利或用于作战的颂歌。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: 尼加诺身边的人却
  rationale: περὶ加宾格用于人物群体时，可指围绕或跟随某位领袖的人；译作“尼加诺身边的人”贴近原文，又不额外规定其军阶或组织结构。δέ在上下文中带对照意味，译作“却”。
- source_word: μετὰ σαλπίγγων
  choice: 吹着号角
  rationale: μετά加属格表示伴随；σαλπίγγων指号角或喇叭。汉语用“吹着号角”自然呈现行军时由号角伴随的情景，同时避免误指某种现代铜管乐器。
- source_word: παιάνων
  choice: 唱着战歌[a]
  rationale: παιάν可指凯歌、颂歌或用于战争场合的歌唱。“战歌”在当前军事语境中清楚自然；脚注保留“凯歌/颂歌”的词义范围，避免把它窄化为单纯的呼喊。
- source_word: προσῆγον
  choice: 向前逼近
  rationale: προσάγω在此描述朝交战对象推进。“向前逼近”兼顾方向性和战场语境，比中性的“走近”更有力度，又不超出原文。
