  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: zh_hans
  text: 他用律法和先知书来鼓励他们，又提醒他们已经完成的战斗，使他们更加奋勇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: 鼓励
  rationale: 此处指借着圣言安慰、劝勉众人；现代汉语用“鼓励”自然贴切，也与下文激发斗志的结果相合。
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: 引用律法和先知的话
  rationale: ἐκ 表示鼓励的内容或来源；补出“引用……的话”，使汉语意思明确，同时保留“律法和先知”这一固定表述。
- source_word: τοὺς ἀγῶνας
  choice: 那些争战
  rationale: ἀγών可指竞赛、搏斗或艰苦斗争；本段军事语境下译作“争战”，同时保留其奋斗、考验的意味。
- source_word: ἐκτετελεκότες
  choice: 已经完成
  rationale: 完成时分词强调此前已经完成且成果仍在；直译“已经完成”，不弱化为仅仅“忍受”或“经历”。
- source_word: προθυμοτέρους
  choice: 更加奋勇
  rationale: 比较级表示更为热切、积极、勇于行动；在临战语境中“更加奋勇”比抽象的“更加热心”更自然。
- source_word: κατέστησεν
  choice: 使他们
  rationale: 表达使役结果，即上述鼓励和提醒使众人进入更积极奋勇的状态。
