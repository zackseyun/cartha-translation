  text: And when a cry and turmoil arose[b][a], they blessed the Sovereign in their ancestral language.
translation:
  language: zh_hans
  text: 一阵呼喊和骚动发生时，他们便用祖传的语言[b]称颂那位掌权者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌权者”或译“大能者”或“统治者”；希腊语原词指拥有能力或权柄的那一位。
    reason: lexical_alternative
  - marker: b
    text: 直译“用祖传的声音”；这里很可能指他们以本族世代相传的语言发声、称颂。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: 起来时
  rationale: 这是构成属格独立结构的不定过去时分词；译作“起来时”自然表达伴随情境的时间关系，又不把先后次序说得过死。
- source_word: κραυγῆς
  choice: 喧嚷
  rationale: κραυγή指响亮的呼喊或叫喊；“喧嚷”既体现声音之大，也适合此处群体场景。
- source_word: ταραχῆς
  choice: 骚动
  rationale: ταραχή表示扰乱、混乱或动荡；“骚动”与“喧嚷”并列，保留原文场面的纷乱感。
- source_word: εὐλόγουν
  choice: 称颂
  rationale: εὐλογέω在此以神为对象，指颂赞、祝颂；“称颂”在现代汉语中庄重自然，也比一般的“赞美”更能保留祝颂意味。
- source_word: τὸν δυνάστην
  choice: 那位掌权者
  rationale: δυνάστης指拥有能力或权柄者，在此用作对神的尊称。“掌权者”保留权能与统治两方面含义，同时避免把词义限定为某个更专门的神圣称号。
- source_word: τῇ πατρίῳ φωνῇ
  choice: 用祖传的语言
  rationale: 此与格短语表示方式或工具；πατρίος意为祖传的、本族先辈的，φωνή在此可指言语或语言。译文清楚表达他们以本族传统语言发声。
theological_decisions:
- issue: 如何翻译用于指神的称号 τὸν δυνάστην
  choice: 那位掌权者
  alternative: 大能者；统治者
  rationale: 原词兼有能力和权柄的含义。“掌权者”保留其神学分量，却不将其等同于原文没有明确使用的其他神名；脚注同时保留“大能者”和“统治者”等可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“喧嚷和骚动”保留两个并列名词；“称颂”适合以神为对象的语境。脚注标记分别紧随其所说明的词语。
