base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: zh_hans
  text: 犹大的话极其高尚，足以激励他们追求美德[a]，使青年男子的心志充满男子气概[b]；他们受到这些话的鼓舞后，便决意不只是出征[c]，而要勇往直前，以十足的勇气接战，使局势见分晓，因为城、圣物和圣殿[d]也都处于危险之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美德”也可译作“卓越”；在这里的军事语境中，还可理解为“英勇”。希腊词ἀρετή兼有道德与勇武方面的含义。
    reason: lexical_alternative
  - marker: b
    text: 直译为“使青年男子的心志变得有男子气概”。原文以明确的男性意象表达勇敢。
    reason: lexical_alternative
  - marker: c
    text: 这里不是说他们决定不作战，而是说他们决意不只是进行一般性的出征，还要勇敢接战，使事态得到决定性的结果。
    reason: alternative_reading
  - marker: d
    text: 原文将“圣物”与“圣殿”分别列出，因此译文也保留两者，不把它们合并为一个概念。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: 受到这些话的鼓舞后
  rationale: παρακαλέω在此兼有劝勉与振奋之意；军事语境重在犹大言辞所产生的鼓舞行动之效。
- source_word: πάνυ καλοῖς
  choice: 极其高尚
  rationale: καλός在这里评价言辞的道德与精神品质；“高尚”比单纯的“好”更切合庄重的军旅语境。
- source_word: δυναμένοις ἐπ' ἀρετὴν παρορμῆσαι
  choice: 足以激励他们追求美德
  rationale: ἀρετή可指美德、卓越或英勇；正文采用范围较广的“美德”，脚注保留军旅语境下“英勇”的可能。
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: 使青年人的心志充满男子气概
  rationale: 保留ψυχαί所指内在心志以及ἐπανδρόω明确的男性化勇武意象，同时使现代汉语通顺。
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: 决意不只是出征
  rationale: 下文明确说他们要勇敢投入战斗，因此μή在对比结构中不是否定作战，而是表达“不仅仅”进行一般性的出征。
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: 而要勇往直前
  rationale: ἐφέρεσθαι在战斗语境中带有向前推进之意；“勇往直前”兼顾动态与γενναίως的勇敢意味。
- source_word: μετὰ πάσης εὐανδρείας
  choice: 鼓足全部勇气
  rationale: εὐανδρεία可指男子气概、英勇或勇气；前句已明确保留男性意象，此处用自然汉语表达πάσης的完全程度。
- source_word: ἐμπλακέντες
  choice: 投入战斗
  rationale: 该分词在军事语境中指卷入或接战，用“投入战斗”明确而自然。
- source_word: κρῖναι τὰ πράγματα
  choice: 使局势见分晓
  rationale: 该表达指使事情得到决定性的结果；此译保留“决定事态”的意义，又符合战斗语境。
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: 城、圣物和圣殿
  rationale: 原文分别列出τὰ ἅγια与τὸ ἱερόν，故译作“圣物”和“圣殿”，不将二者合并。
- source_word: κινδυνεύειν
  choice: 处于危险之中
  rationale: 准确表达这些城邑与神圣事物正受威胁，并保留διὰ τὸ所引出的原因关系。
theological_decisions:
- issue: ψυχὰς νέων ἐπανδρῶσαι与εὐανδρείας中的男性化军旅语言
  choice: 正文以“青年人的心志充满男子气概”保留明确的男性意象。
  alternative: 使青年人壮胆；使他们充满勇气
  rationale: 原文有意采用与男性和勇武相关的措辞；完全中性化会削弱其修辞特色。第二处εὐανδρείας则译为“勇气”，避免中文重复生硬，而前句已充分呈现该意象。
- issue: μὴ στρατεύεσθαι与后续不定式之间的关系
  choice: 译作“决意不只是出征”。
  alternative: 决意不出征；决意不作战
  rationale: 若按字面孤立地译成“不出征”，便与紧接着的勇敢推进、投入战斗相冲突。上下文的对比意义是：他们不满足于一般出征，而要把战斗推向决定性的结果。
translation_notes:
  register: 采用庄重而现代的标准普通话。句式保持叙事推进感，以“鼓舞—决意—接战—原因”呈现原文逻辑；保留“圣物/圣殿”的词义区分及原文男性化的勇武修辞，同时避免不必要的古奥表达。
