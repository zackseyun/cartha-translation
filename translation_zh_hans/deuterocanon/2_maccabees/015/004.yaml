base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/004.yaml
  text: But they declared[a], “The Lord lives; he himself is the ruler in heaven, the one who commanded the observance of the seventh day.”
translation:
  language: zh_hans
  text: 他们却宣告说：“主是永活的；他亲自在天上掌权，正是他命令遵守第七日[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安息日”。希腊原文作“第七日”，这里指遵守安息日。
    reason: 保留源语的字面表达，同时说明其语境含义。
lexical_decisions:
- source_word: ἀποφηναμένων
  choice: 他们却宣告说
  rationale: 该分词承接上文并引出他们正式而坚定的答复；“宣告说”保留公开、郑重的语气，“却”对应 δέ 的转折或承接作用。
- source_word: κύριος
  choice: 主
  rationale: 在此犹太语境中指上帝；“主”既庄重自然，也延续《七十士译本》的惯常神名用语。
- source_word: Ἔστιν ὁ κύριος ζῶν
  choice: 主是永活的
  rationale: 希腊语直陈主为活着的上帝，带有信仰宣认般的力度；“永活的”符合现代中文宗教语境，同时不把句子改写为誓言。
- source_word: αὐτὸς ἐν οὐρανῷ δυνάστης
  choice: 他亲自在天上掌权
  rationale: αὐτός 强调“他亲自”；δυνάστης 指拥有权柄者。译成动词结构“掌权”比“是天上的统治者”更自然，并保留其统治权威。
- source_word: κελεύσας
  choice: 命令
  rationale: 表达具有约束力的权威吩咐，适合上帝设立第七日的语境。
- source_word: ἀσκεῖν
  choice: 遵守
  rationale: 该动词本义涉及实行、操练；与“第七日”连用时指持守和实行相关规定，中文用“遵守”简洁自然。
- source_word: τὴν ἑβδόμαδα
  choice: 第七日
  rationale: 原文采用“第七”这一表达，在语境中指安息日。正文保留源语措辞，脚注说明其具体所指。
theological_decisions:
- issue: τὴν ἑβδόμαδα 所指的安息日是否在正文中明说
  choice: 第七日
  alternative: 安息日
  rationale: 希腊原文没有使用通常表示“安息日”的词，而是说“第七日”。正文保留这一措辞，以免消除源语表达上的特点；脚注注明它指安息日。
- issue: Ἔστιν ὁ κύριος ζῶν 的语气
  choice: 主是永活的
  alternative: 主活着
  rationale: 两者都可反映希腊文。“主是永活的”在现代中文中更庄重、清楚，并保留信仰宣认的力度，而不额外补入誓言公式。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“宣告说”体现正式答复；分号保留前后两个相连宣认之间的力度。正文中的脚注标记与脚注相对应。
