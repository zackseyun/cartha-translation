base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: zh_hans
  text: 他劝勉与他同在的人，不要因列国的进攻而胆怯，却要牢记先前从天而来的帮助，并且如今要期待全能者将赐给他们的胜利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: 劝勉
  rationale: 未完成时表示持续进行的劝勉；“劝勉”兼具鼓励与郑重敦促之意，适合当前军事语境。
- source_word: τοὺς σὺν αὐτῷ
  choice: 跟随他的人
  rationale: 指与犹大同在并随他作战的人；此译自然简洁，也不过度扩写为特定军事称谓。
- source_word: μὴ δειλιᾷν
  choice: 不要……胆怯
  rationale: δειλιάω不只是一般的害怕，也包含因恐惧而畏缩、失去勇气之意；“胆怯”保留了这一较强语气。
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: 列国的进攻
  rationale: ἔφοδος指敌对的逼近或攻击；ἐθνῶν在此指周围的外族各国，“列国”符合犹太历史叙事语境，也避免加入不必要的教义色彩。
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: 却要牢记
  rationale: 该分词结构说明他们面对进攻时应持有的心态；“牢记”自然表达持续放在心上的含义。
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: 先前从天上临到他们的援助
  rationale: προγεγονότα表示先前已经发生，βοηθήματα可指多次或多样的援助；“从天上临到”保留援助的天上来源。
- source_word: τὰ νῦν προσδοκᾷν
  choice: 并且如今要期待
  rationale: προσδοκάω表达带有信心的等候和期待；“如今”与先前所得的援助形成时间上的对照。
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: 全能者将赐给他们的胜利
  rationale: ἐσομένην表明胜利尚在将来，παρά指出其来源；汉语用“将赐给”自然表达胜利来自全能者，但不暗示人的行动毫无作用。
theological_decisions:
- issue: 神圣称号παντοκράτωρ的译法
  choice: 全能者
  alternative: 全能的主；统管万有者
  rationale: “全能者”是现代中文中庄重、通行的神圣称号，既保留παντοκράτωρ的权能含义，也不额外引入原文没有出现的“主”等称谓。
- issue: “从天上”的所指
  choice: 保留为“从天上”
  alternative: 明译为“从上帝而来”
  rationale: 原文使用ἀπʼ οὐρανοῦ而未直接说“从上帝”；保留其委婉表达，避免消除原文的修辞与指称方式。
- issue: 胜利与全能者之间的关系
  choice: 译为“全能者将赐给他们的胜利”
  alternative: “将从全能者临到他们的胜利”
  rationale: παρά清楚标示全能者是胜利的来源。“赐给”是自然汉语，但仍将内容限定于胜利来自全能者，不进一步界定神人协作方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“列国”保留次经犹太历史语境；“胆怯”体现军事威胁下因惧怕而畏缩的意味。全句尽量保持原文由过去的天上援助转向当前对未来胜利之期待的逻辑推进。
