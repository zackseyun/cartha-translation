  text: And Nicanor[a], in complete confidence and with arrogant pride, had decided to make a public example of those with Judas.
translation:
  language: zh_hans
  text: 尼迦挪十分自信，趾高气扬，早已决定要把跟随犹大的人一并处置[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一并处置”译自一个含义较难确定的希腊语表达，字面可近似理解为“为跟随犹大的人安排一种共同的处置方式”。它可能指使他们一同遭受某种处置或惩罚；原文没有明确说明该处置的具体性质。
    reason: 保留κοινὸν ... τρόπον的歧义，并说明其共同处置的核心含义，不将“公开示众”、具体刑罚或毁灭性结果当作原文唯一明确的意思。
lexical_decisions:
- source_word: μετὰ πάσης ἀσφαλείας
  choice: 自以为万无一失
  rationale: 此处所指主要不是客观的安全保障，而是尼迦挪自觉稳妥、笃定无虞的心态；加上“自以为”也与下文的傲慢语气相合。
- source_word: ὑψαυχενῶν
  choice: 趾高气扬
  rationale: 该分词描写高傲、自大的姿态；“趾高气扬”是自然、庄重程度适中的现代汉语表达，也保留原文的贬义色彩。
- source_word: διεγνώκει
  choice: 早已决定
  rationale: 希腊语为过去完成时，表示在叙事参照点以前已经形成并确定的决意。
- source_word: κοινὸν ... τρόπον
  choice: 一同遭受处置
  rationale: 原短语字面涉及“共同的／同样的方式”，搭配 συστήσασθαι 后含义不够明确。译文保留众人共同受到某种处置这一核心，而不在正文中武断限定为“杀灭”或“公开示众”。
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: 犹大一伙人
  rationale: 此结构指以犹大为中心、与他同在或归属他的一群人，并非只指犹大本人。
- source_word: συστήσασθαι
  choice: 让……遭受
  rationale: 在此结构中表示安排、造成或施加某种对待；汉语用使动式表达，比直译为“设立一种方式”自然。
