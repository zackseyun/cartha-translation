base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/037.yaml
  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: zh_hans
  text: 又要把第十二个月的十三日定为特别的日子——按通行的语言，这个月称为“亚达”[a]——即末底改日的前一天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按通行的语言”：希腊文措辞罕见且含义不甚确定，也可理解为“按当地语言”；有些译法据语境作“按叙利亚语”。此处是说明第十二个月的名称“亚达”。
    reason: lexical_alternative
  - marker: b
    text: “末底改日”指与末底改有关的纪念日，很可能是指普珥节。
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν δὲ ἐπίσημον
  choice: 并要……作为一个特别的日子
  rationale: ἔχειν在此承接上下文，表示把某日作为特定纪念日；ἐπίσημον意为“有标记的、显著的、特别的”。此译法自然表达设立纪念日之意，同时不把它强化为法定节日或宗教节期。
- source_word: τὴν προκαδεκάτην
  choice: 十三日
  rationale: 该复合序数词指十四日前一日，即十三日；直接译出日期最清楚。
- source_word: τοῦ δωδεκάτου μηνός
  choice: 十二月
  rationale: 按原文直译为一年中的第十二个月，不额外以“亚达月”取代其序数称呼。
- source_word: Ἀδὰρ
  choice: 亚达月
  rationale: 采用现代中文圣经传统中常见的月份名称音译，并补出“月”以符合中文表达。
- source_word: τῇ κυριακῇ φωνῇ
  choice: 用当地语言
  rationale: 原文短语异常；κυριακῇ通常与“主、所属者”有关，但此处显然用于说明月份名称。结合语境译作“当地语言”，并用脚注保留“叙利亚语”等可能解释及文本疑难。
- source_word: πρὸ μιᾶς ἡμέρας
  choice: 前一天
  rationale: 准确表达两项纪念日期相隔一日的时间关系。
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: 末底改日
  rationale: 形容词Μαρδοχαϊκῆς意为“属于末底改的、与末底改有关的”；译为“末底改日”简洁保留其专名性质，不在正文中直接等同于普珥节。
theological_decisions:
- issue: ἐπίσημον所描述之纪念活动的性质
  choice: 一个特别的日子
  alternative: 节日；法定节日；隆重庆祝的日子
  rationale: 原文只明确该日被特别标记出来，并未清楚规定其礼仪、法律地位或庆祝方式，因此采用较克制的表达。
- issue: τῇ κυριακῇ φωνῇ的含义
  choice: 用当地语言
  alternative: 用叙利亚语；用通用语；按主的称呼
  rationale: 给出的希腊文本为κυριακῇ，而非通常表示“叙利亚的”之Συριακῇ，因而存在真实的文本或措辞疑难。语境要求它说明“亚达”这一月名，正文采用不作过度断定的语境性译法，脚注列出主要可能。
- issue: “末底改日”与普珥节的关系
  choice: 正文保留“末底改日”
  alternative: 直接译作“普珥节”
  rationale: 原文以末底改的名字称该日，虽很可能指向普珥节传统，但直接替换为“普珥节”会消除原文措辞及其可能的历史称谓差异。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作为一个特别的日子”避免生硬直译，也不超出ἐπίσημον的语义范围。专名采用简体中文圣经常见形式“亚达”“末底改”。正文中的脚注标记依次为[a]、[b]，并均有对应脚注。
