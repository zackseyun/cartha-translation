base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/018.yaml
  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: zh_hans
  text: 因为他们对妻子和儿女，以及对兄弟和亲属的牵挂，所占的分量较轻；但对那座已分别为圣的圣殿的忧惧，却是最大、最首要的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧惧”也可译作“惧怕”或“忧虑”；原文φόβος在这里可兼指恐惧和焦虑的关切。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: 对妻子儿女的牵挂
  rationale: 冠词与περὶ加属格构成名词性短语，指对家人的挂念或忧虑。“牵挂”自然表达情感，又不把语气强化为恐惧。
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: 以及兄弟亲属
  rationale: ἔτι δέ继续增列所关切的家人；“兄弟亲属”简洁保留两个亲属类别。
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: 在他们心中所占的分量较轻
  rationale: 这一希腊语习语字面为“处于较小的部分”，表示优先程度较低；此译法兼顾其比喻结构和现代汉语的自然表达。
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: 最大、最首要的
  rationale: 分别保留μέγιστος的程度最高与πρῶτος的次序优先，重现原文的双重强调。
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: 忧惧，是为了那座已经分别为圣的圣殿
  rationale: “忧惧”保留φόβος在此处兼有害怕与焦虑关切的语义；“已经分别为圣”体现καθηγιασμένου的完成时被动分词意义，而不只笼统译作“圣”。
theological_decisions:
- issue: 军事与宗教处境中φόβος的译法
  choice: 忧惧
  alternative: 惧怕；忧虑
  rationale: φόβος可指恐惧，也可指因危险而生的焦虑关切。“忧惧”保留两者间的张力，避免把它弱化为单纯的重视或强化为纯粹惊恐。
- issue: καθηγιασμένου ναοῦ的译法
  choice: 那座已经分别为圣的圣殿
  alternative: 神圣的圣殿；已经祝圣的圣殿
  rationale: 完成时被动分词强调圣殿已被分别为圣并处于该状态。“分别为圣”清楚体现其礼仪与宗教地位，同时避免依赖特定宗派术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在他们心中所占的分量较轻”传达希腊语习语所表达的优先次序；末句保留“最大、最首要”的双重强调。脚注标记置于主文相关句末。
