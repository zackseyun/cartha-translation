  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: zh_hans
  text: 愿那些带着亵渎前来攻击你圣洁子民的人，被你膀臂的伟力所震慑[a][b]。他就这样结束了这番话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被……所震慑”也可译作“惊恐”或“惊慌失措”；希腊语动词表示受到恐惧或惊愕的强烈冲击。
    reason: lexical_alternative
  - marker: b
    text: “你膀臂的伟力”保留了圣经中以“膀臂”象征上帝施展能力的形象。
    reason: cultural_note
  - marker: c
    text: “结束了这番话”也可译作“就这样作了结束”；希腊语所指的是刚刚说出的这些话。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει
  choice: 因……的伟力
  rationale: 与被动命令式 καταπλαγήτωσαν 连用，表示原因或凭借；“因”在现代汉语中自然地传达其致使作用。
- source_word: βραχίονός σου
  choice: 你膀臂的伟力
  rationale: 保留“膀臂”这一明确的圣经意象，不直接释作“能力”；“伟力”对应 μεγέθει，也使汉语表达清楚自然。
- source_word: καταπλαγήτωσαν
  choice: 愿……惊恐万状
  rationale: 该被动命令式表达被恐惧或惊愕所攫住；“愿”符合祈祷语境，“惊恐万状”保留强烈程度，虽不机械再现希腊语的被动态。
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: 那些亵渎着前来……的人
  rationale: παραγινόμενοι 表示前来、来到；μετὰ βλασφημίας 描述他们前来的方式。“亵渎着前来”避免把亵渎仅理解为随身携带之物。
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: 攻击你圣洁的子民
  rationale: 在敌对行动的语境中，ἐπί 加宾格表示朝向并带有敌意，译作“攻击”比单纯的“来到”更明确；保留“圣洁的子民”，不增添原文没有的盟约称谓。
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: 他就这样结束了这番话
  rationale: ἔληξεν 是“结束、收束”；ἐν τούτοις 回指刚才所说的内容。“结束了这番话”是自然汉语，并保留其指代范围可能是言辞或发言的空间。
theological_decisions:
- issue: 祷告中“你膀臂”的隐喻意义
  choice: 正文保留“你膀臂”的具体意象
  alternative: 你的能力；你大能的膀臂
  rationale: 原文明确使用“膀臂”，这是表达上帝施行大能的圣经意象。保留该意象可维持经文间的呼应，同时用“伟力”传达 μεγέθει。
- issue: 敌人前来的方式与对象
  choice: “亵渎着前来攻击你圣洁子民”
  alternative: “带着亵渎前来你圣洁的子民那里”
  rationale: 上下文和 ἐπί 加宾格支持敌对趋向，但“亵渎”究竟指言语、态度还是行为并未细化，因此不进一步限定。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“愿……惊恐万状”保留祈求和强烈语气；“膀臂”较“手臂”更具经文语体色彩，但在现代汉语中仍可理解。脚注标记按其对应短语依次置于正文。
