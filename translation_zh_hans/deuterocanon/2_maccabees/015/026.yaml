  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: zh_hans
  text: 犹大身边的人则一边呼求、一边祷告[a][b]，与敌人交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“呼求上帝并祷告。”希腊原文作“呼求并祷告”，本句没有明说呼求的对象。
    reason: lexical_alternative
  - marker: b
    text: “祷告”也可译作“许愿”；希腊语这个词可随语境表示这两种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: 犹大一方的人却
  rationale: περὶ加宾格用于领袖时，可指围绕或跟随他的一群人。“犹大一方的人”自然表达其所属阵营，又不把原文进一步具体化为“士兵”；δὲ译作“却”，承接并形成对照。
- source_word: μετὰ ἐπικλήσεως
  choice: 呼求
  rationale: ἐπίκλησις在此具有宗教性的呼告、求助含义。“呼求”比音译式的“祈求 invocation”更符合现代汉语，同时不在正文中补出希腊文未明说的呼求对象。
- source_word: καὶ εὐχῶν
  choice: 祷告
  rationale: εὐχή既可指祷告，也可指许愿；在与ἐπίκλησις并列且临战的语境中，“祷告”较合适，但脚注保留“许愿”的可能。
- source_word: συνῆψαν
  choice: 交战
  rationale: συνάπτω在军事语境中表示接战、投入战斗。“交战”简洁而准确地保留军事含义。
- source_word: τοῖς πολεμίοις
  choice: 与敌人
  rationale: 该与格表示交战的对方；汉语以“与敌人交战”自然表达其敌对关系。
theological_decisions:
- issue: 战斗语境中ἐπίκλησις的宗教意味及其对象
  choice: 译作“呼求”，保留宗教性而不在正文补出对象
  alternative: 译作“呼求上帝”或较泛化的“求助”
  rationale: 上下文很可能指向上帝，但本句希腊文没有明说呼求的对象。正文保留这种省略，脚注说明可理解为呼求上帝，既不削弱宗教意味，也不把解释直接写入经文。
- issue: εὐχή在“祷告”与“许愿”之间的歧义
  choice: 正文采用“祷告”
  alternative: 译作“许愿”
  rationale: 与“呼求”并列且发生在交战之际，“祷告”更符合即时祈求帮助的语境；然而该词确能表示许愿，因此以脚注保存词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“犹大一方的人”保留希腊语围绕领袖形成群体的表达；“呼求祷告”紧凑呈现两个并列的宗教行为，同时借脚注保留原文中对象省略和εὐχή词义上的歧义。
