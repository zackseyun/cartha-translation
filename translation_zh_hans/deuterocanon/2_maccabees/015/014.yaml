  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
translation:
  language: zh_hans
  text: 敖尼雅回答说：“这位就是上帝的先知耶利米；他爱自己的弟兄[a]，常常为百姓和圣城祷告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”原文直译为“爱弟兄的”；这里指对自己同胞的亲属式关爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα δὲ τὸν Ὀνίαν εἰπεῖν
  choice: 敖尼雅回答说
  rationale: 按希腊语的间接叙事结构自然转为现代汉语直接引语的引介语；“回答说”保留ἀποκριθέντα与εἰπεῖν的双重表达。
- source_word: φιλάδελφος
  choice: 爱弟兄
  rationale: 保留该词“爱弟兄、爱同胞”的亲属性意象；在这里指耶利米对本族同胞的深厚关爱，而不泛化为单纯“爱人”。
- source_word: πολλὰ προσευχόμενος
  choice: 常常……祷告
  rationale: πολλά在此修饰祷告的程度或频密性；“常常祷告”符合现代汉语，也保留持续、殷勤代求之意。
- source_word: περὶ τοῦ λαοῦ καὶ τῆς ἁγίας πόλεως
  choice: 为百姓和圣城
  rationale: περί与祷告搭配表示祷告所关切或代求的对象；“百姓”和“圣城”直接对应原文，未擅加“他的”。
- source_word: Ἰερεμίας ὁ τοῦ θεοῦ προφήτης
  choice: 上帝的先知耶利米
  rationale: 以自然汉语重排同位结构，准确保留耶利米“上帝的先知”这一称谓。
theological_decisions:
- issue: 异象中耶利米对百姓的关爱与代求
  choice: 爱弟兄、常常为百姓和圣城祷告
  alternative: 爱同胞、为百姓和圣城多多祷告
  rationale: 原文明确描写耶利米的关爱和祷告，但不进一步界定其代求的机制或教义含义；译文保留这一叙事陈述及其神学张力，不作宗派化解释。
- issue: φιλάδελφος所指群体
  choice: 弟兄
  alternative: 同胞
  rationale: “弟兄”更直接保存希腊词的亲属意象，同时在上下文中可自然理解为本族百姓；“同胞”虽较明白，却会弱化原词的比喻色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将多个后置修饰语整合为“爱弟兄、常常……祷告的上帝的先知耶利米”，既贴近希腊语所刻画的持续特征，也保持中文流畅。
