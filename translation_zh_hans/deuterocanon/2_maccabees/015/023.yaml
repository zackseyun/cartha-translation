base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: zh_hans
  text: 现在，诸天的主宰啊，求你差遣一位良善的天使走在我们前面，带来恐惧和战栗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明确说明是谁感到恐惧和战栗；从上下文看，很可能是敌军。较形式对应地可译作：“为着恐惧和战栗。”
    reason: 说明原文在恐惧承受者及εἰς所表达的目的或结果方面保留的含混。
lexical_decisions:
- source_word: δυνάστα τῶν οὐρανῶν
  choice: 诸天的主宰
  rationale: δυνάστα是表示掌权者的呼格，译作“主宰”既体现权柄，也符合祷告中的庄重称呼；τῶν οὐρανῶν为复数，以“诸天”保留原文形式。
- source_word: ἀπόστειλον
  choice: 求你差遣
  rationale: 原文是命令式，在祷告语境中用“求你差遣”自然表达恳求，同时保留其直接有力的语气。
- source_word: ἄγγελον ἀγαθὸν
  choice: 一位良善的天使
  rationale: 此处ἄγγελος在军事祷告语境中指天使；ἀγαθός直译为“良善的”，不额外解释其具体职能。
- source_word: ἔμπροσθεν ἡμῶν
  choice: 走在我们前面
  rationale: 该短语表示在队伍前方先行；加入“走在”使现代汉语自然，同时保留引领和先行的空间含义。
- source_word: εἰς δέος καὶ τρόμον
  choice: 带来恐惧和战栗
  rationale: εἰς在此可表达目的或结果。“带来”以自然汉语呈现这种作用，但不明说恐惧战栗临到谁；“恐惧和战栗”也保留两个并列名词。
theological_decisions:
- issue: “恐惧和战栗”的承受者
  choice: 正文不明确指出由谁恐惧战栗，只说天使“带来恐惧和战栗”
  alternative: 明确译为“使敌人恐惧战栗”
  rationale: 上下文很可能指敌军受到惊吓，但希腊文没有明说承受者；正文因此保留原文的含混，避免补入“敌人”。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“诸天的主宰”保留原文的崇高语体；句法流畅，但不把军事语境所暗示的“敌军”写入正文。
