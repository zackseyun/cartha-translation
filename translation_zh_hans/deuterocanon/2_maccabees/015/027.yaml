base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: zh_hans
  text: 他们一面用双手奋战，一面在心里向上帝祷告，击倒了不下三万五千四百人[a]，并因上帝的眷顾而大大欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文按其数值理解为“三万、五千和四百”，即三万五千四百；这一抄本所传的数字措辞较为压缩且不规则。
    reason: textual_variant
  - marker: b
    text: 或译：“因上帝的眷顾而大受鼓舞。”希腊文较直译为“上帝的照料（或关怀）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: 一面用双手奋战
  rationale: ἀγωνίζομαι在战斗语境中指奋力作战；“用双手奋战”保留了与下句“在心里”相对的外在行动。
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: 一面在心里向上帝祷告
  rationale: 与前一分句构成“一面……一面……”的对照，既表达持续同步的动作，也自然传达καρδίαις所指的内心祷告。
- source_word: κατέστρωσαν
  choice: 击倒了
  rationale: 该动词在军事语境中有使人倒下、杀败之意；“击倒”保留原文的强烈动作感，而不额外明确每一人是否死亡。
- source_word: οὐδὲν ἧττον
  choice: 不下
  rationale: 这是表示最低数量并带强调意味的惯用语；“不下”符合现代汉语表达。
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: 三万五千四百
  rationale: 依经核校的数值理解译出总数；所传希腊措辞在这一处有压缩或不规则现象，因此另加脚注说明。
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: 因上帝的眷顾而大大欢喜
  rationale: ἐπιμέλεια表示照料、关怀；“眷顾”自然表达上帝主动的看顾，又避免使用含义更技术化的“护理”。ἐφρανθέντες则按其喜乐之义译为“大大欢喜”。
theological_decisions:
- issue: 如何翻译τοῦ θεοῦ ἐπιμελείᾳ
  choice: 上帝的眷顾
  alternative: 上帝的护理；上帝的照料
  rationale: 原词直接指关心、照料。“眷顾”既保留神圣主体的主动关怀，也不把原文扩展为一套关于“护理”的系统神学表述。
- issue: ἐφρανθέντες表达喜乐还是受到鼓舞
  choice: 大大欢喜
  alternative: 大受鼓舞
  rationale: 前者更直接保留动词的喜乐语义；“大受鼓舞”符合战事语境，但解释性较强，故列入脚注作为可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一面……一面……”清楚呈现双手作战与内心祷告同时进行的鲜明对照；全句避免古奥措辞，也不以技术性神学术语取代原文较普通的“照料、关怀”概念。
