  yaml_path: translation/deuterocanon/2_maccabees/015/038.yaml
  text: So[a], since the events concerning Nicanor had turned out in this way, and from those times the city had remained in the possession of the Hebrews[b], I too will bring my account to a close here.
translation:
  language: zh_hans
  text: 因此，有关尼加诺尔的事既已如此发展，从那些时候起，这城一直由希伯来人掌握；我也就在这里结束这篇记述。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα
  choice: 有关尼加诺尔的事
  rationale: κατά加人名在此概括与尼加诺尔相关的一系列事件；译作“有关……的事”自然，也不把含义缩窄为单次交战。
- source_word: χωρησάντων οὕτως
  choice: 既这样告一段落
  rationale: χωρέω在此描述事情如何发展、形成结果；结合全书收束语境，“告一段落”既表达结果，又与末句结束记述相呼应。
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: 从那些时候起
  rationale: 保留καιρῶν的复数和回指性质；“起”清楚表达从当时延续下去的时间关系。
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: 这城也一直由希伯来人掌握
  rationale: κρατέω的被动式表示城处于希伯来人的控制或持有之下；“一直”体现从那些时候起延续的状态，“掌握”则保留控制与占有之间的语义宽度。
- source_word: τῆς πόλεως
  choice: 这城
  rationale: 原文只说“城”，上下文所指是耶路撒冷；译文保留原文含蓄的回指，不直接补出城名。
- source_word: καὶ αὐτὸς
  choice: 我也
  rationale: 保留καί的“也”和αὐτός所强调的作者自我指涉，同时符合现代汉语表达。
- source_word: αὐτόθι τὸν λόγον καταπαύσω
  choice: 就在这里结束这篇记述
  rationale: αὐτόθι在结语中指叙述停止之处；λόγος指书面叙事，καταπαύσω表示使其停止，合译为自然庄重的收尾语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“这城”而不明说耶路撒冷，并保留“希伯来人”这一原文族称。经核对，所给英文脚注的标记与内容明显错配：a的内容实际对应“掌握”，b的内容对应“结束记述”；由于正文无需借脚注即可准确表达，故不沿用这些错配脚注。
