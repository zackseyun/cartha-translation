revisions:
- from: 因此，有关尼加诺尔的事既这样告一段落，从那些时候起，这城也一直由希伯来人掌握，我也就在这里结束这篇记述。
  to: 因此，有关尼加诺尔的事既已如此发展，从那些时候起，这城一直由希伯来人掌握；我也就在这里结束这篇记述。
  rationale: 修订仅调整两处语义与衔接：以“既已如此发展”对应 χωρησάντων οὕτως 的结果性回顾，不将其预释为叙事结束；删去城之分句中的“也”，并以分号清楚分隔作者自我指涉的收束句。原文未设脚注，且英文审校轨迹中的脚注标记和说明错配；中文正文不需要脚注即可保留相关语义，故不增设脚注。
