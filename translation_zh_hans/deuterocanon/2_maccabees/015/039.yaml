  yaml_path: translation/deuterocanon/2_maccabees/015/039.yaml
  text: And if it is well written and suitably arranged[a], that is what I myself wanted; but if it is poorly and moderately done, this was what I could achieve.
translation:
  language: zh_hans
  text: 如果写得好、编排恰当，这正是我自己所愿的；但如果写得粗陋平庸，这就是我所能做到的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς
  choice: 写得好
  rationale: 上下文是作者对本书文学成果的自评；译为“写得好”自然明确，又不超出原文语境。
- source_word: εὐθίκτως τῇ συντάξει
  choice: 编排也恰当
  rationale: εὐθίκτως表示合宜、得当，σύνταξις在此指作品的组织编排；合译可保留其文学结构层面的含义。
- source_word: ἤθελον
  choice: 是我自己的愿望
  rationale: 表达作者原本所愿，保留καὶ αὐτός所加强的“我自己”，语气庄重而自然。
- source_word: εὐτελῶς
  choice: 粗陋
  rationale: 该词与καλῶς形成负面对比，在文学自评中表示质量低劣或欠佳；“粗陋”兼顾文体和成品质量。
- source_word: μετρίως
  choice: 只属平平
  rationale: 表示仅达到中等、普通水平；“只属平平”保留自谦语气，并避免把“适度”误解为正面评价。
- source_word: ἐφικτὸν ἦν μοι
  choice: 这就是我力所能及的了
  rationale: 直陈作者能力所能达到的限度；此译自然传达“对我而言可达到”的含义。
