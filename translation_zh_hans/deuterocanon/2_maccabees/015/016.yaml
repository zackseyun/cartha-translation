  yaml_path: translation/deuterocanon/2_maccabees/015/016.yaml
  text: Take the holy sword[a], a gift from God[b], by which you will shatter the adversaries.
translation:
  language: zh_hans
  text: “接过这把圣剑[a]——这是上帝所赐的礼物；你将用它粉碎敌对者[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“领受这把圣剑。”
    reason: lexical_alternative；Λάβε可译为“接过”或“领受”。“上帝所赐的礼物”说明这把剑的来源和性质。
  - marker: b
    text: “敌对者”也可译为“仇敌”或“敌人”。
    reason: lexical_alternative；ὑπεναντίους指敌对、对立的人，原文未明确说明其敌对的对象。
lexical_decisions:
- source_word: Λάβε
  choice: 接过
  rationale: 这是 λαμβάνω 的不定过去时命令式；在领受所赐之物的异象语境中，“接过”兼具命令的直接性和接受赠物之意。
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: 这把圣剑
  rationale: ῥομφαία指大型刀剑，但现代汉语用“剑”最自然；ἁγίαν译作“圣”，保留其属神、分别为圣的宗教语域。“这把”符合递交具体物件时的汉语表达。
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: 这是上帝所赐的礼物
  rationale: δῶρον与“圣剑”构成同位说明，παρά加属格表示来源。独立分句能清楚表达剑本身是来自上帝的礼物，避免误解为要求以某种态度接剑。
- source_word: δι' ἧς
  choice: 你将用它
  rationale: διά在此表示工具或手段，关系代词所指为剑；现代汉语以“用它”自然明确。
- source_word: θραύσεις
  choice: 击溃
  rationale: θραύω本义为打碎、击破；用于敌对者时，“击溃”既保留强烈的军事意味，又比直译“打碎人”自然。
- source_word: τοὺς ὑπεναντίους
  choice: 敌对你的人
  rationale: ὑπεναντίους指处于敌对或反对地位的人；此译保留关系性的“敌对”含义，不把它过度固定为某一类“敌人”。
theological_decisions:
- issue: ἁγίαν是否采用更偏礼仪或祭祀色彩的译词
  choice: 圣
  alternative: 神圣的
  rationale: “圣剑”简洁、庄重，并保留武器因与上帝相关而具有圣洁或分别为圣性质的表达；不额外限定其为礼仪器物。
- issue: δῶρον与圣剑之间的句法关系
  choice: 将“上帝所赐的礼物”作为对圣剑的同位说明
  alternative: 把剑“当作礼物”接过
  rationale: 希腊文δῶρον可作同位或谓语性说明；上下文最稳妥的表达是说明剑为来自上帝的礼物，同时脚注保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“接过”适合异象中递剑的直接话语；“上帝所赐”比生硬的“来自上帝”更符合汉语习惯。分号呈现礼物说明与未来应验之间的层次。
