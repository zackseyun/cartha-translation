translation:
  language: zh_hans
  text: 耶利米伸出右手，把一把金剑递给犹大，并在递剑时对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  choice: 伸出
  rationale: 该分词描写耶利米将手向前伸出的动作；“伸出”自然准确，也与“右手”搭配顺畅。
- source_word: τὴν δεξιὰν
  choice: 右手
  rationale: 希腊文直译为“右边的（肢体）”，语境明确指右手；现代汉语自然补出“手”，无需另加物主代词。
- source_word: παραδοῦναι
  choice: 交给
  rationale: 此处表示将剑递交并置于犹大手中；“交给”既保留转交含义，又符合现代汉语叙事表达。
- source_word: ῥομφαίαν χρυσῆν
  choice: 一把金剑
  rationale: ῥομφαία指大型刀剑类兵器，采用通用且清楚的“剑”；χρυσῆν译为“金”，不进一步断定是纯金制成还是金色、饰金。
- source_word: διδόντα
  choice: 交给他时
  rationale: 该分词表示说话与赠剑动作同时发生；“交给他时”自然呈现两者的时间关系，并明确受事者。
- source_word: προσφωνῆσαι
  choice: 对他说
  rationale: 该动词表示向某人发言或致辞；“对他说”清楚自然，并由后面的引语提示语保留较正式的叙事功能。
- source_word: τάδε
  choice: 以下的话
  rationale: τάδε用于引出紧接着的言语内容；“以下的话”自然预告下一节的引语。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 按中文圣经传统，此处人名译作“犹大”，指犹大·马加比。
- source_word: Ἰερεμίαν
  choice: 耶利米
  rationale: 采用该先知在现代中文圣经中的通行译名。
theological_decisions:
- issue: 耶利米授剑事件的异象性质
  choice: 本节按叙事直接陈述动作，不另加“在异象中”等解释语。
  alternative: 在本节明说这是异象中的行动。
  rationale: 异象背景已由上下文交代，而本节希腊文本身只叙述耶利米的动作；不在此加入原文没有的限定，以保留叙事呈现及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“伸出右手”“交给”“以下的话”兼顾原文结构与汉语自然度；分号用来清楚区分授剑动作和随后的发言。
