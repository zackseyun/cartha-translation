  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: zh_hans
  text: 他们脱离了危急情势[a]，欢喜地离去[b]时，认出身穿全副铠甲、已经倒在地上的尼加诺[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “危急情势”也可译作“紧急的需要”“必要”或“困境”；原文的表达带有从紧迫处境中得到解脱的意思。
    reason: lexical_alternative
  - marker: b
    text: “离去”也可译作“撤离”或“散去”；原词可表示离开、撤离或解散。
    reason: lexical_alternative
  - marker: c
    text: “倒在地上”也可译作“向前倒下”或“已经倒下”；原词可能带有向前倒下的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι
  choice: 摆脱了
  rationale: 该完成时被动分词本义为“被剥去”，与ἀπὸ τῆς χρείας连用时表示从某种迫切需要或困境中解脱；“摆脱了”既自然，又保留脱离重压的意味。
- source_word: χρείας
  choice: 迫切的困境
  rationale: χρεία可指需要、必要或紧迫情势；战事语境中的“迫切的困境”比抽象的“需要”更清楚，同时以脚注保留其他可能。
- source_word: ἀναλύοντες
  choice: 离去
  rationale: ἀναλύω在此表示离开、撤离；“离去”不擅自加入“返回”的方向，也不像“撤退”那样暗示败退。
- source_word: ἐπέγνωσαν
  choice: 认出
  rationale: ἐπιγινώσκω在此指辨认出倒地者就是尼加诺；“认出”准确而简洁。
- source_word: προπεπτωκότα
  choice: 扑倒在地
  rationale: προπίπτω的完成时分词表示已经向前或倒下；“扑倒在地”保留προ-可能具有的向前方向感，又符合汉语叙事。
- source_word: πανοπλίᾳ
  choice: 全副铠甲
  rationale: πανοπλία指全套武装或全副甲胄；译作“全副铠甲”比仅作“铠甲”更充分体现词义。
