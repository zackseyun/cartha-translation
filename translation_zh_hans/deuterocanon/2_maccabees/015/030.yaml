base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: zh_hans
  text: 于是，这位全身心为同胞冲锋在前、自青年时起一直保持着对同族人善意的勇士下令，把尼加诺尔的头和连肩的手臂[a]砍下来，带到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“手连同肩”，所指可能是连肩砍下的整条手臂。
    reason: 保留原文字面措辞，并说明中文正文采用“手臂”的依据。
lexical_decisions:
- source_word: προσέταξεν
  choice: 下令
  rationale: 准确表达不定过去时动词所表示的权威命令，简洁自然。
- source_word: ὁ καθʼ ὅλον σώματι καὶ ψυχῇ πρωταγωνιστὴς ὑπὲρ τῶν πολιτῶν
  choice: 这位全心全身为同胞冲锋在前的勇士
  rationale: πρωταγωνιστής指居首位、在前列奋战者；“冲锋在前的勇士”保留其战斗与带头意味。身体与灵魂的并列表达以“全心全身”呈现，既自然又保留整体投入的修辞。πολῖται在此指犹大所护卫的共同体成员，译作“同胞”较中文“公民”更符合叙事语境。
- source_word: ὁ τὴν τῆς ἡλικίας εὔνοιαν εἰς ὁμοεθνεῖς διαφυλάξας
  choice: 从年轻时起就始终善待本族人的
  rationale: 将τῆς ἡλικίας理解为年龄或青春时期，并用“从年轻时起”表达持续性；εὔνοια译为“善待”以自然传达善意与眷顾，διαφυλάξας的持守意味由“始终”体现。
- source_word: τὴν τοῦ Νικάνορος κεφαλήν
  choice: 尼加诺尔的头
  rationale: 直译对象与所属关系。
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: 连肩的手臂
  rationale: 原文直说“手连同肩”，实际所指应是包括肩部在内的整个上肢；正文采用自然且符合人体部位关系的表达，并以脚注保留字面形式。
- source_word: ἀποτεμόντας ... περιφέρειν εἰς Ἰερουσαλήμ
  choice: 砍下来，带到耶路撒冷
  rationale: 依附于“下令”的宾格分词和不定式共同表达命令内容；περιφέρειν在εἰς引导的目的地前表示携带前往，无须增译为“游街”或“到处展示”。
theological_decisions:
- issue: 两个ὁ引出的同位描述所指为何人
  choice: 明确指下令者犹大，但不在本节补出其姓名
  alternative: 将赞语后置，或视为叙述者较松散的插入赞语
  rationale: 希腊文两个带冠词的描述语在句法上同位修饰προσέταξεν的隐含主语。中文将其置于“下令”之前，可清楚维持所指关系，同时不添加本节未明说的姓名。
- issue: σώματι καὶ ψυχῇ的表达
  choice: 全心全身
  alternative: 身心全然；用整个身体和灵魂
  rationale: 保留身体与内在生命两方面的并列和全然投入之意，同时避免借此确立后期哲学或宗派性的人论定义。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事文体。将较长的希腊同位语前置，以避免中文读者误判赞语所指；暴力动作照实表达，不作淡化，也不增添公开示众等原文未明确说明的细节。
