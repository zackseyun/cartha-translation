  terminology: “尼加诺尔”可保留；“勇士”适合战事语境。“连肩的手臂”及脚注妥善处理χεῖρα与ὦμος的字面张力。为保留ὁμοεθνεῖς的同族／同一民族色彩，正文采用“同族人”。
