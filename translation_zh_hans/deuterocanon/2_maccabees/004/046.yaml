  yaml_path: translation/deuterocanon/2_maccabees/004/046.yaml
  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
translation:
  language: zh_hans
  text: 可是，米尼劳斯已处于不利境地[a]，便答应给多利米尼的儿子托勒密一大笔钱，好让他劝服王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已处于不利境地”：原文的完成时被动分词词义较难确定。它可理解为米尼劳斯已经陷于不利或败势；也有人理解为他已被争取或笼络。
    reason: 说明 λελιμμένος 的词义争议，保留原文未明确说明的具体方式和处境。
lexical_decisions:
- source_word: λελιμμένος
  choice: 眼看就要败诉
  rationale: 这个完成时被动分词较为罕见，词义也有困难；结合上文米尼劳斯正在受审、控方占据优势的语境，宜表达他已经陷入败局、即将败诉，而不是说他“已被收买”。这样也与本句随后由他许诺金钱、企图扭转裁决的行动相衔接。
- source_word: ἐπηγγείλατο
  choice: 答应给
  rationale: 该中间语态动词在此表示许诺或承诺给予；与“钱”连用时，译为“答应给”自然明确。
- source_word: χρήματα ἱκανά
  choice: 一大笔钱
  rationale: χρήματα 指钱财，ἱκανά 在此表示数额相当可观；“一大笔钱”准确而符合现代汉语习惯。
- source_word: τῷ Πτολεμαίῳ Δορυμένους
  choice: 给多利米尼的儿子托勒密
  rationale: Δορυμένους 是属格，最自然地作父名称谓理解，用来说明这位托勒密是谁。与 ἐπηγγείλατο 的间接受词关系则以“给”表达。
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: 请他去说服王
  rationale: πρὸς τό 加不定式表示目的。原文未明说不定式的逻辑主语，但上下文最自然地指托勒密；“请他去”在汉语中清楚呈现这层关系，同时保留“说服”而不擅自补出具体诉求。
