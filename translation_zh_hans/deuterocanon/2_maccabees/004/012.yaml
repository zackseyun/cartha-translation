base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: zh_hans
  text: 因为他欣然就在卫城脚下设立了一所希腊式体育馆，又强使我们当中最杰出的青年戴上希腊宽边帽[a]，带领着他们不断前行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希腊宽边帽”音译为“佩塔索斯帽”，是希腊人所戴的一种宽边帽；在这里，它是希腊化身份的外在标志。
    reason: 说明历史文化专名及其在本节中的象征作用。
lexical_decisions:
- source_word: ἡδέως
  choice: 欣然
  rationale: 表达主动而乐意的态度，同时不过度强化情绪。
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: 在城堡正下方
  rationale: 保留ὑπό的空间意义，并以“正”体现αὐτήν的强调作用。
- source_word: γυμνάσιον
  choice: 希腊式体育馆
  rationale: 这里指希腊化社会中兼具体育训练与文化教育功能的制度性场所；加“希腊式”可避免现代读者仅理解为普通健身房。
- source_word: καθίδρυσεν
  choice: 设立
  rationale: 适合机构与场所的创设，语言自然庄重。
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: 我们当中最杰出的青年
  rationale: κρατίστους表示最优秀、最显贵者；“青年”依据体育馆及佩塔索斯帽所处的青年训练语境，使现代中文读者能够理解所指群体。
- source_word: ὑποτάσσων
  choice: 使……受制于
  rationale: 保留该词所含的置于权下、使之顺服的力度，不把文化同化弱化成单纯穿戴。
- source_word: ὑπὸ πέτασον
  choice: 于希腊宽边帽之下
  rationale: 保留原文具体而鲜明的帽子意象；“希腊”点明其文化标志作用，“宽边帽”说明佩塔索斯帽的形制。
- source_word: ἦγεν
  choice: 不断牵引着他们
  rationale: 体现未完成时的持续过程，也保留原文没有明说牵引目的地的开放性。
theological_decisions:
- issue: ὑπὸ πέτασον所暗示的文化同化
  choice: 保留“希腊宽边帽”这一具体标志，不直接译成“希腊化”或“希腊生活方式”
  alternative: 把他们引入希腊风俗之中
  rationale: 原文借具体服饰呈现身份与文化归属；直译其意象可让上下文自行显出同化意味，避免把暗示改成明说。
- issue: ἦγεν的目标未明说
  choice: 译作“不停牵引着他们”，不补出目的地
  alternative: 把他们引向希腊化生活
  rationale: 希腊文只说明持续带领或牵引，并未明言方向；保留这一张力比解释性补足更忠实。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的书面汉语。“希腊式体育馆”避免被误解为现代健身设施；“受制于……之下”有意保留原文关于文化支配与身份归属的强烈表达。
