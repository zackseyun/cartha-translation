  source_fidelity: “城堡正下方”把空间关系过度具体化为垂直的“正下方”；ὑπʼ αὐτὴν ἀκρόπολιν更自然地指紧邻卫城下方/脚下的位置。后半句将ὑπὸ πέτασον直译为“受制于……帽之下”，在中文中既不自然，也模糊了πέτασος作为实际服饰标志的意象。译文宜明确为强使青年戴上该帽，同时以“强使”传达ὑποτάσσων的强制、置于支配下的意味，并保留ἦγεν的持续性和未明说的方向。
  naturalness: “受制于希腊宽边帽之下”不合现代汉语搭配；“不断牵引着他们”也较生硬，且“牵引”容易使人联想到物理拖曳。“带领着他们不断前行”较自然，并保留未完成时的进行意味。
  terminology: “卫城”是ἀκρόπολις在此类古代城市语境中的恰当术语；“希腊式体育馆”可保留，以表明γυμνάσιον是希腊化制度性场所。“佩塔索斯帽”作为脚注中的音译说明可保留。
  issues:
  - severity: medium
    issue: “城堡正下方”过度限定空间关系。
    rationale: 原文的ὑπό表达在卫城下方、脚下或紧邻其下的空间位置；“正下方”引入了原文未要求的垂直精确性。
  - severity: high
    issue: “使……受制于希腊宽边帽之下”误导且不自然。
    rationale: πέτασος是具体的希腊宽边帽；该短语在上下文中以服饰标志表现希腊化。中文宜明确帽子的穿戴，同时以“强使”体现ὑποτάσσων的支配或强制色彩。
  - severity: medium
    issue: “不断牵引着他们”不够自然。
    rationale: ἦγεν为持续性的“带领”，并非特别指物理牵引；改为“带领着他们不断前行”较符合现代庄重书面语，且不补足目的地。
