translation_notes:
  register: 采用现代、庄重而通顺的汉语。以“恩人—守护者—热心维护律法的人”保留原文三项褒义称号的排比，并以“竟敢”突出指控的无礼。“律法”按犹太历史语境处理；“政务”保留 τῶν πραγμάτων 的公共政治含义及一定范围上的含混。
