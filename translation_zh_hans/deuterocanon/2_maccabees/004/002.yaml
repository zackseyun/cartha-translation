  text: and he dared to call the benefactor of the city[a], the guardian of his fellow countrymen, and the zealot for the laws, a conspirator against the state.
translation:
  language: zh_hans
  text: 他竟敢把这座城的恩人、同胞的守护者、热心维护律法的人，说成是图谋危害公共事务的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋危害公共事务的人”也可译作“阴谋破坏公共事务的人”或“危害国家的人”。希腊语原文带有政治和公共事务方面的意味，并非仅指个人敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐεργέτην
  choice: 恩人
  rationale: 在城邦语境中指施惠于公众的人；“城里的恩人”自然保留其公共、褒扬意味。
- source_word: κηδεμόνα
  choice: 守护者
  rationale: 表达照料和保护他人的含义，并与前后几个褒义称号形成庄重的排比。
- source_word: τῶν ὁμοεθνῶν
  choice: 同胞的
  rationale: 指同族、同一民族的人；“同胞”在现代汉语中简洁自然，也保留民族共同体意味。
- source_word: ζηλωτὴν τῶν νόμων
  choice: 热心维护律法的人
  rationale: ζηλωτής表示满怀热忱者；结合宾语“律法”，译作“热心维护”比可能带有特定群体含义的“奋锐党人”更准确，也未把复数 νόμων 消解为抽象原则。
- source_word: ἐπίβουλον τῶν πραγμάτων
  choice: 图谋危害政务的人
  rationale: ἐπίβουλος含暗中谋划不利之事的意思，而 πράγματα在此具有公共、政治事务的语力；此译保留“事务”层面，避免过度具体化为现代意义的“国家”。
- source_word: ἐτόλμα λέγειν
  choice: 竟敢……说成
  rationale: 表达说话者行为的放肆和大胆；“把……说成……”自然呈现给某人加上负面称谓的句法。
