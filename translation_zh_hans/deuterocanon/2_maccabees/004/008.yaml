base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: zh_hans
  text: 敖尼雅的兄弟雅松以不正当手段谋取了大祭司的职位；他借陈情[a]向王许诺白银三百六十他连得[b]，以及另一项收入八十他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈情”也可译作“觐见”或“面见”；这个希腊词既可指正式请愿，也可指亲自接近或面见君王。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在三百以外再加六十”，即合计白银三百六十他连得。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: 用不正当手段谋取了
  rationale: 该动词含有作假、败坏或以欺诈手段行事的贬义；结合“大祭司的职位”这一宾语，此处既要表达雅松取得职位的行动，也要保留其不正当性质。
- source_word: ἀρχιερωσύνην
  choice: 大祭司的职位
  rationale: 指大祭司的职分、地位或职权，不只是一般的祭司活动；此译在现代汉语中清楚自然。
- source_word: ἐπαγγειλάμενος
  choice: 许诺
  rationale: 分词说明雅松采取手段的方式，即向王承诺支付款项；不额外引入希腊文没有明说的技术性金融含义。
- source_word: διʼ ἐντεύξεως
  choice: 通过陈情
  rationale: ἔντευξις可指向统治者正式陈情、请愿，也可指获得面见；正文采用符合政治语境且自然的“陈情”，另一可能收入脚注。
- source_word: ἀργυρίου
  choice: 银子
  rationale: 属格说明支付物为银；“他连得银子”符合汉语计量表达。
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: 除了三百他连得银子以外，再加六十他连得
  rationale: 保留希腊文“在三百之外再加六十”的结构，同时清楚表达合计为三百六十他连得。
- source_word: προσόδου τινὸς ἄλλης
  choice: 从另一项收入中另付
  rationale: πρόσοδος指收入或收益来源；“另一项收入”保留τινός所带的不特定意味，并与前项款额区分。
- source_word: τάλαντα ὀγδοήκοντα
  choice: 八十他连得
  rationale: 直接保留古代重量及货币单位，不擅自换算成现代币值。
theological_decisions:
- issue: 雅松对大祭司职位所采取行动的道德性质
  choice: 用不正当手段谋取了大祭司的职位
  alternative: 败坏了大祭司的职分；暗中夺取了大祭司职位
  rationale: 原动词带有欺诈、掺假或败坏的负面色彩。译文显示这并非中性的合法继任，同时避免断言经文本身未明确交代的具体程序。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“雅松”“敖尼雅”按常见次经人名音译；“他连得”保留古代单位。正文保留原文款额的递加次序，并用脚注说明总数。
