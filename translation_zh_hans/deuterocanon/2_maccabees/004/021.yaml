base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: zh_hans
  text: 米涅斯透的儿子亚波罗尼被派往埃及，参加斐洛墨托王的登基庆典。安条克得知自己已与关乎自己的事务脱节[a]，便为自身的安全筹谋。因此，他到了约帕以后，又前往耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己已与自己的事务疏离。”希腊原文十分紧缩；这句话也可能泛指安条克在关乎自己的政治事务中处于不利地位，或被排除在外。
    reason: 原文代词指向及ἀλλότριον与τῶν αὐτοῦ πραγμάτων之间的关系存在真实的词汇和句法歧义。
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: 被派往
  rationale: 不定过去时被动分词构成属格独立结构，交代先于主句发生的背景事件；现代汉语无需机械标明过去完成时。
- source_word: διὰ τὰ προτοκλήρια
  choice: 参加……登基庆典
  rationale: 罕见复数名词在此指君王即位相关的庆祝活动；采用清楚自然、符合历史语境的表达。
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: 斐洛墨托王
  rationale: Φιλομήτωρ在这里是埃及君王的称号或名号，音译比直译为“爱母者”更能明确历史所指。
- source_word: μεταλαβὼν
  choice: 得知
  rationale: 该分词在语境中表示安条克获悉或意识到某种政治处境；“得知”自然保留认知含义。
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: 自己在本国事务中已遭排斥
  rationale: 原文结构紧缩且语义不完全明确；ἀλλότριον表达疏离、被排除或不再有分的状态，γεγονότων表示这一状态已经形成。“本国事务”按政治语境表达τῶν αὐτοῦ πραγμάτων，同时以脚注保留较直译的可能。
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: 便为自身的安全筹谋
  rationale: ἐφρόντιζεν表示主动顾念、谋划，ἀσφάλεια在此兼有个人安全与政治安稳之意；“筹谋”保留其审慎行动的力度。
- source_word: παραγενόμενος
  choice: 到了……以后
  rationale: 不定过去时分词表示先于主句动词的行动，清楚交代先抵达约帕的时序。
- source_word: κατήντησεν
  choice: 又前往
  rationale: 表示随后到达耶路撒冷；因前文已说“到了约帕”，译作“又前往”可自然呈现继续行程并避免重复。
theological_decisions:
- issue: 斐洛墨托（Φιλομήτωρ）的历史称号
  choice: 作为君王的专名式称号音译为“斐洛墨托王”
  alternative: 直译为“爱母王”
  rationale: 此词在本节用于识别特定的埃及君王，并非要强调一种神学或伦理属性；音译能避免遮蔽历史所指。
- issue: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων的指向
  choice: 理解为安条克察觉自己在与本国有关的政务中已遭排斥
  alternative: 较形式化地译为“自己已与自己的事务疏离”，或理解为有关之事不符合他的利益
  rationale: αὐτόν最自然地回指主句主体安条克，γεγονότων与ἀλλότριον构成已经形成的疏离状态；但原文高度紧缩，故正文给出政治语境下可懂的译法，并用脚注保留歧义，不把它转化为特定教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“米涅斯透、亚波罗尼、斐洛墨托、安条克、约帕”按常见圣经人地名音译风格处理。正文避免生硬照搬希腊语压缩结构，并以脚注保存其真实歧义。
