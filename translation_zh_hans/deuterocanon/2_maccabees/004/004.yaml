base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/004.yaml
  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: zh_hans
  text: 奥尼亚看出这场争斗何等严重[a]，也看出米涅斯透斯的儿子阿波罗尼乌斯——这位柯里腓尼基和叙利亚[b]的总督[c]——正在助长西门的恶行，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争斗”也可译作“争执”或“竞争性的纷争”；所译的希腊词也可指好争胜的态度。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文本直译为“柯里腓尼基和叙利亚”；此处保留该词序，而没有按较常见的地理称谓改作“柯里叙利亚和腓尼基”。
    reason: textual_variant
  - marker: c
    text: “总督”所译的希腊词也可指“将军”或“统帅”；这里因其掌管一个地区而译作“总督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶν
  choice: 看出……又见
  rationale: 该现在分词表示奥尼亚察觉到两方面的情势，并为下一节所述行动提供背景；译文用两个相呼应的动词，使现代汉语自然清楚。
- source_word: τὸ χαλεπὸν
  choice: 十分严重
  rationale: 带冠词的中性形容词在此名词化，表示争斗的严重、棘手程度；“十分严重”保留其分量，同时避免生硬的名词结构。
- source_word: φιλονεικίας
  choice: 争斗
  rationale: 该词可指好争胜所引起的争执、倾轧或对抗；“争斗”适合此处政治与人际冲突的语境，又不把它限定为单次争吵。
- source_word: Ἀπολλώνιον Μενεσθέως
  choice: 米涅斯透斯的儿子阿波罗尼乌斯
  rationale: 属格 Μενεσθέως 作父称，译明为“……的儿子”，便于普通读者理解人物身份。
- source_word: στρατηγόν
  choice: 总督
  rationale: στρατηγός 可指将军、统帅，也可指掌管地区的长官；此处后接辖区名称，行政性的“总督”最切合上下文。
- source_word: συναύξοντα
  choice: 正在助长
  rationale: 该分词表示阿波罗尼乌斯促使西门的恶行进一步增长；“助长”准确表达其促成和加剧的意味。
- source_word: κακίαν
  choice: 恶行
  rationale: κακία 可指邪恶、恶意或恶劣行为；上下文涉及西门实际进行的败坏活动，“恶行”既保留道德评价，也自然指向其行为。
