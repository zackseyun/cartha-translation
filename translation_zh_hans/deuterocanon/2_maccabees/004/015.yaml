  text: and placing no value at all on the honors of their fathers[b][a], but considering the Greek distinctions the finest.
translation:
  language: zh_hans
  text: 他们丝毫不看重祖传的尊荣[a]，反而把希腊式的荣耀[b]看作最美好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先的尊荣”或“先祖的荣誉”。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”也可译作“荣誉”或“声望”；这里指希腊文化中备受推崇、能带来社会声望的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας
  choice: 祖传的
  rationale: 该词意为“父辈的、祖传的”。“祖传的”在现代汉语中自然地表达从先祖承受而来的传统和身份内涵。
- source_word: τιμὰς
  choice: 尊荣
  rationale: 此处指与祖传习俗和身份相连、受到珍视的荣誉或尊贵地位；“尊荣”既保留价值意味，也不把它过度限定为法律特权。
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: 丝毫不看重
  rationale: 这一习语表示把某事视为毫无价值。“丝毫不看重”自然、明确地传达彻底轻忽的语气，却不额外加入原文没有的“鄙视”。
- source_word: Ἑλληνικὰς
  choice: 希腊式的
  rationale: 这里着眼于希腊文化的风尚和身份标志，而非单指希腊族人；“希腊式的”能准确体现这种文化属性。
- source_word: δόξας
  choice: 荣耀
  rationale: δόξα可指荣耀、荣誉或声望。复数在此语境中指希腊文化中受人推崇的荣耀与声望标志；正文采用较贴近原词的“荣耀”，并以脚注说明语境。
- source_word: καλλίστας
  choice: 最美好的
  rationale: 这是καλός的最高级，既可表示“最美”也可表示“最好、最佳”。“最美好的”保留其审美和价值判断之间的张力。
- source_word: ἡγούμενοι
  choice: 看作
  rationale: 该分词表达判断或评价；“看作”简洁自然，并与“最美好的”搭配顺畅。
theological_decisions:
- issue: 犹太祖传传统与希腊文化声望之间带有价值色彩的对比
  choice: 以“丝毫不看重……反而把……看作最美好的”描述原文的鲜明对比，不加入更强烈的贬斥用语。
  alternative: 译作“鄙弃祖先的尊荣，却把希腊人的荣耀奉为至上”。
  rationale: 希腊文确实呈现彻底否定前者、极力推崇后者的对比，但没有明用“鄙弃”或“奉为至上”之类更强烈的词。所选译法保留批判张力，同时避免超出原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“丝毫不看重”传达原文习语的彻底否定；“反而”清楚显出两组并列分词之间的强烈转折。正文保留“荣耀”与“最美好的”的语义张力，脚注补充其社会文化声望含义。
