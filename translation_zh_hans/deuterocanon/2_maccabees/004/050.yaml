base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: zh_hans
  text: 可是，米乃劳因掌权者的贪婪[a]，仍旧留在职位上；他在邪恶上变本加厉，成了一个大阴谋家，图谋反对同胞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由于统治者们的贪欲。”也可较直译为：“因那些掌权者的贪婪。”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: 因掌权者的贪婪
  rationale: διά接宾格在此表示原因；πλεονεξία指贪婪、贪得无厌，κρατοῦντες指当时掌握权势的人。“掌权者”保留政治语境，也符合现代汉语表达。
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: 仍旧留在职位上
  rationale: ἀρχή在此指权位或职分，不必扩大为全面的政治统治。“留在职位上”准确表达米乃劳得以继续任职。
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: 在邪恶中越陷越深
  rationale: 分词表达邪恶持续滋长、加深的过程；采用自然汉语动态表达，同时保留其道德评价。
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: 成了一个极力图谋加害同胞的人
  rationale: ἐπίβουλος指蓄意图谋反对或加害他人的人；τῶν πολιτῶν表示受其图谋侵害的是同一政治共同体中的公民。“同胞”自然传达这种关系，“极力”体现μέγας的加强语气，避免“大阴谋家”在现代汉语中可能产生的不自然或赞许色彩。
theological_decisions: []
