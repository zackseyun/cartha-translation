base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/049.yaml
  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
translation:
  language: zh_hans
  text: 因此，那些先前就城、各地民众和圣器一事陈说的人，很快便遭受了不公正的惩罚。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先前……陈说的人”译自一个分词，按字面可指“先前说过话的人”。结合上下文，也可能带有陈情、申诉或控告的意味；原文并未明确说明他们是在辩护还是控告。
    reason: lexical_alternative
  - marker: b
    text: “各地民众”译自复数词，也可能指各社区、各区或不同的公民群体；确切所指不完全确定。
    reason: lexical_alternative
  - marker: c
    text: “惩罚”所译的希腊词也可指损害或损失；此处语境显示其带有不公正遭遇或惩处的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχέως οὖν
  choice: 因此……很快便
  rationale: οὖν承接上文，表示结果或推论；ταχέως强调事情迅速发生。这样的语序既保留逻辑关系，也符合现代汉语表达。
- source_word: τὴν ἄδικον ζημίαν ὑπέσχον
  choice: 蒙受了不公正的刑罚
  rationale: ὑπέσχον在这里指承受、遭受；ζημία既可指损失，也可指惩罚或刑罚。结合上文的审判和定罪情境，译作“刑罚”较为贴切，同时由脚注保留“损害／损失”的词义范围。ἄδικον表明这种刑罚不公、不义。
- source_word: οἱ ... προηγορήσαντες
  choice: 申辩的人
  rationale: 该分词在本语境中不是单纯“预先说话”，而是指在案件中出面陈说、为有关对象辩护或代言的人。“申辩”保留司法场景中的公开陈述意味，又不把他们的具体身份过度限定为律师。
- source_word: περὶ πόλεως καὶ δήμων καὶ τῶν ἱερῶν σκευῶν
  choice: 为城、各地民众和圣器
  rationale: περί在此随“申辩”理解为所维护、所关涉的对象。πόλις译作“城”；δήμων为复数，可指民众、地方群体或行政区域，译作“各地民众”兼顾复数和群体含义；ἱερὰ σκεύη直译为“圣器”，语境中即圣殿器皿，但正文不作过度具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“圣器”简洁保留礼仪器物的神圣属性；标点和“便”使句子自然流畅。译文依据希腊文及上下文校正了英文咨询层可能造成的误读：这些人是在为城、民众和圣器申辩，并非预先发表与它们有关的言论。
