base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/010.yaml
  text: And when the king had given his approval, and he had gained control of the office, he immediately shifted his countrymen over to the Greek way of life.
translation:
  language: zh_hans
  text: 王批准后，他取得了这个职位，随即使自己的同胞转而接受希腊式的生活方式[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“希腊式的特征”或“希腊式的印记”；这里指采用希腊文化的生活形态和风俗。
    reason: 保留 χαρακτήρ 的字面意象及其在本句中的文化含义。
lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: 批准
  rationale: 该动词在属格独立结构中表示君王先行表示同意；“批准”自然传达这里带有官方性质的许可。
- source_word: ἀρχῆς
  choice: 这个职位
  rationale: 结合 κρατήσας，指他所取得并掌握的统治性职位，而非泛指抽象的权力；“这个职位”也自然承接上下文。
- source_word: κρατήσας
  choice: 取得
  rationale: 此处表示获得并实际掌握该职位；“取得”简洁地保留了进入职位、获得控制权的意思。
- source_word: εὐθέως
  choice: 立刻
  rationale: 清楚表达他取得职位后随即采取行动。
- source_word: ὁμοφύλους
  choice: 自己的同胞
  rationale: 原词指同族、同一民族的人；“自己的同胞”保留民族共同体含义，又不在正文中加入原词未明说的具体称谓。
- source_word: μετέστησε
  choice: 使……转而接受
  rationale: 使役性动词表示令他人改变原有取向；“使……转而接受”在现代汉语中自然，并保留主动推动转变的力度。
- source_word: Ἑλληνικὸν χαρακτῆρα
  choice: 希腊式的生活模式
  rationale: χαρακτήρ 本可指特征、印记或模式；在此历史语境中指希腊文化塑造的生活形态。“生活模式”避免被误解为心理性格，同时以脚注保留字面意象。
theological_decisions:
- issue: 如何表达带有文化和历史含义的 Ἑλληνικὸν χαρακτῆρα
  choice: 希腊式的生活模式
  alternative: 希腊式的特征；希腊人的风俗
  rationale: 经文描述文化取向的转变。“生活模式”传达希腊化所涉及的生活和习俗，又不把含义缩窄为若干具体风俗或扩展为神学判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“王一批准……就……”呈现希腊文属格独立结构所表达的先后关系；正文保持紧凑，并以脚注说明文化性短语的字面含义。
