base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/030.yaml
  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: zh_hans
  text: 这些事正在进行时，大数人和马鲁斯人[a]起来叛乱，因为他们被当作礼物赐给了王的妾安提奥基丝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“大数人和马鲁斯人”，即两城的居民称谓。
    reason: 说明原文使用城市居民的复数族称，并保留其表述。
lexical_decisions:
- source_word: συνεστηκότων
  choice: 这些事正在进行时
  rationale: 该属格独立结构承接前文，为下一个事件提供时间背景；如此译法自然地表达“当这些事进行之际”，不强调字面的站立或聚集。
- source_word: συνέβη
  choice: 发动了（置于自然汉语叙述中）
  rationale: 原词表示“事情发生、出现”。汉语无需另加“事情发生了，就是……”，直接叙述“发动了叛乱”更自然，同时保留事件随之发生的叙事作用。
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: 大数和马鲁斯的居民
  rationale: 原文是两个城市居民的复数族称。用“……的居民”比生造汉语居民称谓清楚，也不把他们误当作城市本身。
- source_word: στασιάζειν
  choice: 发动了叛乱
  rationale: 此动词可指结党纷争、动乱或反叛；本处因反对王室处置而起，用“发动了叛乱”准确而简洁。
- source_word: διὰ τὸ
  choice: 因为
  rationale: 该结构引出叛乱的原因，现代汉语用“因为”最直接自然。
- source_word: Ἀντιοχίδι
  choice: 安提奥基丝
  rationale: 按希腊语女性专名 Antiochis 音译，避免与其他同根男性名字混淆。
- source_word: παλλακῇ
  choice: 妾
  rationale: 该词指地位次于正妻的女性伴侣；“妾”简明且符合古代宫廷语境，“情妇”则容易带入现代含义。
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: 被当作礼物赐给
  rationale: 保留原文被动态和作为赠礼转赐的含义，也保留“他们”究竟侧重居民、城市或其权益的语义张力，不擅自补入税收或管辖权。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王的妾”保持历史语境和原词的社会身份含义；句法尽量贴近希腊文，同时避免生硬的希腊式叙述结构。
