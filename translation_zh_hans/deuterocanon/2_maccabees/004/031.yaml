  text: So the king came quickly to settle the affairs, leaving Andronicus, one of those holding high office, as his successor.
translation:
  language: zh_hans
  text: 于是，王迅速赶来平息事态，留下安德洛尼古——一位身居高位的人——代替他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θᾶττον
  choice: 很快
  rationale: 表达比较副词在语境中的迅速之意；汉语无需生硬译出明确的比较对象。
- source_word: καταστεῖλαι τὰ πράγματα
  choice: 平息事态
  rationale: καταστέλλω在此指使骚乱或局势恢复平静；τὰ πράγματα泛指当时发生的事态。
- source_word: καταλείπων
  choice: 留下
  rationale: 保留分词所表达的伴随行动，即王离开时把安德洛尼古留下。
- source_word: τὸν διαδεχόμενον
  choice: 接替自己
  rationale: 该分词含继任、代行其位之意；补出“自己”使现代汉语指向清楚，同时不额外规定其职权范围。
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: 身居高位的人之一
  rationale: 准确传达部分属格结构及ἀξίωμα所指的显要地位或高级官职，避免过度具体化为某一种官衔。
