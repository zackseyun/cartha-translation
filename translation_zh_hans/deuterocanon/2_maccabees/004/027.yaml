base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: zh_hans
  text: 然而，默尼劳仍保有这个职位[a]，对于他许诺给王的款项却没有作任何安排。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，指大祭司的职位。
    reason: 为普通读者明确“职位”的具体所指，同时不把解释直接并入正文。
lexical_decisions:
- source_word: ἀρχῆς
  choice: 职位
  rationale: 本处指默尼劳此前取得并继续占据的职务，语境具体指大祭司职位；译作“职位”既清楚，又不把原文泛化为抽象的权柄或统治。
- source_word: ἐκράτει
  choice: 仍把持着
  rationale: 未完成时表达持续占有或控制；“仍把持着”兼顾延续性，并自然传达上下文中带有负面色彩的掌控意味。
- source_word: ἐπηγγελμένων
  choice: 答应
  rationale: 该分词指他先前向王承诺的款项；“答应给王”是自然的现代汉语，同时保留承诺而尚未履行的含义。
- source_word: χρημάτων
  choice: 款项
  rationale: 这里具体指应交给王的一笔钱；“款项”比笼统的“钱财”更符合财政支付语境。
- source_word: οὐδὲν εὐτάκτει
  choice: 毫无安排
  rationale: εὐτακτέω的基本意象是安排妥当、使之有序；结合款项，意指他完全没有为履行付款作出安排。译作“毫无安排”保留原文措辞的宽度，不直接断定其含义仅为“分文未付”。
