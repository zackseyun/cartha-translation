base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: zh_hans
  text: 米尼劳以为找到了一个有利的时机，便侵吞了圣殿的一些金制物品[a]，把它们当作礼物送给安多尼古；至于另一些，他已经在泰尔和周围的城里卖掉了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“几件金器”。希腊语泛指圣殿所属的金制器物，并未明确限定其具体种类。
    reason: 保留χρυσώματά τινα在泛指金制物品与较具体的金器之间的词义幅度。
  - marker: b
    text: 也可译作“卖到泰尔和周围的城里去了”。希腊语介词带有方向性；但在出售的语境中，这里所指的是另一些物品已经在泰尔和周围的城里售出。
    reason: 说明εἰς可按目的地表达，但正文以自然汉语清楚呈现出售地点和已完成的动作。
lexical_decisions:
- source_word: νομίσας
  choice: 以为
  rationale: 表达不定过去时分词所引出的主观判断，既自然，也不把他的判断说成客观事实。
- source_word: καιρὸν εὐφυῆ
  choice: 一个有利的时机
  rationale: 兼顾该短语中时机合宜和形势有利两层含义。
- source_word: χρυσώματά τινα
  choice: 一些金制物品
  rationale: χρύσωμα泛指金制器物；译作“金制物品”避免无根据地限定为礼仪用的器皿。
- source_word: τῶν τοῦ ἱεροῦ
  choice: 圣殿的
  rationale: 属格表明这些物品属于圣殿；“圣殿”符合犹太圣所的叙事语境。
- source_word: νοσφισάμενος
  choice: 侵吞了
  rationale: 该动词表示把不属于自己的财物据为己有。“侵吞”保留其欺诈性和严重性，又比现代法律术语“挪用公款”更适合圣殿财物的语境。
- source_word: ἐχαρίσατο
  choice: 当作礼物送给
  rationale: 保留χαρίζομαι在此处赠与、送人情的意味，而不额外断定其具体动机。
- source_word: ἕτερα
  choice: 另一些物品
  rationale: 清楚回指前面的圣殿金制物品，避免汉语中的指代含混。
- source_word: ἐτύγχανεν πεπρακὼς
  choice: 原来已经卖……去了
  rationale: 用“原来已经”表现完成状态及τυγχάνω所带的附带说明意味，不采用可能过度强调成功谋划的“设法卖掉”。
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: 卖到泰尔和周围的城里去了
  rationale: 顺着εἰς的方向性直译为“卖到”，同时使用自然的现代汉语表达地点范围。
theological_decisions:
- issue: 米尼劳侵犯圣殿财物的性质
  choice: 将νοσφισάμενος译为“侵吞”
  alternative: “私自挪用”或“偷走”
  rationale: “侵吞”准确表达将受托或不属于自己的财物据为己有，也保留经文对亵渎性滥用圣殿财物的谴责，但不引入后来的教法或宗派术语。
- issue: 赠给安多尼古的行为是否明确包含笼络动机
  choice: 译为“当作礼物送给”，只明说赠与性质
  alternative: 译为“送给安多尼古以讨好他”
  rationale: ἐχαρίσατο可含施惠、送人情之意，但本节没有明说其心理目的，因此不在正文中补出“讨好”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名和地名分别译作“米尼劳”“安多尼古”“泰尔”。分号呈现两个相连但有区分的处置圣殿财物的行为；不使用古雅的“遂”“乃”，也不加入原文未明说的政治或神学动机。
