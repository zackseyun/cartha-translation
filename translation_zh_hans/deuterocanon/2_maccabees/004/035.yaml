  text: 因此，不但犹太人[a]，而且其他民族中也有许多人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹太地人”。此处因与“其他民族”相对，更可能是广义地指犹太民族。
    reason: 保留 Ἰουδαῖοι 在民族与地域指称之间的词义可能性，同时说明语境倾向。
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: 因此
  rationale: 这是承接上文、引出结果的因果连接语；“因此”简洁自然，也准确表达原文“由于这个缘故”的意思。
- source_word: οὐ μόνον ... δὲ καὶ
  choice: 不但……连……也
  rationale: 保留原文递进关联结构；在此句中用“连……也”能自然体现范围从犹太人扩展到其他民族。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 此处与“其他民族”相对，主要指犹太民族群体，而不只是犹太地区的居民。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 准确表达数量众多，并与后接的属格短语组合成自然的现代汉语。
- source_word: τῶν ἄλλων ἐθνῶν
  choice: 其他民族中
  rationale: 原文指犹太人以外的各民族；“其他民族中”既保留群体范围，也避免使用可能带有较强后期宗教术语色彩的“外邦人”。
theological_decisions:
- issue: Ἰουδαῖοι 的群体所指
  choice: 犹太人
  alternative: 犹太地人
  rationale: 它与“其他民族”形成对照，表明此处着重的是民族群体身份，而非单纯的地域归属。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原始希腊语片段在本节中尚未成句，因此译文保留句末逗号，以表明内容接续下文；不据其他文本擅自补足缺失部分。
