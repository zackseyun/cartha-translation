base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/047.yaml
  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
translation:
  language: zh_hans
  text: 于是，托勒密把王带到一处柱廊里，假装让他舒缓一下[a]，便使王改变了主意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可理解为“让他凉快一下”或“让他恢复精神”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“改变了王”；这里按语境指使王改变主意或立场。
    reason: source_clarity
lexical_decisions:
- source_word: ὅθεν
  choice: 于是
  rationale: 这里承接上文，表达由前事引出的后续行动；“于是”符合现代汉语叙事习惯，也不强加空间含义。
- source_word: ἀπολαβών
  choice: 把王带到
  rationale: 该分词有“带到一旁、带离原处”之意，宾语虽未在分词旁明说，但由后文的“王”可以明确补出；与 εἴς τι περίστυλον 合译为“把王带到一处柱廊”。
- source_word: εἴς τι περίστυλον
  choice: 到一处柱廊
  rationale: περίστυλον 指有柱子的廊道或柱廊区域；“柱廊”简洁自然，并保留建筑意象。τι 表示不特指的一处。
- source_word: ὡς ἀναψύχοντα
  choice: 装作让他透透气
  rationale: ὡς 表明表面上的理由或托词；ἀναψύχω 可指凉快、舒缓、恢复精神。分词为宾格，最自然地与“王”呼应，即看起来是让王舒缓一下。“透透气”贴合移至柱廊的场景，同时保留舒缓、恢复精神的语义范围。
- source_word: μετέθηκεν τὸν βασιλέα
  choice: 使王改变了主意
  rationale: μετατίθημι 基本义为“改变、转移”；以“王”为宾语，在此语境中指使王改变立场或决定。汉语用“改变了主意”自然表达这一含义，而不是误解为再次移动王的位置。
- source_word: ὁ Πτολεμαῖος
  choice: 托勒密
  rationale: 采用该人名在现代简体中文中的通行译名。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“透透气”较口语，但在此处能清楚传达移到柱廊以求舒缓的表面理由；整体句式保持叙事简洁。译文依据希腊语句法，将“王”理解为 ἀπολαβών 的省略宾语，并将 μετέθηκεν 解释为改变王的主意，而非把王移到别处；这也纠正了咨询层英文把两个动作都处理为空间移动所造成的重复与句法问题。
