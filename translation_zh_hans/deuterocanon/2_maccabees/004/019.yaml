base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: zh_hans
  text: 可憎的伊阿宋派遣安提阿人作为从耶路撒冷来的使节[a]，携带三百德拉克马银币，用于献给赫拉克勒斯的祭祀；但这些携款者请求不要把这笔钱用于祭祀，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“派遣安提阿籍使节，名义上从耶路撒冷而来。”原文的“作为”可表示他们以耶路撒冷方面的身份或名义受派。
    reason: 保留ὡς ἀπʼ Ἱεροσολύμων可指身份、代表资格或名义来源的语义细微差别，而不在正文中强行判定。
lexical_decisions:
- source_word: μιερὸς
  choice: 可憎的
  rationale: 该词带有强烈的贬斥意味，涉及道德和宗教上的污秽。“可憎的”自然有力，保留叙述者对伊阿宋的明确谴责。
- source_word: θεωρούς
  choice: 使节
  rationale: 该词指奉派参加节庆或宗教活动的正式代表；“使节”既体现其代表身份，也不在正文中过度添加礼仪方面的技术含义。
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: 作为从耶路撒冷来的代表
  rationale: ὡς使“从耶路撒冷来”带有身份或代表资格的意味；此译法保留这一细微语气，同时避免径直解释为“代表耶路撒冷”。
- source_word: Ἀντιοχέας
  choice: 安提阿人
  rationale: 该宾格复数是指与安提阿有关的人，并与“使节”构成同位关系；直译为“安提阿人”保留原文对其身份的表述。
- source_word: παρακομίζοντας
  choice: 携带
  rationale: 分词表示护送或运送款项；“携带”符合现代汉语表达。
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: 三百银德拉克马
  rationale: 保留数额、银质货币及古代币名；“德拉克马”是通行音译。
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: 用于献给赫拉克勒斯的祭祀
  rationale: 清楚表达这笔钱原定用于向赫拉克勒斯献祭，并保留异教祭祀的具体对象。
- source_word: ἠξίωσαν
  choice: 请求
  rationale: 这里表示携款者提出要求；“请求”不弱化其反对，也不把语气强化为原文未必具有的“坚持”。
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: 不要把这笔钱用于祭祀
  rationale: ' χρησθαι所指是款项的用途；用“这笔钱”承接三百银德拉克马，比逐字使用复数代词更符合汉语。'
theological_decisions:
- issue: μιερὸς所表达的叙述者道德判断
  choice: 保留明确谴责，译为“可憎的”
  alternative: 污秽的；亵渎神圣的
  rationale: 负面评价直接存在于希腊文，不应淡化为中性称谓；“可憎的”能保留谴责力度，又不额外限定其污秽究竟属于礼仪、道德还是亵渎层面。
- issue: 安提阿人与耶路撒冷之间的代表关系
  choice: 译为“安提阿人作使节，作为从耶路撒冷来的代表”
  alternative: 从耶路撒冷派出安提阿籍使节；代表耶路撒冷的安提阿人
  rationale: 原文同时出现Ἀντιοχέας和带ὡς的ἀπʼ Ἱεροσολύμων，句法和代表资格存在细微张力；正文保留两层身份，脚注说明另一种较简洁的理解，不将其神学化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赫拉克勒斯”和“德拉克马”使用常见学术音译。原文句子在本节末尚未完结，因此正文以逗号收束，承接下一节。
