base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: zh_hans
  text: 但城堡长官索斯特拉托斯提出追索，因为各项款项的经办权归他；为此，王召见了他们二人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各项款项的经办权归他”也可译作“各项收入的管理归他负责”。希腊语措辞也可能泛指他对财务事务拥有管辖权。
    reason: 保留 τῶν διαφόρων πρᾶξις 在款项、收入以及财务管理或征收方面的词义幅度。
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: 提出追索
  rationale: 该属格独立结构表示索斯特拉托斯主动提出并办理追索；“提出追索”既保留行政、财务语境，也不把它过度限定为诉讼请求。
- source_word: Σωστράτου
  choice: 索斯特拉托斯
  rationale: 按希腊语 Σώστρατος 音译人名。
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: 城堡长官
  rationale: ἀκρόπολις 指设防的高城或城堡；ἔπαρχος 可指主管该处的行政或军事官员。“长官”保留两方面的可能性，避免擅自限定为纯军事指挥官。
- source_word: πρὸς τοῦτον γὰρ ἦν
  choice: 归他
  rationale: 该短语表示相关事务属于他的职责或权限范围；简洁译作“归他”，并由“经办权”明确其行政含义。
- source_word: ἡ τῶν διαφόρων πρᾶξις
  choice: 各项款项的经办权
  rationale: διάφορα 在此财政行政语境中可指款项、收入或应收款；πρᾶξις 可指办理、征收或管理。“各项款项的经办权”保留词义宽度，不武断限定为税收或争议款项。
- source_word: διʼ ἣν αἰτίαν
  choice: 为此
  rationale: 自然而明确地表达原文的因果关系。
- source_word: οἱ δύο
  choice: 他们二人
  rationale: 原文实质化的数词回指前文两位当事人；补出“他们”使现代汉语自然清楚。
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: 王召见了
  rationale: 以汉语主动句自然表达被动式“被王召来”；“召见”符合君王传唤当事人的正式语境。
