base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: zh_hans
  text: 除此以外，他还答应在那一百他连得之外，另行开列五十他连得；若王授权他设立一所希腊式体育馆和青年训练制度[a]，并将耶路撒冷的人登记为安提阿人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希腊式体育馆”和“青年训练制度”都是希腊城邦的制度。前者兼有体育训练、教育和社交功能；后者涉及适龄青年的登记及公民、体育训练。在这里，它们与耶路撒冷的希腊化有关。
    reason: 文化背景说明
  - marker: b
    text: 或译：“把耶路撒冷的人登记为安提阿公民。”希腊文直译为“安提阿人”，可能表示与安提阿有关的公民登记或法律身份，但确切地位并不明确。
    reason: 保留原文有关公民身份的歧义
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: 除此以外
  rationale: 保留承接上文、另加一项的语气，表达自然简洁。
- source_word: ὑποσχεῖτο
  choice: 还答应
  rationale: 此处指雅松向王作出的额外财政承诺；“答应”符合现代汉语叙事语体。
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: 在那一百他连得之外再缴纳五十他连得
  rationale: διαγράφειν 在财政行政语境中可指将款项付清或缴纳；上下文明确涉及金额，因此主文采用自然的“缴纳”，并按上下文补出计量单位“他连得”。
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: 条件是王以权柄准许他
  rationale: 被动式表示由上级授予许可；αὐτοῦ 在上下文中指王。译文明确指称，以免汉语代词造成雅松凭自己权柄行事的误解。
- source_word: γυμνάσιον
  choice: 希腊式体育馆
  rationale: 该词所指并非现代普通健身房，而是希腊城邦中兼具体育、教育和社会功能的机构；加“希腊式”有助于普通读者把握历史语境。
- source_word: ἐφηβίαν
  choice: 青年团
  rationale: 指由适龄青年组成并接受公民和体育训练的制度性团体；“青年团”简明可懂，具体文化内涵由脚注说明。
- source_word: αὐτῷ συστήσασθαι
  choice: 准许他设立
  rationale: συστήσασθαι 表示创设、组织机构；中间语态所含为自己筹设或主管的意味可由上下文自然体现，不用生硬直译。
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: 把耶路撒冷的人登记为安提阿人
  rationale: ἀναγράψαι 是行政性的登记；Ἀντιοχεῖς 字面为“安提阿人”，可能涉及公民身份，但主文不把其确切法律地位说得过满。
theological_decisions:
- issue: Ἀντιοχεῖς 所表示的政治和法律身份
  choice: 主文译作“安提阿人”
  alternative: “安提阿公民”或“安提阿城邦成员”
  rationale: 经文处于推行希腊化制度的政治背景中，该称谓很可能涉及某种公民登记或法律身份；但希腊文本只写“安提阿人”，故主文保留其开放性，并在脚注交代可能含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“希腊式体育馆”避免读者误解为现代健身设施；“青年团”保持简洁，并以脚注补足制度背景。金额单位依照上下文补为“他连得”。
