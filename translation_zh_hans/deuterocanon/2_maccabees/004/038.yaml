base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: zh_hans
  text: 他怒火中烧，立刻剥下安德罗尼古的紫袍，又撕下他的衣服；随后押着他绕遍全城，又带到他曾对敖尼雅犯下不敬之罪的那个地方。在那里，他处死了这个血债累累的凶手[b][a]；主使他受了应得的刑罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “血债累累的凶手”原文含有因杀人流血而被玷污、负有血债的强烈意味。
    reason: lexical_alternative
  - marker: b
    text: “处死”所译的希腊语动词很生动，可能暗示用标枪或类似武器击杀；但这里可以广义理解为将他处决。
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: 怒火中烧
  rationale: 保留“被点燃”的火焰意象和强烈愤怒，同时符合现代汉语习惯。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达行动随即发生，保持叙事节奏。
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  choice: 安多尼古的紫袍
  rationale: πορφύρα既可指紫色织物，也可指象征身份地位的紫色袍服；“紫袍”简洁地传达此意。
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: 扯掉他的衣服
  rationale: χίτων指贴身袍服或衣服；动词带有从周围撕扯、剥除之意。“扯掉”既自然，也体现公开羞辱的动作。
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: 押着他游遍全城
  rationale: περιάγω表示带着某人四处走；处刑语境中的“押着”自然，但不把行动过度解释为正式游街仪式。
- source_word: ἐπʼ αὐτὸν τὸν τόπον
  choice: 直到……那个地方
  rationale: 以“那个地方”配合上下文，并用“直到”自然表达押送所到的明确目的地；强调由后接定语体现。
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: 他曾对敖尼雅犯下不敬之罪
  rationale: ἠσέβησεν含宗教和道德层面的不敬、亵慢之意；“犯下不敬之罪”保留其力度，又不擅自具体化所犯行为。
- source_word: τὸν μιαφόνον
  choice: 这个血债累累的凶手
  rationale: μιαφόνος不仅指杀人者，还含被血污玷染、负有血债的强烈意味；汉语“血债累累”较自然地保留这一层色彩。
- source_word: ἀπεκόντισεν
  choice: 处死了
  rationale: 该动词可带以标枪或类似武器击杀的生动色彩，但上下文首先确定的是将其杀死、执行死刑；正文不武断指定器械，具体词义色彩置于脚注。
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: 主就这样把他应得的刑罚报应在他身上
  rationale: 保留属格独立结构所表达的神学解释：此人的结局是主所施行的相称报应，而不只是人的司法行动。
theological_decisions:
- issue: 次经希腊叙事中κύριος作为施行审判者的译法
  choice: 主
  alternative: 上主；神
  rationale: 原文明确使用κύριος；“主”直接保留称谓，不改换为原文没有的神名或一般称呼。
- issue: 是否明确此刑罚属于神的报应
  choice: 主就这样把他应得的刑罚报应在他身上
  alternative: 他就受到了应得的刑罚
  rationale: 属格独立结构明确把刑罚归于主的行动，因此正文不可淡化为无人称的因果报应；“就这样”也连接了人的处刑与作者给出的神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“怒火中烧”“紫袍”“血债累累”保留原文鲜明的叙事色彩；句末明确保留作者对主施行公正报应的解释。专名按常见天主教中文传统暂译为“安多尼古”“敖尼雅”，不在正文增添人物身份。
