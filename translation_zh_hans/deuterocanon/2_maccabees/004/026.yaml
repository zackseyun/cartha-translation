base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/026.yaml
  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
translation:
  language: zh_hans
  text: 雅松曾排挤自己的兄弟，如今自己又被别人排挤，于是成了逃亡者，前往亚扪地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅松曾暗中算计自己的兄弟，如今自己又被别人暗中算计。”希腊文前后使用同一个动词的主动式和被动式，突出这种讽刺性的逆转。
    reason: 说明原词也可强调暗中使诈的含义，并交代译文保留的修辞对称。
lexical_decisions:
- source_word: Ἰάσων
  choice: 雅松
  rationale: 采用《玛加伯下》中这一希腊人名的通行中文译名，既便于辨认，也与现代中文圣经用语相协调。
- source_word: ὑπονοθεύσας / ὑπονοθευθεὶς
  choice: 曾排挤……又被……排挤
  rationale: 以同一中文动词分别表达主动和被动形式，保留原文刻意形成的讽刺性逆转；“排挤”也能体现以不正当手段取代他人的语意，而不擅自限定具体手段。
- source_word: τὸν ἴδιον ἀδελφὸν
  choice: 自己的兄弟
  rationale: 明确译出ἴδιον，突出雅松所伤害的是自己的亲兄弟，保留原文的道德力度。
- source_word: φυγάς
  choice: 成了逃亡者
  rationale: 保留φυγάς的名词性身份含义，不只表示一次逃跑动作，也表明他由此流亡在外。
- source_word: ὑπῆλθεν
  choice: 前往
  rationale: 用自然的现代汉语表达其向目的地离去；与前面的“成了逃亡者”衔接清楚。
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: 亚扪地区
  rationale: “亚扪”沿用圣经地名传统，“地区”自然表达χώρα所指的疆域，且不将其过度限定为某种政治实体。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“曾……如今……又……”凸显先后关系和报应式逆转；“于是成了逃亡者，前往……”兼顾原文φυγάς的身份意味与ὑπῆλθεν的移动含义。脚注标记置于整句末尾，因为脚注解释的是前后两个对应动词，而不是人名本身。
