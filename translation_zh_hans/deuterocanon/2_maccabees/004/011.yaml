base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: zh_hans
  text: 他搁置了王室经由欧波勒慕的父亲约翰为犹太人所定的仁惠措施[a]；约翰曾为友好和同盟之事出使罗马。他又在废除合乎律法的制度[b]的同时，推行违背律法的习俗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王室给予犹太人的优待”或“仁慈的王室法令”。
    reason: 原文 φιλάνθρωπα βασιλικά 可泛指王室所定的仁厚、有利措施，也可能着重于优待或法令。
  - marker: b
    text: 或译：“合乎律法的公共秩序”或“合乎律法的政制”。原文所用的词可广泛指一个群体既有的社会制度、公民秩序或政制。
    reason: πολιτεία 的语义范围较宽，单一中文对应词难以完全涵盖其制度性和公共性。
lexical_decisions:
- source_word: τὰ κείμενα ... φιλάνθρωπα βασιλικὰ
  choice: 所制定的仁惠王室措施
  rationale: τὰ κείμενα 表示已经制定或生效的安排；φιλάνθρωπα βασιλικά 指王室给予犹太人的有利、仁厚措施。译作“仁惠王室措施”既明示其善意性质，又避免把它过度限定为正式法令或特许权。
- source_word: διὰ Ἰωάννου
  choice: 借着……约翰
  rationale: 保留 διά 表达的中介关系，不武断说明这些措施究竟由约翰争取、传达还是办理。
- source_word: παρώσας
  choice: 搁置一旁
  rationale: 表达把既有措施推开、不予遵行的意思，同时不把动作强化为正式废止。
- source_word: πρεσβείαν
  choice: 出使
  rationale: 此处指正式的外交使命；中文动词“出使”自然简洁，并符合政治外交语境。
- source_word: ὑπὲρ φιλίας καὶ συμμαχίας
  choice: 为要缔结友好和同盟
  rationale: φιλία 与 συμμαχία 是外交用语；“友好和同盟”保留二者的区别，“缔结”自然表达此次外交使命的目的。
- source_word: νομίμους ... πολιτίας
  choice: 合乎律法的社会制度
  rationale: πολιτεία 在此涉及群体既有的公共、制度性秩序，不宜窄化为现代意义的政府形式；“社会制度”保持较宽范围，而“合乎律法”保留与 παρανόμους 的鲜明对照。
- source_word: καταλύων
  choice: 废除
  rationale: 表示拆毁或取消既有制度；“废除”符合本节法律—公共秩序语境。
- source_word: παρανόμους ἔθισμους
  choice: 违背律法的习俗
  rationale: ἔθισμοι 指惯例或习俗，παράνομος 表示违反法律；在犹太语境中“违背律法”也保留可能涉及犹太律法的含义，而不擅自加以限定。
- source_word: ἐκαίνιζεν
  choice: 推行
  rationale: 该词含创设、引进新事物之意；“推行”在中文中适合制度和习俗语境，并能体现持续施行的未完成时色彩。
theological_decisions:
- issue: πολιτεία 在犹太法律及公共生活语境中的范围
  choice: 合乎律法的社会制度
  alternative: 合法的公共秩序；合乎律法的政制
  rationale: 上下文描述雅松破坏犹太人原有的群体秩序并引进违法习俗。“社会制度”能够涵盖制度、公共秩序与生活方式，不把原文过度限定为现代政体。
- issue: φιλάνθρωπα βασιλικά 的性质
  choice: 仁惠王室措施
  alternative: 王室给予的优待；仁慈的王室法令
  rationale: 原语明确带有仁厚、有利于人的评价，但未必专指法令或法律上的特许。“措施”较中性，“仁惠”保留 φιλάνθρωπα 的正面色彩。
- issue: παράνομος 所违反之“法”的所指
  choice: 违背律法
  alternative: 不合法的；违法的
  rationale: 该词与 νομίμους 对举，在本书语境中可能特别指违背犹太律法，但原文没有在此明确加上“摩西”或“犹太”限定，因此不作进一步教义化说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。为理清较长的希腊句法，将原句分为三句；以分号保持约翰与欧波勒慕父子的说明关系清楚。正文中的[a]、[b]均与脚注一一对应。
