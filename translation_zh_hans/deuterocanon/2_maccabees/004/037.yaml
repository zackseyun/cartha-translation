  text: So Antiochus[a], deeply grieved in soul and moved to pity, and having wept because of the self-control and great good order of the one who had died[c][b],
translation:
  language: zh_hans
  text: 于是，安条克心里深感悲痛，转而生出怜悯，并因死者的自制和极其端正的品行而流下眼泪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχικῶς
  choice: 心里深感
  rationale: 保留 ψυχ- 所表达的内在、心灵层面，同时用现代汉语自然地传达情感之深。
- source_word: ὑπολυπηθεὶς
  choice: 悲痛
  rationale: 表达因哀伤而深受触动，符合本节庄重的情感语境。
- source_word: τραπεὶς ἐπὶ ἔλεος
  choice: 转而生出怜悯
  rationale: 兼顾字面上的“转向”与 ἔλεος 的怜悯之意，也呈现其态度的转变。
- source_word: δακρύσας
  choice: 流下眼泪
  rationale: 自然传达其哭泣落泪的动作，并与前面的情绪变化顺畅衔接。
- source_word: διὰ
  choice: 因
  rationale: 此处接宾格表示原因，简洁明确。
- source_word: τοῦ μετηλλαχότος
  choice: 死者
  rationale: 该完成时分词在语境中指已经去世的人；“死者”简洁、庄重而清楚。
- source_word: σωφροσύνην
  choice: 自制
  rationale: 保留 σωφροσύνη 所含的节制、自我约束之核心意义，不将其缩窄为单纯的谨慎。
- source_word: πολλὴν εὐταξίαν
  choice: 极其端正的品行
  rationale: εὐταξία 可指秩序、纪律或行为得体；在称赞死者的语境中，“端正的品行”自然传达道德与举止层面的良好秩序，且“极其”对应 πολλήν。
