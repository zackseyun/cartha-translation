- from: 因此，米涅劳私下把安德罗尼古叫到一旁，怂恿他设计杀害敖尼雅[a]。安德罗尼古便去见敖尼雅，用诡计取得他的信任，又起誓向他表示友好，并伸出右手作保；尽管敖尼雅仍有疑心，他还是说服敖尼雅走出避难所[b]，随即把他除掉[c]，丝毫不顾公义。
