  source_fidelity: 译文大体准确传达了密谋、欺骗、以誓言和右手取得信任、劝离避难处及随后的处置。可是“尽管敖尼雅仍有疑心”改变了希腊文καίπερ ἐν ὑποψίᾳ κείμενος的语法所指：该阳性单数分词随本句主语安德罗尼古，正常理解是“尽管安德罗尼古仍受人怀疑”。此处不应将“受怀疑”改作敖尼雅主观上的疑心。另，“把他除掉”比παρέκλεισεν更明确地预设杀害；宜在正文保留“拘禁/关押”一类较贴近原词且不排除上下文含义的表达，并在脚注说明可能的更强解释。
  naturalness: 整体为自然、庄重的现代汉语。将让步分句明确主语为“安德罗尼古”，可同时消除汉语代词歧义。以“拘禁起来”替代“除掉”，更符合叙事语体，也避免“除掉”的口语性及其过强断言。
  terminology: 人名音译在本节内部一致，可保留。“避难所”恰当体现ἄσυλον的保护性质；脚注列出“圣所”和“庇护之地”足以保留其可能的宗教语境。“公义”可以保留，以表达τὸ δίκαιον所指的正义、正当。
