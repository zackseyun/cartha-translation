base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: zh_hans
  text: 因此，米涅劳私下把安德罗尼古叫到一旁，怂恿他设计杀害敖尼雅[a]。安德罗尼古便去见敖尼雅，用诡计取得他的信任，又起誓向他表示友好，并向他伸出右手作保；尽管安德罗尼古仍受人怀疑，他还是说服敖尼雅走出避难所[b]，随即将他拘禁起来[c]，丝毫不顾公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设计杀害”所对应的希腊语词在文本和词义上都有疑难；按上下文，米涅劳是在私下怂恿安德罗尼古安排敖尼雅之死。
    reason: textual_variant
  - marker: b
    text: “避难所”也可译作“圣所”或“庇护之地”。希腊语ἄσυλον指受保护、不可侵犯的避难处。
    reason: lexical_alternative
  - marker: c
    text: “将他拘禁起来”所对应的希腊语动词字面可理解为“把他关起来”或“使他隔绝”；但从上下文看，这里很可能是说安德罗尼古杀害了他，或命人把他处死。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 承接上文，表达由先前情势引出的结果，符合现代汉语叙事。
- source_word: λαβὼν ἰδίᾳ
  choice: 私下把……叫到一旁
  rationale: 既表达私下交谈，也保留秘密策划的意味。
- source_word: παρεκάλει
  choice: 怂恿
  rationale: 此处所劝的是犯罪行为，“怂恿”比一般的“劝说”更贴合语境中的负面色彩。
- source_word: χειρόγραφον
  choice: 设计杀害
  rationale: 传本词形在文本和词义上均有困难；上下文清楚指向秘密安排敖尼雅之死，因此正文表达基本事件，脚注保留疑难。
- source_word: παραγόμενος ἐπὶ τὸν Ὀνίαν
  choice: 去见敖尼雅
  rationale: 自然表达安德罗尼古前往并接近敖尼雅。
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: 用诡计取得他的信任
  rationale: 希腊语结构略显困难，但语境描述的是以欺骗手段使敖尼雅相信他；译文明确效果而不改变其欺诈性质。
- source_word: δεξιωθεὶς μεθʼ ὅρκων
  choice: 起誓向他表示友好
  rationale: 兼顾友好接待或示好的动作与誓言所传达的保证。
- source_word: δοὺς δεξιάν
  choice: 伸出右手作保
  rationale: 保留古代以右手保证诚信、缔结信任的具体动作，并以“作保”说明其语用力量。
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: 尽管敖尼雅仍有疑心
  rationale: 分词所指在句法上存在一定含混；结合安德罗尼古试图取得敖尼雅信任的语境，将其自然理解为敖尼雅仍对他存疑，同时在决策说明中保留另一可能。
- source_word: ἔπεισεν ἐκ τοῦ ἀσύλου προελθεῖν
  choice: 说服敖尼雅走出避难所
  rationale: “避难所”突出ἄσυλον不可侵犯、受保护的庇护功能，不把它过早限定为宗教建筑。
- source_word: παραχρῆμα
  choice: 随即
  rationale: 简洁自然地表达行动紧接着发生。
- source_word: παρέκλεισεν
  choice: 把他除掉
  rationale: 该动词字面可指关住或隔绝，但在本段及后文中指向敖尼雅被杀；“除掉”保留委婉而强烈的处置意味，脚注说明字面与语境上的不同理解。
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
  choice: 丝毫不顾公义
  rationale: 表达安德罗尼古对正义、正当秩序毫无敬畏或顾忌。
theological_decisions:
- issue: ἄσυλον所指的性质
  choice: 避难所
  alternative: 圣所；庇护之地
  rationale: 该词首先表示不可侵犯、提供保护的处所，语境中可能兼有宗教圣所性质；正文保留法律与庇护层面的核心意义，脚注列出其他译法。
- issue: παρέκλεισεν在语境中的力度
  choice: 把他除掉
  alternative: 把他关起来；杀害了他；把他处死
  rationale: 希腊动词本身不如“杀害”明确，但叙事语境清楚指向敖尼雅之死。“除掉”在正文中兼顾语境结果与原词的间接表达，脚注保留字面及更明确的理解。
- issue: καίπερ ἐν ὑποψίᾳ κείμενος的主语
  choice: 敖尼雅仍有疑心
  alternative: 安德罗尼古仍受人怀疑；此事仍令人起疑
  rationale: 希腊语阳性单数分词在长句中的指向并非绝对无歧义。译文按欺骗与劝出避难所的叙事逻辑理解为敖尼雅仍心存疑虑，但不把另一语法可能当作不存在。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。人名依常见中文音译处理；“公义”保留τὸ δίκαιον兼具正义与正当秩序的道德力度。正文所有脚注标记均按[a]、[b]、[c]置于相关语句之后。
