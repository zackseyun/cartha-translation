  text: 在推罗举行每四年一届的竞技会[a]时，国王也在场，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文πενταετηρικοῦ字面意思是“五年一次的”，但古代节期采用首尾年份并计的算法，通常指实际每四年举行一次的赛事。
