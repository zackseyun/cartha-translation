lexical_decisions:
- source_word: Ἀγομένου
  choice: 举行
  rationale: 这是ἄγω的属格绝对结构；用于节庆或竞赛时表示举办、举行。结合中文时间从句译作“举行……时”，自然地保留事件正在进行的背景作用。
- source_word: πενταετηρικοῦ
  choice: 每四年一届的
  rationale: 该词字面与“五年”有关，但古希腊节期按首尾年份并计，实际间隔通常为四年；正文传达真实周期，脚注说明其字面形式和计年方式。
- source_word: ἀγῶνος
  choice: 竞技会
  rationale: ἀγών可泛指竞赛；在推罗城邦节庆语境中指公开举行的赛事。“竞技会”既自然，又不把内容限定为原文未明说的纯体育赛事。
- source_word: ἐν Τύρῳ
  choice: 在推罗
  rationale: 按地点介词短语直译，并采用现代中文常见地名“推罗”。
- source_word: τοῦ βασιλέως παρόντος
  choice: 国王也亲临现场
  rationale: 第二个属格绝对结构表示伴随情形。“亲临现场”自然表达国王在场；“也”衔接同一时间背景，但不增添时间副词“这时”。
