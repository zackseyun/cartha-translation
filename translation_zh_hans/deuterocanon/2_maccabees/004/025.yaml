base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: zh_hans
  text: 他领受王命[a]后便来到；他身上没有半点与大祭司职分相称之处[b]，却怀着残暴暴君般的暴戾冲动和野蛮猛兽般的狂怒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王的命令”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“没有带着任何配得大祭司职分的东西”。这里指他毫无与这职分相称的品格或资格。
    reason: translation_clarity
  - marker: c
    text: 希腊原文用两个意义相近的复数词，分别表达暴烈的冲动与愤怒，以加强对他凶残性情的刻画。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: 领受……后
  rationale: 不定过去时分词表示先于主要动词的动作；译作“领受……后”既交代先后，也符合现代汉语叙事习惯。
- source_word: τὰς βασιλικὰς ἐντολάς
  choice: 王命
  rationale: 指来自君王或王室权威的命令；“王命”简洁庄重，也保留命令的权威性。
- source_word: παρεγίνετο
  choice: 来到
  rationale: 该动词在此表示来到现场；“来到”自然地承接前面的领命动作。
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  choice: 他身上没有半点与大祭司职分相称之处
  rationale: φέρων在此描写他所带有或具备的特质。译文用“身上没有半点……相称之处”自然表达其毫无配任资格，同时保留原文的绝对否定和鲜明对比。
- source_word: ἀρχιερωσύνης
  choice: 大祭司职分
  rationale: 既指大祭司的身份，也指其职任；“职分”在本句资格与品格的语境中较为准确。
- source_word: θυμοὺς
  choice: 暴烈性情
  rationale: 复数θυμοί在此指强烈、凶暴的冲动或性情；“暴烈性情”与后面的“狂怒”有所区分，又保留贬斥力度。
- source_word: ὠμοῦ τυράννου
  choice: 残暴暴君的
  rationale: ὠμός在此意为残忍、凶狠；“残暴”是现代汉语中直接而有力的对应，并与“暴君”构成原文强烈的道德谴责。
- source_word: θηρὸς βαρβάρου
  choice: 野蛮猛兽的
  rationale: θηρίον相关语义指野兽，βάρβαρος在此突出粗野、未开化般的残酷，而非强调族群身份；“野蛮猛兽”保留修辞形象。
- source_word: ὀργὰς ἔχων
  choice: 怀着……狂怒
  rationale: ἔχων支配θυμούς和ὀργάς，表示他具有这些凶暴特质；“怀着……狂怒”符合汉语表达，并使ὀργάς与前项θυμούς保持区别。
theological_decisions:
- issue: 大祭司职分与人物道德品格之间的对照
  choice: 明确保留“没有半点相称之处”与暴君、猛兽般性情之间的尖锐对照。
  alternative: 将本句弱化为单纯的政治批评，或仅说他不适合担任大祭司。
  rationale: 希腊文以οὐδὲν ἄξιον作绝对否定，又用μέν／δέ结构把大祭司职分与残暴性情直接对置。译文不削弱其道德谴责，也不额外加入经文未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王命”“大祭司职分”保持历史语境和正式感；“暴烈性情”“狂怒”分别对应两个近义希腊词，避免在中文中完全合并。分号凸显原文先叙行动、后作道德评断的转折结构。
