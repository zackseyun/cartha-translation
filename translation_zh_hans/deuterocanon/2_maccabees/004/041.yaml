  text: he began to strike with lawless hands[a], with a certain Auranus taking the lead, advanced in age but no less in ignorance.
translation:
  language: zh_hans
  text: 他便开始以不义的手段施暴[a]；一个名叫奥拉努斯的人带头行事，他年事已高，在无知上也毫不逊色。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在此措辞紧缩，句法也较难确定。字面涉及“不义的手”；其大意是他开始实施不义的暴力行动，而奥拉努斯带头行事。
    reason: 原文句法歧义
lexical_decisions:
- source_word: κατήρξατο
  choice: 便开始
  rationale: 该词在这里引出行动的开端；用“开始”自然表达其惯用义，同时不把省略的具体动作说得过实。
- source_word: χειρῶν ἀδίκων
  choice: 动用不义的手段
  rationale: 原文为紧缩而略显困难的属格结构，字面涉及“不义的手”。中文用“动用不义的手段”保留违法施暴的含义，也避免生硬的“用不义的手击打”。
- source_word: προηγησαμένου
  choice: 带头
  rationale: 该属格独立结构表明奥拉努斯走在前面、率先采取行动；“带头”简洁自然。
- source_word: τινὸς Αὐρανοῦ
  choice: 一个名叫奥拉努斯的人
  rationale: τινός与专名连用，可表达“某个/一个名叫……的人”；Αὐρανός按人名音译为“奥拉努斯”。
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: 年事已高
  rationale: 该惯用表达指年岁增长、年纪老迈；“年事已高”符合庄重的现代汉语。
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: 无知却也不相上下
  rationale: 原文刻意把年龄与无知并列比较，带有讽刺意味；此译保留“不少于、同样深”的修辞张力，而不擅自解释成智力或道德缺陷。
