  text: but because of the present circumstances for the outfitting of the triremes[a].
translation:
  language: zh_hans
  text: 但由于当前的情况，这笔钱被用来装备三列桨战船。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但为了应付眼前的需要，这笔钱被用于整备三列桨战船。”
    reason: 原文 τῶν παρόντων 可指“当前的情况”，也可理解为“眼前的需要”；κατασκευάς 也可译为“整备”。
lexical_decisions:
- source_word: ἕνεκα
  choice: 由于
  rationale: 该介词在此表示原因或缘由；“由于”自然地保留了因果意味。
- source_word: τῶν παρόντων
  choice: 当前的情况
  rationale: 带冠词的中性复数分词作名词用，泛指当时存在的情势；此译法不把含义过度限定为某种具体需要。
- source_word: κατασκευάς
  choice: 装备
  rationale: 在战船语境中，该词指配备、整备，而不必专指建造；“装备”符合现代汉语表达。
- source_word: τριηρέων
  choice: 三列桨战船
  rationale: 保留古代特定舰种的历史信息，并以普通读者容易理解的汉语名称表达。
- source_word: εἰς
  choice: 被用来
  rationale: εἰς 与宾格在此表达用途或去向；结合上下文补出被省略的款项及被动用途关系，使本节残句在中文中可独立理解。
