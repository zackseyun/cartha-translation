  text: But when Seleucus passed from life[a], and Antiochus, the one called Epiphanes, took over the kingdom,
translation:
  language: zh_hans
  text: 塞琉古去世以后[a]，那位称为伊皮法尼的安提阿哥继承了王位，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
