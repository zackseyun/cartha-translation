lexical_decisions:
- source_word: Μεταλλάξαντος δὲ τὸν βίον
  choice: 塞琉古去世以后
  rationale: 该表达直译近于“换了生命”，在这里是死亡的委婉说法。正文采用现代汉语自然、庄重的“去世”，并以脚注保存原文措辞。δέ在承接叙事时以语序和“以后”体现，不另译为“但是”。
- source_word: παραλαβόντος τὴν βασιλείαν
  choice: 继承了王位
  rationale: 在王位更替的语境中，παραλαμβάνω与βασιλεία的组合表示接掌王权。译作“继承了王位”比“接管了王国”更符合现代汉语习惯，也不额外暗示夺权。
- source_word: Ἀντιόχου
  choice: 安条克
  rationale: 采用该希腊人名在中文圣经与相关历史文献中的通行译名。
- source_word: τοῦ προσαγορευθέντος
  choice: 那位称为
  rationale: 保留分词短语对安条克称号的说明作用；“那位称为”自然地引出其别号。
- source_word: Ἐπιφανοῦς
  choice: 伊皮法尼
  rationale: 这是附于君王姓名的称号，此处按专名音译，以保留其历史识别功能，避免在正文中选定“显现者”或“显赫者”等有争议的释义。
