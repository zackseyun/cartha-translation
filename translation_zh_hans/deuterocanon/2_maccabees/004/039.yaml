base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: zh_hans
  text: 当吕西马科在默乃劳的同意下，在城里多次盗取圣殿的财物[a]，而这消息传到城外[b]以后，民众便聚集起来反对吕西马科，因为已有许多金制器物被抢走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“多起渎圣之事”；希腊语更具体地指盗窃神圣或圣殿的财物。
    reason: lexical_alternative
  - marker: b
    text: “消息”也可译为“传闻”；希腊语此词可指消息、报道或传闻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: 屡次盗取圣殿财物
  rationale: 该词特指盗窃神圣场所或圣物；用“盗取圣殿财物”明确罪行性质，并以“屡次”体现复数所指的多起事件。
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: 在默乃劳的同意下
  rationale: γνώμη在这里表示赞同、认可或共同意向；“同意”表明默乃劳参与纵容，却不把他写成直接实施者。
- source_word: διαδοθείσης ἔξω τῆς φήμης
  choice: 消息传开以后
  rationale: φήμη可指消息、传闻或报告；此处采用中性的“消息”，而ἔξω与διαδοθείσης合起来自然表达为“传开”。
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: 民众就聚集起来
  rationale: 既保留群众集合的含义，又符合现代汉语叙事表达。
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: 反对吕西马科
  rationale: ἐπί加宾格本可表示朝向某人，但上下文显示群众怀有敌意；“反对”保留这种指向性而不过度具体化为攻击。
- source_word: χρυσωμάτων
  choice: 金器
  rationale: 该词指黄金制品或黄金贵重物；“金器”比笼统的“黄金”更能体现可被劫走的具体物件，同时不限定为某一种器皿。
- source_word: διηρπαγμένων
  choice: 已经被抢走了
  rationale: 完成时被动分词表示掠夺已经发生并留下现实后果；“已经被抢走了”自然体现其完成性与被动意义。
theological_decisions:
- issue: ἱεροσυλημάτων所指罪行的性质
  choice: 具体译为盗取圣殿财物
  alternative: 笼统译为亵渎圣物或渎圣行为
  rationale: 该词的词义核心是盗窃神圣场所或圣物，而不只是一般的不敬行为；明确“圣殿财物”能保存历史与宗教语境，又不加入经文未明说的教义判断。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。句法略作拆分，以免原文多个属格绝对结构和分词结构在汉语中显得拖沓；保留“消息”与“传闻”之间的可能性，并用脚注说明ἐπί所含方向与敌意之间的张力。人名按次经常见现代音译处理。
