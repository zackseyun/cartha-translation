revisions:
- from: 可是，吕西马科在默乃劳的同意下，在城里屡次盗取圣殿财物[a]。消息传开以后，民众就聚集起来反对吕西马科[b]，因为许多金器已经被抢走了。
  to: 当吕西马科在默乃劳的同意下，在城里多次盗取圣殿的财物[a]，而这消息传到城外[b]以后，民众便聚集起来反对吕西马科，因为已有许多金制器物被抢走了。
  rationale: 修订保留原文所述盗窃圣物、默乃劳的同意、群众聚集反对以及金制物品已遭掠夺等信息；补出“传到城外”所表达的ἔξω，并恢复b脚注与φήμη及英语审校轨迹的一致对应。对ἐπὶ τὸν Λυσίμαχον仍译作“反对吕西马科”，这是在本段群众因圣殿财物被劫而集结的语境中自然且不过度具体化的表达。
