base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: zh_hans
  text: 因此，他们打伤了其中许多人，击倒了一些人，又把他们全都赶得逃走；而那个劫掠圣殿的人[a]本人，他们在宝库旁把他抓住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎圣物的人”。希腊语这个词可指侵犯神圣事物的人，尤其指劫掠神庙或圣殿的人。
    reason: 保留ἱερόσυλος兼有亵圣与劫掠圣所之意的词义范围。
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: 因此
  rationale: 自然、简洁地表达承接上文的因果关系。
- source_word: τραυματίας ἐποίησαν
  choice: 打伤了
  rationale: 这是“使成为受伤者”的惯用表达；译作“打伤”既符合现代汉语，也保留暴力造成身体创伤的具体含义。
- source_word: κατέβαλον
  choice: 击倒了
  rationale: 原词指使人倒下，在此可能包含致死之意，却没有明确说“杀死”；“击倒”保留这种开放性。
- source_word: εἰς φυγὴν συνήλασαν
  choice: 赶得逃跑
  rationale: 准确表达强迫众人逃离的动态意义，同时采用普通读者易懂的现代汉语。
- source_word: τὸν ἱερόσυλον
  choice: 那个抢劫圣殿的人
  rationale: 该词可指侵犯神圣之物者，尤其指抢劫神庙或圣殿的人；上下文涉及宝库，因此采用具体译法，并以脚注保留较宽泛的含义。
- source_word: ἐχειρώσαντο
  choice: 抓住了
  rationale: 中间语态动词在此表示把某人控制在手中，即抓获；“抓住”自然且不额外引入正式司法程序。
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: 在宝库旁
  rationale: 保留παρά的空间关系；γαζοφυλάκιον指存放财物的宝库或库房，此处不增加原文未明说的建筑细节。
theological_decisions:
- issue: 圣殿语境中ἱερόσυλος的译法
  choice: 那个抢劫圣殿的人
  alternative: 那个亵渎圣物的人
  rationale: 原词兼有侵犯神圣事物和劫掠圣所财物的含义。鉴于紧接着提到宝库，正文采用具体的抢劫含义；脚注保留较宽泛的亵圣含义，避免消除原词的宗教分量。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……本人”体现αὐτὸν δὲ的转折和强调；各暴力动作依原文顺序并列。脚注标记置于其实际说明的“抢劫圣殿的人”之后，而非置于前半句的受伤者之后。
