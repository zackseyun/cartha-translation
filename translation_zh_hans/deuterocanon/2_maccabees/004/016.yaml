base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: zh_hans
  text: 正因如此[a]，严酷的困境包围了他们：他们羡慕那些人的生活方式[b]，又想使自己变得和他们一样；那些人却成了他们的仇敌和惩罚者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正因如此”也可译作“正因那些人”；希腊语表达既可概括前述原因，也可特指刚才提到的人是随后困境的起因。
    reason: lexical_alternative
  - marker: b
    text: “生活方式”也可译作“习俗”或“行为方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: 正因如此
  rationale: χάριν与属格连用可表示原因，也可能更具体地指“正因那些人”。正文采用自然的因果衔接，并以脚注保留所指对象的歧义。
- source_word: περιεῖχεν
  choice: 包围了
  rationale: 该动词有环绕、围住之意；与περίστασις连用时，形象地表达困境从四面逼近，中文保留这一比喻。
- source_word: χαλεπὴ περίστασις
  choice: 严酷的困境
  rationale: περίστασις在此不是中性的“处境”，而是艰难危急的境遇；χαλεπή进一步加强其严重性。
- source_word: ἐζήλουν
  choice: 羡慕
  rationale: ζηλόω可指热衷、艳羡或竞相仿效；结合上下文对外族生活方式的追求，“羡慕”保留了负面的道德色彩，又不把含义限缩为单纯的模仿。
- source_word: τὰς ἀγωγὰς
  choice: 生活方式
  rationale: ἀγωγή可指行为方式、教养或生活习俗；本章语境涉及希腊化风尚，“生活方式”比单说“行为”更完整，也比“习俗”涵盖更广。
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: 又想使自己变得和他们一样
  rationale: ἐξομοιόομαι表达使自己相像、与之同化；译文明确其主动趋同的意思，同时不额外规定具体仿效的范围。
- source_word: πολεμίους
  choice: 仇敌
  rationale: 直接表达敌对者之意，语体庄重而自然。
- source_word: τιμωρητὰς
  choice: 惩罚者
  rationale: τιμωρητής可指施行惩罚或报复的人；“惩罚者”保留此范围，不擅自判定其惩罚具有司法授权或私人复仇性质。
- source_word: ἔσχον
  choice: 成了
  rationale: 字面为“有了/把……当作”，此处表达关系的结果或事实；中文用“成了”自然地呈现反讽性的转折。
theological_decisions:
- issue: 效法外族生活方式所带出的道德与报应意味
  choice: 译为他们所羡慕并想与之相同的人，反而成了他们的仇敌和惩罚者。
  alternative: 较中性地译为他们所仰慕的人后来敌对并惩治他们。
  rationale: ἐζήλουν和τιμωρητάς以及整句结构共同带出负面评价和反讽性的后果。译文保留这种道德张力，却不增添经文本身未明说的神学因果说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“严酷的困境包围了他们”保留原文的环绕意象；分号和“却”清楚呈现前后反讽关系。脚注标记均置于正文相应词语之后。
