  footnotes:
  - marker: a
    text: 或译：“关于这些事，针对米尼老的诉讼开始了。”希腊原文十分简练，也可理解为法律程序正式启动。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: 关于这些事
  rationale: περί加属格引出所谈事项；δέ在此起承接、转折话题的作用。汉语用“关于这些事”自然地转入下文，不额外加入原文没有的时间副词。
- source_word: ἐνέστη
  choice: 开始了
  rationale: 该动词在这里表示法律程序出现、启动。译作“开始了”既符合汉语表达，也不强行指定是谁提起了程序。
- source_word: κρίσις
  choice: 司法审理
  rationale: κρίσις可指审判、裁断或法律程序；结合上下文，译作“司法审理”保留正式法律含义，同时避免把具体程序过度限定为某一种现代诉讼形式。
- source_word: ἐπὶ τὸν Μενέλαον
  choice: 针对米尼老
  rationale: ἐπί加宾格在法律语境中表示行动所针对的人；“针对”准确表达程序指向米尼老，并保留原句结构。
