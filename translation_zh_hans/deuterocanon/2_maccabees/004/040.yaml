  yaml_path: translation/deuterocanon/2_maccabees/004/040.yaml
  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: zh_hans
  text: 群众正在骚动，满腔愤怒；吕息马古便武装了约三千人，开始使用不义的暴力。带头的是一个名叫奥拉诺的人[a]；他年事已高，在无知上也毫不逊色[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文以“某个”引介奥拉诺，表明他是叙事中此前未曾介绍的人物。
    reason: lexical_alternative
  - marker: b
    text: 原文带有反讽意味：他年事已高，在无知上却也毫不逊色。
    reason: literary_wordplay
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: 正在骚动
  rationale: 分词描述群众受到激动并开始行动；“正在骚动”自然呈现局势升高，又不明说是谁煽动他们。
- source_word: ὄχλων
  choice: 群众
  rationale: 中性对应复数名词，不预先加入“暴徒”之类的贬义判断。
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: 满腔愤怒
  rationale: 表达群众被愤怒充满的强烈状态，符合现代汉语习惯。
- source_word: καθοπλίσας
  choice: 武装了
  rationale: 准确表示给人配备武器。
- source_word: πρὸς τρισχιλίους
  choice: 约三千人
  rationale: πρός与数词连用在此表示约数。
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: 开始施行不义的暴力
  rationale: 原文直译近于“开始不义之手”，是指发动不义的暴力行动；译文既保留道德评价，也清楚表达实际行为。
- source_word: προηγησαμένου
  choice: 带头
  rationale: 自然表达此人在行动中走在前面、担任领头者。
- source_word: τινὸς Αὑρανοῦ
  choice: 一个名叫奥拉诺的人
  rationale: τινός引入一个此前不知名的人物；姓名按希腊文音译。
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: 年事已高
  rationale: 清楚而庄重地表达年岁老迈。
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: 无知的程度也毫不逊色
  rationale: 保留原文将年纪与无知并列比较的尖锐反讽。
