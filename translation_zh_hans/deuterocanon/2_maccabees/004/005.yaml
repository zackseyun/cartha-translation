  text: he presented himself to the king[a], not becoming an accuser of his fellow citizens, but seeking what was advantageous both publicly and privately for the whole multitude.
translation:
  language: zh_hans
  text: 他到王面前[a]，并不是要控告自己的同胞，而是为民众整体和其中每一个人谋求益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到王面前”也可译作“被引见到王面前”或“到王面前陈情”。原文 διεκοσμήθη 在这里的具体语用略有不确定，可能带有正式进见或引见的意味。
    reason: 保留 διεκοσμήθη 在宫廷语境中“进见／被引见／陈情”的语义不确定性，且不添加原文未明说的具体内容。
lexical_decisions:
- source_word: πρὸς τὸν βασιλέα διεκοσμήθη
  choice: 他便去见王
  rationale: 此处结合宫廷语境，表达敖尼雅来到王面前陈情。译为“去见王”简洁自然，也避免把 διεκοσμήθη 生硬直译成与“装饰”有关的用语。
- source_word: οὐ γινόμενος τῶν πολιτῶν κατήγορος
  choice: 并不是要控告自己的同胞
  rationale: κατήγορος 保留司法意味，译作“控告”；πολῖται 指同一城邦或公民共同体中的人，在此译作“自己的同胞”比“公民”更能传达关系性。分词结构按汉语表达为伴随的目的或行为说明。
- source_word: τὸ δὲ σύμφορον
  choice: 而是要……谋求……益处
  rationale: σύμφορον 指有利、有益之事；“谋求益处”符合上下文所描述的行动动机，但不额外强化其道德评价。
- source_word: κοινῇ καὶ κατʼ ἰδίαν παντὶ τῷ πλήθει
  choice: 为全体民众谋求共同和个人的益处
  rationale: κοινῇ 与 κατʼ ἰδίαν 构成群体层面和个体层面的对照；παντὶ τῷ πλήθει 强调整体民众。此译保留压缩句法中的双重范围。
theological_decisions:
- issue: 敖尼雅见王之举的伦理性质
  choice: 经文将他描述为并非控告同胞，而是为全体民众在共同和个人层面谋求益处。
  alternative: 末句也可理解为“为民众整体以及其中每一个人谋求益处”。
  rationale: 两种理解都保留共同利益与个体利益的对照；正文不进一步推断敖尼雅的内在动机，也不把此举塑造成超出原文的教义性榜样。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同胞”体现城邦成员之间的关系；“共同和个人的益处”保留原文在群体与个体两个层面的并列。脚注标记已在正文中对应出现。
