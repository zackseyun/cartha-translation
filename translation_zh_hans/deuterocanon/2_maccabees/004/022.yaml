base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: zh_hans
  text: 他受到伊阿宋和全城的隆重接待，又在火炬队伍和欢呼声中受到欢迎[a]；随后，他便前往腓尼基扎营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在举火炬和呼喊声中受到欢迎。”希腊文描写的是以火炬和高声呼喊为特色的公开欢迎仪式。
    reason: 说明δᾳδουχίας和βοῶν既可具体译作“举火炬和呼喊”，也可按礼仪语境译作“火炬队伍和欢呼声”；删除原文未明说的“迎入”。
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: 隆重
  rationale: 该副词表示盛大、气派的方式；“隆重”自然地传达公开而有仪式感的接待，又不过度强调奢华。
- source_word: ἀποδεχθεὶς
  choice: 受到……接待
  rationale: 此处被动分词指对来访君王的正式接待；这一译法也保留了它与后文“被迎入城”之间的语义呼应。
- source_word: δᾳδουχίας
  choice: 火炬队伍
  rationale: 该名词指仪式性地持火炬迎候；“火炬队伍”既简明易懂，也呈现公共欢迎仪式的场景。
- source_word: βοῶν
  choice: 欢呼声
  rationale: 原词指响亮的呼喊；在欢迎仪式的语境中，“欢呼声”最自然，同时仍保留群体高声呼喊的意味。
- source_word: εἰσεδέχθη
  choice: 被迎入城
  rationale: 该动词兼有接纳和迎入之意；结合“全城”及欢迎仪式的语境，译为“被迎入城”可与前面的概括性接待相区别。
- source_word: εἶθʼ οὕτως
  choice: 随后，他便
  rationale: 该短语承接前述事件并推进叙事；现代汉语不宜生硬直译为“然后这样”，故用自然的顺承表达。
- source_word: κατεστρατοπέδευσεν
  choice: 扎营
  rationale: 该动词本义是设立营地；“扎营”保留军事行程色彩，而不增添原文没有明说的部队部署细节。
- source_word: Φοινίκην
  choice: 腓尼基
  rationale: 采用该古代地区名称通行的现代汉语译名。
