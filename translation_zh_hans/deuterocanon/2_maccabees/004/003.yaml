  yaml_path: translation/deuterocanon/2_maccabees/004/003.yaml
  text: But the hostility advanced so far that even murders were being committed by one of those approved by Simon,[a]
translation:
  language: zh_hans
  text: 但敌意竟发展到如此地步，甚至借着西门所认可的人中的某一个，竟发生了多起谋杀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“甚至西门所认可的人中有一个犯下了多起谋杀。”希腊文借“通过／借着某人”的表达保留此人究竟是实施者，还是谋杀得以发生的媒介或渠道，未作明确界定；“某一个”也表明其身份不定。
    reason: 保留διὰ τινος可表示媒介或可按语境理解为施事的余地，并保留不定代词及复数“谋杀”。
lexical_decisions:
- source_word: ἔχθρας
  choice: 敌意
  rationale: 表示敌对、仇视的关系；“敌意”自然地衔接上下文中不断升级的冲突，又不把含义限缩为内心的“仇恨”。
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  choice: 越演越烈
  rationale: 这个属格独立结构说明敌意发展到了极端程度；“越演越烈”以现代汉语自然表达持续发展并达到如此地步的意思。
- source_word: διὰ τινος
  choice: 借着……中的一个
  rationale: διά加属格表示借助或通过某人；τινος是不定代词，故保留人物身份不明确这一点，不擅自确定其为直接主犯。
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  choice: 西门所认可的人
  rationale: δεδοκιμασμένων指经过考验后被认可的人；译文保留分词的被动意义以及τινος所要求的部分关系，不额外加入“手下”或“代理人”等原文未明说的身份。
- source_word: φόνους
  choice: 谋杀
  rationale: φόνος在这里指非法蓄意杀人；汉语“谋杀”能表达其犯罪性质。汉语集合用法无需机械标示希腊语复数。
- source_word: συντελεῖσθαι
  choice: 实施
  rationale: 该被动不定式表示谋杀得以完成或实行；结合διά短语，以“有人借着……实施”自然传达事件由中间人促成或执行的结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“越演越烈”传达冲突升级；正文以“有人借着”保留幕后促成者与执行者可能有别的含义，脚注则列出把西门所认可之人直接视为实施者的译法。所有人名依现代中文圣经常见形式译作“西门”。
