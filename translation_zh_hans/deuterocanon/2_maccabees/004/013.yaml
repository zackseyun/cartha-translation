base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: zh_hans
  text: 希腊化竟达到如此高峰，异族习俗也日益蔓延[a]；这都是因为雅孙极其无耻——他不敬虔，也不算大祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“异族习俗的侵入。”这里的希腊文罕见词语指非本族、尤其非犹太习俗的扩散。
    reason: 说明πρόσβασις与ἀλλοφυλισμός可表达异己习俗的扩展或侵入，并避免“乘隙”这一无原文根据的意思。
lexical_decisions:
- source_word: ἀκμή
  choice: 盛行到这种地步
  rationale: 该词表示发展达到鼎盛或高峰；结合 οὕτως，以自然汉语表达希腊化已达到极盛程度。
- source_word: Ἑλληνισμός
  choice: 希腊化
  rationale: 指采纳希腊文化、制度和生活方式的历史进程，不仅指希腊族群身份；“希腊化”保留其历史特指。
- source_word: πρόσβασις
  choice: 日益蔓延
  rationale: 在此表示向前扩展、侵入；“日益蔓延”既体现增长，也与作者负面的文化评价相符。
- source_word: ἀλλοφυλισμός
  choice: 异族习俗
  rationale: 这个罕见词指非本族、尤其非犹太人的生活习俗；译法清楚而不把范围过度限定。
- source_word: διὰ
  choice: 都是因为
  rationale: 后接宾格表示原因；“都是因为”清楚连接前述局面与雅孙的行为。
- source_word: ἀσεβοῦς
  choice: 不敬虔
  rationale: 表达对上帝及神圣义务的不敬，保留宗教和道德谴责。
- source_word: οὐκ ἀρχιερέως
  choice: 根本不配称为大祭司
  rationale: 原文以强烈反语式并列否认雅孙的大祭司身份正当性；此译保留作者的尖锐斥责，同时避免被误解为单纯说明他未任职。
- source_word: ὑπερβάλλουσαν ἀναιδείαν
  choice: 极其无耻
  rationale: 以现代汉语自然传达强化词与“无耻、厚颜”的道德谴责。
theological_decisions:
- issue: οὐκ ἀρχιερέως 对雅孙身份的否定力度
  choice: 根本不配称为大祭司
  alternative: 并非大祭司；算不得大祭司
  rationale: 上下文并非中性陈述职位，而是作者否定雅孙祭司身份的正当性。译文保留这种论断，但不另行规定其合法性所依据的具体神学制度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“希腊化”保留历史术语，“异族习俗”帮助普通读者理解；句式体现原文强烈的谴责语气。
