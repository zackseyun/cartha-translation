base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/017.yaml
  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: zh_hans
  text: 因为违背上帝的律法而行不敬虔的事，并非易事[a]；随后的时日会将这些事显明出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并非小事。”希腊语“不容易”在此也可带有“不可轻忽、后果不轻”的意味；“行不敬虔的事”指以不敬上帝的方式行事。
    reason: 保留 ἀσεβεῖν 与 οὐ ῥᾴδιον 的基本词义，以及“并不容易”与“并非轻忽之事”两种可成立的语力。
  - marker: b
    text: 或译：“随后的时期会将这些事显明出来。”
    reason: 保留 ὁ ἀκόλουθος καιρός 的时间含义，以及 ταῦτα（“这些事”）未明确限定的指涉。
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: 做不敬虔的事
  rationale: 该不定式指向对上帝不敬、悖逆的行为，不只是内在态度；“做不敬虔的事”保留其宗教伦理色彩，并以现代汉语明确表达具体行为。
- source_word: εἰς τοὺς θείους νόμους
  choice: 违背上帝的律法
  rationale: εἰς 在此表达行为所针对的对象；θείους 在犹太语境中指属于上帝的，νόμους 为复数。汉语“上帝的律法”可自然涵盖这一复数整体，而“违背”传达针对律法的不敬行为。
- source_word: οὐ ῥᾴδιον
  choice: 并非小事
  rationale: 字面可译“并不容易”，但上下文强调这种行为并非轻易可为、不会无关紧要，后续事件将显出其严重性。“并非小事”在现代汉语中保留警诫力度，同时以脚注保留字面可能。
- source_word: ὁ ἀκόλουθος καιρός
  choice: 随后发生的事
  rationale: 字面为“随后的时日/时期”。在叙事语境中，它指接下来时间里发生的事件；此译自然表达时间推进，同时不把它解释为末世性的将来。
- source_word: δηλώσει
  choice: 必会把这一点显明出来
  rationale: 该动词意为“使清楚、表明、揭示”。“显明出来”保留未来的揭示作用；“这一点”回指前述原则，符合中性复数 ταῦτα 在汉语中的自然表达。
theological_decisions:
- issue: “违背上帝律法并不容易”的语力
  choice: 译作“并非小事”，表达这种不敬虔行为绝非轻微或无关后果之事，后续事件将显出其严重性。
  alternative: 较字面地译作“并不容易”，理解为这种行为在实践上难以施行。
  rationale: οὐ ῥᾴδιον 本可直译“并不容易”，但与“随后……显明”相接时更像带警告意味的习语。正文传达其道德分量，脚注保留字面歧义，且不直接增添“上帝审判”等原文未明说的内容。
- issue: 后续显明的内容
  choice: 以“这一点”回指违背上帝律法并非小事这一原则。
  alternative: 将“这些事”理解为随后叙述的一系列具体事件。
  rationale: ταῦτα 可回指前述陈述，也可指相关诸事。汉语正文采用自然的概括性回指，脚注提供较贴近形式的译法，以保留指涉范围的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝的律法”符合犹太语境；“并非小事”传达警诫语气，但用脚注保留“并不容易”的字面读法。正文中的脚注标记按相关内容依次排列。
