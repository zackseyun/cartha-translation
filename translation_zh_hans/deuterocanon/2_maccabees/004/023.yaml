review_pass:
  verdict: revise
  source_fidelity: 译文基本准确传达了 χρονικά、差遣、亲属关系、款项及行政文书的内容。但“把款项送交王，并办妥……”在汉语句法上易读成雅松亲自送交并办妥，而非默涅劳受派执行这两项任务；应明确两项不定式／分词性任务均属默涅劳。
  naturalness: 原句虽可理解，但“雅松派……默涅劳，把……”的停顿和逗号造成任务施事的歧义。改为“差遣……，要他将……并办理……”更自然清楚，且保持庄重叙事语体。
  terminology: “雅松”“西门”“默涅劳”符合既有希腊式人名音译。“王”“款项”合宜。“书面呈报”可用，但“办理有关必要事务的书面呈报”可能误指办理事务本身；改为“办理有关必要事务的书面文书”较准确地把 περὶ πραγμάτων ἀναγκαίων 限定于文书内容。保留脚注以说明文书性质及 τελέσοντα 的不确定性。
  issues:
  - severity: medium
    issue: 任务施事存在句法歧义
    rationale: 原文的 παρακομίζοντα 与 τελέσοντα 同为修饰 Μενέλαον 的分词，说明雅松派遣默涅劳所承担的两项任务。汉译在“默涅劳”后用逗号接“把款项送交王，并办妥……”，容易使后半句误附于主语“雅松”。
  - severity: low
    issue: “书面呈报”与“有关必要事务”的搭配略不清晰
    rationale: 希腊文是“有关必要事务的文书／备忘录”，不是泛指对事务作呈报；“书面文书”保留行政文书的宽泛性，避免预断其为呈文。
