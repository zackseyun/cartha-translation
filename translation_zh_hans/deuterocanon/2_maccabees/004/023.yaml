- from: 过了三年，雅松派先前提到的西门的兄弟默涅劳，把款项送交王，并办妥有关必要事务的书面呈报。[a]
  to: 过了三年，雅松差遣先前提到的西门的兄弟默涅劳，要他把款项送交王，并办理有关必要事务的书面文书。[a]
