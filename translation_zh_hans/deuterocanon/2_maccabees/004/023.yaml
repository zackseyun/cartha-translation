base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: zh_hans
  text: 过了三年，雅松差遣先前提到的西门的兄弟默涅劳，要他把款项送交王，并办理有关必要事务的书面文书。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书面文书”也可译作“备忘录”或“书面报告”；原文所指的具体行政文书并不确定。“办理”也可能含有完成或正式提交这些文书的意思。
    reason: 说明ὑπομνηματισμοὺς τελέσοντα的词义及行政语境存在不确定性。
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: 过了三年
  rationale: μετά加宾格表示一段时间之后；此处δέ只是轻微承接，汉语叙事中不必硬译为“但是”。
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 在差遣某人执行具体任务的语境中，“派”比单纯的“送”更自然准确。
- source_word: Μενέλαον
  choice: 默涅劳
  rationale: 按希腊语人名Μενέλαος音译。
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: 先前提到的西门的兄弟
  rationale: 保留προσηνομένου回指前文的作用，同时采用现代汉语易懂的表达。
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: 把款项送交王
  rationale: 分词说明受派执行的任务；χρήματα在此指款项，“送交”也体现向王呈送之意。
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: 有关必要事务的
  rationale: 贴近原文，不把ἀναγκαίων过度限定为“紧急”，从而保留“必要”与“要紧”之间的语义空间。
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: 办妥……书面呈报
  rationale: ὑπομνηματισμός可指备忘录、书面报告或呈文，τελέω含完成、办妥之意；此译保留行政文书色彩而不强定具体文种。
