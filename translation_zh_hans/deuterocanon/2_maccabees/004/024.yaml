base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: zh_hans
  text: 可是，他被引见到王面前[a]以后，便以权势的威仪[b]颂扬王，结果为自己取得了大祭司的职分；他所出的价比雅宋多三百银他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被引见”也可译作“被举荐”；希腊文可能指在宫廷中受到正式引见或推荐。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“以权势的面貌（或临在）”。这是一句浓缩表达，可指权威的外在显现或威仪；其具体所指不甚明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: 被引见给王
  rationale: 被动分词表示有人把他带到王面前，可能包括正式引见或举荐的意思；“被引见给王”自然地保留宫廷场景，又不把具体方式说死。
- source_word: δοξάσας αὐτὸν
  choice: 颂扬王
  rationale: δοξάζω可表示使之得荣耀、尊崇或称颂。这里的αὐτόν最自然地回指王；“颂扬”保留政治性称誉的意味，却不像“奉承”那样预先断定其动机。
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: 以一副有权势的派头
  rationale: 原文直译近于“以权势的面貌/姿态”，是高度浓缩的表达。“一副有权势的派头”传达其显得威严、有势力的外在风度，同时保留这是表现出来的姿态。
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: 结果为自己取得了大祭司的职位
  rationale: 这一结构描写他使大祭司职分落到自己身上，即亲自获得该职位。“为自己取得”保留εἰς ἑαυτόν所含的自利指向。
- source_word: ὑπερβάλλων τὸν Ἰάσονα τάλαντα ἀργυρίου τριακόσια
  choice: 他所出的银子比雅宋多三百他连得
  rationale: ὑπερβάλλων本义是超过；结合银两数额和上下文，指他出价高过雅宋。译文明确交易语境，同时仍按原文保留古代重量兼货币单位“他连得”。
theological_decisions:
- issue: 米尼老颂扬王这一行为的道德色彩
  choice: 译作“颂扬王”，不直接译成“奉承王”
  alternative: 奉承王
  rationale: 叙事语境显示政治钻营，但δοξάζω本身不必然含虚伪奉承之意。采用较中性的“颂扬”，让上下文呈现其动机和道德评价。
- issue: τῷ προσώπῳ τῆς ἐξουσίας的压缩意象
  choice: 译作“以一副有权势的派头”
  alternative: 以权势的面貌；凭权威的风度
  rationale: 这不是教义争点，但原文表达含混。所选译法兼顾现代可读性和“面貌/姿态”的外在表现意味，不把它具体化为某种正式职权。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王”符合次经历史叙事的简洁称谓；“他连得”保留古代单位，避免换算为不确定的现代金额。两个脚注标记均已在正文对应位置出现。
