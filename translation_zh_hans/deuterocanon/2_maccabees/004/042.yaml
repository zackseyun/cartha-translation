base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/042.yaml
  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: zh_hans
  text: 众人也察觉到吕西马科发动了袭击[a]，有的抓起石头，有的拿起粗木块[b]，还有的从旁边的灰烬里抓起一把把灰，一股脑儿地朝吕西马科身边的人[c]投掷过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察觉到吕西马科发动了袭击”也可译作“知道吕西马科的袭击”。希腊语分词既可静态地表示“知道”，也可按上下文动态地理解为“察觉到”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“木料的厚块”，即粗厚的木块。
    reason: lexical_alternative
  - marker: c
    text: “吕西马科身边的人”可能指与他同行的人、随从或支持者；原文没有进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  choice: 察觉了
  rationale: 分词可表示“知道、意识到”；结合叙事中众人随即反应的语境，“察觉了”自然传达动态意味，同时以脚注保留较静态的理解。
- source_word: ἐπίθεσιν
  choice: 袭击
  rationale: 此处指吕西马科一方采取的暴力行动；“袭击”保留敌对和突发色彩。
- source_word: συναρπάσαντες
  choice: 抓起
  rationale: 表达仓促而有力地拿起身边可用之物，符合现场紧迫的动作。
- source_word: ξύλων πάχη
  choice: 粗木块
  rationale: 原文直指有厚度或粗大的木料；“粗木块”避免擅自具体化为棍棒或木梁。
- source_word: σποδοῦ
  choice: 灰烬
  rationale: 该词通常指灰烬；不译作“尘土”，以保留原文具体意象，也不暗示仍在燃烧。
- source_word: δραξόμενοι
  choice: 抓起一把把灰
  rationale: 该分词有用手抓取、按把拿取之意；中文用“一把把”呈现动作方式。
- source_word: φύρδην
  choice: 乱纷纷地
  rationale: 该副词含混杂、杂乱或不分对象地行动之意；“乱纷纷地”既保留现场混乱感，也与多种东西一同投掷的画面相合。
- source_word: ἐνετίνασσον
  choice: 投向
  rationale: 未完成时态描绘持续或反复投掷；上下文已显明暴力场面，“投向”自然且不过度增添力度。
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: 吕西马科周围的人
  rationale: 贴近原文结构，不径直断定这些人是部下、随从或支持者。
