base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/036.yaml
  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: zh_hans
  text: 他们因那人遭不义杀害而愤慨，又深感悲痛。王从基利家一带回来后，城中的犹太人便向他申诉；希腊人也一同憎恶这恶行[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句结构紧凑，也可理解为：“希腊人也一同憎恶这恶行。”这句话明确说希腊人共同憎恶恶行，但他们是否也和犹太人一起向王申诉，句法上并不完全确定。
    reason: 保留καὶ τῶν Ἑλλήνων与罕见分词συμμισοπονηρούντων之间的句法和词义弹性。
lexical_decisions:
- source_word: ἐδείναζον
  choice: 义愤填膺
  rationale: 该动词表达强烈的痛苦、愤慨；与后面的ἐδυσφόρουν并列时，侧重对不义之事的道德义愤。
- source_word: ἐδυσφόρουν
  choice: 深感悲痛
  rationale: 该词表示难以承受、苦恼或不安；此处与“义愤填膺”互补，呈现悲痛而非重复表达愤怒。
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: 对这人遭到不义的杀害
  rationale: φόνος指杀人、凶杀，ἄδικος明确指出其不义；用“遭到不义的杀害”在现代汉语中自然，并保留原文的道德谴责。
- source_word: ἐπανελθόντος
  choice: 回来后
  rationale: 属格独立结构在此表达时间背景，译作“回来后”简洁自然。
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: 基利家的各地
  rationale: 原短语泛指基利家境内或一带的地方；“各地”保留其复数和地域广度。
- source_word: ἐνετύγχανον
  choice: 向他申诉
  rationale: 该词用于百姓接近统治者陈情、请愿；“申诉”符合本段控诉不义谋杀的语境，宾语“他”由王这一先行对象自然补出。
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: 城里的犹太人
  rationale: 直指居住在该城中的犹太人，表达自然明确。
- source_word: συμμισοπονηρούντων
  choice: 和他们一同痛恨这桩恶行
  rationale: 这一罕见复合分词含有共同憎恶邪恶或恶行之意；译文保留共同参与和道德憎恶两层含义，同时用脚注说明句法上的压缩与歧义。
- source_word: καὶ τῶν Ἑλλήνων
  choice: 希腊人也
  rationale: καί表示希腊人同样参与；其与分词构成属格结构，最稳妥地理解为他们也共同厌恶恶行，但是否同时申诉可有不同句法理解。
