  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
translation:
  language: zh_hans
  text: 米尼老留下自己的兄弟吕西马科，作为大祭司职分的继任者；索斯特拉托则留下克拉特，即那位负责塞浦路斯人的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位管理塞浦路斯人的人”或“塞浦路斯人的总督”。希腊原文没有明确说明其确切的行政职衔。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: 留下
  rationale: 基本义为“留下、留在身后”；上下文借后续补语说明所留之人代行或接任职务，不直接译成“任命”，以免增添原文没有明说的正式任命含义。
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: 接替大祭司的职分
  rationale: διάδοχον指接任者、继任者，ἀρχιερωσύνης指大祭司的职位；此译自然地表达职务承接关系。
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: 自己的兄弟
  rationale: 保留ἑαυτοῦ的反身和强调意味，表明吕西马科是米尼老本人的兄弟。
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: 那位管理塞浦路斯人的官员
  rationale: ἐπὶ τῶν Κυπρίων表示此人居于塞浦路斯人之上或负责管理他们；补出“官员”使现代汉语通顺，但不把其具体行政头衔确定为“总督”。
