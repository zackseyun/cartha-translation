base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/014.yaml
  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: zh_hans
  text: 以致祭司们不再热心从事祭坛的职事，反而轻视圣殿，疏忽献祭；在掷铁饼项目的召集之后[b]，他们急忙去参与角力场中那项违法的供给[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给”所译的希腊语含义较难确定，也可理解为“资助”、“津贴”或“所供费用”，可能指与竞技活动有关的供应或资助。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在铁饼的召集之后”，指召集人参加掷铁饼项目的呼唤。
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: 职事
  rationale: 在本节祭司与祭坛的礼仪语境中，指祭司在祭坛前履行的宗教职务；“职事”既保留礼仪和职责意味，也避免使用过于现代行政化的说法。
- source_word: προθύμους
  choice: 热心
  rationale: 该词表示甘愿、积极和热切；“热心于”自然地呈现祭司原本应有却已失去的态度。
- source_word: νεὼ
  choice: 圣殿
  rationale: 此处指耶路撒冷圣殿；“圣殿”是现代中文圣经语体中清楚而庄重的称呼。
- source_word: καταφρονοῦντες
  choice: 轻视
  rationale: 该词含有鄙弃、蔑视之意，不只是被动忽略；“轻视”保留了叙述者的道德批判。
- source_word: ἀμελοῦντες
  choice: 疏忽
  rationale: 表示不加照管、不予应有注意；与后面的献祭搭配自然，并与较强的“轻视”形成层次。
- source_word: τῶν θυσιῶν
  choice: 献祭
  rationale: 在圣殿语境中可指祭物或献祭之事；“疏忽献祭”自然地表达他们怠忽祭祀职责，而不强行限定为祭物本身。
- source_word: παλαίστρῃ
  choice: 角力场
  rationale: παλαίστρα 特指摔跤、角力及相关体育训练的场所；“角力场”比泛称“体育馆”更准确，也适合古代语境。
- source_word: παρανόμου χορηγίας
  choice: 违法的供给
  rationale: χορηγία 可指供应、资助或所供费用，具体所指并不确定；“供给”保留这种词义上的开放性。παράνομος 译作“违法”，保留负面判断，却不在正文中断定它专指民法、道德律或摩西律法。
- source_word: ἔσπευδον μετέχειν
  choice: 急忙……参与
  rationale: 同时表达 ἔσπευδον 的急切行动和 μετέχειν 的参与含义，使叙事保持动态。
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: 铁饼项目的召集一发出
  rationale: δίσκος 在竞技语境中指掷铁饼项目，πρόσκλησις 指召集或呼唤；此译自然呈现该呼唤发出后祭司立即赶去的时间关系。
theological_decisions:
- issue: παρανόμου 所指的“违法”性质
  choice: 正文仅译为“违法”，不具体说明违反哪一种法律
  alternative: “违背律法的”、“不敬虔的”或“违反祖传律法的”
  rationale: 上下文显然从犹太祖传律法与祭司职责的立场谴责这种参与，但希腊词本身较宽泛。采用“违法”可保留作者的否定判断，又不把可能的律法背景变成正文中明说的唯一解释。
- issue: χορηγίας 的具体所指
  choice: 采用较宽泛的“供给”，并以脚注说明可能含义
  alternative: “竞技活动”、“资助”、“津贴”或“费用”
  rationale: 原词在此处含义困难，可能涉及竞技活动的供应、资助或费用。正文不将其确定为单纯的体育活动，以免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“祭坛的职事”、“圣殿”和“献祭”保留圣殿礼仪背景；“角力场”交代古代竞技场所。正文保留 παρανόμου χορηγίας 的词义张力，不把它过度解释成某一种确定的竞技活动或法律类别。
