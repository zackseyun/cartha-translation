  yaml_path: translation/deuterocanon/2_maccabees/004/006.yaml
  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: zh_hans
  text: 他之所以这样考虑，是因为他看出：若没有王室的干预[a]，局势就不可能实现和平；西门也不会停止他的愚妄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王室的干预”所译的希腊语可指王室的预见、关照、安排或支持；在这里的政治语境中，侧重王权为使局势实现和平而实际介入。
    reason: lexical_alternative
  - marker: b
    text: “不会停止他的愚妄”直译为“不会从他的愚妄中得到停歇”，意思是他不会停止这种愚妄行径。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπῶν
  choice: 他这样思量
  rationale: 以分词形式承接上一节，保留其“思量、审察”的动作，同时用“这样”自然指回前文。
- source_word: βασιλικῆς προνοίας
  choice: 王室的干预
  rationale: πρόνοια本可指预见、关照或安排；在此政治语境中，指王权方面为平息事态而采取的实际介入。
- source_word: τυχεῖν εἰρήνης ἐπὶ τὰ πράγματα
  choice: 局势……恢复平静
  rationale: τυχεῖν εἰρήνης表示得享或达到和平，τὰ πράγματα指当前事态；合译为“局势恢复平静”符合现代汉语，也保留结果意味。
- source_word: παῦλαν οὐ λημψόμενον
  choice: 不会停止
  rationale: 字面为“不会得到停歇”，结合属格τῆς ἀνοίας，实际表示西门不会停止这种行为。
- source_word: ἀνοίας
  choice: 愚妄
  rationale: 该词表示缺乏理性、愚昧或荒唐；“愚妄”保留叙述者的道德评断，又避免译成临床意义的“疯狂”。
