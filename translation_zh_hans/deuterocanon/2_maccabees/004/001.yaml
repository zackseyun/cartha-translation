base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: zh_hans
  text: 可是，前面提到的西门，已成了告发钱财和祖国的人；他不断诋毁敖尼雅，声称敖尼雅才是唆使赫利奥多洛、并成为祸患肇因的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些恶事的肇因。”希腊语可广泛指有害的事件或祸患，不一定只指道德上的邪恶。
    reason: 说明 τῶν κακῶν 的语义范围，并保留较贴近字面的另一种译法。
lexical_decisions:
- source_word: προειρημένος
  choice: 前面提到的
  rationale: 明确承接上文，语言自然，不采用较文言的“上述”。
- source_word: ἐνδείκτης
  choice: 告密者
  rationale: 表达向敌对方面告发、提供不利情报的含义；与“出卖钱财和祖国”连用，可传达原文带敌意且略显特殊的属格结构。
- source_word: τῶν χρημάτων
  choice: 钱财
  rationale: 保留原词较宽泛的含义，不在本节内擅自明确为“圣殿资金”。
- source_word: τῆς πατρίδος
  choice: 祖国
  rationale: 自然传达 πατρίς 的故土与国家归属意味。
- source_word: ἐκακολόγει
  choice: 不断诋毁
  rationale: “诋毁”体现恶言中伤；“不断”传达未完成过去时所表示的持续或反复动作。
- source_word: ἐπισεσυκώς
  choice: 唆使了
  rationale: 表达煽动、怂恿赫利奥多洛采取行动的指控，比一般的“激怒”更符合此处使人行动的语境。
- source_word: τῶν κακῶν δημιουργός
  choice: 这些祸患的制造者
  rationale: “祸患”既可指灾祸、恶果，也避免把 κακά 限定为纯粹道德意义上的“恶”；“制造者”保留 δημιουργός 的主动致成意味。
- source_word: καθεστηκώς
  choice: 成了
  rationale: 自然表达已经成为或被视为某种角色的完成状态。
- source_word: ὡς
  choice: 硬说
  rationale: 在此引出西门带有诬蔑性质的说法，表明后文是他的指控，而非叙述者确认的事实。
theological_decisions:
- issue: 西门指控的叙述立场
  choice: 用“硬说”明确这是西门的诬蔑性指控
  alternative: 直译为“仿佛”或“说是”
  rationale: ὡς 在这里引出所声称的理由；结合 ἐκακολόγει，译文应避免让读者误以为叙述者认可敖尼雅确实负有责任，同时不增添任何教派性判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“出卖钱财和祖国的告密者”保留原文不寻常的并列关系；人名按希腊语形式音译为“西门、敖尼雅、赫利奥多洛”。
