    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: 清楚得知
  rationale: 表达敖尼雅对事情已有明确、确切的认识，而非仅仅怀疑；中文将副词与分词自然合译。
- source_word: ἀπήνεγκεν
  choice: 把这事揭发了出来
  rationale: 此处动词宜理解为将所知之事报告或揭露出来；不与后面的ἀποκεχωρηκὼς合并，以保留原文中“揭发”与“退避”两个动作。
- source_word: ἀποκεχωρηκὼς
  choice: 便退到
  rationale: 完成时分词表示他已经离开原处、退避到安全地点；按现代汉语语序置于“揭发”之前。
- source_word: εἰς ἄσυλον τόπον
  choice: 进入一处不可侵犯的庇护地
  rationale: ἄσυλος强调不受侵犯、享有庇护性质的地点，可能兼具法律和宗教意味，故不只译作泛泛的“安全地方”。
- source_word: ἐπὶ Δάφνης τῆς πρὸς Ἀντιοχίας κειμένης
  choice: 到安提阿附近的达芙妮
  rationale: 自然表达达芙妮与安提阿相邻的地理关系，同时保留地点名称。
