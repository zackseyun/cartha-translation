lexical_decisions:
- source_word: καταντήσαντος
  choice: 到了
  rationale: 该词在此表示抵达某地；“到了”自然、准确，也与属格绝对结构的时间关系相合。
- source_word: γερουσίας
  choice: 公议会
  rationale: 指由长老组成、具有公共治理职能的议事机构；“公议会”比单纯的“长老会”更能传达其公共机构性质。
- source_word: τὴν δικαιολογίαν ἐποιήσαντο
  choice: 申诉
  rationale: δικαιολογία可指为己方作辩解、陈明理据或提出诉求；结合三人奉派向王陈情的语境，“申诉”简洁地保留了陈述案情并寻求公断的意味。
