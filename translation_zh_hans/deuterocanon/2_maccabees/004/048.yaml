base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: zh_hans
  text: 他将一切恶事的祸首米尼老从被告之中释放了；至于那些可怜的人——即使在斯基泰人[a]面前申辩，也会获释而不被定罪——他却判处他们死刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯基泰人在古希腊作者的描绘中常被视为严酷的民族。这里用以加强讽刺：这些人显然不应被定罪，甚至在被认为严酷的斯基泰人面前申辩，也会获释。
    reason: cultural_note
lexical_decisions:
- source_word: τὸν ... αἴτιον
  choice: 祸首
  rationale: 此处指对恶事负主要责任的人；“祸首”在中文中兼具因果与道德责任意味，也符合本节对审判不公的强烈对照。
- source_word: τῆς ὅλης κακίας
  choice: 一切恶事
  rationale: ὅλης表示整体和全面，κακία在此泛指邪恶行为及其祸害；“一切恶事”自然且保留宽泛的道德指控。
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: 从被告中释放了
  rationale: 保留ἀπολύω的“释放”含义及τῶν κατηγορημένων所指的被告群体，不将其过度限定为正式宣告无罪。
- source_word: ταλαιπώροις
  choice: 可怜的人
  rationale: 该词表达悲惨、令人怜悯的处境；“可怜的人”以现代中文自然传达叙述者的同情。
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: 即使在斯基泰人面前申辩
  rationale: ἐπὶ加属格在这里具有司法场景中的“在……面前”之意；ἔλεγον按语境理解为陈述案情或申辩。
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: 也会获释而不被定罪
  rationale: 同时保留ἀπελύθησαν的“获释”和ἀκατάγνωστοι的“不被定罪”，避免只译作“无罪释放”而压缩原文的双重表达。
- source_word: θάνατον ἀπέκρινεν
  choice: 判处他们死刑
  rationale: ἀποκρίνω在此指作出司法裁决；“判处……死刑”是现代中文清楚、自然的法庭用语。
