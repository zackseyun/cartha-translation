  text: In the one hundred forty-ninth year[a], it happened to those around Judas that Antiochus Eupator had arrived with forces against Judea,
translation:
  language: zh_hans
  text: 第一百四十九年，犹大身边的人得知[a]安条克·欧帕托已经带着大批军队前来攻打犹太地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为：“第一百四十九年，安条克·欧帕托已经带着大批军队前来攻打犹太地这件事，临到犹大身边的人。”此处希腊语动词既可指事情临到某人，也可引出传到某群体耳中的消息。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: 第一百四十九年
  rationale: 这是表示时间的与格结构，意为“在第一百四十九年”；中文纪年表达无须重复“年”。
- source_word: προσέπεσεν
  choice: 得知
  rationale: 本句中该动词与“犹大一行人”及后续报告内容相连，表示某事临到他们或进入他们的认知。“得知”符合现代汉语叙事习惯；脚注保留较偏事件性的理解。
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: 犹大一行人
  rationale: 该习语直指“犹大周围的人”，即与他同行或同属一方的人。“一行人”自然简洁，也不擅自限定为男性或正式军队。
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: 安条克·欧帕托
  rationale: 按人名加称号的结构音译，保留其标准王号形式。
- source_word: παραγεγόνα
  choice: 前来
  rationale: 完成式表达已经来到、且结果与当前情势相关；中文结合“得知”用“前来”即可自然传达这一行动。
- source_word: σὺν πλήθεσιν
  choice: 率领大军
  rationale: πλήθη字面为“众多的人群”，军事语境中指大批兵力。“大军”清楚传达规模与军事性质。
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: 攻打犹太地
  rationale: ἐπί加宾格在军事行进语境中带有敌对方向。“攻打”比单纯“前往”更准确呈现语境中的敌意。
