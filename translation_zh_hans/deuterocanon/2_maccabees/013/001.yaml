  verdict: revise
  source_fidelity: 译文正确传达了年份、犹大一方、安条克·欧帕托已经带兵向犹太地进军的基本信息。但“率领大军”比 σὺν πλήθεσιν（与大批军队一同）更明确地说他是统率者，宜改为“带着大批军队”。“得知”是可成立的解释性译法，但应将脚注紧邻该词，并以更自然、准确的方式保留 προσέπεσεν 的“事情临到／发生于”解读。
  naturalness: “犹大一行人得知”自然，但“犹大身边的人”更贴近原文的关系性表达，且不把该群体限定为同行队伍。改后的句子保持现代汉语历史叙事的简洁庄重。
  terminology: “安条克·欧帕托”保留原有人名处理。“犹太地”适合 Ἰουδαία 的地域称谓。“大批军队”准确对应军事语境中的 πλήθεσιν，避免“率领”所增加的统帅含义。
  issues:
