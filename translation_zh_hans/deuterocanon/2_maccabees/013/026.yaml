base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: zh_hans
  text: 吕西亚来到审判席前[a]，尽可能地为自己申辩[b]，说服并安抚了众人，使他们怀有善意，随后拔营返回安提阿。王的进攻和撤军[c]的事就这样结束了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判席”或译“台”或“讲坛”。
    reason: lexical_alternative
  - marker: b
    text: “尽可能地”所译的希腊文含义不很确定，也可理解为“恰当地”“充分地”或“在情势许可下”。
    reason: lexical_alternative
  - marker: c
    text: “进攻和撤军”或译“袭击和撤退”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν ἐπὶ τὸ βῆμα
  choice: 走上公堂
  rationale: προσέρχομαι表示走近或上前；βῆμα可指台、审判席或办理公共事务的公堂。结合吕西亚公开申辩的场景，译作“走上公堂”自然且保留司法或公共议事色彩。
- source_word: ἀπελογήσατο
  choice: 为自己申辩
  rationale: 中间语态常指当事人为自己辩护或申辩，现代汉语用“为自己申辩”准确而流畅。
- source_word: ἐνδεχομένως
  choice: 尽力
  rationale: 此副词语义较难确定，可表示适当地、足以成立地，或在条件许可范围内。译作“尽力”传达受情势限制而尽可能申辩的意思，同时以脚注保留其他可能。
- source_word: συνέπεισεν καὶ κατεπράϋνεν
  choice: 说服并安抚了众人
  rationale: 前者表示劝服或使信服，后者表示使平静、安抚。希腊文省略宾语，语境所指为在场众人，汉语明示“众人”以保证句意完整。
- source_word: εὐμενεῖς ἐποίησεν
  choice: 使他们转而怀有善意
  rationale: 直义为“使他们变得友善／有好感”。加入“转而”自然表现态度因劝说与安抚而改变，但不增添具体政治含义。
- source_word: ἀνέζευξεν εἰς Ἀντιοχίαν
  choice: 拔营返回安提阿
  rationale: ἀναζεύγνυμι在军事语境中可指拔营、启程。译文保留其军事行动色彩，并由目的地与上下文表达返回之意。
- source_word: ἐφόδου
  choice: 进攻
  rationale: ἐφόδος可指逼近、进军或攻击；本节总结王的军事行动，“进攻”最为直接。
- source_word: ἀναζυγῆς
  choice: 撤军
  rationale: 该词可指拔营、启程或军事撤离。与“进攻”并列时，“撤军”准确表达军队退出行动，又不暗示溃败。
- source_word: ἐχώρησεν
  choice: 就是这样收场的
  rationale: 此处总结整件事如何进展或告终。中文叙事以“就是这样收场的”较自然，也符合本章结尾语气。
theological_decisions:
- issue: 本节没有重大的教义争议，主要张力在司法场景及军事行动词汇的多义性。
  choice: 将本节译为吕西亚成功申辩、平息众人，继而拔营返回安提阿的历史叙事总结。
  alternative: 把βῆμα直译为“台”或“审判席”，把ἀναζυγή译为“撤退”或“拔营”。
  rationale: 所选译法根据上下文提供清晰叙事，同时用脚注保留原文词语确有的不同理解；“撤军”不把行动解释成战败溃逃。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“公堂”兼顾公共申辩场景与βῆμα的司法含义；“拔营返回”保留军事语境；结句以“收场”表达ἐχώρησεν的总结功能。所有脚注标记均已在正文按顺序出现。
