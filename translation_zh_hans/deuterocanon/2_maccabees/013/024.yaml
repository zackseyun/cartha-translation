lexical_decisions:
- source_word: ἐπεδέξατο
  choice: 友好地接纳
  rationale: 中间语态可表达欣然或善意接待，不只是一般意义上的“接受”；此译法保留其正面意味，同时不过度发挥。
- source_word: κατέλειπεν
  choice: 留下
  rationale: 保留该词“留下、留任”的基本意义；结合“作统帅”，上下文自然传达留任其负责该地的含义，而不直接改译为“任命”。
- source_word: στρατηγόν
  choice: 统帅
  rationale: 该词指军事统领或将领；“统帅”在现代汉语中清楚而庄重，也不强行限定更具体的官阶。
- source_word: ἀπὸ Πτολεμαΐδος ἕως τῶν Γεννήρων
  choice: 从多利买直到革尼人之地
  rationale: 译出辖区的范围。末尾名称的文本形态及地理所指不确定，因此采用贴近希腊文形式的音译，不勉强认定为某个已知地点。
- source_word: Ἡγεμονίδην
  choice: 赫革摩尼德
  rationale: 按希腊文人名音译，并采用适合现代普通话阅读的形式。
- source_word: Μακκαβαῖον
  choice: 马加比
  rationale: 这是人物称号或名称，采用中文圣经传统中通行且易懂的音译形式。
- source_word: Πτολεμαΐδος
  choice: 多利买
  rationale: 采用该古城在中文圣经语境中较通行的译名。
- source_word: Γεννήρων
  choice: 革尼人
  rationale: 原词可能是族名或地名相关形式，且所指不明；用保守音译保留源文的不确定性。
