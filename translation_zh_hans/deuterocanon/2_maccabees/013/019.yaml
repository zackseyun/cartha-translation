  yaml_path: translation/deuterocanon/2_maccabees/013/019.yaml
  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: zh_hans
  text: 他在伯夙拉[a]进攻犹太人的一座小堡垒[b]，却被击退，又遭遇挫败，力量也逐渐削弱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯夙拉”也可译作“伯夙珥”；希腊文将这个地名写作 Βαθσούρα（本节经文中为其变格形式 Βαθσούροις）。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可理解为“据点”或其中的“守军”；希腊词 φρούριον 可指设防之处，也可指驻守其中的军队。
    reason: lexical_alternative
  - marker: c
    text: 原文连续使用几个简短动词，逐层描写他被击退、遭遇挫败，并逐渐衰弱。最后一项没有具体说明究竟是哪一方面被削弱。
    reason: literary_structure
lexical_decisions:
- source_word: Βαθσούροις
  choice: 伯夙拉
  rationale: 按希腊文地名 Βαθσούρα 的形式音译；这是现代中文圣经传统中可辨识且自然的地名写法。
- source_word: φρούριον
  choice: 堡垒
  rationale: 该词首先指设防的军事据点，也可转指其中的守军。这里用“堡垒”保留其地点或设施层面的基本含义，并在脚注注明另一可能。
- source_word: ὀλίγον
  choice: 小
  rationale: 作 φρούριον 的定语，最自然地表示堡垒规模小，也可能暗示其防守力量有限。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 忠实保留属格关系，表示该堡垒属于或由犹太人据守，不额外限定具体关系。
- source_word: προσῆγεν
  choice: 进攻
  rationale: 该动词本义可指向前推进或率军逼近；在此军事语境中，“进攻”自然表达其针对堡垒采取攻势，同时不加入原文未明说的兵种或行动细节。
- source_word: ἐτροποῦτο
  choice: 被击退
  rationale: 中间或被动形式表达战势逆转、被迫退却；“被击退”明确而不过度渲染为全军溃败。
- source_word: προσενέκρουσεν
  choice: 受阻挫
  rationale: 该词有撞上障碍、遭遇阻力之意；“受阻挫”既表现推进受阻，也避免与前面的“被击退”完全重复。
- source_word: ἡλαττονοῦτο
  choice: 兵力也渐渐削弱
  rationale: 动词表示变少、降低或衰弱；未完成时态适合译出持续过程。“兵力”由军事上下文补明，但不具体断定是伤亡、士气还是装备损失。
