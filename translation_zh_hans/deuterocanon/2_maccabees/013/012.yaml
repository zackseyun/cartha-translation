base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: zh_hans
  text: 众人一同照样做了，连续三天禁食、哀哭、俯伏在地，恳求满有怜悯的主。之后，犹大勉励他们，命令他们前来集合。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “前来集合”也可译作“前来”或“到场”。这个希腊语动词指来到或在场；结合这里的军事背景，也可能含有奉命到场待命的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: 众人一同照样做了
  rationale: 该属格独立结构交代犹大随后行动之前的共同举动；“照样”承接上文，“众人一同”保留 πάντων 与 ὁμοῦ 的集体意味。
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: 恳求怜悯人的主
  rationale: καταξιόω 通常可指“视为配得”，但在哀哭、禁食和俯伏的祈求语境中，表示恳切求告较为合适；译文不将其生硬处理为“认为主配得”。
- source_word: τὸν ἐλεήμονα κύριον
  choice: 怜悯人的主
  rationale: ἐλεήμων 表示有怜悯、慈悲；“怜悯人的”自然保留其施怜悯者的性质，κύριος 译作“主”。
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: 禁食、哀哭、俯伏在地
  rationale: 三个名词均作为恳求时相伴的行动。中文以自然次序表达；νηστειῶν 虽为复数，但结合三日持续时间，译作集合性“禁食”更符合现代汉语；πρόπτωσις 明示身体俯伏。
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: 连续三天
  rationale: ἐπὶ 加宾格表示持续时段，ἀδιαλείπτως 表示不中断；“连续三天”简洁保留二者的合力。
- source_word: παρακαλέσας αὐτοὺς
  choice: 犹大勉励他们
  rationale: παρακαλέω 可表示劝勉、鼓励或敦促；在共同祈求之后、采取行动之前，“勉励”兼顾鼓舞与劝告。
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: 命令他们前来集合
  rationale: παραγίνομαι 的核心义是来到、到场；“前来集合”在此军事背景中自然表达奉命到场，又不直接加入希腊文未明说的“做好准备”。
theological_decisions:
- issue: κύριον 的译法
  choice: 主
  alternative: 主人；统治者
  rationale: 本处对象是受祈求的上帝，“主”既符合敬虔语境，也不增添原文以外的教义限定。
- issue: καταξιόω 在祈祷语境中的含义
  choice: 恳求
  alternative: 认为……配得
  rationale: 周围的哀哭、禁食和俯伏表明这是恳切求告；采用语境义，同时承认该动词通常具有“认为配得”的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将较长的希腊语属格独立结构分成两句，避免中文句子过度拖长；保留祈求过程的强烈身体性与持续性。
