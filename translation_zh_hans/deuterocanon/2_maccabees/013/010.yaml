  yaml_path: translation/deuterocanon/2_maccabees/013/010.yaml
  text: And when Judas learned these things, he ordered the multitude to call upon the Lord day and night, that, as at other times, so now also he might come to their aid,
translation:
  language: zh_hans
  text: 犹大得知这些事后，就吩咐众人昼夜呼求主，求他像从前一样，如今也前来援助他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  choice: 得知
  rationale: 此处分词表示接获并知悉消息；“得知”在现代汉语叙事中自然准确，也不额外说明消息来源。
- source_word: παρήγγειλεν
  choice: 吩咐
  rationale: 保留权威性的指令语气，同时比“命令”更符合宗教历史叙事中的自然表达。
- source_word: τῷ πλήθει
  choice: 众人
  rationale: 指犹大所带领或聚集的群体；“众人”兼顾集合意义、庄重语体和现代可读性。
- source_word: διʼ ἡμέρας καὶ νυκτός
  choice: 昼夜
  rationale: 简洁表达持续不断地祈求，与希腊文“白日和夜间”的惯用说法相当。
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: 呼求主
  rationale: “呼求”保留向上帝祷告、恳求的圣经语感；κύριος 在此祷告语境中译作“主”。
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: 像从前一样，如今也
  rationale: 此结构回顾主以往的援助，并求他现在同样施助；该译法传达其比较和延续意味，同时避免生硬直译为“如果曾在别的时候”。
- source_word: ἐπιβοηθεῖν
  choice: 前来援助他们
  rationale: 兼顾“帮助”与在危急中赶来救援的动态意味；补出“他们”是汉语中由语境自然确定的受助对象。
theological_decisions:
- issue: 祷告语境中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处所呼求的是上帝；“主”保留犹太希腊语经文中的宗教和经文共鸣，而“主人”会带入不合语境的世俗主仆含义。
- issue: εἴ ποτε καὶ ἄλλοτε 的条件形式与比较含义
  choice: 像从前一样
  alternative: 如果以往曾经
  rationale: 希腊文表面带条件措辞，但在此祈求中修辞性地诉诸以往的神助；译作“像从前一样”自然呈现其语用意义，而不把它解释成对上帝是否曾帮助过的真实怀疑。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“昼夜呼求主”保留经文风格但不显陈旧；全句按汉语语序处理，并保留原文关于过去与现在神助之间的张力。
