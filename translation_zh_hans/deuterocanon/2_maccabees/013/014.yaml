base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: zh_hans
  text: 他把这事托付给世界的主[a]，又勉励同他在一起的人为律法、圣殿、城、祖国和国家制度[b]勇敢奋战，直至死亡；随后，他在摩底因附近部署军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世界”也可译作“宇宙”；希腊语κόσμος可指世界，也可指有秩序的整个宇宙。
    reason: lexical_alternative
  - marker: b
    text: “国家制度”所译的希腊语πολιτεία也可指“政体”、“公民共同体”或共同的生活秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ τὴν ἐπιτροπὴν
  choice: 他把这事托付
  rationale: ἐπιτροπή可指交由他人负责的事务、托付或管辖权。这里用“把这事托付”自然表达将当前军务交托给上主，且不把它过度限定为“结果”或行政性的“监督权”。
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: 给世界的主
  rationale: κύριος按圣经惯用语译作“主”；κόσμος可指世界或有秩序的宇宙，正文采用直接而自然的“世界”，并以脚注保留另一可能。
- source_word: παρακαλέσας τοὺς σὺν αὐτῷ
  choice: 又勉励跟随他的人
  rationale: παρακαλέω在此表示鼓舞、劝勉；τοὺς σὺν αὐτῷ泛指与他同行作战的人，不额外限定为某一军阶或组织。
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: 勇敢奋战，直至死亡
  rationale: 军事语境下ἀγωνίζομαι宜译为“奋战”；γενναίως表示勇敢、高尚地，μέχρι θανάτου直译为“直至死亡”，保留原文强烈程度。
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: 为各项律法、圣殿、城、祖国和国家制度
  rationale: περί在此表示为保护某事物而战。νόμων是复数，译作“各项律法”；ἱερόν依上下文指圣殿；πόλις保持为“城”，不擅加“圣”；πατρίς译作“祖国”；πολιτεία采用“国家制度”，同时以脚注说明其更宽的公民共同体及生活秩序含义。
- source_word: περὶ δὲ Μωδεεὶμ ἐποιήσατο τὴν στρατιάν
  choice: 随后，他在摩底因附近部署军队
  rationale: περί加地名表示周围或附近；ποιεῖσθαι στρατιάν在军事叙事中指组织、布置军队。“部署军队”保留主动整军布阵之意，不将原文明确缩窄为扎营。
theological_decisions:
- issue: 次经军事叙事中κύριος的译法
  choice: 主
  alternative: 主人；统治者
  rationale: “主”既体现上帝对世界的主权，也符合现代中文圣经的庄重惯用语，不加入宗派性解释。
- issue: πολιτεία所指的政治与共同生活层面
  choice: 国家制度
  alternative: 公民共同体；政体；生活秩序
  rationale: 该词可涵盖政体、公民共同体及其共同生活方式。“国家制度”在正文中清楚易懂，但脚注保留其较宽的语义范围，避免把它仅仅理解为成文宪法。
- issue: ἐπιτροπή所托付的内容
  choice: 这事
  alternative: 结果；权责；军务
  rationale: 原文没有明说所托付的是战事结果、管理权还是整个当前事务，因此以概括性的“这事”保存其含混性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“各项律法”体现希腊语复数；“直至死亡”保留原文力度；末句用“部署军队”呈现军事行动，同时避免将语义未经证实地限定为“扎营”。
