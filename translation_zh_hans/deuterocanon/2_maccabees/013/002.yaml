base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: zh_hans
  text: 与他同来的，还有监护人兼政务主管吕西阿斯[b]；他们各自率领一支希腊军队，包括步兵十一万[a]、骑兵五千三百、战象二十二头，以及镰刀战车三百辆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文为“步兵十一个‘万’”；“万”（myriad）是以一万为单位的计数，合计十一万名步兵。
    reason: 说明原文以“万”为计数单位，同时使正文采用自然的现代中文数字表达。
  - marker: b
    text: 或译“摄政者并掌管政务的人”。原文的两个职衔表示受托监护和行政权力，但未以无歧义的专门词确定其政治身份。
    reason: 保留 ἐπίτροπος 及 ἐπὶ τῶν πραγμάτων 在宫廷语境中的职衔解释空间。
lexical_decisions:
- source_word: σὺν αὐτῷ Λυσίαν
  choice: 与他同来的，还有……吕西阿斯
  rationale: 以自然的现代汉语表达同行关系，并按通行方式音译人名。
- source_word: τὸν ἐπίτροπον καὶ ἐπὶ τῶν πραγμάτων
  choice: 监护人兼政务主管
  rationale: ἐπίτροπος在宫廷语境中可指受托监护者或摄政者；ἐπὶ τῶν πραγμάτων表示掌管政务。正文保留“监护”这一较贴近词面的意义，并用脚注说明可能的职衔理解。
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: 他们各自率领一支希腊军队
  rationale: ἕκαστον同时涉及前文两人；“各自”保留这一语法意义。“率领”符合军队语境，Ἑλληνικήν译作“希腊”，不进一步限定其族裔构成。
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: 步兵十一万
  rationale: μυριάς为一万，十一万准确传达总数；现代中文直接换算比“十一个万”自然。脚注交代原文计数形式。
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: 骑兵五千三百
  rationale: 准确、简洁地表达骑乘部队及其人数。
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: 战象二十二头
  rationale: 上下文为军事编制，译作“战象”明确其用途；量词“头”符合现代汉语。
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: 装有镰刀的战车三百辆
  rationale: 直译δρεπανηφόρα“带有镰刀”，比可能陌生的术语“镰刀战车”更易懂，同时保留其结构特征。
theological_decisions:
- issue: 吕西阿斯的职衔
  choice: 监护人兼政务主管
  alternative: 摄政并掌管政务的人
  rationale: 原文职衔兼有受托监护与行政权力之意，但并未用一个毫无歧义的专门词明确规定其政治身份，因此正文不将其单一定义为“摄政”，脚注保留该可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；军事数字和单位按中文习惯表达。正文需补上职衔脚注标记[b]，使所有脚注均有对应标记。
