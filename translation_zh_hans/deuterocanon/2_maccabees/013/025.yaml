  yaml_path: translation/deuterocanon/2_maccabees/013/025.yaml
  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: zh_hans
  text: 他来到多利买。多利买人对和约的条款很不满，因为他们怕得厉害，想要废弃那些具体规定。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “具体规定”或译“约定事项”。这里的希腊词较少见，可能指和约中逐项列明的规定。现有希腊文本的来源校验被标记为存在重大不一致，因此个别词义的确定性低于通常情况。
    reason: lexical_alternative_and_textual_note
lexical_decisions:
- source_word: Πτολεμαΐδα / Πτολεμαεῖς
  choice: 多利买 / 多利买人
  rationale: 采用该城在中文圣经传统中通行的译名，并以“多利买人”自然表达当地居民。
- source_word: ἐδυσφόρουν
  choice: 很不满
  rationale: 该动词表示因某事烦恼、反感或难以接受；在和约语境中，“很不满”自然且不过度强化为愤怒。
- source_word: συνθηκῶν
  choice: 和约的条款
  rationale: 复数名词在此指协商达成的条件；结合政治军事语境，译作“和约的条款”比泛称“协议”更清楚。
- source_word: ἐδειλίαζον ... ὑπεράγαν
  choice: 怕得厉害
  rationale: 保留恐惧、胆怯之意及ὑπεράγαν的强烈程度，同时避免用“懦弱”直接加入过强的道德贬义。
- source_word: ἀθετεῖν
  choice: 废弃
  rationale: 表达取消、不再承认或不予履行已定规定的意图，符合协议语境。
- source_word: διαστάλσεις
  choice: 具体规定
  rationale: 该罕见名词在此很可能指和约中分别列明的规定或处置；“具体规定”清楚地与前文的总体条款衔接。
