base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/006.yaml
  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: zh_hans
  text: 在这里，凡犯了劫掠圣殿之罪[a]，或犯下其他特别严重恶行的人，众人都把他推向灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎圣殿之罪”。希腊语指对圣殿的侵犯，尤可指劫掠圣殿。
    reason: 说明该词的较宽译法，并保留其涉及劫掠圣殿的具体含义。
lexical_decisions:
- source_word: ἐνταῦθα
  choice: 在这里
  rationale: 保留原文指示地点的直接语气，并自然承接上文所述场所。
- source_word: ἱεροσυλίας
  choice: 劫掠圣殿之罪
  rationale: 该词具体指侵犯、抢掠神庙或圣殿；此译比笼统的“亵渎”更贴近其词义核心。
- source_word: ἔνοχον
  choice: 犯了……之罪
  rationale: 体现司法语境中“有罪、负罪责”的含义，同时符合现代汉语表达。
- source_word: ὑπεροχὴν πεποιημένον
  choice: 犯下……特别严重恶行
  rationale: 原短语含有超出一般程度、格外突出的意思；译作“特别严重”既保留程度差异，也避免生硬直译。
- source_word: τινων ἄλλων κακῶν
  choice: 其他……恶行
  rationale: κακά可指罪恶、恶事或罪行；“恶行”兼顾道德含义和具体行为。
- source_word: ἅπαντες
  choice: 众人都
  rationale: 准确表达所有在场者共同参与，且汉语自然。
- source_word: προωθοῦσιν εἰς ὄλεθρον
  choice: 都把他推向灭亡
  rationale: 保留προωθέω向前推、推送的动作意象，也保留εἰς所表达的趋向；“灭亡”涵盖ὄλεθρος所指的死亡与毁灭。
theological_decisions:
- issue: ἱεροσυλία的译法
  choice: 劫掠圣殿之罪
  alternative: 亵渎圣物之罪
  rationale: 原词明确涉及侵犯或劫掠神圣场所，不宜只用可能过于宽泛的神学术语“亵渎”；正文采用具体译法，脚注保留较宽的替代译法。
- issue: ὄλεθρος的结果含义
  choice: 灭亡
  alternative: 死亡
  rationale: “灭亡”保留该词既可指死亡又可指毁灭的语义幅度，避免把原文仅限于生理死亡。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“推向灭亡”保留原文具体的推动动作及其致命结果；句式以“凡……的人”为中心，使两个并列罪状及“众人都”的施事关系清晰。
