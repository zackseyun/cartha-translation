base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: zh_hans
  text: 默乃劳也加入了他们，并极其虚伪地不断劝说安条克；他这样做不是为了祖国的安危[a]，而是以为自己会被立为掌权者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖国的福祉”。
    reason: σωτηρία在这里既可强调安全、保全，也可泛指福祉。
  - marker: b
    text: 或译“会被任命掌权”或“会被立在官位上”。原文没有说明具体职位。
    reason: ἀρχή可指权柄、统治或职位，语义范围不宜在正文中限定得过窄。
lexical_decisions:
- source_word: συνέμιξεν
  choice: 同他们会合
  rationale: 该动词表示加入、与一群人联合；“会合”自然地表达默乃劳投身他们一方的叙事含义。
- source_word: παρεκάλει
  choice: 不断怂恿
  rationale: 未完成时体现持续或反复的动作；结合上下文，“怂恿”传达他一再推动安条克采取行动的意味。
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: 极其虚伪地
  rationale: εἰρωνία在这里指掩饰真实动机、假意行事，并非现代汉语通常所说的修辞性“讽刺”；“虚伪”清楚保留其道德意味。
- source_word: σωτηρίᾳ τῆς πατρίδος
  choice: 祖国的安危
  rationale: σωτηρία在此涉及国家的安全、保全或福祉，而非专门的神学性“救恩”；“安危”符合政治处境，也保留关乎存亡的力度。
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: 会被立在掌权的位置上
  rationale: κατασταθήσεται表示被设立，ἀρχή可指权柄、统治或职位；此译法保留“被设立”与“掌权”两层意思，同时不把具体职衔说死。
theological_decisions:
- issue: εἰρωνία对默乃劳动机的道德刻画
  choice: 译为“极其虚伪地”
  alternative: “百般掩饰地”或较直译的“带着极大的反讽”
  rationale: 上下文明确对照他表面的劝说与谋取权位的真实动机；现代汉语“反讽”容易被理解为一种言语修辞，不能准确呈现其伪装和不真诚。
- issue: ἐπὶ τῆς ἀρχῆς所指权位的范围
  choice: 译为“掌权的位置”
  alternative: “官位”“统治权”
  rationale: 原文可以指职位或权柄，但没有明确限定具体官职或统治范围；采用较开放的表达，避免把含义缩窄为普通官职或扩大为最高统治权。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“默乃劳”“安条克”沿用常见次经人名译法；用“祖国”保留πατρίς的祖籍与共同体色彩。分号呈现原文由行为转入动机对照的结构，正文中的[a]、[b]均与脚注对应。
