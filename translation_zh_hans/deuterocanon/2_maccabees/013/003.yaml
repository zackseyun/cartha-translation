  rationale: 修订仅调整汉语表达及παρεκάλει的力度：以“加入了他们”替代较生硬的“同他们会合”，以“不断劝说”对应未完成时的持续劝导，并以“被立为掌权者”自然呈现被设立于权位的意思。保留“极其虚伪地”、祖国安全的对照、全部脚注锚点及原文对具体权位范围的开放性。
