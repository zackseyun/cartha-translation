base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/013.yaml
  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: zh_hans
  text: 他私下与长老们商议后，决定在王军侵入犹太地、控制那城之前，他们出去，靠上帝的帮助处理这件事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “处理这件事”也可译作“裁断局势”或“处理当前的事务”；希腊语原文含义较宽，可泛指对当前局势或事务作出裁决、加以处理。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν
  choice: 私下
  rationale: 该短语可表示“独自”或“私下”。因下文明确说他与长老们在一起，此处不宜译成独自行动，而应指不公开的会面。
- source_word: σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: 同长老们会面后
  rationale: 分词短语表示他与长老们聚集商议；“会面后”自然地表达其相对于主句决定的先行关系。
- source_word: ἐβουλεύσατο
  choice: 决定
  rationale: 该动词可指商议、谋划并作出决定；前面的会面已体现商议过程，因此正文用“决定”简洁准确。
- source_word: πρὶν εἰσβαλεῖν
  choice: 趁……还没有侵入……以前
  rationale: 在军事语境中，εἰσβαλεῖν 表示敌军进入或入侵；此译法也清楚呈现他们要抢先采取行动。
- source_word: τὸ στράτευμα τοῦ βασιλέως
  choice: 王军
  rationale: 简明自然地表达“王的军队”，符合现代汉语军事叙事。
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: 控制那城
  rationale: ἐγκρατεῖς 表示取得支配权或控制权；“控制”准确且符合现代汉语习惯。
- source_word: ἐξελόντας
  choice: 大家就出去
  rationale: 该分词为复数，指参与商议并准备行动的一方，而非只指主语一人；“大家”保留集体行动，同时不限定具体人员范围。
- source_word: κρῖναι τὰ πράγματα
  choice: 解决事态
  rationale: 该短语含义宽泛，可指判断、裁断或处理当前事务；“解决事态”保留其处理危机的概括性，不明确限定解决方式。
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: 靠上帝的帮助
  rationale: 这是表示手段或凭借的与格，强调行动有赖于上帝的帮助。
theological_decisions:
- issue: ἐξελόντας κρῖναι 的隐含行动主体
  choice: 以“大家”表达复数的集体主体
  alternative: 理解为他一人出去解决事态
  rationale: ἐξελόντας 是复数形式，较自然地指与他共同商议并行动的人。正文保留集体性，但不武断界定是否仅包括长老。
- issue: κρῖναι τὰ πράγματα 所指的解决方式
  choice: 不明确说明是交战、裁决还是其他处理方式
  alternative: 译为“出战决胜”或“裁断这些事”
  rationale: 希腊语本身较宽泛；译文保留其张力，避免把当时危机的解决方式缩窄为某一种行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王军”“那城”等措辞保持叙事简洁；“大家就出去”体现希腊语复数形式，同时避免过度指定行动成员。脚注标记置于所解释短语所在句末。
