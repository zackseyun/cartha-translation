base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: zh_hans
  text: 他进攻犹大一方的人，却败下阵来。他陷入绝境，便转而对付在安提阿的腓力，就是那个被留下主持政务的人；[a]他心慌意乱，又向犹太人求和，作出让步，并发誓接受一切公正的条件。[b]他便与他们和解，献上祭物，尊重圣殿和那地方，并显出仁厚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文十分简略，句法也较难确定；对于他究竟怎样处置或应对腓力，原文的确切含义并不清楚。
    reason: textual_variant
  - marker: b
    text: 也可译作“并就一切公正的事起誓”。这句话可能泛指一切合乎公正之事，也可能特指和议的合理条件。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν
  choice: 进攻
  rationale: 该动词在军事语境中表示攻击或发动攻势；“进攻”自然、明确。
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: 犹大一方的人
  rationale: 原文直指“犹大周围的人”，即犹大的同党或部众；此译既自然，又不把其身份过度限定为军队。
- source_word: ἥττων ἐγένετο
  choice: 败下阵来
  rationale: 这一表达在上下文中指战败；译文保留叙事语气，也符合现代汉语。
- source_word: μετέλαβεν
  choice: 转而对付
  rationale: 本句希腊文压缩且句法困难。该译表达其在绝境中针对腓力采取行动，却不擅自断定具体行动是逮捕、接管、联络还是别的举措。
- source_word: ἀπονοηθεὶς
  choice: 陷入绝境
  rationale: 分词表示绝望、走投无路或不知所措的状态；“陷入绝境”能自然承接前面的战败。
- source_word: τὸν Φίλιππον ἐν Ἀντιοχίᾳ τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: 在安提阿的腓力，就是那个被留下主持政务的人
  rationale: ἐπὶ τῶν πραγμάτων在此有管理政事的含义；“主持政务”简洁传达腓力受托的行政职责。
- source_word: συνεχύθη
  choice: 心慌意乱
  rationale: 被动形式表示陷入混乱、惊慌或困扰；“心慌意乱”兼顾内心震动与处境失序。
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: 向犹太人求和
  rationale: παρακαλέω可指恳求、呼吁；在随后让步、起誓、和解的外交语境中，“求和”清楚传达其实际意向。
- source_word: ὑπετάγη
  choice: 作出让步
  rationale: 该词可指服从、降服或屈从。此处不必暗示长期臣属关系，“作出让步”较符合议和过程。
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: 接受一切公正的条件
  rationale: δικαίοις可泛指一切公正之事，也可具体指和议中的合理条件；正文采用符合外交语境的后者，并以脚注保留前者。
- source_word: συνελύθη
  choice: 双方就此和解
  rationale: 该词在语境中表示敌对关系解除、达成和解；补出“双方”使汉语主语关系清楚，不改变事件内容。
- source_word: θυσίαν προσήγαγεν
  choice: 献上祭物
  rationale: 这是常见的礼仪性表达；“献上祭物”准确而不附加后来的教义含义。
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: 尊重圣殿和那地方
  rationale: ναός在此指耶路撒冷圣所建筑；“圣殿”是现代汉语中清楚、庄重的称呼。“那地方”保留原文对地点的另行强调。
- source_word: ἐφιλανθρώπησεν
  choice: 以仁厚相待
  rationale: 动词表示施以仁慈、宽厚待人；此译保留其主动表现善意的含义，同时避免擅自补明未明说的受惠对象。
theological_decisions:
- issue: ναός与献祭用语在次经历史叙事中的表达
  choice: 将ναός译为“圣殿”，将θυσίαν προσήγαγεν译为“献上祭物”
  alternative: 将ναός译为“圣所”，将献祭短语译为“献祭”
  rationale: 本节叙述对耶路撒冷敬拜场所采取的具体行动。“圣殿”和“献上祭物”符合历史礼仪语境，又不引入后世宗派性解释。
- issue: μετέλαβεν至συνεχύθη一段的压缩句法与含义不确定性
  choice: 译作“转而对付……；他心慌意乱”并加注说明
  alternative: 具体解释为抓住腓力、接获腓力的消息、与腓力交涉，或得知腓力反叛
  rationale: 现有希腊文本的搭配生硬，不能稳妥确定行动性质。正文保留叙事转折与针对腓力的行动，同时避免把某种文本重构当作确定原意。
- issue: ἐπὶ πᾶσι τοῖς δικαίοις所指范围
  choice: 正文按议和语境译为“一切公正的条件”
  alternative: 译为“一切公正的事”
  rationale: 条件性理解符合求和、让步、起誓及和解的连续动作，但原文也容许较宽泛的表达，因此以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。军事行动、政治危机、议和与礼仪行为依原文次序展开；对困难希腊文不作过度具体化。脚注标记均置于其实际说明的短语之后。
