  yaml_path: translation/deuterocanon/2_maccabees/013/017.yaml
  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: zh_hans
  text: 天色刚开始发亮时，这事已经发生了；这是因为主的保护很快来援助他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为主及时的援助和保护临到他。”希腊语中“援助”一词十分罕见，可能指及时的帮助或解救，也可能强调主的保护迅速来到。
    reason: 保留ἐπαρήγορασις的词义及其与σκέπη之间关系的不确定性。
lexical_decisions:
- source_word: ὑποφαινούσης ... τῆς ἡμέρας
  choice: 天刚开始破晓时
  rationale: 属格独立结构表示天光初现；“刚开始破晓”保留其起始意味，并符合现代汉语表达。
- source_word: τοῦτο ἐγέγονει
  choice: 这事已经成了
  rationale: ἐγέγονει表示相对于破晓时已经完成的事情；“已经成了”既体现先时性，也避免把结果说得过于具体。
- source_word: διὰ
  choice: 因为
  rationale: διὰ后接宾格，在此表达原因；译作“因为”自然明确。
- source_word: ἐπαρήγορασιν
  choice: 及时临到，帮助了
  rationale: 此罕见名词在语境中指及时的援助或解救；译文保留“及时”和“帮助”两层含义，同时以脚注说明其词义不确定性。
- source_word: αὐτῷ
  choice: 帮助了他
  rationale: 与格代词表示受益者；汉语用“帮助了他”自然表达这一关系。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος在此指上帝，按七十士译本传统和项目惯例译为“主”。
- source_word: σκέπην
  choice: 保护
  rationale: σκέπη可指遮蔽、庇护或保护；军事解救语境中“保护”最为自然，又不过度具体化。
theological_decisions:
- issue: 次经希腊叙事中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 本处指施行保护与解救的上帝；“主”既保持敬称，也延续七十士译本中 κύριος 的神学用法。
- issue: 主的介入与事件结果之间的关系
  choice: 因为主的保护及时临到，帮助了他
  alternative: 借着主给他的保护和及时援助
  rationale: διὰ在此最自然地表达因果关系，但ἐπαρήγορασις与σκέπη的组合较罕见；正文采用通顺的因果表达，脚注保留“及时援助/解救”与“保护”之间可能的修饰关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“天刚开始破晓”传达天光初现；“这事已经成了”保留原文的先时完成意味。正文不具体说明“这事”所指，沿用原文的指代。
