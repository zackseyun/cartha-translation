  yaml_path: translation/deuterocanon/2_maccabees/013/018.yaml
  text: But the king[a], having learned by experience the Jews’ boldness, tried to take the strongholds by stratagems[c][b],
translation:
  language: zh_hans
  text: 可是，王亲自领教了犹太人的勇猛[a]，便用计谋设法攻取那些据点[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲自领教了”直译为“取得了……的经验”。
    reason: lexical_alternative
  - marker: b
    text: “据点”直译为“地方”；也可译作“阵地”。上下文显示这些是受到防守的地点，但原文没有明确称其为堡垒。
    reason: lexical_alternative
  - marker: c
    text: “设法攻取”所译的希腊语动词在这里较难确定，也可理解为“攻击”或“进逼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: 亲自领教了
  rationale: 这个习语直译为“取得了……的经验”；“亲自领教了”自然地表达王经过实际交锋而有了切身体会。
- source_word: εὐτολμίας
  choice: 勇猛
  rationale: 该词表示勇于行动、敢于冒险的特质；“勇猛”适合军事语境，又不像“英勇”那样加入过强的褒义评价。
- source_word: κατεῖρασεν
  choice: 设法攻取
  rationale: 此处词形和语境所指的具体动作不十分明确，可能是攻击、进逼或企图夺取。“设法攻取”与后面的计谋相衔接，也不暗示已经成功占领。
- source_word: διὰ μεθόδων
  choice: 用计谋
  rationale: μεθόδων 在这里指经过筹划的策略或手段，而非泛泛的“方法”；“用计谋”符合军事叙事，且为现代汉语常用表达。
- source_word: τοὺς τόπους
  choice: 那些据点
  rationale: 该词字面是“那些地方”，但军事上下文表明所指是受到防守的地点；“据点”保留地点性质，又不把它们一概明确说成坚固堡垒。
theological_decisions: []
