  text: But Rhodocus, from the Jewish ranks, disclosed the secrets to the enemies; he was sought out and caught and imprisoned.
translation:
  language: zh_hans
  text: 可是，犹太队伍中的罗多古把秘密泄露给了敌人；他被追查、被抓获，并被囚禁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μυστήρια
  choice: 机密
  rationale: 此处指泄露给敌人的秘密情报或内部机密；“机密”在军事语境中自然，也保留原文复数所概括的内容。
- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: 犹太队伍中的
  rationale: τάξις可指队列、队伍或阵营；结合战争叙事译作“队伍”较贴切，不具体化为原文未明说的官阶或部队编制。
- source_word: προσήγγειλεν
  choice: 泄露给了
  rationale: 该动词基本义为报告、告知；对象是敌人且内容为机密，因此汉语用“泄露”准确呈现其背叛性质。
- source_word: ἀνεζητήθη
  choice: 被搜查出来
  rationale: 表达经过追查、搜寻而被发现，兼顾动词的强化形式和随后被捕的叙事次序。
- source_word: κατελήμφθη
  choice: 遭到逮捕
  rationale: 在追查后的司法或军事语境中表示被抓获；“逮捕”比单纯“抓住”更庄重自然。
- source_word: κατεκλείσθη
  choice: 被关押
  rationale: 表示被禁闭、拘禁；原文没有明确监禁地点，故不增译为“下在监里”。
