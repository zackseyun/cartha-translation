  yaml_path: translation/deuterocanon/2_maccabees/013/007.yaml
  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
translation:
  language: zh_hans
  text: 不法的米涅劳就这样丧命，甚至不得入土安葬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“甚至连土地也没有得到”；这里是说米涅劳甚至未获入土安葬。
    reason: 说明原文“未得土地”的字面措辞及其在死亡语境中的含义。
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: 就这样遭厄运
  rationale: μόρος可指命运、厄运或死亡的结局；τοιούτῳ回指上文所述的死法。“就这样遭厄运”既保留回指作用，也传达庄重而负面的语气。
- source_word: τὸν παράνομον
  choice: 这不法的
  rationale: παράνομος含有违背律法或法纪的法律—道德意味。“不法的”贴近原词，不泛化为仅指一般邪恶的“恶人”。
- source_word: συνέβη θανεῖν
  choice: 而死
  rationale: συμβαίνω加不定式表示某事临到或发生在某人身上。汉语借“遭厄运而死”自然表达这一结果关系，避免生硬直译成“碰巧死了”。
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: 连入土安葬也未能得到
  rationale: 字面为“连土地也没有得到”；死亡语境表明所指是未能葬入土中。正文显明这一惯用含义，脚注保留原文的简约表达。
- source_word: Μενέλαον
  choice: 米涅劳
  rationale: 采用该希腊人名Μενέλαος的现代汉语音译。
theological_decisions:
- issue: παράνομος对米涅劳的道德与法律定性
  choice: 这不法的米涅劳
  alternative: 邪恶的米涅劳
  rationale: 原文明确谴责其违背法律或律法，却未要求扩展为更笼统的神学性定罪；“不法的”更透明地保留原词张力。
- issue: 未得“土地”的含义
  choice: 正文译明为未能入土安葬，并以脚注保留字面说法
  alternative: 正文直译为“连土地也没有得到”
  rationale: 上下文清楚涉及死后不得安葬；译明隐含意义可使现代读者准确理解，同时脚注避免遮蔽希腊文原有的凝练措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“遭厄运而死”承接上文所述的刑罚结局；“入土安葬”是普通读者熟悉的表达。脚注标记[a]已置于正文相关句末。
