base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/009.yaml
  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
translation:
  language: zh_hans
  text: 但王心事重重地前进，打算[a]叫犹太人遭受他父亲在位时发生过的最坏的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打算”也可译作“预备”或“料想会”。原文分词在这里可带预期或意图的意味。
    reason: 保留ἐνδεξόμενος在语境中可能具有的预期与意图两种细微含义。
lexical_decisions:
- source_word: φρονήμασιν
  choice: 心里……这些念头
  rationale: 该词为复数与格，表示王内在的思想、意向或心志；结合上下文，译作“心里……这些念头”自然且不把含义缩窄为单纯情绪。
- source_word: βεβαρημένος
  choice: 背负着
  rationale: 完成时分词表达一种已经形成并持续的沉重状态；“背负着”保留原文的重量隐喻。
- source_word: ἦρχετο
  choice: 进军而来
  rationale: 未完成过去时在军事语境中表示正在向前推进；“进军而来”兼顾行进方向和战役背景，避免误作“开始”。
- source_word: τὰ χείριστα
  choice: 那些最恶劣之事
  rationale: 中性复数最高级作名词使用；此译保留所指行为或灾祸的概括性，不具体添加原文没有说明的内容。
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: 他父亲在位时发生过的
  rationale: ἐπὶ加属格在此指其父统治的时期；“在位时”明确政治语境，而“发生过的”对应完成时分词 γεγονότων。
- source_word: ἐνδεξόμενος
  choice: 打算……加在……身上
  rationale: 该分词在敌对语境中可表达预期或意图采取某种行动；正文采用意图义，同时用脚注保留预期义的可能性。
