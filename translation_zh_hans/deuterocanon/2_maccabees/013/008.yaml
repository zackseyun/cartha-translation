  yaml_path: translation/deuterocanon/2_maccabees/013/008.yaml
  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: zh_hans
  text: 这是极其公正的[a]；因为他曾在祭坛的事上犯下许多罪——祭坛的火是洁净的，灰也是如此[b]——他就在灰烬中丧命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是极其正当的。”希腊文开头强调，他的结局是应得的。
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句直译为“他在灰中领受了死亡”，与他在祭坛的事上所犯的罪以及祭坛的灰相呼应。
    reason: literary_wordplay
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: 这完全是他罪有应得
  rationale: πάνυ加强语气，δικαίως表示公正、恰当；结合上文所述结局，译为“完全是他罪有应得”自然明确，同时保留因果报应的强调。
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  choice: 曾……犯了许多罪
  rationale: συντελεῖν与ἁμαρτήματα搭配，指实施、犯下罪行；“犯了许多罪”符合现代汉语宗教语境。
- source_word: περὶ τὸν βωμόν
  choice: 在祭坛的事上
  rationale: περί在此可指关于、涉及祭坛的行为；“在祭坛的事上”既表达其罪与祭坛有关，又避免把原文含义过度限定为直接攻击祭坛。
- source_word: ἁγνὸν
  choice: 圣洁的
  rationale: ἁγνός本可指纯洁、洁净；在祭坛、火与灰的礼仪语境中，“圣洁”更能传达分别为圣的性质。
- source_word: ἐν σποδῷ
  choice: 在灰中
  rationale: 直译空间表达，保留“灰”与祭坛之灰相呼应的讽刺性对应。
- source_word: τὸν θάνατον ἐκομίσατο
  choice: 丧了命
  rationale: κομίζομαι在此表示得到、遭受某种结局；“丧了命”是自然庄重的现代汉语，并与ἐν σποδῷ顺畅搭配。
theological_decisions:
- issue: 祭坛之火与灰的礼仪性质
  choice: 祭坛的火和灰都是圣洁的
  alternative: 祭坛的火是洁净的，灰也是圣洁的
  rationale: 希腊文以单数中性谓语形容词ἁγνόν对应并列的中性主语“火”和阴性主语“灰”，语法上存在表述压缩；按整体礼仪语境处理为二者都属圣洁之物，既自然又不把ἁγνός缩减为物理洁净。
- issue: 结局是否表达报应性的公正
  choice: 这完全是他罪有应得
  alternative: 这完全合乎公义
  rationale: πάνυ δικαίως明确评价其遭遇为公正、应得；“罪有应得”结合后句所述罪行，传达原文张力而不额外引入特定教义体系。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“祭坛”“圣洁”保留礼仪语域；“在灰中丧了命”保留原文简洁而强烈的对应意象。
