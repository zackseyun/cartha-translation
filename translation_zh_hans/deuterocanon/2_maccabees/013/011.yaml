  yaml_path: translation/deuterocanon/2_maccabees/013/011.yaml
  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: zh_hans
  text: 他们眼看就要被剥夺律法、故土和圣殿；他劝他们不要让这刚刚稍得喘息的百姓落在那些出言辱骂的列国[a]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出言辱骂”也可译作“恶言毁谤”或“出言亵渎”。希腊词可指辱骂、恶言，也可指亵渎性的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: στερεῖσθαι
  choice: 被剥夺
  rationale: 表达被强行夺去所珍视之物，保留原文所含的损失与被动意味。
- source_word: νόμου
  choice: 律法
  rationale: 在犹太语境中指祖传的律法；“律法”既准确，也保留其宗教和盟约分量。
- source_word: πατρίδος
  choice: 故土
  rationale: 指祖先所属、自己眷恋的本土；现代汉语中“故土”自然庄重，也比“祖国”较少带入现代国家概念。
- source_word: ἱεροῦ ἁγίου
  choice: 圣殿
  rationale: ἱερόν在此指圣殿或圣殿区域，ἁγίου表明其神圣性质；汉语“圣殿”已自然包含这一限定。
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: 刚刚稍得喘息
  rationale: 同时呈现ἄρτι的近期性、βραχέως的有限程度，以及ἀναψύχω所表达的缓解、复苏之意。
- source_word: λαὸν
  choice: 百姓
  rationale: 指犹太群体整体；“百姓”符合历史叙事语体。
- source_word: δυσφήμοις ἔθνεσιν
  choice: 那些出言亵渎的列国
  rationale: δυσφήμος可指辱骂、恶言或亵渎性的言语；此译保留言语行为及其可能的宗教意味，不笼统弱化为“敌对”。
- source_word: ὑποχειρίους γενέσθαι
  choice: 落在……手中
  rationale: 原词带有处于他人手下、受其控制之意；这一汉语表达自然地传达被辖制或任人摆布。
theological_decisions:
- issue: 本节在希腊文中依赖上文，独立看缺少明确的限定动词和部分主语
  choice: 按上下文补足为“他们眼看就要……，并且劝众人……”
  alternative: 以括号标出补入成分，或保留更生硬的从属结构
  rationale: 现代汉语需补出上下文隐含的句法成分方能成句；所补内容限于句法需要，不改变本节的劝勉性质。
- issue: δυσφήμοις是否专指宗教性的亵渎
  choice: 译作“出言亵渎”，并以脚注保留“辱骂”的词义可能
  alternative: 出言辱骂的；恶言毁谤的
  rationale: 该词兼有恶言、辱骂及亵渎的语义范围；正文采用适合本语境的庄重表达，脚注避免把语义排他性地锁定。
translation_notes:
  register: 采用现代、庄重而通顺的经文语体。“律法、故土和圣殿”保留并列的递进力量；“稍得喘息”传达百姓刚经历短暂、有限的恢复。脚注标记置于正文相关句末。
