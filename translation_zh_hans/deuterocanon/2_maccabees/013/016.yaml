  text: And in the end they filled the camp with fear and confusion[a], and withdrew prosperously.
translation:
  language: zh_hans
  text: 最后，他们使营中充满恐惧和混乱，随后顺利撤离了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顺利”所译的希腊语也可指“顺遂”“境况良好”或“成功地”。这里指他们撤离时情势有利、行动成功。
    reason: 保留εὐημεροῦντες可表示顺遂、成功或境况良好的词义幅度，避免把它仅限于撤退队形井然，也不误加“得手之后”的时间含义。
lexical_decisions:
- source_word: τὸ τέλος
  choice: 最后
  rationale: 这是表示事件结果或叙事进展的时间短语；“最后”简洁自然，也保留“最终、终于”的语感。
- source_word: παρεμβολήν
  choice: 营中
  rationale: παρεμβολή在此军事语境中指营地；与“使……充满”搭配时译作“营中”，符合现代汉语表达。
- source_word: δέους
  choice: 恐惧
  rationale: 该词表示惧怕、畏惧；“恐惧”力度适中，不擅自强化为“极度恐慌”。
- source_word: ταραχῆς
  choice: 混乱
  rationale: 该词可指骚动、纷乱或不安；军事场景中的“混乱”自然，并与“恐惧”形成合宜搭配。
- source_word: ἐπλήρωσαν
  choice: 使……充满
  rationale: 保留动词的使役结构：他们使营中充满恐惧和混乱。
- source_word: ἐξέλυσαν
  choice: 撤离了
  rationale: 在突袭后的军事语境中，该动词表示离开或撤出；“撤离”比泛泛的“离去”更贴合行动场景，同时不暗示败退。
- source_word: εὐημεροῦντες
  choice: 顺利
  rationale: 该现在分词表示处境顺遂、进展良好或行事成功；“顺利”在汉语中可自然修饰撤离，但其“得势、成功”的语义幅度在脚注中保留。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“营中充满恐惧和混乱”贴近希腊语结构；“随后”明确两个动作的顺承关系，并未增加因果解释。
