base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: zh_hans
  text: 他把“上帝的胜利”作为口令[a]传给身边的人，随后带着一批装备精良的精锐青年，趁夜袭击王室营区，在营中杀了约二千人，又把为首的那头大象连同象楼里的人[b]一并杀死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口令”也可译作“暗号”或“信号”。希腊词指军中约定的口令或信号；这里口令的内容是“上帝的胜利”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在房屋式结构里的人”，指战象背上象楼或座舱中的人，可能是驭象者或乘员。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναδοὺς
  choice: 交给
  rationale: 不定过去时分词表示袭击前发生的动作；与 σύνθημα 连用，指把暗号传给身边的人。
- source_word: τοῖς περὶ αὐτὸν
  choice: 身边的人
  rationale: 保留希腊语“围绕他的人”这一惯用表达，语境中指随从或同伴。
- source_word: σύνθημα
  choice: 暗号
  rationale: 该词在军事语境中可指约定的口令、暗号或信号；“暗号”既自然，也不预先断定它一定是公开呼喊的战号。
- source_word: Θεοῦ Νίκην
  choice: 上帝的胜利
  rationale: 保留属格短语的简洁口号形式及其可能的歧义，不扩写为陈述句“上帝必胜”。
- source_word: νεανίσκων ἀρίστων κεκοσμημένων
  choice: 一批装备精良的优秀青年
  rationale: κεκοσμημένων 在军事语境中指整装、配备妥当；ἀρίστων 修饰青年，译作“优秀”而不与装备含义合并。
- source_word: ἐπιβαλὼν
  choice: 袭击
  rationale: 与 ἐπὶ 加宾格连用，在军事叙事中表示突然进攻。
- source_word: νύκτωρ
  choice: 趁夜
  rationale: 自然表达夜间发动突袭的时间背景。
- source_word: τὴν βασιλικὴν αὐλήν
  choice: 王家的营区
  rationale: αὐλή 可指院落或围起来的区域；在军营语境下，“王家的营区”比现代意义的“王室宫廷”更准确。
- source_word: τὴν παρεμβολὴν
  choice: 营中
  rationale: παρεμβολή 是军营；此处将其作为杀敌行动发生的范围来表达。
- source_word: ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: 杀了约二千人
  rationale: ἀναιρέω 在此指杀死；εἰς 加数目表达约数，故译“约”。
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: 为首的那头大象
  rationale: 保留 πρωτεύοντα 所含的居首、领先或最主要之意，而不确定它究竟指位置还是地位。
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι
  choice: 连同象楼里的人
  rationale: 原文直指处在类似房屋结构中的人；战象背上通常设象楼。此译比单说“骑手”更贴近措辞，同时以脚注说明。
- source_word: συνέθηκεν
  choice: 一并杀死
  rationale: 依上下文理解为将象及象楼中的人一同处置、杀死；措辞本身较不寻常，译文按叙事结果表达。
theological_decisions:
- issue: Θεοῦ Νίκην 的句法与神学力度
  choice: 上帝的胜利
  alternative: 上帝必胜／上帝赐胜
  rationale: 原文是简短的属格名词短语，不宜增添系词、将来意义或“赐予”的因果观念。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“上帝的胜利”保持口号式的凝练；“王家的营区”避免把军事围区误解为抽象的宫廷机构。主文中的脚注标记与脚注一一对应。
