lexical_decisions:
- source_word: ἐδευτερολόγησεν
  choice: 又……谈判
  rationale: 该动词含“再次说、进一步交涉”之意；结合随后互换右手这一立约动作，译作“又……谈判”既保留再次交涉的意味，也符合军事政治语境。
- source_word: τοῖς ἐν Βαθσούροις
  choice: 伯特夙拉城里的人
  rationale: 原文只说明这些人在该地，并未明说其性别或军人身份；此译避免过度限定。
- source_word: Βαθσούροις
  choice: 伯特夙拉
  rationale: 按希腊文地名形式音译；其背后的希伯来地名也常译作“伯夙尔”。
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  choice: 彼此握手立约
  rationale: 字面为“给出右手，也接受右手”，在此是双方以右手表示承诺或协议的习语。“彼此握手立约”自然传达其双向性和政治约定意味。
- source_word: ἀπῄει
  choice: 然后离去
  rationale: 清楚表达叙事中的离开动作；“然后”体现动作次序而不添加实质信息。
