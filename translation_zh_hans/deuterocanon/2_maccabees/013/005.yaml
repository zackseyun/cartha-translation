  text: In that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
translation:
  language: zh_hans
  text: 那地方有一座五十肘高的塔，里面装满灰烬；又有一个环形装置[a]，其四周陡峭地向下倾斜，通入灰烬中。
