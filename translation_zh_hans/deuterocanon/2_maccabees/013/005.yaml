lexical_decisions:
- source_word: πύργος
  choice: 塔
  rationale: 该词通常指塔或塔状建筑；“塔”简明自然，也符合上下文所描述的刑罚设施。
- source_word: πεντήκοντα πήχεων
  choice: 五十肘高
  rationale: πήχυς 是古代长度单位“肘”；补出“高”可在现代汉语中清楚表达这是塔的高度。
- source_word: πλήρης σποδοῦ
  choice: 里面装满灰烬
  rationale: σποδός 指灰或灰烬；“装满灰烬”准确表达 πλήρης 加属格的含义，并符合此处大量灰烬的场景。
- source_word: ὄργανον
  choice: 装置
  rationale: 该词可泛指器具、工具或机械装置；原文没有说明其具体构造或用途，因此采用不作过度界定的“装置”。
- source_word: περιφερές
  choice: 圆形
  rationale: 该形容词在此最自然地描述装置的圆形或环形外观；译成“旋转”会加入原文未明确表达的运动功能。
- source_word: πάντοθεν
  choice: 四面都
  rationale: 该副词表示从各面、四周；“四面都”自然地修饰后面的陡斜状态。
- source_word: ἀπόκρημνον
  choice: 陡斜地
  rationale: 该词表达陡峭、近乎悬落的下降状态；“陡斜地”既保留陡峭感，也能与装置通向灰烬的空间描述顺畅衔接。
- source_word: εἰς τὴν σποδόν
  choice: 通向灰烬中
  rationale: εἰς 表示朝向或进入；“通向灰烬中”保留装置向灰烬内部下降的动态空间关系。
