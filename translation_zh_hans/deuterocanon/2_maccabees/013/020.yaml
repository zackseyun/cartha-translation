lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: 却……给里面的人
  rationale: ἔνδον在此实词化，指身处某处内部的人；译作“里面的人”保留空间含义，不擅自补出“男人”或具体地点。δέ按语境译为“却”，体现叙事中的转折或对照。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用现代中文圣经传统中该人名的通行音译。
- source_word: τὰ δέοντα
  choice: 所需之物
  rationale: 该中性复数表达泛指必需的东西；“所需之物”自然而概括，避免将原文未明确的内容限定为粮食或军需品。
- source_word: εἰσεπέμπεν
  choice: 不断把……送进去
  rationale: 动词含有“向里面送”的方向意义；未完成时可表示过去持续或反复发生的动作，“不断”体现这一未完成体特征。
