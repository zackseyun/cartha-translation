base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: zh_hans
  text: 然而，万王之王激起了安条克对那个恶徒[a]的怒气。吕息阿指出，此人要为这些祸患和这一切负责；于是安条克下令照当地的惯例，把他带到庇哩亚处死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶徒”或译“罪人”“恶棍”；希腊词含有强烈的道德谴责意味。
    reason: lexical_alternative
  - marker: b
    text: “当地”指庇哩亚；这句话表示处死是依该地的惯例进行。下文叙述了当地所用的具体处死方式。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: 然而，万王之王
  rationale: 保留神圣尊称及与上文的转折衔接；“万王之王”是现代汉语中自然、庄重的表达。
- source_word: ἐξήγειρεν τὸν θυμὸν τοῦ Ἀντιόχου
  choice: 激起了安条克……的怒气
  rationale: 体现动词的使动意义，同时不额外说明神如何促成此事。
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: 对那个恶徒
  rationale: ἀλιτήριος带有强烈的道德谴责色彩；“恶徒”兼顾力度、自然度和人物指称。
- source_word: Λυσίου ὑποδείξαντος
  choice: 吕息阿指出
  rationale: 以汉语顺畅的分句表达属格独立结构，保留其作为随后命令之背景或原因的功能。
- source_word: τοῦτον αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: 此人应为这些祸患和这一切负责
  rationale: “负责”准确传达αἴτιος；“这些祸患和这一切”保留καὶ πάντων的概括性与原文略显压缩的表达，不强行限定具体所指。
- source_word: προσέταξεν
  choice: 安条克下令
  rationale: 希腊文主语由语境承接；汉语明示“安条克”可避免与紧邻的吕息阿混淆。
- source_word: προσαπολέσαι
  choice: 处死
  rationale: 在惩处语境中指使其死亡；“处死”简洁、明确，又不过度渲染复合动词的强化色彩。
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: 把他押到庇哩亚
  rationale: 分词表示执行命令时的伴随行动；“押到”符合囚犯被带往处刑地点的语境。
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: 照当地的惯例
  rationale: 自然传达“按那个地方的惯例”，并使该短语与处死方式相连。
theological_decisions:
- issue: “万王之王”的所指
  choice: 作为指向上帝的神圣尊称处理
  alternative: 仅视为对某位人间君王的夸张称号
  rationale: 本书叙事将至高主权归于上帝，并在此描写他支配人间君王的怒气；译文保留尊称的神学分量，但不增添原文未明说的解释。
- issue: 上帝激起安条克怒气的因果张力
  choice: 直译为“激起”，保留上帝主动促成事件的表述
  alternative: 弱化为“任凭安条克发怒”或“使安条克注意到”
  rationale: ἐξήγειρεν具有明确的使动意味；不应为化解神学张力而改写成许可或单纯认知。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名“安条克”“吕息阿”和地名“庇哩亚”使用常见次经译名。将希腊文较长的句子分为两句，并明示第二句命令者为安条克，以免汉语读者误认主语；同时保留“这些祸患和这一切”的概括性及原文神学上的因果张力。
