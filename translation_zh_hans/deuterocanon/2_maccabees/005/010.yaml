revisions:
- from: 那把许多人抛弃、不予安葬的人，自己死后也无人哀悼；他没有得到任何葬礼，也未能享有祖传的礼法。
  to: 那曾把许多人弃置不葬的人，自己死后也无人哀悼；他未能有分于任何丧葬礼仪，也未能遵行祖传的律法。
  rationale: 修改仅为提升现代汉语的顺畅度并更准确反映希腊文措辞。“弃置不葬”对应弃置未葬者；“丧葬礼仪”涵盖κηδεία；“祖传的律法”忠于πατρῴου νόμου。未采纳英语审计文本中与现有希腊文本不符的“祖坟”解释，也未增添报应的神学说明。
