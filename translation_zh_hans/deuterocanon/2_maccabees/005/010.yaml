  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: zh_hans
  text: 那曾把许多人弃置不葬的人，自己死后也无人哀悼；他未能有分于任何丧葬礼仪，也未能遵行祖传的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πλῆθος ἀτάφων ἐκρίψας
  choice: 那把许多人抛弃、不予安葬的人
  rationale: 按分词结构理解为指此前所述之人；ἀτάφων说明那些被抛弃者没有获得安葬。用“不予安葬”自然表达其结果，同时保留行为者的责任。
- source_word: ἀπένθητος ἐγενήθη
  choice: 自己死后也无人哀悼
  rationale: ἀπένθητος意为“未受哀悼的”。补出“死后”符合上下文与现代汉语表达，但不增加新的事件内容。
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: 没有得到任何葬礼
  rationale: κηδεία在此指安葬及其丧葬礼仪；“任何”传达οὐδ᾽ ἥτινος的全面否定。
- source_word: πατρῴου νόμου
  choice: 祖传的礼法
  rationale: 依所提供希腊文本将νόμος译作“礼法”，既涵盖规矩、习俗和律法色彩，也避免按英语咨询文本改成源文未出现的“祖坟”。
theological_decisions:
- issue: 报应式叙事的表达
  choice: 保留“使多人不得安葬者，自己也无人哀悼、没有葬礼”的对照
  alternative: 明确添加“这是上帝的惩罚”
  rationale: 原句以叙事对应暗示报应，却没有明说施行者或作神学解释，因此不予增补。
- issue: πατρῴου νόμου的解释
  choice: 译为“祖传的礼法”
  alternative: 依英语POB译作“祖坟”
  rationale: 当前提供的希腊源文明确为νόμου（礼法、规矩），应优先忠于原文证据，并保留该表达与丧葬语境之间可能存在的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“抛弃、不予安葬”清楚呈现古代丧葬语境；后半句保留源文“祖传礼法”的措辞，不依据英语咨询层静默改写为“祖坟”。
