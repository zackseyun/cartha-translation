base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: zh_hans
  text: 因此，就连这地方本身，在与本民族一同遭受灾祸之后，后来也同享了福泽；它虽曾被全能者的愤怒所临及，却又在伟大主宰的和好[a]之中，满有荣耀地得以恢复。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伟大主宰的和好”直译为“在伟大主宰的和好之中”；原文没有说明和好的另一方。“主宰”也可译作“主人”或“统治者”，原词强调绝对权柄。
    reason: 保留 καταλλαγή 未明说关系对象的歧义，并说明 δεσπότης 的词义范围。
lexical_decisions:
- source_word: διόπερ
  choice: 因此
  rationale: 保留与上文之间强烈的因果推论关系，且符合现代汉语叙事。
- source_word: αὐτὸς ὁ τόπος
  choice: 就连这地方本身
  rationale: 保留 αὐτός 的强调作用；按上下文指圣殿所在之处，但正文不将 τόπος 明说为“圣殿”，避免过度具体化。
- source_word: συμμετασχὼν τοῦ ἔθνους δυσπετημάτων
  choice: 在与本民族一同遭受灾祸之后
  rationale: 表达共同经历的含义，并以“灾祸”传达 δυσπέτημα 所指的严重困境；ἔθνος 在这里是犹太民族这一群体。
- source_word: ὕστερον εὐεργετημάτων ἐκοινώνησεν
  choice: 后来也同享了福泽
  rationale: 以“同享”延续前半句的共同参与意象；“福泽”自然表达所得的恩惠和好处，又不限定其具体形式。
- source_word: καταληφθεὶς ἐν τῇ τοῦ παντοκράτορος ὀργῇ
  choice: 被全能者的烈怒所压倒
  rationale: “压倒”适合以烈怒为抽象施事，传达遭其临到并制伏的意思；“全能者”是 παντοκράτωρ 清楚而庄重的对应词。
- source_word: ἐν τῇ τοῦ μεγάλου δεσπότου καταλλαγῇ
  choice: 在伟大主宰与人和好之时
  rationale: δεσπότης 强调最高权柄，译作“主宰”并与 παντοκράτωρ 区分；καταλλαγή 表示由敌对转为和好，希腊文未明说和好的另一方，正文按语境补出“与人”，并用脚注保留较形式对应的译法。
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: 极其荣耀地得以复兴
  rationale: ἐπανορθόω 表示重新扶起、恢复至正当状态；“复兴”比单指建筑修复更宽，可涵盖圣所地位与荣美的恢复。
theological_decisions:
- issue: 如何分别翻译 παντοκράτωρ 与 δεσπότης 两个神圣称号
  choice: 全能者……伟大主宰
  alternative: 全能者……伟大的主
  rationale: 原文刻意使用两个不同称号；“主宰”保留 δεσπότης 所强调的绝对权柄，也避免把两者的词汇特色抹平。
- issue: καταλλαγή 的关系指向
  choice: 主宰与人和好之时
  alternative: 主宰的和好之中／主宰息怒施恩之时
  rationale: 该词表示敌对关系转为和好，但原文没有明说关系的另一方。正文为汉语通顺按上下文补出“与人”，脚注提示原文的省略，避免将其解释为特定的赎罪机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。以“这地方本身”保留原文含蓄指称，不在正文中直接增译为“圣殿”。“灾祸／福泽”和“压倒／复兴”形成清楚对照；两个神圣称号分别译为“全能者”和“主宰”。
