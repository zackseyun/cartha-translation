  yaml_path: translation/deuterocanon/2_maccabees/005/019.yaml
  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: zh_hans
  text: 但主不是为了那地方而拣选这民族，而是为了这民族拣选了那地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: 但……而是……
  rationale: 希腊文以两个 ἀλλά 构成鲜明的否定—肯定对照；现代汉语用“不是……而是……”最自然地保留这种转折和平衡。
- source_word: διὰ
  choice: 为了
  rationale: διὰ 加宾格在此表示缘由或所着眼的对象；“为了”既简洁，又能表现拣选地方是以民族为着眼点。
- source_word: τόπον
  choice: 那地方
  rationale: 原文只说“地方”，语境虽指耶路撒冷及圣殿所在地，却不宜译成“圣所”或“圣殿”而缩窄词义；“那”使中文指称自然。
- source_word: ἔθνος
  choice: 这民族
  rationale: ἔθνος 在此指作为整体的犹太民族；“民族”比泛称的“人民”更能保留其族群共同体含义。“这”与“那地方”形成清楚对照。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按现代汉语圣经语体自然译作“主”；无需机械体现希腊语冠词。
- source_word: ἐξελέξατο
  choice: 拣选
  rationale: “拣选”准确表达 ἐκλέγομαι 的选择含义，也保留经文中的神学语感。中文前句的“拣选”可由后句共同支配，但为清楚和节奏，在两处均予表达。
theological_decisions:
- issue: 圣地与蒙拣选民族之间的关系
  choice: 主拣选地方是为了这民族，而不是因那地方才拣选这民族。
  alternative: 地方先被独立拣选，随后使民族获得神圣地位。
  rationale: 原文以“不是……而是……”明确规定两者的次序和关系：地方的被拣选从属于主对民族的眷顾。译文不进一步解释这种拣选的性质或范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文紧凑、对称的修辞结构，不把“地方”具体化为“耶路撒冷”“圣殿”或“圣所”，也不额外补入原文未明说的神学解释。
