base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: zh_hans
  text: 可是，当时传出谣言，说安提阿古已经去世[a]。伊阿宋带着不少于一千人，突然向城发动进攻。城墙上的人被击退，城也终于已经开始沦陷，墨涅拉俄便逃进了卫城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“变换了生命”，是表示死亡的委婉说法。
    reason: 说明原文死亡委婉语的字面形式与含义。
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  choice: 谣言
  rationale: 此处指流传的虚假消息；现代汉语用“谣言”自然简洁，也明确保留其不实性质。
- source_word: μετηλλαχότος Ἀντιόχου τὸν βίον
  choice: 安提阿古已经去世
  rationale: 这是表示死亡的委婉说法，字面近于“改变了生命”。汉语“去世”既清楚又保留委婉语气，字面信息另以脚注说明。
- source_word: παραλαβὼν
  choice: 带着
  rationale: 表示伊阿宋带领一支人马同行；“带着”符合现代汉语叙事习惯。
- source_word: οὐκ ἐλάττους τῶν χιλίων
  choice: 不少于一千人
  rationale: 准确保留原文所强调的最低人数界限，不改写为较弱的概数。
- source_word: ἐφνιδίως ... συνετελέσατο ἐπίθεσιν
  choice: 突然向城发起进攻
  rationale: 将副词与军事行动合译，既体现突袭的突然性，也自然传达执行攻击之意。
- source_word: τῶν ... ἐπὶ τῷ τείχει
  choice: 城墙上的人
  rationale: 贴近原文，不额外把这些人明确解释为守军，保留原文表述范围。
- source_word: συνελασθέντων
  choice: 被击退
  rationale: 在攻城语境中表示被逼退；“被击退”清楚而符合军事叙述。
- source_word: καὶ τέλος ἤδη καταλαμβανομένης τῆς πόλεως
  choice: 城眼看就要被攻下
  rationale: 原文表示城的陷落已经在进行中。“眼看就要被攻下”自然呈现迫近失守的局势，同时不说成已经完全陷落。
- source_word: ἐφυγάδευεν
  choice: 逃进
  rationale: 传达因败势而逃离并进入安全地点的动作，不额外加入原文未明说的目的语。
- source_word: ἀκρόπολιν
  choice: 城堡
  rationale: 此词指城内高处的设防要塞；“城堡”对普通现代读者易懂，并在本语境中体现其防御功能。
