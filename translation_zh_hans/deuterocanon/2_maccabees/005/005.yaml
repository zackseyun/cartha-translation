revisions:
- from: 可是，有谣言说安提阿古已经去世[a]。伊阿宋便带着不少于一千人，突然向城发起进攻。城墙上的人被击退，城眼看就要被攻下，墨涅拉俄便逃进了城堡。
  to: 可是，当时传出谣言，说安提阿古已经去世[a]。伊阿宋带着不少于一千人，突然向城发动进攻。城墙上的人被击退，城也终于已经开始沦陷，墨涅拉俄便逃进了卫城。
  rationale: 修订仅处理两项与原文相关的问题：以“已经开始沦陷”表达城池正被攻取的进行状态，避免译成尚未发生的“眼看就要”；并将“城堡”改为“卫城”，以准确对应ἀκρόπολις。其余译文及脚注锚点均予保留。
