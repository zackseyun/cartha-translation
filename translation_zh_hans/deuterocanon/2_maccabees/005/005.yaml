  naturalness: 整体为自然、简洁的现代汉语历史叙事。“城已经开始沦陷”比“眼看就要被攻下”更能兼顾汉语顺畅与原文进行中的态势。“卫城”比“城堡”更准确对应ἀκρόπολις，即城内高处的设防据点。
  terminology: “去世”恰当地传达死亡委婉语；脚注可保留其字面形式。“卫城”是ἀκρόπολις的常用历史地理译名，避免“城堡”可能泛指一般建筑的含混。人名沿用草稿既有译法，以保持本段一致性。
