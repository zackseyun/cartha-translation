base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/011.yaml
  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
translation:
  language: zh_hans
  text: 有人把所发生的事禀报给王；他就断定犹太地在反叛。因此，他从埃及拔营出发，心性如野兽般凶残，以武力攻占了那城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以武力”直译为“以矛夺取”，是希腊语中指通过武装攻击攻陷城邑的军事表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεστώτων δὲ τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: 王听取了关于所发生之事的禀报
  rationale: 此处为属格独立结构，表示有关既成事件的消息被呈报给王；译文采用自然的宫廷叙事用语，又不具体限定禀报者。
- source_word: διέλαβεν
  choice: 就断定
  rationale: 该动词在这里指根据禀报作出判断，不只是得知或理解；“断定”保留其推断色彩。
- source_word: ἀποστατεῖν τὴν Ἰουδαίαν
  choice: 犹太全地已经叛乱
  rationale: 语境是反抗王权的政治叛乱，而非宗教意义上的背道；“犹太全地”表达地名Ἰουδαία，并使其作为叛乱主体在中文中更自然。
- source_word: ἀναζεύξας ἐξ Αἰγύπτου
  choice: 从埃及拔营出发
  rationale: ἀναζεύω本指解营、拔营而行；“拔营出发”保留军事行军背景，并清楚表达行动起点。
- source_word: θηριωμένος τῇ ψυχῇ
  choice: 心如野兽般凶残
  rationale: θηριόω带有变得如野兽一般的鲜明比喻，τῇ ψυχῇ指内在心性；译文保留兽性意象，而不弱化为单纯“愤怒”。
- source_word: ἔλαβεν τὴν μὲν πόλιν
  choice: 攻占了那城
  rationale: λαμβάνω在军事语境中指夺取城邑；“攻占”与后面的武力限定自然衔接。
- source_word: δοριαλώτον
  choice: 用武力
  rationale: 该复合词字面涉及“以矛夺取”，是指经武装攻击而攻陷的军事表达；正文以现代中文惯用语传达其意义，字面意象置于脚注。
