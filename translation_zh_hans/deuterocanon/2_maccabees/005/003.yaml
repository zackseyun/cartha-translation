  yaml_path: translation/deuterocanon/2_maccabees/005/003.yaml
  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
translation:
  language: zh_hans
  text: 又有刀剑的挥舞、列阵的骑兵队、发生的攻击和双方的突袭[b]、盾牌的挥动、大批长矛[a]、投射武器的发射、金饰的闪光，以及各式各样的铠甲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长矛”：原文καμάτων在这里意义不明，也可能泛指大量长柄兵器或类似的作战装备。
    reason: textual_variant
  - marker: b
    text: “突袭”也可译作“冲击”或“奔袭”；原文καταδρομάς指迅猛冲击式的攻击，不一定表示针对先前攻击所作的“反击”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: 刀剑的挥舞
  rationale: σπασμός本指抽出、拉动；在战争异象的列举中，描写刀剑被拔出并挥动的动态。“挥舞”自然且不把重点误移到刀光本身。
- source_word: ἴλας ἵππων διατεταγμένας
  choice: 列阵的骑兵队
  rationale: ἴλη指骑兵分队，ἵππων以马代指骑兵，διατεταγμένας表示按战斗队形部署。
- source_word: προσβολὰς γινομένας
  choice: 不断发动的攻击
  rationale: προσβολή在军事语境中指攻击或进攻；γινομένας表示这些攻击正在发生。中文以“不断发动”呈现异象中连续展开的战斗场面。
- source_word: καταδρομὰς ἑκατέρων
  choice: 双方的突袭
  rationale: καταδρομή可指冲击、奔袭或突袭；“突袭”保留其快速进攻的意味，而不擅自确定为回应前次攻击的“反击”。ἑκατέρων译作“双方的”。
- source_word: ἀσπίδων κινήσεις
  choice: 盾牌的挥动
  rationale: κίνησις泛指移动或动作；在作战场景中，“挥动”比抽象的“移动”更自然，同时未具体限定战术用途。
- source_word: καμάτων πλήθη
  choice: 大批长矛
  rationale: 传世文本中的καμάτων在此语境下意义困难；按战争器械清单的上下文，可理解为大量矛杆、长柄兵器或类似装备。正文采用通顺的“大批长矛”，并以脚注保留不确定性。
- source_word: βελῶν βολάς
  choice: 投射武器的发射
  rationale: βέλος可指箭、镖等各种投射武器，βολή指投射或射击；此译法避免无根据地缩窄为箭。
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: 金饰的闪光
  rationale: κόσμος可指装饰、饰物或装备上的装饰，ἐκλάμψεις指闪耀、迸发的光；“金饰的闪光”简洁呈现其视觉效果。
- source_word: παντοίους θωρακισμούς
  choice: 各式各样的铠甲
  rationale: θωρακισμός指护甲或披甲装备，παντοίους强调种类繁多。
