base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: zh_hans
  text: 然而，伊阿宋不断毫不留情地屠杀本城自己的同胞[a]，却没有认识到，在亲族身上得势乃是最大的不幸[b]；他还以为自己是在为战胜敌人、而非战胜同族人树立胜利标志[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毫不留情地”也可译作“毫不手软地”或“毫不顾惜地”。
    reason: lexical_alternative
  - marker: b
    text: 原文近于：“没有认识到，对亲族的顺遂乃是最大的不幸。”意思是：从自己亲族身上取得的表面成功，实际上正是不幸。
    reason: literal_and_interpretive_clarification
  - marker: c
    text: 原文采用古代战争中战胜后设立胜利标志的意象。
    reason: cultural_clarification
lexical_decisions:
- source_word: ὁ δὲ Ἰάσων
  choice: 可是，伊阿宋
  rationale: δὲ承接并转折前文，译作“可是”自然；Ἰάσων按通行圣经人名译作“伊阿宋”。
- source_word: ἐποίει σφαγὰς
  choice: 仍……屠杀
  rationale: 未完成时ἐποίει表示持续或反复进行；σφαγάς带有残酷杀戮之意，“屠杀”保留其力度。
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: 城里的自己人
  rationale: 原短语语序凝缩，指城中那些属于他自己一方的人；此译同时保留城市共同体和“自己人”的反身意味，避免过度限定为法律意义上的公民。
- source_word: ἀφειδῶς
  choice: 毫不留情地
  rationale: 既可指毫不顾惜、毫不手软，也含不加怜悯之意；“毫不留情地”符合现代汉语并与屠杀搭配自然。
- source_word: οὐ συννοῶν
  choice: 没有想到
  rationale: συννοέω在此表示领会、意识到；“没有想到”自然表达其未能认识到道德反转。
- source_word: εὐημερίαν
  choice: 得势
  rationale: 该词本指顺遂、好运或成功；在冲突语境中“得势”表达表面占上风，同时不预先把它解释成真正福祉。
- source_word: εἰς τοὺς συγγενεῖς
  choice: 在亲族身上
  rationale: εἰς在此指成功所针对或施及的对象；συγγενεῖς有血缘或族亲意味，译作“亲族”保留其范围，不窄化为近亲。
- source_word: δυσημερίαν τὴν μεγίστην
  choice: 最大的不幸
  rationale: δυσημερία与εὐημερία形成词义反转，表示厄运、不幸；“最大的不幸”贴近明示的最高级，也避免额外强化为毁灭。
- source_word: τρόπαια καταβάλλεσθαι
  choice: 战胜……、赢得战利品
  rationale: 短语采用古代战争胜利标志的意象。汉语若直译为“树立胜利碑”较生硬；正文以“战胜、赢得战利品”传达自以为得胜的军事意涵，同时脚注交代字面形象。
- source_word: πολεμίων
  choice: 敌人
  rationale: 标准军事用语，直接译作“敌人”。
- source_word: ὁμοεθνῶν
  choice: 同胞
  rationale: 该词指同一民族或国族的人；“同胞”简洁自然，并与前面的“亲族”有所区别。
theological_decisions:
- issue: 对亲族的表面成功与真实不幸之间的道德反转
  choice: 保留叙述者的直接判断：“在亲族身上得势，就是最大的不幸”
  alternative: 译为较字面的“对亲族的好运乃是最大的厄运”
  rationale: 希腊文明确把εὐημερία与δυσημερία对置，形成有意的悖论。正文用自然汉语保留这一判断，不把它扩展为特定教派的神学结论。
- issue: 战争胜利意象与同胞相残的张力
  choice: 在正文中以“战胜敌人、赢得战利品”对照“残害同胞”
  alternative: 严格按军事纪念物译为“为敌人而竖立胜利标志，而非为同族人”
  rationale: 原文描写伊阿宋误把对同族的杀戮当作对敌得胜。译文保留这种讽刺和道德张力；“残害”由前文实际屠杀的语境支持，但不加入额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子保留原文一气贯通的因果与讽刺结构，但用分号减轻汉语长句负担。“自己人—亲族—同胞”分别对应原文三个相关而不完全相同的群体称谓。所有脚注标记均已置入正文。
