  naturalness: “城里的自己人”较口语化；“本城自己的同胞”在现代庄重书面语中更自然，也保留城邦共同体和“自己一方”的意思。修订后的末句虽保留古代军事意象，仍可自然理解。
  terminology: “伊阿宋”可保留。“亲族”对应συγγενεῖς，“同族人”对应ὁμοεθνῶν，能够维持原文有意使用的不同群体称谓。“胜利标志”对应τρόπαια，避免把它误作“战利品”。
