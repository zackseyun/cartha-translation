- from: 可是，伊阿宋仍毫不留情地屠杀城里的自己人[a]，没有想到，在亲族身上得势，就是最大的不幸[b]；他还以为自己是在战胜敌人、赢得战利品，而不是在残害同胞。
  to: 然而，伊阿宋不断毫不留情地屠杀本城自己的同胞[a]，却没有认识到，在亲族身上得势乃是最大的不幸[b]；他还以为自己是在为战胜敌人、而非战胜同族人树立胜利标志[c]。
  rationale: 修订将“赢得战利品”改为“树立胜利标志”，准确呈现τρόπαια καταβάλλεσθαι的古代军事习语，并保留伊阿宋误把同族相残当作对敌获胜的讽刺。将“城里的自己人”调整为“本城自己的同胞”，使语体较庄重自然；保留“亲族—同族人”的词汇区分。脚注拆分并增设c锚点，使每项说明与所注正文对应。
