  text: Therefore everyone expected that the appearance would be for good[a].
translation:
  language: zh_hans
  text: 因此，众人都盼望这显现会有好的结果[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人都盼望这显现是吉兆。”希腊文可着重指这显现具有有利的意义，也可指它将有好的结果。
    reason: 保留γενέσθαι与ἐπ᾽ ἀγαθῷ在较静态的有利意义和结果性理解之间的表达空间；“吉兆”仅作为译法备选，不限定正文含义。
lexical_decisions:
- source_word: διό
  choice: 因此
  rationale: 保留与上文的因果推论关系，用现代汉语中自然而庄重的连接词表达。
- source_word: πάντες
  choice: 大家都
  rationale: 泛指当时目睹或得知异象的人群；比“所有人”更符合自然汉语，又不缩小所指范围。
- source_word: ἥξιουν
  choice: 认为
  rationale: 此处ἀξιόω的不定过去未完成时表示众人持续作出的判断或期待；“认为”能保留认定之意，也容纳语境中的预期色彩。
- source_word: ἐπ᾽ ἀγαθῷ
  choice: 带来好结果
  rationale: 表达有利、良好的意义或结果，不将其过度限定为“吉兆”或某一种具体福分。
- source_word: τὴν ἐπιφάνειαν
  choice: 这次显现
  rationale: 指上文所述可见的空中现象；“显现”既贴近ἐπιφάνεια，也避免采用带特定教义色彩的术语。
- source_word: γενέσθαι
  choice: 会带来
  rationale: 结合ἐπ᾽ ἀγαθῷ表达预期中的有利结果；汉语以“会带来好结果”自然呈现其结果性，同时脚注保留较静态的理解。
