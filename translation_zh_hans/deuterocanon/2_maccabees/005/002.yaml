base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/002.yaml
  text: And throughout nearly the whole city[a], for forty days, it happened that horsemen were seen running through the air, wearing garments of gold and armed with lances drawn up in squadrons[b],
translation:
  language: zh_hans
  text: 城中几乎到处，连续四十天都可看见骑兵在空中奔驰[a]；他们身穿金色衣袍，手持长矛，列队成阵[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都可看见骑兵在空中奔驰”也可译作“有骑兵显现在空中奔驰”；希腊文既可强调显现，也可强调被人看见。
    reason: lexical_alternative
  - marker: b
    text: “列队成阵”所译的希腊文表示按有组织的军事队形排列；也可译作“列成队伍”或“按队列排列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: 都看见有
  rationale: 希腊文以非人称叙事句式引出所见异象；中文不必机械译出“事情发生了”，融入“都看见有”更自然，并保留事件被目睹的意味。
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: 差不多全城的人
  rationale: κατά加宾格表示遍及城中，σχεδόν限定范围为“差不多”；补出“的人”明确观看者，是符合中文表达的语法显化。
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: 一连四十天
  rationale: 准确表达持续四十天，也符合现代汉语叙事习惯。
- source_word: φαίνεσθαι
  choice: 看见
  rationale: 该词可指显现、可见或被看见；正文采用自然的观察者视角，脚注保留“显现”的可能。
- source_word: διὰ τῶν ἀέρων
  choice: 在空中
  rationale: 希腊文复数在此为习惯用法；现代汉语以单数概念“空中”最自然。
- source_word: τρέχοντας ἱππεῖς
  choice: 骑兵在空中奔驰
  rationale: ἱππεῖς指骑马者或骑兵，τρέχοντας表示迅速奔行；“奔驰”适合骑乘场景，又未额外加入“冲锋”等含义。
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: 身穿金装
  rationale: στολαί是衣袍、服装，διαχρύσους表示通体金色或饰金；“金装”凝练而保留耀眼的金质或金饰意象。
- source_word: λόγχας
  choice: 长矛
  rationale: λόγχη可指矛或骑枪；“长矛”在此既符合骑兵军事图景，也避免过度限定具体兵器类型。
- source_word: σπειρηδὸν
  choice: 列队成阵
  rationale: 该副词表示按军事单位或阵列组织起来；“列队成阵”传达有组织的军事队形，但不武断指定为某种固定编制。
- source_word: ἐξωπλισμένους
  choice: 手持长矛
  rationale: 该分词表示装备武器；结合λόγχας译为“手持长矛”，以自然中文表达其武装状态。
theological_decisions:
- issue: 异象究竟是客观实体还是显现现象
  choice: 正文译作“看见有骑兵”
  alternative: “有骑兵显现在空中”
  rationale: φαίνεσθαι本身容许“显现”与“被看见”的语义张力；正文不判定异象的本体性质，并在脚注列出另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“一连四十天”“在空中奔驰”自然清晰；保留句末逗号，以反映本节在原文中尚未完结并承接下一节。
