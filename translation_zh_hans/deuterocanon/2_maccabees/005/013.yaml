  text: There was a killing of young and old, a destruction of men and women and children, and slaughters of virgins and infants.
translation:
  language: zh_hans
  text: 当时，年轻人和老人遭杀害；男人、女人和孩子遭毁灭；处女和婴孩遭屠杀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγίνετο
  choice: 当时……都遭
  rationale: 该未完成时描述当时持续发生的惨况；用“当时”引出叙述，以自然汉语传达其过程性而不译成生硬的“发生了”。
- source_word: νέων καὶ πρεσβυτέρων
  choice: 无论老少
  rationale: 此处重在年龄对照，不一定指男性“青年”和具有职位的“长老”；“无论老少”简洁保留其广泛范围。
- source_word: ἀναίρεσις
  choice: 杀害
  rationale: 表示夺去生命；“杀害”准确而庄重，也与末尾语气更强的“屠杀”有所区别。
- source_word: ἀνδρῶν τε καὶ γυναικῶν καὶ τέκνων
  choice: 男人、女人和孩子
  rationale: 逐项保留原文对受害者群体的列举。
- source_word: ἀφανισμός
  choice: 灭绝
  rationale: 该词含毁灭、消灭之意；用于人群时，“灭绝”比泛指性的“毁灭”更贴切，并保留原文的强烈程度。
- source_word: παρθένων
  choice: 童贞女子
  rationale: 明确保留该词所标示的女性及童贞身份；虽较“少女”更具体，但符合希腊词义。
- source_word: νηπίων
  choice: 婴孩
  rationale: 指年幼、尤其尚不会说话的孩子；“婴孩”准确且语体庄重。
- source_word: σφαγαί
  choice: 惨遭屠杀
  rationale: σφαγαί比前面的ἀναίρεσις更带有宰杀、血腥屠戮的意味；“屠杀”保留末句的修辞强化，“惨遭”使中文句法自然。
