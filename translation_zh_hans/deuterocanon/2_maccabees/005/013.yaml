  rationale: 修订使中文更自然且保持原文三项名词性、递进式列举：以直接列举代替带全称意味的“无论……都”，以“遭毁灭”对应ἀφανισμός而不把范围绝对化，并以“处女”替换较生硬的“童贞女子”。脚注锚点保留在相应的“年轻人和老人”和“处女”之后。
