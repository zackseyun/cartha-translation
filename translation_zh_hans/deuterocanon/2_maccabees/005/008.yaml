base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: zh_hans
  text: 所以，他落得了悲惨覆亡的结局：被拘禁在阿拉伯人的统治者阿瑞塔斯那里[a]，从一城逃到另一城，遭众人追赶；他因被视为背弃律法的人而遭人憎恨，又因被视为故土和同胞的刽子手而遭人厌弃；他被逐至埃及[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统治者”或译“暴君”。希腊语这个词可以指暴君，但在这里也可能只是较中性地指掌权者。
    reason: lexical_alternative
  - marker: b
    text: “被逐至埃及”也可译作“被抛逐到埃及”；原文动词语气很强，有被猛烈扔出去的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας ... ἔτυχεν
  choice: 落得了……的结局
  rationale: 保留“达到、遭逢某种结局”的希腊语习语，同时以自然的现代汉语表达其中的报应意味。
- source_word: κακῆς καταστροφῆς
  choice: 悲惨覆亡
  rationale: “覆亡”体现καταστροφή的倾覆、毁灭之意，“悲惨”传达κακῆς的负面强化。
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: 被困在……阿瑞塔斯那里
  rationale: ἐγκλεισθείς表示受围困或限制；πρός与人名的关系并不明确指明施事，因此“在那里”保留他落入其势力范围或受其拘束的开放性。
- source_word: τύραννον
  choice: 统治者
  rationale: τύραννος在希腊化语境中可作较中性的统治者称号；正文不额外给阿瑞塔斯加上道德评断。
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: 从一城逃到另一城
  rationale: 自然传达逐城逃亡、无处安身的反复过程。
- source_word: διωκόμενος ὑπὸ πάντων
  choice: 受众人追赶
  rationale: 此处是实际追逐，不必引入专指宗教压迫的“迫害”。
- source_word: τῶν νόμων ἀποστάτης
  choice: 背弃律法
  rationale: ἀποστάτης表示叛离原有忠诚；“背弃”保留其严重的法律与信仰谴责，同时比音译式宗教术语更易懂。
- source_word: βδελυσσόμενος
  choice: 憎恶
  rationale: 该词表示强烈厌弃，与前面的“恨”形成程度递进。
- source_word: πατρίδος καὶ πολιτῶν δήμιος
  choice: 残害故土和同胞的刽子手
  rationale: δήμιος本可指行刑者，并引申为毁灭者；“刽子手”保留其具体而强烈的暴力色彩，“残害”使其与“故土”搭配自然。
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: 被赶到了埃及
  rationale: ἐκβράζω带有猛烈抛出、逐出的力度；“被赶到”在现代汉语中自然表达被迫离去及最终抵达埃及。
theological_decisions:
- issue: τύραννον是否应赋予阿瑞塔斯负面道德评价
  choice: 译作“统治者”
  alternative: 暴君
  rationale: 该词可作为政治称号使用；经文的道德谴责集中在前文所指的人身上，不应无根据地把额外谴责加给阿瑞塔斯。
- issue: ἀποστάτης在律法语境中的力度
  choice: 译作“背弃律法”
  alternative: 离弃律法的人；律法的叛徒
  rationale: “背弃”明确表达严重的忠诚破裂，又不加入经文本身未明说的宗派性术语。
- issue: δήμιος的具体性与引申义
  choice: 译作“残害故土和同胞的刽子手”
  alternative: 毁灭故土和同胞的人
  rationale: 保留该词“行刑者”的鲜明暴力意象，同时通过“残害”使对故土与同胞的双重关系在汉语中通顺。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号梳理连续分词结构，保存原文逐层堆叠的受困、逃亡、被追赶、遭憎恶和被逐出的节奏；不用生僻音译神学术语，也不减弱叙述者鲜明的道德判断。
