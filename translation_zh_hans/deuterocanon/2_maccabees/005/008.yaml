revisions:
- from: 所以，他落得了悲惨覆亡的结局：被困在阿拉伯人的统治者阿瑞塔斯那里[a]，从一城逃到另一城，受众人追赶；人们恨他，因为他背弃律法，又憎恶他，把他看作残害故土和同胞的刽子手；最终，他被赶到了埃及[b]。
  to: 所以，他落得了悲惨覆亡的结局：被拘禁在阿拉伯人的统治者阿瑞塔斯那里[a]，从一城逃到另一城，遭众人追赶；他因被视为背弃律法的人而遭人憎恨，又因被视为故土和同胞的刽子手而遭人厌弃；他被逐至埃及[b]。
  rationale: 修订仅澄清原文两个平行的“被视为某种人而受憎恶”结构，并以“背弃律法的人”对应名词ἀποστάτης；其余叙事信息、阿瑞塔斯称号的中性处理，以及脚注锚点和词汇备选均予保留。
