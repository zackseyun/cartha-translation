  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: zh_hans
  text: 他命令士兵毫不留情地砍杀他们遇见的任何人[a]，并屠杀那些在房屋里往上走的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡挡在他们路上的人。”希腊语分词可指士兵沿途碰见的人；正文译法避免让人误以为受害者主动发起攻击。
    reason: lexical_alternative
  - marker: b
    text: 直译：“那些在房屋里往上走的人。”这可能指沿台阶上到房屋的上层或进入楼上的房间。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 命令
  rationale: 该动词表示发出命令；“命令”自然、明确地保留了原文的权威语气。
- source_word: κόπτειν
  choice: 砍杀
  rationale: κόπτω本义为击打、砍击；在此军事屠杀语境中指致命攻击。“砍杀”既保留动作的具体性，也清楚表达结果。
- source_word: ἀφειδῶς
  choice: 毫不留情地
  rationale: 该副词表示不加顾惜、毫不宽免；此译法符合现代汉语，并传达原文所描写的残酷。
- source_word: τοὺς ἐμπίπτοντας
  choice: 凡所遇见的人
  rationale: ἐμπίπτω在此可指碰上、遇到或落入行进路线；这一译法保留“沿途遇见”的意义，同时避免暗示受害者主动袭击士兵。
- source_word: ἀναβαίνοντας
  choice: 上到……里
  rationale: ἀναβαίνω直指向上移动。译作“上到房屋里”保留其空间方向，不把它简化为一般的“进入”。
- source_word: κατασφάζειν
  choice: 屠杀
  rationale: 该复合动词表示残酷杀戮，语气强烈；“屠杀”准确传达大规模暴力及其严重性。
- source_word: οἰκίαις
  choice: 房屋
  rationale: 此处关注的是具体建筑空间，故用“房屋”比“家中”更贴近原文。
