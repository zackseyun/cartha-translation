  yaml_path: translation/deuterocanon/2_maccabees/005/016.yaml
  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
translation:
  language: zh_hans
  text: 他用污秽的手拿取神圣的器皿，又用亵渎之手拖走许多君王为使这地方更加兴盛、荣耀和尊贵而奉献[a]的物品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陈设”或“立起”。希腊文这个词较直译可指“立起、陈设”；在这里很可能是指君王献给圣殿并安置其中的供物。
    reason: lexical_alternative
lexical_decisions:
- source_word: μιαραῖς χερσίν
  choice: 污秽的手
  rationale: 保留该词在礼仪和道德层面的玷污意味，并与后文“亵圣的手”形成呼应。
- source_word: ἱερὰ σκεύη
  choice: 圣所的器皿
  rationale: 指圣殿中供神圣用途使用的器物；“圣所的器皿”在现代汉语中清楚自然，也保留礼仪语境。
- source_word: ἀνασταθέντα
  choice: 奉献
  rationale: 上下文所指很可能是君王献给圣殿并安置其中的供物；正文用“奉献”表达其用途，脚注保留“陈设”的较直译可能。
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: 来增添这地方的宏伟、荣耀和尊贵
  rationale: 将目的关系明确表达出来；“宏伟”按圣殿供物的语境传达 αὔξησις 所指的增益或扩充，同时保留三个并列概念。
- source_word: βεβήλοις χερσίν
  choice: 亵圣的手
  rationale: βεβήλος 与神圣之物相对；“亵圣”既自然，又清楚表现这些手对圣物的冒犯，而不把它弱化为一般的不敬。
- source_word: συνσύρων
  choice: 拖走
  rationale: 保留强行拖拽、掠走的动作感和对圣殿供物的侮辱意味。
- source_word: τοῦ τόπου
  choice: 这地方
  rationale: 保留希腊文以“地方”敬称圣殿的委婉说法，并以脚注说明其所指。
theological_decisions:
- issue: 圣物与亵渎之间的礼仪性对照
  choice: 保留“污秽的手—圣所的器皿—亵圣的手”的鲜明对照
  alternative: 用一般性的“不洁”“不敬”或直接把“这地方”改作“圣殿”
  rationale: 原文借两种贬义形容词修饰双手，与神圣器皿和圣殿形成强烈反差；保留这种措辞可呈现亵渎行为的礼仪和道德严重性。
- issue: ἀνασταθέντα 的语义范围
  choice: 正文译作“奉献”，脚注保留“陈设”的可能
  alternative: 正文直译为“陈设”或“设立”
  rationale: 圣殿及君王供物的语境支持“奉献”，但分词本身可较字面地表示“立起、陈设”，不宜完全消除这层歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“污秽”与“亵圣”分别对应原文两种词，避免合并其修辞对照；“拖走”保留掠夺行为的粗暴感。脚注标记均置于相关词语之后。
