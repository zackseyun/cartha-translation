revisions:
- from: 他用污秽的手拿取圣所的器皿，又用亵圣的手，把许多君王奉献[a]来增添这地方[b]的宏伟、荣耀和尊贵的物品拖走。
  to: 他用污秽的手拿取神圣的器皿，又用亵渎之手拖走许多君王为使这地方更加兴盛、荣耀和尊贵而奉献[a]的物品。
  rationale: 将 αὔξησις 由“宏伟”改为“更加兴盛”，以保留其增益／兴盛之义；把“圣所的器皿”改为“神圣的器皿”，避免增添未明说的所属限定；并将“亵圣的手”调整为更自然的“亵渎之手”。脚注 b 仍应保留，因为“这地方”延续了原文对圣殿的敬称；其锚点应置于正文“这地方”之后。
