translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丧生”概括八万人的总数，后两分句分别说明四万人遭杀害、人数不少于此者被卖；对晦涩的ἐν χειρῶν νόμοις及“被卖为奴”的语境含义均以脚注保留原文的不确定性。
