base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/014.yaml
  text: 'And in the three whole days[a], eighty thousand were destroyed: forty thousand by violent hands[b], and no fewer than those who were slaughtered were sold.'
translation:
  language: zh_hans
  text: 在整整三天里，共有八万人遭难：其中四万人死于暴力之手[a]，被卖的人[b]不比被屠杀的人少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译近于“在手的法则中”，是一个含义晦涩的表达；这里理解为遭人以暴力杀害。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被卖为奴的人”；希腊原文只说“被卖”，上下文暗示他们被卖作奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  choice: 八万人
  rationale: μυριάς为“一万”，ὀκτὼ μυριάδες即“八万”；现代汉语直接按总数表达最自然。
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: 在整整三天里
  rationale: 既交代三天的时段，也以“整整”体现πάσαις所强调的完整跨度。
- source_word: κατεφθάρησαν
  choice: 丧生
  rationale: 该动词可指被毁灭或灭亡；在屠杀语境中，“丧生”自然地表达死亡，同时不额外限定具体死法。
- source_word: τέσσαρες μὲν
  choice: 四万人
  rationale: 承接前句省略的μυριάδες，数值为四万。
- source_word: ἐν χειρῶν νόμοις
  choice: 死于暴力之手
  rationale: 原短语字面近于“在手的法则中”，含义晦涩；上下文显然涉及人为暴力。“暴力之手”保留“手”的意象，同时以脚注说明不确定性。
- source_word: τῶν ἐσφαγμένων
  choice: 被屠杀的人
  rationale: σφάζω带有强烈的宰杀、屠杀意味；此译法保留原文的残酷力度，又符合庄重的现代汉语。
- source_word: ἐπράθησαν
  choice: 被卖的人
  rationale: 原文只明确说“被卖”，虽在语境中很可能指被卖为奴，正文不将这一隐含意义明说，改在脚注交代。
