base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: zh_hans
  text: 安条克心里便高傲起来[a]，没有看出，主宰[b]因城中居民的罪，只是暂时发怒；因此，那地方一时被置之不顾[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“心思被抬高”，意思是他心高气傲、自高自大。
    reason: lexical_alternative
  - marker: b
    text: “主宰”译自希腊语 despotes，强调拥有权柄的主人；它不同于通常译作“主”的 kyrios。
    reason: lexical_alternative
  - marker: c
    text: 或译“那地方被忽略（不加看顾）”。“那地方”在此很可能指圣所；原文表达它暂时任凭人亵渎，并非永久被弃。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: 心里便高傲起来
  rationale: 该表达字面含有“被抬高”的意象，在此指安条克内心自高自大；译文保留心理层面，同时采用自然的现代汉语。
- source_word: οὐ συνορῶν
  choice: 没有看出
  rationale: 此处指未能洞察事情背后的真实原因，“没有看出”兼具看见与领会的意味。
- source_word: ἀπώργισται
  choice: 发怒
  rationale: 希腊语完成时被动形式表达因人的罪而被激怒、并处于怒气中的结果状态；汉语用“发怒”较自然，前接原因即可体现受触怒之意。
- source_word: βραχέως
  choice: 只是暂时
  rationale: 明确表达怒气持续时间有限；“只是”也保留经文对时间限度的强调。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: δεσπότης表示拥有绝对权柄的主人或统治者，与κύριος有词汇区别；“主宰”在现代汉语中庄重，并能表达最高权柄。
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: 城中居民
  rationale: 简洁、准确地表达“住在城里的人”，并清楚连接他们的罪与主宰暂时发怒。
- source_word: πάρορασις
  choice: 被置之不顾
  rationale: 该名词有忽略、忽视或不加看顾之意；结合上下文，译为“被置之不顾”可表达圣地暂时失去看顾，却不暗示永久弃绝。
- source_word: περὶ τὸν τόπον
  choice: 那地方
  rationale: τόπος在语境中指圣所所在地，但原文只说“地方”；正文保持这一宽度，以脚注说明其可能所指。
theological_decisions:
- issue: δεσπότης作为上帝称号的译法
  choice: 主宰
  alternative: 主人；主；至高掌权者
  rationale: “主宰”既体现δεσπότης所含的绝对权柄，也避免将其与通常译作“主”的κύριος完全合并。
- issue: 圣地为何遭到亵渎
  choice: 那地方一时被置之不顾
  alternative: 那地方被忽略；那地方不再蒙眷顾
  rationale: 原文把安条克一时得逞与城中居民的罪及主宰短暂的怒气相连，却没有细说神圣看顾暂撤的机制。译文保留这种张力，不将其解释为上帝无力或永久弃绝。
- issue: βραχέως的修饰关系
  choice: 主宰只是暂时发怒
  alternative: 主宰稍微发怒
  rationale: 在语境中，βραχέως较自然地表达时间短暂，而非怒气程度轻微；这也与本段关于管教并非永久的思想吻合，但不额外扩展其教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里便高傲起来”自然呈现希腊语习语；“主宰”保留神圣称号的词汇区别；末句加入“一时”以在汉语中承接前文βραχέως所表达的暂时性，但不增添原文以外的永久性判断。所有脚注标记均置于相应正文词语之后。
