base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/024.yaml
  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: zh_hans
  text: 可是，他派了那污秽之首亚波罗尼乌斯，率领一支两万二千人的军队，并命令他把所有正值壮年的人屠杀，把妇女和较年轻的人卖掉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按当时的语境，意即“卖作奴隶”。希腊文直译只是“卖掉”，但很可能暗指奴役。
    reason: 说明词义在战争语境中的隐含结果，同时避免正文过度明说。
lexical_decisions:
- source_word: ἔπεμψεν
  choice: 派了
  rationale: πέμπω 的不定过去时，表示派遣；“派了”在现代汉语叙事中自然明确。
- source_word: μυσάρχην
  choice: 污秽之首
  rationale: 这是罕见而带贬义的词，含有污秽、玷污之意，并非中性的官职名称；“污秽之首”保留其辱称色彩，也避免虚构技术性头衔。
- source_word: μετὰ στρατεύματος
  choice: 率领一支……军队
  rationale: στράτευμα 指军事部队；结合人数，用“军队”自然贴切。
- source_word: δισμυρίους δὲ τοῖς δισχιλίοις
  choice: 两万二千人
  rationale: 原文按“二万加二千”表达，总数为两万二千；汉语直接合并数字更自然。“人”由军队人数的语境补足。
- source_word: προστάξας
  choice: 并命令他
  rationale: 该分词说明派遣时所下的命令；补出受命者“他”，使汉语指向清楚。
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: 所有正值壮年的人
  rationale: 该短语指已达成年或处于体力盛期的人；“正值壮年”保留年龄与生命盛期的含义，不将其硬性限定为法律意义上的成年人。
- source_word: κατασφάξαι
  choice: 屠杀
  rationale: 该复合动词比普通的“杀死”更强烈，传达残酷而大规模杀戮的语气。
- source_word: τὰς δὲ γυναῖκας
  choice: 妇女
  rationale: 这里指作为一类人的女性，与被杀的壮年人及较年轻者相对，并非特指妻子。
- source_word: τοὺς νεωτέρους
  choice: 较年轻的人
  rationale: νεώτερος 是比较级，所指年龄范围并不明确；此译保留比较意味，不擅自收窄为儿童或青年。
- source_word: πωλεῖν
  choice: 卖掉
  rationale: πωλέω 本义为“卖”；战乱语境很可能指卖作奴隶，但原文未明说，正文保留较直接的表达。
theological_decisions:
- issue: 是否把 πωλεῖν 所暗示的奴役结果明确写入正文
  choice: 卖掉
  alternative: 卖作奴隶
  rationale: 历史语境强烈暗示被卖为奴，但希腊文动词本身只说“卖”。正文不超出原文，脚注说明其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“污秽之首”刻意保留原文罕见称谓的贬斥性；“正值壮年的人”和“较年轻的人”保留年龄表达的弹性。脚注标记置于相关句末。
