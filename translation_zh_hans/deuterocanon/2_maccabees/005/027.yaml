base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: zh_hans
  text: 但又名马加比的犹大退到山中，当时他们一行约有十人[a]。他和与他在一起的人像野兽一样生活，始终以草木为食，免得沾染污秽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的说法十分简略，字面近似“成了约第十个”，也可理解为犹大身边只剩下一支约十人的队伍。
    reason: 说明原文 δέκατός που γενηθεὶς 的压缩表达、约数含义及语法歧义。
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: 又名马加比的犹大
  rationale: ὁ καὶ 表示另一个名字或称号。“马加比”按希腊文 Μακκαβαῖος 音译，并采用现代中文圣经语境中通行、易懂的形式。
- source_word: δέκατός που γενηθεὶς
  choice: 当时他们一行约有十人[a]
  rationale: 原文表达高度压缩，που 明确带有“约、差不多”的意思；结合语境，最自然地指犹大所剩的队伍约有十人。正文采用可理解的表达，脚注保留其字面结构及语法歧义。
- source_word: ἀναχωρήσας
  choice: 退到山中
  rationale: ἀναχωρέω 表示撤离、退避；与后面的山中地点合并表达，使中文自然，同时不把行动过度限定为正式军事撤退。
- source_word: ἐν τοῖς ὄρεσι
  choice: 山中
  rationale: 直接表达复数 ὄρεσι 所指的山区或群山之中，简洁自然。
- source_word: θηρίων τρόπον διέζη
  choice: 像野兽一样生活
  rationale: 保留原文鲜明的明喻，表达他们在荒野中艰苦求生的状态，不额外加入“逃亡”或“藏匿”等原文未明说的内容。
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: 和跟随他的人
  rationale: 原文只说明这些人与犹大同在，没有进一步界定其身份；此译法保持这种开放性。
- source_word: τὴν χορτώδη τροφὴν
  choice: 草木
  rationale: χορτώδης 指草本、绿色植物一类的食物。“草木”既保留其广义植物性，又避免把它收窄为特定的“野菜”。
- source_word: σιτούμενοι διετέλουν
  choice: 始终以……为食
  rationale: διετέλουν 与分词连用具有持续意味，表示他们一直靠这种食物维生。
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: 免得沾染污秽
  rationale: 表达不参与、不沾上 μολυσμός 的目的；“污秽”保留其宗教和道德分量，同时不限定为纯粹礼仪意义上的不洁。
theological_decisions:
- issue: μολυσμός 所指污秽的性质
  choice: 译作“污秽”，不进一步限定
  alternative: 仅指礼仪上的不洁；或泛指污染、败坏
  rationale: 在安条克迫害的上下文中，这词可能兼有禁食、异教礼俗和背教所造成的礼仪及道德污染。译作“污秽”能保留这种复合含义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式略作拆分，以免希腊文多个分词连续堆叠；保留“像野兽一样”的强烈比喻，并用“始终”呈现持续动作。脚注标记已在正文对应位置出现。
