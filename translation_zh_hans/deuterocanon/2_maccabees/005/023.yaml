base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: zh_hans
  text: 又派安德洛尼古驻在基利心山[a]。此外，默乃劳在对市民作恶方面比其他人更甚[b]，对犹太市民心怀敌意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驻在基利心山”也可译作“驻在基利心”；原文介词可表示在该地或该地区。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“在恶行上比其他人更甚”；原文以比较结构强调他对市民所行的恶比其余人更严重。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν Ἀνδρόνικον
  choice: 又派安德洛尼古驻在基利心山
  rationale: 本节承接上一节省略的支配动词，按汉语补出“派……驻在”，以表达官员所在的管辖地点；人名、地名采用通行的中文音译。
- source_word: πρὸς δὲ τούτοις
  choice: 此外
  rationale: 简洁保留添加另一人物的连接作用。
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: 作恶，胜过其他所有人
  rationale: 保留ὑπερήρτετο的超越、胜过之意，并以“作恶”传达χείριστα在此处的负面道德含义。
- source_word: τοῖς πολίταις
  choice: 对市民
  rationale: 保留πολίτης的公民或城市居民色彩；“市民”在现代汉语中比“公民”更适合此古代城市共同体语境。
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: 心怀敌意
  rationale: 自然表达持续的敌对态度，同时避免把该短语过度解释为具体行动。
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: 对犹太市民
  rationale: 同时保留“犹太”和“市民”两个要素，不泛化为单纯的“犹太人”。
theological_decisions:
- issue: 是否将πολίταις／πολίτας泛化为“人民”或“同胞”
  choice: 两处均译作“市民”
  alternative: 人民；同胞；犹太人
  rationale: 原文重复使用πολίτης，突出其对城市共同体成员的恶行和敌意；保留这一社会政治层面的含义。
- issue: χείριστα τῶν ἄλλων ὑπερήρτετο的谴责强度
  choice: 作恶，胜过其他所有人
  alternative: 比其他人更坏；恶贯群伦
  rationale: 译文保留比较和道德谴责，但不用带有额外修辞色彩的成语，以免强化原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。因本节希腊文开头承接上文而省略谓语，正文补出“派……驻在”以形成自然完整的汉语句子；脚注保留地点表达及比较结构的原文特点。
