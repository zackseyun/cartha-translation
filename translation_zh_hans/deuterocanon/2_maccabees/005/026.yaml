  text: And he confined all the Jews to the spectacle, and, rushing into the city with weapons, he brought down a considerable slaughter.
translation:
  language: zh_hans
  text: 他把所有犹太人都拘禁在那场公共庆典[a]中，随后带着兵器冲进城里，杀害了大批人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公共庆典”也可译作“观看活动”“节庆盛会”或“公众表演”；希腊语 θεωρία 可指观看活动，也可指供公众观看的节庆场合。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρίαν
  choice: 观看盛会的地方
  rationale: θεωρία可指观看、观礼或供公众观看的节庆场合；结合ἐπὶ τὴν θεωρίαν，译文以“观看盛会的地方”表达聚集观看的公共场合，同时用脚注保留其词义范围。
- source_word: συνεκέκλεισεν
  choice: 围困
  rationale: 该动词表示把人一同封闭、围住或限制在某处；“围困”既体现强制性，也符合随后武装袭击的语境。
- source_word: εἰσδραμὼν
  choice: 冲进
  rationale: 分词表示快速而猛烈地进入；“冲进”自然地传达其暴力势头。
- source_word: σὺν τοῖς ὅπλοις
  choice: 带着兵器
  rationale: 原文明确提到兵器；此译法保留具体意象，而不只概括为“全副武装”。
- source_word: ἱκανὰ κατέστησεν πλήθη
  choice: 杀倒了许多人
  rationale: 这是紧缩的表达，字面涉及使相当多的人倒下；在武装袭城的语境中，“杀倒了许多人”保留“倒下”的动态意象，并明确其致命结果。
