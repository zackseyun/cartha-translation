  to: 但是，若不是我们陷在许多罪中[a]，这人一上前，就会像奉塞琉古王差遣来查验宝库的希略多禄一样，立刻遭受鞭打，狂妄也被挫败。
  rationale: 修订纠正了本节的关键句法关系：赫利奥多罗斯是历史类比的对象，而“这人”才是会在假设情形下遭鞭打、狂妄受挫的人。删除无原文依据且倒置叙事逻辑的“我们也早已受到击打了”。其余调整使条件句和“宝库”的表达更符合现代标准汉语及希腊文语义。
