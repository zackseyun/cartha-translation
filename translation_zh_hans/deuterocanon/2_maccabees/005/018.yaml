base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: zh_hans
  text: 但是，若不是我们陷在许多罪中[a]，这人一上前，就会像奉塞琉古王差遣来查验宝库的希略多禄一样，立刻遭受鞭打，狂妄也被挫败。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于：“但是，若不是我们碰巧陷在许多罪中，这人一上前，就会像那奉塞琉古王差遣来查验宝库的希略多禄一样，立刻遭受鞭打，并从他的狂妄中被扭转过来。”这里“这人”与“希略多禄”有别；按上下文指安提阿古。
    reason: 说明反事实条件句的表达，并澄清原文指示词οὗτος的主语及其与比较对象赫利奥多罗斯的区别。
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  choice: 已经陷在
  rationale: συνέβην与不定式共同构成与事实相反的条件；“陷在”自然表达卷入、受牵连于罪中的状态，也保留中间／被动色彩。
- source_word: πολλοῖς ἁμαρτήμασιν
  choice: 许多罪中
  rationale: 与προενέχεσθαι搭配，表示人所陷入的道德处境；“在许多罪中”符合现代汉语习惯。
- source_word: ἐπὶ τὴν ἐπίσκεψιν
  choice: 来查验
  rationale: 表示受差遣的目的；“查验”兼具查看和履行公务的意味。
- source_word: γαζοφυλακίου
  choice: 库房
  rationale: 该词可指宝库或储藏宝物的房间。此处上下文所指是圣殿库房，但原句本身未明说“圣殿”，故正文不增补。
- source_word: προαχθεὶς
  choice: 一上前
  rationale: 按叙事次序理解为希略多禄向前采取行动；既保留动作意象，也避免把分词武断地解释为被带到前面。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达惩罚随即发生。
- source_word: μαστιγωθεὶς
  choice: 遭受鞭打
  rationale: 明确表达用鞭严厉击打的被动意义，语体庄重且易懂。
- source_word: ἀνετράπη τοῦ θράσους
  choice: 不得不收起他的狂妄
  rationale: 传达其放肆胆量受到挫败、被迫止息的意思；“狂妄”比中性的“胆量”更符合θράσος在此处的负面语境。
theological_decisions:
- issue: 条件比较中隐含的主句结论
  choice: 正文补出“我们也早已受到击打了”
  alternative: 依照希腊文保留未完结结构，只叙述希略多禄遭鞭打并收起狂妄
  rationale: 希腊文在比较中省略了针对“我们”的明确结论，但上下文清楚暗示：若不是百姓罪孽众多，来犯者也会像希略多禄一样立即受罚。现代汉语若完全省略会显得句意残缺，因此补出最低限度的隐含内容；脚注说明这一补足。
- issue: 百姓的罪与来犯者未立即受罚之间的张力
  choice: 保留与事实相反的条件，不进一步解释神为何如此行事
  alternative: 增写这是神因百姓犯罪而暂缓保护或施行管教
  rationale: 原文只以条件和历史类比表达关系，并未在本节详述神学机制；译文不引入额外的教义性说明。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“希略多禄”“塞琉古”使用常见音译；保留长条件比较句的修辞结构，同时以逗号分层，便于普通读者理解。
