base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
translation:
  language: zh_hans
  text: 他还留下官员加害这个民族[a]：在耶路撒冷留下腓力；他是弗里吉亚人，性情却比任命他的那人更为野蛮[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“压迫这个民族”或“苦害这个民族”。希腊文 τοῦ κακοῦν 可指伤害、苦害或压迫。
    reason: lexical_alternative
  - marker: b
    text: “比任命他的那人更为野蛮”强化了作者的道德评断：腓力被描写为比安置他任职的统治者还要严酷。
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  choice: 留下
  rationale: 保留“留在当地、留置”的基本含义；上下文同时表明这些人被安置为官员，但不必把该词直接译成“任命”。
- source_word: ἐπιστάτας
  choice: 官员
  rationale: 该词指受权管理、监督他人的人。“官员”在现代汉语中自然，也避免把具体官职限定为“总督”或“监督”。
- source_word: τοῦ κακοῦν
  choice: 专门苦害
  rationale: 带冠词的不定式在此表示这些官员被留下的目的或职能；“苦害”涵盖伤害、虐待和压迫，而“专门”使目的意味清楚。
- source_word: τὸ γένος
  choice: 这民族
  rationale: 此处指作为族群共同体的犹太民族；“民族”比现代语境中的“种族”准确，也比泛称“人民”更能体现群体身份。
- source_word: ἐν μὲν Ἱεροσολύμοις Φίλιππον
  choice: 在耶路撒冷，他留下腓力
  rationale: 希腊文开始列举各地被留下的人；补出“他留下”使汉语句法完整，同时不改变原意。
- source_word: τὸ μὲν γένος Φρύγα
  choice: 出身于弗吕家
  rationale: γένος在这里说明族裔或地域出身；此译法自然，并避免现代“种族”一词可能造成的误解。
- source_word: τὸν δὲ τρόπον
  choice: 性情
  rationale: τρόπος在与出身相对照的结构中指人的品性、性情，而不只是某一次行为或举止。
- source_word: βαρβαρώτερον ἔχοντα
  choice: 更加野蛮
  rationale: 保留原文明确的比较级和作者强烈的道德评断；“野蛮”比“残暴”更贴近 βάρβαρος 的历史修辞范围。
- source_word: τοῦ καταστήσαντος
  choice: 比任命他的那人
  rationale: 该分词指将腓力安置在此职位上的人；“任命他的那人”是清楚自然的现代汉语表达，同时保留原文未直呼其名的方式。
