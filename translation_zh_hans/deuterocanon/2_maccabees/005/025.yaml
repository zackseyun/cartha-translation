base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: zh_hans
  text: 但这人来到耶路撒冷，假装怀有和平的意图，按兵不动，直到圣安息日；他趁犹太人不备[a]，便命令部下武装起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“趁犹太人措手不及”。此处希腊语措辞十分凝练，具体所指情形不完全明确。
    reason: 保留该处短语的压缩性与解释上的不确定性，避免把犹太人的不备具体归因于某一种安息日处境。
lexical_decisions:
- source_word: παραγενόμενος
  choice: 来到
  rationale: 在叙事中表示抵达耶路撒冷；“来到”自然简洁，也准确保留其行程的终点。
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: 假装怀有和平的意图
  rationale: ὑποκριθεὶς 表示装作、扮演，εἰρηνικός 表示和平或温和；此译明确传达其和平姿态是伪装，并避免误作性情温和。
- source_word: ἐπέσχεν
  choice: 按兵不动
  rationale: 此处指暂缓行动、等待时机；结合军事语境，“按兵不动”自然地表达其策略性等待。
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: 直到安息日这个圣日
  rationale: 保留 ἁγίας 对安息日“圣”的明确描述，同时采用现代汉语清楚自然的表达。
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: 趁犹太人毫无防备
  rationale: 希腊语短语凝练且存在解释难点；上下文显示他利用安息日使犹太人处于易受袭击的状态。“趁……毫无防备”传达突袭意味，但以脚注保留原文的不确定性。
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: 部下
  rationale: 指处于他权下的人；军事上下文中“部下”简洁自然。
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: 命令……武装起来
  rationale: παρήγγειλεν 表示下令，ἐξοπλίαν 涉及武装或全副装备；“武装起来”准确传达准备军事行动的命令。
theological_decisions:
- issue: 安息日的性质
  choice: 安息日这个圣日
  alternative: 圣安息日
  rationale: 原文明确以 ἁγίας 称安息日为圣；直译保留其宗教与文化意义，又不额外引入特定教派解释。
- issue: 犹太人在安息日的脆弱处境
  choice: 趁犹太人毫无防备，并以脚注说明歧义
  alternative: 趁犹太人守安息日时
  rationale: 原文短语本身压缩且语义不完全明朗。正文呈现上下文中的突袭含义，脚注则避免把具体原因过度确定为某一种安息日实践。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“假装怀有和平的意图”凸显欺骗性；“按兵不动”与“武装起来”符合军事语境。正文中的脚注标记 [a] 与脚注完全对应。
