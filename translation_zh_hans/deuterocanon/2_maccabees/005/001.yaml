  text: About that time Antiochus launched his second expedition into Egypt[a].
translation:
  language: zh_hans
  text: 约在这时，安条克第二次出征埃及。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安条克向埃及发动第二次进攻。”希腊文动词可较直译为“派遣”或“出发”；“远征”也可译作“进攻”或“战役”。
    reason: 保留ἐστέλατο和ἔφοδος的词义范围，且不把原文的军事行动误改为“军队”。
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: 约在这时
  rationale: περί加时间宾格在这里表示大致的时间范围；“约在这时”自然简洁，并保留近似意味。δέ在叙事推进中不必机械译为“但是”。
- source_word: τὴν δευτέραν ἔφοδον
  choice: 第二次远征
  rationale: ἔφοδος可指进攻、战役或军事远征。结合安条克向埃及进军的历史语境，“远征”既体现军事性质，也避免把行动缩窄为一次具体袭击。
- source_word: ὁ Ἀντίοχος
  choice: 安条克
  rationale: 按现代汉语通行的圣经人名译法音译该专名。
- source_word: εἰς Αἴγυπτον
  choice: 进军埃及
  rationale: εἰς表示朝向并进入某地；“进军埃及”在军事叙事中自然体现这一方向性。
- source_word: ἐστέλατο
  choice: 发动了
  rationale: στέλλω的中间语态在此可表示亲自发起、展开或派出行动；与“远征”搭配译作“发动了”符合现代汉语，同时在脚注保留较直译的可能。
