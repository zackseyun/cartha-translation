base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/015.yaml
  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: zh_hans
  text: 但他还不满足于这些事，竟敢进入全地最神圣的圣殿[a]，由米涅劳斯引路；这米涅劳斯已经成了律法和祖国的叛徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全境最神圣的圣所。”希腊文“地”既可指整个大地，也可指一片国土。
    reason: 说明γῆ的范围存在真实歧义，并呈现ἱερόν可译作“圣所”的词汇选择。
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: 但他还不满足于这些事
  rationale: 保留分词结构承接上文的作用，并以“还不满足”表达罪行进一步升级的叙事语气。
- source_word: κατετόλμησεν
  choice: 竟敢
  rationale: 该动词带有放肆、僭越的意味；“竟敢”自然体现叙述者的震惊与谴责。
- source_word: πάσης τῆς γῆς
  choice: 全地
  rationale: γῆ既可指整个大地，也可指一片国土；正文采用较为凝练且保留一定范围弹性的“全地”，脚注说明另一种理解。
- source_word: ἁγιώτατον ἱερὸν
  choice: 最神圣的圣殿
  rationale: ἁγιώτατον是最高级，ἱερόν在此指圣殿；此译保留原文对圣殿神圣性的最高级宣称。
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: 并让米涅劳斯给他领路
  rationale: 以自然现代汉语表达伴随分词的引导关系，同时明确米涅劳斯实际协助他进入。
- source_word: τῶν νόμων
  choice: 律法
  rationale: 希腊文虽为复数，但在犹太语境中指祖传律例的整体；现代汉语以集合意义的“律法”更自然，不改变所指。
- source_word: τῆς πατρίδος
  choice: 祖国
  rationale: πατρίς指本国、本乡或故土；“祖国”在此简洁表达其民族与国土归属。
- source_word: προδότην γεγονότα
  choice: 已经成了……叛徒
  rationale: 用“已经成了”体现完成时分词所表达的既成状态。
theological_decisions:
- issue: 圣殿神圣性的最高级及γῆ的范围
  choice: 全地最神圣的圣殿
  alternative: 全国最神圣的圣所
  rationale: 保留ἁγιώτατον的最高级，不削弱原文对圣殿的崇高宣称；同时不武断限定γῆ究竟指普天下还是本地，以脚注呈现词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟敢”传达原文的僭越与递进语气；分号使后半句对米涅劳斯的评断清楚有力。人名按通行希腊语音译作“米涅劳斯”。
