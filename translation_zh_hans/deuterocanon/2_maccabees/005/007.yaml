base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/007.yaml
  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
translation:
  language: zh_hans
  text: 他没有夺得统治权[a]；这场图谋最终使他蒙羞，于是他再次逃亡到亚扪地区[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有取得统治地位”或“没有掌握政权”。这里的希腊语动词用法罕见；按上下文，是说他未能夺得自己企图取得的统治权。
    reason: lexical_alternative
  - marker: b
    text: “亚扪地区”指亚扪人居住的地域。
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  choice: 统治权
  rationale: 这里的ἀρχή指雅宋企图夺取的政治统治权，而不是“开始”；“统治权”既准确又不过度限定为某一具体官职。
- source_word: οὐκ ἐκρίτησεν
  choice: 没有夺得
  rationale: ἐκρίτησεν在此用法罕见，结合上下文表示未能取得或控制所争夺的统治权；“没有夺得”保留争权语境，也符合现代汉语。
- source_word: τὸ δὲ τέλος τῆς ἐπιβουλῆς
  choice: 这场图谋最终
  rationale: τέλος可指结局或结果，ἐπιβουλή指带敌意的谋划；采用自然的汉语语序表达“图谋的最终结果”，不把它强化为已有明确组织形式的“阴谋”。
- source_word: αἰσχύνην λαβών
  choice: 使他蒙羞
  rationale: 原文直译为“受了羞辱”。结合前面的图谋，以“这场图谋最终使他蒙羞”清楚传达其失败招致羞辱的结果。
- source_word: φυγὰς πάλιν … ἀπῆλθεν
  choice: 于是他再次逃亡到
  rationale: φυγάς带有逃亡者或流亡者色彩，与ἀπῆλθεν合用表示逃离而去；“再次逃亡到”自然保留重复逃亡及流亡的意味。
- source_word: Ἀμμανῖτιν
  choice: 亚扪地区
  rationale: 该词是亚扪人的地域名称；用“亚扪地区”比音译“阿曼尼提斯”更易于普通中文读者识别，并以脚注说明。
