base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: zh_hans
  text: 于是，安条克从圣殿劫走一千八百塔连得之后，便迅速前往安提阿。他出于狂妄，竟以为自己能使陆地可供行船、海洋可供行走[a]；这都是因为他内心自高[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里采用刻意夸张的悖反意象：安条克自以为能颠倒自然秩序，使陆地可以行船，海洋可以行走。
    reason: cultural_note
  - marker: b
    text: “内心自高”直译所表达的是心被抬高或高高扬起，意指傲慢自负、过度高估自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: 一千八百
  rationale: 该希腊习语直译为“八百加上一千”，总数为一千八百；中文直接写出总数最清楚自然。
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: 从圣殿劫走……之后
  rationale: 分词表示先于主句发生的带走行动；上下文是掠夺，因此用“劫走”表达其强取性质。ἱερόν在此指圣殿整体，并非仅限于内殿。
- source_word: θᾶττον εἰς τὴν Ἀντιόχειαν ἐχωρίσθη
  choice: 便迅速前往安提阿
  rationale: θᾶττον突出行动迅速，ἐχωρίσθη在语境中表示离开并去往安提阿；译文保留目的地和匆忙之意。
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: 出于狂妄
  rationale: 该短语说明他产生妄想的根源；“狂妄”兼具傲慢与不自量力之意，适合下文颠倒自然秩序的夸张想象。
- source_word: τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν θέσθαι
  choice: 使陆地可供行船、海洋可供行走
  rationale: 保留原文刻意对举的悖反意象：陆地变得可以航行，海洋变得可以行走。πορευτόν本身仅指可通行，中文不额外加入“步行”，以免把语境所暗示的方式写成词义本身。
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: 因为他内心自高
  rationale: μετεωρισμός带有抬高、高傲自负之意；“内心自高”既保留心的意象和负面评价，又符合现代中文表达。
theological_decisions:
- issue: τῆς καρδίας的圣经人论意象
  choice: 内心
  alternative: 心思／心高气傲
  rationale: 原文以“心”作为骄傲、意志和自我估量的中心。“内心”保留这一圣经意象，同时避免把它缩减为单纯的理性思维；“心高气傲”虽自然，但会增加原文没有明说的“气”。
- issue: 对安条克夸张自我估量的呈现
  choice: 保留“陆地行船、海洋行走”的悖反对举
  alternative: 解释为“自以为什么事都做得到”
  rationale: 原文以颠倒自然秩序的意象揭示他的狂妄；直保留意象能维持叙事的讽刺张力，而不把它化约为抽象评语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“塔连得”保留古代重量及货币单位名称；“圣殿”符合犹太圣殿语境。原文连续使用两个表达骄傲的短语，译文分别作“出于狂妄”和“内心自高”，不消除其有意的语义叠加。
