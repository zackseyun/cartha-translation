base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: zh_hans
  text: 那使许多人背井离乡的人，自己却死在异乡；他被带往拉栖代梦人那里[a]，仿佛能凭着彼此的亲缘关系[b]得到庇护。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉栖代梦人”也就是斯巴达人。这里按希腊文的族名直译。
    reason: lexical_alternative
  - marker: b
    text: 这里的“亲缘关系”可能是指犹太人与斯巴达人之间传统上所宣称的亲缘关系；参看《玛加伯上》12:6—23。
    reason: cross_reference
lexical_decisions:
- source_word: συχνοὺς
  choice: 许多人
  rationale: 该词指人数众多；在分词结构中作实质性宾语，译为“许多人”自然且不额外限定性别。
- source_word: τῆς πατρίδος ἀποξενώσας
  choice: 使……背井离乡
  rationale: ἀποξενόω具有使人成为异乡人、使人离开本土之意；“背井离乡”保留被迫离开故土的意味，并与下文“异乡”形成反讽对照。
- source_word: ἐπὶ ξένης
  choice: 在异乡
  rationale: ξένη在此省略了“土地/地方”一类名词，意为异国他乡；“异乡”简洁地呼应前面的故土意象。
- source_word: ἀπώλετο
  choice: 死
  rationale: 中态不定过去时在此表示灭亡、丧命；“死”符合现代汉语叙事，语境中的报应式反讽仍由句子结构体现。
- source_word: πρὸς Λακεδαιμονίους
  choice: 前往拉栖代梦人那里
  rationale: 保留希腊族名的较直译形式；较熟悉的“斯巴达人”列入脚注。
- source_word: ἀναχθεὶς
  choice: 前往
  rationale: 该词可指被带去、启程或乘船前往；上下文没有明确说明受强迫，故采用中性的移动表达，以保留方式上的含混。
- source_word: ὡς
  choice: 以为
  rationale: 此处引出主体的预期或设想，并暗含该期待最终落空；“以为”自然表达这种主观判断。
- source_word: διὰ τὴν συγγένειαν
  choice: 凭着彼此的亲缘关系
  rationale: συγγένεια指亲属或共同血缘关系；补出“彼此的”仅使汉语所指清楚，不在正文中判定这项关系是否真实。
- source_word: τευξόμενος σκέπης
  choice: 便可得到庇护
  rationale: τυγχάνω接属格表示获得，σκέπη表示遮蔽、保护或庇护；“得到庇护”符合寻求政治保护的语境。
theological_decisions:
- issue: 犹太人与拉栖代梦人亲缘关系的历史主张
  choice: 正文中性译作“彼此的亲缘关系”
  alternative: 所谓的亲缘关系
  rationale: 希腊文没有明说这种亲缘关系只是声称或传说；因此不在正文加入质疑性限定，而在脚注说明其历史背景。
- issue: 叙事中的报应反讽
  choice: 通过“使许多人……自己却……”的对照呈现
  alternative: 显明这是对他的报应
  rationale: 原文以故土与异乡的对应传达道德反讽，但没有直接使用“报应”一词，故不作神学性扩写。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“背井离乡／异乡”重现原文πατρίς与ξένη的鲜明对照；用“自己却”显出原句的反讽而不额外解释。脚注标记均置于相关句末，并与脚注内容对应。
