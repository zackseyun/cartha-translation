  yaml_path: translation/deuterocanon/2_maccabees/011/013.yaml
  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: zh_hans
  text: 但他并不愚昧；他在心里衡量自己所遭受的挫败，又看出希伯来人是不可战胜的，因为大能的上帝正与他们并肩作战，于是预先派人去[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文在这里没有结束，句意接续下一节。
    reason: 说明希腊文以分词收束本节，实际句法延续至后文，避免读者误以为译文残缺。
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: 但他并不愚昧
  rationale: 保留分词结构的因果背景和转折语气；“并不愚昧”自然表达其并非缺乏判断力。
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: 他在心里衡量
  rationale: ἀντιβάλλω含有对照、权衡之意；结合反身短语πρὸς ἑαυτόν，译为内心权衡，避免生硬的“与自己比较”。
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: 自己所遭受的挫败
  rationale: ἐλάττωμα可指损失、劣势或败绩；“挫败”符合军事语境，又不把它过度限定为彻底战败。
- source_word: συννοήσας
  choice: 又看出
  rationale: 表达经过思量后形成的认识，并体现这一认识先于随后派人的行动。
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: 希伯来人是不可战胜的
  rationale: 准确保留ἀνίκητος在此处“不能被征服”的强烈修辞意义。
- source_word: τοῦ δυναμένου θεοῦ
  choice: 大能的上帝
  rationale: 该短语直指有能力、有权能的上帝；“大能的上帝”在现代汉语中庄重自然。
- source_word: συμμαχοῦντος αὐτοῖς
  choice: 正与他们并肩作战
  rationale: συμμαχέω在军事语境中指作为盟友共同作战；此译保留上帝主动参战援助的含义。
- source_word: προαποστείλας
  choice: 于是预先派人去
  rationale: 该分词表示事先差遣；原句延续到下一节，中文以破折号保留未完的句法推进。
theological_decisions:
- issue: 上帝在战斗中援助希伯来人
  choice: 因为大能的上帝正与他们并肩作战
  alternative: 有大能的上帝作他们的盟友
  rationale: 原文明确把希伯来人的不可战胜与上帝作为盟友的主动支援相连；主文保留军事行动色彩，脚注提示同样成立的关系性译法，不弱化也不扩展其神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“在心里衡量”传达内省权衡；“挫败”保留ἐλάττωμα的语义宽度；末尾破折号体现原文跨节未完句。
