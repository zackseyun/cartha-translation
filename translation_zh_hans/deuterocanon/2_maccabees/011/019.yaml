  yaml_path: translation/deuterocanon/2_maccabees/011/019.yaml
  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
translation:
  language: zh_hans
  text: 所以，你们若在这些事务上保持善意，我今后也会尽力为你们带来好处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντηρήσητε
  choice: 保持
  rationale: 该动词表示继续保存已有的态度；“保持”自然地传达持续维持之意。
- source_word: εὔνοιαν
  choice: 善意
  rationale: 该名词指友好、有利的态度；“善意”符合外交书信的语气。
- source_word: εἰς τὰ πράγματα
  choice: 在这些事务上
  rationale: 这是概括当前有关事务的宽泛表达，不宜具体化为某一件事。
- source_word: εἰς τὸ λοιπόν
  choice: 今后
  rationale: 该短语指从此以后，现代汉语以“今后”表达简洁自然。
- source_word: πειράσομαι
  choice: 会尽力
  rationale: 未来时中间语态表达意愿和努力，而非保证结果；“会尽力”保留这一语气。
- source_word: αἰτιαῖος
  choice: 促成
  rationale: 该形容词表示成为某事的原因或对其产生负有因果作用；结合汉语表达，“促成”保留因果意味而避免生硬。
- source_word: ἀγαθῶν
  choice: 好事
  rationale: 复数形式所指宽泛而未具体说明；“好事”保留这种概括性，也可涵盖实际益处。
