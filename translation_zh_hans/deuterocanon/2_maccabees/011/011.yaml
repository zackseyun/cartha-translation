  yaml_path: translation/deuterocanon/2_maccabees/011/011.yaml
  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: zh_hans
  text: 他们像狮子一样扑向敌人，击倒了他们一万一千人和一千六百名骑兵；又迫使他们全都逃跑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες
  choice: 他们如狮子般猛扑
  rationale: 该短语在此描写如狮子扑击般冲向敌军；采用自然的现代汉语明喻，保留勇猛迅疾的形象。
- source_word: κατέστρωσαν
  choice: 击杀了
  rationale: 本义有“使倒下、击倒”之意；在战斗及明确伤亡数字的语境中译作“击杀”最为清楚。
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: 一万一千人
  rationale: 按希腊语数目结构，即在一万之外再加一千。
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: 又击杀骑兵一千六百人
  rationale: ἱππεῖς 指骑兵；数目为一千加六百。汉语补出承前省略的“击杀”，使句法明确。
- source_word: τοὺς δὲ πάντας
  choice: 其余的人全都
  rationale: 字面可理解为“他们所有人”；鉴于前文已有被杀者，汉语用“其余的人”表达仍存活并逃走的敌军，避免表面逻辑冲突。
- source_word: ἠνάγκασαν φεύγειν
  choice: 迫使……逃跑
  rationale: 准确保留“强迫、迫使”与不定式“逃跑”的使役关系。
