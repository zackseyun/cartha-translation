review_pass:
  verdict: revise
  source_fidelity: “其余的人”不是原文所明说；τοὺς…πάντας直译为“他们全都”。虽然叙事上自然指尚能逃跑的敌军，但译文不宜为协调表面逻辑而加入这一限制。“击杀”也比κατέστρωσαν（使倒下、击倒）更明确地断言死亡；原文和英文审计轨迹均保留较宽的“击倒/打倒”意义。
  naturalness: 原译整体通顺，但“击杀了敌军一万一千人，又击杀骑兵一千六百人”重复且将骑兵置于“敌军”之外的关系略显生硬。修订后以分号连接两组战果，简洁自然。
  terminology: “骑兵”符合军事语境；“像狮子一样扑向敌人”保留原文的比喻和动作意象。“击倒”避免把战场动词不必要地收窄为“杀死”。
  issues:
  - severity: medium
    issue: “其余的人”增加了原文没有明确表达的限定。
    rationale: τοὺς δὲ πάντας意为“他们全都”；即使上下文可推知是未被击倒者，译文仍应保留原文的概括表达。
  - severity: medium
    issue: “击杀”将κατέστρωσαν的较宽泛战斗动作固定为死亡。
    rationale: 该词可指击倒、使倒下；在此不必排除死亡，但原文没有要求译文明确断言所有数字均为死亡人数。
  revised_text: 他们像狮子一样扑向敌人，击倒了他们一万一千人和一千六百名骑兵；又迫使他们全都逃跑。
