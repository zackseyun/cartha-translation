  yaml_path: translation/deuterocanon/2_maccabees/011/035.yaml
  text: Concerning the things that Lysias, the king’s kinsman, granted to you, we also approve.
translation:
  language: zh_hans
  text: 至于王的亲属吕西亚所准许给你们的事，我们也予以认可。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: 至于……的事
  rationale: 此处引出所论事项，不取代替义；这样的表达既保留原文衔接，也符合现代汉语公函语体。
- source_word: Λυσίας
  choice: 吕西亚
  rationale: 按希腊文 Λυσίας 音译，并采用现代中文中可辨识的译名形式。
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: 王的亲属
  rationale: συγγενής 基本义为有亲缘关系的人；译作“亲属”保留亲缘含义，不把它过度解释为特定宫廷官衔。
- source_word: συνεχώρησεν
  choice: 准给
  rationale: 该动词在外交公函语境中表示准许、让予或作出让步；“准给”简洁地体现正式批准并给予对方的事项。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 将与 συνεχώρησεν 相连的与格受益者自然译为“给你们”。
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: 我们也表示同意
  rationale: συνευδοκέω 表示一同赞同或认可；“表示同意”符合诏令或外交文书语境，也避免仅译成抽象意见一致。
