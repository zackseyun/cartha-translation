base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: zh_hans
  text: 他劝服对方，就一切正当的诉求达成和解[a]，并向对方保证，自己也会劝服王，迫使王成为他们的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就一切正当的诉求达成和解”也可译作“在一切正当事项上和解”或“就一切合理诉求达成协议”。希腊语 συλλύεσθαι 的表达较为凝练，在这里可指通过协商达成和解或协议。
    reason: 说明 συλλύεσθαι 在外交谈判语境中的压缩表达，并保留“事项”与“诉求”等可行理解。
lexical_decisions:
- source_word: ἔπεισεν
  choice: 劝服
  rationale: πείθω的不定过去时；“劝服”既保留说服并取得结果的语气，也适合外交谈判的上下文。希腊文未明说宾语，正文用“对方”自然表达语境中的受劝者，而不额外确定其身份。
- source_word: συλλύεσθαι
  choice: 达成和解
  rationale: 该中间/被动不定式在外交语境中表示双方消除争端、达成协议；“达成和解”比字面译法自然，同时保留其概括性。
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: 按一切正当条件
  rationale: τὰ δίκαια在谈判中可指正当事项、条件或诉求；此处译为“正当条件”，符合ἐπί加与格所表达的和解基础，也避免不必要的神学化。
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: 又说自己也会劝服王
  rationale: 将διότι理解为引出劝说内容；未来时πείσει译为“会劝服”，保留尚待完成的行动。补出“自己”和“说”是为了在中文中明确间接引语关系，并未另添人物。
- source_word: φίλον αὐτοῖς
  choice: 他们的朋友
  rationale: 保留φίλον的单数谓语名词表达，指王转而与他们友好或结盟；不将政治性的“朋友”扩展成更具体的联盟关系。
- source_word: ἀναγκάζων γενέσθαι
  choice: 迫使王成为
  rationale: ἀναγκάζω表示施加强制或压力；“迫使”保留其力度。重复“王”可避免中文代词在多个参与者之间产生不必要的歧义。
theological_decisions:
- issue: τοῖς δικαίοις在政治—法律谈判语境中的含义
  choice: 正当条件
  alternative: 正义的事；合理诉求
  rationale: 这里谈的是和解所依据的正当事项或条件，并非关于称义或个人道德义的教义陈述；译文保留“正当”的价值判断，同时不导入额外神学含义。
- issue: διότι所引分句与前句的关系
  choice: 作为劝说内容：“又说……”
  alternative: 作为原因：“因为他也会劝服王……”
  rationale: 希腊文可压缩地引出所作保证，也可能被理解为因果说明。正文采用在上下文中较顺畅的内容性读法，未把所保证的结果写成已经发生。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“达成和解”“正当条件”符合外交谈判语境；以“王”而非较古雅的“君王”保持现代标准普通话风格。脚注标记[a]已置于相关短语之后。
