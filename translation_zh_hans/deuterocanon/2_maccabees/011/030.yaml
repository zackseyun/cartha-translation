  yaml_path: translation/deuterocanon/2_maccabees/011/030.yaml
  text: Therefore[a], for those who come down until the thirtieth of Xanthicus, there will be a right hand of assurance together with permission[b],
translation:
  language: zh_hans
  text: 因此，凡到散提古月三十日为止下去的人[a]，都将获得以右手为凭的保证[b]和准许。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下去”也可译作“离去”或“往下走”；原文没有说明目的地。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“右手”；在当时的外交和法律用语中，“右手”可指以右手为凭所作的承诺或保证。
    reason: idiom_explanation
  - marker: c
    text: 散提古月是希腊化时代所用马其顿历的月份名称。
    reason: cultural_note
lexical_decisions:
- source_word: τοῖς οὖν καταπορευομένοις
  choice: 因此，凡……下去的人
  rationale: οὖν 表示承接或推论，译作“因此”。καταπορευομένοις 含有向下行或离去的方向意味；正文保留“下去”，不擅自指定目的地或解释为“返回”。
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: 在散提古月三十日以前
  rationale: 表示以散提古月第三十日为期限。采用音译保留希腊化时代的月份名称，不强行换算成其他历法日期。
- source_word: ὑπάρξει
  choice: 都将得到
  rationale: 该将来时在这里表示届时会有某项安排或保障。汉语用“将得到”自然地连接后面的保证与准许，同时不另加希腊文没有明说的授予者。
- source_word: δεξιὰ
  choice: 以右手相握所作的保证
  rationale: δεξιά 字面指“右手”，在外交和行政语境中可指以握右手为凭的承诺或安全保证。此译既保留原文意象，也让现代读者明白其惯用含义。
- source_word: μετὰ τῆς ἀδείας
  choice: 并获准许
  rationale: ἄδεια 可表示准许、自由通行或授权；“准许”保留较宽泛的行政含义，不具体化为原文未明确说出的某种特许。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行政书信语体。保留“下去”的方向性和“右手”的历史意象，并以脚注说明其可能含义；不换算古代月份，也不把“准许”限定为某一种具体法律权利。
