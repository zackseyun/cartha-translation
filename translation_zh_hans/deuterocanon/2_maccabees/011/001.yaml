- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: 但没过多久
  rationale: 该短语以παντελῶς强化带有指小意味的χρονίσκον，着重表示间隔极短；“没过多久”自然简洁，并由脚注补明原文强调语气。
- source_word: ἐπίτροπος
  choice: 监护人
  rationale: 在王室语境中可指受托监护国王、摄政或代管事务者；“监护人”保留基本含义，避免把具体政制职衔定得过死。
- source_word: συγγενής
  choice: 亲族
  rationale: 表示有亲属关系的人；“亲族”适合宫廷叙事语域，且不额外限定具体亲属关系。
- source_word: ἐπὶ τῶν πραγμάτων
  choice: 政务总管
  rationale: 此惯用语指负责国家事务的官员；“政务总管”自然呈现其行政职能，又不等同于某一后世的固定官衔。
- source_word: λίαν βαρέως φέρων
  choice: 深感恼怒
  rationale: βαρέως φέρειν表示对某事难以承受、极为不满或苦恼；结合敌方主政者对既成战局的反应，“深感恼怒”传达强烈负面情绪，同时脚注保留“痛心、难以接受”等语义余地。
- source_word: ἐπὶ τοῖς γεγονόσι
  choice: 因所发生的事
  rationale: 实词化的完成时分词泛指此前已经发生的事情；此译不把它缩窄为某一特定事件。
