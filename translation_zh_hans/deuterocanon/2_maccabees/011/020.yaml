  yaml_path: translation/deuterocanon/2_maccabees/011/020.yaml
  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
translation:
  language: zh_hans
  text: 至于这些事，我已吩咐这些人和我这边的人逐项同你们商谈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “商谈”也可译作“交谈”或“协商”。希腊文动词可指讨论或谈判，不只是说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: 至于这些事
  rationale: ὑπέρ接属格在书信和行政语境中表示“关于、至于”；δέ在此是轻微转折或承接，合并译为“至于”自然简洁。
- source_word: κατὰ μέρος
  choice: 具体细节
  rationale: 该短语表示逐项、分别或详尽地处理；结合上下文译为“具体细节”，既保留逐项说明之意，也符合现代公文语体。
- source_word: ἐντέταλμαι
  choice: 我已经吩咐
  rationale: ἐντέλλομαι的完成时表达命令已经发出并仍然有效；“已经吩咐”保留权威性，又不至于显得过分严厉。
- source_word: τούτους τε
  choice: 这些人
  rationale: τούτους指当前所说的人员；τε与后面的καί构成并列，中文用“这些人和……”自然体现两组人员。
- source_word: τοὺς παρʼ ἐμοῦ
  choice: 我这边的人
  rationale: 原文直译为“从我这里的人”，大概指王本人的代表或人员；“我这边的人”保留关系上的开放性，不擅自补入“差派”这一原文未明说的动作。
- source_word: διαλεχθῆναι ὑμῖν
  choice: 与你们商谈
  rationale: διαλέγομαι可指交谈、讨论或协商；行政语境中的“商谈”较单纯的“说话”更准确，同时脚注保留较宽泛的可能。
