base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
translation:
  language: zh_hans
  text: 但马加比亲自首先拿起武器，敦促其他人与他一同冒险，去援助他们的弟兄[a]；他们也一同踊跃地冲了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄”很可能指他们的犹太同胞或族人。
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: 但马加比亲自率先
  rationale: δέ作轻微叙事转折，译作“但”；αὐτός表示强调，译作“亲自”；πρῶτος体现带头行动，译作“率先”。ὁ Μακκαβαῖος按通行中文名称译作“马加比”，不擅自补出原文未写明的“犹大”。
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: 拿起武器
  rationale: 该短语在军事语境中表示拿起兵器、武装起来；“拿起武器”自然且保留原文意象。
- source_word: προετρέψατο τοὺς ἄλλους
  choice: 劝勉其他人
  rationale: προτρέπω可指敦促、鼓励；“劝勉”兼顾鼓舞和促进行动的语气。
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: 与他一同冒险
  rationale: 保留分词所表达的伴随行动，也不把它改写成与“援助”并列的第二个不定式；διακινδυνεύω在此指共同置身危险、承担风险。
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: 前去援助他们的弟兄
  rationale: ἐπιβοηθέω强调赶去救援；ἀδελφοί直译为“弟兄”，保留原文的亲属群体称谓。
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: 于是众人齐心踊跃出发
  rationale: ὁμοῦ表示一同、共同；προθύμως表示热切、踊跃；ἐξορμάω表示冲出或动身。“齐心踊跃出发”保留集体而积极的行动感，又避免把动作过度具体化为正式冲锋。
theological_decisions:
- issue: ἀδελφοῖς αὐτῶν所指的群体
  choice: 他们的弟兄
  alternative: 他们的同胞／族人
  rationale: 原文采用“弟兄”的亲属语言；上下文中很可能泛指受威胁的犹太同胞或族人，但正文不应消解这一称谓，故保留“弟兄”，并以脚注说明语境所指。
- issue: ἅμα αὐτῷ διακινδυνεύοντας的句法关系
  choice: 劝勉其他人与他一同冒险，前去援助……
  alternative: 劝勉其他人与他一同冒险并前去援助……
  rationale: 希腊文用分词διακινδυνεύοντας修饰“其他人”，随后以不定式ἐπιβοηθεῖν表达受劝去做的事。译文保留这种分词与不定式的张力，不把两项行动完全并列化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“亲自率先”“齐心踊跃出发”传达领头和集体行动；标点略作汉语化处理。英文咨询层所列[a]脚注内容与其正文标记位置不相符，且“sharing the danger with him”实为正文相应短语的词汇替代，并无须在中文正文另设脚注；因此仅保留关于“弟兄”语境含义的必要脚注，并确保标记出现在正文中。
