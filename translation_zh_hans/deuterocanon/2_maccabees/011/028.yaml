base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/028.yaml
  text: Farewell[a]. May it be as we desire; and we ourselves also are in good health.
translation:
  language: zh_hans
  text: 愿你们安好[a]。愿如我们所愿；我们自己也安康。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要保重。”这是古代书信结尾常用的祝安语。
    reason: 说明ἔρρωσθε兼有字面上的健康、强健含义和书信结语的惯用功能。
lexical_decisions:
- source_word: ἔρρωσθε
  choice: 愿你们安好
  rationale: 这是ῥώννυμι的复数命令式，在书信结尾惯用作祝安语。译作“愿你们安好”既保留对复数收信人的指向，也比直译“要强健”更符合中文书信语境。
- source_word: εἴη ἂν
  choice: 愿……
  rationale: 祈愿式与ἄν结合，表达愿望或委婉的意愿；中文用“愿”自然地保留其祈愿语气。
- source_word: ὡς βούλομεθα
  choice: 如我们所愿
  rationale: βούλομαι表示愿望或意愿；“所愿”符合正式书信语体，又不把它强化为命令或决定。
- source_word: ὑγιαίνομεν
  choice: 很安康
  rationale: 该动词表示身体健康、状况良好；“安康”在正式问安语中自然且庄重。
- source_word: καὶ αὐτοὶ δὲ
  choice: 我们自己也
  rationale: “自己”体现αὐτοί的轻微强调，“也”表达与对方安好相呼应的附加意味；不刻意逐字表现δέ，以免中文生硬。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的正式书信语体。“愿事情如我们所愿”保留希腊文未明说主语的表达，不擅自限定所愿之事；分号保持后一句与前面愿望之间既相连又略有转折的关系。
