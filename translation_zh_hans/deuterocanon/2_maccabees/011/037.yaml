  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: zh_hans
  text: 所以，请赶快派几个人来，好让我们也知道你们持什么意见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: 所以
  rationale: 表示由上文推出的结果，保留推论关系，也符合现代汉语书信语气。
- source_word: σπεύσατε
  choice: 请赶快
  rationale: 不定过去时命令式要求立即行动；“赶快”传达紧迫感，“请”使外交书信中的命令在中文里自然得体。
- source_word: πέμψατέ τινας
  choice: 派几个人来
  rationale: πέμψατε意为“派遣”，τινας是不定代词复数，仅指若干人，并未明确其身份；“来”按收信人与发信人的方向关系自然补出。
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的，简洁保留目的从句的功能。
- source_word: καὶ ἡμεῖς
  choice: 我们也
  rationale: καί在此有附加、包含之意；“也”自然传达其强调。
- source_word: ἐπιγνῶμεν
  choice: 知道
  rationale: 在目的从句中表示经由对方所派之人而确知其立场；“知道”比“获悉”更通俗，同时不必过度强化“完全认识”的词源意味。
- source_word: ὁποῖοί ἐστε γνώμης
  choice: 你们持什么意见
  rationale: 该结构直译近于“你们具有哪一种看法”；中文以“持什么意见”自然表达其所问的立场或主张，同时避免把γνώμη单一定为“意图”。
