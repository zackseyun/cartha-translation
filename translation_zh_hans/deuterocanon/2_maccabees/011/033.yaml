lexical_decisions:
- source_word: ἔρρωσθε
  choice: 祝安
  rationale: 这是书信末尾惯用的祝颂语，字面与“健康、强健”有关；“祝安”既保留健康平安之意，也符合现代中文书信落款前的庄重表达。
- source_word: ἔτους
  choice: 年
  rationale: 用于纪年的属格表达，直接译为“年”。
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 第一百四十八年
  rationale: 按希腊文序数纪年表达译出，不擅自补明纪元体系。
- source_word: Ξανθικοῦ
  choice: 散提古月
  rationale: 这是马其顿历的月份名称，以音译保留历史历法信息，并补“月”使现代中文读者易于理解。
- source_word: πεντεκαιδεκάτῃ
  choice: 十五日
  rationale: 在日期公式中指该月第十五日；中文自然补出“日”。
