  text: Farewell. In the one hundred forty-eighth year[a], on the fifteenth day of Xanthicus.
translation:
  language: zh_hans
  text: 祝安。第一百四十八年，散提古月[a]十五日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “散提古月”是马其顿历的月份名称，希腊文作 Xanthikos。
