  text: 米尼劳向我们说明，他希望你们下来以后能料理自己的事务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与自己人一起。”希腊语“πρὸς τοῖς ἰδίοις”可指自己的事务，也可能指自己的人；原文措辞较难确定。
