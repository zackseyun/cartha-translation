lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: 向我们说明
  rationale: 此动词表示使某事为人所知、报告或陈明；“向我们说明”符合公函语气，也自然表达了信息传达的方向。
- source_word: Μενέλαος
  choice: 米尼劳
  rationale: 按现代汉语中对该希腊人名的常见译法音译。
- source_word: βουλόμενος
  choice: 愿意
  rationale: 该分词表达意愿；结合间接陈述，以“愿意”保留正式而较为委婉的语气。
- source_word: κατελθόντας
  choice: 在下来以后
  rationale: 不定过去时分词在此自然表示时间先后。“下来”保留原文的方向表达，不补明原文未指出的出发地或目的地。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数，指受信的群体。
- source_word: γίνεσθαι πρὸς τοῖς ἰδίοις
  choice: 料理自己的事务
  rationale: 这一短语用法较难确定；τὰ ἴδια可指自己的事务、所有物或自己的人。“料理自己的事务”在正文中给出通顺的可能含义，同时以脚注保留另一种合理理解。
