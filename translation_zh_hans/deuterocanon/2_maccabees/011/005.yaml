base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: zh_hans
  text: 他进入犹太地，走近伯夙；伯夙是一个坚固的地方，离耶路撒冷约有五舍诺斯[a]。他便进逼那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍诺斯”是古代的长度单位，其确切长度因时代和地区而异。
    reason: cultural_note
  - marker: b
    text: 或译：“围攻那里。”希腊文动词的字面意思是“挤压”或“使受苦”，在这里可能指对伯夙施加军事压力。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 进入
  rationale: 不定过去时分词表示先于主句动作发生；汉语用连动结构自然表达这一先后关系。
- source_word: συνεγγίσας
  choice: 又走近
  rationale: 表达向伯夙接近的动作，并以“又”连接连续发生的两个分词动作。
- source_word: Βεθσουρῶν
  choice: 伯夙
  rationale: 采用该地名在现代中文圣经传统中较通行且简洁的译名。
- source_word: ἐρυμνῷ χωρίῳ
  choice: 坚固的地方
  rationale: 保留ἐρυμνός所含的坚固、易守之意及χωρίον较宽泛的“地方”含义，不把它过度具体化为城堡或要塞。
- source_word: ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: 离耶路撒冷约有五舍诺斯
  rationale: ὡσεὶ表示约数；保留古代长度单位，避免因其长度随地区和时代而异而作出虚假精确的现代换算。
- source_word: τοῦτο
  choice: 那里
  rationale: 所指为前述伯夙这一地方；“那里”在现代汉语中自然清楚。
- source_word: ἔθλιβε
  choice: 向那里步步进逼
  rationale: θλίβω本义为挤压、施压；在军事语境中表示持续施加压力。“步步进逼”保留其形象与进行状态，又不把含义限定为技术性的“围攻”。
