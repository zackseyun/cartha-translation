  yaml_path: translation/deuterocanon/2_maccabees/011/010.yaml
  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: zh_hans
  text: 他们列成战阵前进[a]，有从天而来的盟友在他们前面，因为主怜悯了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们装备妥当，向前进发，有从天而来的盟友走在前面。”希腊文开头十分凝练，也可作略有不同的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: 前进……在他们前面
  rationale: 希腊文开头是压缩而略显生硬的中性单数表达；结合上下文，以“前进”表达队伍的推进，同时保留下文“在他们前面”的意象。
- source_word: ἐν διασκευῇ
  choice: 列阵
  rationale: 该短语表示为战斗装备妥当、部署成阵；“列阵”在现代汉语中简洁地传达军事准备和阵形。
- source_word: σύμμαχον
  choice: 盟友
  rationale: 该词具有共同作战的军事意味；“盟友”比一般的“帮助者”更贴近原词力度，也不预先断定其具体身份。
- source_word: ἀπʼ οὐρανοῦ
  choice: 从天上来的
  rationale: 在这一宗教与军事语境中，οὐρανός 指天上，而非单指可见的天空。
- source_word: ἐλεήσαντος
  choice: 怜悯了
  rationale: 不定过去时分词说明他们得着天上援助并勇敢前进的缘由；“怜悯了”自然保留原文的怜悯主题。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 在犹太经文语境中，κύριος 是对上帝的尊称，译作“主”。
theological_decisions:
- issue: “从天上来的盟友”的身份
  choice: 保留为“那从天上来的盟友”，不明确其身份
  alternative: 译作天使般的援助者，或直接解释为上帝亲自援助
  rationale: 希腊文没有明说这位盟友是谁；保留原文的含蓄，可避免把天使或上帝直接显现等特定解释写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“列阵前进”保持军事语境；“盟友”保留共同作战的意味及其身份上的含蓄。
