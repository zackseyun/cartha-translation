base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/027.yaml
  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: zh_hans
  text: 王写给犹太民族的信如下：“安条克王致犹太人的长老议会[b]和其他犹太人[a]：问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其余的犹太人”。
    reason: lexical_alternative
  - marker: b
    text: “长老议会”指由长老组成的正式机构；也可译作“元老院”。
    reason: cultural_note
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: 王写给犹太民族
  rationale: πρός加宾格在这里表明书信的对象；ἔθνος取“民族”，保留其群体和政治意味。“王写给”结合下文所有格，使中文引介自然清楚。
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: 王写给……的信如下
  rationale: 按现代汉语重组所有格和文书引介格式；“如下”准确传达τοιαύδε ἦν引出正文的功能。
- source_word: Βασιλεὺς Ἀντίοχος
  choice: 安条克王
  rationale: 保留君王头衔，并采用现代汉语自然的姓名加头衔次序。
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: 犹太人的长老议会
  rationale: γερουσία指由长老组成的正式机构；“长老议会”既保留制度性，也避免“元老院”可能引起的罗马政治联想。
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: 其他犹太人
  rationale: 直译ἄλλοις，清楚区分前述长老议会与其余收信人；也可理解为“其余的犹太人”。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的固定问候语；“问安”兼具书信体的庄重与现代可懂性。
