base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/015.yaml
  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: zh_hans
  text: 马加比考虑到有利之处，就同意了吕西亚所恳求的一切；因为马加比以书面交给吕西亚、有关犹太人的一切事项，书记官[a]都批准了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书记官”是所据希腊文本的读法；英语POB审校文本作“王”。
    reason: 所给希腊文本末句为ὁ γραμματεύς（“书记官”），但英语POB审校文本译为“the king”。脚注透明说明此一审校轨迹差异，同时正文优先遵循指定的原文来源。
lexical_decisions:
- source_word: ἐπένευσε
  choice: 同意了
  rationale: 表示点头认可、表示同意；此处自然译为“同意了”。
- source_word: παρεκάλει
  choice: 所恳求的
  rationale: 保留该动词“恳求、敦促”的语义范围；上下文是吕西亚提出请求，而非仅作中性提议。
- source_word: τοῦ συμφέροντος φροντίζων
  choice: 为顾全利益
  rationale: 表达马加比着眼于有利、合宜之事，中文简洁且不擅自限定是谁的利益。
- source_word: ἔδωκεν…διὰ γραπτῶν
  choice: 以书面交给
  rationale: 按希腊文直译其“借书面文件交付”的意思；结合宾语内容，用“各项请求”使中文完整自然。
- source_word: ὁ γραμματεύς
  choice: 书记官
  rationale: 严格依据所给斯威特希腊文本，γραμματεύς通常指书记、文书官或书记官；此处采用合乎行政语境的“书记官”。
- source_word: συνεχώρησεν
  choice: 应允了
  rationale: 此处意为准许、同意所提出的事项；“应允”能自然承接书面请求。
theological_decisions:
- issue: 末句施事者的文本差异
  choice: 正文依所给希腊文译作“书记官”
  alternative: 依英语POB及部分上下文理解译作“王”
  rationale: 原文证据明确写作ὁ γραμματεύς，翻译应优先忠实呈现；不因上下文或咨询译本而无说明地改作“王”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“吕西亚”沿用常见音译；句式保留原文先述同意、再说明书面条件获准的逻辑。
