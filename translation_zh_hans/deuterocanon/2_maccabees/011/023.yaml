  yaml_path: translation/deuterocanon/2_maccabees/011/023.yaml
  text: Since our father has departed to the gods[a], and since we want those in the kingdom, being free from disturbance, to turn to the care of the Jews[b],
translation:
  language: zh_hans
  text: 我们的父亲已经归到众神那里[a]；我们希望国中的人不受纷扰，能专心关注犹太人的事务[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“归到众神那里”，是希腊化时代王室用来委婉表示死亡的说法；有些译本简化为“去世”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文末句的句法十分紧缩；“关注犹太人的事务”也可较宽泛地理解为“留意犹太人的事务”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: 我们的父亲
  rationale: 保留王室书信中的亲属称谓和王朝语气；这里指已经去世的前任君王，不增译为“先父”或“前王”。
- source_word: εἰς θεοὺς μεταστάντος
  choice: 已经归到众神那里
  rationale: 保留希腊化王室文书中带有异教色彩的死亡委婉语，同时用自然庄重的现代汉语表达；不将其淡化为单纯的“去世”。
- source_word: βουλόμενοι
  choice: 我们希望
  rationale: 准确表达分词所说明的发信者意愿，并符合现代汉语公文语体。
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: 国中的人
  rationale: 按字面保留其宽泛指称，不擅自限定为官员、臣民或军队。
- source_word: ἀπερισπάστως ὄντας
  choice: 不受纷扰
  rationale: 兼顾“不被牵扯、分心”和政治环境安定的含义，避免只理解为内在注意力集中。
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: 可以专心处理犹太人的事务
  rationale: ἐπιμέλεια可指照管、关注或办理；原句结构紧缩，此译法在现代汉语中通顺，也保留其涉及犹太人事务的行政性含义。
theological_decisions:
- issue: 是否保留异教王室对死亡的说法
  choice: 归到众神那里
  alternative: 去世了
  rationale: 原文明确使用希腊化异教宫廷套语。译文应保存叙事文献中的原有宗教语言，而不将其改写成中性的死亡表述。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“众神”刻意保留原文异教宫廷措辞；“不受纷扰，可以专心处理”使紧缩的希腊句法在汉语中清楚，但不把“犹太人的事务”进一步具体化。末尾保留逗号，因为本节在原文中是书信长句的一部分。
