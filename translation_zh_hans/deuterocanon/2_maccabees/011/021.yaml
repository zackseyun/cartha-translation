lexical_decisions:
- source_word: ἔρρωσθε
  choice: 祝你们安康
  rationale: 这是书信结尾常用的问安语，字面带有“要健康、强健”之意；译作“祝你们安康”既保留祈愿意味，也符合现代中文书信语体。
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 第一百四十八年
  rationale: 按希腊文纪年格式直译为序数年份，保持公文日期的正式语气；原文未明说所用纪元，正文不加解释。
- source_word: Διὸς Κορινθίου
  choice: 狄奥斯·科林提奥斯月
  rationale: 这是马其顿历法中的月份名称，以音译保留历史历法用语，并补出中文日期表达所需的“月”。
- source_word: τετράδι καὶ εἰκάδι
  choice: 二十四日
  rationale: 希腊文按“四加二十”表达该月第二十四日，采用自然、明确的现代中文日期格式。
