base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: zh_hans
  text: 因此，我们既然也愿意让这个民族免受动乱，就决定把圣殿归还给他们，并让他们按照祖先时代的习俗[a]生活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按照祖先时代的习俗安排他们的共同生活。”
    reason: 保留πολιτεύεσθαι所含的公民生活、共同体生活意味；正文的“生活”较自然，但语义范围较宽。
lexical_decisions:
- source_word: αἱρούμενοι
  choice: 既然也愿意
  rationale: 该中间语态分词表示选择、属意或愿意采取某项政策；用“既然”表达其在句中的原因意味，用“愿意”保留其意愿色彩。
- source_word: ἐκτὸς ταραχῆς
  choice: 免受动乱
  rationale: 此语指不受骚乱、社会或政治动荡侵扰；“免受动乱”自然地保留行政语境中的含义。
- source_word: ἔθνος
  choice: 民族
  rationale: 在王室行政文书语境中，指作为独特群体的犹太民族；“民族”比现代主权意义较强的“国家”更合适。
- source_word: κρίνομεν
  choice: 决定
  rationale: κρίνω在此表示作出决定；“决定”符合政府函件语体，又不把普通动词强化为专门的“颁旨”。
- source_word: τὸ ἱερὸν
  choice: 圣殿
  rationale: 字面可指神圣场所，但本处具体指耶路撒冷圣殿；“圣殿”清楚而符合中文圣经用语。
- source_word: ἀποκατασταθῆναι
  choice: 归还
  rationale: 该被动不定式表示恢复原有状态或归属。结合间接受词αὐτοῖς，“把圣殿归还给他们”比抽象的“恢复圣殿”更明确自然，同时仍保留恢复其权利与地位的含义。
- source_word: πολιτεύεσθαι
  choice: 生活
  rationale: 该词可指以共同体成员身份生活、安排公共生活。正文用宽泛自然的“生活”，不把它窄化为政治自治；脚注补明共同体层面的可能含义。
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: 按照祖先时代的习俗
  rationale: ἐπὶ τῶν προγόνων带有“在祖先时代”的时间意味；此译比单说“祖传习俗”更直接保留原文结构。
theological_decisions:
- issue: πολιτεύεσθαι所涉及的犹太律法、习俗与自治范围
  choice: 译作按祖先时代的习俗“生活”，广义涵盖共同体生活
  alternative: 译作“按照祖先的习俗自治”或“治理自己”
  rationale: 上下文是王室对圣殿和犹太传统生活方式的许可。该动词虽有公民或政治色彩，但原文并未明确授予政治独立，因此不译成“自治”，以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的王室行政文书语气。“准许”由“决定……并让他们……”的句法关系自然表达政策许可，并非把原文强化为政治自治。脚注标记已在正文相应位置出现。
