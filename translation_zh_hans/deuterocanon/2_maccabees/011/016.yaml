base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: zh_hans
  text: 因为已有吕西亚写给犹太人的书信，格式如下[a]：“吕西亚向犹太民众[b]问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“措辞如下”。这里的希腊语可指下文所示的书信形式或具体措辞。
    reason: lexical_alternative
  - marker: b
    text: 或译“犹太人的会众”或“犹太人的群体”。原词指人数众多的集合群体，不一定是正式组织。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: 因为当时已有……信
  rationale: 以“因为”承接上文的解释关系；“当时已有”表达迂回式过去完成被动态所指的既成状态，同时避免生硬直译。
- source_word: τοῖς Ἰουδαίοις
  choice: 给犹太人
  rationale: 这里指作为民族—宗教群体的犹太人，并非仅指犹太地居民。
- source_word: ἐπιστολαὶ παρὰ μὲν Λυσίου
  choice: 吕西亚写给……的信
  rationale: παρά加属格表示来源；汉语以“吕西亚写给……的信”自然表达信件来自吕西亚。μὲν在此开启后续信件的列举，汉语不另加僵硬对应词。
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: 内容如下
  rationale: 该短语引出信函正文，可指下述形式、措辞或内容；“内容如下”符合现代汉语公函引语习惯，又不限定为逐字引文。
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: 向犹太民众
  rationale: πλῆθος表示人数众多的集体或群体；“民众”保留集合意义，不擅自判定其为正式议会。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头的惯用问候语；“问安”庄重自然，并体现发信人向收信人致意。
