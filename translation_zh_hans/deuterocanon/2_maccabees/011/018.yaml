  yaml_path: translation/deuterocanon/2_maccabees/011/018.yaml
  text: So then[a], whatever had to be presented also to the king I made clear, and whatever was possible he granted.
translation:
  language: zh_hans
  text: 因此，凡是还必须提交给王的事，我都说明清楚了；至于可行的事，他都准许了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可行的事，他都准许了”也可译作“凡是办得到的，他都同意了”。希腊语ἐνδεχόμενα可着重指在具体情势下可行的事；συνεχώρησεν可表示“准许”“同意”或“让步”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: 因此，凡是……的事
  rationale: 保留οὖν承接上文并作出推论的语气；以“凡是……的事”自然引出相关事项。
- source_word: ἔδει
  choice: 必须
  rationale: 表达非人称动词ἔδει所含的必要性，也符合回顾已处理事务的语境。
- source_word: καὶ τῷ βασιλεῖ
  choice: 还……国王
  rationale: “还”保留καί的附加意义，表明这些事项除了此前的商议之外，也必须提交国王。
- source_word: προσενεχθῆναι
  choice: 呈报
  rationale: 此处指将事务提交权威者处理；“呈报”简洁地体现行政、公文语境和被动含义。
- source_word: διεσάφησα
  choice: 我都说明了
  rationale: 表达将事情解释清楚、明确说明之意，语气自然且不过度扩展。
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: 至于当时可行的事
  rationale: ἐνδεχόμενα可指在具体情势下可能或可办到的事；加入“当时”点明情境限制，却不将其窄化为法律许可。
- source_word: συνεχώρησεν
  choice: 他都准许了
  rationale: 在向国王请求的政治行政语境中，可表示准予、让步或许可；“准许”自然保留施权者批准事项的意味。
