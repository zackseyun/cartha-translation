  text: And I have also sent Menelaus to encourage you[a].
translation:
  language: zh_hans
  text: 我也派了默乃劳来劝勉你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来鼓励你们”、“来敦促你们”或“来恳请你们”。希腊词παρακαλέω可按语境表示鼓励、劝告、敦促或恳请。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  choice: 我……派了
  rationale: 这是πέμπω的完成时主动直陈式，表示派遣已经完成，并与当前情势有关；现代汉语以“派了”自然表达。
- source_word: δὲ
  choice: 也
  rationale: δὲ在此是承接上文的弱连接词；汉语不必另译为强转折，结合καὶ译作“也”即可自然体现延续与增添。
- source_word: καὶ
  choice: 也
  rationale: 表示附加，说明除前述安排之外，默乃劳也被派来。
- source_word: τὸν Μενέλαον
  choice: 默乃劳
  rationale: 按现代汉语圣经次经人名的通行音译处理该专名。
- source_word: παρακαλέσοντα
  choice: 来劝勉
  rationale: 未来时主动分词在πέπομφα之后表达派遣的目的；παρακαλέω可兼有鼓励、劝告、敦促或恳请之意，“劝勉”较自然地保留其宽广语义。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 复数第二人称宾格，指书信的收信群体。
