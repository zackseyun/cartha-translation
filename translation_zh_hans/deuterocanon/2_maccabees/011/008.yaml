base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: zh_hans
  text: 他们在那里临近耶路撒冷时，有一名骑马的人[b]显现出来，身穿白衣，挥动着金色的全副铠甲，在他们前面前行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们前面前行”也可译作“行在他们之前”。希腊语分词只明确表示他在他们前方，不一定表示他正式率领他们。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明确说明这名骑马的人的身份；这番描写可使人想到一位天上的护卫者，但译文不作进一步认定。
    reason: cultural_note
lexical_decisions:
- source_word: αὐτόθι
  choice: 在那里
  rationale: 这是地点副词，指向上文所述地点；译作“在那里”保留其空间指向，不把它弱化为单纯的时间连接词。
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: 临近耶路撒冷
  rationale: πρός与与格连用可表示邻近；“临近耶路撒冷”自然表达他们处于城的近旁。
- source_word: ὄντων
  choice: 他们……时
  rationale: 这是属格独立结构，主语由语境补出；用时间从句符合现代汉语表达。
- source_word: ἐφάνη
  choice: 显现出来
  rationale: 既表达进入视野的事件，也保留叙事中突然而异乎寻常的显现感。
- source_word: προηγούμενος αὐτῶν
  choice: 走在他们前面
  rationale: 分词说明骑士处在队伍前方并向前行，不额外断定他具有正式领军身份。
- source_word: ἔφιππος
  choice: 一名骑士
  rationale: 此处作名词使用，指一名骑在马上的人；“骑士”简洁自然，但不据此赋予其特定社会爵位。
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: 身穿白衣
  rationale: 简明而庄重地表达其白色服饰，也保留视觉上的鲜明特征。
- source_word: πανοπλίαν χρυσῆν
  choice: 金色的全副铠甲
  rationale: πανοπλία指全套武装或全副铠甲；加入“全副”比笼统的“金甲”更充分地反映原词。
- source_word: κραδαίνων
  choice: 挥动着
  rationale: 该动词表示有力地摇动或挥动。虽然与“全副铠甲”的搭配在汉语中较为奇特，仍保留希腊文本本身的意象，不擅自改成刀、枪等具体武器。
theological_decisions:
- issue: 显现的骑士是谁
  choice: 仅描述为显现出来的一名骑士
  alternative: 明确译作天使、天上的护卫者或上帝的战士
  rationale: 希腊文本只描写其出现、衣着和武装，并未明说其身份。译文让读者可以推知其超自然性质，却不把这种推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“显现出来”保留异象般的突现感；“挥动着金色的全副铠甲”虽非日常搭配，却忠实保留原文中κραδαίνων与πανοπλίαν的独特组合。脚注标记按其实际说明对象分别置于“走在他们前面”和“骑士”之后。
