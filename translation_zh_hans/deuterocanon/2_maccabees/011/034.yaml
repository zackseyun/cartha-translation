base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
translation:
  language: zh_hans
  text: 罗马人也给他们寄去一封信，内容如下：“昆图斯·梅米乌斯、提图斯·马尼乌斯，罗马人的长老[a]，向犹太民众问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罗马长老”；按上下文，也可能指“罗马人的使者”。希腊语原词字面意思是“长老”。
    reason: 保留 πρεσβυταί 在字面职称与上下文使者身份之间的词义张力，避免正文作过度确定的解释。
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: 罗马人也……寄去
  rationale: 忠实表达不定过去时“差遣、寄送”和 καί 的递进意义；“罗马人”保留原文的集体称谓，不擅自具体化为罗马当局。
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: 给他们寄去一封信
  rationale: 按现代汉语语序自然表达收信对象及书信；“他们”的指代沿袭上下文，不作额外说明。
- source_word: ἔχουσαν οὕτως
  choice: 内容如下
  rationale: 这是引出书信正文的公文套语；译法简洁自然，并保留文献语体。
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: 昆图斯·梅米乌斯、提图斯·马尼乌斯
  rationale: 依希腊文人名音译，并用顿号呈现原文并列关系。
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: 罗马人的长老
  rationale: πρεσβυταί 的字面义为“长老”；此处可能指具代表身份的资深使者，但正文不将其职分解释得过于确定。
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: 向犹太民众
  rationale: δήμος 在这里指具有公共、群体意义的“民众”；此译比直译“犹太人的民众”更符合现代汉语，同时保留正式书信口吻。
- source_word: χαίρειν
  choice: 问安
  rationale: 这是希腊书信开头惯用的问候公式；“问安”在现代中文中庄重自然，胜于字面译作“喜乐”。
