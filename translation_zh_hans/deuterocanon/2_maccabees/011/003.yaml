  yaml_path: translation/deuterocanon/2_maccabees/011/003.yaml
  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
translation:
  language: zh_hans
  text: 又要使圣所也像列国的其他神庙一样，成为征收银钱的对象[a]，并使大祭司的职位每年都拿来出售[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使圣所承担银钱贡税”或“向圣所征收银钱”。这个罕见的希腊词表示使圣所成为货币收入的来源，与列国的神庙相提并论。
    reason: lexical_alternative
  - marker: b
    text: 或译“每年把大祭司的职位拿来出售”。希腊文把这一职位本身说成可出售之物，突出了将神圣职分商品化的企图。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: 圣所
  rationale: 指耶路撒冷的神圣区域；“圣所”保留礼仪和神圣空间的含义，也与后文指列国宗教场所的 τεμένη 区分。
- source_word: ἀργυρολόγητον
  choice: 成为征收银钱的对象
  rationale: 这是罕见词，由“银钱”和“征收”相关成分构成，意指使圣所成为货币收入或贡税的来源；此译较自然，同时保留其征敛意味。
- source_word: τεμένη
  choice: 庙宇
  rationale: 此处指列国的神圣区域或宗教场所；“庙宇”符合现代汉语习惯，并与耶路撒冷的“圣所”形成语境上的对照。
- source_word: πρατὴν
  choice: 可出售
  rationale: 表示可以被卖掉、拿来出售；这里修饰大祭司职位，突出该神圣职分被商品化。
- source_word: ἀρχιερωσύνην
  choice: 大祭司的职位
  rationale: 所指是大祭司的职分或尊位，而不只是担任该职的人；“大祭司的职位”在现代汉语中清楚自然。
- source_word: κατʼ ἔτος
  choice: 每年
  rationale: 直接表达逐年、每年一次的反复安排。
- source_word: ποιήσειν
  choice: 使……成为／使……可
  rationale: 该不定式支配两个并列提议，具有使成、造成某种状态的含义；汉语按两个宾语分别自然表达。
