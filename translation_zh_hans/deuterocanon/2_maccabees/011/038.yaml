  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: zh_hans
  text: 愿你们安好。[a]第一百四十八年，克散提科月十五日。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“你们要安好”，在书信结尾用作祝安语。
    reason: lexical_alternative
  - marker: b
    text: “克散提科”是塞琉古纪年所采用的马其顿历月份名称。
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: 愿你们安好
  rationale: 该词字面涉及健康、安好；在书信结尾是惯用祝安语。译作“愿你们安好”既符合中文书信收束语气，也保留原文“安康”的字面色彩。
- source_word: ἔτους
  choice: 年
  rationale: 用于纪年公式，直译为“年”。
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 一百四十八年
  rationale: 这是纪年序数，中文纪年格式自然表达为“一百四十八年”。
- source_word: Ξανθικοῦ
  choice: 克散提科月
  rationale: 这是马其顿历的月份名称，采用贴近希腊语 Ξανθικός 的音译，并补出“月”以使中文日期清楚。
- source_word: πεντεκαιδεκάτῃ
  choice: 十五日
  rationale: 该阴性与省略的“日”相配；中文日期公式明确补出“日”。
