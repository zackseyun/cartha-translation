    text: “兄弟”可能是表示政治亲近关系的宫廷称号，不一定指亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: 王的信
  rationale: ἐπιστολή是普通的书信用语；所有格τοῦ βασιλέως自然译为“王的”。
- source_word: περιεῖχεν οὕτως
  choice: 内容如下
  rationale: 字面为“这样包含着”，在引出信件原文时，现代汉语以“内容如下”最自然，同时准确保留其引文导语功能。
- source_word: Βασιλεὺς Ἀντίοχος
  choice: 安条克王
  rationale: 按现代汉语常用的称号—人名表达处理；“安条克”采用通行译名。
- source_word: τῷ ἀδελφῷ
  choice: 兄弟
  rationale: 保留ἀδελφός的基本意义，也不把它预先限定为血缘关系；其可能的宫廷称号用脚注说明。
- source_word: Λυσίᾳ
  choice: 吕西阿
  rationale: 依希腊语Λυσίας音译，并采用简体中文形式。
- source_word: χαίρειν
  choice: 问候
  rationale: 这是希腊书信开头的惯用致意语；“问候”简洁、自然，符合公函语境。
