translation:
  language: zh_hans
  text: 国王的信内容如下[a]：“安条克王致兄弟[b]吕西阿：问候。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这样包含着”；这里用来引出信件的正文。
    reason: lexical_alternative
