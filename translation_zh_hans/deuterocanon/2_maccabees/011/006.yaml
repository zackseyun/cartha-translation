base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: zh_hans
  text: 麦加比一方的人得知他正在围攻那些堡垒，便和众人一起哀号流泪，恳求主差遣一位良善的天使来拯救以色列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”。希腊语 σωτηρία 既可指具体危机中的救援、脱困，也可较广泛地指救恩。
    reason: 保留 σωτηρία 在军事处境与较广神学意义之间的词义幅度。
lexical_decisions:
- source_word: μετέλαβον
  choice: 得知
  rationale: 此处表示获知一项消息；“得知”符合现代汉语叙事习惯，也避免误译为“有分于”。
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: 麦加比一方的人
  rationale: 该希腊习语指与麦加比同属一方、围绕他的人群；此译自然，又不武断判定是否包括麦加比本人。
- source_word: πολιορκοῦντα αὐτὸν τὰ ὀχυρώματα
  choice: 他正在围攻那些堡垒
  rationale: πολιορκέω 指围攻设防地点；“正在”体现分词的持续进行意味。αὐτόν仅作“他”，保留原文代词所具有的指代张力，不在正文中擅自明确其所指。
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: 哀号流泪
  rationale: 以自然凝练的汉语表达强烈悲痛，同时保留哀号与眼泪两个意象。
- source_word: ἱκέτευον
  choice: 恳求
  rationale: 准确表达迫切而谦卑的祈求，语体庄重且通俗。
- source_word: σὺν τοῖς ὄχλοις
  choice: 和众人一起
  rationale: ὄχλοι 指聚集的群众；“众人”比“人群们”自然，并保留共同祈求的公共性质。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在犹太祷告语境中指上帝；“主”保留 κύριος 的经文称谓和敬虔语气。
- source_word: ἀγαθὸν ἄγγελον
  choice: 一位良善的天使
  rationale: 直译 ἀγαθός 的“良善”，不将其含义缩窄为仅仅“有帮助的”或“有利的”。
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: 来拯救以色列
  rationale: 在具体军事危机中，σωτηρία 首先表达救援、解救；动词式“拯救”在现代汉语中自然，同时仍具有宗教语域。
theological_decisions:
- issue: 犹太祷告语境中 κύριος 的译法
  choice: 主
  alternative: 上帝
  rationale: 原文使用 κύριος，而非 θεός；译作“主”既忠于词形，也保留其经文中的敬称作用。
- issue: 军事危机语境中 σωτηρία 的译法
  choice: 拯救
  alternative: 解救
  rationale: “解救”较突出眼前的军事脱困，“拯救”则既能涵盖具体救援，也保留 σωτηρία 较宽的神学回响；脚注说明另一种可能。
- issue: αὐτόν 的指代
  choice: 保留为“他”
  alternative: 明确译为“麦加比”或上下文中的另一男性人物
  rationale: 该代词在句内并未重复专名；正文保留代词，避免把解释性判断写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“麦加比一方的人”处理希腊习语而不过度界定成员范围；“哀号流泪，恳求主”保持祈祷场面的情感力度。脚注标记置于其实际说明的“拯救以色列”之后。
