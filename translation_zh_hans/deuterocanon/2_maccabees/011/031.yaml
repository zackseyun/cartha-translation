base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: zh_hans
  text: 准许犹太人像从前一样使用自己的供给[a]，并遵守自己的律法；他们中没有一个人会就那些出于无知所做的事[b]而以任何方式受到骚扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给”或译“费用”“供给品”，也可能包括与犹太生活方式有关的惯常饮食。希腊词的含义较宽。
    reason: lexical_alternative
  - marker: b
    text: “出于无知所做的事”也可理解为“先前未被察觉的事”。原文没有明确说明是谁不知情，也没有具体指出这些事的性质。
    reason: alternative_reading
lexical_decisions:
- source_word: χρῆσθαι
  choice: 采用
  rationale: 表达获准依照并使用本族安排与律法的意思，同时能自然地支配“供给安排”和“律法”。
- source_word: δαπανήμασιν
  choice: 供给安排
  rationale: 该词可指费用、开支或供给；语境涉及恢复犹太人原有生活方式，因此用较宽泛的“供给安排”，不把含义限定为饮食。
- source_word: νόμοις
  choice: 律法
  rationale: 保留 νόμος 在犹太语境中的正式法律及宗教规范意味，避免弱化为一般习俗。
- source_word: καθὰ καὶ τὸ πρότερον
  choice: 像从前一样
  rationale: 自然、准确地表达恢复先前做法的比较意义。
- source_word: παρενοχληθήσεται
  choice: 受到骚扰
  rationale: 体现将来被动式所表示的烦扰、刁难或干涉，又不额外指定实施者。
- source_word: περὶ τῶν ἠγνοημένων
  choice: 因出于无知所做的事
  rationale: 保留分词表达的宽泛性，既传达无知或不知情，也不把相关行为直接定性为违法或犯罪。
theological_decisions:
- issue: περὶ τῶν ἠγνοημένων 所指的范围
  choice: 泛指因无知或不知情而做的事
  alternative: 指先前被忽略的事项，或无意触犯犹太律法或王室政策的行为
  rationale: 希腊文没有说明是谁无知，也没有明确限定为某类法律过失，因此正文不将其收窄为特定法律理论。
translation_notes:
  register: 采用现代、庄重而易懂的公文式语气。“准许”承接书信中的许可内容；“律法”保留犹太语境的正式含义。正文保留 δαπανήμασιν 与 ἠγνοημένων 的歧义，并以脚注说明其他可能理解。
