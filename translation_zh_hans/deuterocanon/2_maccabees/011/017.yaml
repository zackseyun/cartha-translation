  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
translation:
  language: zh_hans
  text: 你们派来的约翰和押沙龙呈上了下面所写的公文[a]，并就其中所说明的事项提出请求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“附上的书面函件”或“写在下面的法令”。希腊语“τὸν ὑπογεγραμμένον χρηματισμόν”是略带专门意味的公文用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἀβεσσαλὼμ
  choice: 押沙龙
  rationale: 采用现代中文圣经传统中通行的人名译法，以便辨认。
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: 你们派来的
  rationale: 在使者语境中，παρά加属格表示差遣的来源或施事；此译自然保留被差遣之意。
- source_word: ἐπιδόντες
  choice: 呈上了
  rationale: 该词在公文语境中指递交文件；“呈上”既自然又保留正式语气。
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: 下面所写的公文
  rationale: ὑπογεγραμμένον可指写在下方，χρηματισμός在此是正式的书面传达或文件；“公文”保持文书语体，又不武断限定为法令。
- source_word: ἠξίουν
  choice: 提出请求
  rationale: 该动词在外交或正式交涉语境中有请求、陈请之意；此译比单纯“询问”更能体现正式语气。
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: 就其中所说明的事项
  rationale: αὐτοῦ自然回指公文，σημαινομένων表示借该文书说明或传达的事项；译文保留其概括性。
