base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he advanced against the Jews, intending to make the city a dwelling place for Greeks,
translation:
  language: zh_hans
  text: 他集结了约八万人和所有骑兵，便向犹太人[a]进军，打算把这城变成供希腊人居住的地方，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹地人”。希腊语Ἰουδαίους可指犹太人，也可按语境指犹地的人民。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: 召集了
  rationale: 不定过去时分词表示先于主句动作发生的行动；“召集了……就……”在现代汉语中自然地体现这一先后关系。
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: 约八万人
  rationale: μυριάς为“一万”，八个“一万”即八万；περὶ用于数字时表示约数。军事语境表明所数的是兵员，故补出“人”。
- source_word: τὴν ἵππον ἅπασαν
  choice: 全部骑兵
  rationale: ἵππος在军事语境中可集合性地指骑兵部队；此译法准确而简明。
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: 进军攻打犹太人
  rationale: παραγίνομαι与ἐπί加宾格在此表示带敌意地向对方推进；“进军攻打”清楚传达军事行动，而不把它弱化为普通的到来。
- source_word: λογιζόμενος
  choice: 打算
  rationale: 该分词在上下文中表达筹划和意图；“打算”保留目的意味，又不过度强化为已经确定的结果。
- source_word: τὴν μὲν πόλιν
  choice: 这城
  rationale: 所指为上下文中的特定城市；汉语用“这城”自然。μέν预示后文还有与之相配的内容，因此句末保留未完结构。
- source_word: Ἕλλησιν
  choice: 希腊人的
  rationale: 与οἰκητήριον ποιήσειν连用的与格表示居住地归谁使用，即供希腊人居住；译为所有关系符合现代汉语习惯。
- source_word: οἰκητήριον ποιήσειν
  choice: 把……变成……居住地
  rationale: 该结构意为使某处成为居所；“变成……居住地”自然清楚，同时避免额外引入“殖民地”等原文未明说的概念。
theological_decisions:
- issue: 族群称谓Ἰουδαίους
  choice: 犹太人
  alternative: 犹地人
  rationale: Ἰουδαῖοι既可指犹太民族及宗教群体，也可按地域指犹地人。本节把他们作为受攻击的整体群体，“犹太人”更符合现代汉语通常表达；脚注保留地域性译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“召集了……就……”体现原文分词与主句的动作次序；以逗号结尾，保留μέν所开启并在下一节继续展开的句法张力。脚注标记置于“犹太人”之后，以对应其实际说明的词语。
