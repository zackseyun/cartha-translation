base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: zh_hans
  text: 我们听说，犹太人不赞同我父亲所作的希腊化改变[a]，却选择自己的生活方式，并请求准许他们遵行自己的律例习俗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我父亲所作的、转向希腊习俗的改变。”这里的希腊文指转向希腊化的生活与习俗，并不只是改用希腊语。
    reason: 说明εἰς τὰ Ἑλληνικά的文化含义，并保留较字面的译法。
lexical_decisions:
- source_word: ἀκηκοότες
  choice: 我们听说
  rationale: 以完成时分词说明王室回应的缘由；中文用“我们听说”既自然，也保留公函语气。
- source_word: μὴ συνεὐδοκοῦντας
  choice: 不赞同
  rationale: 表达不赞成、不认同有关改变，符合 συνευδοκέω 在此处的语义。
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: 我父亲推行的希腊化改革
  rationale: μετάθεσις 指转变，εἰς τὰ Ἑλληνικά 在上下文中指转向希腊文化与习俗，而非单指语言；“推行的”使所属结构在中文中清楚。
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: 他们自己的生活方式
  rationale: ἀγωγή 可指生活方式、行为规范或教养；此处涉及群体性的传统生活，译作“生活方式”最贴切。
- source_word: αἱρετίζοντας
  choice: 选择
  rationale: 保留主动取舍与偏好的含义。
- source_word: ἀξιοῦν
  choice: 请求
  rationale: 在此引出所求之事，译作“请求”符合正式文书语境，也不强化为权利主张。
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: 准许他们遵守本有的律例习俗
  rationale: συγχωρηθῆναι 表示获准；τὰ νόμιμα 兼有法定规例和传统习俗之义。“本有的”在中文中表明这是他们既有的规范，而不擅自限定为仅指成文法律或祖传礼俗。
theological_decisions:
- issue: εἰς τὰ Ἑλληνικά 的范围
  choice: 理解为文化与习俗层面的希腊化
  alternative: 仅指改用希腊语言；或较字面地译为“转向希腊习俗”
  rationale: 本句把这一改变与犹太人自己的生活方式及律例习俗相对照，因此重点是希腊化政策，不只是语言变化。脚注保留较字面的表达。
translation_notes:
  register: 采用现代、庄重而易懂的公函语体。句首“我们”承接王室书信的复数发言者；全句按原文仍未完结，以句号以外的整体经文呈现惯例可由上下文排版调整。
