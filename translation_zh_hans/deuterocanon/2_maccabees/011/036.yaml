  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: zh_hans
  text: 至于他决定要呈交给国王的事，你们要立刻派人查察这些事，好让我们能按对我们合宜的方式处理这些事[a]；因为我们正前往安提阿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让我们能按对我们合宜的方式安排这些事。”希腊文直译为“好让我们能照着对我们合宜的那样拥有〔这些事〕”；这里的“拥有”很可能是指以适当方式安排或处理这些事项，但其具体习语含义并不完全确定。
    reason: 原文ἔχωμεν（“我们可以有／拥有”）在此行政书信语境中可能指安排或处理事项；脚注保留其字面义及替代性理解。
lexical_decisions:
- source_word: ἃ δὲ
  choice: 至于……的事
  rationale: δέ在此作温和的转折或承接；用“至于”自然引出尚待呈交国王处理的事项。ἃ按不定关系含义译为“……的事”。
- source_word: ἔκρινεν
  choice: 他所决定
  rationale: κρίνω在此指作出正式决定。“决定”比“审判”更符合书信行政语境；希腊文主语为第三人称单数，译文保留“他”，不擅自明确其身份。
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: 要呈交国王
  rationale: 被动不定式表达将事项正式呈报国王。“呈交”保留行政语气，又不额外限定具体程序。
- source_word: πέμψατέ τινα
  choice: 你们要……派一个人
  rationale: πέμψατε是复数命令式，故明示“你们要”；τινα是不定指，译为“一个人”，不添加身份或职务。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达立即、毫不拖延之意，现代汉语清楚自然。
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: 来查明这些事
  rationale: 将来中动分词说明所派之人的任务或目的。ἐπισκέπτομαι在此有察看、查究之意；“查明”符合行政书信语境。
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: 好让我们能按合宜的方式处理
  rationale: ἔχωμεν字面为“我们可以有”，此处是省略宾语或补语的行政习语，具体所指并不完全明确。“处理”使中文成立，同时以脚注保留“安排妥当”等可能性；ὡς καθήκει ἡμῖν译为“按合宜的方式”，保留何为合宜的开放性。
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: 因为我们正前往安提阿
  rationale: γάρ说明前述要求的原因。προσάγομεν结合地点方向短语表示向目的地行进；“正前往”自然表达进行中的行程，不将方向解释成“来到”。
