base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/004.yaml
  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: zh_hans
  text: 他丝毫没有把上帝的大能考虑在内[a]，反倒因数以万计的步兵[b]、数以千计的骑兵和八十头战象而骄傲自大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“丝毫没有估量上帝的能力。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“万数的步兵”；可指实际以万为单位的数量，也可泛指人数极多。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδάμως
  choice: 丝毫没有
  rationale: 表达强烈而彻底的否定，符合现代汉语习惯。
- source_word: ἐπιλογιζόμενος
  choice: 把……考虑在内
  rationale: 该分词表示经过思量或权衡；此译法也保留军事谋算语境中的意味。
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: 上帝的大能
  rationale: κράτος在这里侧重强大、有实效的力量，与下文的人力军备形成对照，而不特别引入统治权的含义。
- source_word: πεφρονηματισμένος
  choice: 骄傲自大
  rationale: 该完成时分词描述因自我高抬而处于狂傲状态；此译自然且保留贬义。
- source_word: μυριάσιν τῶν πεζῶν
  choice: 数以万计的步兵
  rationale: μυριάς既可指一万的单位，也可泛指极多；此译保留数量级意味而不武断认定精确人数。
- source_word: χιλιάσι τῶν ἱππέων
  choice: 数以千计的骑兵
  rationale: 保留复数的数量表达，并以现代军事用语“骑兵”自然呈现ἱππεῖς。
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: 八十头战象
  rationale: 准确保留明确数字；结合军事列举语境，用“战象”明确这些象是军队装备。
theological_decisions:
- issue: 军事自夸语境中τὸ τοῦ θεοῦ κράτος的译法
  choice: 上帝的大能
  alternative: 上帝的权能；上帝的统治权
  rationale: 本句将上帝的力量与步兵、骑兵、战象等军事资源对比。“大能”突出可施行的强力，同时避免把含义限定为统治权。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“反倒”鲜明呈现οὐδάμως…δὲ的对照；“骄傲自大”传达因军力而自我高抬的状态。所有脚注标记均已置于相应正文位置。
