  text: But most of them escaped wounded and naked[a], and Lysias himself also escaped by fleeing shamefully.
translation:
  language: zh_hans
  text: 但他们大多数人受了伤，赤身逃脱了[a]；吕息亚本人也可耻地逃跑而脱身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受伤而衣不蔽体地逃脱了”。“赤身”也可能是指他们逃亡时失去衣物或盔甲，并不一定指全身裸体。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: 他们大多数人
  rationale: πλείονες 在这里作名词用，指其中较多的一部分，即“大多数人”；这一译法自然并保留数量含义。
- source_word: τραυματίαι
  choice: 负了伤
  rationale: 该词指受伤的人；译作“负了伤”符合战斗语境，也使中文句子流畅。
- source_word: γυμνοὶ
  choice: 赤身
  rationale: γυμνός 的直接含义是“裸体、赤身”；战败逃亡的语境也可能指衣甲被剥去，因此保留脚注说明歧义。
- source_word: διεσώθησαν
  choice: 逃脱了
  rationale: διασῴζω 可表示安全脱险或保全性命；在战败逃亡的叙事中，“逃脱”最贴切。
- source_word: αἰσχρῶς
  choice: 可耻地
  rationale: 该副词明确评价其逃跑方式为不光彩、可耻，译文保留原文的贬义判断。
- source_word: φεύγων
  choice: 逃跑，才
  rationale: 现在分词表示伴随方式或手段；“逃跑，才得以脱身”清楚表达吕息亚是借逃跑脱险。
- source_word: διεσώθη
  choice: 得以脱身
  rationale: 与前句同一动词，但结合 φεύγων 译为“得以脱身”，避免中文重复生硬，同时保留其逃出生天的意思。
