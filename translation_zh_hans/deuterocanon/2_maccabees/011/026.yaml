  yaml_path: translation/deuterocanon/2_maccabees/011/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention, they may be encouraged and may gladly attend to the securing of their own affairs.
translation:
  language: zh_hans
  text: 因此，你派人到他们那里，向他们作出表示诚意的保证[a]，这样做很好；好使他们知道我们的意向后，能够振作起来，欣然照管自己的事务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“给出右手”，是外交用语，表示给予保证或作出诚信的承诺。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: 所以……就是办得妥当
  rationale: εὖ ποιήσεις在此是带有劝告和认可意味的惯用表达，并非单纯预告将来；“办得妥当”自然保留其劝勉语气。
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: 派人到他们那里
  rationale: διαπέμπω在外交书信语境中表示差派人前往或传达信息；译文明确差派之意，却不额外指定使者身份。
- source_word: δοὺς δεξιάς
  choice: 向他们作出诚信的保证
  rationale: 原文直译为“给出右手”，是外交或盟约语境中表示保证、信诺的习语；正文采用现代汉语可懂的含义，并以脚注保留原文形象。
- source_word: τὴν ἡμετέραν προαίρεσιν
  choice: 我们的意向
  rationale: προαίρεσις指经过考虑的意图或决定；“意向”保持中性，不擅自增添“善意”等正面含义。
- source_word: εὔθυμοί τε ὦσιν
  choice: 便可振作起来
  rationale: εὔθυμος表示心里有勇气、精神振奋；“振作起来”适合此处因得知当局意向而产生的结果。
- source_word: ἡδέως διαγίνωνται πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: 欣然照管自己的事务
  rationale: ἡδέως表达欣然、乐意；διαγίνομαι与πρός加ἀντίληψις在此指持续投入照料、维持属于自己的事务。“照管自己的事务”保留范围，不把所指限缩为财产或政治权益。
