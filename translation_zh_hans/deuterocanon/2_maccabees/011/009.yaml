base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: zh_hans
  text: 众人一同颂赞满有怜悯的上帝，心里也刚强起来[a]，随时准备好去击伤人，甚至击伤最凶猛的野兽、击破铁墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的魂也得了坚固。”希腊文指他们内在得着力量和勇气。
    reason: 保留ψυχαῖς（“魂、生命、内在之人”）的形式对应译法，并说明此处的语境含义。
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: 众人一同
  rationale: ὁμοῦ与πάντες连用，突出众人同时且同心采取行动；“众人一同”自然保留这种集体性。
- source_word: εὐλόγησαν
  choice: 颂赞
  rationale: 在以上帝为宾语时，εὐλογέω表示称颂、赞美；现代汉语“颂赞”比直译“祝福上帝”更自然，也保留敬拜语感。
- source_word: τὸν ἐλεήμονα θεόν
  choice: 怜悯人的上帝
  rationale: ἐλεήμων明确描述上帝富有怜悯；“怜悯人的”比抽象的“仁慈的”更直接体现该词的施怜悯含义。
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: 心里也刚强起来
  rationale: 该短语指内在勇气和意志得到加强，并非在此作技术性灵魂论陈述；“心里”是自然现代汉语，同时脚注保留较形式对应的译法。
- source_word: τιτρώσκειν
  choice: 击伤……击破
  rationale: τιτρώσκω基本义为使受伤、创伤。面对人和野兽译作“击伤”，面对铁墙则按汉语搭配译作“击破”，既保存同一动词统摄三类对象的夸张力量，也避免“击伤铁墙”的生硬。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 泛指战斗中的人类对手；现代汉语用“人”准确自然，无须加入原文没有的性别限定。
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: 甚至连最凶猛的野兽
  rationale: θῆρας是野兽，ἀγριωτάτους为最高级；δὲ在“不仅”结构后有递进意味，因此用“甚至连”表达。
- source_word: σιδηρᾶ τείχη
  choice: 铁墙
  rationale: 保留原文“铁制或如铁般坚固的墙”的强烈形象与军事夸张，不擅自解释为普通城墙。
- source_word: ὄντες ἕτοιμοι
  choice: 准备
  rationale: 表达他们因内心得坚固而处于随时行动的状态；简洁符合现代汉语句法。
theological_decisions:
- issue: ψυχαῖς在战前鼓舞语境中的理解
  choice: 心里也刚强起来
  alternative: 他们的魂也得了坚固
  rationale: 此处重点是内在勇气与决心，并不意在界定人的构成。“心里”避免引入特定灵魂论，同时脚注说明希腊文的形式和语义范围。
- issue: εὐλόγησαν用于人对上帝的行动
  choice: 颂赞上帝
  alternative: 称颂／祝福上帝
  rationale: 汉语中“祝福上帝”容易被理解为人向上帝赐福；“颂赞”准确表达人在敬拜中称上帝为有福、说赞美的话，不加入宗派性含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“颂赞”“刚强”保持经文语体，但句法清楚易懂。末句保留原文由人、最凶猛的野兽直到铁墙的递进夸张；为符合汉语搭配，同一希腊动词按宾语分别译为“击伤”和“击破”。
