- source_word: μεταλαβὼν
  choice: 又着手对付
  rationale: 该分词在这里承接犹大的下一步行动，可表示着手处理另一群对象；“着手对付”既体现过渡和敌对语境，又不把词义过度限定为某一种军事行动。
- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: 雅姆尼亚那些……的人
  rationale: 冠词加介词短语指位于雅姆尼亚的相关人群；译文保留其宽泛指称，不擅自限定身份。
- source_word: τὸν αὐτὸν … τρόπον
  choice: 同样手段
  rationale: τρόπος指方式、手段；结合上下文，“同样手段”自然地表达所谋划的敌对做法，同时不具体化其内容。
- source_word: ἐπιτελεῖν
  choice: 用
  rationale: 此处与“手段”搭配，汉语以“用……手段对待”自然表达“实行、施行”的含义，避免生硬直译。
- source_word: βουλομένους
  choice: 想
  rationale: 表达意愿或意图，并保留原文没有明确区分“希望”与“计划”的弹性。
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: 对待当地犹太居民
  rationale: 与上下文所暗示的敌对行动相配，“对待”表达动作所指向的对象；“当地犹太居民”自然呈现 κατοικοῦσιν 的居住含义。
