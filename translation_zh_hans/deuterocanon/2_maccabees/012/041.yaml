  yaml_path: translation/deuterocanon/2_maccabees/012/041.yaml
  text: So they all blessed the righteous Judge[a], the Lord, who makes the hidden things manifest,
translation:
  language: zh_hans
  text: 于是，众人都称颂那秉公审判的主所作的事[a]；他使隐藏的事显明，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为省略表达，直译近于“那秉公审判的主的那些事”。所省略的名词未明说，可指他的作为、行事或有关他的事。
    reason: 保留希腊文中性复数冠词加属格结构的省略性及其真实的语义开放度，且不改变其句法上以“事”为称颂对象的结构。
lexical_decisions:
- source_word: εὐλογήσαντες
  choice: 称颂
  rationale: 这里的对象是上帝；“称颂”既保留宗教语境中的郑重意味，也符合现代汉语表达。
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: 秉公审判的主所行的一切
  rationale: 中性复数冠词加属格构成省略表达，指属于这位主、由他所行或彰显其品格的事。“所行的一切”在汉语中自然，同时以脚注保留原文可能指向主本身的另一种理解。
- source_word: δικαιοκρίτου
  choice: 秉公审判的
  rationale: 该复合词指审判公正、按正义施行判断；“秉公审判”比单用“公义”更直接保留其审判含义。
- source_word: κυρίου
  choice: 主
  rationale: 此处是对上帝的尊称，译作“主”符合圣经汉语的惯用表达。
- source_word: τὰ κεκρυμμένα
  choice: 隐藏的事
  rationale: 完成时被动分词作名词使用，表示那些一直隐而未显的事；此译保留其复数、实质化的用法。
- source_word: φανερὰ ποιοῦντος
  choice: 使……显明
  rationale: 保留原文“使之成为显明”的使役结构，措辞庄重而清楚。
theological_decisions:
- issue: τὰ τοῦ δικαιοκρίτου κυρίου这一省略结构的所指
  choice: 秉公审判的主所行的一切
  alternative: 称颂公义的审判者，就是主
  rationale: 原文中性复数τὰ使“属于主的事／主所行的事”成为较直接的句法理解，但具体省略的名词并未写明。正文采用自然且不过度限定的“所行的一切”，脚注保留将称颂对象直接理解为主的可能。
- issue: δικαιοκρίτου中正义与审判两层含义
  choice: 秉公审判的主
  alternative: 公义的审判者
  rationale: “秉公审判的主”同时表达其审判行为和公正性质，又不将“主”与“审判者”处理成两个称号。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“称颂”“秉公审判”“显明”保持经文语体，但避免生硬古语。句末逗号依照所给希腊文本未完的句法，表明下文仍有承接。
