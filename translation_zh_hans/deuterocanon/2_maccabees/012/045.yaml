  yaml_path: translation/deuterocanon/2_maccabees/012/045.yaml
  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: zh_hans
  text: 因为，如果他所着眼的是为那些在虔敬中安睡的人存留的最美好的奖赏[a]，这样的心意就是圣洁而虔诚的。因此，他为死者作了赎罪[b]，使他们得以从罪中释放。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他们存留的最美好的礼物。”这里的希腊词 εὐχαριστήριον 用法罕见，可能指预留的福分、酬报或礼物。
    reason: lexical_alternative
  - marker: b
    text: “作了赎罪”也可译作“作了除罪”或“作了挽回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  choice: 因为，如果
  rationale: 保留该词在上下文中兼有承接理由与条件表达的作用，不将其完全化约为单纯因果。
- source_word: ἐμβλέπων
  choice: 所着眼的是
  rationale: 表达把注意力定向于将来所存留之事，兼顾原词的视觉隐喻与现代汉语的自然度。
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: 那些虔敬而安睡之人
  rationale: “安睡”保留以睡眠委婉指死亡的原文意象；“虔敬而”自然表达 μετʼ εὐσεβίας 所指的伴随状态或生活品格。
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: 存留的极美奖赏
  rationale: κάλλιστον 译为“极美”，ἀποκείμενον 译为“存留”；罕见的 εὐχαριστήριον 依语境译作“奖赏”，同时以脚注保留“礼物”等可能性。
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: 这想法就是圣洁而虔诚的
  rationale: ἐπίνοια 可指想法或意念；采用宽泛自然的“想法”，并保留两个宗教伦理评价词。
- source_word: ὅθεν
  choice: 因此
  rationale: 清楚表达由前句评价引出的推论。
- source_word: περὶ τῶν τεθνηκότων
  choice: 为死者
  rationale: 自然表达赎罪行动所关涉并惠及的对象，又不额外规定代替关系。
- source_word: τὸν ἐξιλασμόν
  choice: 赎罪之礼
  rationale: 既表达处理罪的祭仪性行动，也避免仅用抽象名词而造成汉语不自然；脚注保留其他术语可能。
- source_word: ἐποιήσατο
  choice: 行了
  rationale: 与“赎罪之礼”搭配自然，并保留实施该祭仪行动的含义。
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  choice: 使他们得以从罪中释放
  rationale: 保留不定式的目的或结果意味及被动的释放意象，不扩写为后世教义体系。
theological_decisions:
- issue: 为死者赎罪所暗示的死后益处
  choice: 直译为“为死者行了赎罪之礼，使他们得以从罪中释放”
  alternative: 将其弱化为仅有纪念意义，或将其明确纳入后世关于死后炼净的完整教义
  rationale: 希腊文明确把为死者所行的 ἐξιλασμός 与从罪中获释相连；译文保留这一陈述及其张力，但不加入经文本身未说明的后世体系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“安睡”保留圣经传统的死亡委婉语；“赎罪之礼”突出原句的祭仪行动，又不预设特定的赎罪理论。所有脚注标记均已置于正文相应位置。
