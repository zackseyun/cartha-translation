base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: zh_hans
  text: 但他们在每个死者的内袍下，都发现了雅姆尼亚偶像的圣物[a]，这是律法禁止犹太人持有的；于是众人都清楚，这些人正是因此而阵亡的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“祭祀物件”“还愿供物”，在此也可能指“护身符”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“倒下了”，在这里是战场用语，意思是战死。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: 圣物
  rationale: 该词泛指与祭祀或宗教敬奉有关的物件；“圣物”保留其宗教属性，同时不武断限定为护身符或还愿供物。
- source_word: χιτῶνας
  choice: 内衣
  rationale: χιτών指贴身穿的内层衣服；在此用“内衣”自然表达物件藏在衣服下面，且比笼统的“衣服”更准确。
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: 雅姆尼亚偶像的
  rationale: 保留物件与雅姆尼亚偶像之间的所属或关联关系，不进一步判定这些物件的具体来源或用途。
- source_word: ἀπήργει
  choice: 禁止
  rationale: 此动词在这里表达律法上的禁绝，“禁止”准确而清楚。
- source_word: πεπτωκέναι
  choice: 阵亡
  rationale: πίπτω字面为“倒下”，在战斗语境中指战死；“阵亡”以自然现代汉语保留其战场含义。
- source_word: τούσδε
  choice: 这些人
  rationale: 明确指回前文所说的死者，符合现代汉语表达。
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: 正是因此
  rationale: 清楚表达原文所陈述的因果关系，“正是”也传达众人所得结论的明确性。
theological_decisions:
- issue: 偶像圣物与士兵死亡之间的因果关系
  choice: 译作“众人都清楚，这些人正是因此而阵亡的”
  alternative: 译作“众人都认为，这些人是因此而阵亡的”
  rationale: 原文说“这事对众人变得清楚”，语气强于仅仅表达众人的主观看法；译文保留经文所陈述的因果判断，不另加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“内衣”按古代语境指贴身穿的内层衣服；句式保留原文从发现违禁物件到认定死因的推进。
