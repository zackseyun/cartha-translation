revisions:
- from: 但他们在每个死者的内衣下面，都发现了雅姆尼亚偶像的圣物[a]，这是律法禁止犹太人佩带的；于是众人都清楚，这些人正是因此而阵亡的[b]。
  to: 但他们在每个死者的内袍下，都发现了雅姆尼亚偶像的圣物[a]，这是律法禁止犹太人持有的；于是众人都清楚，这些人正是因此而阵亡的[b]。
  rationale: 修订仅纠正“佩带”对原文禁令范围的过度限定，并以“内袍”避免现代“内衣”的狭义联想。其余措辞、因果表述及脚注均保留原稿对原文歧义和战斗语境的处理，未添加神学解释。
