  text: After these agreements had been made[a], Lysias went away to the king[b], but the Jews occupied themselves with farming.
translation:
  language: zh_hans
  text: 这些协议达成后，吕西亚便离开，往王那里去了；犹太人则忙于耕作。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένων
  choice: 达成以后
  rationale: 不定过去时属格绝对结构表示协议先于主句事件成立或缔结；“达成以后”自然体现其完成性。
- source_word: συνθηκῶν
  choice: 协议
  rationale: 本词指协议、约定或协定；“协议”语义宽而准确，不额外引入“盟约”的神学色彩，也不将其限定为正式国与国条约。
- source_word: ἀπῆε
  choice: 去了
  rationale: 叙事中的未完成过去时表示吕息亚离开并前往王那里；现代汉语用“去了”即可自然表达，原文没有明说“回去”。
- source_word: πρὸς τὸν βασιλέα
  choice: 到王那里
  rationale: πρός加宾格表示朝向某人；“到王那里”比生硬的“向王”自然，同时不增添原文未明说的“返回”。
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: 忙于耕作
  rationale: 这是表示投身或从事某事的习语；“忙于耕作”以自然简洁的现代汉语传达犹太人从事农事，并避免逐词硬译。
