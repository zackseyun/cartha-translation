base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/004.yaml
  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
translation:
  language: zh_hans
  text: 城市作出共同决议后，这些人接受了这项决议；他们似乎有意和平相处，也没有任何疑心[a]，人们就把他们带走，淹死了他们，人数不少于二百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也没有任何可疑之处。”希腊语可指他们自己没有任何疑心，也可指他们身上没有任何可疑之处。
    reason: 保留μηδὲν ὑπόπτον ἐχόντων在主动的‘没有疑心’与较被动的‘没有可疑之处’之间的词义歧义。
lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: 全城共同作出的决议
  rationale: ψήφισμα指正式作出的决议或表决结果；结合κοινὸν与τῆς πόλεως，译文保留其全城共同决定的公共性质，而不强化为君王颁布的法令。
- source_word: τούτων ἐπιδεξαμένων
  choice: 这些人也接受了
  rationale: ἐπιδέχομαι在此表示接受或赞同前述决议；用“接受了”简明保留分词所表达的先行情形。
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: 他们似乎有意和平相处
  rationale: εἰρηνεύειν表示维持和平、和平相处；“似乎”保留ὡς ἂν所带的表象或所据情状，不把人物动机断定得过实。
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: 又毫无疑心
  rationale: ὑπόπτον可指引起怀疑之物，也可涉及嫌疑或可疑性；正文采用自然的主动态理解，同时以脚注保留“没有可疑之处”的另一可能。
- source_word: ἀχθέντας
  choice: 把他们带走
  rationale: ἄγω的被动分词表示他们被领走或带走；译文不擅自补出具体目的地。
- source_word: ἐβύθισαν
  choice: 沉水淹死
  rationale: βυθίζω本义为使下沉、使没入深处；人作为宾语时结果是溺死，“沉水淹死”兼顾动作意象与实际结果。
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: 人数不少于二百
  rationale: 直译并保留οὐκ ἔλαττον所表达的最低数量界限。
