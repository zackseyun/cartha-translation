  - severity: low
    issue: “对方却”补出了原文未明确的对立称谓
    rationale: 主句动词只以隐含主语叙述施害者；中文可用无标记的“就把他们带走”，既保持施害者与受害者的区分，也不额外设定“对方”。
  - severity: medium
