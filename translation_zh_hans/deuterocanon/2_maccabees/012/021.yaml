base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/021.yaml
  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
translation:
  language: zh_hans
  text: 提摩太得知犹大正在进军，就预先把妇女和其余的辎重送往一个名叫卡尔尼翁的地方；因为那地方四周地势狭窄[a]，难以围攻，也难以接近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“因为所有地方都狭窄”；可能是指该地四周的地形或各条进路都很狭窄。
    reason: 保留πάντων τῶν τόπων这一略显概括且所指可能有歧义的表达。
lexical_decisions:
- source_word: τὴν δὲ ἔφοδον μεταλαβὼν Ἰούδου
  choice: 提摩太得知犹大正在进军
  rationale: μεταλαβών在这里表示获悉消息；ἔφοδος有进军、来袭或攻击之意。译作“正在进军”既保留军事语境，也不武断认定攻击已经展开。
- source_word: προεξαπέστειλεν
  choice: 预先……送往
  rationale: 保留复合动词所表达的事先派送、送到前方之意，现代汉语也自然。
- source_word: τὰς γυναῖκας καὶ τὴν ἄλλην ἀποσκευήν
  choice: 妇女和其余的辎重
  rationale: ἀποσκευή指随队携带的行李、装备或物资；军事叙事中“辎重”简洁贴切。“其余”对应ἄλλην，并保留原文将妇女与其他需转移之物并列的表达。
- source_word: εἰς τὸ λεγόμενον Κάρνιον
  choice: 往一个名叫卡尔尼翁的地方
  rationale: λεγόμενον在此用于引出地名；补出“地方”使中文顺畅。Κάρνιον按希腊语音译为“卡尔尼翁”。
- source_word: δυσπολιόρκητον καὶ δυσπρόσιτον
  choice: 难以围攻，也难以接近
  rationale: 分别保留两个形容词的军事和空间含义，不把“难以接近”强化成绝对的“无法进入”。
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: 因为那地方四周地势狭窄
  rationale: 原文直译近于“由于所有地方的狭窄”；结合防守地形，指周围各处或通道逼仄。正文采用自然中文，脚注保留字面表达的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“辎重”是普通读者可理解的军事用语；语序略作调整，将地形原因置于两个谓语之前，以符合现代汉语表达。脚注标记放在其实际说明的地形短语之后。
