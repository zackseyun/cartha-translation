base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: zh_hans
  text: 一场激烈的战斗过后，犹大一方的人因着来自上帝的帮助而占了上风。游牧民被削弱，就请求犹大向他们伸出右手[a]，并承诺提供牧场，也在今后的事上使犹大一方得益。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“把右手给他们”，这是缔结和平或承诺结盟的表示。
    reason: cultural_note
  - marker: b
    text: 本节末尾的希腊文用语较为凝缩，动词形式也不寻常；按上下文，意思似乎是游牧民承诺提供放牧所需，并在今后的事上使犹大一方得益。
    reason: textual_difficulty
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: 激烈的战斗
  rationale: καρτερός在战斗语境中表示强烈、艰苦或猛烈；“激烈”自然地保留了战况的强度。
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: 犹大一方的人
  rationale: 该希腊习语指围绕犹大、属于其阵营的人；此译法不额外限定其军事编制。
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: 因着来自上帝的帮助
  rationale: 既保留διά所表达的原因，也体现παρά所标明的帮助来源。
- source_word: εὐημερησάντων
  choice: 占了上风
  rationale: 在战斗语境中表示进展顺利、取得优势；不把结果强化为彻底获胜。
- source_word: ἐλαττωθέντες
  choice: 势力受挫
  rationale: 原词表示被削弱、减少；“受挫”保留其宽泛程度，避免过译为“被击败”。
- source_word: οἱ νομάδες
  choice: 游牧人
  rationale: 作为描述性社会群体称谓处理，而非专名。
- source_word: δοῦναι τὸν Ἰούδαν δεξιὰν αὐτοῖς
  choice: 请求犹大向他们伸出右手
  rationale: 保留原文“给右手”的具象习语，同时采用自然汉语表达，并以脚注说明其缔和或结盟含义。
- source_word: βοσκήματα δώσειν
  choice: 提供牧场
  rationale: βοσκήματα涉及牲畜放牧所需的草场或饲料；“牧场”符合上下文，又不作过细限定。
- source_word: ἐν τοῖς λοιποῖς
  choice: 在今后的事上
  rationale: 可指其余或后续各事；该译法保留事项范围和时间指向。
- source_word: ὠφέλησεν αὐτούς
  choice: 帮助他们
  rationale: 传本文句在时态和句法上较为突兀；依上下文表达游牧人承诺日后使犹大一方得益，同时用脚注标明疑难。
theological_decisions:
- issue: 军事优势与上帝帮助之间的因果关系
  choice: 因着来自上帝的帮助而占了上风
  alternative: 仅陈述犹大一方在战斗中占优，不明说其原因
  rationale: 原文明确用διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν把其顺利归因于来自上帝的帮助，因此正文直接保留这一神学陈述。
- issue: “伸出右手”的关系性质
  choice: 正文保留具象习语，脚注说明为缔和或结盟的表示
  alternative: 正文直接译为“与他们讲和”或“同他们结盟”
  rationale: 该动作可涵盖和平保证、友好承诺或盟约关系；保留习语可避免把具体关系性质限定得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“占了上风”保留战斗中的成功而不夸大为全胜；“势力受挫”对应被削弱而非被彻底击败。正文保留“伸出右手”的文化意象，并通过脚注解释。
