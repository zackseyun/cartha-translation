  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
translation:
  language: zh_hans
  text: 他呼求上帝——这位公义的审判者——，便前去攻打杀害弟兄们的凶手；夜间，他放火烧了港口，焚毁船只，又刺击了那些一同逃到那里的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些在那里避难的人。”这个希腊语分词可表示一同逃往该处，也可着重表示逃往那里寻求庇护。
