lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: 呼求
  rationale: 表示在行动之前向上帝呼告、求助；“呼求”自然保留宗教语境中的祈求意味。
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: 公义的审判者上帝
  rationale: 保留原文对上帝的同位性称谓及其司法、道德意味，不把这句话扩展为对随后行动的额外神学评断。
- source_word: παραγενόμενος ἐπὶ
  choice: 前去攻打
  rationale: ἐπί接宾格在此叙事和敌对语境中表示朝敌方而去；“攻打”清楚呈现其军事敌对含义。
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: 杀害弟兄们的凶手
  rationale: μιαιφόνος带有杀人流血、沾染血债的强烈贬义；“凶手”在现代汉语中简洁有力。原文没有明说“他的”，故不添所有格；“弟兄们”也可指同胞。
- source_word: τὸν μὲν λιμένα
  choice: 港口
  rationale: λιμήν指港湾或港口；此处作为纵火对象，“港口”最符合场景。
- source_word: νύκτωρ
  choice: 夜间
  rationale: 准确表达行动发生的时间，并保持凝练的叙事语体。
- source_word: ἐνέπρησεν
  choice: 放火烧了
  rationale: 该动词表示使某物起火、纵火焚烧；此译保留其使动和主动纵火的意味。
- source_word: τὰ σκάφη κατέφλεξεν
  choice: 焚毁船只
  rationale: σκάφη泛指船、舟；κατέφλεξεν表示彻底焚烧。“焚毁船只”自然体现强化语气。
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: 那些一同逃到那里避难的人
  rationale: συμφυγόντας兼有一起逃往某处及寻求庇护的意味；正文兼顾两层含义，脚注说明较简约的可能译法。
- source_word: ἐξεκέντησεν
  choice: 刺杀了
  rationale: 该词表示以尖锐武器刺穿；在这场报复性军事袭击中，“刺杀”比单说“刺”自然，也保留暴力动作的力度。
theological_decisions:
- issue: 军事报复语境中对上帝作为审判者的称呼
  choice: 公义的审判者上帝
  alternative: 公正的审判者上帝
  rationale: δίκαιος兼具公义、公正之意；“公义”保留较庄重的道德与司法内涵。译文只呈现犹大在行动前的呼求，不额外宣称上帝认可其全部行动，以保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“便”“夜间”“焚毁”维持历史叙事的凝练感；避免增添原文没有的所有格及神学评价。脚注标记置于其实际说明的“逃到那里避难的人”之后。
