  yaml_path: translation/deuterocanon/2_maccabees/012/030.yaml
  text: And when the Jews who were settled there testified to the goodwill that the people of Scythopolis had toward them[a], and to their gentle treatment in times of misfortune,
translation:
  language: zh_hans
  text: 住在那里的犹太人作证说，斯基托波利斯人对他们心存善意，并且在他们遭遇不幸时温和地接待他们[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “温和地接待他们”或译“和善地对待他们”；希腊语直译为“温和的相遇（或迎接）”。
    reason: 保留ἥμερον ἀπάντησιν在“接待、相遇”与较宽泛的“对待”之间的词义空间。
lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: 作证说
  rationale: 该词为不定过去时分词，在句中引出当地犹太人所证实的内容；“作证说”兼顾见证、陈述之意，也能自然衔接后文。
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: 住在那里的犹太人
  rationale: καθεστώτων在此指已在当地定居、居住的人；此译法符合现代汉语表达，又保留当地居民的含义。
- source_word: οἱ Σκυθοπολεῖται
  choice: 斯基托波利斯人
  rationale: 这是指斯基托波利斯居民的族称；采用地名加“人”，明确简洁。
- source_word: εὔνοιαν
  choice: 心存善意
  rationale: εὔνοια表示友好、善意的态度；“心存善意”准确呈现其内在倾向，并与“对他们”自然搭配。
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: 在他们遭遇不幸时
  rationale: ἀτυχία指不幸、逆境；补出语境中承受不幸的是当地犹太人，使中文清楚，但不夸大为灾难。
- source_word: ἥμερον ἀπάντησιν
  choice: 温和地接待他们
  rationale: ἥμερος意为温和、和善，ἀπάντησις字面为相遇、迎接；这里描述对待或接待方式，此译既保留接迎意象，也符合上下文。
