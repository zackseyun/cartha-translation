base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: zh_hans
  text: 犹大的队伍最先出现[a]时，敌人便心生惊惧；那鉴察万有者的显现也使他们恐惧。于是他们仓皇逃窜，各自向不同的方向奔去，以致常被自己人所伤，又被自己人的剑尖刺穿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大的队伍最先显现”。原文在本节后半提到“那鉴察万有者的显现”时，重复使用了同一词根。
    reason: 说明原文刻意重复“出现／显现”的词根呼应，并提供较形式对应的译法。
lexical_decisions:
- source_word: ἐπιφανείσης / ἐπιφανίας
  choice: 一出现 / 显现
  rationale: 两处保留同一词根所形成的呼应：前者指犹大军队突然出现，后者指那鉴察万有者的显现。中文分别采用自然的动词性和名词性表达。
- source_word: σπείρης
  choice: 军队
  rationale: 这里指军事队伍，但原文未必限定为罗马军制中的特定编制；“军队”清楚自然，也避免过度具体化。
- source_word: δέους / φόβου
  choice: 惊恐万状 / 惧怕
  rationale: 以两个不同表达对应原文两个近义恐惧词，既避免机械重复，也保留恐惧加剧的语势。
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: 那鉴察万有者
  rationale: ἐφοράω兼有观看、察看和监管之意；“鉴察万有者”保留神无所不察的含义，同时不过度明说其行动方式。
- source_word: εἰς φυγὴν ὥρμησαν
  choice: 仓皇逃窜
  rationale: 兼顾ὥρμησαν所表达的猛然冲动和φυγή的逃跑意义，以自然中文呈现惊慌奔逃的画面。
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: 各自奔向不同的方向
  rationale: 表达众人被混乱裹挟、四散而去的分配性结构；中文不硬译被动形式，以保持流畅。
- source_word: βλάπτεσθαι
  choice: 被自己人所伤
  rationale: βλάπτω本义较宽泛，“所伤”符合战斗语境，但不把伤害程度说得比原文更具体。
- source_word: ἀναπείρεσθαι ταῖς τῶν ξιφῶν ἀκμαῖς
  choice: 被彼此的剑尖刺穿
  rationale: ἀναπείρω表示刺透，ἀκμή在此为剑的尖端；“剑尖刺穿”准确而形象。“彼此的”承接原文“自己人”的互相误伤语境。
theological_decisions:
- issue: 神的称谓 τοῦ τὰ πάντα ἐφορῶντος
  choice: 那鉴察万有者
  alternative: 那看顾万有者／那看见万有者
  rationale: “鉴察”首先保留普遍观察、洞见的语义，并可含监管意味；“看顾”较容易预先强化护理含义，“看见”则可能削弱庄重语体。
- issue: 第二个 ἐπιφανίας 是否直接表明神亲自可见地出现
  choice: 保留为“显现”，不解释显现的具体形式
  alternative: 那鉴察万有者使他们惧怕／那鉴察万有者彰显威能
  rationale: 原文重复显现词汇，并把恐惧归于这显现；译文保留其神学张力，不把它化约为内在恐惧或特定神迹。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“惊恐万状”“仓皇逃窜”呈现原文强烈而迅疾的战场混乱；“鉴察万有者”保持经文称谓的凝练和庄严。脚注标记[a]已置于正文对应位置。
