  yaml_path: translation/deuterocanon/2_maccabees/012/002.yaml
  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: zh_hans
  text: 可是，各地的将领中，提摩太、革奈乌的儿子亚波罗尼，还有耶罗尼摩和德摩丰，以及塞浦路斯长官[a]尼加挪，都不肯让他们安宁度日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“塞浦路斯长官”（Κυπριάρχης）是尼加挪的称号，可指塞浦路斯的统治者或与塞浦路斯有关的官长；具体职衔不详。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: 各地的将领中
  rationale: κατὰ τόπον 表明这些 στρατηγοί 分属不同地方；译作“各地的将领”既保留地域分派之意，也不把其正式官阶规定得过细。句首属格结构在汉语中自然处理为“……中”。
- source_word: ὁ τοῦ Γενναίου
  choice: 革奈乌的儿子
  rationale: 定冠词加属格构成父名标识，明确说明亚波罗尼是革奈乌之子。
- source_word: ἔτι δὲ
  choice: 还有
  rationale: 此连接语继续增列人名；“还有”简洁自然地表达其追加作用。
- source_word: πρὸς δὲ τούτοις
  choice: 以及
  rationale: 该短语把尼加挪加在此前所列诸人之后；“以及”符合现代汉语列举习惯。
- source_word: ὁ Κυπριάρχης
  choice: 塞浦路斯长官
  rationale: Κυπριάρχης 是与塞浦路斯有关的统治者或官长称号。“塞浦路斯长官”传达其政治职衔，同时以脚注保留称号具体所指的不确定性。
- source_word: οὐκ εἴων
  choice: 都不肯让
  rationale: ἐάω 的未完成过去时表示持续的阻挠或不许可；“不肯让”兼顾拒绝意味，列举的多位主语则用“都”使汉语关系清楚。
- source_word: ἡσυχίαν ἄγειν
  choice: 安宁度日
  rationale: 该习语指过安静、平稳的生活；“安宁度日”自然庄重，也切合受地方将领骚扰的语境。
