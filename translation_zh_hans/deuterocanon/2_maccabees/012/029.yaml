lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: 拔营
  rationale: 该分词在行军语境中指收起营帐、离开驻地；“拔营”简洁而准确地保留了这一军事旅行色彩。
- source_word: ὥρμησαν
  choice: 进发
  rationale: 此处表示有目的地动身前往某地，并非冲锋攻击；“进发”既自然，也保留行动的方向性。
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: 向“斯基泰人的城”
  rationale: 原文使用描述性表达“斯基泰人的城”，而非明确写出专名“斯基托波利斯”；正文保留这种措辞及其可能的含混，并用“向”表达目的地方向。
- source_word: ἀπέχουσαν
  choice: 那城离……
  rationale: 该分词说明城与耶路撒冷之间的距离；转换为独立分句符合现代汉语表达。
- source_word: σταδίους ἑξακοσίους
  choice: 六百斯塔迪昂
  rationale: 保留古代长度单位，以免用现代里程换算引入并非原文所有的精确度；采用音译并可由注释说明。
