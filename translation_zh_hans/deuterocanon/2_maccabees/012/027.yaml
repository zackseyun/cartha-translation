base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: zh_hans
  text: 这些人溃败覆灭以后，他又进军攻打厄弗龙——一座坚固的城。城内有各族的许多人[a]；强壮的青年驻守在城墙前，奋力抵抗。城中还存有大量战争器械和投射物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里有各种各样的人。”希腊文可指由各族或各类人群构成的混合人口。
    reason: lexical_alternative
  - marker: b
    text: 或译：“城中还有许多成批存放的战争器械和投射物。”译作“储备／存有”的希腊词也可侧重这些军用物资的集中摆放或积存。
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή
  choice: 溃败
  rationale: 在军事语境中指败退、被击溃；“溃败”既体现军阵崩溃，也比泛称“失败”更有力度。
- source_word: ἀπώλεια
  choice: 覆灭
  rationale: 与“溃败”并列，表示遭受严重毁灭；“覆灭”保留其强烈程度。
- source_word: ἐπεστράτευσεν
  choice: 进军攻打
  rationale: 该动词表示出兵征讨；“进军攻打”自然地兼顾军事行动与攻击对象。
- source_word: πόλιν ὀχυράν
  choice: 一座坚固的城
  rationale: ὀχυράν 强调城的防御坚固；此译简洁自然，不额外说明具体工事。
- source_word: πάμφυλα πλήθη
  choice: 来自各族的许多人
  rationale: πάμφυλα 含“各族、各种族群”之意，πλήθη 指众多的人；此译保留人口构成混杂的含义。
- source_word: νεανίαι ... ῥωμαλέοι
  choice: 强壮的青年
  rationale: 分别传达“青年男子”和体格强健；上下文已明确是军事抵抗者，无须另加“战士”。
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: 驻守在城墙前
  rationale: καθεστῶτες 在这里不只是站立，而有被部署、据守位置之意；“城墙前”保留 πρὸ 的空间表达。
- source_word: εὐρώστως ἀπεμάχοντο
  choice: 奋力抵抗
  rationale: ἀπεμάχοντο 表示持续作战抵抗，εὐρώστως 表示有力、勇猛；“奋力抵抗”符合未完成体所呈现的持续行动。
- source_word: ὀργάνων
  choice: 战争器械
  rationale: 与投射物并列的军事语境表明这是作战用器械；不限定为“攻城器械”，以免过度解释。
- source_word: βελῶν
  choice: 投射物
  rationale: 该词可泛指射出或掷出的武器，“投射物”比“箭”或“标枪”更能保留其宽泛性。
- source_word: παραθέσεις
  choice: 储备
  rationale: 此处与大量战争器械和投射物连用，最可能指成批存放的军用物资；“储备”同时保留名词所含的积存意味。
