base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/018.yaml
  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: zh_hans
  text: 可是，他们没有在那些地方追上提摩太[a]，因为他当时一事无成，已经从那些地方撤走了；不过，他在某处留下了一支守军，而且是一支特别强大的守军[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“擒住提摩太。”这里的希腊语动词可以表示追上、捉住或擒获。
    reason: lexical_alternative
  - marker: b
    text: “特别强大的”在语法上最直接形容守军；也可能连带暗示守军所在之处防守严密、设防坚固。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: 追上
  rationale: 在军事追击的语境中，此词可指赶上、捉住或擒获；“追上”自然地保留他们未能赶上提摩太的叙事含义，同时不把结果限定为实际擒获。
- source_word: ἐπὶ τῶν τόπων
  choice: 在那些地方
  rationale: 保留原文复数地点表达，并承接上文所提到的地点，不笼统改写为“该地区”。
- source_word: ἄπρακτον
  choice: 一事无成
  rationale: 表达未有成果、未能成事的状态，符合原词在此处的副词性作用。
- source_word: ἐκ τῶν τόπων ἐκλελυκότα
  choice: 已经从那里撤走了
  rationale: 在军事叙事中译作“撤走”贴合语境；中文以“那里”避免生硬重复“那些地方”，而不改变所指。
- source_word: καταλελοιπότα
  choice: 留下了
  rationale: 准确表达提摩太本人撤走，却将守军留在后方的对比。
- source_word: φρουράν
  choice: 一支守军
  rationale: 此处指留守某地的武装部队；“守军”比“卫兵”或“哨所”更符合军事叙事。
- source_word: ἐν τινι τόπῳ
  choice: 在某处
  rationale: 保留地点的不确定性，且符合现代汉语习惯。
- source_word: μάλιστα ὀχυράν
  choice: 极其坚固
  rationale: ὀχυράν在语法上直接修饰阴性单数的φρουράν；“坚固”可形容防守力量或其设防状态，并保留与驻地防御强度相互重叠的含义。
