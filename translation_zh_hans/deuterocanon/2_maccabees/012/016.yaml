  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: zh_hans
  text: 他们照着上帝的旨意攻占了那城，进行了数不清的杀戮，以致旁边那宽达两个斯塔迪昂[a]的湖看起来仿佛满是血，血水奔流[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯塔迪昂”是古代长度单位；两个斯塔迪昂约合370米。
    reason: cultural_note
  - marker: b
    text: 或译：“看起来仿佛充满了血。”希腊文的画面十分鲜明，既写湖被血充满，也含有血流淌或奔流的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: 攻占了
  rationale: 该词在军事语境中指夺取、占领城邑；“攻占”自然地表达了动作已经完成，也符合分词所交代的先行动作。
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: 照着上帝的旨意
  rationale: 与格短语既可表示凭借，也可表示依照；此译保留城被攻占与上帝旨意之间的明确联系，却不进一步解释为对随后杀戮的认可。
- source_word: ἀμυθήτους σφαγάς
  choice: 数不清的杀戮
  rationale: ἀμύθητος表示多得无法计数或述说，σφαγή指杀戮；此译保留原文夸张而强烈的表达，不以更具现代法律或道德定性的词取代。
- source_word: παρακειμένην λίμνην
  choice: 旁边的湖
  rationale: παράκειμαι表示位于近旁；“旁边的湖”简洁自然，并保留湖与城或杀戮现场相邻的空间关系。
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: 宽达两个斯塔迪昂
  rationale: 原文明确说明湖的宽度。保留古代单位并加注换算，避免在正文中用现代单位取代历史表述。
- source_word: καταρρεῖν τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: 充满了血，看起来仿佛血水奔流
  rationale: 该结构把“显得、看起来”、湖被血充满以及流动的鲜明景象结合在一起。此译保留各要素及其视觉张力，同时用“仿佛”表明这是所见景象，而非平直的客观断言。
theological_decisions:
- issue: 攻占城邑与上帝旨意的关系
  choice: 照着上帝的旨意攻占了那城
  alternative: 靠着上帝的旨意攻占了那城
  rationale: 原文明确把攻占城邑与上帝的旨意相连。“照着”可表达依照或符合，保留与格短语的弹性；译文不把这一短语扩展为上帝对随后一切杀戮的明示赞同，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“攻占”“杀戮”保持军事场景的力度；保留“斯塔迪昂”并用脚注解释。句末调整希腊文复杂结构的语序，使中文自然，同时不消除“充满”与“奔流”并置所形成的夸张视觉效果。
