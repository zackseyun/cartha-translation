revisions:
- from: 他们照着上帝的旨意攻占了那城，展开了数不清的杀戮，以致旁边那宽达两个斯塔迪昂[a]的湖，充满了血，看起来仿佛血水奔流[b]。
  to: 他们照着上帝的旨意攻占了那城，进行了数不清的杀戮，以致旁边那宽达两个斯塔迪昂[a]的湖看起来仿佛满是血，血水奔流[b]。
  rationale: 修订将“看起来仿佛”置于湖的血色与奔流意象之前，以较好保留φαίνεσθαι对整幅视觉画面的限定，避免把“湖充满了血”表述为脱离该观感动词的独立断言。“进行了数不清的杀戮”仅改善中文搭配，仍保留原文的夸张强度与叙事力度。脚注标记及内容均予保留。
