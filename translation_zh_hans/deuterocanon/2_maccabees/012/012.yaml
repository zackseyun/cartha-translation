  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: zh_hans
  text: 犹大认为，他们确实在许多方面都有用处，就同意与他们和平相处。双方握右手[a]后，便各自回到帐篷去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“领受右手”或“右手相握”；这是当时表示承诺或达成协议的惯常动作。
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: 认为
  rationale: 此处分词表达犹大经过考量后作出的判断；“认为”自然明确，又不把语气强化为完全确定的“认清”。
- source_word: ὡς ἀληθῶς
  choice: 确实
  rationale: 保留原文对判断真实性的强调，符合现代汉语表达。
- source_word: ἐν πολλοῖς
  choice: 在许多方面
  rationale: 原短语范围宽泛，表示在多种事情或层面上，而非某个特定用途。
- source_word: χρησίμους
  choice: 有用处
  rationale: 忠实表达实际利益或功用，不额外推断其具体政治或军事价值。
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: 同意与他们和平相处
  rationale: ὑπεχώρησεν在语境中表示让步或同意，εἰρήνην ἄξειν表示维持和平关系；译文兼顾原义与自然汉语。
- source_word: λαβόντες δεξιάς
  choice: 双方握过右手
  rationale: 保留“右手”这一具体动作，同时用现代汉语可理解的方式表达双方以此确认协议。
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: 便各自回到帐篷去了
  rationale: ἐχωρίσθησαν表示彼此分开，εἰς τὰς σκηνάς指回到帐篷；“各自”自然传达分开返回之意，并保留行军驻营的场景。
theological_decisions:
- issue: λαβόντες δεξιάς所指的外交性动作
  choice: 正文保留“右手”的具体形象，并译作“双方握过右手”
  alternative: 意译为“订立盟约”或“互相作了保证”
  rationale: 原文明确提到右手，却未限定协议的具体法律性质。保留动作可避免把它过度解释成正式盟约，同时脚注说明其文化功能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各自回到帐篷去了”比生硬的“分开到帐篷”更自然；代词仍保持原文的宽泛性，不具体补出他们在哪些方面有用。
