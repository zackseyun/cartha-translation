  yaml_path: translation/deuterocanon/2_maccabees/012/038.yaml
  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
translation:
  language: zh_hans
  text: 犹大带着军队来到亚杜兰城。一周将尽时[a]，他们按照惯例在那里洁净了自己，并在那里度过了安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“当这一周临近时。”此语的确切时间指向并不完全明确；下文提到安息日，显示这里所指的是安息日将近。
    reason: 较清楚地反映τῆς ἑβδομάδος ἐπιβαλλούσης的字面表达，并保留其时间指向的语义张力。
lexical_decisions:
- source_word: ἀναλαβὼν τὸ στράτευμα
  choice: 带着军队
  rationale: 分词ἀναλαβών在这里表示犹大带领军队继续行动；“带着军队”既保留随同、率领之意，也符合现代汉语叙事习惯。στράτευμα明确指军事队伍，译作“军队”。
- source_word: ἧκεν
  choice: 来到
  rationale: 该动词表示抵达某地；“来到”自然呈现叙事中的行进和到达。
- source_word: Ὀδολλὰμ πόλιν
  choice: 亚杜兰城
  rationale: 保留πόλις“城”的明示信息；地名采用现代中文圣经传统中通行的“亚杜兰”。
- source_word: τῆς ἑβδομάδος ἐπιβαλλούσης
  choice: 一周将尽时
  rationale: 该属格独立结构字面上可表达“一周临到/推进时”；紧接着提到安息日，表明所指是一周临近第七日。正文采用自然的时间表达，脚注保留字面歧义。
- source_word: κατὰ τὸν ἐθισμόν
  choice: 按照惯例
  rationale: ἐθισμός指惯常的做法或习惯；“按照惯例”简明、庄重，且不添加具体礼仪细节。
- source_word: ἁγνισθέντες
  choice: 洁净了自己
  rationale: 该被动分词在此语境中具有礼仪洁净色彩；汉语用反身表达较自然，同时避免把它弱化为一般卫生清洗。
- source_word: τὸ σάββατον διῆγεν
  choice: 度过了安息日
  rationale: διάγω表示度过一段时间；“度过了安息日”忠实而自然，不把动词本身扩展成更强的礼仪性陈述。
theological_decisions:
- issue: 安息日前的礼仪洁净用语
  choice: 他们按照惯例在那里洁净了自己
  alternative: 他们按照惯例在那里清洗了自己
  rationale: ἁγνισθέντες带有礼仪洁净意味，因此保留“洁净”，而不采用可能被理解为普通洗濯的“清洗”；同时不补入原文未说明的具体仪式。
- issue: 一周与安息日之间的时间关系
  choice: 一周将尽时
  alternative: 第七日临近时
  rationale: 上下文支持安息日临近，但希腊文直接说的是ἑβδομάς“一周”，不是明确的“第七日”。正文保留“一周”，并以脚注交代字面形式和语境，以免过度消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“亚杜兰”为通行地名译法；“洁净自己”保留犹太礼仪语境，但不添加原文未明说的仪式内容。脚注标记紧随其所解释的时间短语。
