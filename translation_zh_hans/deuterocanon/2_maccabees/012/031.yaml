  yaml_path: translation/deuterocanon/2_maccabees/012/031.yaml
  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: zh_hans
  text: 他们表示感谢，并预先劝勉那些人今后仍要对犹太民族保持善意。随后，他们来到耶路撒冷；那时七七节[a]已经临近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七周节”；传统称“五旬节”。
    reason: 说明原文描述性节期名称的较直译形式及传统称呼。
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: 表示感谢
  rationale: 不补出希腊文未明说的感谢对象，并以自然的现代汉语表达先于主句发生的动作。
- source_word: προπαρακαλέσαντες
  choice: 预先劝勉
  rationale: 既保留 παρακαλέω 的劝勉含义，也体现前缀 προ- 所含的事先、临别前之意。
- source_word: εἰς τὰ λοιπά
  choice: 今后也
  rationale: 该惯用语指向未来；“今后”准确而自然，“也”对应原文 καὶ。
- source_word: πρὸς τὸ γένος
  choice: 善待犹太民族
  rationale: γένος 在上下文中指犹太人这一民族共同体；明确译出“犹太”可避免中文代词或“本族”产生所指混乱。
- source_word: εὐμενεῖς εἶναι
  choice: 要善待
  rationale: 以通顺汉语表达“持友善、有利的态度”，不将其强化为具体政治或盟约义务。
- source_word: παρεγενήθησαν
  choice: 来到
  rationale: 符合叙事语境中抵达某地的常用含义。
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: 七七节
  rationale: 采用现代中文中对犹太“周数之节”的通行名称，保留节期本身的旧约背景。
- source_word: οὔσης ὑπογύου
  choice: 已经临近
  rationale: 将属格独立结构译为时间背景；ὑπόγυος 表示近在眼前、即将到来。
theological_decisions:
- issue: τῆς τῶν ἑβδομάδων ἑορτῆς 的节期名称
  choice: 七七节
  alternative: 五旬节
  rationale: 原文使用“周数之节”这一描述性名称，而非直接使用 Πεντηκοστή；正文据原文译作“七七节”，传统名称置于脚注。
- issue: πρὸς τὸ γένος 的所指
  choice: 犹太民族
  alternative: 本族同胞／这个民族
  rationale: 上下文所指是犹太民族。中文若直译为“本族”或使用代词，容易误指受劝勉者所属的群体，因此明确所指，但不附加任何宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以两个分句和分号理清连续动作及节期临近的背景；不补出原文没有明说的感谢对象。脚注标记紧随实际注释对象“七七节”。
