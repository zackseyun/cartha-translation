  text: He also advanced against a certain city of bridges[a], strongly fortified and enclosed with walls, inhabited by mixed peoples; its name was Caspin.
translation:
  language: zh_hans
  text: 他又进军攻打一座有桥梁的城[a]；这城城防坚固，四周有城墙环绕，由各族人混居，城名叫卡斯平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“桥梁之城”。希腊语原文表达简略，可能是说这城以桥梁或桥道设施著称，并不一定是正式称号。
    reason: 保留γεφυρῶν这一压缩属格结构的词义歧义。
lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: 进军攻打
  rationale: 该动词在此军事语境中表示向某处进逼或发动攻击；“进军攻打”兼顾行动方向与敌对意图，又不预断后文具体的攻城方式。
- source_word: ἐπί τινα πόλιν
  choice: 一座……城
  rationale: τινα是不定指，引出此前未具体说明的一座城；现代汉语用“一座”已自然表达这一点，无须生硬译作“某一座”。
- source_word: γεφυρῶν
  choice: 有桥梁的
  rationale: 属格短语高度压缩，可能指该城以桥梁或桥道设施为特色；正文采用自然的描述性表达，并以脚注保留“桥梁之城”的可能译法。
- source_word: ὀχυρὰν
  choice: 防守坚固
  rationale: 此处形容城的防御力量，不只是一般意义上的坚固；“防守坚固”明确体现军事语境。
- source_word: τείχεσιν περιτεφραγμένην
  choice: 四周有城墙环绕
  rationale: 分词与工具格表达该城被城墙围住；此译保留环绕意象，并符合现代汉语。
- source_word: παμμιγέσιν ἔθνεσιν
  choice: 居民来自各族
  rationale: παμμιγής强调混合，ἔθνη为复数，指不同族群；“来自各族”自然表达多族杂居，避免将古代族群概念机械现代化为民族国家。
- source_word: κατοικουμένην
  choice: 居民
  rationale: 希腊文为“由……居住”的被动分词；汉语改用名词性表达，使整句流畅而不损失意义。
- source_word: ὄνομα δὲ Κασπείν
  choice: 城名叫加斯平
  rationale: 保留希腊文明确的命名句式；“加斯平”按Κασπείν作汉语音译。
