base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: zh_hans
  text: 可是，提摩太本人落入多西提和索西帕特一行人之手；他用尽诡诈手段[a]，恳求他们放他安然离去，因为许多人的父母和另一些人的兄弟都在他手里，以致这些亲属会被弃之不顾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以许多奸巧”或“用尽诡诈手段”。这里的希腊词 γοητία 很可能指奸巧、欺骗性的求情方式，并非字面意义上的巫术。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在这里十分简略。提摩太的意思似乎是：许多人的父母和另一些人的兄弟都在他控制之下；若不顾及他的请求，这些亲属就会不被顾惜。原文没有明说他们会遭受何种具体对待。
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν
  choice: 落到……手中
  rationale: 该分词本义为“落入、撞上”，在此语境中表示提摩太落入对方控制；现代汉语用“落到……手中”自然传达被擒的含义。
- source_word: τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: 多西提和索西帕特一行人
  rationale: οἱ περὶ加人名通常指该人物及其随从或同伴；“一行人”简洁保留群体含义。
- source_word: ἠξίου
  choice: 哀求
  rationale: 该动词可指请求或恳求；俘虏求对方释放的处境带有迫切意味，“哀求”符合上下文。
- source_word: μετὰ πολλῆς γοητίας
  choice: 极其狡猾地
  rationale: γοητία可指欺骗手段、诡诈或蛊惑；这里描述以奸巧手段求情，并非明确指施行巫术。
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: 放他安然离去
  rationale: ἐξαφεῖναι表示释放，σῷον强调安全、完好；合译为“放他安然离去”既自然又保留不受伤害的意思。
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: 因为许多人的父母和另一些人的兄弟都在他手里
  rationale: ἔχειν在此不只是“有”，而是掌握或控制；“在他手里”保留原文未明说其为人质或俘虏的含蓄表达。
- source_word: ἀλογηθῆναι
  choice: 被弃之不顾
  rationale: 该词表示不予理会、视若无物；此译传达那些亲属将不再被顾惜，却不额外断定他们具体会遭受什么。
- source_word: συμβήσεται
  choice: 就会
  rationale: 未来式表示提摩太所声称的后果；汉语条件结构中的“就会”比直译“将会发生”更自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“落到……手中”“在他手里”使隐含的控制关系清楚可懂，同时没有把亲属明确增译为“人质”。分号保留提摩太求情理由与威胁性后果之间的紧密联系。
