base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: zh_hans
  text: 城里的人仗着城墙坚固，又有粮食储备，就越发狂妄无礼地对待犹大和跟随他的人，辱骂他们，甚至说亵渎的话[a]，讲出不该说的话。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亵渎”或译“毁谤”。原词既可指冒犯神圣的言语，也可泛指恶言诋毁。
    reason: 保留βλασφημοῦντες在宗教性亵渎与一般毁谤之间的词义幅度。
  - marker: b
    text: “不该说的话”也可译作“不准说的话”；原文带有道德或宗教上不合许可的意味。
    reason: 说明θέμις并非仅指成文法律，同时保留其规范性和宗教色彩。
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: 城里的人
  rationale: 这是直接的空间表达，指城防工事以内的人；译文不额外限定其身份。
- source_word: πεποιθότες
  choice: 仗着
  rationale: 完成时分词表达已经形成并持续的倚仗；结合后文的狂妄态度，“仗着”比中性的“信赖”更符合语境。
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: 城墙坚固
  rationale: ἐρυμνότης指坚固、易守的性质；此译自然地传达军事防御意味。
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: 又有粮食储备
  rationale: βρώματα在围城语境中指粮食、给养，παράθεσις在此指备置或供应；“粮食储备”清楚自然。
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: 越发狂妄无礼地对待
  rationale: 保留比较级的增强意味，并表达其傲慢、蛮横的态度。
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: 犹大和跟随他的人
  rationale: 这是表示某人及其同伴或部属的希腊语惯用语；此处按军事语境自然表达。
- source_word: λοιδοροῦντες
  choice: 辱骂他们
  rationale: 表达直接的言语侮辱，并保留与后续“亵渎”的层层加重。
- source_word: βλασφημοῦντες
  choice: 说亵渎的话
  rationale: 保留该词可能具有的宗教性和冒犯神圣的力度，同时通过脚注说明其较宽泛的词义。
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: 讲出不该说的话
  rationale: θέμις涉及合宜、获准或受认可之事，常带道德或宗教意味；正文采用现代汉语自然说法，脚注保留其语义分量。
theological_decisions:
- issue: βλασφημοῦντες是特指亵渎神圣，还是泛指恶言毁谤
  choice: 正文译作“说亵渎的话”
  alternative: 译作“毁谤”或“恶言诋毁”
  rationale: 它位于“辱骂”之后，并由“甚至”引出，语势有所升级；采用“亵渎”可保留潜在的宗教意味，但脚注说明原词也能泛指恶言毁谤，避免把未明说的对象确定为神。
- issue: ἃ μὴ θέμις的规范性质
  choice: 译作“不该说的话”
  alternative: 译作“不合法说的话”或“禁止说的话”
  rationale: θέμις不必专指成文法律，也可表示道德或宗教上不合宜、不获许可；正文不把它窄化为法律禁令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“仗着”“越发狂妄无礼”自然传达围城者因防御和粮储而生的倨傲；后半句保留“辱骂—亵渎—说不该说的话”的递进结构。
