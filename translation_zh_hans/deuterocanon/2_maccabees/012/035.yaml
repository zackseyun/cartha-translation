  yaml_path: translation/deuterocanon/2_maccabees/012/035.yaml
  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: zh_hans
  text: 巴基诺的部下中，有一个名叫多西提乌的人，是个强壮的骑兵。他抓住了高尔吉亚，又揪住他的斗篷，用力拖着他，想要活捉这受咒诅的人。这时，一个色雷斯骑兵冲向多西提乌，砍下了他的肩膀[a]，高尔吉亚便逃到了马里萨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “砍下了他的肩膀”也可译作“重创了他的肩部”或“使他的肩膀失去活动能力”。希腊原文表示肩部遭受严重一击，但确切的解剖伤势并不明确。
    reason: 保留τὸν ὦμον καθελόντος所表达的严重伤害，以及其确切解剖结果的不确定性。
lexical_decisions:
- source_word: Δωσίθεος
  choice: 多西提乌
  rationale: 按希腊语人名音译，采用适合现代汉语的形式。
- source_word: τῶν τοῦ Βακινόρος
  choice: 巴基诺的部下中
  rationale: 表达此人属于巴基诺一方，同时不把其具体身份过度限定为某种军衔。
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  choice: 是个强壮的骑兵
  rationale: ἔφιππος表示骑马或乘马作战的人，καρτερός在此突出其强健有力；合译自然简洁。
- source_word: εἶχεν τοῦ Γοργίου
  choice: 他抓住了高尔吉亚
  rationale: 这里表示已经实际控制或抓住对方，并非普通的“拥有”。
- source_word: λαβόμενος τῆς χλαμύδος
  choice: 又揪住他的斗篷
  rationale: χλαμύς指斗篷，常带军用色彩；“揪住”贴合搏斗中抓扯衣物的动作。
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: 用力拖着他
  rationale: 结合抓住斗篷的语境，ἄγω在这里是强行拉走；εὐρώστως强调有力地。
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: 想要活捉这个可诅咒的人
  rationale: ζωγρείαν明确表达生擒；κατάρατον保留叙事中的强烈敌意，不将其弱化。
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: 一个色雷斯骑兵
  rationale: 自然表达此人是色雷斯骑兵群体中的一员。
- source_word: ἐπενεχθέντος αὐτῷ
  choice: 冲向他
  rationale: 表现突然发动攻击的动作，汉语简洁清楚。
- source_word: τὸν ὦμον καθελόντος
  choice: 砍断了他的肩部
  rationale: καθαιρέω在战斗语境中表示猛烈砍下或毁伤；原文所指的确切解剖结果不完全清楚，因此正文采用直观译法，并以脚注保留歧义。
- source_word: Μαρισά
  choice: 马里萨
  rationale: 按希腊语地名音译。
