lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出战
  rationale: 该词本义为“出去、出来”；在此军事叙事中，主语率领步兵和骑兵而出，译作“出战”自然简洁，同时不过度增添行军方式等细节。
- source_word: μετὰ
  choice: 率领
  rationale: 介词本身表示伴随，即“同……一起”；结合主语与所列军队的关系，汉语用“率领”更自然，也清楚表达这些兵员随他出动。
- source_word: πεζῶν
  choice: 步兵
  rationale: πεζός在与骑兵相对的军事语境中指徒步作战的士兵；“步兵”是现代汉语准确而通行的对应词。
- source_word: τρισχιλίων
  choice: 三千名
  rationale: 直接表达基数，并用量词“名”连接所指人员。
- source_word: ἱππέων
  choice: 骑兵
  rationale: ἱππεύς指骑马作战者；“骑兵”符合现代汉语军事用语，并与“步兵”形成清楚对应。
- source_word: τετρακοσίων
  choice: 四百名
  rationale: 直接表达基数；“名”承接“骑兵”，使人数关系明确。
