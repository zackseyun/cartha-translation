  text: And making a night attack on the people of Jamnia[a], he set the harbor and the fleet on fire, so that the rays of the light were visible as far as Jerusalem[b], it being two hundred forty stadia away.
translation:
  language: zh_hans
  text: 他夜间袭击雅姆尼亚人，放火烧了港口和舰队；火光远在耶路撒冷也能看见[a]，两地相距二百四十斯塔迪昂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“光的光芒”；这里指焚烧港口和舰队所发出的火光。
    reason: lexical_alternative
  - marker: b
    text: “斯塔迪昂”是古代长度单位；二百四十斯塔迪昂约合43—45公里。
    reason: cultural_note
lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: 雅姆尼亚人
  rationale: 指雅姆尼亚当地居民；采用地名加“人”的自然现代汉语表达。
- source_word: νυκτὸς ἐπιβαλὼν
  choice: 夜间袭击
  rationale: 兼顾νυκτός的时间含义和ἐπιβάλλω在此处突然进攻的军事语义。
- source_word: ἐνέπρησεν
  choice: 放火烧了
  rationale: 明确表达使港口和舰队起火燃烧，而非仅陈述遭焚后的结果。
- source_word: τὸν λιμένα σὺν τῷ στόλῳ
  choice: 港口和舰队
  rationale: στόλος在本语境中指成队的船只，即舰队；σύν表示二者一并被焚。
- source_word: ὥστε ἐπιφαίνεσθαι
  choice: 也能看见
  rationale: 该结构表示结果，即火光可见范围一直达到耶路撒冷。
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: 火光的光芒
  rationale: 保留原文“光的光芒”这一强化式表达，同时依燃烧语境用“火光”自然点明光源。
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: 远在耶路撒冷
  rationale: εἰς在可见范围的语境中表示光芒所及之处；此译自然表达“直到耶路撒冷也可见”。
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: 两地相距二百四十斯塔迪昂
  rationale: 属格独立结构补充说明雅姆尼亚与耶路撒冷之间的距离；不额外加入原文未明示的让步关系。
