  text: And when they had joined battle[b][a], it happened that a few of the Jews fell.
translation:
  language: zh_hans
  text: 列阵交战时[a]，犹太人中有少数人倒下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列成战阵时。”希腊语分词是军事用语，既可强调列阵，也可包含投入交战之意。
    reason: lexical_alternative
  - marker: b
    text: “倒下”在战斗语境中很可能指阵亡，但希腊原文没有明确说“被杀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραταξαμένους
  choice: 双方列阵交战时
  rationale: 该词是 παρατάσσω 的不定过去时中动分词，在军事语境中可指列成战阵，也可涵盖投入交战。译作“列阵交战”兼顾阵势与交锋之意；按汉语叙事习惯处理为时间从句。希腊文只明示相关一方为犹太人，汉语中的“双方”是由交战语境自然带出的关系，不另行指定敌方。
- source_word: συνέβη
  choice: （由句式“有……倒下了”表达）
  rationale: 原文为非人称结构，意为事情发生、结果出现。现代汉语无需硬译“事情发生了”，以存现句自然表达同一叙事功能。
- source_word: πεσεῖν
  choice: 倒下了
  rationale: πίπτω 本义为“倒下”。战斗语境中很可能指阵亡，但原文没有明确使用“被杀”一类词，因此保留这一含蓄程度，并加注说明。
- source_word: ὀλίγους
  choice: 有几个人
  rationale: 该形容词在此作名词性用法，表示人数很少；“几个人”是自然、准确的现代汉语表达。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人中
  rationale: 部分属格与 ὀλίγους 连用，表示犹太群体中的少数人。“犹太人中”比直译“犹太人的几个人”更符合汉语。
theological_decisions:
- issue: “倒下”是否明确等同于“阵亡”
  choice: 正文保留“倒下了”
  alternative: 译作“阵亡了”或“被杀了”
  rationale: 战斗语境支持死亡含义，但希腊词 πεσεῖν 本身没有明确说“被杀”。为避免把语境推断提升为明说，正文保留原文的含蓄，并用脚注交代可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“列阵交战”保留军事色彩，以“倒下”维持原文对死亡含义的含蓄表达；脚注标记均置于对应正文词句之后。
