base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/020.yaml
  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
translation:
  language: zh_hans
  text: 但马加比先把随从他的军队按队编排，把他们部署在敌军各队的对面；他们就向提摩太冲去。提摩太身边有十二万步兵、两千骑兵，此外还有七千人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“十二个万的步兵”，即十二万步兵。末句“此外还有七千”没有说明这七千人的兵种。
    reason: 说明原文的计数方式，并保留末句所指兵种不明的含混性。
lexical_decisions:
- source_word: διατάξας τὴν περὶ αὐτὸν στρατιὰν σπειρηδόν
  choice: 把跟随他的军队按队编排
  rationale: 不定过去时分词表示主行动之前的军事部署；“按队编排”自然表达σπειρηδόν所指的分队编组，同时避免把σπεῖρα过度限定为罗马军制中的特定单位。
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: 部署他们与各队对阵
  rationale: 原文表达简略；结合战斗语境，ἐπί表示面向敌方各队列阵。“与各队对阵”保留敌对部署之意，又不擅自补出原文未明说的军制细节。
- source_word: ὥρμησαν
  choice: 冲向
  rationale: 该动词在军事语境中表示迅猛发动攻势；“冲向”既传达突然、有力的行动，也保留其运动方向。
- source_word: μυριάδας δώδεκα πεζῶν
  choice: 十二万步兵
  rationale: μυριάς在此为一万，十二个一万即十二万；直接换算符合现代汉语计数习惯，脚注说明希腊文原有表达。
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: 两千骑兵
  rationale: 准确、简明地表达两千名骑乘作战人员。
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: 此外还有七千人
  rationale: πρός加与格在这里有附加之意；原文省略了“七千”所修饰的兵种，因此正文只译“人”，不擅自认定为步兵或骑兵。
