  source_fidelity: 译文准确呈现了不定过去时分词所表达的先呼求、后行动的关系，并将 τὸν δυνάστην 作为上帝称号处理。‘以审判击溃仇敌的军力’忠实反映 μετὰ κρίτους、συντρίβοντα 和军事语境中的 ὀλκάς；脚注也适当地说明了 κρίτους 的异常词形。‘攻取了那城，使其归服’表达了 ἔλαβον τὴν πόλιν ὑποχείριον 的攻占及置于权下之意。末句的‘城内二万五千人’在紧接‘那城’的语境中准确对应 τῶν ἔνδον，且未无根据地限定其身分。
