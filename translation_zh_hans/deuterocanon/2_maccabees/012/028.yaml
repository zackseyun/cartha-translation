base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: zh_hans
  text: 他们呼求那位掌权者[a]——他以审判击溃仇敌的军力[b]——随后便攻取了那城，使其归服[c]，又击杀了城内二万五千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌权者”也可译作“大能者”或“统治者”；这里是对上帝的称呼。
    reason: lexical_alternative
  - marker: b
    text: “以审判”：希腊传抄文本在这里的词形异常；大意可能是上帝借施行审判击溃仇敌。
    reason: textual_variant
  - marker: c
    text: 或译“攻占了那城”；原文直译近于“把那城置于手下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: 他们呼求……随后
  rationale: 不定过去时中间语态分词表示向上帝呼求，并在攻城行动之前发生；用“随后”自然体现先后关系。
- source_word: τὸν δυνάστην
  choice: 那位掌权者
  rationale: 该词在此用作上帝的称号，兼含能力与统治权；“掌权者”庄重而通俗，不加入原文没有的特定神名。
- source_word: μετὰ κρίτους
  choice: 以审判
  rationale: 传抄文本中的 κρίτους 形式异常；依上下文可理解为上帝借审判行动击溃仇敌。正文保留简洁表达，并以脚注说明文本疑难。
- source_word: συντρίβοντα
  choice: 击溃
  rationale: 现在时分词描述掌权者一贯的作为；“击溃”既表达彻底摧毁，也适合军事语境。
- source_word: τὰς τῶν πολεμίων ὀλκάς
  choice: 仇敌的军力
  rationale: ὀλκάς 在此搭配仇敌并处于军事叙事中，最可能指敌方的力量或军势；“军力”比抽象的“力量”更贴合语境，同时避免按常见义译成船只。
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: 攻取了那城，使其归服
  rationale: 短语兼有夺取城池和置于自己权下之意；这一译法保留攻克与归服两层含义。
- source_word: κατέστρωσαν
  choice: 击杀
  rationale: 军事叙事中指使人倒下、杀死；“击杀”清楚表达此处致命结果。
- source_word: τῶν ἔνδον
  choice: 城内……人
  rationale: 指城内的人；原文没有明确限定男性或区分居民与守军，因此不作增补。
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: 二万五千
  rationale: 该数词组合合计二万五千；直接译出数字最清楚。
theological_decisions:
- issue: 上帝称号 τὸν δυνάστην
  choice: 那位掌权者
  alternative: 大能者；统治者
  rationale: “掌权者”同时体现权能和统治，保留称号的神学力度，却不引入原文未明说的圣约称谓。
- issue: 上帝借 μετὰ κρίτους 击溃仇敌
  choice: 以审判击溃
  alternative: 借审判的作为击溃；按公正的判决击溃
  rationale: 底本文字形式异常，具体所指有不确定性；正文不把它扩展为某一种具体神学解释，脚注交代疑难。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“他们呼求……随后”使希腊分词结构在中文中自然；破折号标出修饰上帝称号的关系从句。保留“审判”一语的文本与语义张力，不擅自具体化。所有脚注标记均已置入正文。
