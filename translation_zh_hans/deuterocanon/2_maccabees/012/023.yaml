  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
translation:
  language: zh_hans
  text: 犹大更加奋力地追击，痛击那些恶徒，消灭了达三万人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传世希腊文本直译为“三个万”，即三万人。此处措辞在上下文中较难协调；不少译本和学者理解其意为“三千人”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: 追击
  rationale: 这是表示进行追赶的希腊语表达；译作“追击”自然简洁，也符合军事叙事语境。
- source_word: εὐτονώτερον
  choice: 更加奋力
  rationale: 比较级副词表示行动的力度或强度增加；“更加奋力”既传达加强追击之意，也符合现代汉语表达。
- source_word: συνετίνων
  choice: 一路击杀
  rationale: 该分词在战斗语境中表示持续猛烈攻击。“一路击杀”保留其伴随追击而连续杀伤的动态，同时不擅自限定所用兵器。
- source_word: τοὺς ἀλιτηρίους
  choice: 那些恶徒
  rationale: 原词带有强烈贬斥和道德谴责意味；“恶徒”通俗而庄重，比偏司法含义的“罪犯”更贴切。
- source_word: διέφθειρεν
  choice: 消灭了
  rationale: διαφθείρω在军事语境中可指毁灭、杀死；“消灭了”保持原词较宽的语义，并与人数宾语自然搭配。
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: 多达三万人
  rationale: 现存希腊文本直译为“三个万”，即三万人。原文优先原则要求正文保留这一读法，并以脚注说明它在上下文中的困难及“三千人”的常见理解。
