translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“却”承接前文并体现希腊语 δέ 的转折或推进作用；“一路”使分词所表达的伴随、持续行动在汉语中更自然。正文依现存希腊文本保留“三万人”，不在正文中暗自采用推定的“三千人”读法。
