revisions:
- from: 第二天，犹大一行人因事情需要，就来收殓阵亡者的遗体，把他们送回亲属那里，安葬在祖坟中。[a]
  to: 第二天，当时需要收殓阵亡者的遗体，并把他们安葬在亲属身边、归入祖传的坟墓中，犹大一行人便前来。[a]
  rationale: 修订删除“送回亲属那里”所引入的交还动作，改为与原文安葬关联相符的“安葬在亲属身边、归入祖传的坟墓中”。同时调整前半句语序，使“需要已经产生”自然地修饰犹大一行人的到来。脚注提供可行的较直译替代，并保留原文未明确的空间关系。
